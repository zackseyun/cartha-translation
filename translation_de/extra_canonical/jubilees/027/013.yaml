  text: And may God Almighty bless you and make you fruitful and multiply you, and may you become an assembly of nations.
translation:
  language: de
  text: Und Gott, der Allmächtige, segne dich, mache dich fruchtbar und mehre dich; und werde zu einer Versammlung von Völkern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላከ፡ ሰዳይ
  choice: Gott, der Allmächtige
  rationale: Die Wendung gibt den Gottesnamen bzw. Titel »El Schaddai« wieder. Die traditionelle und allgemein verständliche deutsche Entsprechung »Gott, der Allmächtige« bewahrt den feierlichen Segenscharakter.
- source_word: ያልህቀ
  choice: mache dich fruchtbar
  rationale: Im Zusammenhang mit dem folgenden »mehre dich« bezeichnet das Verb das Hervorbringen von Nachkommenschaft; die idiomatische deutsche Wiedergabe entspricht zugleich der zugrunde liegenden Segensformel.
- source_word: ያብዝኀከ
  choice: mehre dich
  rationale: Die Form bezeichnet zahlenmäßige Vermehrung und wird knapp sowie formnah wiedergegeben.
- source_word: መክብበ፡ አሕዛብ
  choice: eine Versammlung von Völkern
  rationale: »Versammlung« wahrt den kollektiven Sinn, während der Plural »Völker« die Mehrzahl des Ausgangstextes erhält und keine stärker institutionelle Bedeutung hineinträgt.
theological_decisions:
- issue: Wiedergabe von El Schaddai
  choice: Gott, der Allmächtige
  alternative: Gott Schaddai
  rationale: Die übersetzte Form ist im modernen Deutschen verständlich und traditionsnah, ohne eine besondere Deutung des Namens über den überlieferten Titel hinaus einzuführen.
- issue: Modalität der abschließenden Segensbitte
  choice: und du sollst zu einer Versammlung von Völkern werden
  alternative: und mögest du zu einer Versammlung von Völkern werden
  rationale: Der Ausgangstext wechselt zur Imperativform »sei/werde«. Im Kontext des Segens drückt »sollst ... werden« diese wirksame Zusage bzw. Aufforderung natürlicher aus, ohne sie ausschließlich als Wunsch oder als sichere Vorhersage festzulegen.
translation_notes:
  register: Feierliche, aber gegenwärtige Standardsprache. Die koordinierte Segensformel bleibt eng am ge'ezischen Satzbau; das Semikolon macht den Wechsel von den Segensbitten zur abschließenden Bestimmung im Deutschen lesbar.
