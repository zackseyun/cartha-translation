lexical_decisions:
- source_word: ወፈነዎ፡ ይስሐቅ፡ ለያዕቆብ
  choice: Und Isaak ließ Jakob ziehen
  rationale: Das Verb kann ein Wegsenden bzw. Entlassen bezeichnen. „Ließ … ziehen“ gibt den Vorgang natürlich und ohne unnötig harten Unterton wieder.
- source_word: መስጶጦሚያ
  choice: Mesopotamien
  rationale: Die überlieferte geografische Bezeichnung wird in ihrer geläufigen deutschen Form wiedergegeben.
- source_word: ላባ፡ ወልደ፡ ባቱኤል፡ ሶርያዊ
  choice: Laban, dem Sohn Betuëls, des Syrers
  rationale: Bewahrt die genealogische Zuordnung und die ausdrückliche Bezeichnung Betuëls als Syrer.
- source_word: እኁሃ፡ ለርብቃ፡ እሙ፡ ለያዕቆብ
  choice: dem Bruder Rebekkas, der Mutter Jakobs
  rationale: Die Genitivbeziehungen werden ausdrücklich wiedergegeben; insbesondere nennt der Ausgangstext Jakob am Versende explizit.
