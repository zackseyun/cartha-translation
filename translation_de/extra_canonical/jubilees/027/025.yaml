  yaml_path: translation/extra_canonical/jubilees/027/025.yaml
  text: And he spoke with Jacob and said, “I am the Lord, the God of Abraham your father and the God of Isaac. The land on which you are lying asleep I will give to you and to your seed after you.”
translation:
  language: de
  text: 'Und er sprach mit Jakob und sagte: „Ich bin der Herr, der Gott deines Vaters Abraham und der Gott Isaaks. Das Land, auf dem du schlafend liegst, werde ich dir und deinen Nachkommen nach dir geben.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እግዚአብሔር
  choice: der HERR
  rationale: Die übliche würdevolle Wiedergabe der Gottesbezeichnung im Deutschen; sie entspricht hier auch der erkennbaren Anlehnung an Genesis 28,13.
- source_word: ትነውም
  choice: du schläfst
  rationale: Gibt den Zustand des liegenden Schlafens idiomatisch und ohne unnötige Erweiterung wieder.
- source_word: ዘርእከ
  choice: deinen Nachkommen
  rationale: Das Kollektivwort bedeutet wörtlich „dein Same“; „deine Nachkommen“ ist im heutigen Deutsch natürlich und bewahrt den kollektiven Sinn.
- source_word: እምድኅሬከ
  choice: nach dir
  rationale: Die zeitlich-genealogische Wendung wird ausdrücklich beibehalten, obwohl sie im Deutschen teilweise redundant wirkt.
theological_decisions:
- issue: Zuordnung Abrahams als Vater Jakobs
  choice: deines Vaters Abraham
  alternative: Abraham, deines Vorfahren
  rationale: Der Quelltext nennt Abraham ausdrücklich „deinen Vater“. Die patriarchale Verwandtschaftssprache wird nicht modernisierend abgeschwächt.
- issue: Verheißung an den „Samen“
  choice: dir und deinen Nachkommen nach dir
  alternative: dir und deinem Samen nach dir
  rationale: Die kollektive Offenheit bleibt durch „Nachkommen“ erhalten, ohne durch das im Deutschen missverständliche „Samen“ eine bestimmte theologische Deutung aufzudrängen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Orientierung an der ge’ezischen Satzstruktur. Die Wiederholung „der Gott ... und der Gott ...“ sowie „nach dir“ bleibt zur Wahrung des Quellenprofils erhalten.
