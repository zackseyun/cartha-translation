  text: And Jacob prayed a prayer to the Lord, saying, “If the Lord is with me and keeps me on this road on which I am going, and gives me bread to eat and clothing to wear,
translation:
  language: de
  text: 'Und Jakob betete zum Herrn und sprach: „Wenn der Herr mit mir ist und mich auf diesem Weg, den ich gehe, behütet und mir Brot zu essen und Kleidung zum Anziehen gibt,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸሎተ
  choice: betete
  rationale: Die figura etymologica ‚betete ein Gebet‘ ist im Deutschen schwerfällig; das natürliche Verb gibt den Sinn vollständig wieder.
- source_word: እግዚአብሔር
  choice: der Herr
  rationale: Entspricht der üblichen würdigen Wiedergabe der Gottesbezeichnung im Kontext.
- source_word: ዐቀበኒ
  choice: mich … behütet
  rationale: Gibt den Sinn von bewahren, beschützen oder auf jemanden achtgeben in natürlichem biblischem Deutsch wieder.
- source_word: ፍኖት
  choice: Weg
  rationale: Die konkrete Bedeutung ‚Weg‘ passt zur Reise Jakobs.
- source_word: ኅብስተ
  choice: Brot
  rationale: Bewahrt das konkrete Grundnahrungsmittel der Vorlage, statt es zu ‚Nahrung‘ zu verallgemeinern.
- source_word: ልብሰ
  choice: Kleidung
  rationale: Eine natürliche kollektive Wiedergabe für das zum Anziehen Gegebene.
theological_decisions:
- issue: Bedingungsform von Jakobs Gebet
  choice: „Wenn der Herr mit mir ist …“
  alternative: „Falls der Herr mit mir sein wird …“
  rationale: Die offene Bedingungsform der Vorlage bleibt erhalten; sie wird weder als Zweifel noch als feste Gewissheit ausgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Klang. Die Satzstruktur bleibt wegen der Fortsetzung des Verses offen; das abschließende Komma entspricht dem unvollständigen Bedingungssatz.
