  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die ge’ezische Syntax und den Sinn zuverlässig wieder: Der Plural von በረከታቲሁ ist mit „Segnungen“ erhalten; „meines Vaters Abraham“, die Nachkommenformel, das Land der Fremdlingschaft, der Erbempfang sowie die abschließende Friedensformel entsprechen dem Text. Die mit „und“ koordinierte doppelte Landbezeichnung bleibt, ohne ihr Verhältnis auszudeuten.'
  naturalness: Modernes, würdiges und gut lesbares Standarddeutsch. „Das Land, in dem du als Fremder lebst“ ist eine verständliche, idiomatische Entfaltung von „Land deiner Fremdlingschaft“. „Geh hin, mein Sohn, in Frieden“ trägt den feierlichen Abschiedscharakter angemessen.
  terminology: „Segnungen“ ist trotz seiner etwas gehobenen Prägung sachgerecht, da der Quelltext ausdrücklich den Plural hat. „Nachkommen“ und „als Erbe erhältst“ sind natürliche und semantisch genaue Wiedergaben. Gottesname, Abraham und die Anrede „mein Sohn“ sind korrekt.
  issues: []
