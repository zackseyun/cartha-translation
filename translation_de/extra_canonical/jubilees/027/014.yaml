  yaml_path: translation/extra_canonical/jubilees/027/014.yaml
  text: And may he give to you the blessings of my father Abraham, to you and to your seed after you, so that you may inherit the land of your sojourning and all the land that God gave to Abraham. Go, my son, in peace.”
translation:
  language: de
  text: Und er gebe dir die Segnungen meines Vaters Abraham, dir und deinen Nachkommen nach dir, damit du das Land, in dem du als Fremder lebst, und das ganze Land, das Gott Abraham gegeben hat, als Erbe erhältst. Geh hin, mein Sohn, in Frieden!“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በረከታቲሁ
  choice: die Segnungen
  rationale: Die ge’ezische Form ist pluralisch und wird daher nicht nach dem Singular der Parallele in Genesis eingeebnet.
- source_word: ለዘርእከ
  choice: deinen Nachkommen
  rationale: Das kollektiv gebrauchte »Same/Nachkommenschaft« wird im modernen Deutschen natürlich als »Nachkommen« wiedergegeben.
- source_word: ምድረ፡ ፍልሰትከ
  choice: das Land, in dem du als Fremder lebst
  rationale: Gibt das Land des vorübergehenden bzw. fremden Aufenthalts verständlich wieder, ohne bereits dauernden Besitz vorauszusetzen.
- source_word: ትረሰ
  choice: als Erbe erhältst
  rationale: Bewahrt den Erb- und Besitzantrittssinn des Verbs in idiomatischem Deutsch.
- source_word: በሰላም
  choice: in Frieden
  rationale: Die traditionelle und kontextgemäße Wiedergabe der Abschiedsformel bewahrt ihren umfassenden Friedenssinn.
theological_decisions:
- issue: Zahl der Abraham zugesprochenen Segnungen
  choice: 'Plural: »die Segnungen«'
  alternative: 'Singular: »den Segen«'
  rationale: Der Plural des ge’ezischen Textes ist trotz des Singulars in der Genesis-Parallele als eigenständige Lesart zu erhalten.
- issue: Verhältnis von Fremdlingsland und dem Abraham gegebenen Land
  choice: Beide durch »und« verbundene Landbezeichnungen bleiben stehen
  alternative: Die zweite Wendung als erläuternde Gleichsetzung der ersten formulieren
  rationale: Der Quelltext lässt offen, ob die Ausdrücke deckungsgleich sind oder unterschiedliche Reichweiten haben; die Übersetzung löst diese Spannung nicht auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt feierlich, aber gut verständlich; »Geh hin« trägt den Abschiedscharakter stärker als ein bloßes »Geh«.
