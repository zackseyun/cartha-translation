  text: And Jacob rose early in the morning and took the stone that he had placed by his head, and he set it up as a pillar for a sign, and he poured oil on its top. And he called the name of that place Bethel, though formerly the name of that region was Luz.
translation:
  language: de
  text: Und Jakob stand früh am Morgen auf, nahm den Stein, den er an sein Kopfende gelegt hatte, richtete ihn als Säule zu einem Zeichen auf und goss Öl auf seine Spitze. Er nannte jenen Ort Bet-El; zuvor aber hatte jenes Gebiet Lus geheißen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በነግህ
  choice: früh am Morgen
  rationale: Gibt die Zeitangabe natürlich und genau wieder.
- source_word: ኀበ፡ ርእሱ
  choice: an sein Kopfende
  rationale: Bewahrt den örtlichen Bezug zum Kopf, ohne irreführend zu sagen, der Stein habe unmittelbar neben seinem Kopf gelegen.
- source_word: ሐውልተ
  choice: Gedenkstein
  rationale: Bezeichnet einen aufgerichteten Stein als Denk- oder Erinnerungsmal im natürlichen modernen Deutsch.
- source_word: ለትእምርት
  choice: zum Zeichen
  rationale: Gibt die Zweckbestimmung des aufgerichteten Steins formal nah wieder.
- source_word: ዲበ፡ ርእሱ
  choice: auf seine Spitze
  rationale: Der Ausdruck bezeichnet wörtlich den Kopf beziehungsweise oberen Teil des Steins.
- source_word: ቤቴል
  choice: Bet-El
  rationale: Die Bindestrichschreibung macht die überlieferte Namensform und ihre Bestandteile im Deutschen gut erkennbar.
- source_word: ብሔር
  choice: Gebiet
  rationale: Der Kontext verlangt eine räumliche Bezeichnung; „Gebiet“ wahrt den Unterschied zum unmittelbar zuvor genannten Ort.
theological_decisions:
- issue: Funktion des aufgerichteten Steins
  choice: als Gedenkstein zum Zeichen
  alternative: als Säule für ein Zeichen
  rationale: Die Formulierung bewahrt die Zeichenfunktion, ohne dem Stein eine weitergehende kultische Bedeutung zuzuschreiben.
- issue: Verhältnis der Ortsnamen Bet-El und Lus
  choice: Bet-El für den Ort, Lus für das Gebiet
  alternative: beide Namen für denselben Ort
  rationale: Folgt der unterschiedlichen Wortwahl des ge'ezischen Textes und glättet die geografische Spannung nicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht biblischem Erzählton. Die Satzstruktur bleibt quellennah, wird aber für heutige Leser flüssig formuliert.
