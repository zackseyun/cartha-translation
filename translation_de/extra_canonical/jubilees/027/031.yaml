  text: and I return to my father’s house in peace, then the Lord will be my God, and this stone that I have set up as a pillar for a sign in this place will be the house of the Lord. And of everything that you give me, I will surely give a tenth to you, my God.”
translation:
  language: de
  text: und ich in Frieden in das Haus meines Vaters zurückkehre, dann wird der HERR mein Gott sein. Und dieser Stein, den ich als Steinmal zum Zeichen aufgerichtet habe, wird an diesem Ort ein Haus des HERRN sein. Und von allem, was du mir gibst, werde ich dir, meinem Gott, gewiss den zehnten Teil geben.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አትመየጥ
  choice: zurückkehre
  rationale: Das Verb bezeichnet die Rückkehr; die Form steht im fortlaufenden Bedingungssatz von Jakobs Gelübde.
- source_word: በሰላም
  choice: in Frieden
  rationale: Bewahrt die konkrete und zugleich umfassende Bedeutung von unversehrter, friedlicher Heimkehr.
- source_word: ሐውልተ፡ ለትእምርት
  choice: als Gedenkstein zum Zeichen
  rationale: Gibt sowohl die Funktion eines aufgerichteten Steinmals als auch den ausdrücklich genannten Zeichencharakter wieder.
- source_word: ቤተ፡ እግዚአብሔር
  choice: ein Haus des HERRN
  rationale: Die unbestimmte Wiedergabe ist im Deutschen natürlich und vermeidet eine unnötige Identifikation mit einem bereits bestehenden Heiligtum.
- source_word: አሡር፡ ለከ
  choice: werde ich dir … gewiss den zehnten Teil geben
  rationale: Gibt die emphatische Zusage des Verzehntens idiomatisch wieder.
theological_decisions:
- issue: Bedingte Formulierung »dann wird der HERR mein Gott sein«
  choice: Die konditionale Spannung bleibt ausdrücklich stehen.
  alternative: »so soll der HERR sich als mein Gott erweisen« oder eine rückblickend bekenntnishafte Umformulierung
  rationale: Der überlieferte Wortlaut formuliert Jakobs Gelübde als Bedingungsgefüge. Eine Glättung würde die mögliche theologische Spannung zwischen Vertrauen, Gelübde und Bedingtheit auflösen.
- issue: Der Stein als Haus des HERRN
  choice: Die direkte Identitätsaussage bleibt erhalten.
  alternative: »an diesem Ort soll ein Haus des HERRN entstehen«
  rationale: Der Text bezeichnet den aufgerichteten Stein selbst als künftiges Haus des HERRN; eine bauliche Ausdeutung wäre interpretierend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzanfang bleibt klein geschrieben, weil der Vers syntaktisch den vorausgehenden Bedingungssatz fortsetzt. »HERR« folgt der üblichen deutschen Wiedergabe des Gottesnamens im überlieferten Textzusammenhang.
