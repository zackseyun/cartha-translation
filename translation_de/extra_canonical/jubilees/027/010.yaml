  text: And if Jacob takes a wife from among the daughters of the land like these, why should I still live? For the daughters of Canaan are evil.”
translation:
  language: de
  text: Und wenn Jakob eine Frau von den Töchtern des Landes nimmt, eine wie diese – wozu soll ich dann noch leben? Denn die Töchter Kanaans sind böse.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነሥአ
  choice: nimmt
  rationale: Das Verb bedeutet hier im Zusammenhang der Eheschließung »(zur Frau) nehmen«; die natürliche deutsche Wendung bewahrt dieses Bild.
- source_word: እምውስተ፡ አዋልደ፡ ምድር
  choice: von den Töchtern des Landes
  rationale: Die räumlich-partitive Ausgangsformulierung wird idiomatisch wiedergegeben, ohne den Bezug auf die einheimischen Frauen zu verengen.
- source_word: እለ፡ ከመ፡ እሉ
  choice: eine wie diese
  rationale: Der Ausdruck verweist vergleichend auf die zuvor genannten Frauen; die knappe deutsche Form erhält diesen Rückverweis.
- source_word: ለምንት፡ ሊተ፡ እንከ፡ አሐዩ
  choice: wozu soll ich dann noch leben?
  rationale: Die rhetorische Frage wird in natürlichem Deutsch formuliert; »dann noch« gibt die folgernde und fortdauernde Nuance wieder.
- source_word: እኩያት
  choice: böse
  rationale: Die grundlegende moralische Wertung wird direkt bewahrt und nicht zu »schlecht« abgeschwächt oder näher ausgedeutet.
theological_decisions:
- issue: Umfang der moralischen Aussage über die Töchter Kanaans
  choice: Die pauschale Formulierung des Ausgangstextes bleibt stehen.
  alternative: Die Aussage auf einzelne zuvor erwähnte Frauen beschränken.
  rationale: Der Text selbst nennt allgemein die Töchter Kanaans; eine einschränkende Deutung würde eine nicht ausdrücklich markierte Präzisierung eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte und emotional zugespitzte Klage bleibt erhalten; der Satzbau wurde nur so weit geglättet, wie es für natürliche deutsche Lesbarkeit nötig ist.
