  yaml_path: translation/extra_canonical/jubilees/027/022.yaml
  text: And Jacob went out from the Well of the Oath to go to Haran in the first year of the second week of the forty-fourth jubilee. And he came to Luz, which is in the mountains, that is, Bethel, on the new moon of the first month of this week. And he came to a certain place at evening, and he turned aside from his road to the west of the road that night, and he slept there, because the sun had set.
translation:
  language: de
  text: Jakob zog vom Brunnen des Schwurs aus, um nach Haran zu gehen, und zwar im ersten Jahr der zweiten Jahrwoche des vierundvierzigsten Jubiläums. Er kam nach Lus, das im Bergland liegt, das heißt Bethel, am Neumond des ersten Monats dieser Jahrwoche. Gegen Abend kam er an einen Ort. In jener Nacht bog er von seinem Weg ab, westlich des Weges,[a] und schlief dort, denn die Sonne war untergegangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die ge’ezische Syntax dieser Richtungsangabe ist schwierig. Wörtlich etwa: »… er wich von seinem Weg ab, westlich des Weges«. Möglich ist auch die kürzere Wiedergabe: »In jener Nacht bog er von seinem Weg ab.«'
    reason: Die Hauptfassung bewahrt sowohl das Possessivsuffix bei „seinem Weg“ als auch die im überlieferten Text stehende westliche Lageangabe, ohne eine übermäßig glättende Interpretation festzulegen.
lexical_decisions:
- source_word: ዐዘቆተ፡ መሐላ
  choice: Brunnen des Schwurs
  rationale: Gibt die ge’ezische Ortsbezeichnung transparent und in natürlichem Deutsch wieder; sie entspricht der traditionellen Bedeutung von Beerscheba.
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Bezeichnet hier eine kalendarische Siebenerperiode von Jahren; „Jahrwoche“ ist präziser als das bloße „Woche“.
- source_word: በሠርቀ፡ ወርኅ
  choice: am Neumond
  rationale: Die Wendung bezeichnet den Monatsbeginn beziehungsweise den Neumondstag; „am Neumond“ bewahrt die antike kalendarische Ausdrucksweise.
- source_word: መካነ፡ መሴየ
  choice: gegen Abend … an einen bestimmten Ort
  rationale: Bewahrt sowohl die abendliche Zeitangabe als auch den unbestimmten Charakter des Ortes in idiomatischem Deutsch.
- source_word: እምፍኖቱ፡ እንተ፡ ዐረበን፡ ለመንገደ
  choice: von seinem Weg auf die Westseite der Straße
  rationale: Berücksichtigt das Possessivsuffix in „seinem Weg“ und lässt die ausdrücklich westliche Richtungs- beziehungsweise Lageangabe nicht aus.
