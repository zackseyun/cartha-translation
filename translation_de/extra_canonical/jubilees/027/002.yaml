  text: And now, my son, listen to my voice. Rise and flee to Laban my brother, to Haran, and stay with him a few days, until your brother’s anger turns away,
translation:
  language: de
  text: Und nun, mein Sohn, hör auf meine Stimme! Steh auf und flieh zu meinem Bruder Laban nach Haran. Bleib einige Tage bei ihm, bis der Zorn deines Bruders sich gelegt hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስማዕ፡ ቃለየ፡
  choice: hör auf meine Stimme
  rationale: Die Wendung wird formal nah wiedergegeben und bedeutet im Zusammenhang nicht nur akustisches Hören, sondern das Befolgen der Aufforderung.
- source_word: ወተንሥእ፡ ወጐየይ፡
  choice: Steh auf und flieh
  rationale: Bewahrt die zwei aufeinanderfolgenden Imperative und gibt die eilige Flucht natürlich und prägnant wieder.
- source_word: ኀበ፡ ላባ፡ እኁየ፡ ሐራንሃ፡
  choice: zu meinem Bruder Laban nach Haran
  rationale: Gibt Zielperson und Zielort in natürlicher deutscher Wortstellung wieder, ohne die Beziehung zwischen Laban und der Sprecherin zu verändern.
- source_word: ኅዳጠ፡ መዋዕለ፡
  choice: einige Tage
  rationale: Entspricht der unbestimmten kurzen Zeitspanne des geezischen Ausdrucks.
- source_word: እስከ፡ ይትመየጥ፡ መዐተ፡ እኁከ፡
  choice: bis der Zorn deines Bruders sich gelegt hat
  rationale: Idiomatiche deutsche Wiedergabe des Nachlassens beziehungsweise Abwendens des Zorns; sie lässt offen, wodurch dies geschieht.
