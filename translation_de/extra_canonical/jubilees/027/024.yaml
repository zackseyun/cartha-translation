  text: And he dreamed that night, and behold, a ladder was set on the earth, and its top reached to heaven. And behold, the angels of God were going up and coming down on it, and behold, God stood upon it.
translation:
  language: de
  text: 'Und in jener Nacht träumte er: Siehe, eine Leiter war auf der Erde aufgestellt, und ihre Spitze reichte bis in den Himmel. Und siehe, die Engel Gottes stiegen auf ihr hinauf und herab, und siehe, Gott stand auf ihr.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: über ihr.'
    reason: Bewahrt die mögliche räumliche Deutung der abschließenden Ortsangabe, während der Haupttext dem ge'ezischen Wortlaut „auf ihr“ enger folgt.
lexical_decisions:
- source_word: መዓርግ
  choice: Leiter
  rationale: Bezeichnet hier das zwischen Erde und Himmel aufragende Aufstiegsmittel; „Leiter“ gibt das Traumbild natürlich und traditionsnah wieder.
- source_word: ትክልት፡ ውስተ፡ ምድር
  choice: war auf der Erde aufgestellt
  rationale: Bewahrt den Zustand einer fest gesetzten bzw. aufgerichteten Leiter, ohne das Bild unnötig als Einpflanzen zu konkretisieren.
- source_word: ርእሳ፡ ትበጽፍ፡ ውስተ፡ ሰማይ
  choice: ihre Spitze reichte bis in den Himmel
  rationale: „Spitze“ ist im Deutschen für den oberen Abschluss einer Leiter idiomatischer als das wörtliche „Kopf“; „bis in den Himmel“ erhält die räumliche Aussage.
- source_word: የዐርጉ፡ ወይወርዱ፡ ባቲ
  choice: stiegen auf ihr hinauf und herab
  rationale: Gibt die beiden gerichteten Bewegungsverben und den Bezug auf die Leiter knapp und natürlich wieder.
- source_word: ውስቴታ
  choice: auf ihr
  rationale: Die Form kann örtlich „in/auf ihr“ bezeichnen. „Auf ihr“ folgt der konkreten Präposition des ge'ezischen Textes enger als eine ausschließliche Wiedergabe mit „über ihr“.
theological_decisions:
- issue: Wiedergabe von እግዚአብሔር
  choice: Gott
  alternative: der Herr
  rationale: Im Ausdruck „Engel Gottes“ sowie bei der abschließenden Gottesbezeichnung entspricht „Gott“ dem unmittelbaren Kontext und vermeidet einen unbegründeten Wechsel des Titels innerhalb des Verses.
- issue: Standort Gottes im Verhältnis zur Leiter
  choice: Gott stand auf ihr
  alternative: Gott stand über ihr
  rationale: Der Haupttext folgt dem konkreten örtlichen Sinn von ውስቴታ. Da das Traumbild auch räumlich als „über ihr“ verstanden werden kann, bleibt diese Möglichkeit in der Fußnote sichtbar, ohne sie in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das dreifache ወናሁ wird bewusst mit „Und siehe“ wiedergegeben, um Rhythmus und visionären Charakter des Berichts zu erhalten.
