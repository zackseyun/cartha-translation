  source_fidelity: 'Der Entwurf gibt die geezische Abfolge und den Inhalt zuverlässig wieder: Rebekka erfährt im Traum von der Sache ihres älteren Sohnes Esau; sie lässt Jakob, ihren jüngeren Sohn, rufen; Esau hegt Groll mit tödlicher Absicht. »hegt einen Groll gegen dich« trifft ይትቄየመከ angemessen und vermeidet die unbegründete Rückübertragung des hebräischen Idioms aus Gen 27,42. »will dich töten« ist eine natürliche Wiedergabe der finalen Tötungsabsicht.'
  naturalness: »Rebekka wurde ... von der Sache Esaus ... berichtet« ist zwar verständlich, aber im Deutschen stilistisch holprig, weil die unpersönliche Passivkonstruktion mit »berichten« hier nicht idiomatisch ist. »Rebekka wurde ... die Sache ... mitgeteilt« ist klarer und modernes Standarddeutsch. Auch »sandte hin« lässt sich ohne Bedeutungsverlust natürlicher als »schickte nach« formulieren.
  terminology: Die Namen Rebekka, Esau und Jakob sowie die Verwandtschaftsbezeichnungen sind korrekt. »Sache« bewahrt die Offenheit von ነገሩ und legt weder ausdrücklich gesprochene Worte noch ein bereits näher bestimmtes Vorhaben fest. Ein textkritischer oder lexikalischer Fußnotenanker ist nicht erforderlich.
