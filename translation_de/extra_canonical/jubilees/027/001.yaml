  yaml_path: translation/extra_canonical/jubilees/027/001.yaml
  text: And the matter of Esau her older son was told to Rebekah in a dream. And Rebekah sent and called Jacob her younger son and said to him, “Look, Esau your brother is bearing a grudge against you, to kill you.”
translation:
  language: de
  text: 'Und Rebekka wurde in einem Traum die Sache ihres älteren Sohnes Esau mitgeteilt. Da schickte Rebekka nach Jakob, ihrem jüngeren Sohn, und ließ ihn rufen. Sie sagte zu ihm: »Sieh, dein Bruder Esau hegt einen Groll gegen dich und will dich töten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነገሩ
  choice: die Sache
  rationale: Das nominale Gefüge bezeichnet hier eher die Angelegenheit beziehungsweise das Vorhaben Esaus als ausdrücklich seine gesprochenen Worte.
- source_word: ይትቄየመከ
  choice: hegt einen Groll gegen dich
  rationale: Das geezische Verb bezeichnet das Nachtragen beziehungsweise Hegen eines Grolls; dies folgt dem vorliegenden Ge'ez und vermeidet eine Rückübersetzung des hebräischen Idioms als »tröstet sich deinetwegen«.
- source_word: ከመ፡ ይቅትልከ
  choice: und will dich töten
  rationale: Gibt die auf Tötung gerichtete Absicht in natürlichem Deutsch wieder, ohne den etwas missverständlichen deutschen Finalsatz »um dich zu töten« an »Groll hegen« anzuschließen.
- source_word: ናሁ
  choice: Sieh
  rationale: Bewahrt den aufmerksamkeitslenkenden Imperativ in würdigem, bibelnahem Standarddeutsch.
