    issue: Die Demonstrativa „dieses Ortes“ und „diesen Baum“ geben einen Nähebezug wieder.
    rationale: Der ge'ezische Text verweist jeweils auf „jenen/diesen dortigen“ Ort beziehungsweise Baum; entsprechend der englischen Audit-Fassung („that place“, „that tree“) ist im Deutschen „jenes/jenen“ die genauere Wahl.
  - severity: low
    issue: „einen von den Steinen“ ist weniger idiomatisch als nötig.
    rationale: „Einen der Steine“ ist modernes Standarddeutsch und bedeutet dasselbe.
  revised_text: Und er nahm einen der Steine jenes Ortes und legte ihn unter jenen Baum. Er war allein unterwegs[a] und schlief.
