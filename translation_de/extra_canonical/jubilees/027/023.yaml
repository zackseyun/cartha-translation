  text: And he took one of the stones of that place and put it under that tree, and he was traveling alone, and he slept.
translation:
  language: de
  text: Und er nahm einen der Steine jenes Ortes und legte ihn unter jenen Baum. Er war allein unterwegs[a] und schlief.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: ging.'
    reason: Das zugrunde liegende Verb kann sowohl allgemein das Unterwegssein beziehungsweise Reisen als auch konkret das Gehen bezeichnen.
lexical_decisions:
- source_word: የሐውር (yeḥawwer)
  choice: war … unterwegs
  rationale: Das Verb ሖረ kann »gehen«, »wandern« oder »reisen« bedeuten. »Unterwegs sein« gibt hier im Zusammenhang mit Jakobs Reise die fortdauernde Bewegung natürlich wieder, ohne die Fortbewegungsart unnötig festzulegen.
- source_word: ውእቱ መካን / ውእቱ ዕፅ
  choice: dieses Ortes / diesen Baum
  rationale: Die Demonstrativa werden ausdrücklich wiedergegeben; die Formen mit »dies-« sind in modernem Deutsch natürlich und bewahren den Verweischarakter.
- source_word: ወኖመ (wa-noma)
  choice: und schlief
  rationale: Die schlichte koordinierte Verbform wird ohne Zusatz wie »ein« wiedergegeben, da der Ausgangstext lediglich das Schlafen bezeichnet.
theological_decisions: []
translation_notes:
  register: Moderne, schlichte und würdevolle Erzählsprache. Die wiederholten Demonstrativa und die parataktische Satzfolge des ge’ezischen Textes bleiben erkennbar; die lexikalische Spannweite des Bewegungsverbs wird durch eine Fußnote offengehalten.
