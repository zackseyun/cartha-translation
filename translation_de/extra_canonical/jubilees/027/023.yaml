  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des ge''ezischen Textes im Wesentlichen zutreffend wieder: einen Stein von jenem Ort nehmen, ihn unter jenen Baum legen, allein unterwegs sein und schlafen. Die Demonstrativa sind jedoch im Entwurf mit „dies-“ als Nähebezug wiedergegeben, während der Quelltext und die englische Prüffassung einen Fernverweis („that“) nahelegen.'
  naturalness: „Er war allein unterwegs und schlief“ ist natürliches, modernes Deutsch und bewahrt die fortlaufende Handlung. „Einen von den Steinen“ ist verständlich, aber „einen der Steine“ ist idiomatischer.
  terminology: Keine theologischen oder Eigennamen betreffenden Fragen. „Unterwegs“ ist eine angemessene, nicht überpräzisierende Wiedergabe des Bewegungsverbs; die Fußnote erhält die engere Bedeutung „gehen“ offen.
  issues:
