  yaml_path: translation/extra_canonical/jubilees/027/020.yaml
  text: Do not fear for him, my sister, for he is upright in his way, and he is a blameless man, and he is faithful, and he will not be forsaken. Do not weep.
translation:
  language: de
  text: Fürchte dich nicht um ihn, meine Schwester; denn er geht auf seinem Weg rechtschaffen, er ist ein untadeliger Mann,[a] er ist treu, und er wird nicht verlassen werden. Weine nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein vollkommener Mann“.'
    reason: Das zugrunde liegende Wort kann sowohl Untadeligkeit als auch Vollständigkeit oder Vollkommenheit ausdrücken.
lexical_decisions:
- source_word: ሪትዕ
  choice: rechtschaffen
  rationale: Das Wort bezeichnet Geradheit beziehungsweise richtiges, aufrechtes Verhalten; „rechtschaffen“ gibt dies im Zusammenhang mit dem Lebensweg natürlich und würdig wieder.
- source_word: በፍኖቱ
  choice: auf seinem Weg
  rationale: Die Form steht im Singular. Die deutsche Wendung bewahrt dies und versteht den Weg bildlich als Lebensführung.
- source_word: ፍጹም
  choice: untadelig
  rationale: Das Wort kann Vollständigkeit oder Vollkommenheit bezeichnen; auf eine Person bezogen drückt „untadelig“ hier sittliche Integrität idiomatisch aus, ohne absolute Sündlosigkeit festzulegen.
- source_word: ምእመን
  choice: treu
  rationale: „Treu“ entspricht der Aussage über seine Verlässlichkeit und lässt die mögliche religiöse Färbung bestehen.
- source_word: ኢይትገደፍ
  choice: wird nicht verlassen werden
  rationale: Die passive Zukunftsaussage wird ausdrücklich wiedergegeben; dadurch bleibt auch offen, von wem er nicht verlassen wird.
theological_decisions:
- issue: Bedeutungsumfang von ፍጹም
  choice: untadeliger Mann
  alternative: vollkommener Mann
  rationale: „Untadelig“ ist im modernen Deutschen bei einer Charakterbeschreibung natürlicher und vermeidet die unbelegte Zuspitzung auf absolute Vollkommenheit; die wörtlichere Möglichkeit wird in der Fußnote bewahrt.
- issue: Unausgesprochenes Subjekt bei „wird nicht verlassen werden“
  choice: Passiv ohne Ergänzung
  alternative: Gott wird ihn nicht verlassen
  rationale: Die Quelle nennt den Handelnden nicht. Eine ausdrückliche Nennung Gottes würde eine mögliche theologische Deutung in den Text eintragen, statt die genuine Offenheit zu erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede „meine Schwester“ und die parallelen Aussagen bleiben erhalten; der Singular „Weg“ sowie die passive, nicht näher bestimmte Zusage werden quellennah wiedergegeben.
