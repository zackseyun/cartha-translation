  yaml_path: translation/extra_canonical/jubilees/001/009.yaml
  text: And this testimony will be heard as a testimony against them. For they will forget all my commandments, everything that I command them, and they will walk after the nations, and after their impurities, and after their shameful things, and they will serve their gods, and these will become for them a stumbling block, and affliction, and tribulation, and a snare.
translation:
  language: de
  text: Und dieses Zeugnis wird als Zeugnis gegen sie vernommen werden. Denn sie werden alle meine Gebote vergessen, alles, was ich ihnen gebiete, und sie werden den Völkern folgen, ihren Unreinheiten und ihren Schandtaten. Sie werden ihren Göttern dienen, und diese werden ihnen zum Stolperstein, zur Bedrängnis, zur Drangsal und zur Schlinge werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስምዕ
  choice: Zeugnis
  rationale: Das Substantiv bezeichnet hier ein Zeugnis beziehungsweise eine bezeugende Aussage; die Wiederholung im Satz wird im Deutschen durch die Verbindung „Zeugnis … Zeugnis abzulegen“ gewahrt.
- source_word: ይረስዑ
  choice: sie werden vergessen
  rationale: Gibt die futurische Aussage des Kontextes direkt und natürlich wieder.
- source_word: አሕዛብ
  choice: Völker
  rationale: Bezeichnet die fremden Völker beziehungsweise Nationen; „Völker“ bleibt neutral und quellenah.
- source_word: ርኵሶሙ
  choice: ihren Unreinheiten
  rationale: Bewahrt den kultisch-moralischen Bedeutungsumfang von Unreinheit, ohne ihn enger auszulegen.
- source_word: ኀሣሮሙ
  choice: ihren Schandtaten
  rationale: Gibt den abwertenden Sinn beschämender oder schändlicher Dinge in idiomatischem Deutsch wieder.
- source_word: ይትቀነዩ
  choice: sie werden dienen
  rationale: Im Zusammenhang mit Göttern ist „dienen“ die natürliche religiöse Entsprechung.
- source_word: ማዕቅፈ
  choice: Stolperstein
  rationale: Bezeichnet etwas, das zu Fall bringt; die konkrete Bildsprache bleibt erhalten.
- source_word: መሥገርት
  choice: Schlinge
  rationale: Bewahrt das Bild einer Falle beziehungsweise Fangschlinge.
theological_decisions:
- issue: Funktion des Zeugnisses
  choice: „um gegen sie Zeugnis abzulegen“
  alternative: „als Zeugnis gegen sie“
  rationale: Die gewählte Formulierung erhält sowohl den forensischen Sinn als auch die auffällige Wiederholung des Begriffs „Zeugnis“, ohne die Aussage konfessionell auszudeuten.
- issue: Bezugswort des abschließenden Pronomens
  choice: „diese“ bezieht sich auf die zuvor genannten Götter
  alternative: 'unpersönlich: „das wird ihnen … werden“'
  rationale: Der Pluralanschluss legt die Götter als grammatischen Bezug nahe; die Formulierung lässt offen, auf welche Weise sie zur Ursache des Unheils werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit quellenaher Satzfolge. Die Aufzählungen und die prophetische Zukunftsform sind erhalten; unnötige Archaismen wurden vermieden.
