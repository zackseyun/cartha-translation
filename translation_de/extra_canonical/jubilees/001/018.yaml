  text: And I will not abandon them, nor will I estrange myself from them, for I am the Lord their God.” And Moses fell on his face,
translation:
  language: de
  text: Und ich werde sie nicht verlassen und mich ihnen nicht entfremden; denn ich bin der Herr, ihr Gott.« Da fiel Mose auf sein Angesicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢይትናከሮሙ
  choice: mich ihnen nicht entfremden
  rationale: Bewahrt die im Verb ausgedrückte Distanzierung als eine von »verlassen« unterschiedene Aussage und folgt der erkennbaren reflexiven Bedeutung.
- source_word: እግዚአብሔር
  choice: der Herr
  rationale: Das äthiopische Wort ist hier die gewöhnliche Gottesbezeichnung »Herr«; die Schreibweise »HERR« würde eine im Ausgangstext nicht ausdrücklich markierte Wiedergabe des Gottesnamens nahelegen.
- source_word: ወወድቀ፡ ሙሴ፡ በገጹ
  choice: Da fiel Mose auf sein Angesicht
  rationale: Gibt die körperliche Gebärde quellennah und in würdigem, verständlichem Deutsch wieder; »Da« verbindet den Satz natürlich mit der vorausgehenden Gottesrede.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung
  choice: der Herr, ihr Gott
  alternative: der HERR, ihr Gott
  rationale: Die Übersetzung vermeidet es, ohne eindeutigen Anhaltspunkt im vorliegenden ge'ezischen Text den Bundesnamen typografisch einzutragen.
- issue: Gottes bleibende Nähe zu seinem Volk
  choice: nicht verlassen und mich ihnen nicht entfremden
  alternative: nicht verlassen und mich nicht von ihnen abwenden
  rationale: Die beiden parallelen, aber nicht identischen Aussagen bleiben erhalten, ohne ihre mögliche theologische Spannung durch eine vereinheitlichende Paraphrase aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit quellennaher Satzstruktur. »Auf sein Angesicht fallen« ist bewusst beibehalten, da die Wendung verständlich ist und die konkrete Gebärde genauer bewahrt als eine allgemeinere Formulierung wie »sich niederwerfen«.
