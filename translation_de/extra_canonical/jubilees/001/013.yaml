    issue: Unnatürliche Nominalbildung „Verschlungenwerden“
    rationale: Die Formulierung ist semantisch möglich, aber im modernen Deutsch deutlich weniger idiomatisch als „Gefressenwerden“. Die Änderung erhält den passiven Sinn und die drastische Aussage des ge’ezischen Begriffs beziehungsweise des englischen Audittexts „for devouring“.
