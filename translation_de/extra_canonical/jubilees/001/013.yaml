  verdict: revise
  source_fidelity: 'Der Entwurf gibt die ge’ezische Abfolge präzise wieder: Verbergen des Angesichts, Übergabe in die Hand der Völker, die dreifache Folge von Gefangenschaft, Plünderung und Verzehrtwerden sowie gewaltsames Entfernen aus dem Land und Zerstreuung unter die Völker. „aus dem Land herausreißen“ bildet die starke, von der englischen Auditspur als „uproot“ bestätigte Bedeutung von አቤስሎሙ angemessen ab. Der vorangestellte Satzrest „vor meinen Augen.“ gehört erkennbar zum vorigen Vers und darf hier stehen bleiben.'
  naturalness: „Verschlungenwerden“ ist zwar verständlich, wirkt im heutigen Standarddeutsch jedoch stark konstruiert. „Gefressenwerden“ ist die natürliche passive Wiedergabe von „devouring“ und bewahrt die drastische Bildlichkeit. Der übrige Stil ist klar, würdevoll und idiomatisch.
  terminology: „Angesicht“, „in die Hand der Völker geben“ und „unter die Völker zerstreuen“ sind etablierte, quellennah-biblische Formulierungen. „Gefangenschaft“ und „Plünderung“ entsprechen dem englischen POB-Audittext. Die Fußnote zu „herausreißen“ wahrt die landwirtschaftliche Metapher des Entwurzelns, ohne die Übersetzung unnötig zu überladen.
  issues:
