  text: before my eyes. And I will hide my face from them, and I will deliver them into the hand of the nations for captivity and for plunder and for devouring, and I will uproot them from the midst of the land, and I will scatter them among the nations.
translation:
  language: de
  text: 'vor meinen Augen. Dann werde ich mein Angesicht vor ihnen verbergen und sie in die Hand der Völker geben: zur Gefangenschaft, zur Plünderung und zum Gefressenwerden. Ich werde sie aus dem Land herausreißen[a] und sie unter die Völker zerstreuen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „entwurzeln“.'
    reason: Das ge’ezische Verb kann die starke Vorstellung des Ausrottens beziehungsweise Entwurzelns ausdrücken; die Fußnote hält die engere Bildentsprechung zugänglich.
lexical_decisions:
- source_word: አኀብእ ገጽየ
  choice: mein Angesicht vor ihnen verbergen
  rationale: Die Wendung wird formal und zugleich idiomatisch wiedergegeben; „Angesicht“ bewahrt den würdevollen biblischen Sprachklang.
- source_word: እሜጥዎሙ ውስተ እደ አሕዛብ
  choice: sie in die Hand der Völker geben
  rationale: Die ge’ezische Übergabeformel und das Bild der „Hand“ bleiben erhalten.
- source_word: ለፂዋዌ ወለኀብለ ወለተበልዖ
  choice: zur Gefangenschaft, zur Plünderung und zum Verschlungenwerden
  rationale: Die dreigliedrige Folge wird bewahrt. Das ungewöhnliche „Verschlungenwerden“ erhält die drastische Bildlichkeit des Quellbegriffs, statt sie zu „Vernichtung“ zu glätten.
- source_word: አቤስሎሙ
  choice: herausreißen
  rationale: Das Verb bezeichnet eine gewaltsame Entfernung beziehungsweise Entwurzelung. „Herausreißen“ passt zur Ergänzung „aus dem Land“ und klingt im modernen Deutschen natürlicher als eine auf Menschen bezogene Formulierung mit „entwurzeln“.
- source_word: እዘርዎሙ
  choice: sie unter die Völker zerstreuen
  rationale: Die räumliche Verteilung inmitten beziehungsweise unter den Völkern wird klar und quellennah ausgedrückt.
theological_decisions:
- issue: Bildsprache des göttlichen Verbergens
  choice: mein Angesicht vor ihnen verbergen
  alternative: mich von ihnen abwenden
  rationale: Die anthropomorphe und theologisch spannungsreiche Ausgangsmetapher wird nicht erklärend aufgelöst.
- issue: Bedeutungsstärke des Verbs አቤስሎሙ
  choice: herausreißen
  alternative: entfernen
  rationale: Die stärkere Vorstellung gewaltsamer Beseitigung wird entsprechend der Quellenlage erhalten, ohne eine weitergehende dogmatische Deutung einzutragen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem biblischem Ton. „Angesicht“ und „in die Hand geben“ bewahren etablierte Bildsprache; Satzbau und Verknüpfungen bleiben für heutige Leser verständlich.
