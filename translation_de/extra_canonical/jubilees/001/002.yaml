  yaml_path: translation/extra_canonical/jubilees/001/002.yaml
  text: On the sixteenth day of that month, Yahweh spoke to Moses, saying, “Come up to me on the mountain, and I will give you two stone tablets of the law and the commandment, which I have written, so that you may teach them.” And Moses went up onto the mountain of Yahweh, and the glory of Yahweh dwelt on Mount Sinai,
translation:
  language: de
  text: 'Am sechzehnten Tag jenes Monats sprach Jahwe zu Mose: »Steig zu mir auf den Berg. Ich werde dir zwei steinerne Tafeln mit dem Gesetz und dem Gebot geben, die ich aufgeschrieben habe, damit du sie lehrst.« Da stieg Mose auf den Berg Jahwes und blieb dort.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hier zugrunde gelegte ge’ezische Wortlaut endet mit »und er blieb«; dem Satzbau nach ist Mose gemeint. Eine längere Überlieferungsform liest stattdessen weiter: »und die Herrlichkeit Jahwes ruhte auf dem Berg Sinai«.'
    reason: Die konsultierte englische Fassung enthält eine längere Schlussklausel, deren entscheidende Wörter im bereitgestellten Originaltext fehlen. Die Fußnote dokumentiert die textliche Abweichung, ohne sie stillschweigend in den Haupttext zu übernehmen.
lexical_decisions:
- source_word: እግዚአብሔር
  choice: Jahwe
  rationale: Das Wort bezeichnet hier den Gott Israels; der Gottesname wird entsprechend der Namenspolitik ausdrücklich mit »Jahwe« wiedergegeben.
- source_word: ዕረግ፡ ኀቤየ፡ ውስተ፡ ደብር
  choice: Steig zu mir auf den Berg herauf
  rationale: Bewahrt sowohl die Aufwärtsbewegung als auch das Ziel bei Gott und klingt zugleich natürlich auf Deutsch.
- source_word: ክልኤተ፡ ጽላተ፡ እብን
  choice: zwei steinerne Tafeln
  rationale: Direkte und idiomatische Wiedergabe der Zahl, des Gegenstands und des Materials.
- source_word: ዘሕግ፡ ወዘትእዛዝ
  choice: mit dem Gesetz und dem Gebot
  rationale: Die beiden koordinierten Begriffe bleiben unterschieden; »mit« gibt ihre inhaltliche Zuordnung zu den Tafeln im Deutschen klar wieder.
- source_word: ታስብዎሙ
  choice: damit du sie lehrst
  rationale: Gibt den finalen Sinn und den pluralischen Bezug auf die niedergeschriebenen Weisungen knapp wieder.
- source_word: ወኀደረ
  choice: und blieb dort
  rationale: Das Verb bedeutet hier »bleiben/verweilen«. »Dort« ergänzt im Deutschen lediglich den bereits genannten Ort und vermeidet die unbelegte Einführung eines neuen Subjekts.
theological_decisions:
- issue: Gottesbezeichnung እግዚአብሔር
  choice: Jahwe
  alternative: der Herr / Gott
  rationale: Im Erzählzusammenhang ist der Gott Israels gemeint. Die Wiedergabe mit dem Gottesnamen folgt der vorgegebenen Namenspolitik, ohne eine zusätzliche konfessionelle Deutung einzutragen.
- issue: Subjekt des letzten Verbs
  choice: Mose blieb dort
  alternative: Die Herrlichkeit Jahwes ruhte auf dem Sinai
  rationale: Im bereitgestellten ge’ezischen Wortlaut folgt ወኀደረ unmittelbar auf Mose als weiterhin naheliegendes Subjekt; Wörter für »Herrlichkeit« und »Sinai« fehlen in diesem Textausschnitt. Deshalb wird die längere Lesart nicht in den Haupttext eingeführt.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Erzählbewegung. Die direkte Rede ist natürlich formuliert, bleibt aber eng an Aufbau und Begriffspaaren des ge’ezischen Textes. Der Vers beginnt gemäß dem vorliegenden Wortlaut mit dem sechzehnten Tag; die Schlussabweichung wird transparent in einer Fußnote ausgewiesen.
