  yaml_path: translation/extra_canonical/jubilees/001/004.yaml
  text: And on the seventh day he called to Moses from the midst of the cloud, and the appearance of the glory of Yahweh was like a burning fire on the top of the mountain. And Moses was on the mountain forty days and forty nights.
translation:
  language: de
  text: Und am siebten Tag rief er Mose aus der Mitte der Wolke zu. Die Erscheinung der Herrlichkeit Jahwes war wie ein loderndes Feuer auf dem Gipfel des Berges.[a] Und Mose war vierzig Tage und vierzig Nächte auf dem Berg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Die Herrlichkeit Jahwes erschien wie ein loderndes Feuer.'
    reason: Die Formulierung kann statt als nominale Aussage über die „Erscheinung“ auch verbal als „erschien“ verstanden werden.
lexical_decisions:
- source_word: ርእዩ፡ ስብሐተ፡ እግዚአብሔር
  choice: das Aussehen der Herrlichkeit Jahwes
  rationale: Bewahrt die substantivische, theophanische Formulierung der Vorlage und vermeidet, sie ohne Not in das Verb „erschien“ umzudeuten.
- source_word: እሳት፡ ዘያነድድ
  choice: loderndes Feuer
  rationale: Gibt das Bild eines brennenden, verzehrenden Feuers natürlich und würdevoll wieder.
- source_word: ውስተ፡ ርእሰ፡ ደብር
  choice: auf dem Gipfel des Berges
  rationale: „Gipfel“ entspricht dem wörtlichen Bild vom „Haupt“ des Berges und klingt im Deutschen natürlich.
theological_decisions:
- issue: Wiedergabe des Gottesnamens
  choice: Jahwe
  alternative: der HERR
  rationale: Der Eigenname wird als solcher erkennbar wiedergegeben, ohne ihn durch einen Titel zu ersetzen.
- issue: Sichtbarwerden der göttlichen Herrlichkeit
  choice: Das Aussehen der Herrlichkeit Jahwes war wie
  alternative: Die Herrlichkeit Jahwes erschien wie
  rationale: Die Hauptfassung bewahrt die nominale Aussage und lässt offen, wie das Verhältnis zwischen Herrlichkeit und sichtbarer Erscheinung genau zu verstehen ist; die geläufige verbale Deutung steht in der Fußnote.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die Satzfolge bleibt nah an der knappen Struktur der Vorlage; „Jahwe“ gibt den Gottesnamen ausdrücklich wieder.
