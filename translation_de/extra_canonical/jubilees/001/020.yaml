  source_fidelity: 'Der Entwurf gibt die Abfolge der Bitte zuverlässig wieder: Schaffung eines rechten Geistes, Abwehr der Herrschaft des Geistes Beliars, dessen Anklage und Abbringen vom Weg der Gerechtigkeit sowie das abschließende Exodus-Motiv. „Aus der Hand Ägyptens“ bewahrt das Bild des ge’ezischen Textes. Der Relativsatz „den du ... befreit hast“ bezieht sich jedoch grammatisch allein auf „Erbbesitz“, während der Quelltext und die englische Prüffassung die Menschen, Gottes Volk, als die Befreiten meinen.'
