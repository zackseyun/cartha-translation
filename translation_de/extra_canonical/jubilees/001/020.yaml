  terminology: „aufrichtiger Geist“, „Geist Beliars“, „Weg der Gerechtigkeit“, „Erbbesitz“ und „vor deinem Angesicht“ sind tragfähige, registergerechte Wiedergaben. Die Form Beliar entspricht sowohl der Vorlage als auch dem englischen Audit Trail.
