base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/020.yaml
  text: And create for them an upright spirit, and do not let the spirit of Beliar rule over them to accuse them before you and to turn them away from every path of righteousness, so that they perish from before your face. Yet they are your people and your inheritance, whom you delivered by your great power from the hand of Egypt. Create for them
translation:
  language: de
  text: Und erschaffe ihnen einen aufrichtigen Geist, und lass den Geist Beliars nicht über sie herrschen, sodass er sie vor dir anklagt und sie von jedem Weg der Gerechtigkeit abbringt, damit sie vor deinem Angesicht zugrunde gehen. Doch sie sind dein Volk und dein Erbbesitz, die du durch deine große Macht aus der Hand Ägyptens befreit hast. Erschaffe ihnen …
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መንፈሰ፡ ርቱዐ
  choice: einen aufrichtigen Geist
  rationale: Gibt die Verbindung aus „Geist“ und „aufrichtig/recht“ eng und zugleich idiomatisch wieder.
- source_word: መንፈሰ፡ ቤልሖር
  choice: der Geist Beliars
  rationale: Bewahrt den Eigennamen der verderblichen Gestalt in einer im Deutschen etablierten Form und übersetzt መንፈስ wörtlich als „Geist“.
- source_word: ወኢይኰንንዎሙ
  choice: lass … nicht über sie herrschen
  rationale: Der Kontext verlangt eine negative Bitte; „über sie herrschen“ gibt die im Verb liegende Herrschaft bzw. Gewalt natürlich wieder.
- source_word: ለአስተዋድዮቶሙ፡ ቅድሜከ
  choice: sodass er sie vor dir anklagt
  rationale: Gibt die gerichtliche beziehungsweise anklagende Tätigkeit vor Gott wieder, ohne ihren theologischen Sinn weiter festzulegen.
- source_word: ለአዕቅጾቶሙ፡ እምኵሉ፡ ፍኖተ፡ ጽድቅ
  choice: und sie von jedem Weg der Gerechtigkeit abbringt
  rationale: Die Präposition „von“ und der Zusammenhang sprechen für ein Abwenden bzw. Abbringen von gerechten Wegen.
- source_word: ርስትከ
  choice: dein Erbbesitz
  rationale: „Erbbesitz“ bewahrt den Bundes- und Eigentumscharakter des Ausdrucks deutlicher als das abstraktere „Erbe“.
- source_word: ዘባላህከ
  choice: den du … befreit hast
  rationale: Im Exoduszusammenhang ist „befreit“ natürlich und gibt die Rettung aus der Gewalt Ägyptens treffend wieder.
- source_word: እምእዴ፡ ግብጽ
  choice: aus der Hand Ägyptens
  rationale: Bewahrt das konkrete semitische Herrschaftsbild „aus der Hand“, statt es zu „aus der Macht“ zu glätten.
theological_decisions:
- issue: Kausal- oder Finalbezug von „damit sie … zugrunde gehen“
  choice: damit sie vor deinem Angesicht zugrunde gehen
  alternative: sodass sie vor deinem Angesicht zugrunde gehen
  rationale: Die formal finale Formulierung wird bewahrt, obwohl inhaltlich die verderbliche Folge der Herrschaft Beliars gemeint sein kann. Die Spannung des Ausgangstextes wird nicht stillschweigend aufgelöst.
- issue: Personifikation des Geistes Beliars
  choice: „er“ als Rückbezug auf den Geist
  alternative: unpersönliche Umschreibung ohne Pronomen
  rationale: Anklagen und Abbringen sind personale Handlungen; das maskuline Pronomen schafft im Deutschen einen klaren Rückbezug, ohne über die ontologische Identität des Geistes zu entscheiden.
- issue: Numerus und Bezug von „Erbbesitz“
  choice: 'Singular: „den du … befreit hast“'
  alternative: 'Pluralischer Bezug auf „Volk“: „die du … befreit hast“'
  rationale: Der relative Anschluss an den unmittelbar vorausgehenden maskulinen Singular „Erbbesitz“ ist grammatisch klar; sachlich bezeichnet er weiterhin das Volk.
translation_notes:
  register: Dignitatives, modernes Standarddeutsch mit bibelsprachlich angemessenen Wendungen wie „vor deinem Angesicht“, „Weg der Gerechtigkeit“ und „aus der Hand Ägyptens“. Der abschließende unvollständige Satz wird gemäß dem vorliegenden Verssegment mit Auslassungspunkten kenntlich gemacht.
