  to: Und erschaffe ihnen einen aufrichtigen Geist, und lass den Geist Beliars nicht über sie herrschen, sodass er sie vor dir anklagt und sie von jedem Weg der Gerechtigkeit abbringt, damit sie vor deinem Angesicht zugrunde gehen. Doch sie sind dein Volk und dein Erbbesitz, die du durch deine große Macht aus der Hand Ägyptens befreit hast. Erschaffe ihnen …
