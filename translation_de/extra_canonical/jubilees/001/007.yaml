  yaml_path: translation/extra_canonical/jubilees/001/007.yaml
  text: and they will know that I have been with them. And you, write down for yourself all the words that I make known to you today, for I know their rebellion and their stiff neck before I bring them into the land that I swore to their fathers—to Abraham, Isaac, and Jacob—saying, ‘To your seed I will give the land that flows with milk and honey.’ And they will eat and be satisfied.
translation:
  language: de
  text: 'Und sie werden erkennen, dass ich mit ihnen gewesen bin. Und du, schreibe dir alle Worte auf, die ich dir heute kundtue; denn ich kenne ihre Auflehnung und ihre Halsstarrigkeit, noch bevor ich sie in das Land bringe, das ich ihren Vätern – Abraham, Isaak und Jakob – zugeschworen habe, als ich sagte: »Euren Nachkommen werde ich das Land geben, in dem Milch und Honig fließen.« Und sie werden essen und satt werden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያአምሩ
  choice: sie werden erkennen
  rationale: Gibt das Erkennen bzw. Wissen in natürlichem Deutsch wieder; der Zukunftsbezug entspricht dem Kontext.
- source_word: ሀለው፡ ኮንኩ፡ ምስሌሆሙ
  choice: dass ich mit ihnen gewesen bin
  rationale: Bewahrt die zeitliche Rückschau der Vorlage, ohne den nicht belegten Verstärker »wirklich« einzuführen.
- source_word: ጸሐፍ፡ ለከ
  choice: schreibe dir … auf
  rationale: Gibt Imperativ und reflexiven Nutznießer idiomatisch wieder.
- source_word: ምረተሙ
  choice: ihre Auflehnung
  rationale: Bezeichnet rebellisches bzw. widerspenstiges Verhalten; »Auflehnung« ist im Kontext klar und würdig.
- source_word: ክሳዶሙ፡ ደቡበ
  choice: ihren steifen Nacken
  rationale: Bewahrt das körperliche Idiom der Vorlage und seine biblische Bedeutung von Halsstarrigkeit.
- source_word: ለዘርእክሙ
  choice: Euren Nachkommen
  rationale: Das kollektiv gebrauchte »Same« wird in modernem Deutsch verständlich als »Nachkommen« wiedergegeben.
- source_word: ምድረ፡ እንተ፡ ትውሕዝ፡ ሐሊበ፡ ወመዓረ
  choice: das Land, in dem Milch und Honig fließen
  rationale: Natürliche moderne Wiedergabe der festen biblischen Wendung; der bestimmte Artikel der Vorlage bleibt erhalten.
- source_word: ወይበልዑ፡ ወይጸግቡ
  choice: Und sie werden essen und satt werden
  rationale: Entspricht den beiden koordinierten Zukunftsaussagen und wahrt ihren schlichten Nachdruck.
theological_decisions:
- issue: Gottes vorausgehendes Wissen um Israels Widerspenstigkeit
  choice: »denn ich kenne ihre Auflehnung und ihren steifen Nacken, noch bevor ich sie … bringe«
  alternative: »denn ich weiß, wie aufrührerisch und halsstarrig sie sind, bevor …«
  rationale: Die gewählte Fassung bewahrt sowohl die Aussage göttlichen Wissens als auch die markante Bildsprache, ohne die Spannung zwischen Verheißung und vorausgesehenem Ungehorsam abzuschwächen.
- issue: Verheißung an die Erzväter und ihre Nachkommenschaft
  choice: »das ich ihren Vätern Abraham, Isaak und Jakob zugeschworen habe … Euren Nachkommen werde ich das Land geben«
  alternative: »das ich ihren Vorfahren … versprochen habe … eurem Samen …«
  rationale: »Zugeschworen« erhält die Eidesdimension; »Nachkommen« vermittelt die kollektive Bedeutung verständlich, ohne eine christologische oder konfessionelle Auslegung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erkennbar biblischer Bildsprache. Die Satzstruktur bleibt nahe an der Vorlage, wird jedoch durch Semikolon, Kommas und direkte Rede lesbar gegliedert. Keine Fußnoten erforderlich.
