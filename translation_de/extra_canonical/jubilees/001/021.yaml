translation:
  language: de
  text: '„… ein reines Herz und einen heiligen Geist, und lass nicht zu, dass sie von nun an bis in Ewigkeit in ihren Sünden gefangen werden.“ Und der Herr sagte zu Mose: „Ich kenne ihr Widerstreben, ihre Gedanken und ihren steifen Nacken, und sie werden nicht hören.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልበ፡ ንጹሐ
  choice: ein reines Herz
  rationale: Gibt die wörtliche und im biblischen Sprachgebrauch verständliche Verbindung ‚Herz rein‘ natürlich wieder.
- source_word: መንፈሰ፡ ቅዱሰ
  choice: einen heiligen Geist
  rationale: Bewahrt die unbestimmte, beschreibende Form des Ausgangstextes und legt sie nicht stillschweigend als festen Eigennamen aus.
- source_word: ይትዐቀጹ
  choice: sich … verstricken
  rationale: Gibt das Bild des Gefangen- oder Verstricktwerdens idiomatisch wieder; die Gebetsformulierung ‚lass nicht zu‘ passt zum fortlaufenden Satz und zur passiven Aussage.
- source_word: ተዋሥኦቶሙ
  choice: ihren Widersinn
  rationale: Bewahrt den Sinn von Widerstreben beziehungsweise Gegensätzlichkeit, ohne ihn auf bloßen Ungehorsam zu verengen.
- source_word: ይቡሰ
  choice: ihren steifen Nacken
  rationale: Erhält das traditionelle biblische Körperbild für hartnäckigen Widerstand, statt es vollständig zu deuten.
theological_decisions:
- issue: Bezeichnung des göttlichen Sprechers
  choice: der Herr
  alternative: der HERR
  rationale: Das ge’ezische እግዚአብሔር ist ein Herrschafts- beziehungsweise Gottesprädikat; die Schreibung ‚HERR‘ könnte hier ohne ausdrückliches Tetragramm eine spezifische Rückübersetzung nahelegen.
- issue: Deutung von ‚heiliger Geist‘
  choice: einen heiligen Geist
  alternative: den Heiligen Geist
  rationale: Die unbestimmte Form erhält die echte Offenheit zwischen einer inneren heiligen Geisteshaltung und einer personal verstandenen Gabe des Geistes.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst erhaltener biblischer Bildsprache. Die Auslassungspunkte am Anfang kennzeichnen, dass der Vers syntaktisch an das vorausgehende Gebet anschließt.
