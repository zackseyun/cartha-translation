  text: And they will make for themselves high places and groves and carved images, and they will bow down, each to his own error, and they will sacrifice their children to demons and to every work of the error of their hearts.
translation:
  language: de
  text: Und sie werden sich Höhenheiligtümer, Haine und Schnitzbilder machen. Sie werden sich niederwerfen, jeder vor seinem eigenen Irrtum, und sie werden ihre Kinder den Dämonen und jedem Werk des Irrtums ihres Herzens opfern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፍሥሐታተ
  choice: Höhenheiligtümer
  rationale: Der Ausdruck bezeichnet hier kultische Höhen beziehungsweise erhöhte Kultstätten; „Höhenheiligtümer“ macht die religiöse Funktion im modernen Deutsch deutlich.
- source_word: ወግልፎ
  choice: Schnitzbilder
  rationale: Die Wiedergabe bezeichnet plastisch gearbeitete Kultbilder und bleibt näher am konkreten Bildwort als das allgemeinere „Götzenbilder“.
- source_word: ስሒት / ስሕተት
  choice: Irrbild / Irrtum
  rationale: Das Wortfeld bezeichnet Abirrung, Täuschung oder Irrtum. Beim Gegenstand der Niederwerfung steht „Irrbild“ natürlich im kultischen Zusammenhang; beim Herzen bewahrt „Irrtum“ die innere Dimension.
- source_word: አጋንንት
  choice: Dämonen
  rationale: Dies ist die direkte und im Kontext sachlich angemessene Bezeichnung für übermenschliche böse Geistwesen.
- source_word: ይዘብሑ
  choice: opfern
  rationale: Das Verb bezeichnet kultisches Schlachten beziehungsweise Darbringen eines Opfers; „opfern“ gibt den Sinn im Deutschen klar wieder.
theological_decisions:
- issue: Beziehung zwischen den Kultbildern und dem Irrtum jedes Einzelnen
  choice: „jeder vor seinem eigenen Irrbild“
  alternative: „jeder vor seinem eigenen Irrtum“
  rationale: Die konkrete Wiedergabe verbindet die Niederwerfung verständlich mit den zuvor genannten Kultbildern, ohne die Aussage auf eine bestimmte historische Gottheit festzulegen.
- issue: „Werk des Irrtums ihres Herzens“
  choice: „jedem Werk ..., das dem Irrtum ihres Herzens entspringt“
  alternative: „jedem Werk des Irrtums ihres Herzens“
  rationale: Die aufgelöste Genitivverbindung ist im heutigen Deutsch klarer und bewahrt zugleich, dass das falsche Handeln aus der inneren Verirrung hervorgeht.
translation_notes:
