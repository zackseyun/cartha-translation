  text: and they will turn to foreign gods, to those who cannot deliver them from any of their distress.
translation:
  language: de
  text: Und sie werden sich fremden Göttern zuwenden, die sie aus keiner ihrer Nöte retten können.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „die sie nicht aus all ihrer Bedrängnis retten werden“.'
    reason: Bewahrt sowohl die formale Zukunftsaussage des Verbs als auch die wörtlichere Wiedergabe von „alle/ganze Bedrängnis“.
lexical_decisions:
- source_word: ይትመየጡ፡ ኀበ፡
  choice: sie werden sich … zuwenden
  rationale: Gibt die gerichtete Hinwendung natürlich wieder und bewahrt den Zukunftsbezug der ge’ezischen Verbform.
- source_word: አምላክ፡ ነኪር፡
  choice: fremden Göttern
  rationale: Wörtlich steht eine Verbindung wie „fremder Gott“; der folgende pluralische Bezug („diejenigen, die“) und der Zusammenhang stützen im Deutschen die kollektive Wiedergabe im Plural.
- source_word: ኢያድኅንዎሙ፡
  choice: die sie … nicht retten können
  rationale: Drückt die völlige Unfähigkeit der fremden Götter zur Rettung in natürlichem Deutsch aus; die ge’ezische Form ist wörtlicher „die sie nicht retten werden“.
- source_word: እምኵሉ፡ ምንዳቤሆሙ፡
  choice: aus keiner ihrer Nöte
  rationale: 'Unter der Negation bezeichnet „alle/ihre ganze Bedrängnis“ hier umfassendes Versagen: Sie retten aus keiner Not. Diese Formulierung vermeidet die missverständliche Aussage, sie könnten wenigstens aus manchen Nöten retten.'
theological_decisions:
- issue: Numerus bei „Gott/Götter“
  choice: fremden Göttern
  alternative: einem fremden Gott
  rationale: Der ge’ezische Ausdruck ist formal singularisch, doch das anschließende pluralische Relativglied spricht für einen kollektiven beziehungsweise pluralischen Sinn. Die Übersetzung legt keine bestimmte Götterlehre darüber hinaus fest.
- issue: Negationsbereich bei „alle Bedrängnis“
  choice: aus keiner ihrer Nöte
  alternative: nicht aus all ihrer Bedrängnis
  rationale: Die gewählte Fassung vermittelt die umfassende Verneinung, ohne fälschlich eine teilweise Rettungsfähigkeit nahezulegen.
- issue: Nichtretten oder Unfähigkeit zu retten
  choice: nicht retten können
  alternative: nicht retten werden
  rationale: Die Fassung folgt dem idiomatischen Sinn und der konsultierten englischen Schicht; die wörtlichere Zukunftsaussage bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nöte“ ist allgemein verständlich und deckt konkrete Bedrängnisse ab; die Fußnote verwendet das formellere „Bedrängnis“ für die quellennähere Alternative.
