  yaml_path: translation/extra_canonical/jubilees/001/019.yaml
  text: And he prayed and said, “Lord my God, do not abandon your people and your inheritance to walk in the error of their hearts, and do not give them into the hand of their enemies, the nations, lest they rule over them and cause them to sin against you. Let your mercy, Lord, be lifted up over your people.”
translation:
  language: de
  text: 'Und er betete und sagte: »Herr, mein Gott, verlass dein Volk und dein Erbe nicht, damit sie nicht in der Verirrung ihres Herzens weitergehen. Gib sie nicht in die Hand ihrer Feinde, der Völker, damit diese nicht über sie herrschen und sie dazu bringen, gegen dich zu sündigen. Dein Erbarmen, Herr, erhebe sich über dein Volk.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢትኅድግ
  choice: überlass … nicht
  rationale: Das Verb bezeichnet hier das Preisgeben oder Sich-selbst-Überlassen; die Formulierung bewahrt den Gedanken, dass Gott sein Volk nicht seinem verfehlten Weg überlassen soll.
- source_word: ሕዝበከ፡ ወርስትከ
  choice: dein Volk und dein Erbe
  rationale: Die beiden parallelen Bundesbezeichnungen werden formal und ohne Zusammenziehung wiedergegeben.
- source_word: በሐዊር፡ በስሕተተ፡ ልቦሙ
  choice: ihrem Weg in der Verirrung ihres Herzens
  rationale: Die Wiedergabe erhält sowohl das Motiv des Gehens beziehungsweise Weges als auch den inneren Irrtum des Herzens; sie glättet die Konstruktion nur so weit, wie es für natürliches Deutsch nötig ist.
- source_word: አሕዛብ
  choice: der Völker
  rationale: Die Apposition erläutert die Feinde als fremde Völker; „Völker“ ist im heutigen Deutsch neutraler und genauer als „Heiden“.
- source_word: ይትለዐል
  choice: erhebe
  rationale: Die passive beziehungsweise reflexive Form bedeutet wörtlich, dass das Erbarmen sich erhebe oder erhöht werde. Im Gebetsruf ist der deutsche Imperativ natürlich und bewahrt das Bild der Erhebung.
- source_word: ምሕረትከ
  choice: dein Erbarmen
  rationale: „Erbarmen“ gibt die barmherzige Zuwendung Gottes in diesem Bittgebet prägnant und würdig wieder.
theological_decisions:
- issue: Verhältnis von Herzensverirrung und göttlichem Handeln
  choice: „überlass … nicht ihrem Weg in der Verirrung ihres Herzens“
  alternative: „lass … nicht in der Verirrung ihres Herzens wandeln“
  rationale: Die gewählte Fassung bewahrt die Spannung zwischen der eigenen inneren Verirrung des Volkes und der Bitte, Gott möge es diesem Weg nicht preisgeben, ohne eine Lehre über Willensfreiheit oder Verstockung einzutragen.
- issue: Feindherrschaft als Anlass zur Sünde
  choice: „damit diese nicht über sie herrschen und sie dazu bringen, gegen dich zu sündigen“
  alternative: „damit sie sie nicht richten und nicht bewirken, dass sie gegen dich sündigen“
  rationale: Der Kontext und die konsultierte englische Schicht sprechen für politische Unterwerfung beziehungsweise Herrschaft. Die kausative Aussage bleibt erhalten, ohne die Verantwortung des Volkes näher zu definieren.
- issue: Bild vom erhobenen Erbarmen
  choice: „erhebe dein Erbarmen über dein Volk“
  alternative: „dein Erbarmen möge sich über dein Volk erheben“
  rationale: Der direkte Imperativ passt zum Gebet und bewahrt das ungewöhnliche räumliche Bild, statt es interpretierend zu „erweise deinem Volk Erbarmen“ aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Gebetssprache. Die Wiederholungen und die Parallelstruktur des Ausgangstextes bleiben weitgehend sichtbar; die ungewöhnliche Wendung vom Erheben des Erbarmens wird bewusst nicht idiomatisch eingeebnet.
