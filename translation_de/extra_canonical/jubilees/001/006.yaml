  yaml_path: translation/extra_canonical/jubilees/001/006.yaml
  text: 'today for their generations on Mount Sinai.” And so it will be: when all these things come upon them, they will know that I am more righteous than they are in all their judgments and in all their deeds,'
translation:
  language: de
  text: 'heute für ihre Generationen auf dem Berg Sinai.« Und so wird es sein: Wenn alles, was über sie angekündigt wurde, über sie kommt, werden sie erkennen, dass ich in all ihren Urteilen und in all ihren Taten gerechter bin als sie.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዮም
  choice: heute
  rationale: Das Wort bedeutet »heute/dieser Tag« und gehört trotz des fragmentarischen Versanfangs ausdrücklich zum überlieferten Text.
- source_word: ይመጽእ፡ ኵሉ፡ ዝነገር፡ ላዕሌሆሙ
  choice: wenn alles, was über sie angekündigt wurde, über sie kommt
  rationale: Gibt sowohl das Kommen bzw. Eintreffen als auch den Rückbezug des angekündigten Geschehens natürlich wieder.
- source_word: ጻድቅ፡ እምኔሆሙ
  choice: gerechter bin als sie
  rationale: Die Präposition እምኔሆሙ trägt hier vergleichende Bedeutung; der Komparativ bewahrt die theologische Spannung der Aussage.
- source_word: ፍትሖሙ
  choice: ihren Urteilen
  rationale: Der Ausdruck bezeichnet Rechtssprüche bzw. Urteile; »Urteile« passt zum parallelen »Taten«, ohne den Sinn unnötig einzuengen.
- source_word: ምግባሮሙ
  choice: ihren Taten
  rationale: Bezeichnet Handlungen bzw. Werke und wird in gegenwärtigem, würdigem Deutsch mit »Taten« wiedergegeben.
theological_decisions:
- issue: Vergleichende Aussage über Gottes Gerechtigkeit
  choice: dass ich ... gerechter bin als sie
  alternative: dass ich ihnen gegenüber gerecht bin
  rationale: Der Ausgangstext enthält eine Vergleichsform. Diese wird nicht zu einer bloßen Aussage göttlicher Gerechtigkeit abgeschwächt, auch wenn die Formulierung theologisch spannungsvoll wirkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der kleingeschriebene Versanfang macht sichtbar, dass der Satz aus dem vorhergehenden Vers fortgesetzt wird; das schließende Anführungszeichen beendet die dort begonnene direkte Rede.
