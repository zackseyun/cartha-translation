  text: And every angel and every spirit will know that these are my children, and that I am their Father in uprightness and righteousness, and that I love them.
translation:
  language: de
  text: Und jeder Engel und jeder Geist wird erkennen, dass sie meine Kinder sind und dass ich ihr Vater bin in Aufrichtigkeit und Gerechtigkeit und dass ich sie liebe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወያአምርዎሙ
  choice: und … wird erkennen
  rationale: Das Verb bezeichnet Wissen bzw. Erkennen; im Deutschen gibt „erkennen“ den Erkenntnisvorgang natürlich wieder. Das kollektive Singularprädikat wird entsprechend der deutschen Reihung „jeder Engel und jeder Geist“ als Singular formuliert.
- source_word: ውሉድየ
  choice: meine Kinder
  rationale: Die Form bezeichnet die Kinder bzw. Söhne des Sprechers. „Kinder“ bewahrt den umfassenden Sinn und entspricht dem vorliegenden Kontext.
- source_word: አቡሆሙ
  choice: ihr Vater
  rationale: Direkte Wiedergabe der väterlichen Beziehung, ohne zusätzliche theologische Deutung.
- source_word: በርቶዕ፡ ወበጽድቅ
  choice: in Aufrichtigkeit und Gerechtigkeit
  rationale: Die beiden abstrakten Begriffe werden getrennt bewahrt. „Aufrichtigkeit“ gibt Geradheit/Rechtschaffenheit wieder, „Gerechtigkeit“ den zweiten Gerechtigkeitsbegriff.
- source_word: ወአፈቅርሙ
  choice: und dass ich sie liebe
  rationale: Das Verb bezeichnet Liebe; der Objektsuffix verweist auf die zuvor genannten Kinder.
theological_decisions:
- issue: Bedeutung der Wendung „in Aufrichtigkeit und Gerechtigkeit“
  choice: Die Wendung bleibt unmittelbar mit „ich bin ihr Vater“ verbunden.
  alternative: Die Wendung adverbial auf das gesamte Handeln Gottes oder speziell auf seine Liebe beziehen.
  rationale: Wortfolge und englische Konsultationsschicht stützen die direkte Anbindung an die Vaterschaft; die ungewöhnliche und theologisch spannungsvolle Formulierung wird nicht geglättet.
- issue: Referent von „sie“
  choice: Das Pronomen bezieht sich auf die genannten Kinder.
  alternative: Bezug auf Engel und Geister.
  rationale: Numerus, Satzgang und Aussagezusammenhang weisen auf „meine Kinder“ als Referenten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an den ge’ezischen Wortlaut. Die wiederholten dass-Sätze erhalten die feierliche Struktur, während eine unnatürliche Überladung vermieden wird.
