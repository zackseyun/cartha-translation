base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/029.yaml
  text: And the angel of the presence, who went before the camp of Israel, took the tablets of the divisions of the years from the time of creation, of the law and of the testimony, of the weeks of their jubilees, year by year in all their number, and the jubilees year by year, from the day of creation until the day when the heavens and the earth and all their creatures will be renewed according to the powers of heaven and according to all the creation of the earth, until the sanctuary of Yahweh is created in Jerusalem on Mount Zion, and all the lights are renewed for healing and for peace and for blessing for all the chosen of Israel, and that it may be thus from that day and throughout all the days of the earth.
translation:
  language: de
  text: Und der Engel des Angesichts, der vor dem Lager Israels herzog, nahm die Tafeln über die Einteilung der Jahre seit der Schöpfung, über das Gesetz und das Zeugnis, über die Wochen ihrer Jubiläen, Jahr für Jahr in ihrer ganzen Zahl, und über die Jubiläen, Jahr für Jahr, vom Tag der Schöpfung bis zu dem Tag, an dem die Himmel, die Erde und alle ihre Geschöpfe erneuert werden entsprechend den Kräften der Himmel und der gesamten Schöpfung der Erde, bis das Heiligtum Jahwes in Jerusalem auf dem Berg Zion geschaffen wird und alle Lichter erneuert werden, zur Heilung, zum Frieden und zum Segen für alle Erwählten Israels, und damit es von jenem Tag an so sei, solange die Erde besteht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ፡ ገጽ
  choice: Engel des Angesichts
  rationale: Formnahe Wiedergabe der äthiopischen Wortverbindung; zugleich eine im biblischen Deutsch verständliche Bezeichnung für den Engel der göttlichen Gegenwart.
- source_word: ቅድመ፡ ትዕይንቶሙ፡ ለእስራኤል
  choice: vor dem Lager Israels herzog
  rationale: Gibt die räumliche und führende Bewegung vor Israels Heerlager natürlich wieder.
- source_word: ጸላተ፡ ዘክፋሌ፡ ዓመታት
  choice: die Tafeln über die Einteilung der Jahre
  rationale: Bewahrt sowohl den konkreten Bezug auf Tafeln als auch die chronologische Gliederung der Jahre.
- source_word: ሱባዔሆሙ፡ ለኢዮቤሌዎን
  choice: die Wochen ihrer Jubiläen
  rationale: Erhält die wörtliche Zeitrechnung in Siebenerperioden und den possessiven Bezug des Ausgangstextes.
- source_word: እግዚአብሔር
  choice: Jahwe
  rationale: Gibt die Gottesbezeichnung im Einklang mit der geprüften POB-Schicht als Eigenname wieder, statt sie durch einen Titel zu ersetzen.
- source_word: ኵሉ፡ መዋዕለ፡ ምድር
  choice: solange die Erde besteht
  rationale: Natürliche deutsche Wiedergabe der Wendung „alle Tage der Erde“, die deren fortdauernde Lebenszeit bezeichnet.
theological_decisions:
- issue: Erneuerung von Himmel, Erde und ihren Geschöpfen
  choice: an dem der Himmel, die Erde und alle ihre Geschöpfe erneuert werden
  alternative: an dem ein neuer Himmel und eine neue Erde geschaffen werden
  rationale: Der Text spricht ausdrücklich von Erneuerung und nicht von einem vollständigen Ersatz; diese Spannung wird nicht dogmatisch aufgelöst.
- issue: Entstehung des Heiligtums
  choice: bis das Heiligtum Jahwes … geschaffen wird
  alternative: bis das Heiligtum Jahwes … errichtet wird
  rationale: „Geschaffen“ bewahrt das auffällige Schöpfungsvokabular und den eschatologischen Zusammenhang des Ausgangstextes.
- issue: Die erneuerten Lichter
  choice: alle Lichter erneuert werden
  alternative: alle Himmelslichter erneuert werden
  rationale: Der offene Ausdruck des Ausgangstextes bleibt erhalten, ohne seine mögliche kosmische Bedeutung durch eine Präzisierung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst langem, aber klar gegliedertem Satzbau entsprechend der chronologischen Bewegung des Ausgangstextes. Fachbegriffe der Jubiläenrechnung bleiben sichtbar; unnötige konfessionelle Präzisierungen werden vermieden.
