  yaml_path: translation/extra_canonical/jubilees/001/022.yaml
  text: and they will not listen until they acknowledge their sin and the sins of their fathers. And after this they will turn to me in all uprightness and with all their heart and with all their soul,
translation:
  language: de
  text: Und sie werden nicht hören[a], bis sie ihre Sünde und die Sünden ihrer Väter erkennen. Danach werden sie in aller Aufrichtigkeit zu mir umkehren, mit ganzem Herzen und mit ganzer Seele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: gehorchen; auch: auf mich hören.'
    reason: Das Verb für „hören“ kann kontextuell das Befolgen oder Gehorchen bezeichnen, ohne dass diese Nuance grammatisch eindeutig festgelegt ist.
lexical_decisions:
- source_word: ወኢይሰምዑ
  choice: Und sie werden nicht hören
  rationale: Das Verb bedeutet zunächst „hören“, kann im Kontext aber auch „auf jemanden hören“ bzw. „gehorchen“ einschließen. Die Grundbedeutung bleibt im Text erhalten; die mögliche Bedeutungsweite wird in einer Fußnote genannt.
- source_word: ያአምሩ
  choice: erkennen
  rationale: Das Verb bezeichnet Wissen oder Erkennen. „Erkennen“ bewahrt hier die Spannung zwischen dem Bewusstwerden und dem Eingestehen der Schuld, ohne Letzteres ausdrücklich in den Text hineinzulesen.
- source_word: ይትመየጡ ኀቤየ
  choice: zu mir umkehren
  rationale: Die Wendung bezeichnet eine Rückwendung zu Gott. „Umkehren“ ist im Deutschen natürlich und gibt die religiös-ethische Dimension wieder.
- source_word: በኵሉ ርቱዕ
  choice: in aller Aufrichtigkeit
  rationale: Das zugrunde liegende Wortfeld umfasst Geradheit, Rechtschaffenheit und Aufrichtigkeit. Im Zusammenhang der Umkehr bezeichnet „Aufrichtigkeit“ verständlich die ungeteilte, redliche Hinwendung.
- source_word: በኵሉ ልብ ወበኵሉ ነፍስ
  choice: mit ganzem Herzen und mit ganzer Seele
  rationale: Die idiomatische deutsche Formulierung bewahrt die zweimalige Aussage der Ganzheit und den feierlichen biblischen Klang.
theological_decisions:
- issue: Erkennen oder Eingestehen der Sünde
  choice: erkennen
  alternative: eingestehen
  rationale: Der äthiopische Wortlaut verlangt nicht eindeutig ein ausdrückliches Bekenntnis. „Erkennen“ wahrt die lexikalische Offenheit und schließt ein schuldhaftes Anerkennen im Kontext nicht aus.
- issue: Bedeutung von „hören“
  choice: hören
  alternative: gehorchen / auf mich hören
  rationale: Ein ausdrückliches Objekt wie „auf mich“ steht hier nicht. Daher bleibt die formale Lesart im Haupttext stehen, während die kontextuell mögliche Bedeutung „gehorchen“ in der Fußnote erscheint.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der am Anfang der überlieferten Segmentierung stehende Ausdruck ክሳዶሙ („ihren Nacken“) wurde nicht aufgenommen, da er syntaktisch zum vorhergehenden Vers und dessen Aussage über das Verhärten des Nackens gehört. Die Parallelität von „ganzem Herzen“ und „ganzer Seele“ wurde bewahrt.
