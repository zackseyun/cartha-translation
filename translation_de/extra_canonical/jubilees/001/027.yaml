  text: And he said to the angel of the presence, “Write for Moses from the beginning of creation until the time when my sanctuary will be built in their midst forever and ever, and the Lord will appear to the eyes of all.”
translation:
  language: de
  text: 'Und er sagte zu dem Engel des Angesichts: „Schreibe für Mose vom Anfang der Schöpfung an bis zu der Zeit, da mein Heiligtum in ihrer Mitte für immer und ewig erbaut werden wird und der Herr sich vor aller Augen zeigen wird.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መልአከ፡ ገጽ
  choice: Engel des Angesichts
  rationale: Die formnahe Wiedergabe bewahrt den traditionsgeschichtlich geprägten Ausdruck; „Gegenwart“ wäre deutender.
- source_word: እምቀዳሚ፡ ፍጥረት
  choice: vom Anfang der Schöpfung an
  rationale: Gibt Ausgangspunkt und zeitliche Erstreckung im natürlichen Deutschen präzise wieder.
- source_word: መቅደስየ
  choice: mein Heiligtum
  rationale: Bewahrt das Possessivsuffix und bezeichnet den geheiligten Kultort ohne unnötige Festlegung auf „Tempel“.
- source_word: ለዓለመ፡ ዓለማት
  choice: für immer und ewig
  rationale: Eine idiomatische und würdige deutsche Wiedergabe der verstärkten Ewigkeitsformel.
- source_word: ያስተርኢ
  choice: sich … zeigen wird
  rationale: Entspricht dem Erscheinungsverb und erhält den Gedanken einer sichtbaren Offenbarung.
- source_word: ለዐይን፡ ኵሉ
  choice: vor aller Augen
  rationale: Natürliches Deutsch für die wörtliche Vorstellung „für die Augen aller“, ohne die allgemeine Sichtbarkeit abzuschwächen.
theological_decisions:
- issue: Titel des Engels
  choice: Engel des Angesichts
  alternative: Engel der Gegenwart
  rationale: „Angesicht“ hält die konkrete, traditionelle Bildsprache offen und legt den Ausdruck nicht vorschnell als bloße göttliche Gegenwart aus.
- issue: Subjekt der abschließenden Erscheinung
  choice: der Herr
  alternative: er
  rationale: Das im ge'ezischen Text ausdrücklich genannte እግዚአብሔር wird als „der Herr“ wiedergegeben; dadurch bleibt der Wechsel von der Ich-Rede („mein Heiligtum“) zur Selbstbezeichnung in der dritten Person erhalten.
- issue: Dauer des Heiligtums
  choice: für immer und ewig
  alternative: für alle Zeitalter der Ewigkeit
  rationale: Die gewählte Formulierung bewahrt die unbegrenzte Dauer und klingt zugleich in modernem Standarddeutsch natürlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit formnaher Wiedergabe zentraler traditionsgeprägter Ausdrücke. Die Satzstruktur bleibt übersichtlich; die direkte Rede und der Wechsel von der ersten zur dritten Person werden bewahrt.
