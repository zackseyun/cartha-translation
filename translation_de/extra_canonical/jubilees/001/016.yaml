lexical_decisions:
- source_word: በኵሉ፡ ልብየ፡ ወበኵሉ፡ ነፍስየ
  choice: mit meinem ganzen Herzen und mit meiner ganzen Seele
  rationale: Bewahrt die zweigliedrige, formelhafte Ausdrucksweise des Ausgangstextes in natürlichem, würdigem Deutsch.
- source_word: ለበረከት፡ ወአኮ፡ ለመርገም
  choice: zum Segen und nicht zum Fluch
  rationale: Gibt den klaren Gegensatz eng am Wortlaut und idiomatisch wieder.
- source_word: ርእሰ፡ ወአኮ፡ ዘነበ
  choice: der Kopf und nicht der Schwanz
  rationale: Erhält das konkrete biblische Gegensatzbild, statt es als Vorrang oder Erfolg auszudeuten.
- source_word: እሐንጽ፡ መቅደስየ
  choice: ich werde mein Heiligtum ... errichten
  rationale: „Errichten“ gibt das Bauen eines Heiligtums natürlich wieder und vermeidet die im Deutschen mögliche Vorstellung, Gott baue es eigenhändig.
- source_word: ማእከሎሙ
  choice: in ihrer Mitte
  rationale: Entspricht der räumlichen und gemeinschaftlichen Bedeutung des Ausdrucks.
- source_word: እኀድር፡ ምስሌሆሙ
  choice: bei ihnen wohnen
  rationale: Bewahrt die konkrete Vorstellung der bleibenden göttlichen Gegenwart bei der Gemeinschaft.
theological_decisions:
- issue: Göttliche Gegenwart im Heiligtum und bei der Gemeinschaft
  choice: „mein Heiligtum in ihrer Mitte errichten und bei ihnen wohnen“
  alternative: „meine Wohnstätte unter ihnen bauen und unter ihnen Wohnung nehmen“
  rationale: Die gewählte Fassung unterscheidet Heiligtum und göttliches Wohnen, ohne deren Verhältnis dogmatisch näher festzulegen.
- issue: Bild von Kopf und Schwanz
  choice: Das Bild wird wörtlich bewahrt.
  alternative: „sie werden an erster und nicht an letzter Stelle stehen“
  rationale: Eine erklärende Übertragung würde die metaphorische Spannung des Quelltexts auflösen und eine bestimmte soziale oder politische Deutung nahelegen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem biblischem Klang. Die Satzanfänge mit „Und“ bewahren den parataktischen Stil. Das Fragment beginnt und endet satzübergreifend; daher bleiben der kleingeschriebene Anfang und das abschließende Komma erhalten.
