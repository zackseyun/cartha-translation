  text: with all my heart and with all my soul. And they will be for a blessing and not for a curse, and they will be the head and not the tail. And I will build my sanctuary in their midst, and I will dwell with them,
translation:
  language: de
  text: mit meinem ganzen Herzen und mit meiner ganzen Seele. Und sie werden zum Segen und nicht zum Fluch sein; sie werden der Kopf und nicht der Schwanz sein. Und ich werde mein Heiligtum in ihrer Mitte errichten und bei ihnen wohnen,
