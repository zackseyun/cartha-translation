base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/010.yaml
  text: And many will perish, and they will be captured and fall into the hand of the enemy, because they abandoned my ordinances and my commandments and the festivals of my covenant and my Sabbaths and my holy things that I sanctified for myself among them, and my tabernacle and my sanctuary that I sanctified for myself in the midst of the land, so that I might set my name upon it.
translation:
  language: de
  text: Und viele werden umkommen; sie werden gefangen genommen und in die Hand des Feindes fallen, weil sie meine Ordnungen und meine Gebote verlassen haben, die Feste meines Bundes, meine Sabbate und meine heiligen Dinge, die ich mir mitten unter ihnen geheiligt habe, und meine Stiftshütte und mein Heiligtum, das ich mir mitten im Land geheiligt habe, damit ich meinen Namen darauf setze.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትሐጐሉ
  choice: werden umkommen
  rationale: Gibt den zukünftigen Untergang vieler natürlich und dem Kontext entsprechend wieder.
- source_word: ይትአኀዙ
  choice: werden gefangen genommen werden
  rationale: Die passive Form bezeichnet hier am ehesten Gefangennahme durch Feinde, nicht bloß ein unspezifisches Ergreifen.
- source_word: ሥርዐትየ
  choice: meine Ordnungen
  rationale: Bewahrt den rechtlich-kultischen Sinn, ohne den Ausdruck unnötig auf einzelne Satzungen einzuengen.
- source_word: በዓላት፡ ኪዳንየ
  choice: die Feste meines Bundes
  rationale: Erhält die genitivische Verbindung zwischen den Festen und dem Bund.
- source_word: ደብተራየ
  choice: meine Stiftshütte
  rationale: Traditioneller, im biblischen Deutsch verständlicher Ausdruck für das heilige Zeltheiligtum.
- source_word: አሢም፡ ስምየ፡ ላዕሌሁ
  choice: damit ich meinen Namen darauf setze
  rationale: Folgt dem konkreten Namensmotiv und vermeidet eine interpretierende Umschreibung wie „dort wohnen lassen“.
theological_decisions:
- issue: Bezug des singulären Pronomens im Schlusssatz
  choice: darauf
  alternative: dort
  rationale: Das Singularpronomen wird formal bewahrt; wahrscheinlich bezieht es sich auf das unmittelbar zuvor genannte Heiligtum, doch die Übersetzung legt den Bezug nicht stärker fest als nötig.
- issue: Heiligung für Gott selbst
  choice: die ich mir … geheiligt habe
  alternative: die ich für mich … geheiligt habe
  rationale: „Mir geheiligt“ ist natürliches, würdevolles Deutsch und bewahrt, dass diese Dinge Gott vorbehalten beziehungsweise zugeeignet sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit biblischem Klang. Die lange Reihung des Ausgangstextes bleibt erhalten, wird jedoch durch Zeichensetzung und „ebenso“ lesbarer gegliedert. Keine konfessionell geprägte Deutung wurde ergänzt.
