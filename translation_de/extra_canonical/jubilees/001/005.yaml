  to: '[a]Der Herr ließ ihn erkennen, was zuerst gewesen war und was kommen würde: den Bericht über die Einteilung aller Tage des Gesetzes und des Zeugnisses. Und er sagte: „Richte dein Herz auf alles, was ich dir auf diesem Berg sage, und schreibe es in ein Buch, damit ihre Generationen erkennen, dass ich sie nicht wegen all des Bösen verlassen habe, das sie getan haben, indem sie die Ordnung übertraten, die ich zwischen mir und dir festsetze.“'
