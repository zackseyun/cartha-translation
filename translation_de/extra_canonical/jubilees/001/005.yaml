  yaml_path: translation/extra_canonical/jubilees/001/005.yaml
  text: 'And the Lord taught him what was first and what was to come: the account of the divisions of all the days of the law and the testimony. And he said, “Set your heart on everything that I tell you on this mountain, and write it in a book, so that their generations may see that I have not abandoned them because of all the evil that they have done by transgressing the ordinance that I establish between me and you.”'
translation:
  language: de
  text: '[a]Der Herr ließ ihn erkennen, was zuerst gewesen war und was kommen würde: den Bericht über die Einteilung aller Tage des Gesetzes und des Zeugnisses. Und er sagte: „Richte dein Herz auf alles, was ich dir auf diesem Berg sage, und schreibe es in ein Buch, damit ihre Generationen erkennen, dass ich sie nicht wegen all des Bösen verlassen habe, das sie getan haben, indem sie die Ordnung übertraten, die ich zwischen mir und dir festsetze.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorgelegte äthiopische Text beginnt an dieser Versgrenze noch mit dem Wort „Nächte“. Es vervollständigt offenbar die Zeitangabe des vorhergehenden Verses und wird deshalb hier nicht als Bestandteil von Vers 5 übersetzt.
    reason: Die überlieferte bzw. digital gesetzte Versgrenze enthält ein offenkundiges Anschlusswort aus Jub 1,4; die Anmerkung macht die quellensprachliche Besonderheit transparent.
lexical_decisions:
- source_word: ወአመሮ፡ እግዚአብሔር
  choice: Der Herr ließ ihn erkennen
  rationale: Das Kausativverb bezeichnet ein Erkennenlassen bzw. Offenbaren. „Der Herr“ entspricht እግዚአብሔር; der Text verwendet hier nicht den Gottesnamen JHWH.
- source_word: ዘቀዳሚ፡ ወዘኒ፡ ይመጽእ
  choice: was zuerst gewesen war und was kommen würde
  rationale: Die Formulierung bewahrt den Rück- und Zukunftsbezug, ohne „zuerst“ unnötig als Schöpfungsanfang festzulegen.
- source_word: ነገረ፡ ኩፋሌ፡ ኵሉ፡ መዋዕላት
  choice: den Bericht über die Einteilung aller Tage
  rationale: ነገር kann Sache, Wort oder Bericht bedeuten; im Zusammenhang ist „Bericht“ natürlich. ኩፋሌ bezeichnet Teilung bzw. Einteilung und greift den Buchtitel thematisch auf.
- source_word: ሕግ፡ ወለስምዕ
  choice: des Gesetzes und des Zeugnisses
  rationale: Die beiden traditionsprägenden Begriffe werden formal und unterscheidbar wiedergegeben.
- source_word: አነብር፡ ልበከ
  choice: Richte dein Herz auf
  rationale: Die körperbildliche Aufforderung wird bewahrt und bleibt im Deutschen verständlich; gemeint ist aufmerksames inneres Erfassen.
- source_word: ሥርዐት
  choice: Ordnung
  rationale: Der Begriff kann Ordnung, Satzung oder Vorschrift bezeichnen. „Ordnung“ erhält die sachliche Breite des Ausgangswortes.
- source_word: እሠርዕ፡ ማእከሌየ፡ ወማእከሌከ
  choice: die ich zwischen mir und dir festsetze
  rationale: Die präsentische Festsetzung und die Beziehung zwischen Gott und Mose werden ohne den im Quelltext nicht belegten Zusatz „heute“ wiedergegeben.
theological_decisions:
- issue: Verhältnis von Israels Bösem zu Gottes Nichtverlassen
  choice: „trotz all des Bösen … nicht verlassen habe“
  alternative: „nicht verlassen habe wegen all des Bösen“
  rationale: Die äthiopische Präposition kann kontextabhängig kausal oder betreffend verstanden werden. Die konzessive deutsche Fassung ergibt den sinnvollen Zusammenhang, ohne eine endgültige Verwerfung zu behaupten.
- issue: Wiedergabe von ሥርዐት
  choice: „Ordnung“
  alternative: „Bund“ oder „Satzung“
  rationale: „Bund“ wäre theologisch möglich, ist aber lexikalisch enger und würde eine nicht ausdrücklich verwendete Bundesbezeichnung eintragen. „Ordnung“ wahrt die Mehrdeutigkeit.
- issue: Zeitbezug der göttlichen Festsetzung
  choice: Präsens „festsetze“ ohne „heute“
  alternative: „heute festsetze“
  rationale: Der vorgelegte äthiopische Text enthält an dieser Stelle keinen Ausdruck für „heute“; der Zusatz wird daher nicht übernommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhafte Wendung „Richte dein Herz auf“ und die Fachbegriffe „Gesetz“, „Zeugnis“ und „Ordnung“ bleiben erhalten; Satzbau und Tempusfolge wurden für heutige Leser natürlich gestaltet.
