  yaml_path: translation/extra_canonical/jubilees/001/023.yaml
  text: and I will cut off the foreskin of their heart and the foreskin of the heart of their seed, and I will create for them a holy spirit, and I will cleanse them so that they do not turn away from following me from that day and forever.
translation:
  language: de
  text: Und ich werde die Vorhaut ihres Herzens und die Vorhaut des Herzens ihrer Nachkommen wegschneiden[a]. Ich werde ihnen einen heiligen Geist erschaffen und sie reinigen, damit sie von jenem Tag an bis in Ewigkeit nicht mehr aufhören, mir zu folgen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Weniger wörtlich: „die Bedeckung ihres Herzens und die Bedeckung des Herzens ihrer Nachkommen öffnen“.'
    reason: Kennzeichnet die Formulierung als interpretierende, weniger konkrete Umschreibung der Beschneidungsmetapher.
  - marker: b
    text: 'Wörtlich: „sich nicht von hinter mir abwenden“.'
    reason: Dokumentiert das räumliche Bild des Ausgangstextes, das idiomatisch das Aufgeben der Nachfolge bezeichnet.
lexical_decisions:
- source_word: ቍልፈተ፡ ልቦሙ፡ ወቍልፈተ፡ ልበ፡ ዘርኦሙ
  choice: die Vorhaut ihres Herzens und die Vorhaut des Herzens ihrer Nachkommen
  rationale: ቍልፈት bezeichnet wörtlich die Vorhaut bzw. Unbeschnittenheit. Die direkte Wiedergabe bewahrt das biblische Bild der Beschneidung des Herzens; ዘር bedeutet hier den Samen im Sinn der Nachkommenschaft.
- source_word: እፈጥር፡ ሎሙ፡ መንፈሰ፡ ቅዱሰ
  choice: Ich werde ihnen einen heiligen Geist erschaffen
  rationale: Die Wiedergabe hält am konkreten Schöpfungsverb ፈጠረ und an der formal unbestimmten Verbindung „heiliger Geist“ fest, ohne sie stillschweigend zu einer konfessionell bestimmten Aussage umzuformen.
- source_word: እነጽሖሙ
  choice: sie reinigen
  rationale: Das Verb bezeichnet Reinigen bzw. Läutern; „reinigen“ ist im Deutschen natürlich und wahrt den kultisch-ethischen Bedeutungsraum.
- source_word: ኢይትመየጡ፡ እምድኅሬየ
  choice: sich nicht mehr davon abwenden, mir zu folgen
  rationale: Wörtlich steht eine Abwendung „von hinter mir“. Die deutsche Formulierung macht das darin liegende Bild des Aufhörens, jemandem nachzufolgen, verständlich, ohne es auf bloße räumliche Entfernung zu reduzieren.
theological_decisions:
- issue: Metapher der Herzensbeschneidung
  choice: Vorhaut … wegschneiden
  alternative: Bedeckung … öffnen
  rationale: Die körperlich-konkrete Metapher ist im Ausgangstext vorhanden und knüpft an die biblische Rede von der Beschneidung des Herzens an. Eine euphemistische Wiedergabe mit „Bedeckung“ würde ihr theologisches Gewicht abschwächen.
- issue: Bedeutung von „heiliger Geist“
  choice: einen heiligen Geist
  alternative: den Heiligen Geist
  rationale: Die Formulierung bleibt formal unbestimmt. Die Übersetzung vermeidet es, den Ausdruck durch Großschreibung und bestimmten Artikel vorzeitig als feststehenden trinitarischen Titel auszulegen.
- issue: Abwendung „von hinter mir“
  choice: davon abwenden, mir zu folgen
  alternative: sich von mir abwenden
  rationale: Die gewählte Form bewahrt die relationale Nachfolgekomponente des ge’ezischen Idioms, ohne die Aussage stärker zu systematisieren.
translation_notes:
  register: Moderne, würdige Standardsprache. Die drastische Herzensmetapher wird nicht euphemistisch geglättet. „Nachkommen“ ist gegenüber „Same“ im Fließtext natürlicher. Der Satzschluss „von jenem Tag an bis in Ewigkeit“ erhält den feierlichen Zeithorizont des Originals.
