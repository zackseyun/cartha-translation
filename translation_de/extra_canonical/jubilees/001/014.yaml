  text: And they will forget all my law and all my commandments and all my judgments, and they will go astray as to new moons
translation:
  language: de
  text: Und sie werden mein ganzes Gesetz, alle meine Gebote und alle meine Rechtsbestimmungen vergessen; hinsichtlich der Neumonde werden sie sich irren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕግየ
  choice: mein ganzes Gesetz
  rationale: Das ge'ezische Substantiv bezeichnet Gesetz bzw. Weisung; das Possessivsuffix der ersten Person wird ausdrücklich wiedergegeben.
- source_word: ትእዛዝየ
  choice: alle meine Gebote
  rationale: Entspricht natürlich und präzise dem Begriff für Anordnungen oder Gebote.
- source_word: ፍትሕየ
  choice: alle meine Rechtsbestimmungen
  rationale: Der Ausdruck kann Rechtssprüche, Ordnungen oder Rechtsbestimmungen meinen. „Rechtsbestimmungen“ wahrt den rechtlichen Sinn, ohne ihn konfessionell einzuengen.
- source_word: ይስሕቱ
  choice: werden sie sich irren
  rationale: Das Verb bezeichnet Irren oder Abweichen. Im Zusammenhang mit den Neumonden ist „sich irren“ natürlich und bewahrt die offene Aussage des Quellenfragments.
- source_word: ሠርቀ
  choice: bei den Neumonden
  rationale: Der Ausdruck kann den Neumond bzw. dessen Aufgang bezeichnen. Der Plural ist im Deutschen in dieser kalendarischen Aufzählung idiomatisch; die formale Singularform und Bedeutungsbreite werden in der Fußnote vermerkt.
theological_decisions:
- issue: Verhältnis von Gesetz, Geboten und Rechtsbestimmungen
  choice: Alle drei parallelen Quellbegriffe bleiben getrennt erhalten.
  alternative: Die drei Begriffe unter „meine Weisungen“ zusammenzufassen.
  rationale: Die dreifache Formulierung ist rhetorisch und möglicherweise theologisch bedeutsam; eine Zusammenfassung würde die Quellstruktur einebnen.
- issue: Art des Irrtums bei den Neumonden
  choice: „bei den Neumonden werden sie sich irren“
  alternative: „sie werden die Neumonde falsch bestimmen“
  rationale: Die Alternative wäre im kalendarischen Kontext plausibel, würde aber eine konkrete Art des Irrtums ergänzen, die im erhaltenen Quellenfragment nicht ausdrücklich genannt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Gesetzesterminologie und die Unbestimmtheit des Irrtums bleiben erhalten. Das am Fragmentanfang stehende አሕዛብ („Völker/Heiden“) wurde nicht aufgenommen, da es syntaktisch zum vorangehenden, durch die Verssegmentierung abgeschnittenen Satz gehört.
