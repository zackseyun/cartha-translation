  source_fidelity: 'Die Übersetzung gibt die drei Satzglieder des geʽezischen Textes vollständig wieder: die Herrlichkeit des Herrn auf dem Berg Sinai, das sechs Tage währende Überschatten durch die Wolke und das anschließende Rufen. Die maskulinen Objektpronomen bleiben erhalten; bei „überschattete ihn“ ist der Berg Sinai als grammatischer Bezug im Deutschen möglich. Die elliptische Ortsprädikation wird mit der idiomatisch notwendigen Kopula „war“ sachgerecht wiedergegeben.'
  naturalness: Modernes, verständliches und zugleich angemessen würdiges Standarddeutsch. „Sechs Tage lang“ ist idiomatisch; die kurzen Hauptsätze bewahren den erzählerisch-biblischen Duktus. Die pronominale Formulierung ist ohne Kontext leicht offen, wird aber zutreffend durch die Fußnote erläutert.
  terminology: „Herrlichkeit des Herrn“, „Berg Sinai“ und „überschatten“ sind treffende, etablierte biblisch-literarische Wiedergaben. Die Übersetzung vermeidet es, die im vorgelegten Wortlaut nicht ausdrücklich benannten Referenten dogmatisch oder interpretativ in den Haupttext einzutragen.
