  text: The glory of the Lord was upon Mount Sinai, and the cloud overshadowed it for six days. And He called him
translation:
  language: de
  text: Die Herrlichkeit des Herrn war auf dem Berg Sinai, und die Wolke überschattete ihn sechs Tage lang. Und er rief ihn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Zusammenhang legt nahe: Der Herr rief Mose. Im Ge''ez stehen hier jedoch nur die Pronomen »er« und »ihn«.'
    reason: Bewahrung und Erläuterung der im Ausgangstext vorhandenen pronominalen Mehrdeutigkeit.
lexical_decisions:
- source_word: ስብሐተ፡ እግዚአብሔር
  choice: die Herrlichkeit des Herrn
  rationale: Gibt die feste Verbindung aus »Herrlichkeit« und dem Gottesnamen würdig und im biblischen Deutsch geläufig wieder.
- source_word: ውስተ፡ ደብረ፡ ሲና
  choice: war auf dem Berg Sinai
  rationale: Die im Ge'ez nominal formulierte Ortsangabe erfordert im natürlichen Deutschen eine ergänzte Kopula.
- source_word: ጸለሎ፡ ደመና
  choice: die Wolke überschattete ihn
  rationale: Bewahrt sowohl das Bild des Überschattens als auch das maskuline pronominale Objekt des Ausgangstextes.
- source_word: ስዱሰ፡ ዕለተ
  choice: sechs Tage lang
  rationale: Natürliche deutsche Wiedergabe der Zeitdauer.
- source_word: ወጸውዖ
  choice: Und er rief ihn
  rationale: Gibt Verb, Konjunktion und pronominales Objekt formal wieder, ohne die im isolierten Vers nicht ausdrücklich genannten Referenten in den Haupttext einzusetzen.
theological_decisions:
- issue: Referenten der Pronomen in »Und er rief ihn«
  choice: Die Pronomen bleiben im Haupttext stehen.
  alternative: »Und der Herr rief Mose«
  rationale: Der Zusammenhang legt Gott als Subjekt und Mose als Objekt nahe; der vorgelegte Ge'ez-Wortlaut nennt beide an dieser Stelle jedoch nicht ausdrücklich. Die Übersetzung bewahrt daher die sprachliche Offenheit und erläutert sie in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst schlichter biblischer Satzführung. Die wiederholten Pronomen wirken leicht ungewohnt, werden aber zur Wahrung des knappen Ge'ez-Wortlauts beibehalten.
