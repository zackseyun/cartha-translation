  text: And I will send witnesses to them so that I may testify to them, but they will not listen; and they will also kill the witnesses, and they will drive away those who seek the law, and they will overturn everything and begin to do evil.
translation:
  language: de
  text: Und ich werde Zeugen zu ihnen senden, um ihnen Zeugnis abzulegen; doch sie werden nicht hören. Auch die Zeugen werden sie töten. Diejenigen, die nach dem Gesetz suchen, werden sie vertreiben; alles werden sie umstürzen und anfangen, Böses zu tun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰማዕተ
  choice: Zeugen
  rationale: Das Substantiv bezeichnet Zeugen und wird in beiden Vorkommen gleich wiedergegeben.
- source_word: አስምዕ ሎሙ
  choice: ihnen Zeugnis gebe
  rationale: Die kausative Form aus dem Wortfeld des Hörens kann hier im Zusammenhang mit den gesandten Zeugen idiomatisch als Zeugnisgeben verstanden werden; die Zielrichtung „ihnen“ bleibt erhalten.
- source_word: የኀሡሡ ሕገ
  choice: die nach dem Gesetz suchen
  rationale: Die konkrete Suchbewegung des Ausgangstextes wird bewahrt, ohne sie als bloße Gesetzestreue auszulegen.
- source_word: ይሰድድዎሙ
  choice: werden sie vertreiben
  rationale: Gibt die Bedeutung des Wegtreibens bzw. Vertreibens direkt wieder; das stärkere „verfolgen“ wäre ebenfalls möglich, ist hier aber weniger eng am vorliegenden Kontext.
- source_word: ያፀርዑ
  choice: umstürzen
  rationale: Drückt die umfassende Zerstörung beziehungsweise Aufhebung der bestehenden Ordnung aus und entspricht dem Objekt „alles“ in natürlichem Deutsch.
- source_word: ይዌልእ ለገቢረ እኩይ
  choice: anfangen, Böses zu tun
  rationale: Bewahrt sowohl den Beginnsaspekt als auch die allgemeine Formulierung des bösen Handelns.
theological_decisions:
- issue: Bezug und Funktion der Zeugen
  choice: Gott sendet Zeugen, um den Menschen Zeugnis zu geben
  alternative: Gott sendet Zeugen, um gegen die Menschen auszusagen
  rationale: Die Formulierung lässt das Zeugnis als an sie gerichtet stehen und legt nicht zusätzlich fest, dass es ausschließlich eine gerichtliche Anklage gegen sie ist.
- issue: Bedeutung von „Gesetz“
  choice: Gesetz
  alternative: Tora
  rationale: „Gesetz“ ist die direkte, allgemein verständliche Wiedergabe und vermeidet eine unnötige konfessionelle oder terminologische Engführung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzglieder wurden zur besseren Verständlichkeit in mehrere Sätze gegliedert; die wiederholte Subjektstellung betont die fortschreitende Auflehnung. Keine erläuternden Zusätze oder konfessionellen Deutungen wurden in den Text aufgenommen.
