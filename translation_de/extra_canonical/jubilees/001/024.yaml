  text: And their souls will cling to me and to all my commandments, and they will do my commandments. And I will be their Father, and they will be my children.
translation:
  language: de
  text: Und ihre Seelen werden sich an mich und an alle meine Gebote halten, und sie werden meine Gebote befolgen. Ich werde ihr Vater sein, und sie werden meine Kinder sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነፍሶሙ
  choice: ihre Seelen
  rationale: Gibt den geʿezischen Plural mit Possessivsuffix formal wieder und bewahrt die personale, innere Dimension des Ausdrucks.
- source_word: ኀቤየ
  choice: an mir
  rationale: Die Richtungsangabe „zu mir“ wird zusammen mit dem im Kontext ergänzten Gedanken des Sich-Anschließens idiomatisch als „an mir festhalten“ ausgedrückt.
- source_word: ትእዛዝየ
  choice: meine Gebote
  rationale: Entspricht dem wiederholten Ausdruck für verbindliche göttliche Weisungen.
- source_word: ይገብሩ
  choice: befolgen
  rationale: Das wörtliche „tun“ wird im Deutschen bei Geboten natürlich als „befolgen“ wiedergegeben.
- source_word: አበ
  choice: Vater
  rationale: Bewahrt die ausdrücklich relationale Gottesbezeichnung ohne zusätzliche dogmatische Ausdeutung.
- source_word: ውሉደ
  choice: Kinder
  rationale: Im Gegenüber zu „Vater“ ist „Kinder“ im modernen Deutschen natürlicher als „Söhne“ und kann alle Angehörigen umfassen.
theological_decisions:
- issue: Gegenseitige Bundesbeziehung
  choice: „Ich werde ihr Vater sein, und sie werden meine Kinder sein“
  alternative: „Ich werde ihnen zum Vater, und sie werden mir zu Söhnen“
  rationale: Die gewählte Form bewahrt die wechselseitige Beziehung und den Zukunftsaspekt, ohne eine geschlechtsspezifische Einschränkung einzutragen.
- issue: Anschluss des ersten Satzes
  choice: „werden … festhalten“
  alternative: Eine rein nominale Wiedergabe ohne Verb
  rationale: Der vorgelegte geʿezische Ausschnitt setzt syntaktisch einen Gedanken aus dem Kontext fort; die Ergänzung folgt der überlieferten Satzdeutung, ohne den Gegenstand des Festhaltens zu verändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „meine Gebote“ bleibt erhalten, da sie die Aussage betont; „festhalten“ und „befolgen“ sind allgemein verständlich und vermeiden konfessionelle Fachsprache.
