  language: de
  text: Und ich werde ihr Gott sein, und sie werden mein Volk sein – in Wahrheit und in Gerechtigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላከ
  choice: Gott
  rationale: 'Die Form steht im Zusammenhang mit dem vorangehenden Possessivbezug: „ihr Gott“.'
- source_word: ሕዝብየ
  choice: mein Volk
  rationale: Gibt das Substantiv „Volk“ mit dem Suffix der ersten Person Singular unmittelbar wieder.
- source_word: ዘበአማን
  choice: in Wahrheit
  rationale: Bewahrt den abstrakten ethischen bzw. relationalen Sinn von አማን, ohne ihn enger als „Treue“ festzulegen.
- source_word: ዘበጽድቅ
  choice: in Gerechtigkeit
  rationale: Entspricht der parallelen Präpositionalfügung und wahrt den theologischen Begriff „Gerechtigkeit“.
theological_decisions:
- issue: Bezug von „Wahrheit“ und „Gerechtigkeit“
  choice: Die beiden Begriffe werden durch einen Gedankenstrich als Beschreibung der Existenz bzw. Lebensweise des Volkes angeschlossen.
  alternative: „Sie werden mein wahrhaftiges und gerechtes Volk sein.“
  rationale: Die adverbiale Form des Ausgangstextes bleibt erhalten; zugleich wird nicht entschieden, ob die Wendung primär Gottes Bundesverhältnis, die Identität des Volkes oder dessen Lebensführung beschreibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Bundessatz bleibt knapp; der Gedankenstrich macht den abschließenden modalen Zusatz natürlich lesbar, ohne die genuine Mehrdeutigkeit aufzulösen.
