  naturalness: Der Satz ist insgesamt verständlich und würdig. „Jubiläen“ ist im heutigen Deutschen jedoch primär eine Feier bzw. ein Gedenkanlass; im kalendarisch-biblischen Zusammenhang ist „Jubeljahre“ der etablierte und klarere Ausdruck. Die Reihung wird durch eine leichte Anpassung zugleich lesbarer.
  terminology: „Gesetz“, „Zeugnis“, „Einteilungen der Tage“ und die Ewigkeitsformel sind sachgerecht. „Wochen ihrer Jubeljahre“ bewahrt die spezifische Kalenderterminologie des Jubiläenbuchs besser als „Wochen ihrer Jubiläen“.
