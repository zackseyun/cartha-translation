base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/001/026.yaml
  text: And I will write down for you all these things that I am making known to you on this mountain, what is first and what is last and what is to come, in all the divisions of the days in the law and in the testimony and in the weeks of their jubilees forever, until I descend and dwell with them throughout all the ages of eternity.”
translation:
  language: de
  text: Und ich werde für dich all dies aufschreiben, was ich dir auf diesem Berg bekannt mache:[a] was zuerst und was zuletzt ist und was kommen wird, in allen Einteilungen der Tage im Gesetz und im Zeugnis und in den Wochen ihrer Jubeljahre, für immer, bis ich herabkomme und bei ihnen wohne durch alle Zeitalter der Ewigkeit.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »was ich dir bekannt machen werde«.'
    reason: Die imperfektische Form kann neben einer gegenwärtig fortlaufenden auch eine zukünftige Bedeutung tragen.
lexical_decisions:
- source_word: ኵሎ፡ ዘንተ፡ ነገረ
  choice: all dies
  rationale: Gibt den umfassenden Sachbezug natürlicher wieder als das engere »alle diese Worte«.
- source_word: አየድዐከ
  choice: was ich dir bekannt mache
  rationale: Bewahrt den imperfektischen, gegenwärtig-fortlaufenden Charakter der Offenbarung und den direkten Bezug zum Adressaten.
- source_word: ዘቀዳሚ፡ ወዘደኃሪ
  choice: was zuerst ist und was zuletzt ist
  rationale: Folgt der temporalen Gegenüberstellung möglichst eng, ohne sie als »Anfang und Ende« theologisch auszudeuten.
- source_word: ዙፋቤ፡ መዋዕል
  choice: Einteilungen der Tage
  rationale: Gibt die kalendarische Gliederung wieder und wahrt den sachlichen Ton des Jubiläenbuchs.
- source_word: ሱባዔሆሙ፡ ለኢዮቤሌዎን
  choice: Wochen ihrer Jubiläen
  rationale: Erhält die für das Werk charakteristische Verbindung von Siebenerperioden und Jubiläen.
- source_word: በኵሉ፡ ዓለመ፡ ዓለም
  choice: durch alle Zeitalter der Ewigkeit
  rationale: Spiegelt die emphatische geezische Ewigkeitsformel in würdigem, verständlichem Deutsch.
theological_decisions:
- issue: Aspekt der göttlichen Bekanntmachung
  choice: was ich dir bekannt mache
  alternative: was ich dir bekannt gemacht habe
  rationale: Die imperfektische Verbform spricht eher für eine laufende oder gegenwärtige Bekanntmachung; eine abgeschlossene Vergangenheit würde diese Spannung unnötig festlegen.
- issue: Herabkommen und Wohnen
  choice: bis ich herabkomme und bei ihnen wohne
  alternative: bis ich hinabsteige und unter ihnen Wohnung nehme
  rationale: Die schlichte Wiedergabe bewahrt die Aussage von Gottes künftigem Wohnen bei den Menschen, ohne zusätzliche kultische oder inkarnationstheologische Begriffe einzutragen.
- issue: Dauerformel
  choice: für immer … durch alle Zeitalter der Ewigkeit
  alternative: ewig … in alle Ewigkeit
  rationale: Die Wiederholung wird beibehalten, weil sie im Ausgangstext zwei verschiedene Dauerangaben markiert und die eschatologische Weite betont.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an Satzbau und Zeitstruktur des geezischen Textes. Fachlich geprägte Wendungen wie »Einteilungen der Tage«, »Gesetz«, »Zeugnis« und »Wochen ihrer Jubiläen« bleiben erhalten, da sie für die Gedankenwelt des Buches wesentlich sind.
