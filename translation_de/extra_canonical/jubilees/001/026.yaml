  to: Und ich werde für dich all dies aufschreiben, was ich dir auf diesem Berg bekannt mache:[a] was zuerst und was zuletzt ist und was kommen wird, in allen Einteilungen der Tage im Gesetz und im Zeugnis und in den Wochen ihrer Jubeljahre, für immer, bis ich herabkomme und bei ihnen wohne durch alle Zeitalter der Ewigkeit.«
  rationale: Allein der kalendarische Terminus wird von „Jubiläen“ zu „Jubeljahren“ präzisiert. Dies entspricht dem deutschen biblischen Sprachgebrauch und verhindert ein modernes Missverständnis, ohne den Sinn oder die Struktur der Aussage zu verändern. Die geringfügig gestraffte Wiederholung bei „zuerst und zuletzt“ bewahrt die geezische Gegenüberstellung.
