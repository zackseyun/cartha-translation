  text: and Sabbaths and festivals and jubilees and ordinances. And after this they will turn to me from among the nations with all their heart and with all their soul and with all their strength, and I will gather them from among all the nations, and they will seek me so that I may be found by them. And when they seek me with all their heart and with all their soul, I will reveal to them abundant peace in righteousness, and I will transplant them as an upright planting,
translation:
  language: de
  text: und Sabbate, Feste, Jubiläen und Satzungen. Danach werden sie sich aus der Mitte der Völker mir zuwenden mit ihrem ganzen Herzen, mit ihrer ganzen Seele und mit ihrer ganzen Kraft. Ich werde sie aus allen Völkern sammeln, und sie werden mich suchen, damit ich von ihnen gefunden werde. Wenn sie mich mit ihrem ganzen Herzen und mit ihrer ganzen Seele suchen, werde ich ihnen reichen Frieden in Gerechtigkeit offenbaren und sie als eine aufrechte Pflanzung verpflanzen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sie als eine aufrechte Pflanzung versetzen“.'
    reason: Das Verb bezeichnet ein Versetzen bzw. Verpflanzen; die anschließende Bezeichnung als „Pflanzung“ hält die Pflanzenmetapher ausdrücklich fest.
lexical_decisions:
- source_word: ይትመየጡ
  choice: werden sie sich … umkehren
  rationale: Gibt die Rückwendung zu Gott natürlich und mit dem im Kontext naheliegenden Umkehrsinn wieder.
- source_word: አስተጋብኦሙ
  choice: Ich werde sie … sammeln
  rationale: Das Kausativ bezeichnet das Zusammenbringen bzw. Sammeln der Zerstreuten.
- source_word: የኀሡኒ … እትረከቦሙ
  choice: sie werden mich suchen, damit sie mich finden
  rationale: Bewahrt die Zielkonstruktion und formuliert idiomatisch aus der Perspektive der Suchenden.
- source_word: እከሥት
  choice: werde ich ihnen … offenbaren
  rationale: Entspricht dem Sinn von öffnen, kundtun bzw. offenbaren; der Dativbezug wird ausdrücklich wiedergegeben.
- source_word: እፈልሶሙ
  choice: sie … verpflanzen
  rationale: Das Verb bezeichnet ein Versetzen oder Verpflanzen und passt zur vorausgehenden Sammlung aus den Völkern; es ist spezifischer als bloßes „pflanzen“.
- source_word: ተክለ፡ ርቱዐ
  choice: als eine aufrechte Pflanzung
  rationale: Bewahrt die substantivische Pflanzenmetapher und die ethisch-räumliche Spannung von „aufrecht/richtig“.
theological_decisions:
- issue: Bedingung und göttliche Selbstoffenbarung beim Suchen Gottes
  choice: „damit sie mich finden … werde ich ihnen … offenbaren“
  alternative: „damit ich von ihnen gefunden werde“
  rationale: Die deutsche Aktivform ist idiomatisch, ohne die theologische Spannung zwischen menschlichem Suchen und göttlichem Sich-Offenbaren aufzulösen.
- issue: Bedeutung von „in Gerechtigkeit“
  choice: „reichen Frieden in Gerechtigkeit“
  alternative: „reichen Frieden mit Gerechtigkeit“
  rationale: „In Gerechtigkeit“ wahrt die präpositionale Beziehung und lässt offen, ob Gerechtigkeit Sphäre, Grundlage oder Wesensart dieses Friedens bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die anaphorische Dreierformel „mit ihrem ganzen Herzen …“ bleibt erhalten. „Jubiläen“ wird als sachlich verständliche Bezeichnung der Jubeljahre verwendet; „Satzungen“ wahrt den rechtlich-kultischen Ton.
