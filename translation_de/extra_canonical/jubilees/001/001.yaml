lexical_decisions:
- source_word: በፀአቶሙ
  choice: nach dem Auszug
  rationale: Das Substantiv bezeichnet ihr Hinausgehen bzw. ihren Auszug. In diesem biblisch geprägten Zusammenhang ist „Auszug“ im Deutschen natürlich und transparent; die Präposition wird zeitlich als „nach“ wiedergegeben.
- source_word: ለደቂቀ፡ እስራኤል
  choice: der Kinder Israels
  rationale: Bewahrt die traditionelle und allgemein verständliche biblische Bezeichnung für die Nachkommen bzw. das Volk Israel.
- source_word: በወርኅ፡ ሣልስ
  choice: im dritten Monat
  rationale: Direkte, idiomatische Wiedergabe der Monatsangabe ohne Ergänzung eines im Quelltext nicht genannten Monatsnamens.
