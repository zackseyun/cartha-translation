  text: And all will know that I am the God of Israel and the Father of all the children of Jacob, and king on Mount Zion forever, and Zion and Jerusalem will be holy.”
translation:
  language: de
  text: Und alle werden erkennen, dass ich der Gott Israels bin, der Vater aller Kinder Jakobs und König auf dem Berg Zion für immer; und Zion und Jerusalem werden heilig sein.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያእምር
  choice: erkennen
  rationale: Das Verb bezeichnet Wissen bzw. Erkennen; im Zusammenhang ist „erkennen“ natürlich und bewahrt den feierlichen Ton.
- source_word: ደቂቀ ያዕቆብ
  choice: Nachkommen Jakobs
  rationale: Wörtlich „Kinder/Söhne Jakobs“; „Nachkommen“ ist im modernen Deutsch inklusiv verständlich und gibt die genealogische Bedeutung wieder.
- source_word: ንጉሥ
  choice: König
  rationale: Direkte und kontextgerechte Wiedergabe des Herrschertitels.
- source_word: በደብረ ጽዮን
  choice: auf dem Berg Zion
  rationale: Gibt die lokale Präposition und die Bezeichnung „Berg Zion“ unmittelbar wieder.
- source_word: ለዓለመ ዓለም
  choice: für immer
  rationale: Die idiomatische Ewigkeitsformel wird im heutigen Deutsch natürlich mit „für immer“ wiedergegeben.
- source_word: ቅድስት
  choice: heilig
  rationale: Entspricht der religiösen Grundbedeutung und bezieht sich auf Zion und Jerusalem als zusammengehörige Ortsnamen.
theological_decisions:
- issue: Gottes Selbstbezeichnung als Vater
  choice: „der Vater aller Nachkommen Jakobs“
  alternative: „ein Vater aller Nachkommen Jakobs“
  rationale: Der bestimmte Ausdruck des Quelltexts wird bewahrt, ohne die Aussage dogmatisch auszudeuten.
- issue: Dauer des Königtums auf Zion
  choice: „für immer“
  alternative: „von Ewigkeit zu Ewigkeit“
  rationale: „Für immer“ gibt die Ewigkeitsformel klar wieder, ohne eine im Deutschen schwerfällige oder stärker liturgisch geprägte Formulierung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den ge’ezischen Wortlaut. Die Satzstruktur bleibt weitgehend parataktisch; das Semikolon macht den letzten Aussageteil übersichtlich. Keine Ergänzung der in einer früheren Fassung enthaltenen, aber im vorgelegten Quelltext nicht belegten Erscheinungsaussage.
