  text: before Terah his father. And they buried him in Ur of the Chaldeans. And Terah went out from Ur of the Chaldeans, he and his sons, to go into the land of Lebanon and into the land of Canaan, and he settled in the land of Haran, and Abram lived with Terah his father in Haran.
translation:
  language: de
  text: noch vor seinem Vater Terach. Sie begruben ihn in Ur der Chaldäer. Terach zog aus Ur der Chaldäer fort, er und seine Söhne, um in das Land Libanon und in das Land Kanaan zu gehen. Er ließ sich im Land Haran nieder, und Abram wohnte mit seinem Vater Terach in Haran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በቅድመ፡ ታራ፡ አቡሁ
  choice: noch vor seinem Vater Terach
  rationale: Die Wendung setzt den vorhergehenden Satz fort und bezeichnet, dass der dort Genannte vor seinem Vater Terach starb; „noch vor“ gibt den zeitlichen Vergleich im Deutschen natürlich wieder.
- source_word: ኡር፡ ዘከለዳዊያን
  choice: Ur in Chaldäa
  rationale: Die traditionelle Ortsbezeichnung wird in verständlichem modernem Deutsch wiedergegeben; sie entspricht wörtlich etwa „Ur der Chaldäer“.
- source_word: ውእቱ፡ ወውሉዱ
  choice: mit seinen Söhnen
  rationale: Das explizite „er und seine Söhne“ wird idiomatisch als Begleitangabe formuliert, ohne die Mehrzahl der Söhne zu verlieren.
- source_word: ከመ፡ ይምጽኡ
  choice: um … zu gehen
  rationale: Die Ziel- beziehungsweise Absichtsbeziehung des Ausgangstextes bleibt erhalten.
- source_word: ኀደረ
  choice: ließ sich … nieder / wohnte dort
  rationale: Das Verb bezeichnet ein Bleiben oder Wohnen. Die kontextgerechte Variation macht bei Terach die Niederlassung und bei Abram das Wohnen mit seinem Vater deutlich, ohne einen inhaltlichen Unterschied zu behaupten.
