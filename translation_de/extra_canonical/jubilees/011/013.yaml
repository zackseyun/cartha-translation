  text: And they arose in the night and wanted to save their gods from the midst of the fire. And Haran rushed
translation:
  language: de
  text: Da standen sie in der Nacht auf und wollten ihre Götter aus dem Feuer retten. Und Haran stürzte los[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und Haran sprang vor.« Dieser Satzteil gehört inhaltlich wahrscheinlich an den Anfang von Vers 14.'
    reason: Die Bedeutung des Verbs umfasst Losspringen beziehungsweise Vorstürzen; zudem liegt wahrscheinlich eine Verssegmentierungsfrage vor.
lexical_decisions:
- source_word: ወተንሥኡ፡ በሌሊት፡
  choice: Da standen sie in der Nacht auf
  rationale: Gibt das Aufstehen in der Nacht natürlich und nah am ge'ezischen Wortlaut wieder.
- source_word: ወፈቀዱ፡ ያድኅኑ፡
  choice: und wollten … retten
  rationale: Bewahrt die ausdrückliche Absicht, die mit dem Verb für Wollen/Beabsichtigen verbunden ist.
- source_word: አማልክቲሆሙ፡
  choice: ihre Götter
  rationale: Direkte Wiedergabe des Plurals mit Possessivsuffix.
- source_word: እማእከለ፡ እሳት።
  choice: aus dem Feuer
  rationale: Natürliches Deutsch für »aus der Mitte des Feuers«, ohne den Sinn zu verändern.
- source_word: ወሰረረ፡ አራን፡
  choice: Und Haran stürzte los
  rationale: Das Verb bezeichnet ein hastiges Losspringen oder Vorstürzen; »Haran« entspricht der im Deutschen üblichen biblischen Namensform.
theological_decisions:
- issue: Bezeichnung der Kultbilder als »Götter«
  choice: ihre Götter
  alternative: ihre Götzen
  rationale: Der Quelltext sagt formal »ihre Götter«. »Götzen« würde eine wertende theologische Deutung stärker in den Haupttext eintragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Der unvollständige Schluss wird beibehalten, da der überlieferte Versausschnitt mitten im Satz endet; die wahrscheinliche Zugehörigkeit zu Vers 14 wird in der Fußnote kenntlich gemacht.
