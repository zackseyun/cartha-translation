  text: um sie zu retten, wurde über ihm ein Feuer entzündet, und er verbrannte im Feuer und starb in Ur der Chaldäer.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ከመ፡ ያድኅኖሙ፡
  choice: um sie zu retten
  rationale: Gibt den finalen Sinn von ከመ mit dem Verb ‚retten‘ und dem Objektsuffix der 3. Person Plural direkt wieder.
- source_word: ወነደደ፡ እሳት፡ ላዕሌሁ፡
  choice: Da wurde über ihm ein Feuer entzündet
  rationale: Bewahrt die passive Aussage und die räumliche Wendung ‚über ihm‘; ‚entzündet‘ entspricht der revidierten quellennahen Deutung besser als ‚loderte‘.
- source_word: ወውዐየ፡ በእሳት፡
  choice: er verbrannte im Feuer
  rationale: Gibt das Verb des Verbrennens und die instrumentale/lokative Feuerangabe knapp und natürlich wieder.
- source_word: ወሞተ፡ በኡር፡ ዘከለዳዊያን፡
  choice: und starb in Ur in Chaldäa
  rationale: Die Genitivverbindung bezeichnet Ur als den zu den Chaldäern gehörenden beziehungsweise in ihrem Land gelegenen Ort; ‚Ur in Chaldäa‘ ist im modernen Deutschen klar und vermeidet das heute missverständliche ‚Ur der Chaldäer‘.
