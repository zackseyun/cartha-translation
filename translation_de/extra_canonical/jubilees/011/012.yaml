  text: In that fourth week, in its fourth year, Abram arose by night and burned the house of idols, and he burned everything that was in the house, and no person knew it.
translation:
  language: de
  text: In jener vierten Jahrwoche, in ihrem vierten Jahr, stand Abram nachts auf und verbrannte das Haus der Götzen. Er verbrannte alles, was sich in dem Haus befand, und niemand wusste davon.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሱባዔ፡ ራብዕ
  choice: vierte Jahrwoche
  rationale: ሱባዔ bezeichnet wörtlich eine Siebenerperiode; im chronologischen Zusammenhang des Jubiläenbuches ist eine Periode von sieben Jahren gemeint. „Jahrwoche“ gibt dies im Deutschen knapp und verständlich wieder.
- source_word: ተንሥአ
  choice: stand … auf
  rationale: Entspricht der Grundbedeutung „sich erheben/aufstehen“ und passt natürlich zur nächtlichen Handlung.
- source_word: አውዐየ፡ ቤተ፡ ጣዖታት
  choice: setzte das Götzenhaus in Brand
  rationale: Gibt die aktive Brandlegung idiomatisch wieder; „Götzenhaus“ bewahrt die kompakte Genitivverbindung des Ausgangstextes.
- source_word: ሰብእ፡ አልቦ፡ ዘአእመረ
  choice: niemand wusste davon
  rationale: Natürliche deutsche Wiedergabe der wörtlichen Aussage, dass es keinen Menschen gab, der es wusste.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die Wiederholung des Verbrennens bleibt erhalten, während der erste Satz mit „in Brand setzen“ idiomatisch formuliert ist. Das am Anfang der gelieferten Textzeile stehende አብራም wurde entsprechend der Quellenprüfung als Segmentierungsrest des vorherigen Verses nicht nochmals wiedergegeben.
