  verdict: revise
  source_fidelity: Die Zeitangabe („in jener vierten Jahrwoche, in ihrem vierten Jahr“) gibt die chronologische Formulierung angemessen wieder. Das einleitende አብራም ist, wie im Kontext vermerkt, ein Segmentierungsrest aus V. 11. Für አውዐየ ist jedoch „verbrannte“ näher am zweimaligen Verb des Ausgangstextes als die abgeschwächte erste Umschreibung „setzte ... in Brand“.
  naturalness: Der Text ist modernes, natürliches Standarddeutsch. „Haus der Götzen“ ist gegenüber „Götzenhaus“ etwas eindeutiger und vermeidet die mögliche Assoziation eines festen deutschen Begriffs für einen heidnischen Kultbau.
  terminology: „Jahrwoche“ ist im chronologischen System des Jubiläenbuches passend. „Götzen“ gibt ጣዖታት sachgerecht wieder, ohne eine zusätzliche kultische Deutung einzutragen.
