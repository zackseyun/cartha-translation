base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/011/004.yaml
  text: And the prince Mastema exerted himself to do all this, and he sent other spirits, those set under his hand, to do every kind of error and sin and transgression, to corrupt and destroy and to shed blood upon the earth.
translation:
  language: de
  text: Und der Fürst Mastema setzte alles daran, dies alles zu tun. Er sandte weitere Geister aus, die seiner Hand unterstellt waren, damit sie jede Art von Irrtum, Sünde und Übertretung hervorriefen, Verderben und Vernichtung brachten und Blut auf der Erde vergossen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der bereitgestellte äthiopische Quellenausschnitt enthält den Wortlaut dieses Verses nicht; die Wiedergabe folgt daher der geprüften englischen Konsultationsschicht.
    reason: 'Textkritische Transparenz: Im gelieferten Quellenausschnitt folgt auf Vers 1 unmittelbar Vers 6, sodass Jub 11,4 dort nicht direkt geprüft werden kann.'
lexical_decisions:
- source_word: prince Mastema
  choice: der Fürst Mastema
  rationale: Der Titel wird formal und ohne konfessionelle Deutung wiedergegeben; Mastema bleibt als Eigenname erhalten.
- source_word: exerted himself
  choice: setzte alles daran
  rationale: Gibt die nachdrückliche, zielgerichtete Betätigung in natürlichem modernem Deutsch wieder.
- source_word: those set under his hand
  choice: die seiner Hand unterstellt waren
  rationale: Bewahrt das Herrschaftsbild der Hand und macht zugleich das Unterordnungsverhältnis verständlich.
- source_word: error and sin and transgression
  choice: Irrtum, Sünde und Übertretung
  rationale: Die drei unterscheidbaren Begriffe und ihre steigernde Reihung bleiben erhalten.
- source_word: to corrupt and destroy
  choice: Verderben und Vernichtung brachten
  rationale: Bewahrt beide Aspekte, ohne sie zu einem einzigen allgemeinen Ausdruck zusammenzuziehen.
- source_word: to shed blood upon the earth
  choice: Blut auf der Erde vergossen
  rationale: Die konkrete Gewaltformulierung wird direkt und idiomatisch wiedergegeben.
theological_decisions:
- issue: Stellung und Wesen Mastemas
  choice: Mastema wird lediglich als „Fürst“ bezeichnet; seine genaue dämonologische Einordnung bleibt offen.
  alternative: Mastema ausdrücklich als Satan, Teufel oder obersten Dämon bezeichnen.
  rationale: Der überlieferte Titel soll nicht durch eine bestimmte theologische Identifikation erweitert werden.
- issue: Verantwortung der ausgesandten Geister
  choice: Die Geister rufen Irrtum, Sünde und Übertretung hervor und bringen Verderben, Vernichtung und Blutvergießen.
  alternative: Die Formulierung so abschwächen, dass sie Menschen lediglich versuchen.
  rationale: Die starke Kausal- und Handlungssprache der Konsultationsschicht wird bewahrt, ohne die damit verbundene Spannung zur menschlichen Verantwortung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Aufzählungen und die starke Handlungssprache bleiben erhalten; unnötige dogmatische Präzisierungen werden vermieden.
