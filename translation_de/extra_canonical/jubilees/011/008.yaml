lexical_decisions:
- source_word: ያምልክዎሙ፡ ወይስብሕዎሙ
  choice: sie sie anbeten und preisen
  rationale: Beide Verben haben ein Subjekt in der 3. Person Plural; das angehängte Objektpronomen ist ebenfalls Plural. Die Wiederholung »sie sie« ist im Deutschen eindeutig, wenn auch bewusst eng am Ausgangstext.
- source_word: አርምም፡ ወልድየ
  choice: Schweig, mein Sohn
  rationale: Der Imperativ und die Anrede werden knapp, natürlich und würdevoll wiedergegeben.
- source_word: ከመ፡ አይቅትሉከ
  choice: sonst töten sie dich
  rationale: Gibt die warnende beziehungsweise verhütende Funktion der Konstruktion idiomatisch wieder.
- source_word: ወነገረ
  choice: Und er erzählte
  rationale: Das Verb bezeichnet das Mitteilen oder Erzählen; der unvollständige Satzanschluss bleibt erhalten, da der Versauszug an dieser Stelle endet.
theological_decisions:
- issue: Subjekt der Anbetung und des Lobpreises
  choice: sie
  alternative: du/ihr
  rationale: Die ge'ezischen Verbformen weisen auf die 3. Person Plural. Daher wird die frühere alternative Deutung mit einem Subjekt der 2. Person nicht übernommen.
