base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/011/003.yaml
  text: And in the days of Serug there arose wars and all the sons of men turned to making graven images and carved images and unclean things, and evil spirits were helping them and leading them astray, so that they might commit transgression and uncleanness.
translation:
  language: de
  text: Und in den Tagen Serugs[a] brachen Kriege aus, und alle Menschen begannen, Götzenbilder, Schnitzbilder und unreine Dinge anzufertigen. Böse Geister halfen ihnen und führten sie in die Irre, sodass sie Übertretung und Unreinheit begingen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Seroh“.'
    reason: Überliefert beziehungsweise früher wiedergegeben als abweichende Namensform.
lexical_decisions:
- source_word: Serug
  choice: Serug
  rationale: Die standardisierte Namensform entspricht der biblischen Überlieferung und der revidierten Lesart; eine abweichende Wiedergabe wird in der Fußnote genannt.
- source_word: graven images and carved images
  choice: Götzenbilder, Schnitzbilder
  rationale: Die beiden annähernd parallelen Bildbegriffe bleiben unterschieden; „Götzenbilder“ macht den kultischen Zusammenhang deutlich, „Schnitzbilder“ bewahrt den Herstellungsvorgang.
- source_word: unclean things / simulacra
  choice: unreine Bildwerke
  rationale: Der Kontext handelt von angefertigten Kultbildern; „Bildwerke“ ist verständlicher und präziser als das unspezifische „Dinge“, ohne die Unreinheit zu deuten.
- source_word: evil spirits
  choice: böse Geister
  rationale: Natürliche, theologisch nicht weiter spezifizierende Wiedergabe.
- source_word: transgression and uncleanness
  choice: Übertretung und Unreinheit
  rationale: Bewahrt die zwei verschiedenen moralisch-kultischen Begriffe und ihre Spannung.
theological_decisions:
- issue: Rolle der bösen Geister
  choice: „halfen ihnen und führten sie in die Irre“
  alternative: „verführten sie“
  rationale: 'Die doppelte Aussage der Überlieferung bleibt erhalten: Die Geister unterstützen das Handeln und leiten die Menschen zugleich fehl, ohne dadurch die menschliche Verantwortung aufzuheben.'
- issue: Zweck- oder Folgesatz bei der Sünde
  choice: „sodass sie … begingen“
  alternative: „damit sie … begingen“
  rationale: „Sodass“ bewahrt den Zusammenhang als bewirkte Folge und vermeidet, eine ausdrückliche Absicht der Geister stärker festzulegen, als es die knappe Überlieferung verlangt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde für gute Verständlichkeit in zwei Sätze gegliedert; die begrifflichen Doppelungen der Vorlage bleiben soweit sinnvoll erhalten.
