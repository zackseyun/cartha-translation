  yaml_path: translation/extra_canonical/jubilees/011/016.yaml
  text: for two weeks of years.[16] And in the sixth week, in its fifth year, Abram sat up through the night at the beginning of the seventh month to observe the stars from evening until dawn, to see what would be the character of the year with respect to the rains, and he was there by himself as he sat and watched.
translation:
  language: de
  text: zwei Jahrwochen lang.[a] Und in der sechsten Jahrwoche, in ihrem fünften Jahr, blieb Abram zu Beginn des siebten Monats die Nacht über wach, um die Sterne vom Abend bis zum Morgengrauen zu beobachten. So wollte er erkennen, wie das Jahr hinsichtlich der Regenfälle werden würde. Dabei saß er allein da und beobachtete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zwei Wochen von Jahren“, also zwei Siebenergruppen von Jahren. Das Jubiläenbuch gliedert die Zeit regelmäßig in solche Einheiten.'
    reason: cultural_note
lexical_decisions:
- source_word: ሱባዔ፡ ዓመታት
  choice: Jahrwochen
  rationale: Die Wendung bezeichnet Siebenergruppen von Jahren. „Jahrwochen“ ist im Deutschen verständlich, knapp und bewahrt die schematische Zeitrechnung des Jubiläenbuches.
- source_word: በሠርቀ፡ ወርኅ፡ ሳብዕ
  choice: zu Beginn des siebten Monats
  rationale: ሠርቀ ወርኅ bezeichnet hier den Monatsanfang beziehungsweise das Aufgehen des neuen Monats; die natürliche deutsche Wiedergabe vermeidet eine unbelegte Präzisierung auf eine bestimmte Mondphase.
- source_word: ያበይነ፡ ከዋክብተ
  choice: die Sterne ... zu beobachten
  rationale: Das Verb bezeichnet aufmerksames Betrachten beziehungsweise Beobachten; der Kontext ist eine nächtliche Beobachtung der Sterne.
- source_word: ግብረ፡ ዓመት
  choice: wie das Jahr ... werden würde
  rationale: Wörtlich etwa „das Wirken/die Beschaffenheit des Jahres“. Die Formulierung gibt idiomatisch die erwartete Art oder den Verlauf des Jahres wieder.
- source_word: በዝናማት
  choice: hinsichtlich der Regenfälle
  rationale: Die Pluralform verweist auf die Regenfälle beziehungsweise Regenzeiten; die Wiedergabe hält den Bezug ausdrücklich fest.
- source_word: ውእቱ፡ ባሕቲቱ፡ ይነብር
  choice: Dabei saß er allein da
  rationale: Die Quelle betont, dass Abram sich allein dort aufhielt beziehungsweise saß. Die deutsche Formulierung bewahrt diese Betonung ohne unnötige Doppelung.
theological_decisions:
- issue: Art von Abrams Sternbeobachtung
  choice: neutral als Beobachtung der Sterne wiedergegeben
  alternative: als astrologische Wahrsagerei oder astronomische Forschung deuten
  rationale: Der Vers beschreibt Zweck und Dauer der Beobachtung, legt ihre religiöse oder wissenschaftliche Einordnung jedoch nicht ausdrücklich fest. Die Übersetzung importiert daher keine wertende Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Jahrwoche“ bewahrt den besonderen chronologischen Sprachgebrauch, während die übrige Syntax für heutige Leser geglättet ist. Der Fußnotenmarker steht unmittelbar nach der erläuterten Wendung.
