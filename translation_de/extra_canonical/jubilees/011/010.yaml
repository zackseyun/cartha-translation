  text: And Aran his brother took for himself a wife in the third year of the third week, and she bore him a son in the seventh year of this week, and he called his name Ur.
translation:
  language: de
  text: Und sein Bruder Aran nahm sich im dritten Jahr der dritten Jahrwoche eine Frau. Sie gebar ihm im siebten Jahr dieser Jahrwoche einen Sohn, und er gab ihm den Namen Ur.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und er nannte seinen Namen Ur“.'
    reason: Dokumentiert die semitisch geprägte Namensformel hinter der natürlichen deutschen Wiedergabe.
lexical_decisions:
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: nahm sich … eine Frau
  rationale: Gibt die äthiopische Heiratsformel eng und zugleich in natürlichem Deutsch wieder.
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Bezeichnet im Jubiläenbuch eine Siebenjahresperiode; „Jahrwoche“ bewahrt diese kalendarische Bedeutung knapp.
- source_word: ወወለደት፡ ሎቱ፡ ወልደ
  choice: Sie gebar ihm … einen Sohn
  rationale: Entspricht der Satzstruktur und erhält sowohl den männlichen Empfängerbezug als auch das Geschlecht des Kindes.
- source_word: ወጸውዐ
  choice: und er gab ihm den Namen Ur
  rationale: Der vorgelegte Versausschnitt endet bei „und er nannte/rief“; Name und Ergänzung werden aufgrund der bestätigten Verssegmentierung aus dem unmittelbar anschließenden Text aufgenommen, damit der Satz vollständig ist.
theological_decisions: []
translation_notes:
