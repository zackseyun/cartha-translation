base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/011/005.yaml
  text: And the prince Mastema exerted himself to do all this, and he sent other spirits—those placed under his hand—to do all manner of wrong and sin and all manner of transgression, to corrupt and destroy, and to shed blood on the earth.
translation:
  language: de
  text: Und der Fürst Mastema setzte alles daran, dies alles zu tun, und sandte andere Geister aus, die seiner Gewalt unterstellt waren, damit sie jede Art von Unrecht und Sünde und jede Art von Übertretung begingen, verderbten und zerstörten und Blut auf der Erde vergossen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: prince Mastema
  choice: der Fürst Mastema
  rationale: Bewahrt den personalen Eigennamen und gibt den Herrschaftstitel in natürlichem, würdigem Deutsch wieder.
- source_word: exerted himself
  choice: setzte alles daran
  rationale: Drückt entschlossenes, intensives Bemühen idiomatisch aus, ohne ein zusätzliches Motiv einzutragen.
- source_word: spirits—those placed under his hand
  choice: Geister, die seiner Gewalt unterstellt waren
  rationale: Gibt das Herrschaftsverhältnis der Wendung „unter seiner Hand“ verständlich wieder; eine rein wörtliche Fassung wäre im heutigen Deutsch missverständlich.
- source_word: all manner of wrong and sin and all manner of transgression
  choice: jede Art von Unrecht und Sünde und jede Art von Übertretung
  rationale: Erhält die aufzählende, verstärkende Struktur und unterscheidet Unrecht, Sünde und Übertretung.
- source_word: to corrupt and destroy
  choice: Verderben und Vernichtung brachten
  rationale: Bewahrt die beiden eng verbundenen Schadensbegriffe und fügt sie grammatisch natürlich in den deutschen Satz ein.
- source_word: to shed blood on the earth
  choice: Blut auf der Erde vergossen
  rationale: Bewahrt die konkrete biblische Redeweise für gewaltsames Töten.
theological_decisions:
- issue: Personalität Mastemas
  choice: Mastema wird mit personalen Formen bezeichnet und als handelnder Fürst dargestellt.
  alternative: Mastema unpersönlich oder lediglich als abstrakte Feindschaft wiederzugeben.
  rationale: Die geprüfte Textüberlieferung stellt Mastema als personales Wesen dar, das untergeordnete Geister aussendet.
- issue: Verhältnis Mastemas zu den anderen Geistern
  choice: Die Geister sind seiner Gewalt unterstellt.
  alternative: Die Geister lediglich als mit ihm verbunden oder von ihm beeinflusst zu beschreiben.
  rationale: Die Herrschaftsformel „unter seiner Hand“ bezeichnet ausdrücklich Unterordnung, ohne eine weitergehende Dämonologie auszuformulieren.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die im Payload abgedruckte ge’ezische Passage springt von Vers 1 zu Vers 6 und enthält Vers 5 nicht; daher folgt der Entwurf der auditierten englischen Konsultationsschicht samt jüngster Quellenkorrektur. Veraltete Fußnoten aus einer nachweislich falschen früheren Fassung wurden nicht übernommen.
