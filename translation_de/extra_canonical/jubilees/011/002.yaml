base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/011/002.yaml
  text: And the son grew[2], and his father taught him the investigations of the Chaldeans, to divine and to practice augury according to the signs of heaven.
translation:
  language: de
  text: 'Und der Sohn wuchs heran[a], und sein Vater lehrte ihn die Schriften der Chaldäer: Wahrsagung zu treiben und nach den Zeichen des Himmels Vorzeichen zu deuten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Verse 2–5 fehlen in der vorgelegten Segmentierung des ge’ezischen Textes. Die Verszählung und der Kapitelzusammenhang setzen hier jedoch einen dazwischenliegenden Abschnitt über Seroh, chaldäische Mantik und Mastemas Rolle beim Götzendienst voraus. Die Übersetzung gibt daher den aus der überlieferten Kapiteltradition erschließbaren Sinn von Vers 2 wieder.
    reason: Hinweis auf die Lücke in der gelieferten Textgrundlage und den rekonstruierten Charakter der Übersetzung.
lexical_decisions:
- source_word: nicht im vorgelegten ge’ezischen Textsegment erhalten (entspricht „investigations of the Chaldeans“)
  choice: die Forschungen der Chaldäer
  rationale: Bewahrt den Sinn eines überlieferten chaldäischen Wissensgebiets, ohne es vorschnell als Wissenschaft oder bloßen Aberglauben zu bewerten.
- source_word: nicht im vorgelegten ge’ezischen Textsegment erhalten (entspricht „to divine“)
  choice: wahrzusagen
  rationale: Gibt die religiös-mantische Praxis klar und in allgemein verständlichem Deutsch wieder.
- source_word: nicht im vorgelegten ge’ezischen Textsegment erhalten (entspricht „to practice augury“)
  choice: Vorzeichen zu deuten
  rationale: Natürliches modernes Deutsch für die Deutung von Omina; vermeidet das heute missverständliche Wort „Vogelschau“, da der Satz allgemein auf Himmelszeichen verweist.
- source_word: nicht im vorgelegten ge’ezischen Textsegment erhalten (entspricht „signs of heaven“)
  choice: Zeichen des Himmels
  rationale: Formnah und zugleich idiomatisch; die mögliche astrologische Bedeutung bleibt erhalten, ohne näher bestimmt zu werden.
theological_decisions:
- issue: Bewertung der chaldäischen Wahrsagepraxis
  choice: Die Praxis wird sachlich beschrieben, ohne im Vers selbst eine ausdrückliche Wertung hinzuzufügen.
  alternative: Die Praxis ausdrücklich als Götzendienst oder Täuschung bezeichnen.
  rationale: Eine solche theologische Einordnung mag sich aus dem weiteren Zusammenhang ergeben, steht aber nicht im rekonstruierten Wortlaut dieses Verses und soll daher nicht importiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht deutlich, worin die genannten „Forschungen“ bestanden. Wegen der Lücke im bereitgestellten ge’ezischen Ausgangstext stützt sich die Formulierung auf den rekonstruierbaren Kapitelzusammenhang und die geprüfte englische Konsultationsschicht; sie erhebt keinen Anspruch auf eine direkte Wort-für-Wort-Wiedergabe eines hier nicht erhaltenen ge’ezischen Verssegments.
