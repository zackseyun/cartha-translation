  yaml_path: translation/extra_canonical/jubilees/011/001.yaml
  text: In the thirty-fifth jubilee[1], in the third week, in its first year, Reu took for himself a wife, and her name was Ora, the daughter of Ur, the son of Kesed. And she bore him a son, and he called his name Seroh, in the seventh year of this week, in this jubilee.
translation:
  language: de
  text: Im fünfunddreißigsten Jubiläum[a], in der dritten Jahrwoche, in deren erstem Jahr, nahm sich Reu eine Frau. Sie hieß Ora und war die Tochter von Ur, dem Sohn Keseds. Sie gebar ihm einen Sohn, den er im siebten Jahr dieser Jahrwoche, in diesem Jubiläum, Seroh nannte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der äthiopische Text bietet „fünfunddreißigstes“ oder eine verderbte Form davon. Diese Lesart entspricht der inneren Zeitrechnung des Jubiläenbuches.
    reason: textual_correction
lexical_decisions:
- source_word: እዮቤልው
  choice: Jubiläum
  rationale: Bezeichnet im chronologischen System des Buches einen Zeitraum von 49 Jahren; „Jubiläum“ bewahrt den etablierten Fachbegriff.
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Gemeint ist im Kontext eine Siebenjahresperiode. „Jahrwoche“ macht dies im Deutschen deutlicher als das bloße „Woche“.
- source_word: ነሥአ፡ ሎቱ፡ ... ብእሲተ
  choice: nahm sich ... eine Frau
  rationale: Gibt die äthiopische Heiratsformel nah am Wortlaut und zugleich idiomatisch wieder.
- source_word: ጸውዐ፡ ስሞ
  choice: gab ihm den Namen
  rationale: Natürliche deutsche Wiedergabe der Formel „er nannte seinen Namen“, ohne den Sinn zu verändern.
- source_word: ሴሮኅ
  choice: Seroh
  rationale: Transliteration des im äthiopischen Text bezeugten Eigennamens; die Form der konsultierten englischen Fassung wird beibehalten.
