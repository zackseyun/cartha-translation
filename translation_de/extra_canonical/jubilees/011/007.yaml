  text: And if I tell them the truth, they will kill me, for their souls are attached to them.
translation:
  language: de
  text: Und wenn ich ihnen die Wahrheit sage, werden sie mich töten; denn ihre Seelen hängen an ihnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽድቀ
  choice: die Wahrheit
  rationale: Das Wort bezeichnet hier im Gegensatz zum Götzendienst das Wahre bzw. Richtige; im Zusammenhang einer Aussage ist „die Wahrheit“ die natürliche deutsche Wiedergabe.
- source_word: ይቀትሉኒ
  choice: werden sie mich töten
  rationale: Gibt die verbale Aussage samt Objekt der ersten Person klar und unmittelbar wieder.
- source_word: ነፍሶሙ
  choice: ihr Herz
  rationale: Wörtlich steht „ihre Seele“; idiomatisch bezeichnet die Wendung jedoch ihre innere Bindung bzw. Zuneigung. „Ihr Herz“ bewahrt den anthropologischen Bildcharakter in natürlichem Deutsch.
- source_word: ተለውት … ኀቤሆሙ
  choice: hängt an ihnen
  rationale: Die Konstruktion drückt eine feste innere Bindung an die zuvor genannten Gegenstände aus. „Hängt an ihnen“ ist natürlich und fügt weder Anbetung noch eine andere ausdrücklich nicht genannte Handlung hinzu.
theological_decisions:
- issue: Art der Bindung an die zuvor genannten Götzen
  choice: ihr Herz hängt an ihnen
  alternative: ihre Seelen sind ihnen zugewandt, sodass sie sie anbeten
  rationale: Der Ausgangstext nennt die Bindung, aber in diesem Satz keine ausdrückliche Anbetung. Die Übersetzung wahrt diese Offenheit und vermeidet eine interpretierende Erweiterung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe Satzbau und die kausale Verknüpfung bleiben erhalten; „Herz“ und „hängt an“ ergeben eine verständliche deutsche Wendung ohne zusätzliche Auslegung.
