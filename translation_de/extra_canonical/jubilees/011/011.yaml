  text: Sein Name war Lot. Und sein Bruder Nahor nahm sich eine Frau. Und im sechzigsten Jahr seines Lebens
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስሞ፡ ሎጥ
  choice: Sein Name war Lot
  rationale: Die äthiopische Namensformel wird in natürlichem modernem Deutsch als vollständiger Satz wiedergegeben.
- source_word: ነሥአ፡ ሎቱ፡ ብእሲተ
  choice: nahm sich eine Frau
  rationale: Die Wendung bezeichnet die Eheschließung; die relativ formnahe Wiedergabe bewahrt die Ausdrucksweise des Ausgangstextes.
- source_word: ወበዓመት፡ ዘስሳ፡ ዘሕይወቱ
  choice: Und im sechzigsten Jahr seines Lebens
  rationale: Das Possessivsuffix wird als „seines“ wiedergegeben. Der Ausgangstext nennt hier keinen Namen, und der unvollständige Satzbau wird beibehalten, da der Vers in den folgenden Vers übergeht.
theological_decisions:
- issue: Bezug von „seines Lebens“
  choice: Das Pronomen bleibt ohne ergänzten Eigennamen stehen.
  alternative: „im sechzigsten Lebensjahr Abrams“
  rationale: Der gegebene äthiopische Text enthält an dieser Stelle keinen Namen. Eine ausdrückliche Zuordnung zu Abram würde die im Text vorhandene Bezugsfrage stillschweigend entscheiden.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die parataktische Struktur mit wiederholtem „Und“ sowie der am Versende offene Satz werden quellengetreu bewahrt.
