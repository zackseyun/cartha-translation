  text: for those who make them, and a straying of heart for those who worship them. Do not worship them.” And his father said to him[6], “I also know, my son, but what can I do for a people who have made me subject to them?
translation:
  language: de
  text: 'für diejenigen, die sie herstellen, und eine Verirrung des Herzens für diejenigen, die sie anbeten.[a] Bete sie nicht an!“ Da sagte sein Vater zu ihm: „Auch ich weiß das, mein Sohn. Doch was kann ich gegen ein Volk tun, das mich gezwungen hat, ihm zu gehorchen?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Satzteil „eine Verirrung des Herzens für diejenigen, die sie anbeten“ ist im überlieferten ge’ezischen Text schwer verständlich. Möglich ist auch: „Die Herzen derjenigen, die sie anbeten, werden irregeführt.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወከሕተት፡ ልብ
  choice: und eine Verirrung des Herzens
  rationale: Die schwierige nominale Wendung wird formal bewahrt, statt sie ohne sichere Grundlage in einen vollständigen Verbalsatz umzudeuten.
- source_word: ያመልክዎሙ / አታምልክዎሙ
  choice: sie anbeten / Bete sie nicht an
  rationale: Das Verb bezeichnet hier im Zusammenhang mit Götzen kultische Verehrung; „anbeten“ ist im Deutschen klar und natürlich.
- source_word: እትአዘዝ
  choice: gezwungen hat, ihm zu gehorchen
  rationale: Die Form gehört zum Bedeutungsfeld „gehorchen, untertan sein“. Die kausative Einbettung durch „das mich … hat“ wird im Deutschen idiomatisch mit „gezwungen hat“ wiedergegeben.
theological_decisions:
- issue: Art der Verehrung der hergestellten Gegenstände
  choice: anbeten
  alternative: verehren
  rationale: Der Kontext handelt von Götzen und kultischer Hinwendung. „Anbeten“ bildet diese religiöse Aussage deutlich ab, ohne zusätzliche konfessionelle Deutung.
- issue: Verhältnis des Vaters zum Volk
  choice: das mich gezwungen hat, ihm zu gehorchen
  alternative: das mich ihm untertan gemacht hat
  rationale: Beide geben Unterordnung wieder; die gewählte Fassung klingt in moderner Standardsprache natürlicher und bewahrt den Zwangssinn des Kontextes.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Vers setzt offenbar einen Satz aus dem vorhergehenden Vers fort; daher beginnt die Übersetzung mit einem kleingeschriebenen Satzfragment. Die textuelle Schwierigkeit der ersten Klausel bleibt im Haupttext sichtbar und wird in der Fußnote erläutert.
