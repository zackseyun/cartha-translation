  text: He told this matter to his two brothers[9], and they were angry with him, and they kept silent. And in the fortieth jubilee, in the second week, in its seventh year, Abram took for himself a wife, and her name was Sarai, the daughter of his father, and she became his wife.
translation:
  language: de
  text: Er erzählte dies seinen beiden Brüdern. Da wurden sie zornig auf ihn und schwiegen. Im vierzigsten Jubiläum, in der zweiten Jahrwoche, in deren siebtem Jahr, nahm Abram sich eine Frau. Sie hieß Sarai, war die Tochter seines Vaters[a] und wurde seine Frau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „die Tochter seines Vaters“ wird so wiedergegeben, wie sie in der Textüberlieferung vorliegt, und nicht an die Darstellung in Genesis angeglichen. Möglicherweise beruht sie auf einem Textproblem oder auf einem abweichenden Verwandtschaftsausdruck dieser Überlieferung.
    reason: textual_variant
lexical_decisions:
- source_word: ነገረ
  choice: er erzählte
  rationale: Das Verb bezeichnet hier das Mitteilen beziehungsweise Erzählen einer Sache; zusammen mit ዘንተ ergibt sich natürlich „Er erzählte dies“.
- source_word: ተምዑ፡ ላዕሌሁ
  choice: sie wurden zornig auf ihn
  rationale: Die Wendung bezeichnet gegen ihn gerichteten Zorn. Die deutsche Formulierung bewahrt sowohl die Pluralform als auch die personale Ausrichtung.
- source_word: አርመሙ
  choice: sie schwiegen
  rationale: Die überlieferte Verbform steht in der dritten Person Plural. Daher sind die beiden Brüder das Subjekt, nicht Abram.
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Gemeint ist eine Siebenerperiode von Jahren. „Jahrwoche“ ist im Deutschen verständlich und bildet die chronologische Terminologie des Jubiläenbuches präzise ab.
- source_word: ብእሲተ
  choice: eine Frau
  rationale: Das Wort kann „Frau“ oder im Kontext „Ehefrau“ bedeuten. Bei „nahm sich“ ist „eine Frau“ natürlich; der folgende Satz stellt ausdrücklich fest, dass sie seine Frau wurde.
- source_word: ሶራ
  choice: Sarai
  rationale: Die äthiopische Namensform wird entsprechend der in diesem Erzählstadium gebräuchlichen biblischen Namensform wiedergegeben; sie ist noch nicht in „Sara“ geändert.
theological_decisions:
- issue: Verwandtschaftsangabe zu Sarai
  choice: „die Tochter seines Vaters“ unverändert wiedergeben
  alternative: Mit Genesis 20,12 harmonisieren oder als andere Verwandtschaftsbeziehung umdeuten
  rationale: Die überlieferte Angabe wird nicht stillschweigend mit einer anderen Tradition ausgeglichen. Die mögliche textliche oder genealogische Spannung wird in einer Fußnote offengelegt.
- issue: Subjekt des Schweigens
  choice: Die Brüder schwiegen
  alternative: Abram schwieg
  rationale: Die ge'ezische Verbform ወአርመሙ ist Plural und bezieht sich am naheliegendsten auf die beiden Brüder.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die kurzen Hauptsätze bewahren den erzählerischen Rhythmus, während „Jahrwoche“ die besondere Chronologie des Werkes präzise und verständlich ausdrückt. Die Pluralform bei „schwiegen“ folgt unmittelbar dem Ge'ez.
