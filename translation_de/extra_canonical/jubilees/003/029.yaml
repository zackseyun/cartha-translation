translation:
  language: de
  text: Adam allein aber gab er unter allen wilden Tieren und allem Vieh die Mittel, seine Scham zu bedecken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Adam allein aber gab er die Mittel, seine Scham zu bedecken, aus allen wilden Tieren und allem Vieh.«'
    reason: Die Schlussgruppe kann syntaktisch entweder Adams Sonderstellung unter den Tieren hervorheben oder die Tiere als Herkunftsbereich der gegebenen Bedeckungsmittel näher bestimmen. Die Fußnote bewahrt diese Möglichkeit, ohne »aus/unter« durch das nicht belegte »vor« zu ersetzen.
lexical_decisions:
- source_word: ለአዳም፡ ባሕቲቱ
  choice: Adam allein aber
  rationale: Gibt die exklusive Hervorhebung Adams und den fortführenden Gegensatz der ge'ezischen Wortfolge natürlich wieder.
- source_word: ወሀቦ፡ ይክድን
  choice: gab er … die Möglichkeit, … zu bedecken
  rationale: Bewahrt die Konstruktion aus »geben« und dem abhängigen Verb »bedecken«; im Deutschen macht »die Möglichkeit« den Sinn verständlich, ohne ein bestimmtes Mittel in den Text einzutragen.
- source_word: ኀፍረቶ
  choice: seine Scham
  rationale: Entspricht der wörtlichen Bedeutung; gemeint ist im Kontext die zu bedeckende Blöße beziehungsweise Schamgegend.
- source_word: እምኵሉ፡ አራዊት ወእንስሳ
  choice: unter allen wilden Tieren und allem Vieh
  rationale: Gibt die Unterscheidung zwischen wilden Tieren und domestizierten beziehungsweise größeren Landtieren wieder und bezieht die Präpositionalgruppe syntaktisch auf Adams Sonderstellung.
theological_decisions:
- issue: Bezug von »unter/aus allen wilden Tieren und allem Vieh«
  choice: Die Wendung wird auf »Adam allein« bezogen.
  alternative: 'Die Wendung könnte an das Bedecken angeschlossen werden: »… seine Scham vor allen wilden Tieren und allem Vieh zu bedecken.«'
  rationale: Die unmittelbare Hervorhebung »Adam allein« und der Vergleich mit den übrigen Lebewesen sprechen für eine Aussage über Adams einzigartige Befähigung; die ge'ezische Stellung am Satzende lässt den alternativen Bezug jedoch zu und wird deshalb vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Wilde Tiere und Vieh« bewahrt die Quellunterscheidung; »Scham« hält die konkrete und zugleich beschämungsbezogene Bedeutung offen.
