  text: until those days are completed for a male and for a female. This is the law and testimony that was written.
translation:
  language: de
  text: bis jene Tage für ein männliches und für ein weibliches Kind vollendet sind. Dies ist das Gesetz und das Zeugnis, das aufgeschrieben wurde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትፈጸማ እላንቱ መዋዕል
  choice: bis jene Tage … vollendet sind
  rationale: Gibt die zeitliche Wendung und das Verb für das Vollenden möglichst formnah und zugleich idiomatisch wieder.
- source_word: ለተባዕት ወለአንስት
  choice: für ein männliches und für ein weibliches Kind
  rationale: Das ausdrückliche ወ bedeutet „und“. „Kind“ wird zur natürlichen deutschen Bezeichnung des im Zusammenhang gemeinten männlichen beziehungsweise weiblichen Neugeborenen ergänzt, ohne den Geschlechtsunterschied einzuebnen.
- source_word: ሕግ ወስምዕ
  choice: das Gesetz und das Zeugnis
  rationale: Bewahrt die beiden rechtlich-theologischen Begriffe sowie ihre Verbindung durch „und“.
- source_word: ዘተጽሕፈ
  choice: das aufgeschrieben wurde
  rationale: Entspricht der passiven Relativform und klingt im modernen Deutschen natürlich.
theological_decisions:
- issue: Verknüpfung von männlich und weiblich
  choice: und
  alternative: oder
  rationale: Der ge’ezische Text hat ausdrücklich die Konjunktion ወ („und“); die alternative Wiedergabe „oder“ würde diese abschwächen.
- issue: Reichweite des Relativsatzes
  choice: Bezug auf „das Gesetz und das Zeugnis“ als zusammengehörige Aussage
  alternative: Bezug nur auf „das Zeugnis“
  rationale: Der Singular des Relativsatzes kann die verbundene Begriffsgruppe als Einheit aufnehmen; die deutsche Form bewahrt diese mögliche gemeinsame Zuordnung, ohne sie weiter auszudeuten.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Formulierung bleibt nahe an der ge’ezischen Satzstruktur, ergänzt jedoch „Kind“, damit „männlich/weiblich“ im Geburts- und Reinigungskontext auf Deutsch verständlich und natürlich bezeichnet wird. Der im überlieferten Eingabetext zwischen Satzteilen stehende Zahl- beziehungsweise Apparatvermerk wurde nicht als Bestandteil des Verswortlauts behandelt.
