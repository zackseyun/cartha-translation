  text: And they shall be eighty days in all. And when she had completed these eighty days, we brought her into the garden of Eden, for it is holier than all the earth, and every tree that is planted in it is holy.
translation:
  language: de
  text: Und insgesamt werden es achtzig Tage sein. Als sie diese achtzig Tage vollendet hatte, brachten wir sie in den Garten Eden; denn er ist heiliger als die ganze Erde, und jeder Baum, der darin gepflanzt ist, ist heilig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይከውና፡ ኵሎን፡ ሰማንያ፡ መዋዕለ
  choice: Und insgesamt werden es achtzig Tage sein
  rationale: Gibt die eigenständige erste Aussage vollständig wieder; ኵሎን bezeichnet die Gesamtsumme und መዋዕለ die Tage.
- source_word: ወፈጺማ
  choice: Als sie … vollendet hatte
  rationale: Bewahrt das feminine Subjekt und das zeitlich vorgeordnete Abschließen der achtzig Tage im Erzählzusammenhang.
- source_word: አባእናሃ
  choice: brachten wir sie hinein
  rationale: Die Form bezeichnet das Hineinbringen durch ein Wir; im Deutschen wird das Ziel unmittelbar mit „in den Garten Eden“ angeschlossen.
- source_word: ቅድስት፡ ይእቲ፡ እምኵሉ፡ ምድር
  choice: er ist heiliger als die ganze Erde
  rationale: Der Komparativ gibt die Heiligkeit des Gartens gegenüber dem gesamten übrigen Erdbereich natürlich und quellennah wieder.
- source_word: ወኵሉ፡ ዕፀ፡ ዘትከል
  choice: und jeder Baum, der darin gepflanzt ist
  rationale: Übersetzt die distributive Aussage über jeden gepflanzten Baum; „darin“ macht den im Kontext vorausgesetzten Bezug auf den Garten deutlich.
theological_decisions:
- issue: Abgestufte Heiligkeit von Garten und Erde
  choice: „heiliger als die ganze Erde“
  alternative: „der heiligste Ort der ganzen Erde“
  rationale: Die komparative Form wird beibehalten, ohne sie zu einem Superlativ oder zu einer systematischen Aussage über heilige Räume auszubauen.
- issue: Heiligkeit der Bäume
  choice: „jeder Baum, der darin gepflanzt ist, ist heilig“
  alternative: „alle dort gepflanzten Bäume sind heilig“
  rationale: Die Einzelbetonung „jeder Baum“ folgt der Quellenaussage und bewahrt ihre uneingeschränkte Reichweite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. Die im überlieferten Text ausdrücklich vorhandene erste Aussage über die Gesamtdauer von achtzig Tagen ist aufgenommen. Keine Fußnote ist erforderlich, da keine für die deutsche Wiedergabe sachlich relevante Mehrdeutigkeit ausgelagert werden muss.
