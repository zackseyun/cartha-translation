translation:
  language: de
  text: '… des Gartens hat Gott euch geboten: »Esst nicht davon!« Und sie sagte zu ihm: »Von allen Früchten der Bäume im Garten sagte Gott zu uns: ›Esst!‹ Doch von der Frucht des Baumes in der Mitte des Gartens …«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorgelegte Text setzt am Anfang mitten im Satz ein und bricht am Ende mitten in der Rede ab.
