lexical_decisions:
- source_word: አዘዘክሙ
  choice: gebot Gott euch
  rationale: Das Verb bezeichnet ein Gebieten oder Befehlen; das Suffix ist 2. Person Plural und wird daher mit „euch“ wiedergegeben.
- source_word: ወትቤሎ
  choice: Und sie sagte zu ihm
  rationale: Die feminine Verbform bezeichnet die Sprecherin; das Objektsuffix verweist auf einen männlichen Angesprochenen.
- source_word: እምኵሉ ፍሬ ዕፀ
  choice: von allen Früchten der Bäume
  rationale: Die Formulierung wird natürlich und zugleich quellennah als umfassender Bezug auf die Baumfrüchte wiedergegeben.
- source_word: ወእምነ
  choice: Doch von
  rationale: Die Konjunktion kann schlicht „und“ heißen, markiert hier aber den inhaltlichen Gegensatz zwischen der allgemeinen Erlaubnis und der Ausnahme.
- source_word: ዘማእከለ ገነት
  choice: in der Mitte des Gartens
  rationale: Bewahrt die räumliche Bestimmung des Baumes ohne zusätzliche Deutung.
theological_decisions:
- issue: Wiedergabe des göttlichen Verbots und der anschließenden Ausnahme
  choice: Die unvollständige Gegenüberstellung von Erlaubnis und Verbot bleibt offen stehen.
  alternative: Den aus Genesis bekannten Abschluss sinngemäß ergänzen.
  rationale: Der vorgelegte Quellenausschnitt bricht mitten in Evas Rede ab; eine Ergänzung würde Text importieren, der hier nicht überliefert ist.
- issue: Numerus der angesprochenen Person im ersten Satzteil
  choice: „euch“ im Plural
  alternative: „dir“ im Singular
  rationale: Das ge'ezische Suffix in አዘዘክሙ ist pluralisch; die Übersetzung bewahrt diesen Befund trotz möglicher Spannung zum Erzählkontext.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede ist klar gestaffelt; Imperative werden knapp und natürlich formuliert. Auslassungspunkte zeigen die tatsächlichen Abbrüche des bereitgestellten Textes an, ohne den fehlenden Zusammenhang zu ergänzen.
