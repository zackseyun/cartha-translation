  text: 'Therefore the statute of these days was ordained for her who bears a male or a female: she shall touch nothing holy, nor enter the sanctuary, until'
translation:
  language: de
  text: 'Darum wurde für eine Frau, die einen Jungen oder ein Mädchen zur Welt bringt, die Vorschrift für diese Tage festgesetzt: Sie darf nichts Heiliges berühren und das Heiligtum nicht betreten, bis'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በእንተዝ
  choice: Darum
  rationale: Gibt die folgernde Verknüpfung natürlich und knapp wieder.
- source_word: ተሠርዐ
  choice: wurde … festgesetzt
  rationale: Bewahrt den passiven Charakter einer verbindlich angeordneten Regelung.
- source_word: ፍትሖን
  choice: Vorschrift
  rationale: Bezeichnet hier eine verbindliche kultische Ordnung; „Vorschrift“ ist im modernen Deutsch verständlich und nicht unnötig konfessionell geprägt.
- source_word: ለተባዕት፡ ወለአንስት
  choice: einen Jungen oder ein Mädchen
  rationale: Gibt die Geschlechtsalternativen im Zusammenhang einer Geburt idiomatisch wieder.
- source_word: ቅዱሰ፡ ኢትልከፍ
  choice: Sie darf nichts Heiliges berühren
  rationale: Bewahrt sowohl die kultische Kategorie „heilig“ als auch das Berührungsverbot.
- source_word: ውስተ፡ መቅደስ፡ ኢትባእ
  choice: das Heiligtum nicht betreten
  rationale: Formale und zugleich natürliche Wiedergabe des Verbots, in das Heiligtum hineinzugehen.
- source_word: እስከ፡ አመ
  choice: bis zu dem Tag,
  rationale: Die Quelle endet mit einer in den Folgevers hineinführenden Zeitangabe; das Komma signalisiert bewusst den unvollständigen Satz.
theological_decisions:
- issue: Charakter der Regelung
  choice: kultische Vorschrift ohne zusätzliche Deutung
  alternative: als moralisches Verbot oder Aussage persönlicher Schuld auslegen
  rationale: Der Wortlaut regelt den Kontakt mit Heiligem und den Zugang zum Heiligtum, erklärt aber nicht ausdrücklich eine moralische Schuld.
- issue: Versübergreifender Satzschluss
  choice: den Satz nach „bis zu dem Tag,“ offenlassen
  alternative: die Aussage innerhalb dieses Verses ergänzen oder abschließen
  rationale: Das gegebene Ge’ez-Textsegment endet selbst mit „bis zu dem Tag“ und setzt sich offenbar anschließend fort; eine Ergänzung wäre nicht quellengestützt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung wurde für gute Verständlichkeit leicht geglättet, während Passiv, kultische Begriffe und der bewusst unvollständige Schluss erhalten bleiben.
