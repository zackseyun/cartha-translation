  yaml_path: translation/extra_canonical/jubilees/003/003.yaml
  text: And during these five days Adam saw them[a], male and female, of every kind that was on the earth, but he was alone, and no helper like him was found for him.
translation:
  language: de
  text: Und während dieser fünf Tage sah Adam sie[a], männlich und weiblich, von jeder Art, die auf der Erde war. Er selbst aber war allein, und es fand sich für ihn keine Hilfe, die ihm entsprach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In der Verszählung der überlieferten ge’ezischen Textzeile folgt auf Vers 2 unmittelbar Vers 4. Der Zusammenhang enthält jedoch erkennbar die Aussage, dass Adam während dieser fünf Tage die Geschöpfe als männlich und weiblich sah und keine ihm entsprechende Hilfe fand.
    reason: segmentation_note
lexical_decisions:
- source_word: ዘከማሁ
  choice: die ihm entsprach
  rationale: Die Wendung bezeichnet eine ihm gemäße bzw. entsprechende Hilfe. »Die wie er war« wäre im Deutschen weniger natürlich und könnte bloße Ähnlichkeit statt Entsprechung nahelegen.
- source_word: መርዳእ / ዘይረድኦ
  choice: Hilfe
  rationale: Gibt die sachliche Bedeutung »Hilfe, Beistand« wieder und wahrt den Bezug zum anschließenden Schöpfungsbericht.
- source_word: በበ፡ ዘመዶሙ
  choice: von jeder Art
  rationale: Die distributive Formulierung wird in natürlichem Deutsch wiedergegeben, ohne eine moderne biologische Taxonomie vorauszusetzen.
theological_decisions:
- issue: Bedeutung der dem Menschen entsprechenden Hilfe
  choice: keine Hilfe, die ihm entsprach
  alternative: keine ihm ebenbürtige Gehilfin
  rationale: Die gewählte Formulierung bewahrt die funktionale und relationale Offenheit des Ausdrucks, ohne Geschlechterhierarchie oder eine bestimmte dogmatische Deutung in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau ist flüssig, bleibt aber nahe an der überlieferten Aussage. »Er selbst aber« hebt den Gegensatz zwischen den paarweise wahrgenommenen Geschöpfen und Adams Alleinsein hervor.
