base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/024.yaml
  text: And to Adam also he said, “Because you listened to the voice of your wife and ate from that tree from which I commanded you not to eat, cursed shall the ground be on your account. It shall produce thorns and thistles for you, and you shall eat your bread by the sweat of your face until you return to the ground from which you were taken; for you are earth, and to the earth you shall return.”
translation:
  language: de
  text: 'Auch zu Adam sagte er: „Weil du auf die Stimme deiner Frau gehört und von jenem Baum gegessen hast, von dem ich dir geboten hatte: Du sollst nicht davon essen, soll der Erdboden deinetwegen verflucht sein. Dornen und Disteln wird er dir hervorbringen, und im Schweiß deines Angesichts wirst du die Pflanzen des Feldes essen, bis du zum Erdboden zurückkehrst, von dem du genommen wurdest; denn Erde bist du, und zur Erde wirst du zurückkehren.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምድር
  choice: Erdboden / Erde
  rationale: Das Wort bezeichnet hier sowohl den verfluchten Boden als auch die Erde, aus der Adam genommen wurde. Die abgestufte deutsche Wiedergabe bewahrt den Wortzusammenhang und klingt natürlich.
- source_word: እከዋከ፡ ወአሜካሳ
  choice: Dornen und Disteln
  rationale: Die beiden Pflanzenbezeichnungen bilden das traditionelle und sachlich passende Paar für unerwünschten stachligen Bewuchs.
- source_word: ሣዕስቲከ
  choice: die Pflanzen des Feldes
  rationale: Der geezische Ausdruck verweist auf Feldgewächse beziehungsweise Feldkraut, nicht auf „Brot“. Die Übersetzung folgt daher dem überlieferten Quelltext statt der englischen Konsultationsfassung.
- source_word: በሐፈ፡ ገጽከ
  choice: Im Schweiß deines Angesichts
  rationale: Eine formnahe, im Deutschen verständliche Wiedergabe der körperlichen Mühsal.
- source_word: ተነሣእከ
  choice: genommen wurdest
  rationale: Bewahrt die Passivform und den Rückbezug auf Adams Herkunft aus dem Erdboden.
theological_decisions:
- issue: Grund der Verfluchung des Erdbodens
  choice: „deinetwegen“
  alternative: „um deinetwillen“ oder „aufgrund deiner Tat“
  rationale: „Deinetwegen“ gibt den kausalen Bezug wieder, ohne zusätzliche Aussagen über Reichweite oder Zweck des Fluchs einzutragen.
- issue: Mensch und Erde
  choice: „denn Erde bist du“
  alternative: „denn Staub bist du“
  rationale: Der vorliegende geezische Text verwendet dasselbe Wort für Erdboden beziehungsweise Erde und nicht ausdrücklich „Staub“. Die Übersetzung bewahrt diese lexikalische Verknüpfung.
- issue: Nahrung unter Mühsal
  choice: Feldpflanzen und anschließendes unbestimmtes „wirst du essen“
  alternative: „dein Brot essen“
  rationale: Die englische Fassung glättet zu „Brot“, doch der geezische Text nennt zunächst die Pflanzen des Feldes und lässt beim folgenden Verb das Objekt unausgesprochen. Diese Spannung wird nicht harmonisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit biblisch gehobenem Ton. Die Satzstruktur bleibt quellennah, wird aber durch klare Zeichensetzung lesbar gehalten. Keine Fußnoten erforderlich.
