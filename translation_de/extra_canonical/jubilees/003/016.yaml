base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/016.yaml
  text: And we gave him work, and we instructed him to do everything suitable for cultivation. And he was cultivating, and he was naked and did not know it, and was not ashamed, and he kept the garden from the birds and from the beasts and from the cattle, and gathered its fruit and ate, and set aside the remainder for himself.
translation:
  language: de
  text: Und wir gaben ihm Arbeit und lehrten ihn, alles zu tun, was für die Bewirtschaftung geeignet war.[a] Er bewirtschaftete den Garten. Dabei war er nackt, ohne es zu wissen, und schämte sich nicht. Er bewachte den Garten vor den Vögeln, den wilden Tieren und dem Vieh, sammelte seine Früchte und aß davon; den Rest legte er für sich zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unterwiesen ihn in allem, was für die Bewirtschaftung geeignet war“.'
    reason: Die Konstruktion kann entweder die Anleitung zum Tun oder allgemeiner die Unterweisung in allen geeigneten Arbeiten hervorheben.
lexical_decisions:
- source_word: ምግባረ
  choice: Arbeit
  rationale: Gibt die konkrete, Adam übertragene Tätigkeit schlicht und quellennah wieder.
- source_word: ገቢሮተ፡ ኵሉ
  choice: alles zu tun
  rationale: Bewahrt den im Ge’ez ausdrücklich vorhandenen Infinitiv des Tuns, statt ihn wie eine bloße Unterweisung in Sachkenntnissen wiederzugeben.
- source_word: ዘይስተርኢ፡ ለቅኔ
  choice: was zur Bewirtschaftung nötig war
  rationale: Gibt die Eignung beziehungsweise Angemessenheit für die gärtnerische Arbeit in natürlichem Deutsch wieder.
- source_word: ይትቀነይ
  choice: bewirtschaftete den Garten
  rationale: Der Kontext bezeichnet fortlaufende Arbeit beziehungsweise Dienst im Garten; das ergänzte Objekt macht den deutschen Satz verständlich, ohne den Sinn zu erweitern.
- source_word: የዐቅብ
  choice: bewachte
  rationale: Entspricht dem Bewahren oder Hüten des Gartens gegen Tiere.
- source_word: ያነብር፡ ተረፎ፡ ሎቱ
  choice: den Rest legte er für sich zurück
  rationale: Spiegelt sowohl das Zurücklegen beziehungsweise Aufbewahren als auch den abschließenden Dativ ‚für sich‘ wider.
theological_decisions:
- issue: Adams fehlendes Wissen um seine Nacktheit
  choice: Dabei war er nackt, ohne es zu wissen
  alternative: Dabei war er nackt und wusste es nicht
  rationale: Die Formulierung wahrt die Aussage des Textes, ohne zu erklären, worin dieses Nichtwissen psychologisch oder theologisch bestand.
- issue: Art der Unterweisung Adams
  choice: lehrten ihn, alles zu tun, was zur Bewirtschaftung nötig war
  alternative: unterwiesen ihn in allem, was zur Bewirtschaftung nötig war
  rationale: Die Hauptfassung berücksichtigt ausdrücklich den Infinitiv ገቢሮተ, während die Fußnote die syntaktisch mögliche allgemeinere Auffassung der Unterweisung erhält.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Kurze Sätze entlasten die lange ge’ezische Reihung; die wiederholte Gartenarbeit bleibt lexikalisch erkennbar. Der Fußnotenmarker [a] steht unmittelbar bei der betroffenen Formulierung.
