    issue: „legte zurück“ für ያነብር
    rationale: „Zurücklegen“ fügt die Bedeutung des Zurückgebens bzw. Wiederan-den-alten-Ort-Legens hinzu. Der Kontext verlangt vielmehr ein Aufbewahren/Verwahren.
  - severity: medium
    issue: „was aufbewahrt werden sollte“ für ዘይትዐቀብ
    rationale: Die deutsche Soll-Form macht aus der relativen Beschreibung eines Bewahrten eine Zweck- oder Verpflichtungsaussage. „was aufbewahrt wurde“ bewahrt die passive, beschreibende Aussage besser.
