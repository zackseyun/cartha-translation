- from: 'für sich und seine Frau und legte zurück, was aufbewahrt werden sollte. Als die sieben Jahre vollendet waren, die er dort verbracht hatte – genau sieben Jahre –, kam am siebzehnten Tag des zweiten Monats[a] die Schlange. Sie näherte sich der Frau und sagte zu ihr: »Hat Gott euch geboten: ›Ihr dürft nicht von jedem Baum des Gartens essen‹?«'
  to: 'für sich und seine Frau und bewahrte auf, was aufbewahrt wurde. Als die sieben Jahre vollendet waren, die er dort verbracht hatte – genau sieben Jahre –, kam am siebzehnten Tag des zweiten Monats[a] die Schlange. Sie näherte sich der Frau und sagte zu ihr: »Hat Gott euch geboten: ›Ihr dürft nicht von jedem Baum des Gartens essen‹?«'
