  text: for himself and for his wife[a], and stored what was being kept. And at the completion of the seven years which he had completed there, exactly seven years, in the second month, on the seventeenth day, the serpent came and approached the woman, and the serpent said to the woman, “Has God commanded you, saying, ‘You shall not eat from every tree of the garden’?”
translation:
  language: de
  text: 'für sich und seine Frau und bewahrte auf, was aufbewahrt wurde. Als die sieben Jahre vollendet waren, die er dort verbracht hatte – genau sieben Jahre –, kam am siebzehnten Tag des zweiten Monats[a] die Schlange. Sie näherte sich der Frau und sagte zu ihr: »Hat Gott euch geboten: ›Ihr dürft nicht von jedem Baum des Gartens essen‹?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Datum wird genau angegeben: der siebzehnte Tag des zweiten Monats, nachdem sieben volle Jahre in Eden vergangen waren. Solche Zeitangaben gehören im Jubiläenbuch regelmäßig zur offenbarten Ordnung der Geschichte.'
    reason: cultural_note
lexical_decisions:
- source_word: ሰብዓቱ … ዓመት / ሰብዓተ ዓመተ
  choice: sieben Jahre … genau sieben Jahre
  rationale: Die ausgeschriebenen ge’ezischen Zahlwörter bedeuten jeweils „sieben“. Die hochgestellten bzw. eingeschobenen Zeichen ፳፮ und ፳፯ sind Seiten- oder Apparatsmarkierungen der Edition und keine zum Satz gehörenden Jahreszahlen.
- source_word: አርዌ ምድር
  choice: die Schlange
  rationale: Wörtlich etwa „Kriechtier/Tier der Erde“; im Erzählzusammenhang bezeichnet die feste Verbindung die Schlange.
- source_word: እምኵሉ ዕፀ
  choice: nicht von jedem Baum
  rationale: Die Formulierung „von jedem Baum“ wird formal bewahrt, statt sie stillschweigend zum idiomatischen „von keinem Baum“ umzudeuten. So bleibt die mögliche Reichweitennuance der Verneinung sichtbar.
- source_word: ወቀርበ ኀበ ብእሲት
  choice: Sie näherte sich der Frau
  rationale: Direkte, natürliche Wiedergabe der Bewegung hin zur Frau.
theological_decisions:
- issue: Reichweite der Verneinung in der Frage der Schlange
  choice: „Ihr dürft nicht von jedem Baum des Gartens essen“
  alternative: „Ihr dürft von keinem Baum des Gartens essen“
  rationale: Die gewählte Fassung folgt der Oberflächenstruktur „nicht … von jedem Baum“ und bewahrt deren echte sprachliche Spannung, ohne die Aussage nach Genesis 3 stillschweigend zu normalisieren.
- issue: Chronologie des Aufenthalts in Eden
  choice: zweimal „sieben Jahre“
  alternative: „sechsundzwanzig Jahre … genau siebenundzwanzig Jahre“
  rationale: Die Jahreszahlen stehen im Ge’ez-Text ausgeschrieben als „sieben“; ፳፮ und ፳፯ gehören als Editionsmarkierungen nicht zum Wortlaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der fragmentarische Versanfang bleibt als Fortsetzung des vorangehenden Satzes erkennbar. Die Wiederholung „sieben Jahre … genau sieben Jahre“ wird wegen ihrer chronologischen Betonung beibehalten.
