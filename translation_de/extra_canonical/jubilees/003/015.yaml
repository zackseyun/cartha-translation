  text: And in the first week of the first jubilee, Adam and his wife were in the garden of Eden for seven years, tilling and keeping it.
translation:
  language: de
  text: Und in der ersten Woche des ersten Jubiläums waren Adam und seine Frau sieben Jahre lang im Garten Eden, während Adam ihn bebaute und bewachte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ብእሲቱ
  choice: seine Frau
  rationale: Das Wort bezeichnet hier Adams Ehefrau; die natürliche moderne deutsche Entsprechung lautet „seine Frau“.
- source_word: ገነት ኤዶም
  choice: Garten Eden
  rationale: Die traditionelle und allgemein verständliche deutsche Wiedergabe des Ortsnamens.
- source_word: ይትቀነይ
  choice: bebauten
  rationale: Gibt die landwirtschaftliche Tätigkeit im Garten idiomatisch wieder und entspricht dem Sinn von bearbeiten bzw. bestellen.
- source_word: የዐቅብ
  choice: bewahrten
  rationale: Erhält die Bedeutungsbreite von hüten, bewachen und bewahren und wahrt zugleich den Anklang an Genesis 2,15.
theological_decisions:
- issue: Bezug der beiden abschließenden Tätigkeiten
  choice: 'Plural: Adam und seine Frau bebauten und bewahrten den Garten'
  alternative: 'Singular: Adam bebaute und bewahrte ihn'
  rationale: Die überlieferte Formulierung verbindet beide Personen mit den Tätigkeiten; die deutsche Wiedergabe lässt beide als gemeinsames Subjekt stehen, ohne die Aufgabe allein Adam zuzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Zeitangaben und ihre Reihenfolge bleiben eng an der ge'ezischen Vorlage; „bebauten und bewahrten“ erhält die traditionelle biblische Sprachprägung, bleibt aber allgemein verständlich.
