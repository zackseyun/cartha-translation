  text: And the woman saw the tree, that it was delightful[a] and pleasing to the eye, and its fruit was good for food, and she took from it and ate.
translation:
  language: de
  text: Und die Frau sah, dass der Baum ansprechend[a] und eine Freude für die Augen war und dass seine Frucht gut zum Essen war. Da nahm sie davon und aß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das geʿezische Wort ʾaddām wird hier als Adjektiv im Sinn von „angenehm“ oder „erfreulich“ gebraucht, nicht als Eigenname Adam.
    reason: lexical_choice
lexical_decisions:
- source_word: አዳም
  choice: köstlich
  rationale: Das geʿezische ʾaddām ist hier adjektivisch gebraucht und bezeichnet etwas Angenehmes oder Erfreuliches, nicht den Eigennamen Adam. „Köstlich“ gibt die sinnliche Anziehung des Baumes in natürlichem Deutsch wieder.
- source_word: ያሠምር፡ ለዐይን
  choice: eine Freude für die Augen
  rationale: Die Wendung bezeichnet, dass der Baum den Augen gefällt; die nominale deutsche Formulierung ist würdig und idiomatisch.
- source_word: ለበሊዕ
  choice: zum Essen
  rationale: Gibt die Zweck- beziehungsweise Eignungsangabe knapp und natürlich wieder.
- source_word: ወነሥአት፡ እምኔሁ፡ ወበልዐት
  choice: Da nahm sie davon und aß
  rationale: Bewahrt die einfache Abfolge der geʿezischen Erzählung; „davon“ gibt እምኔሁ idiomatisch wieder.
theological_decisions:
- issue: Deutung von አዳም
  choice: 'adjektivisch: „köstlich“'
  alternative: als Eigenname „Adam“
  rationale: Syntax, Kontext und lexikalischer Befund sprechen für ein Adjektiv mit der Bedeutung „angenehm/erfreulich“; eine Wiedergabe als Personenname wäre hier irreführend.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die wiederholten Wahrnehmungs- und Bewertungsangaben bleiben erhalten, ohne die geʿezische Satzfolge unnötig schwerfällig nachzubilden.
