base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/001.yaml
  text: 'And during the six days of the second week we brought to Adam, by the word of the Lord, all the beasts, and all the livestock, and all the birds, and everything that moves on the earth, and everything that moves in the waters, according to their kinds and according to their forms: the beasts on the first day, the livestock on the second day, the birds on the third day, and everything that moves on the earth on the fourth day, and what moves in the waters on the fifth day.'
translation:
  language: de
  text: 'Und während der sechs Tage der zweiten Woche brachten wir auf das Wort des Herrn hin alle wilden Tiere, alle Nutztiere, alle Vögel, alles, was sich auf der Erde bewegt, und alles, was sich im Wasser bewegt, zu Adam, jeweils nach ihren Arten und ihren Gestalten: die wilden Tiere am ersten Tag, die Nutztiere am zweiten Tag, die Vögel am dritten Tag, alles, was sich auf der Erde bewegt, am vierten Tag und alles, was sich im Wasser bewegt, am fünften Tag.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በሰዱስ፡ መዋዕል
  choice: während der sechs Tage
  rationale: Die Wendung bezeichnet sechs Tage als Zeitraum; sie bedeutet nicht „am zweiten Tag“. Das entspricht auch der anschließenden Aufzählung mehrerer Tage.
- source_word: አራዊተ
  choice: wilde Tiere
  rationale: Die Bezeichnung wird von እንስሳ unterschieden und meint hier die nicht domestizierten Landtiere.
- source_word: እንስሳ
  choice: Nutztiere
  rationale: Im Gegensatz zu den wilden Tieren sind die domestizierten Tiere gemeint; „Nutztiere“ ist im modernen Deutsch verständlich und hinreichend weit.
- source_word: በቃለ፡ እግዚአብሔር
  choice: auf das Wort des Herrn hin
  rationale: 'Bewahrt den instrumentalen beziehungsweise veranlassenden Sinn: Das Bringen geschieht aufgrund des göttlichen Wortes oder Befehls.'
- source_word: በበ፡ ዘመዶሙ ወበበ፡ አምሳሎሙ
  choice: jeweils nach ihren Arten und ihren Gestalten
  rationale: Gibt beide parallelen Bestimmungen wieder, ohne sie miteinander zu verschmelzen.
- source_word: ይትነወስ / ይትሐወስ
  choice: sich bewegt
  rationale: Die wiederkehrenden Bewegungsverben werden natürlich und konsistent wiedergegeben, ohne die Lebewesen enger als „Kriechtiere“ festzulegen.
theological_decisions:
- issue: Sprecher im Plural
  choice: „wir brachten“
  alternative: Passiv oder unbestimmtes Subjekt
  rationale: Der ge’ezische Text spricht ausdrücklich in der ersten Person Plural. Die Identität der Sprecher wird nicht erklärend festgelegt.
- issue: Wirksamkeit des göttlichen Wortes
  choice: „auf das Wort des Herrn hin“
  alternative: „durch das Wort des Herrn“ oder „auf Befehl des Herrn“
  rationale: Die Formulierung wahrt die Spannung zwischen Mittel und Veranlassung und vermeidet eine unnötige dogmatische Präzisierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Aufzählungsstruktur. Die wiederholten All-Aussagen und die Einteilung nach Tagen bleiben erhalten; die sachlich falsche ältere Lesart „am zweiten Tag“ wird nicht als Variante aufgenommen.
