base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/009.yaml
  text: And after forty days had been completed for Adam in the land where he had been created, we brought him into the garden of Eden, that he might till it and keep it; but his wife was brought in after eighty days, and after this she entered into the garden of Eden.
translation:
  language: de
  text: Nachdem für Adam vierzig Tage auf der Erde vollendet waren, auf der er erschaffen worden war, brachten wir ihn in den Garten Eden, damit er ihn bebaue und bewahre. Seine Frau aber wurde nach achtzig Tagen hineingebracht[a]; danach betrat sie den Garten Eden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie brachten seine Frau nach achtzig Tagen hinein.“'
    reason: Bewahrt die Möglichkeit, die geʿezische Pluralform nicht unpersönlich-passiv, sondern mit einem unbestimmten Subjekt wiederzugeben.
lexical_decisions:
- source_word: ተፈጸመ፡ ... አርብዓ፡ መዋዕለ
  choice: vierzig Tage vollendet waren
  rationale: Bewahrt die zeitliche Vollendungsformulierung der geʿezischen Vorlage, ohne sie bloß als Aufenthalt zu paraphrasieren.
- source_word: ይትቀነይ፡ ወይዕቀባ
  choice: damit er ihn bebaue und bewahre
  rationale: Gibt die beiden Tätigkeiten am Garten knapp und in Anlehnung an den Schöpfungswortschatz wieder; „bewahren“ erhält den weiteren Bedeutungsraum von hüten, schützen und erhalten.
- source_word: አብአ፡ በሰማንያ፡ መዋዕለ
  choice: wurde nach achtzig Tagen hineingebracht
  rationale: Die dritte Person Plural kann im Geʿez unpersönlich-passiv gebraucht sein. Das deutsche Passiv vermeidet ein nicht näher bestimmtes Subjekt und lässt die grammatische Alternative in der Fußnote sichtbar.
- source_word: ቦአት፡ ውስተ፡ ገነት፡ ኤዶም
  choice: betrat sie den Garten Eden
  rationale: Gibt den anschließenden aktiven Eintritt der Frau wieder und bewahrt die im Ausgangstext vorhandene Wiederholung.
theological_decisions:
- issue: Wer die Frau in den Garten hineinbrachte
  choice: 'unpersönliches Passiv: „wurde ... hineingebracht“'
  alternative: „sie brachten seine Frau hinein“
  rationale: Die Form kann als unpersönlicher Plural mit passiver Funktion verstanden werden. Da zuvor die Engel in der ersten Person Plural sprechen, würde ein unvermitteltes „sie“ im Deutschen ein unbekanntes handelndes Subjekt nahelegen; die echte grammatische Alternative bleibt deshalb in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der leicht feierliche Konjunktiv „bebaue und bewahre“ passt zum erzählenden Schriftregister; Satzbau und Wortwahl bleiben zugleich allgemein verständlich.
