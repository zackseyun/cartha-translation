  yaml_path: translation/extra_canonical/jubilees/003/004.yaml
  text: And the Lord said to us, “It is not good for the man to be alone; let us make for him a helper like him.” And the Lord our God caused a deep sleep to fall upon him, and he slept; and he took one bone from among his bones for the woman, and that rib was the origin of the woman from among his bones, and he built flesh in its place, and built the woman.
translation:
  language: de
  text: 'Und der Herr sprach zu uns: »Es ist nicht gut, dass der Mann allein ist. Lasst uns ihm eine Hilfe machen, die ihm entspricht.« Da ließ der Herr, unser Gott, einen tiefen Schlaf auf ihn fallen, und er schlief. Er nahm für die Frau einen Knochen aus seinen Knochen; und jene Rippe war der Ursprung der Frau aus seinen Knochen. An ihrer Stelle baute er Fleisch auf, und er baute die Frau.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier zweimal ein Verb mit der Bedeutung »bauen« oder »errichten«: Gott baute Fleisch an der Stelle des entnommenen Knochens auf und baute die Frau.'
    reason: Die im Deutschen ungewöhnliche Baumetapher wird erläutert, ohne sie im Haupttext abzuschwächen.
lexical_decisions:
- source_word: ብእሲ
  choice: der Mann
  rationale: Bezeichnet hier den erschaffenen Menschen in seiner männlichen Zuordnung und steht im Kontrast zu ብእሲት, »Frau«.
- source_word: መርዳእ፡ ዘከማሁ
  choice: eine Hilfe, die ihm entspricht
  rationale: Bewahrt sowohl den Hilfsbegriff als auch die relationale Bedeutung »wie er/ihm entsprechend«, ohne Über- oder Unterordnung einzutragen.
- source_word: ህድመተ
  choice: einen tiefen Schlaf
  rationale: Gibt den durch Gott bewirkten schweren bzw. tiefen Schlaf idiomatisch und traditionsnah wieder.
- source_word: ዐጽመ፡ አሐደ
  choice: einen Knochen
  rationale: Der Ausgangsausdruck nennt allgemein einen einzelnen Knochen, nicht bereits ausdrücklich eine Rippe.
- source_word: ገቦ
  choice: Rippe
  rationale: Der folgende Satz identifiziert den entnommenen Knochen ausdrücklich als Rippe; diese Einzelheit darf nicht ausgelassen werden.
- source_word: ፍጥረት
  choice: Ursprung
  rationale: Im nominalen Satz bezeichnet das Wort hier die Entstehung bzw. den Ursprung der Frau; »Ursprung« bewahrt die knappe Formulierung.
- source_word: ሐነጸ
  choice: baute … auf / baute
  rationale: Das Verb bedeutet »bauen/errichten«. Die ungewöhnliche Schöpfungsmetapher wird bewahrt; bei »Fleisch« sorgt »aufbauen« für verständliches Deutsch.
theological_decisions:
- issue: Plural in Gottes Rede
  choice: »Lasst uns ihm … machen«
  alternative: »Ich will ihm … machen«
  rationale: Der Quelltext enthält den Plural und richtet die Rede an »uns«. Die mögliche Deutung dieses Plurals wird nicht vereindeutigt.
- issue: Art der Entnahme
  choice: zunächst »einen Knochen«, danach ausdrücklich »jene Rippe«
  alternative: durchgehend »eine Rippe«
  rationale: 'So bleibt die lexikalische Staffelung des geezsprachigen Textes erhalten: allgemeiner Knochen bei der Entnahme, ausdrückliche Rippe im Folgesatz.'
- issue: Schöpfung der Frau als »Bauen«
  choice: »er baute die Frau«
  alternative: »er machte/formte die Frau«
  rationale: Die konkrete Baumetapher des Quellverbs wird nicht in einen allgemeineren Schöpfungsbegriff aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die wörtlich auffällige Wiederholung »aus seinen Knochen« und die Schöpfungsmetapher »bauen« bleiben erhalten, weil sie ausdrücklich im geezsprachigen Text stehen.
