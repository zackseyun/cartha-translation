  text: And he recognized her and said to her, “This now is bone from my bones and flesh from my flesh. This one shall be called my woman, because she was taken from her man.”
translation:
  language: de
  text: 'Und er erkannte sie[a] und sagte zu ihr: »Diese ist nun Knochen von meinen Knochen und Fleisch von meinem Fleisch. Diese soll meine Frau genannt werden, denn sie wurde von ihrem Mann genommen.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder wörtlicher: »Und er erkannte sie.« Im Zusammenhang bezeichnet dies wahrscheinlich Adams Erkennen ihrer Identität bzw. Herkunft, nicht sexuelles Erkennen.'
    reason: Die knappe Formulierung der Vorlage wird dokumentiert; die kontextuelle Deutung bleibt als wahrscheinliche, nicht als zwingende Erklärung kenntlich.
  - marker: b
    text: Die Wörter der Vorlage für »Frau« und »Mann« sind sprachlich eng miteinander verwandt; dieses Wortspiel lässt sich im heutigen Deutsch nicht vollständig nachbilden.
    reason: Die für die Namensdeutung wichtige formale Wortverwandtschaft bleibt transparent, ohne die moderne deutsche Wortwahl zu verunstalten.
lexical_decisions:
- source_word: ወአእመራ (wa-ʾaʾmarā)
  choice: Und er erkannte, wer sie war
  rationale: Das Verb bezeichnet hier im Zusammenhang Adams Erkennen bzw. Wiedererkennen der aus ihm gebildeten Frau. Die deutsche Formulierung vermeidet die leicht sexuelle Nebenbedeutung von „er erkannte sie“, ohne den Erkenntnisakt inhaltlich auszubauen.
- source_word: ዐጽም፡ እምዐጽምየ (ʿaṣm ʾəm-ʿaṣməya)
  choice: Knochen von meinen Knochen
  rationale: Gibt den konkreten Singular „Knochen“ in natürlichem, verständlichem Deutsch wieder und bewahrt die feierliche Parallelstruktur mit „Fleisch von meinem Fleisch“.
- source_word: ብእሲትየ (bəʾəsitəya)
  choice: meine Frau
  rationale: Das feminine Substantiv mit Possessivsuffix bedeutet „meine Frau/mein Weib“. „Meine Frau“ ist modern, würdig und lässt sowohl die Geschlechts- als auch die Beziehungsbezeichnung anklingen.
- source_word: እምብእሲሃ (ʾəm-bəʾəsiha)
  choice: von ihrem Mann
  rationale: Bewahrt das Possessivsuffix „ihrem“ und die in der Vorlage bestehende Beziehung zwischen den Bezeichnungen für Frau und Mann.
theological_decisions:
- issue: Bedeutung des Erkennens Adams
  choice: Erkennen ihrer Identität bzw. Herkunft
  alternative: Sexuelles Erkennen
  rationale: Der unmittelbare Zusammenhang ist Adams Reaktion auf die ihm zugeführte, aus seinen Knochen gebildete Frau; die sexuelle Deutung würde die im Jubiläenbuch spätere zeitliche Abfolge vorwegnehmen.
- issue: Wortspiel zwischen Frau und Mann
  choice: Im Haupttext mit „meine Frau“ und „ihrem Mann“ wiedergegeben und in einer Fußnote erläutert
  alternative: „Männin“ und „Mann“
  rationale: „Männin“ würde die formale Beziehung deutlicher nachbilden, ist im heutigen Standarddeutsch jedoch stark archaisch und für gewöhnliche Leser unnatürlich.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, leicht feierlichem Satzrhythmus. Die Parallelformel „Knochen von meinen Knochen und Fleisch von meinem Fleisch“ bleibt erhalten; bewusst vermieden werden sowohl das missverständliche „erkannte sie“ im Haupttext als auch das veraltete „Männin“.
