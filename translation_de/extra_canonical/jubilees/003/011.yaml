  text: until she completes these days for a male. But for a female, two weeks, like the first two weeks, in her uncleanness, and sixty-six days she shall remain in the blood of her purification.
translation:
  language: de
  text: bis sie diese Tage bei der Geburt eines Jungen vollendet hat. Bei der Geburt eines Mädchens aber soll sie zwei Wochen lang unrein sein, wie in den ersten zwei Wochen, und sechsundsechzig Tage soll sie im Blut ihrer Reinigung verbleiben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሰቡዓተ
  choice: Wochen
  rationale: Das Wort bezeichnet hier Zeiträume von jeweils sieben Tagen; im Zusammenhang der Reinigungsvorschriften ist „Wochen“ die natürliche und sachlich passende Wiedergabe.
- source_word: ዘበተባዕት / ዘበአንስት
  choice: bei einem Jungen / bei einem Mädchen
  rationale: Die geschlechtsbezogenen Ausdrücke werden im Kontext einer Geburt idiomatisch auf das geborene Kind bezogen, ohne den Unterschied zwischen männlich und weiblich einzuebnen.
- source_word: በርኵሳ
  choice: in ihrer Unreinheit
  rationale: Die feminine Possessivform wird mit „ihrer“ ausdrücklich wiedergegeben.
- source_word: በደመ፡ ንጽሓ
  choice: im Blut ihrer Reinigung
  rationale: Die konkrete und kultisch geprägte Bildsprache des Ausgangstextes sowie das feminine Possessivsuffix bleiben erhalten; eine glättende Umschreibung würde die Formulierung unnötig auslegen.
theological_decisions:
- issue: Vergleich der zwei Wochen bei der Geburt eines Mädchens mit den „ersten zwei Wochen“
  choice: „zwei Wochen, wie die ersten zwei Wochen“
  alternative: „zwei Wochen entsprechend den ersten zwei Wochen“
  rationale: Die auffällige Wiederholung und mögliche Bezugsspannung des Geʿez-Textes werden bewahrt, statt sie durch eine harmonisierende Erklärung aufzulösen.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil. Der einleitende Nebensatz bleibt als versübergreifender Satzanschluss erhalten. Das Semikolon gliedert die beiden Zeitangaben, ohne dem Text zusätzliche Inhalte hinzuzufügen.
