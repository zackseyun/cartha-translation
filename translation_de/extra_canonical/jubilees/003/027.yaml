  yaml_path: translation/extra_canonical/jubilees/003/027.yaml
  text: And on that day the mouths of all the beasts and cattle and birds and whatever walks and whatever moves were closed from speech, for they all used to speak with one another, with one lip and one tongue.
translation:
  language: de
  text: Und an jenem Tag konnten alle wilden Tiere, das Vieh, die Vögel und alles, was kriecht und sich regt, nicht mehr sprechen; denn sie alle hatten miteinander eine gemeinsame Lippe und eine gemeinsame Zunge gesprochen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አራዊት፡ ወዘእንስሳ፡ ወዘአዕዋፍ
  choice: wilden Tieren, dem Vieh, den Vögeln
  rationale: 'Die drei geʿezischen Tiergruppen werden unterschieden wiedergegeben: Wildtiere, domestizierte Tiere beziehungsweise Vieh und Vögel.'
- source_word: ወዘያንሶሱ፡ ወዘይትሐወስ
  choice: und allem, was umhergeht und sich bewegt
  rationale: Die parallelen Ausdrücke bezeichnen Bewegung beziehungsweise Umhergehen; die Wiedergabe bewahrt die Reihung, ohne die Gruppen künstlich genauer zu bestimmen.
- source_word: ተፈጽመ፡ አፈ ... እምነቢብ
  choice: wurde ... der Mund zum Sprechen verschlossen
  rationale: Das wörtliche Bild vom Mund und dem Ende des Sprechens wird in natürlichem Deutsch als Verschließen des Mundes für die Rede ausgedrückt.
- source_word: ክንፈረ፡ አሐደ፡ ወልሳነ፡ አሐደ
  choice: mit einer Lippe und einer Zunge
  rationale: Die beiden konkreten Sprachbilder des geʿezischen Textes bleiben erhalten, statt sie vereinheitlichend nur als eine gemeinsame Sprache wiederzugeben.
theological_decisions:
- issue: Die Tiere als ehemals sprechende Wesen
  choice: als Aussage des Textes unmittelbar beibehalten
  alternative: als bildhafte oder sagenhafte Rede kennzeichnen
  rationale: Der Ausgangstext stellt das gemeinsame Sprechen der Tiere ohne Deutung oder Einschränkung dar; die Übersetzung fügt daher keine Bewertung hinzu.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am geʿezischen Text, wird aber durch „denn zuvor“ zeitlich verdeutlicht: Das Verschließen des Mundes beendet die bis dahin bestehende gemeinsame Rede.'
