  naturalness: Der Satz ist flüssig und modern. „Mit einer Lippe und einer Zunge“ bewahrt zwar das Bild, klingt im Deutschen aber unnötig unidiomatisch; „eine gemeinsame Lippe und eine gemeinsame Zunge“ gibt die Einzahl und die Aussage einer einheitlichen Sprache verständlicher wieder.
