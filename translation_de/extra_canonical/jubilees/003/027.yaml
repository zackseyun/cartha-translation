    rationale: Die metaphorische Einzahl soll erhalten bleiben, lässt sich aber als „eine gemeinsame Lippe und eine gemeinsame Zunge“ verständlich und quellentreu formulieren.
  revised_text: Und an jenem Tag konnten alle wilden Tiere, das Vieh, die Vögel und alles, was kriecht und sich regt, nicht mehr sprechen; denn sie alle hatten miteinander eine gemeinsame Lippe und eine gemeinsame Zunge gesprochen.
