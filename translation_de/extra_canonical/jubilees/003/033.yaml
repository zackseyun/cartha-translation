translation:
  language: de
  text: … eins im Land ihrer Erschaffung. Und Adam gab seiner Frau den Namen Eva, und sie hatten keine …[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der bereitgestellte ge'ezische Text beginnt und endet mitten im Satz; deshalb bleibt auch die Übersetzung an beiden Stellen unvollständig.
    reason: source_fragment
lexical_decisions:
- source_word: አሐዱ
  choice: eins
  rationale: Das Wort bedeutet „eins/einer“; wegen des am Anfang abgeschnittenen Zusammenhangs bleibt die Formulierung bewusst fragmentarisch.
- source_word: ምድረ፡ ፍጥረቶሙ
  choice: Land ihrer Erschaffung
  rationale: Gibt die Genitivverbindung eng wieder, ohne „Erschaffung“ als Ort, Herkunft oder Schöpfungsakt näher festzulegen.
- source_word: ወሰመያ፡ አዳም፡ ስመ፡ ብእሲቱ፡ ሔዋ
  choice: Und Adam gab seiner Frau den Namen Eva
  rationale: Natürliches modernes Deutsch für die Konstruktion „Adam nannte den Namen seiner Frau Eva“; das Suffix am Verb und die Nominalgruppe beziehen sich auf Adams Frau.
- source_word: ወአኮኑ
  choice: und sie hatten keine …
  rationale: Der überlieferte Ausschnitt bricht nach der negativen Verbform ab. Im durch die Versgrenze zerschnittenen Zusammenhang leitet sie offenbar eine unvollständige Aussage des Nicht-Habens ein; die Auslassungspunkte bewahren den Fragmentcharakter.
theological_decisions:
- issue: Einheit Adams und Evas
  choice: 'Die vorausgehende Wendung bleibt in der überlieferten Reihenfolge als Satzfragment stehen: „… eins im Land ihrer Erschaffung.“'
  alternative: „Und Adam gab seiner Frau den Namen Eva, und sie waren eins im Land ihrer Erschaffung.“
  rationale: Die Alternative ergibt einen geschlossenen theologischen Satz, stellt aber die Reihenfolge des bereitgestellten ge'ezischen Textes um und lässt dessen abschließende Negativform aus. Daher wird die Spannung nicht durch Rekonstruktion geglättet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Eröffnung und der offene Schluss werden nicht geglättet, da der Quellenausschnitt offenbar Versgrenzen überschneidet.
