id: JUB.3.10
reference: Jubilees 3:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: charles_1895
  language: Geez
  text: '1. ወበሰዱስ፡ መዋዕል፡" ዘሰንበት፡ ካልእት፡" እምጻእነ፡ በቃለ፡ እግዚአብሔር፡ ኀበ፡ አዳም፡ ኵሎ፡" አራዊተ፡ ወኵሎ፡" እንስሳ፡ ወኵሎ፡ አዕዋፈ፡" ወኵሎ፡" ዘይትነወስ፡" ውስተ፡ ምድር፡ ወኵሎ፡" ዘይትነወስ፡" ውስተ፡ ማይ፡" በበ፡ ዘመዶሙ፡ ወበበ፡ አምሳሎሙ፡ ወአራዊተ፡" በቅዳሚት፡ ዕለት፡ ወእንስሳ፡ በሳኒታ፡ ዕለት፡" ወአዕዋፈ፡" በዕለት፡" ሣልስት፡ ወኵሎ፡" ዘይትሐወስ፡" ዲበ፡" ምድር፡ በዕለት፡" ራብዕት፡ ወዘይትሐወስ፡" ውስተ፡"

    2. ማይ፡ በዕለት፡" ኃምስት። ወሰመዮሙ፡ አዳም፡ ለኵሎሙ፡ *በበ፡ አስማቲሆሙ፡" ወበከመ፡

    4. ወአልቦ፡ ዘረከበ፡" ሎቱ፡" ዘይረድኦ፡" ዘከማሁ። ወይቤለኒ፡ እግዚአብሔር፡ ለነ፡" አኮ፡ ሀናይ፡ የሀሉ፡ *ብእሲ፡ ባሕቲቱ፡ *ንገበር፡ ሎቱ፡ መርዳእ፡ ዘከማሁ። ወወደየ፡ እግዚአብሔር፡ 5 አምላክአ ህድመተ፡ ላዕሌሁ፡ ወኖመ፡ ወነሥአ፡ ለብእሲት፡ እማእከለ፡ አዕጽምቲሁ፡ ዐጽመ፡ አሐደ፡ ወይእቲ፡ ገቦ፡ ፍጥረት፡ ለብእሲት፡ እማእከለ፡ አዕፅምቲሁ፡ ወሐነጸ፡ ሥጋ፡ ህየንቴሃ፡ ወሐነጸ፡ ብእሲተ። ወአነቅሆ፡ ለአዳም፡ እምነዋሙ፡ ወነቂሆ፡ ተንሥአ፡ በዕለት፡ ሣድስት፡ ወአብጽሓ፡ ኀቤሁ፡ 6 ወአእመራ፡ ወይቤላ፡ ዝንቱ፡ ይእዜ፡ *ዐጽም፡ እምዐጽምየ፡ ወሥጋ፡ እምሥጋየ፡ ዛቲ፡ ትሰመይ፡ ብእሲትየ፡ እስመ፡ እምብእሲሃ፡ ተነሥአት፡ ይእቲ። በእንተዝ፡ *ይኩኑ፡ ብእሲ፡ 7 ወብእሲት፡ አሐደ፡ ወበእንተዝ፡ ይኩን፡ *ብእሲ፡ ዘየኀድግ፡ *አበሁ፡ ወእሞ፡ ወይጻመር፡ ምስለ፡ ብእሲቱ፡ ወይከውኑ፡ *ሥጋ፡ አሐደ። በሳብዕት፡ ቀዳሚት፡ ተፈጥረ፡ አዳም፡ ወገቦ፡ 8 ብእሲቱ፡ ወሳብዕተ፡ ካልእተ፡ አርአዮ፡ ኪያሃ፡ ሎቱ፡ ወበእንተ፡ ዝንቱ፡ ተውህበ፡ *ትእዛዝ፡ ለዐቂብ፡ ለሱባ፡ መዋዕለ፡ ለተባዕት፡ ወለአንስት፡ ክልኤ፡ ሱባዐ፡ መዋዕለ፡ ውስተ፡ ርኵስን። ወእምድኅረ፡ ተፈጸመ፡ ለአዳም፡ አርብዓ፡ መዋዕለ፡ በምድር፡ *ኀበ፡ ተፈጥረ፡ አበአናሁ፡ 9 ውስተ፡ *ገነት፡ ኤዶም፡ ከመ፡ ይትቀነይ፡ ወይዕቀባ፡ ወብእሲቱኒ፡ አብአ፡ በሰማንያ፡ መዋዕለ፡ ወእምድኅረ፡ ዝንቱ፡ ቦአት፡ ውስተ፡ ገነት፡ ኤዶም፡ ወበእንተ፡ ዝንቱ፡ ተጽሕፈ፡ 10 ትእዛዝ፡ ውስተ፡ ጽላተ፡ ሰማይ፡ በእንተ፡ ትውልድ፡ ለእሙ፡ ተባዕተ፡ ወለደት፡ ሰቡዐ፡ መዋዕለ፡ ትገበር፡ ውስተ፡ ርኵሳ፡ በከመ፡ ሰቡዐ፡ *መዋዕለ፡ ቀዳሚት፡ *ወ፴መዋዕለ፡ ወሰሉሰ፡ ዕለተ፡ ትንበር፡ ውስተ፡ ደመ፡ ንጽሓ፡ ወኵሎ፡ ቅዱሰ፡ ኢትግስስ፡ ወውስተ፡ መቅደስ፡ ኢትባእ፡

    11. እስከ፡ ትፈጽም፡ ዘንተ፡ መዋዕለ፡ ዘበተባዕት። ወዘበአንስት፡ ክልኤ፡ ሰቡዓተ፡ *በከመ፡ ክልኤ፡ ሰቡዓተ፡'' ቀዳምያተ፡'' በርኵሳ፡'' ወስሳ፡'' መዋዕለ፡ ወስዱስ፡ ዕለተ፡ ትንበር፡'' በደመ፡ ንጽሓ፡''

    12. ወይከውና፡ ኵሎን፡ ሰማንያ፡'' መዋዕለ። ወፈጺማ፡ እላንተ፡'' ሰማንያ፡'' መዋዕለ፡ አባእናሃ፡''° ውስተ፡ ገነት፡'''' ኤዶም፡ እስመ፡ ቅድስት፡ ይእቲ፡ እምኵሉ፡ ምድር፡ ወኵሉ፡ ዕፀ፡ *ዘትከል፡

    13. ውስቴታ፡ ቅዱስ።''፪ በእንተዝ፡ ተሠርዐ፡ ለእኅተ፡ ትውልድ፡ ለተባዕት፡ ወለአንስት፡''፫ ፍትሖን፡''፬ ለእላንቱ፡''፭ መዋዕል፡ ኵሎ፡ ቅዱሰ፡ ኢትልከፍ፡''፮ ወውስተ፡''፯ መቅደስ፡ ኢትባእ፡ እስከ፡ አመ፡

    14. *ይትፈጸማ፡ እላንቱ፡ መዋዕል፡''፰ ለተባዕት፡ ወለአንስት። ዝንቱ፡'' ሕግ፡ ወስምዕ፡ ዘተጽሕፈ፡

    15. ለእስራኤል፡ ይዕቀቡ፡ ኵሎ፡ መዋዕለ። ወበሱባዔ፡ ቀዳማዊ፡ ዘአዮቤሌው፡ ቀዳማዊ፡''፱ ወሀለዉ፡፳ አዳም፡ ወብእሲቱ፡ ሰብዐተ፡ ዓመተ፡ ውስተ፡ ገነት፡'''' ኤዶም፡ እንዘ፡ ይትቀነይ፡ ወየዐቅብ፡፳፩

    16. ወምግባረ፡ ወሀብናሁ፡ ወሀሎነ፡፳፪ እንዘ፡ ንሜህሮ፡ *ገቢሮተ፡ ኵሉ፡፳፫ ዘይስተርኢ፡ ለቅኔ። ወሀሎ፡ እንዘ፡ ይትቀነይ፡ ወውእቱሰ፡ ዕራቁ፡፳፬ ወኢያአምር፡ ወኢየኀፍር፡ ወየዐቅብ፡ ገነት፡'''' እምአዕዋፍ፡ ወእምአራዊት፡ ወእምእንስሳ፡ ወያስተጋብእ፡ ፍሬሁ፡ ወይበልዕ፡ ወያነብር፡ ተረፎ፡፳፭ ሎቱ፡

    17. ወለብእሲቱ፡ ወያነብር፡ ዘይትዐቀብ። ወኀሊቆ፡ ፍጻሜሁ፡ ለሰብዓቱ፡፳፮ ዓመት፡ እሰ፡ ፈጸመ፡ በህየ፡ *ሰብዓተ፡ ዓመተ፡፳፯ ጥንቁቀ፡ ወበካልእ፡ ወርኅ፡ አመ፡ *ዐሡሩ፡ ወሰቡዑ፡፳፰ መጽአ፡ አርዌ፡ ምድር፡ ወቀርበ፡ ኀበ፡ ብእሲት፡ ወይቤላ፡ አርዌ፡ ምድር፡ ለብእሲት፡ እምኵሉ፡፳፱ ዕፀ፡፴ ዘውስተ፡

    18. ገነት፡ አዘዘክሙ፡ እግዚአብሔር፡ *እንዘ፡ ይብል፡፴፩ ኢትብልዑ፡ እምኔሁ። ወትቤሎ፡ እምኵሉ፡፴፪ ፍሬ፡ ዕፀ፡ ዘውስተ፡ ገነት፡'' ይቤለነ፡ እግዚአብሔር፡ ብልዑ፡ ወእምነ፡ ፍሬ፡ ዕፀ፡ ዘማእከለ፡ ገነት፡''

    19. *ይቤለነ፡ እግዚአብሔር፡፴፫ ኢትብልዑ፡ እምኔሁ፡ ወኢትልከፍዎ፡ ከመ፡ ኢትሙቱ። ወይቤላ፡ አርዌ፡ ምድር፡ ለብእሲት፡ አኮ፡ ሞተ፡ ዘትመውቱ፡ እስመ፡ ያአምር፡ እግዚአብሔር፡ አመ፡ ዕለተ፡'' ትበልዑ፡ እምኔሁ፡ ይትረኀዉ፡፴፬ አዕይንቲክሙ፡ ወትከውኑ፡ ከመ፡ አማልክት፡፴፭ ወታአምሩ፡ ሠናየ፡

    20. ወእኩየ። ወርእየት፡ ብእሲት፡ ዕፀ፡ ከመ፡፴፮ አዳም፡ ውእቱ፡ ወያሠምር፡ ለዐይን፡ ወሠናይ፡ ፍሬሁ፡

    21. ለበሊዕ፡ ወነሥአት፡ እምኔሁ፡ ወበልዐት። ወከደነት፡ ኀፍረታ፡ በቈጽለ፡ በለስ፡ ዘቀዳሚ፡ ወወሀበተ፡

