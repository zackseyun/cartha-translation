base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/010.yaml
  text: 'Therefore the commandment was written on the heavenly tablets concerning her who gives birth: if she bears a male, she shall remain in her uncleanness seven days, according to the first seven days, and thirty-three days she shall remain in the blood of purification; she shall touch nothing holy, and she shall not enter the sanctuary until she completes these days for a male child.'
translation:
  language: de
  text: 'Darum wurde auf den himmlischen Tafeln das Gebot über eine Frau, die gebiert, niedergeschrieben: Wenn sie einen Jungen zur Welt bringt, soll sie sieben Tage in ihrer Unreinheit bleiben, entsprechend den ersten sieben Tagen; und dreiunddreißig Tage soll sie im Blut ihrer Reinigung bleiben. Sie darf nichts Heiliges berühren und das Heiligtum nicht betreten, bis die für einen Jungen bestimmten Tage erfüllt sind.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽላተ፡ ሰማይ
  choice: himmlischen Tafeln
  rationale: Gibt die wörtliche Vorstellung der himmlischen Tafeln natürlich und traditionsnah wieder.
- source_word: ርኵሳ
  choice: Unreinheit
  rationale: Bewahrt den kultisch-rechtlichen Sinn des ge'ezischen Ausdrucks, ohne ihn als moralische Schuld zu deuten.
- source_word: ደመ፡ ንጽሓ
  choice: Blut ihrer Reinigung
  rationale: Folgt der konkreten Formulierung des Ausgangstextes und erhält die kultische Begrifflichkeit.
- source_word: መቅደስ
  choice: Heiligtum
  rationale: Der Ausdruck bezeichnet den heiligen Bereich beziehungsweise das Sanktuar; „Heiligtum“ ist im Deutschen würdig und verständlich.
- source_word: እስከ፡ ትፈጽም፡ ዘንተ፡ መዋዕለ፡ ዘበተባዕት
  choice: bis sie diese für einen Jungen bestimmten Tage vollendet hat
  rationale: Bezieht den abschließenden Satz ausdrücklich auf die für die Geburt eines männlichen Kindes festgelegte Zeit und lässt keinen Teil des Quelltextes aus.
theological_decisions:
- issue: Art der Unreinheit nach der Geburt
  choice: kultisch-rechtliche Sprache ohne moralische Wertung
  alternative: die Unreinheit als persönliche oder sittliche Schuld formulieren
  rationale: Der Zusammenhang regelt Zeiten, Berührung von Heiligem und Zutritt zum Heiligtum; er bezeichnet keine persönliche moralische Verfehlung.
- issue: Heiligkeit und Zutrittsverbot
  choice: „nichts Heiliges berühren“ und „das Heiligtum nicht betreten“ als zwei getrennte Bestimmungen
  alternative: beide Aussagen zu einem allgemeinen Verbot zusammenziehen
  rationale: Der Ausgangstext nennt Berührung und Betreten ausdrücklich nebeneinander.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer kultisch-rechtlicher Terminologie. Die Satzstruktur bleibt nahe am ge'ezischen Text, wird aber für heutige Leser gegliedert. „Junge“ ist natürlich verständlich; die Schlussformulierung wahrt zugleich den rechtlichen Bezug auf ein männliches Kind.
