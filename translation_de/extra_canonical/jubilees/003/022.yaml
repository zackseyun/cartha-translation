base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/022.yaml
  text: And he ate, and his eyes were opened, and he saw that he was naked. And he took fig leaves and sewed them and made himself a covering, and covered his shame.
translation:
  language: de
  text: Und er aß. Da wurden seine Augen geöffnet, und er sah, dass er nackt war. Er nahm Feigenblätter, nähte sie zusammen und machte sich daraus eine Bedeckung und bedeckte seine Blöße.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበልዐ (wa-ballaʿa)
  choice: Und er aß
  rationale: Gibt die im äthiopischen Text ausdrücklich vorhandene, in einer früheren Fassung ausgelassene Eingangsklausel vollständig wieder.
- source_word: ቈጽለ በለስ (qwaṣla balas)
  choice: Feigenblätter
  rationale: Die äthiopische Wendung bezeichnet Feigenlaub beziehungsweise Feigenblätter; der deutsche Plural passt zum anschließenden Zusammennähen.
- source_word: ወጠቅዐ (wa-ṭaqaʿa)
  choice: nähte sie zusammen
  rationale: Entspricht dem konkreten Verb des Verbindens beziehungsweise Zusammennähens und ergibt im Zusammenhang mit den Blättern natürliches Deutsch.
- source_word: ምርአ (mərʾa)
  choice: eine Bedeckung
  rationale: Bewahrt den allgemeinen Sinn eines bedeckenden Kleidungsstücks, ohne die Form genauer festzulegen, als es die Quelle erlaubt.
- source_word: ኀፍረቶ (ḫafreto)
  choice: seine Blöße
  rationale: Erfasst hier die körperliche Scham beziehungsweise den zu bedeckenden Intimbereich; „Blöße“ ist im Deutschen zugleich würdig und kontextgerecht.
