  yaml_path: translation/extra_canonical/jubilees/003/023.yaml
  text: And the Lord cursed the serpent and was angry with it forever. And he was also angry with the woman, because she listened to the voice of the serpent and ate; and he said to her, “I will greatly multiply your sorrow and your pain; in sorrow you shall bear children, and your desire shall be for your husband, and he will rule over you.”
translation:
  language: de
  text: 'Und der Herr verfluchte die Schlange und war ihr für immer zornig. Auch über die Frau war er zornig, weil sie auf die Stimme der Schlange gehört und gegessen hatte. Er sagte zu ihr: »Ich werde deinen Kummer und deine Mühsal sehr vermehren. Unter Schmerzen wirst du Kinder gebären; deine Hinwendung wird deinem Mann gelten[a], und er wird über dich herrschen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Deine Rückkehr wird zu deinem Mann sein«; möglich ist auch die Wiedergabe: »Dein Verlangen wird deinem Mann gelten«.'
    reason: Die ge'ezische Formulierung kann Rückkehr bzw. Hinwendung bezeichnen und steht neben der verbreiteten Genesis-Wiedergabe „Verlangen“. Die Fußnote wahrt diese Auslegungs- und Übersetzungsambiguität.
lexical_decisions:
- source_word: አርዌ፡ ምድር
  choice: die Schlange
  rationale: Wörtlich etwa „Kriechtier der Erde“; im Erzählzusammenhang ist eindeutig die Schlange gemeint.
- source_word: ተምዕዓ / ትምዕዖ
  choice: war … zornig
  rationale: Die Form bezeichnet Zorn bzw. Unwillen; „war zornig“ gibt den parallelen göttlichen Zorn gegen Schlange und Frau natürlich wieder.
- source_word: ኀዘንኪ፡ ወለፃዕርኪ
  choice: deinen Kummer und deine Mühsal
  rationale: Bewahrt die zwei unterschiedlichen Begriffe für leidvolle Sorge und beschwerliche Anstrengung.
- source_word: በሐዘን
  choice: unter Schmerzen
  rationale: Im Zusammenhang des Gebärens ist die konkrete leidvolle Erfahrung gemeint; die Wiedergabe bleibt zugleich mit „Kummer“ im vorausgehenden Satz verbunden.
- source_word: ኀበ፡ ምትኪ፡ ምግባእኪ
  choice: zu deinem Mann wird deine Hinwendung sein
  rationale: Die äthiopische Formulierung bezeichnet wörtlich eine Rückkehr oder Hinwendung zum Mann. „Hinwendung“ ist im Deutschen verständlich und legt die Bedeutung nicht vorschnell auf „Verlangen“ fest.
- source_word: ይኴንነኪ
  choice: er wird über dich herrschen
  rationale: Gibt die Aussage über Ausübung von Herrschaft direkt und ohne beschönigende oder konfessionelle Deutung wieder.
theological_decisions:
- issue: Bedeutung der Hinwendung der Frau zum Mann
  choice: „zu deinem Mann wird deine Hinwendung sein“ mit Fußnote
  alternative: „dein Verlangen wird deinem Mann gelten“ oder „zu deinem Mann wirst du zurückkehren“
  rationale: Der ge'ezische Text spricht eher von Rückkehr bzw. Hinwendung, während die Genesis-Tradition häufig „Verlangen“ bietet. Die Übersetzung wahrt diese Spannung, statt die Genesis-Lesart stillschweigend einzutragen.
- issue: Charakter der Aussage über die Herrschaft des Mannes
  choice: als direkte Aussage innerhalb des göttlichen Strafworts wiedergegeben
  alternative: als zeitloses Gebot oder normative Ordnung formulieren
  rationale: Der Vers beschreibt die Folge des Ungehorsams; die Übersetzung fügt keine normative oder konfessionelle Deutung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die wörtliche Wiederholung des Zorns gegen Schlange und Frau bleibt erhalten; archaische Wendungen werden vermieden. Der Fußnotenmarker [a] steht unmittelbar an der mehrdeutigen Formulierung.
