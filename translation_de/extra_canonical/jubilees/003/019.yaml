base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/019.yaml
  text: God said to us, ‘Do not eat from it, and do not touch it, lest you die.’” And the serpent said to the woman, “You will not surely die, for God knows that on the day you eat from it, your eyes will be opened, and you will be like gods, and you will know good.”
translation:
  language: de
  text: 'Gott sagte zu uns: »Esst nicht davon und berührt es nicht, damit ihr nicht sterbt.« Und die Schlange sagte zu der Frau: »Ihr werdet keineswegs sterben. Denn Gott weiß, dass an dem Tag, an dem ihr davon esst, eure Augen sich öffnen werden; ihr werdet wie Götter sein und das Gute[a] erkennen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gutes erkennen«.'
    reason: Die geʿezische Form ሠናየ kann hier substantivisch bestimmt als »das Gute« oder weniger bestimmt als »Gutes« verstanden werden.
lexical_decisions:
- source_word: አርዌ፡ ምድር
  choice: die Schlange
  rationale: Die geʿezische Wendung bedeutet wörtlich etwa »Kriechtier/Schlange der Erde«; im Erzählzusammenhang ist die natürliche deutsche Wiedergabe »die Schlange«.
- source_word: አኮ፡ ሞተ፡ ዘትመውቱ
  choice: Ihr werdet keineswegs sterben
  rationale: Die emphatische Verneinung der Todesfolge wird idiomatisch und mit Nachdruck wiedergegeben.
- source_word: ይትረኀዉ፡ አዕይንቲክሙ
  choice: werden sich eure Augen öffnen
  rationale: Bewahrt das konkrete Bild des Ausgangstextes in natürlichem Deutsch.
- source_word: ከመ፡ አማልክት
  choice: wie Götter
  rationale: Der geʿezische Plural አማልክት wird formal als »Götter« wiedergegeben; eine Deutung als singularisches »Gott« wird nicht in den Haupttext eingetragen.
- source_word: ወታአምሩ፡ ሠናየ
  choice: und das Gute erkennen
  rationale: ወታአምሩ ist eine finite Verbform (»und ihr werdet erkennen/wissen«), nicht ein Partizip. Das substantivierte »das Gute« gibt ሠናየ in diesem Satz natürlich wieder.
theological_decisions:
- issue: Referenz von »wie Götter«
  choice: wie Götter
  alternative: wie Gott
  rationale: Der morphologische Plural bleibt erhalten, ohne die Aussage durch eine theologische Harmonisierung zu vereindeutigen.
- issue: Umfang der Erkenntnis
  choice: das Gute erkennen
  alternative: Gutes erkennen / Gut und Böse erkennen
  rationale: Der erhaltene geʿezische Text nennt hier nur »gut/das Gute«; »und Böse« wird trotz der Genesis-Parallele nicht ergänzt.
- issue: Stärke der Todesverneinung
  choice: keineswegs sterben
  alternative: nicht sterben
  rationale: Die nachdrückliche Konstruktion der Schlangenrede soll hörbar bleiben, ohne ihre Behauptung sachlich zu bestätigen.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch mit klarer direkter Rede. Der Numeruswechsel von »uns« zu »ihr/eure« entspricht der überlieferten Rede: Die Frau zitiert zunächst Gottes an beide Menschen gerichtetes Gebot, danach spricht die Schlange die Frau in einer Form an, die zugleich beide einschließt. Der Fußnotenmarker steht im Haupttext.'
