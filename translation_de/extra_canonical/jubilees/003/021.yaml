translation:
  language: de
  text: zur Nahrung. Sie nahm davon und aß. Dann bedeckte sie zuerst ihre Blöße mit Feigenblättern und gab Adam davon, und er aß.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለበሊዕ
  choice: zur Nahrung
  rationale: Gibt die Zweckbestimmung „zum Essen / als Nahrung“ natürlich wieder und bewahrt den Anschluss an den vorausgehenden Satz.
- source_word: ኀፍረታ
  choice: ihre Blöße
  rationale: Das Wort bezeichnet hier den schambesetzten unbedeckten Körperbereich; „Blöße“ ist im biblischen Kontext natürlicher und konkreter als das abstrakte „Scham“.
- source_word: በቈጽለ፡ በለስ
  choice: mit Feigenblättern
  rationale: Entspricht der instrumentalen Wendung mit „Blatt/Blättern der Feige“; der deutsche Plural ist in diesem Zusammenhang idiomatisch.
- source_word: ዘቀዳሚ
  choice: zuerst
  rationale: 'Bewahrt ausdrücklich die im Ge''ez belegte zeitliche Reihenfolge: Sie bedeckte zunächst ihre Blöße und gab danach Adam davon.'
theological_decisions:
- issue: Reihenfolge von Bedecken und Weitergeben
  choice: „zuerst“ auf das Bedecken bezogen
  alternative: „auch“ auf das Geben bezogen oder das Zeitadverb ausgelassen
  rationale: ዘቀዳሚ bezeichnet „zuerst“ und stützt die Abfolge der Handlungen; eine Wiedergabe mit „auch“ wäre im vorgelegten Quelltext unbegründet.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdig-biblischem Ton. Der Satzanfang bleibt als Anschluss an den vorausgehenden Vers erkennbar; „Dann“ verdeutlicht ohne zusätzliche Deutung den Fortgang der Handlung.
