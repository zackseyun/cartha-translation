  text: And at the new moon of the fourth month Adam and his wife went out from the garden of Eden, and they dwelt in the land of Elda, in the land of their creation.
translation:
  language: de
  text: Und beim Neumond des vierten Monats verließen Adam und seine Frau den Garten Eden und ließen sich im Land Elda[a] nieder, im Land, in dem sie erschaffen worden waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die als „Elda“ wiedergegebene Ortsbezeichnung ist in der äthiopischen Überlieferung unsicher. Die Übersetzung bewahrt die herkömmliche Umschrift des wahrscheinlichen Eigennamens, statt ihm eine nicht gesicherte Bedeutung zu geben.
    reason: textual_variant
lexical_decisions:
- source_word: አመ፡ ሠርቀ፡ ወርኅ፡ ራብዕ
  choice: beim Neumond des vierten Monats
  rationale: Die Wendung bezeichnet den Beginn des vierten Monats durch das Erscheinen des Neumonds; die knappe deutsche Form gibt den kalendarischen Sinn natürlich wieder.
- source_word: ወፅኡ
  choice: verließen
  rationale: Wörtlich „gingen hinaus“; mit dem Ausgangspunkt „Garten Eden“ ist „verließen“ im Deutschen idiomatisch und bedeutungsgleich.
- source_word: ወኀደሩ
  choice: ließen sich … nieder
  rationale: Das Verb kann wohnen, bleiben oder sich niederlassen bezeichnen. Im Zusammenhang mit dem Verlassen Edens drückt „ließen sich nieder“ den Ortswechsel natürlich aus.
- source_word: ምድረ፡ ፴፬ አሐዱ
  choice: Land Elda
  rationale: Die überlieferte Ortsbezeichnung ist textlich unsicher. Die konventionelle Transliteration „Elda“ bewahrt den wahrscheinlichen Eigennamen, ohne eine spekulative Bedeutung einzutragen.
- source_word: ምድረ፡ ፍጥረቶሙ
  choice: Land, in dem sie erschaffen worden waren
  rationale: Die Genitivkonstruktion bedeutet wörtlich „Land ihrer Erschaffung“. Die Relativsatzform ist in modernem Deutsch klar und bewahrt den Rückbezug auf beide Personen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Seine Frau“ ist gegenüber „sein Weib“ zeitgemäß; „Garten Eden“ folgt dem etablierten biblischen Sprachgebrauch. Die Satzstruktur bleibt nahe am äthiopischen Text, wird aber für flüssiges Deutsch leicht geglättet.
