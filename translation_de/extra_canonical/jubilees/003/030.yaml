  yaml_path: translation/extra_canonical/jubilees/003/030.yaml
  text: Therefore it was commanded on the heavenly tablets concerning all those who know the judgment of the law, that they should cover their shame and should not uncover themselves as the nations uncover themselves.
translation:
  language: de
  text: Darum wurde auf den himmlischen Tafeln allen, die das Recht des Gesetzes kennen, geboten, ihre Blöße zu bedecken und sich nicht zu entblößen, wie die Völker sich entblößen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በእንተ፡ ዝንቱ
  choice: Darum
  rationale: Gibt die folgernde Rückbindung an Adams Bekleidung im vorangehenden Kontext natürlich und knapp wieder.
- source_word: ጽላተ፡ ሰማይ
  choice: himmlischen Tafeln
  rationale: Entspricht der festen Ausdrucksweise des Jubiläenbuches für die himmlische Rechtsurkunde.
- source_word: ፍትሐ፡ ሕግ
  choice: das Recht des Gesetzes
  rationale: Bewahrt beide Substantive und lässt offen, ob ፍትሕ stärker als Recht, Rechtsbestimmung oder Urteil zu verstehen ist.
- source_word: ኀፍረቶሙ
  choice: ihre Blöße
  rationale: Im Zusammenhang mit Bedecken und Entblößen bezeichnet das Wort konkret die schamhaft zu bedeckenden Körperteile; die Formulierung wahrt zugleich den Aspekt der Scham.
- source_word: አሕዛብ
  choice: die Völker
  rationale: Neutrale, traditionsgemäße Wiedergabe; vermeidet die heute abwertend wirkende Bezeichnung „Heiden“.
theological_decisions:
- issue: Adressaten des auf den Tafeln verzeichneten Gebots
  choice: allen, die das Recht des Gesetzes kennen
  alternative: über alle, die das Recht des Gesetzes kennen
  rationale: Der Ge'ez-Text verbindet die Präposition mit dem Gebot und den Gesetzeskundigen. Die gewählte deutsche Fassung versteht sie idiomatisch als Adressaten, ohne eine bestimmte spätere religiöse Gruppe einzutragen.
- issue: Vergleich mit den Völkern
  choice: wie die Völker sich entblößen
  alternative: wie sich die Heiden entblößen
  rationale: Die Aussage des Quelltextes wird erhalten, ohne durch „Heiden“ eine zusätzliche konfessionelle Wertung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Anschluss an die Ge'ez-Syntax. Der Satz bleibt gesetzlich-feierlich, ist aber für heutige Leser unmittelbar verständlich.
