translation:
  language: de
  text: Darum sollen Mann und Frau eins sein. Darum soll ein Mann seinen Vater und seine Mutter verlassen, sich mit seiner Frau verbinden und sie sollen ein Fleisch sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ብእሲ ወብእሲት
  choice: Mann und Frau
  rationale: Gibt die beiden Geschlechtsbezeichnungen direkt und in natürlichem modernem Deutsch wieder.
- source_word: አሐደ
  choice: eins
  rationale: Bewahrt die knappe Aussage des Ge’ez, ohne sie näher als soziale oder körperliche Einheit auszudeuten.
- source_word: የኀድግ
  choice: verlassen
  rationale: Entspricht dem Grundsinn des Verbs und der vertrauten Schöpfungssprache.
- source_word: ይጻመር ምስለ
  choice: sich mit … verbinden
  rationale: Bringt das Sich-Anschließen beziehungsweise Verbinden idiomatisch zum Ausdruck, ohne die Art der Verbindung unnötig festzulegen.
- source_word: ሥጋ አሐደ
  choice: ein Fleisch
  rationale: Erhält die konkrete, theologisch bedeutsame Bildsprache des Ausgangstextes.
theological_decisions:
- issue: Art der Einheit von Mann und Frau
  choice: eins sein
  alternative: ein Wesen sein / eine Einheit bilden
  rationale: Der Ausgangstext nennt die Einheit, erklärt aber ihre genaue Art nicht; die offene Formulierung bewahrt diese Spannung.
- issue: Bedeutung von „ein Fleisch“
  choice: wörtliche Bildsprache beibehalten
  alternative: ein Leib / eine leibliche Gemeinschaft
  rationale: Eine erklärende Wiedergabe würde die anthropologische und eheliche Aussage stärker festlegen, als es der Text selbst tut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst knapper, formnaher Satzstruktur. Die Wiederholung „Darum“ spiegelt die doppelte Begründungsformel des Ge’ez. Keine Fußnoten erforderlich.
