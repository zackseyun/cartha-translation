base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/003/008.yaml
  text: In the first week Adam was created[a], and the rib—his wife—was made; and in the second week he showed her to him. Therefore the command was given to keep seven days for a male, and two weeks of days for a female, in impurity.
translation:
  language: de
  text: In der ersten Woche wurden Adam und die Rippe – seine Frau – erschaffen[a]; in der zweiten Woche wurde sie ihm gezeigt. Deshalb wurde das Gebot gegeben, bei der Geburt eines Jungen sieben Tage und bei der Geburt eines Mädchens zwei Wochen lang in Unreinheit zu bleiben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Kapitel verbindet Adams und der Frau verzögerten Eintritt in Eden mit den späteren Zeiten der Unreinheit nach der Geburt eines Jungen beziehungsweise eines Mädchens.
    reason: cross_reference
lexical_decisions:
- source_word: ገቦ ብእሲቱ
  choice: die Rippe, seine Frau
  rationale: Bewahrt die auffällige Gleichsetzung der Frau mit der aus Adam genommenen Rippe und folgt der substantivischen Formulierung des ge'ezischen Textes.
- source_word: ሱባ መዋዕለ
  choice: sieben Tage
  rationale: Gibt die bestimmte Zeitspanne idiomatisch und präzise wieder.
- source_word: ክልኤ ሱባዐ መዋዕለ
  choice: zwei Wochen lang
  rationale: Das Ge'ez bezeichnet wörtlich zwei Siebenergruppen von Tagen; im Deutschen ist »zwei Wochen lang« natürlich und inhaltlich eindeutig.
- source_word: ውስተ ርኵስን
  choice: in Unreinheit zu bleiben
  rationale: Die Zustandsangabe wird im Zusammenhang mit dem Gebot idiomatisch verbalisiert, ohne ihren kultischen Sinn abzuschwächen.
theological_decisions:
- issue: Begründung der Reinheitsfristen durch die Erschaffung und Vorstellung der Frau
  choice: Der kausale Zusammenhang wird mit »Deshalb« ausdrücklich bewahrt.
  alternative: Die Sätze nur zeitlich aneinanderreihen.
  rationale: Der Quelltext stellt selbst eine Folgerungsbeziehung her und verbindet die Schöpfungserzählung mit den späteren Fristen kultischer Unreinheit.
- issue: Bezug von »männlich« und »weiblich«
  choice: »bei einem Jungen« und »bei einem Mädchen«
  alternative: »für einen Mann« und »für eine Frau«
  rationale: Der Kontext der vorgeschriebenen Reinheitsfristen betrifft die Geburt eines männlichen beziehungsweise weiblichen Kindes; die deutsche Formulierung macht diesen im Kapitel angelegten Bezug verständlich, ohne eine konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante Formulierung »die Rippe, seine Frau« bleibt erhalten; die Fristen werden zugleich natürlich und für heutige Leser verständlich ausgedrückt.
