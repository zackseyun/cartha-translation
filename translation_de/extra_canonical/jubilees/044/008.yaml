  yaml_path: translation/extra_canonical/jubilees/044/008.yaml
  text: And Israel sent Judah before him to his son Joseph, so that he might examine the land of Goshen, because there Joseph had told his brothers to come and dwell, so that they might be near him. And it was the best of the land of Egypt, and near to him, for all of them and for their livestock.
translation:
  language: de
  text: Und Israel schickte Juda vor sich her zu seinem Sohn Josef, damit er das Land Goschen erkunde.[a] Denn Josef hatte seinen Brüdern gesagt, sie sollten dorthin kommen und dort wohnen, um in seiner Nähe zu sein. Es war der beste Teil des Landes Ägypten[b] und lag für sie alle und ihr Vieh nahe bei ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: vorbereiten.'
    reason: Die überlieferte Form kann in diesem Zusammenhang auch im Sinn einer Vorbereitung des Siedlungsgebiets verstanden werden.
  - marker: b
    text: 'Oder: Es war gut im Land Ägypten.'
    reason: Die Wendung kann entweder idiomatisch-superlativ auf Goschen als besten Teil Ägyptens oder schlichter als Aussage über seine gute Beschaffenheit verstanden werden.
lexical_decisions:
- source_word: ያስተዳሉ (yāstadāllu)
  choice: erkundete
  rationale: Der Kontext bezeichnet Judas vorausgehende Begutachtung des Landes Goschen. „Erkunden“ gibt den Sinn von untersuchen bzw. auskundschaften natürlich wieder, ohne die mögliche Lesart „vorbereiten“ in den Haupttext zu übernehmen.
- source_word: ሠናይት (śannāyt)
  choice: das beste Gebiet
  rationale: Das Adjektiv bezeichnet hier idiomatisch den besonders guten bzw. besten Teil des Landes; „Gebiet“ verdeutlicht, dass Goschen gemeint ist.
- source_word: እንስሳ (ʾənsəsā)
  choice: Vieh
  rationale: Im Zusammenhang mit der Ansiedlung von Jakobs Haus bezeichnet das Wort den Nutztierbestand, nicht Tiere allgemein.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die Wiederholung von „dort“ macht Ziel und Aufenthalt im Deutschen eindeutig. „In seiner Nähe“ bewahrt den Bezug auf Josef; die Schlussformulierung lässt die im Ausgangstext knappe Zuordnung von Nähe, Menschen und Vieh bestehen.
