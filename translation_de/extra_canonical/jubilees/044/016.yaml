base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/044/016.yaml
  text: 'And the sons of Zilpah[16], Leah’s maidservant, whom she bore to Jacob: Gad and Asher. And these are the names of their sons who came with him into Egypt. The sons of Gad: Ziphion, Haggi, Shuni, Ezbon, Eri, Arodi, and Areli—seven.'
translation:
  language: de
  text: 'Und die Söhne Silpas, der Dienerin Leas, die sie Jakob gebar, waren Gad und Ascher. Dies sind die Namen ihrer Söhne, die mit ihm nach Ägypten kamen: die Söhne Gads waren Zifjon, Haggi, Schuni, Ezbon, Eri, Arodi und Areli[a] – sieben insgesamt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Ein Name in der Liste der Söhne Gads ist in der überlieferten Textzeile nicht lesbar. „Areli“ ergänzt die wahrscheinlichste Namensfolge nach der äthiopischen Überlieferung und 1. Mose 46,16.
    reason: Textlücke in der vorgelegten Ge’ez-Zeile; die Ergänzung ist für die ausdrücklich genannte Gesamtzahl sieben erforderlich und wird kenntlich gemacht.
lexical_decisions:
- source_word: ላእከታ
  choice: Dienerin
  rationale: Das Wort bezeichnet eine weibliche Bedienstete; „Dienerin“ ist im heutigen Deutsch verständlich und weniger missverständlich als „Magd“.
- source_word: ቦኡ፡ ምስሌሁ፡ ውስተ፡ ግብፅ
  choice: die mit ihm nach Ägypten kamen
  rationale: Gibt die Bewegungsrichtung und die Begleitung Jakobs natürlich und quellennah wieder.
- source_word: ሰማረቱ
  choice: sieben insgesamt
  rationale: Die abschließende Summenzahl wird ausdrücklich wiedergegeben; „insgesamt“ verdeutlicht ihre Funktion im deutschen Satz.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die genealogische Satzstruktur bleibt erkennbar, wird aber durch einen Doppelpunkt und die Wendung „sieben insgesamt“ lesbarer gestaltet. Eigennamen folgen gebräuchlichen deutschen Bibelformen, soweit eindeutig.
