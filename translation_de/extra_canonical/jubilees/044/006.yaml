base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/044/006.yaml
  text: I will go down with you, and I will surely bring you up again. And in this land you will be buried, and Joseph will place his hands on your eyes. Do not fear; go down into Egypt.”
translation:
  language: de
  text: Ich werde mit dir hinabziehen, und ich werde dich auch wieder heraufführen. In diesem Land wirst du begraben werden, und Josef wird seine Hände[a] auf deine Augen legen. Fürchte dich nicht; zieh hinab nach Ägypten.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'In einer anderen Textüberlieferung steht: »seine Hand«.'
    reason: Die ge'ezische Fassung hat die Mehrzahl; die Fußnote dokumentiert die bekannte abweichende Einzahl der parallelen Überlieferung, ohne sie in den Haupttext zu übernehmen.
lexical_decisions:
- source_word: እወርድ፡ ምስሌከ
  choice: Ich werde mit dir hinabziehen
  rationale: Gibt Bewegungsrichtung und Begleitung des ge'ezischen Ausdrucks natürlich und formnah wieder.
- source_word: አወጽአከ
  choice: ich werde dich auch wieder heraufführen
  rationale: Das Verb bezeichnet das Herausführen; „heraufführen“ entspricht der räumlichen Perspektive des Hinabziehens nach Ägypten. „wieder“ macht die Rückführung idiomatisch verständlich, ohne ihren genauen Vollzug festzulegen.
- source_word: በዛቲ፡ ምድር
  choice: in diesem Land
  rationale: Bewahrt den Demonstrativausdruck und lässt dessen Bezug so offen, wie er im Text vorliegt.
- source_word: ያነብር፡ እዴሁ፡ ዲበ፡ አዕይንቲከ
  choice: wird seine Hände auf deine Augen legen
  rationale: Bewahrt die konkrete Sterbeszene und folgt der im ge'ezischen Text bezeugten Mehrzahl „Hände“, statt die Wendung erklärend als „die Augen schließen“ aufzulösen.
- source_word: ኢትፍራህ
  choice: Fürchte dich nicht
  rationale: Dignified and direct standard German equivalent of the prohibition.
theological_decisions:
- issue: Art und Zeitpunkt der verheißenen Heraufführung
  choice: Die Aussage bleibt ohne Erklärung, ob sie Jakobs lebendige Rückkehr, seine Bestattung oder die spätere Rückführung seiner Nachkommen meint.
  alternative: Die Heraufführung ausdrücklich auf Jakobs Leichnam oder auf Israel als Volk beziehen.
  rationale: Der Ausgangstext stellt Verheißung und Bestattungsaussage nebeneinander und löst die darin liegende Spannung nicht ausdrücklich auf.
- issue: Bezug von „diesem Land“
  choice: Der Demonstrativbezug wird unverändert beibehalten.
  alternative: Das Land ausdrücklich als Kanaan oder Ägypten identifizieren.
  rationale: Eine ausdrückliche Identifikation würde die syntaktisch-kontextuelle Mehrdeutigkeit stärker festlegen als der ge'ezische Wortlaut.
