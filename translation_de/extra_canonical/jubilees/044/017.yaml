  text: 'And the sons of Asher: Imnah, Ishvah, Beriah, and Serah, their sister—four. All the persons were sixteen, and all the persons of Leah were forty-nine.'
translation:
  language: de
  text: 'Und die Söhne Aschers: Jimna, Jischwa, Beria und Serach, ihre Schwester – fünf[a]. Insgesamt waren es sechzehn Personen; alle Personen Leas zusammen waren neunundvierzig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte geʿezische Text hat „fünf“, obwohl nur vier Personen namentlich aufgeführt werden.
    reason: Die Fußnote dokumentiert die Spannung zwischen der überlieferten Zahl und der Namensliste, ohne den Text der Übersetzung zu emendieren.
