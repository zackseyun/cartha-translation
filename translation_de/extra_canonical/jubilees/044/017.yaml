  rationale: Die genealogische Formel wird direkt und in natürlichem Deutsch wiedergegeben.
- source_word: ነፍስ
  choice: Personen
  rationale: In einer genealogischen Zählung bezeichnet das Wort einzelne Menschen beziehungsweise Angehörige; „Seelen“ wäre im heutigen Deutsch missverständlich. Die Wiederholung wird in beiden Zählsätzen beibehalten.
- source_word: እኅቶሙ
  choice: ihre Schwester
  rationale: Das Possessivverhältnis des geʿezischen Ausdrucks wird ausdrücklich wiedergegeben.
- source_word: ኵሉ፡ ዘልያ
  choice: alle Personen Leas zusammen
  rationale: Die elliptische Wendung wird aus dem unmittelbar vorausgehenden „Personen“ ergänzt, ohne sie als bloße Abstammungslinie umzudeuten.
