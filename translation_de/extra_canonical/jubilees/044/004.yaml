  text: And on the sixteenth the Lord appeared to him and said to him, “Jacob, Jacob.” And he said, “Here I am.”
translation:
  language: de
  text: 'Und am sechzehnten Tag erschien ihm der Herr und sagte zu ihm: »Jakob, Jakob!« Er antwortete: »Hier bin ich.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አመ፡ ዐሡሩ፡ ወስዱሱ
  choice: am sechzehnten Tag
  rationale: Die geʿezische Datumsformel bedeutet wörtlich »am sechzehnten«; »Tag« wird im Deutschen zum natürlichen Verständnis ergänzt.
- source_word: እግዚአብሔር
  choice: der HERR
  rationale: Die übliche würdige Wiedergabe der Gottesbezeichnung in diesem erzählerischen Kontext.
- source_word: አስተርአዮ
  choice: erschien ihm
  rationale: Gibt die Offenbarungsform des geʿezischen Verbs unmittelbar wieder.
- source_word: ነየ፡ አነ
  choice: Hier bin ich
  rationale: Natürliche deutsche Entsprechung der Antwort auf einen persönlichen Ruf; sie bewahrt die Bereitschaftsformel.
theological_decisions:
- issue: Gottesbezeichnung
  choice: der HERR
  alternative: Gott / der Herr
  rationale: Der Quelltext nennt hier እግዚአብሔር; die traditionelle Schreibweise »HERR« kennzeichnet die göttliche Anrede, ohne den Satz zusätzlich auszudeuten.
