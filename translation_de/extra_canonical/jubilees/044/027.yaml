  yaml_path: translation/extra_canonical/jubilees/044/027.yaml
  text: And all the persons of Jacob who entered Egypt were seventy persons. These are his sons and the sons of his sons[27], all of them seventy-five.
translation:
  language: de
  text: Alle Personen aus Jakobs Familie, die nach Ägypten kamen, waren siebzig. Das waren seine Söhne und die Söhne seiner Söhne[a], insgesamt fünfundsiebzig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Zahlenangaben des Kapitels sind offenbar bewusst, aber nicht ohne Weiteres miteinander zu verrechnen: Hier ist zunächst von siebzig Personen die Rede, die nach Ägypten kamen, danach von insgesamt fünfundsiebzig Nachkommen. Im Anschluss wird erklärt, dass fünf in Ägypten starben; Josef und seine beiden Söhne sind von dieser Todesangabe ausgenommen.'
    reason: Die Fußnote bewahrt die auffällige arithmetische Spannung des überlieferten Textes, ohne sie durch eine unbelegte Harmonisierung aufzulösen.
lexical_decisions:
- source_word: መንፈስ (manfas)
  choice: Personen / Angehörige
  rationale: Das Wort bedeutet wörtlich „Geist“ und kann hier, wie in einer Volkszählung, einzelne Menschen beziehungsweise Personen bezeichnen. „Angehörige Jakobs“ gibt die Zugehörigkeit natürlich wieder; „Personen“ bewahrt die Zählsprache.
- source_word: ውሉዱ ወውሉደ ውሉዱ
  choice: seine Kinder und seine Enkel
  rationale: 'Wörtlich: „seine Kinder und die Kinder seiner Kinder“. „Seine Kinder und seine Enkel“ ist im modernen Deutsch gleichbedeutend und klarer.'
- source_word: ቦአ ውስተ ግብጽ
  choice: nach Ägypten kamen
  rationale: Das Verb bezeichnet das Hineingehen beziehungsweise Eintreten; bei einem Land ist „nach Ägypten kamen“ natürlich und inhaltlich genau.
theological_decisions:
- issue: Spannung zwischen den Zahlen siebzig und fünfundsiebzig
  choice: Beide Zahlen unverändert und ohne Harmonisierung im Haupttext wiedergeben
  alternative: Eine Zahl durch Textkorrektur, inklusive Zählweise oder Angleichung an eine andere Überlieferung erklären
  rationale: Der äthiopische Wortlaut nennt ausdrücklich zunächst siebzig und anschließend fünfundsiebzig. Die Spannung gehört zum überlieferten Text und darf nicht stillschweigend aufgelöst werden.
