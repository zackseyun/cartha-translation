lexical_decisions:
- source_word: ዐሠርቱ፡ ወአሐዱ
  choice: Elf
  rationale: Die Zahl wird entsprechend der Versgliederung als knapper, eigenständiger Abschluss des vorhergehenden genealogischen Eintrags wiedergegeben.
- source_word: ኵሉ፡ ነፍስ፡ ዘራሔል
  choice: Insgesamt waren es … Personen, die von Rahel abstammten
  rationale: ነፍስ bezeichnet hier im genealogischen Zählkontext Personen; die deutsche Formulierung gibt die Zugehörigkeits- beziehungsweise Abstammungsbeziehung natürlich wieder.
- source_word: ዐሠርቱ፡ ወአርባዕቱ
  choice: vierzehn
  rationale: Direkte Wiedergabe der ge'ezischen Zahl.
- source_word: ወውሉደ፡ ባላ፡ ላእከታ
  choice: 'Und die Söhne Bilhas, ihrer Dienerin:'
  rationale: ላእከታ bedeutet mit femininem Possessivsuffix „ihre Dienerin“ und bezieht sich auf Bilha als Rahels Dienerin. Der Doppelpunkt bewahrt die einleitende Funktion für die folgende Namensliste.
theological_decisions:
- issue: Beziehungsangabe zu Rahel
  choice: „die von Rahel abstammten“ und „ihrer Dienerin“
  alternative: „die Rahel gehörten“ beziehungsweise „ihre Magd“
  rationale: Die gewählte Fassung ist im modernen Deutsch klar, ohne eine zusätzliche theologische oder rechtliche Deutung der genealogischen Zugehörigkeit einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der fragmentarische Versanfang „Elf.“ und der offene genealogische Übergang am Versende bleiben bewusst erhalten. „Dienerin“ ist heute natürlicher und neutraler als „Magd“.
