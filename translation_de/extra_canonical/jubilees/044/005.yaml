  yaml_path: translation/extra_canonical/jubilees/044/005.yaml
  text: And he said to him, “I am the God of your fathers, the God of Abraham and Isaac. Do not fear; go down into Egypt, for there I will make you into a great nation.”
translation:
  language: de
  text: 'Und er sagte zu ihm: »Ich bin der Gott deines Vaters, der Gott Abrahams und Isaaks. Fürchte dich nicht; zieh hinab nach Ägypten, denn dort werde ich dich zu einem großen Volk machen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አቡከ (ʾabuka)
  choice: deines Vaters
  rationale: Die vorgelegte geʿezische Textgestalt hat den Singular »deines Vaters«; dieser wird trotz der pluralischen englischen Konsultationsfassung bewahrt.
- source_word: ኢትፍራህ
  choice: Fürchte dich nicht
  rationale: Entspricht der verneinten Aufforderung und ist im Deutschen natürlich und würdevoll.
- source_word: ወሪደ ግብጽ
  choice: zieh hinab nach Ägypten
  rationale: Bewahrt die räumliche Bewegungsrichtung des geʿezischen Verbs.
- source_word: ውስተ ዐቢይ ሕዝብ እሬስየከ
  choice: werde ich dich zu einem großen Volk machen
  rationale: Gibt die Zielaussage idiomatisch wieder, ohne ihren Verheißungscharakter abzuschwächen.
theological_decisions:
- issue: Singular oder Plural in der Gottesbezeichnung
  choice: der Gott deines Vaters
  alternative: der Gott deiner Väter
  rationale: Im bereitgestellten Ausgangstext steht አቡከ, morphologisch Singular. Die anschließende Apposition »der Gott Abrahams und Isaaks« wird nicht zur stillschweigenden Änderung in einen Plural benutzt.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem biblischem Ton. Die direkte Rede wird klar und knapp wiedergegeben; echte Quellenspannungen werden nicht harmonisiert.
