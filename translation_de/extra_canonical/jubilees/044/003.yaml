  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die wesentlichen Elemente des ge’ezischen Textes zutreffend wieder: das siebentägige Warten auf eine Vision, das Bleiben beziehungsweise Hinabziehen, das Erntefest der Erstlingsfrüchte aus altem Weizen sowie die alle Lebewesen betreffende Hungersnot. Die Formulierung „zu Josef zu schicken“ bleibt im Deutschen jedoch ohne ausgedrücktes Sendungsobjekt missverständlich und unidiomatisch.'
  naturalness: Modernes, würdiges Deutsch ist weitgehend erreicht. „Josef zu sich zu rufen“ ist hier die natürliche deutsche Wiedergabe der Erwägung, Joseph zu sich kommen zu lassen, ohne ein bestimmtes Medium der Nachricht zu behaupten. „in einer Vision zu erkennen“ ist idiomatischer als „in einer Vision zu sehen“.
  terminology: „Josef“, „Kanaan“, „Erstlingsfrüchte“, „alter Weizen“ und „Hungersnot“ sind angemessen. „Erntefest der Erstlingsfrüchte“ bildet die ge’ezische Verbindung aus Fest, Ernte und Erstlingsfrüchten im Deutschen geschlossener ab. Die Unterscheidung von wilden Tieren, Vieh und Vögeln bleibt erhalten.
