  - severity: low
    issue: „um in einer Vision zu sehen“ ist stilistisch holprig
    rationale: Die Wendung kann natürlich als „um in einer Vision zu erkennen“ wiedergegeben werden; die visionäre Erkenntnis und die offene Alternative bleiben gewahrt.
