  yaml_path: translation/extra_canonical/jubilees/044/003.yaml
  text: And while he was considering sending to Joseph that he should come to him[3], and not going down himself, he remained there seven days, to see in a vision whether he should stay or whether he should go down. And he celebrated the feast of the harvest of the firstfruits of the old grain, for in all the land of Canaan there was not a handful of any seed in the land, because the famine was upon all the beasts and the livestock and the birds and also upon men.
translation:
  language: de
  text: Während er erwog, Josef zu sich zu rufen und nicht selbst hinabzuziehen, blieb er dort sieben Tage, um in einer Vision zu erkennen, ob er bleiben oder hinabziehen sollte.[a] Dann feierte er das Erntefest der Erstlingsfrüchte aus altem Weizen; denn im ganzen Land Kanaan gab es keine Handvoll irgendeiner Saat, weil die Hungersnot über alle wilden Tiere, das Vieh, die Vögel und auch über die Menschen gekommen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte ge’ezische Text dieses Verses ist stellenweise schwierig. Gemeint scheint zu sein, dass Jakob sieben Tage auf eine bestätigende Vision wartete und ein Erstlings- beziehungsweise Erntefest mit altem Weizen beging, weil die Hungersnot keinen neuen Ertrag übrig gelassen hatte.
    reason: textual_variant
lexical_decisions:
- source_word: ይሔሊ፡ ይልአክ፡ ለዮሴፍ
  choice: er erwog, zu Josef zu schicken
  rationale: Gibt die Erwägung und das Senden zu Josef wieder, ohne ein im Text nicht ausdrücklich genanntes »Wort« oder »Boten« einzufügen.
- source_word: ይከብር
  choice: bleiben
  rationale: Im Gegensatz zu »hinabziehen« ist hier der kontextuelle Sinn »bleiben/wohnen« gemeint.
- source_word: በዓለ፡ ማእረረ፡ ቀዳሚ፡ ፍሬ
  choice: das Fest der Ernte der Erstlingsfrüchte
  rationale: Bewahrt sowohl »Fest« als auch das ausdrücklich vorhandene »Ernte« und den Bezug auf Erstlingsfrüchte.
- source_word: እምሥርናይ፡ ብሉይ
  choice: vom alten Weizen
  rationale: ሥርናይ bezeichnet spezifisch Weizen; »alt« wird trotz der sachlichen Spannung wörtlich erhalten.
- source_word: ዐባር
  choice: Hungersnot
  rationale: Das Wort bezeichnet Hungersnot und darf nicht als bloßer pronominaler Rückverweis ausgelassen werden.
- source_word: አራዊት፡ ለእንስሳ፡ ወለአዕዋፍ
  choice: alle wilden Tiere, das Vieh, die Vögel
  rationale: Unterscheidet wilde Tiere, domestizierte Tiere und Vögel in natürlichem modernem Deutsch.
theological_decisions:
- issue: Die Vision als Entscheidungshilfe für Jakobs Weg
  choice: »um in einer Vision zu sehen, ob er bleiben oder hinabziehen sollte«
  alternative: Die Vision als bereits feststehende göttliche Anweisung zu formulieren
  rationale: Der Text lässt Jakobs erwartete Bestätigung zunächst offen; diese Spannung wird nicht theologisch vorentschieden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Verbindung von Erntefest, Erstlingsfrüchten und altem Weizen bleibt erhalten, statt geglättet zu werden; der schwierige Satzbau wird jedoch lesbar geordnet.
