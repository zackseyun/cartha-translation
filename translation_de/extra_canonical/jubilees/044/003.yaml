  to: Während er erwog, Josef zu sich zu rufen und nicht selbst hinabzuziehen, blieb er dort sieben Tage, um in einer Vision zu erkennen, ob er bleiben oder hinabziehen sollte.[a] Dann feierte er das Erntefest der Erstlingsfrüchte aus altem Weizen; denn im ganzen Land Kanaan gab es keine Handvoll irgendeiner Saat, weil die Hungersnot über alle wilden Tiere, das Vieh, die Vögel und auch über die Menschen gekommen war.
