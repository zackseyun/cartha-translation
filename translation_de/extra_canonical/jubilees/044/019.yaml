  text: 'And sons were born to Joseph in Egypt before his father came into Egypt, whom Asenath, the daughter of Potiphar, priest of Heliopolis, bore to him: Manasseh and Ephraim—two.'
translation:
  language: de
  text: 'Und Josef wurden in Ägypten, bevor sein Vater nach Ägypten kam, Söhne geboren, die Asenat, die Tochter Potifars, des Priesters von Heliopolis, ihm gebar: Manasse und Efraim – zwei.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተወልዱ፡ ለዮሴፍ
  choice: Josef wurden … Söhne geboren
  rationale: Gibt die äthiopische Geburtsformel eng und zugleich idiomatisch auf Deutsch wieder.
- source_word: ዘእንበለ፡ ይባእ፡ አቡሁ፡ ውስተ፡ ግብፅ
  choice: bevor sein Vater nach Ägypten kam
  rationale: Bewahrt die zeitliche Aussage und gibt das Bewegungsverb aus der Perspektive Josefs natürlich wieder.
- source_word: አስኔት
  choice: Asenat
  rationale: Verwendet die im modernen deutschen Bibelgebrauch geläufige Namensform.
- source_word: ጶጢፋራ
  choice: Potifar
  rationale: Folgt der üblichen deutschen Namensform; gemeint ist der Vater Asenats, nicht notwendig der gleichnamig wiedergegebene Hofbeamte aus Genesis 39.
- source_word: ካህን፡ ዘኤልዮጶሊስ
  choice: Priester von Heliopolis
  rationale: Gibt Amt und Ortsbezug direkt wieder; Heliopolis entspricht dem in Genesis genannten On.
- source_word: ምናሴ፡ ወኤፍሬም፡ ፪
  choice: Manasse und Efraim – zwei
  rationale: Erhält sowohl die Namen als auch die abschließende Zählangabe des genealogischen Verzeichnisses.
