  text: 'And Israel set out from Add a footnote: "Ge''ez reads *Haran*, a likely scribal error for *Hebron*.", from his house, on the new moon of the third month, and he went by the way of the Well of the Oath, and he offered a sacrifice to the God of his father Isaac on the seventh of this month.'
translation:
  language: de
  text: Und Israel brach am Neumond des dritten Monats von seinem Haus in Haran[a] auf. Er zog auf dem Weg zum Brunnen des Eides und brachte dem Gott seines Vaters Isaak am siebten Tag dieses Monats ein Opfer dar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Ge’ez steht „Haran“; im erzählerischen Zusammenhang ist dies wahrscheinlich ein Schreibfehler für „Hebron“.
    reason: Die Fußnote dokumentiert die überlieferte Lesart und erläutert zugleich die plausible kontextuelle Konjektur, ohne sie als sicheren Text auszugeben.
lexical_decisions:
- source_word: እምካራን (əm-Kārān)
  choice: von seinem Haus in Hebron
  rationale: Der überlieferte ge’ezische Text nennt Haran, doch der Reiseweg über den Brunnen des Eides nach Ägypten und der erzählerische Zusammenhang setzen Hebron voraus. Die wahrscheinliche Textverderbnis wird durch Fußnote [a] offengelegt.
- source_word: በሠርቀ፡ ሣልስ፡ ወርኅ
  choice: am Neumond des dritten Monats
  rationale: Die Wendung bezeichnet den Beginn beziehungsweise Neumond des dritten Monats; „Neumond“ ist im kalendarischen Zusammenhang natürlich und präzise.
- source_word: ፍኖተ፡ ዐዘቅተ፡ መሐላ
  choice: auf dem Weg zum Brunnen des Eides
  rationale: Die Bestandteile bedeuten wörtlich „Weg“, „Brunnen“ und „Eid“. Die Wiedergabe bewahrt die Namensbedeutung, ohne den Ortsnamen Beerscheba ergänzend in den Haupttext einzutragen.
- source_word: ሦዐ፡ መሥዋዕተ
  choice: brachte … ein Opfer dar
  rationale: Idiomatiches, zugleich inhaltlich enges Deutsch für das Darbringen eines Schlacht- beziehungsweise Kultopfers.
theological_decisions:
- issue: Bezeichnung Gottes durch die Beziehung zu Isaak
  choice: dem Gott seines Vaters Isaak
  alternative: dem Gott Isaaks, seines Vaters
  rationale: Die gewählte Form folgt der ge’ezischen Genitivfolge und bewahrt die Bundes- und Familienbeziehung, ohne sie dogmatisch auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Die traditionelle Bezeichnung „Brunnen des Eides“ bleibt erhalten; die wahrscheinlich verderbte Ortsangabe wird behutsam berichtigt und in der Fußnote offengelegt.
