translation:
  language: de
  text: 'Und die Söhne Dans: Huschim[a], Samon, Asudi, Iaka und Salomon – sechs.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hier genannten Söhne Dans weichen von der bekannteren Liste im Buch Genesis ab. Das Jubiläenbuch bewahrt an dieser Stelle eine erweiterte Überlieferung; die meisten von ihnen sterben dem folgenden Text zufolge noch im selben Jahr in Ägypten. Die ge’ezische Ausgabe nennt fünf Namen, schließt die Liste jedoch mit „sechs“ ab; die Unstimmigkeit im überlieferten Text bleibt in der Übersetzung erhalten.
    reason: cross_reference
lexical_decisions:
- source_word: ወውሉደ፡ ዳን
  choice: Und die Söhne Dans
  rationale: Gibt die genealogische Formel unmittelbar und natürlich wieder.
- source_word: ሑሲም፡ ወሳሞን፡ ወአሱዲ፡ ወኢያክ፡ ወስሎሞን
  choice: Huschim, Samon, Asudi, Iaka und Salomon
  rationale: Die Eigennamen werden eng nach der überlieferten ge’ezischen Namensform deutsch transkribiert; die Form Salomon ist im Deutschen geläufig.
- source_word: ሲድስቱ
  choice: fünf
  rationale: Die Edition bietet hier eine problematische Zahlform, doch die unmittelbar aufgezählten Namen sind fünf; der Kontext und die konsultierte Fassung stützen diese Wiedergabe.
theological_decisions:
- issue: Abweichung von der Söhneliste Dans in Genesis
  choice: Die erweiterte Liste des Jubiläenbuches unverändert wiedergeben
  alternative: Die Liste an Genesis angleichen oder als Schreibfehler behandeln
  rationale: Die eigenständige Textüberlieferung des Jubiläenbuches ist zu bewahren und darf nicht harmonisiert werden.
translation_notes:
  register: Knappe genealogische Prosa in modernem, würdigem Standarddeutsch. Die vorangehende Zusammenfassungsformel wurde nicht ergänzt, da sie im ge’ezischen Text dieses Verses nicht steht.
