base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/044/028.yaml
  text: '[And these are the names of the sons of Bilhah, the handmaid] of Rachel, the wife of Jacob, whom she bore to Jacob: Dan and Naphtali. And these are the names of their children who came with them into Egypt: the sons of Dan: Hushim and Samon.'
translation:
  language: de
  text: '[Und dies sind die Namen der Söhne Bilhas, der Dienerin Rahels, der Frau Jakobs: Dan und Naftali, die Bilha Jakob gebar.] Und dies sind die Namen ihrer Kinder, die mit ihnen nach Ägypten kamen: die Söhne Dans: Huschim und Samon.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte Versabschnitt setzt mitten im Satz ein. Der in eckigen Klammern stehende Anfang ist aus dem unmittelbar vorausgehenden Zusammenhang ergänzt. Bilha, nicht Rahel, ist die Mutter von Dan und Naftali.
    reason: Die Segmentierungsgrenze hat das ausdrückliche Subjekt Bilha abgeschnitten; die Anmerkung dokumentiert die Ergänzung und den für das Verständnis wesentlichen Bezug.
lexical_decisions:
- source_word: ብእሲቱ፡ ለያዕቆብ
  choice: der Frau Jakobs
  rationale: Die Genitivkonstruktion bezeichnet Rahel als Jakobs Frau; die heutige deutsche Form ist knapp und würdevoll.
- source_word: ዘወለደት፡ ለያዕቆብ
  choice: die sie Jakob gebar
  rationale: Das feminine Verb wird aktiv wiedergegeben und bezieht sich nach dem aus dem unmittelbaren Kontext ergänzten Satzanfang auf Bilha, nicht auf Rahel.
- source_word: ውሉዶሙ
  choice: ihrer Kinder
  rationale: Das possessive Suffix im Plural wird formal bewahrt; der Bezug auf Dan und Naftali bleibt bestehen.
- source_word: ቦኡ፡ ምስሌሆሙ፡ ውስተ፡ ግብጽ
  choice: die mit ihnen nach Ägypten kamen
  rationale: Gibt Bewegung, Begleitung und Ziel der ge'ezischen Wendung natürlich und vollständig wieder.
- source_word: ሑሲም፡ ወሳሞን
  choice: Huschim und Samon
  rationale: Die Eigennamen werden nach der Ge'ez-Form deutsch transkribiert, ohne sie an abweichende Namensformen anderer Textüberlieferungen anzugleichen.
theological_decisions:
- issue: Mutterschaft von Dan und Naftali
  choice: Bilha ist das Subjekt von „die sie Jakob gebar“
  alternative: Rahel als Mutter verstehen oder passiv „wurden Jakob geboren“ übersetzen
  rationale: Das feminine Relativverb verlangt im vollständigen, durch die Segmentierungsgrenze beschädigten Satz Bilha als Bezug. Eine passive Fassung würde die Beziehung verschleiern und könnte Dan und Naftali fälschlich Rahel zuschreiben.
- issue: Ergänzung des fehlenden Versanfangs
  choice: Die aus dem vorangehenden Kontext rekonstruierte Passage steht in eckigen Klammern
  alternative: Den fragmentarisch überlieferten Ausschnitt ohne Ergänzung als „Rahel … gebar“ wiedergeben
  rationale: Der bereitgestellte Text beginnt infolge der Kapitel-/Verssegmentierung mitten in der Konstruktion. Die Klammern machen die notwendige Ergänzung transparent, statt sie als unmittelbar vorhandenen Wortlaut auszugeben.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die syntaktische Aufzählungsstruktur des Ge'ez bleibt erhalten. Eckige Klammern kennzeichnen transparent den aufgrund der fehlerhaften Segmentierung ergänzten Versanfang.
