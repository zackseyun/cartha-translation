  yaml_path: translation/extra_canonical/jubilees/044/015.yaml
  text: 'These are the sons of Jacob and their sons, whom Leah bore to Jacob in Mesopotamia: six, and Dinah their sister, one. And all the persons of Leah’s sons and their sons who came with Jacob their father into Egypt were thirty-three; and with Jacob their father among them, they were thirty-four.'
translation:
  language: de
  text: Das sind die Söhne Jakobs und deren Söhne. Lea gebar Jakob in Mesopotamien sechs Söhne und eine Tochter, ihre Schwester Dina. Alle Personen unter Leas Söhnen und deren Söhnen, die mit ihrem Vater Jakob nach Ägypten kamen, waren dreiunddreißig; mit ihrem Vater Jakob unter ihnen waren es vierunddreißig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነፍስ
  choice: Personen
  rationale: Das äthiopische Wort bedeutet wörtlich „Seele“, bezeichnet in dieser Personenaufzählung jedoch einzelne Menschen; „Personen“ ist im modernen Deutschen natürlich und sachlich genau.
- source_word: መስጴጦምያ
  choice: Mesopotamien
  rationale: Direkte Wiedergabe des überlieferten geografischen Namens in seiner geläufigen deutschen Form.
- source_word: ውሉዱ
  choice: ihre Söhne
  rationale: Der Ausdruck bezeichnet hier die Söhne der zuvor genannten Söhne Jakobs; die wiederholte Formulierung bewahrt die genealogische Struktur des Ausgangstextes.
theological_decisions: []
translation_notes:
  register: 'Moderne, klare und würdige Erzählsprache. Die auffällige Zählformulierung des Ausgangstextes wird nicht harmonisiert: zunächst dreiunddreißig Personen, mit Jakob selbst vierunddreißig.'
