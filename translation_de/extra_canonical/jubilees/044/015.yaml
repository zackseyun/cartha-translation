  to: Das sind die Söhne Jakobs und deren Söhne. Lea gebar Jakob in Mesopotamien sechs Söhne und eine Tochter, ihre Schwester Dina. Alle Personen unter Leas Söhnen und deren Söhnen, die mit ihrem Vater Jakob nach Ägypten kamen, waren dreiunddreißig; mit ihrem Vater Jakob unter ihnen waren es vierunddreißig.
  rationale: Die Revision trennt die Aufzählung von Leas Kindern von der anschließenden Nennung ihrer Nachkommen. Sie bewahrt die genealogische Struktur, macht die ausdrücklich mitgezählte Dina sichtbar und harmonisiert die auffällige Zählung nicht.
