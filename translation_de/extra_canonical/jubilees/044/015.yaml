    issue: Mehrdeutiger bzw. sachlich verschobener Relativsatz
    rationale: In »die Lea Jakob ... gebar« können grammatisch die Söhne Jakobs einschließlich ihrer Söhne als von Lea geboren verstanden werden. Der Quelltext zählt dagegen Leas sechs Söhne und Dina auf und nennt anschließend deren Nachkommen.
  - severity: low
    issue: Die Zahlangabe zu Dina ist nicht ausdrücklich abgebildet
    rationale: Der Text zählt »sechs und eine, Dina, ihre Schwester«. »dazu ihre Schwester Dina« nennt Dina, lässt ihre Zählung als eine jedoch implizit.
