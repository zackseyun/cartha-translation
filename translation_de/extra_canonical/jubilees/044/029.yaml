  text: And Asudi, and Iyak, and Solomon were six. And they died in the year they entered Egypt, and there remained to Dan
translation:
  language: de
  text: Und Asudi, Ijak und Salomo waren sechs. Sie starben in dem Jahr, als sie nach Ägypten einzogen; und Dan blieb [etwas] übrig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und Dan blieb übrig«. Wörtlicher lässt die knappe ge’ezische Fügung offen, was Dan verblieb; der Bezug kann über den Vers hinausreichen.'
    reason: Die Fußnote bewahrt die überlieferte alternative Analyse, ohne den nicht ausdrücklich genannten Bezug als „jemand“ festzulegen.
lexical_decisions:
- source_word: አሱዲ፡ ወኢያክ፡ ወስሎሞን
  choice: Asudi, Ijak und Salomo
  rationale: Die Eigennamen werden eng am ge’ezischen Wortlaut in einer für deutsche Leser verständlichen Umschrift wiedergegeben.
- source_word: ሲድስቱ
  choice: waren sechs
  rationale: Die Zahlform wird prädikativ wiedergegeben. Obwohl im erhaltenen Satz nur drei Namen stehen, wird die auffällige Quellenlesart nicht korrigiert.
- source_word: በዓመተ፡ ቦኡ፡ በግብጽ
  choice: in dem Jahr, in dem sie nach Ägypten kamen
  rationale: Gibt die Zeitangabe idiomatisch wieder; das ge’ezische Verb bezeichnet das Hineingehen bzw. Eintreten.
- source_word: ወተርፈ፡ ለዳን
  choice: und für Dan blieb jemand übrig
  rationale: Das intransitive Verb wird mit „blieb … übrig“ wiedergegeben und die mit ለ- markierte Zuordnung zu Dan als „für Dan“ bewahrt. „Jemand“ macht den im Deutschen erforderlichen, im vorliegenden Vers aber nicht ausdrücklich genannten Satzgegenstand kenntlich.
theological_decisions:
- issue: Wer am Ende des Verses übrig blieb
  choice: Für Dan blieb jemand übrig
  alternative: Dan blieb übrig
  rationale: Die ge’ezische Fügung ተርፈ ለዳን weist eher auf etwas oder jemanden hin, das bzw. der Dan verblieb, als darauf, dass Dan selbst das Subjekt ist. Die alternative Deutung wird wegen der knappen und möglicherweise versübergreifenden Syntax in einer Fußnote erhalten.
translation_notes:
  register: Modernes, schlichtes und würdiges Standarddeutsch. Die auffällige Zahlenangabe „waren sechs“ bleibt quellentreu stehen. Der Schluss wird lesbar formuliert, ohne die grammatische Spannung um Dan stillschweigend aufzulösen.
