  text: And his sons and the sons of his sons rose up, and they loaded their father and their possessions on wagons. And Israel set out from the Well of the Oath on the sixteenth of this third month, and he went to the land of Egypt.
translation:
  language: de
  text: Da brachen seine Söhne und seine Enkel auf und luden ihren Vater und ihren Besitz auf die Wagen. Am sechzehnten Tag dieses dritten Monats brach Israel vom Eidesbrunnen[a] auf und zog ins Land Ägypten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das ist Beerscheba; der Name bedeutet »Brunnen des Eides«.
    reason: Die Übersetzung des Ortsnamens wird im Haupttext bewahrt, während die geläufige biblische Namensform zur Identifikation angegeben wird.
lexical_decisions:
- source_word: ውሉደ፡ ውሉዱ
  choice: seine Enkel
  rationale: Wörtlich »die Söhne seiner Söhne«; »Enkel« gibt die Verwandtschaftsbezeichnung im heutigen Deutsch natürlich und genau wieder.
- source_word: አጽዐኑ
  choice: luden … auf
  rationale: Das Verb bezeichnet hier das Beladen beziehungsweise Befördern auf den zuvor genannten Wagen; die konkrete Formulierung bewahrt das Bild des Ausgangstextes.
- source_word: ዐዘቅተ፡ መሐላ
  choice: Eidesbrunnen
  rationale: Die äthiopische Wendung bedeutet wörtlich »Brunnen des Eides« und gibt den Ortsnamen Beerscheba in übersetzter Form wieder.
- source_word: ብሔረ፡ ግብጽ
  choice: ins Land Ägypten
  rationale: Entspricht der räumlichen Zielangabe des Ausgangstextes und klingt im Deutschen natürlich.
