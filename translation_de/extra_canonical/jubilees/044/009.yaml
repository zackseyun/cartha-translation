  yaml_path: translation/extra_canonical/jubilees/044/009.yaml
  text: 'And these are the names of the sons of Jacob who went into Egypt with Jacob their father: Reuben, the firstborn of Israel; and these are the names of his sons: Enoch, Pallu, Hezron, and Carmi—four.'
translation:
  language: de
  text: 'Und dies sind die Namen der Söhne Jakobs, die mit ihrem Vater Jakob nach Ägypten zogen: Ruben, der Erstgeborene Israels; und dies sind die Namen seiner Söhne: Henoch, Pallu, Hezron und Karmi – vier.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወዝ፡ አስማቲሆሙ
  choice: Und dies sind die Namen
  rationale: Gibt die einleitende Namensformel des geʿezischen Textes klar und formnah wieder.
- source_word: እለ፡ ሖሩ፡ ውስተ፡ ግብጽ
  choice: die … nach Ägypten zogen
  rationale: Das Bewegungsverb wird im Deutschen idiomatisch mit „ziehen“ wiedergegeben; „nach Ägypten“ entspricht dem Ziel der Bewegung.
- source_word: በኵሩ፡ ለእስራኤል
  choice: der Erstgeborene Israels
  rationale: Bewahrt die genealogische Bezeichnung und den Wechsel vom Namen Jakob zum Bundesnamen Israel.
- source_word: ፬
  choice: vier
  rationale: Die abschließende Zahl wird als zusammenfassende Zählangabe beibehalten.
theological_decisions:
- issue: Wechsel zwischen Jakob und Israel
  choice: Jakob in der Familienbezeichnung, Israel in Rubens Erstgeburtsbezeichnung
  alternative: Beide Vorkommen durchgehend mit „Jakob“ wiedergeben
  rationale: Der Quelltext verwendet bewusst beide Namen; die Übersetzung bewahrt diese Spannung, ohne sie zu harmonisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die genealogische Satzstruktur. Die Namensformen folgen den im Deutschen etablierten biblischen Schreibweisen.
