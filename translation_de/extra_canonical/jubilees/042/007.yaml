  source_fidelity: 'Der Entwurf gibt die Abfolge und die zentralen Elemente des ge''ezischen Textes zutreffend wieder: Wegschicken der Brüder, Füllen ihrer Säcke mit Getreide sowie die zusätzliche Zuwendung ihres Geldes. »Geld« mit der Fußnote zu »Gold« vermeidet zu Recht eine Harmonisierung zu »Silber«. Die Form ሎሙ wird jedoch mit »für sie« in der gewählten Konstruktion weniger präzise und idiomatisch erfasst als durch den deutschen Dativ.'
