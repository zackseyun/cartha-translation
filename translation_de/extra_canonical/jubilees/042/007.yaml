  text: He sent his brothers away, and he filled their sacks with grain, and he also put their money for them.
translation:
  language: de
  text: Er schickte seine Brüder fort, füllte ihre Säcke mit Getreide und gab ihnen auch ihr Geld[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: ihr Gold.'
    reason: Die Grundbedeutung von ወርቅ ist »Gold«; im Kontext kann das Wort ein Zahlungsmittel und damit »Geld« bezeichnen.
lexical_decisions:
- source_word: ወርቅ (in ወወርቆሙኒ)
  choice: Geld
  rationale: Das Wort bezeichnet wörtlich »Gold«, kann im Zusammenhang aber auch Geld meinen. »Geld« gibt hier die Funktion natürlich wieder, ohne den Text mit dem »Silber« aus Genesis 42,25 zu harmonisieren.
- source_word: ሎሙ
  choice: für sie
  rationale: Die Präpositionalform bedeutet ausdrücklich »für sie«; sie wird nicht als »in ihre Säcke« wiedergegeben.
- source_word: ፈነወ
  choice: schickte … fort
  rationale: Die Form bezeichnet das Wegschicken oder Entlassen und wird in natürlichem modernem Deutsch wiedergegeben.
- source_word: አሕስሊሆሙ
  choice: ihre Säcke
  rationale: Der Ausdruck bezeichnet ihre Behältnisse beziehungsweise Säcke; »Säcke« entspricht dem erzählerischen Zusammenhang.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die koordinierte Satzfolge des Ge'ez wurde zu einem flüssigen deutschen Satz verbunden; »dazu« macht das Ablegen beim Befüllen idiomatisch, während »für sie« als ausdrücklich bezeugte Form erhalten bleibt.
