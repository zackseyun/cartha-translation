  yaml_path: translation/extra_canonical/jubilees/042/004.yaml
  text: And the famine became very severe in the land of Canaan, and Jacob heard that there was grain in Egypt, and he sent ten of his sons to get grain for him from Egypt. But Benjamin he did not send. And the ten sons of Jacob arrived in Egypt with those who were traveling.
translation:
  language: de
  text: Und die Hungersnot im Land Kanaan wurde sehr schwer. Jakob hörte, dass es in Ägypten Getreide gab, und schickte zehn seiner Söhne dorthin, damit sie für ihn Getreide beschafften. Benjamin aber schickte er nicht. Und die zehn Söhne Jakobs kamen mit den Reisenden nach Ägypten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ረኃብ
  choice: Hungersnot
  rationale: Das Substantiv bezeichnet Hunger beziehungsweise eine Hungersnot; im Zusammenhang mit dem ganzen Land ist „Hungersnot“ die natürliche und sachlich genaue Wiedergabe.
- source_word: ሲሲት
  choice: Getreide
  rationale: Der Ausdruck bezeichnet hier den in Ägypten erhältlichen Nahrungsvorrat; im erzählerischen Kontext des Getreidekaufs ist „Getreide“ genauer als das allgemeinere „Nahrung“.
- source_word: ምስለ፡ ዘየሐውር
  choice: zusammen mit den anderen Reisenden
  rationale: Die Wendung bedeutet wörtlich „mit denen, die unterwegs waren/gingen“. Die gewählte Formulierung gibt den Sinn in natürlichem Deutsch wieder, ohne ein bestimmtes Verkehrsmittel oder Reiseziel hinzuzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Die hervorgehobene Gegenüberstellung Benjamins bleibt durch „Benjamin aber“ erhalten; „mit“ wurde ergänzt, weil das deutsche Verb „mitschicken“ die Aussage idiomatisch und im Kontext eindeutig wiedergibt.
