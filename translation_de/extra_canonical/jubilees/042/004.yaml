  source_fidelity: 'Die Übersetzung trifft den Grundsinn und die Abfolge des ge''ezischen Textes: schwere Hungersnot in Kanaan, Jakobs Nachricht über Getreide in Ägypten, die Entsendung von zehn Söhnen und deren Ankunft. „Getreide“ ist für ሲሲት sachgerecht. Zwei kleine Zusätze sind jedoch nicht ausdrücklich im Text verankert: „mit“ bei Benjamin legt nahe, er sei lediglich nicht zusammen mit den Brüdern gesandt worden, während der Text schlicht sagt, dass Jakob ihn nicht sandte; „anderen“ in „den anderen Reisenden“ ist ebenfalls nicht ausgedrückt.'
