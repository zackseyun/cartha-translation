  to: Und die Hungersnot im Land Kanaan wurde sehr schwer. Jakob hörte, dass es in Ägypten Getreide gab, und schickte zehn seiner Söhne dorthin, damit sie für ihn Getreide beschafften. Benjamin aber schickte er nicht. Und die zehn Söhne Jakobs kamen mit den Reisenden nach Ägypten.
