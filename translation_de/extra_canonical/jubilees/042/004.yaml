  terminology: „Hungersnot“, „Getreide“, „Jakob“, „Benjamin“, „Kanaan“ und „Ägypten“ sind terminologisch angemessen. Die Wiedergabe der letzten Wendung als „mit den Reisenden“ bewahrt deren offene Bezugnahme, ohne das nicht explizite „anderen“ hinzuzufügen.
