  to: In den sieben Jahren des Überflusses hatte er es aufbewahrt. Und die Ägypter[a] kamen zu Josef, damit er ihnen Nahrung gebe. Und er öffnete die Vorratshäuser, in denen sich das Getreide aus den früheren Jahren[b] befand, und verkaufte es den Völkern des Landes gegen Gold.
