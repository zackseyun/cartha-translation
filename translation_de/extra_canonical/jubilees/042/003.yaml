  terminology: „Überfluss“, „Nahrung“, „Vorratshäuser“, „Getreide“, „Völker des Landes“ und „gegen Gold“ sind registergerecht und sachlich passend. „Josef“ entspricht der üblichen modernen deutschen Schreibung. Die Fußnoten sind präzise und nicht konfessionell wertend.
