  text: in the seven years of abundance and had kept it. And the Egyptians came to Joseph so that he might give them food, and he opened the storehouses where the grain of the former years was, and sold it to the peoples of the land for gold.
translation:
  language: de
  text: In den sieben Jahren des Überflusses hatte er es aufbewahrt. Und die Ägypter[a] kamen zu Josef, damit er ihnen Nahrung gebe. Und er öffnete die Vorratshäuser, in denen sich das Getreide aus den früheren Jahren[b] befand, und verkaufte es den Völkern des Landes gegen Gold.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Ägypten«.'
    reason: ግብጽ lautet formal »Ägypten«, wird durch die pluralischen Satzformen jedoch wahrscheinlich kollektiv auf die Ägypter bezogen.
  - marker: b
    text: 'Wörtlich auch: »aus dem früheren Jahr« oder »aus dem ersten Jahr«.'
    reason: Die singularische geezische Form ዘቀዳሚ፡ ዓመት kann als »des früheren/vorherigen Jahres« oder »des ersten Jahres« verstanden werden; im Zusammenhang der mehrjährigen Einlagerung ist der Plural im Haupttext natürlicher.
lexical_decisions:
- source_word: ሠምር
  choice: Überfluss
  rationale: Bezeichnet hier im Zusammenhang mit den sieben ertragreichen Jahren die Fülle bzw. den Überfluss an Nahrung.
- source_word: ግብጽ
  choice: die Ägypter
  rationale: Das Substantiv bezeichnet wörtlich Ägypten, steht hier aber kollektiv für dessen Bevölkerung; das pluralische Verb und das pluralische Objektsuffix stützen die Wiedergabe »die Ägypter«.
- source_word: ሲሲተ
  choice: Nahrung
  rationale: Eine allgemein verständliche Wiedergabe für Speise bzw. Lebensmittel; der Kontext verlangt keine engere Festlegung auf Getreide.
- source_word: መዛግብተ
  choice: Vorratshäuser
  rationale: Im Kontext sind Gebäude oder Räume zur Aufbewahrung des während der Überflussjahre gesammelten Getreides gemeint.
- source_word: ስርናይ
  choice: Getreide
  rationale: Die sachlich passende moderne Sammelbezeichnung für das eingelagerte Korn.
- source_word: አሕዛበ፡ ምድር
  choice: Völker des Landes
  rationale: Bewahrt die kollektive und relativ formale Ausdrucksweise des Ausgangstextes, ohne sie zu »Bewohner« zu verengen.
- source_word: በወርቅ
  choice: gegen Gold
  rationale: ወርቅ bedeutet Gold; »gegen Gold« gibt das Zahlungsmittel beim Verkauf idiomatisch wieder.
