  register: Moderner, würdiger Standardstil. Der Vers setzt mit einem Satzfragment aus dem vorherigen Zusammenhang ein; diese Anschlussform wurde bewahrt. »Josef« folgt der heute üblichen deutschen Namensschreibung.
