lexical_decisions:
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Bezeichnet hier innerhalb der Jubiläenrechnung einen Zeitraum von sieben Jahren; „Jahrwoche“ gibt diese kalendarische Einheit knapp und verständlich wieder.
- source_word: ኢዮቤልው
  choice: Jubiläum
  rationale: Gibt den technischen chronologischen Begriff für einen Zeitraum von neunundvierzig Jahren wieder, ohne ihn mit dem modernen Festjubiläum zu umschreiben.
- source_word: ዐባር
  choice: Hungersnot
  rationale: Der Ausdruck bezeichnet eine Hungersnot beziehungsweise schwere Nahrungsknappheit; „Hungersnot“ passt zum erzählerischen Zusammenhang.
- source_word: ይምጻእ ውስተ
  choice: über … kam
  rationale: Bewahrt die Bewegungsmetapher des Kommens und klingt im Deutschen bei einer hereinbrechenden Notlage natürlich.
