  text: And the rain was withheld from the land, because there was no shower that came down. And the land became barren, but in the land of Egypt alone there was food, because Joseph had gathered seed for the land
translation:
  language: de
  text: Und der Regen blieb dem Land versagt[a], denn kein Regenguss ging nieder. So wurde das Land unfruchtbar; allein im Land Ägypten gab es Nahrung, denn Josef hatte Saatgut für das Land gesammelt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Der Regen weigerte sich, gegeben zu werden.«'
    reason: Die Fußnote bewahrt die auffällige Personifizierung und Passivkonstruktion des ge’ezischen Wortlauts, die im natürlichen deutschen Haupttext geglättet wird.
lexical_decisions:
- source_word: ወአበየ፡ ዝናም፡ ተውህቦ
  choice: Und der Regen blieb … versagt
  rationale: Die wörtliche Wendung »der Regen weigerte sich, gegeben zu werden« wird als natürliche deutsche Passivform wiedergegeben; das vorangestellte ወ bleibt durch »Und« erhalten.
- source_word: ምትነ
  choice: Regenguss
  rationale: Bezeichnet hier den ausbleibenden Niederschlag beziehungsweise Schauer und vermeidet eine unnötige Wiederholung von »Regen«.
- source_word: ዐብረተ፡ ምድር
  choice: das Land wurde unfruchtbar
  rationale: Gibt die durch den ausbleibenden Regen verursachte Verödung des Landes in verständlichem, sachlichem Deutsch wieder.
- source_word: ሲሲተ
  choice: Nahrung
  rationale: Der Ausdruck bezeichnet Versorgung oder Lebensmittel; »Nahrung« passt zum Gegensatz zwischen dem verödeten Land und Ägyptens Vorräten.
- source_word: ዘርአ
  choice: Saatgut
  rationale: Bewahrt den konkreten Bezug zu Samen beziehungsweise Getreide zur Versorgung des Landes.
