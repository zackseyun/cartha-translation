  text: And Joseph recognized them, but they did not recognize him. And he spoke harshly with them and said to them, “Are you not spies, and have you come to observe the exposed parts of the land?”
translation:
  language: de
  text: 'Josef erkannte sie, sie aber erkannten ihn nicht. Er redete sie hart an und sagte zu ihnen: »Seid ihr nicht Spione? Ihr seid gekommen, um die ungeschützten Stellen des Landes auszukundschaften.«'
