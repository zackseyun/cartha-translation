  text: 'they should bring Benjamin. And Jacob said, “You have bereaved me: Joseph is no more, and Simeon also is no more...”'
translation:
  language: de
  text: 'sie sollten Benjamin mitbringen. Da sagte Jakob: »Ihr habt mich meiner Kinder beraubt! Josef ist nicht mehr da, und auch Simeon ist nicht mehr da …«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያመጽእዎ፡ ለብንያም
  choice: sie sollten Benjamin mitbringen
  rationale: Die Konstruktion bezeichnet das Herbeibringen Benjamins; „mitbringen“ ist im gegebenen Erzählzusammenhang natürliches modernes Deutsch.
- source_word: እምከንከሙኒከ
  choice: Ihr habt mich meiner Kinder beraubt
  rationale: Die Form spricht die Söhne im Plural an und bezeichnet Jakobs Erfahrung, seiner Kinder beraubt worden zu sein; die Ergänzung „meiner Kinder“ macht den im Verb enthaltenen Sinn auf Deutsch verständlich.
- source_word: ኢሀሎ
  choice: ist nicht mehr da
  rationale: Wörtlich liegt „ist nicht“ vor; im Kontext des Verlusts gibt „ist nicht mehr da“ die idiomatische Bedeutung wieder, ohne ausdrücklich festzulegen, ob Josef tot oder lediglich abwesend ist.
- source_word: ወስምዖንሂ
  choice: und auch Simeon
  rationale: Die Partikel wird mit „auch“ wiedergegeben und verbindet Simeons Verlust mit dem zuvor genannten Josef.
theological_decisions: []
