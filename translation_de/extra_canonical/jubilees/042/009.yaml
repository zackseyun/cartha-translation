  yaml_path: translation/extra_canonical/jubilees/042/009.yaml
  text: And they went up from the land of Egypt and came to the land of Canaan, and they told their father everything that had happened to them, and how the ruler of the land had spoken harshly with them and had seized Simeon until...
translation:
  language: de
  text: Da zogen sie aus dem Land Ägypten hinauf und kamen ins Land Kanaan. Sie erzählten ihrem Vater alles, was ihnen widerfahren war, und wie der Herrscher des Landes hart mit ihnen geredet und Simeon festgehalten hatte, bis …[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der mit „bis“ beginnende Satz wird im folgenden Vers fortgesetzt.
    reason: Die ge’ezische Verbindung እስከ፡ ሶበ፡ leitet einen noch nicht abgeschlossenen Temporalsatz ein; die Auslassungspunkte bewahren den Versübergang, statt ihn künstlich zu schließen.
lexical_decisions:
- source_word: ዐርጉ
  choice: zogen … hinauf
  rationale: Gibt die räumliche Aufwärtsbewegung von Ägypten nach Kanaan idiomatisch und quellennah wieder.
- source_word: ኵሎ፡ ዘከመ፡ ረከቦሙ
  choice: alles, was ihnen widerfahren war
  rationale: Natürliches modernes Deutsch für alles, was ihnen begegnet beziehungsweise zugestoßen war.
- source_word: ወአፎ
  choice: und wie
  rationale: Das ge’ezische Frage-/Modalwort bezeichnet hier die Art und Weise; „wie“ führt den Inhalt ihres Berichts passend weiter.
- source_word: መኰንነ፡ ብሔር
  choice: der Herrscher des Landes
  rationale: Bewahrt den allgemeinen Amtstitel und vermeidet eine unbelegte Präzisierung.
- source_word: ዐጹባጺበ
  choice: hart
  rationale: Gibt die feindselige beziehungsweise schroffe Art seines Redens in natürlichem Deutsch wieder.
- source_word: አሐዘ፡ ለስምዖን
  choice: Simeon festgehalten hatte
  rationale: „Festhalten“ erfasst die Ingewahrsamnahme, ohne über den Quellenausdruck hinaus eine bestimmte Haftform festzulegen.
