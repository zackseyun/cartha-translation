translation:
  language: de
  text: deine Schafe. Und ihr werdet ein Segen auf der Erde sein, und alle Völker der Erde werden euch lieben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: werden nach euch verlangen.'
    reason: Das ge’ezische Verb kann sowohl „lieben“ als auch „begehren/nach jemandem verlangen“ bedeuten.
lexical_decisions:
- source_word: አባግዒከ
  choice: deine Schafherden
  rationale: አባግዕ bezeichnet Schafe beziehungsweise eine Schafherde; das Suffix ist in der Einzahl an eine angesprochene Person gerichtet. Da der Vers mitten im Satz einsetzt, bleibt der fragmentarische Anschluss erhalten.
- source_word: በበረከት
  choice: ein Segen
  rationale: Die idiomatische deutsche Wiedergabe bewahrt die Aussage, dass die Angesprochenen selbst zum Segen auf der Erde werden.
- source_word: ይፈትዉክሙ
  choice: werden euch lieben
  rationale: Das Verb kann Liebe, Wohlgefallen oder Verlangen ausdrücken; „lieben“ ist hier natürlich und entspricht der Grundbedeutung, während das Objektsuffix eindeutig pluralisch ist.
theological_decisions:
- issue: Numeruswechsel in der Anrede
  choice: „deine“ in der Einzahl, danach „ihr/euch“ in der Mehrzahl
  alternative: Den Numerus im Deutschen durchgehend vereinheitlichen
  rationale: Der ge’ezische Text wechselt vom singularischen Possessivsuffix bei „Schafherden“ zu pluralischen Formen bei „ihr werdet“ und „euch“. Dieser Wechsel wird nicht stillschweigend harmonisiert.
- issue: Bedeutung von ይፈትዉክሙ
  choice: „werden euch lieben“
  alternative: „werden nach euch verlangen“
  rationale: Beide Nuancen sind lexikalisch möglich. Im Zusammenhang mit dem Segensmotiv ist „lieben“ die natürlichere Lesart, ohne die alternative Nuance auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzanfang bleibt als Anschlussfragment erhalten; der auffällige Wechsel zwischen singularischer und pluralischer Anrede wird quellennah wiedergegeben.
