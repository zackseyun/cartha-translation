translation:
  language: de
  text: der Wüste. Und diese vermischten sich mit jenen, und ihre Bezeichnung wurde zu »Araber und Ismaeliten« zusammengefügt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach einer früher vorgeschlagenen Textverbesserung: »und ihr Name wurde ›Araber‹ genannt«.'
    reason: Die überlieferte Ge’ez-Lesart hat „wurde zusammengefügt/verbunden“; die alternative Lesart beruht auf einer früheren Emendation.
lexical_decisions:
- source_word: ተደመሩ
  choice: vermischten sich
  rationale: Das reflexiv-passive Ge’ez-Verb bezeichnet hier das Zusammenkommen bzw. die Vermischung der beiden zuvor genannten Gruppen.
- source_word: ተጸምደ
  choice: wurden … verbunden
  rationale: Die Handschriftenlesart bedeutet »verbunden/zusammengefügt werden« und wird gegenüber der früheren Verbesserung zu »genannt werden« beibehalten.
- source_word: ስሞሙ
  choice: ihre Bezeichnungen
  rationale: Wörtlich »ihr Name«; der deutsche Plural passt natürlich zu den beiden verbundenen Gruppenbezeichnungen, ohne den Sinn der Quelle zu verändern.
- source_word: ዓረበ ወእስማዔላዊያን
  choice: »Araber und Ismaeliten«
  rationale: Die beiden Volksbezeichnungen werden direkt und in moderner deutscher Form wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Versanfang bleibt als Satzfragment erhalten, weil »der Wüste« syntaktisch zum vorhergehenden Vers gehört. Die ungewöhnliche Aussage über die Verbindung der Bezeichnungen wird nicht geglättet, da sie die überlieferte Lesart widerspiegelt.
