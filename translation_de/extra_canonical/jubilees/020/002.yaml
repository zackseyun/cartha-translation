revisions:
- from: Und dass sie ihre Söhne gemäß dem Bund, den er mit ihnen geschlossen hatte, beschneiden sollten[a]; dass sie weder nach rechts noch nach links von irgendeinem Weg abweichen sollten, den der HERR geboten hatte; dass wir uns vor jeder Unzucht und Unreinheit hüten und jede Unzucht und Unreinheit aus unserer Mitte entfernen sollten. Wenn eine Frau unter euch Unzucht treibt, oder auch eine Tochter, dann verbrennt sie im Feuer[b]. Sie sollen nicht ihren Augen und ihrem Herzen folgend Unzucht treiben. Auch sollen sie sich keine Frauen von den Töchtern Kanaans nehmen, denn die Nachkommenschaft Kanaans wird aus dem Land ausgerottet werden. Und er berichtete ihnen vom Gericht über die Wächter[c].
  to: Und dass sie ihre Söhne gemäß dem Bund, der mit ihnen geschlossen worden war, beschneiden sollten[a]; dass sie weder nach rechts noch nach links von dem Weg abweichen sollten, den der HERR geboten hatte; dass wir uns vor jeder Unzucht und Unreinheit hüten und jede Unzucht und Unreinheit aus unserer Mitte entfernen sollten. Wenn eine Frau unter euch Unzucht treibt, oder auch eine Tochter, dann verbrennt sie im Feuer[b]. Sie sollen nicht ihren Augen und ihrem Herzen folgend Unzucht treiben. Auch sollen sie sich keine Frauen von den Töchtern Kanaans nehmen, denn die Nachkommenschaft Kanaans wird aus dem Land entwurzelt werden. Und er berichtete ihnen vom Gericht über die Wächter[c].
  rationale: 'Die Revision beseitigt zwei vermeidbare Zusätze bzw. Abschwächungen gegenüber dem ge’ezischen Wortlaut: Der Bund bleibt passiv formuliert, und die Nachkommenschaft Kanaans wird entsprechend dem Bild des Verbs „entwurzelt“. Außerdem wurde die negierte Wegformulierung idiomatischer gestaltet. Die Fußnotenanker sind eindeutig und korrekt gesetzt.'
