  yaml_path: translation/extra_canonical/jubilees/020/002.yaml
  text: And that they should circumcise their sons according to the covenant that was established with them[a], and that they should not turn aside from this, neither to the right nor to the left, from any path that the LORD commanded; and that we should keep ourselves from all fornication and uncleanness, and that we should put away from among us every act of fornication and uncleanness. And if a woman among you commits harlotry, or even a daughter, burn her with fire, and let them not commit fornication after their eyes and after their heart, and let them not take wives for themselves from the daughters of Canaan, for the seed of Canaan will be uprooted from the land. And he told them of the judgment of the Watchers[a],
translation:
  language: de
  text: Und dass sie ihre Söhne gemäß dem Bund, der mit ihnen geschlossen worden war, beschneiden sollten[a]; dass sie weder nach rechts noch nach links von dem Weg abweichen sollten, den der HERR geboten hatte; dass wir uns vor jeder Unzucht und Unreinheit hüten und jede Unzucht und Unreinheit aus unserer Mitte entfernen sollten. Wenn eine Frau unter euch Unzucht treibt, oder auch eine Tochter, dann verbrennt sie im Feuer[b]. Sie sollen nicht ihren Augen und ihrem Herzen folgend Unzucht treiben. Auch sollen sie sich keine Frauen von den Töchtern Kanaans nehmen, denn die Nachkommenschaft Kanaans wird aus dem Land entwurzelt werden. Und er berichtete ihnen vom Gericht über die Wächter[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „ihre Söhne gemäß dem Bund … beschneiden“ ist aus dem Zusammenhang des abrahamitischen Bundes erschlossen; der Wortlaut dieses Textzeugen ist an dieser Stelle stark gedrängt.
    reason: lexical_alternative
  - marker: b
    text: 'Der Befehl ist ausdrücklich und rechtlich formuliert: Der äthiopische Text spricht vom Verbrennen im Feuer.'
    reason: cultural_note
  - marker: c
    text: Die „Wächter“ sind die rebellischen himmlischen Wesen, deren Bestrafung aus der henochischen Überlieferung bekannt ist.
    reason: cross_reference
lexical_decisions:
- source_word: ይክስቡ፡ ውሉዶሙ፡ በኪዳን
  choice: ihre Söhne gemäß dem Bund … beschneiden
  rationale: Die Formulierung des überlieferten Wortlauts ist gedrängt. Im Zusammenhang des abrahamitischen Bundes bezeichnet sie die Aufnahme der Söhne in den Bund durch die Beschneidung; die Fußnote macht diese kontextuelle Ergänzung transparent.
- source_word: ዝሙት / ዘመወት / ይዘምዋ
  choice: Unzucht / Unzucht treiben
  rationale: Die wiederholte Wiedergabe mit demselben deutschen Wortfeld bewahrt die bewusste Wiederholung derselben äthiopischen Wurzel und ihre eindeutig sexuelle Bedeutung.
- source_word: ይሤረዉ፡ ዘርአ፡ ከናአን
  choice: die Nachkommenschaft Kanaans wird … ausgerottet werden
  rationale: Das Verb bezeichnet ein Herausreißen oder Entwurzeln. „Ausgerottet“ bewahrt im Deutschen sowohl die Vernichtungsbedeutung als auch das zur „Nachkommenschaft“ passende Wurzelbild.
- source_word: ረዓይት
  choice: Wächter
  rationale: Der Ausdruck bezeichnet in der henochischen Überlieferung die rebellischen himmlischen Wesen, die gewöhnlich „Wächter“ genannt werden.
theological_decisions:
- issue: Bundesformel und Beschneidung
  choice: „beschneiden“ im Haupttext, mit Hinweis auf die gedrängte Überlieferung
  alternative: „in den Bund aufnehmen“ ohne ausdrückliche Nennung der Beschneidung
  rationale: Der abrahamitische Kontext stützt die Beschneidung deutlich, doch die Fußnote verhindert, dass die textliche Kompression verschwiegen wird.
- issue: Gericht über die Wächter
  choice: „Wächter“ als traditionsgeschichtlich bestimmter Ausdruck
  alternative: „Beobachter“ oder eine allgemeine Bezeichnung für Engel
  rationale: „Wächter“ wahrt den festen Begriff der henochischen Tradition, ohne zusätzliche Lehraussagen über Wesen oder Fall dieser Gestalten einzutragen.
- issue: Todesstrafe durch Feuer
  choice: den ausdrücklichen und harten Rechtsbefehl unverändert wiedergeben
  alternative: die Aussage abmildern oder metaphorisch deuten
  rationale: Der äthiopische Wortlaut nennt das Verbrennen im Feuer ausdrücklich; ethische oder harmonisierende Abschwächungen wären nicht quellengerecht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Die Wechsel zwischen „sie“ und „wir“ wurden entsprechend dem äthiopischen Text bewahrt. „HERR“ gibt den Gottesnamen in der üblichen deutschen Bibelkonvention wieder; die drastische Rechtssprache wurde weder archaisiert noch abgeschwächt.
