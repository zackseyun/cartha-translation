  yaml_path: translation/extra_canonical/jubilees/020/005.yaml
  text: evening[a], and bow down to him, and continually seek his face at all times, and do uprightness and righteousness before him, so that he may direct you and give you mercy, and send down for you the rain of morning and evening, and bless all the work that you do on the earth, and bless your grain
translation:
  language: de
  text: den Höchsten. Werft euch vor ihm nieder, sucht allezeit, zu jeder Zeit sein Angesicht und tut vor ihm, was recht und gerecht ist, damit er euch recht leite und euch Barmherzigkeit schenke, für euch Regen am Morgen und am Abend[a] herabsende, all eure Arbeit segne, die ihr auf der Erde verrichtet, und euer Getreide segne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Regen am Morgen und am Abend« kann die vertraute landwirtschaftliche Segensformel für Regen zur rechten Zeit widerspiegeln, vergleichbar mit »Frühregen und Spätregen«.
    reason: lexical_alternative
lexical_decisions:
- source_word: ልዑለ
  choice: den Höchsten
  rationale: Die Form bezeichnet den »Höchsten« und steht hier offenbar als Abschluss eines über die Versgrenze reichenden Satzes; deshalb bleibt der fragmentarische Anschluss an den vorherigen Kontext sichtbar.
- source_word: ወትስፈዉ፡ ገጸ፡ ዚአሁ
  choice: sucht … sein Angesicht
  rationale: Bewahrt die konkrete, biblisch geprägte Wendung des Ge’ez, ohne sie zu »sucht seine Nähe« zu verallgemeinern.
- source_word: ያርትዕ፡ ርእስክሙ
  choice: euch recht leite
  rationale: ርእስክሙ bedeutet wörtlich »eure Häupter«, dient hier jedoch reflexiv im Sinn von »euch selbst«; das Verb bezeichnet ein Gerademachen beziehungsweise rechtes Ausrichten. »Euch recht leite« gibt beides knapp wieder und vermeidet die unbelegte Ergänzung »euren Weg/Pfad«.
- source_word: ዝናመ፡ ነግሀ፡ ወሰርከ
  choice: Regen am Morgen und am Abend
  rationale: Gibt die zeitlichen Ausdrücke formal wieder; eine mögliche sachliche Entsprechung zu Früh- und Spätregen wird in der Fußnote genannt.
- source_word: እክልከ
  choice: euer Getreide
  rationale: Der landwirtschaftliche Kontext und das Substantiv sprechen für »Getreide« beziehungsweise »Korn«; »Getreide« ist im modernen Deutsch natürlicher.
theological_decisions:
- issue: Bezeichnung Gottes als »der Höchste«
  choice: den Höchsten
  alternative: den Allerhöchsten
  rationale: »Der Höchste« entspricht dem Ge’ez unmittelbar und wahrt die Gottesbezeichnung, ohne sie konfessionell auszubauen.
- issue: Bedingung und göttliches Handeln
  choice: damit er euch recht leite und euch Barmherzigkeit schenke. Dann wird er …
  alternative: sodass er euch recht leitet … und … herabsendet
  rationale: Die Zweckkonstruktion wird beim Leiten und Erbarmen erhalten; der anschließende deutsche Satz macht die Reihe der göttlichen Segnungen lesbar, ohne ihren Zusammenhang mit dem vorausgehenden rechten Handeln aufzuheben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit biblisch vertrauten Wendungen wie »sein Angesicht suchen« und »sich vor ihm niederwerfen«. Der auffällige fragmentarische Beginn »den Höchsten« wird beibehalten, weil die vorgelegte Ge’ez-Versgrenze offenbar mitten in einem Satz liegt.
