  naturalness: Die Sprache ist überwiegend modernes, würdiges Standarddeutsch. »Allezeit und zu jeder Zeit« ist allerdings stilistisch schwerfällig und nahezu redundant; »allezeit, zu jeder Zeit« bewahrt die gegebene Nachdrücklichkeit flüssiger. Eine durchgehende Satzkonstruktion mit Konjunktiv ist hier natürlicher und genauer als der Wechsel zu »Dann wird er«.
  terminology: »der Höchste«, »Angesicht«, »Barmherzigkeit« und »Getreide« sind angemessen. Die Fußnote ist sachlich zurückhaltend, und ihr Anker steht korrekt bei »Regen am Morgen und am Abend«.
