base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/020/003.yaml
  text: 'and the judgment of Sodom, how they were judged because of their wickedness, and because of fornication and uncleanness and corruption among themselves: by fornication they died. And you also, guard yourselves from all fornication and uncleanness and from every defilement of sin, so that you may not make your name a curse, and all your life a reproach, and all your sons to destruction by the sword, and you become accursed like Sodom, and all your remnant like the sons of Gomorrah. I testify to you, my children: love him'
translation:
  language: de
  text: 'und das Gericht über Sodom: wie sie wegen ihrer Bosheit gerichtet wurden, wegen Unzucht, Unreinheit und Verderbtheit untereinander. Durch Unzucht kamen sie um. Hütet auch ihr euch vor aller Unzucht und Unreinheit und vor jeder Befleckung durch Sünde, damit ihr euren Namen nicht dem Fluch preisgebt, euer ganzes Leben der Schmach und alle eure Söhne dem Verderben durch das Schwert[b] und damit ihr nicht verflucht werdet wie Sodom und alle, die von euch übrig bleiben, wie die Söhne Gomorras. Ich bezeuge euch, meine Kinder: Liebt ihn.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht am Versende „Liebt ihn“; das Pronomen weist auf den im folgenden Vers genannten Gott des Himmels voraus.
    reason: Der isolierte Vers lässt den Bezug des maskulinen Singularpronomens offen.
  - marker: b
    text: 'Oder nach dem Sinn: „damit nicht alle eure Söhne durch das Schwert umkommen“.'
    reason: 'Die Quelle hat wörtlich eine nominale Parallelkonstruktion: den Namen dem Fluch, das Leben der Schmach und die Söhne dem Verderben preisgeben.'
lexical_decisions:
- source_word: ኵነኔሆሙ፡ ለሰዶም
  choice: das Gericht über Sodom
  rationale: Gibt die gerichtliche Bedeutung des Nomens wieder; der anschließende Pluralbezug wird mit „seine Bewohner“ im Deutschen verständlich gemacht.
- source_word: ዝሙት
  choice: Unzucht
  rationale: Bewahrt den breiten, sittlich-sexuellen Sinn des ge'ezischen Ausdrucks in würdigem biblischem Register.
- source_word: ርኵስ
  choice: Unreinheit
  rationale: Entspricht dem Begriff für kultische beziehungsweise sittliche Unreinheit, ohne ihn enger festzulegen.
- source_word: ሙስና
  choice: Verderbtheit / Verderben
  rationale: Der wiederholte Stamm bezeichnet zunächst moralische Verderbtheit und später das Verderben, dem die Söhne preisgegeben werden.
- source_word: ፃማነ፡ ኀጢአት
  choice: Befleckung durch Sünde
  rationale: Gibt die Genitivverbindung natürlich wieder und erhält das Bild sittlicher Verunreinigung.
- source_word: ኢትሀቡ
  choice: nicht … preisgebt
  rationale: Das Verb „geben“ regiert parallel Name, Leben und Söhne; „preisgeben“ bildet diese Konstruktion im Deutschen idiomatisch ab.
- source_word: አሰምዕ፡ ለክሙ
  choice: Ich bezeuge euch
  rationale: Wiedergabe als erste Person Singular und nicht als Imperativ „Hört auf mich“.
- source_word: አፍቅርዎ
  choice: Liebt ihn
  rationale: Der maskuline Objektsuffix der dritten Person Singular wird ausdrücklich wiedergegeben und verweist voraus.
theological_decisions:
- issue: Ursache des Gerichts über Sodom
  choice: Die Reihung von Bosheit, Unzucht, Unreinheit und Verderbtheit bleibt bestehen.
  alternative: Die Aussage ausschließlich auf eine einzelne sexuelle Sünde zu verengen.
  rationale: Der Quelltext nennt mehrere miteinander verbundene Gründe; keine konfessionelle oder moderne dogmatische Eingrenzung wird hinzugefügt.
- issue: Bezug von „ihn“ am Versende
  choice: Das Pronomen bleibt ohne Ergänzung stehen.
  alternative: „Gott“ oder „den Gott des Himmels“ bereits in diesem Vers einzusetzen.
  rationale: Der Bezug wird erst im folgenden Vers entfaltet; die vorausweisende Spannung des Quelltexts soll erhalten bleiben.
- issue: Parallele Konstruktion mit „preisgeben“
  choice: Name, Leben und Söhne bleiben drei parallele Objekte desselben Verbs.
  alternative: „Alle eure Söhne werden durch das Schwert umkommen.“
  rationale: Die nominale Syntax der Quelle wird bewahrt, ohne aus dem dritten Glied einen eigenständigen Aussagesatz zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Klang. „Unzucht“ und „Schande“ sind bewusst gehoben, aber allgemein verständlich. Die lange Warnung wurde syntaktisch gegliedert, während die parallele Struktur der Quelle erhalten blieb.
