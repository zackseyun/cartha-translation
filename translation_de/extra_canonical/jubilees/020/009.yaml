revisions:
- from: für seinen Sohn Isaak. Ismael und seine Söhne, die Söhne Keturas und deren Kinder zogen gemeinsam fort und ließen sich vom Gebiet Paran bis zum Zugang nach Babylon nieder, im ganzen Land, das nach Osten hin liegt.
  to: für seinen Sohn Isaak. Und Ismael und seine Söhne, die Söhne Keturas und deren Kinder zogen gemeinsam von Paran bis zum Zugang nach Babylon und ließen sich im ganzen Land nieder, das nach Osten hin ausgerichtet ist.
  rationale: Die Revision entfernt die nicht erforderlichen Zusätze »fort« und »Gebiet«, gliedert die Bewegung von der Ansiedlung klarer und gibt die östliche Ausrichtung des Landes näher am Ausgangstext wieder. Die knappe einleitende Satzergänzung bleibt als Anschluss an den vorangehenden Vers erhalten.
