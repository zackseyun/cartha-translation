  yaml_path: translation/extra_canonical/jubilees/020/009.yaml
  text: to Isaac his son. And Ishmael and his sons and the sons of Keturah and their children went together and settled from Paran as far as the entrance to Babylon, in all the land that faces eastward.
translation:
  language: de
  text: für seinen Sohn Isaak. Und Ismael und seine Söhne, die Söhne Keturas und deren Kinder zogen gemeinsam von Paran bis zum Zugang nach Babylon und ließen sich im ganzen Land nieder, das nach Osten hin ausgerichtet ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅቡረ
  choice: gemeinsam
  rationale: Gibt das adverbiale »zusammen, vereint« natürlich wieder und bezieht sich auf die gemeinsam genannten Gruppen.
- source_word: ኀደሩ
  choice: ließen sich … nieder
  rationale: Im Zusammenhang mit dem anschließenden Siedlungsgebiet bezeichnet das Verb ein Bleiben bzw. Ansiedeln, nicht nur ein kurzfristiges Übernachten.
- source_word: እምፋርሞን
  choice: vom Gebiet Paran
  rationale: Der Ortsname wird als Paran wiedergegeben; »Gebiet« verdeutlicht den räumlichen Ausgangspunkt, ohne eine punktgenaue Stadt vorauszusetzen.
- source_word: ምብዋአ፡ ባቢሎን
  choice: Zugang nach Babylon
  rationale: Bewahrt die konkrete Vorstellung des Eingangs bzw. Zugangs zu Babylon und klingt im Deutschen natürlicher als »Eingang Babylons«.
- source_word: ምድር፡ እንተ፡ ገጸ፡ ጽባሕ፡ አንጻረ
  choice: Land, das nach Osten hin liegt
  rationale: Die wörtliche Gesichts-/Ausrichtungsformel wird als räumliche Lage nach Osten wiedergegeben; die im Ge'ez etwas sperrige Konstruktion wird nicht mit einem unbelegten Ziel ergänzt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers beginnt als syntaktischer Anschluss an den vorhergehenden Vers; deshalb bleibt »für seinen Sohn Isaak« als Fragment erhalten. Die genealogischen Gruppen und die räumliche Spannweite werden klar und ohne konfessionelle Auslegung wiedergegeben.
