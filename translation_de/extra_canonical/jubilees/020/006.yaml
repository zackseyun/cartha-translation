lexical_decisions:
- source_word: ወማኅፀነ
  choice: und den Mutterleib
  rationale: Das Substantiv gehört syntaktisch zum vorausgehenden, hier nicht mitgelieferten Satzteil und darf nicht zum Objekt von »segnen« gemacht werden. Der fragmentarische Versanfang bleibt daher erhalten.
- source_word: ወይባርክ
  choice: Und er segne
  rationale: Der jussive beziehungsweise optative Sinn wird als Segenswunsch wiedergegeben.
- source_word: ዘርአ፡ ከርሥከ
  choice: die Nachkommen deines Leibes
  rationale: ዘር bezeichnet Samen beziehungsweise Nachkommenschaft; im Deutschen ist »Nachkommen deines Leibes« natürlich und wahrt den Bezug auf menschliche Nachkommenschaft.
- source_word: ዘርአ፡ ምድርከ
  choice: den Ertrag deines Landes
  rationale: Wörtlich steht »Samen deines Landes«; »Ertrag« vermittelt im landwirtschaftlichen Zusammenhang idiomatisch die Fruchtbarkeit des Bodens.
- source_word: መራዕየ፡ አልህምቲከ
  choice: die Herden deines Viehs
  rationale: መራዕየ bezeichnet geweidete Tierverbände, also Herden oder Scharen, nicht deren Nachwuchs.
- source_word: ወመራዕየ
  choice: und die Scharen von
  rationale: Das wiederholte መራዕየ wird variiert als »Scharen« wiedergegeben; da die Vorlage hier abbricht, bleibt auch die deutsche Wendung unvollständig.
theological_decisions:
- issue: Bezugswort von »segnen« am Versanfang
  choice: »Mutterleib« als Rest des vorausgehenden Satzes behandeln; »die Nachkommen deines Leibes« als erstes Objekt von »segnen«
  alternative: »und er segne deinen Mutterleib, die Nachkommen deines Leibes«
  rationale: Die geezische Wortfolge trennt ወማኅፀነ von dem folgenden Verb und weist danach ዘርአ፡ ከርሥከ als dessen Objekt aus. Eine Umstellung würde die Syntax glätten, aber den Sinn verändern.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Anfang und das Ende bleiben bewusst fragmentarisch, weil der bereitgestellte Quellenausschnitt an beiden Stellen über die Versgrenze hinausweist. »Mutterleib« ist gegenüber dem bloßen »Leib« präziser; »Ertrag« vermeidet das im Deutschen missverständliche »Samen des Landes«.
