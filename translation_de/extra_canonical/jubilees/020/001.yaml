base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/020/001.yaml
  text: And in the forty-second jubilee[a], in the first year of the seventh week, Abraham called Ishmael and his twelve sons, and Isaac and his two sons, and the six sons of Keturah and their children. And he commanded them to keep the way of the LORD, to do righteousness, and that each should love his brother, and that he should thus be among all people, walking together to practice justice and righteousness on the earth.
translation:
  language: de
  text: Und im zweiundvierzigsten Jubiläum, im ersten Jahr der siebten Jahrwoche, rief Abraham Ismael und seine zwölf Söhne, Isaak und seine beiden Söhne sowie die sechs Söhne Keturas und deren Kinder zusammen. Er gebot ihnen, dass sie den Weg des HERRN bewahren, Gerechtigkeit üben, dass jeder seinen Bruder liebe und sich gegenüber allen Menschen ebenso verhalte und dass sie miteinander wandeln, um auf der Erde Recht und Gerechtigkeit zu üben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Schlusssatz ist im Ge’ez syntaktisch dicht. Wörtlicher lässt sich der Wechsel zwischen Einzahl und Mehrzahl etwa so wiedergeben: „dass jeder ebenso unter allen Menschen sei und dass sie miteinander wandeln, um auf der Erde Recht und Gerechtigkeit zu üben“.'
    reason: segmentation_note
lexical_decisions:
- source_word: ኢዮቤልዉ
  choice: Jubiläum
  rationale: Bezeichnet den chronologischen Jubiläumszyklus des Buches; die etablierte deutsche Wiedergabe bewahrt diesen Fachbegriff.
- source_word: ፍኖተ፡ እግዚአብሔር
  choice: den Weg des HERRN
  rationale: Gibt die konkrete Weg-Metapher des Ge'ez wieder und verwendet für den Gottesnamen die geläufige deutsche Bibelkonvention.
- source_word: ቢጾ
  choice: Bruder
  rationale: Das Wort kann einen Gefährten oder Nächsten bezeichnen; im familiären Adressatenkreis ist „Bruder“ sachgerecht und entspricht der ethischen Verwandtschaftssprache.
- source_word: ይሖሩ
  choice: sie ... wandeln
  rationale: Bewahrt die im Ausgangstext ausdrücklich vorhandene Weg- und Lebensführungsmetapher, statt sie lediglich mit „sich verhalten“ wiederzugeben.
- source_word: ፍትሕ፡ ወጽድቅ
  choice: Recht und Gerechtigkeit
  rationale: Hält die beiden koordinierten ethischen Begriffe auseinander und wahrt ihre traditionelle biblische Wortprägung.
theological_decisions:
- issue: Singular und Plural in der ethischen Weisung
  choice: „jeder ... lebe“ und anschließend „sie ... wandeln“
  alternative: Die gesamte Aussage einheitlich im Plural wiedergeben
  rationale: Der Ge'ez-Text verwendet zunächst ein Verb im Singular mit Bezug auf „jeder“, wechselt danach aber zum Plural. Dieser Wechsel wird nicht harmonisiert.
- issue: Bedeutung der Schlussklausel
  choice: Gemeinsames Wandeln mit dem Ziel, Recht und Gerechtigkeit auf der Erde zu üben
  alternative: Jeder solle dem anderen entgegengehen, um Recht und Gerechtigkeit zu üben
  rationale: Die Syntax ist dicht; „miteinander“ gibt den wahrscheinlichsten gemeinschaftlichen Sinn natürlich wieder, ohne die Weg-Metapher auszulassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrten biblischen Leitbegriffen wie „Weg des HERRN“, „wandeln“ sowie „Recht und Gerechtigkeit“. Die lange Satzstruktur des Ausgangstextes bleibt erkennbar, wird aber durch deutsche Koordination lesbar gegliedert.
