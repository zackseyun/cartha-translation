revisions:
- from: Und im zweiundvierzigsten Jubiläum, im ersten Jahr der siebten Jahrwoche, rief Abraham Ismael und seine zwölf Söhne, Isaak und seine beiden Söhne sowie die sechs Söhne Keturas und deren Kinder zusammen. Er gebot ihnen, den Weg des HERRN zu bewahren, Gerechtigkeit zu üben, dass jeder seinen Bruder liebe und ebenso unter allen Menschen lebe und dass sie miteinander wandeln, um auf der Erde Recht und Gerechtigkeit zu üben.[a]
  to: Und im zweiundvierzigsten Jubiläum, im ersten Jahr der siebten Jahrwoche, rief Abraham Ismael und seine zwölf Söhne, Isaak und seine beiden Söhne sowie die sechs Söhne Keturas und deren Kinder zusammen. Er gebot ihnen, dass sie den Weg des HERRN bewahren, Gerechtigkeit üben, dass jeder seinen Bruder liebe und sich gegenüber allen Menschen ebenso verhalte und dass sie miteinander wandeln, um auf der Erde Recht und Gerechtigkeit zu üben.[a]
  rationale: Die Revision glättet nur die deutsche Satzfügung und ersetzt „lebe“ durch eine neutrale Verhaltensumschreibung. Dadurch bleibt sowohl der singularische Bezug auf „jeder“ als auch der anschließende pluralische Wechsel erhalten; die umstrittene bzw. dichte Vergleichsformel wird nicht doktrinär oder übermäßig präzise aufgelöst. Der Fußnotenanker bleibt unmittelbar an der Schlussklausel stehen.
