base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/020/008.yaml
  text: and they will bless your children in my name, so that they may be blessed as I am. And he gave gifts to Ishmael and to his sons and to the sons of Keturah, and he sent them away from Isaac his son; but he gave everything to him
translation:
  language: de
  text: Und sie werden deine Kinder in meinem Namen segnen, damit sie ebenso gesegnet sind wie ich. Und er gab Ismael, seinen Söhnen und den Söhnen Keturas Geschenke und schickte sie fort von seinem Sohn Isaak; und alles gab er ihm.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und alles gab er ihm«. Mit »ihm« ist im Zusammenhang wohl Isaak gemeint; die Formulierung führt über die Versgrenze hinweg weiter.'
    reason: Das ge’ezische Objektsuffix ist eindeutig singularisch-maskulin, sein Bezug wird in diesem Vers jedoch nicht ausdrücklich genannt.
lexical_decisions:
- source_word: ይባርኩ
  choice: sie werden … segnen
  rationale: Die Verbform wird als pluralisches Futur wiedergegeben; das im Kontext vorausgesetzte Subjekt bleibt wie in der Vorlage unbestimmt.
- source_word: ሀብተ
  choice: Geschenke
  rationale: Das Substantiv bezeichnet hier Gaben beziehungsweise Geschenke, die Abraham den genannten Nachkommen mitgibt.
- source_word: ወፈነዎሙ
  choice: und schickte sie fort
  rationale: Gibt sowohl das Wegsenden als auch das pluralische Objekt der ge’ezischen Form wieder.
- source_word: ወኵሎ፡ ወሀቦ
  choice: und alles gab er ihm
  rationale: Bewahrt die Wortfolge und das maskuline singularische Objektsuffix „ihm“, ohne dessen Bezug im Haupttext ausdrücklich festzulegen.
theological_decisions:
- issue: Bezug des Pronomens im Schlusssatz
  choice: Das Pronomen „ihm“ bleibt stehen und wird nicht durch „Isaak“ ersetzt.
  alternative: „Isaak aber gab er alles.“
  rationale: Die ge’ezische Form enthält ein maskulines singularisches Objektsuffix, nennt den Bezugsnamen an dieser Stelle jedoch nicht. Die Übersetzung erhält diese formale und durch die Versgrenze verstärkte Spannung.
- issue: Vergleich der Segnung
  choice: „ebenso gesegnet … wie ich“
  alternative: „gesegnet sein mögen, wie ich es bin“
  rationale: Die knappe Vergleichsformel der Vorlage wird ohne zusätzliche Erklärung oder theologische Präzisierung wiedergegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung mit wiederholtem „und“ folgt dem erzählenden Stil der Vorlage; der abrupte Schluss und der nicht ausdrücklich benannte Bezug von „ihm“ bleiben erhalten.
