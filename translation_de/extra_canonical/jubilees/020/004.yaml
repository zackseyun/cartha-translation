  yaml_path: translation/extra_canonical/jubilees/020/004.yaml
  text: the God of heaven, and cling to all his commandments, and do not walk after their idols and after their uncleanness. And do not make for yourselves gods of cast metal or carved images, for they are emptiness, and there is no spirit in them; for they are the work of hands, and all who trust in them trust in nothing. Do not serve them, and do not bow down to them. But serve the God
translation:
  language: de
  text: den Gott des Himmels, und haltet an allen seinen Geboten fest. Lauft nicht ihren Götzen und ihrer Unreinheit nach. Macht euch keine gegossenen Götter und keine Schnitzbilder; denn sie sind nichtig, und kein Geist ist in ihnen. Sie sind ein Werk von Menschenhänden, und alle, die auf sie vertrauen, vertrauen auf nichts. Dient ihnen nicht und werft euch nicht vor ihnen nieder. Dient vielmehr dem Gott
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወትጸመዱ
  choice: und haltet euch an
  rationale: Das Verb bezeichnet ein enges Sichanschließen bzw. Festhalten; die Formulierung ist im Deutschen natürlich und bewahrt die Nachdrücklichkeit.
- source_word: ርኵሶሙ
  choice: ihrer Unreinheit
  rationale: Die substantivische Einzahl mit Possessivsuffix wird formal bewahrt; »Unreinheit« lässt den kultischen und sittlichen Bedeutungsumfang offen.
- source_word: አማልክተ፡ ሰብክ
  choice: gegossenen Götter
  rationale: Die Wendung bezeichnet aus Metall gegossene Gottheiten; diese knappe Wiedergabe unterscheidet sie von den anschließend genannten Schnitzbildern.
- source_word: ግልፈዋተ
  choice: Schnitzbilder
  rationale: Bezeichnet geschnitzte bzw. eingemeißelte Kultbilder; »Schnitzbilder« ist verständlich und traditionsnah.
- source_word: ከንቱ
  choice: nichtig
  rationale: Gibt Leere, Wertlosigkeit und Wirkungslosigkeit wieder, ohne die Aussage stärker als die Vorlage auszudeuten.
- source_word: ግብረ፡ እደው
  choice: Menschenwerk
  rationale: Wörtlich »Werk der Hände«; »Menschenwerk« vermittelt den Gegensatz zwischen gemachten Bildern und Gott knapp und idiomatisch.
- source_word: ይትዌከሉ
  choice: vertrauen
  rationale: Bewahrt den theologischen Begriff des Sichverlassens bzw. Vertrauens.
- source_word: ኢታምልክዎሙ
  choice: Dient ihnen nicht
  rationale: Das Verb kann kultisches Dienen oder Verehren bezeichnen; »dienen« hält die Verbindung zum positiven Schlussgebot aufrecht.
- source_word: ኢትስግዱ
  choice: werft euch nicht vor ihnen nieder
  rationale: Gibt die konkrete Geste kultischer Niederwerfung deutlicher wieder als das allgemeinere »anbeten«.
theological_decisions:
- issue: Aussage über den Geist in den Götzenbildern
  choice: und kein Geist ist in ihnen
  alternative: und nicht einmal ein Hauch ist in ihnen
  rationale: Die Wiedergabe lässt »Geist«, »Lebensodem« und Lebenskraft mitschwingen und bewahrt die kategorische Leblosigkeit der Bilder.
- issue: Vertrauen auf Götzen
  choice: vertrauen auf nichts
  alternative: vertrauen auf Nichtiges
  rationale: Die Formulierung bewahrt die zugespitzte Aussage, dass der Gegenstand des Vertrauens substanzlos ist, ohne daraus eine zusätzliche dogmatische Behauptung zu machen.
- issue: Abgebrochener Versanfang und Versschluss
  choice: Die syntaktisch offenen Fragmente werden als solche bewahrt
  alternative: Ergänzung eines Verbs am Anfang und eines Gottesprädikats am Ende
  rationale: Der bereitgestellte Quellenausschnitt beginnt und endet mitten im Satz; unbelegte Ergänzungen würden den Umfang von Jub 20,4 überschreiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klaren Imperativen. Die Wiederholung von »Dient« spiegelt den bewussten Gegensatz zwischen Götzendienst und Gottesdienst. Anfang und Ende bleiben wegen der über die Versgrenzen laufenden Syntax fragmentarisch.
