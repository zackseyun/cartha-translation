  text: And he lived three jubilees and four weeks of years, one hundred and seventy-five years, and he completed the days of his life, old and full of days.
translation:
  language: de
  text: Und er lebte drei Jubiläen und vier Jahrwochen, einhundertfünfundsiebzig Jahre, und vollendete die Tage seines Lebens, alt und lebenssatt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሠለስተ፡ ኢዮቤልው፡ ... ወአርባዕተ፡ ሱባዔ፡ ዓመተ
  choice: drei Jubiläen und vier Jahrwochen
  rationale: 'Gibt die kalendarischen Einheiten des ge''ezischen Textes transparent wieder: drei Jubiläumsperioden zu je 49 Jahren und vier Siebenergruppen von Jahren ergeben 175 Jahre.'
- source_word: ምእተ፡ ወሰብዓ፡ ወኃምስተ፡ ዓመተ
  choice: einhundertfünfundsiebzig Jahre
  rationale: Direkte Wiedergabe der ausdrücklich genannten Gesamtzahl.
- source_word: ወፈጸመ፡ መዋዕለ፡ ሕይወቱ
  choice: So vollendete er die Tage seines Lebens
  rationale: Bewahrt die idiomatische Rede von den Lebenstagen und gibt die Folge des Satzes in natürlichem Deutsch wieder.
- source_word: አሂቅ፡ ወፍጹመ፡ መዋዕለ
  choice: alt und lebenssatt
  rationale: Die würdevolle biblische Wendung fasst den Sinn von hohem Alter und erfüllter Lebenszeit natürlich zusammen, ohne eine bloße Wiederholung von „Tage“ zu erzeugen.
theological_decisions:
- issue: Bedeutung von „voll der Tage“
  choice: lebenssatt
  alternative: voll an Tagen
  rationale: „Lebenssatt“ ist im modernen Deutschen verständlich und bewahrt den positiven Sinn eines erfüllten, abgeschlossenen Lebens; es bezeichnet nicht Lebensüberdruss.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter antiker Zeitrechnung. Die explizite Summe von 175 Jahren bleibt als erklärende Gesamtangabe im Haupttext stehen.
