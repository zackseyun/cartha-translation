  text: And the heads of the children will become white with gray hair, and a child of three weeks will appear old like one of a hundred years, and their stature will be destroyed by distress and affliction.
translation:
  language: de
  text: Und die Köpfe der Kinder werden vor Alter weiß werden, und ein Kind von drei Wochen wird aussehen wie jemand, der hundert Jahre alt ist, und ihr Wuchs wird durch Bedrängnis und Leid zugrunde gehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይጸዐዱ፡ አርእስተ፡ ደቂቅ፡ በሲበት
  choice: die Köpfe der Kinder werden grauhaarig weiß werden
  rationale: Gibt das Ergrauen bzw. Weißwerden der Kinderköpfe durch hohes Alter eng am ge’ezischen Ausdruck wieder, ohne das Bild zu glätten.
- source_word: ሕፃን፡ ወልደ፡ ሠለስት፡ ሱባዔ
  choice: ein Kind von drei Wochen
  rationale: Der Ausdruck bezeichnet wörtlich ein Kind im Alter von drei Siebener-Zeiträumen, also drei Wochen.
- source_word: ልሂቅ፡ ከመ፡ ዘምእት፡ ዓመት
  choice: wie ein Hundertjähriger aussehen
  rationale: Bewahrt den Vergleich mit einer hundert Jahre alten Person und formuliert ihn in natürlichem modernem Deutsch.
- source_word: ቍመቶሙ
  choice: ihre Gestalt
  rationale: Das Wort kann Körpergröße, Wuchs oder körperliche Gestalt bezeichnen; „Gestalt“ wahrt die semantische Breite im Kontext körperlichen Verfalls.
- source_word: በምንዳቤ፡ ወበፃዕር
  choice: durch Not und Mühsal
  rationale: Gibt die beiden Ursachen des Verfalls als bedrängende Not und belastende Mühe bzw. Leiden wieder.
