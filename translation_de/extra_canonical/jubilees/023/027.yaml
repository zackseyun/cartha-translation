  terminology: „Not und Mühsal“ ist vertretbar, doch ፃዕር bezeichnet hier eher Mühe, Leid oder Bedrückung. „Bedrängnis und Leid“ bildet die belastende Doppelung natürlich ab. „Hundertjähriger“ ist als substantivierter Vergleich möglich, aber „jemand, der hundert Jahre alt ist“ ist eindeutiger und geschlechtsneutral.
