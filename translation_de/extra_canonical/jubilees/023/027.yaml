  source_fidelity: 'Die drei Aussagen des geʽezischen Textes sind grundsätzlich korrekt erfasst: frühzeitiges Ergrauen, ein drei Wochen altes Kind mit dem Erscheinungsbild eines Hundertjährigen sowie die Schädigung ihres Wuchses durch Bedrängnis und Leid. „Gestalt“ ist für ቍመቶሙ jedoch weniger präzise als „Wuchs“ bzw. „Körpergröße“; der Kontext meint den körperlichen Wuchs.'
