  - severity: medium
    issue: „ihre Gestalt wird ... zugrunde gehen“ für ቍመቶሙ
    rationale: Das Wort bezeichnet vor allem Wuchs, Statur oder Körpergröße. „Gestalt“ kann im Deutschen auch Form oder äußeres Erscheinungsbild meinen und ist daher zu weit.
