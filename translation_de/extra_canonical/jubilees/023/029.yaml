base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/029.yaml
  text: And the days will begin to grow many and increase among the children of men, generation by generation and day by day, until their days draw near to one thousand years and to many years beyond many days. And there will be no old man, nor one who is not satisfied with his days; for all of them will be like children and youths. And all their days they will complete in peace and joy, and they will live, and there will be no Satan and no evil destroyer, for all their days will be days of blessing and healing.
translation:
  language: de
  text: Und die Tage werden bei den Menschenkindern beginnen, zahlreicher zu werden und zuzunehmen, von Generation zu Generation und von Tag zu Tag, bis ihre Tage sich tausend Jahren nähern und sich von vielen Tagen zu vielen Jahren hin erstrecken. Es wird keinen Greis geben und niemanden, der seiner Tage nicht satt wäre; denn sie alle werden wie Kinder und Jugendliche sein. Sie werden all ihre Tage in Frieden und Freude vollenden und leben. Es wird keinen Satan und keinen bösen Verderber geben; denn alle ihre Tage werden Tage des Segens und der Heilung sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይአኅዛ፡ መዋዕል፡ ይብዝኃ፡ ወይሌህቃ
  choice: die Zahl der Tage wird … immer weiter zunehmen
  rationale: Gibt den Beginn und die fortschreitende Vermehrung bzw. Zunahme der Tage in natürlichem Deutsch wieder, ohne die beiden nahezu synonymen Verben unnötig schwerfällig zu verdoppeln.
- source_word: ውሉደ፡ ሰብእ
  choice: Menschenkinder
  rationale: Bewahrt die semitische Kollektivbezeichnung und den würdevollen antiken Ton, bleibt aber verständlich.
- source_word: መዋዕሊሆሙ
  choice: ihre Lebenszeit / ihre Lebenstage / ihre Tage
  rationale: Der Kontext meint sowohl die Lebensspanne als auch deren einzelne Tage; die kontextabhängige Variation ergibt idiomatisches Deutsch.
- source_word: ይጸግብ፡ መዋዕሊሆሙ
  choice: seiner Lebenstage … satt geworden ist
  rationale: Erhält das konkrete biblische Bild des Sattseins an Tagen statt es lediglich als hohes Alter zu paraphrasieren.
- source_word: ሕፃናት፡ ወደቂቅ
  choice: Kinder und junge Menschen
  rationale: Gibt die beiden Altersbezeichnungen wieder, ohne mit dem modernen Wort „Jugendliche“ einen zu engen sozialen Begriff einzuführen.
- source_word: ሰይጣነ
  choice: Satan
  rationale: Übernimmt die im Text personifiziert erscheinende Bezeichnung direkt.
- source_word: እኩየ፡ ዘያማስን
  choice: böser Verderber
  rationale: Bewahrt sowohl die moralische Wertung als auch die zerstörerische Tätigkeit der Wendung.
- source_word: በረከት፡ ወፈውስ
  choice: Segen und Heilung
  rationale: Entspricht den beiden positiven Leitbegriffen und lässt offen, ob Heilung körperlich, umfassend oder beides gemeint ist.
theological_decisions:
- issue: Gestalt Satans und des Verderbers
  choice: „keinen Satan und keinen bösen Verderber“ als zwei koordinierte Bezeichnungen wiedergegeben
  alternative: Beide Ausdrücke als Bezeichnungen derselben Gestalt zusammenziehen
  rationale: Der Ausgangstext setzt beide Aussagen parallel nebeneinander; die Übersetzung wahrt diese formale und mögliche sachliche Unterscheidung.
- issue: Art der endzeitlichen Lebensverlängerung
  choice: Die Annäherung der Lebenszeit an tausend Jahre wörtlich beibehalten
  alternative: Als bloß bildliche Aussage über große Langlebigkeit paraphrasieren
  rationale: Der Text nennt eine konkrete Größenordnung; die Übersetzung entscheidet nicht vorab über deren wörtliche oder symbolische Deutung.
- issue: Bedeutungsumfang von „Heilung“
  choice: „Heilung“
  alternative: „Heil“ oder „Gesundheit“
  rationale: „Heilung“ wahrt den prozesshaften und mehrdeutigen Sinn, ohne ihn ausschließlich körperlich oder ausschließlich geistlich festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bibelnaher Bildsprache. Wiederholungen werden dort erhalten, wo sie die Parallelstruktur tragen; an einer Stelle wird die verbale Häufung zugunsten natürlicher Lesbarkeit gebündelt. Keine konfessionellen Deutungszusätze.
