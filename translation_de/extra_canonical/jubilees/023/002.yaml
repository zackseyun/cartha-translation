  language: de
  text: Während all dessen lag Jakob an seiner Brust, und er wusste nicht, dass Abraham, der Vater seines Vaters, gestorben war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበዝ፡ ኵሉ
  choice: Während all dessen
  rationale: Gibt die zeitlich-umständliche Wendung natürlich wieder, ohne sie auf einen einzelnen Vorgang einzuengen.
- source_word: ይስክብ፡ ውስተ፡ ሕፅኑ
  choice: lag … an seiner Brust
  rationale: Bewahrt das konkrete Bild inniger körperlicher Nähe; „an“ ist im modernen Deutschen natürlicher als das missverständliche „in seinem Schoß“.
- source_word: አቡ፡ አቡሁ
  choice: der Vater seines Vaters
  rationale: Folgt der ausdrücklichen Verwandtschaftsbezeichnung der Vorlage statt sie lediglich zu „Großvater“ zu verdichten.
