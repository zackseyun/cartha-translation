  yaml_path: translation/extra_canonical/jubilees/023/020.yaml
  text: And they will contend, these with those, and the young with the old, and the old with the young, the poor with the rich, the lowly with the great, and the needy with the ruler, concerning the law and concerning the covenant, because they have forgotten commandment and covenant and festival and month and Sabbath and Jubilee and all that is appointed.
translation:
  language: de
  text: Und sie werden streiten, die einen mit den anderen, die Jungen mit den Alten und die Alten mit den Jungen, die Armen mit den Reichen, die Niedrigen mit den Großen und die Bedürftigen mit dem Herrscher – wegen des Gesetzes und wegen des Bundes. Denn sie haben das Gebot und den Bund vergessen, das Fest und den Monat, den Sabbat und das Jubeljahr und alles, was festgesetzt ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Schlusswendung kann wörtlicher auch „alles, was ist/war“ bedeuten; je nach Verständnis kommt auch „alles, was geworden oder geschehen ist“ in Betracht. „Was festgesetzt ist“ versteht sie im Zusammenhang der zuvor genannten Ordnungen.
    reason: Die ge’ezische Wendung ዘ ኴነ ist semantisch weiter als die kontextuelle Wiedergabe im Haupttext.
lexical_decisions:
- source_word: ይትባአሱ
  choice: sie werden miteinander streiten
  rationale: Das Verb bezeichnet einen wechselseitigen Streit oder Widerstreit; „miteinander streiten“ gibt sowohl den Zukunftsbezug als auch die Gegenseitigkeit natürlich wieder.
- source_word: ወረዘት
  choice: die Jungen
  rationale: Der Ausdruck bezeichnet die junge Generation und bildet hier den Gegensatz zu den Alten.
- source_word: ነዳይ
  choice: die Armen
  rationale: Die geläufige Bedeutung ist „arm“; die substantivierte Pluralform entspricht der gegenübergestellten gesellschaftlichen Gruppe.
- source_word: ትሑት
  choice: die Niedrigen
  rationale: Bewahrt den Gegensatz zu „den Großen“ und lässt offen, ob vor allem niedriger Rang, geringe Stellung oder Demut gemeint ist.
- source_word: ምስኪን
  choice: die Bedürftigen
  rationale: Bezeichnet Notleidende beziehungsweise sozial Schwache; „Bedürftige“ unterscheidet die Gruppe sprachlich von den zuvor genannten Armen.
- source_word: መኰንን
  choice: dem Herrscher
  rationale: Der Titel kann einen Machthaber, Fürsten oder hohen Amtsträger bezeichnen; „Herrscher“ erhält die politische Autorität, ohne sie genauer festzulegen.
- source_word: በዓል
  choice: Fest
  rationale: Bezeichnet ein Fest beziehungsweise einen festgesetzten Festtag; „Fest“ ist im Deutschen knapp und kultisch passend.
- source_word: ወርኀ
  choice: Monat
  rationale: Gibt die unmittelbare lexikalische Bedeutung wieder und vermeidet die unbelegte Präzisierung zu „Neumond“.
- source_word: ሰንበተ
  choice: Sabbat
  rationale: Die etablierte deutsche Bezeichnung für den heiligen Ruhetag.
- source_word: እዮቤሌወ
  choice: Jubeljahr
  rationale: Im Kontext des Jubiläenbuches bezeichnet der Ausdruck das biblische Jubeljahr; diese Form ist im Deutschen verständlicher und präziser als „Jubiläum“.
- source_word: ዘ ኴነ
  choice: was festgesetzt ist
  rationale: Wörtlich ist die Wendung weiter („was ist/war/geworden ist“). Im Zusammenhang mit Gesetz, Bund und heiligen Zeiten bezeichnet sie plausibel das Bestehende beziehungsweise Angeordnete; die Fußnote bewahrt die weitere Lesemöglichkeit.
theological_decisions:
- issue: Art der vergessenen religiösen Ordnungen
  choice: Gebot, Bund und heilige Zeiten werden als parallele, konkrete Ordnungen wiedergegeben.
  alternative: Die Glieder als allgemeine religiöse Begriffe oder als vollständig technische Kalendertermini auslegen.
  rationale: Der Ausgangstext reiht die Begriffe ohne nähere dogmatische Erklärung aneinander; die Übersetzung wahrt diese Spannung und präzisiert „Monat“ nicht zu „Neumond“.
- issue: Schlussformel ወኵሎ ዘ ኴነ
  choice: „und alles, was festgesetzt ist“
  alternative: „und alles, was war/geschehen ist“ oder „und alles, was besteht“
  rationale: Die kontextuelle Fassung verbindet die Schlussformel mit den zuvor genannten gesetzlichen und kalendarischen Ordnungen, während die Fußnote auf den breiteren Wortlaut hinweist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Gegenüberstellungen bleiben als rhetorische Reihe erhalten; ein Doppelpunkt und ein Gedankenstrich strukturieren den langen Satz, ohne seine Parallelität aufzulösen. Die sakralen Zeitbezeichnungen werden als „Sabbat“ und „Jubeljahr“ verständlich wiedergegeben.
