base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/011.yaml
  text: For Abraham was perfect in all his deeds with the LORD, and he was pleasing in righteousness all the days of his life; and behold, he did not complete four jubilees in his life, until he grew old because of evil, and he was full of days.
translation:
  language: de
  text: Denn Abraham war in seinem ganzen Tun mit dem HERRN untadelig[a] und gefiel ihm durch Gerechtigkeit alle Tage seines Lebens. Und siehe, er vollendete in seinem Leben keine vier Jubiläen, bis er wegen des Bösen alt wurde[b] und seiner Tage satt war.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „vollkommen“.'
    reason: Bewahrt die wörtlichere Bedeutung von ፍጹም neben der kontextuell natürlicheren Wiedergabe „untadelig“.
  - marker: b
    text: 'Wörtlich: „vor dem Angesicht des Bösen“.'
    reason: Dokumentiert die konkrete geezische Ausdrucksweise hinter der idiomatisch-kausalen Übersetzung.
  - marker: c
    text: 'Das heißt: Er hatte ein hohes, erfülltes Alter erreicht.'
    reason: Erläutert die heute weniger geläufige biblische Wendung „seiner Tage satt“.
lexical_decisions:
- source_word: ፍጹም (fəṣṣum)
  choice: untadelig
  rationale: Das Wort bezeichnet hier Abrahams Vollkommenheit bzw. Unbescholtenheit in seinem gesamten Tun. „Untadelig“ ist im heutigen Deutsch natürlich und vermeidet die mögliche Überdehnung von „vollkommen“ im Sinn absoluter Sündlosigkeit.
- source_word: ምስለ (məsla)
  choice: mit
  rationale: Die Präposition bedeutet „mit“; sie wird nicht als „vor“ wiedergegeben.
- source_word: ይሠምር (yəśämmər)
  choice: gefiel ihm
  rationale: Das Verb drückt Wohlgefallen aus. Der Rückbezug auf den unmittelbar zuvor genannten HERRN wird im Deutschen durch „ihm“ deutlich gemacht.
- source_word: ጽድቅ (ṣədq)
  choice: Gerechtigkeit
  rationale: Bewahrt den zentralen ethisch-theologischen Begriff des Ausgangstextes, ohne ihn auf bloße Rechtschaffenheit einzuengen.
- source_word: ኢዮቤልውሳተ (ʾiyobelwəsat)
  choice: Jubiläen
  rationale: Bezeichnet Jubiläumsperioden von jeweils 49 Jahren und wird entsprechend der Buchterminologie wiedergegeben.
- source_word: ጸገበ፡ መዋዕሊሁ (ṣägäbä mawāʿə-lihu)
  choice: war seiner Tage satt
  rationale: Erhält das biblische Bild, dass Abraham ein hohes, erfülltes Alter erreicht hatte; der grammatische Bezug auf Abraham bleibt gewahrt.
theological_decisions:
- issue: Abrahams „Vollkommenheit“
  choice: untadelig
  alternative: vollkommen
  rationale: „Untadelig“ beschreibt die Qualität seines gesamten Lebenswandels, ohne eine dogmatische Aussage über absolute moralische Vollkommenheit einzutragen. Die wörtlichere Alternative wird in einer Fußnote bewahrt.
- issue: Ursache seines Alterns vor vier Jubiläen
  choice: wegen des Bösen
  alternative: vor dem Angesicht des Bösen
  rationale: Die geezische Wendung kann idiomatisch kausal gebraucht werden. Der Zusammenhang des Kapitels stellt die Verkürzung menschlichen Lebens als Folge des Bösen dar; die konkrete Bildsprache bleibt per Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrten biblischen Leitbegriffen und Bildern. „Und siehe“ hält das erzählerische Signal des Ausgangstextes fest; „seiner Tage satt“ wahrt bewusst dessen biblischen Klang. Die eigentümliche zeitliche Spannung von „keine vier Jubiläen, bis …“ wird nicht harmonisierend aufgelöst.
