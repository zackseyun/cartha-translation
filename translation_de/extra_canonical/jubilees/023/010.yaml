base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/010.yaml
  text: For the days of the former ones were nineteen jubilees for their lives; but after the Flood they began to diminish from nineteen jubilees, and to grow old quickly, and to shorten the days of their lives because of many afflictions and because of the evil of their ways, except Abraham.
translation:
  language: de
  text: Denn die Lebensdauer der Menschen früherer Zeiten betrug neunzehn Jubiläen; nach der Flut aber begannen sie, unter neunzehn Jubiläen zu sinken und rasch zu altern, und die Tage ihres Lebens verkürzten sich wegen vieler Leiden und wegen der Bosheit ihrer Wege – außer Abraham.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዋዕለ፡ ቀደምት
  choice: die Lebenszeit der Menschen früherer Zeiten
  rationale: Gibt die wörtliche Vorstellung von den »Tagen der Früheren« in natürlichem Deutsch wieder und stellt durch den folgenden Ausdruck ለሕይወቶሙ den Bezug auf ihre Lebensdauer klar.
- source_word: ኢዮቤልውሳት
  choice: Jubiläen
  rationale: Bewahrt den für das Jubiläenbuch zentralen Zeitbegriff und vermeidet eine unbelegte Umrechnung.
- source_word: ይኅትጉ
  choice: abzunehmen
  rationale: Gibt das allmähliche Schwinden beziehungsweise Kürzerwerden der Lebenszeit wieder.
- source_word: በረሲአ፡ ፍጡነ
  choice: Sie alterten rasch
  rationale: Entspricht der Aussage vom schnellen Altwerden in knapper, gegenwärtiger Standardsprache.
- source_word: ሕማም፡ ብዙኅ
  choice: vieler Leiden
  rationale: Das Substantiv kann Krankheit, Schmerz oder Leid bezeichnen; »Leiden« hält das Bedeutungsspektrum offen.
- source_word: እከየ፡ ፍናዊሆሙ
  choice: der Bosheit ihrer Wege
  rationale: Bewahrt das ethisch gewichtige Weg-Motiv des Ausgangstextes, ohne es auf einzelne Taten einzuengen.
theological_decisions:
- issue: Bezugsweite der Ausnahme Abrahams
  choice: Die abschließende Formulierung »Abraham ausgenommen« bleibt syntaktisch weit gefasst.
  alternative: Die Ausnahme ausdrücklich nur auf die Bosheit der Wege oder nur auf die verkürzte Lebenszeit beziehen.
  rationale: Der knappe Schluss ዘእንበለ፡ አብርሃም lässt den genauen Bezug offen. Die Übersetzung löst diese theologisch bedeutsame Mehrdeutigkeit nicht stillschweigend auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zwei Hauptgedanken wurden zur besseren Verständlichkeit auf drei Sätze verteilt; die Wiederholung von »neunzehn Jubiläen« und die bildhafte Rede von den »Wegen« bleiben erhalten.
