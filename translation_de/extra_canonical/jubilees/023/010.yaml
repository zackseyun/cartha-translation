revisions:
- from: Denn die Lebenszeit der Menschen früherer Zeiten betrug neunzehn Jubiläen. Nach der Flut aber begann sie, von neunzehn Jubiläen abzunehmen. Sie alterten rasch, und die Tage ihres Lebens verkürzten sich wegen vieler Leiden und wegen der Bosheit ihrer Wege – Abraham ausgenommen.
  to: Denn die Lebensdauer der Menschen früherer Zeiten betrug neunzehn Jubiläen; nach der Flut aber begannen sie, unter neunzehn Jubiläen zu sinken und rasch zu altern, und die Tage ihres Lebens verkürzten sich wegen vieler Leiden und wegen der Bosheit ihrer Wege – außer Abraham.
  rationale: Die Revision stellt die Menschen als einheitliches Subjekt der nachflutlichen Entwicklung her. Sie erhält die Wiederholung von „neunzehn Jubiläen“, die nicht näher bestimmte Ursache „vieler Leiden“, das ethische Weg-Motiv sowie die im Ausgangstext offene Bezugsweite der Ausnahme Abrahams.
