  yaml_path: translation/extra_canonical/jubilees/023/001.yaml
  text: And he placed Jacob's two fingers upon his eyes, and he blessed the God of gods, and he covered his face and stretched out his feet and slept the sleep of eternity, and was gathered to his fathers.
translation:
  language: de
  text: Und er legte die beiden Finger Jakobs auf seine Augen, pries den Gott der Götter, bedeckte sein Gesicht, streckte seine Füße aus und entschlief zum ewigen Schlaf; dann wurde er zu seinen Vätern versammelt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ክልኤሆን፡ አጻብዐ፡ ያዕቆብ
  choice: die beiden Finger Jakobs
  rationale: Gibt die Zahl und die Genitivbeziehung des geezischen Ausdrucks genau und zugleich idiomatisch wieder.
- source_word: ባረኮ
  choice: pries
  rationale: Das Verb kann „segnen“ bedeuten; wenn Gott das Objekt ist, gibt „preisen“ den gemeinten Akt in natürlichem Deutsch wieder.
- source_word: አምላክ፡ አማልክት
  choice: den Gott der Götter
  rationale: Bewahrt den wörtlichen Superlativ- beziehungsweise Hoheitstitel, ohne ihn deutend umzuschreiben.
- source_word: ኖመ፡ ንዋመ፡ ዘለዓለም
  choice: entschlief zum ewigen Schlaf
  rationale: Bewahrt das Schlafbild und dessen endgültigen Charakter in würdigem, verständlichem Deutsch.
- source_word: ተጋብአ፡ ኀበ፡ አበዊሁ
  choice: wurde er zu seinen Vätern versammelt
  rationale: Erhält die traditionelle Todesformel und ihr familiär-eschatologisches Bedeutungsspektrum.
theological_decisions:
- issue: Wiedergabe des Gottestitels
  choice: Gott der Götter
  alternative: höchster Gott
  rationale: Die formale Wendung wird beibehalten, damit ihre mögliche Aussage über göttliche Hoheit nicht durch eine interpretierende Paraphrase eingeengt wird.
- issue: Wiedergabe der Todesmetapher
  choice: entschlief zum ewigen Schlaf
  alternative: starb
  rationale: Das Bild des Schlafes und die Spannung zwischen bildlicher und endgültiger Aussage sollen erhalten bleiben.
- issue: Versammlung zu den Vätern
  choice: zu seinen Vätern versammelt
  alternative: mit seinen Vorfahren vereint
  rationale: Die quellennahe Formel lässt offen, ob vor allem Bestattung, Tod, Zugehörigkeit zu den Ahnen oder eine jenseitige Gemeinschaft gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung der Sterbehandlungen bleibt erhalten; das wiederholte „und“ wurde nur dort geglättet, wo deutsches Erzählen dadurch natürlicher wird. Keine konfessionelle Deutung wurde ergänzt.
