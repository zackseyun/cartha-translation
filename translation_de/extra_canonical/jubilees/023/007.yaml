  text: Und seine Söhne Isaak und Ismael begruben ihn in der Doppelhöhle, nahe bei seiner Frau Sara.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቀበርዎ
  choice: begruben ihn
  rationale: Das ge’ezische Verb bezeichnet das Bestatten bzw. Begraben; das Objektsuffix wird mit „ihn“ wiedergegeben.
- source_word: በዓተ፡ ካዕበት
  choice: Doppelhöhle
  rationale: Wörtlich etwa „doppelte Höhle“; „Doppelhöhle“ ist eine knappe, natürliche Wiedergabe der überlieferten Ortsbezeichnung.
- source_word: ቅሩበ
  choice: nahe bei
  rationale: Gibt die räumliche Nähe natürlich wieder, ohne eine genauere Lagebeziehung in den Text hineinzulesen.
- source_word: ብእሲቱ
  choice: seiner Frau
  rationale: Das Wort bezeichnet hier die Ehefrau; das possessive Verhältnis bezieht sich auf den Bestatteten.
- source_word: ውሉዱ፡ ይስሐቅ፡ ወእስማዔል
  choice: seine Söhne Isaak und Ismael
  rationale: Die im Ge’ez nachgestellte Nominalgruppe wird im Deutschen als natürliches vorangestelltes Subjekt wiedergegeben.
