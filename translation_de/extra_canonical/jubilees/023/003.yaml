  to: 'Und Jakob erwachte aus seinem Schlaf, und siehe, Abraham war kalt geworden wie Eis; und er rief: „Vater, Vater!“ Doch niemand sprach, und er erkannte, dass Abraham gestorben war.'
  rationale: Die einzige Änderung ersetzt die semantisch eingeengte Reaktionsaussage „niemand antwortete“ durch „niemand sprach“, das die Formulierung des Ge’ez unmittelbar und ohne Zusatzannahme wiedergibt. Der Vergleich „wie Eis“ bleibt erhalten, da ከመ፡ ባረድ፡ ausdrücklich einen Vergleich mit Eis/Hagel enthält und der englische Audit trail die Wiedergabe „as ice“ bestätigt.
