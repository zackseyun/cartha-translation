  text: And Jacob awoke from his sleep, and behold, Abraham had grown cold as ice; and he said, “Father, father!” But there was no one speaking, and he knew that he had died.
translation:
  language: de
  text: 'Und Jakob erwachte aus seinem Schlaf, und siehe, Abraham war kalt geworden wie Eis; und er rief: „Vater, Vater!“ Doch niemand sprach, und er erkannte, dass Abraham gestorben war.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነቅሀ፡ … እምንዋሙ፡
  choice: erwachte aus seinem Schlaf
  rationale: Gibt die geezische Konstruktion unmittelbar und in natürlichem Standarddeutsch wieder.
- source_word: ናሁ፡
  choice: und siehe
  rationale: Bewahrt das narrative Aufmerksamkeitssignal des Ausgangstextes in würdigem biblischem Register.
- source_word: ቈረ፡ አብርሃም፡ ከመ፡ ባረድ፡
  choice: Abraham war kalt geworden wie Eis
  rationale: Bewahrt sowohl das eingetretene Kaltsein als auch den ausdrücklich vorhandenen Vergleich ከመ ባረድ; „Eis“ ist im Kontext einer erkalteten Leiche natürlicher als „Hagel“.
- source_word: ወአልቦ፡ ዘነበበ፡
  choice: Doch niemand antwortete
  rationale: Wörtlich etwa „und da war keiner, der sprach“; im Ruf-und-Reaktion-Zusammenhang vermittelt „niemand antwortete“ den Sinn idiomatisch, ohne eine Antwort inhaltlich zu ergänzen.
- source_word: ወአእመረ፡ ከመ፡ ሞተ።
  choice: und er erkannte, dass Abraham gestorben war
  rationale: „Erkannte“ bildet አእመረ präzise ab; das wiederholte Subjekt „Abraham“ beseitigt im Deutschen eine vermeidbare Pronomenmehrdeutigkeit.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Das traditionelle „siehe“ bleibt als bewusstes narratives Signal erhalten. Keine Fußnote ist erforderlich, da der im Ge’ez ausdrücklich vorhandene Vergleich direkt im Haupttext wiedergegeben wird.
