revisions:
- from: Und im Haus Abrahams war ein Laut zu hören. Da stand sein Sohn Ismael auf und ging zu seinem Vater Abraham. Er und alle Angehörigen des Hauses Abrahams weinten um seinen Vater Abraham, und sie weinten sehr.
  to: Und im Haus Abrahams war ein Laut zu hören. Da stand sein Sohn Ismael auf und ging zu Abraham, seinem Vater. Ismael weinte um Abraham, seinen Vater, zusammen mit dem ganzen Haus Abrahams; sie weinten sehr.
  rationale: Die Revision ersetzt die interpretierende Bezeichnung „Angehörige“ durch die quellennähere und im Deutschen verständliche Formulierung „das ganze Haus Abrahams“. Sie ordnet ferner die wiederholte Vaterbezeichnung eindeutig Ismael zu, ohne den im Ausgangstext enthaltenen Nachdruck abzuschwächen. Der Laut bleibt bewusst unbestimmt; für das große Weinen wird die natürliche, nicht überdeutende Wiedergabe „sie weinten sehr“ beibehalten.
