  text: And a sound was heard in the house of Abraham, and Ishmael his son arose and went to Abraham his father, and he wept for Abraham his father, he and all the house of Abraham, and they wept with great weeping.
translation:
  language: de
  text: Und im Haus Abrahams war ein Laut zu hören. Da stand sein Sohn Ismael auf und ging zu Abraham, seinem Vater. Ismael weinte um Abraham, seinen Vater, zusammen mit dem ganzen Haus Abrahams; sie weinten sehr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቃል (qāl)
  choice: Laut
  rationale: Das Wort bezeichnet allgemein Stimme, Klang oder Laut. „Laut“ bewahrt diese Offenheit, ohne den Inhalt vorschnell als Klage oder Nachricht festzulegen.
- source_word: ተንሥአ (tanśəʾa)
  choice: stand … auf
  rationale: Gibt die konkrete Aufstehbewegung natürlich und quellennah wieder.
- source_word: በከየ (bakaya)
  choice: weinten um
  rationale: Im Zusammenhang mit Abrahams Tod bezeichnet die deutsche Wendung „um jemanden weinen“ angemessen das Trauern, ohne zusätzliche rituelle Einzelheiten einzutragen.
- source_word: ብካየ፡ ዐቢየ (bəkāya ʿabiya)
  choice: weinten sehr
  rationale: Gibt die semitische Verbindung aus Verb und verwandtem Substantiv („ein großes Weinen weinen“) in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Art des im Haus gehörten Lautes
  choice: neutral als „Laut“ wiedergegeben
  alternative: „Klagegeschrei“ oder „Stimme“
  rationale: Der geʿezische Ausdruck benennt den Laut nicht näher. Die Übersetzung bewahrt diese echte Unbestimmtheit.
- issue: Trauernde Angehörige des Hauses Abrahams
  choice: „alle Angehörigen des Hauses Abrahams“
  alternative: wörtlich „das ganze Haus Abrahams“
  rationale: Gemeint sind hier offenkundig die zum Haushalt gehörenden Menschen; „Angehörige“ macht dies im Deutschen verständlich, ohne eine konfessionelle oder lehrhafte Deutung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die geʿezische Satzfolge. Die Wiederholung von „Abraham“ und „Vater“ bleibt weitgehend erhalten, während der abschließende Intensivierungsausdruck idiomatisch wiedergegeben wird.
