review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Abfolge und die wesentlichen Aussagen des geʿezischen Textes zutreffend wieder: ein unbestimmter Laut wird im Haus Abrahams gehört; Ismael steht auf, geht zu Abraham und trauert mit dem ganzen Haus Abrahams. Die Wiedergabe „Angehörigen“ legt jedoch den Ausdruck „das ganze Haus Abrahams“ unnötig enger aus. Außerdem ist „Er und alle Angehörigen ... weinten um seinen Vater Abraham“ wegen des Possessivpronomens und der Stellung der Satzglieder missverständlich.'
  naturalness: Modernes Standarddeutsch ist grundsätzlich erreicht. Eine explizite Zuordnung von „seinen Vater“ zu Ismael und die Beibehaltung von „das ganze Haus Abrahams“ machen den Satz klarer und zugleich quellennäher.
  terminology: „Laut“ bewahrt die Unbestimmtheit von ቃል angemessen. „um ... weinen“ ist für die Trauerhandlung passend. „Das ganze Haus Abrahams“ ist als haushaltsbezogene, bewusst nicht weiter spezifizierte Formulierung dem Ausgangstext vorzuziehen.
  issues:
  - severity: medium
    issue: „alle Angehörigen des Hauses Abrahams“ statt „das ganze Haus Abrahams“
    rationale: Der geʿezische Text sagt wörtlich „das ganze Haus Abrahams“. „Angehörige“ ist eine plausible, aber enger interpretierende Auslegung und sollte nicht anstelle der offenen Haushaltsbezeichnung stehen.
  - severity: medium
    issue: Mehrdeutige Zuordnung in „weinten um seinen Vater Abraham“
    rationale: Das Pronomen „seinen“ ist zwar wahrscheinlich auf Ismael zu beziehen, steht aber nach einem zusammengesetzten Subjekt mit „alle Angehörigen“. Die Quelle bezeichnet Abraham ausdrücklich als Ismaels Vater; dies sollte im Deutschen klar an Ismael gebunden werden.
  revised_text: Und im Haus Abrahams war ein Laut zu hören. Da stand sein Sohn Ismael auf und ging zu Abraham, seinem Vater. Ismael weinte um Abraham, seinen Vater, zusammen mit dem ganzen Haus Abrahams; sie weinten sehr.
