base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/024.yaml
  text: And he will stir up against them the sinners of the nations, who have no mercy or compassion for them, and who show no favor to old or young, to no one at all; for they are evil and strong, so as to do evil more than all the sons of men.
translation:
  language: de
  text: Und er wird gegen sie die Sünder der Völker aufstacheln. Sie haben gegen sie weder Erbarmen noch Mitgefühl und begünstigen weder Alte noch Junge, ja überhaupt niemanden; denn sie sind böse und stark, so dass sie mehr Böses tun als alle Menschenkinder.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ያነቅህ
  choice: wird … aufstacheln
  rationale: Das Verb bezeichnet das Erwecken beziehungsweise Aufreizen gegen jemanden; „aufstacheln“ gibt den feindseligen Zusammenhang natürlich wieder.
- source_word: ኃጥአኒሆሙ፡ ለአሕዛብ
  choice: die Sünder unter den Völkern
  rationale: Bewahrt die substantivische Bezeichnung „Sünder“ und versteht den Genitiv als Zugehörigkeit zu den Völkern.
- source_word: ምሕረተ፡ ወሣህለ
  choice: Erbarmen noch Mitgefühl
  rationale: Das Wortpaar bezeichnet barmherzige Schonung und mitfühlende Güte; die beiden deutschen Begriffe erhalten die rhetorische Paarung.
- source_word: ኢያደልዉ፡ አሰልሂቅ
  choice: nehmen … keine Rücksicht
  rationale: Im Kontext geht es um fehlende Begünstigung oder Schonung ohne Ansehen der Person; die idiomatische deutsche Wendung vermeidet eine missverständliche positive Bedeutung von „Gunst erweisen“.
- source_word: ለወሬዛ
  choice: auf Junge
  rationale: Bezeichnet den jungen Menschen beziehungsweise Jüngling und bildet den Gegensatz zu den Alten.
- source_word: ውሉደ፡ ሰብእ
  choice: Menschenkinder
  rationale: Gibt die traditionelle, wörtlich geprägte Wendung „Söhne/Kinder der Menschen“ würdevoll und verständlich wieder.
theological_decisions:
- issue: Subjekt von „wird aufstacheln“
  choice: Das männliche Singularpronomen bleibt als „er“ stehen.
  alternative: Das Subjekt durch eine konkrete göttliche oder menschliche Identität ersetzen.
  rationale: Der Vers selbst nennt das Bezugswort nicht; eine Identifizierung würde die vom Kontext abhängige Referenz unzulässig festlegen.
- issue: Vergleich ihrer Bosheit
  choice: „tun mehr Böses als alle Menschenkinder“
  alternative: „um schlimmer als alle Menschenkinder zu handeln“
  rationale: Die Formulierung bewahrt sowohl ihre moralische Charakterisierung als auch den steigernden Vergleich, ohne einen besonderen theologischen Sinn hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Die Wiederholung „auf niemanden … auf überhaupt niemanden“ erhält die emphatische Totalität des Ausgangstextes; keine konfessionelle Deutung wurde ergänzt.
