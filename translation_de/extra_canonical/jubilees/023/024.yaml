    issue: Genitivische Gruppenbezeichnung abgeschwächt
    rationale: „die Sünder unter den Völkern“ kann lediglich eine Teilgruppe innerhalb der Völker bezeichnen. Der Ausgangstext und die englische Kontrollübersetzung sprechen von den „Sündern der Völker“.
  - severity: medium
    issue: Unnatürliche und redundant verschachtelte Negationsreihe
    rationale: „auf niemanden ... weder auf Alte noch auf Junge, auf überhaupt niemanden“ ist im Deutschen stilistisch holprig. Die emphatische Totalität lässt sich ohne Bedeutungsverlust klarer ausdrücken.
  - severity: low
    issue: Finale/resultative Nuance nicht ausdrücklich markiert
    rationale: Die Konstruktion vor dem Infinitiv beschreibt, wozu ihre Bosheit und Stärke führen bzw. befähigen. „so dass sie ... tun“ erhält diese Verknüpfung besser als eine bloße Reihung mit „und“.
  revised_text: Und er wird gegen sie die Sünder der Völker aufstacheln. Sie haben gegen sie weder Erbarmen noch Mitgefühl und begünstigen weder Alte noch Junge, ja überhaupt niemanden; denn sie sind böse und stark, so dass sie mehr Böses tun als alle Menschenkinder.
