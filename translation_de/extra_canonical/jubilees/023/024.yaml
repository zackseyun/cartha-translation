  verdict: revise
  source_fidelity: Die Grundstruktur und die zentralen Begriffe werden zutreffend wiedergegeben. „unter den Völkern“ schwächt jedoch die genitivische Zugehörigkeit in „Sünder der Völker“ ab. Außerdem sollte die abschließende Wendung den im Ausgangstext ausgedrückten Zweck bzw. das Ergebnis („so dass/um ... zu“) bewahren.
  naturalness: Der Entwurf ist überwiegend modernes, würdiges Deutsch. Die Abfolge „auf niemanden Rücksicht, weder auf Alte noch auf Junge, auf überhaupt niemanden“ ist jedoch unnötig schwerfällig und wiederholt die Totalisierung unidiomatisch. Eine klarere Reihung mit „weder ... noch ..., ja überhaupt niemanden“ ist natürlicher.
  terminology: „Erbarmen“ und „Mitgefühl“ geben das Begriffspaar angemessen wieder. „Menschenkinder“ ist als gehobene, verständliche Wiedergabe von „Söhne/Kinder der Menschen“ vertretbar. „Begünstigen“ bildet hier das fehlende Erweisen von Gunst genauer ab als „Rücksicht nehmen“.
