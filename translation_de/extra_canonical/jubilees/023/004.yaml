  yaml_path: translation/extra_canonical/jubilees/023/004.yaml
  text: And he rose from his bosom and ran and told Rebekah his mother. And Rebekah went by night to Isaac and told him, and they went together, and Jacob also with them, and a torch was in his hand; and when they had gone, they found Abraham lying dead.
translation:
  language: de
  text: Da erhob er sich aus Abrahams Schoß[a], lief zu seiner Mutter Rebekka und berichtete ihr davon. Noch in der Nacht ging Rebekka zu Isaak und berichtete es ihm. Dann gingen sie gemeinsam hin, und auch Jakob ging mit ihnen; eine Fackel hielt er in seiner Hand.[b] Als sie dort eintrafen, fanden sie Abraham tot daliegen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus seinem Schoß“; gemeint ist Abraham, in dessen Schoß Jakob geschlafen hatte.'
    reason: Die explizite Nennung Abrahams im Haupttext verhindert einen im Deutschen naheliegenden reflexiven Fehlbezug und wahrt zugleich das konkrete Bild des Grundtexts.
  - marker: b
    text: Der Grundtext hat „eine Fackel“ und „in seiner Hand“ im Singular; wahrscheinlich ist Jakob gemeint.
    reason: Die Einzahl ist textlich wichtig; der Bezug des männlichen Singulars wird im Grundtext nicht ausdrücklich durch einen Namen festgelegt.
lexical_decisions:
- source_word: እምሕፅኑ
  choice: von seiner Brust
  rationale: Die Wendung bezeichnet wörtlich das Aufstehen „von seiner Brust/seinem Schoß“ und knüpft an die vorausgehende Szene an, in der Jakob bei Abraham schlief. „Bett“ wäre zwar idiomatischer, würde aber das konkrete Bild und den Erzählzusammenhang verwischen.
- source_word: ሌሊተ
  choice: noch in der Nacht
  rationale: Gibt die nächtliche Zeitangabe natürlich wieder und wahrt zugleich die Dringlichkeit des Geschehens.
- source_word: ማኅቶት
  choice: Fackel
  rationale: Bezeichnet hier ein tragbares Licht für den nächtlichen Weg; „Fackel“ ist im Deutschen anschaulich und kontextgerecht.
- source_word: በድኖ
  choice: tot
  rationale: Das Wort bezeichnet hier einen Leichnam beziehungsweise den Zustand des Totseins; „tot daliegen“ gibt die Aussage im Deutschen knapp und eindeutig wieder.
theological_decisions:
- issue: Bezug des Singularpronomens bei der Fackel
  choice: „eine Fackel hielt er in seiner Hand“
  alternative: „sie hielten Fackeln in ihren Händen“
  rationale: Der ge’ezische Text hat sowohl „Fackel“ als auch den possessiven Bezug im Singular. Die singularische Form wird daher beibehalten; wer genau gemeint ist, wird nicht dogmatisch festgelegt, auch wenn der unmittelbar zuvor genannte Jakob naheliegt.
- issue: Darstellung von Abrahams Tod
  choice: „fanden sie Abraham tot daliegen“
  alternative: „fanden sie den Leichnam Abrahams“
  rationale: Die gewählte Form wahrt die narrative Spannung und folgt der prädikativen Struktur, ohne über den Quelltext hinauszugehen.
translation_notes:
  register: Moderne, würdige Erzählsprache mit klaren Hauptsätzen. Die Wiederholung von „berichtete“ entspricht dem parallelen Handlungsablauf. Ungewöhnliche, aber quellennah erhaltene Bilder werden durch knappe Fußnoten erläutert.
