  text: And they will commit violence in Israel and sin against Jacob, and much blood will be poured out on the earth, and there will be none to gather and none to bury.
translation:
  language: de
  text: Sie werden in Israel Gewalt verüben und sich an Jakob versündigen[a]. Viel Blut wird auf der Erde vergossen werden, und niemand wird da sein, der sammelt, und niemand, der begräbt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf/über Jakob“; dem Sinn nach auch: „gegen Jakob sündigen“.'
    reason: Die Fußnote macht die Grundbedeutung und die kontextuelle gegen Jakob gerichtete Nuance von ዲበ sichtbar.
lexical_decisions:
- source_word: ሀከከ (ḥakaka)
  choice: Gewalt
  rationale: Das Substantiv bezeichnet hier gewaltsames bzw. bedrückendes Unrecht. „Gewalt verüben“ ist im modernen Deutschen natürlich und gibt den Ernst des Ausdrucks wieder.
- source_word: ዲበ፡ ያዕቆብ፡ ዐበሳ (diba Yaʿqob ʿabasa)
  choice: sich an Jakob versündigen
  rationale: ዲበ hat die Grundbedeutung „auf/über“, kann in dieser Verbindung aber eine gegen jemanden gerichtete Handlung ausdrücken. „Sich an Jakob versündigen“ wahrt diesen Bezug und klingt idiomatisch.
- source_word: ይትከዐው፡ ደም፡ ብዙኅ
  choice: Viel Blut wird … vergossen werden
  rationale: Die geläufige deutsche Wendung entspricht dem passivischen Ausdruck des geʿezischen Textes und bewahrt die Mengenangabe.
- source_word: ዘያስተጋብእ
  choice: der … zusammenholt
  rationale: Das Verb bezeichnet Sammeln bzw. Zusammenbringen. Im Kontext des unbestatteten Blutvergießens ist das Zusammenholen der Erschlagenen gemeint.
- source_word: ዘይቀብር
  choice: der sie begräbt
  rationale: Direkte Wiedergabe des Verbs „begraben/bestatten“; das Pronomen nimmt die im Zusammenhang erschlossenen Erschlagenen auf.
theological_decisions:
- issue: Verhältnis der Sünde zu „Jakob“
  choice: sich an Jakob versündigen
  alternative: in Jakob sündigen
  rationale: Der Quelltext wechselt von ውስተ („in“) bei Israel zu ዲበ („auf/über“, kontextuell „gegen“) bei Jakob. Die Übersetzung bildet diesen Wechsel ab, ohne Israel und Jakob theologisch voneinander zu trennen.
- issue: Ungenanntes Objekt von „zusammenholen“ und „begraben“
  choice: die Erschlagenen
  alternative: 'elliptisch: „der zusammenholt … der begräbt“'
  rationale: Der geʿezische Text nennt das Objekt nicht ausdrücklich. Im Deutschen wäre die Ellipse schwer verständlich; aus Blutvergießen und fehlender Bestattung ergibt sich als naheliegender Bezug die Getöteten. Die Ergänzung wird durch eine Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die Wiederholung „niemand … und niemand“ bewahrt den nachdrücklichen Parallelismus der Vorlage; sachlich notwendige Ergänzungen und die Präpositionsnuance werden in Fußnoten offengelegt.
