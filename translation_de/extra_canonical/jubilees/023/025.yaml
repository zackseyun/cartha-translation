  source_fidelity: 'Die Übersetzung gibt die Abfolge und die wesentlichen Aussagen des geʿezischen Textes zutreffend wieder: Gewalt geschieht „in Israel“, die Sünde richtet sich mit der Präposition ዲበ gegen/auf Jakob, viel Blut wird auf die Erde ausgegossen, und es fehlt an Menschen zum Sammeln und Begraben. Die ausdrückliche Ergänzung „die Erschlagenen“ geht jedoch über die im Ausgangstext offene Ellipse hinaus.'
