base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/017.yaml
  text: And in that generation children will reproach their fathers and their elders because of sin and because of injustice and because of the speech of their mouth and because of the great evils that they commit, and because they have forsaken the covenant that the LORD made between them and himself, that they should keep and do all his commandments and his ordinances and all his law, without turning aside to the right hand or to the left.
translation:
  language: de
  text: Und in jener Generation werden Kinder[a] ihren Vätern und ihren Ältesten Vorwürfe machen wegen der Sünde und wegen des Unrechts und wegen der Worte aus ihrem Mund und wegen der großen Übeltaten, die sie begehen, und weil sie den Bund verlassen haben, den der HERR zwischen ihnen und sich geschlossen hat, damit sie alle seine Gebote, seine Ordnungen und sein ganzes Gesetz halten und tun, ohne nach rechts oder links abzuweichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Söhne“.'
    reason: ደቂቅ kann je nach Kontext Kinder oder Söhne bezeichnen.
lexical_decisions:
- source_word: ደቂቅ
  choice: Kinder
  rationale: Das ge'ezische Wort bezeichnet allgemein Kinder bzw. Nachkommen; „Kinder“ gibt den Gegensatz zu Vätern und Ältesten natürlich wieder, ohne das Geschlecht unnötig festzulegen.
- source_word: ይዘልፉ
  choice: Vorwürfe machen
  rationale: Das Verb bezeichnet hier das Tadeln oder Schmähen; „Vorwürfe machen“ ist im Kontext verständlich und bewahrt die gegen die ältere Generation gerichtete Anklage.
- source_word: ዐመፃ
  choice: Unrecht
  rationale: Die Bedeutung umfasst Unrecht, Gesetzlosigkeit oder Auflehnung. „Unrecht“ hält die Formulierung offen und passt zur parallelen Nennung der Sünde.
- source_word: ሥርዐተ
  choice: Bund / Ordnungen
  rationale: Das Wort kann je nach Zusammenhang Ordnung, Satzung oder festgesetzte Regelung bezeichnen. Beim von Gott zwischen den Parteien Gestifteten ist „Bund“ kontextuell angemessen; in der Gebotsreihe wird es mit „Ordnungen“ wiedergegeben.
- source_word: ተኃኅቶ፡ የማነ፡ ወፀጋመ
  choice: ohne nach rechts oder links abzuweichen
  rationale: Die feste Richtungsformel wird idiomatisch und zugleich bildgetreu wiedergegeben.
theological_decisions:
- issue: Bezeichnung der göttlich gestifteten Beziehung als Bund
  choice: den Bund ... geschlossen hat
  alternative: die Ordnung ... festgesetzt hat
  rationale: Obwohl ሥርዐት wörtlich eher Ordnung oder Satzung ausdrücken kann, versteht die überlieferte Fassung die zwischen Gott und dem Volk gestiftete Verpflichtung als Bund. „Bund“ wahrt den relationalen und verpflichtenden Sinn, ohne eine Konfessionslehre einzutragen.
- issue: Bezug des Tadels
  choice: Die Kinder machen Vätern und Ältesten wegen deren Vergehen Vorwürfe
  alternative: Die Kinder schmähen ihre Väter und Ältesten und begehen dabei selbst die genannten Sünden
  rationale: Syntax und parallele Begründungen sprechen dafür, die Vergehen auf die ältere Generation zu beziehen. Die gewisse Anschlussambiguität wird nicht durch zusätzliche erklärende Subjekte überdeckt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die lange, anaphorische Satzstruktur und die wiederholten Begründungen des Ausgangstextes bleiben weitgehend erhalten; sperrige Nominalformulierungen werden nur soweit geglättet, wie es für gewöhnliche heutige Leser nötig ist.
