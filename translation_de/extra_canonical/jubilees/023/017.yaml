    issue: Unidiomatische Wendung „wegen der Worte ihres Mundes“
    rationale: Die Wendung ist verständlich, klingt aber im modernen Standarddeutsch hölzern. „wegen der Worte aus ihrem Mund“ gibt die Wendung natürlicher wieder, ohne den Sinn oder die Anschlussambiguität zu verändern.
