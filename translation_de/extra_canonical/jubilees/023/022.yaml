  text: ወእለ፡ ድኅኑ፡ በፍኖተ፡ ጽድቅ፡ ኢይትመየጡ፡ እምነ፡ *እከዮሙ፡ እስመ፡* ኵሎሙ፡ ለትዕግልት፡ ወውስተ፡ ብዕል፡ ይትነሥኡ፡ ከመ፡ ይንሣኡ፡ *አሐዱ፡ ኵሎ፡ ዘቢጹ፡* ወስመ፡ ዐቢየ፡ ይሰምዩ፡ ወአኮ፡ በሀልወ፡ ወአኮ፡ በጽድቅ፡ *ወቅድስተ፡ ቅዱሳን፡* ያረኵሱ፡ *በርኵሶሙ፡ ወበሙስና፡ ግማኔሆሙ።*
