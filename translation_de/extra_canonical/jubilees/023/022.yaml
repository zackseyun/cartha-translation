base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/022.yaml
  text: And those who have escaped will not turn from their wickedness to the way of righteousness, because all of them will rise up for deceit and wealth, each to seize all that belongs to his neighbor; and they will make a great name for themselves, but not in truth and not in righteousness; and they will profane the holy of holies with their uncleanness and with the corruption of their defilement.
translation:
  language: de
  text: Und die, die entkommen sind, werden sich nicht von ihrer Bosheit abwenden und den Weg der Gerechtigkeit einschlagen; denn sie alle werden sich zu Betrug und Reichtum erheben, jeder, um alles an sich zu reißen, was seinem Nächsten gehört. Sie werden sich einen großen Namen machen, doch nicht in Wahrheit und nicht in Gerechtigkeit; und das Allerheiligste werden sie durch ihre Unreinheit und durch die Verderbtheit ihrer Befleckung entweihen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ድኅኑ
  choice: die, die entkommen sind
  rationale: Gibt das Partizip im Kontext einer entronnenen bzw. übrig gebliebenen Gruppe wieder, ohne eine theologisch stärker aufgeladene Deutung als »Gerettete« festzulegen.
- source_word: ፍኖተ፡ ጽድቅ
  choice: den Weg der Gerechtigkeit
  rationale: Bewahrt die konkrete Wegmetapher und die ethisch-religiöse Bedeutung von »Gerechtigkeit«.
- source_word: ብዕል
  choice: Reichtum
  rationale: Die Lesung bezeichnet Besitz bzw. Wohlstand; »Reichtum« passt zum anschließenden gewaltsamen Aneignen fremden Eigentums.
- source_word: ይንሣኡ
  choice: an sich zu reißen
  rationale: Drückt das aktive, eigennützige Ergreifen im Kontext von Betrug und fremdem Besitz natürlich aus.
- source_word: ወስመ፡ ዐቢየ፡ ይሰምዩ
  choice: Sie werden sich einen großen Namen machen
  rationale: Gibt die idiomatische Aussage von erworbenem Ansehen wieder und bewahrt zugleich ihre negative Einbettung.
- source_word: ቅድስተ፡ ቅዱሳን
  choice: das Allerheiligste
  rationale: Die wörtliche semitische Steigerungsform »Heiliges der Heiligen« wird im Deutschen konventionell und verständlich als »Allerheiligstes« wiedergegeben.
- source_word: ያረኵሱ
  choice: entweihen
  rationale: Trifft die kultische Bedeutung, etwas Heiliges unrein zu machen bzw. zu profanieren.
theological_decisions:
- issue: Bedeutung der entkommenen Gruppe
  choice: die, die entkommen sind
  alternative: die Geretteten / die Übriggebliebenen
  rationale: Die neutrale Formulierung hält offen, ob bloßes Entrinnen, ein Überrest oder Heil im theologischen Sinn gemeint ist.
- issue: Bezeichnung des Heiligtums
  choice: das Allerheiligste
  alternative: das Heilige der Heiligen / heilige Dinge der Heiligen
  rationale: Die feste kultische Wendung ist am wahrscheinlichsten; die deutsche Standardbezeichnung wahrt den sakralen Bezug, ohne ein bestimmtes Heiligtum zusätzlich zu identifizieren.
- issue: Verhältnis von Unreinheit und Verderbtheit
  choice: durch ihre Unreinheit und durch die Verderbtheit ihrer Befleckung
  alternative: durch ihre Unreinheit und die Verderbnis ihrer Verunreinigung
  rationale: Die parallelen, teilweise überlappenden Unreinheitsbegriffe bleiben stehen, statt zu einer einzigen moralischen Kategorie zusammengezogen zu werden.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter Wegmetapher und kultischer Terminologie. Der Satzbau wurde zur Lesbarkeit gegliedert, während die anaphorische und steigernde Struktur des Ausgangstextes erhalten bleibt.
