  text: And all this will come upon an evil generation which sins on the earth; their deeds are uncleanness and fornication and impurity and abomination.
translation:
  language: de
  text: Und all dies wird über eine böse Generation kommen, die auf der Erde sündigt; ihre Taten sind Unreinheit, Unzucht, Befleckung und Abscheulichkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኵሉ፡ ዝንቱ
  choice: Und all dies
  rationale: Gibt die umfassende Rückverweisung des Ausdrucks knapp und natürlich wieder.
- source_word: ይመጽእ፡ በትውልድ፡ እኪት
  choice: wird über eine böse Generation kommen
  rationale: Bewahrt die Zukunftsaussage und versteht die Präposition idiomatisch als das Eintreffen von angekündigtem Unheil über eine Generation.
- source_word: እንተ፡ ትኤብስ፡ በምድር
  choice: die auf der Erde sündigt
  rationale: Gibt ትኤብስ als »sündigt« und በምድር als Ortsangabe wieder, ohne die Wendung fälschlich zu »die Erde verunreinigt« umzudeuten.
- source_word: ርኵስ
  choice: Unreinheit
  rationale: Entspricht dem Bereich ritueller oder sittlicher Unreinheit und erhält die Unterscheidung vom folgenden Ausdruck.
- source_word: ዝሙት
  choice: Unzucht
  rationale: Traditionelle, im heutigen Bibeldeutsch weiterhin verständliche Wiedergabe sexueller Unsittlichkeit.
- source_word: ገማኔ
  choice: Befleckung
  rationale: Wahrt neben »Unreinheit« einen eigenständigen Ausdruck für Verunreinigung, ohne beide Begriffe zusammenfallen zu lassen.
- source_word: ሳቀራር
  choice: Abscheulichkeit
  rationale: Gibt den stark wertenden Begriff als verabscheuungswürdiges Verhalten wieder.
- source_word: ገብርሙ
  choice: ihre Taten sind
  rationale: Bezieht »ihre Taten« grammatisch auf die gesamte folgende beziehungsweise prädikative Aufzählung und nicht nur auf deren letztes Glied.
theological_decisions:
- issue: Verhältnis der sündigenden Generation zur Erde und zur Lasterliste
  choice: 'Zwei Klauseln: Die Generation sündigt auf der Erde; ihre Taten werden anschließend aufgezählt.'
  alternative: Die Generation verunreinigt die Erde durch die genannten Taten.
  rationale: Die ge'ezische Syntax enthält das Verb »sündigen«, die Ortsangabe »auf der Erde« und gesondert »ihre Taten«; eine kausale Aussage über die Verunreinigung der Erde würde diese Struktur und Bedeutung verändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die viergliedrige Lasterliste bleibt vollständig erhalten; »Unreinheit« und »Befleckung« markieren die lexikalische Unterscheidung zweier benachbarter Begriffe.
