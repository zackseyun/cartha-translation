  yaml_path: translation/extra_canonical/jubilees/023/030.yaml
  text: And then the LORD will heal his servants, and they will rise up and see great peace, and they will drive out their enemies; and the righteous will see and give thanks and rejoice forever and ever with joy.
translation:
  language: de
  text: Und dann wird der HERR seine Diener heilen. Sie werden sich erheben und großen Frieden sehen, und sie werden ihre Feinde vertreiben; die Gerechten werden sehen, Dank sagen und sich voller Freude für immer und ewig freuen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወ'እማን
  choice: Und dann
  rationale: Gibt die eröffnende zeitlich-fortführende Verknüpfung knapp und natürlich wieder, ohne die stärkere Auslegung „zu jener Zeit“ einzutragen.
- source_word: ይፈውሶ
  choice: wird … heilen
  rationale: Entspricht dem Heilungsverb und bewahrt die futurische Aussage des Zusammenhangs.
- source_word: ለገብርቲሁ
  choice: seine Diener
  rationale: Gibt den Plural mit Possessivsuffix direkt wieder.
- source_word: ሰላመ፡ ዐቢየ
  choice: großen Frieden
  rationale: Formale und im Deutschen natürliche Entsprechung von „Frieden“ mit dem Attribut „groß“.
- source_word: ወይሰድዱ፡ ጸላእቶሙ
  choice: und sie werden ihre Feinde vertreiben
  rationale: Bewahrt Handlung, Zukunftsbezug und das possessive Verhältnis.
- source_word: ወያአኵቱ
  choice: Dank sagen
  rationale: Gibt das Verb des Dankens/Lobpreisens zurückhaltend wieder, ohne einen engeren kultischen Sinn festzulegen.
- source_word: እስከ፡ ለዓለመ፡ ዓለም
  choice: für immer und ewig
  rationale: Natürliche, würdige deutsche Wiedergabe der verstärkten Ewigkeitsformel.
- source_word: በፍሥሐ
  choice: in Freude
  rationale: Erhält das abschließende Substantiv ausdrücklich, auch wenn dadurch die Wiederholung mit „sich freuen“ stehen bleibt.
theological_decisions:
- issue: Bezug von „die Gerechten werden sehen“
  choice: „die Gerechten werden es sehen“ ohne nähere Bestimmung des Gesehenen
  alternative: „die Gerechten werden [dies] sehen“ oder Wiederholung eines bestimmten Gegenstands
  rationale: Der Ausgangstext nennt an dieser Stelle kein ausdrückliches Objekt. Das neutrale „es“ macht den deutschen Satz vollständig, ohne Frieden, Heilung oder Vertreibung als alleinigen Bezug festzulegen.
- issue: Bedeutungsbreite des Dankverbs
  choice: „Dank sagen“
  alternative: „preisen“
  rationale: „Dank sagen“ bewahrt die im konsultierten Text bezeugte Bedeutung und vermeidet eine unnötige kultisch-theologische Verengung.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählton. Die parataktische Satzbewegung des ge’ezischen Textes bleibt weitgehend erhalten; das Semikolon gliedert den abschließenden Wechsel zu den Gerechten. Die auffällige Verbindung „sich in Freude freuen“ ist bewusst beibehalten, weil der Ausgangstext sowohl das Verb des Sichfreuens als auch das abschließende Substantiv „Freude“ enthält.
