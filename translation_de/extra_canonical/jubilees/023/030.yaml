  source_fidelity: 'Der Entwurf gibt die Abfolge des geʿezischen Textes insgesamt zuverlässig wieder: Heilung der Diener, ihr Erheben, das Sehen großen Friedens, das Vertreiben der Feinde sowie Sehen, Danksagen und bleibende Freude der Gerechten. Das ausdrücklich ergänzte „es“ nach „die Gerechten werden“ legt jedoch im Deutschen einen bestimmten, nicht im Wortlaut genannten Gegenstand des Sehens nahe. Der Text lässt das Objekt offen.'
  naturalness: „Sich in Freude freuen“ ist zwar verständlich, wirkt im modernen Standarddeutsch jedoch unnötig schwerfällig. „Sich voller Freude freuen“ bewahrt die ausdrückliche Schlussbestimmung und ist idiomatischer.
  terminology: „HERR“ ist als Wiedergabe des Gottesnamens in diesem Register angemessen. „Diener“, „Gerechte“, „großen Frieden“ und „Dank sagen“ sind sachgerecht und ohne konfessionelle Einengung formuliert.
