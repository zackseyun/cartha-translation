  text: And a great punishment will come upon the works of that generation from the LORD, and he will give them over to slaughter and judgment and captivity and plundering and destruction.
translation:
  language: de
  text: Und eine große Strafe wird vom HERRN über die Werke jener Generation kommen, und er wird sie dem Gemetzel, dem Gericht, der Gefangenschaft, der Plünderung und der Vernichtung preisgeben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መቅሠፍት፡ ዐቢይ
  choice: eine große Strafe
  rationale: Gibt die Straf- bzw. Heimsuchungsbedeutung der Wendung klar und würdig wieder.
- source_word: ግብረ
  choice: Werke
  rationale: Entspricht der Grundbedeutung „Werk, Tun“ und hält den Bezug auf das Handeln der Generation offen.
- source_word: መጥባሕት
  choice: Gemetzel
  rationale: Bezeichnet hier eher Schlachtung bzw. gewaltsames Töten als das Instrument „Schwert“.
- source_word: ኵነኔ
  choice: Gericht
  rationale: Bewahrt die gerichtliche Bedeutung, ohne sie enger als „Verurteilung“ festzulegen.
- source_word: ፂዋዌ
  choice: Gefangenschaft
  rationale: Gibt das Schicksal des Gefangenwerdens bzw. der Verschleppung natürlich wieder.
- source_word: ሀደድ
  choice: Plünderung
  rationale: Bezeichnet das Ausrauben oder Plündern als auferlegtes Unheil.
- source_word: ብልዐት
  choice: Vernichtung
  rationale: Die wörtliche Vorstellung des Verzehrens bezeichnet im Kontext zerstörerischen Untergang; „Vernichtung“ ist im Deutschen natürlich und sachgerecht.
theological_decisions:
- issue: Göttlicher Ursprung und göttliche Übergabe
  choice: „vom HERRN … und er wird sie … preisgeben“
  alternative: „durch den Herrn … und er wird sie übergeben“
  rationale: Bewahrt sowohl den ausdrücklich göttlichen Ursprung der Strafe als auch Gottes aktive Übergabe, ohne die Spannung abzuschwächen.
- issue: Gottesbezeichnung እግዚአብሔር
  choice: HERR
  alternative: Herr
  rationale: Folgt der etablierten bibeldeutschen Wiedergabe der Gottesbezeichnung und passt zum vorliegenden Kontext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. Die Reihung der fünf Unheilsbegriffe bleibt erhalten; genuine Bedeutungsbreiten werden nicht konfessionell eingeengt.
