  to: 'Denn Schlag auf Schlag, Wunde auf Wunde, Not auf Not, böse Nachricht auf böse Nachricht und Krankheit auf Krankheit; und alles derartige Böse, eines mit dem anderen: Seuche und Zusammenbruch, Frost und Hagel, Schnee und Fieber, Schüttelfrost und Erstarrung, Hungersnot und Tod, Schwert und Gefangenschaft und jede Bedrängnis und Krankheit.'
