  yaml_path: translation/extra_canonical/jubilees/023/014.yaml
  text: 'For blow upon blow, and wound upon wound, and distress upon distress, and evil report upon evil report, and sickness upon sickness, and every evil like these, one with another: disease and collapse and frost and hail and snow and fever and chills and stupor and famine and death and sword and captivity and every affliction and sickness.'
translation:
  language: de
  text: 'Denn Schlag auf Schlag, Wunde auf Wunde, Not auf Not, böse Nachricht auf böse Nachricht und Krankheit auf Krankheit; und alles derartige Böse, eines mit dem anderen: Seuche und Zusammenbruch, Frost und Hagel, Schnee und Fieber, Schüttelfrost und Erstarrung, Hungersnot und Tod, Schwert und Gefangenschaft und jede Bedrängnis und Krankheit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መቅሠፍት
  choice: Schlag / Bedrängnis
  rationale: Das Wort bezeichnet eine Heimsuchung, Plage oder einen Schlag. Im einleitenden Parallelismus ist „Schlag“ natürlich und prägnant; am Ende vermeidet „Bedrängnis“ eine missverständliche Wiederholung.
- source_word: ቍስላን
  choice: Wunde
  rationale: Gibt die konkrete körperliche Verletzung im gestuften Parallelismus wieder.
- source_word: ምንዳቤ
  choice: Not
  rationale: Deckt Bedrängnis, Elend oder Drangsal in verständlichem modernem Deutsch ab.
- source_word: ስምዐት እኩይ
  choice: böse Nachricht
  rationale: Wörtlich eine böse bzw. schlimme Kunde; „böse Nachricht“ bewahrt den Inhalt ohne unnötige Auslegung.
- source_word: ደዌ / ሕማም
  choice: Krankheit
  rationale: Beide Wörter gehören zum Bedeutungsfeld Krankheit/Leiden. Die Wiederholung entspricht dem katalogartigen Charakter der Quelle.
- source_word: ጕፍጥአት
  choice: Zusammenbruch
  rationale: Folgt der quellenkritisch gestützten Wiedergabe als Kollaps oder Zusammenbruch.
- source_word: አስሕትያ
  choice: Frost
  rationale: Bezeichnet eine Kälte- oder Frosterscheinung und steht in einer Reihe von Wetter- und Krankheitsnöten.
- source_word: በረድ
  choice: Hagel
  rationale: Die gewöhnliche und kontextuell klare Bedeutung ist Hagel.
- source_word: ሐመዳ
  choice: Schnee
  rationale: Die revidierte Quellenanalyse stützt „Schnee“ als eigenständigen Listenpunkt.
- source_word: ስክሕካሕ
  choice: Schüttelfrost
  rationale: Gibt heftiges Frösteln bzw. Kältezittern idiomatisch wieder.
- source_word: ሰምዛዝ
  choice: Erstarrung
  rationale: Das seltene Wort bezeichnet einen benommenen oder starren Zustand; „Erstarrung“ lässt die genaue medizinische Art offen.
- source_word: ዐባር
  choice: Hungersnot
  rationale: Bezeichnet Hunger bzw. eine Hungersnot als öffentliche Katastrophe.
- source_word: መጥባሕት
  choice: Schwert
  rationale: Im Katastrophenkatalog steht das Wort metonymisch für Tod bzw. Gewalt durch das Schwert.
- source_word: ፂዋዌ
  choice: Gefangenschaft
  rationale: Gibt Wegführung, Gefangennahme oder Gefangenschaft angemessen wieder.
theological_decisions: []
translation_notes:
  register: Dignifiziertes, gut verständliches Standarddeutsch. Der anaphorische Aufbau „X auf X“ und die Häufung der Nöte wurden bewahrt. Die Wendung ዝንቱ ምስለ ዝንቱ wird ausdrücklich als „eines zusammen mit dem anderen“ wiedergegeben, ohne die Liste harmonisierend zu kürzen.
