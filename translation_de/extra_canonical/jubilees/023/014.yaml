    rationale: „all solches Unheil“ kann im Deutschen zwar auf Vorhergehendes zurückweisen, bringt aber nicht so klar zum Ausdruck, dass die folgende Reihe als Übel „wie diese“ bzw. „dieser Art“ bezeichnet wird.
  - severity: low
    issue: Ein nicht im Ausgangstext stehendes Verb wird ergänzt.
    rationale: „Schlag kommt auf Schlag“ ist verständlich, doch die Quelle bietet eine verdichtete nominale Reihung. „Schlag auf Schlag“ bewahrt diese Form und klingt im Deutschen natürlich.
