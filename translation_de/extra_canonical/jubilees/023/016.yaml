  yaml_path: translation/extra_canonical/jubilees/023/016.yaml
  text: Then they will say, “The days of the former ones were many, up to a thousand years, and good; but behold, the days of our life, when a man has lived long, are seventy years, and if he is strong, eighty years, and they are evil, and there is no peace in the days of this evil generation.”
translation:
  language: de
  text: 'Dann werden sie sagen: »Die Tage der Früheren waren zahlreich – bis zu tausend Jahre – und gut. Doch siehe: Die Tage unseres Lebens betragen, wenn ein Mensch lange lebt, siebzig Jahre, und wenn er kräftig ist, achtzig Jahre. Und sie sind böse, und es gibt keinen Frieden in den Tagen dieser bösen Generation.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቀደምት
  choice: die Früheren
  rationale: Das substantivierte Adjektiv bezeichnet frühere Menschen bzw. Vorfahren, ohne die Referenz enger festzulegen.
- source_word: መዋዕሊሆሙ ብዙኅ
  choice: ihre Tage waren zahlreich
  rationale: Bewahrt das konkrete Bild der vielen Lebenstage und folgt der Ausdrucksweise des Geʿez.
- source_word: ሠናይ
  choice: gut
  rationale: Die einfache Wertung des Quellworts bleibt erhalten; eine Präzisierung wie »glücklich« wäre interpretierend.
- source_word: አብዝኀ ሰብእ ሐይወ
  choice: wenn ein Mensch lange lebt
  rationale: Gibt die idiomatische Aussage über ein langes bzw. volles Menschenleben natürlich wieder.
- source_word: ኀየለ
  choice: kräftig ist
  rationale: Spiegelt die Vorstellung besonderer körperlicher Stärke oder Lebenskraft, die ein Alter von achtzig Jahren ermöglicht.
- source_word: ትውልድ
  choice: Generation
  rationale: Der Ausdruck bezeichnet die zeitgenössische Generation; das etablierte deutsche Wort bewahrt die kollektive Bedeutung.
theological_decisions:
- issue: Bezug der Aussage »sie sind böse«
  choice: Das Pronomen bleibt mehrdeutig auf die Lebenstage bezogen.
  alternative: Explizit auf die Generation oder die Lebensumstände beziehen.
  rationale: Die Quellenformulierung lässt den unmittelbaren Bezug bei den Tagen des Lebens stehen; eine Auflösung würde die überlieferte Spannung beseitigen.
- issue: Bewertung der früheren Lebenszeit
  choice: »und gut« bleibt eine knappe, unkommentierte Wertung.
  alternative: »und es waren gute Jahre« oder »und glücklich«.
  rationale: Die Übersetzung fügt keine theologische Erklärung über das Verhältnis von Lebenslänge und Güte hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend formnaher Satzführung. »Doch seht« gibt den deiktischen Kontrast natürlich wieder; Wiederholungen von »und« bleiben erhalten, weil sie den kumulativen, klagenden Ton des Ausgangstextes tragen.
