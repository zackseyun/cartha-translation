  yaml_path: translation/extra_canonical/jubilees/023/008.yaml
  text: And all the men of his house wept for him forty days, and Isaac and Ishmael and all their sons and all the sons of Keturah in their places; and the days of weeping for Abraham were completed.
translation:
  language: de
  text: Und alle Männer seines Hauses beweinten ihn vierzig Tage lang, ebenso Isaak und Ismael und alle ihre Söhne sowie alle Söhne Keturas an ihren jeweiligen Orten; und die Tage der Trauer um Abraham gingen zu Ende.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በከይዎ
  choice: beweinten ihn
  rationale: Das Verb bezeichnet hier das Weinen beziehungsweise Trauern um den verstorbenen Abraham; „beweinten ihn“ gibt Gegenstand und Anlass der Trauer klar wieder.
- source_word: አርብዓ፡ መዋዕለ
  choice: vierzig Tage lang
  rationale: Bewahrt Zeitdauer und Zahl des Ausgangstextes in natürlicher deutscher Wortstellung.
- source_word: ኵሎሙ፡ ሰብአ፡ ቤቱ
  choice: alle Männer seines Hauses
  rationale: Gibt die männlich bezeichneten Angehörigen beziehungsweise Hausgenossen formal nah wieder, ohne den Ausdruck pauschal zu „Hausgemeinschaft“ zu verallgemeinern.
- source_word: በመካኖሙ
  choice: an ihren jeweiligen Orten
  rationale: Das distributive Possessiv wird sichtbar gemacht; gemeint ist, dass die genannten Gruppen dort trauerten, wo sie sich jeweils befanden.
- source_word: መዋዕለ፡ ብካዩ፡ አብርሃም
  choice: die Tage der Trauer um Abraham
  rationale: 'Der Genitiv wird kontextgemäß objektiv verstanden: Abraham ist der Betrauerte, nicht der Trauernde.'
- source_word: ተፈጸመ
  choice: gingen … zu Ende
  rationale: Eine natürliche deutsche Wiedergabe des Abschlusses der festgelegten Trauerzeit.
theological_decisions:
- issue: Bezug des Genitivs im Schlussausdruck
  choice: Trauer um Abraham
  alternative: Abrahams Trauer
  rationale: Der unmittelbare Kontext handelt davon, dass sein Haus und seine Nachkommen ihn beweinen. Daher bezeichnet der Ausdruck die Trauerzeit für Abraham, ohne ihm selbst das Weinen zuzuschreiben.
- issue: Reichweite von „alle ihre Söhne“
  choice: auf Isaak und Ismael gemeinsam bezogen
  alternative: auf sämtliche zuvor genannten Angehörigen bezogen
  rationale: Numerus und Satzbau stützen am ehesten den gemeinsamen Bezug auf Isaak und Ismael; Keturas Söhne werden anschließend gesondert genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz folgt der Aufzählungsstruktur des ge’ezischen Textes, wird jedoch durch „ebenso“ und „sowie“ lesbar gegliedert. Der Schlusssatz vermeidet die im Deutschen missverständliche Formulierung „Abrahams Trauer“.
