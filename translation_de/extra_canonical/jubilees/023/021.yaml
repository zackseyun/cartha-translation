  text: And they will rise up with bow and with swords and with slaughter, to turn them back to the way; and they will not turn back until much blood is poured out on the earth, these by those.
translation:
  language: de
  text: Und sie werden sich mit Bogen und Schwertern zum Töten erheben, um sie auf den Weg zurückzubringen.[a] Sie werden nicht umkehren, bis viel Blut auf der Erde vergossen ist – die einen durch die anderen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „um sie auf den Weg zu wenden“.'
    reason: Die Fußnote macht die Richtungsangabe und die wörtlichere Bedeutung sichtbar, während der Haupttext idiomatisches Deutsch bietet.
  - marker: b
    text: 'Wörtlich: „diese durch diese“. Gemeint ist offenbar wechselseitiges Blutvergießen.'
    reason: Die ungewöhnlich knappe Schlussformel wird transparent gemacht, ohne die beteiligten Gruppen über den Ausgangstext hinaus festzulegen.
lexical_decisions:
- source_word: ይቀውሙ (yiqawwəmu)
  choice: sie werden sich … erheben
  rationale: Gibt das Aufstehen bzw. Sich-Erheben im Zusammenhang eines bewaffneten Vorgehens natürlicher wieder als das statische „stehen“.
- source_word: በቀስት፡ ወበአስይፍት፡ ወበቅትል
  choice: mit Bogen und Schwertern zum Töten
  rationale: Bewahrt Bogen, Schwerter und Töten als drei ausdrücklich genannte Elemente, vermeidet aber das im Deutschen missverständliche abstrakte „mit Gemetzel“.
- source_word: ይሚጥዎሙ፡ ውስተ፡ ፍኖት
  choice: um sie auf den Weg zurückzubringen
  rationale: ውስተ bezeichnet die Richtung „in/auf … hinein“, nicht „vom Weg fort“. „Zurückzubringen“ macht im Zusammenhang das beabsichtigte Zurückwenden auf den Weg verständlich.
- source_word: ኢይትመየጡ
  choice: sie werden nicht umkehren
  rationale: Entspricht dem Zurück- bzw. Umkehren und bleibt hinsichtlich des Subjekts so offen wie der Ausgangstext.
- source_word: እሉ፡ በእሉ
  choice: die einen durch die anderen
  rationale: Gibt die knappe wechselseitige Schlussformel idiomatisch wieder, ohne die beteiligten Gruppen näher zu bestimmen.
theological_decisions:
- issue: Ziel des gewaltsamen Vorgehens
  choice: „auf den Weg zurückzubringen“
  alternative: „vom Weg abzubringen/zu vertreiben“
  rationale: Die Richtungspräposition ውስተ weist auf eine Bewegung zum bzw. auf den Weg hin. Die gegenteilige Deutung würde eine nicht ausgedrückte Herkunftsrichtung voraussetzen.
- issue: Bezug des Subjekts in „sie werden nicht umkehren“
  choice: Pronomen ohne erläuternde Identifizierung beibehalten
  alternative: das Subjekt ausdrücklich als Angreifer oder als Angegriffene bestimmen
  rationale: Der knappe Ausgangstext lässt den Bezug syntaktisch offen; eine ausdrückliche Zuordnung würde die Spannung unzulässig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die martialische Reihung bleibt spürbar, wird jedoch syntaktisch natürlich formuliert. Pronomenbezüge und die knappe wechselseitige Schlussformel werden nicht konfessionell oder auslegend vereindeutigt.
