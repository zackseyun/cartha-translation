  text: And in those days the children will begin to search the law, and to seek the commandments, and to return to the way of righteousness.
translation:
  language: de
  text: Und in jenen Tagen werden die Kinder anfangen, das Gesetz zu erforschen, die Gebote zu suchen und auf den Weg der Gerechtigkeit zurückzukehren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደቂቅ
  choice: die Kinder
  rationale: Die wörtliche und kontextuell offene Bezeichnung wird beibehalten; sie kann die jüngere Generation meinen, ohne dies ausdrücklich festzulegen.
- source_word: ይትኀሠሡ፡ ሕገገ
  choice: das Gesetz zu erforschen
  rationale: Das Verb bezeichnet ein ernsthaftes Suchen oder Erforschen; „erforschen“ ergibt mit „Gesetz“ natürliches Deutsch und bewahrt den aktiven Sinn.
- source_word: ለኀሢሠ፡ ትእዛዝ
  choice: die Gebote zu suchen
  rationale: Die Parallelstruktur des Ausgangstextes bleibt sichtbar; „Gebote“ gibt den kollektiven beziehungsweise pluralisch verstandenen Inhalt sachgerecht wieder.
- source_word: ተመይጦ፡ ውስተ፡ ፍኖተ፡ ጽድቅ
  choice: auf den Weg der Gerechtigkeit zurückzukehren
  rationale: Die Richtungsangabe wird im Deutschen idiomatisch mit „auf“ wiedergegeben; „Gerechtigkeit“ wahrt die ethisch-theologische Bedeutungsbreite von ጽድቅ.
theological_decisions:
- issue: Bedeutung von „Gerechtigkeit“
  choice: Weg der Gerechtigkeit
  alternative: Weg des rechten Handelns
  rationale: Die traditionelle und theologisch offene Formulierung bewahrt sowohl den ethischen als auch den religiösen Gehalt, ohne ihn auf bloßes Verhalten zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreigliedrige Bewegung des Verses—Gesetz erforschen, Gebote suchen, zurückkehren—wird klar und ohne konfessionelle Zusatzdeutung wiedergegeben.
