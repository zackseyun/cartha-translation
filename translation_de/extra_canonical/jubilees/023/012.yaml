  text: And all the generations that will arise from now until the day of the great judgment will grow old quickly before they complete two jubilees, and their knowledge will depart from them, from their spirit,, and all their knowledge will vanish.
translation:
  language: de
  text: Und alle Generationen, die von jetzt an bis zum Tag des großen Gerichts aufkommen werden, werden rasch altern, noch bevor sie zwei Jubiläen vollendet haben. Ihre Erkenntnis wird sie verlassen und aus ihrem Geist weichen, und all ihre Erkenntnis wird verschwinden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das letzte Satzglied („und all ihre Erkenntnis wird verschwinden“) steht in der verwendeten Ausgabe in eckigen Klammern und ist textkritisch unsicher.
    reason: textual_variant
lexical_decisions:
- source_word: ትውልድ
  choice: Generationen
  rationale: Das Wort bezeichnet hier die aufeinanderfolgenden Menschengeschlechter; der Plural ergibt sich aus ኵሉ in Verbindung mit dem nachfolgenden pluralischen Verb.
- source_word: ዕለተ፡ ደይን፡ ዐባይ
  choice: Tag des großen Gerichts
  rationale: Entspricht der gerichtstheologischen Wendung wörtlich und in natürlichem, würdigem Deutsch.
- source_word: ይረሰኡ፡ ፍጡነ
  choice: werden rasch altern
  rationale: Gibt das Verb des Altwerdens zusammen mit dem Adverb ፍጡነ wieder, ohne den Vorgang als bloßes körperliches Wachstum umzudeuten.
- source_word: ክልኤ፡ ኢዮቤልወ
  choice: zwei Jubiläen
  rationale: Bewahrt die für das Jubiläenbuch charakteristische Zeiteinheit und vermeidet eine unbelegte Umrechnung in Jahre.
- source_word: አእምሮቶሙ
  choice: ihre Erkenntnis
  rationale: Deckt Wissen, Einsicht und Erkenntnis ab; „Erkenntnis“ passt zum Zusammenhang des geistigen Verlusts und bewahrt die Wiederholung im Quelltext.
- source_word: እመንፈሶሙ
  choice: aus ihrem Geist
  rationale: Die ausdrücklich genannte Herkunft beziehungsweise Sphäre des Entweichens wird beibehalten und nicht ausgelassen.
- source_word: ትአትት
  choice: wird verschwinden
  rationale: Gibt im Kontext den vollständigen Verlust der Erkenntnis idiomatisch wieder.
theological_decisions:
- issue: Bezug von Erkenntnis und Geist
  choice: „Ihre Erkenntnis wird sie verlassen und aus ihrem Geist weichen“
  alternative: „Ihre Erkenntnis wird aus ihrem Geist weichen“
  rationale: Die gewählte Fassung bewahrt sowohl den pronominalen Bezug auf die Menschen als auch die ausdrückliche Angabe „aus ihrem Geist“, ohne daraus eine weitergehende anthropologische Lehre abzuleiten.
- issue: Textkritischer Status des letzten Satzglieds
  choice: Im Haupttext beibehalten und mit Fußnote kennzeichnen
  alternative: Das eingeklammerte Satzglied auslassen
  rationale: Die überlieferte Vorlage enthält das Satzglied, kennzeichnet es jedoch durch eckige Klammern als textkritisch unsicher; Übersetzung und Fußnote bewahren beides.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde leicht gegliedert, um den langen ge’ezischen Satz verständlich wiederzugeben; Wiederholung, zeitliche Zuspitzung und die ausdrückliche Erwähnung des Geistes bleiben erhalten.
