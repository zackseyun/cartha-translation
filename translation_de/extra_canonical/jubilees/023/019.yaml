  terminology: „Zugrunde gehen“ bewahrt die Wiederholung des Untergangsmotivs, ohne eine nicht im Text festgelegte Zerstörungsart zu bestimmen. „Wilde Tiere“ und „Vieh“ geben die Tierpaarung präzise wieder. „Von Untreue geprägt“ ist eine verständliche Haupttextlösung für das breite Bedeutungsfeld von kaḥda; die Fußnote sichert die relevanten Alternativen Leugnung, Abfall und Treulosigkeit ab.
