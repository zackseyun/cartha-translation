  source_fidelity: 'Der Text gibt die ge''ezische Aussage vollständig und in ihrer Reihenfolge wieder: Untergang der Erde aufgrund ihrer Taten, Ausbleiben von Getreide/Saat, Wein und Öl, Charakterisierung der Taten als kaḥda, gemeinsamer Untergang der Tierwelt und die abschließende Bezugnahme auf die Menschenkinder. „Getreide“ ist im landwirtschaftlichen Dreiklang eine sachgerechte, idiomatische Wiedergabe von zarʾ und entspricht dem englischen POB-Auditstand. Die kausale Wiedergabe von ʾəm-qədma mit „wegen“ ist im unmittelbaren Kontext gut begründet.'
