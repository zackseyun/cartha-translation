base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/019.yaml
  text: Behold, the earth will be destroyed because of all their deeds, and there will be no grain, no wine, and no oil, because all their deeds are faithless; and they will all perish together—beasts and cattle and birds and all the fish of the sea—because of the sons of men.
translation:
  language: de
  text: 'Siehe, die Erde wird wegen all ihrer Taten zugrunde gehen. Es wird weder Getreide noch Wein noch Öl geben, denn alle ihre Taten sind von Untreue geprägt.[a] Und sie alle werden gemeinsam zugrunde gehen: die wilden Tiere, das Vieh, die Vögel und alle Fische des Meeres – wegen der Menschenkinder.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das ge'ezische Wort kann auch Leugnung, Abfall oder Treulosigkeit bezeichnen.
    reason: Die Bedeutungsbreite des Ausdrucks ist theologisch relevant und lässt sich im Haupttext nicht vollständig mit einem einzigen deutschen Wort abbilden.
lexical_decisions:
- source_word: ትትሐጐል (tətḥaggol)
  choice: wird … zugrunde gehen
  rationale: Das Verb bezeichnet Untergang oder Verderben. „Zugrunde gehen“ bewahrt die Wiederholung desselben Verbstamms für die Erde und die Lebewesen, ohne vorschnell eine bestimmte Art der Zerstörung festzulegen.
- source_word: ዘርእ፡ ወይን (zarʾ wäyn)
  choice: Getreide noch Wein
  rationale: Die beiden koordinierten landwirtschaftlichen Begriffe bezeichnen hier am natürlichsten Getreide beziehungsweise Saat und Wein. Die Wiedergabe passt zur folgenden Nennung des Öls und vermeidet das missverständliche „Weinsamen“.
- source_word: ቅብዐ (qəbʿa)
  choice: Öl
  rationale: Im landwirtschaftlichen Dreiklang ist damit Öl, insbesondere Olivenöl, gemeint; „Öl“ ist im Deutschen natürlich und überbestimmt die Pflanzenart nicht.
- source_word: ካሕደ (kaḥda)
  choice: von Untreue geprägt
  rationale: Der Ausdruck gehört zum Bedeutungsfeld von Leugnung, Abfall und Treulosigkeit. Die Formulierung beschreibt den sittlichen Charakter der Taten, ohne die Mehrdeutigkeit auf eine einzelne konkrete Verfehlung zu verengen.
- source_word: አራዊት፡ ወእንስሳ (ʾarāwit wa-ʾənsəsā)
  choice: die wilden Tiere, das Vieh
  rationale: Die Paarung unterscheidet Wildtiere von domestizierten Tieren. „Vieh“ bildet den zweiten Begriff idiomatisch und prägnant ab.
- source_word: እምቅድመ፡ ውሉደ፡ ሰብእ (ʾəm-qədma waluda sabʾ)
  choice: wegen der Menschenkinder
  rationale: Die Präpositionalfügung drückt hier die menschliche Verursachung des gemeinsamen Untergangs aus. „Menschenkinder“ erhält die konkrete, semitisch geprägte Bezeichnung der Menschheit.
theological_decisions:
- issue: Verantwortung der Menschheit für den Untergang der Schöpfung
  choice: „wegen der Menschenkinder“
  alternative: „vor den Menschenkindern“
  rationale: Der Zusammenhang nennt menschliche Taten als Ursache des Verderbens. Daher wird die kausale Bedeutung wiedergegeben, ohne zusätzliche Aussagen über Erbsünde, Endgericht oder eine bestimmte Menschengruppe einzutragen.
- issue: Charakterisierung der menschlichen Taten
  choice: „von Untreue geprägt“
  alternative: „böse“ oder „gottlos“
  rationale: „Untreue“ wahrt das Bedeutungsfeld des ge'ezischen Ausdrucks besser als allgemeinere moralische Wertungen und lässt offen, in welchem konkreten Verhältnis sich diese Untreue zeigt.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit klarer Satzgliederung. Die einleitende Mahnformel „Siehe“ und „Menschenkinder“ bewahren den biblisch-apokalyptischen Ton; der übrige Wortlaut bleibt für heutige Leser unmittelbar verständlich.
