  yaml_path: translation/extra_canonical/jubilees/023/026.yaml
  text: In those days they will cry out and call and pray to be saved from the hand of the sinful nations, but there will be no one who will be saved.
translation:
  language: de
  text: In jenen Tagen werden sie schreien, rufen und beten, damit sie aus der Hand der sündigen Völker gerettet werden; doch niemand wird gerettet werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »doch niemand wird entkommen«.'
    reason: Das einfache ge'ezische Verb kann sowohl als »gerettet werden« als auch als »entrinnen/entkommen« wiedergegeben werden; beide Lesarten sind intransitiv und unterscheiden sich von »retten« im kausativen Sinn.
lexical_decisions:
- source_word: በውእቱ፡ መዋዕል
  choice: In jenen Tagen
  rationale: Die ge'ezische Zeitangabe wird idiomatisch und zugleich quellennah wiedergegeben.
- source_word: ይጸርሑ፡ ወይጼውዑ፡ ወይጼልዩ
  choice: werden sie schreien, rufen und beten
  rationale: Die drei koordinierten Verben und ihre eindringliche Steigerung bleiben erhalten.
- source_word: ከመ፡ ይድኅኑ
  choice: damit sie ... gerettet werden
  rationale: Die Konstruktion bezeichnet hier den erhofften Zweck; der einfache Verbalstamm von ድኅነ wird intransitiv beziehungsweise passivisch als ‚gerettet werden/entrinnen‘ verstanden.
- source_word: እምእደ፡ ኃጥአን፡ አሕዛብ
  choice: aus der Hand der sündigen Völker
  rationale: ‚Aus der Hand‘ bewahrt das konkrete Herrschafts- und Gewaltbild der Quelle; ኃጥአን bestimmt die Völker als sündig.
- source_word: ወአልቦ፡ ዘይድኅን
  choice: doch es wird niemanden geben, der gerettet wird
  rationale: Der nichtkausative Verbalstamm spricht von jemandem, der gerettet wird beziehungsweise entkommt, nicht von jemandem, der andere rettet.
theological_decisions:
- issue: Subjekt beziehungsweise Funktion des Schlussverbs ይድኅን
  choice: niemand, der gerettet wird
  alternative: niemand, der rettet
  rationale: Die Quellform ist der einfache G-Stamm und nicht der kausative A-Stamm. Daher darf die Aussage nicht zu einem fehlenden Retter umgedeutet werden.
- issue: Spannung zwischen dem Gebet um Rettung und dem abschließenden Ausbleiben der Rettung
  choice: unaufgelöst bewahrt
  alternative: durch eine erklärende Einschränkung abschwächen
  rationale: Der Vers stellt Bitte und negatives Ergebnis unmittelbar nebeneinander; die Übersetzung fügt keine theologische Erklärung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Dreierfolge »schreien, rufen und beten« sowie das Bild »aus der Hand« wurden bewusst bewahrt. Das Semikolon macht den scharfen Gegensatz im Schlusssatz klar, ohne ihn auszudeuten.
