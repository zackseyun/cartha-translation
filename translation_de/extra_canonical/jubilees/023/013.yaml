    rationale: Der Ausdruck kann zwar Krankheit bezeichnen, doch die Reihung mit Arbeit und Bedrängnis sowie die englische Auditspur sprechen hier für den weiter gefassten Begriff Schmerz/Leiden.
  - severity: low
    issue: »anderthalb Jubiläen«
    rationale: Die Form ist verständlich, kann aber den Eindruck mehrerer vollständiger Jubiläen erwecken. Die singularische Form »ein Jubeljahr und ein halbes« bildet die Vorlage genauer ab.
