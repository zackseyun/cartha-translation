  yaml_path: translation/extra_canonical/jubilees/023/013.yaml
  text: And in those days, if a man lives a jubilee and a half of years, they will say of him, “He has lived long”; but most of his days are pain and labor and distress, and there is no peace.
translation:
  language: de
  text: 'Und wenn in jenen Tagen ein Mann ein Jubeljahr und ein halbes lebt, wird man von ihm sagen: »Er hat lange gelebt.« Doch die meisten seiner Tage sind Schmerz, Arbeit und Bedrängnis, und es gibt keinen Frieden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢዮቤልወ፡ ወመንፈቀ፡ ዓመታት
  choice: anderthalb Jubiläen lang
  rationale: Gibt die Maßeinheit des Ausgangstextes verständlich und knapp wieder, ohne sie in eine moderne Jahreszahl umzurechnen.
- source_word: አብዝኀ፡ ሐይወ
  choice: Er hat lange gelebt
  rationale: Natürliche deutsche Wiedergabe der Aussage, dass jemand sein Leben verlängert beziehungsweise ein hohes Alter erreicht hat.
- source_word: ሕማም፡ ወስራሕ፡ ወምንዳቤ
  choice: Krankheit, Mühsal und Kummer
  rationale: Bewahrt die dreigliedrige Folge körperlichen Leidens, beschwerlicher Arbeit und seelischer Bedrängnis in würdigem, heutigem Deutsch.
- source_word: አልቦ፡ ሰላመ
  choice: es gibt keinen Frieden
  rationale: Entspricht der schlichten und absoluten Verneinung des Ausgangstextes.
theological_decisions:
- issue: Bedeutung von »Jubiläum« als Zeitmaß
  choice: Die antike Zeitangabe bleibt als »anderthalb Jubiläen« stehen.
  alternative: Die Zeitangabe in eine bestimmte Zahl von Jahren umrechnen.
  rationale: Eine Umrechnung würde eine Auslegung der Länge eines Jubiläums voraussetzen und die quellensprachliche Form unnötig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die sprichwortartige direkte Rede und der abschließende Kontrast bleiben erhalten; »Doch« markiert den Gegensatz natürlich, ohne ihn zu verstärken.
