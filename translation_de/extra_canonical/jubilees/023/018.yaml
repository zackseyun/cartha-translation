base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/023/018.yaml
  text: For all of them have acted wickedly, and every mouth speaks sin, and all their works are uncleanness and abomination, and all their ways are defilement and uncleanness and destruction.
translation:
  language: de
  text: Denn sie alle haben böse gehandelt, und jeder Mund redet Sünde; alle ihre Werke sind Unreinheit und Abscheulichkeit, und alle ihre Wege sind Befleckung, Unreinheit und Verderben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zerstörung“.'
    reason: Das abschließende ሙስና kann sowohl Verderbnis beziehungsweise Verfall als auch Zerstörung bezeichnen.
lexical_decisions:
- source_word: አእከዩ (ʾaʾkayu)
  choice: haben böse gehandelt
  rationale: Gibt das vollendete böse Handeln natürlich und unmittelbar wieder.
- source_word: ዐበሳ (ʿabasa)
  choice: Sünde
  rationale: Der Ausdruck bezeichnet hier moralisch-religiöse Verfehlung; „Sünde“ wahrt die deutliche Aussage des Ausgangstextes.
- source_word: ርኵስ (rəkus)
  choice: Unreinheit / unrein
  rationale: Bewahrt das wiederkehrende Reinheitsvokabular, wobei die substantivische beziehungsweise adjektivische Form dem deutschen Satzbau angepasst wird.
- source_word: ስቈራር (səqwarar)
  choice: Abscheulichkeit
  rationale: Vermittelt die starke Bedeutung von Abscheu beziehungsweise Gräuel, ohne sie zu „Verderbnis“ abzuschwächen.
- source_word: ግማኔ (gəmane)
  choice: Befleckung
  rationale: Bezeichnet eine Verunreinigung oder Befleckung und bleibt vom folgenden „unrein“ unterscheidbar.
- source_word: ሙስና (musna)
  choice: Verderben
  rationale: Kann Verderbnis, Verfall oder Zerstörung bezeichnen; „Verderben“ erhält diese Bedeutungsbreite im Kontext der Wege.
theological_decisions:
- issue: „Sünde“ gegenüber „Schuld“
  choice: Sünde
  alternative: Schuld
  rationale: Der Kontext beschreibt das sündige Reden selbst, nicht lediglich den daraus folgenden Schuldzustand.
- issue: Letztes Glied ሙስና
  choice: Verderben
  alternative: Zerstörung
  rationale: „Verderben“ bewahrt die mögliche Spannung zwischen moralischer Verderbnis und zerstörerischem Ausgang; die Alternative wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anaphorische Reihung des Ausgangstextes und die Häufung moralischer Unreinheitsbegriffe bleiben erhalten; das Semikolon sorgt für natürliche Lesbarkeit.
