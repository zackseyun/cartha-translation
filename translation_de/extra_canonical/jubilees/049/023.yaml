lexical_decisions:
- source_word: ቅድመ፡ እግዚአብሔር
  choice: vor dem HERRN
  rationale: Gibt die räumlich-kultische Wendung direkt und in würdigem, geläufigem Bibeldeutsch wieder.
- source_word: ዲበ፡ ምሥዋዐ፡ አምላክክሙ
  choice: auf dem Altar eures Gottes
  rationale: Bewahrt Präposition, Kultgegenstand und die pluralische Anrede des Ausgangstextes.
- source_word: በውልዋሌ
  choice: in Eile
  rationale: Entspricht der adverbialen Bestimmung und klingt im modernen Deutschen natürlicher als eine substantivische Konstruktion.
- source_word: ገዳመ፡ ሱር
  choice: die Wüste Schur
  rationale: Verwendet die etablierte deutsche Form des Ortsnamens.
- source_word: በኀበ፡ ድንጋገ፡ ባሕር
  choice: am Ufer des Meeres
  rationale: Gibt die örtliche Angabe idiomatisch wieder; der Ausdruck bezeichnet den Rand beziehungsweise das Ufer des Meeres.
- source_word: ሰበጥክምዋ
  choice: habt ihr es vollendet
  rationale: Bewahrt den Abschlussgedanken und den Rückbezug auf das Fest, ohne den Vorgang weiter auszudeuten.
theological_decisions:
- issue: Gottesbezeichnung in der kultischen Formel
  choice: HERRN
  alternative: Herrn
  rationale: Die traditionelle Kapitälchenschreibung kennzeichnet den Gottesnamen, ohne über den vorliegenden Ausdruck hinaus eine konfessionelle Deutung einzuführen.
- issue: Bezug des Pronomens im Schlusssatz
  choice: es (das Fest)
  alternative: den Auszug oder einen Ritus
  rationale: Der nächstliegende grammatische Rückbezug ist das zuvor genannte Fest; die Übersetzung fügt keine nähere Erklärung seiner Vollendung hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kultisch-biblischem Klang. Die Satzfolge und zeitliche Spannung des ge'ezischen Textes bleiben erhalten; der Vers beginnt als Fortsetzung des vorherigen Satzes bewusst mit „vor“.
