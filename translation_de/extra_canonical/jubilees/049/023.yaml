  - severity: low
    issue: Stellung der Zeitangaben
    rationale: Die Verbindung „gefeiert, als ... auszogt, bis ... kamt“ ist verständlich, aber stilistisch holprig. Eine Umstellung verbessert die Lesbarkeit und erhält den zeitlichen Umfang.
