translation:
  language: de
  text: vor dem Herrn auf dem Altar eures Gottes. Denn als ihr aus Ägypten auszogt, habt ihr dieses Fest in Eile gefeiert, bis ihr in die Wüste Schur kamt; denn am Ufer des Meeres habt ihr es vollendet.
