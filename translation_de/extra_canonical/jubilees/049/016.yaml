  text: at its appointed time, in every respect according to its command. And it shall not be lawful to eat it outside the sanctuary of the LORD, but before the sanctuary of the LORD, and all the people of the assembly
translation:
  language: de
  text: zu seiner festgesetzten Zeit, in jeder Hinsicht nach seinem Gebot. Und es ist nicht erlaubt, es außerhalb des Heiligtums des HERRN zu essen, sondern vor dem Heiligtum des HERRN. Und das ganze Volk der Versammlung
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በጊዜሁ
  choice: zu seiner festgesetzten Zeit
  rationale: Die Wendung bezeichnet den für das Passafest bestimmten Zeitpunkt; „festgesetzt“ gibt den normativen Zusammenhang natürlich wieder.
- source_word: በኵሉ፡ በከመ፡ ትእዛዙ
  choice: in jeder Hinsicht nach seinem Gebot
  rationale: Bewahrt sowohl die umfassende Aussage von በኵሉ als auch den Maßstab des Gebots.
- source_word: ወኢይከውን፡ ለበሊያቶ
  choice: Und es ist nicht erlaubt, es … zu essen
  rationale: Gibt die unpersönliche rechtliche Formulierung des Ge’ez in natürlichem modernem Deutsch wieder.
- source_word: በአፍአ፡ እምቤተ፡ መቅደሱ፡ ለእግዚአብሔር
  choice: außerhalb des Heiligtums des HERRN
  rationale: Die räumliche Wendung bezeichnet den Bereich außerhalb des Heiligtums.
- source_word: በአንጻረ፡ ቤተ፡ መቅደሱ፡ ለእግዚአብሔር
  choice: vor dem Heiligtum des HERRN
  rationale: በአንጻረ kann räumlich „gegenüber/vor“ bedeuten; „vor“ ist hier würdig und idiomatisch, ohne den räumlichen Bezug aufzulösen.
- source_word: ወኵሉ፡ ሕዝበ፡ ማኅበ[ር]
  choice: Und das ganze Volk der Versammlung
  rationale: Die Wortgruppe wird als Beginn des über die Versgrenze fortlaufenden Satzes bewahrt; ሕዝብ wird ausdrücklich mit „Volk“ wiedergegeben.
theological_decisions:
- issue: Gottesname እግዚአብሔር
  choice: HERR
  alternative: Herr
  rationale: Die Kapitälchenschreibung entspricht der üblichen deutschen Bibelkonvention für die Wiedergabe des göttlichen Namens in diesem kultischen Zusammenhang, ohne eine zusätzliche konfessionelle Deutung einzuführen.
- issue: Verhältnis des letzten Satzglieds zu Vers 17
  choice: Als selbstständigen, unvollendeten Satzanfang wiedergeben
  alternative: „mit dem ganzen Volk der Versammlung“ an den vorherigen Satz anschließen
  rationale: Das ge’ezische „und“ sowie die überlieferte Fortsetzung sprechen dafür, dass die Wortgruppe Subjekt des folgenden Satzes ist. Die Spannung der Versgrenze darf nicht durch eine syntaktische Umdeutung geglättet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rechtlich-kultischem Ton. Die am Versende abbrechende Syntax wurde bewusst erhalten, da der Satz in Vers 17 weitergeht.
