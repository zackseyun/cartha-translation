revisions:
- from: 'In der Nacht, am Abend des Fünfzehnten, vom Untergang der Sonne an. Denn in dieser Nacht begann das Fest, und die Freude nahm ihren Anfang. Ihr wohntet in Ägypten und aßt das Passa, während alle Mächte Mastemas ausgesandt wurden, um alle Erstgeborenen im Land Ägypten zu töten, vom Erstgeborenen des Pharaos bis zum Erstgeborenen der gefangenen Magd, die im Mühlenhaus war, und auch die Erstgeburt des Viehs. Und dies ist das Zeichen, das der HERR ihnen gab: In jedes Haus, an dessen Türpfosten sie das Blut eines einjährigen Lammes sahen, sollten sie nicht hineingehen, um zu töten, sondern daran vorübergehen, damit alle im Haus gerettet würden; denn das Zeichen des Blutes war an seinen Türpfosten. Und die Mächte des HERRN taten alles genauso, wie der HERR ihnen geboten hatte. Sie gingen an allen Söhnen Israels vorüber, und keine Plage kam über sie, um unter ihnen irgendein Leben zu vernichten, vom Vieh bis zum Menschen und sogar bis zum Hund. Die Plage in Ägypten aber war überaus groß,
    und es gab kein Haus in Ägypten, in dem nicht ein Toter war, dazu Trauer und Wehklage. Ganz Israel dagegen blieb dort, aß das Fleisch des Passas, trank Wein, lobte und pries den HERRN, den Gott seiner Väter, und dankte ihm. Sie waren bereit, unter dem Joch Ägyptens und aus der bösen Knechtschaft auszuziehen.


    Auch du sollst dieses Tages gedenken alle Tage deines Lebens und ihn Jahr für Jahr begehen, alle Tage deines Lebens, einmal im Jahr an seinem Tag, nach all seinen Vorschriften. Verschiebe den Tag nicht von einem Tag auf einen anderen oder von einem Monat auf einen anderen. Denn es ist eine ewige Satzung; auf den himmlischen Tafeln ist für alle Kinder Israels geschrieben und festgesetzt, dass sie ihn jedes Jahr, Jahr für Jahr, an seinem Tag, einmal im Jahr, durch alle ihre Generationen hindurch begehen sollen. Und die Zahl seiner Tage hat kein Ende, denn diese Satzung gilt für immer. Ein Mann, der rein ist und herbeikommt, um das Fest an seinem Tag zu begehen, um dem HERRN eine wohlgefällige Opfergabe darzubringen und am Tag des Festes vor dem HERRN zu essen und zu trinken – dieser Mann, obwohl er rein und nahe ist, soll ausgerottet werden, weil er die Opfergabe des HERRN nicht zu ihrer festgesetzten Zeit dargebracht hat; dieser Mann muss seine Sünde tragen.[a]


    Darum sollen die Kinder Israels kommen und das Passa zu seiner festgesetzten Zeit begehen, am vierzehnten Tag des ersten Monats, zwischen den Abenden,[b] von der Mitte des Tages bis zum dritten Teil der Nacht.[c] Denn zwei Teile des Tages sind dem Licht gegeben, und ein dritter Teil gehört dem Abend. Dies ist es, was der HERR dir zu begehen geboten hat, mitten am Abend. Es darf zu keiner Zeit des Lichts geschlachtet werden, sondern nur zur Abendzeit. Sie sollen es am Abend bis zum dritten Teil der Nacht essen; und was nach dem dritten Teil der Nacht von seinem ganzen Fleisch übrig bleibt, sollen sie im Feuer verbrennen. Sie sollen es nicht roh essen und auch nicht in Wasser gekocht, sondern über dem Feuer gebraten. Mit seinem Kopf, seinen Innereien und seinen Beinen sollen sie es über dem Feuer braten. Sie sollen keinen einzigen Knochen an ihm zerbrechen; denn bei den Kindern Israels darf kein Knochen zerbrochen werden. Deshalb gebot der HERR den Kindern Israels, das Passa zu seiner
    festgesetzten Zeit zu begehen; kein Knochen daran darf zerbrochen werden, denn es ist ein Festtag und ein gebotener Tag. Sie sollen es nicht von einem Tag auf einen anderen oder von einem Monat auf einen anderen verschieben, sondern es am Tag seines Festes begehen.


    Und du, gebiete den Kindern Israels, das Passa zu seinen Zeiten zu begehen, jedes Jahr einmal im Jahr zu seiner festgesetzten Zeit. So wird es vor dem HERRN als wohlgefälliges Gedenken gelten, und keine Plage zum Töten oder Schlagen wird in dem Jahr über sie kommen, in dem sie das Passa begehen.'
