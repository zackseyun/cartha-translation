  yaml_path: translation/extra_canonical/jubilees/049/017.yaml
  text: All of Israel shall observe it at its appointed time. And every man who comes on that day shall eat it in the house of the sanctuary of your God before the LORD, from twenty years old and upward, because
translation:
  language: de
  text: Ganz Israel soll es zu seiner festgesetzten Zeit halten. Und jeder Mann, der an jenem Tag kommt, soll es im Haus des Heiligtums eures Gottes vor dem HERRN essen, vom zwanzigsten Lebensjahr an, denn[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der mit „denn“ beginnende Satz wird im folgenden Vers fortgesetzt.
    reason: Die deutsche Fassung bewahrt den offenen syntaktischen Anschluss des äthiopischen Versendes und weist leserfreundlich auf die Fortsetzung hin.
lexical_decisions:
- source_word: ይገበርዎ
  choice: soll es … halten
  rationale: Das Verb bedeutet grundlegend „tun, vollziehen“; bei einer vorgeschriebenen Feier gibt „halten“ den Sinn im Deutschen natürlich und zugleich genau wieder.
- source_word: በጊዜሁ
  choice: zu seiner festgesetzten Zeit
  rationale: Die Wendung bezeichnet die für die Feier bestimmte Zeit; „festgesetzt“ macht diesen kalendarisch-normativen Sinn deutlich.
- source_word: ኵሉ፡ ሰብእ
  choice: jeder Mann
  rationale: Die konkrete maskuline Personenbezeichnung wird bewahrt und nicht zum allgemeineren „jeder Mensch“ verallgemeinert.
- source_word: ቤተ፡ መቅደሱ
  choice: im Haus des Heiligtums
  rationale: Die Genitivverbindung wird bewusst sichtbar gehalten, statt sie lediglich mit „im Heiligtum“ wiederzugeben.
- source_word: ዘእም፳ዓመት፡ ወላዕለ
  choice: vom zwanzigsten Lebensjahr an
  rationale: Dies ist eine natürliche deutsche Wiedergabe von „von zwanzig Jahren und darüber“.
theological_decisions:
- issue: Gottesname እግዚአብሔር
  choice: HERR
  alternative: Herr
  rationale: Die Kapitälchen-Konvention kennzeichnet den überlieferten Gottesnamen beziehungsweise dessen traditionelle Wiedergabe, ohne eine weitergehende konfessionelle Deutung einzutragen.
- issue: Unvollständiger Begründungssatz am Versende
  choice: denn
  alternative: denn …
  rationale: Das abschließende እስመ wird als einleitende Begründung beibehalten; der Vers wird nicht durch eine ergänzte, im vorliegenden Quelltext fehlende Aussage künstlich abgeschlossen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung „Haus des Heiligtums“ ist bewusst quellennah und etwas formeller; der offene Schluss des Verses bleibt erhalten.
