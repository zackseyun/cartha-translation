  text: that has been sanctified in the name of the LORD. And they shall not be able to observe the Passover in their cities, nor in any place except before the tent of the LORD, or before his house where he dwells.
translation:
  language: de
  text: das im Namen des HERRN geheiligt worden ist. Sie können das Passa weder in ihren Städten noch an irgendeinem anderen Ort feiern, sondern nur vor dem Zelt des HERRN oder[a] vor seinem Haus, wo er wohnt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und wenn nicht«; sinngemäß: »oder« beziehungsweise »andernfalls«.'
    reason: Die ge'ezische idiomatische Wendung wird im Haupttext natürlich wiedergegeben, während die Fußnote ihre wörtliche Form und die daraus folgende Alternative sichtbar macht.
lexical_decisions:
- source_word: ዘተቀደሰ፡ በስመ፡ እግዚአብሔር
  choice: das im Namen des HERRN geheiligt worden ist
  rationale: Gibt das Relativgefüge und das Passiv von »heiligen« eng am ge'ezischen Wortlaut wieder; die traditionelle Gottesnamenschreibung »HERR« wahrt den biblischen Registerton.
- source_word: ገቢረ፡ ጳስካ
  choice: das Passa feiern
  rationale: Das ge'ezische Gefüge bedeutet wörtlich »das Passa tun/begehen«; »feiern« ist im modernen Deutschen natürlich und sachlich passend.
- source_word: ወኢይክሉ
  choice: Sie können … weder … noch
  rationale: Bewahrt die im Ausgangstext ausgedrückte Unmöglichkeit beziehungsweise fehlende Befugnis, ohne sie einseitig als bloßes Verbot wiederzugeben.
- source_word: ዘእንበለ፡ በቅድመ፡ ደብተራ፡ እግዚአብሔር
  choice: sondern nur vor dem Zelt des HERRN
  rationale: »Außer« wird im deutschen Negativsatz idiomatisch durch »sondern nur« wiedergegeben; »Zelt« entspricht dem Heiligtumszelt, ohne hier den stärker festgelegten Ausdruck »Stiftshütte« einzutragen.
- source_word: ወአመ፡ አኮ
  choice: oder
  rationale: 'Die Wendung bedeutet wörtlich »und wenn nicht« und fungiert idiomatisch als Alternative: »oder/andernfalls«.'
- source_word: ኀበ፡ ኀደረ
  choice: wo er wohnt
  rationale: Gibt den Wohn- beziehungsweise Bleibeaspekt des Verbs wieder und folgt der unmittelbaren Aussage über Gottes Haus.
theological_decisions:
- issue: Verhältnis von Zelt und Haus als Kultort
  choice: »oder vor seinem Haus« als Alternative zum Zelt
  alternative: »und vor seinem Haus« als kumulative Angabe
  rationale: Das ge'ezische »und wenn nicht« ist eine geläufige alternative Wendung. So bleiben Zelt und Haus als alternative Bezeichnungen beziehungsweise Kultorte stehen, ohne sie künstlich zusammenzuziehen.
- issue: Modalität der Passafeier außerhalb des Heiligtums
  choice: »Sie können … weder … noch«
  alternative: »Sie dürfen … nicht«
  rationale: Die Übersetzung erhält die formale Modalität des Quellverbs und lässt offen, ob Unmöglichkeit, kultische Unzulässigkeit oder beides gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit biblischem Klang. »Passa« und »HERR« bewahren die vertraute sakrale Terminologie; Satzbau und Wortwahl bleiben zugleich für heutige Leser klar. Der Vers setzt syntaktisch offenbar einen vorausgehenden Satz fort, weshalb der deutsche Text entsprechend mit kleingeschriebenem »das« beginnt.
