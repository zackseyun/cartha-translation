  text: from year to year. And in the days when the house is built in the name of the LORD in the land of their inheritance, there they shall go and slaughter the Passover in the evening, at sunset,
translation:
  language: de
  text: von Jahr zu Jahr. Und in den Tagen, wenn das Haus im Namen des HERRN im Land ihres Erbbesitzes gebaut ist, sollen sie dorthin gehen und am Abend, bei Sonnenuntergang, das Passa schlachten,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሔር፡ እምዓመት፡ በዓመት
  choice: von Jahr zu Jahr
  rationale: Gibt die wiederkehrende jährliche Einhaltung knapp und idiomatisch wieder; der Satz setzt offenbar den vorherigen Vers fort.
- source_word: ቤት
  choice: das Haus
  rationale: Im Kontext ist das Heiligtum beziehungsweise der Tempel gemeint; die formale Bezeichnung „Haus“ bewahrt jedoch die Ausdrucksweise der Quelle.
- source_word: በስመ፡ እግዚአብሔር
  choice: im Namen des HERRN
  rationale: Bewahrt die traditionelle Gottesnamenswiedergabe und die enge formale Entsprechung der Wendung.
- source_word: በምድረ፡ ርስትሙ
  choice: im Land ihres Erbbesitzes
  rationale: Gibt sowohl das Land als auch den Gedanken des erblich zugeteilten Besitzes wieder.
- source_word: ህየ፡ የሐሩ፡ ወይጥብሑ
  choice: sollen sie dorthin gehen und … schlachten
  rationale: Das Bewegungsverb የሐሩ („sie sollen gehen“) wird ausdrücklich wiedergegeben und mit ህየ („dort/dorthin“) natürlich verbunden.
- source_word: ጳስካ
  choice: das Passa
  rationale: Die im Deutschen etablierte biblische Bezeichnung für das Passafest beziehungsweise Passaopfer.
- source_word: ምሴተ፡ እንዘ፡ የዐርብ፡ ፀሐይ
  choice: am Abend, bei Sonnenuntergang
  rationale: Gibt die Zeitangabe natürlich und präzise wieder, ohne die beiden eng verbundenen Bestimmungen unnötig zu verschmelzen.
theological_decisions:
- issue: Bezeichnung des künftigen Heiligtums
  choice: das Haus
  alternative: der Tempel
  rationale: „Haus“ wahrt die Quellensprache und lässt den kultisch-theologischen Bezug erkennen, ohne ihn durch eine explizitere Deutung zu ersetzen.
- issue: Wiedergabe des Gottesnamens
  choice: HERR
  alternative: Herr
  rationale: Die Kapitälchenkonvention kennzeichnet den göttlichen Namen in einer deutschen Bibelübersetzung, ohne eine konfessionelle Sonderdeutung einzuführen.
translation_notes:
  register: Moderne, würdige Standardsprache mit biblischem Klang. Der eröffnende Satzrest und das abschließende Komma bleiben erhalten, da der Vers syntaktisch an den Kontext anschließt. Das in der Quelle belegte Bewegungsverb wird nicht ausgelassen.
