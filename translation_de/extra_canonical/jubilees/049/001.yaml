  yaml_path: translation/extra_canonical/jubilees/049/001.yaml
  text: 'Remember the command that the LORD commanded you concerning the Passover: that you should observe it at its appointed time, on the fourteenth day of the first month; that you should slaughter it before evening and that they should eat it.'
translation:
  language: de
  text: 'Erinnere dich an das Gebot, das der HERR dir in Bezug auf das Passafest geboten hat: Du sollst es zu seiner festgesetzten Zeit begehen, am vierzehnten Tag des ersten Monats; du sollst es schlachten, bevor es Abend wird, und sie sollen es essen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተዘከር
  choice: Denk an
  rationale: Gibt den Imperativ „erinnere dich/gedenke“ in natürlichem, würdigem modernem Deutsch wieder.
- source_word: ትእዛዘ፡ ዘአዘዘከ
  choice: das Gebot, das … dir … gegeben hat
  rationale: Bewahrt die figura etymologica von „Gebot/befehlen“ sinngemäß, vermeidet aber die im Deutschen schwerfällige Formulierung „das Gebot, das dir geboten wurde“.
- source_word: እግዚአብሔር
  choice: der HERR
  rationale: Die traditionelle Wiedergabe der Gottesbezeichnung passt zum biblischen Register und zur konsultierten englischen Fassung.
- source_word: በእንተ፡ ፋሲካ
  choice: in Bezug auf das Passafest
  rationale: Bezeichnet hier die Passafeier; „Passafest“ ist für moderne Leser klarer als das isolierte „Passa“.
- source_word: ከመ፡ ትግበር
  choice: Du sollst es … begehen
  rationale: Das Verb hat den Grundsinn „tun/machen“; im Zusammenhang eines Festes ist „begehen“ idiomatisch und erhält den kultischen Vollzug.
- source_word: በጊዜሁ
  choice: zu seiner festgesetzten Zeit
  rationale: Der Kontext verlangt den vorgeschriebenen Termin, nicht lediglich einen unspezifischen Zeitpunkt.
- source_word: አመ፡ ዐሡሩ፡ ወረቡዑ፡ ለወርኅ፡ ቀዳማዊ
  choice: am vierzehnten Tag des ersten Monats
  rationale: Direkte, klare Wiedergabe der Datumsangabe.
- source_word: ከመ፡ ትጥብቍ
  choice: du sollst es schlachten
  rationale: Im Passakontext bezeichnet das Verb das Schlachten des Opfertiers; das pronominale „es“ bewahrt die knappe Bezugnahme des Ausgangstextes.
- source_word: ዘእንበለ፡ ይምሰይ
  choice: bevor es Abend wird
  rationale: Gibt die zeitliche Grenze unmittelbar und natürlich wieder.
- source_word: ወከመ፡ ይብልዕዎ
  choice: und sie sollen es essen
  rationale: Bewahrt den auffälligen Wechsel von der zweiten Person Singular zur dritten Person Plural, ohne ihn harmonisierend aufzulösen.
theological_decisions:
- issue: Referent des pronominalen Objekts bei „schlachten“ und „essen“
  choice: Das Pronomen „es“ bleibt stehen.
  alternative: Explizit „das Passalamm“ einsetzen.
  rationale: Der ge’ezische Text nennt an dieser Stelle kein Lamm ausdrücklich. Die Explizierung wäre kontextuell plausibel, würde aber zusätzliche Information in den Haupttext eintragen.
- issue: Wechsel der angesprochenen Person
  choice: „du sollst … und sie sollen“
  alternative: Einheitlich „ihr sollt … und sollt“ oder „du sollst … und sollst“ formulieren.
  rationale: Der grammatische Wechsel ist im Ausgangstext vorhanden und kann auf den Einzelnen sowie die essende Gemeinschaft verweisen; er wird nicht stillschweigend geglättet.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur folgt der Abfolge des ge’ezischen Textes, wird jedoch durch Doppelpunkt und Semikolon lesbar gegliedert. Keine konfessionell geprägte Terminologie wurde ergänzt.
