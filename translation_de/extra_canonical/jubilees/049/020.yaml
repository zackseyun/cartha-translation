lexical_decisions:
- source_word: በሣልስቲ፡ ለዕለት
  choice: im dritten Teil des Tages
  rationale: Gibt die zeitliche Gliederung des Tages eng am geezischen Ausdruck wieder und bewahrt den Anschluss an den vorausgehenden Kontext.
- source_word: ምካይዳ፡ ለምሥዋዕ
  choice: an den Fuß des Altars
  rationale: Der Ausdruck bezeichnet hier den unteren Bereich beziehungsweise die Basis des Altars; „Fuß des Altars“ ist im Deutschen natürlich und kultisch verständlich.
- source_word: ሥብሖ
  choice: sein Fett
  rationale: Das Suffix wird auf das zuvor genannte Opfertier bezogen; „Fett“ ist die sachlich passende kultische Bezeichnung.
- source_word: ዐጸደ፡ ቤት
  choice: im Vorhof des Hauses
  rationale: „Vorhof“ gibt den umfriedeten Hofbereich präziser wieder als das allgemeinere „Hof“, während „Haus“ die Ausdrucksweise der Quelle bewahrt.
theological_decisions:
- issue: Bezeichnung des Heiligtums als „Haus“
  choice: Haus
  alternative: Tempel
  rationale: Die Quelle sagt wörtlich „Haus“. Die Übersetzung vermeidet die interpretierende Präzisierung zu „Tempel“ und erhält so die kultische Bildsprache.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Vorschriftsform wird mit „sollen“ wiedergegeben; der einleitende Satzteil bleibt als kontextabhängiger Anschluss kleingeschrieben. Das ergänzte „brennt“ macht im Deutschen natürlich deutlich, dass sich das Feuer auf dem Altar befindet, ohne den Sinn zu verändern.
