  source_fidelity: 'Der Entwurf gibt die geezische Satzfolge und die kultischen Handlungen zuverlässig wieder: Zeitangabe, Blut zum unteren Bereich des Altars, Fett auf das Feuer auf dem Altar und Verzehr des Fleisches im Hof des Hauses. „Fuß des Altars“ ist als deutsche Wiedergabe von „Basis/unterer Bereich des Altars“ vertretbar. Bei der Zubereitungsangabe ist jedoch „am Feuer gebraten“ die idiomatischere und zugleich quellennähere Wiedergabe von „mit/im Feuer geröstet“ als „im Feuer gebraten“, das im heutigen Deutsch ein Braten unmittelbar in den Flammen nahelegen kann.'
  naturalness: Die Sprache ist modern, sachlich und angemessen würdevoll. Die Satzverbindung ist flüssig. Die Anpassung von „im Feuer“ zu „am Feuer“ verbessert die natürliche deutsche Ausdrucksweise, ohne den kultischen Vorgang zu verändern.
  terminology: „Altar“, „Fett“, „Vorhof“ und „Haus“ sind terminologisch passend. „Haus“ wahrt die nicht weiter spezifizierende Ausdrucksweise der Quelle; „Vorhof“ gibt den umfriedeten Hofbereich präzise wieder. Die modale Form „sollen“ passt zu einer kultischen Vorschrift.
