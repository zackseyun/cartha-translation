review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Abfolge und die zentralen Kultbegriffe im Wesentlichen treffend wieder. „bei einem ihrer Stämme“ schwächt jedoch die örtliche Aussage „in einem ihrer Stämme“ ab. Außerdem sollte das Objekt von „schlachten“ nicht als „Passalamm“ präzisiert werden, da der Text nur mit einem Pronomen auf das zuvor genannte Passa zurückverweist.
  naturalness: Der Satz ist für einen bewusst schrift- und bibelnahen Registerton verständlich. Eine geringfügige Umstellung macht den zeitlichen Einschub („bis das Heiligtum ... erbaut ist“) klarer und vermeidet, dass er unmittelbar an „kommen“ gebunden erscheint.
  terminology: „Heiligtum“, „Zelt des HERRN“ und „Passa“ bewahren die kultische Terminologie und den Gegensatz zwischen Zelt und gebautem Heiligtum. „Passa begehen“ ist idiomatisch und weniger interpretierend als eine Ergänzung zu „Passalamm“.
  issues:
  - severity: medium
    issue: „bei einem ihrer Stämme“ statt „in einem ihrer Stämme“
    rationale: Die Quelle lokalisiert das Zelt innerhalb eines der Stämme; „bei“ kann eine bloße Nähe zu einem Stamm ausdrücken.
  - severity: medium
    issue: „das Passalamm“ ergänzt das Objekt von „schlachten“
    rationale: Das Ge’ez verwendet ein pronominales Objekt mit Bezug auf das Passa. Die explizite Benennung als Lamm ist zwar kontextuell naheliegend, aber eine nicht ausdrücklich markierte Präzisierung.
  - severity: low
    issue: Stellung des Einschubs mit „bis“
    rationale: Im Entwurf kann „bis das Heiligtum ... erbaut ist“ zunächst als Begrenzung von „kommen“ gelesen werden. Eine Umstellung verdeutlicht seinen Bezug auf die Aufstellung des Zeltes.
  revised_text: So steht es geschrieben und ist es angeordnet, dass sie es im Heiligtum des HERRN essen sollen. Wenn die Kinder Israels in das Land Kanaan kommen, das sie in Besitz nehmen sollen, und das Zelt des HERRN mitten im Land, in einem ihrer Stämme, aufstellen, bis das Heiligtum des HERRN im Land erbaut ist, sollen sie kommen, das Passa inmitten des Zeltes des HERRN begehen und es vor dem HERRN schlachten.
