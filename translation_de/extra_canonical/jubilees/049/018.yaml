- from: So steht es geschrieben und ist es angeordnet, dass sie es im Heiligtum des HERRN essen sollen. Wenn die Kinder Israels in das Land Kanaan kommen, das sie in Besitz nehmen sollen, und das Zelt des HERRN mitten im Land bei einem ihrer Stämme aufstellen, sollen sie, bis das Heiligtum des HERRN im Land erbaut ist, kommen und das Passafest inmitten seines Zeltes feiern und das Passalamm vor dem HERRN schlachten.
  to: So steht es geschrieben und ist es angeordnet, dass sie es im Heiligtum des HERRN essen sollen. Wenn die Kinder Israels in das Land Kanaan kommen, das sie in Besitz nehmen sollen, und das Zelt des HERRN mitten im Land, in einem ihrer Stämme, aufstellen, bis das Heiligtum des HERRN im Land erbaut ist, sollen sie kommen, das Passa inmitten des Zeltes des HERRN begehen und es vor dem HERRN schlachten.
