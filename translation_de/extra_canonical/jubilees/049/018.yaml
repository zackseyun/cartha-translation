base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/049/018.yaml
  text: Thus it is written and ordained that they should eat it in the sanctuary of the LORD. And when the children of Israel enter the land that they are to possess, in the land of Canaan, and they set up the tent of the LORD in the midst of the land, in one of their tribes, until the sanctuary of the LORD is built in the land, they shall come and observe the Passover in the midst of the tent of the LORD, and they shall slaughter it before the LORD.
translation:
  language: de
  text: So steht es geschrieben und ist es angeordnet, dass sie es im Heiligtum des HERRN essen sollen. Wenn die Kinder Israels in das Land Kanaan kommen, das sie in Besitz nehmen sollen, und das Zelt des HERRN mitten im Land, in einem ihrer Stämme, aufstellen, bis das Heiligtum des HERRN im Land erbaut ist, sollen sie kommen, das Passa inmitten des Zeltes des HERRN begehen und es vor dem HERRN schlachten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተጽሕፈ፡ ወተሠርዐ
  choice: steht es geschrieben und ist es angeordnet
  rationale: Bewahrt die beiden passivischen Aussagen über schriftliche Festlegung und verbindliche Anordnung in natürlichem, würdigem Deutsch.
- source_word: በቤተ፡ መቅደሱ፡ ለእግዚአብሔር
  choice: im Heiligtum des HERRN
  rationale: Gibt die kultische Ortsangabe knapp wieder; die Gottesbezeichnung wird entsprechend deutscher Bibeltradition als HERR wiedergegeben.
- source_word: ደብተራ፡ እግዚአብሔር
  choice: das Zelt des HERRN
  rationale: Der Ausdruck bezeichnet hier das kultische Zelt vor dem späteren Bau des Heiligtums; „Zelt“ wahrt den Kontrast zum festen Heiligtum.
- source_word: ይገብሩ፡ ጳስካ
  choice: das Passafest feiern
  rationale: Die Verbindung bedeutet idiomatisch, das Passa zu halten bzw. zu begehen; „feiern“ ist modernes, allgemein verständliches Deutsch.
- source_word: ይጠብኅዎ
  choice: das Passalamm schlachten
  rationale: Das pronominale Objekt bezieht sich im Zusammenhang auf das Passaopfer. „Passalamm“ macht den deutschen Bezug verständlich, ohne eine zusätzliche theologische Deutung einzuführen.
theological_decisions:
- issue: Bezeichnung Gottes
  choice: HERR
  alternative: Herr / der Herr
  rationale: Die traditionelle Kapitälchenschreibung kennzeichnet die Gottesbezeichnung und entspricht dem würdigen bibelsprachlichen Register.
- issue: Verhältnis von Zelt und Heiligtum
  choice: Zelt des HERRN bis zum Bau des Heiligtums
  alternative: Stiftshütte bis zum Bau des Tempels
  rationale: Die allgemeineren Quellbegriffe werden beibehalten. „Stiftshütte“ und „Tempel“ würden stärker terminologisch harmonisieren und mögliche Bedeutungsbreiten einengen.
- issue: Ort innerhalb der Stammesordnung
  choice: bei einem ihrer Stämme
  alternative: in einem ihrer Stammeslager
  rationale: Der äthiopische Ausdruck kann auf Stamm bzw. dessen Heerlagerung bezogen werden. Die gewählte Form folgt dem unmittelbaren Sinnzusammenhang, ohne eine bestimmte Lagerordnung auszudeuten.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem biblischem Ton. Der lange Satzbau des Ausgangstextes wurde behutsam gegliedert, die zeitliche Konstruktion jedoch bewahrt. Keine konfessionell geprägten Fachbegriffe wurden eingeführt.
