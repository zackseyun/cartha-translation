review_pass:
  verdict: revise
  source_fidelity: 'Der Sinn des ge''ezischen Textes ist weitgehend getroffen: die Passaordnung, das Fest der ungesäuerten Brote, sieben Tage ungesäuertes Brot, die tägliche Opfergabe und die abschließenden sieben Tage der Freude sind korrekt wiedergegeben. »Schärfe es ihnen ... ein, auch das Fest« bildet jedoch die textliche Gliederung und den Bezug auf das Fest weniger genau ab. Das Verb fügt einen nachdrücklichen Ton hinzu, und »auch« ist für den sachbezogenen Anschluss nicht die beste Wiedergabe.'
  naturalness: Der Text ist insgesamt modernes, würdiges Deutsch. Der mittlere Satz ist syntaktisch etwas holprig, da sich »es« zunächst auf die Passaordnung bezieht, während »auch das Fest« angehängt erscheint. Eine direkte Formulierung mit »über das Fest« ist klarer und natürlicher.
  terminology: »Israeliten«, »Passafest«, »Ordnung«, »ungesäuertes Brot« und »Opfergabe« sind angemessen. »Freudentage« gibt ፍሥሓ korrekt als Freude/Jubel wieder und sollte nicht zu »Festtage« abgeschwächt werden. »Dafür bestimmte« ist nicht erforderlich, da der Text lediglich von dessen Opfergabe spricht.
  issues:
  - severity: medium
    issue: Zusatzton und ungenauer Anschluss in »Schärfe es ihnen Jahr für Jahr und Tag für Tag ein, auch das Fest ...«
    rationale: Der Ausgangstext fordert Mose auf, es ihnen fortlaufend mitzuteilen und nennt anschließend das Fest der ungesäuerten Brote als Gegenstand der Unterweisung. »Einschärfen« verstärkt den Ton, während »auch« den Bezug weniger präzise ausdrückt. »Unterweise sie ... über das Fest« gibt den Zusammenhang idiomatisch und ohne Zusatz wieder.
  - severity: low
    issue: »die dafür bestimmte Opfergabe« ist leicht interpretierend
    rationale: Das ge'ezische ቍርባኖ bezeichnet eine Opfergabe; der possessive Bezug wird besser schlicht als »die Opfergabe dafür« wiedergegeben, ohne eine besondere Bestimmung zu behaupten.
  revised_text: 'Und du, Mose, gebiete den Israeliten, die Ordnung des Passafestes so einzuhalten, wie dir geboten wurde. Unterweise sie Jahr für Jahr und Tag für Tag über das Fest der ungesäuerten Brote: Sie sollen sieben Tage lang ungesäuertes Brot essen, das Fest feiern und an jedem dieser sieben Freudentage die Opfergabe dafür darbringen.'
