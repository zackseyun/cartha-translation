  yaml_path: translation/extra_canonical/jubilees/049/022.yaml
  text: And you, Moses, command the children of Israel to keep the ordinance of the Passover as it was commanded to you; tell them year by year, and day by day, and concerning the feast of unleavened bread, that they should eat unleavened bread for seven days, that they should observe its feast, and that they should bring its offering day by day during those seven days of rejoicing.
translation:
  language: de
  text: 'Und du, Mose, gebiete den Israeliten, die Ordnung des Passafestes so einzuhalten, wie dir geboten wurde. Unterweise sie Jahr für Jahr und Tag für Tag über das Fest der ungesäuerten Brote: Sie sollen sieben Tage lang ungesäuertes Brot essen, das Fest feiern und an jedem dieser sieben Freudentage die Opfergabe dafür darbringen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሥርዐተ፡ ጳስካ
  choice: die Ordnung des Passafestes
  rationale: ሥርዐት bezeichnet eine festgesetzte Ordnung oder Satzung; ጳስካ ist das Passa. Die Formulierung ist präzise und im modernen Deutsch verständlich.
- source_word: ለውሉደ፡ እስራኤል
  choice: den Israeliten
  rationale: Wörtlich »den Kindern/Söhnen Israels«; »den Israeliten« gibt den kollektiven Sinn natürlich und ohne unnötigen Archaismus wieder.
- source_word: በዓለ፡ ፍአት
  choice: das Fest der ungesäuerten Brote
  rationale: Die Wendung bezeichnet das Fest, dessen Kennzeichen das ungesäuerte Brot ist.
- source_word: ቍርባኖ
  choice: die dafür bestimmte Opfergabe
  rationale: Das Wort bezeichnet eine dargebrachte Gabe beziehungsweise Opfergabe. »Dafür bestimmt« macht den Bezug auf das Fest deutlich, ohne eine bestimmte Opferart einzutragen.
- source_word: መዋዕለ፡ ፍሥሓ
  choice: Freudentage
  rationale: ፍሥሓ bedeutet Freude, Fröhlichkeit oder Jubel, nicht »Fest«. Das Kompositum bewahrt diesen Sinn in natürlichem Deutsch.
theological_decisions:
- issue: Verbindlichkeit der Passaordnung
  choice: »die Ordnung des Passafestes so einzuhalten, wie es dir geboten wurde«
  alternative: »die Satzung des Passa zu halten, wie sie dir geboten worden ist«
  rationale: Die gewählte Form wahrt den verpflichtenden Charakter des göttlichen Gebots, ohne durch »Satzung« einen unnötig juristischen oder konfessionell geprägten Ton einzuführen.
- issue: Art der Opfergabe
  choice: allgemein »Opfergabe«
  alternative: eine näher bestimmte kultische Opferart
  rationale: Der Ausgangstext nennt keine konkrete Opferart; eine solche Präzisierung wäre eine unbelegte theologische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die imperativische Unterweisung und die kultische Terminologie bleiben erhalten; schwerfällige wörtliche Hebraismen wie »Kinder Israels« werden vermieden. Der vorangestellte Textrest vor »Und du, Mose« gehört aufgrund der Kapitel-/Versaufteilung zum vorausgehenden Zusammenhang und wurde entsprechend der validierten Versgrenze nicht in JUB.49.22 aufgenommen.
