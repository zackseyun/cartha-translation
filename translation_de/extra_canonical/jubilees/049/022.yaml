revisions:
- from: 'Und du, Mose, gebiete den Israeliten, die Ordnung des Passafestes so einzuhalten, wie es dir geboten wurde. Schärfe es ihnen Jahr für Jahr und Tag für Tag ein, auch das Fest der ungesäuerten Brote: Sie sollen sieben Tage lang ungesäuertes Brot essen, das Fest feiern und an jedem einzelnen dieser sieben Freudentage die dafür bestimmte Opfergabe darbringen.'
  to: 'Und du, Mose, gebiete den Israeliten, die Ordnung des Passafestes so einzuhalten, wie dir geboten wurde. Unterweise sie Jahr für Jahr und Tag für Tag über das Fest der ungesäuerten Brote: Sie sollen sieben Tage lang ungesäuertes Brot essen, das Fest feiern und an jedem dieser sieben Freudentage die Opfergabe dafür darbringen.'
  rationale: Die Überarbeitung beseitigt den durch »einschärfen« hinzugefügten Nachdruck und macht deutlich, dass die fortlaufende Unterweisung auch das Fest der ungesäuerten Brote betrifft. Die Opfergabe bleibt absichtlich unbestimmt. Die sieben »Freudentage« bewahren die Bedeutung von ፍሥሓ (Freude, Jubel).
