base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/047/009.yaml
  text: And wages were paid, and she nursed you. And after this, when you had grown up, they brought you to Pharaoh’s daughter, and you became her son. And your father Amram taught you writing, and when you had completed three weeks of years, he brought you into the court.
translation:
  language: de
  text: Und der Lohn wurde gezahlt, und sie stillte dich. Danach, als du herangewachsen warst, brachten sie dich zur Tochter des Pharaos, und du wurdest ihr Sohn. Dein Vater Amram lehrte dich das Schreiben. Als du drei Jahrwochen[a] vollendet hattest, brachte er dich an den Hof.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »drei Wochen«, das heißt drei Zeiträume von je sieben Jahren, insgesamt einundzwanzig Jahre.'
    reason: Der äthiopische Wortlaut nennt »Wochen«; der Kontext des Jubiläenbuches zeigt, dass Jahrwochen gemeint sind.
lexical_decisions:
- source_word: ዐስበ
  choice: der Lohn wurde gezahlt
  rationale: Das Verb bezeichnet hier im Zusammenhang mit der Stillung des Kindes die Zahlung eines Lohns; die unpersönliche deutsche Form bewahrt, dass im überlieferten Wortlaut kein ausdrückliches Subjekt genannt ist.
- source_word: ሐፀነተከ
  choice: sie stillte dich
  rationale: Die feminine Verbform verweist auf eine Frau und bezeichnet hier, im Kontext der Säuglingspflege, das Stillen beziehungsweise Nähren.
- source_word: ልሂቀከ
  choice: als du herangewachsen warst
  rationale: Gibt das Erwachsen- oder Großwerden wieder und vermeidet die nicht im Text genannte Beteiligung der Schwester.
- source_word: ወሰዱከ
  choice: brachten sie dich
  rationale: Die Pluralform wird ausdrücklich bewahrt; das Ziel wird mit »zur Tochter des Pharaos« natürlich deutsch angeschlossen.
- source_word: መጽሐፈ
  choice: das Schreiben
  rationale: Im Satz bezeichnet der Ausdruck die von Amram vermittelte Schrift- beziehungsweise Schreibkunde; »das Schreiben« ist verständlich und vermeidet eine unbelegte Festlegung auf ein bestimmtes Buch.
- source_word: ሠለስተ፡ ሱባዔ
  choice: drei Jahrwochen
  rationale: Im chronologischen Sprachgebrauch des Jubiläenbuches sind drei Siebenerzeiträume von Jahren gemeint, also einundzwanzig Jahre.
- source_word: ዐጸደ
  choice: Hof
  rationale: Der Ausdruck bezeichnet hier den Hof beziehungsweise Hofbezirk; der knappe deutsche Begriff passt zum Zusammenhang am ägyptischen Königshof.
