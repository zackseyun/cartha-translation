lexical_decisions:
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Im chronologischen System des Jubiläenbuches bezeichnet der Ausdruck eine Siebenjahresperiode; „Jahrwoche“ macht diese Bedeutung im Deutschen klar und bewahrt die Gliederung Jubiläum > Jahrwoche > Jahr.
- source_word: ኢዮቤልዉ
  choice: Jubiläum
  rationale: Der Ausdruck bezeichnet hier die chronologische Einheit eines Jubiläumszeitraums, nicht eine moderne Jubiläumsfeier.
- source_word: ድረ፡ ከናአን
  choice: Land Kanaan
  rationale: Natürliche und traditionsübergreifend verständliche Wiedergabe der geografischen Bezeichnung.
