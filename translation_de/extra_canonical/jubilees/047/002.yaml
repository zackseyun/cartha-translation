review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des ge''ezischen Textes zutreffend wieder: die Zeit der Bedrängnis, die Israeliten, Pharao als König Ägyptens, den allgemeinen Ausdruck für ihre Kinder/Nachkommen mit der anschließenden Präzisierung auf jedes männliche Neugeborene sowie den unbestimmten »Fluss«. Die Formulierung des Befehls sollte jedoch so gestaltet werden, dass Pharao nicht unnötig selbst als Ausführender des Hineinwerfens erscheint.'
  naturalness: »Er erließ gegen sie den Befehl, ... zu werfen« ist im Deutschen sowohl stilistisch schwerfällig als auch in der Zuordnung des Infinitivs missverständlich. Eine Passivkonstruktion gibt den angeordneten Vorgang idiomatisch wieder, ohne einen im Ausgangstext nicht ausdrücklich benannten Ausführenden festzulegen.
  terminology: »Bedrängnis«, »Kinder Israels«, »Pharao, König von Ägypten«, »männlicher Nachkomme« und »Fluss« sind angemessen. Die Beibehaltung von »Fluss« statt einer Ergänzung zu »Nil« wahrt die Wortwahl des Ausgangstextes.
  issues:
