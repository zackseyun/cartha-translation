    issue: Mehrdeutige Infinitivkonstruktion nach »erließ ... den Befehl«
    rationale: Die Wendung kann nahelegen, Pharao selbst solle die Kinder in den Fluss werfen. Der ge'ezische Text berichtet dagegen von einem Befehl über die Israeliten und verwendet für das Hineinwerfen eine Pluralform, ohne die Ausführenden im deutschen Text sicher benennen zu müssen.
  revised_text: Das war eine Zeit der Bedrängnis für die Kinder Israels. Und der Pharao, König von Ägypten, ordnete in Bezug auf sie an, dass alle ihre Kinder – jeder männliche Nachkomme, der geboren wurde – in den Fluss geworfen werden sollten.
