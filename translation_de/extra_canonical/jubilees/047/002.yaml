  yaml_path: translation/extra_canonical/jubilees/047/002.yaml
  text: That was a time of affliction upon the children of Israel, and Pharaoh, king of Egypt, commanded concerning them that they should throw all their children, every male that was born, into the river.
translation:
  language: de
  text: Das war eine Zeit der Bedrängnis für die Kinder Israels. Und der Pharao, König von Ägypten, ordnete in Bezug auf sie an, dass alle ihre Kinder – jeder männliche Nachkomme, der geboren wurde – in den Fluss geworfen werden sollten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መዋዕለ፡ ምንዳቤ
  choice: eine Zeit der Bedrängnis
  rationale: Gibt die zeitliche Wendung und das Leid Israels in natürlichem, würdevollem Deutsch wieder.
- source_word: ውሉደ፡ እስራኤል
  choice: die Kinder Israels
  rationale: Bewahrt die traditionelle, im biblischen Deutsch verständliche Bezeichnung für die Israeliten.
- source_word: ንጉሠ፡ ግብጽ፡ ፈርዖን
  choice: der Pharao, der König von Ägypten
  rationale: Gibt Titel und Herrschaftsbereich vollständig und in natürlicher deutscher Wortfolge wieder.
- source_word: ውሉዶሙ፡ ኵሎ
  choice: alle ihre Kinder
  rationale: Das Substantiv bezeichnet allgemein ihre Kinder beziehungsweise Nachkommen; die anschließende Apposition schränkt den Befehl auf die männlichen Neugeborenen ein.
- source_word: ኵሎ፡ ርሰ፡ ዘተወልደ
  choice: jeden männlichen Nachkommen, der geboren wurde
  rationale: Spiegelt die erläuternde Spezifizierung des Ge'ez wider, ohne das vorausgehende allgemeine Wort für Kinder vorschnell als »Söhne« zu übersetzen.
- source_word: ፈለግ
  choice: den Fluss
  rationale: Im ägyptischen Erzählzusammenhang ist der Nil gemeint; der Ausgangstext verwendet jedoch den allgemeinen Ausdruck »Fluss«, der im Haupttext erhalten bleibt.
theological_decisions:
- issue: Umfang des Tötungsbefehls
  choice: »alle ihre Kinder – jeden männlichen Nachkommen«
  alternative: »alle ihre Söhne«
  rationale: Die Übersetzung wahrt die Spannung zwischen dem zunächst allgemeinen Ausdruck für Kinder/Nachkommen und der folgenden ausdrücklichen Beschränkung auf männliche Neugeborene.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Gedankenstrich kennzeichnet die nachgestellte Präzisierung des Befehls; es sind keine Fußnoten erforderlich.
