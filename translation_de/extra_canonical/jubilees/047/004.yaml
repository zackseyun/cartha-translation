source:
  edition: charles_1895
  language: Geez
  text: '1. ወበሱባዔ፡ ሳብዕ፡ ዘሳብዕ፡ ዓመት፡ በዘአርብዓ፡ ወሰብዓቱ፡ ኢዮቤልዉ፡ መጽአ፡ አቡከ፡ እምድረ፡ ከናአን፡ ወተወለድከ፡ በራብዕ፡ ሱባዔ፡ በሳድስ፡ ዓመት፡ በዘአርብዓ፡ ወስመንቱ፡

    2. ኢዮቤልው፡ ዘውእቱ፡ መዋዕለ፡ ምንዳቤ፡ ላዕለ፡ ውሉደ፡ እስራኤል። ወአዘዘ፡ ንጉሠ፡ ግብጽ፡ ፈርዖን፡ ትእዛዘ፡ ላዕሌሆሙ፡ ከመ፡ ይግድፉ፡ ውሉዶሙ፡ ኵሎ፡ ርሰ፡ ዘተወልደ፡ ውስተ፡ ፈለግ።

    3. ወነበሩ፡ እንዘ፡ ይገድፉ፡ ሰብዐተ፡ ወርኀ፡ እስከ፡ አመ፡ ዕለተ፡ ተወለድከ፡ ወንብአትከ፡ እምከ፡ ሤለስተ፡ ወርኀ፡ ወገነሩ፡ በእንቲአሃ። ወገብረት፡ ለከ፡ ሤፍተ፡ ወለበጠታ፡ ፒሳ፡ ወአስፋ ልጠ፡ ወአንበረቶ፡ *ውስተ፡ ሣዕር፡ ኀበ፡ ድንጋገ፡ ፈለግ፡ ወአንበረተከ፡ ውስቴታ፡ ሰቡዐ፡ መዋዕለ፡ ወእምከ፡ *ትመጽእ፡ በሌሊት፡ ወታጠብወከ፡ ወመዓልተ፡ ትዐቅበከ፡ ማርያ፡

    5. እኅትከ፡ እምነ፡ አዕዋፍ። ወበውእቱኒ፡ መዋዕል፡ ወጽአት፡ ታርሙት፡ ወስተ፡ ፈርዖን፡ ከመ፡ ትትሐፀብ፡ በውስተ፡ ፈለግ፡ ወሰምዐት፡ ቃለከ፡ እንዘ፡ ትበኪ፡ ወትቤ፡ ለዕብራዊያቲሃ፡

    6. ፯ ከመ፡ ያምጽአከ፡ ወአምጽአከ፡ ኀቤሃ። ወአውፅአተከ፡ እምሤፍቅ፡ ወመሐረተከ። ወትቤላ፡ እኅትከ፡ እሖርኑ፡ ወእጸውዕ፡ ለኪ፡ አሐተ፡ እምነ፡ ዕብራዊያት፡ *እንተ፡ ታሐፅኖ፡ ወታጠብዎ፡

    8. ለኪ፡ ለዝሕፃን፡ *ወትቤላ፡ ሑሪ። ወሖረት፡ ወጸውዐታ፡ ለእምከ፡ ለአዮካቤድ፡ ወወሀበታ፡

    9. ዐስበ፡ ወሐፀነተከ። ወእምዝ፡ ልሂቀከ፡ ወሰዱከ፡ ለወለተ፡ ፈርዖን፡ ወኮንከ፡ ውሉዳ፡ ወመሀረከ፡ ዕብራን፡ አቡከ፡ መጽሐፈ፡ ወእምከ፡ ፈጸምከ፡ ሠለስተ፡ ሱባዔ፡ አብአከ፡ ውስተ፡ ዐጸደ፡

    10. ፲ መንግሥት። ወሀሎከ፡ ውስተ፡ ዐጸድ፡ ሠለስተ፡ ሱባዔ፡ ዓመተ፡ እስከ፡ መዋዕለ፡ አመ፡ ወፃእከ፡ እምዐጸደ፡ መንግሥት፡ ወርኢኮ፡ ለግብጻዊ፡ እንዘ፡ *ይዘብጦ፡ ለካልእከ፡ *ዘእምነ፡

    11. ውሉደ፡ እስራኤል። ወቀተልኮ፡ ወኀባእኮ፡ ውስተ፡ ኆፃ። ወበሳኒታ፡ ዕለት፡ ረከብከ፡ ፪እንዘ፡ ይትበአሱ፡ እምውሉደ፡ እስራኤል፡ ወትቤሎ፡ ለዝ፡ ዘይትአገሎ፡ ለምንት፡ ትዘብጥ፡

    12. እኅዋከ። ወተምዐዐ፡ ወተቈጥዐ፡ ወይቤ፡ መኑ፡ ሤመከ፡ መልአከ፡ ወመኰንነ፡ ላዕሌነ፡ ወሚመ፡ ትቀትለኒ፡ *ትፈቅድ፡ በከመ፡ ቀተልኮ፡ ትማልም፡ ለግብጻዊ። ወፈራህከ፡ ወጐየይከ፡ እምቅድመ፡ ዝንቱ፡ ነገር።

    48. ወበሳድስ፡ ዓመት፡ ዘሱባዔ፡ ሣልስ፡ ዘአርብዓ፡ ወተስዓቱ፡ ኢዮቤልውሳት፡ ሖርከ፡ ወነበርከ፡ *ውስተ፡ ምድረ፡ ምድያም፡ ፭ሱባዔ፡ ወዓመተ፡ አሐደ፡ ወገባእከ፡ ውስተ፡ ግብጽ፡ በሱባዔ፡'
