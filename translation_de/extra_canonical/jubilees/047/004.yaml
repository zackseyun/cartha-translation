  text: And in those days Tarmuth[4], the daughter of Pharaoh, came to bathe in the river, and she heard your voice as you were weeping, and she said to her maidservants,
translation:
  language: de
  text: Und in jenen Tagen kam Tarmut, die Tochter des Pharaos, um im Fluss zu baden. Sie hörte deine Stimme, als du weintest, und sagte zu ihren Dienerinnen:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In der Ge'ez-Ausgabe ist die Zeilenzählung im vorliegenden Auszug verschoben. Die Erzählung läuft ohne Unterbrechung weiter; dieser Satz wird daher gemäß der Kapitelabfolge als Vers 4 wiedergegeben.
    reason: segmentation_note
