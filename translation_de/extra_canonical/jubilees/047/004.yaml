- source_word: ወስተ፡ ፈርዖን
  choice: die Tochter des Pharaos
  rationale: Die überlieferte Form wird im narrativen Zusammenhang als Verwandtschaftsbezeichnung verstanden, wie auch die antike Texttradition und der Fortgang der Erzählung nahelegen.
- source_word: ትትሐፀብ
  choice: um … zu baden
  rationale: Gibt Zweck und Bedeutung des ge'ezischen Verbs natürlich und präzise wieder.
- source_word: ለዕብራዊያቲሃ
  choice: zu ihren Dienerinnen
  rationale: Der Ausdruck bezeichnet hier die weiblichen Begleiterinnen beziehungsweise Dienerinnen; die Übersetzung folgt dem Erzählzusammenhang, ohne eine ethnische Deutung einzutragen.
