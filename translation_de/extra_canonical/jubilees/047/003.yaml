  yaml_path: translation/extra_canonical/jubilees/047/003.yaml
  text: And they continued casting them in for seven months[3], until the day when you were born. And your mother hid you for three months, and they became aware of her because of you. And she made for you a basket, and coated it with pitch and asphalt, and placed it among the reeds by the bank of the river, and put you in it for seven days. And your mother came by night and nursed you, and by day Miriam your sister guarded you from the birds.
translation:
  language: de
  text: Und sieben Monate lang fuhren sie fort, sie hineinzuwerfen, bis zu dem Tag, an dem du geboren wurdest. Deine Mutter verbarg dich drei Monate lang; doch deinetwegen wurde man auf sie aufmerksam. Da machte sie dir einen Korb, bestrich ihn mit Pech und Asphalt und stellte ihn ins Schilf am Ufer des Flusses. Sie legte dich für sieben Tage hinein. Deine Mutter kam nachts und stillte dich, und tagsüber bewachte dich Mirjam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der vorliegende ge’ezische Wortlaut endet knapp mit „Mirjam“: „Und tagsüber bewachte dich Mirjam.“ Die Ergänzungen „deine Schwester“ und „vor den Vögeln“, die in manchen Übersetzungen erscheinen, stehen in dem hier zugrunde gelegten Wortlaut nicht ausdrücklich.'
    reason: segmentation_note
lexical_decisions:
- source_word: ይገድፉ
  choice: sie hineinzuwerfen
  rationale: Das Verb bezeichnet hier das fortgesetzte Hineinwerfen; das im Zusammenhang erschlossene Objekt bleibt wie im Ausgangstext durch das Pronomen unbestimmt.
- source_word: ሤፍተ
  choice: Korb
  rationale: Bezeichnet das für das Kind angefertigte Behältnis; „Korb“ ist im Deutschen natürlich und entspricht dem erzählerischen Zusammenhang.
- source_word: ፒሳ፡ ወአስፋልጠ
  choice: Pech und Asphalt
  rationale: Gibt die beiden ausdrücklich genannten Abdichtungsstoffe getrennt und sachlich wieder.
- source_word: ውስተ፡ ሣዕር
  choice: ins Schilf
  rationale: Im Flussufer-Kontext ist „Schilf“ die natürliche Wiedergabe der Vegetation.
- source_word: ታጠብወከ
  choice: stillte dich
  rationale: Das Verb bezeichnet hier das Säugen beziehungsweise Stillen des Kindes.
- source_word: ትዐቅበከ
  choice: bewachte dich
  rationale: Bewahrt den schlichten Sinn von hüten, bewachen oder auf jemanden achten, ohne eine nicht ausdrücklich genannte Gefahr in den Haupttext einzutragen.
