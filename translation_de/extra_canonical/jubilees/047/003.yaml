  source_fidelity: 'Der deutsche Text gibt die Abfolge und die wesentlichen Einzelheiten des ge’ezischen Wortlauts zuverlässig wieder: fortgesetztes Hineinwerfen über sieben Monate, Verbergen des Kindes für drei Monate, Entdeckung der Mutter wegen des Kindes, Korb mit Pech und Asphalt, Schilf am Flussufer, sieben Tage im Korb sowie nächtliches Stillen und Mirjams Bewachen am Tag. Das unbestimmte Objekt von „hineinzuwerfen“ bleibt angemessen unbestimmt. Die Übersetzung folgt damit dem zugrunde gelegten ge’ezischen Text genauer als die englische Konsultationsfassung, deren Zusätze „deine Schwester“ und „vor den Vögeln“ im vorliegenden Wortlaut nicht ausgedrückt sind.'
