  text: '...to bring you, and he brought you to her. And she took you out of the basket and had compassion on you. And your sister said to her, “Shall I go and call for you one of the Hebrew women, who will rear him and nurse him?”'
translation:
  language: de
  text: '… um dich zu bringen, und er brachte dich zu ihr.[a] Sie nahm dich aus dem Korb und hatte Erbarmen mit dir. Da sagte deine Schwester zu ihr: »Soll ich gehen und dir eine von den hebräischen Frauen rufen, die ihn aufzieht und stillt?«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Vers beginnt mitten in einem Satz und setzt den Gedanken des vorhergehenden Verses fort.
    reason: Der fragmentarische Versanfang wird durch die Auslassungspunkte sichtbar gemacht, ohne den fehlenden Zusammenhang ergänzend auszudeuten.
  - marker: b
    text: 'Wörtlich mit zwei Verben: »die ihn aufzieht und ihn stillt«.'
    reason: Hebt hervor, dass der Ausgangstext zwei Tätigkeiten nennt; im Haupttext wird die im Deutschen natürliche Vermeidung der doppelten Objektangabe gewählt.
lexical_decisions:
- source_word: አውፅአተከ፡ እምሤፍቅ
  choice: Sie nahm dich aus dem Korb
  rationale: Gibt die Herausnahme aus dem Behältnis natürlich und in Übereinstimmung mit dem Erzählzusammenhang wieder.
- source_word: መሐረተከ
  choice: hatte Erbarmen mit dir
  rationale: Bewahrt den ausdrücklichen Gedanken des Erbarmens, statt ihn zu einem bloßen Gefühl des Mitleids abzuschwächen.
- source_word: ታሐፅኖ፡ ወታጠብዎ
  choice: die ihn aufzieht und stillt
  rationale: 'Die beiden Verben bezeichnen unterschiedliche, eng verbundene Tätigkeiten: das Aufziehen beziehungsweise Versorgen des Kindes und das Stillen. Beide werden daher wiedergegeben.'
