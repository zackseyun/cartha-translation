  to: 'deinen Bruder. Da wurde er zornig und geriet in Wut und sagte: »Wer hat dich zum Herrscher und Richter über uns eingesetzt? Willst du mich etwa töten, wie du gestern den Ägypter getötet hast?« Da bekamst du Angst und flohst wegen dieser Sache.'
  rationale: Eine minimale stilistisch-semantische Korrektur ersetzt »empörte sich« durch »geriet in Wut«, um die doppelte Zornesbezeichnung des Geʿez ohne zusätzliche Konnotation eines Protestes wiederzugeben. Die unzutreffende englische Fußnote wird nicht übernommen; für den deutschen Vers besteht kein begründeter Fußnotenbedarf.
