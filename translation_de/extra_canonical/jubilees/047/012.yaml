    rationale: Der vorgelegte geʿezische Vers enthält den vollständigen hier zu übersetzenden Wortlaut und endet mit »dieser Sache«. Die englische Fußnote ist daher weder inhaltlich auf diesen Vers anwendbar noch als deutsche Fußnote zu übernehmen. Im deutschen Text ist kein Fußnotenanker erforderlich.
