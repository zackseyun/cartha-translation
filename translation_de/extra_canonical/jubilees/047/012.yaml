  yaml_path: translation/extra_canonical/jubilees/047/012.yaml
  text: Your brother. And he became angry and was indignant and said[12], “Who appointed you a ruler and a judge over us? Do you intend to kill me as you killed the Egyptian yesterday?” And you feared and fled because of this matter.
translation:
  language: de
  text: 'deinen Bruder. Da wurde er zornig und geriet in Wut und sagte: »Wer hat dich zum Herrscher und Richter über uns eingesetzt? Willst du mich etwa töten, wie du gestern den Ägypter getötet hast?« Da bekamst du Angst und flohst wegen dieser Sache.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተምዐዐ፡ ወተቈጥዐ
  choice: wurde zornig und empörte sich
  rationale: Die beiden parallelen Verben bezeichnen Zorn beziehungsweise heftige Entrüstung. Die Wiedergabe bewahrt die Verstärkung, ohne daraus einen gegenseitigen Streit zu machen.
- source_word: መልአከ፡ ወመኰንነ
  choice: Herrscher und Richter
  rationale: Das Wortpaar bezeichnet hier politische Autorität und richterliche Gewalt und entspricht der tradierten Frage in Exodus 2,14.
- source_word: ትፈቅድ
  choice: Willst du ... etwa
  rationale: Das Verb drückt Wollen oder Beabsichtigen aus; »etwa« gibt im Deutschen den vorwurfsvollen Ton der Frage natürlich wieder.
- source_word: እምቅድመ፡ ዝንቱ፡ ነገር
  choice: wegen dieser Sache
  rationale: Die Wendung bezeichnet den auslösenden Grund für Furcht und Flucht; eine mechanische Wiedergabe mit »vor« wäre im modernen Deutschen weniger klar.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzanfang bleibt als Fragment »deinen Bruder.« erhalten, weil auch der vorgelegte ge’ezische Vers mitten im vorausgehenden Satz einsetzt. Die direkte Anrede an Mose und der Wechsel zur zweiten Person werden beibehalten.
