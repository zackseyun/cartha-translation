  source_fidelity: 'Der Entwurf gibt den geʿezischen Text insgesamt genau wieder: das Satzfragment »deinen Bruder«, die doppelte Zornesreaktion, die Frage nach Einsetzung zum Herrscher und Richter, die Tötungsabsicht, »gestern« sowie Furcht und Flucht. »empörte sich« ist jedoch weniger präzise, da es im Deutschen leicht ein protestierendes oder moralisch entrüstetes Handeln bezeichnet; die beiden geʿezischen Verben schildern vielmehr gesteigerten Zorn bzw. Erregung.'
