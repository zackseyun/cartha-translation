  yaml_path: translation/extra_canonical/jubilees/047/011.yaml
  text: And you killed him and hid him in the sand. And on the second day you found two of the sons of Israel fighting, and you said to the one who was doing wrong, “Why are you striking?”
translation:
  language: de
  text: 'Und du tötetest ihn und verbargst ihn im Sand. Am zweiten Tag fandest du zwei Israeliten, die sich stritten, und du sagtest zu dem, der Unrecht tat: »Warum schlägst du?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወቀተልኮ
  choice: Und du tötetest ihn
  rationale: Gibt das finite Verb mit dem im Kontext vorausgesetzten männlichen Objekt direkt wieder.
- source_word: ወኀባእኮ፡ ውስተ፡ ኆፃ
  choice: und verbargst ihn im Sand
  rationale: Bewahrt die Bedeutung von ‚verbergen‘ und den ausdrücklich genannten Ort beziehungsweise Stoff ‚Sand‘, ohne das stärkere ‚begraben‘ einzuführen.
- source_word: ወበሳኒታ፡ ዕለት
  choice: Am zweiten Tag
  rationale: Natürliche deutsche Wiedergabe der Zeitangabe.
- source_word: እንዘ፡ ይትበአሱ
  choice: die miteinander kämpften
  rationale: Die Umstandskonstruktion beschreibt die beiden Männer als im Streit beziehungsweise Kampf begriffen.
- source_word: ዘይትአገሎ
  choice: dem, der im Unrecht war
  rationale: Gibt die substantivierte Charakterisierung des schuldhaft Handelnden idiomatisch wieder, ohne ein nicht ausdrücklich genanntes konkretes Vergehen festzulegen.
- source_word: ለምንት፡ ትዘብጥ
  choice: Warum schlägst du?
  rationale: Folgt dem überlieferten Versende ohne ein im gegebener Ge’ez-Text nicht vorhandenes Objekt wie ‚deinen Gefährten‘ zu ergänzen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Anrede im Präteritum. Der anfängliche Ausdruck ውሉደ፡ እስራኤል wurde nicht aufgenommen, da er syntaktisch zum vorausgehenden Vers gehört und hier als Segmentierungsrest erscheint. Die knappe, objektlose Schlussfrage des vorliegenden Ge’ez-Textes wurde bewusst beibehalten.
