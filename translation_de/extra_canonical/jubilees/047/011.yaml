- from: 'Und du tötetest ihn und verbargst ihn im Sand. Am zweiten Tag fandest du zwei von den Söhnen Israels, die miteinander kämpften, und du sagtest zu dem, der im Unrecht war: »Warum schlägst du?«'
  to: 'Und du tötetest ihn und verbargst ihn im Sand. Am zweiten Tag fandest du zwei Israeliten, die sich stritten, und du sagtest zu dem, der Unrecht tat: »Warum schlägst du?«'
  rationale: Die Revision präzisiert lediglich die Wiedergabe des Streits und des Unrechttuenden. Sie erhält den im überlieferten Ge'ez fehlenden Objektbezug der letzten Frage bewusst offen und übernimmt nicht den wahrscheinlich zum vorigen Vers gehörenden Segmentrest „Söhne Israels“ am Versanfang.
