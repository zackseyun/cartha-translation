  yaml_path: translation/extra_canonical/jubilees/047/005.yaml
  text: And in those days Tarmut[a], the daughter of Pharaoh, went out to bathe in the river, and she heard your voice crying, and she told her maidens to bring you out.
translation:
  language: de
  text: Und in jenen Tagen ging Tarmut[a], die Tochter des Pharaos, hinaus, um im Fluss zu baden. Da hörte sie deine Stimme, als du weintest, und sagte zu ihren Dienerinnen, sie sollten dich herausholen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tarmut ist der Name, den das Jubiläenbuch der Tochter des Pharaos gibt; er entspricht Thermouthis bei Josephus (Jüdische Altertümer 2,224).
    reason: historical_context
lexical_decisions:
- source_word: ታርሙት
  choice: Tarmut
  rationale: Direkte und im Deutschen gut lesbare Umschrift des geʿezischen Namens.
- source_word: ለአዕጋሪቲሃ
  choice: ihren Dienerinnen
  rationale: Bezeichnet die weiblichen Bediensteten beziehungsweise Begleiterinnen der Tochter des Pharaos; „Dienerinnen“ ist im heutigen Deutsch natürlich und wahrt den sozialen Bezug.
- source_word: ያውፅኣከ
  choice: sie sollten dich herausholen
  rationale: Gibt das kausative Verb „herausbringen/herausholen“ und den Bezug auf die angeredete Person in idiomatischer indirekter Rede wieder.
