  yaml_path: translation/extra_canonical/jubilees/047/010.yaml
  text: And you were in the court of the king for three weeks of years until the day when you went out from the court of the king and saw an Egyptian striking your fellow countryman, one of your brothers.
translation:
  language: de
  text: Und du warst drei Jahrwochen[a] lang am Königshof, bis zu dem Tag, an dem du den Königshof verließest und sahst, wie ein Ägypter einen deiner Landsleute, einen von deinen Brüdern, schlug.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Drei Jahrwochen sind einundzwanzig Jahre.
    reason: Der antike Ausdruck ist bedeutungstragend, für heutige Leser aber möglicherweise erklärungsbedürftig.
lexical_decisions:
- source_word: ዐጸድ፡ መንግሥት (ʿaṣada mangaśt)
  choice: Königshof
  rationale: Die Wendung bezeichnet den Hof beziehungsweise Hofbereich des Königs. „Königshof“ gibt den institutionellen und räumlichen Sinn knapp und natürlich wieder.
- source_word: ሠለስተ፡ ሱባዔ፡ ዓመተ (śalasta subāʿē ʿāmata)
  choice: drei Jahrwochen
  rationale: Die wörtliche Zeitangabe „drei Siebener von Jahren“ wird mit dem etablierten, verständlichen Begriff „Jahrwochen“ wiedergegeben; gemeint sind insgesamt einundzwanzig Jahre.
- source_word: ለካልእከ (la-kālʾəka)
  choice: einen deiner Landsleute
  rationale: Wörtlich etwa „deinen anderen/deinen Nächsten“. Im erzählerischen Zusammenhang ist ein Angehöriger von Moses’ eigenem Volk gemeint; „Landsleute“ bewahrt diesen Gegensatz zum Ägypter, ohne eine engere persönliche Beziehung zu behaupten.
- source_word: ይዘብጦ (yəzabṭo)
  choice: schlug
  rationale: Das Verb bezeichnet körperliches Schlagen. Das Präteritum fügt sich natürlich in die deutsche Erzählung ein, während „wie … schlug“ den im Geʿez durch እንዘ ausgedrückten begleitenden Vorgang wiedergibt.
theological_decisions:
- issue: Bezeichnung des geschlagenen Israeliten als Bruder
  choice: einen von deinen Brüdern
  alternative: einen deiner Volksgenossen
  rationale: Die verwandtschaftliche Sprache der Quelle beziehungsweise des fortlaufenden Satzes wird bewahrt. „Brüder“ bezeichnet hier die Zugehörigkeit zum selben Volk und wird nicht konfessionell oder rein biologisch verengt.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. „Verließest“ hält den feierlich-literarischen Ton, ohne altertümliche Satzstellung zu verwenden. Die Zeitangabe und die brüderliche Volkszugehörigkeit bleiben quellennah erhalten.
