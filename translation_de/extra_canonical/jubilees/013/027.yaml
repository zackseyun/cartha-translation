lexical_decisions:
- source_word: አልህምት
  choice: Rindern
  rationale: Das Substantiv bezeichnet Rinder beziehungsweise Großvieh; im Zusammenhang einer Aufzählung von Tierarten ist „Rinder“ natürlich und präzise.
- source_word: አባግዕ
  choice: Schafen
  rationale: Das Wort bezeichnet Schafe beziehungsweise Kleinvieh; hier wird die konkrete Tierart „Schafe“ beibehalten.
- source_word: ካህናቲሁ
  choice: seinen Priestern
  rationale: Das Substantiv bedeutet „Priester“, und das angefügte Possessivelement verweist auf „seine“.
- source_word: በፍሥሓ
  choice: mit Freude
  rationale: Die Wendung bezeichnet Freude oder Jubel; „mit Freude“ gibt den adverbialen Sinn in natürlichem Deutsch wieder.
