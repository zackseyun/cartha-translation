  source_fidelity: Der Text gibt die Tiergruppen, die Priester und die freudige Speise- und Trankgabe grundsätzlich zutreffend wieder. Die geʿezischen Infinitive bezeichnen jedoch den Zweck bzw. die Bestimmung der Gabe; die Vergangenheitsformen „aßen und tranken“ verwischen dies leicht. Das Objekt der Gabe sollte bei „essen und trinken“ wieder aufgenommen werden, wie es auch die englische Audit-Fassung mit „it“ tut.
  naturalness: „Und“ sollte am Beginn des als eigenständiger Vers präsentierten deutschen Textes großgeschrieben werden. Eine Zweckkonstruktion mit „damit ... essen und trinken konnten“ ist modernes, natürliches Deutsch und wahrt die Funktion der Infinitive.
  terminology: „Rindern“, „Schafen“, „Priestern“ und „mit Freude“ sind angemessene und quellentreue Entscheidungen. Es besteht kein Anlass für terminologische oder theologische Änderungen.
