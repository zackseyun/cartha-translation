    rationale: Die Quelle formuliert „gab [es] seinen Priestern, zu essen und zu trinken mit Freude“. „damit sie es mit Freude essen und trinken konnten“ macht Zweck und Bezugsobjekt im Deutschen klar, ohne zusätzlichen Sachgehalt einzutragen.
