  text: for I will give it to your seed.” And Abram went to Hebron and settled there. And in this year Chedorlaomer king of Elam came, and Amraphel king of Shinar, and Arioch king of Ellasar,
translation:
  language: de
  text: „Denn deinen Nachkommen werde ich es geben.“ Und Abram zog nach Hebron und ließ sich dort nieder. In diesem Jahr kamen Kedor-Laomer, der König von Elam, Amrafel, der König von Schinar, und Arjoch, der König von Ellasar,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለዘርእከ
  choice: deinen Nachkommen
  rationale: Das äthiopische Wort für ‚Same/Nachkommenschaft‘ bezeichnet hier kollektiv Abrams Nachkommen; die natürliche deutsche Wiedergabe ist der Plural ‚Nachkommen‘.
- source_word: እሁብ
  choice: werde ich es geben
  rationale: Die Verbform wird als göttliche Zusage in der Zukunft wiedergegeben; das Pronomen ‚es‘ nimmt das zuvor bezeichnete Land auf.
- source_word: ሖረ
  choice: zog
  rationale: Im erzählenden Kontext ist ‚zog‘ für Abrams Ortswechsel idiomatischer als das allgemeinere ‚ging‘.
- source_word: ኀደረ
  choice: ließ sich dort nieder
  rationale: Das Verb bezeichnet Bleiben bzw. Wohnen; ‚ließ sich nieder‘ gibt den Übergang zu einem neuen Aufenthaltsort natürlich wieder.
- source_word: መጽአ
  choice: kamen
  rationale: Das im Singular stehende Verb eröffnet eine Reihe mehrerer Könige; im Deutschen wird es entsprechend dem zusammengesetzten Subjekt im Plural wiedergegeben.
- source_word: ኮዶላጎሞር
  choice: Kedor-Laomer
  rationale: Die Namensform folgt einer im Deutschen verständlichen, an Gen 14 anschließenden Transliteration und bewahrt zugleich die Gliederung des Namens.
- source_word: ሴናአር
  choice: Schinar
  rationale: Verwendet wird die etablierte deutsche Form des biblischen Ortsnamens.
- source_word: ሴላሰር
  choice: Ellasar
  rationale: Die Wiedergabe folgt der geläufigen biblischen Form des Reichsnamens, wie sie auch der Parallelüberlieferung in Gen 14 entspricht.
theological_decisions:
- issue: Bezug des unpersönlich wiedergegebenen Objekts bei ‚geben‘
  choice: „es“ als Rückbezug auf das Land
  alternative: das Land ausdrücklich ergänzen
  rationale: Der Ausgangstext setzt den Gegenstand aus dem vorherigen Zusammenhang voraus. Das Pronomen bewahrt diesen knappen Anschluss, ohne eine erklärende Ergänzung in den Haupttext einzuführen.
- issue: Kollektive Bedeutung von ‚Same‘
  choice: „Nachkommen“
  alternative: „Nachkommenschaft“ oder wörtlich „Same“
  rationale: „Nachkommen“ bewahrt den kollektiven Sinn und legt weder eine ausschließlich einzelne noch eine bestimmte spätere theologische Referenz fest.
translation_notes:
  register: Moderne, würdige Erzählsprache mit geläufigen deutschen Formen der biblischen Personen- und Ortsnamen. Die Satzfolge und der am Versende offene Königskatalog bleiben erhalten.
