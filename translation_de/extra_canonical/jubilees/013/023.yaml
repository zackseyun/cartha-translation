  source_fidelity: 'Der Entwurf gibt die maßgeblichen geʿezischen Lesarten sachgerecht wieder: Targal, die Tötung des Königs von Gomorra, das Fliehen des Königs von Sodom, das „Erdpech“ sowie ausdrücklich das „Tal der Sodomiter“, die Gefangennahme Lots und der Zug bis Dan. Die umstrittene bzw. traditionsgebundene Ortsformulierung wird nicht unzulässig zu „Siddim“ harmonisiert.'
  naturalness: Das Deutsch ist insgesamt modernes, würdiges Standarddeutsch. Der einleitende nominale Satzrest darf wegen der Vorlage fragmentarisch bleiben; das dort gesetzte Semikolon ist jedoch im Deutschen syntaktisch und stilistisch unerquicklich. Ein Gedankenstrich markiert den überlieferten Bruch klarer.
  terminology: Die Namensformen Targal, Gomorra, Sodom, Adma, Zebojim und Dan sind angemessen. „Erdpech“ ist für den hier traditionsbedingt gebrauchten Sinn von qabʾa treffend. Die Fußnoten erläutern sowohl die Namensentsprechung als auch die textkritisch relevante, nicht harmonisierte Formulierung hinreichend.
