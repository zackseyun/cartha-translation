base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/013/023.yaml
  text: And Targal[a], king of nations; and they killed the king of Gomorrah, and the king of Sodom fled, and many fell into the bitumen of the valley of the Sodomites[b] by the Salt Sea. And they took captive Sodom and Admah and Zeboiim, and they took captive Lot also, the son of Abram's brother, and all his possessions, and they went as far as Dan.
translation:
  language: de
  text: Und Targal[a], der König der Völker — und sie töteten den König von Gomorra. Der König von Sodom aber floh, und viele fielen in das Erdpech im Tal der Sodomiter[b] am Salzmeer. Sie nahmen Sodom, Adma und Zebojim gefangen; auch Lot, den Sohn von Abrams Bruder, nahmen sie samt seinem ganzen Besitz gefangen, und sie zogen bis nach Dan.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Geʿez Targal; der Name entspricht Tidal in Genesis 14,1.
    reason: lexical_choice
  - marker: b
    text: Wörtlich steht im Geʿez „im Öl/Erdpech des Tals der Sodomiter“. Dies entspricht den Erdpechgruben im Tal Siddim in Genesis 14,10. Charles (1902) hielt den Text für verderbt und änderte ihn zu „durch Wunden“; der überlieferte Wortlaut ist jedoch als Wiedergabe der Genesisüberlieferung verständlich.
    reason: textual_critical
lexical_decisions:
- source_word: ተርጋል
  choice: Targal
  rationale: Die geʿezische Namensform wird bewahrt; sie entspricht Tidal in Genesis 14,1.
- source_word: ወቀተልዎ
  choice: und sie töteten
  rationale: Das Verb bezeichnet hier Töten, nicht lediglich Schlagen.
- source_word: ወጐየ
  choice: floh
  rationale: Die Lesart des kritischen Textes bedeutet „fliehen“ und entspricht dem Zusammenhang von Genesis 14,10.
- source_word: በቀብአ
  choice: in das Erdpech
  rationale: qabʾa bedeutet gewöhnlich Öl oder Salbe, gibt hier aber im Anschluss an die Genesisüberlieferung Bitumen/Erdpech wieder.
- source_word: በቀላ፡ ሰዶማውያን
  choice: im Tal der Sodomiter
  rationale: Der geʿezische Wortlaut nennt ausdrücklich das Tal der Sodomiter und nicht Siddim.
- source_word: ፄወዉ / ፄወውዎ
  choice: nahmen ... gefangen
  rationale: Das wiederholte Verb bezeichnet das Gefangennehmen bzw. Wegführen als Beute.
- source_word: ጥሪቶ
  choice: Besitz
  rationale: Der Ausdruck bezeichnet Lots Habe oder Vermögen; „Besitz“ ist im Deutschen natürlich und präzise.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche geʿezische Formulierung „Tal der Sodomiter“ bleibt im Haupttext erhalten; die Beziehung zu Genesis 14,10 und die lexikalische Schwierigkeit werden in der Fußnote erläutert. Der einleitende Satzteil bleibt fragmentarisch, da auch der vorgelegte Vers mit einer Fortsetzung beginnt.
