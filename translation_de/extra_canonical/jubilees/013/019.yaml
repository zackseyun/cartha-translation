  source_fidelity: 'Die Satzglieder und die auffällige zeitliche Abfolge des geʿezischen Textes sind im Entwurf grundsätzlich zutreffend wiedergegeben. Die Richtungsangaben folgen der Quelle korrekt: Norden, Süden, „Meer“ im Sinn von Westen und Sonnenaufgang im Sinn von Osten. Die offene direkte Rede am Versende ist richtig, da sie in V. 20 fortläuft.'
