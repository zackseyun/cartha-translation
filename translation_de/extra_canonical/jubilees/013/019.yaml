  text: In that year, when Lot had been taken captive, the LORD said to Abram, after Lot had separated from him, in the fourth year of this week, “Lift up your eyes from the place where you are dwelling, northward and southward and westward and eastward,
translation:
  language: de
  text: 'In jenem Jahr, als Lot gefangen genommen worden war, sagte der HERR zu Abram, nachdem Lot sich von ihm getrennt hatte, im vierten Jahr dieser Jahrwoche: „Erhebe deine Augen von dem Ort aus, an dem du wohnst, nach Norden und Süden, nach Westen und Osten,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተፄወወ፡ ሎጥ
  choice: Lot gefangen genommen worden war
  rationale: Das passive Verb bezeichnet Lots Gefangennahme; das deutsche Plusquamperfekt ordnet sie natürlich vor der Redehandlung ein.
- source_word: እግዚአብሔር
  choice: der HERR
  rationale: Die etablierte, würdige Wiedergabe der Gottesbezeichnung passt zum biblischen Register.
- source_word: በ፬ብዑ፡ ዓመት፡ ዘዝሱባዔ
  choice: im vierten Jahr dieser Jahrwoche
  rationale: „Jahrwoche“ macht deutlich, dass ሱባዔ hier eine Siebenerperiode von Jahren bezeichnet, und bewahrt die chronologische Fachsprache des Jubiläenbuches.
- source_word: አንሥእ፡ አዕይንቲከ
  choice: Erhebe deine Augen … und blicke
  rationale: Die bildhafte Aufforderung wird bewahrt; „blicke“ ergänzt im Deutschen idiomatisch die anschließenden Richtungsangaben.
- source_word: ባሕር፡ ወጽባሕ
  choice: Westen und Osten
  rationale: Wörtlich stehen „Meer“ und „Sonnenaufgang“ als Richtungsbezeichnungen; ihre gemeinten Himmelsrichtungen werden für heutige Leser klar wiedergegeben.
theological_decisions:
- issue: Zeitliche Stellung der Trennung Lots und seiner Gefangennahme
  choice: Beide Angaben werden ohne Harmonisierung als eigene Zeitbestimmungen der Gottesrede wiedergegeben.
  alternative: Die Gefangennahme als bloßen Rückverweis oder die Trennung als Zeitpunkt der Gefangennahme deuten.
  rationale: Der Quelltext nennt sowohl Lots Gefangennahme als auch seine vorherige Trennung von Abram; die Übersetzung bewahrt diese auffällige zeitliche Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit biblischem Erzählton. Die direkte Rede bleibt am Versende offen, da sie im folgenden Vers weitergeht; deshalb steht kein schließendes Anführungszeichen.
