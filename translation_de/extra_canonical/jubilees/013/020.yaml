  text: For all the land that you see I will give to you and to your seed forever. And I will make your seed like the sand of the sea; if a man can count the dust of the earth, then your seed also
translation:
  language: de
  text: Denn das ganze Land, das du siehst, werde ich dir und deinen Nachkommen für immer geben. Und ich werde deine Nachkommen so zahlreich machen wie den Sand am Meer. Wenn ein Mensch den Staub der Erde zählen kann, dann werden auch deine Nachkommen[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Satz wird in Vers 21 fortgesetzt: „nicht gezählt werden“.'
    reason: Die Versgrenze trennt den Nachsatz von seinem Prädikat; die Fußnote verhindert, dass die bewusst unvollständige Formulierung als Textfehler verstanden wird.
lexical_decisions:
- source_word: ዘርእከ
  choice: deine Nachkommen
  rationale: Das kollektive Substantiv bezeichnet hier Abrahams Nachkommenschaft; „Nachkommen“ ist im modernen Deutsch natürlich und bewahrt den kollektiven Sinn.
- source_word: ኆፃ፡ ባሕር
  choice: den Sand am Meer
  rationale: Wörtlich „Sand des Meeres“; die idiomatische deutsche Formulierung gibt das Vergleichsbild klar wieder.
- source_word: ኆፃ፡ ምድር
  choice: den Staub der Erde
  rationale: Obwohl dasselbe geezische Wort ኆፃ im vorigen Vergleich „Sand“ bezeichnet, entspricht „Staub der Erde“ der hier zugrunde liegenden biblischen Formel und unterscheidet die beiden Bilder sachgerecht.
- source_word: እስከ፡ ለዓለም
  choice: für immer
  rationale: Gibt die zeitlich unbegrenzte Zusage natürlich und würdig wieder.
theological_decisions:
- issue: Unvollständiger Konditionalsatz an der Versgrenze
  choice: 'Der Satz bleibt am Ende von Vers 20 offen: „dann werden auch deine Nachkommen“'
  alternative: „dann können auch deine Nachkommen gezählt werden“
  rationale: Das Prädikat der Nachsatzkonstruktion steht erst in Vers 21 und ist dort verneint. Eine positive Ergänzung in Vers 20 würde dem Fortgang widersprechen und die syntaktische Spannung der Überlieferung beseitigen.
- issue: Wiedergabe von „Same“ beziehungsweise Nachkommenschaft
  choice: „Nachkommen“
  alternative: „Same“
  rationale: „Nachkommen“ vermittelt den kollektiven genealogischen Sinn ohne konfessionelle Zusatzdeutung; „Same“ wäre im heutigen Deutsch unnötig missverständlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „deine Nachkommen“ und die offene Syntax an der Versgrenze werden beibehalten, während „so zahlreich machen wie“ den idiomatischen Sinn des Vergleichs natürlich ausdrückt.
