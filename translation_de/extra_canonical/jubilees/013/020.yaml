  source_fidelity: 'Die Übersetzung folgt dem geʽezischen Text eng: Landgabe an Abraham und seine Nachkommenschaft „für immer“, der Vergleich der Nachkommenschaft mit dem Sand des Meeres sowie der bedingte Vergleich mit dem Staub der Erde sind zutreffend wiedergegeben. Die am Versende offene Konstruktion respektiert den überlieferten Versschnitt und ergänzt kein Verb, das erst mit der verneinten Fortsetzung in Vers 21 erscheint.'
