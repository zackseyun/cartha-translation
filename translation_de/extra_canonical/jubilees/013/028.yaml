lexical_decisions:
- source_word: ወበጽሐ
  choice: trat heran
  rationale: Das Verb bezeichnet hier das Herankommen beziehungsweise Eintreffen; »trat heran« ist im Zusammenhang natürlich und präzise.
- source_word: ወሰገደ
  choice: verneigte sich
  rationale: Das Verb kann Niederfallen oder ehrerbietiges Sich-Verneigen ausdrücken. »Verneigte sich« bewahrt die Huldigungsgeste, ohne eine ausdrücklich kultische Anbetung festzulegen.
- source_word: እግዚእነ
  choice: Unser Herr
  rationale: Die Form enthält den Possessivbezug der ersten Person Plural und ist als ehrerbietige Anrede wiedergegeben.
theological_decisions:
- issue: Art der Huldigung vor Abram
  choice: verneigte sich vor ihm
  alternative: warf sich vor ihm nieder
  rationale: Der Ausgangstext lässt hinsichtlich Tiefe und kultischer Bedeutung der Geste Spielraum. Die gewählte Formulierung hält den Akt ehrerbietiger Unterordnung fest, ohne ihn als Gottesverehrung zu deuten.
