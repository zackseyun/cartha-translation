  terminology: »HERRN«, »Gesetz«, »Zehnten«, »Wein« und »Öl« sind angemessen. »Saat« bewahrt die lexikalische Offenheit des geezischen Ausdrucks; die Fußnote kann die wahrscheinliche Abgabenbedeutung erläutern, ohne sie als alleinige Lesart auszugeben.
