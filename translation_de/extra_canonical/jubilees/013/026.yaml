  text: 'And for this law there is no limit of days, for he ordained it for the generations forever: that they should give a tenth of everything to the LORD, from seed[26] and from wine and from oil.'
translation:
  language: de
  text: 'Und für dieses Gesetz gibt es keine zeitliche Grenze; denn er hat es für alle Generationen auf ewig festgesetzt: Sie sollen dem HERRN den Zehnten von allem geben: von der Saat[a], vom Wein und vom Öl.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »von der Saat« oder »vom Samen«; im Zusammenhang mit dem Zehnten ist wahrscheinlich landwirtschaftlicher Ertrag gemeint, nicht nur zur Aussaat bestimmtes Saatgut.
    reason: cultural_note
lexical_decisions:
- source_word: ወአልቦ፡ ለዝ፡ ሕግ፡ ወሰነ፡ መዋዕል፡
  choice: Und für dieses Gesetz gibt es keine zeitliche Grenze
  rationale: Gibt die wörtliche Vorstellung »keine Grenze der Tage« in natürlichem modernem Deutsch wieder, ohne die unbegrenzte Geltungsdauer abzuschwächen.
- source_word: ለትውልድ፡ ዘለዓለም፡
  choice: für alle Generationen für immer
  rationale: Bewahrt sowohl den Generationenbezug als auch die ausdrückliche Dauerformel.
- source_word: ዓሥራተ፡ እምኵሉ፡
  choice: von allem den Zehnten
  rationale: Entspricht der Abgabenbezeichnung »Zehnter« und dem umfassenden »von allem«.
- source_word: እምዘርእ፡
  choice: vom Ertrag des Feldes
  rationale: Das zugrunde liegende Wort kann »Saat/Samen« bezeichnen, meint im Abgabenkontext aber wahrscheinlich den landwirtschaftlichen Ertrag; die Fußnote erhält die wörtlichere Möglichkeit.
- source_word: ወእምወይን፡ ወእምቅብእ፡
  choice: vom Wein und vom Öl
  rationale: Direkte und idiomatische Wiedergabe der beiden Erzeugnisse.
theological_decisions:
- issue: Dauerhafte Geltung des Gesetzes
  choice: für alle Generationen für immer
  alternative: für ewige Generationen
  rationale: Die gewählte Fassung lässt die starke, uneingeschränkte Dauerbehauptung des Textes stehen und deutet sie nicht konfessionell um.
- issue: Gottesbezeichnung
  choice: HERRN
  alternative: Herrn
  rationale: Die traditionelle Kapitälchenschreibung kennzeichnet den Gottesnamen, den das geezische እግዚአብሔር hier wiedergibt, ohne einen rekonstruierten hebräischen Wortlaut in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der feierlich-rechtlichen Aussage des Ausgangstextes, bleibt aber gut verständlich. Das maskuline Pronomen »er« bleibt wie in der Quelle stehen und wird nicht durch eine ausdrückliche Nennung Gottes interpretierend ersetzt.
