  yaml_path: translation/extra_canonical/jubilees/013/015.yaml
  text: And Pharaoh sent away Sarai, Abram’s wife, and expelled him from the land of Egypt. And he went to the place where he had pitched his tent at first, to the place of the altar, between Bethel on the west and Ai on the east, and he blessed the LORD his God who had brought him back in peace.
translation:
  language: de
  text: Und der Pharao gab Sarai, Abrams Frau, zurück und wies ihn aus Ägypten fort. Abram ging zu dem Ort, an dem er zuerst sein Zelt aufgeschlagen hatte, zum Ort des Altars zwischen Ai im Osten und Bethel im Westen. Dort pries er den HERRN, seinen Gott, der ihn in Frieden zurückgebracht hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አገብአ
  choice: gab … zurück
  rationale: Das Verb bezeichnet hier die Rückgabe Sarais an Abram; die Formulierung gibt den Handlungssinn knapp und natürlich wieder.
- source_word: አፍለሶ
  choice: wies ihn … fort
  rationale: Das Kausativverb drückt ein erzwungenes Fortgehen aus. „Wies ihn aus“ bewahrt diesen Nachdruck, ohne unnötig moderne verwaltungsrechtliche Konnotationen auszubauen.
- source_word: ደብተራሁ
  choice: sein Zelt
  rationale: Im Kontext bezeichnet das Wort Abrams Zelt beziehungsweise Lagerstätte; „Zelt“ entspricht dem erzählerischen Zusammenhang.
- source_word: ባረከ
  choice: pries
  rationale: Das Verb bedeutet wörtlich „segnete“. Wenn ein Mensch Gott „segnet“, ist im heutigen Deutschen „pries“ die natürliche und sachlich passende Wiedergabe.
- source_word: ዘገብ በሰላም
  choice: der ihn in Frieden zurückgebracht hatte
  rationale: Die Wendung beschreibt Gott als den, der Abram wohlbehalten zurückkehren ließ; „in Frieden“ bewahrt zugleich die konkrete Quellformulierung.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung እግዚአብሔር አምላኩ
  choice: den HERRN, seinen Gott
  alternative: den Herrn, seinen Gott
  rationale: „HERR“ folgt der etablierten deutschen Bibelkonvention für die in der Überlieferung als Gottesname verstandene Bezeichnung, während „seinen Gott“ die zweite Apposition ausdrücklich bewahrt.
- issue: Subjektbezug beim Zurückbringen
  choice: Gott hatte Abram in Frieden zurückgebracht
  alternative: Abram war in Frieden zurückgekehrt
  rationale: Das Relativpronomen bezieht sich syntaktisch auf „den HERRN, seinen Gott“; daher bleibt Gottes Wirken ausdrücklich erhalten.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch mit klarer Satzgliederung. Die Reihenfolge des äthiopischen Textes bleibt gewahrt: zuerst der frühere Zeltplatz, dann der Ort des Altars und dessen Lagebestimmung. Der Namensform „Ai“ wird gegenüber dem älteren deutschen „Ai“/„Aï“ ohne Trema der heute übliche schlichte Satz gegeben.'
