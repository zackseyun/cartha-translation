lexical_decisions:
- source_word: ወአእከዮ፡ በልቡ፡
  choice: Und es schmerzte ihn im Herzen
  rationale: Die Wendung bezeichnet inneren Schmerz oder Kummer. Die persönliche deutsche Formulierung ist natürlich und bewahrt zugleich den ausdrücklichen Bezug auf das Herz.
- source_word: ተፈልጠ፡
  choice: getrennt worden war
  rationale: Die passive Verbform wird als vollzogene Trennung wiedergegeben, ohne dem Neffen selbst die Initiative zuzuschreiben.
- source_word: ወልደ፡ እኁሁ፡
  choice: der Sohn seines Bruders
  rationale: Formale und im Deutschen klare Wiedergabe der Verwandtschaftsbezeichnung.
- source_word: እምኔሁ፡
  choice: von ihm
  rationale: Bewahrt den Ausgangs- beziehungsweise Trennungsbezug des äthiopischen Ausdrucks.
- source_word: አልቦ፡ ውሉደ፡
  choice: er hatte keine Kinder
  rationale: Direkte, natürliche Wiedergabe der Aussage über Kinderlosigkeit.
theological_decisions:
- issue: Grund für Abrams Kummer
  choice: Die Kinderlosigkeit wird als Begründung genannt, ohne weitergehende Deutung.
  alternative: Den Neffen ausdrücklich als möglichen Erben oder Sohnersatz bezeichnen.
  rationale: Der Vers selbst nennt lediglich die Trennung und Abrams Kinderlosigkeit; eine erbrechtliche oder typologische Erklärung wäre Zusatzinterpretation.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt eng an der ge'ezischen Struktur, klingt jedoch idiomatisch; das Passiv der Trennung und die knappe kausale Spannung werden bewahrt.
