  text: And in the forty-first jubilee, in the third year of the first week, he returned to this place and offered a sacrifice upon it, and he called on the name of the LORD.
translation:
  language: de
  text: 'Und es geschah im einundvierzigsten Jubiläum, im dritten Jahr der ersten Jahrwoche: Er kehrte an diesen Ort zurück, brachte darauf ein Opfer dar und rief den Namen des HERRN an.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገብአ፡ ውስተዝ፡ መካን፡
  choice: kehrte an diesen Ort zurück
  rationale: ገብአ bezeichnet hier im Erzählzusammenhang die Rückkehr; ዝ ist demonstrativ und verweist auf „diesen“ Ort.
- source_word: ወአዕረገ፡ በዲቤሁ፡ ጽንሓሐ፡
  choice: brachte darauf ein Opfer dar
  rationale: Die Wendung beschreibt das Darbringen eines Opfers auf dem zuvor bezeichneten Ort beziehungsweise Gegenstand; „darauf“ bewahrt den pronominalen Rückbezug von በዲቤሁ.
- source_word: ወጸውዐ፡ በስመ፡ እግዚአብሔር፡
  choice: und rief den Namen des HERRN an
  rationale: Die feste Wendung wird idiomatisch und zugleich traditionsnah mit „den Namen … anrufen“ wiedergegeben; die Gottesbezeichnung erscheint als HERR.
- source_word: ሱባዔ፡
  choice: Jahrwoche
  rationale: Der Ausdruck bezeichnet eine Siebenjahresperiode; „Jahrwoche“ ist im Deutschen knapp, verständlich und für die Zeitrechnung des Jubiläenbuches passend.
theological_decisions:
- issue: Art des Opfers
  choice: ein Opfer
  alternative: ein Brandopfer
  rationale: Der Ausgangstext rechtfertigt an dieser Stelle keine unnötige Verengung auf eine bestimmte Opferart; die allgemeinere Wiedergabe bewahrt die Aussage ohne dogmatische Ergänzung.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die einleitende Formel „Und es geschah“ bewahrt den erzählerischen Stil des Ausgangstextes; der Doppelpunkt gliedert die lange Zeitangabe natürlich. Keine Fußnote ist nötig, da die frühere Lesart „betrat jenen Ort und baute dort einen Altar“ vom ge’ezischen Wortlaut nicht gestützt wird.
