  yaml_path: translation/extra_canonical/jubilees/013/017.yaml
  text: And he said, “You are God Most High, my God forever and ever.” And in the seventh year of this week, Lot separated from him, and Lot settled in Sodom; and the men of Sodom were very sinful.
translation:
  language: de
  text: 'Und er sagte: »Du bist Gott, der Höchste, mein Gott für immer und ewig.« Im siebten Jahr dieser Jahrwoche trennte sich Lot von ihm. Lot ließ sich in Sodom nieder, und die Männer von Sodom waren überaus sündig.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አምላክ፡ ልዑል
  choice: Gott, der Höchste
  rationale: Gibt Titel und Apposition des geezischen Ausdrucks natürlich und zugleich eng am Wortlaut wieder.
- source_word: ለዓለመ፡ ዓለም
  choice: für immer und ewig
  rationale: Entspricht der verstärkten Ewigkeitsformel und wahrt ihren feierlichen Klang.
- source_word: ዘዝሱባዔ
  choice: dieser Jahrwoche
  rationale: Die Zeitangabe bezeichnet im Jubiläenbuch einen Siebenjahreszeitraum; »Jahrwoche« ist im Deutschen präzise und verständlich.
- source_word: ተፈልጠ
  choice: trennte sich
  rationale: Gibt die Loslösung Lots von der zuvor genannten Person sachlich wieder, ohne einen zusätzlichen Streitgrund einzutragen.
- source_word: ኀደረ
  choice: ließ sich ... nieder
  rationale: Im Ortszusammenhang bezeichnet das Verb Lots Wohnsitznahme in Sodom.
- source_word: ሰብአ፡ ሰዶም
  choice: die Männer von Sodom
  rationale: Bewahrt die konkrete maskuline Personenbezeichnung des Quelltexts.
- source_word: ኃጥኣን፡ ጥቀ
  choice: überaus sündig
  rationale: Gibt sowohl die Aussage »sündig« als auch die starke Intensivierung wieder.
theological_decisions:
- issue: Gottesbezeichnung አምላክ፡ ልዑል
  choice: Gott, der Höchste
  alternative: der höchste Gott
  rationale: Die appositionale Wiedergabe wahrt eher die Abfolge »Gott – Höchster« und vermeidet, den Ausdruck unnötig zu einer rein attributiven Bezeichnung zu glätten.
- issue: Bewertung der Einwohner Sodoms
  choice: überaus sündig
  alternative: sehr große Sünder
  rationale: Die gewählte Form ist idiomatisches modernes Deutsch und bewahrt das moralisch-theologische Urteil, ohne konkrete, im Vers nicht genannte Sünden einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählstruktur. Die traditionelle heilsgeschichtliche Zeitbezeichnung »Jahrwoche« bleibt erhalten; unnötig altertümliche Syntax wird vermieden.
