  yaml_path: translation/extra_canonical/jubilees/013/024.yaml
  text: And one who had escaped came and told Abram that his brother’s son had been taken captive[24]. And he armed the servants born in his house . . . Upon Abram and upon his seed is the first tithe for the LORD, and the LORD made it an ordinance forever, that they should give it to the priests who minister before him[24],
translation:
  language: de
  text: 'Da kam einer, der entkommen war, und berichtete Abram, dass der Sohn seines Bruders gefangen genommen worden war. Und er bewaffnete die in seinem Haus geborenen Knechte …[a] Auf Abram und seinen Nachkommen liegt der erste Zehnte für den HERRN;[b] und der HERR machte ihn zu einer ewigen Satzung: Sie sollen ihn den Priestern geben, die vor ihm Dienst tun.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Text ist hier schwer verständlich und offenbar stark verkürzt überliefert. Nach der Bewaffnung der im Haus geborenen Knechte geht er unvermittelt zur Einsetzung des Zehnten über; wahrscheinlich ist an dieser Stelle ein längerer Erzählabschnitt ausgefallen.
    reason: segmentation_note
  - marker: b
    text: „Der erste Zehnte“ kann auch „der vornehmste Zehnte“ bedeuten oder als ein anfänglicher Zehnter von den ersten Erträgen verstanden werden. Die geʽezische Formulierung ist ungewöhnlich.
    reason: lexical_alternative
lexical_decisions:
- source_word: ዚድኅነ
  choice: einer, der entkommen war
  rationale: Gibt das substantivierte Partizip natürlich wieder und entspricht dem Boten, der der Gefangennahme entkam.
- source_word: ወልደ፡ እኁሁ
  choice: der Sohn seines Bruders
  rationale: Bewahrt die wörtliche Verwandtschaftsbezeichnung des Geʽez, statt sie deutend durch „Neffe“ zu ersetzen.
- source_word: አስተረሰየ
  choice: bewaffnete
  rationale: Im vorliegenden Erzählzusammenhang bezeichnet das Verb das Ausrüsten beziehungsweise Bewaffnen der Hausknechte.
- source_word: ዐሥራተ፡ ቀዳሚ
  choice: der erste Zehnte
  rationale: Bildet die ungewöhnliche Verbindung formal ab; „vornehmster Zehnter“ bleibt lexikalisch möglich und wird in der Fußnote genannt.
- source_word: ይትቀነዩ፡ ቅድሜሁ
  choice: die vor ihm Dienst tun
  rationale: Gibt den kultischen Dienst der Priester vor Gott in natürlichem, würdigem Deutsch wieder.
theological_decisions:
- issue: Verpflichtung zum Zehnten in einem verblosen Satz
  choice: Auf Abram und seinen Nachkommen liegt der erste Zehnte für den HERRN
  alternative: Abram und seinen Nachkommen wurde der erste Zehnte für den HERRN auferlegt
  rationale: Der Geʽez-Satz enthält kein ausdrückliches Verb und nennt daher auch keinen Handelnden. „liegt … auf“ macht die Verpflichtung verständlich, ohne einen auferlegenden Akteur einzuführen.
- issue: Fortdauernde Ordnung und priesterlicher Empfang
  choice: 'der HERR machte ihn zu einer ewigen Satzung: Sie sollen ihn den Priestern geben'
  alternative: der HERR setzte ihn für immer als Ordnung ein, damit man ihn den Priestern gebe
  rationale: Bewahrt sowohl den göttlichen Ursprung der Satzung als auch die Verpflichtung zur Abgabe an die vor Gott dienenden Priester, ohne eine spätere konfessionelle Zehntenlehre einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die abrupte Textlücke wird durch Auslassungspunkte sichtbar gemacht und erläutert. „Knechte“ wahrt den antiken Haushaltskontext; „Nachkommen“ ist idiomatischer als „Same“, ohne den kollektiven Sinn zu verlieren. Der Gottesname wird entsprechend der deutschen Bibeltradition als HERR wiedergegeben.
