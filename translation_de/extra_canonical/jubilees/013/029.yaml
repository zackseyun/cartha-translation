  to: '„Gib uns die Menschen, die du gerettet hast; die Habe aber soll dir gehören.“ Da sagte Abram zu ihm: „Ich habe meine Hand zu Gott, dem Höchsten, erhoben: Von einem Faden bis zu einem Schuhriemen werde ich nichts von allem nehmen, was dir gehört, damit du nicht sagst: ‚Ich habe Abram reich gemacht.‘ Ausgenommen ist nur, was die jungen Männer gegessen haben, sowie der Anteil der Männer, die mit mir gezogen sind: Aner, Eschkol und Mamre. Sie sollen ihren Anteil nehmen.“'
