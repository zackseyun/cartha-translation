base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/013/029.yaml
  text: 'Give us the persons whom you rescued, but let the goods be yours.” And Abram said to him, “I have lifted up my hands to God Most High: from a thread even to a sandal strap, I will not take anything that is yours, lest you should say, ‘I have made Abram rich’—except only what the young men have eaten, and the share of the men who went with me, Aner and Eshcol and Mamre; let them take their share.”'
translation:
  language: de
  text: '„Gib uns die Menschen, die du gerettet hast; die Habe aber soll dir gehören.“ Da sagte Abram zu ihm: „Ich habe meine Hand zu Gott, dem Höchsten, erhoben: Von einem Faden bis zu einem Schuhriemen werde ich nichts von allem nehmen, was dir gehört, damit du nicht sagst: ‚Ich habe Abram reich gemacht.‘ Ausgenommen ist nur, was die jungen Männer gegessen haben, sowie der Anteil der Männer, die mit mir gezogen sind: Aner, Eschkol und Mamre. Sie sollen ihren Anteil nehmen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጸግወነ
  choice: Gib uns
  rationale: Die Ge’ez-Form enthält ein Objekt der 1. Person Plural; die auffällige Abweichung von Genesis 14,21 wird nicht harmonisiert.
- source_word: ነፍሰ
  choice: die Menschen
  rationale: Wörtlich „Seelen/Personen“; im Kontext bezeichnet das Wort die geretteten Menschen.
- source_word: ባሳሕከ
  choice: die du gerettet hast
  rationale: Gibt die Rettung beziehungsweise Befreiung der verschleppten Personen idiomatisch wieder.
- source_word: አምላክ፡ ልዑል
  choice: Gott, dem Höchsten
  rationale: Bewahrt den Gottesnamen beziehungsweise Titel ohne Ergänzungen aus der Parallelüberlieferung.
- source_word: እምፈትል፡ እስከ፡ ተታነ፡ እሣእነ
  choice: Nicht einmal einen Faden oder einen Schuhriemen
  rationale: Die Spannweite vom Faden bis zum Schuhriemen drückt aus, dass Abram selbst den geringsten Gegenstand ablehnt; natürliches Deutsch verwendet hier „nicht einmal … oder“.
- source_word: አብዐልከዎ
  choice: reich gemacht
  rationale: Das Verb bezeichnet das Reichmachen; die aktive Aussage und ihr polemischer Nachdruck bleiben erhalten.
- source_word: መክፈልቶሙ
  choice: ihren Anteil
  rationale: Sachgerechte Wiedergabe des den Verbündeten zustehenden Beuteanteils.
theological_decisions:
- issue: Bezeichnung Gottes
  choice: Gott, der Höchste
  alternative: Gott, der Allerhöchste, Schöpfer des Himmels und der Erde
  rationale: Nur der im vorgelegten Ge’ez-Text bezeugte Titel wird übersetzt; die längere Formel aus Genesis 14 wird nicht eingefügt.
- issue: Empfänger der geretteten Personen
  choice: „Gib uns“ im Plural
  alternative: „Gib mir“ nach Genesis 14,21
  rationale: Die eigentümliche Lesart des Jubiläenbuchs wird als genuine Textvariante bewahrt und nicht an den kanonischen Paralleltext angeglichen.
- issue: Abrams Verzicht und Rechte seiner Verbündeten
  choice: Abrams persönliche Ablehnung wird von Nahrung und Anteilen der Mitkämpfer abgegrenzt
  alternative: ein unterschiedsloser Verzicht auf sämtliche Beute
  rationale: Die Einschränkung des Quelltexts bleibt bestehen und wahrt die Spannung zwischen Abrams Eid und den Ansprüchen seiner Begleiter.
translation_notes:
  register: Moderne, würdige Standardsprache mit gut verständlicher Satzführung. „Habe“ hält den umfassenden Sinn des Besitzes fest; „junge Männer“ und „mit mir gezogen“ bewahren das leicht historische Erzählregister. Es sind keine Fußnoten nötig, da die quellenmäßig klare Pluralform direkt im Haupttext wiedergegeben wird.
