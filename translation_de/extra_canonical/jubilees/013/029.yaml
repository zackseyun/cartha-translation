    issue: Die Faden-Schuhriemen-Formel wird als Alternative wiedergegeben.
    rationale: Der Ge’ez-Text formuliert eine Grenze bzw. Spannweite („von ... bis ...“), nicht bloß zwei austauschbare Beispiele. Eine Wiedergabe mit „von einem Faden bis zu einem Schuhriemen“ erhält die rhetorische Totalität genauer.
