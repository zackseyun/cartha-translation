  rationale: Eine natürliche deutsche Wiedergabe der kausativen Bewegung nach draußen.
- source_word: ነጽር
  choice: Sieh hin
  rationale: Gibt den einleitenden Seh-Aufforderungscharakter wieder und lässt den Satz entsprechend der Versabgrenzung offen.
theological_decisions:
- issue: Identität und Herkunft des Erben
  choice: „der, der aus deinem Leib hervorgeht“
