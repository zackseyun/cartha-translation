  source_fidelity: 'Die Übersetzung gibt die belegte Versstruktur und den durch die Revisionsgeschichte gesicherten vollständigen Wortlaut wieder: zeitliche Einordnung, Neumond des dritten Monats, Offenbarung im Traum, Anrede an Abram, Schutzverheißung und großer Lohn. Der bereitgestellte ge’ezische Ausschnitt ist nach »Ich bin …« technisch abgeschnitten; die ergänzte Schutz- und Lohnklausel entspricht jedoch der dokumentierten Textfortsetzung und dem englischen Audit-Trail.'
