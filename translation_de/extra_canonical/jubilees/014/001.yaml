base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/014/001.yaml
  text: And after this new moon[a], in the fourth year of this week, on the new moon of the third month, the word of the LORD came to Abram in a dream, saying, “Do not fear, Abram; I am your protector, and your reward will be very great.”
translation:
  language: de
  text: 'Nach diesen Ereignissen erging im vierten Jahr dieser Jahrwoche, am Neumond[a] des dritten Monats, das Wort des HERRN in einem Traum an Abram: »Fürchte dich nicht, Abram! Ich bin dein Beschützer, und dein Lohn wird sehr groß sein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das ge’ezische Wort kann »beim Anbrechen« oder »am Anfang« bedeuten; im Kalendersystem des Jubiläenbuches bezeichnet es häufig den Neumond eines Monats.
    reason: cultural_note
lexical_decisions:
- source_word: ነገር (nagar)
  choice: Ereignissen
  rationale: Das Wort kann »Sache«, »Angelegenheit« oder im Zusammenhang »Ereignis« bedeuten. »Nach diesen Ereignissen« gibt die rückverweisende Wendung natürlich wieder, ohne sie mit dem späteren Kalenderausdruck zu vermischen.
- source_word: ዝሱባዔ (zi-subāʿe)
  choice: dieser Jahrwoche
  rationale: Im Jubiläenbuch bezeichnet die Siebenerperiode eine Woche von Jahren. »Jahrwoche« ist knapp und für den chronologischen Zusammenhang eindeutig.
- source_word: በሠርቀ፡ ሣልስ፡ ወርኅ (ba-śarqa sālis warḫ)
  choice: am Neumond des dritten Monats
  rationale: Śarqa kann den Beginn beziehungsweise das Anbrechen bezeichnen; im kalendarischen Sprachgebrauch des Jubiläenbuches ist hier »Neumond« sachgerecht. Die verbleibende Bedeutungsbreite wird in der Fußnote genannt.
- source_word: ኮነ፡ ቃለ፡ እግዚአብሔር፡ ኀበ፡ አብራም
  choice: erging das Wort des HERRN … an Abram
  rationale: Die traditionelle, würdige deutsche Wendung bildet die Konstruktion idiomatisch ab. Die Kapitälchen in »HERR« kennzeichnen den Gottesnamen.
- source_word: ኢትፍራህ
  choice: Fürchte dich nicht
  rationale: Direkte und geläufige Wiedergabe des negierten Furchtverbs.
- source_word: ሞገስከ
  choice: dein Beschützer
  rationale: Der durch die Textüberlieferungs- und Revisionsangaben bezeugte, im mitgelieferten Ge’ez-Ausschnitt jedoch abgeschnittene Ausdruck wird entsprechend der geprüften Konsultationsschicht als Schutzbezeichnung wiedergegeben.
- source_word: ወዐስብከ፡ ዐቢይ፡ ጥቀ
  choice: und dein Lohn wird sehr groß sein
  rationale: Die in den Revisionsangaben bezeugte Schlussklausel wird vollständig wiedergegeben; »Lohn« wahrt die theologische Spannung des Vergeltungsbegriffs.
theological_decisions:
- issue: Gottes Selbstbezeichnung und Schutzverheißung
  choice: »Ich bin dein Beschützer«
  alternative: »Ich bin dein Schild« / »Ich bin es«
  rationale: Der eingereichte Ge’ez-Ausschnitt bricht nach »Ich bin es/er« ab, doch die dokumentierte Fortsetzung und die auditierte englische Fassung bezeugen eine Schutzbezeichnung. »Beschützer« folgt dieser Evidenz, ohne eine im sichtbaren Ausschnitt nicht belegbare Metapher festzuschreiben.
- issue: Verheißung des Lohnes
  choice: »dein Lohn wird sehr groß sein«
  alternative: Auslassung der Klausel aufgrund des abgeschnittenen Quellenausschnitts
  rationale: Die jüngste Quellenprüfung identifiziert die fehlende Schlussklausel ausdrücklich und weist darauf hin, dass der bereitgestellte Ge’ez-Text technisch abgeschnitten ist. Die Klausel gehört daher in den Vers.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die chronologische Formel bleibt präzise, wird aber in natürlicher deutscher Satzstellung formuliert. »Jahrwoche« erklärt die Siebenerperiode knapp aus dem Kontext; die direkte Rede bewahrt den feierlichen Verheißungscharakter.
