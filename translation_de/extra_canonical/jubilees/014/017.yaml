  text: And in the fourth generation they will return here, for the sin of the Amorites is not complete until now.”
translation:
  language: de
  text: Und in der vierten Generation werden sie hierher zurückkehren; denn die Sünde der Amoriter ist bis jetzt noch nicht vollendet.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በትውልድ፡ ራብዕ
  choice: in der vierten Generation
  rationale: Gibt die Zeitangabe und Ordnungszahl unmittelbar und in natürlichem Standarddeutsch wieder.
- source_word: ይትመየጡ፡ ዝየ
  choice: werden sie hierher zurückkehren
  rationale: Bewahrt Zukunftsbezug, Rückkehrgedanken und das deiktische »hierher«.
- source_word: ኃጢአቶሙ፡ ለአሞሬዎን
  choice: die Sünde der Amoriter
  rationale: Das possessive »ihre Sünde« wird zur eindeutigen, idiomatischen Genitivverbindung entfaltet; der Singular des Ausgangstextes bleibt erhalten.
- source_word: ኢተፈጸመ ... እስከ፡ ይእዜ
  choice: ist bis jetzt noch nicht vollendet
  rationale: Gibt die Negation, den Vollendungsaspekt und die zeitliche Grenze wieder. »Noch nicht« ist im Deutschen zusammen mit »bis jetzt« idiomatisch und nicht so störend redundant wie im revidierten englischen Wortlaut.
theological_decisions:
- issue: Maß oder Vollendung der Sünde der Amoriter
  choice: ist ... noch nicht vollendet
  alternative: hat noch nicht ihr volles Maß erreicht
  rationale: Die gewählte Fassung folgt dem Verb für Vollendung enger und vermeidet die Eintragung des im Ausgangstext nicht ausdrücklich genannten Bildes eines »Maßes«.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die ge’ezische Satzstruktur. Das Semikolon gliedert Aussage und Begründung, ohne ihren Zusammenhang abzuschwächen. Das schließende Anführungszeichen übernimmt den fortlaufenden Redekontext der konsultierten Versfassung.
