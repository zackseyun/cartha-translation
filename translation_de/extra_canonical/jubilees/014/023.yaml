  text: And Abram rejoiced, and he told this whole matter to Sarai his wife, and he believed that he would have offspring, though she was not bearing. And Sarai advised Abram her husband and said to him, “Go in to Hagar, my Egyptian maidservant; perhaps I may build up offspring for you from her.” And Abram listened to the voice of Sarai his wife and said to her, “Do so.” And she took her,
translation:
  language: de
  text: 'Und Abram freute sich. Er erzählte seiner Frau Sarai die ganze Sache und glaubte, dass er Nachkommen haben würde, obwohl sie keine Kinder gebar. Und Sarai riet ihrem Mann Abram und sagte zu ihm: »Geh zu Hagar, meiner ägyptischen Dienerin. Vielleicht kann ich dir durch sie Nachkommen verschaffen.« Abram hörte auf die Stimme seiner Frau Sarai und sagte zu ihr: »Tu es.« Und sie nahm sie[a],'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das geʿezische Verb markiert sowohl die Handelnde als auch die Genommene als feminin, nennt hier aber keinen Namen. Im Zusammenhang sind wahrscheinlich Sarai und Hagar gemeint.
    reason: Die Fußnote erklärt die im Deutschen bewusst beibehaltene pronominale Mehrdeutigkeit und vermeidet die missverständliche Kennzeichnung des ohnehin übersetzten Wortlauts als „wörtlich“.
lexical_decisions:
- source_word: ዘርእ፡ / ዘርአ፡
  choice: Nachkommen
  rationale: Das Wort bezeichnet hier menschliche Nachkommenschaft. „Nachkommen“ ist im heutigen Deutsch natürlich und bewahrt den kollektiven Sinn besser als das wörtliche, aber missverständliche „Samen“.
- source_word: ባእ፡ ኀበ፡ አጋር፡
  choice: Geh zu Hagar
  rationale: Die verhüllende Ausdrucksweise des Ausgangstextes wird beibehalten; im Zusammenhang bezeichnet sie den Geschlechtsverkehr, ohne ihn expliziter zu formulieren als die Quelle.
- source_word: ሰአኪትየ፡
  choice: meiner … Dienerin
  rationale: „Dienerin“ ist modernes, verständliches Deutsch und gibt Hagars untergeordnete Stellung wieder, ohne die im Deutschen stärker belastete Bezeichnung „Sklavin“ einzutragen, wo die genaue soziale Nuance des geʿezischen Ausdrucks nicht eindeutig festliegt.
- source_word: አሐንጽ፡ … ዘርአ፡ እምኔሃ፡
  choice: kann ich dir durch sie Nachkommen verschaffen
  rationale: Das Bild des „Aufbauens“ wird idiomatisch wiedergegeben. Der vermittelte Erwerb von Nachkommenschaft durch Hagar bleibt deutlich, ohne eine unnatürliche deutsche Formulierung zu erzwingen.
- source_word: ወሰምዐ፡ … ቃለ፡
  choice: hörte auf die Stimme
  rationale: Die formale Wendung wird bewahrt, da sie im biblischen Erzählstil natürlich verständlich ist und mehr als bloßes akustisches Hören, nämlich Befolgen, ausdrückt.
- source_word: ወሥአታ፡
  choice: Und sie nahm sie
  rationale: Die feminine Subjektform und das feminine Objektsuffix werden wiedergegeben. Die im Ausgangstext nicht ausdrücklich genannten Bezüge bleiben erhalten, auch wenn im Zusammenhang wahrscheinlich Sarai und Hagar gemeint sind.
theological_decisions:
- issue: Abrams Glaube angesichts von Sarais Kinderlosigkeit
  choice: „glaubte, dass er Nachkommen haben würde, obwohl sie keine Kinder gebar“
  alternative: „glaubte, dass ihm Nachkommenschaft zuteilwerden würde; sie aber gebar nicht“
  rationale: Die Übersetzung wahrt die Spannung zwischen der geglaubten Verheißung und Sarais fortdauernder Kinderlosigkeit, ohne zu erklären, auf welchem Weg die Verheißung erfüllt werden sollte.
- issue: Sarais Plan mit Hagar
  choice: Neutral als Sarais Rat wiedergegeben
  alternative: Den Plan ausdrücklich als Leihmutterschaft oder als moralisches Fehlverhalten kennzeichnen
  rationale: Der Vers berichtet den Plan, bewertet ihn aber an dieser Stelle nicht ausdrücklich. Eine konfessionelle oder moraltheologische Deutung wird daher nicht in den Text eingeführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Erzählton. „Hörte auf die Stimme“ und die verhüllende Wendung „Geh zu Hagar“ bewahren die quellensprachliche Färbung; sonst wurden unnötige Archaismen vermieden. Das abschließende Komma zeigt, dass der Satz im folgenden Vers weitergeht.
