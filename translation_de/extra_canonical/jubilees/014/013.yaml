lexical_decisions:
- source_word: ይከልኦሙ
  choice: vertrieb sie
  rationale: Das Verb bezeichnet hier das Abwehren beziehungsweise Fernhalten der Vögel von den Opferstücken; „vertrieb sie“ gibt die Handlung natürlich und prägnant wieder.
- source_word: ኢየኀድጎ
  choice: ließ nicht zu
  rationale: Die negierte Verbform drückt aus, dass Abram etwas nicht gestattete.
- source_word: ይልከፍዎሙ
  choice: sie berührten
  rationale: Das Verb kann Berühren beziehungsweise Anrühren bezeichnen. „Berührten“ bewahrt die schlichte Aussage, ohne ein Fressen oder Beschädigen ausdrücklich einzutragen.
- source_word: ሶበ፡ ዐርበት፡ ፀሐይ
  choice: als die Sonne unterging
  rationale: Die Wendung bezeichnet das Sinken beziehungsweise Untergehen der Sonne und leitet den noch nicht abgeschlossenen folgenden Zusammenhang ein.
