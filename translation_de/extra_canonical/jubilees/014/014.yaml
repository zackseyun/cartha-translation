  terminology: „Abram“, „Nachkommen“, „versklaven“ und „bedrücken“ sind angemessen. „Schrecken der Finsternis“ bewahrt die enge, im Ausgangstext und im englischen Audit Trail bezeugte Verbindung, ohne die Bildsprache aufzulösen. Die Täter der Unterdrückung bleiben zutreffend unbestimmt.
