  yaml_path: translation/extra_canonical/jubilees/014/014.yaml
  text: A deep sleep fell upon Abram; and behold, a great terror of darkness fell upon him. And it was said to Abram, “Know with certainty that your seed will be aliens in a land not theirs, and they will enslave them and afflict them four hundred years.”
translation:
  language: de
  text: 'Da fiel ein tiefer Schlaf auf Abram, und siehe, ein großer Schrecken der Finsternis fiel auf ihn. Da wurde zu Abram gesagt: »Du sollst ganz sicher wissen: Deine Nachkommen werden als Fremde in einem Land leben, das ihnen nicht gehört. Man wird sie vierhundert Jahre lang versklaven und bedrücken.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ድንጋፄ
  choice: ein tiefer Schlaf
  rationale: Das Wort bezeichnet hier den auf Abram fallenden schweren, überwältigenden Schlafzustand; die Formulierung bewahrt zugleich die erkennbare Nähe zur Abrahamüberlieferung.
- source_word: ግርማ፡ ዐቢይ፡ ጽልመት
  choice: ein großer Schrecken der Finsternis
  rationale: Die ungewöhnliche Verbindung von Schrecken und Finsternis wird nicht zu bloßer Angst geglättet. Der Genitiv gibt die knappe Reihung des Ge’ez würdig und verständlich wieder.
- source_word: አእምሮ፡ አእምር
  choice: Du sollst ganz sicher wissen
  rationale: Die verstärkte Wiederholung des Verbs ‚wissen‘ wird idiomatisch als nachdrückliche Gewissheit ausgedrückt.
- source_word: ዘርእከ
  choice: deine Nachkommen
  rationale: Wörtlich ‚dein Same‘; im Deutschen bezeichnet ‚Nachkommen‘ den hier gemeinten kollektiven Personenkreis natürlich und eindeutig.
- source_word: ፈላሴ
  choice: Fremde
  rationale: Bezeichnet Menschen, die außerhalb ihres eigenen Landes als Zugezogene beziehungsweise Schutzfremde leben.
- source_word: ይቀንይዎሙ፡ ወያሐምምዎሙ
  choice: Man wird sie versklaven und … bedrücken
  rationale: Die unbestimmten Täter werden im Deutschen mit ‚man‘ wiedergegeben. ‚Versklaven‘ und ‚bedrücken‘ erfassen Zwangsdienst und leidvolle Misshandlung, ohne die Aussage abzuschwächen.
theological_decisions:
- issue: Bezeichnung von Abrams künftiger Linie
  choice: Nachkommen
  alternative: Same
  rationale: ‚Nachkommen‘ vermittelt den kollektiven Sinn ohne eine im modernen Deutschen missverständliche biologische oder dogmatisch aufgeladene Formulierung.
- issue: Verhältnis von Schrecken und Finsternis
  choice: Schrecken der Finsternis
  alternative: Schrecken und große Finsternis
  rationale: Die gewählte Fassung bewahrt die im vorliegenden Ge’ez und in der konsultierten englischen Fassung erkennbare enge Verbindung, ohne durch ein ergänztes ‚und‘ zwei getrennte Erscheinungen festzulegen.
- issue: Subjekt der Versklavung und Bedrückung
  choice: 'unbestimmte Täter: „Man wird sie …“'
  alternative: „sie werden ihnen dienen, und sie werden sie bedrücken“
  rationale: Die Pronomenfolge ist in einer streng wörtlichen Wiedergabe im Deutschen schwer verständlich. Die unpersönliche Konstruktion erhält die Nachkommen als Betroffene und vermeidet eine unbegründete nähere Bestimmung ihrer Unterdrücker.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die feierliche Erzählformel „und siehe“ sowie die ungewöhnliche Verbindung „Schrecken der Finsternis“ bleiben erhalten; syntaktische Unklarheiten werden nur so weit geglättet, wie es für gewöhnliche Leser nötig ist.
