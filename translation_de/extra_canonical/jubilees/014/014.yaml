  source_fidelity: 'Der Entwurf gibt die Abfolge und die wesentlichen Aussagen des ge''ezischen Textes zuverlässig wieder: tiefer Schlaf, großer Schrecken/Finsternis, die nachdrückliche Wissensaufforderung, Nachkommen als Fremde in einem fremden Land sowie Versklavung, Bedrängnis und die Zeitangabe von vierhundert Jahren. Die Umstellung der Zeitangabe ist sinnvoll, damit sie im Deutschen eindeutig beide folgenden Gewaltverben umfasst.'
