  yaml_path: translation/extra_canonical/jubilees/014/024.yaml
  text: Sarah took Hagar, her maidservant, the Egyptian, and gave her to Abram her husband as a wife. And he went in to her, and she conceived and bore a son, and he called his name Ishmael, in the fifth year of this week; and that year was the eighty-sixth year in Abram’s life.
translation:
  language: de
  text: Sara nahm Hagar, ihre ägyptische Dienerin, und gab sie ihrem Mann Abram zur Frau. Er ging zu ihr ein, und sie wurde schwanger und gebar einen Sohn. Im fünften Jahr dieser Jahrwoche gab er ihm den Namen Ismael; jenes Jahr war das sechsundachtzigste Lebensjahr Abrams.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ለአአታ
  choice: ihre Dienerin
  rationale: Das Wort bezeichnet hier Hagars Stellung gegenüber Sara; „Dienerin“ ist im heutigen Deutsch verständlich und weniger irreführend als das altertümliche „Magd“.
- source_word: ለምታ
  choice: ihrem Mann
  rationale: Gibt die im Ausgangstext ausdrücklich genannte Beziehung Saras zu Abram wieder.
- source_word: ትኩኖ፡ ብእሲተ
  choice: zur Frau
  rationale: Bewahrt die formale eheliche Bezeichnung des Ge’ez, ohne sie durch eine konfessionell oder sozialgeschichtlich stärker deutende Formulierung zu ersetzen.
- source_word: ወቦአ፡ ኀቤሃ
  choice: Er ging zu ihr ein
  rationale: Die traditionelle biblische Umschreibung wahrt den verhüllenden Charakter des Ausgangsausdrucks und bleibt im Kontext verständlich.
- source_word: በዓመተ፡ ኃምስ፡ ዘዘሰብዐ
  choice: im fünften Jahr dieser Jahrwoche
  rationale: Der Ausdruck gehört zur chronologischen Siebenerstruktur des Jubiläenbuchs; „Jahrwoche“ gibt diese prägnant wieder.
- source_word: በሕይወተ፡ አብራም
  choice: Lebensjahr Abrams
  rationale: Natürliches modernes Deutsch für die Altersangabe „im Leben Abrams“.
theological_decisions:
- issue: Status Hagars als Frau Abrams
  choice: zur Frau
  alternative: zur Nebenfrau
  rationale: Der Ausgangstext verwendet das gewöhnliche Wort für „Frau“; eine Spezifizierung als „Nebenfrau“ wäre eine interpretierende soziale Einordnung, die hier nicht ausdrücklich formuliert wird.
- issue: Subjekt der Namensgebung
  choice: Er gab ihm den Namen Ismael
  alternative: Sie gab ihm den Namen Ismael
  rationale: Die maskuline Verbform im Ge’ez weist auf Abram als Subjekt. Die Übersetzung erhält diese grammatische Aussage, obwohl die parallele Genesisüberlieferung textgeschichtlich Anlass zu Varianten bieten kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bibelsprachlicher Zurückhaltung. Die sexuelle Umschreibung „ging zu ihr ein“ wurde bewusst erhalten; die Chronologie ist zur besseren Lesbarkeit in einen neuen Satz gegliedert.
