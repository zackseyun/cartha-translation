lexical_decisions:
- source_word: ድራይ፡ ዘማምሬ
  choice: die Eiche von Mamre
  rationale: Die Wendung bezeichnet den bekannten Baum von Mamre; „Eiche“ folgt der überlieferten Identifikation und ergibt im Deutschen eine natürliche Ortsangabe.
- source_word: ቅሩበ፡ ኬብሮን
  choice: nahe bei Hebron
  rationale: Gibt die räumliche Nähe knapp und idiomatisch wieder.
- source_word: ወሐነጸ፡ ምሥዋዐ፡ ህየ
  choice: Dort baute er einen Altar
  rationale: Bewahrt Handlung, Gegenstand und Ortsadverb in natürlichem modernem Deutsch.
- source_word: ወዘብሐ
  choice: und brachte ein Schlachtopfer dar
  rationale: Das Verb bezeichnet ein kultisches Schlachten beziehungsweise Opfern. Im Zusammenhang mit dem Altar macht „ein Schlachtopfer darbringen“ den Opfercharakter deutlich, ohne ihn auf bloßes Töten zu reduzieren.
theological_decisions:
- issue: Art des Opfers
  choice: brachte ein Schlachtopfer dar
  alternative: opferte
  rationale: Die konkretere Formulierung erhält den im Quellverb enthaltenen Bezug zum Schlachten, ohne eine nicht genannte Tierart oder weitere Ritualdetails hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; knapper erzählender Stil. Der Vers setzt offenbar einen Satz aus dem vorhergehenden Kontext fort, daher beginnt der Text entsprechend mit einer Nominalgruppe.
