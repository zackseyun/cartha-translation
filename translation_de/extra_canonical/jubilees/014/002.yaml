  yaml_path: translation/extra_canonical/jubilees/014/002.yaml
  text: and your reward will be exceedingly great.” And he said[a], “Lord, Lord, what will you give me? For I go childless, and the son of Maseq, the son of my maidservant, is Damascus."”
translation:
  language: de
  text: '„Und dein Lohn wird überaus groß sein.“ Da sagte er: „Herr, Herr, was willst du mir geben? Ich gehe doch kinderlos dahin, und der Sohn Maseqs, der Sohn meiner Magd, ist Damaskus.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der ge’ezische Text ist hier ungewöhnlich knapp und lautet wörtlich „ist Damaskus“. Gemeint ist offenbar der als Erbe betrachtete Hausangehörige, der in Genesis 15,2 als Elieser von Damaskus bezeichnet wird; der Name „Elieser“ steht in diesem Wortlaut jedoch nicht.
    reason: textual_note
lexical_decisions:
- source_word: ዐስብከ
  choice: dein Lohn
  rationale: Das Substantiv bezeichnet Lohn oder Vergeltung; „Lohn“ gibt den Zusammenhang knapp und natürlich wieder.
- source_word: ይፈደፍድ፡ ጥቀ
  choice: wird überaus groß sein
  rationale: Die Verbindung drückt eine sehr starke Steigerung aus; die deutsche Wendung bewahrt Nachdruck und Zukunftsbezug.
- source_word: ዘእንበለ፡ ውሉድ
  choice: kinderlos
  rationale: Wörtlich „ohne Kinder/Nachkommen“; „kinderlos“ ist im Deutschen idiomatisch und inhaltlich genau.
- source_word: አመትየ
  choice: meiner Magd
  rationale: Das Wort bezeichnet eine weibliche Dienerin beziehungsweise Sklavin; „Magd“ entspricht dem würdevollen biblischen Register, ohne die soziale Unterordnung zu verdecken.
- source_word: ውእቱ፡ ደማስቆስ
  choice: ist Damaskus
  rationale: Die auffällige, knappe Lesart des ge’ezischen Textes wird beibehalten; der im Genesis-Parallelsatz bekannte Name Elieser wird nicht in den Haupttext eingefügt.
theological_decisions:
- issue: Identität des im Schlusssatz genannten Erben
  choice: Die ge’ezische Lesart „ist Damaskus“ bleibt im Haupttext stehen.
  alternative: Den Satz harmonisierend als Hinweis auf „Elieser von Damaskus“ wiedergeben.
  rationale: Die Übersetzung soll die überlieferte textliche Spannung bewahren und keinen Namen ergänzen, der im vorliegenden ge’ezischen Wortlaut fehlt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Klang. Die doppelte Anrede „Herr, Herr“ und die auffällige Schlussformulierung wurden bewusst erhalten; „Ich gehe doch kinderlos dahin“ gibt den wörtlichen Bewegungsausdruck natürlich wieder.
