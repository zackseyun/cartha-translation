lexical_decisions:
- source_word: ለእኂዝ፡ ለዓለም
  choice: als ewigen Besitz
  rationale: Die Konstruktion bezeichnet einen dauerhaften, immerwährenden Besitz; die deutsche Wendung ist knapp und entspricht dem überlieferten Sinn.
- source_word: ወለከዊነ፡ ለከ፡ አምላከ
  choice: und dir … Gott zu sein
  rationale: Der Infinitiv wird unmittelbar wiedergegeben, ohne eine modale Abschwächung wie »damit ich … sein könnte« einzuführen.
- source_word: ወለዘርእከ፡ እምድኅሬከ
  choice: und deinen Nachkommen nach dir
  rationale: »Same« bezeichnet hier kollektiv die Nachkommenschaft; »Nachkommen« ist im modernen Deutsch natürlich und bewahrt den kollektiven Sinn.
- source_word: ወይቤ
  choice: 'Und er sagte:'
  rationale: Die anschließende Redeeinleitung bleibt entsprechend der Versabgrenzung offen und leitet den Folgetext ein.
theological_decisions:
- issue: Gottes Bundesverhältnis zu Abraham und seinen Nachkommen
  choice: dir und deinen Nachkommen nach dir Gott zu sein
  alternative: dein Gott und der Gott deiner Nachkommen nach dir zu sein
  rationale: Die gewählte Fassung hält sich enger an die prädikative Quellkonstruktion und vermeidet eine erklärende Erweiterung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Da der Vers mitten im Satz einsetzt, beginnt die Übersetzung entsprechend mit einem Satzfragment; die abschließende Redeeinleitung bleibt wegen der vorgegebenen Versgrenze offen.
