  text: And he said to him, “I am the LORD who brought you out from Ur of the Chaldeans, so that I might give you this land to inherit it.”
translation:
  language: de
  text: 'Und er sagte zu ihm: „Ich bin der HERR, der dich aus Ur der Chaldäer herausgeführt hat, um dir dieses Land zu geben, damit du es als Erbe in Besitz nimmst.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der bereitgestellte äthiopische Textausschnitt bricht nach „Land“ ab. Der Versschluss „dieses Land zu geben, damit du es als Erbe in Besitz nimmst“ folgt dem vollständigen Text der angegebenen Ausgabe.
    reason: Die Anmerkung macht transparent, dass der im Aufgabenkontext übermittelte Quellenausschnitt unvollständig ist und der Versschluss nach der vollständig bezeugten Edition ergänzt wurde.
lexical_decisions:
- source_word: እግዚአብሔር
  choice: der HERR
  rationale: Die traditionelle Gottesbezeichnung wird entsprechend ihrem göttlichen Eigennamencharakter mit Kapitälchen wiedergegeben.
- source_word: ኡር፡ ዘከለዳዊያን
  choice: Ur bei den Chaldäern
  rationale: Bewahrt die Zuordnung Urs zu den Chaldäern, ohne das im Deutschen missverständliche „Ur der Chaldäer“ als Besitzverhältnis erscheinen zu lassen.
- source_word: ከመ፡ እሀብከ
  choice: um dir … zu geben
  rationale: Gibt die finale Konstruktion natürlich und eng am Ausgangstext wieder.
- source_word: ትረሳ
  choice: damit du es als Erbe in Besitz nimmst
  rationale: Bringt sowohl den Erbgedanken als auch die tatsächliche Besitznahme zum Ausdruck und vermeidet das unnatürliche „es erben“, da das Land hier von Gott zugesprochen wird.
theological_decisions:
- issue: Verhältnis von göttlicher Gabe und menschlicher Besitznahme
  choice: „um dir dieses Land zu geben, damit du es als Erbe in Besitz nimmst“
  alternative: „um dir dieses Land zum Erbbesitz zu geben“
  rationale: 'Die gewählte Fassung erhält beide im vollständigen Vers erkennbaren Aussagen: Gott gibt das Land, und Abraham soll es erblich in Besitz nehmen. Sie verschmilzt diese Aspekte nicht zu einem einzigen theologischen Fachbegriff.'
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die direkte Rede bleibt schlicht und feierlich; „als Erbe in Besitz nehmen“ ist verständlicher als eine wörtlich-steife Konstruktion und bewahrt dennoch die Erb- und Besitznuance.
