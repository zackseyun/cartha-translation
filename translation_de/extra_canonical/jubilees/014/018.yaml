  text: And he awoke from his sleep and arose, and the sun had set, and there was a flame. And behold, a smoking furnace and a torch of fire passed between the pieces.
translation:
  language: de
  text: Und er erwachte aus seinem Schlaf und stand auf. Die Sonne war untergegangen, und eine Flamme war da. Und siehe, ein rauchender Ofen und eine Feuerfackel zogen zwischen den Stücken hindurch.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነድ
  choice: Flamme
  rationale: Das geʿezische Substantiv bezeichnet hier eine Flamme bzw. ein Feuer; die Wiedergabe folgt dem vorliegenden Text und vermeidet eine Angleichung an die Dunkelheit in Genesis 15,17.
- source_word: እቶን፡ ይጤይስ
  choice: ein rauchender Ofen
  rationale: Die Wortgruppe beschreibt einen Ofen, der raucht; diese konkrete Bildsprache bleibt erhalten.
- source_word: ልባስ፡ እሳት
  choice: Feuerfackel
  rationale: Im Kontext bezeichnet die Verbindung einen brennenden, fackelartigen Gegenstand; „Feuerfackel“ bewahrt die ausdrückliche Feuerbestimmung.
- source_word: ክፍል
  choice: Stücken
  rationale: Gemeint sind die zuvor geteilten Opferstücke; im Deutschen ist die verkürzte kontextuelle Bezeichnung natürlich und verständlich.
theological_decisions:
- issue: Verhältnis zu Genesis 15,17
  choice: „eine Flamme war da“ gemäß ወነድ፡ ኮነ፡
  alternative: „es wurde dunkel“ nach einer Harmonisierung mit Genesis 15,17
  rationale: Der konkrete geʿezische Wortlaut nennt eine Flamme. Eine aus dem Genesistext übernommene Dunkelheit würde die eigenständige Textgestalt des Jubiläenbuches überschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter biblischer Bildsprache. „Und siehe“ wurde als markante narrative Formel beibehalten; die Satzglieder wurden für natürliche deutsche Lesbarkeit behutsam gegliedert.
