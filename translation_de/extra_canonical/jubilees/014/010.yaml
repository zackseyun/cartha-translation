lexical_decisions:
- source_word: ጠሌ፡ ዘሠለስቱ፡ ዓመት
  choice: eine dreijährige Ziege
  rationale: ጠሌ bezeichnet eine Ziege; die Altersangabe wird im Deutschen idiomatisch als Adjektiv wiedergegeben.
- source_word: በገዐ፡ ዘሠለስቱ፡ ዓመት
  choice: einen dreijährigen Widder
  rationale: በገዐ bezeichnet hier den männlichen Schafbock; »Widder« ist die natürliche deutsche Opferterminologie.
- source_word: መንጢጠ፡ ወርግብ
  choice: eine Turteltaube und eine Taube
  rationale: Die beiden unterschiedlichen ge’ezischen Vogelbezeichnungen werden unterschieden; der Text nennt bei der zweiten Taube kein ausdrücklich junges Tier.
- source_word: በመንፈቀ፡ ወርኅ
  choice: in der Mitte des Monats
  rationale: Die ausdrückliche Zeitangabe wird wörtlich und verständlich beibehalten.
- source_word: ኀበ
  choice: bei
  rationale: Die Präposition leitet ein Bezugswort ein, das durch die Versaufteilung erst im folgenden Vers steht; »bei« hält diese syntaktische Verbindung offen.
