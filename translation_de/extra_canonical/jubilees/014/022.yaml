  yaml_path: translation/extra_canonical/jubilees/014/022.yaml
  text: And on this day we made the covenant with Abram[a], just as we had made it in this month with Noah; and Abram renewed it as a festival and as an ordinance for himself forever.
translation:
  language: de
  text: Und an diesem Tag schlossen wir mit Abram den Bund,[a] wie wir ihn in diesem Monat mit Noah geschlossen hatten; und Abram erneuerte ihn als Fest und als eine für ihn auf ewig geltende Ordnung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Plural „wir schlossen … den Bund“ gehört zum Rahmen des Jubiläenbuches, in dem ein himmlischer Bote Mose die Offenbarung übermittelt; wahrscheinlich spricht hier der erzählende Engel.
    reason: cross_reference
lexical_decisions:
- source_word: ተካየድነ፡ ኪዳነ
  choice: schlossen wir … den Bund
  rationale: Die äthiopische Wendung bezeichnet das Eingehen bzw. Schließen eines Bundes; die idiomatische deutsche Formulierung bewahrt das ausdrücklich genannte Wir.
- source_word: ሐደሶ
  choice: erneuerte ihn
  rationale: Das Verb bedeutet „erneuern“; das Pronomen bezieht sich am natürlichsten auf den Bund.
- source_word: በበዓል
  choice: als Fest
  rationale: 'Die Präposition mit dem Substantiv wird hier modal bzw. prädikativ wiedergegeben: Abram beging die Erneuerung in Gestalt eines Festes.'
- source_word: ለሥርዓት፡ ሎቱ፡ እስከ፡ ለዓለም
  choice: als eine für ihn ewig geltende Ordnung
  rationale: Die Formulierung hält sowohl den persönlichen Bezug „für ihn“ als auch die dauerhafte Geltung fest und klingt im modernen Deutschen natürlich.
theological_decisions:
- issue: Sprecher des Plurals „wir“
  choice: Der erste Person Plural bleibt im Haupttext unverändert stehen und wird nur in der Fußnote kontextualisiert.
  alternative: Den Sprecher ausdrücklich als Engel oder himmlische Wesen benennen.
  rationale: Der ge’ezische Text nennt an dieser Stelle das Subjekt nicht ausdrücklich. Eine Auflösung im Haupttext würde die erzählerische und theologische Mehrdeutigkeit stärker bestimmen als die Quelle.
- issue: Bezug der Erneuerung
  choice: „ihn“ verweist auf den Bund.
  alternative: Abram erneuerte das Fest oder den Ritus.
  rationale: Der Bund ist das nächstliegende und inhaltlich tragende Bezugswort; Fest und Ordnung beschreiben, wie Abram seine Erneuerung dauerhaft beging.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Bund schließen“ und „geltende Ordnung“ sind allgemein verständlich; die etwas feierliche Satzführung entspricht dem antiken Bundes- und Festkontext.
