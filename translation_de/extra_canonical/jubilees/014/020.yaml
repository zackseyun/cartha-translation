  yaml_path: translation/extra_canonical/jubilees/014/020.yaml
  text: the Kenites, and the Kenizzites, and the Kadmonites, and the Perizzites, and the Rephaim, and the Rakites[a], and the Avvites, and the Amorites, and the Canaanites, and the Girgashites, and the Jebusites.
translation:
  language: de
  text: den Kenitern und den Kenisitern und den Kadmonitern und den Perisitern und den Refaïtern und den Rakitern[a] und den Awitern und den Amoritern und den Kanaanitern und den Girgaschitern und den Jebusitern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hier mit »Rakiter« wiedergegebene Volksname folgt der ge'ezischen Lesart. In parallelen Überlieferungen könnte dieselbe Gruppe unter einer anderen Namensform bekannt sein. Die überlieferte Form wird hier nicht harmonisiert.
    reason: textual_variant
lexical_decisions:
- source_word: ለራኬዎን
  choice: den Rakitern
  rationale: Bewahrt die überlieferte ge'ezische Namensform Rakewon/Rakiter, statt sie an die Arkiter paralleler Überlieferungen anzugleichen.
- source_word: ለራፋኤዎን
  choice: den Refaïtern
  rationale: Gibt den Volksnamen als Refaïter wieder und unterscheidet ihn durch die deutsche Ethnonymform von anderen möglichen Verwendungen des Namens Refaïm.
- source_word: ለገር ጌሴዎን
  choice: den Girgaschitern
  rationale: Verwendet die im Deutschen etablierte biblische Form des Ethnonyms.
theological_decisions: []
translation_notes:
  register: Eine würdige, verständliche Aufzählung mit wiederholtem »und« bewahrt die parataktische Struktur der Vorlage. Die Volksnamen stehen nach dem im Ge'ez wiederholten Dativ-/Zielpräfix in der deutschen Dativform.
