  text: the stars. And he said to him, “So will your seed be.” And he believed the LORD, and it was reckoned to him as righteousness.
translation:
  language: de
  text: 'die Sterne. Und er sagte zu ihm: „So wird deine Nachkommenschaft sein.“ Und er glaubte dem HERRN, und es wurde ihm als Gerechtigkeit angerechnet.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘርእከ
  choice: deine Nachkommenschaft
  rationale: Das äthiopische Wort bezeichnet hier kollektiv Abrahams künftige Nachkommen; „Nachkommenschaft“ gibt diesen Sinn im modernen Deutschen natürlich wieder.
- source_word: ወአምኖ፡ ለእግዚአብሔር
  choice: Und er glaubte dem HERRN
  rationale: Die Konstruktion bezeichnet das Vertrauen beziehungsweise Glauben gegenüber dem Herrn; der Dativ bewahrt die knappe Form des Ausgangstextes.
- source_word: ወተኈለቍ፡ ጽድቀ
  choice: und es wurde ihm als Gerechtigkeit angerechnet
  rationale: Die passive Wendung wird in Anlehnung an den erkennbaren Genesis-Bezug wiedergegeben; „angerechnet“ bildet den forensisch-rechnerischen Ausdruck ab, ohne dessen theologischen Gehalt weiter festzulegen.
theological_decisions:
- issue: Unbestimmtes Subjekt dessen, was als Gerechtigkeit angerechnet wird
  choice: „es wurde ihm als Gerechtigkeit angerechnet“
  alternative: „er rechnete es ihm als Gerechtigkeit an“
  rationale: Der vorliegende Text formuliert passiv und nennt den Handelnden nicht ausdrücklich. Die deutsche Fassung bewahrt diese Offenheit, statt den HERRN als grammatisches Subjekt einzusetzen.
translation_notes:
  register: Moderne, würdige Standardsprache. Das Fragment beginnt mitten im vorausgehenden Satz mit „die Sterne.“; diese kapitelversbedingte Unvollständigkeit wird quellennah beibehalten. „HERR“ folgt der üblichen typografischen Wiedergabe des Gottesnamens im deutschen Bibelstil.
