  source_fidelity: Die Satzstruktur und die Todesumschreibung werden zutreffend wiedergegeben. „In hohem Alter“ erfasst zwar das Alter, lässt jedoch das ausdrücklich qualifizierende ሠናይ („gut“) unberücksichtigt. Die Wendung „in gutem Alter“ bewahrt diese Nuance ohne sie ausdeutend zu verstärken.
  naturalness: „Du aber wirst in Frieden zu deinen Vätern gehen und in gutem Alter begraben werden“ ist modernes, verständliches Standarddeutsch mit angemessen würdig-biblischem Register. Die Formulierung ist idiomatisch und vermeidet die etwas enger auf bloße Lebensdauer zielende Aussage „in hohem Alter“.
  terminology: „Zu deinen Vätern gehen“ bewahrt die bildhafte Todesumschreibung, ohne weitergehende Aussagen über den Zustand nach dem Tod festzulegen. „In Frieden“ und das Passiv „begraben werden“ entsprechen dem Ausgangstext. „In gutem Alter“ entspricht der positiven Altersqualifikation der Vorlage und dem englischen Audit trail („at a good old age“).
