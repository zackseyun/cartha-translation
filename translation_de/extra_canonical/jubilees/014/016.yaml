translation:
  language: de
  text: Du aber wirst in Frieden zu deinen Vätern gehen und in gutem Alter begraben werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተሐውር፡ ኀበ፡ አበዊከ
  choice: wirst zu deinen Vätern gehen
  rationale: Gibt die Bewegungsformulierung des geʿezischen Textes wörtlich und zugleich in natürlichem, würdigem Deutsch wieder.
- source_word: በሰላም
  choice: in Frieden
  rationale: Die übliche und direkte Wiedergabe der modalen Wendung.
- source_word: ወትትቀበር
  choice: und ... begraben werden
  rationale: Bewahrt das Passiv und die futurische Aussage des Ausgangstextes.
- source_word: በርእስ፡ ሠናይ
  choice: in hohem Alter
  rationale: Die idiomatische deutsche Wendung vermittelt den Sinn eines guten beziehungsweise erfüllten Alters, ohne die unnatürliche Formulierung „in einem guten Alter“ zu verwenden.
theological_decisions:
- issue: „Zu deinen Vätern gehen“ als Todesumschreibung
  choice: Die bildhafte Formulierung bleibt unverändert erhalten.
  alternative: „mit deinen Vorfahren vereint werden“ oder schlicht „sterben“
  rationale: Die Quellenaussage bezeichnet den Tod durch das Gehen zu den Vätern. Eine erklärende Auflösung würde mögliche Vorstellungen von familiärer Zugehörigkeit im Tod unnötig festlegen oder abschwächen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdig-biblischem Klang. Die koordinierte Satzstruktur und das traditionelle Bild „zu deinen Vätern gehen“ bleiben erhalten.
