  text: Eliezer—he will inherit me, and to me you have not given seed.” And he said to him, “This one will not inherit you,”
translation:
  language: de
  text: '„Elieser – er wird mich beerben, und mir hast du keine Nachkommen gegeben.“ Und er sagte zu ihm: „Dieser wird dich nicht beerben,“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይወርሰኒ
  choice: wird mich beerben
  rationale: Gibt das Verb ‚erben/beerben‘ mit Abraham als direktem Objekt natürlich und präzise wieder.
- source_word: ዘርአ
  choice: Nachkommen
  rationale: Das wörtliche ‚Same‘ bezeichnet hier im Kontext menschliche Nachkommenschaft; ‚Nachkommen‘ ist im modernen Deutsch klar und würdig.
- source_word: ውእቱ / ዘ
  choice: er / Dieser
  rationale: Bewahrt zunächst die emphatische Identifizierung Eliesers und anschließend die demonstrative Zurückweisung dieses genannten Erben.
theological_decisions:
- issue: Art der verheißenen Nachkommenschaft
  choice: keine Nachkommen
  alternative: keinen Samen
  rationale: Die Aussage bleibt hinsichtlich Zahl und weiterer Entfaltung der Verheißung offen, während die gemeinte menschliche Nachkommenschaft verständlich ausgedrückt wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich erhält die emphatische Nennung Eliesers. Das Schlusskomma bleibt stehen, weil der vorgelegte Vers mitten in der direkten Rede endet.
