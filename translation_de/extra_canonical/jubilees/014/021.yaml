  text: And that day passed, and Abram offered up the pieces and the birds and their grain offerings and their drink offerings, and fire consumed them.
translation:
  language: de
  text: Und jener Tag verging. Abram brachte die Stücke und die Vögel samt ihren Speisopfern[a] und Trankopfern dar, und Feuer verzehrte sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Opfergaben.'
    reason: Das ge’ezische Wort kann allgemeiner „Opfergaben“ bedeuten; der Zusammenhang mit den Trankopfern legt hier „Speisopfer“ nahe.
lexical_decisions:
- source_word: አዕረገ
  choice: brachte … dar
  rationale: Das Kausativverb bedeutet wörtlich „hinaufbringen lassen/bringen“ und wird hier kultisch im Sinn des Darbringens gebraucht.
- source_word: ክፍላተ
  choice: die Stücke
  rationale: Bewahrt den konkreten Bezug auf die zuvor geteilten Opfertiere.
- source_word: አዕዋፈ
  choice: die Vögel
  rationale: Direkte und natürliche Wiedergabe des Plurals.
- source_word: መሥዋዕቶሙ
  choice: ihren Speisopfern
  rationale: In der Verbindung mit den unmittelbar folgenden Trankopfern ist die kultisch präzise Wiedergabe „Speisopfer“ wahrscheinlich; die allgemeinere Bedeutung „Opfergaben“ bleibt in der Fußnote erhalten.
- source_word: ሞጻሕቶሙ
  choice: Trankopfern
  rationale: Der Begriff bezeichnet kultische Ausgüsse beziehungsweise Trankopfer.
- source_word: በልዐቶሙ፡ እሳት
  choice: Feuer verzehrte sie
  rationale: Gibt Wortfolge und Bild des ge’ezischen Ausdrucks knapp und würdig wieder.
theological_decisions:
- issue: Art der mit den Tieren dargebrachten Opfergaben
  choice: Speisopfer
  alternative: Opfergaben
  rationale: Die Paarung mit „Trankopfern“ spricht für die spezifische kultische Kategorie, ohne die breitere lexikalische Möglichkeit zu verschweigen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der erste Satz folgt dem erzählerischen Übergang des Ausgangstextes; „samt“ macht die Zuordnung der begleitenden Speis- und Trankopfer im Deutschen klar, ohne eine zusätzliche Deutung einzuführen.
