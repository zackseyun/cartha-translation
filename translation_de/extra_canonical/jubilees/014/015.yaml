  text: And I will also judge the nation to whom they will be enslaved, and after this they will come out from there with much property.
translation:
  language: de
  text: Auch das Volk, dem sie versklavt werden, werde ich richten; danach werden sie von dort mit großem Besitz ausziehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወለሕዝብ፡ኒ፡
  choice: Auch das Volk
  rationale: Die enklitische Partikel -ኒ gibt den einschließenden Zusatz „auch“ wieder; das vorangestellte ወ wird im Deutschen durch den natürlichen Satzanschluss mitgetragen.
- source_word: ይትቀነዩ፡
  choice: dem sie dienen werden
  rationale: Das Imperfekt steht im prophetischen Zukunftsrahmen. „Dienen“ bewahrt die lexikalische Breite besser als das stärker festlegende „versklavt sein“.
- source_word: እፈትሖሙ፡ ሎሙ፡
  choice: werde ich richten
  rationale: Die Form bezeichnet hier Gottes gerichtliches Vorgehen gegen das betreffende Volk; die idiomatische deutsche Fassung vermeidet eine unnötig explizite Ergänzung des pronominalen Bezugs.
- source_word: እምድኅረዝ፡
  choice: danach
  rationale: Knappe, natürliche Wiedergabe von „nach diesem/danach“.
- source_word: ምስለ፡ ጥሪት፡ ብዙኅ።
  choice: mit großem Besitz
  rationale: ጥሪት bezeichnet Habe, Vermögen oder Besitz; „großer Besitz“ entspricht dem quantitativen Ausdruck und klingt im Deutschen würdig und verständlich.
theological_decisions:
- issue: Art des Dienstverhältnisses
  choice: dem sie dienen werden
  alternative: von dem sie versklavt werden
  rationale: Der Kontext lässt Zwangsdienst beziehungsweise Knechtschaft erkennen, doch die Quellformulierung kann formal breiter als „dienen“ wiedergegeben werden. So wird die Härte des Verhältnisses nicht dogmatisch oder lexikalisch überbestimmt.
- issue: Bedeutung des göttlichen Richtens
  choice: werde ich richten
  alternative: werde ich bestrafen
  rationale: „Richten“ erhält die theologische und forensische Spannung des Ausgangstextes, während „bestrafen“ das Ergebnis stärker festlegen würde.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit prophetischem Zukunftsbezug. Der Satzbau bleibt nah an der Quelle, ohne geezische beziehungsweise semitische Anschlussformen unnatürlich nachzubilden.
