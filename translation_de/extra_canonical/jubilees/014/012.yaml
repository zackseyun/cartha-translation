  text: all these, and poured out their blood upon the altar, and divided them in the middle, and placed them opposite one another, face to face; but the birds he did not divide. And birds came down upon the pieces,
translation:
  language: de
  text: Er nahm alle diese und goss ihr Blut auf den Altar, teilte sie in der Mitte und legte die Hälften einander gegenüber, mit den Vorderseiten zueinander; die Vögel aber teilte er nicht. Da kamen Vögel auf die Stücke herab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ደሞሙ
  choice: ihr Blut
  rationale: Das Suffix bezieht sich auf die zuvor genannten Opfertiere; die direkte Wiedergabe bewahrt den Opferkontext.
- source_word: ምሥዋዕ
  choice: Altar
  rationale: Das äthiopische Wort bezeichnet hier den Opferaltar, auf den das Blut gegossen wird.
- source_word: ነፈቆሙ፡ እማእከል
  choice: teilte sie in der Mitte
  rationale: Gibt den Vorgang des Halbierens eng und idiomatisch wieder.
- source_word: አንጻራቲሆሙ፡ በበገጾሙ
  choice: die Hälften einander gegenüber, eine jede ihrer anderen zugewandt
  rationale: Bewahrt sowohl das Gegenüberlegen als auch die distributive Aussage, dass die jeweiligen Seiten einander zugewandt waren.
- source_word: አዕዋፍ
  choice: Vögel
  rationale: Der Text verwendet denselben allgemeinen Ausdruck sowohl für die nicht geteilten Opfervögel als auch für die herabkommenden Vögel.
- source_word: ክፍሉ
  choice: die Stücke
  rationale: Im Kontext sind die zerteilten Teile der Opfertiere gemeint; die Wiedergabe entspricht zugleich der traditionellen Ausdrucksweise des Parallelberichts.
theological_decisions:
- issue: Beziehung zum Bundesritual in Genesis 15
  choice: Die konkrete Handlung wird ohne zusätzliche kultische oder symbolische Deutung wiedergegeben.
  alternative: Die Stücke ausdrücklich als Teile eines Bundesschlussopfers zu bezeichnen.
  rationale: Der Vers schildert das Ritual, erklärt seine theologische Bedeutung aber an dieser Stelle nicht; eine Deutung soll nicht in den Text eingetragen werden.
- issue: Identität der herabkommenden Vögel
  choice: Allgemein „Vögel“
  alternative: „Raubvögel“
  rationale: Der gegebene äthiopische Text sagt lediglich „Vögel“. Die spezifischere Wiedergabe „Raubvögel“ würde wahrscheinlich aus dem Genesis-Paralleltext ergänzt.
translation_notes:
  register: Moderner, würdiger Erzählstil mit enger Bindung an den ge'ezischen Wortlaut. Das einleitende Fragment „alle diese“ bleibt erhalten, weil der Vers syntaktisch an die vorausgehende Aufzählung anschließt. Das Geschlecht des Handelnden wird entsprechend dem Kontext und den Verbalformen mit „er“ wiedergegeben.
