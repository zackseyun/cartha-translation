    rationale: „eine jede ihrer anderen zugewandt“ ist sprachlich missglückt. „Die Hälften einander gegenüber, mit den Vorderseiten zueinander“ gibt die Gegenüberstellung und die Angabe der zugewandten Seiten verständlich wieder.
