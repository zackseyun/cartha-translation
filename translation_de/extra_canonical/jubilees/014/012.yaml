  terminology: „Altar“, „Blut“, „Hälften“, „Vögel“ und „Stücke“ sind passend. „Vögel“ ist gegenüber der nicht im ge'ezischen Wortlaut belegten Einengung auf Raubvögel vorzuziehen.
