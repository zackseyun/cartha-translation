  source_fidelity: 'Die wesentlichen Handlungen sind richtig wiedergegeben: das Ausgießen des Blutes auf den Altar, das Halbieren, das Gegenüberlegen, das Nichtteilen der Vögel und das Herabkommen von Vögeln auf die Teile. Die einleitende Wendung benötigt jedoch im Deutschen einen expliziten Anschluss mit dem im Kontext vorausgesetzten Handelnden. Die Wendung „face to face“ wird besser ohne die schwer verständliche Umschreibung „eine jede ihrer anderen zugewandt“ wiedergegeben.'
