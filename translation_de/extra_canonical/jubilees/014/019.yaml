  yaml_path: translation/extra_canonical/jubilees/014/019.yaml
  text: On that day the LORD made a covenant with Abram, saying, “To your offspring I will give this land, from the river of Egypt to the great river, the river Euphrates.”
translation:
  language: de
  text: 'An jenem Tag schloss der HERR einen Bund mit Abram und sprach: »Deinen Nachkommen werde ich dieses Land geben, vom Strom Ägyptens bis zum großen Strom, dem Euphrat.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተካየደ፡ ኪዳነ
  choice: schloss … einen Bund
  rationale: Die äthiopische Wendung bezeichnet das Eingehen bzw. Schließen eines Bundes; die idiomatische deutsche Formulierung bewahrt den formalen Vertragscharakter.
- source_word: እግዚአብሔር
  choice: der HERR
  rationale: Die traditionelle Wiedergabe als Gottesname in Kapitälchen entspricht dem biblischen Register der Vorlage und der englischen Konsultationsschicht.
- source_word: ለዘርእከ
  choice: deinen Nachkommen
  rationale: Das Wort für »Same/Nachkommenschaft« kann kollektiv verstanden werden. »Nachkommen« ist im modernen Deutsch natürlich und legt weder eine einzelne Person noch eine Mehrzahl von Einzelpersonen unnötig fest.
- source_word: ፈለገ፡ ግብጽ
  choice: Strom Ägyptens
  rationale: ፈለግ bezeichnet einen Fluss bzw. Strom. Die formnahe Wiedergabe wahrt die geografische Bezeichnung, ohne sie mit einem bestimmten heute identifizierten Gewässer gleichzusetzen.
- source_word: ፈለገ፡ ዐቢይ፡ ፈለገ፡ ኤውፍራጢስ
  choice: zum großen Strom, dem Euphrat
  rationale: Die Wiederholung von »Strom« und die appositionelle Benennung des Euphrat werden in natürlichem, würdigem Deutsch erhalten.
theological_decisions:
- issue: Reichweite der Verheißung an Abrams »Samen«
  choice: deinen Nachkommen
  alternative: deinem Samen
  rationale: Die Übersetzung bewahrt den kollektiven Sinn, ohne eine spätere christologische oder ausschließlich ethnische Deutung in den Vers einzutragen.
- issue: Art des göttlichen Bundeshandelns
  choice: schloss der HERR einen Bund
  alternative: ging der HERR einen Bund ein
  rationale: »Einen Bund schließen« ist die geläufige biblische und moderne deutsche Ausdrucksweise und stellt die Verbindlichkeit des Handelns heraus, ohne zusätzliche dogmatische Aussagen einzuführen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur folgt der ge'ezischen Vorlage eng, bleibt aber idiomatisch. Die direkte Rede wird mit deutschen Anführungszeichen gesetzt; die Gottesbezeichnung »HERR« folgt der etablierten Bibelkonvention.
