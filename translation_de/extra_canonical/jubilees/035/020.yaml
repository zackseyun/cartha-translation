  yaml_path: translation/extra_canonical/jubilees/035/020.yaml
  text: And Jacob my brother—I love him more than all flesh, and I have no brother in all the earth except him alone. And this is no great thing for me, that I should love him, for he is my brother, and together we were sown in your womb, and together we came out from your belly. And if I do not love my brother, whom shall I love?
translation:
  language: de
  text: Und meinen Bruder Jakob liebe ich mehr als alles Fleisch.[a] Auf der ganzen Erde habe ich keinen Bruder außer ihm allein. Es ist für mich nichts Großes, ihn zu lieben, denn er ist mein Bruder. Gemeinsam wurden wir in deinem Mutterleib gesät, und gemeinsam kamen wir aus deinem Schoß hervor. Wenn ich meinen Bruder nicht liebe, wen soll ich lieben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „alles Fleisch“ sind hier alle anderen Menschen gemeint.
    reason: Erläutert die semitisch-biblische Wendung, ohne sie im Haupttext aufzulösen.
lexical_decisions:
- source_word: እምኵሉ፡ ዘሥጋ
  choice: mehr als alles Fleisch
  rationale: Die konkrete und im biblischen Sprachraum geläufige Wendung des Ge’ez wird bewahrt; sie meint hier alle anderen Menschen.
- source_word: ተዘራእነ
  choice: wurden wir … gesät
  rationale: Die auffällige Zeugungs- und Herkunftsmetapher des Ausgangstextes wird nicht geglättet.
- source_word: በማእከለ፡ ከርሥኪ
  choice: in deinem Mutterleib
  rationale: Gibt den mütterlichen Leib im Deutschen klar und natürlich wieder.
- source_word: ወፃእነ፡ እምኅንብርትኪ
  choice: kamen wir aus deinem Schoß hervor
  rationale: Bewahrt das Bild der gemeinsamen Geburt, ohne im Deutschen eine unnatürlich anatomische Formulierung zu verwenden.
