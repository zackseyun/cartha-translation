  revised_text: Und meinen Bruder Jakob liebe ich mehr als alles Fleisch.[a] Auf der ganzen Erde habe ich keinen Bruder außer ihm allein. Es ist für mich nichts Großes, ihn zu lieben, denn er ist mein Bruder. Gemeinsam wurden wir in deinem Mutterleib gesät, und gemeinsam kamen wir aus deinem Schoß hervor. Wenn ich meinen Bruder nicht liebe, wen soll ich lieben?
