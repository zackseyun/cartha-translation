  naturalness: Die Satzstellung „Und Jakob, meinen Bruder, liebe ich“ ist als stark markierte Voranstellung möglich, wirkt im modernen Standarddeutsch jedoch unnötig sperrig. „Meinen Bruder Jakob liebe ich“ ist ebenso nachdrücklich, aber idiomatischer. Das ergänzende „auch“ in „auch nichts Großes“ ist nicht erforderlich und schwächt die schlichte Aussage des Ausgangstextes leicht ab.
  terminology: Die Namen Jakob und die Verwandtschaftsbezeichnung Bruder sind korrekt. „Alles Fleisch“ bewahrt die Quellsprache angemessen; die Fußnote erklärt die Wendung knapp und ohne den Haupttext umzudeuten. „Mutterleib“ und „Schoß“ geben die zwei Herkunftsbilder des Textes verständlich wieder.
