base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/023.yaml
  text: And she called Jacob before Esau’s eyes and instructed him according to the words that she had spoken with Esau. And he said, “I will do your pleasure. Trust me that no evil may come out from me or from my children against Esau, and I will not be first in anything except in love.”
translation:
  language: de
  text: 'Dann rief sie Jakob vor Esaus Augen herbei und wies ihn entsprechend den Worten an, die sie mit Esau gesprochen hatte. Er sagte: »Ich werde tun, was du wünschst. Vertrau mir: Von mir oder meinen Kindern soll nichts Böses gegen Esau ausgehen, und in nichts will ich der Erste sein außer in der Liebe.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በቅድመ፡ አዕይንቲሁ፡ ለዔሳው
  choice: vor Esaus Augen
  rationale: Bewahrt die konkrete Ausdrucksweise des Ge’ez und bezeichnet zugleich klar Esaus unmittelbare Gegenwart als Zeuge.
- source_word: ሥምረተኪ
  choice: was du wünschst
  rationale: Gibt den Sinn von Wohlgefallen, Wunsch oder Willen in natürlichem modernem Deutsch wieder, ohne einen technischen theologischen Begriff einzutragen.
- source_word: ተሐበይኒ
  choice: Vertrau mir
  rationale: Der Kontext und die zugrunde liegende Lesart verlangen eine Aufforderung im Sinn von glauben bzw. vertrauen, nicht »verbirg mich«.
- source_word: ኢይወፅእ፡ እምኔየ፡ ወእምውሉድየ፡ እኩይ፡ ላዕለ፡ ዔሳው
  choice: Von mir oder meinen Kindern soll nichts Böses gegen Esau ausgehen
  rationale: Folgt dem Bild des ausgehenden Bösen und wahrt sowohl die erste Person als auch die ausdrückliche Einbeziehung der Nachkommen.
- source_word: ወኢይቀድም፡ ምንተኒ፡ ዘእንበለ፡ ተፋቅሮ
  choice: und in nichts will ich der Erste sein außer in der Liebe
  rationale: Bewahrt die auffällige Ich-Form und den Gegensatz zwischen Vorrang im Allgemeinen und Vorrang allein in der Liebe, statt ihn zu einer unpersönlichen Aussage umzudeuten.
theological_decisions:
- issue: Reichweite von Esaus Zusage
  choice: Die Zusage umfasst Esau selbst und die Kinder, die aus ihm hervorgehen.
  alternative: Nur Esau persönlich verspricht, Jakob nichts Böses anzutun.
  rationale: Der Ge’ez-Text nennt ausdrücklich »von mir und von meinen Kindern«; diese generationenübergreifende Spannung darf nicht abgeschwächt werden.
- issue: Vorrang in der Liebe
  choice: Die ungewöhnliche Aussage bleibt als persönliche Selbstverpflichtung stehen.
  alternative: »Nichts soll uns vorausgehen außer der Liebe.«
  rationale: Die erste Person und der Begriff des Ersten bzw. Vorrangigen sind im Quelltext erkennbar; eine Glättung würde die Aussage syntaktisch und inhaltlich verändern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde leicht geglättet, während die konkreten Bilder »vor Esaus Augen« und »ausgehen« sowie die bewusst ungewöhnliche Schlussaussage erhalten bleiben.
