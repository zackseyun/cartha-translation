base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/027.yaml
  text: 'And I command you, my sons: do righteousness and uprightness on the earth, so that Yahweh may bring upon you all that Yahweh said he would do for Abraham and for his seed.'
translation:
  language: de
  text: 'Und dies gebiete ich euch, meine Söhne: Übt Gerechtigkeit und Rechtschaffenheit auf der Erde, damit der HERR alles über euch bringt, was der HERR Abraham und seinen Nachkommen gesagt hat, dass er tun wird.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጽድቀ፡ ወርትዐ
  choice: Gerechtigkeit und Rechtschaffenheit
  rationale: Das Wortpaar bezeichnet gerechtes und geradliniges Handeln. Die beiden deutschen Begriffe bewahren die parallele ethische Aussage, ohne sie auf bloße Gesetzestreue zu verengen.
- source_word: በዲበ፡ ምድር
  choice: auf der Erde
  rationale: Gibt die räumliche Wendung direkt und in natürlichem Deutsch wieder.
- source_word: እግዚአብሔር
  choice: der HERR
  rationale: Der geʿezische Gottesname bzw. Gottestitel wird in bibelsprachlich vertrauter und würdevoller Form wiedergegeben; die Fußnote weist auf die mögliche Wiedergabe mit dem Eigennamen hin.
- source_word: ለዘርኡ
  choice: seinen Nachkommen
  rationale: Das kollektive Singularwort »Same/Nachkommenschaft« bezeichnet hier Abrahams Nachkommen; der deutsche Plural ist idiomatisch und bewahrt den kollektiven Sinn.
- source_word: ይገበር
  choice: zugesagt hat
  rationale: Im Kontext bezeichnet die Wendung das, was Gott Abraham und seinen Nachkommen zu tun verheißen hat. »zugesagt hat« klingt natürlich und erhält den Verheißungscharakter.
theological_decisions:
- issue: Bezeichnung Gottes
  choice: der HERR
  alternative: Jahwe
  rationale: Der geʿezische Text bietet እግዚአብሔር und nicht unmittelbar das hebräische Tetragramm. Daher wird der im Quelltext erkennbare Titel nicht stillschweigend in einen Eigennamen umgewandelt; die textgeschichtliche Möglichkeit wird in einer Fußnote offengehalten.
- issue: Verhältnis von menschlichem Handeln und göttlicher Verheißung
  choice: damit der HERR alles über euch kommen lässt
  alternative: sodass der HERR euch alles zuteilwerden lässt
  rationale: Die finale Konstruktion des Quelltexts bleibt erhalten. Damit wird die Spannung zwischen dem Gebot gerechten Handelns und der Erfüllung der Abraham gegebenen Zusage nicht abgeschwächt oder systematisch aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Imperativ »Übt« ist verständlicher und idiomatischer als das wörtliche »Tut Gerechtigkeit«, bewahrt aber den konkreten Handlungsauftrag. Die Anrede »meine Söhne« bleibt wegen des erzählerischen Familienkontexts erhalten.
