  source_fidelity: Die Grundbedeutung ist zutreffend. Allerdings gibt „zugesagt hat“ den geʿezischen Wortlaut zu stark als ausdrückliche Verheißung wieder. Der Text sagt, dass der Herr Abraham und seiner Nachkommenschaft gesagt hat, was er tun werde. Die Wiederholung des Gottes­titels im zweiten Teilsatz wird zudem besser beibehalten.
  naturalness: „Übt Gerechtigkeit und Rechtschaffenheit“ ist modernes, würdiges und idiomatisches Deutsch. „… gesagt hat, dass er … tun wird“ ist klarer als eine Konstruktion mit „zu tun gesagt hat“ und bewahrt die Zukunftsaussage.
  terminology: „Gerechtigkeit und Rechtschaffenheit“ gibt das ethische Wortpaar angemessen wieder. „Der HERR“ ist für geʿezisches Egziʾabḥer („Herr/Gott“) vertretbar; eine Fußnote, die den im Quelltext nicht ausdrücklich stehenden Namen „Jahwe“ als Alternative nahelegt, ist hier nicht erforderlich.
