  text: He will kill him after your death. And you know all that he has done from the day his brother Jacob went to Haran until this day, how with all his heart he has forsaken us and has done
translation:
  language: de
  text: Nach deinem Tod wird er ihn töten. Und du weißt alles, was er getan hat, von dem Tag an, als sein Bruder Jakob nach Haran zog, bis zum heutigen Tag – wie er uns von ganzem Herzen verlassen und getan hat …
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምድኅረ፡ ሞትከ
  choice: Nach deinem Tod
  rationale: Gibt die temporale Wendung unmittelbar und natürlich wieder.
- source_word: ይቅትሎ
  choice: wird er ihn töten
  rationale: Bewahrt Subjekt und Objekt als die im Kontext vorausgesetzten männlichen Referenten, ohne sie namentlich festzulegen.
- source_word: ታአምር፡ ኵሎ፡ መጠነ፡ ገብረ
  choice: du weißt alles, was er getan hat
  rationale: Die idiomatische deutsche Wiedergabe erfasst den Gesamtumfang seines Handelns; eine wörtliche Formulierung mit „Maß“ wäre missverständlich.
- source_word: ሖረ፡ … ውስተ፡ ካራን
  choice: nach Haran zog
  rationale: Natürliches, würdiges Deutsch für die Bewegung nach Haran.
- source_word: በኵሉ፡ ልቡ
  choice: von ganzem Herzen
  rationale: Entspricht der semitischen Ganzheitsformel und wahrt ihre emphatische Aussage.
- source_word: ኀደገነ
  choice: uns verlassen
  rationale: Gibt das Verlassen bzw. Aufgeben wieder, ohne die emotionale oder theologische Bedeutung stärker als nötig festzulegen.
theological_decisions:
- issue: Nicht ausdrücklich benannte Referenten in „er wird ihn töten“
  choice: Pronomen beibehalten
  alternative: Die Personen aus dem weiteren Kontext namentlich einsetzen
  rationale: Der vorgelegte Quelltext nennt sie nicht; ihre Ergänzung würde die genuine Kontextabhängigkeit beseitigen.
- issue: Stärke von ኀደገነ
  choice: „uns verlassen“
  alternative: „uns im Stich gelassen“ oder „uns verstoßen“
  rationale: „Verlassen“ hält die mögliche Bedeutungsbreite offen und vermeidet eine unnötige emotionale oder rechtliche Zuspitzung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählton. Der Vers endet im Quellenausschnitt syntaktisch unvollständig; die Auslassungspunkte machen diesen Abbruch sichtbar, ohne einen nicht überlieferten Abschluss zu ergänzen.
