  yaml_path: translation/extra_canonical/jubilees/035/007.yaml
  text: And behold, I have completed all the days of my life that I was to live.” And Jacob laughed because of the words of his mother, because his mother had told him that she would die, yet she remained opposite him, and her strength was upon her, and she had not grown weak in strength, for she went in and went out and saw,
translation:
  language: de
  text: »Und sieh, ich habe alle Tage meines Lebens vollendet, die mir zu leben bestimmt waren.« Jakob aber lachte wegen der Worte seiner Mutter; denn seine Mutter hatte ihm gesagt, sie werde sterben. Doch sie blieb ihm gegenüber, und ihre Kraft war noch in ihr; sie war nicht schwach geworden, denn sie ging ein und aus und sah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈጸምኩ፡ ኵሎ፡ መዋዕለ፡ ሕይወትየ
  choice: ich habe alle Tage meines Lebens vollendet
  rationale: Bewahrt die formale Wendung vom Vollenden der Lebenstage und klingt zugleich würdig und verständlich.
- source_word: ወበሐቀ፡ ያዕቆብ
  choice: Jakob aber lachte
  rationale: Das Verb bezeichnet Lachen; »aber« gibt den erzählerischen Übergang wieder, ohne den Anlass bereits wertend auszulegen.
- source_word: ትነብር፡ አንጻሪሁ
  choice: sie blieb ihm gegenüber
  rationale: Gibt sowohl das Fortbestehen beziehungsweise Verweilen als auch die räumliche Beziehung wieder; das bloße Sitzen wäre enger als der Quellenausdruck.
- source_word: ኀይላ፡ ላዕሌሃ
  choice: ihre Kraft war noch in ihr
  rationale: Die wörtliche räumliche Formulierung »Kraft auf ihr« wäre im Deutschen missverständlich; diese Fassung bewahrt den Sinn fortbestehender Lebenskraft.
- source_word: ትበውእ፡ ወትወፅእ
  choice: sie ging ein und aus
  rationale: Bewahrt die idiomatische Paarformel der Quelle.
- source_word: ወትሬኢ
  choice: und konnte sehen
  rationale: Das schlichte »und sah« ist möglich; im Kontext körperlich erhaltener Fähigkeiten bezeichnet die Formulierung plausibel fortbestehendes Sehvermögen.
theological_decisions:
- issue: Bedeutung von Rebekkas angekündigtem Tod
  choice: sie werde sterben
  alternative: sie müsse nun sterben
  rationale: Die Übersetzung bewahrt die einfache Todesankündigung und fügt weder Unmittelbarkeit noch eine besondere theologische Deutung hinzu.
- issue: Grund und Ton von Jakobs Lachen
  choice: lachte über die Worte seiner Mutter
  alternative: lachte wegen der Worte seiner Mutter
  rationale: »Über« ist im Deutschen natürlich, kann jedoch spöttisch klingen; der Kontext erklärt das Lachen durch den Gegensatz zwischen ihrer Ankündigung und ihrer sichtbaren Kraft, ohne Jakobs Haltung dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit maßvoll formaler Syntax. Die Wiederholung von »seine Mutter« folgt der Quelle. Der Vers endet wie die Vorlage syntaktisch offen mit einer Aufzählung.
