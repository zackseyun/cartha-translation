- source_word: ስእለት / እስእል
  choice: Bitte / ich bitte
  rationale: Das Wortfeld bezeichnet hier eine eindringliche Bitte, nicht ein Gelübde; die Wiederholung im Dialog bleibt im Deutschen erkennbar.
- source_word: ኢየአቢ፡ ስእለተኪ
  choice: deine Bitte nicht abschlagen
  rationale: Gibt Esaus Zusicherung idiomatisch und zugleich eng am Sinn der Verneinung von »zurückweisen/verweigern« wieder.
- source_word: ታብአኒ
  choice: mich forttragen
  rationale: Bezeichnet das Tragen beziehungsweise Wegbringen des Leichnams zur Bestattung.
- source_word: ቅሩበ፡ ሳራ
  choice: bei Sara
  rationale: Natürliches Deutsch für die räumliche Angabe »nahe bei Sara« im Bestattungskontext.
- source_word: ትትፋቀሩ
  choice: einander lieben
  rationale: Bewahrt die wechselseitige Bedeutung der Verbform und den ethischen Nachdruck der Bitte.
