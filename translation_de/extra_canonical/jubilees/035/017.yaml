translation:
  language: de
  text: 'Er sagte: »Ich werde alles tun, worum du mich bittest, und deine Bitte nicht abschlagen.« Da sagte sie zu ihm: »Ich bitte dich: Wenn ich sterbe, sollst du mich forttragen und bei Sara, der Mutter deines Vaters, begraben. Und du und Jakob, ihr sollt einander lieben.«'
  philosophy: optimal-equivalence
