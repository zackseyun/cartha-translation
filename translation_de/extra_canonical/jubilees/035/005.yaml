  text: 'which you commanded me: that I should honor my father and my brother. Tell me, then, what crookedness you have seen in me;'
translation:
  language: de
  text: 'was du mir geboten hast: dass ich meinen Vater und meinen Bruder[a] ehren soll. Sag mir also, welche Verkehrtheit du an mir gesehen hast.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „meine Mutter“.'
    reason: Der vorliegende geʿezische Text liest „meinen Bruder“; der Hinweis erhält die in der Prüfhistorie ausgewiesene abweichende Lesart, ohne die Hauptübersetzung zu ändern.
lexical_decisions:
- source_word: አክብር
  choice: ehren soll
  rationale: Das Verb bezeichnet hier das gebotene Ehren bzw. Achten und wird im Deutschen mit der vom übergeordneten Gebot abhängigen Modalität natürlich wiedergegeben.
- source_word: አበየ፡ ወእኅየየ
  choice: meinen Vater und meinen Bruder
  rationale: Der überlieferte geezische Text nennt ausdrücklich den Vater und den Bruder; እኅየየ bedeutet hier „mein Bruder“, nicht „meine Mutter“.
- source_word: ጥውየተ
  choice: das verkehrt ist
  rationale: Das Wort bezeichnet etwas Krummes oder Verkehrtes. Die prädikative Formulierung bewahrt das Bildfeld, klingt aber im modernen Deutschen natürlicher als das substantivische „Verkehrtheit“.
- source_word: በላዕሌየ
  choice: an mir
  rationale: Die wörtliche Vorstellung „auf/über mir“ bezeichnet in diesem Zusammenhang das, was an der Person wahrgenommen wird; „an mir“ ist die idiomatische deutsche Entsprechung.
theological_decisions:
- issue: Bezug auf Bruder oder Mutter
  choice: Bruder
  alternative: Mutter
  rationale: Die Lesart „Bruder“ folgt unmittelbar ወእኅየየ und bewahrt den erzählerischen Bezug auf Esau. „Mutter“ wäre eine Angleichung an die geläufige Formel „Vater und Mutter“, ist hier aber nicht durch den angegebenen geezischen Text gestützt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Satzanfang bleibt als abhängiger Anschluss an den vorausgehenden Kontext erhalten; der Doppelpunkt macht die Erläuterung des Gebotenen transparent. Die Schlussfrage gibt die semitische Wendung natürlich wieder, ohne den Vorwurf stärker festzulegen als der Ausgangstext.
