  yaml_path: translation/extra_canonical/jubilees/035/008.yaml
  text: and her teeth were strong, and no sickness at all had come upon her in all the days of her life. And Jacob said to her, “Blessed am I, mother, if my days draw near to the days of your life, and if my strength remains upon me like this, according to your strength. You will not die, for you speak with me in vain concerning your death.”
translation:
  language: de
  text: 'Ihre Zähne waren fest, und während ihres ganzen Lebens hatte sie keinerlei Krankheit befallen. Jakob sagte zu ihr: »Glücklich bin ich, Mutter, wenn meine Tage den Tagen deines Lebens nahekommen und meine Kraft mir so erhalten bleibt, entsprechend deiner Kraft. Du wirst nicht sterben,[a] denn du redest vergeblich mit mir über deinen Tod.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach einer anderen Deutung: »Stirb nicht.«'
    reason: Dokumentiert die überlieferte alternative Auffassung der Verbform, ohne sie in den Haupttext zu übernehmen.
lexical_decisions:
- source_word: አስናኒሃኒ፡ ጽኑዕ
  choice: Ihre Zähne waren noch fest
  rationale: Gibt die Aussage über Rebekkas unverminderte körperliche Verfassung natürlich wieder; »noch« ist im deutschen Kontext implizit, ohne die Festigkeit abzuschwächen.
- source_word: ኢምንተኒ፡ ሕማም፡ ኢበከፋ
  choice: keinerlei Krankheit hatte sie befallen
  rationale: Bewahrt die emphatische Verneinung und das Bild einer Krankheit, die über jemanden kommt.
- source_word: ብፁዕ፡ አነ
  choice: Ich kann mich glücklich schätzen
  rationale: Natürliches, dignifiziertes Deutsch für die Selbstaussage »glücklich/selig bin ich« in einem konditionalen Zusammenhang.
- source_word: ወይሄስ፡ ኀይለየ፡ ላዕሌየ
  choice: meine Kraft mir so erhalten bleibt
  rationale: Gibt das Verbleiben beziehungsweise Fortbestehen der Kraft idiomatisch wieder.
- source_word: ወአትመውቲ
  choice: Du wirst nicht sterben
  rationale: Die Form ist am besten als negativer Indikativ zu verstehen, nicht als Verbot.
- source_word: በጸው፡ ትትናገሪ
  choice: du redest vergeblich
  rationale: Bewahrt die Bedeutung »vergeblich/ohne Grund« und vermeidet das missverständliche »eitel«.
theological_decisions:
- issue: Modus der Aussage über Rebekkas Tod
  choice: Du wirst nicht sterben
  alternative: Stirb nicht
  rationale: Der überlieferte Verbmodus spricht für eine Feststellung beziehungsweise Versicherung. Die frühere prohibitive Deutung bleibt wegen der Übersetzungsgeschichte in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »Kraft« und »Tage« bleibt zur Wahrung der Quellstruktur erhalten; schwerfällige wörtliche Wendungen wurden behutsam idiomatisiert.
