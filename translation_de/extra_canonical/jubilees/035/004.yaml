lexical_decisions:
- source_word: ዘውስተ፡ ልብየ
  choice: was mir am Herzen liegt
  rationale: Die wörtliche Wendung „was in meinem Herzen ist“ wird als natürliche, würdevolle deutsche Entsprechung wiedergegeben; der anschließende dass-Satz erläutert ihren Inhalt.
- source_word: ኵሎ፡ መዋዕለ
  choice: alle meine Tage
  rationale: Bewahrt die zeitliche Gesamtaussage des Geʿez und den leicht feierlichen biblischen Ton.
- source_word: እሐሊ፡ ሠናየ፡ ለኵሉ
  choice: für alle auf Gutes bedacht bin
  rationale: Gibt das Denken, Sinnen oder Planen auf das Gute hin idiomatisch wieder, ohne den Ausdruck auf bloßes Wohlwollen oder konkrete Wohltaten zu verengen.
- source_word: ወአፎ፡ ኢይገብር፡ ዘንተ፡ ነገረ
  choice: Warum sollte ich dies nicht tun?
  rationale: Die rhetorische Frage wird in natürlichem Deutsch wiedergegeben; „dies“ nimmt den unmittelbar zuvor genannten Vorsatz auf.
theological_decisions:
- issue: Mögliche Fortsetzung über die Ehrung von Vater und Bruder
  choice: Nicht in den Haupttext aufgenommen
  alternative: „… dass ich meinen Vater und meinen Bruder ehren soll“
  rationale: Diese Aussage ist in der bereitgestellten Geʿez-Quellzeichenfolge nicht enthalten. Sie einzufügen würde den vorliegenden Ausgangstext erweitern.
translation_notes:
  register: Modernes Standarddeutsch mit würdevollem, leicht biblischem Ton. Der fragmentarische Anschluss am Versanfang („was …“) bleibt erhalten, da der Quelltext mit einem Relativausdruck beginnt.
