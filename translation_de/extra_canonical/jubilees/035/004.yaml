  language: de
  text: 'was mir am Herzen liegt: dass ich alle meine Tage für alle Gutes im Sinn habe. Warum sollte ich dies nicht tun?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eine frühere Fassung fuhr fort: „… dass ich meinen Vater und meinen Bruder ehren soll.“ Diese Wörter stehen nicht im hier zugrunde gelegten Geʿez-Text.'
