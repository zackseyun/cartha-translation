  source_fidelity: 'Die Übersetzung trifft die wesentlichen Aussagen: Bestattung bei Abraham, die Doppelhöhle auf Efrons Feld, Erwerb als Begräbnisstätte und das von Isaak selbst ausgehobene Grab. Gegenüber dem geʿezischen Wortlaut fehlt jedoch die Ortsangabe „im Land Kanaan“ (ውስተ፡ ገራህተ፡ ኬናን), die auch in der englischen POB-Fassung enthalten ist. Außerdem bezeichnet das Original Efron als Hethiter; „Hetiter“ ist im Deutschen nicht die übliche Form.'
  naturalness: Der Satzbau ist klar und würdig. „Doppelhöhle“ ist verständlich und passend. „bei meinem Vater Abraham“ ist möglich, aber „bei Abraham, meinem Vater“ bindet die Apposition eindeutiger an die Quelle. Die Wiederholung des Bestattungsbefehls ist stilistisch und quellentreu.
  terminology: „Hethiter“ ist die etablierte deutsche ethnische Bezeichnung. „Efron“ ist eine gebräuchliche deutsche Namensform. „Begräbnisstätte“ und „ausgehoben“ geben die Zweckbestimmung beziehungsweise das Graben des Grabes angemessen wieder.
  issues:
  - severity: medium
    issue: Die Ortsangabe „im Land Kanaan“ fehlt.
    rationale: Der geʿezische Text nennt ausdrücklich das Land Kanaan; die englische POB-Audit-Fassung bestätigt dies. Die Auslassung verringert die Quellentreue.
  - severity: low
    issue: „Hetiter“ statt „Hethiter“.
    rationale: „Hethiter“ ist im modernen Standarddeutsch die übliche und in Bibelübersetzungen etablierte Form für die ethnische Bezeichnung.
  revised_text: Begrabt mich bei Abraham, meinem Vater, in der Doppelhöhle auf dem Feld Efrons, des Hethiters, die Abraham dort im Land Kanaan als Begräbnisstätte erworben hat. Begrabt mich dort in dem Grab, das ich für mich selbst ausgehoben habe.
  revised_footnotes: []
  revision_rationale: Die Revision ergänzt die im Ausgangstext belegte Ortsangabe „im Land Kanaan“ und normalisiert die ethnische Bezeichnung zu „Hethiter“. Im Übrigen bleiben die knappe, würdige Syntax, die Wiederholung des Bestattungsbefehls und die konkrete Aussage vom selbst ausgehobenen Grab erhalten.
