base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/026.yaml
  text: Bury me near Abraham my father in the double cave in the field of Ephron the Hittite, which Abraham acquired as a burial place there in the land of Canaan. In the tomb which I dug for myself there, bury me.
translation:
  language: de
  text: Begrabt mich bei Abraham, meinem Vater, in der Doppelhöhle auf dem Feld Efrons, des Hethiters, die Abraham dort im Land Kanaan als Begräbnisstätte erworben hat. Begrabt mich dort in dem Grab, das ich für mich selbst ausgehoben habe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባዐት፡ ዘካዕበት
  choice: Doppelhöhle
  rationale: Gibt die äthiopische Bezeichnung für die »doppelte« beziehungsweise »zweite« Höhle knapp und traditionsneutral wieder.
- source_word: ኤፍሮን፡ ኬጥያዊ
  choice: des Hetiters Efron
  rationale: Natürliche deutsche Wiedergabe der Herkunftsbezeichnung bei gleichzeitiger Wahrung des Eigennamens.
- source_word: አጥረየ
  choice: erworben hat
  rationale: Bezeichnet den rechtmäßigen Erwerb und ist im Zusammenhang mit dem Begräbnisgrundstück präziser als ein allgemeines »gekauft«.
- source_word: ለዝኅረ፡ መቃብር
  choice: als Begräbnisstätte
  rationale: Gibt die Zweckbestimmung des erworbenen Ortes idiomatisch wieder.
- source_word: መቃብር፡ ዘከረይኩ፡ ለርእስየ
  choice: das Grab, das ich für mich selbst ausgehoben habe
  rationale: Bewahrt die konkrete Aussage des Textes, dass Isaak sein eigenes Grab vorbereitet beziehungsweise ausgegraben hat.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die Ortsangabe »im Land Kanaan« aus der englischen Konsultationsfassung wurde nicht aufgenommen, da sie im vorgelegten geezsprachigen Wortlaut dieses Satzes nicht belegt ist. Der wiederholte Bestattungsbefehl bleibt zur Wahrung der eindringlichen Struktur erhalten.
