base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/018.yaml
  text: and neither will seek evil against his brother, but only love, so that you may prosper, my sons, and be honored in the midst of the land, and no enemy may rejoice over you, and you may become a blessing and a mercy before the eyes of all who love you.”
translation:
  language: de
  text: Keiner von euch soll gegen seinen Bruder Böses im Sinn haben, sondern nur Liebe, damit ihr, meine Söhne, gedeiht und mitten im Land geehrt werdet, kein Feind sich über euch freue und ihr vor den Augen aller, die euch lieben, zu Segen und Erbarmen werdet.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይኅሥሥ፡ እኩየ
  choice: Böses wünschen
  rationale: Das Verb bezeichnet hier das Suchen oder Beabsichtigen; im Deutschen gibt »Böses wünschen« die feindselige Absicht gegenüber dem Bruder natürlich wieder.
- source_word: ተፋቅሮ
  choice: Liebe
  rationale: Das Substantiv bezeichnet Liebe beziehungsweise gegenseitige Zuneigung. Die knappe, elliptische Gegenüberstellung des Ausgangstextes bleibt erhalten.
- source_word: ወትሣረሑ
  choice: damit es euch … gut geht
  rationale: Eine natürliche deutsche Wiedergabe des Verbs im Sinn von Wohlergehen oder Gedeihen.
- source_word: ለበረከት፡ ወለምሕረት
  choice: zu Segen und Erbarmen
  rationale: Die beiden theologischen Leitbegriffe werden eng und ohne interpretierende Auflösung wiedergegeben.
theological_decisions:
- issue: Verhältnis von menschlicher Versöhnung und zugesagtem Wohlergehen
  choice: Die Finalsätze mit »damit« werden beibehalten.
  alternative: Die Folgen als sichere Verheißung mit »dann werdet ihr« formulieren.
  rationale: Der Ausgangstext stellt Liebe und Verzicht auf Böses als Ziel- beziehungsweise Bedingungszusammenhang mit Wohlergehen, Ehre und Segen dar, ohne diesen ausdrücklich zu einer unbedingten Verheißung zu machen.
- issue: »Segen und Erbarmen« als Bezeichnung der Söhne
  choice: Die ungewöhnliche Prädikatsfügung »zu Segen und Erbarmen werden« bleibt stehen.
  alternative: 'Interpretierend formulieren: »anderen Segen bringen und Erbarmen finden«.'
  rationale: Die Quelle lässt offen, ob die Angeredeten Träger, Mittel oder Empfänger von Segen und Erbarmen sind; diese Spannung soll nicht stillschweigend aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die brüderliche Mahnung bleibt knapp; die leicht ungewöhnliche Schlussformulierung bewahrt die Bild- und Begriffsdichte der ge’ezischen Vorlage.
