  yaml_path: translation/extra_canonical/jubilees/035/025.yaml
  text: And in the sixth year of this week Isaac called his two sons, Esau and Jacob, and they came to him. And he said to them, “My sons, I am going on the way of my fathers, to the eternal house where my fathers are.
translation:
  language: de
  text: 'Und im sechsten Jahr dieser Jahrwoche[a] rief Isaak seine beiden Söhne Esau und Jakob zu sich, und sie kamen zu ihm. Er sagte zu ihnen: »Meine Söhne, ich gehe den Weg meiner Väter, zum ewigen Haus, wo meine Väter sind.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jener Jahrwoche“.'
    reason: Das Demonstrativ in der chronologischen Formel wird vorzugsweise mit „dieser“ wiedergegeben; „jener“ ist als kontextbezogene Alternative möglich.
lexical_decisions:
- source_word: ሱባዔ (subāʿe)
  choice: Jahrwoche
  rationale: Gemeint ist im chronologischen System des Jubiläenbuches ein Zeitraum von sieben Jahren; „Jahrwoche“ macht dies für heutige Leser deutlicher als das bloße „Woche“.
- source_word: ፍኖተ፡ አበውየ
  choice: den Weg meiner Väter
  rationale: Bewahrt die bildhafte und feierliche Redeweise des Ausgangstextes, ohne sie als bloßes „Sterben“ aufzulösen.
- source_word: ቤት፡ ዘለዓለም
  choice: zum ewigen Haus
  rationale: Gibt die Metapher formal nah wieder und lässt ihre eschatologische Bedeutung bewusst unausgelegt.
- source_word: ክልኤሆሙ፡ ውሉዶ
  choice: seine beiden Söhne
  rationale: Entspricht der ausdrücklichen Zweizahl und klingt im modernen Deutschen natürlich.
theological_decisions:
- issue: Deutung des „ewigen Hauses“
  choice: Die Metapher „ewiges Haus“ bleibt stehen.
  alternative: „die ewige Ruhestätte“ oder „das Totenreich“
  rationale: Der Ausgangstext benennt ein „ewiges Haus“, in dem die Väter sind, legt dessen genaue Beschaffenheit jedoch nicht fest. Eine explizitere Wiedergabe würde die theologische Offenheit unnötig einschränken.
translation_notes:
  register: Moderne, würdige Erzählsprache. Die direkte Rede bleibt schlicht und feierlich; die beiden Todesmetaphern des Ausgangstextes werden nicht paraphrasiert.
