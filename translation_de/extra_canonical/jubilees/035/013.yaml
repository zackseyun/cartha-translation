  text: And Isaac said to her, “I also know and see Jacob’s conduct toward us, that with all his heart he honors us. I loved Esau before Jacob from the time he was born first, but now I love Jacob more than Esau, because he has made his deeds very evil, and there is no righteousness in him, for all his ways are injustice and violence, and there is no righteousness around him.”
translation:
  language: de
  text: 'Und Isaak sagte zu ihr: »Auch ich kenne und sehe Jakobs Verhalten uns gegenüber: Er ehrt uns von ganzem Herzen. Von dem Zeitpunkt an, als Esau als Erster geboren wurde, liebte ich Esau mehr als Jakob. Jetzt aber liebe ich Jakob mehr als Esau, denn Esau hat seine Taten überaus böse gemacht, und in ihm ist keine Gerechtigkeit. Alle seine Wege sind Unrecht und Gewalt, und rings um ihn ist keinerlei Gerechtigkeit.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: »und bei ihm findet sich überhaupt keine Gerechtigkeit«.'
    reason: Das abschließende አውዶ bedeutet wörtlich »ringsum«, kann hier aber umfassend im Sinn von »überhaupt« gebraucht sein.
lexical_decisions:
- source_word: ግብረ፡ ያዕቆብ፡ ዘምስሌነ
  choice: Jakobs Verhalten uns gegenüber
  rationale: ግብር bezeichnet hier das Tun bzw. Verhalten; ዘምስሌነ bestimmt dessen Beziehung zu den Eltern.
- source_word: ከመ፡ በኵሉ፡ ልቡ፡ ውእቱ፡ ያከብረነ
  choice: Er ehrt uns von ganzem Herzen
  rationale: Gibt die emphatische Wendung »mit seinem ganzen Herzen« natürlich und quellennah wieder.
- source_word: እምዘተወልደ፡ ቀደሙ
  choice: weil er zuerst geboren wurde
  rationale: Die Formulierung bezieht das Vorher bzw. Zuerstsein auf Esaus Geburt und begründet Isaaks frühere Bevorzugung.
- source_word: አብዝኀ፡ አእክዮ፡ ምግባሪሁ
  choice: hat seine Taten überaus böse gemacht
  rationale: አብዝኀ wirkt hier als Verstärkung der aktiven Aussage und nicht zwingend als Vergleichsform.
- source_word: ዐመፃ፡ ወግፍዕ
  choice: Unrecht und Gewalt
  rationale: Wahrt die ethisch-soziale Doppelbezeichnung der Quelle in geläufigem Deutsch.
- source_word: አውዶ
  choice: rings um ihn
  rationale: Erhält die ausdrücklich räumliche bzw. umfassende Schlussnuance, statt sie mit der vorangehenden Aussage »in ihm« gleichzusetzen.
theological_decisions:
- issue: Grund für Isaaks veränderte Liebe zu Esau und Jakob
  choice: Esaus böse Taten werden als Grund genannt
  alternative: Die Aussage abschwächen oder als bloßen Vergleich zwischen den Brüdern formulieren
  rationale: Die Quelle verbindet Isaaks veränderte Zuneigung ausdrücklich mit Esaus Handeln; die Übersetzung wahrt diese Spannung ohne theologische Harmonisierung.
- issue: Wiederholung der fehlenden Gerechtigkeit
  choice: 'Beide Aussagen bleiben erhalten: »in ihm« und »rings um ihn«'
  alternative: Beide identisch mit »in ihm« übersetzen
  rationale: Die Wiederholung ist Bestandteil des Textes, während አውዶ in der zweiten Aussage eine zusätzliche umfassende Nuance einführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer direkter Rede. Die Wiederholung von »Gerechtigkeit« sowie der Wechsel von »in ihm« zu »rings um ihn« wurden bewusst bewahrt; der Name »Esau« wurde im Begründungssatz zur eindeutigen Referenz eingesetzt.
