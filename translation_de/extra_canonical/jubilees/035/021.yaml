base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/021.yaml
  text: And I myself ask you that you admonish Jacob concerning me and concerning my children, for I know that he will surely reign over me and over my children, because on the day my father blessed him he made him high and me low.
translation:
  language: de
  text: Und ich selbst bitte dich, Jakob in Bezug auf mich und meine Kinder zu ermahnen,[a] denn ich weiß, dass er gewiss über mich und meine Kinder herrschen wird. Denn an dem Tag, als mein Vater ihn segnete, setzte er ihn über mich und erniedrigte mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jakob für mich und für meine Kinder zu ermahnen“.'
    reason: Die geezische Präposition kann sowohl „in Bezug auf/betreffs“ als auch „für/zugunsten von“ bedeuten.
lexical_decisions:
- source_word: አስተብቍዐኪ
  choice: ich bitte dich
  rationale: Das Verb bezeichnet ein eindringliches Bitten oder Ersuchen; die natürliche deutsche Wiedergabe bewahrt den persönlichen Nachdruck des Sprechers.
- source_word: ትገሥጽዮ
  choice: zu ermahnen
  rationale: Das Verb kann zurechtweisen, tadeln oder ermahnen bedeuten. Hier bittet Esau Rebekka, Jakob hinsichtlich seines künftigen Verhaltens anzusprechen; „ermahnen“ trifft diesen Zusammenhang ohne unnötige Verschärfung.
- source_word: በእንቲአየ፡ ወበእንተ፡ ውሉድየ
  choice: wegen mir und wegen meiner Kinder
  rationale: Die Präposition kann „wegen/in Bezug auf“ oder „für/zugunsten von“ ausdrücken. Im Kontext geht es darum, Jakob hinsichtlich Esaus und seiner Kinder zu ermahnen; die alternative Lesart wird in einer Fußnote bewahrt.
- source_word: ነጊሠ፡ ይነግሥ
  choice: gewiss … herrschen wird
  rationale: Die Verbindung aus Infinitiv und finitem Verb verstärkt die Aussage. „gewiss“ gibt diese emphatische Konstruktion idiomatisch wieder.
- source_word: ረሰየ፡ ልዑለ፡ ወኪያየ፡ ትሑተ
  choice: setzte er ihn über mich und erniedrigte mich
  rationale: Die räumlich-soziale Gegenüberstellung „hoch/oben“ und „niedrig/unten“ bezeichnet hier den durch den Segen verliehenen Vorrang Jakobs gegenüber Esau.
theological_decisions:
- issue: Art und Gewissheit von Jakobs künftiger Herrschaft
  choice: „dass er gewiss über mich und meine Kinder herrschen wird“
  alternative: „dass er als König über mich und meine Kinder herrschen wird“
  rationale: Die cognate Konstruktion mit dem Verb für herrschen/König sein ist emphatisch, legt aber nicht zwingend ein bestimmtes politisches Königtum fest. Die Übersetzung erhält die Gewissheit und das Herrschaftsmotiv, ohne es enger zu bestimmen.
- issue: Begründung von Jakobs Vorrang durch Isaaks Segen
  choice: „setzte er ihn über mich und erniedrigte mich“
  alternative: „machte er ihn hoch und mich niedrig“
  rationale: Die idiomatische Fassung wahrt die Rangumkehr, die Esau dem väterlichen Segen zuschreibt, ohne zusätzliche Aussagen über Erwählung oder Verwerfung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der geezischen Argumentationsfolge, wird jedoch für heutige Leser geglättet. Die emphatische Wiederholung des Herrschaftsverbs wird durch „gewiss“ wiedergegeben.
