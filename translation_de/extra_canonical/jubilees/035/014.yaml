  yaml_path: translation/extra_canonical/jubilees/035/014.yaml
  text: And now my heart is troubled because of all his deeds, and neither he nor his seed will be saved, for they are those who will be destroyed from the earth and those who will be uprooted from under heaven, because he has forsaken the God of Abraham and gone after his wives and after
translation:
  language: de
  text: Und nun ist mein Herz wegen all seiner Taten beunruhigt, und weder er noch seine Nachkommen werden gerettet werden; denn sie sind es, die von der Erde vertilgt und unter dem Himmel entwurzelt werden, denn er hat den Gott Abrahams verlassen und ist seinen Frauen nachgegangen und hinter
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትሀወክ
  choice: ist … beunruhigt
  rationale: Gibt die innere Erschütterung des Herzens natürlich und ohne unnötige Verstärkung wieder.
- source_word: ምግባራቲሁ
  choice: all seiner Taten
  rationale: Das Wort bezeichnet Handlungen oder Werke; „Taten“ ist im Kontext idiomatisch und wertungsneutral.
- source_word: ዘርኡ
  choice: seine Nachkommen
  rationale: Das ge'ezische Wort bedeutet wörtlich „Same“, bezeichnet hier aber kollektiv die Nachkommenschaft.
- source_word: ይትሐጐሉ
  choice: vertilgt werden
  rationale: Bewahrt den Sinn des Zugrundegehens bzw. der Vernichtung und ordnet das Verb gemäß dem Ge'ez-Text der Wendung „von der Erde“ zu.
- source_word: ይሤረዉ
  choice: entwurzelt werden
  rationale: Gibt das Bild des Herausreißens mit der Wurzel wieder und ordnet es gemäß dem Ge'ez-Text „unter dem Himmel“ zu.
- source_word: ኀደገ
  choice: hat … verlassen
  rationale: Direkte und kontextgerechte Wiedergabe des Abwendens vom Gott Abrahams.
- source_word: ሖረ፡ ድኅረ
  choice: ist … nachgegangen / und hinter
  rationale: Die Wendung bedeutet wörtlich „ging hinter … her“. Die zweite, am Quellenende unvollständige Wiederholung wird im Deutschen sichtbar abgebrochen.
theological_decisions:
- issue: Aussage über die Rettung Esaus und seiner Nachkommen
  choice: „Weder er noch seine Nachkommen werden gerettet werden“
  alternative: „Er und seine Nachkommen können nicht gerettet werden“
  rationale: Die gewählte Fassung bewahrt die im Text ausgesagte zukünftige Verneinung, ohne eine zusätzliche Lehre über grundsätzliche Unmöglichkeit einzutragen.
- issue: Bezeichnung Gottes
  choice: „den Gott Abrahams“
  alternative: „Abrahams Gott“
  rationale: Die formale Wendung wahrt den Bezug auf den Gott, dem Abraham verbunden ist, ohne weitere Identitäts- oder Bundesaussagen auszuformulieren.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Der überlieferte Quellenausschnitt endet mitten in der Wendung „und hinter“; dieser syntaktische Abbruch wird bewusst bewahrt und nicht ergänzt. Die beiden Vernichtungsbilder folgen der ge''ezischen Reihenfolge: von der Erde vertilgt, unter dem Himmel entwurzelt.'
