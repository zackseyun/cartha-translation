base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/003.yaml
  text: And you, my son, know from the day you were born until this day, all my deeds and all that is in my heart, that I love your father exceedingly.
translation:
  language: de
  text: 'Und du, mein Sohn, kennst vom Tag deiner Geburt an bis zum heutigen Tag all meine Taten und alles, was in meinem Herzen ist: dass ich deinen Vater überaus liebe.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምግባርየ
  choice: meine Taten
  rationale: Das geʿezische məgbār kann Taten, Handlungen oder Lebensführung bezeichnen. „Taten“ bildet hier den Gegensatz zwischen äußerlich erkennbarem Handeln und dem Inneren des Herzens natürlich ab.
- source_word: ጥቀ
  choice: überaus
  rationale: Das Adverb ṭəqqa verstärkt die Aussage im Sinn von „sehr“ oder „außerordentlich“; „überaus“ wahrt die Intensität in würdigem, verständlichem Deutsch.
- source_word: ታአምር
  choice: weißt … um
  rationale: Das Verb bedeutet „wissen/kennen“. Die Konstruktion „du weißt um“ lässt sich im Deutschen sowohl auf die Taten als auch auf das im Herzen Befindliche beziehen und klingt natürlicher als eine starre Wiederholung.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede „mein Sohn“ und der zeitliche Bogen vom Tag der Geburt bis heute bleiben eng am Geʿez; der abschließende dass-Satz gibt den Herzensinhalt wieder, ohne die Aussage weiter auszulegen.
