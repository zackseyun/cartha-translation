base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/011.yaml
  text: He has dealt wickedly with us; he has gathered your flocks, and he has plundered all your possessions from before your face. And while we ask and request from him what is ours, he acts like a man who has mercy on us.
translation:
  language: de
  text: Er hat böse an uns gehandelt; er hat deine Herden zusammengetrieben und deinen ganzen Besitz vor deinen Augen geraubt. Und während wir ihn um das Unsere bitten und es von ihm zurückfordern, verhält er sich wie ein Mann, der sich unser erbarmt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ምስሌነ፡ እኩየ
  choice: Er hat böse an uns gehandelt
  rationale: Gibt die adverbiale Aussage über sein Handeln gegen beziehungsweise an »uns« wieder, ohne sie lediglich als Wesensurteil »er ist böse« zu formulieren.
- source_word: መሪዕቶከ፡ አስተጋብአ
  choice: er hat deine Herden zusammengetrieben
  rationale: Das Kausativverb bezeichnet das Zusammenbringen beziehungsweise Zusammentreiben der Herden.
- source_word: ወኵሎ፡ ጥሪትከ፡ ሄደ
  choice: und deinen ganzen Besitz ... geraubt
  rationale: Das klassische ge’ezische ሄደ bedeutet hier »rauben/plündern«; ኵሎ markiert »deinen ganzen Besitz« als direktes Objekt, nicht als Subjekt von »fortgehen«.
- source_word: እምቅድመ፡ ገጽከ
  choice: vor deinen Augen
  rationale: Die wörtliche Wendung »vor deinem Angesicht« wird idiomatisch und anschaulich wiedergegeben.
- source_word: ናስተበቍዕ፡ ወንስእሎ
  choice: bitten und ... zurückfordern
  rationale: Bewahrt die Doppelung zweier Verben des Bittens beziehungsweise Verlangens; »zurückfordern« verdeutlicht im Kontext, dass es um das ihnen Gehörende geht.
- source_word: ይሬሲ፡ ከመ፡ ዘብእሲ፡ ዘይምሕረነ
  choice: tut er so, als wäre er ein Mann, der Erbarmen mit uns hat
  rationale: Gibt den Vergleich als vorgetäuschte Haltung wieder und erhält den ironischen Gegensatz zwischen Raub und angeblichem Erbarmen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die anklagende und ironische Spannung des Verses bleibt erhalten. »Vor deinen Augen« ist natürlicher als »vor deinem Angesicht«, während »Erbarmen« den gehobenen biblischen Ton wahrt.
