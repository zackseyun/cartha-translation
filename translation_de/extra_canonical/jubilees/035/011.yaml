  source_fidelity: 'Die Wiedergabe trifft die Abfolge und den Sinn des geʿezischen Textes: böses Handeln gegen die Sprecher, Zusammentreiben der Herden, Raub des gesamten Besitzes und die Bitte um das Eigene. Insbesondere ist »geraubt« für ሄደ sachgerecht; eine Deutung als »fortgegangen« wäre hier unzutreffend. Die Schlusswendung ist jedoch ein Vergleich (»wie ein Mann, der sich unser erbarmt«), nicht ausdrücklich eine Behauptung vorsätzlicher Täuschung.'
  naturalness: Der Text ist insgesamt modernes, gut lesbares Standarddeutsch. »Verhält er sich wie« gibt die Vergleichsform am Schluss idiomatisch wieder, ohne den Sinn durch die stärkere Formulierung »tut so, als wäre« einzuengen.
  terminology: »Herden«, »Besitz«, »das Unsere« und »Erbarmen« sind treffend und im leicht gehobenen erzählerischen Register natürlich. »Sich unser erbarmt« entspricht der biblisch geprägten, aber weiterhin verständlichen Ausdrucksweise und dem Sinn von »Erbarmen mit uns haben«.
