  yaml_path: translation/extra_canonical/jubilees/035/028.yaml
  text: And love one another, my sons, among yourselves, each loving his brother as a man loves his own life, and let a man seek—”
translation:
  language: de
  text: 'Liebt einander, meine Söhne: Jeder liebe seinen Bruder, wie ein Mensch sein eigenes Leben liebt, und ein Mensch soll suchen –'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ታፈቅሩ፡ አኅዊክሙ
  choice: liebt … seinen Bruder
  rationale: Das Verb bezeichnet Liebe; das brüderliche Verhältnis wird ausdrücklich genannt.
- source_word: ከመ፡ ብእሲ፡ ዘያፈቅር፡ ነፍሶ
  choice: wie ein Mensch sein eigenes Leben liebt
  rationale: ነፍስ kann »Seele«, »Leben« oder »Selbst« bedeuten. Hier ergibt der Vergleich mit der Selbstliebe natürlich »sein eigenes Leben«.
- source_word: ወእንዘ፡ የኀሥሥ፡ ብእሲ
  choice: und jeder soll danach streben
  rationale: ብእሲ ist Subjekt (»ein Mensch«), nicht Objekt. Da der Satz in den nächsten Vers hineinreicht, bleibt das Ziel des Strebens hier offen.
theological_decisions:
- issue: Reichweite des Liebesgebots
  choice: Bruderliebe im unmittelbaren Anredekontext
  alternative: allgemeines Gebot der Nächstenliebe
  rationale: Der Text spricht Isaaks Söhne an und nennt ausdrücklich den Bruder; die Übersetzung erweitert diesen Bezug nicht stillschweigend.
