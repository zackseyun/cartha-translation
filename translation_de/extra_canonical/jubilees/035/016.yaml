base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/016.yaml
  text: And you, do not fear for Jacob, for Jacob’s guardian is great and mighty and honored, and more praised than Esau’s guardian.” And Rebekah sent and called Esau, and he came to her. And she said to him, “My son, I ask one request from you; say that you will do it, my son.”
translation:
  language: de
  text: 'Und du, fürchte dich nicht um Jakob; denn Jakobs Beschützer ist groß und mächtig und geehrt und wird mehr gepriesen als Esaus Beschützer.[a] Da schickte Rebekka nach Esau und rief ihn, und er kam zu ihr. Sie sagte zu ihm: »Mein Sohn, ich habe eine Bitte an dich. Sag mir zu, dass du sie erfüllen wirst, mein Sohn.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eine frühere Wiedergabe lautete: „geehrt und mächtiger als Esaus Beschützer. Und Rebekka pries Isaak und rief Esau.“ Der vorliegende Wortlaut folgt der besseren Analyse des ge’ezischen Textes, der das Lob auf Jakobs Beschützer bezieht und anschließend sagt, dass Rebekka nach Esau schickte.'
    reason: Der Anker wird an die zentrale vergleichende Aussage gesetzt; die Fußnote dokumentiert weiterhin transparent die frühere Wiedergabe und die quellengestützte Korrektur der anschließenden Satzverbindung.
lexical_decisions:
- source_word: ዐቃቢሁ (ʿaqabihu)
  choice: Beschützer
  rationale: Bezeichnet den Wächter oder Hüter Jakobs beziehungsweise Esaus; „Beschützer“ ist natürliches modernes Deutsch und legt die genaue Identität dieser Gestalt nicht fest.
- source_word: ዐቢይ፡ ወኃያል፡ ወክቡር (ʿabiy wa-ḥayal wa-kəbur)
  choice: groß und mächtig und geehrt
  rationale: Gibt die drei aufeinanderfolgenden Prädikate einzeln wieder und bewahrt den feierlichen Parallelismus.
- source_word: ወአኩት፡ እምዐቃቢሁ፡ ለዔሳው (wa-ʾakut ʾəm-ʿaqabihu la-ʿEsaw)
  choice: und wird mehr gepriesen als Esaus Beschützer
  rationale: Bewahrt den komparativen Sinn und den Bezug des Lobes auf Jakobs Beschützer; vermeidet die unbelegte Umdeutung zu „mächtiger“.
- source_word: ወለአኮት፡ ርብቃ፡ ወጸውዐተ፡ ለዔሳው
  choice: Da schickte Rebekka nach Esau und ließ ihn rufen
  rationale: Gibt sowohl das Senden als auch das Rufen wieder und vermeidet die frühere Fehlanalyse als „Rebekka pries Isaak“.
- source_word: ስእለት፡ ብየ፡ ወልድየ
  choice: Mein Sohn, ich habe eine Bitte an dich
  rationale: Idiomatiche deutsche Wiedergabe der Bitteformel ohne den Sinn zu erweitern.
- source_word: ወበል፡ ከመ፡ ትገብራ
  choice: Sag mir zu, dass du sie erfüllen wirst
  rationale: Vermittelt die Aufforderung, die Erfüllung ausdrücklich zuzusagen, in natürlichem Deutsch.
theological_decisions:
- issue: Identität von Jakobs und Esaus „Beschützer“
  choice: Die Gestalten werden nur als „Beschützer“ bezeichnet.
  alternative: Schutzengel oder Gott
  rationale: Der Vers benennt ihre Identität nicht ausdrücklich; eine präzisere Bezeichnung würde eine theologische Deutung in den Text eintragen.
- issue: Vergleich zwischen den Beschützern
  choice: „mehr gepriesen“
  alternative: „mächtiger“
  rationale: Der überlieferte Wortlaut unterscheidet bereits „mächtig“ von dem anschließenden Ausdruck des Lobes; diese Spannung wird bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt feierlich, aber verständlich; „Sag mir zu“ vermeidet die im Deutschen unnatürliche wörtliche Formulierung „sage, dass du es tun wirst“.
