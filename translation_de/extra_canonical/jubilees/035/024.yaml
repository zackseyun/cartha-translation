  yaml_path: translation/extra_canonical/jubilees/035/024.yaml
  text: And they ate and drank, she and her sons, that night; and she died in that night, in the third year of the seventh week of the forty-first jubilee. And her two sons, Esau and Jacob, buried her in the double cave near Sarah, the mother of their father.
translation:
  language: de
  text: In jener Nacht aßen und tranken Rebekka und ihre Söhne. Und in jener Nacht starb sie, im dritten Jahr der siebten Jahrwoche des einundvierzigsten Jubiläums. Ihre beiden Söhne Esau und Jakob begruben sie in der Doppelhöhle bei Sara, der Mutter ihres Vaters.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይእቲ፡ ወውሉዳ
  choice: Rebekka und ihre Söhne
  rationale: Das wörtliche „sie und ihre Söhne“ wird zur eindeutigen und natürlichen deutschen Bezugnahme mit dem Namen der im Kontext genannten Rebekka wiedergegeben.
- source_word: ሠለስተ፡ አዮቤልዉ፡ ወሱባዔ፡ አሐዱ፡ ወዓመት፡ አሐዱ
  choice: im Alter von drei Jubiläen, einer Jahrwoche und einem Jahr
  rationale: Die ge’ezische Altersangabe wird quellentreu bewahrt; sie ergibt 155 Jahre und weicht von der chronologischen Datierung der englischen Konsultationsfassung ab.
- source_word: ባዐት፡ እንተ፡ ክልኤ
  choice: Doppelhöhle
  rationale: Die knappe Zusammensetzung gibt die Höhle als „doppelt/zweifach“ wieder, ohne den im vorliegenden Quellwortlaut nicht genannten Eigennamen Machpela einzuführen.
- source_word: ቅሩበ፡ ሳራ፡ እመ፡ አቡሆሙ
  choice: bei Sara, der Mutter ihres Vaters
  rationale: Die genealogische Apposition des ge’ezischen Textes wird formal und verständlich erhalten.
