  yaml_path: translation/extra_canonical/jubilees/035/001.yaml
  text: And in the first year of the first week, in the forty-fifth jubilee, Rebekah called Jacob her son and instructed him concerning his father and concerning his brother, that he should honor them all the days of his life.
translation:
  language: de
  text: Und im ersten Jahr der ersten Jahrwoche, im fünfundvierzigsten Jubiläum, rief Rebekka ihren Sohn Jakob zu sich und wies ihn an, seinen Vater und seinen Bruder alle Tage seines Lebens zu ehren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዓመት፡ ዘሱባዔ
  choice: Jahr der … Jahrwoche
  rationale: Die Zeitangabe bezeichnet ein Jahr innerhalb einer Siebenerperiode; „Jahrwoche“ gibt diese antike chronologische Einheit verständlich und knapp wieder.
- source_word: ጸውዐቶ
  choice: rief … zu sich
  rationale: Das Verb bedeutet „rufen“; im Deutschen drückt „zu sich rufen“ in diesem Zusammenhang den natürlichen Sinn aus.
- source_word: ወአዘዘቶ
  choice: wies ihn … an
  rationale: Das Verb bezeichnet ein verbindliches Anweisen oder Gebieten. „Wies ihn an“ bewahrt den Nachdruck ohne unnötig steif zu klingen.
- source_word: ከመ፡ ያክብሮሙ
  choice: sie … zu ehren
  rationale: Das pluralische Objektsuffix bezieht sich gemeinsam auf Vater und Bruder; „ehren“ entspricht dem Bedeutungsgehalt direkt.
- source_word: ኵሎ
  choice: sein Leben lang
  rationale: Der überlieferte Text wirkt an dieser Stelle verkürzt; im Satzzusammenhang bezeichnet die Wendung die gesamte Lebenszeit. Die idiomatische deutsche Fassung folgt dem durch die Textüberlieferung und die konsultierte englische Schicht bezeugten Sinn.
