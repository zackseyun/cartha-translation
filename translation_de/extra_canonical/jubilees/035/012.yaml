base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/012.yaml
  text: And he is bitter against you because you blessed Jacob, your perfect and upright son; for there is no evil at all in him, but only goodness. And from the time he came from Haran until this day he has not deprived us of anything, for everything comes to us in its time every day, and he rejoices with all his heart whenever we receive from his hand, and he blesses us. He has not separated himself from us from the time he came from Haran until this day, and he dwells with us continually in the house while honoring us.”
translation:
  language: de
  text: Und er ist dir gegenüber erbittert, weil du Jakob, deinen vollkommenen und aufrechten Sohn, gesegnet hast. Denn an ihm ist überhaupt nichts Böses, sondern nur Gutes. Seit er aus Haran gekommen ist, hat er uns bis auf diesen Tag nichts vorenthalten; denn jeden Tag kommt alles zur rechten Zeit zu uns. Und sooft wir etwas aus seiner Hand empfangen, freut er sich von ganzem Herzen und segnet uns. Seit er aus Haran gekommen ist, hat er sich bis auf diesen Tag nicht von uns getrennt und wohnt beständig bei uns im Haus und erweist uns Ehre.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመርር፡ ላዕሌከ
  choice: er ist dir gegenüber erbittert
  rationale: Bewahrt die Bildlichkeit und den gegen eine Person gerichteten Sinn von ‚bitter sein‘, klingt aber im modernen Deutschen natürlich.
- source_word: ፍጹማዊ፡ ወፈትዐ
  choice: untadeligen und rechtschaffenen
  rationale: Gibt die beiden positiven Charakterbezeichnungen wieder, ohne ‚vollkommen‘ in einem möglicherweise theologisierenden absoluten Sinn zu überzeichnen.
- source_word: አልቦ፡ እኩየ፡ ዘአንበበ፡ ኂሩትነ
  choice: an ihm ist überhaupt nichts Böses, sondern nur Gutes
  rationale: Folgt der revidierten Lesart und dem erkennbaren Gegensatz von Bösem und Gutem; vermeidet die sachlich problematische Wiedergabe ‚unsere Güte‘.
- source_word: ኢያሕፀፀ፡ ብነ፡ ወእምንትኒ
  choice: hat er uns ... nichts vorenthalten
  rationale: Drückt die Verneinung eines Mangels beziehungsweise Entzugs idiomatisch aus.
- source_word: በበጊዜሁ፡ ኵሉ፡ ዕለት
  choice: jeden Tag ... zur rechten Zeit
  rationale: Bewahrt sowohl den täglichen Rhythmus als auch den Gedanken, dass alles zu seiner Zeit eintrifft.
- source_word: ንነሥእ፡ እምእዴሁ
  choice: wir etwas aus seiner Hand empfangen
  rationale: ‚Empfangen‘ ist im Deutschen natürlicher als ‚nehmen‘ und wahrt das Bild der gebenden Hand.
- source_word: ዘልፈ
  choice: beständig
  rationale: Gibt die zeitliche Kontinuität knapp und würdig wieder.
- source_word: ያከብረነ
  choice: erweist uns Ehre
  rationale: Entspricht dem kausativen Sinn ‚ehren/Ansehen erweisen‘ und klingt natürlicher als eine Verlaufsform.
theological_decisions:
- issue: Bedeutung der Charakterisierung Jakobs als ፍጹማዊ
  choice: untadelig
  alternative: vollkommen
  rationale: ‚Untadelig‘ erhält die Aussage über Jakobs Integrität, ohne eine metaphysische oder sündlose Vollkommenheit festzuschreiben, die der Vers nicht zwingend behauptet.
- issue: Absolute Aussage, dass an Jakob nichts Böses sei
  choice: Die starke Formulierung bleibt ungeschwächt stehen.
  alternative: Eine relativierende Wiedergabe wie ‚er tut uns nichts Böses‘
  rationale: Der Ausgangstext formuliert einen umfassenden Gegensatz zwischen Bösem und Gutem. Die Übersetzung soll diese Spannung nicht stillschweigend abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Die direkte Rede wird mit deutschem Schlusszeichen abgeschlossen. Archaismen wurden vermieden; die familiäre und moralische Aussagekraft des Textes bleibt erhalten.
