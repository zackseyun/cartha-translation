base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/035/006.yaml
  text: 'And she said to him, “My son, all my days I have not seen in you any deed of crookedness, but only uprightness. Yet I will tell you the truth, my son: I shall die in this year, and I shall not live beyond this year, for I saw in a dream the day of my death, that I would not live beyond one hundred and fifty-five years.”'
translation:
  language: de
  text: 'Und sie sagte zu ihm: „Mein Sohn, mein ganzes Leben lang habe ich bei dir keine verkehrte Tat gesehen, sondern nur Aufrichtigkeit. Doch ich will dir die Wahrheit sagen, mein Sohn: Noch in diesem Jahr werde ich sterben; ich werde dieses Jahr nicht überleben. Denn ich habe im Traum den Tag meines Todes gesehen und dass ich nicht länger als hundertfünfundfünfzig Jahre leben werde.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ግብረ፡ ጠዋየ
  choice: verkehrte Tat
  rationale: Gibt den Gegensatz zwischen moralisch verkehrtem Handeln und der unmittelbar folgenden Aufrichtigkeit natürlich und präzise wieder.
- source_word: ርቱዐ
  choice: Aufrichtigkeit
  rationale: Bewahrt den abstrakten moralischen Gegenpol zu »verkehrte Tat«; »Rechtschaffenheit« wäre ebenfalls möglich, klänge hier jedoch stärker wertend.
- source_word: ኢይትዐደው፡ ዛተ፡ ዓመተ፡ በሕይወትየ
  choice: ich werde dieses Jahr nicht überleben
  rationale: Natürliches modernes Deutsch für die Aussage, dass ihr Leben nicht über dieses Jahr hinausreichen wird.
- source_word: ኢየሐዩ፡ ፈድፋደ፡ እምእት፡ ወኃምሳ፡ ወኀምስ
  choice: Ich werde nicht länger als hundertfünfundfünfzig Jahre leben
  rationale: Gibt Altersgrenze und Negation klar wieder, ohne eine über den Ausgangstext hinausgehende zeitliche Präzisierung einzuführen.
theological_decisions:
- issue: Bedeutung des Traums als Todesankündigung
  choice: Die Aussage wird als von ihr berichteter Trauminhalt wiedergegeben.
  alternative: Den Traum ausdrücklich als göttliche Offenbarung oder sichere Prophezeiung kennzeichnen.
  rationale: Der Ausgangstext nennt einen Traum, erklärt aber weder ausdrücklich dessen Urheber noch seinen theologischen Status.
translation_notes:
  register: Moderne, würdige Standardsprache mit natürlicher direkter Rede. Die Wiederholung von »mein Sohn« und die Spannung zwischen gegenwärtiger Todesgewissheit und dem geschauten Lebensalter bleiben erhalten.
