  yaml_path: translation/extra_canonical/jubilees/035/015.yaml
  text: their uncleanness and after their error, he and his children. And you tell me to make him swear that he will not kill Jacob his brother. Even if he swears, he will not keep his oath, nor will he do anything but evil. And if he desires to kill Jacob his brother, he will be given into Jacob’s hand, and he will not escape from his hand, for he will fall into his hand.
translation:
  language: de
  text: ihre Unreinheit und nach ihrem Irrtum, er und seine Kinder. Und du sagst mir, ich solle ihn schwören lassen, dass er Jakob, seinen Bruder, nicht töten wird. Selbst wenn er schwört, wird er seinen Eid nicht einhalten und nichts als Böses tun. Und wenn er Jakob, seinen Bruder, töten will, wird er in Jakobs Hand gegeben werden und seiner Hand nicht entrinnen; denn er wird in seine Hand fallen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ርኵሶን
  choice: ihre Unreinheit
  rationale: Gibt das Substantiv für kultische oder sittliche Unreinheit formal wieder, ohne die Art der Unreinheit näher festzulegen.
- source_word: ወድኅረ፡ ስሕተቶን
  choice: und hinter ihrem Irrtum her
  rationale: Bewahrt sowohl die Bedeutung von ድኅረ („hinter/nach“) als auch die ungewöhnliche, durch die Versabgrenzung fragmentarische Formulierung.
- source_word: እምሕሱ
  choice: ich solle ihn schwören lassen
  rationale: Die Kausativform bezeichnet, dass Rebekka Esau einen Eid ablegen lassen soll.
- source_word: ኢይሄሱ፡ በመሐላሁ
  choice: wird er seinen Eid nicht halten
  rationale: Gibt die Aussage idiomatisch als mangelnde Treue zum geleisteten Eid wieder.
- source_word: ወኢይገብር፡ ኂሩተ፡ ዘእንበለ፡ እኩይ
  choice: und nichts als Böses tun
  rationale: Die ausschließende Konstruktion wird knapp und natürlich wiedergegeben, ohne ein zusätzliches „Gutes“ in den Text einzutragen.
- source_word: ውስተ፡ እዴ፡ ያዕቆብ፡ ይትወሀብ
  choice: wird er in Jakobs Hand gegeben werden
  rationale: Bewahrt das Passiv und das Bild des Ausgeliefertwerdens in die Hand eines anderen.
theological_decisions:
- issue: Nicht genannter Handelnder beim passiven „wird gegeben werden“
  choice: Passiv ohne ergänztes Subjekt beibehalten
  alternative: „Gott wird ihn in Jakobs Hand geben“
  rationale: Der gegebene Text nennt den Handelnden nicht; eine ausdrückliche Zuschreibung an Gott würde die offene Formulierung theologisch festlegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der ungewöhnliche Satzanfang bleibt als Fragment erhalten, weil Vers 15 offenbar mitten in einer fortlaufenden Rede einsetzt. Die wiederholte Wendung „in Jakobs Hand / in seine Hand“ wurde trotz stilistischer Redundanz bewahrt, da sie die eindringliche Wiederholung des Ausgangstextes abbildet.
