  yaml_path: translation/extra_canonical/jubilees/035/002.yaml
  text: And Jacob said to her, "I will do all that you have commanded me, for this matter will be an honor and greatness to me, and righteousness before God, that I should honor them."
translation:
  language: de
  text: 'Und Jakob sagte zu ihr: „Alles, was du mir geboten hast, werde ich tun; denn dies wird mir Ehre und Größe und Gerechtigkeit vor Gott sein, sie zu ehren.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘአዘዝክኒ
  choice: was du mir geboten hast
  rationale: Gibt die perfektische Verbform mit Subjekt in der 2. Person Feminin Singular und Objekt in der 1. Person Singular präzise und in natürlichem Deutsch wieder.
- source_word: ክብረ ፡ ወዕበየ
  choice: Ehre und Größe
  rationale: Bewahrt die beiden koordinierten Substantive und ihre prädikative Funktion, ohne sie zu einem einzigen Begriff zu verschmelzen.
- source_word: ወጽድቀ ፡ ቅድመ ፡ እግዚአብሔር
  choice: und vor Gott Gerechtigkeit
  rationale: Folgt der nominalen Struktur des Geʿez und erhält die theologisch gewichtige Formulierung „vor Gott“, ohne sie als bloße Anerkennung oder Verdienst auszudeuten.
- source_word: ከመ ፡ አክብሮሙ
  choice: dass ich sie ehre
  rationale: Gibt den Zwecks- beziehungsweise Inhaltssatz knapp wieder; das plurale Objekt bleibt entsprechend der Quelle als „sie“ erhalten.
theological_decisions:
- issue: Verhältnis von Ehre, Größe und Gerechtigkeit zum Ehren der Genannten
  choice: Die drei Nominalbegriffe bleiben nebeneinander stehen; der abschließende dass-Satz wird nicht stärker kausal oder verdiensttheologisch bestimmt.
  alternative: „Denn dadurch, dass ich sie ehre, erlange ich Ehre, Ansehen und Gerechtigkeit vor Gott.“
  rationale: Die Quelle lässt die genaue logische Beziehung offen. Die gewählte Fassung bewahrt diese Spannung und vermeidet die Eintragung einer Lehre vom Erwerb der Gerechtigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt bewusst nahe an der kompakten und leicht ungewohnten nominalen Struktur der Quelle. Der Vers ist strikt auf Jubiläen 35,2 begrenzt; Material aus Vers 1 wurde nicht aufgenommen.
