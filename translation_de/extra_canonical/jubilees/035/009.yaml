  - severity: low
    issue: „Esaus Sinn“ ist semantisch möglich, aber stilistisch weniger klar
    rationale: Für die innere Ausrichtung bzw. Denkweise Esaus ist „Esaus Gesinnung“ im Kontext der negativen Charakterisierung präziser und idiomatischer.
