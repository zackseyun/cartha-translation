  text: 'And she went in to Isaac and said to him, “I ask one request of you: make Esau swear that he will not devise evil against Jacob and will not pursue him in hostility, for you know Esau’s mind, that he has been cruel from his youth, and there is no goodness in him, for he desires'
translation:
  language: de
  text: 'Und sie ging zu Isaak und sagte zu ihm: »Ich bitte dich um eines: Lass Esau schwören, dass er nichts Böses gegen Jakob ersinnt und ihn nicht feindselig verfolgt. Denn du kennst Esaus Gesinnung: Von Jugend an ist er grausam gewesen, und nichts Gutes ist in ihm; denn er will …«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorgelegte Quelltext bricht an dieser Stelle mitten im Satz ab.
    reason: Kennzeichnet transparent die echte Unvollständigkeit des gelieferten Textsegments, ohne den fehlenden Inhalt zu ergänzen.
lexical_decisions:
- source_word: ስእለተ፡ አስተበቍዕ፡ በኀቤከ
  choice: Ich bitte dich um eines
  rationale: Gibt die Bitte idiomatisch und zugleich knapp wieder; der Singular der erbetenen Sache bleibt erhalten.
- source_word: ኢያሕስም፡ ላዕለ፡ ያዕቆብ
  choice: dass er nichts Böses gegen Jakob ersinnt
  rationale: Bewahrt gegenüber einer bloßen Wiedergabe mit „hassen“ den Gedanken eines gegen Jakob gerichteten bösen Vorhabens.
- source_word: ወኢይስድዶ፡ በጸልኢ
  choice: und ihn nicht in Feindschaft verfolgt
  rationale: Gibt sowohl das aktive Verfolgen als auch die feindselige Haltung wieder.
- source_word: ሕሊናሁ፡ ለዔሳው
  choice: Esaus Sinn
  rationale: „Sinn“ umfasst Denkweise und innere Ausrichtung, ohne den Ausdruck auf einzelne Gedanken zu verengen.
- source_word: ጸዋን፡ ውእቱ፡ እምንእሱ
  choice: Von Jugend an ist er grausam gewesen
  rationale: Bewahrt die negative Charakterisierung und ihren zeitlichen Bezug zur Jugend in natürlichem Deutsch.
- source_word: ወአልቦ፡ ላዕሌሁ፡ ኂሩተ
  choice: und nichts Gutes ist in ihm
  rationale: Nahe, idiomatische Wiedergabe der absoluten Aussage über das fehlende Gute.
- source_word: እስመ፡ ይፈቅድ
  choice: denn er will …
  rationale: Das überlieferte Segment endet nach dem einleitenden Verb; die Übersetzung lässt die Aussage daher bewusst offen.
theological_decisions:
- issue: Absolute moralische Charakterisierung Esaus
  choice: „nichts Gutes ist in ihm“
  alternative: „er besitzt keine Güte“
  rationale: Die starke Aussage des Textes wird nicht abgeschwächt und zugleich nicht durch eine zusätzliche dogmatische Deutung erweitert.
- issue: Unvollständiger Schluss des gelieferten Quellsegments
  choice: Abbruch mit Auslassungspunkten und Fußnote
  alternative: Ergänzung des erwartbaren Inhalts aus dem Folgekontext
  rationale: Die vorhandene Quelle endet bei „denn er will“; eine inhaltliche Ergänzung würde über den vorgelegten Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt eindringlich, aber nicht altertümlich. Das zu Beginn des gelieferten Ge’ez-Segments stehende ሞትኪ („dein Tod“, feminin) wurde nicht aufgenommen, da es syntaktisch als Überhang aus dem vorhergehenden Vers erscheint und auch die konsultierte englische Fassung den Vers erst mit Rebekkas Gang zu Isaak beginnen lässt.
