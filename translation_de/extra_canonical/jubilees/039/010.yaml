  text: And the Egyptian saw Joseph’s garment and the broken door-bar, and he heard the account of his wife, and he put Joseph into the prison-house, into the place where the king’s prisoners were confined. And he was there.
translation:
  language: de
  text: Und der Ägypter sah Josefs Gewand und den zerbrochenen Türriegel. Er hörte den Bericht seiner Frau und ließ Josef ins Gefängnis bringen, an den Ort, wo die Gefangenen des Königs festgehalten wurden. Und er war dort.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ጐብጻዊ
  choice: der Ägypter
  rationale: Gibt die ethnische Bezeichnung des Geez-Textes direkt und natürlich wieder.
- source_word: ልብሶ ለዮሴፍ
  choice: Josefs Gewand
  rationale: Entspricht der possessiven Konstruktion und bewahrt den konkreten Bezug auf das Kleidungsstück.
- source_word: ማዕጾ ስቡረ
  choice: den zerbrochenen Türriegel
  rationale: Die Wortgruppe bezeichnet im Kontext einen beschädigten beziehungsweise zerbrochenen Verschluss der Tür; „Türriegel“ ist im Deutschen präzise und anschaulich.
- source_word: ነገረ ብእሲቱ
  choice: den Bericht seiner Frau
  rationale: „Bericht“ gibt das Gesagte beziehungsweise die Darstellung der Frau neutral wieder, ohne deren Wahrheitsgehalt vorwegzunehmen.
- source_word: ቤተ ሞቅሕ
  choice: ins Gefängnis
  rationale: Die wörtliche Vorstellung eines „Hauses der Fessel“ wird idiomatisch als Gefängnis wiedergegeben.
- source_word: ይነብሩ ሙቁሓን
  choice: die Gefangenen … festgehalten wurden
  rationale: Gibt den Zustand der königlichen Gefangenen in natürlichem modernem Deutsch wieder.
- source_word: ወሀሎ
  choice: Und er blieb dort
  rationale: Das knappe Schlusswort bezeichnet sein weiteres Dortsein; „blieb“ klingt im Deutschen natürlich und fügt keinen erneuten ausdrücklichen Gefängnisbezug hinzu.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil mit klarer Syntax. Die Aussage der Frau wird bewusst als „Bericht“ bezeichnet und weder bestätigt noch als Lüge qualifiziert. Der knappe Schluss des Ausgangstextes bleibt ohne den Zusatz „im Gefängnis“ erhalten.
