lexical_decisions:
- source_word: ሊቀ፡ ዐቀብተ፡ ሞቅሕ
  choice: der oberste Gefängniswärter
  rationale: Die Wortgruppe bezeichnet den Leiter der Bewacher des Gefängnisses; die gewählte Formulierung ist im modernen Deutschen natürlich und bewahrt seine leitende Funktion.
- source_word: ይትአከኮሙ
  choice: sie zu betreuen
  rationale: Das Verb bezeichnet hier das Sich-Kümmern beziehungsweise Aufwarten bei den Gefangenen; „betreuen“ gibt die konkrete Fürsorgepflicht verständlich wieder.
- source_word: ይትለአክ፡ ቅድሜሆሙ
  choice: ihnen zu dienen
  rationale: Wörtlich steht eine Dienstleistung „vor ihnen“ im Blick. Die idiomatische deutsche Wiedergabe bewahrt das Dienstverhältnis, ohne eine räumliche Bedeutung zu überbetonen.
