  text: And both of them dreamed a dream[a], the chief cupbearer and the chief baker, and they told Joseph.
translation:
  language: de
  text: Und beide hatten einen Traum[a], der oberste Mundschenk und der oberste Bäcker, und sie erzählten Josef davon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im äthiopischen Text steht „einen Traum“ im Singular; gemeint ist, dass jeder der beiden einen Traum hatte.
    reason: Bewahrt die singularische Form des Ausgangstextes und erläutert ihren distributiven Sinn.
lexical_decisions:
- source_word: ሊቀ፡ መዛርት
  choice: der oberste Mundschenk
  rationale: Die äthiopische Amtsbezeichnung bezeichnet den ranghöchsten Verantwortlichen unter den Mundschenken; die traditionelle deutsche Wiedergabe ist klar und passt zum höfischen Zusammenhang.
- source_word: ሊቀ፡ ሐበዝት
  choice: der oberste Bäcker
  rationale: Gibt die Amtsbezeichnung unmittelbar und in natürlichem Deutsch wieder.
- source_word: ወነገርዎ፡ ለዮሴፍ
  choice: und sie erzählten Josef davon
  rationale: Die Verbform enthält ein maskulines singularisches Objekt („sie erzählten es/ihm“), das durch „Josef“ näher bestimmt wird. „Davon“ macht im Deutschen natürlich deutlich, dass sie Josef von ihrem Traumgeschehen berichteten, ohne ein mehrzahliges Objekt in den Ausgangstext einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Nennung der beiden Hofämter bleibt als nachgestellte Erläuterung erhalten; „hatten einen Traum“ klingt im Deutschen natürlicher als das formnähere „träumten einen Traum“.
