  text: There in the prison, the LORD gave Joseph favor and mercy before the chief of the keepers of the prison-house[a], because he saw that the LORD was with him, and everything
translation:
  language: de
  text: Dort im Gefängnis schenkte der HERR Josef Gunst und Erbarmen bei dem obersten Aufseher des Gefängnisses[a], denn dieser sah, dass der HERR mit ihm war, und alles
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Amtsbezeichnung verwendet dieselbe Wortwurzel für „hüten/bewachen“ wie zuvor. Im Zusammenhang des Gefängnisses bezeichnet sie jedoch dessen leitenden Aufseher und nicht Potifars Amt im Haushalt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ህየ፡ ውስተ፡ ሞቅሕ
  choice: Dort im Gefängnis
  rationale: Gibt die einleitende Ortsangabe vollständig und in natürlichem Deutsch wieder.
- source_word: ሞገሰ፡ … ወምሕረተ
  choice: Gunst und Erbarmen
  rationale: Bewahrt die beiden unterschiedlichen Begriffe, ohne sie zu einem einzigen Ausdruck zusammenzuziehen.
- source_word: ሊቀ፡ ዐቀብተ፡ ቤተ፡ ሞቅሕ
  choice: der oberste Aufseher des Gefängnisses
  rationale: Bezeichnet im Gefängniskontext den leitenden Vollzugsbeamten; „Aufseher“ gibt die Wächterwurzel idiomatisch wieder.
- source_word: እስመ፡ ርእየ
  choice: denn dieser sah
  rationale: Das ergänzte Demonstrativpronomen macht im Deutschen eindeutig, dass der Gefängnisaufseher das Subjekt von „sah“ ist, ohne den Sinn zu verändern.
- source_word: ወኵሎ
  choice: und alles
  rationale: Der bereitgestellte Quelltext bricht mit dieser unvollständigen Wendung ab; die Übersetzung bewahrt diesen Befund, statt den Satz zu ergänzen.
theological_decisions:
- issue: Wiedergabe von እግዚአብሔር
  choice: der HERR
  alternative: Gott
  rationale: „Der HERR“ folgt der im konsultierten Text verwendeten Gottesbezeichnung und wahrt den biblisch-feierlichen Sprachgebrauch, ohne dem fragmentarischen Satz eine zusätzliche Deutung aufzuerlegen.
translation_notes:
