translation:
  language: de
  text: … Tage vor Gott.[a] Josef erinnerte sich an diese Sache und weigerte sich, mit ihr zu schlafen. Sie bedrängte ihn ein Jahr und noch ein zweites, doch er weigerte sich, auf sie zu hören. Und er oder sie vergewisserte sich.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „Tage vor Gott“ bilden wahrscheinlich den Schluss des vorhergehenden Verses.
    reason: Die gegebene Versabgrenzung beginnt mit einem grammatisch unvollständigen Ausdruck, der inhaltlich rückwärts weist.
  - marker: b
    text: Der letzte Satz ist im überlieferten Ausschnitt unvollständig. Das Verb kann auch „stellte es sicher“, „unterrichtete“ oder „wies nach“ bedeuten; das Subjekt ist nicht ausdrücklich genannt.
    reason: Die Bedeutung und der Bezug der Schlussform sind wegen der Textsegmentierung unsicher.
lexical_decisions:
- source_word: ወአፈቀደ፡ ይስክብ፡ ምስሌሃ
  choice: und weigerte sich, mit ihr zu schlafen
  rationale: Die Konstruktion wird dem Zusammenhang entsprechend als Verweigerung wiedergegeben; „mit ihr schlafen“ ist eine natürliche und zugleich würdevolle deutsche Entsprechung.
- source_word: ወአስተብቍዐቶ
  choice: Sie bedrängte ihn
  rationale: Das Verb bezeichnet nachdrückliches Bitten oder Drängen; „bedrängte“ bringt die wiederholte, anhaltende Aufforderung knapp zum Ausdruck.
- source_word: ዓመተ፡ አሐደ፡ ወካልአ
  choice: ein Jahr und noch ein zweites
  rationale: Die ungewöhnliche zeitliche Formulierung des Ge’ez wird bewahrt, ohne sie zu „zwei Jahre lang“ zu glätten.
- source_word: ወአጠየቀ
  choice: Und er oder sie vergewisserte sich
  rationale: Die Verbform kann im vorliegenden, offenbar abgeschnittenen Satz den Sinn „sicherstellen/sich vergewissern“ tragen; das Ge’ez nennt kein ausdrückliches Subjekt, weshalb dessen Geschlecht nicht festgelegt wird.
theological_decisions:
- issue: Der einleitende Ausdruck gehört wahrscheinlich zum Ende des vorherigen Verses
  choice: Den überlieferten Wortlaut als Fragment mit Auslassungspunkten wiedergeben
  alternative: Den Ausdruck aus Vers 39:6 entfernen oder zum vorherigen Vers ziehen
  rationale: Da der bereitgestellte Ge’ez-Quelltext mit „Tage vor Gott“ beginnt, wird nichts ausgelassen; die typografische Kennzeichnung und Fußnote machen jedoch die wahrscheinliche Versgrenzenverschiebung transparent.
- issue: Unbestimmtes Subjekt im letzten Satz
  choice: „er oder sie“ ausdrücklich offenlassen
  alternative: Josef oder die Frau als Subjekt festlegen
  rationale: Die Verbform allein entscheidet das Geschlecht des Subjekts nicht, und der fragmentarische Kontext erlaubt keine sichere Zuordnung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die beiden offenkundigen Versgrenzenfragmente werden nicht stillschweigend ergänzt oder entfernt; echte lexikalische und syntaktische Unsicherheit wird in den Fußnoten ausgewiesen.
