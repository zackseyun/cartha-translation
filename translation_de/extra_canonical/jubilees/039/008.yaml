  terminology: „hebräischer Diener“ ist als Wiedergabe von ገብር vertretbar. „mit jemandem schlafen“ ist modernes, ausreichend würdiges Standarddeutsch für den sexuellen Kontext. Die Fußnote wahrt die lexikalische Offenheit, ohne die kontextuelle sexuelle Anschuldigung zu verschleiern.
