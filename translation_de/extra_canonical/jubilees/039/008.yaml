  text: And that woman saw that he would not lie with her, and she accused him before his master, saying, “Your Hebrew servant, whom you love, wanted to force me[a] so as to lie with me; and it happened that when
translation:
  language: de
  text: 'Und als jene Frau sah, dass er nicht mit ihr schlafen wollte, beschuldigte sie ihn vor seinem Herrn und sagte: »Dein hebräischer Diener, den du liebst, wollte mich zwingen,[a] mit ihm zu schlafen. Und es geschah, als …«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der mit »mich zwingen« wiedergegebene Ausdruck kann allgemeiner auch »mich angreifen«, »mich überwältigen« oder »mich verspotten« bedeuten. Die folgenden Worte weisen hier jedoch auf den Vorwurf eines versuchten sexuellen Übergriffs hin.
    reason: lexical_alternative
lexical_decisions:
- source_word: አይስክብ፡ ምስሌሃ
  choice: nicht mit ihr schlafen wollte
  rationale: Die Wendung bezeichnet im Kontext eindeutig den verweigerten Geschlechtsverkehr; die deutsche Formulierung ist natürlich und bewahrt die verneinte Willensrichtung.
- source_word: ጠየቀተ፡ ቅድመ፡ እግዚአ
  choice: beschuldigte sie ihn vor seinem Herrn
  rationale: Das Verb bezeichnet hier eine gegen Josef gerichtete Klage bzw. Anschuldigung; »vor seinem Herrn« gibt die gerichtete Rede gegenüber seinem Dienstherrn wieder.
- source_word: ገብርከ፡ ዕብራዊ
  choice: dein hebräischer Diener
  rationale: »Diener« wahrt das Abhängigkeitsverhältnis, ohne die deutsche Aussage unnötig gegenüber dem semantischen Umfang des Ausdrucks zu verschärfen.
- source_word: ዘታፈቅር
  choice: den du liebst
  rationale: Die wörtliche Beziehungsaussage wird beibehalten; eine Abschwächung zu »den du gernhast« oder »bevorzugst« wäre interpretierend.
- source_word: ይትዐገላኒ
  choice: wollte mich zwingen
  rationale: Die Form drückt beabsichtigten bzw. versuchten Zwang aus. Der folgende Infinitivzusammenhang legt eine sexuelle Anschuldigung nahe, während eine Fußnote den weiteren möglichen Bedeutungsumfang offenhält.
- source_word: ወኮነ፡ ሶበ
  choice: Und es geschah, als …
  rationale: Der überlieferte Versabschnitt bricht mit einer einleitenden Zeitkonstruktion ab; die deutsche Fassung bewahrt diesen unvollständigen Übergang sichtbar.
theological_decisions:
- issue: Art und Reichweite der falschen Anschuldigung
  choice: »wollte mich zwingen« mit erläuternder Fußnote
  alternative: »wollte mich überwältigen/angreifen/verspotten«
  rationale: Der unmittelbare Kontext konkretisiert die behauptete Tat sexuell, doch das zugrunde liegende Verb kann breiter verstanden werden. Haupttext und Fußnote bewahren sowohl Kontext als auch lexikalische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt klar und knapp. Der fragmentarische Schluss des überlieferten Verses wird nicht ergänzt; Auslassungspunkte kennzeichnen den offenen Anschluss.
