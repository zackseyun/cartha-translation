  source_fidelity: 'Der Sinn des geʽezischen Textes wird insgesamt treffend wiedergegeben: Die Frau stellt fest, dass er nicht mit ihr schlafen will, erhebt vor seinem Herrn Anklage und behauptet einen beabsichtigten Zwang mit sexuellem Ziel. Der offene zeitliche Anschluss am Versende bleibt erhalten.'
