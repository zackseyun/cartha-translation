lexical_decisions:
- source_word: ካልአ፡ ዓመተ
  choice: zwei Jahre
  rationale: Die geezische Zeitangabe bezeichnet eine Dauer von zwei Jahren; im Deutschen ist der Akkusativ der Zeitdauer natürlich.
- source_word: ክልኤቱ፡ ሕፁዋኒሁ
  choice: seine beiden Hofbeamten
  rationale: Der Ausdruck kann ranghohe Palastdiener beziehungsweise Eunuchen bezeichnen. „Hofbeamte“ passt zu den anschließend genannten Ämtern und vermeidet eine unnötige Festlegung auf körperliche Kastration.
- source_word: ሊቀ፡ መዛርት
  choice: obersten Mundschenk
  rationale: Die Amtsbezeichnung meint den ranghöchsten königlichen Mundschenk; die traditionelle deutsche Bezeichnung ist verständlich und sachlich genau.
- source_word: ሊቀ፡ ሐበዝት
  choice: obersten Bäcker
  rationale: Wörtlich die leitende Person über die Bäcker; „oberster Bäcker“ gibt Rang und Funktion knapp wieder.
- source_word: ወወደዮሙ፡ ውስተ፡
  choice: und ließ sie ins Gefängnis werfen
  rationale: Der überlieferte Ausschnitt endet nach „hinein/in“. Die vom Kontext verlangte Zielangabe wird entsprechend der vollständig bezeugten Sinnfolge als Gefängnis wiedergegeben; die kausative deutsche Formulierung ist idiomatisch.
