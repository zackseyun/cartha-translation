  to: Und er blieb dort zwei Jahre. In jenen Tagen wurde Pharao, der König von Ägypten, zornig auf seine beiden Kämmerer¹, den obersten Mundschenk und den obersten Bäcker, und ließ sie ins Gefängnis werfen.
