  text: And he remained there two years. And in those days Pharaoh king of Egypt was angry with his two eunuchs, with the chief cupbearer and with the chief baker, and he put them into prison.
translation:
  language: de
  text: Und er blieb dort zwei Jahre. In jenen Tagen wurde Pharao, der König von Ägypten, zornig auf seine beiden Kämmerer¹, den obersten Mundschenk und den obersten Bäcker, und ließ sie ins Gefängnis werfen.
