translation_notes:
  register: Moderne, würdige Standardsprache. Die Wiederholung von „auf“ bewahrt die erläuternde Struktur des Ausgangstextes; „Hofbeamte“ hält die mögliche Bedeutung von Eunuchen offen, ohne sie im Haupttext anatomisch festzulegen.
