  naturalness: Der Entwurf ist insgesamt idiomatisch und hat einen angemessen würdigen modernen Registerton. Die Umstellung zu „Pharao, der König von Ägypten, wurde …“ ist etwas direkter; „ins Gefängnis werfen“ ist eine natürliche Wiedergabe der im vorliegenden Quellenausschnitt abgebrochenen Einweisung.
