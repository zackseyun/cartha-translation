  terminology: „Unzucht mit einer verheirateten Frau begehen“ wahrt die allgemeinere ethisch-rechtliche Terminologie des Textes, ohne den Ausdruck unnötig auf den technischen Begriff „Ehebruch“ zu beschränken. „Todesurteil“, „Gott, dem Höchsten“ und „ewige Bücher“ sind angemessen. Die vorhandene Fußnote ist inhaltlich passend und korrekt verankert.
