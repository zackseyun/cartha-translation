  yaml_path: translation/extra_canonical/jubilees/039/005.yaml
  text: to lie with her. But he guarded his soul and remembered the LORD and the words that Jacob his father used to recite from the words of Abraham[a], that no man should commit fornication with a woman who has a husband, for the judgment of death has been ordained for him in heaven before the Most High God, and the sin is recorded against him in the eternal books continually.
translation:
  language: de
  text: bei ihr zu liegen. Doch er hütete seine Seele und dachte an Gott und an die Worte, die sein Vater Jakob aus den Worten Abrahams vorzutragen pflegte:[a] Kein Mann soll Unzucht mit einer verheirateten Frau begehen; denn im Himmel ist vor Gott, dem Höchsten, das Todesurteil über ihn verhängt, und seine Sünde wird fortwährend gegen ihn in den ewigen Büchern verzeichnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dass Jakob Worte weitergibt, die auf Abraham zurückgeführt werden, ist eine für das Jubiläenbuch charakteristische Erweiterung. Josefs Weigerung wird damit in überlieferter patriarchaler Unterweisung verankert und nicht nur in seinem persönlichen Gewissen.
    reason: cross_reference
lexical_decisions:
- source_word: አመጠወ፡ ነፍሶ፡
  choice: er hütete seine Seele
  rationale: Die Wendung beschreibt, dass Josef sich innerlich bewahrte beziehungsweise über sich selbst wachte. Die Wiedergabe erhält das Bild der „Seele“, bleibt aber im Deutschen verständlich.
- source_word: ይዜሙ፡
  choice: Unzucht … begehen
  rationale: Das Verb bezeichnet hier unerlaubten Geschlechtsverkehr, ausdrücklich mit der Frau eines anderen. „Unzucht begehen“ gibt den ethisch-rechtlichen Ernst wieder, ohne den Sinn unnötig auf Ehebruch als Terminus zu verengen.
- source_word: ብእሲት፡ እንተ፡ ባቲ፡ ምት፡
  choice: eine verheiratete Frau
  rationale: Die Formulierung meint eine Frau, die einen Mann beziehungsweise Ehemann hat. Natürliches modernes Deutsch verlangt hier „eine verheiratete Frau“.
- source_word: ኵነኔ፡ ሞት፡
  choice: das Todesurteil
  rationale: Die Verbindung aus „Gericht/Verurteilung“ und „Tod“ bezeichnet ein zum Tod führendes Urteil; „Todesurteil“ ist prägnant und sachgerecht.
- source_word: ተዐርገ፡ … ውስተ፡ መጻሕፍት፡ ዘለዓለም፡
  choice: wird … in den ewigen Büchern verzeichnet
  rationale: Wörtlich „steigt [die Sünde] in die ewigen Bücher hinauf“. Gemeint ist ihre himmlische Eintragung; die idiomatische Wiedergabe bewahrt das Motiv der bleibenden Aufzeichnung.
- source_word: በኵሉ፡
  choice: für immer
  rationale: Das abschließende Wort drückt umfassende Dauer aus. „Für immer“ passt zum Zusammenhang der ewigen Bücher und fügt keinen erneuten Gottesbezug hinzu.
theological_decisions:
- issue: Aussage oder Verbot in ከመ፡ አልቦ፡ መነሂ፡ … ዘይዜሙ፡
  choice: Kein Mann soll … begehen
  alternative: Es gibt keinen Mann, der … begeht
  rationale: Die formal negative Relativkonstruktion gibt im Zusammenhang die überlieferte patriarchale Weisung wieder. Eine rein beschreibende Übersetzung wäre im Deutschen missverständlich und würde den normativen Sinn verdecken.
- issue: Ort und Instanz des Todesurteils
  choice: im Himmel … vor Gott, dem Höchsten
  alternative: von Gott, dem Höchsten, im Himmel
  rationale: 'Die Übersetzung wahrt die Quellstruktur: Das Urteil ist im Himmel festgesetzt und steht vor dem höchsten Gott. Sie legt nicht zusätzlich fest, wie genau Gottes Urheberschaft am Urteil auszudrücken ist.'
- issue: Fortdauer der Sündenaufzeichnung
  choice: für immer in den ewigen Büchern verzeichnet
  alternative: fortwährend vor dem Herrn verzeichnet
  rationale: Am Versende steht kein erneuter Ausdruck für „vor dem Herrn“. Daher wird kein dort nicht vorhandener Gottesbezug ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Anschluss „bei ihr zu liegen“ bewahrt bewusst den fragmentarischen Übergang aus dem vorhergehenden Satz. „Hütete seine Seele“ erhält das semitische Menschenbild, während „verheiratete Frau“ und „Todesurteil“ natürlich und unmittelbar verständlich sind.
