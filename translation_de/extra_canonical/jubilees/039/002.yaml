  text: For Pharaoh, the chief of the guards. And he appointed Joseph over all his house, and the blessing of the LORD came to be.
translation:
  language: de
  text: Für den Pharao, den Obersten der Wache.[a] Und er setzte Josef über sein ganzes Haus; und der Segen des HERRN stellte sich ein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Vers setzt mit einem grammatisch fragmentarischen Ausdruck ein; möglicherweise gehört er syntaktisch zum vorausgehenden Satz.
    reason: Die isolierte Präpositionalphrase des geezischen Ausgangstextes lässt sich ohne den vorausgehenden Kontext nicht als vollständiger deutscher Satz darstellen.
  - marker: b
    text: 'Wörtlich: „und der Segen des HERRN wurde“. Der vorliegende Text nennt nicht ausdrücklich, worauf oder über wen der Segen kam.'
    reason: Die Fußnote bewahrt die auffällige Kürze und Offenheit des überlieferten Wortlauts und kennzeichnet die leicht idiomatische Übersetzung.
lexical_decisions:
- source_word: ለፈርዖን፡ ሊቀ፡ ዐቀብት
  choice: für den Pharao, den Obersten der Wache
  rationale: Die Präposition ለ wird mit „für“ wiedergegeben; ሊቀ ዐቀብት bezeichnet den Obersten der Wächter beziehungsweise der Wache. Die fragmentarische Form des überlieferten Satzausschnitts bleibt erhalten.
- source_word: ሤሞ፡ ለዮሴፍ፡ ዲበ፡ ኵሉ፡ ቤቱ
  choice: er setzte Josef über sein ganzes Haus
  rationale: ሤሞ bedeutet hier „er setzte/bestellte“, ዲበ „über“ und ኵሉ ቤቱ „sein ganzes Haus“ im Sinn des gesamten Haushalts.
- source_word: በረከተ፡ እግዚአብሔር
  choice: der Segen des HERRN
  rationale: በረከት bezeichnet den Segen; እግዚአብሔር ist die übliche Gottesbezeichnung und wird in biblischem Register mit „HERR“ wiedergegeben.
- source_word: ወኮነት
  choice: und … stellte sich ein
  rationale: Die Form bedeutet wörtlich etwa „und er/sie wurde“ beziehungsweise „kam zustande“. „Stellte sich ein“ ergibt im Deutschen eine natürliche, bewusst nicht ergänzte Aussage.
theological_decisions:
- issue: Unvollständiger Bezug des Segens
  choice: Keine Ergänzung eines Empfängers oder Grundes
  alternative: „kam über das Haus des Ägypters um Josefs willen“
  rationale: Das vorgelegte geezische Textstück nennt weder das Haus des Ägypters noch Josef als Ursache. Diese aus der Genesis-Parallele bekannte Aussage wird daher nicht in den Text eingetragen.
- issue: Wiedergabe der Gottesbezeichnung
  choice: HERR
  alternative: Gott/Herr
  rationale: „HERR“ wahrt das vertraute biblische Register, ohne die im vorliegenden Wortlaut nicht weiter erläuterte Gottesbezeichnung konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die abrupte Eröffnung und der offene Schluss der Vorlage werden nicht durch aus Parallelüberlieferungen erschlossene Angaben geglättet.
