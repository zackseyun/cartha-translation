  text: And Joseph was handsome in appearance and very good to look at, and his master's wife lifted up her eyes and saw Joseph and loved him, and asked him
translation:
  language: de
  text: Und alles, was er tat, ließ der Herr gelingen. Und Josef war von schöner Gestalt und sehr ansehnlich.[a] Die Frau seines Herrn erhob ihre Augen, sah Josef, liebte ihn und bat ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „sehr schön anzusehen“.'
    reason: Die Fußnote bietet für die zweite, durch „sehr“ verstärkte Schönheitsbeschreibung eine nähere Wiedergabe und macht die Intensivierung der Quelle sichtbar.
lexical_decisions:
- source_word: ሠናይ፡ ራእዮ
  choice: von schöner Gestalt
  rationale: Gibt die erste Aussage über Josefs gutes beziehungsweise schönes äußeres Erscheinungsbild idiomatisch wieder, ohne sie mit der folgenden Beschreibung zusammenzuziehen.
- source_word: ወላህይ፡ ራእዮ፡ ጥቀ
  choice: und sehr ansehnlich
  rationale: Bewahrt die verstärkende Bedeutung von ጥቀ („sehr, überaus“) und formuliert die zweite, parallele Beschreibung in natürlichem Deutsch.
- source_word: አንሥአት፡ አዕይንቲሃ
  choice: erhob … ihre Augen
  rationale: Erhält das konkrete semitische Bild der Quelle, das hier bewusst formeller klingt als ein bloßes „sah ihn an“.
- source_word: አፍቀረቶ
  choice: gewann ihn lieb
  rationale: Gibt zunächst die ausdrücklich genannte Zuneigung wieder, ohne sie stillschweigend als rein sexuelle Begierde auszulegen.
- source_word: አስተብቍዐቶ
  choice: bat ihn
  rationale: Entspricht dem Sinn „bitten, ersuchen“; der Inhalt der Bitte folgt erst im anschließenden Vers.
theological_decisions:
- issue: Art der Zuneigung der Frau zu Josef
  choice: gewann ihn lieb
  alternative: begehrte ihn
  rationale: Die Quelle verwendet ein Verb des Liebens. Der erzählerische Kontext kann sexuelles Begehren nahelegen, doch die Übersetzung soll diese Deutung nicht anstelle des überlieferten Wortlauts festschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionelle Wendung „erhob … ihre Augen“ bewahrt das Bild der Quelle; der abschließende Satz bleibt bewusst offen, weil der Inhalt der Bitte im folgenden Vers steht.
