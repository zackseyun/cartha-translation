  source_fidelity: 'Der Entwurf gibt die Beschreibung Josefs, das Erheben der Augen, das Sehen, Lieben und Bitten grundsätzlich quellentreu wieder und bewahrt bei „liebte“ die semantische Offenheit des ge''ezischen Verbs. Er lässt jedoch den einleitenden, im vorgelegten Ge''ez-Text enthaltenen Satz aus: Der Herr lässt alles gelingen, was Josef tut. Dieser Satz muss trotz seiner Auslassung im englischen Audit-Auszug ergänzt werden.'
  naturalness: „Von schöner Gestalt und sehr ansehnlich“ ist würdiges, modernes Standarddeutsch und gibt die parallelen Schönheitsaussagen idiomatisch wieder. „Liebte ihn“ ist im heutigen Deutsch natürlicher als „gewann ihn lieb“ und legt die Zuneigung nicht stärker aus. Die bewusst offene Formulierung „bat ihn“ bleibt möglich, weil der Gegenstand der Bitte erst im Folgevers genannt wird.
  terminology: „Der Herr“ gibt እግዚአብሔር angemessen wieder. „Sehr“ bildet ጥቀ ausdrücklich ab. „Liebte ihn“ folgt dem Wortlaut, ohne die Zuneigung voreilig als Begehren zu deuten. Der Fußnotenanker steht unmittelbar bei der zweiten, verstärkten Schönheitsbeschreibung.
