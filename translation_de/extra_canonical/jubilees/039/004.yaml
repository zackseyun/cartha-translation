    rationale: Das ge'ezische Verb bezeichnet hier schlicht Liebe/Zuneigung. „Liebte ihn“ ist natürlicher und wahrt die erzählerische sowie semantische Offenheit besser.
  revised_text: Und alles, was er tat, ließ der Herr gelingen. Und Josef war von schöner Gestalt und sehr ansehnlich.[a] Die Frau seines Herrn erhob ihre Augen, sah Josef, liebte ihn und bat ihn.
