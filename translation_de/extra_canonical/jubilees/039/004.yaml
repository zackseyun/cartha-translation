revisions:
- from: Und Josef war von schöner Gestalt und sehr ansehnlich.[a] Da erhob die Frau seines Herrn ihre Augen, sah Josef, gewann ihn lieb und bat ihn.
  to: Und alles, was er tat, ließ der Herr gelingen. Und Josef war von schöner Gestalt und sehr ansehnlich.[a] Die Frau seines Herrn erhob ihre Augen, sah Josef, liebte ihn und bat ihn.
  rationale: Die Revision ergänzt den im Ge'ez-Text vorhandenen, im englischen Audit-Auszug nicht enthaltenen Eröffnungssatz. Im verbleibenden Text wird nur „gewann ihn lieb“ zu dem natürlicheren und zugleich weniger interpretierenden „liebte ihn“ geändert. Die Wiederholung der Schönheitsbeschreibung, die Verstärkung durch „sehr“, das Bild vom Erheben der Augen und die offene Bitte bleiben erhalten.
