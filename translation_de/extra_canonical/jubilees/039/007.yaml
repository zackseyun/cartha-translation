review_pass:
  verdict: revise
  source_fidelity: Die beiden Vorkommen von ወአንዘተ („sie ergriff ihn“) sowie der abschließende, in den folgenden Vers überleitende Satzanfang ወርእየት sind wiedergegeben. Die Reihung der Handlungen und die konkreten Elemente Gewand, Hand, Türriegel und Flucht nach draußen bleiben erhalten. Das adversative „doch“ hat jedoch keine ausdrückliche Entsprechung im Ge’ez; die Fluchtformulierung wird zudem idiomatischer und näher an አፍአ፡ እምቅድመ፡ ገጻ wiedergegeben.
  naturalness: „Vor ihr hinaus“ klingt im heutigen Standarddeutsch nicht idiomatisch. „Lief nach draußen, fort von ihr“ ist natürlich und bewahrt sowohl die Bewegung nach draußen als auch die Entfernung von ihr. Die direkte Reihung mit „und“ entspricht dem Erzählstil des Ausgangstextes.
  terminology: „Packte“ / „hielt ihn fest“ gibt die Wiederholung des Ergreifens verständlich wieder. „Bei ihr zu liegen“ bewahrt die verhüllende Ausdrucksweise des Textes. „Türriegel“ ist für ማዕጾ passend.
  issues:
  - severity: low
    issue: Unmarkierter Gegensatz durch „doch“
    rationale: Der Ge’ez-Text reiht die Handlung mit ወ („und“) aneinander; ein ausdrücklicher Gegensatz ist nicht markiert. Die deutsche Wiedergabe sollte diesen nicht unnötig verstärken.
  - severity: medium
    issue: Unidiomatische Fluchtformulierung „lief vor ihr hinaus“
    rationale: Die Formulierung ist im modernen Deutsch missverständlich. „lief nach draußen, fort von ihr“ gibt „draußen/von ihrem Angesicht weg“ klarer und natürlicher wieder.
