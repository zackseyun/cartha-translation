lexical_decisions:
- source_word: ወአንዘተ
  choice: Und sie packte ihn / hielt ihn fest
  rationale: Das Verb erscheint zweimal. Die variierte Wiedergabe gibt beide Vorkommen wieder und klingt im Deutschen natürlich, ohne die Wiederholung inhaltlich abzuschwächen.
- source_word: ከመ፡ ትትበአስ፡ ይስክብ፡ ምስሌሃ
  choice: um ihn zu zwingen, bei ihr zu liegen
  rationale: Die Zweckkonstruktion und der Zwang werden ausdrücklich bewahrt; „bei ihr liegen“ erhält die verhüllende, aber klare Ausdrucksweise des Ausgangstextes.
- source_word: ወዐጸወት፡ ኆኅተ፡ ቤት
  choice: Sie schloss die Türen des Hauses
  rationale: Formale und verständliche Wiedergabe der geschlossenen Türen des Hauses.
- source_word: ወኀደገ፡ ልብሶ፡ ውስተ፡ እዴሃ
  choice: doch er ließ sein Gewand in ihrer Hand
  rationale: Bewahrt den konkreten Ausdruck des Ge’ez und den erzählerischen Gegensatz.
- source_word: ወሰበረ፡ ማዕጾ
  choice: zerbrach den Türriegel
  rationale: „Türriegel“ gibt den Gegenstand präzise wieder; „zerbrach“ folgt dem starken Verb des Ausgangstextes.
- source_word: ወጐየ፡ አፍአ፡ እምቅድመ፡ ገጻ
  choice: und lief vor ihr hinaus
  rationale: Natürliches modernes Deutsch, das sowohl die Flucht nach draußen als auch das Fortlaufen aus ihrer unmittelbaren Gegenwart ausdrückt.
- source_word: ወርእየት
  choice: Und sie sah …
  rationale: Das abschließende Verb wird nicht ausgelassen. Die Auslassungspunkte zeigen an, dass der Satz in den folgenden Vers hineinführt.
