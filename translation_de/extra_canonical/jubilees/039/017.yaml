base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/039/017.yaml
  text: 'And as he interpreted for them, so it happened to them: Pharaoh restored the chief cupbearer to his service, but the baker he killed, just as Joseph had interpreted for them. But the chief cupbearer forgot Joseph in the prison-house, although he had told him what would happen[a], and he did not remember to make it known to Pharaoh what Joseph had told him, for he forgot.[b]'
translation:
  language: de
  text: 'Und wie er es ihnen gedeutet hatte, so geschah es ihnen: Der Pharao setzte den obersten Mundschenk wieder in sein Amt ein, den Bäcker aber ließ er töten, so wie Josef es ihnen gedeutet hatte. Doch der oberste Mundschenk vergaß Josef im Gefängnis, nachdem Josef ihm mitgeteilt hatte, was geschehen würde[a]. Er dachte nicht daran, dem Pharao mitzuteilen, was Josef ihm gesagt hatte; denn er hatte es vergessen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann die zeitliche Wendung auch mit „als Josef ihm mitgeteilt hatte, was geschehen würde“ wiedergegeben werden.
    reason: source_ambiguity
  - marker: b
    text: Der letzte Satz ist im überlieferten äthiopischen Text sprachlich schwerfällig. Gemeint ist offenbar, dass der oberste Mundschenk Josef vergaß und dem Pharao nicht mitteilte, was Josef ihm gesagt hatte.
    reason: textual_variant
lexical_decisions:
- source_word: ፈከረ
  choice: deuten
  rationale: Das Verb bezeichnet hier die Auslegung der Träume und wird im Deutschen natürlich mit „deuten“ wiedergegeben.
- source_word: ሊቀ፡ መዘርት
  choice: oberster Mundschenk
  rationale: Der Titel bezeichnet den Vorsteher der königlichen Mundschenken; „oberster Mundschenk“ ist die geläufige, kontextgerechte deutsche Amtsbezeichnung.
- source_word: አግብኦ ... ውስተ፡ ግብሩ
  choice: setzte ... wieder in sein Amt ein
  rationale: Die Wendung meint die Rückkehr in den früheren Dienst beziehungsweise das Amt des Pharaos.
- source_word: ቤተ፡ ሞቅሕ
  choice: Gefängnis
  rationale: Wörtlich ein „Haus der Fessel“; „Gefängnis“ ist die natürliche moderne Entsprechung.
- source_word: አይድዖ
  choice: ihm kundgetan hatte
  rationale: Die Kausativform bedeutet „wissen lassen, mitteilen“ und bezieht sich im Zusammenhang darauf, dass Josef dem Mundschenk das Kommende mitgeteilt hatte; sie bedeutet nicht bloß „wissen“.
- source_word: ኢተዘከረ
  choice: dachte nicht daran
  rationale: Im Zusammenhang bezeichnet das Verb das unterlassene Erinnern beziehungsweise Gedenken, das zu einer Mitteilung an den Pharao hätte führen sollen.
