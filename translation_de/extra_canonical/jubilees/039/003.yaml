  text: in the house of the Egyptian because of Joseph. And everything that he did, the LORD made to prosper. And the Egyptian left everything in Joseph’s hand, because he saw that the LORD was with him, and everything that he did the LORD made to prosper.
translation:
  language: de
  text: im Haus des Ägypters – um Josefs willen.[a] Und alles, was er tat, ließ der HERR gelingen. Der Ägypter überließ Josef alles, denn er sah, dass der HERR mit ihm war und alles, was er tat, gelingen ließ.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Satzanfang setzt den Gedanken aus Vers 2 fort. Möglich ist auch die Verbindung: „im Haus des Ägypters um Josefs willen; und alles, was er tat, ließ der HERR gelingen.“'
    reason: Die überlieferte Satzgliederung und der syntaktische Anschluss der eröffnenden Präpositionalphrase sind nicht eindeutig.
lexical_decisions:
- source_word: በእንተ፡ ዮሴፍ
  choice: um Josefs willen
  rationale: Gibt die kausale Wendung natürlich wieder und bewahrt den Gedanken, dass der Segen im Haus des Ägypters auf Josef zurückging.
- source_word: ይሴርሖ
  choice: ließ … gelingen
  rationale: Drückt das bewirkte Gedeihen idiomatisch aus, ohne den Erfolg Josef selbst zuzuschreiben.
- source_word: ኀደገ፡ … በእዴሁ፡ ለዮሴፍ
  choice: übergab alles der Hand Josefs
  rationale: Bewahrt das konkrete Hand-Motiv der Vorlage und bezeichnet zugleich die Übertragung der Verantwortung.
- source_word: እግዚአብሔር
  choice: der HERR
  rationale: Die traditionelle Wiedergabe des Gottesnamens im deutschen Bibelregister passt zum englischen Konsultationstext und zum Kontext.
theological_decisions:
- issue: Ursprung von Josefs Erfolg
  choice: Der HERR ließ Josefs Tun gelingen.
  alternative: Josef hatte aus eigener Fähigkeit Erfolg.
  rationale: Die Kausativform der Vorlage weist das Gelingen ausdrücklich Gottes Wirken zu.
- issue: Bezug des Pronomens in „alles, was er tat“
  choice: „er“ bleibt im Text stehen und wird nicht erklärend durch „Josef“ ersetzt.
  alternative: „alles, was Josef tat“
  rationale: Der Kontext legt Josef nahe, doch die pronominale Form der Quelle soll nicht unnötig vereindeutigt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich macht den fragmentarischen Anschluss an den vorherigen Vers lesbar; die Fußnote bewahrt die alternative syntaktische Verbindung. Die Wiederholung des Gelingenlassens bleibt entsprechend der Quelle erhalten.
