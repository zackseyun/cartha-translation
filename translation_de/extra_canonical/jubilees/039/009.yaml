- source_word: አኀዝክዎ
  choice: ich ihn ergriff
  rationale: Gibt das Festhalten oder Ergreifen knapp wieder, ohne die Handlung näher auszudeuten.
- source_word: ማዕጾ
  choice: Tür
  rationale: Die übliche und direkte Bedeutung ist „Tür“; eine mögliche speziellere Deutung als Türriegel wird in der Fußnote erhalten.
