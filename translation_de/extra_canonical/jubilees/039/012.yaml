revisions:
- from: Was immer er tat, ließ der HERR gelingen. Und er überließ alles seiner Hand. Der oberste Gefängnisaufseher kümmerte sich um nichts von dem, was ihm anvertraut war,[a] denn Josef erledigte alles, und der HERR führte es zum Erfolg.
  to: Was immer er tat, ließ der HERR gelingen. Der oberste Gefängnisaufseher überließ ihm alles. Er wusste nichts von dem, was bei ihm war,[a] denn Josef tat alles, und der HERR vollendete es.
  rationale: Die Revision klärt die Rollenverteilung, bewahrt die direkte Aussage über das Nichtwissen des Gefängnisaufsehers und gibt die abschließende Aussage von Gottes Vollenden näher am Ausgangstext wieder. Die Fußnotenmarke bleibt korrekt am erläuterten Ausdruck verankert.
