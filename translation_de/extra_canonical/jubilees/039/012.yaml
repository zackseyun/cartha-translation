base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/039/012.yaml
  text: Whatever he did, the LORD made to prosper. And he left everything in his hand, and the chief keeper of the prison knew nothing that was with him, because Joseph did everything and the LORD brought it to completion.
translation:
  language: de
  text: Was immer er tat, ließ der HERR gelingen. Der oberste Gefängnisaufseher überließ ihm alles. Er wusste nichts von dem, was bei ihm war,[a] denn Josef tat alles, und der HERR vollendete es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Aussage kann im Zusammenhang bedeuten, dass der Gefängnisaufseher wegen Josefs zuverlässiger Verwaltung nichts selbst beaufsichtigen oder überprüfen musste.
    reason: Der Haupttext gibt die Wissensaussage des äthiopischen Wortlauts direkt wieder; die Anmerkung erläutert die naheliegende kontextuelle Implikation, ohne sie als Übersetzung auszugeben.
lexical_decisions:
- source_word: ዘገብረ፡ እግዚአብሔር፡ ይሴርሖ
  choice: Was immer er tat, ließ der HERR gelingen
  rationale: Die Konstruktion bezeichnet Josefs Tun und Gottes bewirkten Erfolg; die deutsche Fassung ist natürlich und bewahrt die klare Zuordnung.
- source_word: ወኀደገ፡ ኵሎ፡ በእዴሁ
  choice: Und er überließ alles seiner Hand
  rationale: Die wörtliche Körperteilmetapher »in seiner Hand« wird beibehalten, da sie im Deutschen verständlich ist und umfassende Verantwortung ausdrückt.
- source_word: ሊቀ፡ ዐቀብተ፡ ሞቅሕ
  choice: der oberste Gefängnisaufseher
  rationale: Gibt die leitende Stellung über die Bewacher beziehungsweise das Gefängnis knapp und idiomatisch wieder.
- source_word: ወእግዚአብሔር፡ ይፈጽም
  choice: und der HERR führte es zum Erfolg
  rationale: Das Verb bezeichnet Vollendung beziehungsweise erfolgreiche Ausführung; die Wiedergabe wahrt den Unterschied zum vorherigen »gelingen lassen«, ohne Gottes Wirken abzuschwächen.
theological_decisions:
- issue: Verhältnis von Josefs Handeln und Gottes Wirken
  choice: »Josef erledigte alles, und der HERR führte es zum Erfolg«
  alternative: »Josef tat alles, und der HERR vollendete es«
  rationale: Die parallele Zuschreibung menschlichen Handelns und göttlichen Gelingens bleibt bestehen; sie wird weder als Konkurrenz noch als ausschließliche göttliche Verursachung aufgelöst.
- issue: Gottesbezeichnung
  choice: HERR in Kapitälchenersatz durch Großbuchstaben
  alternative: Herr
  rationale: Die traditionelle deutsche Darstellung des göttlichen Namens wird verwendet, entsprechend der englischen Konsultationsschicht, ohne eine spezifische Aussprache festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Hand-Metapher bleibt erhalten; eine Fußnote bewahrt die wörtlichere, mehrdeutige Formulierung des Ausgangstextes.
