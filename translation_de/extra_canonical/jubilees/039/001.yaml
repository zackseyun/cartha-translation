  to: Jakob wohnte im Land, in dem sein Vater als Fremder gelebt hatte, im Land Kanaan. Dies ist die Geschlechterfolge[a] Jakobs. Josef war siebzehn Jahre alt, als man ihn nach Ägypten hinabbrachte; Potifar, ein Hofbeamter[b] des Pharaos, der Oberste der Leibwache, kaufte ihn.
