base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/039/001.yaml
  text: And Jacob dwelt in the land of his father’s sojourning, in the land of Canaan. These are the generations of Jacob. And Joseph, being seventeen years old, was brought down into Egypt, and Potiphar, an officer of Pharaoh, chief of the guards, bought him.
translation:
  language: de
  text: Jakob wohnte im Land, in dem sein Vater als Fremder gelebt hatte, im Land Kanaan. Dies ist die Geschlechterfolge[a] Jakobs. Josef war siebzehn Jahre alt, als man ihn nach Ägypten hinabbrachte; Potifar, ein Hofbeamter[b] des Pharaos, der Oberste der Leibwache, kaufte ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die formelhafte Wendung kann auch „Dies sind die Generationen Jakobs“ oder „Dies ist die Geschichte Jakobs“ wiedergegeben werden. Sie kann sowohl die Abstammung als auch den folgenden Familienbericht bezeichnen.
    reason: Bewahrt den genealogischen und erzählerischen Bedeutungsumfang der Überschriftsformel.
  - marker: b
    text: Das zugrunde liegende Wort kann auch „Eunuch“ bedeuten, wurde jedoch ebenso als Titel für einen Hofbeamten gebraucht.
    reason: Macht die lexikalische und historische Mehrdeutigkeit der Amtsbezeichnung transparent.
lexical_decisions:
- source_word: ምድረ፡ ፍልሰተ፡ አቡሁ
  choice: im Land, in dem sein Vater als Fremder gelebt hatte
  rationale: Gibt die Vorstellung vom zeitweiligen Aufenthalt beziehungsweise Fremdlingsdasein des Vaters in natürlichem modernem Deutsch wieder.
- source_word: ትዝምደ
  choice: Geschichte
  rationale: Der Ausdruck bezeichnet die Geschlechterfolge beziehungsweise die aus Jakob hervorgehende Familiengeschichte; „Geschichte“ passt hier als verständliche Überschrift zum folgenden Bericht, ohne den Sinn auf eine bloße Namensliste einzuengen.
- source_word: ኅፅዉ
  choice: Hofbeamter
  rationale: Der Titel kann wörtlich einen Eunuchen bezeichnen, wurde aber auch allgemeiner für einen hohen Hofbeamten gebraucht. Der Kontext beschreibt Potifar als Amtsträger des Pharaos.
- source_word: አውረድዎ፡ ውስተ፡ ግብጽ
  choice: man ihn nach Ägypten hinabbrachte
  rationale: Bewahrt sowohl die passive Erfahrung Josefs als auch die traditionelle räumliche Wendung „hinabbringen“.
- source_word: ተሣየጦ
  choice: kaufte ihn
  rationale: Gibt den Erwerb Josefs als versklavten Menschen direkt und ohne beschönigende Umschreibung wieder.
theological_decisions:
- issue: Bedeutungsumfang der Formel zur Geschlechterfolge Jakobs
  choice: Dies ist die Geschichte Jakobs
  alternative: Dies sind die Nachkommen Jakobs / Dies ist die Geschlechterfolge Jakobs
  rationale: Die Formel kann Abstammung, Familiengeschichte und den daraus folgenden Bericht umfassen. „Geschichte“ erhält diese erzählerische Weite; die Fußnote macht die Mehrdeutigkeit sichtbar.
- issue: Amtsbezeichnung Potifars
  choice: Hofbeamter des Pharaos
  alternative: Eunuch des Pharaos
  rationale: Der zugrunde liegende Titel kann körperlichen Status oder höfisches Amt bezeichnen. Da der Kontext die amtliche Stellung hervorhebt, steht die funktionsbezogene Wiedergabe im Text, während die wörtlichere Möglichkeit in der Fußnote erhalten bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Die Wiederholung „Land … Land Kanaan“ bleibt als Merkmal der Vorlage erhalten. „Hinabbrachte“ bewahrt die traditionelle räumliche Perspektive, ohne altertümlich zu wirken.
