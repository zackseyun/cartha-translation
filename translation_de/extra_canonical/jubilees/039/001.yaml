  naturalness: Das Deutsch ist insgesamt klar und modernes Standarddeutsch. „Die Geschlechterfolge Jakobs“ ist als formelhafte Überschrift verständlich und quellennäher; die anschließende Satzfügung mit Potifar bleibt dabei natürlich.
