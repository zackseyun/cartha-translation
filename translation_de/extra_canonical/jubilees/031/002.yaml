  text: the foreign gods that are among you.' And they gave him the foreign gods, and what was in their ears and what was on their necks, and the idols that Rachel had stolen from Laban her brother. And she gave them all to Jacob, and he burned them, and crushed them, and destroyed them, and hid them under the oak that was in the land of Shechem.
translation:
  language: de
  text: »… die fremden Götter, die sich in eurer Mitte befinden.« Und sie gaben ihm die fremden Götter sowie das, was sie an ihren Ohren und um ihren Hals trugen, und die Götzenbilder, die Rahel ihrem Bruder Laban gestohlen hatte. Sie übergab alles Jakob, und er verbrannte, zerschlug und vernichtete es und verbarg es unter der Eiche[a] im Land Sichem.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Terebinthe“. Die genaue Baumart hinter dem ge’ezischen Wort ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አማልክተ፡ ነኪር
  choice: fremde Götter
  rationale: Gibt die wörtliche Bedeutung der ge’ezischen Wortgruppe wieder und bewahrt ihren polemisch-religiösen Gehalt.
- source_word: ዘውስተ፡ እዘኒሆሙ፡ ወዘውስተ፡ ክሳውዲሆሙ
  choice: das, was sie an ihren Ohren und um ihren Hals trugen
  rationale: Die Quelle nennt wörtlich, was sich in ihren Ohren und an ihren Hälsen befand; die natürliche deutsche Fassung macht den gemeinten Schmuck deutlich, ohne ihn genauer zu bestimmen.
- source_word: ጣዖተ
  choice: Götzenbilder
  rationale: Bezeichnet kultische Bilder beziehungsweise Idole; „Götzenbilder“ ist im Deutschen klar und unterscheidet sie sprachlich von den zuvor genannten fremden Göttern.
- source_word: አውዕዮ፡ ወፀተሞ፡ ወአማስኖ
  choice: verbrannte, zerschlug und vernichtete es
  rationale: Alle drei aufeinanderfolgenden Verben werden wiedergegeben; das zusammenfassende Singularpronomen bezieht sich auf „alles“.
- source_word: ድርዋስ
  choice: Eiche
  rationale: Traditionelle und verständliche Wiedergabe des Baumnamens; die genaue Baumart ist unsicher und wird deshalb in einer Fußnote offengehalten.
- source_word: ምድረ፡ ሰቂሞን
  choice: Land Sichem
  rationale: Formnahe Wiedergabe der ge’ezischen Ortsangabe.
theological_decisions:
- issue: Verwandtschaftsbezeichnung Labans zu Rahel
  choice: ihrem Bruder Laban
  alternative: ihrem Vater Laban
  rationale: Der vorgelegte ge’ezische Text bezeichnet Laban ausdrücklich als ihren Bruder. Obwohl dies mit der vertrauten Genesisüberlieferung in Spannung steht, wird der Quellenbefund nicht harmonisierend geändert.
- issue: Unterscheidung zwischen fremden Göttern und Götzenbildern
  choice: Beide Ausdrücke getrennt wiedergeben
  alternative: Beide unter „Götzen“ zusammenfassen
  rationale: Die Quelle verwendet verschiedene Begriffe; ihre Unterscheidung bleibt erhalten, ohne eine weitergehende theologische Deutung einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die einleitenden Auslassungspunkte zeigen an, dass der Vers mit dem Ende einer bereits begonnenen direkten Rede einsetzt. Die Aufzählung und alle drei Verben der Zerstörung bleiben erhalten; die Spannung in der Bezeichnung Labans als Rahels Bruder wird nicht geglättet.
