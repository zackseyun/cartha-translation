  text: For they resemble you.” And he told him that they were indeed his sons. And he said, “Now I see that they are truly your sons.”
translation:
  language: de
  text: '„Denn sie sehen dir ähnlich.“ Und er sagte ihm, dass sie tatsächlich seine Söhne seien. Da sagte er: „Nun sehe ich, dass sie wirklich deine Söhne sind.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመስሉከ
  choice: sie sehen dir ähnlich
  rationale: Gibt die Bedeutung des Verbs mit dem Objektsuffix der 2. Person Singular natürlich und präzise wieder.
- source_word: በአማን
  choice: tatsächlich / wirklich
  rationale: Die wiederholte Bekräftigung wird idiomatisch variiert, ohne ihren Sinn abzuschwächen.
- source_word: ውሉዱ
  choice: seine Söhne
  rationale: Der Ausdruck bezeichnet im berichtenden Satz die Söhne des Angesprochenen; der unmittelbare Zusammenhang verlangt keine allgemeinere Wiedergabe als „Kinder“.
- source_word: ውሉድከ
  choice: deine Söhne
  rationale: Bewahrt den Bezug der 2. Person und die wörtliche Verwandtschaftsbezeichnung; „Enkel“ wäre eine kontextuelle Umdeutung.
- source_word: ርእክ
  choice: sehe ich
  rationale: Entspricht dem Wahrnehmungsverb und bewahrt die Aussageform des Ausgangstextes.
theological_decisions:
- issue: Verwandtschaftsbezeichnung im letzten Satz
  choice: deine Söhne
  alternative: deine Enkel
  rationale: Der ge'ezische Wortlaut bezeichnet sie in Beziehung zum Angesprochenen ausdrücklich als dessen Söhne. Die genealogische Beziehung des Sprechers zu ihnen rechtfertigt keine Ersetzung durch „Enkel“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Konjunktiv I („seien“) kennzeichnet die indirekte Rede; die direkte Rede bleibt schlicht und verständlich.
