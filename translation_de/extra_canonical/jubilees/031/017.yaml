  text: May your table be full, and may your food not fail for all ages. And all who hate you shall fall before you, and all your adversaries shall be rooted out and perish. And the one who blesses you,
translation:
  language: de
  text: Dein Tisch sei reich gedeckt, und deine Nahrung gehe für alle Zeiten nicht aus. Alle, die dich hassen, sollen vor dir fallen; alle deine Widersacher sollen entwurzelt werden und zugrunde gehen. Und wer dich segnet,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der in diesem Vers begonnene Satz wird in Vers 18 fortgesetzt.
    reason: Die syntaktisch unvollständige Form des Versendes entspricht dem Ge’ez-Text und könnte sonst wie ein Textabbruch wirken.
lexical_decisions:
- source_word: ማዕድከ፡ ምልእተ
  choice: Dein Tisch sei reich gedeckt
  rationale: Gibt die Segensformel mit dem wörtlichen Bild des vollen Tisches in natürlichem, würdigem Deutsch wieder.
- source_word: ወኢይሕፀፅ፡ እክልከ፡ ለኵሉ፡ ዓለማት
  choice: und deine Nahrung gehe in alle Ewigkeit nicht aus
  rationale: Bewahrt sowohl die Verneinung des Ausgehens beziehungsweise Mangels als auch die umfassende Zeitangabe.
- source_word: ቅድሜከ፡ ይደቁ
  choice: sollen vor dir fallen
  rationale: Die räumliche Wendung und der Fortgang der Segenswünsche werden eng am Ge’ez wiedergegeben.
- source_word: ይሠረዉ፡ ወይትሐጐሉ
  choice: sollen entwurzelt werden und zugrunde gehen
  rationale: Erhält die beiden aufeinanderfolgenden Bilder des Ausrottens und Vergehens, ohne sie zu einem einzigen Ausdruck zu verschmelzen.
- source_word: ወዘይባርከከ
  choice: Und wer dich segnet
  rationale: Das Ge’ez enthält am Versende nur die substantivierte Subjektphrase; ihr Prädikat folgt erst im nächsten Vers.
theological_decisions:
- issue: Unvollständiger Segenssatz am Versende
  choice: Die Satzöffnung „Und wer dich segnet,“ bleibt ohne ergänztes Prädikat stehen.
  alternative: „Und gesegnet sei, wer dich segnet,“
  rationale: Die Alternative würde ein Prädikat vorwegnehmen, das nach der überlieferten Verseinteilung erst in Jubiläen 31,18 steht, und so den Quelltext an dieser Stelle erweitern.
- issue: Zeitliche Reichweite des Segens
  choice: „in alle Ewigkeit“
  alternative: „für alle Zeitalter“
  rationale: Die idiomatische deutsche Wendung vermittelt die umfassende Dauer, ohne eine spezifische eschatologische Zeitalterlehre einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Segensregister. Die parallelen Satzglieder und die genuine syntaktische Spannung am Versübergang bleiben erhalten.
