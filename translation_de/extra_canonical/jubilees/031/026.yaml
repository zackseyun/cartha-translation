base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/031/026.yaml
  text: And in the morning Jacob told his father Isaac the prayer that he had prayed to the Lord[26], and the vision that he had seen, and how he had built an altar, and that everything was prepared for the sacrifice to be offered before the Lord.
translation:
  language: de
  text: Am Morgen erzählte Jakob seinem Vater Isaak von dem Gebet, das er zum Herrn gebetet hatte[a], von der Vision, die er gesehen hatte, davon, wie er einen Altar gebaut hatte, und dass alles bereit war, um das Opfer vor dem Herrn darzubringen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Ge’ez steht hier eine Gebetsformulierung. Der unmittelbare Zusammenhang mit Bethel, Altar und Opfer sowie Isaaks Mahnung, nicht zu zögern, deutet jedoch darauf hin, dass ein Gelübde gemeint sein könnte.
    reason: alternative_reading
lexical_decisions:
- source_word: ጸሎተ፡ ዘጸለየ
  choice: das Gebet, das er … gebetet hatte
  rationale: Die äthiopischen Wörter gehören ausdrücklich zum Wortfeld „beten/Gebet“. Die im Zusammenhang mögliche Bedeutung eines Gelübdes wird daher nicht in den Haupttext eingesetzt, sondern in einer Fußnote genannt.
- source_word: ወሬአየ፡ ዘርእየ
  choice: von der Vision, die er gesehen hatte
  rationale: Die Formulierung bezeichnet hier im Erzählzusammenhang etwas Geschautes; „Vision“ gibt dies verständlich wieder, ohne den Inhalt näher festzulegen.
- source_word: ኀነጸ፡ ምሥዋዐ
  choice: einen Altar gebaut hatte
  rationale: Die Wendung bezeichnet das Errichten eines Altars; „gebaut“ ist im modernen Deutsch natürlich und sachlich genau.
- source_word: ድልው፡ ለመሥዋዕት፡ ለገቢር
  choice: bereit war, um das Opfer … darzubringen
  rationale: Die Zweckkonstruktion wird idiomatisch wiedergegeben und bewahrt den Opferbezug.
theological_decisions:
- issue: Gebet oder Gelübde
  choice: Gebet im Haupttext
  alternative: Gelübde
  rationale: Der überlieferte ge’ezische Wortlaut verwendet Gebetsvokabular. Der Bethel-, Altar- und Opferkontext kann jedoch auf ein Gelübde weisen; diese Spannung bleibt durch die Fußnote sichtbar.
- issue: Bezeichnung Gottes
  choice: Herr
  alternative: Gott
  rationale: እግዚአብሔር wird traditionsgemäß und kontextgerecht mit „Herr“ wiedergegeben, ohne eine weitergehende konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Gebetsformel des Originals bleibt erhalten; die Aufzählung wurde mit natürlichen deutschen Anschlüssen gegliedert. Das am Ende der überlieferten Einheit stehende, syntaktisch nicht weitergeführte በከመ („wie/so wie“) wurde nicht als unvollständiger Anschluss in den Lesetext übernommen.
