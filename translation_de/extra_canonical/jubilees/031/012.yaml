lexical_decisions:
- source_word: ለክልኤሆሙ፡ ኀቡረ
  choice: die beiden zusammen
  rationale: Gibt die duale Bedeutung von ክልኤሆሙ und das gemeinschaftliche ኀቡረ knapp und natürlich wieder; das Fragment setzt den vorhergehenden Satz fort.
- source_word: መንፈሰ፡ ትንቢት
  choice: ein Geist der Weissagung
  rationale: Bewahrt die formale Verbindung von „Geist“ und „Weissagung“, ohne die Wendung als bloße prophetische Eingebung umzudeuten.
- source_word: ወረደ፡ ውስተ፡ አፉሁ
  choice: kam in seinen Mund herab
  rationale: Erhält die konkrete Richtungsbewegung „herabkommen“ und das ungewöhnliche Bild des Mundes aus dem Ge’ez.
- source_word: ወአንዘ፡ ለሌዊ፡ በየማናዊ
  choice: Und er nahm Levi mit seiner rechten Hand
  rationale: Gibt Handlung, Person und rechte Hand direkt und in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Art und Wirken des prophetischen Geistes
  choice: ein Geist der Weissagung kam in seinen Mund herab
  alternative: der Geist der Weissagung erfüllte ihn
  rationale: Der unbestimmte Ausdruck und das körperlich-räumliche Bild der Quelle bleiben erhalten; eine Identifizierung mit einer bestimmten Person oder eine Deutung als inneres Erfülltwerden wird vermieden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Bildsprache „in seinen Mund herab“ wurde wegen ihrer Bedeutung im Ausgangstext nicht geglättet. Der Vers beginnt als Fortsetzung des vorangehenden Satzes bewusst kleingeschrieben.
