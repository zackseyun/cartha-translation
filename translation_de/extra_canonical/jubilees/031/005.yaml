  text: »… und ich ihn sehen darf, bevor ich sterbe.« Und Jakob ging zu seinem Vater Isaak und zu seiner Mutter Rebekka in das Haus seines Vorfahren Abraham[a]. Er nahm zwei seiner Söhne mit, Levi und Juda.
