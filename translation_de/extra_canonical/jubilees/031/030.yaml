  text: 'Und möge er alles, was du tust, und alles, worum du gebetet hast, gelingen lassen.« Dann sagte er zu Rebekka: »Geh mit deinem Sohn Jakob.« Und Rebekka ging mit ihrem Sohn Jakob, und Debora ging mit ihr; und sie gelangten nach …[a]'
