lexical_decisions:
- source_word: ይሥመር (yəśmər)
  choice: möge er … gelingen lassen
  rationale: Gibt den Wunsch nach Erfolg bzw. Gedeihen idiomatisch und zugleich quellennah wieder.
- source_word: ለዘጸለይከ፡ ጸሎተ (la-za-ṣallayka ṣalota)
  choice: worum du im Gebet gebetet hast
  rationale: Bewahrt die im Ge’ez ausdrücklich vorhandene Gebetsformulierung und vermeidet die sachlich nicht gestützte Bedeutung „gelobt“ oder „geschworen“.
- source_word: ወልድኪ (wäldki; im vorgelegten Text offenbar als ወአድኪ überliefert/OCR-erfasst)
  choice: deinem Sohn
  rationale: Das feminine Possessivsuffix passt zur Anrede Rebekkas; die Lesart wird zudem durch die unmittelbar folgende Formulierung „Jakob, ihr Sohn“ bestätigt.
- source_word: ወሖረት፡ ርብቃ (wa-ḥorat Rəbqa)
  choice: Und Rebekka ging
  rationale: Erhält das ausdrücklich genannte Subjekt; ein Zusatz wie „sie stand auf“ ist im vorgelegten Ge’ez-Text nicht vorhanden.
- source_word: ወበጽሑ፡ ውስተ (wa-baṣḥu wəsta)
  choice: und sie gelangten nach …
  rationale: Gibt die Bewegungsformulierung wieder und macht sichtbar, dass der vorgelegte Vers unmittelbar nach der richtungsanzeigenden Präposition abbricht.
theological_decisions:
- issue: Bezug des Segenswunsches
  choice: Das Subjekt bleibt als „er“ wiedergegeben.
  alternative: Explizite Einsetzung von „Gott“
  rationale: Der Ge’ez-Text hat eine Verbform der dritten Person Singular, nennt das Subjekt hier jedoch nicht ausdrücklich; die Übersetzung ergänzt daher keinen Gottesnamen.
- issue: Gebetsformulierung
  choice: „worum du im Gebet gebetet hast“
  alternative: „was du im Gebet gelobt hast“
  rationale: Die Quelle bezeichnet Beten, nicht ein Gelübde; die leichte Wiederholung wahrt den quellensprachlichen Nachdruck.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die quellensprachliche Wiederholung bei „im Gebet gebetet“ bleibt bewusst erhalten. Eigennamen folgen den im Deutschen geläufigen Formen Rebekka, Jakob und Debora; das fragmentarische Versende wird durch Auslassungspunkte und eine Fußnote kenntlich gemacht.
