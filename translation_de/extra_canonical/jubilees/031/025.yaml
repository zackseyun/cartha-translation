  yaml_path: translation/extra_canonical/jubilees/031/025.yaml
  text: And Isaac blessed the God of his father Abraham, who had not withheld his mercy and his righteousness from the son of his servant Isaac.
translation:
  language: de
  text: Und Isaak pries den Gott seines Vaters Abraham, der dem Sohn seines Knechtes Isaak seine Barmherzigkeit und seine Gerechtigkeit nicht vorenthalten hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወባረኮ
  choice: Und Isaak pries
  rationale: Das Verb kann „segnen“ bedeuten; wenn Gott das Objekt ist, gibt „preisen“ den idiomatischen Sinn im Deutschen natürlicher wieder.
- source_word: ምሕረተ
  choice: seine Barmherzigkeit
  rationale: Bewahrt den religiös-ethischen Gehalt des ge'ezischen Begriffs und entspricht dem Zusammenhang.
- source_word: ወጽድቀ
  choice: und seine Gerechtigkeit
  rationale: Gibt den Begriff formal und theologisch offen wieder, ohne ihn enger als „Treue“ oder „Heil“ auszulegen.
- source_word: ዘአኀደገ
  choice: der … nicht vorenthalten hatte
  rationale: Die Negation ist im überlieferten Text beziehungsweise seinem Kontext als „nicht zurückhalten/vorenthalten“ zu verstehen; das Plusquamperfekt macht den Rückbezug im Deutschen klar.
- source_word: እምወልደ፡ ገብሩ፡ ይስሐቅ
  choice: dem Sohn seines Knechtes Isaak
  rationale: 'Folgt der überlieferten syntaktischen Beziehung: Isaak bezeichnet sich gegenüber Gott demütig als dessen Knecht und zugleich als Sohn Abrahams.'
theological_decisions:
- issue: Gott „segnen“ oder „preisen“
  choice: pries den Gott
  alternative: segnete den Gott
  rationale: „Pries“ vermittelt im modernen Deutschen, dass Isaak Gott lobt, ohne den Eindruck zu erzeugen, er verleihe Gott einen Segen.
- issue: Wiedergabe von ጽድቅ
  choice: Gerechtigkeit
  alternative: Treue
  rationale: „Gerechtigkeit“ wahrt die begriffliche und theologische Spannung und legt die Aussage nicht einseitig auf Bundestreue fest.
translation_notes:
  register: Moderne, würdevolle Standardsprache; nahe an der ge'ezischen Satzstruktur, jedoch mit idiomatischem „pries“ für das auf Gott gerichtete Segnen. Keine Fußnoten erforderlich.
