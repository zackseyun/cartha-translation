  yaml_path: translation/extra_canonical/jubilees/031/016.yaml
  text: that they may bless all the seed of the beloved. Your mother called your name Levi, and truly did she call your name. You shall be joined to the Lord and be the companion of all the sons of Jacob. Let his table be yours, and you and your sons shall eat from it. And your table shall be full for all generations,
translation:
  language: de
  text: Gott wird es ihnen in den Mund legen, damit sie die ganze Nachkommenschaft des Geliebten segnen. Deine Mutter gab dir den Namen Levi, und wahrhaftig gab sie dir diesen Namen.[a] Du wirst mit dem Herrn verbunden sein und der Gefährte aller Söhne Jakobs. Sein Tisch soll dir gehören, und du und deine Söhne sollen davon essen. Und dein Tisch soll für alle Generationen reich gedeckt sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Deine Mutter nannte deinen Namen Levi, und wahrhaftig nannte sie deinen Namen.«'
    reason: Die Wiederholung der Namensformel und ihr möglicher Wortanklang an das folgende »verbunden« werden im flüssigen Haupttext leicht geglättet.
  - marker: b
    text: 'Wörtlicher: »Und dein Tisch soll für alle Generationen voll sein.«'
    reason: Dokumentiert die konkrete Ausdrucksweise hinter der idiomatischen Wiedergabe »reich gedeckt«.
lexical_decisions:
- source_word: ይትወሀብ፡ ውስተ፡ አፉሆሙ
  choice: wird es ihnen in den Mund legen
  rationale: Gibt die idiomatische Wendung natürlich wieder; Gott ist das ausdrücklich genannte Subjekt.
- source_word: ኵሎ፡ ዘርአ፡ ለፍቅር
  choice: die ganze Nachkommenschaft des Geliebten
  rationale: ዘርእ bezeichnet hier kollektiv die Nachkommenschaft; »des Geliebten« bewahrt die substantivierte Bezeichnung ohne Identifizierung.
- source_word: እምከ፡ ስመከ፡ ሌዊን
  choice: Deine Mutter gab dir den Namen Levi
  rationale: Bewahrt die Mutter als ausdrückliches Subjekt und formuliert die Namensgebung in natürlichem Deutsch.
- source_word: በአማን
  choice: wahrhaftig
  rationale: Bewahrt die Bekräftigung stärker und genauer als bloßes »zu Recht«.
- source_word: አጸቶ፡ ለእግዚአብሔር
  choice: mit dem Herrn verbunden
  rationale: Erhält das Motiv des Verbundenseins und damit den möglichen Anklang an den Namen Levi.
- source_word: ሱታፌ
  choice: Gefährte
  rationale: Bezeichnet Teilhabe beziehungsweise Gemeinschaft, ohne das Verhältnis dogmatisch näher festzulegen.
- source_word: ማእዳ
  choice: Tisch
  rationale: Die konkrete Tischmetapher bleibt erhalten.
- source_word: ትምላእ
  choice: reich gedeckt sein
  rationale: Gibt das Vollsein eines Tisches idiomatisch als reichliche Versorgung wieder.
theological_decisions:
- issue: Identität des »Geliebten«
  choice: des Geliebten
  alternative: eines konkret benannten Patriarchen
  rationale: Der Text verwendet einen Titel; eine nicht ausdrücklich genannte Identität wird nicht in den Haupttext eingetragen.
- issue: Verbundensein Levis mit dem Herrn
  choice: mit dem Herrn verbunden sein
  alternative: dem Herrn als Priester angehören
  rationale: Die Übersetzung bewahrt die Aussage und das Namensmotiv, ohne eine weitergehende kultische Deutung ausdrücklich einzufügen.
- issue: Bezug von »sein Tisch«
  choice: Sein Tisch
  alternative: der Tisch des Herrn / Jakobs Tisch
  rationale: Der pronominale Bezug bleibt wie in der Vorlage offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Rede bleibt direkt und feierlich; semitische Wiederholungen werden maßvoll geglättet, während Mehrdeutigkeiten wie »der Geliebte« und »sein Tisch« erhalten bleiben.
