  text: And he went up on the new moon of the seventh month, to Bethel. And he built an altar in the place where he had lodged, and he set up there a pillar, and he sent to his father Isaac that he should come to him.
translation:
  language: de
  text: Und am Neumond des siebten Monats zog er nach Bethel hinauf. Dort baute er an dem Ort, an dem er übernachtet hatte, einen Altar und richtete eine Steinsäule auf. Dann ließ er seinem Vater Isaak ausrichten, er solle zu ihm kommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሠርቀ፡ ወርኅ፡ ሳብዕ (śarqa warḫ sābʿ)
  choice: am Neumond des siebten Monats
  rationale: Die Wortfolge bezeichnet den Neumond beziehungsweise den Beginn des siebten Monats; ein Wort für „Jahr“ steht im Ausgangstext nicht.
- source_word: ዐርገ (ʿarga)
  choice: zog … hinauf
  rationale: Gibt die räumliche Aufwärtsbewegung wieder und klingt im Deutschen bei einer Reise zu einem Ort natürlich.
- source_word: ኖመ (noma)
  choice: übernachtet hatte
  rationale: Das Verb bezeichnet hier das Verbringen der Nacht beziehungsweise das Lagern an einem Ort.
- source_word: ሐውልተ (ḥāwəlt)
  choice: Gedenkstein
  rationale: Bezeichnet einen aufgerichteten Stein beziehungsweise eine Steinsäule; „Gedenkstein“ ist im erzählerischen Zusammenhang verständlich, ohne eine figürliche Statue nahezulegen.
- source_word: ፈነወ፡ ኀበ፡ አቡሁ (fanawa ḫaba ʾabuhu)
  choice: ließ er seinem Vater … ausrichten
  rationale: Die idiomatische deutsche Wiedergabe bewahrt den Sinn des Sendens einer Nachricht oder eines Boten zum Vater.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. Das im Altäthiopischen wiederaufnehmende Ortsadverb in der Wendung „an dem Ort, wo … dort“ wird nicht mechanisch verdoppelt; „Dort“ am Beginn des Folgesatzes erhält jedoch die örtliche Betonung. Keine konfessionell geprägte Terminologie.
