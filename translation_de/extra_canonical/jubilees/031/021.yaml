  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምድር
  choice: von der Erde
  rationale: Gibt die Präposition እም („von/aus“) und ድር („Erde“) knapp und formal wieder; der Vers setzt hier einen Satz aus dem vorherigen Kontext fort.
- source_word: ወይኩኑ፡ ርጉማነ
  choice: und sie sollen verflucht sein
  rationale: Bewahrt den pluralischen Jussiv bzw. Zukunftssinn von ይኩኑ und das pluralische Prädikat ርጉማነ.
- source_word: ወተመይጠ
  choice: Da wandte er sich um
  rationale: Das Verb bezeichnet ein Sich-Wenden bzw. Zurückwenden; die deutsche Form bleibt ohne ergänztes Ziel natürlich.
- source_word: ሰዐሞ፡ ዳግመ
  choice: küsste ihn noch einmal
  rationale: ሰዐሞ bedeutet „er küsste ihn“, ዳግመ „wieder/noch einmal“.
- source_word: ወሐቀፎ
  choice: und umarmte ihn
  rationale: Direkte Wiedergabe des Verbs mit pronominalem Objekt.
- source_word: ወተፈሥሐ፡ ዐቢየ
  choice: Und er freute sich sehr
  rationale: Die idiomatische deutsche Gradangabe „sehr“ gibt das adverbial gebrauchte „groß“ natürlich wieder.
- source_word: እስመ
  choice: weil
  rationale: Die Kausalkonjunktion eröffnet einen im nächsten Vers fortgesetzten Nebensatz.
