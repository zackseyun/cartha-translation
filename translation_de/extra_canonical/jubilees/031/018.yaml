  text: and cursed be every people that curses you.” And to Judah he said, “May the Lord give you strength and power, so that you may tread down all who hate you. Be a ruler, you and one of your sons, over the sons of Jacob. May your name and the name of your sons go about and travel through all the earth and its regions. Then nations shall fear before your face,”
translation:
  language: de
  text: '„Und verflucht sei jedes Volk, das dich verflucht.“ Und zu Juda sagte er: „Der Herr gebe dir Kraft und Stärke, damit du alle niedertrittst, die dich hassen. Sei Herrscher über die Söhne Jakobs, du und einer deiner Söhne. Dein Name und der Name deiner Söhne sollen durch die ganze Erde und ihre Länder ziehen und umherwandern. Dann werden sich die Völker vor dir fürchten,“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሕዝብ
  choice: Volk
  rationale: Die Einzahl bezeichnet hier ein Volk beziehungsweise eine Volksgemeinschaft; „Volk“ entspricht dem Ausgangstext genauer als „Nation“.
- source_word: ኀይለ፡ ወጽንዐ
  choice: Kraft und Stärke
  rationale: Die koordinierte Wortpaarung des Ausgangstextes wird bewahrt, ohne die beiden eng verwandten Begriffe zu verschmelzen.
- source_word: ትኪዶሙ
  choice: du ... niedertrittst
  rationale: Das konkrete Bild des Niedertretens wird erhalten; der mit ከመ eingeleitete Zweck wird durch „damit“ ausgedrückt.
- source_word: መኰንነ
  choice: Herrscher
  rationale: Das Wort bezeichnet einen Regierenden oder Machthaber; „Herrscher“ passt zum königlichen Segenskontext, ohne einen spezifischen Amtstitel hinzuzufügen.
- source_word: ዘየሐውር፡ ወዘያንሶሱ
  choice: ziehen und umherwandern
  rationale: Die beiden Bewegungsverben werden als Paar wiedergegeben und nicht deutend zu „bekannt werden“ oder „sich verbreiten“ umgeformt.
- source_word: አህጉር
  choice: Länder
  rationale: Im Zusammenhang mit der ganzen Erde bezeichnet der Plural deren Länder beziehungsweise Regionen; „Länder“ ist im modernen Deutsch natürlich.
- source_word: አሕዛብ
  choice: Völker
  rationale: Der Plural bezeichnet hier die fremden Völker; „Völker“ bewahrt den kollektiven Sinn ohne eine konfessionell geprägte Wiedergabe wie „Heiden“.
theological_decisions:
- issue: Gemeinsame Herrschaft Judas und eines seiner Söhne
  choice: „Sei Herrscher ..., du und einer deiner Söhne“
  alternative: „Du und einer deiner Söhne, seid Herrscher ...“
  rationale: Die gewählte Fassung bewahrt den an Juda gerichteten Singularimperativ und zugleich die spannungsvolle Einbeziehung eines seiner Söhne, ohne die Aussage auf eine bestimmte messianische Deutung festzulegen.
- issue: Der wandernde Name
  choice: Das Bewegungsbild wird wörtlich auf Judas Namen und den Namen seiner Söhne bezogen.
  alternative: „Euer Ruhm soll sich ... verbreiten“
  rationale: Der Ausgangstext spricht ausdrücklich vom Namen und verwendet zwei Bewegungsverben. Eine Deutung als Ruhm wäre plausibel, würde das Bild jedoch stärker auslegen als übersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Segensformeln bleiben gehoben, aber verständlich. Das abschließende Komma innerhalb der Rede zeigt, dass der Satz beziehungsweise der Segen im folgenden Vers weitergeht.
