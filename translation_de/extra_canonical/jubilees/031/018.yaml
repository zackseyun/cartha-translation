  source_fidelity: 'Die Übersetzung gibt die im vorliegenden Versabschnitt belegten Aussagen präzise wieder: ሕዝብ/አሕዛብ als „Volk/Völker“, das Begriffspaar „Kraft und Stärke“, den mit ከመ ausgedrückten Zweck, das Bild des Niedertretens, die Herrschaft über Jakobs Söhne sowie die beiden Bewegungsverben beim Namen. „vor dir“ gibt die Wendung „vor deinem Angesicht“ idiomatisch und treffend wieder. Das isoliert am Beginn des Editionsausschnitts stehende ቡሩክ („gesegnet“) ist angesichts des überlieferten Satzanschlusses und der englischen Audit-Fassung offenbar dem vorausgehenden Kontext zuzurechnen; eine Ergänzung im deutschen Vers wäre daher nicht sicher.'
