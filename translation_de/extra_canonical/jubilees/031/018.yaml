  terminology: „Herrscher“, „Kraft und Stärke“, „Volk/Völker“ und „der Herr“ sind sachlich, registergerecht und nicht konfessionell verengt. Die Formulierung zur gemeinsamen Herrschaft Judas und eines Sohnes erhält die syntaktische Spannung des Ausgangstextes, ohne sie dogmatisch aufzulösen.
