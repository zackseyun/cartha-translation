  text: And Jacob went in to Isaac his father, into the room where he was lying, and his two children were with him. And he took the hand of his father, and he bent down and kissed him. And Isaac clung to
translation:
  language: de
  text: Und Jakob ging zu seinem Vater Isaak hinein, in das Gemach, in dem er lag[a]; Jakobs beide Söhne waren bei ihm. Er nahm die Hand seines Vaters, beugte sich nieder und küsste ihn. Und Isaak klammerte sich an …
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in dem er dort lag“.'
    reason: Das Ge’ez enthält neben dem Relativausdruck „in dem/wo“ zusätzlich das rückverweisende „dort“; im Deutschen wäre beides zusammen unnötig schwerfällig.
lexical_decisions:
- source_word: ጽርሕ
  choice: Gemach
  rationale: Bezeichnet hier den inneren Raum beziehungsweise das Zimmer, in dem Isaak lag; „Gemach“ wahrt den würdigen Erzählton, ohne unverständlich zu sein.
- source_word: አንዘ፡ እዴ፡ አቡሁ
  choice: Er nahm die Hand seines Vaters
  rationale: Die überlieferte Formulierung ist knapp und textlich schwierig. Im Zusammenhang bezeichnet sie am ehesten das Ergreifen beziehungsweise Halten der Hand des Vaters; diese Wiedergabe folgt dem Sinn, ohne eine zusätzliche Handlung einzuführen.
- source_word: ወደነነ፡ ሰዐሞ
  choice: beugte sich nieder und küsste ihn
  rationale: Gibt die aufeinanderfolgenden Handlungen direkt und natürlich wieder.
- source_word: ወተሰቅለ
  choice: klammerte sich an
  rationale: Das Verb schildert hier, dass Isaak sich an jemanden hängt beziehungsweise ihn fest umschließt. Wegen des abgebrochenen Ausgangstextes bleibt das Bezugswort offen.
theological_decisions:
- issue: Unvollständiger Schluss des überlieferten Ausschnitts
  choice: „Und Isaak klammerte sich an …“
  alternative: Den aus dem weiteren Überlieferungskontext bekannten Satz eigenständig vervollständigen
  rationale: Der vorgelegte ge’ezische Text bricht nach der Präposition ውስተ ab. Die Übersetzung ergänzt daher kein im Ausschnitt fehlendes Bezugswort und bewahrt die tatsächliche Textlage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt quellennah, wird aber idiomatisch gegliedert. Das am Anfang des bereitgestellten Ausschnitts stehende በዲበ፡ ምድር („auf der Erde“) wurde als Schlussrest des vorausgehenden Verses behandelt, entsprechend der Versabgrenzung der geprüften Konsultationsfassung. Der abgebrochene Schluss wurde sichtbar offengelassen.
