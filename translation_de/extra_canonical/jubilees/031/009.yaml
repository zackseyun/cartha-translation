  text: He embraced the neck of Jacob his son and wept upon his neck. And the dimness passed from Isaac’s eyes, and he saw the two sons of Jacob, Levi and Judah, and he said, “Are these your sons, my son?”
translation:
  language: de
  text: 'Er umarmte seinen Sohn Jakob um den Hals[a] und weinte an seinem Hals. Da wich die Trübung von Isaaks Augen, und er sah die beiden Söhne Jakobs, Levi und Juda. Er fragte: »Sind das deine Söhne, mein Sohn?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »den Hals seines Sohnes Jakob«; das Verb »umarmen« ist sinngemäß ergänzt.'
    reason: Der überlieferte Versanfang nennt ausdrücklich den Hals, lässt aber in der vorliegenden Form das Verb unausgesprochen. Die Fußnote bewahrt diese textliche Eigentümlichkeit.
lexical_decisions:
- source_word: ክሳደ፡ ያዕቆብ፡ ወልዱ፡
  choice: seinen Sohn Jakob um den Hals
  rationale: ክሳድ bezeichnet ausdrücklich den Hals/Nacken. Die deutsche Wendung „jemanden um den Hals umarmen“ bewahrt dieses Glied des Ausgangstextes und klingt natürlich; das Verb „umarmen“ ist aus dem satzübergreifenden Zusammenhang ergänzt.
- source_word: ወበከየ፡ ዲበ፡ ክሳዱ፡
  choice: und weinte an seinem Hals
  rationale: Gibt die Präposition ዲበ („auf/an“) und das wiederholte ክሳድ wieder, ohne die körperliche Bildsprache zu glätten.
- source_word: ወጽላሌ፡ ኀለፈ፡ እምአዕይንተ፡ ይስሐቅ፡
  choice: Da wich die Trübung von Isaaks Augen
  rationale: „Trübung“ gibt den Zustand eingeschränkter Sicht idiomatisch wieder; „wich von“ entspricht der Bewegung des Vergehens bzw. Entfernens.
- source_word: ወርእየ፡ ክልኤሆሙ፡ ውሉደ፡ ለያዕቆብ፡ ሌዊሃ፡ ወይሁዳሃ፡
  choice: und er sah die beiden Söhne Jakobs, Levi und Juda
  rationale: Bewahrt Zahl, Verwandtschaftsangabe und die namentliche Apposition des ge'ezischen Textes.
- source_word: ወይቤ፡ ውሉድከሁ፡ እሉ፡ ወልድየ፡
  choice: 'Er fragte: »Sind das deine Söhne, mein Sohn?«'
  rationale: Das wörtliche „und er sagte“ leitet hier eine Frage ein; „er fragte“ ist im modernen Deutsch die natürliche funktionale Wiedergabe, während Anrede und Fragegehalt erhalten bleiben.
