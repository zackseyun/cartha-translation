  text: in that you have seen me alive, and I also have seen you, my son. Prosper and fulfill the vow that you have vowed, and do not delay your vow, for you will be called to account concerning the vow, and now hasten to perform it.
translation:
  language: de
  text: 'Da du mich lebend gesehen hast und auch ich dich gesehen habe, mein Sohn: Hab Erfolg und erfülle das Gelübde, das du abgelegt hast. Schiebe dein Gelübde nicht auf, denn wegen des Gelübdes wirst du zur Rechenschaft gezogen werden. Nun beeile dich, es zu erfüllen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እንተ፡ ባቲ፡
  choice: Da
  rationale: Die Wendung fungiert hier kausal bzw. begründend („da/weil“) und bezeichnet nicht einen ergänzten „Tag“.
- source_word: ተስፋሕ፡
  choice: Hab Erfolg
  rationale: Gibt den prosperativen Imperativ natürlich wieder, ohne einen spezifisch materiellen Wohlstand einzutragen.
- source_word: ጸሎተ፡ / ጸሎተከ፡
  choice: Gelübde / dein Gelübde
  rationale: Im Zusammenhang mit „ablegen“, „aufschieben“ und „erfüllen“ bezeichnet das Wort hier ein Gelübde, nicht allgemein ein Gebet.
- source_word: ትትኀሠሥ፡
  choice: wirst du zur Rechenschaft gezogen werden
  rationale: Die wörtliche Vorstellung des Gesucht- oder Aufgesuchtwerdens meint im Kontext, dass die Erfüllung eingefordert und verantwortet wird.
- source_word: ጕጕአ፡ ትግበራ፡
  choice: beeile dich, es zu erfüllen
  rationale: Bewahrt sowohl die Aufforderung zur Eile als auch den Vollzug des Gelübdes in idiomatischem Deutsch.
theological_decisions:
- issue: Verbindlichkeit eines Gelübdes
  choice: „wirst du zur Rechenschaft gezogen werden“
  alternative: „wirst du wegen des Gelübdes aufgesucht werden“
  rationale: Die gewählte Formulierung macht die Rechenschaftspflicht verständlich, ohne festzulegen, wer sie einfordert oder auf welche Weise dies geschieht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Nennung des Gelübdes bleibt erhalten; der letzte Bezug wird zur Vermeidung schwerfälliger Wiederholung mit „es“ aufgenommen. Keine Fußnote zur früheren Ergänzung „der Tag, an dem“, da diese im gegebenen Kontext keine tragfähige Entsprechung im geʿezischen Text hat.
