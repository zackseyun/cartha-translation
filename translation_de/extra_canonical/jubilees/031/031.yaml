- from: 'Bethel. Jakob erinnerte sich an das Gebet, mit dem sein Vater Levi und Juda gesegnet hatte. Er freute sich und pries den Gott seiner Väter Abraham und Isaak. Er sagte: »Jetzt weiß ich, dass ich und auch meine Kinder vor dem Gott aller Dinge eine ewige Hoffnung haben.« So war es für die beiden bestimmt, und es sollte ihnen als ewiges Zeugnis auf den Himmelstafeln eingetragen werden,[a] so wie Isaak sie gesegnet hatte.'
  to: 'Bethel. Jakob erinnerte sich an das Gebet, mit dem sein Vater Levi und Juda gesegnet hatte. Er freute sich und pries den Gott seiner Väter, Abraham und Isaak. Er sagte: »Jetzt weiß ich, dass ich und auch meine Kinder vor dem Gott von allem eine ewige Hoffnung haben.« So war es in Bezug auf die beiden festgesetzt, und man wird für sie ein ewiges Zeugnis auf den himmlischen Tafeln verzeichnen,[a] wie Isaak sie gesegnet hatte.'
  rationale: Die Revision beschränkt sich auf die sichere Korrektur der Diathese und Modalität bei der Verzeichnung auf den himmlischen Tafeln sowie auf die dazugehörige Fußnote. Die durch den positionsbezogenen Quellenausschnitt nur teilweise sichtbare vorausgehende Satzstruktur bleibt entsprechend dem englischen Audit erhalten. Der im gelieferten geʿezischen Text nicht vorhandene Zusatz „gerecht“ wird weder ergänzt noch als stillschweigende Lesart behandelt.
