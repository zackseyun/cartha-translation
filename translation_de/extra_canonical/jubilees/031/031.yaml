  text: Bethel. And Jacob remembered the prayer with which his father had blessed Levi and Judah, and he rejoiced and blessed the God of his fathers Abraham and Isaac. And he said, “Now I know that I have an everlasting hope, and my children also, before the God of all.” And thus it was ordained concerning the two of them, and it was recorded for them as an everlasting, righteous testimony on the heavenly tablets, just as Isaac blessed them.
translation:
  language: de
  text: 'Bethel. Jakob erinnerte sich an das Gebet, mit dem sein Vater Levi und Juda gesegnet hatte. Er freute sich und pries den Gott seiner Väter, Abraham und Isaak. Er sagte: »Jetzt weiß ich, dass ich und auch meine Kinder vor dem Gott von allem eine ewige Hoffnung haben.« So war es in Bezug auf die beiden festgesetzt, und man wird für sie ein ewiges Zeugnis auf den himmlischen Tafeln verzeichnen,[a] wie Isaak sie gesegnet hatte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »und sie werden für sie ein ewiges Zeugnis auf die Himmelstafeln hinaufbringen«. Das handelnde Subjekt bleibt im geʿezischen Wortlaut ungenannt.'
    reason: Macht die aktive pluralische Verbform und die wörtliche Bildsprache sichtbar, ohne ein bestimmtes handelndes Subjekt festzulegen.
lexical_decisions:
- source_word: ተፈሥሐ
  choice: freute sich
  rationale: Gibt die Freude des Subjekts schlicht und idiomatisch wieder.
- source_word: ባረኮ፡ ለአምላከ
  choice: pries den Gott
  rationale: Das Verb bezeichnet hier einen an Gott gerichteten Segen beziehungsweise Lobpreis; „pries“ ist im modernen Deutschen natürlich.
- source_word: ተስፋ፡ ዘለዓለም
  choice: ewige Hoffnung
  rationale: Entspricht unmittelbar „Hoffnung auf ewig“ und bewahrt den eschatologisch offenen Ausdruck.
- source_word: አምላከ፡ ኵሉ
  choice: Gott aller Dinge
  rationale: Bewahrt den umfassenden Genitiv, ohne ihn enger als „Gott aller Menschen“ auszulegen.
- source_word: ሥሩዕ
  choice: bestimmt
  rationale: Gibt die Bedeutung „festgesetzt/angeordnet“ wieder, ohne eine bestimmte Instanz ausdrücklich einzusetzen.
- source_word: በስምዕ፡ ዘለዓለም
  choice: als ewiges Zeugnis
  rationale: Der vorgelegte ge’ezische Wortlaut enthält „Zeugnis“ und „ewig“, jedoch an dieser Stelle kein ausdrückliches Wort für „gerecht“ oder „Gerechtigkeit“.
- source_word: ወያዐርጉ
  choice: es sollte … eingetragen werden
  rationale: Der ge’ezische Ausdruck hat wörtlich die Vorstellung des Hinaufbringens; im Zusammenhang mit den Himmelstafeln vermittelt „eingetragen“ den gemeinten Vorgang, während die Fußnote die Form des Ausgangstextes sichtbar hält.
theological_decisions:
- issue: Träger der ewigen Hoffnung
  choice: „ich und auch meine Kinder … eine ewige Hoffnung haben“
  alternative: „bei mir ist eine ewige Hoffnung, und auch bei meinen Kindern“
  rationale: Die natürliche deutsche Form bewahrt, dass sowohl Jakob als auch seine Nachkommen in die Aussage einbezogen sind, ohne die Art der Hoffnung dogmatisch näher zu bestimmen.
- issue: Zeugnis auf den Himmelstafeln
  choice: „als ewiges Zeugnis“
  alternative: „als ewiges, gerechtes Zeugnis“
  rationale: Im tatsächlich vorgelegten ge’ezischen Text steht kein sichtbares Äquivalent für „gerecht“. Die in der Revisionsnotiz genannte längere Lesart wird daher nicht stillschweigend in den Haupttext aufgenommen.
- issue: Passivische Wiedergabe der Eintragung
  choice: „es sollte ihnen … eingetragen werden“
  alternative: „sie werden … hinaufbringen“ beziehungsweise „sie werden hinaufgebracht“
  rationale: Das Subjekt beziehungsweise die Diathese der ge’ezischen Form ist gegenüber der englischen Konsultationsfassung nicht völlig deckungsgleich. Die Übersetzung folgt dem Zusammenhang, die wörtlichere Möglichkeit wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Der Beginn „Bethel. Jakob erinnerte sich … Levi und Juda“ wird aus der auditierten englischen Zuordnung beibehalten, da die vorgelegte positionsbezogene ge’ezische Zeile erst mit dem Satzende „… und Juda“ einsetzt. Der unmittelbar vorhandene ge’ezische Text bestimmt jedoch Wortwahl und Sinn des restlichen Verses; insbesondere wird das im vorgelegten Wortlaut fehlende Adjektiv „gerecht“ nicht ergänzt.
