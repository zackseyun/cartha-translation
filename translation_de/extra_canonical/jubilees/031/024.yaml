  text: 'And it was reckoned to him as righteousness. And Jacob told his father during the night everything: how the Lord had shown him great mercy, and how he had made all his ways prosper and had protected him from everything.'
translation:
  language: de
  text: 'Und es wurde ihm als Gerechtigkeit angerechnet.[a] Jakob erzählte seinem Vater in der Nacht alles: wie der Herr ihm große Barmherzigkeit erwiesen,[b] alle seine Wege gelingen lassen und ihn vor allem bewahrt hatte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die angegebene geʿezische Textform kann wörtlich auch bedeuten: „Und die Gerechtigkeit ging auf ihn über.“ Wahrscheinlich ist jedoch „wurde angerechnet“ zu lesen; die Wendung entspricht dem biblischen Ausdruck „als Gerechtigkeit angerechnet“.'
    reason: Textkritische Unsicherheit zwischen der vorgelegten Form ተኀለፈ und der wahrscheinlich beabsichtigten Lesung ተኈለቈ.
  - marker: b
    text: 'Oder näher an der Satzfolge: „alles – wie der Herr ihm große Barmherzigkeit erwiesen hatte“.'
    reason: Macht die mögliche engere Verbindung von ኵሎ mit dem folgenden ዘከመ-Satz sichtbar, ohne eine im Deutschen missverständliche Konstruktion zu erzeugen.
lexical_decisions:
- source_word: ወተኀለፈ፡ ሎቱ፡ ጽድቀ
  choice: Und es wurde ihm als Gerechtigkeit angerechnet
  rationale: Die Wendung wird als der biblische Anrechnungsidiom verstanden; die überlieferte Zeichenfolge ተኀለፈ dürfte hier eine fehlerhafte Lesung bzw. Wiedergabe von ተኈለቈ („wurde angerechnet“) sein. Die gedruckte Form wird wegen der tatsächlichen Quellenangabe in einer Fußnote dokumentiert.
- source_word: በሌሊት
  choice: in der Nacht
  rationale: Direkte und natürliche Wiedergabe der Zeitangabe.
- source_word: እግዚአ ብሔር
  choice: der Herr
  rationale: Entspricht der üblichen Bedeutung des äthiopischen Gottesprädikats und vermeidet die allgemeinere Wiedergabe „Gott“.
- source_word: ገብረ፡ ... ሣህለ፡ ዐቢየ
  choice: ihm große Barmherzigkeit erwiesen
  rationale: Gibt die idiomatische Verbindung von „tun/erweisen“ und „großer Barmherzigkeit“ in natürlichem Deutsch wieder.
- source_word: ሠርሖ፡ ኵሎ፡ ፍኖቲሁ
  choice: alle seine Wege gelingen lassen
  rationale: Bewahrt das Bild der „Wege“, während das kausative Gelingen in verständlichem Deutsch ausgedrückt wird.
- source_word: ወተማኅፀኖ፡ እምኵሉ
  choice: und ihn vor allem bewahrt hatte
  rationale: Übersetzt እምኵሉ ohne den im Ausgangstext nicht ausdrücklich vorhandenen Zusatz „Bösen“ oder „Unheil“.
theological_decisions:
- issue: Anrechnung als Gerechtigkeit oder Übergang der Gerechtigkeit
  choice: Es wurde ihm als Gerechtigkeit angerechnet
  alternative: Die Gerechtigkeit ging auf ihn über
  rationale: Der wahrscheinlich korrekte Wortlaut trägt den bekannten biblischen Anrechnungsidiom. Da die angegebene Form wörtlich eher „ging vorüber/über“ nahelegt, bleibt diese echte textkritische Spannung in der Fußnote sichtbar.
- issue: Gegenstand der Bewahrung
  choice: vor allem
  alternative: vor allem Bösen
  rationale: Der geʿezische Text sagt lediglich „von/vor allem“. Ein moralisch oder kosmisch bestimmtes „Böses“ wird daher nicht in den Haupttext eingeführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Haupttext ist flüssig und gut vorlesbar; textkritische und syntaktische Mehrdeutigkeiten werden nicht verdeckt, sondern knapp in den Fußnoten ausgewiesen.
