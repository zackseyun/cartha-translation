base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/031/020.yaml
  text: and in you shall the salvation of Israel be found. And on the day you sit on the throne of the glory of your righteousness[20], there shall be great peace for all the seed of the sons of the beloved. Blessed be the one who blesses you, and all who hate you and afflict you, and those who curse you, shall be rooted out and destroyed.
translation:
  language: de
  text: Und in dir wird Israels Rettung zu finden sein. Und an dem Tag, an dem du auf dem Thron der Herrlichkeit deiner Gerechtigkeit sitzt,[a] wird für die ganze Nachkommenschaft der Söhne des Geliebten großer Friede sein. Gesegnet ist, wer dich segnet; doch alle, die dich hassen und bedrängen, und auch die, die dich verfluchen, werden ausgerottet und vernichtet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die dichte Wendung kann auch kompakter verstanden werden: „auf dem herrlichen Thron deiner Gerechtigkeit“.'
    reason: segmentation_note
lexical_decisions:
- source_word: መድኃኒተ፡ እስራኤል
  choice: Israels Rettung
  rationale: መድኃኒት bezeichnet hier Rettung bzw. Heil; „Rettung“ ist im modernen Deutsch klar und wahrt den Aussagegehalt.
- source_word: ክብር፡ ጽድቅከ
  choice: die Herrlichkeit deiner Gerechtigkeit
  rationale: Die Genitivfolge wird formal bewahrt; ክብር wird mit „Herrlichkeit“ und ጽድቅ mit „Gerechtigkeit“ wiedergegeben.
- source_word: ዐቢይ፡ ሰላም
  choice: großer Friede
  rationale: Direkte und idiomatische Wiedergabe der Verbindung aus „groß“ und „Friede“.
- source_word: ዘርአ፡ ውሉዱ፡ ለፍቅር
  choice: die ganze Nachkommenschaft der Söhne des Geliebten
  rationale: ዘርእ wird kollektiv als „Nachkommenschaft“ wiedergegeben; ውሉዱ als „Söhne“ und ለፍቅር gemäß der überprüften Lesart als „des Geliebten“, nicht als „für immer“.
- source_word: ይሠረዉ፡ ወይትሐጐሉ
  choice: werden ausgerottet und vernichtet werden
  rationale: Die beiden koordinierten Vernichtungsverben werden deutlich unterschieden und in ihrer starken Aussage bewahrt.
theological_decisions:
- issue: Bezug und Gestalt der Thronformulierung
  choice: auf dem Thron der Herrlichkeit deiner Gerechtigkeit
  alternative: auf dem herrlichen Thron deiner Gerechtigkeit
  rationale: Die gewählte Fassung erhält die dichte Genitivstruktur und legt ክብር nicht stillschweigend attributiv als „herrlich“ aus.
- issue: Identität des „Geliebten“
  choice: des Geliebten
  alternative: seiner Söhne für immer
  rationale: Die Bezeichnung bleibt substantiviert und ohne zusätzliche Identifizierung stehen; die Alternative „für immer“ ist lexikalisch nicht durch ለፍቅር gedeckt.
- issue: Zeitangabe beim Sitzen auf dem Thron
  choice: an dem Tag, an dem du … sitzt
  alternative: wenn du … sitzt
  rationale: Die ausdrückliche Erwähnung von ዕለት („Tag“) wird bewahrt, ohne den eschatologischen oder historischen Zeitpunkt näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt quellennah, wird jedoch durch idiomatische Anschlüsse und klare Zeichensetzung für heutige Leser verständlich gemacht.
