  to: und deine Kinder durch alle Zeitalter hindurch. Der Herr gebe dir und deinen Nachkommen großes Verständnis[a] zur Ehre. Er bringe dich und deine Nachkommen aus allem Fleisch sich nahe, damit ihr in seinem Heiligtum Dienst tut wie die Engel der Gegenwart und wie die Heiligen. Wie sie, so sollen die Nachkommen deiner Kinder zur Ehre und Größe werden.
