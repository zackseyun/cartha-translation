  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente des ge''ezischen Textes zutreffend wieder: die Nachkommen, das große Verständnis, die Erwählung aus allem Fleisch, den Dienst im Heiligtum sowie den Vergleich mit den Engeln der Gegenwart und den Heiligen. „Ihm nahebringen“ bildet den Bezug auf Gott expliziter und genauer ab als „in seine Nähe bringen“. Die Schlusskonstruktion braucht im Deutschen eine kleine Umformung, ohne den Vergleich zu interpretieren.'
  naturalness: Der Anschluss am Versbeginn und der würdige Registerton sind gelungen. „Wie sie sollen die Nachkommen deiner Kinder sein“ ist jedoch im modernen Standarddeutsch nicht idiomatisch. „Wie sie, so sollen … werden“ bewahrt die Struktur und ist klar verständlich. Auch „Dienst tun“ ist im Heiligtumskontext natürlicher als das hier etwas unbestimmte „dienen“.
  terminology: „großes Verständnis“, „Nachkommen“, „Engel der Gegenwart“ und „die Heiligen“ sind angemessen. Die Fußnotenalternative „große Herzensweite“ ist keine hinreichend genaue Alternative für die angegebene wörtlich-etymologische Deutung; „Größe des Herzens“ genügt und vermeidet eine zusätzliche deutsche Deutung.
