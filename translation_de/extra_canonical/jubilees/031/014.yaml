  yaml_path: translation/extra_canonical/jubilees/031/014.yaml
  text: and your children throughout all the ages. And may the Lord give to you and to your seed great understanding for glory. And may he bring you and your seed near to him from among all flesh, to minister in his sanctuary like the angels of the presence and like the holy ones. As they are, so shall the seed of your children be for glory and greatness
translation:
  language: de
  text: und deine Kinder durch alle Zeitalter hindurch. Der Herr gebe dir und deinen Nachkommen großes Verständnis[a] zur Ehre. Er bringe dich und deine Nachkommen aus allem Fleisch sich nahe, damit ihr in seinem Heiligtum Dienst tut wie die Engel der Gegenwart und wie die Heiligen. Wie sie, so sollen die Nachkommen deiner Kinder zur Ehre und Größe werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, der Wortbildung nach: „Größe des Herzens“.'
    reason: Die überlieferte Form bedeutet vornehmlich „Verständnis“ oder „Einsicht“, ist aber vom Wort für „Herz“ abgeleitet.
lexical_decisions:
- source_word: ልባዌ (ləbbāwē)
  choice: Verständnis
  rationale: Das abgeleitete Substantiv bezeichnet Verständnis, Einsicht oder Erkenntnis; eine rein etymologische Wiedergabe mit „Herz“ würde seine konkrete lexikalische Bedeutung abschwächen.
- source_word: ዘርእ (zarʿ)
  choice: Nachkommen
  rationale: Das Wort bedeutet wörtlich „Same“, bezeichnet hier aber kollektiv die leibliche Nachkommenschaft; „Nachkommen“ ist im modernen Deutsch natürlich und bewahrt den kollektiven Sinn.
- source_word: ዘሥጋ (za-śəgā)
  choice: allen Fleisches
  rationale: Die Wiedergabe hält das biblische Bild „Fleisch“ fest; „aus der Mitte“ macht deutlich, dass eine Auswahl aus der Gesamtheit gemeint ist.
- source_word: ይትአለክ (yətʾallak)
  choice: dient
  rationale: Im Zusammenhang mit dem Heiligtum bezeichnet das Verb kultischen Dienst; „dienen“ ist idiomatisch und wahrt den sakralen Bezug.
- source_word: መላእክተ ገጽ (malāʾəkt(a) gaṣ)
  choice: Engel der Gegenwart
  rationale: „Gegenwart“ gibt den idiomatischen Sinn von „Angeln des Angesichts“ als Wesen in Gottes unmittelbarer Gegenwart wieder.
theological_decisions:
- issue: Zweck oder Ergebnis von „zur Ehre“
  choice: zur Ehre
  alternative: damit sie verherrlicht werden
  rationale: Die knappe Präpositionalfügung des Ausgangstextes bleibt erhalten, ohne den unbestimmten Bezug dogmatisch oder syntaktisch festzulegen.
- issue: Identität der „Heiligen“
  choice: die Heiligen
  alternative: die heiligen Engel
  rationale: Der Ausgangstext nennt lediglich „Heilige“. Die Übersetzung legt nicht fest, ob damit eine weitere Engelgruppe oder eine andere himmlische Gemeinschaft gemeint ist.
- issue: Numeruswechsel bei der Zweckkonstruktion
  choice: damit ihr … dient
  alternative: damit er … dient / damit sie … dienen
  rationale: Der Zusammenhang nennt den Angeredeten und seine Nachkommen gemeinsam. Die deutsche Pluralform bildet diesen kollektiven Bezug verständlich ab, ohne den Inhalt auf nur eine Person zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst biblischer Bildsprache. Der Satzanfang bleibt kleingeschrieben, da der Vers syntaktisch an den vorausgehenden Text anschließt. Die etwas dichte Schlussformulierung bewahrt die genuine Struktur und ihren nicht völlig eindeutigen Bezug, statt sie interpretierend aufzulösen.
