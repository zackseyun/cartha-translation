  text: 'and his left hand on Judah, and he turned toward Levi first and began to bless him, and said to him: “May the God of all, the Lord of all the ages, bless you'
translation:
  language: de
  text: 'und seine linke Hand auf Juda.[a] Dann wandte er sich zuerst Levi zu, begann ihn zu segnen und sagte zu ihm: »Der Gott aller Dinge, der Herr aller Zeitalter, segne dich'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und Juda mit seiner linken Hand«.'
    reason: Die äthiopische Formulierung setzt den aus dem vorhergehenden Vers übernommenen Satzbau elliptisch fort; Juda ist dabei das Objekt.
lexical_decisions:
- source_word: በፀጋማዊ፡ እዴሁ፡
  choice: seine linke Hand
  rationale: Die Wendung bezeichnet wörtlich die linke Seite beziehungsweise die linke Hand; im fortgesetzten Satz aus Vers 12 ist »seine linke Hand« die natürliche deutsche Ergänzung.
- source_word: ቀዲሙ፡
  choice: zuerst
  rationale: Das Adverb markiert Levis Vorrang in der Reihenfolge; eine einmalige Wiedergabe vermeidet unnötige Wiederholung.
- source_word: አምላከ፡ ኵሉ፡
  choice: der Gott über alles
  rationale: Bewahrt die umfassende Bedeutung der Genitivverbindung, ohne sie unnötig auf »aller Menschen« oder »aller Dinge« festzulegen.
- source_word: እግዚአ፡ ኵሉ፡ ዓለማት፡
  choice: der Herr aller Zeitalter
  rationale: ዓለማት kann Weltzeiten beziehungsweise Zeitalter bezeichnen; »aller Zeitalter« erhält hier den zeitlichen und feierlichen Sinn.
theological_decisions:
- issue: Umfang von »Gott über alles«
  choice: der Gott über alles
  alternative: der Gott von allem
  rationale: Die gewählte Formulierung lässt die umfassende Herrschaftsaussage bestehen und klingt zugleich idiomatisch, ohne den Bezugsbereich dogmatisch zu verengen.
- issue: Bedeutung von ዓለማት
  choice: aller Zeitalter
  alternative: aller Welten
  rationale: Der Kontext einer Segensformel erlaubt beide Bedeutungsfelder; »Zeitalter« entspricht der konsultierten Überlieferung und bewahrt den Bezug auf sämtliche Weltzeiten.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Satzanfang bleibt als Fortsetzung des vorhergehenden Verses kleingeschrieben und elliptisch; die Ergänzung »auf« macht den syntaktischen Bezug im Deutschen klar. Das eröffnende Anführungszeichen bleibt ungeschlossen, da die Rede im Folgevers weitergeht.
