  text: And he came to his father Isaac and to his mother Rebekah. And Rebekah came out from the chamber to the door of the chamber to kiss Jacob and embrace him, for her spirit had revived when...
translation:
  language: de
  text: Und er kam zu seinem Vater Isaak und zu seiner Mutter Rebekka. Rebekka kam aus dem Gemach heraus an die Tür des Gemachs, um Jakob zu küssen und ihn zu umarmen; denn ihr Geist war wieder lebendig geworden, als …[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der ge’ezische Text dieses Versabschnitts endet mit einer Zeitangabe, die den folgenden Satzteil einleitet: „als …“.'
    reason: Die Fußnote erklärt den grammatisch offenen Schluss an der überlieferten Versgrenze, ohne ihn durch eine unbelegte Ergänzung zu schließen.
lexical_decisions:
- source_word: ማኅፈድ
  choice: Gemach
  rationale: Das Wort bezeichnet hier einen abgeschlossenen Raum beziehungsweise eine Kammer. Die zweimalige Wiedergabe mit „Gemach“ bewahrt die auffällige Wiederholung des ge’ezischen Textes.
- source_word: አንቀጸ
  choice: Tür
  rationale: Im räumlichen Zusammenhang eines Gemachs ist „Tür“ die natürliche moderne Wiedergabe; „Tor“ wäre hier unnötig monumental.
- source_word: ትስዐሞ
  choice: zu küssen
  rationale: Gibt den Infinitivzweck nach „kam heraus“ natürlich und genau wieder.
- source_word: ትሕቀፎ
  choice: ihn zu umarmen
  rationale: Bewahrt das zum vorhergehenden Infinitiv parallele Ziel der Handlung und macht das männliche Objekt im Deutschen deutlich.
- source_word: ሐይወ፡ መንፈሳ
  choice: ihr Geist war wieder lebendig geworden
  rationale: Bewahrt das Bild vom Wiederaufleben ihres Geistes, statt es lediglich als emotionale Erleichterung auszudeuten.
- source_word: በጊዜ
  choice: als …
  rationale: Die Wendung eröffnet hier zeitlich den folgenden, an der vorliegenden Versgrenze abgeschnittenen Satzteil. Die offene Form vermeidet einen künstlichen Satzabschluss.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Gemach“ folgt bewusst der Wiederholung desselben ge’ezischen Wortes. Der offene Schluss mit Auslassungspunkten erhält die syntaktische Verbindung zum nachfolgenden Text.
