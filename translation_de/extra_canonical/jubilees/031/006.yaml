  source_fidelity: 'Die Übersetzung gibt die Abfolge und die wesentlichen ge’ezischen Elemente zuverlässig wieder: Isaak und Rebekka, Rebekkas Herauskommen aus dem Gemach zur Tür desselben Gemachs, Küssen und Umarmen Jakobs sowie das Wiederaufleben ihres Geistes. Die doppelte Wiedergabe von ማኅፈድ als „Gemach“ bewahrt die Wiederholung des Ausgangstextes. Der offene Anschluss „als …“ entspricht der am Versende einsetzenden, in den folgenden Satzteil weiterführenden Zeitverbindung.'
  naturalness: Das Deutsch ist modernes, würdiges Standarddeutsch. „aus dem Gemach heraus an die Tür des Gemachs“ ist etwas formal, aber klar, idiomatisch vertretbar und dem erzählenden Register angemessen. Das Semikolon vor der begründenden Aussage ist passend.
  terminology: Die Eigennamen Isaak, Rebekka und Jakob sind in den üblichen deutschen Formen wiedergegeben. „Geist“ ist für መንፈስ sachgerecht und vermeidet eine unnötige psychologisierende Deutung. „Gemach“ und „Tür“ sind hier plausible, registergerechte Entsprechungen.
