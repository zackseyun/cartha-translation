  yaml_path: translation/extra_canonical/jubilees/031/015.yaml
  text: and holiness. And may he make them great throughout all the ages. And they shall be princes and judges and chiefs for all the seed of the sons of Jacob. They shall speak the word of the Lord in righteousness[15], and they shall judge all his judgments in righteousness, and they shall declare his ways to Jacob and his paths to Israel. The blessing of the Lord shall be in their mouths
translation:
  language: de
  text: und Heiligkeit. Er mache sie groß durch alle Zeitalter hindurch. Sie sollen Fürsten, Richter und Boten für die ganze Nachkommenschaft der Söhne Jakobs sein. Sie sollen das Wort des Herrn in Gerechtigkeit verkünden, alle seine Urteile in Gerechtigkeit sprechen und Jakob seine Wege und Israel seine Pfade[a] kundtun. Der Segen des Herrn soll in ihrem Mund sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die mit „seine Pfade für Israel“ wiedergegebene Wendung ist textlich und lexikalisch schwierig; möglich ist auch ein stärkerer Sinn wie „seine Ordnungen“ oder „seine Zucht“ für Israel.
    reason: lexical_alternative
lexical_decisions:
- source_word: መላእክተ
  choice: Boten
  rationale: Das Wort bezeichnet grundlegend Boten und kann auch Engel meinen. Im Zusammenhang einer Reihe von Ämtern ist „Boten“ natürlich, ohne die mögliche Bedeutung vorschnell auf überirdische Wesen festzulegen.
- source_word: ቃሎ፡ ለእግዚአብሔር
  choice: das Wort des Herrn
  rationale: Formale und im Deutschen geläufige Wiedergabe der Genitivverbindung.
- source_word: ኵሎ፡ ኵነኔሁ
  choice: alle seine Rechtssachen
  rationale: Gibt den gerichtlichen Sinn verständlich wieder und vermeidet die unnatürliche Formulierung, man solle „Urteile richten“.
- source_word: በጽድቅ
  choice: in Gerechtigkeit
  rationale: Bewahrt die zweimalige Wiederholung und den ethisch-rechtlichen Klang des Ausgangstextes.
- source_word: ፍኖቶ … ወአስርኖ
  choice: seine Wege … seine Pfade
  rationale: Bewahrt den Parallelismus; beim zweiten Ausdruck bleibt wegen der schwierigen Text- und Bedeutungsüberlieferung eine Fußnote nötig.
theological_decisions:
- issue: Bedeutung der dritten Amtsbezeichnung
  choice: Boten
  alternative: Engel; Anführer
  rationale: „Boten“ entspricht dem Grundsinn des überlieferten ge'ezischen Wortes und lässt dessen Bedeutungsbreite offen, statt eine übernatürliche oder hierarchische Deutung festzuschreiben.
- issue: Schwieriger Parallelismus „seine Wege … seine Pfade“
  choice: Den Parallelismus im Haupttext erhalten
  alternative: „seine Ordnungen“ oder „seine Zucht“ für Israel
  rationale: Die überlieferte Lesart wird nicht stillschweigend harmonisiert; mögliche stärkere rechtlich-disziplinarische Bedeutungen werden in der Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der fragmentarische Versanfang „und Heiligkeit“ bleibt erhalten, weil der Vers mitten in einem fortlaufenden Segensspruch einsetzt. Die wiederholte Wendung „in Gerechtigkeit“ wird bewusst nicht stilistisch geglättet.
