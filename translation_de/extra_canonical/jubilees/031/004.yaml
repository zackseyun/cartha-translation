  choice: Mein Sohn Jakob soll kommen
  rationale: Der jussivische Ausdruck wird als Aufforderung in der dritten Person wiedergegeben; die deutsche Wortstellung klingt natürlich und bewahrt die Zugehörigkeitsangabe »mein Sohn«.
