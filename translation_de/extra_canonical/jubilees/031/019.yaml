  source_fidelity: 'Die Übersetzung gibt die zweifache, parallele Zukunftsaussage des geʽezischen Textes vollständig wieder: alle Nationen sowie jedes Volk werden erschüttert. „In dir wird Hilfe für Jakob sein“ entspricht der offenen Präpositionsverbindung ብከ und dem Ausdruck „Hilfe Jakobs/für Jakob“, ohne die Vermittlungsweise zusätzlich auszudeuten. Sie stimmt auch mit der englischen POB-Prüffassung überein.'
