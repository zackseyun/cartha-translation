  text: and all the nations shall be shaken, and all the peoples shall be shaken. In you shall be the help of Jacob,
translation:
  language: de
  text: Und alle Nationen werden erschüttert werden, und jedes Volk wird erschüttert werden. In dir wird Hilfe für Jakob sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „In dir möge Hilfe für Jakob sein.“ Die zugrunde liegende Verbform kann neben einer zukünftigen Aussage auch den Wunsch- oder Segenscharakter ausdrücken.'
    reason: Die ge’ezische Form ይኩን lässt in dieser Segensrede sowohl eine futurische als auch eine jussivische Wiedergabe zu; die Anmerkung bewahrt diese echte Mehrdeutigkeit.
lexical_decisions:
- source_word: ይትሀወኩ
  choice: werden erschüttert werden
  rationale: Das Verb bezeichnet ein Erschüttert- oder Aufgewühltwerden. Die passive Zukunftsform gibt sowohl Form als auch Aussage des ge’ezischen Textes wieder.
- source_word: አሕዛብ
  choice: Nationen
  rationale: Die Pluralform bezeichnet hier die Nationen beziehungsweise Völker; „Nationen“ unterscheidet sie im Deutschen von dem folgenden singularischen ሕዝብ.
- source_word: ኵሉ ሕዝብ
  choice: jedes Volk
  rationale: Die distributive Formulierung wird wörtlich und natürlich mit „jedes Volk“ wiedergegeben.
- source_word: ብከ
  choice: in dir
  rationale: Die Präposition mit maskulinem Singularsuffix bezeichnet den angesprochenen Segensempfänger als den Ort beziehungsweise Träger der Hilfe.
- source_word: ረድኤተ
  choice: Hilfe
  rationale: „Hilfe“ ist die direkte und im modernen Deutschen verständliche Entsprechung, ohne näher festzulegen, wie diese Hilfe vermittelt wird.
theological_decisions:
- issue: Beziehung zwischen dem Angesprochenen und Jakobs Hilfe
  choice: „In dir wird Hilfe für Jakob sein“
  alternative: „Durch dich wird Jakob Hilfe finden“
  rationale: Die gewählte Fassung bewahrt die örtlich-instrumentale Offenheit von ብከ („in dir“, möglicherweise auch „durch dich“) und vermeidet es, die Art der vermittelten Hilfe theologisierend festzulegen.
- issue: Modalität von ይኩን
  choice: „wird … sein“
  alternative: „möge … sein“ / „soll … sein“
  rationale: Im Zusammenhang der Segensrede kann die Form als wirksame Zusage verstanden werden. Das Futur entspricht der überlieferten englischen Konsultationsfassung, während die Fußnote auf die mögliche Wunsch- oder Segensnuance hinweist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur des Ausgangstextes bleibt erhalten. „Nationen“ und „Volk“ bilden die lexikalische Unterscheidung des ge’ezischen Textes ab; die Formulierung „in dir“ bewahrt dessen theologische und syntaktische Offenheit.
