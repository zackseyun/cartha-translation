  text: he had prayed, and when he came, he might set him on a donkey. And Isaac said to Jacob his son, “I am not able to come with you, for I am old and not able to endure the journey. Go, my son, in peace, for I am one hundred sixty-five years old today. I am no longer able to travel. Set your mother on a beast and let her go."”
translation:
  language: de
  text: 'Er hatte gebetet; und wenn er käme, sollte er ihn auf einen Esel setzen.[a] Und Isaak sagte zu seinem Sohn Jakob: »Ich kann nicht mit dir kommen, denn ich bin alt und kann die Reise nicht ertragen. Zieh in Frieden, mein Sohn, denn heute bin ich hundertfünfundsechzig Jahre alt. Ich kann nun nicht mehr reisen. Setz deine Mutter auf ein Lasttier, und sie soll losziehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er hatte gebetet, und als er kam, setzte er ihn auf einen Esel.«'
    reason: Die Form ይጽዐኖ kann im fortlaufenden Zusammenhang modal bzw. als noch ausstehende Handlung oder als erzählende Handlung verstanden werden; die Fußnote bewahrt diese syntaktische Unsicherheit.
lexical_decisions:
- source_word: ጸለየ
  choice: Er hatte gebetet
  rationale: Das Verb bezeichnet Beten; das Plusquamperfekt bindet die Aussage an den vorausgehenden Erzählzusammenhang an.
- source_word: አድግ
  choice: Esel
  rationale: Das konkrete Tier ist ein Esel; die natürliche deutsche Bezeichnung ist hier der allgemeineren Wiedergabe „Lasttier“ vorzuziehen.
- source_word: በፍኖት
  choice: die Reise
  rationale: Im Zusammenhang mit dem Ertragen des Unterwegsseins bezeichnet das Wort den Reiseweg bzw. die Reise.
- source_word: በሰላም
  choice: in Frieden
  rationale: Bewahrt die traditionelle und in diesem Abschiedswort natürliche Segensformel.
- source_word: ጻዐና
  choice: Setz … auf ein Lasttier
  rationale: Der Imperativ bezeichnet das Aufladen bzw. Aufsetzen zum Transport; „Lasttier“ lässt die in diesem Satz nicht eigens genannte Tierart offen.
- source_word: ወትሖር
  choice: und zieh los
  rationale: Die feminine Verbform bezieht sich am ehesten auf die Mutter; im Deutschen wird der Auftrag idiomatisch an Jakob gerichtet formuliert, die Mutter für die Abreise auf das Tier zu setzen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Altersangabe ist ausgeschrieben. Die etwas abrupte Verbindung zum vorausgehenden Vers bleibt erkennbar; das nicht näher bestimmte männliche Bezugswort in „ihn“ wird nicht ergänzt oder vereindeutigt.
