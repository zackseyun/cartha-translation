- source_word: ወአዕረፈ፡ ህየ፡ ቅሩበ፡ ይስሐቅ፡ አቡሁ
  choice: blieb dort bei seinem Vater Isaak
  rationale: »Blieb« gibt das Ruhen bzw. Verweilen idiomatisch wieder; »bei« entspricht der räumlichen Nähe, ohne eine unnatürliche deutsche Formulierung zu erzwingen.
theological_decisions:
- issue: Bedeutung von ዘበጽድቅ
  choice: wahrhaftig
  alternative: in Gerechtigkeit
  rationale: Der Kontext erlaubt eine adverbiale Wahrheitsbekräftigung, während die wörtlichere Lesart eine mögliche ethisch-theologische Nuance trägt. Die Fußnote bewahrt diese Spannung.
- issue: Unklare Wendung »zwischen seinen Füßen«
  choice: wörtliche Bildsprache im Haupttext beibehalten
  alternative: aus seiner unmittelbaren Nähe zurücktreten
  rationale: Das Subjekt und die genaue Handlung sind in der überlieferten Formulierung nicht sicher genug, um die Wendung deutend aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen, mit »und« verbundenen Handlungsschritte der Vorlage werden überwiegend bewahrt; nur dort, wo es dem natürlichen deutschen Satzfluss dient, steht »Dann«. Pronomen und Mehrdeutigkeiten werden nicht durch zusätzliche Eigennamen oder dogmatische Deutungen aufgelöst.
