  text: He had seen the sons of Jacob his son truly. And he went out from between his feet and fell down and bowed to him. And he blessed them and rested there near Isaac his father that night[22], and they ate and drank.
translation:
  language: de
  text: Er hatte die Söhne seines Sohnes Jakob tatsächlich[a] gesehen. Dann trat er zwischen seinen Füßen hervor[b], fiel nieder und verbeugte sich vor ihm. Er segnete sie und blieb in jener Nacht dort bei seinem Vater Isaak, und sie aßen und tranken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Gerechtigkeit«.'
    reason: Bewahrt die formnähere, jedoch kontextuell weniger wahrscheinliche Deutung von ዘበጽድቅ.
  - marker: b
    text: Die Wendung »zwischen seinen Füßen hervor« ist im Ausgangstext schwer verständlich. Möglicherweise ist gemeint, dass er sich aus seiner unmittelbaren Nähe zurückzog, bevor er sich verbeugte.
    reason: Kennzeichnet eine dunkle Ausgangsformulierung und bietet eine vorsichtige Kontexterklärung, ohne sie in den Haupttext einzutragen.
lexical_decisions:
- source_word: ውሉደ፡ ለያዕቆብ፡ ወልዱ
  choice: die Söhne seines Sohnes Jakob
  rationale: Bildet die Genitiv- und Possessivbeziehungen der Vorlage eng und zugleich in natürlichem Deutsch ab.
- source_word: ዘበጽድቅ
  choice: wahrhaftig
