  text: And on the new moon of the month Jacob spoke to all the people of his house, saying, “Purify yourselves and change your garments, and let us rise and go up to Bethel, where I prayed to him in the day when I fled from the face of Esau my brother, and he was with me and brought me back into this land in peace. And put away
translation:
  language: de
  text: 'Am Neumond des Monats[a] sagte Jakob zu allen Angehörigen seines Hauses: „Reinigt euch und wechselt eure Kleider! Dann wollen wir uns aufmachen und nach Bethel hinaufziehen, wo ich an dem Tag zu ihm betete, als ich vor meinem Bruder Esau floh. Er war mit mir und brachte mich in Frieden in dieses Land zurück. Und entfernt[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das heißt: am ersten Tag des Monats.'
    reason: Erläutert die kalendarische Bedeutung des Neumonds, ohne die weniger genaue Lesart »im ersten Monat« in den Haupttext aufzunehmen.
  - marker: b
    text: Der Satz wird im nächsten Vers fortgesetzt.
    reason: Das Objekt des abschließenden Imperativs steht erst im folgenden Vers; die ungewöhnliche Versgrenze soll nicht als unvollständige Übersetzung missverstanden werden.
lexical_decisions:
- source_word: በሠርቀ፡ ወርኅ፡
  choice: Am Neumond des Monats
  rationale: Die Wendung bezeichnet den Neumond beziehungsweise den ersten Tag des Monats, nicht den ersten Monat.
- source_word: ንጽሑ፡
  choice: Reinigt euch
  rationale: Gibt den pluralischen Imperativ direkt und natürlich wieder.
- source_word: ወወልጡ፡ አልባሲክሙ፡
  choice: und wechselt eure Kleider
  rationale: Bewahrt den konkreten Aufforderungscharakter der Vorlage.
- source_word: ወተንሢእነ፡ ንዕርግ፡
  choice: Dann wollen wir uns aufmachen und … hinaufziehen
  rationale: Gibt die auffordernde erste Person Plural idiomatisch wieder und erhält das Motiv des Hinaufziehens.
- source_word: እምገጸ፡ ዔሳው፡ እኁየ፡
  choice: vor meinem Bruder Esau
  rationale: Das wörtliche Bild »vom Angesicht Esaus« bezeichnet hier die Flucht vor Esau.
- source_word: ወሜጠኒ፡
  choice: und brachte mich … zurück
  rationale: Das Verb bezeichnet hier nicht nur ein Bringen, sondern Jakobs Rückführung in das Land.
- source_word: ወአስስሉ፡
  choice: Und entfernt
  rationale: Die Form ist ein pluralischer Imperativ und setzt Jakobs direkte Rede fort; ihr Objekt folgt erst im nächsten Vers.
theological_decisions:
- issue: Bezug des göttlichen Handelns
  choice: Er war mit mir und brachte mich … zurück
  alternative: der mit mir war und mich … zurückbrachte
  rationale: Die gewählte Fassung bewahrt Gott als Handelnden, ohne zusätzliche dogmatische Präzisierung, und entspricht dem syntaktischen Fortgang der Vorlage.
- issue: Offenes Ende der direkten Rede
  choice: Das Schlusszitat bleibt ohne schließendes Anführungszeichen
  alternative: Die Rede am Versende schließen
  rationale: Der letzte Imperativ gehört weiterhin zu Jakobs Rede, und sein Objekt folgt im nächsten Vers.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und mündlich verständlich; die kultischen Aufforderungen bleiben konkret. Der Vers endet bewusst mitten im Satz und mit offenem Anführungszeichen, weil die Vorlage im nächsten Vers weitergeht.
