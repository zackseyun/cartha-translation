    issue: Die Präposition im ersten Glied des Segens wird als »Durch euch« festgelegt.
    rationale: Die ge’ezische Präposition በ- kann hier »in/bei« oder »durch« ausdrücken. Da der Wortlaut und die englische Audit-Fassung die Formel mit »in you« offen halten, führt »Durch euch« unnötig eine instrumentale Deutung ein.
