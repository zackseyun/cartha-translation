  yaml_path: translation/extra_canonical/jubilees/031/007.yaml
  text: She heard, “Behold, Jacob your son has come.” And she kissed him. And she saw his two sons and recognized them, and said to him, “Are these your sons, my son?” And she embraced them and kissed them and blessed them, saying, “In you shall the seed of Abraham be honored, and you shall become a blessing.”
translation:
  language: de
  text: 'Sie hörte: »Sieh, dein Sohn Jakob ist gekommen.« Da küsste sie ihn. Sie sah seine beiden Söhne, erkannte sie und fragte ihn: »Sind das deine Söhne, mein Sohn?« Dann umarmte und küsste sie die beiden und segnete sie mit den Worten: »In euch soll Abrahams Nachkommenschaft geehrt werden, und ihr sollt zum Segen werden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ናሁ
  choice: Sieh
  rationale: Gibt die präsentative Partikel natürlich und würdevoll wieder; »siehe« wäre im heutigen Standarddeutsch unnötig altertümlich.
- source_word: ወአእመረትሙ
  choice: erkannte sie
  rationale: Bewahrt die Grundbedeutung des Verbs und den Bezug auf die beiden Söhne.
- source_word: ዘርአ፡ አብርሃም
  choice: Abrahams Nachkommenschaft
  rationale: »Nachkommenschaft« gibt das kollektive »Same« im modernen Deutsch verständlich wieder, ohne den Umfang auf einzelne Nachkommen festzulegen.
- source_word: ይክበር
  choice: soll … geehrt werden
  rationale: Bewahrt den passiven Sinn von »geehrt/verherrlicht werden«, ohne ihn theologisch auszudeuten.
- source_word: ለበረከት
  choice: zum Segen
  rationale: Entspricht der idiomatischen Ziel- oder Ergebnisformulierung und klingt im Deutschen natürlich.
theological_decisions:
- issue: Bezug und Zahl der Anrede im Segenswort
  choice: »Durch euch … und ihr …« als Plural auf die beiden Söhne bezogen
  alternative: 'Singular auf Jakob bezogen: »Durch dich … und du …«'
  rationale: Die ge’ezischen Pluralformen und der unmittelbar vorausgehende Segen über beide Söhne sprechen für eine gemeinsame Anrede an sie.
- issue: Reichweite der Segensverheißung
  choice: Kein Zusatz »auf der Erde«
  alternative: »ihr sollt auf der Erde zum Segen werden«
  rationale: Ein entsprechender Ortsausdruck steht im vorliegenden ge’ezischen Text nicht.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp; archaisierende Formen werden vermieden. »Die beiden« verdeutlicht nach dem pluralischen Objekt, dass Umarmung, Kuss und Segen beiden Söhnen gelten.
