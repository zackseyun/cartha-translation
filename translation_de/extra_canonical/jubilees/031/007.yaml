review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den Handlungsablauf und die Bezüge der Personen zuverlässig wieder. Im Segensspruch ist jedoch »Durch euch« eine einseitig instrumentale Auslegung der mit በ- gebildeten, auch lokativ wiedergebbaren Wendung; die englische Audit-Fassung bewahrt hier ausdrücklich »in you«. Die deutsche Fassung sollte diese Offenheit ebenfalls wahren.
  naturalness: Das Deutsch ist insgesamt klar, modern und dem erzählerisch-würdigen Register angemessen. »In euch soll Abrahams Nachkommenschaft geehrt werden« ist als bewusst formelhafte Segenssprache verständlich und bewahrt die Quellformulierung besser als die kausale Umformung »Durch euch«.
  terminology: »Abrahams Nachkommenschaft«, »geehrt werden« und »zum Segen werden« sind angemessene, nicht konfessionell einengende Wiedergaben. Die pluralische Anrede an die beiden Söhne ist vom unmittelbaren Kontext und den ge’ezischen Pluralformen gedeckt.
  issues:
