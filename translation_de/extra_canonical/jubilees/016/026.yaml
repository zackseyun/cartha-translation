base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/026.yaml
  text: And he blessed his Creator, who had created him in his generation, because He had created him according to His good pleasure; for he knew and perceived that from him there would be a plant of righteousness for the eternal generations, and from him a holy seed, so that it might be like Him who made all things.
translation:
  language: de
  text: Und er segnete seinen Schöpfer, der ihn in seiner Generation[a] erschaffen hatte, denn nach seinem Wohlgefallen hatte er ihn erschaffen. Er hatte nämlich erkannt und begriffen, dass aus ihm ein Gewächs der Gerechtigkeit für die ewigen Generationen hervorgehen würde und aus ihm ein heiliger Same, damit dieser dem ähnlich sei, der alles geschaffen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: in seiner Verwandtschaft.'
    reason: Das geʿezische Wort kann neben der Generation auch den verwandtschaftlichen Zusammenhang bezeichnen.
lexical_decisions:
- source_word: በትዝምዱ፡
  choice: in seiner Generation
  rationale: Gibt die zeitlich-genealogische Bedeutung im Zusammenhang mit Abrahams Stellung innerhalb seiner Generation wieder; die zugrunde liegende Verwandtschaftsterminologie lässt jedoch auch eine stärker familiäre Deutung zu.
- source_word: በሥምረቱ፡
  choice: nach seinem Wohlgefallen
  rationale: Bewahrt sowohl den Willensaspekt als auch den Gedanken göttlicher Zustimmung beziehungsweise Gunst und entspricht einem würdigen modernen Bibelregister.
- source_word: ወጠየቀ፡
  choice: und begriffen
  rationale: Ergänzt „erkannt“ um den Gedanken eines durch Prüfung oder Nachdenken gewonnenen sicheren Verständnisses, ohne eine unbelegte Gewissheit zu überzeichnen.
- source_word: ተከለ፡ ጽድቅ፡
  choice: ein Gewächs der Gerechtigkeit
  rationale: Erhält das pflanzliche Bild und klingt im Deutschen natürlicher und würdiger als das wörtlichere „eine Pflanze der Gerechtigkeit“.
- source_word: ዘርእ፡ ቅዱስ፡
  choice: ein heiliger Same
  rationale: Bewahrt das kollektive und genealogische Bild des Quelltexts sowie seine mögliche theologische Spannung.
- source_word: ዘገብረ፡ ኵሎ።
  choice: der alles geschaffen hat
  rationale: Das wiederhergestellte ኵሎ („alles“) gehört ausdrücklich zum Vers; „geschaffen“ verbindet den Schluss sachgerecht mit dem eingangs genannten Schöpfer.
theological_decisions:
- issue: Bezug von „damit dieser dem ähnlich sei“
  choice: „dieser“ bezieht sich grammatisch auf den heiligen Samen, während „der alles geschaffen hat“ den Schöpfer bezeichnet.
  alternative: Die Aussage ausdrücklich auf die Nachkommen oder auf Abraham beziehen.
  rationale: Die Übersetzung lässt die kollektive Bedeutung von „Same“ und die Aussage seiner Ähnlichkeit mit dem Schöpfer stehen, ohne diese theologisch näher zu bestimmen.
- issue: Göttliches Wohlgefallen und menschliche Erschaffung
  choice: „nach seinem Wohlgefallen“
  alternative: „durch seinen Willen“
  rationale: Die gewählte Fassung wahrt die Verbindung von göttlichem Willen und Gunst, ohne daraus eine konfessionell geprägte Lehraussage abzuleiten.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst beibehaltenen biblischen Bildern („Gewächs der Gerechtigkeit“, „heiliger Same“). Die Satzstruktur wurde für gute Verständlichkeit leicht gegliedert; die zeitliche Vorordnung der Erkenntnis wird durch „hatte nämlich erkannt“ ausgedrückt.
