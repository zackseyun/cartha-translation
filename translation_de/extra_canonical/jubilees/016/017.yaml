base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/017.yaml
  text: And we blessed him and told him everything that had been decreed concerning him, that he would not die until he had begotten six more sons and seen them before he died; but in Isaac his name and seed would be called.
translation:
  language: de
  text: 'Und wir segneten ihn und teilten ihm alles mit, was für ihn bestimmt worden war: Er werde nicht sterben, bevor er sechs weitere Söhne gezeugt und sie vor seinem Tod gesehen habe; doch nach Isaak sollen ihm Name und Nachkommenschaft benannt werden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ባረክናሁ
  choice: wir segneten ihn
  rationale: Gibt das geʿezische Verb für »segnen« unmittelbar und in natürlichem Deutsch wieder.
- source_word: ዜነውናሁ
  choice: wir teilten ihm … mit
  rationale: Das Verb bezeichnet ein Mitteilen oder Verkünden; »mitteilen« passt hier zum Inhalt des zuvor Beschlossenen.
- source_word: ተአዘዘ
  choice: beschlossen worden war
  rationale: Bewahrt den Sinn einer verbindlichen Anordnung oder Festsetzung, ohne eine menschliche oder göttliche Instanz ausdrücklich zu ergänzen.
- source_word: ስድስተ ውሉደ
  choice: sechs weitere Söhne
  rationale: »Söhne« entspricht dem maskulinen Ausdruck; »weitere« verdeutlicht idiomatisch, dass neben Isaak noch sechs Söhne gemeint sind.
- source_word: ይሬኢ
  choice: gesehen habe
  rationale: Das nicht ausdrücklich genannte Objekt wird aus den unmittelbar zuvor erwähnten sechs Söhnen erschlossen, ohne »Isaaks Söhne« einzutragen.
- source_word: ዘርአ
  choice: Nachkommenschaft
  rationale: Der Kollektivbegriff kann »Same« oder »Nachkommenschaft« bedeuten; »Nachkommenschaft« ist im modernen Deutsch verständlich und bewahrt den kollektiven Sinn.
theological_decisions:
- issue: Berufung beziehungsweise Benennung von Name und Nachkommenschaft »in Isaak«
  choice: doch in Isaak würden sein Name und seine Nachkommenschaft genannt werden
  alternative: doch nach Isaak würden sein Name und seine Nachkommenschaft benannt werden
  rationale: Die Formulierung mit »in Isaak« hält sich eng an die Quelle und bewahrt deren theologisch aufgeladene, nicht völlig eindeutige Wendung, statt sie als bloße Namensgebung nach Isaak auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange Satzbau und die Zukunft aus der Perspektive der erzählten Mitteilung werden durch den Konjunktiv I bewahrt. Keine Fußnote wurde gesetzt, da das in der früheren englischen Fassung erwogene »Isaaks Söhne« nach dem geʿezischen Kontext nicht zu stützen ist.
