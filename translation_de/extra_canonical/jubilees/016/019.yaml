  text: a priesthood and a holy people. And he went on his way, and he rejoiced and blessed the Creator of all because we had told him.
translation:
  language: de
  text: eine Priesterschaft und ein heiliges Volk. Dann zog er seines Weges; er freute sich und pries den Schöpfer aller Dinge, weil wir ihm dies gesagt hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder bei anderer Gliederung: »und pries den Herrn für alles, was wir ihm gesagt hatten.«'
    reason: Bewahrt die in der englischen POB-Auditspur dokumentierte alternative Gliederung und Lesart.
lexical_decisions:
- source_word: ዘክህነት
  choice: eine Priesterschaft
  rationale: Das abstrakt-kollektive Substantiv wird als »Priesterschaft« wiedergegeben; das ist genauer als »Priester« und schließt natürlich an den vorangehenden Satzteil an.
- source_word: ሕዝበ፡ ቅዱሰ
  choice: ein heiliges Volk
  rationale: Wörtliche und im Deutschen natürliche Wiedergabe der Nominalgruppe.
- source_word: ለባሬ፡ ኵሉ
  choice: den Schöpfer von allem
  rationale: Die Wendung bezeichnet Gott als den Schöpfer des Alls. »von allem« bewahrt den umfassenden Bezug von ኵሉ, ohne ihn auf den nachfolgenden Bericht zu verengen.
- source_word: ዘነገርናሁ
  choice: weil wir es ihm gesagt hatten
  rationale: Das Relativ-/Bindeelement wird im Zusammenhang kausal verstanden; das Plusquamperfekt macht deutlich, dass die Mitteilung seiner Freude und seinem Lob vorausging.
- source_word: ወተፈሥሐ
  choice: er freute sich
  rationale: Schlichte, idiomatische Wiedergabe des Verbs für Freude beziehungsweise Frohsein.
- source_word: ወከዐወ፡ ናላ
  choice: und pries
  rationale: Beim Sprechen zu Gott wird das zugrunde liegende Segnen im heutigen Deutsch natürlich mit »preisen« ausgedrückt; »segnete den Schöpfer« wäre zwar formnäher, klänge aber missverständlich.
theological_decisions:
- issue: Gottesbezeichnung
  choice: der Schöpfer von allem
  alternative: der Herr
  rationale: Die konkrete Schöpferbezeichnung des ge'ezischen Textes bleibt erhalten; die allgemeinere Bezeichnung »Herr« würde ein theologisches Motiv des Wortlauts beseitigen.
- issue: Zuordnung von ኵሉ und Funktion von ዘ
  choice: »allem« gehört zu »Schöpfer«; ዘ wird kausal wiedergegeben
  alternative: »für alles, was wir ihm gesagt hatten«
  rationale: Die im geprüften Ausgangstext bevorzugte Gliederung ergibt den göttlichen Titel »Schöpfer von allem« und versteht den folgenden Satzteil als Grund seiner Freude. Da die alternative syntaktische Anbindung möglich ist, wird sie in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Dann zog er seines Weges« wahrt den erzählerisch-feierlichen Ton, bleibt aber allgemein verständlich. Der Vers beginnt als Fortsetzung des vorhergehenden Satzes bewusst mit einem Kleinbuchstaben.
