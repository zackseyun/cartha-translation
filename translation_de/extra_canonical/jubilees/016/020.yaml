  yaml_path: translation/extra_canonical/jubilees/016/020.yaml
  text: And he built there an altar to Yahweh, who delivered him and made him rejoice in the land of his sojourning, and he made a festival of joy in this month for seven days, near the altar which he had built at the Well of the Oath.
translation:
  language: de
  text: Und er baute dort Jahwe einen Altar, der ihn gerettet und ihn in dem Land, in dem er als Fremder lebte, froh gemacht hatte. In diesem Monat feierte er nahe bei dem Altar, den er am Brunnen des Eides[a] gebaut hatte, sieben Tage lang ein Freudenfest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in Beerscheba«. »Brunnen des Eides« gibt die wörtliche Bedeutung des Ortsnamens wieder.'
    reason: Die geʿezische Bezeichnung entspricht der wörtlichen Bedeutung des Ortsnamens Beerscheba; die Anmerkung bewahrt sowohl die transparente Übersetzung als auch die geläufige Ortsnamenform.
lexical_decisions:
- source_word: ዘአድኀኖ
  choice: der ihn gerettet ... hatte
  rationale: Gibt die abgeschlossene Rettungstat des Relativsatzes natürlich und präzise wieder.
- source_word: ዘአስተፈሥሖ
  choice: der ... ihn ... froh gemacht hatte
  rationale: Bewahrt die kausative Bedeutung des Geʿez-Verbs und parallelisiert sie mit der vorausgehenden Rettungstat.
- source_word: ፈላስነቱ
  choice: seines Fremdseins
  rationale: Bezeichnet Abrahams Aufenthalt als Fremder bzw. ansässiger Fremdling, ohne ihn unnötig als Verbannung oder zielloses Wandern zu deuten.
- source_word: ገብረ ፡ በዓለ ፡ ትፍሥሕት
  choice: feierte er ... ein Freudenfest
  rationale: Natürliches modernes Deutsch für die wörtliche Wendung »er machte ein Fest der Freude«.
- source_word: በዐዘቅተ ፡ መሐላ
  choice: am Eidbrunnen
  rationale: Gibt die wörtliche Bedeutung des geʿezischen Ortsnamens wieder, der als Lehnübersetzung von Beerscheba verstanden wird.
theological_decisions:
- issue: Wiedergabe des Gottesnamens እግዚአብሔር
  choice: Jahwe
  alternative: der HERR / der Herr
  rationale: Folgt der bereitgestellten, revidierten POB-Entscheidung, hier den persönlichen Gottesnamen ausdrücklich wiederzugeben, ohne den Satz konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange Ausgangssatz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; Reihenfolge und inhaltliche Bezüge bleiben erhalten. »Fremdsein« wahrt den Status des zeitweiligen Aufenthalts als Fremder, ohne stärkere Begriffe wie »Exil« einzutragen.
