  text: And both of them had very great joy. And he built there an altar to the Lord, who had blessed him and who had made him rejoice in the land of his sojourning. And he made a feast of joy in this month for seven days.
translation:
  language: de
  text: Und beide freuten sich überaus. Dort baute er dem HERRN einen Altar, der ihn gesegnet und ihn im Land seines Aufenthalts mit Freude erfüllt hatte. Und in diesem Monat feierte er sieben Tage lang ein Freudenfest.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ክልኤሆሙ
  choice: beide
  rationale: Gibt die ausdrückliche Zweizahl des ge'ezischen Ausdrucks wieder.
- source_word: ፍሥሓ፡ ዐቢየ፡ ጥቀ
  choice: freuten sich überaus
  rationale: Natürliches modernes Deutsch für die intensive Wendung von sehr großer Freude.
- source_word: ምሥዋዐ
  choice: Altar
  rationale: Die reguläre kultische Bedeutung des ge'ezischen Substantivs.
- source_word: እግዚአብሔር
  choice: HERR
  rationale: Die traditionelle deutsche Wiedergabe der Gottesbezeichnung in biblischem Erzählstil.
- source_word: በምድረ፡ ፍልሰቱ
  choice: im Land seines Aufenthalts
  rationale: Bewahrt den Gedanken eines vorübergehenden Wohnens bzw. Fremdlingsaufenthalts, ohne im Deutschen unnötig altertümlich zu klingen.
- source_word: በዓለ፡ ፍሥሓ
  choice: Freudenfest
  rationale: Gibt sowohl den Festcharakter als auch die ausdrücklich genannte Freude knapp und idiomatisch wieder.
- source_word: መዋዕለ፡ ሰቡዐ
  choice: sieben Tage lang
  rationale: Idiomatiche deutsche Wiedergabe der Zeitdauer.
theological_decisions:
- issue: Bezug der Relativsätze
  choice: 'Beide Relativsätze beziehen sich auf den HERRN: „der ihn gesegnet und … mit Freude erfüllt hatte“'
  alternative: Den zweiten Relativsatz anders beziehen oder als selbstständige Aussage auffassen
  rationale: Die parallele ge'ezische Konstruktion ዘ… ወለዘ… legt denselben Bezug auf den Herrn nahe; die Formulierung lässt die göttliche Urheberschaft der Freude bestehen.
- issue: Art des Aufenthalts im Land
  choice: „Land seines Aufenthalts“
  alternative: „Land seiner Fremdlingschaft“ oder „Land seiner Wanderschaft“
  rationale: Die gewählte Form bewahrt den vorläufigen Charakter, ohne stärker festzulegen, ob vor allem Fremdlingsstatus oder Wanderleben gemeint ist.
translation_notes:
  register: Moderne, würdige und gut verständliche Erzählsprache. Der Gottesname wird bibeltypisch als HERR gesetzt; keine konfessionellen Zusätze. Die Wiederholung von Freude wird gemäß der Vorlage in natürlicher deutscher Variation bewahrt.
