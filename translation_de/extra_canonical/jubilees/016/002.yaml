    issue: „zu Abraham“ statt „mit Abraham“
    rationale: Die geezische Präposition ምስለ bedeutet hier „mit“. Da der Ausgangstext die Gesprächsbeziehung ausdrücklich markiert und die englische Audit-Fassung ebenfalls „with Abraham“ hat, sollte die Übersetzung diese Angabe nicht zu einer bloßen Ansprache an Abraham umdeuten.
