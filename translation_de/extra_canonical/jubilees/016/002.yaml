  text: And Sarah laughed because she heard that we had spoken this word with Abraham, and we reproved her.
translation:
  language: de
  text: Und Sara lachte, weil sie hörte, dass wir dieses Wort mit Abraham gesprochen hatten, und wir wiesen sie zurecht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እስመ
  choice: weil
  rationale: Die geezische Konjunktion bezeichnet hier den Grund für Saras Lachen; „weil“ gibt den kausalen Zusammenhang unmittelbar wieder.
- source_word: ተናገርነ፡ ዘንተ፡ ቃለ፡ ምስለ፡ አብርሃም
  choice: wir dieses Wort zu Abraham gesprochen hatten
  rationale: „Dieses Wort“ bewahrt die konkrete Redeformel; „zu Abraham sprechen“ ist im Deutschen natürlicher als „mit Abraham sprechen“, wenn der Inhalt einer Ankündigung gemeint ist. Das Plusquamperfekt verdeutlicht, dass die Rede Saras Hören und Lachen vorausging.
- source_word: ወዘለፍናሃ
  choice: und wir wiesen sie zurecht
  rationale: Die Wendung gibt Tadel beziehungsweise Zurechtweisung wieder. „Zurechtweisen“ ist würdig und verständlich, ohne die Stärke unnötig zu verschärfen.
theological_decisions:
- issue: Identität des sprechenden „wir“
  choice: Das grammatische „wir“ bleibt unverändert stehen.
  alternative: Das Subjekt als Engel oder als Gott und seine Begleiter ausdrücklich identifizieren.
  rationale: Der Vers selbst nennt die Sprecher nicht ausdrücklich. Eine nähere Identifizierung würde die im Kontext auszulegende Referenz bereits im Übersetzungstext festlegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bleibt nah am geezischen Ausgangstext, wird aber durch Plusquamperfekt und Semikolon idiomatisch gegliedert.
