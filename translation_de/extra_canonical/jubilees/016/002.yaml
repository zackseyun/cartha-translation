  source_fidelity: Die kausale Wiedergabe von እስመ durch „weil“, das unbestimmte Sprecher-„wir“ und „wiesen sie zurecht“ für den Tadel sind sachgerecht. Allerdings gibt ምስለ አብርሃም ausdrücklich „mit Abraham“ wieder; „zu Abraham“ verengt bzw. verändert die Beziehungsangabe unnötig.
  naturalness: Der Satz ist modernes, verständliches Standarddeutsch. Auch „dieses Wort mit Abraham gesprochen hatten“ ist in diesem bewusst formelhaften Erzählregister natürlich genug; das Semikolon ist nicht erforderlich.
  terminology: „Sara“ entspricht der im Deutschen üblichen biblischen Namensform. „Dieses Wort“ bewahrt die konkrete Rede-/Botschaftsformel. „Zurechtweisen“ trifft den tadelnden Sinn ohne Übersteigerung.
