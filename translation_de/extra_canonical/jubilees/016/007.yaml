  source_fidelity: Die Wiedergabe von Lots Rettung, Gottes Erinnern an Abraham und Lots Herausführung ist grundsätzlich zutreffend. Der im vorgelegten ge'ezsprachigen Ausschnitt unvollständig wirkende Anschluss nach „aus der Mitte“ wird durch die englische Auditfassung mit „des Untergangs“ erläutert. „aus ihrer Mitte“ legt dagegen einen nicht hinreichend abgesicherten femininen Bezug fest und entspricht nicht der Auditfassung.
  naturalness: „Lot aber retteten wir“ und „weil Gott an Abraham dachte“ sind modernes, würdiges Standarddeutsch. „aus ihrer Mitte“ ist ohne klaren Bezug jedoch missverständlich; „aus der Mitte des Untergangs“ macht den gemeinten Bezug verständlich, wahrt aber die bildhafte Formulierung.
  terminology: „retteten“, „Gott“ und „an Abraham dachte“ sind angemessen und theologisch nicht überdeutet. „Untergang“ folgt der englischen Auditspur und vermeidet eine stärker auslegende Benennung wie „Gericht“ oder „Verderben“.
