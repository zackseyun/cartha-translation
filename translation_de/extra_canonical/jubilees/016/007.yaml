    rationale: Der deutsche Pluralpossessivanschluss hat keinen eindeutigen grammatischen Bezug. Die vorgelegte Quelle endet nach „aus der Mitte“, während die englische POB-Auditfassung den ergänzten Bezug als „the overthrow“ ausweist. Die Übersetzung sollte diese Ergänzung transparent als „des Untergangs“ wiedergeben, statt Sodom bzw. eine feminine Bezugsgröße festzulegen.
  revised_text: Lot aber retteten wir, weil Gott an Abraham dachte und ihn aus der Mitte des Untergangs herausführte.
