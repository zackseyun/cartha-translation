  text: But Lot we saved, because God remembered Abraham and brought him out from the midst of the overthrow.
translation:
  language: de
  text: Lot aber retteten wir, weil Gott an Abraham dachte und ihn aus der Mitte des Untergangs herausführte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ናድኅኖ
  choice: retteten wir
  rationale: Die äthiopische Verbform ist 1. Person Plural und bezeichnet Lots Rettung; die im Deutschen ungewöhnlichere Subjektstellung bleibt erhalten.
- source_word: ተዘከሮ
  choice: dachte an
  rationale: Gibt das göttliche Erinnern idiomatisch wieder, ohne bloßes Vergessen und Wiedererinnern theologisch vorauszusetzen.
- source_word: እማእከለ
  choice: aus ihrer Mitte
  rationale: Wörtlich „aus der Mitte von …“; das feminine Suffix verweist im vorliegenden, offenbar verkürzten Text am ehesten auf Sodom beziehungsweise dessen Umgebung.
theological_decisions:
- issue: Abrahams Rolle bei Lots Rettung
  choice: weil Gott an Abraham dachte
  alternative: weil Gott sich Abrahams erinnerte
  rationale: Die kausale Verbindung wird bewahrt, ohne näher festzulegen, ob damit Fürbitte, Bundestreue oder persönliche Gunst gemeint ist.
- issue: Bezug des pronominalen Suffixes bei „aus ihrer Mitte“
  choice: ihrer Mitte
  alternative: aus der Mitte des Untergangs
  rationale: Der erhaltene geezsprachige Wortlaut bietet ein feminines pronominales Suffix und nennt in diesem Ausschnitt keinen Ausdruck für „Untergang“. Daher wird der Bezug nicht nach der englischen Konsultationsfassung ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzstruktur und das erzählende „wir“ des Ausgangstextes bleiben erhalten; „Lot aber“ markiert den Kontrast.
