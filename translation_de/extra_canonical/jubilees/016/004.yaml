  text: and his name, Isaac, was written on the heavenly tablets. And when we returned to her at the appointed time, she conceived and bore a son.
translation:
  language: de
  text: Und sein Name, Isaak, wurde auf die himmlischen Tafeln geschrieben.[a] Als wir zur festgesetzten Zeit zu ihr zurückkehrten,[b] wurde sie schwanger und gebar einen Sohn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und sein Name wurde auf die himmlischen Tafeln geschrieben: Isaak.“'
    reason: Bewahrt die mögliche formnähere Stellung von „Isaak“ am Ende der Aussage.
  - marker: b
    text: 'Oder: „zu ihr kamen“.'
    reason: Nennt die allgemeinere Wiedergabe des Verbs, während der Haupttext dessen spezifischen Rückkehrsinn ausdrückt.
lexical_decisions:
- source_word: ስሙ (səmu)
  choice: sein Name
  rationale: Das ge'ezische Wort bezeichnet ausdrücklich „seinen Namen“; das Possessivsuffix wird daher wiedergegeben.
- source_word: ጽላተ ሰማይ (ṣəllāta samāy)
  choice: die himmlischen Tafeln
  rationale: Die Wendung bezeichnet die für das Jubiläenbuch charakteristischen himmlischen Tafeln; „himmlisch“ ist im Deutschen natürlicher als eine rein formale Genitivkonstruktion.
- source_word: ገባእነ (gabāʾna)
  choice: wir zurückkehrten
  rationale: Das Verb bedeutet hier spezifisch „zurückkehren“ und bewahrt den Bezug auf die zuvor angekündigte Wiederkehr.
- source_word: በጊዜ ሰዓት (ba-gize sāʿat)
  choice: zur festgesetzten Zeit
  rationale: Die Verbindung bezeichnet den bestimmten beziehungsweise festgesetzten Zeitpunkt; die deutsche Fassung ist idiomatisch und erhält diesen Sinn.
theological_decisions:
- issue: Eintragung Isaaks auf den himmlischen Tafeln
  choice: wurde auf die himmlischen Tafeln geschrieben
  alternative: stand auf den himmlischen Tafeln geschrieben
  rationale: Das Passiv folgt der Aussage des Quelltexts, ohne näher zu bestimmen, wer den Namen eintrug oder welche theologische Funktion die Tafeln genau haben.
- issue: Bezug des Namens Isaak
  choice: sein Name, Isaak
  alternative: 'sein Name wurde auf die himmlischen Tafeln geschrieben: Isaak'
  rationale: Die Apposition wird im Haupttext natürlich dem Ausdruck „sein Name“ zugeordnet; die formal mögliche, im Ge'ez näher am Satzende stehende Wiedergabe bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nah am ge'ezischen Text, während „zur festgesetzten Zeit“ und die Stellung der Apposition „Isaak“ natürlich deutsch formuliert sind.
