  text: And in this month Abraham moved from Hebron, and went and dwelt between Kadesh and Shur in the mountains of Gerar.
translation:
  language: de
  text: Und in diesem Monat brach Abraham von Hebron auf, zog fort und ließ sich zwischen Kadesch und Schur im Bergland von Gerar nieder.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በዝንቱ፡ ወርኅ
  choice: in diesem Monat
  rationale: Direkte und natürliche Wiedergabe der Zeitangabe.
- source_word: አብርሃም፡ እምነ፡ ኬብሮን
  choice: Abraham brach von Hebron auf
  rationale: Gibt die im Text bezeichnete Abreise idiomatisch wieder; „aufbrechen“ passt besser als das im Deutschen missverständliche „umziehen“, da anschließend das Fortziehen und Niederlassen genannt wird.
- source_word: ወሖረ
  choice: zog fort
  rationale: Bewahrt die eigenständige Bewegungsangabe und vermeidet, sie mit dem vorausgehenden Aufbruch zusammenzuziehen.
- source_word: dwelt between Kadesh and Shur in the mountains of Gerar (Fortsetzung gemäß vollständiger Versüberlieferung; im bereitgestellten Geʿez-Ausschnitt abgeschnitten)
  choice: ließ sich zwischen Kadesch und Schur im Bergland von Gerar nieder
  rationale: Die Formulierung gibt den Abschluss des vollständigen Verses wieder. „Bergland“ ist im modernen Deutschen für eine gebirgige Region natürlicher als der wörtlichere Plural „Berge“.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung „brach … auf, zog fort und ließ sich … nieder“ erhält die einzelnen Handlungsschritte, ohne unnötig schwerfällig zu wirken. Der bereitgestellte Geʿez-Textausschnitt enthält noch das Ende des vorherigen Verses, weist bei der Aufbruchsform ein OCR-Problem auf und bricht nach ወሖረ („und er ging/zog“) ab; der zweite Versteil folgt der in der Aufgabenangabe ausgewiesenen vollständigen Versüberlieferung und der auditierten englischen Konsultationsschicht.
