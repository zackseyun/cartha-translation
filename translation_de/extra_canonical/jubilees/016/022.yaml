  text: at this feast, and he was the first to celebrate the feast of booths on the earth. And during these seven days he offered, day by day, on the altar to the Lord two oxen, two rams, seven sheep, one male goat for a sin offering,
translation:
  language: de
  text: Bei diesem Fest[a] war er der Erste, der auf Erden das Laubhüttenfest feierte. Während dieser sieben Tage brachte er dem Herrn Tag für Tag auf dem Brandopferaltar[b] zwei Stiere, zwei Widder, sieben Lämmer und einen Ziegenbock als Sündopfer dar.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Für dieses Fest«.'
    reason: Die Präposition kann je nach syntaktischem Anschluss zeitlich (»bei«) oder zweckbezogen (»für«) verstanden werden; zudem kann die Wendung an den vorhergehenden Vers anschließen.
  - marker: b
    text: 'Wörtlich: »auf dem Altar des Brandopfers«.'
    reason: Die Hauptfassung verwendet die im Deutschen natürlichere Zusammensetzung »Brandopferaltar«.
lexical_decisions:
- source_word: በዛቲ፡ በዓል
  choice: Bei diesem Fest
  rationale: 'Die Präposition በ bezeichnet hier am natürlichsten den Zeitpunkt bzw. Anlass: »bei/an diesem Fest«; der alternative Anschluss »für dieses Fest« bleibt in einer Fußnote erhalten.'
- source_word: በዓለ፡ መጻላት
  choice: Laubhüttenfest
  rationale: Die feste moderne deutsche Bezeichnung für das Fest der Hütten; sie ist verständlicher und idiomatischer als eine wörtliche Neubildung.
- source_word: ያቀርብ
  choice: brachte … dar
  rationale: Das Verb bedeutet grundsätzlich »heranbringen/darbringen« und wird im Opferkontext idiomatisch mit »darbringen« wiedergegeben.
- source_word: ምሥዋዐ፡ ጽንሓሕ
  choice: Brandopferaltar
  rationale: Die Konstruktion bezeichnet den Altar für Brandopfer; das zusammengesetzte deutsche Wort gibt sie knapp und kultisch präzise wieder.
- source_word: አልህምተ፡ ክልኤተ ... መሐስአ፡ ጠሊ፡ አሐደ
  choice: zwei Stiere, zwei Widder, sieben Schafe und einen Ziegenbock
  rationale: Die Tierarten, Zahlen und das ausdrücklich männliche Ziegentier werden in natürlichem modernem Deutsch bewahrt.
theological_decisions:
- issue: Opfersprachliche Deutung von ያቀርብ
  choice: »brachte … dar«
  alternative: »brachte … auf den Altar«
  rationale: Die kultische Bedeutung wird kenntlich gemacht, ohne über den im Kontext klar bezeichneten Opferakt hinaus eine besondere theologische Deutung einzutragen.
- issue: Wiedergabe des abschließenden Opferzwecks
  choice: »als Sündopfer«
  alternative: wörtlicher Anschluss »wegen/für …«
  rationale: Die überlieferte und im konsultierten Text bezeugte Fortführung bezeichnet den Ziegenbock als Sündopfer; die deutsche Formulierung ist die übliche sachliche Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit geläufiger biblischer Opfersprache. Die Satzstellung wurde für gute Verständlichkeit geglättet, während Reihenfolge, Zahlen und kultische Einzelheiten erhalten bleiben. »HERR« folgt der üblichen deutschen Wiedergabe des Gottesnamens in diesem Kontext.
