base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/016.yaml
  text: And we returned in the seventh month and found Sarah pregnant before us, and we blessed the Lord, and we announced to him all the things which he had spoken concerning him, that he would surely do them.
translation:
  language: de
  text: 'Im siebten Monat kehrten wir zurück und fanden Sara in unserer Gegenwart schwanger. Wir segneten ihn[a] und teilten ihm alles mit, was ihm aufgetragen worden war: dass er nicht sterben werde, bis er sechs weitere Söhne gezeugt und sie vor seinem Tod gesehen habe, und dass sein Name und seine Nachkommenschaft in Isaak genannt werden sollten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist Abraham. Das maskuline Objektsuffix wird im ge’ezischen Text nicht durch einen Namen wiederholt.
    reason: Erläutert den pronominalen Bezug, ohne den Haupttext mit einer unnötigen Wiederholung zu beschweren.
lexical_decisions:
- source_word: ወተመየጥነ
  choice: wir kehrten zurück
  rationale: Gibt die Rückkehr der sprechenden himmlischen Boten direkt und natürlich wieder.
- source_word: ቅድሜነ
  choice: vor unseren Augen
  rationale: Bewahrt die konkrete Bedeutung „vor uns/in unserer Gegenwart“ in idiomatischem Deutsch.
- source_word: ወባረክናሁ
  choice: wir segneten ihn
  rationale: Das ge’ezische Verb trägt ein maskulines Objektsuffix („ihn“); der Gottesname steht hier nicht ausdrücklich.
- source_word: ዘተአዘዘ ሎቱ
  choice: was über ihn bestimmt worden war
  rationale: Die passive Form bezeichnet etwas Angeordnetes oder Festgesetztes; die Wiedergabe vermeidet es, einen im Ge’ez nicht ausdrücklich genannten Sprecher einzusetzen.
theological_decisions:
- issue: Bezugswort des Objekts in „wir segneten ihn“
  choice: Das Pronomen bleibt im Haupttext erhalten.
  alternative: „Wir priesen den Herrn“, wie die englische Konsultationsfassung deutet.
  rationale: Der ge’ezische Wortlaut nennt den Herrn an dieser Stelle nicht ausdrücklich. Die offene pronominale Form wird deshalb nicht stillschweigend theologisch aufgelöst.
- issue: Göttlicher Urheber des Beschlossenen
  choice: 'Passive Formulierung: „was über ihn bestimmt worden war“'
  alternative: „was der Herr über ihn gesagt hatte“
  rationale: Die passive ge’ezische Konstruktion lässt den Urheber unausgesprochen; die Übersetzung bewahrt diese Form, ohne den naheliegenden göttlichen Bezug auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kurzen Hauptsätze bleiben gut verständlich; unklare Pronomen und der unausgesprochene Urheber werden nicht durch konfessionell oder theologisch festgelegte Ergänzungen aufgelöst.
