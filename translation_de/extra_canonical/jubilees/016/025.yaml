  source_fidelity: 'Die Übersetzung gibt die im ge’ezischen Text ausdrücklich belegten Elemente zutreffend wieder: das siebentägige Feiern des Festes, die Freude mit ganzem Herzen und ganzer Seele sowie die Einbeziehung aller Hausangehörigen. Der im bereitgestellten Quellenausschnitt abgebrochene Schluss wird entsprechend der englischen POB-Auditfassung als Ausschluss eines Fremden und eines Unbeschnittenen wiedergegeben; die Kategorien bleiben dabei sachlich und nicht interpretierend.'
