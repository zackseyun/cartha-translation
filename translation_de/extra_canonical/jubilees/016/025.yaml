  text: And he kept this feast seven days, rejoicing with all his heart and with all his soul, he and all who were in his house; and there was no foreigner with him, nor anyone uncircumcised.
translation:
  language: de
  text: Und er feierte dieses Fest sieben Tage lang und freute sich mit ganzem Herzen und ganzer Seele, er und alle, die in seinem Haus waren. Kein Fremder war bei ihm und auch kein Unbeschnittener.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወገብረ፡ ዘንተ፡ በዓለ
  choice: Und er feierte dieses Fest
  rationale: Das Verb ገብረ bedeutet wörtlich „machen/tun“; in Verbindung mit „Fest“ ist „feiern“ die natürliche deutsche Wiedergabe.
- source_word: ሰቡዐ፡ መዋዕለ
  choice: sieben Tage lang
  rationale: Gibt die Zeitdauer klar und idiomatisch wieder.
- source_word: እንዘ፡ ይትፌሣሕ፡ በኵሉ፡ ልቡ፡ ወበኵሉ፡ ነፍሱ
  choice: und freute sich von ganzem Herzen und mit ganzer Seele
  rationale: Bewahrt die parallele Ganzheitsaussage des Ge’ez und verwendet eine im Deutschen verständliche biblische Ausdrucksweise.
- source_word: እለ፡ ውስተ፡ ቤቱ
  choice: die in seinem Haus waren
  rationale: Nahe, natürliche Wiedergabe der räumlichen Formulierung.
theological_decisions:
- issue: Bezeichnung der nicht zur Hausgemeinschaft gehörenden Personen
  choice: Kein Fremder war bei ihm und auch kein Unbeschnittener.
  alternative: Es war weder ein Ausländer noch ein Unbeschnittener bei ihm.
  rationale: „Fremder“ wahrt die mögliche soziale beziehungsweise gemeinschaftliche Bedeutung, ohne den Ausdruck vorschnell auf moderne Staatsangehörigkeit festzulegen; „Unbeschnittener“ erhält die kultisch-bundestheologische Kategorie.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Klang. Die Wiederaufnahme „er und alle“ bewahrt die Hervorhebung und Satzstruktur der Vorlage. Der bereitgestellte Ge’ez-Ausschnitt bricht nach „und es gab keinen …“ ab; der Schluss wurde anhand der auditierten englischen Konsultationsfassung ergänzt.
