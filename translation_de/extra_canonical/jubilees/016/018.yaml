base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/018.yaml
  text: And Isaac alone would become a holy seed, and he would not be reckoned among the nations, for he would become the portion of the Most High, and all his seed had fallen to the lot of God, that it should become for the Lord a people for possession out of all peoples, and that it should become a kingdom
translation:
  language: de
  text: Und Isaak allein wird zu einer heiligen Nachkommenschaft werden und nicht zu den Völkern gerechnet werden; denn er wird der Anteil des Höchsten sein. Und seine ganze Nachkommenschaft ist Gott durch das Los als Anteil zugefallen, damit sie dem HERRN als ein Volk zum Eigentum aus allen Völkern gehöre und zu einem Königreich werde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይስሐቅኒ፡ አሐዱ
  choice: allein Isaak
  rationale: Der ausdrückliche Name Isaak und አሐዱ werden zusammen als exklusive Hervorhebung wiedergegeben; so bleibt der Gegensatz zu Abrahams übrigen Nachkommen erhalten.
- source_word: ዘርእ፡ ቅዱስ
  choice: ein heiliges Geschlecht
  rationale: ዘርእ kann sowohl »Same« als auch »Nachkommenschaft/Geschlecht« bedeuten. »Geschlecht« ist hier im Deutschen natürlich und bezeichnet eine Abstammungslinie.
- source_word: ኢይትኌለቍ፡ ውስተ፡ አሕዛብ
  choice: nicht zu den Völkern gerechnet werden
  rationale: Die formale Zählungs- bzw. Zuordnungsmetapher der Vorlage wird bewahrt.
- source_word: መክፈልተ፡ ልዑል
  choice: der Anteil des Höchsten
  rationale: Die Wendung wird eng an der Quellmetapher wiedergegeben, ohne sie als bloßes Eigentum zu paraphrasieren.
- source_word: ወረደ፡ ኵሉ፡ ዘርኡ
  choice: seine ganze Nachkommenschaft ist ... als Los zugefallen
  rationale: Das Verb bezeichnet im Kontext die Zuteilung durch das Los; die deutsche Formulierung macht diese idiomatisch verständlich.
- source_word: ሕዝበ፡ ትርሲት
  choice: ein Volk zum Eigentum
  rationale: Die Besitz- bzw. Erbteilvorstellung wird in einer geläufigen, bibelsprachlich würdigen Form ausgedrückt.
- source_word: መንግሥተ
  choice: ein Königreich
  rationale: Das abschließende Substantiv bezeichnet ein Königreich bzw. eine Königsherrschaft; »Königreich« wahrt hier die konkrete kollektive Aussage.
theological_decisions:
- issue: Exklusivität Isaaks
  choice: allein Isaak
  alternative: Isaak wird ein heiliges Geschlecht werden
  rationale: Die Übersetzung bewahrt das in አሐዱ enthaltene exklusive Moment, ohne darüber hinaus eine konfessionelle Folgerung einzutragen.
- issue: Gottes Zuteilung der Nachkommenschaft
  choice: ist Gott als Los zugefallen
  alternative: wurde Gott zugeteilt
  rationale: Die Losmetaphorik und das grammatische Verhältnis werden erhalten; die Formulierung legt nicht fest, auf welche Weise diese Zuteilung theologisch zu erklären ist.
- issue: Bezeichnung des Gottesnamens
  choice: dem HERRN
  alternative: dem Herrn
  rationale: Die traditionelle deutsche Kennzeichnung des göttlichen Eigennamens wird verwendet und von der Bezeichnung »der Höchste« unterschieden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit maßvoll biblischem Klang. Die Satzstruktur bleibt quellennah, wird jedoch durch Satzteilung und idiomatische Fügungen lesbar gehalten. Der überlieferte Vers endet syntaktisch bei »Königreich«; dieser offene Anschluss wird nicht ergänzt.
