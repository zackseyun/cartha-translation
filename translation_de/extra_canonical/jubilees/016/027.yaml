  text: And he blessed and rejoiced, and he called the name of this feast the feast of the Lord, a joy
translation:
  language: de
  text: Und er segnete und freute sich. Er nannte dieses Fest »Fest des Herrn, Freude«.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Er nannte dieses Fest ›Fest des Herrn‹, eine Freude.«'
    reason: Das abschließende »Freude« kann entweder zum Festnamen gehören oder als Apposition verstanden werden.
lexical_decisions:
- source_word: ባረከ
  choice: segnete
  rationale: Entspricht unmittelbar dem ge’ezischen Verb für »segnen« und bewahrt die knappe Erzählweise.
- source_word: ተፈሥሐ
  choice: freute sich
  rationale: Gibt das Verb natürlich und inchoativ-neutral als persönliche Freude wieder.
- source_word: ጸውዐ፡ ስማ
  choice: nannte
  rationale: Die wörtliche Wendung »rief den Namen« bedeutet idiomatisch, einer Sache einen Namen zu geben.
- source_word: በዓለ፡ እግዚአብሔር
  choice: Fest des Herrn
  rationale: Formale und im Deutschen natürliche Wiedergabe der Genitivverbindung.
- source_word: ፍሥሓ
  choice: Freude
  rationale: Bewahrt das abschließende artikellose Substantiv und seine mögliche appositionelle beziehungsweise namensartige Funktion.
theological_decisions:
- issue: Verhältnis von »Freude« zum Festnamen
  choice: »Fest des Herrn, Freude« als mehrteilige Benennung
  alternative: »Fest des Herrn«, eine Freude
  rationale: Die Quelle stellt »Freude« ohne ausdrückliches Bindewort oder Artikel an das Ende. Die Hauptfassung wahrt diese syntaktische Offenheit, statt das Wort eindeutig als wertende Apposition festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die zwei Hauptverben werden auf zwei Sätze verteilt, damit die lange Reihung natürlich lesbar bleibt; die ungewöhnliche Schlussfügung bleibt als mögliche Festbenennung bewusst erhalten.
