base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/006.yaml
  text: and they defiled themselves and committed fornication in their flesh and did uncleanness on the earth. And thus the Lord will execute judgment on the places where they have acted according to the uncleanness of Sodom, just as he judged Sodom.
translation:
  language: de
  text: Und sie werden sich verunreinigen, in ihrem Fleisch Unzucht treiben und auf der Erde Unreines tun. Ebenso wird der Herr an den Orten Gericht vollziehen, an denen sie gemäß der Unreinheit Sodoms gehandelt haben, so wie er Sodom gerichtet hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይትራኩሱ
  choice: sie werden sich verunreinigen
  rationale: Die reflexive Bedeutung wird bewahrt; die geezische Imperfektform ist im Zusammenhang am natürlichsten zukunftsbezogen wiederzugeben.
- source_word: ይዜምዉ በሥጋሆሙ
  choice: mit ihrem Fleisch Unzucht treiben
  rationale: Bewahrt sowohl den sexuellen Sinn des Verbs als auch die ausdrückliche Bezugnahme auf ihr Fleisch, ohne die Wendung unnötig auszudeuten.
- source_word: ይገብሩ ርኵሰ
  choice: Unreines tun
  rationale: Gibt die konkrete Verbindung von »tun« und »Unreinheit« in natürlichem Deutsch wieder.
- source_word: ይገብር እግዚአብሔር ኵነኔ
  choice: wird der Herr … Gericht halten
  rationale: Entspricht der geezischen Wendung für das Vollziehen eines Gerichts und klingt im Deutschen würdig und idiomatisch.
- source_word: በከመ ርኵሶሙ ለሰዶም
  choice: gemäß der Unreinheit Sodoms
  rationale: Erhält den Vergleichs- beziehungsweise Entsprechungssinn und vermeidet eine über den Wortlaut hinausgehende Präzisierung.
theological_decisions:
- issue: Zeitbezug der ersten drei Verben
  choice: 'Zukunft: »werden sich verunreinigen … treiben … tun«'
  alternative: 'Vergangenheit: »verunreinigten sich … trieben … taten«'
  rationale: Die geezischen Imperfektformen und der vorausblickende Kontext stützen die Zukunft; dadurch wird das angekündigte Verhalten nicht rückblickend umgedeutet.
- issue: Art der Unreinheit
  choice: »Unzucht« und »Unreines« ohne nähere dogmatische Bestimmung
  alternative: eine bestimmte sexuelle oder kultische Sünde ausdrücklich benennen
  rationale: Der Text verbindet sexuelle Verfehlung und Unreinheit, legt hier aber keine weitergehende systematische Einordnung fest.
- issue: Gegenstand des Gerichts
  choice: Gericht über die Orte, an denen entsprechend Sodoms Unreinheit gehandelt wurde
  alternative: Gericht ausschließlich über Sodom
  rationale: Die Formulierung wahrt sowohl den Plural »Orte« als auch Sodom als Vergleichs- und Gerichtsbeispiel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem geezischen Parallelismus, wird aber durch natürliche deutsche Wortstellung geglättet. Keine konfessionell geprägte Terminologie wurde ergänzt.
