review_pass:
  verdict: revise
  source_fidelity: Die Zukunftswiedergabe der geezischen Imperfektformen ist im Kontext gut vertretbar. Der Parallelismus von Selbstverunreinigung, Unzucht „in/mit ihrem Fleisch“ und dem Tun von Unreinem bleibt erhalten. Für das göttliche Handeln ist „Gericht vollziehen“ genauer als „über die Orte Gericht halten“, da der Ausgangstext das Vollziehen eines Urteils an den betreffenden Orten ausdrückt.
  naturalness: „Mit ihrem Fleisch Unzucht treiben“ klingt im modernen Deutschen missverständlich und wenig idiomatisch. „In ihrem Fleisch Unzucht treiben“ bewahrt die ausdrücklich körperliche Bezugnahme des Textes und ist im bewusst würdevollen Register besser verständlich. „Gericht vollziehen“ ist hier zudem natürlicher und präziser als „Gericht halten“.
  terminology: „Herr“, „Unzucht“, „Unreines“ und „Gericht“ sind angemessen, ohne den Befund konfessionell zu überdeuten. Die Vergleichsformulierung mit Sodom bleibt absichtlich allgemein und legt keine bestimmte Definition der Unreinheit fest.
  issues:
  - severity: medium
    issue: „mit ihrem Fleisch Unzucht treiben“ ist idiomatisch missverständlich.
    rationale: Die Wendung kann im Deutschen so verstanden werden, als sei das eigene Fleisch ein Mittel oder Gegenstand der Handlung. Die geezische ausdrückliche Körperreferenz lässt sich mit „in ihrem Fleisch“ enger und verständlicher bewahren.
  - severity: low
    issue: „über die Orte Gericht halten“ ist für das Vollziehen des Urteils weniger genau.
    rationale: Der Ausgangstext beschreibt, dass der Herr an den Orten Gericht ausüben beziehungsweise vollziehen wird; „Gericht halten über“ legt stärker eine Gerichtsverhandlung über die Orte nahe.
  revised_text: Und sie werden sich verunreinigen, in ihrem Fleisch Unzucht treiben und auf der Erde Unreines tun. Ebenso wird der Herr an den Orten Gericht vollziehen, an denen sie gemäß der Unreinheit Sodoms gehandelt haben, so wie er Sodom gerichtet hat.
