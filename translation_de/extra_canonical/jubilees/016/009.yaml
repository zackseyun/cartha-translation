base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/009.yaml
  text: from the days of Adam until that time, because a man lay with his daughters. And behold, it was commanded and decreed concerning all his seed on the heavenly tablets, that he should remove them and uproot them, and that their judgment be executed like the judgment of Sodom, and that he should leave no seed of his on the earth on the day of condemnation.
translation:
  language: de
  text: von den Tagen Adams bis zu jener Zeit[a], denn ein Mann hatte mit seinen Töchtern geschlafen. Und siehe, auf den himmlischen Tafeln war über alle seine Nachkommenschaft geboten und beschlossen worden, dass er[b] sie beseitigen und ausrotten sollte, dass ihr Strafgericht wie das Strafgericht über Sodom vollstreckt werde und dass er am Tag der Verurteilung keinen seiner Nachkommen auf der Erde übrig lassen sollte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis zu seiner Zeit“.'
    reason: Die suffigierte Form kann sehr wörtlich personenbezogen aufgefasst werden, wird jedoch idiomatisch gewöhnlich als „zu jener Zeit“ verstanden.
  - marker: b
    text: Das im Ausgangstext nicht ausdrücklich genannte Subjekt der singularischen Verbformen ist dem Zusammenhang nach Gott.
    reason: Die deutsche Pronomenfolge könnte sonst fälschlich auf den unmittelbar zuvor genannten Mann bezogen werden.
lexical_decisions:
- source_word: አሜሁ
  choice: zu jener Zeit
  rationale: Die Form wird hier als adverbiale Zeitangabe verstanden; dies ergibt im Deutschen einen klaren Rückverweis, ohne aus dem Suffix vorschnell einen persönlichen Besitzer abzuleiten.
- source_word: በከበ፡ ብእሲ፡ ምስለ፡ አዋልዲሁ
  choice: ein Mann hatte mit seinen Töchtern geschlafen
  rationale: Die natürliche deutsche Wendung wahrt den sexuellen Sinn und zugleich die verhüllende, würdige Ausdrucksweise des Ausgangstextes.
- source_word: ተአዘዘ፡ ወተቈረጸ
  choice: war geboten und beschlossen worden
  rationale: Die beiden passiven Verben werden als verbindliches Gebot und festgesetzter Beschluss wiedergegeben; „beschlossen“ passt hier besser als das zu konkrete „geschrieben“.
- source_word: ዘርአ
  choice: Nachkommenschaft / Nachkommen
  rationale: „Nachkommenschaft“ bildet den kollektiven Sinn von „Same“ in modernem, verständlichem Deutsch ab; im letzten Satzteil ist der idiomatische Plural natürlicher.
- source_word: ጽላተ፡ ሰማይ
  choice: himmlischen Tafeln
  rationale: Dies bewahrt den charakteristischen Sprachgebrauch des Jubiläenbuches und die konkrete Bildlichkeit des Ausdrucks.
- source_word: ያአትትሙ፡ ወ…ይሠርዎሙ
  choice: sie beseitigen und ausrotten
  rationale: Die beiden Verben stehen in der 3. Person maskulin Singular und bezeichnen zwei aufeinander bezogene Handlungen vollständiger Entfernung.
- source_word: ይገበር፡ ኵነኔሆሙ
  choice: dass ihr Strafgericht … vollstreckt werde
  rationale: Die passive Verbform bleibt erhalten; „Strafgericht“ bringt den verurteilenden Sinn von ኵነኔ im Kontext zum Ausdruck.
- source_word: ኢያትርፍ
  choice: dass er … keinen … übrig lassen sollte
  rationale: Die aktive Form der 3. Person maskulin Singular wird gewahrt und nicht in ein unpersönliches Passiv umgewandelt.
theological_decisions:
- issue: Ungenanntes Subjekt der singularischen Vernichtungsverben
  choice: Das Pronomen „er“ bleibt im Haupttext stehen und wird in einer Fußnote kontextuell auf Gott bezogen.
  alternative: „Gott“ ausdrücklich in den Text einsetzen oder die Sätze passiv formulieren.
  rationale: Der Ausgangstext nennt Gott in diesem Satz nicht ausdrücklich, verwendet aber singularische maskuline Verbformen. Die gewählte Lösung bewahrt sowohl die Grammatik als auch die im Text vorhandene Zurückhaltung.
- issue: Art des Gerichts über die Nachkommenschaft
  choice: „Strafgericht wie das Strafgericht über Sodom“
  alternative: „Urteil wie das Urteil Sodoms“
  rationale: „Strafgericht“ lässt die vollstreckende Dimension erkennen, während „über Sodom“ im Deutschen eindeutig bezeichnet, dass Sodom Gegenstand des Gerichts war.
- issue: Schlusszeitpunkt des Gerichts
  choice: „am Tag der Verurteilung“
  alternative: „am Tag des Gerichts“
  rationale: „Verurteilung“ bewahrt die negative, verdammende Bedeutung des Ausdrucks, ohne eine weitergehende dogmatische Bestimmung vorzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischer Prägung. Die Satzstruktur folgt dem feierlichen Aufzählungsstil des Ausgangstextes, wird aber durch klare Nebensatzgliederung lesbar gehalten. Sexuelle und gerichtliche Aussagen werden deutlich, jedoch nicht unnötig drastisch formuliert.
