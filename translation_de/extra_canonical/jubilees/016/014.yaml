  text: And Abraham circumcised his son on the eighth day; he was the first to be circumcised according to the ordinance ordained forever.
translation:
  language: de
  text: Und Abraham beschnitt seinen Sohn Isaak am achten Tag. Er war der Erste, der gemäß der für immer festgesetzten Ordnung beschnitten wurde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ከበቦ
  choice: beschnitt
  rationale: Das geʿezische Verb bezeichnet hier eindeutig die Beschneidung.
- source_word: እመ፡ ሳምንት
  choice: am achten Tag
  rationale: Die Wendung bezeichnet in diesem Zusammenhang den achten Tag nach der Geburt; die idiomatische deutsche Zeitangabe gibt dies klar wieder.
- source_word: ቀዳሚ
  choice: der Erste
  rationale: Bewahrt die ausdrückliche Vorrangangabe des Ausgangstextes; gemeint ist im Zusammenhang der Erste, der am achten Tag nach dieser Ordnung beschnitten wurde.
- source_word: በከመ፡ ሥርዓት፡ ዘተሠርዓ፡ ለዘለዓለም
  choice: gemäß der für immer festgesetzten Ordnung
  rationale: 'Gibt die Fortsetzung des in der Eingabe abgeschnittenen Satzes wieder: በከመ bedeutet „gemäß“, ሥርዓት „Ordnung/Satzung“, und die anschließende Relativkonstruktion bezeichnet ihre dauerhafte Festsetzung.'
theological_decisions:
- issue: Worin Isaaks Vorrang besteht
  choice: Die Formulierung „der Erste, der gemäß der … Ordnung beschnitten wurde“ bleibt eng am Wortlaut.
  alternative: 'Ausdrücklich ergänzen: „der Erste, der am achten Tag beschnitten wurde“.'
  rationale: Der Zusammenhang legt den achten Tag als Bezugspunkt nahe, doch der Wortlaut verbindet die Vorrangangabe mit der dauerhaft festgesetzten Ordnung. Die Übersetzung erklärt diese Beziehung daher nicht stärker, als es die Quelle selbst tut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Zwei Sätze vermeiden eine schwerfällige Satzperiode; „gemäß“ und „festgesetzt“ halten den rechtlich-bundestheologischen Ton, ohne konfessionelle Zusatzdeutung.
