  yaml_path: translation/extra_canonical/jubilees/016/024.yaml
  text: 'And morning and evening he burned fragrant incense: frankincense, galbanum, stacte, nard, myrrh, cassia, and costus, seven of these; he offered all of them mixed together, pure.'
translation:
  language: de
  text: 'Und morgens und abends verbrannte er wohlriechendes Räucherwerk: Weihrauch, Galbanum, Stakte, Narde, Myrrhe, Kassia und Kostus[a] – diese sieben. Alle miteinander vermischt und rein brachte er sie dar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Kostus und Kassia“.'
    reason: Dokumentiert die im englischen POB-Audit überlieferte alternative Reihenfolge, während der Haupttext der Reihenfolge der vorliegenden geezischen Edition folgt.
lexical_decisions:
- source_word: ለመዐዛ፡ ሠናይ
  choice: wohlriechendes Räucherwerk
  rationale: Die Wendung bezeichnet einen angenehmen Duft; zusammen mit dem Verb des Räucherns ergibt sich im Deutschen natürlich und sachlich passend „wohlriechendes Räucherwerk“.
- source_word: እፈወ፡ ስኂነ፡ ወቅንአተ፡ ወማየ፡ ልብን፡ ወናርድስ፡ ወከርቤ፡ ወሰንበልተ፡ ወኵስተ
  choice: Weihrauch, Galbanum, Stakte, Narde, Myrrhe, Kassia und Kostus
  rationale: Die sieben Duftstoffe werden mit ihren etablierten deutschen Bezeichnungen und in der Reihenfolge des geezischen Textes wiedergegeben; insbesondere steht Kassia vor Kostus.
- source_word: ሰብዐቲሆሙ
  choice: diese sieben
  rationale: Die ausdrückliche Zählung der genannten Duftstoffe bleibt erhalten.
- source_word: ዘንተ፡ ኵሉ፡ ያቀርብ
  choice: er brachte sie alle dar
  rationale: „Darbringen“ wahrt den kultischen Sinn von ያቀርብ, während „sie alle“ die Gesamtheit der sieben Bestandteile ausdrücklich aufnimmt.
- source_word: ብሔር
  choice: rein miteinander vermischt
  rationale: Die knappe geezische Angabe wird im Zusammenhang der Räuchermischung so wiedergegeben, dass sowohl Reinheit als auch Mischung verständlich zum Ausdruck kommen, ohne die einzelnen Stoffe als getrennte Opfergaben erscheinen zu lassen.
