- issue: Vorherbestimmung des Namens
  choice: wie es bestimmt worden war
  alternative: wie es angeordnet worden war
  rationale: „Bestimmt“ wahrt den passivischen Sinn, ohne die Art oder den Urheber der Festsetzung näher zu definieren.
