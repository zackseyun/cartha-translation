  terminology: „Heilsopfer“, „Speiseopfer“, „Trankopfer“ und „Sühne“ sind angemessene, nicht konfessionell verengende kultische Fachbegriffe. Die Tierliste entspricht dem maßgeblichen ge’ezischen Verständnis. Die Fußnote zu መሐስአ hält die lexikalische Unsicherheit knapp und korrekt offen. Die Wiedergabe „HERRN“ für die Gottesbezeichnung ist im deutschen Bibelregister vertretbar.
