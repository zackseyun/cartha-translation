  source_fidelity: 'Die Übersetzung gibt die ge’ezische Abfolge und die wesentlichen Elemente zuverlässig wieder: Sühne für Sünde mittels des zuvor genannten Opfers, der Bezug auf ihn selbst und seine Nachkommen, das Heilsopfer mit den vier Tiergruppen samt Speise- und Trankopfern sowie das Verbrennen des Fettes auf dem Altar. „Dadurch“ bewahrt die instrumentale Nuance von ቦቱ, ohne einen im Vers selbst nicht ausformulierten Bezug zu ergänzen.'
