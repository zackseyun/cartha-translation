base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/023.yaml
  text: to make atonement for sin by it, for himself and for his seed. And for a sacrifice of well-being, seven rams, seven kids, seven sheep, and seven male goats, and their grain offerings and their drink offerings. And he burned all their fat on the altar, a choice offering to the Lord for a pleasing aroma.
translation:
  language: de
  text: um dadurch Sünde zu sühnen, für sich und seine Nachkommen. Als Heilsopfer brachte er sieben Widder, sieben Böckchen[a], sieben Schafe und sieben Ziegenböcke dar, dazu ihre Speiseopfer und Trankopfer. Ihr ganzes Fett ließ er auf dem Altar in Rauch aufgehen, als erlesene Gabe für den HERRN, zu einem wohlgefälligen Duft.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: sieben Kälber.'
    reason: Die ge’ezische Tierbezeichnung መሐስአ kann unterschiedlich als Böckchen bzw. Kälber bestimmt werden.
lexical_decisions:
- source_word: ያስተስሪ፡ ቦቱ
  choice: dadurch … zu sühnen
  rationale: Das Verb bezeichnet Sühne; ቦቱ wird instrumental als „dadurch“ wiedergegeben, ohne den im vorangehenden Kontext genannten Bezug ausdrücklich zu ergänzen.
- source_word: ዘርኡ
  choice: seine Nachkommen
  rationale: Das wörtliche „sein Same“ bezeichnet hier die Nachkommenschaft und wird in natürlichem modernem Deutsch wiedergegeben.
- source_word: መሥዋዕተ፡ መድኀኒት
  choice: Heilsopfer
  rationale: Die Wendung bezeichnet ein Opfer des Heils bzw. Wohlergehens; „Heilsopfer“ wahrt den kultischen Charakter und vermeidet eine zu enge Festlegung auf ein Gemeinschafts- oder Dankopfer.
- source_word: አብሐኩ
  choice: Widder
  rationale: Die Tierbezeichnung wird entsprechend der ge’ezischen Lexik und der jüngsten Quellenprüfung als Widder verstanden, nicht als Stiere.
- source_word: መሐስአ
  choice: Böckchen
  rationale: Die Bezeichnung kann Jungtiere, insbesondere Ziegenjunge, meinen; die mögliche Wiedergabe „Kälber“ wird in der Fußnote offengehalten.
- source_word: አባግዐ
  choice: Schafe
  rationale: Die allgemeine Pluralbezeichnung wird ohne unbelegte Eingrenzung nach Geschlecht oder Alter als „Schafe“ wiedergegeben.
- source_word: ደቤላት
  choice: Ziegenböcke
  rationale: Die maskuline Tierbezeichnung wird als männliche Ziegen wiedergegeben und so von den zuvor genannten Böckchen unterschieden.
- source_word: መሥዋዕቶሙኒ፡ ወቍጻጼቶሙኒ
  choice: ihre Speiseopfer und Trankopfer
  rationale: Die kultischen Begleitgaben werden mit den im Deutschen üblichen Opferbezeichnungen wiedergegeben.
- source_word: የዐጥን
  choice: ließ … in Rauch aufgehen
  rationale: Das kultische Verb beschreibt das Verbrennen bzw. Aufsteigenlassen als Opferrauch; diese Formulierung ist präziser als das schlichte „verbrannte“.
- source_word: '*ኅሩየ፡ ለእግዚአ'
  choice: als erlesene Gabe für den HERRN
  rationale: „Erlesen“ bildet den Gedanken des Ausgewählten bzw. Vorzüglichen ab; „HERR“ entspricht der Gottesbezeichnung in kultischem Kontext.
- source_word: ሥብሖሙ
  choice: ihr ganzes Fett
  rationale: Der Ausdruck bezeichnet das Opferfett der genannten Tiere; „ganzes“ greift die Totalität der Darbringung auf.
theological_decisions:
- issue: Bezug der Sühnehandlung
  choice: „um dadurch Sünde zu sühnen, für sich und seine Nachkommen“
  alternative: „als Sündopfer, um für sich und seine Nachkommen Sühne zu erwirken“
  rationale: Die gewählte Fassung lässt „Sünde“ als Gegenstand der Sühne erkennen und bewahrt zugleich das instrumentale ቦቱ. Sie macht aus der Stelle nicht ausdrücklich eine technische Opferkategorie, die der Text hier nicht eindeutig nennt.
- issue: Art des Opfermahls
  choice: „Heilsopfer“
  alternative: „Gemeinschaftsopfer“ oder „Friedensopfer“
  rationale: „Heilsopfer“ wahrt die semantische Breite von መድኀኒት und legt die genaue kulttheologische Funktion nicht konfessionell oder terminologisch enger fest.
- issue: Wohlgefälliger Duft
  choice: „zu einem wohlgefälligen Duft“
  alternative: „als beruhigender Duft“
  rationale: Die traditionelle kultische Wendung wird verständlich und würdig wiedergegeben, ohne eine wörtliche Vorstellung zu erzwingen, Gott müsse besänftigt werden.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit kultischem Fachwortschatz. Der Vers setzt syntaktisch einen vorausgehenden Satz fort; deshalb beginnt die Übersetzung bewusst mit kleingeschriebenem „um“. Die Aufzählung bleibt rhythmisch und quellennah, während schwer verständliche wörtliche Wendungen idiomatisch formuliert werden.
