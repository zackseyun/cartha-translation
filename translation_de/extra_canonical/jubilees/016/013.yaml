  text: And he did to Sarah as he had said. And she conceived and bore a son in the third month, in the middle of the month, at the time of which the Lord had spoken to Abraham; on the feast of the firstfruits of the harvest, he was born.
translation:
  language: de
  text: Und er handelte an Sara, wie er gesagt hatte. Sie wurde schwanger und gebar im dritten Monat, in der Mitte des Monats, einen Sohn, zu der Zeit, die der Herr Abraham genannt hatte; am Fest der Erstlingsfrüchte der Ernte wurde er geboren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወገብረ፡ ላቲ፡ በከመ፡ ይቤ
  choice: Und er tat für Sara, wie er gesagt hatte
  rationale: Gibt die ausdrückliche Nennung Saras und den Vergleich mit der vorausgehenden Zusage eng am Ge’ez wieder, ohne das im Vers nicht ausdrücklich genannte Subjekt näher zu bestimmen.
- source_word: በወርኅ፡ ሣልስ፡ ወበመንፈቀ፡ ወርኅ
  choice: im dritten Monat, in der Mitte des Monats
  rationale: Bewahrt beide genauen Zeitangaben der Vorlage in natürlichem Deutsch.
- source_word: በበዓለ፡ ቀዳሜ፡ ማእረር
  choice: Am Fest der Erstlingsfrüchte der Ernte
  rationale: Gibt die Festbezeichnung sachlich wieder und vermeidet eine unnötige konfessionelle Festlegung.
- source_word: ተወልደ
  choice: wurde er geboren
  rationale: Das Ge’ez nennt Isaak hier nicht ausdrücklich, sondern verwendet eine maskuline Verbform; das Pronomen verweist verständlich auf den zuvor genannten Sohn.
theological_decisions:
- issue: Identität des handelnden Subjekts im ersten Satz
  choice: Das Subjekt bleibt als „er“ unausgesprochen bestimmt
  alternative: „Der Herr tat für Sara …“
  rationale: Obwohl der Kontext den Herrn nahelegt, nennt der vorliegende Ge’ez-Text ihn an dieser Stelle nicht ausdrücklich; die Übersetzung bewahrt diese Form.
- issue: Benennung des neugeborenen Sohnes
  choice: „wurde er geboren“
  alternative: „wurde Isaak geboren“
  rationale: Der Name Isaak steht nicht im Ge’ez dieses Verses. Die explizite Ergänzung würde eine kontextuell plausible, aber nicht ausgedrückte Identifizierung in den Haupttext eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung der Monatsangabe und der ungenannte männliche Handlungsträger bleiben entsprechend der Quelle erhalten; die Zeichensetzung gliedert die dichte Zeitangabe lesefreundlich.
