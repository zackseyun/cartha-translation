revisions:
- from: Und er tat für Sara, wie er gesagt hatte. Sie wurde schwanger und gebar im dritten Monat, in der Mitte des Monats, einen Sohn, zu der Zeit, von der der Herr zu Abraham gesprochen hatte. Am Fest der Erstlingsfrüchte der Ernte wurde er geboren.
  to: Und er handelte an Sara, wie er gesagt hatte. Sie wurde schwanger und gebar im dritten Monat, in der Mitte des Monats, einen Sohn, zu der Zeit, die der Herr Abraham genannt hatte; am Fest der Erstlingsfrüchte der Ernte wurde er geboren.
  rationale: Die Revision ersetzt zwei im Deutschen holprige Formulierungen durch idiomatische Entsprechungen. Das Subjekt bleibt „er“, der Sohn bleibt unbenannt, und sämtliche Zeit- und Festangaben der Vorlage bleiben erhalten.
