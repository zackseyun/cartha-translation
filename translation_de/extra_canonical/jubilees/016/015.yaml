translation:
  language: de
  text: der Bund, der für immer eingesetzt wurde. Und im sechsten Jahr der vierten Jahrwoche kamen wir zu Abraham am Brunnen des Eides. Wir erschienen ihm, wie wir Sara gesagt hatten, dass wir zu ihr zurückkehren würden und sie einen Sohn empfangen würde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኪዳን
  choice: Bund
  rationale: Die übliche und sachlich genaue Wiedergabe des geezischen Wortes für einen Bund.
- source_word: ተሠርዐት
  choice: festgesetzt ist
  rationale: Die Form bezeichnet etwas, das geordnet, bestimmt oder eingesetzt wurde; „festgesetzt“ bewahrt den institutionellen und dauerhaften Charakter.
- source_word: ሱባዔ
  choice: Jahrwoche
  rationale: Im chronologischen System des Jubiläenbuches bezeichnet das Wort eine Siebenergruppe von Jahren; „Jahrwoche“ gibt dies knapp und verständlich wieder.
- source_word: ዐዘቅተ፡ መሐላ
  choice: Eidbrunnen
  rationale: Wörtlich eine Verbindung aus „Brunnen“ und „Eid“; der Ausdruck entspricht dem traditionsgeschichtlichen Namen Beerscheba, ohne den geezischen Wortlaut durch einen Eigennamen zu ersetzen.
- source_word: ንገብአ፡ ኀቤሃ
  choice: wir zu ihr zurückkehren würden
  rationale: Gibt die angekündigte Rückkehr zur Sara natürlich und inhaltlich präzise wieder.
- source_word: ወይእቲኒ
  choice: und sie … würde
  rationale: Das Pronomen mit hervorhebender Partikel führt Sara als Subjekt des nachfolgenden, im überlieferten Ausschnitt elliptisch erscheinenden Satzteils fort.
theological_decisions:
- issue: Dauer und Status des Bundes
  choice: „der für immer festgesetzt ist“
  alternative: „der für ewig eingesetzt wurde“
  rationale: „Für immer“ wahrt die Aussage unbegrenzter Dauer, während „festgesetzt ist“ weder eine bestimmte konfessionelle Bundestheologie noch eine zusätzliche Deutung des Zustandekommens einträgt.
- issue: Erfüllung der Verheißung an Sara
  choice: „sie einen Sohn empfangen würde“
  alternative: „sie einen Sohn gebären würde“
  rationale: Der gelieferte geezische Ausschnitt endet nach dem hervorgehobenen Pronomen und ist offenbar textlich beziehungsweise syntaktisch verkürzt. Die Ergänzung folgt dem gesicherten Kontext, formuliert aber nicht stärker als die konsultierte Texttradition.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Kleinschreibung bleibt erhalten, weil der Vers mit einem Satzfragment aus dem vorherigen Zusammenhang beginnt. „Jahrwoche“ und „Eidbrunnen“ sind bewusst quellennah, aber für heutige Leser verständlich.
