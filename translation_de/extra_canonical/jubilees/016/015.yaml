  naturalness: „Am Brunnen des Eides“ ist im modernen Deutsch verständlicher und zugleich quellennäher als das ungebräuchliche Kompositum „Eidbrunnen“. Die übrige Syntax ist flüssig und bewahrt den würdigen Erzählton.
  terminology: „Bund“, „Jahrwoche“ und „Sara“ sind angemessen. „Brunnen des Eides“ wahrt die wörtliche Ortsbezeichnung, ohne den Eigennamen Beerscheba einzutragen. „Einen Sohn empfangen“ stimmt mit der englischen Audit-Fassung überein und ist in diesem verheißenden Kontext idiomatisch.
