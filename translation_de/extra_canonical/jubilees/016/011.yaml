  text: and dwelt between Kadesh and Shur in the mountains of Gerar. And in the middle of the fifth month he moved from there and dwelt at the Well of the Oath.
translation:
  language: de
  text: Und er wohnte zwischen Kadesch und Schur im Bergland von Gerar. In der Mitte des fünften Monats zog er von dort weiter und ließ sich am Brunnen des Eides[a] nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das heißt Beerscheba.
    reason: Die Übersetzung bewahrt die im Text hervorgehobene Bedeutung des Ortsnamens und nennt zugleich seine geläufige biblische Form.
lexical_decisions:
- source_word: ኀደረ
  choice: wohnte / ließ sich nieder
  rationale: Das Verb bezeichnet das Verweilen oder Sichniederlassen; die variierte deutsche Wiedergabe ist natürlich und bewahrt den räumlichen Sinn.
- source_word: ማእከለ
  choice: zwischen / in der Mitte
  rationale: Je nach Konstruktion bezeichnet das Wort eine Lage zwischen Orten beziehungsweise die Mitte eines Zeitraums.
- source_word: አደባረ ጌራሮን
  choice: im Bergland von Gerar
  rationale: Die geezische Pluralform zu ‚Berg‘ wird idiomatisch als zusammenhängendes Bergland wiedergegeben.
- source_word: ወበመንፈቀ ወርኅ ኃምስ
  choice: In der Mitte des fünften Monats
  rationale: Gibt die zeitliche Angabe eng und in natürlichem modernem Deutsch wieder.
- source_word: Well of the Oath (consultation layer)
  choice: Brunnen des Eides
  rationale: Die transparente Bedeutung des Ortsnamens wird bewahrt; eine Fußnote nennt die geläufige Namensform.
