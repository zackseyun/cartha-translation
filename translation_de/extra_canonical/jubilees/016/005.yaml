revisions:
- from: Sie empfing einen Sohn. In diesem Monat vollstreckte der Herr das Gericht an Sodom und Gomorra, an Adma[a] und am ganzen Jordangebiet. Er verbrannte sie mit Feuer und Schwefel und ließ sie verwüstet zurück bis auf diesen Tag. So, wie ich dir jetzt alle ihre Taten dargelegt habe, waren sie durch und durch böse und sündig.
  to: 'Sie empfing und gebar einen Sohn. In diesem Monat vollstreckte der Herr das Gericht an Sodom und Gomorra, an Adma[a] und an der ganzen Gegend des Jordan. Er verbrannte sie mit Feuer und Schwefel und vernichtete sie; bis zum heutigen Tag liegt sie in Trümmern. Wie ich dir jetzt alle ihre Taten dargelegt habe: Sie waren durch und durch böse und sündig.'
  rationale: Die Revision ergänzt das im Ge’ez ausdrücklich enthaltene Gebären, glättet zwei deutsche Formulierungen und gibt die bis zum Erzählzeitpunkt fortbestehende Folge der Zerstörung verständlich wieder. Die umstrittene Ortsnamenslesart wird weder verschwiegen noch dogmatisch entschieden; der vorhandene Fußnotenanker bleibt erhalten.
  reviewer_model: gpt-5.6-terra
