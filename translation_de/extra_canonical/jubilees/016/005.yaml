base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/005.yaml
  text: She conceived a son. And in this month the Lord executed judgment on Sodom and Gomorrah and Admah [or 'and Dom'] and all the region of the Jordan, and he burned them with fire and sulfur and destroyed them to this day, just as I have now declared to you all their deeds, that they are utterly wicked and sinful.
translation:
  language: de
  text: 'Sie empfing und gebar einen Sohn. In diesem Monat vollstreckte der Herr das Gericht an Sodom und Gomorra, an Adma[a] und an der ganzen Gegend des Jordan. Er verbrannte sie mit Feuer und Schwefel und vernichtete sie; bis zum heutigen Tag liegt sie in Trümmern. Wie ich dir jetzt alle ihre Taten dargelegt habe: Sie waren durch und durch böse und sündig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im ge’ezischen Text „Dom“; wahrscheinlich ist Adma gemeint.
    reason: textual_variant
lexical_decisions:
- source_word: ፀንሰት፡ ወልደ
  choice: Sie empfing einen Sohn
  rationale: Gibt die einleitende ge’ezische Wendung vollständig und natürlich wieder.
- source_word: ገብረ፡ እግዚአብሔር፡ ዘነኒሆሙ
  choice: vollstreckte der Herr das Gericht an
  rationale: Die idiomatische deutsche Formulierung erfasst das Handeln des Herrn als richterliche Ahndung.
- source_word: ወለዶም
  choice: an Adma[a]
  rationale: Der überlieferte Name lautet wörtlich „Dom“, ist jedoch wahrscheinlich eine verderbte Form von Adma; die Unsicherheit wird in der Fußnote bewahrt.
- source_word: ለኵሉ፡ አደያመ፡ ዮርዳኖስ
  choice: am ganzen Jordangebiet
  rationale: Gibt die Gesamtheit der Gebiete beziehungsweise Umgebung des Jordan in verständlichem Deutsch wieder.
- source_word: ወአውዐዮሙ፡ በእሳት፡ ወበተይ
  choice: Er verbrannte sie mit Feuer und Schwefel
  rationale: Folgt der ge’ezischen Aufzählung der beiden Mittel der Vernichtung.
- source_word: ወአጥፍኦሙ፡ እስከ፡ ዛቲ፡ ዕለት
  choice: ließ sie verwüstet zurück bis auf diesen Tag
  rationale: Macht im Deutschen deutlich, dass der Zustand der Vernichtung bis zum Erzählzeitpunkt fortbesteht.
- source_word: በከመ፡ ናሁ፡ አይዳዐኩ፡ ኵሎ፡ ምግባሮሙ
  choice: So, wie ich dir jetzt alle ihre Taten dargelegt habe
  rationale: Bewahrt sowohl „jetzt/siehe“ als auch das im Ge’ez ausdrücklich vorhandene Verb des Bekanntmachens.
- source_word: ከመ፡ ፀዋጋን፡ ወኃጥኣን፡ ጥቀ
  choice: waren sie durch und durch böse und sündig
  rationale: „Durch und durch“ gibt die starke Intensivierung wieder; „böse und sündig“ ist natürlich und lässt die moralisch-theologische Aussage bestehen.
theological_decisions:
- issue: Art des göttlichen Handelns gegen die Städte
  choice: vollstreckte der Herr das Gericht
  alternative: tat der Herr an ihnen
  rationale: Der Kontext bezeichnet strafendes richterliches Handeln; die Formulierung benennt dies klar, ohne eine konfessionelle Sonderdeutung einzutragen.
- issue: Bezug des abschließenden Satzes
  choice: Die Offenlegung aller Taten führt zur Feststellung, dass die Bewohner böse und sündig waren.
  alternative: „gemäß all ihren Taten, weil sie gesetzlos und sündig waren“
  rationale: Die ge’ezischen Wörter für „jetzt“ und „ich habe dir dargelegt“ müssen ausdrücklich wiedergegeben werden; die ältere Alternative lässt sie aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Hauptsätze halten den erzählerischen Ton klar. Die Textunsicherheit beim Ortsnamen wird nicht stillschweigend beseitigt, sondern durch einen markierten Hinweis offengelegt.
