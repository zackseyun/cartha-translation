  yaml_path: translation/extra_canonical/jubilees/016/031.yaml
  text: And Abraham took branches of palm trees and fruit of beautiful trees, and every day he went around the altar with the branches seven times; and in the morning he praised and gave thanks to his God for everything with joy.
translation:
  language: de
  text: Und Abraham nahm Palmzweige und Früchte von prächtigen Bäumen. Jeden Tag ging er mit den Zweigen siebenmal[a] um den Altar; am Morgen lobte er seinen Gott und dankte ihm voller Freude für alles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die von Charles herausgegebene äthiopische Textfassung ergänzt nach „siebenmal“ in eckigen Klammern nochmals „täglich“.
    reason: Die Klammern kennzeichnen einen editorischen Zusatz. Da „jeden Tag“ unmittelbar zuvor bereits im Text steht, wird die Wiederholung nicht in den Haupttext aufgenommen, aber textkritisch kenntlich gemacht.
lexical_decisions:
- source_word: ልበ፡ ፀበርት
  choice: Palmzweige
  rationale: Die Wortgruppe bezeichnet Zweige beziehungsweise Wedel von Palmen; „Palmzweige“ ist im Deutschen natürlich und sachlich genau.
- source_word: ፍሬ፡ ዕፀ፡ ሠናይ
  choice: Früchte von prächtigen Bäumen
  rationale: Wörtlich steht „Frucht/Früchte guter bzw. schöner Bäume“. „Prächtig“ bewahrt hier die wertende und ästhetische Bedeutungsbreite von ሠናይ, ohne eine bestimmte Baumart einzutragen.
- source_word: የዐውድ፡ ምሥዋዐ
  choice: ging … um den Altar
  rationale: Das Verb beschreibt das Umkreisen beziehungsweise Herumgehen; die finite deutsche Form gibt den wiederholten täglichen Vorgang idiomatisch wieder.
- source_word: ይሴብሕ፡ ወይጌኒ
  choice: lobte … und dankte
  rationale: Die beiden Verben bezeichnen Lobpreis und Dank; die koordinierte Wiedergabe erhält ihre Unterscheidung.
- source_word: በፍሥሓ
  choice: voller Freude
  rationale: Die adverbiale Wendung bedeutet „mit/in Freude“. „Voller Freude“ ist natürliches modernes Deutsch und bewahrt den freudigen Vollzug.
theological_decisions:
- issue: Bezug des Dankes
  choice: „dankte ihm … für alles“
  alternative: „bekannte alles vor seinem Gott“
  rationale: Im vorliegenden Kontext und in der überlieferten Auslegungstradition bezeichnet ይጌኒ das Danken. Das Pronomen „ihm“ macht im Deutschen lediglich den bereits genannten Empfänger explizit und fügt keine besondere Lehrposition hinzu.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Satzführung. Die Wiederholung des täglichen Rituals bleibt deutlich; unnötige, nur editorisch ergänzte Redundanz wird in die Fußnote verlagert. Das isolierte እሙሐዝ vor „Und Abraham“ wird als Rest des vorangehenden Satzzusammenhangs der Edition nicht in diesen Vers aufgenommen, entsprechend der Versabgrenzung der geprüften englischen Konsultationsfassung.
