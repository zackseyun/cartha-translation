base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/030.yaml
  text: It is an everlasting statute throughout their generations, year by year. And there is no limit of days for this, for it is ordained forever for Israel, that they should celebrate it and dwell in booths and wear crowns on their heads and take leafy branches and willows.
translation:
  language: de
  text: Dies ist eine ewige Satzung für ihre Generationen, Jahr für Jahr. Dafür gibt es keine zeitliche Grenze; denn es ist Israel für immer verordnet, dass sie es begehen, in Laubhütten wohnen, Kränze[a] auf dem Kopf tragen und Laubzweige und Weiden nehmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Kronen.'
    reason: Das geʿezische Wort kann sowohl einen Kranz als auch eine Krone bezeichnen.
lexical_decisions:
- source_word: ሕገ፡ ዘለዓለም
  choice: eine ewige Satzung
  rationale: Gibt die dauerhafte, verbindliche Anordnung des geʿezischen Ausdrucks in würdigem und verständlichem Deutsch wieder.
- source_word: በኵሉ፡ ዓመት፡ ወዓመት
  choice: Jahr für Jahr
  rationale: Natürliche deutsche Wiedergabe der wiederholenden Zeitangabe.
- source_word: ምጽላል
  choice: Laubhütten
  rationale: Der Zusammenhang bezeichnet die beim Fest bewohnten Hütten; „Laubhütten“ macht diesen kultischen Sachbezug verständlich, ohne zusätzliche Einzelheiten einzutragen.
- source_word: አክሊላተ
  choice: Kränze
  rationale: Das Wort kann Kronen oder Kränze bezeichnen; im Zusammenhang von Festschmuck ist „Kränze“ natürlich, während die Alternative in einer Fußnote erhalten bleibt.
- source_word: ዐጽቀ፡ ቈጽል
  choice: Laubzweige
  rationale: Kompakte deutsche Wiedergabe des Ausdrucks für belaubtes Pflanzenmaterial bzw. Zweige mit Blättern.
- source_word: ውኩሓ
  choice: Weidenzweige
  rationale: Gibt „Weiden“ kontextgerecht wieder. Die nicht im geʿezischen Text stehende Ergänzung „vom Bach“ wird nicht übernommen.
theological_decisions:
- issue: Dauer und Verbindlichkeit der Festordnung für Israel
  choice: „keine zeitliche Grenze“ und „Israel für immer verordnet“
  alternative: Die Dauer abzuschwächen oder auf einen begrenzten geschichtlichen Zeitraum zu beziehen
  rationale: Der Ausgangstext betont ausdrücklich sowohl das Fehlen eines Endpunkts als auch die immerwährende Anordnung; diese Spannung wird ohne konfessionelle Deutung bewahrt.
- issue: Subjekt des Festvollzugs
  choice: „dass sie es begehen“
  alternative: „dass man es begeht“
  rationale: Das pluralische Verb wird auf Israel beziehungsweise dessen Angehörige bezogen und in der deutschen Numerusform entsprechend wiedergegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gesetzessprachlichem Ton. Die Satzstruktur bleibt dem Ausgangstext nahe, wird aber für heutige Leser flüssig gegliedert. Nicht belegte Harmonisierung mit Levitikus 23,40 wurde vermieden.
