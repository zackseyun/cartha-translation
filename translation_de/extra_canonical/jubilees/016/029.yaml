  text: Therefore it is ordained on the heavenly tablets concerning Israel, that they should celebrate the feast of booths for seven days with joy in the seventh month, acceptable before the Lord.
translation:
  language: de
  text: Darum ist auf den himmlischen Tafeln hinsichtlich Israels festgelegt, dass sie im siebten Monat sieben Tage lang mit Freude das Laubhüttenfest feiern sollen, das vor dem Herrn wohlgefällig ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ተሠርዐ
  choice: ist … festgelegt
  rationale: Das Verb bezeichnet hier eine verbindliche Anordnung oder Festsetzung; die unpersönliche deutsche Form entspricht dem Zusammenhang mit den himmlischen Tafeln.
- source_word: ጽላተ፡ ሰማይ
  choice: himmlischen Tafeln
  rationale: Wörtliche und im Jubiläenbuch etablierte Wiedergabe der Tafeln, auf denen die göttliche Ordnung verzeichnet ist.
- source_word: በዓለ፡ መጸለት
  choice: Laubhüttenfest
  rationale: Bezeichnet das israelitische Fest der Hütten; „Laubhüttenfest“ ist die geläufige moderne deutsche Bezeichnung.
- source_word: በፍሥሓ
  choice: mit Freude
  rationale: Gibt die adverbiale Bestimmung schlicht und idiomatisch wieder.
- source_word: ዘይትወከፍ
  choice: wohlgefällig
  rationale: Das Wort bezeichnet hier das Angenommensein beziehungsweise Wohlgefallen vor Gott; die knappe Form bewahrt die syntaktische Offenheit des Ausgangstextes.
theological_decisions:
- issue: Bezug der abschließenden Wendung ዘይትወከፍ በቅድመ እግዚአብሔር
  choice: wohlgefällig vor dem Herrn
  alternative: sodass es vor dem Herrn angenommen wird
  rationale: Der Ausgangstext lässt den genauen Bezug der Relativform offen. Die knappe Haupttextfassung vermeidet, ausdrücklich festzulegen, ob das Fest, seine Feier oder Israel als wohlgefällig beziehungsweise angenommen gilt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Laubhüttenfest“ ist allgemein verständlich; „himmlische Tafeln“ hält die charakteristische Begrifflichkeit des Jubiläenbuches fest.
