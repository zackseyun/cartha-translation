revisions:
- from: 'Sie empfing einen Sohn. Im siebten Monat kehrten wir zurück und fanden Sara vor uns schwanger. Wir segneten ihn und teilten ihm alles mit, was seinetwegen angeordnet worden war: Er werde nicht sterben, bevor er sechs Söhne gezeugt und sie noch vor seinem Tod gesehen habe; und in Isaak würden ihm Name und Nachkommenschaft zugesprochen werden.[a]'
  to: 'Sie wurde mit einem Sohn schwanger. Im siebten Monat kehrten wir zurück und fanden Sara schwanger vor uns. Wir segneten ihn und teilten ihm alles mit, was ihm angeordnet worden war: Er werde nicht sterben, bis er sechs Söhne gezeugt und sie vor seinem Tod gesehen habe; und in Isaak würden ihm Name und Nachkommenschaft genannt werden.[a]'
  rationale: Die Korrektur ersetzt die unnatürliche Eingangswendung, stellt den Empfänger der Anordnungen wieder her und gibt das passive Verb im Schlussglied wortnäher wieder. „vor uns“, das nicht aus dem Vers heraus eindeutig erklärt werden kann, und die männlichen Pronominalbezüge bleiben unverändert offen.
