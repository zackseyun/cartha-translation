base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/016/001.yaml
  text: 'She conceived a son. And and we returned to Sarah in the seventh month and found that she had conceived before us. And we blessed him, and we told him all that had been commanded for him: that he would not die until he had begotten six sons and would see them before he died, and that in Isaac a name and seed would be called for him.'
translation:
  language: de
  text: 'Sie wurde mit einem Sohn schwanger. Im siebten Monat kehrten wir zurück und fanden Sara schwanger vor uns. Wir segneten ihn und teilten ihm alles mit, was ihm angeordnet worden war: Er werde nicht sterben, bis er sechs Söhne gezeugt und sie vor seinem Tod gesehen habe; und in Isaak würden ihm Name und Nachkommenschaft genannt werden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »und in Isaak werden ihm Name und Nachkommenschaft gerufen/genannt werden«. Die Formulierung ist ein semitisches Idiom und lässt die genaue Beziehung von Name, Nachkommenschaft und Isaak offen.'
    reason: Erläutert das im Deutschen ungewohnte passive Idiom, ohne dessen Deutung festzulegen.
lexical_decisions:
- source_word: ፀንሰት፡ ወልደ
  choice: Sie empfing einen Sohn
  rationale: Gibt den eigenständigen Eröffnungssatz wörtlich und ohne den in einer früheren Fassung ergänzten Abraham-Bezug wieder.
- source_word: በወርኅ፡ ሳብዕ
  choice: im siebten Monat
  rationale: Die Stellung im Satz bezieht die Zeitangabe am natürlichsten auf die Rückkehr.
- source_word: ቅድሜነ
  choice: vor uns
  rationale: Bewahrt die räumlich bzw. situativ offene Bedeutung des Ausdrucks, statt ihn erklärend aufzulösen.
- source_word: ስድስተ፡ ውሉደ
  choice: sechs Söhne
  rationale: Folgt der hier überlieferten und traditionell so verstandenen Formulierung; „Kinder“ wäre als allgemeinere Wiedergabe ebenfalls möglich.
- source_word: ወይሬኢ፡ ዘእንበለ፡ ይመት
  choice: und sie noch vor seinem Tod gesehen habe
  rationale: Das nicht ausdrücklich genannte Objekt wird aus den unmittelbar zuvor erwähnten sechs Söhnen erschlossen; die zeitliche Wendung „vor seinem Tod“ bleibt erhalten.
- source_word: ይጼዋዕ
  choice: zugesprochen werden
  rationale: Gibt das passive „gerufen/genannt werden“ in diesem semitischen Abstammungsidiom verständlich wieder, ohne den Sinn auf bloße Namensgebung zu verengen.
theological_decisions:
- issue: Verheißung von Name und Nachkommenschaft in Isaak
  choice: in Isaak würden ihm Name und Nachkommenschaft zugesprochen werden
  alternative: nach Isaak würden sein Name und seine Nachkommenschaft genannt werden
  rationale: Die gewählte Fassung bewahrt die schwer aufzulösende Verbindung von „Name“, „Nachkommenschaft“ und Isaak und vermeidet eine konfessionell oder dogmatisch zugespitzte Deutung.
- issue: Bezugswort des männlichen Pronomens in „wir segneten ihn“
  choice: Das Pronomen bleibt als „ihn“ stehen
  alternative: Abraham ausdrücklich einsetzen
  rationale: Der unmittelbare Vers nennt Abraham nicht ausdrücklich; eine namentliche Ergänzung würde die Quelle stärker erklären, als sie selbst formuliert.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die sperrige Ausgangssyntax wurde maßvoll geglättet; unklare Bezüge wurden nicht durch zusätzliche Eigennamen oder theologische Erläuterungen vereindeutigt.
