  source_fidelity: 'Der Entwurf gibt die wesentlichen Aussagen korrekt wieder: die Empfängnis eines Sohnes, die Rückkehr im siebten Monat, Saras Schwangerschaft, die sechs Söhne, ihr Sehen vor dem Tod sowie die Berufung von Name und Nachkommenschaft in Isaak. Die Formulierung „was seinetwegen angeordnet worden war“ verschiebt jedoch das ge''ezische „was ihm geboten/angeordnet worden war“ zu stark von der Person als Empfänger der Anweisung auf einen Zweckbezug.'
  naturalness: „Sie empfing einen Sohn“ ist im modernen Deutschen unidiomatisch und kann zudem wie eine Geburt klingen. „Sie wurde mit einem Sohn schwanger“ gibt die Empfängnis klar und natürlich wieder. Die übrige Syntax lässt sich leicht glätten, ohne die offenen Bezüge des Textes aufzulösen.
  terminology: „Sara“, „Isaak“, „sechs Söhne“ und „Nachkommenschaft“ sind angemessen. Für das passive Idiom „gerufen/genannt werden“ ist „genannt werden“ näher am Wortlaut als „zugesprochen werden“ und bleibt mit einer knappen Fußnote verständlich. Das Pronomen „ihm“ bleibt absichtlich unaufgelöst.
