revisions:
- from: Von dort zog er weiter und wohnte beim Eidbrunnen. Und in der Mitte des sechsten Monats suchte der HERR Sara heim.
  to: Von dort zog er weiter und wohnte beim Brunnen des Eides. Und in der Mitte des sechsten Monats besuchte der Herr Sara.
  rationale: Die Revision wahrt die im Audit bestätigte Bewegung und Ansiedlung sowie alle übrigen Angaben, ersetzt aber zwei deutsche Formulierungen, die entweder eine nicht im Wortlaut markierte Konvention („HERR“) oder eine unerwünschte negative Konnotation („heimsuchen“) eintragen. Eine Fußnote ist nicht nötig, da keine strittige Lesart im überlieferten ge'ezischen Wortlaut angezeigt ist.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:58:53Z'
review_pass:
  verdict: revise
  source_fidelity: Die Orts- und Zeitangaben sind zutreffend wiedergegeben. „zog er weiter und wohnte“ entspricht der im englischen Audit belegten Sinnfolge „moved and dwelt“. Für ሐወጻ ist „besuchte“ die unmittelbare und wertneutrale Wiedergabe; „suchte heim“ kann im heutigen Deutsch vor allem strafendes Eingreifen suggerieren. እግዚአብሔር lautet wörtlich „der Herr“ und enthält nicht selbst das Tetragramm, das die Schreibung „HERR“ konventionell markieren würde.
  naturalness: „Brunnen des Eides“ ist als transparente, natürliche Wiedergabe der Ortsbezeichnung klarer als die weniger geläufige Zusammensetzung „Eidbrunnen“. „Der Herr besuchte Sara“ ist modernes, würdiges Bibeldeutsch und vermeidet die im Gegenwartsdeutschen missverständliche negative Nebenbedeutung von „heimsuchen“.
  terminology: „der Herr“ gibt die ge'ezische Gottesbezeichnung ohne zusätzliche spezifische Namenskonvention wieder. „Brunnen des Eides“ bewahrt die Bedeutung des Ortsnamens, ohne ihn vorschnell durch eine moderne Eigennameform zu ersetzen.
  issues:
  - severity: medium
    issue: „suchte der HERR Sara heim“ ist semantisch und registerbedingt unnötig eingeengt.
    rationale: Das zugrunde liegende Verb bezeichnet ein Besuchen/Aufsuchen. „Heimsuchen“ wird im modernen Deutsch häufig mit Unheil oder Strafe verbunden, während der vorliegende Wortlaut diese Wertung nicht ausdrücklich trägt.
  - severity: low
    issue: Die Schreibung „HERR“ ist für እግዚአብሔር nicht quellentextlich erforderlich.
    rationale: Die Kapitälchenschreibung dient im Deutschen typischerweise als Konvention für den Gottesnamen JHWH. Die ge'ezische Vorlage hat hier die allgemeine Gottesbezeichnung „der Herr“.
  - severity: low
    issue: „Eidbrunnen“ ist weniger idiomatisch und weniger eindeutig als „Brunnen des Eides“.
    rationale: Die Genitivfügung bildet die Wortgruppe ዐዘቅት፡ መሐላ unmittelbar ab und ist im modernen Deutsch leichter verständlich.
  revised_text: Von dort zog er weiter und wohnte beim Brunnen des Eides. Und in der Mitte des sechsten Monats besuchte der Herr Sara.
