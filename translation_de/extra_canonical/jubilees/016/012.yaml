  text: From there he moved and dwelt by the Well of the Oath. And in the middle of the sixth month the Lord visited Sarah
translation:
  language: de
  text: Von dort zog er weiter und wohnte beim Brunnen des Eides. Und in der Mitte des sechsten Monats besuchte der Herr Sara.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምህየ
  choice: Von dort
  rationale: Gibt die lokale Herkunftsangabe präzise und natürlich wieder.
- source_word: ወኀደረ
  choice: zog er weiter und wohnte
  rationale: Im Zusammenhang mit እምህየ bezeichnet das Verb das Aufbrechen beziehungsweise Weiterziehen mit anschließendem Aufenthalt; diese Wiedergabe erhält beide im Kontext naheliegenden Aspekte.
- source_word: ኀበ ዐዘቅት መሐላ
  choice: beim Eidbrunnen
  rationale: Die Wortgruppe bezeichnet den „Brunnen des Eides“, also Beerscheba; die kompakte deutsche Zusammensetzung ist verständlich und wahrt die Namensbedeutung.
- source_word: ወበመንፈቀ ወርኅ ሳድስ
  choice: Und in der Mitte des sechsten Monats
  rationale: Formnahe Wiedergabe der Zeitangabe.
- source_word: ሐወጻ
  choice: suchte … heim
  rationale: Das Verb bedeutet hier göttliches Aufsuchen beziehungsweise gnädiges Eingreifen; „heimsuchen“ bewahrt die biblische Ausdrucksweise und ihre inhaltliche Offenheit.
- source_word: እግዚአብሔር
  choice: der HERR
  rationale: Die übliche deutsch-biblische Wiedergabe der Gottesbezeichnung.
theological_decisions:
- issue: Bedeutung des göttlichen Besuchens Saras
  choice: suchte der HERR Sara heim
  alternative: besuchte der Herr Sara
  rationale: „Heimsuchen“ lässt offen, wie sich Gottes Zuwendung konkret vollzieht, und bewahrt den heilsgeschichtlichen Klang, ohne eine zusätzliche Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Bibeldeutsch. Der Ortsname wird bedeutungstransparent als „Eidbrunnen“ wiedergegeben; die frühere Lesart „Eiche von Mamre“ wird vom vorliegenden ge'ezischen Wortlaut nicht gestützt.
