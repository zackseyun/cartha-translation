  text: He overthrew it. And he and his daughters also committed sin upon the earth, such as had not been on the earth.
translation:
  language: de
  text: Er zerstörte sie. Auch er und seine Töchter begingen auf der Erde eine Sünde, wie es sie zuvor auf der Erde nicht gegeben hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ገፍታአ
  choice: Er stürzte sie um
  rationale: Das Verb bezeichnet hier das Umstürzen bzw. Zerstören der zuvor genannten Stadt; das feminine Pronomen wird im Deutschen mit „sie“ wiedergegeben.
- source_word: ኀጢአተ
  choice: eine Sünde
  rationale: Das Substantiv steht als Gegenstand von „begingen“ und wird in natürlichem Deutsch idiomatisch wiedergegeben.
- source_word: ዘአኮ ዲበ ምድር
  choice: wie es sie zuvor auf der Erde nicht gegeben hatte
  rationale: Die Wendung drückt aus, dass eine solche Sünde bis dahin auf der Erde ohne Beispiel war; „zuvor“ macht den zeitlichen Bezug im Deutschen deutlich.
theological_decisions:
- issue: Bezug des männlichen Subjekts im zweiten Satz
  choice: „er“ bleibt ohne ausdrückliche Identifizierung stehen
  alternative: das Subjekt ausdrücklich als Lot benennen
  rationale: Der Ausgangstext verwendet lediglich ein Pronomen. Die Identifizierung ergibt sich aus dem Kontext und soll nicht erklärend in den Vers eingefügt werden.
- issue: Art der Sünde
  choice: allgemein als „eine Sünde“ wiedergegeben
  alternative: die konkrete sexuelle Verfehlung ausdrücklich benennen
  rationale: Der Ausgangstext spezifiziert die Tat an dieser Stelle nicht; eine Konkretisierung würde die Spannung des Wortlauts auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die beiden Sätze und der abrupte Subjektwechsel des Ausgangstextes bleiben erhalten; zugleich ist die Formulierung idiomatisch und gut verständlich.
