  yaml_path: translation/extra_canonical/jubilees/041/027.yaml
  text: And by this he will turn away wrath and punishment from Israel. And to Judah we said that his two sons had not lain with her, and because of this his seed was established for another tribe and was not uprooted.
translation:
  language: de
  text: Und dadurch wird er Zorn und Strafe von Israel abwenden. Und wir sagten Juda, dass seine beiden Söhne nicht bei ihr gelegen hatten; deshalb wurde seine Nachkommenschaft für einen anderen Stamm bestätigt und nicht ausgerottet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወበእሊአሁ
  choice: Und dadurch
  rationale: Gibt die instrumentale beziehungsweise begründende Wendung wieder und bewahrt ihren Rückbezug auf das Vorangehende.
- source_word: ያነድግ
  choice: wird er … abwenden
  rationale: 'Entspricht dem kausativen Sinn im Kontext: Zorn und Strafe werden von Israel ferngehalten.'
- source_word: መዐተ፡ መመቅሠፍተ
  choice: Zorn und Strafe
  rationale: Bewahrt die zwei aufeinander bezogenen Unheilsbegriffe, ohne sie zu einem einzigen Begriff zu verschmelzen.
- source_word: ነገሮሙ
  choice: sagten wir
  rationale: Folgt der überlieferten ersten Person Plural und bewahrt den Erzählrahmen der Engelsrede; die Form wird nicht unnötig passiviert.
- source_word: ኢበከቡ፡ ምስሌነ
  choice: nicht bei ihr gelegen hatten
  rationale: Natürliches, zugleich zurückhaltendes Deutsch für den sexuellen Sinn von „liegen bei“; das Plusquamperfekt markiert die Vorzeitigkeit.
- source_word: ቆመ፡ ዘርአ
  choice: wurde seine Nachkommenschaft … bestätigt
  rationale: Gibt das Bestehen beziehungsweise Feststehen des Samens wieder; „Nachkommenschaft“ ist im Deutschen verständlicher als das wörtliche „Same“.
- source_word: ለካልእ፡ ነገደ
  choice: für einen anderen Stamm
  rationale: Bewahrt die Zuordnung zu einem anderen Stamm, ohne dessen Identität erklärend festzulegen.
- source_word: ወኢይሤረወ
  choice: und nicht ausgerottet
  rationale: Erhält das starke Bild des Nicht-Auslöschens der genealogischen Linie.
theological_decisions:
- issue: Sprecherperspektive bei ነገሮሙ
  choice: 'erste Person Plural: „sagten wir“'
  alternative: 'unpersönliches Passiv: „wurde gesagt“'
  rationale: Die erste Person Plural ist textlich und im narrativen Rahmen von Jubiläen bedeutsam; eine Passivierung würde diese Sprecherperspektive verdecken.
- issue: Bedeutung von „Nachkommenschaft für einen anderen Stamm“
  choice: offen und wörtlich-nah belassen
  alternative: den anderen Stamm ausdrücklich identifizieren oder die Aussage genealogisch ausdeuten
  rationale: Der Vers selbst nennt den Stamm nicht. Die Übersetzung soll die theologische und genealogische Spannung nicht durch eine eingefügte Erklärung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit moderater formaler Nähe zum ge’ezischen Text. Der Parallelismus bleibt sichtbar; „bei ihr gelegen“ wahrt den biblischen Ton, ohne unverständlich oder unnötig explizit zu werden.
