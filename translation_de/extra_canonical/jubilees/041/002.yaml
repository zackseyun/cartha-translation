  source_fidelity: 'Der Entwurf gibt die wesentlichen Aussagen des ge''ezischen Textes zutreffend wieder: Juda nimmt für Er, seinen Erstgeborenen, Tamar von den „Töchtern Arams“ zur Frau; Er weist sie ab, vollzieht die Ehe nicht, und als Begründung werden die kanaanäische Herkunft seiner Mutter sowie sein Wunsch nach einer Frau aus deren Verwandtschaft genannt. Die Herkunftsformeln und die erzählerische Kausalität bleiben erhalten.'
  naturalness: Der eröffnende Satz „Für seinen Erstgeborenen Er nahm er“ ist im modernen Standarddeutsch deutlich unnatürlich und erschwert die Zuordnung von Name und Verwandtschaftsbezeichnung. Eine Umstellung stellt den Satz idiomatisch klar, ohne etwas hinzuzufügen. Der Eigenname Er sollte dabei nicht wie das Pronomen behandelt werden.
  terminology: „Töchter Arams/Kanaans“, „schlief nicht mit ihr“ und „Verwandtschaft seiner Mutter“ sind angemessen und quellentreu. „Wies sie zurück“ ist als kontextuelle Wiedergabe des ablehnenden Verbs vertretbar, ohne die stärkere mögliche Nuance „hasste“ zwingend festzulegen.
