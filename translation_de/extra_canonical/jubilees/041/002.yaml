base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/041/002.yaml
  text: For Er his firstborn he took a wife from the daughters of Aram, and her name was Tamar. But he rejected her and did not lie with her, because his mother was from the daughters of Canaan, and he wanted to take for himself a wife from the kin of his mother.
translation:
  language: de
  text: Er nahm für seinen erstgeborenen Sohn Er eine Frau von den Töchtern Arams; ihr Name war Tamar. Er aber wies sie zurück und schlief nicht mit ihr, denn seine Mutter stammte von den Töchtern Kanaans, und er wollte sich eine Frau aus der Verwandtschaft seiner Mutter nehmen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በኵሩ
  choice: seinen Erstgeborenen
  rationale: Gibt die verwandtschaftliche Stellung Ers knapp und natürlich wieder.
- source_word: አዋልደ፡ አራም
  choice: den Töchtern Arams
  rationale: Bewahrt die semitische Herkunftsformel des Ausgangstextes, ohne sie zu einer präziseren ethnischen Bezeichnung umzudeuten.
- source_word: ጸልአ
  choice: wies sie zurück
  rationale: Der Kontext bezeichnet Ers ablehnende Haltung gegenüber Tamar; „wies sie zurück“ ist idiomatisch und vermeidet die möglicherweise zu starke Festlegung auf „hasste“.
- source_word: ኢሰከበ፡ ምስሌሃ
  choice: schlief nicht mit ihr
  rationale: Gibt den sexuellen Sinn der Wendung klar, würdig und allgemeinverständlich wieder.
- source_word: ነገደ፡ እሙ
  choice: der Verwandtschaft seiner Mutter
  rationale: „Verwandtschaft“ bildet die hier gemeinte familiäre beziehungsweise stammesmäßige Zugehörigkeit natürlich ab, ohne sie unnötig einzuengen.
theological_decisions:
- issue: Bezug des Subjekts bei Ers Ablehnung Tamars
  choice: „Doch Er wies sie zurück“
  alternative: „Doch er hasste sie“
  rationale: Die Namensnennung verhindert im Deutschen eine mögliche Verwechslung mit Juda; zugleich bleibt die Aussage eine Charakterisierung Ers und wird nicht theologisch erweitert.
- issue: Motiv für Ers Verhalten
  choice: kausale Aussage unverändert als Ers Herkunftspräferenz wiedergegeben
  alternative: das Motiv moralisch oder heilsgeschichtlich erklären
  rationale: Der Text nennt als Grund die kanaanäische Herkunft seiner Mutter und Ers Wunsch nach einer Frau aus deren Verwandtschaft. Diese Spannung wird ohne zusätzliche Wertung bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht biblisch geprägte Formel „Töchter Arams/Kanaans“ bleibt erhalten; Satzbau und Verben sind zugleich für heutige Leser unmittelbar verständlich.
