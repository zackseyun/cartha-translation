  source_fidelity: 'Der Text gibt die erhaltenen ge''ezischen Satzteile genau wieder: ዘርአ ist kontextgerecht zunächst mit „Nachkommen“ und bei Onans Handlung mit „Samen“ übersetzt. Die Zuordnung der Nachkommenschaft zu Onans Bruder, das Eingehen zur Frau des Bruders und das Fallenlassen des Samens auf die Erde sind sachlich und ohne zusätzliche Auslegung wiedergegeben. Der am Quellenende unvollständige Ausdruck „in den Augen von“ wird nicht durch eine Ergänzung aus Genesis oder einer anderen Überlieferung vervollständigt.'
