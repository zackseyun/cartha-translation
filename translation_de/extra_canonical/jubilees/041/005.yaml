lexical_decisions:
- source_word: ዘርአ
  choice: Nachkommen / Samen
  rationale: Das äthiopische Wort bezeichnet je nach Zusammenhang sowohl Nachkommenschaft als auch Samen. Der deutsche Text gibt diese Bedeutungsverschiebung entsprechend dem jeweiligen Satz wieder.
- source_word: ቦአ፡ ቤተ፡ ብእሲተ፡ እኁሁ
  choice: zur Frau seines Bruders einging
  rationale: Die verhüllende biblische Ausdrucksweise für den Geschlechtsverkehr wird würdig und quellennah bewahrt.
- source_word: ከዐወ
  choice: ließ … fallen
  rationale: Die Form bezeichnet das Ausgießen beziehungsweise Fallenlassen; zusammen mit „Samen“ und „auf die Erde“ ergibt sich eine natürliche, ohne zusätzliche Deutung auskommende Wiedergabe.
- source_word: እኩየ
  choice: böse
  rationale: Die wertende Aussage wird direkt wiedergegeben, ohne ihre moralische Tragweite näher zu bestimmen.
theological_decisions:
- issue: Zugehörigkeit der Nachkommen
  choice: nicht ihm, sondern seinem Bruder gehören würden
  alternative: nicht seine, sondern die seines Bruders wären
  rationale: Die gewählte Formulierung wahrt die rechtlich-familiäre Zuordnung der Nachkommen und liest keine weitergehende Lehre in den Satz hinein.
- issue: Unvollständiger Versschluss
  choice: Auslassungspunkte mit Fußnote
  alternative: Ergänzung „des Herrn“ nach Genesis 38,10 beziehungsweise einer Folgezeile
  rationale: Der bereitgestellte ge'ezische Quelltext endet bei „in den Augen von“ und nennt das Bezugswort nicht. Es wird daher nichts stillschweigend aus einer Parallelüberlieferung ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem biblischem Euphemismus. Der fragmentarische Anfang und Schluss werden als solche belassen; die Ellipse am Anfang ist durch das eröffnende Zitat erkennbar, der fehlende Versschluss wird ausdrücklich vermerkt.
