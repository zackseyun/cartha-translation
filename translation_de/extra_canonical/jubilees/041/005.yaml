  terminology: „Nachkommen“, „Samen“, „zur Frau ... eingehen“ und „böse“ sind terminologisch passend. Die Formulierung „nicht ihm, sondern seinem Bruder gehören würden“ gibt die familiär-rechtliche Zuordnung natürlich wieder, ohne eine konfessionell geprägte Deutung einzutragen.
