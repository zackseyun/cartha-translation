  text: „Nachkommen für deinen Bruder.“ Und Onan wusste, dass die Nachkommen nicht ihm, sondern seinem Bruder gehören würden. Wenn er zur Frau seines Bruders einging, ließ er den Samen auf die Erde fallen. Und es war böse in den Augen …[a]
