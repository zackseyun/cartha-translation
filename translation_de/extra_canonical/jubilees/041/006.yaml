translation:
  language: de
  text: 'der HERR, und er tötete ihn. Und Juda sagte zu Tamar, seiner Schwiegertochter: »Bleib im Haus deines Vaters, während …«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der bereitgestellte äthiopische Quelltext bricht nach dem Wort für »während/als« ab.
    reason: Der Abbruch wird kenntlich gemacht, ohne die im Quellsegment fehlende Fortsetzung aus Parallelüberlieferungen oder dem Kontext zu ergänzen.
lexical_decisions:
- source_word: እግዚአብሔር
  choice: der HERR
  rationale: Die Gottesbezeichnung wird in würdiger, in deutschen Bibelübersetzungen vertrauter Form wiedergegeben; der überlieferte Ausschnitt setzt mitten im Satz ein.
- source_word: ወቀተሎ
  choice: und er tötete ihn
  rationale: Gibt die koordinierte Verbform mit männlichem Subjekt und Objekt unmittelbar wieder.
- source_word: መርዓቱ
  choice: seiner Schwiegertochter
  rationale: Bezeichnet hier Tamars verwandtschaftliche Stellung zu Juda.
- source_word: ንበሪ፡ ቤተ፡ አቡኪ
  choice: Bleib im Haus deines Vaters
  rationale: Natürliche moderne Wiedergabe des femininen Imperativs und der Ortsangabe.
- source_word: እንዘ
  choice: während …
  rationale: Die Konjunktion eröffnet eine noch nicht vorliegende Fortsetzung; die Auslassungspunkte bewahren den fragmentarischen Stand des bereitgestellten Quelltexts.
theological_decisions:
- issue: Bezug des Pronomens in „und er tötete ihn“
  choice: Das Pronomen bleibt ohne ergänzende Namensnennung stehen.
  alternative: Den aus dem Kontext erschließbaren Handelnden oder Getöteten ausdrücklich benennen.
  rationale: Der vorgelegte Quellausschnitt beginnt mitten im Satz. Eine Namensnennung würde nicht im bereitgestellten Text enthaltene Information eintragen.
translation_notes:
  register: Modernes, klares und zugleich bibelsprachlich würdiges Deutsch. Der Satzanfang und das Satzende bleiben entsprechend dem fragmentarisch bereitgestellten Quellsegment unvollständig.
