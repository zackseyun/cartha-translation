  text: … seine Schafe in Timna. Da legte sie ihre Witwenkleider ab, legte einen Schleier an und schmückte sich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አልባሰ፡ ምዕስብናሃ
  choice: die Kleider ihrer Witwenschaft
  rationale: Die Wendung bezeichnet ihre Witwenkleidung beziehungsweise die Kleidung, die ihren Stand als Witwe sichtbar machte; die formnahe Wiedergabe bewahrt dieses Motiv.
- source_word: ገልባቤ
  choice: einen Schleier
  rationale: Das Wort bezeichnet eine verhüllende Bedeckung; im erzählerischen Zusammenhang ist „Schleier“ die natürliche deutsche Entsprechung.
- source_word: ወተሣየየት
  choice: und schmückte sich
  rationale: Gibt die reflexive Handlung des Sich-Zurechtmachens beziehungsweise Schmückens knapp und idiomatisch wieder.
- source_word: በቴምናታ
  choice: in Timna
  rationale: Die Ortsangabe wird entsprechend dem überlieferten Text als Aufenthalt beziehungsweise Ziel in Timna wiedergegeben.
