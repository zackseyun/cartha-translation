  source_fidelity: 'Die Übersetzung gibt die drei Sinnschritte des ge''ezischen Textes zuverlässig wieder: Aufforderung zum Beischlaf mit der Frau des verstorbenen Bruders, Erfüllung der leviratsrechtlichen Pflicht und Sicherung von Nachkommen für den Bruder. Die explizite Zuordnung Onans zu Er entspricht dem unmittelbaren Kontext und verhindert eine im Deutschen naheliegende, aber falsche Zuordnung zu Juda.'
