  text: And Judah said to Onan, his brother,, “Go in to your brother’s wife, and perform a brother-in-law’s duty to her, and raise up offspring for your brother.”
translation:
  language: de
  text: Da sagte Juda zu Onan, Ers Bruder:[a] »Geh zur Frau deines Bruders ein, erfülle ihr gegenüber die Schwagerpflicht und erwecke deinem Bruder Nachkommen.«
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »zu Onan, seinem Bruder«; gemeint ist Ers Bruder.'
    reason: Die wörtliche Pronomenwiedergabe könnte im Deutschen fälschlich so verstanden werden, als sei Onan Judas Bruder.
lexical_decisions:
- source_word: ባእ፡ ኀበ፡ ብእሲተ፡ እኁከ
  choice: Geh zur Frau deines Bruders ein
  rationale: Die Wendung wird als verhüllende, in biblischem Deutsch geläufige Bezeichnung für den ehelichen Verkehr wiedergegeben; zugleich bleibt die formale Nähe zu »hineingehen zu« erhalten.
- source_word: ወረከያ፡ ናዕልተ
  choice: erfülle an ihr die Schwagerpflicht
  rationale: Der Ausdruck bezeichnet im Kontext die Pflicht des Schwagers gegenüber der Witwe seines verstorbenen Bruders. »Schwagerpflicht« ist prägnant, verständlich und vermeidet eine konfessionelle Zusatzdeutung.
- source_word: ወአንሥእ
  choice: und erwecke deinem Bruder Nachkommen
  rationale: Das Verb bedeutet wörtlich »aufrichten/erwecken«; das im Zusammenhang vorausgesetzte Objekt wird als »Nachkommen« ausgedrückt. So bleibt die traditionelle Bildsprache erhalten, ohne im Deutschen unvollständig zu wirken.
- source_word: እኁሁ
  choice: dem Bruder Ers
  rationale: Das wörtliche Pronomen »sein Bruder« bezieht sich dem Zusammenhang nach auf den verstorbenen Er, nicht auf Juda. Die explizite Namensnennung verhindert im Deutschen eine genealogisch falsche Zuordnung.
theological_decisions:
- issue: Bezug des Possessivpronomens bei Onan
  choice: dem Bruder Ers
  alternative: seinem Bruder
  rationale: Die pronominale Form ist formal knapp, doch »seinem Bruder« würde im Deutschen regulär Juda als Bezug nahelegen. Der erzählerische Zusammenhang identifiziert Onan eindeutig als Ers Bruder; die Fußnote dokumentiert die wörtlichere Form.
- issue: Implizites Objekt von »erwecken«
  choice: Nachkommen
  alternative: Samen
  rationale: Gemeint ist die Fortführung der Linie des verstorbenen Bruders. »Nachkommen« gibt den Sinn natürlich wieder und vermeidet eine im modernen Deutschen missverständliche Wiedergabe mit »Samen«.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener biblischer Wendung »zur Frau … eingehen« und dem sachlich etablierten Begriff »Schwagerpflicht«. Die Syntax wurde geglättet, ohne den knappen Erzählstil oder die leviratsrechtliche Spannung des Ausgangstextes aufzulösen.
