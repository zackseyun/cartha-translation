  text: And in the fifth year of this week, Shua, the wife of Judah, died. And in the sixth year Judah went up to shear his sheep at Timnah, and they told Tamar, saying, “Behold, your father-in-law is going up to Timnah to shear.”
translation:
  language: de
  text: 'Im fünften Jahr dieser Jahrwoche starb Schua, die Frau Judas.[a] Im sechsten Jahr zog Juda nach Timna hinauf, um seine Schafe zu scheren. Da berichtete man Tamar: »Siehe, dein Schwiegervater zieht nach Timna hinauf, um zu scheren.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im vorliegenden ge’ezischen Wortlaut fehlt an dieser Stelle das Verb »starb«; es ist aus Satzbau und Zusammenhang zu ergänzen.
    reason: source_ellipsis
lexical_decisions:
- source_word: ዘዝሱባዔ
  choice: dieser Jahrwoche
  rationale: Die Form bezeichnet »diese Woche«; im chronologischen System des Jubiläenbuches ist mit »Jahrwoche« eine Siebenjahresperiode gemeint. Eine Wiedergabe als »siebte Jahrwoche« wäre nicht quellengemäß.
- source_word: ዐርገ
  choice: zog … hinauf / zieht … hinauf
  rationale: Bewahrt die räumliche Bewegungsangabe des ge’ezischen Verbs und klingt im Deutschen bei einer Reise zu einem Ort natürlich.
- source_word: ይቅርጽ
  choice: um … zu scheren
  rationale: Gibt den Zweck des Hinaufziehens wieder. Bei der zweiten Nennung wird das im Ausgangstext nicht wiederholte Objekt ebenfalls ausgelassen.
- source_word: አባግዒሁ
  choice: seine Schafe
  rationale: Das ausdrücklich genannte Objekt wird bei der ersten Nennung vollständig wiedergegeben.
- source_word: ቴምናታ
  choice: Timna
  rationale: Verwendet die im modernen deutschen Bibelgebrauch geläufige Form des Ortsnamens.
theological_decisions:
- issue: Identität Schuas
  choice: Schua, die Frau Judas
  alternative: die Tochter Schuas / Judas Frau, die Tochter Schuas
  rationale: Der vorgelegte ge’ezische Text bezeichnet Schua ausdrücklich als Judas Frau. Die abweichende Darstellung in Genesis 38 wird nicht harmonisierend in diesen Text eingetragen.
- issue: Chronologische Formel
  choice: dieser Jahrwoche
  alternative: der siebten Jahrwoche
  rationale: Die Quelle sagt »dieser« und nicht »siebten«. »Jahrwoche« macht zugleich die im Jubiläenbuch vorausgesetzte Siebenjahresperiode verständlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Erzählung bleibt knapp; »Da berichtete man« gibt den unbestimmten Plural idiomatisch wieder. Das zweite »um zu scheren« bewahrt die Kürze der Quelle, die »seine Schafe« dort nicht wiederholt.
