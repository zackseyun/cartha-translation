  text: For he went in the innocence of his eyes and sought judgment, because by the judgment of Abraham, which he commanded his sons, Judah desired that she be burned with fire.
translation:
  language: de
  text: Denn in der Unschuld seines Blicks ging er hin und suchte ein Urteil; denn nach dem Urteil Abrahams, das dieser seinen Söhnen geboten hatte, wollte Juda, dass sie im Feuer verbrannt werde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በየውሀተ፡ አዕይንቲሁ
  choice: in der Unschuld seines Blicks
  rationale: የውሀት bezeichnet Unschuld, Einfalt oder Lauterkeit. Die idiomatische Wendung mit „Augen“ wird im Deutschen als „Blick“ wiedergegeben, ohne die frühere, lexikalisch unbegründete Deutung „Verlangen“ zu übernehmen.
- source_word: ኀሠሠ፡ ኵነኔ
  choice: verlangte ein Urteil
  rationale: Die Verbindung bezeichnet das Suchen beziehungsweise Fordern eines gerichtlichen Urteils; „verlangte ein Urteil“ ist in diesem Zusammenhang natürlich und wahrt den Rechtscharakter.
- source_word: እምፍተሐ፡ አብርሃም
  choice: nach dem Urteil Abrahams
  rationale: Obwohl እም grundsätzlich „von/aus“ bedeuten kann, bezeichnet es hier die maßgebliche Grundlage. „Nach dem Urteil“ gibt diesen normativen Sinn idiomatisch wieder.
- source_word: ፈቃደ፡ ይሁዳ
  choice: wollte Juda
  rationale: ፈቀደ bezeichnet hier Judas Willen oder Entschluss; die schlichte Wiedergabe „wollte“ bewahrt die Aussage, ohne sein Motiv weiter auszudeuten.
- source_word: ይውዐይ፡ በእሳት
  choice: dass sie im Feuer verbrannt werde
  rationale: Die passive Verbform und በእሳት werden formal und zugleich idiomatisch als Hinrichtung durch Verbrennen wiedergegeben.
theological_decisions:
- issue: Bewertung von Judas Vorgehen
  choice: „in der Unschuld seines Blicks“
  alternative: „dem Verlangen seiner Augen folgend“
  rationale: Der überlieferte geezische Ausdruck spricht von Unschuld, Einfalt oder Lauterkeit und stellt Judas Vorgehen damit als subjektiv schuldlos dar. Die Alternative „Verlangen“ beruht auf einer unzutreffenden lexikalischen Deutung und würde den Sinn umkehren.
- issue: Verhältnis von Abrahams Urteil zu Judas Entscheidung
  choice: „nach dem Urteil Abrahams“
  alternative: „von dem Urteil Abrahams her“
  rationale: Die Formulierung lässt Abrahams Anordnung als Rechtsgrundlage erscheinen, ohne zusätzliche Aussagen über ihre theologische Geltung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Bildsprache der Quelle bleibt in der Wendung „Unschuld seines Blicks“ erkennbar, wird aber gegenüber einer völlig wörtlichen Formulierung mit „Augen“ leicht idiomatisiert. Der Satzbau folgt der begründenden Doppelstruktur des Originals.
