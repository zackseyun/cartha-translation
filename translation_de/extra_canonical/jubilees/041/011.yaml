  text: And he thought her to be a prostitute and said to her, “Let me come in to you,” and she said to him, “Come,” and he went in. And she said to him,
translation:
  language: de
  text: 'Und er hielt sie für eine Prostituierte und sagte zu ihr: »Lass mich zu dir kommen.«[a] Sie sagte zu ihm: »Komm«, und er ging hinein. Dann sagte sie zu ihm:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »Lass mich zu dir hineingehen.«'
    reason: Die Formulierung gibt die räumliche Grundbedeutung des geezischen Verbs wieder und macht die mögliche engere Wiedergabe sichtbar, ohne den Haupttext unnötig steif klingen zu lassen.
lexical_decisions:
- source_word: ተሐዘባ (taḥazaba)
  choice: hielt sie für
  rationale: Das Verb bezeichnet hier ein Denken, Annehmen oder Dafürhalten, nicht ein tatsächliches Erkennen. Die Formulierung wahrt, dass seine Einschätzung ihrer Identität beziehungsweise Stellung irrig war.
- source_word: ዘማዊት (zamāwit)
  choice: Prostituierte
  rationale: Das feminine Substantiv bezeichnet in diesem Zusammenhang eine Frau, die sexuelle Dienste anbietet; „Prostituierte“ ist die klare, moderne und würdevolle deutsche Entsprechung.
- source_word: እባእ ኀቤኪ (ʾebāʾ ḫabēki)
  choice: Lass mich zu dir kommen
  rationale: 'Die Wendung ist in der ersten Person formuliert und bittet um Erlaubnis: Er fordert nicht sie auf, zu ihm zu kommen. „Kommen“ bewahrt zugleich den kontextuellen sexuellen Nebensinn, ohne ihn auszuformulieren.'
- source_word: ባእ (bāʾ)
  choice: Komm
  rationale: Ihre knappe Antwort greift sein Verb auf und erteilt die erbetene Zustimmung.
- source_word: ወቦአ (waboʾa)
  choice: und er ging hinein
  rationale: Die Erzählform bezeichnet sein Hineingehen. Das Deutsche vermeidet ein zusätzliches Objekt, das im Ausgangstext an dieser Stelle nicht wiederholt wird.
theological_decisions:
- issue: Sexuelle Bedeutung der Bewegungsverben
  choice: Die verhüllende Redeweise „zu dir kommen“ beziehungsweise „hineingehen“ bleibt im Haupttext erhalten.
  alternative: Den Geschlechtsverkehr ausdrücklich benennen.
  rationale: Der Ausgangstext verwendet Bewegungsverben, die im Kontext sexuell verstanden werden, formuliert den Vorgang jedoch nicht explizit. Die Übersetzung wahrt diese Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der unvollständige Schlusssatz wird entsprechend der Versabgrenzung der Quelle beibehalten.
