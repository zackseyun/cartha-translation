  source_fidelity: 'Der Text gibt die geezische Abfolge und Aussage zuverlässig wieder: Er hält sie irrig für eine Prostituierte, bittet darum, zu ihr zu kommen, erhält ihre Zustimmung, geht hinein, und der unvollständige Anschluss „Dann sagte sie zu ihm:“ bleibt wie in der Versabgrenzung erhalten. „Hielt sie für“ trifft ተሐዘባ besser als ein Verb des Erkennens. Die Umschreibung „zu dir kommen“ bewahrt den im Kontext sexuellen, aber im Wortlaut verhüllten Bewegungsidiom.'
  naturalness: Modernes, flüssiges Standarddeutsch mit angemessen zurückhaltendem Erzählton. „Lass mich zu dir kommen“ ist idiomatisch und lässt die erste Person der geezischen Bitte klar erkennen. „Komm“ und „er ging hinein“ sind knapp und natürlich.
  terminology: „Prostituierte“ ist eine sachliche moderne Entsprechung für ዘማዊት. Die Bewegungsverben werden weder unangemessen explizit noch verharmlosend übertragen. Die Fußnote erläutert die engere räumliche Nuance, ohne den Haupttext zu überladen.
