base_translation:
  language: en
  yaml_path: translation/extra_canonical/jubilees/041/007.yaml
  text: Remain a widow until my son Shelah grows up, and I will give you to him as a wife. And he grew up, but Bedsu’el, Judah’s wife, did not let Shelah her son to marry, and Bed[su'el] died.
translation:
  language: de
  text: „Bleib Witwe, bis mein Sohn Schela herangewachsen ist; dann werde ich dich ihm zur Frau geben.“ Und er wuchs heran, doch Bedsuël, die Frau Judas, ließ nicht zu, dass ihr Sohn Schela heiratete. Und Bed[suël] starb.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte ge’ezische Text endet hier mit dem abgebrochenen Namen „Bed“. Die Ergänzung „suël“ ergibt sich aus dem unmittelbar zuvor genannten Namen Bedsuël.
    reason: textual_truncation
lexical_decisions:
- source_word: ትመዐስቢ
  choice: Bleib Witwe
  rationale: Die Form bezeichnet nicht bloß ein Warten, sondern ausdrücklich das Verbleiben im Witwenstand; dies bewahrt das rechtliche und erzählerische Gewicht der Aussage.
- source_word: ይልህቅ / ወልህቀ
  choice: herangewachsen ist / Und er wuchs heran
  rationale: Beide Formen desselben Verbs werden wiedergegeben; insbesondere darf die zweite Aussage über Schelas tatsächliches Heranwachsen nicht entfallen.
- source_word: ወእሁበኪ፡ ሎቱ፡ ብእሲተ
  choice: dann werde ich dich ihm zur Frau geben
  rationale: Natürliche deutsche Wiedergabe der Zusage, Tamar Schela als Ehefrau zu geben.
- source_word: ወኢኀደገት
  choice: ließ nicht zu
  rationale: Gibt die Verweigerung beziehungsweise Verhinderung durch Bedsuël klar wieder, ohne ein zusätzliches Motiv einzutragen.
- source_word: ከመ፡ ያውስብ
  choice: dass ... heiratete
  rationale: Das Verb wird idiomatisch als Eingehen einer Ehe wiedergegeben.
- source_word: ቤድ
  choice: Bed[suël]
  rationale: Der überlieferte Text bricht nach dem Namensanfang ab; die Ergänzung aus dem unmittelbar zuvor vollständig genannten Namen wird transparent in eckigen Klammern markiert.
theological_decisions:
- issue: Bezug der zugesagten Ehe
  choice: Tamar soll Schela zur Frau gegeben werden
  alternative: Tamar soll Juda zur Frau gegeben werden
  rationale: Pronomen, Satzfolge und Erzählzusammenhang sprechen unmittelbar für Schela als Bezug; die alternative Deutung wird nicht in den Haupttext aufgenommen, da sie hier weniger wahrscheinlich ist.
- issue: Art von Bedsuëls Eingreifen
  choice: Sie ließ die Heirat nicht zu
  alternative: Sie gab Schela keine Frau
  rationale: Die gewählte Fassung bewahrt den kausativen beziehungsweise verhindernden Sinn, ohne über den Text hinaus festzulegen, auf welche Weise sie die Ehe vereitelte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und bestimmt. „Bleib Witwe“ bewahrt die spezifische soziale und rechtliche Aussage des ge’ezischen Ausdrucks. Die Namensform „Bedsuël“ folgt der Vorlage; die beschädigte Schlussform wird sichtbar ergänzt.
