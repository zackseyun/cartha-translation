translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählbewegung. Die Übersetzung bleibt eng am ge’ezischen Wortlaut und vermeidet zugleich missverständliches »fand sie«, das im Deutschen wie das Ergebnis einer Suche klingen könnte.
