  text: And she sat at the entrance that is on the road to Timnah. And as Judah was going, he found her.
translation:
  language: de
  text: Und sie setzte sich an den Eingang, der an der Straße nach Timna lag. Als Juda unterwegs war, fand er sie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወነበረት (wa-nabarat)
  choice: Und sie setzte sich
  rationale: Das Verb kann »sitzen«, »sich niederlassen« oder »bleiben« bezeichnen. Im erzählerischen Zusammenhang beschreibt es am natürlichsten, dass sie ihren Platz am Eingang einnahm.
- source_word: ውስተ አንቀጽ (wəsta ʾanqäṣ)
  choice: an den Eingang
  rationale: Die Wendung bezeichnet den Ort am Eingang beziehungsweise Zugang; »an den Eingang« ist im Deutschen idiomatisch.
- source_word: እንተ መንገሰ ፍኖተ ቴምናታ
  choice: der am Weg nach Timna liegt
  rationale: Die relative Ortsangabe wird in natürlichem Deutsch wiedergegeben, ohne die räumliche Beziehung genauer festzulegen, als es die Quelle tut.
- source_word: ወእንዘ የሐውር ይሁዳ (wa-ʾənza yəḥawər Yəhuda)
  choice: Als Juda vorüberging
  rationale: Die Konstruktion schildert Juda im Gehen. »vorüberging« passt zum Straßenkontext und leitet sein Zusammentreffen mit ihr natürlich ein.
- source_word: ረከባ (räkäba)
  choice: traf er sie dort an
  rationale: Das Verb bedeutet grundsätzlich »finden« oder »antreffen«. »traf … dort an« gibt das unvermutete Vorfinden einer Person idiomatisch wieder, ohne ein gegenseitig verabredetes Treffen anzudeuten.
