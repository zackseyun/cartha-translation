  text: And Judah his father forbade him. And Er, Judah’s firstborn, was evil, and the LORD put him to death.
translation:
  language: de
  text: Und Juda, sein Vater, hielt ihn davon ab.[a] Er, Judas Erstgeborener, war böse, und der HERR tötete ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hinderte ihn daran“; auch: „verbot es ihm“.'
    reason: Das Verb kann verhindern, hindern, zurückhalten oder verbieten bedeuten; das konkrete Objekt ergibt sich aus dem Zusammenhang.
lexical_decisions:
- source_word: ወአሕበሶ፡ ይሁዳ፡ አቡሁ
  choice: Und sein Vater Juda hielt ihn davon ab
  rationale: Die Kausativform von ሐበሰ bezeichnet hier ein Hindern oder Abhalten. Die natürliche deutsche Wendung bewahrt den Bezug auf eine zuvor genannte Handlung, ohne ein im Vers nicht ausdrücklich genanntes Objekt zu ergänzen.
- source_word: ወውእቱ፡ ዔር፡ በኵሩ፡ ለይሁዳ
  choice: Er aber, der Erstgeborene Judas
  rationale: ውእቱ kann den Übergang und die Hervorhebung des Subjekts tragen; „aber“ gibt diesen Anschluss idiomatisch wieder. በኵሩ bezeichnet den Erstgeborenen.
- source_word: እኩይ
  choice: böse
  rationale: Die schlichte moralische Wertung des Ausgangstextes wird ohne erklärende Zusätze wiedergegeben.
- source_word: ወቀተሎ፡ እግዚአብሔር
  choice: und der HERR tötete ihn
  rationale: ቀተለ bedeutet direkt „töten“. Die traditionelle Schreibweise „HERR“ kennzeichnet den Gottesnamen in dieser Überlieferung, entsprechend der konsultierten Fassung.
theological_decisions:
- issue: Göttliche Verursachung von Ers Tod
  choice: der HERR tötete ihn
  alternative: der HERR ließ ihn sterben
  rationale: Der aktive Wortlaut des Ge'ez wird bewahrt und nicht zu einer bloßen Zulassung abgeschwächt.
- issue: Explizite Benennung der verhinderten Handlung
  choice: hielt ihn davon ab
  alternative: verbot ihm, eine kanaanäische Frau zu nehmen
  rationale: Der unmittelbare Gegenstand des Verbots steht nicht in diesem Vers. Die Übersetzung belässt den Rückverweis offen und importiert den Kontext nicht in den Wortlaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz bleibt knapp und verweist wie der Ausgangstext auf den vorausgehenden Zusammenhang; die harte theologische Aussage des zweiten Satzes wird nicht gemildert.
