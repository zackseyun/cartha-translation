base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/039.yaml
  text: Jesus said[a], “The Pharisees and the scribes have received the keys of knowledge; they have hidden them. They did not enter, and they did not allow those who wished to enter[e][d][c][b]. But you—become prudent like serpents and innocent like doves.”
translation:
  language: de
  text: 'Jesus sagte: „Die Pharisäer und die Schriftgelehrten haben die Schlüssel der Erkenntnis genommen und verborgen. Sie selbst sind nicht hineingegangen, und die hineingehen wollten, ließen sie nicht hinein.[a] Ihr aber werdet klug wie die Schlangen und arglos wie die Tauben.“[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vgl. Lukas 11,52 zur Bildwelt der „Schlüssel der Erkenntnis“ und Matthäus 23,13 zum verhinderten Hineingehen. Das Ziel des Hineingehens bleibt hier unausgesprochen.
    reason: cross_reference_and_ambiguity
  - marker: b
    text: Die Handschrift hat bei „Schlangen“ und „Tauben“ jeweils den Plural. Die singularischen Tierformen in der bereitgestellten normalisierten Textzeile geben den erhaltenen koptischen Wortlaut an dieser Stelle nicht genau wieder.
    reason: manuscript_morphology
  - marker: c
    text: Vgl. Matthäus 10,16 für die verwandte Formulierung „klug wie die Schlangen und arglos wie die Tauben“.
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲫⲁⲣⲓⲥⲁⲓⲟⲥ ⲙⲛ̄ⲛⲅⲣⲁⲙⲙⲁⲧⲉⲩⲥ
  choice: die Pharisäer und die Schriftgelehrten
  rationale: Der kollektiv gebrauchte Singular bei „Pharisäer“ bezeichnet die Gruppe; der Plural ist im Deutschen natürlich. „Schriftgelehrte“ ist die etablierte, historisch verständliche Wiedergabe von γραμματεύς/ⲅⲣⲁⲙⲙⲁⲧⲉⲩⲥ.
- source_word: ⲁⲩϫⲓ / ⲁⲛⲧⲟⲟⲩϫⲓ
  choice: haben … genommen
  rationale: ϫⲓ kann „nehmen“ oder „empfangen“ bedeuten. „Genommen“ bewahrt hier die mögliche kritische Färbung und entspricht der Handlung, über die Schlüssel zu verfügen, ohne einen Geber vorauszusetzen.
- source_word: ϣⲁϣⲧ ⲛ̄ⲧⲅⲛⲱⲥⲓⲥ
  choice: die Schlüssel der Erkenntnis
  rationale: Das Manuskript bezeichnet „Schlüssel“ ausdrücklich als Mehrzahl. „Erkenntnis“ gibt das griechische Lehnwort γνῶσις wieder, ohne es als späteren technischen Begriff „Gnosis“ festzulegen.
- source_word: ⲁⲩϩⲟⲡⲟⲩ
  choice: und verborgen
  rationale: Das pronominale Objekt bezieht sich auf die Schlüssel. Im Deutschen kann „verborgen“ das bereits genannte Objekt knapp mitführen.
- source_word: ⲙ̄ⲡⲟⲩⲃⲱⲕ ⲉϩⲟⲩⲛ
  choice: Sie selbst sind nicht hineingegangen
  rationale: Die Bewegungsrichtung „hinein“ bleibt erhalten; das Ziel wird wie im Koptischen nicht ausdrücklich benannt. „Selbst“ verdeutlicht den Kontrast, ohne ein Ziel zu ergänzen.
- source_word: ⲛⲉⲧⲟⲩⲱϣ ⲉⲃⲱⲕ ⲉϩⲟⲩⲛ ⲙ̄ⲡⲟⲩⲕⲁⲁⲩ
  choice: die hineingehen wollten, ließen sie nicht hinein
  rationale: Die volitive Aussage und das verweigerte Eintreten werden direkt wiedergegeben. Das nicht genannte Ziel des Hineingehens bleibt offen.
- source_word: ϣⲱⲡⲉ
  choice: werdet
  rationale: Das Verb bedeutet hier „werden“ und steht als Aufforderung; deshalb ist „werdet“ genauer als ein bloßes „seid“.
- source_word: ⲫⲣⲟⲛⲓⲙⲟⲥ
  choice: klug
  rationale: Das griechische Lehnwort φρόνιμος kann „klug, verständig, umsichtig“ bedeuten. „Klug“ ist prägnant, verständlich und lässt sowohl praktische Einsicht als auch Umsicht zu.
- source_word: ⲁⲕⲉⲣⲁⲓⲟⲥ
  choice: arglos
  rationale: Das griechische Lehnwort ἀκέραιος bezeichnet wörtlich etwas Unvermischtes und übertragen Lauterkeit oder Arglosigkeit. „Arglos“ bildet einen natürlichen Gegenpol zu schlangenartiger Klugheit, ohne absolute moralische Sündlosigkeit zu behaupten.
- source_word: ⲛ̄ⲑⲉ ⲛ̄ⲛϩⲟϥ … ⲛ̄ⲑⲉ ⲛ̄ⲛ̄ϭⲣⲟⲙⲡⲉ
  choice: wie die Schlangen … wie die Tauben
  rationale: Die erhaltene Handschrift hat bei beiden Tierbezeichnungen Pluralformen. Die deutsche Wiedergabe folgt daher dem Manuskript und nicht der irreführenden singularischen Form der bereitgestellten Normalisierung.
theological_decisions:
- issue: Worauf das „Hineingehen“ zielt
  choice: 'Das Ziel bleibt ungenannt: „hineingegangen/hinein“'
  alternative: „in das Reich“ oder „zur Erkenntnis eingegangen“
  rationale: Der koptische Text nennt kein ausdrückliches Ziel. Eine Ergänzung würde eine mögliche Deutung als eindeutige Aussage in den Text eintragen.
- issue: Bedeutung von ⲅⲛⲱⲥⲓⲥ
  choice: Erkenntnis
  alternative: Gnosis
  rationale: „Gnosis“ könnte eine ausgearbeitete spätere Lehrtradition voraussetzen. „Erkenntnis“ wahrt den normalen Wortsinn und lässt die theologische Reichweite offen.
- issue: Ethischer Sinn von ἀκέραιος/ⲁⲕⲉⲣⲁⲓⲟⲥ
  choice: arglos
  alternative: unschuldig oder rein
  rationale: „Arglos“ bezeichnet Lauterkeit ohne Täuschungsabsicht und vermeidet, dem Spruch eine weitergehende Lehre über absolute Unschuld oder kultische Reinheit zuzuschreiben.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem, knappem Spruchcharakter. Die vertrauten Begriffe „Pharisäer“, „Schriftgelehrte“, „Erkenntnis“, „Schlangen“ und „Tauben“ erhalten den antiken Bildraum. Der Satzbau bleibt nahe am koptischen Fortgang, wird aber durch „Sie selbst“ und die wiederholte Richtungsangabe „hinein“ im Deutschen klar und natürlich.
