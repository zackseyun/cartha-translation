  source_fidelity: 'Die Übersetzung gibt den koptischen Sinn insgesamt zuverlässig wieder: die Schlüssel werden genommen und verborgen, die Betreffenden gehen nicht hinein und hindern Eintrittswillige; das Ziel des Hineingehens wird nicht ergänzt. Die Pluralformen „Schlangen“ und „Tauben“ folgen zu Recht dem erhaltenen Handschriftenwortlaut (ⲛ̄ⲛϩⲟϥ⳿; ⲛ̄ⲛ̄ϭⲣⲟⲙ⳿), nicht der inkonsistenten Normalisierung. Gegenüber der englischen Auditspur ist daher deren Behauptung eines koptischen generischen Singulars nicht zu übernehmen.'
  naturalness: 'Der Spruch ist verständlich und angemessen knapp. Eine sichere sprachliche Korrektur ist nötig: Nach der Anrede bzw. Kontrastsetzung „Ihr aber“ steht hier kein Komma. Außerdem ist die Formulierung der ersten Fußnote grammatisch zu glätten.'
  terminology: „Pharisäer“, „Schriftgelehrte“, „Schlüssel der Erkenntnis“, „klug“ und „arglos“ sind registergerecht und quellentreu. „Erkenntnis“ vermeidet zu Recht eine voreilige Technisierung als „Gnosis“.
