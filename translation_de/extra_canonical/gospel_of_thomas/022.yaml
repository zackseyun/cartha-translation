  yaml_path: translation/extra_canonical/gospel_of_thomas/022.yaml
  text: Jesus saw some little ones being suckled[a]. He said to his disciples, “These little ones who are being suckled are like those who are to enter the Kingdom.” They said to him, “Shall we, being little ones, enter the Kingdom?” Jesus said to them, “When you make the two one; and when you make the inner like the outer and the outer like the inner, and the upper like the lower; and when you make the male and the female into a single one, so that the male is not male and the female not female; and when you make eyes in the place of an eye, and a hand in the place of a hand, and a foot in the place of a foot[h][g][f][e][d][c][b], and an image in the place of an image—then you will enter the Kingdom.”
translation:
  language: de
  text: 'Jesus sah einige Kleine, die gestillt wurden.[a] Er sagte zu seinen Jüngern: „Diese Kleinen, die gestillt werden, gleichen denen, die in das Reich[b] hineingehen.“ Sie fragten ihn: „Werden wir als Kleine in das Reich hineingehen?“ Jesus sagte zu ihnen: „Wenn ihr die zwei zu einem macht und wenn ihr das Innere wie das Äußere macht und das Äußere wie das Innere, das Obere wie das Untere;[c] und wenn ihr das Männliche und das Weibliche zu einem einzigen macht, sodass das Männliche nicht männlich und das Weibliche nicht weiblich ist; und wenn ihr Augen an die Stelle eines Auges setzt, eine Hand an die Stelle einer Hand, einen Fuß an die Stelle eines Fußes und ein Bild[d] an die Stelle eines Bildes – dann werdet ihr in das Reich hineingehen.“[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Gestillt werden“ gibt ϫⲓⲉⲣⲱⲧⲉ wieder, ein spezifisches Verb für das Trinken von Muttermilch. Möglich wäre auch: „an der Brust trinken“.'
    reason: lexical_alternative
  - marker: b
    text: „Reich“ übersetzt ⲙⲛⲧⲣⲣⲟ, wörtlich etwa „Königsherrschaft“ oder „Herrschaft“. Hier wird davon zugleich wie von einem Bereich gesprochen, in den man hineingeht.
    reason: lexical_alternative
  - marker: c
    text: Das koptische Gegensatzpaar kann auch mit „das Himmlische wie das Irdische“ beziehungsweise „das Obere wie das, was unten ist“ wiedergegeben werden. Der Text enthält hier kein zusätzliches Paar „hinten/vorn“.
    reason: textual_or_lexical_clarification
  - marker: d
    text: „Bild“ gibt das griechische Lehnwort ϩⲓⲕⲱⲛ wieder; auch „Ikone“ wäre möglich.
    reason: lexical_alternative
  - marker: e
    text: Das letzte Wort „Reich“ ist im Manuskript teilweise beschädigt und nach dem erhaltenen Zusammenhang ergänzt.
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲕⲟⲩⲓ
  choice: Kleine
  rationale: Das Wort bedeutet grundsätzlich „klein/klein sein“. Der Zusammenhang weist auf Säuglinge oder kleine Kinder, doch „Kleine“ bewahrt die auffällige Wiederholung und legt das Alter nicht genauer fest als der Text.
- source_word: ϫⲓⲉⲣⲱⲧⲉ
  choice: gestillt werden
  rationale: Das spezifische Verb bezeichnet das Trinken von Muttermilch beziehungsweise das Gestilltwerden. Die passive deutsche Form gibt Konstruktion und antiken Kontext klar wieder.
- source_word: ⲧⲟⲛⲧⲛ
  choice: gleichen
  rationale: Das Vergleichsverb bezeichnet Ähnlichkeit oder Entsprechung; „gleichen“ ist knapp, würdig und idiomatisch.
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: Reich
  rationale: Das abstrakte Substantiv kann Königsherrschaft oder Herrschaft bedeuten, wird hier aber als etwas dargestellt, in das Menschen hineingehen. „Reich“ bewahrt diese räumliche Redeweise und bleibt für deutschsprachige Leser verständlich.
- source_word: ⲡⲥⲛⲁⲩ ⲟⲩⲁ
  choice: die zwei zu einem machen
  rationale: Die knappe Formulierung bildet die charakteristische Einheitssprache des Spruchs unmittelbar ab, ohne ihren Bezug auszudeuten.
- source_word: ⲡⲥⲁ ⲛϩⲟⲩⲛ / ⲡⲥⲁ ⲛⲃⲟⲗ
  choice: das Innere / das Äußere
  rationale: Die substantivierten deutschen Gegensatzbegriffe entsprechen der räumlichen Antithese und bewahren deren symbolische Offenheit.
- source_word: ⲡⲥⲁ ⲛⲧⲡⲉ / ⲡⲥⲁ ⲙⲡⲓⲧⲛ
  choice: das Obere / das Untere
  rationale: Die Wendung bildet nur ein Gegensatzpaar. „Obere/Untere“ bewahrt die räumliche Mehrdeutigkeit; eine zusätzliche Gegenüberstellung von Vorder- und Rückseite wäre nicht durch den koptischen Text gedeckt.
- source_word: ⲡϩⲟⲟⲩⲧ / ⲥϩⲓⲙⲉ
  choice: das Männliche / das Weibliche
  rationale: Die substantivierten Adjektive geben die parallelen Geschlechtsbegriffe wieder, ohne sie vorschnell auf soziale Rollen oder einzelne Personen zu verengen.
- source_word: ⲟⲩⲁ ⲟⲩⲱⲧ
  choice: ein einziges
  rationale: Die Formulierung verstärkt den Gedanken der Einheit; „ein einziges“ gibt diese Emphase natürlich wieder.
- source_word: ϩⲓⲕⲱⲛ
  choice: Bild
  rationale: Das griechische Lehnwort kann auch als „Ikone“ wiedergegeben werden. „Bild“ ist im Deutschen weiter, transparent und nicht unnötig kultisch festgelegt.
theological_decisions:
- issue: Bedeutung der Einheit gegensätzlicher Paare
  choice: Die bildhafte Reihe bleibt ohne erklärende Deutung stehen.
  alternative: Die Aussagen ausdrücklich als Wiederherstellung ursprünglicher Ganzheit, Aufhebung von Geschlecht oder mystische Vereinigung erklären.
  rationale: Der Spruch nennt Bedingungen für den Eintritt in das Reich, erläutert aber weder ihre metaphysische noch ihre anthropologische Bedeutung. Eine bestimmte Lehrdeutung würde die echte Spannung des Textes auflösen.
- issue: Wiedergabe von ⲙⲛⲧⲣⲣⲟ
  choice: Reich
  alternative: Königsherrschaft oder Herrschaft
  rationale: Das Quellenwort ist formal abstrakt, steht hier jedoch zweimal mit einem Verb des Hineingehens. „Reich“ erhält die im Text selbst angelegte Spannung zwischen Herrschaft und betretbarem Bereich; die Fußnote nennt die abstraktere Möglichkeit.
- issue: Männlich-weiblich-Klausel
  choice: „sodass das Männliche nicht männlich und das Weibliche nicht weiblich ist“
  alternative: Die zweite Verneinung auslassen oder die Klausel als soziale Gleichstellung umschreiben.
  rationale: Die symmetrische, paradoxe Fassung entspricht dem überlieferten Verständnis der Gegensatzreihe und bewahrt ihren theologischen Anstoß, ohne ihn zu harmonisieren.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut lesbarem Erzählton. Die wiederholten Formeln „wenn ihr … macht“ und „an die Stelle“ bleiben bewusst erhalten, weil sie den rhythmischen und rätselhaften Charakter des Spruchs tragen. Unnatürliche Überpräzisierung wurde vermieden; markante Paradoxien und räumliche Mehrdeutigkeiten wurden nicht geglättet.
