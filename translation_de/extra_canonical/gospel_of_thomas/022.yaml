review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung folgt dem sahidisch-koptischen Text zuverlässig. Sie bewahrt die Gegenwart bzw. Dauerhaftigkeit des Stillens, die Vergleichsaussage über die „Kleinen“, die Frage der Jünger als Sein- und nicht Werden-Aussage sowie die Reihenfolge und Paradoxie der Einheitsforderungen. Insbesondere gibt sie zutreffend nur ein Gegensatzpaar „das Obere … das Untere“ wieder und fügt kein im Koptischen nicht vorhandenes Paar „hinten/vorn“ ein. Die Schlusslesung „Reich“ ist als ergänzte, durch den beschädigten Manuskriptbefund gestützte Lesung korrekt gekennzeichnet.
  naturalness: Das Deutsch ist modernes Standarddeutsch und trotz der absichtlich formelhaften Wiederholungen gut lesbar. „Kleine“ ist leicht markiert, aber als bewusste, quellentreue Wiederholung im Kontext der gestillten Kinder vertretbar. Die Konstruktionen „an die Stelle eines/einer …“ und „wenn ihr … macht“ bewahren den Rhythmus und die befremdliche Prägnanz des Spruchs, ohne unverständlich zu werden.
  terminology: „Reich“ ist angesichts des wiederholten Hineingehens idiomatisch und wird durch die Fußnote sachgerecht gegen die abstrakteren Möglichkeiten „Königsherrschaft/Herrschaft“ abgesichert. „Das Männliche/das Weibliche“ wahrt die symmetrische Terminologie ohne soziale oder konfessionelle Ausdeutung. „Bild“ für ϩⲓⲕⲱⲛ ist angemessen; die Alternative „Ikone“ ist zutreffend vermerkt.
  issues: []
