base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/043.yaml
  text: 'His disciples said to him[1], "Who are you, that you say these things to us?"


    "From what I say to you, you do not know who I am. But you have become like the Jews, for they love the tree but hate its fruit[2], and they love the fruit but hate the tree."'
translation:
  language: de
  text: 'Seine Jünger sagten zu ihm: „Wer bist du, dass du uns dies sagst?“


    „Ihr erkennt nicht anhand dessen, was ich euch sage, wer ich bin.[a] Ihr aber seid wie die Juden geworden: Sie lieben den Baum, hassen seine Frucht; und sie lieben die Frucht, hassen den Baum.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die koptische Verneinung kann auch als rhetorische Frage verstanden werden: „Erkennt ihr nicht, wer ich bin?“'
    reason: Erhalt einer echten syntaktischen Mehrdeutigkeit.
  - marker: b
    text: Im Koptischen stehen „lieben“ und „hassen“ jeweils ohne ein verbindendes „aber“ unmittelbar nebeneinander. Diese knappe Gegenüberstellung ist hier beibehalten.
    reason: Hinweis auf das betonte Asyndeton und seine stilistische Wirkung.
lexical_decisions:
- source_word: ⲉⲓⲙⲉ
  choice: erkennen
  rationale: Das Verb kann „wissen“, „verstehen“ oder „erkennen“ bedeuten. In Verbindung mit der Identitätsfrage „wer ich bin“ gibt „erkennen“ den Sinn im Deutschen natürlich und prägnant wieder.
- source_word: ϣⲱⲡⲉ
  choice: geworden
  rationale: 'Die Perfektform bezeichnet hier einen eingetretenen Zustand beziehungsweise eine Zustandsveränderung: „ihr seid … geworden“.'
- source_word: ϣⲏⲛ
  choice: Baum
  rationale: Die übliche und im Bildzusammenhang eindeutige Bedeutung des koptischen Substantivs ist „Baum“.
- source_word: ⲙⲉ
  choice: lieben
  rationale: Das Verb bezeichnet „lieben“ und steht in bewusst scharfem Gegensatz zu ⲙⲟⲥⲧⲉ, „hassen“.
- source_word: ⲙⲟⲥⲧⲉ
  choice: hassen
  rationale: Die direkte Wiedergabe bewahrt den starken Gegensatz zu „lieben“ und schwächt die Aussage nicht ab.
theological_decisions:
- issue: Aussage oder rhetorische Frage in Jesu Antwort
  choice: 'Aussage: „erkennt ihr nicht, wer ich bin“'
  alternative: 'Rhetorische Frage: „Erkennt ihr nicht, wer ich bin?“'
  rationale: Die negative koptische Konstruktion lässt grundsätzlich beide Auffassungen zu. Als Aussage schließt sie syntaktisch und gedanklich unmittelbar an „An dem, was ich euch sage“ sowie an den folgenden Gegensatz an; die Ambiguität wird in einer Fußnote offengelegt.
- issue: Bezeichnung „die Juden“
  choice: Die im Text stehende kollektive Bezeichnung unverändert wiedergeben
  alternative: Verallgemeinernd oder abschwächend umschreiben
  rationale: Der Quelltext nennt ausdrücklich „die Juden“. Eine Umdeutung würde die historische und theologische Spannung des Textes verdecken; die Übersetzung billigt die pauschale Charakterisierung damit nicht als allgemeines Urteil.
translation_notes:
  register: Moderne, würdige Standardsprache. „Dies“ hält die Frage knapp und leicht gehoben; „An dem, was …“ gibt ϩⲛ („aus/anhand von“) idiomatisch wieder. In der Schlusswendung bleibt das konjunktionslose Nebeneinander von Liebe und Hass erhalten, ohne ein erklärendes „aber“ einzufügen.
