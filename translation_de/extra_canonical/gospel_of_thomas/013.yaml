base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/013.yaml
  text: 'Jesus said to his disciples[a], "Compare me, and tell me whom I am like."

    Simon Peter said to him, "You are like a righteous angel."

    Matthew said to him, "You are like a human being—a philosopher, a man of understanding."

    Thomas said to him, "Teacher, my mouth will not be able at all to say whom you are like."

    Jesus said, "I am not your teacher, because you have drunk and you have become intoxicated from the bubbling spring that I myself have measured out."

    And he took him; he withdrew and spoke three sayings to him.

    When Thomas came to his companions, they asked him, "What did Jesus say to you?"

    Thomas said to them, "If I should tell you one of the sayings he spoke to me, you will pick up stones and throw them at me[j][i][h][g][f][e][d][c][b], and fire will come out of the stones and consume you."'
translation:
  language: de
  text: '**Thomasevangelium – Spruch 13**


    Jesus sagte zu seinen Jüngern: „Vergleicht mich und sagt mir: Wem gleiche ich?“


    Simon Petrus sagte zu ihm: „Du gleichst einem gerechten Engel.“


    Matthäus sagte zu ihm: „Du gleichst einem Menschen – einem Philosophen, einem Verständigen.“[a]


    Thomas sagte zu ihm: „Lehrer, mein Mund wird überhaupt nicht imstande sein zu sagen, wem du gleichst.“


    Jesus sagte: „Ich bin nicht dein Lehrer. Denn du hast getrunken und bist berauscht worden von der sprudelnden Quelle, die ich selbst zugemessen habe.“[b][c]


    Dann nahm er ihn mit, zog sich zurück und sprach drei Worte zu ihm.


    Als Thomas zu seinen Gefährten kam, fragten sie ihn: „Was hat Jesus zu dir gesagt?“


    Thomas sagte zu ihnen: „Wenn ich euch eines der Worte sage, die er zu mir gesprochen hat, werdet ihr Steine aufheben und sie nach mir werfen; und aus den Steinen wird Feuer hervorkommen und euch verzehren.“[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht eine appositionale Folge: „ein Mensch, ein Philosoph, ein Mensch des Herzens/Verstandes“. Möglich wäre daher auch: „ein weiser Philosoph“.'
    reason: lexical_alternative
  - marker: b
    text: „Sprudelnd“ gibt das lautmalerische ⲃⲣⲃⲣ wieder; auch „murmelnd“ oder „quirlend“ ist möglich.
    reason: lexical_alternative
  - marker: c
    text: „Zugemessen“ kann je nach Verständnis auch „abgemessen“, „zugeteilt“ oder, im Bild des Wasserschöpfens, „geschöpft“ bedeuten. Das betonte „ich selbst“ entspricht dem ausdrücklich gesetzten koptischen Pronomen.
    reason: lexical_alternative
  - marker: d
    text: 'Der Text nennt zwei Handlungen: Sie werden Steine aufheben und diese nach Thomas werfen. Das Feuer, das anschließend aus den Steinen kommt, kehrt das Bild der Steinigung gegen die Werfenden um.'
    reason: cultural_note
lexical_decisions:
- source_word: ϫⲉⲧⲟⲛⲧⲛⲁⲛⲟⲕ
  choice: Vergleicht mich
  rationale: Das Verb ⲧⲟⲛⲧ bezeichnet hier das Herstellen eines Vergleichs. Der knappe deutsche Imperativ bewahrt Form und Aussage.
- source_word: ⲁⲅⲅⲉⲗⲟⲥ ⲛⲇⲓⲕⲁⲓⲟⲥ
  choice: einem gerechten Engel
  rationale: Im Zusammenhang bezeichnet das griechische Lehnwort einen Engel, nicht bloß einen menschlichen Boten; ⲇⲓⲕⲁⲓⲟⲥ wird mit „gerecht“ wiedergegeben.
- source_word: ⲣⲱⲙⲉ ⲛⲫⲓⲗⲟⲥⲟⲫⲟⲥ ⲛⲣⲙⲛϩⲏⲧ
  choice: einem Menschen – einem Philosophen, einem Verständigen
  rationale: Die appositionale Folge und die ausdrückliche Bezeichnung als Mensch bleiben erhalten. ⲣⲙⲛϩⲏⲧ bedeutet wörtlich einen Menschen des Herzens oder Verstandes und idiomatisch einen Verständigen.
- source_word: ⲡⲥⲁϩ
  choice: Lehrer
  rationale: „Lehrer“ ist eine natürliche Wiedergabe der Anrede und vermeidet die herrschaftliche Nebenbedeutung von „Meister“.
- source_word: ϩⲟⲗⲱⲥ ... ⲛⲁϣϣⲁⲡϥ ⲁⲛ
  choice: wird überhaupt nicht imstande sein
  rationale: ϩⲟⲗⲱⲥ verstärkt die Verneinung; das Futurpräfix ⲛⲁ- verlangt hier eine zukünftige Form.
- source_word: ⲡⲡⲏⲅⲏ ⲉⲧⲃⲣⲃⲣ
  choice: die sprudelnde Quelle
  rationale: Das lautmalerische ⲃⲣⲃⲣ beschreibt hörbar bewegtes Wasser; „sprudelnd“ wahrt Bild und Klangwirkung.
- source_word: ⲁⲛⲟⲕ ⲛⲧⲁⲉⲓϣⲓⲧⲥ
  choice: die ich selbst zugemessen habe
  rationale: „Zugemessen“ erhält das ungewöhnliche Bild des Abmessens oder Zuteilens. Das selbständige Pronomen ⲁⲛⲟⲕ wird durch „selbst“ ausdrücklich wiedergegeben.
- source_word: ⲛϣⲟⲙⲧ ⲛϣⲁϫⲉ
  choice: drei Worte
  rationale: ⲛϣⲁϫⲉ kann Worte, Aussprüche oder Äußerungen bezeichnen. „Drei Worte“ bewahrt die knappe, absichtlich nicht erläuterte Formulierung.
- source_word: ⲧⲉⲧⲛⲁϥⲓⲱⲛⲉ ⲛⲧⲉⲧⲛⲛⲟⲩϫⲉ ⲉⲣⲟⲉⲓ
  choice: werdet ihr Steine aufheben und sie nach mir werfen
  rationale: 'Die Übersetzung gibt beide ausdrücklich genannten Handlungen wieder: das Aufheben der Steine und das Werfen nach Thomas.'
theological_decisions:
- issue: Jesu Aussage „Ich bin nicht dein Lehrer“
  choice: Die paradoxe Verneinung bleibt uneingeschränkt stehen.
  alternative: Die Aussage als „Ich bin nicht nur dein Lehrer“ oder als Aufhebung des Lehrer-Schüler-Verhältnisses deuten.
  rationale: Der koptische Text enthält kein „nur“ und erklärt die theologische Bedeutung des Satzes nicht. Die Übersetzung bewahrt deshalb die Spannung zwischen der Anrede „Lehrer“ und Jesu Antwort.
- issue: Die berauschende Quelle
  choice: Das Bild wird ohne dogmatische Identifizierung wiedergegeben.
  alternative: Die Quelle ausdrücklich als Offenbarung, Geist, Weisheit oder Jesus selbst bestimmen.
  rationale: Der Text verbindet die Quelle eng mit Jesus, benennt ihre Bedeutung aber nicht eindeutig. Eine explizite Identifizierung würde die genuine Mehrdeutigkeit auflösen.
- issue: Die drei geheimen Worte
  choice: Ihr Inhalt bleibt ungenannt und wird nicht rekonstruiert.
  alternative: Die Worte mit einer bestimmten Gotteslehre oder geheimen Formel identifizieren.
  rationale: Der überlieferte Text nennt weder Inhalt noch Bedeutung der drei Worte.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählton. Die direkte Rede bleibt rhythmisch und nahe an der koptischen Struktur, ohne unnatürliche Wortstellung. Auffällige Bilder und paradoxe Aussagen werden nicht geglättet oder konfessionell ausgelegt.
