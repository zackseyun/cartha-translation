base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/068.yaml
  text: Jesus said, “Blessed are you when they hate you and persecute you; and they will find no place in the place where they persecuted you.”
translation:
  language: de
  text: 'Jesus sagte: „Glücklich zu preisen seid ihr, wenn man euch hasst und verfolgt.[a] Und man wird keinen Ort[b] an dem Ort finden, an dem man euch verfolgt hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher ließe sich die unbestimmte dritte Person Plural auch aktiv wiedergeben: „wenn sie euch hassen und verfolgen; und sie werden keinen Ort finden“. Im Koptischen kann diese Form zugleich passivischen Sinn haben: „wenn ihr gehasst und verfolgt werdet; und kein Ort wird gefunden werden“.'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Für die beiden Vorkommen von „Ort“ stehen im Koptischen verschiedene Wörter: zuerst das griechische Lehnwort ⲧⲟⲡⲟⲥ (topos), danach das einheimische ⲙⲁ (ma). Ob damit ein Unterschied zwischen geistlichem „Ort“ und konkretem Schauplatz gemeint ist, bleibt offen.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: glückselig
  rationale: Das griechische Lehnwort μακάριος kennzeichnet eine Seligpreisung. „Glückselig“ bewahrt ihren feierlichen Zuspruch besser als das im heutigen Deutsch leicht missverständliche „selig“ allein.
- source_word: ⲙⲉⲥⲧⲉ-
  choice: hassen
  rationale: Das koptische Verb bezeichnet unmittelbar das Hassen.
- source_word: ⲇⲓⲱⲕⲉ
  choice: verfolgen
  rationale: Das griechische Lehnwort διώκω bezeichnet hier feindseliges Verfolgen beziehungsweise Verfolgung.
- source_word: ϩⲉ ⲉ-
  choice: finden
  rationale: Die Verbindung bedeutet „auf etwas stoßen“ beziehungsweise „finden“.
- source_word: ⲧⲟⲡⲟⲥ / ⲙⲁ
  choice: Ort / Ort
  rationale: Der Ausgangstext verwendet zwei verschiedene Wörter, ein griechisches Lehnwort und ein einheimisch-koptisches Wort. Im Deutschen gibt es hier kein ebenso natürliches Wortpaar; die Wiederholung „Ort an dem Ort“ bewahrt daher die auffällige Formulierung, ohne eine bestimmte theologische Deutung festzuschreiben.
theological_decisions:
- issue: Unbestimmte dritte Person Plural als aktivische oder passivische Wendung
  choice: 'Unpersönliches „man“: „wenn man euch hasst und verfolgt … man wird … finden“'
  alternative: '„wenn sie euch hassen und verfolgen; und sie werden keinen Ort finden“ oder passivisch: „wenn ihr gehasst und verfolgt werdet; und kein Ort wird gefunden werden“'
  rationale: Die koptische dritte Person Plural kann unbestimmt oder passivisch gebraucht werden. Das deutsche „man“ bewahrt den durchgehenden Handlungsträger, ohne eine bestimmte Gruppe von Verfolgern ausdrücklich einzuführen, und lässt die passive Nuance weiterhin erkennen.
- issue: Mögliche geistliche Bedeutung von ⲧⲟⲡⲟⲥ
  choice: Im Haupttext neutral mit „Ort“ wiedergegeben
  alternative: „Stätte“, „Stand“ oder ausdrücklich „geistlicher Ort“
  rationale: Eine theologisch aufgeladene Bedeutung ist im Thomasevangelium möglich, wird in diesem Satz aber nicht eindeutig erklärt. Der Haupttext sollte diese Spannung nicht durch eine interpretierende Ergänzung auflösen.
- issue: Grund der Verfolgung
  choice: Keine Motivation ergänzt
  alternative: „um meinetwillen“ oder eine andere aus synoptischen Parallelen übernommene Begründung
  rationale: Der koptische Text nennt keinen christologischen oder sonstigen Grund für Hass und Verfolgung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Wiederholung „Ort an dem Ort“ wurde bewusst beibehalten. Das unpersönliche „man“ klingt natürlich und bildet die mögliche unbestimmte beziehungsweise passivische Funktion der koptischen dritten Person Plural besser ab als ein festgelegtes „sie“.
