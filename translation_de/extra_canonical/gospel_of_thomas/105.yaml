base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/105.yaml
  text: Jesus said[f][e][d][c][b][a], “The one who will come to know the father and the mother—they will call him ‘the son of a prostitute.’”
translation:
  language: de
  text: 'Jesus sagte: „Wer den Vater und die Mutter kennenlernen wird[a], den werden sie ‚Sohn einer Prostituierten‘[b] nennen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier eine relative Zukunft: „derjenige, der … kennenlernen wird“, nicht einfach „wer … kennt“.'
    reason: lexical_alternative
  - marker: b
    text: Das koptische Wort für „Sohn“ kann auch „Kind“ bedeuten. Bei „Prostituierte“ steht kein bestimmter Artikel; gemeint ist daher „Sohn einer Prostituierten“, nicht „Sohn der Prostituierten“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉⲧⲉⲣⲉⲛⲁⲥⲟⲟⲩⲛ
  choice: wer … kennenlernen wird
  rationale: Die Konstruktion bezeichnet eine Person durch ein zukünftiges Erkennen. „Kennenlernen wird“ bewahrt diesen prospektiven Sinn deutlicher als das zeitlose „kennt“.
- source_word: ⲡⲉⲓⲱⲧ ⲙⲛ ⲡⲙⲁⲁⲩ
  choice: den Vater und die Mutter
  rationale: Die bestimmten Artikel werden wiedergegeben; die Kleinschreibung vermeidet eine nicht ausdrücklich markierte theologische Identifizierung.
- source_word: ⲛⲧⲟⲟⲩ ⲛⲁⲙⲟⲩⲧⲉ ⲉⲛⲧⲟϥ
  choice: den werden sie … nennen
  rationale: Die aktive Konstruktion mit ausdrücklich genanntem Subjekt der dritten Person Plural bleibt erhalten. „Nennen“ passt zum Verleihen einer Bezeichnung; „benennen“ wäre ebenfalls möglich, klingt hier aber weniger natürlich.
- source_word: ⲡϣⲏⲣⲉ
  choice: Sohn
  rationale: ϣⲏⲣⲉ kann auch „Kind“ bedeuten; der maskuline Artikel und die feste Schmähbezeichnung mit mütterlicher Herkunft sprechen hier für „Sohn“.
- source_word: ⲡⲟⲣⲛⲏ
  choice: einer Prostituierten
  rationale: Das anlautende ⲡ gehört zum aus dem Griechischen entlehnten Substantiv und ist hier kein bestimmter Artikel. Daher ist die Frau unbestimmt. „Prostituierte“ ist präzise und wahrt ein angemessenes Register.
theological_decisions:
- issue: Mögliche religiöse Titel in „Vater“ und „Mutter“
  choice: 'Kleinschreibung: „der Vater und die Mutter“'
  alternative: „der Vater und die Mutter“ als großgeschriebene Titel zu deuten
  rationale: Der Wortlaut enthält bestimmte Artikel, legt aber allein durch seine Schreibung keine eindeutige theologische Identifizierung fest. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante zukünftige Formulierung und die scharfe, aber nicht umgangssprachlich verschärfte Bezeichnung des Sohnes bleiben erhalten.
