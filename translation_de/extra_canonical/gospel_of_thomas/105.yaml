review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die sahidisch-koptische relative Zukunft von ⲡⲉⲧⲉⲣⲉⲛⲁⲥⲟⲟⲩⲛ angemessen als „Wer … kennenlernen wird“ wieder. Die bestimmten Ausdrücke „den Vater und die Mutter“ sowie das explizite Pluralsubjekt in „den werden sie … nennen“ sind erhalten. ⲡϣⲏⲣⲉ ist im Kontext vertretbar als „Sohn“ übersetzt. Die Genitivgruppe ⲙ̄ⲡⲟⲣⲛⲏ bedeutet „einer Prostituierten“: Das anlautende ⲡ gehört zum griechischen Lehnwort und ist kein bestimmter Artikel. Damit folgt der Entwurf der korrigierten englischen Audit-Spur.'
  naturalness: Der Satz ist idiomatisches, modernes Standarddeutsch und bewahrt zugleich die zugespitzte Struktur des Spruchs. „Kennenlernen wird“ ist etwas markierter als „kennen wird“, transportiert aber die prospektive Nuance treffend. Die direkte Rede und die verschachtelten deutschen Anführungszeichen sind korrekt gesetzt.
  terminology: „Vater“ und „Mutter“ bleiben ohne interpretierende Großschreibung. „Prostituierte“ ist sachlich und im Register angemessen, ohne die abwertende Schärfe durch umgangssprachliche Ersatzwörter zu erhöhen. Die Fußnoten erläutern sowohl die Zukunftsform als auch die relevante unbestimmte Genitivbildung zutreffend.
