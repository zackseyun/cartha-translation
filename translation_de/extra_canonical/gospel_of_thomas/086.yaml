base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/086.yaml
  text: Jesus said, "The foxes have their holes, and the birds have their nest, but the Son of Man does not have a place to lay his head and rest."
translation:
  language: de
  text: 'Jesus sagte: „Die Füchse haben ihre Höhlen[a], und die Vögel haben ihr Nest[b]; der Menschensohn aber hat keinen Ort, seinen Kopf hinzulegen und sich auszuruhen.[c]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Handschrift ist an dieser Stelle beschädigt. Der erhaltene und ergänzte Befund kann als „eine Höhle/einen Bau“ verstanden werden; der normalisierte Text liest „ihre Höhlen“, parallel zu „ihr Nest“ im folgenden Satzteil.
    reason: textual_variant
  - marker: b
    text: Wörtlich steht der Singular „ihr Nest“. Anders als in Matthäus 8,20 und Lukas 9,58 fehlt zudem ein Zusatz wie „des Himmels“.
    reason: source_detail_and_cross_reference
  - marker: c
    text: Das Thomasevangelium fügt ausdrücklich „und sich ausruhen“ hinzu; diese Worte fehlen in den synoptischen Fassungen des Ausspruchs.
    reason: cross_reference
lexical_decisions:
- source_word: ⲃⲁϣⲟⲣ
  choice: Füchse
  rationale: Das Substantiv steht im Plural; die Wiedergabe erhält die knappe, sprichwortartige Form.
- source_word: ⲃⲏⲃ
  choice: Höhlen
  rationale: Das Wort kann Höhle, Loch oder Bau bezeichnen. „Höhlen“ ist quellennah und im Deutschen natürlich; der possessive Plural folgt dem normalisierten Text.
- source_word: ϩⲁⲗⲏⲧ
  choice: Vögel
  rationale: Der koptische Text nennt schlicht die Vögel und enthält keinen Zusatz wie „des Himmels“.
- source_word: ⲙⲁϩ
  choice: Nest
  rationale: 'Das koptische Substantiv steht trotz des pluralischen Besitzers im Singular: wörtlich „ihr Nest“.'
- source_word: ⲣⲓⲕⲉ
  choice: hinlegen
  rationale: Das Verb bedeutet wörtlich „neigen“ oder „beugen“; für den Kopf ist „hinlegen“ die natürliche deutsche Entsprechung.
- source_word: ⲙⲧⲟⲛ ⲙⲙⲟϥ
  choice: sich ausruhen
  rationale: Die reflexive Konstruktion bezeichnet das Ruhen beziehungsweise Sich-Ausruhen und wird ausdrücklich neben dem Hinlegen des Kopfes genannt.
- source_word: ⲡϣⲏⲣⲉ ⲙⲡⲣⲱⲙⲉ
  choice: der Menschensohn
  rationale: Die etablierte deutsche Wiedergabe bleibt nah an „Sohn des Menschen“, ohne im Text festzulegen, ob die Wendung ausschließlich als Titel oder allgemeiner anthropologisch gemeint ist.
theological_decisions:
- issue: Bedeutung von ⲡϣⲏⲣⲉ ⲙⲡⲣⲱⲙⲉ
  choice: Menschensohn
  alternative: Sohn des Menschen / der Mensch
  rationale: „Menschensohn“ bewahrt die traditionelle und wörtlich anschlussfähige Form. Die Übersetzung entscheidet nicht stillschweigend, ob hier ein christologischer Titel, eine Selbstbezeichnung oder eine allgemeinere Bezeichnung des Menschen vorliegt.
- issue: Verhältnis zu den synoptischen Parallelen
  choice: Die thomaseigenen Formulierungen „ihr Nest“ und „sich ausruhen“ bleiben erhalten.
  alternative: Angleichung an Matthäus 8,20 oder Lukas 9,58
  rationale: Die Übersetzung folgt dem vorliegenden koptischen Wortlaut und harmonisiert ihn nicht mit den kanonischen Fassungen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit knapper, aphoristischer Satzführung. Das Semikolon macht den Gegensatz deutlich, ohne den Quelltext auszudeuten. „Ihr Nest“ bleibt trotz der im Deutschen auffälligen Einzahl stehen, weil diese Form textlich bedeutsam ist.
