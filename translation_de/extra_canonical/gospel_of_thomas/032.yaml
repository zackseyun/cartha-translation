base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/032.yaml
  text: Jesus said[1], "A city built upon a high mountain and fortified cannot fall[3][2], nor will it be able to be hidden."
translation:
  language: de
  text: 'Jesus sagte: „Eine Stadt, die auf einem hohen Berg[a] erbaut und befestigt ist, kann nicht fallen[c], und sie wird auch nicht verborgen werden können.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Fragment P.Oxy. 1 hat hier „auf dem Gipfel eines hohen Berges“; im koptischen Text fehlt „auf dem Gipfel“.
    reason: textual_variant
  - marker: b
    text: 'Im koptischen Text steht der letzte Satzteil im Futur („wird … nicht … können“); das griechische Fragment formuliert beide Aussagen im Präsens: Die Stadt kann weder fallen noch verborgen sein.'
    reason: textual_variant
  - marker: c
    text: Vgl. Matthäus 5,14. Das Thomasevangelium verbindet das Bild der nicht zu verbergenden Stadt mit dem Motiv eines festen Bauwerks, das nicht fällt; vgl. Matthäus 7,24–25.
    reason: cross_reference
lexical_decisions:
- source_word: ⲕⲱⲧ
  choice: erbaut
  rationale: Das circumstantiale ⲉⲩⲕⲱⲧ ⲙ̄ⲙⲟⲥ beschreibt die unbestimmte »Stadt«; im Deutschen gibt ein passivischer Relativsatz die Konstruktion natürlich und genau wieder.
- source_word: ⲧⲟⲟⲩ
  choice: Berg
  rationale: Die übliche Bedeutung ist »Berg« beziehungsweise je nach Kontext »Hügel«; hier wird das Wort durch das maskuline qualitative ⲉϥϫⲟⲥⲉ als hoch bezeichnet.
- source_word: ϫⲓⲥⲉ
  choice: hoch
  rationale: Das maskuline qualitative ⲉϥϫⲟⲥⲉ bezieht sich grammatisch auf den maskulinen »Berg«, nicht auf die feminine »Stadt«.
- source_word: ⲧⲁϫⲣⲟ
  choice: befestigt
  rationale: Das feminine qualitative ⲉⲥⲧⲁϫⲣⲏⲩ bezieht sich auf die Stadt und bezeichnet sie als fest gemacht beziehungsweise befestigt.
- source_word: ϩⲉ
  choice: fallen
  rationale: In ⲙⲛ̄ ϭⲟⲙ ⲛ̄ⲥϩⲉ steht der Infinitiv im Sinn von »fallen«; die gesamte Wendung wird idiomatisch mit »kann nicht fallen« wiedergegeben.
- source_word: ϩⲱⲡ
  choice: verborgen werden
  rationale: Das Verb bedeutet »verbergen/verborgen sein«; zusammen mit Futur und Potentialpräfix ergibt sich »wird nicht verborgen werden können«.
theological_decisions:
- issue: Angleichung an Matthäus 5,14
  choice: kann nicht fallen, und sie wird auch nicht verborgen werden können
  alternative: kann nicht verborgen bleiben
  rationale: Die Fassung des Thomasevangeliums enthält ausdrücklich sowohl die Befestigung der Stadt als auch ihre Unfähigkeit zu fallen. Diese eigenständige Spannung wird nicht an die kürzere Matthäusfassung angeglichen.
- issue: Bildsprache von Stadt und befestigtem Bau
  choice: Die Aussage bleibt ohne allegorische Deutung
  alternative: Eine ausdrückliche Deutung auf Gemeinde, Glaubende oder Erkenntnis
  rationale: Der Spruch selbst nennt keine Referenzgröße für die Stadt; eine konfessionelle oder private Auslegung wäre ein Zusatz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Relativsatz ordnet die gestaffelten koptischen Zustandsangaben verständlich, ohne ihre Bezüge zu verwischen. Das etwas markierte Futur im letzten Satzteil bleibt erhalten, weil es dem koptischen Tempuswechsel entspricht.
