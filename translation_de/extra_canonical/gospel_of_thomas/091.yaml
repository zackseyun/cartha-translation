base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/091.yaml
  text: They said to him[a], "Say to us who you are, so that we may believe in you." He said to them, "You test the face of the sky and the earth, and the one who is before you you do not recognize[e][d][c][b]; and this kairos you do not know how to test."
translation:
  language: de
  text: '**91** Sie sagten zu ihm: »Sag uns, wer du bist, damit wir an dich glauben.[a]« Er sagte zu ihnen: »Ihr prüft das Gesicht des Himmels und der Erde,[b] doch den, der vor euch steht, erkennt ihr nicht.[c] Und ihr wisst nicht, wie ihr diesen Kairos prüfen könnt.[d]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier verwendete griechische Lehnverb kann sowohl »glauben« als auch »vertrauen« bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier »das Gesicht des Himmels und der Erde«; »Gesicht« kann auch ihre sichtbare Erscheinung meinen.
    reason: cultural_note
  - marker: c
    text: 'Die Wendung kann auch sachlich verstanden werden: »das, was vor euch liegt«. Das maskuline Singularsuffix des koptischen Verbs (»ihn«) spricht jedoch eher für eine Person.'
    reason: lexical_alternative
  - marker: d
    text: Kairos ist ein griechisches Lehnwort für eine bestimmte, entscheidende oder angemessene Zeit beziehungsweise Gelegenheit.
    reason: cultural_note
lexical_decisions:
- source_word: ϫⲟⲟⲥ ⲉⲣⲟⲛ / ϫⲱⲛⲧⲟⲥ ⲉⲁⲛⲟⲛ
  choice: Sag uns
  rationale: Sowohl die Handschriftenform als auch die normalisierte Form geben hier eine schlichte Aufforderung zum Sprechen beziehungsweise Mitteilen wieder.
- source_word: ⲛ̄ⲧⲕ ⲛⲓⲙ
  choice: wer du bist
  rationale: Die koptische Identitätsfrage ist im persönlichen Dialog idiomatisch mit „wer du bist“ wiederzugeben.
- source_word: ⲣ̄ⲡⲓⲥⲧⲉⲩⲉ ⲉⲣⲟⲕ
  choice: an dich glauben
  rationale: Das griechische Lehnverb πιστεύειν bezeichnet Glauben beziehungsweise Vertrauen; mit der auf die Person gerichteten Ergänzung ist „an dich glauben“ im Deutschen natürlich und wahrt den möglichen Vertrauenssinn in einer Fußnote.
- source_word: ⲣ̄ⲡⲓⲣⲁⲍⲉ
  choice: prüfen
  rationale: Das griechische Lehnverb πειράζειν kann „prüfen“, „erproben“ oder „untersuchen“ bedeuten. „Prüfen“ bewahrt die markante Wiederholung an beiden Stellen.
- source_word: ⲡϩⲟ
  choice: Gesicht
  rationale: Die wörtliche und auffällige Bildsprache des Ausgangstextes bleibt erhalten; der mögliche idiomatische Sinn „Erscheinung“ wird erläutert.
- source_word: ⲧⲡⲉ / ⲡⲡⲉ
  choice: Himmel
  rationale: Im Paar mit der Erde bezeichnet das Wort den sichtbaren Himmel. Das deutsche „Himmel“ ist hier natürlich, ohne den Kontext ausdrücklich auf eine jenseitige Sphäre festzulegen.
- source_word: ⲡⲕⲁϩ
  choice: Erde
  rationale: Im Gegensatzpaar mit dem Himmel ist „Erde“ die natürliche und umfassende Wiedergabe.
- source_word: ⲡⲉⲧⲛ̄ⲡⲉⲧⲛ̄ⲙⲧⲟ ⲉⲃⲟⲗ
  choice: den, der vor euch steht
  rationale: Die anschließende maskuline Singularreferenz begünstigt ein persönliches Verständnis. „Steht“ macht die gegenwärtige Anwesenheit idiomatisch deutlich, ohne über die Ortsangabe hinauszugehen.
- source_word: ⲥⲟⲩⲱⲛϥ
  choice: erkennt ihr nicht
  rationale: In Bezug auf eine anwesende Person trifft „erkennen“ den kontextuellen Sinn von ⲥⲟⲟⲩⲛ besser als das bloße „kennen“ oder „wissen“.
- source_word: ⲕⲁⲓⲣⲟⲥ
  choice: Kairos
  rationale: Das griechische Lehnwort bleibt stehen, weil es einen bestimmten, entscheidenden oder angemessenen Zeitpunkt bezeichnen kann und keine einzelne deutsche Entsprechung die ganze Spannweite wahrt.
- source_word: ⲥⲟⲟⲩⲛ ⲁⲛ ⲛ̄ⲣ̄ⲡⲓⲣⲁⲍⲉ ⲙ̄ⲙⲟϥ
  choice: ihr wisst nicht, wie ihr diesen Kairos prüfen sollt
  rationale: Die Formulierung gibt die im Koptischen ausgedrückte Fähigkeit beziehungsweise Sachkenntnis wieder und bewahrt zugleich das wiederholte Verb „prüfen“.
theological_decisions:
- issue: Bezug der Wendung „vor euch“
  choice: 'Personaler Bezug: „den, der vor euch steht“'
  alternative: 'Sachlicher Bezug: „das, was vor euch liegt“'
  rationale: Das nachfolgende Objektsuffix ist maskulin singular und spricht für eine Person, vermutlich den gegenwärtigen Sprecher. Da die Konstruktion für sich genommen auch sachlich verstanden werden kann, bleibt die Alternative in einer Fußnote sichtbar.
- issue: Deutung von καιρός
  choice: Unübersetzt als „Kairos“
  alternative: „Zeit“, „entscheidender Zeitpunkt“ oder „rechte Zeit“
  rationale: Der Text bestimmt nicht ausdrücklich, ob ein festgesetzter, entscheidender oder günstiger Zeitpunkt gemeint ist. Die Transliteration vermeidet eine theologische Vorentscheidung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Dialogführung. Die auffälligen Ausgangsbilder „Gesicht“ und „Kairos“ bleiben erhalten und werden knapp erläutert. Der zweimalige Gebrauch von „prüfen“ bildet die rhetorische Wiederholung des koptischen Textes nach.
