review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe folgt dem sahidisch-koptischen Text insgesamt zuverlässig: Die Identitätsfrage, das zweimalige »prüfen«, das Bild vom »Gesicht« von Himmel und Erde, das Nicht-Erkennen der anwesenden Person und καιρός sind angemessen wiedergegeben. Im Schlusssatz fügt »prüfen sollt« jedoch eine Sollens- bzw. Verpflichtungsnuance hinzu, die die Konstruktion ⲥⲟⲟⲩⲛ … ⲛ̄ⲣ̄ⲡⲓⲣⲁⲍⲉ nicht enthält; diese bezeichnet fehlendes Wissen bzw. fehlende Fähigkeit, wie etwas zu prüfen ist.'
  naturalness: Der Dialog ist modernes, gut lesbares Standarddeutsch. »Ihr wisst nicht, wie ihr diesen Kairos prüfen könnt« ist sowohl idiomatisch als auch näher an der Kompetenzbedeutung des Koptischen.
  terminology: »An dich glauben«, »prüfen«, »Gesicht«, »erkennt«, und »Kairos« sind konsistent und sachgerecht. Die Wiedergabe »der vor euch steht« ist als idiomatische Personalisierung vertretbar, sofern die sachliche Lesemöglichkeit in der Anmerkung erhalten bleibt.
  issues:
  - severity: medium
    issue: Der Schlusssatz verwendet »prüfen sollt«.
    rationale: »Sollt« kann im Deutschen eine normative Verpflichtung ausdrücken. Das koptische ⲥⲟⲟⲩⲛ ⲁⲛ ⲛ̄ⲣ̄ⲡⲓⲣⲁⲍⲉ bedeutet hier »nicht wissen, wie man ... prüft« bzw. »nicht prüfen können«.
  - severity: medium
    issue: Fußnote c verweist auf ein im deutschen Satz nicht vorhandenes folgendes Pronomen »ihn«.
    rationale: Das personalisierende maskuline Singularobjekt ist im koptischen Verb vorhanden, wird im Deutschen aber durch die Konstruktion »den, der ...« nicht als separates Pronomen ausgedrückt. Die Anmerkung muss daher ausdrücklich vom koptischen Objektsuffix sprechen.
