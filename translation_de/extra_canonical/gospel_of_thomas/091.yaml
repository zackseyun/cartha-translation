revisions:
- from: '**91** Sie sagten zu ihm: »Sag uns, wer du bist, damit wir an dich glauben.[a]« Er sagte zu ihnen: »Ihr prüft das Gesicht des Himmels und der Erde,[b] doch den, der vor euch steht, erkennt ihr nicht.[c] Und ihr wisst nicht, wie ihr diesen Kairos prüfen sollt.[d]«'
  to: '**91** Sie sagten zu ihm: »Sag uns, wer du bist, damit wir an dich glauben.[a]« Er sagte zu ihnen: »Ihr prüft das Gesicht des Himmels und der Erde,[b] doch den, der vor euch steht, erkennt ihr nicht.[c] Und ihr wisst nicht, wie ihr diesen Kairos prüfen könnt.[d]«'
  rationale: Die Revision beseitigt die durch »sollt« eingetragene Verpflichtungsnuance und gibt die Kompetenzbedeutung der koptischen Konstruktion mit »wie ihr ... prüfen könnt« wieder. Fußnote c wird an die tatsächlich im Koptischen vorliegende, im Deutschen jedoch nicht separat ausgedrückte maskuline Objektmarkierung angepasst. Alle Fußnotenmarker bleiben eindeutig an ihren Bezugstexten verankert.
