  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/071.yaml
  text: Jesus said[a], I will cast down this house[c][b], and no one will be able to build it.
translation:
  language: de
  text: 'Jesus sagte: „Ich werde dieses Haus[a] niederreißen, und niemand wird es aufbauen können.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wörter für „dieses Haus“ sind im Manuskript teilweise beschädigt und werden ergänzt; die normalisierte Ausgabe liest ⲛⲡⲉⲓⲏⲓ („dieses Haus“).
    reason: lacuna_or_restoration
  - marker: b
    text: 'Wörtlich steht hier sinngemäß: „und niemand wird es können“. Die Handlung des Aufbaus ergibt sich aus „Haus“ und dem Zusammenhang; „wieder“ steht nicht ausdrücklich im Koptischen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jesus sagte
  rationale: Die feste koptische Redeeinleitung ⲡⲉϫⲉ mit genanntem Sprecher wird natürlich und unmittelbar wiedergegeben.
- source_word: ⲁⲛⲟⲕ
  choice: ich
  rationale: Das selbstständige Pronomen hebt den Sprecher hervor; das betonte deutsche „Ich“ am Satzanfang bewahrt dies, ohne ein zusätzliches „selbst“ überzubetonen.
- source_word: ϣⲟⲣϣⲣ
  choice: niederreißen
  rationale: Das Verb bezeichnet das Niederreißen oder Zerstören. „Niederreißen“ passt idiomatisch zu einem Haus und bewahrt die konkrete, kräftige Bildsprache.
- source_word: ⲡⲉⲓⲏⲓ
  choice: dieses Haus
  rationale: ⲏⲓ bezeichnet ein Haus oder eine Wohnstätte; das Demonstrative verlangt „dieses“.
- source_word: ⲙⲛ̄ⲗⲁⲁⲩ
  choice: niemand
  rationale: Die Negation mit dem indefiniten Ausdruck ergibt direkt „niemand“.
- source_word: ϣⲕⲱⲧ
  choice: können
  rationale: Das Verb bedeutet „fähig sein/können“. Die konkrete Handlung muss aus „Haus“ und dem Gegensatz zum Niederreißen erschlossen werden.
- source_word: ⲛⲧⲟϥ
  choice: es
  rationale: Das Objektklitikon nimmt das Haus auf; im natürlichen deutschen Satz wird es durch „es“ vertreten.
theological_decisions:
- issue: Ob die zweite Satzhälfte ausdrücklich Wiederaufbau meint
  choice: wieder aufbauen
  alternative: aufbauen
  rationale: Das koptische Verb bezeichnet unmittelbar das Können, während die Handlung aus Haus und Kontext ergänzt wird. Nach dem angekündigten Niederreißen ist im Deutschen „wieder aufbauen“ die natürliche kontextuelle Entsprechung; die Fußnote macht kenntlich, dass „wieder“ nicht ausdrücklich im Koptischen steht.
translation_notes:
  register: Moderne, würdige Standardsprache. „Niederreißen“ ist anschaulich und idiomatisch; die knappe, rätselhafte Aussage bleibt ohne allegorische oder konfessionelle Deutung stehen.
