base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/102.yaml
  text: 'Jesus said[d][c][b][a], “Woe to the Pharisees! For they are like a dog lying on the manger of the cattle: it neither eats nor lets the cattle eat.”'
translation:
  language: de
  text: 'Jesus sagte: »Wehe den Pharisäern! Denn sie gleichen einem Hund, der auf der Futterkrippe des Viehs[a] liegt: Er frisst selbst nicht und lässt auch das Vieh nicht fressen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Handschrift ist an dieser Stelle beschädigt. Die normalisierte Lesart lautet »des Viehs«; sie wird durch die folgende, erhaltene Erwähnung des Viehs gestützt.
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲟⲩⲟⲓ
  choice: Wehe
  rationale: Die geläufige deutsche Weheruf-Formel bewahrt die scharfe, anklagende Wirkung und die Kürze des Koptischen.
- source_word: ⲉⲓⲛⲉ
  choice: gleichen
  rationale: Gibt den Vergleichszustand knapp und in würdigem, natürlichem Deutsch wieder.
- source_word: ⲟⲩϩⲟⲣ
  choice: Hund
  rationale: Entspricht der Grundbedeutung und bewahrt die unverblümte Bildsprache.
- source_word: ⲛⲛⲕⲟⲧⲕ
  choice: liegt
  rationale: Bezeichnet hier die Körperhaltung; vermeidet die nicht notwendige Festlegung auf »schläft«.
- source_word: ϩⲓϫⲛ
  choice: auf
  rationale: Gibt die räumliche Beziehung direkt und idiomatisch wieder.
- source_word: ⲡⲟⲩⲟⲙϥ
  choice: Futterkrippe
  rationale: Bezeichnet den Futtertrog präzise und ist im Deutschen im Zusammenhang mit Vieh unmittelbar verständlich.
- source_word: ⲛϩⲉⲛⲉϩⲉ / ⲡⲉϩⲉ
  choice: Vieh
  rationale: Das koptische Wort bezeichnet allgemein Haus- beziehungsweise Nutztiere; »Vieh« erhält diese generische Bedeutung, ohne sie auf Ochsen einzuengen.
- source_word: ⲟⲩⲱⲙ
  choice: fressen
  rationale: Bei einem Hund und beim Vieh ist »fressen« im modernen Deutsch die natürliche Entsprechung von »essen«.
- source_word: ⲕⲱ (ⲛⲡⲉϩⲉ ⲉⲟⲩⲱⲙ)
  choice: lässt … nicht fressen
  rationale: Die Verbindung von ⲕⲱ mit dem Infinitiv bedeutet hier »zulassen/lassen«; die deutsche Konstruktion bildet auch die Negation genau ab.
- source_word: ϫⲉ (kausal)
  choice: Denn
  rationale: Markiert die Begründung knapp und bewahrt den spruchhaften Satzfluss.
theological_decisions:
- issue: Reichweite der Tierbezeichnung
  choice: Vieh
  alternative: Ochsen
  rationale: Der Ausgangstext nennt die Tiere generisch. Eine Beschränkung auf Ochsen wäre traditionell möglich, aber lexikalisch enger als der koptische Wortlaut.
translation_notes:
  register: Knappes, modernes und würdiges Standarddeutsch. Der Weheruf und die Härte des Hundebildes bleiben erhalten. »Futterkrippe« vermeidet die heute mögliche Verengung von »Krippe« auf die Weihnachtsdarstellung; »Vieh« bewahrt die generische Tierbezeichnung.
