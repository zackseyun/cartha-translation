  source_fidelity: 'Die Übersetzung gibt die Struktur und den Sinn des koptischen Spruchs zuverlässig wieder: Weheruf, Vergleich mit dem Hund auf dem Futtertrog, dessen eigenes Nichtfressen sowie sein Nichtzulassen des Fressens durch das Vieh. »Vieh« wahrt die generische Tierbezeichnung und engt sie nicht unbegründet auf Ochsen ein.'
  naturalness: Knappes, idiomatisches modernes Standarddeutsch mit einem dem Spruch entsprechenden würdigen Register. »Futterkrippe des Viehs« und die Verbwahl »fressen« sind im gegebenen Tierkontext natürlich.
  terminology: »Pharisäer«, »Wehe«, »Hund«, »Futterkrippe« und »Vieh« sind sachgerecht. Die Formulierung »lässt auch das Vieh nicht fressen« bildet die negative Zulassungs-Konstruktion ⲕⲱ ... ⲉⲟⲩⲱⲙ angemessen ab, ohne zusätzliche theologische Deutung.
