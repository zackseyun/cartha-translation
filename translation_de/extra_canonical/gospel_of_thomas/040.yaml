base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/040.yaml
  text: Jesus said[a], "A grapevine was planted outside the Father, and since it is not established[e][d][c][b], it will be uprooted from its root and will perish."
translation:
  language: de
  text: 'Jesus sagte: „Ein Weinstock wurde außerhalb des Vaters gepflanzt. Weil er aber nicht fest gegründet ist,[a] wird man ihn mit der Wurzel ausreißen,[b] und er wird zugrunde gehen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „nicht fest ist“, „keinen festen Bestand hat“ oder, dem Bild entsprechend, „nicht Wurzeln gefasst hat“. Das koptische Verb nennt die Wurzel an dieser Stelle jedoch nicht ausdrücklich.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlicher lässt sich die unbestimmte Mehrzahl mit „sie werden ihn … ausreißen“ wiedergeben. Die Verbindung mit „Wurzel“ kann auch „von seiner Wurzel her“ oder „an seiner Wurzel“ verstanden werden.
    reason: grammar_and_lexical_alternative
lexical_decisions:
- source_word: ⲟⲩⲃⲁⲡⲉⲗⲟⲟⲗⲉ
  choice: ein Weinstock
  rationale: Das griechische Lehnwort ἄμπελος bezeichnet den Weinstock beziehungsweise die Weinrebe; „Weinstock“ ist im Deutschen konkret, natürlich und der landwirtschaftlichen Bildwelt angemessen.
- source_word: ⲁⲩⲧⲟϭⲥ
  choice: wurde … gepflanzt
  rationale: Die unbestimmte dritte Person Plural wird im Deutschen idiomatisch als Passiv wiedergegeben; ⲧⲱϭⲉ bedeutet „pflanzen“.
- source_word: ⲙ̄ⲡⲥⲁ ⲛⲃⲟⲗ ⲙ̄ⲡⲉⲓⲱⲧ
  choice: außerhalb des Vaters
  rationale: Die Ortsangabe bedeutet wörtlich „außerhalb des Vaters“. Die bestimmte Form „des Vaters“ bleibt erhalten; eine Harmonisierung zu „meines Vaters“ wird vermieden.
- source_word: ⲉⲥⲧⲁϫⲣⲏⲩ ⲁⲛ
  choice: nicht fest gegründet ist
  rationale: Der Stativ beschreibt einen gegenwärtigen Zustand. „Fest gegründet“ bewahrt das Bedeutungsspektrum von Festigkeit und Beständigkeit, ohne ausdrücklich das im Verb nicht genannte Bild des Wurzelfassens einzuführen.
- source_word: ⲥⲉⲛⲁⲡⲟⲣⲕⲥ
  choice: wird man ihn … ausreißen
  rationale: Die unbestimmte dritte Person Plural bezeichnet eine allgemeine, nicht näher benannte Handlungsträgerschaft. Das deutsche unpersönliche „man“ erhält diese Form besser als ein reines Passiv; ⲡⲱⲣⲕ bedeutet im landwirtschaftlichen Zusammenhang „ausreißen/entwurzeln“.
- source_word: ϩⲁⲧⲉⲥⲛⲟⲩⲛⲉ
  choice: mit der Wurzel
  rationale: Die Wendung lässt sowohl eine Deutung als Trennung von der Wurzel als auch als Ausreißen an beziehungsweise mitsamt der Wurzel zu. „Mit der Wurzel ausreißen“ ist natürliches Deutsch und wahrt den Bezug zur Wurzel.
- source_word: ⲧⲁⲕⲟ
  choice: zugrunde gehen
  rationale: Das Verb bezeichnet Untergang oder Verderben. „Zugrunde gehen“ trägt den feierlich-sprichwortartigen Ton, ohne unnötig eine äußere Vernichtung oder ein bloß biologisches Sterben festzulegen.
theological_decisions:
- issue: Bezug von „außerhalb des Vaters“
  choice: Die ungewöhnliche Formulierung bleibt wörtlich und ungedeutet stehen.
  alternative: „nicht vom Vater gepflanzt“ nach einer möglichen synoptischen Parallele
  rationale: Der koptische Text spricht von einem Ort beziehungsweise Bereich „außerhalb des Vaters“ und sagt nicht ausdrücklich, der Vater habe den Weinstock nicht gepflanzt. Die Übersetzung bewahrt diese theologische Spannung und harmonisiert nicht mit Matthäus 15,13.
- issue: Zeitwert des Zustandsverbs
  choice: „ist“
  alternative: „war“
  rationale: Die koptische circumstantielle Stativform bezeichnet den bestehenden Zustand des Weinstocks; eine Vorvergangenheit würde die Aussage zeitlich stärker festlegen als die Quelle.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, spruchhafter Satzführung. Das unpersönliche „man“ klingt natürlicher als ein unbezeichnetes „sie“, bewahrt aber die generische Handlungsträgerschaft. Die ungewöhnliche Wendung „außerhalb des Vaters“ wird bewusst nicht geglättet oder durch eine kanonische Parallele erklärt.
