base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/061.yaml
  text: 'Jesus said, "Two will rest on a couch; one will die, one will live."


    Salome said, "Who are you, man? As from one, you have gotten up onto my couch and eaten from my table."


    Jesus said to her, "I am he who exists from the Equal. I was given from the things of my Father."


    [Salome said,] "I am your disciple."


    [Jesus said,] "Because of this I say: whenever one becomes empty, he will be filled with light; but whenever one becomes divided, he will be filled with darkness."'
translation:
  language: de
  text: 'Jesus sagte: „Zwei werden auf einer Liege ruhen. Einer wird sterben, einer wird leben.“


    Salome sagte: „Wer bist du, Mensch? Gleichsam aus Einem[a] bist du auf meine Liege gestiegen und hast von meinem Tisch gegessen.“


    Jesus sagte zu ihr: „Ich bin der, der aus dem Gleichen[b] stammt. Mir wurde von dem gegeben, was meinem Vater gehört.“


    [Salome sagte:] „Ich bin deine Jüngerin.“[c]


    [Jesus sagte:] „Darum sage ich: Wenn einer leer[d] wird, wird er mit Licht erfüllt werden; wenn einer aber geteilt wird, wird er mit Finsternis erfüllt werden.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „wie aus Einem“. Die ungewöhnliche Wendung kann „wie von einem [bestimmten Menschen] her“ oder „aus dem Einen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Koptisch: „das, was gleich ist“ oder „das Gleiche“. Auch eine Deutung im Sinn von Einheit beziehungsweise Ungeteiltheit ist möglich.'
    reason: theological_note
  - marker: c
    text: Die koptische Handschrift nennt die Sprecher der letzten beiden Aussagen nicht ausdrücklich. Die Angaben „Salome sagte“ und „Jesus sagte“ sind aus dem Dialogzusammenhang ergänzt.
    reason: textual_clarity
  - marker: d
    text: Die Handschrift liest „leer“. Häufig wird stattdessen „gleich“ vermutet, wodurch sich ein unmittelbarer Gegensatz zu „geteilt“ und ein Rückbezug auf „das Gleiche“ ergäbe.
    reason: textual_variant
lexical_decisions:
- source_word: ϭⲗⲟϭ
  choice: Liege
  rationale: Bezeichnet ein Bett oder eine Liege; „Liege“ passt sowohl zum Ruhen als auch zum Essen bei Tisch und klingt im modernen Deutschen natürlich.
- source_word: ϩⲱⲥ ⲉⲃⲟⲗ ϩⲛⲟⲩⲁ
  choice: gleichsam aus Einem
  rationale: Bewahrt die ungewöhnliche und mehrdeutige Formulierung des Koptischen, ohne sie auf eine bestimmte theologische Deutung festzulegen.
- source_word: ⲡⲉⲧϣⲏϣ
  choice: das Gleiche / aus dem Gleichen
  rationale: Gibt die substantivierte Bedeutung „das, was gleich ist“ knapp wieder und lässt offen, ob ein Zustand, ein Ursprung oder eine personale Größe gemeint ist.
- source_word: ⲛⲁⲡⲁⲉⲓⲱⲧ
  choice: was meinem Vater gehört
  rationale: Gibt die koptische pluralische Possessivbildung wieder, die nicht bloß „mein Vater“, sondern „die Dinge meines Vaters“ beziehungsweise „das Meinem Vater Gehörende“ bezeichnet.
- source_word: ϣⲏϥ
  choice: leer
  rationale: Folgt der überlieferten Handschriftenlesart, dem Stativ von „leer oder öde sein“, und erhält den Gegensatz beziehungsweise das Wortspiel mit „erfüllt werden“.
- source_word: ⲡⲏϣ
  choice: geteilt
  rationale: Gibt den Stativ des Verbs „teilen“ wieder und vermeidet die nicht quellengemäße Wiedergabe „zwei“.
theological_decisions:
- issue: Deutung von ⲡⲉⲧϣⲏϣ
  choice: aus dem Gleichen
  alternative: aus dem, was gleich ist; aus dem Ungeteilten
  rationale: „Das Gleiche“ bleibt nahe an der Lexik und bewahrt die mögliche Aussage über Einheit, ohne „das Ungeteilte“ als bereits entschiedene theologische Auslegung in den Haupttext einzutragen.
- issue: Handschriftenlesart ϣⲏϥ gegenüber Konjektur ϣⲏϣ
  choice: leer
  alternative: gleich
  rationale: Die Handschrift bietet „leer“. Eine Änderung zu „gleich“ würde zwar einen glatten Gegensatz zu „geteilt“ und einen Rückbezug auf „das Gleiche“ schaffen, ist aber eine Konjektur und wird deshalb nur in der Fußnote genannt.
- issue: Nicht ausdrücklich bezeichnete Sprecher der letzten beiden Aussagen
  choice: Sprecherangaben in eckigen Klammern ergänzen
  alternative: Sprecherwechsel ohne Kennzeichnung wiedergeben
  rationale: Der Dialogzusammenhang legt Salome und Jesus als Sprecher nahe, doch die koptische Handschrift nennt sie an diesen Stellen nicht ausdrücklich. Eckige Klammern und eine Fußnote machen die Ergänzung transparent.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, spruchhafter Syntax. Die befremdlichen Wendungen „gleichsam aus Einem“ und „aus dem Gleichen“ bleiben bewusst stehen, weil ihre Mehrdeutigkeit zum Quellenbefund gehört. „Jüngerin“ entspricht in natürlichem Deutsch der weiblichen Sprecherin Salome.
