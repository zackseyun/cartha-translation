  source_fidelity: 'Die Übersetzung folgt dem sahidisch-koptischen Text insgesamt zuverlässig: Liege, die beiden gegensätzlichen Schicksale, die nicht eindeutig zu deutende Wendung „wie/als aus einem“, die Lesart „leer“ sowie „geteilt“ sind sachgerecht wiedergegeben. Bei ⲡⲉⲧϣⲟⲟⲡ ⲉⲃⲟⲗ ϩⲙ̄ⲡⲉⲧϣⲏϣ bezeichnet das Koptische jedoch primär ein Sein bzw. eine Herkunft „aus dem Gleichen“, nicht ausdrücklich ein Hervorgehen als Vorgang.'
  naturalness: Modernes Standarddeutsch und der knappe, spruchhafte Registerton sind gelungen. „Stammt“ ist bei der schwierigen Herkunftsaussage idiomatischer und zugleich semantisch zurückhaltender als „hervorgeht“.
  terminology: „Liege“, „Jüngerin“, „das Gleiche“, „leer“ und „geteilt“ sind konsistent und quellennahe. Die Fußnoten bewahren die textliche und semantische Unsicherheit, ohne eine konfessionelle Deutung festzuschreiben. Die Anker sind sinnvoll gesetzt.
  issues:
  - severity: low
    issue: „hervorgeht“ für ⲡⲉⲧϣⲟⲟⲡ ⲉⲃⲟⲗ
    rationale: „Hervorgehen“ kann im Deutschen einen dynamischen Entstehungs- oder Emanationsvorgang nahelegen. Die koptische Formulierung besagt zurückhaltender, dass der Sprecher „aus dem Gleichen“ ist bzw. von dort stammt. „stammt“ gibt die Herkunftsrelation ohne zusätzliche Prozessvorstellung wieder.
  revised_text: 'Jesus sagte: „Zwei werden auf einer Liege ruhen. Einer wird sterben, einer wird leben.“


    Salome sagte: „Wer bist du, Mensch? Gleichsam aus Einem[a] bist du auf meine Liege gestiegen und hast von meinem Tisch gegessen.“


    Jesus sagte zu ihr: „Ich bin der, der aus dem Gleichen[b] stammt. Mir wurde von dem gegeben, was meinem Vater gehört.“


    [Salome sagte:] „Ich bin deine Jüngerin.“[c]


    [Jesus sagte:] „Darum sage ich: Wenn einer leer[d] wird, wird er mit Licht erfüllt werden; wenn einer aber geteilt wird, wird er mit Finsternis erfüllt werden.“'
  revised_footnotes:
  - marker: a
    text: 'Wörtlich etwa: „wie aus Einem“. Die ungewöhnliche Wendung kann „wie von einem [bestimmten Menschen] her“ oder „aus dem Einen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Koptisch: „das, was gleich ist“ oder „das Gleiche“. Auch eine Deutung im Sinn von Einheit beziehungsweise Ungeteiltheit ist möglich.'
    reason: theological_note
  - marker: c
    text: Die koptische Handschrift nennt die Sprecher der letzten beiden Aussagen nicht ausdrücklich. Die Angaben „Salome sagte“ und „Jesus sagte“ sind aus dem Dialogzusammenhang ergänzt.
    reason: textual_clarity
  - marker: d
    text: Die Handschrift liest „leer“. Häufig wird stattdessen „gleich“ vermutet, wodurch sich ein unmittelbarer Gegensatz zu „geteilt“ und ein Rückbezug auf „das Gleiche“ ergäbe.
    reason: textual_variant
  revision_rationale: Die einzige sichere Anpassung ersetzt „hervorgeht“ durch „stammt“, damit die deutsche Fassung die Herkunfts- bzw. Seinsrelation des koptischen Ausdrucks wiedergibt, ohne einen weitergehenden Vorgang zu behaupten. Alle übrigen Formulierungen und Fußnoten können unverändert bleiben.
