base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/101.yaml
  text: Whoever does not hate his father and his mother as I do cannot become my disciple[a]; and whoever does not love his father and his mother as I do cannot become my disciple. For my mother [...][c], but my true[b] [mother] gave me life.
translation:
  language: de
  text: Wer seinen Vater und seine Mutter nicht auf meine Weise hasst, kann nicht mein Jünger werden[a]. Und wer seinen Vater und seine Mutter nicht auf meine Weise liebt, kann nicht mein Jünger werden. Denn meine Mutter […][c], meine wahre[b] Mutter aber gab mir das Leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „wie ich“ (ⲛ̄ⲧⲁϩⲉ).'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „der Wahrheit“ (ⲙ̄ⲙⲉ).'
    reason: lexical_alternative
  - marker: c
    text: Das Manuskript ist hier beschädigt (ⲛ̄ⲧⲁⲥ̣[.........] [..]ⲟ̣ⲗ̣). Der verlorene Text wird unterschiedlich ergänzt, etwa im Sinn von „gebar mich zum Tod“ oder „gab mir Lüge“; keine Ergänzung ist sicher.
    reason: textual_variant
lexical_decisions:
- source_word: ⲙⲉⲥⲧⲉ
  choice: hasst
  rationale: Das sahidische Verb bezeichnet gewöhnlich „hassen“. Die Härte und Spannung der Aussage wird nicht abgeschwächt.
- source_word: ⲙⲣ̄ⲣⲉ
  choice: liebt
  rationale: Die Konstruktform von ⲙⲉ bedeutet „lieben“ und bildet den beabsichtigten Gegensatz zu „hassen“.
- source_word: ⲛ̄ⲧⲁϩⲉ
  choice: wie ich
  rationale: Die Wendung bedeutet wörtlich „auf meine Weise“ beziehungsweise „wie ich“. Das knappe „wie ich“ bewahrt die mögliche Beziehung sowohl zur vorausgehenden Handlung als auch zu Jesus als Vergleichsmaßstab.
- source_word: ϣ … ⲁⲛ
  choice: kann nicht
  rationale: Die Verbindung des Fähigkeitsverbs mit der Negation drückt Unvermögen aus.
- source_word: ⲙ̄ⲙⲉ
  choice: wahre
  rationale: Wörtlich „der Wahrheit“; attributiv natürlich als „wahre“ wiedergegeben, ohne die Identität dieser Mutter festzulegen.
- source_word: ⲱⲛϩ
  choice: das Leben
  rationale: Das Substantiv bedeutet „Leben“; der bestimmte deutsche Ausdruck passt zur koptischen Konstruktion und zum feierlichen Register.
theological_decisions:
- issue: Gegensatz zwischen der zuerst genannten Mutter und der „wahren Mutter“
  choice: Die beschädigte Aussage über die erste Mutter bleibt offen; „wahre [Mutter]“ wird nicht mit dem Heiligen Geist, der Weisheit oder einer anderen Gestalt identifiziert.
  alternative: Die Lücke sinngemäß etwa mit „gebar mich zum Tod“ oder „gab mir Lüge“ ergänzen und die wahre Mutter theologisch bestimmen.
  rationale: Das Manuskript erlaubt keine sichere Ergänzung. Die erhaltene Formulierung stellt zwar einen Gegensatz zum lebenspendenden Handeln der wahren Mutter her, bestimmt aber weder den fehlenden Wortlaut noch ausdrücklich deren Identität.
- issue: Wiederholung von „hassen“ und „lieben“
  choice: Beide scheinbar spannungsvollen Forderungen werden unverändert nebeneinandergestellt.
  alternative: „Hassen“ als „weniger lieben“ abschwächen oder beide Sätze harmonisierend deuten.
  rationale: Der koptische Text verwendet eindeutige Verben für Hassen und Lieben. Eine Harmonisierung würde die genuine rhetorische und theologische Spannung auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Spruchstil. „Jünger“ bleibt als etablierter religiöser Ausdruck erhalten. Die Lücke wird sichtbar markiert; die ergänzte Wiederaufnahme von „Mutter“ steht in eckigen Klammern.
