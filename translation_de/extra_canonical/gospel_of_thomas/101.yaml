  naturalness: Der Spruch klingt in modernem Standarddeutsch knapp und verständlich. „Auf meine Weise“ ist gegenüber dem isolierten „wie ich“ präziser und idiomatisch, weil es die im Koptischen ausgedrückte Modalbestimmung wiedergibt, ohne im Deutschen eine unausgesprochene Vergleichshandlung ergänzen zu müssen.
  terminology: „Jünger“, „hassen“, „lieben“, „wahre Mutter“ und „Leben“ sind sachgerecht. „Wahre“ gibt die attributive Wendung „der Wahrheit“ angemessen wieder, ohne die Mutter theologisch zu identifizieren.
