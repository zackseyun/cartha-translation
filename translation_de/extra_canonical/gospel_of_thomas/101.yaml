revisions:
- from: Wer seinen Vater und seine Mutter nicht hasst wie ich, kann nicht mein Jünger werden[a]. Und wer seinen Vater und seine Mutter nicht liebt wie ich, kann nicht mein Jünger werden. Denn meine Mutter […][c], meine wahre[b] [Mutter] aber gab mir das Leben.
  to: Wer seinen Vater und seine Mutter nicht auf meine Weise hasst, kann nicht mein Jünger werden[a]. Und wer seinen Vater und seine Mutter nicht auf meine Weise liebt, kann nicht mein Jünger werden. Denn meine Mutter […][c], meine wahre[b] Mutter aber gab mir das Leben.
  rationale: Die Revision beseitigt die unzutreffende Kennzeichnung von „Mutter“ als ergänztem Text, lässt die tatsächliche Lücke sichtbar bestehen und verwendet für ⲛ̄ⲧⲁϩⲉ eine präzisere deutsche Modalformulierung. Die theologische Identität der „wahren Mutter“ bleibt bewusst offen.
