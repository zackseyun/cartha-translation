base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/075.yaml
  text: Jesus said[a], “Many are standing at the door[e][d][c][b], but it is the solitary ones who will enter into the place of the bridal chamber.”
translation:
  language: de
  text: 'Jesus sagte: »Viele stehen[a] an der Tür, doch die Einsamen[b] sind es, die in den Ort des Brautgemachs[c] hineingehen werden.«[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier die koptische Wendung „auf ihren Füßen stehen“; gemeint ist schlicht „stehen“.
    reason: dialect_note
  - marker: b
    text: Das Wort ⲙⲟⲛⲁⲭⲟⲥ (griechisch μονάχος) kann „einsam“, „einzeln“ oder „allein lebend“ bedeuten, später auch „Mönch“. Welche inhaltliche Färbung hier gemeint ist, bleibt offen.
    reason: lexical_alternative
  - marker: c
    text: Wörtlich „der Ort des Brautgemachs“. Das im Koptischen ausdrücklich genannte Wort „Ort“ ist deshalb beibehalten.
    reason: lexical_alternative
  - marker: d
    text: 'Die Handschrift hat hier den Plural: „die Einsamen … diejenigen, die hineingehen werden“. Der normalisierte Text bietet dagegen den Singular: „der Einsame … derjenige, der hineingehen wird“. Die Übersetzung folgt der Handschrift.'
    reason: textual_variant
lexical_decisions:
- source_word: ⲟⲩⲛϩⲁϩ
  choice: Viele
  rationale: Die koptische Existenzkonstruktion bedeutet „es gibt viele“; im Deutschen führt „Viele stehen“ den Satz natürlich und bewahrt die Hervorhebung der Menge.
- source_word: ⲱϩⲉⲣⲁⲧⲛⲧⲟⲟⲩ
  choice: stehen
  rationale: Die Wendung lautet wörtlich „auf ihren Füßen stehen“, ist aber eine gewöhnliche koptische Ausdrucksweise für „stehen“.
- source_word: ϩⲓⲣⲛⲡⲣⲟ
  choice: an der Tür
  rationale: Die Präposition bezeichnet hier eine Lage an oder bei der Tür; „an der Tür“ ist im Deutschen knapp und natürlich.
- source_word: ⲁⲗⲗⲁ
  choice: doch
  rationale: Das aus dem Griechischen entlehnte Adversativ markiert einen scharfen Gegensatz; „doch“ gibt ihn in diesem Ausspruch idiomatisch wieder.
- source_word: ⲙ̄ⲙⲟⲛⲁⲭⲟⲥ
  choice: die Einsamen
  rationale: Das griechische Lehnwort μονάχος kann einen allein oder einzeln Seienden und später auch einen Mönch bezeichnen. „Die Einsamen“ bewahrt den Gedanken des Alleinseins, ohne die spätere institutionelle Bedeutung festzuschreiben.
- source_word: ⲛⲉⲧⲛⲁⲃⲱⲕ ⲉϩⲟⲩⲛ
  choice: die … hineingehen werden
  rationale: Die Handschrift bietet eine plurale Relativform mit Zukunftsbezug. „Hineingehen“ bildet die gerichtete Bewegung ins Innere ab.
- source_word: ⲡⲙⲁ ⲛ̄ϣⲉⲗⲉⲉⲧ
  choice: den Ort des Brautgemachs
  rationale: Da ⲙⲁ „Ort“ ausdrücklich im Text steht, bleibt die konkrete Konstruktion erhalten, statt sie auf „das Brautgemach“ zu verkürzen.
theological_decisions:
- issue: Bedeutung von ⲙⲟⲛⲁⲭⲟⲥ
  choice: die Einsamen
  alternative: die Mönche; die Einzelnen
  rationale: Die Übersetzung legt weder eine spätere monastische Institution noch eine bestimmte Lehre von innerer Ganzheit in den Text hinein. Die mögliche Bedeutungsspanne wird in der Fußnote offengehalten.
- issue: Numerus des eintretenden Subjekts
  choice: 'Plural nach der Handschrift: „die Einsamen sind es, die …“'
  alternative: 'Singular nach dem normalisierten Text: „der Einsame ist es, der …“'
  rationale: Die überlieferte Handschriftenform hat den pluralischen Artikel und die pluralische Relativform. Daher folgt der Haupttext dem Manuskript; die abweichende editorische Normalisierung wird dokumentiert.
translation_notes:
  register: Kurzer, spruchhafter Satz in modernem, würdigem Standarddeutsch. Die Gegenüberstellung „Viele … doch die Einsamen“ und die koptische Spaltsatzbetonung „sind es, die“ bleiben erhalten. Ungewöhnliche Bilder und lexikalische Mehrdeutigkeit werden nicht geglättet.
