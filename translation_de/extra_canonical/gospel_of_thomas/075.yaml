  source_fidelity: 'Der Haupttext folgt zu Recht der handschriftlichen Lesart: ⲙ̄ⲙⲟⲛⲁⲭⲟⲥ und ⲛⲉⲧⲛⲁⲃⲱⲕ sind pluralisch. Die Konstruktion „die Einsamen sind es, die …“ gibt die hervorgehobene Identifikation angemessen wieder. „An der Tür“, „hineingehen werden“ und „der Ort des Brautgemachs“ entsprechen dem koptischen Wortlaut, einschließlich des ausdrücklich genannten ⲡⲙⲁ („Ort“).'
  naturalness: Der Satz ist idiomatisches, modernes Standarddeutsch und bewahrt zugleich den knappen, spruchhaften Duktus. „Die Einsamen“ ist als substantiviertes Adjektiv verständlich; die Relativkonstruktion klingt natürlich und transportiert den Kontrast klar.
  terminology: „Brautgemach“ ist für ϣⲉⲗⲉⲉⲧ treffend und registergerecht. „Die Einsamen“ vermeidet zu Recht die anachronistische Festlegung auf „Mönche“, ohne die semantische Offenheit von ⲙⲟⲛⲁⲭⲟⲥ doktrinär einzuengen. Die Fußnoten erläutern sowohl die idiomatische Wendung als auch die relevante Singular-/Pluralabweichung sachlich.
