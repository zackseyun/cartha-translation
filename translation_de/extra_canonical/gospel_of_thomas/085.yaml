base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/085.yaml
  text: Jesus said[1], "Adam came into being from a great power and a great wealth, and he did not become worthy of you. For had he been worthy[2], he would not have tasted death."
translation:
  language: de
  text: 'Jesus sagte: »Adam ging aus einer großen Kraft und einem großen Reichtum hervor, doch er wurde eurer nicht würdig.[a] Denn wäre er würdig gewesen,[b] hätte er den Tod nicht gekostet.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Handschrift weist bei dem ersten Wort für „würdig“ sowie später bei „hätte … gekostet“ Lücken auf. Die Ergänzungen ergeben sich aus dem Zusammenhang und dem verfügbaren Raum.
    reason: textual_variant
  - marker: b
    text: 'Der koptische Satz ist als irreale Bedingung der Vergangenheit formuliert: „Wäre er würdig gewesen, hätte er den Tod nicht gekostet.“'
    reason: register_note
lexical_decisions:
- source_word: ϣⲱⲡⲉ ⲉⲃⲟⲗ
  choice: ging … hervor
  rationale: Die Verbindung bezeichnet das Entstehen oder Hervorgehen. „Ging … hervor“ gibt den Ursprung aus der genannten Kraft und dem Reichtum natürlich wieder, ohne „Geburt“ einzutragen.
- source_word: ⲟⲩⲛⲟϭ ⲛⲇⲩⲛⲁⲙⲓⲥ
  choice: einer großen Kraft
  rationale: ⲟⲩ ist der unbestimmte Singularartikel; daher steht hier eine einzelne „große Kraft“, nicht ein Plural.
- source_word: ⲟⲩⲛⲟϭ ⲛⲙⲛⲧⲣⲙⲙⲁⲟ
  choice: einem großen Reichtum
  rationale: Das Abstraktnomen bezeichnet Reichtum oder Wohlstand. „Reichtum“ bewahrt den Singular und passt zur parallelen Satzstruktur.
- source_word: ⲙⲡϣⲁ / ⲁⲝⲓⲟⲥ
  choice: würdig
  rationale: Beide Ausdrücke bezeichnen hier Würdigkeit. Die einheitliche Wiedergabe erhält die begriffliche Wiederaufnahme im Folgesatz.
- source_word: ϫⲓ ϯⲡⲉ ⲙⲡⲙⲟⲩ
  choice: den Tod kosten
  rationale: ϫⲓ ϯⲡⲉ ist die feste Wendung „kosten/schmecken“. „Den Tod kosten“ bewahrt das konkrete Bild und vermeidet die falsche Deutung als Ortsangabe.
theological_decisions:
- issue: Bezug der Würdigkeit auf die angeredeten Personen (ⲙⲙⲱⲧⲛ̄)
  choice: eurer nicht würdig
  alternative: euch nicht ebenbürtig
  rationale: Der Genitiv „eurer würdig“ bildet die direkte Beziehung zur angesprochenen Mehrzahl ab. „Ebenbürtig“ würde die Aussage enger als Gleichrangigkeit deuten und damit die vorhandene Spannung auflösen.
- issue: Verhältnis von Adams Ursprung, seiner Würdigkeit und seinem Tod
  choice: Die drei Aussagen werden ohne erklärende theologische Ergänzung nebeneinandergestellt.
  alternative: Adams Tod ausdrücklich als Beweis seiner Unwürdigkeit erklären
  rationale: Der irreale Bedingungssatz verbindet Würdigkeit und Nicht-Kosten des Todes, erklärt aber weder die Art der „Kraft“ und des „Reichtums“ noch den genauen Maßstab der Würdigkeit. Die Übersetzung bewahrt diese Offenheit.
- issue: Zeitwert des irrealen Bedingungssatzes
  choice: wäre … gewesen / hätte … nicht gekostet
  alternative: wenn er würdig wäre, würde er den Tod nicht kosten
  rationale: 'Die koptische Konstruktion beschreibt einen irrealen Rückblick: Adam war nicht würdig und hat den Tod gekostet. Das deutsche Plusquamperfekt des Konjunktivs gibt diesen Gegenwartsabschluss präzise wieder.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Eurer würdig“ ist bewusst etwas gehobener, bildet aber die direkte Anrede im Plural präzise ab. Die Bildrede „den Tod kosten“ bleibt erhalten. Die Wiederholung von „würdig“ spiegelt die enge argumentative Verknüpfung des koptischen Textes.
