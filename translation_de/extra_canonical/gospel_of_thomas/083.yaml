base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/083.yaml
  text: Jesus said[1], "The images are manifest to humanity, and the light that is within them is hidden in the image of the light of the Father. He will be revealed[2], and his image is hidden by his light."
translation:
  language: de
  text: 'Jesus sagte: „Die Bilder sind für den Menschen[a] sichtbar, und das Licht in ihnen ist im Bild des Lichts des Vaters verborgen. Er wird offenbar werden[b], und sein Bild ist durch sein Licht verborgen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Koptischen der Singular „für den Menschen“; er kann den Menschen allgemein, also die Menschheit, bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Die koptischen Formen für „er/sein“ können sich sowohl auf den Vater als auch auf das Licht beziehen, da beide Wörter im Koptischen männlich sind. Daher ist auch möglich: „Es wird offenbar werden, und dessen Bild ist durch dessen Licht verborgen.“'
    reason: referential_ambiguity
lexical_decisions:
- source_word: ⲛϩⲓⲕⲱⲛ
  choice: die Bilder
  rationale: Das griechische Lehnwort εἰκών bezeichnet Bilder, Abbilder oder sichtbare Gestalten. Der überlieferte Handschriftentext hat hier den Plural.
- source_word: ⲥⲉⲟⲩⲟⲛϩ ⲉⲃⲟⲗ
  choice: sind … sichtbar
  rationale: Die Stativform bezeichnet einen offen zutage liegenden, wahrnehmbaren Zustand; „sichtbar“ ist im Deutschen natürlich und bewahrt den Gegensatz zum verborgenen Licht.
- source_word: ⲙ̄ⲡⲣⲱⲙⲉ
  choice: für den Menschen
  rationale: Der bestimmte Singular bezeichnet hier wahrscheinlich den Menschen im allgemeinen Sinn. Die Formulierung erhält den Singular, ohne ihn auf eine Einzelperson festzulegen.
- source_word: ϩⲏⲡ⳿ / ϩⲱⲡ
  choice: ist … verborgen
  rationale: Die Stativform bezeichnet einen gegenwärtigen Zustand des Verborgenseins, nicht ein künftiges Verbergen.
- source_word: ϭⲱⲗⲡ⳿ ⲉⲃⲟⲗ
  choice: wird offenbar werden
  rationale: Das Verb bedeutet hier „offenbar werden“ beziehungsweise „enthüllt werden“ und bildet den beabsichtigten Gegensatz zu „verborgen“.
- source_word: ϩⲓⲧⲛ̄ⲡⲉϥⲟⲩⲟⲉⲓⲛ
  choice: durch sein Licht
  rationale: ϩⲓⲧⲛ̄ bezeichnet Vermittlung oder Mittel („durch“). Die ungewöhnliche Aussage wird nicht deutend geglättet.
theological_decisions:
- issue: Bezugswort der maskulinen Pronomen in „Er wird offenbar werden …“
  choice: Personale Wiedergabe mit „Er/sein“ und ausdrücklicher Fußnote zur Mehrdeutigkeit
  alternative: „Es wird offenbar werden, und sein Bild ist durch sein Licht verborgen“, wobei „es“ auf das Licht bezogen wird.
  rationale: Das koptische maskuline Singularpronomen kann grammatisch sowohl auf „den Vater“ als auch auf „das Licht“ zurückweisen, da beide koptischen Substantive maskulin sind. Der Haupttext folgt der möglichen Beziehung auf den Vater, ohne die ebenso mögliche Beziehung auf das Licht zu verschweigen.
- issue: Verhältnis von Offenbarung und Verborgenheit
  choice: Den spannungsvollen Wortlaut unverändert nebeneinanderstellen
  alternative: Die Aussage erklärend harmonisieren, etwa indem unterschiedliche Ebenen des Offenbar- und Verborgenseins ergänzt werden.
  rationale: Der Quelltext sagt zugleich, dass er offenbar werden wird und dass sein Bild durch sein Licht verborgen ist. Eine erklärende Auflösung würde eine nicht ausdrücklich gegebene Deutung eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Offenbar werden“ erhält den sprachlichen Gegensatz zu „verborgen“, während „für den Menschen sichtbar“ die erste Aussage natürlich ausdrückt. Die rätselhafte theologische Spannung und die grammatische Mehrdeutigkeit der Pronomen bleiben erhalten.
