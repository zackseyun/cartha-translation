  to: 'Jesus sagte: „Die Bilder sind für den Menschen[a] sichtbar, und das Licht in ihnen ist im Bild des Lichts des Vaters verborgen. Er wird offenbar werden[b], und sein Bild ist durch sein Licht verborgen.“'
  rationale: Die Revision ersetzt das interpretativ stärkere „doch“ durch die quellentsprechend neutrale Verbindung „und“ und glättet lediglich den deutschen Genitivgebrauch. Die Fußnote wahrt die referenzielle Mehrdeutigkeit des Koptischen, ohne eine der möglichen Deutungen dogmatisch festzulegen.
