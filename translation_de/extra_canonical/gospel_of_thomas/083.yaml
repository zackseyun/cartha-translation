  source_fidelity: 'Die Übersetzung gibt die zentralen Aussagen des koptischen Textes zutreffend wieder: die sichtbaren Bilder, das in ihnen verborgene Licht, das Bild des Lichtes des Vaters sowie den Gegensatz von Verborgenheit und künftigem Offenbarwerden. Die Mehrdeutigkeit des maskulinen Pronomens wird sachgerecht vermerkt. Das adversative „doch“ hat jedoch keine ausdrückliche Entsprechung im einfachen koptischen ⲁⲩⲱ („und“) und legt einen stärkeren logischen Gegensatz nahe, als der Wortlaut zwingend vorgibt.'
  naturalness: Der Text ist modernes, gut lesbares Standarddeutsch. „Im Bild des Lichts des Vaters“ ist idiomatischer als „im Bild des Lichtes des Vaters“, ohne den Sinn zu verändern. Die alternative Formulierung in Fußnote b sollte die deutschen Bezüge eindeutiger markieren.
  terminology: „Bilder“, „sichtbar“, „verborgen“ und „offenbar werden“ sind angemessene und konsistente Wiedergaben. „Offenbar werden“ bewahrt besonders gut den lexikalischen und rhetorischen Kontrast zu „verborgen“.
