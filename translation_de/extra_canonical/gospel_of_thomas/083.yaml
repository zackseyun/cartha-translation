  - severity: low
    issue: Die Alternativübersetzung in Fußnote b lässt den possessiven Bezug im Deutschen weniger klar erkennen.
    rationale: Bei der Lesart mit Bezug auf „das Licht“ macht „dessen Bild … dessen Licht“ deutlich, dass alle betreffenden Pronomen innerhalb der Alternative auf das Licht bezogen werden.
