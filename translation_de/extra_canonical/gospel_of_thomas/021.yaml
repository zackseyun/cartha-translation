base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/021.yaml
  text: 'Mary said to Jesus[a], "Whom are your disciples like?"


    He said, "They are like little children who have settled in a field that is not theirs. When the owners of the field come, they will say, ''Leave our field to us.'' They strip naked before them in order to leave it to them and give their field to them.


    "Therefore I say: If the master of the house knows that the thief is coming, he will keep watch before he comes and will not let him dig into his house of his kingdom to carry away his goods.


    "But you, keep watch against the world. Gird yourselves upon your loins with great power, so that the robbers will not find a way to come to you. Because the advantage you expect will be found.


    "Let there be among you a person of understanding. When the fruit ripened, he came quickly, his sickle in his hand; he harvested it. Whoever has ears to hear[b][c], let him hear."'
translation:
  language: de
  text: 'Maria sagte zu Jesus: „Wem gleichen deine Jünger?“


    Er sagte: „Sie gleichen kleinen Kindern, die sich auf einem Feld niedergelassen haben, das ihnen nicht gehört. Wenn die Besitzer des Feldes kommen, werden sie sagen: ‚Überlasst uns unser Feld.‘ Dann werden die Kinder sich vor ihnen nackt ausziehen[a], um es ihnen zu überlassen und ihnen ihr Feld zurückzugeben.


    Darum sage ich: Wenn der Hausherr weiß, dass der Dieb kommt, wird er wachsam sein, ehe der Dieb kommt, und ihn nicht in das Haus seines Königreichs[b] einbrechen und seine Habe wegtragen lassen.


    Ihr aber, nehmt euch vor der Welt in Acht. Gürtet eure Hüften mit großer Kraft, damit die Räuber keinen Weg finden, zu euch zu gelangen. Denn die Notlage, die ihr erwartet, wird eintreten.[c]


    Unter euch soll ein verständiger Mensch sein. Als die Frucht reif war, kam er eilends, die Sichel in der Hand, und erntete sie. Wer Ohren hat zu hören, der höre.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich bezeichnet das koptische Verb, dass sie nackt werden oder nackt sind. Das Motiv erscheint auch in anderen Worten des Thomasevangeliums; seine symbolische Bedeutung wird hier nicht ausdrücklich erklärt.
    reason: Die auffällige Bildsprache soll erhalten bleiben, ohne eine einzige theologische Auslegung festzuschreiben.
  - marker: b
    text: Der koptische Text hat die ungewöhnliche Wendung „das Haus seines Königreichs“. Die synoptischen Parallelworte sprechen lediglich von „seinem Haus“ (vgl. Matthäus 24,43; Lukas 12,39).
    reason: Die eigenständige Textgestalt des Thomasevangeliums wird sichtbar gemacht und nicht harmonisiert.
  - marker: c
    text: Das griechische Lehnwort χρεία kann unter anderem „Not“, „Bedürfnis“, „Notwendigkeit“, „Angelegenheit“ oder „Nutzen/Vorteil“ bedeuten. Der genaue Sinn des Satzes ist umstritten.
    reason: Die echte lexikalische Unsicherheit beeinflusst das Verständnis des ganzen Satzes und wird daher offengelegt.
lexical_decisions:
- source_word: ϭⲉⲗⲓⲧ
  choice: sich niedergelassen haben
  rationale: Das Qualitativ bezeichnet hier ein Wohnen oder Sich-Niederlassen; die Formulierung bewahrt den vorläufigen Aufenthalt auf fremdem Land.
- source_word: ⲕⲁⲕⲁϩⲏⲩ
  choice: sich nackt ausziehen
  rationale: Das Verb bezeichnet Nacktsein beziehungsweise Sich-Entkleiden. Der Zusatz „vor ihnen“ gibt ⲙ̄ⲡⲟⲩⲙ̄ⲧⲟ ⲉⲃⲟⲗ als Gegenwart der Besitzer wieder, nicht als Kleidung.
- source_word: ϣⲟϫⲧ
  choice: einbrechen
  rationale: Wörtlich kann das Verb „graben“ oder „durchgraben“ bedeuten; im Bild des Diebes ist „einbrechen“ im Deutschen natürlich und sachlich genau.
- source_word: ⲭⲣⲉⲓⲁ
  choice: Notlage
  rationale: Das griechische Lehnwort χρεία kann Not, Bedürfnis, Notwendigkeit, Angelegenheit oder Nutzen bezeichnen. „Notlage“ passt zum Warnzusammenhang, ohne die lexikalische Mehrdeutigkeit in der Fußnote zu verschweigen.
- source_word: ⲡⲱϩ
  choice: reif war
  rationale: Bei einer Frucht bezeichnet das Verb das Erreichen der Reife.
- source_word: ϩⲁⲥ-
  choice: erntete
  rationale: Die pronominale Form von ϩⲱⲥ bedeutet „ernten“ oder „abernten“.
- source_word: ⲣⲱⲙⲉ ⲛⲉⲡⲓⲥⲧⲏⲙⲱⲛ
  choice: verständiger Mensch
  rationale: Das griechisch geprägte Adjektiv bezeichnet einen kundigen, einsichtigen oder verständigen Menschen; die Übersetzung vermeidet eine unnötig technische Bedeutung.
theological_decisions:
- issue: Das Haus und das Königreich im Diebeswort
  choice: das Haus seines Königreichs
  alternative: sein Haus
  rationale: Die auffällige koptische Verbindung mit ⲙⲛⲧⲉⲣⲟ („Königreich“) wird bewahrt und nicht an synoptische Parallelfassungen angeglichen.
- issue: Das Nacktwerden der Kinder
  choice: sich vor ihnen nackt ausziehen
  alternative: sich vor ihnen entkleiden
  rationale: Die konkrete Bildsprache des koptischen Textes bleibt erhalten; eine bestimmte symbolische oder lehrmäßige Deutung wird nicht in den Haupttext eingetragen.
- issue: Warnung im Verhältnis zur Welt
  choice: nehmt euch vor der Welt in Acht
  alternative: wacht angesichts der Welt
  rationale: Die Wendung wird als Warnung wiedergegeben, ohne „Welt“ durch eine konfessionell oder systematisch bestimmte Deutung zu präzisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer direkter Rede. Die Bildfolge und die auffälligen Formulierungen des koptischen Textes bleiben erhalten; schwer verständliche Semitismen werden nur dort idiomatisch geglättet, wo der Sinn dadurch nicht festgelegt oder verändert wird.
