base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/110.yaml
  text: Jesus said, “Whoever has found the world[b] and become wealthy[a], let that one renounce the world.”
translation:
  language: de
  text: 'Jesus sagte: »Wer die Welt[b] gefunden hat und reich geworden ist[a], der soll der Welt entsagen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »groß/bedeutend geworden ist«; ⲣⲣⲙⲙⲁⲟ kann sowohl »reich werden« als auch »groß oder bedeutend werden« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Vor dem ersten Vorkommen von »Welt« ergänzt Dilley wegen einer kleinen Textlücke die koptische Präposition [ⲙ̄].
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jesus sagte
  rationale: Die feste Formel leitet direkte Rede ein; die knappe Wiedergabe bewahrt den prägnanten Stil des Thomasevangeliums.
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥ ϭⲓⲛⲉ
  choice: Wer … gefunden hat
  rationale: Die generische Relativkonstruktion wird im Deutschen natürlich mit »Wer« wiedergegeben; die Perfektform entspricht dem koptischen vollendeten Aspekt.
- source_word: ⲡⲕⲟⲥⲙⲟⲥ
  choice: die Welt
  rationale: »Welt« ist die geläufige und sachlich offene Wiedergabe des griechischen Lehnworts; die Wiederholung im Ausgangstext bleibt erhalten.
- source_word: ⲛ̄ⲧⲉⲛⲧⲟϥ ⲣⲣⲙⲙⲁⲟ
  choice: und reich geworden ist
  rationale: Die Verbform bezeichnet das Eintreten in einen Zustand. »Reich geworden« ist hier die wahrscheinlichste Bedeutung, ohne die ebenfalls mögliche Bedeutung »groß/bedeutend geworden« zu verschweigen.
- source_word: ⲙⲁⲣⲉ ⲛⲧⲟϥ
  choice: der soll
  rationale: Die deutsche Korrelativkonstruktion »Wer …, der soll …« gibt die unpersönliche Aussage und den auffordernden Charakter des koptischen Jussivs idiomatisch wieder.
- source_word: ⲁⲣⲛⲁ
  choice: entsagen
  rationale: »Entsagen« bezeichnet hier eine bewusste Abkehr und trifft die ethisch-asketische Bedeutung besser als das bloß verbale »leugnen«.
theological_decisions:
- issue: Bedeutung der Aufforderung, der Welt zu entsagen
  choice: Die Aussage bleibt ohne erklärende Ergänzung stehen.
  alternative: Die »Welt« ausdrücklich als Besitz, Gesellschaft oder böse Weltordnung deuten.
  rationale: Der koptische Text bestimmt weder den Umfang von »Welt« noch die konkrete Form des Entsagens. Eine nähere Deutung würde die theologische Spannung unzulässig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, spruchhafter Satzführung. Die Konstruktion »Wer …, der soll …« ist allgemein verständlich und bewahrt zugleich den auffordernden Ton. »Entsagen« ist leicht gehoben, aber im religiös-ethischen Zusammenhang natürlich und präzise.
