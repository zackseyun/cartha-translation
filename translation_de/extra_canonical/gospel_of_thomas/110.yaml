  naturalness: '»Jesus sagte: ›Wer die Welt gefunden hat und reich geworden ist, der soll der Welt entsagen.‹« ist idiomatisches, modernes Standarddeutsch mit passend knapper, spruchhafter Würde. Die Korrelativform »Wer …, der soll …« bildet den unpersönlichen Jussiv natürlich ab.'
