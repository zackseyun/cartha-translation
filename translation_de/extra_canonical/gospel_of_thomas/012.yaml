base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/012.yaml
  text: The disciples said to Jesus[a], "We know that you will depart from us. Who will be great over us?" Jesus said to them, "Wherever you are, you are to go to James the Just—this one[f][e][d][c][b], for whose sake heaven and earth came into being."
translation:
  language: de
  text: 'Die Jünger sagten zu Jesus: „Wir wissen, dass du von uns fortgehen wirst.[a] Wer wird über uns groß sein?[b]“ Jesus sagte zu ihnen: „Wo immer ihr seid,[c] sollt ihr zu Jakobus dem Gerechten gehen – zu ihm, um dessentwillen Himmel und Erde entstanden sind.[d]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das koptische Verb bedeutet wörtlich „gehen“. Im Zusammenhang sind auch „uns verlassen“ oder „von uns weggehen“ möglich.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Wer wird über uns groß sein?“ Die Wendung kann funktional im Sinn von „Wer wird uns führen?“ oder „Wer wird über uns herrschen?“ verstanden werden; die Übersetzung bewahrt jedoch das Bild der Größe.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: „Der Ort, an den ihr gekommen seid.“ Gemeint ist idiomatisch der jeweilige Ort, an dem sie sich befinden. Der Manuskripttext enthält hier keine reflexive Hervorhebung wie „ihr selbst“.'
    reason: alternative_reading
  - marker: d
    text: Die Wendung kann auch „für den Himmel und Erde ins Dasein kamen“ wiedergegeben werden. Der Text lässt offen, wie diese Aussage über Jakobus genau zu verstehen ist.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ⲡⲙⲁⲑⲏⲧⲏⲥ
  choice: die Jünger
  rationale: Das griechische Lehnwort bezeichnet im frühchristlichen Zusammenhang gewöhnlich die Jünger; „Schüler“ wäre möglich, träfe den etablierten Sinn hier aber weniger genau.
- source_word: ⲛⲧⲟⲕⲛⲁⲃⲱⲕ ⲛ̄ⲧⲟⲟⲧⲛ̄
  choice: du wirst von uns fortgehen
  rationale: ⲃⲱⲕ bedeutet grundsätzlich „gehen“; mit „von uns“ bezeichnet die Wendung hier ein Weggehen aus der Gemeinschaft. „Fortgehen“ bewahrt sowohl Bewegung als auch Trennung.
- source_word: ⲉⲧⲛⲁⲣ̄ⲛⲟϭ ⲉϩⲣⲁⲓ ⲉϫⲱⲛ
  choice: wird über uns groß sein
  rationale: Die ungewöhnliche Größenmetaphorik des Koptischen bleibt erhalten. Eine Glättung zu „uns führen“ oder „über uns herrschen“ würde die mögliche Funktionserklärung festlegen.
- source_word: ⲡⲙⲁ ⲛ̄ⲧⲁⲧⲉⲧⲛ̄ⲉⲓ ⲙ̄ⲙⲁⲩ
  choice: wo immer ihr seid
  rationale: Der Manuskripttext bedeutet wörtlich etwa „der Ort, an den ihr gekommen seid“. Im Zusammenhang dient die Ortswendung idiomatisch als allgemeine Angabe des jeweiligen Aufenthaltsorts; ein reflexives „ihr selbst“ steht im Manuskript nicht.
- source_word: ⲉⲧⲉⲧⲛⲁⲃⲱⲕ ϣⲁ
  choice: sollt ihr zu … gehen
  rationale: Die futurisch-direktive Form gibt hier eine Anweisung; „sollt“ vermittelt diese, ohne einen schroffen Imperativ einzutragen.
- source_word: ⲓ̈ⲁⲕⲱⲃⲟⲥ ⲡⲇⲓⲕⲁⲓⲟⲥ
  choice: Jakobus der Gerechte
  rationale: Der Personenname und das substantivierte Beiwort werden in ihrer geläufigen deutschen Form wiedergegeben.
- source_word: ⲡⲁⲉⲓ ⲛ̄ⲧⲁⲧⲡⲉ ⲙⲛ̄ⲡⲕⲁϩ ϣⲱⲡⲉ ⲉⲧⲃⲏⲧϥ̅
  choice: zu ihm, um dessentwillen Himmel und Erde entstanden sind
  rationale: Die demonstrative Hervorhebung „dieser/er“ wird durch „zu ihm“ aufgenommen. „Um dessentwillen“ bildet die kausale Wendung ab, ohne sie als Zweck, Verdienst oder zeitliche Priorität auszulegen.
theological_decisions:
- issue: Die Stellung des Jakobus
  choice: Die Anweisung, zu Jakobus dem Gerechten zu gehen, wird ohne ergänzenden Amtstitel wiedergegeben.
  alternative: „Jakobus als eurem Führer/Leiter folgen“
  rationale: Der Text nennt Jakobus als Ziel der Anweisung, bezeichnet ihn aber nicht ausdrücklich mit einem kirchlichen Leitungsamt.
- issue: Die kosmische Aussage über Jakobus
  choice: „um dessentwillen Himmel und Erde entstanden sind“
  alternative: Abschwächende oder deutende Wiedergaben wie „für den Himmel und Erde da sind“ oder „wegen dessen Gerechtigkeit“
  rationale: Die auffällige Aussage wird in ihrer theologischen Spannung stehen gelassen. Der Text erklärt weder ihre Reichweite noch den genauen Grund und erlaubt daher keine dogmatische Präzisierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, spruchhafter Syntax. Die ungewöhnliche Formulierung „über uns groß sein“ bleibt bewusst stehen, weil eine natürlichere Funktionsbezeichnung die Mehrdeutigkeit des Ausgangstextes einschränken würde. Die Ortswendung folgt dem tatsächlichen Manuskripttext statt der fehlerhaften normalisierten Form mit vermeintlicher reflexiver Hervorhebung.
