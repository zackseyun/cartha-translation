  yaml_path: translation/extra_canonical/gospel_of_thomas/subtitle.yaml
  text: The gospel according to Thomas[a][b]
translation:
  language: de
  text: Das Evangelium nach Thomas[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Gute Nachricht«. Das koptische ⲉⲩⲁⲅⲅⲉⲗⲓⲟⲛ, ein Lehnwort aus dem Griechischen εὐαγγέλιον, kann wörtlich so wiedergegeben werden; als Gattungsbezeichnung in einem Titel ist jedoch »Evangelium« üblich.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im Koptischen eine feste Titelformel: »das nach Thomas« (ⲡⲕⲁⲧⲁ ⲑⲱⲙⲁⲥ).'
    reason: cultural_note
lexical_decisions:
- source_word: ⲡⲉⲩⲁⲅⲅⲉⲗⲓⲟⲛ
  choice: Evangelium
  rationale: Das aus dem Griechischen εὐαγγέλιον entlehnte koptische Wort bezeichnet hier als Bestandteil eines Werktitels ein »Evangelium«. Diese im Deutschen eingebürgerte Gattungsbezeichnung ist natürlicher als die wörtlichere Alternative »gute Nachricht«.
- source_word: ⲡⲕⲁⲧⲁ
  choice: nach
  rationale: In der festen koptischen Titelformel gibt ⲕⲁⲧⲁ das griechische κατά wieder. Das idiomatische deutsche Gegenstück in Evangelientiteln ist »nach«; es bewahrt die Zuschreibungsformel, ohne sie ausdrücklich als Verfasserangabe festzulegen.
- source_word: ⲑⲱⲙⲁⲥ
  choice: Thomas
  rationale: Dies ist die übliche deutsche Form des Eigennamens.
theological_decisions:
- issue: Art der Zuordnung zu Thomas
  choice: nach Thomas
  alternative: von Thomas
  rationale: Die feste Formel mit κατά/ⲕⲁⲧⲁ bezeichnet die Überlieferungs- oder Zuschreibungsbeziehung des Werkes zu Thomas, behauptet aber nicht so eindeutig unmittelbare Verfasserschaft wie »von Thomas«.
translation_notes:
  register: Moderner, würdevoller Standardtitel. Die traditionelle deutsche Form »Das Evangelium nach Thomas« entspricht zugleich der koptischen Titelkonvention. Die Fußnoten erläutern die wörtliche Bedeutungsnähe und die formelhafte Konstruktion, ohne eine bestimmte Auffassung zur Verfasserschaft festzuschreiben.
