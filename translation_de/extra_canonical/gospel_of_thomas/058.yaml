base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/058.yaml
  text: Jesus said[a], "Blessed is the person who has labored[f][e][d][c][b]; he has found life."
translation:
  language: de
  text: 'Jesus sagte: »Selig[a] ist der Mensch, der sich abgemüht hat[b]; er hat das Leben gefunden.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier verwendete Wort kann auch „glücklich“ oder „glücklich zu preisen“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Das koptische Verb kann „sich abmühen“, „Mühsal ertragen“ oder „leiden“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: Die Handschrift schreibt hier ⲁⲡⲱⲛϩ; dies gilt wahrscheinlich als orthografische oder dialektale Form für das sonst erwartete ⲉⲡⲱⲛϩ, „das Leben“.
    reason: textual_variant
lexical_decisions:
- source_word: ⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: selig
  rationale: Das griechische Lehnwort μακάριος bezeichnet in einem Segensspruch einen beglückwünschten oder gesegneten Zustand. „Selig“ bewahrt den knappen, feierlichen Ton; die alltagssprachlicheren Möglichkeiten werden in der Fußnote genannt.
- source_word: ⲡⲣⲱⲙⲉ
  choice: der Mensch
  rationale: Das Wort bezeichnet einen Menschen allgemein. Die deutsche Wendung ist hier generisch und bildet den bestimmten Singular natürlich ab.
- source_word: ⲛ̄ⲧⲁϩϩⲓⲥⲉ (zu analysieren als ⲛⲧⲁ-ϥ-ϩⲓⲥⲉ)
  choice: der sich abgemüht hat
  rationale: Die Handschriftenform enthält einen relativen Perfekt mit dem Subjektpräfix der dritten Person Singular, nicht ein selbstständiges emphatisches Pronomen. ϩⲓⲥⲉ umfasst Mühe, Beschwernis und Leiden; „sich abgemüht hat“ hält Arbeit und Belastung zusammen, ohne das Wort ausschließlich als körperliche Arbeit zu verstehen.
- source_word: ⲁϥϩⲉ
  choice: er hat … gefunden
  rationale: Der Perfekt der dritten Person Singular bezeichnet eine abgeschlossene Handlung mit gegenwärtigem Ergebnis. Das schlichte „hat gefunden“ entspricht Form und knappem Stil.
- source_word: ⲁⲡⲱⲛϩ (normalisiert gewöhnlich ⲉⲡⲱⲛϩ)
  choice: das Leben
  rationale: Nach ϩⲉ steht das gefundene Ziel beziehungsweise Objekt. Der bestimmte Artikel wird im Deutschen mit „das Leben“ wiedergegeben; die überlieferte Präposition beziehungsweise Schreibform wird als orthografische oder dialektale Variante erläutert.
- source_word: ⲡⲉϫⲉⲓ︤ⲥ︥
  choice: Jesus sagte
  rationale: Die übliche erzählerische Einleitungsformel wird knapp und idiomatisch wiedergegeben.
theological_decisions:
- issue: Bedeutungsumfang von ϩⲓⲥⲉ
  choice: sich abgemüht hat
  alternative: gelitten hat
  rationale: Der Ausgangstext lässt offen, ob vor allem mühevolle Anstrengung oder erlittene Not gemeint ist. Der Haupttext wählt eine Formulierung mit Schwerpunkt auf beschwerlicher Mühe, während die mögliche Leidensbedeutung ausdrücklich in der Fußnote erhalten bleibt.
- issue: Bestimmtheit von ⲡⲱⲛϩ
  choice: das Leben
  alternative: Leben
  rationale: Der koptische bestimmte Artikel spricht für „das Leben“. Die Übersetzung deutet nicht näher aus, ob damit gegenwärtiges, ewiges oder geistliches Leben gemeint ist, und bewahrt so die theologische Offenheit des Spruchs.
translation_notes:
  register: Knappes, würdiges Standarddeutsch im Stil eines Weisheits- und Segensspruchs. „Selig“ hält den traditionellen Makarismus-Ton, während die Fußnote seine heutige Bedeutung erschließt. Der Doppelpunkt beziehungsweise die Semikolonstruktur des Inhalts wird durch ein Semikolon wiedergegeben, damit die enge Folge von Mühsal und gefundenem Leben hörbar bleibt.
