revisions:
- from: 'Seine Jünger sagten: „Zeige uns den Ort, an dem du bist; denn wir müssen ihn suchen.“ Er sagte zu ihnen: „Wer Ohren hat, soll hören.[a] Im Innern eines Menschen des Lichts ist Licht,[b] und er erleuchtet die ganze Welt.[c] Wenn er nicht leuchtet, ist da Finsternis.“[d]'
  to: 'Sein Jünger sagte: „Zeige uns den Ort, an dem du bist; denn wir müssen ihn suchen.“ Er sagte zu ihm: „Wer Ohren hat, soll hören.[a] Im Innern eines Menschen des Lichts ist Licht,[b] und er erleuchtet die ganze Welt.[c] Wenn er nicht leuchtet, ist da Finsternis.“[d]'
  rationale: Die sichere Korrektur betrifft den Singular des ersten Sprechers. Entsprechend wird auch „zu ihm“ statt „zu ihnen“ gesetzt. Text, Register, Terminologie und Fußnoten bleiben ansonsten bestehen, da sie den koptischen Wortlaut und die dokumentierten griechischen Abweichungen sachgerecht wiedergeben.
