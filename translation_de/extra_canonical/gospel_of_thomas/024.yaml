base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/024.yaml
  text: His disciples said[1], "Show us the place where you are, for it is necessary for us to seek it." He said to them, "Whoever has ears, let him hear.[1] There is light within a man of light,[2] and he lights the whole world.[3] When he does not shine[a][e][4][3][2], there is darkness."[4]
translation:
  language: de
  text: 'Sein Jünger sagte: „Zeige uns den Ort, an dem du bist; denn wir müssen ihn suchen.“ Er sagte zu ihm: „Wer Ohren hat, soll hören.[a] Im Innern eines Menschen des Lichts ist Licht,[b] und er erleuchtet die ganze Welt.[c] Wenn er nicht leuchtet, ist da Finsternis.“[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich lautet die koptische Wendung etwa: „Wer Ohren bei sich hat, soll hören.“ Das „bei sich“ gehört zur üblichen Hörformel.'
    reason: dialect_note
  - marker: b
    text: 'Der koptische Text formuliert feststellend: „Im Innern eines Menschen des Lichts ist Licht.“ Das griechische Fragment POxy 655 formuliert bedingt: „Wenn Licht in einem Menschen des Lichts ist …“'
    reason: textual_variant
  - marker: c
    text: 'Im Koptischen ist der Mensch das Subjekt: „Er erleuchtet die ganze Welt.“ Im griechischen Fragment ist dagegen das Licht das Subjekt: „Es leuchtet …“'
    reason: textual_variant
  - marker: d
    text: 'Koptisch: „Wenn er nicht leuchtet, ist da Finsternis.“ Der rekonstruierte griechische Wortlaut wird gewöhnlich sinngemäß verstanden: „Wenn es nicht da ist, ist die Welt in Finsternis.“'
    reason: textual_variant
lexical_decisions:
- source_word: ϯⲧⲥⲉⲃⲟⲁⲛⲟⲛ
  choice: Zeige uns
  rationale: Die kausative Wendung bedeutet hier „uns erkennen lassen/uns kundtun“; im Zusammenhang einer Ortsangabe ist „Zeige uns“ natürlich und genau.
- source_word: ⲧⲟⲡⲟⲥ
  choice: Ort
  rationale: Das griechische Lehnwort τόπος bezeichnet einen Ort; die knappe Wiedergabe wahrt den Ton des Spruchs.
- source_word: ⲉⲧⲉⲣⲉⲛⲧⲟⲕⲙⲙⲁⲩ
  choice: an dem du bist
  rationale: Die Relativkonstruktion bezeichnet den Ort des Seins beziehungsweise Aufenthalts, ohne ausdrücklich ein Bleiben oder Wohnen auszusagen.
- source_word: ⲡⲉⲓⲡⲁⲛⲁⲅⲕⲏ ⲉⲁⲛⲟⲛ ⲡⲉ
  choice: denn wir müssen
  rationale: Die unpersönliche Notwendigkeitskonstruktion mit dem griechischen Lehnwort ἀνάγκη wird in idiomatischem Deutsch am klarsten durch „wir müssen“ wiedergegeben.
- source_word: ϣⲓⲛⲉ ⲛⲥⲁⲛⲧⲟϥ
  choice: ihn suchen
  rationale: Das Verb bezeichnet Suchen oder Nachforschen; das Pronomen nimmt im Deutschen den maskulinen „Ort“ auf.
- source_word: ⲡⲉⲧⲉⲣⲉⲟⲩⲛ ⲙⲁⲁϫⲉ ⲙⲙⲟϥ
  choice: Wer Ohren hat
  rationale: Dies ist die geläufige deutsche Form der koptischen Hörformel; das wörtliche „bei sich hat“ ist idiomatischer Bestandteil der Konstruktion und wird in der Fußnote erläutert.
- source_word: ⲙⲁⲣⲉϥ ⲥⲱⲧⲙ
  choice: soll hören
  rationale: Die Jussivkonstruktion wird als Aufforderung wiedergegeben. „Hören“ bewahrt die formelhafte Prägnanz gegenüber dem deutenderen „zuhören“.
- source_word: ⲟⲩⲛⲟⲩⲟⲉⲓⲛ ϣⲟⲟⲡ
  choice: ist Licht
  rationale: Die koptische Existenzkonstruktion sagt aus, dass Licht vorhanden ist. Zusammen mit „Im Innern“ ergibt „ist Licht“ eine natürliche deutsche Existenzformulierung.
- source_word: ⲙ̄ⲫⲟⲩⲛ
  choice: Im Innern
  rationale: Die Wendung bezeichnet das Innere beziehungsweise den Innenraum; „Im Innern“ bewahrt die räumliche Bildsprache.
- source_word: ⲛ̄ⲛⲟⲩⲣ̄ⲙ̄ⲟⲩⲟⲉⲓⲛ
  choice: eines Menschen des Lichts
  rationale: „Mensch des Lichts“ bewahrt die markante Genitivverbindung, ohne sie als bloßes Eigenschaftswort „lichtvoll“ auszulegen.
- source_word: ϥⲣ̄ⲟⲩⲟⲉⲓⲛ ⲉⲡⲕⲟⲥⲙⲟⲥ ⲧⲏⲣϥ
  choice: er erleuchtet die ganze Welt
  rationale: Im koptischen Text ist die Person das grammatische Subjekt des Leuchtens; „erleuchtet“ gibt die auf die ganze Welt gerichtete Lichtwirkung knapp wieder.
- source_word: ⲉϥⲧⲙ̄ⲣ̄ⲟⲩⲟⲉⲓⲛ⳿ ⲟⲩⲕⲁⲕⲉ ⲡⲉ
  choice: Wenn er nicht leuchtet, ist da Finsternis
  rationale: Die negative Umstands- beziehungsweise Bedingungskonstruktion bleibt als „wenn“ offen; „ist da Finsternis“ gibt die abschließende Nominal- und Existenzbeschreibung wieder.
theological_decisions:
- issue: Subjekt des Erleuchtens
  choice: Der „Mensch des Lichts“ wird mit „er“ als Subjekt beibehalten.
  alternative: 'Das Licht als Subjekt: „es leuchtet in die ganze Welt“.'
  rationale: Der erhaltene koptische Text verwendet ein maskulines Pronomen, das auf den Menschen zurückweist. Die abweichende griechische Überlieferung wird dokumentiert, aber nicht in den Haupttext eingetragen.
- issue: Bedeutung von „Mensch des Lichts“
  choice: Die Genitivfügung bleibt unaufgelöst.
  alternative: „lichtvoller Mensch“, „erleuchteter Mensch“ oder eine ausdrücklich geistliche Deutung.
  rationale: Der Text erklärt weder die Herkunft des Lichts noch den geistlichen Status dieser Person. Eine deutende Umschreibung würde die theologische Offenheit des Bildes einschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Spruchform. „Mensch des Lichts“ bewahrt bewusst die ungewöhnliche Bildsprache des Thomastextes. Die Anrede und die Antwort bleiben direkt; erklärende Präzisierungen stehen nur in den Fußnoten.
