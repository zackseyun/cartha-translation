base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/090.yaml
  text: Jesus said[a], “Come to me; for my yoke is good, and my lordship is gentle[c][b]; and you will find rest for yourselves.”
translation:
  language: de
  text: 'Jesus sagte: „Kommt zu mir; denn mein Joch ist gut[a], und meine Herrschaft ist sanft[c]; und ihr werdet Ruhe[b] für euch selbst finden.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hier steht ⲭⲣⲏⲥⲧⲟⲥ, ein Lehnwort aus dem griechischen χρηστός („gut, angenehm, freundlich“), nicht ⲭⲣⲓⲥⲧⲟⲥ („Christus“). Es handelt sich daher um eine Eigenschaft des Jochs, nicht um einen Titel.
    reason: lexical_alternative
  - marker: b
    text: „Ruhe“ gibt das griechische Lehnwort ⲁⲛⲁⲡⲁⲩⲥⲓⲥ (ἀνάπαυσις) wieder. Im Kodex ist die Schreibung beim Ypsilon geringfügig unsicher, die Lesart selbst jedoch gesichert.
    reason: lacuna_or_restoration
  - marker: c
    text: 'Vgl. Matthäus 11,28–30. Der Thomasspruch formuliert jedoch anders: „meine Herrschaft ist sanft“ sowie „für euch selbst“ statt „für eure Seelen“.'
    reason: cross_reference
lexical_decisions:
- source_word: ⲉⲓⲛⲧⲱⲧⲛ ϣⲁⲁⲛⲟⲕ
  choice: Kommt zu mir
  rationale: Der Imperativ richtet sich an mehrere Personen; die deutsche Form „Kommt“ macht den Plural ausdrücklich und gibt die Zielangabe natürlich wieder.
- source_word: ⲟⲩⲭⲣⲏⲥⲧⲟⲥ
  choice: gut
  rationale: Das griechische Lehnwort entspricht χρηστός („gut, angenehm, freundlich“), nicht χριστός („Christus“). „Gut“ bewahrt den Grundsinn, ohne die Formulierung an Matthäus 11 anzugleichen.
- source_word: ⲛⲁϩⲃ
  choice: Joch
  rationale: Dies ist die direkte und im Deutschen verständliche Wiedergabe des landwirtschaftlichen und übertragenen Begriffs.
- source_word: ⲙⲛⲧϫⲟⲉⲓⲥ
  choice: Herrschaft
  rationale: Das Abstraktum zu „Herr/Herr sein“ bezeichnet Herrschaft oder Herrsein. „Herrschaft“ ist im modernen Deutsch natürlicher als „Herrsein“ und erhält den sozialen Bedeutungsgehalt.
- source_word: ⲟⲩⲣⲙⲣⲁϣ
  choice: sanft
  rationale: Das Prädikat beschreibt die Herrschaft als mild oder sanft. „Sanft“ ist verständlich und wahrt zugleich die ungewöhnliche Aussage des koptischen Textes.
- source_word: ⲛⲧⲱⲧⲛⲛⲁϩⲉ
  choice: ihr werdet … finden
  rationale: Die futurische Konstruktion mit einem Subjekt der zweiten Person Plural wird im Deutschen direkt wiedergegeben.
- source_word: ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: Ruhe
  rationale: Das griechische Lehnwort ἀνάπαυσις bedeutet „Ruhe, Erholung“. „Ruhe“ ist die knappste und geläufigste Entsprechung.
- source_word: ⲛⲁⲛⲧⲱⲧⲛ
  choice: für euch selbst
  rationale: Die Dativ-/Vorteilsangabe mit dem selbstständigen Pluralpronomen wird ausdrücklich wiedergegeben und nicht zu einem bloßen „für euch“ abgeschwächt.
theological_decisions:
- issue: Verhältnis zur Parallele in Matthäus 11,28–30
  choice: Die eigenständige Formulierung „meine Herrschaft ist sanft“ und „für euch selbst“ bleibt erhalten.
  alternative: Angleichung an die vertraute Matthäus-Formulierung „meine Last ist leicht“ und „Ruhe für eure Seelen“.
  rationale: Der koptische Thomastext spricht tatsächlich von „Herrschaft“ und enthält kein Wort für „Seelen“. Eine Harmonisierung würde die textliche und theologische Eigenart des Spruchs verdecken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Pluralanrede wird durch „Kommt“ und „ihr“ sichtbar. Die bewusst ungewöhnliche Verbindung „Herrschaft ist sanft“ bleibt erhalten, weil sie den Quelltext genauer wiedergibt als eine idiomatische Angleichung an die bekannte Matthäusfassung.
