base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/049.yaml
  text: Jesus said[a], "Blessed are the solitary and chosen, for you will find the kingdom. For you are from it[b][c], and you will go there again."
translation:
  language: de
  text: 'Jesus sagte: »Selig sind die, die allein[a] und erwählt sind; denn ihr werdet das Reich finden.[b] Denn ihr seid aus ihm[c], und dorthin werdet ihr wieder gehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das aus dem Griechischen stammende Lehnwort ⲙⲟⲛⲁⲭⲟⲥ (monachos) kann »allein«, »einzeln« oder »ungeteilt« bezeichnen. Hier ist nicht zwingend ein Mönch im späteren institutionellen Sinn gemeint.
    reason: lexical_alternative
  - marker: b
    text: Nach dem Verb »finden« steht im Manuskript die Präposition ⲁ statt des im Standardsahidischen üblichen ⲉ; dies ist eine regionale Sprachform, die in diesem Kodex häufiger vorkommt.
    reason: dialect_note
  - marker: c
    text: 'Wörtlich: »Ihr seid welche aus ihm.«'
    reason: register_note
lexical_decisions:
- source_word: ⲙⲟⲛⲁⲭⲟⲥ
  choice: die, die für sich allein sind
  rationale: Das griechische Lehnwort μοναχός bezeichnet hier Menschen, die allein beziehungsweise ungeteilt sind. Die Umschreibung vermeidet das anachronistisch-institutionelle »Mönche« und die moderne Nebenbedeutung von »Alleinstehende«.
- source_word: ⲥⲱⲧⲡ
  choice: erwählt
  rationale: 'Die qualitative beziehungsweise stative Form ist passiv zu verstehen: Sie bezeichnet Menschen, die erwählt sind, nicht Menschen, die selbst gewählt haben.'
- source_word: ϩⲉ
  choice: finden
  rationale: Dies ist in der vorliegenden Konstruktion die gewöhnliche Bedeutung des Verbs; die abweichende Präposition im Manuskript ändert sie nicht.
- source_word: ⲙⲛⲧⲉⲣⲟ
  choice: Reich
  rationale: »Reich« ist die natürliche und traditionsfähige deutsche Wiedergabe, ohne festzulegen, ob Herrschaftsbereich, Königsherrschaft oder eine andere Dimension im Vordergrund steht.
theological_decisions:
- issue: Bedeutung von ⲙⲟⲛⲁⲭⲟⲥ
  choice: die, die für sich allein sind
  alternative: Mönche; Einzelne; Ungeteilte
  rationale: Die Formulierung bewahrt die Spannung zwischen äußerem Alleinsein und innerer Ungeteiltheit, ohne das Wort auf späteres institutionelles Mönchtum oder auf eine bestimmte geistliche Deutung festzulegen.
- issue: Numerus und Aussage von ⲉⲧⲥⲟⲧⲡ
  choice: 'Plural und passiv: »erwählt sind«'
  alternative: Singular; »die gewählt haben«
  rationale: Der Manuskripttext hat eine Pluralkonstruktion, und die Form ⲉⲧⲥⲟⲧⲡ ist stativ beziehungsweise passiv. Daher werden dieselben pluralischen Adressaten als allein und erwählt bezeichnet.
- issue: Herkunft aus dem Reich und Rückkehr dorthin
  choice: 'Die ungewöhnliche Aussage wird wörtlich bewahrt: »ihr seid aus ihm ... dorthin ... wieder gehen«'
  alternative: Eine Deutung als ausschließlich gegenwärtiges inneres Reich oder ausschließlich zukünftiger endzeitlicher Ort
  rationale: Der Quelltext verbindet Finden, Herkunft und Rückkehr, erklärt aber nicht deren Verhältnis. Die Übersetzung löst diese theologische Spannung nicht auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die umschreibende Wiedergabe von ⲙⲟⲛⲁⲭⲟⲥ bleibt verständlich und vermeidet sowohl die missverständliche moderne Bezeichnung »Alleinstehende« als auch das anachronistische »Mönche«. Der markante Herkunfts- und Rückkehrgedanke bleibt bewusst knapp und fremdartig.
