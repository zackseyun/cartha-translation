base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/017.yaml
  text: Jesus said[a], “I will give you what eye has not seen, and what ear has not heard[e][d][c][b], and what hand has not touched—and it has not arisen upon the human heart.”
translation:
  language: de
  text: 'Jesus sagte: „Ich werde euch[a] geben, was kein Auge gesehen, kein Ohr gehört und keine Hand berührt hat[b] – und was nicht auf das Herz des Menschen heraufgekommen ist.[c]“[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Euch“ steht im Koptischen im Plural.
    reason: grammar_note
  - marker: b
    text: Das mit „berührt“ wiedergegebene Verb kann auch „angefasst“ oder „mit der Hand ergriffen“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: Wörtlich steht hier die ungewöhnliche räumliche Wendung „auf das Herz“ (ϩⲓ ⲡϩⲏⲧ), nicht das im Deutschen geläufigere „in das Herz“; das Verb bezeichnet zudem ein Heraufkommen.
    reason: lexical_alternative
  - marker: d
    text: Vgl. Jesaja 64,3 und 1. Korinther 2,9 zu der verwandten Folge „kein Auge …, kein Ohr …“. Der Wortlaut hier ist jedoch unmittelbar aus dem Koptischen übersetzt.
    reason: cross_reference
lexical_decisions:
- source_word: 'ϯⲛⲁϯ (normalisiert: ⲁⲛⲟⲕⲛⲁϯ)'
  choice: Ich werde geben
  rationale: Die Handschrift bietet ϯⲛⲁϯ, die gewöhnliche erste Person Singular des Futurs. Daher wird kein zusätzliches emphatisches „ich selbst“ eingeführt.
- source_word: 'ⲛⲏⲧⲛ̄ (normalisiert: ⲛⲁⲛⲧⲱⲧⲛ)'
  choice: euch
  rationale: Das indirekte Objekt steht in der zweiten Person Plural; „euch“ gibt Numerus und Funktion im Deutschen eindeutig wieder.
- source_word: ⲙ̄ⲡⲉⲃⲁⲗ ⲛⲁⲩ
  choice: was kein Auge gesehen hat
  rationale: Die negative Perfektform mit dem generisch gebrauchten Singular wird im Deutschen natürlich mit „kein Auge“ wiedergegeben.
- source_word: ⲙ̄ⲡⲉⲙⲁⲁϫⲉ ⲥⲟⲧⲙⲉϥ
  choice: was kein Ohr gehört hat
  rationale: Die Formulierung wahrt die parallele Abfolge von Auge, Ohr und Hand.
- source_word: ⲙⲡⲉϭⲓϫ ϭⲙ̄ϭⲱⲙϥ̅
  choice: was keine Hand berührt hat
  rationale: ϭⲙϭⲱⲙ kann hier taktiles Berühren oder Anfassen bezeichnen. „berührt“ ist knapp und passt zur Wahrnehmungsreihe.
- source_word: ⲙ̄ⲡⲉϥⲉⲓ ⲉϩⲣⲁⲓ̈
  choice: was nicht … gekommen ist
  rationale: Die Bewegungsvorstellung von ⲉϩⲣⲁⲓ („hinauf/herauf“) bleibt zusammen mit der folgenden Präposition in der ungewöhnlichen Wendung „auf das Herz gekommen“ erkennbar, ohne das Deutsche unnötig zu überladen.
- source_word: ϩⲓⲫⲏⲧ
  choice: auf das Herz
  rationale: ϩⲓ bezeichnet hier wörtlich eine Beziehung „auf/an“. Die Übersetzung glättet daher nicht zum geläufigeren „in das Herz“.
- source_word: 'ⲣ̄ⲣⲱⲙⲉ (normalisiert: ⲡⲣⲱⲙⲉ)'
  choice: des Menschen
  rationale: Der Ausdruck bezeichnet den Menschen generisch. „des Menschen“ ist im Deutschen würdevoll, geschlechtsübergreifend gemeint und wahrt den bestimmten Artikel der normalisierten Lesart.
theological_decisions:
- issue: Verhältnis zu Jesaja 64,3 und 1. Korinther 2,9
  choice: Der koptische Wortlaut wird eigenständig übersetzt; die Parallelen werden nur in einer Fußnote genannt.
  alternative: Den Wortlaut an eine geläufige deutsche Bibelübersetzung von 1. Korinther 2,9 angleichen.
  rationale: Thomas enthält eine verwandte Motivfolge, aber einen eigenständigen Wortlaut, insbesondere die Hand und die Wendung „auf das Herz“. Eine Harmonisierung würde diese Unterschiede verdecken.
- issue: Bedeutung der Herz-Wendung
  choice: Die ungewöhnliche räumliche Formulierung bleibt stehen.
  alternative: Sinndeutend mit „was keinem Menschen in den Sinn gekommen ist“ übersetzen.
  rationale: Eine Wiedergabe mit „in den Sinn gekommen“ würde das Herz ausdrücklich als Denken oder Vorstellen deuten und damit die bildhafte und theologische Offenheit des Textes einschränken.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Spruchcharakter. Die dreigliedrige Parallelstruktur bleibt klar hörbar. Die ungewöhnliche Herz-Wendung wird bewusst nicht idiomatisch oder theologisch ausgedeutet.
