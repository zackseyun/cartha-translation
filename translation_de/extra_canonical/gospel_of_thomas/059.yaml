base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/059.yaml
  text: Jesus said[a], “Seek after the Living One while you are living[g][f][e][d][c][b], so that you do not die and then seek to see him—and you will not be able to see.”
translation:
  language: de
  text: 'Jesus sagte: „Sucht nach dem Lebenden[a], solange ihr lebt, damit ihr nicht sterbt[b] und dann nach ihm sucht, um ihn zu sehen[c] – und ihr werdet ihn nicht sehen können.[d]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dem, der lebt“. Die Wendung kann auch „dem Lebendigen“ oder „dem, der lebendig ist“ wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „damit ihr nicht etwa sterbt“ oder knapper: „ehe ihr sterbt“. Der koptische Wortlaut formuliert einen negativen Zweck.'
    reason: lexical_alternative
  - marker: c
    text: Das hier verwendete Verb bedeutet gewöhnlich „suchen“. „Nach ihm sucht, um ihn zu sehen“ gibt die Suche nach dem Lebenden und den anschließenden Infinitiv „sehen“ idiomatisch wieder. Die Wiederholung von „suchen“ erhält zugleich ein wiederkehrendes Suchmotiv des Thomasevangeliums.
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich sinngemäß: „und ihr werdet nicht imstande sein zu sehen“. Das Objekt „ihn“ ist im letzten Satzteil nur mitgedacht.'
    reason: translation_clarity
lexical_decisions:
- source_word: ϭⲱϣⲧ ⲛⲥⲁ
  choice: sucht nach
  rationale: Die Verbindung bezeichnet ein Suchen beziehungsweise Nachforschen. „Sucht nach“ ist im Deutschen natürlich und bewahrt den Gedanken zielgerichteter Suche.
- source_word: ⲡⲉⲧⲉⲣⲉⲱⲛϩ
  choice: dem Lebenden
  rationale: Die relative Wendung bedeutet wörtlich „dem, der lebt“. Die substantivierte Form wahrt ihre mögliche titelartige Bedeutung, ohne die bezeichnete Person ausdrücklich zu identifizieren.
- source_word: ϩⲱⲥ ⲉⲣⲉⲛⲧⲱⲧⲛⲱⲛϩ
  choice: solange ihr lebt
  rationale: Die Umstandskonstruktion hat hier natürlichen temporalen Sinn. „Solange“ gibt zugleich die begrenzte Gelegenheit wieder, die der Spruch voraussetzt.
- source_word: ϩⲓⲛⲁ ϫⲉ ⲛⲛⲉⲛⲧⲱⲧⲛⲙⲟⲩ
  choice: damit ihr nicht sterbt
  rationale: Die negative Zweckkonstruktion wird in gegenwärtigem Deutsch direkt wiedergegeben; das altertümlichere „auf dass ihr nicht sterbt“ wird vermieden.
- source_word: ϣⲓⲛⲉ ⲉⲛⲁⲩ
  choice: danach sucht, ihn zu sehen
  rationale: ϣⲓⲛⲉ bezeichnet „suchen“ und ist im Thomasevangelium ein wiederkehrendes Schlüsselwort. Die Formulierung erhält dieses Motiv und gibt den anschließenden Infinitiv „sehen“ wieder.
- source_word: ϣϭⲙϭⲟⲙ ⲁⲛ ⲉⲛⲁⲩ
  choice: ihr werdet ihn nicht sehen können
  rationale: Die Wendung bedeutet idiomatisch „nicht imstande sein zu sehen“. Das Deutsche ergänzt das aus dem vorherigen Satzglied erschließbare Objekt zur Klarheit.
theological_decisions:
- issue: Identität des „Lebenden“
  choice: Die Bezeichnung bleibt ohne ausdrückliche Identifizierung stehen.
  alternative: „der lebendige Gott“ oder „Jesus, der Lebende“
  rationale: Der koptische Text nennt weder Gott noch Jesus ausdrücklich als Bezugsgröße. Eine nähere Identifizierung würde die genuine Offenheit des Spruchs einschränken.
- issue: Art des Todes
  choice: „sterbt“ bleibt ohne Deutung.
  alternative: „geistlich sterbt“ oder „den leiblichen Tod erleidet“
  rationale: Der Text bestimmt nicht, ob Tod körperlich, geistlich oder umfassend gemeint ist; die Übersetzung wahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Spruchform. Die Wiederholung von „suchen“ ist bewusst beibehalten, weil sie den koptischen Wortschatz und das Suchmotiv trägt. Der Gedankenstrich markiert die zugespitzte Schlussfolgerung, ohne eine zusätzliche theologische Erklärung einzuführen.
