base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/056.yaml
  text: 'Jesus said: Whoever has come to know the world has found a corpse[a]; and whoever has found the corpse[c][b], the world is not worthy of him.'
translation:
  language: de
  text: 'Jesus sagte: „Wer die Welt erkannt hat, hat einen Leichnam gefunden[a]; und wer den Leichnam gefunden hat, dessen ist die Welt nicht würdig.[b][c]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im ersten Satzteil steht „ein Leichnam“, im zweiten „der Leichnam“. Der bestimmte Ausdruck verweist wahrscheinlich auf denselben zuvor gefundenen Leichnam zurück.
    reason: article_distinction
  - marker: b
    text: 'Wörtlicher, aber im heutigen Deutsch ungebräuchlicher: „Die Welt ist seiner nicht würdig.“'
    reason: translation_alternative
  - marker: c
    text: 'Vgl. Hebräer 11,38: „Die Welt war ihrer nicht würdig.“ Dies ist keine synoptische Parallele, sondern lediglich eine sprachlich und thematisch verwandte Aussage.'
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jesus sagte
  rationale: Die koptische Redeformel ⲡⲉϫⲉ mit Subjekt führt einen Ausspruch erzählend ein; das deutsche Präteritum entspricht dieser Funktion natürlich.
- source_word: ⲥⲟⲟⲩⲛ
  choice: erkannt hat
  rationale: „Erkennen“ gibt hier nicht nur ein statisches Wissen, sondern das Erlangen einer Erkenntnis wieder; das Perfekt bewahrt den resultativen beziehungsweise vollendeten Sinn der Konstruktion.
- source_word: ⲡⲕⲟⲥⲙⲟⲥ
  choice: die Welt
  rationale: Das griechische Lehnwort kosmos bezeichnet im Thomasevangelium gewöhnlich die Welt; „Kosmos“ klänge im heutigen Deutsch unnötig fachsprachlich.
- source_word: ϩⲉ
  choice: gefunden hat
  rationale: Das schlichte Verb „finden“ entspricht der knappen Aussage des koptischen Textes besser als stärker deutende Möglichkeiten wie „entdecken“.
- source_word: ⲟⲩⲡⲧⲱⲙⲁ / ⲡⲧⲱⲙⲁ
  choice: einen Leichnam / den Leichnam
  rationale: ⲡⲧⲱⲙⲁ bezeichnet einen Leichnam. Der Wechsel vom unbestimmten zum bestimmten Artikel wird bewahrt, sodass der zweite Ausdruck auf den zuvor gefundenen Leichnam zurückverweist.
- source_word: ⲙⲡϣⲁ ⲛⲛⲧⲟϥ ⲁⲛ
  choice: dessen ist die Welt nicht würdig
  rationale: Die Formulierung hält die Bedeutung „seiner nicht würdig“ fest. „Dessen“ ist im Deutschen klarer als das heute ungebräuchlich wirkende „seiner“, ohne die Aussage zu einer Erklärung umzudeuten.
- source_word: ⲁⲩⲱ
  choice: und
  rationale: Die einfache Verbindung gibt den knappen koptischen Anschluss ohne zusätzliche Gewichtung wieder.
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥ …
  choice: wer …
  rationale: Die indefinite Relativkonstruktion wird im Deutschen natürlich und allgemein mit „wer“ wiedergegeben.
theological_decisions:
- issue: Bedeutung des Leichnams als Bild für die Welt
  choice: Das Bild bleibt ohne auslegende Ergänzung stehen.
  alternative: Den Leichnam ausdrücklich als geistlich tote oder vergängliche Welt erklären.
  rationale: Der koptische Text setzt Welt und Leichnam in eine zugespitzte Beziehung, erläutert aber weder die genaue Art des Vergleichs noch seine dogmatische Bedeutung. Eine Erklärung im Haupttext würde die vorhandene Deutungsoffenheit einschränken.
- issue: Aussage, die Welt sei des Findenden nicht würdig
  choice: Die Wertung wird eng am Wortlaut als „dessen ist die Welt nicht würdig“ wiedergegeben.
  alternative: „Der steht über der Welt“ oder „der hat die Welt überwunden“.
  rationale: Solche Alternativen würden eine konkrete theologische Folgerung aussprechen, die der Text selbst nicht formuliert.
translation_notes:
  register: Moderne, würdige Standardsprache mit der knappen und schroffen Bildlichkeit des koptischen Spruchs. Die leicht gehobene Genitivkonstruktion „dessen ist … nicht würdig“ erhält das persönliche Bezugswort und vermeidet zugleich eine auslegende Paraphrase.
