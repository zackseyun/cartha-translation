base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/062.yaml
  text: Jesus said[1], "I tell my mysteries to those [who are worthy] of [my] mysteries. What your right hand will do[4][3][2], do not let your left hand know what it is doing."
translation:
  language: de
  text: 'Jesus sagte: „Ich sage denen meine Geheimnisse, die meiner Geheimnisse würdig sind.[a] Was deine rechte Hand tun wird, lass deine linke Hand nicht wissen, was sie tut.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Handschrift ist an dieser Stelle beschädigt. „die … würdig sind“ und das zweite „meiner“ beruhen auf allgemein anerkannten Ergänzungen aus dem erhaltenen Zusammenhang.
    reason: textual_variant
  - marker: b
    text: Vgl. Matthäus 6,3. Dort steht das Wort im Zusammenhang mit dem Almosengeben; im Thomasevangelium fehlt diese ausdrückliche Einordnung, und der Ausspruch folgt unmittelbar auf die Aussage über die Geheimnisse.
    reason: cross_reference
lexical_decisions:
- source_word: ⲙⲩⲥⲧⲏⲣⲓⲟⲛ
  choice: Geheimnisse
  rationale: Das griechische Lehnwort μυστήριον steht mit pluralischen Possessivartikeln. „Geheimnisse“ bewahrt sowohl den Plural als auch den religiösen Bedeutungsraum, ohne eine bestimmte Geheimlehre vorauszusetzen.
- source_word: ⲙⲡϣⲁ
  choice: würdig sind
  rationale: Die ergänzte Form bezeichnet das Würdig- oder Geeignetsein. „würdig sind“ gibt die knappe Wertung des koptischen Ausdrucks unmittelbar wieder.
- source_word: ⲟⲩⲛⲁⲙ
  choice: rechte Hand
  rationale: Das Wort bezeichnet die rechte Seite beziehungsweise die rechte Hand; im Gegensatz zur folgenden linken Hand ist die konkrete Körperbezeichnung eindeutig.
- source_word: ϩⲃⲟⲩⲣ
  choice: linke Hand
  rationale: Das Wort bezeichnet die linke Seite beziehungsweise die linke Hand und bildet das ausdrückliche Gegenstück zu ⲟⲩⲛⲁⲙ.
- source_word: ⲉⲓⲣⲉ
  choice: tun / tut
  rationale: Die Wiedergabe erhält den Wechsel vom Futur bei der rechten Hand zum Präsens in der abschließenden Fragekonstruktion.
theological_decisions:
- issue: Bezug des Spruchs von der rechten und linken Hand
  choice: Als unmittelbar auf die Aussage über die Geheimnisse folgender, aber nicht ausdrücklich erklärter Ausspruch wiedergegeben.
  alternative: Den Ausspruch wie in Matthäus 6,3 ausdrücklich auf Almosen oder aufgrund seiner Stellung ausdrücklich auf Geheimhaltung beziehen.
  rationale: Der Thomasspruch nennt weder Almosen noch eine ausdrückliche Deutung. Die Übersetzung bewahrt daher die offene Beziehung zwischen beiden Sätzen und fügt keinen kanonischen oder esoterischen Deutungsrahmen ein.
- issue: Charakter der „Geheimnisse“
  choice: Die allgemeine und spannungsreiche Bezeichnung „Geheimnisse“ bleibt unbestimmt.
  alternative: „Lehren“, „Offenbarungen“ oder „Geheimlehren“.
  rationale: Solche Alternativen würden den Inhalt oder die Funktion der Geheimnisse stärker festlegen, als es der koptische Wortlaut erlaubt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas markante Wiederholung „meine Geheimnisse … meiner Geheimnisse“ folgt bewusst dem koptischen Wortlaut. Der Tempuswechsel „tun wird … tut“ bleibt erhalten, damit die formale Spannung des Ausgangstextes nicht geglättet wird.
