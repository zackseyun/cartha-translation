base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/084.yaml
  text: Jesus said[a], "On the day you see your likeness, you rejoice. But whenever you see your images that came into being before you, which neither die nor become manifest—how much will you bear!"
translation:
  language: de
  text: 'Jesus sagte: „An dem Tag, an dem ihr euer Ebenbild seht, freut ihr euch. Wenn ihr aber eure Bilder[a] seht, die vor euch entstanden sind[b] und weder sterben noch offenbar werden[c] – wie viel werdet ihr ertragen!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Koptischen steht hier ϩⲓⲕⲱⲛ, ein Lehnwort aus dem Griechischen εἰκών („Bild“, „Abbild“). Zuvor verwendet der Text mit ⲉⲓⲛⲉ ein anderes Wort für „Ebenbild“ oder „Ähnlichkeit“.
    reason: Die Fußnote macht den für die Aussage bedeutsamen Wortwechsel sichtbar, ohne ihn theologisch auszudeuten.
  - marker: b
    text: Die Handschrift verwendet in der Verbform eine regionale Laut- beziehungsweise Schreibvariante für das Pronomen der dritten Person Plural.
    reason: Die Fußnote dokumentiert die dialektale Form, die der normalisierten Lesung „sie entstanden“ zugrunde liegt.
  - marker: c
    text: Auch die beiden verneinten Verbformen zeigen eine regionale Variante des koptischen Präfixes für eine allgemeine beziehungsweise gewohnheitsmäßige Verneinung.
    reason: Die Fußnote erklärt die auffälligen Handschriftenformen und stützt die Wiedergabe „weder sterben noch offenbar werden“.
lexical_decisions:
- source_word: ⲉⲓⲛⲉ
  choice: Ebenbild
  rationale: Bezeichnet hier die wahrnehmbare Ähnlichkeit oder Gestalt. „Ebenbild“ bewahrt die Unterscheidung zum folgenden griechischen Lehnwort ϩⲓⲕⲱⲛ, ohne dessen genaue Beziehung dazu festzulegen.
- source_word: ϩⲓⲕⲱⲛ
  choice: Bilder
  rationale: Das griechische Lehnwort εἰκών wird im Plural wiedergegeben. „Bilder“ ist formal nah und lässt offen, welcher Art diese vor den Angeredeten entstandenen Bilder sind.
- source_word: ϣⲱⲡⲉ
  choice: entstanden sind
  rationale: Im Relativsatz bezeichnet das Verb das Ins-Dasein-Kommen; „entstanden sind“ gibt dies natürlich wieder, ohne ausdrücklich einen Schöpfer vorauszusetzen.
- source_word: ϩⲓⲡⲉⲧⲛⲉϩⲏ
  choice: vor euch
  rationale: Die Wendung kann Vorrang in Zeit oder Stellung ausdrücken. Im Zusammenhang mit dem Entstehen ist die zeitliche Lesart naheliegend, während die knappe Formulierung die Bildsprache offenhält.
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: offenbar werden
  rationale: Die Wendung bedeutet sichtbar, enthüllt oder offenbar werden. „Offenbar werden“ wahrt den Kontrast zum Sterben, ohne bloßes körperliches Erscheinen festzulegen.
- source_word: ϥⲓ ϩⲁ
  choice: ertragen
  rationale: Das Idiom bezeichnet das Tragen beziehungsweise Aushalten einer Last. „Ertragen“ ist im Deutschen idiomatisch und erhält die zugespitzte Schlussfrage.
theological_decisions:
- issue: Verhältnis von ⲉⲓⲛⲉ und ϩⲓⲕⲱⲛ
  choice: Ebenbild / Bilder
  alternative: Aussehen / Gestalten
  rationale: Die zwei verschiedenen Ausgangswörter werden auch im Deutschen unterschieden. Die Übersetzung erklärt die „Bilder“ nicht ausdrücklich als göttliche, ewige oder himmlische Gegenstücke, da der Text selbst dies nicht eindeutig ausführt.
- issue: Deutung der Bilder, die weder sterben noch offenbar werden
  choice: Die paradoxe Aussage bleibt unaufgelöst stehen.
  alternative: Erläuternde Wiedergabe als unsterbliche, verborgene Urbilder
  rationale: Eine solche Erläuterung würde eine bestimmte metaphysische Auslegung in den Haupttext eintragen. Die Übersetzung bewahrt stattdessen die Spannung des Wortlauts.
- issue: Zeitwert von ϣⲁⲣⲉ- und ⲧⲉⲧⲛⲁ-
  choice: „freut ihr euch“ als allgemeine Aussage; „werdet ihr ertragen“ als Zukunft
  alternative: Beide Aussagen futurisch wiedergeben
  rationale: Die erste Verbform ist habitual beziehungsweise generalisierend, die Schlussform dagegen ausdrücklich futurisch.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, mündlich wirkender Satzstruktur. Die Anrede steht entsprechend dem koptischen Plural durchgehend im vertrauten „ihr“. Der Gedankenstrich vor der Schlussfrage bildet die rhetorische Zuspitzung ab; das Ausrufezeichen erhält den emphatischen Ton der Aussage.
