base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/107.yaml
  text: Jesus said[a], The kingship is like a shepherd who had a hundred sheep. One of them—the great one—went astray. He left the ninety‑nine and searched for the one until he found it. After he had toiled, he said to the sheep[i][h][g][f][e][d][c][b], I love you more than the ninety‑nine.
translation:
  language: de
  text: 'Jesus sagte: „Die Königsherrschaft[a] gleicht einem Hirten, der hundert Schafe hatte. Eines von ihnen – das große Schaf[b] – verirrte sich. Er ließ die neunundneunzig[c] zurück und suchte nach dem einen, bis er es fand. Nachdem er sich abgemüht hatte[d], sagte er zu dem Schaf[e]: ‚Dich liebe ich[f] mehr als die neunundneunzig.‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das koptische ⲡⲙⲛⲧⲣⲣⲟ bezeichnet Königsherrschaft oder königliches Walten; traditionell wird es oft mit „Königreich“ wiedergegeben.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „das große“. Der Ausdruck lässt offen, ob körperliche Größe, Bedeutung oder eine andere Art von Größe gemeint ist.
    reason: lexical_alternative
  - marker: c
    text: Die ungewöhnliche Schreibung ⲡⲥⲧⲉⲯⲓⲧ im Manuskript wird als „die neunundneunzig“ verstanden und ist vermutlich von griechischen Zahlformen beeinflusst.
    reason: dialect_note
  - marker: d
    text: Das koptische ϩⲓⲥⲉ bezeichnet Mühe oder Anstrengung und kann auch die daraus folgende Erschöpfung einschließen.
    reason: lexical_alternative
  - marker: e
    text: Bei dem Wort „Schaf“ ist im Manuskript ein Buchstabe geringfügig wiederhergestellt (NHAM02.50, Zeile 27).
    reason: lacuna_or_restoration
  - marker: f
    text: 'Das koptische ⲟⲩⲟϣⲕ kann hier „lieben“ oder „vorziehen“ bedeuten. Daher ist auch möglich: „Dich ziehe ich den neunundneunzig vor.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: Königsherrschaft
  rationale: Das Abstraktum mit ⲙⲛⲧ- bezeichnet königliche Herrschaft bzw. das Königtum; „Königsherrschaft“ bewahrt diesen dynamischen und nicht notwendig räumlichen Sinn.
- source_word: ⲟⲩⲣⲱⲙⲉ ⲛϣⲱⲥ
  choice: ein Hirte
  rationale: Die Verbindung bezeichnet einen Hirten, wörtlich einen Menschen des Hütens bzw. Weidens; der Besitz der Schafe wird anschließend durch ⲟⲩⲛⲧⲁ= ausgedrückt.
- source_word: ⲛϣⲉ ⲛⲉⲥⲟⲟⲩ
  choice: hundert Schafe
  rationale: Im erzählerischen Weidekontext ist „Schafe“ die natürliche deutsche Wiedergabe.
- source_word: ⲥⲱⲣⲙ
  choice: verirrte sich
  rationale: Das Verb bedeutet irren, sich verirren oder vom Weg abkommen; die reflexive Form passt natürlich zum Hirtenbild.
- source_word: ⲡⲛⲟϭ
  choice: das große
  rationale: Die substantivierte Bezeichnung heißt wörtlich „das große“ und lässt offen, ob Größe, Rang oder besondere Bedeutung gemeint ist.
- source_word: ϣⲓⲛⲉ ⲛⲥⲁⲡⲓⲟⲩⲁ
  choice: suchte nach dem einen
  rationale: Die Konstruktion bezeichnet die gezielte Suche nach diesem einen Schaf.
- source_word: ϩⲓⲥⲉ
  choice: sich abgemüht hatte
  rationale: Das Wort umfasst Mühe, Anstrengung und Ermüdung; die Formulierung gibt die vorausgehende Anstrengung idiomatisch wieder.
- source_word: ⲟⲩⲟϣⲕ
  choice: liebe ich
  rationale: Das Verb kann hier „lieben“ oder „vorziehen“ bedeuten; „lieben“ ergibt natürliches Deutsch, während die Alternative in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Herrschaftsbegriff ⲡⲙⲛⲧⲣⲣⲟ
  choice: Königsherrschaft
  alternative: Königreich; Herrschaft
  rationale: Die Wiedergabe vermeidet eine vorschnelle Festlegung auf ein Gebiet und erhält den abstrakten Sinn von königlichem Walten.
- issue: Besondere Stellung des verirrten Schafes
  choice: das große
  alternative: das größte; das bedeutende
  rationale: Der Text nennt es ausdrücklich ⲡⲛⲟϭ, bestimmt aber nicht eindeutig, ob körperliche Größe oder besondere Bedeutung gemeint ist.
- issue: Aussage des Hirten über das gefundene Schaf
  choice: Dich liebe ich mehr
  alternative: Dich ziehe ich den neunundneunzig vor
  rationale: Beide Bedeutungsrichtungen sind lexikalisch möglich; die Hauptfassung bewahrt die persönliche Anrede und die vergleichende Zuneigung, ohne die alternative Nuance zu verschweigen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gleichniston. Die Satzfolge bleibt eng am koptischen Erzählgang; „Hirte“ gibt die feste koptische Verbindung korrekt wieder. Ungewöhnliche oder theologisch deutbare Einzelheiten werden nicht geglättet, sondern im Text beziehungsweise in den Fußnoten offengehalten.
