base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/077.yaml
  text: Jesus said, "I am the light that is over them all. I am the All. It is from me that the All came forth, and to me that the All reached. Split a piece of wood; I am there. Lift up the stone, and you will find me there."
translation:
  language: de
  text: 'Jesus sagte: »Ich bin das Licht, das über ihnen allen ist. Ich bin das All. Aus mir ist das All hervorgegangen, und zu mir ist das All gelangt.[a] Spaltet ein Stück Holz: Ich bin dort. Hebt den Stein hoch, und ihr werdet mich dort finden.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Koptischen steht dasselbe Verb ⲡⲱϩ zunächst im Sinn von »gelangen/erreichen« und unmittelbar danach im Sinn von »spalten«. Dieses Wortspiel lässt sich im Deutschen nicht vollständig nachbilden.
    reason: Wortspiel und lexikalische Mehrdeutigkeit des Ausgangstextes
  - marker: b
    text: Im griechischen Fragment P.Oxy. 1 stehen die Aufforderungen, den Stein hochzuheben und das Holz zu spalten, in umgekehrter Reihenfolge und am Ende des dortigen Spruchs 30.
    reason: Textvariante eines antiken Parallelzeugen
lexical_decisions:
- source_word: ⲡⲟⲩⲟⲉⲓⲛ
  choice: das Licht
  rationale: Die geläufige und würdevolle Entsprechung für das koptische Substantiv; der bestimmte Artikel bleibt erhalten.
- source_word: ⲡⲧⲏⲣϥ
  choice: das All
  rationale: Gibt das substantivisch gebrauchte Absolute wieder und bewahrt gegenüber »alles« den markanten Charakter der Aussage.
- source_word: ⲉⲓ ⲉⲃⲟⲗ ⲛϩⲏⲧ
  choice: aus mir hervorgegangen
  rationale: Gibt Herkunft und Hervortreten wieder; die Voranstellung von »Aus mir« spiegelt die Hervorhebung durch den koptischen zweiten Perfekt.
- source_word: ⲡⲱϩ ϣⲁⲁⲛⲟⲕ
  choice: zu mir gelangt
  rationale: Bewahrt die Zielrichtung von ϣⲁ- und übersetzt die erste Bedeutung von ⲡⲱϩ als gelangen bzw. erreichen.
- source_word: ⲡⲱϩ ⲛⲟⲩϣⲉ
  choice: Spaltet ein Stück Holz
  rationale: Die zweite Verwendung von ⲡⲱϩ bedeutet spalten; ϣⲉ kann Holz oder ein Holzstück bezeichnen. »Ein Stück Holz« klingt im Deutschen natürlich und konkret.
- source_word: ϥⲓ ⲛⲡⲱⲛⲉ ⲉϩⲣⲁⲓ
  choice: Hebt den Stein hoch
  rationale: ϥⲓ zusammen mit dem Richtungsadverb ⲉϩⲣⲁⲓ bezeichnet das Hochheben.
- source_word: ϩⲉ ⲉ-
  choice: finden
  rationale: Die Konstruktion bedeutet hier finden bzw. antreffen, nicht sehen.
theological_decisions:
- issue: Deutung von ⲡⲧⲏⲣϥ
  choice: das All
  alternative: alles / die Gesamtheit
  rationale: »Das All« wahrt die substantivische und kosmische Weite des Ausdrucks, ohne im Übersetzungstext eine bestimmte metaphysische oder konfessionelle Deutung festzuschreiben.
- issue: Identifikation Jesu mit Licht und All
  choice: Die direkten Identitätsaussagen bleiben unverändert stehen.
  alternative: Deutende Zusätze wie »Licht der Welt« oder eine Erklärung der Gegenwart Jesu in der Materie
  rationale: Der koptische Text formuliert zugespitzt und lässt das genaue Verhältnis von Jesus, dem All und den genannten Gegenständen offen; diese Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit feierlicher, knapper Spruchform. »Das All« ist bewusst markiert, aber nicht fachsprachlich erläutert. Der Doppelpunkt nach den Imperativen erhält den pointierten Parallelismus; die Pluralanrede des Koptischen wird mit »ihr« wiedergegeben.
