base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/112.yaml
  text: Jesus said[a], “Woe to the flesh that depends on the soul[c][b]; woe to the soul that depends on the flesh.”
translation:
  language: de
  text: 'Jesus sagte: »Wehe dem Fleisch, das von der Seele abhängt,[a][b] wehe der Seele, die vom Fleisch abhängt!«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das koptische Verb kann auch konkreter mit »an der Seele hängt« oder »sich auf die Seele stützt« wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: Das Wort ⲯⲩⲭⲏ (psychē) kann auch »Leben« oder »Selbst« bedeuten. »Seele« bewahrt hier den scharfen Gegensatz zu »Fleisch«.
    reason: lexical_alternative
  - marker: c
    text: Die Handschrift hat in beiden Satzhälften die feminine Form ⲧⲁⲉⲓ; die normalisierte Ausgabe liest ⲡⲁⲓ. Das Demonstrativ dient hier zur Einleitung des Relativsatzes, sodass die Abweichung den Sinn nicht verändert.
    reason: dialect_note
lexical_decisions:
- source_word: ⲟⲩⲟⲉⲓ / ⲟⲩⲟⲓ
  choice: Wehe
  rationale: Bewahrt den warnenden, unheilverkündenden Ton des aus dem Griechischen οὐαί entlehnten Ausrufs und entspricht dem etablierten biblischen Sprachgebrauch.
- source_word: ⲥⲁⲣⲝ
  choice: Fleisch
  rationale: Gibt das griechische Lehnwort prägnant wieder und erhält den scharfen Gegensatz zu »Seele«; »Körper« würde diesen Gegensatz abschwächen.
- source_word: ⲯⲩⲭⲏ
  choice: Seele
  rationale: Bewahrt hier die bewusste Gegenüberstellung von Fleisch und Seele, ohne mögliche Nebenbedeutungen wie »Leben« oder »Selbst« zur alleinigen Deutung zu machen.
- source_word: ⲉⲧⲉⲣⲉⲉⲓϣⲉ (ⲉⲓϣⲉ)
  choice: abhängt von
  rationale: Drückt die bezeichnete Abhängigkeit in natürlichem modernem Deutsch aus; die konkretere Bildlichkeit von »hängt an« bleibt als Übersetzungsalternative in der Fußnote erhalten.
- source_word: ⲡⲁⲓ / handschriftlich ⲧⲁⲉⲓ
  choice: das/die
  rationale: Das Demonstrativ mit Relativsatz wird im Deutschen idiomatisch durch einen substantivbezogenen Relativsatz wiedergegeben; das Genus richtet sich dabei nach »Fleisch« beziehungsweise »Seele«.
theological_decisions:
- issue: Verhältnis von Fleisch und Seele
  choice: Die wechselseitigen Weherufe bleiben ohne erläuternde Harmonisierung stehen.
  alternative: Den Spruch als eindeutige Abwertung entweder des Fleisches oder der Seele auslegen.
  rationale: Der Text spricht beiden Fällen Unheil zu und erzeugt damit eine theologische Spannung, die nicht durch eine konfessionelle oder anthropologische Deutung aufgelöst werden darf.
translation_notes:
  register: Moderne, verständliche Standardsprache mit würdigem, knappem Spruchton. Die parallele Satzstruktur und die antithetische Gegenüberstellung von »Fleisch« und »Seele« werden bewahrt.
