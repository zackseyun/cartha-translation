base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/054.yaml
  text: Jesus said[a], “Blessed are the poor[f][e][d][c][b], for yours is the kingdom of the heavens.”
translation:
  language: de
  text: 'Jesus sagte: „Selig sind die Armen[a], denn euch gehört das Königreich der Himmel[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Koptischen ein generischer Singular: „der Arme“. Gemeint sind die Armen als Gruppe. Anders als Matthäus 5,3 fügt der Text nicht „im Geist“ hinzu; vgl. Lukas 6,20.'
    reason: textual_and_cross_reference
  - marker: b
    text: 'Wörtlich „das Königreich der Himmel“: „Himmel“ steht im Koptischen im Plural. ⲙⲛⲧⲣⲣⲟ kann auch „Königsherrschaft“ oder „Herrschaft“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jesus sagte
  rationale: Die übliche deutsche Wiedergabe der koptischen Redeeinleitung; das folgende ϫⲉ wird durch die direkte Rede ausgedrückt.
- source_word: ϩⲉⲛⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: Selig sind
  rationale: Die traditionelle und weiterhin verständliche Form der Seligpreisung bewahrt den wertenden, religiösen Ton; „glücklich“ wäre ebenfalls möglich, aber weniger formelhaft.
- source_word: ⲡϩⲏⲕⲉ
  choice: die Armen
  rationale: Das koptische Singularwort bezeichnet hier generisch die Gruppe der Armen; der deutsche Plural gibt diesen kollektiven Sinn natürlich wieder, ohne „im Geist“ aus Matthäus einzutragen.
- source_word: ϫⲉ
  choice: denn
  rationale: Das zweite ϫⲉ leitet die Begründung der Seligpreisung ein; „denn“ bewahrt die knappe kausale Verknüpfung.
- source_word: ⲧⲱⲧⲛ
  choice: euch gehört
  rationale: Das Pronomen steht in der zweiten Person Plural. „Euch gehört“ ist eine natürliche deutsche Entsprechung der Zugehörigkeitsaussage und bewahrt den direkten Wechsel von „die Armen“ zu „euch“.
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: das Königreich
  rationale: „Königreich“ eignet sich im Thomas-Evangelium für die als gegenwärtige oder zugängliche Wirklichkeit dargestellte βασιλεία/ⲙⲛⲧⲣⲣⲟ; „Königsherrschaft“ würde stärker den Vollzug des Herrschens betonen.
- source_word: ⲛⲡⲡⲉ
  choice: der Himmel
  rationale: Die Genitivverbindung ist ausdrücklich pluralisch. „Der Himmel“ erhält im Deutschen den Plural, anders als das geläufigere singularische „des Himmels“.
theological_decisions:
- issue: Art der Armut
  choice: die Armen
  alternative: die im Geist Armen
  rationale: Der koptische Text nennt Armut ohne nähere Bestimmung. Eine geistliche Qualifikation aus Matthäus 5,3 würde eine im Text nicht vorhandene Deutung eintragen.
- issue: Bedeutung von ⲙⲛⲧⲣⲣⲟ
  choice: Königreich
  alternative: Königsherrschaft
  rationale: Beide Bedeutungsaspekte sind lexikalisch möglich. „Königreich“ bewahrt hier die im Thomas-Evangelium häufig erkennbare Vorstellung einer Wirklichkeit, die gefunden oder betreten werden kann, ohne den Herrschaftsaspekt auszuschließen.
- issue: Direkter Adressatenwechsel
  choice: die Armen … euch
  alternative: ihrer ist
  rationale: Die Quelle wechselt ausdrücklich von der generischen Bezeichnung der Armen zur zweiten Person Plural. Diese Spannung wird nicht geglättet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vertraute Seligpreisungsformel „Selig sind“ wird beibehalten. „Euch gehört“ klingt natürlich und erhält den auffälligen Wechsel von der dritten zur zweiten Person. Der weniger geläufige Plural „der Himmel“ folgt bewusst der koptischen Form.
