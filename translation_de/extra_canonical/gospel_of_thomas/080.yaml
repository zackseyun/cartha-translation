  naturalness: Der Text ist knapp, verständlich und in modernem, würdigem Standarddeutsch formuliert. Die Stellung »dessen ist die Welt nicht würdig« ist gehoben, aber idiomatisch und für einen Weisheitsspruch passend.
  terminology: »Welt«, »Leib« und »würdig« sind terminologisch tragfähig. Insbesondere deutet »Leib« weder einen Leichnam noch eine bestimmte theologische Lehre hinein. Die Fußnote erläutert die lexikalische Alternative und die Parallele sachgerecht.
