base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/080.yaml
  text: Jesus said[a], “Whoever has come to know the world has found the body; and whoever has found the body[e][d][c][b], the world is not worthy of him.”
translation:
  language: de
  text: 'Jesus sagte: »Wer die Welt erkannt hat, hat den Leib gefunden; wer aber den Leib gefunden hat, dessen ist die Welt nicht würdig.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das koptische ⲥⲱⲙⲁ bedeutet vor allem »Leib« oder »Körper« und kann je nach Zusammenhang auch einen toten Körper bezeichnen. Hier steht bewusst nicht das in Spruch 56 verwendete Wort für »Leichnam«; deshalb wird die unterschiedliche Wortwahl beibehalten.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jesus sagte
  rationale: Die formelhafte Redeeinleitung steht formal in der Vergangenheit und wird im Deutschen natürlich so wiedergegeben.
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥⲥⲟⲟⲩⲛ
  choice: wer … erkannt hat
  rationale: Die Relativkonstruktion bezeichnet eine abgeschlossene Erkenntnis; „erkannt hat“ bewahrt sowohl den Erkenntnisaspekt als auch die Perfektbedeutung.
- source_word: ⲡⲕⲟⲥⲙⲟⲥ
  choice: die Welt
  rationale: Das griechische Lehnwort bezeichnet die Welt bzw. den Kosmos; „Welt“ ist idiomatisch und lässt den Umfang des Begriffs offen.
- source_word: ϩⲉ ⲉ
  choice: gefunden hat
  rationale: Das Verb bedeutet „finden“; die Präposition vor dem Objekt ist eine dialektale beziehungsweise orthografische Erscheinung und verlangt keine abweichende Übersetzung.
- source_word: ⲡⲥⲱⲙⲁ
  choice: den Leib
  rationale: Das Wort ist das griechische Lehnwort σῶμα und bedeutet hier vorrangig „Leib/Körper“. „Leib“ wahrt den würdevollen Spruchstil und vermeidet eine unbegründete Angleichung an das ausdrücklich andere Wort für „Leichnam“ in Spruch 56.
- source_word: ⲇⲉ
  choice: aber
  rationale: Die Partikel gliedert den zweiten, folgernden Satzteil und kann im Deutschen natürlich mit „aber“ wiedergegeben werden, ohne einen scharfen Gegensatz zu erzwingen.
- source_word: ⲡⲕⲟⲥⲙⲟⲥ ⲙⲡϣⲁ ⲛⲛⲧⲟϥ ⲁⲛ
  choice: dessen ist die Welt nicht würdig
  rationale: Die deutsche Genitivfügung gibt die feste Wendung „würdig sein“ prägnant wieder; das maskuline Pronomen wird durch das geschlechtsneutrale Relativpronomen „dessen“ auf „wer“ bezogen.
theological_decisions:
- issue: Verhältnis von Welt und Leib
  choice: Die paradoxe Aussage bleibt ohne Deutung stehen.
  alternative: Den Leib ausdrücklich als Leichnam oder die Welt als grundsätzlich böse deuten.
  rationale: Der koptische Text erklärt das Verhältnis nicht. Eine solche Auslegung würde die theologische Spannung auflösen und zudem die lexikalische Unterscheidung gegenüber Spruch 56 verwischen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Leib“ klingt in einem Weisheitsspruch natürlicher und gehobener als „Körper“, ohne altertümlich zu sein. Die symmetrische Wiederholung von „Welt“, „Leib“ und „gefunden“ bildet die knappe Struktur des Koptischen nach.
