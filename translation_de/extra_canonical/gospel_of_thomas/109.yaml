review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die wesentlichen Aussagen des sahidisch-koptischen Textes vollständig wieder: das Reich-Gleichnis, der dem ursprünglichen Besitzer verborgene Schatz, Tod und Hinterlassenschaft, die Unkenntnis des Sohnes, dessen Verfügung über das Feld, Kauf und Fund bei der Feldarbeit sowie das anschließende Verleihen gegen Zinsen. „Als er pflügte“ gibt die zirkumstantiale Handlung angemessen wieder und wahrt den zufälligen Charakter des Fundes. „Hinterließ er ihn seinem Sohn“ bewahrt die pronominale Offenheit des koptischen Textes, ohne den Bezug unnötig zu präzisieren.'
  naturalness: Modernes, gut lesbares Standarddeutsch mit einem dem Gleichnis angemessenen knappen, würdevollen Erzählton. Satzbau und Pronomenbezüge sind verständlich. „Geld gegen Zinsen verleihen“ ist idiomatisch und präzise.
  terminology: „Das Reich“ ist für ⲡⲙⲛⲧⲣⲣⲟ eine etablierte, hier ausreichend offene Wiedergabe. „Verborgener Schatz“, „Käufer“, „fand“ und „Geld gegen Zinsen verleihen“ treffen die jeweiligen koptischen Ausdrücke. Die Übersetzung schwächt die ausdrücklich genannte Zinsgabe nicht ab.
