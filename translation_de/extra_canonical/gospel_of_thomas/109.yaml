base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/109.yaml
  text: Jesus said[1], "The kingdom is like a man who has a hidden treasure in his field, without knowing about it. And after he died, he left it to his son. The son did not know. He took that field and sold it. And the one who bought it came, and while he was plowing, he found the treasure[2]. He began to lend money at interest to whomever he wished."
translation:
  language: de
  text: 'Jesus sagte[a]: „Das Reich gleicht einem Mann, der auf seinem Feld einen verborgenen Schatz hatte, ohne davon zu wissen. Nachdem er gestorben war, hinterließ er ihn seinem Sohn. Der Sohn wusste nichts davon. Er übernahm das Feld und verkaufte es. Der Käufer kam, und als er pflügte, fand er den Schatz[b]. Da begann er, Geld gegen Zinsen zu verleihen, wem er wollte.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Diese Fassung des Gleichnisses unterscheidet sich deutlich von Matthäus 13,44: Hier wissen weder der ursprüngliche Besitzer noch dessen Sohn von dem Schatz; erst der spätere Käufer findet ihn und verleiht danach Geld gegen Zinsen.'
    reason: Querverweis und Hinweis auf die eigenständige Gestalt des Thomastextes.
  - marker: b
    text: Mehrere Wörter dieses Spruchs sind wegen kleiner Lücken in der Handschrift ergänzt. Die Ergänzungen gelten aufgrund der erhaltenen Buchstaben und des Zusammenhangs als sehr sicher.
    reason: Textkritischer Hinweis zu den Ergänzungen im Manuskript.
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: das Reich
  rationale: Die koptische Bezeichnung kann Reich oder Königsherrschaft meinen. „Das Reich“ ist im Deutschen natürlich und bewahrt die im Text nicht näher bestimmte Bedeutung.
- source_word: ⲁϩⲟ
  choice: Schatz
  rationale: Bezeichnet einen Schatz oder Hort; „Schatz“ passt zum verborgenen Fund auf dem Feld.
- source_word: ⲉϥϩⲏⲡ ... ⲉϥⲟ ⲛⲁⲧⲥⲟⲟⲩⲛ ⲉⲣⲟϥ
  choice: einen verborgenen Schatz ... ohne davon zu wissen
  rationale: Gibt sowohl das Verborgensein des Schatzes als auch die Unwissenheit des Besitzers ausdrücklich wieder.
- source_word: ϥⲓ
  choice: übernahm
  rationale: Das Verb kann nehmen, empfangen oder in Besitz übernehmen bedeuten. „Übernahm“ passt zum geerbten Feld, ohne einen technisch-rechtlichen Erbvorgang stärker auszudrücken als die Quelle.
- source_word: ⲧⲟⲟⲩ
  choice: kaufte / der Käufer
  rationale: Das Verb bezeichnet den Kauf; die substantivierte Wiedergabe „der Käufer“ sorgt im Deutschen für einen klaren Bezug.
- source_word: ⲉϥⲥⲕⲁⲉⲓ
  choice: als er pflügte
  rationale: Die Umstandskonstruktion bezeichnet eine gleichzeitig ablaufende Tätigkeit. Im Zusammenhang mit dem Feld ist „pflügen“ natürlicher als „graben“ und bewahrt den zufälligen Charakter des Fundes.
- source_word: ϩⲉ ⲉ-
  choice: fand
  rationale: Die Verbindung bedeutet, auf etwas zu stoßen oder etwas zu finden.
- source_word: ϯ ϩⲟⲙⲧ ⲉ ⲧⲙⲏⲥⲉ
  choice: Geld gegen Zinsen verleihen
  rationale: Die Wendung lautet wörtlich etwa „Geld/Kupfer auf Zins geben“. Die Übersetzung bewahrt die ausdrückliche Erwähnung des Zinsnehmens.
theological_decisions:
- issue: Bedeutung von ⲡⲙⲛⲧⲣⲣⲟ
  choice: das Reich
  alternative: die Königsherrschaft
  rationale: Die knappe Formulierung lässt offen, ob ein Herrschaftsbereich oder die Ausübung königlicher Herrschaft im Vordergrund steht. „Das Reich“ hält die traditionelle Bildsprache fest, ohne eine nähere theologische Bestimmung einzuführen.
- issue: Geldverleih gegen Zinsen
  choice: Geld gegen Zinsen verleihen
  alternative: das Geld anlegen
  rationale: Der koptische Text nennt das Geben von Geld auf Zins ausdrücklich. Diese möglicherweise anstößige Spannung darf nicht durch eine neutralisierende Wiedergabe beseitigt werden.
- issue: Bezug des Hinterlassenen
  choice: hinterließ er ihn seinem Sohn
  alternative: hinterließ er das Feld seinem Sohn
  rationale: Das maskuline Pronomen lässt sich am unmittelbarsten auf den Schatz beziehen; der weitere Verlauf zeigt zugleich, dass der Sohn über das Feld verfügt. Die Übersetzung wahrt den pronominalen Bezug, statt die Erzählung ausdrücklich auf das Feld festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählführung. Kurze Hauptsätze erhalten den Gleichnisstil. „Geld gegen Zinsen verleihen“ wird trotz der ethischen Spannung nicht abgeschwächt; „als er pflügte“ macht deutlich, dass der Schatz bei der Feldarbeit gefunden wurde.
