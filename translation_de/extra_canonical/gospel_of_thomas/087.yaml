base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/087.yaml
  text: Jesus said[a], “Wretched is the body that depends on a body[d][c][b], and wretched is the soul that depends on these two.”
translation:
  language: de
  text: 'Jesus sagte: „Elend ist der Körper, der sich auf einen Körper stützt,[a] und elend ist die Seele, die sich auf diese beiden stützt.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Sich auf … stützt“ kann auch mit „von … abhängt“ oder „auf … ruht“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: '„Diese beiden“ verweist auf die beiden im ersten Satzteil genannten Körper: den Körper, der sich stützt, und den Körper, auf den er sich stützt.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ⲟⲩⲧⲁⲗⲁⲓⲡⲱⲣⲟⲛ / ⲟⲩⲧⲁⲗⲁⲓⲡⲱⲣⲟⲥ
  choice: elend
  rationale: Das griechische Lehnwort ταλαίπωρος bezeichnet etwas oder jemanden als elend bzw. beklagenswert. „Elend“ bewahrt den scharfen wertenden Ton und funktioniert im Deutschen prädikativ sowohl bei „Körper“ als auch bei „Seele“.
- source_word: ⲥⲱⲙⲁ
  choice: Körper
  rationale: Direkte und im Zusammenhang natürliche Wiedergabe des griechischen Lehnworts σῶμα.
- source_word: ⲉⲓϣⲉ (ⲁϣⲉ) + ⲛ
  choice: sich auf … stützen
  rationale: Die Verbindung kann ein Ruhen auf oder eine Abhängigkeit von etwas ausdrücken. „Sich auf … stützen“ erhält das konkrete Bild und zugleich den möglichen Sinn des Angewiesenseins, ohne eine Herkunftsaussage festzulegen.
- source_word: ⲯⲩⲭⲏ
  choice: Seele
  rationale: Das griechische Lehnwort ψυχή wird hier wegen des ausdrücklichen Gegenübers zum Körper als „Seele“ wiedergegeben; „Leben“ oder „Selbst“ würden diese Spannung verwischen.
- source_word: ⲛⲡⲁⲓ ⲛⲡⲥⲛⲁⲩ
  choice: diese beiden
  rationale: Die demonstrative Dualform verweist auf ein Paar. Die wörtlich-nahe Formulierung bewahrt die ungewöhnliche Präzision und die Auslegungsbedürftigkeit des Satzes.
theological_decisions:
- issue: Bezug von „diese beiden“
  choice: Der Haupttext lässt den demonstrativen Rückverweis formal stehen; die Fußnote nennt als wahrscheinlichsten Bezug die beiden Körper des ersten Satzteils.
  alternative: Bezug auf Körper und Seele
  rationale: Im unmittelbaren Satzbau sind vor der Seele bereits der sich stützende Körper und der Körper, auf den er sich stützt, als Paar angelegt. Da die Formulierung dennoch mehrdeutig wirken kann, wird die Deutung nicht in den Haupttext eingebaut.
translation_notes:
  register: Knappes, würdevolles Standarddeutsch. Die parallele Satzstruktur und die befremdliche Aussage des koptischen Textes bleiben erhalten. „Körper“ wird bewusst wiederholt, statt den zweiten Beleg durch ein Pronomen zu glätten.
