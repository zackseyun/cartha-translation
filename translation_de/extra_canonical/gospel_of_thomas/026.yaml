base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/026.yaml
  text: Jesus said, “The splinter that is in your brother’s eye, you see it; but the beam that is in your own eye, you do not see it. When you take the beam out of your own eye, then you will see clearly to take the splinter out of your brother’s eye.”
translation:
  language: de
  text: 'Jesus sagte: „Den Splitter im Auge deines Bruders siehst du; aber den Balken in deinem eigenen Auge siehst du nicht. Wenn du den Balken aus deinem eigenen Auge herausnimmst, dann wirst du klar sehen, um den Splitter aus dem Auge deines Bruders herauszunehmen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲡϫⲏ
  choice: Splitter
  rationale: Bezeichnet ein kleines Holzstück. „Splitter“ bewahrt die Holzmetaphorik und den Größenkontrast zum Balken, ohne an die synoptischen Parallelen anzugleichen.
- source_word: ⲡⲥⲟⲓ
  choice: Balken
  rationale: Bezeichnet insbesondere einen tragenden bzw. baulichen Balken; die architektonische Vorstellung und der starke Größenkontrast bleiben erhalten.
- source_word: ⲛⲟⲩϫⲉ
  choice: herausnehmen
  rationale: Das Verb kann „werfen“, „hinaustreiben“ oder „entfernen“ bedeuten. Im Zusammenhang mit einem Gegenstand im Auge ist „herausnehmen“ im Deutschen natürlich und sachlich passend.
- source_word: ⲛⲁⲩ ⲉⲃⲟⲗ
  choice: klar sehen
  rationale: Die Verbindung bedeutet wörtlich etwa „hinaussehen“ und bezeichnet hier ein wiederhergestelltes bzw. klares Sehen.
- source_word: ⲥⲟⲛ
  choice: Bruder
  rationale: Die lexikalisch männliche Verwandtschaftsbezeichnung wird formal bewahrt; im Kontext kann sie zugleich einen Mitjünger oder Angehörigen der Gemeinschaft bezeichnen.
- source_word: ϩⲟⲧⲁⲛ ⲉⲣϣⲁⲛ_
  choice: wenn du … herausnimmst
  rationale: Die Konstruktion bildet einen zukünftigen oder bedingten Temporalsatz. Das schlichte „wenn“ erhält die knappe Form des Spruchs.
- source_word: ⲃⲁⲗ
  choice: Auge
  rationale: Die gewöhnliche anatomische Bedeutung ist eindeutig.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die deutsche Voranstellung „Den Splitter … siehst du“ bildet die koptische Topikalisierung mit resumptivem Pronomen idiomatisch nach, ohne das im Deutschen unnötige „ihn“ zu erzwingen. „Um … herauszunehmen“ bewahrt die finale Beziehung des letzten Satzteils.
