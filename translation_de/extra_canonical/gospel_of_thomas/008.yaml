base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/008.yaml
  text: And he said, "The human is like a wise fisherman who cast his net into the sea. He drew it up from the sea full of small fish. Among them, the wise fisherman found a large, fine fish. He threw all the small fish back down into the sea; he chose the large fish without difficulty. Whoever has ears to hear, let him hear."
translation:
  language: de
  text: 'Und er sagte: „Der Mensch[a] gleicht einem weisen Fischer, der sein Netz ins Meer warf. Er zog es aus dem Meer herauf, und es war voller kleiner Fische. Unter ihnen fand der weise Fischer einen großen, guten Fisch. Er warf alle kleinen Fische hinab[b] ins Meer und wählte den großen Fisch ohne Mühe aus. Wer Ohren hat zu hören, soll hören.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das koptische Wort kann „Mensch“ oder „Mann“ bedeuten; hier ist es allgemein gebraucht.
    reason: lexical_alternative
  - marker: b
    text: Das Wort für „hinab“ ist im Manuskript teilweise beschädigt, lässt sich aber sicher ergänzen.
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲣⲱⲙⲉ
  choice: der Mensch
  rationale: Der bestimmte Artikel wird generisch gebraucht. „Der Mensch“ bewahrt diesen allgemeinen Sinn, ohne die Aussage auf einen bestimmten Mann zu beschränken.
- source_word: ⲟⲩⲱϩⲉ ⲛⲣⲙⲛϩⲏⲧ
  choice: weiser Fischer
  rationale: ⲟⲩⲱϩⲉ bezeichnet hier einen Fischer; ⲣⲙⲛϩⲏⲧ bedeutet wörtlich einen Menschen mit Herz bzw. Verstand und idiomatisch einen weisen oder verständigen Menschen.
- source_word: ⲡⲉϥⲁⲃⲱ
  choice: sein Netz
  rationale: Das Possessivpräfix ⲡⲉϥ- verlangt „sein“; ⲁⲃⲱ bezeichnet ein Netz, hier ein Fischernetz.
- source_word: ϩⲉ ⲉ-
  choice: fand
  rationale: Die Wendung bedeutet wörtlich etwa „stieß auf“, wird hier aber natürlich mit „fand“ wiedergegeben.
- source_word: ⲉⲛⲁⲛⲟⲩϥ
  choice: gut
  rationale: Das Adjektiv bezeichnet den großen Fisch als gut bzw. vortrefflich. „Gut“ wahrt die schlichte Wertung des koptischen Textes.
- source_word: ⲭⲱⲣⲓⲥϩⲓⲥⲉ
  choice: ohne Mühe
  rationale: Die Verbindung aus griechisch χωρὶς („ohne“) und koptisch ϩⲓⲥⲉ („Mühe, Anstrengung“) wird knapp und idiomatisch wiedergegeben.
theological_decisions:
- issue: Verhältnis zum Gleichnis vom Fischernetz in Matthäus 13,47–48
  choice: 'Die besondere Gestalt der Thomasüberlieferung bleibt unverändert: ein weiser Fischer wählt einen einzigen großen Fisch aus.'
  alternative: Angleichung an die matthäische Trennung guter und schlechter Fische
  rationale: Der koptische Text spricht von kleinen Fischen und einem großen, guten Fisch, nicht von guten und schlechten Fischen. Eine Harmonisierung würde die eigenständige Aussage des Textes verändern.
- issue: Generische Bedeutung von ⲡⲣⲱⲙⲉ
  choice: „Der Mensch“
  alternative: „Der Mann“ oder „ein Mensch“
  rationale: Die Formulierung ist als allgemeiner Vergleich zu verstehen. Die Übersetzung bewahrt sowohl den bestimmten Artikel als auch den generischen Charakter.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Gleichnissprache. Die wiederholte Bezeichnung „der weise Fischer“ und der Gegensatz zwischen den vielen kleinen Fischen und dem einen großen Fisch bleiben bewusst erhalten.
