base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/035.yaml
  text: Jesus said, "It is not possible for someone to enter the strong man’s house and take it by force unless he binds his hands; then he will overturn his house."
translation:
  language: de
  text: 'Jesus sagte: »Niemand kann in das Haus des Starken hineingehen und sich seiner mit Gewalt bemächtigen[a], es sei denn, er bindet ihm die Hände. Dann wird er sein Haus ausleeren[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das koptische Pronomen kann sich grammatisch sowohl auf das Haus als auch auf den Starken beziehen: Man kann sich also »des Hauses« oder »des Starken« mit Gewalt bemächtigen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich etwa »ausgießen« oder »ausleeren«; auch »umstürzen« ist möglich. Anders als die synoptischen Parallelen verwendet der koptische Text hier nicht das übliche Verb für »plündern«.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙⲛϭⲟⲙ ⲛⲧⲉⲟⲩⲁ
  choice: Niemand kann
  rationale: Gibt die negative Möglichkeitsaussage natürlich und prägnant wieder, ohne ihren absoluten Sinn abzuschwächen.
- source_word: ⲡϫⲱⲱⲣⲉ
  choice: der Starke
  rationale: Das substantivierte Adjektiv bezeichnet den starken Mann; „der Starke“ bewahrt die knappe, sprichwortartige Form des Koptischen.
- source_word: ϫⲓⲧϥ ⲛϫⲛⲁϩ
  choice: sich seiner mit Gewalt bemächtigen
  rationale: Die Wendung bezeichnet gewaltsames Ergreifen. Das Pronomen „seiner“ lässt wie das koptische maskuline Suffix offen, ob das Haus oder der Starke gemeint ist.
- source_word: ⲙⲟⲩⲣ ⲛⲛⲉϥϭⲓϫ
  choice: ihm die Hände binden
  rationale: Folgt dem Handschriftenwortlaut mit dem Plural „Hände“ und macht den Starken als naheliegenden Bezug der Handlung deutlich.
- source_word: ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ
  choice: ausleeren
  rationale: Bewahrt die konkrete Bildlichkeit von „ausgießen/ausleeren“ und vermeidet eine vorschnelle Angleichung an das „Plündern“ der synoptischen Parallelen.
theological_decisions:
- issue: Bezug des Suffixes bei ϫⲓⲧϥ
  choice: Die grammatische Mehrdeutigkeit zwischen dem Haus und dem Starken bleibt durch „seiner“ erhalten.
  alternative: „das Haus mit Gewalt nehmen“ oder „den Starken mit Gewalt überwältigen“
  rationale: Im Koptischen sind sowohl „Haus“ als auch „der Starke“ maskulin; eine eindeutige Festlegung würde eine echte Ambiguität des Quelltexts beseitigen.
- issue: Verhältnis zu Markus 3,27 und Matthäus 12,29
  choice: ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ wird eigenständig als „ausleeren“ übersetzt.
  alternative: „plündern“
  rationale: Die Thomas-Fassung verwendet nicht das in den koptischen synoptischen Parallelen übliche Verb für „plündern“; ihre abweichende Wortwahl soll erkennbar bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Spruchform. „Der Starke“ hält die substantivische Ausdrucksweise des Koptischen fest; „sich seiner bemächtigen“ ist bewusst etwas gehoben, weil es die im Deutschen sonst schwer wiederzugebende Mehrdeutigkeit des Pronomens erhält.
