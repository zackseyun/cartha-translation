revisions:
- from: 'Jesus sagte: »Vielleicht denken die Menschen, ich sei gekommen, um Frieden auf die Welt zu werfen.[a] Doch sie wissen nicht, dass ich gekommen bin, um Spaltungen auf die Erde zu werfen: Feuer, Schwert, Krieg. Denn fünf werden in einem Haus sein: Drei werden gegen zwei stehen und zwei gegen drei, der Vater gegen den Sohn und der Sohn gegen den Vater.[b] Und sie werden als Einzelne dastehen.«[c]'
  to: 'Jesus sagte: »Vielleicht denken die Menschen, ich sei gekommen, um Frieden auf die Welt zu werfen. Doch sie wissen nicht, dass ich gekommen bin, um Spaltungen auf die Erde zu werfen:[a] Feuer, Schwert, Krieg. Denn fünf werden in einem Haus sein: Drei werden gegen zwei stehen und zwei gegen drei, der Vater gegen den Sohn und der Sohn gegen den Vater.[b] Und sie werden als Einzelne dastehen.«[c]'
  rationale: 'Es ist nur eine sichere strukturell-textkritische Präzisierung erforderlich: Die Anmerkung zur nichtstandardmäßigen Vokalschreibung wird von der ersten an die zweite Instanz von „werfen“ versetzt, auf die sie sich im koptischen Manuskript bezieht. Der Übersetzungstext bleibt in seiner Bedeutung unverändert; die Anmerkung nennt nun zusätzlich die betreffenden Formen.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:05:18Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der deutsche Text gibt die Abfolge und die zentralen Begriffe des koptischen Textes zuverlässig wieder: die vorsichtige Einleitung (ⲧⲁⲭⲁ), das zweimalige bildhafte „werfen“, Frieden/Welt gegenüber Trennung bzw. Spaltung/Erde, die Aufzählung Feuer–Schwert–Krieg, die Fünferkonstellation sowie die abschließende Bezeichnung mit monachos. „Als Einzelne“ ist eine zurückhaltende, nicht anachronistische Wiedergabe von monachos und wahrt dessen Auslegungsoffenheit.'
  naturalness: Modernes Standarddeutsch und ein passender, würdevoller Registerton. Die bewusst ungewohnte Verbindung „Frieden auf die Welt werfen“ bildet die markante Bildsprache der Vorlage angemessen nach. „Gegen ... stehen“ ist im Deutschen für die beschriebenen Gegensätze klar.
  terminology: „Spaltungen“, „Schwert“ und „Krieg“ sind sachgerecht. Die Anmerkung zu monachos vermeidet sowohl eine unzulässige Gleichsetzung mit späterem institutionellem Mönchtum als auch eine dogmatische Deutung. Die Textanmerkung zur abweichenden Vokalschreibung ist zutreffend, muss aber bei der zweiten, abweichend geschriebenen Infinitivform verankert werden.
  issues:
