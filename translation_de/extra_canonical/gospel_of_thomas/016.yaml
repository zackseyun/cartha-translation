base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/016.yaml
  text: 'Jesus said[1], "Perhaps people think that I have come to cast peace upon the world, and they do not know that I have come to cast divisions upon the earth: fire, sword, war. For there will be five in a house: there will be three against two, and two against three, father against son, and son against father[3][2]. And they will stand as solitary ones."'
translation:
  language: de
  text: 'Jesus sagte: »Vielleicht denken die Menschen, ich sei gekommen, um Frieden auf die Welt zu werfen. Doch sie wissen nicht, dass ich gekommen bin, um Spaltungen auf die Erde zu werfen:[a] Feuer, Schwert, Krieg. Denn fünf werden in einem Haus sein: Drei werden gegen zwei stehen und zwei gegen drei, der Vater gegen den Sohn und der Sohn gegen den Vater.[b] Und sie werden als Einzelne dastehen.«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Manuskript ist der zweite Infinitiv „werfen“ abweichend vokalisiert (ⲁⲛⲟⲩϫⲉ statt der standardsprachlichen Form ⲉⲛⲟⲩϫⲉ); diese Schreibung ist in diesem Text geläufig.
    reason: dialect_note
  - marker: b
    text: Vgl. Lukas 12,51–53 und Matthäus 10,34–35.
    reason: cross_reference
  - marker: c
    text: Das zugrunde liegende griechische Lehnwort monachos kann „einzeln“, „allein“ oder „allein lebend“ bezeichnen. Die spätere Bedeutung „Mönch“ ist hier nicht zwingend; auch eine innere Ungeteiltheit wird bisweilen angenommen, aber vom Satz nicht ausdrücklich erklärt.
    reason: lexical_theological_note
lexical_decisions:
- source_word: ⲧⲁⲭⲁ
  choice: vielleicht
  rationale: Das griechische Lehnwort τάχα bezeichnet hier eine Vermutung; „vielleicht“ gibt die vorsichtige Aussage natürlich wieder.
- source_word: ⲛⲟⲩϫⲉ
  choice: werfen
  rationale: Das Verb bedeutet „werfen“ oder „schleudern“. Die ungewöhnliche, kraftvolle Bildsprache wird sowohl bei „Frieden“ als auch bei „Spaltungen“ beibehalten.
- source_word: ⲡⲱⲣϫ
  choice: Spaltungen
  rationale: Das Wort bezeichnet Trennungen oder Spaltungen; der Plural des koptischen Textes bleibt erhalten.
- source_word: ⲉϫⲛ
  choice: gegen
  rationale: Im Zusammenhang der gegeneinanderstehenden Gruppen und Familienmitglieder drückt „gegen“ die Opposition idiomatisch aus.
- source_word: ⲱϩⲉ ⲉⲣⲁⲧⲟⲩ
  choice: dastehen
  rationale: Die koptische Wendung bedeutet wörtlich, auf den eigenen Füßen zu stehen; „dastehen“ ist im Deutschen knapp und natürlich.
- source_word: ⲙⲟⲛⲁⲭⲟⲥ
  choice: Einzelne
  rationale: Das griechische Lehnwort μοναχός kann einen einzelnen oder allein lebenden Menschen bezeichnen. „Einzelne“ vermeidet die möglicherweise anachronistische Festlegung auf institutionelle Mönche und lässt die genaue Bedeutung offen.
theological_decisions:
- issue: Bedeutung von ⲙⲟⲛⲁⲭⲟⲥ am Schluss des Spruchs
  choice: als Einzelne
  alternative: als Mönche; als Einsame; als Alleinstehende
  rationale: Der Text erklärt nicht, ob soziale Vereinzelung, ein ungeteilter Zustand oder eine asketische Lebensform gemeint ist. Die Übersetzung wahrt diese Offenheit und vermeidet es, eine spätere monastische Institution oder eine bestimmte geistliche Deutung vorauszusetzen.
- issue: Verhältnis von Frieden und Spaltung
  choice: Die paradoxe Gegenüberstellung bleibt ohne harmonisierende Erklärung stehen.
  alternative: „Frieden“ abschwächen oder die Spaltung ausdrücklich nur als Wirkung der Botschaft erläutern
  rationale: Der koptische Text formuliert die Spannung unmittelbar und erklärt ihre theologische Ursache nicht. Die Übersetzung sollte sie daher nicht stillschweigend auflösen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Satzbau. Das zweimalige „werfen“ ist bewusst beibehalten, obwohl die Verbindung mit „Frieden“ im Deutschen ungewohnt klingt, weil gerade diese paradoxe Wortwahl den Ausgangstext prägt. „In einem Haus“ bewahrt das konkrete Bild einer Hausgemeinschaft; „gegen ... stehen“ verdeutlicht die Opposition, ohne zusätzliche Gewaltbegriffe einzutragen.
