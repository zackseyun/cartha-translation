revisions:
- from: 'Jesus sagte: »Was du mit deinem einen Ohr hören wirst – mit dem anderen Ohr[a] –, das verkünde von euren Dächern. Denn niemand zündet eine Lampe an und stellt sie unter ein Messgefäß[b] oder an einen verborgenen Ort. Vielmehr stellt man sie auf den Leuchter, damit alle, die hineingehen und herauskommen, ihr Licht sehen.[c]«'
  to: 'Jesus sagte: »Was du in deinem Ohr hören wirst, verkünde es im anderen Ohr[a] auf euren Dächern. Denn niemand zündet eine Lampe an und stellt sie unter ein Messgefäß[b]; auch stellt niemand sie an einen verborgenen Ort. Vielmehr stellt man sie auf den Leuchter, damit alle, die hineingehen und herauskommen, ihr Licht sehen.[c]«'
