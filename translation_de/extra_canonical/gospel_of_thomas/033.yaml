base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/033.yaml
  text: Jesus said, "What you will hear in your ear—in the other ear[a] proclaim it upon your rooftops; for no one lights a lamp and puts it under a measuring-basket[b], nor does one put it in a hidden place, but rather one puts it on the lampstand, so that those who enter and those who go out may see its light.[c]"
translation:
  language: de
  text: 'Jesus sagte: »Was du in deinem Ohr hören wirst, verkünde es im anderen Ohr[a] auf euren Dächern. Denn niemand zündet eine Lampe an und stellt sie unter ein Messgefäß[b]; auch stellt niemand sie an einen verborgenen Ort. Vielmehr stellt man sie auf den Leuchter, damit alle, die hineingehen und herauskommen, ihr Licht sehen.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich und in ungewöhnlicher Fügung: „Was du in deinem Ohr hören wirst, verkünde es im anderen Ohr.“ Wie „im anderen Ohr“ syntaktisch oder bildlich zu verstehen ist, bleibt unsicher.'
    reason: Die schwer verständliche Formulierung der koptischen Handschrift bleibt im Haupttext sichtbar, ohne durch eine spekulative Deutung erklärt zu werden.
  - marker: b
    text: Das Wort kann ein Messgefäß beziehungsweise ein als Hohlmaß dienendes Gefäß bezeichnen; traditionell wird hier auch „Scheffel“ übersetzt.
    reason: „Messgefäß“ bleibt sachlich offen; die Fußnote nennt die vertraute traditionelle Alternative.
  - marker: c
    text: Anders als manche verwandten Lampensprüche nennt diese Fassung ausdrücklich sowohl die Hineingehenden als auch die Herauskommenden.
    reason: Die auffällige Eigenart dieser Textfassung wird dokumentiert und vor stiller Harmonisierung geschützt.
lexical_decisions:
- source_word: ⲧⲁϣⲉⲟⲉⲓϣ
  choice: verkünde
  rationale: Das koptische Verb bezeichnet öffentliches Verkündigen oder Ausrufen; „verkünde“ wahrt den feierlichen Ton und den Gegensatz zum nur ins Ohr Gehörten.
- source_word: ⲛⲉⲧⲛϫⲉⲛⲉⲡⲱⲣ
  choice: von euren Dächern
  rationale: Die Pluralform mit Possessivpronomen der zweiten Person Plural wird ausdrücklich wiedergegeben; „von“ klingt im Deutschen bei einer Verkündigung natürlicher als das räumlich engere „auf“.
- source_word: ϩⲏⲃⲥ
  choice: Lampe
  rationale: Gemeint ist eine kleine Öllampe, nicht eine Kerze; „Lampe“ entspricht dem antiken Sachbezug.
- source_word: ⲙⲁⲁϫⲉ
  choice: Messgefäß
  rationale: Im Kontext der Lampenrede bezeichnet das Wort ein Gefäß beziehungsweise Hohlmaß, unter das man eine Lampe stellen könnte. „Messgefäß“ bewahrt beide Aspekte, ohne eine bestimmte Gefäßform vorauszusetzen.
- source_word: ⲗⲩⲭⲛⲓⲁ
  choice: Leuchter
  rationale: Das griechische Lehnwort bezeichnet den Lampenständer; der traditionelle, verständliche Ausdruck „Leuchter“ passt zum würdevollen Register.
- source_word: ⲟⲩⲟⲉⲓⲛ
  choice: Licht
  rationale: Direkte und sachlich eindeutige Entsprechung; das Possessivpronomen wird als „ihr Licht“ auf die Lampe bezogen.
theological_decisions:
- issue: Bezug und Sinn der Wendung „mit dem anderen Ohr“
  choice: Die ungewöhnliche Wendung bleibt im Haupttext stehen und wird nicht sinnglättend umgedeutet.
  alternative: „Was du in dein eines Ohr geflüstert bekommst, das verkünde mit dem anderen …“ oder Auslassung der Wendung
  rationale: Der koptische Text nennt ausdrücklich das Ohr und das andere Ohr, lässt aber die syntaktische beziehungsweise bildliche Funktion der zweiten Wendung offen. Eine theologische Erklärung wäre spekulativ.
- issue: Personenkreis, der das Licht sieht
  choice: „alle, die hineingehen und herauskommen“
  alternative: „die Eintretenden und die Hinausgehenden“ oder Angleichung an kanonische Parallelstellen
  rationale: Beide Bewegungsrichtungen des koptischen Textes werden bewahrt, auch wenn kanonische Fassungen oft nur die Eintretenden nennen. Die Aussage wird nicht harmonisiert.
- issue: Art des verborgenen Ortes
  choice: „an einen verborgenen Ort“
  alternative: „in einen Keller“ oder eine andere konkrete Lokalisierung
  rationale: Die Quelle bleibt allgemein; eine Konkretisierung würde eine nicht ausgesprochene Auslegung eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Rede. Der Wechsel von „du“ im ersten Satz zu „euren Dächern“ folgt dem Wechsel vom Singular zum Plural in der Quelle. Die sprichwörtliche Lampenrede wird natürlich formuliert, ohne ihre vom kanonischen Wortlaut abweichenden Einzelheiten anzugleichen.
