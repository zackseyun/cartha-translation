  naturalness: Die revidierte Fassung bleibt modernes, würdiges Standarddeutsch. Die absichtlich ungewöhnliche Ohr-Formulierung wird durch eine Fußnote erläutert, ohne ihre Unsicherheit aus dem Haupttext zu entfernen.
  terminology: „Messgefäß“, „Lampe“, „Leuchter“ und „Licht“ sind angemessen. „Verkündigen“ trifft den öffentlichen Charakter des Verbs; „auf euren Dächern“ gibt die Präposition genauer wieder.
