revisions:
- from: 'Simon Petrus sagte zu ihnen: »Maria soll aus unserer Mitte fortgehen; denn die Frau[a] ist des Lebens nicht würdig.« Jesus sagte: »Seht, ich selbst werde sie führen[b] und sie männlich[c] machen, damit auch sie ein lebendiger Geist wird, der euch Männern gleicht. Denn jede Frau, die sich männlich macht, wird in das Königreich der Himmel[d] eingehen.«'
  to: 'Simon Petrus sagte zu ihnen: »Maria soll aus unserer Mitte fortgehen; denn die Frau[a] ist des Lebens nicht würdig.« Jesus sagte: »Seht, ich selbst werde sie[b] führen, damit ich sie männlich[c] mache, damit auch sie ein lebendiger Geist wird, der euch Männern gleicht. Denn jede Frau, die sich männlich macht, wird in das Königreich der Himmel[d] eingehen.«'
  rationale: Die Übersetzung wird nur an der klaren syntaktischen Zweckrelation von ϫⲉⲕⲁⲁⲥ korrigiert. Die Fußnote zum Königreich der Himmel wird außerdem neutraler formuliert. Alle übrigen lexikalischen Entscheidungen und die Fußnotenanker können bestehen bleiben.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:06:26Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt Sprecher, Aufforderung, Würdigkeitsaussage, die markierte Frau/Mann- bzw. weiblich/männlich-Polarität, den unbestimmten Begriff »Leben«, das »lebendige Geist«-Bild und das Eingehen in das Königreich der Himmel insgesamt genau wieder. Jedoch ist ϫⲉⲕⲁⲁⲥ als Zweckbestimmung zu übersetzen: Jesu Führen geschieht »damit« er Maria männlich mache, nicht schlicht koordinativ als zweites Vorhaben.'
  naturalness: Der knappe, würdige Ton ist modernes, gut verständliches Standarddeutsch. »Seht« und »männlich machen« bewahren die Prägnanz und Fremdheit des Spruchs. Die Wiederholung von »damit« ist hier wegen der gestuften Zweckbestimmungen sowohl verständlich als auch quellennah.
  terminology: »Frau«/»männlich«/»Männer« erhält die im Koptischen absichtlich harte Geschlechterpolarität im idiomatischen Deutschen. »Geist«, »Leben« und »Königreich der Himmel« bleiben ohne dogmatische Einengung. Die Anmerkung zum Himmelreich sollte die Ausdrucksweise erläutern, ohne die Referenz als »das Göttliche« auszudeuten.
  issues:
