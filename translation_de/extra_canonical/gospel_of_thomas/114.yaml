  - severity: low
    issue: Fußnote d deutet den Ausdruck als »Bereich beziehungsweise Königsherrschaft des Göttlichen« aus.
    rationale: Diese Formulierung geht über eine sprachliche Erläuterung hinaus. Eine neutrale Erklärung der pluralischen Form »Himmel« und der möglichen Wiedergaben genügt.
