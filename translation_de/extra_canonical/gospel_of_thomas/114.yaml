base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/114.yaml
  text: 'Simon Peter said to them, “Let Mary go out from among us, for the female is not worthy of life.” Jesus said, “Look: I myself will lead her, so that I will make her male, so that she too may become a living spirit like you males. For every female who makes herself male will enter the kingdom of the heavens.”'
translation:
  language: de
  text: 'Simon Petrus sagte zu ihnen: »Maria soll aus unserer Mitte fortgehen; denn die Frau[a] ist des Lebens nicht würdig.« Jesus sagte: »Seht, ich selbst werde sie[b] führen, damit ich sie männlich[c] mache, damit auch sie ein lebendiger Geist wird, der euch Männern gleicht. Denn jede Frau, die sich männlich macht, wird in das Königreich der Himmel[d] eingehen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das koptische ⲥϩⲓⲙⲉ kann „Frau“ oder „weiblich/weibliches Wesen“ bezeichnen. Hier steht es in einer schroffen Gegenüberstellung zu ϩⲟⲟⲩⲧ, „männlich/Mann“.
    reason: lexical_alternative
  - marker: b
    text: Das Objektpronomen „sie“ steht im Manuskript als ⲙ̄ⲙⲟⲥ; die normalisierte Textfassung bietet die gleichbedeutende Form ⲛⲛⲧⲟⲥ. Beide sind direkte Objektformen der dritten Person Singular Femininum.
    reason: textual_variant
  - marker: c
    text: Für „männlich“ begegnen leicht unterschiedliche Schreibungen von ϩⲟⲟⲩⲧ. Dabei handelt es sich um eine orthografische beziehungsweise dialektale Schwankung ohne erkennbaren Bedeutungsunterschied.
    reason: dialect_note
  - marker: d
    text: Wörtlich „Königreich der Himmel“. Die pluralische Form „Himmel“ kann in dieser Wendung idiomatisch die himmlische Sphäre bezeichnen; manche Übersetzungen geben sie daher mit „Himmelreich“ oder „Königsherrschaft des Himmels“ wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲙⲁⲣⲉ- … ⲉⲓ ⲉⲃⲟⲗ
  choice: soll … fortgehen
  rationale: Die jussivische Form fordert Marias Weggang; „soll … fortgehen“ gibt dies in natürlichem Deutsch wieder, ohne ein gewaltsames Vertreiben ausdrücklich einzutragen.
- source_word: ϩⲛⲁⲛⲟⲛ
  choice: aus unserer Mitte
  rationale: Mit ⲉⲃⲟⲗ bezeichnet die Wendung das Fortgehen aus der Gemeinschaft der Sprechenden.
- source_word: ⲥϩⲓⲙⲉ
  choice: Frau
  rationale: „Frau“ ist im Deutschen die natürliche Personenbezeichnung und kann hier generisch stehen. Die Fußnote weist darauf hin, dass das koptische Wort im Spruch der schroffen Gegenüberstellung zu „männlich/Männer“ dient.
- source_word: ⲙⲡϣⲁ ⲁⲛ ⲛⲡⲱⲛϩ
  choice: ist des Lebens nicht würdig
  rationale: Die Formulierung bewahrt die ausdrückliche Aussage über Würdigkeit und lässt offen, in welchem Sinn „Leben“ gemeint ist.
- source_word: ⲉⲓⲥϩⲏⲏⲧⲉ
  choice: Seht
  rationale: Der aufmerksamkeitslenkende Ausruf wird gegenwärtig und würdig wiedergegeben; der Plural passt zu den angesprochenen Jüngern.
- source_word: ⲥⲱⲕ
  choice: führen
  rationale: Das Verb kann „führen“ oder „ziehen“ bedeuten. „Führen“ wahrt die gerichtete Bewegung, ohne die Art des Vorgangs näher festzulegen.
- source_word: ⲉⲓⲣⲉ … ⲛϩⲟⲟⲩⲧ
  choice: männlich machen
  rationale: Die auffällige prädikative Konstruktion des Koptischen wird bewusst nicht zu einer abstrakten geistlichen Deutung geglättet.
- source_word: ⲡⲛⲉⲩⲙⲁ ⲉϥⲟⲛϩ
  choice: ein lebendiger Geist
  rationale: „Geist“ ist hier ein gewöhnliches Substantiv, kein ausdrücklich markierter Titel; „lebendig“ gibt das Partizip kompakt wieder.
- source_word: ⲉϥⲉⲓⲛⲉ ⲙ̄ⲙⲱⲧⲛ ⲛ̄ϩⲟⲟⲩⲧ
  choice: der euch Männern gleicht
  rationale: Die Vergleichsbeziehung und die ausdrückliche männliche Bezeichnung der Angesprochenen bleiben erhalten.
- source_word: ⲧⲙⲛ̄ⲧⲉⲣⲟ ⲛⲙ̄ⲡⲏⲩⲉ
  choice: das Königreich der Himmel
  rationale: Die Wiedergabe erhält sowohl das Reichs- beziehungsweise Herrschaftsmotiv als auch die formale Mehrzahl „Himmel“.
theological_decisions:
- issue: Bedeutung des Männlichwerdens
  choice: Die konkrete und befremdliche Bildsprache „männlich machen“ bleibt stehen.
  alternative: Als geistliche Ganzheit, Gleichheit oder Überwindung des Geschlechts paraphrasieren.
  rationale: Der Text erklärt das Bild nicht. Eine solche Paraphrase würde eine bestimmte theologische Auslegung in die Übersetzung eintragen und die Spannung des Spruchs auflösen.
- issue: Bedeutung von „Leben“
  choice: Das unbestimmte „Leben“ wird beibehalten.
  alternative: „ewiges Leben“, „Heil“ oder bloße irdische Existenz.
  rationale: Der koptische Ausdruck legt keine dieser Präzisierungen ausdrücklich fest.
- issue: Reich oder Herrschaft
  choice: „Königreich“ im Haupttext, mit Hinweis auf die mögliche dynamische Bedeutung „Königsherrschaft“.
  alternative: Nur „Königsherrschaft“ im Haupttext.
  rationale: So bleibt die traditionelle Bildwelt lesbar, während die semantische Weite des Herrschaftsbegriffs in der Fußnote sichtbar wird.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, knappem Erzählton. Die direkte Rede bleibt scharf und befremdlich, wie im koptischen Text. Veraltetes „Weib“ und künstliches „das Weibliche“ wurden vermieden; die sexuell markierte Polarität wird durch „Frau“, „männlich“ und „Männer“ samt Fußnote bewahrt.
