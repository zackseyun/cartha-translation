  source_fidelity: 'Die erste und dritte Aussage geben den sahidisch-koptischen Text zuverlässig wieder: „aus meinem Mund trinken“, „wie ich werden“ (ⲛ̄ⲧⲁϩⲉ: in meiner Weise) und das Offenbarwerden des Verborgenen für ihn. Die zweite Aussage ist jedoch in der deutschen Hauptfassung nicht quellennah: „zu ihm werden“ führt eine im Koptischen nicht vorhandene Richtungsrelation ein. Die prädikative Identifikation ⲉⲣⲉ ⲛⲧⲟϥ ⲡⲉ verlangt hier, bei aller beabsichtigten Fremdheit, „er werden“ bzw. „er sein“.'
  naturalness: „Wer aus meinem Mund trinkt“ und „das Verborgene wird sich ihm offenbaren“ sind natürliches, würdiges modernes Standarddeutsch. „Ich selbst werde er werden“ ist absichtlich markiert und weniger idiomatisch, bewahrt aber die zugespitzte Identifikationsaussage genauer als das flüssigere, jedoch sinnverschiebende „zu ihm werden“.
  terminology: „wie ich“ entspricht dem idiomatischen Ausdruck ⲛ̄ⲧⲁϩⲉ („in meiner Weise“) und vermeidet die sachlich nicht gedeckte Steigerung zu Gleichrangigkeit. „Das Verborgene“ gibt das kollektiv substantivierte Relativgefüge ohne unzulässige Festlegung von Zahl oder Inhalt angemessen wieder.
