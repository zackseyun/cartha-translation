base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/108.yaml
  text: Jesus said[a], “Whoever drinks from my mouth will become like me. I myself shall become he[e][d][c][b], and the hidden things will be revealed to him.”
translation:
  language: de
  text: 'Jesus sagte: „Wer aus meinem Mund trinkt[a], wird wie ich werden. Auch ich selbst werde er werden[b], und das Verborgene wird sich ihm offenbaren.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Aus meinem Mund trinken“ gibt das konkrete koptische Bild wieder. Der Mund kann sinnbildlich für Jesu Rede oder Lehre stehen; der Text selbst sagt jedoch nicht ausdrücklich „meine Worte trinken“.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich und ebenso ungewöhnlich: „Ich selbst werde er werden“ beziehungsweise „ich werde er sein“. Die Übersetzung bewahrt die wechselseitige Identifikation, ohne die Aussage näher zu erklären.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉⲧⲉⲣⲉⲛⲁⲥⲱ
  choice: wer … trinkt
  rationale: Die relative Futurkonstruktion hat hier allgemeinen, sprichwortartigen Sinn. Das deutsche indefinite Relativpronomen „wer“ gibt ihn natürlich wieder, ohne ein schwerfälliges zusätzliches Futur einzuführen.
- source_word: ⲥⲱ ⲉⲃⲟⲗ ϩⲛ ⲡⲁⲧⲁⲡⲣⲟ
  choice: aus meinem Mund trinkt
  rationale: ⲥⲱ bedeutet „trinken“; ⲉⲃⲟⲗ ϩⲛ bezeichnet die Quelle. Das konkrete Bild des Mundes bleibt erhalten und wird nicht deutend zu „meine Worte“ aufgelöst.
- source_word: ⲛ̄ⲧⲁϩⲉ / ⲛ ⲡⲁϩⲉ
  choice: wie ich
  rationale: Die Handschriftenform ⲛ̄ⲧⲁϩⲉ beruht auf ϩⲉ „Art, Weise“ und bedeutet idiomatisch „auf meine Weise / wie ich“. „Mir gleich“ oder „mein Ebenbild“ wäre stärker und würde den Ausdruck überdehnen.
- source_word: ϣⲱⲡⲉ
  choice: werden
  rationale: Das Verb bezeichnet hier ein Werden beziehungsweise Zu-etwas-Werden; die Wiederholung in beiden Satzhälften wahrt die auffällige Gegenseitigkeit.
- source_word: ⲁⲛⲟⲕ ϩⲱⲱ
  choice: auch ich selbst
  rationale: ϩⲱⲱ hebt das Pronomen hervor und kann zugleich den rückbezüglichen Anschluss ausdrücken. „Auch ich selbst“ bewahrt beides in natürlichem Deutsch.
- source_word: ⲁⲛⲟⲕⲛⲁϣⲱⲡⲉ ⲉⲣⲉⲛⲧⲟϥ ⲡⲉ
  choice: ich selbst werde zu ihm werden
  rationale: Die kompakte koptische Konstruktion formuliert eine zugespitzte wechselseitige Identifikation. Die deutsche Fassung bleibt bewusst ungewöhnlich, ist aber verständlicher als „ich werde er werden“ und deutet die Aussage nicht weiter aus.
- source_word: ⲡⲉⲧⲉⲣⲉϩⲱⲡ
  choice: das Verborgene
  rationale: Das substantivierte Relativgefüge bezeichnet kollektiv das, was verborgen ist. „Das Verborgene“ wahrt die im Koptischen nicht festgelegte Zahl.
- source_word: ⲟⲩⲱⲛϩ ⲉⲛⲧⲟϥ
  choice: wird sich ihm offenbaren
  rationale: ⲟⲩⲱⲛϩ bedeutet „erscheinen, offenbar werden“; die reflexive deutsche Wendung gibt das intransitive Sichtbarwerden wieder, während „ihm“ den Empfänger bezeichnet.
theological_decisions:
- issue: Art der Ähnlichkeit zwischen dem Trinkenden und Jesus
  choice: „wie ich“
  alternative: „mir gleich“ / „mein Gleicher“
  rationale: Die Übersetzung folgt dem Idiom „in meiner Art/Weise“ und behauptet keine ontologische Gleichheit, die der koptische Ausdruck nicht ausdrücklich festlegt.
- issue: Wechselseitiges Werden beziehungsweise Identifikation
  choice: „Auch ich selbst werde zu ihm werden“
  alternative: „Auch ich werde er sein“
  rationale: Die spannungsvolle Aussage wird nicht zu bloßer Gemeinschaft, Nachfolge oder Erkenntnis abgeschwächt. Zugleich wird keine systematische Deutung dieser Identifikation eingeführt.
- issue: Gegenstand der Offenbarung
  choice: „das Verborgene“
  alternative: „die verborgenen Dinge“
  rationale: Die kollektive, inhaltlich offene Formulierung lässt unbestimmt, was verborgen ist, und vermeidet eine zusätzliche esoterische oder dogmatische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache bleibt konkret; die auffällige Gegenseitigkeit des zweiten Satzes wird trotz ihrer Fremdheit nicht geglättet. „Das Verborgene“ hält Zahl und Inhalt bewusst offen.
