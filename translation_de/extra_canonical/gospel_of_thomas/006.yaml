base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/006.yaml
  text: 'His disciples questioned him and said to him[1], "Do you want us to fast? And how shall we pray? Shall we give alms? And what shall we observe concerning eating?"


    Jesus said, "Do not lie, and what you hate, do not do. For all things are revealed before heaven. For there is nothing hidden that will not be revealed[2], and nothing covered that will remain without being uncovered."'
translation:
  language: de
  text: 'Seine Jünger fragten ihn: »Willst du, dass wir fasten? Und wie sollen wir beten? Sollen wir Almosen geben? Und was sollen wir in Bezug auf das Essen beachten?«


    Jesus sagte: »Lügt nicht, und was ihr hasst, das tut nicht. Denn alles ist vor dem Himmel offenbar.[a] Es gibt nämlich nichts Verborgenes, das nicht offenbar werden wird, und nichts Verdecktes, das unaufgedeckt bleiben wird.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Fragment P.Oxy. 654 liest hier »vor der Wahrheit« (ἐνώπιον τῆς ἀληθείας) statt »vor dem Himmel«.
    reason: textual_variant
  - marker: b
    text: Das griechische Fragment P.Oxy. 654 liest »und nichts Begrabenes, das nicht auferweckt werden wird« (καὶ τεθαμμένον ὃ οὐκ ἐγερθήσεται) statt »und nichts Verdecktes, das unaufgedeckt bleiben wird«.
    reason: textual_variant
lexical_decisions:
- source_word: ⲣⲛⲏⲥⲧⲉⲩⲉ
  choice: fasten
  rationale: Das griechische Lehnverb bezeichnet eindeutig das religiöse Fasten.
- source_word: ⲉϣ ⲧⲉ ⲑⲉ
  choice: wie
  rationale: Die wörtliche Wendung »welches ist die Weise« ist im Koptischen eine gewöhnliche Frage nach dem Wie.
- source_word: ϭⲓⲛⲟⲩⲱⲙ
  choice: in Bezug auf das Essen
  rationale: Das nominale Kompositum kann den Vorgang des Essens, Nahrung oder Ernährungsweise bezeichnen. Die Formulierung bewahrt den sachbezogenen Charakter der Frage, ohne sie in einen temporalen Nebensatz umzudeuten.
- source_word: ϫⲉϭⲟⲗ
  choice: lügen
  rationale: Die Verbindung bedeutet wörtlich »eine Lüge sagen«; das knappe deutsche Verb erhält den spruchhaften Imperativ.
- source_word: ⲙⲡⲉⲙⲧⲟ ⲉⲃⲟⲗ
  choice: vor
  rationale: Die feste zusammengesetzte Präposition bedeutet »vor, in Gegenwart von«.
- source_word: ϩⲏⲡ / ϩⲟⲃⲥ
  choice: verborgen / verdeckt
  rationale: Die beiden unterschiedlichen koptischen Ausdrücke werden im Deutschen unterschieden, damit die Variation des Ausgangstextes sichtbar bleibt.
- source_word: ⲟⲩⲉϣⲛ ϭⲟⲗⲡϥ
  choice: unaufgedeckt
  rationale: Die privative Konstruktion bedeutet »ohne es aufzudecken«; im deutschen Zusammenhang ergibt sich idiomatisch »unaufgedeckt bleiben«.
theological_decisions:
- issue: Abweichung zwischen dem koptischen »verdeckt/aufgedeckt« und dem griechischen »begraben/auferweckt«
  choice: nichts Verdecktes, das unaufgedeckt bleiben wird
  alternative: nichts Begrabenes, das nicht auferweckt werden wird
  rationale: Der Haupttext folgt dem erhaltenen koptischen Zeugen und wahrt dessen Offenbarungsmetaphorik. Die stärker auf Auferstehung deutende griechische Lesart wird als echte Textvariante in der Fußnote dokumentiert.
- issue: Zeitbezug der Aussage über das Offenbarsein vor dem Himmel
  choice: alles ist vor dem Himmel offenbar
  alternative: alles wird vor dem Himmel offenbar werden
  rationale: Das koptische Verb in diesem Satz steht präsentisch. Die folgenden Relativsätze blicken dagegen in die Zukunft; dieser Spannungsbogen bleibt erhalten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, klar verständlichem Register. Die knappen Imperative und die parallelen Aussagesätze bewahren den aphoristischen Charakter. »Almosen geben« bleibt wegen des antiken religiösen Kontexts erhalten; »in Bezug auf das Essen« vermeidet sowohl eine künstliche Wörtlichkeit als auch die Einengung auf den Zeitpunkt des Essens.
