  source_fidelity: 'Der deutsche Text gibt die dreifach parallele koptische Aussage zuverlässig wieder: ϫⲓ/ϫⲉ ⲟⲩⲁ als „lästern“, die unpersönliche Pluralform von ⲕⲱ ⲉⲃⲟⲗ durch das deutsche Passiv, sowie die räumliche Paarung „auf Erden … im Himmel“. Besonders wichtig ist, dass „weder auf Erden noch im Himmel“ nicht zu einer zeitlich-eschatologischen Formulierung harmonisiert wird.'
  naturalness: Modernes, würdiges Standarddeutsch. Die Wiederholung der parallelen Satzglieder ist dem Quelltext angemessen. „Dem wird vergeben werden“ ist zwar etwas formell, aber idiomatisch und bewahrt den Zukunftsbezug des Koptischen.
  terminology: „Vater“, „Sohn“ und „Heiliger Geist“ entsprechen dem Wortlaut und dem etablierten deutschen religiösen Sprachgebrauch, ohne zusätzliche dogmatische Deutung. „Lästern“ trifft die idiomatische Bedeutung des koptischen Ausdrucks besser als ein unverbindliches „gegen jemanden reden“.
