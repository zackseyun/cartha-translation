base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/044.yaml
  text: Jesus said, "Whoever blasphemes against the Father will be forgiven, and whoever blasphemes against the Son will be forgiven. But whoever blasphemes against the Holy Spirit will not be forgiven, neither on earth nor in heaven."
translation:
  language: de
  text: 'Jesus sagte: »Wer den Vater lästert, dem wird vergeben werden; und wer den Sohn lästert, dem wird vergeben werden. Wer aber den Heiligen Geist lästert, dem wird nicht vergeben werden[a] – weder auf Erden noch im Himmel.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im Koptischen jeweils: „Sie werden ihm vergeben“ beziehungsweise „sie werden ihm nicht vergeben“. Die dritte Person Plural dient hier als unpersönliche Umschreibung des Passivs.'
    reason: register_note
lexical_decisions:
- source_word: ϫⲓⲟⲩⲁ
  choice: lästern
  rationale: Das koptische Verb bezeichnet das Lästern beziehungsweise Verfluchen. „Lästern“ gibt den religiösen Sinn im modernen Standarddeutsch prägnant wieder.
- source_word: ⲕⲱ ⲉⲃⲟⲗ
  choice: vergeben werden
  rationale: Die Wendung bedeutet hier „vergeben“. Die passive deutsche Form gibt die unpersönlich gebrauchte dritte Person Plural des Koptischen natürlich wieder.
- source_word: ⲡⲕⲁϩ
  choice: Erde
  rationale: In der kosmischen Gegenüberstellung mit dem Himmel ist „Erde“ die sachgemäße Entsprechung.
- source_word: ⲡⲡⲉ
  choice: Himmel
  rationale: „Himmel“ bewahrt die räumlich-kosmische Gegenüberstellung des koptischen Textes.
theological_decisions:
- issue: Räumliche gegenüber zeitlicher Aussage
  choice: weder auf Erden noch im Himmel
  alternative: weder in dieser Weltzeit noch in der kommenden
  rationale: Der koptische Text nennt ausdrücklich Erde und Himmel. Die abweichende zeitliche Formulierung der synoptischen Parallele darf nicht in den Text eingetragen werden.
- issue: Unvergebbarkeit der Lästerung gegen den Heiligen Geist
  choice: dem wird nicht vergeben werden
  alternative: kann keine Vergebung finden
  rationale: Die Übersetzung wahrt die kategorische Aussage des Ausgangstextes, ohne eine zusätzliche Erklärung über Möglichkeit, Zeitpunkt oder Ursache einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und der Gegensatz im letzten Satz bleiben erhalten. „Auf Erden“ ist idiomatisch und bewahrt zusammen mit „im Himmel“ die räumliche Aussage des Koptischen.
