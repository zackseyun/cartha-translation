base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/009.yaml
  text: 'Jesus said, "Behold, the sower went out; he filled his hand and cast seed. Some indeed fell on the path; the birds came and gathered them. Others fell on the rock, and they did not cast root down to the ground, and they did not send ears of grain up to the sky. And others fell on the thorns; they gathered them, choked the seed, and the worm ate them. And others fell on the good ground, and it gave good fruit up to the sky: it yielded sixty measures and one hundred twenty measures."'
translation:
  language: de
  text: 'Jesus sagte: „Seht, der Sämann ging hinaus. Er füllte seine Hand[a] und streute den Samen aus. Einiges fiel auf den Weg; die Vögel kamen und sammelten es ein.[b] Anderes fiel auf den Felsen. Es trieb keine Wurzel hinab in die Erde und ließ keine Ähre hinauf zum Himmel wachsen.[c] Wieder anderes fiel unter die Dornen; sie erstickten den Samen, und der Wurm fraß ihn.[d] Anderes aber fiel auf die gute Erde, und sie brachte gute Frucht hervor, hinauf zum Himmel: Es ergab sechzig auf ein Maß und hundertzwanzig auf ein Maß.“[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Füllen der Hand ist ein ausdrückliches Detail dieser Fassung des Gleichnisses.
    reason: textual_variant
  - marker: b
    text: Wörtlich „sammelten es“ oder „lasen es auf“; hier steht nicht das aus den synoptischen Fassungen vertraute „fraßen es auf“.
    reason: lexical_ambiguity
  - marker: c
    text: Wörtlich wird die Wurzel nach unten zur Erde und die Ähre nach oben zum Himmel beschrieben. Diese vertikale Bildsprache wird bewusst beibehalten.
    reason: textual_variant
  - marker: d
    text: Der Wurm als zusätzlicher Vernichter der Saat ist ein besonderes Detail dieser Fassung.
    reason: textual_variant
  - marker: e
    text: Der wiederholte koptische Ausdruck bezeichnet eine Maß- bzw. Ertragsrelation. „Sechzig auf ein Maß und hundertzwanzig auf ein Maß“ gibt sie verständlich wieder; die ungewöhnlichen Zahlen werden nicht an die synoptischen Fassungen angeglichen.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ⲕⲱⲧϥ
  choice: sammelten es ein
  rationale: Das Verb bezeichnet ein Sammeln oder Auflesen. Die Wiedergabe bewahrt den Unterschied zu dem in synoptischen Fassungen belegten „auffressen“ und klingt im Deutschen natürlich.
- source_word: ⲧⲉⲩⲉϩⲙⲥ
  choice: ließ keine Ähre … wachsen
  rationale: Die Verbindung bezeichnet das Hervorbringen beziehungsweise Emporsenden einer Ähre. Zusammen mit „hinauf zum Himmel“ bleibt das vertikale Bild des koptischen Textes erhalten.
- source_word: ⲱϭⲧ
  choice: erstickten
  rationale: Das Verb kann „ersticken“ oder „zerdrücken“ bedeuten; im Zusammenhang mit Dornen und Saat ist „ersticken“ die natürliche, ohne Harmonisierung mögliche Wiedergabe.
- source_word: ϥⲛⲧ
  choice: Wurm
  rationale: Die gewöhnliche Bedeutung ist „Wurm“. Das auffällige, in dieser Fassung eigene Bildelement wird unverändert bewahrt.
- source_word: ⲉⲥⲟⲧⲉ
  choice: je Maß
  rationale: Der Ausdruck verweist auf Maß beziehungsweise Ertrag. „Je Maß“ wahrt den Bezug auf ein Ausgangsmaß, ohne die Zahlen nach den synoptischen Fassungen zu harmonisieren.
theological_decisions:
- issue: Harmonisierung mit den synoptischen Fassungen des Sämannsgleichnisses
  choice: 'Die eigentümlichen Züge der Thomasfassung werden bewahrt: das Füllen der Hand, das Einsammeln durch die Vögel, die vertikale Wurzel- und Ährenbildlichkeit, der Wurm sowie der Ertrag von sechzig und hundertzwanzig je Maß.'
  alternative: An die kanonischen Fassungen angleichen, etwa „fraßen es auf“, „sechzigfach und hundertfach“ oder vertraute synoptische Satzformen verwenden.
  rationale: Der koptische Zeuge bietet eine eigenständige Fassung. Eine Angleichung würde echte textliche und möglicherweise theologische Spannungen verdecken.
- issue: Bezug des Pronomens beim guten Boden
  choice: „die gute Erde, und sie brachte … Frucht hervor“
  alternative: „der Same … brachte Frucht hervor“
  rationale: Das koptische maskuline Pronomen kann grammatisch auf „Boden/Erde“ zurückweisen; semantisch wäre auch der Same als Fruchtträger denkbar. Die Übersetzung folgt dem nächsten ausdrücklich genannten Bezugswort, ohne daraus eine besondere Lehre abzuleiten.
translation_notes:
  register: Moderne, würdige Standardsprache mit kurzen, mündlich gut verständlichen Sätzen. „Seht“ gibt den einleitenden Aufmerksamkeitsruf natürlich wieder. Das sachlich-konkrete Bildvokabular und die Wiederholung von „anderes“ bleiben erhalten; ungewohnte Thomas-Motive werden nicht durch vertraute kirchliche Formulierungen ersetzt.
