  source_fidelity: 'Die Übersetzung bewahrt die charakteristischen Motive der koptischen Thomasfassung: das Füllen der Hand, das Einsammeln durch die Vögel, die vertikale Bildlichkeit bei Wurzel und Ähre, den Wurm und die Ertragszahlen. Eine sichere Korrektur ist jedoch beim abschließenden Ertrag nötig: „je Maß“ ist im Deutschen missverständlich und klingt, als seien sechzig bzw. hundertzwanzig einzelne Maße gemeint. Die Konstruktion ist besser als Verhältnisangabe „auf ein Maß“ wiederzugeben.'
  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. „Sechzig auf ein Maß und hundertzwanzig auf ein Maß“ ist verständlicher und idiomatischer als „sechzig je Maß und hundertzwanzig je Maß“, ohne die ungewöhnliche Thomas-Zählung zu glätten.
  terminology: „Sämann“, „Samen“, „Ähre“, „Dornen“, „Wurm“ und „Frucht“ sind angemessen. „Felsen“ gibt ⲡⲉⲧⲣⲁ sachgerecht wieder. Die Fußnote zum Ertrag soll die Verhältnisangabe erläutern, nicht eine unnatürliche deutsche Formulierung als wörtlichen Text ausgeben.
  issues:
  - severity: medium
    issue: Die Ertragsformulierung „sechzig je Maß und hundertzwanzig je Maß“ ist im Deutschen semantisch und stilistisch missverständlich.
    rationale: Das wiederholte ⲉⲥⲟⲧⲉ bezeichnet eine Maß-/Ertragsrelation. „Auf ein Maß“ gibt diese Relation klarer wieder und erhält sowohl die Zahlen als auch die vom synoptischen Wortlaut abweichende Form.
  revised_text: 'Jesus sagte: „Seht, der Sämann ging hinaus. Er füllte seine Hand[a] und streute den Samen aus. Einiges fiel auf den Weg; die Vögel kamen und sammelten es ein.[b] Anderes fiel auf den Felsen. Es trieb keine Wurzel hinab in die Erde und ließ keine Ähre hinauf zum Himmel wachsen.[c] Wieder anderes fiel unter die Dornen; sie erstickten den Samen, und der Wurm fraß ihn.[d] Anderes aber fiel auf die gute Erde, und sie brachte gute Frucht hervor, hinauf zum Himmel: Es ergab sechzig auf ein Maß und hundertzwanzig auf ein Maß.“[e]'
  revised_footnotes:
  - marker: a
    text: Das Füllen der Hand ist ein ausdrückliches Detail dieser Fassung des Gleichnisses.
    reason: textual_variant
  - marker: b
    text: Wörtlich „sammelten es“ oder „lasen es auf“; hier steht nicht das aus den synoptischen Fassungen vertraute „fraßen es auf“.
    reason: lexical_ambiguity
  - marker: c
    text: Wörtlich wird die Wurzel nach unten zur Erde und die Ähre nach oben zum Himmel beschrieben. Diese vertikale Bildsprache wird bewusst beibehalten.
    reason: textual_variant
  - marker: d
    text: Der Wurm als zusätzlicher Vernichter der Saat ist ein besonderes Detail dieser Fassung.
    reason: textual_variant
  - marker: e
    text: Der wiederholte koptische Ausdruck bezeichnet eine Maß- bzw. Ertragsrelation. „Sechzig auf ein Maß und hundertzwanzig auf ein Maß“ gibt sie verständlich wieder; die ungewöhnlichen Zahlen werden nicht an die synoptischen Fassungen angeglichen.
    reason: lexical_ambiguity
  revision_rationale: Ausschließlich die missverständliche deutsche Wiedergabe der abschließenden Maß-/Ertragsrelation wurde präzisiert. Die Übersetzung wahrt die Coptische Bildfolge und die Thomas-spezifischen Abweichungen, ohne sie an synoptische Parallelen anzugleichen.
