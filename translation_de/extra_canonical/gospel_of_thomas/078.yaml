revisions:
- from: 'Jesus sagte: „Was seid ihr in die Wüste[a] hinausgegangen, um zu sehen? Ein Rohr, das vom Wind bewegt wird? Und einen Menschen in weicher Kleidung[b], dem Gewänder angelegt sind? Seht: Die in weicher Kleidung sind im Haus eures Königs und eures Würdenträgers[c][d][e], und sie können die Wahrheit nicht erkennen.[f]“'
  to: 'Jesus sagte: „Was seid ihr in die Wüste[a] hinausgegangen, um zu sehen? Ein Rohr, das vom Wind bewegt wird? Und einen Menschen in weicher Kleidung[b], der Gewänder trägt wie eure Könige und eure Würdenträger[c][d]? Diese tragen weiche Kleidung, und sie werden die Wahrheit nicht erkennen.[e]“'
  rationale: Eine sichere Korrektur ist erforderlich, weil der Entwurf den normalisierten koptischen Wortlaut an der zentralen Stelle mit einer nicht belegten Haus-Lesung verwechselt. Die Revision stellt ⲛⲡϩⲉ als Vergleich („wie“) wieder her, entfernt den unbelegten Imperativ und korrigiert die Pluralformen. Die beschädigte Textstelle wird durch eine präzise Fußnote transparent gemacht, ohne die Ergänzung über ihren Befund hinaus auszuweiten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:06:07Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung folgt dem ersten Teil im Wesentlichen, verfehlt aber den entscheidenden Abschnitt nach „Gewänder angelegt sind“. Der normalisierte koptische Text lautet dort ⲛⲡϩⲉ („in der Weise/wie“), nicht ⲛⲡⲏⲉ („im Haus“). Weder ein „Haus“ noch ein Imperativ „Seht“ stehen im überlieferten koptischen Text. Die vorhandene Fassung übernimmt hier einen Fehler der englischen Audit-Spur und erzeugt dadurch einen sachlich nicht belegten Hof-/Hausbezug.
  naturalness: „Und einen Menschen …“ ist als elliptische Fortführung der rhetorischen Frage verständlich, aber „Und einen Menschen in weicher Kleidung, der Gewänder trägt …?“ ist im Deutschen vollständiger und zugleich quellennah. „Dem Gewänder angelegt sind“ wirkt unnötig sperrig. Die revidierte Fassung bleibt knapp und spruchhaft, ist aber idiomatischer.
  terminology: „Wüste“, „Rohr“, „weiche Kleidung“, „Würdenträger“ und „die Wahrheit erkennen“ sind tragfähige moderne deutsche Wiedergaben. „Würdenträger“ gibt ⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ angemessen wieder. Die Pluralbezüge bei „Könige und Würdenträger“ sowie beim anschließenden Demonstrativum werden beibehalten.
  issues:
  - severity: high
    issue: „im Haus eures Königs und eures Würdenträgers“
    rationale: Der maßgebliche normalisierte Text hat ⲛⲡϩⲉ, „wie/in der Weise von“, nicht ⲛⲡⲏⲉ, „im Haus“. Die gegenwärtige Lesart und Fußnote c beruhen auf einer unzutreffenden Angabe der englischen Audit-Spur.
  - severity: high
    issue: Zusatz „Seht:“
    rationale: Im koptischen Text steht an dieser Stelle kein Entsprechungsausdruck zu „Seht“. Der Zusatz stützt offenbar die aus dem kanonischen Parallelwort bekannte, hier aber nicht bezeugte Haus-Lesart.
  - severity: medium
    issue: Singular „eures Königs und eures Würdenträgers“
    rationale: 'Der erhaltene bzw. normalisierte Text hat bei ⲡⲉⲧⲛⲣⲣⲟⲟⲩ und ⲡⲉⲧⲛⲙⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ Pluralformen: „eure Könige und eure Würdenträger“.'
  - severity: low
    issue: „dem Gewänder angelegt sind“
    rationale: Die Formulierung ist zwar konkret, im modernen Deutsch jedoch schwerfällig. „der Gewänder trägt“ gibt die Bekleidungsumschreibung natürlich wieder, ohne den Sinn zu verändern.
