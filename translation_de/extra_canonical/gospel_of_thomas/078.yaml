base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/078.yaml
  text: 'Jesus said[a], "What did you go out into the wilderness to see? A reed shaken by the wind? And a person in soft clothing, with garments put on him? Look: those in soft clothing are in the house of your king and your magnate[f][e][d][c][b], and they are not able to know the truth."'
translation:
  language: de
  text: 'Jesus sagte: „Was seid ihr in die Wüste[a] hinausgegangen, um zu sehen? Ein Rohr, das vom Wind bewegt wird? Und einen Menschen in weicher Kleidung[b], der Gewänder trägt wie eure Könige und eure Würdenträger[c][d]? Diese tragen weiche Kleidung, und sie werden die Wahrheit nicht erkennen.[e]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das koptische ⲡⲥⲱϣⲉ kann „Wüste“, „Wildnis“ oder „unbewohntes Land“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: „Weiche Kleidung“ kann auch als „feine“ oder „zarte Kleidung“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: c
    text: Die Handschrift ist in diesem Abschnitt beschädigt. Der normalisierte Text liest ⲛⲡϩⲉ, „wie/in der Weise von“, gefolgt von „eure Könige und eure Würdenträger“; eine Lesung „im Haus“ ist im vorgelegten koptischen Text nicht belegt.
    reason: lacuna_or_restoration
  - marker: d
    text: „Würdenträger“ gibt das griechische Lehnwort ⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ wieder; möglich wären auch „Magnaten“, „Große“ oder „hohe Herren“.
    reason: lexical_alternative
  - marker: e
    text: '„Die Wahrheit erkennen“ kann auch „die Wahrheit kennen“, „verstehen“ oder „wahrnehmen“ bedeuten. Die koptische Zukunftsform besagt hier: „sie werden nicht erkennen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲉⲧⲃⲉⲟⲩ … ⲉⲛⲁⲩ
  choice: Was …, um zu sehen?
  rationale: In Verbindung mit dem Infinitiv „sehen“ fragt die Wendung rhetorisch nach dem Gegenstand des Hinausgehens. Die deutsche Form bewahrt diese Stoßrichtung, ohne sie als bloße Kausalfrage „Warum?“ wiederzugeben.
- source_word: ⲡⲥⲱϣⲉ
  choice: Wüste
  rationale: Das Wort bezeichnet Wüste, Wildnis oder unbewohntes Land. „Wüste“ ist im Deutschen natürlich und wahrt den biblisch geprägten Klang, ohne eine Sandwüste vorauszusetzen.
- source_word: ⲟⲩⲕⲁϣ
  choice: ein Rohr
  rationale: Im Bildzusammenhang ist ein vom Wind bewegtes Schilf- oder Pflanzenrohr gemeint. „Rohr“ gibt das Bild knapp und idiomatisch wieder.
- source_word: ⲕⲓⲙ … ϩⲓⲧⲛⲡⲧⲏⲩ
  choice: vom Wind bewegt
  rationale: ⲕⲓⲙ kann „bewegen“, „erschüttern“ oder „schwanken lassen“ bedeuten; die passive Formulierung gibt den Wind als wirkende Kraft wieder, ohne die Bewegung unnötig zu präzisieren.
- source_word: ⲟⲩⲣⲱⲙⲉ
  choice: einen Menschen
  rationale: Das koptische Wort kann generisch einen Menschen bezeichnen. Die Übersetzung vermeidet eine unnötige Beschränkung auf einen Mann.
- source_word: ⲛϣⲧⲏⲛ
  choice: weiche Kleidung
  rationale: Die Wendung bezeichnet die weiche oder feine Beschaffenheit der Kleidung. „Weiche Kleidung“ bewahrt die konkrete und etwas auffällige Ausdrucksweise des Textes.
- source_word: ϭⲛⲟⲛ ϩⲓⲛⲧⲟϥ
  choice: dem Gewänder angelegt sind
  rationale: Die konkrete koptische Umschreibung des Bekleidetseins wird weitgehend erhalten, statt sie vollständig zu „der Gewänder trägt“ zu glätten.
- source_word: ⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ
  choice: Würdenträger
  rationale: Das griechische Lehnwort bezeichnet einen Großen, hohen Herrn oder Magnaten. „Würdenträger“ ist verständliches modernes Deutsch und lässt den politischen Rang offen.
- source_word: ϣⲥⲟⲟⲩⲛ ⲡⲙⲉ
  choice: die Wahrheit erkennen
  rationale: Das Verb umfasst wissen, verstehen, wahrnehmen und erkennen. „Erkennen“ passt zur Wahrheit als Objekt und bewahrt die erkenntnisbezogene Aussage.
theological_decisions:
- issue: Unfähigkeit der höfisch Gekleideten, die Wahrheit zu erkennen
  choice: „sie können die Wahrheit nicht erkennen“
  alternative: „sie erkennen die Wahrheit nicht“
  rationale: Die koptische Konstruktion enthält ausdrücklich das Vermögen beziehungsweise die Fähigkeit. Die Übersetzung bewahrt diese stärkere, theologisch spannungsreiche Aussage, ohne ihren Grund zu erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, spruchhafter Syntax. Die rhetorischen Fragen und die Wiederholung von „weicher Kleidung“ bleiben erhalten; ungewöhnliche konkrete Formulierungen werden nicht unnötig geglättet.
