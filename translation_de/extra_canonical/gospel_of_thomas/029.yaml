base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/029.yaml
  text: Jesus said[1], "If the flesh came into being because of the spirit, it is a wonder; but if the spirit came into being because of the body, it is a wonder of wonders[b][a][3][2]. Yet I myself marvel at how this great wealth has made its home in this poverty."
translation:
  language: de
  text: 'Jesus sagte: „Wenn das Fleisch wegen des Geistes[a] entstanden ist, ist das ein Wunder; wenn aber der Geist wegen des Körpers entstanden ist, ist das ein Wunder aller Wunder.[b] Doch ich selbst wundere mich darüber, wie[c] dieser große Reichtum in dieser Armut Wohnung genommen hat.[d]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „um des Geistes willen“. Die koptische Präposition kann neben dem Grund auch den Zweck oder Beweggrund bezeichnen; entsprechend auch im zweiten Satzteil.'
    reason: lexical_alternative
  - marker: b
    text: Das koptische Wort kann in anderen Zusammenhängen auch „Kind“ bedeuten. Hier bildet die Wendung „Wunder aller Wunder“ eine Steigerungsform.
    reason: lexical_alternative
  - marker: c
    text: Beim koptischen Wort für „wie“ ist der letzte Buchstabe in der Handschrift ergänzt.
    reason: lacuna_or_restoration
  - marker: d
    text: Das griechische Fragment POxy 1 bewahrt ebenfalls die Wendung „diese Armut“.
    reason: cross_reference
lexical_decisions:
- source_word: ϣⲱⲡⲉ
  choice: entstanden ist
  rationale: Das Verb bezeichnet hier das Ins-Dasein-Kommen, nicht notwendig eine körperliche Geburt. „Entstanden ist“ gibt dies im Deutschen knapp und natürlich wieder.
- source_word: ⲉⲧⲃⲉ
  choice: wegen
  rationale: Die Präposition drückt hier am ehesten einen Grund aus. „Wegen“ erhält außerdem den strengen Parallelismus der beiden Bedingungssätze.
- source_word: ⲥⲁⲣⲝ / ⲥⲱⲙⲁ
  choice: Fleisch / Körper
  rationale: Die zwei unterschiedlichen Lehnwörter werden verschieden wiedergegeben, damit der im Koptischen erkennbare Wechsel nicht eingeebnet wird.
- source_word: ⲡⲛⲉⲩⲙⲁ
  choice: Geist
  rationale: Die übliche und im Gegensatz zu Fleisch beziehungsweise Körper passende Wiedergabe.
- source_word: ⲟⲩϣⲡⲏⲣⲉ / ⲟⲩϣⲡⲏⲣⲉ ⲛϣⲡⲏⲣⲉ
  choice: ein Wunder / ein Wunder aller Wunder
  rationale: Die zweite Wendung ist eine steigernde Genitivformel. „Wunder aller Wunder“ bewahrt die rhetorische Steigerung in verständlichem, gehobenem Deutsch.
- source_word: ⲇⲉ
  choice: aber
  rationale: Die adversative Partikel im zweiten Bedingungssatz wird ausdrücklich wiedergegeben und markiert den Gegensatz zur ersten Möglichkeit.
- source_word: ⲁⲛⲟⲕ ϯⲣϣⲡⲏⲣⲉ
  choice: ich selbst wundere mich
  rationale: Das selbständige Pronomen hebt das Subjekt hervor; es ist keine Verdoppelung des Pronomens. „Ich selbst“ gibt diese Hervorhebung natürlich wieder.
- source_word: ⲡⲉⲓⲛⲟϭ ⲛⲙⲛⲧⲣⲙⲙⲁⲟ
  choice: dieser große Reichtum
  rationale: Die natürliche deutsche Formulierung vermittelt die qualitative Genitivverbindung und erhält den demonstrativen Bezug.
- source_word: ⲥⲟⲩⲱϩ
  choice: Wohnung genommen hat
  rationale: Das Verb bezeichnet Wohnen oder Sich-Niederlassen. Die Wendung bringt den Gedanken einer begründeten Bleibe zum Ausdruck und passt zum paradoxen Bild.
- source_word: ⲡⲉⲓⲙⲛⲧϩⲏⲕⲉ
  choice: dieser Armut
  rationale: Die direkte Wiedergabe erhält den scharfen Gegensatz zwischen Reichtum und Armut.
theological_decisions:
- issue: Verhältnis von Geist, Fleisch und Körper
  choice: Die beiden Entstehungsmöglichkeiten bleiben als echte Konditionalsätze nebeneinander stehen.
  alternative: Eine Möglichkeit als vom Sprecher bestätigte Schöpfungslehre oder als eindeutig verworfene Ansicht auszulegen.
  rationale: Der Text bewertet beide Vorstellungen als erstaunlich und löst die Spannung nicht lehrhaft auf; die Übersetzung sollte dies ebenfalls nicht tun.
- issue: Bedeutung von Reichtum und Armut
  choice: Die Bildwörter werden ohne erklärende Identifikation übersetzt.
  alternative: „Reichtum“ ausdrücklich mit Geist und „Armut“ ausdrücklich mit Körper oder Fleisch gleichzusetzen.
  rationale: Eine solche Deutung ist naheliegend, wird im Wortlaut aber nicht ausdrücklich vorgenommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Parallelstruktur. „Fleisch“, „Geist“, „Körper“, „Reichtum“ und „Armut“ bleiben als prägnante Bild- und Gegensatzwörter stehen. Die betonte Subjektform wird natürlich mit „ich selbst“ statt durch eine künstliche Wiederholung wiedergegeben.
