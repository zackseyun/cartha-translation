review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe folgt dem sahidisch-koptischen Text im Wesentlichen zuverlässig: das Zeigen eines Goldstücks, die Forderung nach der Steuer, die dreigliedrige Antwort und die abschließende, für Thomas charakteristische Selbstreferenz sind erhalten. Eine sichere Verbesserung ist jedoch angezeigt, weil die beiden mittleren Objektgruppen im Koptischen Pluralformen sind (»die Dinge des Kaisers/Gottes«). Die bisherige Relativformulierung neutralisiert den vom Text gegenüber dem abschließenden singularischen »was mir gehört« gesetzten Numerusunterschied im Haupttext.'
  naturalness: Der Text ist modernes, gut verständliches Standarddeutsch. »Gebt dem Kaiser die Dinge des Kaisers und Gott die Dinge Gottes« ist etwas formeller als die geläufige kanonische Formel, aber klar, idiomatisch vertretbar und dem prägnanten Parallelismus des Ausgangstextes angemessen.
  terminology: »Kaiser«, »Gott«, »Goldstück« und »Steuer« sind treffend. »Die Leute des Kaisers« lässt die im Koptischen nicht genauer bestimmte Zugehörigkeit beziehungsweise Funktion offen. Die letzte Aussage wird ohne theologische Auslegung als Anspruch Jesu wiedergegeben.
