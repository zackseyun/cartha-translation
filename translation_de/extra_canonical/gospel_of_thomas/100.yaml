    rationale: Der Text hat bei Kaiser und Gott pluralische possessive Nominalgruppen, während die letzte Aufforderung eine singularische Relativkonstruktion verwendet. Da diese grammatische Gegenüberstellung im Deutschen ohne unnatürliche Umschreibung wiedergegeben werden kann, sollte sie nicht nur in einer Fußnote stehen.
