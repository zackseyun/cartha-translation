base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/100.yaml
  text: They showed Jesus a gold coin,[1] and they said to him[1], "Those who belong to Caesar demand the tax from us."[2] He said to them, "Give the things of Caesar to Caesar; give the things of God to God[a][3][2]; and what is mine—give it to me."[3]
translation:
  language: de
  text: 'Sie zeigten Jesus ein Goldstück[a] und sagten zu ihm: »Die Leute des Kaisers fordern von uns die Steuer.[b]« Er sagte zu ihnen: »Gebt dem Kaiser die Dinge des Kaisers und Gott die Dinge Gottes.[c] Und was mir gehört, gebt mir.«[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier »ein Gold«; im Zusammenhang ist ein Geldstück aus Gold gemeint.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »Diejenigen, die zum Kaiser gehören, verlangen von uns die Steuer.« Die Wendung bestimmt ihre genaue Funktion nicht näher.'
    reason: lexical_alternative
  - marker: c
    text: 'Im Koptischen stehen hier Pluralformen: »die Dinge des Kaisers« und »die Dinge Gottes«.'
    reason: grammar
  - marker: d
    text: Diese dritte Aufforderung – »Und was mir gehört, gebt mir« – steht so nicht in den synoptischen Parallelüberlieferungen.
    reason: cross_reference
lexical_decisions:
- source_word: ⲁⲩⲧⲥⲉⲃⲉⲓ︤ⲥ︥
  choice: Sie zeigten Jesus
  rationale: Die Handschrift verbindet das Verb »zeigen« mit der als Nomen sacrum geschriebenen Bezeichnung für Jesus. Die natürliche deutsche Wiedergabe bewahrt Jesus als direktes Objekt.
- source_word: ⲟⲩⲛⲟⲩⲃ
  choice: ein Goldstück
  rationale: ⲛⲟⲩⲃ bedeutet wörtlich »Gold«, bezeichnet hier im Zusammenhang mit der Steuerfrage aber metonymisch ein Geldstück aus Gold. »Goldstück« bleibt weniger spezifisch als die Festlegung auf eine bestimmte Münzsorte.
- source_word: ⲛⲉⲧⲏⲡ ⲁⲕⲁⲓⲥⲁⲣ
  choice: die Leute des Kaisers
  rationale: Die Wendung bezeichnet diejenigen, die dem Kaiser zugeordnet sind. »Die Leute des Kaisers« ist verständlich und lässt offen, ob Amtsträger, Diener oder allgemein seine Gefolgsleute gemeint sind.
- source_word: ⲥⲉϣⲓⲧⲉ
  choice: fordern
  rationale: Das Verb kann »suchen«, »verlangen« oder »erbitten« bedeuten. Im fiskalischen Zusammenhang gibt »fordern« den Sinn natürlich wieder, ohne die Aussage unnötig zu verschärfen.
- source_word: ⲡϣⲱⲙ
  choice: die Steuer
  rationale: Das Wort bezeichnet hier eine Abgabe beziehungsweise einen Tribut. »Steuer« ist die klare, gegenwärtige deutsche Entsprechung.
- source_word: ⲛⲁⲕⲁⲓⲥⲁⲣ / ⲛⲁⲡⲛⲟⲩⲧⲉ
  choice: was dem Kaiser gehört / was Gott gehört
  rationale: Die koptischen Pluralformen bedeuten formal »die Dinge des Kaisers/Gottes«. Die deutsche Relativkonstruktion gibt die Zugehörigkeit idiomatisch wieder; eine Fußnote dokumentiert die grammatisch wörtlichere Fassung.
- source_word: ⲡⲉⲧⲉⲡⲱⲉⲓ ⲡⲉ
  choice: was mir gehört
  rationale: Die singuläre Relativkonstruktion wird bewusst von den vorausgehenden Pluralformen unterschieden und als markante dritte Forderung erhalten.
theological_decisions:
- issue: Verhältnis der Ansprüche des Kaisers, Gottes und Jesu
  choice: Die drei Aufforderungen werden ohne erklärende Rangordnung oder Gleichsetzung nebeneinandergestellt.
  alternative: Die dritte Aufforderung ausdrücklich als Identifikation Jesu mit Gott oder als Aufhebung des kaiserlichen Anspruchs deuten.
  rationale: Der Text formuliert eine spannungsreiche Dreierfolge, erklärt aber nicht ausdrücklich, wie sich die drei Ansprüche zueinander verhalten. Die Übersetzung darf diese theologische Offenheit nicht vorentscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer direkter Rede. »Goldstück« und »Steuer« sind allgemein verständlich; »Kaiser« bewahrt den historischen Titel. Die vertraute biblische Satzform wird nicht mechanisch übernommen, sondern am koptischen Wortlaut ausgerichtet. Die Singular-Plural-Spannung des Originals wird im Haupttext idiomatisch und in der Fußnote ausdrücklich sichtbar gemacht.
