revisions:
- from: 'Sie zeigten Jesus ein Goldstück[a] und sagten zu ihm: »Die Leute des Kaisers fordern von uns die Steuer.[b]« Er sagte zu ihnen: »Gebt dem Kaiser, was dem Kaiser gehört, und Gott, was Gott gehört.[c] Und was mir gehört, gebt mir.«[d]'
  to: 'Sie zeigten Jesus ein Goldstück[a] und sagten zu ihm: »Die Leute des Kaisers fordern von uns die Steuer.[b]« Er sagte zu ihnen: »Gebt dem Kaiser die Dinge des Kaisers und Gott die Dinge Gottes.[c] Und was mir gehört, gebt mir.«[d]'
  rationale: Die Revision übernimmt die pluralischen possessiven Nominalgruppen des koptischen Textes ausdrücklich in den Haupttext. Dadurch bleibt die grammatische Spannung zur abschließenden singularischen Formulierung »was mir gehört« sichtbar, ohne deren offene theologische Aussage auszudeuten. Alle übrigen Formulierungen und Fußnoten bleiben sachgerecht.
