base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/065.yaml
  text: He said[1], "A good man had a vineyard. He gave it to some farmers so that they would work it and he would receive its fruit from them. He sent his servant so that the farmers would give him the fruit of the vineyard. They seized his servant and beat him; they almost killed him. The servant went and told his master. His master said, 'Perhaps he did not know them.' He sent another servant[2]. The farmers beat the other one. Then the master sent his son. He said, 'Perhaps they will respect my son.' Those farmers, since they knew that he was the heir of the vineyard, seized him and killed him. Whoever has ears[3], let him hear."
translation:
  language: de
  text: 'Er sagte: „Ein guter[a] Mann besaß einen Weinberg. Er überließ ihn einigen Bauern, damit sie ihn bearbeiteten und er von ihnen seinen Ertrag erhielte. Er schickte seinen Sklaven, damit die Bauern ihm den Ertrag des Weinbergs gäben. Sie packten seinen Sklaven und schlugen ihn; beinahe[b] töteten sie ihn. Der Sklave ging und berichtete es seinem Herrn. Sein Herr sagte: ›Vielleicht kannte er sie nicht.‹[c] Er schickte einen anderen Sklaven. Die Bauern schlugen auch den anderen. Dann schickte der Herr seinen Sohn. Er sagte: ›Vielleicht werden sie meinen Sohn achten.‹ Da jene Bauern wussten, dass er der Erbe des Weinbergs war, packten sie ihn und töteten ihn. Wer Ohren hat, soll hören.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die teilweise beschädigte Handschrift bietet ⲛⲭⲣ̣ⲏ̣[ⲥⲧⲟ]ⲥ̣, gewöhnlich als griechisches Lehnwort χρηστός („gut“, „gütig“) ergänzt. Manche Forschende erwägen aufgrund des damaligen Gleichklangs eine Schreibung für χρήστης („Gläubiger“ oder „Geldverleiher“).
    reason: textual_variant
  - marker: b
    text: 'Wörtlich lautet die koptische Wendung ungefähr: „Es fehlte nur noch wenig, dass sie ihn töteten.“ Sie ist eine idiomatische Ausdrucksweise für „beinahe“.'
    reason: lexical_alternative
  - marker: c
    text: Die Handschrift lautet wörtlich „er kannte sie nicht“. Häufig wird zu „sie kannten ihn nicht“ verbessert, weil dies der erwarteten Logik des Gleichnisses entspricht. Die überlieferte Lesart kann jedoch bedeuten, dass der Herr annahm, sein Sklave habe nicht die richtigen Bauern gekannt.
    reason: textual_variant
lexical_decisions:
- source_word: ⲭⲣⲏⲥⲧⲟⲥ
  choice: gut
  rationale: Das koptische Lehnwort entspricht am unmittelbarsten dem griechischen χρηστός, „gut“ oder „gütig“. Die beschädigte Stelle und eine mögliche alternative griechische Deutung werden in Fußnote [a] offengelegt.
- source_word: ⲟⲩⲟⲉⲓⲉ
  choice: Bauern
  rationale: Bezeichnet landwirtschaftlich Arbeitende beziehungsweise Pächter. „Bauern“ ist im Deutschen verständlich und legt die genaue Rechtsform ihres Verhältnisses zum Besitzer nicht unnötig fest.
- source_word: ϩⲙϩⲁⲗ
  choice: Sklave
  rationale: Das Wort bezeichnet hier einen Unfreien; „Sklave“ vermeidet die beschönigende Wiedergabe „Diener“.
- source_word: ⲕⲉⲕⲟⲩⲉⲓ
  choice: beinahe
  rationale: Die Wendung bedeutet wörtlich ungefähr „es fehlte nur noch wenig, dass …“ und ist idiomatisch mit „beinahe“ wiederzugeben.
- source_word: ⲥⲟⲩⲱⲛ
  choice: kennen / wissen
  rationale: 'Je nach Konstruktion natürlich als „kennen“ oder „wissen“ wiedergegeben. In der auffälligen Aussage des Herrn bleibt die im Manuskript stehende Subjekt-Objekt-Beziehung erhalten: „er kannte sie nicht“.'
- source_word: ϣⲓⲡⲉ ϩⲏⲧ-
  choice: achten
  rationale: Die Wendung kann Scham, Scheu, Ehrfurcht oder Achtung vor jemandem ausdrücken. „Meinen Sohn achten“ ist natürlich und bewahrt den Sinn, ohne eine weitergehende Deutung einzutragen.
- source_word: ϭⲱⲡⲉ
  choice: packen
  rationale: Gibt das gewaltsame Ergreifen im Erzählzusammenhang anschaulich und gegenwartssprachlich wieder.
theological_decisions:
- issue: Angleichung an die synoptischen Fassungen des Gleichnisses
  choice: Die eigenständige koptische Fassung des Thomasevangeliums wird ohne Ergänzungen übersetzt.
  alternative: Details und Erzählablauf aus den synoptischen Parallelfassungen eintragen oder die ungewöhnliche Logik daran angleichen.
  rationale: Der vorliegende Text enthält weder Kelter noch Turm und bietet eine eigene Abfolge. Eine Harmonisierung würde nicht vorhandene allegorische Einzelheiten importieren.
- issue: Aussage „Vielleicht kannte er sie nicht“
  choice: Die überlieferte Subjekt-Objekt-Beziehung wird im Haupttext bewahrt.
  alternative: Zu „Vielleicht kannten sie ihn nicht“ emendieren.
  rationale: 'Die Manuskriptlesart ist ungewöhnlich, aber verständlich: Der Herr kann vermuten, der Sklave habe nicht die richtigen Bauern gekannt. Die Spannung darf nicht stillschweigend beseitigt werden.'
- issue: Bezeichnung des Sohnes als Erbe
  choice: Wörtlich und ohne christologische Erläuterung als „Erbe des Weinbergs“ wiedergegeben.
  alternative: Den Sohn ausdrücklich mit Jesus oder den Weinbergsbesitzer mit Gott identifizieren.
  rationale: Solche Identifikationen können zur Auslegung gehören, stehen jedoch nicht ausdrücklich im koptischen Wortlaut.
translation_notes:
  register: Modernes Standarddeutsch mit schlichter, würdiger Erzählweise. Die kurzen Hauptsätze folgen dem parabelhaften Stil des Koptischen. Konjunktivformen markieren Zweck und Erwartung, ohne altertümlich zu wirken; „Sklave“ wahrt die soziale Härte des Ausgangswortes.
