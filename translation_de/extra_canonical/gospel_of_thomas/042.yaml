translation:
  language: de
  text: 'Jesus sagte: »Werdet Vorübergehende.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Werdet zu solchen, die vorübergehen«; »Seid Durchreisende«; »Seid nicht von Dauer«. Das zugrunde liegende Verb ist ein griechisches Lehnwort mit der Bedeutung »vorübergehen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ϣⲱⲡⲉ
  choice: werdet
  rationale: Das Verb bedeutet gewöhnlich »werden, entstehen«. In dieser Konstruktion hat es auffordernde Kraft; die zweite Person Plural wird im Deutschen durch »werdet« wiedergegeben.
- source_word: ⲣⲡⲁⲣⲁⲅⲉ
  choice: Vorübergehende
  rationale: Das griechische Lehnverb bezeichnet das Vorübergehen. Die substantivierte Wiedergabe bewahrt die knappe, sentenzartige Form und kann sowohl das konkrete Vorbeiziehen als auch die weitergehende Vorstellung des Nichtverweilens offenhalten.
- source_word: ⲡⲉϫⲉ ⲓⲏⲥⲟⲩⲥ
  choice: Jesus sagte
  rationale: Schlichte, formelhafte Wiedergabe der koptischen Redeeinleitung.
theological_decisions:
- issue: Deutung des Vorübergehens
  choice: 'Die Aussage bleibt bildhaft und mehrdeutig: »Vorübergehende«.'
  alternative: »Reisende«, »Durchreisende« oder »seid vergänglich«.
  rationale: Der Ausgangstext erklärt nicht, ob räumliches Weiterziehen, innere Ungebundenheit oder Vergänglichkeit gemeint ist. Die Übersetzung legt keine bestimmte theologische Auslegung fest.
translation_notes:
  register: Sehr knappe, würdevolle und sentenzartige Form. »Vorübergehende« ist im modernen Standarddeutsch verständlich, klingt bewusst ungewöhnlich und erhält dadurch die Prägnanz und Offenheit des Originals.
