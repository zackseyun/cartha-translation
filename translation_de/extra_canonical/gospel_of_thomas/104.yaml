- from: 'Sie sagten zu Jesus: »Komm, lasst uns heute beten und fasten.« Jesus sagte: »Denn welche Sünde habe ich begangen, oder worin bin ich überwunden worden?[a] Wenn aber der Bräutigam aus dem Brautgemach herauskommt, dann sollen sie fasten und beten.«'
  to: 'Sie sagten zu Jesus: »Komm, lasst uns heute beten und fasten.« Jesus sagte: »Welche Sünde habe ich denn begangen, oder worin bin ich überwunden worden?[a] Wenn aber der Bräutigam aus dem Brautgemach herauskommt, dann sollen sie fasten und beten.«'
  rationale: 'Die einzige sichere Änderung ist stilistisch: Die Umstellung zu „Welche Sünde habe ich denn begangen?“ ist im Deutschen idiomatischer und bewahrt die interrogative Funktion sowie die Nuance von ⲅⲁⲣ. Die passive Wiedergabe von ϫⲣⲟ und die offene Präpositionalfrage „worin“ werden beibehalten, damit weder ein nicht genannter Gegner noch eine bestimmte Ursache ergänzt wird.'
