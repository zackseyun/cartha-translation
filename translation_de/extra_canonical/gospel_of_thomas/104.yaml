base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/104.yaml
  text: They said to Jesus[a], “Come, let us pray today, and let us fast.” Jesus said, “For what is the sin that I have committed, or in what have I been overcome? But when the bridegroom goes out from the bridal chamber, then let them fast[f][e][d][c][b], and let them pray.”
translation:
  language: de
  text: 'Sie sagten zu Jesus: »Komm, lasst uns heute beten und fasten.« Jesus sagte: »Welche Sünde habe ich denn begangen, oder worin bin ich überwunden worden?[a] Wenn aber der Bräutigam aus dem Brautgemach herauskommt, dann sollen sie fasten und beten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „überwunden“ wiedergegebene Verb kann je nach Zusammenhang auch „besiegt“, „überwältigt“ oder „bedrängt“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁⲙⲟⲩ
  choice: Komm
  rationale: Der Imperativ eröffnet eine knappe Einladung; „Komm“ gibt diese unmittelbar wieder.
- source_word: ⲛⲡϩⲟⲟⲩ
  choice: heute
  rationale: Wörtlich „der Tag“, hier idiomatisch als Zeitangabe „heute“.
- source_word: ⲛⲏⲥⲧⲉⲩⲉ
  choice: fasten
  rationale: Das griechische Lehnwort bezeichnet religiöses Fasten; „fasten“ ist die natürliche und genaue Entsprechung.
- source_word: ⲡⲛⲟⲃⲉ
  choice: Sünde
  rationale: Das Wort bezeichnet moralische Verfehlung; „Sünde“ wahrt den religiösen Gehalt der rhetorischen Frage.
- source_word: ⲟⲩ ⲅⲁⲣ ⲡⲉ ⲡⲛⲟⲃⲉ
  choice: Denn welche Sünde
  rationale: Die Konstruktion ist interrogativ. „Welche Sünde“ ergibt im Deutschen eine natürliche Frage und vermeidet, den Satz als Behauptung zu lesen.
- source_word: ϫⲣⲟ ⲉ-
  choice: überwunden werden
  rationale: Mit ⲉ- bezeichnet ϫⲣⲟ hier am ehesten das Besiegen oder Überwältigen. „Überwunden“ bewahrt den möglichen moralisch-geistlichen Sinn, ohne einen ausdrücklich nicht genannten Gegner einzufügen.
- source_word: ⲡⲛⲩⲙⲫⲓⲟⲥ
  choice: Bräutigam
  rationale: Das griechische Lehnwort bezeichnet den Bräutigam und erhält das Hochzeitsbild.
- source_word: ⲡⲛⲩⲙⲫⲱⲛ
  choice: Brautgemach
  rationale: „Brautgemach“ gibt das griechische Lehnwort νυμφών knapp wieder und bewahrt die Bildsprache.
- source_word: ⲙⲁⲣⲟⲩ-
  choice: dann sollen sie
  rationale: Die Form ist jussiv und fordert zum Handeln auf; sie bezeichnet nicht bloß ein zukünftiges Geschehen.
theological_decisions:
- issue: Grund des Fastens und Betens
  choice: Die Antwort bleibt als rhetorische Frage und anschließende zeitliche Anweisung stehen.
  alternative: Die Aussage als allgemeine Ablehnung von Gebet und Fasten oder als ausdrückliche Sündenlosigkeitslehre ausdeuten.
  rationale: Der Text verbindet die Praktiken mit dem Herauskommen des Bräutigams, erklärt aber weder die Identität des Bräutigams noch die umfassende theologische Bedeutung. Die Übersetzung fügt daher keine konfessionelle Deutung hinzu.
- issue: Bild vom Bräutigam und Brautgemach
  choice: Die Hochzeitsmetapher wird ohne erklärende Identifizierung beibehalten.
  alternative: Den Bräutigam ausdrücklich mit Jesus oder das Brautgemach mit einer bestimmten heilsgeschichtlichen Wirklichkeit gleichsetzen.
  rationale: Solche Identifizierungen sind mögliche Auslegungen, werden im Spruch selbst jedoch nicht ausdrücklich vorgenommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, spruchhafter Satzführung. Die direkte Rede bleibt schlicht; „Brautgemach“ erhält die altertümlich-biblische Bildwelt, ist aber noch allgemein verständlich.
