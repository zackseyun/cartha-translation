base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/031.yaml
  text: Jesus said[1], "No prophet is acceptable in his village[3][2]; a physician does not heal those who know him."
translation:
  language: de
  text: 'Jesus sagte: „Kein Prophet wird in seinem Dorf angenommen[a][c]; ein Arzt heilt diejenigen nicht, die ihn kennen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Fragment P.Oxy. 1 liest hier „in seiner Heimat“ beziehungsweise „in seiner Heimatstadt“ (πατρίδι) statt „in seinem Dorf“ und sagt, dass ein Arzt diejenigen nicht heilt, die ihn kennen.
    reason: textual_variant
  - marker: b
    text: Die Handschrift hat hier die regional geprägte Schreibung ⲙⲁⲣⲉ- für das sahidische ⲙⲉⲣⲉ-. Gemeint ist eine allgemeine Verneinung („heilt nicht“), keine Aufforderung („er soll heilen“).
    reason: dialect_note
  - marker: c
    text: 'Vgl. Lukas 4,24: „Kein Prophet ist in seiner Heimat willkommen.“ Thomas verbindet dieses Sprichwort mit dem Satz über den Arzt; in Lukas 4,23 steht unmittelbar zuvor das Sprichwort: „Arzt, heile dich selbst!“'
    reason: cross_reference
lexical_decisions:
- source_word: ⲙⲛⲡⲣⲟⲫⲏⲧⲏⲥ
  choice: Kein Prophet
  rationale: Die negative Existenzkonstruktion mit dem Substantiv drückt eine allgemeine Verneinung aus.
- source_word: 'ϣⲱⲡ (Handschrift: ϣⲏⲡ)'
  choice: wird … angenommen
  rationale: Die qualitative Form des Verbs „empfangen, annehmen“ bezeichnet hier das Angenommensein; die Formulierung entspricht zugleich dem griechischen δεκτός, ohne die Aussage auf bloßes Ansehen zu verengen.
- source_word: ϯⲙⲉ
  choice: Dorf
  rationale: Das koptische Wort bezeichnet ausdrücklich ein Dorf beziehungsweise eine kleinere Ortschaft. „Dorf“ bewahrt den Wortlaut des koptischen Hauptzeugen und harmonisiert ihn nicht mit dem griechischen Fragment.
- source_word: 'ⲥⲟⲓⲛ (Handschrift: ⲥⲟⲉⲓⲛ)'
  choice: Arzt
  rationale: Das Wort ist eine sahidisch-lykopolitanische Form von ⲥⲁⲉⲓⲛ und bezeichnet einen Arzt; es ist kein Hilfsverb.
- source_word: ⲣⲑⲉⲣⲁⲡⲉⲩⲉ
  choice: heilt
  rationale: Das griechische Lehnverb θεραπεύειν bezeichnet hier das ärztliche Heilen.
- source_word: ⲛⲡⲉⲧⲉⲣⲉⲥⲟⲟⲩⲛ ⲛⲛⲧⲟϥ
  choice: die …, die ihn kennen
  rationale: Die substantivierte Pluralform bezeichnet diejenigen, die mit dem Arzt bekannt sind beziehungsweise ihn kennen.
theological_decisions:
- issue: Harmonisierung mit den kanonischen Parallelen
  choice: Dorf
  alternative: Heimatstadt / Heimat
  rationale: Der koptische Haupttext hat ϯⲙⲉ („Dorf“). Die abweichende Lesart des griechischen Zeugen und die Nähe zu Lukas 4,24 werden in den Fußnoten genannt, aber nicht in den Text eingetragen.
- issue: Bedeutung von ϣⲏⲡ
  choice: wird … angenommen
  alternative: ist annehmbar / gilt etwas
  rationale: Die Übersetzung lässt den sozialen und wertenden Sinn des Angenommenseins stehen und vermeidet eine weitergehende theologische Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe, sprichwortartige Parallelismus des koptischen Textes bleibt erhalten. „Angenommen“ ist allgemein verständlich und wahrt die Nähe zur Quellensprache; „Dorf“ folgt bewusst dem koptischen Hauptzeugen.
