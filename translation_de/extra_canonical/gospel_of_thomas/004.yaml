revisions:
- from: 'Jesus sagte: „Ein alter Mensch wird in seinen Tagen nicht zögern, ein kleines, sieben Tage altes Kind nach dem Ort des Lebens zu fragen[a], und er wird leben. Denn viele Erste werden Letzte werden[b], und sie werden ein einziges Wesen werden[c].“'
  to: 'Jesus sagte: „Ein alter Mann wird in seinen Tagen nicht zögern, ein kleines, sieben Tage altes Kind nach dem Ort des Lebens zu fragen[a], und er wird leben. Denn viele Erste werden Letzte werden[b], und sie werden ein Einziges werden[c].“'
  rationale: Die Revision ersetzt nur zwei Stellen. „Ein alter Mann“ ist im modernen Standarddeutsch natürlicher und näher an der Personenbezeichnung der Quelle. „Ein Einziges werden“ hält die absichtlich knappe und theologisch offene Wendung ⲟⲩⲁ ⲟⲩⲱⲧ fest; insbesondere vermeidet sie den nicht im Text genannten Begriff „Wesen“. Die Fußnotenanker und die Variantendokumentation bleiben korrekt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:05:08Z'
