base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/004.yaml
  text: Jesus said[1], "An old man in his days will not hesitate to ask a small child seven days old about the place of life, and he will live. For many who are first will become last[3][2], and they will become a single one."
translation:
  language: de
  text: 'Jesus sagte: „Ein alter Mann wird in seinen Tagen nicht zögern, ein kleines, sieben Tage altes Kind nach dem Ort des Lebens zu fragen[a], und er wird leben. Denn viele Erste werden Letzte werden[b], und sie werden ein Einziges werden[c].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Koptischen klingen die Wörter für „zögern“ (ϫⲛⲁⲩ) und „fragen“ (ϫⲛⲉ) ähnlich; dieses Wortspiel lässt sich im Deutschen nicht nachbilden.
    reason: register_note
  - marker: b
    text: 'Der griechische Parallelzeuge POxy 654 fügt hinzu: „und die Letzten Erste“. Diese Worte fehlen im koptischen Text.'
    reason: textual_variant
  - marker: c
    text: Die Aussage, dass Erste Letzte werden, begegnet auch in Matthäus 19,30; Markus 10,31 und Lukas 13,30. Das Thomasevangelium schließt hier mit der eigenen Aussage über das Einswerden.
    reason: cross_reference
lexical_decisions:
- source_word: ϫⲛⲁⲩ
  choice: zögern
  rationale: Das Verb bedeutet hier „zögern“ bzw. „sich scheuen“; der griechische Parallelzeuge POxy 654 bestätigt dies mit ἀποκνήσει. „Sich schämen“ würde eine nicht ausdrücklich bezeichnete Schamsemantik eintragen.
- source_word: ϫⲛⲉ (zu ϫⲛⲟⲩ)
  choice: fragen
  rationale: Die Konstruktion bezeichnet das Fragen beziehungsweise Befragen des Kindes. „Fragen“ ist im Deutschen natürlich und wahrt den Bezug zur erbetenen Erkenntnis.
- source_word: ⲡⲧⲟⲡⲟⲥ ⲛⲡⲱⲛϩ
  choice: der Ort des Lebens
  rationale: Die formale Wendung bewahrt die bildhafte und theologisch offene Rede vom „Ort“ des Lebens, ohne sie als Reich, Ursprung oder Heilszustand auszudeuten.
- source_word: ⲟⲩⲁ ⲟⲩⲱⲧ
  choice: ein einziges Wesen
  rationale: Die Wendung bezeichnet ein einzelnes, geeintes Einssein. „Ein einziges Wesen“ ist im Deutschen grammatisch anschlussfähig und vermeidet die missverständliche Formulierung „ein Einziger“, die ausschließlich eine Personenzahl nahelegen könnte.
theological_decisions:
- issue: Bedeutung von ⲟⲩⲁ ⲟⲩⲱⲧ
  choice: ein einziges Wesen werden
  alternative: eins werden / ein Einziger werden
  rationale: Die Übersetzung hält die Aussage über Einheit oder Einzigkeit offen und macht daraus weder bloße Einigkeit noch ausdrücklich eine Verschmelzung von Personen.
- issue: Bezug des Pronomens in „sie werden“
  choice: Pronomen ohne erklärenden Zusatz beibehalten
  alternative: die Ersten und die Letzten werden eins
  rationale: Der koptische Text nennt den genauen Bezugsumfang nicht ausdrücklich. Eine erläuternde Identifikation würde die genuine Mehrdeutigkeit unnötig festlegen.
- issue: Auslassung der Umkehrformel im koptischen Text
  choice: Nur „viele Erste werden Letzte werden“ im Haupttext
  alternative: „und Letzte Erste“ aus POxy 654 ergänzen
  rationale: Die koptische Hauptquelle enthält die zweite Hälfte nicht. Der griechische Parallelzeuge wird deshalb als Textvariante in einer Fußnote dokumentiert, nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ein alter Mensch“ gibt die allgemeine Personenbezeichnung des Koptischen wieder; „in seinen Tagen“ bewahrt die auffällige Zeitangabe, ohne sie glättend als „hochbetagt“ umzudeuten. Die Syntax bleibt spruchhaft und knapp.
