base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/081.yaml
  text: Jesus said[a], "Whoever has become rich, let him be king; and whoever has power[c][b], let him renounce it."
translation:
  language: de
  text: 'Jesus sagte: „Wer reich geworden ist, soll König sein[a]; und wer Macht[b] hat, soll ihr entsagen[c].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das koptische Verb kann auch mit „soll herrschen“ oder „soll regieren“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: Das griechische Lehnwort ⲇⲩⲛⲁⲙⲓⲥ kann neben „Macht“ auch „Kraft“, „Stärke“ oder „Fähigkeit“ bedeuten, in manchen Zusammenhängen auch „Wunderkraft“.
    reason: lexical_alternative
  - marker: c
    text: Das Objekt von „entsagen“ wird im Koptischen nicht ausdrücklich genannt. „Ihr“ nimmt die unmittelbar zuvor genannte Macht auf.
    reason: implicit_object
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jesus sagte
  rationale: Die übliche deutsche Wiedergabe der koptischen narrativen Redeformel leitet den Ausspruch knapp und unmittelbar ein.
- source_word: ⲡⲉⲧⲉⲣⲉⲁⲛⲧⲟϥⲣⲣⲙⲙⲁⲟ
  choice: Wer reich geworden ist
  rationale: Die relative Perfektkonstruktion bezeichnet jemanden, der reich geworden ist; das Perfekt wird bewahrt und nicht zu einem bloßen gegenwärtigen Zustand eingeebnet.
- source_word: ⲙⲁⲣⲉⲛⲧⲟϥⲣⲣⲣⲟ
  choice: soll König sein
  rationale: ⲙⲁⲣⲉ- drückt Aufforderung beziehungsweise Jussiv aus; das von „König“ abgeleitete Verb kann „König sein“, „herrschen“ oder „regieren“ bedeuten. „König sein“ erhält die markante Bildsprache.
- source_word: ⲁⲩⲱ
  choice: und
  rationale: Der einfache Anschluss wahrt die knappe Parallelstruktur des Koptischen.
- source_word: ⲡⲉⲧⲉⲣⲉⲟⲩⲛⲧⲁⲛⲧⲟϥ ⲛⲟⲩⲇⲩⲛⲁⲙⲓⲥ
  choice: wer Macht hat
  rationale: Die koptische Besitzkonstruktion wird idiomatisch mit „hat“ wiedergegeben. Das griechische Lehnwort ⲇⲩⲛⲁⲙⲓⲥ besitzt ein breites Bedeutungsspektrum; „Macht“ bewahrt diese Offenheit am besten.
- source_word: ⲙⲁⲣⲉⲛⲧⲟϥⲁⲣⲛⲁ
  choice: soll ihr entsagen
  rationale: ⲁⲣⲛⲁ kann „verleugnen“, „sich lossagen“ oder „entsagen“ bedeuten. „Entsagen“ passt zu einer Sache wie Macht. Das im Koptischen unausgesprochene Objekt wird durch das Pronomen aufgenommen.
theological_decisions:
- issue: Verhältnis von Reichtum, Königtum und Machtverzicht
  choice: Die paradoxe Gegenüberstellung bleibt ohne erklärende Harmonisierung stehen.
  alternative: Den ersten Satzteil metaphorisch als geistliches Herrschen auslegen oder den zweiten allgemein als Selbstverleugnung deuten.
  rationale: Der koptische Wortlaut erklärt weder die Art des Königtums noch die Bedeutung der Macht näher. Eine theologische Auflösung würde über den Text hinausgehen.
- issue: Unausgesprochenes Objekt von ⲁⲣⲛⲁ
  choice: „ihr“ bezieht das Verb auf die unmittelbar zuvor genannte Macht.
  alternative: Das Verb ohne Objekt als „soll entsagen“ wiedergeben oder ein allgemeines „sich selbst verleugnen“ annehmen.
  rationale: Der unmittelbare syntaktische Bezug legt „Macht“ nahe, doch da das Objekt im Koptischen nicht ausdrücklich gesetzt ist, wird die Ergänzung in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, spruchhafter Syntax. Die ungewöhnliche Wendung „König sein“ ist bewusst beibehalten; die Pronomenform „ihr“ macht den wahrscheinlichen Bezug auf „Macht“ verständlich, ohne die implizite Ergänzung zu verschweigen.
