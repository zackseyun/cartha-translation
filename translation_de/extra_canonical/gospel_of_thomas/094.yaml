base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/094.yaml
  text: Jesus said[a], The one who seeks will find; the one who knocks to enter[c][b], it will be opened for him.
translation:
  language: de
  text: 'Jesus sagte[a]: »Wer sucht, wird finden; und wer anklopft, um hineinzugehen,[b] dem wird geöffnet werden.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die einleitenden Worte »Jesus sagte« sind in der Handschrift teilweise ergänzt; der normalisierte Text lautet ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ.
    reason: lacuna_or_restoration
  - marker: b
    text: »Anklopft, um hineinzugehen« gibt ⲧⲱϩⲙ mit der Richtungsangabe ⲉϩⲟⲩⲛ (»nach innen, hinein«) wieder. Eine Tür wird im Text nicht ausdrücklich genannt.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich kann die unpersönliche dritte Person Plural auch wiedergegeben werden: »Sie werden ihm (es) öffnen.«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jesus sagte
  rationale: ⲡⲉϫⲉ ist die übliche Einleitungsformel für eine Äußerung; zusammen mit dem Namen ⲓⲏⲥⲟⲩⲥ ergibt sich im Deutschen natürlich und knapp „Jesus sagte“.
- source_word: ⲡⲉⲧⲉⲣⲉϣⲓⲛⲉ ⲛⲧⲟϥⲛⲁϭⲓⲛⲉ
  choice: Wer sucht, wird finden
  rationale: Die Relativkonstruktion bezeichnet allgemein den Suchenden; ϣⲓⲛⲉ bedeutet „suchen“ und das Futur ⲛⲁϭⲓⲛⲉ „wird finden“. Die deutsche Wer-Konstruktion bewahrt den sprichwortartigen, allgemeinen Charakter.
- source_word: ⲡⲉⲧⲉⲣⲉⲧⲱϩⲙ ⲉϩⲟⲩⲛ
  choice: wer anklopft, um hineinzugehen
  rationale: ⲧⲱϩⲙ bezeichnet das Klopfen oder Anklopfen; ⲉϩⲟⲩⲛ gibt die Richtung nach innen an. Die Fassung bringt diese Bewegung zum Ausdruck, ohne eine im Text nicht genannte Tür einzufügen.
- source_word: ⲛⲧⲟⲟⲩⲛⲁⲟⲩⲱⲛ ⲛⲁⲛⲧⲟϥ
  choice: dem wird geöffnet werden
  rationale: Die dritte Person Plural kann unpersönlich mit passivischem Sinn gebraucht werden. „Dem wird geöffnet werden“ ist idiomatisches Deutsch, wahrt das Futur und ergänzt weder einen Handelnden noch einen ausdrücklich genannten Gegenstand.
theological_decisions: []
translation_notes:
  register: Knappes, würdiges und allgemein verständliches Standarddeutsch. Die parallele Wer-Konstruktion erhält den sentenzhaften Rhythmus; die Übersetzung vermeidet die Ergänzung einer nicht genannten Tür und lässt den unbestimmten Handelnden beim Öffnen offen.
