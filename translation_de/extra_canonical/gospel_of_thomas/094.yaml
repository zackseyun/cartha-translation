review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt die zwei generischen Relativkonstruktionen, die futurischen Prädikate und die unpersönliche dritte Person Plural im letzten Satzglied sachgerecht wieder. »Um hineinzugehen« erhält die Richtungsangabe ⲉϩⲟⲩⲛ, ohne eine im Koptischen nicht genannte Tür zu ergänzen. »Dem wird geöffnet werden« bildet den passivischen Sinn der unpersönlichen Pluralform angemessen ab und bewahrt die Unbestimmtheit sowohl des Handelnden als auch des nicht ausgedrückten Objekts.
  naturalness: Das Deutsch ist knapp, idiomatisch und in einem angemessen würdigen, aber modernen Standardregister gehalten. Die parallele Struktur »Wer …; und wer …« funktioniert als sentenzhafte Aussage gut. Die etwas formellere passive Zukunftsform ist hier wegen der Quelltextnähe vertretbar.
  terminology: »Jesus sagte«, »sucht«, »finden«, »anklopft« und »geöffnet werden« sind treffend und theologisch nicht überinterpretierend. Es werden keine zusätzlichen Begriffe wie »Tür« oder ein bestimmter öffnender Akteur eingeführt.
