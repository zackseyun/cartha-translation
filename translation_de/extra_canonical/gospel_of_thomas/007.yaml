base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/007.yaml
  text: Jesus said[a], “Blessed is this lion which the human will eat, so that the lion becomes human; and accursed is this human whom the lion will eat[d][c][b], and the lion will become human.”
translation:
  language: de
  text: 'Jesus sagte: „Selig[a] ist dieser Löwe, den der Mensch essen wird, sodass der Löwe zu einem Menschen wird[b]. Und abscheulich[c] ist dieser Mensch, den der Löwe essen wird; und der Löwe wird zu einem Menschen werden.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „glücklich“ beziehungsweise „begünstigt“. „Selig“ gibt den religiösen Klang des griechischen Lehnworts wieder.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „und der Löwe zu einem Menschen wird“. Die koptische Konjunktivkonstruktion kann eine Folge oder eine eng anschließende Fortsetzung ausdrücken.'
    reason: grammatical_ambiguity
  - marker: c
    text: 'Auch möglich: „verabscheut“ oder „verflucht“. Das koptische Wort bezeichnet etwas Abscheuliches oder Verabscheutes; „verflucht“ ist eine traditionelle, aber stärker interpretierende Wiedergabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: selig
  rationale: Das griechische Lehnwort μακάριος eröffnet einen Seligpreisungssatz. „Selig“ bewahrt dessen religiösen Klang, ohne den Ausdruck rein emotional auf „glücklich“ zu verengen.
- source_word: ⲡⲙⲟⲩⲓ / ⲡⲙⲟⲩⲉⲓ
  choice: der Löwe
  rationale: Dies ist die reguläre Bedeutung; die beiden Schreibweisen sind orthografische Varianten.
- source_word: ⲡⲁⲓ
  choice: dieser
  rationale: Das nachgestellte Demonstrativum wird ausdrücklich wiedergegeben und erhält die auffällige deiktische Betonung beider Satzhälften.
- source_word: ⲡⲣⲱⲙⲉ
  choice: der Mensch / ein Mensch
  rationale: ⲣⲱⲙⲉ bezeichnet hier generisch einen Menschen, nicht notwendig eine männliche Person. Im Subjekt steht daher „der Mensch“, im prädikativen Ausdruck idiomatisch „zu einem Menschen“.
- source_word: ⲛⲁⲟⲩⲱⲙⲛⲧⲟϥ
  choice: wird … essen
  rationale: Die Konstruktion mit ⲛⲁ- bezeichnet die Zukunft; das Objektpronomen verweist jeweils auf das vorangehende Bezugswort.
- source_word: ϣⲱⲡⲉ ⲛ/ⲣ ⲣⲱⲙⲉ
  choice: zu einem Menschen werden
  rationale: Die resultative Prädikation wird in natürlichem modernem Deutsch wiedergegeben. Der Wechsel zwischen ⲛ- und ⲣ- ist hier dialektal beziehungsweise orthografisch und verändert den Sinn nicht.
- source_word: ⲃⲱⲧⲉ
  choice: verabscheuenswert
  rationale: Das Wort bezeichnet etwas Verabscheutes oder Abscheuliches. „Verabscheuenswert“ bewahrt diese Bedeutung, ohne die im Ausgangswort nicht eindeutig ausgesagte Vorstellung eines ausgesprochenen Fluches festzuschreiben.
theological_decisions:
- issue: Deutung der Verwandlung von Löwe und Mensch
  choice: Die bildhafte Aussage bleibt ohne allegorische Erklärung stehen.
  alternative: Löwe und Essen ausdrücklich als geistliche, anthropologische oder kosmologische Symbole deuten.
  rationale: Der Spruch selbst erklärt seine Bilder nicht. Eine bestimmte Lehrdeutung würde die genuine Spannung des Textes unzulässig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die demonstrative Wiederholung („dieser Löwe“, „dieser Mensch“) und der harte Parallelismus des rätselhaften Spruchs bleiben erhalten. Die erste Verwandlung wird wegen der koptischen Konjunktivkonstruktion als Folge formuliert, während die zweite das selbstständige Futur des Ausgangstextes wiedergibt.
