  to: 'Jesus sagte: „Selig[a] ist dieser Löwe, den der Mensch essen wird, sodass der Löwe zu einem Menschen wird[b]. Und abscheulich[c] ist dieser Mensch, den der Löwe essen wird; und der Löwe wird zu einem Menschen werden.“'
  rationale: Die Revision beschränkt sich auf ⲃⲱⲧⲉ und die dazugehörige Fußnote. „Abscheulich“ ist quellentreuer als „verabscheuenswert“, ohne die umstrittene bzw. stärker zugespitzte Übersetzung „verflucht“ festzulegen. Der übrige Text bewahrt sowohl die demonstrative Wiederholung als auch den Unterschied zwischen der ersten konsekutiv/anschließend formulierten Verwandlung und dem abschließenden selbstständigen Futur.
