base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/073.yaml
  text: Jesus said[1], "The harvest indeed is plentiful, but the workers are few. Beseech the master, then[2], that he may send out workers to the harvest."
translation:
  language: de
  text: 'Jesus sagte: »Die Ernte ist zwar groß, aber es gibt nur wenige Arbeiter. Bittet daher den Herrn[a] inständig, Arbeiter zur Ernte[b] hinauszuschicken.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das koptische Wort kann sowohl „Herr“ als auch, im landwirtschaftlichen Zusammenhang, „Gutsherr“ oder „Hausherr“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Anders als die Parallelen in Matthäus 9,38 und Lukas 10,2 sagt Thomas nicht „Herr der Ernte“ und auch nicht „seine Ernte“.
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲱϩⲥ
  choice: Ernte
  rationale: Die übliche und im landwirtschaftlichen Bild natürliche Wiedergabe für das Ernten beziehungsweise die Ernte.
- source_word: ⲛⲁϣⲉⲛⲧⲟϥ
  choice: ist groß
  rationale: Die Wendung bezeichnet eine große beziehungsweise reiche Menge; „die Ernte ist groß“ ist präzise, natürlich und bewahrt die Bildsprache.
- source_word: ⲥⲟⲃⲕ
  choice: nur wenige
  rationale: Gibt den Gegensatz zur großen Ernte idiomatisch wieder; „nur“ verdeutlicht den bereits durch ⲇⲉ markierten Kontrast, ohne den Sinn zu verändern.
- source_word: ⲥⲟⲡⲥ
  choice: bittet … inständig
  rationale: Das Verb bedeutet bitten, anflehen oder inständig ersuchen. Diese Formulierung bewahrt den Nachdruck und klingt im heutigen Deutsch natürlicher als das altertümliche „flehet“.
- source_word: ⲡϫⲟⲉⲓⲥ
  choice: den Herrn
  rationale: „Herr“ bewahrt sowohl die gewöhnliche Bedeutung eines Verfügungsberechtigten als auch die mögliche religiöse Titelfunktion; die landwirtschaftlich konkrete Alternative „Gutsherrn“ wird in der Fußnote genannt.
- source_word: ⲛⲟⲩϫⲉ … ⲉⲃⲟⲗ
  choice: hinauszuschicken
  rationale: Die Verbindung bedeutet wörtlich etwa „hinauswerfen“, wird hier aber idiomatisch vom Aussenden der Arbeiter gebraucht. „Hinausschicken“ erhält die Richtungsbedeutung, ohne im Deutschen eine sachwidrige Gewaltsamkeit nahezulegen.
theological_decisions:
- issue: Bedeutung von ⲡϫⲟⲉⲓⲥ
  choice: Herr
  alternative: Gutsherr / Hausherr
  rationale: Der koptische Ausdruck kann ein theologischer Titel oder die Bezeichnung des Herrn eines landwirtschaftlichen Betriebs sein. „Herr“ lässt diese Spannung offen, während die Fußnote die konkrete Lesart sichtbar macht.
- issue: Beziehung des Herrn zur Ernte
  choice: Keine Ergänzung von „der Ernte“ oder „seiner“
  alternative: Herr der Ernte / zu seiner Ernte
  rationale: Der überlieferte Thomas-Text nennt lediglich „den Herrn“ und anschließend „zur Ernte“. Besitz- oder Zuordnungsangaben aus den synoptischen Parallelen werden daher nicht in den Haupttext eingefügt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die vertraute Bildsprache bleibt erhalten, doch die Formulierung folgt dem koptischen Wortlaut und ergänzt keine Wendungen aus den kanonischen Paralleltexten. „Inständig bitten“ gibt die Stärke des Verbs verständlich wieder; „Herr“ bewahrt die lexikalische und theologische Mehrdeutigkeit.
