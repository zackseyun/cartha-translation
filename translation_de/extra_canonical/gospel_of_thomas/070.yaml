base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/070.yaml
  text: Jesus said, “When you bring it forth within yourselves, this—what you have—will save you; otherwise, poverty is in you. This—what you do not have within yourselves, inside—will kill you.”
translation:
  language: de
  text: 'Jesus sagte: „Wenn ihr es in euch hervorbringt,[a] wird das, was ihr habt, euch retten.[b] Andernfalls[c] ist Armut in euch;[d] das, was ihr nicht in euch habt, in eurem Inneren,[f] wird euch töten.“[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Wendung bedeutet wörtlicher: „es in euch zum Entstehen bringen“.'
    reason: lexical_alternative
  - marker: b
    text: Das koptische Verb kann auch „befreien“ oder „bewahren“ bedeuten; der Gegensatz zu „töten“ spricht hier für „retten“.
    reason: lexical_alternative
  - marker: c
    text: Die koptische Partikel ⲡⲏ ist disjunktiv; möglich wären auch Wiedergaben wie „ansonsten“ oder „oder aber“.
    reason: alternative_reading
  - marker: d
    text: Wörtlich steht „Armut“. Der Ausdruck wurde nicht zu „Mangel“ abgeschwächt.
    reason: cultural_note
  - marker: e
    text: Im Manuskript sind Teile des Wortes „wird töten“ beschädigt; die Ergänzung ⲛⲁ- ist dem Sinn nach sicher.
    reason: lacuna_or_restoration
  - marker: f
    text: „In eurem Inneren“ gibt eine zusätzliche koptische Ortsangabe wieder und bewahrt so die doppelte Betonung des Inneren.
    reason: dialect_note
lexical_decisions:
- source_word: ϩⲟⲧⲁⲛ
  choice: wenn
  rationale: Die temporale Subjunktion bezeichnet hier eine allgemeine Bedingung; „wenn“ bewahrt die knappe Formulierung.
- source_word: ⲉⲣϣⲁⲛ_ⲛⲧⲟⲟⲩϫⲡⲟⲡⲏ
  choice: hervorbringen
  rationale: Die periphrastisch-kausative Wendung bedeutet wörtlicher, etwas zum Entstehen zu bringen; „hervorbringen“ ist im Deutschen natürlich und wahrt die Bildhaftigkeit.
- source_word: ϩⲛⲛⲧⲱⲧⲛ
  choice: in euch
  rationale: Der Kontext betont Innerlichkeit. „In euch“ ist klarer und natürlicher als „in euch selbst“, ohne die lokale Bedeutung abzuschwächen.
- source_word: ⲡⲁⲓ
  choice: das
  rationale: Das Demonstrativum verweist knapp auf das zuvor Genannte; im deutschen Satzbau ist „das“ die natürliche Entsprechung.
- source_word: ⲉⲧⲉⲣⲉⲟⲩⲛⲧⲁⲛⲧⲱⲧⲛⲛⲧⲟϥ
  choice: was ihr habt
  rationale: Die Existenzkonstruktion mit Dativ drückt Besitz aus und wird idiomatisch mit „haben“ wiedergegeben.
- source_word: ⲧⲟⲩϫⲟⲛ
  choice: retten
  rationale: Die Gegenüberstellung mit „töten“ legt die starke Bedeutung „retten“ nahe, ohne den Gegenstand der Rettung näher festzulegen.
- source_word: ⲡⲏ
  choice: wenn … aber
  rationale: Die disjunktive beziehungsweise kontrastierende Funktion wird in natürlichem Deutsch durch einen adversativen Bedingungssatz ausgedrückt; die genaue Partikelfunktion bleibt in einer Fußnote kenntlich.
- source_word: ⲙⲛⲧⲁⲁⲛⲟⲛ
  choice: Armut
  rationale: Die konkrete und befremdliche Ausdrucksweise des koptischen Textes bleibt erhalten; „Mangel“ wäre bereits deutender.
- source_word: ϩⲛⲧⲏⲛⲉ
  choice: in eurem Inneren
  rationale: Die ausdrückliche zweite Bezeichnung des Innenraums wird bewahrt, statt sie als scheinbare Wiederholung zu glätten.
- source_word: ⲙⲟⲩⲟⲩⲧ
  choice: töten
  rationale: Das Kausativ von „sterben“ wird direkt wiedergegeben und erhält den scharfen Gegensatz zu „retten“.
theological_decisions:
- issue: Unbestimmter Gegenstand dessen, was hervorgebracht und besessen wird
  choice: Das neutrale „das, was“ bleibt ohne inhaltliche Identifizierung stehen.
  alternative: Den Gegenstand als Licht, Erkenntnis, Gottesreich oder wahres Selbst bestimmen.
  rationale: Der koptische Text benennt den Bezug nicht ausdrücklich. Eine nähere Bestimmung würde eine theologische Auslegung in die Übersetzung eintragen.
- issue: Bedeutung von Rettung und Tötung
  choice: Die starken Verben „retten“ und „töten“ werden ohne Erklärung des geistlichen oder körperlichen Sinnes bewahrt.
  alternative: Als geistliche Erlösung beziehungsweise inneren Untergang paraphrasieren.
  rationale: Der Spruch hält Art und Bereich von Rettung und Tod offen; diese Spannung darf nicht aufgelöst werden.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper, spruchhafter Satzführung. Die ungewöhnliche Logik des Originals wird nicht durch eine eindeutige Auslegung geglättet. Sämtliche Fußnotenmarker stehen unmittelbar an den einschlägigen Textstellen.
