  to: 'Jesus sagte: „Wenn ihr es in euch hervorbringt,[a] wird das, was ihr habt, euch retten.[b] Andernfalls[c] ist Armut in euch;[d] das, was ihr nicht in euch habt, in eurem Inneren,[f] wird euch töten.“[e]'
  rationale: 'Die Revision stellt die alternative Satzfolge des koptischen Textes wieder her: auf die Bedingung und ihre Folge folgt „andernfalls ist Armut in euch“, danach ein neuer demonstrativer Satz über das, was nicht in ihnen ist. Sie entfernt zugleich die nicht ausdrücklich im Ausgangstext enthaltene Aussage, der hervorzubringende Gegenstand sei bereits „in euch“, ohne die absichtlich offene Referenz aufzulösen.'
