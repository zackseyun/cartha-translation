base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/082.yaml
  text: Jesus said[a], “The one who is near me is near the fire[c][b], and the one who is far from me is far from the kingdom.”
translation:
  language: de
  text: 'Jesus sagte: „Wer mir nahe ist, ist dem Feuer nahe; und wer fern von mir ist, ist fern vom Reich[a].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das koptische Wort kann auch „Königsherrschaft“ oder „Königtum“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ϩⲏⲛ
  choice: nahe sein
  rationale: Die stative Form bezeichnet räumliche oder bildhafte Nähe, nicht ausdrücklich eine Bewegung. „Nahe sein“ erhält zudem den knappen Parallelismus.
- source_word: ⲉⲣⲟⲓ / ⲙ̄ⲙⲟⲓ
  choice: mir / von mir
  rationale: Die Präpositionalformen bezeichnen im ersten Glied die Beziehung auf Jesus und im zweiten die Entfernung von ihm. Idiomatisches Deutsch verlangt bei „nahe“ den Dativ, während „fern von“ die Weg-von-Richtung bewahrt.
- source_word: ⲥⲁⲧⲉ
  choice: das Feuer
  rationale: „Feuer“ ist die grundlegende, nicht weiter spezifizierte Bedeutung und bewahrt das schroffe Bild des Spruchs.
- source_word: ⲟⲩⲏⲩ
  choice: fern sein
  rationale: „Fern“ bildet den natürlichen und prägnanten Gegensatz zu „nahe“.
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: das Reich
  rationale: Das koptische Wort kann Reich, Königsherrschaft oder Königtum bezeichnen. „Reich“ ist im Deutschen knapp und in diesem traditionsgeschichtlichen Kontext geläufig, ohne die begriffliche Mehrdeutigkeit im Haupttext auszuschreiben.
- source_word: ⲡⲉⲧ-
  choice: wer
  rationale: Die generische Relativkonstruktion wird im modernen Deutsch natürlich mit „wer …“ wiedergegeben und erhält den aphoristischen Ton.
theological_decisions:
- issue: Beziehung zwischen Jesus, Feuer und Reich
  choice: Die beiden Aussagen bleiben ohne erklärende Deutung parallel nebeneinander stehen.
  alternative: Das Feuer ausdrücklich als Gericht, Läuterung, göttliche Gegenwart oder Jesus selbst deuten.
  rationale: Der koptische Text erklärt das Feuerbild nicht. Eine eindeutige theologische Identifikation würde die genuine Spannung des Spruchs auflösen.
- issue: Bedeutung von ⲙⲛⲧⲣⲣⲟ
  choice: „Reich“ im Haupttext mit einer lexikalischen Fußnote
  alternative: „Königsherrschaft“, „Herrschaft“ oder „Königtum“ direkt im Haupttext
  rationale: „Reich“ wahrt die prägnante Sprache; die Fußnote hält offen, dass das Wort sowohl einen Bereich als auch das Königsein beziehungsweise königliche Herrschaft bezeichnen kann.
translation_notes:
  register: Knappes, würdiges und gegenwärtiges Standarddeutsch. Die symmetrische Satzstruktur und der Gegensatz „nahe/fern“ werden bewahrt. Auf eine zusätzliche textkritische Fußnote zur Normalisierung der Pronomina und zum wechselnden Artikel wird verzichtet, da sie die Übersetzung dieses Spruchs inhaltlich nicht verändert; ebenso wird kein bloßer thematischer Querverweis in den Textapparat aufgenommen.
