review_pass:
  verdict: approve
  source_fidelity: 'Der deutsche Text gibt die zwei parallelen koptischen Relativsätze sachgerecht wieder: Nähe zu Jesus entspricht Nähe zum Feuer, Ferne von Jesus Ferne vom Reich. „Mir nahe“ ist eine natürliche deutsche Wiedergabe von ⲉⲣⲟⲓ, und „fern von mir“ wahrt die Gegenrichtung von ⲙ̄ⲙⲟⲓ. Die unbestimmte Deutung des Feuers bleibt unangetastet.'
  naturalness: '„Jesus sagte: ‚Wer mir nahe ist, ist dem Feuer nahe; und wer fern von mir ist, ist fern vom Reich.‘“ ist knappes, idiomatisches modernes Standarddeutsch und bewahrt den aphoristischen Parallelismus. Die Wiederholung von „nahe“ und „fern“ ist stilistisch und semantisch angemessen.'
  terminology: „Feuer“ entspricht ⲥⲁⲧⲉ ohne Überbestimmung. „Reich“ ist für ⲙⲛⲧⲣⲣⲟ eine etablierte und hier passende knappe Wiedergabe; die Fußnote nennt mit „Königsherrschaft“ und „Königtum“ relevante Bedeutungsalternativen. Die Kleinschreibung vermeidet zusätzliche dogmatische Festlegung.
