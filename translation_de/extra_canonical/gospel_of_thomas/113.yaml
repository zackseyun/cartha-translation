revisions:
- from: 'Seine Jünger fragten ihn: „An welchem Tag wird die Königsherrschaft[a] kommen?“


    [Er sagte:][b] „Sie kommt nicht so, dass man sie beobachten könnte. Man wird nicht sagen: ‚Seht, hier!‘ oder: ‚Seht, dort!‘[c] Vielmehr ist die Königsherrschaft des Vaters über die Erde[d] ausgebreitet, und die Menschen sehen sie nicht.“'
  to: 'Seine Jünger fragten ihn: „An welchem Tag wird die Königsherrschaft[a] kommen?“


    [Er sagte:][b] „Sie wird nicht auf eine Weise kommen, die man beobachten kann. Man wird nicht sagen: ‚Seht, hier!‘ oder: ‚Seht, dort!‘[c] Vielmehr ist die Königsherrschaft des Vaters auf der Erde[d] ausgebreitet, und die Menschen sehen sie nicht.“'
  rationale: 'Die Revision ist auf zwei sichere sprachlich-quellenbezogene Korrekturen beschränkt: Der Zukunftsbezug des Verbs „kommen“ wird ausdrücklich wiedergegeben, und die räumliche Aussage wird mit „auf der Erde“ eindeutig formuliert. Alle textkritischen Vorbehalte und die Kennzeichnung der nicht im koptischen Text stehenden Sprecherformel bleiben erhalten.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:06:17Z'
review_pass:
  verdict: revise
  source_fidelity: Die Grundübersetzung gibt Frage, zukünftiges Kommen, fehlende beobachtbare Anzeichen, die deiktische Formel, die bereits ausgebreitete Königsherrschaft und das Nichtsehen durch die Menschen zutreffend wieder. Die Formulierung „Sie kommt nicht so, dass man sie beobachten könnte“ schwächt jedoch das im koptischen und englischen Audit Trail ausdrücklich zukunftsbezogene „wird nicht kommen“ ab. Außerdem ist „über die Erde ausgebreitet“ im Deutschen potenziell als oberhalb der Erde lesbar, während ϩⲓϫⲛ ⲡⲕⲁϩ die Ausbreitung auf/über die Erdoberfläche bezeichnet.
  naturalness: Die direkte Rede und die Terminologie sind gut verständlich und würdig. „Sie wird nicht auf eine Weise kommen, die man beobachten kann“ ist idiomatisch, bewahrt den Zukunftsbezug und vermeidet eine unnötig hypothetische Wendung. „auf der Erde ausgebreitet“ ist eindeutig und natürlich.
  terminology: „Königsherrschaft“ ist für ⲡⲙⲛⲧⲣⲣⲟ eine sachgerechte Wiedergabe der abstrakten Herrschafts-/Regierungsnuance. Die Fußnoten zu „Reich“, zur ergänzten Sprecherangabe, zur Lesart „dort/Himmel“ und zu „Erde/Land“ sind angemessen. Die strittige Lesart wird nicht verschwiegen.
  issues:
  - severity: medium
    issue: Zukunftsbezug bei der Art des Kommens abgeschwächt
    rationale: ⲉⲥⲛ̄ⲛⲏⲩ ⲁⲛ und der englische Audit Trail („will not come“) beziehen sich auf das künftige Kommen. Das präsentische „kommt nicht“ kann im Deutschen allgemein-zeitlos verstanden werden; die Konjunktiv-II-Form „könnte“ fügt zudem eine nicht erforderliche Hypothese hinzu.
  - severity: low
    issue: Räumliche Präposition potenziell missverständlich
    rationale: „über die Erde ausgebreitet“ kann im Deutschen auch eine Lage oberhalb der Erde bezeichnen. „auf der Erde ausgebreitet“ gibt die konkrete räumliche Aussage klarer wieder, ohne die Bildlichkeit zu verändern.
