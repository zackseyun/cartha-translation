base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/113.yaml
  text: 'His disciples said to him[1], "On what day will the kingship[1] come?"


    [He said], "It will not come by watching. They will not say, ‘Look, here!’ or ‘Look, there![2]’ Rather, the Father’s kingship is spread out upon the earth[3][a][3][2], and people do not see it."'
translation:
  language: de
  text: 'Seine Jünger fragten ihn: „An welchem Tag wird die Königsherrschaft[a] kommen?“


    [Er sagte:][b] „Sie wird nicht auf eine Weise kommen, die man beobachten kann. Man wird nicht sagen: ‚Seht, hier!‘ oder: ‚Seht, dort!‘[c] Vielmehr ist die Königsherrschaft des Vaters auf der Erde[d] ausgebreitet, und die Menschen sehen sie nicht.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Königreich“ oder „Reich“. Das koptische Wort betont hier die königliche Herrschaft beziehungsweise das Regieren.'
    reason: lexical_alternative
  - marker: b
    text: Die Worte „Er sagte“ stehen nicht im erhaltenen koptischen Text, sind aber als Sprecherangabe aus dem Zusammenhang ergänzt.
    reason: source_omission
  - marker: c
    text: Die Handschriftenzeile liest „dort“. In der normalisierten Textfassung steht dagegen ein ähnlich geschriebenes Wort für „Himmel“. Die Paarung „hier/dort“ passt zum unmittelbaren Satzbau.
    reason: textual_variant
  - marker: d
    text: Das koptische Wort kann sowohl „Erde“ als auch „Land“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: Königsherrschaft
  rationale: Die abstrakte Bildung bezeichnet Herrschaft oder königliches Regieren, nicht notwendig ein räumlich verstandenes Reich. „Königsherrschaft“ bewahrt diese Nuance.
- source_word: ⲛⲁϣ ⲛϩⲟⲟⲩ
  choice: an welchem Tag
  rationale: Gibt die wörtliche Frage nach dem Tag wieder, statt sie zum allgemeineren „wann“ zu glätten.
- source_word: ϭⲱϣⲧ ⲉⲃⲟⲗ
  choice: so, dass man sie beobachten könnte
  rationale: Bewahrt den Gedanken äußerer Beobachtung, klingt im modernen Deutschen jedoch natürlicher als eine substantivische Formulierung.
- source_word: ⲉⲓⲥϩⲏⲏⲧⲉ
  choice: Seht
  rationale: Gibt den knappen auffordernden und hinweisenden Charakter idiomatisch wieder.
- source_word: ⲡⲓⲥⲁ
  choice: hier
  rationale: Das wörtliche „der Ort“ fungiert in dieser Hinweisformel deiktisch als „hier“.
- source_word: ⲧⲏ / ⲡⲏ
  choice: dort
  rationale: Die Handschriftenzeile bietet ⲧⲏ „dort“ und ergibt die natürliche Paarung „hier/dort“; die normalisierte Fassung liest ⲡⲏ „Himmel“.
- source_word: ⲥⲡⲱⲣϣ ⲉⲃⲟⲗ
  choice: ist … ausgebreitet
  rationale: Der präsentisch-stative Ausdruck beschreibt eine bereits bestehende, weit verbreitete Wirklichkeit, ohne ausdrücklich einen Handelnden zu nennen.
- source_word: ϩⲓϫⲛ ⲡⲕⲁϩ
  choice: über die Erde
  rationale: Bewahrt das räumliche Bild; ⲡⲕⲁϩ kann je nach Zusammenhang auch „Land“ bedeuten.
- source_word: ⲛⲣⲱⲙⲉ
  choice: die Menschen
  rationale: Der generische Plural wird inklusiv und ohne geschlechtliche Verengung wiedergegeben.
theological_decisions:
- issue: Gegenwärtigkeit der Königsherrschaft
  choice: „ist … ausgebreitet“
  alternative: „wird … ausgebreitet werden“
  rationale: Die koptische Aussage stellt die Königsherrschaft als gegenwärtig über die Erde ausgebreitet dar. Die Übersetzung bewahrt die Spannung zwischen der Frage nach ihrem Kommen und ihrer bereits bestehenden, aber ungesehenen Gegenwart.
- issue: Räumliches Reich oder wirksame Herrschaft
  choice: „Königsherrschaft“
  alternative: „Königreich“ oder „Reich“
  rationale: Die abstrakte Bedeutung des koptischen Ausdrucks wird gewahrt, ohne die Aussage auf ein Territorium festzulegen oder eine bestimmte konfessionelle Reich-Gottes-Lehre einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer direkter Rede. Die ungewöhnliche Frage „An welchem Tag“ bleibt wegen ihrer quellensprachlichen Form erhalten. Die ergänzte Sprecherformel wird durch eckige Klammern kenntlich gemacht; die Spannung zwischen künftigem Kommen und schon gegenwärtiger, ungesehener Herrschaft wird nicht aufgelöst.
