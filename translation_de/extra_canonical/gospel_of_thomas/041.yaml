base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/041.yaml
  text: Jesus said[a], “Whoever has something in his hand, they will give to him; and whoever does not have[f][e][d][c][b], they will take even the little that he has from him.”
translation:
  language: de
  text: 'Jesus sagte: „Wer etwas in seiner Hand hat,[a] dem wird man geben; wer aber nichts hat, dem wird man selbst das Wenige, das er hat, wegnehmen.“[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die koptische Besitzkonstruktion kann hier schlicht bedeuten: „wer etwas hat“. Was jemand in seiner Hand hat, wird nicht näher bestimmt.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Verben stehen im Koptischen in der dritten Person Plural, die unpersönlich gebraucht werden kann. Daher hier „man“; möglich wäre auch: „sie werden ihm geben … sie werden es ihm wegnehmen“.'
    reason: dialect_note
  - marker: c
    text: 'Wörtlich: „das ebenfalls/selbst Kleine“. Gemeint sein kann das Wenige oder ein kleiner Besitz. Die Handschrift liest am Schluss klar „von ihm“; die normalisierte Textfassung weicht dort ab.'
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jesus sagte
  rationale: Die übliche erzählende Wiedergabe von ⲡⲉϫⲉ („sagen, sprechen“) im Präteritum entspricht dem knappen Stil des Thomasevangeliums.
- source_word: ⲡⲉⲧⲉⲣⲉⲟⲩⲛⲧⲁⲛⲧⲟϥ
  choice: Wer etwas … hat
  rationale: Die Relativkonstruktion mit ⲟⲩⲛⲧⲁ- bezeichnet Besitz; das pronominale Element kann hier expletiv gebraucht sein. „Etwas“ schafft im Deutschen die nötige Klarheit, ohne den Gegenstand festzulegen.
- source_word: ϩⲛⲡⲉϥϭⲓϫ
  choice: in seiner Hand
  rationale: Wörtliche und natürliche Wiedergabe der räumlichen Wendung; ϭⲓϫ bedeutet „Hand“.
- source_word: ⲛⲧⲟⲟⲩⲛⲁϯ ⲛⲁⲛⲧⲟϥ
  choice: dem wird man geben
  rationale: Die dritte Person Plural dient im Sahidischen als unpersönlicher Handlungsträger. Das deutsche unpersönliche „man“ gibt diese Funktion idiomatisch wieder.
- source_word: ⲡⲉⲧⲉⲣⲉⲙⲛⲧⲁⲛⲧⲟϥ
  choice: wer aber nichts hat
  rationale: Die negative Besitzkonstruktion wird im Deutschen natürlich mit „nichts haben“ ausgedrückt; „aber“ markiert den im Koptischen durch ⲁⲩⲱ verbundenen Gegensatz.
- source_word: ⲡⲕⲉϣⲏⲙ
  choice: selbst das Wenige
  rationale: ϣⲏⲙ ist substantiviert und bezeichnet das Wenige bzw. einen kleinen Betrag; ⲕⲉ- wird mit „selbst“ wiedergegeben und bewahrt die steigernde Aussage.
- source_word: ⲉⲧⲉⲣⲉⲟⲩⲛⲧⲁⲛⲧⲟϥ
  choice: das er hat
  rationale: Die Relativkonstruktion bestimmt das Wenige näher und wird direkt wiedergegeben.
- source_word: ⲛⲧⲟⲟⲩⲛⲁϥⲓϥ ⲛ̄ⲧⲟⲟⲧϥ̄
  choice: dem wird man … wegnehmen
  rationale: Auch hier steht die dritte Person Plural unpersönlich. „Wegnehmen“ bringt sowohl ϥⲓ („nehmen“) als auch die durch die Präpositionalphrase bezeichnete Trennung idiomatisch zum Ausdruck.
theological_decisions:
- issue: Unbestimmter Geber und Nehmender
  choice: unpersönliches „man“
  alternative: „sie werden geben/wegnehmen“ oder Passivformen
  rationale: Der koptische Plural bezeichnet keinen ausdrücklich identifizierten Akteur. Das unpersönliche „man“ bewahrt diese Offenheit und vermeidet, Gott, Menschen oder andere Mächte als Handelnde festzulegen.
- issue: Gegenstand des Habens
  choice: „etwas“ nur zur sprachlichen Verdeutlichung
  alternative: „es“ oder ein konkret benannter geistlicher Besitz
  rationale: Der Text nennt den Besitz nicht näher. Die Übersetzung lässt daher seine materielle oder geistliche Bedeutung bewusst offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Spruchform. Die parallele Struktur bleibt erhalten. Das unpersönliche „man“ ist im Deutschen natürlicher als ein nicht näher bestimmtes „sie“ und bewahrt zugleich die im Koptischen offene Handlungsträgerschaft.
