  source_fidelity: 'Die Übersetzung gibt die Struktur des koptischen Spruchs zuverlässig wieder: die offene Besitzangabe („etwas“), die räumliche Wendung „in seiner Hand“, die unpersönlich verwendeten Pluralformen sowie den Verlust des „Wenigen“. „Man“ ist eine idiomatische deutsche Entsprechung für den nicht näher bestimmten koptischen Plural und legt keinen Handelnden fest. „Selbst das Wenige“ bildet die steigernde Nuance von ⲡⲕⲉϣⲏⲙ angemessen ab.'
