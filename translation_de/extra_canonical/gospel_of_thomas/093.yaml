base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/093.yaml
  text: Do not give what is holy to the dogs[a], lest they throw them onto the dung-heap. Do not throw pearls to the pigs[f][e][d][c][b], lest they do it [...].
translation:
  language: de
  text: Gebt das Heilige nicht den Hunden[a], sonst werfen sie sie auf den Misthaufen[b]. Werft den Schweinen keine Perlen vor, sonst tun sie es […] [c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht ein substantiviertes Adjektiv: »das heilige [Etwas]«.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Manuskript hat beim Verb »werfen« grammatisch ein pluralisches Objekt: wörtlich etwa »sonst werfen sie sie auf den Misthaufen«. Dies steht in Spannung zum singularischen »das Heilige«.'
    reason: source_grammar
  - marker: c
    text: Nach dem erhaltenen »sonst tun sie es« bricht der Text ab. Das häufig ergänzte »zertreten« ist im Manuskript nicht erhalten und beruht vor allem auf Matthäus 7,6. Auch das singularische »es« steht grammatisch in Spannung zum Plural »Perlen«.
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ϫⲉⲙⲡⲣϯ
  choice: Gebt … nicht
  rationale: Der negative Imperativ ⲙⲡⲣ mit ϯ wird als direkter deutscher Imperativ wiedergegeben.
- source_word: ⲡⲉⲧⲟⲩⲁⲁⲃ
  choice: das Heilige
  rationale: Das substantivierte Adjektiv bezeichnet wörtlich »das heilige [Etwas]«; »das Heilige« bewahrt die offene, sprichwortartige Form.
- source_word: ⲛ̄ⲛⲟⲩϩⲟⲟⲣ
  choice: den Hunden
  rationale: Der pluralische Ausdruck wird natürlich und generisch wiedergegeben.
- source_word: ⲛⲟⲩⲛⲟϫⲟⲩ
  choice: sie es … werfen
  rationale: Das Verb bedeutet »werfen«; der überlieferte pluralische Objektsuffix steht jedoch in Spannung zum singularisch gefassten »Heiligen«. Im Haupttext wird zugunsten verständlichen Deutschen »es« gesetzt, während die Abweichung in der Fußnote offengelegt wird.
- source_word: ⲕⲟⲡⲣⲓⲁ
  choice: Misthaufen
  rationale: Das griechische Lehnwort bezeichnet einen Mist- oder Abfallhaufen; »Misthaufen« ist konkret und allgemein verständlich.
- source_word: ⲙⲡⲣⲛⲟⲩϫⲉ
  choice: Werft … keine … vor
  rationale: »Vorwerfen« ist bei Perlen und Schweinen natürliches Deutsch, bewahrt aber die konkrete Handlung des Werfens.
- source_word: ⲙⲁⲣⲅⲁⲣⲓⲧⲏⲥ
  choice: Perlen
  rationale: Das Lehnwort bezeichnet Perlen; der Plural entspricht dem sprichwortartigen Zusammenhang.
- source_word: ⲡⲉϣⲁⲩ
  choice: den Schweinen
  rationale: »Schweine« ist die direkte, moderne Wiedergabe ohne altertümliches »Säue«.
- source_word: ⲉⲓⲣⲉ ⲛⲧⲟϥ
  choice: damit tun
  rationale: Der erhaltene Text enthält »tun/machen« mit einem singularischen Pronomen; wegen der anschließenden Lücke wird kein bestimmtes Tun ergänzt.
theological_decisions:
- issue: Deutung dessen, was »das Heilige« und die »Perlen« bezeichnen
  choice: Keine Deutung in den Text aufgenommen
  alternative: Ausdrückliche Identifikation mit Lehre, Sakrament oder Offenbarungswissen
  rationale: Der Spruch selbst erklärt die Bilder nicht; eine konfessionelle oder esoterische Festlegung würde die echte Offenheit des Textes beseitigen.
- issue: Ergänzung des verlorenen Schlusses
  choice: Lücke sichtbar belassen
  alternative: »zertreten« nach Matthäus 7,6 ergänzen
  rationale: Das Manuskript bewahrt den vermuteten Ausdruck nicht; die synoptische Parallele darf eine nicht erhaltene Lesart nicht stillschweigend ersetzen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knappem Spruchcharakter. »Misthaufen« bleibt anschaulich; der fragmentarische Schluss wird bewusst nicht geglättet oder nach Matthäus ergänzt.
