base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/099.yaml
  text: The disciples said to him[a], "Your brothers and your mother are standing outside." He said to them, "Those here who do the will of my Father—these are my brothers and my mother[f][e][d][c][b]. They are the ones who will enter the kingdom of my Father."
translation:
  language: de
  text: 'Ein Jünger sagte zu ihm: „Deine Brüder und deine Mutter stehen draußen.“[a] Er sagte zu ihnen: „Diejenigen hier, die den Willen meines Vaters tun,[b] das sind meine Brüder und meine Mutter. Sie sind es, die in das Königreich meines Vaters eingehen werden.“[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Handschriftentext enthält bei „stehen“ zusätzlich eine Wendung, die wörtlich etwa „vor ihnen“ oder „ihnen gegenüber“ lautet. Ihr Verhältnis zu „draußen“ ist syntaktisch nicht eindeutig; sie kann die Ortsangabe verstärken.
    reason: textual_note
  - marker: b
    text: „Wille“ kann hier auch „Wunsch“ oder „Verlangen“ bedeuten. „Diejenigen hier“ heißt wörtlich „die an diesem Ort“.
    reason: lexical_alternative
  - marker: c
    text: „Eingehen“ gibt wörtlich „hineingehen“ wieder. Das mit „Königreich“ übersetzte Wort kann auch die Königsherrschaft bezeichnen. Vgl. Markus 3,31–35; Matthäus 12,46–50; Lukas 8,19–21. Nur dieser Spruch fügt den Eintritt in das Königreich des Vaters hinzu.
    reason: lexical_and_cross_reference
lexical_decisions:
- source_word: ⲥⲛⲏⲩ
  choice: Brüder
  rationale: Im Sahidischen bezeichnet das Wort gewöhnlich männliche Geschwister; die konkrete Familienrede legt hier „Brüder“ näher als das umfassendere „Geschwister“.
- source_word: ϩⲓ ⲡⲥⲁ ⲛⲃⲟⲗ
  choice: draußen
  rationale: Die feste Ortsangabe bezeichnet den Außenbereich; „draußen“ ist im Deutschen natürlich und präzise.
- source_word: ⲡⲉⲓⲙⲁ
  choice: hier
  rationale: Der deiktische Ausdruck bedeutet wörtlich „an diesem Ort“ und verweist auf die unmittelbar Anwesenden.
- source_word: ⲉⲓⲣⲉ ⲛⲡⲟⲩⲱϣ
  choice: den Willen tun
  rationale: Die Wendung bezeichnet die Ausführung von Wunsch, Verlangen oder Willen; „den Willen tun“ bewahrt den theologischen Sprachgebrauch und bleibt verständlich.
- source_word: ⲡⲁⲉⲓⲱⲧ
  choice: mein Vater
  rationale: Der Possessivausdruck der ersten Person Singular wird ohne Verallgemeinerung wiedergegeben.
- source_word: ⲃⲱⲕ ⲉϩⲟⲩⲛ
  choice: eingehen
  rationale: Die Verbindung bedeutet wörtlich „hineingehen“; „eingehen in“ gibt die Bewegung und den feierlichen Kontext angemessen wieder.
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: Königreich
  rationale: Das Abstraktum zu „König“ kann Königsherrschaft oder Königreich bezeichnen. „Königreich“ hält hier die räumliche Vorstellung des Hineingehens fest, ohne die Bedeutung auf ein bloßes Gebiet zu beschränken.
theological_decisions:
- issue: Verwandtschaft durch das Tun des väterlichen Willens
  choice: 'Die Aussage wird als direkte Identifikation formuliert: „sie sind meine Brüder und meine Mutter“.'
  alternative: Eine abschwächende Wiedergabe wie „sie sind wie meine Familie“.
  rationale: Der koptische Text setzt die Personen ausdrücklich mit Jesu Brüdern und Mutter gleich; eine bloße Vergleichsaussage würde die Spannung des Spruchs mindern.
- issue: Bedeutungsumfang von ⲙⲛⲧⲣⲣⲟ
  choice: „Königreich meines Vaters“
  alternative: „Königsherrschaft meines Vaters“
  rationale: Beide Bedeutungsnuancen sind möglich. Wegen des Verbs „hineingehen/eingehen“ ist „Königreich“ idiomatischer; die alternative Herrschaftsbedeutung wird in der Fußnote offengehalten.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die direkte Rede bleibt knapp und mündlich. „Königreich“ und „eingehen“ wahren den feierlichen religiösen Ton, während „draußen“ und „diejenigen hier“ allgemein verständlich bleiben.
