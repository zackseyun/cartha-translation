base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/047.yaml
  text: Jesus said[1], "It is impossible for a person to mount two horses and to draw two bows. And it is impossible for a servant to serve two masters, or he will honor the one and insult the other. A person does not drink old wine and immediately desire to drink new wine. And they do not pour new wine into old wineskins, lest they burst. And they do not pour old wine into a new wineskin, lest it ruin it. They do not sew an old patch onto a festal garment[3][2], because a tear will result."
translation:
  language: de
  text: '**47** Jesus sagte: „Ein Mensch kann nicht zwei Pferde besteigen und zwei Bögen spannen. Auch kann ein Diener nicht zwei Herren dienen; sonst wird er den einen ehren und den anderen beleidigen. Niemand trinkt alten Wein und verlangt sogleich danach, neuen Wein zu trinken. Neuen Wein füllt man nicht in alte Weinschläuche, damit sie nicht platzen. Und alten Wein füllt man nicht in einen neuen Weinschlauch, damit er ihn nicht verdirbt. Einen alten Flicken näht man nicht auf ein Festgewand[a], denn sonst entsteht ein Riss.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Gewand eines Festes“. In den synoptischen Parallelen ist von einem neuen Gewand die Rede; hier bleibt die besondere koptische Formulierung erhalten.
    reason: cultural_note
  - marker: b
    text: 'Der Wortlaut des Thomasevangeliums kehrt bekannte Fassungen des Bildworts teilweise um: Hier geht es um alten Wein in einem neuen Weinschlauch und um einen alten Flicken auf einem Festgewand.'
    reason: cross_reference
lexical_decisions:
- source_word: ⲙⲛϭⲟⲙ ⲛⲧⲉ-
  choice: kann nicht
  rationale: Die koptische Wendung bedeutet wörtlich, dass jemand nicht die Fähigkeit oder Möglichkeit dazu hat. „Kann nicht“ gibt dies im Deutschen unmittelbar und natürlich wieder.
- source_word: ϫⲱⲗⲕ ⲛⲡⲓⲧⲉ
  choice: Bögen spannen
  rationale: Im Zusammenhang mit einem Bogen bezeichnet ϫⲱⲗⲕ das Spannen oder Ausziehen. „Einen Bogen spannen“ ist die übliche deutsche Wendung.
- source_word: ⲣⲧⲓⲙⲁ
  choice: ehren
  rationale: Das griechische Lehnwort τιμάω bedeutet hier „ehren“ oder „Wertschätzung erweisen“ und bildet den Gegensatz zu ϩⲩⲃⲣⲓⲍⲉ.
- source_word: ⲣϩⲩⲃⲣⲓⲍⲉ
  choice: beleidigen
  rationale: Das griechische Lehnwort ὑβρίζειν kann misshandeln, schmähen oder beleidigen bedeuten. „Beleidigen“ bewahrt den klaren Gegensatz zu „ehren“, ohne eine körperliche Misshandlung vorauszusetzen.
- source_word: ⲁⲥⲕⲟⲥ
  choice: Weinschlauch
  rationale: Das griechische Lehnwort ἀσκός bezeichnet einen Behälter aus Tierhaut; im Weinkontext ist „Weinschlauch“ die sachlich eindeutige Wiedergabe.
- source_word: ⲧⲁⲕⲟ
  choice: verdirbt
  rationale: Das Verb kann „zerstören“, „zugrunde richten“ oder „verderben“ bedeuten. Beim Weinschlauch gibt „verdirbt“ die Beschädigung natürlich wieder und lässt den genauen Vorgang offen.
- source_word: ϣⲧⲏⲛ ⲛϣⲁⲓ
  choice: Festgewand
  rationale: Die Wendung bedeutet wörtlich „Gewand eines Festes“. „Festgewand“ bewahrt diese konkrete koptische Formulierung, statt sie stillschweigend an die synoptische Fassung „neues Gewand“ anzugleichen.
theological_decisions:
- issue: Angleichung an die synoptischen Gleichnisse
  choice: 'Die thomasische Abfolge und ihre Umkehrungen bleiben erhalten: alter Wein in einem neuen Weinschlauch und ein alter Flicken auf einem Festgewand.'
  alternative: Anpassung an die geläufigen synoptischen Fassungen mit neuem Wein in neuen Schläuchen beziehungsweise einem neuen Flicken auf einem alten Gewand.
  rationale: Der überlieferte koptische Text formuliert diese Gegensätze ausdrücklich. Eine Harmonisierung würde den eigenständigen Wortlaut und seine mögliche theologische Spannung beseitigen.
- issue: Bezug des Singularpronomens bei ⲛⲉϥⲧⲉⲕⲁϥ
  choice: '„damit er ihn nicht verdirbt“: Der alte Wein ist Subjekt, der neue Weinschlauch Objekt.'
  alternative: 'Unpersönlich: „damit nichts verdorben wird“ oder auf den Schlauch als Subjekt bezogen.'
  rationale: Die koptische Singularform legt einen einzelnen Weinschlauch als betroffenes Objekt nahe; die gewählte Form bewahrt zugleich die knappe Bildsprache.
translation_notes:
  register: Moderne, klare Standardsprache mit würdigem Spruchcharakter. Die wiederholte Struktur bleibt hörbar, während unnatürliche koptische Syntax vermieden wird. „Niemand“ und das unpersönliche „man“ geben die allgemeinen Aussagen idiomatisch wieder; Geschlechterzusätze werden nicht in den Text eingeführt.
