base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/045.yaml
  text: Jesus said, “They do not pick grapes from thorns, nor do they gather figs[b] from thistles—for they do not give fruit. A good person[a] brings out a good thing from his storehouse; an evil person brings out an evil thing from his storehouse that is in his heart[c], and he speaks evil[d], for from the overflow of the heart he brings out evil.”
translation:
  language: de
  text: 'Jesus sagte: „Von Dornen liest man keine Trauben, und von Disteln pflückt man keine Feigen; denn sie bringen keine Frucht hervor. Ein guter Mensch[a] bringt aus seinem Vorrat Gutes hervor. Ein böser Mensch bringt aus seinem bösen Vorrat, der in seinem Herzen ist,[b] Böses hervor und spricht Böses. Denn aus der Fülle des Herzens bringt er Böses hervor.[c]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Anfang des koptischen Wortes für »gut« ist im Manuskript ergänzt.
    reason: Kennzeichnet eine kleine, inhaltlich sichere Textrekonstruktion an der beschädigten Stelle.
  - marker: b
    text: 'Auch möglich: »aus dem bösen Vorrat seines Herzens«.'
    reason: Die Hauptfassung bewahrt die Relativkonstruktion des Koptischen; die Alternative glättet sie im Deutschen.
  - marker: c
    text: Die koptischen Formen können, besonders im handschriftlichen Wortlaut, auch als »böse Dinge« verstanden werden.
    reason: Hält die offene Nuance zwischen substantiviertem »Böses« und einer unbestimmten Mehrzahl fest.
lexical_decisions:
- source_word: ϣⲟⲛⲧⲉ
  choice: Dornen
  rationale: Gibt die allgemeine Bezeichnung für Dornen natürlich und bildkräftig wieder.
- source_word: ⲥⲣ̄ϭⲁⲙⲟⲩⲗ / ⲥⲉⲣϭⲁⲙⲟⲩⲗ
  choice: Kameldornen
  rationale: Bewahrt die gegenüber dem ersten Dornenbegriff spezifischere koptische Pflanzenbezeichnung, ohne sie an die synoptische Parallelüberlieferung anzugleichen.
- source_word: ⲁϩⲟ / ⲉϩⲟ
  choice: Vorrat
  rationale: Der Kontext verlangt einen inneren Bestand oder Vorrat, aus dem Gutes beziehungsweise Böses hervorgebracht wird; „Vorrat“ bewahrt das Bild, ohne ein im Koptischen nicht ausdrücklich genanntes Behältnis einzuführen.
- source_word: ⲡϩⲟⲩⲟ ⲛⲡϩⲏⲧ
  choice: die Fülle des Herzens
  rationale: Formnahe und im Deutschen verständliche Wiedergabe des Übermaßes beziehungsweise Überflusses des Herzens.
- source_word: ⲡⲟⲛⲏⲣⲟⲛ
  choice: Böses
  rationale: Das substantivierte „Böses“ kann die koptischen singularischen und pluralisch-indefiniten Formen idiomatisch zusammenfassen, ohne sie unnötig zu konkretisieren.
theological_decisions:
- issue: Beziehung zwischen bösem Vorrat und Herz
  choice: „aus seinem bösen Vorrat, der in seinem Herzen ist“
  alternative: „aus dem bösen Vorrat seines Herzens“
  rationale: Die gewählte Fassung bewahrt die explizite Relativkonstruktion des koptischen Textes und vermeidet eine stillschweigende syntaktische Glättung.
- issue: Inneres Herz und gesprochenes Böses
  choice: Beide Aussagen bleiben ausdrücklich nebeneinander stehen
  alternative: Die Rede als bloße Erläuterung des Hervorbringens behandeln
  rationale: Der koptische Text verbindet das Hervorbringen des Bösen und das böse Reden, ohne ihr genaues logisches Verhältnis vollständig aufzulösen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst bewahrter Bildsprache. „liest … Trauben“ und „pflückt … Feigen“ sind idiomatisch und unterscheiden die beiden Erntehandlungen. Die Wiederholung von „Böses hervorbringen“ bleibt erhalten, weil sie die rhetorische Struktur des Quelltexts trägt.
