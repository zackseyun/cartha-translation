revisions:
- from: 'Jesus sagte: „Von Dornen liest man keine Trauben, und von Kameldornen[a] pflückt man keine Feigen; denn sie bringen keine Frucht hervor. Ein guter Mensch[b] bringt aus seinem Vorrat Gutes hervor. Ein böser Mensch bringt aus seinem bösen Vorrat, der in seinem Herzen ist,[c] Böses hervor und redet Böses. Denn aus der Fülle des Herzens bringt er Böses hervor.[d]“'
  to: 'Jesus sagte: „Von Dornen liest man keine Trauben, und von Disteln pflückt man keine Feigen; denn sie bringen keine Frucht hervor. Ein guter Mensch[a] bringt aus seinem Vorrat Gutes hervor. Ein böser Mensch bringt aus seinem bösen Vorrat, der in seinem Herzen ist,[b] Böses hervor und spricht Böses. Denn aus der Fülle des Herzens bringt er Böses hervor.[c]“'
  rationale: Die sichere Korrektur ersetzt die fragwürdige, lexikalisch unnötig enge Pflanzenbezeichnung durch »Disteln« und entfernt die darauf beruhende Fußnote. Die übrige Fassung bewahrt die Bildsprache, die Wiederholungen und die nicht weiter aufgelöste Beziehung von Vorrat und Herz.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:05:49Z'
review_pass:
  verdict: revise
  source_fidelity: Die Bildfolge, die Wiederholung von »hervorbringen« und die Zuordnung des bösen Vorrats zum Herzen sind im Wesentlichen quellentreu. Die Wiedergabe von ⲥⲉⲣϭⲁⲙⲟⲩⲗ als »Kameldornen« ist jedoch für diesen Kontext nicht hinreichend abgesichert und weicht ohne erkennbaren Gewinn von der üblichen Bedeutung »Disteln« ab.
  naturalness: Der Text ist überwiegend flüssiges modernes Standarddeutsch. »Disteln« ist hier zugleich idiomatischer und für die beabsichtigte Gegenüberstellung mit Dornen verständlicher. »spricht Böses« ist etwas unmittelbarer als »redet Böses«.
  terminology: »Vorrat«, »Herz«, »Gutes« und »Böses« geben die offenen, nicht weiter theologisierten Begriffe angemessen wieder. Die textkritische Anmerkung zur ergänzten Lesung bei »guter Mensch« ist sinnvoll.
  issues:
  - severity: medium
    issue: ⲥⲉⲣϭⲁⲙⲟⲩⲗ als »Kameldornen«
    rationale: Die Bezeichnung wird in diesem Spruch gewöhnlich als »Disteln« verstanden; »Kameldornen« ist im Deutschen zudem ungebräuchlich und die dazugehörige Fußnote behauptet eine Spezifizierung, die der koptische Befund nicht sicher verlangt.
  - severity: low
    issue: Fußnote a stützt die problematische Pflanzenübersetzung
    rationale: Da die Hauptfassung zu »Disteln« zu korrigieren ist, soll die erläuternde Fußnote zu einer angeblich wörtlichen Bezeichnung als »Kameldorn« entfallen.
