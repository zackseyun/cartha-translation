base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/000.yaml
  text: These are the hidden sayings which the living Jesus spoke[4][3][2][1], and Didymos Judas Thomas wrote them.
translation:
  language: de
  text: Dies sind die verborgenen Worte, die der lebendige Jesus gesprochen hat, und Didymos Judas Thomas hat sie aufgeschrieben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Didymos“ ist ein griechisches Wort für „Zwilling“; auch der Name „Thomas“ geht auf ein semitisches Wort mit derselben Bedeutung zurück.
    reason: cultural_note
lexical_decisions:
- source_word: ⲛ̄ϣⲁϫⲉ
  choice: Worte
  rationale: Das koptische Pluralwort bezeichnet Worte, Aussprüche oder Reden. „Worte“ ist im Deutschen natürlich und weit genug, um die Gattung nicht vorschnell als Spruchsammlung festzulegen.
- source_word: ϩⲏⲡ
  choice: verborgen
  rationale: „Verborgen“ bewahrt den Grundsinn des Verborgenseins, ohne von sich aus eine esoterische Geheimlehre vorauszusetzen.
- source_word: 'ⲱⲛϩ (Handschrift: ⲧⲟⲛϩ)'
  choice: lebendig
  rationale: Die attributive Form wird als „der lebendige Jesus“ wiedergegeben; das ist knapp und bewahrt den möglichen titelartigen Klang.
- source_word: ϫⲟⲟⲩ
  choice: gesprochen hat
  rationale: Das Verb bedeutet hier „sagen/sprechen“ mit pronominalem Objekt. Im Deutschen kann sich „die ... gesprochen hat“ natürlich auf die vorangestellten Worte beziehen.
- source_word: ⲥϩⲁⲓ
  choice: aufgeschrieben
  rationale: „Aufgeschrieben“ macht in diesem Zusammenhang idiomatisch deutlich, dass die zuvor genannten Worte schriftlich festgehalten wurden, ohne eine weitergehende Autorschaftstheorie einzutragen.
- source_word: ⲇⲓⲇⲩⲙⲟⲥ ⲓⲟⲩⲇⲁⲥ ⲑⲱⲙⲁⲥ
  choice: Didymos Judas Thomas
  rationale: Die vollständige Namensfolge der Handschrift bleibt erhalten; „Didymos“ wird nicht im Haupttext übersetzt.
theological_decisions:
- issue: Bedeutung der verborgenen Worte
  choice: „verborgen“ ohne nähere Deutung
  alternative: „geheim“ oder eine ausdrückliche Deutung als esoterische Lehre
  rationale: Der Text bezeichnet die Worte als verborgen, erklärt aber im Incipit nicht, auf welche Weise oder für wen sie verborgen sind. Die Übersetzung lässt diese Spannung bestehen.
- issue: Bezeichnung Jesu als lebendig
  choice: „der lebendige Jesus“
  alternative: „Jesus, der lebt“ oder Harmonisierung mit einer kanonischen Auferstehungsformel
  rationale: Die knappe attributive Bezeichnung wird bewahrt, ohne ihren möglichen christologischen oder auferstehungstheologischen Gehalt näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax bleibt schlicht und incipitartig. „Worte“ vermeidet die etwas fachsprachliche Festlegung durch „Logien“ und klingt natürlicher als „Aussprüche“; „aufgeschrieben“ ist im gegebenen Zusammenhang idiomatischer als das isolierte „geschrieben“.
