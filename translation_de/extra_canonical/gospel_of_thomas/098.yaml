base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/098.yaml
  text: Jesus said[a], “The Father’s kingship is like a man who wanted to kill a magnate. He drew the sword in his house and drove it into the wall, so that he might find out whether his hand would be strong enough[e][d][c][b]; then he killed the magnate.”
translation:
  language: de
  text: 'Jesus sagte: „Die Königsherrschaft[a] des Vaters gleicht einem Mann, der einen Magnaten[b] töten wollte. In seinem Haus zog er das Schwert und stieß es in die Wand, um festzustellen, ob seine Hand stark genug sein würde[c]. Dann tötete er den Magnaten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das koptische Wort bezeichnet die Herrschaft oder das Königsein; möglich ist auch: „das Reich des Vaters“.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Lehnwort bezeichnet einen hochgestellten „großen Mann“; möglich sind auch „Mächtiger“, „Adliger“ oder „hoher Würdenträger“.
    reason: lexical_alternative
  - marker: c
    text: Die Wendung enthält wörtlich das Element „hinein“. Im Zusammenhang bezeichnet sie, ob seine Hand stark genug sein beziehungsweise genügend Kraft zum Durchdringen würde.
    reason: source_ambiguity
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: Königsherrschaft
  rationale: Das mit ⲙⲛⲧ- gebildete Abstraktum bezeichnet primär Herrschaft beziehungsweise Königsein, nicht eindeutig ein räumliches Reich. „Königsherrschaft“ bewahrt diese Nuance.
- source_word: ⲉⲣⲉⲛⲧⲟⲥⲧⲟⲛⲧⲛ
  choice: gleicht
  rationale: Die übliche koptische Vergleichsformel zur Einleitung eines Gleichnisses wird knapp und würdig wiedergegeben.
- source_word: ⲟⲩⲱϣ ⲉⲙⲟⲩ
  choice: töten wollte
  rationale: Gibt Wunsch und Absicht schlicht wieder, ohne eine rechtliche oder kultische Tötungsnuance hinzuzufügen.
- source_word: ⲙⲉⲅⲓⲥⲧⲁⲛⲟⲥ
  choice: Magnat
  rationale: Das griechische Lehnwort bezeichnet einen hochgestellten oder mächtigen Mann. „Magnat“ erhält sowohl den gesellschaftlichen Rang als auch etwas von der Fremdprägung des Ausdrucks.
- source_word: ϣⲱⲗⲙ ⲛⲡⲥⲏϥⲉ
  choice: zog das Schwert
  rationale: Natürliche deutsche Verbindung für das Herausziehen eines Schwertes; die knappe Erzählweise bleibt erhalten.
- source_word: ϫⲟⲧⲥ ⲛⲡϫⲟ
  choice: stieß es in die Wand
  rationale: Gibt den kräftigen Stoß des Schwertes gegen beziehungsweise in die Wand wieder und passt zum anschließenden Test der Handkraft.
- source_word: ⲉⲓⲙⲉ
  choice: festzustellen
  rationale: Im Zwecksatz geht es darum, durch die Probe Gewissheit zu erlangen; „festzustellen“ ist im Deutschen natürlich und präzise.
- source_word: ⲧⲱⲕ ⲉϩⲟⲩⲛ
  choice: stark genug wäre
  rationale: ⲧⲱⲕ trägt die Bedeutung „stark/fest sein, vermögen“; der Kontext des Schwertstoßes legt die Kraft der Hand nahe. Die ungewöhnlichere wörtliche Bewegungsnuance von ⲉϩⲟⲩⲛ wird in einer Fußnote bewahrt.
- source_word: ϩⲱⲧⲙ
  choice: tötete
  rationale: Schlichte Wiedergabe des gewöhnlichen Verbs für „töten“, passend zur abrupten Schlusswendung.
theological_decisions:
- issue: Art der Herrschaft des Vaters
  choice: Königsherrschaft des Vaters
  alternative: Reich des Vaters
  rationale: Die Übersetzung legt die Aussage nicht auf ein Territorium fest, sondern hält den abstrakten Herrschaftsaspekt des koptischen Ausdrucks offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Gleichniserzählung. „Königsherrschaft“ und „Magnat“ sind bewusst markierte, aber verständliche Begriffe; die Fußnoten erläutern ihre weniger geläufigen Nuancen. Die Satzfolge bleibt nah an der abrupten koptischen Erzählstruktur.
