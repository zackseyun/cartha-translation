- from: 'Jesus sagte: „Die Königsherrschaft[a] des Vaters gleicht einem Mann, der einen Magnaten[b] töten wollte. In seinem Haus zog er das Schwert und stieß es in die Wand, um festzustellen, ob seine Hand stark genug wäre[c]. Dann tötete er den Magnaten.“'
  to: 'Jesus sagte: „Die Königsherrschaft[a] des Vaters gleicht einem Mann, der einen Magnaten[b] töten wollte. In seinem Haus zog er das Schwert und stieß es in die Wand, um festzustellen, ob seine Hand stark genug sein würde[c]. Dann tötete er den Magnaten.“'
  rationale: 'Eine begrenzte Korrektur ist angezeigt: Die prospektive Zeitstufe wird im Deutschen expliziter wiedergegeben, und die Anmerkung zur schwierigen Wendung ⲧⲱⲕ ⲉϩⲟⲩⲛ wird so präzisiert, dass sie deren Kraft- und Durchdringungsnuance wahrt. Der übrige Wortlaut sowie die Fußnotenanker bleiben unverändert.'
