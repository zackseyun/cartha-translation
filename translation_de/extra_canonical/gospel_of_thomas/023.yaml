review_pass:
  verdict: approve
  source_fidelity: 'Der Entwurf gibt den Handschriftentext treffend wieder: ⲥⲉⲧⲡ- ist angemessen mit „auswählen“ übersetzt; die Zahlenrelationen „einen aus tausend und zwei aus zehntausend“ bleiben erhalten. Er folgt zurecht der handschriftlichen Lesung ⲥⲉⲛⲁⲱϩⲉ … ⲉⲩⲟ ⲟⲩⲁ ⲟⲩⲱⲧ: „sie werden dastehen als ein Einziger“. Damit werden weder das idiomatische ⲱϩⲉ ⲉⲣⲁⲧ= fälschlich als „vor jemandem stehen“ noch ⲉⲩⲟ fälschlich als ein Verb „machen“ verstanden. Die im englischen Audittext auftauchende zusätzliche Wiederholung von „they will stand“ bzw. ein zusätzliches „a single one“ nach der Zahlenformel hat im handschriftlichen koptischen Wortlaut keine Grundlage und wird im deutschen Entwurf korrekt nicht übernommen.'
  naturalness: „Jesus sagte“ und „Ich werde euch auswählen“ sind modernes, würdiges Standarddeutsch. Die Formulierung „dastehen als ein Einziger“ ist bewusst leicht markiert, aber gut verständlich und angemessen, weil sie die ebenso markierte Verbindung eines Plurals mit ⲟⲩⲁ ⲟⲩⲱⲧ nicht glättet. Die kurze Satztrennung vor „Und sie“ ist im Deutschen flüssig und verändert die syntaktische Relation nicht.
  terminology: „Auswählen“, „tausend“, „zehntausend“ und „ein Einziger“ sind terminologisch tragfähig. Insbesondere vermeidet „ein Einziger“ eine konfessionell oder systematisch-theologisch festgelegte Paraphrase wie „vereint“, ohne den auffälligen Einheitsausdruck zu verlieren.
  issues: []
  revised_text: ''
  revised_footnotes: []
  revision_rationale: Keine sichere Korrektur erforderlich. Der Entwurf bewahrt sowohl den Wechsel von „euch“ zu „sie“ als auch die Spannung zwischen pluralischem Subjekt und singularischem Einheitsausdruck. Die vorhandenen Fußnoten sind korrekt verankert und erläutern genau diese zwei textlich auffälligen Merkmale, ohne über den Wortlaut hinausgehende Deutung vorzuschreiben.
