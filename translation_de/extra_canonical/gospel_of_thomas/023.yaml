base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/023.yaml
  text: Jesus said to you, “I will choose you, one out of a thousand and two out of ten thousand, a single one; they will stand, and they will stand as a single one.”
translation:
  language: de
  text: 'Jesus sagte: „Ich werde euch auswählen: einen aus tausend und zwei aus zehntausend. Und sie[a] werden dastehen als ein Einziger[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der koptische Text wechselt hier unvermittelt von der zweiten Person („euch“) zur dritten Person („sie“).
    reason: grammatical_shift
  - marker: b
    text: Wörtlich „ein Einziger“. Die Formulierung verbindet das Mehrzahlwort „sie“ mit einem Ausdruck im Singular und hebt so ihre Einheit hervor.
    reason: translation_note
lexical_decisions:
- source_word: ⲥⲱⲧⲡ / ⲥⲉⲧⲡ-
  choice: auswählen
  rationale: Das Verb bedeutet „wählen, auswählen“. „Auswählen“ ist im heutigen Deutsch natürlich und bewahrt den Vorgang der Auswahl, ohne durch „erwählen“ zusätzliche religiöse Konnotationen aufzudrängen.
- source_word: ϣⲟ
  choice: tausend
  rationale: Das koptische Zahlwort bezeichnet 1.000.
- source_word: ⲧⲃⲁ
  choice: zehntausend
  rationale: Das koptische Zahlwort bezeichnet 10.000; „zehntausend“ ist verständlicher und genauer als das im Deutschen seltene „Myriade“.
- source_word: ⲱϩⲉ ⲉⲣⲁⲧⲟⲩ
  choice: dastehen
  rationale: Die feste Wendung bedeutet wörtlich, auf den Füßen zu stehen, und idiomatisch einfach „stehen/dastehen“. Sie bezeichnet nicht ein Stehen „vor“ jemandem.
- source_word: ⲉⲩⲟ
  choice: als
  rationale: Die Umstandsform mit dem Stativ von „sein“ beschreibt den Zustand, in dem sie dastehen. „Als“ gibt dies knapp und natürlich wieder.
- source_word: ⲟⲩⲁ ⲟⲩⲱⲧ
  choice: ein Einziger
  rationale: Die wörtlich-singuläre Formulierung bewahrt das auffällige Bild von Einheit und vermeidet die auslegende Abschwächung zu „vereint“ oder „gemeinsam“.
theological_decisions:
- issue: Einheit der Ausgewählten in ⲟⲩⲁ ⲟⲩⲱⲧ
  choice: als ein Einziger
  alternative: vereint / wie einer
  rationale: Der Text stellt den Plural „sie“ unvermittelt neben den Singular „ein Einziger“. Diese theologisch gewichtige Spannung wird bewahrt und nicht als bloße Einigkeit erklärt.
- issue: Wechsel von der zweiten zur dritten Person
  choice: „euch“ … „sie“
  alternative: „euch“ … „ihr“
  rationale: Der Handschriftentext wechselt von der Anrede in der zweiten Person Plural zur dritten Person Plural. Eine Angleichung zu „ihr“ wäre glatter, würde aber die genuine grammatische Spannung beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Zahlenformel bleibt knapp und parallel. Der auffällige Wechsel von „euch“ zu „sie“ sowie die Spannung zwischen Mehrzahl und Einzahl werden bewusst nicht geglättet. Der Entwurf folgt dem tatsächlichen Handschriftentext (ⲥⲉⲛⲁⲱϩⲉ … ⲉⲩⲟ ⲟⲩⲁ ⲟⲩⲱⲧ) und übernimmt nicht die offenbar fehlerhaft expandierte Normalisierung oder die daraus entstandene Wiederholung der englischen Konsultationsfassung.
