base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/036.yaml
  text: Jesus said[a], Do not be anxious from morning until evening, and from evening until morning[c][b], about what you will put on yourselves.
translation:
  language: de
  text: 'Jesus sagte: »Macht euch keine Sorgen – vom Morgen bis zum Abend und vom Abend bis zum Morgen – darüber, was ihr anziehen werdet.«[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Manuskript ist innerhalb der Konstruktion für »was ihr … werdet« ein Buchstabe ergänzt; die Übersetzung folgt der normalisierten Lesart.
    reason: lacuna_or_restoration
  - marker: b
    text: Der griechische Zeuge POxy 655 bietet zu diesem Spruch zusätzliche Aussagen über Nahrung, Lilien und Körpergröße. Hier wird der kürzere koptische Text des Nag-Hammadi-Kodex übersetzt.
    reason: textual_variant
lexical_decisions:
- source_word: ⲙⲡⲣϥⲓⲣⲟⲟⲩϣ
  choice: Macht euch keine Sorgen
  rationale: Der negative Imperativ bezeichnet besorgtes oder ängstliches Sich-Kümmern. Die moderne deutsche Wendung ist klar, natürlich und bewahrt den Aussagewert.
- source_word: ϫⲓⲛϩⲧⲟⲟⲩⲉ ϣⲁⲣⲟⲩϩⲉ
  choice: vom Morgen bis zum Abend
  rationale: Gibt die zeitliche Spanne direkt wieder und erhält die parallele Struktur.
- source_word: ϫⲓⲛϩⲓⲣⲟⲩϩⲉ ϣⲁϩⲧⲟⲟⲩⲉ
  choice: vom Abend bis zum Morgen
  rationale: Spiegelt die erste Zeitangabe und bewahrt die auffällige Symmetrie des Koptischen.
- source_word: ⲟⲩ ⲡⲉⲧⲉⲣⲉⲛⲧⲱⲧⲛⲛⲁ–
  choice: was ihr … werdet
  rationale: Die kopflose Relativkonstruktion wird idiomatisch mit „was“ wiedergegeben; die Futurmarkierung bleibt durch „werdet“ erhalten.
- source_word: ϯⲛⲧⲟϥ ϩⲓⲱⲧⲛⲧⲱⲧⲛ
  choice: anziehen
  rationale: Das deutsche reflexive Verb fasst das konkrete Anlegen von Kleidung und den Bezug auf die eigene Person natürlich zusammen, ohne ein im Koptischen nicht ausdrücklich genanntes Kleidungsstück einzufügen.
- source_word: ⲁⲩⲱ
  choice: und
  rationale: Die einfache Beiordnung erhält die parataktische Form des Spruchs.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Macht euch keine Sorgen“ ist alltagssprachlich verständlich, ohne salopp zu wirken. Gedankenstriche markieren die symmetrische Zeitangabe und verhindern, dass sie unbeholfen an das Satzende tritt.
