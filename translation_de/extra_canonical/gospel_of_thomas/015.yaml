base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/015.yaml
  text: Jesus said[a], "When you see the one who was not born from a woman, throw yourselves down upon your faces and worship him[d][c][b]. That one is your Father."
translation:
  language: de
  text: 'Jesus sagte: »Wenn ihr den seht, der nicht von einer Frau geboren wurde, werft euch mit dem Gesicht zu Boden[a] und betet ihn an. Jener[b] ist euer Vater.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »werft euch auf euer Gesicht nieder«. Der koptische Singular »Gesicht« steht bei der Mehrzahl der Angesprochenen distributiv: jeder wirft sich auf sein Gesicht.'
    reason: lexical_alternative
  - marker: b
    text: 'Das koptische Demonstrativ hebt die bezeichnete Person hervor: »jener« oder »jener dort«, nicht nur »er«.'
    reason: dialect_note
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jesus sagte
  rationale: Die übliche Einleitung direkter Rede gibt die knappe Erzählform des koptischen ⲡⲉϫⲉ idiomatisch wieder.
- source_word: ϩⲟⲧⲁⲛ ⲉⲣϣⲁⲛ_ⲛⲧⲱⲧⲛⲛⲁⲩ
  choice: Wenn ihr … seht
  rationale: ϩⲟⲧⲁⲛ mit der prospektiven Konstruktion bezeichnet den Zeitpunkt eines möglichen oder künftigen Sehens; schlichtes »wenn« bewahrt diese Offenheit.
- source_word: ⲡⲉⲧⲉⲣⲉⲙⲡⲉⲛⲧⲟⲟⲩϫⲡⲟⲛⲧⲟϥ ⲉⲃⲟⲗ ϩⲛⲡⲥϩⲓⲙⲉ
  choice: der nicht von einer Frau geboren wurde
  rationale: Im Zusammenhang mit »von einer Frau« bezeichnet das Verb eindeutig Geburt beziehungsweise Herkunft. »Geboren« ist im Deutschen natürlicher und weniger theologisch festgelegt als »gezeugt«.
- source_word: ⲡⲱϩⲧⲛⲧⲱⲧⲛ ⲉϫⲛⲡⲉⲧⲛϩⲟ
  choice: werft euch mit dem Gesicht zu Boden
  rationale: Die Formulierung erhält die eindringliche, körperliche Bewegung des Verbs ⲡⲱϩⲧ und gibt den distributiven Singular von »Gesicht« in natürlichem Deutsch wieder.
- source_word: ⲟⲩⲱϣⲧ ⲛⲁⲛⲧⲟϥ
  choice: betet ihn an
  rationale: ⲟⲩⲱϣⲧ bezeichnet hier angesichts der Niederwerfung kultische Verehrung; »anbeten« ist die knappe und sachgerechte deutsche Entsprechung.
- source_word: ⲡⲉⲧⲉⲣⲉⲙⲙⲁⲩ
  choice: Jener
  rationale: Das demonstrative Element wird stärker wiedergegeben als durch ein bloßes Personalpronomen und bleibt dennoch in würdigem, verständlichem Deutsch.
theological_decisions:
- issue: Art der Herkunft dessen, der nicht von einer Frau geboren wurde
  choice: Die Aussage bleibt ohne ausdrückliche Identifizierung oder Erklärung stehen.
  alternative: Die Gestalt ausdrücklich mit Gott, einem himmlischen Wesen oder Jesus identifizieren.
  rationale: Der Text nennt die Gestalt nur »euren Vater«. Eine weitergehende Bestimmung würde die eigentümliche Spannung des Spruchs auflösen und nicht aus dem koptischen Wortlaut folgen.
- issue: Bedeutung von ⲟⲩⲱϣⲧ
  choice: anbeten
  alternative: sich ehrerbietig verneigen
  rationale: Die Verbindung von Niederwerfung und ⲟⲩⲱϣⲧ stützt den stärkeren kultischen Sinn, ohne eine konfessionelle Lehre hinzuzufügen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdiger Spruchform. Die ungewöhnliche Aussage über den, der nicht von einer Frau geboren wurde, wird nicht geglättet oder dogmatisch erklärt. Die Anrede steht konsequent im pluralischen »ihr«.
