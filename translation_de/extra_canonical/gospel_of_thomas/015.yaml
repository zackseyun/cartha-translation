review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die entscheidenden Elemente des koptischen Spruchs zuverlässig wieder: die prospektive Bedingung („Wenn ihr … seht“), die negative Herkunftsaussage („nicht von einer Frau geboren“), die körperliche Niederwerfung, die Aufforderung zur Anbetung sowie das nachdrückliche Demonstrativ („Jener“). Die nicht weiter erklärte Identität der als „euer Vater“ bezeichneten Gestalt bleibt zu Recht offen.'
  naturalness: Modernes Standarddeutsch und eine knappe, würdige Spruchform sind gelungen. „Werft euch mit dem Gesicht zu Boden“ ist eine idiomatische deutsche Wiedergabe der Aufforderung, sich auf das Gesicht niederzuwerfen. Die Fußnote erläutert angemessen, warum der koptische Singular bei pluralischer Anrede nicht als deutscher Singular nachgebildet werden muss.
  terminology: „Anbeten“ entspricht ⲟⲩⲱϣⲧ im Kontext der Niederwerfung treffend. „Von einer Frau geboren“ ist natürlich, quellennah und vermeidet eine nicht erforderliche dogmatische Präzisierung durch „gezeugt“. „Jener“ erhält die demonstrative Hervorhebung von ⲣⲉⲙⲙⲁⲩ.
