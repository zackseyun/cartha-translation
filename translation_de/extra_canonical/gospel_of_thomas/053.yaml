revisions:
- from: 'Seine Jünger sagten zu ihm: »Nützt die Beschneidung etwas oder nicht?« Er sagte zu ihnen: »Wenn sie etwas nützen würde, würde ihr Vater sie bereits beschnitten aus ihrer Mutter hervorbringen.[a] Vielmehr ist die Beschneidung der Wahrheit im Geist in jeder Hinsicht nützlich geworden.[b][c]«'
  to: 'Seine Jünger sagten zu ihm: »Nützt die Beschneidung etwas oder nicht?« Er sagte zu ihnen: »Wenn sie etwas nützen würde, würde ihr Vater sie bereits beschnitten aus ihrer Mutter hervorbringen.[a] Vielmehr ist die Beschneidung der Wahrheit im Geist ganz und gar nützlich geworden.[b][c]«'
  rationale: Eine kleine, sichere Korrektur ersetzt die aspektbezogene Formulierung »in jeder Hinsicht« durch »ganz und gar«, um die totale Intensivierung von ⲧⲏⲣϥ genauer abzubilden. Der übrige Text und die Fußnoten bleiben bestehen, da sie die sprachlichen und semantischen Mehrdeutigkeiten des Koptischen angemessen wahren.
