base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/053.yaml
  text: His disciples said to him[1], “Does circumcision benefit or not?” He said to them, “If it were beneficial, their father would beget them circumcised from their mother. Rather[6][5][4][3][2], the circumcision of truth in spirit has become entirely profitable.”
translation:
  language: de
  text: 'Seine Jünger sagten zu ihm: »Nützt die Beschneidung etwas oder nicht?« Er sagte zu ihnen: »Wenn sie etwas nützen würde, würde ihr Vater sie bereits beschnitten aus ihrer Mutter hervorbringen.[a] Vielmehr ist die Beschneidung der Wahrheit im Geist ganz und gar nützlich geworden.[b][c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht der Vater als Handelnder im Satz: Er würde sie »aus ihrer Mutter« hervorbringen, während sie beschnitten sind.'
    reason: Die ungewöhnliche Quellen- und Geburtsformulierung sowie die prädikative Zustandsangabe sollen transparent bleiben.
  - marker: b
    text: »Beschneidung der Wahrheit« kann auch im Sinn von »wahre Beschneidung« verstanden werden.
    reason: Die attributive Deutung der koptischen Genitivfügung ist möglich, aber nicht zwingend.
  - marker: c
    text: Der letzte Ausdruck lautet sinngemäß »ist ganz und gar nützlich geworden«; »nützlich« wird aus dem vorherigen Zusammenhang ergänzt.
    reason: Das Koptische verwendet hier eine kontextabhängige elliptische Wendung.
lexical_decisions:
- source_word: ⲡⲥⲃⲃⲉ
  choice: die Beschneidung
  rationale: Der übliche koptische Ausdruck für die rituelle Beschneidung; der Zusammenhang setzt diese Bedeutung voraus.
- source_word: ⲣⲱⲫⲉⲗⲉⲓ
  choice: etwas nützen / nützlich
  rationale: Das griechische Lehnverb bezeichnet Nutzen oder Vorteil. Die wiederholte deutsche Wortwurzel erhält den Zusammenhang zwischen Frage, Gegenfrage und Schluss.
- source_word: ⲛⲉⲣⲉ…ⲣⲱⲫⲉⲗⲉⲓ
  choice: wenn sie etwas nützen würde
  rationale: Die Konstruktion ist irreal beziehungsweise kontrafaktisch und wird im Deutschen natürlich mit Konjunktiv II wiedergegeben.
- source_word: ϫⲡⲟⲛ
  choice: hervorbringen
  rationale: Der Vater bleibt ausdrücklich Subjekt. „Hervorbringen“ ist im gegenwärtigen Deutsch verständlicher als „zeugen“ in Verbindung mit „aus ihrer Mutter“, ohne die ungewöhnliche Bildführung zu beseitigen.
- source_word: ⲉⲃⲟⲗ ϩⲛ ⲡⲉⲩⲙⲁⲁⲩ
  choice: aus ihrer Mutter
  rationale: Die Quellenkonstruktion bezeichnet den Ursprung; die körperliche Bildsprache des Koptischen bleibt erhalten.
- source_word: ⲉⲣⲉⲛⲧⲟⲟⲩ ⲥⲃⲃⲉ
  choice: bereits beschnitten
  rationale: Die Prädikativkonstruktion beschreibt ihren Zustand beim Hervorbringen. „Bereits“ verdeutlicht idiomatisch den zeitlichen Sinn, ohne eine zusätzliche theologische Aussage einzuführen.
- source_word: ⲁⲗⲗⲁ
  choice: Vielmehr
  rationale: Das Lehnwort führt einen korrigierenden Gegensatz ein.
- source_word: ⲡⲥⲃⲃⲉ ⲛⲙⲉ
  choice: die Beschneidung der Wahrheit
  rationale: Die formale Genitivfügung wird bewahrt und nicht stillschweigend zur eindeutigen Lesart „wahre Beschneidung“ aufgelöst.
- source_word: ϩⲛ ⲡⲛⲉⲩⲙⲁ
  choice: im Geist
  rationale: „Geist“ wahrt die personale wie nichtpersonale Deutungsmöglichkeit. Die deutsche Substantivschreibung erzwingt keine trinitarische Festlegung.
- source_word: ⲁϥϭⲛϩⲏⲩ ⲧⲏⲣϥ
  choice: ist in jeder Hinsicht nützlich geworden
  rationale: Die Wendung drückt vollständigen Nutzen aus; „nützlich“ wird aus dem vorausgehenden Verb ergänzt, damit die Ellipse im Deutschen verständlich bleibt.
theological_decisions:
- issue: Verhältnis von äußerer und geistiger Beschneidung
  choice: Der korrigierende Gegensatz wird wiedergegeben, ohne die äußere Beschneidung ausdrücklich als wertloses Gesetzesritual zu deuten.
  alternative: Die Aussage als generelle Verwerfung jüdischer Beschneidung ausformulieren.
  rationale: Der Text stellt den körperlichen Nutzen kontrafaktisch infrage und hebt die Beschneidung der Wahrheit im Geist hervor, erklärt aber weder Umfang noch dogmatische Folgerungen.
- issue: Bedeutung von „Geist“
  choice: „im Geist“ ohne erläuternden Zusatz
  alternative: „im Heiligen Geist“ oder „geistlich“
  rationale: Der koptische Text enthält keinen Zusatz „heilig“ und lässt offen, ob Geist als göttlicher Geist, geistige Sphäre oder innere Wirklichkeit verstanden wird.
- issue: Genitiv „der Wahrheit“
  choice: Die mehrdeutige Genitivform bleibt im Haupttext stehen.
  alternative: „die wahre Beschneidung“
  rationale: So bleibt offen, ob Wahrheit die Beschneidung näher bestimmt, ihr Wesen bezeichnet oder zu ihr in einer anderen Genitivbeziehung steht.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Rede. „Nützt … etwas?“ ist alltagssprachlich verständlich, ohne salopp zu wirken. Die auffällige Wendung „Beschneidung der Wahrheit“ wird wegen ihrer echten Deutungsoffenheit beibehalten; erklärungsbedürftige Einzelheiten stehen knapp in Fußnoten.
