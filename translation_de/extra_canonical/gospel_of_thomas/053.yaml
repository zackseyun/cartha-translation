  terminology: »Beschneidung«, »Beschneidung der Wahrheit« und »im Geist« sind treffend. Der Genitiv und die Ambiguität von »Geist« werden ohne konfessionelle Festlegung bewahrt. »Vielmehr« bildet ⲁⲗⲗⲁ angemessen ab.
