base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/063.yaml
  text: Jesus said[a], “There was a rich man who had a lot of money. He said, ‘I will use my money, so that I will sow and I will reap and I will plant, and I will fill my storehouses with produce, so that I will lack nothing.’ These were the things he was thinking in his heart. And in that night, he died. Whoever has ears[i][h][g][f][e][d][c][b], let that one hear.”
translation:
  language: de
  text: 'Jesus sagte: „Es gab einen reichen Mann, der viel Geld[a] besaß. Er sagte: ›Ich werde mein Geld einsetzen, damit ich säe, ernte und pflanze[b] und meine Vorratshäuser[c] mit Erzeugnissen fülle, damit mir nichts fehlt.‹ Dies waren die Dinge, an die er in seinem Herzen dachte. Und in jener Nacht starb er. Wer Ohren hat, soll hören.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das koptische ⲭⲣⲏⲙⲁ kann „Geld“, „Vermögen“ oder „Besitz“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Das Verb ⲧⲱⲱϭⲉ bedeutet hier „pflanzen“. Anders als in Lukas 12,18 steht im koptischen Text nicht „bauen“.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Scheunen“ beziehungsweise „Speicher“. Der koptische Ausdruck legt die genaue Art des Lagergebäudes nicht fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲛⲡⲗⲟⲩⲥⲓⲟⲥ
  choice: reich
  rationale: Das griechische Lehnwort πλούσιος bezeichnet unmittelbar einen wohlhabenden beziehungsweise reichen Menschen und bewahrt den gesellschaftlich-wirtschaftlichen Sinn.
- source_word: ⲭⲣⲏⲙⲁ
  choice: Geld
  rationale: Im Zusammenhang mit dem geplanten wirtschaftlichen Einsatz ist „Geld“ konkret und natürlich; der Ausdruck kann weiter gefasst auch Vermögen oder Besitz bezeichnen.
- source_word: ⲣⲭⲣⲱ
  choice: einsetzen
  rationale: „Einsetzen“ gibt den zweckgerichteten Gebrauch des Geldes im Deutschen idiomatisch wieder, ohne den Text um eine bestimmte Anlagestrategie zu erweitern.
- source_word: ϫⲉⲕⲁⲁⲥ
  choice: damit
  rationale: Die Konjunktion leitet ausdrücklich einen Zweck- beziehungsweise Finalsatz ein.
- source_word: ϫⲟ / ⲱϩⲥ / ⲧⲱⲱϭⲉ
  choice: säen / ernten / pflanzen
  rationale: Die drei landwirtschaftlichen Verben und ihre auffällige Reihenfolge werden bewahrt; insbesondere ist ⲧⲱⲱϭⲉ nicht als architektonisches „bauen“ wiederzugeben.
- source_word: ⲁϩⲟ
  choice: Vorratshäuser
  rationale: Der Ausdruck kann Scheunen, Speicher oder Vorratshäuser bezeichnen. „Vorratshäuser“ hält die Art des Lagergebäudes bewusst offen.
- source_word: ⲕⲁⲣⲡⲟⲥ
  choice: Erzeugnisse
  rationale: Das griechische Lehnwort καρπός kann Frucht oder Ertrag bedeuten; im Zusammenhang der Einlagerung bezeichnet „Erzeugnisse“ den landwirtschaftlichen Ertrag ohne unnötige Verengung auf Obst.
- source_word: ⲣϭⲣⲱϩ ⲛⲗⲁⲁⲩ
  choice: es mir an nichts fehlt
  rationale: Die negative Konstruktion bedeutet, dass der Mann in keinerlei Hinsicht Mangel leiden beziehungsweise etwas benötigen will.
- source_word: ⲡⲉⲧⲉⲟⲩⲛⲙⲁϫⲉ ⲛⲛⲧⲟϥ
  choice: Wer Ohren hat
  rationale: Die knappe Formel des koptischen Textes wird ohne den aus synoptischen Parallelen bekannten Zusatz „zu hören“ wiedergegeben.
theological_decisions:
- issue: Deutung des plötzlichen Todes des reichen Mannes
  choice: Der Tod wird knapp berichtet, ohne ausdrücklich als göttliches Gericht bezeichnet zu werden.
  alternative: Den Tod ausdrücklich als Strafe oder Gericht Gottes erklären.
  rationale: Der Text stellt Planung und Tod spannungsvoll nebeneinander, nennt jedoch weder Gott noch ein ausdrückliches Urteil. Die Übersetzung bewahrt diese Offenheit.
- issue: Schlussformel
  choice: „Wer Ohren hat, soll hören.“
  alternative: „Wer Ohren hat zu hören, soll hören.“
  rationale: Der koptische Text sagt lediglich „Wer Ohren hat“ und sollte nicht an die längere synoptische Formel angeglichen werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, knappem Erzählton. Die parataktische Struktur und die ungewöhnliche landwirtschaftliche Abfolge bleiben erkennbar. Die mehrfachen deutschen Zukunftsformen wurden innerhalb der Zweckkonstruktion idiomatisch gebündelt, ohne die einzelnen Handlungen auszulassen.
