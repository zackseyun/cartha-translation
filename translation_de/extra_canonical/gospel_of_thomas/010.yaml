base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/010.yaml
  text: Jesus said[a], “I have cast a fire upon the world, and look[c][b], I am guarding it until it blazes.”
translation:
  language: de
  text: 'Jesus sagte: „Ich habe ein Feuer auf die Welt geworfen[a], und seht[b]: Ich bewache es[c], bis es aufflammt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Vgl. Lukas 12,49: „Ich bin gekommen, Feuer auf die Erde zu werfen …“ Thomas spricht dagegen von der „Welt“ und fährt mit dem Bewachen des Feuers fort.'
    reason: cross_reference
  - marker: b
    text: Die deiktische Wendung ⲉⲓⲥϩⲏⲏⲧⲉ kann auch mit „siehe“, „schaut“ oder „achtet darauf“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: c
    text: ϩⲁⲣⲉϩ kann auch „behüten“, „überwachen“ oder „Wache halten über“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁⲁⲛⲟⲕ … ⲛⲟⲩϫⲉ
  choice: Ich habe … geworfen
  rationale: ⲛⲟⲩϫⲉ bedeutet „werfen, schleudern“. Das Perfekt gibt die abgeschlossene Handlung mit gegenwärtiger Bedeutung natürlich wieder; das betonte ⲁⲛⲟⲕ wird durch die ausdrückliche Nennung von „Ich“ bewahrt.
- source_word: ⲛⲟⲩⲕⲱϩⲧ
  choice: ein Feuer
  rationale: Der unbestimmte Artikel ⲛⲟⲩ- und die Grundbedeutung von ⲕⲱϩⲧ werden unmittelbar wiedergegeben.
- source_word: ⲉϫⲛⲡⲕⲟⲥⲙⲟⲥ
  choice: auf die Welt
  rationale: ⲉϫⲛ bezeichnet hier die Richtung beziehungsweise Lage „auf“, und das griechische Lehnwort ⲕⲟⲥⲙⲟⲥ wird im Deutschen natürlich mit „Welt“ wiedergegeben.
- source_word: ⲉⲓⲥϩⲏⲏⲧⲉ
  choice: seht
  rationale: Die deiktische Wendung ruft die Hörenden zur Aufmerksamkeit auf. „Seht“ ist gegenwärtig und würdevoll, ohne das altertümlichere „siehe“ zu erzwingen.
- source_word: ϩⲁⲣⲉϩ
  choice: bewache
  rationale: Das Verb bezeichnet Bewachen beziehungsweise Wachehalten. „Bewache“ bewahrt den möglichen schützenden Unterton und die andauernde Handlung.
- source_word: ⲉⲛⲧⲟϥ
  choice: es
  rationale: Das maskuline koptische Objektpronomen verweist auf ⲕⲱϩⲧ („Feuer“); wegen des sächlichen deutschen Substantivs ist „es“ erforderlich.
- source_word: ϣⲁⲛⲧⲉ
  choice: bis
  rationale: Die Konjunktion bezeichnet den zeitlichen Endpunkt der fortdauernden Handlung.
- source_word: ϫⲉⲣⲟ
  choice: aufflammt
  rationale: Das Verb bezeichnet ein Entbrennen oder Auflodern; „aufflammt“ erhält die dynamische Bildkraft.
theological_decisions:
- issue: Bedeutung des Feuers
  choice: Das Bild bleibt ohne erklärenden theologischen Zusatz stehen.
  alternative: Das Feuer ausdrücklich als Gericht, Läuterung, Offenbarung oder geistliche Entzündung deuten.
  rationale: Der Spruch selbst bestimmt die symbolische Bedeutung des Feuers nicht. Eine Festlegung würde die echte theologische Offenheit des Textes auflösen.
- issue: Jesu Verhältnis zum Feuer
  choice: „Ich bewache es“ gibt die fortdauernde Aufsicht wieder, ohne ihren Zweck näher zu bestimmen.
  alternative: „Ich schütze es“ oder eine Deutung als Förderung beziehungsweise Eindämmung des Feuers.
  rationale: ϩⲁⲣⲉϩ kann Bewachen, Behüten oder Wachehalten bedeuten. Die gewählte Form wahrt die Spannung, ob das Feuer geschützt, beaufsichtigt oder unter Kontrolle gehalten wird.
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdevoller Redeform. „Seht“ erhält den unmittelbaren Aufmerksamkeitsruf, während „bewache“ die absichtsvoll mehrdeutige Rolle Jesu gegenüber dem Feuer nicht vorschnell erklärt.
