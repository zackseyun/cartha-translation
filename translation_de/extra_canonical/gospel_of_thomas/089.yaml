base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/089.yaml
  text: Jesus said[3][2][1], "Why do you wash the outside of the cup?[1] Do you not know[2] that the one who made[3] the inside is also the one who made[3] the outside?"
translation:
  language: de
  text: 'Jesus sagte: „Warum wascht ihr die Außenseite des Bechers?[a] Wisst ihr nicht,[b] dass der, der die Innenseite gemacht hat,[c] auch die Außenseite gemacht hat?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die äußere Seite des Bechers“. Entsprechend steht später „die innere Seite“.'
    reason: literal_rendering
  - marker: b
    text: Das koptische Verb kann auch „versteht ihr nicht?“ oder „erkennt ihr nicht?“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: „Gemacht“ gibt ein anderes Verb wieder als das zuvor verwendete „wascht“; möglich wären auch „geschaffen“ oder „geformt“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲉⲓⲱⲉ
  choice: waschen
  rationale: Das Verb bezeichnet hier konkret das Waschen eines Gefäßes; „reinigen“ wäre weniger anschaulich und könnte einen stärker kultischen Unterton eintragen.
- source_word: ⲡⲥⲁ ⲛⲃⲟⲗ / ⲡⲥⲁ ⲛϩⲟⲩⲛ
  choice: Außenseite / Innenseite
  rationale: Die parallelen koptischen Wendungen bezeichnen wörtlich die äußere beziehungsweise innere Seite. Das deutsche Begriffspaar bewahrt sowohl den räumlichen Gegensatz als auch den Parallelismus.
- source_word: ⲡⲡⲟⲧⲏⲣⲓⲟⲛ
  choice: Becher
  rationale: Das griechische Lehnwort ποτήριον bezeichnet einen Trinkbecher; „Becher“ ist im Deutschen konkret und unmarkiert.
- source_word: ⲛⲟⲉⲓ
  choice: wissen
  rationale: Das Verb kann auch „verstehen“ oder „erkennen“ bedeuten. „Wissen“ hält den unmittelbaren kognitiven Sinn offen, ohne die Aussage stärker auszulegen.
- source_word: ⲧⲁⲙⲓⲟ
  choice: machen
  rationale: Das Verb bedeutet „machen, schaffen, formen“ und ist vom zuvor gebrauchten Verb für „waschen“ zu unterscheiden. „Machen“ gibt den schlichten, wiederholten Ausdruck des Koptischen wieder.
- source_word: ⲟⲛ
  choice: auch
  rationale: Das Adverb verbindet denselben Urheber mit Innen- und Außenseite und wird im Deutschen natürlich mit „auch“ wiedergegeben.
theological_decisions:
- issue: Identität dessen, der Innen- und Außenseite gemacht hat
  choice: die maskuline, aber nicht näher bestimmte Formulierung „der, der … gemacht hat“ bewahren
  alternative: ausdrücklich „der Schöpfer“ oder „Gott“ einsetzen
  rationale: Der koptische Text nennt den Handelnden nicht ausdrücklich. Die Übersetzung bewahrt diese Offenheit und vermeidet eine theologische Präzisierung, die über den Wortlaut hinausginge.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter, knapper Satzführung. Die Anrede steht im Plural, entsprechend dem koptischen Text. Der parallele Gegensatz von Außen- und Innenseite sowie die Wiederholung von „gemacht hat“ bleiben bewusst erhalten.
