base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/014.yaml
  text: Jesus said to them[1], "If you fast, you will acquire a sin for yourselves; and if you pray, you will be condemned; and if you give alms, you will do evil to your spirits. And if you go into any land and walk in the regions, if they receive you, eat what they set before you, and heal the sick among them. For what goes into your mouth will not defile you, but what comes out of your mouth[3][2], that is what will defile you."
translation:
  language: de
  text: 'Jesus sagte zu ihnen: „Wenn ihr fastet, werdet ihr euch eine Sünde zuziehen; und wenn ihr betet, wird man euch verurteilen[a]; und wenn ihr Almosen gebt, werdet ihr euren Geistern Böses tun. Wenn ihr in irgendein Land kommt und durch die Gegenden zieht und man euch aufnimmt, dann esst, was man euch vorsetzt, und heilt die Kranken unter ihnen[b]. Denn was in euren Mund hineingeht, wird euch nicht unrein machen; vielmehr wird euch das unrein machen, was aus eurem Mund herauskommt.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Sie werden euch verurteilen.“ Die unbestimmte Mehrzahl kann wie ein Passiv gebraucht werden.'
    reason: Die koptische Konstruktion lässt die Handelnden ungenannt; die Fußnote dokumentiert die wörtlichere Form.
  - marker: b
    text: 'Der koptische Text hebt die beiden Satzteile hervor: „Was man euch vorsetzen wird, esst; die Kranken unter ihnen, heilt.“'
    reason: Die markierte Wortstellung des Ausgangstextes lässt sich in natürlichem Deutsch nicht vollständig nachbilden.
lexical_decisions:
- source_word: ϫⲡⲟ
  choice: sich eine Sünde zuziehen
  rationale: Das Verb kann „zeugen, erwerben, erlangen“ bedeuten. In Verbindung mit „Sünde“ gibt „sich zuziehen“ den Gedanken wieder, dass die Fastenden sich selbst Sünde einhandeln, ohne die provozierende Aussage abzuschwächen.
- source_word: ⲕⲁⲧⲁⲕⲣⲓⲛⲉ
  choice: verurteilen
  rationale: Das griechische Lehnwort bezeichnet ein verurteilendes Urteil. Die unbestimmte dritte Person Plural wird im Deutschen natürlich mit „man“ wiedergegeben.
- source_word: ⲉⲗⲉⲏⲙⲟⲥⲩⲛⲏ
  choice: Almosen
  rationale: Das griechische Lehnwort bezeichnet eine mildtätige Gabe. „Almosen geben“ bewahrt den religiösen und sozialen Kontext der Aussage.
- source_word: ⲕⲱ ϩⲁ-
  choice: vorsetzen
  rationale: Die Wendung bedeutet im Zusammenhang der Gastfreundschaft, jemandem Speise hinzustellen beziehungsweise vorzusetzen.
- source_word: ϫⲱϩⲙ
  choice: unrein machen
  rationale: Das Verb bezeichnet Verunreinigung oder Befleckung. „Unrein machen“ ist verständlich und lässt sowohl rituelle als auch moralische Konnotationen offen.
- source_word: ⲡⲛⲉⲩⲙⲁ
  choice: Geister
  rationale: Der Text hat den Plural mit Bezug auf die Angeredeten. „Geister“ bildet diese auffällige Form ab, statt sie interpretierend zu „Seelen“ oder zum Singular umzudeuten.
theological_decisions:
- issue: Provokative Kritik an Fasten, Gebet und Almosengeben
  choice: Die negativen Folgen werden direkt und ohne abschwächende Ergänzung wiedergegeben.
  alternative: Die Aussage durch Bedingungen wie „wenn ihr es heuchlerisch tut“ begrenzen.
  rationale: Solche Einschränkungen stehen nicht im koptischen Text. Seine Spannung gegenüber herkömmlichen Frömmigkeitsübungen soll erhalten bleiben.
- issue: Verunreinigung durch das, was aus dem Mund kommt
  choice: „unrein machen“
  alternative: „beflecken“ oder „verunreinigen“
  rationale: Die Formulierung wahrt die Spannung zwischen körperlicher beziehungsweise ritueller und moralischer Unreinheit, ohne die Aussage auf bestimmte Worte oder Speisen festzulegen.
- issue: „euren Geistern“ im Plural
  choice: Plural beibehalten
  alternative: „eurem Geist“ oder „euren Seelen“
  rationale: Der koptische Wortlaut verbindet das Possessiv der zweiten Person Plural mit „Geist“ in einer Weise, die kollektiv als „euren Geistern“ wiedergegeben werden kann. Eine Vereinheitlichung zum Singular wäre interpretierend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede im Plural. Die kurzen, parallelen Wenn-Sätze und die schroffe Umkehrung vertrauter Frömmigkeitswerte bleiben erhalten. „Durch die Gegenden zieht“ gibt die Bewegung und den pluralischen Ortsausdruck wieder; „unter ihnen“ bezieht die Kranken auf die aufnehmenden Menschen.
