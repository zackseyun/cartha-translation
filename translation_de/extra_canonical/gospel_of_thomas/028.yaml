base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/028.yaml
  text: Jesus said[1], "I stood in the midst of the world, and I appeared to them in flesh.[1] I found them all drunk; I found not one of them thirsting.[2] And my soul was pained over the children of humanity,[3] for they are blind in their heart and they do not see that they came into the world empty, seeking also to go out of the world empty.[4] But now they are drunk. When they have shaken off their wine[a][5][4][3][2], then they will repent."[5]
translation:
  language: de
  text: 'Jesus sagte: »Ich stand mitten in der Welt und offenbarte mich ihnen im Fleisch.[a] Ich fand sie alle betrunken; keinen unter ihnen fand ich durstig. Und meine Seele empfand Schmerz über die Menschenkinder,[b] denn sie sind blind in ihrem Herzen und sehen nicht: Leer sind sie in die Welt gekommen, und sie suchen auch, leer aus der Welt hinauszugehen. Doch jetzt sind sie betrunken. Wenn sie ihren Wein abgeschüttelt haben,[c] werden sie umkehren.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Offenbarte mich“ kann auch mit „erschien“ oder „leuchtete hervor“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „über die Kinder der Menschen“ beziehungsweise „über die Menschensöhne“.'
    reason: literal_rendering
  - marker: c
    text: 'Der bildhafte Ausdruck kann auch verstanden werden als: „Wenn ihr Wein von ihnen gewichen ist“ oder sinngemäß: „Wenn sie nüchtern geworden sind“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲱϩⲉ ⲉⲣⲁⲧ ϩⲛⲡⲙⲏⲧⲉ ⲛⲡⲕⲟⲥⲙⲟⲥ
  choice: stand mitten in der Welt
  rationale: Gibt die Wendung für das Einnehmen eines Standorts knapp und in natürlichem, würdigem Deutsch wieder.
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: mich offenbarte
  rationale: Das Verb kann Sichtbarwerden, Offenbarwerden oder Hervorleuchten bezeichnen. „Offenbarte mich“ bewahrt diese stärkere Nuance besser als das neutralere „erschien“.
- source_word: ϩⲛⲥⲁⲣⲝ
  choice: im Fleisch
  rationale: Bewahrt den markanten Ausdruck mit dem griechischen Lehnwort für „Fleisch“, ohne ihn zu „in einem Körper“ abzuschwächen.
- source_word: ⲧⲁϩⲟ / ⲧⲟϩⲉ
  choice: betrunken
  rationale: Die konkrete Bedeutung passt zum später ausdrücklich genannten Wein und erhält das durchgehende Bild.
- source_word: ⲟⲃⲉ
  choice: durstig
  rationale: Die negative Aussage „keinen ... durstig“ entspricht dem koptischen Manuskript und wird vom griechischen POxy-Zeugen ausdrücklich gestützt.
- source_word: ⲯⲩⲭⲏ ϯⲧⲕⲁⲥ
  choice: meine Seele empfand Schmerz
  rationale: Bewahrt sowohl „Seele“ als auch die starke Schmerz- beziehungsweise Kummeraussage der koptischen Redewendung.
- source_word: ϣⲏⲣⲉ ⲛⲣⲣⲱⲙⲉ
  choice: Menschenkinder
  rationale: Eine natürliche deutsche Wiedergabe des wörtlichen Ausdrucks „Kinder/Söhne der Menschen“, ohne ihn auf männliche Personen einzuengen.
- source_word: ϣⲟⲩⲉⲓⲧ
  choice: leer
  rationale: Erhält die knappe Wiederholung und die Spannung zwischen Eintritt in die Welt und Austritt aus ihr.
- source_word: ⲟⲛ
  choice: wieder
  rationale: Das Adverb kann „wieder“ oder „auch“ bedeuten. „Wieder“ stellt die symmetrische Bewegung in die Welt hinein und aus ihr hinaus heraus, ohne eine dogmatische Deutung hinzuzufügen.
- source_word: ⲛⲟⲩϩⲉ ⲡⲉⲩⲏⲣⲡ
  choice: ihren Wein abgeschüttelt haben
  rationale: Folgt dem bildhaften Ausdruck eng; die sinngemäße Bedeutung „nüchtern werden“ wird nicht an die Stelle des Bildes gesetzt.
- source_word: ⲣⲙⲉⲧⲁⲛⲟⲉⲓ
  choice: umkehren
  rationale: Gibt die Bedeutung von metanoein als Sinnesänderung und Umkehr in verständlichem Deutsch wieder, ohne sie auf bloßes Bedauern zu verengen.
theological_decisions:
- issue: Art der Offenbarung im Fleisch
  choice: offenbarte mich ihnen im Fleisch
  alternative: erschien ihnen im Fleisch
  rationale: Die Übersetzung bewahrt sowohl die leiblich-fleischliche Aussage als auch das Bedeutungsspektrum des Verbs, ohne eine bestimmte Inkarnationslehre in den Text hineinzulesen.
- issue: Bedeutung des Leer-Seins
  choice: Leer sind sie in die Welt gekommen ... leer ... hinauszugehen
  alternative: nackt sind sie ... gekommen ... hinauszugehen
  rationale: Das koptische Wort bezeichnet hier „leer“. Die Wiederholung bleibt ohne Erklärung stehen, damit die anthropologische oder spirituelle Spannung nicht vorschnell auf eine bestimmte Lehre festgelegt wird.
- issue: Metanoia am Schluss
  choice: werden sie umkehren
  alternative: werden sie bereuen / ihren Sinn ändern
  rationale: „Umkehren“ lässt die ethische und innere Dimension offen und vermeidet sowohl eine rein emotionale als auch eine konfessionell festgelegte Lesart.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, leicht gehobenem Ton. Die kurzen Bildfolgen und Wiederholungen des koptischen Textes bleiben erhalten. Ungewöhnliche Bilder werden nicht im Haupttext aufgelöst, sondern nur knapp in Fußnoten erläutert.
