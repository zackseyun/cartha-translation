base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/048.yaml
  text: Jesus said[a], "If two make peace with each other in this one house, they will say to the mountain[c][b], ‘Move away,’ and it will move."
translation:
  language: de
  text: 'Jesus sagte: „Wenn zwei in diesem einen Haus miteinander Frieden schließen[a], werden sie zu dem Berg sagen: ‚Bewege dich fort!‘[b] Und er wird sich bewegen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „In diesem einen Haus“ kann auch „in einem einzigen Haus“ oder „in demselben Haus“ bedeuten; ⲟⲩⲱⲧ umfasst die Bedeutungen „einer“, „einzig“ und „derselbe“.
    reason: lexical_alternative
  - marker: b
    text: „Bewege dich fort“ gibt ⲉⲃⲟⲗ („hinaus, fort, weg“) wieder; möglich wären auch „Geh fort“ oder schlicht „Bewege dich“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲉⲣϣⲁⲛ
  choice: wenn
  rationale: Die prospektive Konditionalform leitet hier eine Bedingung ein; „wenn“ bewahrt den konditionalen Charakter des gnomischen Satzes.
- source_word: ⲥⲛⲁⲩ
  choice: zwei
  rationale: Direkte Wiedergabe der Kardinalzahl, ohne im Deutschen Personenbezeichnungen hinzuzufügen.
- source_word: ⲣⲉⲓⲣⲏⲛⲏ
  choice: Frieden schließen
  rationale: Die Konstruktion mit dem griechischen Lehnwort für „Frieden“ bezeichnet hier ein gegenseitiges Herstellen von Frieden; die deutsche Wendung ist natürlich und wahrt den aktiven Sinn.
- source_word: ⲙⲛ ⲡⲟⲩⲉⲣⲏⲩ
  choice: miteinander
  rationale: Die wörtlich auf Gefährten oder Freunde bezogene Wendung dient idiomatisch dem Ausdruck der Gegenseitigkeit.
- source_word: ϩⲛ ⲡⲉⲓⲏⲓ ⲟⲩⲱⲧ
  choice: in diesem einen Haus
  rationale: „Diesem“ bewahrt den deiktischen Ausdruck, und „einen“ gibt das nachgestellte ⲟⲩⲱⲧ wieder, ohne dessen mögliche Bedeutungen „einzig“ oder „dasselbe“ festzulegen.
- source_word: ⲛⲧⲟⲟⲩⲛⲁϫⲱⲛⲧⲟⲥ ⲛⲡⲧⲟⲟⲩ
  choice: werden sie zu dem Berg sagen
  rationale: Die Zukunftsform und das Verb „sagen“ werden direkt wiedergegeben; der pronominale Rückbezug ist im natürlichen Deutschen zusammen mit „dem Berg“ nicht eigens auszudrücken.
- source_word: ϫⲉⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ
  choice: Bewege dich fort!
  rationale: Der Imperativ gibt den Aufforderungscharakter wieder; „fort“ bewahrt die durch ⲉⲃⲟⲗ bezeichnete Bewegung weg beziehungsweise hinaus.
- source_word: ⲛⲧⲟϥⲛⲁⲡⲱⲱⲛⲉ
  choice: und er wird sich bewegen
  rationale: Das maskuline Pronomen bezieht sich auf den Berg; daher steht im Deutschen „er“. Das reflexive „sich bewegen“ ist die natürliche intransitive Wiedergabe.
theological_decisions:
- issue: Art des Friedens zwischen den beiden
  choice: Frieden schließen
  alternative: in Frieden miteinander leben / miteinander im Frieden sein
  rationale: Der Text lässt offen, ob eine Versöhnungshandlung oder ein Zustand gemeint ist. „Frieden schließen“ bewahrt den aktiven Ausdruck, ohne eine besondere ekklesiologische oder mystische Deutung einzutragen.
- issue: Bedeutung des Hauses und der zwei
  choice: wörtlich und unbestimmt belassen
  alternative: symbolisch als Gemeinde, Körper oder innere Einheit deuten
  rationale: Der Spruch erklärt seine Bildsprache nicht. Die Übersetzung identifiziert weder das Haus noch die beiden mit einer bestimmten theologischen Größe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Formulierung „diesem einen Haus“ bleibt bewusst erhalten, um die markierte Einheitssprache des Koptischen nicht zu glätten. Die knappe, spruchhafte Struktur und die Spannung zwischen zwischenmenschlichem Frieden und der Vollmacht über den Berg werden bewahrt.
