base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/001.yaml
  text: And he said, "Whoever finds the interpretation[1] of these sayings[2] will not taste death[3]."
translation:
  language: de
  text: 'Und er sagte: »Wer die Deutung[a] dieser Worte[b] findet, wird den Tod nicht schmecken.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »Auslegung« oder »Erklärung«. »Deutung« gibt den hermeneutischen Sinn von ⲡϩⲉⲣⲙⲏⲛⲉⲓⲁ wieder, einem Lehnwort aus dem Griechischen (ἑρμηνεία).'
    reason: lexical_alternative
  - marker: b
    text: 'Das Manuskript weist hier eine pluralische, lycopolitanisch gefärbte Form auf: »diese Worte«. Die normalisierte Textform ist singularisch; auch das griechische Fragment POxy 654 stützt jedoch den Plural.'
    reason: textual_dialect_note
  - marker: c
    text: »Den Tod schmecken« ist eine feste bildhafte Wendung im Sinn von »den Tod erfahren« oder »sterben«.
    reason: cultural_note
lexical_decisions:
- source_word: ⲁⲩⲱ
  choice: Und
  rationale: Bewahrt die knappe Verknüpfung mit dem vorausgehenden Rahmen des Spruches.
- source_word: ⲡⲉϫⲉⲛⲧⲟϥ
  choice: er sagte
  rationale: Schlichte und natürliche Wiedergabe des gewöhnlichen narrativen Verbs des Sprechens.
- source_word: ϫⲉ
  choice: durch Doppelpunkt und Anführungszeichen wiedergegeben
  rationale: Die koptische Quotativpartikel leitet direkte Rede ein; deutsche Zeichensetzung gibt ihre Funktion idiomatisch wieder.
- source_word: ⲡⲉⲧⲉⲣⲉⲛⲁϩⲉ
  choice: Wer … findet
  rationale: Gibt die generische Relativkonstruktion knapp wieder und vermeidet ein zusätzliches geschlechtsspezifisches Pronomen.
- source_word: ⲡϩⲉⲣⲙⲏⲛⲉⲓⲁ
  choice: Deutung
  rationale: Spiegelt den hermeneutischen Sinn des griechischen Lehnworts wider und klingt im Deutschen bei überlieferten Worten natürlicher als das fachsprachlichere »Interpretation«.
- source_word: ⲛ̄ⲛⲉⲉⲓϣⲁϫⲉ / ⲛⲡⲉⲓϣⲁϫⲉ
  choice: dieser Worte
  rationale: Folgt der pluralischen Form des Manuskripts und dem griechischen Parallelzeugen POxy 654; »Worte« bewahrt die Breite von ϣⲁϫⲉ und passt zum Sammlungskontext.
- source_word: ⲛⲧⲟϥ
  choice: im fortgeführten »Wer« enthalten
  rationale: Das selbstständige Pronomen nimmt das generische Subjekt wieder auf; im Deutschen ist keine ausdrückliche Wiederholung nötig.
- source_word: ϥⲛⲁ … ⲁⲛ
  choice: wird … nicht
  rationale: Gibt Futur und Negation in natürlicher deutscher Wortstellung wieder.
- source_word: ϫⲓϯ … ⲛⲡⲙⲟⲩ
  choice: den Tod … schmecken
  rationale: Erhält die markante Metapher des Originals statt sie mit »erleben« aufzulösen.
theological_decisions:
- issue: Bedeutung der Verheißung, den Tod nicht zu schmecken
  choice: Die bildhafte Aussage bleibt unaufgelöst.
  alternative: Ausdeutung als leibliche Unsterblichkeit, Bewahrung vor geistlichem Tod oder endgültiges Heil.
  rationale: Der Spruch bestimmt die Art des Todes nicht näher; die Übersetzung soll diese theologische Spannung nicht durch eine konfessionelle oder spekulative Festlegung beseitigen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdiger Spruchform. Die ungewöhnliche Todesmetapher und die inhaltliche Offenheit von »Deutung« werden bewusst bewahrt.
