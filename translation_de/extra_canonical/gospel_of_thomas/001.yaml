  verdict: approve
  source_fidelity: 'Die Übersetzung gibt den sahidisch-lycopolitanischen Text präzise wieder: die generische Relativkonstruktion (»Wer … findet«), das Futur mit Negation sowie die bildhafte Wendung »den Tod schmecken« bleiben erhalten. Die pluralische Wiedergabe »dieser Worte« folgt sinnvoll der Handschriftenform und wird durch den griechischen Parallelzeugen gestützt, während die abweichende normalisierte Singularform korrekt dokumentiert ist.'
  naturalness: Modernes Standarddeutsch, knapp und würdig. »Und er sagte« und »Wer die Deutung dieser Worte findet, wird den Tod nicht schmecken« sind idiomatisch und bewahren zugleich den prägnanten Spruchcharakter.
  terminology: »Deutung« ist für ⲡϩⲉⲣⲙⲏⲛⲉⲓⲁ eine tragfähige, nicht übermäßig fachsprachliche Wiedergabe; die Fußnote weist angemessen auf »Auslegung« und »Erklärung« hin. »Worte« ist für ϣⲁϫⲉ lexikalisch möglich und angesichts der textlichen Pluralfrage neutral. Die Todesmetapher wird ohne theologische Einengung beibehalten.
