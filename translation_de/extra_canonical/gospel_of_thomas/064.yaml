  to: '**Jesus sagte:** „Ein Mann hatte Gäste. Nachdem er das Mahl vorbereitet hatte, sandte er seinen Diener aus, damit dieser die Gäste einlade. Der Diener ging zum ersten und sagte zu ihm: ‚Mein Herr lädt dich ein.‘ Der antwortete: ‚Ich habe Geld bei einigen Kaufleuten. Sie kommen heute Abend zu mir. Ich werde hingehen und ihnen Anweisungen geben. Bitte entschuldige mich vom Mahl.‘


    Der Diener ging zu einem anderen und sagte zu ihm: ‚Mein Herr hat dich eingeladen.[a]‘ Der antwortete ihm: ‚Ich habe ein Haus gekauft, und man braucht mich für einen Tag. Ich werde keine Zeit haben.‘


    Er ging zu einem anderen und sagte zu ihm: ‚Mein Herr lädt dich ein.‘ Der antwortete ihm: ‚Mein Freund wird heiraten, und ich werde das Mahl ausrichten. Ich werde nicht kommen.[b] Bitte entschuldige mich vom Mahl.‘


    Er ging zu einem anderen und sagte zu ihm: ‚Mein Herr lädt dich ein.‘ Der antwortete ihm: ‚Ich habe ein Dorf gekauft. Ich gehe, um die Pacht einzuziehen. Ich werde nicht kommen.[b] Bitte entschuldige mich.‘


    Der Diener kam und sagte zu seinem Herrn: ‚Diejenigen, die du zum Mahl eingeladen hast, haben sich entschuldigt.‘ Da sagte der Herr zu seinem Diener: ‚Geh hinaus auf die Straßen. Alle, die du dort findest, bring her, damit sie am Mahl teilnehmen. Käufer und Händler[d] werden nicht[c] in den Ort meines Vaters hineingehen.‘“'
