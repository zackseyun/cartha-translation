base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/064.yaml
  text: Jesus said[1], "A man had some guests. And when he had prepared the dinner, he sent his servant so that he might invite the guests. He went to the first. He said to him, 'My master invites you.' He said, 'I have some money with some merchants; they are coming to me in the evening. I will go to give them orders. I excuse myself from the dinner.' He went to another. He said to him[2], 'My master has invited you.' He said to him, 'I have bought a house, and they are asking for me for a day. I will not have time.' He came to another. He said to him, 'My master invites you.' He said to him, 'My friend is going to marry, and I am the one who will make the dinner. I will not go. I excuse myself from the dinner.' He went to another. He said to him, 'My master invites you.' He said to him, 'I have bought a village. I am going to collect rent. I will not go. I excuse myself.' The servant came. He said to his master, 'Those whom you invited to the dinner have excused themselves.' The master
    said to his servant, 'Go outside to the streets. Those whom you will find, bring them, so that they may dine[4][3]. Buyers and merchants will not enter the places of my father.'"
translation:
  language: de
  text: '**Jesus sagte:** „Ein Mann hatte Gäste. Nachdem er das Mahl vorbereitet hatte, sandte er seinen Diener aus, damit dieser die Gäste einlade. Der Diener ging zum ersten und sagte zu ihm: ‚Mein Herr lädt dich ein.‘ Der antwortete: ‚Ich habe Geld bei einigen Kaufleuten. Sie kommen heute Abend zu mir. Ich werde hingehen und ihnen Anweisungen geben. Bitte entschuldige mich vom Mahl.‘


    Der Diener ging zu einem anderen und sagte zu ihm: ‚Mein Herr hat dich eingeladen.[a]‘ Der antwortete ihm: ‚Ich habe ein Haus gekauft, und man braucht mich für einen Tag. Ich werde keine Zeit haben.‘


    Er ging zu einem anderen und sagte zu ihm: ‚Mein Herr lädt dich ein.‘ Der antwortete ihm: ‚Mein Freund wird heiraten, und ich werde das Mahl ausrichten. Ich werde nicht kommen.[b] Bitte entschuldige mich vom Mahl.‘


    Er ging zu einem anderen und sagte zu ihm: ‚Mein Herr lädt dich ein.‘ Der antwortete ihm: ‚Ich habe ein Dorf gekauft. Ich gehe, um die Pacht einzuziehen. Ich werde nicht kommen.[b] Bitte entschuldige mich.‘


    Der Diener kam und sagte zu seinem Herrn: ‚Diejenigen, die du zum Mahl eingeladen hast, haben sich entschuldigt.‘ Da sagte der Herr zu seinem Diener: ‚Geh hinaus auf die Straßen. Alle, die du dort findest, bring her, damit sie am Mahl teilnehmen. Käufer und Händler[d] werden nicht[c] in den Ort meines Vaters hineingehen.‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nur bei dieser zweiten Einladung steht im Koptischen die vollendete Form „hat dich eingeladen“; bei den übrigen heißt es „lädt dich ein“.
    reason: textual_variant
  - marker: b
    text: Die koptische Form ϣⲓ ist eine Variante des Verbs „gehen“. Sie bedeutet hier nicht „fähig sein“; daher lautet der Satz „Ich werde nicht kommen“ und nicht „Ich werde nicht können“.
    reason: lexical_alternative
  - marker: c
    text: Die Handschrift ist an dieser Stelle beschädigt. Die sinngemäße Ergänzung „werden nicht … hineingehen“ entspricht den sichtbaren Buchstabenresten und dem verfügbaren Raum.
    reason: textual_variant
  - marker: d
    text: Anders als die verwandten Mahlgleichnisse in Matthäus 22,1–10 und Lukas 14,16–24 bündelt diese Fassung die Absagen um Besitz und Geschäfte und endet ausdrücklich mit „Käufer und Händler“.
    reason: literary_context
lexical_decisions:
- source_word: ϣⲙⲙⲟ
  choice: Gäste
  rationale: Das Wort bezeichnet grundsätzlich Fremde oder Außenstehende; im Zusammenhang mit Einladung und Mahl sind sie als Gäste gemeint.
- source_word: ϩⲙϩⲁⲗ
  choice: Diener
  rationale: Das koptische Wort kann einen Diener oder Sklaven bezeichnen. „Diener“ passt zur Botenrolle, ohne den möglichen niedrigen sozialen Status zu leugnen.
- source_word: ϩⲟⲙⲧ
  choice: Geld
  rationale: Wörtlich bezeichnet das Wort Kupfer, wird hier aber als Zahlungsmittel beziehungsweise Geld gebraucht. Die konkrete wirtschaftliche Angabe bleibt erhalten.
- source_word: ⲟⲩⲉϩⲥⲁϩⲛⲉ
  choice: Anweisungen geben
  rationale: Das zusammengesetzte Verb bedeutet befehlen oder Anweisungen erteilen.
- source_word: ⲥⲣϥⲉ
  choice: Zeit haben
  rationale: Das Verb bedeutet Muße oder verfügbare Zeit haben.
- source_word: ϣⲓ
  choice: kommen
  rationale: Hier liegt eine dialektale Form von ϣⲉ, „gehen“, vor und nicht das Verb „können“. Im Deutschen ist wegen der Einladung „kommen“ idiomatisch und entspricht der Bewegungsrichtung zum Mahl.
- source_word: ϫⲓ ⲛϣⲱⲙ
  choice: die Pacht einziehen
  rationale: Die Wendung bezeichnet das Einnehmen von Pacht oder Miete; bei einem gekauften Dorf ist „Pacht“ die natürliche deutsche Entsprechung.
- source_word: ⲣⲉϥⲧⲟⲟⲩ
  choice: Käufer
  rationale: Das Agensnomen bezeichnet Personen, die kaufen. Die ungewöhnlich scharfe Schlussformulierung wird nicht verallgemeinert.
- source_word: ϣⲟⲧⲉ
  choice: Händler
  rationale: Das Wort bezeichnet Händler oder Kaufleute. „Händler“ vermeidet im Schlusssatz eine unnötige stilistische Dopplung mit „Käufer“.
- source_word: ⲧⲟⲡⲟⲥ
  choice: Orte
  rationale: Das griechische Lehnwort wird entsprechend der überlieferten pluralischen Fassung mit „Orte“ wiedergegeben, obwohl die Formulierung im Deutschen ungewöhnlich bleibt.
theological_decisions:
- issue: Schlusswort über Käufer und Händler
  choice: „Käufer und Händler werden nicht in die Orte meines Vaters hineingehen.“
  alternative: Eine Harmonisierung mit den synoptischen Gleichnissen oder eine Verallgemeinerung zu „Geschäftsleute gelangen nicht ins Reich Gottes“
  rationale: Der Thomastext verbindet die Absagen ausdrücklich mit Besitz und Handel und schließt mit dieser eigenständigen Aussage. Die Übersetzung bewahrt ihre Spannung, ohne „Orte meines Vaters“ als bestimmten theologischen Fachbegriff auszudeuten.
- issue: Bezeichnung des Hausherrn und seines Dieners
  choice: „Herr“ und „Diener“
  alternative: „Besitzer“ und „Sklave“
  rationale: Die gewählten Wörter geben die soziale Beziehung und die wiederholte Anrede wieder, ohne eine unmittelbare allegorische Identifikation des Herrn mit Gott vorwegzunehmen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die wiederkehrenden Einladungs- und Absageformeln bleiben erkennbar, werden jedoch idiomatisch formuliert. Ungewöhnliche oder spannungsreiche Aussagen des koptischen Textes, besonders „die Orte meines Vaters“, werden nicht harmonisiert oder dogmatisch erklärt.
