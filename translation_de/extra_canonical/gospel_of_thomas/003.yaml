revisions:
- from: 'Jesus sagte: „Wenn die, die euch führen[a], zu euch sagen: ‚Seht, das Reich ist im Himmel[b]‘, dann werden die Vögel des Himmels euch zuvorkommen. Wenn sie zu euch sagen: ‚Es ist im Meer‘, dann werden die Fische euch zuvorkommen. Vielmehr ist das Reich in euch und außerhalb von euch.[c] Wenn ihr euch selbst erkennt, dann wird man euch erkennen[d], und ihr werdet begreifen, dass ihr die Kinder des lebendigen Vaters seid. Wenn ihr euch selbst aber nicht erkennt, dann lebt ihr in Armut, und ihr seid die Armut.“[e]


    [a] Das koptische Wort kann „ziehen“ oder „führen“ bedeuten. Dass diese Menschen die Angesprochenen irreführen, wird nicht ausdrücklich gesagt.


    [b] „Himmel“ bezeichnet hier den sichtbaren Himmel, wie die anschließende Erwähnung der Vögel zeigt; dasselbe Wort kann auch „Himmel“ im religiösen Sinn bedeuten.


    [c] Im koptischen Text steht nur „das Reich“, nicht „das Reich Gottes“.


    [d] Wörtlich: „Dann werden sie euch erkennen.“ Die unbestimmte dritte Person Mehrzahl kann im Sahidischen einen passivischen Sinn ausdrücken, ohne zu benennen, wer erkennt.


    [e] Alle Formen von „ihr“ und „euch“ sind im koptischen Text Mehrzahl. Die Handschrift liest hier „die Kinder“; damit stimmt auch der griechische Textzeuge POxy 654 überein.'
