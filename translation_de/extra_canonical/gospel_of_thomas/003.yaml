base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/003.yaml
  text: Jesus says[a], "If those who lead you say to you, 'Look, the kingdom is in the sky,' then the birds of the sky will precede you. If they say to you, 'It is in the sea,' then the fish will precede you. Rather, the kingdom is inside you and it is outside you. When you come to know yourselves, then you will be known, and you will realize that you are the children of the living Father. But if you do not know yourselves[b], you are in poverty[i][h][g][f][e][d][c], and you are poverty."
translation:
  language: de
  text: 'Jesus sagte: „Wenn die, die euch führen[a], zu euch sagen: ‚Seht, das Reich ist im Himmel[b]‘, dann werden die Vögel des Himmels euch zuvorkommen. Wenn sie zu euch sagen: ‚Es ist im Meer‘, dann werden die Fische euch zuvorkommen. Vielmehr ist das Reich in euch und außerhalb von euch.[c] Wenn ihr euch selbst erkennt, dann wird man euch erkennen[d], und ihr werdet begreifen, dass ihr die Kinder des lebendigen Vaters seid. Wenn ihr euch selbst aber nicht erkennt, dann werdet ihr in Armut sein, und ihr seid die Armut.“[e]


    [a] Das koptische Wort kann „ziehen“ oder „führen“ bedeuten. Dass diese Menschen die Angesprochenen irreführen, wird nicht ausdrücklich gesagt.


    [b] „Himmel“ bezeichnet hier den sichtbaren Himmel, wie die anschließende Erwähnung der Vögel zeigt; dasselbe Wort kann auch „Himmel“ im religiösen Sinn bedeuten.


    [c] Im koptischen Text steht nur „das Reich“, nicht „das Reich Gottes“.


    [d] Wörtlich: „Dann werden sie euch erkennen.“ Die unbestimmte dritte Person Mehrzahl kann im Sahidischen einen passivischen Sinn ausdrücken, ohne zu benennen, wer erkennt.


    [e] Alle Formen von „ihr“ und „euch“ sind im koptischen Text Mehrzahl. Die Handschrift liest hier „die Kinder“; damit stimmt auch der griechische Textzeuge POxy 654 überein.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das koptische Wort kann „ziehen“ oder „führen“ bedeuten. Dass diese Menschen die Angesprochenen irreführen, wird nicht ausdrücklich gesagt.
    reason: lexical_alternative
  - marker: b
    text: „Himmel“ bezeichnet hier den sichtbaren Himmel, wie die anschließende Erwähnung der Vögel zeigt; dasselbe Wort kann auch „Himmel“ im religiösen Sinn bedeuten.
    reason: lexical_alternative
  - marker: c
    text: Im koptischen Text steht nur „das Reich“, nicht „das Reich Gottes“.
    reason: textual_variant
  - marker: d
    text: 'Wörtlich: „Dann werden sie euch erkennen.“ Die unbestimmte dritte Person Mehrzahl kann im Sahidischen einen passivischen Sinn ausdrücken, ohne zu benennen, wer erkennt.'
    reason: dialect_note
  - marker: e
    text: Alle Formen von „ihr“ und „euch“ sind im koptischen Text Mehrzahl. Die Handschrift liest hier „die Kinder“; damit stimmt auch der griechische Textzeuge POxy 654 überein.
    reason: textual_variant
lexical_decisions:
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: das Reich
  rationale: „Reich“ ist im Deutschen die natürliche Wiedergabe und lässt sowohl Herrschaft als auch Herrschaftsbereich anklingen; „Königsherrschaft“ wäre formaler, aber deutlich sperriger.
- source_word: ⲥⲱⲕ ϩⲏⲧⲛⲧⲱⲧⲛ
  choice: euch führen
  rationale: ⲥⲱⲕ bedeutet „ziehen, führen“. Die neutrale Wiedergabe vermeidet den im Text nicht ausdrücklich enthaltenen Zusatz „in die Irre“.
- source_word: ⲡⲉ / ⲧⲡⲉ
  choice: Himmel
  rationale: Im Zusammenhang mit den Vögeln ist der sichtbare Himmel gemeint. Das deutsche „Himmel“ bewahrt zugleich die mögliche weitere Bedeutung.
- source_word: ⲣϣⲟⲣⲡ ⲉⲣⲱⲧⲛ
  choice: euch zuvorkommen
  rationale: Die Wendung besagt, dass Vögel beziehungsweise Fische vor den Angesprochenen dort wären; „zuvorkommen“ gibt dies knapp und idiomatisch wieder.
- source_word: ⲙ̄ⲡⲉⲧⲛ̄ϩⲟⲩⲛ / ⲙ̄ⲡⲉⲧⲛ̄ⲃⲁⲗ
  choice: in euch / außerhalb von euch
  rationale: Die räumliche Gegenüberstellung des koptischen Textes bleibt erhalten, ohne sie psychologisch oder kosmologisch auszudeuten.
- source_word: ⲥⲟⲩⲱⲛⲧⲏⲩⲧⲛ̄
  choice: euch selbst erkennt
  rationale: „Erkennen“ trägt im Deutschen stärker als bloßes „wissen“ den reflexiven und existenziellen Sinn der Aussage.
- source_word: ⲥⲉⲛⲁⲥⲟⲩⲱⲛⲧⲏⲛⲉ
  choice: man wird euch erkennen
  rationale: Die unbestimmte dritte Person Mehrzahl wird als unpersönliche deutsche Konstruktion wiedergegeben; eine bestimmte erkennende Instanz wird nicht ergänzt.
- source_word: ⲛ̄ϣⲏⲣⲉ
  choice: die Kinder
  rationale: Die diplomatische Handschriftenlesung hat den Pluralartikel ⲛ̄- und bedeutet „die Kinder/Söhne“. „Kinder“ bewahrt den Verwandtschaftssinn ohne unnötige Geschlechtsverengung.
- source_word: ⲙⲛ̄ⲧϩⲏⲕⲉ
  choice: Armut
  rationale: 'Das Abstraktum wird in beiden parallelen Aussagen gleich wiedergegeben: „in Armut“ und „die Armut“.'
theological_decisions:
- issue: Nicht näher bestimmte Bezeichnung „das Reich“
  choice: Kein Zusatz „Gottes“
  alternative: „das Reich Gottes“
  rationale: Der koptische Text nennt lediglich „das Reich“. Eine theologisch naheliegende Ergänzung würde über den erhaltenen Wortlaut hinausgehen.
- issue: Ort des Reiches
  choice: „in euch und außerhalb von euch“
  alternative: „in eurem Inneren und um euch herum“
  rationale: Die räumliche Spannung des Quelltexts wird bewahrt und weder ausschließlich verinnerlicht noch ausschließlich kosmologisch erklärt.
- issue: Wer die Angesprochenen erkennen wird
  choice: unpersönlich „man wird euch erkennen“
  alternative: „Gott wird euch erkennen“
  rationale: Der Text nennt kein Subjekt. Eine Identifizierung mit Gott wäre eine nicht ausdrücklich belegte theologische Festlegung.
