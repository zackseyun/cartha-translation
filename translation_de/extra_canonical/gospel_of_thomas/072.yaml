base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/072.yaml
  text: A man said to him[a], "Tell my brothers, so that they may divide my father's property with me." He said to him, "Man, who has made me a divider?" He turned to his disciples and said to them, "I am not a divider, am I?"
translation:
  language: de
  text: 'Ein Mann sagte zu ihm[a]: „Sag meinen Brüdern[b], dass sie den Besitz[c] meines Vaters mit mir teilen sollen.“ Er sagte zu ihm: „Mensch, wer hat mich zum Aufteilen eingesetzt?“[d] Dann wandte er sich seinen Jüngern zu und sagte zu ihnen: „Bin ich etwa zum Aufteilen eingesetzt?“[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Anfang „Ein Mann sagte zu ihm“ ist auf der Manuskriptseite teilweise verloren und wird anhand der noch erkennbaren Buchstaben ergänzt.
    reason: lacuna_or_restoration
  - marker: b
    text: Im erhaltenen Manuskript steht „meinen Brüdern“ im Plural; die normalisierte Textfassung bietet „meinem Bruder“ im Singular.
    reason: textual_variant
  - marker: c
    text: Das koptische Wort kann auch „Güter“, „Vermögen“ oder im Zusammenhang „Erbe“ bedeuten.
    reason: lexical_alternative
  - marker: d
    text: Wörtlich steht hier „zu einem, der teilt/aufteilt“. Die deutsche Formulierung gibt die neutrale Bezeichnung einer Person wieder, die etwas aufteilt. Anders als Lukas 12,14 nennt der Thomastext keinen „Richter“.
    reason: lexical_alternative
  - marker: e
    text: 'Die Fragepartikel ⲙⲏ kennzeichnet wahrscheinlich eine rhetorische Frage, auf die ein Nein erwartet wird: „Ich bin doch nicht zum Aufteilen eingesetzt, oder?“'
    reason: grammar
lexical_decisions:
- source_word: ⲡⲉϫⲉⲟⲩⲣⲱⲙⲉ ⲛⲁⲛⲧⲟϥ
  choice: Ein Mann sagte zu ihm
  rationale: Die gewöhnliche koptische Redeformel wird schlicht und unmittelbar wiedergegeben.
- source_word: ϫⲱⲛⲧⲟⲥ
  choice: Sag
  rationale: Der Imperativ richtet eine Bitte beziehungsweise Aufforderung an Jesus; „Sag“ ist im Deutschen natürlich und wahrt die direkte Rede.
- source_word: ⲛⲛⲁⲥⲛⲏⲩ / ⲛⲡⲁⲥⲟⲛ
  choice: meinen Brüdern
  rationale: Der erhaltene Manuskripttext bietet den Plural; die normalisierte Fassung hat dagegen den Singular. Der Plural wird im Haupttext übersetzt und die Abweichung vermerkt.
- source_word: ϩⲓⲛⲁ ⲉⲣⲉⲛⲧⲟⲟⲩ ⲛⲁⲡⲱϣⲉ
  choice: dass sie … teilen sollen
  rationale: Die Zweckkonstruktion wird als deutsche dass-Konstruktion mit Aufforderungssinn natürlich wiedergegeben.
- source_word: ⲛⲡϩⲛⲁⲁⲩ
  choice: den Besitz
  rationale: Das Wort bezeichnet Güter oder Besitz; „Besitz“ vermeidet eine unnötige rechtliche Festlegung auf „Erbe“.
- source_word: ⲛⲣⲉϥⲡⲱϣⲉ
  choice: Erbteiler
  rationale: Das agentivische Substantiv bezeichnet jemanden, der aufteilt. „Erbteiler“ ist im Deutschen kontextuell verständlich, hält die Personbezeichnung in beiden Fragen fest und harmonisiert nicht mit dem „Richter“ aus Lukas 12,14.
- source_word: ⲁϥⲕⲟⲧϥ / ⲕⲱⲧⲛⲧⲟϥ
  choice: wandte er sich … zu
  rationale: Die reflexive Wendung für das Sich-Umwenden wird idiomatisch deutsch wiedergegeben.
- source_word: ⲙⲏ
  choice: Bin ich etwa …?
  rationale: Die aus dem Griechischen übernommene Fragepartikel leitet hier eine rhetorische Frage ein, auf die eine verneinende Antwort erwartet wird.
theological_decisions:
- issue: Verhältnis zu Lukas 12,13–14
  choice: Nur die Rolle des Erbteilers nennen
  alternative: „Richter und Erbteiler“
  rationale: Der Thomastext nennt ausschließlich denjenigen, der teilt; die zusätzliche Bezeichnung „Richter“ aus Lukas wird nicht in den Text eingetragen.
- issue: Aussageform des letzten Satzes
  choice: 'Rhetorische Frage: „Bin ich etwa ein Erbteiler?“'
  alternative: 'Aussage: „Seht, ich bin kein Erbteiler.“'
  rationale: ⲙⲏ markiert hier am wahrscheinlichsten eine Frage, die eine negative Antwort erwartet; die rhetorische Spannung bleibt dadurch erhalten.
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Die direkte Anrede „Mensch“ bewahrt den knappen, leicht schroffen Ton. „Erbteiler“ ist bewusst markanter als eine freie Umschreibung, damit das wiederholte agentivische Substantiv und die Verbindung zum Teilen des väterlichen Besitzes sichtbar bleiben.
