base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/106.yaml
  text: Jesus said[a], “When you make the two one, you will become sons of the Human; and when you say, ‘Mountain[e][d][c][b], move away,’ it will move.”
translation:
  language: de
  text: '**106** Jesus sagte: „Wenn ihr die zwei zu einem macht, werdet ihr Kinder des Menschen[a]. Und wenn ihr sagt: ‚Berg, rücke fort!‘, wird er wegrücken.“[b]


    [a] Das koptische Wort kann je nach Zusammenhang „Kinder“ oder „Söhne“ bedeuten. Daher ist auch die Übersetzung „Söhne des Menschen“ möglich. Die rätselhafte Bezeichnung „der Mensch“ wird hier nicht näher bestimmt.


    [b] Zum Motiv, die zwei zu einem zu machen, vgl. Thomas 22 und 48; zum sich fortbewegenden Berg vgl. Markus 11,23 sowie Matthäus 17,20; 21,21.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das koptische Wort kann je nach Zusammenhang „Kinder“ oder „Söhne“ bedeuten. Daher ist auch die Übersetzung „Söhne des Menschen“ möglich. Die rätselhafte Bezeichnung „der Mensch“ wird hier nicht näher bestimmt.
    reason: lexical_alternative
  - marker: b
    text: Zum Motiv, die zwei zu einem zu machen, vgl. Thomas 22 und 48; zum sich fortbewegenden Berg vgl. Markus 11,23 sowie Matthäus 17,20; 21,21.
    reason: cross_reference
lexical_decisions:
- source_word: ϩⲟⲧⲁⲛ / ⲉⲣϣⲁⲛ_ⲛⲧⲱⲧⲛ ⲉⲓⲣⲉ
  choice: Wenn ihr … macht
  rationale: Die temporal-konditionale Zukunftskonstruktion wird im Deutschen natürlich mit „wenn“ und Präsens wiedergegeben.
- source_word: ⲡⲥⲛⲁⲩ ⲟⲩⲁ
  choice: die zwei zu einem
  rationale: Bewahrt den bestimmten, rätselhaften Gegensatz zwischen „den zwei“ und „einem“, klingt aber im Deutschen natürlicher als „die zwei eins“.
- source_word: ⲛϣⲏⲣⲉ
  choice: Kinder
  rationale: Der koptische Plural kann kollektiv Kinder bezeichnen. Die Alternative „Söhne“ wird in einer Fußnote genannt, damit die lexikalische Spannung sichtbar bleibt.
- source_word: ⲛⲡⲣⲱⲙⲉ
  choice: des Menschen
  rationale: Gibt den bestimmten Ausdruck wörtlich und bewusst offen wieder, ohne ihn mit einer erklärenden oder konfessionell geprägten Deutung aufzulösen.
- source_word: ⲉⲣϣⲁⲛ_ⲛⲧⲱⲧⲛ ϫⲱⲛⲧⲟⲥ
  choice: wenn ihr sagt
  rationale: Die normalisierte Form zerlegt sich als Verb „sagen“ mit pronominalem Objekt, das die folgende direkte Rede vorwegnimmt; sie enthält kein Adverb „laut“.
- source_word: ⲡⲧⲟⲟⲩ
  choice: Berg
  rationale: Der bestimmte koptische Ausdruck fungiert als Anrede; im deutschen Vokativ ist „Berg“ ohne Artikel idiomatisch.
- source_word: ⲡⲱⲱⲛⲉ ⲉⲃⲟⲗ
  choice: rücke fort
  rationale: Gibt das Verb „sich bewegen“ mit der Richtungskomponente „fort/hinaus“ als knappen deutschen Befehl wieder.
- source_word: ⲛⲧⲟϥ ⲛⲁⲡⲱⲱⲛⲉ
  choice: wird er sich fortbewegen
  rationale: Das maskuline Pronomen nimmt den Berg auf; die Futurmarkierung wird ausdrücklich mit „wird“ wiedergegeben.
theological_decisions:
- issue: Bedeutung von „Kinder/Söhne des Menschen“
  choice: Kinder des Menschen
  alternative: Söhne des Menschen
  rationale: „Kinder“ gibt den möglichen kollektiven Sinn geschlechterübergreifend wieder; die Fußnote bewahrt die wörtlich engere Alternative „Söhne“. Der Ausdruck „des Menschen“ bleibt absichtlich unerklärt.
- issue: Bezug zum kanonischen Ausdruck „Menschensohn“
  choice: Keine Angleichung an „Menschensöhne“ oder eine christologische Titelform
  alternative: Söhne des Menschensohnes
  rationale: Der koptische Text spricht von pluralischen Kindern/Söhnen „des Menschen“ und rechtfertigt keine interpretierende Erweiterung um den kanonischen Titel „Menschensohn“.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper, würdiger Spruchform. Die Parallelstruktur der beiden Wenn-Sätze und die rätselhafte Ausdrucksweise bleiben erhalten. „Rücke fort“ ist gehoben genug für direkte Rede, ohne altertümlich zu wirken.
