base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/019.yaml
  text: Jesus said[a], “Blessed is the one who has come to be before he comes to be. If you become my disciples and listen to my words, these stones will minister to you. For you have five trees in Paradise; they do not move in summer or in winter, and their leaves do not fall[d][c][b]. Whoever comes to know them will not taste death.”
translation:
  language: de
  text: 'Jesus sagte: „Selig ist, wer ins Dasein kam, bevor er ins Dasein kam.[a] Wenn ihr meine Jünger werdet und auf meine Worte hört, werden euch diese Steine dienen.[b] Denn ihr habt fünf Bäume im Paradies. Sie bewegen sich weder im Sommer noch im Winter, und ihre Blätter fallen nicht ab. Wer sie erkennt, wird den Tod nicht schmecken.“[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich sinngemäß: „Selig ist der, der geworden ist, bevor er geworden ist.“ Das wiederholte koptische Verb ϣⲱⲡⲉ bedeutet „werden, entstehen, ins Dasein kommen“. Das Paradox wird bewusst nicht erklärt.'
    reason: lexical_alternative
  - marker: b
    text: 'Die erhaltene Handschrift lässt sich als Plural lesen: „meine Worte, diese Steine“. Die angegebene normalisierte Edition analysiert die Buchstabenfolge dagegen als Singular: „mein Wort, dieser Stein wird euch dienen“.'
    reason: textual_variant
  - marker: c
    text: „Den Tod schmecken“ gibt die koptische Redewendung wörtlich wieder; vergleichbare Formulierungen stehen in Markus 9,1 und Matthäus 16,28.
    reason: cross_reference
lexical_decisions:
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: selig
  rationale: Das griechische Lehnwort hat den Klang einer Seligpreisung; „selig“ bewahrt diesen würdevollen, aphoristischen Ton besser als „glücklich“.
- source_word: ϣⲱⲡⲉ (ⲁⲛⲧⲟϥ ϣⲱⲡⲉ / ⲙⲡⲁⲧⲉⲛⲧⲟϥ ϣⲱⲡⲉ)
  choice: ins Dasein kommen
  rationale: Das Verb bezeichnet Werden oder Entstehen. Die identische Wiedergabe an beiden Stellen erhält das beabsichtigte Paradox, ohne es als Geburt oder Präexistenz auszudeuten.
- source_word: ⲉⲣϣⲁⲛ ⲛⲧⲱⲧⲛ ϣⲱⲡⲉ
  choice: wenn ihr … werdet
  rationale: Die Konstruktion kann bedingend oder zukünftig-temporal verstanden werden; „wenn“ bewahrt diese Offenheit im Deutschen.
- source_word: ⲙⲁⲑⲏⲧⲏⲥ
  choice: Jünger
  rationale: Dies ist im religiösen Kontext die natürliche deutsche Entsprechung des griechischen Lehnworts, ohne die allgemeinere Bedeutung „Lernende“ ganz auszuschließen.
- source_word: ⲥⲱⲧⲙ ⲉ-
  choice: auf … hören
  rationale: Die Wendung bezeichnet aufmerksames Hören; „auf meine Worte hören“ klingt natürlich und fügt nicht ausdrücklich den stärkeren Begriff „gehorchen“ ein.
- source_word: ⲁⲛⲁϣⲁϫⲉ / ⲛⲉⲉⲓⲱⲛⲉ
  choice: meine Worte / diese Steine
  rationale: Die Übersetzung folgt der sichtbaren Handschriftenlesung im Plural. Die normalisierte Edition analysiert beide Ausdrücke dagegen als Singular; diese Möglichkeit wird in der Fußnote dokumentiert.
- source_word: ⲛⲁⲣⲇⲓⲁⲕⲟⲛⲉⲓ
  choice: werden … dienen
  rationale: Das griechische Lehnverb bezeichnet dienen beziehungsweise Dienst leisten. „Dienen“ bewahrt den markierten Sinn und ist im Deutschen verständlicher als „Dienst tun“.
- source_word: ⲛϯⲟⲩ ⲛϣⲏⲛ
  choice: fünf Bäume
  rationale: Direkte und klare Wiedergabe ohne allegorische Deutung.
- source_word: ⲕⲓⲙ
  choice: sich bewegen
  rationale: Das Verb kann „sich bewegen“ oder „erschüttert werden“ bedeuten. Die direkte Wiedergabe bewahrt das ungewöhnliche Bild.
- source_word: ⲥⲟⲟⲩⲛ
  choice: erkennen
  rationale: „Erkennen“ gibt das gemeinte Kennen oder Zu-erkennen-Kommen in knapper, würdevoller Sprache wieder, ohne den Gegenstand der Erkenntnis zu erklären.
- source_word: ϫⲓϯⲡⲉ ⲛⲙⲟⲩ
  choice: den Tod schmecken
  rationale: Die wörtliche idiomatische Wendung ist im Deutschen verständlich und bewahrt die bildhafte Form des koptischen Textes.
theological_decisions:
- issue: Bedeutung des paradoxen vorausgehenden Daseins
  choice: Das Paradox wird unaufgelöst wiedergegeben.
  alternative: Eine ausdrückliche Deutung als Präexistenz, Wiedergeburt oder ursprüngliches Selbst.
  rationale: Der Text erklärt nicht, welche Art von Dasein gemeint ist. Eine dogmatische Festlegung würde die echte theologische Spannung beseitigen.
- issue: Identität der fünf Bäume im Paradies
  choice: Die Bäume bleiben unkommentiert und werden nicht allegorisch identifiziert.
  alternative: Deutung etwa als geistige Kräfte, Sakramente, Sinne oder paradiesische Lebensbäume.
  rationale: Der Ausspruch nennt keine Entsprechungen; eine Identifikation wäre spekulativ und konfessionell oder traditionsgeschichtlich voreingenommen.
- issue: Verheißung, den Tod nicht zu schmecken
  choice: Die Aussage bleibt in ihrer absoluten und bildhaften Form stehen.
  alternative: Einschränkung auf geistlichen, ewigen oder leiblichen Tod.
  rationale: Der Text bestimmt die Art des Todes nicht. Die Übersetzung soll diese Spannung nicht stillschweigend entscheiden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Spruchton. Ungewöhnliche Bilder und syntaktische Spannungen werden bewahrt, während unnötig altertümliche Formen vermieden werden. Die sichtbare Handschriftenlesung im Plural erhält im Haupttext Vorrang; die normalisierte Singularlesung steht in der Fußnote.
