  source_fidelity: 'Die erste Aussage ist im Entwurf unvollständig: Das Prädikat „werden zusammengerollt werden“ wird nur mit „die Himmel“ verbunden; für „die Erde“ bleibt lediglich eine adverbiale Ergänzung stehen. Im Koptischen werden Himmel und Erde koordiniert und vom einen Zukunftsverb regiert. Die vorgeschlagene Fassung stellt dies im Deutschen her, ohne ein zusätzliches Sachverhaltselement einzutragen. Die Frage „Sagt Jesus nicht?“ gibt die bejahende Antwort erwartende Partikel angemessen wieder.'
  naturalness: „Die Himmel und die Erde werden sich vor euch zusammenrollen“ ist modernes, verständliches Deutsch und bewahrt den bildhaften, knappen Ton. „Die Welt ist seiner nicht würdig“ ist idiomatischer und bildet die Richtung der Wertigkeitsrelation klar ab.
  terminology: „der Lebendige“ erhält die offene, nicht näher bestimmte Referenz des koptischen Ausdrucks. „Sich selbst findet“ bleibt als vorsichtige reflexive Wiedergabe bestehen; die Fußnote vermerkt die mögliche Resonanz von „allein“, ohne daraus eine festgelegte theologische Deutung zu machen.
