base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/111.yaml
  text: Jesus said[a], "The heavens will roll up, and the earth, in your presence, and the one who lives from the living one will not see death." Does not Jesus say, "Whoever finds himself[b], the world is not worthy of him"?
translation:
  language: de
  text: 'Jesus sagte: „Die Himmel und die Erde werden sich vor euch zusammenrollen. Und wer aus dem Lebendigen lebt, wird den Tod nicht sehen.“ Sagt Jesus nicht[a]: „Wer sich selbst findet[b], die Welt ist seiner nicht würdig“?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Hier wechselt der Text unvermittelt in die dritte Person und führt Jesus als äußere Autorität an. Möglicherweise liegt eine in den Text gelangte Bemerkung eines Bearbeiters oder Abschreibers vor.
    reason: textual_variant
  - marker: b
    text: Die koptische Wendung bedeutet grammatisch „sich selbst findet“; das verwendete Wort kann zugleich den Nebenklang „allein“ tragen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ϭⲱⲗ
  choice: zusammengerollt werden
  rationale: Das Verb kann „zusammenfalten, zusammenrollen“ bedeuten und passt zum apokalyptischen Bild der zusammengerollten Himmel.
- source_word: ⲙ̄ⲧⲟ ⲉⲃⲟⲗ
  choice: vor euren Augen
  rationale: Die Wendung bezeichnet die Gegenwart beziehungsweise das Angesicht von Personen; „vor euren Augen“ gibt hier den anschaulichen Sinn natürlich wieder.
- source_word: ⲡⲉⲧⲟⲛϩ ⲉⲃⲟⲗ ϩⲛ̄ⲡⲉⲧⲟⲛϩ
  choice: wer aus dem Lebendigen lebt
  rationale: Die Wiederholung des Stammes „leben/lebendig“ wird bewahrt; „aus“ hält die Herkunfts- oder Quellbeziehung offen.
- source_word: ⲟⲩⲭ ϩⲟⲧⲓ
  choice: Sagt … nicht?
  rationale: Die griechisch-koptische Wendung leitet hier eine Frage ein, die eine bejahende Antwort erwartet.
- source_word: ⲁϩⲉ ⲉⲣⲟϥ ⲟⲩⲁⲁϥ
  choice: sich selbst findet
  rationale: ⲟⲩⲁⲁϥ wirkt in der Konstruktion reflexiv, behält aber zugleich einen möglichen Anklang an „allein“.
- source_word: ⲙ̄ⲡϣⲁ
  choice: nicht würdig
  rationale: Die Wendung bezeichnet, dass jemand oder etwas einer Person nicht wert beziehungsweise ihrer nicht würdig ist.
theological_decisions:
- issue: Identität des „Lebendigen“
  choice: der Lebendige, ohne weitere Identifizierung
  alternative: Gott, der Vater oder der lebendige Jesus
  rationale: Der Ausgangstext bestimmt den Bezug nicht ausdrücklich. Die substantivierte Form mit Großschreibung ist im Deutschen lesbar, ohne eine bestimmte Identität festzulegen.
- issue: Übergang zur Aussage über Jesus in der dritten Person
  choice: als Frage des überlieferten Textes wiedergegeben und mit einer textkritischen Fußnote markiert
  alternative: die Frage weiterhin als direkte Rede Jesu behandeln oder als spätere Glosse aus dem Haupttext entfernen
  rationale: Der abrupte Personenwechsel ist tatsächlich vorhanden und soll weder geglättet noch durch Ausscheidung entschieden werden.
- issue: Bedeutung von ⲟⲩⲁⲁϥ
  choice: reflexiv „sich selbst“, mit Hinweis auf den Nebenklang „allein“
  alternative: „sich allein findet“
  rationale: Die reflexive Lesart ist grammatisch naheliegend; die für Thomas bedeutsame Vorstellung des Alleinseins bleibt als echte lexikalische Resonanz in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der knappe, apokalyptische Ton und die Wiederholung von „leben/lebendig“ bleiben erhalten. Die ungewöhnliche Syntax des ersten Satzes wird in verständlicher Form bewahrt, ohne ein im Koptischen nicht wiederholtes Verb ausdrücklich zu ergänzen.
