revisions:
- from: 'Jesus sagte: „Die Himmel werden zusammengerollt werden und die Erde vor euren Augen. Und wer aus dem Lebendigen lebt, wird den Tod nicht sehen.“ Sagt Jesus nicht[a]: „Wer sich selbst findet[b], dessen ist die Welt nicht würdig“?'
  to: 'Jesus sagte: „Die Himmel und die Erde werden sich vor euch zusammenrollen. Und wer aus dem Lebendigen lebt, wird den Tod nicht sehen.“ Sagt Jesus nicht[a]: „Wer sich selbst findet[b], die Welt ist seiner nicht würdig“?'
  rationale: Eine sichere sprachliche Korrektur ist erforderlich, weil der erste deutsche Satz das für beide Subjekte geltende Prädikat nicht vollständig wiedergibt. Die Revision koordiniert Himmel und Erde unter einem Verb und bewahrt die offene Bedeutung von „dem Lebendigen“ sowie den textlich auffälligen Wechsel zur dritten Person. Die vorhandenen Fußnoten bleiben inhaltlich angemessen und an ihren jeweiligen Ausdrücken verankert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:06:17Z'
