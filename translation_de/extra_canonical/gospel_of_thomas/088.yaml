base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/088.yaml
  text: Jesus said[a], "The angels and the prophets will come to you, and they will give you what belongs to you. And you, in turn, give them what is in your hands, and say to yourselves[b], 'On what day will they come and take what is theirs?'"
translation:
  language: de
  text: 'Jesus sagte: »Die Engel und die Propheten werden zu euch kommen, und sie werden euch geben, was euch gehört.[a] Gebt auch ihr ihnen, was in euren Händen ist,[b] und sagt zu euch selbst: ›An welchem Tag werden sie kommen und nehmen, was ihnen gehört?‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »was ihr habt« (ⲛ̄ⲛⲉⲧⲉⲩⲛ̄ⲧⲏⲧⲛ̄ⲥⲉ).'
    reason: lexical_alternative
  - marker: b
    text: Die Handschrift verwendet hier mit ⲧⲏⲛⲉ eine regionale, lykopolitanische Form des Suffixes der zweiten Person Plural anstelle des sahidischen ⲧⲏⲩⲧⲛ.
    reason: dialect_note
lexical_decisions:
- source_word: ⲛ̄ⲛⲉⲧⲉⲩⲛ̄ⲧⲏⲧⲛ̄ⲥⲉ
  choice: was euch gehört
  rationale: Die koptische Besitzkonstruktion mit ⲟⲩⲛⲧⲁ= bezeichnet wörtlich das, was die Angesprochenen haben. »Was euch gehört« bildet zugleich den Gegensatz zu ⲡⲉⲧⲉⲡⲱⲟⲩ, »was ihnen gehört«, natürlich und prägnant ab.
- source_word: ⲛⲉⲧⲛ̄ⲧⲟⲧ⳿ⲧⲏⲛⲉ
  choice: was in euren Händen ist
  rationale: Die Wendung mit ⲛ̄ⲧⲟⲟⲧ= bedeutet »in der Hand von« beziehungsweise »bei«. Die konkrete Bildsprache der Hände bleibt erhalten.
- source_word: ϩⲱⲧ̂ⲧⲏⲩⲧⲛ̄
  choice: auch ihr
  rationale: 'Das enklitische Pronomen hebt den entsprechenden Anteil der Angesprochenen hervor: Sie sollen ihrerseits geben. »Auch ihr« ist im Deutschen knapp und natürlich.'
- source_word: ⲡⲉⲧⲉⲡⲱⲟⲩ
  choice: was ihnen gehört
  rationale: Das selbstständige Possessivpronomen ⲡⲱⲟⲩ bedeutet »das Ihre/ihres«. Die Formulierung wahrt die wechselseitige Gegenüberstellung.
theological_decisions:
- issue: Art des Austauschs zwischen den Angesprochenen und Engeln beziehungsweise Propheten
  choice: »was euch gehört« und »was ihnen gehört«
  alternative: »was ihr habt« und »das Ihre«
  rationale: Die Übersetzung macht die im Text angelegte Gegenüberstellung der Besitzverhältnisse sichtbar, ohne festzulegen, worin die ausgetauschten Dinge bestehen oder welche heilsgeschichtliche Bedeutung der Vorgang hat.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Satzführung. Die Parallelität von Geben und Nehmen sowie von »euch« und »ihnen« bleibt deutlich. Die Engel und Propheten stehen entsprechend den Pluralmarkierungen der Handschrift im Plural.
