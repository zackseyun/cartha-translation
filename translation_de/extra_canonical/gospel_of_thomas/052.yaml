- from: 'Seine Jünger sagten zu ihm: „Vierundzwanzig Propheten haben in Israel gesprochen, und sie alle haben von dir[a] gesprochen.“ Er sagte zu ihnen: „Ihr habt den Lebenden, der vor euch ist, außer Acht gelassen[b] und von den Toten gesprochen.“[c]'
  to: 'Seine Jünger sagten zu ihm: „Vierundzwanzig[c] Propheten haben in Israel gesprochen, und sie alle haben über dich[a] gesprochen.“ Er sagte zu ihnen: „Ihr habt den Lebenden, der vor euch ist, außer Acht gelassen[b] und über die Toten[d] gesprochen.“'
  rationale: Die Revision verbessert den deutschen Gegenstandsbezug, setzt den kulturgeschichtlichen Anker an die Zahl und dokumentiert die relevante Abweichung zwischen Manuskripttranskription und normalisierter Lesart am Satzschluss. Sie legt weder die Identität des „Lebenden“ noch den genauen Bezug der „Toten“ aus.
