review_pass:
  verdict: revise
  source_fidelity: Die Grundstruktur und die Zahl sind zutreffend. Eine Revision ist jedoch angezeigt, weil der diplomatische Manuskripttext am Schluss den Plural „die Toten“ bietet, während die normalisierte Edition den Singular hat. Diese textkritische Spannung darf nicht stillschweigend zugunsten nur einer Lesart entschieden werden. Außerdem ist „über dich“ im Deutschen für den gemeinten Gegenstandsbezug eindeutiger als „von dir“.
  naturalness: Die Spruchform ist knapp und modernes Standarddeutsch. „Über dich gesprochen“ und „über die Toten gesprochen“ sind idiomatisch und halten die Wiederholung des koptischen Verbs natürlich erkennbar.
  terminology: „Der Lebende“ bewahrt den markierten Singular der normalisierten Lesart; „die Toten“ folgt dem Manuskripttext. Beide Bezeichnungen bleiben ohne dogmatische Identifizierung. Die Fußnoten machen die jeweils relevante Textvariante und die mögliche Bedeutung der Zahl sichtbar.
  issues:
  - severity: medium
    issue: Die abweichende Singular-/Plural-Lesart am Schluss wird nicht als Textvariante dokumentiert.
    rationale: Der diplomatische Text hat ⲛⲉⲧⲙⲟⲟⲩⲧ („die Toten“), die normalisierte Quelle dagegen ⲡⲉⲧⲉⲣⲉⲙⲟⲩ („der Tote“). Die Übersetzung kann eine Lesart wählen, muss die andere aber kenntlich machen.
  - severity: low
    issue: Die kulturgeschichtliche Fußnote ist nicht an die Zahl angeheftet.
    rationale: Ihr Anker am Satzende macht ihren Bezug weniger klar; er sollte unmittelbar bei „Vierundzwanzig“ stehen.
  - severity: low
