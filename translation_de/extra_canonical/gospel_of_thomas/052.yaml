base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/052.yaml
  text: His disciples said to him[a], “Twenty-four prophets spoke in Israel, and they all spoke about you.” He said to them, “You have left out the living one who is in your presence[d][c][b], and you have spoken about the dead.”
translation:
  language: de
  text: 'Seine Jünger sagten zu ihm: „Vierundzwanzig[c] Propheten haben in Israel gesprochen, und sie alle haben über dich[a] gesprochen.“ Er sagte zu ihnen: „Ihr habt den Lebenden, der vor euch ist, außer Acht gelassen[b] und über die Toten[d] gesprochen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der normalisierte Text lautet „über dich“. Die Buchstaben des Manuskripttextes können auch als „in deinem Herzen“ gelesen werden.
    reason: textual_variant
  - marker: b
    text: 'Oder: „übergangen“ beziehungsweise „ausgelassen“.'
    reason: lexical_alternative
  - marker: c
    text: Die Zahl von vierundzwanzig Propheten kann auf eine überlieferte Zählung prophetischer Autoritäten oder symbolisch auf eine Zählung von vierundzwanzig Büchern der Hebräischen Schriften anspielen; der Spruch selbst erklärt die Zahl nicht.
    reason: cultural_note
  - marker: d
    text: Der Manuskripttext hat hier den Plural „die Toten“; die normalisierte Edition liest den Singular „den Toten“.
    reason: textual_variant
lexical_decisions:
- source_word: ϫⲟⲩⲧⲁϥⲧⲉ
  choice: vierundzwanzig
  rationale: Die gewöhnliche deutsche Zahlform gibt das koptische Zahlwort knapp und ohne Archaisierung wieder.
- source_word: ϩⲣⲁⲓ ϩⲛⲛⲧⲟⲕ / ϩⲣⲁⲓ ⲛ̄ϩⲏⲧⲕ
  choice: von dir
  rationale: Die normalisierte Lesart bezeichnet Jesus als Gegenstand des Redens. Die im diplomatischen Text mögliche Lesart „in deinem Herzen/über dein Herz“ wird in einer Fußnote bewahrt.
- source_word: ⲕⲱ
  choice: außer Acht lassen
  rationale: Im Zusammenhang bezeichnet das Verb ein Übergehen oder Nichtbeachten. Die deutsche Wendung erhält die aktive Verantwortlichkeit der Angeredeten.
- source_word: ⲡⲉⲧⲉⲣⲉⲱⲛϩ
  choice: der Lebende
  rationale: Die substantivierte singularische Relativkonstruktion wird als markierter Singular bewahrt und nicht kollektiv als „die Lebenden“ verstanden.
- source_word: ⲛⲡⲉⲧⲛⲙⲧⲟ ⲉⲃⲟⲗ
  choice: vor euch
  rationale: Dies ist eine natürliche und zugleich genaue Wiedergabe des koptischen Ausdrucks für Gegenwart beziehungsweise unmittelbares Gegenüber.
- source_word: ⲡⲉⲧⲉⲣⲉⲙⲟⲩ / ⲛⲉⲧⲙⲟⲟⲩⲧ
  choice: die Toten
  rationale: Der diplomatische Manuskripttext hat ausdrücklich den Plural „die Toten“; dieser wird gegenüber der singularisierenden Normalisierung bevorzugt.
theological_decisions:
- issue: Identität des „Lebenden“
  choice: Die Bezeichnung bleibt unkommentiert und wird nicht ausdrücklich mit Jesus gleichgesetzt.
  alternative: „mich, den Lebenden“ oder eine erklärende Fußnote zur Identifikation mit Jesus
  rationale: Der Gesprächszusammenhang legt eine Beziehung zu Jesus nahe, doch der koptische Text nennt ihn an dieser Stelle nur „den Lebenden“. Die Spannung bleibt erhalten.
- issue: Bezug der „Toten“
  choice: „die Toten“ bleibt ohne nähere Bestimmung stehen.
  alternative: ausdrückliche Identifikation mit den Propheten
  rationale: Der Kontrast legt nahe, dass die Propheten gemeint sind, aber der Text formuliert dies nicht ausdrücklich. Eine Ergänzung würde die Aussage stärker festlegen als die Quelle.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit knapper, würdevoller Spruchform. Das wiederholte „gesprochen“ bildet die Wiederholung von ϣⲁϫⲉ ab. „Der Lebende“ erhält den bewusst markierten Gegensatz zu „den Toten“.
