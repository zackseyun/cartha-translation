base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/027.yaml
  text: If you do not fast the world[a], you will not find the kingdom; and if you do not make the Sabbath a Sabbath[e][d][c][b], you will not see the Father.
translation:
  language: de
  text: Wenn ihr nicht die Welt fastet[a], werdet ihr das Königreich nicht finden. Und wenn ihr den Sabbat nicht zu einem Sabbat macht[b][c], werdet ihr den Vater nicht sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich und bewusst ungewöhnlich: „die Welt fasten“. Der koptische Ausdruck behandelt „die Welt“ als direktes Objekt des Verbs; auch der griechische Zeuge POxy 1 hat den Akkusativ. Gemeint sein kann, sich der Welt zu enthalten, doch der Text formuliert dies nicht ausdrücklich.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung „den Sabbat zu einem Sabbat machen“ gibt die auffällige Wiederholung des koptischen Textes wieder. Sie kann sinngemäß bedeuten, den Sabbat wirklich als Sabbat zu begehen; die Übersetzung bewahrt jedoch die knappe, offene Formulierung.
    reason: cultural_note
  - marker: c
    text: Der griechische Zeuge POxy 1 liest „das Königreich Gottes“; der koptische Text hat nur „das Königreich“. Hier wird dem koptischen Basistext gefolgt.
    reason: textual_variant
lexical_decisions:
- source_word: ⲉⲣϣⲁⲛ_ … ⲧⲙ-
  choice: wenn … nicht
  rationale: Die konditionale Konstruktion bezeichnet eine zukünftige oder allgemein geltende Bedingung; „wenn“ gibt die Spruchform natürlich wieder.
- source_word: ⲣⲛⲏⲥⲧⲉⲩⲉ ⲉⲡⲕⲟⲥⲙⲟⲥ
  choice: die Welt fasten
  rationale: ⲉ- markiert hier das direkte Objekt, entsprechend dem griechischen Akkusativ τὸν κόσμον im Zeugen POxy 1. Die ungewöhnliche Transitivität des Verbs bleibt erhalten; „der Welt fasten“ würde die Konstruktion fälschlich direktional oder dativisch deuten.
- source_word: ⲡⲕⲟⲥⲙⲟⲥ
  choice: die Welt
  rationale: „Welt“ ist die übliche und allgemein verständliche Wiedergabe des griechischen Lehnworts κόσμος.
- source_word: ⲁϩⲉ
  choice: finden
  rationale: Die schlichte Wiedergabe bewahrt den knappen Stil des Spruchs.
- source_word: ⲡⲙⲛⲧⲣⲣⲟ
  choice: das Königreich
  rationale: Der koptische Text nennt kein Genitivattribut. „Königreich“ wahrt die traditionelle Bildsprache, ohne „Gottes“ zu ergänzen.
- source_word: ⲉⲓⲣⲉ ⲛⲡⲥⲁⲃⲃⲁⲧⲟⲛ ⲛⲥⲁⲃⲃⲁⲧⲟⲛ
  choice: den Sabbat zu einem Sabbat machen
  rationale: Die prädikative Konstruktion und die auffällige Wiederholung werden beibehalten, statt sie deutend zu „den Sabbat halten“ zu glätten.
- source_word: ⲛⲁⲩ … ⲉⲡⲉⲓⲱⲧ
  choice: den Vater sehen
  rationale: „Sehen“ entspricht dem einfachen Verb; „der Vater“ wird als im Text bestimmter Titel verstanden.
theological_decisions:
- issue: Bedeutung des Fastens der Welt
  choice: Die ungewöhnliche Formulierung „die Welt fasten“ bleibt offen.
  alternative: „sich der Welt enthalten“ oder „von der Welt fasten“
  rationale: Die Alternativen erklären bereits, wie das Bild zu verstehen sei. Der Quelltext formuliert dagegen „fasten“ mit „die Welt“ als direktem Objekt und lässt die genaue geistliche Bedeutung unausgelegt.
- issue: Bedeutung der Sabbatformel
  choice: „den Sabbat zu einem Sabbat machen“
  alternative: „den Sabbat wirklich halten“
  rationale: Die wörtlich-komprimierte Formel kann auf echtes Sabbatfeiern oder eine tiefere Erfüllung zielen. Die Übersetzung entscheidet diese Spannung nicht vorab.
- issue: Bestimmung des Königreichs
  choice: „das Königreich“ ohne Zusatz
  alternative: „das Königreich Gottes“
  rationale: Der koptische Basistext enthält keinen Genitiv. Die längere Lesart wird nur als Variante des griechischen Zeugen dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter Fremdheit an den beiden rhetorisch markanten Stellen „die Welt fasten“ und „den Sabbat zu einem Sabbat machen“. Die Satzfolge ist zur besseren Lesbarkeit in zwei Sätze gegliedert; das verbindende „Und“ erhält die Parallelstruktur.
