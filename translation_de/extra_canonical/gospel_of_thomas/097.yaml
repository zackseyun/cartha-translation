base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/097.yaml
  text: Jesus said, "The kingdom of the Father is like a woman carrying a jar full of meal. While she was walking on the road, still far away, the handle of the jar broke. The meal emptied out behind her on the road. She did not know it; she had not noticed the trouble. When she reached her house, she set the jar down and found it empty."
translation:
  language: de
  text: 'Jesus sagte: »Das Reich des Vaters gleicht einer Frau, die einen Krug voll Mehl trug. Während sie auf dem Weg ging und noch weit entfernt war, brach der Henkel[a] des Kruges ab. Das Mehl rieselte hinter ihr auf den Weg. Sie wusste es nicht und hatte das Unglück[b] nicht bemerkt. Als sie ihr Haus erreichte, stellte sie den Krug ab und fand ihn leer.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »das Ohr« des Kruges.'
    reason: Die Gefäßbezeichnung verwendet das Wort für »Ohr« im Sinn von »Henkel«.
  - marker: b
    text: 'Oder: »die Mühe«, »das Missgeschick« oder »die Not«.'
    reason: Das koptische Wort ϩⲓⲥⲉ hat ein breites Bedeutungsspektrum; im Zusammenhang ist die genaue Nuance nicht völlig eindeutig.
lexical_decisions:
- source_word: ϭⲗⲙⲉⲉⲓ
  choice: Krug
  rationale: Bezeichnet einen Krug oder ein vergleichbares Gefäß; »Krug« ist im Gleichnis natürlich und präzise.
- source_word: ⲛⲟⲉⲓⲧ
  choice: Mehl
  rationale: Das Wort bezeichnet Mehl beziehungsweise Schrot; »Mehl« ist die geläufige deutsche Entsprechung.
- source_word: ⲙⲁⲁϫⲉ
  choice: Henkel
  rationale: Wörtlich »Ohr«, bei einem Gefäß jedoch idiomatisch dessen Henkel.
- source_word: ⲟⲩⲱϭⲡ
  choice: brach ... ab
  rationale: Gibt das Zerbrechen beziehungsweise Abbrechen des Krughenkels anschaulich wieder.
- source_word: ϣⲟⲩⲟ
  choice: rieselte ... auf den Weg
  rationale: Das Verb kann »sich leeren, ausgießen« bedeuten; bei Mehl beschreibt »rieselte« den Vorgang natürlich, ohne einen absichtlichen Handelnden anzunehmen.
- source_word: ϩⲓⲥⲉ
  choice: Unglück
  rationale: Das Bedeutungsspektrum umfasst Mühe, Not und Bedrängnis; im Kontext bezeichnet es das unbemerkte Missgeschick.
- source_word: ⲟⲩⲉ
  choice: noch weit entfernt war
  rationale: Bewahrt die im koptischen Text ausdrücklich vorhandene Angabe der Entfernung, ohne ein nicht genanntes Ziel zu ergänzen.
theological_decisions:
- issue: ⲧⲙⲛ̄ⲧⲉⲣⲟ ⲙ̄ⲡⲉⲓⲱⲧ
  choice: Das Reich des Vaters
  alternative: Das Königreich des Vaters
  rationale: Bewahrt die thomanische Formulierung »des Vaters« und harmonisiert sie nicht zu »Reich Gottes« oder »Himmelreich«. »Reich« ist im Deutschen würdig und geläufig, ohne die Aussage auszulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Gleichniston. Die parataktische Erzählweise des Koptischen bleibt weitgehend erhalten. Die ungewöhnliche Entfernungsangabe wird nicht geglättet; die Pointe wird nicht theologisch erklärt.
