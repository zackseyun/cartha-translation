base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/074.yaml
  text: He said[1], "Lord, there are many around the drinking trough[3][2], but there is nothing in the well."
translation:
  language: de
  text: 'Er sagte[a]: »Herr, viele sind rings um die Zisterne[b], doch im Brunnen ist nichts[c].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich beginnt der Satz mit »Er sagte: Herr …«. Aus diesem Satz allein geht nicht hervor, ob Jesus Gott anredet oder ob jemand Jesus anredet. Möglich ist auch ein Zusammenhang mit dem vorangehenden Ausspruch.'
    reason: Mehrdeutigkeit von Sprecher und Angeredetem
  - marker: b
    text: Das koptische Wort kann »Brunnen« oder »Zisterne« bedeuten. Hier steht »Zisterne«, um es vom folgenden, ebenfalls mit »Brunnen« oder »Zisterne« übersetzbaren Wort zu unterscheiden.
    reason: Lexikalische Überschneidung zweier verschiedener koptischer Wörter
  - marker: c
    text: 'Das koptische Wort kann sowohl »nichts« als auch »niemand« bedeuten. Daher ist auch die Übersetzung möglich: »Doch im Brunnen ist niemand.«'
    reason: Genuine grammatische und metaphorische Mehrdeutigkeit
lexical_decisions:
- source_word: ⲡⲉϫⲉⲛⲧⲟϥ
  choice: Er sagte
  rationale: Die Form führt eine Äußerung mit einem nicht näher bestimmten männlichen Sprecher ein. Die Übersetzung ergänzt weder Jesus noch einen Jünger als ausdrückliches Subjekt.
- source_word: ⲡϫⲟⲉⲓⲥ
  choice: Herr
  rationale: Der bestimmte Artikel kann im Koptischen bei einer Anrede stehen. »Herr« bewahrt die naheliegende vokativische Lesart, ohne den Angeredeten festzulegen.
- source_word: ⲡⲕⲱⲧⲉ ⲛⲡϫⲱⲧⲉ
  choice: rings um die Zisterne
  rationale: ⲕⲱⲧⲉ bezeichnet hier den Umkreis beziehungsweise das Ringsherum; ϫⲱⲧⲉ kann einen Brunnen oder eine Zisterne bezeichnen. »Zisterne« unterscheidet diesen Ausdruck vom folgenden ϣⲱⲛⲉ, ohne die nicht ausdrücklich belegte Bedeutung »Tränke« einzuführen.
- source_word: ⲡϣⲱⲛⲉ
  choice: Brunnen
  rationale: Das Wort kann Brunnen, Zisterne oder Grube bezeichnen. »Brunnen« ist im Zusammenhang natürlich und hält die Bildsprache offen.
- source_word: ⲗⲁⲁⲩ
  choice: nichts
  rationale: In Verbindung mit der negativen Existenzkonstruktion kann das Wort »nichts« oder »niemand« bedeuten. Bei einem Brunnen ist »nichts« eine natürliche Lesart; die personenbezogene Möglichkeit wird in der Fußnote erhalten.
theological_decisions:
- issue: Identität von Sprecher und Angeredetem
  choice: 'Er sagte: »Herr …«'
  alternative: »Der Herr sagte …« oder ausdrückliche Identifizierung des Sprechers als Jesus beziehungsweise als Jünger
  rationale: Die koptische Syntax unterscheidet den einleitenden männlichen Sprecher von der folgenden Anrede, bestimmt aber im vorliegenden Satz nicht, wer spricht oder wer als »Herr« angeredet wird. Die Übersetzung löst diese Unbestimmtheit nicht auf.
- issue: Deutung des leeren Brunnens
  choice: im Brunnen ist nichts
  alternative: im Brunnen ist niemand
  rationale: Die sachliche und die personenbezogene Lesart sind grammatisch möglich. Der Haupttext gibt die im Brunnenbild naheliegende sachliche Lesart wieder; die alternative Deutung bleibt ausdrücklich vermerkt.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper Spruchform. »Rings um« erhält den bildhaften Ton, während »Zisterne« und »Brunnen« die zwei verschiedenen koptischen Bezeichnungen sichtbar voneinander abheben. Die Fußnoten sichern die für Auslegung und Theologie relevanten Mehrdeutigkeiten, ohne sie im Haupttext zu überladen.
