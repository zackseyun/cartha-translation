base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/066.yaml
  text: Jesus said, "Show me this stone that the builders threw out; it is the cornerstone."[a][b][c][d]
translation:
  language: de
  text: 'Jesus sagte: »Zeig mir diesen Stein, den die Bauleute hinausgeworfen haben.[a] Er ist der Eckstein.[b][c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »hinausgeworfen«; häufig wird auch »verworfen« übersetzt.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Stein der Ecke«.'
    reason: lexical_alternative
  - marker: c
    text: Anklang an Psalm 118,22 (in der Septuaginta Psalm 117,22); die Stelle wird auch in Markus 12,10; Matthäus 21,42; Lukas 20,17; Apostelgeschichte 4,11 und 1. Petrus 2,7 aufgegriffen.
    reason: cross_reference
lexical_decisions:
- source_word: ϯⲧⲥⲁⲃⲟⲁⲛⲟⲕ
  choice: Zeigt mir
  rationale: Die Konstruktion bedeutet wörtlich etwa »gebt mir zu sehen«; »Zeigt mir« gibt die auffordernde Wendung natürlich und prägnant wieder.
- source_word: ⲡⲱⲛⲉ ⲡⲁⲓ
  choice: diesen Stein
  rationale: Das deiktische Demonstrativpronomen wird ausdrücklich bewahrt.
- source_word: ⲛ̄ⲧⲁⲩⲥⲧⲟϥ ⲉⲃⲟⲗ
  choice: hinausgeworfen haben
  rationale: Die konkrete Bildsprache von ⲥⲧⲟ ... ⲉⲃⲟⲗ (»hinauswerfen«) bleibt erhalten; das geläufigere »verworfen« wird als Alternative vermerkt.
- source_word: ⲛ̄ϭⲓ ⲛⲉⲧ ⲕⲱⲧ
  choice: die Bauleute
  rationale: Die substantivierte Bezeichnung »die Bauenden« wird im Deutschen idiomatisch als »die Bauleute« wiedergegeben.
- source_word: ⲡⲱⲛⲉ ⲛⲕⲱϩ
  choice: der Eckstein
  rationale: Die feste deutsche Entsprechung bewahrt die Steinmetapher; die wörtliche Form »Stein der Ecke« wird in einer Fußnote genannt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Aufforderung und die konkrete Rede vom Hinauswerfen bleiben erhalten; »Eckstein« folgt dem etablierten deutschen Ausdruck, ohne die genaue bauliche Funktion des Steins näher festzulegen.
