base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/069.yaml
  text: Jesus said[1], “Blessed are those who have been persecuted in their heart; those are the ones who have truly known the Father. Blessed are those who have gone hungry[a][3][2], so that the belly of the one who desires will be filled.”
translation:
  language: de
  text: 'Jesus sagte: „Selig sind die, die in ihrem Herzen verfolgt worden sind; sie sind es, die den Vater in Wahrheit erkannt haben.[a] Selig sind die, die hungrig sind, damit sie den Bauch dessen füllen, der begehrt.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich lässt sich die erste Aussage auch singularisch nach der normalisierten Textgestalt verstehen: „Selig ist der, den sie in ihrem Herzen verfolgt haben.“ Die Handschrift selbst verwendet jedoch Pluralformen. „In ihrem Herzen“ kann sich auf das Herz der Verfolgten oder auf das der ungenannten Verfolger beziehen.'
    reason: textual_variant
  - marker: b
    text: „Bauch“ gibt das konkrete Körperwort wieder; möglich wären auch „Magen“ oder sinngemäß „Inneres“. Das Verb bedeutet hier „füllen“ bzw. „sättigen“; die Hungernden sind dabei ausdrücklich als Handelnde genannt. Der Text nennt nicht ausdrücklich, was der Begehrende begehrt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: selig
  rationale: Bewahrt die feierliche Form der Seligpreisung; „glücklich“ oder „vom Glück begünstigt“ wäre hier schwächer.
- source_word: ⲇⲓⲱⲕⲉ
  choice: verfolgen
  rationale: Gibt den feindseligen Sinn des griechischen Lehnworts wieder, ohne ihn zu einer bloßen Verfolgungsjagd abzuschwächen.
- source_word: ϩⲣⲁⲓ ϩⲛⲡⲉⲩϩⲏⲧ
  choice: in ihrem Herzen
  rationale: Folgt der Präpositionalwendung eng und erhält die mögliche Mehrdeutigkeit des Possessivbezugs.
- source_word: ⲥⲟⲟⲩⲛ ⲡⲉⲓⲱⲧ ϩⲛⲟⲩⲙⲉ
  choice: den Vater in Wahrheit erkannt haben
  rationale: Gibt sowohl das Erkennen als auch die Wendung „in Wahrheit“ wieder und wahrt deren theologisches Gewicht.
- source_word: ⲛⲉⲧϩⲕⲁⲉⲓⲧ
  choice: die Hunger gelitten haben
  rationale: Natürliches Deutsch für die im Kontext rückblickend aufgefasste Hungererfahrung; die handschriftliche Pluralform bleibt erhalten.
- source_word: ϩⲓⲛⲁ
  choice: damit
  rationale: Markiert die im Koptischen ausgedrückte Zweck- oder Folgebeziehung, ohne sie weiter festzulegen.
- source_word: ⲡϩⲏ
  choice: Bauch
  rationale: Bewahrt das konkrete, körperliche Bild; „Magen“ wäre anatomischer, „Inneres“ stärker vergeistigend.
- source_word: ⲥⲓⲟ
  choice: gefüllt wird
  rationale: Passt zum konkreten Bild des Bauches und lässt zugleich die Bedeutung „gesättigt werden“ anklingen.
- source_word: ⲟⲩⲱϣ
  choice: begehrt
  rationale: Erhält den offenen Gegenstand des Wollens oder Verlangens, statt ihn ausdrücklich auf Nahrung zu beziehen.
- source_word: ⲡⲉⲓⲱⲧ
  choice: der Vater
  rationale: Die Großschreibung kennzeichnet die titelartige Gottesbezeichnung, ohne einen zusätzlichen Deutungssatz einzuführen.
theological_decisions:
- issue: Bezug von „in ihrem Herzen“
  choice: Die Formulierung bleibt im Haupttext mehrdeutig.
  alternative: „die innerlich verfolgt worden sind“ oder „die im Herzen ihrer Verfolger verfolgt worden sind“
  rationale: Das koptische Possessivpronomen kann auf die Verfolgten oder auf die unbestimmten Verfolger bezogen werden; eine eindeutige Auflösung wäre interpretierend.
- issue: Logik der zweiten Seligpreisung
  choice: „damit“ bewahrt die Zweck-/Folgespannung.
  alternative: „sodass“ oder eine ausdrückliche Deutung als geistlicher Hunger
  rationale: Der Text verbindet den Hunger der einen mit der Füllung des Bauches dessen, der begehrt, ohne Identität, Gegenstand des Begehrens oder geistliche Bedeutung ausdrücklich zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit der vertrauten Seligpreisungsformel „Selig sind“. Die körperlich-konkrete Bildsprache bleibt erhalten. Der Plural der Handschrift wird gegenüber der teilweise singularischen Normalisierung bevorzugt; syntaktische und theologische Mehrdeutigkeiten werden nicht stillschweigend aufgelöst.
