base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/060.yaml
  text: '⟨They saw⟩ a Samaritan carrying a lamb[a], going into Judea. He said to his disciples, "That one around the lamb?"

    They said to him, "So that he may kill it and eat it."

    He said to them, "As long as it is alive, he will not eat it, but if he kills it and it becomes a corpse."

    They said, "Otherwise he will not be able to do it."

    He said to them, "You yourselves, seek a place for yourselves in rest[b][c], so that you will not become a corpse and they eat you."'
translation:
  language: de
  text: '⟨Sie sahen⟩[a] einen Samariter, der ein Lamm trug und nach Judäa hineinging. Er sagte zu seinen Jüngern: „Der da bei dem Lamm?“[b]


    Sie sagten zu ihm: „Damit er es schlachtet und isst.“


    Er sagte zu ihnen: „Solange es lebt, wird er es nicht essen, sondern erst, wenn er es geschlachtet hat und es zu einem Leichnam geworden ist.“


    Sie sagten: „Auf andere Weise wird er es nicht tun können.“


    Er sagte zu ihnen: „Sucht auch ihr euch einen Ort in der Ruhe, damit ihr nicht zu einem Leichnam werdet und sie euch essen.“[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die ersten Worte sind im Manuskript nicht erhalten beziehungsweise nur als Ergänzung lesbar. Herausgeber ergänzen „Sie sahen“, damit der Satz ein Hauptverb erhält.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich ist die koptische Frage stark verkürzt: etwa „Der da bei/um das Lamm?“ Die Antwort der Jünger zeigt, dass sie sie als Frage nach der Absicht des Mannes verstanden.'
    reason: lexical_alternative
  - marker: c
    text: 'Im Koptischen steht aktiv und mit unbestimmtem Subjekt: „und sie euch essen“. Gemeint sein kann ähnlich wie bei einem deutschen Passiv: „und ihr gegessen werdet“.'
    reason: register_note
lexical_decisions:
- source_word: ⲥⲁⲙⲁⲣⲉⲓⲧⲏⲥ
  choice: Samariter
  rationale: Die geläufige moderne deutsche Bezeichnung gibt das koptische, aus dem Griechischen entlehnte Ethnonym direkt wieder.
- source_word: ⲡⲏ ⲙ̄ⲡⲕⲱⲧⲉ ⲙ̄ⲡⲉϩⲓⲉⲓⲃ
  choice: Der da bei dem Lamm?
  rationale: Die stark elliptische Formulierung wird nicht zu einer eindeutigen Warum-Frage ergänzt. „Bei“ gibt die räumlich-relationale Wendung natürlich wieder, ohne eine im Text nicht ausdrücklich genannte Absicht vorwegzunehmen.
- source_word: ⲙⲟⲟⲩⲧ
  choice: schlachten
  rationale: Im Zusammenhang mit einem Lamm und anschließendem Verzehr ist „schlachten“ idiomatischer und präziser als das allgemeinere „töten“.
- source_word: ⲡⲧⲱⲙⲁ
  choice: Leichnam
  rationale: Das griechische Lehnwort πτῶμα bezeichnet einen toten beziehungsweise gefallenen Körper. „Leichnam“ lässt die bewusste Wiederholung beim Lamm und bei den Jüngern erkennen.
- source_word: ϣⲁ
  choice: tun können
  rationale: Die Konstruktion bezeichnet Fähigkeit oder Möglichkeit; das futurische ⲛⲁ wird mit „wird … können“ wiedergegeben. Das pronominale Objekt bleibt wie im Koptischen allgemein.
- source_word: ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: Ruhe
  rationale: „Ruhe“ bewahrt die religiöse und existentielle Spannweite des griechischen Lehnworts ἀνάπαυσις, ohne sie als bloße Erholung oder bereits als bestimmte Heilslehre festzulegen.
theological_decisions:
- issue: Deutung der elliptischen Frage über den Mann und das Lamm
  choice: „Der da bei dem Lamm?“
  alternative: „Warum trägt dieser Mann das Lamm?“
  rationale: Der koptische Wortlaut nennt weder ausdrücklich „warum“ noch ein Verb des Tragens in der Frage. Die knappe, rätselhafte Form bleibt daher erhalten; die Antwort der Jünger erschließt die gemeinte Frage nur indirekt.
- issue: Bedeutung von „Ruhe“
  choice: Der Ausdruck bleibt unkommentiert als „Ruhe“ stehen.
  alternative: „ewige Ruhe“, „Heilsruhe“ oder „Ort der Erlösung“
  rationale: Der Text lässt die genaue theologische Beschaffenheit dieser Ruhe offen. Eine dogmatisch präzisierende Ergänzung würde die genuine Mehrdeutigkeit einschränken.
- issue: Unbestimmtes Subjekt im Schlusssatz
  choice: „und sie euch essen“
  alternative: „und ihr gegessen werdet“
  rationale: Das aktive Subjekt der dritten Person Plural bleibt wie im Koptischen unbestimmt. Dadurch bleibt die drastische Bildsprache erhalten, ohne die Handelnden zu identifizieren.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst bewahrter Mündlichkeit im Dialog. Die ungewöhnliche Ellipse der ersten Frage und das unbestimmte „sie“ am Schluss bleiben erhalten. „Leichnam“ wird an beiden Stellen gleich übersetzt, damit die Verbindung zwischen dem getöteten Lamm und der Warnung an die Jünger sichtbar bleibt.
