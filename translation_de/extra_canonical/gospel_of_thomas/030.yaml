base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/030.yaml
  text: Jesus says[1], "Where there are three gods, they are gods. Where there are two or one[a][3][2], I am with him."
translation:
  language: de
  text: '**30** Jesus sagt: „Wo drei Götter sind, sind sie Götter.[a] Wo zwei oder einer sind,[b] bin ich bei ihm.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Handschrift bietet hier einen schwierigen Wortlaut, der wörtlich etwa „sie sind in einem Gott“ ergeben kann; die normalisierte Textfassung liest abweichend „es ist ein Gott“. Die Übersetzung „sie sind Götter“ folgt einer plausiblen pluralischen Deutung der Handschriftenlesung, die auch durch den griechischen Textzeugen POxy 1 gestützt wird.
    reason: textual_variant
  - marker: b
    text: POxy 1 erwähnt hier nur den Einzelnen, nicht „zwei“, und setzt den Spruch mit den Bildern vom Stein und vom Holz fort. Diese Fortsetzung steht im koptischen Thomasevangelium gesondert in Spruch 77.
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jesus sagt
  rationale: Das im Thomasevangelium übliche erzählende Präsens bewahrt die unmittelbare, knappe Form der Spruchsammlung.
- source_word: ⲡⲙⲁ ⲉⲣⲉ- … ⲙⲙⲁⲩ
  choice: wo
  rationale: Die Wendung bedeutet wörtlich „der Ort, an dem“; „wo“ gibt sie im Deutschen natürlich und ohne räumliche Doppelung wieder.
- source_word: ϣⲟⲙⲧ ⲛⲛⲟⲩⲧⲉ
  choice: drei Götter
  rationale: Der auffällige Plural wird wörtlich bewahrt und nicht zu „Göttliche“ oder einer monotheistisch geglätteten Form umgedeutet.
- source_word: ⲥⲛⲁⲩ ⲏ ⲟⲩⲁ
  choice: zwei oder einer
  rationale: Die Zahlen und die Disjunktion werden direkt wiedergegeben. „Einer“ lässt erkennen, dass im folgenden Ausdruck eine männliche Singularperson aufgenommen wird.
- source_word: ⲁⲛⲟⲕ ϯϣⲟⲟⲡ / ⲁⲛⲟⲕ ϣⲱⲡⲉ
  choice: bin ich
  rationale: Das selbstständige Pronomen vor der Verbform setzt den Sprecher in den Fokus, stellt aber keine wörtliche Verdoppelung „Ich—ich“ dar. Durch die deutsche Wortstellung nach dem vorangestellten Wo-Satz erhält „ich“ bereits natürlichen Nachdruck.
- source_word: ⲛⲙⲙⲁϥ / ⲙⲛⲛⲧⲟϥ
  choice: bei ihm
  rationale: Die Präposition bezeichnet Gemeinschaft oder Gegenwart; das maskuline Singularpronomen wird trotz des vorausgehenden „zwei oder einer“ nicht grammatisch geglättet.
theological_decisions:
- issue: Die anstößige Rede von mehreren Göttern
  choice: „drei Götter … Götter“
  alternative: „drei göttliche Wesen“ oder eine monotheistisch harmonisierte Fassung
  rationale: Der koptische Wortlaut verwendet ausdrücklich den Plural von „Gott“. Seine theologische Spannung bleibt erhalten, ohne eine bestimmte Deutung aufzuzwingen.
- issue: Wechsel vom Plural „zwei“ zum Singular „ihm“
  choice: Den Numeruswechsel unverändert stehen lassen
  alternative: „bin ich bei ihnen“
  rationale: Der überlieferte Text hat am Ende ein maskulines Singularpronomen. Eine Angleichung an „zwei“ würde die genuine sprachliche und inhaltliche Spannung beseitigen.
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. Die spruchhafte Parallelstruktur und die ungewöhnlichen Numeruswechsel bleiben sichtbar; unnötige Archaismen und erklärende Ergänzungen im Haupttext werden vermieden.
