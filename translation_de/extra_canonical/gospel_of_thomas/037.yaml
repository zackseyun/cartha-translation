base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/037.yaml
  text: His disciples said, "When[a] will you be revealed[f] to us, and when will we see you?" Jesus said, "When you strip naked without being ashamed,[b] and you take your clothes and put them under your feet like[e] the little children,[c] and trample on them, then[d] you will see the Son of the Living One,[g] and you will not be afraid."
translation:
  language: de
  text: 'Seine Jünger fragten: „Wann[a] wirst du dich uns offenbaren,[b] und wann werden wir dich sehen?“ Jesus sagte: „Wenn ihr euch nackt auszieht, ohne euch zu schämen,[c] eure Kleider nehmt und sie wie die kleinen Kinder[d] unter eure Füße legt und auf sie tretet, dann[e] werdet ihr den Sohn des Lebendigen[f] sehen, und ihr werdet euch nicht fürchten.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „An welchem Tag“. Gemeint ist idiomatisch: „Wann?“'
    reason: Die Formulierung enthält das Wort „Tag“, fungiert aber als Zeitfrage.
  - marker: b
    text: 'Oder: „für uns sichtbar werden“.'
    reason: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ umfasst das Sichtbar- oder Offenbarwerden.
  - marker: c
    text: 'Wörtlich: „wenn ihr euch nackt auszieht und euch nicht schämt“.'
    reason: Die koptische Formulierung nennt Nacktheit ausdrücklich.
  - marker: d
    text: 'Gemeint sein kann: so, wie kleine Kinder mit ihren Kleidern umgehen; der genaue Bezug des Vergleichs bleibt offen.'
    reason: Die Stellung des Vergleichs lässt Spielraum, ob er besonders das Niederlegen, das Treten oder die ganze Handlung beschreibt.
  - marker: e
    text: Im Manuskript ist „dann“ an dieser Stelle teilweise ergänzt, der Sinn der Satzkonstruktion ist jedoch klar.
    reason: 'Textkritische Transparenz: ⲧⲟⲧ[ⲉ] steht am beschädigten Zeilenende; auch der folgende Wortanfang ist ergänzt.'
  - marker: f
    text: 'Wörtlich: „den Sohn dessen, der lebt“; wahrscheinlich eine Gottesbezeichnung. Im Text steht jedoch nicht ausdrücklich „Gott“.'
    reason: Die eigentümliche und theologisch offene Titulatur soll erklärt, aber nicht im Haupttext aufgelöst werden.
lexical_decisions:
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: sich offenbaren
  rationale: Die koptische Wendung bedeutet, sichtbar bzw. offenbar zu werden. Das reflexive „sich offenbaren“ wahrt hier den personalen und möglicherweise eschatologischen Klang, ohne eine bestimmte Deutung festzulegen.
- source_word: ⲕⲱⲕⲛⲧⲱⲧⲛ ⲁϩⲏⲩ
  choice: euch entkleidet
  rationale: Die Konstruktion bezeichnet das Ausziehen bis zur Nacktheit. „Sich entkleiden“ ist im Deutschen natürlich und würdevoll, ohne die Bildsprache abzuschwächen.
- source_word: ϥⲓ ⲛⲛⲉⲧⲛϣⲧⲏⲛ
  choice: eure Kleider nehmt
  rationale: ϥⲓ bedeutet hier „nehmen/aufheben/tragen“. „Nehmt“ erhält die ausdrückliche Handlung, die vor dem Niederlegen genannt wird.
- source_word: ⲛⲓⲕⲟⲩⲉⲓ ⲛϣⲏⲣⲉ ϣⲏⲙ
  choice: die kleinen Kinder
  rationale: Die doppelte Verkleinerung bezeichnet kleine bzw. junge Kinder. Der bestimmte Artikel wird beibehalten.
- source_word: ϫⲟⲡϫⲡ
  choice: auf sie tretet
  rationale: Das Verb kann „treten“ bzw. „niedertreten“ bedeuten. „Auf sie tretet“ gibt die konkrete Handlung wieder, ohne durch „zertrampeln“ unnötig Gewalt zu verstärken.
- source_word: ⲡϣⲏⲣⲉ ⲙⲡⲉⲧⲟⲛϩ
  choice: der Sohn des Lebendigen
  rationale: Die substantivierte Form „der Lebendige“ bleibt erhalten; sie darf auf Gott verweisen, ohne dass „Gott“ ausdrücklich ergänzt wird.
theological_decisions:
- issue: Bedeutung des Entkleidens und Zertretens der Kleider
  choice: Die konkrete Bildsprache wird unverändert wiedergegeben.
  alternative: Das Bild als Ablegen des alten Menschen, Überwindung der Scham oder Rückkehr zur kindlichen Unschuld ausdeuten.
  rationale: Der Ausspruch erklärt sein Symbol nicht eindeutig. Eine Übersetzung soll keine bestimmte anthropologische, asketische, sakramentale oder gnostische Deutung in den Text eintragen.
- issue: Identität des „Sohnes des Lebendigen“
  choice: Die Genitivform bleibt als „Sohn des Lebendigen“ stehen.
  alternative: „Sohn des lebendigen Gottes“ oder „Sohn des Lebendigen [Gottes]“.
  rationale: Im koptischen Text steht kein ausdrückliches Wort für „Gott“. Die elliptische Gottesbezeichnung wird daher bewahrt.
- issue: Zeitpunkt der Offenbarung
  choice: „Wann“ wird als offene zeitliche Frage übersetzt.
  alternative: „An welchem Tag“, mit stärker wörtlicher Wiedergabe von ⲁϣ ⲛϩⲟⲟⲩ.
  rationale: Die koptische Wendung fragt idiomatisch nach dem Zeitpunkt. „Wann“ ist im modernen Deutsch natürlich und legt weder einen Kalendertag noch ein Endzeitdatum fest.
translation_notes:
  register: Moderne, verständliche und zugleich würdevolle Standardsprache. Die direkte Rede bleibt knapp und rhythmisch. Die auffällige Symbolsprache sowie die elliptische Gottesbezeichnung werden nicht harmonisiert oder konfessionell ausgelegt.
