base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/092.yaml
  text: Jesus said[a], “Seek, and you will find. But the things that you asked me about in those days, which I did not tell you on that day—now I am willing to tell them[e][d][c][b], and you are not seeking them.”
translation:
  language: de
  text: 'Jesus sagte: „Sucht, und ihr werdet finden.[d] Aber die Dinge[a], nach denen ihr mich[b] in jenen Tagen gefragt habt und die ich euch an jenem Tag nicht mitgeteilt habe – jetzt bin ich bereit[c], sie euch mitzuteilen; doch ihr sucht nicht nach ihnen.“[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Relativkonstruktion kann nach der normalisierten Textform singularisch („das, wonach“) verstanden werden. Die Handschriftenform und die folgenden pluralischen Rückverweise sprechen jedoch für „die Dinge“.
    reason: textual_variant
  - marker: b
    text: Die gedruckte morphologische Segmentierung legt die Lesart „ihr habt nach ihnen gefragt“ nahe, während die normalisierte Fassung „ihr habt mich nach ihnen gefragt“ stützt. Die Übersetzung folgt der normalisierten Fassung und gibt zugleich den Gegenstand der Frage wieder.
    reason: textual_variant
  - marker: c
    text: 'Die koptische Verbindung kann sowohl Bereitschaft als auch Absicht ausdrücken; möglich ist daher auch: „Jetzt bin ich im Begriff, sie euch mitzuteilen.“'
    reason: lexical_alternative
  - marker: d
    text: Zum Wortpaar „suchen … finden“ vgl. Matthäus 7,7 und Lukas 11,9. Das Thomasevangelium führt den Gedanken jedoch eigenständig mit dem Gegensatz zwischen damals und jetzt fort.
    reason: cross_reference
  - marker: e
    text: 'Alternativ lässt sich die Satzfolge stärker gliedern: „Aber die Dinge, nach denen ihr mich in jenen Tagen gefragt habt, teilte ich euch an jenem Tag nicht mit. Jetzt bin ich bereit, sie euch mitzuteilen; doch ihr sucht nicht nach ihnen.“'
    reason: translation_alternative
lexical_decisions:
- source_word: ϣⲓⲛⲉ
  choice: sucht
  rationale: Das Verb bezeichnet aktives Suchen. Der knappe Imperativ bewahrt zugleich die feste Verbindung mit ϭⲓⲛⲉ („finden“).
- source_word: ϭⲓⲛⲉ
  choice: finden
  rationale: Dies ist die direkte und im Kontext erwartbare Entsprechung zu „suchen“.
- source_word: ⲁⲗⲗⲁ
  choice: aber
  rationale: Das griechische Lehnwort markiert den scharfen Gegensatz zwischen der allgemeinen Aufforderung und dem gegenwärtigen Nicht-Suchen der Angesprochenen.
- source_word: ⲛⲉⲧⲁ… / ⲡⲉⲧⲉⲣⲉ…
  choice: die Dinge
  rationale: Die Handschriftenform und die späteren pluralischen Rückverweise stützen den Plural; die normalisierte Fassung zeigt dagegen eine singularische Relativkonstruktion.
- source_word: ϫⲛⲟⲩⲉⲓ ⲉⲣⲟⲟⲩ
  choice: nach denen ihr mich gefragt habt
  rationale: 'ϫⲛⲟⲩⲉⲓ enthält das Objekt „mich“, während ⲉⲣⲟⲟⲩ den Gegenstand der Frage bezeichnet: „über sie/nach ihnen“.'
- source_word: ⲛ̄ⲛⲓϩⲟⲟⲩ
  choice: in jenen Tagen
  rationale: Die temporale deiktische Wendung wird idiomatisch wiedergegeben und vom folgenden Singular „an jenem Tag“ unterschieden.
- source_word: ⲙ̄ⲫⲟⲟⲩ ⲉⲧⲙ̄ⲙⲁⲩ
  choice: an jenem Tag
  rationale: Die Wiedergabe erhält die ausdrückliche Wiederholung von „Tag/Tagen“ und verkürzt die Wendung nicht bloß zu „damals“.
- source_word: ϫⲱ / ϫⲟⲟⲩ
  choice: sagen
  rationale: Das Verb bezeichnet hier das Mitteilen eines Inhalts an die Angesprochenen; „sagen“ bleibt nah am Ausgangstext.
- source_word: ⲧⲉⲛⲟⲩ
  choice: jetzt
  rationale: Direkte Wiedergabe des temporalen Gegensatzes zur früheren Situation.
- source_word: ⲉϩⲛⲁ + ϫⲟⲟⲩ
  choice: ich bin bereit, sie euch zu sagen
  rationale: Die periphrastische Konstruktion kann Bereitschaft oder unmittelbar bevorstehende Absicht ausdrücken. „Bin bereit“ passt zum Gegensatz zum früheren Nicht-Sagen, ohne die Alternative auszuschließen.
- source_word: ⲛ̄ⲥⲱⲟⲩ
  choice: nach ihnen
  rationale: Mit ϣⲓⲛⲉ bezeichnet die Präposition das Ziel des Suchens; die deutsche Fügung „nach ihnen suchen“ bildet dies natürlich ab.
theological_decisions:
- issue: Bezug des Nicht-Sagens
  choice: Der Relativsatz bezieht sich auf „die Dinge“, nach denen gefragt wurde.
  alternative: 'Ein eigenständiger Hauptsatz: „Ich sagte sie euch damals nicht.“'
  rationale: Die circumstantielle Konstruktion lässt sich als weiterer Relativbezug auf das vorangestellte Thema verstehen. Die Übersetzung wahrt diese syntaktische Spannung, ohne einen Grund für das frühere Schweigen zu ergänzen.
- issue: Bereitschaft oder unmittelbar bevorstehende Handlung
  choice: „jetzt bin ich bereit“
  alternative: „jetzt bin ich im Begriff“ oder „jetzt will ich“
  rationale: Der Text kann Bereitschaft wie Absicht ausdrücken. „Bereit“ erhält den Kontrast zum früheren Nicht-Sagen und vermeidet eine stärkere zeitliche Festlegung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Spruchstil. Das vertrauliche Pluralpronomen „ihr“ bildet die koptische zweite Person Plural ab. Die leicht markierte Wiederholung „in jenen Tagen … an jenem Tag“ ist bewusst erhalten, ebenso der abrupte Gegensatz am Ende.
