base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/096.yaml
  text: Jesus said[a], "The Father's kingdom is like a woman. She took a little leaven, hid it in dough, and made it into big loaves. Whoever has ears[c][b], let him hear."
translation:
  language: de
  text: 'Jesus sagte: „Das Reich des Vaters gleicht einer Frau.[c] Sie nahm ein wenig Sauerteig[a], verbarg ihn in Teig und machte daraus große Brote.[b] Wer Ohren hat, soll hören.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Sauerteig“ (ⲥⲓⲣ) bezeichnet hier ein traditionelles Gärmittel beziehungsweise einen Sauerteigansatz, nicht moderne industriell hergestellte Backhefe.
    reason: cultural_note
  - marker: b
    text: Die koptische Wendung ⲛⲟⲩⲛⲟϭ ⲛⲛⲟⲉⲓⲕ lässt sich auch als „eine große Menge Brot“ oder „viele Brote“ verstehen. „Große Brote“ bewahrt die mögliche Betonung ihrer Größe.
    reason: lexical_alternative
  - marker: c
    text: An mehreren Stellen auf der Handschriftenseite NHAM02.49 sind Buchstaben beschädigt oder ergänzt. Die Lesung „einer Frau … verbarg ihn in Teig … machte daraus große Brote“ gilt dennoch als textlich gesichert.
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: Reich
  rationale: Das koptische Wort kann Reich, Königsherrschaft oder königliche Herrschaft bezeichnen. „Reich“ bewahrt den im Deutschen vertrauten Ausdruck, ohne die Bildrede auf einen Ort oder ausschließlich auf eine Herrschaftstätigkeit festzulegen.
- source_word: ⲡⲉⲓⲱⲧ
  choice: der Vater
  rationale: Der Text verwendet ausdrücklich die männliche Gottesbezeichnung „Vater“.
- source_word: ⲥϩⲓⲙⲉ
  choice: Frau
  rationale: Die Grundbedeutung ist „Frau“; der Zusammenhang gibt keinen Anlass, „Ehefrau“ zu wählen.
- source_word: ⲕⲟⲩⲓ ⲛⲥⲓⲣ
  choice: ein wenig Sauerteig
  rationale: ⲕⲟⲩⲓ bezeichnet hier eine kleine Menge; ⲥⲓⲣ meint das traditionelle Gärmittel beziehungsweise einen Sauerteigansatz.
- source_word: ϩⲱⲡ
  choice: verbarg
  rationale: Die Grundbedeutung lautet „verbergen, verstecken“. „Verbarg“ erhält die knappe, auffällige Bildsprache.
- source_word: ϣⲱⲧⲉ
  choice: Teig
  rationale: Im Backzusammenhang bezeichnet das Wort am ehesten die zur Verarbeitung bestimmte Teigmasse.
- source_word: ⲉⲓⲣⲉ … ⲛⲟⲩⲛⲟϭ ⲛⲛⲟⲉⲓⲕ
  choice: machte daraus große Brote
  rationale: Die Wendung beschreibt das Ergebnis des Handelns. „Daraus“ ist im Deutschen idiomatisch und lässt den gesamten Backvorgang im Blick, während „große Brote“ die konkrete Bildlichkeit wahrt.
- source_word: ⲙⲁⲁϫⲉ … ⲥⲱⲧⲙ
  choice: Wer Ohren hat, soll hören
  rationale: Dies gibt die knappe Aufforderungsformel natürlich und traditionsnah wieder.
theological_decisions:
- issue: Bedeutung von „Reich des Vaters“
  choice: Reich des Vaters
  alternative: Herrschaft des Vaters
  rationale: „Reich“ hält die räumliche und dynamische Bedeutungsbreite des koptischen Ausdrucks offen und vermeidet eine einseitige theologische Festlegung.
- issue: Vergleichspunkt des Gleichnisses
  choice: Keine Deutung in den Haupttext aufgenommen
  alternative: Ausdrückliche Deutung als verborgenes Wachstum oder alles durchdringende Wirkung
  rationale: Der Spruch erklärt seinen Vergleichspunkt nicht. Die Übersetzung bewahrt diese Offenheit und fügt keine konfessionelle oder allegorische Auslegung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper parabolischer Satzführung. „Gleicht“ klingt gehoben, bleibt aber allgemein verständlich. Die Schlussformel bleibt bewusst prägnant und traditionsnah.
