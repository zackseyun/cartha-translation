  source_fidelity: 'Die Übersetzung gibt die wiederholte Frage-Antwort-Struktur, die Unterscheidung von ϣⲱⲡⲉ („ins Dasein kommen/entstehen“) und ⲉⲓ („hervorkommen“), die elliptische Identitätsfrage sowie die pluralische Unbestimmtheit bei „ihrem Bild“ im Wesentlichen zuverlässig wieder. Die Verbindung von „Licht“ und „Ort“ ist jedoch appositionell: Der Ort bezeichnet das Licht näher, nicht einen zweiten, davon unabhängigen Herkunftsort.'
  naturalness: Modernes, würdiges Standarddeutsch. „Stand“ ist hier natürlicher und enger am knappen koptischen Verb als „dastand“; „dem Ort, an dem“ verdeutlicht zugleich die appositionelle Satzfügung ohne zusätzliche Deutung.
  terminology: „Licht“, „Kinder“, „Erwählten“, „lebendiger Vater“, „Bewegung und Ruhe“ sind sachgerecht. Die Kleinschreibung von „Vater“ vermeidet eine nicht vom Text erzwungene dogmatische Festlegung. Die Fußnoten sichern die textliche Beschädigung, die Pronomenmehrdeutigkeit und die Ellipse angemessen ab.
  issues:
  - severity: medium
    issue: „von dem Ort“ behandelt den Ort als eine weitere Herkunftsangabe neben dem Licht.
    rationale: 'ⲡⲟⲩⲟⲉⲓⲛ ⲡⲙⲁ („das Licht, der Ort ...“) bildet eine Apposition. Im Deutschen sollte der Ort daher als nähere Bestimmung des Lichts angeschlossen werden: „aus dem Licht, dem Ort, an dem ...“.'
  - severity: low
    issue: „dastand“ fügt gegenüber dem knappen ⲟⲩⲱϩⲉ eine deiktische Nuance hinzu.
    rationale: „stand“ ist im modernen Deutsch natürlich und gibt das einfache Verb „stand/nahm seinen Stand ein“ ohne zusätzliche Ortsnuance wieder.
  revised_text: 'Jesus sagte: „Wenn sie zu euch sagen: ‚Woher seid ihr ins Dasein gekommen?‘, dann sagt zu ihnen: ‚Wir sind aus dem Licht hervorgekommen, dem Ort, an dem das Licht aus sich selbst entstand, stand[a] und sich in ihrem Bild offenbarte[b].‘ Wenn sie zu euch sagen: ‚Seid ihr es?‘[c], dann sagt: ‚Wir sind seine Kinder, und wir sind die Erwählten des lebendigen Vaters.‘ Und wenn sie euch fragen: ‚Was ist das Zeichen eures Vaters, der in euch ist?‘, dann sagt zu ihnen: ‚Es ist Bewegung und Ruhe.‘[d]“'
