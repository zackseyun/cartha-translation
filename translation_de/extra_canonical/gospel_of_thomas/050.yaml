base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/050.yaml
  text: Jesus said[1], "If they say to you, 'From where have you come into being?', say to them, 'We have come forth from the light—the place where the light came into being by itself, stood, and was revealed in their image.' If they say to you, 'Are you it?', say, 'We are its children, and we are the chosen of the living father.' And if they ask you, 'What is the sign of your father who is in you?'[2], say to them[c][b][a][5][4][3], 'It is movement and rest.'"
translation:
  language: de
  text: 'Jesus sagte: „Wenn sie zu euch sagen: ‚Woher seid ihr ins Dasein gekommen?‘, dann sagt zu ihnen: ‚Wir sind aus dem Licht hervorgekommen, dem Ort, an dem das Licht aus sich selbst entstand, stand[a] und sich in ihrem Bild offenbarte[b].‘ Wenn sie zu euch sagen: ‚Seid ihr es?‘[c], dann sagt: ‚Wir sind seine Kinder, und wir sind die Erwählten des lebendigen Vaters.‘ Und wenn sie euch fragen: ‚Was ist das Zeichen eures Vaters, der in euch ist?‘, dann sagt zu ihnen: ‚Es ist Bewegung und Ruhe.‘[d]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Manuskript ist an dieser Stelle teilweise beschädigt; ein Teil des Textes ist ergänzt. Die knappe Folge der Verben lautet sinngemäß: Das Licht „entstand“, „stand“ und „offenbarte sich“; die genaue Bedeutung der Wendung um „aus sich selbst“ bleibt unsicher.'
    reason: lacuna_or_restoration
  - marker: b
    text: Wörtlich „in ihrem Bild“. Das koptische Possessivpronomen ist plural, doch worauf es sich bezieht, ist im Zusammenhang nicht eindeutig.
    reason: textual_ambiguity
  - marker: c
    text: 'Die koptische Formulierung ist elliptisch und nennt nicht ausdrücklich, womit die Angeredeten gleichgesetzt werden. Auch möglich: „Seid ihr das?“'
    reason: grammatical_ambiguity
  - marker: d
    text: 'Auch möglich: „eine Bewegung und eine Ruhe“. Bei abstrakten Begriffen wird der koptische unbestimmte Artikel im Deutschen jedoch gewöhnlich nicht eigens wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ϣⲱⲡⲉ ⲉⲃⲟⲗ
  choice: ins Dasein kommen / entstehen
  rationale: Die Wiedergabe wahrt beim Ursprung der Angeredeten und beim Ursprung des Lichts die Bedeutung des Entstehens und unterscheidet das Verb von ⲉⲓ ⲉⲃⲟⲗ, das anschließend mit „hervorkommen“ wiedergegeben wird.
- source_word: ⲉⲓ ⲉⲃⲟⲗ
  choice: hervorkommen
  rationale: Bezeichnet das Kommen aus einem Ursprung und bleibt lexikalisch von ϣⲱⲡⲉ „entstehen/ins Dasein kommen“ unterschieden.
- source_word: ⲡⲟⲩⲟⲉⲓⲛ
  choice: das Licht
  rationale: Entspricht der Grundbedeutung und bewahrt die kosmologische Bildsprache des Spruchs.
- source_word: ⲟⲩⲱϩⲉ ⲉⲣⲁⲧϥ
  choice: dastand
  rationale: Bewahrt das knappe Verb des Stehens, ohne es als Beständigkeit, Selbstbehauptung oder Schöpfungsakt auszudeuten.
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: sich offenbarte
  rationale: Gibt das Sichtbar- oder Offenbarwerden wieder und passt zur anschließenden Wendung vom Bild.
- source_word: ⲡⲉⲩϩⲓⲕⲱⲛ
  choice: ihrem Bild
  rationale: Das koptische Possessivpräfix ist plural; die unklare Beziehung des Pronomens wird nicht zu „seinem“ oder „seinem eigenen“ harmonisiert.
- source_word: ⲛⲉϥϣⲏⲣⲉ
  choice: seine Kinder
  rationale: Das pluralische Prädikat bezeichnet die Gruppe als Kinder; „Kinder“ ist im Deutschen natürlich und legt kein ausschließlich männliches Geschlecht fest.
- source_word: ⲛ̄ⲥⲱⲧⲡ
  choice: die Erwählten
  rationale: Gibt die substantivierte Bedeutung „die Ausgewählten/Erwählten“ prägnant wieder; „die Auserwählten“ wäre ebenfalls möglich, trägt aber stärkere traditionelle Konnotationen.
- source_word: ⲟⲩⲕⲓⲙ ... ⲙⲛ̄ⲟⲩⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: Bewegung und Ruhe
  rationale: Die koptischen unbestimmten Artikel stehen bei abstrakten Begriffen und müssen im Deutschen nicht als „eine Bewegung und eine Ruhe“ wiedergegeben werden.
theological_decisions:
- issue: Identität in der Frage ⲛⲧⲱⲧⲛ ⲡⲉ
  choice: „Seid ihr es?“
  alternative: „Seid ihr das?“ / Ergänzung eines ausdrücklichen Bezugswortes
  rationale: Die koptische Kopulakonstruktion ist elliptisch. Die Übersetzung erhält diese Offenheit, statt festzulegen, ob sich die Frage auf das Licht, den Ort oder eine andere Größe bezieht.
- issue: Das im Inneren gegenwärtige Vatersein
  choice: „eures Vaters, der in euch ist“
  alternative: „das Zeichen eures Vaters in euch“
  rationale: Der koptische Relativsatz modifiziert „Vater“. Die Übersetzung bewahrt diese syntaktische und theologische Aussage, ohne „in euch“ fälschlich nur auf das Zeichen zu beziehen.
- issue: Bezug von „ihrem Bild“
  choice: Pluralisches Possessivpronomen beibehalten
  alternative: „in seinem Bild“ oder „in seinem eigenen Bild“
  rationale: Der Text hat eine pluralische Possessivform mit unklarem Antezedens. Eine Harmonisierung würde eine nicht ausdrücklich gegebene Kosmologie festschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter, mündlich verständlicher Satzführung. Die wiederholten Aufforderungen „sagt“ und die Parallelstruktur des koptischen Textes bleiben erhalten. Ungewohnte Aussagen werden nicht dogmatisch geglättet; textliche und syntaktische Mehrdeutigkeiten sind im Haupttext bewahrt und knapp erläutert.
