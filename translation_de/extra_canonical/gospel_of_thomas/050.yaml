  to: 'Jesus sagte: „Wenn sie zu euch sagen: ‚Woher seid ihr ins Dasein gekommen?‘, dann sagt zu ihnen: ‚Wir sind aus dem Licht hervorgekommen, dem Ort, an dem das Licht aus sich selbst entstand, stand[a] und sich in ihrem Bild offenbarte[b].‘ Wenn sie zu euch sagen: ‚Seid ihr es?‘[c], dann sagt: ‚Wir sind seine Kinder, und wir sind die Erwählten des lebendigen Vaters.‘ Und wenn sie euch fragen: ‚Was ist das Zeichen eures Vaters, der in euch ist?‘, dann sagt zu ihnen: ‚Es ist Bewegung und Ruhe.‘[d]“'
  rationale: Die Revision stellt die appositionelle Beziehung von „Licht“ und „Ort“ wieder her und ersetzt das leicht überbestimmte „dastand“ durch „stand“. Alle absichtlich bewahrten Mehrdeutigkeiten und die vorhandenen Fußnotenanker bleiben erhalten.
