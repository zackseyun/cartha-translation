base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/025.yaml
  text: Jesus said[a], Love your brother as your soul[e][d][c][b]; guard him as the pupil of your eye.
translation:
  language: de
  text: 'Jesus sagte: »Liebe deinen Bruder wie deine Seele[a]; behüte ihn[b] wie die Pupille deines Auges[c].«[d][e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Wort ⲯⲩⲭⲏ (griechisch ψυχή) kann auch »Leben« oder »Selbst« bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Im Manuskript steht ⲙ̄ⲙⲟϥ mit der Bedeutung »ihn« als direktes Objekt; die normalisierte Fassung hat ⲛⲛⲧⲟϥ, etwa »für ihn«. In beiden Fällen geht es darum, ihn zu behüten oder zu schützen.
    reason: textual_variant
  - marker: c
    text: 'Das koptische ⲡⲉⲗⲟⲩ bezeichnet die Pupille. Die Übersetzung gibt daher wörtlich wieder: »die Pupille deines Auges«.'
    reason: lexical_alternative
  - marker: d
    text: Vergleiche das Motiv vom behüteten Augapfel in 5. Mose 32,10; Psalm 17,8 und Sprüche 7,2.
    reason: cross_reference
  - marker: e
    text: Die Vergleichspartikel steht im Manuskript als ⲛ̄ⲑⲉ, in der normalisierten Fassung als ⲛⲡϩⲉ; beide bedeuten in der hier vertretenen sahidisch-lykopolitanischen Sprachform »wie« oder »gleichwie«.
    reason: dialect_note
lexical_decisions:
- source_word: ⲡⲉϫⲉⲓⲏⲥⲟⲩⲥ
  choice: Jesus sagte
  rationale: Die übliche koptische Redeformel ⲡⲉϫⲉ mit genanntem Subjekt wird knapp und natürlich wiedergegeben.
- source_word: ⲙⲉ
  choice: liebe
  rationale: Bei einem persönlichen Objekt bezeichnet das Verb hier am natürlichsten ethische Liebe, nicht bloß Begehren oder Zuneigung.
- source_word: ⲥⲟⲛ
  choice: Bruder
  rationale: Dies ist die Grundbedeutung und bewahrt die geschwisterliche Sprache des Thomasevangeliums; »Mitmensch« oder »Nächster« wäre stärker deutend.
- source_word: ⲛ̄ⲑⲉ / ⲛⲡϩⲉ
  choice: wie
  rationale: Beide Formen dienen als Vergleichspartikel; »wie« gibt die parallelen Vergleiche idiomatisch wieder.
- source_word: ⲯⲩⲭⲏ
  choice: Seele
  rationale: Das griechische Lehnwort ψυχή kann Seele, Leben oder Selbst bedeuten. »Seele« wahrt die markante Begrifflichkeit und die Mehrdeutigkeit wird in der Fußnote benannt.
- source_word: ⲉⲓⲣⲉ ⲧⲏⲣⲉ(ⲓ)
  choice: behüte
  rationale: Die periphrastische Wendung bedeutet bewahren, hüten oder schützen. »Behüte« ist würdig, verständlich und passt zum folgenden Bild vom Auge.
- source_word: ⲡⲉⲗⲟⲩ
  choice: Augapfel
  rationale: Wörtlich ist die Pupille gemeint. Das deutsche »Augapfel« bezeichnet im Schutzvergleich idiomatisch den besonders sorgsam gehüteten Teil des Auges, ohne die Aussage unnötig zu erklären.
- source_word: ⲃⲁⲗ
  choice: Auge
  rationale: Das einfache anatomische Grundwort liegt dem zusammengesetzten deutschen Ausdruck »Augapfel« zugrunde.
theological_decisions:
- issue: Bezug von ⲥⲟⲛ
  choice: Bruder
  alternative: Mitmensch / Nächster
  rationale: Der Text verwendet ausdrücklich das Wort für Bruder. Eine Ausweitung auf jeden Mitmenschen mag als Auslegung möglich sein, soll aber nicht in die Übersetzung eingetragen werden.
- issue: Bedeutungsumfang von ⲯⲩⲭⲏ
  choice: Seele
  alternative: Leben / Selbst
  rationale: Keine anthropologische Lehrentscheidung wird getroffen; die lexikalisch echten Alternativen werden ausdrücklich offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper Spruchform. »Behüte« wahrt den feierlichen Ton, bleibt aber allgemein verständlich. Die Anredeformen sind singularisch; das grammatische Maskulinum »Bruder« folgt dem ausdrücklich verwendeten Quellwort.
