base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/051.yaml
  text: 'His disciples said to him[a], "On what day will the rest of the dead take place, and on what day will the new world come?"

    He said to them, "That which you are expecting has come[b][c], but you yourselves do not know it."'
translation:
  language: de
  text: 'Seine Jünger sagten zu ihm: „An welchem Tag wird die Ruhe der Toten eintreten, und an welchem Tag wird die neue Welt kommen?“


    Er sagte zu ihnen: „Die Ruhe,[a] nach der ihr Ausschau haltet,[b] ist gekommen; doch ihr selbst kennt sie nicht.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Koptische verwendet hier ein feminines Demonstrativpronomen, das auf das ebenfalls feminine Wort „Ruhe“ zurückverweist.
    reason: grammatical_clarity
  - marker: b
    text: Die koptische Wendung bedeutet bildhaft etwa „vor sich hinausblicken“ und kann auch mit „erwarten“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲁϣ ⲛϩⲟⲟⲩ
  choice: an welchem Tag
  rationale: Die Wendung fragt ausdrücklich nach einem bestimmten Tag; die Wiederholung in beiden Fragen bleibt erhalten.
- source_word: ⲁⲛⲁⲡⲁⲩⲥⲓⲥ
  choice: Ruhe
  rationale: Das griechische Lehnwort ἀνάπαυσις bezeichnet Ruhe oder Rast. „Ruhe“ ist im Deutschen würdig und verständlich, ohne die theologische Bedeutung näher festzulegen.
- source_word: ϣⲱⲡⲉ
  choice: eintreten
  rationale: Bei einem erwarteten Geschehen wie der Ruhe gibt „eintreten“ die Bedeutung „geschehen, stattfinden“ natürlich wieder.
- source_word: ⲡⲕⲟⲥⲙⲟⲥ ⲃⲃⲣⲣⲉ
  choice: die neue Welt
  rationale: ⲕⲟⲥⲙⲟⲥ ist ein griechisches Lehnwort für Welt/Kosmos; ⲃⲃⲣⲣⲉ bedeutet „neu“.
- source_word: ϭⲱϣⲧ ⲉⲃⲟⲗ ϩⲏⲧ-
  choice: nach der ihr Ausschau haltet
  rationale: Die bildhafte koptische Wendung bedeutet wörtlich ungefähr „vor sich hinausblicken“ und idiomatisch „erwarten“. „Ausschau halten nach“ bewahrt sowohl das Bild als auch den Erwartungssinn.
- source_word: ⲧⲏ
  choice: Die Ruhe
  rationale: Das feminine Demonstrativpronomen verweist grammatisch auf das feminine ⲁⲛⲁⲡⲁⲩⲥⲓⲥ („Ruhe“). Die Wiederaufnahme des Substantivs macht diesen Rückbezug im Deutschen eindeutig.
- source_word: ⲛⲧⲱⲧⲛ
  choice: ihr selbst
  rationale: Das selbstständige Pronomen steht vor der Verbform und hebt die Angesprochenen nachdrücklich hervor.
theological_decisions:
- issue: Gegenwärtige Erfüllung und zukünftige Erwartung
  choice: „Die Ruhe … ist gekommen“
  alternative: „Das, was ihr erwartet, ist gekommen“
  rationale: Das koptische Perfekt ⲁⲥⲉⲓ bezeichnet die Ruhe als bereits gekommen, enthält aber kein eigenes Wort für „schon“. Der feminine Rückverweis wird auf „Ruhe“ bezogen, ohne zu erklären, in welchem theologischen Sinn sie gegenwärtig ist.
- issue: Bezug des femininen Demonstrativpronomens
  choice: ausdrücklicher Rückbezug auf „die Ruhe“
  alternative: allgemeines „das, wonach ihr Ausschau haltet“
  rationale: Die feminine Form ⲧⲏ und das feminine Subjektsuffix in ⲁⲥⲉⲓ sprechen grammatisch für den Rückbezug auf ⲁⲛⲁⲡⲁⲩⲥⲓⲥ. Die Übersetzung bewahrt diesen Bezug, statt beide zuvor genannten Erwartungen unterschiedslos zusammenzufassen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die zweimalige Frage „An welchem Tag“ folgt der Parallelstruktur des Koptischen. „Ausschau halten“ bewahrt dessen Bildsprache; „ihr selbst“ gibt die ausdrückliche Hervorhebung der Jünger wieder.
