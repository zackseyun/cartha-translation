  source_fidelity: Die Übersetzung gibt die beiden Fragen nach dem Zeitpunkt der „Ruhe der Toten“ und des Kommens der „neuen Welt“ sowie Jesu Antwort quellentreu wieder. Das Perfekt „ist gekommen“ entspricht ⲁⲥⲉⲓ, ohne das im Koptischen nicht vorhandene „schon/bereits“ hinzuzufügen. Der feminine Rückbezug auf ⲁⲛⲁⲡⲁⲩⲥⲓⲥ („Ruhe“) ist sachlich gut begründet.
  naturalness: Modernes, gut verständliches Standarddeutsch in einem angemessen würdigen Register. „An welchem Tag“ bewahrt die gezielte Zeitfrage und die Parallelität; „nach der ihr Ausschau haltet“ ist idiomatisch und bewahrt zugleich die Bildlichkeit der koptischen Wendung.
  terminology: „Ruhe“, „Ruhe der Toten“ und „neue Welt“ sind präzise und zurückhaltend. Die Wiedergabe vermeidet konfessionell lenkende Deutung. „Ihr selbst“ gibt die hervorgehobene Anrede angemessen wieder.
