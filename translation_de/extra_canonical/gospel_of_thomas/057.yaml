base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/057.yaml
  text: Jesus said, "The kingdom of the Father is like a man who has good seed. His enemy came by night and sowed a weed on the good seed. The man did not allow them to pull up the weed. He said to them, 'Lest you say, "We will pull up the weed," and pull up the wheat along with it. For on the day of the harvest, the weeds will appear; they will be pulled up and burned.'"
translation:
  language: de
  text: 'Jesus sagte: „Das Reich des Vaters gleicht einem Mann, der gutes Saatgut hatte. Sein Feind kam in der Nacht und säte eine Unkrautpflanze[a] auf das gute Saatgut. Der Mann ließ nicht zu, dass sie die Unkrautpflanze ausrissen. Er sagte zu ihnen: ›Geht nicht etwa hin und sagt: „Wir werden die Unkrautpflanze ausreißen“; sonst reißt ihr den Weizen mit ihr aus. Denn am Tag der Ernte werden die Unkrautpflanzen sichtbar; man wird sie ausreißen und verbrennen.[b]‹“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das koptische Lehnwort ⲍⲓⲍⲁⲛⲓⲟⲛ bezeichnet wahrscheinlich Taumellolch oder eine ähnliche Unkrautpflanze. Der Text spricht zunächst im Singular von „einer Unkrautpflanze“ und „der Unkrautpflanze“, am Ende jedoch im Plural von „den Unkrautpflanzen“.
    reason: Bewahrt und erläutert den grammatischen Wechsel vom Singular zum Plural sowie die nicht völlig sichere botanische Bestimmung.
  - marker: b
    text: 'Wörtlicher formuliert der koptische Text mit unbestimmten Handelnden: „Sie reißen sie aus und verbrennen sie.“'
    reason: Erläutert, dass die deutsche unpersönliche Form „man wird“ aktive koptische Verben mit nicht genannten Handelnden wiedergibt.
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ ⲛⲡⲉⲓⲱⲧ
  choice: das Reich des Vaters
  rationale: Bewahrt die ausdrückliche Vater-Beziehung und gibt ⲙⲛⲧⲣⲣⲟ in der für religiöse Herrschaftsaussagen geläufigen, würdigen Form „Reich“ wieder.
- source_word: ⲍⲓⲍⲁⲛⲓⲟⲛ
  choice: Unkrautpflanze / Unkrautpflanzen
  rationale: Das griechische Lehnwort bezeichnet wahrscheinlich Taumellolch beziehungsweise eine dem Weizen ähnliche Unkrautart. „Unkrautpflanze“ ist allgemein verständlich und erlaubt es, den auffälligen Wechsel vom Singular zum Plural im Koptischen zu bewahren.
- source_word: ⲕⲱ ... ⲉϩⲱⲗⲉ
  choice: ließ nicht zu, dass sie ... ausrissen
  rationale: Die Verbindung von ⲕⲱ mit dem Infinitiv bezeichnet hier das Zulassen einer Handlung. Das nicht näher bestimmte „sie“ bleibt wie in der Quelle ohne ausdrücklich genanntes Bezugswort.
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: sichtbar werden
  rationale: Die Wendung bedeutet „offenbar werden, sichtbar werden“. Die Übersetzung vermeidet eine weitergehende Deutung darüber, weshalb die Pflanzen erst bei der Ernte erkennbar sind.
- source_word: ⲡⲱϩⲥ
  choice: Ernte
  rationale: Das Substantiv bezeichnet Ernte beziehungsweise das Ernten; „Tag der Ernte“ gibt die zeitliche Wendung idiomatisch und genau wieder.
theological_decisions:
- issue: Botanische Bestimmung von ⲍⲓⲍⲁⲛⲓⲟⲛ
  choice: Unkrautpflanze
  alternative: Taumellolch
  rationale: „Taumellolch“ wäre botanisch genauer, könnte aber eine Sicherheit vortäuschen, die das Lehnwort im vorliegenden Kontext nicht erzwingt. Die allgemeinere Wiedergabe wahrt den Gegensatz zu Weizen, ohne eine besondere symbolische Auslegung einzutragen.
- issue: Nicht genannte handelnde Personen beim Ausreißen
  choice: Das unbestimmte Pronomen „sie“ im Mittelteil und das unpersönliche „man“ am Schluss
  alternative: Knechte beziehungsweise Erntearbeiter ausdrücklich ergänzen
  rationale: Der koptische Text nennt diese Personengruppen nicht. Ihre Ergänzung aus synoptischen Parallelen würde Informationen in den Thomastext eintragen, die dort unausgesprochen bleiben.
- issue: Zeitpunkt des Sichtbarwerdens der Unkrautpflanzen
  choice: werden ... sichtbar werden
  alternative: werden als Unkraut erkannt werden
  rationale: Die Quelle sagt lediglich, dass sie offenbar oder sichtbar werden. Eine ausdrückliche Identifizierung als Unkraut wäre eine plausible, aber zusätzliche Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher Gleichnissprache. Die verschachtelte Warnung wurde so nah wie möglich an der koptischen Form gehalten, ohne im Deutschen unverständlich zu werden. Nicht im Thomastext genannte Knechte oder Schnitter wurden nicht ergänzt.
