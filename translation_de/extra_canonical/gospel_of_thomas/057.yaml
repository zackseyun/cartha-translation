revisions:
- from: 'Jesus sagte: „Das Reich des Vaters gleicht einem Mann, der guten Samen hatte. Sein Feind kam in der Nacht und säte eine Unkrautpflanze[a] auf den guten Samen. Der Mann ließ nicht zu, dass sie die Unkrautpflanze ausrissen. Er sagte zu ihnen: ›Nicht, dass ihr sagt: „Wir werden die Unkrautpflanze ausreißen“, und dabei den Weizen mit ihr ausreißt. Denn am Tag der Ernte werden die Unkrautpflanzen sichtbar werden; man wird sie ausreißen und verbrennen.[b]‹“'
  to: 'Jesus sagte: „Das Reich des Vaters gleicht einem Mann, der gutes Saatgut hatte. Sein Feind kam in der Nacht und säte eine Unkrautpflanze[a] auf das gute Saatgut. Der Mann ließ nicht zu, dass sie die Unkrautpflanze ausrissen. Er sagte zu ihnen: ›Geht nicht etwa hin und sagt: „Wir werden die Unkrautpflanze ausreißen“; sonst reißt ihr den Weizen mit ihr aus. Denn am Tag der Ernte werden die Unkrautpflanzen sichtbar; man wird sie ausreißen und verbrennen.[b]‹“'
  rationale: Die Revision glättet ausschließlich idiomatische deutsche Formulierungen. Sie bewahrt die im Koptischen nicht näher bestimmten Handelnden, den Singular-Plural-Wechsel bei ⲍⲓⲍⲁⲛⲓⲟⲛ und das bloße Sichtbarwerden der Unkrautpflanzen. Es werden weder Knechte oder Erntearbeiter ergänzt noch botanische oder theologische Deutungen in den Text eingetragen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:05:50Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die zentralen Elemente des koptischen Textes zuverlässig wieder: Reich des Vaters, guter Same, nächtliches Säen durch den Feind, das Nichtzulassen des Ausreißens, die Warnung vor dem Mit-Ausreißen des Weizens, Ernte, Sichtbarwerden sowie anschließendes Ausreißen und Verbrennen. Der auffällige Wechsel von Singular zu Plural bei ⲍⲓⲍⲁⲛⲓⲟⲛ ist gewahrt. Eine kleine sprachliche Revision ist angezeigt: „Nicht, dass ihr sagt“ ist als deutsche direkte Rede unnötig sperrig, und „werden sichtbar werden“ ist redundant.'
  naturalness: Modernes Standarddeutsch wird grundsätzlich erreicht. „Gutes Saatgut“ ist idiomatischer als „guten Samen“ in dieser generischen Gleichnissprache. Die Warnung lässt sich mit „Geht nicht etwa hin und sagt …; sonst …“ klarer und dennoch quellennah ausdrücken. „werden sichtbar“ ist die natürliche Wiedergabe von „werden offenbar/sichtbar“.
  terminology: „Reich des Vaters“ bewahrt die Formulierung der Quelle und den religiösen Registerwert. „Unkrautpflanze“ hält den Singular-Plural-Wechsel besser fest als das deutsche Massennomen „Unkraut“; die Fußnote erläutert die mögliche, aber nicht erzwungene Bestimmung als Taumellolch. „Weizen“ und „Ernte“ sind passend. Die unpersönliche Wiedergabe des finalen aktiven Plurals ist angemessen und wird zutreffend erläutert.
  issues:
  - severity: low
    issue: Unidiomatische Warnungsformel
