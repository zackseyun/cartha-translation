base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/067.yaml
  text: Jesus said[1], "The one who knows the All, yet lacks himself[a][x][t][3][2], is lacking in every respect."
translation:
  language: de
  text: 'Jesus sagte: »Wer das All kennt, aber sich selbst fehlt,[a] dem fehlt es in jeder Hinsicht.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung ist mehrdeutig und kann reflexiv als »sich selbst fehlt« verstanden werden. Möglich sind auch »in sich selbst Mangel leidet« oder »für sich allein Mangel leidet«.
    reason: lexical_alternative
  - marker: b
    text: Im Manuskript ist vor dem zweiten Ausdruck für »fehlen« offenbar ein Subjektspronomen ausgelassen; die Edition ergänzt es. Der Sinn des Satzes bleibt dadurch unverändert.
    reason: lacuna_or_restoration
lexical_decisions:
- source_word: ⲥⲟⲟⲩⲛ (in ⲡⲉⲧⲥⲟⲟⲩⲛ)
  choice: kennt
  rationale: Die Form ist ein Relativpräsens und bezeichnet im sentenzhaften Zusammenhang denjenigen, der kennt; eine perfektive Wiedergabe wie »kennengelernt hat« wäre grammatisch nicht begründet.
- source_word: ⲡⲧⲏⲣϥ
  choice: das All
  rationale: Die substantivierte Totalitätsbezeichnung kann »das Ganze« oder »alles« bedeuten; »das All« bewahrt den möglichen kosmischen Umfang und die markante Ausdrucksweise des Thomasevangeliums.
- source_word: ⲣϭⲣⲱϩ
  choice: entbehren
  rationale: Das Verb bezeichnet Mangel oder Bedürftigkeit. »Entbehren« lässt sich sowohl auf das reflexiv verstandene Objekt als auch auf die abschließende umfassende Aussage beziehen und wahrt die zugespitzte Parallelität.
- source_word: ⲟⲩⲁⲁ (mit ⲛⲧⲟϥ)
  choice: sich selbst
  rationale: Die Verbindung von »allein« mit dem Pronomen stützt eine reflexive Nuance. »Sich selbst entbehren« bewahrt das Paradox, ohne es auszudeuten.
- source_word: ⲛⲡⲙⲁ ⲧⲏⲣⲛⲧⲟϥ
  choice: in jeder Hinsicht
  rationale: Die Wendung fungiert als adverbiale Totalitätsangabe; die deutsche Formulierung ist verständlich und lässt offen, worin der umfassende Mangel besteht.
theological_decisions:
- issue: Bedeutung des Selbstmangels
  choice: »sich selbst entbehrt« ohne erklärende Deutung
  alternative: »in sich selbst Mangel leidet« oder »für sich allein Mangel leidet«
  rationale: Der koptische Ausdruck erlaubt eine reflexive Lesart, bleibt aber ungewöhnlich. Die Übersetzung bewahrt die theologische und anthropologische Spannung, statt sie als Selbsterkenntnis, Seelenverlust oder spirituelle Unvollständigkeit festzulegen.
- issue: Umfang von ⲡⲧⲏⲣϥ
  choice: »das All«
  alternative: »alles« oder »das Ganze«
  rationale: »Das All« lässt einen kosmischen Bezug zu, behauptet ihn jedoch nicht ausdrücklich als festgelegte Lehre.
translation_notes:
  register: Kurzer, sentenzhafter und würdevoller Stil in modernem Standarddeutsch. Die Wiederholung von »entbehrt« bildet die Parallelität des koptischen Textes ab; »das All« und »sich selbst entbehrt« bewahren dessen absichtliche Fremdheit und Mehrdeutigkeit.
