  terminology: »Das All« ist für ⲡⲧⲏⲣϥ vertretbar und bewahrt die mögliche kosmische Resonanz, ohne sie dogmatisch festzulegen. »Sich selbst fehlt« vermeidet eine unnötig archaische Rektion, ohne die mehrdeutige Wendung theologisch einzuengen.
