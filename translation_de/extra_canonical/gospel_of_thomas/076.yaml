base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/076.yaml
  text: 'Jesus said[a], “The Reign of the Father is like a merchant. He had a consignment of goods, and he found a pearl. The merchant was prudent: he sold the consignment and bought the one pearl for himself. You too, seek his treasure that does not fail, that endures—the place where no moth comes in to eat it[e][d][c][b], and no worm destroys.”'
translation:
  language: de
  text: 'Jesus sagte: »Die Herrschaft des Vaters gleicht einem Kaufmann, der eine Warenladung hatte und eine Perle fand. Dieser Kaufmann war klug: Er verkaufte[a] die Warenladung und kaufte sich die eine Perle. Sucht auch ihr nach seinem Schatz[b], der nie zur Neige geht und fortbesteht – an dem Ort, an den keine Motte eindringt, um zu fressen, und kein Wurm[c] ihn zerstört.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Er gab die Warenladung heraus.“ Im Zusammenhang von Handel und anschließendem Kauf ist damit ihre Veräußerung gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Die Handschrift weist an dieser Stelle eine orthografische Korrektur auf. Die Übersetzung folgt der normalisierten Lesart „seinem Schatz“.
    reason: lacuna_or_restoration
  - marker: c
    text: Hier steht „Wurm“, nicht „Rost“ wie in manchen synoptischen Parallelen. Das Bild bezeichnet organischen Verfall.
    reason: cross_reference
lexical_decisions:
- source_word: ⲡⲙⲛⲧⲣⲣⲟ ⲛⲡⲉⲓⲱⲧ
  choice: die Herrschaft des Vaters
  rationale: ⲙⲛⲧⲣⲣⲟ bezeichnet hier die Ausübung königlicher Herrschaft, nicht notwendig ein räumlich gedachtes Reich. „Herrschaft“ gibt diesen abstrakten Sinn in natürlichem Deutsch wieder.
- source_word: ⲣⲱⲙⲉ ⲛϣⲱⲧ / ⲡϣⲱⲧ
  choice: Kaufmann
  rationale: Die wörtliche Verbindung „Mann des Handels“ bezeichnet idiomatisch einen Händler; „Kaufmann“ passt auch zum anschließenden Kaufen und Verkaufen.
- source_word: ⲫⲟⲣⲧⲓⲟⲛ
  choice: Warenladung
  rationale: Das griechische Lehnwort φορτίον bezeichnet eine Last oder Ladung; der Handelszusammenhang legt eine Ladung aus Waren nahe.
- source_word: ⲙⲁⲣⲅⲁⲣⲓⲧⲏⲥ
  choice: Perle
  rationale: Dies ist die übliche Bedeutung des griechischen Lehnworts μαργαρίτης.
- source_word: ⲥⲁⲃⲉ
  choice: klug
  rationale: Das Wort bezeichnet Weisheit beziehungsweise verständiges, umsichtiges Handeln; „klug“ ist im kaufmännischen Zusammenhang natürlich, ohne eine negative Schläue einzutragen.
- source_word: ϯⲡⲫⲟⲣⲧⲓⲟⲛ ⲉⲃⲟⲗ
  choice: verkaufte die Warenladung
  rationale: Die Wendung bedeutet wörtlich etwa „gab die Ladung heraus“. Im Zusammenhang mit dem anschließenden Kauf bezeichnet sie idiomatisch den Verkauf beziehungsweise die Veräußerung der Waren.
- source_word: ⲧⲟⲟⲩ
  choice: kaufte
  rationale: Das Verb bezeichnet regulär das Kaufen oder Erwerben.
- source_word: ⲟⲩⲱⲧ
  choice: die eine Perle
  rationale: Die Verbindung mit dem bestimmten Artikel hebt die Einzigkeit beziehungsweise ausschließliche Wahl dieser einen Perle hervor.
- source_word: ϩⲱⲱⲛⲧⲱⲧⲛ
  choice: auch ihr
  rationale: Die Form ist emphatisch-adverbial und bedeutet „ihr auch“ oder „ihr eurerseits“; sie ist kein Reflexivpronomen und wird daher nicht zusätzlich mit „für euch selbst“ wiedergegeben.
- source_word: ⲡⲉϥⲁϩⲟ
  choice: sein Schatz
  rationale: ⲁϩⲟ kann Vermögen, Reichtum oder Schatz bezeichnen. Das Possessivpronomen bleibt bewusst erhalten, ohne seinen Bezug auslegend festzulegen.
- source_word: ⲉⲙⲁϥⲱϫⲛ ⲉϥⲙⲏⲛ ⲉⲃⲟⲗ
  choice: der nie zur Neige geht, sondern fortbesteht
  rationale: Die beiden Ausdrücke bezeichnen das Nicht-Erschöpftwerden und dauernde Fortbestehen des Schatzes; die deutsche Formulierung bewahrt beide Aspekte.
- source_word: ⲡϥⲛⲧ
  choice: Wurm
  rationale: Der koptische Text nennt ausdrücklich einen Wurm, nicht Rost; damit bleibt das Bild organischen Verfalls erhalten.
theological_decisions:
- issue: Bedeutung von ⲙⲛⲧⲣⲣⲟ
  choice: Herrschaft des Vaters
  alternative: Reich des Vaters
  rationale: Die abstrakte Bildung bezeichnet zunächst königliche Herrschaft oder Königsherrschaft. „Herrschaft“ vermeidet eine unnötige Festlegung auf ein Gebiet, ohne die königliche Dimension des Ausdrucks zu leugnen.
- issue: Bezug von „seinem Schatz“
  choice: Das Possessivpronomen bleibt ohne erklärende Auflösung stehen.
  alternative: Ausdrückliche Identifizierung des Schatzes mit der Perle, dem Kaufmann oder der Herrschaft
  rationale: Der Text nennt den Bezug nicht eindeutig. Eine explizite Identifizierung würde die echte Mehrdeutigkeit des Spruches auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit gut verständlicher Satzführung. „Warenladung“ erhält das konkrete Handelsbild; „nie zur Neige geht“ gibt die Unerschöpflichkeit idiomatisch wieder. Die parataktische Bewegung des koptischen Textes bleibt weitgehend erhalten, wird aber behutsam gegliedert.
