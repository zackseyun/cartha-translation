revisions:
- from: 'Jesus sagte: »Die Herrschaft des Vaters gleicht einem Kaufmann, der eine Warenladung hatte und eine Perle fand. Dieser Kaufmann war klug: Er verkaufte[a] die Warenladung und kaufte sich die eine Perle. Sucht auch ihr nach seinem Schatz[b], der nie zur Neige geht, sondern fortbesteht – nach dem Ort, wohin keine Motte gelangt, um zu fressen, und wo kein Wurm etwas zerstört.[c]«'
  to: 'Jesus sagte: »Die Herrschaft des Vaters gleicht einem Kaufmann, der eine Warenladung hatte und eine Perle fand. Dieser Kaufmann war klug: Er verkaufte[a] die Warenladung und kaufte sich die eine Perle. Sucht auch ihr nach seinem Schatz[b], der nie zur Neige geht und fortbesteht – an dem Ort, an den keine Motte eindringt, um zu fressen, und kein Wurm[c] ihn zerstört.«'
  rationale: Die Revision beschränkt sich auf den Schlussteil. Sie macht den Ortsausdruck zu einer Beschreibung des bleibenden Schatzes, statt ihn als eigenständiges Suchziel zu formulieren. Das ergänzte Pronomen „ihn“ nimmt lediglich das im Deutschen benötigte Objekt von „zerstört“ auf und verweist auf den zuvor genannten Schatz. Die Fußnote zum Wurm wurde an ihr Bezugswort gesetzt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:06:05Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die zentralen Begriffe und die Abfolge des koptischen Textes zuverlässig wieder: die Herrschaft des Vaters, der Kaufmann, Warenladung, Perle, Verkauf, Kauf und die dauerhafte Schatz-Metapher. Auch „auch ihr“ für ϩⲱⲱⲛⲧⲱⲧⲛ ist korrekt und vermeidet die im englischen Audit-Trail dokumentierte, unzutreffende reflexive Übertragung. Im Schlusssatz verschiebt jedoch „– nach dem Ort“ die Syntax: Der Ort beschreibt den unvergänglichen Schatz bzw. dessen Bereich, ist aber nicht als zweites, mit dem Schatz koordiniertes Suchobjekt formuliert.'
  naturalness: 'Bis auf den Schluss ist das Deutsch klar und angemessen würdevoll. „Nach dem Ort, wohin keine Motte gelangt, um zu fressen“ ist jedoch semantisch und syntaktisch holprig: Die Präposition „nach“ lässt den Ort zum zweiten Gegenstand der Suche werden. Eine Ortsbestimmung mit Gedankenstrich bewahrt die knappe Bildfolge und liest sich natürlicher.'
  terminology: „Herrschaft des Vaters“, „Kaufmann“, „Warenladung“, „klug“, „die eine Perle“, „Schatz“ und „Wurm“ sind sachgerecht. „Warenladung“ ist etwas konkret, aber im Handelskontext gut vertretbar. Die Fußnoten sind inhaltlich zutreffend; der Anker der Wurm-Anmerkung sollte unmittelbar bei „Wurm“ stehen.
  issues:
  - severity: medium
    issue: Der Ausdruck „– nach dem Ort“ macht den Ort zu einem zweiten Ziel von „suchen“.
    rationale: Der koptische Schlussteil entfaltet den Ort, an dem Motte und Wurm keinen Zugriff haben, als nähere Bestimmung der vorausgehenden dauerhaften Schatzvorstellung. Die deutsche Koordination mit erneutem „nach“ verändert diese Beziehung unnötig.
  - severity: low
    issue: Der Fußnotenanker c steht erst nach dem Schlusspunkt statt beim Wort „Wurm“.
    rationale: Die Anmerkung erläutert ausdrücklich ⲡϥⲛⲧ („Wurm“). Ein unmittelbarer Anker ist für Leserinnen und Leser eindeutiger.
  revised_text: 'Jesus sagte: »Die Herrschaft des Vaters gleicht einem Kaufmann, der eine Warenladung hatte und eine Perle fand. Dieser Kaufmann war klug: Er verkaufte[a] die Warenladung und kaufte sich die eine Perle. Sucht auch ihr nach seinem Schatz[b], der nie zur Neige geht und fortbesteht – an dem Ort, an den keine Motte eindringt, um zu fressen, und kein Wurm[c] ihn zerstört.«'
  revised_footnotes:
