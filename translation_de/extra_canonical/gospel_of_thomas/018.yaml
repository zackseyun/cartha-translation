  to: 'Die Jünger sagten zu Jesus: »Sag uns, wie unser Ende sein wird.« Er sagte: »Habt ihr denn den Anfang gefunden, dass ihr nach dem Ende sucht? Denn an dem Ort, wo der Anfang ist, wird auch das Ende sein. Selig ist, wer im Anfang vor ihm stehen wird;[a] er wird das Ende kennen und den Tod nicht schmecken.«[b]'
  rationale: Eine minimale lexikalische Korrektur ersetzt »erkennen« durch »kennen«, um ⲥⲟⲩⲱⲛ ohne zusätzlichen Deutungsakzent wiederzugeben. Die vorhandene Übersetzung des pronominalen Suffixes und beide Fußnoten bleiben dem koptischen Wortlaut und seiner Ambiguität verpflichtet.
