base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/018.yaml
  text: The disciples said to Jesus[a], “Tell us how our end will be.” He said, “Have you found the beginning, then, that you are seeking the end? For in the place where the beginning is, there the end will be. Blessed is the one who will stand in the beginning; he will know the end[d][c][b], and he will not taste death.”
translation:
  language: de
  text: 'Die Jünger sagten zu Jesus: »Sag uns, wie unser Ende sein wird.« Er sagte: »Habt ihr denn den Anfang gefunden, dass ihr nach dem Ende sucht? Denn an dem Ort, wo der Anfang ist, wird auch das Ende sein. Selig ist, wer im Anfang vor ihm stehen wird;[a] er wird das Ende kennen und den Tod nicht schmecken.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier: »der vor ihm im Anfang stehen wird«. Das männliche Fürwort kann sich auf den Anfang beziehen oder auf einen unausgesprochenen »Ersten« beziehungsweise Ursprung. Der Bezug bleibt offen.'
    reason: textual_ambiguity
  - marker: b
    text: »Den Tod schmecken« ist eine bildhafte Wendung für »den Tod erfahren«. Welche Art von Tod gemeint ist, erläutert der Spruch nicht.
    reason: cultural_note
lexical_decisions:
- source_word: ϫⲟⲟⲥ ⲉⲣⲟⲛ
  choice: Sag uns
  rationale: Die imperative Bitte bedeutet wörtlich „Sag es uns“; „Sag uns“ ist im Deutschen natürlich und bewahrt die knappe direkte Rede.
- source_word: ⲡϩⲁⲏ
  choice: Ende
  rationale: Das Wort bezeichnet Ende, äußersten Punkt oder Abschluss und steht hier im ausdrücklichen Gegensatz zu ⲡⲁⲣⲭⲏ.
- source_word: ⲡⲁⲣⲭⲏ
  choice: Anfang
  rationale: Das griechische Lehnwort ἀρχή kann auch „Ursprung“ bedeuten. „Anfang“ erhält den wiederholten Gegensatz zu „Ende“.
- source_word: ϭⲱⲗⲡ ⲉⲃⲟⲗ
  choice: gefunden
  rationale: „Finden“ gibt die Frage knapp wieder; „entdeckt“ wäre ebenfalls möglich, würde aber stärker interpretieren.
- source_word: ϣⲓⲛⲉ ⲛⲥⲁ ⲡϩⲁⲏ
  choice: nach dem Ende sucht
  rationale: Die Konstruktion bedeutet idiomatisch „nach etwas suchen“.
- source_word: ϩⲛ ⲡⲙⲁ ⲉⲧⲉⲣⲉ … ⲙⲙⲁⲩ
  choice: an dem Ort, wo …
  rationale: Die ausdrückliche Ortsangabe des Koptischen bleibt erhalten; das anschließende „auch“ gibt die deutsche Korrespondenz natürlich wieder.
- source_word: ⲟⲩⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: Selig
  rationale: „Selig“ ist eine würdige und verständliche Wiedergabe des griechischen Lehnworts μακάριος; „glücklich“ oder „glückselig“ wären mögliche Alternativen.
- source_word: ⲁⲱϩⲉ / ϩⲱϩⲉ
  choice: stehen wird
  rationale: Das Verb bedeutet „stehen“ oder „seinen Stand einnehmen“; die einfache Form wahrt die Prägnanz.
- source_word: ⲉⲣⲁⲧϥ ϩⲛ ⲧⲁⲣⲭⲏ
  choice: im Anfang vor ihm
  rationale: Anders als eine geglättete Wiedergabe nur mit „im Anfang“ bewahrt „vor ihm“ das maskuline Suffix, ohne seinen Bezug festzulegen.
- source_word: ⲥⲟⲩⲱⲛ
  choice: erkennen
  rationale: Das Verb heißt grundsätzlich „kennen/wissen“. „Erkennen“ klingt mit einem Akkusativobjekt im Deutschen natürlich und lässt ein tieferes Erfassen zu, ohne es dogmatisch festzulegen.
- source_word: ϫⲓϯⲡⲉ ⲙⲙⲟⲩ
  choice: den Tod nicht schmecken
  rationale: Die feste bildhafte Wendung bezeichnet das Erfahren des Todes; ihre wörtliche Gestalt wird beibehalten.
- source_word: ⲁⲧⲉⲧⲛ … ⲅⲁⲣ
  choice: denn
  rationale: „Denn“ verleiht der rhetorischen Frage im Deutschen einen folgernden Ton. Die Partikelfolge ist nicht völlig eindeutig; „also“ wäre ebenfalls möglich.
theological_decisions:
- issue: Bezug des maskulinen Suffixes in ⲉⲣⲁⲧϥ
  choice: „vor ihm“ im Haupttext beibehalten, den Bezug aber offenlassen
  alternative: Das Suffix auf „den Anfang“ beziehen oder als Hinweis auf einen impliziten „Ersten/Ursprung“ verstehen; alternativ in der Übersetzung auslassen
  rationale: Das Suffix ist im Manuskript vorhanden, doch sein maskuliner Bezug ist nicht eindeutig. Eine ausdrückliche, aber unaufgelöste Wiedergabe wahrt die echte theologische und grammatische Spannung.
- issue: Bedeutung des Nicht-Schmeckens des Todes
  choice: Bildhafte Aussage ohne erklärenden Zusatz übersetzen
  alternative: Als „wird den Tod nicht erfahren“ paraphrasieren oder es ausdrücklich auf körperlichen beziehungsweise geistlichen Tod beziehen
  rationale: Der Text selbst bestimmt die Art des Todes nicht. Eine nähere Festlegung würde eine theologische Deutung in die Übersetzung eintragen.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper Spruchform. Die Wiederholung von „Anfang“ und „Ende“ bleibt als tragende Gegenüberstellung erhalten. „Selig“ und „den Tod schmecken“ bewahren den feierlichen, traditionsnahen Klang, während Satzbau und direkte Rede für heutige Leser verständlich bleiben.
