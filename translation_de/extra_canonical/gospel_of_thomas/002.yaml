base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/002.yaml
  text: Jesus said[a], "Let the one who seeks not stop seeking until he finds; and when he finds, he will be disturbed; and when he is disturbed, he will marvel[e][d][c][b]; and he will reign over the All."
translation:
  language: de
  text: 'Jesus sagte: „Wer sucht, soll nicht aufhören zu suchen, bis er findet. Und wenn er findet, wird er verstört sein[b]; und wenn er verstört ist, wird er staunen. Und er wird über das All[c] herrschen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische Fragment POxy 654 bietet an dieser Stelle eine abweichende Fassung: Dort folgt auf das Finden sinngemäß „er wird erstaunt sein“; nach dem Herrschen heißt es zusätzlich „wird er ruhen“. Die koptische Fassung unterscheidet dagegen zwischen Verstörtsein und Staunen und endet ohne „ruhen“.'
    reason: textual_variant
  - marker: b
    text: Das koptische Wort kann auch mit „beunruhigt“, „erschüttert“ oder „aufgewühlt“ wiedergegeben werden. Es ist von dem folgenden Verb „staunen“ zu unterscheiden.
    reason: lexical_alternative
  - marker: c
    text: „Das All“ bezeichnet die Gesamtheit der Dinge beziehungsweise das Weltganze, nicht bloß „viele Dinge“.
    reason: cultural_note
lexical_decisions:
- source_word: ⲙⲡⲣⲧⲣⲉ…ⲗⲟ
  choice: soll nicht aufhören
  rationale: Die negative Jussivkonstruktion formuliert eine Aufforderung in der dritten Person. „Soll nicht aufhören“ vermeidet den im Deutschen möglichen falschen Eindruck eines an eine zweite Person gerichteten „Lass … nicht“ und gibt ⲗⲟ als „aufhören“ wieder.
- source_word: ⲡⲉⲧⲉⲣⲉϣⲓⲛⲉ
  choice: wer sucht
  rationale: Das substantivierte Partizip bezeichnet die suchende Person. Die deutsche Relativformel ist knapp, natürlich und geschlechtsübergreifend.
- source_word: ⲉⲣⲉⲛⲧⲟϥϣⲓⲛⲉ ϣⲁⲛⲧⲉⲛⲧⲟϥϭⲓⲛⲉ
  choice: zu suchen, bis er findet
  rationale: Die Formulierung wahrt die fortgesetzte Suche und die temporale Grenze „bis“, ohne den spruchhaften Satz unnötig auszubauen.
- source_word: ϣⲧⲟⲣⲧⲣ
  choice: verstört sein
  rationale: Das Verb bezeichnet ein inneres Erschüttert- oder Beunruhigtsein. „Verstört“ hält diesen Schritt deutlich vom folgenden Staunen ab und lässt offen, worin die Verstörung besteht.
- source_word: ⲣϣⲡⲏⲣⲉ
  choice: staunen
  rationale: „Staunen“ gibt das Moment des Sichwunderns beziehungsweise Erstauntseins knapp und in modernem Deutsch wieder, ohne es mit der vorausgehenden Verstörung gleichzusetzen.
- source_word: ⲣ̄ⲣⲣⲟ
  choice: herrschen
  rationale: Das koptische Verb bedeutet „König sein/herrschen“. „Herrschen“ passt zur Ergänzung mit „über“ und bewahrt den königlichen Sinn besser als das neutralere „bestimmen“.
- source_word: ⲉϫⲛⲡⲧⲏⲣϥ
  choice: über das All
  rationale: Der substantivierte Kollektivausdruck bezeichnet die Gesamtheit beziehungsweise das Weltganze. „Das All“ bewahrt die kosmologische Prägung und reduziert ihn nicht auf „alles Mögliche“.
theological_decisions:
- issue: Bedeutung von „das All“
  choice: Der Ausdruck bleibt als „das All“ stehen.
  alternative: „alles“ oder „die ganze Welt“
  rationale: Der Text erklärt weder Reichweite noch metaphysischen Status der Gesamtheit. Die Übersetzung bewahrt deshalb die mögliche kosmologische Bedeutung, ohne eine bestimmte Lehre über den Kosmos einzutragen.
- issue: Art der Verstörung und des Staunens
  choice: Die Folge wird ohne positive oder negative Deutung wiedergegeben.
  alternative: Die Verstörung als heilsame Erkenntniskrise oder als Furcht auslegen
  rationale: Der Spruch nennt nur die Abfolge von Finden, Verstörung, Staunen und Herrschen. Eine spirituelle oder psychologische Erklärung wäre interpretierende Ergänzung.
translation_notes:
  register: Kurzer, spruchhafter und würdevoller Satzbau in modernem Standarddeutsch. „Wer sucht“ ist natürlicher als „der Suchende“ und vermeidet unnötige Geschlechtsmarkierung. Die wiederholten Glieder „wenn er …“ erhalten den stufenweisen Rhythmus des Koptischen; „das All“ bleibt als bewusst markanter Ausdruck stehen.
