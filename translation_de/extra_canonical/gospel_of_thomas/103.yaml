base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/103.yaml
  text: Jesus said, “Blessed is the man who knows in which part the robbers are coming in, so that he will arise, gather his kingdom, and gird his loins beforehand, before they come in.”
translation:
  language: de
  text: 'Jesus sagte: »Selig ist der Mensch, der weiß, an welcher Stelle[a] die Räuber eindringen werden, damit er aufsteht, sein Königreich[b] sammelt und sich schon vorher gürtet, bevor sie eindringen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in welchem Teil«. Der Ausdruck kann eine Stelle oder einen Abschnitt bezeichnen; eine zeitliche Deutung im Sinn einer Nachtwache ist möglich, wird vom koptischen Text aber nicht eindeutig festgelegt.'
    reason: Bewahrt die lexikalische Unbestimmtheit und erläutert eine mögliche, aber nicht festgelegte zeitliche Deutung.
  - marker: b
    text: Der koptische Text hat auffällig »sein Königreich«. Wiedergaben wie »sein Herrschaftsgebiet«, »seinen Besitz« oder »sein Anwesen« würden das Bild glätten; »Königreich« erhält den Wortlaut.
    reason: Erläutert die ungewöhnliche Bildsprache, ohne eine bestimmte theologische Deutung festzuschreiben.
lexical_decisions:
- source_word: ⲙⲁⲕⲁⲣⲓⲟⲥ
  choice: selig
  rationale: Gibt das griechische Lehnwort μακάριος in der Form eines Seligpreises würdig und traditionsverständlich wieder.
- source_word: ⲙⲉⲣⲟⲥ
  choice: Abschnitt
  rationale: Bewahrt die Grundbedeutung „Teil/Abschnitt“, ohne die im Koptischen nicht ausdrücklich genannte Nachtwache in den Haupttext einzutragen.
- source_word: ⲗⲏⲥⲧⲏⲥ
  choice: Räuber
  rationale: Entspricht dem griechischen Lehnwort λῃστής; der bestimmte Artikel und das spätere Pluralsubjekt verlangen hier den Plural.
- source_word: ⲧⲱⲟⲩⲛ
  choice: aufsteht
  rationale: Gibt das aktive Aufstehen wieder und vermeidet eine Angleichung an synoptisches „wach bleiben“.
- source_word: ⲥⲱⲟⲩϩ
  choice: sammelt
  rationale: Entspricht der konkreten Bedeutung „sammeln/zusammenbringen“ und erhält die ungewöhnliche Bildsprache.
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: Königreich
  rationale: Bewahrt den theologischen Leitbegriff und glättet ihn nicht zu „Besitz“ oder „Anwesen“.
- source_word: ⲙⲟⲩⲣ … ⲉϫⲛ̄ ⲡⲉϥϯⲡⲉ
  choice: sich gürtet
  rationale: Natürliches Deutsch für die Wendung „seine Lenden gürten“; die körperliche Vorbereitung bleibt erkennbar, ohne altertümlich zu klingen.
- source_word: ϩⲁⲡⲉϩⲏ
  choice: schon vorher
  rationale: Drückt die vorausgehende Vorbereitung aus und lässt sich natürlich mit dem abschließenden „bevor sie eindringen“ verbinden.
theological_decisions:
- issue: Bedeutung von ⲙⲛⲧⲣⲣⲟ innerhalb des Gleichnisbildes
  choice: Königreich
  alternative: Herrschaftsgebiet, Besitz oder Anwesen
  rationale: Der ungewöhnliche Ausdruck ist im Koptischen tatsächlich vorhanden. „Königreich“ erhält die theologische Spannung, statt das Bild nach den synoptischen Parallelen zu normalisieren.
- issue: Verhältnis zu Matthäus 24,43 und Lukas 12,39
  choice: 'Die eigenständigen Verben des Thomasevangeliums werden wörtlich erkennbar wiedergegeben: aufstehen, sammeln, sich gürten.'
  alternative: 'Nach den synoptischen Fassungen angleichen: wach bleiben und den Einbruch verhindern.'
  rationale: Die Übersetzung folgt dem vorliegenden koptischen Wortlaut und importiert keine Formulierungen aus Parallelüberlieferungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Selig“ wahrt die Form des Seligpreises; „sich gürten“ ist verständlicher als „seine Lenden gürten“, erhält aber das antike Vorbereitungsbild. Das wiederholte „eindringen“ bildet die Rahmung des koptischen Satzes ab.
