revisions:
- from: 'Die Jünger sagten zu Jesus: „Sag uns, wem das Königreich der Himmel[a] gleicht.“ Er sagte zu ihnen: „Es gleicht einem Senfkorn[b]. Es ist kleiner als alle anderen Samen. Doch wenn es auf bearbeiteten Boden[c] fällt, treibt es einen großen Zweig hervor und wird den Vögeln des Himmels zum Schutz[d].“'
  to: 'Die Jünger sagten zu Jesus: „Sag uns, womit das Königreich der Himmel[a] vergleichbar ist.“ Er sagte zu ihnen: „Es gleicht einem Senfkorn[b]. Es ist das kleinste aller Samen. Doch wenn es auf bearbeiteten Boden[c] fällt, treibt es einen großen Zweig hervor und wird zu einem Schutz für die Vögel des Himmels[d].“'
  rationale: Die Revision korrigiert die nichtpersonale Vergleichsfrage und gibt die superlative Aussage über das Senfkorn ohne den Zusatz „anderen“ wieder. Die Änderung von „den Vögeln … zum Schutz“ zu „zu einem Schutz für die Vögel“ folgt der koptischen Nominalverbindung und verbessert die deutsche Satzführung, ohne die Aussage zu verändern. Fußnotenanker und Fußnotensatz bleiben vollständig und korrekt zugeordnet.
