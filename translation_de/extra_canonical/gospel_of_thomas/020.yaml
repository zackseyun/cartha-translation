  terminology: „Königreich der Himmel“ bewahrt die ausdrückliche Himmelsformulierung und harmonisiert nicht zu „Königreich Gottes“. „Senfkorn“, „bearbeiteter Boden“, „Zweig“ und „Schutz“ sind angemessen. Die Fußnoten erläutern die relevanten lexikalischen und textlichen Punkte ohne zusätzliche Auslegung.
