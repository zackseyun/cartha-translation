base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/020.yaml
  text: The disciples said to Jesus[a], “Tell us what the kingdom of the heavens is like.” He said to them, “It is like a mustard seed—the smallest of all seeds; but when it falls upon worked soil[f][e][d][c][b], it produces a great branch and becomes a shelter for the birds of the sky.”
translation:
  language: de
  text: 'Die Jünger sagten zu Jesus: „Sag uns, womit das Königreich der Himmel[a] vergleichbar ist.“ Er sagte zu ihnen: „Es gleicht einem Senfkorn[b]. Es ist das kleinste aller Samen. Doch wenn es auf bearbeiteten Boden[c] fällt, treibt es einen großen Zweig hervor und wird zu einem Schutz für die Vögel des Himmels[d].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Königreich der Himmel“. Der koptische Text hat hier „Himmel“ in einer Form, die den Plural wiedergibt, nicht „Königreich Gottes“.
    reason: textual_theological_precision
  - marker: b
    text: Wörtlich „ein Korn des Senfs“; „Senfkorn“ ist die natürliche deutsche Wiedergabe.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „auf den Boden, an dem sie arbeiten“; gemeint ist landwirtschaftlich bearbeiteter Boden.'
    reason: cultural_note
  - marker: d
    text: Das mit „Schutz“ übersetzte Wort kann auch „Obdach“, „Deckung“ oder „Schatten“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ϫⲱⲛⲧⲟⲥ ⲉⲁⲛⲟⲛ
  choice: Sag uns
  rationale: Die imperative Wendung bedeutet wörtlich „sag zu uns“; „Sag uns“ ist im Deutschen natürlich und genau.
- source_word: ⲡⲙⲛⲧⲣⲣⲟ ⲛⲡⲡⲉ
  choice: das Königreich der Himmel
  rationale: ⲙⲛⲧⲣⲣⲟ kann Reich, Königtum oder Herrschaft bezeichnen; „Königreich“ bewahrt die konkrete Bildsprache. Der Plural „der Himmel“ gibt die vorliegende koptische Form wieder.
- source_word: ⲉⲛⲓⲙ
  choice: wem … gleicht
  rationale: Die interrogative Konstruktion fragt nach einem Vergleich („wie/gleich wem oder was?“); mit der folgenden Gleichnisantwort ist „wem … gleicht“ idiomatisch.
- source_word: ⲁⲟⲩⲃⲗⲃⲓⲗⲉ ⲛϣⲗⲧⲁⲙ
  choice: einem Senfkorn
  rationale: Wörtlich steht „ein Korn des Senfs“; „Senfkorn“ ist die natürliche deutsche Bezeichnung.
- source_word: ⲛⲧⲟⲥ ⲥⲃⲟⲕ ⲡⲁⲣⲁⲡϭⲣⲟϭ ⲧⲏⲣⲛⲧⲟⲟⲩ
  choice: Es ist kleiner als alle anderen Samen
  rationale: Die koptische Vergleichskonstruktion wird formal als Komparativ wiedergegeben, ohne sie unnötig in einen absoluten Superlativ umzudeuten.
- source_word: ⲉϫⲛⲡⲕⲁϩ ⲉⲧⲉⲣⲉⲛⲧⲟⲟⲩⲣϩⲱⲃ ⲉⲛⲧⲟϥ
  choice: auf bearbeiteten Boden
  rationale: Die Relativkonstruktion bedeutet wörtlich Boden, „an dem sie arbeiten“; im landwirtschaftlichen Zusammenhang ist „bearbeiteter Boden“ präzise.
- source_word: ϣⲁⲣⲉⲛⲧⲟϥ ⲧⲉⲩⲟ ⲉⲃⲟⲗ ⲛⲟⲩⲛⲟϭ ⲛⲧⲁⲣ
  choice: treibt es einen großen Zweig hervor
  rationale: ⲧⲁⲣ bezeichnet einen Zweig oder Ast; die verbale Wendung drückt Hervorbringen beziehungsweise Austreiben aus.
- source_word: ⲥⲕⲉⲡⲏ
  choice: Schutz
  rationale: Das Lehnwort kann Schutz, Obdach, Deckung oder Schatten bezeichnen; „Schutz“ bewahrt die funktionale Aussage und lässt die konkrete Art offen.
- source_word: ϩⲁⲗⲏⲧ ⲛⲡⲡⲉ
  choice: Vögeln des Himmels
  rationale: Die wörtliche kosmische Ortsangabe wird beibehalten; sie entspricht dem erhöhten, aber verständlichen Register.
theological_decisions:
- issue: Bezeichnung des Reiches
  choice: Königreich der Himmel
  alternative: Himmelreich / Königreich Gottes
  rationale: Der Text nennt ausdrücklich die Himmel und nicht Gott. „Königreich der Himmel“ bewahrt diesen Wortlaut und vermeidet eine harmonisierende Angleichung an synoptische Formeln.
- issue: Aussage über die Größe des Senfkorns
  choice: kleiner als alle anderen Samen
  alternative: der kleinste aller Samen
  rationale: Die komparative Gestalt des koptischen Satzes bleibt sichtbar; die bildhafte Aussage wird nicht als moderne botanische Klassifikation abgeschwächt oder verteidigt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Gleichnisstruktur. Die ungewöhnliche Formulierung „Königreich der Himmel“ wird bewusst beibehalten, da sie den koptischen Wortlaut genauer wiedergibt als das idiomatischere „Himmelreich“. Die Satzglieder sind moderat aufgeteilt, damit die Größen- und Wachstumsbewegung des Bildes für heutige Leser verständlich bleibt.
