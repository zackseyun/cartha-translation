base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/038.yaml
  text: Jesus said[a], “Many times you have desired to hear these words that I am saying to you, and you have no other from whom to hear them. There will be days when you will seek me[d][c][b], and you will not find me.”
translation:
  language: de
  text: 'Jesus sagte: „Oft habt ihr verlangt, diese Worte[a] zu hören, die ich euch sage, und ihr habt keinen anderen, von dem ihr sie hören könnt.[b] Es werden Tage kommen,[c] an denen ihr mich suchen und nicht finden werdet.“[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der koptische Text hat zunächst den Singular „dieser Ausspruch/dieses Wort“, wechselt im folgenden Teilsatz jedoch zu einem Pluralpronomen („sie“). „Diese Worte“ harmonisiert den Numerus im Deutschen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Ihr habt keinen anderen, sie von ihm zu hören.“ Nach „einen anderen“ hat „von ihm“ hier den relativen Sinn „von dem/von welchem“.'
    reason: dialect_note
  - marker: c
    text: 'Wörtlich etwa: „Es gibt Tage, die werden entstehen“; dies ist eine koptische futurisch-existentielle Ausdrucksweise.'
    reason: cultural_note
  - marker: d
    text: Vgl. Johannes 7,34; 8,21; 13,33 zum ähnlichen Motiv des Suchens und Nichtfindens. Der Wortlaut des Thomasevangeliums wird nicht an diese Stellen angeglichen.
    reason: cross_reference
lexical_decisions:
- source_word: ϩⲁϩ ⲛⲥⲟⲡ
  choice: oft
  rationale: Die sahidische Wendung bedeutet wörtlich „viele Male“; „oft“ ist im modernen Deutsch natürlich und bewahrt den wiederholten Charakter.
- source_word: ⲣⲉⲡⲓⲑⲩⲙⲉⲓ
  choice: danach verlangt
  rationale: Das griechische Lehnwort ἐπιθυμεῖν bezeichnet ein starkes Wünschen oder Verlangen; die Formulierung bleibt nüchtern und vermeidet eine zusätzliche emotionale Deutung.
- source_word: ⲉⲥⲱⲧⲙ
  choice: zu hören
  rationale: Der Grundsinn ist „hören“; deutendere Wiedergaben wie „beherzigen“ oder „gehorchen“ werden vermieden.
- source_word: ⲡⲉⲓϣⲁϫⲉ ⲡⲁⲓ
  choice: dieses Wort
  rationale: Der koptische Text hat ausdrücklich den Singular „dieses Wort/diesen Ausspruch“. Anders als die englische Konsultationsfassung wird der Numeruswechsel nicht geglättet, sondern in einer Fußnote offengelegt.
- source_word: ⲉⲧⲉⲣⲉ … ϫⲱ ⲛⲛⲧⲟⲟⲩ ⲛⲁⲛⲧⲱⲧⲛ
  choice: das ich euch sage
  rationale: Die durative Konstruktion bezeichnet das gegenwärtige Sprechen. Das deutsche Präsens gibt dies natürlich wieder.
- source_word: ⲙⲛⲧⲁⲛⲧⲱⲧⲛ ⲕⲉⲟⲩⲁ
  choice: ihr habt keinen anderen
  rationale: Die negative Existenz-/Besitzkonstruktion mit „einem anderen“ lässt sich so knapp und idiomatisch wiedergeben.
- source_word: ⲛ̄ⲧⲟϥ
  choice: von dem
  rationale: 'Nach „keinen anderen“ hat das Pronomen relativen Sinn: „von dem/von welchem“. Die maskuline Form nimmt „anderen“ auf.'
- source_word: ⲟⲩⲛ ϩⲉⲛ ϩⲟⲟⲩ ⲛⲁϣⲱⲡⲉ
  choice: Es werden Tage kommen
  rationale: Die koptische futurisch-existentielle Wendung wird in einer geläufigen, würdigen deutschen Form wiedergegeben.
- source_word: ⲛⲧⲉ … ϣⲓⲛⲉ
  choice: an denen ihr mich suchen
  rationale: Die Konstruktion leitet eine auf die kommenden Tage bezogene Zeit-/Relativbestimmung ein; „an denen“ bildet diesen Bezug idiomatisch ab.
- source_word: ⲛⲁϩⲉ ⲁⲛ ⲉ ⲁⲛⲟⲕ
  choice: nicht finden werdet
  rationale: Das Verb bedeutet schlicht „finden“; die Zukunft und Verneinung werden im Deutschen gemeinsam mit „suchen“ ausgedrückt.
theological_decisions:
- issue: Bedeutung der künftigen Abwesenheit Jesu
  choice: 'Die Aussage bleibt ohne Erklärung: „ihr mich suchen und nicht finden werdet“'
  alternative: Eine ausdrückliche Beziehung auf Tod, Himmelfahrt oder geistliche Verborgenheit
  rationale: Der Ausspruch selbst nennt weder Ursache noch Art der Abwesenheit. Eine nähere heilsgeschichtliche oder mystische Deutung würde die offene Spannung des Textes auflösen.
translation_notes:
  register: Modernes Standarddeutsch mit knapper, würdiger Spruchform. „Oft“ vermeidet die schwerfällige Wörtlichkeit „viele Male“; „dieses Wort“ bewahrt dagegen bewusst den Singular des Ausgangstextes. Das Semikolon hält Verlangen und fehlende andere Quelle eng zusammen, ohne die Aussage auszudeuten.
