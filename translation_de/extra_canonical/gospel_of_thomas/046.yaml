base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/046.yaml
  text: 'Jesus said[1], "From Adam until John the Baptist, among the offspring of women, there is no one higher than John the Baptist, so that his eyes will not be cast down. But I have said: whoever among you becomes a child will know the kingdom[4][3][2], and will become higher than John."'
translation:
  language: de
  text: 'Jesus sagte: „Von Adam bis Johannes dem Täufer gibt es unter den von Frauen Geborenen niemanden, der höher ist als Johannes der Täufer, sodass seine Augen nicht niedergeschlagen werden.[a] Doch ich habe gesagt: Wer unter euch klein wird,[b] wird das Königreich erkennen und höher werden als Johannes.“[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier ein Ausdruck vom „Brechen“ beziehungsweise Senken der Augen. Gemeint ist wahrscheinlich, dass Johannes vor niemandem den Blick aus Unterordnung oder Beschämung niederschlagen muss.
    reason: Sprachliches und kulturelles Bild erläutern, ohne seine genaue Nuance dogmatisch festzulegen.
  - marker: b
    text: Das koptische Wort kann „klein“ oder „gering“ bedeuten und auch „ein Kleiner“ beziehungsweise „ein Kind“ bezeichnen.
    reason: Die im Quellwort vorhandene Mehrdeutigkeit wird im Haupttext bewahrt und hier transparent gemacht.
  - marker: c
    text: 'Vergleiche Matthäus 11,11 und Lukas 7,28. Dort lautet der zweite Teil anders: Der Kleinste im Himmelreich beziehungsweise im Reich Gottes ist größer als Johannes.'
    reason: Die synoptische Parallele macht sowohl die Verwandtschaft als auch die eigenständige Fassung des Thomasevangeliums kenntlich.
lexical_decisions:
- source_word: ϫⲡⲟ
  choice: die von Frauen Geborenen
  rationale: Die Wendung gibt die Gruppe der menschlich Geborenen natürlich und zugleich quellennah wieder; der Manuskripttext hat hier den Plural „Frauen“.
- source_word: ϫⲟⲥⲉ / ϫⲓⲥⲉ
  choice: höher sein / höher werden
  rationale: Das Höhenbild des koptischen Ausdrucks wird in beiden Satzhälften bewahrt. „Größer“ wäre idiomatischer, würde aber die lexikalische Verbindung abschwächen.
- source_word: ⲟⲩⲱϭⲡ … ⲃⲁⲗ
  choice: die Augen niederschlagen
  rationale: Die wörtliche Vorstellung vom Brechen oder Senken der Augen bezeichnet hier das Niederschlagen des Blicks; die deutsche Wendung ist verständlich und wahrt das Bild.
- source_word: ⲕⲟⲩⲉⲓ
  choice: klein
  rationale: Das Wort bedeutet zunächst „klein/gering“ und kann substantivisch ein Kind oder einen Kleinen bezeichnen. „Klein wird“ bewahrt diese echte Mehrdeutigkeit besser als die Festlegung auf „zum Kind wird“.
- source_word: ⲙⲛⲧⲣⲣⲟ
  choice: Königreich
  rationale: Der Ausdruck kann Königsherrschaft, Königtum oder Königreich bezeichnen. „Königreich“ ist im Deutschen verständlich, ohne im Haupttext einen nicht ausdrücklich genannten Besitzer wie „Gottes“ zu ergänzen.
theological_decisions:
- issue: Bedeutung von ⲕⲟⲩⲉⲓ
  choice: klein wird
  alternative: zum Kind wird / ein Kleiner wird
  rationale: Die Übersetzung legt die Aussage nicht vorschnell auf körperliche Kindheit, Demut, sozialen Rang oder ein bestimmtes thomasinisches Lehrschema fest.
- issue: Bedeutung von ⲙⲛⲧⲣⲣⲟ
  choice: das Königreich
  alternative: die Königsherrschaft / das Königtum
  rationale: Der knappe absolute Ausdruck der Quelle bleibt erhalten; „Gottes“ oder „des Himmels“ wird nicht ergänzt.
- issue: Vergleich mit Johannes
  choice: höher als Johannes
  alternative: größer als Johannes
  rationale: Die räumlich-wertende Spannung des Quellworts bleibt sichtbar und wird nicht als ausschließlich geistlicher Rang ausgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe an der koptischen Aussage, wird aber lesbar gegliedert. „Niemand“ vermeidet die schwerfällige Form „keinen, der“. Die ungewöhnliche Folgerung mit „sodass“ wird nicht geglättet, weil sie zur überlieferten Argumentation gehört.
