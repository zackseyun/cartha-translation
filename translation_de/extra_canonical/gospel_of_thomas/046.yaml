  terminology: „Johannes der Täufer“, „Königreich“, „höher“ und „klein wird“ sind konsistent und quellennah. Besonders „klein wird“ bewahrt die semantische Offenheit von ⲕⲟⲩⲉⲓ gegenüber einer Festlegung auf „Kind“. Die Fußnoten erläutern die Augenidiomatik, die Mehrdeutigkeit von ⲕⲟⲩⲉⲓ und die synoptischen Parallelen sachlich und ohne konfessionelle Überformung.
