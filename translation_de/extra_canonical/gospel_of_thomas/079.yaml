base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/079.yaml
  text: A woman said to him in the crowd[a], “Blessed is the womb that bore you, and the breasts that nursed you.” He said to her, “Blessed are those who have heard the word of the Father and have kept it in truth; for days will come when you will say, ‘Blessed is the womb that has not conceived[e][d][c][b], and the breasts that have not given milk.’”
translation:
  language: de
  text: 'Eine Frau in der Menge sagte zu ihm: „Selig ist der Mutterleib, der dich getragen hat, und die Brüste, die dich gestillt haben.[a]“ Er sagte zu ihr: „Selig sind die, die das Wort des Vaters gehört und es in Wahrheit bewahrt haben.[b] Denn es werden Tage kommen, an denen ihr sagen werdet: ‚Selig ist der Mutterleib, der nicht empfangen hat,[c] und die Brüste, die keine Milch gegeben haben.‘“[d][e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht bei „Brüste“ eine Anredeform: „deine Brüste“; gemeint sind die Brüste, von denen er gestillt wurde. Die deutsche Fassung gibt dies sinngemäß wieder.'
    reason: dialect_note
  - marker: b
    text: „In Wahrheit bewahrt“ kann auch „wahrhaftig bewahrt“ oder, beim Verb, „gehütet“ beziehungsweise „gehalten“ heißen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „der nicht schwanger geworden ist“. Das hier gebrauchte koptische Verb bezeichnet Empfangen beziehungsweise Schwangerwerden, nicht das zuvor genannte Tragen oder Gebären.'
    reason: lexical_alternative
  - marker: d
    text: Kleinere Ergänzungen beschädigter Buchstaben im Manuskript, unter anderem bei „Frau“, „Mutterleib“, „Brüste“ und „stillen“, verändern den Sinn des Spruches nicht.
    reason: lacuna_or_restoration
  - marker: e
    text: Vergleiche Lukas 11,27–28 zur Seligpreisung durch eine Frau und Lukas 23,29 zu den Kinderlosen und den Brüsten, die nicht gestillt haben.
    reason: cross_reference
lexical_decisions:
- source_word: ⲟⲩⲥϩⲓⲙⲉ
  choice: eine Frau
  rationale: Der unbestimmte Artikel bezeichnet eine nicht näher bestimmte Frau.
- source_word: ⲙⲏⲏϣⲉ
  choice: Menge
  rationale: Gibt die gewöhnliche Bedeutung „Menschenmenge, Versammlung“ knapp und natürlich wieder.
- source_word: ϩⲏ
  choice: Mutterleib
  rationale: Im Zusammenhang von Geburt und Empfängnis bezeichnet das Wort hier den Mutterleib, nicht allgemein den Bauch.
- source_word: ϥⲓ ϩⲁ
  choice: getragen hat
  rationale: Die Wendung bezeichnet hier das Austragen beziehungsweise Gebären; „getragen hat“ wahrt das Bild des Mutterleibs und klingt im Deutschen natürlich.
- source_word: ⲓⲃⲉ
  choice: Brüste
  rationale: Der Plural passt zum Zusammenhang des Stillens und späteren Milchgebens.
- source_word: ⲥⲁⲛⲟⲩϣ
  choice: gestillt haben
  rationale: Natürliche moderne Wiedergabe des Verbs „stillen, säugen“.
- source_word: ⲉⲓⲁⲧ
  choice: selig ist/sind
  rationale: Bewahrt die feierliche Form eines Makarismus und seine biblische Resonanz.
- source_word: ⲥⲱⲧⲙ
  choice: gehört haben
  rationale: Die vollendete Handlung wird im Deutschen mit dem Perfekt wiedergegeben, ohne „hören“ zu „gehorchen“ auszudeuten.
- source_word: ⲡⲗⲟⲅⲟⲥ
  choice: das Wort
  rationale: Entspricht dem griechischen Lehnwort λόγος und wahrt dessen intertextuelle Offenheit besser als „Botschaft“.
- source_word: ⲡⲉⲓⲱⲧ
  choice: des Vaters
  rationale: Der Titel wird nicht erklärend zu „Gott, dem Vater“ erweitert.
- source_word: ϩⲁⲣⲉϩ
  choice: bewahrt haben
  rationale: Das Verb kann sowohl „bewahren“ als auch „hüten“ oder „halten“ bedeuten; „bewahren“ passt idiomatisch zu einem Wort und wahrt die Schutzkomponente.
- source_word: ϩⲛ ⲟⲩⲙⲉ
  choice: in Wahrheit
  rationale: Die präpositionale Form bleibt erhalten, statt sie eindeutig als adverbiales „wahrhaftig“ auszulegen.
- source_word: ⲱ (in ⲙ̄ⲡⲥⲱ)
  choice: nicht empfangen hat
  rationale: Das Verb bezeichnet das Empfangen beziehungsweise Schwangerwerden und wird bewusst vom früheren Ausdruck für Tragen oder Gebären unterschieden.
- source_word: ϯ ⲉⲣⲱⲧⲉ
  choice: Milch gegeben haben
  rationale: Formale und zugleich verständliche Wiedergabe; der Ausdruck bezeichnet hier das Milchgeben der Brüste.
- source_word: ⲟⲩⲛ ϩⲛ ϩⲟⲟⲩ ⲅⲁⲣ ⲛⲁϣⲱⲡⲉ
  choice: Denn es werden Tage kommen
  rationale: Wahrt Plural, Zukunft und begründende Verknüpfung des koptischen Satzes.
theological_decisions:
- issue: Verhältnis von Hören und Bewahren zum vorausgehenden Lob der Mutterschaft
  choice: Die beiden Seligpreisungen werden ohne erklärenden Gegensatz wiedergegeben.
  alternative: „Vielmehr selig sind …“
  rationale: Der koptische Text enthält kein ausdrückliches „vielmehr“; die theologische Spannung zwischen leiblicher Mutterschaft und dem Hören des Wortes soll nicht durch einen eingefügten Gegensatz aufgelöst werden.
- issue: Bezeichnung „Vater“
  choice: „das Wort des Vaters“
  alternative: „das Wort Gottes“
  rationale: Die titulare Sprache des Textes bleibt erhalten, ohne die Referenz erläuternd oder konfessionell zu erweitern.
- issue: Künftige Seligpreisung des nicht empfangenden Mutterleibs
  choice: Die anstößige Umkehrung wird direkt und ohne Deutung wiedergegeben.
  alternative: Eine erklärende Auslegung als Hinweis auf Gericht, Verfolgung oder Endzeit
  rationale: Der Text nennt keine konkrete Ursache; eine Deutung würde seine genuine eschatologische Spannung vorschnell festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst biblisch geprägtem „selig“ und „Wort des Vaters“. Die Syntax bleibt klar und mündlich sprechbar. „Mutterleib“ ist gegenüber „Leib“ präziser, während „in Wahrheit“ die ungeglättete Ausdrucksweise und mögliche Mehrdeutigkeit des koptischen Textes erhält.
