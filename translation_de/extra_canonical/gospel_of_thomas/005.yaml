base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/005.yaml
  text: 'Jesus says: Know what is before your face[a], and what is hidden from you will be uncovered[c] to you. For there is nothing hidden that will not be made manifest[d].[b]'
translation:
  language: de
  text: 'Jesus sagte: »Erkenne, was unmittelbar vor dir liegt[a], und was dir verborgen ist, wird dir aufgedeckt werden[c]. Denn es gibt nichts Verborgenes, das nicht offenbar werden wird[d].«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »was vor deinem Gesicht ist«. Die koptische Wendung meint das, was direkt vor einem liegt.'
    reason: cultural_note
  - marker: b
    text: 'Der griechische Textzeuge POxy 654 fügt hinzu: »und nichts ist begraben, das nicht aufgerichtet werden wird«. Im koptischen Nag-Hammadi-Text fehlt dieser Zusatz; die Übersetzung folgt dem koptischen Text.'
    reason: textual_variant
  - marker: c
    text: Das koptische Verb ϭⲱⲗⲡ bedeutet wörtlich »aufdecken«; möglich wären auch »enthüllen« oder »offenbaren«.
    reason: lexical_alternative
  - marker: d
    text: Die koptische Wendung ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ bedeutet hier »offenbar werden«, »sichtbar werden« oder »zum Vorschein kommen«, nicht »leben«.
    reason: lexical_alternative
lexical_decisions:
- source_word: ⲥⲟⲟⲩⲛ
  choice: Erkenne
  rationale: Der Imperativ hat hier den Sinn eines auffordernden Erfassens oder Wahrnehmens. »Erkenne« bewahrt die knappe, sentenzenhafte Form besser als eine erklärende Wiedergabe.
- source_word: ⲡⲉⲧⲉⲣⲉ ⲛⲡⲙⲧⲟ ⲛⲡⲉⲕϩⲟ ⲉⲃⲟⲗ
  choice: was unmittelbar vor dir liegt
  rationale: Die koptische Wendung lautet wörtlich »was vor deinem Gesicht ist«. Die idiomatische deutsche Fassung wahrt den räumlichen Sinn, während die Fußnote das konkrete Bild dokumentiert.
- source_word: ⲡⲉⲧⲉⲣⲉϩⲱⲡ ⲉⲛⲧⲟⲕ
  choice: was dir verborgen ist
  rationale: ϩⲱⲡ bezeichnet das Verbergen oder Verhüllen. Die Formulierung lässt offen, wer oder was das Verborgene verborgen hat.
- source_word: ϭⲱⲗⲡ ⲉⲃⲟⲗ
  choice: wird dir aufgedeckt werden
  rationale: »Aufdecken« erhält die konkrete Metapher des koptischen Verbs; »dir« gibt den ausdrücklich genannten Empfänger wieder.
- source_word: ⲙⲛⲗⲁⲁⲩ ⲅⲁⲣ
  choice: Denn nichts
  rationale: Dies ist die natürliche deutsche Wiedergabe der koptischen universalen Verneinung und bewahrt die begründende Verknüpfung durch ⲅⲁⲣ.
- source_word: ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ
  choice: offenbar werden
  rationale: Die Konstruktion bedeutet »sichtbar/manifest werden« oder »zum Vorschein kommen«. »Offenbar werden« wahrt die feierliche Parallelität, ohne das Verb kausativ als »offenbart werden« festzulegen.
theological_decisions:
- issue: Art und Ursprung der verborgenen Erkenntnis
  choice: 'Die Aussage bleibt allgemein und ohne benannten Offenbarer: Das Verborgene wird aufgedeckt beziehungsweise offenbar werden.'
  alternative: Eine ausdrücklich göttliche Offenbarung formulieren, etwa »Gott wird es dir offenbaren«.
  rationale: Der koptische Text nennt weder Gott noch einen anderen Handelnden. Eine solche Ergänzung würde die theologische Offenheit des Spruchs unzulässig einengen.
- issue: Bedeutung von »Erkenne«
  choice: Keine Festlegung darauf, ob sinnliche Wahrnehmung, geistige Einsicht oder religiöse Erkenntnis gemeint ist.
  alternative: »Verstehe« oder »betrachte aufmerksam« als eindeutige Deutung.
  rationale: ⲥⲟⲟⲩⲛ kann mehrere Erkenntnisnuancen tragen; die knappe Aufforderung soll diese Spannung behalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, spruchhafter Satzführung. »Unmittelbar vor dir« klingt natürlich, während die Fußnote das konkrete koptische Bild »vor deinem Gesicht« erhält. Die beiden Verben »aufdecken« und »offenbar werden« bilden den lexikalischen Unterschied des Ausgangstextes ab.
