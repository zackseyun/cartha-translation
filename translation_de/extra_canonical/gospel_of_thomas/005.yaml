revisions:
- from: 'Jesus sagte: »Erkenne, was unmittelbar vor dir liegt[a], und was dir verborgen ist, wird dir aufgedeckt werden[c]. Denn nichts ist verborgen, das nicht offenbar werden wird[d].«[b]'
  to: 'Jesus sagte: »Erkenne, was unmittelbar vor dir liegt[a], und was dir verborgen ist, wird dir aufgedeckt werden[c]. Denn es gibt nichts Verborgenes, das nicht offenbar werden wird[d].«[b]'
  rationale: 'Die Revision beschränkt sich auf zwei sichere sprachliche Verbesserungen: eine natürlichere deutsche Form der allgemeinen Verneinung im Schlusssatz und eine neutralere Wiedergabe der griechischen Variantenklausel. Inhalt, Zukunftsbezug, Ambiguität und Fußnotenstruktur bleiben erhalten.'
