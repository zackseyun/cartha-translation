review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die zentralen Kontraste des koptischen Textes zuverlässig wieder: die Aufforderung zum Erkennen dessen, was vor einem ist, die Aufdeckung des dem Angesprochenen Verborgenen sowie die allgemeine Aussage, dass Verborgenes offenbar werden wird. »Erkenne« ist für ⲥⲟⲟⲩⲛ möglich und wahrt die beabsichtigte Offenheit. Die Zukunft in »wird ... aufgedeckt werden« und »wird ... offenbar werden« entspricht ⲛⲁ. Die Fußnotenanker sind vollständig und an den passenden Textstellen gesetzt.'
  naturalness: Der Haupttext ist modernes, würdiges Standarddeutsch. Im letzten Satz klingt jedoch »nichts ist verborgen, das ...« weniger idiomatisch als die substantivierte Formulierung »nichts Verborgenes«. Diese behält die Bedeutung bei und bildet die sentenzhafte Aussage natürlich ab.
  terminology: »Aufgedeckt« und »offenbar werden« unterscheiden angemessen zwischen ϭⲱⲗⲡ ⲉⲃⲟⲗ und ⲟⲩⲱⲛϩ ⲉⲃⲟⲗ. In der Variantenfußnote ist »auferweckt« als Wiedergabe von „raised up“ unnötig stark mit Auferstehung assoziiert; »aufgerichtet« gibt die Formulierung neutraler wieder, ohne eine theologische Deutung einzutragen.
  issues:
