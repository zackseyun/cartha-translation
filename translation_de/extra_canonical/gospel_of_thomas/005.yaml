    issue: Unidiomatische Relativkonstruktion im Schlusssatz
    rationale: »Denn nichts ist verborgen, das nicht offenbar werden wird« ist verständlich, aber »Denn es gibt nichts Verborgenes, das nicht offenbar werden wird« ist im modernen Deutschen flüssiger und wahrt die universale Aussage des Koptischen.
  - severity: low
    issue: Theologisch aufgeladene Wortwahl in der Variantenfußnote
    rationale: »Auferweckt werden« kann im Deutschen spezifisch eine Auferstehung nahelegen. Der Hinweis dokumentiert lediglich eine abweichende griechische Klausel; »aufgerichtet werden« bleibt näher an deren unbestimmter Formulierung.
