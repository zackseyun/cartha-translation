base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/095.yaml
  text: Jesus said[a], “If you have money, do not lend at interest; rather[f][e][d][c][b], give it to the one from whom you will not take it back.”
translation:
  language: de
  text: 'Jesus sagte[a]: „Wenn ihr Geld habt, verleiht es nicht gegen Zinsen. Gebt es vielmehr dem, von dem ihr es nicht zurücknehmen werdet.“[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „Jesus sagte“ sind am Anfang der Handschrift teilweise beschädigt und anhand des erhaltenen Textes sowie der üblichen Einleitungsformel ergänzt.
    reason: lacuna_or_restoration
  - marker: b
    text: Wörtlich steht beim zurückgenommenen Gegenstand eine Mehrzahl („sie“), vermutlich weil Münzen mitgedacht sind. Im Deutschen bezieht sich „es“ grammatisch auf „Geld“.
    reason: dialect_note
  - marker: c
    text: 'Der letzte Satzteil kann möglicherweise auch verstanden werden: „dem, der es euch nicht zurückgeben wird“. Unmittelbar nach „gebt“ ist die Objekt- beziehungsweise Pronominalkonstruktion beschädigt: Die Handschrift lässt sich als „gebt es“ ergänzen, während der normalisierte Text „gebt ihm“ liest. Die Übersetzung gibt den durch den Relativsatz bestimmten Empfänger mit „dem“ wieder und ergänzt „es“ aus „Geld“.'
    reason: textual_variant
lexical_decisions:
- source_word: ⲉϣⲱⲡⲉ
  choice: wenn
  rationale: Die konditionale Partikel leitet hier eine allgemeine Bedingung ein; „wenn“ gibt dies im Deutschen natürlich wieder.
- source_word: ⲟⲩⲛⲧⲁⲛⲧⲱⲧⲛ ϩⲟⲙⲧ
  choice: ihr Geld habt
  rationale: Die koptische Existenzkonstruktion drückt Besitz aus; die natürliche deutsche Entsprechung ist „Geld haben“.
- source_word: ϩⲟⲙⲧ
  choice: Geld
  rationale: Das Wort kann Kupfer, Münze oder Geld bezeichnen; im allgemeinen finanziellen Zusammenhang ist „Geld“ angemessen.
- source_word: ⲙⲡⲣϯ ⲉⲡⲙⲏⲥⲉ
  choice: verleiht es nicht gegen Zinsen
  rationale: Die Verbindung von „geben“ mit ⲙⲏⲥⲉ bezeichnet idiomatisch das Ausleihen gegen Zins. „Gegen Zinsen verleihen“ ist klar und vermeidet die heute meist auf überhöhte Zinsen beschränkte Konnotation von „Wucher“.
- source_word: ϯ ⲛⲛⲧⲟϥ
  choice: Gebt es vielmehr dem
  rationale: Die Formulierung gibt sowohl den Gegenstand „Geld“ als auch den durch den folgenden Relativsatz bestimmten Empfänger in natürlichem Deutsch wieder; die Handschrift ist an dieser Stelle beschädigt.
- source_word: ⲛⲡⲉⲧⲉⲣⲉⲛⲧⲱⲧⲛⲛⲁϫⲓⲛⲧⲟⲟⲩ ⲁⲛ ⲛⲧⲛⲛⲧⲟϥ
  choice: von dem ihr es nicht zurücknehmen werdet
  rationale: Die Wiedergabe folgt der syntaktisch naheliegenden Leserichtung „von dem ... nehmen“. Das koptische Pluralobjekt bezieht sich wahrscheinlich auf gedachte Münzen; im Deutschen richtet sich das Pronomen nach dem Massennomen „Geld“.
theological_decisions:
- issue: Gabe oder nicht rückforderbares Darlehen
  choice: Gebt es ... dem, von dem ihr es nicht zurücknehmen werdet
  alternative: Leiht es dem, ohne es zurückzufordern
  rationale: Der Text wechselt vom Zinsverbot zum Verb „geben“ und lässt das Verhältnis zwischen Schenkung und nicht zurückgefordertem Darlehen offen. Die Übersetzung bewahrt diese Spannung, statt sie als bestimmte Sozial- oder Wirtschaftslehre auszulegen.
- issue: Richtung des abschließenden Relativsatzes
  choice: von dem ihr es nicht zurücknehmen werdet
  alternative: der es euch nicht zurückgeben wird
  rationale: Die gewählte Fassung folgt der verbreiteten Analyse als Nehmen von einem Empfänger; wegen der möglichen syntaktischen Mehrdeutigkeit wird die Alternative in einer Fußnote genannt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Spruchstil. Die Anrede steht im Plural wie im Koptischen. „Gegen Zinsen“ ist historisch neutraler und heute verständlicher als „auf Wucher“; „zurücknehmen“ bleibt bewusst näher am koptischen Verb als das stärker deutende „zurückfordern“.
