base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/011.yaml
  text: Jesus said[1], “This heaven will pass away, and the one above it will pass away. And the dead are not alive, and the living will not die. On the days when you ate what is dead, you made it alive. When you come to be in the light, what will you do? On the day when you were one, you became two. But when you become two[5][4][3][2], what will you do?”
translation:
  language: de
  text: 'Jesus sagte: „Dieser Himmel wird vergehen, und der über ihm wird vergehen.[a] Die Toten leben nicht, und die Lebenden werden nicht sterben. An dem Tag, als ihr das Tote gegessen habt, habt ihr es lebendig gemacht.[b] Wenn ihr ins Licht kommt, was werdet ihr tun?[c] An dem Tag, als ihr eins wart, seid ihr zwei geworden.[d] Wenn ihr aber zwei werdet, was werdet ihr tun?[e]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Dieser Himmel“ kann auch „dieser Himmelsraum“ oder „dieses Firmament“ bedeuten. Die Wendung „der über ihm“ lässt an mehrere übereinanderliegende Himmel denken.
    reason: lexical_alternative
  - marker: b
    text: Das Pronomen in „habt ihr es lebendig gemacht“ bezieht sich wahrscheinlich auf „das Tote“, das gegessen wurde. Gemeint ist wörtlich ein Bewirken des Lebendigseins.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher: „Wenn ihr dazu kommt, im Licht zu sein“. Bei „was werdet ihr tun?“ steht im Koptischen außerdem ein Objektpronomen, das auch „was werdet ihr mit ihm tun?“ erlauben könnte; sein Bezug bleibt unklar.'
    reason: lexical_alternative
  - marker: d
    text: 'Die koptische Wendung kann auch näher am Wortlaut als „als ihr eins wart, habt ihr die zwei gemacht“ wiedergegeben werden. Manche verstehen den ganzen Satz zukünftig: „Wenn ihr eins werdet, werdet ihr zwei werden.“ Die Verbform des zweiten Satzteils spricht jedoch eher für den Rückblick.'
    reason: alternative_reading
  - marker: e
    text: In der letzten Frage verwendet die Handschrift ⲁⲁ statt des zuvor verwendeten Verbs ⲉⲓⲣⲉ. Im Zusammenhang scheint dennoch dieselbe Frage wiederholt zu werden; die Abweichung kann auch mit der Überlieferung oder Schreibung zusammenhängen.
    reason: textual_variant
lexical_decisions:
- source_word: ⲡⲉⲓⲡⲉ
  choice: dieser Himmel
  rationale: ⲡⲉ kann sowohl „Himmel“ als auch „Firmament/Himmelsraum“ bezeichnen. Der folgende Hinweis auf einen Himmel darüber legt hier „Himmel“ in einem geschichteten kosmologischen Sinn nahe.
- source_word: ⲛⲁⲣⲡⲁⲣⲁⲅⲉ
  choice: wird vergehen
  rationale: Das aus dem Griechischen entlehnte Verb bezeichnet ein Vorübergehen oder Vergehen; „vergehen“ bewahrt den feierlich-apokalyptischen Klang und passt zur Zukunftsform.
- source_word: ⲛⲉⲧⲙⲟⲟⲩⲧ … ⲛⲉⲧⲟⲛϩ
  choice: die Toten … die Lebenden
  rationale: Die substantivierten deutschen Formen bilden die knappe Parallelstruktur des koptischen Textes natürlich ab.
- source_word: ⲡⲉⲧⲙⲟⲟⲩⲧ
  choice: das Tote
  rationale: Die kopflose Relativkonstruktion bezeichnet das, was tot ist. „Das Tote“ lässt offen, ob Nahrung, ein Lebewesen oder eine symbolische Größe gemeint ist.
- source_word: ⲉⲓⲣⲉ ⲙ̄ⲙⲟϥ ⲙ̄ⲡⲉⲧⲟⲛϩ
  choice: habt ihr es lebendig gemacht
  rationale: Die Konstruktion mit ⲉⲓⲣⲉ gibt hier ein Bewirken wieder; das Objektpronomen verweist am ehesten auf „das Tote“.
- source_word: ϩⲙ̄ⲡⲟⲩⲟⲉⲓⲛ
  choice: im Licht
  rationale: „Licht“ ist die unmarkierte Grundbedeutung und bewahrt den symbolischen Gehalt, ohne ihn auszudeuten.
- source_word: ⲟⲩ ⲡⲉⲧⲉⲧⲛⲁⲁϥ
  choice: was werdet ihr tun?
  rationale: Das koptische Objektpronomen kann pleonastisch sein oder auf einen zuvor genannten Bezug verweisen. Die offene Frage erhält die Rätselhaftigkeit des Spruchs.
- source_word: ⲉⲧⲉⲧⲛ̄ⲟ ⲛ̄ⲟⲩⲁ … ⲉⲓⲣⲉ ⲙ̄ⲡⲥⲛⲁⲩ
  choice: als ihr eins wart, seid ihr zwei geworden
  rationale: „Eins sein“ und „zwei werden“ ergeben im Deutschen die natürliche, parallel gebaute Wiedergabe der knappen koptischen Wendung; die wörtlichere Möglichkeit „die zwei gemacht“ wird in einer Fußnote festgehalten.
theological_decisions:
- issue: Die Bedeutung des Gegensatzes zwischen eins und zwei
  choice: Die Bildsprache bleibt ohne Deutung stehen.
  alternative: Sie ausdrücklich auf Schöpfung, Geschlechtlichkeit, Leib und Seele oder geistliche Einheit beziehen.
  rationale: Der Spruch selbst nennt den Bezug nicht. Eine bestimmte anthropologische oder kosmologische Auslegung würde die echte Mehrdeutigkeit unzulässig auflösen.
- issue: Der Status der Toten und Lebenden
  choice: 'Die widersprüchliche Spannung wird wörtlich bewahrt: Die Toten leben nicht, die Lebenden werden nicht sterben.'
  alternative: „Tot“ und „lebendig“ ausdrücklich geistlich oder körperlich deuten.
  rationale: Der Text wechselt unmittelbar zum Essen des Toten und zu dessen Lebendigmachung. Eine einheitliche dogmatische Erklärung ist daher nicht in die Übersetzung einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit knapper, würdevoller Satzführung. Die wiederholten Gegensatzpaare „Tote/Lebende“ und „eins/zwei“ sowie die beiden offenen Fragen bleiben bewusst markant und rätselhaft. Archaismen und konfessionell geprägte Deutungsbegriffe wurden vermieden.
