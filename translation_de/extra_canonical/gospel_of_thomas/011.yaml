  revised_text: 'Jesus sagte: „Dieser Himmel wird vergehen, und der über ihm wird vergehen.[a] Die Toten leben nicht, und die Lebenden werden nicht sterben. An dem Tag, als ihr das Tote gegessen habt, habt ihr es lebendig gemacht.[b] Wenn ihr ins Licht kommt, was werdet ihr tun?[c] An dem Tag, als ihr eins wart, seid ihr zwei geworden.[d] Wenn ihr aber zwei werdet, was werdet ihr tun?[e]“'
