revisions:
- from: 'Jesus sagte: „Dieser Himmel wird vergehen, und der über ihm wird vergehen.[a] Die Toten leben nicht, und die Lebenden werden nicht sterben. In den Tagen, als ihr das Tote aßt, habt ihr es lebendig gemacht.[b] Wenn ihr im Licht seid, was werdet ihr tun?[c] An dem Tag, als ihr eins wart, seid ihr zwei geworden.[d] Wenn ihr aber zwei werdet, was werdet ihr tun?[e]“'
  to: 'Jesus sagte: „Dieser Himmel wird vergehen, und der über ihm wird vergehen.[a] Die Toten leben nicht, und die Lebenden werden nicht sterben. An dem Tag, als ihr das Tote gegessen habt, habt ihr es lebendig gemacht.[b] Wenn ihr ins Licht kommt, was werdet ihr tun?[c] An dem Tag, als ihr eins wart, seid ihr zwei geworden.[d] Wenn ihr aber zwei werdet, was werdet ihr tun?[e]“'
  rationale: Die Revision behebt den unbegründeten Plural bei „Tag“, modernisiert die Verbform und gibt den ingressiven Charakter des Licht-Satzes genauer wieder. Die ambivalenten Aussagen über Tote und Lebende sowie Eins und Zwei bleiben unverändert offen. Die Fußnotenanker bleiben vollständig und korrekt zugeordnet.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:05:20Z'
review_pass:
  verdict: revise
  source_fidelity: 'Eine sichere Korrektur ist nötig: ⲡϩⲟⲟⲩ steht im Singular („an dem Tag“), während der Entwurf „In den Tagen“ bietet. Außerdem ist „ihr esst“ die moderne standarddeutsche Form. Die ingressive/prospektive Nuance von ⲉⲣϣⲁⲛ … ϣⲱⲡⲉ wird mit „ins Licht kommt“ unmittelbarer wiedergegeben als mit dem rein stativen „im Licht seid“.'
  naturalness: Die knappe, rätselhafte und würdige Sprache ist insgesamt gelungen. „An dem Tag, als ihr … gegessen habt“ ist modernes Standarddeutsch und wahrt die zeitliche Setzung. Die Fragen bleiben bewusst offen.
  terminology: „Himmel“, „die Toten“, „die Lebenden“, „das Tote“ und „Licht“ sind sachgerecht und nicht konfessionell überdeutet. Die Fußnote zur Schlussfrage sollte das tatsächlich abweichende Verb präziser benennen, ohne die textliche Unsicherheit aufzulösen.
  issues:
  - severity: medium
    issue: Singular von ⲡϩⲟⲟⲩ nicht gewahrt
    rationale: Der koptische Text hat sowohl beim Essenssatz als auch beim Eins-/Zwei-Satz „den Tag“ im Singular. „In den Tagen“ verändert die Numerusangabe ohne textliche Grundlage.
  - severity: low
    issue: Nichtstandardmäßige bzw. veraltete Form „aßt“
    rationale: 'Im modernen Standarddeutsch lautet die Form zu „ihr essen“: „ihr esst“. Die Präteritumsform im bisherigen Satz ist zudem weniger natürlich als eine einheitliche Perfektform.'
  - severity: low
    issue: Prospektiv-ingressive Nuance bei ϣⲱⲡⲉ abgeschwächt
