  source_fidelity: 'Die Übersetzung gibt die beiden unterschiedlich konstruierten Aussagen sachgerecht wieder: Die erste Potentialkonstruktion wird mit „kann nicht“ wiedergegeben, während der abschließende Zukunftssatz mit „wird ... nicht ... sein“ erhalten bleibt. „hasst“, die Verwandtschaftsbezeichnungen, „sein Kreuz trägt“, die modale Wendung „so ... wie ich“ und „meiner nicht würdig“ entsprechen dem koptischen Text, ohne ihn an synoptische Parallelformulierungen anzugleichen.'
  naturalness: Modernes, idiomatisches Standarddeutsch mit angemessen knappem, spruchhaftem Register. „Meiner nicht würdig sein“ ist leicht gehoben, aber sowohl natürlich als auch für den religiös-literarischen Kontext passend.
  terminology: „Jünger“, „Kreuz“ und „würdig“ sind etabliert und präzise. Das starke „hasst“ wahrt die Ausdrucksschärfe des Textes und vermeidet eine interpretierende Abschwächung. Die Fußnote zu ⲛⲧⲁϩⲉ erläutert die nicht-räumliche modale Bedeutung, ohne ein nicht vorhandenes „folgen“ in den Text einzutragen.
