base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_thomas/055.yaml
  text: Jesus said, "Whoever does not hate his father and his mother cannot be my disciple; and whoever does not hate his brothers and his sisters, and does not carry his cross as I do, will not be worthy of me."[a][b][c]
translation:
  language: de
  text: 'Jesus sagte: „Wer seinen Vater und seine Mutter nicht hasst, kann nicht mein Jünger sein. Und wer seine Brüder und seine Schwestern nicht hasst[a] und sein Kreuz nicht so trägt wie ich,[b] wird meiner nicht würdig sein.“[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die gedruckte Handschrift liest „seine Brüder … und seine Schwestern“ (ⲥⲛⲏⲩ … ⲥⲱⲛⲉ). Die normalisierte Lemmatisierung bei Dilley gibt dagegen „seinen Sohn … seine Tochter“ an. Die Übersetzung folgt hier der Handschriftenlesung.
    reason: textual_variant
  - marker: b
    text: Wörtlich bezeichnet ⲛⲧⲁϩⲉ „auf meine Weise“ oder „nach meiner Art“. Ein ausdrückliches Verb für „folgen“ steht hier nicht.
    reason: dialect_note
  - marker: c
    text: Vergleiche Lukas 14,26–27 und Matthäus 10,37–38 zu verwandten Motiven; die Wortwahl des Thomasevangeliums ist jedoch eigenständig.
    reason: cross_reference
lexical_decisions:
- source_word: ⲙⲟⲥⲧⲉ
  choice: hasst
  rationale: Das starke koptische Verb wird nicht zu „weniger lieben“ abgeschwächt; so bleiben Schärfe und Spannung des Ausspruchs erhalten.
- source_word: ϣⲣⲙⲁⲑⲏⲧⲏⲥ
  choice: kann … Jünger sein
  rationale: Die Potentialkonstruktion mit ϣ wird als Fähigkeit beziehungsweise Möglichkeit wiedergegeben und damit vom einfachen Futur im letzten Satzteil unterschieden.
- source_word: ⲉⲓⲱⲧ / ⲙⲁⲁⲩ
  choice: Vater / Mutter
  rationale: Die gewöhnlichen Verwandtschaftsbezeichnungen werden unmittelbar und wörtlich übersetzt.
- source_word: ⲥⲛⲏⲩ / ⲥⲱⲛⲉ
  choice: Brüder / Schwestern
  rationale: Die Übersetzung folgt der gedruckten Handschriftenlesung und wahrt die parallele Nennung männlicher und weiblicher Geschwister.
- source_word: ϥⲓ
  choice: trägt
  rationale: Im Zusammenhang mit dem Kreuz bezeichnet das Verb dessen Tragen; „auf sich nehmen“ würde stärker an die synoptische Formulierung angleichen.
- source_word: ⲥⲧⲁⲩⲣⲟⲥ
  choice: Kreuz
  rationale: Das griechische Lehnwort hat hier die übliche Bedeutung „Kreuz“.
- source_word: ⲛⲧⲁϩⲉ
  choice: so … wie ich
  rationale: Die Wendung bezeichnet Jesu Weise oder Art. Die natürliche deutsche Vergleichsform vermeidet das missverständliche räumliche „auf meinem Weg“, ohne ein im Koptischen nicht vorhandenes Verb „folgen“ einzuführen.
- source_word: ⲉⲓⲣⲉ ⲛⲁⲝⲓⲟⲥ
  choice: würdig sein
  rationale: Die koptische Verbindung bezeichnet einen Zustand oder eine Eigenschaft; „würdig sein“ bewahrt zudem die offene Beziehung des Dativs „mir“.
- source_word: ⲡⲉⲧⲉⲣⲉ…
  choice: wer
  rationale: Das deutsche indefinite Relativpronomen gibt den allgemeinen, spruchhaften Bedingungssatz natürlich wieder.
theological_decisions:
- issue: Bedeutung von „hassen“ in den Verwandtschaftsaussagen
  choice: Die starke, wörtliche Formulierung „hasst“ bleibt stehen.
  alternative: „weniger liebt“ oder „zurückstellt“
  rationale: Der koptische Text verwendet ausdrücklich das starke Verb „hassen“. Eine Deutung als Rangordnung der Liebe wäre bereits Auslegung und würde die theologische Spannung glätten.
- issue: Art des Kreuztragens
  choice: „so trägt wie ich“
  alternative: „mir nachfolgt“
  rationale: Der Text spricht von der Weise des Tragens, verwendet aber kein ausdrückliches Verb für „folgen“. Die Übersetzung wahrt diesen Unterschied.
- issue: Würdigkeit gegenüber Jesus
  choice: „wird meiner nicht würdig sein“
  alternative: „wird es nicht verdienen, zu mir zu gehören“
  rationale: Die knappe relationale Aussage bleibt erhalten, ohne Zugehörigkeit, Heil oder Verdienst näher zu definieren.
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper spruchhafter Satzführung. „Jünger“ und „Kreuz“ erhalten den historischen religiösen Wortschatz; „meiner würdig“ ist bewusst leicht gehoben, aber im Deutschen verständlich. Die anstößige Schärfe von „hassen“ wird nicht erklärend abgeschwächt.
