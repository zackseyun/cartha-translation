base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/040/002.yaml
  text: And on the four sides of the Lord of Spirits I saw four other faces[a], different from those who do not sleep. And I learned their names[c][b], for the angel who came with me made their names known to me and showed me all the hidden things.
translation:
  language: de
  text: Und an den vier Seiten des Herrn der Geister sah ich vier weitere Gesichter[a], die sich von denen unterschieden, die nicht schlafen. Und ich erfuhr ihre Namen; denn der Engel, der mit mir kam, gab mir ihre Namen zu erkennen und zeigte mir alles Verborgene[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „vier weitere Gesichter“. Gemeint sein können sichtbare Erscheinungen himmlischer Wesen; der äthiopische Text bleibt beim Bild der Gesichter.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „alle Geheimnisse“. Der Ausdruck bezeichnet in apokalyptischen Visionen Verborgenes, das offenbart wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በአርባዕቱ ክነፊሁ
  choice: an den vier Seiten
  rationale: ክነፍ kann wörtlich „Flügel“, räumlich aber auch „Rand“ oder „Seite“ bedeuten. Im Zusammenhang bezeichnet die Wendung den Bereich um den Herrn der Geister, ohne ihm ausdrücklich Flügel zuzuschreiben.
- source_word: ለእግዚአ መናፍስት
  choice: des Herrn der Geister
  rationale: Der etablierte göttliche Titel wird übersetzt und so formuliert, dass offenbleibt, welche Gesamtheit von Geistern gemeint ist.
- source_word: አርባዕተ ገጸ ካልአ
  choice: vier weitere Gesichter
  rationale: ገጽ bedeutet gewöhnlich „Gesicht“. Die konkrete Bildsprache der Vision bleibt erhalten, statt sie zu „Gestalten“ oder „Wesen“ zu abstrahieren.
- source_word: እምነ እለ ኢይነውሙ
  choice: die sich von denen unterschieden, die nicht schlafen
  rationale: Die Formulierung bewahrt den Bezug des Relativsatzes auf die zuvor erwähnten Schlaflosen und gibt den Kontrast natürlich wieder.
- source_word: አእመርኩ
  choice: ich erfuhr
  rationale: Das Verb bezeichnet ein Erlangen von Kenntnis. „Erfuhr“ passt zum anschließenden Bekanntmachen der Namen.
- source_word: ዘአይድዐኒ አስማቲሆሙ
  choice: gab mir ihre Namen zu erkennen
  rationale: Die kausative Bedeutung des Bekanntmachens wird in einem würdigen, verständlichen Register bewahrt.
- source_word: ኅቡኣተ
  choice: alles Verborgene
  rationale: Die substantivierte Form bezeichnet verborgene beziehungsweise geheime Dinge und passt zur Offenbarung himmlischer Geheimnisse.
theological_decisions:
- issue: Wiedergabe des göttlichen Titels እግዚአ መናፍስት
  choice: Herr der Geister
  alternative: Herr von Geistern
  rationale: „Herr der Geister“ ist im Deutschen ein natürlicher, traditionsfähiger Titel, ohne festzulegen, ob alle Geister oder eine bestimmte Gruppe himmlischer Geister gemeint ist.
- issue: Identität der vier sichtbaren Erscheinungen
  choice: Gesichter
  alternative: Gestalten / Wesen / Gegenwärtige
  rationale: Die Übersetzung bleibt beim konkreten Quellwort und legt nicht über den Text hinaus fest, welcher Art diese himmlischen Erscheinungen sind.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete visionäre Bildsprache bleibt erhalten; zugleich wird die räumliche Bedeutung von ክነፍ hier mit „Seiten“ wiedergegeben. Die Satzstruktur wurde behutsam geglättet, ohne die Mehrdeutigkeit der himmlischen Gestalten oder des göttlichen Titels aufzulösen.
