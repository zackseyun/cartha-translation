base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/040/001.yaml
  text: And after that I saw thousands of thousands and ten thousands of ten thousands[a], whose number and count were without end[e][d][c][b], standing before the Lord of Spirits.
translation:
  language: de
  text: Und danach sah ich Tausende von Tausenden und Zehntausende von Zehntausenden[a]; deren Zahl und Zählung waren nicht zu ermitteln – sie, die vor dem Herrn der Geister stehen[b][e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ausdruck für „Zahl“ in der folgenden Aussage ist in der zugrunde gelegten Erfassung unsicher. Der Zusammenhang beschreibt jedenfalls eine unzählbare Menge.
    reason: textual_variant
  - marker: b
    text: 'Vergleiche Daniel 7,10: Dort steht ebenfalls eine unzählbare Schar vor dem göttlichen Thron.'
    reason: cross_reference
  - marker: e
    text: 'Alternativ: „Herr von Geistern“. Das Geʿez kennzeichnet die Bestimmtheit hier nicht durch einen Artikel.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ወርኢኩ፡ እምድኅረዝ
  choice: Und danach sah ich
  rationale: Bewahrt die parataktische Erzählweise sowie die zeitliche Folge des äthiopischen Ausdrucks in natürlichem Deutsch.
- source_word: አእላፈ፡ አእላፍ
  choice: Tausende von Tausenden
  rationale: Gibt die wiederholte Zahlenbezeichnung formal wieder und erhält die apokalyptische Steigerungsformel.
- source_word: ትእልፊተ፡ ትእልፊት
  choice: Zehntausende von Zehntausenden
  rationale: Der zugrunde liegende Ausdruck bezeichnet jeweils zehntausend; die Wiederholung stellt eine unermessliche Menge dar.
- source_word: ኍልቈ፡ ወኃሳበ፡ አልቦሙ
  choice: Zahl und Menge hatten sie nicht
  rationale: Gibt beide erkennbaren Begriffe für Zahl beziehungsweise Zählung wieder und bewahrt die negative Existenzaussage, ohne sie durch eine zusätzliche Deutung wie „ohne Ende“ zu verstärken.
- source_word: እለ፡ ይቀውሙ
  choice: sie, die … stehen
  rationale: Bewahrt den Relativsatz und die formelle Haltung des Stehens im himmlischen Hof.
- source_word: ቅድመ፡ እግዚአ፡ መናፍስት
  choice: vor dem Herrn der Geister
  rationale: „Vor“ wahrt die räumlich-höfische Bedeutung; „Herr der Geister“ behandelt die feste Wendung als göttlichen Titel, wobei die deutsche Genitivkonstruktion idiomatisch bestimmt ist.
theological_decisions:
- issue: Bezug des Titels „Herr der Geister“
  choice: Als göttlicher Titel für den Höchsten wiedergegeben
  alternative: ein nicht titularer „Herr von Geistern“ oder ein über Geister gesetzter Engel
  rationale: Im Kontext der Bilderreden bezeichnet die wiederkehrende Formel denjenigen, vor dem das himmlische Heer steht. Die Übersetzung erhält den Titel, ohne spätere theologische Terminologie einzutragen.
- issue: Bestimmtheit von መናፍስት
  choice: „der Geister“
  alternative: „von Geistern“
  rationale: Das Geʿez besitzt hier keinen bestimmten Artikel; beide Deutungen sind grammatisch möglich. Im Deutschen ist „Herr der Geister“ als feststehender Titel natürlicher, während die Fußnote die Alternative offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener parataktischer Visionserzählung. Die Zahlenformeln bleiben formal und feierlich; die schwerfällige Doppelung „Zahl und Zählung“ wird im Haupttext leicht geglättet, ohne eines der beiden Quellwörter auszulassen.
