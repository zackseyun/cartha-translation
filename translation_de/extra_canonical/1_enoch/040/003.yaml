base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/040/003.yaml
  text: And I heard the voices of those four beings as they gave praise before the Lord of glory[a][b][c].
translation:
  language: de
  text: Und ich hörte die Stimmen jener vier Gesichter[a], während sie vor dem Herrn der Herrlichkeit[b] Lob darbrachten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kontextbezogen auch: „jener vier Gestalten“. Gemeint sind offenbar die vier himmlischen Gestalten der Vision.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Herr des Glanzes“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሰማዕኩ
  choice: Und ich hörte
  rationale: Gibt den erzählenden Visionstil und das einleitende waw natürlich und knapp wieder.
- source_word: ቃሎሙ
  choice: die Stimmen
  rationale: ቃል kann Stimme, Laut oder Wort bezeichnen; beim gemeinsamen Lobpreis passt der Plural „Stimmen“ am besten, ohne den Inhalt näher auszugestalten.
- source_word: እልኩ ገጽ አርባዕቱ
  choice: jener vier Gestalten
  rationale: ገጽ bedeutet wörtlich „Gesicht“, bezeichnet hier aber anaphorisch die vier in der Vision wahrgenommenen himmlischen Figuren. „Gestalten“ ist im Deutschen verständlich und bewahrt den visionären Charakter; die wörtliche Form wird in der Fußnote dokumentiert.
- source_word: እንዘ ይሴብሑ
  choice: während sie … Lob darbrachten
  rationale: Die Konstruktion bezeichnet eine gleichzeitig verlaufende Handlung. „Lob darbringen“ ist würdig, verständlich und entspricht dem himmlisch-liturgischen Zusammenhang.
- source_word: ቅድመ
  choice: vor
  rationale: Die knappe Wiedergabe bewahrt sowohl den räumlichen als auch den höfisch-kultischen Sinn von „in der Gegenwart von“.
- source_word: እግዚአ ስብሐት
  choice: dem Herrn der Herrlichkeit
  rationale: Gibt den göttlichen Titel formal und in geläufiger biblischer Sprache wieder. „Herrlichkeit“ umfasst Ruhm, Glanz und Majestät.
theological_decisions:
- issue: Ob ገጽ wörtlich als „Gesichter“ oder kontextuell als Bezeichnung der vier himmlischen Figuren wiederzugeben ist
  choice: jener vier Gestalten
  alternative: jener vier Gesichter
  rationale: Die wörtliche Wiedergabe bewahrt zwar die Bildsprache und die lexikalische Verknüpfung mit dem vorigen Vers, könnte im modernen Deutschen jedoch wie vier körperlose Gesichter wirken. „Gestalten“ verweist verständlich auf die visionären Wesen, ohne sie genauer als Engel oder andere benannte Wesen festzulegen; die echte lexikalische Spannung bleibt durch die Fußnote sichtbar.
- issue: Bedeutungsumfang des Titels እግዚአ ስብሐት
  choice: Herr der Herrlichkeit
  alternative: Herr des Glanzes
  rationale: „Herrlichkeit“ ist die natürliche, traditionsfähige Wiedergabe, doch der mögliche Akzent auf sichtbarem Glanz wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem visionär-liturgischem Ton. Die Satzstruktur bleibt quellennah, während „Gestalten“ eine im Deutschen missverständliche wörtliche Form im Haupttext vermeidet.
