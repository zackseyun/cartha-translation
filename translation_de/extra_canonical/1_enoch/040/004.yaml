  text: The voice of the first blesses the Lord of Spirits forever and ever[a][b].
translation:
  language: de
  text: Die Stimme des Ersten segnet den Herrn der Geister für immer und ewig[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Ausspruch des Ersten segnet den Herrn der Geister für immer und ewig.« Das entsprechende äthiopische Wort kann eine Stimme, ein Wort oder einen Ausspruch bezeichnen; »Stimme« passt hier zum Zusammenhang der nacheinander gehörten himmlischen Stimmen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder nach einer geläufigen, grammatisch glättenden Wiedergabe: »Die erste Stimme«. Wörtlicher steht jedoch »die Stimme des Ersten«.'
    reason: previous_rendering
lexical_decisions:
- source_word: ቃለ
  choice: Stimme
  rationale: Die Konstruktform bedeutet hier »Stimme des …«. Im Zusammenhang der visionären himmlischen Liturgie gibt »Stimme« den hörbaren Vorgang natürlicher wieder als »Wort«.
- source_word: ቀዳማዊ
  choice: des Ersten
  rationale: Das substantivierte Ordinalwort wird von der vorausgehenden Konstruktform regiert und verweist wahrscheinlich auf den ersten der zuvor genannten himmlischen Gegenwärtigen; deshalb wird die grammatische Beziehung als »des Ersten« bewahrt.
- source_word: ይባርኮ
  choice: segnet
  rationale: Die finite Verbform bezeichnet das Segnen. Das Präsens entspricht dem Stil des visionären Berichts und lässt den Aspekt offen.
- source_word: ለእግዚአ መናፍስት
  choice: den Herrn der Geister
  rationale: Die Wendung ist ein gewichtiger göttlicher Titel im Henochbuch. »Herr der Geister« bewahrt sowohl die Titelfunktion als auch den kosmischen Klang.
- source_word: ለዓለመ ዓለም
  choice: für immer und ewig
  rationale: Die wiederholende äthiopische Zeitformel drückt nachdrücklich unbegrenzte Dauer aus; die deutsche Wendung ist idiomatisch und erhält diese Verstärkung.
theological_decisions:
- issue: Wiedergabe des göttlichen Titels ለእግዚአ መናፍስት
  choice: Herr der Geister
  alternative: Herr über die Geister
  rationale: Die Genitivverbindung erhält die traditionelle, titelartige Form und ihre theologische Tragweite, ohne die Beziehung zu den Geistern enger auszulegen.
- issue: Bezug von ቀዳማዊ
  choice: des Ersten
  alternative: die erste Stimme
  rationale: Die Konstruktform von ቃለ spricht für »Stimme des Ersten« und stellt einen Bezug zu einer zuvor genannten himmlischen Gestalt her. Die glattere Alternative könnte diese Beziehung verdecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche, aber grammatisch wichtige Formulierung »Stimme des Ersten« bleibt erhalten; »segnet« bewahrt die unmittelbare Bedeutung des Verbs, auch wenn im Deutschen bei einer an Gott gerichteten Aussage oft »preist« erwartet würde.
