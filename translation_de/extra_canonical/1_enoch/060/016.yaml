base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/016.yaml
  text: And the spirit of the sea is male and strong[a], and according to the might of its strength he holds it back with a rein[c][b], and thus it is driven out and scattered among all the mountains of the earth.
translation:
  language: de
  text: Und der Geist des Meeres[a] ist männlich und stark. Gemäß der Macht der Stärke des Meeres hält er es mit einem Zügel zurück[b]; so wird es hinausgetrieben und über alle Berge der Erde verstreut[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »der Wind des Meeres« oder »der Atem des Meeres«. Das geʿezische Wort kann Geist, Wind oder Atem bezeichnen; der personifizierende Zusammenhang spricht hier für »Geist«.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht das Bild eines Zügels oder Zaumzeugs. Der männlich bezeichnete Geist hält das Meer entsprechend der diesem eigenen gewaltigen Stärke zurück.
    reason: clarification
  - marker: c
    text: Das letzte Verb bedeutet wörtlich auch »gesät«. Das Bild scheint die über die Berge ausgebreitete Kraft oder Feuchtigkeit des Meeres zu beschreiben; der genaue Vorgang bleibt im geʿezischen Text unklar.
    reason: cultural_note
lexical_decisions:
- source_word: መንፈሰ፡ ባሕር
  choice: der Geist des Meeres
  rationale: መንፈስ kann »Geist«, »Wind« oder »Atem« bedeuten. Die ausdrückliche männliche Charakterisierung und das handelnde Auftreten sprechen hier für die personifizierende Wiedergabe »Geist«, ohne die lexikalische Alternative zu verschweigen.
- source_word: ተባዕታይ፡ ውእቱ፡ ወዕኑፅ
  choice: ist männlich und stark
  rationale: Die Formulierung bewahrt sowohl die ausdrücklich bezeichnete Männlichkeit als auch die Aussage von Kraft oder Festigkeit. »Männlich« klingt im Deutschen natürlicher als »ist ein Männlicher« und erhält dennoch die Personifikation.
- source_word: ኃይለ፡ ጽንዐታ
  choice: die Macht der Stärke des Meeres
  rationale: Die beiden Kraftbegriffe werden bewusst nicht zu einem einzigen Adjektiv eingeebnet. Der feminine Suffix an ጽንዐታ bezieht sich grammatisch auf das Meer; deshalb wird der Bezug im Deutschen ausdrücklich mit »des Meeres« wiedergegeben und nicht dem männlichen Geist zugeschrieben.
- source_word: በአንቍ፡ ይገብእ
  choice: hält er es mit einem Zügel zurück
  rationale: አንቍ bezeichnet einen Zügel beziehungsweise ein Zaumzeug; das Verb beschreibt hier das Hereinholen oder Zurückhalten. Die deutsche Formulierung erhält das Bild einer mächtigen, wie ein Tier gebändigten Kraft.
- source_word: ትትነጻእ፡ ወትዘራእ
  choice: wird es hinausgetrieben und … verstreut
  rationale: Die Verben schildern ein Herausgehen beziehungsweise Herausgetriebenwerden und anschließendes Ausstreuen. »Verstreut« gibt den übertragenen Sinn des wörtlichen »gesät« in diesem kosmologischen Zusammenhang natürlich wieder.
- source_word: በአሉ፡ አድባረ፡ ምድር
  choice: über alle Berge der Erde
  rationale: »Über« entspricht dem räumlichen Bild der Verteilung auf beziehungsweise über die Berge und passt zum kosmischen Horizont von »der Erde«.
theological_decisions:
- issue: Personifikation der kosmischen Macht
  choice: Der »Geist des Meeres« bleibt ein männlich beschriebener, handelnder Akteur.
  alternative: Die Wendung unpersönlich als »Meereswind« wiederzugeben und die Geschlechtsangabe abzuschwächen.
  rationale: Der geʿezische Text bezeichnet den Geist ausdrücklich als männlich und verwendet für sein Handeln eine maskuline Verbform. Diese visionäre Personifikation soll nicht in eine rein meteorologische Aussage aufgelöst werden.
- issue: Bezug der Stärke
  choice: Die Stärke wird ausdrücklich dem Meer zugeordnet.
  alternative: »gemäß der Macht seiner Stärke«, mit möglichem Bezug auf den männlichen Geist.
  rationale: Der feminine Suffix an ጽንዐታ und die nachfolgenden femininen Verbformen weisen auf das Meer. Da das deutsche Wort »Meer« sächlich ist, muss der Bezug lexikalisch verdeutlicht werden, damit die geʿezische Unterscheidung zwischen dem männlichen Geist und dem beherrschten Meer erhalten bleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bildhafter kosmologischer Sprache. Die etwas feierliche Intensivierung »Macht der Stärke« bleibt erhalten, während Satzbau und Pronomen so gestaltet sind, dass Geist und Meer klar unterschieden werden.
