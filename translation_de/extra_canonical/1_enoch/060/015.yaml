base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/015.yaml
  text: For when the lightning flashes[a], the thunder gives its voice, and the spirit rests at its appointed time, and it divides equally among them; for the treasury of their times is of sand, and the two of them are restrained with a bridle and turned back by the power of the spirit[d][c][b], and they are driven on likewise according to the many regions of the earth.
translation:
  language: de
  text: Denn wenn der Blitz aufleuchtet, lässt der Donner seine Stimme erschallen, und der Geist[a] ruht zu seiner bestimmten Zeit und teilt gleichmäßig unter ihnen aus[c]; denn die Schatzkammer ihrer Zeiten ist aus Sand, und die beiden werden mit einem Zügel zurückgehalten und durch die Kraft des Geistes zurückgewandt[d]; ebenso werden sie entsprechend den vielen Gegenden der Erde vorangetrieben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Wind“; das zugrunde liegende Wort kann Geist, Wind oder Atem bedeuten. Das gilt für beide Vorkommen in diesem Vers.'
    reason: lexical_alternative
  - marker: b
    text: 'Der Schlussvergleich ist im äthiopischen Text schwer verständlich. Wörtlicher ließe sich auch übersetzen: „ebenso gemäß den vielen Bereichen der Erde“.'
    reason: textual_difficulty
  - marker: c
    text: 'Die Satzfügung ist unsicher; vorsichtiger auch: „und teilt unter ihnen zu“.'
    reason: alternative_reading
  - marker: d
    text: 'Der gesamte Satzabschnitt ist sprachlich schwierig. Eine abweichende ältere Deutung verstand ihn sinngemäß als: „denn die Schatzkammer ihrer Zeiten ist festgesetzt, und sie werden durch die Kraft des Geistes bewegt und gereinigt“; die hier gewählte Fassung folgt jedoch den wahrscheinlicheren Bedeutungen „Sand“, „Zügel“, „zurückwenden“ und „vorantreiben“.'
    reason: previous_rendering
lexical_decisions:
- source_word: ይበርቅ መብረቅ
  choice: der Blitz aufleuchtet
  rationale: Die Verbindung aus Verb und Substantiv bezeichnet das sichtbare Aufleuchten des Blitzes; „aufleuchtet“ bewahrt die lebendige Unwetterbildsprache.
- source_word: ነጐድጓድ ቃሎ ይሁብ
  choice: lässt der Donner seine Stimme erschallen
  rationale: Die konkrete, personifizierende Wendung „seine Stimme geben“ wird in natürlichem, gehobenem Deutsch wiedergegeben, ohne sie zum bloßen „donnern“ zu verflachen.
- source_word: መንፈስ
  choice: Geist
  rationale: Das Wort kann Geist, Wind oder Atem bedeuten. „Geist“ erhält die kosmologische Mehrdeutigkeit und die dem Begriff zugeschriebene Wirkkraft; „Wind“ wird als Alternative vermerkt.
- source_word: በጊዜሃ ያዐርፍ
  choice: ruht zu seiner bestimmten Zeit
  rationale: Die Formulierung wahrt sowohl das Ruhen als auch die Vorstellung einer geordneten, festgesetzten Zeit.
- source_word: ዐሩየ ይከፍል ማእከሎሙ
  choice: teilt gleichmäßig unter ihnen aus
  rationale: Das Verb bezeichnet Teilen oder Zuteilen; „gleichmäßig“ gibt die mögliche distributive Bedeutung von ዐሩየ wieder, bleibt wegen der unsicheren Konstruktion aber in einer Fußnote relativiert.
- source_word: መዝገበ ጊዜያቲሆሙ
  choice: die Schatzkammer ihrer Zeiten
  rationale: „Schatzkammer“ bewahrt das konkrete apokalyptische Bild eines kosmischen Vorrats- oder Aufbewahrungsortes.
- source_word: ዘኆጻ ውእቱ
  choice: ist aus Sand
  rationale: ዘኆጻ bedeutet hier „aus/von Sand“ und darf nicht als „festgesetzt“ verstanden werden.
- source_word: ፪፪እምኔሆሙ በአጓም ይትነኃዙ
  choice: die beiden werden mit einem Zügel zurückgehalten
  rationale: Die Wendung nennt ausdrücklich die beiden und beschreibt ihre Beherrschung durch einen Zügel; die deutsche Form gibt das Bild natürlich und genau wieder.
- source_word: ወይትመየጡ በኃይለ መንፈስ
  choice: durch die Kraft des Geistes zurückgewandt
  rationale: Das passive Zurückwenden und die verursachende Kraft des Geistes werden ohne zusätzliche Deutung bewahrt.
- source_word: ወይትነጸኡ
  choice: werden sie vorangetrieben
  rationale: Die Form gehört zum Bedeutungsfeld des Treibens oder Stoßens, nicht zu dem des Reinigens.
- source_word: ብዙኃ አድዋስ ምድር
  choice: die vielen Gegenden der Erde
  rationale: አድዋስ bezeichnet hier Gegenden oder Bereiche; „Gegenden“ vermeidet die sachlich unzutreffende Wiedergabe „Wohnstätten“.
theological_decisions:
- issue: Meteorologische oder kosmologisch-geistige Wiedergabe von መንፈስ
  choice: Geist
  alternative: Wind oder Atem
  rationale: Der Unwetterzusammenhang stützt „Wind“, während Handlungsfähigkeit und Kraft auch „Geist“ nahelegen. Der Haupttext wahrt die breitere kosmologische Aussage; die meteorologische Lesart bleibt ausdrücklich offen.
- issue: Agens und Bezug beim Austeilen
  choice: grammatisch an „der Geist“ angeschlossen
  alternative: unpersönliches oder nicht näher bestimmtes Agens
  rationale: Die Folge der maskulinen Verbformen legt den Geist als nächstliegenden Bezug nahe, doch die sprachlich schwierige Überlieferung erlaubt keine dogmatische Festlegung; deshalb wird die Unsicherheit vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter kosmischer Personifikation. Ungewöhnliche Bilder wie die „Schatzkammer ihrer Zeiten“ und der Zügel werden nicht geglättet; echte lexikalische und syntaktische Unsicherheiten stehen in den Fußnoten.
