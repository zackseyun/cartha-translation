base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/009.yaml
  text: And I asked another angel that he should show me the power of those monsters[a], how they were separated on one day and were cast[d][c][b], one into the depths of the sea and one onto the dry land of the wilderness.
translation:
  language: de
  text: 'Und ich bat einen anderen Engel, mir die Macht jener Ungeheuer[a] zu zeigen: wie sie an einem Tag getrennt und geworfen wurden[b], das eine in die Tiefen des Meeres und das andere auf das trockene Land in der Wüste[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Zusammenhang bezeichnet diese beiden kosmischen Geschöpfe näher; in diesem Vers selbst werden sie jedoch nur als „jene Ungeheuer“ bezeichnet.
    reason: cross_reference
  - marker: b
    text: 'Das zugrunde liegende Verb steht im Plural: Beide Geschöpfe wurden getrennt und an ihre jeweiligen Orte geworfen.'
    reason: grammar
  - marker: c
    text: 'Die Schlusswendung ist schwierig. Wörtlich steht etwa: „auf das trockene Land, in die Wüste“; sie bildet den Gegensatz zu den Tiefen des Meeres.'
    reason: textual_variant
lexical_decisions:
- source_word: ተስእእክዎ
  choice: ich bat
  rationale: Das Verb bezeichnet hier eine an den Engel gerichtete Bitte. „Ich bat“ passt natürlich zum folgenden Infinitivsatz und wahrt den direkten Charakter des visionären Gesprächs.
- source_word: ካልእ መልአክ
  choice: einen anderen Engel
  rationale: Gibt den Wechsel zu einem weiteren Engel schlicht und ohne zusätzliche Deutung wieder.
- source_word: ያርእየኒ
  choice: mir … zu zeigen
  rationale: Der deutsche Infinitivsatz gibt den Inhalt der Bitte idiomatisch und zugleich eng am abhängigen ge'ezischen Ausdruck wieder.
- source_word: ኃይሎሙ
  choice: die Macht
  rationale: Das Wort bezeichnet Macht, Kraft oder Stärke. „Macht“ bewahrt die Grundbedeutung, ohne den Ausdruck als Wesen oder Natur der Geschöpfe auszulegen.
- source_word: እሉክ ዐናብርት
  choice: jener Ungeheuer
  rationale: Das ferne Demonstrativum wird mit „jener“ wiedergegeben. „Ungeheuer“ erhält die unheimliche, kosmische Färbung des Ausdrucks besser als das neutralere „Tiere“.
- source_word: ተሌለዩ
  choice: voneinander getrennt wurden
  rationale: Die passive Form zeigt, dass die Wesen getrennt wurden; „voneinander“ verdeutlicht die im Zusammenhang gemeinte Trennung der beiden.
- source_word: በአሐቲ ዕለት
  choice: an einem einzigen Tag
  rationale: Bewahrt sowohl die zeitliche Angabe als auch den Nachdruck auf der Einheit des Tages, ohne zu entscheiden, ob ein bestimmter urzeitlicher Tag gemeint ist.
- source_word: ተወድዩ
  choice: hinabgeworfen wurden
  rationale: Die Pluralform bezieht sich auf beide Wesen und bezeichnet eine gewaltsame Platzierung. „Hinabgeworfen“ passt besonders zur Bewegung in die Meerestiefe, bleibt aber auch für die parallele Zuweisung des anderen Wesens verständlich.
- source_word: በልጕተ ባሕር
  choice: in die Tiefen des Meeres
  rationale: Gibt die tiefe Region des Meeres anschaulich wieder, ohne einen technisch-kosmologischen Begriff wie „Abgrund“ einzuführen.
- source_word: በየብስ በድው
  choice: auf das trockene Land in der Wüste
  rationale: 'Die Wiedergabe erhält beide Elemente der schwierigen Wendung: trockenes Land und Wüstengebiet, im Kontrast zur Meerestiefe.'
theological_decisions:
- issue: Identität der beiden Geschöpfe
  choice: Im Haupttext werden sie allgemein „jene Ungeheuer“ genannt.
  alternative: Sie ausdrücklich als Leviatan und Behemot bezeichnen.
  rationale: Der vorliegende Vers nennt die Wesen nicht mit Namen. Ihre nähere Identität ergibt sich aus dem Kontext, soll aber nicht gegen den lokalen Wortlaut in den Haupttext eingetragen werden.
- issue: Bedeutung von ኃይሎሙ
  choice: „die Macht jener Ungeheuer“
  alternative: „ihre Stärke“ oder „ihr Wesen“
  rationale: „Macht“ entspricht dem lexikalischen Zentrum. Eine Deutung als „Wesen“ würde die mögliche kontextuelle Nuance im Haupttext zu stark festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Syntax bleibt nah am ge'ezischen Gedankengang, wird aber durch Doppelpunkt und paralleles „das eine … das andere“ klar gegliedert. Archaisierende Formen und konfessionell geprägte Deutungen werden vermieden.
