  yaml_path: translation/extra_canonical/1_enoch/060/004.yaml
  text: And Michael sent another angel from among the holy ones[a], and he lifted me up. And when he lifted me up, my spirit entered in[c][b], for I was not able to endure the sight of that power and its shaking and the quaking of heaven.
translation:
  language: de
  text: Und Michael sandte einen anderen Engel aus der Mitte der Heiligen, und er hob mich empor. Als er mich emporhob, kehrte mein Geist zurück, denn ich konnte den Anblick jener Macht, ihr Beben und das Erzittern des Himmels nicht ertragen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Oder: „den Anblick jener mächtigen Kraft, ihres Tumults und des Erzitterns des Himmels“. Die Beziehung zwischen „Macht“, „Beben/Tumult“ und „Himmel“ ist im Geʿez syntaktisch verdichtet.'
    reason: alternative_reading
