base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/017.yaml
  text: And the spirit of the hoarfrost is its own angel[c][b][a], and the spirit of the hail is a good angel.
translation:
  language: de
  text: Und der Geist des Raureifs ist sein eigener Engel,[a] und der Geist des Hagels ist ein guter Engel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Der Engel von ihm ist er.“ Gemeint ist offenbar, dass der Geist des Raureifs selbst dessen Engel ist.'
    reason: Die ge’ezische Besitz- und Kopulaformel ist im Deutschen ohne leichte Verdeutlichung schwer verständlich.
lexical_decisions:
- source_word: መንፈሰ
  choice: der Geist des
  rationale: Die wiederholte Konstruktverbindung bezeichnet den personifizierten Geist einer Wettererscheinung; „Geist des“ bewahrt diese apokalyptische Personifizierung.
- source_word: አስሐትያ
  choice: Raureif
  rationale: Das Wort bezeichnet hier eine Reif- beziehungsweise Raureifbildung und ist nicht als Engelname zu transliterieren.
- source_word: መልአክ
  choice: Engel
  rationale: Im apokalyptischen Zusammenhang ist „Engel“ gegenüber dem allgemeineren „Bote“ die sachlich passende Wiedergabe.
- source_word: ዚአሁ ውእቱ
  choice: ist sein eigener
  rationale: Die Besitz- und Kopulaformel bedeutet wörtlich ungefähr „ist der Engel von ihm“. „Ist sein eigener Engel“ gibt die Aussage verständlich wieder, ohne einen Namen in den Text einzutragen.
- source_word: በረድ
  choice: Hagel
  rationale: Die gewöhnliche meteorologische Bedeutung passt in die Aufzählung kosmischer Wetterkräfte.
- source_word: ኄር
  choice: gut
  rationale: Das Wort ist hier das Adjektiv „gut“ und kein als „Her“ zu lesender Eigenname.
theological_decisions:
- issue: Verhältnis zwischen dem Geist des Raureifs und seinem Engel
  choice: Der Geist des Raureifs ist sein eigener Engel.
  alternative: Der Geist des Raureifs hat einen Engel.
  rationale: Die Formulierung identifiziert den Geist mit seinem zugehörigen Engel, statt lediglich einen von ihm verschiedenen Engel anzunehmen. Die ungewöhnliche Aussage und ihre apokalyptische Spannung bleiben erhalten.
- issue: Deutung von አስሐትያ und ኄር als Wörter oder Eigennamen
  choice: „Raureif“ und „gut“
  alternative: Engelnamen „Asahatiya“ und „Her“
  rationale: Die lexikalischen Bedeutungen im Ge’ez ergeben zwei Beschreibungen; eine Deutung als Eigennamen würde unbelegte Engelgestalten in den Text einführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzform und die personifizierende Rede von Wettererscheinungen wurden bewahrt; die eigentümliche Identifikation des ersten Geistes mit seinem Engel wurde nicht geglättet.
