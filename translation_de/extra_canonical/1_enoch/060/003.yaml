base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/003.yaml
  text: And as for me[a], a great trembling seized me, and fear took hold of me; and my loins were broken, and my kidneys were loosened[d][c][b], and I fell on my face.
translation:
  language: de
  text: Mich aber ergriff ein großes Zittern, und Furcht packte mich. Meine Lenden wurden zerbrochen, meine Nieren lösten sich, und ich fiel mit dem Gesicht zu Boden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ረዓድ ዐቢይ
  choice: ein großes Zittern
  rationale: Bewahrt die körperliche Heftigkeit der Visionserfahrung und gibt das verstärkende Adjektiv direkt wieder, ohne das Zittern vorschnell als bloßen Schrecken zu deuten.
- source_word: ነሥአኒ
  choice: ergriff mich
  rationale: Bei »Zittern« als Subjekt bezeichnet das Verb hier ein Überwältigen oder Ergreifen; eine wörtliche Grundbedeutung wie »hob mich empor« passt nicht zur Reaktionsfolge.
- source_word: ፍርሃት አሐዘኒ
  choice: Furcht packte mich
  rationale: Die konkrete Vorstellung, dass die Furcht den Sprecher festhält, bleibt in natürlichem modernem Deutsch erhalten.
- source_word: ሐቌየ ተቀጽዐ
  choice: meine Lenden wurden zerschmettert
  rationale: Das Passivverb bezeichnet ein Zerbrechen, Zerschlagen oder Zermalmen. »Zerschmettert« wahrt das drastische Körperbild und unterscheidet es klar vom folgenden Verb.
- source_word: ኵልያትየ ተፈትሑ
  choice: meine Nieren lösten sich
  rationale: »Nieren« gibt das konkrete Organwort transparent wieder; »lösten sich« entspricht dem Auflösen beziehungsweise Lockerwerden, ohne das Bild durch »Herz« oder »Innerstes« zu ersetzen.
- source_word: ወወደቁ በገጽየ
  choice: und ich fiel auf mein Gesicht
  rationale: Im durchgehend erstpersönlichen Zusammenhang ist der Sprecher das sinngemäße Subjekt. Die Formulierung bewahrt die körperliche Haltung des Zusammenbrechens oder der Niederwerfung.
theological_decisions:
- issue: Ob das antike anthropologische Bild der Nieren im Haupttext beibehalten oder modernisiert werden soll
  choice: »meine Nieren lösten sich« im Haupttext
  alternative: »mein Innerstes löste sich auf« oder »mein Herz verzagte«
  rationale: Das konkrete und fremdartige Körperbild gehört zur Bildwelt des Textes. Eine Ersetzung durch »Herz« würde die antike Vorstellung interpretierend harmonisieren und einen anderen Körperbegriff eintragen.
- issue: Ob die drastische Schädigung der Lenden abgeschwächt werden soll
  choice: »wurden zerschmettert«
  alternative: »gaben nach« oder »brachen zusammen«
  rationale: Das Ge’ez-Verb trägt den Sinn von Zerbrechen oder Zerschlagen. Die starke Wiedergabe erhält die visionäre körperliche Erschütterung, statt sie zu einer allgemeineren Schwäche umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter apokalyptischer Körperbildlichkeit. Kurze Hauptsätze machen die Folge überwältigender Reaktionen verständlich; ungewohnte Bilder werden nicht im Haupttext geglättet, sondern in Fußnoten erläutert.
