  - severity: low
    issue: »ich fiel auf mein Gesicht«
    rationale: Die Formulierung ist zwar transparent, jedoch weniger idiomatisch als »ich fiel mit dem Gesicht zu Boden«, das die im Ausgangstext gemeinte Haltung ebenso deutlich wiedergibt.
  revised_text: Mich aber ergriff ein großes Zittern, und Furcht packte mich. Meine Lenden wurden zerbrochen, meine Nieren lösten sich, und ich fiel mit dem Gesicht zu Boden.
