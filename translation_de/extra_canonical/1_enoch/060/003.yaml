    issue: »zerschmettert« für ሐቌየ ተቀጽዐ
    rationale: Das Verb bezeichnet gebrochen bzw. zerbrochen werden. »Zerschmettert« kann eine über das Quellebild hinausgehende, gewaltsamere Vernichtung nahelegen. »zerbrochen« ist genauer und bewahrt die passive Parallelstruktur.
  - severity: low
