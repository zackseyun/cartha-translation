  verdict: revise
  source_fidelity: 'Die Abfolge und die zentralen Bilder entsprechen dem geʽezischen Text: großes Zittern und Furcht überwältigen den Sprecher; Lenden und Nieren werden in parallelen Passivformen betroffen; anschließend fällt er auf sein Gesicht. Für ተቀጽዐ ist »zerbrochen« die präzisere, nicht unnötig gesteigerte Wiedergabe gegenüber »zerschmettert«. ተፈትሑ wird mit »lösten sich« angemessen und bildtreu wiedergegeben.'
  naturalness: Der Text ist überwiegend natürliches, würdiges modernes Standarddeutsch. »Ich fiel auf mein Gesicht« ist verständlich, aber »ich fiel mit dem Gesicht zu Boden« ist im Deutschen die idiomatischere Umschreibung derselben Prostrationshaltung.
  terminology: '»Lenden« und »Nieren« bewahren die antike Körperbildlichkeit. »Furcht« passt zum Register. Die Fußnote zu den Nieren erklärt das kulturelle Bild zurückhaltend. Die Fußnote zu »Mich aber« ist nicht erforderlich und stützt sich mit »Wörtlich: Und ich« nicht zuverlässig auf die elliptischere geʽezische Anschlussformel.'
