base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/010.yaml
  text: And he said to me[a], “You, son of man[c][b], here you desire to understand what is hidden.”
translation:
  language: de
  text: 'Und er sagte zu mir: „Du, Menschensohn[a], willst hier verstehen, was verborgen ist.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Menschenkind“ beziehungsweise „sterblicher Mensch“. Hier wird der Seher angeredet; die Wendung bezeichnet nicht notwendigerweise die erhöhte Gestalt, die an anderen Stellen der Bilderreden „der Menschensohn“ genannt wird.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „das Verborgene zu erkennen“ oder „zu erfahren, was verborgen ist“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይቤለኒ
  choice: Und er sagte zu mir
  rationale: Die gewöhnliche ge’ezische Erzählformel für die Einleitung direkter Rede wird in natürlichem, würdevollem Deutsch wiedergegeben.
- source_word: አንተ
  choice: Du
  rationale: Das ausdrücklich gesetzte Personalpronomen hebt den Angeredeten hervor; diese Betonung bleibt vor der Anrede erhalten.
- source_word: ወልደ፡ ሰብእ
  choice: Menschensohn
  rationale: Die wörtliche, traditionsreiche Wiedergabe bewahrt die semitisch geprägte Ausdrucksweise und die Spannung zu anderen Vorkommen in den Bilderreden. Hier bezeichnet sie im unmittelbaren Zusammenhang den menschlichen Seher.
- source_word: በዝየ
  choice: hier
  rationale: Das kurze Ortsadverb erhält den deiktischen Bezug auf die gegenwärtige visionäre Situation.
- source_word: ትፈቅድ
  choice: möchtest du
  rationale: Die Form bezeichnet Wunsch oder Willen. „Möchtest“ klingt im modernen Deutsch natürlich und vermeidet sowohl die Härte von „willst“ als auch die Bedeutungsverengung auf Erlaubnis.
- source_word: ታእምር
  choice: verstehen
  rationale: Im Offenbarungszusammenhang geht es um das Erfassen des Verborgenen, nicht nur um dessen bloße Kenntnis.
- source_word: ዘኅቡእ
  choice: was verborgen ist
  rationale: Die relative Konstruktion wird transparent wiedergegeben, ohne durch „Geheimnis“ einen möglicherweise technischen Begriff einzutragen.
theological_decisions:
- issue: Wiedergabe von ወልደ ሰብእ in den Bilderreden
  choice: Menschensohn
  alternative: Menschenkind; sterblicher Mensch
  rationale: Die Formulierung ist hier eine Anrede an den Seher und nicht zwingend die Bezeichnung der erhöhten Gestalt, die andernorts „der Menschensohn“ heißt. Die wörtliche Wiedergabe bewahrt dennoch die sprachliche und theologische Spannung; die Fußnote verhindert eine vorschnelle Gleichsetzung.
translation_notes:
  register: Modernes Standarddeutsch mit würdevollem apokalyptischem Ton. Die leicht markierte Wiederaufnahme durch „Du, Menschensohn … du“ wird im Deutschen nicht benötigt, da das ausdrücklich vorangestellte „Du“ zusammen mit der Anrede die Hervorhebung bereits trägt.
