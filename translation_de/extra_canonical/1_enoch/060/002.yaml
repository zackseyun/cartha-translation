base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/002.yaml
  text: And the Head of Days was sitting on the throne of his glory[a], and the angels and the righteous were standing around him.
translation:
  language: de
  text: Und das Haupt der Tage[a] saß auf dem Thron seiner Herrlichkeit, und die Engel und die Gerechten standen rings um ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Alte an Tagen«. Der ge’ezische Titel wird hier wörtlicher als »das Haupt der Tage« wiedergegeben, damit die besondere Formulierung dieser Stelle erhalten bleibt und nicht vorschnell an die vertraute Ausdrucksweise aus Daniel angeglichen wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ርእሰ መዋዕል
  choice: das Haupt der Tage
  rationale: Die weitgehend wörtliche Wiedergabe bewahrt den eigentümlichen henochischen Titel und vermeidet eine vorschnelle Angleichung an die vertraute Ausdrucksweise aus Daniel.
- source_word: መንበረ ስብሐቲሁ
  choice: der Thron seiner Herrlichkeit
  rationale: Die Genitivverbindung gibt die konkrete Thronvorstellung und den erhabenen apokalyptischen Sprachton unmittelbar wieder.
- source_word: ይነብር
  choice: saß
  rationale: Im Zusammenhang der Thronvision bezeichnet das Verb die sitzende Haltung des Thronenden; das deutsche Präteritum stellt die Szene natürlich dar.
- source_word: መላእክት
  choice: die Engel
  rationale: Im himmlischen Hofstaat ist „Engel“ die sachlich und kontextuell naheliegende Bedeutung.
- source_word: ጻድቃን
  choice: die Gerechten
  rationale: Der Ausdruck bezeichnet gerechte Menschen als klar erkennbare Gruppe und entspricht dem üblichen Sprachgebrauch religiöser deutscher Texte.
- source_word: አውዶ
  choice: rings um ihn
  rationale: Die Formulierung gibt die umgebende Anordnung der himmlischen Gestalten klar und idiomatisch wieder.
- source_word: ይቆውሙ
  choice: standen
  rationale: Das Verb beschreibt die stehende Haltung der Umstehenden und bildet einen natürlichen Gegensatz zum Sitzen des Thronenden.
theological_decisions:
- issue: Wiedergabe des göttlichen Titels ርእሰ መዋዕል im Verhältnis zur Danieltradition
  choice: das Haupt der Tage
  alternative: der Alte an Tagen
  rationale: Die wörtlichere Hauptlesart bewahrt die besondere Formulierung des ge’ezischen Textes, ohne sie stillschweigend mit dem geläufigeren Daniel-Titel gleichzusetzen. Die traditionsnahe Deutung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener apokalyptischer Bildsprache. Der ungewöhnliche Titel bleibt im Haupttext erhalten; die geläufigere traditionsbezogene Wiedergabe steht in der Fußnote.
