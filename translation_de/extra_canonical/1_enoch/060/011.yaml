base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/011.yaml
  text: And another angel[a], who went with me and showed me what is hidden, told me what is first and what is last in heaven, in the height, and beneath the earth in the depth, and at the ends of heaven[c][b], and at the foundations of heaven.
translation:
  language: de
  text: Und ein anderer Engel, der mit mir ging und mir das Verborgene zeigte, sagte mir, was im Himmel, in der Höhe, unter der Erde in der Tiefe, an den Enden des Himmels und an den Grundfesten des Himmels das Erste und das Letzte ist[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Was das Erste und was das Letzte ist« kann auch mit »das Erste und das Letzte« wiedergegeben werden. Hier ist die Wendung als Beschreibung der offenbarten kosmischen Bereiche verstanden, nicht als Titel. Die überlieferte geʿezische Zeile ist an zwei Stellen offenbar fehlerhaft transkribiert; übersetzt wird nach den plausiblen Lesarten »das Verborgene« und »Erde«.
    reason: lexical_alternative_and_textual_variant
lexical_decisions:
- source_word: ወይቤለኒ
  choice: sagte mir
  rationale: Die einfache geʿezische Erzählformel wird direkt wiedergegeben; der folgende Inhalt ist das, was der Engel dem Seher sagt.
- source_word: መልአክ ካልእ
  choice: ein anderer Engel
  rationale: ካልእ bezeichnet hier einen weiteren Engel und nicht zwingend den ordinalen »zweiten«.
- source_word: ዘምስሌየ የሐውር
  choice: der mit mir ging
  rationale: Bewahrt sowohl die Begleitung des Sehers als auch den Bewegungssinn des Verbs.
- source_word: ወዘኅቡእ ያርእየኒ
  choice: und mir das Verborgene zeigte
  rationale: Folgt der als OCR-Korrektur erkannten Lesart ወዘኅቡእ und beschreibt die offenbarende Tätigkeit des Engels.
- source_word: ቀዳሜ ወድኃሬ
  choice: was das Erste und was das Letzte ist
  rationale: Gibt das Begriffspaar beschreibend wieder, ohne es vorschnell als göttlichen Titel zu verstehen.
- source_word: በሰማየ በውስተ ላዕሉ
  choice: im Himmel, in der Höhe
  rationale: Erhält die räumliche Reihung und den gehobenen apokalyptischen Klang.
- source_word: ወበታሕተ ምድር በመዓምቅ
  choice: unter der Erde in der Tiefe
  rationale: Berücksichtigt die erkannte Korrektur von ደብለ zu ምድር und wahrt den räumlichen Sinn von በመዓምቅ, ohne ihn auf »Abgrund« festzulegen.
- source_word: በአጽናፈ ሰማይ
  choice: an den Enden des Himmels
  rationale: Bewahrt das Bild der äußersten Ränder des kosmischen Himmels.
- source_word: በመሠረተ ሰማይ
  choice: an den Grundfesten des Himmels
  rationale: »Grundfesten« gibt die kosmologische Bauvorstellung würdevoll und anschaulich wieder.
theological_decisions:
- issue: Ob ቀዳሜ ወድኃሬ als titelartige Wendung »der Erste und der Letzte« zu verstehen ist
  choice: was das Erste und was das Letzte ist
  alternative: das Erste und das Letzte / der Erste und der Letzte
  rationale: Im Zusammenhang gehört die Wendung zu einer Aufzählung kosmischer Bereiche und Grenzen. Die beschreibende Fassung vermeidet, einen später geprägten göttlichen Titel in den Text einzutragen, erhält aber die substantivische Spannung durch »das Erste« und »das Letzte«.
- issue: Spezifische Deutung von በመዓምቅ als Unterwelt oder Abgrund
  choice: in der Tiefe
  alternative: im Abgrund
  rationale: Die räumliche Bedeutung ist sicherer als eine bestimmte kosmologische oder theologische Identifikation; deshalb bleibt die Übersetzung bewusst offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptischer Bildsprache. Der Doppelpunkt macht kenntlich, dass die anschließende Ortsreihe den Umfang dessen entfaltet, was »das Erste und das Letzte« umfasst, ohne die schwierige Syntax übermäßig zu glätten.
