base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/013.yaml
  text: And the thunder[a], according to their places of striking, and for every division that is divided by the lightning, so that it may flash—and their restraint[d][c][b], so that they may hear quickly.
translation:
  language: de
  text: Und der Donner[a], entsprechend ihren jeweiligen Einschlagsorten, und jede Einteilung, die durch den Blitz eingeteilt wird[b], damit er aufleuchtet – und ihre Zurückhaltung, damit sie schnell hören[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der ge’ezische Satz ist schwer verständlich. Wörtlich steht hier eine Wendung wie „nach ihren jeweiligen Orten des Fallens“; gemeint sein können die Orte, an denen die mit dem Donner verbundenen Erscheinungen niedergehen oder einschlagen.
    reason: lexical_alternative
  - marker: b
    text: „Jede Einteilung, die eingeteilt wird“ gibt die auffällige Wiederholung verwandter Wörter in der Quelle wieder. Gemeint sein könnte jeder zugeteilte Abschnitt der Sturmerscheinungen.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „damit sie schnell hören“. Im semitischen Sprachgebrauch kann „hören“ auch schnelles Reagieren oder Gehorchen einschließen. Worauf sich „sie“ bezieht, bleibt unklar.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ነጐድጓድ
  choice: Donner
  rationale: Das Substantiv bezeichnet Donner beziehungsweise Donnergrollen; „Donner“ bewahrt das konkrete kosmisch-meteorologische Bild.
- source_word: በበመዳቃቲሆሙ
  choice: nach den jeweiligen Orten seines Einschlags
  rationale: Die distributive Präposition und der Plural weisen auf die jeweiligen Orte hin; መዳቃ bezeichnet konkret einen Ort des Fallens beziehungsweise Einschlags. Das deutsche Singularpronomen bezieht sich sinngemäß auf „Donner“.
- source_word: ኵሉ ክፍለ ዘይትከፈል
  choice: jede Einteilung, die … eingeteilt wird
  rationale: Die Wiederholung des verwandten Nomens und Verbs wird erhalten, obwohl sie im Deutschen auffällig klingt, weil sie zur schwierigen und möglicherweise absichtsvoll repetitiven Formulierung der Quelle gehört.
- source_word: በመብረቅ
  choice: durch den Blitz
  rationale: 'Die Präposition wird instrumental verstanden: Der Blitz bewirkt oder kennzeichnet die Einteilung.'
- source_word: ከመ ይበርቅ
  choice: damit er aufleuchtet
  rationale: Das Verb gehört zum Bedeutungsfeld von Blitz und Helligkeit. „Aufleuchten“ gibt die Erscheinung natürlich wieder, ohne die genaue Art des Leuchtens weiter festzulegen.
- source_word: ትዕግሥቶሙ
  choice: ihre Zurückhaltung
  rationale: Das Nomen kann Geduld, Ausharren oder Zurückhaltung bezeichnen. Im Zusammenhang kontrollierter kosmischer Kräfte passt „Zurückhaltung“, doch die Referenz des Plurals bleibt wie in der Quelle undeutlich.
- source_word: ፍጡነ ይስምዑ
  choice: damit sie schnell hören
  rationale: Die Grundbedeutung von ይስምዑ ist „hören“. Die mögliche semitische Nebenbedeutung „gehorchen/reagieren“ wird nicht in den Haupttext eingetragen, sondern in einer Fußnote erläutert.
theological_decisions:
- issue: Ob die dunkle meteorologische Folge als Gehorsam kosmischer Mächte gegenüber einem göttlichen Befehl erklärt werden soll
  choice: Die konkrete und syntaktisch schwierige Folge von Donner, Einschlagsorten, Blitz, Einteilung und Zurückhaltung bleibt ohne erklärende Erweiterung stehen.
  alternative: Den Schluss ausdrücklich als unverzüglichen Gehorsam der kosmischen Mächte wiedergeben oder den ganzen Vers als geordnetes Wirken der Sturmkräfte paraphrasieren.
  rationale: Der ge’ezische Text ist an dieser Stelle dunkel. Eine eindeutige Deutung als Gehorsam würde eine mögliche theologische Auslegung in die Übersetzung eintragen, die der Wortlaut nicht ausdrücklich festlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die fragmentarische, schwer verständliche Satzgestalt der Quelle wird weitgehend bewahrt; Fußnoten kennzeichnen die wichtigsten lexikalischen und referenziellen Unsicherheiten.
