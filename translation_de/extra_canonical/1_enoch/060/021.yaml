base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/021.yaml
  text: And when the spirit of the rain is stirred from its storehouse[a], the angels come and open the storehouse and bring it out. And when it is scattered upon all the dry ground, it is joined with the water that is upon the dry ground; and whenever it is joined with the water upon the dry ground . [d][c][b]. .
translation:
  language: de
  text: Und wenn der Geist des Regens aus seiner Vorratskammer in Bewegung gerät, kommen die Engel, öffnen die Vorratskammer und führen ihn heraus. Und wenn er über das ganze trockene Land ausgestreut wird[a], verbindet er sich mit dem Wasser, das auf dem trockenen Land ist; und wenn er zu jeder Zeit mit dem Wasser verbunden ist, das auf dem trockenen Land ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „gesät wird“; dem Zusammenhang nach ist das Ausstreuen oder Verteilen des Regens gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Das Ge’ez wiederholt hier die Aussage über die Verbindung mit dem Wasser auf dem trockenen Land. Der schwierige Schlusssatz kann auch so verstanden werden, dass der Regen nach dieser Verbindung beständig dort bleibt.
    reason: textual_difficulty
lexical_decisions:
- source_word: መንፈሱ ለዝናም
  choice: der Geist des Regens
  rationale: መንፈስ kann Geist, Wind oder Atem bedeuten. „Geist des Regens“ bewahrt die personifizierende apokalyptische Bildwelt und lässt die Mehrdeutigkeit eher bestehen als eine rein meteorologische Wiedergabe.
- source_word: ይትኃወስ
  choice: in Bewegung gerät
  rationale: Das Verb bezeichnet Bewegung oder Erregung. Die Formulierung ist im Deutschen natürlich und legt nicht unnötig fest, wodurch die Bewegung ausgelöst wird.
- source_word: መዝገበ
  choice: Vorratshaus
  rationale: Das konkrete Bild eines himmlischen Aufbewahrungsortes für Naturkräfte wird bewahrt; „Schatzkammer“ könnte einen sachfremden Wertakzent setzen.
- source_word: ያወጽእዎ
  choice: führen ihn heraus
  rationale: Die kausative Handlung der Engel bleibt sichtbar. Das maskuline Pronomen nimmt den „Geist des Regens“ wieder auf.
- source_word: ይዘራእ
  choice: ausgestreut wird
  rationale: Die Wurzel bedeutet grundsätzlich „säen“ beziehungsweise „ausstreuen“. „Ausgestreut“ wahrt dieses Bild und passt zugleich natürlich zur Verteilung des Regens über das Land.
- source_word: የብስ
  choice: trockenes Land
  rationale: Der Ausdruck bezeichnet das Trockene beziehungsweise Festland im Gegensatz zum Wasser. „Trockenes Land“ erhält diesen Kontrast.
- source_word: ይትኃበር ምስለ ማይ
  choice: verbindet er sich mit dem Wasser
  rationale: Die reflexiv-passive Vorstellung des Zusammenkommens wird idiomatisch wiedergegeben, ohne den Vorgang als bloßes Vermischen festzulegen.
- source_word: በኵሉ ጊዜ
  choice: zu jeder Zeit
  rationale: Die ausdrückliche Zeitangabe bleibt erhalten, obwohl ihre genaue Beziehung zum wiederholten Schlusssatz schwierig ist.
theological_decisions:
- issue: Personhafte oder rein meteorologische Darstellung des Regens
  choice: „Geist des Regens“ sowie die handelnden Engel und das Vorratshaus werden beibehalten.
  alternative: Den Abschnitt als unpersönliche Beschreibung eines Regensturms oder natürlichen Wasserkreislaufs wiederzugeben.
  rationale: Der Text beschreibt Naturvorgänge innerhalb einer apokalyptischen Kosmologie mit himmlischen Mächten. Eine Modernisierung zu gewöhnlicher Wetterkunde würde diese Aussageebene einebnen.
- issue: Deutung des wiederholten Schlusssatzes
  choice: Die Wiederholung und die Zeitangabe werden im Haupttext möglichst formal bewahrt.
  alternative: Die Stelle als dauerhaftes Verbleiben des Regens im Oberflächenwasser auszudeuten.
  rationale: Der überlieferte Wortlaut ist schwierig und erlaubt mehr als eine syntaktische beziehungsweise sachliche Deutung. Der Haupttext soll diese Spannung nicht stillschweigend auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die konkrete apokalyptische Bildsprache bleibt erhalten; die ungewöhnliche Wiederholung am Versende wird nicht geglättet. Sämtliche Fußnotenmarker stehen an der sachlich zugehörigen Stelle im Haupttext.
