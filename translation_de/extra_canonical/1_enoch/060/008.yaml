base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/008.yaml
  text: And the name of the male was Behemoth[a], who occupies with his breast an unseen wilderness named Dundayin, east of the garden, where the chosen and the righteous dwell, where my great-grandfather was taken up, the seventh from Adam[e][d][c][b], the first of men whom the Lord of Spirits made.
translation:
  language: de
  text: 'Und das männliche Wesen hieß Behemot[d]. Mit seiner Brust nimmt es eine unsichtbare[a] Wildnis namens Dundayin ein, östlich des Gartens[b], wo die Erwählten und die Gerechten wohnen und wo mein Urgroßvater[c] entrückt wurde: der Siebte von Adam an, dem ersten der Menschen, den der Herr der Geister erschuf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich eine Wildnis, „die nicht gesehen wird“. Gemeint sein kann auch eine verborgene oder unzugängliche Wildnis; ältere Wiedergaben verstehen sie als öde Wildnis.
    reason: textual_variant
  - marker: b
    text: Wörtlich „Garten“. Der Text nennt ihn hier nicht ausdrücklich „Eden“.
    reason: lexical_alternative
  - marker: c
    text: Das geʿezische Verwandtschaftswort kann weiter gefasst sein und auch mit „mein Vorfahr“ wiedergegeben werden; traditionelle Übersetzungen haben teils „mein Großvater“. Gemeint ist Henoch, der siebte von Adam an.
    reason: lexical_alternative
  - marker: d
    text: 'Mögliche andere Lesart: „Und der zweite hieß Behemot.“'
    reason: textual_variant
lexical_decisions:
- source_word: ወለተ ባዕታይ፡ ስሙ፡ ብሔሞት
  choice: Und das männliche Wesen hieß Behemot
  rationale: Die überlieferte Lesart bezeichnet das männliche Gegenstück und nennt seinen Eigennamen. „Wesen“ ist zur natürlichen deutschen Formulierung ergänzt, ohne die Art des Geschöpfs näher festzulegen; die mögliche Lesart „der zweite“ wird in einer Fußnote bewahrt.
- source_word: ዘይአኅዝ፡ በእንግ ድዓሁ
  choice: Mit seiner Brust nimmt es … ein
  rationale: Die räumliche Bedeutung des Verbs wird mit „einnehmen“ wiedergegeben. Das konkrete und ungewöhnliche Bild der Brust bleibt erhalten.
- source_word: በበድው፡ ዘኢያስተርኢ
  choice: eine unsichtbare Wildnis
  rationale: Die Negation mit dem Verb des Erscheinens beziehungsweise Sichtbarseins spricht unmittelbar für „unsichtbar“ oder „nicht sichtbar“. Die semantische Unsicherheit zwischen verborgen, unzugänglich und öde wird angemerkt.
- source_word: ዱንዳይን
  choice: Dundayin
  rationale: Der Ortsname wird transliteriert und nicht gedeutet.
- source_word: በምሥራቀ፡ ገነት
  choice: östlich des Gartens
  rationale: „Garten“ entspricht dem Wortlaut; „Eden“ wäre eine nicht ausdrücklich genannte Identifizierung.
- source_word: በኀበ፡ ይነብሩ፡ ኅሩያን፡ ወጻድቃን
  choice: wo die Erwählten und die Gerechten wohnen
  rationale: Die beiden substantivierten Bezeichnungen werden als zentrale apokalyptische Gruppenbegriffe beibehalten.
- source_word: ተመጠወ
  choice: aufgenommen wurde
  rationale: Die Formulierung bezeichnet die Entrückung beziehungsweise Wegnahme, ohne eine bestimmte spätere Lehrsprache aufzuzwingen.
- source_word: እምኄውየ
  choice: mein Urgroßvater
  rationale: Im erzählerischen Zusammenhang bezeichnet der Sprecher Henoch als seinen Vorfahren; „Urgroßvater“ bildet die genealogische Beziehung zu Noah präzise ab, während die mögliche weitere Bedeutung des Verwandtschaftswortes in einer Fußnote genannt wird.
- source_word: ሳብዕ፡ እምአዳም
  choice: der Siebte von Adam an
  rationale: Die feste genealogische Wendung identifiziert Henoch als das siebte Glied einschließlich Adam.
- source_word: ቀዳሚሆሙ፡ ለሰብእ፡ ዘገብረ፡ እግዚአ፡ መናፍስት
  choice: dem ersten der Menschen, den der Herr der Geister erschuf
  rationale: Die Wendung wird als nähere Bestimmung Adams verstanden. Der Singular des Relativsatzes bleibt erhalten, und der Gottesname „Herr der Geister“ wird formal wiedergegeben.
theological_decisions:
- issue: Identität des aufgenommenen Vorfahren und des Sprechers
  choice: Der aufgenommene Urgroßvater ist Henoch, „der Siebte von Adam an“; der Sprecher ist in diesem Abschnitt dem Zusammenhang nach Noah.
  alternative: Das Verwandtschaftswort kann allgemeiner als „mein Vorfahr“ oder traditionell als „mein Großvater“ wiedergegeben werden.
  rationale: Die Formulierung „mein …, der Siebte von Adam an“ bezeichnet Henoch aus der Perspektive eines Nachkommen. Die Übersetzung wahrt diese Genealogie, ohne eine zusätzliche Aussage über die literarische Entstehung des Abschnitts einzufügen.
- issue: Bezug von „dem ersten der Menschen“
  choice: Die Wendung wird auf Adam bezogen.
  alternative: Sie könnte bei weniger eindeutiger Zeichensetzung fälschlich als weitere Bezeichnung Henochs erscheinen.
  rationale: Adam, nicht Henoch, ist in der genealogischen Folge der erste Mensch. Der Dativ „dem“ macht den Bezug im Deutschen erkennbar, ohne den Inhalt auszuweiten.
- issue: Beschaffenheit der Wildnis
  choice: „unsichtbare Wildnis“ steht im Haupttext.
  alternative: „verborgene“, „unzugängliche“ oder „öde Wildnis“
  rationale: Die geʿezische Negativform bezeichnet primär etwas, das nicht gesehen wird oder nicht sichtbar ist. Da die genaue räumliche Vorstellung offenbleibt, werden naheliegende Alternativen in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die apokalyptische Bildsprache bleibt konkret und fremdartig; erklärende Glättungen wurden vermieden. „Behemot“ folgt der im Deutschen geläufigen Namensform, „Dundayin“ der Transliteration des Ortsnamens.
