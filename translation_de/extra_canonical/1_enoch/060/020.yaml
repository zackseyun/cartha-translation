base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/020.yaml
  text: And the spirit of the dew has its dwelling at the ends of heaven[a], and it is joined with the storehouses of the rain; and its course is in winter and in summer, and its clouds and the clouds of the mist are joined together[d][c][b], and one gives to another.
translation:
  language: de
  text: Und der Geist des Taus hat seine Wohnung an den Enden des Himmels und ist mit den Vorratskammern des Regens verbunden. Sein Lauf[a] erstreckt sich über Winter und Sommer; seine Wolken und die Wolken des Nebels[b] sind miteinander verbunden, und eines gibt dem anderen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „sein Weg“ oder „sein Umlauf“. Das ge’ezische Wort kann eine Bewegung oder Route bezeichnen; die genaue Vorstellung ist hier unsicher.
    reason: lexical_alternative
  - marker: b
    text: Das mit „Nebel“ wiedergegebene Wort kann auch „Dunst“ oder „Dunstschleier“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Der Schluss kann auch im Sinn eines wechselseitigen Austauschs verstanden werden: „jedes gibt dem anderen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መንፈሰ ጠል
  choice: Geist des Taus
  rationale: መንፈስ kann Geist, Wind oder Atem bezeichnen. „Geist“ bewahrt hier die personifizierende Sprache des apokalyptischen Wetterkatalogs, ohne daraus eine spätere dogmatische Aussage zu machen.
- source_word: ማኅደሩ
  choice: seine Wohnung
  rationale: Das Wort bezeichnet hier eine Wohnung oder Behausung und wird bewusst von den anschließend genannten መዛግት, den Vorratskammern des Regens, unterschieden.
- source_word: በአጽናፈ ሰማይ
  choice: an den Enden des Himmels
  rationale: Die Formulierung erhält das antike kosmologische Bild der äußersten Grenzen des Himmels und bleibt zugleich verständlich.
- source_word: መዛግብተ ዝናም
  choice: die Vorratskammern des Regens
  rationale: Der Plural bezeichnet himmlische Speicher oder Schatzkammern für den Regen. „Vorratskammern“ ist anschaulich und unterscheidet sich klar von der zuvor genannten Wohnung.
- source_word: ምሕዋረ ዚአሃ
  choice: sein Lauf
  rationale: Das Substantiv kann Bewegung, Weg oder Umlauf bezeichnen. „Lauf“ lässt die genaue Art der Bewegung offen und passt zu einem Wetterphänomen.
- source_word: በክረምት ወበሐጋይ
  choice: über Winter und Sommer
  rationale: Die beiden Jahreszeiten werden ohne klimatologische Modernisierung wiedergegeben. „Erstreckt sich über“ macht die elliptische ge’ezische Aussage im Deutschen verständlich.
- source_word: ደመና ጊሜ
  choice: die Wolken des Nebels
  rationale: ጊሜ bezeichnet wahrscheinlich Nebel, Dunst oder trübe Luft. „Nebel“ fügt sich natürlich in das atmosphärische Bild ein, während eine Fußnote die Unsicherheit wahrt.
- source_word: ኅቡር ውእቱ
  choice: sind miteinander verbunden
  rationale: Die Aussage bezeichnet Verbindung oder Vereinigung. Die deutsche Form wahrt diese Beziehung, ohne eine physikalische Erklärung einzutragen.
- source_word: አሐዱ ለአሐዱ ይሁብ
  choice: eines gibt dem anderen
  rationale: Die wörtlich-nahe Form bewahrt die Unbestimmtheit darüber, welche der genannten Erscheinungen gibt und ob ein wechselseitiger Austausch gemeint ist.
theological_decisions:
- issue: Personifizierte oder rein meteorologische Wiedergabe von መንፈሰ
  choice: „Geist des Taus“ als personifizierte kosmische Größe
  alternative: „Wind des Taus“ oder „Atem des Taus“
  rationale: Der Zusammenhang beschreibt Naturerscheinungen als geordnete himmlische Größen mit Wohnungen und Vorratskammern. „Geist“ erhält diese apokalyptische Spannung, ohne den Ausdruck als Lehre über den Heiligen Geist zu deuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter apokalyptischer Bildsprache. Die Sätze sind zur besseren Lesbarkeit gegliedert; die altertümliche Kosmologie und die unbestimmten Beziehungen zwischen Tau, Regen und Wolken werden nicht modern erklärt oder konfessionell ausgedeutet.
