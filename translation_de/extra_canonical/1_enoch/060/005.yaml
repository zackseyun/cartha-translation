base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/005.yaml
  text: And Michael said to me[a], “Why are you troubled by such a vision? Until today the day of his mercy has lasted[c][b], and he has been merciful and slow to wrath toward those who dwell upon the dry land.”
translation:
  language: de
  text: 'Und Michael sagte zu mir: »Warum bist du über eine solche Vision beunruhigt?[a] Bis heute währt der Tag seiner Barmherzigkeit, und er ist barmherzig und fern vom Zorn gegen diejenigen, die auf dem trockenen Land wohnen.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die ge''ezische Satzkonstruktion ist schwierig. Wörtlicher etwa: »Warum bist du hinsichtlich einer solchen Vision beunruhigt?« Dabei ist »Vision« hier als Substantiv zu verstehen.'
    reason: lexical_alternative
  - marker: b
    text: Das »trockene Land« kann im Zusammenhang bedeutsam sein, da die Bewohner des Landes den Meereswesen im umgebenden Abschnitt gegenüberstehen.
    reason: cultural_note
lexical_decisions:
- source_word: ወይቤለኒ፡ ሚካኤል
  choice: Und Michael sagte zu mir
  rationale: Bewahrt die schlichte erzählerische Einleitung und gibt den Eigennamen in der üblichen deutschen Form wieder.
- source_word: ምንተ፡ ርእየ፡ ዘከመዝ፡ ተሀውከ
  choice: Warum bist du über eine solche Vision beunruhigt?
  rationale: ርእየ wird als Akkusativ des Substantivs »Vision« verstanden, nicht als Verbform »du hast gesehen«. Die schwierige Konstruktion wird in natürlichem Deutsch als Frage nach dem Grund der Beunruhigung wiedergegeben.
- source_word: እስከ፡ ዮም
  choice: Bis heute
  rationale: Gibt die zeitliche Fortdauer knapp und unmittelbar wieder.
- source_word: ሀለወት፡ ዕለተ፡ ምሕረቱ
  choice: währt der Tag seiner Barmherzigkeit
  rationale: »Währt« drückt die bis in die Gegenwart reichende Dauer aus; »Tag« und das Possessivpronomen bleiben entsprechend dem Ge'ez ausdrücklich erhalten.
- source_word: ወሀሎ፡ መሓሪ
  choice: und er ist barmherzig
  rationale: Bewahrt die Aussage über die gegenwärtige barmherzige Haltung des unausgesprochenen göttlichen Subjekts.
- source_word: ወርኁቀ፡ መዓት
  choice: und dem Zorn fern
  rationale: Folgt dem konkreten Bild der Ferne vom Zorn, ohne es vollständig in die geläufigere, aber stärker idiomatische Formel »langsam zum Zorn« aufzulösen.
- source_word: ላዕለ፡ እለ፡ የኃድሩ፡ ዲበ፡ የብስ
  choice: gegenüber denen, die auf dem trockenen Land wohnen
  rationale: Bewahrt sowohl die relationale Bedeutung als auch die gegenüber »Erde« spezifischere Bezeichnung des trockenen Landes, die im Kontext des Gegensatzes zum Meer bedeutsam sein kann.
theological_decisions:
- issue: Bezug des Pronomens in »seiner Barmherzigkeit«
  choice: Das Pronomen bleibt erhalten und bezieht sich im Zusammenhang auf Gott, obwohl Gott in diesem Vers nicht erneut genannt wird.
  alternative: 'Unpersönlich: »der Tag der Barmherzigkeit«'
  rationale: Das Ge'ez enthält die possessive Bestimmung. Ihre Beibehaltung wahrt den theologischen Zusammenhang von göttlicher Barmherzigkeit, zurückgehaltenem Zorn und künftigem Gericht, ohne den impliziten Bezug durch einen ausdrücklich eingesetzten Gottesnamen zu überdeuten.
- issue: Verhältnis von Barmherzigkeit und Zorn
  choice: »barmherzig und dem Zorn fern«
  alternative: »barmherzig und langsam zum Zorn« oder »hält seinen Zorn zurück«
  rationale: Die Übersetzung bewahrt das räumliche Bild des Ausgangstextes und lässt offen, ob vor allem Gottes Wesenshaltung oder der zeitliche Aufschub des Gerichts betont wird.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Ton. »Währt« ist bewusst leicht gehoben, aber geläufig; die ungewöhnliche Wendung »dem Zorn fern« erhält das Bild des Ge'ez. Sämtliche Fußnotenmarker stehen im Haupttext.
