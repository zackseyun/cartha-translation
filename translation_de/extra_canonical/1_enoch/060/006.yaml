base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/006.yaml
  text: And when the day and the power and the punishment and the judgment come, which the Lord of Spirits has prepared for those who do not bow down to the righteous law, and for those who deny the righteous judgment, and for those who take his name in vain—that day has been prepared for the chosen as a covenant, and for sinners as an inquiry.
translation:
  language: de
  text: Und wenn der Tag, die Macht, die Strafe und das Gericht kommen, das der Herr der Geister für jene bereitet hat, die sich nicht vor dem Herrn der Gerechtigkeit niederwerfen, die den Herrn der Gerechtigkeit verleugnen und die seinen Namen missbrauchen – jener Tag ist für die Erwählten als Bund bereitet, für die Sünder aber als Prüfung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann das letzte Wort auch „Untersuchung“, „Befragung“ oder „genaue Nachforschung“ bedeuten.
    reason: Die Bedeutungsbreite von ሐተታ፡ lässt sich mit einem einzigen deutschen Wort nicht vollständig abbilden.
lexical_decisions:
- source_word: እግዚአ፡ መንፈሳት፡ (ʾəgziʾa manāfəst)
  choice: Herr der Geister
  rationale: Die etablierte, formal genaue Wiedergabe des äthiopischen Titels bleibt erhalten.
- source_word: እግዚ፡ ጽድቅ፡ (ʾəgzi ṣədq)
  choice: Herr der Gerechtigkeit
  rationale: Der überlieferte Text verwendet in beiden Teilsätzen dieselbe Wendung. Die Wiedergabe als Personentitel bewahrt diese Wiederholung, statt sie einmal als „gerechtes Gesetz“ und einmal als „gerechtes Gericht“ unterschiedlich auszudeuten.
- source_word: ይሰግዱ፡ (yəsaggədu)
  choice: sich … niederwerfen
  rationale: Das Verb bezeichnet eine körperliche Huldigung oder Anbetung; „sich niederwerfen“ bildet das konkrete Bild ab.
- source_word: ይነሥኡ፡ ስሞ፡ በከ፡ (yənəśʾu səmo ba-kā)
  choice: seinen Namen missbrauchen
  rationale: Die idiomatische deutsche Formulierung gibt das vergebliche beziehungsweise unwürdige Führen seines Namens natürlich wieder.
- source_word: መሐላ፡ (maḥālā)
  choice: Bund
  rationale: Das Substantiv kann einen Eid beziehungsweise einen eidlich bekräftigten Bund bezeichnen; „Bund“ entspricht dem kontrastierenden Heilsbezug auf die Erwählten.
- source_word: ሐተታ፡ (ḥatatā)
  choice: Prüfung
  rationale: Das Wort bezeichnet Untersuchung, Befragung oder genaue Prüfung. „Prüfung“ ist im Deutschen verständlich und bewahrt den gerichtlichen Ernst, ohne bereits ausdrücklich „Verdammnis“ zu sagen.
theological_decisions:
- issue: Identität von እግዚ፡ ጽድቅ፡ in den beiden parallelen Aussagen
  choice: Beide Vorkommen einheitlich als „Herr der Gerechtigkeit“ wiedergeben.
  alternative: Das erste als „gerechtes Gesetz“, das zweite als „gerechtes Gericht“ wiedergeben.
  rationale: Im vorliegenden äthiopischen Text steht beide Male dieselbe Wortgruppe. Eine unterschiedliche abstrakte Wiedergabe würde eine Auslegung in den Haupttext eintragen und die auffällige Parallelität verdecken.
- issue: Bedeutung der für die Sünder bereiteten ሐተታ፡
  choice: Prüfung
  alternative: Untersuchung; Verhör; Rechenschaftsforderung
  rationale: Die Übersetzung lässt offen, welche genaue gerichtliche Form diese Prüfung annimmt, und vermeidet eine konfessionell oder dogmatisch überbestimmte Zuspitzung.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die lange Satzperiode und die viergliedrige Gerichtsformel bleiben erhalten; ein Gedankenstrich gliedert den Satz für heutige Leser. Die wiederholte Quellformulierung „Herr der Gerechtigkeit“ wird bewusst nicht harmonisierend in zwei verschiedene Abstrakta aufgelöst.
