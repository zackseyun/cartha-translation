base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/019.yaml
  text: And the spirit of the mist is not joined with them in their storehouses[a], but its own storehouse is by itself; for its course is glorious in it, both in light and in darkness, and in winter and in summer[c][b], and its storehouse is an angel.
translation:
  language: de
  text: Und der Geist des Nebels ist nicht mit ihnen in ihren Vorratskammern verbunden, sondern seine Vorratskammer ist für sich allein; denn sein Lauf darin ist herrlich, im Licht wie in der Finsternis, im Winter wie im Sommer.[a] Und seine Vorratskammer ist ein Engel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die überlieferte Form des letzten Jahreszeitenwortes ist unsicher; wahrscheinlich ist „Sommer“ gemeint, das übliche Gegenstück zu „Winter“.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich lautet der schwierige Schlusssatz: „Seine Vorratskammer ist ein Engel.“ Gemeint sein könnte, dass ein Engel mit der Vorratskammer gleichgesetzt wird oder als ihr eingesetzter Verwalter dasteht; der Text sagt jedoch nicht ausdrücklich, dass er sie lediglich bewacht.'
    reason: textual_difficulty
lexical_decisions:
- source_word: መንፈሰ፡ ጊሜ
  choice: der Geist des Nebels
  rationale: መንፈስ kann Geist, Wind oder Hauch bedeuten; der kosmisch-personifizierende Zusammenhang spricht für „Geist“. ጊሜ bezeichnet hier Nebel beziehungsweise Dunst, nicht das Meer.
- source_word: ኢይትኃበር፡ ምስሌሆሙ፡ ውስተ፡ መዛግብቲሆሙ
  choice: wird ihnen in ihren Vorratskammern nicht zugesellt
  rationale: Die Formulierung bewahrt sowohl den Gedanken des Verbindens oder Zuordnens als auch die ausdrücklich genannte Ortsangabe „in ihren Vorratskammern“.
- source_word: መዝገበ፡ ቦቱ፡ ባሕቲቱ
  choice: hat eine eigene Vorratskammer für sich
  rationale: Die Wiedergabe bringt die durch ባሕቲቱ betonte Absonderung zum Ausdruck. „Vorratskammer“ wahrt das konkrete apokalyptische Bild kosmischer Speicher.
- source_word: ምሕዋረ፡ ዚአሁ፡ ስብሐት፡ ቦ
  choice: sein Lauf darin ist herrlich
  rationale: „Lauf“ gibt die geordnete Bewegung des kosmischen Phänomens wieder; „darin“ berücksichtigt den lokativen Gehalt von ቦ, und „herrlich“ bewahrt den Sinn von Glanz beziehungsweise Herrlichkeit.
- source_word: በብርሃን፡ ወበጽልመት፡ ወበክረምት፡ ወበንጋይ
  choice: im Licht wie in der Finsternis, im Winter wie im Sommer
  rationale: Die parallele deutsche Fügung bildet die vier Bedingungen natürlich ab. Das überlieferte ንጋይ gilt wahrscheinlich als fehlerhafte Lesung beziehungsweise Transkription von ሐጋይ „Sommer“, dem üblichen Gegenstück zu „Winter“.
- source_word: መዝገበ፡ ዚአሃ፡ መልአክ፡ ውእቱ
  choice: seine Vorratskammer ist ein Engel
  rationale: Die direkte, wenn auch ungewöhnliche Aussage entspricht der naheliegenden Syntax. Eine Glättung zu „wird von einem Engel bewacht“ hätte keine ausdrückliche Grundlage im Wortlaut.
theological_decisions:
- issue: Personifizierung des Nebels
  choice: „Geist des Nebels“ als kosmisch-personifizierte Wirklichkeit beibehalten
  alternative: „Nebelwind“ oder „Kraft des Nebels“
  rationale: Die apokalyptische Darstellung verbindet Naturerscheinungen mit kosmischen Vorratskammern und Engeln. Eine rein meteorologische Umschreibung würde diese Spannung einebnen.
- issue: Identifizierung der Vorratskammer mit einem Engel
  choice: Die direkte Aussage „seine Vorratskammer ist ein Engel“ im Haupttext bewahren
  alternative: „Ein Engel wacht über seine Vorratskammer“
  rationale: Der Ausgangstext ist an dieser Stelle auffällig, identifiziert aber nach seiner naheliegenden Syntax die Vorratskammer mit einem Engel. Die Fußnote kennzeichnet die Schwierigkeit, ohne sie konfessionell oder spekulativ aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener apokalyptischer Bildsprache. „Vorratskammer“ ist konkreter und allgemeinverständlicher als „Schatzkammer“ oder „Depot“. Die ungewöhnliche Schlussaussage bleibt stehen und wird nicht harmonisierend paraphrasiert.
