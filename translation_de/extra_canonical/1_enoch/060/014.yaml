base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/014.yaml
  text: For resting places have been given to the thunder with patience for the sound of its voice[a]; and the thunder and the lightning are not separated, and though they are not one[d][c][b], by the Spirit the two of them go together and are not separated.
translation:
  language: de
  text: Denn dem Donner sind Ruhestätten gegeben worden, in Geduld für den Klang seiner Stimme[a]. Donner und Blitz werden nicht voneinander getrennt. Obwohl sie nicht eins sind[b], gehen beide durch den Geist[c] zusammen und werden nicht voneinander getrennt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Langmut“ beziehungsweise „in Geduld“. Die Wendung ist in diesem Zusammenhang schwer verständlich und könnte die geordnete Zurückhaltung des Donnerklangs beschreiben.'
    reason: lexical_alternative
  - marker: b
    text: Die zugrunde liegende Lesart ist textlich unsicher. Gemeint scheint zu sein, dass Donner und Blitz verschieden bleiben, aber zusammen gehen und nicht voneinander getrennt werden.
    reason: textual_variant
  - marker: c
    text: Das hier mit „Geist“ wiedergegebene Wort kann auch „Atem“ oder „Wind“ bedeuten. Daher bleibt offen, ob eine geistige oder göttliche Wirksamkeit, Atem oder Wind gemeint ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: Denn
  rationale: Bewahrt die begründende Verknüpfung mit dem vorausgehenden Zusammenhang.
- source_word: ለነጐድጓድ ምዕረፋተ ... ተውህበ
  choice: dem Donner sind Ruheplätze gegeben
  rationale: Gibt den Dativ und das passive Verb wieder; der Plural von ምዕረፋተ wird als „Ruheplätze“ erhalten.
- source_word: በትዕግሥት
  choice: mit Geduld
  rationale: Die schwierige Präpositionalfügung wird bewusst eng am Wortlaut wiedergegeben, ohne ihre Funktion eindeutig festzulegen.
- source_word: ለቃለ ዚአሁ
  choice: für den Klang seiner Stimme
  rationale: „Klang“ passt zum Donner, während „seiner Stimme“ die personifizierende Bildsprache bewahrt.
- source_word: ወኢይትሌለዩ
  choice: werden nicht voneinander getrennt
  rationale: Die passive beziehungsweise mediale Aussage und ihre Wiederholung am Versende bleiben erkennbar.
- source_word: እነጐድጓድ ወእመብረቅ
  choice: Donner und Blitz
  rationale: Natürliche deutsche Bezeichnung des kosmologischen Paars.
- source_word: ወእም፪ኒ
  choice: Obwohl sie nicht eins sind
  rationale: Gibt den wahrscheinlichen Gegensatz zwischen Verschiedenheit und untrennbarem Zusammengehen wieder, kennzeichnet die Textunsicherheit jedoch in einer Fußnote.
- source_word: በመንፈስ
  choice: durch den Geist
  rationale: Erhält die Möglichkeit göttlichen Wirkens, ohne die ebenfalls möglichen Bedeutungen „Geist“, „Atem“ oder „Wind“ im Haupttext festzuschreiben.
- source_word: ክልኤሆሙ የሐውሩ
  choice: gehen die beiden gemeinsam
  rationale: Bewahrt die ausdrückliche Zweiheit und formuliert ihre koordinierte Bewegung in natürlichem Deutsch.
theological_decisions:
- issue: Bedeutung von በመንፈስ in der kosmologischen Aussage
  choice: durch den Geist
  alternative: durch Geist, Atem oder Wind
  rationale: Die Wiedergabe lässt eine göttliche ordnende Wirksamkeit zu, erklärt sie aber nicht zur einzig möglichen Deutung; die semantische Offenheit wird in der Fußnote bewahrt.
- issue: Verhältnis von Donner und Blitz
  choice: verschieden, aber nicht voneinander getrennt
  alternative: zwei Erscheinungsformen einer Einheit
  rationale: Der schwierige Text scheint ihre Zweiheit und ihr untrennbares Zusammengehen zugleich auszusagen. Diese Spannung wird nicht systematisch aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht erhobenem apokalyptischem Ton. Die fremdartige Wendung „mit Geduld für den Klang seiner Stimme“ bleibt wegen der Unsicherheit des ge'ezischen Textes bewusst erhalten; die Satzgliederung verbessert lediglich die Lesbarkeit.
