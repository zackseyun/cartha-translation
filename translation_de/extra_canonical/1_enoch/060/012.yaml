  to: Und die Schatzkammern der Geister[a], und wie die Geister eingeteilt werden und wie sie abgewogen werden[b], und wie die Tore der Geister gezählt werden, jedes von ihnen nach der Kraft des Geistes, und ihre Kräfte für das Licht des Mondes, und nach der Kraft der Gerechtigkeit, und die Einteilungen der Sterne nach ihren Namen – jeder Anteil wird zugeteilt.
