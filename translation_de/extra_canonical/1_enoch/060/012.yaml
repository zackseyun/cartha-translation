base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/012.yaml
  text: And the treasuries of the spirits[a], and how the spirits are divided, and how they are weighed out, and the portals of the spirits are reckoned, each according to the power of the spirit, and their powers for the light of the moon, and according to the power of righteousness[c][b], and the divisions of the stars by their names—every division shall be apportioned.
translation:
  language: de
  text: Und die Schatzkammern der Geister[a], und wie die Geister eingeteilt werden und wie sie abgewogen werden[b], und wie die Tore der Geister gezählt werden, jedes von ihnen nach der Kraft des Geistes, und ihre Kräfte für das Licht des Mondes, und nach der Kraft der Gerechtigkeit, und die Einteilungen der Sterne nach ihren Namen – jeder Anteil wird zugeteilt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Geister“ kann auch „Winde“ bedeuten. Das ge'ezische Wort umfasst beide Bedeutungen; möglicherweise lässt der Vers kosmische Mächte und atmosphärische Kräfte bewusst ineinander übergehen.
    reason: lexical_alternative
  - marker: b
    text: Mehrere Satzverbindungen und Verbformen dieses nur ge'ezisch überlieferten Abschnitts sind sprachlich schwierig. „Abgewogen“ kann allgemeiner „bemessen“ oder „geordnet“, „gezählt“ auch „berechnet“ bedeuten.
    reason: textual_variant
lexical_decisions:
- source_word: መዛግብተ
  choice: Schatzkammern
  rationale: Das Wort bezeichnet Orte oder Vorräte des Aufbewahrten. „Schatzkammern“ bewahrt den erhabenen kosmischen Bildbereich.
- source_word: መንፈሳት
  choice: Geister
  rationale: Das ge'ezische Wort kann Geister, Winde oder Atemzüge bezeichnen. „Geister“ wahrt hier die apokalyptische Mehrdeutigkeit.
- source_word: አፎ
  choice: wie
  rationale: In der Folge ወአፎ leitet das Wort indirekte Fragen ein; es bedeutet hier „und wie“, nicht „Wolken“.
- source_word: ይትካፈሉ
  choice: eingeteilt werden
  rationale: Die Form bezeichnet eine geordnete Teilung beziehungsweise Zuweisung.
- source_word: ይደሉ
  choice: abgewogen werden
  rationale: Das schwierige Verb verweist wohl auf genaues Bemessen oder Ordnen; „abgewogen“ erhält das Bild geregelter kosmischer Zuteilung.
- source_word: ይኄለቁ
  choice: gezählt werden
  rationale: Das Verb trägt den Sinn des Zählens oder Berechnens; „gezählt“ ist im modernen Deutsch klar und textnah.
- source_word: አናቅፅ
  choice: Tore
  rationale: Der Plural bezeichnet Tore oder Portale und gehört zum kosmologischen Wortfeld Henochs.
- source_word: በበኀይለ መንፈስ
  choice: jedes nach der Kraft des Geistes
  rationale: Die distributive Bildung በበ wird mit „jedes nach“ wiedergegeben; „Geist“ erhält zugleich die mögliche Nebenbedeutung „Wind“.
- source_word: ለብርሃነ ወርኅ
  choice: für das Licht des Mondes
  rationale: Die formnahe Wendung bewahrt das kosmische Bild und den Zweck- beziehungsweise Bezugscharakter der Präposition.
- source_word: ኀይለ ጽድቅ
  choice: Kraft der Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt die ethische und theologische Bedeutung von ጽድቅ, ohne den kosmischen Ordnungsaspekt auf eine rein juristische Bedeutung zu verengen.
- source_word: ክፍላተ ከዋክብት
  choice: Einteilungen der Sterne
  rationale: Die Wendung bezeichnet die geordneten Abteilungen oder Zuweisungen der Sterne und nimmt das Leitmotiv des Teilens auf.
- source_word: በበ ስሞሙ
  choice: nach ihren Namen
  rationale: Die Wendung beschreibt eine Zuordnung beziehungsweise Klassifizierung anhand der Namen.
theological_decisions:
- issue: Ob መንፈሳት meteorologisch als „Winde“ oder numinos als „Geister“ wiederzugeben ist
  choice: Geister
  alternative: Winde; Atemzüge
  rationale: „Geister“ lässt die für den apokalyptischen Zusammenhang charakteristische Spannung zwischen himmlischen Mächten und Naturkräften bestehen.
- issue: Ob ጽድቅ hier „Gerechtigkeit“ oder enger „Recht“ bedeutet
  choice: Gerechtigkeit
  alternative: Recht; Rechtschaffenheit
  rationale: Im Zusammenhang kosmischer Ordnung trägt „Gerechtigkeit“ die ethisch-theologische Resonanz, ohne die Vorstellung gerechter Ordnung auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener aufzählender Satzstruktur. Die wiederholten Koordinationen spiegeln den visionär-katalogartigen Stil der Vorlage; unnatürlich altertümliche Wörter wurden vermieden.
