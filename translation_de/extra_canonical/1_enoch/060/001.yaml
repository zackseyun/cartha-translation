base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/001.yaml
  text: In the five-hundredth year, in the seventh month, on the fourteenth day of the month, in the life of Henok, in that parable I saw that the heaven of heavens was shaken with a great shaking, and the host of the Most High, and the angels, thousands of thousands and ten thousand times ten thousand, were stirred in a great turmoil.
translation:
  language: de
  text: Im fünfhundertsten Jahr, im siebten Monat, am vierzehnten Tag des Monats, zu Lebzeiten Henochs, sah ich in jenem Gleichnis, dass der Himmel der Himmel[a] von einem großen Beben erschüttert wurde[c] und dass das Heer des Höchsten[b] und die Engel – Tausende von Tausenden und zehntausendmal Zehntausende – in große Unruhe gerieten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der höchste Himmel“. Im Geez steht wörtlich „der Himmel der Himmel“, eine superlativische Wendung für den höchsten himmlischen Bereich.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung kann auch abstrakter als „die Macht des Höchsten“ verstanden werden. Die unmittelbar folgende Erwähnung unzähliger Engel spricht jedoch dafür, dass hier das himmlische Heer gemeint ist.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „heftig erschüttert wurde“. Die Wiedergabe im Haupttext erhält die verstärkende Verbindung von „erschüttern“ und „Beben“.'
    reason: previous_rendering
lexical_decisions:
- source_word: በዓመት ፭ምእት
  choice: im fünfhundertsten Jahr
  rationale: Gibt die zeitliche Einordnung als Ordnungszahl natürlich und genau wieder.
- source_word: በወርኅ ሳብዕ ... አመ ዐሡሩ ወረቡዑ ለወርኅ
  choice: im siebten Monat, am vierzehnten Tag des Monats
  rationale: Bewahrt die vollständige Datumsangabe des geezischen Textes in idiomatischem Deutsch.
- source_word: በሕይወተ ሄኖክ
  choice: zu Lebzeiten Henochs
  rationale: Gibt die wörtliche Beziehung auf Henochs Leben in natürlichem, würdevollem Deutsch wieder.
- source_word: በውእቱ አምሳል
  choice: in jenem Gleichnis
  rationale: „Gleichnis“ wahrt den für diesen Buchteil charakteristischen Ausdruck, ohne ihn vorschnell zu „Vision“ zu verallgemeinern.
- source_word: ሰማየ ሰማያት
  choice: der Himmel der Himmel
  rationale: Die markante superlativische Himmelsformel bleibt erhalten; die glattere Deutung „der höchste Himmel“ steht in der Fußnote.
- source_word: ታድለቀልቅ ... ይልቅልቅ ዐቢይ
  choice: von einem großen Beben erschüttert wurde
  rationale: Bewahrt sowohl die Intensität als auch die rhetorische Verbindung von Erschüttern und Beben, ohne im Deutschen unverständlich zu wirken.
- source_word: ኀይሉ ልዑል
  choice: das Heer des Höchsten
  rationale: Der anschließende Hinweis auf unzählige Engel spricht im Kontext für eine himmlische Heerschar; die abstrakte Lesart „Macht“ bleibt als Alternative vermerkt.
- source_word: መላእክት አእላፈ አእላፍ ወትእልፊተ ትእልፊት
  choice: die Engel – Tausende von Tausenden und zehntausendmal Zehntausende
  rationale: Erhält die zahlenmäßige Steigerung und die wiederholende apokalyptische Rhetorik des Ausgangstextes.
- source_word: ትሀውኩ ሁከተ ዐቢየ
  choice: in große Unruhe gerieten
  rationale: Gibt die heftige Bewegung und den Tumult klar und natürlich wieder, ohne die Art der Unruhe unnötig festzulegen.
theological_decisions:
- issue: Ob ኀይሉ ልዑል eine abstrakte göttliche Macht oder das himmlische Heer des Höchsten bezeichnet
  choice: das Heer des Höchsten
  alternative: die Macht des Höchsten
  rationale: Die unmittelbar folgende Nennung unzähliger Engel begünstigt die kollektive Bedeutung „Heer“, doch die lexikalisch mögliche abstrakte Lesart wird nicht verschwiegen.
- issue: Wie wörtlich die Wendung ሰማየ ሰማያት wiederzugeben ist
  choice: der Himmel der Himmel
  alternative: der höchste Himmel
  rationale: Die wörtlichere Form bewahrt die kosmische und theologische Bildsprache; die superlativische Deutung wird in der Fußnote erläutert.
translation_notes:
  register: Modernes Standarddeutsch in würdevollem apokalyptischem Erzählton. Die Datumsformel bleibt feierlich, während „zu Lebzeiten“ und „in große Unruhe gerieten“ natürlich verständlich sind. Markante Ausgangsidiome wie „Himmel der Himmel“ und die wiederholte Zahlenformel werden bewusst nicht geglättet.
