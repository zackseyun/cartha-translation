base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/007.yaml
  text: 'And on that day the two monsters were separated[a]: a female monster whose name is Lewyatan, to dwell in the abyss of the sea[d][c][b], above the springs of the waters.'
translation:
  language: de
  text: 'Und an jenem Tag wurden die beiden Ungeheuer voneinander getrennt[a]: ein weibliches Ungeheuer namens Lewajatan, damit es in der Tiefe des Meeres[b], oberhalb der Quellen der Wasser[c], wohne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das zugrunde liegende Verb steht im Perfekt: Die Trennung wird als vollzogenes Geschehen dargestellt.'
    reason: grammatical_note
  - marker: b
    text: 'Auch möglich: „im Abgrund des Meeres“; das geʿezische Wort bezeichnet einen tiefen oder abgründigen Bereich.'
    reason: lexical_alternative
  - marker: c
    text: Die „Quellen der Wasser“ gehören zur antiken kosmologischen Bildwelt des Textes. Der Ausdruck ist nicht als moderne geografische Beschreibung zu verstehen.
    reason: cultural_note
lexical_decisions:
- source_word: ተካፈሉ
  choice: wurden voneinander getrennt
  rationale: Das geʿezische Perfekt in der 3. Person Plural bezeichnet hier eine bereits vollzogene Trennung; die passive deutsche Form bewahrt den Sinn von Teilen bzw. Absondern.
- source_word: በይእቲ ዕለት
  choice: an jenem Tag
  rationale: Natürliche deutsche Wiedergabe der apokalyptischen Zeitformel mit würdigem Erzählton.
- source_word: ክልኤቱ ዐናብርት
  choice: die beiden Ungeheuer
  rationale: „Ungeheuer“ bewahrt Größe, Fremdartigkeit und mythisch-apokalyptischen Charakter besser als das allgemeinere „Tiere“ oder „Geschöpfe“.
- source_word: ዐንበሪ አንስትያዊት
  choice: ein weibliches Ungeheuer
  rationale: Die Formulierung gibt sowohl das Geschöpf als auch dessen ausdrücklich bezeichnetes Geschlecht wieder.
- source_word: ዘስማ ሌዋያታን
  choice: namens Lewajatan
  rationale: Der Name wird in einer der geʿezischen Lautgestalt nahen, zugleich deutsch lesbaren Form transliteriert.
- source_word: ከመ ትኅድር
  choice: damit es … wohne
  rationale: Der Final- bzw. Bestimmungssinn wird ausdrücklich bewahrt; der Konjunktiv passt zum gehobenen, visionären Register.
- source_word: በልጕተ ባሕር
  choice: in der Tiefe des Meeres
  rationale: „Tiefe“ gibt den tiefen oder abgründigen Meeresbereich wieder, ohne die mögliche Bedeutung vorschnell auf einen technisch-theologischen „Abgrund“ festzulegen.
- source_word: መልዕልተ አነቅዕተ ማያት
  choice: oberhalb der Quellen der Wasser
  rationale: Die räumliche Beziehung und das alte kosmologische Bild von Wasserquellen werden möglichst formal erhalten.
theological_decisions:
- issue: Bezeichnung der mythischen Geschöpfe
  choice: Ungeheuer
  alternative: Tiere; Geschöpfe
  rationale: Die außergewöhnliche kosmische Dimension bleibt sichtbar, ohne die Gestalten allegorisch oder dogmatisch umzudeuten.
- issue: Zeitbezug der Trennung
  choice: wurden … getrennt
  alternative: werden … getrennt werden
  rationale: Das geʿezische Perfekt spricht für ein vergangenes, vollzogenes Geschehen; eine futurische Wiedergabe würde die zeitliche Spannung des Textes verändern.
- issue: Wiedergabe des Namens
  choice: Lewajatan
  alternative: Leviatan
  rationale: Die Hauptfassung folgt der überlieferten Namensform möglichst eng; die geläufige deutsche Form wird in einer Fußnote genannt.
- issue: Kosmologische Ortsangabe
  choice: oberhalb der Quellen der Wasser
  alternative: über den Ursprüngen der Wasser
  rationale: Die konkrete antike Bildwelt bleibt stehen und wird nicht in moderne geografische Kategorien aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht gehobenem apokalyptischem Ton. Die Satzstruktur bleibt nah am Geʿez, wird aber durch „damit … wohne“ im Deutschen grammatisch klar. Sämtliche Fußnotenmarker erscheinen im Haupttext.
