base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/060/018.yaml
  text: And the spirit of the hail departed by the force of his might[a], and its spirit is by itself; and what goes up from it is like smoke[f][e][d][c][b], and its name is Frost.
translation:
  language: de
  text: Und der Geist des Hagels ging durch die Kraft seiner Macht aus, und sein Geist ist für sich allein[a]; was aus ihm aufsteigt, ist wie Rauch, und sein Name ist Reif[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die ge’ezische Zeile ist schwierig. Möglich ist auch: „und der Geist in ihm ist für sich allein“ oder „ist abgesondert“.'
    reason: Bewahrt die syntaktische und lexikalische Mehrdeutigkeit von ቦቱ ባሕቲቱ.
  - marker: b
    text: Die Schlusswendung kann auf das aufsteigende Gebilde bezogen werden; wegen der personifizierenden Ausdrucksweise ist auch die Wiedergabe „dessen Name ist Reif“ möglich. In abweichender Deutung wird der Name als „Tau“ verstanden.
    reason: Kennzeichnet die Unsicherheit beim Bezug des Pronomens und bei der überlieferten Deutung des Namens.
lexical_decisions:
- source_word: መንፈሰ
  choice: Geist
  rationale: Bewahrt die personifizierte kosmische Wirkkraft des apokalyptischen Zusammenhangs, ohne sie zu einem bloßen Wettervorgang zu verflachen.
- source_word: ሐመዳ
  choice: Hagel
  rationale: Bezeichnet hier am ehesten das konkrete meteorologische Phänomen Hagel; „Frost“ oder „Eis“ wären weniger spezifisch.
- source_word: ሐደገ
  choice: ging … aus
  rationale: Gibt die Bewegungs- und Hervortretensvorstellung des Verbs wieder, ohne zwischen Ursprung, Aussendung und Fortgang endgültig zu entscheiden.
- source_word: በእንተ ኃይለ ዚአሁ
  choice: durch die Kraft seiner Macht
  rationale: Erhält die verdichtete, doppelte Kraftsprache und lässt den Bezug des maskulinen Pronomens offen.
- source_word: መንፈሰ ቦቱ ባሕቲቱ
  choice: sein Geist ist für sich allein
  rationale: „Für sich allein“ entspricht dem konkreten Sinn von ባሕቲቱ besser als das abstraktere „unterschieden“; die knappe, schwierige Konstruktion bleibt erkennbar.
- source_word: ዘየዐርግ እምኔሁ
  choice: was aus ihm aufsteigt
  rationale: Bewahrt die Aufwärtsbewegung und die im Ge’ez nicht eindeutig aufgelöste pronominale Bezugnahme.
- source_word: ከመ ጢስ
  choice: wie Rauch
  rationale: Gibt das anschauliche Gleichnis unmittelbar wieder; „Dampf“ wäre eine meteorologisierende Abschwächung.
- source_word: ስሙ ደይክ
  choice: sein Name ist Reif
  rationale: Behält die Namensformel und die Personifizierung bei. „Reif“ ist im Deutschen die natürliche Bezeichnung für Frostniederschlag und passt zur kosmisch-meteorologischen Aufzählung.
theological_decisions:
- issue: Personifizierung meteorologischer Kräfte
  choice: Die Rede von „Geist“ und der Namensgebung bleibt erhalten.
  alternative: Die Ausdrücke als unpersönlichen Wind oder gewöhnlichen Wettervorgang wiedergeben.
  rationale: Der Abschnitt stellt kosmische und meteorologische Erscheinungen als geordnete Wirkmächte dar. Eine Entpersonalisierung würde die apokalyptische Vorstellungswelt des Textes modernisierend glätten.
- issue: Bezug der Pronomen
  choice: Die maskuline Form „sein/ihm“ wird beibehalten.
  alternative: Mit „sein“ im sächlichen Sinn beziehungsweise „daraus“ ausdrücklich auf den Hagel oder das aufsteigende Phänomen beziehen.
  rationale: Die ge’ezische Form lässt den Bezug zwischen dem personifizierten Geist, dem Hagel und dem aufsteigenden Phänomen nicht überall eindeutig erkennen; die Übersetzung entscheidet diese Spannung nicht stillschweigend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener apokalyptischer Personifizierung. Die Satzfügung bleibt quellennah und leicht fremdartig, weil auch der ge’ezische Wortlaut syntaktisch schwierig ist; unnötig altertümliche Wörter werden vermieden.
