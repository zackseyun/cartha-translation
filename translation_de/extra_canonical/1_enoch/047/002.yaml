base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/002.yaml
  text: In those days the holy ones who dwell in the heights of heaven shall unite with one voice[a], and they shall plead and pray and praise and give thanks and bless the name of the Lord of Spirits, on account of the blood of the righteous that has been poured out, and that the prayer of the righteous may not be in vain before the Lord of Spirits, that judgment may be executed for them[d][c][b], and that patience may not be theirs forever.
translation:
  language: de
  text: In jenen Tagen werden sich die Heiligen, die in den Höhen des Himmels wohnen, mit einer Stimme vereinen[a]. Sie werden flehen und beten, loben und danken und den Namen des Herrn der Geister segnen wegen des Blutes der Gerechten, das vergossen worden ist, und damit das Gebet der Gerechten vor dem Herrn der Geister nicht vergeblich sei[b], damit für sie Gericht vollzogen werde[c] und sie nicht für immer Geduld haben müssen[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die heiligen Wesen“. Weil sie als Bewohner der Himmelshöhen beschrieben werden, bleibt offen, ob Engel, die himmlischen Gerechten oder beide gemeint sind.'
    reason: lexical_alternative
  - marker: b
    text: Die zugrunde liegende äthiopische Verbform ist unsicher. Gemeint ist im Zusammenhang wahrscheinlich, dass das Gebet der Gerechten nicht unbeantwortet oder wirkungslos bleiben soll.
    reason: textual_variant
  - marker: c
    text: 'Oder: „damit ihnen Recht verschafft werde“. Der Ausdruck kann sowohl das richterliche Urteil als auch die zugunsten der Gerechten ausgeübte Gerechtigkeit bezeichnen.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlicher: „und Geduld soll ihnen nicht für immer zuteilsein“. Gemeint ist wohl, dass die Gerechten nicht für immer auf Gottes Eingreifen warten müssen.'
    reason: translation_clarity
lexical_decisions:
- source_word: የኃብሩ
  choice: werden sich … vereinen
  rationale: Das Verb bezeichnet ein Zusammenkommen oder Sichverbinden; zusammen mit በ፩ቃል bringt „sich vereinen“ sowohl die gemeinsame Handlung als auch die Einmütigkeit zum Ausdruck.
- source_word: ቅዱሳን
  choice: die Heiligen
  rationale: Die substantivierte Bezeichnung wahrt den apokalyptischen Sprachgebrauch, ohne die Wesen ausdrücklich als Engel oder als verherrlichte Menschen festzulegen.
- source_word: በመልዕልተ ሰማያት
  choice: in den Höhen des Himmels
  rationale: Die räumliche Bildsprache des erhabenen himmlischen Bereichs bleibt erhalten, ohne eine bestimmte Kosmologie vorauszusetzen.
- source_word: በ፩ቃል
  choice: mit einer Stimme
  rationale: Die Wendung bedeutet wörtlich „mit einem Wort/einer Stimme“ und bezeichnet hier am natürlichsten das einmütige gemeinsame Reden.
- source_word: ያስተበቍዑ … ይጼልዩ
  choice: flehen und beten
  rationale: Die beiden Verben werden getrennt wiedergegeben, um die absichtliche Häufung verwandter Gebetsausdrücke zu bewahren.
- source_word: ይሴብሑ … የአኵቱ … ይባርኩ
  choice: loben und danken und … preisen
  rationale: Die liturgische Reihung bleibt erkennbar. Beim letzten Verb ist „preisen“ im Deutschen für das Segnen des göttlichen Namens natürlicher als „segnen“, ohne den doxologischen Sinn zu verändern.
- source_word: እግዚአ መናፍስት
  choice: Herr der Geister
  rationale: Der im Gleichnisbuch wiederkehrende Hoheitstitel wird knapp und feierlich wiedergegeben.
- source_word: ኵነኔ
  choice: Gericht
  rationale: „Gericht“ erhält den richterlichen und endzeitlichen Klang; die Formulierung „für sie“ lässt zugleich die Bedeutung ihrer Rechtfertigung offen.
- source_word: ትዕግሥት
  choice: geduldig ausharren
  rationale: Die nominale Aussage über „Geduld/Ausharren“ wird in natürliches Deutsch übertragen und bezeichnet hier das fortdauernde Warten der Gerechten auf göttliches Eingreifen.
theological_decisions:
- issue: Identität der Heiligen in der Himmelsszene
  choice: „die Heiligen“ ohne nähere Identifizierung
  alternative: „die Engel“ oder „die heiligen Menschen“
  rationale: Da sie in den Höhen des Himmels wohnen, können himmlische Wesen, himmlisch aufgenommene Gerechte oder beide Gruppen gemeint sein. Die Übersetzung entscheidet dies nicht.
- issue: Aussage über das Gebet der Gerechten
  choice: „nicht vergeblich sei“
  alternative: „nicht verstumme“, „nicht aufhöre“ oder „nicht abgewiesen werde“
  rationale: Die überlieferte äthiopische Verbform ist unsicher. Im Zusammenhang geht es wahrscheinlich darum, dass das Gebet nicht wirkungslos oder unbeantwortet bleibt; die Fußnote macht die Unsicherheit sichtbar.
- issue: Gericht zugunsten der Gerechten
  choice: „damit für sie Gericht vollzogen werde“
  alternative: „damit ihnen Recht verschafft werde“
  rationale: Die gewählte Fassung bewahrt die gerichtliche Bildwelt und vermeidet es, das mehrdeutige Substantiv vollständig auf den Gedanken der Rechtverschaffung festzulegen.
- issue: Verhältnis der mit ከመ eingeleiteten Aussagen
  choice: parallele Zwecksätze mit „damit“
  alternative: eine kausale Lesart mit „weil“ beim Gebet der Gerechten
  rationale: Die Konjunktion ከመ mit den abhängigen Verbformen bezeichnet hier Zweck beziehungsweise Inhalt. Die Heiligen bitten darum, dass das Gebet nicht vergeblich bleibt, Gericht vollzogen wird und das Ausharren endet.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem apokalyptischem Klang. Die Reihung der Gebets- und Lobverben sowie der Titel „Herr der Geister“ bleiben erhalten. Unsichere Identitäten, Textformen und gerichtliche Bedeutungsnuancen werden nicht konfessionell aufgelöst.
