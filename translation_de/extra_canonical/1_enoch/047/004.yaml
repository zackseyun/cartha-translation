base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/004.yaml
  text: And the hearts of the holy ones shall be filled with joy[a], because the number of the righteous has drawn near, and the prayer of the righteous has been heard[c][b], and the blood of the righteous has been avenged before the Lord of Spirits.
translation:
  language: de
  text: Und die Herzen der Heiligen werden von Freude erfüllt sein, denn die Zahl der Gerechten ist nahe gekommen,[a] und das Gebet der Gerechten ist erhört worden, und das Blut der Gerechten ist vor dem Herrn der Geister eingefordert worden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „denn die gerichtliche Rechnung der Gerechten ist nahe gekommen“, wenn das Substantiv hier nicht zahlenmäßig, sondern in einem gerichtlichen Sinn verstanden wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Verb kann im Zusammenhang mit vergossenem Blut das Fordern von Rechenschaft und damit seine Ahndung bezeichnen; daher auch: „ist gerächt worden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ልቦሙ
  choice: die Herzen
  rationale: Bewahrt die konkrete biblische Redeweise für das innere Empfinden und Denken.
- source_word: ቅዱሳን
  choice: die Heiligen
  rationale: Gibt die heilige Gemeinschaft im apokalyptischen Zusammenhang knapp und würdig wieder.
- source_word: ትመልእ ፍሥሐ
  choice: werden mit Freude erfüllt werden
  rationale: Bewahrt das Bild des Erfülltwerdens und den Zukunftsbezug des Satzes.
- source_word: ቀርበ
  choice: ist nahe gekommen
  rationale: Gibt den perfektiven Aspekt und die apokalyptische Nähe wieder.
- source_word: ኍልቈ ለጻድቅ
  choice: die Zahl der Gerechten
  rationale: Die Grundbedeutung ist Zahl beziehungsweise Zählung; eine gerichtliche Bedeutung bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: ጻድቅ / ጻድቃን
  choice: die Gerechten
  rationale: Entspricht dem etablierten biblisch-apokalyptischen Schlüsselbegriff und hält Singular- und Pluralformen kollektiv zusammen.
- source_word: ጸሎቶሙ ተሰምዐ
  choice: das Gebet der Gerechten ist erhört worden
  rationale: Bewahrt den kollektiven Singular des Gebets und gibt das Hören im Deutschen idiomatisch als Erhören wieder.
- source_word: ደሙ ለጻድቅ
  choice: das Blut der Gerechten
  rationale: Der Kontext legt eine kollektive Deutung nahe, ohne einen einzelnen Märtyrer einzuführen.
- source_word: ተፈቅደ
  choice: ist eingefordert worden
  rationale: Der passive Verbstamm bezeichnet hier, dass nach dem vergossenen Blut verlangt und dafür Rechenschaft gefordert wird. Diese Fassung bewahrt den gerichtlichen Sinn, ohne die ausdrücklichere Deutung „gerächt“ in den Haupttext zu setzen.
- source_word: እግዚአ መናፍስት
  choice: der Herr der Geister
  rationale: Bewahrt den charakteristischen henochischen Gottestitel.
theological_decisions:
- issue: Bedeutung der nahenden Zahl der Gerechten
  choice: Die Zahl beziehungsweise festgesetzte Gesamtzahl der Gerechten ist nahe gekommen.
  alternative: Die Abrechnung oder das Gericht der Gerechten ist nahe gekommen.
  rationale: Die numerische Bedeutung liegt am nächsten; die mögliche gerichtliche Nuance wird wegen der lexikalischen Mehrdeutigkeit nicht verschwiegen.
- issue: Bedeutung des eingeforderten Blutes
  choice: Gott fordert wegen des vergossenen Blutes Rechenschaft und damit dessen gerichtliche Ahndung.
  alternative: Das Blut der Gerechten ist gerächt worden.
  rationale: „Eingefordert“ bildet die Vorstellung ab, dass das Blut gesucht beziehungsweise zur Rechenschaft gezogen wird. „Gerächt“ ist im Kontext plausibel, formuliert den Vollzug der Vergeltung jedoch stärker aus.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Der charakteristische Titel „Herr der Geister“ und die biblischen Leitbegriffe „Heilige“ und „Gerechte“ bleiben erhalten.
