  source_fidelity: 'Die Fassung gibt die zentralen ge''ezischen Ausdrücke insgesamt treffend wieder: die Herzen der Heiligen, die Zahl der Gerechten, ihr erhörtes Gebet sowie das vor dem Herrn der Geister eingeforderte Blut. Für ተፈቅደ ist „eingefordert worden“ dem im Audit belegten gerichtlichen Sinn („gesucht/gefordert“, Rechenschaft wegen vergossenen Blutes) angemessener als eine unmarkierte Feststellung, das Blut sei bereits „gerächt“ worden.'
