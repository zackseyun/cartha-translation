  terminology: „Heilige“, „Gerechte“ und „Herr der Geister“ sind passende, konsistente Wiedergaben im würdigen apokalyptischen Register. Die Fußnote zu ኍልቈ sollte die gerichtliche Lesart nicht als „Abrechnung mit den Gerechten“ formulieren, denn dies kann bedeuten, dass gegen die Gerechten abgerechnet wird; eine neutralere Formulierung wahrt die Mehrdeutigkeit besser.
