base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/001.yaml
  text: And in those days[c][b][a], the prayer of the righteous and the blood of the righteous ascended from the earth before the Lord of Spirits.
translation:
  language: de
  text: Und in jenen Tagen stiegen das Gebet der Gerechten und das Blut des Gerechten[a] von der Erde empor vor den Herrn der Geister.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Blut der Gerechten“. Das ge''ezische Wort nach „Blut“ steht im Singular („des Gerechten“), kann hier aber im Parallelismus mit „dem Gebet der Gerechten“ repräsentativ oder kollektiv gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መዋዕል
  choice: Tagen
  rationale: In der apokalyptischen Zeitformel ist „in jenen Tagen“ die natürliche und traditionsnahe Wiedergabe.
- source_word: ዐርገት
  choice: stiegen … empor
  rationale: Die Perfektform bezeichnet eine vollzogene Aufwärtsbewegung. Der deutsche Plural folgt dem zusammengesetzten Subjekt, auch wenn das ge'ezische Verb im Singular zunächst mit „Gebet“ kongruiert.
- source_word: ጸሎተ ጻድቃን
  choice: das Gebet der Gerechten
  rationale: „Gebet“ gibt den allgemeinen Sinn wieder; „der Gerechten“ bewahrt die kollektive Bezeichnung der apokalyptischen Gruppe.
- source_word: ደሙ ጻድቅ
  choice: das Blut des Gerechten
  rationale: Die formale Singularität von ጻድቅ bleibt im Haupttext sichtbar, statt sie aufgrund des Parallelismus stillschweigend zu einem Plural zu machen.
- source_word: እምነ ምድር
  choice: von der Erde
  rationale: „Erde“ wahrt den kosmisch-apokalyptischen Horizont besser als das örtlichere „Land“.
- source_word: ቅድመ
  choice: vor
  rationale: Die knappe Präposition gibt das Erscheinen in der Gegenwart des Herrn natürlich wieder.
- source_word: እግዚአ መናፍስት
  choice: den Herrn der Geister
  rationale: Dies bewahrt den festen, erhabenen Gottestitel des Henochbuches.
theological_decisions:
- issue: Bezeichnet ጻድቅ nach „Blut“ einen einzelnen Gerechten oder kollektiv die Gerechten?
  choice: des Gerechten
  alternative: der Gerechten
  rationale: Die ge'ezische Form ist Singular und wird deshalb im Haupttext bewahrt. Der Parallelismus mit „Gebet der Gerechten“ kann jedoch einen repräsentativen oder kollektiven Singular nahelegen; diese echte Mehrdeutigkeit wird in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Verbform wird entsprechend der ge'ezischen Perfektform vergangen wiedergegeben; die koordinierte Satzstruktur wird im Deutschen natürlich geordnet. Die markante Singular-Plural-Spannung bleibt erhalten und wird nicht konfessionell gedeutet.
