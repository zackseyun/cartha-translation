base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/047/003.yaml
  text: In those days I saw the Head of Days[a], as he sat on the throne of his glory, and the books of the living were opened before him; and all his host, which is in the heights of heaven[e][d][c][b], and his council stood before him.
translation:
  language: de
  text: In jenen Tagen sah ich das Haupt der Tage[a], als er auf dem Thron seiner Herrlichkeit saß. Die Bücher der Lebenden[b] wurden vor ihm geöffnet, und sein ganzes Heer in den Höhen des Himmels sowie sein Hof[c] standen vor ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „das Haupt der Tage“; der Titel wird hier nicht an die geläufige Wendung „der Alte an Tagen“ angeglichen.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die Bücher des Lebens“. Im Äthiopischen steht eine Mehrzahl, wörtlich „die Bücher der Lebenden“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „sein Rat“, „seine Versammlung“ oder „der Kreis um ihn“. Das äthiopische Wort kann den ihn umgebenden himmlischen Hof bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: In jenen Tagen
  rationale: Bewahrt die wiederkehrende apokalyptische Zeitformel und den konkreten Plural „Tage“.
- source_word: ለርእሰ መዋዕል
  choice: das Haupt der Tage
  rationale: Gibt die Bestandteile des äthiopischen Titels eng wieder, ohne ihn vorschnell an Daniels geläufige Bezeichnung „der Alte an Tagen“ anzugleichen.
- source_word: ሶበ ነበረ መንበረ ስብሐቲሁ
  choice: als es auf dem Thron seiner Herrlichkeit saß
  rationale: Versteht ነበረ aktiv als „saß“ und den Thron als Ort des Sitzens; „Thron seiner Herrlichkeit“ erhält die Genitivfügung.
- source_word: መጻሕፍተ ሕያዋን
  choice: die Bücher der Lebenden
  rationale: Erhält sowohl den Plural „Bücher“ als auch die wörtliche Beziehung „der Lebenden“, statt zur vertrauten Wendung „Buch des Lebens“ zu harmonisieren.
- source_word: በቅድሜሁ ተከሥቱ
  choice: wurden vor ihm geöffnet
  rationale: Das Öffnen passt sachlich zu den himmlischen Büchern und wahrt zugleich die gerichtliche Offenlegungsszene.
- source_word: ኵሉ ኃይሉ
  choice: sein ganzes Heer
  rationale: Im Kontext des himmlischen Hofes bezeichnet der Ausdruck plausibel eine versammelte Heerschar und nicht bloß abstrakte Macht.
- source_word: ዘመልዕልተ ሰማያት
  choice: in den Höhen des Himmels
  rationale: Bewahrt die erhabene räumliche Bildsprache des Ausgangstextes.
- source_word: አውደ ዚአሁ
  choice: sein Hofstaat
  rationale: Gibt im Thronsaalzusammenhang die ihn umgebende Versammlung wieder und lässt zugleich die räumliche Grundbedeutung „Kreis/Umgebung“ anklingen.
- source_word: ይቀውሙ በቅድሜሁ
  choice: standen vor ihm
  rationale: Bewahrt die Haltung der himmlischen Versammlung vor dem Thron und fügt sich natürlich in den visionären Bericht.
theological_decisions:
- issue: Wiedergabe des göttlichen Titels ርእሰ መዋዕል
  choice: das Haupt der Tage
  alternative: der Alte an Tagen
  rationale: Die enge Wiedergabe folgt dem äthiopischen Wortlaut und vermeidet eine nicht zwingende Harmonisierung mit der vertrauten Daniel-Formulierung.
- issue: Wiedergabe von መጻሕፍተ ሕያዋን
  choice: die Bücher der Lebenden
  alternative: die Bücher des Lebens
  rationale: Der überlieferte Text hat den Plural „Bücher“ und eine Genitivbeziehung zu „den Lebenden“; beides bleibt erhalten, ohne spätere kanonische Formulierungen einzutragen.
- issue: Deutung von አውደ ዚአሁ
  choice: sein Hofstaat
  alternative: sein Rat
  rationale: „Hofstaat“ passt zur himmlischen Thronszene und wahrt stärker die Vorstellung des Kreises beziehungsweise der Umgebung um den Thronenden; „Rat“ bleibt als mögliche funktionale Deutung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer apokalyptischer Bildsprache. Das Pronomen „es“ nimmt das grammatisch sächliche „Haupt“ auf; dadurch bleibt der Titel eng am Ausgangstext, ohne die Gestalt zu entpersonalisieren. Die Satzglieder sind leicht gegliedert, ohne die feierliche Reihung des Verses aufzulösen.
