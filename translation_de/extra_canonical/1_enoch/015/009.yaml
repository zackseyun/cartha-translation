base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/009.yaml
  text: And evil spirits came out from their flesh[a], because they were created from above; and from the holy Watchers was their beginning and first foundation[d][c][b]. They shall be evil spirits.
translation:
  language: de
  text: Und böse Geister gingen aus ihrem Fleisch hervor[a], denn sie waren von oben erschaffen worden; und von den heiligen Wächtern[b] kamen ihr Anfang und ihre erste Grundlage. Sie werden böse Geister sein[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verließen ihr Fleisch“. Der ge’ezische Text spricht ausdrücklich von „Fleisch“ und bewahrt damit das körperliche Bild.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: „von den Heiligen, den Wächtern“. Im Zusammenhang sind die angelischen Wächter gemeint.'
    reason: lexical_alternative
  - marker: c
    text: 'Die Schlussworte können als Benennungsformel verstanden werden: Nachdem diese Wesen das Fleisch verlassen haben, werden sie „böse Geister“ genannt.'
    reason: alternative_reading
lexical_decisions:
- source_word: ነፍሳት፡ እኩያን
  choice: böse Geister
  rationale: Die absolute Nominalform mit folgendem Adjektiv bedeutet „böse Seelen/Geister“, nicht „Seelen der Bösen“. Im Zusammenhang sind die entkörperten Wesen aus der Nachkommenschaft der Wächter gemeint; „Geister“ verbindet den Ausdruck natürlich mit der abschließenden Bezeichnung.
- source_word: ወጽኡ፡ እምሥጋሆሙ
  choice: gingen aus ihrem Fleisch hervor
  rationale: Bewahrt sowohl die Bewegung aus dem Körper heraus als auch das ausdrücklich verwendete konkrete Bild des Fleisches.
- source_word: እስመ፡ እመልዕልት፡ ተፈጥሩ
  choice: denn sie waren von oben erschaffen worden
  rationale: Gibt den begründenden Zusammenhang, die passive Schöpfungsaussage und die räumlich-kosmologische Herkunft wieder, ohne daraus moralische Billigung oder volle Engelgleichheit abzuleiten.
- source_word: እምቅዱሳን፡ ትጉሃን
  choice: von den heiligen Wächtern
  rationale: Im henochischen Kontext bezeichnet die Verbindung die angelischen Wächter. Die technische Bezeichnung „Wächter“ bleibt erhalten.
- source_word: ቀዳሚቶሙ፡ ወቀዳሚ፡ መሰረት
  choice: ihr Anfang und ihre erste Grundlage
  rationale: Bewahrt die gewichtige, teilweise wiederholende Ursprungssprache des überlieferten Textes, statt sie zu einem einzigen glatten Begriff zusammenzuziehen.
- source_word: መንፈሰ፡ እኩየ
  choice: böse Geister
  rationale: Die überlieferte Form kann kollektiv beziehungsweise formal singular erscheinen; der Zusammenhang verlangt eine auf die Mehrzahl der Wesen bezogene Wiedergabe.
theological_decisions:
- issue: Identität der nach dem Tod beschriebenen Wesen
  choice: Der Vers spricht von den aus dem Fleisch hervorgehenden Geistern der Nachkommen der Wächter und der Frauen.
  alternative: Der Vers spricht allgemein von den Seelen böser Menschen.
  rationale: Der unmittelbare Zusammenhang von 1 Henoch 15 behandelt Ursprung und Schicksal der Riesen. Die Herkunft „von oben“ und von den heiligen Wächtern weist auf diese besondere Gruppe.
- issue: Bedeutung von „von oben“
  choice: Der Ausdruck bezeichnet einen himmlischen Anteil an ihrer Herkunft.
  alternative: Der Ausdruck verleiht ihnen uneingeschränkt den Status von Engeln oder bescheinigt ihnen moralische Heiligkeit.
  rationale: Die kosmologische Spannung ihrer gemischten Herkunft soll erhalten bleiben, ohne sie dogmatisch aufzulösen.
- issue: Funktion der Schlussbezeichnung
  choice: „Sie werden böse Geister sein“ kann als abschließende Bestimmung oder Benennung verstanden werden.
  alternative: Die Worte sind lediglich eine weitere moralische Beschreibung.
  rationale: Die knappe Form des Ausgangstextes lässt die genaue pragmatische Funktion offen; die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener apokalyptischer Ursprungssprache. „Fleisch“, „von oben“, „Wächter“ und „erste Grundlage“ erhalten die konkreten und kosmologischen Bilder des ge’ezischen Textes; die ungewöhnliche Wiederholung von „böse Geister“ wird nicht geglättet.
