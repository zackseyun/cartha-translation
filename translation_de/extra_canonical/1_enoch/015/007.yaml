base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/007.yaml
  text: And because of this I have not appointed wives for you[b][a], for the dwelling of the spiritual ones of heaven is in heaven.
translation:
  language: de
  text: Und deshalb habe ich euch keine Ehefrauen zugewiesen; denn die Wohnstätte der geistigen Wesen des Himmels[a] ist im Himmel.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die Geister des Himmels“ oder „die himmlischen Geistwesen“. Der ge''ezische Ausdruck lässt mehrere eng verwandte Deutungen zu.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Wiederholung von „Himmel“ ist beabsichtigt: Diese Wesen gehören zum Himmel, und dort ist ihre Wohnstätte.'
    reason: cultural_note
lexical_decisions:
- source_word: ወበእንተዝ
  choice: Und deshalb
  rationale: Die Wendung wird kausal verstanden und stellt den Bezug zur vorausgehenden Begründung her. „Deshalb“ ist im heutigen Deutsch natürlich und bewahrt diese Folgerungsbeziehung.
- source_word: ኢረሰይኩ
  choice: habe ich … zugewiesen
  rationale: Das Verb bezeichnet hier ein Bestimmen, Zuteilen oder Einsetzen, nicht lediglich ein Erschaffen. „Zugewiesen“ passt zum Gedanken nicht gewährter ehelicher Partnerinnen.
- source_word: ለክሙ
  choice: euch
  rationale: Der Dativ des ge'ezischen Ausdrucks wird mit der natürlichen deutschen Rektion von „zuweisen“ wiedergegeben.
- source_word: አንስቲያ
  choice: Ehefrauen
  rationale: Im Zusammenhang geht es um eheliche beziehungsweise geschlechtliche Zuordnung. „Ehefrauen“ gibt diesen Sinn genauer wieder als das allgemeinere „Frauen“.
- source_word: እስመ
  choice: denn
  rationale: Die Konjunktion leitet den erklärenden Grund ein. „Denn“ bewahrt die knappe, gehobene Verknüpfung.
- source_word: መንፈሳውያነ
  choice: die geistigen Wesen
  rationale: Die substantivisch gebrauchte Form bezeichnet Wesen, die als geistig beziehungsweise geistlich charakterisiert werden. Die Wiedergabe wahrt diese Form, ohne sie eindeutig auf „Geister“ festzulegen.
- source_word: ሰማይ
  choice: des Himmels
  rationale: Der Genitivbezug bleibt ausdrücklich erhalten und lässt zugleich die bewusste Wiederholung von „Himmel“ hörbar werden.
- source_word: ውስተ ሰማይ
  choice: im Himmel
  rationale: Die schlichte Ortsangabe entspricht dem Ge'ez und bewahrt die Wiederaufnahme des unmittelbar vorausgehenden Himmelsbegriffs.
- source_word: መሓድሪሆሙ
  choice: die Wohnstätte … ist
  rationale: Das Substantiv bezeichnet Wohnung oder Aufenthaltsort. „Wohnstätte“ ist verständlich, würdig und entspricht dem Aussagegewicht des Verses.
theological_decisions:
- issue: Deutung von መንፈሳውያነ ሰማይ als „Geister des Himmels“, „himmlische Geistwesen“ oder „geistige Wesen des Himmels“
  choice: die geistigen Wesen des Himmels
  alternative: die Geister des Himmels / die himmlischen Geistwesen
  rationale: Die ge'ezische Form ist eher adjektivisch-substantivisch als ein eindeutiges Substantiv für „Geister“. Die gewählte Fassung bewahrt die Kategorie dieser Wesen und ihre Zugehörigkeit zum Himmel, ohne die angelologische Aussage stärker festzulegen als der Ausgangstext.
- issue: Wiedergabe von አንስቲያ als allgemeines „Frauen“ oder als „Ehefrauen“
  choice: Ehefrauen
  alternative: Frauen
  rationale: Der Vers begründet, weshalb diesen Wesen keine ehelichen Partnerinnen zugeteilt wurden. „Ehefrauen“ macht diesen örtlichen Zusammenhang deutlich, ohne darüber hinaus eine konfessionelle Lehraussage einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe an der ge'ezischen Begründungsfolge; das Semikolon trennt Hauptaussage und Begründung klar. Die Wiederholung von „Himmel“ wurde nicht geglättet.
