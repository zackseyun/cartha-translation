base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/002.yaml
  text: 'And go[a], say to the watchers of heaven who have sent you to petition on their behalf: ''You ought to petition on behalf of men[b], and not men on your behalf.'''
translation:
  language: de
  text: 'Und geh und sag den Wächtern des Himmels, die dich gesandt haben, damit du für sie bittest[a]: »Ihr solltet für die Menschen[b] bitten, nicht aber die Menschen für euch.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das zugrunde liegende Verb bedeutet allgemein „bitten“ oder „ersuchen“; im Zusammenhang geht es um eine Bitte zugunsten anderer, also um Fürsprache.
    reason: lexical_alternative
  - marker: b
    text: „Menschen“ bezeichnet hier die Menschheit insgesamt, nicht nur Männer.
    reason: cultural_note
lexical_decisions:
- source_word: ሑር
  choice: geh
  rationale: Der Bewegungsimperativ richtet sich an Henoch; „geh“ ist im Deutschen die schlichte und natürliche Entsprechung.
- source_word: በሎሙ
  choice: sag zu
  rationale: Die Wendung führt eine direkte Rede mit pluralischem Adressaten ein. In Verbindung mit „geh“ klingt „sag zu“ natürlich und wahrt die Anrede.
- source_word: ለትጉሃነ ሰማይ
  choice: zu den Wächtern des Himmels
  rationale: „Wächter“ bewahrt die programmatische Bezeichnung dieser himmlischen Wesen im Wächterbuch; „des Himmels“ folgt der Quellformulierung eng.
- source_word: እለ ፈነዉከ
  choice: die dich gesandt haben
  rationale: Der Relativsatz bezeichnet die Wächter als diejenigen, die Henoch beauftragt haben; das deutsche Perfekt bringt die fortdauernde Relevanz dieser Sendung zum Ausdruck.
- source_word: ትስአል በእንቲአሆሙ
  choice: damit du für sie bittest
  rationale: Das Verb bezeichnet allgemein ein Bitten oder Ersuchen. „Für sie bitten“ ist im Deutschen klar und bewahrt den Gedanken stellvertretender Fürsprache, ohne einen stärker fachsprachlichen Begriff aufzuzwingen.
- source_word: አንትሙ መፍትው ትስአሉ
  choice: Ihr solltet … bitten
  rationale: Die Konstruktion drückt Angemessenheit beziehungsweise Verpflichtung aus. „Solltet“ bewahrt den vorwurfsvollen Hinweis auf die verkehrte Ordnung.
- source_word: በእንተ ሰብእ
  choice: für die Menschen
  rationale: ሰብእ bezeichnet hier die Menschheit kollektiv. Der Plural „die Menschen“ ist inklusiv, verständlich und trägt den Kontrast zum folgenden Satzglied.
- source_word: ወአኮ ሰብእ በእንቲአክሙ
  choice: und nicht die Menschen für euch
  rationale: 'Die knappe Wiederholung hält die entscheidende Umkehrung fest: Die himmlischen Wesen sollten für Menschen bitten, statt Menschen für sich bitten zu lassen.'
theological_decisions:
- issue: Bezeichnung der himmlischen Wesen
  choice: Wächter des Himmels
  alternative: Engel des Himmels; himmlische Wächter
  rationale: „Wächter“ lässt die besondere apokalyptische Bezeichnung sichtbar; „Engel“ würde die literarisch-theologische Kategorie verallgemeinern.
- issue: Aussagekraft der Zurechtweisung über die Fürsprache
  choice: Ihr solltet für die Menschen bitten und nicht die Menschen für euch
  alternative: Ihr solltet für die Menschen Fürsprache einlegen, statt die Menschen für euch
  rationale: Die Fassung bewahrt die im Text ausgesprochene Umkehrung und moralische Unangemessenheit, ohne daraus ein umfassendes Lehrsystem über Engel und Fürsprache abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist knapp gehalten; „Wächter“ bleibt als apokalyptischer Fachbegriff erhalten. „Menschen“ ist geschlechtsübergreifend und bezeichnet die Menschheit kollektiv.
