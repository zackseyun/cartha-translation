base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/001.yaml
  text: 'And he answered me and said to me[a], and I heard: “Do not fear, Enoch, righteous man and scribe of righteousness. Come near here and hear my word.”'
translation:
  language: de
  text: 'Und er antwortete mir und sagte zu mir, und ich hörte[a]: »Fürchte dich nicht, Henoch, gerechter Mann und Schreiber der Gerechtigkeit. Tritt hierher und höre mein Wort.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht im äthiopischen Text eine Wiederholung des Hörverbs: »und ich hörte, ich hörte«.'
    reason: Die Wiederholung wird im Haupttext für ein natürliches deutsches Sprachbild zusammengezogen, aber als textliche Besonderheit dokumentiert.
lexical_decisions:
- source_word: አውሥአኒ፡ ወይቤለኒ
  choice: er antwortete mir und sagte zu mir
  rationale: Die beiden Verben werden beibehalten, um die wiederholende Erzählweise und den dialogischen Zusammenhang des äthiopischen Textes wiederzugeben.
- source_word: ወሰምኩ፡ ሰማዕኩ
  choice: und ich hörte
  rationale: Die schwerfällige Wiederholung desselben Hörverbs wird im Haupttext idiomatisch zusammengezogen; eine Fußnote weist auf den Wortlaut hin. Ein nicht ausdrücklich vorhandenes Objekt wie „seine Stimme“ wird nicht ergänzt.
- source_word: አትፍራህ
  choice: Fürchte dich nicht
  rationale: Die geläufige, würdige deutsche Form der direkten Aufforderung bewahrt den feierlichen Ton.
- source_word: ብእሲ፡ ጻድቅ
  choice: gerechter Mann
  rationale: Diese Wiedergabe erhält sowohl die Personenbezeichnung als auch die moralische Charakterisierung Henochs.
- source_word: ጻሓፊ፡ ጽድቅ
  choice: Schreiber der Gerechtigkeit
  rationale: „Schreiber“ gibt die literarische und aufzeichnende Funktion wieder; der Genitiv „der Gerechtigkeit“ wahrt die formale Verbindung des Ausgangstextes.
- source_word: ቅረብ፡ ዝየ
  choice: Tritt hierher
  rationale: Die Formulierung verbindet die Aufforderung zur Annäherung mit der Ortsangabe in natürlichem, würdigem Deutsch.
- source_word: ወስማዕ፡ ቃልየ
  choice: und höre mein Wort
  rationale: Der Singular „Wort“ wird entsprechend dem äthiopischen Text bewahrt und passt zum Offenbarungscharakter der Rede.
theological_decisions:
- issue: Henochs moralische und schriftstellerische Bezeichnung
  choice: gerechter Mann und Schreiber der Gerechtigkeit
  alternative: rechtschaffener Mann und Schreiber des Rechts
  rationale: Die gewählte Fassung bewahrt beide eigenständigen Bezeichnungen und lässt sowohl Henochs moralische Qualifikation als auch seine Rolle als schriftlicher Vermittler der Offenbarung stehen, ohne sie konfessionell auszudeuten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Offenbarungston. Die erzählerische Wiederholung von „antwortete“ und „sagte“ bleibt erhalten; unnötige Ergänzungen wie „seine Stimme“ werden vermieden.
