revisions:
- from: Doch ihr wart heilig, geistige Wesen, die ein ewiges Leben lebten. Ihr aber habt euch mit Frauen verunreinigt[a], durch das Blut des Fleisches Kinder gezeugt und nach dem Blut der Menschen verlangt. Und ihr habt wie sie Fleisch und Blut hervorgebracht – sie, die sterben und zugrunde gehen.[b]
