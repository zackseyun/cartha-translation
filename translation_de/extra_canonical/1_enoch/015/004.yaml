base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/004.yaml
  text: But you were holy[a], spiritual beings, living eternal life. But you defiled yourselves with women, and by the blood of flesh you fathered children, and you desired the blood of men, and you did as they do[c][b], producing flesh and blood—those who die and perish.
translation:
  language: de
  text: Doch ihr wart heilig, geistliche Wesen, die ewiges Leben hatten. Ihr aber habt euch mit Frauen verunreinigt[a], durch das Blut des Fleisches Kinder gezeugt und nach dem Blut der Menschen verlangt. Und ihr habt Fleisch und Blut hervorgebracht, wie es jene tun, die sterben und zugrunde gehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die überlieferte äthiopische Form vor »Frauen« ist unsicher. Eine textkritische Wiederherstellung ergibt: »mit dem Blut der Frauen habt ihr euch verunreinigt«; die im Haupttext gebotene Lesart lautet: »mit Frauen«.'
    reason: textual_variant
  - marker: b
    text: Das letzte Verb kann auch mit »vernichtet werden« wiedergegeben werden; sicher ist, dass der Ausdruck die Sterblichkeit und den Untergang der Menschen bezeichnet.
    reason: lexical_alternative
lexical_decisions:
- source_word: ቅዱሳን
  choice: heilig
  rationale: Das prädikative Adjektiv bezeichnet den ursprünglichen Zustand der Wächter und erhält den scharfen Gegensatz zu ihrer späteren Verunreinigung.
- source_word: መንፈሳውያን
  choice: geistige Wesen
  rationale: Die Form bezeichnet ihre nichtfleischliche Wesensart; »Wesen« verdeutlicht, dass Personen und nicht eine abstrakte Eigenschaft gemeint sind.
- source_word: ሕያዋነ ሕይወት ዘለዓለም
  choice: die ein ewiges Leben lebten
  rationale: Die bewusste Wiederholung von »leben/Leben« wird im Deutschen bewahrt und bildet den Gegensatz zu den Sterblichen am Versende.
- source_word: በደቡ አንስት ረኩስክሙ
  choice: ihr habt euch mit Frauen verunreinigt
  rationale: »Verunreinigt« wahrt die kultisch-moralische Bedeutung. Die überlieferte Form vor »Frauen« ist schwierig; deshalb wird die gut verständliche Lesart im Text geboten und die textkritische Alternative in einer Fußnote genannt.
- source_word: በደመ ሥጋ አውለድክሙ
  choice: durch das Blut des Fleisches Kinder gezeugt
  rationale: Die auffällige Blut-und-Fleisch-Bildsprache bleibt erhalten; »Kinder« ergänzt das im Verb des Zeugens enthaltene Objekt natürlich.
- source_word: በደመ ሰብእ ፈተውክሙ
  choice: nach dem Blut der Menschen verlangt
  rationale: Die Wendung bewahrt sowohl »Blut« als auch den ausdrücklichen Bezug auf Menschen, ohne das Verb stärker als nötig sexualisierend oder gewalttätig festzulegen.
- source_word: ወገበርክሙ ከመ እሙንቱ ይገብሩ ሥጋ ወደመ
  choice: ihr habt wie sie Fleisch und Blut hervorgebracht
  rationale: Die Zuordnung von »Fleisch und Blut« zum Hervorbringen bleibt syntaktisch sichtbar. »Hervorgebracht« gibt das wiederholte, weit gefasste Verb ገበረ im Zusammenhang der Zeugung verständlich wieder.
- source_word: እለ እሙንቱ ይመውቱ ወይትሐጐሉ
  choice: sie, die sterben und zugrunde gehen
  rationale: Der Relativsatz kennzeichnet die Menschen durch Sterblichkeit und Untergang; »zugrunde gehen« wahrt den ernsten Ton, ohne die Art des Untergangs festzulegen.
theological_decisions:
- issue: Gegensatz zwischen der geistigen Existenz der Wächter und der sterblichen, leiblichen Existenz der Menschen
  choice: Die Übersetzung erhält die Abfolge »heilig – geistige Wesen – ewiges Leben« sowie die wiederkehrenden Bilder von Blut und Fleisch.
  alternative: Der Gegensatz könnte deutend als »unsterblich« gegenüber »sterblich« zusammengefasst werden.
  rationale: Der Vers beschreibt eine Überschreitung geschöpflicher Grenzen, formuliert sie aber durch konkrete Blut-und-Fleisch-Sprache. Eine abstrakte Zusammenfassung würde diese Spannung vorschnell auflösen.
- issue: Bezug des abschließenden Relativsatzes
  choice: »sie, die sterben und zugrunde gehen« wird auf die Menschen bezogen, deren leibliche Fortpflanzung die Wächter nachahmten.
  alternative: Der Satz könnte grammatisch enger an »Fleisch und Blut« angeschlossen werden.
  rationale: Das vorausgehende »wie sie« liefert den natürlichen Personenbezug; der Gedankenverlauf kontrastiert die ewig lebenden geistigen Wesen mit sterblichen Menschen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnlichen Wiederholungen von »leben/Leben«, »Blut« und »Fleisch« bleiben soweit möglich sichtbar. Der Text vermeidet konfessionelle Zusatzdeutungen und kennzeichnet die unsichere Lesart ausdrücklich.
