base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/003.yaml
  text: Why did you abandon the high[a], holy, eternal heaven, and lie with women, and defile yourselves with the daughters of men, and take wives for yourselves, and do as the children of the earth do[b], and beget giant sons?
translation:
  language: de
  text: Warum habt ihr den hohen, heiligen und ewigen Himmel verlassen, bei Frauen gelegen, euch mit den Töchtern der Menschen verunreinigt, euch Frauen genommen, wie die Kinder der Erde[a] gehandelt und Söhne gezeugt, die Riesen waren[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Kinder der Erde« steht im Gegensatz zu den himmlischen Wächtern und bezeichnet sterbliche Menschen; die bildhafte Wendung sollte nicht zu bloß »Menschen« verflacht werden.
    reason: cultural_note
  - marker: b
    text: Der Schlussausdruck bezeichnet die außergewöhnlichen Nachkommen aus dieser Verbindung. Möglich ist auch die knappere Wiedergabe »Riesensöhne«.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኃደግሙ
  choice: verlassen
  rationale: Das Verb bezeichnet ein nachdrückliches Zurücklassen. »Verlassen« bewahrt den vorwurfsvollen Ton, ohne im Deutschen eine zusätzliche Nuance von Verwahrlosung einzutragen.
- source_word: ሰማየ ልዑለ ወቅዱሰ ዘለዓለም
  choice: den hohen, heiligen und ewigen Himmel
  rationale: Die Reihung der Eigenschaften wird beibehalten und zugleich in eine natürliche deutsche Koordination gebracht.
- source_word: ሰከብክሙ
  choice: bei Frauen gelegen
  rationale: Die Wendung gibt die sexuelle Vereinigung direkt, aber nicht derb wieder und entspricht dem würdevollen Ton der Anklage.
- source_word: እዋለደ ሰብእ
  choice: die Töchter der Menschen
  rationale: Die wörtlich geprägte Formulierung erhält den Gegensatz zwischen menschlichen Frauen und den himmlischen Wächtern.
- source_word: ረኩስክሙ
  choice: euch … verunreinigt
  rationale: »Verunreinigt« bewahrt sowohl die moralische als auch die Reinheitsdimension des Verbs und schwächt das Urteil des Textes nicht ab.
- source_word: አንስተ
  choice: Frauen
  rationale: Im Zusammenhang mit »euch … genommen« bezeichnet das Wort als Frauen genommene Partnerinnen. Das Deutsche lässt dabei wie der Ausgangstext die Verbindung von Frau und Ehefrau kontextuell erkennen.
- source_word: ከመ ውሉደ ምድር ገበርክሙ
  choice: wie die Kinder der Erde gehandelt
  rationale: Die bildhafte Herkunftsbezeichnung bleibt erhalten und markiert den Gegensatz zwischen himmlischen Wesen und irdischen Menschen.
- source_word: ውሉደ ረዓይተ
  choice: Söhne …, die Riesen waren
  rationale: Diese Formulierung gibt die ungewöhnlichen Nachkommen konkret und in natürlichem Deutsch wieder, ohne sie abstrakt als bloß gewalttätig zu deuten.
theological_decisions:
- issue: Moralischer Status der Verbindung der Wächter mit Frauen
  choice: Die Verbindung wird ausdrücklich als Selbstverunreinigung wiedergegeben.
  alternative: Die Verbindung neutral als Vermischung oder bloße Grenzüberschreitung wiedergeben.
  rationale: Der geʿezische Text verwendet ausdrücklich ein Verb der Verunreinigung; diese moralische und reinheitsbezogene Wertung darf nicht abgeschwächt werden.
- issue: Bezeichnung der menschlichen Frauen
  choice: »Töchter der Menschen«
  alternative: »Frauen der Menschheit« oder schlicht »Menschenfrauen«
  rationale: Die traditionelle, quellennähere Wendung bewahrt den anthropologischen Gegensatz, ohne eine weitergehende Lehre über die beteiligten Wesen festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem apokalyptischem Klang. Die lange Folge der Anklagepunkte und die wiederholte Koordination des Ausgangstextes bleiben erkennbar, werden im Deutschen jedoch ohne unnötig altertümliche Formen gestaltet.
