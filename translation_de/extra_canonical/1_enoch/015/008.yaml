base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/008.yaml
  text: And now[a], the giants who were born from spirits and flesh will be called evil spirits upon the earth[b], and on the earth will be their dwelling.
translation:
  language: de
  text: Und nun werden die Riesen[a], die aus Geistern und Fleisch geboren wurden, auf der Erde böse Geister heißen; und auf der Erde[b] wird ihre Wohnstätte sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit „Riesen“ wiedergegebene Wort bezeichnet im Zusammenhang die Nachkommen der Wächter und der Frauen; lexikalisch ist auch die allgemeinere Wiedergabe „Nachkommen“ möglich.
    reason: lexical_alternative
  - marker: b
    text: Die Wiederholung von „Erde“ entspricht dem ge’ezischen Wortlaut. Sie betont, dass diese Geister dem irdischen und nicht dem himmlischen Bereich zugehören.
    reason: cultural_note
lexical_decisions:
- source_word: ረዓይት
  choice: die Riesen
  rationale: Im unmittelbaren Zusammenhang bezeichnet das Wort die Mischwesen, die aus den Wächtern und den Frauen hervorgegangen sind. „Riesen“ gibt den etablierten kontextuellen Sinn und den apokalyptischen Charakter wieder; „Nachkommen“ bleibt lexikalisch möglich.
- source_word: ተወልዱ
  choice: geboren wurden
  rationale: Die passive Geburtsformel wird direkt und in natürlichem modernem Deutsch wiedergegeben.
- source_word: እመናፍስት ወሥጋ
  choice: aus Geistern und Fleisch
  rationale: Die auffällige Gegenüberstellung von Geistwesen und Fleisch als zweifache Herkunft bleibt ohne erklärende Erweiterung erhalten.
- source_word: መንፈሳት እኩያን
  choice: böse Geister
  rationale: Dies ist die direkte Wiedergabe von „böse/schlecht“ und „Geister“; „unreine Geister“ würde eine hier nicht ausdrücklich verwendete spätere Terminologie eintragen.
- source_word: ይሰመዩ
  choice: genannt werden
  rationale: Die passive Benennungsformel bleibt erhalten und trägt der klassifizierenden Aussage des apokalyptischen Textes Rechnung.
- source_word: በዲበ ምድር
  choice: auf der Erde
  rationale: Die Wendung bezeichnet den irdischen Bereich beziehungsweise Ort. Die schlichte Formulierung ist im Deutschen würdig und natürlich.
- source_word: ወውስተ ምድር ይከውን መሓድሪሆሙ
  choice: und auf der Erde wird ihre Wohnstätte sein
  rationale: Die Wiederholung von „Erde“ und die hervorgehobene Ortsangabe werden bewahrt. „Wohnstätte“ entspricht dem leicht gehobenen Ton des Ausgangstextes.
theological_decisions:
- issue: Identität der Wesen, die als böse Geister bezeichnet werden
  choice: Der Vers spricht von den Riesen, den aus Geistern und Fleisch geborenen Mischwesen, die auf der Erde als böse Geister bezeichnet werden.
  alternative: Das einleitende Substantiv könnte lexikalisch allgemeiner als „Nachkommen“ verstanden werden.
  rationale: Der unmittelbare literarische Zusammenhang von 1 Henoch 15 identifiziert die betreffenden Wesen als die riesenhaften Nachkommen der Wächter und der Frauen. Die Übersetzung macht diesen lokalen Bezug deutlich, ohne eine spätere Dämonologie in den Vers hineinzulesen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die Wiederholung von „auf der Erde“ und die Spannung zwischen der leiblich-geistigen Herkunft und der Benennung als böse Geister wurden bewusst nicht geglättet.
