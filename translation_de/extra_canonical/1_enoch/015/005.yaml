base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/005.yaml
  text: Therefore I gave them women[a], so that they might beget children by them and offspring might be born to them[b], so that thus no work on the earth might be lacking to them.
translation:
  language: de
  text: Darum gab ich ihnen Frauen, damit sie Samen in sie säten[a] und ihnen durch sie Kinder geboren würden, damit ihnen so kein Werk auf Erden fehlte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »auf ihnen Samen säten«. Das Ge’ez bewahrt hier ein aus der Aussaat genommenes Bild für die Zeugung.'
    reason: lexical_alternative
  - marker: b
    text: Der Schlusssatz ist schwer verständlich. Gemeint sein könnte, dass das irdische Leben und Wirken durch Fortpflanzung in der dafür bestimmten Weise fortbestehen sollte.
    reason: textual_variant
lexical_decisions:
- source_word: በእንተዝ
  choice: Darum
  rationale: Die Wendung leitet die Begründung der göttlichen Ordnung ein und knüpft folgernd an den vorausgehenden Gegensatz zwischen den Geistwesen und den irdischen Geschöpfen an.
- source_word: ወሀብክዎሙ አንስቲያ
  choice: gab ich ihnen Frauen
  rationale: Die erste Person der göttlichen Rede und das indirekte Objekt werden direkt wiedergegeben. »Frauen« vermeidet die im Substantiv nicht ausdrücklich enthaltene Festlegung auf »Ehefrauen«.
- source_word: ከመ ይዝርኡ ላዕሌሆን
  choice: damit sie auf ihnen Samen säten
  rationale: Die ungewöhnliche landwirtschaftlich-zeugende Metapher des Ge’ez bleibt sichtbar. »Auf ihnen« entspricht der räumlichen Präposition formaler als das im Deutschen idiomatischere »in sie«, weshalb eine Fußnote die Bildsprache erläutert.
- source_word: ወይትወለዱ ውሉደ በላዕሌሆን
  choice: und ihnen durch sie Kinder geboren würden
  rationale: »Kinder« gibt ውሉደ breit und natürlich wieder. Die Passivkonstruktion bewahrt das Geburtsmotiv; »durch sie« bezeichnet die Frauen als die vermittelnden beziehungsweise gebärenden Personen, ohne den Ausdruck enger auszulegen.
- source_word: ከመ ከማሁ
  choice: damit ihnen so
  rationale: Die erneute Zweck- beziehungsweise Folgeangabe und das Element der Art und Weise werden knapp und idiomatisch wiedergegeben.
- source_word: ኢይትኀጐ ግብር
  choice: kein Werk … fehlte
  rationale: ግብር kann Werk, Tat oder Angelegenheit bedeuten. »Werk« hält den weiten Sinn offen und lässt die schwierige Aussage über die Fortdauer irdischen Lebens und Wirkens bestehen.
- source_word: በዲበ ምድር
  choice: auf Erden
  rationale: Die geläufige, würdige deutsche Wendung entspricht der kosmologischen Ortsangabe »auf der Erde«.
theological_decisions:
- issue: Zweck der Gabe der Frauen an die irdischen Wesen
  choice: Fortpflanzung erscheint als Bestandteil der für irdische Geschöpfe gesetzten Ordnung.
  alternative: Die Aussage ausschließlich auf eine bestimmte Eheordnung oder auf eine strafende Zugeständnisregelung zu beziehen.
  rationale: Der Vers selbst nennt Aussaat beziehungsweise Zeugung und Geburt als Zweck. Im Zusammenhang steht dies dem Grenzübertritt der Wächter gegenüber, ohne dass der Wortlaut hier eine engere konfessionelle Deutung festlegt.
- issue: Sinn des abschließenden Satzes über das fehlende Werk
  choice: Die schwer verständliche Formulierung bleibt mit »kein Werk auf Erden fehlte« weitgehend offen.
  alternative: Sie ausdrücklich als ununterbrochene Fortsetzung allen menschlichen Lebens und Handelns auszudeuten.
  rationale: Der Zusammenhang legt die Fortdauer des irdischen Lebens durch Fortpflanzung nahe; die Semantik von ግብር und die Satzbeziehung sind jedoch nicht eindeutig genug, um diese Erklärung in den Haupttext einzubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die auffällige Zeugungsmetapher und die Unbestimmtheit des Schlusssatzes werden nicht geglättet; die Fußnoten machen beides für heutige Leser verständlich.
