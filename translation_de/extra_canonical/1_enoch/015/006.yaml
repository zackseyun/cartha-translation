base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/015/006.yaml
  text: But you, formerly, were spiritual beings, living an eternal life that does not die throughout all the generations of the world.
translation:
  language: de
  text: Ihr aber wart früher Geistwesen[a], die ein ewiges Leben lebten, das durch alle Generationen der Welt[b] hindurch nicht stirbt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geister“; auch: „geistige Wesen“.'
    reason: lexical_alternative
  - marker: b
    text: '„Welt“ kann hier auch „Zeitalter“ oder „Ewigkeit“ bedeuten; entsprechend ist auch der Sinn möglich: „durch alle Generationen in Ewigkeit“.'
    reason: lexical_alternative
  - marker: c
    text: 'Die Formulierung „ein Leben leben“ bildet die Wortfigur des Ausgangstextes nach. Freier: „die mit ewigem, unvergänglichem Leben lebten“.'
    reason: translation_clarity
lexical_decisions:
- source_word: ቀዳሚ
  choice: früher
  rationale: Kennzeichnet im Kontext den früheren Zustand der Wächter, ohne eine genauere kosmologische Abfolge festzulegen.
- source_word: ኮንክሙ
  choice: wart
  rationale: Der kopulative Sinn passt zur prädikativen Beschreibung ihres ursprünglichen Zustands.
- source_word: መንፈሳውያነ
  choice: geistige Wesen
  rationale: Gibt die substantivisch gebrauchte Bezeichnung verständlich wieder, ohne sie vorschnell auf einen engeren Fachbegriff festzulegen.
- source_word: ሕያዋነ ሕይወት ዘለዓለም
  choice: die ein ewiges Leben lebten
  rationale: Bewahrt die figura etymologica beziehungsweise die Konstruktion ‚ein Leben leben‘ und den ausdrücklichen Begriff ‚Leben‘.
- source_word: ዘኢይመውት
  choice: das … nicht stirbt
  rationale: Die Relativkonstruktion und das konkrete Verb ‚sterben‘ bleiben erhalten, auch wenn die Aussage im Deutschen bewusst ungewöhnlich klingt.
- source_word: ለኵሉ ትውልደ ዓለም
  choice: durch alle Generationen der Welt hindurch
  rationale: Gibt die andauernde Zeitspanne über sämtliche Generationen hinweg wieder und lässt die Bedeutungsbreite von ዓለም in einer Fußnote sichtbar.
theological_decisions:
- issue: Bezeichnung des ursprünglichen Zustands der Wächter
  choice: geistige Wesen
  alternative: Geister; Geistwesen
  rationale: Die Formulierung erhält den ontologischen Gegensatz des Kontextes, ohne spätere dogmatische Präzision in den Text einzutragen.
- issue: Bezug von „das nicht stirbt“
  choice: Relativsatz zu „ewiges Leben“
  alternative: freie Wiedergabe als „unsterblich“ auf die Wesen bezogen
  rationale: Die grammatische Spannung der Quelle wird bewahrt, statt sie durch eine theologisch glattere Umschreibung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst markante Wendung „ein ewiges Leben lebten“ bildet die Wortfigur der Vorlage ab; die Fußnoten sichern lexikalische Alternativen und die Mehrdeutigkeit von ዓለም.
