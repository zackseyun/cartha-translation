    issue: „geistige Wesen“ ist mehrdeutig
    rationale: Im heutigen Deutsch kann „geistig“ primär geistig-intellektuell bzw. mental bedeuten. Für መንፈሳውያነ ist „Geistwesen“ als Textwort klarer, ohne stärker zu spezifizieren als die Vorlage.
  - severity: low
    issue: Fußnote c bezeichnet eine freie Umschreibung als sinngemäß
    rationale: Die dortige Formulierung „mit ewigem, unvergänglichem Leben“ glättet die quellennahe Wortfigur und ersetzt „nicht stirbt“ durch eine Abstraktion. Als mögliche freiere Wiedergabe ist sie zwar zulässig, sollte aber nicht als Erläuterung der wörtlichen Konstruktion erscheinen.
