revisions:
- from: Ihr aber wart früher geistige Wesen,[a] die ein ewiges Leben lebten, das durch alle Generationen der Welt[b] hindurch nicht stirbt.[c]
  to: Ihr aber wart früher Geistwesen[a], die ein ewiges Leben lebten, das durch alle Generationen der Welt[b] hindurch nicht stirbt.[c]
  rationale: Die Revision ersetzt ausschließlich die im Deutschen semantisch weniger präzise Hauptbezeichnung „geistige Wesen“ durch „Geistwesen“ und schärft die Erläuterung der quellenbewusst beibehaltenen Wortfigur. Die Satzstruktur, die Ambiguität von ዓለም und der konkrete Relativsatz „das … nicht stirbt“ bleiben erhalten.
