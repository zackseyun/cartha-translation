base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/001.yaml
  text: And there I saw the angels of punishment going about[c][b][a], and they were holding scourges and chains of iron and bronze.
translation:
  language: de
  text: Und dort sah ich die Strafengel umherziehen; sie hielten Geißeln und Ketten aus Eisen und Bronze in den Händen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Bezeichnungen der Strafwerkzeuge und die Zuordnung der Metalle sind im Geʽez nicht ganz eindeutig. Möglich ist auch: »Geißeln sowie eiserne und bronzene Ketten«; die Gegenstände können außerdem als Peitschen beziehungsweise Fesseln verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ፡ በህየ
  choice: Und dort sah ich
  rationale: Gibt die übliche visionäre Berichtsformel und die Ortsangabe knapp und natürlich wieder.
- source_word: ትዕይንታተ፡ መላእክት፡ መቅሠፍት
  choice: die Heerscharen der Strafengel
  rationale: ትዕይንታተ wird hier als »Heerscharen« verstanden und nicht ausgelassen; die Genitivverbindung bezeichnet Engel, die dem Strafgericht zugeordnet sind.
- source_word: እንዘ፡ የሐውሩ
  choice: umherziehen
  rationale: Bewahrt den durativen Eindruck aktiver Bewegung in der geschauten Szene.
- source_word: ወይአሕዙ
  choice: sie hielten … in den Händen
  rationale: Gibt die fortdauernde Handlung anschaulich und in natürlichem Deutsch wieder.
- source_word: መቅሠፍተ፡ ወመማግረ
  choice: Geißeln und Ketten
  rationale: Folgt der Reihenfolge der beiden Strafwerkzeuge im überlieferten Text; ihre genaue Bestimmung ist jedoch nicht völlig sicher.
- source_word: ሐጺን፡ ውብርት
  choice: aus Eisen und Bronze
  rationale: Erhält die beiden Metallbezeichnungen und lässt den Umfang ihrer Zuordnung entsprechend der knappen Ge'ez-Syntax offen.
theological_decisions:
- issue: Wesen der Engelgestalten
  choice: Strafengel als himmlische Vollstrecker des Gerichts
  alternative: Verderbensengel oder Engel der Plage
  rationale: »Strafengel« wahrt den gerichtlichen Charakter der apokalyptischen Szene, ohne spätere dämonologische Vorstellungen einzutragen.
- issue: Bedeutung von ትዕይንታተ
  choice: Heerscharen
  alternative: visionäre Erscheinung bzw. Auslassung als bloßer Hinweis auf das Sehen
  rationale: Im syntaktischen Zusammenhang vor »Engel der Strafe« ist die kollektive Bedeutung »Heerscharen« vorzuziehen; damit bleibt ein im Ausgangstext vorhandenes Substantiv ausdrücklich erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptischer Bildkraft. »Heerscharen« erhält den kollektiven Ausdruck des Ge’ez; »Strafengel« ist verständlich und vermeidet eine umständliche Genitivkette. Der Fußnotenmarker [a] steht im Haupttext.
