base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/007.yaml
  text: And the city of my righteous ones shall be a hindrance to their horses[a]; and they will stir up slaughter among themselves, and their right hand will be strong against them. And a man will not know his brother, nor a son his father or his mother, until the number of the corpses from their death is complete[d][c][b], and their punishment will not be in vain.
translation:
  language: de
  text: Und die Stadt meiner Gerechten wird ihren Pferden zum Hindernis werden[a]. Sie werden untereinander ein Gemetzel anrichten, und ihre rechte Hand wird gegen sie stark sein. Keiner wird seinen Bruder kennen[b], und kein Sohn seinen Vater oder seine Mutter, bis die Zahl der Leichen infolge ihres Sterbens voll ist[c]. Ihre Strafe aber wird nicht vergeblich sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Hemmnis“ oder „zur Falle“. Das ge’ezische Wort bezeichnet etwas, das aufhält oder möglicherweise einfängt.'
    reason: lexical_alternative
  - marker: b
    text: „Kennen“ kann hier auch „erkennen“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: Die Wendung über die Zahl der Leichen und ihr Sterben ist im äthiopischen Text schwer verständlich und wurde deshalb nicht frei geglättet.
    reason: textual_difficulty
lexical_decisions:
- source_word: ሀገረ
  choice: Stadt
  rationale: Das Substantiv kann eine Stadt oder einen besiedelten Ort bezeichnen. „Stadt“ bewahrt hier das konkrete apokalyptische Bild.
- source_word: ጻድቃነ ዚአየ
  choice: meiner Gerechten
  rationale: Die Wendung bezeichnet gerechte Menschen mit einem Possessivbezug der ersten Person; die knappe deutsche Form bewahrt diesen Bezug.
- source_word: ማዕቀፈ
  choice: Hindernis
  rationale: Das Wort bezeichnet etwas, das aufhält, hemmt oder möglicherweise einfängt. „Hindernis“ legt den genauen Mechanismus nicht unnötig fest.
- source_word: አፍራሲሆሙ
  choice: ihren Pferden
  rationale: Die konkrete Bedeutung „Pferde“ erhält das militärische Bild; „Reiterei“ wäre stärker deutend.
- source_word: ያነሥኡ በበ ቢይናቲሆሙ ቀትለ
  choice: Sie werden untereinander ein Gemetzel anrichten
  rationale: Das Verb ist transitiv und hat „Gemetzel/Tötung“ als Objekt. Die reziproke Wendung bezeichnet Gewalt innerhalb der Gruppe.
- source_word: ትጸንዕ የማኖሙ ዲቤሆሙ
  choice: ihre rechte Hand wird gegen sie stark sein
  rationale: Die weitgehend formale Wiedergabe erhält die rechte Hand als Bild kriegerischer Macht und glättet den schwierigen Bezug des Pronomens nicht.
- source_word: ኢያእምር ብእሲ ለአኁሁ
  choice: Keiner wird seinen Bruder kennen
  rationale: „Kennen“ gibt den Grundsinn direkt wieder und lässt offen, ob Nichterkennen oder der Zusammenbruch familiärer Verbundenheit gemeint ist.
- source_word: ኢወልድ ለአቡሁ ወለእሙ
  choice: und kein Sohn seinen Vater oder seine Mutter
  rationale: Das Verb wird entsprechend der knappen Ausgangssyntax aus dem vorhergehenden Satzglied ergänzt.
- source_word: ኍልቈ አብድነት እሞቶሙ
  choice: bis die Zahl der Leichen infolge ihres Sterbens voll ist
  rationale: Die bewusst etwas sperrige Fassung erhält die Verbindung von Zahl, Leichen und Sterben, ohne den textlich schwierigen Ausdruck spekulativ zu vereinfachen.
- source_word: መቅሰፍቶሙ ኢትኩን በከ
  choice: Ihre Strafe aber wird nicht vergeblich sein
  rationale: „Strafe“ ist im Deutschen verständlich und umfasst den möglichen Sinn von Züchtigung oder Geißelung; „nicht vergeblich“ bewahrt die Aussage ihrer Wirksamkeit.
theological_decisions:
- issue: Possessivbezug bei den Gerechten
  choice: „meiner Gerechten“ mit Possessivbezug der ersten Person
  alternative: „der Gerechten“
  rationale: Der vorgelegte ge’ezische Text weist auf einen Bezug der ersten Person. Dieser wird bewahrt, ohne die Sprecheridentität dogmatisch weiter auszudeuten.
- issue: Art des geschilderten Konflikts
  choice: wechselseitige Gewalt innerhalb der genannten Gruppe
  alternative: Tötung durch eine äußere Streitmacht
  rationale: Die reziproke Formulierung „untereinander“ und der anschließende Zerfall familiärer Beziehungen sprechen für interne Gewalt; die apokalyptische Spannung bleibt dabei erhalten.
- issue: Bedeutung des Nichtkennens von Angehörigen
  choice: wörtliches „kennen“
  alternative: „erkennen“ oder „anerkennen“
  rationale: Die Grundbedeutung wird im Haupttext beibehalten, damit offenbleibt, ob fehlendes Wiedererkennen oder der Zusammenbruch familiärer Bindungen im Vordergrund steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltenen apokalyptischen Bildern. Die schwierige Leichenklausel bleibt transparent und leicht sperrig; unnötige konfessionelle oder dogmatische Präzisierungen wurden vermieden.
