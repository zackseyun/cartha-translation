base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/005.yaml
  text: And in those days the angels will return and turn their heads toward the east[a], toward the people of Parthia and Media. They will stir up the kings, and a spirit of turmoil will come upon them; it will unsettle them from their thrones, and they will go out like lions from their lairs[c][b], and like hungry wolves in the midst of their pasture.
translation:
  language: de
  text: Und in jenen Tagen werden die Engel zurückkehren und ihre Köpfe nach Osten wenden, zu den Völkern von Parthien und Medien. Sie werden die Könige[a] in Aufruhr versetzen, und ein Geist des Aufruhrs[b] wird über sie kommen; er wird sie von ihren Thronen aufscheuchen, und sie werden wie Löwen aus ihren Lagern hervorziehen und wie hungrige Wölfe mitten auf ihrer Weide.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Lesung an dieser Stelle ist schwierig. »Könige« ist aufgrund der anschließend genannten Throne wahrscheinlich; möglich wäre allgemeiner auch ein Bezug auf Herrscher.
    reason: textual_variant
  - marker: b
    text: 'Oder: »ein Geist der Verwirrung«. Der Ausdruck kann eine Macht oder einen Zustand der Unordnung bezeichnen, ohne eindeutig festzulegen, ob ein persönliches Geistwesen gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  choice: in jenen Tagen
  rationale: Bewahrt die geläufige apokalyptische Zeitformel und den Plural des Ausgangstextes.
- source_word: ይገብኡ መላእክት
  choice: die Engel werden zurückkehren
  rationale: ይገብኡ ist im vorliegenden Grundtext der Imperfekt von ገብአ, »zurückkehren«; die Lesart »sich versammeln« gehört zu einer anderen Verbalform bzw. Variante.
- source_word: ይወድዩ አርእስቲሆሙ
  choice: ihre Köpfe … wenden
  rationale: Erhält das konkrete Körperbild und klingt zugleich natürlich im Deutschen.
- source_word: ለምሥራቅ
  choice: nach Osten
  rationale: Gibt die konkrete geografische Richtung knapp und idiomatisch wieder.
- source_word: ለኀበ ሰብአ ጳርቴ ወሙዴ
  choice: zu den Völkern von Parthien und Medien
  rationale: Bewahrt den ausdrücklichen Bezug auf die Menschen bzw. Völker dieser beiden Regionen.
- source_word: የሐውክዎሙ
  choice: in Aufruhr versetzen
  rationale: Gibt den kausativen Sinn des Beunruhigens, Verwirrens oder Aufstörens mit der politischen Dynamik des Zusammenhangs wieder.
- source_word: ለዝንቱ
  choice: die Könige
  rationale: Die überlieferte Form ist schwierig; der folgende Bezug auf ihre Throne stützt jedoch »Könige« bzw. Herrscher als gemeinten Gegenstand. Die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: መንፈሰ ሀውክ
  choice: ein Geist des Aufruhrs
  rationale: Bewahrt sowohl die Geist-Terminologie als auch die Bedeutung von Unruhe und Unordnung, ohne festzulegen, ob ein persönliches Geistwesen gemeint ist.
- source_word: እመንበረሆሙ
  choice: von ihren Thronen
  rationale: Im königlichen Kontext ist »Throne« gegenüber dem allgemeineren »Sitze« sachlich und bildlich angemessen.
- source_word: ከመ አናብስት እምስካባቲሆሙ
  choice: wie Löwen aus ihren Lagern
  rationale: Erhält das Raubtierbild; »Lager« ist würdig und weniger missverständlich als eine allzu häusliche Wiedergabe.
- source_word: ከመ አዝእብት ርኁባን
  choice: wie hungrige Wölfe
  rationale: Gibt Tierbezeichnung und Hunger unmittelbar, verständlich und bedrohlich wieder.
- source_word: ማእከለ መርዔት ዚአሆሙ
  choice: mitten auf ihrer Weide
  rationale: Bewahrt das Bild des Weide- bzw. Grasungsortes, ohne ausdrücklich Herden in den Text einzutragen.
theological_decisions:
- issue: Ob መንፈሰ ሀውክ ein persönliches Geistwesen oder eine wirksame Macht bzw. Lage der Unordnung bezeichnet
  choice: ein Geist des Aufruhrs
  alternative: ein Geist der Verwirrung / Aufruhr
  rationale: Der unbestimmte Artikel und die Kleinschreibung bewahren die ontologische Offenheit des Ausdrucks; weder ein benanntes dämonisches Wesen noch eine rein unpersönliche Stimmung wird vorausgesetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit apokalyptischer Bildkraft. Der Satzbau folgt der fortschreitenden Bewegung des geezischen Textes, wird aber durch deutsche Zeichensetzung übersichtlich gegliedert. Textkritische und theologische Unsicherheiten werden nicht stillschweigend aufgelöst.
