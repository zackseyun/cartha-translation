base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/003.yaml
  text: And he said to me[a], 'To their chosen ones and to their beloved ones[c][b], so that they may be cast into the chasm of the abyss of the valley.'
translation:
  language: de
  text: 'Und er sagte zu mir[a]: »Zu ihren Auserwählten und zu ihren Geliebten, damit sie in die Kluft des Abgrunds im Tal[b] geworfen werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Satz knüpft an die Frage im vorhergehenden Vers an. Wer mit »ihren Auserwählten« und »ihren Geliebten« gemeint ist, wird in diesem Vers allein nicht ausdrücklich gesagt.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlicher auch: »in die Kluft des Abgrunds des Tales«; möglich sind zudem »Spalte« oder »Felsspalte«. Die genaue räumliche Beziehung der drei Begriffe bleibt unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይቤለኒ
  choice: Und er sagte zu mir
  rationale: Die übliche erzählerische Formel leitet eine Erklärung innerhalb der Vision ein; die direkte Redeweise bleibt erhalten.
- source_word: ለሕሩያነ፡ ዚአሆሙ
  choice: zu ihren Auserwählten
  rationale: Das Präfix ለ wird entsprechend der Frage nach dem Ziel in Vers 2 mit „zu“ wiedergegeben; ዚአሆሙ ist als Possessivform „ihren“ zu verstehen, nicht als Demonstrativsatz.
- source_word: ወለፍቁራኒሆሙ
  choice: und zu ihren Geliebten
  rationale: Die Form bezeichnet geliebte oder nahestehende Personen. „Geliebte“ wahrt den gehobenen Ton und legt ihre genaue Beziehung nicht fest.
- source_word: ከመ፡ ይትወደዩ
  choice: damit sie … geworfen werden
  rationale: Die passive Ziel- beziehungsweise Folgekonstruktion beschreibt das gewaltsame Hineingelangen an den Gerichtsort, ohne die Stärke durch eine zusätzliche Deutung zu überzeichnen.
- source_word: ውስተ፡ ንቅዐተ
  choice: in die Kluft
  rationale: Das Substantiv bezeichnet eine Spalte, Öffnung oder Kluft; „Kluft“ erhält die bedrohliche topografische Bildsprache.
- source_word: ማዕምቅ
  choice: des Abgrunds
  rationale: „Abgrund“ gibt die Vorstellung unergründlicher Tiefe und ihren apokalyptischen Klang natürlich wieder.
- source_word: ዘቈላ
  choice: im Tal
  rationale: Die Form bezeichnet das Tal und schließt die Ortsangabe ab. Die deutsche Fassung glättet die schwerfällige Genitivkette, ohne die topografischen Bildelemente aufzugeben.
theological_decisions:
- issue: Bezug von „ihren Auserwählten“ und „ihren Geliebten“
  choice: Die Gruppenbezeichnungen und das Possessivpronomen bleiben stehen, ohne ihre Identität näher festzulegen.
  alternative: Die Ausdrücke ausdrücklich auf eine herrschende Gruppe, deren Verbündete oder eigens zum Gericht Bestimmte beziehen.
  rationale: Der einzelne Vers nennt den Bezug nicht eindeutig. Eine Festlegung würde die im äthiopischen Text bestehende Spannung auflösen und zusätzliche Interpretation eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit apokalyptischer Bildkraft. Die syntaktisch schwierige Zielangabe bleibt als fragmentarisch wirkende Antwort auf den vorhergehenden Vers erhalten; die topografische Genitivkette wird nur behutsam geglättet.
