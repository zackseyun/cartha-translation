base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/006.yaml
  text: And they shall go up and tread upon the land of his chosen ones[b][a], and the land of his chosen ones shall become before them a trampled place and a beaten path.
translation:
  language: de
  text: Und sie werden hinaufziehen und das Land seiner Erwählten betreten[b]; und das Land seiner Erwählten wird vor ihnen zu zertretenem Boden und zu einem ausgetretenen Pfad werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der ge’ezische Wortlaut ist schwierig. Das abschließende Ausdruckspaar verstärkt wahrscheinlich das Bild: Das Land wird zertreten und gleicht einer ausgetretenen Spur oder einem ausgetretenen Pfad.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „sie werden hinaufziehen und über das Land seiner Erwählten marschieren“. Die Verben können sowohl eine militärische Vorwärtsbewegung als auch ein buchstäbliches Betreten oder Zertreten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: የዓርግዋ
  choice: sie werden hinaufziehen
  rationale: Das Verb bezeichnet eine Aufwärtsbewegung. „Hinaufziehen“ bewahrt diese konkrete Bedeutung und lässt zugleich, passend zum apokalyptisch-militärischen Zusammenhang, den Sinn eines feindlichen Vorrückens offen.
- source_word: ይከይድዋ
  choice: betreten
  rationale: Die Wurzel bezeichnet Gehen, Schreiten oder Treten. „Betreten“ hält die Verbindung zu den folgenden Bildern des zertretenen Bodens und des ausgetretenen Pfades aufrecht, ohne die Intensität vorschnell auf „niedertrampeln“ festzulegen.
- source_word: ምድረ
  choice: Land
  rationale: Gemeint ist hier das Gebiet der Erwählten, nicht notwendig die Erde als Ganzes. „Land“ ist daher im Deutschen natürlich und sachlich präzise.
- source_word: ኅሩያነ
  choice: Erwählten
  rationale: „Die Erwählten“ gibt die für 1 Henoch charakteristische Gruppenbezeichnung verständlich und theologisch zurückhaltend wieder.
- source_word: ዚአሁ
  choice: seiner
  rationale: Das Possessivpronomen wird beibehalten, ohne seinen im Vers nicht ausdrücklich genannten Bezug durch „Gottes“ oder „des Herrn“ zu verdeutlichen.
- source_word: በቅድሜሆሙ
  choice: vor ihnen
  rationale: Die Wendung kann räumlich oder situativ verstanden werden. „Vor ihnen“ erhält diese Offenheit und das Bild des den Angreifern preisgegebenen Landes.
- source_word: ምካይደ
  choice: zertretener Boden
  rationale: Das Substantiv ist offenbar mit dem vorangehenden Verb des Gehens oder Tretens verwandt. Die Wiedergabe wahrt diese Wortverbindung und bezeichnet das Ergebnis des Betretens beziehungsweise Zertretens.
- source_word: አሰረ
  choice: ein ausgetretener Pfad
  rationale: Das Wort bezeichnet wahrscheinlich einen Weg oder eine Spur. „Ausgetretener Pfad“ verstärkt das konkrete Bild wiederholten Darübergehens und entspricht der parallelen Schlusswendung.
theological_decisions:
- issue: Bezug von „seiner“ in „seiner Erwählten“
  choice: Das Pronomen „seiner“ bleibt ohne ausdrückliche Identifizierung seines Bezugs stehen.
  alternative: „Gottes Erwählten“ oder „den Erwählten des Herrn“
  rationale: Der ge’ezische Text enthält nur das Pronomen. Eine ausdrückliche Nennung Gottes oder des Herrn würde die im Einzelvers vorhandene Unbestimmtheit auflösen und über den Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der militärische Unterton bleibt erkennbar, wird aber nicht stärker festgelegt als im ge’ezischen Wortlaut. Die Wiederholung von „das Land seiner Erwählten“ und das bildhafte Schlussparallelepaar werden bewusst erhalten.
