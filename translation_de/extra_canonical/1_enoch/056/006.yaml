  source_fidelity: Die Übersetzung gibt die Abfolge der geʽezischen Verben und die Wiederholung von „das Land seiner Erwählten“ zuverlässig wieder. „Hinaufziehen“ wahrt die Aufwärts-/Vorrückbewegung; „betreten“ bleibt gegenüber stärker deutenden Möglichkeiten wie „niedertrampeln“ zurückhaltend, während die anschließende Bildsprache von zertretenem Boden und ausgetretenem Pfad die erkennbare Verbindung zum Gehen/Treten aufnimmt. Der unbestimmte Bezug des Possessivpronomens wird korrekt nicht ergänzt.
  naturalness: Modernes, würdiges Standarddeutsch. Die Satzperiode und die bewusste Wiederholung sind gut lesbar und dem apokalyptischen Register angemessen. „Vor ihnen“ wirkt leicht formell, entspricht aber der räumlich-situativen Offenheit des Textes und ist hier stilistisch tragfähig.
  terminology: „Erwählte“ ist für die enochische Gruppenbezeichnung angemessen und konsistent. „Land“, „zertretener Boden“ und „ausgetretener Pfad“ geben die konkreten, parallelen Schlussbilder verständlich wieder, ohne ein konfessionelles Verständnis einzutragen. Die Fußnoten sind korrekt verankert und erläutern Unsicherheit beziehungsweise lexikalische Alternative sachlich.
