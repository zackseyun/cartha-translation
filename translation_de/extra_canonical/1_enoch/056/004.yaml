base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/004.yaml
  text: And in those days that valley will be filled with the chosen and with their beloved ones[a], and the days of their lives will be ended[f][e][d][c][b], and the days of their wandering will no longer be counted from then on.
translation:
  language: de
  text: Und in jenen Tagen wird jenes Tal mit den Erwählten und ihren Geliebten[a] gefüllt werden. Die Tage ihres Lebens werden enden, und die Tage ihres Umherirrens[b] werden von da an nicht mehr gezählt werden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die genaue Beziehung dieser Personen zu den Erwählten bleibt unsicher; auch möglich: »den ihnen Nahestehenden« oder »denen, die ihnen lieb sind«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »ihres Irrtums« oder »ihres Abirrens«.'
    reason: lexical_alternative
  - marker: c
    text: Die Schlussformulierung ist im Äthiopischen schwierig. Statt »gezählt« kommt auch »angerechnet« in Betracht.
    reason: alternative_reading
lexical_decisions:
- source_word: እሜሃ
  choice: in jenen Tagen
  rationale: Bewahrt die apokalyptische Zeitformel in natürlichem, gehobenem Deutsch.
- source_word: ውእቱ ቈላ
  choice: dieses Tal
  rationale: ቈላ bezeichnet hier ein Tal und wahrt den topografischen Zusammenhang mit dem vorausgehenden Vers.
- source_word: ሕሩያን
  choice: die Erwählten
  rationale: Bewahrt die titelartige Bedeutung des Schlüsselbegriffs in den Bilderreden, ohne ihn konfessionell weiter auszudeuten.
- source_word: ፍቁራነ ዚአሆሙ
  choice: die ihnen Nahestehenden
  rationale: Gibt die Zugehörigkeits- und Zuneigungsbeziehung idiomatisch wieder, ohne ungesichert festzulegen, ob ausschließlich geliebte Personen gemeint sind.
- source_word: ይትዌዳእ
  choice: werden zu Ende gehen
  rationale: Das Verb bezeichnet hier das Zu-Ende-Gehen beziehungsweise Vollendetwerden der Lebenstage und muss als eigenes Prädikat erhalten bleiben.
- source_word: ዕለተ ስሕተቶሙ
  choice: die Tage ihres Umherirrens
  rationale: Bewahrt sowohl das Bild des Irrens als auch seinen möglichen moralisch-geistlichen Beiklang, ohne vorschnell »Sünde« einzusetzen.
- source_word: እምይእዜ ኢትትኌለቍ
  choice: werden von da an nicht mehr gezählt werden
  rationale: Folgt dem wahrscheinlichsten Zähl- beziehungsweise Anrechnungssinn der schwierigen Schlussformel und wahrt deren zeitlichen Ausgangspunkt.
theological_decisions:
- issue: Bezeichnung der Gruppe durch ሕሩያን
  choice: die Erwählten
  alternative: die Auserwählten; die Erwählten Gottes
  rationale: »Die Erwählten« erhält die gewichtige Gruppenbezeichnung, ohne durch »Gottes« eine im Vers nicht ausdrücklich stehende Ergänzung einzuführen.
- issue: Deutung von ስሕተት
  choice: Umherirren
  alternative: Irrtum; Abirren; Sünde
  rationale: Die Übersetzung lässt die Spannung zwischen tatsächlichem Umherirren und moralisch-geistlichem Fehlgehen bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit apokalyptischem Sprachklang. Die zwei verschiedenen Prädikate — das Ende der Lebenstage und das Nicht-mehr-Zählen der Tage des Irrens — werden klar getrennt. Alle Fußnotenmarker stehen unmittelbar bei der betreffenden Formulierung.
