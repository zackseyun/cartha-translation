  source_fidelity: 'Die Übersetzung trennt zutreffend die beiden Prädikate: Die Tage des Lebens enden, während die Tage des Umherirrens fortan nicht mehr gezählt werden. »Tal«, »die Erwählten« und die temporale Formel sind quellentreu. »die ihnen Nahestehenden« schwächt jedoch die ausdrückliche Zuneigungssemantik von ፍቁራነ ab; die Unsicherheit betrifft die genaue Referenz bzw. Beziehung, nicht das Element des Geliebtseins selbst.'
