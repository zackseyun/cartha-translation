  verdict: revise
  source_fidelity: 'Die Abfolge und Bildsprache entsprechen dem geezischen Text gut: Scheol öffnet ihren Mund, die Betroffenen sinken hinein, das Verderben verfolgt sie, und Scheol verschlingt die Sünder. Besonders zutreffend ist „Das Verderben wird sie verfolgen“ für das ausdrücklich vorhandene Verb ትትሎሙ. Die letzte Präpositionalphrase sollte im Deutschen jedoch klarer an die Entfernung „vom Angesicht der Auserwählten“ gebunden werden.'
  naturalness: „Der Scheol“ mit maskulinen Pronomen ist im modernen Deutschen für das im Ausgangstext feminine ሲኦል weniger angemessen; „die Scheol“ ist die sachgerechte Form. Außerdem ist „vor dem Angesicht der Auserwählten hinweg verschlingen“ syntaktisch schwer verständlich. „vom Angesicht der Auserwählten hinwegverschlingen“ stellt den beabsichtigten Bezug klarer her und bewahrt das Verschlingungsbild.
  terminology: „Scheol“, „Verderben“, „Sünder“ und „Auserwählte“ sind angemessen und ohne spätere dogmatische Einengung gewählt. „Auserwählte“ gibt ኅሩያን idiomatisch wieder.
  issues:
  - severity: medium
    issue: Genus von „Scheol“
    rationale: Die geezische Personifikation ist feminin; die im Deutschen übliche feminine Form „die Scheol“ bewahrt dies. Die maskuline Form im Entwurf („der Scheol“, „seinen“, „ihn“) ist terminologisch weniger passend.
  - severity: medium
    issue: Stellung von „hinweg“ in der Schlussklausel
    rationale: In „vor dem Angesicht der Auserwählten hinweg verschlingen“ bleibt unklar, worauf „hinweg“ syntaktisch bezogen ist. Die Verbindung „vom Angesicht der Auserwählten hinwegverschlingen“ gibt die Präposition እም („von/weg von“) und die Entfernung aus ihrer Gegenwart klarer wieder.
  revised_text: Und in jenen Tagen wird die Scheol ihren Mund öffnen, und sie werden in sie hinabsinken. Das Verderben wird sie verfolgen, und die Scheol wird die Sünder vom Angesicht der Auserwählten hinwegverschlingen.[a]
