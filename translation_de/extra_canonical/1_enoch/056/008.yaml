base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/008.yaml
  text: And in those days Sheol will open its mouth[a], and they will sink down into it; and destruction will pursue them[c][b]; Sheol will swallow up the sinners from before the face of the chosen ones.
translation:
  language: de
  text: Und in jenen Tagen wird die Scheol ihren Mund öffnen, und sie werden in sie hinabsinken. Das Verderben wird sie verfolgen, und die Scheol wird die Sünder vom Angesicht der Auserwählten hinwegverschlingen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „vom Angesicht der Auserwählten“; die Wendung bezeichnet die Entfernung aus ihrer Gegenwart.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  choice: in jenen Tagen
  rationale: Bewahrt die wiederkehrende apokalyptische Zeitformel in gehobenem, aber verständlichem Deutsch.
- source_word: ሲኦል አፉሃ
  choice: der Scheol seinen Mund
  rationale: Der Eigenbegriff „Scheol“ erhält die Vorstellung des personifizierten Totenreichs; „seinen Mund“ gibt das konkrete Bild direkt wieder.
- source_word: ወይስጠሙ ውስቴታ
  choice: sie werden in ihn hinabsinken
  rationale: Gibt sowohl die Abwärtsbewegung als auch das Versinken in den geöffneten Scheol wieder, ohne bereits das folgende Verschlingen vorwegzunehmen.
- source_word: ወትትሎሙ ኀጕሎን
  choice: Das Verderben wird sie verfolgen
  rationale: Berücksichtigt das im überlieferten geezischen Text vorhandene Verb „folgen/verfolgen“ und ኀጕሎን als dessen Subjekt. „Verfolgen“ vermittelt die bedrohliche Bewegung im Deutschen natürlicher als das bloße „folgen“.
- source_word: ሲኦል ይውሕጦሙ
  choice: der Scheol wird ... verschlingen
  rationale: Bewahrt die starke, personifizierende Bildsprache des verschlingenden Totenreichs.
- source_word: ለኃጥኣን
  choice: die Sünder
  rationale: Entspricht der direkten Personenbezeichnung und vermeidet die interpretierende Erweiterung zu „Gottlosen“.
- source_word: እምቅድመ ገጸ ኅሩያን
  choice: vor dem Angesicht der Auserwählten hinweg
  rationale: Erhält die konkrete semitische Wendung „vor dem Angesicht“ und macht durch „hinweg“ deutlich, dass die Sünder aus ihrer Gegenwart entfernt werden.
theological_decisions:
- issue: Wiedergabe von ሲኦል
  choice: Scheol
  alternative: Totenreich; Hölle; Grab
  rationale: „Scheol“ bewahrt die alte apokalyptische Vorstellung eines personifizierten Bereichs der Toten, ohne spätere Lehrvorstellungen mit „Hölle“ einzutragen oder das Bild auf ein einzelnes Grab zu verengen.
- issue: Wiedergabe von ኅሩያን
  choice: Auserwählte
  alternative: Erwählte; die Erwählten
  rationale: „Auserwählte“ ist im Deutschen klar und gibt die lokale enochische Bezeichnung wieder, ohne sie unnötig an eine spätere konfessionelle Terminologie anzugleichen.
translation_notes:
  register: Moderne, würdige Standardsprache mit erhaltener apokalyptischer Bildhaftigkeit. Die Satzglieder folgen eng der geezischen Abfolge; ein Punkt entlastet die lange Reihung, ohne ihren Zusammenhang aufzulösen.
