revisions:
- from: Und in jenen Tagen wird der Scheol seinen Mund öffnen, und sie werden in ihn hinabsinken. Das Verderben wird sie verfolgen, und der Scheol wird die Sünder vor dem Angesicht der Auserwählten hinweg verschlingen.[a]
