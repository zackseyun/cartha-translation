  rationale: Die Revision korrigiert das Genus von „Scheol“ und ordnet die Schlussklausel so, dass die Entfernung „vom Angesicht der Auserwählten“ im Deutschen eindeutig ist. Alle wesentlichen Bilder und Satzglieder des geezischen Textes bleiben erhalten; insbesondere wird das textlich wichtige „Das Verderben wird sie verfolgen“ nicht verändert.
