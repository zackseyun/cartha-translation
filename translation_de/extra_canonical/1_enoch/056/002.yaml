  source_fidelity: Der Entwurf gibt die entscheidende Zielfrage ለመኑ የሐውሩ korrekt als „Zu wem gehen …?“ wieder und bewahrt damit das im Geʽez ausdrücklich vorhandene Bewegungsverb. Auch die Bezeichnung „Engel des Friedens“ sowie die konkrete, jedoch nicht übermäßig interpretierende Wiedergabe von መቅሠፍተ als „Geißeln“ sind sachgerecht.
  naturalness: Die Abfolge „Zu wem gehen sie, diese, die …?“ ist verständlich, wirkt im modernen Standarddeutsch jedoch unnötig gespalten und lässt „sie“ und „diese“ kurz konkurrieren. Mit vorangestelltem Demonstrativum ist die Frage flüssiger und bleibt ebenso nachdrücklich deiktisch.
  terminology: „Engel des Friedens“ ist als etablierte, quellennähere Genitivverbindung beizubehalten. „Geißeln“ ist im Kontext des Haltens als konkrete Bedeutung vertretbar; die Fußnote sollte die mögliche weitere Bedeutung als Strafwerkzeug bzw. Strafe offenhalten.
