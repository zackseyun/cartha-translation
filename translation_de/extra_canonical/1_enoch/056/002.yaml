base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/056/002.yaml
  text: And I asked the angel of peace who went with me, saying, “To whom are they going, these who hold the scourges?”
translation:
  language: de
  text: 'Und ich fragte den Engel des Friedens, der mit mir ging: „Zu wem gehen diese, die die Geißeln[a] halten?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Strafwerkzeuge“; das geʽezische Wort kann sowohl die Strafe selbst als auch das Mittel bezeichnen, mit dem sie zugefügt wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስእልክዎ
  choice: ich fragte
  rationale: Das Verb bezeichnet hier unmittelbar Henochs Frage an den begleitenden Engel; „fragte“ ist natürlich und präzise.
- source_word: መልአክ ሰላም
  choice: Engel des Friedens
  rationale: Die Genitivverbindung wird bewahrt und nicht zu einer bloßen Eigenschaft des Engels verflacht.
- source_word: ዘየሐውር ምስሌየ
  choice: der mit mir ging
  rationale: Die Wiedergabe erhält sowohl die Relativkonstruktion als auch die Bewegung innerhalb der Vision.
- source_word: እንዘ እብል
  choice: direkte Rede nach Doppelpunkt
  rationale: Die Redeeinleitung ist im Deutschen durch den Doppelpunkt idiomatisch ausgedrückt; ein zusätzliches „indem ich sagte“ wäre schwerfällig.
- source_word: ለመኑ የሐውሩ
  choice: Zu wem gehen sie
  rationale: ለመኑ bezeichnet das Ziel beziehungsweise den Adressaten („zu wem“), und የሐውሩ muss als „gehen sie“ wiedergegeben werden.
- source_word: እሉ እለ
  choice: diese, die
  rationale: Die demonstrative, auf sichtbare Gestalten weisende Kraft bleibt erhalten.
- source_word: ይአኅዙ
  choice: halten
  rationale: „Halten“ bleibt neutral zwischen bloßem Tragen und einsatzbereitem Festhalten.
- source_word: መቅሠፍተ
  choice: Geißeln
  rationale: Der unmittelbare Zusammenhang mit „halten“ legt ein konkretes Strafwerkzeug nahe; „Geißeln“ wahrt zugleich die apokalyptische Bildlichkeit.
theological_decisions:
- issue: Abstrakte oder konkrete Wiedergabe von መቅሠፍተ
  choice: 'konkret: „Geißeln“'
  alternative: „Strafwerkzeuge“ oder abstrakt „Strafen“
  rationale: Da die Gestalten das Bezeichnete „halten“, ist die konkrete instrumentale Bedeutung im Kontext wahrscheinlicher. Die Fußnote hält die weitere lexikalische Möglichkeit offen.
- issue: Frage nach Identität oder Ziel
  choice: 'Frage nach dem Ziel: „Zu wem gehen sie?“'
  alternative: „Wer sind diese?“
  rationale: Die Präposition in ለመኑ und das ausdrücklich vorhandene Verb የሐውሩ verlangen eine Frage nach Ziel oder Adressat, nicht nach Identität.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht markierte Nachstellung „diese, die …“ bewahrt die deiktische Struktur der Vision, ohne die Frage nach dem Ziel in eine Identitätsfrage umzudeuten.
