base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/088/001.yaml
  text: And I saw one of those four who had come out first, and he seized that first star which had fallen from heaven, and bound its hands and its feet, and threw it into the abyss. And that abyss was narrow and deep and dreadful and dark.
translation:
  language: de
  text: Und ich sah einen von jenen vier, die zuerst hervorgekommen waren,[a] und er ergriff jenen ersten Stern, der vom Himmel gefallen war,[b] fesselte seine Hände und Füße und warf ihn in den Abgrund.[c] Und dieser Abgrund war eng und tief und furchtbar und dunkel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die vorher hervorgekommen waren«. Das zugrunde liegende Wort kann zeitliche Vorrangigkeit ausdrücken; ein zusätzliches »vor ihnen« steht nicht im ge''ezischen Text.'
    reason: lexical_alternative
  - marker: b
    text: Der »Stern« wird mit Händen und Füßen dargestellt. Das weist darauf hin, dass das visionäre Symbol für ein persönliches himmlisches Wesen unter Gericht steht.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich auch: »in die Tiefe«. »Abgrund« bewahrt hier die apokalyptische Vorstellung eines Ortes der Gefangenschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: Und ich sah
  rationale: Bewahrt die übliche Erzählformel einer Vision in klarem, modernem Deutsch.
- source_word: አሐደ፡ እምእልኩ፡ ፬እለ
  choice: einen von jenen vier
  rationale: Gibt die Auswahl aus einer bereits erwähnten Vierergruppe und den rückverweisenden Charakter von »jenen« wieder.
- source_word: ወፅኡ፡ እምቅዳሚ
  choice: die zuerst hervorgekommen waren
  rationale: Versteht እምቅዳሚ adverbial als »zuerst« beziehungsweise »vorher« und fügt kein im Text fehlendes Pronomen hinzu.
- source_word: አሐዘ
  choice: ergriff
  rationale: Passt zur gewaltsamen Festnahme und anschließenden Fesselung.
- source_word: ለዝኩ፡ ኮከብ፡ ቀዳማይ
  choice: jenen ersten Stern
  rationale: Bewahrt Demonstrativ und Ordnungszahl sowie den Rückbezug auf den zuvor gesehenen Stern.
- source_word: ዘወድቀ፡ እምሰማየ
  choice: der vom Himmel gefallen war
  rationale: Kennzeichnet den Fall als vorausgehendes Ereignis und erhält die apokalyptische Raumvorstellung.
- source_word: ወአሰረ፡ እደዊሁ፡ ወእገሪሁ
  choice: fesselte seine Hände und Füße
  rationale: Das Deutsche verlangt beim grammatisch maskulinen »Stern« maskuline Possessivformen; Hände und Füße lassen zugleich die personale Wirklichkeit hinter dem Bild erkennen.
- source_word: ወወደዮ፡ ውስተ፡ ማዕምቅ
  choice: warf ihn in den Abgrund
  rationale: Gibt die gewaltsame Strafhandlung natürlich wieder; »Abgrund« erhält das Bild eines apokalyptischen Haftortes.
- source_word: ጸቢብ፡ ወዕሙቅ፡ ወዕጹብ፡ ወጽልመት
  choice: eng und tief und furchtbar und dunkel
  rationale: Die wiederholten Konjunktionen bewahren die kumulative, eindringliche Reihung; »furchtbar« gibt die erschreckende Qualität im Gerichtskontext wieder.
theological_decisions:
- issue: Ob der gefallene »Stern« im Haupttext als Engel bezeichnet werden soll
  choice: Das Bildwort »Stern« bleibt erhalten; Hände und Füße zeigen seine personale Dimension.
  alternative: Den Stern unmittelbar als Engel wiedergeben.
  rationale: Der ge'ezische Text nennt ausdrücklich einen Stern. Eine Auflösung des Symbols als »Engel« würde Interpretation in den Haupttext eintragen.
- issue: Geschlecht der Pronomen beim Stern
  choice: Maskuline Formen »seine« und »ihn« gemäß dem grammatischen Geschlecht des deutschen Wortes »Stern«.
  alternative: Neutrale Umschreibungen verwenden, um die Symbolgestalt stärker hervorzuheben.
  rationale: Die maskulinen Formen sind grammatisch erforderlich und natürlich, ohne die Identität des Sterns ausdrücklich festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter visionärer Bildsprache. Die polysyndetische Schlussreihe bleibt zur Wiedergabe der eindringlichen ge'ezischen Syntax erhalten.
