base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/088/002.yaml
  text: And one of them drew a sword and gave it to those elephants and camels and donkeys[a], and they began to strike one another.
translation:
  language: de
  text: Und einer von ihnen zog ein Schwert und gab es jenen Elefanten, Kamelen und Eseln. Da begannen sie, aufeinander einzuschlagen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der äthiopische Wortlaut am Ende des Verses ist schwierig. Gemeint ist offenbar, dass die Tiere nach der Übergabe des Schwertes begannen, einander Gewalt anzutun; »aufeinander einzuschlagen« ist eine vorsichtige Wiedergabe.
    reason: textual_variant
lexical_decisions:
- source_word: መላሕ ሰይፈ
  choice: zog ein Schwert
  rationale: In Verbindung mit »Schwert« bezeichnet das Verb hier am ehesten das Ziehen der Waffe; die konkrete Bildsprache der Vision bleibt erhalten.
- source_word: ወወሀቦሙ
  choice: und gab es
  rationale: Die schlichte Übergabeformulierung entspricht dem geradlinigen Erzählstil und deutet die symbolische Handlung nicht aus.
- source_word: ለእልኩ ነጌያት ወአገማል ወአእዱግ
  choice: jenen Elefanten, Kamelen und Eseln
  rationale: Die ausdrücklich genannten Tiere werden als Gestalten der Vision wörtlich wiedergegeben; moderne, allgemein verständliche Tierbezeichnungen vermeiden unnötig altertümliche Sprache.
- source_word: አንዘ እንዘ ይትደአ
  choice: Da begannen sie, aufeinander einzuschlagen
  rationale: Der schwierige Schluss wird vorsichtig als Einsetzen wechselseitiger körperlicher Gewalt wiedergegeben. »Aufeinander einzuschlagen« klingt im modernen Deutsch natürlich und bewahrt die konkrete Gewalttätigkeit.
theological_decisions:
- issue: Deutung der Tierbilder
  choice: Die Tierbezeichnungen bleiben im Haupttext als visionäre Symbole stehen.
  alternative: Die Tiere unmittelbar als Völker oder Heere wiederzugeben.
  rationale: Die Tierapokalypse vermittelt ihre Aussage durch symbolische Tiere. Eine historische Identifizierung im Übersetzungstext würde Bild und Deutung unzulässig miteinander verschmelzen.
- issue: Subjekt und Richtung der Gewalt im schwierigen Versschluss
  choice: Die Tiere beginnen, wechselseitig aufeinander einzuschlagen.
  alternative: Eine allgemeinere Wiedergabe wie »sie kämpften miteinander« oder eine nicht wechselseitige Handlung.
  rationale: Der überlieferte äthiopische Wortlaut am Ende ist schwierig. Die vorsichtige Fassung bewahrt den aus dem Zusammenhang erschließbaren Beginn gegenseitiger Gewalt, ohne Einzelheiten hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit einfacher erzählerischer Syntax. Die apokalyptische Tierbildsprache bleibt konkret und wird nicht historisierend aufgelöst. Der Fußnotenmarker steht unmittelbar nach der vollständigen Aufzählung, bevor die textlich schwierige Folgehandlung wiedergegeben wird.
