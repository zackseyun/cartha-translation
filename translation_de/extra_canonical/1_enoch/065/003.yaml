  verdict: revise
  source_fidelity: Die direkte Frage, die Lokalangabe, die Erschütterung der Erde und die durch »vielleicht« ausgedrückte Befürchtung entsprechen dem ge'ezischen Text gut. Bei ከመዝ ሰርሐት bleibt jedoch »hat solche Mühsal erlitten« zu weit vom aktiven, bildhaften Ausdruck entfernt und verschiebt das deiktische »so/auf diese Weise« zu einer nicht näher bestimmten »Mühsal«.
  naturalness: Der Entwurf ist insgesamt flüssiges, würdiges modernes Standarddeutsch. »Die Erde hat sich so abgemüht« ist idiomatisch und erhält zugleich die Personifikation der Erde besser als die passive Umschreibung »Mühsal erlitten«.
  terminology: »Erde«, »erschüttert worden« und »zugrunde gehen« passen zum apokalyptischen Register, ohne die Erschütterung auf ein bloßes Erdbeben festzulegen. Die gewählte Fassung von »sich abmühen« legt keine spezifisch geburtliche Deutung fest.
