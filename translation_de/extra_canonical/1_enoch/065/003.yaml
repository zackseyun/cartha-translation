base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/003.yaml
  text: And I said to him[a], “Tell me, what is this that is being done upon the earth? For the earth has labored thus and has been shaken[c][b]; perhaps I will perish with it.”
translation:
  language: de
  text: 'Und ich sagte zu ihm: »Sag mir: Was ist das, was auf der Erde geschieht? Denn die Erde hat sich so abgemüht und ist erschüttert worden; vielleicht werde ich mit ihr zugrunde gehen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ንግረኒ
  choice: Sag mir
  rationale: Der Imperativ mit Objektsuffix wird direkt und idiomatisch wiedergegeben; die persönliche Anrede bleibt erhalten.
- source_word: ምንት ውእቱ ዘይትገበር
  choice: Was ist das, was … geschieht?
  rationale: Die Formulierung bewahrt den hinweisenden Charakter von ውእቱ und gibt die noch im Gang befindliche Handlung natürlich wieder.
- source_word: ዲበ ምድር
  choice: auf der Erde
  rationale: Schlichte und genaue locative Wiedergabe in modernem Standarddeutsch.
- source_word: እስመ ከመዝ ሰርሐት ምድር
  choice: Denn die Erde hat solche Mühsal erlitten
  rationale: Das schwierige Verb bezeichnet hier im Zusammenhang mit der Erschütterung die Not beziehungsweise das schwere Ringen der personifizierten Erde. Die Formulierung wahrt das Bild, ohne es eindeutig als Geburtswehen festzulegen.
- source_word: ወአንቀልቅለት
  choice: und ist erschüttert worden
  rationale: Die passive Form gibt die heftige Bewegung klar wieder und lässt sowohl seismische als auch umfassendere kosmische Erschütterung offen.
- source_word: ዮጊ አነ እትኃጐል ምስሌሃ
  choice: vielleicht werde ich mit ihr zugrunde gehen
  rationale: ዮጊ kann Befürchtung oder Möglichkeit ausdrücken. »Vielleicht« vermeidet eine irreführende Zweckbeziehung; das feminine Pronomen bezieht sich auf die Erde.
theological_decisions:
- issue: Art der Not der Erde
  choice: Die Erde selbst wird personifiziert als leidend und erschüttert dargestellt.
  alternative: Die Aussage bezeichnet ausschließlich menschliche Verderbnis auf der Erde oder nur ein gewöhnliches Erdbeben.
  rationale: Die Verbindung von Mühsal und Erschütterung trägt eine kosmisch-apokalyptische Bildsprache. Die Übersetzung beschränkt sie weder auf Moral noch auf ein bloßes Naturereignis.
- issue: Bedeutung der Schlussklausel
  choice: Sie drückt die besorgte Möglichkeit aus, gemeinsam mit der Erde zugrunde zu gehen.
  alternative: Sie kann auch als ausdrückliche Furcht oder mit »damit ich nicht« beziehungsweise »falls ich sonst« verstanden werden.
  rationale: Die Wiedergabe mit »vielleicht« erhält die Unsicherheit des Partikels und verhindert, dass die Erschütterung als Zweck des möglichen Untergangs erscheint.
translation_notes:
  register: Natürliches, gegenwärtiges und würdiges Standarddeutsch. Die direkte Rede bleibt knapp; die apokalyptische Personifikation der Erde und die Unsicherheit der Schlussaussage werden bewahrt.
