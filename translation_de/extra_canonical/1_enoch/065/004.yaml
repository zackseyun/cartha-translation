  text: And after that time there came a great upheaval upon the earth[a], and a voice was heard from heaven[b], and I fell on my face.
translation:
  language: de
  text: Und nach jener Zeit kam eine große Erschütterung[a] über die Erde, und eine Stimme war vom Himmel her zu hören, und ich fiel auf mein Angesicht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „Erschütterung“ wiedergegebene Wort kann auch „Aufruhr“, „Unruhe“ oder „Verwirrung“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Der überlieferte Text ist hier schwierig: Die Verbform erscheint als Plural („sie fielen“), das Suffix in „mein Angesicht“ weist jedoch auf die erste Person Singular. Die Übersetzung folgt dem Sinn, der am besten zum unmittelbaren Ich-Erzählzusammenhang passt.'
    reason: textual_variant
lexical_decisions:
- source_word: በድኅሬ ውእቱ ጊዜ
  choice: nach jener Zeit
  rationale: Bewahrt die zeitliche Abfolge und die demonstrative Kraft von ውእቱ in natürlichem, gehobenem Deutsch.
- source_word: ሀውክ ዐቢይ
  choice: eine große Erschütterung
  rationale: ሀውክ bezeichnet Unruhe, Aufruhr, Verwirrung oder Erschütterung. „Erschütterung“ erhält die umfassende apokalyptische Bildkraft, ohne das Geschehen eindeutig als Erdbeben oder politischen Aufruhr festzulegen.
- source_word: ዲበ ምድር
  choice: über die Erde
  rationale: Gibt die räumliche Wendung wieder; „Erde“ passt zum kosmisch-apokalyptischen Zusammenhang besser als das örtlich engere „Land“.
- source_word: ተሰምዐ ቃል እምሰማይ
  choice: Eine Stimme wurde vom Himmel her gehört
  rationale: ቃል kann „Wort“, „Stimme“ oder „Laut“ bedeuten. Im Offenbarungskontext ist „Stimme“ naheliegend, während die passive Form des Ausgangstextes erhalten bleibt.
- source_word: ወወደቁ በገጽየ
  choice: und ich fiel auf mein Angesicht
  rationale: Die überlieferte Verbform erscheint als Plural, doch das Suffix an „mein Angesicht“ ist erste Person Singular. Der unmittelbare Ich-Erzählzusammenhang stützt die gewählte Wiedergabe; die Schwierigkeit wird in einer Fußnote offengelegt.
theological_decisions:
- issue: Art der durch ሀውክ bezeichneten Störung
  choice: umfassende apokalyptische Erschütterung
  alternative: großer Aufruhr; große Verwirrung; großes Beben
  rationale: Die Übersetzung erhält die kosmische und gesellschaftliche Offenheit des Ausdrucks und legt ihn weder ausschließlich politisch noch ausschließlich geologisch aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem apokalyptischem Ton. „Auf mein Angesicht“ bewahrt die konkrete Gebärde der Niederwerfung; die Passivform „wurde … gehört“ folgt bewusst der Struktur des ge’ezischen Textes.
