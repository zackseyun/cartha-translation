  terminology: Die etablierten deutschen Namensformen »Henoch« und »Noach« sind angemessen. »Enden der Erde«, »bitterer Stimme« und »dreimal« geben die einschlägigen Ausdrücke präzise wieder. Die Sprecherzuordnung »Noach sagte« folgt korrekt der Verb-Subjekt-Stellung und sollte nicht als Anrede missverstanden werden.
