base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/002.yaml
  text: And he lifted up his feet from there and went as far as the ends of the earth[a], and he cried out to his grandfather Enoch, and Noah said with a bitter voice, “Hear me, hear me[d][c][b], hear me,” three times.
translation:
  language: de
  text: 'Und er hob seine Füße von dort weg und ging bis an die Enden der Erde. Er rief seinem Großvater Henoch zu, und Noach sagte mit bitterer Stimme: »Höre mich, höre mich, höre mich!« – dreimal.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አንሥአ፡ እገሪሁ
  choice: hob seine Füße
  rationale: Bewahrt das konkrete, im äthiopischen Text ausdrücklich genannte Körperbild, ohne die Bewegung lediglich mit »brach auf« wiederzugeben.
- source_word: እምህየ
  choice: von dort weg
  rationale: Gibt den räumlichen Ausgangspunkt der Bewegung in natürlichem modernem Deutsch wieder.
- source_word: ሖረ፡ እስከ፡ አጽናፈ፡ ምድር
  choice: ging bis an die Enden der Erde
  rationale: Erhält die schlichte Bewegungsangabe und die geläufige apokalyptisch-kosmische Wendung.
- source_word: ጸርኀ፡ ለአምኄው፡ ሄኖክ
  choice: rief seinem Großvater Henoch zu
  rationale: አምኄው bezeichnet hier seinen Großvater beziehungsweise Vorfahren, nicht seinen Sohn. »Zurufen« bringt den lauten, an Henoch gerichteten Ruf idiomatisch zum Ausdruck.
- source_word: ወይቤ፡ ኖኅ
  choice: und Noach sagte
  rationale: Noach ist in der normalen äthiopischen Verb-Subjekt-Stellung eindeutig das Subjekt von »sagte«.
- source_word: በቃል፡ መሪር
  choice: mit bitterer Stimme
  rationale: Bewahrt die emotionale Schärfe der wörtlichen Formulierung, ohne sie auf bloße Traurigkeit einzuengen.
- source_word: ስምዐኒ
  choice: Höre mich
  rationale: Der Imperativ mit Objekt der ersten Person wird direkt wiedergegeben; die dreifache Wiederholung trägt die Dringlichkeit.
- source_word: ሥልሰ
  choice: dreimal
  rationale: Kennzeichnet ausdrücklich, dass der Ruf dreifach erfolgt.
theological_decisions:
- issue: Verwandtschaftsbezeichnung zwischen Noach und Henoch
  choice: seinem Großvater Henoch
  alternative: seinem Vorfahren Henoch
  rationale: Die äthiopische Bezeichnung meint Großvater beziehungsweise Ahnherrn. »Großvater« folgt der konkreteren Bedeutung des Zeugen; die genealogisch genauere deutsche Bezeichnung »Urgroßvater« würde eine Präzisierung eintragen, die nicht ausdrücklich im Ausgangswort steht.
- issue: Sprecherbestimmung bei ወይቤ፡ ኖኅ
  choice: Noach als Subjekt von »sagte«
  alternative: »Noach« als Anrede innerhalb der direkten Rede
  rationale: Die Wortfolge entspricht der üblichen Verb-Subjekt-Syntax des Altäthiopischen. Daher besteht an dieser Stelle keine echte syntaktische Mehrdeutigkeit, die im Haupttext bewahrt werden müsste.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung »hob seine Füße« bleibt wegen des konkreten Bildes der Vorlage erhalten; die Satzteilung verbessert die Lesbarkeit, ohne den Handlungsablauf zu verändern. Die Namensformen »Henoch« und »Noach« folgen dem etablierten deutschen Bibelgebrauch.
