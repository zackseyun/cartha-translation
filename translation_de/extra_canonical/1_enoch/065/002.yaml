  source_fidelity: 'Die Übersetzung gibt die Abfolge und die zentralen Elemente des geʾezischen Zeugen zuverlässig wieder: das Heben der Füße, das Fortgehen von dort bis an die Enden der Erde, den lauten Ruf an Henoch, Noach als Subjekt von »sagte«, die bittere Stimme sowie den dreifachen Imperativ. Insbesondere ist »seinem Großvater Henoch« gegenüber dem überholten englischen Audit-Trail mit »son« sachlich richtig; አምኄው bezeichnet einen Großvater bzw. Vorfahren.'
