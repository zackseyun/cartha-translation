base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/001.yaml
  text: In those days Noah saw that the earth had sunk down[a], and that its destruction was near.
translation:
  language: de
  text: In jenen Tagen sah Noah, dass die Erde abgesunken war[a] und dass ihre Zerstörung nahe war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hier mit „abgesunken“ wiedergegebene äthiopische Wendung ist lexikalisch schwierig. Sie kann auch besagen, dass die Erde sich gesenkt hatte, zusammengebrochen oder heftig erschüttert worden war.
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ፡ መዋዕል
  choice: In jenen Tagen
  rationale: Bewahrt die gehobene, wiederkehrende Zeitformel apokalyptischer Erzählungen und klingt zugleich in modernem Deutsch natürlich.
- source_word: ርእየ
  choice: sah
  rationale: Gibt das grundlegende Verb des Sehens knapp und ohne unnötig altertümlichen Ton wieder.
- source_word: ምድረ
  choice: die Erde
  rationale: Der Zusammenhang des kommenden Gerichts legt einen umfassenden, nicht bloß örtlichen Bezug nahe.
- source_word: ከመ፡ አጽነነት
  choice: dass die Erde abgesunken war
  rationale: Die schwierige Form bezeichnet offenbar ein Nachgeben oder eine Destabilisierung der Erde. „Abgesunken“ erhält das anschauliche physische Bild, ohne dessen Ursache genauer festzulegen.
- source_word: ወከመ፡ ቅሩብ፡ ሐጕላ
  choice: und dass ihre Zerstörung nahe war
  rationale: „Nahe“ gibt ቅሩብ unmittelbar wieder; „ihre Zerstörung“ bezieht das bevorstehende Verderben grammatisch klar auf die zuvor genannte Erde.
theological_decisions:
- issue: Ob der Zustand der Erde als moralische Verderbtheit oder als physische Destabilisierung wiederzugeben ist
  choice: 'physische Destabilisierung: „die Erde war abgesunken“'
  alternative: „die Erde war verdorben“ oder „die Erde war erschüttert“
  rationale: Der äthiopische Wortlaut beschreibt etwas, das Noah sieht, und passt zum Bild einer bevorstehenden kosmischen Katastrophe. Die Übersetzung bewahrt diese apokalyptische Bildsprache, ohne sie in eine allgemeine moralische Aussage umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem apokalyptischem Erzählton. Die syntaktische Wiederholung „dass … und dass …“ wahrt die Struktur und den Nachdruck des Ausgangstextes.
