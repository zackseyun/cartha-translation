base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/005.yaml
  text: And my grandfather Enoch came and stood beside me[a], and he said to me[b], “Why have you cried out to me with a bitter cry and weeping?”
translation:
  language: de
  text: 'Und mein Großvater Henoch kam und stellte sich neben mich und sagte zu mir: »Warum hast du mit bitterem Geschrei und Weinen zu mir geschrien?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምሐው*የ
  choice: mein Großvater
  rationale: Die überlieferte Form ist offenbar eine fehlerhaft erkannte Schreibung von እምሔውየ, »mein Großvater«. Diese Lesart entspricht dem Zusammenhang und derselben Verwandtschaftsbezeichnung in Vers 2.
- source_word: መጽአ
  choice: kam
  rationale: Das grundlegende Bewegungsverb wird im erzählenden Zusammenhang direkt und natürlich mit »kam« wiedergegeben.
- source_word: ቆመ ኀቤየ
  choice: trat zu mir
  rationale: Wörtlich bezeichnet die Wendung ein Stehen bei oder nahe dem Sprecher. »Trat zu mir« gibt den Vorgang in natürlichem Deutsch wieder, ohne die räumliche Nähe aufzugeben.
- source_word: በምንት
  choice: warum
  rationale: Das Fragewort erkundigt sich nach dem Grund und entspricht unmittelbar dem deutschen »warum«.
- source_word: ጸራሕከ ኀቤየ
  choice: hast du nach mir gerufen
  rationale: Das Verb bezeichnet lautes Rufen oder Schreien; mit ኀቤየ drückt die Wendung ein an den Sprecher gerichtetes Rufen aus.
- source_word: ጽራኀ መሪረ
  choice: mit bitterem Geschrei
  rationale: Die Verbindung bezeichnet einen schmerzlichen, heftigen Aufschrei. »Bitteres Geschrei« bewahrt die emotionale Stärke und die nominale Ausdrucksweise.
- source_word: ብካየ
  choice: unter Tränen
  rationale: Das Wort bezeichnet Weinen oder Klagen. »Unter Tränen« verbindet sich idiomatisch mit dem vorausgehenden Rufen und bewahrt den Ausdruck tiefer Not.
theological_decisions:
- issue: Verwandtschaftsbezeichnung für Henoch
  choice: mein Großvater Henoch
  alternative: Henoch kam von meiner Wohnstätte
  rationale: Die revidierte Lesung erkennt in der unsicheren OCR-Form die Verwandtschaftsbezeichnung »mein Großvater«. Sie passt zum unmittelbaren Erzählzusammenhang und vermeidet eine auf fehlerhafter Worttrennung beruhende Ortsangabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt emotional kräftig, aber gut verständlich. Keine Fußnote ist nötig, da die frühere Ortslesart als OCR-Fehler beurteilt wurde.
