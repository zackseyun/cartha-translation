base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/065/006.yaml
  text: And a command went out from before the Lord against those who dwell on the dry land[a], that their end should come; for they knew all the hidden things of the angels, and all the violence of the satans[c][b], and all their secret powers.
translation:
  language: de
  text: Und ein Befehl erging vom Herrn[a] gegen die, die auf dem trockenen Land wohnen, damit ihr Ende komme; denn sie kannten alles Verborgene der Engel, all die Gewalt der Satane[b] und all ihre verborgene Macht[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „von vor dem Angesicht des Herrn“; gemeint ist, dass der Befehl aus der Gegenwart des Herrn hervorgeht.'
    reason: lexical_alternative
  - marker: b
    text: „Satane“ gibt eine Pluralform wieder, nicht den später als Eigennamen gebrauchten Singular „Satan“. Möglich wäre auch „Widersacher“.
    reason: lexical_alternative
  - marker: c
    text: Die Schlussworte sind in diesem äthiopischen Textzeugen schwer verständlich. Möglich ist auch „ihre ganzen verborgenen Mächte“; manche Deutungen beziehen die wiederholte Form für „verborgen“ auf Menschen, die geheime Künste oder Zauberei ausüben.
    reason: textual_variant
lexical_decisions:
- source_word: ትእዛዝ
  choice: Befehl
  rationale: Bezeichnet eine autoritative Anordnung; „Befehl“ bewahrt deren Nachdruck, ohne sie unnötig als juristischen Erlass zu präzisieren.
- source_word: ወጽአ እምቅድመ ገጸ እግዚአ
  choice: ging vom Angesicht des Herrn aus
  rationale: Bewahrt die semitisch geprägte Vorstellung, dass die Anordnung aus der Gegenwart Gottes hervorgeht, und entspricht dem würdevollen apokalyptischen Register.
- source_word: ዲበ እለ የሐድሩ የብስ
  choice: gegen die, die auf dem trockenen Land wohnen
  rationale: የብስ bezeichnet wörtlich trockenes Land beziehungsweise festen Boden. Im Zusammenhang des Flutgerichts bleibt so der bildhafte Gegensatz zum Wasser erhalten.
- source_word: ከመ ውእቱ ይኩን ሕልቀትሙ
  choice: damit ihr Ende komme
  rationale: ሕልቀት kann Ende, Untergang oder Vernichtung bezeichnen. Die Formulierung wahrt die Endgültigkeit, ohne die Art des Gerichts enger festzulegen.
- source_word: ኵሎ ኅቡኣተ መላእክት
  choice: alles Verborgene der Engel
  rationale: Gibt die verborgenen oder geheimen Dinge eng am Ge’ez wieder, ohne den stärker fachsprachlichen Begriff „Mysterien“ einzuführen.
- source_word: ግፍዐ ሰይጣናት
  choice: alle Gewalttat der Satane
  rationale: ግፍዕ kann Gewalttat, Unterdrückung oder Unrecht bedeuten. „Gewalttat“ erhält die starke negative Bedeutung; „Satane“ bildet den Plural sichtbar ab.
- source_word: ኵሎ ኃይሎሙ ኅቡአ ኅቡኣት
  choice: ihre ganze verborgene Macht
  rationale: Die überlieferte Schlusswendung verbindet Macht mit Verborgenheit, ist aber wegen der aufeinanderfolgenden Formen von „verborgen“ schwierig. Die Hauptübersetzung gibt den sicher erkennbaren Mindestsinn wieder.
theological_decisions:
- issue: Plural von ሰይጣናት
  choice: Satane
  alternative: Satan; Widersacher; Dämonen
  rationale: Die ge’ezische Form steht im Plural. Der Plural bleibt erhalten, damit die örtliche dämonologische Ausdrucksweise nicht an die spätere Vorstellung eines einzelnen Eigennamens angeglichen wird.
- issue: Umfang des Gerichts über die Bewohner des trockenen Landes
  choice: wörtliche terrestrische Bildsprache im Zusammenhang des Flutgerichts
  alternative: alle Erdbewohner allgemein; eine besondere Gruppe von Sündern
  rationale: Die Übersetzung bewahrt das Bild des trockenen Landes und legt nicht über den Wortlaut hinaus fest, welche Menschengruppe genau gemeint ist.
- issue: Schwierige Schlussworte
  choice: ihre ganze verborgene Macht
  alternative: ihre ganzen verborgenen Mächte; ein Hinweis auf Ausübende geheimer Künste oder Zauberei
  rationale: Der vorhandene ge’ezische Wortlaut stützt sicher „Macht“ und „verborgen“. Eine ausdrückliche Erwähnung von Zauberern wäre stärker interpretierend und wird daher nur als mögliche Deutung in der Anmerkung genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht apokalyptischem Klang. Die semitisch geprägte Wendung „vom Angesicht des Herrn“ bleibt erhalten, wird aber syntaktisch natürlich eingebunden. Ungewöhnliche Pluralbildung und textliche Unsicherheit werden nicht stillschweigend geglättet, sondern durch Anmerkungen kenntlich gemacht.
