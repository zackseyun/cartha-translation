base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/034/001.yaml
  text: And from there I went toward the north[a], to the ends of the earth[c][b], and there I saw a great wonder.
translation:
  language: de
  text: Und von dort ging ich nach Norden[a] bis an die Enden der Erde, und dort sah ich ein großes Wunder.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In einer älteren Wiedergabe steht hier „nach Süden“; das äthiopische Wort መስዕ bedeutet jedoch „Norden“.
    reason: previous_rendering
  - marker: b
    text: Die vorgelegte Transkription hat hier offenbar irrtümlich ምሕረ; die kritisch bezeugte Lesart መንክረ bedeutet „Wunder“ oder „erstaunliche Erscheinung“.
    reason: textual_variant
lexical_decisions:
- source_word: እምህየ
  choice: von dort
  rationale: Die deiktische Wendung knüpft den Ortswechsel schlicht an die vorausgehende Station der Vision an.
- source_word: ሖርኩ
  choice: ging ich
  rationale: Die einfache Bewegungsangabe entspricht dem nüchternen Erzählstil; „reiste ich“ wäre stärker ausgestaltet.
- source_word: መንገለ መስዕ
  choice: nach Norden
  rationale: መንገለ bezeichnet die Richtung, und መስዕ bedeutet „Norden“; die ältere Wiedergabe „Süden“ kehrt die Himmelsrichtung irrtümlich um.
- source_word: በአጽናፈ ምድር
  choice: bis an die Enden der Erde
  rationale: Die Wendung bezeichnet in der apokalyptischen Weltbeschreibung die äußersten Bereiche der Erde und bewahrt mit „Enden der Erde“ das räumliche Bild.
- source_word: ርኢኩ
  choice: sah ich
  rationale: Dies ist die klare, gegenwärtige deutsche Entsprechung des üblichen Verbs für visionäres Sehen.
- source_word: መንክረ ዐቢየ (in der vorgelegten Transkription fehlerhaft ምሕረ ዐቢየ)
  choice: ein großes Wunder
  rationale: Die kritisch bezeugte Lesart መንክረ bedeutet „Wunder, erstaunliche Erscheinung“. Die Form ምሕረ beruht offenbar auf einer Verlesung beziehungsweise einem Transkriptionsfehler und trägt die Bedeutung „Ruheort“ nicht.
theological_decisions:
- issue: Art dessen, was Henoch am Ende der Erde sieht
  choice: ein großes Wunder
  alternative: eine große Ruhestätte / ein großer Ruheort
  rationale: „Wunder“ folgt der kritisch bezeugten äthiopischen Lesart und vermeidet, ohne sprachliche Grundlage einen jenseitigen oder eschatologischen Ruheort in den Vers einzutragen.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem, aber nicht altertümlichem Ton. Die kosmisch-geografische Bildsprache „Enden der Erde“ bleibt erhalten; unbelegte Deutungen des gesehenen Wunders werden vermieden.
