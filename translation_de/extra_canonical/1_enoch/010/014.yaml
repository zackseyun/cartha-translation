base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/014.yaml
  text: And when he burns and perishes[c][b][a], from now on they shall be bound together with them until the completion of the generations of generations.
translation:
  language: de
  text: Und wenn er brennt und zugrunde geht,[a] werden sie von nun an mit ihnen zusammen gebunden bis zur Vollendung der Generationen der Generationen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die gekennzeichnete Form des ersten Verbs ist in der Überlieferung unsicher. Hier wird sie als „er brennt“ verstanden; zusammen mit dem folgenden Verb ergibt sich: „wenn er brennt und zugrunde geht“.'
    reason: textual_variant
  - marker: b
    text: „Generationen der Generationen“ gibt die wiederholte Formel wörtlich wieder und bezeichnet eine lange Folge von Zeitaltern oder Geschlechtern.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሶበ
  choice: Und wenn
  rationale: Bewahrt sowohl den Anschluss an den vorhergehenden Zusammenhang als auch die temporale Funktion der Konjunktion.
- source_word: †ይውዒ፡†
  choice: er brennt
  rationale: Die Form wird als Verb zu ውዕየ, „brennen“, verstanden. Wegen der unsicheren Überlieferungskennzeichnung wird die Schwierigkeit in einer Fußnote offengelegt.
- source_word: ወይማስን
  choice: und zugrunde geht
  rationale: Gibt das Verb im Sinn von Verderben oder Vernichtetwerden natürlich wieder, ohne ein ausdrücklich handelndes Subjekt einzutragen.
- source_word: እምይእዜ
  choice: von nun an
  rationale: Entspricht der zeitlichen Bedeutung „von jetzt an“ und vermeidet die frühere Fehlanalyse als Subjekt.
- source_word: ምስሌሆሙ፡ ኅቡረ
  choice: mit ihnen zusammen
  rationale: Gibt sowohl die Assoziation mit „ihnen“ als auch den gemeinschaftlichen Charakter der Bindung wieder.
- source_word: ይትአሰሩ
  choice: sollen … gebunden sein
  rationale: Bewahrt das Bild des Bindens beziehungsweise Fesselns und gibt die prospektive Aussage im Deutschen idiomatisch wieder.
- source_word: እስከ፡ ተፍጻሜተ
  choice: bis zur Vollendung
  rationale: Markiert einen bestimmten Endpunkt, ohne ihn vorschnell als abstrakte Ewigkeit oder als Endgericht auszulegen.
- source_word: ትውልደ፡ ትውልድ
  choice: der Generationen der Generationen
  rationale: Erhält die auffällige Wiederholungsformel des Ge’ez und ihre feierliche, lange Zeitfolge.
theological_decisions:
- issue: Dauer und Reichweite der Strafe
  choice: Die gemeinsame Bindung dauert bis zur Vollendung einer langen Folge von Generationen.
  alternative: ewige Gefangenschaft oder Bindung ausschließlich bis zum Endgericht
  rationale: Der Text nennt mit „bis zur Vollendung“ einen Endpunkt und verbindet ihn mit einer wiederholten Generationenformel. Die Übersetzung bewahrt diese zeitliche Spannung, statt sie dogmatisch aufzulösen.
- issue: Bezug des singularischen Subjekts im Eröffnungssatz
  choice: Das im Ge’ez vorausgesetzte „er“ bleibt ohne erklärende Identifizierung stehen.
  alternative: das Subjekt durch einen Namen oder eine Gruppe aus dem Kontext ersetzen
  rationale: Der vorgelegte Vers nennt das Bezugswort nicht ausdrücklich; eine Identifizierung im Haupttext würde über den unmittelbaren Wortlaut hinausgehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die markante Wiederholungsformel bleibt bewusst formal erhalten; der übrige Satzbau ist für heutige Leser geglättet. Sämtliche Fußnotenmarker stehen im Haupttext.
