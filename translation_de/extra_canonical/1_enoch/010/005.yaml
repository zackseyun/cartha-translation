base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/005.yaml
  text: And heap jagged and sharp stones upon him[a], and cover him with darkness; and there he shall remain forever[c][b]. And cover his face so that he may not see light.
translation:
  language: de
  text: Und häufe raue und scharfkantige Steine auf ihn[a] und bedecke ihn mit Finsternis. Dort soll er für immer bleiben[b]. Bedecke sein Gesicht, damit er kein Licht sieht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die beiden Beschreibungen der Steine verstärken ihre Härte; auch möglich: »zerklüftete und scharfe Steine«.'
    reason: lexical_alternative
  - marker: b
    text: 'Das Bedecken seines Gesichts führt das Bild vollständiger Gefangenschaft weiter: Er soll von jedem Licht ausgeschlossen sein.'
    reason: cultural_note
lexical_decisions:
- source_word: ደይ
  choice: häufe … auf
  rationale: Der Imperativ bezeichnet im Zusammenhang der Strafgefangenschaft das Aufschichten von Steinen über dem Verurteilten.
- source_word: እብነ ጠያያተ ወበሊሓተ
  choice: raue und scharfkantige Steine
  rationale: Ein einziges Substantiv wird durch zwei Beschreibungen näher bestimmt. Die deutsche Fassung bewahrt diese Bündelung und gibt die Härte des Bildes natürlich wieder.
- source_word: ክድኖ
  choice: bedecke
  rationale: Das wiederholte Verb wird an beiden Stellen gleich übersetzt und erhält so die eindringliche Befehlsstruktur.
- source_word: ጽልመተ
  choice: Finsternis
  rationale: Die gewichtige, in apokalyptischen Gerichtsbildern geläufige Bezeichnung passt zum feierlich-ernsten Register.
- source_word: ይኅድር ለዓለም
  choice: soll er für immer bleiben
  rationale: Im Kontext bezeichnet die Wendung dauernden Gewahrsam; »bleiben« ist hier treffender als das neutralere »wohnen«.
- source_word: ለገጹ
  choice: sein Gesicht
  rationale: Die Wendung wird konkret als Objekt von »bedecken« verstanden, im Einklang mit dem folgenden Ausschluss vom Licht.
- source_word: ከመ ኢይርአይ ብርሃነ
  choice: damit er kein Licht sieht
  rationale: Die knappe Zweck- beziehungsweise Folgeaussage und das konkrete Lichtmotiv bleiben erhalten.
theological_decisions:
- issue: Charakter der Strafbilder
  choice: Die Steine, die Finsternis, das bedeckte Gesicht und der Ausschluss vom Licht bleiben konkrete Bilder umfassender Gefangenschaft.
  alternative: Die Aussagen lediglich als allgemeine oder rein metaphorische Bedrängnis wiederzugeben.
  rationale: Die Folge konkreter Imperative im ge’ezischen Text sollte nicht zu einer abstrakten Strafbeschreibung abgeschwächt werden.
- issue: Dauerangabe ለዓለም
  choice: für immer
  alternative: für ein Zeitalter
  rationale: In Verbindung mit dem Verb des Bleibens bezeichnet die Wendung hier eine unbegrenzt gedachte Dauer. Die Übersetzung vermeidet weitere Aussagen über das Wesen dieser Dauer.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper, eindringlicher Befehlsfolge. Die Wiederholung von »bedecke« und die konkrete apokalyptische Bildsprache wurden bewahrt.
