  terminology: »in meinem Namen«, »offenbare«, »das Ende« und »Wasserflut« geben die maßgeblichen Begriffe angemessen wieder. »Das Ende, das kommt« wahrt die offene, im Kontext bevorstehende Bedeutung ohne eine technische eschatologische Deutung festzulegen.
