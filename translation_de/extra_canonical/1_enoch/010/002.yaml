base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/002.yaml
  text: Go to Noah and say to him in my name[a], 'Hide yourself!' And reveal to him the end that is coming; for the whole earth will be destroyed, and a flood is about to come upon all the earth[c][b], and it will destroy whatever is in it.
translation:
  language: de
  text: 'Geh zu Noah und sage ihm in meinem Namen[a]: »Verbirg dich!« Offenbare ihm das Ende, das kommt; denn die ganze Erde wird zugrunde gehen, und eine Wasserflut wird über die ganze Erde kommen und alles vernichten, was in ihr ist.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte »Geh zu Noah und« stehen in der zugrunde gelegten Edition in Klammern; damit wird eine Unsicherheit der Textüberlieferung beziehungsweise Textgestalt angezeigt.
    reason: textual_variant
  - marker: b
    text: 'Wörtlicher kann der letzte Ausdruck auch heißen: »was in ihr ist«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ሖር፡ ለኖኅ፡ ወ
  choice: Geh zu Noah und
  rationale: Der Imperativ ሖር wird ausdrücklich als „Geh“ wiedergegeben; ለኖኅ bezeichnet das Ziel. Die Worte stehen in der vorgelegten Edition in Klammern, weshalb die editorische Unsicherheit in einer Fußnote sichtbar bleibt.
- source_word: በሎ፡ በስመ፡ ዚአየ
  choice: sage ihm in meinem Namen
  rationale: Die Formulierung bewahrt sowohl den Sprechbefehl als auch die Vollmachtsformel, ohne sie lediglich als „in meinem Auftrag“ zu paraphrasieren.
- source_word: ኅባእ፡ ርእሰከ
  choice: Verbirg dich!
  rationale: Der reflexive Befehl fordert Noah auf, sich zu verbergen. Der Abschluss der direkten Rede nach diesem Befehl verhindert, dass Noah fälschlich zum Subjekt des folgenden Offenbarungsauftrags wird.
- source_word: ወአግህድ፡ ሎቱ
  choice: Offenbare ihm dann
  rationale: Der Befehl richtet sich weiterhin an den himmlischen Boten, während „ihm“ auf Noah verweist. „Offenbare“ erhält den apokalyptischen Ton des Verbs.
- source_word: ፍጻሜ፡ ዘይመጽእ
  choice: das Ende, das kommen wird
  rationale: ፍጻሜ kann Ende, Abschluss oder Vollendung bezeichnen. Die relativ wörtliche Fassung wahrt diese Spannung und bindet sie im Kontext an das bevorstehende Flutgericht.
- source_word: ይትኃጐል፡ ምድር፡ ኵሉ
  choice: die ganze Erde wird zugrunde gehen
  rationale: „Zugrunde gehen“ gibt den passiven beziehungsweise intransitiven Untergangssinn natürlich wieder, ohne über die Art der Vernichtung hinauszugehen.
- source_word: ማየ፡ አይኅ
  choice: eine Wasserflut
  rationale: Das Kompositum ist im Deutschen natürlich genug und bewahrt zugleich die ausdrückliche Wasserbezeichnung der geezischen Wendung.
- source_word: ያኀጕል፡ ዘሀሎ፡ ውስቴታ
  choice: alles vernichten, was sich auf ihr befindet
  rationale: Die umfassende Aussage wird beibehalten, ohne Lebewesen oder andere Kategorien in den Text einzutragen, die der Ausgangstext nicht ausdrücklich nennt.
theological_decisions:
- issue: Bedeutung von „Ende“
  choice: Das angekündigte Ende wird im unmittelbaren Zusammenhang auf das bevorstehende Flutgericht bezogen, ohne es ausdrücklich als endgültiges Weltende zu bezeichnen.
  alternative: „die kommende Vollendung“ oder „das endgültige Ende“
  rationale: Der Kontext spricht unmittelbar von der Vernichtung durch die Flut. Eine technisch-eschatologische Festlegung würde mehr aussagen als der Vers selbst.
- issue: Sprecher und Adressat von „Offenbare ihm“
  choice: Der Offenbarungsbefehl bleibt außerhalb der an Noah gerichteten direkten Rede; der Bote soll Noah das kommende Ende offenbaren.
  alternative: Noah innerhalb der direkten Rede aufzufordern, einem ungenannten Dritten das Ende zu offenbaren
  rationale: Die geezische Syntax und der logische Bezug von ሎቱ („ihm“) sprechen dafür, dass der ursprüngliche Auftraggeber weiterhin den Boten anspricht und Noah das indirekte Objekt ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze, deutliche Befehle bewahren die Dringlichkeit. „Wasserflut“ hält die ausdrückliche Wasserbildlichkeit des Ge'ez fest; „Erde“ wahrt die mögliche Bedeutungsspanne zwischen Land und gesamter Erde im Kontext.
