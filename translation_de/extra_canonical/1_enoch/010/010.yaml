  terminology: „Gewährt werden“, „ihretwegen“, „Leben in Ewigkeit“ und „jeder von ihnen“ sind terminologisch tragfähig. „Leben in Ewigkeit“ vermeidet eine unnötig konfessionell festgelegte Terminologie. Die Fußnote zu „fünfhundert Winter“ erklärt die idiomatische Jahreszählung korrekt.
