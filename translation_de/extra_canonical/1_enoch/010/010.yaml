base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/010.yaml
  text: And these things that they ask of you shall not be granted to their fathers on their behalf[a]; for they hope to live an everlasting life[d][c][b], and each one of them will live five hundred years.
translation:
  language: de
  text: Und diese Dinge, um die sie dich bitten, werden ihren Vätern ihretwegen nicht gewährt werden[a]; denn sie hoffen, ein Leben in Ewigkeit zu führen, und jeder von ihnen wird fünfhundert Jahre[b] leben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „ihretwegen“ ist im Ge’ez knapp. Gemeint sein können die Nachkommen, für die ihre Väter bitten; der pronominale Bezug wird jedoch nicht ausdrücklich wiederholt.
    reason: alternative_reading
  - marker: b
    text: Wörtlich „fünfhundert Winter“, eine Zeitangabe im Sinn von Jahren.
    reason: cultural_note
lexical_decisions:
- source_word: ዘይስእሉከ
  choice: um die sie dich bitten
  rationale: Die Relativform mit dem Suffix der zweiten Person bezeichnet hier Dinge, um die jemand die angesprochene Person bittet. Diese Wiedergabe folgt der korrigierten syntaktischen Deutung und vermeidet die irreführende Bedeutung „die nach dir fragen“.
- source_word: ኢይከውኑ፡ ለአበዊሆሙ
  choice: werden ihren Vätern nicht gewährt werden
  rationale: Das Verb „sein/werden“ mit der Präposition „für/zu“ hat hier den Sinn, dass das Erbetene den Vätern nicht zuteilwird beziehungsweise nicht gewährt wird. Eine vergleichende Wiedergabe wie „werden nicht wie ihre Väter“ passt nicht zur Konstruktion.
- source_word: በእንቲአሆሙ
  choice: ihretwegen
  rationale: Die knappe pronominale Wendung bezeichnet Grund oder Fürsprache. „Ihretwegen“ erhält die mögliche Beziehung auf die Nachkommen, ohne sie im Haupttext ausdrücklich festzulegen.
- source_word: ይሴፈዉ
  choice: sie hoffen
  rationale: Die Form gehört zum Verb „hoffen/erwarten“, nicht zu einem Verb für Abschneiden oder Vernichten.
- source_word: ይኅየዉ፡ ሕይወተ፡ ዘለዓለም
  choice: ein Leben in Ewigkeit zu führen
  rationale: Die Formulierung gibt wörtlich ein „Leben der Ewigkeit“ wieder. Sie bleibt der ungewöhnlichen Wendung nahe, klingt im Deutschen aber natürlicher als „ein ewiges Leben leben“ und legt keine spätere dogmatische Fachbedeutung fest.
- source_word: አሐዱ፡ አሐዱ፡ እምኔሆሙ
  choice: jeder von ihnen
  rationale: Die Wiederholung von „einer“ hat distributive Bedeutung und wird idiomatisch mit „jeder von ihnen“ wiedergegeben.
- source_word: ኃምስተ፡ ምእተ፡ ክረምተ
  choice: fünfhundert Jahre
  rationale: Wörtlich steht „fünfhundert Winter“; „Winter“ dient hier als Zeitangabe für Jahre. Die idiomatische Bedeutung steht im Text, das konkrete Bild in der Fußnote.
theological_decisions:
- issue: Bezug von „ihretwegen“ und Gegenstand der Bitte
  choice: Die Bitte wird den Vätern nicht ihretwegen gewährt; der pronominale Bezug bleibt im Haupttext knapp.
  alternative: 'Ausdrückliche Deutung: Den Vätern wird ihre Bitte zugunsten ihrer Nachkommen nicht gewährt.'
  rationale: Der Gerichtskontext legt eine Fürbitte der Väter für ihre Nachkommen nahe, doch die ge’ezische Pronominalfügung nennt den Bezug nicht erneut. Die Übersetzung bewahrt diese Verdichtung, und die Fußnote erläutert die naheliegende Lesart, ohne sie zum eindeutigen Wortlaut zu machen.
- issue: „Leben in Ewigkeit“ neben einer Lebensdauer von fünfhundert Jahren
  choice: Beide Aussagen bleiben unharmonisiert nebeneinander stehen.
  alternative: „Ewigkeit“ als bloßes langes Leben erklären oder die fünfhundert Jahre auf eine andere Personengruppe beziehen.
  rationale: Der Quelltext verbindet die Hoffnung auf ein Leben in Ewigkeit unmittelbar mit fünfhundert Jahren. Die erkennbare Spannung wird nicht durch eine theologische oder chronologische Zusatzdeutung aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt dem apokalyptischen Quelltext erkennbar nahe, während „gewährt werden“ und „ein Leben in Ewigkeit führen“ verständliches heutiges Deutsch bieten. Die semantische Spannung zwischen Ewigkeit und fünfhundert Jahren wird bewusst bewahrt.
