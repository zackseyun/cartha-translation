  source_fidelity: 'Die Übersetzung gibt die zentrale Syntax des Ge’ez zutreffend wieder: Die Dinge, um die gebeten wird, werden den Vätern nicht „ihretwegen“ gewährt. Sie vermeidet sowohl die überholte Deutung „die nach dir fragen“ als auch die unzutreffende Vergleichslesart „nicht wie ihre Väter werden“. „Sie hoffen, ein Leben in Ewigkeit zu führen“ entspricht der Abfolge „sie hoffen, [ein ewiges Leben] zu leben“, ohne den Kontrast zur anschließenden Angabe von fünfhundert Jahren aufzulösen.'
