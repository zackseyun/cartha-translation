base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/009.yaml
  text: And to Gabriel the Lord said[a], “Go against the bastards and the reprobates, and against the children of fornication; destroy the children of fornication and the children of the Watchers from among humankind. Send them out against one another, and let them perish in battle[d][c][b]; for length of days shall not be theirs.”
translation:
  language: de
  text: 'Und zu Gabriel sprach der Herr: »Zieh gegen die Bastarde[a] und die Verworfenen und gegen die Kinder der Unzucht. Vernichte die Kinder der Unzucht und die Kinder der Wächter[b] aus der Mitte der Menschen. Treibe sie gegeneinander[c], und lass sie im Kampf zugrunde gehen[d]; denn ein langes Leben soll ihnen nicht zuteilwerden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die unehelich Gezeugten«. Das ge''ezische Wort ist eine harte Bezeichnung für Nachkommen aus einer unerlaubten Verbindung.'
    reason: lexical_alternative
  - marker: b
    text: Der Text ist bei »Kinder der Wächter« schwierig. Die überlieferte Form lautet ለውሉደ፡ ትጉሃን; die Wiedergabe folgt dem unmittelbaren Zusammenhang der Wächtererzählung, bleibt jedoch unsicher.
    reason: textual_variant
  - marker: c
    text: Eine eingeklammerte Lesart der Textausgabe enthält zusätzlich ein Verb im Sinn von »und sende sie aus«. Trotz der unsicheren genauen Verbalfolge ist die Ausrichtung gegeneinander deutlich.
    reason: textual_variant
  - marker: d
    text: 'Dem Zusammenhang nach auch: »Lass sie einander im Kampf vernichten.« Das Verb selbst bedeutet jedoch eher »zugrunde gehen« oder »vernichtet werden«.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: ወለገብርኤል፡ ይቤሎ፡ እግዚእ፡
  choice: Und zu Gabriel sprach der Herr
  rationale: Bewahrt die hervorgehobene Voranstellung Gabriels und gibt እግዚእ im Zusammenhang der göttlichen Gerichtsrede als „der Herr“ wieder.
- source_word: ሑር፡ ዲቤሆሙ፡
  choice: Zieh gegen …
  rationale: Die Wendung bezeichnet hier eine feindliche, gerichtliche Bewegung gegen die Genannten, nicht bloß ein neutrales Hingehen.
- source_word: ለመንዝራን፡
  choice: die Bastarde
  rationale: Das harte deutsche Wort erhält die stigmatisierende Bezeichnung für Nachkommen einer unerlaubten Verbindung; eine Fußnote nennt eine weniger schroffe Alternative.
- source_word: ወለማኑናን፡
  choice: und die Verworfenen
  rationale: „Verworfene“ gibt die Vorstellung von Ausgestoßenen beziehungsweise zum Gericht Bestimmten wieder, ohne eine besondere spätere Lehrbedeutung festzulegen.
- source_word: ወዲበ፡ ውሉደ፡ ዘማ፡
  choice: und gegen die Kinder der Unzucht
  rationale: „Unzucht“ bewahrt den moralisch und genealogisch belasteten Charakter von ዘማ in würdiger, verständlicher Sprache.
- source_word: ወአኅጕሎሙ፡
  choice: Vernichte
  rationale: Das starke Vernichtungsverb entspricht dem apokalyptischen Gerichtszusammenhang.
- source_word: ለውሉደ፡ ትጉሃን፡ እምሰብእ፡
  choice: die Kinder der Wächter aus der Mitte der Menschen
  rationale: „Wächter“ ist die etablierte Bezeichnung im örtlichen Henoch-Kontext; „aus der Mitte der Menschen“ gibt die Trennung von der Menschheit wieder, ohne die schwierige Textform zu überpräzisieren.
- source_word: ወአውፅኦሙ፡ [ወፈንዎሙ፡] በበይናቲሆሙ፡
  choice: Treibe sie gegeneinander
  rationale: Die Formulierung macht die wechselseitige Konfrontation deutlich; die Unsicherheit der teilweise eingeklammerten Verbalfolge wird in einer Fußnote offengelegt.
- source_word: እሙንቱ፡ ወስሊሆሙ፡ በቀትል፡ ይትሐጐሉ፡
  choice: und lass sie im Kampf zugrunde gehen
  rationale: „Zugrunde gehen“ wahrt die passive beziehungsweise intransitive Aussage des Ge'ez-Verbs; der Zusammenhang gegenseitiger Gewalt wird nicht in eine grammatisch aktive Form umgedeutet.
- source_word: እስመ፡ ኑሐ፡ መዋዕል፡ አልቦሙ።
  choice: denn ein langes Leben soll ihnen nicht zuteilwerden
  rationale: Die feierliche Gerichtsformel bleibt erhalten und klingt zugleich natürlich im modernen Standarddeutsch.
theological_decisions:
- issue: Identität der Gerichteten
  choice: Das Gericht richtet sich gegen die aus den unerlaubten Verbindungen der Wächter hervorgegangenen Nachkommen, nicht gegen die Menschheit insgesamt.
  alternative: Die Aussage richtet sich nur gegen Riesen oder allgemein gegen sündige Menschen.
  rationale: Die aufeinanderfolgenden Bezeichnungen „Bastarde“, „Kinder der Unzucht“ und „Kinder der Wächter“ verankern das Urteil in der örtlichen Erzählung von der Übertretung der Wächter.
- issue: Moralisch scharfe Abstammungssprache
  choice: Die Härte der verurteilenden Bezeichnungen bleibt im Haupttext erhalten.
  alternative: Durchgehend mildere Ausdrücke wie „uneheliche Nachkommen“ verwenden.
  rationale: Eine Glättung würde die rhetorische Kraft der apokalyptischen Gerichtsrede abschwächen; die Fußnote macht dennoch die lexikalische Spannweite sichtbar.
- issue: Art ihres Untergangs
  choice: Der Haupttext sagt grammatisch zurückhaltend, dass sie im Kampf zugrunde gehen.
  alternative: „Sie sollen einander im Kampf vernichten.“
  rationale: Der Zusammenhang legt gegenseitige Gewalt nahe, doch die passive beziehungsweise intransitive Verbform sollte nicht stillschweigend in eine aktive reziproke Aussage verwandelt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter apokalyptischer Härte. Die Satzführung folgt weitgehend der Quellstruktur, wird aber für heutige Leser geglättet. „Bastarde“ ist absichtlich schroff; „Verworfene“, „Unzucht“ und „zuteilwerden“ halten den feierlichen Gerichtsregisterton, ohne altertümliche Verbformen zu verwenden.
