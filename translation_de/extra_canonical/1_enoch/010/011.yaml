base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/011.yaml
  text: And to Michael the Lord said[a], “Go, bind Shemihazah and the others with him[c][b], who joined themselves with women so as to defile themselves with them in their uncleanness.”
translation:
  language: de
  text: 'Der Herr sagte zu Michael: »Geh und binde[a] Semjasa und die anderen bei ihm, die sich mit Frauen verbunden haben, sodass sie sich mit ihnen in ihrer Unreinheit verunreinigten[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Befehlswort vor „Semjasa“ ist in der vorliegenden Textüberlieferung schwierig; der Zusammenhang des Kapitels und die weitere Bezeugung stützen den Sinn „binde“.
    reason: textual_variant
  - marker: b
    text: 'Oder: „um sich mit ihnen in ihrer Unreinheit zu verunreinigen“. Die Wendung kann Ziel oder Folge ausdrücken; „Unreinheit“ hat hier sowohl moralische als auch kultische Anklänge.'
    reason: semantic_ambiguity
lexical_decisions:
- source_word: ለሚካኤል
  choice: zu Michael
  rationale: „Michael“ ist die im Deutschen geläufige Form des Namens und entspricht dem ge’ezischen ሚካኤል.
- source_word: ይቤ እግዚእ
  choice: sagte der Herr
  rationale: Das ausdrücklich genannte Subjekt እግዚእ („der Herr“) wird beibehalten; ይቤ ist die übliche Redeeinleitung „sagte“.
- source_word: እግዚእ ሑር
  choice: Geh und binde
  rationale: Der Wortlaut ist an dieser Stelle in der vorliegenden Überlieferung schwierig. Der Zusammenhang des Gerichtsbefehls und die weitere Textbezeugung stützen die Aufforderung, Schemihasa zu binden.
- source_word: ለስምያዛ
  choice: Schemihasa
  rationale: Eine deutsch lesbare, quellennah gebildete Wiedergabe des Namens; sie vermeidet die Übernahme einer anglisierten Namensform.
- source_word: ወለካልኣን እለ ምስሌሁ
  choice: und die anderen bei ihm
  rationale: Die Formulierung bewahrt die schlichte kollektive Bezeichnung seiner Begleiter, ohne eine Rangordnung oder besondere Funktion hinzuzufügen.
- source_word: እለ ሐብሩ ምስለ አንስት
  choice: die sich mit Frauen verbunden haben
  rationale: Die Wendung bezeichnet eine bewusst eingegangene Verbindung mit Frauen, ohne den Ausdruck expliziter oder euphemistischer zu machen als die Quelle.
- source_word: ከመ ይማስኑ
  choice: sodass sie sich … verunreinigten
  rationale: „Sodass“ lässt den Zusammenhang von Ziel und Folge hinreichend offen und gibt die reflexive Verunreinigung natürlich wieder.
- source_word: በርኵሶ ዚአሆን
  choice: in deren Unreinheit
  rationale: Das feminine pluralische Bezugselement weist grammatisch auf die zuvor genannten Frauen zurück. „Unreinheit“ bewahrt zugleich die moralische und kultische Bedeutungsbreite.
theological_decisions:
- issue: Art der Verfehlung bei der Verbindung mit den Frauen
  choice: Die Sprache von Verbindung, Verunreinigung und Unreinheit wird ohne nähere dogmatische Festlegung wiedergegeben.
  alternative: Die Verfehlung ausdrücklich als sexuelle Verderbnis, ausschließlich rituelle Unreinheit oder allgemeine Bosheit bestimmen.
  rationale: Der ge’ezische Text verbindet die Vereinigung mit Verunreinigung und Unreinheit, legt hier aber keine spätere systematische Kategorie fest.
- issue: Ziel oder Folge der Verunreinigung
  choice: „sodass“ bewahrt eine gewisse Offenheit zwischen beabsichtigtem Ziel und eingetretener Folge.
  alternative: „um sich zu verunreinigen“ oder „wodurch sie sich verunreinigten“.
  rationale: ከመ kann in diesem Zusammenhang final oder konsekutiv verstanden werden; die Übersetzung soll diese Spannung nicht unnötig auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzstruktur folgt dem Ge’ez eng, wird aber durch „Geh und binde“ und einen klaren Relativsatz natürlich deutsch gestaltet. Eigennamen erscheinen in geläufiger deutscher beziehungsweise deutsch lesbarer Form.
