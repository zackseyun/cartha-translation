base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/008.yaml
  text: And the whole earth has been corrupted by the teaching of the works of Azazel[c][b][a]; and to him ascribe all sin.
translation:
  language: de
  text: Und die ganze Erde ist durch die Lehre von Azazels Taten verdorben worden; und schreibe gegen ihn alle Sünde auf.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch die Unterweisung in seinen Taten“. Die ge''ezische Wendung verbindet den Gedanken der Lehre mit konkreten Taten oder Praktiken.'
    reason: lexical_alternative
  - marker: b
    text: Die Schlussklausel kann auch im Sinn von „rechne ihm alle Sünde zu“ verstanden werden; wörtlicher liegt der Gedanke nahe, alle Sünde im Gericht gegen ihn schriftlich festzuhalten.
    reason: alternative_reading
lexical_decisions:
- source_word: ማሰነት
  choice: ist verdorben worden
  rationale: Das Verb bezeichnet Verderben oder Zerstören. Die passive Form wahrt die moralische und kosmische Tragweite des Gerichtskontexts.
- source_word: ኵላ ምድር
  choice: die ganze Erde
  rationale: Im apokalyptischen Zusammenhang ist die Wendung universal zu verstehen, nicht nur auf ein einzelnes Land bezogen.
- source_word: በትምህርተ ግብሩ
  choice: durch die Lehre von den Taten
  rationale: Die Wiedergabe bewahrt sowohl den Gedanken des Lehrens als auch den der konkreten Taten oder Praktiken, ohne die dichte Formulierung auf nur einen Aspekt zu reduzieren.
- source_word: ለአዛዝኤል
  choice: Asaëls
  rationale: Die Präposition ordnet die Taten Asaël zu. Der deutsche Genitiv gibt diese Zugehörigkeit knapp und natürlich wieder.
- source_word: ወላዕሌሁ
  choice: und gegen ihn
  rationale: Die Verbindung enthält die Konjunktion und bezeichnet mit ላዕሌሁ im gerichtlichen Zusammenhang eher eine Belastung gegen ihn als einen bloßen Dativ.
- source_word: ጸሐፍ
  choice: schreibe ... auf
  rationale: Der Imperativ bezeichnet das förmliche schriftliche Festhalten im Rahmen des Gerichtsspruchs.
- source_word: ኵሎ ኃጢአተ
  choice: alle Sünde
  rationale: Die kollektiv-singularische Wendung bewahrt die umfassende Zuschreibung der Schuld, ohne sie erläuternd zu erweitern.
theological_decisions:
- issue: Ob die Schlussklausel alle Sünde gegen Asaël gerichtlich verzeichnet oder ihm allgemeiner zuschreibt
  choice: schreibe alle Sünde gegen ihn auf
  alternative: rechne ihm alle Sünde zu
  rationale: Der unmittelbare Kontext ist ein Gerichtsspruch. Die Verbindung aus der Präposition „gegen/auf“ und dem Schreibimperativ spricht für ein förmliches Verzeichnen der Schuld gegen Asaël; die Fußnote hält die semantisch mögliche Zuschreibung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht ungewöhnliche Verbindung „Lehre von den Taten“ wurde beibehalten, um die Dichte und Mehrdeutigkeit des ge'ezischen Ausdrucks sichtbar zu halten. Der Name folgt der im Deutschen verbreiteten Form „Asaël“.
