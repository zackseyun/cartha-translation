  terminology: „Lehre“ und „Taten“ bewahren die Doppelheit von ትምህርት und ግብር. „Alle Sünde“ erhält den umfassenden Kollektivsingular. „Azazel“ entspricht der vorliegenden ge'ezischen Namensform.
