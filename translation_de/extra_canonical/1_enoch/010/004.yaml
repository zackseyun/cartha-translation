base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/004.yaml
  text: And again the Lord said to Raphael[a], “Bind Azazel by his hands and his feet, and cast him into the darkness; and open the desert that is in Dudael[b], and cast him there.”
translation:
  language: de
  text: 'Und wiederum sagte der Herr zu Rafael: „Binde Azazel an Händen und Füßen und wirf ihn in die Finsternis. Spalte die Wüste auf[a], die in Dudael[b] liegt, und wirf ihn dorthin.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die äthiopische Wendung ist schwierig und kann ein Öffnen oder Aufspalten der Wüste bezeichnen. Manche verstehen sie als Anweisung, dort eine grubenartige Haftstätte zu öffnen oder herzurichten; eine „Grube“ wird im vorliegenden Wortlaut jedoch nicht ausdrücklich genannt.
    reason: textual_variant
  - marker: b
    text: Dudael wird als Ortsname unübersetzt wiedergegeben. Der Vers bezeichnet damit eine bestimmte Wüstengegend, in die Azazel verbannt werden soll.
    reason: cultural_note
lexical_decisions:
- source_word: ካዕበ
  choice: wiederum
  rationale: Das Wort kennzeichnet die erneute Rede im fortlaufenden Geschehen; „wiederum“ bewahrt diese Wiederholung in einem würdigen Erzählton.
- source_word: እግዚእ
  choice: der Herr
  rationale: In der Redeformel steht das Wort als göttlicher Titel; „der Herr“ ist im modernen Standarddeutsch klar und angemessen.
- source_word: እሰሮ
  choice: binde
  rationale: Der konkrete Befehl zur Fesselung wird nicht zum allgemeineren „sperre ein“ abgeschwächt.
- source_word: በእዴሁ ወእግሩ
  choice: an Händen und Füßen
  rationale: Die Formulierung nennt beide Körperteile ausdrücklich. Die deutsche Wendung ist natürlich und bewahrt die körperliche Konkretheit.
- source_word: ወድዮ
  choice: wirf ihn
  rationale: Der wiederholte Imperativ bezeichnet eine gewaltsame Verbringung. Die Wiederholung wird im Deutschen beibehalten.
- source_word: ውስተ ጽልመት
  choice: in die Finsternis
  rationale: „Finsternis“ erhält den feierlich-apokalyptischen Ton und lässt offen, ob vor allem ein Ort oder ein Zustand gemeint ist.
- source_word: ወአብቅዋ ለገዳም
  choice: Spalte die Wüste auf
  rationale: Die schwierige Wendung spricht vom Öffnen oder Aufspalten der Wüste. Diese konkrete Wiedergabe vermeidet den nicht ausdrücklich genannten Zusatz „Grube“.
- source_word: እንተ ሀለወት በዱዳኤል
  choice: die in Dudael liegt
  rationale: Der Relativsatz lokalisiert die Wüste; Dudael bleibt als Ortsname transliteriert.
- source_word: ህየ
  choice: dorthin
  rationale: Das lokale Adverb verweist auf den zuvor bezeichneten Ort und gibt das Ziel der Bewegung natürlich wieder.
theological_decisions:
- issue: Art der Bestrafung Azazels
  choice: Konkretes Binden und Verbannen in eine finstere Wüstenhaft
  alternative: Allgemeine Einkerkerung oder ausschließlich symbolische Verstoßung in geistliche Finsternis
  rationale: Hände, Füße, Finsternis, Wüste und der wiederholte Befehl zum Werfen erzeugen eine betont körperlich-räumliche Gerichtsszene. Die Übersetzung bewahrt diese Bildlichkeit, ohne ihre mögliche symbolische Dimension auszuschließen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die imperativische Härte, die Wiederholung von „wirf ihn“ und die räumlich-körperliche Bildsprache bleiben erhalten; die textlich schwierige Wendung über die Wüste wird nicht durch eine ergänzte „Grube“ vereindeutigt.
