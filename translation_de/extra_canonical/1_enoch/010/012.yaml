revisions:
- from: Und wenn alle ihre Söhne einander erschlagen haben und sie den Untergang ihrer Geliebten gesehen haben, dann fessle sie für siebzig Generationen unter den Hügeln der Erde[a] bis zum Tag ihres Gerichts und ihrer Vollendung[b], bis das Gericht für alle Ewigkeit[c] vollendet ist.
  to: Und wenn alle ihre Söhne einander erschlagen haben und diese den Untergang der ihnen Liebsten gesehen haben, dann fessle sie für siebzig Generationen unter den Hügeln der Erde[a] bis zum Tag ihres Gerichts und ihrer Vollendung[b], bis das Gericht für alle Ewigkeit[c] vollendet ist.
  rationale: Die Revision beseitigt eine im Deutschen naheliegende, aber quellenwidrige Zuordnung des Sehens zu den Söhnen und ersetzt die potenziell zu eng verstandene Bezeichnung „Geliebte“ durch „die ihnen Liebsten“. Sie ergänzt keine Kontextidentifikation und lässt die pronominale Bezugsebene des Verses ansonsten bestehen.
