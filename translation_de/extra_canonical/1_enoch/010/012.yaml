base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/012.yaml
  text: And when all their sons have slain one another[a], and when they have seen the destruction of their beloved ones, bind them for seventy generations beneath the hills of the earth, until the day of their judgment and of their consummation[c][b], until the judgment that is for all eternity is completed.
translation:
  language: de
  text: Und wenn alle ihre Söhne einander erschlagen haben und diese den Untergang der ihnen Liebsten gesehen haben, dann fessle sie für siebzig Generationen unter den Hügeln der Erde[a] bis zum Tag ihres Gerichts und ihrer Vollendung[b], bis das Gericht für alle Ewigkeit[c] vollendet ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „unter den Bergen der Erde“. Das geʿezische Wort kann „Hügel“ oder „Berge“ bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Vollendung“ kann hier auch „Ende“ oder „endgültiger Abschluss“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Die Schlusswendung ist eine verstärkte Ewigkeitsformel, wörtlich etwa: „das Gericht des Zeitalters der Ewigkeit“ oder „der ewigen Zeitalter“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትራገዙ
  choice: einander erschlagen haben
  rationale: Die reziproke Verbform bezeichnet im Kontext der gewaltsamen gegenseitigen Vernichtung der Riesensöhne mehr als bloßen Streit. „Einander erschlagen“ bewahrt die Härte des Gerichtsgeschehens, ohne die Art des Tötens weiter auszumalen.
- source_word: ሐጕሎሙ
  choice: den Untergang
  rationale: Das Substantiv kann Zerstörung, Verderben oder Untergang bezeichnen. „Untergang“ ist im Deutschen natürlich und lässt die konkrete Todesart offen.
- source_word: ለፍቁራኒሆሙ
  choice: ihrer Geliebten
  rationale: Der Ausdruck bezeichnet Personen, die ihnen lieb und teuer sind. „Ihre Geliebten“ erhält den gehobenen, emotionalen Ton, ohne den Personenkreis näher festzulegen.
- source_word: እሰሮሙ
  choice: fessle sie
  rationale: Der Imperativ beschreibt ein konkretes Binden. „Fessle“ erhält das Bild der körperlichen Gefangensetzung deutlicher als das abstraktere „sperre ein“.
- source_word: ለ፸ ትውልድ
  choice: für siebzig Generationen
  rationale: Die direkte Zeitangabe bewahrt die apokalyptische Periodenformel.
- source_word: በመትሕተ አውግርተ ምድር
  choice: unter den Hügeln der Erde
  rationale: Die Formulierung folgt dem geʿezischen Ortsausdruck eng. Das betreffende Substantiv kann auch als „Berge“ verstanden werden; diese Möglichkeit wird in der Fußnote offengehalten.
- source_word: ዕለተ ኵነኔሆሙ
  choice: zum Tag ihres Gerichts
  rationale: „Gericht“ wahrt den richterlichen Sinn, ohne ihn vorschnell auf Verurteilung oder Strafvollzug zu verengen.
- source_word: ተፍጻሜቶሙ
  choice: ihrer Vollendung
  rationale: Das Wort bezeichnet Vollendung beziehungsweise Ende. „Vollendung“ erhält die eschatologische Spannung zwischen Abschluss, Ende und endgültigem Vollzug.
- source_word: ኵነኔ ዘለዓለመ ዓለም
  choice: das Gericht für alle Ewigkeit
  rationale: Die Wiedergabe bildet die verstärkte Ewigkeitsformel in verständlichem, würdigem Deutsch ab, ohne sie zum bloßen Adjektiv „ewig“ zu verflachen.
theological_decisions:
- issue: Ob die Söhne lediglich miteinander kämpfen oder einander töten
  choice: einander erschlagen haben
  alternative: miteinander gekämpft haben / einander vernichtet haben
  rationale: Der unmittelbare Kontext von 1 Henoch 10 schildert die gegenseitige gewaltsame Vernichtung der Nachkommen der Wächter. Die gewählte Fassung bewahrt die Schwere des apokalyptischen Gerichts.
- issue: Bedeutung von „ihrer Vollendung“
  choice: formaler Abschluss oder Ende ihres Gerichtswegs
  alternative: ihre endgültige Strafe / ihre Vernichtung / ihr bestimmtes Ende
  rationale: Der Ausgangstext lässt offen, ob besonders das Ende, die Erfüllung oder der endgültige Strafvollzug gemeint ist. „Vollendung“ löst diese Spannung nicht einseitig auf.
- issue: Bezug der Pronomina in „ihre Söhne“, „ihre Geliebten“ und „fessle sie“
  choice: Die Mehrdeutigkeit der pronominalen Bezüge bleibt im Haupttext erhalten.
  alternative: Die Bezugsgruppen ausdrücklich als Wächter oder deren Nachkommen benennen
  rationale: Der Vers setzt den vorangehenden Kontext voraus; eine ausdrückliche Identifizierung würde Informationen ergänzen, die in diesem Vers nicht eigens genannt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die geʿezische Satzstruktur. Der lange apokalyptische Satz bleibt erhalten, wird aber durch „dann“ und klare Präpositionalgruppen lesbar gegliedert. Sämtliche lexikalisch oder theologisch bedeutsamen Mehrdeutigkeiten werden entweder im Haupttext bewahrt oder in Fußnoten kenntlich gemacht.
