base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/007.yaml
  text: And heal the earth which the angels have corrupted[a], and make known the healing of the earth, so that they may heal the earth, and all the children of men may not perish through all the secrets that the Watchers have disclosed[f] and taught to their sons.
translation:
  language: de
  text: Und heile die Erde, die die Engel verdorben haben, und mache die Heilung der Erde bekannt[a], damit sie die Erde heilen und nicht alle Menschenkinder durch all die Geheimnisse[b] umkommen, die die Wächter offenbart[c] und ihre Söhne darin unterwiesen haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „mache die Heilung der Erde bekannt“ ist textlich und syntaktisch schwierig. Das Ge'ez kann wörtlicher auch im Sinn von „mache das Leben beziehungsweise die Wiederherstellung der Erde bekannt“ verstanden werden.
    reason: textual_variant
  - marker: b
    text: Mit den „Geheimnissen“ ist hier das verborgene Wissen gemeint, das die Wächter unerlaubt weitergaben, nicht notwendig jedes rechtmäßig offenbarte göttliche Geheimnis.
    reason: cultural_note
  - marker: c
    text: 'Das Ge''ez lautet wörtlich „getötet“ (ዘቀተሉ, za-qatalu). Dies beruht wahrscheinlich auf einer Verderbnis der zugrunde liegenden griechischen Überlieferung: ἐπάταξαν („schlugen/töteten“) statt ὑπέδειξαν („zeigten/offenbarten“).'
    reason: textual_variant
lexical_decisions:
- source_word: አሕይዋ
  choice: heile
  rationale: Der Imperativ bezeichnet im Zusammenhang die Wiederherstellung der von den Engeln geschädigten Erde; „heile“ bewahrt das Bild des Heilens, ohne es auf bloße moralische Besserung zu verengen.
- source_word: አማሰኑ
  choice: verdorben haben
  rationale: Die Form beschreibt die zerstörerische Einwirkung der Engel auf die Erde. „Verdorben“ umfasst sowohl sittliche als auch umfassende kosmische Schädigung.
- source_word: ሕይወታ
  choice: Heilung
  rationale: Das Wort gehört zum Bedeutungsfeld „Leben/Lebendigmachen“. Im Parallelismus mit dem vorangehenden Heilungsbefehl ist „Heilung“ idiomatisch, während die wörtlichere Möglichkeit in der Fußnote erhalten bleibt.
- source_word: አይድዕ ከመ
  choice: mache ... bekannt, damit
  rationale: Die Wiedergabe erhält sowohl die kausative Aussage des Bekanntmachens als auch den anschließenden Zweck- beziehungsweise Folgesinn.
- source_word: ይሕይዋ ለምድር
  choice: damit sie die Erde heilen
  rationale: Die ge'ezische Vorlage nennt ausdrücklich die Erde als Objekt. Die pluralische Form bleibt mit „sie“ erhalten, auch wenn ihr Bezug syntaktisch schwierig ist.
- source_word: ኢይትሐጐሉ
  choice: nicht ... umkommen
  rationale: „Umkommen“ gibt den Gedanken drohender Vernichtung in natürlichem, würdigem Deutsch wieder.
- source_word: በምሥጢር ኵሉ
  choice: durch all die Geheimnisse
  rationale: „Geheimnisse“ wahrt den apokalyptischen Ausdruck und bezeichnet hier den unerlaubt vermittelten verborgenen Wissensstoff, ohne ihn ausschließlich als Magie festzulegen.
- source_word: ትጉሃን
  choice: die Wächter
  rationale: „Wächter“ ist die etablierte Bezeichnung dieser Engelwesen im Henochbuch und erhält die interne Terminologie des Werkes.
- source_word: መሀሩ ለውሉዶሙ
  choice: ihre Söhne gelehrt haben
  rationale: Die Formulierung bewahrt die konkrete familiale Sprache der Vorlage; „Söhne“ entspricht dem maskulinen Ausdruck genauer als das allgemeinere „Kinder“.
theological_decisions:
- issue: Art der Wiederherstellung der Erde
  choice: Der Vers spricht von der tatsächlichen Heilung beziehungsweise Wiederherstellung der verdorbenen Erde.
  alternative: Die Aussage bezeichnet vor allem die moralische Besserung der menschlichen Gesellschaft oder bedeutet lediglich, dass die Erde leben soll.
  rationale: Die Erde erscheint wiederholt als unmittelbares Objekt der Handlung. Daher bleibt die kosmische Wiederherstellungsdimension der apokalyptischen Darstellung erhalten.
- issue: Urheber der offenbarten Geheimnisse
  choice: Die Wächter haben die Geheimnisse offenbart und ihre Söhne darin unterwiesen.
  alternative: Die Wendung könnte allgemein auf verborgenes Wissen unter Menschen bezogen werden.
  rationale: Der Schluss des Verses verbindet die Weitergabe des Wissens unmittelbar mit den Wächtern; die textkritische Schwierigkeit des Verbs wird kenntlich gemacht.
- issue: Pluralisches Subjekt in „damit sie die Erde heilen“
  choice: Das unbestimmte „sie“ der schwierigen Vorlage wird beibehalten.
  alternative: Der Satz könnte passiv als „damit die Erde geheilt werde“ oder singularisch als „damit sie lebe“ geglättet werden.
  rationale: Eine eindeutige Identifikation des Subjekts würde die echte syntaktische Spannung der ge'ezischen Überlieferung vorschnell auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die Wiederholung von „Erde“ wird trotz stilistischer Schwere beibehalten, weil sie die Vorlage prägt. Textliche und syntaktische Unsicherheiten werden nicht stillschweigend harmonisiert, sondern in den Fußnoten offengelegt.
