base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/013.yaml
  text: And in those days they will lead them down into the abyss of fire[a], and into torment and the prison-house[b]; and there they will be shut up forever.
translation:
  language: de
  text: Und in jenen Tagen wird man sie hinabführen in den feurigen Abgrund[a], in die Qual und in das Gefängnis[b]; dort werden sie für immer eingeschlossen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich bezeichnet der Ausdruck einen unteren oder tiefen Ort des Feuers; möglich sind auch „Tiefe des Feuers“ oder „Feuerabgrund“.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Haus der Gefangenschaft“ oder „Haus der Einschließung“.'
    reason: cultural_note
lexical_decisions:
- source_word: መዋዕል
  choice: Tagen
  rationale: Im apokalyptischen Ausdruck በውእቱ መዋዕል entspricht „in jenen Tagen“ der geläufigen Zeitformel und bewahrt ihren feierlichen Klang.
- source_word: ይወስድዎሙ
  choice: wird man sie hinabführen
  rationale: Das Verb bezeichnet Nehmen oder Führen; die unpersönliche deutsche Form bewahrt die im Ausgangstext nicht näher bezeichneten Handlungsträger. „Hinab“ erschließt sich aus dem folgenden unteren beziehungsweise tiefen Feuerort.
- source_word: መትሕተ እሳት
  choice: den feurigen Abgrund
  rationale: Die Wendung bezeichnet wörtlich einen unteren oder tiefen Ort des Feuers. „Feuriger Abgrund“ erhält das räumliche apokalyptische Bild, ohne den später geprägten Lehrbegriff „Hölle“ einzutragen.
- source_word: በጻዕር
  choice: in die Qual
  rationale: Das Substantiv bezeichnet schmerzliches Leiden oder Bedrängnis; im Strafzusammenhang gibt „Qual“ die Schärfe knapp und natürlich wieder.
- source_word: ቤት ሞቅሕ
  choice: das Gefängnis
  rationale: Wörtlich steht „Haus der Gefangenschaft/Einschließung“. Das heutige deutsche „Gefängnis“ vermittelt dasselbe konkrete Haftbild natürlicher; die wörtliche Bildgestalt wird in der Fußnote festgehalten.
- source_word: ይትዓፀዉ
  choice: werden sie eingeschlossen sein
  rationale: Die Form bezeichnet ein Verschlossen- oder Eingeschlossensein. Die Wiedergabe vermeidet eine unnötige Wiederholung von „Gefängnis“ und erhält das Bild endgültiger Verwahrung.
- source_word: ለዓለም
  choice: für immer
  rationale: In diesem Gerichtskontext bezeichnet die Wendung fortdauernde, nicht begrenzte Einschließung. „Für immer“ ist gegenwärtiges, klares Standarddeutsch.
theological_decisions:
- issue: Benennung des feurigen Strafortes
  choice: feuriger Abgrund
  alternative: Hölle; Tiefe des Feuers; unterer Feuerort
  rationale: Der ge'ezische Wortlaut bietet ein räumliches Bild und keinen ausdrücklich feststehenden späteren theologischen Fachbegriff. Die Übersetzung wahrt diese Bildsprache und lässt ihre genaue räumliche Nuance offen.
- issue: Dauer der Einschließung
  choice: für immer
  alternative: für die Ewigkeit; für das Zeitalter
  rationale: ለዓለም bezeichnet in dieser Gerichtsformel am natürlichsten unbegrenzte Dauer. Die Übersetzung schwächt die Endgültigkeit nicht ab, ohne über den Wortlaut hinaus eine dogmatische Systematisierung vorzunehmen.
- issue: Nicht genannte Vollstrecker des Gerichts
  choice: wird man sie hinabführen
  alternative: sie werden sie hinabführen
  rationale: Der Ausgangstext hat eine plurale Verbform, benennt deren Subjekt jedoch nicht. Die unpersönliche Konstruktion ist im Deutschen natürlich und vermeidet, die Vollstrecker eigenmächtig zu identifizieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper apokalyptischer Bildsprache. Die Semikolon-Struktur erhält die Abfolge von Strafort, Qual, Haft und endgültiger Einschließung. Keine konfessionell festgelegte Terminologie wird in den Text eingetragen.
