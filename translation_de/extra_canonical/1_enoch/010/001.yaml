base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/001.yaml
  text: 'Then the Most High[a], the Great and Holy One, spoke and sent Uriel to the son of Lamech[b], and said to him:'
translation:
  language: de
  text: 'Dann sprach der Höchste, der Große und Heilige, und sandte Uriel[a] zum Sohn Lamechs[b] und sagte zu ihm:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name »Uriel« beruht auf einer offenbar leicht beschädigten äthiopischen Textüberlieferung an dieser Stelle; der unmittelbare Zusammenhang stützt diese Lesart deutlich.
    reason: textual_variant
  - marker: b
    text: Dieser Vers nennt den Empfänger nur »den Sohn Lamechs«; aus dem weiteren Zusammenhang geht hervor, dass Noah gemeint ist.
    reason: cross_reference
lexical_decisions:
- source_word: አሜሃ
  choice: Dann
  rationale: Kennzeichnet den Fortgang der Erzählung, ohne den zeitlichen Zusammenhang genauer festzulegen.
- source_word: ልዑል
  choice: der Höchste
  rationale: Gibt den geläufigen göttlichen Hoheitstitel in würdigem, modernem Deutsch wieder.
- source_word: ዓቢይ፡ ወቅዱስ
  choice: der Große und Heilige
  rationale: Bewahrt die gehäufte, substantivisch gebrauchte Gottesbezeichnung und ihre feierliche Wirkung.
- source_word: ተናገረ
  choice: sprach
  rationale: Entspricht dem allgemeinen Redeverb und wahrt den gehobenen Erzählton.
- source_word: ወፈነወ
  choice: und sandte
  rationale: Drückt die Beauftragung Uriels knapp und quellennah aus.
- source_word: አሰርየ፡ ልዩር
  choice: Uriel
  rationale: Die überlieferte Zeichenfolge ist offenbar gestört; der Personenname Uriel wird durch den unmittelbaren Zusammenhang stark gestützt.
- source_word: ኀበ፡ ወልደ፡ ላሜክ
  choice: zum Sohn Lamechs
  rationale: Gibt Zielrichtung und Abstammungsbezeichnung natürlich wieder, ohne den Sohn bereits im Haupttext als Noah zu identifizieren.
- source_word: ወይቤሎ
  choice: und sagte zu ihm
  rationale: Bildet sowohl das Redeverb als auch das pronominale Objekt ausdrücklich ab.
theological_decisions:
- issue: Wiedergabe der gehäuften göttlichen Hoheitstitel
  choice: der Höchste, der Große und Heilige
  alternative: der Erhabene, groß und heilig
  rationale: Die gewählte Fassung erhält die drei feierlichen Bezeichnungen und behandelt „der Große und Heilige“ als substantivische Apposition, ohne sie zu einer einzigen dogmatisch festgelegten Benennung zu verschmelzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem apokalyptischem Erzählton. Die Wiederholung der Redeverben („sprach“ / „sagte“) bleibt entsprechend der Quelle erhalten.
