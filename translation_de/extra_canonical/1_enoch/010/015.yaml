base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/015.yaml
  text: And destroy these spirits of the bastards and the children of the Watchers, because they have oppressed humankind.
translation:
  language: de
  text: Und vernichte diese Geister der Bastarde[a] und die Kinder der Wächter[c], denn sie haben die Menschheit unterdrückt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der unrechtmäßigen Nachkommen“. Das äthiopische Wort ist scharf und bezeichnet wahrscheinlich die aus der unerlaubten Verbindung der Wächter hervorgegangenen Nachkommen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Menschheit Gewalt angetan“. Das Verb kann gewaltsame Misshandlung ausdrücken.'
    reason: lexical_alternative
  - marker: c
    text: 'Die Wendung kann auch als nähere Bestimmung verstanden werden: „die Geister der Bastarde, das heißt der Kinder der Wächter“.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: አኅጕሎሙ
  choice: vernichte
  rationale: Der Imperativ beziehungsweise Jussiv bezeichnet im Gerichtszusammenhang die vollständige Beseitigung; „vernichte“ bewahrt die Härte, ohne die Art der Vernichtung näher festzulegen.
- source_word: መናፍስተ
  choice: Geister
  rationale: Im apokalyptischen Zusammenhang sind geistige Wesen gemeint; „Seelen“ wäre allgemeiner und könnte irreführen.
- source_word: ተውኔት
  choice: Bastarde
  rationale: Das Wort bezeichnet unrechtmäßige beziehungsweise gemischte Nachkommen und ist bewusst scharf. Wegen der heute stark beleidigenden Wirkung wird eine sachlichere Alternative in der Fußnote genannt.
- source_word: ውሉዶሙ
  choice: Kinder
  rationale: Die natürliche deutsche Entsprechung lässt sowohl leibliche Kinder als auch allgemeiner Nachkommen zu.
- source_word: ትጉሃን
  choice: Wächter
  rationale: „Wächter“ ist die etablierte apokalyptische Bezeichnung dieser Engelwesen und erhält den literarischen Zusammenhang des Wächterbuches.
- source_word: ገፍዕዎሙ
  choice: haben … unterdrückt
  rationale: Das Verb bezeichnet gewaltsame Bedrückung oder Misshandlung. „Unterdrückt“ gibt die Schwere des Handelns deutlicher wieder als das zu schwache „Unrecht getan“.
- source_word: ሰብእ
  choice: die Menschheit
  rationale: Die kollektive, geschlechtsübergreifende Bedeutung wird im modernen Deutschen klar und natürlich ausgedrückt.
theological_decisions:
- issue: Verhältnis der „Geister der Bastarde“ zu den „Kindern der Wächter“
  choice: Beide Ausdrücke bleiben nebeneinander stehen, ohne ihre genaue Beziehung zu erklären.
  alternative: 'Die zweite Wendung könnte als nähere Bestimmung derselben Gruppe verstanden werden: „die Geister der Bastarde, nämlich der Kinder der Wächter“.'
  rationale: Die äthiopische Formulierung enthält beide Bezeichnungen, lässt aber offen, ob zwei Gruppen oder zwei Beschreibungen derselben Gruppe gemeint sind. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Härte des Gerichtswortes und des Ausdrucks „Bastarde“ bleibt erhalten, wird aber durch eine sachlichere Fußnotenalternative erläutert. Die unklare Beziehung zwischen den beiden Gruppenbezeichnungen wird nicht dogmatisch aufgelöst.
