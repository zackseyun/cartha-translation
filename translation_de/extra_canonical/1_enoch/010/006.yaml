base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/006.yaml
  text: And on the great day of judgment he shall be sent away into the fire[a][b].
translation:
  language: de
  text: Und am großen Tag des Gerichts wird er ins Feuer gesandt werden[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Ge’ez steht das Verb in der Einzahl („er wird gesandt werden“); das Subjekt ist die im Zusammenhang zuvor angesprochene Gestalt.
    reason: cross_reference
  - marker: b
    text: „Großer Tag des Gerichts“ ist hier eine feste apokalyptische Gerichtsformel. „Gericht“ könnte im engeren richterlichen Sinn auch als „Urteilsspruch“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: በዕለት
  choice: am Tag
  rationale: Die Präposition mit ዕለት bezeichnet den Zeitpunkt des Geschehens; im Deutschen ist „am Tag“ die natürliche Entsprechung.
- source_word: ዓባይ
  choice: großen
  rationale: Das Adjektiv verstärkt den apokalyptischen Gerichtstag und wird mit dem geläufigen, würdevollen „groß“ wiedergegeben.
- source_word: ኵነኔ
  choice: Gerichts
  rationale: Der Ausdruck bezeichnet hier umfassend das richterliche Geschehen; „Gericht“ bewahrt diese Weite, ohne ihn auf Verurteilung oder Urteilsspruch zu verengen.
- source_word: ይትፈኖ
  choice: wird er geschickt werden
  rationale: Die passive Singularform bezeichnet, dass die betreffende Gestalt gesandt beziehungsweise weggebracht wird; die Formulierung bildet dies ab, ohne das stärkere Bild eines Hineinwerfens einzutragen.
- source_word: ውስተ
  choice: ins
  rationale: Bei einem Verb des Sendens bezeichnet die Präposition eine Bewegung in einen Zielbereich hinein; „ins“ gibt dies idiomatisch wieder.
- source_word: ዋዕይ
  choice: Feuer
  rationale: Der konkrete apokalyptische Bildbegriff wird beibehalten und nicht zu einer allgemeinen Bezeichnung für Strafe verflacht.
theological_decisions:
- issue: Konkretes apokalyptisches Ziel oder abstrakte Strafe
  choice: ins Feuer
  alternative: in die Strafe; in die Glut
  rationale: Der ge'ezische Text nennt konkret Feuer. Dieses Gerichtsbild bleibt daher erhalten, statt es deutend zu abstrahieren.
- issue: Reichweite von ኵነኔ
  choice: Gericht
  alternative: Verurteilung; Urteilsspruch
  rationale: „Gericht“ wahrt die mögliche Bedeutungsspanne zwischen dem gerichtlichen Ereignis und seinem Urteil, ohne die Formulierung unnötig festzulegen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die passive Singularform, die konkrete Feuerbildsprache und die Bedeutungsweite von „Gericht“ bleiben erhalten.
