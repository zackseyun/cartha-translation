base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/016.yaml
  text: Destroy all violence from the face of the earth[a], and every evil deed shall come to an end; and the plant of righteousness and uprightness shall appear[b], and it shall become a blessing.
translation:
  language: de
  text: Vernichte alle Gewalt vom Angesicht der Erde, und jede böse Tat wird ein Ende finden. Die Pflanze der Gerechtigkeit und Rechtschaffenheit[a] wird sichtbar werden, und sie wird zum Segen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Pflanzung von Gerechtigkeit und Rechtschaffenheit“. Das geezische Substantiv kann sowohl das Gepflanzte als auch den Vorgang oder das Ergebnis des Pflanzens bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሕጕል
  choice: Vernichte
  rationale: Die Form ist ein aktiver Imperativ der 2. Person Singular und setzt den an Michael gerichteten Befehl fort. „Vernichte“ bewahrt sowohl den Befehlscharakter als auch die starke Bedeutung des Verbs.
- source_word: ኵሎ ግፍዓ
  choice: alle Gewalttat
  rationale: ግፍዓ umfasst Gewalt, Unterdrückung und gewaltsames Unrecht. Das kollektive „alle Gewalttat“ wahrt die umfassende moralische und soziale Aussage, ohne den Begriff auf legitime Gewalt oder bloß abstraktes Unrecht zu verengen.
- source_word: እምገጸ ምድር
  choice: vom Angesicht der Erde
  rationale: Die semitisch geprägte Wendung enthält wörtlich das „Angesicht“ der Erde. Die Beibehaltung erhält den gehobenen apokalyptischen Sprachklang.
- source_word: ኵሉ ምግባረ እኩይ
  choice: jede böse Tat
  rationale: Die Formulierung hat umfassenden, kollektiv-singulären Sinn. „Jede böse Tat“ ist im modernen Deutschen klar und natürlich.
- source_word: ይኅልቅ
  choice: soll ein Ende finden
  rationale: Das Verb kann „vergehen“, „aufhören“ oder „vollendet werden“ bezeichnen. Bei „jede böse Tat“ gibt „ein Ende finden“ die Beendigung idiomatisch wieder.
- source_word: ያስተርኢ
  choice: soll sichtbar werden
  rationale: Das Verb bezeichnet das Sichtbarwerden oder Offenbarwerden. „Sichtbar werden“ bewahrt diesen Sinn und passt zum Bild einer hervortretenden Pflanze.
- source_word: ተክለ
  choice: die Pflanze
  rationale: Das Substantiv kann das Gepflanzte oder die Pflanzung bezeichnen. „Pflanze“ erhält das konkrete landwirtschaftliche Bild; die mögliche prozesshafte Bedeutung wird in der Fußnote genannt.
- source_word: ጽድቅ ወርትዕ
  choice: der Gerechtigkeit und Rechtschaffenheit
  rationale: ጽድቅ bezeichnet Gerechtigkeit, während ርትዕ Geradheit beziehungsweise moralische Rechtschaffenheit ausdrückt. Die Wortwahl wahrt beide ethischen Begriffe.
- source_word: ይከውን ለበረከት
  choice: sie soll zum Segen werden
  rationale: Die Konstruktion bedeutet wörtlich etwa „sie soll zu einem Segen werden/sein“. Die gewählte Fassung ist natürlich und erhält den resultativen Sinn.
theological_decisions:
- issue: Bedeutung des landwirtschaftlichen Bildes „Pflanze der Gerechtigkeit und Rechtschaffenheit“
  choice: Das konkrete apokalyptische Bild einer Pflanze wird beibehalten.
  alternative: „die Pflanzung von Gerechtigkeit und Rechtschaffenheit“ oder die abstrahierende Wiedergabe „Gerechtigkeit wird gedeihen“
  rationale: Der geezische Text verwendet ein landwirtschaftliches Substantiv. Die konkrete Wiedergabe wahrt die visionäre Bildsprache und lässt zugleich durch die Fußnote die echte lexikalische Mehrdeutigkeit erkennen.
- issue: Sprechakt des ersten Verbs
  choice: 'Direkter Befehl im Imperativ: „Vernichte“'
  alternative: 'Passivischer Zukunftssatz: „Alle Gewalttat soll beseitigt werden“'
  rationale: Die geezische Verbform ist ein Imperativ der 2. Person Singular und führt den an Michael gerichteten Auftrag fort. Eine passive Zukunftsform würde die direkte Anrede und den Befehlscharakter aufheben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter apokalyptischer Bildsprache. Der semitisch geprägte Ausdruck „vom Angesicht der Erde“ bleibt bewusst erhalten; der Imperativ macht die direkte Anrede Michaels deutlich.
