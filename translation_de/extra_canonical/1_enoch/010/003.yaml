base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/010/003.yaml
  text: And now instruct him[c][b][a], that he may flee and preserve his seed for all the generations forever.
translation:
  language: de
  text: Und nun unterweise ihn, damit er flieht und seine Nachkommenschaft[a] über alle Generationen hinweg für immer bestehen bleibt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sein Same“; gemeint ist seine Abstammungslinie beziehungsweise seine Nachkommenschaft.'
    reason: lexical_alternative
  - marker: b
    text: 'Die vorliegende äthiopische Transkription liest an dieser Stelle ein Verb mit der Grundbedeutung „tun, machen“. Grammatik und alte Vergleichsüberlieferung sprechen jedoch für eine ähnlich geschriebene Form mit der Bedeutung „bleiben, übrig bleiben“. Daher: „seine Nachkommenschaft … bestehen bleibt“; nach der transkribierten Lesart wäre sinngemäß auch „seine Nachkommenschaft … erhalten bleibt“ möglich.'
    reason: textual_variant
lexical_decisions:
- source_word: መሀሮ
  choice: unterweise ihn
  rationale: Die Aufforderungsform bezeichnet hier die Weitergabe einer dringlichen göttlichen Weisung. „Unterweise“ bleibt näher am Bedeutungsfeld von lehren und kundtun als das enger deutende „warne“.
- source_word: ይጐይዝ
  choice: damit er flieht
  rationale: Im Zusammenhang des bevorstehenden Gerichts bezeichnet das Verb nicht nur ein Fortgehen, sondern die Flucht aus drohender Gefahr.
- source_word: ይገበር (textkritisch wohl ይተርፍ)
  choice: bestehen bleibt
  rationale: Die überlieferte Transkription bietet ይገበር, doch die nominativische Form ዘርኡ und die griechische Parallele μενεῖ stützen ein intransitives „bleiben/übrig bleiben“. Daher wird die wahrscheinlich zugrunde liegende Lesart ይተርፍ wiedergegeben, ohne daraus ein aktives „seine Nachkommenschaft bewahren“ zu machen.
- source_word: ዘርኡ
  choice: seine Nachkommenschaft
  rationale: Wörtlich „sein Same“. „Nachkommenschaft“ bewahrt den kollektiven Abstammungssinn und ist im heutigen Deutsch verständlicher, ohne ihn auf einzelne Kinder zu verengen.
- source_word: ለኵሎሙ ትውልድ ለዓለም
  choice: über alle Generationen hinweg für immer
  rationale: Die Formulierung erhält sowohl den ausdrücklichen Bezug auf sämtliche Generationen als auch die abschließende Ewigkeitsangabe in natürlichem, gehobenem Deutsch.
theological_decisions:
- issue: Fortbestand der Abstammungslinie oder aktives Bewahren durch den Geretteten
  choice: Seine Nachkommenschaft bleibt durch das kommende Gericht hindurch bestehen.
  alternative: Er bewahrt seine Nachkommenschaft.
  rationale: Grammatik und textkritische Vergleichsevidenz sprechen dafür, „seine Nachkommenschaft“ als Subjekt eines intransitiven Verbs zu verstehen. Die Übersetzung benennt den Fortbestand, ohne festzulegen, ob dieser ausschließlich biologisch oder zugleich heilsgeschichtlich zu verstehen ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Unterweise“ hält den leicht erhöhten Ton der Engelsweisung; „Nachkommenschaft“ ist verständlich und wahrt den genealogischen Sinn. Die doppelte Zeitangabe wird bewusst nicht verkürzt.
