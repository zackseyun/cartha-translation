base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/028.yaml
  text: And on that day the night decreases from its length by a ninth part[a], that is, one part, and the night becomes eleven parts[b], and the day seven parts.
translation:
  language: de
  text: An jenem Tag nimmt die Nacht um ein Neuntel ihrer Länge ab, das heißt um einen Teil; die Nacht umfasst dann elf Teile und der Tag sieben Teile.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኀፀፀት
  choice: verkürzt sich
  rationale: Das Verb bezeichnet eine Verringerung; im Zusammenhang mit der gemessenen Nachtlänge ist „verkürzt sich“ natürlich und genau.
- source_word: ሌሊት
  choice: Nacht
  rationale: Direkte Wiedergabe des Zeitraums, dessen Länge in Teilen gemessen wird.
- source_word: እምኑኃ
  choice: gegenüber ihrer Länge
  rationale: Die Form ist als „von/gegenüber ihrer Länge“ zu verstehen, wobei das Suffix auf die Nacht verweist, nicht als Zahlwort „neun“.
- source_word: ታስዕተ እደ
  choice: um ein Neuntel
  rationale: Die schwierige Wendung bezeichnet am ehesten den Umfang der Verringerung als einen neunten Anteil.
- source_word: ክፍለ አሐደ
  choice: einen Teil
  rationale: Bewahrt die technische Einteilung von Tag und Nacht in Teile.
- source_word: ወኮነት
  choice: und … umfasst
  rationale: Gibt den daraus hervorgehenden Zustand in natürlichem Deutsch wieder.
- source_word: ፲ወ፪ተ ወአሐደ ክፍለ
  choice: elf Teile
  rationale: Die Zahlenfolge wird im astronomischen Schema als Ergebnis von elf Teilen verstanden.
- source_word: መዓልት
  choice: Tag
  rationale: Entspricht als Gegenstück zur Nacht der wiederkehrenden Tag-Nacht-Formel.
- source_word: ሰብዓተ ክፍለ
  choice: sieben Teile
  rationale: Erhält die technische Zahlenangabe des äthiopischen Textes.
theological_decisions:
- issue: Wiedergabe der astronomischen Einteilung
  choice: Die technische Bezeichnung „Teile“ beibehalten.
  alternative: Stunden oder geglättete Zeitanteile
  rationale: Der Abschnitt verwendet ein schematisches astronomisches Teilungssystem. „Teile“ bewahrt dessen eigene Begrifflichkeit, ohne moderne Zeitmessung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die technische Sprache des astronomischen Schemas bleibt erhalten; „umfasst“ vermeidet eine unnatürliche wörtliche Wiedergabe von „wird“.
