base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/013.yaml
  text: And it enters at dawn and goes out through the sixth[a], and it goes out and sets in the sixth gate for thirty-two mornings[d][c][b], according to its sign.
translation:
  language: de
  text: Und sie tritt am Morgen ein und geht durch das sechste[a] hinaus. Sie geht hinaus und geht im sechsten Tor unter, zweiunddreißig Morgen lang[b], wegen ihres Zeichens[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Ge’ez formuliert hier verkürzt: „das sechste“ meint wahrscheinlich das sechste Tor oder die sechste Öffnung.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zweiunddreißig Morgen“; der Zeitraum wird nach Morgen gezählt, nicht ausdrücklich nach Tagen.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ihrem Zeichen entsprechend“. Die zugrunde liegende Präposition kann auch eine Zuordnung oder Beziehung bezeichnen.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ይገብእ ጽባሐ
  choice: am Morgen tritt sie ein
  rationale: Bewahrt das konkrete Bewegungsverb und gibt ጽባሐ natürlich als Zeitangabe wieder; das feminine Pronomen bezieht sich im astronomischen Zusammenhang auf die Sonne.
- source_word: ይወፅእ ውስተ ሳድስት
  choice: geht durch das sechste hinaus
  rationale: Die elliptische Ordinalzahl bezeichnet wohl das sechste Tor beziehungsweise die sechste Öffnung. „Durch“ gibt den Durchgang im Deutschen idiomatisch wieder, ohne das ausgelassene Substantiv im Haupttext zu ergänzen.
- source_word: ይወፅእ ወየዓርብ
  choice: sie geht hinaus und geht … unter
  rationale: Beide Verben werden ausdrücklich wiedergegeben. Im astronomischen Zusammenhang bezeichnet የዓርብ das Untergehen der Sonne.
- source_word: በሳድስት ኆኅት
  choice: im sechsten Tor
  rationale: Unterscheidet die mit በ formulierte Ortsangabe von der vorherigen Konstruktion mit ውስተ und bewahrt die konkrete kosmische Tor-Metaphorik.
- source_word: ሠላሳ ወ፪ ጽባሕ
  choice: zweiunddreißig Morgen lang
  rationale: Behält die ausdrückliche Zählung nach „Morgen“ bei und macht zugleich die Zeitdauer im Deutschen klar.
- source_word: በእንተ ትእምርተ ዚአሃ
  choice: ihrem Zeichen entsprechend
  rationale: Gibt die Phrase im schematisch-astronomischen Zusammenhang als Zuordnung zum Zeichen wieder. Die Präposition kann jedoch auch kausal verstanden werden; diese echte Mehrdeutigkeit wird in einer Fußnote erhalten.
theological_decisions:
- issue: Astronomische Bildsprache himmlischer Öffnungen
  choice: Die konkrete Vorstellung eines „Tores“ bleibt erhalten.
  alternative: Fenster, Öffnung, Sektor oder Bahn
  rationale: Der Text entwirft eine offenbarte kosmische Architektur. Eine Modernisierung zur heutigen astronomischen Fachsprache würde die apokalyptische Bildwelt einebnen.
- issue: Bezug der Schlussphrase auf das Zeichen
  choice: „ihrem Zeichen entsprechend“
  alternative: „wegen ihres Zeichens“ oder „hinsichtlich ihres Zeichens“
  rationale: Die Wendung lässt sowohl eine ordnende Zuordnung als auch eine kausale Beziehung zu. Der Haupttext wählt die im astronomischen Schema gut verständliche Zuordnung, während die Fußnote die kausale Möglichkeit offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener Wiederholung der Bewegungsverben und konkreter apokalyptischer Tor-Bildsprache. Die Sonne wird entsprechend dem üblichen deutschen Genus mit „sie“ aufgenommen.
