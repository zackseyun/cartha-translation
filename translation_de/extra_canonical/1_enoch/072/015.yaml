base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/015.yaml
  text: And the sun rises so that the day grows shorter and the night lengthens[a], and the sun returns to the east and enters into the sixth gate[c][b], and rises from it and sets for thirty mornings.
translation:
  language: de
  text: Und die Sonne geht auf, sodass der Tag kürzer und die Nacht länger wird. Dann kehrt die Sonne nach Osten zurück und tritt durch das sechste Tor ein[a]; aus ihm geht sie auf und geht dreißig Morgen lang unter.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die wiederkehrende Rede von Toren gehört zum kosmischen Schema des Astronomischen Buches; innerhalb der dargestellten Welt sind sie als Tore gemeint und nicht lediglich als Bild für Jahreszeiten.
    reason: cultural_note
  - marker: b
    text: Der letzte Satzteil ist textlich schwierig. „Dreißig Morgen lang“ bezeichnet wahrscheinlich einen dreißigtägigen Abschnitt der Sonnenbahn, während die Sonne dieses Tor benutzt.
    reason: textual_variant
lexical_decisions:
- source_word: ይትነሣእ
  choice: geht auf
  rationale: Das Verb bezeichnet hier das Aufsteigen beziehungsweise Aufgehen der Sonne; „geht auf“ ist im Deutschen die natürliche astronomische Wendung.
- source_word: ትሕጽር ዕለት ወትኑኅ ሌሊት
  choice: sodass der Tag kürzer und die Nacht länger wird
  rationale: Die ausgewogene deutsche Formulierung bewahrt den jahreszeitlichen Gegensatz von abnehmender Tages- und zunehmender Nachtlänge.
- source_word: ይገብእ ፀሐይ በጽባሕ
  choice: Dann kehrt die Sonne nach Osten zurück
  rationale: ይገብእ bezeichnet die Rückkehr; በጽባሕ ist im räumlichen Zusammenhang als die Gegend des Morgens, also Osten, zu verstehen.
- source_word: ይበውእ ውስተ ሳድስት ኆኅት
  choice: tritt durch das sechste Tor ein
  rationale: Das Verb bezeichnet das Eintreten. „Tor“ erhält die konkrete kosmische Bildwelt des Astronomischen Buches; idiomatisches Deutsch verlangt hier „durch“.
- source_word: ይሠርቅ እምኔሃ
  choice: aus ihm geht sie auf
  rationale: Die Formulierung bezeichnet das Hervorgehen beziehungsweise Aufgehen der Sonne aus dem genannten Tor.
- source_word: የዓርብ ሠላሳ ጽባሐ
  choice: geht dreißig Morgen lang unter
  rationale: Die Wendung gibt das Untergehen über einen gezählten Abschnitt von dreißig Morgen wieder, ohne „Morgen“ stillschweigend durch „Tage“ zu ersetzen.
theological_decisions:
- issue: Kosmische Tore
  choice: Die Tore werden als konkrete Bestandteile der geschauten Welt dargestellt.
  alternative: Die Tore als bloße Metapher für Jahreszeiten wiederzugeben.
  rationale: Der Text beschreibt ein kosmisches Schema; eine metaphorische Auflösung würde eine nicht ausdrücklich ausgesprochene Deutung in die Übersetzung eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die räumliche Rückkehr nach Osten wird ausdrücklich von dem anschließenden Eintreten durch das Tor unterschieden. Die ungewöhnliche Zählung nach „Morgen“ bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
