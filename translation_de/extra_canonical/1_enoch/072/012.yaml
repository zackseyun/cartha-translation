base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/012.yaml
  text: And at that time the day grows longer by two parts[a], and the day becomes eleven parts[b], and the night grows shorter and becomes seven parts.
translation:
  language: de
  text: Und zu jener Zeit wird der Tag um zwei Teile länger[a], und der Tag umfasst elf Teile; die Nacht wird kürzer und umfasst sieben Teile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Wort für »zwei« ist in dieser Textüberlieferung als unsicher gekennzeichnet. Die anschließende Angabe von elf Teilen für den Tag und sieben Teilen für die Nacht stützt jedoch den Sinn, dass der Tag um zwei Teile länger wird.
    reason: textual_variant
lexical_decisions:
- source_word: ወእሜሃ
  choice: Und zu jener Zeit
  rationale: Gibt die zeitliche Übergangsformel natürlich und ohne unnötige Präzisierung wieder.
- source_word: ይነኍኅ ዕለት
  choice: wird der Tag … länger
  rationale: Das Verb bezeichnet hier eine Zunahme der Länge; der Zusammenhang bestätigt dies durch die anschließenden elf Teile des Tages.
- source_word: †ክልኤ† እደ
  choice: um zwei Teile
  rationale: Die unsichere Zahl wird als »zwei« wiedergegeben; die Maßeinheit »Teile« ist aus dem unmittelbaren Kontext ergänzt und entspricht der fortlaufenden Einteilung in Tages- und Nachtteile.
- source_word: ወትከውን ዕለት ዓሠርተ ወአሐደ ክፍለ
  choice: und der Tag umfasst elf Teile
  rationale: »Umfasst« ist im Deutschen bei Maßangaben natürlicher als das wörtliche »wird zu«, bewahrt aber den ausdrücklich wiederholten Satzgegenstand »der Tag«.
- source_word: ወተሐጽር ሌሊት
  choice: die Nacht wird kürzer
  rationale: Bewahrt den ausdrücklichen Gegensatz zwischen dem länger werdenden Tag und der kürzer werdenden Nacht.
- source_word: ወትከውን ሰብዓተ ክፍለ
  choice: und umfasst sieben Teile
  rationale: Gibt die abschließende Maßangabe knapp und parallel zur Angabe über den Tag wieder.
