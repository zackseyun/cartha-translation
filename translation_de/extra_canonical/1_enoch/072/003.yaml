base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/003.yaml
  text: And I saw six portals from which the sun rises[a], and six portals where the sun sets, and the moon rises and sets in those portals. And the leaders of the stars, together with those whom they lead, are six in the east and six in the west; and all of them, one after another, in exact order[c][b], with many windows to the right and to the left of those portals.
translation:
  language: de
  text: Und ich sah sechs Tore, aus denen die Sonne aufgeht, und sechs Tore, an denen die Sonne untergeht; und der Mond geht an diesen Toren auf und unter. Die Führer der Sterne samt denen, die sie führen, sind sechs im Osten und sechs im Westen. Sie folgen alle in genauer Ordnung aufeinander,[a] und rechts und links von diesen Toren befinden sich viele Fenster.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Wendung kann auch bedeuten: „alle, einer nach dem anderen, ordnungsgemäß“.'
    reason: lexical_alternative
  - marker: b
    text: Der letzte Satzteil ist textlich und sprachlich schwierig. Gemeint sind wahrscheinlich zahlreiche kleinere Öffnungen zu beiden Seiten der Tore.
    reason: textual_variant
lexical_decisions:
- source_word: ወርኢኩ
  choice: Und ich sah
  rationale: Bewahrt den ausdrücklichen visionären Bericht in der ersten Person und klingt in modernem Deutsch würdig und natürlich.
- source_word: ኃዋኅወ
  choice: Tore
  rationale: Bezeichnet im astronomischen Buch die kosmischen Öffnungen am Horizont; „Tore“ bewahrt das Bild und ist im Deutschen verständlicher als „Portale“.
- source_word: እለ ኀበ ይወፅእ ፀሐይ
  choice: aus denen die Sonne aufgeht
  rationale: Gibt das Hervortreten der Sonne aus den Toren idiomatisch wieder.
- source_word: እለ ኀበ የዓርብ ፀሐይ
  choice: an denen die Sonne untergeht
  rationale: Wahrt die durch die Syntax geforderte Zuordnung des ersten Untergehens allein zur Sonne.
- source_word: ወወርኅ በውእቶን ኃዋኅወ ይሠርቅ ወየዓርብ
  choice: und der Mond geht an diesen Toren auf und unter
  rationale: Folgt der wahrscheinlichsten Satzgliederung, nach der der Mond Subjekt beider Verben ist.
- source_word: መራኄሆሙ ለከዋክብት
  choice: die Führer der Sterne
  rationale: Bewahrt die leitende Funktion, ohne die Gestalten ausdrücklich als Engel zu identifizieren.
- source_word: ምስለ እለ ይመርኅዎሙ
  choice: samt denen, die sie führen
  rationale: Erhält die Beziehung zwischen den Führern und den von ihnen Geführten.
- source_word: ፮በጽባሕ ወ፮በምዕራብ
  choice: sechs im Osten und sechs im Westen
  rationale: Gibt die kosmische Richtungsordnung knapp und klar wieder.
- source_word: ኵሎሙ ፩፩እምድኅረ ካልኡ ርቱዕ
  choice: Sie alle folgen einer nach dem anderen in genauer Ordnung
  rationale: Vermittelt sowohl die geregelte Abfolge als auch den Gedanken der Richtigkeit beziehungsweise Ordnung.
- source_word: መላክወ ብዙኃት
  choice: viele Fenster
  rationale: Die schwierige Wendung scheint kleinere seitliche Öffnungen neben den Haupttoren zu bezeichnen; die Unsicherheit wird in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Identität der „Führer der Sterne“
  choice: Neutral als „Führer der Sterne“ wiedergegeben
  alternative: „Engel, welche die Sterne führen“
  rationale: Der Wortlaut beschreibt ihre Funktion, nennt sie hier aber nicht ausdrücklich Engel; eine engelhafte Deutung wird deshalb nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kosmische Bildsprache bleibt erhalten; schwer verständliche oder theologisch nicht ausdrückliche Einzelheiten werden nicht ausdeutend ergänzt.
