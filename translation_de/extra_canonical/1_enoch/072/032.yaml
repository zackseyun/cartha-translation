base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/032.yaml
  text: On that day the night decreases and becomes nine parts[a], and the day becomes nine parts, and the night equals the day[b], and the year becomes exact.
translation:
  language: de
  text: An diesem Tag nimmt die Nacht ab und beträgt neun Teile[a], und der Tag beträgt neun Teile; die Nacht wird dem Tag gleich, und das Jahr wird genau bemessen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die wiederholte Angabe »neun Teile« entspricht der schematischen Einteilung von Tag und Nacht in nummerierte Anteile im astronomischen System des Buches.
    reason: cultural_note
  - marker: b
    text: Die Wendung kann auch mit »das Jahr wird genau«, »das Jahr wird richtig bemessen« oder »das Jahr wird vollständig« wiedergegeben werden. Das zugrunde liegende ge’ezische Wort kann Genauigkeit, richtige Bemessung oder Vollständigkeit bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: An jenem Tag
  rationale: Gibt die bestimmte zeitliche Verweisung idiomatisch und mit ihrer deiktischen Kraft wieder.
- source_word: ትኃፅፅ ሌሊት
  choice: nimmt die Nacht ab
  rationale: Bewahrt den messenden, astronomischen Sinn der Verringerung in natürlichem Deutsch.
- source_word: ትስዓተ ክፍለ
  choice: neun Teile
  rationale: Entspricht der schematischen Einteilung von Tag und Nacht in nummerierte Anteile im astronomischen System des Buches.
- source_word: ይትዓረይ ሌሊት ምስለ ማዓልት
  choice: So wird die Nacht dem Tag gleich
  rationale: Gibt die Gleichheit von Nacht und Tag wieder und bewahrt mit „wird ... gleich“ den im Verb liegenden Vorgang.
- source_word: ዓመት ጥንቅቀ
  choice: das Jahr erhält sein genaues Maß
  rationale: Vermittelt im kalenderkundlichen Zusammenhang Genauigkeit und richtige Bemessung, ohne die Wendung unnötig als abstrakte Vollkommenheit zu deuten.
theological_decisions:
- issue: Kalenderangabe beim Gleichstand von Nacht und Tag
  choice: Als sachliche astronomisch-kalendarische Aussage über gleich bemessene Nacht und Tag wiedergegeben.
  alternative: Als symbolische Aussage über kosmische Vollkommenheit oder nur als ungefähre jahreszeitliche Gleichheit verstehen.
  rationale: Der unmittelbare Zusammenhang des Buches der Himmelslichter arbeitet mit berechneten Anteilen und Kalendermaßen; eine darüber hinausgehende theologische Deutung sollte nicht in den Text eingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer astronomischer Terminologie. Die Satzstruktur bleibt nahe am ge’ezischen Aufbau, wird aber durch einen Satzpunkt und „So“ für heutige Leser gegliedert.
