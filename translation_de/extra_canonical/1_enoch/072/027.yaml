base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/027.yaml
  text: And the sun completes its courses[a], and again it travels upon those courses; and it enters through that gate for thirty mornings[e][d][c][b], and in the west it sets opposite it.
translation:
  language: de
  text: Und die Sonne vollendet ihre Bahnen[a] und zieht wieder auf diesen Bahnen entlang. Dreißig Morgen lang tritt sie durch jenes Tor ein[b] und geht im Westen ihm gegenüber unter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher etwa: »ihre Häupter«; im astronomischen Zusammenhang sind damit wohl ihre Bahnen oder Stationen gemeint.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »dreißig Morgen«; gemeint ist vermutlich ein Zeitraum von dreißig täglichen Erscheinungen durch dasselbe Tor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ፈጸመ
  choice: vollendet
  rationale: Das Perfekt wird im Rahmen der fortlaufenden astronomischen Beschreibung präsentisch wiedergegeben; das Verb bezeichnet das Zu-Ende-Bringen des Umlaufs.
- source_word: አርእስቲሁ
  choice: ihre Bahnen
  rationale: Die Form ist pluralisch und bezeichnet hier die geordneten Laufbahnen beziehungsweise Stationen der Sonne; „Bahnen“ ist im Deutschen natürlich und wahrt den Plural.
- source_word: ዳግመ የሐውር ዲበ ዝኩ አርእስቲሁ
  choice: zieht wieder auf diesen Bahnen entlang
  rationale: Bewahrt Wiederholung, Bewegung und den Rückverweis auf die zuvor genannten Bahnen.
- source_word: ይበውእ በውእቱ ኆኅት
  choice: tritt sie durch jenes Tor ein
  rationale: Erhält die konkrete kosmologische Vorstellung vom Eintritt der Sonne durch ein himmlisches Tor.
- source_word: ሠላሳ ጸባሐ
  choice: Dreißig Morgen lang
  rationale: „Morgen“ gibt das konkrete Zeitwort genauer wieder als die glättende Übersetzung „Tage“ und bezeichnet hier wohl dreißig tägliche Erscheinungen.
- source_word: በምዕራብኒ ... የዓርብ
  choice: geht im Westen ... unter
  rationale: Das Verb bezeichnet in diesem astronomischen Zusammenhang den Sonnenuntergang; die deutsche Wendung ist idiomatisch.
- source_word: በመንጸሩ
  choice: ihm gegenüber
  rationale: Die überprüfte Lesart bedeutet „ihm gegenüber“ und bezieht sich auf das Tor; sie ersetzt die fehlerhafte OCR-Lesung በምንዳቤሁ.
theological_decisions:
- issue: Kosmologische Bildsprache von Toren und Sonnenbahnen
  choice: Die konkrete Tor- und Bahnsprache bleibt erhalten.
  alternative: Umformulierung als moderne abstrakte Astronomie.
  rationale: Der Text entfaltet eine visionäre, geordnete Kosmologie. Eine Modernisierung würde seine eigene Vorstellungswelt verdecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parataktische Charakter des Ausgangstextes bleibt weitgehend gewahrt; die zweite Satzhälfte wird für natürliche deutsche Lesbarkeit leicht umgestellt. Alle echten lexikalischen Unsicherheiten werden kenntlich gemacht, während die nach Kollation erkannte OCR-Fehllesung nicht als mögliche Lesart fortgeführt wird.
