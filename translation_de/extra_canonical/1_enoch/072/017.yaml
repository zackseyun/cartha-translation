base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/017.yaml
  text: And the sun goes out from the west[a], from that sixth gate, and travels eastward, and rises in the fifth gate for thirty mornings[b], and sets again in the west in the fifth western gate.
translation:
  language: de
  text: Und die Sonne tritt aus dem Westen hervor, aus jenem sechsten Tor, zieht nach Osten und geht dreißig Morgen lang[a] im fünften Tor auf; dann geht sie wieder im Westen unter, im fünften westlichen Tor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »dreißig Morgen«. Gemeint sein kann eine Zählung von Tagen; die äthiopische Ausdrucksweise bleibt hier jedoch erhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይወፅእ ፀሐይ
  choice: Und die Sonne tritt … hervor
  rationale: Das Verb bezeichnet ein Hervor- oder Hinaustreten. „Tritt hervor“ gibt die Bewegung durch die kosmischen Tore natürlich und würdig wieder.
- source_word: እምነ ምዕራብ
  choice: aus dem Westen
  rationale: Die Präposition bedeutet schlicht „aus/von“; ein zusätzliches „von dort“ ist im Ausgangstext nicht belegt.
- source_word: እምይእቲ ሳድስት ኆኅት
  choice: aus jenem sechsten Tor
  rationale: „Tor“ bewahrt die wiederkehrende kosmologische Bildsprache des Abschnitts; das Demonstrativum wird mit „jenem“ erhalten.
- source_word: ወየሐውር ምሥራቀ
  choice: zieht nach Osten
  rationale: Die Formulierung gibt die gewöhnliche Bewegung und die östliche Richtung knapp und natürlich wieder.
- source_word: ወይሠርቅ በኃምስት ኆኅት
  choice: geht … im fünften Tor auf
  rationale: Im Zusammenhang mit der Sonne bezeichnet das Verb ihren Aufgang. Die Präposition wird entsprechend dem räumlichen Muster des Kapitels mit „im“ wiedergegeben.
- source_word: ሠላሳ ጽባሐ
  choice: dreißig Morgen lang
  rationale: Der Text sagt wörtlich „dreißig Morgen“. Die zeitliche Dauer wird im Deutschen durch „lang“ verständlich, ohne zu „Tage“ zu glätten.
- source_word: ወየዓርብ
  choice: dann geht sie wieder … unter
  rationale: Im Parallelismus zum Sonnenaufgang bezeichnet das Verb hier den Sonnenuntergang; „dann“ macht die zeitliche Folge im Deutschen natürlich, „wieder“ gibt ካዕበ wieder.
- source_word: ኃምስተ ኆኅተ እንተ ምዕራብ
  choice: im fünften westlichen Tor
  rationale: Die Formulierung hält die Entsprechung zwischen dem fünften Tor im Osten und dem fünften Tor im Westen ausdrücklich fest.
theological_decisions:
- issue: Kosmologische Bildsprache der Tore
  choice: Die wörtliche Bezeichnung „Tor“ wird beibehalten.
  alternative: Öffnung, Portal oder Horizont
  rationale: Der Abschnitt schildert eine strukturierte visionäre Kosmologie. „Tor“ bewahrt diese apokalyptische Bildwelt, ohne sie an ein modernes astronomisches Modell anzugleichen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die wiederholte Tor-Terminologie und die eigentümliche Zeitangabe des Ausgangstextes werden bewahrt; unnötige Archaismen werden vermieden.
