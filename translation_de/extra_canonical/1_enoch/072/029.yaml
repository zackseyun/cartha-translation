base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/029.yaml
  text: And the sun returns and enters the second gate[a], which is in the east; and it returns to that principal course for thirty mornings[c][b], rising and setting.
translation:
  language: de
  text: Und die Sonne kehrt zurück und tritt in das zweite Tor ein, das im Osten liegt; und sie kehrt dreißig Morgen lang zu jener Hauptbahn zurück und geht auf und unter[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die äthiopische Wendung „auf dieser/seiner Hauptbahn“ ist syntaktisch schwierig. Die genaue Beziehung von „auf dieser“ zu „Hauptbahn“ und zum zweiten Tor ist unsicher; möglich ist auch eine Wiedergabe wie: „und sie kehrt auf dieser Hauptbahn dreißig Morgen lang zurück“.'
    reason: textual_uncertainty
lexical_decisions:
- source_word: ገብአ
  choice: kehrt zurück
  rationale: Das Verb bezeichnet hier die Rückkehr der Sonne; das eigentliche Aufgehen wird am Versende durch ይሠርቅ ausgedrückt.
- source_word: ቦአ ውስተ
  choice: tritt durch … ein
  rationale: Die Wendung beschreibt eine Bewegung in das Tor hinein und bewahrt das Bild der astronomischen Tore.
- source_word: ካልእ ኆኅት
  choice: das zweite Tor
  rationale: Im fortlaufenden Zusammenhang der nummerierten Tore ist ካልእ ordinal als „zweite“ zu verstehen.
- source_word: እንተ በምሥራቅ
  choice: das im Osten liegt
  rationale: Die Relativkonstruktion bestimmt die Lage des Tores.
- source_word: ይገብእ ዲበ ዝኩ አርእስቲሁ
  choice: sie kehrt auf jene Hauptbahn zurück
  rationale: Die Wiedergabe erhält sowohl den Gedanken der Rückkehr als auch den ausdrücklichen Bezug auf die maßgebliche beziehungsweise hauptsächliche Bahn; die genaue Konstruktion ist jedoch unsicher.
- source_word: ሠላሳ ጸባሐ
  choice: für dreißig Morgen
  rationale: Die Zeitangabe bezeichnet die Dauer von dreißig morgendlichen Zyklen.
- source_word: ይሠርቅ ወየዓርብ
  choice: wobei sie auf- und untergeht
  rationale: Die beiden Verben bilden das natürliche astronomische Gegensatzpaar von Aufgang und Untergang.
