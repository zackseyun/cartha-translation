base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/022.yaml
  text: And on that day the night exceeds the day[a], and the night increases from night to night, and the day grows shorter from day to day, until thirty mornings, and the night becomes exactly ten parts[e][d][c][b], and the day eight parts.
translation:
  language: de
  text: Und an jenem Tag ist die Nacht länger als der Tag, und die Nacht nimmt von Nacht zu Nacht zu, während der Tag von Tag zu Tag kürzer wird, bis dreißig Morgen vergangen sind.[a] Dann umfasst die Nacht genau zehn Teile[b] und der Tag acht Teile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bis dreißig Morgen“. Gemeint sein kann eine Folge von dreißig Morgen beziehungsweise Morgendämmerungen im jahreszeitlichen Ablauf.'
    reason: cultural_note
  - marker: b
    text: Das hier mit „genau“ wiedergegebene äthiopische Wort kann auch „vollständig“ oder „in vollem Maß“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: an jenem Tag
  rationale: Die übliche deutsche Zeitangabe bewahrt die Abfolge der astronomischen Darstellung.
- source_word: ትነሡኅ ሌሊት እምዕለት
  choice: ist die Nacht länger als der Tag
  rationale: Im Zusammenhang bezeichnet das Verb eine Zunahme der Dauer; mit እም hat die Wendung hier vergleichenden Sinn. Die natürliche deutsche Formulierung gibt diesen präzise wieder.
- source_word: ወሌሊት እምሌሊት ትነሡኅ
  choice: die Nacht nimmt von Nacht zu Nacht zu
  rationale: Die Wiederholung des Substantivs mit እም bezeichnet eine fortschreitende Zunahme.
- source_word: ወተሐጽር ዕለት እምዕለት
  choice: während der Tag von Tag zu Tag kürzer wird
  rationale: Das Verb bezeichnet Verkürzung; die wiederholte Zeitangabe drückt eine schrittweise Entwicklung aus. „Während“ macht den parallelen Gegensatz im Deutschen klar, ohne den Sachgehalt zu verändern.
- source_word: እስከ ሠላሳ ጸባሕ
  choice: bis dreißig Morgen vergangen sind
  rationale: ጸባሕ bedeutet wörtlich „Morgen“ beziehungsweise „Morgendämmerung“. Die Ergänzung „vergangen sind“ macht die Zählfunktion der elliptischen Ausgangsform im Deutschen verständlich, ohne sie zu „Tagen“ umzudeuten.
- source_word: ዐሠርተ ክፍለ
  choice: zehn Teile
  rationale: Die technische Einteilung der Dauer wird beibehalten und nicht in moderne Stunden umgerechnet.
- source_word: ጥንቁቀ
  choice: genau
  rationale: Das Wort qualifiziert das Maß wahrscheinlich als exakt oder vollständig; „genau“ bewahrt die technische Präzision knapp und natürlich.
- source_word: ስመንተ ክፍለ
  choice: acht Teile
  rationale: Die parallele Maßsprache der astronomischen Darstellung wird gewahrt.
theological_decisions:
- issue: Astronomische Maßeinheiten
  choice: „Teile“ für die Maße von Nacht und Tag beibehalten
  alternative: In Stunden umrechnen oder nur allgemein von längeren Nächten und kürzeren Tagen sprechen
  rationale: Der Text verwendet ein schematisches kosmologisches Maßsystem. „Teile“ wahrt dieses Weltbild und vermeidet eine anachronistische Umrechnung in moderne Uhrstunden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Sachstil. Die technische astronomische Ausdrucksweise und die Zählung nach „Morgen“ bleiben erhalten; unnötige altertümliche Formen und moderne Umdeutungen werden vermieden.
