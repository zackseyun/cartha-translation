base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/014.yaml
  text: On that day the day becomes longer than the night[a], and the day becomes twice the night, and the day becomes twelve parts[b], and the night grows shorter and becomes six parts.
translation:
  language: de
  text: An jenem Tag wird der Tag länger als die Nacht und doppelt so lang wie sie.[a] Der Tag umfasst zwölf Teile,[b] und die Nacht wird kürzer und umfasst sechs Teile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die vorliegende Transkription bietet an dieser Stelle eine Zeichenfolge, die wie „neun Teile der Nacht“ gelesen werden könnte. Wahrscheinlich wurde jedoch der ähnlich aussehende Buchstabe ፅ als die Ziffer ፱ erfasst; die zugrunde liegende Lesart bedeutet „doppelt“. Dazu passt die anschließende Angabe: zwölf Teile des Tages gegenüber sechs Teilen der Nacht.'
    reason: textual_note
  - marker: b
    text: „Teile“ bezeichnet hier die schematischen Einheiten, in die Tag und Nacht in diesem Kapitel eingeteilt werden.
    reason: cultural_note
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: An jenem Tag
  rationale: Gibt die zeitliche Einleitungsformel natürlich wieder und bewahrt die Abfolge der astronomischen Darstellung.
- source_word: ትነውኅ ዕለት እምሌሊት
  choice: wird der Tag länger als die Nacht
  rationale: Das Verb bezeichnet ein Längerwerden; die Präposition ist im astronomischen Zusammenhang vergleichend zu verstehen.
- source_word: ዕፅበተ ሌሊት (im vorliegenden Transkript als ፱ዕበተ ሌሊት)
  choice: doppelt so lang wie sie
  rationale: Die kontextuell und paläographisch begründete Lesart ዕፅበተ bedeutet „das Doppelte“. Sie stimmt mit den unmittelbar folgenden zwölf Teilen des Tages und sechs Teilen der Nacht überein.
- source_word: ክፍለ ፲ወ፪
  choice: zwölf Teile
  rationale: ክፍል bezeichnet eine Einteilung oder einen Teil; „Teile“ wahrt das schematische Zeitsystem des Kapitels.
- source_word: ትኃጽር
  choice: wird kürzer
  rationale: Bewahrt den beobachtenden Vorgangscharakter und bildet das Gegenstück zu „wird … länger“.
- source_word: ስድስተ ክፍል
  choice: sechs Teile
  rationale: Direkte und verständliche Wiedergabe der technischen Zeiteinteilung.
theological_decisions:
- issue: Ob die schematische astronomische Ausdrucksweise geglättet werden soll
  choice: Die Einteilung in zwölf beziehungsweise sechs Teile wird ausdrücklich beibehalten.
  alternative: Den Vers lediglich als moderne Verhältnisangabe wiederzugeben.
  rationale: Die wiederkehrende, zahlengebundene Darstellungsweise gehört zum besonderen astronomisch-apokalyptischen Register des Werkes und enthält keine konfessionell zu vereindeutigende Aussage.
- issue: Umgang mit der zweifelhaften Transkription ፱ዕበተ
  choice: Die paläographisch wahrscheinliche Lesart ዕፅበተ („doppelt“) wird im Haupttext übersetzt und in einer Fußnote offengelegt.
  alternative: „neun Teile der Nacht“ nach der maschinell erfassten Zeichenfolge.
  rationale: Die Verwechslung des Buchstabens ፅ mit der Ziffer ፱ erklärt die Transkription; außerdem bestätigt das Verhältnis zwölf zu sechs die Lesart „doppelt“.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die formelhafte Wiederholung wird leicht geglättet, die sachliche Parallelität von längerem Tag und kürzerer Nacht sowie das technische Wort „Teile“ bleiben erhalten.
