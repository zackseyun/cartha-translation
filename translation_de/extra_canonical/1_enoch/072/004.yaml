base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/004.yaml
  text: And first a great light comes forth[a], whose name is the sun, and its disk is like the disk of heaven[c][b], and it is wholly full of fire that gives light and heat.
translation:
  language: de
  text: Und zuerst geht ein großes Licht hervor[c], dessen Name die Sonne ist. Seine Scheibe ist wie die Scheibe des Himmels[a], und es ist ganz und gar erfüllt von Feuer, das Licht spendet und wärmt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sein Rund ist wie das Rund des Himmels“ beziehungsweise „sein Kreis ist wie der Kreis des Himmels“. Das geʿezische Wort kann eine runde Gestalt, einen Kreis oder einen Umlauf bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „das leuchtet und brennt“ oder „das Licht gibt und erhitzt“.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Und als Erstes geht ein großes Licht hervor“; nach einer anderen Satzauffassung: „Und das Erste geht als ein großes Licht hervor“.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ቀዳማዊ
  choice: zuerst
  rationale: Die adverbiale Wiedergabe lässt „ein großes Licht“ als Subjekt des Verbs hervortreten und entspricht dem wahrscheinlichen Satzbau; die substantivische Lesart bleibt in Fußnote [c] erhalten.
- source_word: ይወፅእ
  choice: geht … hervor
  rationale: Bewahrt die anschauliche Bewegung des Erscheinens und klingt in einer astronomischen Vision natürlich und würdig.
- source_word: ብርሃን ዓቢይ
  choice: ein großes Licht
  rationale: Gibt die Grundbedeutung unmittelbar wieder und bewahrt die kosmische Bildsprache, ohne das Licht vorschnell als Himmelskörper zu erklären.
- source_word: ዘስሙ ፀሐይ
  choice: dessen Name die Sonne ist
  rationale: Erhält die ausdrückliche Namensformel des geʿezischen Relativsatzes statt sie zu „das Sonne genannt wird“ abzuflachen.
- source_word: ክበቡ … ክበበ
  choice: seine Scheibe … die Scheibe
  rationale: „Scheibe“ bezeichnet hier plausibel die sichtbare runde Gestalt und bewahrt zugleich die Wiederholung desselben Wortstamms im Vergleich.
- source_word: ኵሉ ምሉእ
  choice: ganz und gar erfüllt
  rationale: Die verstärkte Formulierung gibt die doppelte Betonung vollständiger Fülle idiomatisch wieder.
- source_word: እሳት
  choice: Feuer
  rationale: Bewahrt die elementare, apokalyptische Bildsprache des Ausgangstextes.
- source_word: ዘያበርህ ወያውዒ
  choice: das Licht spendet und wärmt
  rationale: Gibt die beiden Wirkungen des Feuers verständlich und parallel wieder; alternative Nuancen wie „leuchtet und brennt“ bleiben in Fußnote [b] sichtbar.
theological_decisions:
- issue: Wesen der Sonne in der Darstellung
  choice: Die Sonne erscheint als benanntes großes Licht mit feuriger Leucht- und Wärmekraft.
  alternative: Die Namensformel könnte als stärkere Personifizierung oder Vergöttlichung der Sonne verstanden werden.
  rationale: Der Text verwendet lebhafte apokalyptisch-astronomische Bildsprache, verlangt aber weder eine Vergöttlichung noch eine modern-wissenschaftliche Entmythologisierung. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem visionärem Ton. Die auffällige Wiederholung „Scheibe … Scheibe“ wahrt bewusst die Wiederholung des geʿezischen Wortstamms; Fußnoten sichern die lexikalische und syntaktische Mehrdeutigkeit.
