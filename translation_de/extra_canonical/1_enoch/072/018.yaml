base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/018.yaml
  text: On that day the day diminishes by two parts[a], and the day becomes ten parts[b], and the night eight parts.
translation:
  language: de
  text: An jenem Tag nimmt der Tag um zwei Teile ab[a]; der Tag wird dann zehn Teile lang[b] und die Nacht acht Teile lang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Astronomische Buch misst die Dauer von Tageslicht und Dunkelheit regelmäßig in nummerierten »Teilen«. Hier wird die jahreszeitliche Abnahme des Tageslichts beschrieben: Der Tag hat zehn Teile, die Nacht acht.'
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher: »und der Tag wird zehn Teile und die Nacht acht Teile«; gemeint ist die jeweilige Länge nach der hier verwendeten Einteilung.'
    reason: translation_note
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: An jenem Tag
  rationale: Gibt die zeitliche Formel mit ihrer demonstrativen Bestimmtheit natürlich und präzise wieder.
- source_word: ተሐፅፅ
  choice: nimmt … ab
  rationale: Bezeichnet hier die saisonale Verringerung der Tageslänge; die Formulierung ist im astronomischen Zusammenhang idiomatisch.
- source_word: ተክልኤተ ክፍል
  choice: um zwei Teile
  rationale: Drückt das Maß der Verringerung aus, nicht eine Aufteilung in zwei Teile.
- source_word: ወትከውን
  choice: umfasst dann
  rationale: Vermittelt den resultierenden Zustand und lässt den ausdrücklich folgenden Tag als Subjekt erkennen.
- source_word: ዕለት ዓሠርተ ክፍለ
  choice: der Tag umfasst dann zehn Teile
  rationale: Bewahrt die schematische Zählung in Teilen und formuliert sie in natürlichem Deutsch.
- source_word: ወሌሊት ስመንተ ክፍለ
  choice: und die Nacht acht Teile
  rationale: Die parallele, elliptische Formulierung entspricht der knappen Struktur des Ausgangstextes.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die technische Bezeichnung »Teile« bleibt erhalten; »umfasst dann« vermeidet im Deutschen die missverständliche Aussage, der Tag selbst werde in zehn Bestandteile zerlegt.
