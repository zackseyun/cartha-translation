base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/002.yaml
  text: 'And this is the first law of the luminaries: the sun, a light, has its rising in the portals of heaven on the east, and its setting in the western portals of heaven.'
translation:
  language: de
  text: 'Und dies ist das erste Gesetz[a] der Himmelslichter: Die Sonne, ein Licht, hat ihren Aufgang in den Toren des Himmels im Osten[b] und ihren Untergang in den Toren des Himmels im Westen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Anordnung“ oder „Regel“ der Himmelslichter. Gemeint ist die feststehende Ordnung, die ihre Bahnen bestimmt.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlicher ist die Richtungsangabe mit dem Morgen beziehungsweise der Morgendämmerung und dem Westen verbunden. Gemeint sind die östlichen und westlichen Tore des Himmels.
    reason: lexical_alternative
lexical_decisions:
- source_word: ትእዛዝ
  choice: Gesetz
  rationale: Im Astronomischen Buch bezeichnet das Wort die feststehende Ordnung, der die Himmelskörper folgen, nicht ein einmaliges Gebot.
- source_word: ቀዳማዊ
  choice: erste
  rationale: Kennzeichnet den ersten Punkt einer Abfolge kosmischer Ordnungen.
- source_word: ብርሃናት
  choice: Himmelslichter
  rationale: Gibt die himmlischen Leuchtkörper natürlich und verständlich wieder und bewahrt zugleich den gehobenen astronomischen Ton.
- source_word: ፀሐይ
  choice: die Sonne
  rationale: Direkte Bezeichnung des hier behandelten Himmelskörpers.
- source_word: ብርሃን
  choice: ein Licht
  rationale: Bewahrt die substantivische Apposition zur Sonne, ohne sie erklärend auszuweiten.
- source_word: መዋፅኢሁ (nach der korrigierten Lesart; im übermittelten Text fehlerhaft መባእ)
  choice: ihren Aufgang
  rationale: Die korrigierte Lesart bezeichnet das Hervorgehen beziehungsweise Aufgehen der Sonne und steht parallel zu ihrem Untergang; sie verhindert eine Umkehrung der astronomischen Bewegung.
- source_word: ኃዋኅወ
  choice: Tore
  rationale: Bezeichnet die strukturierten himmlischen Durchgänge der apokalyptischen Kosmologie; „Tore“ ist im Deutschen würdig und unmittelbar verständlich.
- source_word: መንገለ ጽባሕ
  choice: im Osten
  rationale: Die Wendung orientiert sich an Morgen beziehungsweise Morgendämmerung; „im Osten“ macht die Richtungsangabe idiomatisch deutlich.
- source_word: ምዕራቢሁ
  choice: ihren Untergang
  rationale: Die nominale Form bezeichnet hier das Untergehen der Sonne und bildet den Gegenpol zu ihrem Aufgang.
- source_word: ዘምዕራብ
  choice: im Westen
  rationale: Bewahrt den klaren räumlichen Gegensatz zum Osten in natürlichem Deutsch.
theological_decisions:
- issue: Art der kosmischen Ordnung
  choice: „Gesetz“ als feststehende Ordnung der Himmelslichter
  alternative: „Gebot“, „Anordnung“ oder „Regel“
  rationale: Der Vers beschreibt keine moralische Weisung an Menschen, sondern die geregelte Ordnung der Schöpfung. „Gesetz“ erhält diese kosmologische Aussage, ohne eine konfessionelle Deutung einzutragen.
- issue: Bewegungsrichtung der Sonne
  choice: Aufgang im Osten und Untergang im Westen
  alternative: Eintreten im Osten und Hinausgehen im Westen nach dem fehlerhaft überlieferten Wortlaut der Transkription
  rationale: Die in der Editionsüberlieferung bestätigte korrigierte Lesart sowie der Parallelismus verlangen die normale astronomische Abfolge; die OCR-Form መባእ würde sie irreführend umkehren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Himmelslichter“ ist verständlicher und natürlicher als „Leuchten“, während „Tore des Himmels“ die konkrete apokalyptische Bildwelt wahrt. Die Satzstruktur bleibt nahe an der nominalen und parallelen Form des geʿezischen Textes.
