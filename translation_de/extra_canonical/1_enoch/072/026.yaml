base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/026.yaml
  text: And on that day the night increases and becomes nine parts[a], and the night becomes twelve parts and two parts exactly[d][c][b], and the day six parts.
translation:
  language: de
  text: Und an jenem Tag nimmt die Nacht ab und beträgt neun Teile des Tages[a]; und die Nacht beträgt zwölf Teile und zwei Teile genau[b], der Tag aber sechs Teile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Zahlenangabe ist im äthiopischen Text schwierig. Die vorgelegte Transkription zeigt hier sogar ein Zahlzeichen, das gewöhnlich „vierzig“ bedeutet, während die konsultierte Textfassung und der astronomische Zusammenhang „neun“ voraussetzen. Der Wortlaut wurde daher nicht weiter rechnerisch harmonisiert.
    reason: textual_variant
  - marker: b
    text: Die ungewöhnliche Folge kann wörtlich als „zwölf Teile und zwei Teile genau“ verstanden werden; möglich wäre auch, sie rechnerisch als vierzehn Teile aufzufassen. Die getrennten Zahlen des Textes bleiben hier erhalten.
    reason: textual_variant
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: an jenem Tag
  rationale: Bewahrt den demonstrativen Charakter der geläufigen Zeitangabe und den wiederkehrenden Berichtsstil des astronomischen Abschnitts.
- source_word: ትነሡኅ ሌሊት
  choice: nimmt die Nacht ab
  rationale: Das Verb bezeichnet eine Verminderung. Diese Wiedergabe folgt dem ge'ezischen Wortlaut statt der widersprüchlichen englischen Fassung „increases“.
- source_word: ፵ዕበታ ለማዓልት
  choice: neun Teile des Tages
  rationale: Die überlieferte beziehungsweise transkribierte Zahlenform ist problematisch. „Teile“ erhält die schematische Maßeinheit des astronomischen Buches; die im konsultierten Text angenommene Neun wird beibehalten und die Unsicherheit in der Fußnote offengelegt.
- source_word: ፲ወ፪ተ ወ፪እቲ
  choice: zwölf Teile und zwei Teile
  rationale: Die getrennt erscheinenden Zahlen werden nicht stillschweigend zu vierzehn zusammengezogen.
- source_word: ጥንቀ
  choice: genau
  rationale: Das Wort bezeichnet hier Genauigkeit oder Präzision und fungiert adverbial; „genau“ ist natürlicher und lexikalisch treffender als „von einer Einteilung“.
- source_word: ማዓልት ስድስተ ክፍለ
  choice: der Tag aber sechs Teile
  rationale: Die knappe, elliptische Zahlenangabe wird bewahrt; „aber“ macht im Deutschen den Wechsel von Nacht zu Tag lesbar, ohne das fehlende Verb inhaltlich auszubauen.
theological_decisions:
- issue: Soll die schwierige astronomische Zahlenfolge rechnerisch harmonisiert werden?
  choice: Die überlieferte Folge wird mit nur geringer sprachlicher Glättung beibehalten.
  alternative: Die Angaben nach dem vermuteten astronomischen Schema berichtigen oder zu einer rechnerisch stimmigen Aussage zusammenziehen.
  rationale: Die Stelle ist textlich und rechnerisch gespannt. Eine stille Harmonisierung würde eine unsichere Rekonstruktion als eindeutigen Wortlaut ausgeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die technische Rede von „Teilen“ bleibt erhalten. Die unbeholfene Zahlenfolge wird bewusst nicht geglättet; nur die elliptische Schlussklausel wird durch „aber“ lesbarer gemacht.
