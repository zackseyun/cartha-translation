base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/024.yaml
  text: And on that day the night becomes eleven parts[b][a], and the day seven parts.
translation:
  language: de
  text: Und an jenem Tag wird die Nacht elf Teile[a] lang und der Tag sieben Teile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nacht und Tag werden hier nach nummerierten „Teilen“ bemessen. Das gehört zum schematischen Kalender des Astronomischen Buches; gemeint sind nicht gewöhnliche Uhrstunden.
    reason: cultural_note
lexical_decisions:
- source_word: ወበይእቲ፡ ዕለት
  choice: Und an jenem Tag
  rationale: Die zeitliche Formel bezeichnet einen bestimmten Punkt im Zyklus; „an jenem Tag“ ist idiomatisch und bewahrt die demonstrative Bedeutung.
- source_word: ትከውን
  choice: wird … lang
  rationale: Der Imperfekt von ኮነ beschreibt hier im wiederkehrenden astronomischen Schema das erreichte beziehungsweise entstehende Längenverhältnis. Die deutsche Wendung gibt den dynamischen Sinn natürlich wieder.
- source_word: ሌሊት
  choice: die Nacht
  rationale: Der bestimmte Artikel passt zum Gegensatz zwischen den beiden gemessenen Zeitabschnitten Nacht und Tag.
- source_word: ዓሠርተ፡ ወአሐደ፡ ክፍለ
  choice: elf Teile
  rationale: Die wörtliche Zahlenfolge „zehn und eins“ wird idiomatisch als „elf“ wiedergegeben; „Teile“ bewahrt die schematische Einteilung des Astronomischen Buches.
- source_word: ወዕለት፡ ሰብዓተ፡ ክፍለ
  choice: und der Tag sieben Teile
  rationale: Die parallele Struktur und die einheitliche technische Bezeichnung der Zeitanteile bleiben erhalten; „lang“ ist aus dem ersten Satzglied mitzudenken.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Parallelstruktur des Ge’ez bleibt erhalten; „wird … lang“ macht den im Kontext wichtigen Verlauf der wechselnden Tages- und Nachtlängen verständlich, ohne das technische Maßsystem umzudeuten.
