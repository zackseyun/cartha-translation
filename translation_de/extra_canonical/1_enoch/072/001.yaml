base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/001.yaml
  text: The book of the courses of the luminaries of heaven[a], how they are, each according to their companies, and according to their dominion and their seasons, according to their names and their origins, and according to their paths, which Uriel, the holy angel who was with me, showed me—he who is their guide—and the whole record of them, as he showed me, and how it is with regard to every year of the world and forever[h][g][f][e][d][c][b], until a new work is accomplished which will endure forever.
translation:
  language: de
  text: 'Das Buch über die Bahnen der Himmelslichter: wie sie sich bewegen, jedes nach seiner Schar[a], gemäß ihrer Herrschaft und ihren Zeiten, gemäß ihren Namen und ihren Ursprüngen[b] und gemäß ihren Wegen. Uriel, der heilige Engel, der bei mir war, zeigte mir dies – er ist ihr Leiter – sowie ihre ganze Aufzeichnung[c], so wie er sie mir zeigte, und wie es sich mit jedem Jahr der Welt[d] und bis in Ewigkeit verhält, bis ein neues Werk[e] vollbracht wird, das bis in Ewigkeit bestehen bleibt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „Schar“ übersetzte Wort bedeutet wörtlich „Volk“ oder „Versammlung“ und wird hier bildhaft für Gruppen von Himmelskörpern gebraucht; möglich sind auch „Gruppierung“ oder „Heerschar“.
    reason: lexical_alternative
  - marker: b
    text: „Ursprünge“ gibt ein Wort wieder, das wörtlich „Geburten“ oder „Ursprünge“ bedeutet; im astronomischen Zusammenhang können damit auch die Ausgangs- oder Aufgangspunkte gemeint sein.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: „ihr ganzes Buch“. Gemeint ist die vollständige Aufzeichnung über die Himmelslichter.'
    reason: translation_clarity
  - marker: d
    text: „Jedes Jahr der Welt“ bezeichnet hier wohl den vollständigen jährlichen Kreislauf innerhalb der kosmischen Ordnung, die in diesem Teil des Henochbuches beschrieben wird.
    reason: cultural_note
  - marker: e
    text: „Ein neues Werk“ kann auch als „eine neue Schöpfung“ verstanden werden. Die genaue Reichweite der Wendung bleibt offen.
    reason: lexical_alternative
lexical_decisions:
- source_word: መጽሐፈ ሚጠተ ብርሃናት ሰማይ
  choice: Das Buch über die Bahnen der Himmelslichter
  rationale: „Buch“ gibt መጽሐፈ wieder; „Bahnen“ bezeichnet hier die geordneten Bewegungsabläufe der als Himmelslichter verstandenen Gestirne. Die Formulierung wahrt den erhabenen kosmologischen Ton, ohne das anachronistische „Umlaufbahnen“ zu verwenden.
- source_word: ሀለዉ
  choice: sie sich bewegen
  rationale: Das Bewegungsverb wird im astronomischen Zusammenhang natürlich mit „sich bewegen“ wiedergegeben.
- source_word: በበሕዝቢሆሙ
  choice: jedes in seiner Schar
  rationale: Das Grundwort bezeichnet Volk oder Versammlung. „Schar“ erhält die bildhafte Übertragung eines sozialen Kollektivbegriffs auf Gruppen von Himmelskörpern.
- source_word: ሥልጣኖሙ
  choice: ihrer Herrschaft
  rationale: „Herrschaft“ bewahrt den Sinn von Macht, Vollmacht oder zugewiesenem Herrschaftsbereich und den gehobenen Stil.
- source_word: ዘመኖሙ
  choice: ihren Zeiten
  rationale: Das Wort kann Zeiten, Zeitabschnitte oder Jahreszeiten bezeichnen. „Zeiten“ lässt die calendrische Bedeutung offen und vermeidet eine unnötige Verengung.
- source_word: ሙላዳቲሆሙ
  choice: ihren Ursprüngen
  rationale: Der Grundsinn ist „Geburten/Ursprünge“; astronomisch können auch Ausgangs- oder Aufgangspunkte gemeint sein. „Ursprünge“ wahrt diese Mehrdeutigkeit.
- source_word: አውራኂሆሙ
  choice: ihren Wegen
  rationale: „Wege“ entspricht dem gewöhnlichen Sinn und eignet sich für die Bewegungswege der Himmelslichter, ohne moderne Astronomie einzutragen.
- source_word: መራኂሆሙ
  choice: ihr Führer
  rationale: Bezeichnet denjenigen, der führt oder leitet. „Führer“ ist im unmittelbaren Satz eindeutig personenbezogen und entspricht dem gehobenen Erzählton.
- source_word: ኵሎ መጽሐፎሙ
  choice: ihre gesamte Aufzeichnung
  rationale: Das Substantiv steht im Singular und bedeutet wörtlich etwa „ihr ganzes Buch“. „Ihre gesamte Aufzeichnung“ ist im Deutschen natürlicher und bezeichnet den vollständigen Bericht über die Himmelslichter.
theological_decisions:
- issue: Bedeutung von ግብር ኃዲስ
  choice: ein neues Werk
  alternative: eine neue Schöpfung
  rationale: Die wörtliche Wiedergabe „neues Werk“ lässt offen, ob eine neue Schöpfung oder eine bleibende Neuordnung gemeint ist, und trägt keine spätere theologische Festlegung in den Text ein.
- issue: Zeitliche Aussage ወእስከ ለዓለም
  choice: und bis in Ewigkeit
  alternative: für immer
  rationale: Die koordinierte Form wird bewahrt, obwohl die genaue syntaktische Anbindung im langen Satz nicht völlig eindeutig ist. So wird die eschatologische Spannung nicht geglättet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher astronomisch-kosmologischer Sprache. Der lange Ausgangssatz wurde behutsam gegliedert. Bildhafte und eschatologische Mehrdeutigkeiten bleiben erhalten; moderne Fachbegriffe wie „Orbit“ wurden vermieden.
