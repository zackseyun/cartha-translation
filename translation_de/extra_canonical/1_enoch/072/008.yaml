base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/008.yaml
  text: And when the sun rises from the sky[a], it goes out through that fourth gate for thirty mornings[c][b], and through the fourth gate in the west of the sky it goes down exactly.
translation:
  language: de
  text: Wenn die Sonne am Himmel aufgeht, tritt sie durch jenes vierte Tor dreißig Morgen lang[a] heraus; und durch das vierte Tor im Westen des Himmels steigt sie in gerader Linie hinab[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „dreißig Morgen“; gemeint sein können auch „dreißig Tage“, da „Morgen“ in dieser astronomischen Abfolge als Zeiteinheit dient.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „genau ausgerichtet“. Das Wort bezeichnet hier wahrscheinlich eine gerade beziehungsweise präzise Bahn, nicht zeitliche Unmittelbarkeit.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይሠርቅ
  choice: aufgeht
  rationale: Mit der Sonne als Subjekt bezeichnet das Verb in diesem astronomischen Zusammenhang ihr Aufgehen.
- source_word: ይወፅእ
  choice: tritt … heraus
  rationale: Die konkrete Bewegung aus einem Tor wird bewahrt; die deutsche Wendung ist zugleich natürlich und anschaulich.
- source_word: ኆኅት
  choice: Tor
  rationale: Das wiederkehrende Bild geordneter himmlischer Öffnungen wird wörtlich beibehalten.
- source_word: ራብዕት
  choice: vierte
  rationale: Die Ordnungszahl wird entsprechend der Abfolge der Sonnentore wörtlich wiedergegeben.
- source_word: ሠላሳ ጽባሐ
  choice: dreißig Morgen lang
  rationale: Der geezische Ausdruck nennt ausdrücklich dreißig Morgen; „lang“ macht im Deutschen die Zeitdauer deutlich, ohne sie zu „Tagen“ zu verallgemeinern.
- source_word: ምዕራበ ሰማይ
  choice: im Westen des Himmels
  rationale: Die räumliche kosmologische Vorstellung bleibt in natürlichem, würdigem Deutsch erhalten.
- source_word: ርቱዐ
  choice: in gerader Linie
  rationale: Die Formulierung gibt die räumliche Geradheit beziehungsweise genaue Ausrichtung wieder und vermeidet eine fälschlich zeitliche Bedeutung wie „sogleich“.
- source_word: ይወርድ
  choice: steigt … hinab
  rationale: Die ausdrückliche Abwärtsbewegung wird bewahrt, statt das Verb lediglich idiomatisch mit „geht unter“ wiederzugeben.
theological_decisions:
- issue: Kosmologische Torvorstellung
  choice: Die himmlischen Tore und die Bewegungsverben werden als konkrete Bildsprache beibehalten.
  alternative: Die Aussage als gewöhnliche Beschreibung von Sonnenaufgang und Sonnenuntergang ohne kosmische Architektur wiedergeben.
  rationale: Der astronomische Teil des Henochbuches entfaltet eine strukturierte visionäre Kosmologie; eine Verflachung zur bloßen Alltagssprache würde ein wesentliches Textelement beseitigen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die ungewöhnliche kosmologische Bildwelt und die konkrete Bewegungsrichtung bleiben erhalten; erläuterungsbedürftige lexikalische Spielräume stehen in Fußnoten.
