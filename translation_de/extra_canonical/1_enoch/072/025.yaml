revisions:
- from: Und an jenem Tag tritt die Sonne aus jenem zweiten Tor hervor und geht im Westen am zweiten Tor unter. Dann kehrt sie im Osten zum ersten Tor zurück, und zwar für einunddreißig Morgen[a], und geht am ersten Tor im Westen des Himmels unter.[b]
  to: Und an jenem Tag tritt die Sonne aus jenem zweiten Tor hervor und geht im Westen am zweiten Tor unter. Dann kehrt sie im Osten einunddreißig Morgen lang durch das erste Tor ein und geht am ersten Tor im Westen des Himmels unter.[a][b]
  rationale: Die Präposition bei dem ersten Tor wird nicht mehr als bloße Zielrichtung (»zum«) wiedergegeben. »Durch das erste Tor einkehren« ist im Deutschen natürlich und bildet die Torvorstellung sowie das Verb des Eintretens genauer ab. Die Fußnote wurde entsprechend von »Rückkehr« auf »Eintreten« präzisiert.
