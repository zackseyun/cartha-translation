base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/025.yaml
  text: And on that day the sun comes out from that second gate[a], and sets in the west at the second gate, and returns to the east at the first gate for thirty-one mornings[d][c][b], and sets at the first gate in the west of heaven.
translation:
  language: de
  text: Und an jenem Tag tritt die Sonne aus jenem zweiten Tor hervor und geht im Westen am zweiten Tor unter. Dann kehrt sie im Osten einunddreißig Morgen lang durch das erste Tor ein und geht am ersten Tor im Westen des Himmels unter.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „einunddreißig Morgen“; im kalendarischen System der Gestirne dient dies als Zählung von Tagen.
    reason: cultural_note
  - marker: b
    text: Der Wortlaut wiederholt die Abfolge des Untergangs und des Eintretens durch bestimmte Himmelstore. Dies entspricht wahrscheinlich der schrittweisen Bewegung der Sonne im System der himmlischen Tore.
    reason: textual_note
lexical_decisions:
- source_word: ይወፅእ
  choice: tritt … hervor
  rationale: Gibt das konkrete Hervortreten der Sonne aus einem himmlischen Tor natürlich und würdig wieder.
- source_word: ኆኅት
  choice: Tor
  rationale: Bewahrt das kosmologische Bild fester Öffnungen des Himmels, durch welche die Gestirne ziehen.
- source_word: ያዓርብ
  choice: geht … unter
  rationale: Im Zusammenhang mit Sonne und Westen bezeichnet das Verb idiomatisch den Sonnenuntergang.
- source_word: ይገብእ
  choice: kehrt … zurück
  rationale: Im zyklischen Ablauf ist die Rückkehr der Sonne in den Osten gemeint; die Bewegungsrichtung wird durch den Kontext verdeutlicht.
- source_word: በአሐቲ ኆኅት
  choice: zum/am ersten Tor
  rationale: Im fortlaufenden System der nummerierten Himmelstore ist አሐቲ hier sinnvoll ordinal als „erstes“ zu verstehen; die wechselnde deutsche Präposition entspricht der Bewegungs- beziehungsweise Ortsangabe.
- source_word: ሠላሳ ወ፩ ጸባሐ
  choice: für einunddreißig Morgen
  rationale: Bewahrt die wörtliche Zeitangabe „Morgen“, die in diesem kalendarischen Zusammenhang als Tageszählung dient.
- source_word: ምዕራበ ሰማይ
  choice: im Westen des Himmels
  rationale: Erhält die kosmologische Vorstellung des Textes und klingt im Deutschen natürlicher als „der Westen des Himmels“.
