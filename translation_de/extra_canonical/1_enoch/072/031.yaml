base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/031.yaml
  text: And on that day the sun goes out from that gate and sets in the west[a], and returns to the east and rises through the third gate for thirty-one mornings[b], and sets in the west of heaven.
translation:
  language: de
  text: Und an jenem Tag tritt die Sonne aus jenem Tor hervor und geht im Westen unter. Dann kehrt sie nach Osten zurück[a] und geht einunddreißig Morgen lang[b] durch das dritte Tor auf; und sie geht im Westen des Himmels unter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit „kehrt … zurück“ wiedergegebene ge’ezische Verb kann auch „tritt ein“ bedeuten. Im Zusammenhang bezeichnet es wahrscheinlich die zyklische Bewegung der Sonne zurück nach Osten, wo sie wieder aufgeht.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „einunddreißig Morgen“. Der Zeitraum wird nach den aufeinanderfolgenden Morgen gezählt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወፅእ
  choice: tritt … hervor
  rationale: Gibt das konkrete Hervortreten der Sonne aus einem himmlischen Tor natürlich und bildhaft wieder.
- source_word: ኆኅት
  choice: Tor
  rationale: Bewahrt die architektonisch-kosmische Bildwelt des astronomischen Buches.
- source_word: የዓርብ
  choice: geht … unter
  rationale: Im Zusammenhang mit dem täglichen Sonnenlauf ist dies die natürliche astronomische Bedeutung.
- source_word: ይገብእ
  choice: kehrt … zurück
  rationale: Das Verb kann auch „hineingehen/eintreten“ bedeuten; im Ablauf bezeichnet es plausibel die zyklische Rückkehr nach Osten.
- source_word: በምስራቅ
  choice: nach Osten
  rationale: Die Präposition wird hier mit dem Richtungsbegriff als Bewegung zum Osten verstanden.
- source_word: ይሠርቅ
  choice: geht … auf
  rationale: Entspricht im Kontext eines Gestirns idiomatisch dem Sonnenaufgang.
- source_word: በሣልስት ኆኅት
  choice: durch das dritte Tor
  rationale: Bringt den Durchgang durch die festgelegte himmlische Öffnung zum Ausdruck.
- source_word: ሠላሳ ወአሐደ ጸባሐ
  choice: einunddreißig Morgen lang
  rationale: Bewahrt die wörtliche Zählung nach aufeinanderfolgenden Morgen und klingt zugleich natürlich.
- source_word: ምዕራብ ሰማይ
  choice: im Westen des Himmels
  rationale: Erhält die konkrete kosmologische Raumangabe, ohne sie modernisierend zu „Horizont“ abzuflachen.
theological_decisions:
- issue: Kosmische Architektur des Himmels
  choice: „Tor“ und „Westen des Himmels“ als wörtliche visionär-astronomische Bilder beibehalten
  alternative: Idiomatisierend „Horizont“ oder „westlicher Himmel“ schreiben
  rationale: Der Text schildert einen gegliederten Kosmos mit himmlischen Toren; diese Spannung zur modernen Kosmologie soll nicht stillschweigend beseitigt werden.
- issue: Deutung von ይገብእ im Sonnenlauf
  choice: „kehrt … zurück“ im Haupttext, mit Hinweis auf „tritt ein“ in der Fußnote
  alternative: „tritt im Osten ein“
  rationale: Der zyklische Zusammenhang legt eine Rückkehr nach Osten nahe, doch die lexikalische Mehrdeutigkeit bleibt ausdrücklich sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Bewegungsverben und die kosmische Torbildsprache bleiben erhalten; die Satzgliederung wurde für gute Verständlichkeit leicht geglättet.
