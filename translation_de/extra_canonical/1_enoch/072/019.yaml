base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/019.yaml
  text: And the sun comes out from that fifth gate[a], and sets in the fifth gate in the west, and rises in the fourth gate according to its signs for thirty-one mornings[d][c][b], and sets in the west.
translation:
  language: de
  text: Und die Sonne tritt aus jenem fünften Tor hervor und geht im fünften Tor im Westen unter; sie geht gemäß ihren Zeichen einunddreißig Morgen lang im vierten Tor auf und geht im Westen unter.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „gemäß ihren Zeichen“ ist schwer zu bestimmen. Gemeint sein können die erkennbaren Kennzeichen oder die festgesetzten Ordnungszeichen des Sonnenlaufs.
    reason: lexical_alternative
  - marker: b
    text: 'Der äthiopische Text sagt am Schluss knapp: „und geht im Westen unter“. Manche Übersetzungen ergänzen „in jenem Tor“, doch „Tor“ wird hier nicht ausdrücklich wiederholt.'
    reason: alternative_reading
lexical_decisions:
- source_word: ይወፅእ
  choice: tritt … hervor
  rationale: Gibt das konkrete Hervorgehen der Sonne würdevoll und im astronomisch-visionären Zusammenhang natürlich wieder.
- source_word: ኆኅት
  choice: Tor
  rationale: Bewahrt die kosmische Bildwelt des astronomischen Buches, in der die Himmelskörper durch Tore ziehen.
- source_word: የዓርብ / ያዓርብ
  choice: geht … unter
  rationale: Im Zusammenhang mit dem Sonnenlauf ist der Sonnenuntergang gemeint; die deutsche Wendung ist idiomatisch und genau.
- source_word: ምዕራብ
  choice: Westen
  rationale: Bezeichnet die westliche Richtung beziehungsweise Region und lässt sich im Deutschen natürlich mit „im Westen“ wiedergeben.
- source_word: ይሠርቅ
  choice: geht … auf
  rationale: Bezeichnet hier das Aufgehen der Sonne.
- source_word: በራብዕት ኆኅት
  choice: im vierten Tor
  rationale: Die gleiche Konstruktion mit በ wird zuvor beim fünften Tor verwendet; die parallele Wiedergabe wahrt die formelhafte räumliche Ausdrucksweise.
- source_word: በእንተ ትእምርታቲሃ
  choice: gemäß ihren Zeichen
  rationale: „Gemäß“ drückt hier Zuordnung beziehungsweise Regelhaftigkeit aus, ohne die schwierige Wendung kausal oder final zu verengen; „Zeichen“ bewahrt den technischen und apokalyptischen Klang.
- source_word: ሠላሳ ወአሐዱ ጽባሕ
  choice: dreißig und einen Morgen lang
  rationale: Der Ausgangstext nennt ausdrücklich Morgen; die Zeitangabe wird im Deutschen klar auf das Aufgehen bezogen.
theological_decisions:
- issue: Kosmische Architektur der himmlischen Tore
  choice: Die wörtliche Bildsprache „Tor“ wird beibehalten.
  alternative: Öffnung oder Fenster
  rationale: So bleibt die visionäre Kosmologie des Werkes erhalten und wird nicht in moderne astronomische Prosa umgedeutet.
- issue: Bedeutung der Zeichen der Sonne
  choice: „gemäß ihren Zeichen“
  alternative: „wegen ihrer Zeichen“ oder „für ihre Zeichen“
  rationale: Die Formulierung bewahrt die Spannung zwischen beobachtbaren Kennzeichen und festgesetzten Ordnungszeichen, ohne eine bestimmte theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung der Tore und Himmelsrichtungen bleibt wegen des formelhaften Stils erhalten; die lange Ausgangsperiode wird zur besseren Verständlichkeit in zwei Sätze gegliedert.
