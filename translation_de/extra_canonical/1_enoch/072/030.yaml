review_pass:
  verdict: revise
  source_fidelity: Die Hauptlesart „zehn Teile“ weicht von der vorgelegten geʿezischen Quelle ab, die ፲ወ፪ተ („zwölf“) bietet. Die zahlenmäßige Spannung zum astronomischen 18-Teile-Schema rechtfertigt ohne ausdrückliche textkritische Grundlage keine stillschweigende Änderung im Haupttext. Die Verkürzung der Nacht ist zutreffend wiedergegeben.
  naturalness: „Gegenüber ihrer bisherigen Länge“ ist verständlich, doch „bisherigen“ ergänzt eine im Ausgangstext nicht ausdrücklich vorhandene Vergleichsgröße. „wird die Nacht in ihrer Dauer verkürzt“ ist idiomatisches modernes Standarddeutsch und bleibt näher am Sinn.
  terminology: „Teile“ ist für ክፍለ angemessen. Die astronomisch-schematische Erläuterung ist sachlich; sie sollte direkt bei „Teile“ verankert werden. Die abweichende, konjekturale Zahl „zehn“ kann als mögliche textkritische Erklärung in einer Fußnote erwähnt werden, darf aber nicht als übersetzter Wortlaut erscheinen.
  issues:
  - severity: high
    issue: Die Zahl im Haupttext wurde von „zwölf“ zu „zehn“ geändert.
    rationale: Die bereitgestellte geʿezische Textform lautet ፲ወ፪ተ, also „zwölf“. Der englische Audit-Trail dokumentiert eine kontextgestützte Korrektur, aber keine gesicherte alternative Handschriftenlesart. Bei dieser strittigen Stelle muss die Quelllesart im Text stehen und die rechnerische Schwierigkeit als Anmerkung kenntlich gemacht werden.
  - severity: low
    issue: „bisherigen“ fügt eine nicht ausdrücklich belegte zeitliche Nuance hinzu.
    rationale: Der Ausgangstext spricht von einer Verkürzung der Nacht hinsichtlich ihrer Länge/Dauer, nicht ausdrücklich von ihrer bisherigen Länge.
  revised_text: An jenem Tag wird die Nacht in ihrer Dauer verkürzt; die Nacht beträgt zwölf Teile[a] und der Tag acht Teile.[b]
  revised_footnotes:
  - marker: a
    text: Tag und Nacht werden hier schematisch in nummerierte „Teile“ gegliedert. Damit wird der jahreszeitliche Wandel beschrieben, nicht eine Einteilung in heutige Uhrstunden.
    reason: cultural_note
  - marker: b
    text: Die vorliegende äthiopische Textform lautet „zwölf Teile“. Da zwölf und acht zusammen nicht dem im Astronomischen Buch sonst vorausgesetzten Schema von achtzehn Teilen entsprechen, wird mitunter „zehn Teile“ als textkritische Korrektur erwogen.
    reason: textual_variant
  revision_rationale: Die Revision stellt die in der vorgelegten geʿezischen Quelle bezeugte Zahl „zwölf“ wieder her. Die innere numerische Spannung wird transparent, aber ohne dogmatische Entscheidung für eine Konjektur in der Fußnote benannt. Zugleich wird die erste Aussage idiomatischer und quellentreuer formuliert und die Sachanmerkung an den Begriff „Teile“ gesetzt.
