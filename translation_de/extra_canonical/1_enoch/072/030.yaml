base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/030.yaml
  text: And on that day the night is shortened from its length[a], and the night becomes ten parts[b], and the day eight parts.
translation:
  language: de
  text: An jenem Tag verkürzt sich die Nacht gegenüber ihrer bisherigen Länge[a]; die Nacht umfasst zehn Teile[b] und der Tag acht Teile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Tag und Nacht werden hier schematisch in nummerierte „Teile“ gegliedert. Damit wird der jahreszeitliche Wandel beschrieben, nicht eine Einteilung in heutige Uhrstunden.
    reason: cultural_note
  - marker: b
    text: 'Die vorliegende äthiopische Transkription liest wörtlich „zwölf Teile“. Der Zusammenhang der Zahlenreihe spricht jedoch für „zehn Teile“: Zusammen mit den acht Teilen des Tages ergeben sich so die im Astronomischen Buch vorausgesetzten achtzehn Teile.'
    reason: textual_variant
lexical_decisions:
- source_word: በይእቲ፡ ዕለት
  choice: An jenem Tag
  rationale: Die zeitliche Demonstrativformulierung wird im modernen Standarddeutsch natürlich wiedergegeben, ohne ihren rückverweisenden Charakter aufzugeben.
- source_word: ተኃጽጸ፡ ሌሊት፡ እምኑኃ
  choice: verkürzt sich die Nacht gegenüber ihrer bisherigen Länge
  rationale: Das Verb bezeichnet eine Verringerung oder Verkürzung; „Länge“ bezieht sich hier auf die Dauer der Nacht. „Bisherigen“ verdeutlicht idiomatisch den Ausgangswert, ohne eine zusätzliche Zeitangabe einzuführen.
- source_word: ትከውን፡ ሌሊት፡ ፲ወ፪ተ፡ ክፍለ
  choice: die Nacht umfasst zehn Teile
  rationale: „Umfasst“ gibt den resultierenden Umfang innerhalb des schematischen Teilungssystems natürlich wieder. Die überlieferte bzw. transkribierte Zahlform lautet zwar „zwölf“, doch „zehn“ entspricht der fortlaufenden astronomischen Zahlenreihe und ergibt zusammen mit den acht Teilen des Tages die sonst vorausgesetzten achtzehn Teile; die textkritische Spannung wird in Fußnote [b] offengelegt.
- source_word: ማዓልት፡ ፰ክፍለ
  choice: der Tag acht Teile
  rationale: Die knappe Ellipse bewahrt den parallelen, aufzählenden Stil des Ausgangstextes; „umfasst“ ist aus dem ersten Satzglied mitzudenken.
