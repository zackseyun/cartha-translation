base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/016.yaml
  text: And when thirty mornings are completed[a], the day decreases by exactly one part, and the day becomes eleven parts[c][b], and the night seven.
translation:
  language: de
  text: Und wenn dreißig Morgen vollendet sind[a], nimmt der Tag um genau einen Teil ab, und der Tag umfasst dann elf Teile[c][b], die Nacht aber sieben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »dreißig Morgen«. In diesem Abschnitt dient der Ausdruck als gezählter Zeitraum im Sonnenkalender.
    reason: lexical_alternative
  - marker: b
    text: Das Kapitel misst Tag und Nacht wiederholt in nummerierten »Teilen«. Hier ist das Tageslicht auf elf Teile zurückgegangen, während die Nacht sieben Teile umfasst.
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: »Der Tag nimmt um einen Teil ab und wird zu elf Teilen, die Nacht aber zu sieben.«'
    reason: previous_rendering
lexical_decisions:
- source_word: ተፈጸመ
  choice: vollendet sind
  rationale: Das Verb bezeichnet den Abschluss eines gezählten Zeitraums; »vollendet sind« bewahrt den formalen Sinn und passt zur kalendarischen Darstellung.
- source_word: ሠላሳ ጽባሕ
  choice: dreißig Morgen
  rationale: Der ge’ezische Text nennt ausdrücklich »Morgen«. Die konkrete Zählweise bleibt erhalten, statt sie im Haupttext zu »Tagen« zu verallgemeinern.
- source_word: ተሐፅፅ ማዓልት
  choice: nimmt der Tag … ab
  rationale: Die Wendung beschreibt die quantitative Verkürzung des Tageslichts. »nimmt … ab« ist natürliches Deutsch und bewahrt den schematischen Charakter.
- source_word: ክፍለ አሐደ ጥንቁቀ
  choice: um genau einen Teil
  rationale: »Teil« entspricht der wiederkehrenden Maßeinheit des Kapitels; »genau« gibt das für die präzise kalendarische Messung wichtige Adverb ጥንቁቀ wieder.
- source_word: ወትከውን ዕለት ዓሠርተ ወአሐደ ክፍለ
  choice: und der Tag umfasst dann elf Teile
  rationale: ዕለት wird als Subjekt der resultierenden Zustandsangabe verstanden. »umfasst dann« gibt den Übergang idiomatisch wieder, ohne die gezählten Teile als Zeitstunden umzudeuten.
- source_word: ወሌሊት ስብዓተ
  choice: die Nacht aber sieben
  rationale: »Teile« ist aus dem parallelen ersten Satzglied zu ergänzen. »aber« macht den kontrastierenden Parallelismus im Deutschen klar.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener astronomisch-kalendarischer Zählsprache. »Morgen« und »Teile« erhalten die konkrete Terminologie der Vorlage; die elliptische Angabe zur Nacht bleibt in gut verständlicher Form bestehen.
