base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/009.yaml
  text: And in those days the day grows longer from day to day[a], and the night grows shorter from night to night[c][b], until thirty mornings.
translation:
  language: de
  text: Und in jenen Tagen wird der Tag von Tag zu Tag länger[a] und die Nacht von Nacht zu Nacht kürzer, bis zu dreißig Morgen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich wiederholt das Ge’ez „Tag“ und „Nacht“ in einer Vergleichsformel („Tag von Tag“, „Nacht von Nacht“). Gemeint ist, dass jeder folgende Tag länger und jede folgende Nacht kürzer wird.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „bis zu dreißig Morgendämmerungen“. Das Wort bedeutet wörtlich „Morgen“ oder „Morgendämmerung“ und bezeichnet hier wohl einen gezählten Abschnitt im Lauf der Himmelslichter.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: in jenen Tagen
  rationale: Die geläufige gehobene Zeitangabe bewahrt den wiederkehrenden apokalyptischen Erzählton.
- source_word: ትነኍኅ
  choice: wird … länger
  rationale: Das Verb bezeichnet eine Zunahme oder Ausdehnung der Dauer; die deutsche Wendung ist natürlich und passt zur astronomischen Beobachtung.
- source_word: ዕለት እምዕለት
  choice: der Tag von Tag zu Tag
  rationale: Die wiederholte Vergleichsformel wird idiomatisch wiedergegeben und bezeichnet die fortschreitende Verlängerung jedes folgenden Tages.
- source_word: ተኃጽር ሌሊት እምሌሊት
  choice: die Nacht von Nacht zu Nacht kürzer
  rationale: Die parallele Formulierung erhält die spiegelbildliche Verkürzung der aufeinanderfolgenden Nächte.
- source_word: እስከ ሠላሳ ጽባሕ
  choice: bis zu dreißig Morgen
  rationale: ጽባሕ bedeutet konkret „Morgen“ oder „Morgendämmerung“; „Morgen“ bewahrt die zählbare kalendarisch-astronomische Ausdrucksweise.
theological_decisions:
- issue: Ob die wiederholte Vergleichsformel wörtlich oder als fortschreitende Veränderung wiederzugeben ist
  choice: von Tag zu Tag / von Nacht zu Nacht
  alternative: länger als der Tag / kürzer als die Nacht
  rationale: Der astronomische Zusammenhang beschreibt die schrittweise Veränderung der Tages- und Nachtlänge. Die gewählte Formulierung wahrt den Wiederholungscharakter, ohne im Deutschen einen unklaren Vergleich zu erzeugen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die parallele Satzstruktur des Ge’ez bleibt erhalten; die ungewöhnliche Vergleichsformel wird im Haupttext natürlich formuliert und in der Fußnote transparent gemacht.
