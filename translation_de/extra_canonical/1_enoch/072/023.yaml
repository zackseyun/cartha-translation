base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/023.yaml
  text: And the sun comes out from that third gate[a], and sets in the third gate in the west, and returns to the east, and comes out from the second gate in the east for thirty mornings; and in this way it sets in the second gate in the west of heaven.
translation:
  language: de
  text: Und die Sonne tritt aus jenem dritten Tor hervor und geht im dritten Tor im Westen unter. Dann kehrt sie in den Osten zurück und tritt dreißig Morgen lang[a] aus dem zweiten Tor im Osten hervor; ebenso geht sie im zweiten Tor im Westen des Himmels unter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dreißig Morgen“. Gemeint ist wahrscheinlich ein Zeitraum von dreißig Tagen im Lauf der Sonne; im Haupttext bleibt jedoch die Ausdrucksweise der Vorlage erhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወፅእ
  choice: tritt … hervor
  rationale: Das Verb bezeichnet das Herausgehen oder Hervortreten. „Hervortreten“ klingt im Deutschen natürlich und bewahrt zugleich die konkrete Bewegung der Sonne durch die Tore.
- source_word: ፀሐይ
  choice: die Sonne
  rationale: Eindeutige astronomische Bezeichnung; der Text verlangt weder eine Verallgemeinerung noch eine zusätzliche Personifizierung.
- source_word: ሣልስት ኆኅት
  choice: drittes Tor
  rationale: „Tor“ erhält die konkrete kosmologische Bildsprache des astronomischen Buches und die Nummerierung der Himmelsöffnungen.
- source_word: ያዓርብ
  choice: geht … unter
  rationale: Im beschriebenen Lauf der Sonne ist dies die natürliche deutsche Wiedergabe für ihr Untergehen, ohne die räumliche Torvorstellung aufzugeben.
- source_word: በዐረብ
  choice: im Westen
  rationale: Die Wendung ist hier räumlich zu verstehen und entspricht der Gegenüberstellung von Osten und Westen.
- source_word: ይገብእ
  choice: kehrt … zurück
  rationale: Das Verb kann „eintreten“ bedeuten; im Ablauf bezeichnet es die zyklische Rückkehr der Sonne in den Osten.
- source_word: ውስተ ምሥራቅ
  choice: in den Osten
  rationale: Bewahrt die Richtungsangabe in natürlichem modernem Deutsch.
- source_word: ካልእ ኆኅት
  choice: zweites Tor
  rationale: Im nummerierten System der Sonnentore ist „zweites Tor“ sachlich angemessener als das ebenfalls mögliche „anderes Tor“.
- source_word: ሠላሳ ጸባሐ
  choice: dreißig Morgen lang
  rationale: Die wörtliche Zählung nach „Morgen“ bleibt erhalten; „lang“ macht die Zeitdauer im Deutschen deutlich.
- source_word: በምዕረበ ሰማይ
  choice: im Westen des Himmels
  rationale: Diese Formulierung wahrt den gehobenen kosmologischen Ton und die räumliche Struktur der Vorlage.
theological_decisions:
- issue: Kosmologische Bildsprache der Sonnentore
  choice: Die konkreten Tore und die beschriebenen Bewegungsrichtungen bleiben erhalten.
  alternative: Die Tore als bloße Punkte von Sonnenaufgang und Sonnenuntergang am Horizont umschreiben.
  rationale: Der Text entwirft eine gegliederte Himmelskosmologie. Eine Modernisierung zu reinen Horizontpunkten würde diese apokalyptische Bildwelt einebnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Tor-Terminologie und die Himmelsrichtungen werden bewusst konkret beibehalten; die Satzgliederung dient der Lesbarkeit, ohne den Ablauf zu verändern.
