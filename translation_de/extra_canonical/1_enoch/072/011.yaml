base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/011.yaml
  text: And the sun comes out from that fourth gate[a], and sets in the fourth gate, and returns to the fifth gate of the east for thirty mornings[c][b]; then it comes out from it and sets in the fifth gate.
translation:
  language: de
  text: Und die Sonne tritt aus jenem vierten Tor hervor und geht im vierten Tor unter. Dann kehrt sie dreißig Morgen lang zum fünften Tor im Osten zurück[a]. Danach tritt sie aus ihm hervor und geht im fünften Tor unter[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich wird der Zeitraum als „dreißig Morgen“ gezählt. Die Wendung kann auch näher am Satzbau wiedergegeben werden: „Dann kehrt sie zum fünften Tor im Osten zurück – dreißig Morgen lang.“'
    reason: lexical_alternative
  - marker: b
    text: Der Schlusssatz nennt erneut das fünfte Tor. Die knappe Formulierung kann den weiteren Lauf der Sonne nach den dreißig Morgen zusammenfassen, ohne eine zusätzliche Bewegung im Einzelnen zu schildern.
    reason: ambiguity
lexical_decisions:
- source_word: ወይወፅእ
  choice: tritt … hervor
  rationale: Das Verb bezeichnet wörtlich das Herausgehen. Im astronomischen Zusammenhang ist das Hervortreten der Sonne beim Aufgang gemeint, ohne dass das Bewegungsbild zu „geht auf“ eingeebnet wird.
- source_word: ፀሐይ
  choice: die Sonne
  rationale: Die übliche und kontextuell eindeutige Bezeichnung des Gestirns.
- source_word: እምዘክቱ ራብዕ ኆኅት
  choice: aus jenem vierten Tor
  rationale: Das Demonstrativ verweist auf das zuvor genannte Tor; „Tor“ bewahrt die kosmologische Bildsprache des Abschnitts.
- source_word: ወየዓርብ
  choice: geht … unter
  rationale: Im Zusammenhang mit dem täglichen Sonnenlauf bezeichnet das Verb den Sonnenuntergang; die deutsche Wendung ist natürlich und präzise.
- source_word: በራብዕት
  choice: im vierten Tor
  rationale: Das im knappen Ge’ez vorausgesetzte Substantiv wird im Deutschen zur Klarheit wiederholt.
- source_word: ወይገብእ
  choice: kehrt … zurück
  rationale: ገብአ bezeichnet hier die Rückkehr der Sonne nach Osten und ist nicht mit einem bloßen „eintreten“ wiederzugeben.
- source_word: ውስተ ኃምስ ኆኅት እንተ ጽባሕ
  choice: zum fünften Tor im Osten
  rationale: Die Richtungsangabe እንተ ጽባሕ wird ausdrücklich bewahrt; sie kennzeichnet das fünfte Tor als das östliche Tor des erneuten Hervortretens.
- source_word: ሠላሳ ጽባሐ
  choice: dreißig Morgen lang
  rationale: Die charakteristische Zählung nach „Morgen“ wird beibehalten und nicht verallgemeinernd mit „Tage“ wiedergegeben.
- source_word: እምኔሃ
  choice: aus ihm
  rationale: Das feminine Pronomen verweist auf das Tor; im Deutschen richtet sich das Pronomen nach dem grammatischen Geschlecht von „Tor“.
- source_word: ኃምስት ኆኅት
  choice: im fünften Tor
  rationale: Die wiederholte technische Bezeichnung wird konsequent als „Tor“ wiedergegeben.
theological_decisions:
- issue: Umgang mit der kosmologischen Bildsprache
  choice: Die Tore und die Bewegung der Sonne werden als solche wiedergegeben.
  alternative: Modernisierende Umschreibung durch astronomische Begriffe wie „Sektor“, „Position“ oder „Bahnabschnitt“.
  rationale: Der Text beschreibt eine offenbarte apokalyptische Kosmologie. Eine moderne Umdeutung würde sein eigenes Weltbild verdecken.
- issue: Deutung der knappen Schlussfolge
  choice: Die Wiederholung des fünften Tores bleibt stehen, ohne den Ablauf weiter auszudeuten.
  alternative: Die Schlussaussage ausdrücklich als neue, zusätzliche Bewegungsphase erklären.
  rationale: Der Quelltext ist knapp und kann den fortgesetzten Lauf der Sonne nach den dreißig Morgen zusammenfassend beschreiben; die Übersetzung soll diese Offenheit nicht beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Tor-Terminologie und das konkrete Bewegungsbild bleiben erhalten; durch „tritt hervor“, „geht unter“ und „kehrt zurück“ ist der Satz zugleich für heutige Leser verständlich.
