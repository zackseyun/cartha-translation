base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/007.yaml
  text: And in that fourth gate[a], from which the sun comes out in the first month, there are twelve open windows[c][b], from which a flame comes out when they are opened at their appointed times.
translation:
  language: de
  text: Und in jenem vierten Tor, aus dem die Sonne im ersten Monat herauskommt, befinden sich zwölf offene Fenster[a], aus denen eine Flamme hervortritt, wenn sie zu den für sie bestimmten Zeiten geöffnet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hier zugrunde liegende OCR-Transkription weist an dieser Stelle offenbar eine Fehlform auf; der Zusammenhang ergibt „zwölf offene Fenster“.
    reason: textual_variant
lexical_decisions:
- source_word: ኆኅት ራብዕት
  choice: viertes Tor
  rationale: Bewahrt das wiederkehrende architektonisch-kosmologische Bild des Henochbuches; „Tor“ ist im Deutschen natürlicher und konkreter als „Portal“ oder „Öffnung“.
- source_word: ይወፅእ ፀሐይ
  choice: die Sonne herauskommt
  rationale: Gibt die konkrete Bewegung durch das Tor natürlich wieder; „hervorgeht“ wäre ebenfalls möglich, wirkt aber gehobener.
- source_word: በወርኅ ቀዳማዊ
  choice: im ersten Monat
  rationale: Direkte und idiomatische Wiedergabe der Zeitangabe.
- source_word: ባቲ ፲፪ መስኮተ መላክወ ርኅዋተ
  choice: befinden sich zwölf offene Fenster
  rationale: Die überlieferte Form መላክወ ist hier sehr wahrscheinlich ein OCR-Fehler für መሳክወ; zusammen mit ርኅዋተ ergibt sich „offene Fenster“. So wird die jüngste textkritische Korrektur berücksichtigt, ohne eine unbelegte Wind- oder Engelvorstellung einzutragen.
- source_word: ዘእምኔሆን
  choice: aus denen
  rationale: Das Relativum nimmt die zwölf Fenster auf und bezeichnet den Ausgangspunkt der Flamme.
- source_word: ላህብ
  choice: eine Flamme
  rationale: Bewahrt das anschauliche Bild von Feuer, das aus den kosmischen Fenstern hervortritt.
- source_word: ሶበ ይትረሐዉ
  choice: wenn sie … geöffnet werden
  rationale: Die passive Bedeutung passt zu den Fenstern und erhält die mechanisch-kosmologische Bildsprache.
- source_word: እምዘመነ ዚአሆሙ
  choice: zu den für sie bestimmten Zeiten
  rationale: Bringt die Vorstellung fest zugewiesener Zeiten innerhalb der geordneten Himmelsabläufe zum Ausdruck.
theological_decisions:
- issue: Ob die schwierige OCR-Form als Hinweis auf Windherrschaft oder Windengel zu verstehen ist
  choice: Keine Wind- oder Engeldeutung im Haupttext; Wiedergabe als „offene Fenster“
  alternative: „Fenster der Herrschaft des Windes“ oder „Fenster der Windengel“
  rationale: Die Form መላክወ beruht nach dem textkritischen Befund wahrscheinlich auf einer Verwechslung mit መሳክወ („Fenster“). Eine Wind- oder Engeldeutung würde daher eine theologische Aussage in den Text eintragen, die der rekonstruierte Wortlaut nicht trägt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete kosmologische Bildsprache mit Tor, Fenstern und Flamme bleibt erhalten; unnötig altertümliche Formulierungen werden vermieden.
