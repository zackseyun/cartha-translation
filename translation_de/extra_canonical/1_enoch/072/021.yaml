base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/021.yaml
  text: And the sun comes out from that gate[a], and sets in the west, and returns to the east, and comes out from the third gate for thirty mornings[c][b], and sets in the west at the third gate.
translation:
  language: de
  text: Und die Sonne tritt aus jenem Tor hervor[a] und geht im Westen unter. Dann kehrt sie in den Osten zurück und tritt dreißig Morgen lang[b] aus dem dritten Tor hervor und geht im Westen am dritten Tor unter.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann ኆኅት auch „Tür“ heißen; gemeint ist eines der festen Tore, durch welche die Sonne nach der kosmologischen Darstellung dieses Abschnitts hervortritt.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „dreißig Morgen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይወፅእ
  choice: und … tritt hervor
  rationale: Das Verb bezeichnet das Herausgehen oder Hervortreten. „Tritt hervor“ gibt die konkrete Bewegung der Sonne natürlich und in beiden Vorkommen einheitlich wieder.
- source_word: ፀሐይ
  choice: die Sonne
  rationale: Eindeutige astronomische Bezeichnung ohne zusätzliche Personifizierung.
- source_word: እምይእቲ ኆኅት
  choice: aus jenem Tor
  rationale: Der Ausdruck verweist auf ein zuvor genanntes Tor. ኆኅት bezeichnet hier im kosmologischen Aufbau des Astronomischen Buches ein Tor bzw. eine Türöffnung, nicht das davon unterschiedene Fenster.
- source_word: ያዓርብ በምዕራብ
  choice: geht im Westen unter
  rationale: Im Zusammenhang mit dem Sonnenlauf ist „untergehen“ die natürliche deutsche Wiedergabe.
- source_word: ወይገብእ በጽባሕ
  choice: dann kehrt sie in den Osten zurück
  rationale: Das Verb kann „eintreten“ oder „zurückkehren“ bedeuten. ጽባሕ kann neben „Morgen“ auch den Osten als Ort des Morgens bezeichnen; der räumliche Gegensatz zum Westen stützt hier „in den Osten“.
- source_word: በሣልስት ኆኅት
  choice: aus dem dritten Tor / am dritten Tor
  rationale: 'Die Präposition wird entsprechend der jeweiligen Bewegung wiedergegeben: „aus“ beim Hervortreten und „am“ beim Untergehen.'
- source_word: ሠላሳ ጸባሐ
  choice: dreißig Morgen lang
  rationale: Der Text zählt wörtlich „dreißig Morgen“. Diese anschauliche Zeitangabe bleibt erhalten, statt sie zu „dreißig Tage“ zu glätten.
theological_decisions:
- issue: Kosmologische Bezeichnung ኆኅት im Astronomischen Buch
  choice: Tor
  alternative: Fenster
  rationale: „Tor“ bewahrt die spezifische kosmologische Architektur des Textes und unterscheidet diese Öffnung von dem andernorts eigens bezeichneten Fenster.
- issue: Räumliche oder zeitliche Deutung von በጽባሕ
  choice: in den Osten
  alternative: am Morgen
  rationale: Nach dem Untergang „im Westen“ bildet „in den Osten“ den erwarteten räumlichen Gegenpol und entspricht der Bedeutung von ጽባሕ als Osten, dem Ort des Morgens. Die lexikalische Mehrdeutigkeit wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der wiederholte Bewegungsablauf bleibt konkret; „Tor“ wahrt die besondere apokalyptische Kosmologie. Die Satzteilung verbessert die Verständlichkeit, ohne die Abfolge zu verändern.
