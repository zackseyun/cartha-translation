base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/006.yaml
  text: Thus it comes out in the first month through the great gate[b][a], which is the fourth of those six gates that are toward the sunrise.
translation:
  language: de
  text: So tritt sie im ersten Monat durch das große Tor[a] hervor, das vierte jener sechs Tore, die in Richtung des Sonnenaufgangs liegen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „durch das große Portal“.'
    reason: translation_alternative
  - marker: b
    text: Die Wortgruppe „jener sechs Tore, die in Richtung des Sonnenaufgangs liegen“ steht in der überlieferten Textgrundlage in Klammern. Sie könnte ein erklärender Zusatz oder textlich unsicher sein, stimmt jedoch mit der wiederholten Beschreibung von sechs östlichen Toren in diesem Kapitel überein.
    reason: textual_variant
lexical_decisions:
- source_word: ከመዝ
  choice: So
  rationale: Gibt den einleitenden Ausdruck für Art und Ablauf knapp und natürlich wieder.
- source_word: ይወፅእ
  choice: tritt sie … hervor
  rationale: Bewahrt das konkrete Bild des Hervortretens durch ein Tor; das feminine Pronomen bezieht sich im Deutschen natürlich auf die Sonne.
- source_word: በወርኅ ቀዳማዊ
  choice: im ersten Monat
  rationale: Direkte und idiomatische Wiedergabe der Zeitangabe.
- source_word: በኆኅት ዓቢይ
  choice: durch das große Tor
  rationale: Im Zusammenhang mit dem Hervortreten bezeichnet die Präposition den Durchgang durch die Öffnung; „Tor“ wahrt die wiederkehrende kosmologische Bildsprache.
- source_word: እንተ ይእቲ ራብዕት
  choice: das vierte
  rationale: Identifiziert das Tor innerhalb der nummerierten Reihe; die deutsche Apposition ist klar und knapp.
- source_word: እልኩ ኃዋኅወ ፮
  choice: jener sechs Tore
  rationale: Gibt die partitive Zuordnung zum Satz von sechs Toren wieder und lässt zugleich den hinweisenden Charakter erkennen.
- source_word: እለ መንገለ ምሥራቀ ፀሐይ
  choice: die dem Sonnenaufgang zugewandt sind
  rationale: Gibt ምሥራቀ ፀሐይ sachgerecht als „Sonnenaufgang“ wieder und drückt die räumliche Ausrichtung mit መንገለ natürlich aus.
theological_decisions:
- issue: Kosmologische Darstellung der Sonne, die durch nummerierte Tore hervortritt
  choice: Das konkrete Bild vom Hervortreten durch ein Tor bleibt erhalten.
  alternative: Die Aussage als gewöhnlichen Sonnenaufgang in einem bestimmten Himmelsabschnitt umschreiben.
  rationale: Der astronomische Teil des Henochbuches verwendet bewusst eine konkrete Torvorstellung. Eine Modernisierung würde die eigene Kosmologie des Textes einebnen.
- issue: Partitive oder lose appositionelle Beziehung zwischen dem vierten und den sechs Toren
  choice: „das vierte jener sechs Tore“
  alternative: „das vierte – jene sechs Tore …“
  rationale: Der Kontext einer nummerierten Reihe stützt die partitive Lesart; die textliche Unsicherheit der gesamten Schlusswendung wird jedoch in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete apokalyptisch-kosmologische Bildsprache wird beibehalten; „Sonnenaufgang“ vermeidet die missverständliche Formulierung „Osten der Sonne“.
