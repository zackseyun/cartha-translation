base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/005.yaml
  text: And the chariots by which it ascends are driven by the wind[a], and the sun goes down from the sky and returns through the north in order to reach the east[e][d][c][b]; and it is led so that it may enter the gate and shine on the face of heaven.
translation:
  language: de
  text: Und die Wagen, mit denen sie aufsteigt, werden vom Wind angetrieben[a]. Die Sonne steigt vom Himmel[b] herab und kehrt durch den Norden zurück, um nach Osten zu gelangen; und sie wird so geführt, dass sie durch das Tor[c] eintritt und auf dem Antlitz des Himmels leuchtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die zugrunde liegende Wendung ist schwierig; sie kann wörtlicher auch an einen „Wind des Aufstiegs“ oder einen „aufsteigenden Wind“ denken lassen.
    reason: lexical_alternative
  - marker: b
    text: „Himmel“ kann hier auch den sichtbaren Himmel beziehungsweise das Firmament bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „das Portal“. Gemeint ist eines der himmlischen Tore, die in diesem Abschnitt den Lauf der Sonne gliedern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰረገላት
  choice: Wagen
  rationale: Das Substantiv bezeichnet Wagen oder Streitwagen. „Wagen“ bewahrt das kosmische Fahrzeugbild, ohne im Deutschen unnötig einen militärischen Sinn festzulegen.
- source_word: የዓርግ ነፋስ ይነፍኅ
  choice: werden vom Wind angetrieben
  rationale: Die schwierige Wendung verbindet Aufstieg, Wind und das Blasen des Windes. Die passive Formulierung gibt die windgetriebene Bewegung verständlich wieder; die mögliche wörtlichere Deutung bleibt in der Fußnote erhalten.
- source_word: የዓርብ ፀሐይ እምሰማይ
  choice: Die Sonne steigt vom Himmel herab
  rationale: Das Verb bezeichnet das Hinabsteigen beziehungsweise Untergehen. Die konkrete Bewegungsbeschreibung passt zur kosmologischen Darstellung und bewahrt die Präposition „vom“.
- source_word: ወይገብእ እንተ መስዕ
  choice: kehrt durch den Norden zurück
  rationale: Im beschriebenen Sonnenlauf bezeichnet die Wendung offenbar die Rückkehr über die nördliche Region. „Durch den Norden“ lässt den räumlichen Verlauf erkennen.
- source_word: ከመ ይሑር ምሥራቀ
  choice: um nach Osten zu gelangen
  rationale: Die Zweckkonstruktion und die gerichtete Bewegung nach Osten werden knapp und natürlich wiedergegeben.
- source_word: ወይትመራኅ
  choice: sie wird so geführt
  rationale: Die passive Bedeutung bleibt erhalten und vermittelt, dass der Lauf der Sonne gelenkt beziehungsweise geordnet ist, ohne den Handelnden zu benennen.
- source_word: ኆኅተ
  choice: das Tor
  rationale: Die Form ist Singular und bezeichnet in diesem astronomischen Zusammenhang ein himmlisches Tor beziehungsweise Portal.
- source_word: ያበርህ በገጸ ሰማይ
  choice: auf dem Antlitz des Himmels leuchtet
  rationale: Die bildhafte Wendung „Antlitz des Himmels“ und die lokale Präposition werden möglichst eng bewahrt.
theological_decisions:
- issue: Wiedergabe von ሰማይ im astronomisch-apokalyptischen Zusammenhang
  choice: Himmel
  alternative: Firmament; sichtbarer Himmel
  rationale: „Himmel“ trägt im Deutschen sowohl die sichtbare als auch die kosmisch-religiöse Bedeutung und bewahrt dadurch die im Ausgangstext nicht aufgelöste Spannung.
- issue: Nicht genannter Lenker des Sonnenlaufs
  choice: Passiv „sie wird geführt“ ohne Ergänzung eines Handelnden
  alternative: „Gott führt sie“ oder „ein Engel führt sie“
  rationale: Der Text nennt den Handelnden nicht. Eine ausdrückliche Identifizierung würde eine theologische Festlegung in den Vers eintragen, die dort nicht steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange Bewegungsfolge des Ausgangstextes bleibt erhalten, wird aber durch einen Satzpunkt und ein Semikolon lesbar gegliedert. Bildhafte kosmologische Ausdrücke wie „Antlitz des Himmels“ werden nicht eingeebnet.
