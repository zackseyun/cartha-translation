  terminology: „Teile“ ist für ክፍለ angemessen; die Fußnote erklärt den technischen, schematischen Gebrauch ausreichend. „Astronomisches Buch“ ist als etablierte deutschsprachige Bezeichnung vertretbar. Es sind keine theologischen oder namensbezogenen Anpassungen erforderlich.
