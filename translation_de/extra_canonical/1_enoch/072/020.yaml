- from: An jenem Tag wird der Tag der Nacht gleich [und er wird gleich][a], und die Nacht wird zu neun Teilen[b][c], ebenso auch der Tag zu neun Teilen.
  to: An jenem Tag wird der Tag der Nacht gleich [und der Tag wird gleich][a], und die Nacht wird neun Teile[b][c], ebenso auch der Tag neun Teile.
  rationale: Die Revision beseitigt die im Deutschen missverständliche Wendung „zu neun Teilen“, ohne das im Astronomischen Buch formelhafte „werden“ durch eine bloß statische Messangabe zu ersetzen. Die eingeklammerte, quellenkritisch unsichere Wiederholung bleibt sichtbar erhalten und wird durch die Wiederholung von „der Tag“ eindeutig bezogen. Fußnotenanker und Fußnotensatz bleiben vollständig und korrekt zugeordnet.
