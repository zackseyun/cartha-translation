base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/020.yaml
  text: On that day the day becomes equal with the night[a], [and it becomes even], and the night becomes nine parts[c][b], and the day also nine parts.
translation:
  language: de
  text: An jenem Tag wird der Tag der Nacht gleich [und der Tag wird gleich][a], und die Nacht wird neun Teile[b][c], ebenso auch der Tag neun Teile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „und der Tag wird gleich“ stehen in der zugrunde liegenden Textausgabe in Klammern. Sie könnten ein späterer Zusatz sein oder auf einer unsicheren Lesart beruhen.
    reason: textual_variant
  - marker: b
    text: Die „Teile“ sind schematische Einheiten der kalendarischen Darstellungen im Astronomischen Buch, keine Stunden im heutigen Sinn.
    reason: cultural_note
  - marker: c
    text: 'Oder: „und die Nacht beträgt neun Teile, ebenso auch der Tag neun Teile“.'
    reason: alternative_rendering
lexical_decisions:
- source_word: በይእቲ፡ ዕለት
  choice: An jenem Tag
  rationale: Die temporale Demonstrativfügung wird idiomatisch und zugleich nah am kalendarischen Beobachtungsrahmen wiedergegeben.
- source_word: ይትዓረይ
  choice: wird … gleich
  rationale: Das Verb bezeichnet das Gleichwerden beziehungsweise den Eintritt in ein ausgewogenes Verhältnis; die Formulierung bewahrt den astronomischen Sinn.
- source_word: መዓልት፡ ምስለ፡ ሌሊት
  choice: der Tag der Nacht
  rationale: Im Deutschen verlangt „gleich werden“ den Dativ. So bleibt die Gegenüberstellung von Tag und Nacht erhalten, ohne die Konstruktion unnatürlich nachzubilden.
- source_word: '[ወይከውን፡ ዕሩየ፡]'
  choice: '[und er wird gleich]'
  rationale: Die im Zeugen eingeklammerte, möglicherweise sekundäre oder unsichere Wendung wird sichtbar beibehalten. „gleich“ wahrt die Wiederholung des Gleichheitsgedankens, statt sie deutend auszuschmücken.
- source_word: ተስዓተ፡ ክፍለ
  choice: neun Teile
  rationale: „Teile“ bezeichnet die schematischen kalendarischen Einheiten des Astronomischen Buches und vermeidet die irreführende Gleichsetzung mit modernen Stunden.
- source_word: ወትከውን፡ ሌሊት … ወመዓልትኒ
  choice: und die Nacht wird zu …, ebenso auch der Tag zu …
  rationale: „wird“ bewahrt das im Kapitel formelhaft verwendete Verb des Werdens; „ebenso auch“ gibt die entsprechende Aussage über den Tag wieder.
theological_decisions:
- issue: Astronomische Gleichheit von Tag und Nacht
  choice: Die Aussage wird als kalendarische Beschreibung eines Gleichstands von Tag und Nacht in schematischen Teilen wiedergegeben.
  alternative: Die Gleichheit als Sinnbild kosmischer Harmonie auslegen.
  rationale: Der unmittelbare Zusammenhang des Buches der Himmelslichter ist technisch und kalendarisch. Daher wird die Beobachtungssprache bewahrt und nicht spiritualisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die formelhafte astronomische Ausdrucksweise. Die syntaktisch auffällige Wendung „wird zu neun Teilen“ wurde bewusst beibehalten, um das wiederholte ge’ezische Verb „sein/werden“ nicht durch eine rein statische Messangabe zu ersetzen.
