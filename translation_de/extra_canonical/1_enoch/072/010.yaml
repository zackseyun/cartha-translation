base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/072/010.yaml
  text: On that day the day becomes longer than the night by a ninth part[a], and the day becomes exactly ten parts[c][b], and the night becomes exactly eight parts.
translation:
  language: de
  text: An jenem Tag ist der Tag um ein Neuntel länger als die Nacht[a], und der Tag beträgt genau zehn Teile[b], die Nacht aber genau acht Teile.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Nach dem äthiopischen Text steht nach »ist länger« ein schwieriges, in der Ausgabe eingeklammertes Wort. Der Grundsinn bleibt dennoch deutlich: Der Tag übertrifft die Nacht an Länge; anschließend werden beide mit zehn beziehungsweise acht Teilen angegeben.'
    reason: textual_variant
  - marker: b
    text: Die »Teile« sind die in diesem Kapitel verwendeten Maßeinheiten für das jeweilige Längenverhältnis von Tag und Nacht. Zusammen ergeben sie achtzehn Teile.
    reason: cultural_note
lexical_decisions:
- source_word: በውእቱ፡ ዕለት፡
  choice: An jenem Tag
  rationale: Die zeitliche Formel bezeichnet einen bestimmten Punkt im beschriebenen Sonnenlauf und bewahrt die demonstrative Bedeutung.
- source_word: ትነኍኅ፡ እምሌሊት፡
  choice: wird der Tag … länger als die Nacht
  rationale: Die Verbindung bezeichnet im astronomischen Zusammenhang eine Zunahme beziehungsweise ein Übertreffen der Nacht an Länge.
- source_word: ታስዕተ፡ እደ፡
  choice: um ein Neuntel
  rationale: 'Die Formulierung ist als ein neunter Teil zu verstehen. Das entspricht der Rechnung des Achtzehn-Teile-Systems: zehn Teile Tag gegenüber acht Teilen Nacht ergeben einen Unterschied von zwei Teilen, also einem Neuntel des Ganzen.'
- source_word: ጥንቁቀ፡
  choice: genau
  rationale: Das zweimal gesetzte Wort hebt die exakte Bemessung sowohl des Tages als auch der Nacht hervor.
- source_word: ዓሠርተ፡ ክፍለ፡ / ስመንተ፡ ክፍለ፡
  choice: zehn Teile / acht Teile
  rationale: ክፍል bezeichnet hier die konventionellen Abschnitte, in denen die relative Länge von Tag und Nacht angegeben wird.
- source_word: '[ካዕበተ፡]'
  choice: nicht eigens wiedergegeben
  rationale: Das eingeklammerte und textkritisch schwierige Element ist für den sicheren syntaktischen und rechnerischen Sinn nicht erforderlich; die Unsicherheit wird in der Fußnote kenntlich gemacht.
theological_decisions:
- issue: Charakter der Zahlenangaben
  choice: technische Einteilung der Dauer von Tag und Nacht
  alternative: symbolische apokalyptische Zahlensprache
  rationale: Kapitel 72 beschreibt den Sonnenlauf und die wechselnden Längen von Tag und Nacht in einem geregelten astronomischen Schema. Daher werden die Zahlen als kosmologische Messangaben wiedergegeben, ohne ihnen zusätzliche Symbolik zuzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die technische Aussage bleibt knapp und verständlich; »ein Neuntel« folgt dem sprachlichen und rechnerischen Zusammenhang, während die textkritische Unsicherheit nicht in den Haupttext hineingedeutet, sondern in einer Fußnote offengelegt wird.
