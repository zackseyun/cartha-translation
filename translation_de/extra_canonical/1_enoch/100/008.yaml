base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/008.yaml
  text: 'Woe to you[a], hard of heart, who stay awake to devise evil: fear will come upon you[c][b], and there will be no one to help you.'
translation:
  language: de
  text: '**1 Henoch 100,8**


    Wehe euch, ihr Hartherzigen, die ihr wach bleibt[a][c], um Böses zu ersinnen! Furcht wird euch treffen[b], und niemand wird euch helfen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „wach bleibt“ wiedergegebene Verb kann auch wachsames Lauern oder angespannte Aufmerksamkeit bezeichnen; hier ist diese Wachheit bewusst auf Böses gerichtet.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Furcht wird euch erreichen“ beziehungsweise „einholen“. Das zugrunde liegende Verb kann „finden“, „erreichen“ oder „einholen“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die ihr wacht, um Böses zu ersinnen“.'
    reason: previous_rendering
lexical_decisions:
- source_word: አሌ
  choice: Wehe
  rationale: Die Interjektion eröffnet einen prophetischen Gerichtsruf. „Wehe“ bewahrt den anklagenden apokalyptischen Ton besser als das stärker klagende „Ach“.
- source_word: ግዙፋነ ልብ
  choice: ihr Hartherzigen
  rationale: Die Wendung bezeichnet innere Verstocktheit oder moralische Unempfindlichkeit. „Hartherzige“ ist im modernen Deutschen verständlich und erhält die ethische Aussage.
- source_word: ትተግሁ
  choice: die ihr wach bleibt
  rationale: Das Verb kann Wachsein, Wachsamkeit oder angespannte Aufmerksamkeit ausdrücken. Im Zusammenhang geht es um absichtliche Wachheit, die auf das Planen von Bösem gerichtet ist; „wach bleibt“ vermeidet die missverständliche Vorstellung eines neutralen Wachdienstes.
- source_word: ከመ ትሰብውዎ ለእኩይ
  choice: um Böses zu ersinnen
  rationale: Die Konstruktion bezeichnet einen Zweck. „Böses ersinnen“ gibt den bewussten, planenden Charakter wieder, ohne die Aussage auf bloße Gedanken zu verengen.
- source_word: ፍርሀት
  choice: Furcht
  rationale: Das Substantiv kann Furcht, Angst oder Schrecken bezeichnen. „Furcht“ wahrt die Breite des Ausdrucks und passt zum würdevollen Gerichtsregister.
- source_word: ይረክብክሙ
  choice: wird euch treffen
  rationale: Das Verb hat den Bedeutungsbereich „finden, erreichen, einholen“. „Euch treffen“ klingt im Deutschen natürlich und lässt zugleich offen, ob die Furcht die Angesprochenen erreicht oder überwältigt.
- source_word: ወአልቦ ዘይረድአክሙ
  choice: und niemand wird euch helfen
  rationale: Die Klausel erklärt, dass es für die Angesprochenen keine Hilfe oder Rettung geben wird. Die Formulierung ist klar, gegenwärtig und bewahrt die Endgültigkeit des Gerichtsworts.
theological_decisions:
- issue: Charakter des Weherufs
  choice: Ein prophetischer Weheruf gegen moralisch verhärtete Menschen, die bewusst Böses planen und einem unausweichlichen Gericht entgegengehen
  alternative: Eine allgemeine Klage über Sünder oder eine rein psychologische Warnung vor Angst
  rationale: Der einleitende Weheruf, die direkte Anrede, die gezielte Planung des Bösen und das Fehlen jeglicher Hilfe bilden zusammen eine gerichtliche Ankündigung. Die Übersetzung schwächt diese Spannung nicht zu einer allgemeinen Lebensweisheit ab.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Der knappe Weheruf und die direkte Gerichtsankündigung bleiben erhalten; unnötig altertümliche Formen werden vermieden.
