base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/005.yaml
  text: And he will appoint guardians from among the holy angels over all the righteous and holy ones[a], and they will guard them like the pupil of an eye, until every evil and every sin comes to an end. And even if the righteous sleep a long sleep[c][b], they have nothing to fear.
translation:
  language: de
  text: Und er wird über alle Gerechten und Heiligen Wächter aus den heiligen Engeln einsetzen[a]. Sie werden sie wie die Pupille des Auges behüten[b], bis alles Böse und jede Sünde ein Ende nimmt. Und selbst wenn die Gerechten einen langen Schlaf schlafen[c], brauchen sie nichts zu fürchten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Und er wird Wächter über alle Gerechten und Heiligen einsetzen, und zwar aus den heiligen Engeln.“'
    reason: Die Wortstellung kann im Deutschen unterschiedlich abgebildet werden; in beiden Fassungen stammen die Wächter aus der Gruppe der heiligen Engel.
  - marker: b
    text: „Wie die Pupille des Auges“ bezeichnet etwas, das mit äußerster Sorgfalt geschützt wird; sinngemäß entspricht es der geläufigeren Wendung „wie den eigenen Augapfel“.
    reason: Erläutert das konkrete Schutzbild und nennt die idiomatische deutsche Entsprechung.
  - marker: c
    text: Der „lange Schlaf“ meint wahrscheinlich den Tod oder den Zustand der Toten; der Haupttext bewahrt jedoch das Bild des Schlafes.
    reason: Kennzeichnet die wahrscheinliche Bedeutung, ohne die Euphemie des Ausgangstextes aufzulösen.
lexical_decisions:
- source_word: ዐቀብተ
  choice: Wächter
  rationale: Bezeichnet hier Personen mit einem Schutzauftrag. „Wächter“ bewahrt den Zusammenhang mit dem folgenden Verb „behüten“, ohne zwingend den technischen henochischen Begriff für die gefallenen Wächter aufzurufen.
- source_word: ይሁብ
  choice: wird … einsetzen
  rationale: Wörtlich „wird geben“; zusammen mit Wächtern über Personen bedeutet es idiomatisch „einsetzen“ oder „bestellen“.
- source_word: ጻድቃን ወቅዱሳን
  choice: Gerechten und Heiligen
  rationale: Gibt die beiden substantivisch gebrauchten Gruppenbezeichnungen wieder und unterscheidet die geschützten Menschen klar von den heiligen Engeln.
- source_word: እመላእክት ቅዱሳን
  choice: aus den heiligen Engeln
  rationale: 'Die Präposition bezeichnet Herkunft beziehungsweise Auswahl: Die Wächter werden aus der Gruppe der heiligen Engel genommen.'
- source_word: የዐቅብዎሙ
  choice: sie werden sie … behüten
  rationale: Bewahrt das Schutzmotiv der gleichen Wortwurzel; „behüten“ klingt im Deutschen natürlich und fürsorglich.
- source_word: ከመ ብንተ ዐይን
  choice: wie die Pupille des Auges
  rationale: Gibt das konkrete Bild der besonders sorgfältig geschützten Augenpupille wieder, statt es durch eine vertrautere deutsche Redewendung zu ersetzen.
- source_word: እስከ ይዌድእ ኵሉ እኩየ ወኵሉ ኃጢአተ
  choice: bis alles Böse und jede Sünde ein Ende nimmt
  rationale: Die neutrale Formulierung bewahrt die im Text nicht eindeutig ausgedrückte Verursachung und gibt das vollständige Aufhören von Bösem und Sünde wieder.
- source_word: እመኒ
  choice: selbst wenn
  rationale: 'Kennzeichnet die konzessive Wendung: Auch der folgende Fall hebt die Zusage des Schutzes nicht auf.'
- source_word: ይነውሙ … ንዋመ ነዋኅ
  choice: einen langen Schlaf schlafen
  rationale: Bewahrt die etymologische Wiederholung und die euphemistische Offenheit des Schlafbildes, das wahrscheinlich auf Tod oder Totenruhe verweist.
- source_word: አልቦ ዘይፈረሁ
  choice: brauchen sie nichts zu fürchten
  rationale: Natürliches modernes Deutsch für die Aussage, dass kein Anlass oder Gegenstand der Furcht besteht.
theological_decisions:
- issue: Engelschutz oder bloß allgemeines Bild göttlicher Fürsorge
  choice: Die Wächter werden ausdrücklich als heilige Engel wiedergegeben.
  alternative: Die Engelssprache als allgemeine Metapher für göttlichen Schutz aufzulösen.
  rationale: Der ge’ezische Text nennt heilige Engel ausdrücklich. Die apokalyptische Vorstellungswelt wird daher nicht entmythologisiert.
- issue: Bedeutung des langen Schlafes
  choice: Das Schlafbild bleibt im Haupttext erhalten.
  alternative: Direkt mit „sterben“ oder „im Tod ruhen“ zu übersetzen.
  rationale: Der Ausgangstext spricht von Schlaf. Die wahrscheinliche Beziehung zu Tod oder Totenruhe wird erläutert, aber nicht in den Haupttext eingetragen.
- issue: Subjekt beim Ende des Bösen und der Sünde
  choice: 'Neutrale Formulierung: „bis … ein Ende nimmt“.'
  alternative: „bis er allem Bösen und jeder Sünde ein Ende macht“.
  rationale: Die Überlieferung und Syntax rechtfertigen keine sichere ausdrückliche Identifizierung eines handelnden Subjekts; die neutrale Wendung erhält diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung vermeidet den missverständlichen Eindruck, die Gerechten und Heiligen gehörten zu den Engeln. „Pupille des Auges“ hält das konkrete Bild fest; „einen langen Schlaf schlafen“ bewahrt bewusst die altertümliche, aber verständliche Euphemie.
