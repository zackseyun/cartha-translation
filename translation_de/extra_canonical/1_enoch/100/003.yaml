base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/003.yaml
  text: And a horse will walk up to its chest in the blood of sinners[d][c][b][a], and chariots will sink up to their tops.
translation:
  language: de
  text: Und ein Pferd wird bis an die Brust im Blut der Sünder gehen,[a] und Streitwagen werden bis zu ihren oberen Teilen einsinken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Ge’ez steht ein einzelnes Pferd, das auch ein typisches oder kollektives Bild ausdrücken kann. Der Ausdruck bezeichnet die Brust des Pferdes, nicht seinen Zaum; das ähnliche Bild in Offenbarung 14,20 lautet anders.
    reason: lexical_alternative_and_cross_reference
lexical_decisions:
- source_word: የሐውር
  choice: wird … gehen
  rationale: Die Form wird als finites Verb von ሐወረ, »gehen«, verstanden und bezeichnet die Bewegung des Pferdes durch das Blut.
- source_word: ፈረስ
  choice: ein Pferd
  rationale: Der im Ge’ez stehende Singular wird bewahrt; er kann zugleich ein typisches oder kollektives Bild tragen.
- source_word: እስከ እንግድዓሁ
  choice: bis an seine Brust
  rationale: እስከ bezeichnet die erreichte Grenze; እንግድዓ mit Suffix meint hier die Brust des Pferdes, nicht sein Zaumzeug.
- source_word: ውስተ ደመ ኃጥኣን
  choice: im Blut der Sünder
  rationale: Die räumliche Präposition und die moralische Bezeichnung werden direkt und idiomatisch wiedergegeben.
- source_word: ሰረገላት
  choice: Wagen
  rationale: Das Wort bezeichnet Wagen, im gegebenen apokalyptischen Zusammenhang möglicherweise Streitwagen; die allgemeinere Wiedergabe vermeidet eine unnötige Präzisierung.
- source_word: እስከ መልዕልታ
  choice: bis zu ihrem oberen Rand
  rationale: መልዕልታ bezeichnet die Höhe beziehungsweise den oberen Teil; »oberer Rand« macht das Ausmaß des Einsinkens anschaulich.
- source_word: ትሰጠም
  choice: werden … einsinken
  rationale: Im Zusammenhang mit der tiefen Blutmenge bezeichnet die Form ein Sinken beziehungsweise Untergehen; die aktive deutsche Form ist natürlich und bewahrt das Bild.
theological_decisions:
- issue: Moralische Bezeichnung ኃጥኣን
  choice: Sünder
  alternative: Schuldige; Übeltäter
  rationale: »Sünder« bewahrt die ausdrückliche moralisch-religiöse Kategorie des Ausgangstextes, ohne zusätzliche dogmatische Bestimmungen einzutragen.
- issue: Mögliche Angleichung an Offenbarung 14,20
  choice: Brust
  alternative: Zaumzeug
  rationale: Der Ge’ez-Ausdruck bezeichnet anatomisch die Brust. Die Übersetzung wird daher nicht an das ähnliche Bild von den Pferdezaumzeugen in Offenbarung 14,20 angeglichen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die drastische apokalyptische Bildsprache bleibt ungemildert; der Satzbau folgt eng den beiden parallelen Teilsätzen des Ge’ez.
