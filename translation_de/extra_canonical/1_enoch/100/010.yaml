base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/010.yaml
  text: And now[a], know that your deeds will be investigated by the angels in heaven, and by the sun and the moon and the stars, concerning your sins[b], because upon the earth you execute judgment upon the righteous.
translation:
  language: de
  text: 'Und nun wisst[a]: Eure Taten werden im Himmel von den Engeln, von der Sonne, dem Mond und den Sternen im Hinblick auf eure Sünden untersucht[b], denn auf der Erde übt ihr Gericht an den Gerechten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hier bereitgestellte ge’ezische Versauszug enthält nur die einleitenden Worte: „Und nun, wisst …“. Der weitere Wortlaut ist aus dem überlieferten vollständigen Vers ergänzt.'
    reason: textual_variant
  - marker: b
    text: Die ge’ezische Satzfügung lässt auch die Auffassung zu, dass Engel, Sonne, Mond und Sterne über die Taten beziehungsweise Sünden befragt werden und damit als Zeugen dienen.
    reason: translation_ambiguity
lexical_decisions:
- source_word: ወይእዜኒ
  choice: Und nun
  rationale: Die Verbindung aus Konjunktion und Zeitadverb leitet einen neuen, nachdrücklichen Abschnitt ein. „Und nun“ gibt diesen Übergang schlicht und idiomatisch wieder.
- source_word: አእምሩ
  choice: sollt ihr wissen
  rationale: Der ge’ezische Pluralimperativ bedeutet wörtlich „wisst/erkennt“. Die deutsche Aufforderungsform „sollt ihr wissen“ klingt in diesem Zusammenhang natürlich und behält den mahnenden Ton.
- source_word: ይትኀሠሥ
  choice: werden … untersucht werden
  rationale: Die Form bezeichnet ein Suchen, Nachforschen oder Untersuchen. Die passive Wiedergabe folgt der Satzstruktur, ohne genauer festzulegen, wie die genannten himmlischen Größen an der Untersuchung beteiligt sind.
- source_word: ምግባሪክሙ
  choice: eure Taten
  rationale: Das Substantiv bezeichnet das Tun beziehungsweise die vollbrachten Werke. „Taten“ ist im Deutschen klar und wertungsneutral.
- source_word: በእንተ፡ ኃጢአቲክሙ
  choice: im Hinblick auf eure Sünden
  rationale: Die Präpositionalfügung kann „wegen“, „hinsichtlich“ oder „im Hinblick auf“ bedeuten. Die gewählte Formulierung wahrt die Beziehung zu den Sünden, ohne eindeutig zwischen Grund und Gegenstand der Untersuchung zu entscheiden.
- source_word: ትገብሩ፡ ኵነኔ
  choice: übt ihr Gericht
  rationale: Die Wendung bedeutet wörtlich „ihr tut/macht Gericht“. „Gericht üben“ ist eine natürliche, zugleich würdige deutsche Entsprechung.
- source_word: ጻድቀ፡ በጻድቃን
  choice: an den Gerechten
  rationale: Die schwierige ge’ezische Schlussfügung bezieht das ausgeübte Gericht auf Gerechte. „An den Gerechten“ folgt der überlieferten Deutung, ohne die Aussage moralisch oder dogmatisch auszubauen.
theological_decisions:
- issue: Rolle der Engel und der Himmelskörper bei der Untersuchung
  choice: als Beteiligte in einer Passivkonstruktion wiedergegeben
  alternative: „von den Engeln wird über eure Taten Auskunft verlangt werden, ebenso von Sonne, Mond und Sternen“
  rationale: Die ge’ezische Konstruktion mit wiederholtem እም kann unterschiedlich aufgelöst werden. Die Hauptfassung folgt der gut bezeugten Deutung als himmlische Untersuchung, während die Fußnote die mögliche Funktion als Auskunftsgeber oder Zeugen offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Mahnrede. Die Formulierung bleibt verständlich, vermeidet konfessionelle Zusätze und kennzeichnet sowohl die unvollständige Versvorlage als auch die syntaktische Mehrdeutigkeit der himmlischen Untersuchung.
