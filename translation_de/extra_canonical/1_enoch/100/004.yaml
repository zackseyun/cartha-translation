revisions:
- from: In jenen Tagen werden die Engel zu den verborgenen Orten[a] hinabsteigen und alle, die der Sünde Vorschub leisteten,[b] an einem einzigen Ort zusammenbringen. Dann wird sich der Höchste an jenem Tag des Gerichts erheben, um mitten unter den Sündern ein großes Gericht zu vollziehen.
  to: In jenen Tagen werden die Engel in die verborgenen Orte[a] hinabsteigen und alle, die der Sünde Vorschub leisteten,[b] an einem einzigen Ort zusammenbringen; und der Höchste wird sich an jenem Tag des Gerichts erheben, um mitten unter den Sündern ein großes Gericht zu vollziehen.
  rationale: Die Revision berichtigt die lokale Bewegungsrichtung („in die“) und vermeidet mit „und“ eine nicht ausdrücklich markierte zeitliche Zuspitzung. Die zurückhaltende Wiedergabe der schwierigen Klausel und die Fußnote bewahren die dokumentierte Textunsicherheit, ohne eine theologisch oder syntaktisch weitergehende Deutung aufzuzwingen.
