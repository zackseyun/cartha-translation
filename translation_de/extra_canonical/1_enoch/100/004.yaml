base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/004.yaml
  text: In those days the angels will descend into the hidden places and gather together into one place all those who led others into sin[c][b][a]; and the Most High will arise on that day of judgment to execute great judgment in the midst of the sinners.
translation:
  language: de
  text: In jenen Tagen werden die Engel in die verborgenen Orte[a] hinabsteigen und alle, die der Sünde Vorschub leisteten,[b] an einem einzigen Ort zusammenbringen; und der Höchste wird sich an jenem Tag des Gerichts erheben, um mitten unter den Sündern ein großes Gericht zu vollziehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Verborgene Orte“ kann auch mit „geheime Orte“ oder „Verstecke“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: 'Die Klausel ist textlich schwierig. Die Handschriftenlesart wird gewöhnlich als „die der Sünde halfen“ verstanden. Die vorliegende Transkription kann dagegen den Eindruck erwecken: „die die Sünde herabkommen ließen“ oder „durch die die Sünde herabkam“.'
    reason: textual_variant
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: In jenen Tagen
  rationale: Bewahrt die geläufige apokalyptische Zeitformel und die konkrete Bildsprache von „Tagen“.
- source_word: መላእክት
  choice: die Engel
  rationale: Im Zusammenhang des endzeitlichen Gerichts sind übernatürliche Boten gemeint; „Engel“ ist die natürliche deutsche Wiedergabe.
- source_word: ይወርዱ ውስተ ምኅባእት
  choice: werden … zu den verborgenen Orten hinabsteigen
  rationale: „Hinabsteigen“ erhält die vertikale Bildsprache; „verborgene Orte“ wahrt den lokalen Plural, ohne die Art der Verstecke näher festzulegen.
- source_word: ወይገብእዎሙ በአሐዱ መካን
  choice: an einem einzigen Ort zusammenbringen
  rationale: Gibt sowohl das Sammeln als auch die Bewegung auf einen gemeinsamen Ort hin idiomatisch wieder.
- source_word: ለእሉ እለ ይወርደዋ ለኃጢአት
  choice: alle, die der Sünde Vorschub leisteten
  rationale: Die Formulierung gibt die in der Handschriftentradition bezeugte Vorstellung wieder, dass diese Menschen der Sünde halfen, ohne daraus unbelegt ein Verführen anderer zu machen. Die schwierige beziehungsweise abweichend transkribierte Lesart wird in der Fußnote offengelegt.
- source_word: ወይትነሣእ ልዑል
  choice: Dann wird sich der Höchste … erheben
  rationale: „Der Höchste“ bewahrt den göttlichen Titel; „sich erheben“ bezeichnet den Beginn des richterlichen Handelns.
- source_word: በይእቲ ዕለት ኵነኔ
  choice: an jenem Tag des Gerichts
  rationale: Erhält die feierliche Gerichtsformel und nennt „Gericht“ ausdrücklich.
- source_word: ከመ ይግበር ኵነኔ ዐቢየ
  choice: um … ein großes Gericht zu vollziehen
  rationale: Bewahrt die Wiederholung des Gerichtswortes und formuliert die richterliche Handlung in würdigem, verständlichem Deutsch.
- source_word: እማእከሎሙ ለኃጥኣን
  choice: mitten unter den Sündern
  rationale: Erhält gegenüber dem allgemeineren „unter den Sündern“ die räumlich anschauliche Aussage des Ausgangstextes.
theological_decisions:
- issue: Identität der von den Engeln Zusammengebrachten
  choice: Menschen, die der Sünde Vorschub leisteten
  alternative: Menschen, die andere zur Sünde verführten; Menschen, durch die die Sünde herabkam
  rationale: Die Wendung wird nicht zu einer allgemeinen Bezeichnung aller Sünder eingeebnet. Zugleich vermeidet die Übersetzung die unbelegte Ergänzung eines menschlichen Objekts wie „andere“ und hält die textliche Schwierigkeit in einer Fußnote offen.
- issue: Göttlicher Titel ልዑል
  choice: der Höchste
  alternative: der Erhabene
  rationale: „Der Höchste“ ist die klare, traditionsübergreifend verständliche Wiedergabe des göttlichen Titels und trägt dessen Gewicht, ohne eine weitergehende Identifikation einzuführen.
- issue: Ort und Vollzug des Gerichts
  choice: mitten unter den Sündern ein großes Gericht vollziehen
  alternative: unter den Sündern ein strenges Urteil fällen
  rationale: Die gewählte Fassung bewahrt sowohl die räumliche Wendung als auch die wiederholte Gerichtsterminologie und deutet „groß“ nicht vorschnell als „streng“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener apokalyptischer Bildsprache. Der Satz wurde maßvoll gegliedert, ohne die Abfolge von Sammlung und göttlichem Gericht aufzulösen. Archaismen wurden vermieden; „Gericht vollziehen“ bleibt bewusst feierlich und quellennah.
