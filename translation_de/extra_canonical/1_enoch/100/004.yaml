    rationale: Die Präposition ውስተ bezeichnet hier das Hineingehen bzw. Hineinsteigen. „In die verborgenen Orte hinabsteigen“ ist genauer als „zu den ... Orten hinabsteigen“.
  - severity: low
    issue: Zusätzliche zeitliche Verknüpfung „Dann“
    rationale: Das Ausgangstext-ו verbindet die Aussage schlicht mit der vorherigen Handlung. „Dann“ ist zwar nicht sinnverändernd, aber eine nicht erforderliche explizite Sequenzierung.
  - severity: low
    issue: Fußnote zur Textlage präzisieren
    rationale: Die Fußnote sollte klar zwischen der maßgeblichen Handschriftenlesart „der Sünde halfen“ und dem abweichenden Eindruck der vorliegenden Transkription unterscheiden, ohne die alternative Deutung als gleichrangigen Wortlaut auszugeben.
