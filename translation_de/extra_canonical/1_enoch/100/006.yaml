base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/006.yaml
  text: And wise men will see[a], and all the children of the earth will understand every matter of this book[c][b], and they will know that their wealth cannot save them from the destruction of their sins.
translation:
  language: de
  text: Und weise Menschen werden wahrlich[a] sehen, und alle Kinder der Erde werden alles in diesem Buch verstehen; sie werden erkennen, dass ihr Reichtum sie nicht vor dem Verderben durch ihre Sünden[b] retten kann.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und weise Menschen werden die Wahrheit sehen.“ Die Form እሙነ kann möglicherweise substantivisch („die Wahrheit“) statt adverbial („wahrlich“) verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „im Verderben ihrer Sünden“. Auch möglich: „beim Zusammenbruch infolge ihrer Sünden“. Gemeint ist wahrscheinlich das Verderben, das ihre Sünden herbeiführen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እሙነ
  choice: wahrlich
  rationale: Die Form lässt sich am ehesten adverbial als Bekräftigung verstehen. Da auch eine substantivische Deutung als „die Wahrheit“ möglich ist, wird diese in einer Fußnote bewahrt.
- source_word: ሰብአ ጠቢባን
  choice: weise Menschen
  rationale: Gibt die menschliche Bezugsgröße und das Adjektiv unmittelbar wieder, ohne das heute unnötig geschlechtsspezifisch klingende „weise Männer“.
- source_word: ይሬእዩ
  choice: werden sehen
  rationale: Bewahrt das einfache Verb des Sehens und lässt offen, ob körperliches Sehen oder geistiges Erkennen gemeint ist.
- source_word: ውሉደ ምድር
  choice: Kinder der Erde
  rationale: Erhält die charakteristische apokalyptische Ausdrucksweise des Ausgangstextes.
- source_word: ኵሎ ነገረ ዛቲ መጽሐፍ
  choice: jede Sache in diesem Buch
  rationale: ነገር kann Sache, Angelegenheit oder Wort bedeuten. Die gewählte Formulierung bewahrt diese Bedeutungsbreite in verständlichem Deutsch.
- source_word: ያእምሩ
  choice: werden erkennen
  rationale: Bezeichnet Wissen beziehungsweise Verstehen; „erkennen“ passt zum Übergang vom Erfassen des Buchinhalts zur Einsicht in dessen Folgerung.
- source_word: ብዕሎሙ
  choice: ihr Reichtum
  rationale: Gibt das Subjekt des abschließenden Satzes ausdrücklich wieder und vermeidet die frühere Fehlinterpretation als reflexive Wendung.
- source_word: አድኅኖቶሙ
  choice: sie retten
  rationale: Die Form bezeichnet ihre Rettung beziehungsweise Bewahrung; mit „ihr Reichtum“ als Subjekt ergibt sich im Deutschen natürlich „sie retten“.
- source_word: በመዳቀ ኃጢአቶሙ
  choice: vor dem Verderben durch ihre Sünden
  rationale: Versteht መዳቀ als Sturz, Zerschmetterung oder Verderben und den Genitiv als Hinweis auf das durch die Sünden herbeigeführte Unheil. Eine formal engere Alternative wird in der Fußnote genannt.
theological_decisions:
- issue: Ob menschlicher Reichtum vor den Folgen der Sünde retten kann
  choice: Der Reichtum kann die Menschen nicht vor dem durch ihre Sünden kommenden Verderben retten.
  alternative: Ihr Reichtum kann sie beim Zusammenbruch ihrer Sünden nicht retten.
  rationale: Der Ausgangstext nennt ausdrücklich den Reichtum als das, was zur Rettung unfähig ist. Die Übersetzung macht keine weitergehende Aussage über die Möglichkeit von Umkehr oder göttlicher Rettung.
- issue: Deutung von እሙነ
  choice: 'adverbiale Bekräftigung: „wahrlich“'
  alternative: 'substantivisches Objekt: „die Wahrheit“'
  rationale: Beide Deutungen sind sprachlich erwägenswert. Der Haupttext folgt der zurückhaltenderen adverbialen Lesart, während die andere Möglichkeit dokumentiert wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht apokalyptischem Klang. „Kinder der Erde“ und „werden sehen“ bewahren die Bildsprache und Offenheit des Geʿez; schwer verständliche Wörtlichkeit wird nur dort geglättet, wo es für natürliches Deutsch nötig ist.
