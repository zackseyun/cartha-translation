base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/009.yaml
  text: 'Woe to you[a], sinners, because of the words of your mouth and because of the deeds of your hands[b], which your wickedness has done: in the heat of a flame more burning than fire you shall burn.'
translation:
  language: de
  text: Wehe euch, ihr Sünder, wegen der Worte eures Mundes und wegen der Taten eurer Hände, die eure Gottlosigkeit hervorgebracht hat:[a] In der Glut einer Flamme, die heißer brennt als Feuer, werdet ihr brennen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Satzbau ist schwierig. Der Relativsatz kann die Worte und die Taten gemeinsam als Auswirkungen der Gottlosigkeit zusammenfassen; möglicherweise bezieht er sich enger nur auf die Taten.
    reason: syntactic_ambiguity
  - marker: b
    text: Die überlieferte Wortform im angegebenen Text ist unsicher; die kritische Lesart stützt die Wiedergabe „werdet ihr brennen“. Die Feuerwendung wurde auch als „in lodernden Feuerflammen“ verstanden.
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: አሌ
  choice: Wehe
  rationale: Bewahrt die Formel einer apokalyptischen Gerichtsansage und ist im Deutschen würdig und unmittelbar.
- source_word: ኃጥኣን
  choice: ihr Sünder
  rationale: Gibt die direkte Anrede und die moralische Bezeichnung idiomatisch wieder.
- source_word: ዲበ
  choice: wegen
  rationale: Markiert bei Worten und Taten jeweils den Grund der Weheruf-Gerichtsansage.
- source_word: ነገረ አፉክሙ
  choice: die Worte eures Mundes
  rationale: Erhält die konkrete Körpermetaphorik und den Parallelismus mit den Händen.
- source_word: ተግባረ እዴክሙ
  choice: die Taten eurer Hände
  rationale: Bewahrt den semitisch geprägten Parallelismus von Mund und Händen, ohne im Deutschen unverständlich zu wirken.
- source_word: ርስዓኒክሙ
  choice: eure Gottlosigkeit
  rationale: Erfasst neben allgemeiner Bosheit besonders die religiös-moralische Dimension des Ausdrucks.
- source_word: በዋዕየ ላህብ እምእሳት
  choice: in der Glut einer Flamme, die heißer brennt als Feuer
  rationale: Bewahrt die intensive Feuerbildlichkeit und gibt እም als Vergleich wieder, statt die Wendung zu einer bloßen Feuerflamme einzuebnen.
- source_word: ይውዒ / kritisch ትውዕዩ
  choice: werdet ihr brennen
  rationale: Folgt der durch die kritische Lesart und den Verskontext gestützten zweiten Person Plural; die überlieferte Transkription bietet hier eine abweichende beziehungsweise problematische Form.
theological_decisions:
- issue: Moralische oder ausdrücklich religiöse Wiedergabe von ርስዓኒክሙ
  choice: eure Gottlosigkeit
  alternative: eure Bosheit
  rationale: „Gottlosigkeit“ erhält die religiös-moralische Tiefe, ohne eine spätere konfessionelle Lehre einzutragen.
- issue: Syntaktischer Bezug des Relativsatzes
  choice: Der Relativsatz fasst die Worte und Taten als Hervorbringungen der Gottlosigkeit zusammen.
  alternative: Der Relativsatz bezieht sich nur auf die Taten der Hände.
  rationale: Die Syntax ist schwierig; die gewählte Fassung folgt dem wahrscheinlichen umfassenden Bezug, während die Fußnote die Unsicherheit offenlegt.
- issue: Art der Feuerbeschreibung
  choice: 'vergleichend: heißer als Feuer'
  alternative: in lodernden Feuerflammen
  rationale: Die vergleichende Kraft von እም wird bewahrt, ohne die bildhafte Spannung rationalistisch aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrtem apokalyptischem Ton. Die Parallelstruktur „Worte eures Mundes / Taten eurer Hände“ bleibt erhalten; schwierige Syntax und Textüberlieferung werden nicht stillschweigend geglättet.
