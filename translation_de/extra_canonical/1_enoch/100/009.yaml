  naturalness: Der Satz ist insgesamt modernes, würdiges Standarddeutsch. „Eine Flamme, die heißer brennt als Feuer“ wirkt jedoch unnötig schwerfällig und vermischt die Bildbereiche. „eine Flamme, heißer als Feuer“ ist idiomatischer und erhält die bewusst intensive, vergleichende Bildsprache.
  terminology: „Wehe“, „Sünder“, „Worte eures Mundes“, „Taten eurer Hände“ und „Gottlosigkeit“ sind registergerecht. „Gottlosigkeit“ bildet die religiös-moralische Nuance ab, ohne sie dogmatisch zu spezifizieren.
