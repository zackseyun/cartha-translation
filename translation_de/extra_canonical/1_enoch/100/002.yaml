base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/002.yaml
  text: For a man will not withhold his hand from his sons[a], nor from the sons of his sons, to kill them; and the sinner will not withhold his hand from his honored brother[b]. From dawn until the sun sets they will slaughter one another.
translation:
  language: de
  text: Denn ein Mann wird seine Hand nicht von seinen Söhnen[a] und nicht von den Söhnen seiner Söhne zurückhalten, um sie zu töten; und der Sünder wird seine Hand nicht von seinem geehrten Bruder[b] zurückhalten. Von der Morgendämmerung bis zum Sonnenuntergang werden sie einander niedermetzeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Kindern«. Das entsprechende Wort im Geʿez kann je nach Zusammenhang auch Nachkommen beiderlei Geschlechts bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung »seinem geehrten Bruder« kann auch »seinem vornehmen Bruder« bedeuten, je nachdem, ob persönliche Ehre oder gesellschaftlicher Rang betont wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢይከልእ እዴሁ
  choice: wird seine Hand nicht … zurückhalten
  rationale: Bewahrt das konkrete gewaltsame Idiom der Vorlage und klingt im Deutschen zugleich verständlich.
- source_word: እምውሉዱ
  choice: von seinen Söhnen
  rationale: Gibt die naheliegende konkrete Verwandtschaftsbezeichnung wieder; die mögliche weitere Bedeutung wird in einer Fußnote genannt.
- source_word: ወእምነ ውሉደ ውሉዱ
  choice: und nicht von den Söhnen seiner Söhne
  rationale: Erhält die Wiederholung und den familiären Aufbau des Geʿez, statt zu dem glatteren »Enkeln« zu verkürzen.
- source_word: ከመ ይቅትሎ
  choice: sondern sie töten
  rationale: Drückt im Zusammenhang die Folge beziehungsweise Absicht der nicht zurückgehaltenen Hand natürlich aus. Die Konstruktion bleibt hinsichtlich Zweck und Ergebnis eng am Kontext, ohne umständlich zu werden.
- source_word: ኃጥእ
  choice: der Sünder
  rationale: Bewahrt die im henochischen Gerichtskontext übliche moralische Kategorie im repräsentativen Singular.
- source_word: እኍሁ ክቡር
  choice: seinem geehrten Bruder
  rationale: »Geehrt« lässt offen, ob persönliche Ehre oder gesellschaftlicher Rang im Vordergrund steht.
- source_word: እምጎሕ እስከ ትዐርብ ፀሐይ
  choice: Von der Morgendämmerung bis zum Sonnenuntergang
  rationale: Gibt die volle Tageszeitspanne anschaulich und in einem würdigen apokalyptischen Register wieder.
- source_word: ይትቃተሉ
  choice: werden sie einander niedermetzeln
  rationale: Bringt die reziproke, tödliche Gewalt stärker zum Ausdruck als das zu schwache »bekämpfen«.
theological_decisions:
- issue: Reichweite der geschilderten Gewalt
  choice: Der Vers schildert einen Zusammenbruch der menschlichen Ordnung, bei dem selbst engste Familienbindungen und ehrwürdige Verwandtschaft nicht mehr vom Töten abhalten.
  alternative: Bloße Schlachtfeldgewalt oder ein allgemeines, nicht wörtlich auf Familien bezogenes Sprichwort.
  rationale: Die wiederholten konkreten Familienbezeichnungen – Söhne, Söhne der Söhne und Bruder – sollen nicht zu einem allgemeinen Konflikt verflacht werden. Zugleich wird keine über den Text hinausgehende dogmatische Deutung hinzugefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener apokalyptischer Härte. Die konkrete Bildsprache der Hand und die wiederholte Verwandtschaftsstruktur bleiben sichtbar; Fußnoten bewahren echte lexikalische Mehrdeutigkeit.
