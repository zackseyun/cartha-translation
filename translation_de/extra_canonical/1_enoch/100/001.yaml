base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/001.yaml
  text: And in those days[a], in one place, fathers together with their sons will be struck down[d][c][b], and brothers together with their companions will fall in death until a stream flows from their blood.
translation:
  language: de
  text: Und in jenen Tagen werden an einem Ort[a] Väter zusammen mit ihren Söhnen erschlagen[b], und Brüder werden zusammen mit ihren Gefährten dem Tod anheimfallen, bis aus ihrem Blut ein Strom fließt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die äthiopische Wortform an dieser Stelle ist in der vorliegenden Textüberlieferung schwierig; „an einem Ort“ ist eine vorsichtige lokale Wiedergabe.
    reason: textual_variant
  - marker: b
    text: Die überlieferte OCR-Lesung scheint fehlerhaft zu sein. Die wahrscheinlich zugrunde liegende Form bedeutet passiv „werden erschlagen“; bei Beibehaltung der erfassten Form wäre auch eine reziproke Deutung wie „bekämpfen einander“ erwogen worden.
    reason: textual_variant
  - marker: c
    text: Das drastische Bild bezeichnet ein solches Ausmaß des Blutvergießens, dass das Blut wie ein fließender Strom dargestellt wird.
    reason: cultural_note
lexical_decisions:
- source_word: በአማንቱ መዋዕል
  choice: in jenen Tagen
  rationale: Bewahrt die übliche apokalyptische Zeitformel in würdigem, natürlichem Deutsch.
- source_word: በ፻መካን
  choice: an einem Ort
  rationale: Die überlieferte Form ist schwierig; die vorsichtige Wiedergabe hält am wahrscheinlichen lokalen Singular fest, ohne die unsichere Wendung weiter auszudeuten.
- source_word: አበው ምስለ ውሉዶሙ
  choice: Väter zusammen mit ihren Söhnen
  rationale: Die konkreten Verwandtschaftsbezeichnungen und die Vater-Sohn-Gegenüberstellung bleiben erhalten.
- source_word: ይትኃድኡ (wahrscheinlich OCR für ይትጐድኡ)
  choice: werden erschlagen
  rationale: Die korrigierte Lesung ist passiv und bezeichnet gewaltsames Niederschlagen; sie wird daher nicht als reziprokes Kämpfen wiedergegeben.
- source_word: አኀው ምስለ ቢጾሙ
  choice: Brüder … zusammen mit ihren Gefährten
  rationale: „Brüder“ wahrt die familiäre Bezeichnung; „Gefährten“ gibt den relational weiten Sinn von ቢጾሙ würdig wieder.
- source_word: ይወድቁ በሞት
  choice: werden dem Tod anheimfallen
  rationale: Die feierliche Todesmetaphorik des Fallens bleibt in idiomatischem, gehobenem Deutsch erkennbar.
- source_word: እስከ ይውኅዝ ትክዚ እምደመ ዚአሆሙ
  choice: bis aus ihrem Blut ein Strom fließt
  rationale: Bewahrt die drastische apokalyptische Bildfolge, ohne sie durch einen nicht ausdrücklich markierten Vergleich abzuschwächen.
