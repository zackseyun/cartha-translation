base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/100/007.yaml
  text: Woe to you[a], sinners, when you oppress the righteous on the day of fierce distress, and burn them with fire[b]; then you will be repaid according to your deeds.
translation:
  language: de
  text: Wehe euch, ihr Sünder, wenn ihr die Gerechten am Tag schwerer Bedrängnis[a] unterdrückt[b] und sie im Feuer verbrennt! Dann wird euch nach euren Taten vergolten werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich geht es um einen „Tag“ besonders schwerer Not oder Bedrängnis. Auch „Tag mächtiger Drangsal“ ist möglich; die Hauptübersetzung vermeidet jedoch einen später geprägten Fachausdruck.
    reason: lexical_alternative
  - marker: b
    text: Das hier mit „unterdrückt“ wiedergegebene Verb kann auch „bedrängt“, „misshandelt“ oder, je nach genauer Art der Gewalt, „verfolgt“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Wehe euch
  rationale: Bewahrt die direkte prophetische Weheruf-Formel und ihre Gerichtsschärfe.
- source_word: ኃጥኣን
  choice: ihr Sünder
  rationale: Gibt die ausdrückliche moralisch-religiöse Anrede wieder und bleibt im Deutschen natürlich.
- source_word: ሶበ
  choice: wenn
  rationale: Gibt den zeitlichen beziehungsweise situativen Anschluss wieder, ohne eine eindeutige kausale Deutung aufzuzwingen.
- source_word: ታመኒድብዎሙ
  choice: ihr ... unterdrückt
  rationale: Bezeichnet harte, bedrängende Behandlung; „unterdrücken“ lässt offen, ob besonders Verfolgung oder allgemeiner gewaltsame Bedrückung gemeint ist.
- source_word: ጻድቃን
  choice: die Gerechten
  rationale: Bewahrt die zentrale ethisch-apokalyptische Bezeichnung des Henochbuches.
- source_word: በዕለተ፡ ጻዕብ፡ ኃያል
  choice: am Tag schwerer Bedrängnis
  rationale: Gibt „Tag“, Not/Bedrängnis und die verstärkende Intensität verständlich wieder, ohne späteres eschatologisches Fachvokabular einzutragen.
- source_word: ታነድድዎሙ፡ በእሳት
  choice: sie im Feuer verbrennt
  rationale: Erhält das konkrete und gewaltsame Feuerbild. „Im Feuer“ entspricht idiomatischem Deutsch und vermeidet unnötige Glättung.
- source_word: ወትትፈደዩ
  choice: wird euch ... vergolten werden
  rationale: Bewahrt die passive Aussage der Vergeltung und lässt deren handelnde Instanz unausgesprochen, wie im Ausgangstext.
- source_word: ከመ፡ ምግባራቲክሙ
  choice: nach euren Taten
  rationale: Gibt die Entsprechung zwischen Handeln und Vergeltung knapp und als geläufige Gerichtsformel wieder.
theological_decisions:
- issue: Bezug und Urheber der abschließenden Vergeltung
  choice: Die direkt angeredeten Sünder empfangen Vergeltung nach ihren Taten; der Urheber bleibt ungenannt.
  alternative: Die Aussage könnte unpersönlicher als allgemeine Feststellung von Vergeltung verstanden oder die Vergeltung unmittelbar mit der Not dieses Tages verbunden werden.
  rationale: Die zweite Person wird durch den Vers hindurch beibehalten. Die deutsche Passivform wahrt zugleich die Zurückhaltung des Textes hinsichtlich der handelnden Instanz.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter prophetischer Anrede. Der Satz bleibt stark und konkret; zugleich werden weder die Art der Bedrängnis noch der Urheber der Vergeltung über den ge'ezischen Wortlaut hinaus festgelegt.
