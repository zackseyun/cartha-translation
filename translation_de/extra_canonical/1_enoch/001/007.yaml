base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/007.yaml
  text: And the earth shall be rent asunder[a], and everything that is in the earth shall be destroyed[c][b], and judgment shall come upon all.
translation:
  language: de
  text: Und die Erde wird aufgerissen werden[a], und alles, was in der Erde[b] ist, wird vernichtet werden, und Gericht[c] wird über alle kommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder nach einer abweichenden Wortdeutung: „erschüttert werden“. Das konkrete Bild des Aufreißens beziehungsweise Spaltens wird jedoch auch durch die griechische Überlieferung gestützt.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „in der Erde“; möglich ist auch das Verständnis „auf der Erde“.
    reason: lexical_alternative
  - marker: c
    text: Das Wort kann auch „Gerechtigkeit“ oder „Recht“ bedeuten; hier bezeichnet es wahrscheinlich den kommenden Vollzug des Gerichts.
    reason: lexical_alternative
lexical_decisions:
- source_word: ትሠጠጥ
  choice: wird aufgerissen werden
  rationale: Die Form bezeichnet hier das Aufreißen oder Spalten der Erde; die passive Wiedergabe bewahrt sowohl die Grammatik als auch das konkrete apokalyptische Bild.
- source_word: ምድር
  choice: die Erde
  rationale: Der universale Zusammenhang des kommenden Gerichts spricht für „Erde“ statt für das örtlich enger wirkende „Land“.
- source_word: ኵሉ ዘውስተ ምድር
  choice: alles, was in der Erde ist
  rationale: Dies folgt bewusst der ungewöhnlichen räumlichen Formulierung des ge'ezischen Textes, ohne sie stillschweigend zu „auf der Erde“ zu glätten.
- source_word: ይትሐጐል
  choice: wird vernichtet werden
  rationale: Das Verb bezeichnet Untergang oder Zerstörung; „vernichtet werden“ gibt die passive Aussage im Gerichtszusammenhang klar wieder.
- source_word: ፍትሕ
  choice: Gericht
  rationale: Das Bedeutungsfeld umfasst auch Gerechtigkeit und Recht. In der Verbindung „wird über alle kommen“ steht hier wahrscheinlich der Vollzug gerichtlicher Entscheidung im Vordergrund.
- source_word: ላዕለ ኵሉ
  choice: über alle
  rationale: Die Präposition kann „über/auf“ bedeuten. „Über alle“ ist im Deutschen natürlich und bewahrt die umfassende Reichweite der Aussage.
theological_decisions:
- issue: Ob ፍትሕ eine sittliche Eigenschaft oder ein kommendes eschatologisches Geschehen bezeichnet
  choice: Gericht
  alternative: Gerechtigkeit oder Recht
  rationale: Der Satzbau „wird über alle kommen“ legt ein Ereignis göttlicher Rechtsprechung nahe. Die Fußnote hält jedoch die echte Bedeutungsbreite des Nomens offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer apokalyptischer Bildsprache. Die auffällige Wendung „in der Erde“ bleibt im Haupttext erhalten; echte lexikalische Alternativen werden in den Fußnoten kenntlich gemacht.
