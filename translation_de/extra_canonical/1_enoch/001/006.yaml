base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/006.yaml
  text: And the lofty mountains will quake, and the high hills will be brought low; they will melt like wax before the blaze.
translation:
  language: de
  text: Und die hochragenden Berge werden erbeben[a], und die hohen Hügel werden erniedrigt werden[b]; sie werden wie Wachs vor der Flamme schmelzen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: werden erschüttert werden; werden zittern.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: werden niedrig gemacht; werden gedemütigt.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: wie Wachs in der Gegenwart der Flamme beziehungsweise des Feuers.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይደነግፁ (yǝdänägǝṣu)
  choice: werden erbeben
  rationale: Das intransitive „erbeben“ bewahrt die kosmisch-apokalyptische Kraft des Verbs und passt zum pluralischen Subjekt.
- source_word: አድባር (ʾadbar)
  choice: Berge
  rationale: Die übliche topografische Bedeutung bildet den passenden Parallelbegriff zu „Hügel“.
- source_word: ነዋኀን / ነዋኃት (newaḥn / newaḥat)
  choice: hochragenden / hohen
  rationale: Die Wörter bezeichnen hier die physische Höhe der Berge und Hügel; die leichte Variation ergibt natürliches Deutsch, ohne den Parallelismus aufzulösen.
- source_word: ይቴሐቱ (yǝtēḥatu)
  choice: werden erniedrigt werden
  rationale: Die passive Form und das Motiv der Umkehrung von Höhe bleiben ausdrücklich erhalten; „erniedrigt“ lässt sowohl ein Herabsenken als auch ein Demütigen anklingen.
- source_word: አውግር (ʾawgr)
  choice: Hügel
  rationale: Die geläufige topografische Wiedergabe wahrt den Parallelismus mit „Berge“.
- source_word: ይትመሰዉ (yǝtmäsäw)
  choice: werden schmelzen
  rationale: „Schmelzen“ gibt die konkrete physische Bildsprache unmittelbar und idiomatisch wieder.
- source_word: መዓረ (mäʿärä)
  choice: Wachs
  rationale: Die einfache Wiedergabe ist lexikalisch genau; „Bienenwachs“ wäre unnötig spezifisch.
- source_word: ግራ (gǝra)
  choice: vor
  rationale: „Vor“ gibt die räumliche beziehungsweise gegenwärtige Beziehung der Vergleichsformel knapp wieder.
- source_word: እም ላህብ (ʾǝm lāhb)
  choice: vor der Flamme
  rationale: „Flamme“ entspricht dem konkreten Feuerbild enger als das allgemeinere „Feuer“ und ist im Deutschen natürlich.
