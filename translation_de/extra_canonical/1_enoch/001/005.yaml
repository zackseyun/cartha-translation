base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/005.yaml
  text: And all will fear[a], and the vigilant ones will tremble[c][b]; and fear and great trembling will seize them as far as the ends of the earth.
translation:
  language: de
  text: Und alle werden sich fürchten, und die Wächter[a] werden erbeben; Furcht und großes Zittern werden sie bis an die Enden der Erde[b] ergreifen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „die Wachsamen“ oder „die Wachenden“. In 1 Henoch ist dies die übliche Bezeichnung für die „Wächter“.'
    reason: lexical_alternative
  - marker: b
    text: „Bis an die Enden der Erde“ bezeichnet die weltweite Erstreckung bis in die fernsten Bereiche.
    reason: cultural_note
lexical_decisions:
- source_word: ይፈርሁ
  choice: werden sich fürchten
  rationale: Die 3. Person Plural Imperfekt bezeichnet im prophetischen Zusammenhang die eintretende Reaktion der Furcht; die reflexive deutsche Wendung ist natürlich und quellennah.
- source_word: ኵሉ
  choice: alle
  rationale: Der universale Quantor wird substantivisch und ohne unnötige Ergänzung wiedergegeben.
- source_word: ይደለቀለቁ
  choice: werden erbeben
  rationale: Die intensiv-reduplizierte Verbform beschreibt heftiges Beben oder Zittern; „erbeben“ wahrt den würdevollen theophanischen Ton.
- source_word: ትጉሃን
  choice: die Wachsamen
  rationale: Das Wort bezeichnet wache bzw. wachsame Wesen und kann in 1 Henoch technisch auf die Wächter bezogen sein. „Die Wachsamen“ erhält die lexikalische Bedeutung, ohne den Titel im Haupttext ausdrücklich festzulegen.
- source_word: ይነሥኦሙ
  choice: werden sie ergreifen
  rationale: Das Verb mit Objektsuffix bezeichnet hier idiomatisch, dass Furcht und Zittern von ihnen Besitz ergreifen.
- source_word: ፍርሃት
  choice: Furcht
  rationale: Übliche Entsprechung für das Substantiv in einem theophanischen Kontext.
- source_word: ወረዓድ ዓቢይ
  choice: und großes Zittern
  rationale: Die koordinierte Nominalgruppe und die Intensivierung durch „groß“ werden formal bewahrt.
- source_word: እስከ አጽናፈ ምድር
  choice: bis an die Enden der Erde
  rationale: „Bis an“ drückt die räumliche Erstreckung aus; die traditionelle deutsche Wendung erhält das semitisch-apokalyptische Bild.
theological_decisions:
- issue: Bezug und Status von ትጉሃን
  choice: Im Haupttext „die Wachsamen“, mit Hinweis auf die mögliche Wiedergabe „die Wächter“.
  alternative: Direkt „die Wächter“ als technischer Titel für angelische Wesen.
  rationale: Die Wortbildung trägt die Bedeutung „wach/wachsam“ und kann im Henochbuch als Bezeichnung der Wächter dienen. Die gewählte Form bewahrt sowohl den lexikalischen Gehalt als auch eine geringe Restoffenheit des Ausdrucks.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der parallelen Struktur des Geʿez; „erbeben“, „Furcht“ und „ergreifen“ erhalten den feierlich-theophanischen Ton, ohne altertümliche Formen zu verwenden.
