base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/002.yaml
  text: 'And Enoch answered and said: "A righteous man[a], whose eyes were opened by God, saw a holy vision in the heavens, which the angels showed me; and from them I heard everything, and I understood what I saw—but not for this generation[d][c][b], but for a distant one that is to come."'
translation:
  language: de
  text: Und Henoch antwortete und sprach:[d] „Ein gerechter Mann, dem Gott die Augen geöffnet hatte,[a] sah in den Himmeln[b] eine heilige Vision, die mir die Engel zeigten. Von ihnen hörte ich alles, und ich verstand, was ich sah – doch nicht für diese Generation, sondern für eine ferne Generation, die kommen wird.“[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung über die von Gott geöffneten Augen ist im überlieferten äthiopischen Wortlaut syntaktisch schwierig; gemeint ist offenbar eine von Gott eröffnete oder enthüllte visionäre Wahrnehmung.
    reason: textual_variant
  - marker: b
    text: Wörtlich „in den Himmeln“. Der Plural entspricht einer in semitischen und apokalyptischen Texten verbreiteten kosmologischen Ausdrucksweise.
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: „sondern für eine weit entfernte Generation, die kommen wird“. Der Schluss kann als Bezug auf eine einzelne kommende Generation verstanden werden.'
    reason: lexical_alternative
  - marker: d
    text: 'Der äthiopische Text wechselt auffällig von der dritten Person („ein gerechter Mann … sah“) zur ersten Person („mir“, „ich“). Alternativ lässt sich der Anfang glätten: „Und Henoch, ein gerechter Mann, antwortete und sprach – nachdem Gott ihm die Augen geöffnet hatte: ‚Ich sah …‘“'
    reason: previous_rendering
lexical_decisions:
- source_word: ወአውሥአ ወይቤ
  choice: Und Henoch antwortete und sprach
  rationale: Bewahrt die semitisch geprägte, formelhafte Redeeinleitung, ohne sie zu glätten.
- source_word: ብእሲ ጻድቅ
  choice: ein gerechter Mann
  rationale: „Gerecht“ erhält die moralisch-theologische Bedeutung; der unbestimmte Ausdruck entspricht der vorliegenden Form.
- source_word: ዘእምኀበ እግዚአብሔር [እንዘ] አዕይንቲሁ ክሡታት
  choice: dem Gott die Augen geöffnet hatte
  rationale: Gibt die göttlich bewirkte Öffnung der visionären Wahrnehmung natürlich wieder und lässt die syntaktische Unterordnung bestehen.
- source_word: ራእየ ቅዱሰ
  choice: eine heilige Vision
  rationale: Das Adjektiv bestimmt syntaktisch am ehesten die Vision; „Vision“ wahrt den apokalyptischen Charakter.
- source_word: ዘበሰማያት
  choice: in den Himmeln
  rationale: Erhält den im äthiopischen Text vorhandenen Plural und damit die semitisch-apokalyptische kosmologische Ausdrucksweise.
- source_word: ዘአርአዩኒ መላእክት
  choice: die mir die Engel zeigten
  rationale: Bewahrt sowohl die Vermittlung durch Engel als auch den auffälligen Wechsel von der dritten zur ersten Person.
- source_word: ወሰማዕኩ እምኀቤሆሙ ኵሎ
  choice: Von ihnen hörte ich alles
  rationale: Gibt die umfassende Bedeutung von ኵሎ wieder und nennt die Engel weiterhin als Offenbarungsmittler.
- source_word: ወአእመርኩ አነ ዘእሬኢ
  choice: und ich verstand, was ich sah
  rationale: Drückt Erkenntnis beziehungsweise Verständnis aus, nicht nur Wahrnehmung.
- source_word: ወአኮ ለዛ ትውልድ አላ ለዘ ይመጽእ ርኁቃት
  choice: doch nicht für diese Generation, sondern für eine ferne, die kommen wird
  rationale: Bewahrt den Gegensatz zwischen der gegenwärtigen und einer zeitlich fernen kommenden Generation, ohne „fern“ lediglich zu „zukünftig“ abzuschwächen.
theological_decisions:
- issue: Bezeichnet ራእየ ቅዱሰ eine „heilige Vision“ oder eine „Vision des Heiligen“?
  choice: eine heilige Vision
  alternative: eine Vision des Heiligen
  rationale: Die Syntax legt näher, dass „heilig“ die Vision qualifiziert. Die Alternative würde eine spezifischere Gottesbezeichnung einführen, die der Wortlaut nicht verlangt.
- issue: Wie ausdrücklich soll die Zukunftsorientierung der Offenbarung formuliert werden?
  choice: nicht für diese Generation, sondern für eine ferne, die kommen wird
  alternative: nicht für diese Generation, sondern für eine zukünftige Generation
  rationale: Die gewählte Fassung erhält sowohl den Gegensatz der Generationen als auch das Bild zeitlicher Ferne.
- issue: Soll der Wechsel von der dritten Person („sah“) zur ersten Person („mir“, „ich“) vereinheitlicht werden?
  choice: Der Personenwechsel bleibt erhalten.
  alternative: 'Durchgehend erste Person: „Ich sah … die mir …“'
  rationale: Der Wechsel ist im überlieferten äthiopischen Wortlaut erkennbar und kann eine bewusst orakelhafte Redeweise darstellen; eine Vereinheitlichung würde eine echte Spannung des Textes beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener semitischer Redeeinleitung und apokalyptischer Bildsprache. Der ungewöhnliche Personenwechsel wird nicht harmonisiert; kurze Hauptsätze sorgen dennoch für gute Verständlichkeit.
