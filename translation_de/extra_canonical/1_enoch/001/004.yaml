base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/004.yaml
  text: And the God of eternity[a], from there, will tread upon Mount Sinai; he will appear with his host[d][c][b], and he will appear in the strength of his might from heaven.
translation:
  language: de
  text: Und der Gott der Ewigkeit[a] wird von dort her auf den Berg Sinai treten[b]. Er wird mit seinem Heer[c] erscheinen, und in der Stärke seiner Macht wird er vom Himmel her erscheinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Gott der Ewigkeit“. ዓለም kann auch „Welt“ oder „Zeitalter“ bedeuten; daher sind ebenso die Lesarten „Gott der Welt“ oder „Gott des Zeitalters“ möglich.
    reason: lexical_alternative
  - marker: b
    text: Das Verb kann auch allgemeiner mit „gehen“ oder „heranziehen“ wiedergegeben werden. „Treten“ bewahrt hier die gewichtige Bildsprache der Gotteserscheinung am Sinai.
    reason: lexical_alternative
  - marker: c
    text: Das ge’ezische Wort bezeichnet ein „Lager“ oder „Heer“. Auch griechische Textzeugen bieten das entsprechende Bild eines Lagers beziehungsweise einer Heerschar.
    reason: textual_clarification
lexical_decisions:
- source_word: አምላክ ዓለም
  choice: Gott der Ewigkeit
  rationale: Die Konstruktverbindung bezeichnet hier am ehesten Gott als den ewig bestehenden Gott. Die formal möglichen Bedeutungen „Gott der Welt“ und „Gott des Zeitalters“ bleiben in einer Fußnote sichtbar.
- source_word: እምህየ
  choice: von dort her
  rationale: Die deiktische Wendung verweist auf den zuvor genannten Aufenthaltsort zurück und bezeichnet die Bewegung von dort weg.
- source_word: ይከይድ
  choice: wird … treten
  rationale: „Treten“ bewahrt die gewichtige Bildsprache der Theophanie am Sinai; das Verb kann allgemeiner auch „gehen“ oder „heranziehen“ bedeuten.
- source_word: ሲና ደብር
  choice: Berg Sinai
  rationale: Dies ist die geläufige deutsche Form des Eigennamens mit der Bezeichnung „Berg“.
- source_word: ያስተርኢ
  choice: wird … erscheinen
  rationale: Das Verb kann „sichtbar werden“, „erscheinen“ oder „sich zeigen“ bedeuten. „Erscheinen“ passt zur göttlichen Offenbarung und bewahrt die zweimalige Wiederholung des Ausgangstextes.
- source_word: በትዕይንቱ
  choice: mit seinem Heer
  rationale: Das Substantiv bezeichnet hier ein Lager beziehungsweise ein Heer. „Mit seinem Heer“ gibt die Begleitung natürlich wieder und stimmt mit der entsprechenden griechischen Lesart „Lager/Heer“ überein.
- source_word: በኃይለ ጽንዑ
  choice: in der Stärke seiner Macht
  rationale: Die emphatische Verbindung zweier Kraftbegriffe wird bewusst beibehalten, ohne sie zu einem einzigen Ausdruck einzuebnen.
- source_word: እምሰማይ
  choice: vom Himmel her
  rationale: Die Form bezeichnet den Himmel als Ausgangspunkt; „her“ macht die gerichtete Bewegung im Deutschen deutlich.
theological_decisions:
- issue: Göttlicher Titel አምላክ ዓለም
  choice: Gott der Ewigkeit
  alternative: Gott der Welt / Gott des Zeitalters
  rationale: Im theophanischen Zusammenhang liegt ein Titel nahe, der Gottes ewiges Bestehen hervorhebt. Da ዓለም jedoch auch „Welt“ oder „Zeitalter“ bedeuten kann, wird diese echte lexikalische Mehrdeutigkeit nicht verschwiegen.
- issue: Begleitung Gottes bei seinem Erscheinen
  choice: mit seinem Heer
  alternative: in seinem Lager
  rationale: Die Wendung bezeichnet ein Lager oder die dort versammelte Heerschar. „Heer“ vermittelt im Deutschen die im Kontext naheliegende himmlische Begleitung, ohne deren Wesen näher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Aussage, dass Gott „erscheinen“ wird, bleibt entsprechend dem ge’ezischen Text erhalten. Die ungewöhnlich kräftige Wendung „in der Stärke seiner Macht“ bewahrt dessen emphatische Ausdrucksweise.
