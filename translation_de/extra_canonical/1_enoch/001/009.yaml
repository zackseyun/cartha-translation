base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/009.yaml
  text: And behold[a], he comes with myriads of holy ones, to execute judgment upon them, and to destroy the wicked[c][b], and to rebuke all flesh for everything that the sinful and wicked have done and spoken against him.
translation:
  language: de
  text: 'Und siehe: Er kommt mit Zehntausenden von Heiligen[a], um über sie Gericht zu halten, die Gottlosen zu vernichten und alles Fleisch[b] wegen all dessen zurechtzuweisen, was die Sünder und Gottlosen gegen ihn getan und gesagt haben.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit Myriaden von Heiligen“. Der ge''ezische Ausdruck bezeichnet eine gewaltige, kaum zählbare Schar und kann eine traditionelle Zahlenformel wiedergeben.'
    reason: lexical_alternative
  - marker: b
    text: „Alles Fleisch“ ist eine traditionelle Wendung für die gesamte Menschheit.
    reason: cultural_note
  - marker: c
    text: Dieser Vers klingt in Judas 14–15 an. Hier wird jedoch der ge'ezische Text selbst wiedergegeben und nicht an die spätere neutestamentliche Formulierung angeglichen.
    reason: cross_reference
lexical_decisions:
- source_word: ወናሁ
  choice: Und siehe
  rationale: Bewahrt den visionären, hinweisenden Charakter des Ausdrucks in einer würdigen, verständlichen Form.
- source_word: መጽአ
  choice: er kommt
  rationale: Das Präsens erhält die unmittelbare prophetisch-apokalyptische Bildhaftigkeit, ohne die Zeitstufe unnötig festzulegen.
- source_word: በትእልፊተ ቅዱሳን
  choice: mit Zehntausenden von Heiligen
  rationale: Gibt die traditionelle Zahlvorstellung einer gewaltigen Schar wieder; „Heilige“ lässt offen, ob ausdrücklich Engel oder andere himmlische Heilige gemeint sind.
- source_word: ይግበር ፍትሐ
  choice: Gericht zu halten
  rationale: Entspricht dem aktiven gerichtlichen Sinn der Wendung und klingt im modernen Deutschen natürlich.
- source_word: ላዕሌሆሙ
  choice: über sie
  rationale: Bewahrt den weiten Bezug des Pronomens, ohne ihn durch eine ausdrücklich feindliche Präposition stärker festzulegen.
- source_word: ይሕጕሎሙ ለረሲዓን
  choice: die Gottlosen zu vernichten
  rationale: Erhält die starke Straf- und Vernichtungsbedeutung des Verbs.
- source_word: ይዘልፍ ኵሎ ዘሥጋ
  choice: alles Fleisch zurechtzuweisen
  rationale: Bewahrt sowohl die konkrete biblische Wendung „alles Fleisch“ als auch den Sinn öffentlicher Rüge beziehungsweise Überführung.
- source_word: ኵሉ ዘገብሩ ወረሰዩ
  choice: all dessen, was ... getan und gesagt haben
  rationale: Folgt der revidierten Deutung der parallelen Verben als Handeln und Reden und erhält beide Anklagepunkte.
- source_word: ኃጥኣን ወረሲዓን
  choice: die Sünder und Gottlosen
  rationale: Gibt beide moralischen Bezeichnungen gesondert wieder und bewahrt so die emphatische Doppelung.
- source_word: ላዕሌሁ
  choice: gegen ihn
  rationale: Das maskuline Singularpronomen wird auf die kommende Richtergestalt bezogen, ohne deren Identität durch einen eingefügten Titel zu bestimmen.
theological_decisions:
- issue: Identität der kommenden Gestalt
  choice: Das Subjekt bleibt schlicht „er“.
  alternative: „der Herr“ oder „Gott“
  rationale: Der gegebene ge'ezische Wortlaut enthält nur ein implizites Subjekt der dritten Person. Ein göttlicher Bezug liegt im Kontext nahe, doch ein Titel soll nicht in den Text eingefügt werden.
- issue: Bedeutung der Heiligen
  choice: „Heilige“
  alternative: „Engel“ oder „heilige Menschen“
  rationale: Der apokalyptische Zusammenhang legt ein himmlisches Gefolge nahe, bestimmt dessen Angehörige im vorliegenden Wortlaut jedoch nicht ausdrücklich als Engel.
- issue: Umfang von „alles Fleisch“
  choice: Die konkrete Wendung bleibt im Haupttext stehen.
  alternative: „alle Menschen“
  rationale: „Alles Fleisch“ bewahrt das traditionelle universale Menschenbild des Ausgangstextes; eine Fußnote erläutert die Bedeutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener apokalyptischer Bildsprache. Die Formulierungen vermeiden konfessionelle Zusätze; „er“, „Heilige“ und „alles Fleisch“ bewahren die Offenheit beziehungsweise Konkretheit des Ausgangstextes.
