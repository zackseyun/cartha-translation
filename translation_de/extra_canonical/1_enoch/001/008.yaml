base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/008.yaml
  text: And he will make peace for the righteous[a], and he will guard the chosen ones; and favor will be upon them, and they will all be God's, and they will prosper and be blessed[c][b], and the light of God will shine upon them.
translation:
  language: de
  text: Und er wird den Gerechten Frieden schenken[a] und die Erwählten behüten. Wohlwollen wird auf ihnen ruhen, und sie alle werden Gott gehören. Es wird ihnen gut gehen[b], und sie werden gesegnet sein, und das Licht Gottes wird über ihnen leuchten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Versanfang ist in der überlieferten Textgestalt unsicher beziehungsweise schwerfällig; klar ist jedoch die Aussage, dass Gottes Friedenshandeln den Gerechten gilt.
    reason: textual_variant
  - marker: b
    text: Das mit „es wird ihnen gut gehen“ wiedergegebene Verb kann auch „gedeihen“ oder „Erfolg haben“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰላመ ይገብር
  choice: Frieden schenken
  rationale: Die Wendung beschreibt, dass Gott Frieden für die Gerechten schafft beziehungsweise ihnen gewährt. „Frieden schenken“ ist im Deutschen natürlich und vermeidet die bei „Frieden schließen“ entstehende Vorstellung vorausgehender Feindschaft.
- source_word: የዓቅቦሙ
  choice: behüten
  rationale: „Behüten“ gibt den schützenden Sinn wieder und wahrt den gehobenen, biblischen Ton, ohne bloßes Aufbewahren anzudeuten.
- source_word: ሕሩያን
  choice: die Erwählten
  rationale: Die Bezeichnung bleibt neben „den Gerechten“ als eigener Ausdruck erhalten und vermeidet, beide Gruppenbezeichnungen vorschnell zusammenzuziehen.
- source_word: ሣህል
  choice: Wohlwollen
  rationale: Das Wort bezeichnet hier eine ihnen zugewandte Güte. „Wohlwollen“ passt zu der Aussage, dass es auf ihnen ruht, ohne den Begriff enger als „Gnade“ oder „Erbarmen“ festzulegen.
- source_word: ዘአምላክ
  choice: Gott gehören
  rationale: Die Genitivkonstruktion drückt am ehesten Zugehörigkeit aus. Die Formulierung bleibt idiomatisch und fügt weder „Volk“ noch eine bloße moralische Eigenschaft hinzu.
- source_word: ይሴርሑ
  choice: es wird ihnen gut gehen
  rationale: Die Wiedergabe wahrt den allgemeinen Sinn von Wohlergehen oder Gedeihen, ohne ihn einseitig auf materiellen Wohlstand zu verengen.
- source_word: ይትባረኩ
  choice: gesegnet sein
  rationale: Die passive Form und der formelhafte Segensklang werden unmittelbar wiedergegeben.
- source_word: ይበርህ ሎሙ ብርሃነ አምላክ
  choice: das Licht Gottes wird über ihnen leuchten
  rationale: Die Formulierung bewahrt das apokalyptische Bild göttlichen Lichtes und gibt die relationale Wendung natürlich wieder.
theological_decisions:
- issue: Bezeichnungen der treuen Gruppe
  choice: „die Gerechten“ und „die Erwählten“ als zwei parallele Bezeichnungen bewahren
  alternative: Beide Ausdrücke zu einer einzigen Gruppenbezeichnung zusammenziehen
  rationale: Der Text verwendet beide Titel nacheinander. Ihre Unterscheidung erhält die theologische Textur des Verses, ohne zu behaupten, es handle sich zwingend um verschiedene Gruppen.
- issue: Bedeutung von ዘአምላክ
  choice: „sie alle werden Gott gehören“
  alternative: „sie alle werden gottesfürchtig sein“ oder „sie alle werden Gottes Volk sein“
  rationale: Die Wendung bezeichnet am natürlichsten Zugehörigkeit. Die Alternativen würden entweder die Aussage moralisieren oder ein im Ausgangstext nicht genanntes Substantiv ergänzen.
- issue: Gottes Friedenshandeln gegenüber den Gerechten
  choice: „den Gerechten Frieden schenken“
  alternative: „mit den Gerechten Frieden schließen“
  rationale: Die Präposition weist auf Frieden für beziehungsweise an die Gerechten. Eine Versöhnung nach vorausgehender Feindschaft wird nicht ausgesagt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Bibelstil. Die Sätze sind leicht gegliedert; traditionsbeladene Ausdrücke werden dort beibehalten, wo sie zentrale Bezeichnungen oder Bilder des Textes tragen.
