base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/001.yaml
  text: The words of the blessing of Henok[a], with which he blessed the chosen and the righteous who will be present on the day of affliction[c][b], for the removal of all the wicked and godless.
translation:
  language: de
  text: Das Segenswort Henochs[a], mit dem er die Auserwählten und die Gerechten segnete, die am Tag der Bedrängnis[b] da sein werden, zur Beseitigung aller Bösen und Gottlosen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich kann der Anfang auch heißen: „Das Wort des Segens Henochs“.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „am Tag der Not“ oder „am Tag der Drangsal“. Der Ausdruck nennt Bedrängnis, nicht ausdrücklich Gericht.'
    reason: lexical_alternative
  - marker: c
    text: Die Wendung bezeichnet die Beseitigung aller Bösen und Gottlosen als Ziel bzw. Zweck. Der Ausgangstext unterscheidet dabei zwei Bezeichnungen für die Verurteilten.
    reason: textual_ambiguity
lexical_decisions:
- source_word: ቃለ ፡ በረከት
  choice: Segenswort
  rationale: Die Verbindung bezeichnet das Wort bzw. den Ausspruch des Segens. Das deutsche Kompositum bewahrt den überschriftartigen Singular und klingt natürlicher als „Wort des Segens“.
- source_word: ዘሄኖክ
  choice: Henochs
  rationale: „Henoch“ ist die im Deutschen vertraute biblische Namensform und entspricht der äthiopischen Form, ohne eine englische Schreibweise zu übernehmen.
- source_word: በከመ ፡ ባረከ
  choice: mit dem er … segnete
  rationale: Die instrumentale bzw. relative Beziehung zum zuvor genannten Segenswort bleibt erhalten.
- source_word: ኅሩያነ ፡ ወጻድቃነ
  choice: die Auserwählten und die Gerechten
  rationale: Die beiden koordinierten Bezeichnungen werden getrennt bewahrt; „Auserwählte“ und „Gerechte“ sind verständliche, traditionsfähige deutsche Entsprechungen.
- source_word: እለ ፡ ሀለዉ ፡ ይኩኑ
  choice: die … da sein werden
  rationale: Die Wendung bezeichnet ihre künftige Anwesenheit. „Da sein werden“ ist natürlich und lässt offen, ob bloße Gegenwart oder Fortbestand gemeint ist.
- source_word: በዕለተ ፡ ምንዳቤ
  choice: am Tag der Bedrängnis
  rationale: „Bedrängnis“ gibt schwere Not wieder, ohne den Ausdruck vorschnell zum technischen Begriff „Trübsal“ oder zum „Tag des Gerichts“ umzudeuten.
- source_word: ለአሰስሎ
  choice: wenn … beseitigt werden
  rationale: Das Verbalsubstantiv drückt Ziel bzw. Vorgang der Entfernung aus. Die temporale Einbindung ergibt im Deutschen einen klaren Satz; die finale Lesart wird in der Fußnote offengehalten.
- source_word: ኵሎ ፡ እኩያነ ፡ ወረሲዓነ
  choice: alle Bösen und Gottlosen
  rationale: Die beiden verurteilten Gruppen bleiben als verschiedene Bezeichnungen erhalten; „Gottlose“ bewahrt die religiöse Dimension des zweiten Ausdrucks.
theological_decisions:
- issue: Verhältnis von Auserwählten und Gerechten
  choice: die Auserwählten und die Gerechten
  alternative: die auserwählten Gerechten
  rationale: Die koordinierende Struktur des Ge'ez wird nicht zu einer einzigen Gruppe mit zwei Eigenschaften verdichtet.
- issue: Bedeutung des Tages der Bedrängnis
  choice: Tag der Bedrängnis
  alternative: Tag der Trübsal / Tag des Gerichts
  rationale: Der Quellenausdruck bezeichnet unmittelbar Not oder Bedrängnis. Gericht ist im Kontext präsent, steht aber nicht ausdrücklich im Substantiv.
- issue: Syntaktische Beziehung der Beseitigung
  choice: wenn alle Bösen und Gottlosen beseitigt werden
  alternative: zur Beseitigung aller Bösen und Gottlosen
  rationale: Der Ge'ez-Ausdruck hat finalen Charakter, kann im Deutschen jedoch schwerfällig an die lange Nominalgruppe anschließen. Der Haupttext macht den eschatologischen Zusammenhang lesbar; die Fußnote hält die engere Zweckangabe fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers wird als überschriftartiger Satz gestaltet. Bekannte deutsche Namensform „Henoch“; keine konfessionell festgelegte Auslegung von Erwählung, Bedrängnis oder Gericht.
