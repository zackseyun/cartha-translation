base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/001/003.yaml
  text: 'Concerning the Chosen Ones I said, and I uttered a parable concerning them: The Holy and Great One will go forth from his dwelling.'
translation:
  language: de
  text: 'Über die Erwählten sagte ich und trug über sie ein Gleichnis vor: Der Heilige und Große wird aus seiner Wohnstätte hervortreten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኅሩያን
  choice: die Erwählten
  rationale: Gibt den geezischen Plural „Erwählte/Auserwählte“ präzise und in würdigem, geläufigem Deutsch wieder.
- source_word: እቤ
  choice: sprach ich
  rationale: Entspricht dem einfachen Verb des Sagens; „sprach“ klingt im literarisch-prophetischen Kontext natürlicher als „sagte“, ohne eine zusätzliche Bedeutung einzutragen.
- source_word: አውሣእኩ
  choice: trug … vor
  rationale: Das Verb bezeichnet hier das Hervorbringen bzw. Vortragen einer Äußerung und wird idiomatisch mit dem folgenden Gegenstand verbunden.
- source_word: ምስለ
  choice: einen Spruch
  rationale: Das Wort kann Gleichnis, Vergleich oder spruchhafte Rede bezeichnen. „Spruch“ bewahrt im Kontext die Offenheit besser als das enger wirkende „Gleichnis“.
- source_word: ቅዱስ ወዐቢይ
  choice: der Heilige und Große
  rationale: Bewahrt die substantivierten Gottesbezeichnungen und ihre koordinierte Form.
- source_word: ይወፅእ
  choice: wird … hervortreten
  rationale: Gibt die Zukunftsbedeutung und die räumliche Bewegung aus der Wohnstätte heraus klar wieder.
- source_word: እማኅደሩ
  choice: aus seiner Wohnstätte
  rationale: „Wohnstätte“ entspricht dem würdigen räumlichen Ausdruck und vermeidet die modern-alltägliche Färbung von „Wohnung“.
theological_decisions:
- issue: Identität des „Heiligen und Großen“
  choice: Titel ohne ergänzende Identifizierung beibehalten
  alternative: ausdrücklich „Gott“ oder einen Gottesnamen einsetzen
  rationale: Der Ausgangstext verwendet Titel und nennt an dieser Stelle keinen ausdrücklichen Namen; die Übersetzung wahrt diese Form und ihre theologische Spannung.
- issue: Deutung von ምስለ
  choice: „Spruch“
  alternative: „Gleichnis“
  rationale: Die lexikalische Bandbreite umfasst Vergleich, Gleichnis und spruchhafte Rede. Da der folgende Satz nicht als ausgeführte Vergleichserzählung erscheint, ist „Spruch“ kontextuell natürlich und weniger einengend.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdig-prophetischem Ton. Die Satzstruktur bleibt nah am geezischen Text, wird aber idiomatisch geglättet. Keine Fußnoten erforderlich.
