  - severity: low
    issue: „sprach ich“ statt „sagte ich“
    rationale: „Sprach“ ist stilistisch möglich, trägt aber einen zusätzlichen gehobenen bzw. archaisierenden Ton. Das einfache geezische Sagen-Verb und die englische Audit-Fassung werden mit „sagte ich“ unmittelbarer wiedergegeben.
