  source_fidelity: 'Die Grundstruktur und die Titel „der Heilige und Große“ sowie „aus seiner Wohnstätte hervortreten“ geben den geezischen Text sachgerecht wieder. Für ምስለ ist jedoch „Gleichnis“ gegenüber „Spruch“ vorzuziehen: Die maßgebliche englische Audit-Fassung übersetzt ausdrücklich „a parable“, und „Spruch“ schwächt bzw. verändert die Bildrede-/Gleichnisnuance unnötig.'
