base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/002.yaml
  text: And all the luminaries shall be shaken with great fear[b][a], and the whole earth shall be shaken and tremble and quake.
translation:
  language: de
  text: Und alle Himmelslichter[a] werden in großer Furcht erschüttert werden; und die ganze Erde wird erschüttert werden, zittern und in Schrecken geraten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Lichter“; möglich ist auch „leuchtende Wesen“. Im Zusammenhang sind wahrscheinlich die Himmelskörper gemeint.
    reason: lexical_alternative
  - marker: b
    text: Die vorliegende ge'ezische Transkription des Schlussverbs ist offenbar beschädigt. Die wahrscheinlich zugrunde liegende Lesung bedeutet „erschrecken“ oder „in Entsetzen geraten“; bei einer rein körperlichen Deutung wäre auch „beben“ denkbar.
    reason: textual_uncertainty
lexical_decisions:
- source_word: ኵሎሙ ብርሃናት
  choice: alle Himmelslichter
  rationale: ብርሃናት bezeichnet Lichter beziehungsweise leuchtende Körper. Im kosmischen Gerichtsszenario gibt „Himmelslichter“ den wahrscheinlich astronomischen Bezug natürlich wieder, ohne die allgemeinere Bedeutung ganz zu verdecken.
- source_word: ይትመሀከዉ / ትትመሀከው
  choice: werden erschüttert werden
  rationale: Die Wiederholung desselben Verbs für die Himmelslichter und die Erde wird bewahrt. „Erschüttert werden“ kann sowohl kosmische Bewegung als auch tiefes Erschrecken anklingen lassen.
- source_word: በፍርሀት ዐቢይ
  choice: in großer Furcht
  rationale: Die Präpositionalphrase bezeichnet den begleitenden Zustand oder die Art der Erschütterung. „In großer Furcht“ bewahrt die affektive Aussage und bleibt nah an der ge'ezischen Formulierung.
- source_word: ኵላ ምድር
  choice: die ganze Erde
  rationale: Der Zusammenhang einer umfassenden kosmischen Erschütterung spricht für „Erde“ und nicht für das örtlich begrenzte „Land“.
- source_word: ትርዕድ
  choice: zittern
  rationale: Ein vom vorherigen „erschüttert werden“ unterschiedener Ausdruck erhält die Steigerung der Bewegungs- und Erschütterungsbilder.
- source_word: ወትኜጕድ (wahrscheinlich fehlerhafte Transkription für ወትደነግፅ)
  choice: und in Schrecken geraten
  rationale: Die vorliegende Zeichenfolge ist wahrscheinlich durch OCR beziehungsweise Transkription entstellt. Die erschließbare Lesung mit ደነገጸ bezeichnet Erschrecken oder Entsetzen und stellt die Furcht der personifizierten Erde der Furcht der Himmelslichter parallel.
theological_decisions:
- issue: Bezeichnet ብርሃናት Himmelskörper oder engelhafte Wesen?
  choice: Himmelslichter
  alternative: Lichter oder leuchtende Wesen
  rationale: Die Verbindung mit der ganzen Erde und das Motiv kosmischer Erschütterung sprechen eher für Himmelskörper. Die Fußnote hält die weiter gefasste lexikalische Möglichkeit offen, ohne eine angelologische Deutung in den Text einzutragen.
- issue: Ist das Schlussverb als körperliches Beben oder als Erschrecken zu verstehen?
  choice: in Schrecken geraten
  alternative: beben
  rationale: Die wahrscheinlich wiederherzustellende ge'ezische Verbform bezeichnet Entsetzen beziehungsweise Erschrecken. Damit bleibt die personifizierende Spannung erhalten, statt das Schlussglied an die vorherigen Bewegungsverben anzugleichen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau und die Steigerung der apokalyptischen Erschütterung werden bewahrt; das Futurpassiv ist bewusst formal, aber noch allgemein verständlich.
