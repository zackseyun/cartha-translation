base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/006.yaml
  text: And when you die[a], the sinners will say concerning you[b],
translation:
  language: de
  text: 'Und wenn ihr sterbt, werden die Sünder über euch[a] sagen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: gegen euch reden. Die Präposition bedeutet wörtlich „auf/über“; hier bezeichnet sie wahrscheinlich, worüber gesprochen wird, kann im Zusammenhang aber auch feindselige Rede anklingen lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሶበ
  choice: Und wenn
  rationale: Die Konjunktion mit vorangestelltem waw leitet einen zeitlichen Umstand ein; ein starker Gegensatz ist hier nicht angezeigt.
- source_word: ትመውቱ
  choice: ihr sterbt
  rationale: Die Verbform steht in der zweiten Person Plural und bezeichnet das Sterben. Im deutschen Temporalsatz ist das Präsens idiomatisch.
- source_word: ይብሉ
  choice: werden … sagen
  rationale: Das gewöhnliche Verb für „sagen“ dient hier als Einleitung der nachfolgenden Äußerung; „sagen“ bewahrt diese quotative Funktion besser als „reden“.
- source_word: ላዕሌክሙ
  choice: über euch
  rationale: Die Präposition bedeutet grundlegend „auf/über“ und bezeichnet hier wahrscheinlich das Thema der Äußerung. Die Wiedergabe lässt die im Kontext mögliche feindselige Färbung offen.
- source_word: ኃጥኣን
  choice: die Sünder
  rationale: Der Ausdruck bezeichnet in diesem apokalyptischen Zusammenhang die moralisch bestimmte Gruppe der Sünder und steht als Subjekt des Sagens.
theological_decisions:
- issue: Bedeutung der Rede der Sünder
  choice: über euch sagen
  alternative: gegen euch reden
  rationale: Der Kontext kann eine feindselige Äußerung nahelegen, doch die geezische Präposition bezeichnet nicht eindeutig Gegnerschaft. Zudem führt das Verb wahrscheinlich eine folgende direkte Rede ein. Daher wird die Spannung nicht zugunsten einer ausdrücklich feindlichen Deutung aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede im Plural. Der Doppelpunkt macht die Funktion als Einleitung der nachfolgenden Rede deutlich; der Vers bleibt bewusst syntaktisch offen.
