base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/001.yaml
  text: In those days[a], if a fierce fire descends upon you, where will you flee, and where will you be delivered? And when he lifts up his voice against you[d][c][b], will you not be shaken and fear?
translation:
  language: de
  text: '**1 Henoch 102,1**


    In jenen Tagen: Wenn ein furchtbares Feuer[a] auf euch herabkommt, wohin werdet ihr fliehen, und wo werdet ihr gerettet werden? Und wenn er seine Stimme gegen euch erhebt[b], werdet ihr dann nicht erschüttert werden und euch fürchten?[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „Feuer“ verbundene Adjektiv kann „außerordentlich“, „staunenerregend“ oder „schrecklich“ bedeuten; hier ist wahrscheinlich ein zerstörerisches und ehrfurchtgebietendes Feuer gemeint.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier ein Ausdruck für das Erheben beziehungsweise Erschallenlassen „seiner Stimme“. Das Wort für „Stimme“ kann auch „Wort“ bedeuten und im Gerichtszusammenhang den Klang eines Urteilsspruchs annehmen.
    reason: lexical_alternative
  - marker: c
    text: 'Die Frage ist rhetorisch: Gemeint ist, dass sie gewiss erschüttert werden und sich fürchten.'
    reason: cultural_note
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: In jenen Tagen
  rationale: Bewahrt die wiederkehrende apokalyptische Zeitformel in einem würdigen, zugleich geläufigen Deutsch.
- source_word: ለእመ ወረደ ዴቤክሙ
  choice: Wenn … auf euch herabkommt
  rationale: Gibt die Bedingung sowie die Bewegung von oben und den Bezug auf die Angeredeten unmittelbar wieder.
- source_word: ዕፁብ እሳት
  choice: ein furchtbares Feuer
  rationale: Das Adjektiv bezeichnet etwas Außerordentliches, Staunenerregendes oder Schreckliches. Im Gerichtszusammenhang vermittelt „furchtbar“ die bedrohliche, ehrfurchtgebietende Wirkung, ohne die Bedeutungsbreite im Text vollständig festzulegen.
- source_word: በአይቴ ትነፍፁ
  choice: wohin werdet ihr fliehen
  rationale: Natürliches Deutsch, das die örtliche Frage und die rhetorische Dringlichkeit des Fluchtverbs bewahrt.
- source_word: በአይቴ ትድኅኑ
  choice: wo werdet ihr gerettet werden
  rationale: Gibt das Bedeutungsfeld von Rettung und Befreiung wieder. Das Passiv wahrt die Offenheit darüber, wer die Rettung bewirken könnte.
- source_word: ይወዲ ቃሎ
  choice: er seine Stimme … erhebt
  rationale: Die aktive Verbform und das Suffix der dritten Person Singular werden wiedergegeben. Die Verbindung entspricht dem Idiom, die Stimme zu erheben beziehungsweise erschallen zu lassen.
- source_word: ዴቤክሙ
  choice: gegen euch
  rationale: Im Zusammenhang der drohenden Stimme trägt die Präposition adversative Kraft.
- source_word: አኮ ትትመሀከዉ ወትፈርሁ
  choice: werdet ihr dann nicht erschüttert werden und euch fürchten?
  rationale: Erhält die negative rhetorische Frage und verbindet innere Erschütterung mit Furcht, ohne die Aussage in einen bloßen Aussagesatz umzuwandeln.
theological_decisions:
- issue: Ob ቃሎ als „seine Stimme“ oder als „sein Wort“ wiederzugeben ist
  choice: „seine Stimme“ im Haupttext
  alternative: „sein Wort“ beziehungsweise „seinen Urteilsspruch“
  rationale: Das Suffix verlangt „seine“, und die Verbindung mit dem aktiven Verb ist idiomatisch als Erheben oder Erschallenlassen der Stimme zu verstehen. Die Fußnote hält die lexikalische Bedeutung „Wort“ und eine mögliche gerichtliche Färbung sichtbar, ohne einen ausdrücklichen Urteilsspruch in den Haupttext einzutragen.
- issue: Rhetorische Kraft der abschließenden Frage
  choice: Die negative Frage bleibt als Frage erhalten
  alternative: 'Aussagesatz: „Dann werdet ihr gewiss erschüttert werden und euch fürchten.“'
  rationale: Die Frageform gehört zur Warnung des Textes. Ihre erwartete bejahende Antwort wird in einer Fußnote erläutert, statt die Spannung im Haupttext aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit apokalyptischer Eindringlichkeit. Die Satzstruktur bleibt eng am ge’ezischen Gedankengang, wird aber durch „wird es so sein“ und „dann“ für heutige Leser flüssig verbunden. Keine konfessionell geprägte Terminologie wurde ergänzt.
