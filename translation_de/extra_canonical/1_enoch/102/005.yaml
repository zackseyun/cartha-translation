base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/005.yaml
  text: And do not grieve if your soul has gone down into Sheol in sorrow[a], and your flesh did not fare according to your goodness during your life; but wait for the day of the judgment of sinners[c][b], and for the day of curse and punishment.
translation:
  language: de
  text: Und seid nicht traurig, wenn eure Seele in Kummer in den Scheol hinabgestiegen ist[a] und es eurem Fleisch zu euren Lebzeiten nicht entsprechend eurer Güte ergangen ist.[b] Wartet vielmehr auf den Tag des Gerichts über die Sünder und auf den Tag des Fluches und der Strafe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der »Scheol« ist in jüdisch-apokalyptischer Vorstellung das Totenreich; der Ausdruck ist nicht ohne Weiteres mit der späteren christlichen Vorstellung von der Hölle gleichzusetzen.
    reason: cultural_note
  - marker: b
    text: 'Wörtlicher etwa: »und euer Fleisch empfing zu euren Lebzeiten nicht entsprechend eurer Güte«. Im Ge’ez bleibt unausgesprochen, was das Fleisch nicht empfing; wahrscheinlich ist der im irdischen Leben ausgebliebene angemessene Ausgleich gemeint.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አት ኅዘኑ
  choice: seid nicht traurig
  rationale: Gibt den negativen Imperativ an die Angeredeten in natürlichem, heutigem Deutsch wieder und bewahrt den emotionalen Zusammenhang mit dem folgenden »in Kummer«.
- source_word: ወረደት ነፍስክሙ ውስተ ሲኦል
  choice: eure Seele in den Scheol hinabgestiegen ist
  rationale: »Hinabgestiegen« bewahrt die ausdrückliche Abwärtsbewegung; »Scheol« erhält die jüdisch-apokalyptische Vorstellung vom Totenreich, ohne sie mit »Hölle« gleichzusetzen.
- source_word: በሐዘን
  choice: in Kummer
  rationale: Bewahrt die emotionale Färbung und vermeidet im Deutschen eine schwerfällige unmittelbare Wiederholung von »traurig/Trauer«.
- source_word: ኢረከበ ሥጋክሙ በሕይወትክሙ
  choice: es eurem Fleisch zu euren Lebzeiten nicht … ergangen ist
  rationale: Das Verb »empfangen/erlangen« steht ohne genanntes Objekt. Die idiomatische Wendung mit »ergehen« lässt den fehlenden Ausgleich erkennen, ohne im Haupttext ausdrücklich einen »Lohn« zu ergänzen.
- source_word: በከመ ኂሩትክሙ
  choice: entsprechend eurer Güte
  rationale: Hält die Aussage offen zwischen sittlicher Güte, gutem Verhalten und dem, was dieser Güte angemessen gewesen wäre.
- source_word: አላ ጽንሑ
  choice: Wartet vielmehr
  rationale: Der Gegensatz lenkt vom gegenwärtigen Leid auf den künftigen Gerichtstag. »Wartet« passt zur folgenden Zeitangabe und kann zugleich standhaftes Ausharren einschließen.
- source_word: ለዕለተ እንተ ኵነኔ ኃጥኣን
  choice: auf den Tag des Gerichts über die Sünder
  rationale: Bewahrt die feierliche apokalyptische Gerichtsformel und bezeichnet die Sünder ausdrücklich als die vom Gericht Betroffenen.
- source_word: መርገም ወመቅሠፍት
  choice: Fluches und der Strafe
  rationale: Gibt das Begriffspaar knapp und gerichtlich gefärbt wieder, ohne eine bestimmte Form der Bestrafung festzulegen.
theological_decisions:
- issue: Wiedergabe von ሲኦል
  choice: Scheol
  alternative: Totenreich; Grab; Hölle
  rationale: »Scheol« bewahrt die im Text vorausgesetzte jüdische Vorstellung vom Bereich der Toten. »Hölle« würde leicht spätere christliche Vorstellungen eintragen, während »Grab« die kosmologische Bildsprache verengen könnte.
- issue: Die Aussage, dass das Fleisch nicht empfangen hat
  choice: es ist dem Fleisch im irdischen Leben nicht entsprechend der Güte der Angeredeten ergangen
  alternative: das Fleisch hat keinen Lohn empfangen; der Leib hat das Leben nicht wiedererlangt
  rationale: Der Zusammenhang stellt das gegenwärtig ausbleibende angemessene Ergehen dem künftigen Gericht gegenüber. Da das Objekt von »empfangen/erlangen« im Ge’ez unausgesprochen bleibt, wird im Haupttext weder »Lohn« noch eine andere konkrete Gabe ergänzt.
- issue: Bezug des Gerichts
  choice: Gericht über die Sünder
  alternative: Gericht der Sünder
  rationale: Die Formulierung versteht die Sünder als Gegenstand des Gerichts, lässt aber dessen konkrete Ausgestaltung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede im Plural sowie die apokalyptischen Leitbegriffe »Scheol«, »Gericht«, »Fluch« und »Strafe« bleiben deutlich. Die schwer wörtlich wiederzugebende objektlose Verwendung von »empfangen/erlangen« wird im Haupttext idiomatisch formuliert und in der Fußnote transparent gemacht.
