base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/003.yaml
  text: And all the angels will carry out their commands[a], and they will seek to hide themselves from before the Great Glory; and the children of the earth will tremble and be thrown into confusion. But you sinners are accursed forever[d][c][b], and there will be no peace for you.
translation:
  language: de
  text: Und alle Engel werden ihren Befehl ausführen. Sie werden sich vor der Großen Herrlichkeit[a] zu verbergen suchen; die Kinder der Erde[b] werden zittern und in Verwirrung geraten. Ihr aber, ihr Sünder, seid für immer verflucht, und für euch wird es keinen Frieden geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht eine semitisch geprägte Wendung: „von vor der Großen Herrlichkeit“, das heißt: aus ihrer Gegenwart fort.'
    reason: lexical_alternative
  - marker: b
    text: „Kinder der Erde“ ist eine wörtliche Bezeichnung für die Bewohner der Erde, besonders für die Menschheit angesichts des Gerichts.
    reason: lexical_alternative
lexical_decisions:
- source_word: መላእክት
  choice: Engel
  rationale: Im apokalyptischen Zusammenhang sind himmlische Wesen gemeint; „Engel“ gibt dies im Deutschen unmittelbar wieder.
- source_word: ይፌጽሙ ትእዛዞሙ
  choice: werden ihren Befehl ausführen
  rationale: 'Das Verb bezeichnet das Vollziehen oder Ausführen. ትእዛዞሙ ist am wahrscheinlichsten als Singular mit Possessivsuffix zu verstehen: „ihren Befehl“.'
- source_word: ይፈቅዱ ከመ ይትኀብኡ
  choice: werden sich … zu verbergen suchen
  rationale: Die Verbindung aus Wollen/Beabsichtigen und dem folgenden Verb drückt hier das Bestreben aus, sich selbst zu verbergen.
- source_word: እምቅድመ ዐቢይ ስብሐት
  choice: vor der Großen Herrlichkeit
  rationale: Die semitische Wendung „von vor“ bezeichnet das Zurückweichen aus einer Gegenwart. „Große Herrlichkeit“ bewahrt die ehrfurchtsvolle göttliche Umschreibung als Titel, ohne sie ausdrücklich durch „Gott“ zu ersetzen.
- source_word: ደቂቀ ምድር
  choice: die Kinder der Erde
  rationale: Die wörtliche, für apokalyptische Sprache charakteristische Bezeichnung bleibt erhalten; gemeint sind die Menschen beziehungsweise Bewohner der Erde.
- source_word: ይርዕዱ ወይትሀወኩ
  choice: werden zittern und in Verwirrung geraten
  rationale: Die beiden Verben schildern körperliche Furcht und anschließende Bestürzung oder Unordnung.
- source_word: ርጉማን ለዓለም
  choice: für immer verflucht
  rationale: Die knappe Formulierung bewahrt den feierlich-endgültigen Charakter des Gerichtswortes.
- source_word: ወአልብክሙ ሰላመ
  choice: für euch wird es keinen Frieden geben
  rationale: Diese natürliche deutsche Zukunftsform gibt die an die Sünder gerichtete Verneinung unverändert wieder.
theological_decisions:
- issue: Bezug der „Großen Herrlichkeit“
  choice: Ehrfurchtsvolle göttliche Titulatur beziehungsweise Umschreibung der göttlichen Gegenwart
  alternative: Allgemeiner himmlischer Glanz oder die Herrlichkeit des himmlischen Hofes
  rationale: Im Henochbuch kann die Wendung die überwältigende Gegenwart Gottes bezeichnen. Da der Vers Gott jedoch nicht ausdrücklich nennt, wird die Umschreibung beibehalten und nicht aufgelöst.
- issue: Numerus von ትእዛዞሙ
  choice: 'Singular: „ihren Befehl“'
  alternative: 'Plural: „ihre Befehle“'
  rationale: Die Form lässt sich morphologisch als singularisches ትእዛዝ mit dem Suffix der 3. Person Plural verstehen; auch die angeführte griechische Parallele τὸ πρόσταγμα ist singularisch. Die Formulierung legt nicht fest, von wem der Befehl erteilt wurde.
translation_notes:
  register: Moderne, würdige Standardsprache mit leicht apokalyptischem Klang. Die Sätze wurden maßvoll gegliedert, die direkte Anrede „Ihr aber, ihr Sünder“ bewahrt den scharfen Kontrast. Die Großschreibung in „Große Herrlichkeit“ kennzeichnet die Wendung als ehrfurchtsvolle Titulatur.
