base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/102/004.yaml
  text: Do not fear[a], you souls of the righteous, and hope, you who have died in righteousness.
translation:
  language: de
  text: 'Ihr Seelen[a] der Gerechten, die ihr in Gerechtigkeit gestorben seid: Fürchtet euch nicht und hofft!'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Geister der Gerechten«. Das ge''ezische Wort kann je nach Zusammenhang Seele, Leben, Selbst oder Geist bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አትፍርሁ
  choice: Fürchtet euch nicht
  rationale: Der negative Imperativ im Plural wird als direkte, würdige Aufforderung wiedergegeben; die Formulierung ist im heutigen Standarddeutsch verständlich, ohne unnötig archaisch zu wirken.
- source_word: አንትሙ
  choice: ihr
  rationale: Das ausdrücklich gesetzte Pronomen der zweiten Person Plural bleibt in der direkten Anrede erkennbar.
- source_word: ነፍሰ ጻድቃን
  choice: Seelen der Gerechten
  rationale: ነፍስ kann je nach Zusammenhang Seele, Leben, Selbst oder Geist bezeichnen. Im Kontext der Anrede an Verstorbene bewahrt „Seelen“ die anthropologische Offenheit und entspricht der üblichen apokalyptischen Ausdrucksweise.
- source_word: ወተስፈዉ
  choice: und hofft
  rationale: Die knappe Imperativform erhält die Parallelität zur vorausgehenden Aufforderung.
- source_word: እለ ሞትክሙ
  choice: die ihr … gestorben seid
  rationale: Relativpartikel und Verb mit Pluralsuffix werden als Relativsatz zur direkt angeredeten Gruppe wiedergegeben.
- source_word: በጽድቅ
  choice: in Gerechtigkeit
  rationale: Die nominale Wendung bleibt erhalten, sodass der theologisch bedeutsame Begriff „Gerechtigkeit“ sichtbar bleibt und nicht zum Adverb verengt wird.
theological_decisions:
- issue: Anthropologische Bezeichnung der verstorbenen Gerechten
  choice: Seelen der Gerechten
  alternative: Geister der Gerechten
  rationale: „Seelen“ gibt ነፍስ im vorliegenden Zusammenhang angemessen wieder, ohne eine im ge'ezischen Ausdruck nicht ausdrücklich festgelegte technische Unterscheidung zwischen Seele und Geist einzuführen. Die echte lexikalische Alternative wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Umstellung zu einer vorangestellten Anrede mit Relativsatz und anschließendem Doppelpunkt vermeidet eine im Deutschen schwerfällige Wiederholung von „ihr“, während beide Imperative und sämtliche inhaltlichen Bezüge erhalten bleiben.
