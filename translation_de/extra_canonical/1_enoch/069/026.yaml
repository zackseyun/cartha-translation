base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/026.yaml
  text: And there was great joy among them[a], and they blessed and praised and exalted because the name of that Son of Man had been revealed to them.
translation:
  language: de
  text: Und unter ihnen herrschte große Freude, und sie segneten, priesen und erhoben, weil ihnen der Name jenes Menschensohnes[a] offenbart worden war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hier mit »Menschensohn« wiedergegebene ge'ezische Titel ist sprachlich schwierig. Wörtlicher kämen auch »Sohn der Menschheit« oder, weniger wahrscheinlich, »Sohn der Lebenden« infrage; in den Bilderreden dient die Wendung jedoch als feststehender Titel einer erhöhten Gestalt.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወኮኖሙ
  choice: und unter ihnen herrschte
  rationale: Die Form bezeichnet hier idiomatisch das Eintreten beziehungsweise Bestehen eines Zustands bei ihnen; die deutsche Wendung verbindet sich natürlich mit »große Freude«.
- source_word: ፍሥሐ፡ ዓቢይ
  choice: große Freude
  rationale: Die Wortgruppe bezeichnet starke, feierliche Freude und bleibt so zugleich knapp und würdevoll.
- source_word: ባረኩ፡ ወሰብሑ፡ ወአልዐሉ
  choice: priesen, lobten und erhoben ihn
  rationale: Die drei Verben bleiben entsprechend der liturgischen Reihung getrennt. Das im Deutschen nötige Objekt »ihn« wird aus dem Kontext ergänzt, ohne den genannten Grund ihrer Akklamation mit dem Objekt gleichzusetzen.
- source_word: በእንተ፡ ዘተከሥተ፡ ሎሙ
  choice: weil ihnen … offenbart worden war
  rationale: Die Konstruktion gibt den Grund der Freude und des Lobpreises an; das Passiv und die Vorzeitigkeit werden im Deutschen natürlich wiedergegeben.
- source_word: ስሙ
  choice: der Name
  rationale: Der bestimmte Ausdruck hebt die offenbarte Identität beziehungsweise Vollmacht hervor, nicht lediglich eine Benennung.
- source_word: ለውእቱ፡ ወልደ፡ እጓለ፡ እመሕያው
  choice: jenes Menschensohnes
  rationale: Die ungewöhnliche ge'ezische Fügung fungiert in den Bilderreden als Titel. »Menschensohn« wahrt den etablierten apokalyptischen Sprachgebrauch; »jenes« gibt das Demonstrativum wieder.
theological_decisions:
- issue: Wiedergabe der titularen Wendung ወልደ እጓለ እመሕያው
  choice: jenes Menschensohnes
  alternative: jenes Sohnes der Menschheit; jenes Sohnes der Lebenden
  rationale: Die Formulierung ist formal schwierig, fungiert hier aber als bekannter Titel der erhöhten Gestalt. Die Übersetzung wahrt den lokalen henochischen Titelgebrauch, ohne dessen Verhältnis zu späterer neutestamentlicher Sprache dogmatisch festzulegen.
- issue: Ungenanntes Objekt der drei Lobverben
  choice: »ihn« als kontextuell erschlossenes Objekt
  alternative: Die Verben ohne ausdrückliches Objekt wiedergeben oder »den Namen« als Objekt einsetzen
  rationale: Natürliches Deutsch verlangt bei »preisen« und »erheben« gewöhnlich ein Objekt. »Ihn« lässt den Bezug auf die verehrte Gestalt offen genug und vermeidet die nicht ausdrücklich belegte Festlegung, alle drei Verben richteten sich grammatisch auf »den Namen«.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreifache Lobformel bleibt zur Wahrung ihres feierlich-liturgischen Charakters erhalten; die schwierige Titelform wird im Text idiomatisch und in der Fußnote transparent wiedergegeben.
