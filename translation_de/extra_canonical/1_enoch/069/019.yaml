base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/019.yaml
  text: And by that oath the depths were made firm[c][b][a], and they stand and do not move from their place from eternity to eternity.
translation:
  language: de
  text: Und durch jenen Eid wurden die Tiefen gefestigt[a]; sie stehen fest und weichen von ihrem Ort[b] nicht – von Ewigkeit zu Ewigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurden stark gemacht“. Das ge’ezische Verb kann ein Festwerden, eine Stärkung oder eine dauerhafte Begründung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Von ihrem Ort“ kann auch „von ihren festen Stellungen“ wiedergegeben werden; damit wären ihre zugewiesenen kosmischen Positionen stärker betont.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወበውእቱ፡ ማሐላ
  choice: Und durch jenen Eid
  rationale: Die Präposition bezeichnet das Mittel, durch das die Festigung geschieht; ማሐላ meint im Kontext den bindenden Eid.
- source_word: ቀላይ
  choice: die Tiefen
  rationale: Das Substantiv bezeichnet die Tiefe beziehungsweise den Abgrund. Der deutsche Plural nimmt die folgenden pluralischen Verben und das pluralische Pronomen auf, ohne das kosmische Bild zu verengen.
- source_word: ፀንዐት
  choice: wurden … gefestigt
  rationale: Das Verb bezeichnet Festwerden, Stärkung oder dauerhafte Begründung. „Gefestigt“ bewahrt den resultativen Sinn und passt zur kosmischen Stabilität.
- source_word: ወቆሙ
  choice: sie stehen fest
  rationale: Wörtlich steht hier „sie standen/stehen“; im Zusammenhang bezeichnet das Verb eine feste, bleibende Stellung. Das deutsche Präsens bringt zusammen mit dem Folgeverb die fortdauernde Wirklichkeit zum Ausdruck.
- source_word: ወኢይትሐወሱ
  choice: und weichen … nicht
  rationale: Das Verb bezeichnet Bewegung, Versetzung oder Abweichung. „Weichen nicht“ klingt im Deutschen natürlich und bewahrt den Gedanken, dass die Tiefen ihre bestimmte Lage nicht verlassen.
- source_word: እመካኖሙ
  choice: von ihrem Ort
  rationale: Die Wendung bezeichnet den ihnen zugewiesenen Platz; „Ort“ bleibt näher am Grundwort und weniger deutend als „Bahn“ oder „Stellung“.
- source_word: እምዓለም፡ ወእስከ፡ ለዓለም
  choice: von Ewigkeit zu Ewigkeit
  rationale: Die Formulierung bildet die Ausgangs- und Zielpräpositionen der ge'ezischen Ewigkeitsformel genauer ab als das idiomatischere „für immer und ewig“.
theological_decisions:
- issue: Bezeichnet der Vers den Eid selbst oder kosmische Tiefen als das Gefestigte?
  choice: Die Tiefen werden durch den Eid gefestigt und bleiben an ihrem Ort.
  alternative: Der Eid selbst ist fest und bleibt bestehen.
  rationale: ቀላይ bezeichnet die Tiefe beziehungsweise den Abgrund, während die folgenden pluralischen Formen und das Possessivsuffix auf kosmische Größen verweisen. Die Übersetzung bewahrt daher die apokalyptische Kosmologie des unmittelbaren Zusammenhangs.
- issue: Zeitlicher Aspekt der Verben
  choice: Die anfängliche Festigung wird im Präteritum, das fortdauernde Stehen und Nichtweichen im Präsens wiedergegeben.
  alternative: Alle Verben könnten als vergangene, abgeschlossene Vorgänge formuliert werden.
  rationale: Das erste Verb ist perfektiv, während das negative Folgeverb eine anhaltende Nichtbewegung ausdrückt. Der Wechsel im Deutschen erhält diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem Rhythmus. Der Gedankenstrich hebt die abschließende Ewigkeitsformel hervor. Die ungewöhnliche Verbindung von zunächst singularischer Kongruenz im Ge’ez und anschließend pluralischen Formen wird durch „die Tiefen“ lesbar gemacht, ohne die kosmische Bildsprache zu erklären oder dogmatisch festzulegen.
