base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/020.yaml
  text: And by that oath the sun and the moon complete their courses[d][c][b][a], and they do not transgress their command forever.
translation:
  language: de
  text: Und durch jenen Eid vollenden Sonne und Mond ihre Bahnen, und sie weichen niemals von der ihnen gegebenen Weisung ab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በውእቱ፡ ማሐላ
  choice: durch jenen Eid
  rationale: Die Präposition bezeichnet hier am natürlichsten das Mittel, durch das die kosmische Ordnung Bestand hat; „Eid“ bewahrt den rechtlich-apokalyptischen Klang.
- source_word: ፀሐይ፡ ወወርኅ
  choice: Sonne und Mond
  rationale: Die bestimmten Himmelskörper erscheinen als handelnde Größen; im Deutschen stehen ihre Namen in dieser Paarform natürlich ohne Artikel.
- source_word: ይፌጽሙ፡ ምሕዋሮሙ
  choice: vollenden … ihre Bahnen
  rationale: Das Verb bezeichnet das Zu-Ende-Führen, das Substantiv die regelmäßigen Bewegungsbahnen der Himmelskörper. Die Wortstellung ist für natürliches Deutsch angepasst.
- source_word: ወኢየሐልፉ፡ እምትእዛዞሙ
  choice: und sie weichen … von der ihnen gegebenen Weisung ab
  rationale: Verb und Präposition ergeben den Sinn „von etwas abweichen“. „Weisung“ erhält den Gedanken einer auferlegten Anordnung, ohne fälschlich nahezulegen, Sonne und Mond erteilten selbst einen Befehl.
- source_word: እምዓለም
  choice: niemals
  rationale: 'In Verbindung mit dem verneinten Verb ist die Wendung idiomatisch als zeitlich uneingeschränkte Verneinung zu verstehen: „niemals“.'
theological_decisions:
- issue: Astronomische Regelmäßigkeit oder Gehorsam gegenüber einer bindenden kosmischen Ordnung
  choice: Eid und Weisung als rechtlich-apokalyptische Begriffe beibehalten
  alternative: 'Neutraler formulieren: „Durch jene Ordnung ziehen Sonne und Mond ihre Kreise und weichen nie davon ab.“'
  rationale: Der ge'ezische Text spricht ausdrücklich von einem Eid und einer Weisung. Die Übersetzung bewahrt diese Spannung zwischen kosmischer Bewegung und personifiziertem Gehorsam, ohne eine spätere konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Jenen“ verweist auf den zuvor genannten Eid. Die Formulierung ist leicht gehoben, bleibt aber allgemein verständlich; die idiomatische Negation „niemals“ folgt der jüngsten quellensprachlichen Beurteilung.
