base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/001.yaml
  text: And after this judgment[a], they will terrify them and oppress them[d][c][b], because they showed this to those who dwell upon the dry land.
translation:
  language: de
  text: Und nach diesem Gericht[a] werden sie sie erschrecken und unterdrücken, weil sie dies denen gezeigt haben, die auf dem trockenen Land wohnen.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach dieser Verurteilung« beziehungsweise »nach diesem Urteil«.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich bezeichnet die Wendung das »trockene Land«; möglicherweise steht es hier im Gegensatz zum Meer oder zu den Wassern und meint nicht einfach nur die Menschheit im Allgemeinen.
    reason: lexical_alternative
  - marker: c
    text: Worauf sich »dies« bezieht, wird in diesem Vers nicht ausdrücklich gesagt; vermutlich verweist es auf das zuvor Offenbarte.
    reason: alternative_reading
lexical_decisions:
- source_word: እምድኅረ ዝ ኵነኔ
  choice: nach diesem Gericht
  rationale: Die Wortgruppe bezeichnet die zeitliche Folge nach einem bestimmten Gericht. Sie ist nicht so zu trennen, dass »das Gericht« zum Subjekt der folgenden Verben würde.
- source_word: ያደነገፅዎሙ
  choice: werden sie sie erschrecken
  rationale: Das Verb drückt das Versetzen in Furcht oder Schrecken aus; die Form enthält ein Subjekt in der 3. Person Plural und ein pluralisches Objekt.
- source_word: ያምዕፅዎሙ
  choice: unterdrücken
  rationale: Das Verb bezeichnet hier Unterdrückung, Gewalttat oder ungerechtes Handeln. »Unterdrücken« gibt den Sinn knapp und natürlich wieder und bewahrt die parallelen pluralischen Bezüge.
- source_word: እስመ
  choice: weil
  rationale: Die Konjunktion leitet die Begründung für die angekündigte Handlung ein.
- source_word: ዘንተ አርአዩ
  choice: sie dies gezeigt haben
  rationale: Die Formulierung bleibt nahe am konkreten Sinn von »zeigen« und lässt den im Vers nicht ausdrücklich bestimmten Bezug von »dies« offen.
- source_word: ለእለ የኀድሩ
  choice: denen, die … wohnen
  rationale: Die partizipiale Bezeichnung der Bewohner wird in verständlichem, zugleich würdigem Deutsch wiedergegeben.
- source_word: ዲበ የብስ
  choice: auf dem trockenen Land
  rationale: Die Wendung bezeichnet konkret das trockene Land, möglicherweise im Gegensatz zu Meer oder Wasser; »Erde« würde dieses Bild einebnen.
theological_decisions:
- issue: Bedeutung von ኵነኔ im apokalyptischen Zusammenhang
  choice: diesem Gericht
  alternative: dieser Verurteilung / diesem Urteil
  rationale: »Gericht« bewahrt den gerichtlichen und apokalyptischen Sinn, ohne genauer festzulegen, ob der Vollzug, das Urteil oder die Verurteilung gemeint ist.
- issue: Nicht genannter Bezug der Pronomen
  choice: Die pluralischen Bezüge mit »sie … sie« und das unbestimmte »dies« bleiben erhalten.
  alternative: Die handelnden und betroffenen Gruppen aus dem Kontext ausdrücklich benennen.
  rationale: Der gegebene Vers selbst nennt die Bezugsgrößen nicht; eine Ergänzung würde die Mehrdeutigkeit unzulässig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die ge’ezische Syntax. Die etwas auffällige Folge »sie sie« ist wegen der ungenannten pluralischen Bezugsgruppen beibehalten; eine explizite Benennung würde mehr festlegen als der Vers selbst.
