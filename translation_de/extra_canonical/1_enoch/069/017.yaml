base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/017.yaml
  text: And the earth was founded upon the waters[a], and from the hidden places of the mountains living waters come forth[e][d][c][b], from the creation of the world and forever.
translation:
  language: de
  text: Und die Erde wurde auf den Wassern gegründet, und aus den verborgenen Orten der Berge kommen lebendige Wasser[a] hervor, seit der Erschaffung der Welt und bis in Ewigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach der vorliegenden Textform: „lebendige Wasser“. Gemeint sein können frische, fließende oder lebenspendende Wasser. Möglicherweise beruht die überlieferte Form jedoch auf einer Buchstabenverwechslung; dann wäre „auserlesene“ oder „vortreffliche Wasser“ zu lesen.'
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: ተሳረረት
  choice: wurde gegründet
  rationale: Das Verb bezeichnet hier das Gründen oder Festsetzen. Die Passivform und das kosmologische Bild werden unmittelbar wiedergegeben.
- source_word: ዲበ ማይ
  choice: auf den Wassern
  rationale: Die Präposition bezeichnet eine Lage auf oder über etwas; „auf den Wassern“ bewahrt das konkrete kosmologische Bild.
- source_word: ኅቡኣተ አድባር
  choice: die verborgenen Orte der Berge
  rationale: Die Wendung bezeichnet verborgene Bereiche oder Schlupfwinkel der Berge. „Orte“ bleibt nah am Wortlaut, ohne die unterirdische Beschaffenheit genauer festzulegen.
- source_word: ኅሑያን ማያት
  choice: lebendige Wasser
  rationale: Die überlieferte Form wird entsprechend der vorliegenden Lesung wörtlich wiedergegeben. So bleibt offen, ob frische, fließende oder lebenspendende Wasser gemeint sind; eine mögliche abweichende Buchstabenlesung wird in der Fußnote genannt.
- source_word: ይመፅኡ
  choice: kommen … hervor
  rationale: Die Imperfektform bezeichnet hier einen fortdauernden oder regelmäßig eintretenden Vorgang, nicht lediglich ein vergangenes Geschehen.
- source_word: እምፍጥረተ ዓለም
  choice: seit der Erschaffung der Welt
  rationale: Die Präposition leitet einen zeitlichen Ausgangspunkt ein. Im Deutschen drückt „seit“ die vom Anfang der Welt an fortdauernde Zeitspanne natürlich aus.
- source_word: ወእስከ ለዓለም
  choice: und bis in Ewigkeit
  rationale: Die Schlussformel führt die zeitliche Aussage ohne festgelegten Endpunkt weiter und bewahrt ihren feierlichen Klang.
theological_decisions:
- issue: Kosmologisches Bild von Erde und Wassern
  choice: Die Erde wird konkret als auf den Wassern gegründet dargestellt.
  alternative: Das Bild metaphorisch als Erschütterung, Teilung oder Beherrschung der Wasser deuten.
  rationale: Der äthiopische Wortlaut beschreibt eine Gründung und lässt die kosmologische Bildwelt unaufgelöst stehen. Eine metaphorische Erklärung würde mehr festlegen als der Text.
- issue: Bedeutung der aus den Bergen hervorkommenden Wasser
  choice: Die Formulierung „lebendige Wasser“ bleibt bildhaft und semantisch offen.
  alternative: Die Wasser ausschließlich als frisch, fließend oder lebenspendend bestimmen.
  rationale: Der Text erklärt die Art des Wassers nicht näher; deshalb wird keine einzelne mögliche Bedeutung zur theologischen Aussage erhoben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter apokalyptisch-kosmologischer Bildsprache. Der fortdauernde Aspekt des Verbs wird im Präsens ausgedrückt; die Zeitspanne wird idiomatisch mit „seit … und bis in Ewigkeit“ wiedergegeben.
