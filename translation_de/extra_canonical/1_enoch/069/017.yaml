  source_fidelity: 'Die Übersetzung gibt die maßgeblichen Elemente des geʿezischen Textes zutreffend wieder: die Erde ist auf den Wassern gegründet; aus den verborgenen Bereichen der Berge kommen Wasser hervor; der Vorgang steht unter der Zeitangabe seit der Welterschaffung bis in Ewigkeit. Das Präsens „kommen … hervor“ bildet den fortdauernden Aspekt von ይመፅኡ angemessen ab. Die Bildsprache wird nicht unzulässig erklärt oder harmonisiert.'
  naturalness: „Und die Erde wurde auf den Wassern gegründet, und aus den verborgenen Orten der Berge kommen lebendige Wasser hervor, seit der Erschaffung der Welt und bis in Ewigkeit“ ist verständliches, würdiges modernes Standarddeutsch. Die leicht feierliche Wortstellung passt zum kosmologisch-apokalyptischen Register.
  terminology: „gegründet“ ist für ተሳረረት angemessen. „Lebendige Wasser“ hält die vorliegende Lesung von ኅሑያን wörtlich und offen; die Fußnote dokumentiert sachgerecht die mögliche textliche beziehungsweise lexikalische Alternative „auserlesene/vortreffliche Wasser“, ohne sie in den Haupttext einzutragen. Der Fußnotenanker steht unmittelbar bei dem betroffenen Ausdruck.
