base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/003.yaml
  text: And these are the chiefs of their angels[a], and their names, and the commanders of their hundreds, and the commanders of their fifties[c][b], and the commanders of their tens.
translation:
  language: de
  text: Und dies sind die Obersten ihrer Engel[a] und ihre Namen sowie die Anführer über ihre Hundertschaften, die Anführer über ihre Fünfzigschaften und die Anführer über ihre Zehnerschaften.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „die Häupter ihrer Engel“. Wer mit „ihrer“ gemeint ist, ergibt sich erst aus dem Zusammenhang.'
    reason: lexical_alternative
  - marker: b
    text: Die Zahlen bezeichnen wahrscheinlich geordnete Abteilungen von Hundert, fünfzig und zehn. Der äthiopische Wortlaut wiederholt bei jeder Rangstufe die possessive Bestimmung „ihre“.
    reason: cultural_note
lexical_decisions:
- source_word: እሉ
  choice: dies
  rationale: Der deiktische Plural leitet eine unmittelbar folgende Aufzählung ein; „dies“ ist im Deutschen dafür natürlich.
- source_word: አርእስተ
  choice: Obersten
  rationale: Wörtlich „Häupter“; „Obersten“ bezeichnet hier verständlich Personen höchsten Ranges und passt zur hierarchischen Aufzählung.
- source_word: መላእክቲሆሙ
  choice: ihrer Engel
  rationale: Im Kontext von 1 Henoch sind Engelwesen gemeint; der Possessivbezug bleibt wie in der Quelle kontextabhängig.
- source_word: አስማቲሆሙ
  choice: ihre Namen
  rationale: Die formale Wiedergabe erhält den Charakter einer Namensliste.
- source_word: መኰንነ
  choice: Anführer
  rationale: Der wiederholte Amtstitel bezeichnet Leitungsgewalt innerhalb einer geordneten Rangfolge. „Anführer“ ist würdig und weniger modern-militärisch festgelegt als „Kommandeure“.
- source_word: ምእት
  choice: Hundertschaften
  rationale: Als Bezeichnung gegliederter Einheiten verstanden, nicht als bloße Gesamtzahl.
- source_word: ኀምሳ
  choice: Fünfzigschaften
  rationale: Die analoge Einheitsbezeichnung bewahrt die abgestufte Gliederung der Quelle.
- source_word: ዐሠርተ
  choice: Zehnerschaften
  rationale: Die Einheitsbezeichnung erhält den abschließenden Rang der zahlenmäßigen Staffelung.
- source_word: ዚአሆሙ
  choice: ihre
  rationale: Der wiederholte possessive Ausdruck wird im Deutschen vor jeder Amtsgruppe wiedergegeben; sein genauer Bezug ergibt sich aus dem Kontext.
theological_decisions:
- issue: Militärische oder allgemein hierarchische Wiedergabe der Rangfolge
  choice: Anführer über Hundertschaften … Fünfzigschaften … Zehnerschaften
  alternative: Kommandeure von Hunderten … Fünfzigern … Zehnern
  rationale: Die Übersetzung wahrt die formale apokalyptische Hierarchie, ohne durch einen ausschließlich modernen militärischen Fachausdruck mehr festzulegen, als der äthiopische Amtstitel verlangt.
- issue: Bezug des wiederholten Possessivums
  choice: Ihre Anführer über die jeweiligen Einheiten
  alternative: Anführer über ihre jeweiligen Einheiten
  rationale: Die Stellung des selbständigen possessiven Ausdrucks kann die gesamte Amtsbezeichnung bestimmen. Die gewählte Fassung folgt dieser grammatischen Möglichkeit und vermeidet die Behauptung, das Possessivum gehöre allein zur Zahleneinheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung der Quelle bleibt erkennbar; ungewöhnliche, aber verständliche Einheitsbezeichnungen bewahren die abgestufte Organisationsstruktur.
