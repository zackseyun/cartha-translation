base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/024.yaml
  text: All these will believe and give thanks before the Lord of Spirits[a], and they will bless with all their power, and their food will be in all thanksgiving[c][b]; and they will give thanks and bless and exalt the name of the Lord of Spirits forever and ever.
translation:
  language: de
  text: Alle diese werden glauben und vor dem Herrn der Geister danken. Sie werden ihn mit all ihrer Kraft preisen, und ihre Nahrung wird in allem Dank bestehen[a]. Sie werden danken, preisen und den Namen des Herrn der Geister für immer und ewig erhöhen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „und ihre Nahrung wird in allem Dank sein“. Die gedrängte äthiopische Wendung kann auch „mit allem Dank“ wiedergegeben werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ያአምኑ
  choice: werden glauben
  rationale: Das Verb bezeichnet Glauben beziehungsweise Vertrauen. „Werden glauben“ gibt den schlichten Zukunftssinn wieder, ohne eine spätere dogmatische Formel einzutragen.
- source_word: የአኵቱ / ወየአኵቱ
  choice: danken / werden danken
  rationale: Das Bedeutungsfeld kann auch Lob einschließen; das benachbarte Substantiv አኰቴት stützt hier jedoch besonders den Sinn des Dankens und bewahrt die Wiederholung im Vers.
- source_word: በቅድመ
  choice: vor
  rationale: Die knappe räumlich-kultische Wendung bezeichnet das Handeln in der Gegenwart des Herrn.
- source_word: እግዚአ መንፈሳት / እግዚአ መናፍስት
  choice: Herr der Geister
  rationale: Die Formulierung ist in den Bilderreden Henochs ein wiederkehrender göttlicher Titel; die titelartige und apokalyptische Prägung bleibt erhalten.
- source_word: ይሴብሑ
  choice: preisen
  rationale: Das Verb kann „segnen“ oder „preisen“ bedeuten. Beim menschlichen beziehungsweise himmlischen Gotteslob ist „preisen“ im heutigen Deutsch natürlicher, während die Abfolge verschiedener Lobhandlungen sichtbar bleibt.
- source_word: በኵሉ ኃይሎሙ
  choice: mit all ihrer Kraft
  rationale: Die Wendung bezeichnet die Gesamtheit ihres Vermögens beziehungsweise ihrer Stärke; „Kraft“ ist idiomatisch und umfassend.
- source_word: ሲሳዮሙ
  choice: ihre Nahrung
  rationale: ሲሳይ bezeichnet Nahrung oder Unterhalt, nicht Reichtum. So bleibt das Bild erhalten, dass der Dank selbst ihre Nahrung beziehungsweise ihr Unterhalt ist.
- source_word: በኵሉ አኰቴት
  choice: in lauter Dank
  rationale: Die komprimierte Wendung kann wörtlich „in allem Dank“ oder „mit allem Dank“ heißen. In Verbindung mit der selbstständigen Nominalaussage wird sie natürlich als „in lauter Dank“ wiedergegeben; die syntaktische Alternative wird in der Fußnote genannt.
- source_word: ያሌዕሉ
  choice: erheben
  rationale: Das Verb drückt ein Hochheben oder Erhöhen aus. „Den Namen … erheben“ bewahrt die Bildlichkeit und den gehobenen Ton.
- source_word: ለዓለመ ዓለም
  choice: für immer und ewig
  rationale: Diese geläufige deutsche Dauerformel entspricht der äthiopischen Wendung „für die Weltzeit der Weltzeit“ und wahrt ihren liturgischen Klang.
theological_decisions:
- issue: Ob ያአምኑ mit ausdrücklich christlich-dogmatischer Glaubenssprache wiederzugeben ist
  choice: werden glauben
  alternative: werden vertrauen / werden Glauben haben
  rationale: Der Vers beschreibt die künftige Reaktion der Versammelten vor dem Herrn der Geister. Die schlichte Wiedergabe bewahrt den lokalen Sinn, ohne spätere Lehrformulierungen einzutragen.
- issue: Wiedergabe des göttlichen Titels እግዚአ መንፈሳት
  choice: Herr der Geister
  alternative: Herr über die Geister
  rationale: In den Bilderreden fungiert die Wendung als fester Titel. Der Genitiv erhält dessen charakteristischen apokalyptischen Klang und lässt den genauen Beziehungsgehalt offen.
- issue: Deutung der Nahrungsaussage
  choice: ihre Nahrung wird in lauter Dank bestehen
  alternative: und mit all ihrer Nahrung in allem Dank
  rationale: Die feminine Kopula ይእቲ spricht für eine eigenständige Nominalklausel und nicht für eine bloße Fortsetzung der vorherigen Präpositionalphrase. Dadurch bleibt das ungewöhnliche Bild erhalten, dass Dank ihre Nahrung ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht liturgischem Rhythmus. Die Wiederholung der Verben des Dankens und Preisens sowie der apokalyptische Titel „Herr der Geister“ wurden bewusst bewahrt; veraltete oder konfessionell geprägte Wendungen wurden vermieden.
