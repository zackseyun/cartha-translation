  terminology: „Herr der Geister“, „glauben“, „danken“ und „preisen“ sind angemessen. „Nahrung“ gibt ሲሳይ korrekt wieder und vermeidet die im englischen früheren Auditpfad dokumentierte, unzutreffende Lesart „Reichtum“.
