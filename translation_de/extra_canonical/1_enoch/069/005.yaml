base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/005.yaml
  text: And the second[a], whose name was Asbe'el—this one taught the evil counsel to the holy sons of God[c][b], and led them astray so that they defiled their bodies with the daughters of men.
translation:
  language: de
  text: Und der Zweite, dessen Name Asbe’el war, lehrte die Söhne der heiligen Engel[a] den bösen Rat und führte sie in die Irre, sodass sie ihr Fleisch[b] mit den Töchtern der Menschen befleckten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die heiligen Söhne der Engel“. Die ge’ezische Wortfolge ist syntaktisch schwierig; für diesen Abschnitt fehlt eine griechische oder qumranische Parallelüberlieferung, die die Zuordnung eindeutig klären könnte.'
    reason: alternative_reading
  - marker: b
    text: Wörtlich „ihr Fleisch“.
    reason: lexical_clarification
lexical_decisions:
- source_word: ካልእ
  choice: der Zweite
  rationale: Im unmittelbaren Zusammenhang einer nummerierten Folge – der Erste in 69,4 und der Dritte in 69,6 – hat das sonst auch als „ein anderer“ mögliche Wort hier ordinalen Sinn.
- source_word: አስብኤል
  choice: Asbe’el
  rationale: Der Personenname wird transliteriert; der Apostroph bildet die durch den ge’ezischen Buchstaben ዐ/አ angezeigte Namensstruktur lesbar ab.
- source_word: ዝንቱ
  choice: '[durch die erneute ausdrückliche Subjektnennung im Relativsatz wiedergegeben]'
  rationale: Das demonstrative „dieser“ hebt Asbe’el hervor. Im Deutschen trägt bereits die Konstruktion „dessen Name … war, lehrte“ den Fokus natürlich; ein zusätzliches „dieser“ wäre möglich, aber schwerfälliger.
- source_word: አመርሙ
  choice: lehrte
  rationale: 'Gibt den kausativ-instruktiven Sinn passend wieder: Asbe’el vermittelt den verderblichen Rat.'
- source_word: ምክረ እኩየ
  choice: den bösen Rat
  rationale: Bewahrt das konkrete Motiv verderblicher Beratung, ohne es auf einen bloßen „Plan“ zu verengen.
- source_word: ለደቂቀ መላእክት ቅዱሳን
  choice: die Söhne der heiligen Engel
  rationale: Die schwierige ge’ezische Nominalfolge enthält ausdrücklich „Söhne“, „Engel“ und „heilig“. Diese Wiedergabe bewahrt alle Bestandteile und lässt die mögliche syntaktische Alternative in einer Fußnote erkennen.
- source_word: አስሐቶሙ
  choice: führte sie in die Irre
  rationale: Erfasst sowohl Täuschung als auch moralische Verfehlung im Kontext der Rebellion.
- source_word: ከመ ያማስኑ
  choice: sodass sie … befleckten
  rationale: Gibt die mögliche Folge- beziehungsweise Zweckbeziehung in natürlichem Deutsch wieder, ohne einen rein kausalen Ablauf zu erzwingen.
- source_word: ሥጋሆሙ
  choice: ihr Fleisch
  rationale: Die formnahe Wiedergabe bewahrt die körperlich-theologische Bildsprache; im Deutschen bezeichnet der Singular kollektiv das Fleisch der betreffenden Wesen.
- source_word: በአዋልደ ሰብእ
  choice: mit den Töchtern der Menschen
  rationale: „Mit“ vermittelt im Kontext die sexuelle Verbindung; „Töchter der Menschen“ entspricht der traditionsgebundenen, zugleich verständlichen Wendung.
theological_decisions:
- issue: Syntaktische Zuordnung von „heilig“ in ለደቂቀ መላእክት ቅዱሳን
  choice: die Söhne der heiligen Engel
  alternative: die heiligen Söhne der Engel
  rationale: Mangels griechischer oder qumranischer Textkontrolle ist die ge’ezische Wortfolge nicht eindeutig. Der Haupttext wählt eine grammatisch plausible Lesart; die andere wird ausdrücklich dokumentiert, statt die Spannung stillschweigend aufzulösen.
- issue: Ob „Söhne Gottes“ als vertraute Wächter-Formel eingesetzt werden soll
  choice: Engel ausdrücklich beibehalten
  alternative: die heiligen Söhne Gottes
  rationale: Im vorliegenden ge’ezischen Text steht መላእክት („Engel“), nicht ein Ausdruck für „Gott“. Eine Harmonisierung mit vertrauter Terminologie würde nicht aus der vorhandenen Quellenevidenz folgen.
- issue: Wiedergabe von ሥጋ
  choice: Fleisch
  alternative: Körper
  rationale: „Fleisch“ ist lexikalisch direkter und bewahrt mögliche anthropologische und Reinheitskonnotationen; der sexuelle Zusammenhang bleibt durch „mit den Töchtern der Menschen befleckten“ verständlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die nummerierte Listenstruktur wird mit „der Zweite“ erhalten. Der Haupttext bleibt quellennah, während die echte syntaktische Unsicherheit der Engel-Söhne-Formulierung in Fußnote [a] offengelegt wird.
