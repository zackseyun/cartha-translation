base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/007.yaml
  text: And from his hand they went out against those who dwell upon the dry ground[b][a], from that day and unto the age of ages.
translation:
  language: de
  text: Und aus seiner Hand gingen sie gegen die hervor[b], die auf dem trockenen Land wohnen[a], von jenem Tag an bis in alle Ewigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die auf der Erde leben«. Wörtlicher steht im Ge''ez: »die auf dem trockenen Land wohnen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht das ge''ezische Verb im Singular: »ging es hervor«; dem Zusammenhang nach sind die »Werkzeuge des Todes« aus dem vorhergehenden Vers gemeint.'
    reason: source_grammar
lexical_decisions:
- source_word: እምነ እዴሁ
  choice: aus seiner Hand
  rationale: Bewahrt das konkrete räumliche Bild des ge'ezischen Ausdrucks; eine übertragene Bedeutung wie »aus seiner Macht« wird nicht in den Text hineingetragen.
- source_word: ወፅአ
  choice: gingen sie hervor
  rationale: Das Verb steht formal im Singular, bezieht sich im Zusammenhang jedoch auf die »Werkzeuge des Todes« aus dem vorhergehenden Vers. Deutsches Plural kongruiert mit diesem Bezugswort; »hervorgehen« wahrt das Bewegungsbild.
- source_word: ዲቤሆሙ
  choice: gegen die
  rationale: Im feindlichen beziehungsweise gerichtlichen Zusammenhang bezeichnet die Präposition eine gegen Personen gerichtete Bewegung oder Wirkung.
- source_word: ለእለ የኃድሩ ዲበ የብስ
  choice: die, die auf dem trockenen Land wohnen
  rationale: Gibt das konkrete Bild von bewohntem trockenem Land wieder, statt es vorschnell zum allgemeinen Begriff »Erde« zu glätten.
- source_word: እምይእቲ ዕለት
  choice: von jenem Tag an
  rationale: Natürliche deutsche Wiedergabe des zeitlichen Ausgangspunkts einer fortdauernden Handlung.
- source_word: እስከ ለዓለመ ዓለም
  choice: bis in alle Ewigkeit
  rationale: Idiomatiche, würdige deutsche Wiedergabe der emphatischen Äonenformel; ihre Aussage unbegrenzter Dauer bleibt erhalten.
theological_decisions:
- issue: Ob የብስ allgemein als »Erde« oder konkret als »trockenes Land« wiederzugeben ist
  choice: trockenes Land
  alternative: Erde
  rationale: Die konkrete kosmologische Bildsprache des Textes soll angesichts der Überlieferungslage nicht eingeebnet werden.
- issue: Numerus des Verbs ወፅአ
  choice: 'Plural: »gingen sie hervor«'
  alternative: 'Singular: »ging es hervor«'
  rationale: Der ge'ezische Singular kann bei einem kollektiven beziehungsweise unbelebten Bezugswort stehen; der Kontext verweist auf die pluralisch verstandenen »Werkzeuge des Todes« aus Vers 6. Die Übersetzung stellt diesen Bezug im Deutschen verständlich her, ohne die formale Abweichung zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener apokalyptischer Bildsprache. Die ungewöhnliche Formulierung »trockenes Land« bleibt bewusst stehen; die Äonenformel wird zugunsten natürlichen Deutschen als »in alle Ewigkeit« wiedergegeben.
