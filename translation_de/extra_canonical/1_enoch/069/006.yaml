base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/006.yaml
  text: And the third was named Gadreel[a]; this is the one who showed all the blows of death to the children of men, and he led Eve astray[c][b], and he showed the weapons of death to the sons of men—the shield and the breastplate and the sword for slaughter—and all the weapons of death to the children of men.
translation:
  language: de
  text: 'Und der Dritte hieß Gadreel. Er war es, der den Menschenkindern alle Schläge des Todes zeigte; er führte Eva in die Irre und zeigte den Menschensöhnen die Waffen des Todes: den Schild, den Brustpanzer und das Schwert zum Töten – und alle Waffen des Todes den Menschenkindern.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Passage über die „Waffen des Todes“ ist im vorliegenden ge'ezischen Text textlich schwierig; nach der Aufzählung folgt eine wiederholende Zusammenfassung. Beides wurde beibehalten. „Schläge des Todes“ kann auch allgemeiner todbringende Angriffe oder Verwundungen bezeichnen.
    reason: textual_variant
lexical_decisions:
- source_word: ሣልስ፡ ስሙ፡ ጋድርኤል
  choice: der Dritte hieß Gadreel
  rationale: Gibt die ordinale Namensformel natürlich und würdevoll wieder; der Personenname wird nach der vorliegenden ge'ezischen Form transliteriert.
- source_word: ዘአርአየ
  choice: der … zeigte
  rationale: Bewahrt die Grundbedeutung „zeigen/offenbaren“ und die Wiederholung desselben Verbs, ohne eine förmliche Unterweisung hineinzulesen.
- source_word: ኵሎ፡ ዝብጠተ፡ ሞት
  choice: alle Schläge des Todes
  rationale: Erhält die substantivische Wiederholung von „Tod“ und lässt offen, ob konkrete Hiebe, Verwundungen oder allgemeiner todbringende Angriffe gemeint sind.
- source_word: ለውሉደ፡ ሰብእ
  choice: den Menschenkindern
  rationale: Bewahrt den kollektiven, gehobenen Ausdruck und ist im modernen Deutschen verständlich.
- source_word: አስሐታ፡ ለሔዋን
  choice: er führte Eva in die Irre
  rationale: Gibt die aktive Irreführung wieder, ohne die direkte Zuschreibung an Gadreel abzuschwächen oder dogmatisch zu harmonisieren.
- source_word: ንዋየ፡ ሞት
  choice: die Waffen des Todes
  rationale: Der folgende Katalog militärischer Ausrüstung stützt „Waffen“; die Genitivform bewahrt zugleich das wiederholte Motiv des Todes.
- source_word: ለደቂቀ፡ ሰብእ
  choice: den Menschensöhnen
  rationale: Spiegelt den Wechsel zu einer nahezu synonymen ge'ezischen Bezeichnung wider, ohne den Sinn zu verändern.
- source_word: ወለታ
  choice: den Schild
  rationale: Im Zusammenhang mit militärischer Ausrüstung ist „Schild“ die klare und allgemein verständliche Wiedergabe.
- source_word: ወድርዐ
  choice: den Brustpanzer
  rationale: Bezeichnet eine Körperrüstung; „Brustpanzer“ ist natürlich, präzise und unterscheidet sie klar von Schild und Schwert.
- source_word: ወሰይፈ፡ ለቀተል
  choice: das Schwert zum Töten
  rationale: Bewahrt die ausdrückliche Zweckangabe und die Härte der Aussage in natürlichem Deutsch.
theological_decisions:
- issue: Gadreels Verbindung mit der Irreführung Evas
  choice: er führte Eva in die Irre
  alternative: er täuschte Eva
  rationale: Der ge'ezische Text schreibt Gadreel die Irreführung Evas unmittelbar zu. Diese Spannung wird nicht mit anderen Überlieferungen harmonisiert.
- issue: Wiederholung der Waffen-des-Todes-Formel
  choice: sowohl die konkrete Liste als auch die abschließende Zusammenfassung beibehalten
  alternative: die abschließende Wiederholung als redundant auslassen
  rationale: Trotz der textlichen Schwierigkeit gehört beides zum vorliegenden Zeugnis; die Übersetzung glättet oder kürzt den Text daher nicht stillschweigend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem apokalyptischem Ton. Die wechselnden Kollektivbezeichnungen „Menschenkinder“ und „Menschensöhne“ spiegeln den ge'ezischen Ausdruckswechsel; die wiederholte Genitivverbindung mit „Tod“ bleibt sichtbar.
