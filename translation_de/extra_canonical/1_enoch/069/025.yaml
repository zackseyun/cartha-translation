base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/025.yaml
  text: And over them this oath became strong[a], and they are kept by it; and their paths are kept[c][b], and their courses do not perish.
translation:
  language: de
  text: Und über ihnen wurde dieser Schwur mächtig[a], und durch ihn werden sie bewahrt; auch ihre Pfade werden bewahrt[b], und ihre Bahnen vergehen nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurde fest“ beziehungsweise „gewann Kraft“.'
    reason: lexical_alternative
  - marker: b
    text: Der äthiopische Text ist an dieser Stelle schwierig; die wiederholte Passivform kann besagen, dass sowohl sie selbst als auch ihre Pfade durch den Schwur bewahrt oder festgehalten werden.
    reason: textual_variant
lexical_decisions:
- source_word: ዲቤሆሙ
  choice: über ihnen
  rationale: Die Präposition bezeichnet hier eine übergeordnete beziehungsweise bindende Wirksamkeit; „über ihnen“ gibt dies natürlich wieder, ohne sie lediglich als Gemeinschaftssphäre zu verstehen.
- source_word: ጸንዐ
  choice: wurde mächtig
  rationale: Das Verb bezeichnet Festigkeit oder Stärke. „Wurde mächtig“ bewahrt den dynamischen Sinn und die erhobene Sprache, ohne die Wirkung ausschließlich juristisch zu bestimmen.
- source_word: ዝማሐላ
  choice: dieser Schwur
  rationale: Das Demonstrativelement wird mit „dieser“ wiedergegeben; „Schwur“ bezeichnet die bindende Eideshandlung beziehungsweise den daraus hervorgehenden Eid.
- source_word: ይትዓቀቡ
  choice: werden sie bewahrt / werden bewahrt
  rationale: Die imperfektische Passivform bezeichnet fortdauerndes Bewahren, Behüten oder Festhalten. „Bewahrt“ lässt Schutz und bindende Begrenzung zugleich offen.
- source_word: ቦቱ
  choice: durch ihn
  rationale: Das Pronomen verweist auf den Schwur und hat instrumentalen Sinn. „Durch ihn“ bringt die bewirkende Kraft im Deutschen klar zum Ausdruck.
- source_word: ፍናዊሆሙ
  choice: ihre Pfade
  rationale: Das Wort bezeichnet Wege oder Pfade. „Pfade“ erhält das Bild geordneter Bewegung.
- source_word: ምሕዋራቲሆሙ
  choice: ihre Bahnen
  rationale: Der Plural kann Umläufe, Kreise oder geordnete Bewegungsbahnen bezeichnen. „Bahnen“ passt zum möglichen kosmischen Zusammenhang, ohne eine ausschließlich astronomische Deutung festzulegen.
- source_word: ኢይማስን
  choice: vergehen nicht
  rationale: Das Verb kann Nichtvergehen, Nichtzugrundegehen oder Nichtversagen ausdrücken. „Vergehen nicht“ bewahrt die Aussage dauerhaften Bestands in natürlichem, würdevollem Deutsch.
theological_decisions:
- issue: Ob der Vers moralischen Gehorsam, rechtliche Bindung oder kosmische Ordnung unter dem Schwur beschreibt
  choice: Der Schwur wirkt bindend und bewahrend; zugleich bleiben Pfade und Bahnen bestehen.
  alternative: Der Schwur bindet ausschließlich Engel zum Gehorsam oder stabilisiert ausschließlich die Bewegungen kosmischer Größen.
  rationale: Die Passivformen können sowohl Schutz als auch Einschränkung ausdrücken, während „Pfade“ und „Bahnen“ geordnete Bewegung nahelegen. Die Übersetzung erhält diese theologische Spannung, statt sie auf eine einzige Kategorie festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur des Ge’ez bleibt erkennbar. „Schwur“, „Pfade“ und „Bahnen“ erhalten den apokalyptisch-kosmischen Ton, ohne die mehrdeutige Aussage konfessionell oder systematisch festzulegen.
