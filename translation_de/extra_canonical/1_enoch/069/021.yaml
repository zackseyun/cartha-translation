base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/021.yaml
  text: And by that oath the stars complete their courses[a], and their names are called[c][b], and they answer from age to age and forever.
translation:
  language: de
  text: Und bei diesem Schwur vollenden die Sterne ihre Bahnen, und ihre Namen werden gerufen, und sie antworten ihm[a] von Zeitalter zu Zeitalter.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht beim Verb ein männliches Objekt in der Einzahl: „sie antworten ihm“. Wer mit „ihm“ gemeint ist, wird in diesem Vers nicht ausdrücklich genannt; aus dem Zusammenhang liegt der Herr des Schwurs nahe.'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Wörtlich eine feierliche Fortdauerformel mit dem Wort, das sowohl „Zeitalter“ als auch „Welt“ bezeichnen kann: „von Zeitalter/Welt bis zu Zeitalter/Welt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ማሐላ
  choice: Schwur
  rationale: Das Substantiv bedeutet hier „Schwur“ und setzt die wiederkehrende Schwurformel des Zusammenhangs fort; eine Deutung als „Bahnen“ ist lexikalisch nicht überzeugend.
- source_word: ከዋክብት
  choice: die Sterne
  rationale: Die gewöhnliche und bildkräftige Bedeutung ist „Sterne“; eine Verallgemeinerung zu „Himmelskörper“ ist unnötig.
- source_word: ይፌጽሙ ምሕዋሪሆሙ
  choice: vollenden ihre Bahnen
  rationale: Die Wendung beschreibt, dass die Sterne ihre geordneten Bewegungsbahnen zu Ende führen. „Bahnen“ ist im Deutschen natürlich und bewahrt das kosmische Bild.
- source_word: አስማቲሆሙ ይጼውዑ
  choice: ihre Namen werden gerufen
  rationale: Die syntaktisch gedrängte Formulierung wird entsprechend dem Zusammenhang passivisch wiedergegeben, ohne ausdrücklich festzulegen, wer die Namen ruft.
- source_word: ያወሥእዎ
  choice: sie antworten ihm
  rationale: Das Verb bezeichnet Antworten; das Suffix -wo ist maskulin Singular und wird daher mit „ihm“ wiedergegeben, auch wenn der Bezug im Vers selbst nicht ausdrücklich genannt ist.
- source_word: እምዓለም ወእስከ ለዓለም
  choice: von Zeitalter zu Zeitalter
  rationale: Die feierliche Zeitformel bezeichnet fortdauernde Beständigkeit. Die deutsche Wendung erhält die Wiederholung, ohne mehr metaphysische Präzision einzutragen, als der Ausdruck bietet.
theological_decisions:
- issue: Ob die Sterne rein astronomisch oder als antwortende himmlische Wesen dargestellt werden
  choice: 'Die personifizierende Aussage bleibt stehen: Die Sterne vollenden ihre Bahnen, werden bei ihren Namen gerufen und antworten.'
  alternative: Die Antwort könnte sich auf Engel beziehen, die den Sternen zugeordnet sind, oder lediglich bildhafte Sprache für die geordnete Himmelsbewegung sein.
  rationale: Der apokalyptische Text verbindet kosmische Ordnung mit persönlicher Reaktion. Die Übersetzung löst diese Spannung nicht zugunsten einer rein mechanischen oder ausdrücklich angelologischen Deutung auf.
- issue: Bezug des maskulinen Singularpronomens in „sie antworten ihm“
  choice: Das grammatische Objekt „ihm“ wird bewahrt, sein Bezug jedoch nicht im Haupttext erklärt.
  alternative: Das Pronomen könnte ausgelassen oder ausdrücklich auf den Herrn bezogen werden.
  rationale: Das Suffix ist im überlieferten Text vorhanden. Eine ausdrückliche Identifikation mit Gott wäre aus dem Zusammenhang plausibel, ginge aber über die isolierte Formulierung hinaus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die ge'ezische Syntax. Die kosmische Personifikation und der nicht ausdrücklich genannte Bezug von „ihm“ bleiben erhalten; unnötige altertümliche Formulierungen werden vermieden.
