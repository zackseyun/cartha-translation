base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/011.yaml
  text: For human beings were not created except to be like the angels[a], so that they might remain pure and righteous; and death, which destroys everything, would not have touched them. But through this knowledge they are being destroyed[d][c][b], and through this power it is consuming me.
translation:
  language: de
  text: Denn die Menschen wurden nur dazu erschaffen, den Engeln zu gleichen,[a] damit sie rein und gerecht blieben; und der Tod, der alles vernichtet, hätte sie nicht berührt. Doch durch diese Erkenntnis gehen sie zugrunde,[b][c] und durch diese Macht verschlingt sie mich.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „wie die Engel zu sein“. Gemeint ist eine Ähnlichkeit; der Wortlaut setzt Menschen nicht ausdrücklich mit Engeln gleich.'
    reason: lexical_alternative
  - marker: b
    text: „Erkenntnis“ kann hier auch „Wissen“ oder „Verständnis“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „durch dieses Verständnis kommen sie um“. Für diesen Abschnitt steht hier keine wirksame griechische oder aramäische Textkontrolle zur Verfügung; die schwierige Formulierung wird daher bewusst zurückhaltend wiedergegeben.'
    reason: textual_variant
  - marker: d
    text: Das Schlussverb ist sehr bildhaft und bedeutet „verschlingt mich“ oder „verzehrt mich“. Im Ge'ez wird das Subjekt nicht ausdrücklich genannt; „sie“ knüpft im Deutschen an die zuvor genannte „Macht“ an.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢተፈጥረ ሰብእ ዘእንበለ
  choice: die Menschen wurden nur dazu erschaffen
  rationale: Das passive Schöpfungswort und die einschränkende Aussage bleiben erhalten; der kollektive Ausdruck für den Menschen wird im Deutschen natürlich als Plural wiedergegeben.
- source_word: ከመ መላእክት
  choice: den Engeln zu gleichen
  rationale: Gibt die Vergleichsaussage wieder, ohne Menschen und Engel gleichzusetzen.
- source_word: ይንበሩ ንጹሓነ ወጻድቃነ
  choice: damit sie rein und gerecht blieben
  rationale: Das Verb bezeichnet hier das Fortbestehen in einem Zustand; die moralisch-religiösen Adjektive werden in vertrautem biblischem Register bewahrt.
- source_word: ሞት ዘኵሉ ያማሥን
  choice: der Tod, der alles vernichtet
  rationale: Bewahrt die personifizierende und umfassende Aussage über die zerstörerische Wirkung des Todes.
- source_word: እመ ኢገሰሶሙ
  choice: hätte sie nicht berührt
  rationale: Der irreale Sinn des Zusammenhangs wird im deutschen Konjunktiv ausgedrückt; das Bild körperlicher Berührung bleibt erhalten.
- source_word: በዝ አእምሮቶሙ
  choice: durch diese Erkenntnis
  rationale: Der Ausdruck kann Erkenntnis, Wissen oder Verständnis bezeichnen; „Erkenntnis“ wahrt den gehobenen Ton und die sachliche Unbestimmtheit.
- source_word: ይትሐጐሉ
  choice: gehen sie zugrunde
  rationale: Gibt den medial-passiven Sinn des Verderbens idiomatisch wieder, ohne eine ausdrücklich handelnde Ursache hinzuzufügen.
- source_word: ኃይል
  choice: Macht
  rationale: Der breite Bedeutungsumfang zwischen Macht, Kraft und Stärke bleibt gewahrt.
- source_word: ይበልዓኒ
  choice: verschlingt er mich
  rationale: Bewahrt das drastische Bild des Essens oder Verschlingens und die persönliche Aussage der ersten Person.
theological_decisions:
- issue: Bestimmung des Menschen im Verhältnis zu den Engeln
  choice: Menschen wurden dazu erschaffen, den Engeln zu gleichen.
  alternative: Menschen wurden als Engel erschaffen.
  rationale: Die Vergleichskonstruktion bezeichnet Ähnlichkeit, nicht Wesensgleichheit, und lässt die erhöhte anthropologische Aussage des Verses stehen.
- issue: Ursächliche Aussage über Erkenntnis
  choice: Durch diese Erkenntnis gehen sie zugrunde.
  alternative: Durch dieses Verständnis kommen sie um.
  rationale: Die genaue Bedeutung und der Bezug der Erkenntnis bleiben unsicher; die Übersetzung hält sich eng an den ge'ezischen Zeugen und erklärt die Ursache nicht weiter.
- issue: Subjekt im Schlusssatz
  choice: „er“ bezieht sich grammatisch auf die zuvor genannte Macht.
  alternative: „sie“ bezieht sich auf die Erkenntnis oder „es“ bleibt unpersönlich.
  rationale: Im Deutschen verlangt „Macht“ ein feminines Pronomen, doch die ge'ezische Verbform benennt kein separates Pronomen. Um die mögliche Fortführung von ኃይል als handelnder Größe nicht künstlich festzulegen, wird die grammatische Schwierigkeit in einer Fußnote offengelegt; im Haupttext folgt „er“ der im unmittelbaren Satzgefüge wirksamen, personifiziert verstandenen Macht als Gewaltfaktor.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit biblisch-apokalyptischem Gewicht. Kurze, klare Satzglieder bewahren den Gegensatz zwischen dem vorgesehenen reinen Zustand und dem gegenwärtigen Verderben. Die schwierigen Bezüge im letzten Satz werden nicht dogmatisch aufgelöst.
