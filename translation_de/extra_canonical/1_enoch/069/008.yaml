base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/008.yaml
  text: And the fourth—his name was Penemue—this one showed the children of men the bitter and the sweet[b][a], and he showed them all the secrets of their wisdom.
translation:
  language: de
  text: Und der vierte – sein Name war Penemue – zeigte den Menschenkindern das Bittere und das Süße[a], und er zeigte ihnen alle Geheimnisse ihrer Weisheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich und formnah: „das Bittere und das Süße“. Das knappe Gegensatzpaar kann konkrete Geschmacksqualitäten oder übertragen gegensätzliche beziehungsweise moralisch aufgeladene Erkenntnis bezeichnen; der Ge''ez-Text legt dies nicht eindeutig fest.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ራብዕ
  choice: der vierte
  rationale: Ordinalzahl zur Einführung des nächsten Engels in der Aufzählung; der Artikel entspricht natürlichem deutschen Satzbau.
- source_word: ስሙ ፔኔሙኤ
  choice: sein Name war Penemue
  rationale: Die Namensformel wird im erzählenden Kontext mit Präteritum wiedergegeben; der Eigenname wird transliteriert.
- source_word: ዝንቱ
  choice: '[durch erneute Nennung des Subjekts ausgedrückt]'
  rationale: Das rückverweisende Demonstrativ wird im Deutschen natürlich durch den Satzanschluss nach dem Einschub und das Verb mit eindeutigem Subjekt wiedergegeben; ein zusätzliches „dieser“ wäre möglich, aber schwerfälliger.
- source_word: አርአየ / ወአርአዮሙ
  choice: zeigte / und er zeigte ihnen
  rationale: Die Grundbedeutung „zeigen, bekannt machen“ sowie die Wiederholung desselben Verbs bleiben erhalten, ohne es deutend als formalen Unterricht zu fassen.
- source_word: ለውሉደ ሰብእ
  choice: den Menschenkindern
  rationale: Bewahrt die traditionelle, gehobene anthropologische Wendung des henochischen Sprachstils und ist im Deutschen verständlich.
- source_word: መሪረ ወመዓርፂረ
  choice: das Bittere und das Süße
  rationale: Die substantivisch gebrauchten Adjektive werden formnah wiedergegeben; die knappe Gegenüberstellung bleibt offen für wörtliches wie übertragenes Verständnis.
- source_word: ኵሎ ኅቡኣተ ጥበቦሙ
  choice: alle Geheimnisse ihrer Weisheit
  rationale: „Alle“ bewahrt den umfassenden Umfang, „Geheimnisse“ den Sinn verborgener Dinge und „ihrer“ den pronominalen Bezug des Ge'ez.
theological_decisions:
- issue: Bedeutung des Gegensatzpaares መሪረ und መዓርፂረ
  choice: das Bittere und das Süße
  alternative: Bitterkeit und Süße; böse und gute Dinge
  rationale: Der Ge'ez-Text bietet einen knappen Gegensatz substantivierter Adjektive. Die Übersetzung moralisiert ihn nicht zu „Gut und Böse“ und lässt eine wörtliche oder übertragene Deutung offen.
- issue: Bezug von ኅቡኣተ ጥበቦሙ
  choice: Geheimnisse ihrer Weisheit
  alternative: verborgene Dinge der Weisheit; alle Geheimnisse der Weisheit
  rationale: Das Possessivsuffix wird als „ihrer“ sichtbar bewahrt. Dadurch bleibt der syntaktische Bezug zu den Menschenkindern erhalten, ohne die Art dieser Weisheit theologisch näher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht gehobenem apokalyptischem Ton. „Menschenkinder“ erhält die traditionelle Ausdrucksweise, während Satzbau und Wortwahl für heutige Leser klar bleiben.
