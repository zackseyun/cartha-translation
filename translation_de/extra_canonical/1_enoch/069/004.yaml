base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/004.yaml
  text: And the name of the first was Yeqon[a]; this is the one who led all the children of the angels astray, and brought them down upon the dry land[d][c][b], and led them astray through the daughters of men.
translation:
  language: de
  text: Und der Name des Ersten war Jeqon[a]. Dieser ist es, der alle Kinder der Engel[b] in die Irre führte, sie auf das trockene Land[c] herabführte und sie durch die Töchter der Menschen[d] in die Irre führte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ge'ez-Name ይቁን wird hier als „Jeqon“ wiedergegeben; wegen unterschiedlicher Umschrift und unsicherer Vokalisierung sind auch Schreibweisen wie „Jekon“, „Jekun“ oder „Yeqon“ möglich.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „Kinder der Engel“. Die ungewöhnliche Wendung kann auch allgemeiner auf die Engelschar bezogen werden.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „auf die Erde“ beziehungsweise „auf das Land“. Das Ge''ez bezeichnet konkret das trockene Land als irdischen Bereich.'
    reason: lexical_alternative
  - marker: d
    text: Das zugrunde liegende „durch“ bezeichnet hier das Mittel oder den vermittelnden Umstand; Jeqon bleibt der Handelnde, der sie auf diese Weise in die Irre führte.
    reason: translation_clarity
lexical_decisions:
- source_word: ወስሙ፡ ለቀዳማዊ፡ ይቁን
  choice: Und der Name des Ersten war Jekon
  rationale: Bewahrt die listenartige Namensformel. Der Eigenname wird in einer für deutsche Leser gut lesbaren, quellenahen Form transliteriert; seine Vokalisierung ist nicht völlig sicher.
- source_word: ዝውእቱ
  choice: Dieser ist es, der
  rationale: Gibt die nachdrückliche identifizierende Konstruktion wieder und klingt zugleich würdig und natürlich.
- source_word: ዘአስሐተ ... ወአስሐቶሙ
  choice: in die Irre führte ... in die Irre führte
  rationale: Die Wiederholung derselben Wendung bildet die Wiederholung desselben geezischen Verbstamms ab, ohne zusätzliche Bedeutungsnuancen einzutragen.
- source_word: ደቂቀ፡ መላእክት
  choice: Kinder der Engel
  rationale: Gibt die ungewöhnliche familiäre Bezeichnung formal wieder und lässt offen, ob Nachkommenschaft oder allgemeiner eine Engelschar gemeint ist.
- source_word: ወአውረዶሙ፡ ዲበ፡ የብስ
  choice: sie auf das trockene Land herabführte
  rationale: Erhält sowohl die Abwärtsbewegung als auch das konkrete Bild des trockenen Landes; „herabführte“ legt weder Zwang noch bloße Überredung fest.
- source_word: በአዋልደ፡ ሰብእ
  choice: durch die Töchter der Menschen
  rationale: „Durch“ kennzeichnet die Töchter als Mittel beziehungsweise Anlass und vermeidet den Eindruck, sie seien selbst das handelnde Subjekt des Irreführens.
theological_decisions:
- issue: Identität der „Kinder der Engel“
  choice: Die wörtliche familiäre Wendung bleibt im Haupttext erhalten.
  alternative: die Engel; die Engelschar; die Kinder des Himmels
  rationale: Die ungewöhnliche Formulierung des geezischen Textes ist eine echte exegetische Spannung und soll nicht durch Harmonisierung beseitigt werden.
- issue: Bedeutung der wiederholten Verben des Irreführens
  choice: Beide Male „in die Irre führte“
  alternative: täuschte ... verführte; brachte ... vom Weg ab
  rationale: Die Wiederholung wahrt die rhetorische Struktur und vermeidet eine nicht ausdrücklich belegte Bedeutungsdifferenz.
- issue: Instrumentale Bedeutung der Präposition vor „Töchter der Menschen“
  choice: durch die Töchter der Menschen
  alternative: mittels der Töchter der Menschen; wegen der Töchter der Menschen
  rationale: Die Wiedergabe lässt Jekon als Handelnden erkennen und bezeichnet die Töchter als Mittel oder vermittelnden Umstand, ohne den genauen Zusammenhang weiter auszudeuten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die Satzglieder folgen eng der geezischen Abfolge; die wiederholte Wendung „in die Irre führte“ und das konkrete „trockene Land“ bleiben bewusst erhalten. Alle Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
