base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/010.yaml
  text: 'For men were not born for this: to strengthen their faith with pen and ink[a][b][c].'
translation:
  language: de
  text: Denn die Menschen wurden nicht dazu geboren, ihren Glauben mit Schreibrohr und Tinte zu festigen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht beim zweiten Schreibmittel „Gallwasser“; gemeint sein kann aus Galläpfeln hergestellte Tinte.
    reason: cultural_note
  - marker: b
    text: „Glauben“ kann hier auch „Treue“ oder „Vertrauen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: Denn
  rationale: Bewahrt die begründende oder erläuternde Verknüpfung mit dem vorausgehenden Zusammenhang.
- source_word: ኢተወልዱ ሰብእ
  choice: die Menschen wurden nicht … geboren
  rationale: Gibt die negative Passivform natürlich wieder; ሰብእ bezeichnet hier kollektiv die Menschheit und nicht nur Männer.
- source_word: በዘ ከመዝ
  choice: dazu
  rationale: Drückt den Zweckbezug knapp und idiomatisch aus, ohne ihn weiter auszudeuten.
- source_word: በቀለም ወበማየ ሐመት
  choice: mit Schreibrohr und Tinte
  rationale: Im Schreibkontext bezeichnet ቀለም wahrscheinlich das Schreibrohr; das wörtliche ‚Gallwasser‘ ist als Gallustinte beziehungsweise Tinte zu verstehen. Die konkrete Schreibszene bleibt dadurch erhalten.
- source_word: ያጽንዑ
  choice: zu festigen
  rationale: Bewahrt den Sinn ‚fest/kräftig machen‘ und passt natürlich zum folgenden Glauben.
- source_word: ሃይማኖቶሙ
  choice: ihren Glauben
  rationale: Die Form kann Glaube, Vertrauen oder Treue bezeichnen. ‚Glauben‘ wahrt die religiös-moralische Offenheit und vermeidet die stärkere kontextuelle Festlegung auf ‚guten Glauben‘.
theological_decisions:
- issue: Bedeutung von Schreibrohr und Tinte für den Glauben
  choice: Die konkrete Wendung wird als Schreibmittel wiedergegeben, ohne ausdrücklich zu erklären, ob schriftliche Verträge, Eide oder Lehren gemeint sind.
  alternative: Die Wendung als Kritik daran auslegen, Treue oder guten Glauben durch schriftliche Verträge zu bestätigen.
  rationale: Der Kontext kann auf schriftlich bekräftigte Verpflichtungen weisen, doch der Vers allein legt die genaue theologische oder rechtliche Funktion nicht eindeutig fest.
- issue: Bedeutung von ሃይማኖቶሙ
  choice: ihren Glauben
  alternative: ihre Treue / ihre Vertrauenswürdigkeit
  rationale: ‚Glauben‘ entspricht dem breiten Bedeutungsfeld und erhält die Spannung zwischen religiösem Glauben und verlässlicher Treue, statt sie stillschweigend zugunsten eines Vertragskontexts aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt knapp und bewahrt die ungewöhnliche Aussage; die schwer verständliche Schreibterminologie wird im Haupttext idiomatisch und in der Fußnote wörtlich wiedergegeben.
