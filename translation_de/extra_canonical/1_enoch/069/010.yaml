  source_fidelity: Die Übersetzung gibt die begründende Konjunktion, die negative Zweckbestimmung und die kollektive Bedeutung von ሰብእ treffend wieder. „Schreibrohr und Tinte“ ist für በቀለም ወበማየ ሐመት eine plausible kontextuelle Wiedergabe der beiden Schreibmittel. Die Fußnote wahrt zugleich Transparenz über das wörtliche „Gallwasser“. „ihren Glauben ... festigen“ entspricht dem Grundsinn von ያጽንዑ ሃይማኖቶሙ, ohne die umstrittene Aussage auf Vertrags- oder Eidesbestätigung zu verengen.
