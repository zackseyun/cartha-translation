base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/023.yaml
  text: And there are kept the sound of the thunder and the light of the lightning[a], and there are kept the storehouses of the hail and the storehouses of the hoarfrost, and the storehouses of the mist[b], and the storehouses of the rain and the dew.
translation:
  language: de
  text: Und dort werden der Schall des Donners und das Licht des Blitzes aufbewahrt. Dort werden auch die Vorratskammern des Hagels, die Vorratskammern des Reifs, die Vorratskammern des Nebels und die Vorratskammern des Regens und des Taus aufbewahrt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በህየ
  choice: dort
  rationale: Das lokale Adverb bezeichnet den geschauten Ort; die Wiederholung wird entsprechend der Vorlage bewahrt.
- source_word: ይትዓቀቡ / ይትዓቀብ
  choice: werden aufbewahrt
  rationale: Die passive Bedeutung lässt sowohl Verwahrung als auch Lagerung anklingen, ohne den Sinn unnötig einzuengen.
- source_word: ቃሉ ለነጐድጓድ
  choice: der Schall des Donners
  rationale: ቃል kann Wort, Stimme oder Laut bedeuten; im meteorologischen Zusammenhang ist „Schall“ natürlich und wahrt die konkrete Parallelität zum Licht des Blitzes.
- source_word: ብርሃኑ ለመብረቅ
  choice: das Licht des Blitzes
  rationale: Die wörtliche Bildsprache und die Parallelität mit dem Donnerschall bleiben erhalten.
- source_word: መዛግብተ
  choice: Vorratskammern
  rationale: Der Ausdruck bezeichnet konkrete himmlische Lagerstätten beziehungsweise Vorräte kosmischer Erscheinungen; „Vorratskammern“ gibt dieses apokalyptische Bild verständlich wieder.
- source_word: በረድ
  choice: Hagel
  rationale: Eindeutige meteorologische Bedeutung.
- source_word: አስሐትያ
  choice: Reif
  rationale: Die lexikalisch gestützte Bedeutung ist Reif beziehungsweise Frost; „Reif“ unterscheidet das Phänomen klar vom folgenden Nebel.
- source_word: ጊሜ
  choice: Nebel
  rationale: Das Wort bezeichnet Nebel, Dunst oder Wolke; „Nebel“ passt zur Abfolge atmosphärischer Erscheinungen und hält es von አስሐትያ auseinander.
- source_word: ዝናም
  choice: Regen
  rationale: Standardbedeutung des geezischen Ausdrucks.
- source_word: ጠል
  choice: Tau
  rationale: Standardbedeutung; der vollständige Abschluss der Aufzählung bleibt erhalten.
theological_decisions:
- issue: Darstellung der meteorologischen Größen als himmlisch verwahrte Kräfte
  choice: Das konkrete Bild von Vorratskammern und aufbewahrten Naturerscheinungen wird beibehalten.
  alternative: Die Stelle in moderne meteorologische Vorgänge auflösen, etwa als Entstehung von Donner, Blitz und Niederschlag.
  rationale: Der Vers spricht in visionär-apokalyptischer Bildsprache von kosmischen Vorräten. Eine entmythologisierende Wiedergabe würde die Aussageform der Quelle verändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Satz- und Listenstruktur der geezischen Vorlage wird weitgehend erhalten, ohne unnatürlich zu wirken. Keine Fußnoten nötig, da „Reif“ und „Nebel“ die nach der jüngsten Quellenprüfung vorzuziehenden Bedeutungen klar wiedergeben.
