base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/002.yaml
  text: 'And these are the names of those angels[a], and these are their names: the first of them was Semyaza, the second Artaqifa, the third Armen, the fourth Kokabel, the fifth Turiel, the sixth Rumyal, the seventh Daniyal, the eighth Neqael, the ninth Baraqel, the tenth Azazel, the eleventh Armaros, the twelfth Batariel, the thirteenth Basasael, the fourteenth Hananel, the fifteenth Turiel, the sixteenth Simipesiel, the seventeenth Yeterel, the eighteenth Tumael, the nineteenth Turiel, the twentieth Teremael[d][c][b], and the twenty-first Te''azazel.'
translation:
  language: de
  text: 'Und siehe: die Namen jener Engel[a] – dies sind ihre Namen: Der erste von ihnen war Semyaza, der zweite Artaqifa, der dritte Armen, der vierte Kokabel, der fünfte Turiel, der sechste Rumyal, der siebte Daniyal, der achte Neqael, der neunte Baraqel, der zehnte Azazel, der elfte Armaros, der zwölfte Batariel, der dreizehnte Basasael, der vierzehnte Hananel, der fünfzehnte Turiel, der sechzehnte Simipesiel, der siebzehnte Yeterel, der achtzehnte Tumael, der neunzehnte Turiel[b], der zwanzigste Teremael[c] und der einundzwanzigste Te''azazel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mehrere Namen in diesem Vers sind textlich unsicher. Da die Bilderreden in diesem Arbeitsgang im Wesentlichen nur auf Ge'ez beruhen und die zugängliche Textgestalt stellenweise ungleichmäßig ist, folgt die Umschrift möglichst eng den sichtbaren äthiopischen Formen, statt sie an geläufigere Schreibweisen anzugleichen.
    reason: textual_variant
  - marker: b
    text: Der als „Turiel“ wiedergegebene Name erscheint in der äthiopischen Liste mehrfach und mit geringfügig abweichender Schreibung. Die Wiederholungen sind nicht stillschweigend berichtigt worden.
    reason: textual_variant
  - marker: c
    text: Andere Ausgaben und Übersetzungen geben einige Namen dieser Liste anders wieder. Meist beruht das auf der unsicheren Deutung der äthiopischen Namensformen.
    reason: alternative_reading
lexical_decisions:
- source_word: ወነዋ
  choice: Und siehe
  rationale: Die einleitende Präsentationsformel wird ausdrücklich wiedergegeben und nicht mit der folgenden Namensformel verschmolzen.
- source_word: አስማቲሆሙ፡ ለእሉክ፡ መላእክት
  choice: die Namen jener Engel
  rationale: Die Genitivbeziehung wird idiomatisch ausgedrückt; „jener“ bewahrt die rückverweisende Kraft des Demonstrativs.
- source_word: ወዝንቱ፡ ውእቱ፡ አስማቲሆሙ
  choice: dies sind ihre Namen
  rationale: Die zweite, im Ge'ez eigenständige Einleitungsformel bleibt erhalten; der deutsche Plural folgt dem Sinn.
- source_word: ቀዳማዊ፡ ዚአሆሙ
  choice: Der erste von ihnen
  rationale: Die ordinale und partitive Konstruktion wird vollständig wiedergegeben.
- source_word: ጡሩኤል / ጡርኤል
  choice: Turiel
  rationale: Die leicht abweichenden äthiopischen Schreibungen werden einheitlich transliteriert, während alle Wiederholungen des Namens erhalten bleiben.
- source_word: ስምያዛ
  choice: Semyaza
  rationale: Konservative Transliteration der sichtbaren Ge'ez-Form ohne Harmonisierung mit geläufigeren Namensformen.
- source_word: ሩምያል
  choice: Rumyal
  rationale: Direkte Transliteration statt Angleichung an den bekannteren Namen Ramiel.
theological_decisions:
- issue: Angleichung der Engelnamen an vertrautere Formen anderer henochischer oder späterer Überlieferungen
  choice: Die Namen werden möglichst nahe an den Ge'ez-Formen transliteriert.
  alternative: Formen wie Daniyal zu Daniel, Rumyal zu Ramiel oder Kokabel zu Kokabiel harmonisieren.
  rationale: Da dieser Abschnitt im Arbeitsgang im Wesentlichen nur durch Ge'ez bezeugt ist, würde eine Harmonisierung die textliche Unsicherheit verdecken.
- issue: Mehrfaches Vorkommen des Namens Turiel
  choice: Alle Wiederholungen werden im Haupttext beibehalten.
  alternative: Die vermeintlichen Dubletten stillschweigend verbessern oder entfernen.
  rationale: Ohne stärkere textkritische Grundlage darf die überlieferte formale Namensliste nicht konjektural geglättet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feierliche doppelte Listeneinleitung des Ge'ez bleibt erhalten; die lange Aufzählung wird nicht gekürzt. Eigennamen werden konservativ transliteriert.
