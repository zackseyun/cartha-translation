base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/009.yaml
  text: And he taught humankind writing with ink and paper[a], and because of this many have gone astray from eternity to eternity[c][b], even to this day.
translation:
  language: de
  text: Und er lehrte die Menschen, mit Tinte und Papier zu schreiben[a]; deshalb sind viele abgeirrt, von Ewigkeit zu Ewigkeit[b], bis zum heutigen Tag.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das zweite Schreibmaterial kann auch als „Schreibblatt“ oder „Papyrus“ verstanden werden. Der im Prompt überlieferte äthiopische Wortlaut ist an dieser Stelle offenbar durch Lesefehler entstellt; die Übersetzung folgt der rekonstruierten Lesart „mit Tinte und Schreibmaterial“.
    reason: textual_variant
  - marker: b
    text: 'Oder: „von Zeitalter zu Zeitalter“. Das wiederholte Wort kann sowohl „Zeitalter“ als auch „Ewigkeit“ bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መሀሮሙ (rekonstruierter Text anstelle des offenbar fehlerhaften አበወዎሙ)
  choice: er lehrte die Menschen
  rationale: Die anhand der Editionskorrektur rekonstruierte Form bedeutet „er lehrte sie“. „Die Menschen“ gibt den kollektiven Bezug von ለሰብእ natürlich wieder.
- source_word: መጽሐፈ / rekonstruierter Zusammenhang des Schreibens
  choice: zu schreiben
  rationale: Im korrigierten Textzusammenhang geht es um die Vermittlung der Schreibkunst, nicht um ein bestimmtes Buch oder Schreibtafeln.
- source_word: በቀለም፡ ወበክርታስ (rekonstruiert aus der fehlerhaften Überlieferung im Prompt)
  choice: mit Tinte und Papier
  rationale: Die Wendung bezeichnet die materiellen Mittel des Schreibens; „Papier“ ist im modernen Deutsch verständlich, während die Fußnote die mögliche Bedeutung „Schreibmaterial/Papyrus“ offenhält.
- source_word: ብዙኃን
  choice: viele
  rationale: Direkte und natürliche Wiedergabe des quantitativen Ausdrucks.
- source_word: እለ፡ ይስሕቱ
  choice: sind viele abgeirrt
  rationale: Das Verb bezeichnet ein Abirren oder Irregehen. Das Perfekt verbindet das vergangene Geschehen idiomatisch mit „bis auf diesen Tag“.
- source_word: እምዓለም፡ ወእስከ፡ ለዓለም
  choice: von Ewigkeit zu Ewigkeit
  rationale: Die ungewöhnliche Wiederholung bleibt erhalten und wahrt den feierlich-apokalyptischen Klang; eine zeitliche Deutung als „von Zeitalter zu Zeitalter“ bleibt möglich.
- source_word: ወእስከ፡ ዛቲ፡ ዕለት
  choice: bis auf diesen Tag
  rationale: Geläufige, würdige Wiedergabe der fortdauernden zeitlichen Aussage.
theological_decisions:
- issue: Gegenstand der vermittelten Kenntnis
  choice: die Kunst, mit Tinte und Papier zu schreiben
  alternative: Schrifttafeln der Bitterkeit und Täuschung
  rationale: Der überlieferte Wortlaut im Prompt weist offenbar schwere Lesefehler auf; die dokumentierte Rekonstruktion ergibt „er lehrte sie … mit Tinte und Papier“. So bleibt die Polemik gegen vermittelte Schreibtechnik erkennbar, ohne aus dem beschädigten Text moralische Abstrakta zu konstruieren.
- issue: Zeitlicher Umfang des Abirrens
  choice: von Ewigkeit zu Ewigkeit
  alternative: von Zeitalter zu Zeitalter
  rationale: Die formelhafte Wiederholung von ዓለም kann sowohl „Ewigkeit“ als auch „Zeitalter“ bezeichnen. Der Haupttext bewahrt die erhabene Form, die Fußnote nennt die echte lexikalische Alternative.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem apokalyptischem Klang. Die markante Wiederholung „von Ewigkeit zu Ewigkeit“ wurde bewusst nicht geglättet. Die textkritische Unsicherheit des äthiopischen Ausgangstextes wird transparent in der Fußnote ausgewiesen.
