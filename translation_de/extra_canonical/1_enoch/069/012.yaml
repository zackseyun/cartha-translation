base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/012.yaml
  text: 'And the fifth was named Kasdeya[a]. This is the one who showed the children of men all the evil blows of spirits and of demons, and the blows in the womb, so that the embryo miscarries, and the blow upon the soul: the bite of the serpent[f][e][d][c][b], and the blow that comes at noon—the son of the serpent whose name is Taba''et.'
translation:
  language: de
  text: Und der Fünfte hieß Kasdeja. Er war es, der den Menschenkindern all die bösen Schläge[a] der Geister und Dämonen zeigte, auch die Schläge gegen die Leibesfrucht im Mutterleib, sodass sie ausgestoßen wird,[b] und den Schlag gegen die Seele:[c] den Biss der Schlange sowie den Schlag, der am Mittag kommt – den Sohn der Schlange, dessen Name Taba'et ist.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das wiederholte ge'ezische Wort kann außer „Schläge“ auch „Heimsuchungen“, „Plagen“ oder „schädliche Schläge“ bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Die Wendung über den Mutterleib ist schwierig. Wörtlich liegt wohl eine Konstruktionskette vor, die Schläge gegen die Leibesfrucht im Mutterleib und deren Verlust beschreibt.
    reason: textual_variant
  - marker: c
    text: Die Worte „den Schlag gegen die Seele“ sind in diesem Textzeugen unsicher überliefert; anders als bei den vorherigen Gliedern steht „Schlag“ hier wahrscheinlich im Singular.
    reason: textual_variant
  - marker: d
    text: 'Auch möglich: „der Schlag, der sich am Mittag ereignet“. Die letzten Worte können diesen mittäglichen Schaden mit einem schlangenartigen Wesen namens Taba''et gleichsetzen; ihr genauer syntaktischer Bezug bleibt unsicher.'
    reason: alternative_reading
lexical_decisions:
- source_word: ኃምስ ስሙ ካስድያእ
  choice: der Fünfte hieß Kasdeja
  rationale: Gibt die Listenformel in natürlichem, würdigem Deutsch wieder; der Eigenname wird eng am ge'ezischen Lautbestand transliteriert.
- source_word: ዘአርአዩ
  choice: zeigte
  rationale: Bewahrt die Grundbedeutung des Sichtbar- beziehungsweise Bekanntmachens, ohne sie vorschnell als formale Unterweisung auszulegen.
- source_word: ለውሉደ ሰብእ
  choice: den Menschenkindern
  rationale: Erhält die traditionelle apokalyptische Wendung, ist aber im modernen Deutschen verständlich.
- source_word: ኵሎ ዝብጠታተ እኩየ
  choice: all die bösen Schläge
  rationale: Bewahrt das wiederkehrende konkrete Bild des Schlagens und vermeidet eine Verengung auf bloß allgemeine Leiden.
- source_word: ዘነፍሳት ወዘአጋንንት
  choice: der Geister und Dämonen
  rationale: Erhält die Unterscheidung zwischen den beiden genannten Klassen oder Mächten.
- source_word: ዝብጠታተ ባእባአ ማሕፀን ከመ ይደቅ
  choice: die Schläge gegen die Leibesfrucht im Mutterleib, sodass sie abgeht
  rationale: Fasst die Konstruktion als gegen die Leibesfrucht gerichtete Schläge und gibt die Folge zurückhaltend als Abgang der Frucht wieder.
- source_word: '[ዝብጠተ ነፍስ]'
  choice: den Schlag gegen die Seele
  rationale: Wahrt den Wechsel zum Singular und kennzeichnet die Seele als Ziel des Schlages; die unsichere Überlieferung wird in einer Fußnote offengelegt.
- source_word: ንስክተ አርዌ
  choice: den Biss der Schlange
  rationale: Die konkrete Vorstellung eines Schlangenangriffs wird unmittelbar und idiomatisch wiedergegeben.
- source_word: ዝብጠተ ዘይከውን በቀትር
  choice: den Schlag, der am Mittag kommt
  rationale: Bewahrt die auffällige Zeitangabe und das wiederholte Schlagmotiv.
- source_word: ወልዳ ለአርዌ ዘስሙ ተባዕት
  choice: den Sohn der Schlange, dessen Name Taba'et ist
  rationale: Folgt der komprimierten ge'ezischen Benennung, ohne die syntaktische Beziehung zum Mittagsschlag endgültig festzulegen.
theological_decisions:
- issue: Art der von Kasdeja offenbarten Schäden
  choice: Eine Reihe unheilvoller, mit Geistern und Dämonen verbundener Schläge oder Heimsuchungen
  alternative: Neutrales Wissen über Waffen oder ausschließlich magische Formeln
  rationale: Geister, Dämonen, Mutterleib, Seele und Schlange bilden eine apokalyptische Reihe schädlicher Mächte oder Wirkungen; die Übersetzung lässt offen, ob damit Angriffe, Heimsuchungen oder deren geheimes Wissen gemeint sind.
- issue: Bezug von „Sohn der Schlange“
  choice: Als nähere, aber syntaktisch unsichere Bestimmung des mittäglichen Schlages wiedergegeben
  alternative: Eine eigenständige dämonische Gestalt oder eine Bezeichnung der Schlange selbst
  rationale: Der verdichtete Satzbau legt eine Apposition nahe, erlaubt jedoch keine sichere Auflösung; der Gedankenstrich und die Fußnote erhalten diese Spannung.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, apokalyptischem Ton. Die wiederholte Bildsprache von „Schlag“ bleibt hörbar; schwer verständliche oder textkritisch unsichere Stellen werden nicht geglättet, sondern knapp erläutert.
