base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/022.yaml
  text: And likewise heaven[a], the spirits of the winds, and all the spirits[d][c][b], and their paths from all the gatherings of spirits.
translation:
  language: de
  text: Und ebenso der Himmel, die Geister der Winde und alle Geister sowie ihre Bahnen aus allen Scharen von Geistern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der äthiopische Wortlaut ist schwierig und bildet offenbar eine verblose Aufzählung. Wörtlicher kann die mittlere Wendung auch „die Winde der Winde“ heißen. Für „Bahnen“ sind außerdem „Wege“, „Läufe“ oder „Bewegungen“ möglich, und „Scharen“ kann auch als „Versammlungen“ oder „Gruppen“ verstanden werden.
    reason: textual_variant
lexical_decisions:
- source_word: ሰማይ
  choice: der Himmel
  rationale: Der äthiopische Singular bezeichnet hier den kosmischen Bereich; „Himmel“ bewahrt das apokalyptische Register besser als „Himmelsgewölbe“ oder „Luftraum“.
- source_word: ነፋሳቲሆሙ ለነፋሳት
  choice: die Geister der Winde
  rationale: Die Konstruktion wird als vorwegnehmende Genitivverbindung verstanden. „Geister der Winde“ folgt der jüngsten geprüften Fassung und wahrt zugleich die semantische Nähe von Atem, Wind und Geist.
- source_word: መንፈሳት
  choice: Geister
  rationale: Im kosmologisch-apokalyptischen Zusammenhang ist „Geister“ angemessen und vermeidet eine unnötige anthropologische Festlegung auf „Seelen“.
- source_word: ወፍናዋቲሆሙ
  choice: sowie ihre Bahnen
  rationale: Das schwierige Wort bezeichnet wahrscheinlich Wege, Verläufe oder geordnete Bewegungen; „Bahnen“ passt zum kosmischen Zusammenhang, ohne eine genaue Mechanik festzulegen.
- source_word: እምኵሉ ኅብራት መንፈሳት
  choice: aus allen Scharen von Geistern
  rationale: „Scharen“ gibt den kollektiven Sinn von ኅብራት würdig und verständlich wieder; auch „Versammlungen“ oder „Gruppen“ sind möglich.
theological_decisions:
- issue: Unterscheidung von Geistern, Seelen und Winden
  choice: Die wiederholte Form መንፈሳት wird als „Geister“ wiedergegeben; in der Genitivfügung steht „Geister der Winde“.
  alternative: „Winde der Winde“ beziehungsweise „Seelen“
  rationale: So bleibt die kosmologische Bildwelt erhalten, ohne eine spätere Lehre über das Verhältnis von Leib und Seele in den Text einzutragen. Die lexikalische Spannung zwischen Wind, Atem und Geist wird in der Fußnote offengelegt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die elliptische Listenstruktur des äthiopischen Textes bleibt erhalten; es wird kein im Ausgangstext fehlendes Verb ergänzt.
