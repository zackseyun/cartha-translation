base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/014.yaml
  text: This one asked Mikael to show him the hidden name[a], so that they might remember it in the oath, and so that they might tremble before that name and oath[d][c][b], those who revealed to the children of men all that is hidden.
translation:
  language: de
  text: Dieser sagte zu Mikael, er solle ihm den verborgenen Namen[a] zeigen, damit jene ihn beim Eid erwähnten[b] und vor diesem Namen und Eid erzitterten, die den Menschenkindern alles Verborgene enthüllt hatten.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „den geheimen Namen“. Das ge’ezische Wort bezeichnet etwas Verborgenes oder Verhülltes und verlangt keinen späteren mystischen Fachsinn.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich kann die Wendung auch „seiner beim Eid gedenken“ heißen. Im Zusammenhang kann damit gemeint sein, den Namen bei einer feierlichen Beschwörung anzurufen.
    reason: lexical_alternative
  - marker: c
    text: 'Der Schlusssatz bezeichnet wahrscheinlich diejenigen, die erzittern sollen: jene, die den Menschen verborgene Dinge enthüllten. Wegen der gedrängten Syntax ist auch ein allgemeinerer Bezug der Mehrzahl möglich.'
    reason: alternative_reading
lexical_decisions:
- source_word: ዝንቱ
  choice: Dieser
  rationale: Das Demonstrativpronomen verweist betont auf die zuvor genannte Gestalt und bewahrt diese deiktische Wirkung besser als ein bloßes „er“.
- source_word: ይቤሎ ለሚካኤል ያርእዮ
  choice: sagte zu Mikael, er solle ihm … zeigen
  rationale: „Sagte zu“ gibt die Redeformel eng wieder; der deutsche indirekte Aufforderungssatz bildet den Jussiv/Subjunktiv mit Objektsuffix ab, ohne ihn fälschlich als direkten Imperativ zu behandeln.
- source_word: ስመ ኅቡአ
  choice: den verborgenen Namen
  rationale: „Verborgen“ entspricht dem Sinn von verborgen oder verhüllt, ohne einen späteren mystischen Fachbegriff vorauszusetzen.
- source_word: ከመ ይዝክርዎ በመሐላ
  choice: damit … ihn beim Eid erwähnten
  rationale: Das Verb umfasst Erinnern, Gedenken und Erwähnen. Im Zusammenhang mit einem Eid ist „erwähnen“ natürlich und lässt eine feierliche Anrufung als mögliche Nuance offen.
- source_word: ከመ ይርዓዱ እምውእቱ ስም ወማሐላ
  choice: und vor diesem Namen und Eid erzitterten
  rationale: „Erzittern vor“ bewahrt sowohl die körperlich starke Furcht als auch Name und Eid als deren Anlass.
- source_word: እለ አርአዩ ለውሉደ ሰብእ ኵሎ ዘበኅቡእ
  choice: die den Menschenkindern alles Verborgene enthüllt hatten
  rationale: Die Relativkonstruktion wird als nähere Bestimmung der pluralischen Handelnden verstanden. „Menschenkinder“ erhält die traditionelle anthropologische Wendung, während „enthüllt“ die verbotene Offenbarung verborgener Dinge ausdrückt.
theological_decisions:
- issue: Bezug des pluralischen Subjekts bei „erwähnten“ und „erzitterten“
  choice: Es sind jene, die den Menschenkindern das Verborgene enthüllt hatten.
  alternative: Der Plural kann allgemeiner alle meinen, die den Eid hören oder gebrauchen; zudem könnte die gedrängte Syntax einen Subjektwechsel enthalten.
  rationale: Der abschließende Relativsatz bestimmt am naheliegendsten die zuvor implizierte Mehrzahl. Die Fußnote hält die syntaktische Unsicherheit offen.
- issue: Art der an Mikael gerichteten Äußerung
  choice: 'Indirekte Aufforderung: „sagte …, er solle“'
  alternative: „bat Mikael“ oder eine direkte Aufforderung „Zeige ihm“
  rationale: Diese Fassung bewahrt sowohl die lexikalische Bedeutung der Redeformel als auch die jussivische Form von ያርእዮ, ohne den Ton unnötig als Bitte oder Befehl festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dieser“ und „Menschenkinder“ bewahren die markierte, apokalyptische Ausdrucksweise; der indirekte Aufforderungssatz bleibt zugleich verständlich und gibt die ge’ezische Grammatik genauer wieder.
