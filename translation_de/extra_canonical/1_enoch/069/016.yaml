base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/016.yaml
  text: And these are the hidden things of this oath [a]. . . and it is made firm by his oath, and heaven was suspended before the world was created[d][c][b], and by it forever.
translation:
  language: de
  text: Und dies sind die verborgenen Dinge dieses Eides[a] … und er ist durch seinen Eid gefestigt; der Himmel wurde aufgehängt, bevor die Welt[b] erschaffen wurde, und bleibt durch ihn für immer aufgehängt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Anfang des Verses ist in dieser äthiopischen Textüberlieferung schwierig; die Auslassungspunkte kennzeichnen nach „dieses Eides“ beschädigten oder unsicher überlieferten Text.
    reason: textual_variant
  - marker: b
    text: 'Oder: „das Zeitalter“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich steht am Schluss knapp: „und bis in Ewigkeit durch ihn/in ihm“. Wahrscheinlich bezieht sich „ihn“ auf den Eid; der Bezug könnte jedoch auch anders verstanden werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: እሉንቱ እሙንቱ
  choice: dies sind
  rationale: Die pluralische Demonstrativ-Kopula wird im Deutschen natürlich mit „dies sind“ wiedergegeben.
- source_word: ኅቡኣቲሁ ለዝ ማሐላ
  choice: die verborgenen Dinge dieses Eides
  rationale: Bewahrt den Gedanken verborgener apokalyptischer Wirklichkeiten und gibt die Zugehörigkeit zum Eid wieder, ohne den Ausdruck vorschnell auf Worte oder Lehren einzuengen.
- source_word: ፅኑዕ በመሐላሁ
  choice: er ist durch seinen Eid gefestigt
  rationale: „Gefestigt“ wahrt die resultative Bedeutung von Beständigkeit; „durch“ gibt die instrumentale Funktion des Eides wieder. Das Pronomen bleibt wie im Ausgangstext kontextabhängig.
- source_word: ሰማይ ተሰቅለ
  choice: der Himmel wurde aufgehängt
  rationale: Die konkrete kosmologische Vorstellung des Hängens wird beibehalten und nicht zum allgemeineren „gegründet“ oder „befestigt“ abgeschwächt.
- source_word: ዘእንበለ ይትፈጠር ዓለም
  choice: bevor die Welt erschaffen wurde
  rationale: Gibt die zeitliche Vorordnung klar wieder; „Welt“ ist im kosmologischen Zusammenhang die naheliegende Bedeutung von ዓለም.
- source_word: ወእስከ ለዓለም ቦቱ
  choice: und bleibt durch ihn für immer aufgehängt
  rationale: „Durch ihn“ berücksichtigt die instrumentale Bedeutung von ቦቱ. Das aus dem vorigen Satzglied ergänzte „aufgehängt“ macht den knappen äthiopischen Anschluss im Deutschen verständlich, während eine Fußnote die wörtliche und referenzielle Unsicherheit festhält.
theological_decisions:
- issue: Art der mit dem Eid verbundenen verborgenen Dinge
  choice: konkret-apokalyptisch offen als „verborgene Dinge“
  alternative: „Geheimnisse“ oder „geheime Worte des Eides“
  rationale: Der Kontext handelt von kosmischen Mächten und Ordnungen. Die gewählte Formulierung bewahrt diese Weite, ohne eine bestimmte dogmatische Deutung einzutragen.
- issue: Kosmologisches Bild des Himmels
  choice: Der Himmel wird „aufgehängt“
  alternative: Der Himmel wird „gegründet“ oder „befestigt“
  rationale: Die anschauliche Aussage des ge’ezischen Verbs wird gewahrt und nicht in abstrakte Schöpfungssprache umgedeutet.
- issue: Bezug des abschließenden Pronomens
  choice: „durch ihn“ bleibt grammatisch mehrdeutig; im Zusammenhang liegt der Eid nahe
  alternative: ausdrückliche Festlegung auf „durch den Eid“
  rationale: Die instrumentale Bedeutung ist gut begründet, doch der pronominale Bezug ist im überlieferten Wortlaut nicht völlig eindeutig und soll daher nicht stillschweigend festgelegt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener apokalyptischer Bildsprache. Die Ellipse der Vorlage wird sichtbar gelassen; notwendige syntaktische Ergänzungen werden möglichst gering gehalten und in der Fußnote offengelegt.
