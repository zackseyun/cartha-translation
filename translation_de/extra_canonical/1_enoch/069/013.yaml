base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/013.yaml
  text: This is the secret of Kasbeel[a], the chief of the oath which he showed to the holy ones when he dwelt in glory on high[d][c][b], and its name is Biqa.
translation:
  language: de
  text: Dies ist das Geheimnis[a] Kasbeels, des Obersten des Eides[b], den er den Heiligen[c] zeigte, als er droben in Herrlichkeit wohnte; und sein Name ist Biqa.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch »Aufgabe« ist als kontextbezogene Wiedergabe vorgeschlagen worden. Die genaue Nuance des geezischen Wortes ist unsicher.
    reason: lexikalische Alternative
  - marker: b
    text: »Eid« kann hier auch eine feierliche Beschwörung oder eine mit einem Namen verbundene Eidesformel bezeichnen.
    reason: lexikalische Alternative
  - marker: c
    text: Mit den »Heiligen« sind in diesem visionären Zusammenhang wahrscheinlich himmlische Wesen gemeint.
    reason: Kontexthinweis
  - marker: d
    text: 'Worauf sich »sein« bezieht, ist nicht völlig eindeutig: Gemeint sein kann das Geheimnis beziehungsweise die damit verbundene Formel, möglicherweise aber auch Kasbeel.'
    reason: Mehrdeutigkeit
lexical_decisions:
- source_word: ጐልቁ
  choice: Zahl
  rationale: Das Wort gehört zum Bedeutungsfeld des Zählens und bezeichnet wörtlich eine »Zahl« oder »Summe«. Obwohl »Zahl Kasbeels« im Zusammenhang schwer verständlich bleibt, wird die Unsicherheit des überlieferten Textes nicht durch die kontextuell eingängigeren, aber lexikalisch schwächer belegten Wiedergaben »Geheimnis« oder »Aufgabe« verdeckt.
- source_word: ካስብኤል
  choice: Kasbeel
  rationale: Der Personenname wird nahe an der geezischen Form transliteriert und nicht übersetzt.
- source_word: ርእሰ ማሐላ
  choice: Oberster des Eides
  rationale: ርእስ bedeutet wörtlich »Kopf« und kann Rang oder Vorrang ausdrücken; zusammen mit ማሐላ ergibt sich die natürliche und dennoch formnahe Wendung »Oberster des Eides«.
- source_word: ዘአርአዩ
  choice: den er … zeigte
  rationale: Die Kausativform bezeichnet ein Zeigen oder Sichtbarmachen. »zeigte« wahrt den visionären Sprachgebrauch, ohne ausdrücklich »offenbarte« in den Text hineinzulesen.
- source_word: ለቅዱሳን
  choice: den Heiligen
  rationale: Die substantivierte Pluralform wird wörtlich wiedergegeben. Im himmlischen Kontext sind wahrscheinlich heilige Wesen gemeint; diese Deutung wird jedoch nicht in den Haupttext eingebaut.
- source_word: ሶበ ኆደሩ
  choice: als er … wohnte
  rationale: Die Wendung bezeichnet den zeitlichen Umstand und ein Wohnen, Verweilen oder Bleiben; »als er … wohnte« ist formnah und im Deutschen verständlich.
- source_word: በልዑል በስብሐት
  choice: droben in Herrlichkeit
  rationale: Die Wiedergabe bewahrt sowohl die Vorstellung der Höhe als auch die der Herrlichkeit und klingt im Deutschen würdig, ohne den Ausdruck unnötig auszubauen.
- source_word: ወስሙ ቢቃ
  choice: und sein Name ist Biqa
  rationale: Das geezische Suffix ist grammatisch maskulin und lässt den Bezug im Kontext nicht völlig eindeutig erkennen. Das deutsche »sein« bewahrt diese Mehrdeutigkeit besser als eine ausdrücklich aufgelöste Formulierung.
theological_decisions:
- issue: Identität der »Heiligen«
  choice: Die wörtliche Bezeichnung »die Heiligen« bleibt im Haupttext stehen.
  alternative: »die heiligen Wesen« oder ausdrücklich »die Engel«
  rationale: Der himmlische Offenbarungsrahmen spricht wahrscheinlich für himmlische Wesen. Eine ausdrückliche Gleichsetzung mit Engeln würde die im Wortlaut verbleibende Offenheit jedoch unnötig auflösen.
- issue: Bedeutung des »Eides«
  choice: Der Grundsinn »Eid« wird beibehalten.
  alternative: »Beschwörung« oder »Eidesformel«
  rationale: Der Kontext kann auf eine feierliche, mit einem Namen verbundene Beschwörung weisen, doch der geezische Ausdruck stützt unmittelbar »Eid«. Weitergehende Deutungen gehören in die Fußnote.
- issue: Bezug von »sein Name«
  choice: Der mehrdeutige pronominale Ausdruck wird als »sein Name« bewahrt.
  alternative: »der Name des Eides/der Formel« oder »Kasbeels Name«
  rationale: Der Text kann sich auf den zuvor genannten Eid beziehungsweise eine damit verbundene Formel beziehen; grammatisch ist auch ein Bezug auf Kasbeel denkbar. Die Übersetzung entscheidet diese Frage nicht stillschweigend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an den geezischen Wortlaut. Die ungewöhnliche Wendung »die Zahl Kasbeels« bleibt bewusst stehen, weil eine glättende Deutung als »Geheimnis« oder »Aufgabe« lexikalisch nicht hinreichend gesichert ist.
