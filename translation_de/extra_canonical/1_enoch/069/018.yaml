base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/018.yaml
  text: And by that oath the sea was created[a], and as its foundation for the time of wrath he set sand for it[c][b], and it does not pass beyond it from the creation of the world and forever.
translation:
  language: de
  text: Und durch diesen Schwur wurde das Meer geschaffen, und als seine Grundfeste[b] setzte er ihm für die Zeit des Zorns[a] Sand; und es überschreitet sie nicht, von der Erschaffung der Welt an bis in Ewigkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die schwierige Wendung kann auch allgemeiner als „für eine Zeit des Gerichts“ verstanden werden.
    reason: lexical_alternative
  - marker: b
    text: „Grundfeste“ kann hier die feste Grundlage oder die dem Meer gesetzte Grenze meinen; im Bild bildet der Sand die Grenze, die es nicht überschreitet.
    reason: lexical_alternative
lexical_decisions:
- source_word: ማሐላ
  choice: Schwur
  rationale: „Schwur“ gibt die im Zusammenhang kosmisch wirksame Eidesformel natürlich und präzise wieder; „Fluch“ passt hier weniger zur schöpferischen Funktion.
- source_word: ተፈጥረት
  choice: wurde … geschaffen
  rationale: Die Passivform und der kosmologische Schöpfungsbezug des Ge’ez bleiben erhalten.
- source_word: ባሕር
  choice: das Meer
  rationale: Der bestimmte Artikel entspricht dem Meer als dem hier behandelten kosmischen Element.
- source_word: መሠረታ
  choice: seine Grundfeste
  rationale: Das Wort bezeichnet Fundament oder Grundlage. „Grundfeste“ bewahrt das konkrete kosmologische Bild, ohne es vorschnell ausschließlich als Küstenlinie zu deuten.
- source_word: ለጊዜ መዓት
  choice: für die Zeit des Zorns
  rationale: Die schwierige Verbindung aus Zeit und Zorn beziehungsweise Gericht wird eng am Wortlaut und im apokalyptischen Register wiedergegeben.
- source_word: አንበረ ላቲ ኆፃ
  choice: setzte er ihm … Sand
  rationale: Die Formulierung bewahrt das Setzen oder Platzieren des Sandes für das Meer und klingt zugleich im Deutschen natürlich.
- source_word: ወኢትኅልፍ
  choice: und es überschreitet sie nicht
  rationale: Das Verb bezeichnet das Hinübergehen oder Überschreiten; das feminine Pronomen bezieht sich im deutschen Satz auf die Grundfeste als gesetzte Grenze.
- source_word: እምፍጥረተ ዓለም ወእስከ ለዓለም
  choice: von der Erschaffung der Welt an bis in Ewigkeit
  rationale: Die Wendung bezeichnet eine ununterbrochene Dauer von der Weltschöpfung bis in alle Zukunft.
theological_decisions:
- issue: Ist der Sand lediglich eine natürliche Küstenlinie oder eine gesetzte kosmische Grenze mit Gerichtsklang?
  choice: Das konkrete Bild vom als Grundfeste gesetzten Sand und die „Zeit des Zorns“ werden beide beibehalten.
  alternative: 'Dynamisch: „Er setzte dem Meer eine feste Grenze“; oder die schwierige Zornesformel abschwächen beziehungsweise auslassen.'
  rationale: Der Ge’ez-Text verbindet Schöpfungsordnung, eine physische Grenzvorstellung und apokalyptische Zornes- beziehungsweise Gerichtssprache. Die Übersetzung erhält diese Spannung, statt sie auf eine rein natürliche oder dogmatisch festgelegte Aussage zu reduzieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde zur besseren Verständlichkeit leicht gegliedert; das ungewöhnliche kosmologische Bild und die Mehrdeutigkeit der Zornesformel bleiben erhalten.
