base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/015.yaml
  text: And this is the power of this oath, for it is mighty and firm; and he placed this oath, Aka'e, into the hand of Mika'el.
translation:
  language: de
  text: Und dies ist die Macht dieses Eides, denn er ist mächtig und fest; und er legte diesen Eid, Aka’e, in die Hand Mika’els.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in die Hand Mika’els“; die Wendung kann bedeuten, dass ihm der Eid anvertraut oder seiner Autorität unterstellt wurde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኃይሉ
  choice: die Macht
  rationale: Das Substantiv bezeichnet Kraft oder Macht; „Macht“ bewahrt hier die feierliche Wirksamkeit des Eides.
- source_word: ለዝ፡ ማሐላ
  choice: dieses Eides
  rationale: Der Demonstrativausdruck ዝ ist proximal („dieser“), und ማሐላ bezeichnet den im Kontext behandelten Eid.
- source_word: ኃያል
  choice: mächtig
  rationale: Prädikativ auf den Eid bezogen bezeichnet das Adjektiv dessen Wirkmacht und wahrt den gehobenen apokalyptischen Ton.
- source_word: ፅኑዕ
  choice: fest
  rationale: Das Adjektiv drückt Festigkeit und Unerschütterlichkeit aus; „fest“ ist präzise und natürlich.
- source_word: አንበሮ
  choice: er legte
  rationale: Das Verb bedeutet konkret „setzen/legen“; „legte“ erhält das Bild der Übergabe in die Hand.
- source_word: አካእ
  choice: Aka’e
  rationale: Der ausdrücklich überlieferte Eigenname des Eides wird transliteriert und nicht ausgelassen.
- source_word: በእዴሁ፡ ለሚካኤል
  choice: in die Hand Mika’els
  rationale: Die konkrete Hand-Metapher wird bewahrt; sie kann zugleich Anvertrauen oder Unterstellung unter Autorität ausdrücken.
theological_decisions:
- issue: Konkrete oder deutende Wiedergabe der Hand-Wendung
  choice: in die Hand Mika’els
  alternative: Mika’el anvertraute / unter Mika’els Autorität stellte
  rationale: Der ge’ezische Wortlaut ist konkret und bildhaft. Die Hauptübersetzung bewahrt dieses apokalyptische Bild, während die Fußnote den wahrscheinlichen übertragenen Sinn nennt.
- issue: Bezug von Aka’e
  choice: Apposition zu „diesen Eid“
  alternative: Aka’e als syntaktisch anders angebundener Eigenname
  rationale: Die Stellung im Satz legt nahe, dass Aka’e den Eid benennt. Die appositionelle Zeichensetzung macht dies sichtbar, ohne zusätzliche theologische Deutung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter Bildsprache. Die Namen werden quellennah als Aka’e und Mika’el wiedergegeben; das wiederholte „dieses Eides/diesen Eid“ bildet die Wiederholung des Ausgangstextes ab.
