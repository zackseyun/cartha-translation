  source_fidelity: 'Der deutsche Text gibt die ge’ezische Abfolge und die entscheidenden Elemente vollständig wieder: die Macht dieses (nicht jenes) Eides, dessen Mächtigkeit und Festigkeit, die erneute Nennung des Eides sowie den Namen Aka’e und die Übergabeformel an Mika’el. Die Apposition „diesen Eid, Aka’e“ macht die im Ausgangstext bezeugte Benennung des Eides sichtbar, ohne mehr zu behaupten als der Text hergibt.'
  naturalness: „Und dies ist die Macht dieses Eides, denn er ist mächtig und fest; und er legte diesen Eid, Aka’e, in die Hand Mika’els“ ist verständliches, würdiges modernes Standarddeutsch. Die leicht formelhafte Wiederholung von „diesem/diesen Eid“ ist hier als quellennahe Wiederholung angemessen.
  terminology: „Macht“, „Eid“, „mächtig“ und „fest“ treffen die semantischen Werte angemessen. Die Transliterationen Aka’e und Mika’el sind konsistent mit der vorgegebenen Namenspolitik. Die konkrete Wendung „in die Hand Mika’els“ bewahrt die Bildsprache; die Fußnote erläutert ihre mögliche idiomatische Bedeutung, ohne diese dem Haupttext aufzuzwingen.
