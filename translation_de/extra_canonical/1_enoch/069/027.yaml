base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/069/027.yaml
  text: And he sat upon the throne of his glory[a].
translation:
  language: de
  text: Und er saß auf dem Thron seiner Herrlichkeit.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Verb kann allgemeiner „war“ oder „blieb“ bedeuten; hier wird es mit „saß“ wiedergegeben, weil von einem Thron die Rede ist und die Szene das Sitzen auf dem Thron beziehungsweise das Thronen schildert.
    reason: lexical_alternative
lexical_decisions:
- source_word: ነበረ
  choice: saß
  rationale: Das Verb kann allgemein „war“, „blieb“ oder „wohnte“ bedeuten. In Verbindung mit „auf“ und „Thron“ bezeichnet es hier am natürlichsten das Sitzen auf dem Thron, ohne die weitere Bedeutungsspanne zu verschweigen.
- source_word: ዲበ
  choice: auf
  rationale: Die räumliche Präposition bedeutet „auf/über“. Das natürliche moderne Deutsch verlangt bei einem Thron „auf“.
- source_word: መንበረ
  choice: Thron
  rationale: Das Wort kann allgemein einen Sitz bezeichnen; im visionären, königlichen Kontext gibt „Thron“ das Bild angemessen wieder.
- source_word: ስብሐቲሁ
  choice: seiner Herrlichkeit
  rationale: Die Form bezeichnet Herrlichkeit, Glanz oder Ruhm mit einem Suffix der dritten Person. „Seiner Herrlichkeit“ bewahrt die ge'ezische Genitivfügung und ihren würdevollen Klang.
theological_decisions:
- issue: Ob ነበረ bloßes Sein beziehungsweise Verbleiben oder ein Sitzen auf dem Thron ausdrückt
  choice: Und er saß auf dem Thron seiner Herrlichkeit.
  alternative: Und er war auf dem Thron seiner Herrlichkeit. / Und er blieb auf dem Thron seiner Herrlichkeit.
  rationale: Der Thron als Bezugswort legt ein Sitzen nahe und erhält das apokalyptische Thronbild. Die allgemeinere lexikalische Möglichkeit wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Auf“ ist natürlicher als das altertümliche „auf ... darauf“ oder ein gehobenes „auf dem Throne“; die traditionelle Wendung „Thron seiner Herrlichkeit“ bewahrt das visionäre Bild.
