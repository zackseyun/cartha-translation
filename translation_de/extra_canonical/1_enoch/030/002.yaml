  text: And I saw a beautiful tree[a], which resembled a fragrant tree[b], like the mastic tree.
translation:
  language: de
  text: Und ich sah einen schönen Baum, der einem wohlriechenden Baum glich, etwa einem Mastixbaum[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bestimmung des Pflanzennamens ist unsicher; wahrscheinlich ist der Mastixstrauch oder die Lentiske gemeint, die für ihr aromatisches Harz bekannt ist.
