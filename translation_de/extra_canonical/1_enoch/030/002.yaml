lexical_decisions:
- source_word: ወርኢኩ
  choice: Und ich sah
  rationale: Die übliche visionäre Erzählform wird schlicht wiedergegeben; die Konjunktion wahrt die fortlaufende Schilderung.
- source_word: ዕፀ፡ ሠናየ
  choice: einen schönen Baum
  rationale: ዕፀ bezeichnet hier einen Baum, ሠናየ dessen Schönheit beziehungsweise ansprechende Beschaffenheit.
- source_word: ዘይመስል
  choice: der … glich
  rationale: Die Relativform bezeichnet ausdrücklich eine Ähnlichkeit und wird daher nicht zu einer bloßen Aussage über den Duft umgeformt.
- source_word: ዕፀ፡ መዓዛ
  choice: einem wohlriechenden Baum
  rationale: Die wörtlich anmutende Verbindung ‚Baum des Duftes‘ wird natürlich, aber unter Beibehaltung des zweiten Vorkommens von ‚Baum‘ wiedergegeben.
- source_word: ከመ
  choice: einem
  rationale: Die anschließende Apposition entfaltet den Vergleich im Deutschen idiomatisch; die vergleichende Funktion bleibt erhalten.
- source_word: እንተ፡ ዘስኪኖን
  choice: Mastixbaum
  rationale: Der schwierige Pflanzenname wird entsprechend der wahrscheinlichsten Bestimmung als Mastixbaum wiedergegeben; die Unsicherheit steht in der Fußnote.
