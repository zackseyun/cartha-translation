  terminology: „Berge im Osten“, „ein anderer Ort“ und „Tal voller Wasser“ sind sachgerecht und registerangemessen. „Tal voller Wasser“ ist eine natürliche deutsche Entfaltung von „Tal von Wassern“; die Fußnote dokumentiert die wörtlichere Möglichkeit. Es werden keine theologischen oder allegorisierenden Zusätze eingeführt.
