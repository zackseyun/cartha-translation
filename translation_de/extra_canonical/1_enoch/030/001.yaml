base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/030/001.yaml
  text: And above them[a], above those mountains of the east, not far away, I saw another place, a valley of waters[c][b], as though it were inexhaustible.
translation:
  language: de
  text: 'Und über ihnen, über jenen Bergen im Osten, nicht weit entfernt, sah ich einen anderen Ort: ein Tal voller Wasser[a], als wäre es unerschöpflich.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „ein Tal von Wassern“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die äthiopische Schlusswendung ist schwierig. Sie kann auch bedeuten: „als könnte es nicht entleert werden“ oder „als ginge es nicht aus“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ላዕሌሁ / ላዕለ
  choice: über ihnen, über
  rationale: Die wiederholte Präposition bezeichnet die räumliche Lage und bewahrt die gestufte Geografie der Vision.
- source_word: እሙንቱ
  choice: ihnen / jenen
  rationale: Das Pronomen verweist auf zuvor genannte Erscheinungen; im Zusammenhang mit den Bergen ist „jenen“ natürlich und hinreichend bestimmt.
- source_word: ተደብረ፡ ጽባሕ
  choice: Bergen im Osten
  rationale: Trotz der fehlerverdächtigen Überlieferungsform spricht die revidierte Analyse für eine Wendung mit „Berge“ und „Osten“. „Im Osten“ ist idiomatisches modernes Deutsch und wahrt die geografische Angabe.
- source_word: አኮ፡ ርሑቀ
  choice: nicht weit entfernt
  rationale: Die Formulierung gibt relative räumliche Nähe an und folgt in der Übersetzung ihrer Stellung vor dem Wahrnehmungsverb.
- source_word: ወርኢኩ
  choice: sah ich
  rationale: Dies ist die gewöhnliche Formel eines unmittelbaren visionären Berichts.
- source_word: መካነ፡ ካልአ
  choice: einen anderen Ort
  rationale: Die Wendung bezeichnet einen weiteren Ort in der fortschreitenden Schau.
- source_word: ቈላ፡ ማያት
  choice: ein Tal voller Wasser
  rationale: „Tal“ bildet die Geländeform ab; „voller Wasser“ gibt den äthiopischen Plural in natürlichem Deutsch wieder, ohne ihn auf Bäche oder Flüsse einzuengen.
- source_word: ከመ፡ ዘኢይትዌጸእ
  choice: als wäre es unerschöpflich
  rationale: Die schwierige Schlusswendung vermittelt wahrscheinlich den Eindruck, dass das Wasser nicht ausgeht oder nicht ausgeschöpft werden kann; die Übersetzung lässt die genaue hydraulische Vorstellung offen.
theological_decisions:
- issue: Konkretheit der visionären Geografie
  choice: Der Ort erscheint als wirklich geschautes Tal voller Wasser innerhalb der Vision.
  alternative: Das Tal bereits im Haupttext symbolisch oder verallgemeinernd deuten.
  rationale: Die konkrete topografische Bildsprache der apokalyptischen Schau soll erhalten bleiben, ohne ihr eine bestimmte allegorische oder konfessionelle Auslegung aufzuerlegen.
- issue: Mehrdeutigkeit der schwierigen Schlusswendung
  choice: „als wäre es unerschöpflich“ mit erläuternder Fußnote
  alternative: „als könnte es nicht entleert werden“ oder „als liefe es nicht aus“
  rationale: Die gewählte Form wahrt den Eindruck unversiegenden Wassers, ohne die unsichere Verbnuance stillschweigend festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit konkreter apokalyptischer Bildsprache. Die Satzfolge folgt soweit möglich dem revidierten ge’ezischen Befund; Überlieferungsunsicherheit und Bedeutungsbreite der Schlusswendung werden nicht verdeckt.
