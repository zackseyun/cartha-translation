base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/030/003.yaml
  text: And by the edges of those valleys I saw fragrant cinnamon[c][b][a], and beyond them I went toward the east.
translation:
  language: de
  text: Und an den Rändern jener Täler sah ich duftenden Zimt, und über sie hinaus ging ich nach Osten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Wendung kann auch verstanden werden: „… und an ihnen vorbei näherte ich mich dem Osten.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: መንገለ
  choice: an / über … hinaus / nach
  rationale: 'Die dreimal vorkommende Präposition erhält je nach räumlichem Zusammenhang eine natürliche deutsche Wiedergabe: Lage an den Rändern, Bewegung über die genannten Orte hinaus und Richtung nach Osten.'
- source_word: ክንፈሩ
  choice: Rändern
  rationale: Das topografisch gebrauchte Wort bezeichnet hier Rand, Saum oder Kante eines Geländes; „Rändern“ gibt den Plural und den konkreten Bezug auf die Täler präzise wieder.
- source_word: ቈላት
  choice: Täler
  rationale: Die übliche und verständliche Wiedergabe des Geländebegriffs im Deutschen.
- source_word: ርኢኩ
  choice: sah ich
  rationale: Bewahrt die direkte Ich-Erzählung des visionären Berichts.
- source_word: ቀናንሞስ
  choice: Zimt
  rationale: Das Lehnwort bezeichnet eine Zimt- beziehungsweise Kassia-Art; „Zimt“ ist die klarste konkrete Wiedergabe.
- source_word: ዘመዓዛ
  choice: duftenden
  rationale: Gibt die ausdrücklich genannte aromatische Eigenschaft knapp und sinnlich wieder.
- source_word: ቀረብኩ
  choice: ging ich
  rationale: Im Zusammenhang beschreibt das Verb die weitere Bewegung in östlicher Richtung. „Ging ich“ ist natürliches Deutsch, ohne eine erreichte Ankunft zu behaupten.
- source_word: ጽባሕ
  choice: Osten
  rationale: Der Ausdruck bezeichnet in diesem geografischen Zusammenhang die östliche Richtung beziehungsweise die Gegend des Sonnenaufgangs.
theological_decisions:
- issue: Bestimmung der aromatischen Pflanze in der visionären Landschaft
  choice: Zimt
  alternative: Kassia oder eine nicht näher bestimmte aromatische Pflanze
  rationale: Das ge’ezische Lehnwort weist auf Zimt beziehungsweise eine eng verwandte aromatische Art. Die konkrete Benennung bewahrt die anschauliche apokalyptische Bildwelt, ohne sie unnötig zu verallgemeinern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit einfacher visionärer Erzählweise. „Rändern“ folgt dem konkreten topografischen Sinn; die Fußnote bewahrt die Mehrdeutigkeit der zweiten Präposition und des Bewegungsverbs.
