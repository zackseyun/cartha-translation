base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/045.yaml
  text: And the Lord of the sheep sent a sheep to another sheep[a], and raised him up so that he might become a ram and might lead the sheep in place of that ram[c][b], which had abandoned his glory.
translation:
  language: de
  text: Und der Herr der Schafe sandte ein Schaf zu einem anderen Schaf und erhob es, damit es ein Widder werde und die Schafe anstelle jenes Widders führe, der seine Herrlichkeit[a] aufgegeben hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Ehre“ beziehungsweise „seinen Glanz“. Gemeint sein kann der Rang oder die Würde des Widders, nicht nur sichtbarer Glanz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕ
  choice: der Herr der Schafe
  rationale: Bewahrt den erhabenen Titel und macht die Beziehung zu den Schafen entsprechend dem Kontext ausdrücklich.
- source_word: በግዕ ... ካልእ በግዕ
  choice: ein Schaf zu einem anderen Schaf
  rationale: Das Substantiv bezeichnet hier am sichersten ein Schaf; diese Wiedergabe wahrt zudem die erzählerische Kontinuität und vermeidet die unbelegte Altersangabe „Lamm“.
- source_word: አንሥአ
  choice: erhob es
  rationale: Gibt sowohl das Bild des Erhöhens als auch die damit verbundene Einsetzung in einen höheren Rang wieder, ohne die Bildsprache aufzulösen.
- source_word: ከመ ይኩን ሐርጌ
  choice: damit es ein Widder werde
  rationale: Bewahrt den Übergang vom gewöhnlichen Schaf zum Widder und damit die symbolische Beförderung.
- source_word: ይመርሖሙ ለአባግዕ
  choice: die Schafe ... führe
  rationale: „Führen“ ist eine natürliche, zugleich hinreichend offene Wiedergabe der leitenden Tätigkeit.
- source_word: ህየንተ ዝኩ ሐርጌ
  choice: anstelle jenes Widders
  rationale: Drückt die im Ausdruck liegende Nachfolge beziehungsweise Ersetzung klar aus.
- source_word: ዘሐደገ ስብሐቲሁ
  choice: der seine Herrlichkeit aufgegeben hatte
  rationale: „Herrlichkeit“ bewahrt die breite Bedeutung von Würde, Ansehen und Glanz; „aufgegeben“ gibt das Verlassen wieder, ohne dessen Ursache näher zu deuten.
theological_decisions:
- issue: Symbolische Identität des erhobenen Tieres
  choice: Das Tier bleibt konkret ein „Schaf“, das zu einem „Widder“ wird.
  alternative: „Lamm“ oder eine abstrahierende Wiedergabe als „Anführer“.
  rationale: Die Tierbildsprache der Vision soll erhalten bleiben. Das Grundwort rechtfertigt „Schaf“ besser als die altersbezogene Bezeichnung „Lamm“.
- issue: Bedeutung von ስብሐቲሁ
  choice: seine Herrlichkeit
  alternative: seine Ehre / seinen Glanz
  rationale: „Herrlichkeit“ hält die mögliche Verbindung von Rang, Würde und Glanz offen, statt den Ausdruck auf nur eine Nuance festzulegen.
- issue: Bezug der Pronomina beim erhobenen Schaf
  choice: Neutrales Pronomen „es“, grammatisch auf „Schaf“ bezogen.
  alternative: Maskulines „ihn“, das die symbolisierte männliche Person stärker hervortreten ließe.
  rationale: Die deutsche Grammatik verlangt beim ausdrücklich genannten Tier „Schaf“ zunächst das Neutrum; die personale Deutung wird dadurch nicht ausgeschlossen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die wiederholten Tierbezeichnungen bleiben erhalten, weil sie für die apokalyptische Bildwelt wesentlich sind.
