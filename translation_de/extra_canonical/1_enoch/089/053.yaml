base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/053.yaml
  text: And he sent many other sheep to those sheep[d][c][b][a], that they might hear and cry out over them.
translation:
  language: de
  text: Und er sandte viele andere Schafe zu jenen Schafen, damit sie ihnen etwas zu Gehör brächten[a] und laut über sie schrien[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „damit sie hören ließen“. Gemeint sein kann, dass sie etwas verkündeten oder Zeugnis ablegten, sodass es gehört wurde.'
    reason: lexical_alternative
  - marker: b
    text: „Über sie“ kann auch im Sinn von „ihretwegen“, „in Bezug auf sie“ oder möglicherweise „gegen sie“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልኣነ አባግዕ ብዙኃነ
  choice: viele andere Schafe
  rationale: Die pluralische Wendung bezeichnet eine zahlreiche, von der zuvor genannten Gruppe unterschiedene Gruppe. „Schafe“ bewahrt die Bildsprache der Tierapokalypse.
- source_word: ፈነወ
  choice: er sandte
  rationale: Die Form ist Perfekt, 3. Person Singular maskulin, nicht 1. Person Singular. „Sandte“ gibt das Aussenden in würdigem, natürlichem Erzählstil wieder.
- source_word: ኀቤሆሙ ለዝኩ አባግዕ
  choice: zu jenen Schafen
  rationale: Die Richtungsangabe und die demonstrative Nominalgruppe bezeichnen die zuvor erwähnten Schafe als Ziel des Sendens.
- source_word: ያስምዑ
  choice: damit sie ihnen etwas zu Gehör brächten
  rationale: Die kausative Verbalform bedeutet wörtlich, andere hören zu lassen. Die deutsche Wendung wahrt diesen Kausativ, ohne den nicht ausdrücklich genannten Inhalt der Verkündigung festzulegen.
- source_word: የአውይዉ
  choice: laut riefen
  rationale: Das Verb bezeichnet ein lautes Rufen oder Schreien, möglicherweise als Klage oder Protest. „Laut riefen“ erhält die Stärke, ohne die Art des Rufes vorschnell festzulegen.
- source_word: ዲቤሆሙ
  choice: über sie
  rationale: Die Präposition kann hier eine auf die Schafe bezogene oder gegen sie gerichtete Äußerung anzeigen. Die knappe Wiedergabe erhält diese Mehrdeutigkeit.
theological_decisions:
- issue: Identität der „anderen Schafe“ in der Tierapokalypse
  choice: Die visionäre Bezeichnung „andere Schafe“ bleibt unaufgelöst.
  alternative: Sie ausdrücklich als Propheten, treue Führer oder eine Reformgruppe innerhalb Israels identifizieren.
  rationale: Der Vers selbst bleibt in der symbolischen Bildwelt. Eine historische oder theologische Identifizierung im Haupttext würde die Deutung vorwegnehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die apokalyptische Tierbildsprache bleibt erhalten; schwierige kausative und präpositionale Wendungen werden im Haupttext lesbar wiedergegeben und in Fußnoten als echte Mehrdeutigkeiten ausgewiesen.
