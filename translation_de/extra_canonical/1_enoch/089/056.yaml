base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/056.yaml
  text: And I saw that he abandoned that house of theirs and their tower and all their beloved ones into the hand of the lions[a], so that they might tear them apart, and into the hands of all the wild beasts[c][b], so that they might devour them.
translation:
  language: de
  text: Und ich sah, dass er ihr Haus und ihren Turm[a] verließ und sie alle den Löwen preisgab[b], damit diese sie zerrissen, und allen wilden Tieren preisgab[c], damit diese sie verschlangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Haus“ und „Turm“ bleiben als Bilder der Vision stehen; sie werden hier nicht ausdrücklich als Tempel, Hürde oder Gemeinschaft gedeutet.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich: „gab sie alle in die Hand der Löwen“. Die Wendung bedeutet, jemanden der Gewalt eines anderen auszuliefern.'
    reason: lexical_alternative
  - marker: c
    text: 'Die geʿezische Satzstellung lässt auch folgende Gliederung zu: „… den Löwen preisgab, damit sie sie zerrissen und verschlangen, in die Hände aller wilden Tiere.“'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ሐደጎ
  choice: verließ
  rationale: Das Verb bezeichnet ein Verlassen oder Aufgeben. „Verließ“ bewahrt die Aussage, ohne den Grad der Absicht stärker festzulegen, als es der Text verlangt.
- source_word: ቤተ ዚአሆሙ
  choice: das Haus, das ihnen gehörte
  rationale: Die Grundbedeutung von ቤት ist „Haus“. Die besitzanzeigende Fügung wird in natürlichem Deutsch als Relativsatz wiedergegeben; eine Deutung als Tempel oder Gemeinschaft wird nicht in den Haupttext eingetragen.
- source_word: ማኅፈዶሙ
  choice: ihren Turm
  rationale: Im Zusammenhang bezeichnet das Wort eine schützende bauliche Anlage. „Turm“ erhält das konkrete Bild der Vision; „Einfriedung“ oder „Hürde“ bleiben mögliche Alternativen.
- source_word: ወወደዮሙ ለኵሎሙ
  choice: und lieferte sie alle aus
  rationale: Die Form bedeutet hier, dass alle der Gewalt anderer übergeben werden. Anders als die englische Konsultationsfassung legt der geʿezische Wortlaut keine Wendung „all ihre Geliebten“ nahe.
- source_word: ዲበ እደ
  choice: den Löwen auslieferte
  rationale: Wörtlich steht eine Wendung mit „in die Hand“, ein semitisches Idiom für das Übergeben in fremde Gewalt. Die idiomatische deutsche Wiedergabe ist klar und bewahrt den gerichtlichen Sinn.
- source_word: አናብስት
  choice: Löwen
  rationale: Das Substantiv bezeichnet Löwen. Das konkrete Tierbild der Tierapokalypse bleibt unaufgelöst.
- source_word: ይምሥጥዎሙ
  choice: sie zerrissen
  rationale: Im Parallelismus mit dem Fressen bezeichnet das Verb gewaltsames Zerreißen beziehungsweise Zerfleischen. „Zerrissen“ ist kräftig und zugleich allgemein verständlich.
- source_word: ይብልዕዎሙ
  choice: sie verschlangen
  rationale: Das Verb bedeutet essen oder verzehren. „Verschlangen“ entspricht der bedrohlichen Raubtiermetaphorik.
- source_word: አራዊት
  choice: wilde Tiere
  rationale: Der Ausdruck bezeichnet wilde Tiere beziehungsweise Bestien. „Wilde Tiere“ ist modern und unterscheidet sie deutlich von den Schafen der Vision.
theological_decisions:
- issue: Deutung von Haus und Turm
  choice: Die sichtbaren Bilder „Haus“ und „Turm“ bleiben im Haupttext erhalten.
  alternative: Das Haus ausdrücklich als Tempel oder Gemeinschaft und den Turm als Festung beziehungsweise Hürde deuten.
  rationale: Die apokalyptische Symbolik soll nicht durch eine bestimmte historische oder theologische Auslegung ersetzt werden.
- issue: Wiedergabe der Übergabeformel „in die Hand“
  choice: Idiomatich „ausliefern“
  alternative: Formal „in die Hand der Löwen geben“ oder erklärend „in die Gewalt der Löwen geben“
  rationale: „Ausliefern“ vermittelt im heutigen Deutsch denselben Macht- und Gerichtsaspekt, ohne bei Tieren das missverständliche Körperbild einer menschlichen Hand zu erzeugen.
- issue: Zuordnung der beiden Zweck- beziehungsweise Folgesätze
  choice: Das Zerreißen wird den Löwen, das Verschlingen allen wilden Tieren zugeordnet.
  alternative: Beide Tätigkeiten auf die Löwen beziehen und die wilden Tiere erst am Satzende als weitere Empfänger nennen.
  rationale: Diese Anordnung ergibt im Deutschen einen verständlichen Parallelismus, während eine Fußnote die aufgrund der geʿezischen Wortfolge mögliche andere Gliederung offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer apokalyptischer Bildsprache. Die semitische Übergabeformel wird idiomatisch wiedergegeben; echte syntaktische Mehrdeutigkeit wird in der Fußnote bewahrt. Der im englischen Konsultationstext stehende Ausdruck „all their beloved ones“ wurde nicht übernommen, da er im vorgelegten geʿezischen Wortlaut nicht hinreichend gestützt ist.
