base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/018.yaml
  text: And one sheep went to the wolves at the word of the Lord[a], and another sheep met him and went with him. And the two of them went together and entered into the assembly of those wolves, and they spoke to them and made them hear[d][c][b], that from then on they should not ravage the sheep.
translation:
  language: de
  text: Und ein Schaf ging auf das Wort des Herrn hin[a] zu den Wölfen. Ein anderes Schaf begegnete ihm und ging mit ihm. Die beiden gingen gemeinsam weiter und traten in die Versammlung jener Wölfe ein. Sie redeten zu ihnen und warnten sie[b], dass sie von nun an nicht mehr über die Schafe herfallen sollten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf das Geheiß des Herrn“. Die ge’ezische Wendung kann ein Handeln bezeichnen, das durch göttliches Reden oder einen göttlichen Befehl veranlasst ist.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher etwa: „sie ließen sie gegen sich hören“. Die ge’ezische Wendung hat hier den Sinn eines nachdrücklichen Warnens oder Bezeugens gegenüber den Wölfen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ
  choice: Schaf
  rationale: Der allgemeine Ausdruck bewahrt die durchgehende symbolische Tierbildsprache, ohne Geschlecht oder Alter näher festzulegen.
- source_word: አዝእብት
  choice: Wölfe
  rationale: Die übliche Bedeutung passt zur räuberischen Bildwelt der Vision und sollte nicht zu einer allgemein feindlichen Gruppe abgeschwächt werden.
- source_word: በቃለ እግዚእ
  choice: auf das Wort des Herrn hin
  rationale: Die Formulierung verbindet göttliches Reden mit dem dadurch veranlassten Handeln des Schafes und wahrt zugleich den gehobenen Ton.
- source_word: ተረክቦ
  choice: begegnete ihm
  rationale: Das Verb bezeichnet hier das Zusammentreffen des zweiten Schafes mit dem ersten; die anschließende Begleitung wird eigens ausgesagt.
- source_word: ኅቡረ
  choice: gemeinsam
  rationale: Das Adverb hebt das vereinte Handeln der beiden Schafe hervor.
- source_word: ማኅበሮሙ
  choice: Versammlung
  rationale: Der Ausdruck bezeichnet eine zusammengekommene Gruppe und bewahrt einen formellen kollektiven Sinn, ohne kirchliche Bedeutung einzutragen.
- source_word: ወተናገርዎሙ
  choice: sie redeten zu ihnen
  rationale: Die schlichte Wiedergabe erhält die unmittelbare Abfolge von Eintreten, Reden und Warnen.
- source_word: ወአስምዑ ዲቤሆሙ
  choice: und warnten sie
  rationale: Die Kausativform mit ዲቤሆሙ bezeichnet in diesem Zusammenhang nicht bloß ein Hörbarmachen, sondern ein nachdrückliches Zu-Gehör-Bringen gegen bzw. gegenüber den Wölfen. „Warnten sie“ gibt die idiomatische Funktion natürlich wieder.
- source_word: ከመ እምይእዜ
  choice: dass sie von nun an
  rationale: Die Wendung leitet den Inhalt bzw. das beabsichtigte Ergebnis der Warnung ein und markiert dessen zeitlichen Beginn.
- source_word: ኢይግሥሥዎሙ ለአባግዕት
  choice: nicht mehr über die Schafe herfallen sollten
  rationale: Die Formulierung wahrt die räuberische Gewalt des Wolf-Schaf-Bildes und gibt die prohibitive Aussage in natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe von እግዚእ im Kontext der apokalyptischen Vision
  choice: der Herr
  alternative: der Gebieter
  rationale: Die Bezeichnung verweist hier auf die göttliche Autorität, die den Auftrag des Schafes begründet. „Der Herr“ bewahrt das ehrerbietige theologische Gewicht, ohne die Identität weiter zu bestimmen, als es der Text tut.
- issue: Modalität des abschließenden Verbots
  choice: dass sie … nicht mehr … sollten
  alternative: sodass sie … nicht mehr … würden
  rationale: Der Zusammenhang beschreibt eine an die Wölfe gerichtete Warnung bzw. Weisung. Der deutsche Konjunktiv mit „sollten“ erhält diesen normativen Zug, ohne zu behaupten, dass das Verbot tatsächlich befolgt werde.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit klarer narrativer Bewegung. Die wiederholte Tierbezeichnung bleibt erhalten. „Über die Schafe herfallen“ bewahrt die räuberische Bildsprache, während „warnten sie“ die ge’ezische Wendung idiomatisch statt mechanisch wörtlich wiedergibt.
