base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/039.yaml
  text: And I saw until they grew quiet from the outcry for that sheep[a], and they crossed that stream of water. And the other two sheep, which were leading them, stood in place of those who had lain down[e][d][c][b], and they led them.
translation:
  language: de
  text: Und ich sah, bis sie nach dem Geschrei um jenes Schaf still wurden[a] und jenen Wasserlauf[b] überquerten. Da standen die beiden anderen Schafe, die sie führten, an der Stelle derer, die sich niedergelegt hatten[c], und sie führten sie weiter[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch wörtlich: „bis sie vom Geschrei um jenes Schaf her still wurden“. Das Verb kann „still werden“, „zur Ruhe kommen“ oder „aufhören“ bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „jenen Bach“, „jenen Fluss“ beziehungsweise „jenen Strom“. Der äthiopische Ausdruck bezeichnet allgemein fließendes Wasser.'
    reason: lexical_alternative
  - marker: c
    text: „Sich niedergelegt hatten“ kann im Zusammenhang auch ein Niedersinken oder zu Fall kommen meinen; der Wortlaut legt die genaue Ursache nicht fest.
    reason: genuine_ambiguity
  - marker: d
    text: 'Wörtlich endet der Satz mit der Wiederholung: „und sie führten sie“. „Weiter“ macht lediglich die Fortsetzung der Handlung deutlich.'
    reason: translation_clarity
lexical_decisions:
- source_word: አርመሙ
  choice: still wurden
  rationale: Das Verb bezeichnet das Still- oder Ruhigwerden. Die Formulierung bewahrt den vorgangshaften Sinn, ohne ein äußeres Zum-Schweigen-Bringen vorauszusetzen.
- source_word: እምጽራኁ ለዝኩ በግዕ
  choice: nach dem Geschrei um jenes Schaf
  rationale: ጽራኅ bezeichnet einen Ruf, Aufschrei oder ein Geschrei; ለዝኩ በግዕ bezieht ihn auf „jenes Schaf“. „Um“ lässt offen, ob das Geschrei dem Schaf gilt oder seinetwegen entsteht.
- source_word: በግዕ
  choice: Schaf
  rationale: Die konkrete Tiergestalt der Traumvision bleibt erhalten und wird nicht als „Volk“ oder „Israel“ ausgedeutet.
- source_word: ውሒዘ ማይ
  choice: Wasserlauf
  rationale: Die Wendung bezeichnet fließendes Wasser, ohne eindeutig zwischen Bach, Fluss und Strom festzulegen. „Wasserlauf“ wahrt diese Weite.
- source_word: አባግዕ ካልኤሆሙ
  choice: die beiden anderen Schafe
  rationale: Die Wiedergabe markiert die zwei Schafe als eine weitere, von den zuvor erwähnten unterschiedene Gruppe.
- source_word: ይመርሕዎሙ
  choice: die sie führten
  rationale: Das Verb bedeutet führen oder leiten; der Relativsatz bindet diese Aufgabe an die beiden anderen Schafe.
- source_word: ተክሎሙ
  choice: an der Stelle
  rationale: Die Form wird als präpositionale Wendung „an ihrer Stelle/anstelle“ verstanden, nicht als Verb „hinsetzen“ oder „aufstellen“.
- source_word: ለእለ ሰከቡ
  choice: derer, die sich niedergelegt hatten
  rationale: Das Verb bedeutet gewöhnlich liegen oder sich niederlegen. Die wörtlich zurückhaltende Fassung deutet den Zustand nicht ausdrücklich als Tod oder Zusammenbruch.
- source_word: መርሕዎሙ
  choice: führten sie weiter
  rationale: Die Wiederholung des Führens bleibt sichtbar; „weiter“ verdeutlicht im Deutschen knapp die Fortsetzung nach dem Übergang, ohne die Bildsprache aufzulösen.
theological_decisions:
- issue: Deutung der Tiere und ihrer Handlungen in der apokalyptischen Vision
  choice: Die Schafe und die erzählte Handlungsfolge bleiben unentschlüsselt im Haupttext stehen.
  alternative: Die Schafe ausdrücklich als Israeliten, das Volk oder bestimmte historische Führer bezeichnen.
  rationale: Die Traumvision spricht bewusst in Tierbildern. Historische oder theologische Identifizierungen würden eine Auslegung in den Übersetzungstext eintragen und die Offenheit des Bildes einschränken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener apokalyptischer Tierbildsprache. Die etwas markante Eingangsformel „Und ich sah, bis …“ folgt dem visionären Erzählstil. Schwierige Stellen werden nicht dogmatisch oder historisierend aufgelöst; insbesondere wird ተክሎሙ entsprechend der jüngsten textkritischen Klärung als „an der Stelle“ und nicht als Verb „setzten hin“ verstanden.
