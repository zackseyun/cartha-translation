base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/011.yaml
  text: And they began to gore one another[a]; and that white bull which was born in their midst begot a wild ass and a white bull with it[c][b], and the wild asses multiplied.
translation:
  language: de
  text: Und sie begannen, einander mit den Hörnern zu stoßen[a]. Jener weiße Stier, der in ihrer Mitte geboren worden war, zeugte einen Wildesel und mit ihm einen weißen Stier[b]; und die Wildesel vermehrten sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das zugrunde liegende Verb beschreibt wahrscheinlich eine gegenseitige gewaltsame Handlung. Möglich wären auch die allgemeineren Wiedergaben „einander schlagen“ oder „einander angreifen“.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich: „mit ihm“. Gemeint ist wahrscheinlich, dass neben dem Wildesel auch ein weißer Stier gezeugt wurde; die knappe Formulierung lässt den genauen Bezug jedoch offen.'
    reason: ambiguity
lexical_decisions:
- source_word: ይትናሰኩ
  choice: begannen, einander mit den Hörnern zu stoßen
  rationale: Die reziproke Verbform bezeichnet eine gegenseitige gewaltsame Handlung. Die Wendung bewahrt die zum Tierbild passende Vorstellung des Stoßens mit den Hörnern, ohne im Deutschen ein unnatürliches Verb zu erzwingen.
- source_word: ላህም ጸዓዳ
  choice: weißer Stier
  rationale: ላህም bezeichnet hier ein Rind beziehungsweise männliches Rind; ጸዓዳ ist die für die Symbolik wichtige Farbangabe „weiß“. Im Zusammenhang der genealogischen Tierbilder ist „weißer Stier“ natürlich und konkret.
- source_word: ዘተወልደ ማእከሎሙ
  choice: der in ihrer Mitte geboren worden war
  rationale: Die Relativkonstruktion beschreibt den weißen Stier als denjenigen, der zuvor unter ihnen geboren wurde. Das Plusquamperfekt macht den zeitlichen Bezug im Deutschen deutlich.
- source_word: ወለደ
  choice: zeugte
  rationale: Das aktive Verb bezeichnet das Hervorbringen von Nachkommen. Da der weiße Stier Subjekt ist, gibt „zeugte“ die genealogische Aussage knapp und korrekt wieder.
- source_word: አድገ ገዳም
  choice: einen Wildesel
  rationale: Die Wortgruppe bezeichnet im Singular einen Esel der Wildnis, also einen Wildesel. Diese Lesung entspricht Zahl, Syntax und der konkreten Tiergenealogie.
- source_word: ላህመ ጸዓዳ ምስሌሁ
  choice: mit ihm einen weißen Stier
  rationale: Die Phrase nennt einen weiteren Nachkommen, einen weißen Stier, zusammen mit dem Wildesel. „Mit ihm“ bewahrt den Bezug des maskulinen Pronomens, lässt aber die genaue Nuance des Zusammenseins offen.
- source_word: በዝኁ አእዱገ ገዳም
  choice: die Wildesel vermehrten sich
  rationale: Die Pluralform አእዱገ und das Vermehrungsverb ergeben natürlich „die Wildesel vermehrten sich“; eine erneute Geburtsformel ist nicht erforderlich.
theological_decisions:
- issue: Deutung der symbolischen Tiergenealogie
  choice: Die Tiere werden im Haupttext wörtlich als weißer Stier und Wildesel wiedergegeben.
  alternative: Die Tiere unmittelbar mit den durch sie dargestellten Personen oder Völkern zu benennen.
  rationale: Die apokalyptische Vision entfaltet ihre Aussage durch konkrete Tierbilder. Eine historische oder theologische Identifizierung würde die Symbolik im Übersetzungstext vorzeitig auflösen.
- issue: Bezug von „mit ihm“
  choice: Das Pronomen wird auf den unmittelbar zuvor genannten Wildesel bezogen.
  alternative: „neben ihm“, „zusammen mit ihm“ oder ein Bezug auf den zeugenden weißen Stier.
  rationale: Der ge'ezische Ausdruck ምስሌሁ bedeutet wörtlich „mit ihm“. Die Übersetzung wahrt diese knappe, potenziell mehrdeutige Zuordnung, statt sie interpretierend auszubauen.
translation_notes:
  register: Moderner, würdiger Erzählstil mit konkreter apokalyptischer Tierbildsprache. Die Satzstruktur folgt der ge'ezischen Genealogie, bleibt aber im Deutschen gut lesbar. Archaische Formen und eine entschlüsselnde Benennung der symbolisierten Gestalten wurden vermieden.
