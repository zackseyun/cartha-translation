base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/040.yaml
  text: And I saw the sheep until they entered into a good place[a], and into a pleasant and glorious land; and I saw until the sheep were satisfied[c][b], and that house was in their midst in the pleasant land.
translation:
  language: de
  text: Und ich sah die Schafe, bis sie an einen guten Ort und in ein liebliches, herrliches Land kamen. Und ich sah die Schafe, bis sie satt wurden; und jenes Haus[a] war mitten unter ihnen in dem lieblichen Land.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „Haus“ kann innerhalb der symbolischen Bildwelt der Vision das Heiligtum oder den Tempel bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Die Bezeichnung „liebliches Land“ wird im ge’ezischen Text am Versende wiederholt und hebt so den gesegneten Ort erneut hervor.
    reason: source_feature
lexical_decisions:
- source_word: አባግዕ
  choice: Schafe
  rationale: Die wörtliche Tierbezeichnung bewahrt die durchgehende Bildsprache der Tierapokalypse und deutet sie nicht vorschnell als Volk oder Israel aus.
- source_word: መካን ሠናይ
  choice: einen guten Ort
  rationale: Die Verbindung bezeichnet schlicht einen guten beziehungsweise schönen Ort; die formnahe Wiedergabe bleibt im Deutschen natürlich.
- source_word: ምድር ኃዋዝ ወስብሕት
  choice: ein liebliches, herrliches Land
  rationale: ኃዋዝ und ስብሕት sind hier adjektivisch auf ምድር bezogen. „Lieblich“ und „herrlich“ erhalten sowohl die grammatische Struktur als auch den erhöhten visionären Ton.
- source_word: ጸግቡ
  choice: satt wurden
  rationale: Das Verb bezeichnet das Satt- oder Erfülltwerden. Im Zusammenhang mit Schafen ist „satt wurden“ anschaulich und idiomatisch, ohne den Versorgungsgedanken zu verlieren.
- source_word: ቤት
  choice: Haus
  rationale: Der Ausgangstext nennt ein Haus. Die mögliche Deutung als Heiligtum oder Tempel gehört in die Anmerkung, damit die symbolische Offenheit des Visionsbildes erhalten bleibt.
- source_word: ማእከሎሙ
  choice: mitten unter ihnen
  rationale: Die Wendung drückt eine zentrale Gegenwart innerhalb der Schafe aus; „mitten unter ihnen“ gibt die räumliche und gemeinschaftliche Bedeutung natürlich wieder.
theological_decisions:
- issue: Soll ቤት im Haupttext ausdrücklich als Tempel gedeutet werden?
  choice: „Haus“ im Haupttext beibehalten
  alternative: „Tempel“ oder „Heiligtum“
  rationale: Obwohl im symbolischen Zusammenhang wahrscheinlich das Heiligtum beziehungsweise der Tempel gemeint ist, bewahrt „Haus“ die eigene Bildsprache des Textes und trennt Übersetzung von Auslegung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem visionärem Ton. Die proleptische ge’ezische Konstruktion wird natürlich mit „ich sah die Schafe, bis sie … kamen“ wiedergegeben. Die beiden Eigenschaften des Landes bleiben entsprechend der ge’ezischen Grammatik Adjektive.
