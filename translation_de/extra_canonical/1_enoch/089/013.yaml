base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/013.yaml
  text: And when those twelve sheep had grown, they handed over one of them to the donkeys, and those donkeys in turn handed over that sheep to the wolves, and that sheep grew up in the midst of the wolves.
translation:
  language: de
  text: Und als jene zwölf Schafe groß geworden waren, übergaben sie eines von ihnen den Eseln. Diese Esel wiederum übergaben jenes Schaf den Wölfen, und jenes Schaf wuchs mitten unter den Wölfen auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ልህቁ
  choice: groß geworden waren
  rationale: Das Verb bezeichnet hier das Heranwachsen beziehungsweise Großwerden; die Formulierung gibt den zeitlichen Zusammenhang natürlich wieder.
- source_word: መጦውዎ
  choice: übergaben sie
  rationale: Die wiederholte Verbform beschreibt die Weitergabe des Schafes von einer Tiergruppe an die nächste; „übergeben“ bewahrt diesen Vorgang und die Wiederholung.
- source_word: ካዕበ
  choice: wiederum
  rationale: Das Adverb markiert die erneute beziehungsweise anschließende Übergabe durch die Esel.
- source_word: ልህቁ ... ማእከለ፡ አዝእብት
  choice: wuchs mitten unter den Wölfen auf
  rationale: Im zweiten Vorkommen beschreibt das Verb das Aufwachsen des einzelnen Schafes; „mitten unter“ gibt die räumlich-soziale Lage idiomatisch wieder.
theological_decisions:
- issue: Allegorische Identifikation der Tiere
  choice: Die Tiere bleiben ohne erklärende historische oder theologische Identifikation im Haupttext.
  alternative: Die Schafe, Esel und Wölfe ausdrücklich bestimmten biblischen Personen oder Völkern zuordnen.
  rationale: Der Vers selbst bietet nur die Tierbildsprache. Eine Identifikation würde die Auslegung festlegen, statt die genuine allegorische Offenheit des Textes zu bewahren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die demonstrative Wiederholung „jenes Schaf“ bewahrt die nachdrückliche Rückverweisung des geʿezischen Textes; „wiederum“ bildet die gestufte Weitergabe ab.
