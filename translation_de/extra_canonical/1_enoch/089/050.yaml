base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/050.yaml
  text: And that house became great and broad, and it was built for those sheep; and a lofty and great tower was built upon the house for the Lord of the sheep. And that house was low, but the tower was raised up and became lofty; and the Lord of the sheep stood upon that tower, and they set a full table before him.
translation:
  language: de
  text: Und jenes Haus wurde groß und weit und wurde für jene Schafe gebaut. Auf dem Haus wurde für den Herrn der Schafe ein hoher und großer Turm errichtet. Das Haus aber war niedrig; der Turm hingegen ragte empor und wurde hoch. Der Herr der Schafe stand auf jenem Turm, und sie stellten ihm einen reich gedeckten Tisch hin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ቤት (bet)
  choice: Haus
  rationale: Die übliche konkrete Bedeutung passt zur Tempelbildsprache des Zusammenhangs und bewahrt die Allegorie.
- source_word: ዐቢየ ወርኅበ (ʿabiya wa-rəḥba)
  choice: groß und weit
  rationale: Gibt die beiden räumlichen Eigenschaften unmittelbar und in natürlichem Deutsch wieder.
- source_word: ማኅፈድ (maḥfəd)
  choice: Turm
  rationale: Die Bauwerksbezeichnung entspricht hier einem hohen Aufbau über dem Haus; „Turm“ bewahrt das konkrete Bild.
- source_word: ነዋኅ (nawaḥ)
  choice: hoch
  rationale: Bezeichnet die vertikale Höhe des Turms; im zweiten Vorkommen wird die Bewegung mit „ragte empor“ ausgedrückt.
- source_word: ማእደ ምልእተ (maʾədda məlʾta)
  choice: reich gedeckten Tisch
  rationale: Wörtlich steht ein „voller Tisch“; die deutsche Wendung bezeichnet verständlich einen Tisch, der mit Speisen oder Gaben gefüllt ist.
- source_word: አቅረቡ (ʾaqrebu)
  choice: sie stellten … hin
  rationale: Bewahrt das nicht näher bezeichnete pluralische Subjekt und gibt das Herbeibringen beziehungsweise Darbringen vor ihm idiomatisch wieder.
theological_decisions:
- issue: Identität des Hauses und des Turms
  choice: Die allegorischen Gegenstände bleiben als „Haus“ und „Turm“ unaufgelöst.
  alternative: Sie ausdrücklich als Tempel und Altar beziehungsweise Tempelturm zu deuten.
  rationale: Der Quelltext benennt die Gegenstände bildhaft; eine explizite Identifikation würde eine Auslegung in den Text eintragen.
- issue: Titel እግዚአ አባግዕ
  choice: „Herr der Schafe“
  alternative: „Besitzer der Schafe“ oder eine ausdrückliche Gottesbezeichnung.
  rationale: Die formale Wiedergabe erhält den allegorischen Hoheitstitel, ohne dessen Referenten im Übersetzungstext zusätzlich zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Die wiederholte Gegenüberstellung von niedrigem Haus und hohem Turm bleibt erhalten; „hingegen“ macht den im Ge’ez markierten Kontrast natürlich hörbar.
