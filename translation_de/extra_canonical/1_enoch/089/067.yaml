base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/067.yaml
  text: And I grieved greatly because of the tower[a], for that house of the sheep had been torn down[e][d][c][b]; and from among them I was not able to see whether those sheep entered that house.
translation:
  language: de
  text: Und ich war sehr betrübt wegen der Umfriedung[a], denn jenes Haus der Schafe war niedergerissen worden[b]; und ich konnte unter ihnen nicht sehen, ob jene Schafe in jenes Haus hineingingen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das ge’ezische Bild bewegt sich zwischen einer Umfriedung und einem „Haus der Schafe“. Beide Bezeichnungen bleiben erhalten, statt sie einheitlich mit „Schafstall“ wiederzugeben.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „war zerstört worden“ beziehungsweise „war abgetragen worden“.'
    reason: lexical_alternative
  - marker: c
    text: Der Schlusssatz ist schwierig. Er kann auch bedeuten, dass der Seher jene Schafe überhaupt nicht sehen konnte, statt dass er nicht sehen konnte, ob sie in das Haus hineingingen.
    reason: alternative_reading
lexical_decisions:
- source_word: ወሐዘንኩ
  choice: Und ich war … betrübt
  rationale: Das Verb bezeichnet Trauer oder schmerzliche Bekümmernis im Bericht des Sehers; „betrübt“ klingt im Deutschen natürlich und würdevoll.
- source_word: ብዙኃ ጥቀ
  choice: sehr
  rationale: Die gekoppelten Verstärkungen werden in idiomatischem Deutsch durch „sehr“ wiedergegeben.
- source_word: ማኅፈድ
  choice: Umfriedung
  rationale: Das Wort bezeichnet einen umschlossenen Platz für Tiere. „Umfriedung“ bewahrt diese räumliche Vorstellung und lässt sie neben dem folgenden „Haus der Schafe“ bestehen.
- source_word: ተከርየ
  choice: war niedergerissen worden
  rationale: Im Zusammenhang mit einem Haus bezeichnet das Passiv dessen Abbruch beziehungsweise Zerstörung; „niedergerissen“ gibt das konkrete Bild natürlich wieder.
- source_word: ቤት ዘአባግዐ
  choice: Haus der Schafe
  rationale: Die wörtliche architektonische Metapher bleibt erhalten, ohne sie vorschnell zu „Schafstall“ zu vereinheitlichen.
- source_word: ኢክህልኩ ርእዮቶሙ
  choice: konnte ich nicht erkennen
  rationale: Die Formulierung bewahrt die Unfähigkeit des Sehers zur visuellen Wahrnehmung und ermöglicht zugleich im Deutschen den indirekten Fragesatz.
- source_word: ለእልኩ አባግዕ
  choice: jene Schafe
  rationale: „Jene“ erhält den rückverweisenden Demonstrativcharakter.
- source_word: ይበውኡ
  choice: hineingingen
  rationale: Das Verb bezeichnet die Bewegung in das Haus; „hineingingen“ ist anschaulich und natürlich.
- source_word: ኀበ ዝኩ ቤት
  choice: in jenes Haus
  rationale: Die Richtung in das Haus und der demonstrative Rückverweis werden beide bewahrt.
theological_decisions:
- issue: Verhältnis von Tiergehege und Hausmetaphorik
  choice: Die beiden Bilder als „Umfriedung“ und „Haus der Schafe“ nebeneinander bewahren
  alternative: Beides zu „Schafstall“ vereinheitlichen
  rationale: Die apokalyptische Bildsprache wechselt beziehungsweise überblendet verwandte räumliche Bilder. Eine Vereinheitlichung würde diese Spannung auslegen statt übersetzen.
- issue: Art der Beschädigung des Hauses
  choice: „war niedergerissen worden“
  alternative: „war weggehauen worden“, „war zerstört worden“ oder „war entfernt worden“
  rationale: Bei einem Gebäude legt das Verb Niederreißen, Untergraben oder Schleifen nahe. Die gewählte Formulierung ist konkret, ohne eine technisch zu enge Deutung festzulegen.
- issue: Syntax des Schlusssatzes
  choice: „konnte ich nicht erkennen, ob jene Schafe … hineingingen“
  alternative: „konnte ich jene Schafe nicht sehen, falls sie … hineingingen“
  rationale: Der überlieferte Satz ist schwierig und kann entweder das Sehen der Schafe überhaupt oder das Erkennen ihres Eintritts betreffen. Der Haupttext folgt der kontextuell plausiblen indirekten Frage; die andere Möglichkeit wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die apokalyptische Tier- und Gebäudebildsprache wird nicht allegorisch aufgelöst. „Umfriedung“ ist bewusst etwas gehobener als „Gehege“, bleibt aber verständlich und unterscheidet sich klar vom anschließenden „Haus der Schafe“.
