base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/054.yaml
  text: And after that I saw when they abandoned the house of the Lord and his tower[a], and they all went astray, and their eyes were blinded. And I saw the Lord of the sheep bring about a great slaughter among them in their pasture[f][e][d][c][b], until those sheep cried out because of that slaughter and abandoned his place.
translation:
  language: de
  text: Und danach sah ich, wie sie das Haus ihres Herrn und seinen Turm[a] verließen. Sie alle gingen in die Irre, und ihre Augen wurden verfinstert. Und ich sah, wie der Herr der Schafe unter ihnen auf ihrer Weide ein großes Gemetzel anrichtete, bis jene Schafe dieses Gemetzel herbeiriefen und seinen Ort preisgaben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „Turm“ wiedergegebene Wort kann auch „Hürde“, „Einfriedung“ oder „Zuflucht“ bedeuten; gemeint ist offenbar ein Teil des symbolischen Heiligtumskomplexes der Vision.
    reason: lexical_alternative
  - marker: b
    text: 'Der Schluss des Verses ist sprachlich schwierig. Möglich ist auch die Deutung: „bis jene Schafe wegen dieses Gemetzels zu ihm schrien und seinen Ort verließen“ beziehungsweise „an seinen Ort kamen“.'
    reason: textual_and_syntactic_ambiguity
lexical_decisions:
- source_word: ኃደጉ
  choice: verließen
  rationale: Das Verb bezeichnet ein Zurücklassen oder Aufgeben. „Verließen“ ist im Deutschen natürlich und lässt offen, wie stark die schuldhafte Abkehr betont ist.
- source_word: ቤተ ለእግዚአ
  choice: das Haus ihres Herrn
  rationale: Im Zusammenhang der Tierapokalypse bezeichnet das Haus symbolisch das Heiligtum. „Ihres Herrn“ bindet die Wendung an die örtliche Schaf-Herr-Metaphorik.
- source_word: ማኅፈዶ
  choice: seinen Turm
  rationale: „Turm“ bewahrt das Bild eines befestigten beziehungsweise erhöhten Bestandteils des symbolischen Heiligtumskomplexes; mögliche Alternativen werden in der Fußnote genannt.
- source_word: ስሕቱ
  choice: gingen in die Irre
  rationale: Die Wendung ist in der Schafallegorie zugleich räumlich und moralisch verständlich und klingt im modernen Deutsch natürlich.
- source_word: ተጸለሉ አዕይንቲሆሙ
  choice: ihre Augen wurden verfinstert
  rationale: Die wörtlich bildhafte Verdunkelung bleibt erhalten, ohne sie eindeutig als physische Blindheit oder geistliche Verblendung festzulegen.
- source_word: እግዚአ አባግዕ
  choice: der Herr der Schafe
  rationale: Dies ist ein wiederkehrender Titel der Tierapokalypse; „Herr“ wahrt den gehobenen Ton und die theologische Bildsprache.
- source_word: ገብረ ቀትለ ብዙኃ
  choice: ein großes Gemetzel anrichtete
  rationale: Die aktive Verursachung und die Härte des Gerichts werden ohne abschwächende Umschreibung wiedergegeben.
- source_word: በመራዕይሆሙ
  choice: auf ihrer Weide
  rationale: Der Ausdruck bezeichnet im Rahmen der Schafvision den Ort des Weidens; der Singular folgt der vorliegenden Quellengestalt.
- source_word: ይጼውዕዎ ... ለዝኩ ቀትል
  choice: dieses Gemetzel herbeiriefen
  rationale: Die Verbform enthält ein maskulines Singularobjekt, und die folgende markierte Wendung nennt „dieses Gemetzel“. „Herbeiriefen“ gibt den ungewöhnlichen Gedanken wieder, dass die Schafe das Gemetzel selbst auf sich ziehen oder verlangen.
- source_word: አግብኡ መካኖ
  choice: seinen Ort preisgaben
  rationale: Die Kausativform kann im Kontext das Ausliefern oder Preisgeben bezeichnen. Diese Wiedergabe ist natürlicher als „verrieten seinen Ort“, erhält aber den Gedanken schuldhafter Übergabe.
theological_decisions:
- issue: Handelnde Ursache des Gemetzels
  choice: der Herr der Schafe ... ein großes Gemetzel anrichtete
  alternative: der Herr der Schafe ließ ein großes Gemetzel unter ihnen geschehen
  rationale: Der ge'ezische Text stellt den Herrn als aktiv Handelnden dar. Die Übersetzung schwächt diese theologische Spannung nicht zu bloßer Zulassung ab.
- issue: Mitverantwortung der Schafe am Gericht
  choice: jene Schafe dieses Gemetzel herbeiriefen und seinen Ort preisgaben
  alternative: jene Schafe wegen dieses Gemetzels zu ihm schrien und seinen Ort verließen
  rationale: Die Morphologie stützt eine direkte Beziehung des Rufens zum Gemetzel und beim folgenden Kausativ ein Preisgeben oder Ausliefern. Wegen der schwierigen Syntax bleibt die alternative Deutung in einer Fußnote sichtbar.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die apokalyptische Schaf- und Heiligtumsbildwelt bleibt sichtbar; ungewöhnliche und theologisch spannungsreiche Aussagen werden nicht geglättet. Die Hauptfassung folgt bei der schwierigen Schlussklausel der morphologisch stärkeren Lesart, während konkurrierende Deutungen in der Fußnote bewahrt werden.
