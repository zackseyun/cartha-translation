base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/043.yaml
  text: And that ram began to gore on this side and on that side those dogs and foxes and wild boars[c][b][a], until he had destroyed them all.
translation:
  language: de
  text: Und jener Widder begann, von dieser und von jener Seite auf jene Hunde, Füchse[a] und Wildschweine einzustoßen, bis er sie alle vernichtet hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Schakale«; die genaue Bestimmung des Tiernamens ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝኩ፡ ሐርጌ
  choice: Und jener Widder
  rationale: ወዝኩ ist als »und jener« zu verstehen, ohne ein nicht belegtes »ich sah«; ሐርጌ bezeichnet hier den Widder und bewahrt die Tierbildwelt des Zusammenhangs.
- source_word: አኃዘ፡ ይወግእ
  choice: begann … anzugreifen
  rationale: Die Konstruktion bezeichnet den Beginn des Angriffs. Das Verb kann im Bild eines Widders konkreter »stoßen/aufspießen« bedeuten; »angreifen« ist im Deutschen natürlich und lässt die genaue Angriffsweise offen.
- source_word: እምዝየ፡ ወእምዝየ
  choice: von dieser und von jener Seite
  rationale: Die Wiederholung des Ge’ez wird bewahrt und beschreibt den Angriff von beiden Seiten beziehungsweise ringsum.
- source_word: ዝኩ፡ አክላብ
  choice: jene Hunde
  rationale: Der Demonstrativbezug von ዝኩ wird ausdrücklich wiedergegeben; die allegorische Tierbezeichnung bleibt unaufgelöst.
- source_word: ቈናጽል
  choice: Füchse
  rationale: »Füchse« ist eine plausible Tierbestimmung; die mögliche weitere Bedeutung »Schakale« wird in einer Fußnote genannt.
- source_word: ሐራዊያ፡ ገዳም
  choice: Wildschweine
  rationale: Die Verbindung bezeichnet wilde Schweine beziehungsweise Eber; »Wildschweine« ist im modernen Deutschen die natürliche Sammelbezeichnung.
- source_word: እስከ፡ ለኵሎሙ፡ አኅጐሎሙ
  choice: bis er sie alle vernichtet hatte
  rationale: Die Wendung beschreibt die vollständige Vernichtung der feindlichen Tiere und wahrt die starke Gewaltsprache der Vision.
theological_decisions:
- issue: Historische Deutung der Tiersymbole
  choice: Die Tierbilder bleiben im Vers unaufgelöst.
  alternative: Die Tiere unmittelbar mit bestimmten Völkern oder Gruppen identifizieren.
  rationale: Der Ausgangstext bietet an dieser Stelle die allegorischen Bilder selbst. Eine historische Zuordnung wäre Auslegung und soll nicht stillschweigend in die Übersetzung eingehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Richtungsangabe und die apokalyptische Tierbildwelt bleiben erhalten; die Satzstellung wurde für gute deutsche Lesbarkeit leicht geglättet.
