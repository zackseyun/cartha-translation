base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/004.yaml
  text: And water[a], and darkness, and mist increased upon it; and I looked at the height of that water, and that water rose above that enclosure[d][c][b], and it poured over the enclosure and stood upon the earth.
translation:
  language: de
  text: Und Wasser, Finsternis und Nebel nahmen über ihm zu; und ich sah, wie hoch jenes Wasser stand. Und das Wasser stieg über jene Umfriedung[a], ergoss sich über die Umfriedung und blieb auf der Erde stehen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Einhegung«, »Hof« oder, im Rahmen der Tiersymbolik, »Schafpferch«.'
    reason: lexical_alternative
  - marker: b
    text: Das wiederholt im Singular gebrauchte »Wasser« ruft im Zusammenhang das Bild einer Flut hervor; der Wortlaut selbst macht daraus jedoch nicht ausdrücklich »Flutwasser«.
    reason: cultural_note
lexical_decisions:
- source_word: ወበዝን (wahrscheinlich für ወበዝኀ)
  choice: nahmen ... zu
  rationale: Die überlieferte Form gilt wahrscheinlich als OCR-Fehler für ein Verb mit der Bedeutung »zunehmen, sich vermehren«. Der Plural entspricht im Deutschen der Reihung »Wasser, Finsternis und Nebel«.
- source_word: ዲቤሁ
  choice: über ihm
  rationale: Die Präposition bezeichnet eine Lage auf oder über einem zuvor genannten Bezugsgegenstand; das Pronomen bleibt wie im Ge'ez ohne erklärende Auflösung.
- source_word: ማይ
  choice: Wasser
  rationale: Der wiederholte Singular lässt sich im Deutschen als Stoffbezeichnung bewahren, ohne deutend »Flut« oder »Flutwasser« einzusetzen.
- source_word: ጽልመት
  choice: Finsternis
  rationale: Gibt die bedrohliche apokalyptische Bildsprache würdig und unmittelbar wieder.
- source_word: ጊሜ
  choice: Nebel
  rationale: Bezeichnet eine verdunkelnde Dunst- oder Nebelerscheinung und passt natürlich in die Wetterfolge.
- source_word: አሬኢ
  choice: ich sah
  rationale: Bewahrt die typische Ich-Perspektive des Visionsberichts; der folgende Inhalt wird im Deutschen idiomatisch als indirekter Fragesatz ausgedrückt.
- source_word: መልዕልተ
  choice: wie hoch ... stand / über
  rationale: Die verschiedenen Vorkommen drücken Höhe beziehungsweise eine Lage oberhalb aus; eine kontextgerechte Wiedergabe vermeidet im Deutschen die schwerfällige Formulierung »ich sah die Höhe des Wassers«.
- source_word: ተላዐለ
  choice: stieg ... über
  rationale: Das Verb bezeichnet Aufsteigen oder Erhöhung und erhält die vertikale Bewegung des Wassers.
- source_word: ዐጸድ
  choice: Umfriedung
  rationale: Der Ausdruck bezeichnet einen abgegrenzten oder eingefriedeten Bereich. »Umfriedung« wahrt die symbolische Offenheit besser als das engere »Schafpferch«.
- source_word: ይከዑ
  choice: ergoss sich über
  rationale: Vermittelt die kräftige Bewegung des Wassers über die Begrenzung hinweg.
- source_word: ቆመ
  choice: blieb ... stehen
  rationale: Bewahrt das semitische Bild des stehenden Wassers, klingt im Deutschen aber natürlicher als das bloße »stand«.
theological_decisions:
- issue: Soll die Sintflut im Haupttext ausdrücklich benannt werden?
  choice: Der wiederholte Ausdruck »Wasser« bleibt erhalten.
  alternative: Flutwasser; die Flut
  rationale: Der Zusammenhang legt eine Überflutung nahe, doch der Ge'ez-Text nennt wiederholt schlicht »Wasser«. Die Übersetzung lässt daher die Deutung aus dem Bild selbst hervorgehen.
- issue: Wie eng soll ዐጸድ innerhalb der Tiersymbolik bestimmt werden?
  choice: Umfriedung
  alternative: Schafpferch; Hof; Einhegung
  rationale: Ein Schafpferch ist im weiteren Kontext möglich, wird durch diesen Vers allein jedoch nicht zwingend festgelegt. Die allgemeinere Wiedergabe bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer visionärer Bildsprache. Die anaphorische Wiederholung von »Wasser« und »Umfriedung« wird bewusst beibehalten. Der unaufgelöste pronominale Bezug in »über ihm« bewahrt die Mehrdeutigkeit der Vorlage.
