  source_fidelity: 'Die Abfolge der Vision wird treffend wiedergegeben: erneutes Sehen, das Hüten während zwölf Stunden, die drei Schafe, ihre Rückkehr, Ankunft und ihr Eintritt sowie der anschließende Wiederaufbau. Die Wiederherstellung dessen, was von dem Haus eingestürzt war, entspricht dem englischen POB-Audittext und ist im Zusammenhang der knappen geʿezischen Überlieferung plausibel. Die Bildsprache bleibt ohne ausdeutende Identifizierung der Schafe oder Stunden erhalten.'
