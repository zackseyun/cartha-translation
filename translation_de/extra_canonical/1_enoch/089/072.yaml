  terminology: „Hirten“, „Schafe“, „Haus“, „Und siehe“ und „wieder aufbauen“ sind registergerecht und theologisch neutral. „Von jenen Schafen“ bewahrt die demonstrative Rückverweisung; die Bewegungsfolge bleibt ausdrücklich erhalten.
