base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/072.yaml
  text: And again I saw the shepherds pasturing for twelve hours, and behold, three of those sheep returned, and they arrived and entered, and they began to build up all that had fallen down of that house.
translation:
  language: de
  text: Und wieder sah ich, wie die Hirten zwölf Stunden lang ihre Herden hüteten. Und siehe, drei von jenen Schafen kehrten zurück; sie kamen an, traten ein und begannen, alles wieder aufzubauen, was von jenem Haus eingestürzt war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወእምኔሁ (wa-ʾəmnehu)
  choice: Und wieder
  rationale: Die Wendung leitet eine weitere Visionsepisode ein. „Wieder“ folgt der kontextuellen Funktion, ohne eine unnötig starre zeitliche Abfolge festzulegen.
- source_word: ይርዐዩ (yərʿayu)
  choice: weideten
  rationale: Das Verb bezeichnet die Tätigkeit von Hirten, eine Herde zu hüten beziehungsweise zu weiden; „weideten“ erhält das Bild knapp und natürlich.
- source_word: ፲ወ፪ ሰዓተ (12 śāʿata)
  choice: zwölf Stunden lang
  rationale: Die konkrete Zeitangabe wird formal bewahrt; eine mögliche symbolische Bedeutung wird nicht in die Übersetzung eingetragen.
- source_word: ገብኡ (gabʾu)
  choice: kehrten zurück
  rationale: Das Verb kann „hineingehen/eintreten“ oder kontextuell „zurückkehren“ ausdrücken. Hier passt „kehrten zurück“ zur Rückkunft der drei Schafe; das folgende ቦኡ wird gesondert mit „traten ein“ wiedergegeben.
- source_word: አኀዙ እንዘ ሐንጹ (ʾaḫazu ʾənza ḥanṣu)
  choice: begannen … wieder aufzubauen
  rationale: Die Konstruktion bezeichnet den Beginn des Bauens. „Wieder aufbauen“ entspricht dem Zusammenhang der Wiederherstellung des eingestürzten Hauses.
theological_decisions:
- issue: Deutung der zwölf Stunden und der drei Schafe
  choice: Die Bildsprache bleibt unaufgelöst stehen.
  alternative: Die Stunden als geschichtliche Epoche und die Schafe als bestimmte Personen oder Gruppen identifizieren.
  rationale: Der Vers selbst nennt keine eindeutige Auslegung; eine Identifizierung würde eine spätere oder konfessionell geprägte Deutung in den Text eintragen.
- issue: Verhältnis von Rückkehr, Ankunft und Eintritt
  choice: Alle drei Bewegungsmomente werden beibehalten.
  alternative: Die Folge zu einer einzigen Aussage wie „sie kehrten heim“ zusammenziehen.
  rationale: Die Wiederholung gehört zur erzählerischen und symbolischen Spannung des Ausgangstextes und sollte nicht geglättet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer apokalyptischer Bildsprache. „Und siehe“ bewahrt den feierlichen Visionsstil; ansonsten werden natürliche heutige Satzformen verwendet.
