    text: 'Eine ältere Wiedergabe verstand den Satz aktiv: „Die Wölfe blendeten ihre Augen.“ Die geʿezische Verbform spricht jedoch dafür, dass die Augen der Wölfe geblendet wurden beziehungsweise sich verdunkelten.'
    reason: alternative_reading
