revisions:
- from: Und ich sah die Schafe, bis sie von den Wölfen herauskamen[a]. Da wurden den Wölfen die Augen geblendet[b], und jene Wölfe zogen aus und folgten den Schafen mit all ihrer Kraft.
  to: Und ich sah die Schafe, bis sie aus der Mitte der Wölfe herauskamen[a]. Die Augen der Wölfe wurden geblendet[b], und jene Wölfe gingen hinaus, während sie den Schafen mit all ihrer Kraft folgten.
  rationale: 'Die Revision verbessert zwei deutsche Formulierungen, ohne die Aussage zu verändern: Die räumliche Bewegung der Schafe wird idiomatisch und quellennah gefasst, und die Bewegung der Wölfe wird neutral als Hinausgehen mit gleichzeitigem Folgen wiedergegeben. Die passive Bildsprache der geblendeten Wolfsaugen, die demonstrative Wiederaufnahme der Wölfe und die Intensivierung „mit all ihrer Kraft“ bleiben erhalten.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:25:33Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die passive/intransitive Form von ተጸለሉ zutreffend wieder: Die Augen der Wölfe werden geblendet bzw. verdunkelt, nicht die Schafe durch die Wölfe. Auch das ausdrücklich wiederaufgenommene Subjekt „jene Wölfe“ im Schlussteil und die begleitende Handlung „folgen“ entsprechen dem Geʿez. „Aus der Mitte der Wölfe“ bildet die räumliche Wendung እምአዝእብት klarer und idiomatischer ab als „von den Wölfen heraus“.'
  naturalness: „Von den Wölfen herauskamen“ ist im modernen Standarddeutsch etwas unidiomatisch. „Aus der Mitte der Wölfe herauskamen“ ist klar und wahrt das Bild. „Die Augen der Wölfe wurden geblendet“ ist außerdem unmittelbarer und natürlicher als die Dativkonstruktion. „Gingen hinaus, während sie ... folgten“ gibt die begleitende Verbform ohne die leicht militärisch klingende Nuance von „zogen aus“ wieder.
  terminology: Die Tierbezeichnungen bleiben konsequent. „Geblendet“ bewahrt das konkrete apokalyptische Bild; „folgten“ vermeidet eine nicht ausdrücklich lexikalisierte Steigerung zu „verfolgten“.
  issues:
  - severity: low
    issue: Unidiomatische räumliche Formulierung
    rationale: „Von den Wölfen herauskamen“ ist verständlich, aber im Deutschen weniger natürlich und räumlich weniger präzise als „aus der Mitte der Wölfe herauskamen“.
  - severity: low
    issue: Leicht markierte Bewegungsformulierung
    rationale: „Zogen aus“ kann im Deutschen einen militärischen oder organisierten Aufbruch nahelegen. „Gingen hinaus“ bleibt näher bei der einfachen Bewegungsangabe des Textes.
  revised_text: Und ich sah die Schafe, bis sie aus der Mitte der Wölfe herauskamen[a]. Die Augen der Wölfe wurden geblendet[b], und jene Wölfe gingen hinaus, während sie den Schafen mit all ihrer Kraft folgten.
  revised_footnotes:
