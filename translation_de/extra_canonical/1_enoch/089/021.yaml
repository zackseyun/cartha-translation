base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/021.yaml
  text: And I saw the sheep until they came out from the wolves[a]; and the eyes of the wolves were blinded[b], and those wolves went out following the sheep with all their power.
translation:
  language: de
  text: Und ich sah die Schafe, bis sie aus der Mitte der Wölfe herauskamen[a]. Die Augen der Wölfe wurden geblendet[b], und jene Wölfe gingen hinaus, während sie den Schafen mit all ihrer Kraft folgten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der knappe geʿezische Satzbau beschreibt, dass die Schafe aus dem Bereich oder aus der Mitte der Wölfe herauskamen.
    reason: source_clarity
  - marker: b
    text: 'Eine ältere Wiedergabe verstand den Satz aktiv: „Die Wölfe blendeten ihre Augen.“ Die geʿezische Verbform spricht jedoch dafür, dass die Augen der Wölfe geblendet wurden beziehungsweise sich verdunkelten.'
    reason: alternative_reading
lexical_decisions:
- source_word: ወርኢክዎሙ
  choice: Und ich sah
  rationale: Bewahrt die wiederkehrende Formel des visionären Berichts in natürlichem, würdigem Deutsch.
- source_word: ለአባግዕ
  choice: die Schafe / den Schafen
  rationale: Gibt das fortlaufende Tierbild wieder; ein zusätzliches Demonstrativpronomen ist hier im Deutschen nicht erforderlich.
- source_word: እስከ ወፁኡ እምአዝእብት
  choice: bis sie von den Wölfen herauskamen
  rationale: Bewahrt sowohl die zeitliche Konstruktion als auch die Bewegung aus dem Bereich beziehungsweise aus der Mitte der Wölfe.
- source_word: ተጸለሉ አዕይንቲሆሙ
  choice: Da wurden den Wölfen die Augen geblendet
  rationale: Gibt die passive beziehungsweise intransitive Bedeutung korrekt wieder und erhält das konkrete visionäre Bild.
- source_word: ወወፁኡ እንዘ ይትልውዎሙ
  choice: zogen aus und folgten
  rationale: Die begleitende Handlung wird direkt und ohne die zusätzliche Deutung einer ausdrücklich feindlichen Verfolgung wiedergegeben.
- source_word: ዝኩ አዝእብት
  choice: jene Wölfe
  rationale: Erhält den demonstrativen Bezug und macht das ausdrückliche Subjekt des letzten Satzteils sichtbar.
- source_word: በኵሉ ኃይሎሙ
  choice: mit all ihrer Kraft
  rationale: Eine natürliche deutsche Wendung, die den Einsatz der gesamten Stärke ausdrückt.
theological_decisions:
- issue: Konkretes Bild der geblendeten Augen oder abstrahierende Deutung als Täuschung
  choice: Das konkrete Bild „die Augen wurden geblendet“ bleibt erhalten.
  alternative: „Sie wurden getäuscht“ oder „irregeführt“.
  rationale: Die apokalyptische Tierbildsprache soll nicht durch eine bestimmte politische oder geistliche Auslegung ersetzt werden.
- issue: Semantische Stärke des Folgens
  choice: „folgten“
  alternative: „verfolgten“ oder „jagten“
  rationale: Das gewählte Wort bleibt näher am Grundsinn des geʿezischen Verbs und lässt die feindliche Färbung aus dem Kontext hervorgehen, ohne sie lexikalisch festzuschreiben.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Erzählton. Die wiederholte Tierbezeichnung und das konkrete apokalyptische Bild bleiben erhalten; unnötige interpretierende Zusätze werden vermieden.
