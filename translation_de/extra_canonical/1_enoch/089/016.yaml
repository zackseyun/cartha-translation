base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/016.yaml
  text: And a sheep that had been rescued from the wolves fled and passed into the wild asses of the wilderness[a], and I saw the sheep as they lamented and cried out and petitioned their Lord with all their strength, until that Lord of the sheep came down at the voice of the sheep from his lofty dwelling[d][c][b], and he came to them and saw them.
translation:
  language: de
  text: Und ein Schaf, das vor den Wölfen gerettet worden war, floh und gelangte zu den Wildeseln der Wüste[a]. Da sah ich, wie die Schafe klagten, laut riefen und ihren Herrn mit aller Kraft anflehten, bis jener Herr der Schafe auf die Stimme der Schafe hin aus seiner erhabenen Wohnstatt herabkam[b]. Er kam zu ihnen und sah sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „ging in/zu den Wildeseln der Wüste“. Die Wendung ist syntaktisch schwierig; gemeint ist wohl, dass das Schaf in den Bereich oder zu der Gruppe dieser Tiere gelangte.'
    reason: textual_variant
  - marker: b
    text: 'Die Satzfügung ist knapp: Das Herabkommen geschieht auf die Stimme der Schafe hin; „aus seiner erhabenen Wohnstatt“ bezeichnet den Ausgangsort des Herrn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ፡ ዘድኅነ፡ እምነ፡ አዝእብት
  choice: ein Schaf, das vor den Wölfen gerettet worden war
  rationale: Das Substantiv und die zugehörigen Formen stehen im Singular und bezeichnen zunächst ein einzelnes Schaf; der folgende Text wechselt ausdrücklich zum Plural. „Gerettet“ wahrt die vollendete Befreiung aus konkreter Gefahr.
- source_word: ነፈፀ፡ ወኀለፈ፡ ውስተ፡ አእዱገ፡ ገዳም
  choice: floh und gelangte zu den Wildeseln der Wüste
  rationale: „Floh“ gibt die dringliche Bewegung aus der Gefahr wieder. Die folgende Wendung ist syntaktisch schwierig; „gelangte zu“ bewahrt die Bewegung in den Bereich beziehungsweise die Gemeinschaft der anderen Tiergruppe, ohne im Deutschen das missverständliche „in die Wildesel hinein“ zu verwenden.
- source_word: የአወይዉ፡ ወይጸርኁ፡ ወይስእልዎ፡ ለእግዚኦሙ
  choice: klagten, laut riefen und ihren Herrn … anflehten
  rationale: Die drei Verben beschreiben hörbare Not und eindringliches Bitten. „Anflehen“ ist in diesem Zusammenhang natürlicher und stärker als ein bloßes „bitten“.
- source_word: በኵሉ፡ ኃይሎሙ
  choice: mit aller Kraft
  rationale: Die geläufige deutsche Wendung gibt die vollständige Anstrengung der Schafe knapp und idiomatisch wieder.
- source_word: እግዚአ፡ አባግዕ
  choice: Herr der Schafe
  rationale: Der wiederkehrende göttliche Titel und das Tierbild der Vision bleiben unverändert erkennbar.
- source_word: ኀበ፡ ቃሎሙ፡ ለአባግዕ
  choice: auf die Stimme der Schafe hin
  rationale: Die komprimierte Fügung wird als Reaktion auf den Hilferuf verstanden. „Auf … hin“ wahrt diesen Zusammenhang, ohne die Art der Stimme weiter auszudeuten.
- source_word: እምጽርኁ፡ ልዑል
  choice: aus seiner erhabenen Wohnstatt
  rationale: ጽርሕ bezeichnet hier eine Halle, Kammer oder Wohnstätte; das Suffix ist maskulin Singular. „Wohnstatt“ ist natürlich, würdig und lexikalisch breit, während „erhaben“ die Höhenvorstellung wahrt.
theological_decisions:
- issue: Wiedergabe des göttlichen Titels in der Tierapokalypse
  choice: Herr der Schafe
  alternative: Hirte der Schafe; Besitzer der Schafe
  rationale: „Herr“ übersetzt den Herrschaftstitel, ohne eine nicht ausdrücklich genannte Hirtenrolle einzutragen, und erhält die symbolische Spannung der Vision.
- issue: Herkunft des herabkommenden Herrn
  choice: aus seiner erhabenen Wohnstatt
  alternative: aus seinem hohen Palast; aus seiner erhabenen Halle
  rationale: Die Formulierung bewahrt die räumliche Vorstellung himmlischen Herabkommens, legt die genaue Art des Ortes aber nicht enger fest, als es das Ge'ez verlangt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Der anfängliche Singular und der anschließende Plural werden bewusst unterschieden. Die wiederholte Tiermetaphorik bleibt sichtbar; unnötige historische oder konfessionelle Deutungen werden vermieden.
