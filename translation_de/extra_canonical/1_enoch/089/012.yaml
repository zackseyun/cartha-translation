base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/012.yaml
  text: And that bull which was born from him begot a black wild boar and a white sheep[a]; and that wild boar produced many boars[c][b], and that sheep produced twelve sheep.
translation:
  language: de
  text: Und jener Stier, der von ihm geboren worden war, zeugte ein schwarzes Wildschwein und ein weißes Schaf[a]. Das Wildschwein zeugte viele Wildschweine, und das Schaf zeugte zwölf Schafe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Tiere stehen innerhalb der Traumvision wahrscheinlich für Personen, Völker oder Abstammungslinien. Die Übersetzung behält jedoch die Bildsprache des Textes bei, statt die möglichen geschichtlichen Entsprechungen einzusetzen.
    reason: cultural_note
lexical_decisions:
- source_word: ላህም
  choice: Stier
  rationale: Das maskuline Demonstrativpronomen ውእቱ und die maskuline Relativform ዘተወልደ weisen hier auf ein männliches Rind. „Stier“ wahrt sowohl die Grammatik als auch die Tierbildsprache.
- source_word: ሐራዊያ ገዳም ጸሊመ
  choice: ein schwarzes Wildschwein
  rationale: Die Wortgruppe bezeichnet ein wildes Schwein und nennt ausdrücklich seine schwarze Farbe; beides ist für den symbolischen Kontrast bedeutsam.
- source_word: በግዐ ጸዐዳ
  choice: ein weißes Schaf
  rationale: „Schaf“ vermeidet eine nicht ausdrücklich markierte Geschlechtsbestimmung, während „weiß“ die angegebene Symbolfarbe erhält.
- source_word: አሕርወ ብዙኃነ
  choice: viele Wildschweine
  rationale: Der Plural setzt die zuvor eingeführte Wildschwein-Metaphorik fort. Die Wiederholung ist im Deutschen klarer als ein Wechsel zu „Eber“ oder „Schweine“.
- source_word: ዐሠርተ ወክልኤተ አባግዐ
  choice: zwölf Schafe
  rationale: Die Zahl lautet wörtlich „zehn und zwei“. „Schafe“ bewahrt den allgemeinen Tierbegriff, ohne unbelegt „Lämmer“ einzusetzen.
- source_word: ወለደ
  choice: zeugte
  rationale: Das Verb bezeichnet in dieser genealogischen Folge das Hervorbringen von Nachkommen. Beim männlich bezeichneten Stier sowie den symbolischen Elterntieren ist „zeugte“ eine natürliche, genealogisch präzise Wiedergabe.
theological_decisions:
- issue: Identität der Tiere in der apokalyptischen Vision
  choice: Die Tierbilder bleiben im Haupttext unaufgelöst stehen.
  alternative: Die Tiere unmittelbar als historische Gestalten oder Völker benennen.
  rationale: Der Ausgangstext erzählt bewusst in einer durchgehenden symbolischen Tierwelt. Eine historische Identifizierung im Vers würde Deutung in die Übersetzung eintragen und die Mehrdeutigkeit der Vision verringern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die genealogische Wiederholung und der deutliche Farbkontrast werden bewusst bewahrt. Nur eine sachlich hilfreiche Fußnote wird gesetzt; ihr Marker erscheint unmittelbar nach der ersten vollständigen Gegenüberstellung der Nachkommen.
