base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/042.yaml
  text: And dogs and foxes and wild boars of the field began to devour those sheep[b][a], until the Lord of the sheep raised up from among them one ram to lead them.
translation:
  language: de
  text: Und Hunde, Füchse[b] und Wildschweine des Feldes begannen jene Schafe zu verschlingen, bis der Herr der Schafe aus ihrer Mitte einen Widder[a] auftreten ließ, der sie führen sollte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Textvorlage enthält vor „der Herr der Schafe“ den eingeklammerten Zusatz „ein anderes Schaf“. Sein textkritischer Status und sein Verhältnis zu „einen Widder“ sind unsicher; der Satz beschreibt jedoch, dass der Herr der Schafe einen Widder aus der Herde hervortreten lässt.
    reason: textual_variant
  - marker: b
    text: Das mit „Füchse“ wiedergegebene Tierwort kann auch eine breitere Bedeutung haben und möglicherweise Schakale bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: አኃዙ
  choice: begannen
  rationale: In Verbindung mit dem folgenden Verb bezeichnet die Form den Beginn des Fressens; „begannen“ gibt diesen ingressiven Sinn natürlich wieder.
- source_word: አክላብ
  choice: Hunde
  rationale: Die allgemeine Tierbezeichnung verlangt keine speziellere Wiedergabe wie „Jagdhunde“.
- source_word: ቈናጽል
  choice: Füchse
  rationale: „Füchse“ ist die geläufige Entsprechung für das fuchsartige Raub- oder Aasfressertier; eine Überschneidung mit „Schakale“ bleibt möglich und wird in der Fußnote genannt.
- source_word: ሐራዊያ ሐቅል
  choice: Wildschweine des Feldes
  rationale: Die Wiedergabe bewahrt sowohl die wilden Schweine als auch die ausdrückliche Feld- beziehungsweise Freilandangabe der Bildsprache.
- source_word: ይብልዕዎሙ
  choice: zu verschlingen
  rationale: Im gewaltsamen Zusammenhang gibt „verschlingen“ den räuberischen Vorgang treffender wieder als das neutralere „fressen“.
- source_word: ዝኩ አባግዕ
  choice: jene Schafe
  rationale: „Jene“ erhält den rückverweisenden, demonstrativen Charakter der Wendung.
- source_word: እስከ አንሥአ
  choice: bis … auftreten ließ
  rationale: Die Formulierung bewahrt das aktive Eingreifen des Herrn und vermeidet zugleich die im Deutschen leicht entstehende, hier nicht zwingende Auferstehungsbedeutung von „erweckte“.
- source_word: እግዚአ አባግዕ
  choice: der Herr der Schafe
  rationale: Der wiederkehrende Titel der Tierapokalypse wird in seiner Autorität und theologischen Bedeutung gewahrt.
- source_word: ፩እምኔሆሙ
  choice: aus ihrer Mitte einen
  rationale: Die Wendung macht ausdrücklich, dass der eine Anführer aus der Herde selbst hervorgeht.
- source_word: ሐርጌ
  choice: Widder
  rationale: „Widder“ ist die natürliche deutsche Bezeichnung für das männliche Schaf und wahrt dessen symbolische Unterscheidung von der Herde.
- source_word: ዘይመርሖሙ
  choice: der sie führen sollte
  rationale: Die Wiedergabe erhält den Sinn des Führens oder Leitens, ohne ein im Ausgangswort nicht ausdrücklich enthaltenes Hirtenmotiv hinzuzufügen.
theological_decisions:
- issue: Göttlicher Titel in der Allegorie
  choice: der Herr der Schafe
  alternative: der Besitzer der Schafe
  rationale: „Herr“ wahrt den erhöhten Rang und die göttliche Autorität der allegorischen Gestalt; „Besitzer“ würde den Titel auf ein bloßes Eigentumsverhältnis verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die Tierbildsprache und der wiederkehrende Titel „Herr der Schafe“ bleiben erhalten; unnötig konfessionelle oder auferstehungstheologische Konnotationen werden vermieden.
