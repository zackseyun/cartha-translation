base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/031.yaml
  text: And all those feared and trembled before him[a], and they followed after that ram that was with them [that was in their midst][c][b], because it was not able to stand before our Lord and look at him.
translation:
  language: de
  text: 'Da fürchteten sich alle und zitterten vor ihm. Sie riefen zu jenem Widder, der bei ihnen war – [der sich in ihrer Mitte befand][a] –: »Wir können vor unserem Herrn nicht bestehen und ihn nicht ansehen.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „der sich in ihrer Mitte befand“ stehen im Quellenzeugnis in Klammern und könnten eine unsichere oder sekundäre Lesart sein.
    reason: textual_variant
  - marker: b
    text: 'Die ge’ezische Wendung für „riefen zu“ ist schwierig. Sie kann auch bedeuten: „riefen ihm nach“, „suchten ihn auf“ oder „folgten ihm“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎሙ እልኩ
  choice: alle
  rationale: Die Wendung bezeichnet kollektiv die zuvor Genannten. Das natürliche deutsche „alle“ bewahrt den Rückbezug, ohne die unsichere Form እልኩ durch eine hölzerne Wiedergabe zu überfrachten.
- source_word: ይፈርሁ ወይርዐዱ
  choice: fürchteten sich und zitterten
  rationale: Die beiden Verben bezeichnen Furcht und deren körperliche Wirkung; die Doppelung wird im Deutschen erhalten.
- source_word: እምኔሁ
  choice: vor ihm
  rationale: Im Zusammenhang bezeichnet die Präposition die auf die Gestalt bezogene, ehrfürchtige Angst; „vor ihm“ ist dafür idiomatisch und wahrt den gerichtlichen Klang.
- source_word: ደርኁ ድኅሬሁ
  choice: riefen … nach
  rationale: Die schwierige Verbindung wird als Rufen hinter beziehungsweise zu jemandem hin verstanden. Die räumliche Komponente von ድኅሬሁ bleibt in „nachrufen“ erkennbar; eine Fußnote nennt die wesentlichen Alternativen.
- source_word: ለዝኩ በግዕ
  choice: jenem Widder
  rationale: Das demonstrativ bestimmte Tier bleibt als männliches Schaf wiedergegeben, damit die Bildsprache der Tierapokalypse nicht verallgemeinert wird.
- source_word: ምስሌሆሙ
  choice: der bei ihnen war
  rationale: Die Zugehörigkeit beziehungsweise räumliche Nähe des Widders zur Gruppe wird klar und natürlich ausgedrückt.
- source_word: ዘሀሎ ማእከሎሙ
  choice: der sich in ihrer Mitte befand
  rationale: Die im Quellenzeugnis eingeklammerte nähere Ortsangabe wird ebenfalls sichtbar als unsichere Zusatzlesart markiert.
- source_word: እስመ ኢንክል ቀዊመ
  choice: Wir können … nicht bestehen
  rationale: ኢንክል ist als erste Person Plural („wir können nicht“) verstanden. Dadurch erscheint die Begründung als Inhalt des vorausgehenden Rufens; „bestehen“ gibt das Stehenbleiben vor der göttlichen Gegenwart idiomatisch wieder.
- source_word: ቅድመ እግዚእነ
  choice: vor unserem Herrn
  rationale: Das Possessiv „unserem“ wird bewahrt; „Herr“ entspricht dem würdigen theologischen und visionären Register, ohne den Referenten näher festzulegen.
- source_word: አነጽሮቶ
  choice: ihn ansehen
  rationale: Das Verb bezeichnet ein gerichtetes beziehungsweise aufmerksames Sehen. „Ansehen“ ist gegenwärtiges, würdevolles Deutsch und passt zur Unfähigkeit, vor der Gestalt zu bestehen.
theological_decisions:
- issue: Referent von „unserem Herrn“
  choice: Die Bezeichnung „unser Herr“ bleibt unverändert und wird nicht näher identifiziert.
  alternative: Gott; der Herr der Schafe; der himmlische Herrscher
  rationale: Der ge’ezische Text nennt ausdrücklich „unseren Herrn“. Eine genauere Benennung würde die symbolische Offenheit der Vision unnötig auflösen.
- issue: Subjekt des abschließenden Satzes
  choice: 'Erste Person Plural in direkter Rede: „Wir können … nicht“.'
  alternative: Der Widder konnte nicht vor unserem Herrn bestehen und ihn ansehen.
  rationale: Die Verbform ኢንክል weist auf die erste Person Plural. Die direkte Rede erklärt zugleich, was die Gruppe dem Widder zuruft, und ist quellennäher als ein unpersönlicher beziehungsweise auf das Tier bezogener Singular.
- issue: Tierbezeichnung በግዕ
  choice: Widder
  alternative: Schaf
  rationale: Die männliche Tierbezeichnung bewahrt eine mögliche symbolische Unterscheidung innerhalb der Tierapokalypse. Da „Schaf“ lexikalisch ebenfalls möglich ist, darf die Wahl nicht zur weitergehenden Identifikation der Gestalt benutzt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer apokalyptischer Bildsprache. Die direkte Rede folgt der ge’ezischen Verbform der ersten Person Plural. Die unsichere eingeklammerte Wendung bleibt im Haupttext sichtbar; alle Fußnotenmarker stehen unmittelbar an den betreffenden Stellen.
