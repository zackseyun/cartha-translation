base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/041.yaml
  text: And sometimes their eyes were opened[a], and sometimes they were blinded, until another sheep arose and led them and brought them all in[c][b], and their eyes were opened.
translation:
  language: de
  text: Manchmal wurden ihre Augen geöffnet[a], und manchmal wurden sie blind, bis sich ein anderes Schaf erhob, sie führte und sie alle hineinbrachte[b]; da wurden ihre Augen geöffnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Öffnen der Augen hat in der Vision vermutlich symbolische Bedeutung, etwa Erwachen, Erkenntnis oder wiedergewonnene Urteilskraft; der Text selbst erklärt das Bild jedoch nicht.
    reason: cultural_note
  - marker: b
    text: 'Oder: »sie alle zusammenbrachte«. Das Ziel der Bewegung wird nicht ausdrücklich genannt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ቦ ሰበ … ወቦ ሶበ
  choice: bald … bald
  rationale: 'Die wiederholte ge’ezische Zeitformel bezeichnet einen Wechsel: »manchmal … und manchmal«. »Bald … bald« gibt diesen Wechsel im Deutschen knapp und natürlich wieder.'
- source_word: ይትከሠታ አዕይንቲሆሙ / ተከሥታ አዕይንቲሆሙ
  choice: ihre Augen wurden geöffnet
  rationale: Die wörtliche Bildsprache des Öffnens beziehungsweise Aufdeckens der Augen bleibt erhalten, ohne ihre symbolische Bedeutung festzulegen.
- source_word: ይጼልሙ
  choice: wurden sie blind
  rationale: Das Verb bezeichnet hier den Gegenpol zum Öffnen der Augen. Die verständliche Wiedergabe »blind werden« bewahrt diesen Gegensatz; die mögliche Grundnuance des Dunkelwerdens wird nicht in eine bestimmte Deutung aufgelöst.
- source_word: ተንሥአ ካልእ በግዕ
  choice: bis sich ein anderes Schaf erhob
  rationale: Das Tierbild und die Abfolge der Vision werden wörtlich bewahrt. »Schaf« vermeidet eine nicht ausdrücklich geforderte Festlegung auf ein männliches Tier.
- source_word: መርሖሙ
  choice: sie führte
  rationale: »Führen« gibt das schlichte Leitungsverb wieder, ohne durch »weiden« oder »hüten« zusätzliche Hirtenmotive einzutragen.
- source_word: አግብኦሙ ለኵሎሙ
  choice: sie alle hineinbrachte
  rationale: Die kausative Bewegung des Verbs wird als Hineinbringen wiedergegeben. Da weder Ziel noch räumlicher Bezug genannt sind und auch ein Zurück- oder Zusammenbringen erwogen werden kann, wird die Unbestimmtheit in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Bedeutung der geöffneten Augen in der Tiervision
  choice: Das konkrete Visionsbild der geöffneten Augen bleibt stehen.
  alternative: Die Augen ausdrücklich als Einsicht, Umkehr oder politische Wiederherstellung deuten.
  rationale: Der Text entfaltet die Bedeutung des Bildes an dieser Stelle nicht. Die Übersetzung bewahrt daher seine symbolische Offenheit und legt keine einzelne theologische Deutung fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer rhythmischer Wiederholung. Die Tier- und Augenbilder bleiben konkret; erläuternde Deutungen werden in die Fußnoten verwiesen.
