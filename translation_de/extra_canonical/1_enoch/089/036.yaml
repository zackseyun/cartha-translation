base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/036.yaml
  text: And I saw in the vision until that sheep became a man[a], and built a house for the Lord of the sheep[c][b], and he placed all the sheep in that house.
translation:
  language: de
  text: Und ich sah in der Vision, bis jenes Schaf zu einem Mann wurde[a]. Er baute ein Haus[b] für den Herrn der Schafe und brachte alle Schafe in jenes Haus[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dass das Schaf »zu einem Mann wurde«, gehört zur symbolischen Verwandlung in der Vision. Die Gestalt wird hier nicht näher identifiziert.
    reason: cultural_note
  - marker: b
    text: »Haus« kann hier an ein Heiligtum oder einen Tempel denken lassen; der geʿezische Wortlaut selbst lautet jedoch schlicht »Haus«.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »stellte alle Schafe in jenem Haus auf«; dem Verb liegt wörtlicher die Veranlassung zum Stehen zugrunde, kann im Zusammenhang aber auch das Platzieren bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ
  choice: Schaf
  rationale: Die allgemeine Bezeichnung bewahrt die durchgehende Tierbildsprache der Vision, ohne Alter oder Geschlecht als »Lamm« oder »Widder« näher zu bestimmen.
- source_word: ኮነ ብእሴ
  choice: zu einem Mann wurde
  rationale: Die Verbindung aus Verb und Substantiv bezeichnet hier am natürlichsten eine Verwandlung innerhalb der Vision. Die auffällige Wendung vom Tier zum Menschen bleibt erhalten.
- source_word: ሐነጸ ቤተ
  choice: baute ein Haus
  rationale: Der geʿezische Wortlaut bezeichnet ausdrücklich ein Haus. Mögliche Heiligtums- oder Tempelanklänge werden nicht interpretierend in den Haupttext aufgenommen.
- source_word: ለእግዚአ አባግዕ
  choice: für den Herrn der Schafe
  rationale: »Herr« gibt die Bedeutung von Herr, Gebieter oder Besitzer in einem würdigen, dem visionären Zusammenhang angemessenen Register wieder.
- source_word: አቀሞሙ
  choice: stellte alle Schafe … auf
  rationale: Die Form ist kausativ zu »stehen« und kann auch »hinstellen, aufstellen, einsetzen« bedeuten. »Aufstellen« bewahrt das konkrete Verbalbild, ohne eine weitergehende Deutung einzuführen.
- source_word: በውእቱ ቤት
  choice: in jenem Haus
  rationale: »Jenem« erhält den rückverweisenden demonstrativen Charakter des Ausdrucks.
theological_decisions:
- issue: Wiedergabe von ቤተ als »Haus« oder deutend als »Tempel«
  choice: Haus
  alternative: Tempel; Heiligtum
  rationale: Der unmittelbare Wortlaut lautet »Haus«. Der Zusammenhang mit dem Herrn der Schafe legt zwar kultische Anklänge nahe, doch diese gehören in eine Anmerkung und nicht als Festlegung in den Haupttext.
- issue: Identität des Schafes, das zu einem Mann wird
  choice: im Haupttext nicht identifiziert
  alternative: Mose; eine Mose oder die kultische Führung Israels darstellende Führungsfigur
  rationale: Die Identifizierung der Symbolgestalt ist Auslegung. Die Übersetzung erhält die offene Bildsprache des Verses.
- issue: Bedeutungsumfang von አቀሞሙ
  choice: stellte … auf
  alternative: brachte … hinein; wies … einen Platz zu; ließ … stehen
  rationale: Die gewählte Fassung wahrt das kausative Bild des Stehens. Zugleich weist die Fußnote darauf hin, dass das Verb im Zusammenhang auch allgemeiner das Platzieren bezeichnen kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener apokalyptischer Bildsprache. »Gesicht« wurde statt des sachlicheren »Vision« gewählt, um den biblisch-visionären Ton zu wahren; »weiter« macht die mit »bis« fortlaufende Schau im Deutschen verständlich.
