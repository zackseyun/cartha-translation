- from: Und ich sah in dem Gesicht weiter, bis jenes Schaf zu einem Mann wurde[a]. Er baute ein Haus[b] für den Herrn der Schafe und stellte alle Schafe in jenem Haus auf[c].
  to: Und ich sah in der Vision, bis jenes Schaf zu einem Mann wurde[a]. Er baute ein Haus[b] für den Herrn der Schafe und brachte alle Schafe in jenes Haus[c].
