base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/020.yaml
  text: And the Lord of the sheep came to them[a], and while they were striking those wolves, and the wolves were crying out, the sheep became silent[c][b], and from that time they cried out no more.
translation:
  language: de
  text: Und der Herr der Schafe kam zu ihnen. Während sie jene Wölfe schlugen und die Wölfe schrien, verstummten die Schafe; von da an schrien sie nicht mehr.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die zugrunde liegende Transkription bietet am Schluss አፀርኁ, „sie schrien“. Die kritische Lesart አጸርዑ bedeutet dagegen „sie hörten auf“ und passt zu „die Schafe verstummten“. Wörtlicher lautet der Schluss daher: „und von da an hörten sie auf“; was sie nicht mehr taten, ist nur aus dem Zusammenhang zu erschließen.'
    reason: textual_variant
lexical_decisions:
- source_word: እግዚኦሙ
  choice: der Herr der Schafe
  rationale: Das Possessivsuffix bedeutet wörtlich „ihr Herr“. Im durchgängigen Bildrahmen der Tierapokalypse sind die Schafe der naheliegende Bezug; die ausdrückliche Wiedergabe bewahrt die symbolische Beziehung zu Gott.
- source_word: መጽአ ኀቤሆሙ
  choice: kam zu ihnen
  rationale: Die schlichte Bewegungs- und Zielangabe wird in natürlichem, modernem Deutsch wiedergegeben.
- source_word: አባግዕ
  choice: die Schafe
  rationale: „Schafe“ erhält die wiederkehrende Tiermetaphorik deutlicher als das glättende Kollektiv „Herde“.
- source_word: ይዝብጥዎሙ ለእልኩ አዝእብት
  choice: sie jene Wölfe schlugen
  rationale: Das ለ vor „jenen Wölfen“ fungiert hier als Objektmarker. Daher sind die Wölfe die Geschlagenen, nicht die Handelnden; das nicht eigens genannte Subjekt bleibt mit „sie“ offen.
- source_word: አዝእብት እንዘ የአውይዉ
  choice: die Wölfe schrien
  rationale: „Schrien“ gibt den allgemeinen lautlichen Ausruf wieder, ohne ihn durch „heulten“ stärker zu animalisieren, als es das Verb verlangt.
- source_word: አባግዕ አርመሙ
  choice: die Schafe verstummten
  rationale: „Verstummten“ bezeichnet knapp und idiomatisch den Übergang zum Schweigen.
- source_word: ወእምሶቤሃ አጸርዑ
  choice: von da an schrien sie nicht mehr
  rationale: Die in der kritischen Textgestalt bezeugte Bedeutung „sie hörten auf“ wird mit dem aus dem Zusammenhang ergänzten Vorgang natürlich ausgedrückt. Die Ergänzung und die abweichende Transkription werden in der Fußnote offengelegt.
theological_decisions:
- issue: Identität des Herrn in der Tierapokalypse
  choice: „der Herr der Schafe“ bezeichnet innerhalb der Bildwelt Gott
  alternative: „ihr Herr“ beziehungsweise „ihr Gebieter“ ohne ausdrücklichen Bezug auf die Schafe
  rationale: Die wiederkehrende Bildsprache stellt den göttlichen Herrn den Schafen zugeordnet dar. Die Formulierung macht diese im Kontext vorhandene Beziehung deutlich, ohne spätere dogmatische Begriffe einzutragen.
- issue: Subjekt des abschließenden Aufhörens
  choice: Die Schafe sind das fortwirkende Subjekt; sie schrien von da an nicht mehr
  alternative: Das Subjekt bleibt unbestimmt oder wird auf die Wölfe bezogen
  rationale: Unmittelbar zuvor sind die Schafe das Subjekt von „verstummten“. Diese syntaktische Fortführung ergibt einen stimmigen Parallelismus, wird wegen der knappen und textkritisch schwierigen Formulierung jedoch in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erhaltener apokalyptischer Tierbildsprache. Die Satzteilung verbessert die Lesbarkeit; das Semikolon hält Verstummen und anschließendes Aufhören eng zusammen. Das ungenannte Subjekt der Schläge bleibt bewusst als „sie“ unbestimmt.
