base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/007.yaml
  text: And again I saw in the vision, until all the streams withdrew from that lofty roof, and the fissures of the earth were leveled, and other abysses were opened.
translation:
  language: de
  text: Und wieder sah ich in der Vision, bis alle Wasserläufe von jenem hohen Dach zurückgewichen waren, die Erdspalten eingeebnet wurden und andere Abgründe geöffnet wurden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዕራብት
  choice: Wasserläufe
  rationale: Der Kontext der Flut verlangt eine Bezeichnung für strömende Wassermassen bzw. Wasserläufe; die Wiedergabe bleibt weiter als „Bäche“ und weniger deutend als „Schluchten“.
- source_word: ናሕስ ልዑል
  choice: hohes Dach
  rationale: Die konkrete und ungewöhnliche Bildsprache des äthiopischen Textes wird bewahrt, statt das Bild durch eine kontextuelle Erklärung zu ersetzen.
- source_word: ንቅዐተ ምድር
  choice: Erdspalten
  rationale: Die kompakte deutsche Zusammensetzung gibt die Spalten oder Risse der Erde natürlich und präzise wieder.
- source_word: መዓምቃት ካልአት
  choice: andere Abgründe
  rationale: „Abgründe“ bewahrt die Vorstellung tiefer, geöffneter Bereiche und entspricht dem Plural des Ausgangstextes.
theological_decisions:
- issue: Deutung des hohen Daches in der Flutvision
  choice: Das Bild wird wörtlich als „hohes Dach“ wiedergegeben.
  alternative: Das Bild als Himmel, Arche oder erhöhte Fläche auslegen.
  rationale: Der Ausgangstext identifiziert das Bild nicht ausdrücklich; eine nähere theologische oder erzählerische Bestimmung würde die vorhandene Mehrdeutigkeit auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche visionäre Bildfolge bleibt erhalten; die Satzstruktur mit „bis“ bildet den zeitlichen Verlauf des Ausgangstextes ab.
