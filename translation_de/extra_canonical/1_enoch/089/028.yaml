base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/028.yaml
  text: But the sheep passed from that water and went out into a wilderness where there was no water or grass[a]; and they began to open their eyes and to see. And I saw the Lord of the sheep shepherding them and giving them water and grass[d][c][b], and that sheep going and leading them.
translation:
  language: de
  text: Doch jene Schafe zogen von jenem Wasser weiter und gingen hinaus in eine Wüste, wo es weder Wasser noch Gras gab. Da begannen sie, ihre Augen zu öffnen und zu sehen.[a] Und ich sah den Herrn der Schafe, wie er sie weidete und ihnen Wasser und Gras[b] gab, und jenes Schaf, wie es dahinging und sie führte.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Öffnen der Augen und das Sehen können innerhalb der Vision ein Erwachen oder eine erneuerte Wahrnehmung andeuten; der Haupttext bewahrt jedoch das konkrete Tierbild.
    reason: lexical_alternative
  - marker: b
    text: „Gras“ kann hier auch mit „Weide“ oder „Futter“ wiedergegeben werden; gemeint ist Nahrung für die Herde.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich ist eine fortdauernde Begleithandlung ausgedrückt: Der Seher sieht jenes Schaf im Gehen und Führen.'
    reason: grammar
lexical_decisions:
- source_word: አባግዕሰ
  choice: jene Schafe
  rationale: Die demonstrative beziehungsweise rückverweisende Kraft wird bewahrt und die bereits erwähnte Herde innerhalb der Vision bezeichnet.
- source_word: ኃለፉ እምዝኩ ማይ
  choice: zogen von jenem Wasser weiter
  rationale: Die Wendung bezeichnet die Bewegung von dem zuvor genannten Wasser weg, ohne unnötig ein Durchqueren festzulegen.
- source_word: ውስተ በድው
  choice: in eine Wüste
  rationale: „Wüste“ ist im modernen Deutschen natürlich und bewahrt den biblisch-apokalyptischen Klang, ohne zwingend eine reine Sandwüste zu meinen.
- source_word: ኀበ አልቦ ማየ ወሣዕረ
  choice: wo es weder Wasser noch Gras gab
  rationale: Die paarige Verneinung klingt auf Deutsch natürlich und hält die für Schafe lebensnotwendigen Dinge ausdrücklich fest.
- source_word: አኃዙ ይክሥቱ አዕይንቲሆሙ ወይሬእዩ
  choice: begannen sie, ihre Augen zu öffnen und zu sehen
  rationale: Die wörtliche Bildsprache bleibt erhalten; eine mögliche symbolische Bedeutung als Erwachen oder Wahrnehmung wird nicht in den Haupttext eingetragen.
- source_word: እግዚኦሙ ለአባግዕ
  choice: den Herrn der Schafe
  rationale: Der feste Titel der Tiervision wird übersetzt, aber nicht durch eine erklärende Gottesbezeichnung ersetzt.
- source_word: ይርዕዮሙ
  choice: wie er sie weidete
  rationale: Das Verb hält die aktive Hirten- und Weidetätigkeit im Bildfeld der Herde fest.
- source_word: ይሁቦሙ ማየ ወሣዕረ
  choice: ihnen Wasser und Gras gab
  rationale: Die schlichte Gabe kehrt den zuvor beschriebenen Mangel unmittelbar um.
- source_word: ዝኩ በግዕ
  choice: jenes Schaf
  rationale: Singular und Demonstrativkraft des Ge'ez werden bewahrt; gemeint ist ein bestimmtes, bereits im Visionszusammenhang hervorgetretenes Schaf.
- source_word: እንዘ የሐውር ወይመራሖሙ
  choice: wie es dahinging und sie führte
  rationale: Die deutsche Konstruktion schließt weiterhin an „ich sah“ an und gibt den durativen beziehungsweise begleitenden Charakter der Ge'ez-Konstruktion wieder.
theological_decisions:
- issue: Identität des „Herrn der Schafe“
  choice: Die visionsinterne Bezeichnung „Herr der Schafe“ bleibt unverändert erhalten.
  alternative: „Gott, der Hirte Israels“ oder „der Besitzer der Schafe“
  rationale: Der göttliche Bezug ist im größeren Bildzusammenhang erkennbar, doch eine erklärende Ersetzung würde die apokalyptische Metapher auslegen statt übersetzen.
- issue: Bedeutung des Öffnens der Augen
  choice: Die konkrete Visionssprache „ihre Augen zu öffnen und zu sehen“ wird beibehalten.
  alternative: „sie wurden einsichtig“ oder „sie kamen zur Erkenntnis“
  rationale: Die Worte können ein geistiges Erwachen andeuten, stellen es aber als Handlung der Tiere dar. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die wiederholte Hirten- und Herdenbildsprache sowie die Wahrnehmungsmetaphorik der Tiervision werden bewusst nicht geglättet oder konfessionell ausgedeutet.
