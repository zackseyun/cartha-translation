base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/030.yaml
  text: And among them I saw the Lord of the sheep[a], standing before them; and they saw that he was great and fearsome and mighty[b], and all those sheep saw him and were afraid before him.
translation:
  language: de
  text: Und unter ihnen sah ich den Herrn der Schafe, der vor ihnen stand. Seine Erscheinung war groß[a], furchtgebietend und mächtig. Alle jene Schafe sahen ihn und fürchteten sich vor seinem Angesicht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Groß“ kann hier sowohl sichtbare Größe als auch Erhabenheit oder hohen Rang bezeichnen.
    reason: lexical_ambiguity
  - marker: b
    text: 'Wörtlich etwa: „Sie fürchteten sich wegen seines Angesichts.“ „Angesicht“ kann hier die persönliche Gegenwart bezeichnen.'
    reason: idiom_clarification
lexical_decisions:
- source_word: እምኔሆሙ
  choice: unter ihnen
  rationale: Die Wendung kann eine Herkunft aus der Gruppe oder eine Stellung in ihrer Mitte bezeichnen. „Unter ihnen“ bewahrt diese räumliche Offenheit und passt zur Vision.
- source_word: እግዚአ አባግዕ
  choice: der Herr der Schafe
  rationale: እግዚእ bezeichnet einen Herrn oder Gebieter. „Herr der Schafe“ erhält sowohl die Autorität des göttlichen Akteurs als auch die Tierbildsprache der Vision.
- source_word: ዘቆመ ቅድሜሆሙ
  choice: der vor ihnen stand
  rationale: Die relative Konstruktion und die räumliche Bedeutung von ቅድሜሆሙ werden direkt und in natürlichem Deutsch wiedergegeben.
- source_word: ራእዩ
  choice: seine Erscheinung
  rationale: Die Form bezeichnet hier am ehesten das sichtbare Erscheinungsbild der Gestalt. Die nominale Wiedergabe vermeidet es, den Text unnötig zu einer Aussage darüber umzuformen, was die Schafe erkannten.
- source_word: ዐቢይ
  choice: groß
  rationale: Das Wort kann körperliche Größe, Erhabenheit oder Rang bezeichnen. „Groß“ lässt diese Mehrdeutigkeit bestehen.
- source_word: ግሩም
  choice: furchtgebietend
  rationale: Das Adjektiv verbindet Eindruck von Ehrfurcht mit Schrecken. „Furchtgebietend“ gibt beides wieder, ohne es auf bloße Hässlichkeit oder moralische Schlechtigkeit zu verengen.
- source_word: ኃያል
  choice: mächtig
  rationale: Die Wiedergabe erhält die Bedeutung von Kraft und Macht sowie den gehobenen apokalyptischen Ton.
- source_word: ኵሎሙ ዝኩ አባግዕ
  choice: alle jene Schafe
  rationale: „Jene“ bildet das demonstrative Element ab und verweist auf die bereits im Blick stehende Gruppe.
- source_word: ፈርሁ እምገጹ
  choice: fürchteten sich vor seinem Angesicht
  rationale: Das Verb mit እም kennzeichnet den Gegenstand beziehungsweise Anlass der Furcht; ገጽ bedeutet wörtlich „Gesicht“, kann aber auch die persönliche Gegenwart meinen. Die deutsche Wendung ist grammatisch idiomatisch und bewahrt zugleich das konkrete Bild.
theological_decisions:
- issue: Ist እግዚአ አባግዕ als allgemeiner Herrschaftstitel oder als göttliche Bezeichnung wiederzugeben?
  choice: der Herr der Schafe
  alternative: der Gebieter der Schafe / der Besitzer der Schafe
  rationale: Im Zusammenhang der Tierapokalypse bezeichnet die Gestalt den göttlichen Herrscher. „Herr“ bewahrt dieses Gewicht, ohne die Bildsprache durch eine erklärende Benennung aufzulösen.
- issue: Bezeichnet ራእዩ das Erscheinungsbild oder führt es einen weiteren Akt des Sehens ein?
  choice: Seine Erscheinung war …
  alternative: Sie sahen, dass er … war
  rationale: Die nominale Deutung „seine Erscheinung“ entspricht der Form und erhält den Fokus auf die sichtbare Gestalt. Die alternative verbale Deutung würde die Satzstruktur stärker interpretierend glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener apokalyptischer Bildsprache. „Angesicht“ ist leicht gehoben, aber im Deutschen verständlich und erhält das konkrete Motiv des Ausgangstextes.
