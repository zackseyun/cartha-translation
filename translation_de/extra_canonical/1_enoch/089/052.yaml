base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/052.yaml
  text: And one of them escaped and was not killed[a]; and it cried out over the sheep, and they wanted to kill it, but the Lord of the sheep saved it from among the sheep[c][b], and brought it up to me and set it down.
translation:
  language: de
  text: Und eines von ihnen entkam und wurde nicht getötet. Es sprang auf und schrie über den Schafen[a]. Sie wollten es töten, doch der Herr der Schafe rettete es aus der Mitte der Schafe, brachte es zu mir herauf und stellte es hin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »zu den Schafen« oder »wegen der Schafe«; die Beziehung, die die äthiopische Präposition hier ausdrückt, ist nicht eindeutig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ድኅነ
  choice: entkam
  rationale: Im Zusammenhang mit »wurde nicht getötet« bezeichnet das Verb hier das Entkommen beziehungsweise Überleben; die spätere ausdrückliche Rettung durch den Herrn der Schafe wird davon sprachlich unterschieden.
- source_word: ኢተቀትለ
  choice: wurde nicht getötet
  rationale: Gibt die verneinte Passivform klar und unmittelbar wieder.
- source_word: ቀነጸ
  choice: sprang auf
  rationale: Bewahrt die im Verb ausgedrückte plötzliche Aufwärtsbewegung und die lebendige Bildsprache der Vision.
- source_word: ጸርኀ
  choice: schrie
  rationale: Bezeichnet einen lauten, dringlichen Ruf, ohne ihn näher als Klage, Warnung oder Anrede festzulegen.
- source_word: ዲበ አባግዕ
  choice: über den Schafen
  rationale: Folgt der räumlichen Grundbedeutung der Präposition, ohne die mehrdeutige Beziehung des Rufes zu den Schafen stillschweigend aufzulösen; Alternativen werden in der Fußnote genannt.
- source_word: ፈቀዱ ይቅትልዎ
  choice: sie wollten es töten
  rationale: Gibt die beabsichtigte Handlung in natürlichem, modernem Deutsch wieder.
- source_word: እግዚአ አባግዕ
  choice: der Herr der Schafe
  rationale: Bewahrt den wiederkehrenden ehrerbietigen Gottestitel und zugleich die Tierbildsprache der Vision.
- source_word: አድኃኖ
  choice: rettete es
  rationale: Drückt die ausdrücklich dem Herrn der Schafe zugeschriebene Befreiung deutlich aus.
- source_word: እምኔሆሙ ለአባግዕት
  choice: aus der Mitte der Schafe
  rationale: 'Versteht das pronominale Suffix proleptisch und das folgende Substantiv als dessen nähere Bestimmung: Der Gerettete wird aus dem Kreis der Schafe herausgenommen.'
- source_word: አዕረጎ ኀቤየ
  choice: brachte es zu mir herauf
  rationale: Bewahrt sowohl die Bewegung zum Seher als auch die im Verb enthaltene Aufwärtsrichtung.
- source_word: አንበሮ
  choice: stellte es hin
  rationale: Gibt die abschließende Platzierung anschaulich wieder, ohne einen dauerhaften Aufenthalt hineinzulesen.
theological_decisions:
- issue: Gottestitel innerhalb der Tierapokalypse
  choice: der Herr der Schafe
  alternative: der Besitzer der Schafe
  rationale: »Herr« wahrt die ehrerbietige theologische Funktion des Titels, ohne die visionäre Metapher zu verflachen.
- issue: Bezug von እምኔሆሙ ለአባግዕት
  choice: aus der Mitte der Schafe
  alternative: von ihnen für die Schafe
  rationale: Die proleptische Konstruktion identifiziert das vorausgehende »ihnen« durch das nachgestellte »die Schafe«. So bleibt die Rettung aus der feindlichen Gruppe erkennbar, ohne einen zusätzlichen theologischen Zweckbezug einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen, klaren Erzählsätzen. Das grammatische Neutrum »es« folgt dem deutschen »Schaf« und vermeidet eine nicht ausdrücklich markierte Geschlechtszuweisung. Die ungewöhnliche Wendung »über den Schafen« bleibt wegen der Mehrdeutigkeit des Ausgangstextes stehen und wird durch eine Fußnote erläutert.
