base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/071.yaml
  text: And the book was read before the Lord of the sheep[a], and he took the book from his hand and read it, and sealed it[c][b], and set it down.
translation:
  language: de
  text: Und das Buch wurde vor dem Herrn der Schafe verlesen. Dann nahm er das Buch aus seiner Hand[a], las es, versiegelte es und legte es nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wessen Hand gemeint ist, wird im überlieferten Wortlaut nicht ausdrücklich gesagt.
    reason: alternative_reading
lexical_decisions:
- source_word: መጽሐፍ
  choice: Buch
  rationale: Der gewöhnliche ge’ezische Ausdruck bezeichnet ein Buch oder Schriftstück; „Buch“ ist natürlich und legt die materielle Form nicht unnötig als Schriftrolle fest.
- source_word: ተነበ
  choice: wurde verlesen
  rationale: Die Form ist offenbar eine beschädigte bzw. verkürzte Überlieferung von ተነበበ, „wurde gelesen“. „Verlesen“ macht deutlich, dass zunächst vor dem Herrn der Schafe gelesen wird; danach liest er selbst.
- source_word: በቅድመ
  choice: vor
  rationale: Gibt die Gegenwart bzw. das Geschehen vor einer Autorität knapp und idiomatisch wieder.
- source_word: እግዚአ አባግዕ
  choice: dem Herrn der Schafe
  rationale: Bewahrt den erhöhten Titel und die durchgehende Bildsprache der Tierapokalypse.
- source_word: ነሥአ
  choice: nahm
  rationale: Die direkte narrative Bedeutung ist das An-sich-Nehmen des Buches.
- source_word: እምእዱ
  choice: aus seiner Hand
  rationale: Bewahrt das konkrete Bild und die im Ge’ez nicht ausdrücklich aufgelöste Mehrdeutigkeit des Pronomenbezugs.
- source_word: አንበበ
  choice: las
  rationale: Bezeichnet hier das Lesen des schriftlichen Berichts; „rezitierte“ wäre möglich, aber weniger naheliegend.
- source_word: ኀተማ
  choice: versiegelte
  rationale: Bewahrt die rechtlich-dokumentarische Vorstellung, ein Schriftstück mit einem Siegel zu verschließen oder zu bestätigen.
- source_word: አንበረ
  choice: legte es nieder
  rationale: Gibt den konkreten abschließenden Vorgang des Platzierens in würdigem, natürlichem Deutsch wieder.
theological_decisions:
- issue: Wiedergabe von እግዚአ አባግዕ in der Tierapokalypse
  choice: Herr der Schafe
  alternative: Gebieter der Schafe
  rationale: „Herr“ wahrt die göttliche Autorität und den erhöhten apokalyptischen Sprachton, ohne die Schafmetapher aufzulösen.
- issue: Wiederholung des Lesens
  choice: 'Die beiden Lesehandlungen bleiben erhalten: Das Buch wird zunächst vor ihm verlesen, danach liest er es selbst.'
  alternative: Die erste Handlung als Öffnen des Buches verstehen
  rationale: Die zugrunde liegende Verbform ist am besten als Passiv von „lesen“ zu verstehen. Die Wiederholung ist inhaltlich sinnvoll und darf nicht durch eine glättende Übersetzung beseitigt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer apokalyptischer Bildsprache. „Verlesen“ unterscheidet die erste, passive Lesehandlung natürlich vom anschließenden persönlichen Lesen. Die Pronomenmehrdeutigkeit bleibt in Text und Fußnote erhalten.
