base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/035.yaml
  text: And that ram took other sheep with him[a], and came upon those sheep that had gone astray; and he began to kill them. And the sheep were afraid before him, and that ram made those sheep that had gone astray return[b], and they went back into their folds.
translation:
  language: de
  text: Und jener Widder nahm andere Schafe mit sich und ging auf jene Schafe zu, die sich verirrt hatten. Da begann er, sie zu töten.[a] Die Schafe fürchteten sich vor ihm; und jener Widder brachte jene Schafe, die sich verirrt hatten, zurück, und sie kehrten in ihre Hürden zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Er ergriff sie, um sie zu töten.“ Die geezische Konstruktion kann entweder das Einsetzen der Tötungshandlung oder das Ergreifen mit dem Ziel zu töten hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በግዕ
  choice: Widder
  rationale: Die Bezeichnung hebt in der Tierapokalypse das führende männliche Schaf von den übrigen Schafen ab.
- source_word: ነሥአ ምስሌሁ ባዕደ አባግዐ
  choice: nahm andere Schafe mit sich
  rationale: አባግዐ ist hier pluralisch; daher ist die ältere Singularauffassung „ein anderes Schaf“ grammatisch nicht angemessen.
- source_word: ቦአ ዲበ
  choice: ging gegen … vor
  rationale: Die Verbindung bezeichnet eine Bewegung auf die Gruppe zu und trägt im Kontext konfrontative Kraft, ohne ausdrücklich einen militärischen Angriff zu benennen.
- source_word: እለ ስሕቱ
  choice: die sich verirrt hatten
  rationale: Die Formulierung bewahrt sowohl das konkrete Bild verirrter Schafe als auch den übertragenen Sinn des Fehlgehens.
- source_word: አኀዘ ይቅትሎሙ
  choice: begann er, sie zu töten
  rationale: Die Konstruktion kann den Beginn der Tötungshandlung ausdrücken; die alternative, wörtlichere Auffassung wird in der Fußnote festgehalten.
- source_word: ፈርሁ እምገጹ
  choice: fürchteten sich vor ihm
  rationale: Natürliches modernes Deutsch, das die Furcht angesichts seiner Gegenwart wiedergibt.
- source_word: አግብኦሙ
  choice: brachte … zur Umkehr
  rationale: Die kausative Verbform besagt, dass der Widder ihre Rückkehr bewirkt; „Umkehr“ erhält zugleich die räumliche und übertragene Spannung.
- source_word: አዕጻዲሆሙ
  choice: ihre Hürden
  rationale: „Hürden“ ist ein geläufiger pastoraler Ausdruck und bewahrt die Bildwelt der Schafvision.
theological_decisions:
- issue: Gewalt des Widders gegen die verirrten Schafe
  choice: Die ausdrückliche Tötungssprache bleibt im Haupttext erhalten.
  alternative: Die Handlung als „bestrafen“ oder „schlagen“ abschwächen.
  rationale: Das geezische Verb bezeichnet Töten. Eine Abschwächung würde die Härte der apokalyptischen Gerichtsszene verdecken.
- issue: Kausative Rückführung und mögliche moralische Bedeutung
  choice: „brachte … zur Umkehr“
  alternative: „führte … zurück“
  rationale: Die gewählte Formulierung wahrt die kausative Bedeutung und lässt offen, ob neben der Rückkehr zu den Hürden auch moralische Umkehr mitschwingt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die allegorische Tierbildsprache und die Härte der Gewaltdarstellung wurden beibehalten; unnötig altertümliche Wendungen wurden vermieden.
