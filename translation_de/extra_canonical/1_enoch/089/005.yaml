base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/005.yaml
  text: And all the cattle in that enclosure were gathered together[a], until I saw them sink, and be swallowed up[d][c][b], and be destroyed in that water.
translation:
  language: de
  text: Und alle Rinder, die sich in jenem umfriedeten Bereich[a] befanden, versammelten sich, bis ich sie in jenem Wasser versinken, verschlungen werden und umkommen sah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Feld“ oder „Weide“. Dasselbe geezische Wort bezeichnet hier wie in den vorausgehenden Versen den abgegrenzten Raum, der sich mit Wasser füllt.'
    reason: lexical_alternative
  - marker: b
    text: 'Die drei aufeinanderfolgenden Verben steigern das Bild ihres Untergangs: Sie versinken, werden verschlungen und kommen um.'
    reason: literary_note
lexical_decisions:
- source_word: ኵሎሙ
  choice: alle
  rationale: Gibt die umfassende Mengenangabe schlicht und vollständig wieder.
- source_word: አላህምት
  choice: Rinder
  rationale: Bewahrt die konkrete Herdentier-Bildsprache der Tierapokalypse; „Tiere“ wäre zu weit, „Ochsen“ zu eng.
- source_word: እለ ውእቱ ዐጸድ
  choice: die in jener Umfriedung waren
  rationale: Die elliptische geezische Wendung wird im Deutschen ergänzt. „Umfriedung“ wahrt den räumlichen Zusammenhang mit der in den vorausgehenden Versen beschriebenen, sich mit Wasser füllenden Fläche.
- source_word: ተጋብኡ
  choice: kamen zusammen
  rationale: Gibt die kollektive, reflexiv-passive Bewegung natürlich wieder, ohne ausdrücklich einen nicht genannten Handelnden einzuführen.
- source_word: እስክነ ርኢክዎሙ
  choice: bis ich sie … sah
  rationale: Bewahrt sowohl den zeitlichen Fortgang als auch das im geezischen Verb enthaltene Objekt „sie“.
- source_word: ይሠጠሙ
  choice: versinken
  rationale: Bezeichnet anschaulich das Hinabsinken beziehungsweise Untertauchen im Wasser.
- source_word: ይትወንጡ
  choice: verschlungen werden
  rationale: Erhält die passive, gewaltsame Vorstellung des Verschlungen- oder Überwältigtwerdens.
- source_word: ይትኃጐሉ
  choice: umkommen
  rationale: Gibt den abschließenden Untergang wieder, ohne mit „vernichtet werden“ unnötig über den Wortlaut hinauszugehen.
- source_word: ማይ
  choice: Wasser
  rationale: Entspricht dem Singular des Ausgangstextes; der Flutkontext muss nicht erklärend in die Übersetzung aufgenommen werden.
theological_decisions:
- issue: Tierbildsprache in den Traumvisionen
  choice: Die Herde wird konkret als „Rinder“ bezeichnet.
  alternative: Die Tiere unmittelbar als Menschen oder als ein bestimmtes Volk zu deuten.
  rationale: Die Übersetzung bewahrt das apokalyptische Symbolbild und nimmt seine Deutung nicht im Haupttext vorweg.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nahe an der geezischen Visionserzählung; „bis ich sie … sah“ wahrt ausdrücklich das Objektsuffix des Ausgangstextes. Die dreifache Untergangsformel wird ohne Glättung beibehalten.
