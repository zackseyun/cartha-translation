base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/022.yaml
  text: And the Lord of the sheep went with them as he led them[a], and all his sheep followed him[b]; and his face was glorious and splendid and terrible to behold.
translation:
  language: de
  text: Und der Herr der Schafe ging mit ihnen, während er sie führte; und alle seine Schafe folgten ihm. Sein Angesicht war herrlich und erhaben[a] und furchtgebietend anzusehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »majestätisch« beziehungsweise »von hoher Würde«; das ge’ezische Wort kann Ehre und Gewichtigkeit ebenso wie sichtbare Pracht bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: »Furchtgebietend« meint hier einen Anblick, der ehrfürchtiges Erschrecken hervorruft, nicht moralische Bosheit.
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕ
  choice: der Herr der Schafe
  rationale: Bewahrt die Genitivbeziehung, den hohen theologischen Ton und zugleich die konkrete Tierbildwelt der Vision.
- source_word: ሖረ ምስሌሆሙ
  choice: ging mit ihnen
  rationale: Gibt die schlichte Bewegung und Begleitung natürlich wieder, ohne eine nicht ausdrücklich bezeichnete Richtung hinzuzufügen.
- source_word: እንዘ ይመራሖሙ
  choice: und führte sie
  rationale: Die Begleithandlung wird im Deutschen idiomatisch koordiniert; „führte“ wahrt den Sinn, ohne das deutendere „weidete“ oder „hütete“ einzutragen.
- source_word: ኵሎሙ አባግዒሁ
  choice: alle seine Schafe
  rationale: Gibt die ausdrückliche Gesamtheit und Zugehörigkeit wieder und erhält das konkrete Schafmotiv.
- source_word: ተለውዎ
  choice: folgten ihm
  rationale: Entspricht im Zusammenhang eines Führenden und seiner Schafe klar dem relationalen und gerichteten Sinn.
- source_word: ገጹ
  choice: sein Angesicht
  rationale: Bewahrt das konkrete, anthropomorphe Visionsbild; „Angesicht“ trägt hier einen würdigen, aber verständlichen biblischen Ton.
- source_word: ስቡሕ
  choice: herrlich
  rationale: Vermittelt in dieser Beschreibung Glanz und Ehre, ohne den Ausdruck auf bloß sichtbare Schönheit zu verengen.
- source_word: ክቡር
  choice: erhaben
  rationale: Hält das zweite Adjektiv von „herrlich“ unterscheidbar und erfasst Ehre, Gewichtigkeit und Majestät; „prächtig“ wäre stärker auf sichtbaren Glanz beschränkt.
- source_word: ግሩም ለርእይ
  choice: furchtgebietend anzusehen
  rationale: Drückt ehrfurchtgebietenden Schrecken aus und vermeidet das im heutigen Deutsch leicht moralisch missverständliche „schrecklich“.
theological_decisions:
- issue: Identität und Darstellung der führenden Gestalt in der Tierapokalypse
  choice: „der Herr der Schafe“; die Schafbildwelt bleibt wörtlich erhalten
  alternative: „ihr Herr“, „der Besitzer/Hirte der Schafe“
  rationale: Die Formulierung wahrt sowohl die souveräne, theologisch gewichtige Gestalt als auch die fortlaufende apokalyptische Tiersymbolik, ohne diese in eine auslegende Klartextfassung aufzulösen.
- issue: Bedeutung von ግሩም in der Gotteserscheinung
  choice: „furchtgebietend“
  alternative: „schrecklich“, „ehrfurchtgebietend“, „wunderbar“
  rationale: Der Ausdruck bezeichnet hier numinose, ehrfürchtige Furcht und keine moralische Bosheit. „Furchtgebietend“ hält diese Spannung knapp und verständlich fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter apokalyptischer Bildsprache. „Angesicht“ dient dem erhöhten Visionsregister; Satzbau und Verben bleiben ansonsten klar und gegenwärtig.
