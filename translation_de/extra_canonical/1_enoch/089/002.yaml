base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/002.yaml
  text: And again I lifted up my eyes toward heaven[a], and I saw a lofty roof, and seven streams upon it[c][b]; and those streams flowed into an enclosure with much water.
translation:
  language: de
  text: Und wieder erhob ich meine Augen zum Himmel und sah ein hohes Dach[a] und sieben Wasserläufe darauf; und diese Wasserläufe strömten in ein Gehege[b] mit viel Wasser.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „Dach“ wiedergegebene Wort kann auch eine Bedeckung oder einen oberen Aufbau bezeichnen; das genaue Bild ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „in einen umfriedeten Hof“. Das Wort kann einen Hof, einen umschlossenen Bereich oder ein Gehege bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ካዕበ
  choice: Und wieder
  rationale: Bewahrt die wiederholende Erzählformel der Vision in natürlichem Deutsch.
- source_word: አልዓልኩ አዕይንትየ
  choice: erhob ich meine Augen
  rationale: Gibt die visionäre Redewendung formal und dennoch verständlich wieder, statt sie zu „ich blickte auf“ zu verflachen.
- source_word: መንገለ ሰማይ
  choice: zum Himmel
  rationale: Gibt die Richtungsbedeutung von መንገለ idiomatisch wieder.
- source_word: ናሕሰ ልዑለ
  choice: ein hohes Dach
  rationale: „Dach“ wahrt die wahrscheinliche konkrete Bedeutung von ናሕሰ; „hoch“ bildet das Höhenadjektiv ab, ohne die Gestalt näher festzulegen.
- source_word: ወ፯አስራብ ዲቤሁ
  choice: und sieben Wasserläufe darauf
  rationale: „Wasserläufe“ lässt sowohl Bäche als auch kanalisierte Ströme zu; „darauf“ bewahrt den örtlichen Bezug auf das Dach.
- source_word: እልኩ አስራብ
  choice: diese Wasserläufe
  rationale: Der rückverweisende Ausdruck nimmt die zuvor genannten sieben Wasserläufe wieder auf.
- source_word: ይውሕዙ
  choice: strömten
  rationale: Bezeichnet die Bewegung des Wassers anschaulich, ohne ein gewaltsames Gießen oder Schütten einzutragen.
- source_word: በ፯ዐጸድ
  choice: in eine Einfriedung
  rationale: „Einfriedung“ erhält das Bild eines abgegrenzten Bereichs und unterstützt den lexikalischen Zusammenhang mit den folgenden Versen; „Hof“ bleibt als mögliche Alternative in der Fußnote erhalten.
- source_word: ማየ ብዙሐ
  choice: mit viel Wasser
  rationale: Bewahrt die konkrete Mengenangabe und die syntaktische Mehrdeutigkeit, ob das viele Wasser besonders die Einfriedung oder das Einströmen charakterisiert.
