base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/003.yaml
  text: And again I saw[a], and behold, springs were opened upon the earth in that great enclosure, and that water was bubbling up and rising over the earth, and that enclosure appeared[e][d][c][b], until all its land was covered with water.
translation:
  language: de
  text: 'Und wieder sah ich: Siehe, auf der Erde, in jenem großen Gehege[a], wurden Quellen[b] geöffnet. Während das Wasser hervorquoll und über die Erde stieg, war jenes Gehege zu sehen[c], bis sein ganzes Land mit Wasser bedeckt war[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in jenem großen umgrenzten Gebiet«; auch »großes Feld«, »großer Hof« oder »großer Garten« sind möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: »Wasserquellen« oder »Quellorte«.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher auch: »erschien jenes Gehege« oder »wurde jenes Gehege sichtbar«. Der Satzbau ist schwierig; gemeint sein kann, dass das Gehege während des Ansteigens des Wassers noch sichtbar war, bis es ganz bedeckt wurde.'
    reason: alternative_reading
  - marker: d
    text: 'Oder: »bis die ganze Erde mit Wasser bedeckt war«. Die Form kann entweder auf das Land des Geheges zurückweisen oder weiter gefasst werden.'
    reason: alternative_reading
lexical_decisions:
- source_word: አንቅዕታት
  choice: Quellen
  rationale: Der Plural bezeichnet hier natürliche Wasseraustritte. »Quellen« ist im Deutschen anschaulich und legt – anders als »Brunnen« – kein von Menschen errichtetes Bauwerk nahe.
- source_word: ተርሕዉ
  choice: wurden geöffnet
  rationale: Die passive Form des Ausgangstextes bleibt erhalten und passt zur Flutdarstellung, in der die Wasserquellen geöffnet werden.
- source_word: ዐጸድ ዐቢይ
  choice: großes Gehege
  rationale: »Gehege« bewahrt die Vorstellung eines abgegrenzten Bereichs, ohne diesen näher als Acker, Hof oder Garten zu bestimmen.
- source_word: ወአንዘ ... ይፈልሕ ወይትነሣእ
  choice: Während das Wasser hervorquoll und über die Erde stieg
  rationale: ወአንዘ leitet einen temporalen Nebensatz ein. »Hervorquoll« gibt das Austreten des Wassers wieder, »stieg« dessen zunehmende Höhe; ein nicht belegtes »begann« wird vermieden.
- source_word: ተአርአየ ለውእቱ ዐጸድ
  choice: war jenes Gehege zu sehen
  rationale: Die sachliche Formulierung gibt die schwierige Aussage vom Sichtbarsein beziehungsweise Erscheinen des Geheges wieder, ohne den unklaren Bildablauf stärker auszudeuten.
- source_word: ኵሉ ምድሩ
  choice: sein ganzes Land
  rationale: Das pronominale Element wird am natürlichsten auf das zuvor genannte Gehege bezogen. »Land« wahrt zugleich die Bedeutungsbreite von ምድር zwischen Boden, Land und Erde.
theological_decisions:
- issue: Reichweite der Überflutung im Traumgesicht
  choice: Der Haupttext bezieht »sein ganzes Land« auf den umgrenzten Bereich.
  alternative: Die Wendung kann als »die ganze Erde« verstanden werden und damit eine universale Überflutung bezeichnen.
  rationale: Die äthiopische Form erlaubt einen Rückbezug auf das Gehege, doch ምድር kann auch »Erde« bedeuten. Der Haupttext folgt dem näheren grammatischen Bezug; die Fußnote hält die weiter reichende Lesart offen.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch mit enger Bindung an die äthiopische Syntax. Der visionäre Auftakt »Und wieder sah ich: Siehe« bleibt erhalten. Die zeitliche Konstruktion mit »während« stellt den Ablauf klar dar, ohne die schwierige Sichtbarkeitsaussage oder die Reichweite der Flut stillschweigend festzulegen.'
