base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/048.yaml
  text: And afterward that ram arose and led the sheep[a]; and that ram fathered many sheep and lay down. And a little sheep became a ram in its place[d][c][b], and it became ruler and leader of those sheep.
translation:
  language: de
  text: Und jener spätere Widder erhob sich und führte die Schafe; und jener Widder zeugte viele Schafe und legte sich nieder.[a] Und ein kleines Schaf[b] wurde an seiner Stelle zu einem Widder, und es wurde Herrscher und Anführer jener Schafe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „Sich-Niederlegen“ bezeichnet in der Bildsprache der Vision wahrscheinlich den Tod des Widders; der Haupttext bewahrt jedoch das wörtliche Bild.
    reason: lexical_alternative
  - marker: b
    text: Das mit „klein“ wiedergegebene Wort kann auch „jung“ bedeuten; gemeint sein kann daher ein kleines oder ein junges Schaf.
    reason: lexical_alternative
lexical_decisions:
- source_word: ዳሓራዊ፡ ዝኩ፡ ሐርጌ
  choice: jener spätere Widder
  rationale: ዳሓራዊ ist hier adjektivisch und bestimmt „Widder“; „spätere“ bewahrt den Gegensatz zu einem früheren Widder und vermeidet die adverbiale Fehldeutung „danach“.
- source_word: ሐርጌ
  choice: Widder
  rationale: Die konkrete, männlich markierte Tiergestalt der Allegorie bleibt erhalten.
- source_word: ተንሥአ
  choice: erhob sich
  rationale: Gibt das narrative Aufstehen in einem würdigen, aber heutigen Register wieder.
- source_word: መርሖሙ
  choice: führte
  rationale: Bewahrt sowohl die konkrete Führung der Schafe als auch die politische Bedeutungsebene der Vision.
- source_word: አባግዕ
  choice: Schafe
  rationale: Die konkrete Tierbezeichnung wird nicht zum abstrakteren „Herde“ umgedeutet.
- source_word: ወሊደ
  choice: zeugte
  rationale: Der ausdrücklich generative Sinn des Verbs und das männliche Subjekt bleiben erkennbar.
- source_word: ሰከበ
  choice: legte sich nieder
  rationale: Die wörtliche Bildsprache bleibt im Haupttext stehen; die wahrscheinliche Todesbedeutung wird in einer Fußnote erläutert.
- source_word: በግዕ፡ ንኡስ
  choice: ein kleines Schaf
  rationale: „Klein“ bewahrt die mögliche Bedeutung körperlicher Kleinheit; die ebenfalls mögliche Altersbedeutung wird angemerkt.
- source_word: ህየንቴሁ
  choice: an seiner Stelle
  rationale: Markiert Nachfolge oder Ersetzung, ohne die Tierallegorie historisierend aufzulösen.
- source_word: መኰንነ
  choice: Herrscher
  rationale: Bezeichnet allgemein eine Autoritätsstellung, ohne einen engeren späteren Amtstitel einzutragen.
- source_word: መራሔ
  choice: Anführer
  rationale: Gibt die leitende Stellung als Nomen wieder und unterscheidet sie vom vorangehenden Verb „führte“.
theological_decisions:
- issue: Deutung der Nachfolgeformel als politische oder dynastische Aussage
  choice: ein kleines Schaf wurde an seiner Stelle zu einem Widder
  alternative: ein junges Schaf wurde als sein Nachfolger zum Widder
  rationale: Die Vision spricht in einer Tierverwandlungs- und Nachfolgebildsprache. Der Text bewahrt diese symbolische Form, statt sie ausdrücklich in historische oder dynastische Begriffe aufzulösen.
- issue: Bedeutung des Niederlegens
  choice: legte sich nieder
  alternative: starb
  rationale: Das Niederlegen dürfte im Zusammenhang der Vision den Tod anzeigen; die Übersetzung hält jedoch das konkrete Bild fest und erläutert die mögliche Bedeutung nur in der Fußnote.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem apokalyptischem Erzählton. Die wiederholten Tierbezeichnungen und die symbolische Nachfolge bleiben sichtbar; unnötige Archaismen und konfessionell geprägte Deutungen werden vermieden.
