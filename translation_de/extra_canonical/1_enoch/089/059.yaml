base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/059.yaml
  text: And he summoned seventy shepherds and gave over those sheep to them, that they might pasture them. And he said to the shepherds and to their companions, “From now on, each of you shall pasture the sheep, and do all that I command you.”
translation:
  language: de
  text: 'Und er rief siebzig Hirten zusammen und übergab ihnen jene Schafe, damit sie sie weiden sollten. Und er sagte zu den Hirten und zu ihren Gefährten[a]: „Von nun an sollt ihr alle siebzig[b] die Schafe weiden und alles tun, was ich euch befehle.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der mit „Gefährten“ wiedergegebene Ausdruck ist in diesem Zusammenhang nicht ganz eindeutig; gemeint sind wohl diejenigen, die mit den Hirten verbunden oder ihnen zugeordnet sind.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im äthiopischen Text erneut „ihr alle siebzig“. Die Wiederholung der bereits genannten Zahl bleibt hier erhalten; möglich wäre auch eine stärker verteilende Wiedergabe: „jeder von euch“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ጸውዐ
  choice: rief … zusammen
  rationale: Die Wendung bezeichnet hier eine förmliche Zusammenrufung zur Beauftragung; sie ist im heutigen Deutsch natürlicher als das stärker amtssprachliche „berief“.
- source_word: ኖላዊያነ
  choice: Hirten
  rationale: „Hirten“ bewahrt das durchgehende Tier- und Hirtenbild der Tiervision, ohne dessen mögliche geschichtliche oder übernatürliche Referenten auszudeuten.
- source_word: ገደፎሙ ሎሙ
  choice: übergab ihnen
  rationale: Die Formulierung drückt die Übertragung von Obhut und Verantwortung aus und bleibt dabei knapp und würdig.
- source_word: አባግዕ
  choice: Schafe
  rationale: Der konkrete Plural erhält die Bildsprache besser als das kollektiv-abstraktere „Herde“.
- source_word: ከመ ይርዐይዎሙ
  choice: damit sie sie weideten
  rationale: Das Verb beschreibt die Tätigkeit der Hirten an den Schafen; „weiden“ ist idiomatisch und bewahrt die Tiermetaphorik.
- source_word: ለጸማዶሙ
  choice: zu ihren Gefährten
  rationale: Der Ausdruck bezeichnet offenbar mit den Hirten verbundene oder ihnen zugeordnete Personen bzw. Wesen; „Gefährten“ lässt diese Beziehung bewusst unbestimmt.
- source_word: ኵሉ ፯፯ እምኔክሙ
  choice: ihr alle siebzig
  rationale: Die Übersetzung bewahrt die im äthiopischen Text wiederholte Zahl siebzig und zugleich die Gesamtheit der Angesprochenen, statt die Wendung nur distributiv als „jeder von euch“ wiederzugeben.
- source_word: እምይእዜ
  choice: von nun an
  rationale: Die geläufige Wendung markiert klar den Beginn des Auftrags.
- source_word: ኵሎ ዘአአዝዘክሙ አነ ግበሩ
  choice: alles tun, was ich euch befehle
  rationale: Die Formulierung erhält sowohl den umfassenden Gehorsamsanspruch als auch den imperativischen Charakter der Beauftragung.
theological_decisions:
- issue: Ob die Hirten und Schafe im Haupttext als bestimmte Herrscher, Engel, Menschen oder als Israel gedeutet werden sollen
  choice: Die visionäre Bildsprache bleibt als „Hirten“ und „Schafe“ stehen.
  alternative: Die Bilder unmittelbar als Herrscher oder Engel und als Volk beziehungsweise Israel wiedergeben.
  rationale: Der Text spricht in einer fortlaufenden apokalyptischen Tiervision. Eine Auflösung der Symbole im Haupttext würde eine bestimmte Deutung festschreiben, die der Wortlaut selbst hier nicht ausdrücklich nennt.
- issue: Ob die Gefährten in die Gruppe der siebzig einzubeziehen sind
  choice: Die syntaktische Spannung wird durch „zu den Hirten und zu ihren Gefährten … ihr alle siebzig“ erhalten.
  alternative: Nur die Hirten als die siebzig Angesprochenen darstellen oder die Gefährten ausdrücklich in die Zahl einrechnen.
  rationale: Die Abfolge des äthiopischen Textes lässt das genaue Verhältnis zwischen den Hirten, ihren Gefährten und der Zahl siebzig nicht völlig eindeutig erkennen; die Übersetzung entscheidet diese Frage daher nicht stillschweigend.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die wiederholten Pronomen in „damit sie sie weideten“ sind grammatisch eindeutig und näher am Ausgangstext als eine Umschreibung. Die apokalyptische Tierbildsprache und die Unsicherheit bei den „Gefährten“ werden nicht interpretierend geglättet.
