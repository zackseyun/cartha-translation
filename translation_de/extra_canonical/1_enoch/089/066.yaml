  terminology: „Leoparden“ ist gegenüber „Tiger“ die sachgerechte Wiedergabe von አነምርት; die Fußnote wahrt die zoologische Restunsicherheit. „Wildschweine der Wüste“, „Turm“ und „Haus“ sind quellentreu. Die Anmerkung zu „Haus“ erläutert den möglichen Symbolgehalt, ohne ihn in den Haupttext einzutragen.
