  source_fidelity: 'Der Entwurf gibt die zwei getrennten Fresshandlungen des geʿezischen Textes zutreffend wieder: Löwen und Leoparden „fraßen“ und „verschlangen“ den größeren Teil der Schafe, während die Wildschweine der Wüste „mit ihnen fraßen“. Die abschließende Zerstörung von Turm und Haus bleibt bildhaft und ohne auslegende Umdeutung erhalten. Die offene Bezugsweite von „sie“ im letzten Satz ist wie im Ausgangstext nicht künstlich präzisiert.'
