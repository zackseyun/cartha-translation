base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/066.yaml
  text: And the lions and the leopards devoured and swallowed up most of those sheep[a], and the wild boars of the desert ate with them[c][b], and they burned that tower and tore down that house.
translation:
  language: de
  text: Und die Löwen und die Leoparden[a] fraßen die meisten jener Schafe und verschlangen sie; auch die Wildschweine der Wüste fraßen mit ihnen. Dann verbrannten sie jenen Turm und rissen jenes Haus[b] nieder.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Großkatzenart ist nicht völlig sicher; auch „Panther“ ist möglich.
    reason: lexical_alternative
  - marker: b
    text: Das „Haus“ steht innerhalb der Vision wahrscheinlich für das Heiligtum beziehungsweise den Tempel; der Haupttext bewahrt das Bild des Ausgangstextes.
    reason: cultural_note
lexical_decisions:
- source_word: በልዑ ወውሕጡ
  choice: fraßen … und verschlangen sie
  rationale: Die beiden Verben bezeichnen gewaltsames Fressen und Verschlingen. Die deutsche Formulierung erhält die Steigerung, ohne unnatürlich zu klingen.
- source_word: መብዝሕቶሙ ለዝኩ አባግዐ
  choice: die meisten jener Schafe
  rationale: Die Wendung bezeichnet den größeren Teil der zuvor genannten Schafe und bewahrt zugleich das konkrete Tierbild der Vision.
- source_word: አናብስት
  choice: Löwen
  rationale: Dies ist die gewöhnliche Bezeichnung für Löwen; die bestimmte Raubtierart bleibt erhalten.
- source_word: አነምርት
  choice: Leoparden
  rationale: Der Ausdruck bezeichnet wahrscheinlich Leoparden beziehungsweise Panther. „Leoparden“ ist im Deutschen die präziseste und geläufigste Wiedergabe.
- source_word: ሐራዊያ ገዳም
  choice: Wildschweine der Wüste
  rationale: Die Wendung verbindet wilde Schweine mit unbewohntem, wüstem Land und bewahrt beide Bestandteile des Bildes.
- source_word: በልዑ ምስሌሆሙ
  choice: fraßen mit ihnen
  rationale: Der zweite, eigenständige Satzteil bezieht sich auf die Wildschweine. „Mit ihnen“ lässt die im Ausgangstext nicht näher bestimmte Beziehung offen.
- source_word: አውዐይዎ ለዝኩ ማኅፈድ
  choice: verbrannten sie jenen Turm
  rationale: Die Wiedergabe bleibt konkret und deutet das Bauwerk nicht über den Wortlaut hinaus.
- source_word: ከረይዎ ለዝኩ ቤት
  choice: rissen jenes Haus nieder
  rationale: „Niederreißen“ gibt die gewaltsame Zerstörung wieder; „Haus“ bewahrt das architektonische Symbol, statt es vorzeitig als Tempel auszulegen.
theological_decisions:
- issue: Deutung von ቤት als Haus oder Tempel
  choice: Haus
  alternative: Tempel beziehungsweise Heiligtum
  rationale: Im Zusammenhang der Vision kann das Haus den Tempel oder das Heiligtum darstellen. Der Haupttext bewahrt jedoch bewusst das Bild des Ausgangstextes und überlässt dessen Deutung den Lesenden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Tier- und Bauwerksbilder der apokalyptischen Vision bleiben konkret. Das Semikolon macht die zwei im Ge’ez unterschiedenen Fresshandlungen sichtbar; „Dann“ führt den anschließenden Wechsel zur Zerstörung der Bauwerke natürlich weiter.
