base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/015.yaml
  text: And the wolves began to terrify them and to oppress them[a], until they destroyed their little ones and cast their little ones into a stream of much water[c][b]. And those sheep began to cry out because of their little ones and to lament before their Lord.
translation:
  language: de
  text: Und die Wölfe begannen, sie zu fürchten und sie zu bedrängen[a], bis sie ihre Jungen vernichteten und ihre Jungen in einen wasserreichen Strom[b] warfen. Da begannen jene Schafe, wegen ihrer Jungen laut zu schreien und vor ihrem Herrn[c] zu klagen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie anzugreifen“; das ge’ezische Verb kann ein gewaltsames feindliches Vorgehen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „in einen Wasserlauf mit viel Wasser“; auch „in einen wasserreichen Fluss“ oder „in einen reißenden Wasserlauf“ ist möglich.'
    reason: lexical_alternative
  - marker: c
    text: „Vor ihrem Herrn“ kann innerhalb des Tierbildes auch als „vor ihrem Gebieter“ oder „vor ihrem Besitzer“ verstanden werden; der Zusammenhang spricht jedoch für eine göttliche Bezugsperson.
    reason: alternative_reading
lexical_decisions:
- source_word: አዝእብት
  choice: die Wölfe
  rationale: Die Tierbezeichnung wird innerhalb der Vision wörtlich wiedergegeben, ohne ihre allegorische Bedeutung im Text aufzulösen.
- source_word: ይፈርህዎሙ
  choice: ihnen Angst einzujagen
  rationale: 'Die Verbform wird kausativ verstanden: Die Wölfe versetzen die Schafe in Furcht. Diese Wiedergabe passt zum unmittelbaren Zusammenhang der gewaltsamen Bedrängnis.'
- source_word: አጠቅዎሙ
  choice: sie zu bedrängen
  rationale: Das Verb bezeichnet ein hartes, feindseliges Vorgehen und kann auch als Angreifen verstanden werden. „Bedrängen“ lässt sowohl anhaltenden Druck als auch Gewalt erkennen.
- source_word: እስከ ያኅልቅ
  choice: bis sie … vernichteten
  rationale: Die Wendung bezeichnet den äußersten Ausgang der Gewalt. „Vernichten“ bewahrt ihre Stärke und Endgültigkeit.
- source_word: ደቂቆሙ
  choice: ihre Jungen
  rationale: „Jungen“ erhält im Deutschen die Tierbildwelt und bezeichnet zugleich klar die Nachkommen der Schafe.
- source_word: ወገደፉ
  choice: warfen
  rationale: Die folgende Richtungsangabe in das Wasser legt eine gewaltsame Wurfbewegung nahe.
- source_word: በውኂዘ ማይ ብዙኅ
  choice: in einen wasserreichen Strom
  rationale: Die natürliche deutsche Formulierung gibt einen Wasserlauf mit reichlich Wasser wieder, ohne ihn unnötig genauer als Fluss oder Sturzbach festzulegen.
- source_word: እልኩ አባግዕ
  choice: jene Schafe
  rationale: „Jene“ bewahrt den demonstrativen Rückverweis auf die zuvor genannte Gruppe.
- source_word: ይጸርኁ
  choice: laut zu schreien
  rationale: Die Formulierung bringt den starken Klage- und Hilferuf zum Ausdruck, ohne ihn auf ein bloßes Rufen abzuschwächen.
- source_word: በእንተ ደቂቆሙ
  choice: wegen ihrer Jungen
  rationale: Die Präposition bezeichnet hier am natürlichsten den Anlass ihres Schreiens.
- source_word: ይስክዩ
  choice: zu klagen
  rationale: „Klagen“ erfasst den von Trauer getragenen, an eine übergeordnete Person gerichteten Ruf und vermeidet die Verengung auf eine sachliche Beschwerde.
- source_word: ኀበ እግዚኦሙ
  choice: vor ihrem Herrn
  rationale: „Vor“ bewahrt die räumlich-relationale Ausdrucksweise; „Herr“ trägt der göttlichen Bezugsperson im Visionszusammenhang Rechnung, ohne die mögliche Bedeutung „Gebieter/Besitzer“ zu verschweigen.
theological_decisions:
- issue: Ob እግዚኦሙ in der Schafallegorie als „Herr“ oder als „Gebieter/Besitzer“ wiederzugeben ist
  choice: ihrem Herrn
  alternative: ihrem Gebieter oder Besitzer
  rationale: Im Zusammenhang der Traumvision richtet sich der Hilferuf der Schafe an die göttliche Oberhoheit. „Herr“ bewahrt diese theologische Tragweite; die im Tierbild ebenfalls mögliche profane Lesart wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Wendung „ihre Jungen“ bleibt erhalten, weil sie die Dringlichkeit des ge’ezischen Textes und die Tierallegorie wahrt. „Da“ verbindet die Reaktion der Schafe natürlich mit der vorausgehenden Gewalttat.
