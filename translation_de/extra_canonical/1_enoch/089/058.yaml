base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/058.yaml
  text: And he kept still as he watched[a], and he rejoiced because they were devoured and swallowed up and carried off[c][b]; and he abandoned them into the hand of all the beasts for food.
translation:
  language: de
  text: Und er blieb still, während er zusah, und freute sich darüber, dass sie gefressen, verschlungen und fortgeschleppt wurden; und er überließ sie der Gewalt aller wilden Tiere, ihnen zum Fraß.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አርመመ
  choice: verhielt sich still
  rationale: Gibt das Schweigen beziehungsweise Stillhalten im erzählerischen Zusammenhang wieder, ohne den Sinn auf bloße Sprachlosigkeit zu verengen.
- source_word: እንዘ ይሬኢ
  choice: während er zusah
  rationale: Die Konstruktion bezeichnet eine gleichzeitig ablaufende Handlung; „zusah“ passt natürlich zum visionären Erzählzusammenhang.
- source_word: ተፈሥሐ
  choice: freute sich darüber
  rationale: Bewahrt den klaren Ausdruck der Freude und verbindet ihn im Deutschen natürlich mit dem folgenden Begründungssatz.
- source_word: ተበልዑ
  choice: wurden gefressen
  rationale: „Fressen“ erhält die gewaltsame Tier- und Beutebildsprache deutlicher als das allgemeinere „essen“.
- source_word: ተውሕጡ
  choice: wurden verschlungen
  rationale: Bewahrt die Steigerung innerhalb der dreigliedrigen Folge von Raub und Vernichtung.
- source_word: ተሀይዱ
  choice: wurden fortgeschleppt
  rationale: Gibt den Sinn des gewaltsamen Wegführens oder Fortschaffens genauer wieder als das allgemeinere „vernichtet“.
- source_word: ኃደጎሙ
  choice: ließ er sie … zurück
  rationale: Drückt aus, dass er sie preisgegeben und schutzlos zurückgelassen hat, ohne eine später geprägte theologische Formel einzutragen.
- source_word: ውስተ እዴ
  choice: in der Hand
  rationale: Bewahrt das semitisch geprägte Bild für die Gewalt oder Verfügungsgewalt eines anderen; die Fußnote erläutert die Wendung.
- source_word: ኵሎሙ አራዊት
  choice: all der wilden Tiere
  rationale: „Wilde Tiere“ hält die räuberische Tierbildsprache des allegorischen Abschnitts fest.
- source_word: ለመብልዕ
  choice: ihnen zum Fraß
  rationale: Gibt Zweck beziehungsweise Ergebnis knapp und bildkräftig wieder und macht die wilden Tiere als Nutznießer im Deutschen eindeutig.
theological_decisions:
- issue: Ob das Zurücklassen als aktive richterliche Auslieferung oder als Entzug des Schutzes formuliert werden soll
  choice: ließ er sie in der Hand all der wilden Tiere zurück
  alternative: lieferte er sie all den wilden Tieren aus
  rationale: Die gewählte Fassung bewahrt die Härte der Preisgabe, entscheidet aber nicht unnötig zwischen aktiver Auslieferung und schutzlosem Zurücklassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer apokalyptischer Tierbildsprache. Die dreifache Verbfolge bleibt erhalten. Der zweite Hauptsatz wird zur besseren deutschen Lesbarkeit mit „Dann“ angeschlossen, ohne die zeitliche oder logische Beziehung enger festzulegen als der Ausgangstext.
