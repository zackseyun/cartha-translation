revisions:
- from: Und er verhielt sich still, während er zusah, und freute sich darüber, dass sie gefressen, verschlungen und fortgeschleppt wurden. Dann ließ er sie in der Hand[a] all der wilden Tiere zurück, ihnen zum Fraß.
  to: Und er blieb still, während er zusah, und freute sich darüber, dass sie gefressen, verschlungen und fortgeschleppt wurden; und er überließ sie der Gewalt aller wilden Tiere, ihnen zum Fraß.
  rationale: Die Revision ersetzt die unnatürliche wörtliche Konstruktion „in der Hand ... zurücklassen“ durch die im Deutschen klare idiomatische Entsprechung „der Gewalt ... überlassen“. Dadurch bleibt die Aussage der Preisgabe in die Macht der Tiere erhalten. Die Fußnote entfällt, weil das Bild nicht mehr wörtlich steht und daher keiner Ankererläuterung bedarf. „Blieb still“ ist die natürlichere moderne Wiedergabe von አርመመ; die kumulative Folge der drei Passivverben bleibt bestehen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:25:55Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die dreigliedrige passive Folge ist zutreffend wiedergegeben: gefressen, verschlungen und fortgeschleppt. Auch die Freude des Beobachters und die Preisgabe an die wilden Tiere bleiben erhalten. Die Wendung „ließ er sie in der Hand ... zurück“ bildet jedoch weder die Richtungsangabe noch die idiomatische Bedeutung von ውስተ እዴ im Deutschen klar und natürlich ab.'
  naturalness: „Er verhielt sich still“ und besonders „ließ er sie in der Hand all der wilden Tiere zurück“ wirken im modernen Standarddeutsch unnötig schwerfällig. „Er blieb still“ sowie „überließ sie der Gewalt aller wilden Tiere“ sind idiomatisch und bewahren den Sinn.
  terminology: „Wilde Tiere“ und „zum Fraß“ passen zum apokalyptischen Tierbild. „Gewalt“ gibt das mit „Hand“ ausgedrückte Macht- bzw. Verfügungsidiom verständlich wieder, ohne eine konfessionell geprägte Formel einzutragen.
  issues:
  - severity: medium
    issue: Unidiomatische und semantisch unscharfe Wiedergabe von „in der Hand ... zurücklassen“
    rationale: Die deutsche Formulierung legt nahe, die Betroffenen befänden sich bereits „in der Hand“ der Tiere und würden dort lediglich zurückgelassen. Der Ausgangstext beschreibt ihre Preisgabe in deren Gewalt. Eine idiomatische Wiedergabe sollte dies unmittelbar ausdrücken.
  - severity: low
    issue: Zusätzliches „Dann“
    rationale: Der Quelltext verbindet die Aussagen schlicht koordinierend. „Dann“ fügt eine explizitere zeitliche Abfolge hinzu, die nicht erforderlich ist.
  revised_text: Und er blieb still, während er zusah, und freute sich darüber, dass sie gefressen, verschlungen und fortgeschleppt wurden; und er überließ sie der Gewalt aller wilden Tiere, ihnen zum Fraß.
