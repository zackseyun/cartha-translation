base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/038.yaml
  text: And that sheep who was leading them[a], who had become a man, was separated from them and lay down[c][b]; and all the sheep sought him and cried out over him with a great cry.
translation:
  language: de
  text: Und jenes Schaf, das sie führte und ein Mann geworden war,[a] wurde von ihnen getrennt und legte sich nieder.[b] Alle Schafe suchten nach ihm und erhoben über ihn ein lautes Geschrei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dass das Schaf „ein Mann geworden war“, beschreibt eine symbolische Verwandlung innerhalb der Traumvision.
    reason: cultural_note
  - marker: b
    text: Das Sichniederlegen deutet hier wahrscheinlich auf den Tod des Anführers hin; der Wortlaut hält jedoch am Bild der Vision fest.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝኩ በግዕ
  choice: Und jenes Schaf
  rationale: ዝኩ ist ein Demonstrativpronomen („jenes“), keine Form von „sehen“. Damit folgt die Übersetzung dem überlieferten Ge’ez und vermeidet die frühere Verwechslung mit einer visionären Sehformel.
- source_word: ዘይመርሖሙ
  choice: das sie führte
  rationale: Die Relativkonstruktion bezeichnet die fortdauernde Führungsrolle des Schafes; das Präteritum ist im deutschen Erzählzusammenhang natürlich.
- source_word: ዘኮነ ብእሴ
  choice: und ein Mann geworden war
  rationale: Die Formulierung bezeichnet am ehesten eine bereits eingetretene Verwandlung oder einen erlangten Zustand innerhalb der Traumvision.
- source_word: ተሌለየ እምኔሆሙ
  choice: wurde von ihnen getrennt
  rationale: Die passive, separative Wiedergabe lässt offen, wodurch oder durch wen die Trennung geschieht.
- source_word: ወሰከበ
  choice: und legte sich nieder
  rationale: Die Grundbedeutung „sich niederlegen“ bewahrt das Bild der Vision; der Kontext kann Tod nahelegen, ohne ihn im Haupttext ausdrücklich festzulegen.
- source_word: ኃሠሥዎ
  choice: suchten ... nach ihm
  rationale: Die idiomatische deutsche Wendung gibt die aktive Suche klar und gegenwärtig verständlich wieder.
- source_word: ወጸርኁ ዲቤሁ ጽራኀ ዐቢየ
  choice: und schrien seinetwegen laut auf
  rationale: „Seinetwegen“ bewahrt die mögliche Bedeutung „über/wegen ihm“, ohne bereits eine formelle Totenklage festzuschreiben; „laut“ gibt die Stärke des großen Schreis natürlich wieder.
theological_decisions:
- issue: Ob das Niederlegen des zum Mann gewordenen Schafes ausdrücklich als Tod zu deuten ist
  choice: Das visionäre Bild „legte sich nieder“ bleibt im Haupttext erhalten.
  alternative: „starb“ oder „entschlief“
  rationale: Das Ge’ez benennt zunächst das Niederlegen. Der Zusammenhang legt den Tod des Anführers nahe, doch eine ausdrückliche Deutung würde die symbolische Mehrdeutigkeit der Tierapokalypse verengen.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch mit klarer Erzählstruktur. Die Reihenfolge der beiden Relativbestimmungen folgt dem Ge’ez: zuerst die Führungsrolle, dann das Gewordensein zum Mann. Das erneute Subjekt „alle Schafe“ wird durch „Da“ natürlich an den Folgesatz angeschlossen.'
