base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/064.yaml
  text: And let them not know[a], and do not show them, and do not rebuke them; but write down all the destruction of the shepherds, each one in its time[c][b], and bring all of it up before me.
translation:
  language: de
  text: Sie sollen nichts erfahren; zeige ihnen nichts und weise sie nicht zurecht. Schreib vielmehr das ganze Verderben der Hirten auf, jeden einzelnen Fall zu seiner Zeit,[b] und bring alles zu mir hinauf.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Die distributive Wendung ist textlich schwierig; gemeint ist wahrscheinlich eine zeitlich geordnete Aufzeichnung jedes einzelnen Falls.
    reason: textual_variant
  - marker: c
    text: 'Oder: „und lege mir alles vor“. Der Wortlaut enthält jedoch das Bild des Hinaufbringens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወኢያእምሩ
  choice: Sie sollen es nicht erfahren
  rationale: Die Form ist als negativer Jussiv der 3. Person Plural zu verstehen. „Erfahren“ gibt in diesem Zusammenhang das Vorenthalten von Kenntnis natürlicher wieder als das isolierte „wissen“; das ergänzte „es“ verweist auf das aufgezeichnete Geschehen.
- source_word: ወኢታርእዮሙ
  choice: und zeige es ihnen nicht
  rationale: Das Präfix weist auf die 2. Person Singular; zusammen mit der Negation liegt ein Verbot vor. Das Verb bedeutet „zeigen/sehen lassen“.
- source_word: ወኢትዝለፎሙ
  choice: und weise sie nicht zurecht
  rationale: Auch hier steht eine negative Form der 2. Person Singular. „Zurechtweisen“ bewahrt den tadelnden, gerichtlichen Klang, ohne unnötig hart zu konkretisieren.
- source_word: አላ፡ ጸሐፍ
  choice: Schreib vielmehr ... auf
  rationale: Die adversative Partikel leitet den Gegensatz zwischen ausbleibender Offenlegung beziehungsweise Zurechtweisung und angeordneter Protokollierung ein. „Aufschreiben“ bringt den dokumentarischen Charakter zum Ausdruck.
- source_word: ኵሎ፡ ሐጕለ፡ ኖላዊያን
  choice: das ganze Verderben der Hirten
  rationale: Die Genitivverbindung lässt formal offen, ob das Verderben den Hirten zugeordnet ist, von ihnen bewirkt wird oder sie trifft. Die deutsche Formulierung bewahrt diese Spannung, statt die Hirten ausdrücklich als Täter oder Betroffene festzulegen.
- source_word: በጊዜሁ፡ ለለ፡ ፩፩
  choice: jeden einzelnen Fall zu seiner Zeit
  rationale: Die Wendung verbindet zeitliche Zuordnung mit distributiver Zählung. „Jeden einzelnen Fall“ macht die Einzelabrechnung verständlich, ohne die beschädigte beziehungsweise schwierige Zahlenform überzubestimmen.
- source_word: ወአዐርግ፡ ኵሎ፡ ኀቤየ
  choice: und bring alles zu mir hinauf
  rationale: Das Verb bezeichnet ein Hinaufbringen beziehungsweise Aufsteigenlassen. „Zu mir hinaufbringen“ erhält die räumliche Bildsprache der himmlischen Vorlage; „mir alles vorlegen“ wäre eine mögliche, aber weniger bildhafte Wiedergabe.
theological_decisions:
- issue: Aufgeschobenes Eingreifen gegenüber den Hirten
  choice: Der Sprecher gebietet, den Hirten vorerst weder Kenntnis zu geben noch sie zurechtzuweisen; stattdessen wird das Geschehen vollständig für die spätere Rechenschaft aufgezeichnet.
  alternative: 'Die Formen könnten erzählend als vergangene Aussagen wiedergegeben werden: „Sie wussten es nicht, und ich zeigte es ihnen nicht und wies sie nicht zurecht.“'
  rationale: Die geezischen Personenpräfixe und der Befehlszusammenhang stützen negative Jussiv- beziehungsweise Verbotsformen. Die Übersetzung bewahrt zugleich die theologische Spannung zwischen vorläufigem Nichteingreifen und lückenloser gerichtlicher Dokumentation.
- issue: Zuordnung des Verderbens
  choice: „das ganze Verderben der Hirten“ bleibt als Genitivverbindung offen.
  alternative: „alles Verderben, das die Hirten anrichten“ oder „die vollständige Vernichtung der Hirten“.
  rationale: Der unmittelbare Wortlaut entscheidet die Richtung des Genitivs nicht ausdrücklich. Eine eindeutige Täter- oder Opferzuordnung würde die genuine Mehrdeutigkeit unnötig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klaren Imperativ- und Jussivformen. „Verderben der Hirten“ wahrt bewusst die grammatische und theologische Mehrdeutigkeit der Genitivverbindung; die Fußnoten erklären nur dort, wo Grammatik, Textgestalt oder Bildsprache echte Alternativen eröffnen.
