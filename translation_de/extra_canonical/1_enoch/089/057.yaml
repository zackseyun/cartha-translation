base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/057.yaml
  text: And I began to cry out with all my strength[a], and I called to the Lord of the sheep and showed him concerning the sheep[b], that they were being devoured by all the wild beasts.
translation:
  language: de
  text: 'Und ich begann, mit all meiner Kraft zu rufen, und ich rief den Herrn der Schafe an und zeigte ihm, wie es um die Schafe stand: Sie wurden von allen wilden Tieren gefressen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „von allen Tieren des offenen Landes“ oder „von allen Tieren der Wildnis“. Gemeint sind nicht domestizierte, räuberische Tiere, die die Herde angreifen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አኃዝኩ፡ እጽራሕ
  choice: ich begann … zu rufen
  rationale: Die Verbindung gebraucht አኃዝኩ idiomatisch als Beginnmarkierung; „rufen“ bewahrt sowohl Lautstärke als auch Bedrängnis.
- source_word: በኵሉ፡ ኃይልየ
  choice: mit aller meiner Kraft
  rationale: Gibt Totalität und Intensität der Äußerung in natürlichem, gehobenem Deutsch wieder.
- source_word: አጸውዖ
  choice: ich rief … an
  rationale: Das gerichtete „anrufen“ unterscheidet diesen Appell vom vorherigen allgemeinen Rufen.
- source_word: ለእግዚአ፡ አባግዕ
  choice: den Herrn der Schafe
  rationale: „Herr“ bewahrt den erhöhten Rangtitel und passt zur allegorischen Darstellung Gottes als Gebieter der Herde.
- source_word: ወአርእዮ፡ በእንተ፡ አባግዕት
  choice: und wies ihn auf die Schafe hin
  rationale: Gibt das Zeigen beziehungsweise Vor-Augen-Führen ihrer Lage idiomatisch wieder, ohne ein tatsächliches Nichtwissen des Angerufenen vorauszusetzen.
- source_word: ተበልዑ
  choice: sie wurden … gefressen
  rationale: Das deutsche „fressen“ ist bei Raubtieren natürlich und erhält die gewaltsame Tierbildlichkeit.
- source_word: እምኵሎሙ፡ አራዊተ፡ ገዳም
  choice: von all den wilden Tieren
  rationale: Bezeichnet nicht domestizierte Tiere des offenen Landes beziehungsweise der Wildnis; „wilde Tiere“ vermittelt die räuberische Gegenüberstellung zur Herde klar.
theological_decisions:
- issue: Wiedergabe des göttlichen Titels innerhalb der Tierallegorie
  choice: der Herr der Schafe
  alternative: der Gebieter der Schafe
  rationale: „Herr“ wahrt Autorität und gehobenes Register, ohne die Bezeichnung auf einen bloß menschlichen Besitzer einzuengen.
- issue: Allegorische Identifizierung der wilden Tiere
  choice: Die Tierbezeichnung wird unaufgelöst übersetzt
  alternative: Eine ausdrückliche Identifizierung mit fremden Völkern
  rationale: Der Vers spricht bildlich von wilden Tieren; die Übersetzung bewahrt diese Bildsprache und schreibt ihre Deutung nicht in den Haupttext ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzglieder folgen dem Fortgang des ge'ezischen Textes, werden aber idiomatisch verbunden. Der Doppelpunkt verdeutlicht den Inhalt der vorgebrachten Klage. Der einzige Fußnotenmarker [a] steht im Haupttext.
