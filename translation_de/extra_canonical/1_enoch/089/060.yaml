base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/060.yaml
  text: “And I will hand them over to you by number[a], and I will tell you which of them are to be destroyed[c][b], and those you shall destroy.” And he handed over to them those sheep.
translation:
  language: de
  text: „Und ich werde sie euch nach ihrer Zahl übergeben[a], und ich werde euch sagen, welche von ihnen vernichtet werden sollen[b]; diese sollt ihr vernichten.“ Und er übergab ihnen jene Schafe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „nach Zahl“ oder „zahlenmäßig“; gemeint ist eine abgezählte beziehungsweise zahlenmäßig festgelegte Übergabe.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „welche von ihnen zugrunde gehen werden“. Im Zusammenhang bezeichnet die Form jedoch wahrscheinlich diejenigen, die vernichtet werden sollen.'
    reason: alternative_reading
lexical_decisions:
- source_word: አሜጥወክሙ
  choice: ich werde sie euch übergeben
  rationale: Die Verbform von መጠወ bezeichnet hier die Übergabe an die angeredeten Wächter; das im Deutschen ergänzte Objekt „sie“ wird aus dem Zusammenhang aufgenommen.
- source_word: በኍልቍ
  choice: nach ihrer Zahl
  rationale: Die Wendung bezeichnet eine zahlenmäßig bestimmte beziehungsweise abgezählte Übergabe. „Nach ihrer Zahl“ hält die Ausdrucksweise offen und gibt den distributiven Sinn natürlich wieder.
- source_word: እነግረክሙ
  choice: ich werde euch sagen
  rationale: Das Verb bezeichnet eine Mitteilung an die zweite Person Plural und setzt die direkte Rede fort.
- source_word: ዘይትኃጐል እምኔሆሙ
  choice: welche von ihnen vernichtet werden sollen
  rationale: Die relative Form wird auf einzelne Tiere innerhalb der Gruppe bezogen; „von ihnen“ gibt እምኔሆሙ wieder, ohne die Betroffenen näher zu bestimmen.
- source_word: ወኪያሆሙ አኅጕሉ
  choice: diese sollt ihr vernichten
  rationale: ኪያሆሙ greift die zuvor bezeichneten Tiere betont auf; አኅጕሉ wird als pluralischer Imperativ beziehungsweise verpflichtende Anweisung wiedergegeben.
- source_word: ወመጠወ ሎሙ ዝኩ አባግዐ
  choice: Und er übergab ihnen jene Schafe
  rationale: Das Verb ist aktiv in der dritten Person Singular. Obwohl አባግዕ morphologisch pluralisch ist, kann die überlieferte Form beziehungsweise ihre unmittelbare Analyse Schwierigkeiten bereiten; der Kontext und die revidierte Lesart sprechen hier für mehrere Schafe.
theological_decisions:
- issue: Zweck und Tragweite der Übergabe
  choice: übergab
  alternative: vertraute an
  rationale: „Übergab“ bewahrt den gerichtlichen und bedrohlichen Zusammenhang, ohne den ungenannten Handelnden oder die genaue Art seiner Bevollmächtigung theologisch näher festzulegen.
- issue: Modalität von ዘይትኃጐል
  choice: vernichtet werden sollen
  alternative: vernichtet werden
  rationale: Die Form steht in einer Anweisung darüber, welche Tiere betroffen sind. „Sollen“ macht diese Bestimmung sichtbar, ohne ausdrücklich zu behaupten, ob sie als göttlicher Ratschluss, Vorhersage oder Auftrag zu verstehen ist.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede wird als Fortsetzung aus dem vorhergehenden Vers markiert. Die Wiederholung von „übergeben“ spiegelt das äthiopische Leitverb; „vernichten“ wahrt die Härte der Gerichtsszene, ohne zusätzliche Deutung einzutragen.
