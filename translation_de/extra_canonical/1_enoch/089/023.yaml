base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/023.yaml
  text: And the wolves began to pursue those sheep until they overtook them at a spring of water[a][b].
translation:
  language: de
  text: Und die Wölfe begannen, jene Schafe zu verfolgen, bis sie sie an einer Wasserquelle[a][b] einholten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an einem Wasserbecken“. Die genaue Bezeichnung des Wasserortes ist unsicher.'
    reason: lexical_alternative
  - marker: b
    text: 'Ältere Wiedergabe: „bis sie sie in ein Wasserbecken trieben“. Das zugrunde liegende Verb bedeutet hier jedoch eher „erreichen, einholen“, und die Präposition bezeichnet wahrscheinlich den Ort: „an“ oder „bei“.'
    reason: previous_rendering
lexical_decisions:
- source_word: አዝእብት
  choice: die Wölfe
  rationale: Die konkrete Tierbezeichnung bewahrt die Bildsprache der Tierapokalypse, ohne sie als historische Menschengruppe auszudeuten.
- source_word: አሐዙ
  choice: begannen
  rationale: 'Vor der folgenden Verbalhandlung ist die Form am besten ingressiv zu verstehen: Die Wölfe fingen an, die Schafe zu verfolgen.'
- source_word: ይትልውዎሙ
  choice: zu verfolgen
  rationale: Der Zusammenhang beschreibt feindliches Nachsetzen; „verfolgen“ ist daher treffender als das neutrale „folgen“.
- source_word: ዝኩ አባግዕት
  choice: jene Schafe
  rationale: „Jene“ erhält den rückverweisenden Demonstrativ und bezeichnet die bereits im Blick stehende Schafgruppe.
- source_word: እስክ ተረክብዎሙ
  choice: bis sie sie … einholten
  rationale: Das Verb bezeichnet hier das Erreichen beziehungsweise Einholen der Verfolgten, nicht ein Hineintreiben ins Wasser.
- source_word: በአሐቲ ዐይገ ማይ
  choice: an einer Wasserquelle
  rationale: Die Präposition wird lokal als „an/bei“ verstanden. Die genaue Art des Wasserortes bleibt lexikalisch unsicher; „Wasserquelle“ folgt der jüngsten Revision, während „Wasserbecken“ in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Tiersymbolik in den Traumvisionen
  choice: Die Tiere werden im Haupttext wörtlich als Tiere wiedergegeben.
  alternative: Die Wölfe und Schafe unmittelbar als historische Menschengruppen ausdeuten.
  rationale: Die fortlaufende apokalyptische Bildsprache soll erhalten bleiben; ihre historische Deutung gehört nicht in den übersetzten Haupttext.
- issue: Verhältnis der Verfolgten zum Wasser
  choice: Die Wölfe holen die Schafe am Wasserort ein.
  alternative: Die Wölfe treiben die Schafe in das Wasser.
  rationale: ረከበ bezeichnet Erreichen oder Einholen, und በ markiert hier den Ort. Diese Wiedergabe vermeidet zudem, eine erst später geschilderte Bewegung ins Wasser vorwegzunehmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe an der fortlaufenden Visionserzählung; „jene“ bewahrt den Rückverweis, und die doppelte Pronominalfolge „sie sie“ ist trotz ihrer formalen Dichte im Deutschen eindeutig und quellennah.
