base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/001.yaml
  text: And one of those four went to that white bull and taught him a mystery[a], while he was not trembling; and that bull was born and became a man, and built for himself a great vessel and dwelt upon it. And three bulls were with him on that vessel[c][b], and they were covered over above them.
translation:
  language: de
  text: Und einer von jenen vieren ging zu jenem weißen Stier und weihte ihn in ein Geheimnis ein, während er nicht zitterte.[a] Und jener Stier wurde geboren und wurde zu einem Menschen. Er baute sich ein großes Schiff[b] und wohnte darauf. Drei Stiere waren mit ihm auf jenem Schiff,[c] und sie wurden von oben her zugedeckt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „während er nicht zitterte“. Die Negation steht im vorliegenden äthiopischen Text; wegen Schwierigkeiten in der Textüberlieferung wurde die Wendung mitunter auch ohne Negation verstanden: „während er zitterte“.'
    reason: textual_variant
  - marker: b
    text: Das große Schiff entspricht in der symbolischen Nacherzählung dem Fahrzeug der Flutgeschichte; die Vision nennt die Gestalt jedoch nicht ausdrücklich Noah und verwendet hier nicht einfach dessen Namen.
    reason: cross_reference
  - marker: c
    text: 'Das äthiopische Wort bezeichnet allgemein Rinder. Der Zusammenhang legt männliche Tiere nahe: Der weiße Stier und die drei Stiere stehen in der Bildsprache der Vision für Noah und seine drei Söhne.'
    reason: translation_clarity
lexical_decisions:
- source_word: ላህም ጸዓዳ
  choice: weißer Stier
  rationale: Das Wort bezeichnet ein Rind. Der männliche Ausdruck wahrt hier die symbolische Zuordnung der Gestalt zu Noah und stimmt mit den drei nachfolgenden männlichen Rindern überein, ohne Noah im Haupttext ausdrücklich zu nennen.
- source_word: መሀሮ ምሥጢረ
  choice: lehrte ihn ein Geheimnis
  rationale: Die Wendung verbindet Unterweisung mit verborgenem Wissen. „Ein Geheimnis lehren“ bleibt nahe am Wortlaut und klingt im Deutschen verständlich und würdig.
- source_word: እንዘ ኢይርዕድ
  choice: während er nicht zitterte
  rationale: Das überlieferte ኢ ist eine Negation; daher wird die negative Aussage im Haupttext beibehalten. Die partizipiale Begleitumstandsangabe wird mit „während“ wiedergegeben.
- source_word: ተወልደ ወኮነ ሰብአ
  choice: wurde geboren und wurde zu einem Menschen
  rationale: Die auffällige Abfolge und die Verwandlung aus der Tiersymbolik in einen Menschen bleiben ausdrücklich erhalten.
- source_word: መስቀረ ዐቢየ
  choice: ein großes Schiff
  rationale: Im Zusammenhang bezeichnet der Ausdruck das große Wasserfahrzeug der Fluterzählung. „Schiff“ ist im modernen Deutsch natürlicher als „Gefäß“, während die Fußnote die Anspielung erläutert, ohne „Arche“ in den Text einzutragen.
- source_word: ነበረ ዲቤሃ
  choice: wohnte darauf
  rationale: Die Präposition bezeichnet ein Sein auf dem Fahrzeug. „Wohnte darauf“ bewahrt diesen räumlichen Zug.
- source_word: ፫አላህምት
  choice: drei Stiere
  rationale: Die drei Rinder stehen in der Bildwelt für die Söhne der männlichen Hauptgestalt. „Stiere“ erhält die symbolische Geschlechtszuordnung.
- source_word: ተከድኑ ላዕሌሆሙ
  choice: sie wurden von oben her zugedeckt
  rationale: Die passive Form und die Vorstellung einer Bedeckung über den Gestalten werden bewahrt; die ungewöhnliche Bildsprache wird nicht zu einer bloßen Aussage über Schutz geglättet.
theological_decisions:
- issue: Ausdrückliche Identifizierung der menschgewordenen Stiergestalt mit Noah
  choice: Die Gestalt bleibt im Haupttext unbenannt; Tierverwandlung und Schiffsmotiv werden beibehalten.
  alternative: Die Gestalt direkt „Noah“ nennen oder das Schiff ausdrücklich als „Arche“ bezeichnen.
  rationale: Die Vision spielt klar auf die Fluterzählung an, formuliert sie aber in symbolischer Bildsprache. Eine ausdrückliche Identifizierung im Text würde die Vision interpretierend auflösen.
- issue: Geschlecht der Rinderbilder
  choice: „Stier“ und „Stiere“
  alternative: „Rind“ und „Rinder“ oder „Kuh“ und „Kühe“
  rationale: Die männliche Wiedergabe wahrt die Zuordnung zu Noah und seinen drei Söhnen. Die lexikalische Breite des äthiopischen Rinderbegriffs wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener visionärer Fremdheit. Die parataktische Erzählweise bleibt weitgehend bestehen; schwer verständliche Einzelheiten werden nicht stillschweigend harmonisiert.
