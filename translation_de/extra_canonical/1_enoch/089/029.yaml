base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/029.yaml
  text: And that sheep went up onto the summit of that lofty rock, and the Lord of the sheep sent him to them.
translation:
  language: de
  text: Und jenes Schaf stieg auf den Gipfel jenes hohen Felsens, und der Herr der Schafe sandte es zu ihnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በግዕ (bagʿ)
  choice: Schaf
  rationale: Die direkte Tierbezeichnung bewahrt die Bildsprache der Tiervision.
- source_word: ድማኃ (dəmaḥa)
  choice: Gipfel
  rationale: Bezeichnet hier die Spitze beziehungsweise höchste Stelle des Felsens; „Gipfel“ ist im Deutschen natürlich und präzise.
- source_word: ኰኵሕ ነዋሕ (kwəkwəḥ nawaḥ)
  choice: hoher Felsen
  rationale: Gibt Substantiv und attributives Adjektiv eng und ohne zusätzliche Deutung wieder.
- source_word: እግዚኦሙ ለአባግዕ (ʾəgziʾomu la-ʾabagəʿ)
  choice: der Herr der Schafe
  rationale: Bewahrt die im Text selbst verwendete Herrschaftsbezeichnung und die allegorische Ausdrucksweise.
- source_word: ፈነዎ ኀቤሆሙ (fanawwo ḫabe-homu)
  choice: sandte es zu ihnen
  rationale: Gibt das Senden und das pluralische Zielpronomen direkt wieder; das deutsche Neutrum richtet sich grammatisch nach „Schaf“.
theological_decisions:
- issue: Identität des „Herrn der Schafe“
  choice: Die bildhafte Bezeichnung bleibt unverändert stehen.
  alternative: Die Gestalt ausdrücklich als „Gott“ oder „der HERR“ identifizieren.
  rationale: Die Übersetzung soll die allegorische Form des Ausgangstextes bewahren und die Identifikation nicht im Haupttext vorwegnehmen.
- issue: Referent von „ihnen“
  choice: Das Pronomen wird ohne erklärenden Zusatz beibehalten.
  alternative: Die gemeinte Gruppe ausdrücklich benennen.
  rationale: Der Vers selbst nennt den Referenten nicht erneut; eine Ergänzung würde die kontextuelle Zuordnung interpretierend festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die geʿezische Satzstruktur. „Jenes“ erhält die demonstrative Rückverweisung; die Pronomen folgen dem grammatischen Geschlecht von „Schaf“.
