  yaml_path: translation/extra_canonical/1_enoch/089/027.yaml
  text: And I saw until all the wolves that followed those sheep perished and were drowned[a][b].
translation:
  language: de
  text: Und ich sah, bis alle Wölfe, die jenen Schafen gefolgt waren, umkamen und ertranken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወርኢኩ
  choice: Und ich sah
  rationale: Bewahrt die übliche Einleitung des visionären Berichts in der ersten Person und führt den Erzählgang natürlich fort.
- source_word: እስከ
  choice: bis
  rationale: Markiert die Fortdauer der Schau bis zum eintretenden Ergebnis und erhält die charakteristische Satzfügung „ich sah, bis …“.
- source_word: ተሐጕሉ
  choice: umkamen
  rationale: Gibt den ersten der beiden abschließenden Vorgänge als Untergang bzw. Vernichtung wieder, ohne ihn mit dem folgenden Ertrinken zusammenzuziehen.
- source_word: ኵሎሙ አዝእብት
  choice: alle Wölfe
  rationale: አዝእብት bezeichnet hier konkret Wölfe; die Tierbildsprache der Vision bleibt unverändert erhalten.
- source_word: እለ ተለውዎሙ
  choice: die jenen Schafen gefolgt waren
  rationale: Das Verb bezeichnet Folgen bzw. Hinterherziehen. Das Plusquamperfekt macht im Deutschen deutlich, dass dieses Folgen dem Untergang vorausging, ohne zwingend eine feindliche Absicht zusätzlich auszudrücken.
- source_word: ለዝኩ አባግዕ
  choice: jenen Schafen
  rationale: „Jenen“ nimmt die bereits erwähnten Schafe mit der demonstrativen Rückverweisung des Geʿez auf.
- source_word: ወተሠጥሙ
  choice: und ertranken
  rationale: 'Bewahrt den zweiten, eigenständigen Vorgang des Verses: das Versinken beziehungsweise Ertrinken.'
theological_decisions:
- issue: Ob die symbolischen Tiere im Haupttext gedeutet werden sollen
  choice: Die Tierbezeichnungen „Wölfe“ und „Schafe“ bleiben wörtlich stehen.
  alternative: Die Wölfe und Schafe unmittelbar als ihre geschichtlichen oder theologischen Bezugsgrößen benennen.
  rationale: Die anhaltende Bildsprache der Tiervision soll nicht durch eine konfessionell oder historisch festgelegte Auslegung ersetzt werden.
- issue: Ob „folgten“ als ausdrücklich feindliches Verfolgen wiederzugeben ist
  choice: „gefolgt waren“
  alternative: „verfolgt hatten“
  rationale: „Gefolgt“ bleibt näher an der lexikalischen Grundbedeutung und lässt die aus dem Kontext erkennbare feindliche Handlung anklingen, ohne sie im Verb stärker festzulegen als der Wortlaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper apokalyptischer Erzählstruktur. Die beiden Verben des Untergangs werden getrennt wiedergegeben; unnötige Erläuterungen der Symbolik werden vermieden.
