base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/009.yaml
  text: And that white bull[a], which had become a man, went out from that enclosure, and with him came three bulls. And one of those three bulls was white, resembling that white bull, and one of them was red like blood, and one was black[c][b]; and that white bull departed from among them.
translation:
  language: de
  text: Und jener weiße Stier, der ein Mann geworden war, ging aus jener Arche[a] hinaus, und mit ihm kamen drei Stiere. Einer von diesen drei Stieren war weiß und glich jenem weißen Stier; einer war rot wie Blut und einer schwarz. Und jener weiße Stier ging von ihnen fort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hier überlieferte Wortform ist unsicher. Wahrscheinlich ist „Schiff“ beziehungsweise im Zusammenhang „Arche“ gemeint; nach der vorliegenden Form sind auch allgemeinere Wiedergaben wie „Ort“ oder „Umfriedung“ erwogen worden.
    reason: textual_variant
lexical_decisions:
- source_word: ላህም
  choice: Stier
  rationale: Das männliche Rind ist die wiederkehrende Symbolgestalt der Tiervision; „Stier“ bewahrt dieses konkrete Bild.
- source_word: ጸዐዳ
  choice: weiß
  rationale: Die Farbangabe ist für die Symbolik wesentlich und wird unmittelbar wiedergegeben.
- source_word: ዘኮነ ብእሴ
  choice: der ein Mann geworden war
  rationale: Die Relativkonstruktion bezeichnet eine bereits vollzogene Verwandlung und wahrt die visionäre Bildfolge.
- source_word: ወጽአ እምዝኩ መስቀር
  choice: ging aus jener Arche hinaus
  rationale: Die überlieferte Form መስቀር gilt hier wahrscheinlich als fehlerhafte Lesung für መርከብ („Schiff/Gefäß“); der unmittelbare Flutkontext legt die Arche nahe. Die Textunsicherheit wird in einer Fußnote kenntlich gemacht.
- source_word: ፪አልህምት
  choice: drei Stiere
  rationale: Die äthiopischen Zahlzeichen ergeben drei, und das wiederholte Rinderbild bleibt erhalten.
- source_word: ጸዐዳ ይመስሎ ለዝኩ ላህም
  choice: war weiß und glich jenem weißen Stier
  rationale: „Weiß“ ist Prädikat des ersten der drei Stiere; das folgende Verb drückt dessen Ähnlichkeit mit dem zuvor genannten Stier aus.
- source_word: ቀይሕ ከመ ደም
  choice: rot wie Blut
  rationale: Die ausdrückliche, eindringliche Farbsimile wird formal bewahrt.
- source_word: ጸሊም
  choice: schwarz
  rationale: Die direkte Farbbezeichnung wahrt den Kontrast zwischen den drei Stieren.
- source_word: ኀለፈ እምኔሆሙ
  choice: schied von ihnen
  rationale: Die Wendung bezeichnet Trennung beziehungsweise Fortgang, ohne zwingend den Tod auszudrücken.
theological_decisions:
- issue: Identität des weißen Stiers und der drei Stiere
  choice: Die Tierbilder bleiben im Haupttext unaufgelöst.
  alternative: Die Gestalten ausdrücklich als Noah und seine drei Söhne identifizieren.
  rationale: Der Kontext legt diese Identifikation nahe, doch der Vers selbst spricht in der Bildsprache der Tiervision. Die Übersetzung soll das apokalyptische Bild nicht durch eine Deutung ersetzen.
- issue: Bedeutung von ኀለፈ
  choice: „schied von ihnen“ als räumliche beziehungsweise narrative Trennung
  alternative: „starb“ oder „ging von ihnen hinweg“
  rationale: Das Verb kann ein Vorübergehen oder Fortgehen ausdrücken. Eine ausdrückliche Todesdeutung wäre stärker als der Wortlaut.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit klarer apokalyptischer Bildlichkeit. „Arche“ ist im Flutkontext natürlich und verständlich; die zugrunde liegende Textunsicherheit bleibt durch die Fußnote sichtbar.
