base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/008.yaml
  text: And the water began to descend into them until the earth was laid bare[a]; and that vessel rested upon the earth, and darkness was removed[d][c][b], and light came to be.
translation:
  language: de
  text: Und das Wasser begann, in sie hinabzufließen,[a] bis die Erde freigelegt war. Jenes Gefäß kam auf der Erde zur Ruhe; die Finsternis wurde beseitigt, und Licht entstand.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „In sie“ bezieht sich wahrscheinlich auf die im vorigen Vers genannten weiteren Tiefen oder Abgründe. Die überlieferte Wortform kann auch im Sinn von „während das Wasser in sie hinabfloss“ verstanden werden; die Übersetzung folgt der wahrscheinlichen Annahme einer Textverderbnis und liest daher „begann … hinabzufließen“.
    reason: textual_and_grammatical_ambiguity
  - marker: b
    text: Die Bewegung von der Finsternis zum Licht erinnert an Schöpfung oder Wiederherstellung. Der Wortlaut wird hier jedoch nicht an die vertraute Formulierung aus Genesis angeglichen.
    reason: cross_reference
lexical_decisions:
- source_word: ወአንዘ፡ ማይ፡ ይረድ
  choice: Und das Wasser begann, … hinabzufließen
  rationale: Die überlieferte Form ወአንዘ bedeutet gewöhnlich „und während“, dürfte hier jedoch eine fehlerhafte Lesung für ወአኀዘ („und es begann“) sein; zusammen mit dem Imperfekt ergibt sich dann eine inchoative Konstruktion. „Hinabfließen“ gibt die Abwärtsbewegung des Wassers im Deutschen natürlich wieder.
- source_word: ውስቴቶሙ
  choice: in sie
  rationale: Das maskuline Pluralsuffix verweist wahrscheinlich auf die im vorigen Vers genannten weiteren Tiefen oder Abgründe. Die pronominale Form bewahrt diesen Rückverweis, ohne das Bezugswort in den Vers einzutragen.
- source_word: ተከሥተ፡ ምድር
  choice: die Erde freigelegt war
  rationale: Die passive Wendung bezeichnet das Sichtbarwerden beziehungsweise Freilegen der Erde, als das Wasser abfloss.
- source_word: ውእቱ፡ መስቀር
  choice: jenes Gefäß
  rationale: Im Zusammenhang der Fluterzählung bezeichnet die Wendung das zuvor genannte Schiff beziehungsweise Gefäß. „Gefäß“ hält sich an die bildhafte und etwas ungewöhnliche Ausdrucksweise der Vision.
- source_word: ነበረ፡ ውስተ፡ ምድር
  choice: ließ sich auf der Erde nieder
  rationale: Das Verb kann „sein, bleiben, wohnen, sich niederlassen“ ausdrücken. Für das zum Stillstand kommende Gefäß ist „ließ sich … nieder“ natürlich und anschaulich.
- source_word: ተገኅሰት፡ ጽልመት
  choice: die Finsternis wurde beseitigt
  rationale: Die passive Verbform bezeichnet das Entfernen oder Vertreiben der Finsternis, ohne die Art des Vorgangs näher festzulegen.
- source_word: ኮነ፡ ብርሃን
  choice: Licht entstand
  rationale: ኮነ bedeutet „werden/entstehen“. Die Formulierung wahrt den Anklang an die Schöpfung, ohne die geläufige Genesis-Formel wörtlich einzutragen.
theological_decisions:
- issue: Anklang der Schlusswendung an die Schöpfungserzählung
  choice: Licht entstand
  alternative: da wurde es Licht
  rationale: Der Text weckt Schöpfungs- oder Wiederherstellungsvorstellungen, gebraucht aber lediglich das allgemeine Verb „werden“. Die gewählte Formulierung erhält den Anklang, ohne den Wortlaut an eine traditionelle Genesisübersetzung anzugleichen.
- issue: Identität des Gefäßes
  choice: jenes Gefäß
  alternative: die Arche
  rationale: Obwohl im Erzählzusammenhang Noahs Arche gemeint ist, wird die visionäre Bezeichnung nicht durch den theologisch und traditionell festgelegteren Ausdruck „Arche“ ersetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Die ungewöhnliche visionäre Benennung „Gefäß“ bleibt erhalten; textliche und intertextuelle Unsicherheiten werden in den Fußnoten offengelegt.
