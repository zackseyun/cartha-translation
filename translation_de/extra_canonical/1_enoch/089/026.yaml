    issue: „kehrten sie um“ für ገብኡ
    rationale: Die Quelle verwendet ein Bewegungsverb „eintreten/hineingehen“, nicht „umkehren“. Die ungewöhnliche beziehungsweise kontextuell nicht näher bestimmte Zielrichtung darf nicht durch eine andere Bewegung ersetzt werden.
  - severity: low
    issue: „strömte ... zusammen“
    rationale: Das Deutsche legt bei einem bereits benannten Wasserlauf eher eine Fließbewegung nahe. „sammelte sich“ bildet ተጋብአ präziser als Ansammlung der Wassermassen ab.
