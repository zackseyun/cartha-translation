base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/026.yaml
  text: And when they saw the Lord of the sheep, And when they saw the Lord of the sheep, they turned back so as to flee from before his face; and that watercourse gathered together, and it became swift according to its nature, and it filled with water and rose up until it covered those wolves. so as to flee from before his face; and that watercourse gathered together, and it became swift according to its nature, and it filled with water and rose up until it covered those wolves.
translation:
  language: de
  text: Als sie den Herrn der Schafe sahen, gingen sie hinein, um vor seinem Angesicht zu fliehen. Da sammelte sich jener Wasserlauf[a], wurde seiner Natur gemäß reißend, füllte sich mit Wasser und stieg an, bis er jene Wölfe bedeckte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jenes Wassergerinne“ beziehungsweise „jenes Bachbett“. Gemeint ist wohl ein Wasserlauf, der plötzlich stark anschwillt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕት
  choice: der Herr der Schafe
  rationale: Bewahrt die erhöhte Gottesbezeichnung und zugleich die Bildwelt der Tierapokalypse.
- source_word: ገብኡ ከመ ይጕየዩ
  choice: kehrten sie um, um … zu fliehen
  rationale: Im erzählerischen Zusammenhang bezeichnet die Wendung die Fluchtbewegung der Wölfe beim Anblick des Herrn; die deutsche Formulierung gibt diesen Zusammenhang natürlich wieder, ohne die Handlung auszuschmücken.
- source_word: እምቅድመ ገጹ
  choice: vor seinem Angesicht
  rationale: Die semitisch geprägte Gegenwartsformel bleibt erhalten, weil das Angesicht des göttlichen Herrn für die Gerichtsszene bildlich bedeutsam ist.
- source_word: ዝኩ ዐይገ ማይ
  choice: jener Wasserlauf
  rationale: Die Bezeichnung lässt sowohl ein Fließgewässer als auch ein plötzlich anschwellendes Gerinne zu, ohne die Topografie zu eng festzulegen.
- source_word: ተጋብአ
  choice: strömte … zusammen
  rationale: Gibt das Sichsammeln der Wassermassen in einem im Deutschen anschaulichen Bewegungsausdruck wieder.
- source_word: ከመ ፍጥረቱ ፍጡነ
  choice: wurde seiner Natur gemäß reißend
  rationale: Bewahrt die ungewöhnliche Aussage, dass die Heftigkeit des Wassers seinem Wesen beziehungsweise seiner natürlichen Beschaffenheit entspricht.
- source_word: መልአ ማይ
  choice: füllte sich mit Wasser
  rationale: Direkte und natürliche Wiedergabe des anschwellenden Gewässers.
- source_word: ተላዐለ እስከ ከደኖሙ ለእልኩ አዝእብት
  choice: stieg an, bis er jene Wölfe bedeckte
  rationale: 'ከደኖሙ ist als Verb mit pluralischem Objektsuffix zu verstehen: Das Wasser bedeckte die anschließend ausdrücklich genannten Wölfe.'
theological_decisions:
- issue: Bezeichnung der göttlichen Gestalt in der Tierallegorie
  choice: der Herr der Schafe
  alternative: der Gebieter der Schafe
  rationale: „Herr“ erhält das theologische Gewicht der Gestalt, ohne die Tierallegorie erklärend aufzulösen.
- issue: Gegenwartsformel in der Gerichtsszene
  choice: vor seinem Angesicht
  alternative: vor ihm
  rationale: Die bildhafte und theologisch gewichtige Rede vom Angesicht wird nicht zu einer bloßen Ortsangabe verflacht.
translation_notes:
  register: Moderne, würdige Erzählsprache mit bewahrter apokalyptischer Bildhaftigkeit. Der Satzbau ist gegenüber der Ausgangsstruktur leicht gegliedert, um den Ablauf der Flucht und des anschwellenden Wassers klar verständlich zu machen.
