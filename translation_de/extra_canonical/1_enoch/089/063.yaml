revisions:
- from: Und lies mir der Zahl nach vor, wie viele sie vernichten[a] und wie viele sie dem Verderben preisgeben, damit dies mir als Zeugnis gegen sie dient[b], damit ich alle Taten der Hirten erkenne, sie beurteile und sehe, was sie tun – ob sie sich an mein Gebot halten, das ich ihnen geboten habe, oder nicht.[c]
  to: Und lies mir vor, wie viele sie vernichten[a] und wie viele sie dem Verderben preisgeben, damit dies mir als Zeugnis gegen sie dient[b], damit ich alle Taten der Hirten erkenne, sie zähle und sehe, was sie tun – ob sie sich an mein Gebot halten, das ich ihnen geboten habe, oder nicht.[c]
  rationale: Die Revision ersetzt die zu weit gehende Wiedergabe „beurteile“ durch „zähle“, um das wiederholte Motiv der zahlenmäßigen Rechenschaft im Ge'ez zu erhalten. Zugleich wird die einleitende deutsche Wortstellung geglättet. Fußnote a vermeidet die nicht ausdrücklich im Wortlaut ausgedrückte Festlegung, dass „die Hirten“ grammatisch die Handelnden der beiden Verben seien, ohne die erläuterte Zählproblematik aufzugeben.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:26:00Z'
