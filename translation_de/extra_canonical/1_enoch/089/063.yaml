base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/063.yaml
  text: And read out before me by number how many they destroy[a], and how many they hand over to destruction, so that this may be a testimony for me against them, that I may know all the deeds of the shepherds, and assess them, and see what they do—whether they abide by my command that I commanded them[c][b], or not.
translation:
  language: de
  text: Und lies mir vor, wie viele sie vernichten[a] und wie viele sie dem Verderben preisgeben, damit dies mir als Zeugnis gegen sie dient[b], damit ich alle Taten der Hirten erkenne, sie zähle und sehe, was sie tun – ob sie sich an mein Gebot halten, das ich ihnen geboten habe, oder nicht.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der äthiopische Wortlaut des Anfangs ist schwierig. Die wiederholte Sprache des Zählens bezeichnet wahrscheinlich eine zahlenmäßige Abrechnung darüber, wie viele vernichtet oder dem Verderben preisgegeben werden.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich etwa: „damit dies mir ein Zeugnis auf ihnen sei“. Im Zusammenhang kann die Wendung auch bedeuten: „damit dieser Bericht gegen sie feststeht“.'
    reason: lexical_alternative
  - marker: c
    text: 'Eine ältere Deutung lautet: „Und ich las vor ihm die Zahl jener Hirten vor und wie viele sie für die Hirten vernichtet hatten, damit dieses Zeugnis auf ihnen sei, damit ich alle Taten der Hirten erkenne, sie zähle und sehe, was sie tun – ob sie sich an mein Gebot halten, das ich ihnen geboten habe, oder nicht.“ Die Grammatik spricht jedoch eher für den Imperativ „Lies … vor mir vor“.'
    reason: previous_rendering
lexical_decisions:
- source_word: ወበኍልቈ፡ አንበብ፡ ቅድሜየ
  choice: Und lies mir der Zahl nach vor
  rationale: Der Imperativ bezeichnet ein Vorlesen bzw. Verlesen; ቅድሜየ hat ein Suffix der 1. Person Singular und bedeutet „vor mir“. Die Wendung mit „Zahl“ bewahrt den rechnerisch-forensischen Charakter.
- source_word: ሚመጠነ፡ የኃጕሉ
  choice: wie viele sie vernichten
  rationale: Die Konstruktion fragt nach der Anzahl; das Verb bezeichnet hier zerstörendes Zugrunderichten, ohne die konkrete Todesart festzulegen.
- source_word: ሚመጠነ፡ ይሚጥዉ፡ ለኃጕል
  choice: wie viele sie dem Verderben preisgeben
  rationale: Die zweite parallele Angabe wird als Übergabe an das Verderben wiedergegeben und nicht mit der ersten Handlung zusammengezogen.
- source_word: ስምዐ፡ ዲቤሆሙ
  choice: Zeugnis gegen sie
  rationale: ስምዐ trägt einen Zeugnis- bzw. Beweischarakter; ዲቤሆሙ bedeutet wörtlich „auf/über ihnen“, hat im Gerichtskontext aber wahrscheinlich anklagende Kraft.
- source_word: ኵሎ፡ ግብሮሙ፡ ለኖላዊያን
  choice: alle Taten der Hirten
  rationale: „Taten“ passt zur moralisch-gerichtlichen Prüfung; „Hirten“ erhält die feste Bildsprache der Tierapokalypse.
- source_word: እመጥኖሙ
  choice: sie beurteile
  rationale: Das Verb hat die Grundbedeutung des Messens bzw. Bemessens. Im Zusammenhang mit dem zahlenmäßigen Rechenschaftsbericht ist „beurteilen“ natürlich, während die Fußnote die mögliche streng numerische Wiedergabe festhält.
- source_word: በትእዛዝየ፡ ዘአዘዝክዎሙ
  choice: an mein Gebot halten, das ich ihnen geboten habe
  rationale: Die Wortwiederholung von „Gebot/gebieten“ bleibt erhalten, da sie den göttlichen Maßstab der Prüfung betont.
- source_word: እመ፡ አልቦ
  choice: oder nicht
  rationale: Dies bildet einen knappen, natürlichen Abschluss der Ob-Frage.
theological_decisions:
- issue: Gerichtliche Funktion des verlesenen Berichts
  choice: Die zahlenmäßige Verlesung dient als belastendes Zeugnis gegen die Hirten.
  alternative: Der Text könnte lediglich als sachlicher Bericht ohne ausdrücklich anklagende Funktion verstanden werden.
  rationale: Die Verbindung von Zählung, Zeugnis, Taten, Prüfung und Gebot weist auf Rechenschaft und Gericht, ohne die apokalyptische Bildsprache dogmatisch weiter auszudeuten.
- issue: Sprecher und Adressat
  choice: Der Herr weist den Schreiber an, vor ihm vorzulesen.
  alternative: 'Ältere Wiedergaben verstanden den Satz als Bericht des Schreibers: „Ich las vor ihm vor“.'
  rationale: Der Imperativ አንብብ/አንበብ, das Suffix der ersten Person in ቅድሜየ und das spätere „mein Gebot“ sprechen für direkte Rede des Herrn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt dem forensisch-apokalyptischen Charakter verpflichtet, wird aber durch klare Parallelglieder verständlich gehalten. Die bewusste Wiederholung „Gebot … geboten“ bewahrt die Ausdrucksstruktur des Ge'ez.
