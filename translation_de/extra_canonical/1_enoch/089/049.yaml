base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/049.yaml
  text: And those sheep grew and multiplied[a], and all those dogs and foxes and wild boars of the field feared and fled from them. And that ram gored and killed all the beasts, and those beasts were no longer able again to be in the midst of the sheep[e][d][c][b], and they did not seize anything from them.
translation:
  language: de
  text: Und jene Schafe vermehrten sich und wurden zahlreich[d], und all jene Hunde, Füchse[a] und Wildschweine der Wildnis[b] fürchteten sich vor ihnen und flohen. Jener Widder rammte[c] und tötete alle wilden Tiere. Diese wilden Tiere konnten nicht mehr mitten unter den Schafen sein und nahmen ihnen nichts mehr weg.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schakale“. Die genaue Tierart ist unsicher; gemeint ist möglicherweise ein fuchsähnlicher Aasfresser oder Räuber.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich sinngemäß: „wilde Schweine der Wildnis“; auch „Wildschweine des unbebauten Landes“ ist möglich.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder allgemeiner: „stieß“ beziehungsweise „schlug“. Im Zusammenhang mit einem Widder liegt ein Stoßen oder Rammen nahe.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „nahmen zu und vermehrten sich“. Die beiden Verben verstärken gemeinsam das Bild ihres Anwachsens.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ልህቁ / በዝኁ
  choice: wuchsen und wurden zahlreich
  rationale: Die beiden annähernd synonymen Verben bleiben als Paar erhalten und geben die verstärkende Wiederholung des äthiopischen Textes in natürlichem Deutsch wieder.
- source_word: አባግዕ
  choice: Schafe
  rationale: Die konkrete Tiergestalt der durchgehenden Vision wird bewahrt; „Herde“ wäre abstrakter.
- source_word: አክላብ
  choice: Hunde
  rationale: Die direkte Tierbezeichnung erhält den allegorischen Bildcode.
- source_word: ቈናጽል
  choice: Füchse
  rationale: „Füchse“ ist eine gut verständliche Wiedergabe; wegen zoologischer Unsicherheit wird „Schakale“ als Alternative vermerkt.
- source_word: ሐራዊያ ገዳም
  choice: Wildschweine der Wildnis
  rationale: Die Formulierung gibt sowohl die wilden Schweine als auch ihren unbebauten Lebensraum wieder, ohne den Ort enger als Wüste oder Feld festzulegen.
- source_word: ፈርሁ ወነፍጹ እምኔሁ
  choice: fürchteten sich vor ihnen und flohen
  rationale: Innere Furcht und äußere Flucht werden beide bewahrt; der pronominale Bezug wird im Zusammenhang kollektiv auf die Schafe bezogen.
- source_word: ሐርጌ
  choice: Widder
  rationale: Die Bezeichnung des männlichen Schafes bleibt konkret und bewahrt zugleich seine Führungsrolle innerhalb der Vision.
- source_word: ጐድአ
  choice: rammte
  rationale: Das Verb bezeichnet einen heftigen Stoß; beim Widder gibt „rammte“ die tiergemäße Stoßbewegung präziser wieder als das allgemeinere „schlug“.
- source_word: አራዊተ / አራዊት
  choice: wilde Tiere / Tiere
  rationale: Die erste Wiedergabe kennzeichnet die feindlichen, ungezähmten Tiere; die verkürzte Wiederaufnahme vermeidet im Deutschen unnötige Schwerfälligkeit.
- source_word: አክህሉ ዳግመ ... ማእከለ አባግዕ
  choice: konnten nicht wieder mitten unter den Schafen sein
  rationale: Die Wendung bewahrt sowohl die Unfähigkeit als auch das erneute beziehungsweise weitere Eindringen und hält am räumlichen Bild „mitten unter“ fest.
- source_word: ምንትኒ ገሙራ ኢመሠጡ እምኔሆሙ
  choice: raubten ihnen nichts mehr
  rationale: Die Schlussaussage betont das vollständige Ende des gewaltsamen Wegnehmens; „rauben“ passt zum Verhalten der feindlichen Tiere und klingt im Deutschen natürlicher als „ergreifen“.
theological_decisions:
- issue: Ob die Tiere der Vision bereits in der Übersetzung mit historischen Völkern oder Gruppen gleichgesetzt werden sollen
  choice: Die Tierbilder bleiben im Haupttext unaufgelöst erhalten.
  alternative: Die Tiere durch vermutete historische Bezugsgruppen ersetzen oder diese im Haupttext ergänzen.
  rationale: Der äthiopische Text erzählt konsequent in einer apokalyptischen Tierallegorie. Eine historische Identifizierung würde eine Auslegung in den Text eintragen und mögliche Mehrdeutigkeit vorschnell auflösen.
