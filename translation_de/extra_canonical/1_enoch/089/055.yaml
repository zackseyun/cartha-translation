base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/055.yaml
  text: And he gave them over into the hand of the lions and the leopards and the wolves and the hyenas[a], and into the hand of the foxes, and to all the wild beasts[e][d][c][b]; and those beasts of the field began to tear apart those sheep.
translation:
  language: de
  text: Und er gab sie in die Gewalt der Löwen, Leoparden[a], Wölfe und Hyänen[b], in die Gewalt der Füchse und in die Gewalt aller wilden Tiere. Da begannen jene Tiere des Feldes, diese Schafe zu zerreißen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: Panther. Die Tierbezeichnung kann einen Leoparden oder eine ähnliche Großkatze meinen, nicht einen Tiger im heutigen zoologischen Sinn.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Tierbezeichnung ist nicht völlig sicher; möglich ist auch: Schakale.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሐደጎሙ
  choice: Und er gab sie ... in die Gewalt
  rationale: Das Verb kann »verlassen«, »preisgeben« oder »übergeben« bedeuten. Im Gerichtskontext bringt »gab sie in die Gewalt« die aktive Auslieferung natürlich zum Ausdruck.
- source_word: ውስተ እደ
  choice: in die Gewalt
  rationale: Die wörtliche Wendung »in die Hand« bezeichnet hier die Macht feindlicher Tiere. »In die Gewalt« gibt das Idiom in natürlichem Deutsch wieder, ohne die aktive Auslieferung abzuschwächen.
- source_word: አናብስት
  choice: Löwen
  rationale: Die Form bezeichnet in dieser Reihe eindeutig Löwen.
- source_word: አንምርት
  choice: Leoparden
  rationale: Die Bezeichnung entspricht am ehesten »Leoparden« beziehungsweise »Panther«; »Tiger« wäre zoologisch und sprachgeschichtlich weniger passend.
- source_word: አዝእብት
  choice: Wölfe
  rationale: Eine direkte und kontextuell klare Tierbezeichnung.
- source_word: አጽዕብት
  choice: Hyänen
  rationale: »Hyänen« ist eine plausible traditionelle Bestimmung; wegen möglicher Überschneidung mit Schakalen wird die Unsicherheit in einer Fußnote bewahrt.
- source_word: ቈናጽል
  choice: Füchse
  rationale: Die übliche Wiedergabe ist »Füchse«; eine Identifikation mit verwandten Caniden ist möglich, doch hier nicht hinreichend sicher für den Haupttext.
- source_word: ኵሉ አራዊት
  choice: alle wilden Tiere
  rationale: Die Wendung erweitert die Aufzählung auf die Gesamtheit der wilden Tiere.
- source_word: ዝኩ አራዊተ ገዳም
  choice: jene Tiere des Feldes
  rationale: Diese Wiedergabe wahrt den Unterschied zum unmittelbar vorhergehenden »alle wilden Tiere« und entspricht der eigenen Formulierung des Ge'ez.
- source_word: አሐዙ
  choice: begannen
  rationale: 'In Verbindung mit dem folgenden Verb ist die Form inchoativ zu verstehen: Die Tiere setzen mit der Handlung ein.'
- source_word: ይምሥጥዎሙ
  choice: zu zerreißen
  rationale: Das Verb bezeichnet gewaltsames Reißen oder Zerfleischen; »zerreißen« erhält die konkrete Brutalität des Bildes.
- source_word: እልኩ አባግዕ
  choice: diese Schafe
  rationale: Der Demonstrativbezug wird erhalten; »Schafe« ist die feststehende Bildsprache der Tierapokalypse.
theological_decisions:
- issue: Handelnde Instanz im Gerichtsbild
  choice: er gab sie in die Gewalt der Raubtiere
  alternative: er ließ sie in der Gewalt der Raubtiere
  rationale: Die Formulierung wahrt die aktive Übergabe beziehungsweise Preisgabe und damit die Spannung des Gerichtsbildes, ohne die allegorischen Tiere ausdrücklich mit historischen Mächten gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die apokalyptische Bildsprache bleibt konkret; das schwerfällige deutsche Idiom »in die Hand« wird als »in die Gewalt« wiedergegeben. Die beiden Ge'ez-Ausdrücke für wilde Tiere werden bewusst unterschieden.
