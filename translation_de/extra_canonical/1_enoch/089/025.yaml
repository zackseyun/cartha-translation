base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/025.yaml
  text: And those wolves again showed themselves to the sheep[a], and they went into the midst of that stream of water[d][c][b]; and those wolves followed the sheep and ran after them into that stream of water.
translation:
  language: de
  text: Und wieder verfolgten jene Wölfe die Schafe[a], und die Schafe gingen mitten in jenen Wasserlauf hinein. Die Wölfe folgten den Schafen und liefen ihnen bis in jenen Wasserlauf nach.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die überlieferte Transkription ist an dieser Stelle offenbar beschädigt. Nach der Lesung der Druckvorlage lautet der Sinn wahrscheinlich: »Und wieder verfolgten jene Wölfe die Schafe.« Die transkribierte Form könnte dagegen wörtlich als ein Veranlassen zum Sehen verstanden werden.'
    reason: textual_variant
  - marker: b
    text: Der Schluss ist im äthiopischen Text syntaktisch schwerfällig und wiederholt »jene Wölfe« und »jenen Wasserlauf«. Die Übersetzung bewahrt die doppelte Verfolgungsbewegung, formuliert sie aber in natürlichem Deutsch.
    reason: textual_variant
lexical_decisions:
- source_word: 'ወዐዲሆሙ (in der Transkription fehlerhaft: ወጓዲሆሙ)'
  choice: Und wieder
  rationale: Die Lesung der Druckvorlage ist als »und wieder/abermals« zu verstehen; die vorgelegte Form beruht wahrscheinlich auf einem Transkriptions- oder OCR-Fehler.
- source_word: አዝእብት
  choice: Wölfe
  rationale: Die konkrete Tierbezeichnung und damit die Bildsprache der Tierapokalypse bleiben erhalten.
- source_word: ተለውዎሙ / mutmaßliche Vorlage des fehlerhaft transkribierten አርእይዎሙ
  choice: verfolgten
  rationale: Das Verb bezeichnet ein Folgen oder Verfolgen. Im Zusammenhang laufen die Wölfe den Schafen in den Wasserlauf nach; daher ist hier die zielgerichtete Wiedergabe »verfolgten« angemessen.
- source_word: ለአባግዕ
  choice: die Schafe
  rationale: Die konkrete Tiermetaphorik wird nicht durch »Herde« oder eine historische Deutung ersetzt.
- source_word: ማእከለ ዝኩ ዐይገ ማይ
  choice: mitten in jenen Wasserlauf hinein
  rationale: Die Formulierung bewahrt sowohl die Bewegung hinein als auch die räumliche Angabe »in die Mitte/mitten hinein«, ohne Größe oder Stärke des Gewässers näher festzulegen.
- source_word: ተለውዎሙ
  choice: folgten
  rationale: Das Grundmoment des Verbs ist »folgen«; zusammen mit dem anschließenden »liefen ihnen nach« bleibt die Wiederholung der Bewegung erkennbar, ohne beide Verben identisch wiederzugeben.
- source_word: ወረጹ ድኅሬሆሙ
  choice: liefen ihnen … nach
  rationale: Die Wiedergabe erhält das anschauliche Bewegungsverb und die Richtungsangabe »hinter ihnen her«.
theological_decisions:
- issue: Symbolik der Tierapokalypse
  choice: Wölfe, Schafe und Wasserlauf bleiben als konkrete Bilder im Text stehen.
  alternative: Die Bilder durch historische Referenten wie Ägypter, Israeliten und Rotes Meer ersetzen.
  rationale: Eine historische Identifizierung wäre bereits Auslegung. Die Übersetzung bewahrt die mehrdeutige apokalyptische Bildsprache.
