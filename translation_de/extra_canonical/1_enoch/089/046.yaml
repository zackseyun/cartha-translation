base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/046.yaml
  text: And he went to it and spoke to it alone[a], and raised up that ram, and made it ruler and leader of the sheep; and through all this[c][b], the dogs were afflicting the sheep.
translation:
  language: de
  text: Und er ging zu ihm und sprach mit ihm allein[a]. Dann erhob er jenen Widder und machte ihn zum Herrscher und Anführer der Schafe; bei alledem bedrängten die Hunde die Schafe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sprach unter vier Augen mit ihm“.'
    reason: Die Wendung kann sowohl das Alleinsein des Gesprächspartners als auch den vertraulichen Charakter des Gesprächs hervorheben.
  - marker: b
    text: 'Oder: „während all dessen bedrängten die Hunde die Schafe“.'
    reason: Die zeitliche Wendung kann als „bei alledem“, „während all dessen“ oder „die ganze Zeit hindurch“ wiedergegeben werden.
lexical_decisions:
- source_word: ወሖረ፡ ኀቤሁ
  choice: Und er ging zu ihm
  rationale: Das Bewegungsverb wird schlicht mit „ging“ wiedergegeben; das maskuline Pronomen entspricht im Deutschen dem zuvor genannten Widder.
- source_word: ወተናገረ፡ ለባሕቲቱ
  choice: und sprach mit ihm allein
  rationale: ለባሕቲቱ bezeichnet, dass das Gespräch mit ihm allein beziehungsweise unter vier Augen stattfand; es benennt nicht „jenen Widder“ als bloßes Redeobjekt.
- source_word: ወአንሥአ፡ ለውእቱ፡ ሐርጌ
  choice: Dann erhob er jenen Widder
  rationale: ሐርጌ bezeichnet hier den Widder, und ለ markiert das bestimmte Objekt. Daher ist nicht von einem für ihn aufgerichteten Horn die Rede.
- source_word: ወገብረ፡ መኰንነ፡ ወመራሔ፡ ለአባግዕ
  choice: und machte ihn zum Herrscher und Anführer der Schafe
  rationale: Die beiden Amts- und Leitungsbegriffe werden als „Herrscher“ und „Anführer“ bewahrt; die deutsche Konstruktion gibt seine Autorität im Blick auf die Schafe natürlich wieder.
- source_word: ወበኵሉዝ
  choice: bei alledem
  rationale: Die Wendung bezieht sich auf das gesamte gleichzeitig ablaufende Geschehen und modifiziert nicht „die Hunde“.
- source_word: አክላብ፡ ያጸህቅዎሙ፡ ለአባግዕ
  choice: bedrängten die Hunde die Schafe
  rationale: Das Verb bezeichnet ein fortgesetztes Bedrängen oder Bedrücken. „Bedrängten“ wahrt die feindselige Handlung, ohne die nicht ausdrücklich ausgesagte Vorstellung des Forttreibens einzutragen.
theological_decisions:
- issue: Ob ሐርጌ als „Horn“ oder als „Widder“ zu verstehen ist
  choice: jenen Widder
  alternative: für ihn ein Horn
  rationale: In dieser Form und Satzkonstruktion bezeichnet das Wort den Widder als bestimmtes Objekt von „erhob“. Die frühere Horn-Deutung beruht auf einer falschen Segmentierung und würde dem Text ein zusätzliches Machtsymbol eintragen.
- issue: Wie die Einsetzung des Widders zu beschreiben ist
  choice: Herrscher und Anführer der Schafe
  alternative: Fürst und Führer über die Schafe
  rationale: Die doppelte Bezeichnung von Herrschaft und Leitung bleibt erhalten, ohne die symbolische Figur mit einer bestimmten historischen oder konfessionellen Auslegung gleichzusetzen.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Erzählführung. Die Tierbilder der Vision bleiben unaufgelöst erhalten. „Bei alledem“ ist knapp und idiomatisch; die Fußnote bewahrt die zeitliche Bedeutungsnuance.
