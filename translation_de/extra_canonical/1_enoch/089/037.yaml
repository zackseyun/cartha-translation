base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/037.yaml
  text: And I watched until that sheep lay down—the one that had met that sheep which led them—and I watched until all the great and small sheep were stirred up in their place[d][c][b][a], and they entered into the pasture and came near the stream of water.
translation:
  language: de
  text: Und ich sah zu, bis jenes Schaf sich niederlegte[a], das dem Schaf begegnet war, das sie führte. Und ich sah zu, bis alle großen Schafe umkamen und die kleinen Schafe an ihrer Stelle aufstanden; und sie gingen auf die Weide und näherten sich dem Wasserlauf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Sich-Niederlegen kann hier verhüllend den Tod des Schafes bezeichnen; das Verb sagt jedoch zunächst nur, dass es sich niederlegte oder zur Ruhe legte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰከበ
  choice: sich niederlegte
  rationale: Das aktive Verb bezeichnet das Sich-Hinlegen oder Ruhen und kann in diesem Zusammenhang verhüllend auf den Tod anspielen. Die reflexive deutsche Form bewahrt die grammatische Aktivform, ohne den Tod ausdrücklich festzulegen.
- source_word: በግዕ
  choice: Schaf
  rationale: „Schaf“ ist die breite, im Tiertraum beständige Bezeichnung und vermeidet die unnötige Festlegung auf Widder oder Lamm.
- source_word: ዘተረክበ
  choice: begegnet war
  rationale: Die Relativkonstruktion kennzeichnet das Schaf durch seine frühere Begegnung mit dem führenden Schaf.
- source_word: ዘመርሖሙ
  choice: das sie geführt hatte
  rationale: Das Verb bedeutet führen oder leiten. „Geführt“ gibt die Bewegungsrelation wieder, ohne zusätzlich eine Hirtenmetapher einzutragen.
- source_word: ተኃጕሉ
  choice: umkamen
  rationale: Das Verb ist hier von ኀጕለ im Sinn von zugrunde gehen oder umkommen zu verstehen; es bildet ein eigenes Prädikat zu „alle großen Schafe“.
- source_word: ተንሥኡ
  choice: aufstanden
  rationale: Das ausdrücklich vorhandene Verb bezeichnet das Aufstehen oder Sich-Erheben und gehört zu den kleinen Schafen als neuem Subjekt.
- source_word: ህየንቴሆሙ
  choice: an ihrer Stelle
  rationale: Die Wendung bezeichnet hier, dass die kleinen Schafe den Platz der umgekommenen großen Schafe einnehmen, lässt im Deutschen aber zugleich das räumliche Bild bestehen.
- source_word: መርዔት
  choice: Weide
  rationale: Das Substantiv bezeichnet einen Weideplatz; „Weide“ ist konkret, geläufig und wahrt die Bildwelt der Schafe.
- source_word: ፈለገ ማይ
  choice: Wasserlauf
  rationale: Die Verbindung bezeichnet wörtlich einen Lauf oder Kanal von Wasser, ohne dessen Größe genauer festzulegen.
theological_decisions:
- issue: Ob das Niederlegen des ersten Schafes ausdrücklich als Tod wiederzugeben ist
  choice: Das Bild mit „sich niederlegte“ beibehalten
  alternative: starb / kam um
  rationale: Das Verb steht in der Aktivform und bedeutet zunächst „sich niederlegen“ oder „ruhen“, kann im Tiertraum jedoch euphemistisch den Tod bezeichnen. Der Haupttext soll diese Spannung nicht vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Schauformel „Und ich sah zu, bis …“ bleibt zur Wahrung des visionären Erzählrhythmus erhalten. Die zwei getrennten Aussagen über die großen und die kleinen Schafe werden syntaktisch klar wiedergegeben.
