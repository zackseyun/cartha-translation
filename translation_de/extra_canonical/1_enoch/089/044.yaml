base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/044.yaml
  text: And that sheep[a], whose eyes had been opened, saw that ram in the midst of the sheep, which had abandoned its glory, and it began to gore those sheep and trample them[d][c][b], and it went about without restraint.
translation:
  language: de
  text: Und jenes Schaf, dessen Augen geöffnet worden waren, sah den Widder mitten unter den Schafen, der seine Herrlichkeit aufgegeben hatte. Er begann, jene Schafe mit den Hörnern zu stoßen und sie niederzutreten, und zog ohne Würde umher.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und verhielt sich ungebührlich“.'
    reason: Die Wendung bezeichnet ein Verhalten ohne Schicklichkeit, Anstand oder Würde.
lexical_decisions:
- source_word: በግዕ
  choice: Schaf
  rationale: Bewahrt die durchgehende Tierbildsprache der Vision; „Lamm“ wäre hier unnötig enger und könnte zusätzliche Assoziationen eintragen.
- source_word: ዘተፈትሐ አዕይንቲሁ
  choice: dessen Augen geöffnet worden waren
  rationale: Gibt die passive Bedeutung wieder und lässt offen, durch wen oder wodurch die Wahrnehmung ermöglicht wurde.
- source_word: ሐርጌ
  choice: Widder
  rationale: Die natürliche deutsche Bezeichnung für ein männliches Schaf erhält das konkrete Tierbild.
- source_word: ዘማእከለ አባግዕ
  choice: mitten unter den Schafen
  rationale: Gibt die räumliche Einordnung natürlich und anschaulich wieder.
- source_word: ዘሐደገ ስብሐተ
  choice: der seine Herrlichkeit aufgegeben hatte
  rationale: „Herrlichkeit“ bewahrt die Bedeutungsweite von ስብሐት zwischen Glanz, Ehre und Würde, ohne das Symbol festzulegen.
- source_word: አሐዘ ይጉድኦሙ
  choice: Er begann, jene Schafe mit den Hörnern zu stoßen
  rationale: Der Beginn der Handlung wird ausdrücklich wiedergegeben; der konkrete Ausdruck passt zur Gewalttätigkeit eines Widders.
- source_word: ወኬዶሙ
  choice: und sie niederzutreten
  rationale: Setzt das gewaltsame Tierbild fort und entspricht der überlieferten Deutung als Zertreten oder Niedertrampeln.
- source_word: ወሖረ ዘእንበለ ተደላ
  choice: und zog ohne Würde umher
  rationale: ተደላ bezeichnet hier eher Schicklichkeit, Anstand oder Würde als fehlende äußere Behinderung; daher wird die frühere Wiedergabe „ohne Einschränkung“ vermieden.
theological_decisions:
- issue: Bedeutung der aufgegebenen „Herrlichkeit“
  choice: Herrlichkeit
  alternative: Glanz, Ehre oder Würde
  rationale: Das Symbol kann königlichen Rang, Ansehen oder Glanz bezeichnen. Die breite Wiedergabe legt keine bestimmte historische oder theologische Deutung fest.
- issue: Charakter der abschließenden Beschreibung
  choice: ohne Würde
  alternative: unanständig beziehungsweise ungebührlich
  rationale: Die Formulierung beschreibt das Verhalten als unschicklich oder unwürdig und nicht eindeutig als ungehindert; so bleibt die moralisch-symbolische Aussage erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Tierbildsprache. Die passive Augenöffnung und die mehrdeutige „Herrlichkeit“ bleiben bewusst unausgedeutet; die Schlusswendung folgt der lexikalisch besser begründeten Bedeutung „ohne Würde/Schicklichkeit“.
