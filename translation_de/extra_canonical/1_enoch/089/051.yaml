base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/051.yaml
  text: And again I saw those sheep[a], how they went astray and walked in many paths, and they abandoned that house of their Lord. And the Lord of the sheep called some from among the sheep and sent them to the sheep[c][b], but the sheep began to kill them.
translation:
  language: de
  text: 'Und wieder sah ich jene Schafe: Sie gingen in die Irre und zogen auf vielen Wegen umher. Sie verließen jenes Haus ihres Herrn. Da rief der Herr der Schafe einige aus ihrer Mitte und sandte sie zu den Schafen; doch die Schafe begannen, sie zu töten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „doch die Schafe ergriffen sie, um sie zu töten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢክዎሙ ካዕበ ለዝኩ አባግዕ ካዕበ
  choice: Und wieder sah ich jene Schafe
  rationale: Die wiederholte Formulierung mit ካዕበ wird im Deutschen einmal mit „wieder“ wiedergegeben; so bleibt die visionäre Abfolge erhalten, ohne eine wahrscheinlich stilistische Wiederholung künstlich nachzuahmen.
- source_word: ከመ ስሕቱ
  choice: Sie gingen in die Irre
  rationale: Die Wendung bewahrt sowohl das konkrete Bild verirrter Schafe als auch den übertragenen Sinn des Fehlgehens.
- source_word: ወሖሩ በብዙሕ ፍናዋት
  choice: und zogen auf vielen Wegen umher
  rationale: Die Übersetzung hält am anschaulichen Bild mehrerer Wege fest und gibt die Bewegung natürlich auf Deutsch wieder.
- source_word: ወሐደጉ ዝኩ ቤተ ዚአሆሙ
  choice: Sie verließen jenes Haus
  rationale: „Verließen“ gibt das Weggehen vom Haus klar wieder, ohne eine über den Quellenausdruck hinausgehende emotionale Wertung festzulegen.
- source_word: ወእግዚኦሙ ለአባግዕ / ወእግዚኦሙ ለአባግዕ
  choice: ihres Herrn / der Herr der Schafe
  rationale: „Herr“ wahrt die theologische Bedeutung der Gottesgestalt und zugleich das Verhältnis des Besitzers beziehungsweise Herrschers zur Herde.
- source_word: ጸውዐ እምውስተቶሙ ለአባግዕ
  choice: rief ... einige aus ihrer Mitte
  rationale: „Einige“ macht im Deutschen den aus der Herde ausgewählten Teil idiomatisch deutlich; „aus ihrer Mitte“ bildet die Herkunft innerhalb der Schafe ab.
- source_word: ወለአኮሙ ኀበ አባግዕ
  choice: sandte sie zu den Schafen
  rationale: Die schlichte Sendungsformulierung bewahrt das Motiv der Beauftragung, ohne dessen Zweck auszudeuten.
- source_word: ወአባግዕ አኃዙ ይቅትልዎሙ
  choice: doch die Schafe begannen, sie zu töten
  rationale: Die Hauptfassung folgt der möglichen ingressiven Bedeutung; die ebenfalls mögliche konkrete Auffassung von አኃዙ als Ergreifen wird in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe von እግዚእ in der Schafallegorie
  choice: Herr
  alternative: Gebieter / Besitzer
  rationale: Die Gestalt steht in der Vision für Gott. „Herr“ bewahrt dieses theologische Gewicht, ohne das Bild des Herrn der Herde aufzulösen.
- issue: Identität der aus der Herde Gerufenen
  choice: nicht ausdrücklich als Propheten bezeichnet
  alternative: die Propheten
  rationale: Der Zusammenhang legt prophetische Gesandte nahe, doch der Vers selbst bleibt bei der Bildsprache von Schafen. Die Übersetzung fügt daher keine ausdrückliche Identifikation ein.
- issue: Gewaltsame Schlusswendung
  choice: begannen, sie zu töten
  alternative: ergriffen sie, um sie zu töten
  rationale: Die gedrängte Konstruktion lässt beide Auffassungen zu. Die Hauptfassung wahrt den feindseligen Verlauf; die konkretere Alternative steht in der Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer apokalyptischer Bildsprache. Die Wiederholungen des Ausgangstextes werden dort bewahrt, wo sie inhaltlich tragen; die doppelte Verwendung von „wieder“ wird aus idiomatischen Gründen nicht nachgebildet.
