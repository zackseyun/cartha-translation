base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/014.yaml
  text: And the Lord brought the twelve sheep so that they might dwell with it and graze with it among the wolves[c][b][a]; and they multiplied and became many flocks of sheep.
translation:
  language: de
  text: Und der Herr brachte die zwölf Schafe herbei, damit sie bei ihm[a] wohnten und mit ihm mitten unter den Wölfen weideten. Und sie vermehrten sich und wurden zu vielen Schafherden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „ihm“ wiedergegebene Pronomen kann sich im Zusammenhang auf das einzelne Schaf aus dem vorhergehenden Vers beziehen; eine Beziehung auf den Herrn ist grammatisch ebenfalls möglich.
    reason: ambiguous_referent
  - marker: b
    text: Die Schlusswendung ist textlich unsicher. Sie scheint zu besagen, dass aus den zwölf Schafen zahlreiche Gruppen oder Herden von Schafen wurden.
    reason: alternative_reading
lexical_decisions:
- source_word: እግዚአ
  choice: der Herr
  rationale: Bewahrt die Hoheitsbezeichnung und zugleich die symbolische Rolle des souveränen Herrn in der Tiervision, ohne die Bildsprache durch „Gott“ erklärend aufzulösen.
- source_word: አምጽኦሙ
  choice: brachte … herbei
  rationale: Gibt die aktive Veranlassung des Kommens natürlich wieder.
- source_word: ፲ወ፪ አባግዕ
  choice: die zwölf Schafe
  rationale: Die Zahl ist ausdrücklich genannt; „Schafe“ erhält die etablierte Tierbildsprache, ohne ein Geschlecht festzulegen.
- source_word: ከመ ይኅደሩ ምስሌሁ
  choice: damit sie bei ihm blieben
  rationale: Gibt den Zweck und das Verweilen bei dem männlich-singulären Bezugswesen wieder. Das Pronomen bleibt wegen des möglichen Rückbezugs auf das einzelne Schaf aus Vers 13 mehrdeutig.
- source_word: ይትረዐዩ ምስሌሁ
  choice: mit ihm … weideten
  rationale: „Weideten“ ist im Deutschen eine natürliche Wiedergabe der Fress- und Weidebildsprache der Schafe; der pronominale Rückbezug bleibt erhalten.
- source_word: ማእከለ አዝእት
  choice: mitten unter den Wölfen
  rationale: Bewahrt sowohl die räumliche Aussage als auch die bedrohliche Umgebung.
- source_word: በዝኁ
  choice: sie vermehrten sich
  rationale: Entspricht dem Wachstumsverb und klingt in biblischer Erzählprosa natürlich.
- source_word: ኮኑ መራዕየ ብዙኃተ ዘአባግዕ
  choice: wurden zu vielen Schafherden
  rationale: Gibt den wahrscheinlichen Sinn einer Vermehrung zu zahlreichen Schafgruppen wieder, ohne die unsichere Kollektivbezeichnung zu stark festzulegen.
theological_decisions:
- issue: Identität des „Herrn“ in der Tiervision
  choice: „der Herr“ ohne nähere Identifizierung
  alternative: „der Besitzer“ oder ausdrücklich „Gott“
  rationale: So bleiben das theologische Gewicht und die symbolische Indirektheit der apokalyptischen Bildrede gewahrt.
- issue: Bezugswort des Suffixes in ምስሌሁ
  choice: Das deutsche „ihm“ im Text stehen lassen und die mögliche Beziehung auf das einzelne Schaf in einer Fußnote erläutern
  alternative: Das Pronomen unmittelbar auf den Herrn beziehen oder „bei diesem Schaf“ ergänzen
  rationale: Das geezische maskuline Singularsuffix kann grammatisch auf den Herrn oder im Erzählzusammenhang auf das einzelne Schaf aus Vers 13 zurückweisen. Eine ausdrückliche Ergänzung würde die echte Spannung auflösen und nicht vorhandene Wörter eintragen.
translation_notes:
  register: Moderne, würdige deutsche Erzählprosa. Die Tiermetaphorik wird konsequent beibehalten. „Blieben“ ist hier natürlicher als das gehobenere „wohnten“, während „mitten unter“ die Bedrohung markiert. Sämtliche Fußnotenmarker stehen unmittelbar an den betroffenen Stellen.
