  to: Und der Herr der Schafe wurde überaus zornig auf sie. Jenes Schaf merkte es, stieg vom Gipfel des Felsens herab, kam zu den Schafen und fand den größeren Teil von ihnen mit verdunkelten Augen[a] sowie diejenigen, die sich verirrt hatten.
  rationale: Die Revision bewahrt die im Ausgangstext mögliche Unterscheidung zwischen dem größeren Teil mit beeinträchtigtem Sehvermögen und denjenigen, die abgeirrt waren, statt beide Gruppen ohne ausdrücklichen grammatischen Zwang gleichzusetzen. Zugleich wird „erkannte es“ behutsam zu dem natürlicheren „merkte es“ geglättet; Bedeutung und Bezug bleiben unverändert.
