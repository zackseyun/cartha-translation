base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/033.yaml
  text: And the Lord of the sheep was exceedingly angry with them[a], and that sheep knew it, and came down from the summit of the rock, and came to the sheep[c][b], and found the greater part of them with their eyes blinded, and those who had gone astray.
translation:
  language: de
  text: Und der Herr der Schafe wurde überaus zornig auf sie. Jenes Schaf merkte es, stieg vom Gipfel des Felsens herab, kam zu den Schafen und fand den größeren Teil von ihnen mit verdunkelten Augen[a] sowie diejenigen, die sich verirrt hatten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „geblendet“. Das geʿezische Wort beschreibt verdunkelte oder beeinträchtigte Augen und muss nicht zwingend völlige Blindheit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እግዚኦሙ ለአባግዕ
  choice: der Herr der Schafe
  rationale: Die Fügung bezeichnet den Herrn beziehungsweise Gebieter der Schafe. „Herr“ bewahrt den erhabenen, im Tierbildertraum auch theologischen Ton, ohne die Bildsprache aufzulösen.
- source_word: ተምዐዐ ዲቤሆሙ መዐተ ዐቢየ
  choice: wurde überaus zornig auf sie
  rationale: Die verstärkende Verbindung mit „großem Zorn“ wird in natürlichem Deutsch durch „überaus zornig“ wiedergegeben.
- source_word: ወአእመረ ዝኩ በግዕ
  choice: Jenes Schaf erkannte es
  rationale: 'ዝኩ በግዕ ist das Subjekt des Verbs: Das betreffende Schaf erkennt beziehungsweise begreift den zuvor geschilderten Vorgang. Dies entspricht auch dem Kontrast zum vorherigen Vers.'
- source_word: ወወረደ እምነ ድማኅ ለኵኵሕ
  choice: stieg vom Gipfel des Felsens herab
  rationale: Die Wendung bezeichnet den Abstieg vom Gipfel beziehungsweise oberen Ende des Felsens; „Gipfel des Felsens“ gibt beide nominalen Bestandteile wieder.
- source_word: ኀበ አባግዕት
  choice: kam zu den Schafen
  rationale: Die schlichte Richtungsangabe bleibt innerhalb der durchgehenden Tierbildsprache.
- source_word: ዘመብዝኅቶሙ
  choice: dem größeren Teil von ihnen
  rationale: Die Form bezeichnet den größeren Anteil beziehungsweise die Mehrheit; die gewählte Wendung ist würdig und zugleich allgemein verständlich.
- source_word: ዘጽሉለ አዕይንቲሆሙ
  choice: die Augen verdunkelt waren
  rationale: „Verdunkelt“ bewahrt das Bild beeinträchtigten Sehens und die mögliche resultative beziehungsweise passivische Nuance, ohne eine vollständige und dauerhafte Blindheit festzulegen.
- source_word: እለ ስሕቱ
  choice: dass sie sich verirrt hatten
  rationale: „Sich verirren“ erhält sowohl die konkrete Bildwelt der Schafe als auch den Sinn moralischer oder geistlicher Abirrung.
theological_decisions:
- issue: Wiedergabe des Besitzers beziehungsweise Herrschers der Schafe
  choice: Herr der Schafe
  alternative: Gebieter der Schafe
  rationale: Die Gestalt fungiert in der Tierapokalypse als göttlicher Herrscher und Richter. „Herr“ bewahrt diese Identität, ohne weitergehende christologische Festlegungen einzutragen.
- issue: Subjekt von ወአእመረ und der anschließenden Verben
  choice: Jenes Schaf erkennt den Vorgang und steigt herab
  alternative: Der Herr erkennt jenes Schaf und steigt herab
  rationale: Die ge'ezische Wortfolge und der unmarkierte Subjektausdruck ዝኩ በግዕ sprechen dafür, dass „jenes Schaf“ Subjekt ist; zudem bildet dies einen sinnvollen Gegensatz zum Nichtwissen des Schafes im vorherigen Vers.
- issue: Charakter der beeinträchtigten Sicht
  choice: Augen waren verdunkelt
  alternative: Augen waren geblendet / sie waren blind
  rationale: Die Übersetzung lässt offen, ob völlige Blindheit oder eine Verdunkelung beziehungsweise Trübung gemeint ist, und vermeidet dadurch eine unnötige theologische Zuspitzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener Tierbildsprache. Die lange ge'ezische Satzkette wurde behutsam gegliedert; die beiden Befunde am Versende werden syntaktisch gemeinsam auf den größeren Teil der Schafe bezogen.
