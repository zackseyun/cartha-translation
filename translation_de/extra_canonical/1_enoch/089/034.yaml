base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/034.yaml
  text: And when they saw him[a], they were afraid and trembled before his face[b], and they desired to return to their own folds.
translation:
  language: de
  text: Als sie ihn sahen, fürchteten sie sich und zitterten vor ihm[a]. Sie wünschten, in ihre eigenen Pferche zurückzukehren[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »vor seinem Angesicht«; gemeint ist seine unmittelbare Gegenwart.'
    reason: lexical_alternative
  - marker: b
    text: Das zugrunde liegende Wort bezeichnet wahrscheinlich Tiergehege oder Hürden; »Pferche« bewahrt die Tiersymbolik der Vision.
    reason: cultural_note
lexical_decisions:
- source_word: ርእይዎ
  choice: sie ihn sahen
  rationale: Das gewöhnliche geezische Verb für »sehen« trägt hier ein Objektsuffix der dritten Person Singular; die schlichte Wiedergabe passt zum Erzählfluss.
- source_word: ፈርሁ ወርዕዱ
  choice: fürchteten sie sich und zitterten
  rationale: Die beiden Verben bezeichnen Furcht und deren körperliche Steigerung; die deutsche Paarung bewahrt beides ohne Übertreibung.
- source_word: እምቅድመ ገጹ
  choice: vor ihm
  rationale: Die Wendung lautet wörtlich etwa »vor seinem Angesicht«. »Vor ihm« ist im heutigen Deutsch natürlich und bezeichnet seine unmittelbare Gegenwart.
- source_word: ወፈቀዱ
  choice: und sie wollten
  rationale: Das Verb bezeichnet Wollen oder Begehren. »Wollten« ist hier natürlich, ohne dem Wunsch eine im Ausgangstext nicht zwingend angelegte Intensität zu geben.
- source_word: ከመ ይግብኡ
  choice: zurückkehren
  rationale: Im Zusammenhang bezeichnet die Form das Hinein- beziehungsweise Zurückgehen an den vorherigen Ort; »zurückkehren« gibt den wahrscheinlichen Richtungssinn wieder.
- source_word: ለአዕጻዲ ዚአሆሙ
  choice: in ihre eigenen Pferche
  rationale: Der Ausdruck meint offenbar Tiergehege oder Hürden. »Pferche« wahrt die durchgehende Tiersymbolik und gibt das Possessivelement ausdrücklich wieder.
theological_decisions:
- issue: Beibehaltung der Tiersymbolik der Tierapokalypse
  choice: »ihre eigenen Pferche«
  alternative: »ihre Heimat« oder »ihre Orte«
  rationale: Eine Verallgemeinerung zu menschlichen Wohnorten würde die literarische und theologische Bildsprache der Vision abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die semitisch geprägte Wendung »vor seinem Angesicht« wird zugunsten natürlichen Deutschen in die Fußnote gesetzt; die apokalyptische Tiersymbolik bleibt im Haupttext erhalten.
