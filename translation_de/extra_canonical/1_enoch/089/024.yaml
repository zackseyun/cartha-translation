  source_fidelity: 'Die Übersetzung gibt die ge''ezische Satzgliederung korrekt wieder: Das Wasserbecken teilt sich, das Wasser steht auf beiden Seiten vor den Betroffenen, und „ihr Herr“ ist Subjekt des zweiten „stand“ und steht zwischen ihnen und den Wölfen. Damit wird insbesondere die frühere syntaktische Fehlzuordnung von ወእግዚኦሙ vermieden. „Wasserbecken“ entspricht zudem dem im englischen Audit-Trail zuletzt festgelegten Bild von einem begrenzten Wasserkörper.'
  naturalness: Der Text ist flüssiges modernes Standarddeutsch und bewahrt dennoch den würdevoll-visionären Duktus. „Vor ihnen“ ist gegenüber dem wörtlichen „vor ihren Gesichtern“ idiomatisch, ohne räumliche Information zu verlieren. Die Stellung von „während er sie führte“ ist klar und natürlich.
  terminology: „Herr“ gibt እግዚኦሙ angemessen wieder und lässt den allegorischen beziehungsweise theologischen Referenten offen. Die Großschreibung ist im Deutschen als Substantivschreibung erforderlich und bedeutet keine zusätzliche dogmatische Festlegung. „Wölfe“ und die räumliche Formel „zwischen ihnen und den Wölfen“ sind sachgerecht.
