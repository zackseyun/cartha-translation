base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/024.yaml
  text: And that pool of water was split[a], and the water stood on this side and on that side before their faces; and their Lord, while he was leading them[e][d][c][b], stood between them and the wolves.
translation:
  language: de
  text: Und jenes Wasserbecken teilte sich, und das Wasser stand auf dieser und auf jener Seite vor ihnen; und ihr Herr stand, während er sie führte, zwischen ihnen und den Wölfen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዐይገ፡ ማይ
  choice: Wasserbecken
  rationale: Die Wendung bezeichnet hier nach der revidierten, kontextbezogenen Beurteilung eine begrenzte Wasseransammlung. „Wasserbecken“ bewahrt zudem die Wiederholung des Bildwortes im Zusammenhang.
- source_word: ተሠጠ
  choice: teilte sich
  rationale: Das Verb bezeichnet ein Teilen oder Spalten. Die reflexive Form klingt im modernen Deutschen natürlich und hält die Anspielung an die Teilung des Wassers offen.
- source_word: ቆመ፡ ማይ
  choice: das Wasser stand
  rationale: Die wörtliche und bildkräftige Aussage von stillstehendem, aufgerichtetem Wasser bleibt erhalten.
- source_word: እምዝየ፡ ወእምዝየ
  choice: auf dieser und auf jener Seite
  rationale: Die distributive Fügung bezeichnet die beiden Seiten des Weges und wird räumlich klar wiedergegeben.
- source_word: በቅድመ፡ ገጾሙ
  choice: vor ihnen
  rationale: Wörtlich steht „vor ihren Gesichtern“; „vor ihnen“ gibt denselben räumlichen Sinn in natürlichem modernem Deutsch wieder.
- source_word: እግዚኦሙ
  choice: ihr Herr
  rationale: Das Substantiv ist Subjekt des folgenden „stand“ und bezeichnet eine Autoritätsgestalt. „Herr“ wahrt die mögliche theologische Resonanz, ohne den Referenten durch eine Zusatzbezeichnung festzulegen.
- source_word: እንዘ፡ ይመራሖሙ
  choice: während er sie führte
  rationale: Die Begleitumstandskonstruktion bezeichnet ein gleichzeitig andauerndes Führen.
- source_word: ወቆመ፡ ማእከሎሙ፡ ወማእከለ፡ አዝእብት
  choice: und … stand zwischen ihnen und den Wölfen
  rationale: „Ihr Herr“ ist das Subjekt des zweiten Verbs. Die wiederholte Verhältnisangabe wird im Deutschen idiomatisch als „zwischen ihnen und den Wölfen“ ausgedrückt.
theological_decisions:
- issue: Referent und Schreibung von „ihr Herr“
  choice: „ihr Herr“ als Subjekt des zweiten „stand“, mit großgeschriebenem Titel
  alternative: „ihr Herr“ als bloßer menschlicher beziehungsweise tierallegorischer Anführer oder eine Lesart, nach der das Wasser erneut das Subjekt wäre
  rationale: Die ge'ezische Syntax setzt ወእግዚኦሙ als Subjekt zu ወቆመ; die Szene lässt zugleich eine göttliche beziehungsweise allegorische Deutung anklingen. Die Übersetzung wahrt diese Spannung, statt sie durch eine erklärende Identifikation aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem visionären Erzählrhythmus des Ge'ez, vermeidet jedoch die im Deutschen unnatürliche Wendung „vor ihren Gesichtern“. Keine Fußnoten sind nötig, da die entscheidende syntaktische Mehrdeutigkeit durch die Quellenprüfung geklärt ist und die mögliche Identität des „Herrn“ im Text offenbleibt.
