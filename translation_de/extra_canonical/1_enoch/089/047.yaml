base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/047.yaml
  text: And the first ram pursued that later ram[a], and that later ram rose up and fled from before his face[c][b]; and I saw until those dogs brought down the first ram.
translation:
  language: de
  text: Und der erste Widder verfolgte jenen späteren Widder, und der spätere Widder erhob sich und floh vor ihm; und ich sah, bis jene Hunde den ersten Widder zu Fall brachten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ሐርጌ
  choice: Widder
  rationale: 'Obwohl das Wort lexikalisch auch anders verstanden werden kann, verlangt der Bildzusammenhang der Tierapokalypse hier einen Widder: Die beiden Tiere führen die Schafe und entsprechen den Widdern der umliegenden Verse. So bleibt die innere Bildsprache erhalten.'
- source_word: ቀዳማዊ
  choice: erste
  rationale: Die Bezeichnung markiert die zeitliche Reihenfolge und steht im Gegensatz zu ዳሓራዊ/ዳሕራዊ.
- source_word: ዳሓራዊ / ዳሕራዊ
  choice: spätere
  rationale: „Später“ bewahrt die zeitliche Gegenüberstellung zum „ersten“, ohne unnötig festzulegen, dass es sich um den letzten oder lediglich den zweiten Widder handelt.
- source_word: ሰደዶ
  choice: verfolgte
  rationale: Das Verb bezeichnet eine aktive Verfolgung; „verfolgte“ ist präzise, natürlich und dem würdigen Erzählton angemessen.
- source_word: ተንሥአ
  choice: erhob sich
  rationale: Die Form bezeichnet das Aufstehen oder Sich-Erheben und wird als eigene Handlung vor der Flucht beibehalten.
- source_word: ነፍጸ
  choice: floh
  rationale: Im Zusammenhang bezeichnet das Verb die Flucht vor dem Verfolger.
- source_word: እምቅድመ ገጹ
  choice: vor ihm
  rationale: Die wörtliche semitische Wendung „von vor seinem Angesicht“ wird in natürliches modernes Deutsch übertragen, ohne ihren Sinn als Rückzug vor dem Verfolger zu verändern.
- source_word: አክላብ
  choice: Hunde
  rationale: Der Plural bezeichnet Hunde; „Hunde“ bewahrt die Tierbildsprache ohne die zusätzliche Spezifizierung als Jagdhunde.
- source_word: አውደቅዎ
  choice: zu Fall brachten
  rationale: Die Kausativform drückt aus, dass die Hunde den Widder fallen ließen beziehungsweise niederwarfen. „Zu Fall brachten“ hält diese Bedeutung offen und klingt im Deutschen natürlich.
theological_decisions:
- issue: Bewahrung der symbolischen Tiergestalten in einer politisch aufgeladenen apokalyptischen Vision
  choice: Die Figuren werden als „Widder“ und „Hunde“ wiedergegeben, ohne sie im Haupttext mit historischen Personen oder Völkern gleichzusetzen.
  alternative: Die Tiere unmittelbar als bestimmte Herrscher oder Nationen benennen.
  rationale: Die Traumvision spricht bewusst durch eine fortlaufende Tierallegorie. Eine historische Identifizierung im Vers selbst würde Bild und Auslegung vermischen und die genuine Offenheit des Textes beseitigen.
- issue: Kontextuelle Deutung des mehrdeutigen Tiernamens ሐርጌ
  choice: Widder
  alternative: Eber
  rationale: 'Die lexikalische Mehrdeutigkeit wird durch den unmittelbaren literarischen Kontext begrenzt: Diese Tiere stehen in Beziehung zu den Schafen und entsprechen den führenden Widdern der umgebenden Vision. „Eber“ würde die dortige Bildfolge stören.'
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Erzählton. Die Satzfolge bleibt nahe am Ge’ez; die semitische Wendung „von vor seinem Angesicht“ und die Konstruktion „ich sah, bis“ werden im Haupttext behutsam idiomatisiert. Die wiederholte Bezeichnung „Widder“ wird zur Klarheit und zur Bewahrung der allegorischen Struktur nicht durch Pronomen ersetzt.
