base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/019.yaml
  text: And from it I saw the wolves[a], and they became exceedingly strong against the sheep with all their power[c][b], and the sheep cried out.
translation:
  language: de
  text: Und von dort sah ich die Wölfe[a] und wie sie mit all ihrer Macht gegen die Schafe überaus stark wurden, und die Schafe schrien auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von ihm her sah ich die Wölfe«. Das pronominale Suffix kann für sich genommen auf eine Person oder Sache zurückweisen; im Zusammenhang ist auch eine örtliche Wiedergabe wie »von dort« möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እምኔሁ
  choice: von dort
  rationale: Die Verbindung aus እም und pronominalem Suffix kann je nach Bezugswort »von ihm«, »von ihm her« oder örtlich »von dort« bedeuten. Im fortlaufenden Visionsbericht ist »von dort« natürlich, ohne einen männlichen persönlichen Bezug festzulegen.
- source_word: ርኢክዎሙ
  choice: sah ich
  rationale: Die schlichte deutsche Wiedergabe bewahrt den Stil des visionären Berichts.
- source_word: አዝእብት
  choice: die Wölfe
  rationale: Das Wort bezeichnet Wölfe und erhält den konkreten zoomorphen Bildcode der Tierapokalypse.
- source_word: አፎ
  choice: und
  rationale: In der Verbindung mit dem folgenden Verb leitet das Wort die Art beziehungsweise das Ausmaß dessen ein, was der Seher an den Wölfen wahrnimmt. Ein eigenes deutsches »wie« wäre möglich, doch die koordinierte Aussage ist hier natürlicher.
- source_word: ጸንዑ ፈድፋደ
  choice: sie wurden überaus stark
  rationale: ጸንዑ bezeichnet das Stark- oder Festwerden; ፈድፋደ verstärkt es adverbial im Sinn von »überaus«.
- source_word: ዲበ አባግዕ
  choice: gegen die Schafe
  rationale: ዲበ bedeutet häufig »auf/über«, trägt im feindlichen Zusammenhang hier aber die relationale Bedeutung »gegen«.
- source_word: በኵሉ ኃይሎሙ
  choice: mit all ihrer Macht
  rationale: Die Formulierung gibt die Gesamtheit ihrer feindlichen Kraft idiomatisch und nachdrücklich wieder.
- source_word: ወአባግዕ ጸርኁ
  choice: und die Schafe schrien auf
  rationale: Das Verb bezeichnet lautes Rufen oder Schreien. »Schrien auf« vermittelt die plötzliche Bedrängnis, ohne den Ruf ausdrücklich als Klage oder Hilferuf zu deuten.
theological_decisions:
- issue: Symbolische Tierbilder in der Tierapokalypse
  choice: Die konkrete Bezeichnung »Wölfe« und »Schafe« bleibt im Haupttext erhalten.
  alternative: Die Tiere unmittelbar als menschliche Völker, Machthaber oder Israel auslegen.
  rationale: Der Text schildert zunächst die Vision in Tierbildern. Eine deutende Ersetzung würde die apokalyptische Bildsprache auflösen und eine bestimmte Identifikation in die Übersetzung eintragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer apokalyptischer Bildsprache. Der Satzbau bleibt nahe an der parataktischen Struktur des Ge’ez, wird aber für heutige Leser flüssig formuliert.
