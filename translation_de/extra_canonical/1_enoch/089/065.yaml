- from: Und ich sah weiter, wie jene Hirten während ihrer festgesetzten Zeit[a] die Herde weideten. Sie begannen, in weit größerem Maß zu töten und zu vernichten, als ihnen befohlen worden war[b], und ließen jene Schafe in der Hand der Löwen zurück.
