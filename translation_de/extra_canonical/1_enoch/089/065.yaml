base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/065.yaml
  text: And I saw until those shepherds pastured in their season, and they began to kill and destroy much more than they had been commanded, and they abandoned those sheep into the hand of the lions.
translation:
  language: de
  text: Und ich sah, bis jene Hirten zu ihrer Zeit[a] die Herde weideten. Sie begannen, in weit größerem Maß zu töten und zu vernichten, als ihnen befohlen worden war[b], und gaben jene Schafe der Gewalt der Löwen preis.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »zu ihrer Zeit«. Gemeint ist die ihnen zugewiesene oder für ihr Wirken bestimmte Zeit.'
    reason: lexical_alternative
  - marker: b
    text: Die äthiopische Wendung bezeichnet ein Überschreiten des ihnen erteilten Befehls; sie kann wörtlicher mit »weit über ihren Befehl hinaus« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኖላዊያን
  choice: Hirten
  rationale: Bewahrt die durchgehende Bildsprache der Tierapokalypse und bezeichnet hier die eingesetzten Aufseher über die Schafe.
- source_word: ይርዐዩ
  choice: die Herde weideten
  rationale: Gibt das Verb innerhalb des Hirtenbildes natürlich wieder; das ergänzte Objekt ergibt sich unmittelbar aus dem Bildzusammenhang.
- source_word: በጊዜሁ
  choice: während ihrer festgesetzten Zeit
  rationale: Drückt sowohl den zeitlichen Rahmen als auch den möglichen Sinn einer zugewiesenen Amtszeit aus, ohne eine bestimmte theologische Deutung vorauszusetzen.
- source_word: ወአኃዙ
  choice: Sie begannen
  rationale: Das Verb leitet hier inzeptiv die folgenden Tötungs- und Vernichtungshandlungen ein.
- source_word: ይቅትሉ ወያሕጕሉ
  choice: zu töten und zu vernichten
  rationale: Erhält die zwei gesteigerten Gewaltverben, ohne das zweite als vollständige Ausrottung zu überzeichnen.
- source_word: ብዙኃ እምትእዛዞሙ
  choice: in weit größerem Maß …, als ihnen befohlen worden war
  rationale: 'Behandelt ብዙኃ mit እም entsprechend der revidierten syntaktischen Beurteilung adverbial-komparativ: Das Ausmaß ihres Handelns überschritt den erteilten Befehl.'
- source_word: ኃደጉ
  choice: ließen … zurück
  rationale: Bewahrt sowohl den Grundsinn des Zurücklassens als auch den im Kontext erkennbaren schuldhaften Charakter.
- source_word: ዝኩ አባግዐ
  choice: jene Schafe
  rationale: Erhält den demonstrativen Rückverweis auf die bestimmte, den Hirten anvertraute Herde.
- source_word: ውስተ እደ አናብስት
  choice: in der Hand der Löwen
  rationale: Bewahrt die konkrete biblisch-apokalyptische Machtformel und die spezifische Tiersymbolik der Löwen.
theological_decisions:
- issue: Handelten die Hirten innerhalb oder außerhalb der ihnen erteilten Vollmacht?
  choice: Ihr Töten und Vernichten ging in seinem Ausmaß über den erteilten Befehl hinaus.
  alternative: Sie handelten ihrem Befehl gemäß; oder nur die Zahl der Opfer, nicht die Art ihres Handelns, überschritt den Auftrag.
  rationale: Die komparative Konstruktion mit እም weist am ehesten auf eine Überschreitung hin. Die Formulierung lässt dennoch offen, was genau ursprünglich gestattet war, und bewahrt so die Spannung zwischen übertragener Vollmacht und ihrem schuldhaften Missbrauch.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Hirten- und Tierbildsprache bleibt konkret erhalten. »Und ich sah weiter« gibt die fortlaufende Visionserzählung natürlich wieder, ohne den schwerfälligen äthiopischen Übergang schematisch nachzubilden.
