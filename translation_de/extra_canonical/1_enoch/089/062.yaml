base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/062.yaml
  text: 'And all the excess and destruction that was done by the shepherds[a], the scribe wrote down: how many they destroyed by my command, and how many they destroyed of their own accord[e][d][c][b]; all the destruction of those seventy shepherds was recorded against them.'
translation:
  language: de
  text: 'Und der Schreiber schrieb alle Blindheit und Vernichtung auf, die die Hirten verursachten[a]: wie viele sie auf meinen Befehl hin vernichteten und wie viele sie auf eigene Verantwortung vernichteten[b]. Die gesamte Vernichtung durch die siebzig Hirten schrieb er ihnen zur Last.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die äthiopischen Ausdrücke sind schwierig. Gemeint sein können Blindheit beziehungsweise Blindmachen sowie gewaltsame Beseitigung, Verderben oder Vernichtung.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „auf/an ihren Köpfen“. Die Wendung kann bedeuten, dass die Taten ihnen selbst zur Verantwortung zugerechnet wurden; möglich ist auch ein Bezug auf die über sie kommende Strafe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ጽጋበ
  choice: Verblendung
  rationale: Das Substantiv bezeichnet hier wahrscheinlich das Blindmachen beziehungsweise dessen Ergebnis. „Verblendung“ bewahrt im Deutschen sowohl den Bezug zum Blindsein als auch die Möglichkeit eines verursachten Zustands.
- source_word: ሐጕለ / ያሐጕሉ / ያሐጕሎሙ
  choice: Vernichtung / vernichteten
  rationale: Die wiederholte Wurzel bezeichnet gewaltsame Beseitigung oder Verderben. Eine einheitliche Wiedergabe macht die wiederholte Abrechnung im Vers sichtbar, ohne die Bedeutung vorschnell auf Schlachtung oder Ausreißen einzuengen.
- source_word: በኖሎት
  choice: durch die Hirten
  rationale: ኖሎት ist die Pluralform zu „Hirte“; die Präposition bezeichnet hier die Handelnden. Die frühere Deutung als „Elefanten“ ist morphologisch und kontextuell nicht haltbar.
- source_word: ጻሐፍ
  choice: der Schreiber schrieb ... auf / wurde ... geschrieben
  rationale: Die Form und der Zusammenhang tragen das Motiv himmlischer Buchführung. Im ersten Satzteil wird der Schreiber natürlich als Subjekt wiedergegeben; im Schlusssatz steht der belastende Eintrag im Vordergrund.
- source_word: ሚመጠነ
  choice: wie viele
  rationale: Die wiederholte Form leitet die zahlenmäßige Erfassung der Taten ein.
- source_word: በትእዛዝየ
  choice: auf meinen Befehl hin
  rationale: Der Possessivbezug der ersten Person und die autoritative Anordnung werden ausdrücklich bewahrt.
- source_word: በርእሶሙ
  choice: auf eigene Verantwortung
  rationale: Wörtlich steht „auf/an ihren Köpfen“. Im Zusammenhang bezeichnet die Wendung wahrscheinlich die ihnen selbst zurechenbare Verantwortung; die Übersetzung vermeidet die stärkere Festlegung auf einen ausdrücklich formulierten freien Willen.
- source_word: ፯፯ ኖላዊ
  choice: die siebzig Hirten
  rationale: Die feststehende symbolische Gruppe der Tierapokalypse wird wörtlich und ohne zusätzliche Deutung bezeichnet.
- source_word: ዲቤሆሙ
  choice: ihnen zur Last
  rationale: Die Präposition bezeichnet hier wahrscheinlich einen gegen sie geführten, belastenden Eintrag und nicht bloß eine neutrale Notiz über sie.
theological_decisions:
- issue: Verhältnis von göttlichem Befehl und Verantwortung der Hirten
  choice: Der Vers unterscheidet zwischen Vernichtung auf Befehl und Vernichtung, die den Hirten selbst zugerechnet wird.
  alternative: Beide Satzteile könnten göttlich angeordnete Vernichtung beschreiben; oder „auf ihren Köpfen“ könnte unmittelbar ihre Bestrafung statt ihre eigenmächtige Tat meinen.
  rationale: Der Gegensatz zwischen በትእዛዝየ („auf meinen Befehl“) und በርእሶሙ („auf/an ihren Köpfen“) legt unterschiedliche Verantwortungsbereiche nahe. „Auf eigene Verantwortung“ bewahrt diese Spannung, ohne eine umfassende Lehre über Willensfreiheit einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache der Hirten und das Motiv himmlischer Buchführung bleiben erhalten. Die Satzstruktur wurde für natürliche deutsche Lesbarkeit leicht gegliedert; ungeklärte lexikalische und theologische Spannungen werden in den Fußnoten offengehalten.
