base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/032.yaml
  text: And that sheep that led them returned and went up upon that rock[a]; and the sheep, while their eyes were blinded, went astray from the path that he had shown them[b], but that sheep did not know it.
translation:
  language: de
  text: Und jenes Schaf, das sie geführt hatte, kehrte zurück und stieg auf jenen Felsen[a]. Die Schafe aber irrten, während ihre Augen geblendet waren[b], von dem Weg ab, den es ihnen gezeigt hatte; doch jenes Schaf wusste nichts davon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf jene Höhe/jenen Felsgrat“; das ge''ezische Wort kann eine felsige Erhebung statt eines einzelnen Felsens bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „während ihre Augen geblendet wurden“.'
    reason: grammatical_alternative
lexical_decisions:
- source_word: ገብአ
  choice: kehrte zurück
  rationale: Das Verb kann „kommen/eintreten“ bedeuten; im Erzählzusammenhang ist die Rückbewegung des führenden Schafes gemeint.
- source_word: በግዕ
  choice: Schaf
  rationale: Die allgemeine Bezeichnung wahrt die durchgehende Schafsymbolik, ohne Geschlecht oder Alter hinzuzufügen.
- source_word: ዘይመርሖሙ
  choice: das sie geführt hatte
  rationale: Die Relativkonstruktion kennzeichnet das Schaf durch seine zuvor ausgeübte Führungsrolle.
- source_word: ዐርገ
  choice: stieg auf
  rationale: Das Verb bezeichnet eine Aufwärtsbewegung und passt sachlich zur folgenden felsigen Erhebung.
- source_word: ድማኅ
  choice: Felsen
  rationale: Die konkrete Wiedergabe erhält das Bild; die mögliche Bedeutung einer felsigen Höhe wird in der Fußnote genannt.
- source_word: አባግዕ
  choice: die Schafe
  rationale: Der Plural wird unmittelbar wiedergegeben und erhält die Tierbildsprache.
- source_word: ይጸልሉ አዕይንቲሆሙ
  choice: ihre Augen geblendet waren
  rationale: Die Formulierung beschreibt einen andauernden Zustand beeinträchtigten Sehens; die mögliche verlaufende Passivbedeutung bleibt als Alternative vermerkt.
- source_word: ይስሕቱ እምፍኖት
  choice: irrten ... von dem Weg ab
  rationale: Die Wendung bewahrt sowohl die räumliche als auch die sinnbildliche Bedeutung des Abweichens.
- source_word: እንተ አርአዮሙ
  choice: den es ihnen gezeigt hatte
  rationale: Das singuläre Subjekt verweist natürlich auf das führende Schaf; „gezeigt“ gibt die Kausativbedeutung wieder.
- source_word: ኢያእመረ
  choice: wusste nichts davon
  rationale: Die Wendung drückt schlicht fehlendes Wissen beziehungsweise fehlende Wahrnehmung aus, ohne schuldhafte Nachlässigkeit zu unterstellen.
theological_decisions:
- issue: Ob die Unkenntnis des führenden Schafes als schuldhafte Nachlässigkeit zu deuten ist
  choice: doch jenes Schaf wusste nichts davon
  alternative: doch jenes Schaf bemerkte es nicht
  rationale: Der ge'ezische Text spricht von fehlendem Wissen, nicht ausdrücklich von Gleichgültigkeit oder schuldhafter Unaufmerksamkeit. Die offene Spannung bleibt daher erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Bezeichnung „jenes Schaf“ erhält die visionäre Bildsprache und macht den Wechsel zwischen dem einzelnen führenden Schaf und den übrigen Schafen deutlich.
