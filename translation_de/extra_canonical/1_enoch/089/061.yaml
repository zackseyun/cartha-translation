revisions:
- from: 'Und er rief einen anderen und sagte zu ihm: „Gib acht[a] und sieh alles, was die Hirten diesen Schafen antun; denn sie vernichten aus ihrer Mitte mehr, als ich ihnen befohlen habe.“[b]'
  to: 'Und er rief einen anderen und sagte zu ihm: „Gib acht[a] und sieh alles, was die Hirten diesen Schafen antun; denn sie vernichten mehr von ihnen, als ich ihnen befohlen habe.“[b]'
  rationale: Die einzige notwendige Änderung ersetzt die schwerfällige, potenziell missverständliche Wendung „aus ihrer Mitte mehr“ durch „mehr von ihnen“. Damit bleibt die im Geʿez durch እም + ውስተ ausgedrückte partitive Beziehung erhalten, während der deutsche Satz klar und idiomatisch wird. Die Fußnote a wird sprachlich gestrafft und vermeidet die widersprüchliche Kennzeichnung „wörtlich sinngemäß“.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:25:55Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Abfolge von Ruf, Aufforderung zur aufmerksamen Beobachtung, Handeln der Hirten an den Schafen und deren Überschreitung des erteilten Befehls zuverlässig wieder. Bei እምውስተቶሙ ist jedoch der partitive Sinn („aus/von ihrer Mitte“, also von den Schafen) im Deutschen mit „aus ihrer Mitte mehr vernichten“ syntaktisch schwer verständlich.
  naturalness: Der Ton ist modernes, würdiges Standarddeutsch. „Mehr von ihnen vernichten“ ist idiomatischer und macht eindeutig, dass das quantitative „mehr“ die aus der Herde Betroffenen bezeichnet.
  terminology: „Hirten“, „Schafe“, „Gib acht“, „sieh“ und „befohlen“ sind angemessen und wahren Bildsprache, Imperativkraft und Autoritätsgefälle. Die Fußnote soll die begrenzte Beauftragung beschreiben, ohne deren theologische Einordnung zu erweitern.
