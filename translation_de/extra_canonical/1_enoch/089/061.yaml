    rationale: Die Formulierung bildet zwar die partitive Präpositionalgruppe nach, lässt im Deutschen aber offen bzw. sperrig, was „mehr“ konkret bezeichnet. „Sie vernichten mehr von ihnen“ bewahrt den separativen/partitiven Sinn von እምውስተቶሙ und ist natürliches Deutsch.
