base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/061.yaml
  text: And he called to another and said to him[a], “Take note and see all that the shepherds are doing to these sheep[c][b]; for they are destroying among them more than I commanded them.”
translation:
  language: de
  text: 'Und er rief einen anderen und sagte zu ihm: „Gib acht[a] und sieh alles, was die Hirten diesen Schafen antun; denn sie vernichten mehr von ihnen, als ich ihnen befohlen habe.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Pass aufmerksam auf“; die Aufforderung verlangt aufmerksame Beobachtung.'
    reason: lexical_alternative
  - marker: b
    text: Die Formulierung besagt, dass den Hirten ein begrenzter Auftrag erteilt worden war, den sie bei ihrem vernichtenden Handeln überschritten.
    reason: theological_tension
lexical_decisions:
- source_word: ለካልእ ጸውዐ
  choice: er rief einen anderen
  rationale: ካልእ bezeichnet hier eine weitere, nicht näher bestimmte Gestalt; „einen anderen“ wahrt diese Unbestimmtheit. ጸውዐ wird schlicht mit „rief“ wiedergegeben.
- source_word: ለቡ ወርኢ
  choice: Gib acht und sieh
  rationale: ለቡ fordert zu aufmerksamer innerer Hinwendung auf; „Gib acht“ ist natürlich und würdevoll. Das konkrete Verb des Sehens bleibt daneben ausdrücklich erhalten.
- source_word: ኵሎ ዘይገብሩ ኖሎት
  choice: alles, was die Hirten … antun
  rationale: Die Gesamtheit der Handlungen wird mit „alles, was“ bewahrt. „Hirten“ erhält die durchgehende Bildsprache der Tierapokalypse; „antun“ verbindet sich im Deutschen idiomatisch mit dem betroffenen Objekt und lässt den schädigenden Kontext erkennen.
- source_word: ዲበ እሉ አባግዕ
  choice: diesen Schafen antun
  rationale: ዲበ kann räumlich „auf/über“ heißen, bezeichnet hier aber die gegen die Schafe gerichtete Einwirkung. Die deutsche Konstruktion „jemandem etwas antun“ gibt dies natürlich wieder, ohne die Präposition übermäßig zu präzisieren.
- source_word: ያሐጕሉ
  choice: sie vernichten
  rationale: Das Verb bezeichnet verderbendes oder vernichtendes Handeln. „Vernichten“ bleibt breit genug und legt sich nicht ausschließlich auf unmittelbares Töten fest.
- source_word: እምውስተቶሙ
  choice: aus ihrer Mitte
  rationale: Die Verbindung von እም („aus/von“) und ውስተ („inmitten“) trägt einen partitiv-separativen Sinn. „Aus ihrer Mitte“ bewahrt diesen deutlicher als bloßes „unter ihnen“.
- source_word: ፈድፋደ እምዘ አዘዝክዎሙ
  choice: mehr, als ich ihnen befohlen habe
  rationale: Die Vergleichsformulierung zeigt, dass die Hirten das Maß ihres Auftrags überschreiten. „Befohlen“ erhält das Autoritäts- und Gerichtsgefälle der Vision.
theological_decisions:
- issue: Art der Verfehlung der Hirten
  choice: Die Hirten überschreiten bei ihrem vernichtenden Handeln das ihnen befohlene Maß.
  alternative: Die Hirten hätten lediglich ihre Schutzpflicht vernachlässigt oder die Aussage beträfe nur eine wertfreie zahlenmäßige Abweichung.
  rationale: Das Vernichtungsverb zusammen mit „mehr, als ich ihnen befohlen habe“ bezeichnet schuldhafte Überschreitung. Zugleich bleibt die spannungsvolle Aussage bestehen, dass ihnen offenbar ein begrenzter Auftrag erteilt worden war; diese Spannung wird nicht dogmatisch aufgelöst.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem visionärem Erzählton. Die Schaf-und-Hirten-Bildsprache bleibt unverändert; weder kirchliche Amtssprache noch eine konfessionelle Deutung wird eingetragen.
