base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/069.yaml
  text: And beyond their prescribed measure they kept killing and destroying[d][c][b][a], and I was weeping and crying out because of those sheep.
translation:
  language: de
  text: Und über das ihnen vorgeschriebene Maß hinaus töteten und vernichteten sie immer weiter, und ich weinte und schrie wegen jener Schafe laut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ፈድፋደ እምሥርዓቶሙ
  choice: über das ihnen vorgeschriebene Maß hinaus
  rationale: Die Wendung bezeichnet ein Überschreiten einer festgesetzten Ordnung oder Vorgabe. „Vorgeschriebenes Maß“ bewahrt sowohl den quantitativen Bezug als auch den verbindlichen Charakter von ሥርዓት.
- source_word: ይቀትል
  choice: töteten sie immer weiter
  rationale: Der Imperfekt lässt im visionären Erzählzusammenhang eine fortdauernde beziehungsweise wiederholte Handlung erkennen.
- source_word: ያሐጕል
  choice: vernichteten
  rationale: Das schwer zu bestimmende Verb bezeichnet ruinöses oder zerstörerisches Handeln; „vernichten“ wahrt die Gewalt der Aussage, ohne sie unnötig zu präzisieren.
- source_word: እንዘ እብኪ ወአዐውዩ
  choice: ich weinte und schrie laut
  rationale: እንዘ mit den folgenden Imperfektformen bildet hier eine gleichzeitige, andauernde Handlung. Es enthält keinen Ausdruck für Schlaf. „Schrie laut“ gibt den hörbaren Klageruf wieder.
- source_word: አባግዕ
  choice: Schafe
  rationale: Die Tiermetaphorik der Vision bleibt erhalten und wird nicht im Haupttext als Israel oder als Menschen ausgedeutet.
theological_decisions:
- issue: Deutung der Schafe als Israel beziehungsweise Juda
  choice: Die Bildbezeichnung „Schafe“ bleibt im Text stehen.
  alternative: „jene Menschen“ oder „Israel“
  rationale: Die apokalyptische Bildsprache soll nicht durch eine ausdrückliche Identifizierung ihres möglichen Bezugs ersetzt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die koordinierte Satzstruktur des Ausgangstextes bleibt erkennbar; „immer weiter“ vermittelt den fortdauernden Charakter des Tötens in natürlicher deutscher Sprache.
