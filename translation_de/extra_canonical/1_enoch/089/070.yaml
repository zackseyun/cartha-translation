base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/070.yaml
  text: And thus in the vision I saw that the one who wrote wrote down every one that was destroyed by those shepherds[a], day by day, and he brought up and laid down and showed that whole book to the Lord of the sheep, all that they had done, and all that each one of them had made away with[d][c][b], and all that they had given over to destruction.
translation:
  language: de
  text: 'Und so sah ich in der Vision, wie der Schreibende Tag für Tag jeden aufschrieb, der durch jene Hirten vernichtet wurde.[a] Dann brachte er jenes ganze Buch hinauf, legte es nieder und zeigte es dem Herrn der Schafe: alles, was sie getan hatten, alles, was jeder von ihnen beiseitegetan hatte,[b] und alles, was sie der Vernichtung preisgegeben hatten.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Satzgliederung ist nicht völlig sicher. Möglich ist auch: »jeden von jenen Hirten, der vernichtet wurde«.'
    reason: textual_ambiguity
  - marker: b
    text: Das zugrunde liegende äthiopische Wort ist schwierig; gemeint sein kann, was jeder Hirte entfernt oder aus der Herde verschwinden ließ.
    reason: lexical_alternative
  - marker: c
    text: Das wiederholte Schreiben und Vorlegen zeichnet das Bild eines himmlischen Verzeichnisses der Taten der Hirten vor dem Herrn der Schafe.
    reason: literary_context
lexical_decisions:
- source_word: ርኢክዎ
  choice: sah ich
  rationale: Das übliche Visionsverb wird in natürlichem, nicht archaisierendem Deutsch wiedergegeben.
- source_word: ዘይጽሕፍ … ይጽሕፍ
  choice: der Schreibende … aufschrieb
  rationale: Bewahrt die Wiederholung des Schreibmotivs und bezeichnet die Gestalt nach ihrer Tätigkeit, ohne sie ausdrücklich als Schreiber oder Engel zu identifizieren.
- source_word: ፷ዘይትሐጐል፡ እምነ፡ ዝኩ፡ ኖላዊያን
  choice: jeden …, der durch jene Hirten vernichtet wurde
  rationale: Der Personalsinn von »jeden« passt zum Herdenbild; die Präposition ist im Zusammenhang am plausibelsten instrumental auf die Hirten bezogen, während eine alternative Gliederung in der Fußnote erhalten bleibt.
- source_word: በኵሉ፡ ዕለት
  choice: Tag für Tag
  rationale: Gibt die fortlaufende, einzeln geführte Aufzeichnung idiomatisch wieder.
- source_word: ያዓርግ
  choice: brachte … hinauf
  rationale: Die Kausativform bezeichnet das Hinaufbringen, nicht bloß das Hinaufgehen.
- source_word: ያዓርፍ
  choice: legte es nieder
  rationale: Bewahrt die konkrete Handlung des Niederlegens beziehungsweise Vorlegens, ohne sie vorschnell zu abstrahieren.
- source_word: ያርኢ፡ ኵሎ፡ ኪያሁ፡ መጽሐፈ
  choice: zeigte … jenes ganze Buch
  rationale: Das ausdrücklich genannte Buch bleibt als direktes Objekt sichtbar; »ganz« gibt ኵሎ wieder.
- source_word: ለእግዚአ፡ አባግዕ
  choice: dem Herrn der Schafe
  rationale: Die zentrale Gottesbezeichnung innerhalb der Tierallegorie wird direkt übersetzt.
- source_word: ዘአእተተ
  choice: beiseitegeschafft hatte
  rationale: Die schwierige Form bezeichnet wahrscheinlich ein Entfernen oder Verschwindenlassen. Die deutsche Wahl bleibt weiter als eine eindeutige Tötungsaussage.
- source_word: ዘመጠዉ፡ ለሐጕል
  choice: der Vernichtung preisgegeben hatten
  rationale: Gibt die Übergabe beziehungsweise Auslieferung zum Verderben wieder und unterscheidet sie vom vorhergehenden schwierigen Verb.
theological_decisions:
- issue: Identität der schreibenden Gestalt
  choice: die Gestalt wird nur als »der Schreibende« bezeichnet
  alternative: ein himmlischer Schreiber oder ausdrücklich ein Engel
  rationale: Der Text kennzeichnet sie durch Schreiben und Buchvorlage, nennt aber weder Amt noch Wesen ausdrücklich.
- issue: Bedeutung des »Herrn der Schafe«
  choice: der allegorische Titel bleibt unverändert erhalten
  alternative: erklärende Wiedergabe als Gott oder göttlicher Richter
  rationale: Die Tierallegorie selbst soll sprechen; eine erklärende Identifikation im Haupttext würde das Bild auflösen.
- issue: Gerichts- und Buchmotiv
  choice: konkretes Hinaufbringen, Niederlegen und Zeigen des Buches
  alternative: abstrahierende Wiedergabe als Bericht vor dem göttlichen Gericht
  rationale: Die einzelnen visionären Handlungen werden erhalten, ohne ihre theologische Funktion zu verflachen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung des Schreibverbs und die konkreten Bewegungen des Buches bleiben erhalten; unnötige Archaismen und eine überdeutliche dogmatische Identifikation der Figuren werden vermieden.
