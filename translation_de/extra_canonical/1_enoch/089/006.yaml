  to: Und jener Mast[a] sank ins Wasser, und alle Stiere, Elefanten, Kamele und Esel wurden von der Erde verschlungen, ebenso alle Tiere. Ich konnte sie nicht sehen, und sie konnten nicht herauskommen, sondern kamen um und versanken im See.[b]
  rationale: 'Die Korrektur folgt vorrangig dem geʿezischen Wortlaut: Der Gegenstand wird als „Mast“ wiedergegeben und sinkt ins Wasser; die Tiere werden von der Erde verschlungen. Die problematische, wahrscheinlich fehlerhaft überlieferte Form wird weiterhin kontextgerecht als Aussage des Sehers verstanden: „Ich konnte sie nicht sehen.“ Der Schluss wird konkret als Versinken in einen See wiedergegeben; spekulative Zuspitzungen zu „Tiefen“ oder „Abgrund“ entfallen.'
