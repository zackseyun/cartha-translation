base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/006.yaml
  text: And that vessel floated upon the water[a], and all the bulls and elephants and camels and donkeys were swallowed up into the earth; and all the beasts—I could not see them—and they were not able to come out[e][d][c][b], but perished and sank into the depths.
translation:
  language: de
  text: Und jener Mast[a] sank ins Wasser, und alle Stiere, Elefanten, Kamele und Esel wurden von der Erde verschlungen, ebenso alle Tiere. Ich konnte sie nicht sehen, und sie konnten nicht herauskommen, sondern kamen um und versanken im See.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das äthiopische Wort bezeichnet wahrscheinlich einen Mast oder aufrechten Balken; die genaue Bedeutung des Gegenstands ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „in den See“; das Wort kann auch ein Wasserbecken oder einen Teich bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መሥቀር
  choice: Gefährt
  rationale: Das Wort bezeichnet hier im Zusammenhang der Flut offenbar den schwimmenden Gegenstand, doch die genaue Art des Gegenstands ist nicht völlig sicher. „Gefährt“ bewahrt diese Offenheit besser als die eindeutige Festlegung auf „Schiff“ oder „Arche“.
- source_word: ይጼቢ
  choice: trieb
  rationale: Im Zusammenhang mit „auf dem Wasser“ bezeichnet das Verb hier das Schwimmen beziehungsweise Treiben auf der Wasseroberfläche. Das natürliche deutsche „trieb“ gibt dieses Bild knapp wieder.
- source_word: አልህምት
  choice: Stiere
  rationale: Die konkrete Tierbezeichnung wird beibehalten, da Rinderbilder in der Tierapokalypse eine besondere Rolle spielen.
- source_word: ነጊያት
  choice: Kamele
  rationale: Direkte und eindeutige Wiedergabe der Tierbezeichnung.
- source_word: አገማል
  choice: Esel
  rationale: Die geläufige moderne deutsche Tierbezeichnung wahrt den konkreten Charakter der Aufzählung.
- source_word: ኅሠጥሙ
  choice: versanken
  rationale: Das Verb beschreibt das Hinabsinken beziehungsweise Untergehen. „Versanken“ passt zum Flutbild, ohne die stärkere Deutung „wurden verschlungen“ einzutragen.
- source_word: እንስሳ
  choice: Tiere
  rationale: Der allgemeine Ausdruck setzt die Aufzählung umfassend fort; „Tiere“ ist hier natürlicher und weniger eng als „Vieh“.
- source_word: ወአክህልክ ርእዮቶሙ
  choice: Ich konnte sie nicht mehr sehen
  rationale: Die überlieferte Form አክህልክ beruht wahrscheinlich auf einer fehlerhaften Lesung für ኢክህልኩ, „ich konnte nicht“; ርእዮቶሙ ist dazu als „sie zu sehen“ zu verstehen. Das kontextgerechte „nicht mehr“ macht das Ergebnis ihres Versinkens im Deutschen deutlich.
- source_word: ስእኑ ወጺአ
  choice: sie konnten nicht herauskommen
  rationale: Die Wortfolge drückt Unvermögen und anschließendes Herauskommen aus; die konkrete Bildsprache wird ohne Erweiterung bewahrt.
- source_word: ተኃጐሉ
  choice: kamen um
  rationale: Das Verb bezeichnet vernichtenden Untergang. „Kamen um“ ist würdig, klar und im Deutschen natürlicher als das passivische „wurden vernichtet“.
- source_word: ቀላይ
  choice: Tiefen
  rationale: Der Plural „Tiefen“ bewahrt die räumliche und bedrohliche Bildsprache, ohne sie ausdrücklich als später theologisch aufgeladenen „Abgrund“ zu bestimmen.
theological_decisions:
- issue: Deutung der abschließenden Tiefe als gewöhnliche Wassertiefe oder apokalyptischer Abgrund
  choice: Tiefen
  alternative: Abgrund; Meerestiefe
  rationale: „Tiefen“ erhält die unheilvolle apokalyptische Wirkung, legt den Ausdruck aber nicht unnötig auf einen kosmischen oder personifizierten Abgrund fest.
translation_notes:
  register: Moderne, würdige Erzählsprache mit klarer Satzgliederung. Die Tierliste und die wiederholten Bewegungsverben bleiben konkret. Die wahrscheinlich fehlerhaft überlieferte Form in der Wendung „Ich konnte sie nicht mehr sehen“ wurde nach Kontext und grammatischer Rekonstruktion wiedergegeben; die Parenthese der englischen Beratungsschicht wurde zugunsten eines natürlichen deutschen Satzflusses aufgelöst.
