  source_fidelity: 'Die Fassung gibt die zentrale Abfolge zutreffend wieder: ein Schaf ist den Wölfen entkommen; mit ihm wird über die Wölfe gesprochen; die schwierige Hör-Klausel bleibt als solche kenntlich. Die ausdrückliche Benennung der Wölfe im Schlusssatz verdeutlicht den im Ge''ez nur pronominal ausgedrückten Bezug, ohne die Aussage zu verändern.'
  naturalness: „Damit es über sie hörte“ ist im modernen Deutschen nicht idiomatisch. „Damit es von ihnen hörte“ ist die natürliche Entsprechung für ein Hören über die Wölfe. Der bisherige Wechsel zu „sodass“ macht den letzten Finalsatz zudem unnötig zu einer Folgewirkung.
  terminology: „Schaf“, „Wölfe“ und „bedrängen“ sind als konsistente, zurückhaltende Wiedergaben der Tierbildsprache und des feindseligen Handelns geeignet. „Rief“ ist im würdevollen Erzählregister möglich.
