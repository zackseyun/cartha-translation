base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/017.yaml
  text: And he called that sheep which had escaped from the wolves[a], and spoke with him about the wolves, so that he might hear concerning them[d][c][b], that they might not oppress the sheep.
translation:
  language: de
  text: Und er rief jenes Schaf, das den Wölfen entkommen war, und sprach mit ihm über die Wölfe, damit es von ihnen hörte,[a] damit die Wölfe die Schafe nicht bedrängten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Wendung ist syntaktisch schwierig. Möglich ist auch: „damit es gegen sie hörte“; gemeint sein kann, dass das Schaf von den Wölfen hören oder eine gegen sie gerichtete Aussage vernehmen sollte.'
    reason: alternative_reading
lexical_decisions:
- source_word: ጸውዖ
  choice: er rief
  rationale: Das Verb bezeichnet ein Rufen oder Herbeirufen; „rief“ wahrt den schlichten Erzählstil.
- source_word: በግዕ
  choice: Schaf
  rationale: Das Wort bezeichnet hier ein einzelnes Schaf; „Schaf“ erhält die durchgehende Bildsprache der Tierapokalypse, ohne das Geschlecht unnötig festzulegen.
- source_word: ዘተኃጥአ እምአዝእብት
  choice: das den Wölfen entkommen war
  rationale: Im gegebenen Zusammenhang ist die Form als „entkommen“ und አዝእብት als „Wölfe“ zu verstehen; damit wird die frühere Fehlanalyse als Sündenformel vermieden.
- source_word: ተናገሮ በእንተ አዝእብት
  choice: sprach mit ihm über die Wölfe
  rationale: Die Wendung bezeichnet ein Gespräch mit dem Schaf über die Wölfe und lässt die genaue Funktion des Gesprächs offen.
- source_word: ከመ ይስምዕ ዲቤሆሙ
  choice: damit es über sie hörte
  rationale: Die syntaktisch schwierige Wendung wird bewusst nah am Wortlaut wiedergegeben; „über sie“ lässt sowohl ein Hören hinsichtlich der Wölfe als auch eine gegen sie gerichtete Aussage zu.
- source_word: ኢይግስስዎሙ
  choice: nicht bedrängten
  rationale: „Bedrängen“ gibt feindselige Einwirkung wieder, ohne den Grad der Gewalt durch „zerreißen“ oder „verwüsten“ vorzeitig festzulegen.
- source_word: አባግዕ
  choice: die Schafe
  rationale: Der Plural wird als „die Schafe“ wiedergegeben, um die wiederkehrende symbolische Benennung beizubehalten.
theological_decisions:
- issue: Ob das ausgesonderte Schaf moralisch gesündigt hatte oder den Wölfen entkommen war
  choice: das den Wölfen entkommen war
  alternative: das unter den Schafen gesündigt hatte
  rationale: Die Wortfolge und der erzählerische Zusammenhang sprechen für „entkommen“ und „Wölfe“. Eine ausdrückliche moralische Verfehlung würde hier auf einer fraglichen Zerlegung der Formen beruhen.
- issue: Funktion des Hörens in Bezug auf die Wölfe
  choice: damit es über sie hörte
  alternative: damit es gegen sie Zeugnis ablegte / damit es vor ihnen gewarnt wurde
  rationale: Der Ausgangstext ist syntaktisch mehrdeutig. Die Übersetzung bewahrt diese Spannung, statt eine gerichtliche Zeugenaussage oder Warnung eindeutig einzutragen.
