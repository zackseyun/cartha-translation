  register: Modernes, würdevolles Standarddeutsch. Die Tierbezeichnungen bleiben konsequent erhalten. Die schwierige Mittelwendung wird nicht dogmatisch oder erzählerisch geglättet; der Fußnotenmarker [a] steht unmittelbar bei der betreffenden Klausel.
