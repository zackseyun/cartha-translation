  to: Und die Hirten und ihre Gefährten übergaben jene Schafe allen wilden Tieren der Wüste, damit sie sie verschlangen. Und jedes zu seiner Zeit wurden sie alle der Zahl nach ausgeliefert – sechzig von ihnen[a]. Für die übrigen wurde im Buch aufgeschrieben, wie viele von ihnen zugrunde gingen.[b]
