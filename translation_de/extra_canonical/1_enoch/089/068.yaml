- source_word: እእኩ አባግዕ
  choice: jene Schafe
  rationale: Direkte und im Zusammenhang der Tierapokalypse natürliche Wiedergabe.
- source_word: አራዊተ ገዳም
  choice: allen wilden Tieren der Wüste
  rationale: Bewahrt das konkrete, bedrohliche Bild der wilden Tiere aus unbewohntem Gebiet.
- source_word: ከመ ይብልዕዎሙ
  choice: damit sie sie verschlangen
  rationale: Gibt den Zweck der Übergabe und die räuberische Gewalt des Tierbildes wieder.
- source_word: በጊዜሁ
  choice: jedes zu seiner Zeit
  rationale: Drückt die verteilte beziehungsweise zeitlich zugewiesene Auslieferung aus, ohne ausdrücklich eine göttliche Festsetzung hinzuzufügen.
- source_word: በኍልቍ
  choice: nach ihrer Zahl
  rationale: Gibt den Gedanken einer zahlenmäßigen Abrechnung in verständlichem modernem Deutsch wieder.
- source_word: ፷፻ እምኔሆሙ
  choice: sechzig von ihnen
  rationale: Folgt vorsichtig der im vorliegenden Textzeugen erkennbaren und in der Konsultationsschicht übernommenen Lesung, kennzeichnet die unsichere Zahlenüberlieferung jedoch in einer Fußnote.
- source_word: ለካልኡ በመጽሐፍ ይጸሐፍ ሚመጠነ ያሐጕል እምኔሆሙ
  choice: Für die übrigen wurde im Buch aufgeschrieben, wie viele von ihnen zugrunde gingen
  rationale: Erhält das Motiv der schriftlichen zahlenmäßigen Rechenschaft und formuliert den schwierigen Satz in natürlichem Deutsch.
