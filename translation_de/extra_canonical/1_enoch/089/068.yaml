  choice: Die Gestalten bleiben im Haupttext schlicht „Hirten“.
  alternative: Sie ausdrücklich als Engel, Aufseher oder fremde Herrscher bezeichnen.
  rationale: Die symbolische Offenheit der Tierapokalypse soll nicht durch eine bestimmte historische oder theologische Deutung aufgehoben werden.
- issue: Bedeutung der gezählten und im Buch verzeichneten Vernichtung
  choice: Der Text beschreibt Übergabe, Zählung und schriftliche Erfassung, ohne deren handelndes Subjekt oder dogmatische Bedeutung auszudeuten.
  alternative: Die Vorgänge ausdrücklich als göttliches Gericht oder als bloße Zulassung bezeichnen.
  rationale: Die Bildsprache legt Rechenschaft und Gericht nahe, nennt diese Deutung in diesem Vers aber nicht ausdrücklich.
