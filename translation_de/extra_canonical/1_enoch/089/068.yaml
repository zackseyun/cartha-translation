base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/068.yaml
  text: And the shepherds and their companions handed over those sheep to all the wild beasts of the desert[a], so that they might devour them; and all of them, each in its time, was delivered over by number—sixty from among them—while the record of the others was written down in the book[d][c][b], how many were destroyed from among them.
translation:
  language: de
  text: Und die Hirten und ihre Gefährten übergaben jene Schafe allen wilden Tieren der Wüste, damit sie sie verschlangen. Und jedes zu seiner Zeit wurden sie alle der Zahl nach ausgeliefert – sechzig von ihnen[a]. Für die übrigen wurde im Buch aufgeschrieben, wie viele von ihnen zugrunde gingen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Zahl und die sie umgebende Abrechnungssprache sind in diesem Textzeugen schwer zu bestimmen. Die vorliegende Lesung gibt „sechzig“ wieder; möglicherweise ist die Zahlenangabe verderbt oder anders zu verstehen. Sicher ist vor allem, dass die Ausgelieferten gezählt wurden.
    reason: textual_variant
  - marker: b
    text: Am Ende des überlieferten Wortlauts werden die Worte „für die übrigen im Buch“ nochmals wiederholt. Diese Wiederholung wird im Haupttext nicht nochmals übersetzt.
    reason: textual_variant
