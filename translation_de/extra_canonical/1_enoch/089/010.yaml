base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/089/010.yaml
  text: 'And they began to bring forth the beasts of the field and the birds[a]; and from among them there came forth every kind of the nations: lions, leopards, wolves, dogs, hyenas, wild boars, foxes, swine, falcons, vultures, kites, eagles, and ravens[c][b]; and in their midst a white bull was born.'
translation:
  language: de
  text: 'Und sie begannen, die Tiere des Feldes und die Vögel hervorzubringen. Aus ihnen gingen Völker jeder Art hervor[a]: Löwen, Leoparden, Wölfe, Hunde, Hyänen, Wildschweine, Füchse, Hasen, Schweine, Falken, Geier, Milane, Adler und Raben[b]. Und mitten unter ihnen wurde ein weißer Stier geboren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die zugrunde liegende Wendung ist schwierig. Möglich sind auch allgemeinere Wiedergaben wie „Völker aller Arten“ oder „jede Klasse von Völkern“; das Wort für „Völker/Nationen“ steht jedoch ausdrücklich im äthiopischen Text.
    reason: lexical_alternative
  - marker: b
    text: Die genaue Bestimmung mehrerer Tierarten ist unsicher. Unter anderem kommen bei einzelnen Bezeichnungen auch Schakale statt Hyänen oder Füchsen, Habichte statt Falken und Krähen statt Raben infrage.
    reason: lexical_alternative
lexical_decisions:
- source_word: አሐዙ፡ ይለዱ
  choice: sie begannen … hervorzubringen
  rationale: Die Wiedergabe bewahrt sowohl den Beginn des Vorgangs als auch den generativen Sinn, ohne bei den symbolischen Tieren unnötig ein biologisches Gebären festzulegen.
- source_word: አራዊተ፡ ገዳም
  choice: die Tiere des Feldes
  rationale: Die traditionelle biblische Wendung entspricht dem gehobenen visionären Register und bleibt näher an der Vorlage als das allgemeinere „Wildtiere“.
- source_word: ዘእምኵሉ፡ ኅብር፡ አሕዛብ
  choice: Völker jeder Art
  rationale: Die schwierige Wortgruppe enthält ausdrücklich das Wort für Völker/Nationen. Die Formulierung wahrt deshalb die politische und symbolische Dimension, bleibt aber im Deutschen verständlich.
- source_word: አጽባዕት
  choice: Hyänen
  rationale: Dies ist eine plausible traditionelle Bestimmung; da auch Schakale erwogen werden, wird die Unsicherheit in einer Fußnote kenntlich gemacht.
- source_word: ሐራዊ፡ ገዳም
  choice: Wildschweine
  rationale: Die Verbindung bezeichnet am ehesten wilde Schweine beziehungsweise Eber; „Wildschweine“ ist idiomatisch und umfasst die Artbezeichnung.
- source_word: ገሐያት
  choice: Hasen
  rationale: Die äthiopische Tierbezeichnung wird lexikalisch als Hasen beziehungsweise Kaninchen bestimmt; „Hasen“ entspricht der wahrscheinlichsten Identifikation.
- source_word: ላህም፡ ጸዓዳ
  choice: ein weißer Stier
  rationale: Im Zusammenhang der Tierapokalypse bezeichnet das Rind hier eine männliche Symbolgestalt. „Stier“ bewahrt die etablierte konkrete Bildsprache, während die weiße Farbe ausdrücklich erhalten bleibt.
theological_decisions:
- issue: Symbolische Zuordnung der Tierarten zu Völkern
  choice: Das in der Vorlage vorhandene Völkerwort wird ausdrücklich mit „Völker jeder Art“ wiedergegeben.
  alternative: jede Art von Tieren
  rationale: Die Passage ist innerhalb der Tierapokalypse nicht bloß zoologisch. Eine rein tierkundliche Wiedergabe würde die in der Vorlage vorhandene Völkerdimension beseitigen.
- issue: Geschlecht des weißen Rindes
  choice: weißer Stier
  alternative: weißes Rind / weiße Kuh
  rationale: „Stier“ entspricht der männlichen symbolischen Gestalt im unmittelbaren Erzählzusammenhang; die allgemeinere lexikalische Spannweite des äthiopischen Rinderwortes wird nicht zu einer zusätzlichen theologischen Deutung ausgebaut.
translation_notes:
  register: Moderne, würdige Standardsprache mit leicht biblisch-visionärem Klang. Die Satzfolge bleibt übersichtlich; die lange Tierliste wird vollständig wiedergegeben. Unklare Tierbestimmungen und die schwierige Völkerformulierung werden nicht stillschweigend vereindeutigt.
