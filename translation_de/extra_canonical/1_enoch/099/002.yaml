  naturalness: „werden sie zertreten werden“ ist im Deutschen eine unnötig schwere doppelte werden-Konstruktion. „werden sie zertreten“ ist gleichbedeutend, idiomatischer und behält die zukünftige Gerichtsankündigung. Ein Semikolon gliedert den Weheruf und die anschließende Strafankündigung klarer als ein Ausrufezeichen.
  terminology: „Wehe“, „Wort der Gerechtigkeit“, „Ordnung, die ewig besteht“, „für keine Sünder halten“ und „zertreten“ sind in modernem würdigem Standarddeutsch passend. „Ordnung“ wahrt die Offenheit von ሥርዐት gegenüber stärker normativem „Satzung“ oder „Verordnung“.
