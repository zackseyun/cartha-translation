base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/002.yaml
  text: Woe to those who pervert the word of righteousness and the eternal ordinance[a], and reckon themselves not to be sinners[c][b]; they shall be trampled upon the earth.
translation:
  language: de
  text: Wehe denen, die das Wort der Gerechtigkeit und die Ordnung, die ewig besteht, verdrehen und sich selbst für keine Sünder halten[a]; auf der Erde werden sie zertreten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Wort „Sünder“ steht in der zugrunde gelegten Ausgabe in eckigen Klammern und ist damit textkritisch unsicher. Auch die Zuordnung der Wendung „auf der Erde“ ist nicht völlig sicher; sie könnte stattdessen zum vorhergehenden Satzteil gehören.
    reason: textual_variant
lexical_decisions:
- source_word: አሌ
  choice: Wehe
  rationale: Die prophetische Weheruf-Formel und ihr Gerichtsmoment werden klar und würdig wiedergegeben.
- source_word: ይዌልጥዎሙ
  choice: verdrehen
  rationale: Das Verb bezeichnet hier das Verändern beziehungsweise Verfälschen dessen, was recht ist; „verdrehen“ bewahrt sowohl die bildhafte als auch die moralische Bedeutung.
- source_word: ለነገረ ርትዕ
  choice: das Wort der Gerechtigkeit
  rationale: ነገር kann „Wort“, „Sache“ oder „Botschaft“ bedeuten. Die gewählte Formulierung wahrt diese Offenheit weitgehend und entspricht dem feierlichen Zusammenhang.
- source_word: ሥርዐተ እንተ ለዓለም የኃልዉ
  choice: die Ordnung, die ewig besteht
  rationale: ሥርዐት kann Ordnung, Regel oder Satzung bezeichnen. Die relativische Wiedergabe bildet die ausdrückliche Aussage ihres dauernden Bestehens transparent ab.
- source_word: ወይሬስዩ ርእሶሙ ዘአኮኑ [ኃጥኣነ]
  choice: und sich selbst für keine Sünder halten
  rationale: Die reflexive Wendung bedeutet hier, dass die Betreffenden sich selbst als Nicht-Sünder ansehen; eine körperliche Deutung im Sinn von „den Kopf verdrehen“ wäre irreführend.
- source_word: ዲበ ምድር ሀለዉ ይትከየዱ
  choice: Auf der Erde werden sie zertreten werden
  rationale: Die passive Gerichtsankündigung und das konkrete Bild des Zertretens bleiben erhalten; „auf der Erde“ wird entsprechend der überlieferten Wortfolge mit dem Strafsatz verbunden.
theological_decisions:
- issue: Charakter des Weherufs
  choice: Gerichtsankündigung gegen Menschen, die Gerechtigkeit und bleibende Ordnung verfälschen
  alternative: bloße Klage über ein ethisches Fehlverhalten
  rationale: Die Weheruf-Formel und die folgende passive Strafankündigung tragen eindeutig gerichtlichen Charakter, ohne näher zu bestimmen, wer das Gericht vollzieht.
- issue: Selbsteinschätzung als Nicht-Sünder
  choice: Die Aussage bezeichnet den Anspruch der Betreffenden, keine Sünder zu sein
  alternative: Die Aussage bestätigt, dass sie tatsächlich keine Sünder waren
  rationale: Die reflexive Konstruktion spricht von ihrer eigenen Einschätzung. So bleibt die Spannung zwischen ihrem Anspruch und der angekündigten Verurteilung bestehen.
- issue: Zuordnung von „auf der Erde“
  choice: Die Ortsangabe wird mit dem Zertreten verbunden
  alternative: „keine Sünder auf der Erde“
  rationale: Die überlieferte Wortstellung erlaubt Schwierigkeiten, doch der Satzanschluss an die Gerichtsankündigung ergibt einen klaren, quellennahen Sinn. Die textliche Unsicherheit wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit der traditionellen, weiterhin verständlichen Weheruf-Formel. Die Satzstruktur bleibt eng am Ge’ez, wird jedoch so gegliedert, dass die reflexive Selbsteinschätzung und die anschließende Gerichtsankündigung im Deutschen natürlich verständlich sind.
