  naturalness: Der Text ist überwiegend klares, modernes und würdiges Standarddeutsch. „Mit ihren Geliebten werden sie kein Erbarmen haben“ ist jedoch nicht idiomatisch und kann zudem an Liebespartner statt an Personen, die ihnen lieb sind, denken lassen. Die Stellung „kein Erbarmen mit denen haben, die ihnen lieb sind“ ist natürlich und erhält die offene Referenz des Ausgangstextes.
  terminology: „Schwangeren“, „Kinder“, „Nachkommen“, „stillen“ und „Erbarmen“ passen zum apokalyptischen Register. „Denen, die ihnen lieb sind“ gibt ፍቁራኒሆሙ einschließlich der pluralischen und nicht näher eingegrenzten Beziehung ohne unnötige sexualisierte Nebenbedeutung von „Geliebte“ wieder.
