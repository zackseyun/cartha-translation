base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/005.yaml
  text: And in those days those who are pregnant will go out and cast away their children[a], and they will abandon them; and their offspring will slip from them. And while nursing, they will cast away their children and will not return to them[e][d][c][b], and they will have no mercy on their beloved ones.
translation:
  language: de
  text: Und in jenen Tagen werden die Schwangeren hinausgehen und ihre Kinder wegwerfen[a]; sie werden sie verlassen, und ihre Nachkommen werden ihnen entgleiten[b]. Noch während sie stillen[c], werden sie ihre Kinder wegwerfen und nicht zu ihnen zurückkehren; sie werden kein Erbarmen mit denen haben, die ihnen lieb sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wortfolge nach „die Schwangeren“ ist im überlieferten äthiopischen Text schwer zu deuten. Wörtlicher kann das erste Verb „hinausgehen“ heißen; im Zusammenhang wurden auch Deutungen wie „hervorbringen“ oder eine vorzeitige Geburt erwogen.
    reason: textual_variant
  - marker: b
    text: Das Bild kann auf eine Fehlgeburt oder auf den Verlust beziehungsweise die gewaltsame Preisgabe der Kinder bezogen werden.
    reason: translation_ambiguity
  - marker: c
    text: Das äthiopische Verb bezeichnet hier das Saugen oder Stillen, nicht das Zuschauen.
    reason: lexical_clarification
lexical_decisions:
- source_word: በአማንቱ፡ መዋዕል
  choice: in jenen Tagen
  rationale: Bewahrt die geläufige apokalyptisch-prophetische Zeitformel in würdigem, natürlichem Deutsch.
- source_word: እለ፡ ይጼንሱ
  choice: die Schwangeren
  rationale: Der Ausdruck bezeichnet hier angesichts der folgenden Geburts- und Kindermotive diejenigen, die schwanger sind; die substantivische Form ist im Deutschen knapp und verständlich.
- source_word: ይወፅኡ
  choice: hinausgehen
  rationale: Gibt den gewöhnlichen Sinn des Verbs wieder, ohne die textlich schwierige Folge durch eine ungesicherte Deutung wie „hervorbringen“ oder „ergreifen“ zu glätten.
- source_word: ይመሥጡ፡ ደቂቆሙ / ይገድፍዎሙ
  choice: ihre Kinder wegwerfen / sie verlassen
  rationale: Die Wiedergabe erhält die harte Bildsprache der Verstoßung und bildet zugleich die aufeinanderfolgenden Verben unterscheidbar ab.
- source_word: ይደህፁ፡ ውሉዶሙ
  choice: ihre Nachkommen werden ihnen entgleiten
  rationale: Bewahrt das Bild eines unwillkürlichen Entgleitens und lässt offen, ob konkret an Fehlgeburt, Verlust oder gewaltsame Preisgabe gedacht ist.
- source_word: እንዘ፡ ይጠብዉ
  choice: noch während sie stillen
  rationale: Das Verb bezeichnet Saugen beziehungsweise Stillen; „noch“ verdeutlicht idiomatisch den schockierenden zeitlichen Gegensatz, ohne die Handlung umzudeuten.
- source_word: ኢይገብኡ፡ ኀቤሆሙ
  choice: nicht zu ihnen zurückkehren
  rationale: Gibt sowohl die Bewegung als auch den Beziehungsabbruch nach dem Verlassen natürlich wieder.
- source_word: ኢይምሕርዎሙ፡ ለፍቁራኒሆሙ
  choice: mit ihren Geliebten werden sie kein Erbarmen haben
  rationale: Erhält den Kontrast zwischen natürlicher Zuneigung und verweigertem Erbarmen. „Geliebte“ lässt den genauen familiären Bezug offen.
theological_decisions:
- issue: Allgemeine gesellschaftliche Gewalttat oder Zusammenbruch familiären Erbarmens im Gericht
  choice: Die Übersetzung stellt die Preisgabe der eigenen Kinder und Geliebten in den Vordergrund.
  alternative: Eine allgemeinere Schilderung gesetzloser Gewalt oder ausschließlich eine Szene von Fehlgeburt und Kindsaussetzung.
  rationale: Die wiederholten Hinweise auf Kinder, Stillen, Rückkehr und Geliebte sprechen vor allem für den Zusammenbruch engster Bindungen innerhalb einer apokalyptischen Gerichtsschilderung; die genaue Art einzelner Vorgänge bleibt jedoch offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit apokalyptischem Ernst. Die harten Wiederholungen von „Kinder“ und „wegwerfen“ bleiben bewusst stehen. Unsichere Einzelheiten werden nicht konfessionell oder psychologisch ausgedeutet, sondern in Fußnoten offengelegt.
