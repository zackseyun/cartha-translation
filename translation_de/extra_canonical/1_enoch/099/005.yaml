  to: Und in jenen Tagen werden die Schwangeren hinausgehen und ihre Kinder wegwerfen[a]; sie werden sie verlassen, und ihre Nachkommen werden ihnen entgleiten[b]. Noch während sie stillen[c], werden sie ihre Kinder wegwerfen und nicht zu ihnen zurückkehren; sie werden kein Erbarmen mit denen haben, die ihnen lieb sind.
