base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/011.yaml
  text: Woe to you who spread evil to your neighbors[c][b][a], for by your neighbors you will be slain.
translation:
  language: de
  text: Wehe euch, die ihr Böses gegen eure Nächsten verbreitet[a]; denn von euren Nächsten werdet ihr getötet werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung kann auch „mit euren Gefährten“ oder „durch eure Gefährten“ verstanden werden.
    reason: Die ge’ezische Präposition kann hier zielgerichtet, begleitend oder instrumental aufgefasst werden.
  - marker: b
    text: Das Ge’ez wiederholt wahrscheinlich den Begriff für „Nächste“ beziehungsweise „Gefährten“ aus dem ersten Satzteil; auch „durch Gefährten“ ist möglich.
    reason: Die Wiederholung kann eine entsprechende Vergeltung hervorheben; die genaue Bedeutungsnuance des Begriffs bleibt offen.
lexical_decisions:
- source_word: እሌ፡ ለክሙ
  choice: Wehe euch
  rationale: Die feste prophetische Weheruf-Formel wird in natürlichem, würdigem Deutsch wiedergegeben.
- source_word: እለ፡ ትሰፍሕዋ፡ ለእኩይ
  choice: die ihr Böses … verbreitet
  rationale: Das Verb bezeichnet ein Ausbreiten oder Ausweiten; „verbreitet“ bewahrt dieses Bild und klingt im Deutschen natürlich.
- source_word: በቢጽክሙ
  choice: gegen eure Nächsten
  rationale: 'Die Präposition wird hier zielgerichtet verstanden: Das Böse richtet sich gegen die Nächsten. Eine begleitende oder instrumentale Deutung bleibt grammatisch möglich und wird in der Fußnote genannt.'
- source_word: እስመ
  choice: denn
  rationale: Leitet die Begründung beziehungsweise die entsprechende Vergeltungsankündigung ein.
- source_word: በቢጸል
  choice: durch Nächste
  rationale: Der vorgelegte ge’ezische Text wird ohne stillschweigende Emendation übersetzt. Die Form wird als instrumentale Wendung mit dem Wortfeld „Nächster/Gefährte“ verstanden; die auffällige Lesart und die mögliche Lesung „in der Scheol“ werden transparent vermerkt.
- source_word: ትትቀተሉ
  choice: werdet ihr getötet werden
  rationale: Gibt die passive zukünftige Gerichtsankündigung klar und würdig wieder, ohne das Verb unnötig auszuschmücken.
theological_decisions:
- issue: Art der Vergeltung
  choice: 'Der Haupttext lässt eine entsprechende Vergeltung erkennen: Wer gegen Nächste Böses verbreitet, wird durch Nächste getötet.'
  alternative: Bei der möglichen Lesung በሲኦል kündigt der Vers stattdessen an, dass die Angeredeten „in der Scheol“ getötet werden.
  rationale: Die im bereitgestellten Quelltext tatsächlich bezeugte Form wird im Haupttext respektiert; die aufgrund der OCR-Herkunft und der Editionsüberlieferung ernst zu nehmende Alternative wird nicht verschwiegen.
translation_notes:
  register: Moderner, verständlicher Standarddeutsch-Stil mit dem würdevollen Ton eines apokalyptischen Weherufs. Die ungewöhnliche Formulierung „durch Nächste“ bleibt bewusst quellennah und wird durch eine Fußnote abgesichert.
