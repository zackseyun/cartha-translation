base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/001.yaml
  text: 'Woe to you who do wickedness[a], and who praise and honor the word of falsehood: you will perish[b], and no good life will be yours.'
translation:
  language: de
  text: Wehe euch, die ihr Böses tut und die Lügenrede[a] lobt und ehrt! Ihr werdet zugrunde gehen, und kein gutes Leben wird euch zuteilwerden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Wort der Lüge«, »die falsche Rede« oder »die falsche Sache«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Wehe euch
  rationale: Bewahrt die prophetische Weheformel und ihren gerichtlichen Ernst in natürlichem Deutsch.
- source_word: እለ፡ ትገብሩ፡ ርሰናናተ
  choice: die ihr Böses tut
  rationale: Gibt die aktive Ausübung des Bösen wieder, ohne die genaue Bedeutung des Nomens unnötig auf »Gesetzlosigkeit« festzulegen.
- source_word: ወበነገረ፡ ሐሰት
  choice: die Lügenrede
  rationale: Das singularische ነገረ kann »Wort«, »Rede« oder »Sache« bedeuten. »Lügenrede« wahrt den Singular und klingt im Zusammenhang mit Loben und Ehren natürlich.
- source_word: ትሴብሑ፡ ወታከብሩ
  choice: lobt und ehrt
  rationale: Bewahrt das verstärkende Begriffspaar der öffentlichen Anerkennung.
- source_word: ተሐጕልክሙ
  choice: ihr werdet zugrunde gehen
  rationale: Gibt die angekündigte Vernichtung bzw. den Untergang direkt und idiomatisch wieder, ohne ausdrücklich einen handelnden Urheber einzutragen.
- source_word: ወአልብክሙ፡ ሕይወተ፡ ሠናይተ
  choice: kein gutes Leben wird euch zuteilwerden
  rationale: Bewahrt die Verneinung des Besitzes bzw. Anteils an einem guten Leben in würdigem, verständlichem Deutsch.
theological_decisions:
- issue: Bedeutung des entzogenen »guten Lebens«
  choice: Die Formulierung bleibt als »gutes Leben« offen und bezeichnet ein verweigertes heilvolles bzw. gesegnetes Leben.
  alternative: Nur irdischer Wohlstand oder ausdrücklich der vollständige Verlust des Lebens.
  rationale: Der apokalyptisch-ethische Zusammenhang legt mehr als bloßen Wohlstand nahe, doch der Wortlaut bestimmt weder ausschließlich diesseitige Verhältnisse noch eine ausgearbeitete Jenseitslehre.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die prophetische Weheformel und der parallele Rhythmus bleiben erhalten; die Mehrdeutigkeit von ነገር wird durch eine Fußnote kenntlich gemacht.
