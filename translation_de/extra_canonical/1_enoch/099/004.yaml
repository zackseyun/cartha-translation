  yaml_path: translation/extra_canonical/1_enoch/099/004.yaml
  text: In those days nations shall be thrown into confusion, and the clans of the nations shall rise up on the day of destruction.
translation:
  language: de
  text: In jenen Tagen werden die Völker in Verwirrung geraten, und die Sippen[a] der Völker werden sich am Tag der Vernichtung[b] erheben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Geschlechter“ oder „die Stämme der Völker“. Das geezische Wort kann Verwandtschaftsgruppen oder verwandte Völker bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „am Tag des Gemetzels“ oder „am Tag des Untergangs“. Die Bedeutung des letzten geezischen Wortes ist nicht eindeutig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በአማንቱ፡ መዋዕል
  choice: In jenen Tagen
  rationale: Bewahrt die geläufige apokalyptische Zeitformel und den Pluralsinn von መዋዕል.
- source_word: ይትሀወኩ
  choice: werden ... in Verwirrung geraten
  rationale: Gibt den Sinn von Unruhe und Auflösung natürlicher wieder als eine starre Passivkonstruktion, ohne die Art des Tumults näher festzulegen.
- source_word: አሕዛብ
  choice: die Völker
  rationale: Passt zum kollektiven, zwischenvölkischen Gerichtshorizont; „Heiden“ würde einen nicht ausdrücklich vorhandenen religiösen Gegensatz eintragen.
- source_word: ወይትነሥኡ
  choice: und ... werden sich ... erheben
  rationale: Bewahrt die Grundbedeutung des Aufstehens beziehungsweise Sich-Erhebens und lässt offen, ob Aufruhr, Mobilisierung oder bloßes Hervortreten gemeint ist.
- source_word: አዝማደ፡ አሕዛብ
  choice: die Sippen der Völker
  rationale: „Sippen“ bezeichnet verwandtschaftlich verbundene Gruppen und hält die mögliche Bedeutung von Geschlechtern oder Stämmen offen.
- source_word: በዕለት፡ እንተ፡ ሐጕል
  choice: am Tag der Vernichtung
  rationale: Gibt die umfassende Katastrophe des Gerichtstages wieder, ohne den Ausdruck ausschließlich auf ein Blutbad zu verengen.
theological_decisions:
- issue: Reichweite von አሕዛብ im apokalyptischen Gerichtswort
  choice: Völker im kollektiven Sinn
  alternative: Heiden; Nationen
  rationale: Der Vers schildert eine umfassende Erschütterung unter Völkern, nicht ausdrücklich einen heilsgeschichtlichen Gegensatz zwischen Juden und Nichtjuden.
- issue: Bedeutung des Sich-Erhebens der Sippen
  choice: Die Handlung bleibt als „sich erheben“ mehrdeutig.
  alternative: sich empören; zum Kampf aufbrechen; sich versammeln
  rationale: Der geezische Ausdruck bezeichnet ein Aufstehen oder Sich-Erheben, legt aber weder Revolte noch militärisches Vorgehen eindeutig fest.
- issue: Art des angekündigten Gerichtsgeschehens
  choice: Vernichtung
  alternative: Abschlachten; Verderben; Untergang
  rationale: „Vernichtung“ bewahrt die Breite des Ausdrucks; eine engere Deutung als Tötung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit apokalyptischem Ton. Die Satzstruktur bleibt quellennah, während „in Verwirrung geraten“ im Deutschen natürlicher klingt als ein schwerfälliges Passiv.
