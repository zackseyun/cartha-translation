base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/008.yaml
  text: And they will become senseless because of the madness of their heart[c][b][a], and their eyes will grow dark through the fear of their heart and through the visions of their dreams.
translation:
  language: de
  text: Und sie werden den Verstand verlieren wegen des Wahnsinns ihres Herzens, und ihre Augen werden sich verdunkeln[a] durch die Furcht ihres Herzens und durch die Gesichte ihrer Träume[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ihre Augen werden verdunkelt werden«. Das Bild kann getrübte Wahrnehmung, einen vom Schrecken verdunkelten Blick oder sinnbildlich den Verlust von Klarheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Wendung »Gesichte ihrer Träume« bewahrt sowohl die Sprache des Sehens als auch die der Träume; möglich ist auch: »was sie in ihren Träumen sehen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትረሰዑ
  choice: sie werden den Verstand verlieren
  rationale: Die passive/reflexive Form von ረሰዐ bezeichnet hier ein Verlorengehen des Verstandes bzw. ein Sinnloswerden. Die deutsche Wendung gibt dies natürlich wieder und passt zum folgenden Wahnsinn des Herzens; eine Bedeutung wie »erschrecken« wird nicht angenommen.
- source_word: እበደ
  choice: Wahnsinn
  rationale: Das Substantiv bezeichnet schwere Unvernunft oder geistige Verwirrung. »Wahnsinn« bewahrt die Schärfe des Ausdrucks besser als das mildere »Torheit«.
- source_word: ልቦሙ
  choice: ihres Herzens
  rationale: »Herz« wird als konkrete semitische Bezeichnung für Denken, Wollen und Empfinden bewahrt und nicht auf »Verstand« oder »Inneres« eingeengt.
- source_word: ይጼለሉ
  choice: werden sich verdunkeln
  rationale: Die Wiedergabe erhält das Bild des Dunkelwerdens, ohne zu entscheiden, ob körperlich getrübtes Sehen, von Schrecken geprägte Wahrnehmung oder ein sinnbildlicher Verlust an Klarheit gemeint ist.
- source_word: አዕይንቲሆሙ
  choice: ihre Augen
  rationale: Das konkrete Bild der Augen bleibt erhalten und wird nicht zum abstrakten »Sehvermögen« verflacht.
- source_word: በፍርሃተ ልቦሙ
  choice: durch die Furcht ihres Herzens
  rationale: »Durch« wahrt den möglichen kausalen oder instrumentalen Sinn der Präposition und erhält die Wiederholung von »Herz«.
- source_word: በርእየ ሕልሞሙ
  choice: durch die Gesichte ihrer Träume
  rationale: »Gesichte« bewahrt sowohl die Sprache des Sehens als auch die Traumsprache. Die leicht gehobene Form passt zum apokalyptischen Register und vermeidet die Reduktion auf bloße »Träume«.
theological_decisions:
- issue: Art der beschriebenen Heimsuchung
  choice: Der Vers schildert den Verlust des Verstandes und eine verdunkelte Wahrnehmung als mit innerem Wahnsinn, Furcht und Traumgesichten verbundene Folgen, ohne deren genaue Ursache festzulegen.
  alternative: Die Träume könnten ausdrücklich als unmittelbar von Gott gesandte Gerichtsvisionen oder ausschließlich als Auswirkungen eines schuldgeplagten Gewissens verstanden werden.
  rationale: Der ge'ezische Text nennt die Zustände und ihre Zusammenhänge, erklärt aber nicht, ob die Traumgesichte göttlich gesandt, psychisch entstanden oder beides sind. Diese Offenheit bleibt bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht gehobenem apokalyptischem Klang. Die Satzparallelen und die zweimalige Nennung des Herzens bleiben erhalten. »Gesichte« ist bewusst literarisch, aber verständlich; die Fußnote bietet eine alltagssprachlichere Alternative.
