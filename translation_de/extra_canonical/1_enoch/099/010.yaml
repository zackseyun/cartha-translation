base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/010.yaml
  text: And in those days[a], blessed are all those who accept the word of wisdom, and understand it, and do it, and follow the way of the Most High, and walk in the way of his righteousness, and do not act wickedly with those who act wickedly[d][c][b]; for they shall be saved.
translation:
  language: de
  text: Selig sind in jenen Tagen alle, die das Wort der Weisheit[a] annehmen, es verstehen, danach handeln, dem Weg des Höchsten folgen, auf dem Weg seiner Gerechtigkeit gehen und nicht zusammen mit denen, die gottlos handeln, ebenfalls gottlos handeln[b]; denn sie werden gerettet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Botschaft der Weisheit“. Das ge’ezische Wort kann „Wort“, „Sache“ oder „Botschaft“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Das wiederholte Verb bedeutet hier wahrscheinlich „gottlos handeln“. Je nach Kontext kann es auch Nuancen wie „sich verfehlen“, „verderben“ oder „zugrunde gehen“ tragen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ብፁዓን
  choice: selig
  rationale: „Selig“ bewahrt den weisheitlichen und endzeitlichen Klang des Ausdrucks besser als das rein emotionale „glücklich“.
- source_word: ይትሜጠዉ
  choice: annehmen
  rationale: Das Verb bezeichnet hier das empfangende und bejahende Aufnehmen der Weisheitsbotschaft.
- source_word: ነገረ ጥበብ
  choice: das Wort der Weisheit
  rationale: ነገር kann „Wort“, „Sache“ oder „Botschaft“ bedeuten. „Wort der Weisheit“ wahrt die knappe, gehobene Ausdrucksweise; die weitere Bedeutung wird in der Fußnote genannt.
- source_word: ያእምርዎን
  choice: verstehen
  rationale: Im Zusammenhang von Annehmen und Tun ist praktisches Verstehen gemeint, nicht bloßes Kennen.
- source_word: ይገብርዎን
  choice: danach handeln
  rationale: Die Wendung gibt den ethischen Vollzug des verstandenen Weisheitswortes natürlich wieder, ohne ihn auf bloße Erkenntnis zu reduzieren.
- source_word: ለፍኖተ ልዑል
  choice: dem Weg des Höchsten folgen
  rationale: Die Konstruktion bezeichnet den Weg des Höchsten als Gegenstand praktischer Befolgung. „Folgen“ ist im Deutschen idiomatischer als „den Weg tun“ oder „beobachten“.
- source_word: የሐውሩ በፍኖተ ጽድቅ ዚአሁ
  choice: auf dem Weg seiner Gerechtigkeit gehen
  rationale: Die traditionelle Weg- und Wandelmetaphorik sowie der theologisch gewichtige Begriff „Gerechtigkeit“ bleiben erhalten.
- source_word: ኢይረሰዑ ... እለ ይረሰዑ
  choice: nicht zusammen mit denen, die gottlos handeln, ebenfalls gottlos handeln
  rationale: Die aktive Wiederholung des Verbs wird sichtbar bewahrt. „Gottlos handeln“ bringt den moralisch-religiösen Sinn von ረሰዐ deutlicher zum Ausdruck als „verdorben werden“.
- source_word: ይድኅኑ
  choice: sie werden gerettet werden
  rationale: Das Verb bezeichnet Rettung beziehungsweise Befreiung. Die futurische Form wahrt den endzeitlichen Horizont des Verses.
theological_decisions:
- issue: Bedeutung des wiederholten Verbs ረሰዐ im Gegensatz zu Gerechtigkeit und Rettung
  choice: aktives gottloses Handeln
  alternative: sich verfehlen, verderben oder zugrunde gehen
  rationale: Der lexikalische Zusammenhang mit dem enochischen Begriff für die Gottlosen spricht für aktives gottloses Handeln. Da der Kontext zugleich Gericht und Rettung berührt, werden mögliche Nuancen von Verirrung und Verderben in der Fußnote offengehalten.
- issue: Charakter der abschließenden Rettung
  choice: offene endzeitliche Rettungsaussage
  alternative: enger bestimmte leibliche, geistliche oder soteriologische Deutung
  rationale: Der Text nennt den Gegenstand oder die genaue Art der Rettung nicht; die Übersetzung fügt daher keine konfessionelle Präzisierung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter weisheitlicher Wegmetaphorik. Die Wiederholung bei „gottlos handeln“ ist stilistisch markiert, bildet aber die rhetorische und ethische Gegenüberstellung des ge’ezischen Textes ab.
