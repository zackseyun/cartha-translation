base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/003.yaml
  text: In those days[a], you righteous, prepare yourselves to raise your prayers as a memorial, and place them as a testimony before the angels[c][b], that they may place the sin of sinners before the Most High as a memorial.
translation:
  language: de
  text: In jenen Tagen macht euch bereit, ihr Gerechten, eure Gebete zum Gedächtnis emporzuheben und sie als Zeugnis vor die Engel zu bringen, damit diese die Sünde der Sünder vor dem Höchsten zum Gedächtnis vorbringen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Verben für das Bringen beziehungsweise Vorbringen sind in der erhaltenen Transkription beschädigt. Möglich sind auch Wiedergaben wie „niederlegen“, „darlegen“ oder – nach einer anderen Deutung – „verlesen“.
    reason: textual_variant
lexical_decisions:
- source_word: በአማንቱ፡ መዋዕል
  choice: In jenen Tagen
  rationale: Bewahrt die geläufige apokalyptische Zeitformel und die konkrete Bildsprache von „Tagen“.
- source_word: ተደለዉ፡ ጻድቃን
  choice: macht euch bereit, ihr Gerechten
  rationale: Gibt den Imperativ der zweiten Person Plural und den Vokativ wieder; die reflexive deutsche Form klingt natürlich.
- source_word: ከመ፡ ትንሥኡ፡ ጸሎታቲከሙ
  choice: eure Gebete … emporzuheben
  rationale: Bewahrt die aktive Handlung der angesprochenen Gerechten und die vertikale Gebetsmetaphorik.
- source_word: በተዝካር
  choice: als Erinnerungszeichen
  rationale: Gibt die kultisch-juristische Funktion von etwas wieder, das vor dem himmlischen Gericht in Erinnerung bringt; „Gedenkopfer“ wäre enger als der Kontext erlaubt.
- source_word: ሰማዕተ
  choice: als Zeugnis
  rationale: Das Substantiv bezeichnet hier Zeugnis bzw. Beweisstück und nicht die Engel; diese werden im folgenden Ausdruck ausdrücklich genannt.
- source_word: በቅድመ፡ መላእክት
  choice: vor die Engel
  rationale: Übersetzt die ausdrücklich genannten Engel und wahrt die Szene vor dem himmlischen Gericht.
- source_word: አንብ...ሙ / ያንብ...ሙ
  choice: bringen … vorbringen
  rationale: Der überlieferte bzw. transkribierte Wortlaut ist beschädigt; „bringen/vorbringen“ bildet den plausiblen kausativen Sinn ab, ohne die unsichere Lesung auf „lesen“ festzulegen.
- source_word: ለኃጢአተ፡ ኃጥኣን
  choice: die Sünde der Sünder
  rationale: Wahrt den Singular „Sünde“ und die genitivische Beziehung des Ausgangstextes, ohne zusätzlich ein ausdrückliches „gegen“ einzutragen.
- source_word: በቅድመ፡ ልዑል
  choice: vor dem Höchsten
  rationale: Bewahrt den traditionellen göttlichen Hoheitstitel und die Vorstellung einer himmlischen Gerichtsszene.
theological_decisions:
- issue: Funktion der Gebete im himmlischen Gericht
  choice: Die Gebete werden als Erinnerungszeichen und Zeugnis vorgebracht, worauf die Engel die Sünde der Sünder vor den Höchsten bringen.
  alternative: Die Gebete werden lediglich von Gott erinnert oder von den Engeln vorgelesen.
  rationale: Der wiederholte Erinnerungsbegriff, „Zeugnis“ und die Abfolge des Vorbringens tragen einen gerichtlichen Sinn, ohne die genaue Rechtswirkung dogmatisch festzulegen.
- issue: Handelnde Personen im ersten Satzteil
  choice: Die Gerechten werden aufgefordert, ihre Gebete emporzuheben und als Zeugnis vor die Engel zu bringen.
  alternative: Die Gerechten werden vorbereitet, während ihre Gebete von selbst aufsteigen.
  rationale: Die Formen werden entsprechend der jüngsten grammatischen Prüfung als Imperativ und aktive zweite Person Plural verstanden.
- issue: Rolle der Engel
  choice: Die Engel bringen die Sünde der Sünder vor den Höchsten.
  alternative: Die Engel lesen die Gebete vor dem Höchsten vor.
  rationale: Diese Fassung folgt der plausiblen Satzstruktur und unterscheidet das „Zeugnis“ klar von den ausdrücklich genannten Engeln; wegen der beschädigten Verbüberlieferung bleibt die Unsicherheit in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptisch-gerichtlicher Bildsprache. Der Vokativ „ihr Gerechten“ und der Titel „der Höchste“ bleiben erhalten. „Erinnerungszeichen“ ist verständlicher als das missverständliche „Gedächtnis“, ohne den kultisch-juristischen Gehalt zu verengen.
