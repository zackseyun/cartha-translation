base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/009.yaml
  text: They will forget and be afraid[a], because they did all their works in falsehood, and they worshiped a stone[d][c][b], and they will perish in an instant.
translation:
  language: de
  text: Sie werden vergessen und sich fürchten, denn alle ihre Werke haben sie in Falschheit getan; sie haben einen Stein angebetet[a] und werden in einem Augenblick zugrunde gehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sie haben einen Stein angebetet“; gemeint ist wahrscheinlich ein steinernes Götzenbild.'
    reason: cultural_note
  - marker: b
    text: 'Oder: „werden plötzlich zugrunde gehen“. Eine ältere Deutung verstand die letzte Wendung als „in Schande“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይረሰዑ
  choice: sie werden vergessen
  rationale: Die Form wird am natürlichsten aktiv und pluralisch verstanden. Die mögliche passive Auffassung „sie werden vergessen werden“ bleibt weniger wahrscheinlich.
- source_word: ይፈርሁ
  choice: sie werden sich fürchten
  rationale: Gibt das einfache Verb des Fürchtens wieder, ohne seine Stärke unnötig zu steigern.
- source_word: ኵሎ፡ ገብሮሙ፡ በሐሰት፡ ገብሩ
  choice: alle ihre Werke haben sie in Falschheit getan
  rationale: Bewahrt die umfassende Aussage über ihre Werke und die präpositionale Wendung „in Falschheit“ als Sprache des Gerichts.
- source_word: ለአብን
  choice: einen Stein
  rationale: Der Singular und das konkrete Bild werden beibehalten, statt den Ausdruck verallgemeinernd als „Götzen“ wiederzugeben.
- source_word: ይትሐጐሉ
  choice: sie werden zugrunde gehen
  rationale: Das Verb bezeichnet Untergang oder Vernichtung; „zugrunde gehen“ ist natürlich und lässt die genaue Art des Verderbens offen.
- source_word: በምዕር
  choice: in einem Augenblick
  rationale: Die neuere lexikalische Prüfung stützt die temporale Bedeutung „augenblicklich/plötzlich“ und nicht die ältere Deutung „in Schande“.
theological_decisions:
- issue: Götzendienst mit dem Singular „Stein“
  choice: „sie haben einen Stein angebetet“
  alternative: „sie haben einen steinernen Götzen angebetet“
  rationale: Der Ausgangstext nennt konkret einen einzelnen Stein. Die Übersetzung wahrt dieses schroffe Bild, ohne die Deutung als Götzenbild in den Haupttext einzutragen.
- issue: Art des abschließenden Gerichts
  choice: „werden in einem Augenblick zugrunde gehen“
  alternative: „werden plötzlich vernichtet werden“
  rationale: Die Formulierung verbindet den sicheren Untergang mit seiner Plötzlichkeit, ohne eine bestimmte Vollzugsweise zu behaupten.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst beibehaltenem Gerichtston. Das konkrete Singularbild „einen Stein“ und die ungewöhnliche Wendung „in Falschheit“ bleiben erhalten; die zeitliche Deutung des Schlusses folgt der korrigierten lexikalischen Evidenz.
