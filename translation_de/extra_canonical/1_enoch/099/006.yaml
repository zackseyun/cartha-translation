base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/006.yaml
  text: 'And again I swear to you[a], sinners: sin has been prepared for the day of blood that does not cease.'
translation:
  language: de
  text: 'Und noch einmal schwöre ich euch, ihr Sünder: Für den Tag des Blutes, das nicht aufhört, ist Sünde bereitet worden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Für den Tag des Blutvergießens, das nicht aufhört, ist Strafe beziehungsweise Gericht bereitet worden.« Im Ge’ez steht wörtlich »Sünde«; das Wort kann hier in gedrängter Redeweise für deren Folge stehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወካዕበ
  choice: Und noch einmal
  rationale: Gibt die verbindende Partikel und das wiederholende Adverb wieder und bewahrt den fortlaufenden prophetischen Ton.
- source_word: እኔ እምሕል ለክሙ
  choice: schwöre ich euch
  rationale: Bewahrt die feierliche, eidliche Bekräftigung; stärker als ein bloßes »sage ich euch«.
- source_word: ለኃጥኣን
  choice: ihr Sünder
  rationale: Macht die Anrede im Deutschen ausdrücklich und natürlich kenntlich.
- source_word: ለዕለተ ደም ዘአየሀድአ
  choice: für den Tag des Blutes, das nicht aufhört
  rationale: Folgt der schwierigen und bildhaften Formulierung eng, ohne sie vorschnell als »unaufhörliches Blutvergießen« auszudeuten.
- source_word: ተደለወት
  choice: ist ... bereitet worden
  rationale: Gibt den passiven Perfektsinn wieder und lässt den Handelnden unausgesprochen, wie im Ausgangstext.
- source_word: ኃጢአት
  choice: Sünde
  rationale: Bewahrt die direkte lexikalische Bedeutung des äthiopischen Substantivs und verlagert die mögliche metonymische Bedeutung nicht unmarkiert in den Haupttext.
theological_decisions:
- issue: Ob ኃጢአት die Sünde selbst oder ihre gerichtliche Folge bezeichnet
  choice: Im Haupttext steht »Sünde«.
  alternative: »Strafe« beziehungsweise »Gericht für die Sünde«
  rationale: Der ge'ezische Wortlaut bezeichnet unmittelbar die Sünde; die gedrängte Aussage kann jedoch metonymisch deren Folge meinen. Die Übersetzung bewahrt diese Spannung und erläutert die Alternative in der Fußnote.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Wendung »Tag des Blutes, das nicht aufhört« bleibt wegen der bildhaften und syntaktisch gedrängten Ausgangsform erhalten; die mögliche Deutung als Blutvergießen wird in der Fußnote genannt.
