base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/007.yaml
  text: And those who bow down to stone[a], and those who make images of gold and silver and wood and clay[d][c][b], and those who bow down to evil spirits and demons and to every idol without understanding—they will find no help at all from them.
translation:
  language: de
  text: Und die, die sich vor Stein niederwerfen,[a] und die, die ein Bild aus Gold und aus Silber und aus Holz und aus Ton anfertigen,[b] und die, die sich vor bösen Geistern[c] und Dämonen und vor jedem Götzen niederwerfen, ohne Einsicht zu haben – sie werden von ihnen keinerlei Hilfe finden.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »vor Stein«; der Singular steht wahrscheinlich allgemein für Kultgegenstände aus Stein.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Vorlage hat den Singular »ein Bild« und wiederholt bei jedem Material die Zuordnung: »aus Gold und aus Silber und aus Holz und aus Ton«. Gemeint sein kann die Herstellung solcher Bilder aus den jeweils genannten Stoffen.'
    reason: source_nuance
  - marker: c
    text: 'Oder wörtlicher: »bösen Seelen« beziehungsweise »Seelen von Bösen«.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich sinngemäß: »Sie werden von ihnen überhaupt keine Hilfe finden.«'
    reason: source_nuance
lexical_decisions:
- source_word: ይሰግዱ
  choice: sich niederwerfen
  rationale: Bewahrt sowohl die körperliche Gebärde als auch ihren kultischen Sinn, ohne überall vorschnell das abstraktere »anbeten« einzusetzen.
- source_word: ለአብን
  choice: vor Stein
  rationale: Gibt das Materialsubstantiv direkt und den Singular generisch wieder; »Stein« bezeichnet hier wahrscheinlich steinerne Kultgegenstände.
- source_word: ይገብሩ ምስለ
  choice: ein Bild anfertigen
  rationale: ምስለ wird hier als substantivische Form von »Bild« verstanden, nicht als Präposition »mit«. Der Singular der Vorlage bleibt erhalten.
- source_word: ዘወርቅ ወዘብሩር ወዘዕፅ ወዘልሕኵት
  choice: aus Gold und aus Silber und aus Holz und aus Ton
  rationale: Das wiederholte »aus« bildet die wiederholte Zuordnung der Materialien ab und erhält den bewusst aufzählenden Rhythmus.
- source_word: ነፍሳት እኩያት
  choice: böse Geister
  rationale: Im Zusammenhang mit Dämonen und Götzen liegt ein übernatürlicher Bezug nahe; die wörtlichere Möglichkeit »böse Seelen« wird in einer Fußnote bewahrt.
- source_word: አጋንንት
  choice: Dämonen
  rationale: Geläufige und sachlich passende Bezeichnung für feindliche übernatürliche Wesen im apokalyptischen Sprachgebrauch.
- source_word: ጣዖት
  choice: Götzen
  rationale: Die traditionelle, weiterhin verständliche deutsche Bezeichnung bringt den kultpolemischen Sinn deutlicher zum Ausdruck als das neutralere »Bild«.
- source_word: ኢበተምሃር
  choice: ohne Einsicht zu haben
  rationale: Bewahrt die intellektuell-moralische Aussage, ohne die mögliche Bedeutung auf fehlende Unterweisung zu verengen.
- source_word: ወኵሎ ረድኤተ ኢይረክቡ እምኔሆሙ
  choice: sie werden bei ihnen keinerlei Hilfe finden
  rationale: »Finden« entspricht dem Verb ይረክቡ; »keinerlei« gibt die verstärkte vollständige Verneinung der Hilfe natürlich wieder.
theological_decisions:
- issue: Ob das erste Kultobjekt ausdrücklich als Götze bezeichnet werden soll
  choice: Stein
  alternative: steinerner Götze
  rationale: Die Vorlage nennt unmittelbar den Stoff »Stein«. Die direkte Wiedergabe bewahrt die schroffe Materialkritik und fügt an dieser Stelle kein ausdrücklich ungenanntes »Götzenbild« hinzu.
- issue: Deutung von ነፍሳት እኩያት
  choice: böse Geister
  alternative: böse Seelen
  rationale: Die Verbindung mit Dämonen und jedem Götzen stützt die übernatürliche Deutung. Da das zugrunde liegende Substantiv auch »Seelen« bedeuten kann, bleibt diese Spannung in der Fußnote sichtbar.
- issue: Numerus des angefertigten Bildes
  choice: ein Bild
  alternative: Bilder
  rationale: Die erhaltene ge'ezische Form ist singularisch. Der deutsche Singular wahrt diese Form, auch wenn die Aufzählung mehrerer Materialien eine kollektive oder verallgemeinernde Aussage nahelegen kann.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Satzform »und die, die« sowie die Materialfolge wurden zur Wahrung des mahnenden, aufzählenden Rhythmus beibehalten. »Götze« ist bewusst kultpolemisch, aber im Deutschen allgemein verständlich.
