base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/099/012.yaml
  text: Woe to you who make the measure of sin and deceit[a], and who cause bitterness upon the earth[c][b], for by it they will be destroyed.
translation:
  language: de
  text: Wehe euch, die ihr das Maß zu einem Mittel für Sünde und Betrug macht[a] und auf der Erde Bitterkeit verursacht[b]; denn dadurch werden sie zugrunde gehen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Wendung ist schwierig. Wörtlich steht etwa: »das Maß zu Sünde und Falschheit/Betrug machen«. Gemeint sein kann ein sündiges, betrügerisch verfälschtes Maß.'
    reason: lexical_alternative
  - marker: b
    text: 'Die hier zugrunde gelegte, gegenüber der überlieferten Transkription korrigierte Lesart bedeutet: »Bitterkeit verursachen« oder »bitter machen«.'
    reason: textual_uncertainty
  - marker: c
    text: 'Wörtlich steht in der dritten Person: »denn dadurch werden sie zugrunde gehen«. Der Wechsel von »euch/ihr« zu »sie« bleibt im Text erhalten.'
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: እሌ፡ ለክሙ
  choice: Wehe euch
  rationale: Bewahrt die prophetische Weheruf-Formel in würdigem, geläufigem Deutsch.
- source_word: ትገብርዋ፡ ለመስፈርት፡ ኃጢአት፡ ወሐሱት
  choice: die ihr das Maß zu Sünde und Betrug macht
  rationale: Die konkrete Vorstellung eines Maßes wird erhalten. Die syntaktisch schwierige Verbindung mit »Sünde« und »Betrug/Falschheit« wird nicht zu einer allgemeinen Aussage über sündiges Handeln geglättet und kann im Zusammenhang auf ein verfälschtes Maß anspielen.
- source_word: ታምርሩ
  choice: Bitterkeit ... bringt
  rationale: Folgt der korrigierten Lesart des zugrunde liegenden Textes, die von der Wurzel für »bitter sein/machen« stammt, statt dem fehlerhaften OCR-Wort eine Bedeutung wie »aufstacheln« zu geben.
- source_word: ዲበ፡ ምድር
  choice: über die Erde
  rationale: Gibt die räumliche Wendung in einem gehobenen, aber natürlichen apokalyptischen Register wieder.
- source_word: እስመ፡ ቦቱ፡ ይትዌደኡ
  choice: denn dadurch werden sie zugrunde gehen
  rationale: Bewahrt den instrumentalen oder kausalen Bezug von ቦቱ auf das zuvor genannte Übel und den deutlichen Gerichtston des Verbs.
theological_decisions:
- issue: Ob die schwierige Maß-Wendung zu einer allgemeinen Aussage über Sündhaftigkeit geglättet werden soll
  choice: das Maß zu Sünde und Betrug macht
  alternative: ein falsches und betrügerisches Maß macht; das Maß von Sünde und Betrug vollmacht
  rationale: Die konkrete Maß-Metapher und die schwierige Quellensyntax bleiben sichtbar; zugleich wird die mögliche Anspielung auf betrügerische Maße nicht dogmatisch als einzig mögliche Deutung festgelegt.
- issue: Wodurch das Verderben im Schlusssatz verursacht wird
  choice: dadurch werden sie zugrunde gehen
  alternative: deswegen werden sie zugrunde gehen; dadurch werdet ihr zugrunde gehen
  rationale: Die Grammatik legt einen instrumentalen oder kausalen Rückbezug nahe. Das Pronomen der dritten Person wird beibehalten, obwohl der Weheruf zuvor die Angeredeten in der zweiten Person nennt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem prophetisch-apokalyptischem Ton. Die schwierige Maß-Wendung wird bewusst quellennahe wiedergegeben und erläutert; erkannte OCR-Fehler werden anhand der dokumentierten korrigierten Lesart berücksichtigt.
