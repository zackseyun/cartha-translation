base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/003/001.yaml
  text: Observe and see all the trees[a], how they appear withered, and all their leaves stripped off—except fourteen trees, which do not lose their leaves, but remain from the old until the new comes[c][b], through two and three winters.
translation:
  language: de
  text: Beobachtet und seht alle Bäume, wie sie verdorrt erscheinen und deren sämtliche Blätter abgestreift sind – ausgenommen vierzehn Bäume, die ihre Blätter nicht verlieren, sondern vom Alten an bis das Neue kommt bestehen bleiben[a], zwei und drei Winter hindurch.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Vom Alten an … bis das Neue kommt“ ist verkürzt formuliert; wahrscheinlich sind die zu Ende gehende und die neu anbrechende Jahreszeit oder das alte und das neue Jahr gemeint.
    reason: cultural_note
  - marker: b
    text: „Zwei und drei Winter hindurch“ ist eine schwierige Wendung. Gemeint sein könnte „zwei oder drei Winter lang“ oder eine Abfolge wiederkehrender Winter vor der Erneuerung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ጠይቁ፡ ወርእዩ
  choice: Beobachtet und seht
  rationale: Die beiden Imperative Plural fordern zur aufmerksamen Wahrnehmung auf. Im Kontext bedeutet ጠይቁ eher „beobachtet/betrachtet“ als „fragt“; ወርእዩ bleibt als „und seht“ erhalten.
- source_word: ኵሎ፡ ዕፀወ
  choice: all die Bäume
  rationale: Gibt den kollektiven Plural natürlich und umfassend wieder.
- source_word: እፎ፡ ያስተርእዩ፡ ከመ፡ ይቡስ
  choice: wie sie verdorrt erscheinen
  rationale: እፎ bezeichnet hier „wie“, nicht „ob“; die Wiedergabe bewahrt sowohl den sichtbaren Eindruck als auch den Zustand des Verdorrens.
- source_word: ወኵሉ፡ አቍጽሊሆሙ፡ ንጉፍ
  choice: und all ihre Blätter abgestreift sind
  rationale: „Abgestreift“ erhält das starke Bild des entblößten Laubwerks und ist enger als ein bloßes „abgefallen“.
- source_word: ዘእንበለ፡ ፲ወ፬ ዕፀወ
  choice: außer bei vierzehn Bäumen
  rationale: Die Ausnahme von der zuvor beschriebenen Gesamtheit wird klar markiert; „bei“ fügt sich in die deutsche Satzkonstruktion ein.
- source_word: ዘኢይትነገፉ
  choice: die ihre Blätter nicht verlieren
  rationale: Die Form steht im Gegensatz zum vorherigen Abstreifen der Blätter. Die konkrete Wiederholung von „Blätter“ ist verständlich und quellennah.
- source_word: እላ፡ ይጸንሑ
  choice: sondern ... bleiben
  rationale: Bezeichnet das Fortbestehen der ausgenommenen Bäume und leitet die zeitliche Bestimmung ein.
- source_word: እምብሉይ፡ እስከ፡ ይመጽእ፡ ኃዲስ
  choice: vom Alten her bleiben, bis das Neue kommt
  rationale: Die substantivisch gebrauchten Begriffe „alt“ und „neu“ bleiben entsprechend der elliptischen Vorlage unaufgelöst; eine Fußnote erläutert den wahrscheinlichen Jahreszeiten- oder Jahresbezug.
- source_word: እምክልኤ፡ ወእም፡ ፫ ክረምት
  choice: zwei und drei Winter hindurch
  rationale: Die schwer verständliche Verbindung von „zwei und drei“ wird bewusst nicht zu „zwei oder drei“ vereindeutigt. „Hindurch“ wahrt den Gedanken zeitlicher Dauer.
theological_decisions:
- issue: Symbolische Deutung der Bäume und Jahreszeiten
  choice: Die botanisch-jahreszeitliche Beschreibung bleibt im Haupttext ohne allegorische Auslegung stehen.
  alternative: Die Bäume unmittelbar als Menschengruppen oder kosmische Ordnungen deuten.
  rationale: Der Wortlaut fordert zur Beobachtung der Schöpfung auf, benennt hier aber nur Bäume, Blätter und Winter. Eine allegorische Festlegung würde über den Text hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Die auffälligen Wiederholungen und die elliptischen Zeitangaben werden weitgehend bewahrt; echte Unsicherheiten stehen in Fußnoten statt unmarkiert im Haupttext aufgelöst zu werden.
