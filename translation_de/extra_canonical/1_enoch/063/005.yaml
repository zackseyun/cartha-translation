base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/005.yaml
  text: And they said[a], “Who has given us rest[c][b], that we should praise and thank and believe before your glory?”
translation:
  language: de
  text: 'Und sie sagten: „Wer hat uns Ruhe geschenkt, damit wir ihn preisen und ihm danken und im Angesicht deiner Herrlichkeit glauben?“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Für „Ruhe“ ist auch „Erleichterung“, „Rast“ oder „Erholung“ möglich. Das letzte Verb kann in dieser schwierigen äthiopischen Textüberlieferung auch im Sinn von „bekennen“ oder „anerkennen“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: መኑ
  choice: wer
  rationale: Das Fragepronomen leitet die verzweifelte rhetorische Frage natürlich und quellennah ein.
- source_word: ወሀበነ
  choice: hat uns … geschenkt
  rationale: Die Perfektform gibt die vollendete Handlung wieder; „geschenkt“ ist im Deutschen bei gewährter Ruhe natürlich.
- source_word: ዕረፍተ
  choice: Ruhe
  rationale: Das Substantiv bezeichnet Ruhe oder Aufschub; „Ruhe“ wahrt den scharfen Gegensatz zum Gericht.
- source_word: ከመ
  choice: damit
  rationale: Gibt den Zweck- beziehungsweise Folgesinn knapp und idiomatisch wieder.
- source_word: ንሰብሖ
  choice: wir ihn preisen
  rationale: Der Verbalkomplex trägt ein maskulines Objektssuffix; „ihn preisen“ macht dieses grammatische Element sichtbar.
- source_word: ወናአኵቶ
  choice: und ihm danken
  rationale: Auch hier wird das maskuline Objektssuffix wiedergegeben; der deutsche Dativ bei „danken“ ist idiomatisch.
- source_word: ወንእመን
  choice: und … glauben
  rationale: Die G-Stamm-Form von አምነ bezeichnet hier am ehesten Glauben; „bekennen“ wäre eher mit einer anderen Stammform zu erwarten.
- source_word: ቅድመ
  choice: vor
  rationale: Bewahrt die räumlich-feierliche Vorstellung des Stehens vor der göttlichen Herrlichkeit.
- source_word: ስብሐቲከ
  choice: deiner Herrlichkeit
  rationale: „Herrlichkeit“ entspricht dem Bedeutungsfeld von Glanz, Majestät und Ruhm und passt zum apokalyptischen Kontext.
theological_decisions:
- issue: Sinn der Frage angesichts des Gerichts
  choice: 'Die Frage bleibt eine verzweifelte rhetorische Klage: Den Sprechern ist keine Ruhe gewährt worden, aus der heraus sie Gott preisen, ihm danken und glauben könnten.'
  alternative: Eine sachliche Frage danach, wer ihnen Muße zur Anbetung gewährt habe.
  rationale: Der Gerichtskontext spricht für eine Klage ohne erhaltenen Aufschub; die Frageform bleibt erhalten, ohne die Spannung erklärend aufzulösen.
- issue: Bedeutung von ወንእመን
  choice: glauben
  alternative: bekennen oder anerkennen
  rationale: Die Grundstammform und die thematische Wiederholung im Kapitel stützen „glauben“; wegen der schwierigen Überlieferung wird die Alternative in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige Folge bleibt erhalten; die in den ersten beiden ge’ezischen Verben erkennbaren maskulinen Objektssuffixe werden im Deutschen ausdrücklich wiedergegeben. Der ungewöhnliche Wechsel von „ihn/ihm“ zu „deiner“ entspricht dem Personenwechsel im Quelltext und wird nicht geglättet.
