base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/007.yaml
  text: For before him we did not believe[a], and we did not praise the name of the Lord of Spirits[a][b], [and we did not praise our Lord,] and our hope was in the scepter of our kingdom and in our glory.
translation:
  language: de
  text: Denn vor ihm glaubten wir nicht[c], und wir priesen den Namen des Herrn der Geister nicht, [und wir priesen unseren Herrn nicht][a], und unsere Hoffnung ruhte auf dem Zepter unseres Königtums[b] und auf unserer Herrlichkeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die eingeklammerte Aussage »und wir priesen unseren Herrn nicht« ist in der Überlieferung unsicher und könnte eine Variante oder spätere Erweiterung sein.
    reason: textual_variant
  - marker: b
    text: Das mit »Zepter« wiedergegebene Wort kann auch »Stab« oder »Rute« bedeuten; zusammen mit »Königtum« liegt hier die königliche Bedeutung nahe.
    reason: lexical_alternative
  - marker: c
    text: 'Die kritische Lesart hat hier und bei den folgenden Verben ein Negationspräfix: »wir glaubten nicht … wir priesen nicht«. In der vorgelegten Umschrift ist dieses Präfix offenbar als positives አ- statt ኢ- wiedergegeben.'
    reason: textual_variant
lexical_decisions:
- source_word: እስመ
  choice: Denn
  rationale: Leitet im Zusammenhang die Begründung für das Bekenntnis der Könige ein und bewahrt die erklärende Funktion der Konjunktion.
- source_word: በቅድሜሁ
  choice: vor ihm
  rationale: Gibt die räumlich-relationale Wendung knapp wieder und passt zum Gerichts- und Gegenwartsmotiv des Abschnitts.
- source_word: ኢአመነ
  choice: glaubten wir nicht
  rationale: Folgt der als kritisch bezeugt gemeldeten Lesart mit Negationspräfix; die vorgelegte Umschrift scheint dieses Präfix fehlerhaft als positives አ- wiederzugeben.
- source_word: ወኢሰባሕነ ለስሙ
  choice: und wir priesen den Namen … nicht
  rationale: Bewahrt den ausdrücklich genannten Gegenstand „den Namen“ und gibt das wiederholte Verb direkt und natürlich wieder.
- source_word: እግዚአ መናፈስት
  choice: Herr der Geister
  rationale: Bewahrt den festen apokalyptischen Titel in 1 Henoch, ohne ihn erklärend zu erweitern.
- source_word: ወኢሰባሕናሁ ለእግዚእነ
  choice: und wir priesen unseren Herrn nicht
  rationale: Gibt die in der Überlieferung eingeklammerte Klausel in derselben verbalen Form wieder und kennzeichnet ihre Unsicherheit durch eckige Klammern und eine Fußnote.
- source_word: ወተስፋነ ኮነ ዲበ
  choice: unsere Hoffnung aber ruhte auf
  rationale: Drückt den statischen Bezug der Hoffnung idiomatisch aus; „aber“ macht den im Satz liegenden Gegensatz zur unterlassenen Gottesverehrung deutlich, ohne ihn auszudeuten.
- source_word: በትረ መንግሥትነ
  choice: dem Zepter unseres Königtums
  rationale: „Zepter“ erhält bei dem Bezug auf das Königtum das konkrete königliche Machtbild besser als das allgemeinere „Stab“.
- source_word: ስብሐቲነ
  choice: unserer Herrlichkeit
  rationale: Bewahrt die Bedeutung zwischen Herrlichkeit, Glanz und Ehre und passt zur selbstbezogenen königlichen Zuversicht im Kontext.
theological_decisions:
- issue: Ob die Herrscher Glauben und Lob positiv behaupten oder ihr Unterlassen bekennen
  choice: glaubten wir nicht … priesen … nicht
  alternative: glaubten wir … priesen
  rationale: Die gemeldete kritische Lesart und der Zusammenhang des Schuldbekenntnisses sprechen für das Negationspräfix. Da die gelieferte äthiopische Umschrift positiv erscheint, wird die textliche Spannung ausdrücklich in einer Fußnote offengelegt.
- issue: Gegenstand der fehlgeleiteten Hoffnung im Gerichtskontext
  choice: dem Zepter unseres Königtums und unserer Herrlichkeit
  alternative: dem Stab unserer Herrschaft und unserem Glanz
  rationale: Die konkrete königliche Bildsprache bleibt erhalten; sie wird nicht zu einem abstrakten Begriff wie „Macht“ verflacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am äthiopischen Bekenntnis, wird aber durch Semikolon und „aber“ für heutige Leser gegliedert. Der traditionelle apokalyptische Titel „Herr der Geister“ und die königliche Metaphorik bleiben unverändert erhalten.
