base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/002.yaml
  text: And they will bless and praise the Lord of spirits, and they will say, “Blessed is the Lord of spirits, and the Lord of the kings, and the Lord of the mighty, and the Lord of the rich, and the Lord of glory, and the Lord of wisdom.”
translation:
  language: de
  text: 'Und sie werden den Herrn der Geister segnen und preisen und sagen: »Gesegnet ist der Herr der Geister und der Herr der Könige und der Herr der Mächtigen und der Herr der Reichen[a] und der Herr der Herrlichkeit und der Herr der Weisheit.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit »die Reichen« wiedergegebene Wort kann weiter gefasst auch Besitzende, Vornehme oder Große bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Im Ge’ez wird »und der Herr …« vor jedem Glied wiederholt. Diese feierliche Reihung ist hier beibehalten.
    reason: literary_style
lexical_decisions:
- source_word: ይባርክዎ፡ ወይሴብሕዎ
  choice: sie werden … segnen und preisen
  rationale: Die fortlaufenden Imperfektformen passen im visionären Erzählzusammenhang zu einer zukünftigen Wiedergabe. Das Objektsuffix wird durch „den Herrn der Geister“ ausdrücklich aufgenommen.
- source_word: እግዚአ፡ መንፈሳት / እግዚአ፡ መናፍስት
  choice: Herr der Geister
  rationale: Die feste henochische Gottesbezeichnung wird knapp und im Deutschen natürlich wiedergegeben; „Herr“ bewahrt ihren titularen und kosmischen Charakter.
- source_word: ቡሩክ፡ ውእቱ
  choice: Gesegnet ist
  rationale: Die Formulierung ist als feststellender Lobpreis verstanden, nicht als Wunschformel „Gesegnet sei“.
- source_word: ዐዚዛን
  choice: die Mächtigen
  rationale: Das Wort bezeichnet hier machtvolle beziehungsweise einflussreiche Personen; „die Mächtigen“ erhält den gesellschaftlich-politischen Sinn.
- source_word: ብዑላን
  choice: die Reichen
  rationale: Im Zusammenhang der verurteilten Oberschicht liegt die Bedeutung vermögender oder besitzender Personen nahe. Eine weiter gefasste Deutung wird in der Fußnote kenntlich gemacht.
- source_word: ስብሐት
  choice: Herrlichkeit
  rationale: Das Substantiv kann auch Lob oder Glanz bezeichnen; „Herrlichkeit“ wahrt hier das gewichtige apokalyptische Register und die abstrakte Titelformel.
- source_word: ጥበብ
  choice: Weisheit
  rationale: „Weisheit“ gibt den breiten Bedeutungsumfang wieder, ohne ihn auf bloßen Verstand oder Einsicht zu verengen.
theological_decisions:
- issue: Wiederkehrender Gottestitel እግዚአ መንፈሳት
  choice: Herr der Geister
  alternative: Gebieter der Geister / Herr von Geistern
  rationale: „Herr der Geister“ bewahrt die charakteristische henochische Bezeichnung und vermeidet eine konfessionelle oder spekulative Präzisierung dessen, welche Geister gemeint sind.
- issue: Aussage oder Wunsch bei ቡሩክ ውእቱ
  choice: Gesegnet ist
  alternative: Gesegnet sei
  rationale: Die Syntax und die Szene sprechen eher für eine Akklamation als für einen Segenswunsch.
- issue: Reihung der Herrschaftstitel
  choice: Wiederholung von „und der Herr“
  alternative: Kommagliederung ohne wiederholtes „und“
  rationale: Das Ge’ez setzt vor jedem Glied erneut ወ („und“). Die polysyndetische Reihung wird als feierliches Stilmerkmal bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener liturgisch-apokalyptischer Wiederholung. Die Wortstellung bleibt gut verständlich, ohne die rhetorische Schwere des Originals zu glätten.
