base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/008.yaml
  text: And on the day of our distress and our affliction[a], he will not save us, and we shall find no rest to believe that our Lord is faithful in all his works and in his judgments and his righteousness[c][b], and his judgments show no partiality.
translation:
  language: de
  text: Und am Tag unserer Bedrängnis und unseres Leidens wird er uns nicht retten, und wir werden keine Ruhe finden, um zu glauben, dass unser Herr treu ist in all seinen Werken, in seinen Gerichten und in seiner Gerechtigkeit; und seine Gerichte sind unparteiisch.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Verbindung „keine Ruhe finden, um zu glauben“ ist im Ge''ez syntaktisch schwierig. Möglich sind auch: „keine Ruhe finden, auf die wir vertrauen könnten“, „keinen Aufschub für Hoffnung finden“ oder „keine Ruhe finden; denn wir glaubten“.'
    reason: alternative_reading
  - marker: b
    text: Wörtlich steht hier eine Wendung vom Nicht-Erheben des „Gesichts“; im Gerichtszusammenhang bezeichnet sie fehlende Bevorzugung oder Parteilichkeit.
    reason: lexical_alternative
lexical_decisions:
- source_word: በዕለተ
  choice: am Tag
  rationale: Bewahrt die zeitliche und apokalyptische Prägung der Wendung, ohne sie zu einer bloßen allgemeinen Zeitangabe abzuschwächen.
- source_word: ስራሕነ
  choice: unserer Bedrängnis
  rationale: Das Wort kann Arbeit oder Mühsal bezeichnen; im Zusammenhang der Klage bezeichnet es am ehesten die bedrängende Notlage der Sprecher.
- source_word: ምንዳቤነ
  choice: unseres Leidens
  rationale: Gibt den zweiten Notsbegriff natürlich wieder. „Strafe“ wäre möglich, würde die Ursache des Leidens jedoch stärker festlegen als der Text.
- source_word: ኢያድኅነነ
  choice: wird er uns nicht retten
  rationale: Gibt das gebräuchliche Verb für Rettung direkt und mit dem Gewicht des Gerichtskontexts wieder.
- source_word: ኢንረክብ ዕረፍተ
  choice: wir werden keine Ruhe finden
  rationale: Bewahrt die konkrete Bildsprache des Findens von Ruhe und vermeidet eine ausdeutende Umschreibung wie „Erleichterung erlangen“.
- source_word: ንእመን
  choice: um zu glauben
  rationale: Die syntaktische Verbindung ist schwierig. Die bewusst etwas sperrige Wiedergabe hält den Bezug zum Glauben beziehungsweise Vertrauen offen, statt eine sichere Deutung vorzutäuschen.
- source_word: መሃይምን
  choice: treu
  rationale: Bezeichnet die Verlässlichkeit des Herrn und ist zugleich würdig, geläufig und theologisch nicht überbestimmt.
- source_word: ምግባሩ
  choice: seinen Werken
  rationale: Bewahrt den weiten Sinn des göttlichen Handelns und entspricht dem etablierten gehobenen deutschen Sprachgebrauch.
- source_word: ኵነኔሁ
  choice: seinen Gerichten / seine Gerichte
  rationale: Das Wort erscheint zweimal. Der Plural entspricht hier dem überlieferten Zusammenhang und der pluralischen Verbform im Schlusssatz.
- source_word: ጽድቁ
  choice: seiner Gerechtigkeit
  rationale: Der eigenständige dritte Bestandteil der Aufzählung wird ausdrücklich wiedergegeben und nicht mit den Gerichten verschmolzen.
- source_word: ገጹ … ኢይነሥኡ
  choice: kennen keine Parteilichkeit
  rationale: Gibt die gerichtliche Redewendung vom Nicht-Erheben des Gesichts in verständlichem modernem Deutsch als Unparteilichkeit wieder.
theological_decisions:
- issue: Bedeutung von ኢንረክብ ዕረፍተ ንእመን
  choice: wir werden keine Ruhe finden, um zu glauben
  alternative: wir werden keine Ruhe finden, auf die wir vertrauen könnten / wir werden keinen Aufschub für Hoffnung finden / wir werden keine Ruhe finden, denn wir glaubten
  rationale: Der ge'ezische Wortlaut ist syntaktisch unsicher. Der Haupttext bewahrt eine formal mögliche, wenn auch sperrige Verbindung; die Fußnote dokumentiert die wichtigsten Alternativen, ohne die Spannung aufzulösen.
- issue: Gliederung der Aufzählung
  choice: in all seinen Werken, in seinen Gerichten und in seiner Gerechtigkeit
  alternative: in all seinen Werken und in seinen Gerichten; und seine Gerechtigkeit …
  rationale: ጽድቁ wird als drittes Glied der Reihe ausdrücklich erhalten. Eine alternative Zeichensetzung bleibt wegen der Satzstruktur möglich und wird in der Fußnote genannt.
- issue: Schlussformel über das Gericht
  choice: seine Gerichte kennen keine Parteilichkeit
  alternative: seine Gerichte erheben kein Gesicht
  rationale: Die natürliche deutsche Wiedergabe vermittelt den wahrscheinlichen gerichtlichen Sinn der Redewendung, während die Fußnote das konkrete Bild des Ausgangstextes festhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem apokalyptischem Klang. Die schwierige Glaubens-/Vertrauenskonstruktion bleibt im Haupttext bewusst erkennbar; idiomatische Gerichtssprache wird verständlich wiedergegeben und in der Fußnote transparent gemacht.
