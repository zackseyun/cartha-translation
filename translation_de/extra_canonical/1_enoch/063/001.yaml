base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/001.yaml
  text: In those days the mighty ones and the kings who possess the dry land shall beg the angels of punishment[a], into whose hands they have been delivered, that they might give them a little respite, so that they may fall down and worship before the Lord of Spirits[c][b], and confess their sins before him.
translation:
  language: de
  text: In jenen Tagen werden die Mächtigen und die Könige, die das Land innehaben,[a] die Engel der Strafe anflehen, in deren Hände sie ausgeliefert worden sind,[b] ihnen eine kurze Atempause zu gewähren,[c] damit sie sich niederwerfen und vor dem Herrn der Geister anbeten und ihre Sünden vor ihm bekennen können.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die die Erde innehaben“. Die äthiopische Wendung spricht konkret vom „trockenen Land“ und meint wahrscheinlich den irdischen Herrschaftsbereich.'
    reason: lexical_alternative
  - marker: b
    text: Die zugrunde liegende äthiopische Wendung ist textlich schwierig. Gemeint scheint zu sein, dass diese Engel die verurteilten Herrscher in Gewahrsam haben.
    reason: textual_variant
  - marker: c
    text: Die „kurze Atempause“ bezeichnet eine geringe, zeitlich begrenzte Erleichterung, nicht die Befreiung vom Gericht.
    reason: cultural_note
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: In jenen Tagen
  rationale: Bewahrt die wiederkehrende apokalyptische Zeitformel und ihren feierlichen Klang.
- source_word: ዓዚዛን ወነገሥት
  choice: die Mächtigen und die Könige
  rationale: Gibt beide gesellschaftlich-politischen Gruppen wieder, ohne die Mächtigen vorschnell als bestimmte Amtsträger festzulegen.
- source_word: እለ ይእኅዝዋ ለየብስ
  choice: die das Festland in ihrer Gewalt haben
  rationale: „Festland“ erhält die konkrete Bedeutung von የብስ; „in ihrer Gewalt haben“ bringt den hier wahrscheinlichen Gedanken irdischer Herrschaft natürlich zum Ausdruck.
- source_word: መላእክት መቅሠፍት
  choice: Engel der Strafe
  rationale: Transparente Wiedergabe der Genitivverbindung im gerichtlichen Zusammenhang.
- source_word: በኀበ ሀለዉ ምጥዋነ
  choice: in deren Hände sie ausgeliefert worden sind
  rationale: Gibt den wahrscheinlichen Gewahrsamsgedanken der schwierigen äthiopischen Wendung wieder, ohne Einzelheiten der Bestrafung hinzuzufügen.
- source_word: ዕረፍተ ንስቲተ
  choice: eine kurze Ruhepause
  rationale: Verbindet den Gedanken von Ruhe beziehungsweise Erleichterung mit ihrer ausdrücklich begrenzten Dauer.
- source_word: ይደቁ ወይስግዱ
  choice: sich niederwerfen und … anbeten
  rationale: Bewahrt sowohl die körperliche Unterwerfung als auch den kultischen Sinn des Verbenpaars.
- source_word: እግዚአ መናፍስት
  choice: Herr der Geister
  rationale: Bewahrt den festen göttlichen Titel des Henochbuches, ohne ihn dogmatisch auszudeuten.
- source_word: ይትአመኑ ኃጢአቶሙ
  choice: ihre Sünden … bekennen
  rationale: Passt zum gerichtlichen und bußartigen Kontext, lässt aber offen, ob das Bekenntnis angenommen wird.
theological_decisions:
- issue: Ob das Bekenntnis der Herrscher echte Umkehr oder nur erzwungene Unterwerfung im Gericht darstellt
  choice: Der Text berichtet ihre Bitte sowie die beabsichtigte Anbetung und das Sündenbekenntnis, ohne deren Aufrichtigkeit oder Annahme festzustellen.
  alternative: Das Bekenntnis ausdrücklich als echte Reue oder bloß erzwungenes Eingeständnis zu kennzeichnen.
  rationale: Der Vers lässt Motivation und göttliche Annahme offen; diese theologische Spannung bleibt daher erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptischem Klang. Der Satzbau bleibt nahe an der Folge des ge'ezischen Textes, wird jedoch für heutige Leser idiomatisch gegliedert. Die Fußnotenmarker stehen jeweils unmittelbar bei der erklärungsbedürftigen Wendung.
