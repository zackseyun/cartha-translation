base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/003.yaml
  text: And your power is blessed in every hidden thing throughout all generations[a], and your glory forever and ever. Deep are all your hidden things, and they are without number[c][b]; and your righteousness is beyond reckoning.
translation:
  language: de
  text: Und deine Macht leuchtet in allem Verborgenen von Generation zu Generation, und deine Herrlichkeit bleibt für immer und ewig. Tief sind alle deine verborgenen Dinge[a], und sie sind ohne Zahl; und deine Gerechtigkeit ist unermesslich[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »alle deine Geheimnisse«. Wörtlicher steht im Ge’ez: »alle deine verborgenen [Dinge]«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »deine Gerechtigkeit hat keine Berechnung«; auch: »ist nicht zu ermessen«.'
    reason: literal_rendering
lexical_decisions:
- source_word: ይበርህ
  choice: leuchtet
  rationale: Die Form gehört zu በርሀ, »leuchten/hell sein«, nicht zum Verb »segnen«. Das Präsens bewahrt den Aussagecharakter.
- source_word: በኵሉ ኅቡእ ኃይልክ
  choice: deine Macht leuchtet in allem Verborgenen
  rationale: ኃይልክ ist das Subjekt; በኵሉ ኅቡእ ist die vorangestellte präpositionale Bestimmung. So wird »verborgen« nicht fälschlich zum Attribut der Macht.
- source_word: ለትውልደ ትውልድ
  choice: von Generation zu Generation
  rationale: Natürliche deutsche Wiedergabe der fortdauernden Generationenformel.
- source_word: ስብሐቲከ
  choice: deine Herrlichkeit
  rationale: Im doxologischen Zusammenhang bezeichnet der Ausdruck am ehesten Gottes Herrlichkeit beziehungsweise Glanz.
- source_word: ለዓለመ ዓለም
  choice: für immer und ewig
  rationale: Bewahrt die emphatische Dauerformel in geläufigem, würdigem Deutsch.
- source_word: ዕሙቅ ውእቱ ኵሉ ኅቡኣት ዚአከ
  choice: Tief sind alle deine verborgenen Dinge
  rationale: Die vorangestellte Tiefenangabe erhält die poetische Wortstellung; »verborgene Dinge« wahrt die konkrete, aber offene Bedeutung.
- source_word: ኍልቈ አልቦሙ
  choice: sie sind ohne Zahl
  rationale: Formnahe und im Deutschen verständliche Wiedergabe der Unzählbarkeit.
- source_word: ጽድቅ ዚአከ
  choice: deine Gerechtigkeit
  rationale: »Gerechtigkeit« kann im Deutschen sowohl den gerechten Charakter als auch gerechtes Handeln bezeichnen und bewahrt damit die semantische Breite.
- source_word: ኃሳበ አልቦ
  choice: ist unermesslich
  rationale: Die Wendung besagt wörtlich, dass es keine Berechnung beziehungsweise Bemessung gibt; »unermesslich« gibt dies knapp und poetisch wieder.
theological_decisions:
- issue: Deutung der Sprache vom Verborgenen
  choice: verborgene Dinge
  alternative: Geheimnisse / Mysterien
  rationale: Die sachlich offene Formulierung folgt dem konkreten Plural des Ge'ez und vermeidet, eine bestimmte mystische Vorstellung einzutragen.
- issue: Bedeutungsumfang von ጽድቅ
  choice: Gerechtigkeit
  alternative: Recht / gerechtes Handeln
  rationale: Der doxologische Kontext spricht von einer göttlichen Eigenschaft; zugleich lässt »Gerechtigkeit« im Deutschen den Bezug auf Gottes gerechtes Handeln offen.
- issue: Lesart des Anfangsverbs
  choice: leuchtet
  alternative: ist gesegnet
  rationale: Die gegebene Konsonanten- und Wortform ይበርህ ist als Form von በርሀ, »leuchten«, zu verstehen. Die frühere Segenslesart beruht auf einer Verwechslung mit einem anderen Verb.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Satzstellung. Die Wiederholungen und die apokalyptische Sprache vom Verborgenen bleiben erhalten; konfessionell festgelegte Deutungen werden vermieden.
