base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/010.yaml
  text: Now they will say to them[a], ‘Our soul has had its fill of unjust gain[d][c][b], but it does not keep us from going down from the midst of it into the burden of Sheol.’
translation:
  language: de
  text: 'Nun werden sie zu ihnen sagen: »Unsere Seele hat sich am unrechten Gewinn gesättigt,[a] doch er hält uns nicht davon ab, aus seiner Mitte in die Schwere der Scheol hinabzusteigen.[b][c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die zugrunde liegende äthiopische Wendung ist textlich und lexikalisch schwierig; sie kann allgemeiner Vermögen bezeichnen, das durch Unrecht erworben wurde.
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »in das Gewicht der Scheol«. Gemeint ist ein bedrückendes Hinabsteigen in das Totenreich, nicht nur die Bestattung.'
    reason: lexical_alternative
  - marker: c
    text: »Scheol« bezeichnet hier das Totenreich der altjüdischen Vorstellungswelt und wird deshalb nicht mit »Hölle« übersetzt.
    reason: cultural_note
lexical_decisions:
- source_word: ይእዜ
  choice: Nun
  rationale: Markiert knapp und natürlich den dramatischen zeitlichen Umschwung.
- source_word: ይብልዎሙ
  choice: werden sie zu ihnen sagen
  rationale: Bewahrt sowohl die futurisch-prophetische Form als auch das ausdrückliche Objekt der dritten Person Plural.
- source_word: ትጸግብ ነፍስነ
  choice: Unsere Seele hat sich … satt gemacht
  rationale: Gibt das Bild des Sattwerdens beziehungsweise der Übersättigung in einem abgeschlossenen Zustand wieder.
- source_word: እምጥየየ ዐመፃ
  choice: an unrechtem Gewinn
  rationale: Hält den materiellen und moralischen Sinn zusammen, ohne die schwierige Wendung unnötig einzuengen.
- source_word: ወኢትከልእ
  choice: doch er hält uns nicht davon ab
  rationale: Gibt das Verhindern oder Zurückhalten idiomatisch wieder; das Pronomen greift den Gewinn auf.
- source_word: ወረደተነ
  choice: hinabzusinken
  rationale: Bewahrt die anschauliche Abwärtsbewegung zum Totenreich.
- source_word: እምልባ
  choice: aus seiner Mitte
  rationale: Übersetzt die schwierige räumliche Wendung transparent und vermeidet eine glättende Deutung.
- source_word: ለክበደ ሲኦል
  choice: in die Schwere des Scheol
  rationale: Erhält das ungewöhnliche Bild bedrückender Schwere und die Zielrichtung des Hinabsteigens.
- source_word: ሲኦል
  choice: Scheol
  rationale: Bewahrt den altjüdischen Begriff für das Totenreich, ohne ihn mit späteren Vorstellungen von Hölle gleichzusetzen.
theological_decisions:
- issue: Bezeichnung des Totenreichs
  choice: Scheol
  alternative: Totenreich; Grab; Hölle
  rationale: Scheol erhält die Eigenart der jüdisch-apokalyptischen Vorstellungswelt und vermeidet sowohl eine Verengung auf das Grab als auch den Import späterer Höllenvorstellungen.
- issue: Bezug des hindernden Subjekts
  choice: Der unrechte Gewinn hält sie nicht ab
  alternative: 'Unpersönlich: Es verhindert ihren Abstieg nicht'
  rationale: Der grammatische Bezug bleibt im Deutschen naheliegend beim zuvor genannten Gewinn, ohne dessen genaue Funktion weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnlichen Bilder »aus seiner Mitte« und »Schwere des Scheol« bleiben wegen der Unsicherheit und Bildhaftigkeit des ge’ezischen Textes bewusst erhalten.
