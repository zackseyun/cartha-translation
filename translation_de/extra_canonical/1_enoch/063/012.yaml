base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/012.yaml
  text: 'Thus said the Lord of Spirits: "This is the ordinance and the judgment for the mighty."[a][b][c]'
translation:
  language: de
  text: 'So sprach der Herr der Geister: »Dies ist die Satzung und das Gericht für die Mächtigen.«[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht am Anfang eine Formel aus „so/auf diese Weise“ und „er sprach“. Möglich wäre daher auch: „Auf diese Weise sprach der Herr der Geister.“'
    reason: lexical_alternative
  - marker: b
    text: Die Endungen an „Satzung“ und „Gericht“ können im Altäthiopischen bestimmende Funktion haben, wie hier übersetzt. Formal lassen sie sich auch mit „seine Satzung und sein Gericht“ wiedergeben.
    reason: grammatical_ambiguity
  - marker: c
    text: Statt „für die Mächtigen“ ist im gerichtlichen Zusammenhang auch „gegen die Mächtigen“ möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: ከመዝ ይቤ
  choice: So sprach
  rationale: ከመዝ hat hier formelhaften, weiterführenden Sinn („so“, „auf diese Weise“); ይቤ ist die Verbform „er sprach“. Zusammen leiten sie die folgende Erklärung als Rede ein.
- source_word: እግዚአ መናፈስት
  choice: der Herr der Geister
  rationale: Der charakteristische Gottesname des Henochbuches wird wörtlich und im Deutschen natürlich wiedergegeben.
- source_word: ዝውእቱ
  choice: Dies ist
  rationale: Die Verbindung aus Demonstrativ und Kopula weist auf die nun ausgesprochene gerichtliche Bestimmung.
- source_word: ሥርዓቱ
  choice: die Satzung
  rationale: Das Wort bezeichnet eine festgesetzte Ordnung, Regelung oder Satzung. „Satzung“ bewahrt hier den feierlichen und rechtlichen Klang.
- source_word: ወኵነኔሁ
  choice: und das Gericht
  rationale: Der Ausdruck bezeichnet Gericht, Urteil oder Verurteilung. „Gericht“ lässt den Umfang des Begriffs offen und vermeidet eine vorschnelle Festlegung auf das Strafurteil.
- source_word: ለዐዚዛን
  choice: für die Mächtigen
  rationale: Die Präposition ለ bezeichnet zunächst eine Beziehung oder Ausrichtung auf jemanden. Im Gerichtskontext kann sie auch gegnerisch verstanden werden; diese Möglichkeit wird in einer Fußnote festgehalten.
theological_decisions:
- issue: Wiedergabe des apokalyptischen Gottestitels
  choice: der Herr der Geister
  alternative: der Herr von Geistern
  rationale: „Herr der Geister“ bewahrt den für 1 Henoch charakteristischen Titel, ohne ihn mit einer späteren theologischen Formel gleichzusetzen.
- issue: Beziehung des Gerichts zu den Mächtigen
  choice: für die Mächtigen
  alternative: gegen die Mächtigen
  rationale: Die Hauptfassung wahrt den weiten Relationssinn der Präposition; die im Kontext naheliegende gegnerische Deutung bleibt als Alternative sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper apokalyptischer Redeform. Die direkte Rede folgt der klaren Satzstruktur des altäthiopischen Textes; grammatische und präpositionale Mehrdeutigkeiten werden nicht stillschweigend beseitigt, sondern in den Fußnoten ausgewiesen.
