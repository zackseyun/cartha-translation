base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/004.yaml
  text: Now we know that we ought to praise and bless the Lord of the kings[b][a], and the one who reigns over all the kings.
translation:
  language: de
  text: Jetzt wissen wir, dass wir den Herrn der Könige[b] preisen und segnen sollen[a] und den, der über alle Könige herrscht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Lasst uns den Herrn der Könige preisen und segnen.« Die ge''ezischen Verbformen können auch auffordernd beziehungsweise voluntativ verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich »Herr der Könige«; der ge'ezische Text verwendet hier nicht die verkürzte traditionelle Wendung »König der Könige«.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይእዜ
  choice: Jetzt
  rationale: Das Zeitadverb markiert die gegenwärtige, offenbar erst angesichts des Gerichts gewonnene Einsicht.
- source_word: አእመርነ
  choice: erkennen wir
  rationale: Die Form bezeichnet eine erlangte Einsicht; »erkennen« lässt diesen Vorgang deutlicher hervortreten als das bloß statische »wissen«.
- source_word: ከመ
  choice: dass
  rationale: Die Konjunktion leitet den Inhalt der gewonnenen Erkenntnis ein.
- source_word: ንሰብሖ ወንባርኮ
  choice: preisen und segnen sollen
  rationale: Die Formen der ersten Person Plural können nach ከመ einen voluntativen bzw. subjunktivischen Sinn tragen. »sollen« gibt hier die erkannte Verpflichtung wieder, ohne die mögliche Aufforderung zu verschweigen.
- source_word: ለእግዚኦሙ ለነገሥት
  choice: den Herrn der Könige
  rationale: Die unmittelbare Herrschaftsbezeichnung wird formal bewahrt und nicht zur traditionellen Formel »König der Könige« verdichtet.
- source_word: ወለዘ ይነግሥ ዲበ ኵሎሙ ነገሥት
  choice: den, der über alle Könige herrscht
  rationale: Die Relativkonstruktion beschreibt fortdauernde souveräne Herrschaft über die gesamte bestimmte Gruppe der Könige. Das deutsche »herrscht« gibt das königliche Regieren natürlich wieder.
theological_decisions:
- issue: Wiedergabe des zweiteiligen königlichen Hoheitstitels
  choice: Herr der Könige … der über alle Könige herrscht
  alternative: König der Könige
  rationale: Der ge'ezische Wortlaut nennt ausdrücklich den »Herrn der Könige« und fügt eine Relativklausel über sein Herrschen hinzu. Die bekannte Kurzformel würde diese Zweigliedrigkeit einebnen und eine nicht ausdrücklich vorliegende Formulierung eintragen.
- issue: Aussageweise der Verben in der ersten Person Plural
  choice: wir … sollen
  alternative: Lasst uns … preisen und segnen / wir werden … preisen und segnen
  rationale: Im Gerichtskontext bekennen die Sprecher, was sie nun als gebührend erkennen. »sollen« wahrt den Verpflichtungscharakter; die ebenfalls mögliche hortative Lesart wird in einer Fußnote genannt.
- issue: Identität von »Herr der Könige« und dem Herrschenden
  choice: 'Apposition: »den, der über alle Könige herrscht«'
  alternative: 'zwei getrennte Objekte: »und den, der über alle Könige herrscht«'
  rationale: Das wiederholte ge'ezische Objektzeichen kann formal ein weiteres Objekt einführen, doch sachlich bezeichnen beide Wendungen denselben Souverän. Die deutsche Apposition wahrt die Zweigliedrigkeit, ohne den missverständlichen Eindruck zweier verschiedener Gestalten zu erwecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Jetzt erkennen wir« hebt die späte Einsicht hervor; »preisen und segnen« bewahrt das feierliche Begriffspaar. Die bestimmten Könige bleiben als konkrete Herrschergruppe erkennbar. Sämtliche Fußnotenmarker stehen unmittelbar bei der jeweils erläuterten Wendung.
