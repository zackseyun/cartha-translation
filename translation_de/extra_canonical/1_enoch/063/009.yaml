base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/009.yaml
  text: And we pass away from before his face because of our deeds[c][b][a], and all our sins are counted in righteousness.
translation:
  language: de
  text: Und wegen unserer Taten gehen wir von seinem Angesicht hinweg[a], und alle unsere Sünden werden nach Gerechtigkeit angerechnet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich ist von einem Fortgehen „von seinem Angesicht“ die Rede; gemeint sein kann auch: aus seiner Gegenwart.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Alle unsere Sünden werden gerecht gezählt“ oder „in Gerechtigkeit angerechnet“. Die Formulierung ist gerichtssprachlich, lässt aber offen, ob „Gerechtigkeit“ die Art oder den Maßstab der Anrechnung bezeichnet.'
    reason: alternative_reading
lexical_decisions:
- source_word: ወነኀልፍ
  choice: und … gehen wir … hinweg
  rationale: Das Verb bezeichnet ein Vorübergehen, Fortgehen oder Verschwinden. „Hinweggehen“ bewahrt hier die räumliche und relationale Bewegung, ohne den Vorgang ausdrücklich als Tod zu deuten.
- source_word: እምገጹ
  choice: von seinem Angesicht
  rationale: Die konkrete semitische Bildsprache („von seinem Gesicht/Angesicht“) bleibt erhalten; sie bezeichnet zugleich das Entferntwerden aus seiner Gegenwart.
- source_word: በእንተ ምግባሪነ
  choice: wegen unserer Taten
  rationale: Die Präpositionalfügung gibt den Grund an; „Taten“ ist im Deutschen natürlich und wahrt den bekenntnishaften Gerichtskontext.
- source_word: ወኵሉ ኃጢአትነ
  choice: und alle unsere Sünden
  rationale: Die Wiedergabe erhält die umfassende Aussage des geʿezischen Ausdrucks.
- source_word: በጽድቅ
  choice: nach Gerechtigkeit
  rationale: Die Formulierung bewahrt den Bezug auf Gerechtigkeit und lässt offen, ob vor allem die gerechte Art der Anrechnung oder die Gerechtigkeit als Maßstab gemeint ist.
- source_word: ትኈለቍ
  choice: werden … angerechnet
  rationale: Das Verb gehört zum Bedeutungsfeld des Zählens und Berechnens. „Angerechnet“ passt zum gerichtlichen Ton, ohne das Bild auf bloße Arithmetik oder auf ein Abwägen festzulegen.
theological_decisions:
- issue: Konkrete Rede von Gottes Angesicht oder glättende Wiedergabe als Gegenwart
  choice: von seinem Angesicht
  alternative: aus seiner Gegenwart
  rationale: Die anschauliche Gerichtssprache des Ausgangstextes bleibt erhalten, während eine Fußnote die idiomatische Bedeutung erläutert.
- issue: Verhältnis zwischen der Anrechnung der Sünden und der Gerechtigkeit
  choice: alle unsere Sünden werden nach Gerechtigkeit angerechnet
  alternative: alle unsere Sünden werden gerecht angerechnet / in Gerechtigkeit gezählt
  rationale: Die Übersetzung erhält sowohl das Bild des Rechnens als auch die Gerechtigkeit als begleitenden Maßstab, ohne ausdrücklich festzulegen, ob die Wendung Art, Norm oder Sphäre des Gerichts bezeichnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter apokalyptischer Bildsprache. „Angesicht“ ist bewusst feierlicher als „Gesicht“, bleibt aber allgemein verständlich; die schwer aufzulösende Gerichtsformel wird im Haupttext knapp und in der Fußnote transparent wiedergegeben.
