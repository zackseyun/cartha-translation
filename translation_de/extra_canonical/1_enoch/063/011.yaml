base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/011.yaml
  text: And after this[a], their faces will be filled with darkness and shame before that Son of Man, and they will be driven away from before his face[c][b], and a sword will abide before his face in their midst.
translation:
  language: de
  text: Und danach werden ihre Gesichter vor jenem Menschensohn[a] mit Finsternis und Scham erfüllt werden. Sie werden von seinem Angesicht weggetrieben werden, und ein Schwert wird in ihrer Mitte bleiben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Menschensohn“ ist hier die im Zusammenhang der Bilderreden bereits eingeführte Bezeichnung einer endzeitlichen Gestalt; die Formulierung wird nicht von späterem neutestamentlichem Sprachgebrauch her erweitert.
    reason: cross_reference
  - marker: b
    text: 'Die vorgelegte Transkription wiederholt im letzten Satzteil „vor seinem Angesicht“. Der gedruckte Text von Charles sowie weitere Textzeugen lesen hier lediglich: „und ein Schwert wird in ihrer Mitte bleiben“.'
    reason: textual_variant
lexical_decisions:
- source_word: ይመልእ
  choice: werden … erfüllt werden
  rationale: Die resultativ-passive Bedeutung passt dazu, dass „ihre Gesichter“ das Subjekt und „Finsternis und Scham“ die erfüllenden Größen sind.
- source_word: ገጾሙ
  choice: ihre Gesichter
  rationale: Die konkrete Wiedergabe bewahrt das eindringliche apokalyptische Bild und klingt im heutigen Deutsch natürlicher als „Antlitze“.
- source_word: ጽልመተ
  choice: Finsternis
  rationale: „Finsternis“ erhält das starke Gerichtsbild, ohne festzulegen, ob es körperlich, seelisch oder symbolisch gemeint ist.
- source_word: ኃፍረተ
  choice: Scham
  rationale: Dies ist die direkte und im Zusammenhang natürliche Entsprechung.
- source_word: በቅድመ
  choice: vor
  rationale: Die räumliche und gerichtliche Vorstellung, vor dem Richter bloßgestellt zu sein, bleibt erhalten.
- source_word: ዝኩ ወልደ እጓለ እመሕያው
  choice: jener Menschensohn
  rationale: Die Formulierung bezeichnet in den Bilderreden eine bereits eingeführte endzeitliche Gestalt. „Menschensohn“ wahrt den örtlichen Sprachgebrauch, ohne spätere christologische Aussagen einzutragen.
- source_word: ይሰደዱ
  choice: werden … weggetrieben werden
  rationale: Die passive Form und der gerichtliche Charakter des Vertreibens werden gewahrt.
- source_word: እምቅድመ ገጹ
  choice: von seinem Angesicht
  rationale: Die Wendung bleibt bildhaft und nahe am räumlichen Ausdruck des Ge'ez; „aus seiner Gegenwart“ wäre flüssiger, aber stärker deutend.
- source_word: ሰይፍ
  choice: ein Schwert
  rationale: Die nicht näher bestimmte Form wird im Deutschen angemessen mit dem unbestimmten Artikel wiedergegeben.
- source_word: የኃድር
  choice: wird … bleiben
  rationale: Das Verb bezeichnet eine fortdauernde Gegenwart; „bleiben“ ist würdig und zugleich heutiges Deutsch.
- source_word: ማእከሎሙ
  choice: in ihrer Mitte
  rationale: Die räumliche Bildhaftigkeit bleibt bestehen, ohne die genaue Beziehung des Schwertes zur verurteilten Gruppe näher zu bestimmen.
theological_decisions:
- issue: Titelhafte oder allgemein-menschliche Wiedergabe der Menschensohn-Wendung
  choice: jener Menschensohn
  alternative: jener Mensch / jener Sohn des Menschen
  rationale: Im Zusammenhang der Bilderreden verweist die Wendung auf eine bestimmte endzeitliche Gestalt. Die traditionelle Bezeichnung wird beibehalten, aber nicht durch spätere dogmatische Deutungen erweitert.
- issue: Bezug und Funktion des Schwertes
  choice: ein Schwert wird in ihrer Mitte bleiben
  alternative: ein Schwert wird vor seinem Angesicht in ihrer Mitte bleiben
  rationale: Die knappe Form bewahrt das bedrohliche Gerichtsbild, ohne zu erklären, ob das Schwert ein Werkzeug, Symbol oder handelnder Vollstrecker des Gerichts ist. Die zusätzliche Ortsangabe beruht offenbar auf einer Wiederholung in der vorgelegten Transkription.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter apokalyptischer Bildsprache. „Angesicht“ wird nur in der festen, bildhaften Wendung verwendet; sonst steht das natürlichere „Gesichter“. Die syntaktische Schwierigkeit und die textkritische Unsicherheit des Schlusses werden nicht stillschweigend harmonisiert.
