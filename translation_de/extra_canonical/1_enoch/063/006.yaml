  source_fidelity: 'Die Übersetzung gibt den korrigierten Ge’ez-Sinn des Anfangs zutreffend wieder: ንስቲተ bezeichnet „ein wenig“, und ንትሜነይ ist „wir sehnen uns/wir begehren“. Auch die Abfolge von erfolgloser Ruhe-Suche, Forttreiben, Verlust des Lichts und bleibender Finsternis bleibt erhalten. Bei „Das Licht ist vor uns verschwunden“ wird እምቅድሜነ („von/vor uns“) im Deutschen jedoch missverständlich: Es kann heißen, das Licht sei vor den Augen der Sprechenden verschwunden, statt dass es ihnen entschwunden ist.'
  naturalness: Der Ton ist modern, klar und angemessen feierlich. „Wohnstatt“ ist verständlich und passt zum Bild. „Das Licht ist uns entschwunden“ ist idiomatischer und gibt die Verlustbewegung klarer wieder als „ist vor uns verschwunden“.
  terminology: „Ruhe“, „Finsternis“ und „Wohnstatt“ sind treffende, registergerechte Wiedergaben. Die Fußnoten behandeln die reale lexikalische Kürze von „ergreifen“ und die Unsicherheit von ምኅባሪነ sachlich, ohne den Sinn dogmatisch festzulegen.
