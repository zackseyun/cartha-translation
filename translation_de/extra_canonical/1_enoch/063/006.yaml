base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/063/006.yaml
  text: Now we desire a little rest[a], but we do not find it; we are driven away, and we cannot seize it, and the light has passed away from before us[c][b], and darkness will be our dwelling forever and ever.
translation:
  language: de
  text: Jetzt sehnen wir uns nach ein wenig Ruhe, doch wir finden sie nicht; wir werden fortgetrieben und können sie nicht ergreifen.[a] Das Licht ist uns entschwunden, und die Finsternis wird für immer und ewig unsere Wohnstatt sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich knapp: „und wir ergreifen nicht“. Gemeint ist wahrscheinlich, dass sie die ersehnte Ruhe nicht erlangen oder festhalten können.'
    reason: lexical_alternative
  - marker: b
    text: Das hier mit „Wohnstatt“ wiedergegebene ge’ezische Wort ist schwierig; auch „Aufenthaltsort“ oder „Behausung“ ist möglich. Der Zusammenhang beschreibt die Finsternis als ihr bleibendes Los.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይእዜኒ
  choice: Jetzt
  rationale: Zeitlicher Diskursmarker, der die gegenwärtige Einsicht der Sprechenden einleitet.
- source_word: ንስቲተ፡ ዕረፍተ፡ ንትሜነይ
  choice: sehnen wir uns nach ein wenig Ruhe
  rationale: ንስቲተ bedeutet hier „ein wenig“ und bestimmt ዕረፍተ („Ruhe“); ንትሜነይ ist die Verbform „wir begehren/ersehnen“. So bleibt die grammatische Zuordnung des Ge’ez erhalten.
- source_word: ወኢንረክብ
  choice: doch wir finden sie nicht
  rationale: Das Verb kann „finden“, „erlangen“ oder „erreichen“ bedeuten. „Finden“ setzt die Suche nach der ersehnten Ruhe natürlich fort.
- source_word: ንሰደድ
  choice: wir werden fortgetrieben
  rationale: Die passive Bedeutung entspricht der Gerichtsszene und vermeidet die stärkere Festlegung auf eine formelle Verbannung.
- source_word: ወኢንእኅዝ
  choice: und können sie nicht ergreifen
  rationale: Das Verb bezeichnet ein Ergreifen oder Festhalten; das ergänzte Pronomen bezieht sich wahrscheinlich auf die zuvor genannte Ruhe, ohne die knappe Ausgangsformulierung unnötig auszudeuten.
- source_word: ወብርሃን፡ እምቅድሜነ፡ ኀለፈ
  choice: Das Licht ist vor uns verschwunden
  rationale: Bewahrt das räumliche Bild des von ihnen weggehenden Lichtes in natürlichem, feierlichem Deutsch.
- source_word: ወጽልመት፡ ምኅባሪነ
  choice: und die Finsternis wird … unsere Wohnstatt sein
  rationale: Das schwierige ምኅባሪነ wird im Zusammenhang am plausibelsten als bleibender Aufenthaltsort oder Wohnort verstanden.
- source_word: ለዓለመ፡ ዓለም
  choice: für immer und ewig
  rationale: Gängige würdevolle Wiedergabe der verstärkten Ewigkeitsformel.
theological_decisions:
- issue: Bedeutung von Licht und Finsternis
  choice: Die Bilder bleiben als apokalyptische Gerichtssprache unaufgelöst stehen.
  alternative: Ausschließlich innerliche Verzweiflung oder ausschließlich physische Dunkelheit.
  rationale: Der Kontext legt moralische und eschatologische Bedeutung nahe, bestimmt aber nicht, dass die Bilder nur in einem einzigen Sinn zu verstehen sind.
- issue: Bezug des nicht möglichen Ergreifens
  choice: Das Pronomen „sie“ bezieht sich wahrscheinlich auf die ersehnte Ruhe.
  alternative: Ein ungenannter Zustand der Sicherheit oder Rettung.
  rationale: Die Ruhe ist das nächstliegende grammatische Bezugswort; wegen der knappen Formulierung wird die verbleibende Unsicherheit in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit feierlichem apokalyptischem Ton. Die Satzstruktur bleibt nah am Ge’ez, wird aber für einen natürlichen deutschen Lesefluss gegliedert. „Finsternis“ und „Wohnstatt“ bewahren die Würde und Bildkraft des Ausgangstextes.
