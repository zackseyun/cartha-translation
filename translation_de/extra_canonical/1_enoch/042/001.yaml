base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/042/001.yaml
  text: Wisdom found no place where she might dwell[b][a], and her dwelling was in the heavens.
translation:
  language: de
  text: Die Weisheit fand keinen Ort, wo sie wohnen konnte, und ihre Wohnstätte war in den Himmeln.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Äthiopischen steht hier der Plural „Himmeln“, eine in apokalyptischen Texten geläufige Bezeichnung für den himmlischen Bereich.
    reason: lexical_alternative
lexical_decisions:
- source_word: ጥበብ
  choice: die Weisheit
  rationale: Das Substantiv wird als personifizierte Gestalt wiedergegeben; der bestimmte Artikel und das feminine Pronomen erhalten diese Bildsprache.
- source_word: መካነ ኢረከበት
  choice: fand keinen Ort
  rationale: Die negative Verbform wird im Deutschen idiomatisch mit „keinen Ort finden“ ausgedrückt, ohne „Ort“ vorschnell als Wohnstätte zu spezifizieren.
- source_word: ኀበ ተኃድር
  choice: wo sie wohnen konnte
  rationale: Die Wendung bezeichnet einen Ort zum Bleiben oder Wohnen. „konnte“ gibt die Möglichkeit natürlich wieder; „wohnen“ bewahrt das Motiv der Behausung.
- source_word: ወሀለወ
  choice: und ... war
  rationale: Das einleitende ወ ist grundsätzlich kopulativ. „Und“ erhält die parataktische Struktur und vermeidet eine nicht zwingend im Ausgangstext markierte adversative Zuspitzung.
- source_word: ማኅደራ
  choice: ihre Wohnstätte
  rationale: Der Ausdruck bezeichnet ihren Wohn- oder Aufenthaltsort und führt die Personifikation sowie das Wohnungsmotiv fort.
- source_word: ውስተ ሰማያት
  choice: in den Himmeln
  rationale: Der Plural des ge'ezischen Ausdrucks wird erhalten und entspricht der kosmisch-apokalyptischen Redeweise.
theological_decisions:
- issue: Weisheit als personifizierte Gestalt oder als abstrakte Eigenschaft
  choice: 'Personifikation bewahren: „Die Weisheit ... sie ... ihre Wohnstätte“'
  alternative: „Für Weisheit fand sich kein Ort zum Wohnen“
  rationale: Der Ausgangstext stellt Weisheit als handelndes Subjekt mit eigener Wohnstätte dar. Eine abstrakte Wiedergabe würde die weisheitliche Bildsprache abschwächen.
- issue: Verhältnis der beiden Satzhälften
  choice: kopulativ-parataktisch mit „und“
  alternative: adversativ mit „aber“
  rationale: Das ge'ezische ወ kann kontextuell adversativ verstanden werden, ist hier jedoch zunächst kopulativ. „Und“ wahrt die echte Mehrdeutigkeit, ohne einen scharfen Gegensatz festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die personifizierte Weisheit und der Plural „Himmel“ bleiben erhalten; die Satzverknüpfung folgt bewusst der schlichten Parataxe des Ausgangstextes.
