base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/104/001.yaml
  text: I swear to you that in heaven the angels remember you for good before the glory of the Great One[a][b][c].
translation:
  language: de
  text: 'Ich schwöre euch: Im Himmel denken die Engel zu eurem Guten an euch vor der Herrlichkeit des Großen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die vorliegende geezische Zeile bricht nach „vor“ ab. „der Herrlichkeit des Großen“ wird nach der Parallelüberlieferung und dem gesicherten Zusammenhang des Verses ergänzt.
    reason: textual_variant
lexical_decisions:
- source_word: እምሕል፡ ለክሙ፡
  choice: Ich schwöre euch
  rationale: Die geezische Wendung ist eine Schwurformel in der ersten Person und richtet sich an eine Mehrzahl.
- source_word: በሰማይ፡
  choice: im Himmel
  rationale: Die Präposition und das Substantiv bezeichnen klar den himmlischen Ort.
- source_word: ይዜከሩ፡ መላእክት፡
  choice: gedenken die Engel
  rationale: Das Verb bezeichnet Erinnern beziehungsweise Gedenken; መላእክት bedeutet eindeutig „Engel“. Das gehobene, aber verständliche „gedenken“ bewahrt den positiven, feierlichen Sinn.
- source_word: በእንቲአክሙ፡ ለሠናይ፡
  choice: euer zum Guten
  rationale: Die Wendung bedeutet, dass das Gedenken den Angesprochenen gilt und auf ihr Gutes beziehungsweise zu ihren Gunsten ausgerichtet ist.
- source_word: በ*ቅድመ፡
  choice: vor
  rationale: Der sichtbare Text endet mit „vor“; das folgende Objekt ist in der überlieferten Zeile abgeschnitten und wird aufgrund der Parallelüberlieferung und des gesicherten Verskontexts ergänzt.
theological_decisions:
- issue: Art des himmlischen Gedenkens
  choice: Die Engel gedenken der Angesprochenen zum Guten.
  alternative: Das Gedenken als ausdrücklich schriftlichen Gerichtsakt wiederzugeben.
  rationale: Der sichtbare geezische Text spricht vom Gedenken durch Engel, nicht ausdrücklich von einem Eintrag in ein himmlisches Buch. Die Übersetzung bewahrt daher das Bild, ohne zusätzliche Gerichtsbuch-Metaphorik einzuführen.
- issue: Bezeichnung Gottes
  choice: der Große
  alternative: der Erhabene
  rationale: „Der Große“ gibt den traditionellen Titel direkt wieder und vermeidet eine konfessionell oder interpretativ stärker geprägte Ausdeutung.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Schwurformel bleibt direkt; „euer gedenken“ ist bewusst leicht gehoben, aber im religiös-apokalyptischen Zusammenhang verständlich. Die unvollständige Schlusswendung wird transparent gekennzeichnet.
