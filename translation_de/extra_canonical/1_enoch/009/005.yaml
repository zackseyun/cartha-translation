base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/005.yaml
  text: You have made all things[a], and authority over all is with you; and all things are uncovered and laid bare before you, and you see all things, and there is nothing that can hide itself from you.
translation:
  language: de
  text: Du hast alles gemacht, und die Herrschaft über alles liegt bei dir. Alles ist vor dir unverhüllt und offenbar[a]; du siehst alles, und nichts kann sich vor dir verbergen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Alles ist vor dir aufgedeckt und offenbar.“ Die beiden Ausdrücke verstärken das Bild, dass vor Gott alles vollständig offenliegt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ገበርከ
  choice: du hast … gemacht
  rationale: Das Verb bezeichnet ein Machen oder Tun. „Gemacht“ bewahrt im kosmischen Zusammenhang die umfassende göttliche Urheberschaft, ohne die im Verb selbst nicht zwingend enthaltene Vorstellung einer Schöpfung aus dem Nichts ausdrücklich einzutragen.
- source_word: ስልጣነ
  choice: Herrschaft
  rationale: Das Substantiv bezeichnet Herrschaftsmacht oder Autorität. „Herrschaft“ gibt Gottes umfassende souveräne Gewalt in natürlichem, würdigem Deutsch wieder.
- source_word: ምስሌከ
  choice: liegt bei dir
  rationale: Wörtlich bedeutet die Wendung „bei dir“. „Liegt bei dir“ bewahrt dieses Bild und drückt zugleich verständlich aus, dass die Herrschaft Gott zukommt.
- source_word: ክሡት
  choice: unverhüllt
  rationale: Der Ausdruck bezeichnet etwas Aufgedecktes oder Entblößtes. „Unverhüllt“ erhält das konkrete Bild vollständiger Offenheit vor Gott und klingt im Deutschen natürlicher als „aufgedeckt“.
- source_word: ግሁድ
  choice: offenbar
  rationale: Zusammen mit „unverhüllt“ verstärkt das Wort die Aussage, dass alles vollständig offen zutage liegt. Die zwei Ausdrücke werden nicht zu einem abstrakten „bekannt“ zusammengezogen.
- source_word: ትሬኢ
  choice: du siehst
  rationale: Die schlichte Wiedergabe erhält das konkrete Sehen und vermeidet eine nachträgliche Ersetzung durch den theologischen Fachbegriff „allwissend“.
- source_word: ዘይትከሀል
  choice: kann
  rationale: Die Form bezeichnet Fähigkeit oder Möglichkeit. Im Deutschen gibt „kann“ die Aussage knapp und idiomatisch wieder.
- source_word: ይትኀባእ
  choice: sich verbergen
  rationale: 'Die reflexive beziehungsweise passive Nuance wird durch „sich verbergen“ erhalten: Nichts vermag sich Gottes Blick zu entziehen.'
theological_decisions:
- issue: Ob die Aussage mit abstrakten Lehrbegriffen wie Allmacht und Allwissenheit wiederzugeben ist
  choice: Die konkreten Aussagen über Machen, Herrschaft, Offenliegen und Sehen bleiben erhalten.
  alternative: Du bist allmächtig und allwissend; alles ist dir bekannt.
  rationale: Der Vers legt Gottes umfassende Souveränität und Erkenntnis nahe, formuliert sie jedoch in konkreten Bildern. Die Übersetzung bewahrt diese Gestalt, statt sie durch spätere dogmatische Kurzbegriffe zu ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Gebetsanrede „du“ bleibt erhalten. Kurze Hauptsätze bewahren den feierlichen Parallelismus, ohne altertümliche Ausdrucksweisen zu verwenden.
