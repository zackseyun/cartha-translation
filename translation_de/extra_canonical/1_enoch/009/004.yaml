base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/004.yaml
  text: And they said to their Lord[a], the King, “For you are Lord of lords, God of gods, and King of kings, and the throne of your glory is through all the generations of eternity, and your name is holy and glorious through all eternity[d][c][b], and blessed.”
translation:
  language: de
  text: 'Und sie sprachen zum Herrn der Könige[a]: »Denn du bist der Herr der Herren, der Gott der Götter und der König der Könige. Der Thron deiner Herrlichkeit währt durch alle Generationen der Ewigkeit, und dein Name ist heilig und herrlich[b] für alle Ewigkeit und gesegnet.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die äthiopische Konstruktion wird hier als „zum Herrn der Könige“ verstanden. Wegen ihrer gedrängten Form ist auch die Lesart „zu ihrem Herrn, dem König“ vertreten worden.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „gepriesen“. Das äthiopische Wort kann Herrlichkeit ebenso wie das Gepriesensein ausdrücken.'
    reason: lexical_ambiguity
  - marker: c
    text: 'Ein unsicher überliefertes, in der Vorlage eingeklammertes Wort fügt hinzu: „und geehrt“ oder „und herrlich“.'
    reason: textual_variant
lexical_decisions:
- source_word: ለእግዚኦሙ ለነገሥት
  choice: zum Herrn der Könige
  rationale: 'Die suffigierte Form ist am besten als proleptische Konstruktion zu verstehen: Das Suffix an „Herr“ nimmt „der Könige“ vorweg. So bleibt auch die anschließende Steigerungsformel schlüssig.'
- source_word: እስመ
  choice: denn
  rationale: Die Konjunktion leitet ausdrücklich die Begründung beziehungsweise den Inhalt der himmlischen Anrede ein und darf nicht ausgelassen werden.
- source_word: እግዚኦሙ ለአጋእዝት
  choice: der Herr der Herren
  rationale: Die traditionelle Genitivformel bewahrt den feierlichen Titel und die Parallelität mit den beiden folgenden Titeln.
- source_word: አምላኮሙ ለአማልክት
  choice: der Gott der Götter
  rationale: Die formelhafte Wiedergabe erhält den Ausdruck göttlicher Überordnung, ohne die im Text genannten „Götter“ interpretierend umzudeuten.
- source_word: ንጉሦሙ ለነገሥት
  choice: der König der Könige
  rationale: Diese Wiedergabe vollendet die dreigliedrige, bewusst wiederholende Titelfolge.
- source_word: መንበረ ስብሐቲከ
  choice: der Thron deiner Herrlichkeit
  rationale: Die konkrete Thronvorstellung und die Genitivkonstruktion des apokalyptischen Bildes bleiben erhalten.
- source_word: ውስተ ኵሉ ትውልደ ዓለም
  choice: durch alle Generationen der Ewigkeit
  rationale: In dieser doxologischen Zeitformel bezeichnet ዓለም eine unbeschränkte Dauer beziehungsweise Ewigkeit, nicht die räumliche Welt.
- source_word: ስምከ ቅዱስ ወስቡሕ
  choice: dein Name ist heilig und herrlich
  rationale: ስቡሕ kann sowohl den Zustand „herrlich“ als auch den Gedanken „gepriesen“ ausdrücken. „Herrlich“ fügt sich als Prädikatsadjektiv unmittelbar zu „heilig“, während die andere Nuance dokumentiert wird.
- source_word: ወቡሩክ
  choice: und gesegnet
  rationale: Das letzte sichere Prädikat bleibt gemäß der äthiopischen Wortfolge nach der Zeitbestimmung stehen.
theological_decisions:
- issue: Dreifache Hoheitstitel Gottes
  choice: Die Formeln „Herr der Herren, Gott der Götter und König der Könige“ werden vollständig bewahrt.
  alternative: Zusammenfassung als „höchster Herrscher und Gott“
  rationale: Die Wiederholung gehört zur Rhetorik und zur Aussage über Gottes unüberbietbare Hoheit; eine Zusammenfassung würde diese Struktur und Spannung einebnen.
- issue: Bedeutung von „Gott der Götter“
  choice: Die Formulierung wird ohne erklärende Umdeutung wiedergegeben.
  alternative: „Gott über alle Mächte“
  rationale: Die Übersetzung soll weder eine Aussage über das Wesen der genannten Götter hinzufügen noch deren Bezeichnung beseitigen.
- issue: Unsicherer Schlusszusatz ወከቡድ
  choice: Der eingeklammerte Zusatz wird nicht in den Haupttext aufgenommen, sondern in einer Fußnote genannt.
  alternative: „und geehrt“ beziehungsweise „und herrlich“ in den Haupttext aufnehmen
  rationale: Die Kennzeichnung der Vorlage weist auf textliche Unsicherheit hin; die sichere Lesart bleibt im Text, die mögliche Erweiterung transparent in der Anmerkung.
translation_notes:
  register: Feierliches, aber gegenwärtiges Standarddeutsch. Die formelhafte Wiederholung der Hoheitstitel und das konkrete Thronbild bleiben erhalten. „Währt“ ergänzt idiomatisch die im Äthiopischen fehlende Kopula und macht die zeitliche Aussage verständlich, ohne sie inhaltlich auszuweiten.
