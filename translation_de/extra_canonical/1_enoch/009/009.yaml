base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/009.yaml
  text: and the women have borne giants[b][a], and by this the whole earth has been filled with blood.
translation:
  language: de
  text: Und die Frauen haben Riesen geboren[a][b], und dadurch ist die ganze Erde mit Blut erfüllt worden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die knappe Aussage bezieht sich wahrscheinlich auf die riesenhaften Nachkommen aus den unerlaubten Verbindungen der Wächter mit den Frauen im vorangehenden Zusammenhang.
    reason: cross_reference
  - marker: b
    text: 'Oder: »Und Frauen haben Riesen geboren.«'
    reason: previous_rendering
lexical_decisions:
- source_word: አንስት
  choice: die Frauen
  rationale: Das Pluralnomen bezeichnet Frauen. Der bestimmte Artikel greift zusammen mit der hervorhebenden Partikel -ሰ die zuvor erwähnten Frauen wieder auf; »Ehefrauen« würde eine nicht ausdrücklich bezeichnete eheliche Beziehung voraussetzen.
- source_word: ወለዳ
  choice: haben … geboren
  rationale: Die Form bezeichnet das Gebären beziehungsweise Hervorbringen; das Perfekt gibt im Deutschen die abgeschlossene Handlung mit gegenwärtiger Folge natürlich wieder.
- source_word: ረዓይተ
  choice: Riesen
  rationale: Im Zusammenhang der Wächtererzählung bezeichnet das Wort die riesenhaften Nachkommen der unerlaubten Verbindungen. Die traditionelle Wiedergabe bewahrt diesen konkreten Bezug.
- source_word: በዘ
  choice: dadurch
  rationale: Das knappe Adverb erhält den folgernden beziehungsweise ursächlichen Zusammenhang, ohne ihn weiter auszudeuten.
- source_word: መልአት
  choice: ist … erfüllt worden
  rationale: Die Verbform beschreibt, dass etwas voll geworden ist. Das deutsche Perfekt Passiv bewahrt den abgeschlossenen Vorgang und seinen fortdauernden Zustand.
- source_word: ኵላ ምድር
  choice: die ganze Erde
  rationale: Die Wendung hat hier im kosmischen Rahmen den umfassenden Sinn »die ganze Erde«; »das ganze Land« wäre unnötig einschränkend.
- source_word: ደመ
  choice: mit Blut
  rationale: Die wörtliche Wiedergabe bewahrt das schroffe apokalyptische Bild; »Blutvergießen« wäre bereits eine erklärende Deutung.
theological_decisions:
- issue: Wie ausdrücklich der ursächliche beziehungsweise folgernde Zusammenhang wiederzugeben ist
  choice: und dadurch ist die ganze Erde mit Blut erfüllt worden
  alternative: und deshalb ist die ganze Erde voll Blut
  rationale: Das Ge’ez stellt den Zusammenhang knapp her. »Dadurch« hält sowohl Mittel als auch Folge offen und vermeidet eine erklärende Erweiterung.
- issue: Identität der gebärenden Frauen und der Riesen
  choice: die Frauen … Riesen
  alternative: Frauen … Nachkommen
  rationale: Der bestimmte Bezug nimmt die Frauen aus dem vorangehenden Kontext wieder auf, während »Riesen« den traditionellen und kontextuell gestützten Sinn wiedergibt. Die Übersetzung fügt keine nähere dogmatische Erklärung ihrer Herkunft hinzu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper apokalyptischer Bildsprache. »Dadurch« ist idiomatischer als ein formales »hierdurch«, ohne die Mehrdeutigkeit zwischen Ursache und Folge aufzulösen.
