base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/008.yaml
  text: And they went to the daughters of men on the earth[a], and they lay with them, with those women[c][b], and they defiled themselves and revealed to them every sin.
translation:
  language: de
  text: Und sie gingen zu den Menschentöchtern auf der Erde und lagen bei ihnen, bei jenen Frauen[a]. Sie verunreinigten sich und offenbarten ihnen jede Sünde[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei jenen Ehefrauen“. Das Wort kann sowohl Frauen als auch Ehefrauen bezeichnen; der Zusammenhang verlangt hier keinen bestimmten Ehestatus.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „machten ihnen jede Sünde bekannt“. Das Verb kann das Offenlegen, Sichtbarmachen oder Bekanntmachen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሖሩ ኀበ አዋልደ ሰብእ
  choice: sie gingen zu den Menschentöchtern
  rationale: Die Bewegungsformulierung wird im Zusammenhang mit dem folgenden sexuellen Ausdruck verständlich. „Menschentöchter“ bewahrt knapp den Kontrast zwischen den menschlichen Frauen und den himmlischen Wesen.
- source_word: በዲበ ምድር
  choice: auf der Erde
  rationale: Die räumliche Angabe bleibt erhalten und klingt im Deutschen natürlich; zugleich wahrt sie den kosmischen Gegensatz von Himmel und Erde.
- source_word: ወስከቡ ምስሌሆን
  choice: und lagen bei ihnen
  rationale: „Bei jemandem liegen“ ist eine verständliche, würdige deutsche Wendung für den hier gemeinten Geschlechtsverkehr und vermeidet eine unnötig umgangssprachliche Formulierung.
- source_word: ምስለ እልኩ አንስት
  choice: bei jenen Frauen
  rationale: Die wiederholende Fügung wird beibehalten. „Frauen“ ist kontextuell naheliegend, ohne einen Ehestatus vorauszusetzen.
- source_word: ወረኵሱ
  choice: Sie verunreinigten sich
  rationale: Die reflexive Wiedergabe erhält sowohl die moralische als auch die kultische Bedeutungsebene des Verbs.
- source_word: ወአግሀዱ ሎን
  choice: und offenbarten ihnen
  rationale: Das Verb bezeichnet ein Offenlegen oder Enthüllen. „Offenbaren“ passt zur Weitergabe verbotenen Wissens, ohne die Aussage auf bloßes Unterrichten zu verengen.
- source_word: ኵሎ ኃጢአተ
  choice: jede Sünde
  rationale: Die umfassende Anklage der ge’ezischen Formulierung wird formal und idiomatisch wiedergegeben.
theological_decisions:
- issue: Art der von den Wächtern bewirkten Verderbnis
  choice: Der Vers nennt sowohl die unerlaubte sexuelle Verbindung als auch die Offenbarung von Sünde.
  alternative: Die Schlusswendung könnte enger auf bestimmte magische oder technische Geheimnisse bezogen werden.
  rationale: Der überlieferte ge’ezische Text spricht allgemein von „jeder Sünde“. Die Übersetzung bewahrt diese weite moralische Aussage und engt sie nicht auf eine bestimmte Art verbotenen Wissens ein.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „bei ihnen, bei jenen Frauen“ folgt der betonten Wiederaufnahme im Ausgangstext, ohne sie stilistisch einzuebnen.
