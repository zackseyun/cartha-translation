base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/003.yaml
  text: And now[a], to you, the holy ones of heaven, the souls of men make their plea, saying[b], ‘Bring our case before the Most High.’
translation:
  language: de
  text: 'Und nun bringen die Seelen der Menschen euch, den Heiligen des Himmels, ihre Bitte vor und sagen: »Bringt unsere Rechtssache[a] vor den Höchsten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Verschafft uns Recht vor dem Höchsten« beziehungsweise: »Tragt unseren Rechtsfall dem Höchsten vor.« Der äthiopische Ausdruck ist juristisch geprägt und kann sowohl die Rechtssache als auch die erbetene gerechte Entscheidung oder das Rechtbegehren bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: Und nun
  rationale: Bewahrt den zeitlich-rhetorischen Übergang knapp und idiomatisch.
- source_word: ለክሙ ለቅዱሳነ ሰማይ
  choice: euch, den Heiligen des Himmels
  rationale: Gibt den Dativ der Anrede und die apokalyptische Bezeichnung der himmlischen Wesen wieder, ohne sie ausdrücklich enger als Engel zu bestimmen.
- source_word: ይስእዩ ... እንዘ ይብሉ
  choice: bringen ... ihre Bitte vor und sagen
  rationale: Natürliches modernes Deutsch für das Bitten beziehungsweise Vortragen einer Petition; die Verbindung mit der wörtlichen Rede bleibt erhalten.
- source_word: ነፍሳተ ሰብእ
  choice: die Seelen der Menschen
  rationale: Bewahrt die anthropologische Ausdrucksweise und vermeidet das heute möglicherweise ausschließlich männlich verstandene „Seelen der Männer“.
- source_word: አብኡ ለነ ፍትሐ
  choice: Bringt unsere Rechtssache
  rationale: „Rechtssache“ erhält den forensischen Sinn als zur Entscheidung vorzubringendes Anliegen, ohne ein bereits gefälltes Urteil vorauszusetzen.
- source_word: ኀበ ልዑል
  choice: vor den Höchsten
  rationale: Entspricht der Bewegung in die Gegenwart des göttlichen Gerichts und klingt im Deutschen idiomatisch.
theological_decisions:
- issue: Identität der „Heiligen des Himmels“
  choice: Als himmlische heilige Wesen bezeichnet, ohne explizite Gleichsetzung im Vers
  alternative: Engel; menschliche Heilige im Himmel
  rationale: Der Kontext legt himmlische Mittler beziehungsweise Engel nahe; die Übersetzung bewahrt jedoch die weitere Bezeichnung des Ausgangstextes.
- issue: Bedeutung von ፍትሐ
  choice: Rechtssache als juristisches Anliegen, das vor den Höchsten gebracht wird
  alternative: Recht, Gerechtigkeit, Urteil oder Rechtfertigung
  rationale: Der Ausdruck ist forensisch, kann aber sowohl die Sache selbst als auch die erbetene gerechte Entscheidung anklingen lassen. Die Fußnote hält diese Bedeutungsbreite offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht gehobenem apokalyptischem Ton. Die Satzstellung wurde gegenüber einer streng formalen Wiedergabe geglättet, damit eindeutig bleibt, dass die Seelen ihre Bitte an die Heiligen des Himmels richten.
