  text: And they said among themselves[b][a], “The voice of their outcry has reached the gates of heaven.”
translation:
  language: de
  text: 'Und sie sagten zueinander: »Die Stimme ihres Aufschreis stieg empor; die Erde schrie bis zum Tor des Himmels.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der knappe Satzbau lässt auch zu, die Schlussangabe auf den Aufschrei oder auf beide Aussagen zu beziehen: »Die Stimme ihres Aufschreis stieg bis zum Tor des Himmels empor; die Erde schrie.«'
    reason: alternative_reading
lexical_decisions:
- source_word: ወይቤሉ
  choice: Und sie sagten
  rationale: Das übliche erzählende Redeverb leitet hier die Äußerung ein.
- source_word: በበይናቲሆሙ
  choice: zueinander
  rationale: Die reziproke Wendung wird im modernen Deutschen natürlich als „zueinander“ wiedergegeben.
- source_word: ቃለ ጽራኃቲሆሙ
  choice: Die Stimme ihres Hilferufs
  rationale: „Stimme“ bewahrt das konkrete Klangbild; „Hilferuf“ vermittelt den dringlichen Ruf der Bedrängten.
- source_word: ዐረቀ
  choice: stieg empor
  rationale: Die überlieferte Form dürfte für ዐርገ stehen und bezeichnet ein Hinaufsteigen; sie bildet ein eigenes Prädikat zum vorausgehenden „Stimme“.
- source_word: ጸርሐት ምድር
  choice: die Erde schrie
  rationale: ጸርሐት wird als feminines Verb im Perfekt verstanden, dessen Subjekt die feminine „Erde“ ist. So bleibt die Personifikation der Erde erhalten.
- source_word: እስከ አንቀጸ ሰማይ
  choice: bis zum Tor des Himmels
  rationale: Die konkrete apokalyptische Raumvorstellung wird bewahrt; der Ausdruck steht im Singular und bezeichnet das Himmelstor.
theological_decisions:
- issue: Bezeichnet der Vers nur den Ruf der Opfer oder zusätzlich den Schrei der Erde?
  choice: 'Zwei parallele Aussagen: Der Hilferuf steigt empor, und die Erde selbst schreit.'
  alternative: Nur der Hilferuf der Opfer erreicht das Himmelstor; „Erde“ bezeichnet dabei lediglich seinen Ausgangspunkt.
  rationale: Die feminine Verbform ጸርሐት lässt sich unmittelbar auf ምድር („Erde“) beziehen. Die Übersetzung bewahrt deshalb die Personifikation, ohne den menschlichen Hilferuf mit ihr gleichzusetzen.
- issue: Worauf bezieht sich „bis zum Tor des Himmels“?
  choice: In der Hauptübersetzung schließt die Zielangabe an den Schrei der Erde an.
  alternative: Die Zielangabe kann inhaltlich auch das Emporsteigen des Hilferufs bestimmen oder beide parallelen Aussagen umfassen.
  rationale: Die Wortstellung setzt die Zielangabe nach „die Erde schrie“, lässt ihren weiteren Bezug im knappen poetischen Satzbau jedoch offen; diese Unschärfe wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus und die Personifikation der Erde bleiben erhalten; eine echte syntaktische Mehrdeutigkeit wird nicht stillschweigend aufgelöst.
