    issue: Unnatürliche und syntaktisch vorübergehend missverständliche Stellung von „über die“ vor dem Relativsatz.
    rationale: Die Bezugsgruppe wird erst nach dem Infinitiv erläutert. Die Ergänzung „diejenigen“ macht klar, dass Semjasas Vollmacht sich auf die bei ihm Befindlichen richtet, ohne den Sinn zu verändern.
  revised_text: Und Semjasa, dem du Vollmacht gegeben hast, über diejenigen zu herrschen, die bei ihm sind[a].
