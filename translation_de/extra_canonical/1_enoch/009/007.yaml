base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/007.yaml
  text: And Semyaza[c][b][a], to whom you gave authority to rule over those who are with him.
translation:
  language: de
  text: Und Semjasa, dem du Vollmacht gegeben hast, über diejenigen zu herrschen, die bei ihm sind[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die mit ihm zusammen sind“. Die Wendung kann seine Gefährten, die mit ihm Verbundenen oder die mit ihm Versammelten bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ስምያዛ
  choice: Semjasa
  rationale: Der Personenname wird in einer im Deutschen gut lesbaren, quellenahen Form transliteriert.
- source_word: ዘአንተ ወሀብኮ
  choice: dem du ... gegeben hast
  rationale: Die Wendung wird relativisch auf Semjasa bezogen; das angesprochene Du ist Gott, der Semjasa die Vollmacht gegeben hat.
- source_word: ስልጣነ
  choice: Vollmacht
  rationale: „Vollmacht“ bezeichnet hier übertragene Herrschaftsbefugnis und vermeidet den Eindruck eigenständiger souveräner Macht.
- source_word: ይኵንን
  choice: zu herrschen über
  rationale: Das eigenständige Verb des Regierens oder Herrschens wird ausdrücklich wiedergegeben und nicht lediglich in einer Präposition aufgelöst.
- source_word: እለ ምስሌሁ ኅቡረ
  choice: die bei ihm sind
  rationale: Die Formulierung bewahrt den offenen Sinn von Gefährten, Verbündeten oder gemeinsam mit ihm versammelten Wesen, ohne die Gruppe im Haupttext enger festzulegen.
theological_decisions:
- issue: Art von Semjasas Stellung
  choice: Von Gott übertragene Vollmacht über die mit Semjasa verbundenen Wesen
  alternative: Eigenständige Herrschaft Semjasas oder bloße Gleichstellung innerhalb der Gruppe
  rationale: Die Konstruktion des Gebens kennzeichnet die Vollmacht als verliehen; zugleich bleibt die genaue Beziehung zu den bei ihm Befindlichen offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzfragmentcharakter des Verses wird beibehalten, da er syntaktisch an den vorausgehenden Kontext anschließt. „Semjasa“ folgt einer geläufigen deutschen Transliteration; „Vollmacht“ hebt den übertragenen Charakter seiner Stellung hervor.
