  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die maßgebliche Syntax richtig wieder: Semjasa ist das Bezugswort des Relativsatzes, während das angesprochene „du“ Gott bezeichnet. Die verliehene Vollmacht und das eigenständige Verb des Herrschens bleiben erhalten. „die bei ihm sind“ bewahrt die offene Bedeutung der mit ihm verbundenen bzw. versammelten Gruppe.'
  naturalness: Die vorliegende Wortstellung „Vollmacht gegeben hast, über die zu herrschen, die bei ihm sind“ ist verständlich, aber schwerfällig und erzeugt durch das vorgezogene „über die“ kurzzeitig eine unklare Satzstruktur. „über diejenigen zu herrschen, die bei ihm sind“ ist modernes, klares Standarddeutsch und erhält den fragmentarischen Anschlusscharakter des Verses.
  terminology: „Vollmacht“ ist für die verliehene Autorität passend und vermeidet eine Überhöhung zu eigenständiger Herrschaft. „Semjasa“ ist als deutsche Namensform vertretbar. Es besteht kein Anlass, die unbestimmte Gruppenbezeichnung im Haupttext zu „Wächtern“ einzuengen.
  issues:
