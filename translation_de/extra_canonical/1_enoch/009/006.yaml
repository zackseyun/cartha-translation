base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/006.yaml
  text: You see what Azazel has done[a]—how he has taught all unrighteousness upon the earth and revealed the hidden things of the world that are done in the heavens[c][b], which men learned.
translation:
  language: de
  text: 'Du siehst, was Azazel getan hat: Er hat alle Ungerechtigkeit auf der Erde gelehrt und die verborgenen Dinge der Welt[a] enthüllt, die in den Himmeln geschehen und die die Menschen kennengelernt haben.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das ge'ezische Wort kann hier außer »Welt« auch »Zeitalter« oder »Ewigkeit« bedeuten; entsprechend wäre auch »die Geheimnisse des Zeitalters« beziehungsweise »die verborgenen Dinge der Ewigkeit« möglich.
    reason: lexical_alternative
  - marker: b
    text: 'Der Schluss des ge''ezischen Satzes ist schwierig; annähernd wörtlich: »die in den Himmeln geschehen – die Menschen erkannten [sie]«. Eine andere Textüberlieferung wurde im Sinn von »nach denen die Menschen zu forschen suchten« verstanden.'
    reason: textual_variant
lexical_decisions:
- source_word: ርኢከ
  choice: Du siehst
  rationale: Die Form richtet sich in der zweiten Person Singular an den himmlischen Adressaten. Das Präsens bewahrt die Unmittelbarkeit des Anrufs; »du hast gesehen« wäre ebenfalls möglich.
- source_word: ዘገብረ አዛዝኤል
  choice: was Azazel getan hat
  rationale: Die Relativkonstruktion bezeichnet Azazels vollendetes Handeln mit fortdauernder Bedeutung für die vorgebrachte Anklage.
- source_word: ዘመሀረ ኵሎ ዓመፃ
  choice: Er hat alle Ungerechtigkeit … gelehrt
  rationale: Das Verb bezeichnet Lehren oder Unterweisen; ዓመፃ umfasst moralisches Unrecht breit und wird daher nicht auf Gewalt oder gesellschaftliche Ungerechtigkeit verengt.
- source_word: በዲበ ምድር
  choice: auf der Erde
  rationale: Die Wendung bezeichnet den irdischen Bereich, in dem sich Azazels verderblicher Unterricht auswirkt. Die Formulierung ist im heutigen Standarddeutsch natürlich und würdig.
- source_word: ወአግሀደ
  choice: und … enthüllt
  rationale: Das Verb bezeichnet das Offenlegen von etwas Verborgenem. »Enthüllt« erhält sowohl den apokalyptischen Ton als auch den unerlaubten Charakter der Preisgabe.
- source_word: ኅቡኣተ ዓለም
  choice: die verborgenen Dinge der Welt
  rationale: ዓለም kann je nach Zusammenhang Welt, Zeitalter oder Ewigkeit bezeichnen. »Welt« wahrt hier die räumlich-kosmische Gegenüberstellung von Erde und Himmeln, ohne die Mehrdeutigkeit in eine technische Deutung aufzulösen.
- source_word: እለ ይትገበሩ በሰማያት
  choice: die in den Himmeln geschehen
  rationale: Die passive beziehungsweise unpersönliche Form verweist auf Vorgänge im himmlischen Bereich. Der Plural »Himmel« gibt den apokalyptisch-semitischen Sprachgebrauch als »in den Himmeln« wieder.
- source_word: አመረ ሰብእ
  choice: die Menschen kennengelernt haben
  rationale: Die schwierige Schlusswendung besagt im vorliegenden ge'ezischen Text am ehesten, dass Menschen diese verborgenen Dinge erkannten oder kennenlernten. »Kennengelernt haben« gibt den Erkenntnisgewinn wieder, ohne ein im Verb nicht vorhandenes Streben einzutragen.
theological_decisions:
- issue: Bedeutungsumfang von ዓመፃ
  choice: alle Ungerechtigkeit
  alternative: alles Unrecht; alle Gesetzlosigkeit
  rationale: Die Anklage betrifft umfassende moralische Verderbnis. »Ungerechtigkeit« erhält diese ethische und theologische Weite, ohne den Begriff ausschließlich auf Gewalt oder soziale Rechtsverletzung zu beziehen.
- issue: Art und Bereich der verborgenen Dinge
  choice: die verborgenen Dinge der Welt, die in den Himmeln geschehen
  alternative: die Geheimnisse des Zeitalters, die in den Himmeln vollzogen werden; die verborgenen Dinge der Ewigkeit
  rationale: Die Formulierung lässt offen, ob ዓለም primär Welt, Zeitalter oder Ewigkeit bezeichnet, und vermeidet es, die unerlaubte Enthüllung vorschnell mit späteren theologischen Kategorien zu erklären.
- issue: Verhältnis der Menschen zu den himmlischen Geheimnissen
  choice: die Menschen kennengelernt haben
  alternative: die Menschen erkannt haben
  rationale: Der überlieferte ge'ezische Wortlaut trägt die Bedeutung des Erkennens beziehungsweise Kennenlernens. Die alternative Vorstellung, Menschen hätten danach zu forschen gesucht, gehört zu einer abweichenden textlichen Überlieferung und wird nicht stillschweigend in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit unmittelbarer Anrede. Der Doppelpunkt gliedert die Anklage natürlich, ohne den engen Zusammenhang der Handlungen Azazels aufzulösen. »Auf der Erde« wurde gegenüber dem stärker altertümlichen »auf Erden« bevorzugt; »in den Himmeln« bewahrt dagegen bewusst den kosmologischen Plural der Vorlage.
