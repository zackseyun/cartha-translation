base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/009/001.yaml
  text: And then Michael[a], Uriel, Raphael, and Gabriel looked down from heaven and saw much blood being poured out upon the earth[b], and all the lawlessness being done upon the earth.
translation:
  language: de
  text: Dann blickten Michael, Uriel, Raphael und Gabriel vom Himmel herab und sahen, wie viel Blut auf die Erde ausgegossen wurde[a] und wie all das Unrecht auf der Erde begangen wurde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vergossen wurde«. Die äthiopische Verbform ist schwierig. Manche deuten sie im Sinn von »schreit«, sodass hier vom Blut die Rede wäre, das auf der Erde schreit.'
    reason: lexical_alternative
  - marker: b
    text: Die zweimalige Ortsangabe »auf die Erde/auf der Erde« folgt der Wiederholung im Ausgangstext und betont die Erde als Schauplatz von Blutvergießen und Unrecht.
    reason: literary_note
lexical_decisions:
- source_word: እሜሃ
  choice: Dann
  rationale: Die temporale Partikel führt die nächste Szene ein; »Dann« gibt die zeitliche Abfolge natürlich und knapp wieder.
- source_word: ሐወጹ … እምሰማይ
  choice: blickten … vom Himmel herab
  rationale: Im Zusammenhang bezeichnet das Verb einen aus dem Himmel auf die Erde gerichteten Blick und bewahrt so die vertikale Perspektive der Vision.
- source_word: ብዙሐ ደመ
  choice: wie viel Blut
  rationale: Die konkrete Rede von einer großen Menge Blut bleibt erhalten; eine abstrakte Wiedergabe wie »Blutvergießen« würde das Bild abschwächen.
- source_word: ዘይትከዓው
  choice: ausgegossen wurde
  rationale: Beim Subjekt »Blut« und der Ortsangabe »auf die Erde« liegt das Bild des Ausgießens nahe. »Vergossen wurde« ist ebenfalls möglich; die schwierige Form wird deshalb in einer Fußnote erläutert.
- source_word: በዲበ ምድር
  choice: auf die Erde / auf der Erde
  rationale: Die Ortsangabe wird entsprechend der deutschen Verbfügung wiedergegeben und an beiden Stellen beibehalten, um die Wiederholung des Ausgangstextes zu bewahren.
- source_word: ኵሎ ዓመፃ
  choice: all das Unrecht
  rationale: »Unrecht« umfasst Auflehnung, Gewalttat und moralische Verfehlung, ohne die Bedeutung ausschließlich auf körperliche Gewalt oder auf einen formalen Gesetzesverstoß zu verengen.
- source_word: ዘይትገበር
  choice: begangen wurde
  rationale: Die passive Relativform wird transparent wiedergegeben; »Unrecht begehen« ist im modernen Deutschen idiomatisch.
theological_decisions:
- issue: Schreibweise der Engelnamen
  choice: Michael, Uriel, Rafael und Gabriel
  alternative: Mikael, Uriel, Raphael und Gabriel
  rationale: Die im Deutschen geläufigen Namensformen fördern die Verständlichkeit, ohne den Bezug zu den äthiopischen Formen zu verändern.
- issue: Konkretes oder deutendes Verständnis des Blutbildes
  choice: wie viel Blut auf die Erde ausgegossen wurde
  alternative: wie viel Blut vergossen wurde / wie das viele Blut schrie
  rationale: Die Hauptfassung bewahrt das konkrete visionäre Bild und vermeidet, die schwierige Verbform vorschnell auf ein Motiv vom schreienden Blut festzulegen; die echte lexikalische Unsicherheit wird in der Fußnote offengehalten.
- issue: Bedeutungsumfang von ዓመፃ
  choice: Unrecht
  alternative: Gesetzlosigkeit / Gewalt / Auflehnung
  rationale: Die breite moralische und soziale Bedeutung bleibt erhalten, ohne den Ausdruck konfessionell oder juristisch zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am äthiopischen Text, während idiomatische deutsche Verbfügungen verwendet werden. Die Wiederholung von »Erde« ist bewusst erhalten; ungebräuchliche Formulierungen wie »die ganze Gesetzlosigkeit« werden vermieden.
