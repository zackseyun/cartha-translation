base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/008.yaml
  text: And through the middle opening[a], which is beside it, there come out from it a pleasant fragrance, and dew, and rain, and peace[c][b], and life.
translation:
  language: de
  text: Und durch die mittlere Öffnung, die neben ihr liegt,[a] kommen ein angenehmer Duft[b], Tau, Regen, Frieden[c] und Leben hervor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ältere Wiedergabe: „durch die Öffnung neben der mittleren“. Die grammatische Form spricht jedoch dafür, dass „mittlere“ die Öffnung selbst beschreibt und „ihr“ auf die zuvor erwähnte Öffnung verweist.'
    reason: textual_syntax
  - marker: b
    text: 'Wörtlich auch: „ein guter Duft“ oder „ein wohlriechender Geruch“.'
    reason: lexical_alternative
  - marker: c
    text: „Frieden“ kann hier auch Wohlergehen, Heil oder Ganzheit bezeichnen, nicht nur die Abwesenheit von Streit.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኆኅት
  choice: Öffnung
  rationale: Der Ausdruck bezeichnet eine Öffnung oder einen Durchlass. „Öffnung“ bewahrt das kosmisch-räumliche Bild, ohne es unnötig als Fenster oder Tor festzulegen.
- source_word: እንተ ኃቤሃ ማእከላዊት
  choice: die mittlere Öffnung, die neben ihr liegt
  rationale: Das feminine Adjektiv „mittlere“ bezieht sich auf „Öffnung“; das feminine Pronominalsuffix in ኃቤሃ bedeutet „neben ihr“ und verweist wahrscheinlich auf die zuvor genannte Öffnung.
- source_word: ይወፅእ እምኔሃ
  choice: kommen … hervor
  rationale: Die Wendung bezeichnet das Herauskommen beziehungsweise Hervorgehen. Die deutsche Formulierung ist bei der folgenden Aufzählung natürlich und gibt die Bewegung durch die Öffnung wieder.
- source_word: መዐዛ ሠናይ
  choice: ein angenehmer Duft
  rationale: Das Substantiv bezeichnet Geruch oder Duft, das Adjektiv „gut“ beziehungsweise „angenehm“. „Angenehmer Duft“ erhält die positive Sinneswahrnehmung.
- source_word: ጤለ
  choice: Tau
  rationale: „Tau“ ist in diesem meteorologischen Zusammenhang die wahrscheinlichste Bedeutung; „Nebel“ bleibt eine weniger wahrscheinliche Alternative.
- source_word: ዝናም
  choice: Regen
  rationale: Dies ist die direkte und im Kontext natürliche Wiedergabe.
- source_word: ሰላም
  choice: Frieden
  rationale: „Frieden“ bewahrt die umfassende kosmische und theologische Bedeutung; der mögliche Sinn von Wohlergehen oder Ganzheit wird in einer Fußnote offengehalten.
- source_word: ሕይወት
  choice: Leben
  rationale: Die unmittelbare Wiedergabe „Leben“ erhält den abschließenden, steigernden Charakter der Segensreihe.
theological_decisions:
- issue: Soll ሰላም in der Reihe meteorologischer Segnungen auf materielles Wohlergehen verengt werden?
  choice: Frieden
  alternative: Wohlergehen; Heil; Gedeihen
  rationale: Der Begriff kann umfassendes Wohlergehen und Ganzheit einschließen, geht aber über bloßen materiellen Wohlstand hinaus. „Frieden“ hält diese theologische Weite offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die aufzählende Satzbewegung des ge’ezischen Textes bleibt erhalten; die räumliche Konstruktion wird grammatisch präzise wiedergegeben, ohne den ungenannten Bezug von „ihr“ erklärend in den Haupttext einzufügen.
