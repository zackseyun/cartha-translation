base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/006.yaml
  text: And through the second middle gate abundance comes out[a], and from it come rain and fruit and peace and dew; and through the third gate, which is toward the south[c][b], frost comes out and dryness.
translation:
  language: de
  text: Und durch das zweite, mittlere Tor kommt Fülle hervor[a]; aus ihm kommen Regen, Frucht, Frieden und Tau. Durch das dritte Tor, das nach Süden hin liegt, kommen Frost und Trockenheit hervor[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Lesung und Bedeutung des hier mit „Fülle“ wiedergegebenen Wortes sind umstritten. Es wurde auch mit „Hunger“ oder „Hungersnot“ verbunden; dies ergäbe jedoch einen auffälligen Gegensatz zu Regen, Frucht, Frieden und Tau.
    reason: textual_variant
  - marker: b
    text: 'Oder: „Dürre“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኆኅት
  choice: Tor
  rationale: Das Wort bezeichnet im kosmologischen Bild des Astronomischen Buches eine himmlische Öffnung; „Tor“ bewahrt dieses konkrete Bild.
- source_word: ማእከላዊት
  choice: mittlere
  rationale: Das Adjektiv kennzeichnet das Tor als das mittlere innerhalb der betreffenden Folge.
- source_word: ርኅብ
  choice: Fülle
  rationale: Die vorliegende Schreibung wird als „Weite/Fülle“ verstanden, nicht als das ähnlich geschriebene Wort für „Hunger/Hungersnot“. „Fülle“ passt zudem zur anschließenden Reihe günstiger Gaben.
- source_word: ዝናም
  choice: Regen
  rationale: Direkte und natürliche Entsprechung des Wetterbegriffs.
- source_word: ፍሬ
  choice: Frucht
  rationale: Bewahrt die konkrete Bedeutung; im Zusammenhang kann damit auch landwirtschaftlicher Ertrag gemeint sein.
- source_word: ሠላም
  choice: Frieden
  rationale: Die übliche Grundbedeutung bleibt erhalten, auch wenn das Wort hier zugleich Wohlergehen einschließen kann.
- source_word: ጤለ
  choice: Tau
  rationale: Präzise Bezeichnung der Feuchtigkeit, die neben Regen und Frucht genannt wird.
- source_word: መንገለ መስዕ
  choice: nach Süden
  rationale: Gibt die Richtungsangabe knapp und idiomatisch wieder.
- source_word: ቍር
  choice: Frost
  rationale: Im klimatischen Zusammenhang ist „Frost“ genauer als das allgemeinere „Kälte“.
- source_word: የብስ
  choice: Trockenheit
  rationale: Bleibt nahe am Substantiv und vermeidet die stärkere Deutung „Dürre“.
theological_decisions:
- issue: Kosmologische Bildsprache der Tore
  choice: „Tor“ sowie das wiederholte „hervorkommen“ beibehalten
  alternative: „Öffnung“ verwenden und die Wirkungen mit „bringen“ oder „hervorbringen“ umschreiben
  rationale: Der Text schildert eine geordnete apokalyptische Kosmologie, in der Wettererscheinungen aus himmlischen Toren hervorkommen. Eine glättende meteorologische Umschreibung würde dieses Weltbild abschwächen.
- issue: Bedeutung von ሠላም in der Reihe landwirtschaftlicher Wohltaten
  choice: Frieden
  alternative: Wohlergehen
  rationale: „Frieden“ bewahrt die gewöhnliche und theologisch offene Bedeutung des Wortes; „Wohlergehen“ wäre im Kontext plausibel, würde den Sinn aber stärker festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt quellennah, wird aber durch zwei Hauptsätze lesbarer gestaltet. Die wiederholte Bewegungsrichtung aus den Toren und die kosmologische Bildsprache bleiben erhalten.
