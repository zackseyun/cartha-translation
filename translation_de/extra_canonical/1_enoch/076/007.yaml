base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/007.yaml
  text: And after these winds[a], by the way of the south they go out through two gates; through the first gate, which inclines toward the east[c][b], there comes out a wind of death.
translation:
  language: de
  text: Und nach diesen Winden ziehen sie in Richtung Süden durch zwei Tore hinaus; durch das erste Tor, das sich nach Osten neigt, kommt ein Wind des Todes[a] heraus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein tödlicher Wind“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረ እሉ ነፋሳት
  choice: nach diesen Winden
  rationale: Die zeitliche Abfolge und der unmittelbare Rückbezug des Demonstrativs bleiben erhalten; die knappe Ausdrucksweise der Quelle wird nicht erklärend aufgelöst.
- source_word: መንገለ አዜብ
  choice: in Richtung Süden
  rationale: መንገለ bezeichnet hier Richtung oder Seite. Die deutsche Wendung gibt die kosmologische Bewegungsrichtung natürlich wieder, ohne eine Himmelsregion zusätzlich auszudeuten.
- source_word: በ፪ኆኅት
  choice: durch zwei Tore
  rationale: ኆኅት kann eine Öffnung, ein Fenster oder ein Tor bezeichnen. Im Bild der kosmischen Ausgänge ist „Tore“ anschaulich und entspricht der jüngsten grammatischen Revision.
- source_word: ቀዳሚት ኆኅት እምኔሆን
  choice: durch das erste Tor
  rationale: Die partitive Beziehung wird im Deutschen knapp durch den bestimmten Superlativ innerhalb der zuvor genannten Zweiergruppe ausgedrückt; ein zusätzliches „von ihnen“ wäre redundant.
- source_word: እንተ ታጸንኑ ለመንገለ ምሥራቅ
  choice: das sich nach Osten neigt
  rationale: Das feminine relative Element bezieht sich auf das erste Tor; das Verb bezeichnet eine Neigung oder Ausrichtung nach Osten.
- source_word: ነፋስ ሞት
  choice: ein Wind des Todes
  rationale: Die genitivische Form bewahrt die schroffe, kosmisch-apokalyptische Bildsprache und legt nicht vorschnell nur die Eigenschaft „tödlich“ fest.
theological_decisions:
- issue: Soll ነፋስ ሞት idiomatisch zu einem Adjektiv abgeschwächt werden?
  choice: ein Wind des Todes
  alternative: ein tödlicher Wind
  rationale: Die substantivische Verbindung lässt offen, ob der Wind Tod bringt, dem Tod zugeordnet ist oder als kosmische Todesmacht erscheint. Diese theologische und poetische Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die räumliche Architektur des apokalyptischen Textes bleibt konkret; zugleich werden unnötig schwerfällige partitive Wiederholungen vermieden.
