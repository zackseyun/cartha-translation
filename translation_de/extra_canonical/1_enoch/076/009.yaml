base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/009.yaml
  text: And through the third opening[a], toward the west, there come out from it dew and rain[b], and frost and destruction.
translation:
  language: de
  text: Und durch die dritte Öffnung, die nach Westen liegt, kommen aus ihr Tau und Regen, Heuschrecken[a] und Verwüstung hervor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »Frost«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ሣልስት ኆኅት
  choice: die dritte Öffnung
  rationale: Das Ordinalzahlwort bestimmt die kosmische Öffnung. »Öffnung« bewahrt das Bild einer himmlischen Austrittsstelle, ohne es architektonisch als Tor oder Fenster festzulegen.
- source_word: መንገለ ምዕራብ
  choice: die nach Westen liegt
  rationale: Die Wendung bezeichnet die westliche Lage beziehungsweise Ausrichtung und wird in natürlichem Deutsch räumlich wiedergegeben.
- source_word: ይወፅእ እምኔሃ
  choice: kommen aus ihr … hervor
  rationale: Die konkrete Vorstellung, dass die aufgezählten Erscheinungen aus der Öffnung hervortreten, bleibt erhalten; im Deutschen richtet sich der Numerus natürlich nach der mehrteiligen Aufzählung.
- source_word: ጤለ
  choice: Tau
  rationale: Das Wort bezeichnet hier Tau beziehungsweise leichte Feuchtigkeit; »Tau« entspricht dem Gebrauch im unmittelbaren Kapitelkontext.
- source_word: ዝናም
  choice: Regen
  rationale: Die gewöhnliche und kontextuell eindeutige Bedeutung ist »Regen«.
- source_word: አናጽዕ
  choice: Heuschrecken
  rationale: Die ältere quellennahe Wiedergabe und der Kontrast zwischen segensreichen und zerstörerischen Ausgängen stützen »Heuschrecken«; da das Wort auch als Kältephänomen aufgefasst worden ist, wird »Frost« als Alternative vermerkt.
- source_word: ደምሳሴ
  choice: Verwüstung
  rationale: Das vom Stamm d-m-s-s (zerstören) abgeleitete Substantiv bezeichnet Zerstörung oder Verwüstung, nicht Schnee. »Verwüstung« passt zur Reihe der ausgehenden Plagen.
