  verdict: revise
  source_fidelity: 'Die Richtungsangabe Süden, die wörtliche Namensformel »Meer«, die östliche Lage und der hervortretende Tau sind im Entwurf grundsätzlich zutreffend wiedergegeben. Eine sichere Korrektur ist jedoch nötig: እም፯ኆኅት bedeutet »aus sieben Öffnungen«, nicht »aus der siebten Öffnung«. Die Singularform von »aus ihr« im folgenden Satz bleibt angesichts dieses Befunds als überlieferte syntaktische Schwierigkeit kenntlich.'
  naturalness: Die revidierte Fassung bleibt modernes, würdiges Standarddeutsch. »folgen« ist als behutsame Ergänzung des elliptischen Listenanschlusses gut verständlich. Die Spannung zwischen »sieben Öffnungen« und »aus ihr« wird nicht durch eine unbelegte Harmonisierung beseitigt, sondern in einer Anmerkung erklärt.
  terminology: »Winde«, »Öffnungen«, »Tau« und die kosmologische Benennung »Meer« sind angemessen. Die Wiedergabe von ፯ als Ordnungszahl »siebten« ist dagegen nicht haltbar; erforderlich ist die Kardinalzahl »sieben«.
  issues:
  - severity: high
    issue: Die Zahl ፯ wurde als Ordnungszahl übersetzt.
    rationale: Die Quelle hat »aus sieben Öffnungen«; sie bietet keine Grundlage für »aus der siebten Öffnung«. Die anschließende feminine Singularform schafft zwar eine textliche bzw. syntaktische Spannung, rechtfertigt aber keine Umdeutung der Zahl.
  - severity: medium
    issue: Die Erklärung zu Fußnote c stützt die Lesart »aus ihr« durch einen Bezug auf eine einzelne Öffnung, obwohl der unmittelbar vorhergehende Ausdruck sieben Öffnungen nennt.
    rationale: Der Singularbezug ist in der überlieferten Form gerade schwierig. Die Fußnote soll ihn als nicht vollständig auflösbare Überlieferungsspannung beschreiben, statt ihn durch »siebte Öffnung« zu harmonisieren.
  revised_text: Und nach diesen folgen die Winde aus dem Süden[a] – ihr Name ist »Meer«, und sie gehen aus sieben Öffnungen hervor, die nach Osten liegen[b] –; aus ihr tritt Tau hervor.[c]
  revised_footnotes:
  - marker: a
    text: Die Satzfügung ist in der äthiopischen Überlieferung schwierig; besonders die anschließende Namens- und Ausgangsklausel kann eine Variante oder Erweiterung darstellen. Sie wird hier beibehalten, weil sie im vorliegenden Textzeugen steht.
    reason: textual_variant
  - marker: b
    text: An dieser Stelle steht im Textzeugen außerdem die eingeklammerte Wendung „nach Westen“. Da ihre Einordnung unsicher ist und sie mit „nach Osten“ konkurriert, erscheint sie nicht im Haupttext.
    reason: alternative_reading
  - marker: c
    text: Der Text nennt zuvor „sieben Öffnungen“, hat hier jedoch ein feminin-singularisches „aus ihr“. Außerdem ist „Tau“ wahrscheinlich das Subjekt des singularischen Verbs. Die dadurch entstehende syntaktische Spannung wird nicht durch die unbelegte Lesart „siebte Öffnung“ harmonisiert. Abweichende Deutungen verstehen die Stelle unter anderem als „aus dem Süden“ oder „sie gehen aus ihnen wie Tau hervor“.
    reason: translation_difficulty
