base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/010.yaml
  text: And after these[a], winds from the south—whose name is Sea[e][d][c][b], and which come out from the seventh opening that is toward the east—dew comes forth from it.
translation:
  language: de
  text: Und nach diesen folgen die Winde aus dem Süden[a] – ihr Name ist »Meer«, und sie gehen aus der siebten Öffnung hervor, die nach Osten liegt[b] –; aus ihr tritt Tau hervor.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die ganze Satzfügung ist in der äthiopischen Überlieferung schwierig; besonders die nachfolgende Namens- und Ausgangsklausel kann eine Variante oder Erweiterung darstellen. Sie wird hier beibehalten, weil sie im vorliegenden Textzeugen steht.
    reason: textual_variant
  - marker: b
    text: An dieser Stelle steht im Textzeugen außerdem die eingeklammerte Wendung „nach Westen“. Da ihre Einordnung unsicher ist und sie mit „nach Osten“ konkurriert, erscheint sie nicht im Haupttext.
    reason: alternative_reading
  - marker: c
    text: Ältere bzw. abweichende Gliederungen verstehen die Stelle unter anderem als „aus den sieben Öffnungen“, „aus dem Süden“ oder „sie gehen aus ihnen wie Tau hervor“. Die Formen von „aus ihr“, dem Verb und „Tau“ sprechen jedoch eher für die hier gebotene Übersetzung.
    reason: translation_difficulty
lexical_decisions:
- source_word: ወእምድኅረ እሉ
  choice: Und nach diesen folgen
  rationale: Die Wendung ordnet den nächsten Abschnitt zeitlich bzw. der Reihenfolge nach ein. „folgen“ macht den im überlieferten Text elliptischen Anschluss im Deutschen lesbar, ohne eine zusätzliche inhaltliche Aussage einzuführen.
- source_word: ነፋሳት ዘመንገለ መስዕ
  choice: die Winde aus dem Süden
  rationale: Im meteorologischen Zusammenhang bezeichnet ነፋሳት Winde; die Richtungswendung kennzeichnet hier ihre Herkunft aus dem südlichen Bereich.
- source_word: ዘስሙ ባሕር
  choice: ihr Name ist »Meer«
  rationale: Die auffällige kosmologische Benennung wird wörtlich bewahrt und nicht deutend zu „Meereswind“ umgeformt.
- source_word: ወዘወፅአ እም፯ኆኅት
  choice: und sie gehen aus der siebten Öffnung hervor
  rationale: Die Passage ist textlich und grammatisch schwierig. „Öffnung“ erhält das räumliche Bild der kosmischen Ausgänge; der Zahlenausdruck wird im gegebenen Zusammenhang als Ordnungszahl verstanden.
- source_word: እንተ መንገለ ምሥራቅ
  choice: die nach Osten liegt
  rationale: Die feminine Singularform des Relativpronomens bezieht sich am natürlichsten auf die einzelne Öffnung; die Richtungsangabe wird räumlich und ohne weitere Ausdeutung wiedergegeben.
- source_word: ይወፅእ እምኔሃ ጤለ
  choice: aus ihr tritt Tau hervor
  rationale: Das feminine singularische Suffix in እምኔሃ verweist auf die Öffnung, während ጤለ als Subjekt des singularischen Verbs verstanden wird. Ein vergleichendes „wie Tau“ wäre mangels entsprechender Präposition unbegründet.
theological_decisions:
- issue: Kosmologische Benennung des Südwinds
  choice: Die Bezeichnung „Meer“ wird ausdrücklich und wörtlich beibehalten.
  alternative: Die Klausel auslassen oder deutend „Meereswind“ schreiben.
  rationale: Die eigentümliche apokalyptisch-kosmologische Terminologie gehört zur Aussagegestalt des überlieferten Textes und soll weder harmonisiert noch konfessionell gedeutet werden.
- issue: Bezug von „aus ihr“ und syntaktische Rolle von „Tau“
  choice: Die Öffnung ist der Bezugspunkt; Tau ist das hervortretende Subjekt.
  alternative: Die Winde gingen „aus ihnen wie Tau“ hervor.
  rationale: Genus und Numerus der äthiopischen Formen stützen den singularischen Bezug auf die Öffnung und die Lesart „Tau tritt hervor“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gedankenstriche markieren die textlich schwierige eingeschobene Beschreibung, während „folgen“ den elliptischen Listenanschluss behutsam glättet. Die ungewöhnliche Bezeichnung »Meer« und die alte kosmologische Bildwelt bleiben sichtbar.
