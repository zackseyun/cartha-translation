base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/005.yaml
  text: And the first wind goes out from those gates[a], whose name is the east wind, through the first gate that is toward the east; and turning toward the south, from it come forth desolation, drought, death[c][b], and destruction.
translation:
  language: de
  text: Und der erste Wind, der Ostwind heißt, geht aus jenen Toren durch das erste Tor hervor, das nach Osten gerichtet ist und sich nach Süden neigt[a]. Aus ihm gehen Verwüstung, Dürre, Tod[b] und Vernichtung hervor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die äthiopische Wendung ist schwierig; auch möglich: „wendet sich nach Süden“ oder „richtet sich südwärts aus“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im überlieferten Text „Tod“. Wegen der umgebenden Wetterfolgen wurde auch „Hitze“ oder „Gluthitze“ vermutet; dafür wäre jedoch eine Textkorrektur nötig.
    reason: textual_variant
lexical_decisions:
- source_word: ወይወፅእ
  choice: geht … hervor
  rationale: Das Bewegungsverb bezeichnet das Hervorgehen aus einem Tor; die Formulierung bewahrt zugleich den wiederkehrenden Katalogstil des Abschnitts.
- source_word: ቀዳማይ ነፋስ
  choice: der erste Wind
  rationale: Die Ordnungsangabe ist für die systematische Aufzählung der Winde wesentlich.
- source_word: እምእልክቱ ኃዋሳው
  choice: aus jenen Toren
  rationale: Der Plural und die demonstrative Bestimmung werden beibehalten, ohne die kosmographische Darstellung näher auszudeuten.
- source_word: ዘስሙ ጽባሓይ
  choice: er heißt Ostwind
  rationale: Die Benennungsformel und die östliche Windrichtung werden in natürlichem Deutsch wiedergegeben.
- source_word: በቀዳሚት ኆኅት
  choice: durch das erste Tor
  rationale: „Tor“ wahrt das durchgängige Bild kosmischer Öffnungen und die Reihenfolge.
- source_word: እንተ መንገለ ጽባሕ
  choice: das nach Osten liegt
  rationale: መንገለ bezeichnet hier die Ausrichtung „nach/gegen Osten“; die Wiedergabe vermeidet die unnatürliche Übertragung „auf dem Weg des Ostens“.
- source_word: ታጸንኑ ለአዜብ
  choice: wendet sich nach Süden
  rationale: Die schwierige Wendung bezeichnet wahrscheinlich eine südliche Ausrichtung oder Bewegung; „wendet sich“ ist natürlich, ohne eine schärfere Bewegungsart festzulegen.
- source_word: ድምሳሴ
  choice: Verwüstung
  rationale: Das Wort bezeichnet eine schwere, das Land betreffende Zerstörungsfolge und wahrt den apokalyptischen Ton.
- source_word: ናብስት
  choice: Dürre
  rationale: Im Zusammenhang schädlicher Winde ist „Dürre“ konkreter und natürlicher als das abstrakte „Trockenheit“.
- source_word: ሞት
  choice: Tod
  rationale: Die überlieferte Form ist das gewöhnliche Wort für „Tod“. Eine kontextbedingte Umdeutung zu „Hitze“ würde den vorhandenen Wortlaut ohne hinreichenden textlichen Grund ersetzen.
- source_word: ሐጕል
  choice: Vernichtung
  rationale: Die breite Bedeutung eines verderblichen Untergangs bildet einen angemessenen Abschluss der Folge von Katastrophen.
theological_decisions:
- issue: Meteorologische Beschreibung oder unheilvolle apokalyptische Kosmologie
  choice: Die katastrophale Folge einschließlich „Tod“ als Bestandteil der dargestellten kosmischen Ordnung bewahren
  alternative: Die Aufzählung auf gewöhnliche Wettererscheinungen beschränken oder „Tod“ aus Kontextgründen zu „Hitze“ ändern
  rationale: Der überlieferte Wortlaut nennt den Tod ausdrücklich, und der weitere Zusammenhang kennt Winde als Träger schweren Unheils. Die Spannung zwischen geordneter Kosmologie und zerstörerischer Wirkung darf nicht eingeebnet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzgliederung. Die kosmographischen Leitwörter „Wind“ und „Tor“ bleiben erhalten; die unheilvolle Aufzählung wird weder abgeschwächt noch konfessionell ausgelegt.
