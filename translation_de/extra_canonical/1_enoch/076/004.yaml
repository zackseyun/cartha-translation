base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/004.yaml
  text: Through four of them come forth winds of blessing and peace[a], and from those eight come forth winds of scourging; when they are sent out, they bring ruin upon all the earth and the water on it, and upon all who dwell on it[c][b], and upon everything that is in the water and on the dry land.
translation:
  language: de
  text: Durch vier von ihnen kommen Winde des Segens und des Friedens hervor, und aus jenen acht kommen Winde der Heimsuchung[a] hervor. Wenn sie ausgesandt werden, bringen sie Verderben über die ganze Erde und das Wasser auf ihr[b], über alle, die auf ihr wohnen, und über alles, was im Wasser und auf dem trockenen Land ist.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Winde der Strafe“, „der Plage“ oder „der Züchtigung“. Das geʿezische Wort bezeichnet ein zerstörerisches, strafendes Unheil.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlichkeitsnah: „das Wasser auf ihr“. Gemeint sein können die Wasser, die in dieser kosmologischen Darstellung der Erde beziehungsweise dem Land zugeordnet sind.'
    reason: cultural_note
  - marker: c
    text: Die vorliegende Transkription liest am Versanfang „durch drei von ihnen“. Wahrscheinlich wurde jedoch die geʿezische Zahl ፬ („vier“) als ፫ („drei“) fehlgelesen; auch die Einteilung des Kapitels in vier wohltätige und acht verderbliche Tore stützt „vier“.
    reason: textual_variant
lexical_decisions:
- source_word: በ፬እምኔሆሙ (überlieferungskritisch gegenüber OCR በ፫እምኔሆሙ)
  choice: Durch vier von ihnen
  rationale: 'Der Kapitelzusammenhang zählt zwölf Tore: vier mittlere für wohltätige und acht äußere für verderbliche Winde. „Durch“ gibt በ wieder und wahrt den Unterschied zum folgenden እም „aus/von“.'
- source_word: ይወፅኡ
  choice: kommen … hervor
  rationale: Die Wendung bezeichnet das Hervortreten der Winde aus den kosmischen Toren und bleibt zugleich natürlich und bildhaft.
- source_word: ነፋሳት
  choice: Winde
  rationale: Im astronomisch-meteorologischen Zusammenhang sind kosmische Winde gemeint, nicht personale Geister.
- source_word: በረከት ወሰላም
  choice: Segen und Frieden
  rationale: Die geläufigen religiösen Begriffe bewahren den gehobenen Ton und bezeichnen hier die wohltätige Wirkung der Winde.
- source_word: እምእልኩ ሰማንቱ
  choice: aus jenen acht
  rationale: Das Demonstrativ verweist auf die zuvor geordnete Gruppe; ein im Geʿez nicht wiederholtes Substantiv wird nicht ergänzt.
- source_word: መቅሠፍት
  choice: Heimsuchung
  rationale: Das Wort bezeichnet eine schlagende, verderbliche Züchtigung. „Heimsuchung“ erhält den Gerichtscharakter, ohne auf eine einzelne Form wie Seuche oder Geißelung zu verengen.
- source_word: ሶበ ይትፈነዉ
  choice: Wenn sie ausgesandt werden
  rationale: Die passive Form stellt die Winde als freigesetzte beziehungsweise beauftragte Mächte dar, ohne die handelnde Instanz ausdrücklich zu benennen.
- source_word: ይደመስስዋ
  choice: bringen sie Verderben über
  rationale: Die resultative und zerstörerische Kraft des Verbs wird gewahrt; die Formulierung trägt die folgende Reihe von Objekten gut.
- source_word: ለኵላ ምድር ወማይ ዘዲቤሃ
  choice: über die ganze Erde und das Wasser auf ihr
  rationale: Die ungewöhnliche kosmologische Verbindung von Erde beziehungsweise Land und dem darauf befindlichen Wasser bleibt eng am Wortlaut erhalten.
- source_word: ኵሉ እለ የኃድሩ ዲቤሃ
  choice: über alle, die auf ihr wohnen
  rationale: Die Wiederholung der räumlichen Beziehung und der feierliche Satzrhythmus werden bewahrt.
- source_word: ኵሉ ዘሀሎ ውስተ ማይ ወዲበ የብስ
  choice: über alles, was im Wasser und auf dem trockenen Land ist
  rationale: Der abschließende Merismus umfasst beide Lebensbereiche; „trockenes Land“ bildet den ausdrücklichen Gegensatz zum Wasser ab.
theological_decisions:
- issue: Winde oder Geister für ነፋሳት
  choice: Winde
  alternative: Geister
  rationale: Die geordneten Tore und Himmelsrichtungen dieses Kapitels bilden einen meteorologisch-kosmologischen Kontext. „Geister“ würde das Bild unnötig personalisieren.
- issue: Bedeutungsumfang von መቅሠፍት
  choice: Heimsuchung
  alternative: Strafe; Plage; Geißelung
  rationale: „Heimsuchung“ erhält sowohl den zerstörerischen als auch den gerichtlichen Zug, legt aber die konkrete Art des Unheils nicht enger fest als der Quellbegriff.
- issue: Zahl der wohltätigen Tore
  choice: vier
  alternative: drei nach der vorliegenden OCR-Transkription
  rationale: Die Lesart „vier“ beruht auf der als ፫ fehlgelesenen Zahl ፬ und wird durch die ausdrückliche Einteilung des Kapitels in vier wohltätige und acht verderbliche Tore gestützt. Die textkritische Abweichung wird in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem Satzbau. Die Wiederholungen und die kosmologische Bildsprache bleiben erhalten; unnötige Archaismen werden vermieden.
