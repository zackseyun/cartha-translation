base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/002.yaml
  text: Three of them are open at the face of heaven[a], and three in the west, and three at the right of heaven[c][b], and three at the left.
translation:
  language: de
  text: Drei von ihnen stehen an der Vorderseite des Himmels offen[a], drei im Westen, drei zur Rechten des Himmels[b] und drei zur Linken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „am Gesicht des Himmels“. In räumlicher Verwendung kann dies die Vorderseite bezeichnen; in antiker Orientierung kann diese dem Osten entsprechen.'
    reason: lexical_alternative
  - marker: b
    text: Die rechte und die linke Seite können, je nach kosmischer Ausrichtung, als Süden beziehungsweise Norden verstanden werden.
    reason: cultural_note
lexical_decisions:
- source_word: ፫እም ኔሆሙ
  choice: Drei von ihnen
  rationale: Die partitive Form verweist auf die zuvor genannten Tore zurück; „von ihnen“ macht diesen Bezug im Deutschen deutlich.
- source_word: ርኅዋት
  choice: sind … geöffnet
  rationale: Das Wort beschreibt die Tore als offenstehend; die prädikative Wiedergabe passt zum astronomischen Zusammenhang.
- source_word: በገጸ ሰማይ
  choice: an der Vorderseite des Himmels
  rationale: ገጽ bedeutet wörtlich „Gesicht“, bezeichnet in räumlicher Verwendung aber auch die Vorderseite. Die Übersetzung bewahrt das körperlich-räumliche Bild und bleibt zugleich im Deutschen verständlich.
- source_word: በምዕራብ
  choice: im Westen
  rationale: Dies ist die natürliche deutsche Wiedergabe der eindeutigen Richtungsangabe.
- source_word: በየማነ ሰማይ
  choice: an der rechten Seite des Himmels
  rationale: Die wörtliche räumliche Bezeichnung wird beibehalten, statt sie stillschweigend als Himmelsrichtung zu deuten.
- source_word: በፀጋም
  choice: an der linken Seite
  rationale: Die Formulierung bildet das Gegenstück zur rechten Seite und bewahrt die kosmische Körpermetaphorik des Textes.
theological_decisions:
- issue: Deutung der kosmischen Körperbegriffe als Himmelsrichtungen
  choice: Vorderseite, rechte Seite und linke Seite im Haupttext beibehalten
  alternative: Osten, Süden und Norden
  rationale: Die Richtungsdeutung ist plausibel, doch der ge'ezische Text formuliert mit räumlicher Körperbildlichkeit. Der Haupttext bewahrt dieses Bild; die mögliche Zuordnung zu Himmelsrichtungen wird in den Fußnoten genannt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Aufzählungsstruktur und die konkrete kosmische Raumvorstellung des ge'ezischen Textes bleiben erhalten; „Vorderseite“ vermeidet die im Deutschen unnatürliche Formulierung „Gesicht des Himmels“, ohne die Metapher ganz in Himmelsrichtungen aufzulösen.
