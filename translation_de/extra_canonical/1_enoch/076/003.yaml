base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/003.yaml
  text: And the first three are toward the east[a], and three toward the north, and three after these, on the left, toward the south[c][b], and three toward the west.
translation:
  language: de
  text: Und die ersten drei befinden sich im Osten[a], drei im Norden und danach drei zur Linken, im Süden[b], und drei im Westen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich kann das erste Glied auch heißen: „Und die ersten drei sind in Richtung Morgen/Sonnenaufgang.“'
    reason: lexical_note
  - marker: b
    text: Die Wörter „nach diesen, zur Linken“ stehen in der vorliegenden äthiopischen Textgestalt in Klammern und sind daher textlich unsicher. Die Übersetzung behält sie bei. Bei einer Ausrichtung nach Osten bezeichnet die linke Seite gewöhnlich den Norden; hier folgt jedoch ausdrücklich „Süden“, sodass die Spannung des überlieferten Wortlauts bestehen bleibt.
    reason: textual_variant
lexical_decisions:
- source_word: ቀዳማያት
  choice: die ersten
  rationale: Das Wort bezeichnet hier ausdrücklich die ersten drei in der Aufzählung; der zeitlich-ordnende Sinn darf nicht zugunsten einer bloßen Richtungsangabe entfallen.
- source_word: መንገለ
  choice: nach
  rationale: In der wiederholten Verbindung mit Himmelsrichtungen bezeichnet das Wort die Ausrichtung auf eine Seite oder Richtung. Das deutsche „nach“ ergibt eine natürliche Richtungsangabe.
- source_word: ጽባሕ
  choice: Osten
  rationale: Das mit Morgen beziehungsweise Sonnenaufgang verbundene Wort bezeichnet im astronomischen Zusammenhang den Osten.
- source_word: መስዕ
  choice: Norden
  rationale: Die jüngste textkritische Prüfung bestimmt den Ausdruck hier als Norden; diese Quellenaussage wird nicht zur Harmonisierung der Richtungsfolge vertauscht.
- source_word: በድኅረ እሉ
  choice: nach diesen
  rationale: Die Wendung führt die nächsten drei innerhalb der geordneten Aufzählung ein.
- source_word: በፀጋም
  choice: zur Linken
  rationale: Die relative Orientierungsangabe steht ausdrücklich im Text und bleibt erhalten, auch wenn sie zusammen mit der folgenden Himmelsrichtung spannungsvoll erscheint.
- source_word: አዜብ
  choice: Süden
  rationale: Die jüngste textkritische Prüfung bestimmt den Ausdruck hier als Süden; die Übersetzung bewahrt daher die überlieferte Spannung zu „zur Linken“.
- source_word: ዓረብ
  choice: Westen
  rationale: Das mit Abend beziehungsweise Sonnenuntergang verbundene Wort bezeichnet hier die westliche Richtung.
theological_decisions:
- issue: Relative Orientierungsangabe und Himmelsrichtung
  choice: „zur Linken“ zusammen mit „nach Süden“ beibehalten
  alternative: Die Wendung harmonisierend als „zur Linken, nach Norden“ wiedergeben oder „zur Linken“ auslassen
  rationale: Der gelieferte äthiopische Text verbindet die relative Angabe „zur Linken“ mit Süden. Diese Spannung wird nicht stillschweigend aufgelöst; eine Fußnote weist auf die textliche Unsicherheit hin.
translation_notes:
  register: Moderne, würdige Standardsprache. Die knappe, aufzählende Satzstruktur des Ausgangstextes bleibt erkennbar; „liegen nach“ macht die räumliche Zuordnung im Deutschen verständlich, ohne die widersprüchlich wirkende Richtungsangabe zu harmonisieren.
