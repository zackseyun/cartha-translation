base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/076/001.yaml
  text: And at the ends of the earth I saw twelve portals[a], and all of them were open for all the winds[b], from which the winds go out and blow upon the earth.
translation:
  language: de
  text: Und an den Enden der Erde sah ich zwölf Tore[a], und sie alle waren für sämtliche Winde[b] geöffnet; aus denen die Winde hervorgehen und über die Erde wehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zwölf Öffnungen“ beziehungsweise „zwölf Portale“. Das äthiopische Wort bezeichnet Tore oder Durchgänge; „Tore“ bewahrt hier das architektonische Bild der Vision.'
    reason: lexical_alternative
  - marker: b
    text: 'Eine ältere Lesart versteht die betreffende äthiopische Form als „ringsum“ und übersetzt sinngemäß: „zwölf Tore, die ringsum für alle Winde geöffnet waren“. Wahrscheinlich liegt jedoch eine Verwechslung mit der Pluralform für „Tore“ vor, sodass der Text auf alle zwölf Tore zurückverweist.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: አጽናፈ ምድር
  choice: an den Enden der Erde
  rationale: Die Wendung bezeichnet die äußersten Grenzen der Welt und bewahrt die kosmische Geografie der Vision in idiomatischem Deutsch.
- source_word: ርኢኩ
  choice: sah ich
  rationale: Eine klare, unmittelbare Wiedergabe der wiederkehrenden Visionsformel.
- source_word: ፲፪ ኆኃተ
  choice: zwölf Tore
  rationale: „Tore“ bewahrt das architektonische Bild kosmischer Durchgänge und ist im Deutschen natürlicher als „Portale“; auch „Öffnungen“ wäre möglich.
- source_word: ወእልኩ ኃዋላው ርኅዋተ
  choice: und sie alle waren … geöffnet
  rationale: Unter Berücksichtigung der belegten OCR-Verwechslung von ኆኃው mit ኃዋላው wird die Phrase als Rückbezug auf sämtliche Tore verstanden, nicht als Ortsangabe „ringsum“.
- source_word: ለኵሎሙ ነፋሳት
  choice: für sämtliche Winde
  rationale: Der unmittelbare meteorologische Zusammenhang verlangt „Winde“; „sämtliche“ gibt die Gesamtheit wieder und vermeidet die schwerfällige Folge „sie alle … alle Winde“.
- source_word: እለ እምኔሆሙ ይወፅኡ ነፋሳት
  choice: aus ihnen ziehen die Winde aus
  rationale: Die Relativkonstruktion kennzeichnet die Tore als Ausgangspunkte der Winde; die Wiederholung von „Winde“ bleibt entsprechend der Quelle ausdrücklich erhalten.
- source_word: ወይነፍሱ ዲበ ምድር
  choice: und wehen über die Erde
  rationale: Die Formulierung gibt die meteorologische Tätigkeit der Winde natürlich wieder; „über“ bewahrt den räumlichen Sinn von ዲበ.
theological_decisions:
- issue: Ob ነፋሳት als „Winde“ oder „Geister“ wiederzugeben ist
  choice: Winde
  alternative: Geister
  rationale: Obwohl das Wort semantisch Wind, Atem oder Geist bezeichnen kann, spricht die kosmologisch-meteorologische Beschreibung von Ausgängen und dem Wehen über der Erde eindeutig für tatsächliche Winde.
- issue: Ob die umstrittene Form als „ringsum“ oder als Rückbezug auf die Tore zu verstehen ist
  choice: sie alle waren geöffnet
  alternative: die ringsum geöffnet waren
  rationale: Die jüngste Quellenprüfung erkennt in ኃዋላው eine OCR-Verwechslung mit der Pluralform ኆኃው („Tore“). Daher wird kein in der zugrunde liegenden Lesart nicht vorhandenes „ringsum“ in den Haupttext aufgenommen; die frühere Deutung bleibt in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer visionärer Erzählweise. Die Satzstruktur bleibt quellennah, wird aber durch ein Semikolon lesbar gegliedert. Alle Fußnotenmarker stehen unmittelbar bei den betroffenen Ausdrücken.
