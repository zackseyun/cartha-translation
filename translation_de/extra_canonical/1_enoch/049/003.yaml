base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/003.yaml
  text: And in him dwells the spirit of wisdom[a], and the spirit that gives understanding, and the spirit of instruction and might[d][c][b], and the spirit of those who sleep in righteousness.
translation:
  language: de
  text: Und in ihm wohnt[a] der Geist der Weisheit und der Geist, der Einsicht verleiht[b], der Geist der Unterweisung und der Kraft und der Geist derer, die in Gerechtigkeit schlafen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in ihm ruht“ beziehungsweise „in ihm bleibt“. Das ge’ezische Verb bezeichnet ein Wohnen, Bleiben oder Ruhen und steht hier in einer Form, die einen gegenwärtigen oder fortdauernden Zustand ausdrückt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Geist der Einsicht“. Die Formulierung kann entweder einen durch Einsicht gekennzeichneten Geist oder einen Geist bezeichnen, der Einsicht verleiht.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „die in Gerechtigkeit schlafen“. Wahrscheinlich sind die gerecht Verstorbenen gemeint; möglich ist auch die Wiedergabe „die in Gerechtigkeit ruhen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ቦቱ የኃድር
  choice: in ihm wohnt
  rationale: ቦቱ bezeichnet den Ort „in ihm“, und die Imperfektform የኃድር drückt hier ein gegenwärtiges oder fortdauerndes Wohnen beziehungsweise Bleiben aus. Die Wiedergabe vermeidet daher sowohl „auf ihm“ als auch eine abgeschlossene Vergangenheitsform.
- source_word: መንፈሰ
  choice: Geist
  rationale: Im Zusammenhang verliehener Eigenschaften bezeichnet das Wort am natürlichsten „Geist“; „Atem“ oder „Wind“ passen hier weniger gut.
- source_word: ጥበብ
  choice: Weisheit
  rationale: Der Ausdruck bezeichnet hier Weisheit im geistigen und sittlichen Sinn und entspricht der gehobenen Aufzählung.
- source_word: ዘያሌቡ
  choice: der Einsicht verleiht
  rationale: Die verbale Form beschreibt wahrscheinlich die Wirkung dieses Geistes. „Einsicht verleiht“ bewahrt diese aktive Bedeutung besser als das rein substantivische „der Einsicht“.
- source_word: ትምህርት
  choice: Unterweisung
  rationale: Das Wort umfasst Lehre und Unterweisung. „Unterweisung“ ist im Deutschen prägnant, würdevoll und als Geistesgabe verständlich.
- source_word: ኃይል
  choice: Kraft
  rationale: „Kraft“ gibt die Bedeutung in dieser Reihe geistiger Befähigungen natürlich wieder, ohne sie unnötig als Herrschaft oder Gewalt zu deuten.
- source_word: እለ ኖሙ በጽድቅ
  choice: die in Gerechtigkeit schlafen
  rationale: Die wörtliche Schlafmetapher bleibt erhalten. Sie kann auf die gerecht Verstorbenen weisen, ohne diese Deutung ausdrücklich in den Haupttext einzutragen.
theological_decisions:
- issue: Bezug der abschließenden Geist-Formulierung
  choice: der Geist derer, die in Gerechtigkeit schlafen
  alternative: der Geist derer, die in Gerechtigkeit ruhen; der Geist der gerecht Verstorbenen
  rationale: „Schlafen“ bewahrt das apokalyptische Bild und die Spannung zwischen gewöhnlichem Ruhen und dem Schlaf des Todes. Die explizite Deutung als Verstorbene wäre plausibel, aber stärker auslegend als der Ausgangstext.
- issue: Art der Gegenwart des Geistes in der bezeichneten Person
  choice: in ihm wohnt
  alternative: in ihm ruht; in ihm bleibt
  rationale: Die Formulierung folgt der Präposition „in“ und dem fortdauernden Aspekt des Verbs. Sie legt nicht fest, ob dieses Wohnen als dauerhafte Innewohnung oder als prophetisches Ruhen zu verstehen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener Reihung von „Geist“. Die Formulierung ist gut vorlesbar, wahrt jedoch die semitisch geprägte Parallelstruktur und löst die mehrdeutige Schlafmetapher nicht im Haupttext auf.
