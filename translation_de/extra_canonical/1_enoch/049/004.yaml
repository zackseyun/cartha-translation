base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/004.yaml
  text: And he will judge the hidden things[a], and no one will be able to speak an empty word before him, for he is the Chosen One before the Lord of Spirits[c][b], according as he has willed.
translation:
  language: de
  text: Und er wird über das Verborgene richten,[a] und niemand wird vor ihm ein nichtiges Wort äußern können; denn er ist der Erwählte vor dem Herrn der Geister, so wie er es gewollt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die überlieferte ge’ezische Zeile ist an dieser Stelle schwierig. Der folgende Satz kann auch bedeuten: „Niemand kann vor ihm Unwahrheit äußern.“'
    reason: textual_variant
lexical_decisions:
- source_word: ይኴንን
  choice: wird … richten
  rationale: Das Verb bezeichnet richterliches Urteilen oder Entscheiden; der Futur entspricht dem eschatologischen Zusammenhang.
- source_word: ዘኅቡአተ
  choice: das Verborgene
  rationale: Die substantivierte Form bewahrt den Sammelsinn dessen, was verborgen oder verhüllt ist, ohne ihn auf bloße Geheimnisse einzuengen.
- source_word: በከ፡ አልቦ፡ ዘይክል፡ ብሂለ፡ በቅድሜሁ
  choice: niemand wird vor ihm ein nichtiges Wort äußern können
  rationale: Die überlieferte Zeile ist schwierig; diese Wiedergabe hält am erkennbaren Sinn fest, dass leere, nichtige oder unwahre Rede vor ihm keinen Bestand hat.
- source_word: ኅሩይ
  choice: der Erwählte
  rationale: Das Wort fungiert in den Bilderreden als Titel der endzeitlichen Gestalt. Die Großschreibung kennzeichnet den Titel, ohne eine spätere dogmatische Identifikation einzutragen.
- source_word: እግዚአ፡ መናፍስት
  choice: der Herr der Geister
  rationale: Dies gibt den wiederkehrenden Gottesnamen in 1 Henoch formal und verständlich wieder.
- source_word: በከመ፡ ውእቱ፡ ፈቀደ
  choice: so wie er es gewollt hat
  rationale: Die Formulierung wahrt den Bezug auf den Willen des Herrn der Geister und bleibt hinsichtlich des genaueren Verhältnisses von Erwählung und Willen zurückhaltend.
theological_decisions:
- issue: Titel und Identität von ኅሩይ
  choice: der Erwählte
  alternative: der Auserwählte; der erwählte Eine
  rationale: Im örtlichen apokalyptischen Sprachgebrauch ist dies ein wiederkehrender Titel. Die Übersetzung macht den Titel kenntlich, ohne ihn ausdrücklich mit einer späteren christologischen Formel gleichzusetzen.
- issue: Subjekt von „er es gewollt hat“
  choice: Pronomen beibehalten
  alternative: wie der Herr der Geister es gewollt hat
  rationale: Der unmittelbare Kontext legt den Herrn der Geister als Bezug nahe, doch der Ausgangstext nennt das Subjekt nicht erneut. Das Pronomen erhält diese formale Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem apokalyptischem Ton. „Das Verborgene“, „nicht existenziert“ vermieden; „nichtiges Wort“ bewahrt die Bildlichkeit und bleibt für heutige Leser verständlich. Sämtliche Fußnotenmarker stehen im Haupttext.
