base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/002.yaml
  text: For he is mighty in all the hidden things of righteousness[a], and lawlessness will pass away like a shadow and have no permanence; for the Chosen One stands before the Lord of Spirits, and his glory is forever and ever[d][c][b], and his power from generation to generation.
translation:
  language: de
  text: Denn er ist mächtig in allen verborgenen Dingen der Gerechtigkeit[a]. Die Gesetzlosigkeit wird wie ein Schatten vergehen und keinen Bestand haben[b]; denn der Erwählte[c] steht[d] vor dem Herrn der Geister, und seine Herrlichkeit währt von Ewigkeit zu Ewigkeit und seine Macht von Generation zu Generation.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verborgenen Angelegenheiten der Gerechtigkeit“. Der ge’ezische Ausdruck kann verborgene Bereiche oder Geheimnisse bezeichnen, die zur Gerechtigkeit gehören.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „kein Stehen haben“; auch: „nicht fortbestehen“.'
    reason: lexical_alternative
  - marker: c
    text: „Der Erwählte“ ist in den Bilderreden ein wiederkehrender Titel für die erhöhte Gestalt, die mit Gericht und Rechtfertigung verbunden ist.
    reason: cross_reference
  - marker: d
    text: 'Das ge’ezische Perfekt von „stehen“ kann bei einem Verb der Körperhaltung einen fortdauernden Zustand bezeichnen; daher: „steht“.'
    reason: source_aspect
lexical_decisions:
- source_word: ኃያል
  choice: mächtig
  rationale: Bewahrt den gehobenen apokalyptischen Ton und bezeichnet Kraft beziehungsweise Macht, ohne die Aussage zu übersteigern.
- source_word: ኅቡአተ ጽድቅ
  choice: verborgene Dinge der Gerechtigkeit
  rationale: Gibt den konkreten Plural und die Zugehörigkeitsbeziehung wieder, ohne vorschnell den fachsprachlicheren Begriff „Geheimnisse“ einzuführen.
- source_word: ዓመፃ
  choice: Gesetzlosigkeit
  rationale: Erhält den umfassenden Gegensatz zur Gerechtigkeit; „Gewalt“, „Bosheit“ oder „Ungerechtigkeit“ würden den Bedeutungsumfang jeweils stärker einengen.
- source_word: ጽላሎት የኃልፍ
  choice: wird wie ein Schatten vergehen
  rationale: Bewahrt das schlichte Bild und den zukunftsbezogenen Sinn, ohne Vernichtung ausdrücklich hineinzulesen.
- source_word: ምቅዋመ አልቦ
  choice: keinen Bestand haben
  rationale: Natürliches Deutsch für die Verneinung von Stehen, Fortdauer oder Bleiben; die Fußnote bewahrt die wörtlichere Alternative.
- source_word: ኅሩይ
  choice: der Erwählte
  rationale: Kennzeichnet den wiederkehrenden Titel der Bilderreden klar und würdevoll, ohne spätere christologische Formeln einzutragen.
- source_word: ቆመ
  choice: steht
  rationale: Das Perfekt eines Verbs der Körperhaltung hat hier stative Gegenwartsbedeutung; „steht“ drückt den fortdauernden Zustand vor dem Herrn der Geister aus.
- source_word: እግዚአ መናፍስት
  choice: Herr der Geister
  rationale: Bewahrt den charakteristischen göttlichen Titel des äthiopischen Henochbuches.
- source_word: ስብሐቲሁ
  choice: seine Herrlichkeit
  rationale: Entspricht dem biblisch-apokalyptischen Register und passt zur anschließenden Ewigkeitsformel.
- source_word: ለዓለመ ዓለም
  choice: von Ewigkeit zu Ewigkeit
  rationale: Eine geläufige, würdige deutsche Wiedergabe der intensivierten Ewigkeitsformel.
- source_word: ለትውልደ ትውልድ
  choice: von Generation zu Generation
  rationale: Folgt der Wiederholungsstruktur des Ausgangstextes und bleibt im modernen Standarddeutsch verständlich.
theological_decisions:
- issue: Titel oder bloße Beschreibung bei ኅሩይ
  choice: Als Titel „der Erwählte“ wiedergegeben
  alternative: „der erwählte Eine“ oder rein beschreibend „der Erwählte“ ohne titularen Hinweis
  rationale: In den Bilderreden fungiert der Ausdruck wiederholt als Bezeichnung einer erhöhten Gestalt. Die Übersetzung wahrt diese lokale Funktion, ohne die Gestalt ausdrücklich mit einer späteren Lehrformel gleichzusetzen.
- issue: Aspekt von ቆመ vor dem Herrn der Geister
  choice: „steht“
  alternative: „ist hingetreten“, „hat gestanden“ oder „stand“
  rationale: Bei einem Verb der Körperhaltung bezeichnet die ge’ezische Perfektform plausibel einen fortbestehenden Zustand. Das Präsens gibt dies im Deutschen am klarsten wieder.
- issue: Bedeutung von ዓመፃ im Gegensatz zu ጽድቅ
  choice: „Gesetzlosigkeit“
  alternative: „Gewalt“, „Bosheit“ oder „Ungerechtigkeit“
  rationale: Die breite moralische Gegenüberstellung von Gerechtigkeit und ihrer Verletzung bleibt erhalten, ohne den Ausdruck auf körperliche Gewalt oder eine einzelne Form des Unrechts zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit apokalyptisch-biblischem Klang. Die Satzglieder wurden zur besseren Lesbarkeit auf zwei Hauptsätze verteilt; Parallelismus, Bildsprache und die charakteristischen Titel bleiben erhalten.
