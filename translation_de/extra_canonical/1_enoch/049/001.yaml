base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/049/001.yaml
  text: For wisdom has been poured out like water[c][b][a], and glory will not fail before him forever and ever.
translation:
  language: de
  text: Denn Weisheit ist wie Wasser ausgegossen worden[c], und die Herrlichkeit wird vor ihm[a] in alle Ewigkeit nicht schwinden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Worauf sich „ihm“ bezieht, bleibt im Geʿez dieses Verses unausgesprochen. Der weitere Zusammenhang kann auf eine zuvor genannte erhöhte Gestalt weisen, doch der Vers selbst nennt sie nicht.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „wird vor ihm kein Ende nehmen“.'
    reason: lexical_alternative
  - marker: c
    text: 'Frühere Übersetzung: „wird ausgegossen werden“.'
    reason: previous_rendering
lexical_decisions:
- source_word: እስመ
  choice: Denn
  rationale: Die Konjunktion begründet oder erläutert den vorausgehenden Zusammenhang; „Denn“ bewahrt diese Verknüpfung in natürlichem, gehobenem Deutsch.
- source_word: ጥበብ
  choice: Weisheit
  rationale: Die Grundbedeutung passt zum weisheitlichen und offenbarenden Ton des Abschnitts, ohne den Begriff interpretierend zu verengen.
- source_word: ክዕወ
  choice: ist ausgegossen worden
  rationale: Die Perfektform bezeichnet eine vollzogene Handlung oder einen daraus bestehenden Zustand. Das deutsche Perfekt wahrt diesen Aspekt gegenüber dem nachfolgenden zukunftsbezogenen Verb.
- source_word: ከመ፡ ማይ
  choice: wie Wasser
  rationale: Die direkte Wiedergabe erhält das anschauliche Vergleichsbild.
- source_word: ወስብሐት
  choice: und die Herrlichkeit
  rationale: „Herrlichkeit“ gibt den himmlisch-erhabenen Sinn im Kontext am besten wieder; mögliche Bedeutungsanteile von Glanz oder Lob werden nicht überbetont.
- source_word: ኢትኃልቅ
  choice: wird nicht schwinden
  rationale: Das verneinte Verb bezeichnet ein Nicht-Aufhören oder Nicht-Zu-Ende-Gehen. „Nicht schwinden“ ist würdig, verständlich und lässt den fortdauernden Sinn hervortreten.
- source_word: ቅድሜሁ
  choice: vor ihm
  rationale: Die wörtlich-nahe Fassung bewahrt die räumlich-relationale Aussage und lässt den im Vers nicht ausdrücklich genannten Bezug des Pronomens offen.
- source_word: ለዓለመ፡ ዓለም
  choice: für immer und ewig
  rationale: Die geläufige deutsche Ewigkeitsformel gibt die nachdrückliche Dauer idiomatisch und in angemessenem Register wieder.
theological_decisions:
- issue: Bezug von „ihm“ in „vor ihm“
  choice: Das Pronomen bleibt im Haupttext ohne ausdrückliche Bestimmung seines Bezugs stehen.
  alternative: „vor dem Herrn der Geister“ oder „vor dem Erwählten/Menschensohn“
  rationale: Der einzelne geʿezische Vers enthält nur das Pronomen. Da der Bezug im weiteren Kontext unterschiedlich verstanden werden kann, darf er nicht aufgrund theologischer Erwartung stillschweigend festgelegt werden.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Ton. Das Bild vom ausgegossenen Wasser und die unbestimmte pronominale Bezugnahme bleiben erhalten; die Aspektdifferenz zwischen vollzogenem Ausgießen und künftigem Nicht-Schwinden wird sichtbar gemacht.
