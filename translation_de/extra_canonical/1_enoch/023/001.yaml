base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/023/001.yaml
  text: And from there I went to another place[a], toward the west[b], to the ends of the earth.
translation:
  language: de
  text: Und von dort ging ich an einen anderen Ort, westwärts, bis an die Enden der Erde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እምህየ
  choice: von dort
  rationale: Die ablativisch-deiktische Wendung verbindet den Ortswechsel klar mit der vorherigen Szene.
- source_word: ሖርኩ
  choice: ging ich
  rationale: Die schlichte Bewegungsform wird ohne unnötige literarische Ausschmückung wiedergegeben.
- source_word: ካልአ መካነ
  choice: an einen anderen Ort
  rationale: Die Formulierung bezeichnet einen vom vorigen Schauplatz verschiedenen Ort; im Deutschen verlangt das Bewegungsverb hier eine Zielangabe mit »an«.
- source_word: መንገለ ዓረብ
  choice: westwärts
  rationale: መንገለ bezeichnet die Richtung, und ዓረብ verweist auf den Westen beziehungsweise die Gegend des Sonnenuntergangs. »Westwärts« ist knapp und natürlich.
- source_word: እስከ አጽናፈ ምድር
  choice: bis an die Enden der Erde
  rationale: Die Wendung bezeichnet in apokalyptischer Bildsprache die äußersten Bereiche der Welt; der Plural bleibt erhalten.
theological_decisions:
- issue: Kosmische Geografie der visionären Reise
  choice: »die Enden der Erde« als kosmisch-apokalyptische Ortsangabe beibehalten
  alternative: »die ferne Grenze des Landes«
  rationale: Der Ausdruck soll nicht auf einen gewöhnlichen örtlichen Horizont reduziert werden. Die Übersetzung bewahrt die weiträumige visionäre Bildsprache, ohne deren Kosmologie näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit schlichtem Erzählfluss. Die korrigierte Himmelsrichtung »westwärts« folgt dem ge'ezischen ዓረብ; die widersprüchlichen englischen Fußnoten zum Osten wurden daher nicht übernommen.
