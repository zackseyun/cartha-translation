  source_fidelity: 'Die Übersetzung gibt die zentralen Elemente des ge’ezischen Textes zuverlässig wieder: die Ich-Erzählung („Und ich fragte“), die Frageform, das Demonstrativum und die Relativbestimmung über das Fehlen von Ruhe. Die Partizipial-/Quotativform እንዘ እብል („indem ich sagte/sagend“) ist idiomatisch und ohne Bedeutungsverlust durch den Doppelpunkt als direkte Rede wiedergegeben.'
  naturalness: '„Und ich fragte: »Was ist das, das keine Ruhe hat?«“ ist klares, modernes Standarddeutsch mit angemessen würdig-knappem Register. Die Wiederaufnahme „das, das“ ist zwar bewusst schlicht, aber grammatisch korrekt und hält den deiktischen, rätselhaften Charakter des Ausgangstextes fest.'
  terminology: „Ruhe“ ist für ዕረፍተ die beste unmarkierte Wiedergabe. Sie wahrt die Offenheit zwischen Ruhe, Rast und einem Aufhören, ohne eine weitergehende kosmologische oder theologische Deutung einzutragen. Die Fußnoten bieten angemessene, nicht doktrinäre Alternativen.
