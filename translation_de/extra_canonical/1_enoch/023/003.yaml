base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/023/003.yaml
  text: And I asked[a], saying[b], “What is this that has no rest?”
translation:
  language: de
  text: 'Und ich fragte: »Was ist das[a], das keine Ruhe[b] hat?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dies« beziehungsweise »dieses hier«; das ge’ezische Demonstrativpronomen verweist auf die Erscheinung, die Henoch gerade gesehen hat.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »Rast« oder »Stillstand«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስእልኩ
  choice: ich fragte
  rationale: Die erste Person Singular der vollendeten Verbform bezeichnet ein direktes Fragen oder Erkundigen; »ich fragte« ist im Deutschen klar und natürlich.
- source_word: እንዘ እብል
  choice: Einleitung der direkten Rede durch Doppelpunkt
  rationale: Die ge’ezische Wendung bedeutet wörtlich etwa »indem ich sagte« und dient hier als Redeeinleitung. Im modernen Deutschen gibt der Doppelpunkt diese Funktion natürlicher wieder, ohne Inhalt hinzuzufügen.
- source_word: ዝንቱ
  choice: das
  rationale: Das Demonstrativpronomen weist auf die unmittelbar zuvor wahrgenommene Erscheinung. Das deutsche »das« bewahrt diesen deiktischen Bezug, ohne den Gegenstand genauer zu bestimmen.
- source_word: ምንት ውእቱ
  choice: Was ist
  rationale: Interrogativpronomen und Kopula ergeben die schlichte, direkte Frage »Was ist …?«.
- source_word: ዘአልቦ ዕረፍተ
  choice: das keine Ruhe hat
  rationale: Die Relativkonstruktion verbindet negiertes Vorhandensein beziehungsweise Haben mit »Ruhe«. Die Wiedergabe bleibt nah am Bild des Ausgangstextes und vermeidet eine Deutung als Frieden oder völliges Aufhören.
theological_decisions:
- issue: Bedeutung von ዕረፍተ
  choice: Ruhe
  alternative: Rast; Stillstand
  rationale: »Ruhe« deckt den Grundsinn ab und lässt offen, ob rastlose Bewegung, fehlende Erholung oder ausbleibender Stillstand gemeint ist. Eine engere kosmologische oder gerichtstheologische Deutung wird nicht in den Text eingetragen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die formelhafte ge’ezische Redeeinleitung wird im Deutschen idiomatisch durch einen Doppelpunkt wiedergegeben; die knappe und rätselhafte Frageform bleibt erhalten.
