base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/023/004.yaml
  text: And at that time Raguel[a], one of the holy angels who was with me, answered me and said to me, “This course of fire which you saw toward the west[c][b], it is the fire that drives all the lights of heaven.”
translation:
  language: de
  text: 'Da antwortete mir Raguel, einer der heiligen Engel, der bei mir war, und sagte zu mir: »Diese Feuerbahn[a], die du westwärts gesehen hast, ist das Feuer, das alle Lichter des Himmels antreibt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dieser Feuerlauf«. Das zugrunde liegende Wort kann den Lauf, die Bewegung oder die Bahn des Feuers bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ
  choice: antwortete mir
  rationale: Das Verb bezeichnet hier ein Antworten oder Erwiderung und passt zum Gespräch innerhalb der Vision.
- source_word: ቅዱሳን መላእክት
  choice: heiligen Engel
  rationale: Dies ist die natürliche und traditionsneutrale deutsche Wiedergabe der apokalyptischen Bezeichnung.
- source_word: ዘርኢከ
  choice: den du … gesehen hast
  rationale: Die Form besteht aus dem Relativpartikel und der Verbform von »sehen« in der 2. Person Singular; sie bezeichnet keinen »Geist«.
- source_word: ሩጸተ
  choice: Feuerlauf
  rationale: Das Substantiv bezeichnet einen Lauf oder eine Bahn. Mit dem im Satz genannten Feuer verbunden ergibt »Feuerlauf« eine knappe, bildhafte Wiedergabe der kosmischen Bewegung.
- source_word: መንገለ ዐረብ
  choice: nach Westen hin
  rationale: Die Richtungsangabe weist auf den Westen beziehungsweise den Ort des Sonnenuntergangs; »nach Westen hin« ist im Deutschen klar und bewahrt die visionäre Raumangabe.
- source_word: ይሰድድ
  choice: antreibt
  rationale: Das Verb drückt ein kraftvolles In-Bewegung-Setzen oder Treiben aus. »Antreibt« passt natürlich zu den Himmelslichtern.
- source_word: ብርሃናተ ሰማይ
  choice: alle Lichter des Himmels
  rationale: Die Formulierung bewahrt das konkrete kosmische Bild und ist allgemein verständlicher als das fachsprachliche »Himmelsleuchten« oder »Gestirne«.
theological_decisions:
- issue: Deutung von ዘርኢከ und ሩጸተ
  choice: als »den du gesehen hast« und »Lauf« verstanden
  alternative: »Geist/Wind, der irreführt«
  rationale: Die ge'ezischen Formen bezeichnen hier erkennbar das Sehen und den Lauf. Die alternative Deutung beruht auf einer fehlerhaften Wortanalyse und würde eine personale oder dämonologische Bedeutung in den Text eintragen.
- issue: Kosmische Wirkkraft des Feuers
  choice: Das Feuer »treibt« die Himmelslichter an
  alternative: Das Feuer »jagt« oder »zerstreut« sie
  rationale: »Antreibt« erhält die Vorstellung einer wirksamen kosmischen Kraft, ohne eine feindliche oder zerstörerische Wirkung festzulegen.
translation_notes:
  register: Moderne, würdige Erzählsprache mit bewusst beibehaltenem apokalyptischem Bild. Die Wiederholung von »antwortete mir … und sagte zu mir« folgt der semitisch-ge'ezischen Ausdrucksweise, ohne den Satz unverständlich zu machen.
