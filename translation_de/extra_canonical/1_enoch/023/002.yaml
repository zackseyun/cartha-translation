base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/023/002.yaml
  text: And I saw a fire that burned and flowed[a], and it did not rest or cease from its course by day or by night[c][b], but continued in the same way.
translation:
  language: de
  text: Und ich sah ein Feuer, das brannte und dahinströmte[a]. Es ruhte nicht und hielt weder bei Tag noch bei Nacht in seinem Lauf inne[b], sondern setzte sich in derselben Weise fort[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „lief“ oder „rannte“. Das zugrunde liegende Verb bezeichnet Bewegung; zusammen mit „seinem Lauf“ später im Vers entsteht das Bild eines unablässig dahinströmenden Feuers.'
    reason: lexical_alternative
  - marker: b
    text: „In seinem Lauf“ kann auch „in seinem Dahinströmen“, „auf seinem Weg“ oder „in seinem Fließen“ verstanden werden. Gemeint ist die ununterbrochene Bewegung des Feuers.
    reason: lexical_alternative
  - marker: c
    text: 'Die Schlusswendung ist schwierig. Möglich ist auch: „sondern so war es“ oder „sondern ebenso“. Die Übersetzung versteht sie als Fortsetzung desselben Vorgangs.'
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: ወርኢኩ
  choice: Und ich sah
  rationale: Bewahrt die übliche Ich-Formel eines Visionsberichts in klarem, heutigem Deutsch.
- source_word: እሳተ
  choice: ein Feuer
  rationale: Das Feuer wird hier als neuer Gegenstand der Vision eingeführt.
- source_word: ዘይነድድ
  choice: das brannte
  rationale: Gibt die Relativkonstruktion und den aktiven Vorgang unmittelbar wieder.
- source_word: ዘይረውፅ
  choice: und dahinströmte
  rationale: Das Verb bezeichnet dem Wortfeld nach ein Laufen oder Sich-Bewegen; bei Feuer vermittelt „dahinströmen“ die fortlaufende Bewegung natürlich, ohne sie bloß als helles Aufflammen umzudeuten.
- source_word: እንዘ ኢያዓርፍ
  choice: Es ruhte nicht
  rationale: Erhält das anschauliche Bild ununterbrochener Tätigkeit und glättet es nicht zu einem bloßen „es brannte weiter“.
- source_word: ወኢይነትግ
  choice: und hielt … nicht inne
  rationale: Gibt zusammen mit „ruhte nicht“ die Nichtunterbrechung wieder, ohne ausdrücklich ein Erlöschen anzunehmen.
- source_word: እምሩፀቱ
  choice: in seinem Lauf
  rationale: Bewahrt die Verbindung zum Bewegungswort ይረውፅ und kann sowohl Verlauf als auch strömende Fortbewegung bezeichnen.
- source_word: መዐልተ ወሌሊተ
  choice: weder bei Tag noch bei Nacht
  rationale: Drückt die durchgängige Dauer idiomatisch und mit der negativen Konstruktion passend aus.
- source_word: አላ ከማሁሙ
  choice: sondern dauerte auf diese Weise fort
  rationale: Gibt die schwierige Schlusswendung als Fortdauer desselben Zustands wieder, ohne ihre Syntax übermäßig festzulegen.
