base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/004.yaml
  text: 'And I looked at them and saw: behold[a], they all let out their private parts like horses, and they began to mount the cows; and they all conceived and gave birth to elephants, camels[c][b], and donkeys.'
translation:
  language: de
  text: 'Und ich blickte sie an und sah: Siehe,[a] sie alle streckten ihre Geschlechtsteile wie Pferde hervor und begannen, die Kühe zu besteigen. Diese wurden alle schwanger und gebaren Elefanten, Kamele[b] und Esel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung „streckten ihre Geschlechtsteile hervor“ ist im Ge’ez sexuell deutlich und bezeichnet wahrscheinlich das Hervorstrecken beziehungsweise Entblößen der männlichen Geschlechtsorgane.
    reason: lexical_alternative
  - marker: b
    text: Die genannten Tiere sind die in der Vision hervorgebrachten Nachkommen. Das Bild gehört zum allegorischen Schema der Tierapokalypse und ist keine gewöhnliche zoologische Beschreibung.
    reason: cultural_note
lexical_decisions:
- source_word: ወነጸርክዎሙ
  choice: Und ich blickte sie an
  rationale: Gibt das visionäre Hinschauen natürlich und zugleich würdig wieder.
- source_word: ወርኢኩ ወነዋ
  choice: 'und sah: Siehe'
  rationale: Bewahrt die doppelte Schauformel und das ausdrückliche apokalyptische Aufmerksamkeitssignal.
- source_word: ኵሎሙ አውፁኡ ንፍረታቲሆሙ
  choice: sie alle ließen ihre Geschlechtsteile hervortreten
  rationale: Bewahrt gegenüber dem bloß statischen „entblößten“ die gerichtete beziehungsweise hervortretende Handlung des Verbs und gibt die sexuell deutliche Aussage klar, aber nicht vulgär wieder.
- source_word: ከመ አፍራስ
  choice: wie Pferde
  rationale: Erhält den wörtlichen Vergleich der Tierallegorie.
- source_word: ወአሐዙ ይዐረጉ ዲበ
  choice: und begannen, … zu besteigen
  rationale: Das wörtliche Hinaufsteigen wird im sexuellen Tierkontext idiomatisch und bildnah wiedergegeben.
- source_word: አንስት አልህምት
  choice: die Kühe
  rationale: አልህምት bezeichnet weibliche Rinder beziehungsweise Kühe, nicht Elefanten; die feminine Bezeichnung wird im Deutschen prägnant wiedergegeben.
- source_word: ወጸንሳ ኵሎነ
  choice: Diese wurden alle schwanger
  rationale: Der feminine Plural bezieht sich natürlich auf die Kühe. „Schwanger wurden“ ist im Deutschen klarer als ein möglicherweise transistiv missverständliches „empfingen“.
- source_word: ወወለዳ
  choice: und gebaren
  rationale: Kurze, gehobene und dennoch verständliche Wiedergabe des Gebärens.
- source_word: ነጌያተ ወአገማሰ ወአእዳገ
  choice: Elefanten, Kamele und Esel
  rationale: Gibt die drei genannten Arten der Nachkommen in geläufigem modernem Deutsch wieder.
theological_decisions:
- issue: Deutlichkeit der sexuellen Bildsprache in der Tierapokalypse
  choice: Die körperliche und sexuelle Handlung ausdrücklich als Hervortretenlassen der Geschlechtsteile und Besteigen wiedergeben
  alternative: Die Aussage zu allgemeinem Paarungsverhalten abschwächen
  rationale: Die verstörende, grenzüberschreitende Fortpflanzung gehört zur Aussagekraft der Vision. Eine Verallgemeinerung würde das Bild ohne textlichen Grund entschärfen.
- issue: Identität der weiblichen Tiere
  choice: „Kühe“
  alternative: „weibliche Elefanten“
  rationale: Der ge’ezische Ausdruck bezeichnet hier Rinder/Kühe; Elefanten werden erst in der anschließenden Liste der Nachkommen mit einem anderen Wort genannt. So bleibt auch die Spannung der symbolischen Kreuzung erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter apokalyptischer Schauformel. Die sexuell deutliche Bildsprache wird weder klinisch verschärft noch euphemistisch abgeschwächt. Das Pronomen „Diese“ verdeutlicht ohne sachliche Ergänzung, dass die Kühe schwanger werden.
