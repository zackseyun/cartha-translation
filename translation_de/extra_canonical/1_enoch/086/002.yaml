base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/002.yaml
  text: And after that I saw large and black cattle[a], and behold, all of them changed their stalls and their pastures and their calves[c][b], and they began to live with one another.
translation:
  language: de
  text: Und danach sah ich große, schwarze Rinder. Und siehe, sie alle veränderten ihre Ställe, ihre Weideplätze und ihre Kälber[a]; und sie begannen, miteinander zu leben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Aussage über das Verändern der „Ställe, Weideplätze und Kälber“ ist sprachlich und inhaltlich schwierig. Der ge’ezische Text verbindet Orte und Nachwuchs mit demselben Verb. Möglich ist auch: „ihre Wohnstätten, ihre Weideplätze und ihre Jungen“.'
    reason: textual_variant
  - marker: b
    text: 'Auch möglich: „und sie lebten beieinander“ oder „und sie wohnten miteinander“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አልህምተ
  choice: Rinder
  rationale: Der Sammelbegriff bewahrt die durchgehende Rindersymbolik der Tiervision, ohne das Geschlecht der Tiere unnötig festzulegen.
- source_word: ዐቢያነ
  choice: große
  rationale: Die konkrete Größenangabe passt zur anschaulichen Bildsprache der Vision.
- source_word: ጸሊማነ
  choice: schwarze
  rationale: Das Wort bezeichnet hier die schwarze Färbung und erhält den farblichen Kontrast innerhalb der Tiervision genauer als „dunkle“.
- source_word: ወለጡ
  choice: wechselten
  rationale: Das Verb bezeichnet eine Veränderung oder einen Wechsel. „Wechselten“ lässt die schwierige Beziehung zu den drei folgenden Objekten stehen, ohne sie erklärend aufzulösen.
- source_word: ምዕያኖሙ
  choice: ihre Ställe
  rationale: Im Zusammenhang der Rinderbilder liegt ein Ort der Unterbringung nahe; die mögliche allgemeinere Bedeutung „Wohnstätten“ wird in der Fußnote berücksichtigt.
- source_word: ምርጓዮሙ
  choice: ihre Weideplätze
  rationale: Die Wiedergabe ist natürlich und wahrt die pastorale Bildwelt.
- source_word: አጥዐጥሆሙ
  choice: ihre Kälber
  rationale: Im Kontext der Rinder ist die spezifische Bezeichnung für deren Junge angemessen, obwohl allgemeiner auch „ihre Jungen“ möglich ist.
- source_word: አሐዙ ተየሐይዉ ፩ ለካልኡ
  choice: sie begannen, miteinander zu leben
  rationale: Die Formulierung gibt sowohl den einsetzenden Vorgang als auch das gegenseitige Zusammenleben wieder.
theological_decisions:
- issue: Identifizierung der durch die Tiere dargestellten Menschengruppen
  choice: Die Tierbildsprache bleibt im Vers wörtlich erhalten.
  alternative: Die Tiere deutend als menschliche Gruppen wiedergeben.
  rationale: Die apokalyptische Vision soll nicht durch eine in den Text eingetragene Auslegung vereindeutigt werden.
- issue: Symbolische Farbbezeichnung
  choice: „schwarze“ statt des weniger bestimmten „dunkle“
  alternative: „dunkle“
  rationale: Die konkrete Farbangabe wahrt den im Kontext bedeutsamen Kontrast der verschiedenfarbigen Tiere, ohne dessen symbolische Bedeutung im Haupttext auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter apokalyptischer Tierbildsprache. „Und siehe“ bleibt als visionäres Gliederungssignal erhalten. Die ungewöhnliche Verbindung der drei Objekte wird nicht stillschweigend geglättet, sondern im Haupttext bewahrt und in einer Fußnote erläutert.
