base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/003.yaml
  text: And again I saw in the vision[a], and I looked up to heaven; and behold, I saw many stars. They came down and were cast from heaven to that first star, and among those calves they became bulls[d][c][b], and they pastured with them.
translation:
  language: de
  text: 'Und wieder sah ich in der Vision und blickte zum Himmel. Und siehe: Ich sah viele Sterne. Sie kamen herab und wurden vom Himmel zu jenem ersten Stern geworfen.[a] Mitten unter jenen Kälbern wurden sie zu Stieren[b] und weideten mit ihnen.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Jener erste Stern“ verweist wahrscheinlich auf den zuvor in der Vision erwähnten Stern.
    reason: cross_reference
  - marker: b
    text: Die visionäre Tierbildsprache bleibt wörtlich erhalten. Frühere Wiedergaben, die hier von Stieren und Pferden sprechen, beruhen auf abweichenden lexikalischen Deutungen der Tierbegriffe.
    reason: alternative_reading
  - marker: c
    text: Die Verbform wird hier als „sie weideten“ verstanden. Wegen der Ähnlichkeit zweier Wurzeln wurde sie auch mit „sie wurden gesehen“ oder „sie erschienen“ wiedergegeben.
    reason: textual_difficulty
lexical_decisions:
- source_word: ወካዕበ፡ ርኢኩ፡ በራእይ
  choice: Und wieder sah ich in der Vision
  rationale: Bewahrt die wiederaufnehmende Erzählformel und den ausdrücklichen visionären Rahmen.
- source_word: ወነጸርክዎ፡ ለሰማይ
  choice: und blickte zum Himmel
  rationale: Gibt die gerichtete Blickbewegung natürlich und würdevoll wieder.
- source_word: ወነዋ
  choice: Und siehe
  rationale: Erhält die deiktische Eindringlichkeit der apokalyptischen Darstellung.
- source_word: ከዋክብተ፡ ብዙኃነ
  choice: viele Sterne
  rationale: Direkte, klare Wiedergabe des Plurals mit Mengenangabe; die Bildsprache wird nicht als Engel gedeutet.
- source_word: ወረዱ፡ ወተገደፉ፡ እምሰማይ
  choice: Sie kamen herab und wurden vom Himmel … hinabgeworfen
  rationale: Unterscheidet den Abstieg vom anschließenden passiven, gewaltsamen Hinabwerfen.
- source_word: በኀበ፡ ዝኩ፡ ኮከብ፡ ቀዳማዊ
  choice: zu jenem ersten Stern
  rationale: Der Demonstrativausdruck verweist wahrscheinlich auf einen bereits erwähnten Stern; die Ordnungsangabe wird nicht geglättet.
- source_word: ማእከለ፡ እልኩ፡ ጣዕዋ
  choice: mitten unter jenen Kälbern
  rationale: ጣዕዋ bezeichnet hier Kälber beziehungsweise junge Rinder, nicht allgemein Stiere.
- source_word: አልህምት፡ ኮኑ
  choice: wurden sie zu Stieren
  rationale: Die zoomorphe Verwandlung wird konkret bewahrt; im Zusammenhang bezeichnet der Ausdruck männliche Rinder, nicht Pferde.
- source_word: ወምስሌሆሙ፡ ይትረዓዩ
  choice: und weideten mit ihnen
  rationale: Die Verbform wird von der Wurzel für Weiden oder Grasen her verstanden, nicht von der ähnlich aussehenden Wurzel für Sehen.
theological_decisions:
- issue: Identität der Sterne
  choice: Im Haupttext bleibt die Bezeichnung „Sterne“ stehen.
  alternative: Engel beziehungsweise himmlische Wesen
  rationale: Der Text bietet das visionäre Symbol; seine mögliche Deutung als himmlische Wesen soll nicht in die Übersetzung eingetragen werden.
- issue: Art des Herabkommens
  choice: „wurden vom Himmel … hinabgeworfen“
  alternative: „fielen vom Himmel“
  rationale: Die passive Form legt eine von außen bewirkte, gewaltsame Bewegung nahe, ohne den Handelnden zu benennen.
- issue: Deutung der Tierverwandlung
  choice: Kälber und Stiere werden als konkrete Bildbegriffe beibehalten.
  alternative: Deutende Wiedergabe als Frauen und Wächter
  rationale: Die allegorische Bedeutung wird nicht an die Stelle der ausdrücklich verwendeten Tierbilder gesetzt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die wiederholte Seh- und Himmelsmotivik bleibt erhalten; Symbolik und lexikalische Unsicherheiten werden nicht konfessionell aufgelöst.
