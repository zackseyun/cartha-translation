base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/006.yaml
  text: And they began again to devour those cattle[a], and behold[c][b], all the children of the earth began [to tremble and flee].
translation:
  language: de
  text: Und sie begannen wieder, jene Rinder zu verschlingen; und siehe, alle Kinder der Erde[b] begannen [zu zittern und zu fliehen].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier vorgelegte ge'ezische Verszeugnis bricht nach „begannen“ ab. „Zu zittern und zu fliehen“ ergänzt die in einer vollständigeren Überlieferung bezeugte Fortsetzung.
    reason: textual_variant
  - marker: b
    text: Wörtlich „Kinder der Erde“; gemeint sein können die irdischen Geschöpfe oder Bewohner, doch die apokalyptische Ausdrucksweise bleibt bewusst erhalten.
    reason: cultural_note
lexical_decisions:
- source_word: አሐዙ እንከ
  choice: Da begannen sie
  rationale: አሐዙ bezeichnet hier den Beginn einer Handlung; እንከ führt die Handlung im Sinn von „da/dann“ weiter. Das gibt den erzählerischen Fortgang wieder, ohne zwingend eine Wiederholung anzunehmen.
- source_word: ይብልዕዎሙ
  choice: sie … zu verschlingen
  rationale: Das Verb bedeutet „essen, verzehren, verschlingen“. Wegen der gewaltsamen Tierbildsprache ist „verschlingen“ angemessen; das Objektsuffix wird im Zusammenhang mit den folgenden Rindern wiedergegeben.
- source_word: እልኩ አልህምት
  choice: jene Rinder
  rationale: አልህምት bezeichnet Rinder beziehungsweise Rindvieh, nicht Elefanten; እልኩ hat demonstrative Kraft und wird mit „jene“ ausgedrückt.
- source_word: ነዋ
  choice: Und siehe
  rationale: ነዋ ist hier die aufmerksamkeitslenkende Interjektion „siehe!“, nicht ein Verb für Zittern oder Furcht.
- source_word: ኵሎሙ ውሉደ ምድር
  choice: Alle Kinder der Erde
  rationale: Die wörtliche apokalyptische Wendung bleibt erhalten, statt sie deutend zu „alle Bewohner der Erde“ zu verflachen.
- source_word: '[ይርዐዱ ወይርወጹ]'
  choice: '[zu zittern und zu fliehen]'
  rationale: Diese Verben fehlen im vorgelegten, nach አሐዙ abgebrochenen Verszeugnis, sind aber durch die angegebene textkritische Revision als Fortsetzung bezeugt. Eckige Klammern kennzeichnen die Ergänzung transparent.
theological_decisions:
- issue: Konkrete Tierbildsprache der Tierapokalypse
  choice: Rinder
  alternative: symbolische Deutung als Menschen, Herrscher oder Völker
  rationale: Die Übersetzung bewahrt die konkrete Gestalt der Vision und entschlüsselt das Symbol nicht im Haupttext.
- issue: Apokalyptische Bezeichnung ውሉደ ምድር
  choice: Kinder der Erde
  alternative: Bewohner der Erde
  rationale: Die bildhafte und möglicherweise theologisch bedeutsame Ausdrucksweise bleibt offen und wird nicht stillschweigend auf eine sachliche Paraphrase reduziert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Und siehe“ bewahrt den visionären Signalruf; die Satzstruktur bleibt klar und mündlich verständlich. Eckige Klammern markieren ausschließlich den wegen des abgebrochenen Ausgangszeugnisses ergänzten Text.
