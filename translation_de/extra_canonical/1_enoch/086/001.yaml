base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/001.yaml
  text: And again I looked with my eyes while I was sleeping[a], and I saw heaven above, and behold, one star fell from heaven[c][b], and it arose and ate and grazed in the midst of those cattle.
translation:
  language: de
  text: Und wieder schaute ich mit meinen Augen, während ich schlief, und ich sah den Himmel oben. Und siehe, ein Stern[a] fiel vom Himmel; er erhob sich und fraß und weidete[b] mitten unter jenen Rindern[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In der Tierapokalypse stehen Sterne häufig sinnbildlich für himmlische Wesen; der Vers selbst spricht jedoch von einem „Stern“.
    reason: cross_reference
  - marker: b
    text: 'Wörtlich stehen hier zwei Verben: „fraß und weidete“. So bleibt die Tierbildsprache der Vision erhalten.'
    reason: lexical_alternative
  - marker: c
    text: Das äthiopische Wort bezeichnet Rinder oder Großvieh, nicht speziell Kälber.
    reason: lexical_clarification
lexical_decisions:
- source_word: ካዕበ
  choice: wieder
  rationale: Kennzeichnet einen weiteren Abschnitt der Traumvision und bewahrt die wiederholende Erzählfolge.
- source_word: ርኢኩ በአዕይንትየ … ወርኢኩ
  choice: schaute ich mit meinen Augen … und ich sah
  rationale: Die Wiederholung des Verbs des Sehens bleibt erhalten; „schaute“ und „sah“ vermeiden dabei unnötig schwerfälligen Gleichklang.
- source_word: እንዘ እነውም
  choice: während ich schlief
  rationale: Gibt den ausdrücklichen Traumrahmen klar und in natürlichem modernem Deutsch wieder.
- source_word: ሰማየ መልዕልተ
  choice: den Himmel oben
  rationale: Bewahrt die räumliche Ausrichtung nach oben, ohne eine ausgearbeitete Kosmologie in die Formulierung einzutragen.
- source_word: ነዋ
  choice: siehe
  rationale: Die deiktische Partikel hebt eine auffällige Erscheinung hervor; „siehe“ entspricht dem würdevollen apokalyptischen Register.
- source_word: ኮከብ አሐዱ
  choice: ein Stern
  rationale: Gibt das konkrete Bild und die Einzahl schlicht wieder, ohne den Stern bereits als Engel zu deuten.
- source_word: ወድቀ እምሰማይ
  choice: fiel vom Himmel
  rationale: Bewahrt die deutliche Abwärtsbewegung und die Eindringlichkeit des Bildes.
- source_word: ወይትሌዐል
  choice: er erhob sich
  rationale: Gibt die auf den Fall folgende Bewegung wieder, ohne zwischen Aufstehen und Erhöhtwerden dogmatisch zu entscheiden.
- source_word: ወይበልዕ ወይትረዐይ
  choice: fraß und weidete
  rationale: Erhält beide Verben und damit die bewusst tierhafte Bildsprache; „fraß“ passt im Deutschen zum anschließenden Weiden.
- source_word: ማእከለ እልከቱ አልህምት
  choice: mitten unter jenen Rindern
  rationale: አልህምት bezeichnet Rinder beziehungsweise Großvieh, nicht speziell Kälber; „unter“ ist bei einer Gruppe idiomatischer als eine starre Wiedergabe mit „in der Mitte“.
theological_decisions:
- issue: Ob der Stern im Haupttext als Engel oder himmlisches Wesen erklärt werden soll
  choice: Das Bild „ein Stern“ bleibt unverändert stehen.
  alternative: „ein Engel“ oder „ein engelgleicher Stern“
  rationale: Sterne können in der Tierapokalypse himmlische Wesen darstellen, doch der Vers selbst nennt einen Stern. Die Übersetzung bewahrt das Symbol und lässt seine Deutung offen.
- issue: Ob das Erheben als passives Erhöhtwerden verstanden werden soll
  choice: „er erhob sich“
  alternative: „er wurde emporgehoben“
  rationale: Die Form lässt ein Aufstehen beziehungsweise Sich-Erheben zu. Die aktive Wiedergabe folgt dem Handlungsablauf, ohne eine göttliche Erhöhung zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener visionärer Wiederholung. Das traditionelle „siehe“ trägt den apokalyptischen Ton, während Satzbau und Wortwahl für heutige Leser verständlich bleiben.
