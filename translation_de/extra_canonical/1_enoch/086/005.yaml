base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/086/005.yaml
  text: And all the cattle feared them and were terrified by them[b][a], and they began to bite with their teeth and to devour and to gore with their horns.
translation:
  language: de
  text: Und alles Vieh fürchtete sich vor ihnen und erschrak vor ihnen. Da fingen jene an, mit ihren Zähnen zu beißen, zu verschlingen und mit ihren Hörnern zuzustoßen.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das äthiopische Verb hat hier nur ein unausgesprochenes Subjekt in der Mehrzahl. Dem Zusammenhang nach sind mit „jene“ die zuvor genannten Tiere gemeint; die Form selbst nennt ihr Bezugswort nicht ausdrücklich.
    reason: textual_ambiguity
  - marker: b
    text: 'Die Tierdarstellung bleibt bewusst erhalten: Das Vieh reagiert mit Furcht, während die anderen Tiere mit Zähnen und Hörnern angreifen. Welche Menschengruppen die Tiere versinnbildlichen, sagt dieser Vers nicht ausdrücklich.'
    reason: cultural_note
lexical_decisions:
- source_word: ኵሎሙ፡ አልህምት
  choice: alles Vieh
  rationale: Der Ausdruck bezeichnet die Gesamtheit der Rinder beziehungsweise Herdentiere. „Alles Vieh“ bewahrt das Tierbild und legt weder Geschlecht noch genaue Unterart fest.
- source_word: ፈርህዎሙ፡ ወደንገፁ፡ እምኔሆሙ
  choice: fürchtete sich vor ihnen und erschrak vor ihnen
  rationale: Die zwei Verben der Furcht bleiben als Steigerung erhalten. „Vor ihnen“ gibt die Präposition እምኔሆሙ natürlich wieder, ohne sie eindeutig kausal als „durch sie“ festzulegen.
- source_word: ወአሐዙ
  choice: Da fingen jene an
  rationale: Das Verb leitet den Beginn einer Handlung ein. „Jene“ macht den im Kontext naheliegenden Subjektwechsel zu den zuvor genannten Tieren kenntlich, während eine Fußnote auf die im Verb selbst nicht ausdrücklich bezeichnete Referenz hinweist.
- source_word: ይኔክሱ፡ በስኒሆሙ
  choice: mit ihren Zähnen zu beißen
  rationale: Die konkrete tierische Gewaltdarstellung und die instrumentale Wendung werden unmittelbar wiedergegeben.
- source_word: ይውሕጡ
  choice: zu verschlingen
  rationale: „Verschlingen“ erfasst den gewaltsamen Sinn des Verbs besser als das neutralere „verzehren“.
- source_word: ይወግኡ፡ በአቅርንቲሆሙ
  choice: mit ihren Hörnern zuzustoßen
  rationale: Das Verb bedeutet grundsätzlich schlagen oder stoßen; zusammen mit den Hörnern bezeichnet es einen Hornstoß. „Zustoßen“ ist im Deutschen natürlich und bleibt etwas weniger spezialisiert als „aufspießen“.
theological_decisions:
- issue: Symbolische Tiere oder unmittelbar gedeutete Menschengruppen
  choice: Die Tierbilder bleiben im Haupttext ausdrücklich erhalten.
  alternative: Die Tiere als die durch sie symbolisierten Menschengruppen wiedergeben.
  rationale: Der Text entfaltet seine Aussage in einer durchgehenden apokalyptischen Tiersymbolik. Eine direkte Identifizierung der Sinnbilder wäre bereits Auslegung und wird vom Vers selbst nicht geliefert.
- issue: Bezugswort des pluralischen Subjekts nach der Furchtreaktion des Viehs
  choice: „jene“ verweist im Kontext auf die zuvor genannten angreifenden Tiere.
  alternative: „sie“, was im Deutschen leicht auf das unmittelbar zuvor genannte Vieh bezogen würde.
  rationale: Die Verbform nennt nur ein Subjekt in der dritten Person Plural. Der Erzählzusammenhang legt einen Wechsel zu den Wesen nahe, vor denen sich das Vieh fürchtet; die Fußnote hält fest, dass dieser Bezug grammatisch nicht eigens ausgedrückt ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit anschaulichen und leicht verständlichen Verben. Die Wiederholung „vor ihnen“ wahrt die zweigliedrige Furchtformulierung; der neue Satz verhindert eine schwerfällige Kettenkonstruktion.
