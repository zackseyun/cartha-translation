  source_fidelity: 'Der deutsche Text gibt die Abfolge und Bildsprache des geʽezischen Textes getreu wieder: das gesamte Vieh fürchtet sich und erschrickt vor den anderen Wesen; anschließend setzt das Beißen, Verschlingen und Zustoßen mit Hörnern ein. Die wiederholte Wendung „vor ihnen“ bildet die zweigliedrige Furchtaussage und die Präpositionalphrase angemessen ab. „Jene“ macht den im Kontext naheliegenden Subjektwechsel verständlich, während die Fußnote zutreffend festhält, dass das Subjekt im Vers selbst nicht ausdrücklich genannt wird.'
  naturalness: „Und alles Vieh fürchtete sich vor ihnen und erschrak vor ihnen. Da fingen jene an, mit ihren Zähnen zu beißen, zu verschlingen und mit ihren Hörnern zuzustoßen“ ist klares, modernes Standarddeutsch mit einem würdigen erzählerischen Register. Die Satzteilung vermeidet eine unübersichtliche Reihung. „Jene“ ist hier leicht gehoben, aber natürlich und zweckmäßig, da ein schlichtes „sie“ im Deutschen leicht auf das Vieh bezogen würde.
  terminology: „Vieh“ bewahrt die allgemeine bovine/Herdentier-Bildsprache, ohne sie zu einer bestimmten Tierart einzuengen. „Verschlingen“ und „mit ihren Hörnern zuzustoßen“ treffen die gewaltsame konkrete Bildlichkeit. Die Fußnoten bewahren die symbolische Ebene, ohne menschliche Referenten oder konfessionelle Deutungen einzutragen; ihre Anker stehen sinnvoll am Ende der betreffenden Aussage.
