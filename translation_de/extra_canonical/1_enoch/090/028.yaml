base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/028.yaml
  text: And I stood watching until that old house was folded up[a]; and they carried out all the pillars, and all the beams and ornaments of that house were folded up with it[c][b], and they carried it out and set it down in one place in the south of the land.
translation:
  language: de
  text: Und ich stand da und sah zu, bis jenes alte Haus zusammengefaltet wurde.[a] Sie trugen alle Säulen hinaus, und alle Pflanzen und Balken jenes Hauses wurden mit ihm zusammengefaltet. Dann trugen sie es hinaus und legten es an einem Ort im Süden des Landes nieder.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „zusammengefaltet“ wiedergegebene Verb kann auch „eingewickelt“, „zusammengerollt“ oder „abgebaut“ bedeuten. Gemeint ist, dass das alte Bauwerk gesammelt weggebracht und nicht nur zerstört wird.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „zur Rechten des Landes“. In einer nach Osten ausgerichteten Richtungsangabe bezeichnet die rechte Seite den Süden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ቆምኩ፡ አርእይ
  choice: ich stand da und sah zu
  rationale: Die Verbindung bezeichnet im Visionsbericht ein anhaltendes Beobachten. Die Formulierung bewahrt sowohl das Stehen als auch das Zuschauen in natürlichem Deutsch.
- source_word: ተጠወም / ተጠውሙ
  choice: wurde/wurden zusammengefaltet
  rationale: Das wiederholte Verb zeichnet das Bild eines Hauses, das mitsamt seinen Bestandteilen zusammengelegt oder eingehüllt wird. „Zusammengefaltet“ erhält dieses ungewöhnliche apokalyptische Bild, statt es als bloße Zerstörung zu deuten.
- source_word: ቤት፡ ብሉይ
  choice: altes Haus
  rationale: Die direkte Wiedergabe wahrt die Bildsprache und legt die mögliche Tempelbedeutung nicht bereits in die Übersetzung hinein.
- source_word: አውፅእዎሙ / አውፅእዎ
  choice: trugen … hinaus
  rationale: Das Kausativverb bedeutet „hinausbringen/entfernen“; im Zusammenhang mit Säulen und dem Haus ist „hinaustragen“ anschaulich und idiomatisch.
- source_word: አዕማድ
  choice: Säulen
  rationale: Ein klarer architektonischer Ausdruck, der die konkrete Bildwelt des Textes bewahrt.
- source_word: አትክልት
  choice: Pflanzen
  rationale: Der gewöhnliche Wortsinn ist Pflanzen beziehungsweise Anpflanzungen. Die wörtliche Wiedergabe vermeidet eine unbelegte Umdeutung zu „Verzierungen“.
- source_word: ሤስ
  choice: Balken
  rationale: Im baulichen Zusammenhang bezeichnet das Wort wahrscheinlich hölzerne Bauteile; „Balken“ passt zur Folge von Säulen und Bestandteilen des Hauses.
- source_word: ምስሌሁ
  choice: mit ihm
  rationale: Das Pronomen zeigt, dass die Pflanzen und Balken zusammen mit dem Haus gefaltet wurden.
- source_word: ወወደይዎ
  choice: legten es … nieder
  rationale: Nach dem Hinaustragen wird das Haus an einem Ort abgelegt; „niederlegen“ gibt diesen körperlichen Vorgang würdig und klar wieder.
- source_word: በ፪መካን
  choice: an einem Ort
  rationale: Die Wendung bezeichnet einen einzelnen, bestimmten Ablageort.
- source_word: በየማነ፡ ምድር
  choice: im Süden des Landes
  rationale: „Zur Rechten des Landes“ hat in der nach Osten orientierten Richtungsangabe den Sinn „im Süden“. Die idiomatische Richtung steht im Haupttext, die wörtliche Form in der Fußnote.
theological_decisions:
- issue: Möglicher Tempelbezug des „alten Hauses“
  choice: altes Haus
  alternative: alter Tempel
  rationale: Die Vision kann Tempelsymbolik tragen, doch der Ausgangstext sagt „Haus“. Die Übersetzung bewahrt diese Offenheit und lässt die symbolische Deutung aus dem Zusammenhang hervorgehen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Erzählton. Die ungewöhnliche Bildsprache der Vision bleibt bewusst sichtbar; „Haus“ wird nicht konfessionell oder interpretierend zu „Tempel“ präzisiert.
