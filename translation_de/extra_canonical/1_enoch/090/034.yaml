base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/034.yaml
  text: And I saw until they laid aside that sword which had been given to the sheep[a], and they brought it into the house and sealed it before the face of the Lord; and all the sheep were summoned into that house[e][d][c][b], and it did not contain them.
translation:
  language: de
  text: Und ich sah, bis sie jenes Schwert niederlegten, das den Schafen gegeben worden war, und sie brachten es in das Haus und versiegelten es vor dem Angesicht des Herrn.[a] Und alle Schafe wurden in jenes Haus gerufen,[b] und es enthielt sie nicht.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '„Vor dem Angesicht des Herrn“ bedeutet hier: in der Gegenwart des Herrn.'
    reason: lexical_alternative
  - marker: b
    text: Das „Haus“ kann in der Bildwelt der Vision an den Tempel oder an die endzeitliche Wohnstätte des Volkes Gottes erinnern; der Text selbst sagt jedoch nur „Haus“.
    reason: cultural_note
  - marker: c
    text: Die Aussage bedeutet wahrscheinlich, dass das Haus nicht alle Schafe aufnehmen konnte.
    reason: lexical_alternative
lexical_decisions:
- source_word: አሰከብዎ
  choice: sie legten … nieder
  rationale: Das Kausativverb bezeichnet wörtlich ein Hinlegen oder Niederlegen. Beim Schwert bewahrt „niederlegen“ das konkrete Bild und kann zugleich die Aufgabe der Waffe anklingen lassen.
- source_word: ሰይፍ
  choice: Schwert
  rationale: Die gewöhnliche konkrete Bezeichnung der Waffe; das apokalyptische Bild bleibt unverändert erhalten.
- source_word: ተውህበ ለአባግዕ
  choice: das den Schafen gegeben worden war
  rationale: Die passive Vorzeitigkeit verweist natürlich auf die frühere Übergabe des Schwertes; „Schafe“ wahrt die Bildsprache des Tiergleichnisses.
- source_word: አግብእዎ ውስተ ቤት
  choice: Sie brachten es in das Haus
  rationale: Das pronominale Objekt bezieht sich am naheliegendsten auf das Schwert. „Brachter es hinein“ wäre möglich, doch „in das Haus“ gibt die Präpositionalfügung klar wieder.
- source_word: ኀተማ እምቅድመ ገጹ ለእግዚእ
  choice: versiegelten es vor dem Angesicht des Herrn
  rationale: „Vor dem Angesicht“ erhält die semitisch geprägte Wendung und ihren feierlichen Ton; eine Fußnote erklärt die natürliche Bedeutung „in der Gegenwart“. Ein zusätzliches „fest“ oder „weg“ wäre nicht ausdrücklich belegt.
- source_word: ተጸውዑ
  choice: wurden … gerufen
  rationale: Die Passivform wird gewahrt. „Gerufen“ ist im heutigen Deutsch natürlicher als „einberufen“, ohne den formellen Charakter des Geschehens auszuschließen.
- source_word: ወኢያገምሮሙ
  choice: doch es konnte sie nicht alle fassen
  rationale: Das Haus ist der nächstliegende Bezug des singularischen Subjekts. „Fassen“ gibt die räumliche Bedeutung von enthalten beziehungsweise umfassen idiomatisch wieder; „alle“ verdeutlicht im Deutschen den aus der Gesamtheit der Schafe folgenden Sinn, ohne die Aussage umzudeuten.
theological_decisions:
- issue: Titel ለእግዚእ im visionären Kontext
  choice: des Herrn
  alternative: des Gebieters
  rationale: „Herr“ ist die übliche würdevolle Wiedergabe des Titels und legt keine besondere christologische Identität fest.
- issue: Symbolische Deutung von ቤት
  choice: Haus
  alternative: Tempel
  rationale: Der Ausgangstext nennt schlicht ein „Haus“. Eine mögliche Deutung als Tempel oder endzeitliche Wohnstätte wird nicht in den Haupttext eingetragen.
- issue: Bezug der abschließenden Aussage
  choice: Das Haus konnte die Schafe nicht alle fassen
  alternative: Es genügte ihnen nicht
  rationale: Das Haus ist das nächstliegende grammatische Bezugswort, und das Verb bezeichnet das Enthalten oder Umfassen. Die mögliche Nuance der Unzulänglichkeit bleibt in einer Fußnote erwähnt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzgliederung. Die wiederholte Bildsprache von Schwert, Schafen und Haus bleibt erhalten. Der semitische Ausdruck „vor dem Angesicht des Herrn“ wird bewusst im Haupttext bewahrt und erläutert.
