base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/014.yaml
  text: And I saw until that man came[a], the one who had written down the names of the shepherds, and he brought them up before the Lord of the sheep; and he helped him and rescued him[c][b], and he showed him everything concerning the downfall of his helper.
translation:
  language: de
  text: Und ich sah, bis jener Mann kam, der die Namen der Hirten aufgeschrieben hatte,[b] und sie vor den Herrn der Schafe hinaufbrachte. Er half ihm und rettete ihn, und er zeigte jenem Widder das ganze Herabkommen seines Helfers.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der letzte Satzteil ist im überlieferten äthiopischen Text schwer verständlich. „Herabkommen“ kann hier auch das Eingreifen des Helfers meinen; manche Deutungen verstehen die Wortgruppe als dessen Niedergang.
    reason: textual_variant
  - marker: b
    text: Der Mann, der die Namen der Hirten aufgeschrieben hatte, ist die himmlische Schreiberfigur, die in der Gerichtsszene dieser Vision bereits tätig war.
    reason: cross_reference
lexical_decisions:
- source_word: ብእሲ
  choice: Mann
  rationale: Das Wort bezeichnet gewöhnlich einen Mann. Die konkrete Bildsprache bleibt erhalten, ohne die Gestalt ausdrücklich als Engel zu bestimmen.
- source_word: ዘጸሐፈ አስማቲሆሙ ለኖሎት
  choice: der die Namen der Hirten aufgeschrieben hatte
  rationale: Der Relativsatz verweist auf die frühere Tätigkeit des Mannes als Schreiber; das Plusquamperfekt macht diesen Rückbezug im Deutschen deutlich.
- source_word: ያዐርግ ቅድሜሁ ለእግዚአ አባግዕ
  choice: sie vor den Herrn der Schafe hinaufbrachte
  rationale: „Hinaufbrachte“ bewahrt die im Verb enthaltene Aufwärtsbewegung, während „vor“ die Präsentation vor dem göttlichen Richter ausdrückt.
- source_word: ረዳኦ ወአድኃኖ
  choice: half ihm und rettete ihn
  rationale: 'Die beiden Verben werden unterschieden wiedergegeben: zunächst Beistand, dann Rettung.'
- source_word: ለዝኩ ይቤላ
  choice: jenem Widder
  rationale: ይቤላ bezeichnet hier den Widder beziehungsweise Bock, die bereits zuvor auftretende Führergestalt; der Demonstrativ wird mit „jenem“ wiedergegeben.
- source_word: ኵሎ መራደ ለረዳኢቱ
  choice: den ganzen Abstieg seines Helfers
  rationale: Die schwierige Wortgruppe wird möglichst nah als nominale Aussage über den vollständigen „Abstieg“ des Helfers wiedergegeben. Damit wird weder eine bloße Offenbarung von „allem“ noch ein „Untergang“ vorschnell festgelegt.
theological_decisions:
- issue: Identität des Mannes
  choice: jener Mann
  alternative: jener Engel / die himmlische Schreiberfigur
  rationale: Der lokale Wortlaut nennt einen Mann. Seine himmlische Funktion ergibt sich aus dem Zusammenhang, soll aber nicht in den Haupttext eingetragen werden.
- issue: Göttlicher Titel እግዚአ አባግዕ
  choice: der Herr der Schafe
  alternative: der Gebieter der Schafe
  rationale: „Herr der Schafe“ bewahrt den wiederkehrenden göttlichen Titel und dessen feierliches Gewicht.
- issue: Bedeutung von „Abstieg“ im Schlusssatz
  choice: Abstieg seines Helfers
  alternative: Herabkommen beziehungsweise Eingreifen seines Helfers; Untergang seines Helfers
  rationale: Die Überlieferung ist an dieser Stelle schwer verständlich. Die Übersetzung bewahrt deshalb die räumliche und zugleich potenziell bildhafte Aussage, ohne sie theologisch auszudeuten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die konkrete Tierbildsprache und der wiederkehrende Titel „Herr der Schafe“ bleiben erhalten. Pronomen werden nur dort durch „jener Widder“ verdeutlicht, wo der äthiopische Schlusssatz den Bezug ausdrücklich nennt; die Unsicherheit der letzten Wortgruppe wird in der Fußnote offengelegt.
