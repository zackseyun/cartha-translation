revisions:
- from: Und ich sah, bis jener Mann kam, der die Namen der Hirten aufgeschrieben hatte, und sie vor den Herrn der Schafe hinaufbrachte. Er half ihm und rettete ihn, und er zeigte jenem Widder den ganzen Abstieg seines Helfers.[a][b]
  to: Und ich sah, bis jener Mann kam, der die Namen der Hirten aufgeschrieben hatte,[b] und sie vor den Herrn der Schafe hinaufbrachte. Er half ihm und rettete ihn, und er zeigte jenem Widder das ganze Herabkommen seines Helfers.[a]
  rationale: Die Revision ersetzt lediglich das im Deutschen potenziell fehlleitende „Abstieg“ durch das quellennahe und idiomatischere „Herabkommen“ und versetzt die Fußnotenanker an die jeweils erläuterten Textstellen. Die umstrittene Schlussaussage bleibt bewusst offen; insbesondere wird weder ein bestimmtes theologisches Verständnis des Helfers noch ein eindeutiger Sinn von dessen Herabkommen vorweggenommen.
