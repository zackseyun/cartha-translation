base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/020.yaml
  text: And I saw until a throne was set up in the pleasant land[a], and the Lord of the sheep sat upon it[b]; and he took all the sealed books and opened those books before the Lord of the sheep.
translation:
  language: de
  text: Und ich sah weiter, bis im lieblichen Land[a] ein Thron errichtet wurde; und der Herr der Schafe saß darauf[b]. Er nahm alle versiegelten Bücher und öffnete diese Bücher vor dem Herrn der Schafe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit »liebliches Land« wiedergegebene äthiopische Wort ist in diesem Textzeugen unsicher; möglicherweise bezeichnet es ein besonders begünstigtes Land und nicht die Erde im Allgemeinen.
    reason: lexical_alternative
  - marker: b
    text: Der Vers nennt den »Herrn der Schafe« sowohl als den, der auf dem Thron sitzt, als auch als den, vor dem die Bücher geöffnet werden. Diese Wiederholung wird beibehalten und nicht geglättet.
    reason: textual_variant
lexical_decisions:
- source_word: መንበር
  choice: Thron
  rationale: Im Zusammenhang dieser apokalyptischen Gerichtsszene bezeichnet das Wort einen königlichen und richterlichen Sitz; »Thron« bewahrt dieses Bild besser als das allgemeinere »Sitz«.
- source_word: ተሐንጸ
  choice: errichtet wurde
  rationale: Die Passivform beschreibt, dass der Thron aufgebaut oder bereitgestellt wird. »Errichtet wurde« ist quellennah und legt die Art des Aufbaus nicht unnötig fest.
- source_word: ሐዋዝ
  choice: im lieblichen Land
  rationale: Das äthiopische Wort ist an dieser Stelle unsicher. Im Rahmen der Landbildsprache der Tierapokalypse dürfte es eher ein besonderes, bevorzugtes Land als die Erde im Allgemeinen bezeichnen; »liebliches Land« erhält sowohl den territorialen Bezug als auch die Unsicherheit.
- source_word: እግዚአ አባግዕ
  choice: der Herr der Schafe
  rationale: Der wiederkehrende Titel wird einheitlich wiedergegeben. »Herr« bewahrt Autorität und feierlichen apokalyptischen Ton.
- source_word: መጻሕፍተ ኅትማተ
  choice: die versiegelten Bücher
  rationale: Die Wendung bezeichnet durch Siegel verschlossene oder gekennzeichnete Bücher, vermutlich himmlische Aufzeichnungen. »Versiegelte Bücher« gibt die Formulierung unmittelbar wieder.
- source_word: ፈትሖን
  choice: öffnete
  rationale: Das Verb bedeutet gewöhnlich »öffnen«. Die vorherige Bezeichnung der Bücher als versiegelt trägt bereits die Vorstellung des Entsiegelns, sodass keine zusätzliche Deutung nötig ist.
theological_decisions:
- issue: Identität der thronenden Gestalt und dessen, vor dem die Bücher geöffnet werden
  choice: 'Die überlieferte Wiederholung bleibt erhalten: Der Herr der Schafe sitzt auf dem Thron, und die Bücher werden vor dem Herrn der Schafe geöffnet.'
  alternative: Eine der beiden Nennungen ändern, sodass eine andere himmlische Gestalt auf dem Thron sitzt oder die Bücher vor einem anderen Beteiligten geöffnet werden.
  rationale: Der überlieferte Text wirkt durch die Wiederholung möglicherweise ungewohnt, ist aber verständlich genug und darf nicht stillschweigend harmonisiert oder emendiert werden. Die Szene kann den Herrn der Schafe bewusst zugleich als thronenden Richter und als Empfänger der Aufzeichnungen hervorheben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer apokalyptischer Bildsprache. »Und ich sah weiter, bis …« gibt die fortlaufende Vision natürlich wieder; die auffällige Wiederholung von »Herr der Schafe« bleibt aus textlichen und theologischen Gründen sichtbar.
