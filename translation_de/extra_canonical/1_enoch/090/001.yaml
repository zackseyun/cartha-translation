  naturalness: Modernes, würdiges Deutsch ist insgesamt erreicht. „Dann nahmen andere sie in ihre Hände“ ist jedoch idiologisch unnatürlich und semantisch schärfer als nötig. „Anderen wurden sie in die Hände gegeben“ bewahrt das Bild und liest sich im Deutschen klar.
  terminology: „Hirten“, „hüten“, „Zeitspannen“ und „zu seiner Zeit“ wahren die allegorische Bildsprache, ohne die Hirten als Engel, Herrscher oder andere Akteure zu identifizieren. Die Fußnoten sind inhaltlich passend und ihre Anker stehen an den relevanten Stellen.
