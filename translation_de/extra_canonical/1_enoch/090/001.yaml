revisions:
- from: Und ich sah bis zu der Zeit, als siebenunddreißig Hirten die Herde auf diese Weise hüteten[c]. Sie alle vollendeten ihre jeweiligen Zeitspannen wie die früheren; dann nahmen andere sie in ihre Hände[a], um sie während ihrer jeweiligen Zeiten zu hüten[b] – jeder Hirte zu seiner Zeit.
  to: Und ich sah bis zu der Zeit, als siebenunddreißig Hirten die Herde auf diese Weise hüteten[c]. Sie alle vollendeten ihre jeweiligen Zeitspannen wie die früheren; dann wurden sie anderen in die Hände gegeben[a], damit diese sie während ihrer jeweiligen Zeiten hüteten[b] – jeder Hirte zu seiner Zeit.
  rationale: Die einzige notwendige Änderung betrifft die Übergabeklausel. Die passive Formulierung „wurden sie anderen in die Hände gegeben“ ist idiomatisches modernes Deutsch, erhält die auffällige Hand-Metapher und vermeidet eine nicht erforderliche Festlegung auf ein aktives „Nehmen“ durch die nachfolgenden Hirten. Der Zweck der Übergabe wird mit „damit diese“ klar an die neuen Hirten gebunden.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:26:06Z'
