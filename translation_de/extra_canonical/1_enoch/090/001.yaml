base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/001.yaml
  text: And I saw until the time when thirty-seven shepherds were pasturing in this way[a], and they all completed their periods, each in its time, like the former ones; and others received them into their hands, to pasture them in their times[c][b], each shepherd in its time.
translation:
  language: de
  text: Und ich sah bis zu der Zeit, als siebenunddreißig Hirten die Herde auf diese Weise hüteten[c]. Sie alle vollendeten ihre jeweiligen Zeitspannen wie die früheren; dann wurden sie anderen in die Hände gegeben[a], damit diese sie während ihrer jeweiligen Zeiten hüteten[b] – jeder Hirte zu seiner Zeit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Übergabeformulierung im Ge'ez ist stark verdichtet. Gemeint ist offenbar, dass nach dem Ende der Zeit einer Gruppe andere nacheinander die Herde in ihre Obhut nehmen.
    reason: textual_variant
  - marker: b
    text: Die wiederholte Rede von der „Zeit“ hebt begrenzte, jeweils zugeteilte Abschnitte des Hütens hervor, nicht eine unbestimmte Dauer.
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: „bis zu jener Zeit, in der siebenunddreißig Hirten hüteten“. Die Wendung „auf diese Weise“ weist auf die zuvor beschriebene Art ihres Hütens zurück.'
    reason: previous_rendering
lexical_decisions:
- source_word: ወርኢኩ
  choice: Und ich sah
  rationale: Bewahrt die übliche Berichtsformel der Vision und setzt die fortlaufende Schau voraus.
- source_word: እስከ ዘመን ዘከመዝ
  choice: bis zu der Zeit, als … auf diese Weise
  rationale: Gibt sowohl den zeitlichen Verlauf als auch die demonstrative Bedeutung von ከመዝ („auf diese Weise/so“) wieder, ohne die syntaktische Verdichtung des Ge'ez einzuebnen.
- source_word: ይርዕዩ
  choice: die Herde … hüteten
  rationale: „Hüten“ erhält das konkrete Hirtenbild. „Die Herde“ wird im Deutschen als sinngemäßes Objekt ergänzt, damit nicht der missverständliche Eindruck entsteht, die Hirten selbst hätten geweidet.
- source_word: ፴ወ፯ ኖላዊያን
  choice: siebenunddreißig Hirten
  rationale: Die ausgeschriebene Zahl entspricht dem würdigen Erzählstil; „Hirten“ wahrt das Bild der Tierapokalypse, ohne es auszudeuten.
- source_word: ፈጸሙ ኵሎሙ በበጊዜሆሙ
  choice: Sie alle vollendeten ihre jeweiligen Zeitspannen
  rationale: Macht die im Ge'ez vorausgesetzten begrenzten Amts- oder Wirkungszeiten verständlich und bewahrt zugleich den distributiven Sinn von በበ.
- source_word: ከመ ቀዳማዊያን
  choice: wie die früheren
  rationale: Verweist natürlich und knapp auf die zuvor genannten Hirten zurück.
- source_word: በዐዳን ተመጠውዎሙ ውስተ እደዊሆሙ
  choice: dann nahmen andere sie in ihre Hände
  rationale: Erhält das auffällige Übergabebild „in ihre Hände“. Die im Ge'ez verdichtete Beziehung von Subjekt und Objekt wird nicht durch eine weitergehende Deutung aufgelöst.
- source_word: ከመ ይርዐይዎሙ በበጊዜሆሙ
  choice: um sie während ihrer jeweiligen Zeiten zu hüten
  rationale: Gibt den Zwecksatz wieder, hält das Hirtenmotiv durch und bewahrt die Abfolge jeweils zugeteilter Zeiten.
- source_word: ኵሉ ኖላዊ በጊዜሁ
  choice: jeder Hirte zu seiner Zeit
  rationale: Die knappe Schlussformulierung betont die aufeinanderfolgende, individuelle Zuteilung.
theological_decisions:
- issue: Identität der „Hirten“
  choice: Das Bild wird ohne Ausdeutung als „Hirten“ wiedergegeben.
  alternative: Engel, Herrscher oder Aufseher
  rationale: Der Vers selbst spricht in der Bildsprache der Tierapokalypse. Eine explizite Identifikation würde eine theologische Deutung in den Haupttext eintragen, die der Wortlaut nicht vornimmt.
- issue: Charakter der Zeitspannen
  choice: Begrenzte, jeweils zugeteilte Zeitspannen werden sprachlich erkennbar gemacht, ohne ihren göttlichen oder gerichtlichen Status ausdrücklich zu definieren.
  alternative: „von Gott festgesetzte Amtszeiten“
  rationale: Die Wiederholung von „Zeit“ legt feste Abschnitte nahe; wer sie festsetzt und wie sie theologisch zu bestimmen sind, wird in diesem Vers jedoch nicht ausdrücklich gesagt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener apokalyptischer Bildsprache. Die etwas ungewöhnliche Wendung „in ihre Hände“ bleibt bewusst stehen, weil sie die Übergabe der Verantwortung sichtbar macht. Wiederholungen von „Zeit“ werden nicht geglättet, da sie für die Struktur des Verses bedeutsam sind.
