base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/035.yaml
  text: And the eyes of them all were opened[a], and they saw well[b], and there was not one among them that did not see.
translation:
  language: de
  text: Und ihnen allen wurden die Augen geöffnet, und sie sahen gut[a]; unter ihnen war niemand, der nicht sah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und sie sahen Gutes«. Das altäthiopische Wort kann hier adverbial (»gut«) oder substantivisch verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አዕይን
  choice: Augen
  rationale: Das konkrete Bild der Augen entspricht der Bildwelt der Tiervision besser als ein abstrakter Ausdruck wie »Sehvermögen«.
- source_word: ተከሥታ
  choice: wurden geöffnet
  rationale: Die passive Form bewahrt das Motiv, dass ihnen die Fähigkeit zu sehen wiedergegeben wird, ohne den Handelnden ausdrücklich zu benennen.
- source_word: ሠናየ
  choice: gut
  rationale: Der Akkusativ kann im Altäthiopischen adverbial gebraucht werden. Im Zusammenhang mit der zuvor geschilderten Blindheit bezeichnet »gut« am ehesten das wiederhergestellte Sehen; die substantivische Deutung bleibt in der Fußnote erhalten.
- source_word: ዘኢይሬኢ አልቦ
  choice: war niemand, der nicht sah
  rationale: Diese Formulierung gibt die nachdrückliche negative Konstruktion eng und zugleich verständlich wieder, ohne sie mit »blind« auszudeuten.
- source_word: በማእከሎሙ
  choice: unter ihnen
  rationale: Dies ist im Deutschen die natürliche Wiedergabe des räumlich-distributiven Ausdrucks in diesem Satz.
theological_decisions:
- issue: Art des wiederhergestellten Sehens in der Vision
  choice: Das Öffnen der Augen und das Sehen bleiben als Vorgänge innerhalb der symbolischen Vision stehen.
  alternative: Allen wurde geistliche Erkenntnis geschenkt beziehungsweise ihre geistliche Blindheit wurde beseitigt.
  rationale: Der Text schildert die Wiederherstellung der Wahrnehmung in der Bildwelt der Tiervision. Eine ausdrückliche Allegorisierung würde die theologische Bedeutung stärker festlegen, als es der Wortlaut verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »sahen/sah« wurde beibehalten, weil sie die emphatische Aussage des Ausgangstextes trägt; die Symbolik wird nicht erklärend aufgelöst.
