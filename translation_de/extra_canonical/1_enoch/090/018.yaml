base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/018.yaml
  text: And I saw until the Lord of the sheep came to them, and he took in his hand the staff of wrath and struck the earth; and the earth split open, and all the beasts and all the birds of heaven fell away from among those sheep and sank into the earth, and it covered over them.
translation:
  language: de
  text: Und ich sah, bis der Herr der Schafe zu ihnen kam. Er nahm den Stab des Zorns in seine Hand und schlug mit ihm auf die Erde; da spaltete sich die Erde[a]. Alle wilden Tiere[b] und alle Vögel des Himmels fielen aus der Mitte jener Schafe hinab, versanken in der Erde, und sie bedeckte sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „da wurde die Erde aufgespalten“. Die ge’ezische Wendung ist schwierig; der folgende Ablauf legt nahe, dass sich der Boden öffnet und die Tiere und Vögel darin versinken.'
    reason: lexical_alternative
  - marker: b
    text: Die „wilden Tiere“ und die „Vögel des Himmels“ gehören zur Bildsprache der Tierapokalypse und stellen feindliche Mächte dar, nicht lediglich gewöhnliche Tiere.
    reason: cultural_note
lexical_decisions:
- source_word: እግዚአ አባግዕ
  choice: der Herr der Schafe
  rationale: Bewahrt sowohl die Herrschaftsbezeichnung als auch die Bildwelt der Tierapokalypse; „Herr“ trägt hier mehr Gewicht als „Besitzer“, ohne eine spätere christologische Identifikation einzutragen.
- source_word: በትር መዓተ
  choice: den Stab des Zorns
  rationale: „Stab“ hält die Hirtenbildwelt lebendig, während „Zorn“ die gerichtliche Schärfe ausdrückt. Das Ge’ez enthält kein Possessivsuffix, daher nicht „seines Zorns“.
- source_word: ዘበጣ ለምድር
  choice: schlug auf die Erde
  rationale: Gibt den kräftigen, gezielten Schlag in natürlichem modernem Deutsch wieder.
- source_word: ተሰጠተ ምድር
  choice: da spaltete sich die Erde
  rationale: 'Der schwierige Ausdruck wird vom folgenden Versablauf her verstanden: Die Wesen versinken, und die Erde bedeckt sie. Die Fußnote wahrt die mögliche passive Auffassung.'
- source_word: ወድቁ እምዝኩ አባግዕ
  choice: fielen aus der Mitte jener Schafe hinab
  rationale: Verbindet die Abwärtsbewegung mit der im Ausdruck liegenden Trennung von den Schafen.
- source_word: ተሰጥሙ በምድር
  choice: versanken in der Erde
  rationale: Bewahrt den Ablauf des Bildes, ohne ausdrücklich festzulegen, ob die Erde sie aktiv verschlang oder sie in eine Öffnung stürzten.
- source_word: ከደነት ዲቤሆሙ
  choice: sie bedeckte sie
  rationale: Das feminine Singularsubjekt verweist natürlich auf die Erde; die knappe Form erhält das Bild des Begraben- oder Verschlungenwerdens.
theological_decisions:
- issue: Göttlicher Titel innerhalb der Tierallegorie
  choice: der Herr der Schafe
  alternative: der Gebieter der Schafe
  rationale: Die Formulierung bewahrt Gottes souveräne Stellung über die Herde und zugleich das allegorische Register, ohne eine weitergehende Identifikation vorzunehmen.
- issue: Werkzeug des Gerichts
  choice: Stab des Zorns
  alternative: Rute des Zorns
  rationale: „Stab“ passt zur Hirtenmetaphorik und „Zorn“ bezeichnet hier gerichtliches Handeln, nicht bloß eine Gemütsregung. Auf ein nicht im Ge’ez vorhandenes „seines“ wird verzichtet.
- issue: Deutung der Tiere und Vögel
  choice: Bildsprache im Haupttext unverändert bewahren
  alternative: die feindlichen Mächte ausdrücklich benennen
  rationale: Der Haupttext soll die apokalyptische Mehrdeutigkeit nicht durch eine interpretierende Ersetzung auflösen; die symbolische Funktion wird nur in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange ge’ezische Satzkette wurde behutsam gegliedert, ohne die Abfolge der Vision zu verändern. „Jene Schafe“ erhält den rückverweisenden Charakter; „wilde Tiere“ unterscheidet die feindlichen Tiere idiomatisch von der Herde.
