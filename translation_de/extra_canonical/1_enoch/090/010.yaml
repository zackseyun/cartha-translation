base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/010.yaml
  text: And it looked at them[a], [and their eyes were opened,] and it cried out to the sheep and said to them[c][b], “Look!” and they all ran to it.
translation:
  language: de
  text: 'Und es blickte sie an[a], [und ihre Augen wurden geöffnet][b], und es rief den Schafen zu und sagte zu ihnen: »Seht es!«[c] Da liefen sie alle auf es zu.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Und es sah sie«; die Form ist in der 3. Person Singular zu verstehen, nicht als »Und ich sah«.'
    reason: lexical_alternative
  - marker: b
    text: Die Worte »und ihre Augen wurden geöffnet« stehen in eckigen Klammern, weil sie im vorgelegten äthiopischen Text als textlich unsicher gekennzeichnet sind.
    reason: textual_variant
  - marker: c
    text: Bei personalem Verständnis der Gestalt kann der Aufruf auch als »Seht ihn!« wiedergegeben werden.
    reason: lexical_alternative
  - marker: d
    text: 'Oder: »Da liefen sie alle zu ihm.« Das neutrale »auf es zu« lässt offen, ob die einzelne Gestalt lediglich als Tierfigur oder als personalisierter Anführer verstanden werden soll.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: ወርእየ፡ ቦሙ
  choice: Und es blickte sie an
  rationale: Die Verbform wird als 3. Person Singular verstanden, nicht als visionäre Ich-Form. Das deutsche »es« bewahrt die tierbildliche Ebene; »blickte sie an« gibt die auf die Gruppe gerichtete Wahrnehmung natürlich wieder, ohne im Deutschen ein Geschlecht festzulegen.
- source_word: ወተፈትሐ፡ አዕይንቲሆሙ
  choice: '[und ihre Augen wurden geöffnet]'
  rationale: Die passive Aussage wird eng am Wortlaut wiedergegeben. Die eckigen Klammern bleiben erhalten, weil schon der vorgelegte äthiopische Text die Klausel als textlich unsicher kennzeichnet.
- source_word: ወጸርኀ፡ ሎሙ፡ ለአባግዕ
  choice: und es rief den Schafen zu
  rationale: »zurufen« vermittelt die kräftige, an die Schafe gerichtete Äußerung und erhält ausdrücklich das Tierbild »Schafe«.
- source_word: ወይቤላት፡ ርእይዎ
  choice: 'und sagte zu ihnen: »Seht!«'
  rationale: Die überlieferte Segmentierung wird als Redeformel mit anschließendem pluralischem Wahrnehmungsimperativ verstanden. Das knappe »Seht!« bewahrt den abrupten Aufruf; ein im Äthiopischen möglicher Objektbezug wird in der Fußnote offengehalten.
- source_word: ወሮጹ፡ ኵሎሙ፡ ኀቤሁ
  choice: Da liefen sie alle darauf zu
  rationale: »liefen« gibt die Bewegungsart direkt wieder. »darauf zu« bewahrt die Richtung auf die einzelne Gestalt hin, ohne sie durch ein deutsches Personalpronomen vorschnell als menschlich oder männlich zu bestimmen.
theological_decisions:
- issue: Personalisierung der einzelnen Gestalt innerhalb der Tierschau
  choice: Neutrales »es« beziehungsweise »darauf zu« im Haupttext
  alternative: »er« beziehungsweise »zu ihm«
  rationale: Die Übersetzung hält sich an die symbolische Oberfläche der Tierschau und legt nicht vorzeitig fest, ob die einzelne Gestalt als personalisierter menschlicher Anführer zu deuten ist.
- issue: Bedeutung des geöffneten Augenlichts
  choice: Wörtliche Wiedergabe ohne auslegenden Zusatz
  alternative: Deutende Begriffe wie »sie erkannten« oder »sie wurden erleuchtet«
  rationale: Das Bild kann Wahrnehmung, Einsicht oder Erwachen andeuten; der Text selbst löst diese theologische Spannung hier jedoch nicht auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, visionärer Erzählbewegung. Die Tiermetaphorik bleibt sichtbar; eckige Klammern und Fußnoten bewahren Textunsicherheit, grammatische Alternativen und die offene Identität der einzelnen Gestalt.
