base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/003.yaml
  text: And the sheep cried out because their flesh was being devoured by the birds[b][a], and I looked and lamented in my sleep over that shepherd who was shepherding the sheep.
translation:
  language: de
  text: Und die Schafe schrien auf, weil die Vögel[b] ihr Fleisch fraßen. Und ich sah zu und klagte im Schlaf[a] über jenen Hirten, der die Schafe hütete.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »und ich schaute zu und wehklagte in meinem Traum«. Das Reaktionsverb des Sehers kann auch einen hörbaren Klageruf bezeichnen; »Schlaf« benennt im Zusammenhang zugleich den Zustand der Traumvision.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier »Vögel«, nicht ausdrücklich »Raubvögel«; dass sie Beute reißen, ergibt sich aus dem Fressen des Fleisches.
    reason: lexical_alternative
lexical_decisions:
- source_word: አባግዕ
  choice: die Schafe
  rationale: Die ausdrückliche Tiermetaphorik der Tiervision bleibt erhalten und wird nicht als »Volk« oder nur als »Herde« aufgelöst.
- source_word: ጸርኁ
  choice: schrien auf
  rationale: Gibt den hörbaren Schmerzensruf natürlich und eindringlich wieder, ohne einen förmlichen Klageakt vorauszusetzen.
- source_word: ይትበልዑ ሥጋሆሙ
  choice: ihr Fleisch fraßen
  rationale: Bewahrt das konkrete »Fleisch« und den fortdauernden Vorgang; im Deutschen ist die aktive Konstruktion mit den Vögeln als Agens natürlicher als ein schwerfälliges Passiv.
- source_word: እምነ አዕዋፍ
  choice: die Vögel
  rationale: Die Präposition bezeichnet im Zusammenhang die Urheber des Fressens. »Raubvögel« wäre kontextuell naheliegend, aber spezifischer als der überlieferte Wortlaut.
- source_word: ነጸርኩ
  choice: ich sah es
  rationale: Das Verb bezeichnet das visionäre Sehen oder Beobachten; das Objektpronomen macht den deutschen Satz idiomatisch, ohne zusätzliche Deutung einzuführen.
- source_word: አውየውኩ
  choice: klagte
  rationale: Unterscheidet die Reaktion des Sehers vom vorangehenden Aufschreien der Schafe und wahrt den feierlichen Ton.
- source_word: በንዋምየ
  choice: im Schlaf
  rationale: Folgt der konkreten Bedeutung »in meinem Schlaf«; »im Traum« bleibt als kontextuell mögliche Wiedergabe in der Fußnote erhalten.
- source_word: ኖላዊ ዘይርዕዮሙ
  choice: Hirten, der die Schafe hütete
  rationale: Bewahrt das Hirtenbild und gibt die Tätigkeit in natürlichem modernem Deutsch wieder.
theological_decisions:
- issue: Deutung der Tiere als historische Personen oder Gruppen
  choice: Die visionären Bilder von Schafen, Vögeln und Hirten bleiben im Haupttext wörtlich erhalten.
  alternative: Die Symbole unmittelbar als Menschen, Feinde und Herrscher wiedergeben.
  rationale: Der Text selbst erzählt in apokalyptischer Tierbildsprache. Eine historische Identifizierung wäre Auslegung und würde die Mehrdeutigkeit der Vision im Haupttext auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer apokalyptischer Bildsprache. Die Satzfolge bleibt nah am äthiopischen Text, wird aber durch zwei Hauptsätze natürlich gegliedert. Sämtliche Fußnotenmarker stehen unmittelbar bei den betroffenen Ausdrücken.
