base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/009.yaml
  text: And I saw until horns came out for those lambs[a], and the ravens cast down their horns. And I saw until one great horn sprouted on one of those sheep[c][b], and their eyes were opened.
translation:
  language: de
  text: Und ich sah, wie jenen Lämmern Hörner hervorwuchsen[a] und die Raben die Hörner jener Lämmer zu Fall brachten. Und ich sah, wie einem jener Schafe ein einziges großes Horn spross; da wurden ihnen die Augen geöffnet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier „Hörner“. In der Vision sind sie offenbar Sinnbilder für Stärke oder Herrschaft.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Ihre Augen wurden geöffnet.“ Das kann innerhalb der Vision auf wiedergewonnene Wahrnehmung oder Einsicht hindeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አቅርንት
  choice: Hörner
  rationale: Bewahrt das wiederkehrende apokalyptische Sinnbild für Macht und Herrschaft; der äthiopische Ausdruck bezeichnet ausdrücklich Hörner.
- source_word: መኃስእ
  choice: Lämmer
  rationale: Die jüngere lexikalische und kontextuelle Prüfung stützt „Lämmer“ beziehungsweise Jungtiere; dies entspricht außerdem dem zoomorphen Zusammenhang der Schafe in der Tierapokalypse.
- source_word: ቋንት
  choice: Raben
  rationale: „Raben“ gibt die feindlichen Rabenvögel der Vision traditionsgemäß und anschaulich wieder.
- source_word: ያወድቅዎሙ
  choice: niederwarfen
  rationale: Das Kausativ drückt aus, dass die Raben die Hörner zu Fall brachten; „niederwarfen“ erhält die kraftvolle Bildsprache, ohne den Vorgang weiter festzulegen.
- source_word: በቈለ
  choice: spross
  rationale: Das Verb bezeichnet organisches Hervorsprossen oder Wachstum und bewahrt so das ungewöhnliche Bild eines wachsenden Horns.
- source_word: ፩ቀርን ዓቢይ
  choice: ein einziges großes Horn
  rationale: Gibt sowohl die ausdrücklich gesetzte Zahl eins als auch die Größe und symbolische Bedeutung des Horns wieder.
- source_word: አባግዕ
  choice: Schafe
  rationale: Direkte und kontextgerechte Wiedergabe der Tierbezeichnung innerhalb der Tierapokalypse.
- source_word: ተከሥተ አዕይንቲሆሙ
  choice: ihnen die Augen geöffnet wurden
  rationale: Bewahrt die passive Aussage und ihre mögliche Bedeutung wiederhergestellter Wahrnehmung, ohne sie auszudeuten.
theological_decisions:
- issue: Symbolische Bedeutung der Hörner
  choice: Das Bild „Hörner“ bleibt im Haupttext unaufgelöst.
  alternative: Die Hörner ausdrücklich als Macht, Herrschaft oder militärische Stärke deuten.
  rationale: Der Vers bietet das visionäre Bild, nicht dessen ausdrückliche Erklärung; die Übersetzung soll die apokalyptische Mehrdeutigkeit bewahren.
- issue: Historische Identität des großen Horns
  choice: Die Gestalt wird nicht historisch identifiziert.
  alternative: Das große Horn ausdrücklich mit Judas Makkabäus oder einem anderen Anführer gleichsetzen.
  rationale: Eine historische Identifizierung geht über den Wortlaut hinaus und gehört gegebenenfalls in einen Kommentar, nicht in den übersetzten Haupttext.
- issue: Referent des abschließenden Pronomens
  choice: „ihnen“ bewahrt den pluralischen Rückbezug des Ausgangstextes.
  alternative: Den Bezug ausdrücklich auf die Schafe oder Lämmer festlegen.
  rationale: Der äthiopische Text lässt den genauen Bezug im unmittelbaren Zusammenhang offen; eine explizite Festlegung würde die vorhandene Mehrdeutigkeit beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte visionäre Formel „Und ich sah, wie …“ bleibt erhalten. „Spross“ wahrt die organische Bildsprache, ohne altertümlich zu wirken; historische und theologische Identifizierungen werden nicht in den Haupttext eingetragen.
