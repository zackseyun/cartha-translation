revisions:
- from: Und ich sah, wie jenen Lämmern Hörner wuchsen[a] und die Raben ihre Hörner niederwarfen. Und ich sah, wie einem jener Schafe ein einziges großes Horn spross; da wurden ihnen die Augen geöffnet.[b]
  to: Und ich sah, wie jenen Lämmern Hörner hervorwuchsen[a] und die Raben die Hörner jener Lämmer zu Fall brachten. Und ich sah, wie einem jener Schafe ein einziges großes Horn spross; da wurden ihnen die Augen geöffnet.[b]
