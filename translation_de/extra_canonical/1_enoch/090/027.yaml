base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/027.yaml
  text: And I saw those sheep while they were burning[a], and their bones were burning.
translation:
  language: de
  text: Und ich sah jene Schafe, während sie brannten[a], und ihre Knochen brannten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im äthiopischen Text wird „brannten“ sowohl von den Schafen als auch von ihren Knochen gesagt. Die Wiederholung verstärkt die Härte der Vision und bleibt daher erhalten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢክዎሙ
  choice: ich sah
  rationale: Das Verb bezeichnet hier im Visionsbericht schlicht das Sehen; die erste Person und der Objektsbezug werden in natürlichem Deutsch wiedergegeben.
- source_word: እልኩ አባግዕ
  choice: jene Schafe
  rationale: „Schafe“ bewahrt die leitende Tiermetaphorik der Tierapokalypse; „jene“ gibt den demonstrativen Bezug wieder.
- source_word: እንዘ ይውዕዩ
  choice: während sie brannten
  rationale: Die Konstruktion bezeichnet eine gleichzeitig ablaufende, beobachtete Handlung. Die Formulierung wahrt den fortdauernden Aspekt, ohne zwischen „brannten“ und „verbrannt wurden“ unnötig festzulegen.
- source_word: አዕፅምቲሆሙ
  choice: ihre Knochen
  rationale: Die konkrete anatomische Bezeichnung wird direkt und in natürlichem Deutsch wiedergegeben.
- source_word: ይውዕዩ
  choice: brannten
  rationale: Die Wiederholung desselben Verbs wird bewahrt, weil sie die Härte des Visionsbildes steigert.
theological_decisions:
- issue: Ob das Gerichtsbild des Brennens zu allgemeiner Vernichtungssprache abgeschwächt werden soll
  choice: Das ausdrückliche Bild des Brennens bleibt erhalten.
  alternative: „wurden vernichtet“ oder „wurden verzehrt“
  rationale: Der äthiopische Text wiederholt das Brennen und bezieht es sogar auf die Knochen. Eine allgemeinere Vernichtungsformulierung würde das apokalyptische Bild verflachen.
- issue: Ob die Verbform aktiv oder passiv zu deuten ist
  choice: „brannten“ bleibt hinsichtlich der Verursachung offen.
  alternative: „wurden verbrannt“
  rationale: Die Formulierung soll die im Ausgangstext nicht abschließend geklärte Perspektive nicht durch eine ausdrückliche Passivkonstruktion festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper apokalyptischer Bildsprache. Die auffällige Wiederholung wird bewusst nicht geglättet.
