revisions:
- from: Und ich sah alle Schafe, die übrig geblieben waren. Und alle Tiere auf der Erde und alle Vögel des Himmels fielen vor jenen Schafen nieder, verneigten sich vor ihnen, flehten sie an und hörten in allem, was sie sagten, auf sie.[a]
  to: Und ich sah alle Schafe, die übrig geblieben waren. Und jedes Tier auf der Erde und alle Vögel des Himmels fielen vor jenen Schafen nieder, verneigten sich vor ihnen, flehten sie an und gehorchten ihnen in allem, was sie sagten.[a]
  rationale: Die Revision übernimmt die quellspracheigene distributive Singularform bei „jedes Tier“ und ersetzt die schwerfällige Umschreibung des letzten Verbs durch die im Kontext naheliegende, idiomatische Bedeutung „gehorchten“. Die Fußnote bewahrt die wörtliche Bedeutung „hören“ und damit die lexikalische Ambiguität. Die getrennten Satzglieder erhalten die wichtige syntaktische Unterscheidung zwischen den gesehenen Schafen und den sich unterwerfenden Tieren und Vögeln.
