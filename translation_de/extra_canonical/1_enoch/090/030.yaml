base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/030.yaml
  text: And I saw all the sheep that were left[a], and every beast that was upon the earth, and all the birds of heaven, falling down and bowing to those sheep, and making petition to them[b], and obeying them in every word.
translation:
  language: de
  text: Und ich sah alle Schafe, die übrig geblieben waren. Und jedes Tier auf der Erde und alle Vögel des Himmels fielen vor jenen Schafen nieder, verneigten sich vor ihnen, flehten sie an und gehorchten ihnen in allem, was sie sagten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht beim letzten Verb „sie hörten sie“ beziehungsweise „sie hörten auf sie“. Im Zusammenhang mit Niederfallen, Verneigung und Flehen bedeutet es, dass sie ihnen in allem, was die Schafe sagten, gehorchten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢክዎሙ
  choice: Und ich sah
  rationale: Die Form führt den visionären Bericht in der ersten Person fort; die Objektendung bezieht sich auf die anschließend genannten Schafe.
- source_word: ኵሎሙ አባግዕ እለ ተርፉ
  choice: alle Schafe, die übrig geblieben waren
  rationale: Bewahrt den Gedanken eines nach dem Gericht verbliebenen Rests, ohne die Art ihres Überlebens näher festzulegen.
- source_word: ኵሉ እንስሳ ዘዲበ ምድር
  choice: alle Tiere auf der Erde
  rationale: Natürliches modernes Deutsch; im Zusammenhang bleibt die symbolische Tierwelt der Vision klar erkennbar.
- source_word: ኵሉ አዕዋፈ ሰማይ
  choice: alle Vögel des Himmels
  rationale: Bewahrt die biblisch-apokalyptische Ausdrucksweise der Genitivverbindung.
- source_word: ይወድቁ ወይሰግዱ
  choice: fielen ... nieder, verneigten sich
  rationale: Gibt die beiden Gesten körperlicher Unterwerfung wieder, ohne sie ausdrücklich als religiöse Anbetung zu deuten.
- source_word: ለእልኩ አባግዕ
  choice: vor jenen Schafen ... vor ihnen
  rationale: Der Rückverweis auf die übrig gebliebenen Schafe bleibt deutlich; die Präpositionen werden idiomatisch den deutschen Verben angepasst.
- source_word: ያስተበቍዕዎሙ
  choice: flehten sie an
  rationale: Drückt die eindringliche Bitte und die unterwürfige Haltung prägnant und natürlich aus.
- source_word: ይሰምዕዎሙ በኵሉ ቃል
  choice: hörten in allem, was sie sagten, auf sie
  rationale: Verbindet die wörtliche Bedeutung „hören“ mit dem kontextuellen Sinn „Folge leisten“ und gibt በኵሉ ቃል idiomatisch wieder.
theological_decisions:
- issue: Ob das Niederfallen der Tiere und Vögel vor den Schafen als Anbetung zu bezeichnen ist
  choice: Als umfassende Unterwerfung durch Niederfallen, Verneigung, Flehen und Gehorchen wiedergegeben
  alternative: „beteten jene Schafe an“
  rationale: Die Gesten können kultisch klingen, doch der Text bezeichnet die Handlung nicht eindeutig als Gottesverehrung. Die Übersetzung bewahrt diese Spannung und vermeidet eine dogmatische Festlegung.
- issue: Syntaktische Zuordnung von Schafen, Tieren und Vögeln
  choice: Die Schafe sind das Objekt von „ich sah“; Tiere und Vögel sind die Subjekte der folgenden Handlungen
  alternative: Alle drei Gruppen als gemeinsame Objekte von „ich sah“ auffassen
  rationale: Die Objektmarkierung und das Objektsuffix bei den Schafen gegenüber den unmarkierten Nominalgruppen für Tiere und Vögel stützen die gewählte Satzgliederung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht biblischem Klang. Die Satzteilung macht die geezische Syntax sichtbar und verhindert, dass Schafe, Tiere und Vögel irrtümlich als gleichgeordnete Objekte von „ich sah“ gelesen werden.
