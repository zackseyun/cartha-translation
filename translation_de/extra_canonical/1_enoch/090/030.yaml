  terminology: „Schafe“, „Vögel des Himmels“, „niederfallen“, „sich verneigen“ und „anflehen“ wahren den apokalyptisch-biblischen Registerton, ohne „Anbetung“ als dogmatisch stärkere Deutung einzutragen. Die Fußnote sichert die wörtliche Hör-Bedeutung des letzten Verbs.
