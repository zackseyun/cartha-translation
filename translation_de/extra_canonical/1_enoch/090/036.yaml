base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/036.yaml
  text: And I saw that that house became great and broad and exceedingly full[a][b][c].
translation:
  language: de
  text: Und ich sah, dass jenes Haus groß und weit und überaus voll wurde.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: In der Tierapokalypse kann »Haus« symbolisch das Heiligtum oder den Tempel bezeichnen; der äthiopische Text selbst sagt hier jedoch nur »Haus«.
    reason: cross_reference
  - marker: b
    text: »Überaus« gibt ፈድፋደ als verstärkendes Adverb zu »voll« wieder. Ältere Auffassungen verstanden die Wendung auch im Sinn von »voll von Überfluss«; nach der Satzstruktur ist jedoch »überaus voll« wahrscheinlicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: Und ich sah
  rationale: Bewahrt die wiederkehrende Formel des visionären Berichts in natürlichem, würdigem Deutsch.
- source_word: ከመ፡ ኮነ
  choice: dass … wurde
  rationale: Gibt den Zustandswechsel wieder, statt lediglich einen statischen Zustand auszudrücken.
- source_word: ውእቱ፡ ቤት
  choice: jenes Haus
  rationale: Der Demonstrativ wird ausdrücklich wiedergegeben; »Haus« bleibt gegenüber der kontextuell möglichen Deutung als Tempel quellennäher.
- source_word: ዐቢየ
  choice: groß
  rationale: Kann sowohl räumliche Größe als auch hervorgehobene Bedeutung tragen und passt zum visionären Register.
- source_word: ወርኂበ
  choice: weit
  rationale: Bezeichnet Breite beziehungsweise Geräumigkeit und bildet im Deutschen eine natürliche Reihung mit »groß«.
- source_word: ወምሉአ
  choice: und … voll
  rationale: Wird als weiteres prädikatives Adjektiv unter dem Verb »wurde« verstanden.
- source_word: ፈድፋደ
  choice: überaus
  rationale: Das Wort wird adverbial als Verstärkung von »voll« aufgefasst, nicht als Substantiv »Fülle/Überfluss«.
theological_decisions:
- issue: Ob ቤት im Zusammenhang der Tierapokalypse spezifisch als »Tempel« wiederzugeben ist
  choice: Haus
  alternative: Tempel; Heiligtum
  rationale: Der weitere Zusammenhang kann einen Tempel oder ein Heiligtum nahelegen, doch der äthiopische Wortlaut sagt allgemein »Haus«. Die offenere Formulierung bleibt im Haupttext erhalten; die symbolische Deutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, knappem visionärem Ton. Die polysyndetische Reihung mit »und« bewahrt den Rhythmus des äthiopischen Satzes; »jenes Haus« bildet den vorhandenen Demonstrativ ab.
