base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/013.yaml
  text: And I saw until the shepherds and the eagles and the vultures and the kites came[a], and they cried out to the ravens to break the horn of that ram; and they fought and battled with him, and he fought with them[c][b], and cried out that his help might come.
translation:
  language: de
  text: Und ich sah, bis die Hirten, die Adler, die Geier und die Milane kamen. Sie riefen den Raben zu, sie sollten das Horn jenes Widders zerbrechen. Und sie kämpften und stritten mit ihm, und er kämpfte mit ihnen und rief, dass seine Hilfe[a] kommen möge.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »sein Helfer«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኖላዊያን
  choice: die Hirten
  rationale: Bewahrt die im Tiergleichnis etablierte apokalyptische Bildsprache und gibt die übliche Bedeutung des Wortes wieder.
- source_word: አንስርት
  choice: die Adler
  rationale: Gibt den Raubvogel in der Aufzählung als eigenständige Tiergruppe wieder.
- source_word: ዝኩ አውስት
  choice: die Geier
  rationale: Die Wortfolge wird gemäß der jüngsten quellenbezogenen Prüfung als Bezeichnung der Geier verstanden; ein demonstrativer Beiklang ist im Deutschen für eine natürliche Aufzählung nicht eigens ausgedrückt.
- source_word: ሀባይ
  choice: die Milane
  rationale: Bezeichnet hier wahrscheinlich eine weitere Raubvogelart; »Milane« hält die Gruppen der Vision auseinander, ohne eine historische Deutung einzutragen.
- source_word: ቋዓት
  choice: den Raben
  rationale: Die Raben sind nach der überprüften Syntax die Adressaten des Zurufs, nicht Teil der vorausgehenden Subjektaufzählung.
- source_word: ይቀትቅጥዎ
  choice: zerbrechen
  rationale: Gibt das gewaltsame Brechen des Horns klar wieder, ohne die Intensität unnötig zu steigern.
- source_word: ቀርኖ ለዝኩ ይቤላ
  choice: das Horn jenes Widders
  rationale: Die Konstruktion bezeichnet das Horn des genannten männlichen Tieres; »Widder« passt zur Tiergestalt und zur vorhandenen Revisionsprüfung.
- source_word: ረዳኢቱ
  choice: seine Hilfe
  rationale: Das abgeleitete Substantiv kann abstrakte Hilfe oder eine helfende Person bezeichnen; die Hauptfassung wahrt mit »Hilfe« die Offenheit, während die Alternative in der Fußnote steht.
theological_decisions:
- issue: Identität der Gestalten im Tiergleichnis
  choice: Die Tier- und Hirtenbilder bleiben unaufgelöst stehen.
  alternative: Die Gestalten im Haupttext mit bestimmten Herrschern, Völkern oder Mächten identifizieren.
  rationale: Der Ausgangstext spricht in apokalyptischen Bildern. Eine historische oder konfessionelle Festlegung würde die genuine Deutungsoffenheit einschränken.
- issue: Art der erwarteten Hilfe
  choice: »seine Hilfe« mit Fußnote zur persönlichen Lesart
  alternative: »sein Helfer«
  rationale: Die Form lässt sowohl Hilfe im abstrakten Sinn als auch einen Helfer zu; die Übersetzung entscheidet diese theologisch möglicherweise bedeutsame Spannung nicht endgültig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange Ausgangsperiode ist für gute Verständlichkeit in drei Sätze gegliedert. Die wiederholten Kampfverben werden als »kämpften und stritten« bewahrt; die apokalyptischen Tierbilder werden nicht ausgelegt.
