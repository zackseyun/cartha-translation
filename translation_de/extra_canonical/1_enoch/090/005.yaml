base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/005.yaml
  text: And I saw until the time when twenty-three were shepherding[a], and they completed, in their respective times[c][b], fifty-eight times.
translation:
  language: de
  text: Und ich sah weiter bis zu der Zeit, als dreiundzwanzig Hirten waren[a]; und sie vollendeten, jeder zu seiner Zeit, achtundfünfzig Zeiten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Verb bedeutet „weiden, hüten“ und bezeichnet im Bildfeld dieses Abschnitts die Tätigkeit der Hirten.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „achtundfünfzig Zeiten“; damit können gezählte oder zugeteilte Zeiträume gemeint sein. Ihre genaue Länge und geschichtliche Zuordnung bleiben offen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: Und ich sah weiter
  rationale: Bewahrt die visionäre Berichtsformel; „weiter“ gibt im Deutschen den fortlaufenden Blick bis zu einem Zeitpunkt natürlich wieder.
- source_word: እስከ ዘመን
  choice: bis zu der Zeit
  rationale: Gibt die zeitliche Grenze der geschauten Abfolge idiomatisch und nah am Ausgangstext wieder.
- source_word: ይሬዐዩ
  choice: als Hirten tätig waren
  rationale: Die Form gehört wegen des pharyngalen ዐ zur Wurzel mit der Bedeutung „weiden, als Hirte wirken“, nicht zur ähnlich geschriebenen Wurzel „sehen“. Die Formulierung passt außerdem zum Kontext der Hirten im Tierbuch.
- source_word: ፳ወ፫
  choice: dreiundzwanzig
  rationale: Direkte Wiedergabe der äthiopischen Zahl.
- source_word: ወፈጸሙ
  choice: und sie vollendeten
  rationale: Bewahrt den Sinn des Zu-Ende-Bringens einer gezählten beziehungsweise zugeteilten Abfolge.
- source_word: በበጊዜሆሙ
  choice: jeder in seiner Zeit
  rationale: Die distributive Bildung wird ausdrücklich wiedergegeben und bezeichnet die jeweils eigene oder zugeteilte Zeit.
- source_word: ፶ወ፰ ጊዜያተ
  choice: achtundfünfzig Zeitabschnitte
  rationale: ጊዜያተ kann „Zeiten“ oder gezählte Perioden bezeichnen. „Zeitabschnitte“ ist im modernen Deutschen verständlicher als das missverständliche „achtundfünfzig Mal“, ohne eine Deutung als Jahre oder Amtszeiten festzulegen.
theological_decisions:
- issue: Art der gezählten Einheiten in der Chronologie des Tierbuchs
  choice: achtundfünfzig Zeitabschnitte
  alternative: achtundfünfzig Zeiten; achtundfünfzig Amtszeiten der Hirten
  rationale: Die symbolische Chronologie wird nicht auf Jahre, geschichtliche Epochen oder bestimmte Amtszeiten festgelegt. „Zeitabschnitte“ erhält den gezählten temporalen Charakter und lässt den genauen Bezug offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Hirtenmetaphorik und die offene symbolische Zeitrechnung bleiben erhalten; schwer verständliches „achtundfünfzig Mal“ wird vermieden.
