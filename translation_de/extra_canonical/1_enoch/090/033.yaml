base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/033.yaml
  text: And all those that had been scattered and dispersed[a], and all the beasts of the field and all the birds of heaven, were gathered into that house; and the Lord of the sheep rejoiced with great joy[c][b], because they had all become good and had entered into his house.
translation:
  language: de
  text: Und alle, die zugrunde gegangen und zerstreut worden waren,[a] sowie alle wilden Tiere und alle Vögel des Himmels wurden in jenem Haus versammelt.[b] Da freute sich der Herr der Schafe mit großer Freude, weil sie alle gut geworden und in sein Haus hineingegangen waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das erste Verb kann Verlust oder Untergang, auch „vernichtet worden“, bezeichnen; das zweite heißt „zerstreut“.
    reason: lexical_alternative
  - marker: b
    text: Das „Haus“ gehört zur wiederhergestellten Wohn- und Heiligtumsbildwelt dieser Vision; es ist nicht lediglich ein gewöhnliches Gebäude.
    reason: cultural_note
lexical_decisions:
- source_word: ተሐጕሉ
  choice: verloren gegangen
  rationale: Das Verb kann zugrunde gehen, verloren sein oder vernichtet werden bezeichnen. „Verloren gegangen“ bewahrt diese Bedeutungsbreite und vermeidet sowohl die unbelegte Angleichung an das folgende Verb („zerstreut“) als auch die eindeutige Festlegung auf physische Vernichtung.
- source_word: ተዘርዘሩ
  choice: zerstreut worden waren
  rationale: Das Verb bezeichnet Zerstreuung bzw. Verteilung. Zusammen mit dem vorhergehenden Verb bleibt die zweigliedrige Beschreibung erhalten.
- source_word: አራዊተ ገዳም
  choice: wilde Tiere
  rationale: Die Wortgruppe bezeichnet Tiere der Wildnis beziehungsweise des freien Landes; „wilde Tiere“ ist im modernen Deutschen natürlich und passt zur Bildwelt der Tiervision.
- source_word: አዕዋፈ ሰማይ
  choice: Vögel des Himmels
  rationale: Die formnahe Wiedergabe erhält die feierliche apokalyptische Ausdrucksweise.
- source_word: ተጋብኡ
  choice: wurden ... versammelt
  rationale: Das Passiv lässt wie im Ge'ez offen, wer die Sammlung bewirkt.
- source_word: በውእቱ ቤት
  choice: in jenem Haus
  rationale: Im Zusammenhang mit dem Verb des Versammelns bezeichnet die Präpositionalfügung das Ziel beziehungsweise den Ort der Sammlung; „in jenem Haus“ ist im Deutschen idiomatisch.
- source_word: እግዚኦሙ ለአባግዕ
  choice: der Herr der Schafe
  rationale: Der wiederkehrende symbolische Gottestitel der Tiervision wird unverändert bewahrt.
- source_word: ተፈሥሐ ዐቢየ ፍሥሐ
  choice: freute sich ... mit großer Freude
  rationale: Die figura etymologica des Ausgangstextes wird trotz der bewusst feierlichen Wiederholung erhalten.
- source_word: ኄራነ
  choice: gut
  rationale: „Gut“ bewahrt den breiten Sinn einer positiven oder moralischen Erneuerung, ohne ihn auf den technischeren Begriff „gerecht“ festzulegen.
- source_word: ገብኡ ውስተ ቤቱ
  choice: in sein Haus hineingegangen waren
  rationale: Die Wiedergabe erhält die vollzogene Bewegung in das Haus und bezieht das Possessivpronomen natürlich auf den Herrn der Schafe.
theological_decisions:
- issue: Bedeutung von ተሐጕሉ und mögliches Auferstehungsmotiv
  choice: „verloren gegangen“
  alternative: „vernichtet worden“ oder „zugrunde gegangen“
  rationale: Das Lexem kann Verlust oder Untergang ausdrücken. Die gewählte Formulierung lässt offen, ob physische Vernichtung gemeint ist, und verwischt das Verb zugleich nicht mit dem folgenden „zerstreut“.
- issue: Bezug von „Herr der Schafe“
  choice: Als göttlicher Symboltitel der Tiervision beibehalten
  alternative: „ihr Herr“ oder „der Besitzer der Schafe“
  rationale: Die charakteristische apokalyptische Bildsprache soll nicht in allgemeine Prosa aufgelöst werden.
- issue: Art der Erneuerung in ኄራነ
  choice: „gut geworden“
  alternative: „gerecht geworden“ oder „rechtschaffen geworden“
  rationale: Der Ausgangsausdruck benennt einen guten Zustand, ohne hier zwingend einen engeren dogmatischen Begriff festzulegen.
- issue: Symbolik des Hauses
  choice: „jenes Haus“ und „sein Haus“ im Haupttext ohne interpretierende Ersetzung
  alternative: Ausdrückliche Identifikation als Tempel
  rationale: Das Haus gehört zur Wiederherstellungs- und Heiligtumsbildwelt der Vision, doch der Text selbst bleibt beim Symbol und sollte nicht im Haupttext vereindeutigt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter apokalyptischer Bildsprache. Die absichtliche Wiederholung „freute sich ... mit großer Freude“ bildet die verstärkende Wortfigur des Ge'ez nach.
