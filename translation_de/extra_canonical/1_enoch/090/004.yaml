base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/004.yaml
  text: And I saw until those sheep were devoured by the dogs and by the eagles and by the kites[a], and they left them no flesh at all, nor skin, nor sinew, until only their bones stood there; and even their bones fell upon the earth[e][d][c][b], and the sheep became few.
translation:
  language: de
  text: Und ich sah, bis jene Schafe von den Hunden, den Adlern und den Milanen[a] verschlungen wurden. Sie ließen ihnen überhaupt kein Fleisch, keine Haut und keine Sehne, bis nur noch ihre Knochen dastanden[b]. Und selbst ihre Knochen fielen zu Boden, und die Schafe wurden nur noch wenige.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der mit „Milane“ wiedergegebene Ausdruck kann allgemeiner einen Habicht oder einen anderen Greifvogel bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Die auffällige Wendung „ihre Knochen dastanden“ bewahrt das drastische Bild des äthiopischen Textes: Nur die bloßgelegten Knochen waren noch übrig.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተበልዑ
  choice: verschlungen wurden
  rationale: Die passive Form und der Zusammenhang eines Raubtierangriffs verlangen eine kräftige Wiedergabe; „verschlungen“ bewahrt die brutale Bildwirkung.
- source_word: አክልብት
  choice: Hunde
  rationale: Der gewöhnliche Tiername bleibt innerhalb der symbolischen Tierapokalypse schlicht und wörtlich.
- source_word: አንስርት
  choice: Adler
  rationale: Dies ist die übliche Entsprechung; eine genauere Festlegung auf Geier ist aufgrund der Quellenlage nicht geboten.
- source_word: ሆባይ
  choice: Milane
  rationale: Der Ausdruck bezeichnet wohl einen von den Adlern unterschiedenen Greifvogel; „Milane“ gibt die wahrscheinliche Art wieder, ohne die verbleibende Unsicherheit zu verschweigen.
- source_word: ኢኃደጉ ሎሙ ሥጋ ግሙራ
  choice: Sie ließen ihnen überhaupt kein Fleisch
  rationale: ግሙራ verstärkt in Verbindung mit der Verneinung deren Vollständigkeit; „überhaupt kein“ vermeidet die irreführende Vorstellung, nur unversehrtes Fleisch sei gemeint.
- source_word: ማእሰ
  choice: Haut
  rationale: „Haut“ ist im Bild ausgeweideter Schafe die natürliche und allgemein verständliche Entsprechung.
- source_word: ሥርወ
  choice: Sehne
  rationale: „Sehne“ wahrt die konkrete anatomische Reihe Fleisch–Haut–Sehne und passt zum würdigen Register.
- source_word: ቆሙ ባሕቲቶ አዕፅምቲሆሙ
  choice: bis nur noch ihre Knochen dastanden
  rationale: Die Formulierung bewahrt das drastische, körperliche Bild des Originals, statt es zum bloßen „Übrigbleiben“ zu glätten.
- source_word: ወአዕፅምቲሆሙሰ ወደቁ ዲበ ምድር
  choice: Und selbst ihre Knochen fielen zu Boden
  rationale: „Selbst“ gibt den fokussierenden und steigernden Charakter von -ሰ in diesem Zusammenhang wieder; „zu Boden“ ist natürliches modernes Deutsch.
- source_word: ወንእሱ አባግዕ
  choice: und die Schafe wurden wenige
  rationale: Die quellennähere, bewusst schlichte Formulierung hält die Aussage einer zahlenmäßigen Verminderung fest; „schwanden dahin“ wäre idiomatischer, aber interpretativ stärker.
theological_decisions:
- issue: Symbolische Tierbilder innerhalb der Tierapokalypse
  choice: Die Tiere werden im Haupttext wörtlich benannt.
  alternative: Die Tiere unmittelbar als Völker, Herrscher oder Heere deuten.
  rationale: Die Übersetzung soll die Bildsprache der Vision erhalten und ihre mögliche historische oder theologische Deutung nicht in den Text selbst eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit anschaulicher apokalyptischer Härte. Die Tierbezeichnungen bleiben unkommentiert symbolisch; ungewöhnliche Quellbilder werden soweit verständlich bewahrt. Alle Fußnotenmarker stehen an ihrer jeweiligen Stelle im Haupttext.
