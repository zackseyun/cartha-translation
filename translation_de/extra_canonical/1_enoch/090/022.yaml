    rationale: Nach „diese siebzig Hirten“ kann das erste wie auch das zweite „sie“ im Deutschen missverständlich auf die Hirten bezogen werden. Der unmittelbare visionäre Kontext und die Satzstruktur beziehen das Objekt des Nehmens auf die den Hirten anvertrauten Schafe. Die explizite Wiederaufnahme von „die Schafe“ macht die Handlungskette verständlich.
