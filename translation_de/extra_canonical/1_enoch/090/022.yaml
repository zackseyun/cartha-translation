base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/022.yaml
  text: And he said to that man who was writing before him[a], who was one of those seven white ones, and he said to him, “Take those seventy shepherds to whom I delivered the sheep; and they, taking them[c][b], killed many more than I commanded them.”
translation:
  language: de
  text: 'Und er sagte zu jenem Mann, der vor ihm schrieb und einer von jenen sieben Weißen war, und er sagte zu ihm: »Nimm diese siebzig Hirten, denen ich die Schafe anvertraut hatte.[a] Sie nahmen die Schafe und töteten weit mehr, als ich ihnen befohlen hatte.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »denen ich die Schafe übergeben hatte«. Das Verb bezeichnet die Übergabe in die Obhut oder Verantwortung eines anderen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ብእሲ
  choice: Mann
  rationale: Das Substantiv bezeichnet gewöhnlich eine männliche Person und bewahrt hier die menschliche Erscheinungsform des himmlischen Schreibers.
- source_word: ዘይጽሕፍ በቅድሜሁ
  choice: der vor ihm schrieb
  rationale: Die fortdauernde Schreibtätigkeit in der erzählten Vergangenheit und die räumlich-höfische Stellung werden knapp und natürlich wiedergegeben.
- source_word: ፯እምነ ዝኩ ፯ጻዕዳው
  choice: einer von jenen sieben Weißen
  rationale: Die substantivierte Farbbezeichnung erhält die visionäre Symbolik, ohne die Gestalten im Text ausdrücklich als Engel zu deuten.
- source_word: ንሥኦሙ
  choice: Nimm
  rationale: Der Imperativ bezeichnet das Ergreifen beziehungsweise Abführen; „Nimm“ lässt die genaue Art der Ingewahrsamnahme offen.
- source_word: ፸ኖሎት
  choice: siebzig Hirten
  rationale: Die zentrale Hirtenmetapher der Tierapokalypse bleibt unverändert und wird nicht als „Engel“ oder „Herrscher“ ausgedeutet.
- source_word: መጠውክዎሙ አባግዐተ
  choice: denen ich die Schafe anvertraut hatte
  rationale: „Anvertraut“ bringt die Übergabe in die Verantwortung anderer idiomatisch zum Ausdruck; das Plusquamperfekt ordnet sie zeitlich vor das berichtete Gerichtsgeschehen ein.
- source_word: ነሢኦሙ ቀተሉ
  choice: Sie nahmen sie und töteten
  rationale: Die Abfolge von Aufnahme/Ergreifen und Töten bleibt erhalten. Das zweite „sie“ bewahrt den pronominalen Rückverweis des Ausgangstextes.
- source_word: ብዙኃነ እምዘ አዘዝክዎሙ
  choice: weit mehr, als ich ihnen befohlen hatte
  rationale: Die Formulierung bezeichnet eine schuldhafte Überschreitung des ihnen gesetzten Maßes, nicht das völlige Fehlen eines Auftrags.
theological_decisions:
- issue: Identität der siebzig Hirten
  choice: Die symbolische Bezeichnung „siebzig Hirten“ bleibt im Haupttext stehen.
  alternative: siebzig Engel; siebzig Herrscher
  rationale: Die visionäre Bildsprache soll nicht durch eine bestimmte Identifikation aufgelöst werden.
- issue: Umfang des erteilten Tötungsauftrags
  choice: Die Hirten töteten mehr, als ihnen befohlen worden war.
  alternative: Sie töteten, obwohl ihnen das Töten überhaupt nicht befohlen worden war.
  rationale: Der geezische Vergleich bezeichnet am natürlichsten eine Überschreitung eines tatsächlich erteilten Auftrags und erhält damit die Spannung zwischen übertragener Vollmacht und deren Missbrauch.
- issue: Wiederholte Redeeinleitung
  choice: Beide Vorkommen von „und er sagte“ werden wiedergegeben.
  alternative: Die zweite Redeeinleitung aus stilistischen Gründen auslassen.
  rationale: Der Ausgangstext nimmt nach der eingeschobenen Beschreibung des Schreibers die Redeeinleitung ausdrücklich wieder auf; diese apokalyptische Erzählweise wird nicht geglättet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Redeeinleitung und die symbolischen Bezeichnungen des apokalyptischen Ausgangstextes bleiben erhalten; erklärende Identifikationen werden vermieden.
