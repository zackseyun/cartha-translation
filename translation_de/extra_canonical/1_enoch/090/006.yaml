base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/006.yaml
  text: And behold[a], lambs were born from those white sheep, and their eyes began to be opened, and they saw[b], and they cried out to the sheep.
translation:
  language: de
  text: Und siehe, von jenen weißen Schafen wurden Lämmer geboren, und sie begannen, ihre Augen zu öffnen, zu sehen und den Schafen zuzurufen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ነዋ
  choice: Und sieh
  rationale: Bewahrt den deiktischen, visionären Erzählstil der äthiopischen Partikel in natürlichem, würdigem Deutsch.
- source_word: መንስኣት
  choice: Lämmer
  rationale: Erhält die durchgehende Tierbildsprache der Tiervision, statt sie zu allgemein als „Junge“ oder „Nachkommen“ wiederzugeben.
- source_word: ተወልዱ
  choice: wurden ... geboren
  rationale: Gibt die passive Geburtsform schlicht und unmittelbar wieder.
- source_word: እምዝኩ አባግዕት ጻዓዳ
  choice: von jenen weißen Schafen
  rationale: „Jenen“ nimmt rückverweisend auf die zuvor geschauten Schafe Bezug; die symbolisch bedeutsame Farbangabe bleibt erhalten.
- source_word: አኃዙ
  choice: sie begannen
  rationale: Kennzeichnet den Beginn der nachfolgenden, koordinierten Handlungen.
- source_word: አዕይንቲሆሙ ይከሠቱ
  choice: ihre Augen zu öffnen
  rationale: Schließt sich syntaktisch an „sie begannen“ an und bewahrt das Bild erwachender Wahrnehmung.
- source_word: ወይርእዩ
  choice: zu sehen
  rationale: Wird als zweite von „sie begannen“ abhängige Handlung wiedergegeben.
- source_word: ወይጸርኁ
  choice: zu ... rufen
  rationale: Wird parallel zu den vorangehenden Imperfektformen als dritte von „sie begannen“ abhängige Handlung verstanden; „rufen“ vermeidet eine unnötige Festlegung auf Schreien oder Blöken.
- source_word: ኀበ አባግዕ
  choice: zu den Schafen
  rationale: Gibt die hier naheliegende Richtung des Rufens idiomatisch wieder.
theological_decisions:
- issue: Beibehaltung der Tierbilder in der symbolischen Apokalypse
  choice: Lämmer ... weiße Schafe ... Schafe
  alternative: Junge ... Weiße ... Herde
  rationale: Die konkrete, durchgehende Tierbildsprache trägt die Vision und darf nicht durch abstrahierende Bezeichnungen eingeebnet werden.
- issue: Syntaktische Abhängigkeit der drei Handlungen von „sie begannen“
  choice: ihre Augen zu öffnen, zu sehen und ... zu rufen
  alternative: ihre Augen begannen geöffnet zu werden, und sie sahen und riefen
  rationale: Die drei äthiopischen Imperfektformen stehen am plausibelsten parallel unter dem inchoativen አኃዙ; die deutsche Fassung erhält diese Spannung, ohne die Handlungen in selbstständige Vergangenheitsereignisse umzudeuten.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, visionärem Ton. Die koordinierte Infinitivreihe folgt der wahrscheinlichsten Ge’ez-Syntax; die Tiermetaphorik bleibt vollständig erhalten.
