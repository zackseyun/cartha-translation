base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/015.yaml
  text: And I watched until the Lord of the sheep came to them in wrath[a], and all who saw him fled[c][b], and they all fell into the shadow before his face.
translation:
  language: de
  text: Und ich sah zu, bis der Herr der Schafe im Zorn zu ihnen kam. Da flohen alle, die ihn sahen, und sie alle fielen von vor seinem Angesicht in den Schatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Schatten“ gibt das ge'ezische Bild wörtlich wieder. Der Ausdruck wird hier nicht näher als Finsternis, Totenreich oder einen bestimmten Ort des Gerichts gedeutet.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ
  choice: ich sah zu
  rationale: Im fortlaufenden Visionsbericht bezeichnet das Verb anhaltendes Beobachten; „sah zu“ klingt im modernen Deutschen natürlich und wahrt diesen Aspekt.
- source_word: እስከ መጽአ
  choice: bis ... kam
  rationale: Die Verbindung führt die Schau bis zum entscheidenden Eintreffen fort.
- source_word: እግዚአ አባግዕ
  choice: der Herr der Schafe
  rationale: Die Formulierung bewahrt den zentralen Hoheitstitel und zugleich die Bildwelt der Tierapokalypse.
- source_word: በመዓት
  choice: im Zorn
  rationale: Die Präpositionalphrase beschreibt die Art seines Kommens und behält den feierlichen Gerichtston bei.
- source_word: እለ ርእይዎ ኵሎሙ
  choice: alle, die ihn sahen
  rationale: Dies gibt die kollektive Relativkonstruktion knapp und idiomatisch wieder.
- source_word: ነፍጹ
  choice: flohen
  rationale: Das Verb bezeichnet hier die erschrockene Flucht vor der göttlichen Erscheinung.
- source_word: ወወድቁ ኵሎሙ
  choice: und sie alle fielen
  rationale: Das wiederholte „alle“ bleibt erhalten und unterstreicht die umfassende Wirkung des Gerichts.
- source_word: ውስተ ጽላሎት
  choice: in den Schatten
  rationale: Die konkrete Bildsprache „Schatten“ wird beibehalten, ohne sie vorschnell als Finsternis, Totenreich oder einen bestimmten Strafort auszulegen.
- source_word: እምቅድመ ገጹ
  choice: vor seinem Angesicht
  rationale: Die Wendung enthält wörtlich eine ablativische Nuance („von vor seinem Angesicht“). Im Satz kann sie sich semantisch auf die Flucht beziehungsweise das Zurückweichen aus seiner Gegenwart beziehen; die natürliche deutsche Fassung lässt die syntaktische Zuordnung offen und bewahrt das anschauliche „Angesicht“.
theological_decisions:
- issue: Identität des „Herrn der Schafe“
  choice: Hoheitstitel für Gott als den souveränen Richter der Herde innerhalb der Tierapokalypse
  alternative: ein lediglich allegorischer „Besitzer der Schafe“
  rationale: Der weitere Zusammenhang verwendet diese Gestalt als den übergeordneten Herrscher, der zum Gericht eingreift. „Herr“ wahrt dieses Gewicht, ohne spätere christologische Deutungen in den Vers einzutragen.
- issue: Bedeutung des Schattens
  choice: Das Bild bleibt unaufgelöst als „Schatten“ stehen.
  alternative: Deutung als Finsternis, Totenreich oder besonderer Ort des Gerichts
  rationale: Der äthiopische Ausdruck erlaubt eine unheilvolle Konnotation, bestimmt den gemeinten Ort oder Zustand aber nicht eindeutig.
translation_notes:
  register: Moderne, würdige Standardsprache mit leicht gehobenem Visions- und Gerichtsregister. „Angesicht“ bewahrt bewusst die anschauliche und feierliche Quellidiomatik; die Satzteilung erhöht die Verständlichkeit, ohne die Abfolge der Ereignisse zu verändern.
