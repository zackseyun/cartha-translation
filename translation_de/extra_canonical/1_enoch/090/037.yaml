base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/037.yaml
  text: And I saw that a white bull was born[a], and its horns were great[c][b]; and all the beasts of the field and all the birds of heaven feared it and entreated it at all times.
translation:
  language: de
  text: Und ich sah, dass ein weißer Stier[a] geboren wurde. Seine Hörner waren groß; und alle wilden Tiere und alle Vögel des Himmels fürchteten ihn und flehten ihn zu jeder Zeit an.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der weiße Stier ist eine Symbolgestalt innerhalb der Tierapokalypse. Seine Identität wird hier nicht ausdrücklich genannt.
    reason: cultural_note
  - marker: b
    text: 'Das zugrunde liegende Verb kann auch mit „baten ihn inständig“ oder, stärker, mit „richteten ihr Flehen an ihn“ wiedergegeben werden; weniger wörtlich: „suchten seine Gunst“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተወልደ
  choice: geboren wurde
  rationale: Die passive Geburtsform entspricht dem schlichten Sinn des ge’ezischen Verbs und vermeidet eine zusätzliche Deutung der Vision.
- source_word: ላህም
  choice: Stier
  rationale: Das Wort bezeichnet hier ein männliches Rind; „Stier“ bewahrt das für die Tierapokalypse wichtige Bild und passt zum Hinweis auf die Hörner.
- source_word: ጻዕዳ
  choice: weiß
  rationale: Die konkrete Farbangabe bleibt erhalten, da Farben in dieser Vision symbolische Bedeutung tragen.
- source_word: አቅርንቲሁ
  choice: seine Hörner
  rationale: Das grammatisch männliche deutsche Substantiv „Stier“ verlangt den natürlichen Bezug „seine“, ohne die Symbolgestalt weitergehend zu identifizieren.
- source_word: ዐበይት
  choice: waren groß
  rationale: „Groß“ kann sowohl die Größe als auch die hervorgehobene Bedeutung der Hörner ausdrücken, ohne sie ausdrücklich als mächtig oder kriegerisch zu deuten.
- source_word: አራዊተ ገዳም
  choice: die wilden Tiere
  rationale: Die Wendung bezeichnet die freilebenden Tiere; diese Formulierung ist im modernen Deutschen klarer als die wörtlichere Fassung „Tiere des Feldes“.
- source_word: አዕዋፈ ሰማይ
  choice: die Vögel des Himmels
  rationale: Die Formulierung bewahrt die Bildsprache und den gehobenen Ton des Ausgangstextes.
- source_word: ይፈርህዎ
  choice: fürchteten ihn
  rationale: Die direkte Wiedergabe erhält die universale Furcht vor dem neu geborenen weißen Stier.
- source_word: ያስተበቍዕዎ
  choice: flehten ihn an
  rationale: Das Verb bezeichnet ein dringliches Bitten, Flehen oder Ersuchen. „Flehten ihn an“ gibt diese starke, ehrerbietige Haltung wieder, ohne sie ausdrücklich als Anbetung festzulegen.
- source_word: በኵሉ ጊዜ
  choice: zu jeder Zeit
  rationale: Die Wendung bewahrt den umfassenden und fortdauernden Sinn in verständlichem modernem Deutsch.
theological_decisions:
- issue: Identität des weißen Stiers
  choice: Das Tiersymbol bleibt im Haupttext unaufgelöst.
  alternative: Die Gestalt ausdrücklich als menschlichen Herrscher oder messianische Figur bezeichnen.
  rationale: Die Tierapokalypse stellt die Gestalt selbst als weißen Stier dar. Eine ausdrückliche Identifizierung würde eine Auslegung in den übersetzten Text eintragen und die vorhandene Deutungsoffenheit beseitigen.
- issue: Stärke und mögliche religiöse Färbung des Flehens
  choice: „flehten ihn an“
  alternative: „suchten seine Gunst“ oder eine ausdrücklich kultische Formulierung
  rationale: Die gewählte Fassung erhält die starke Bedeutung des Verbs, entscheidet aber nicht, ob die Handlung als kultische Verehrung verstanden werden soll.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die konkreten Tier-, Farb- und Hornbilder bleiben erhalten; unnötig altertümliche Formen werden vermieden.
