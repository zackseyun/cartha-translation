base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/011.yaml
  text: And with that[a], all those eagles and vultures and ravens and kites kept snatching away the sheep even until now, and swooping down upon them and devouring them; but the sheep remained silent[e][d][c][b], and the rams lamented and cried out.
translation:
  language: de
  text: Da rissen all jene Adler, Geier, Raben und Milane die Schafe bis jetzt immer wieder fort, stürzten sich auf sie und fraßen sie; die Schafe aber blieben stumm, und die Widder klagten und schrien.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አንስርት
  choice: Adler
  rationale: Bezeichnet hier große Greifvögel; da unmittelbar danach ein eigener Ausdruck für Geier folgt, bewahrt „Adler“ die konkrete Unterscheidung der Vogelarten.
- source_word: አውስት
  choice: Geier
  rationale: Als von den Adlern unterschiedene große Raub- beziehungsweise Aasvögel wiedergegeben.
- source_word: ቋዓት
  choice: Raben
  rationale: Die revidierte lexikalische Zuordnung und die Reihenfolge des ge’ezischen Textes sprechen hier für „Raben“.
- source_word: ሆባይ
  choice: Milane
  rationale: Die revidierte lexikalische Zuordnung spricht für Milane als weitere konkrete Art von Greifvögeln.
- source_word: ይመስጥዎሙ ለአባግዕ
  choice: rissen den Schafen … immer wieder Tiere weg
  rationale: Das imperfektive Verb bezeichnet fortgesetztes gewaltsames Fortnehmen; das pronominale Objekt wird im Deutschen zur Verständlichkeit als „Tiere“ ausgedrückt, während „den Schafen“ das ge’ezische indirekte Objekt wiedergibt.
- source_word: ይሰርሩ ዲቤሆሙ
  choice: stürzten sich auf sie
  rationale: Im Zusammenhang mit angreifenden Vögeln bezeichnet das Verb ein Fliegen beziehungsweise Herabstoßen auf die Schafe, nicht ein Zertreten.
- source_word: ይበልዕዎሙ
  choice: fraßen sie
  rationale: Gibt das konkrete Fressen durch Raubvögel natürlich und eindringlich wieder, ohne einen zusätzlichen Bedeutungsbestandteil einzutragen.
- source_word: ያረምሙ
  choice: blieben stumm
  rationale: Bewahrt den Zustand des Schweigens beziehungsweise Verstummens knapp und bildhaft.
- source_word: ይቤላት
  choice: die Widder
  rationale: Das Wort ist als Pluralnomen „Widder“ zu verstehen und bildet das Subjekt der folgenden Verben.
- source_word: የአወይዉ ወይጸርኁ
  choice: klagten und schrien
  rationale: Die beiden Verben bezeichnen hörbaren Ausdruck von Schmerz und Not; die koordinierte Wiedergabe folgt der Syntax des Textes.
theological_decisions:
- issue: Vermeintlicher Widerspruch zwischen stummen Schafen und lautem Klagen
  choice: Die Schafe bleiben stumm; die Widder klagen und schreien.
  alternative: Das Klagen und Schreien ebenfalls den Schafen zuzuschreiben.
  rationale: ይቤላት ist das Nomen „Widder“ und Subjekt der folgenden Verben. Damit besteht im ge’ezischen Text kein Widerspruch, der bewahrt oder harmonisiert werden müsste.
translation_notes:
  register: Moderne, würdige Standardsprache mit konkreter Tierbildsprache. Die fortlaufende Gewalt wird durch „immer wieder“ ausgedrückt. Keine Fußnote ist erforderlich, da die revidierte Analyse die Vogelreihenfolge, das Herabstürzen und besonders „die Widder“ hinreichend klärt.
