  source_fidelity: 'Die Vogelabfolge (Adler, Geier, Raben, Milane), das Herabstoßen auf die Schafe, ihr Verstummen sowie die Widder als Subjekt des Klagens und Schreiens entsprechen dem ge''ezischen Text und den berechtigten Korrekturen im englischen Prüfverlauf. Nicht quellentreu ist jedoch „den Schafen … Tiere weg“: Das fügt ein nicht genanntes Objekt („Tiere“) ein und macht die Schafe fälschlich zum bloß indirekt Betroffenen. Die Schafe sind das betroffene pronominale Objekt und sollen als solches wiedergegeben werden.'
