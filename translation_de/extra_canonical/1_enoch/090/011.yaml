  terminology: „Adler“, „Geier“, „Raben“, „Milane“, „Schafe“ und „Widder“ sind sachgerecht. „stumm“ gibt die Aussage knapp wieder; „klagten und schrien“ bewahrt beide Verben ohne künstliche Harmonisierung.
