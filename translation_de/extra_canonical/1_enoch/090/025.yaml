base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/025.yaml
  text: And those shepherds were judged and were found to be sinners[c][b][a], and they were cast into that abyss of fire.
translation:
  language: de
  text: Und jene Hirten[a] wurden gerichtet und als Sünder befunden[b], und sie wurden in jenen Abgrund des Feuers geworfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die in der vorliegenden Transkription beschädigte Wortform wird im Zusammenhang als „Hirten“ gelesen.
    reason: textual_variant
  - marker: b
    text: 'Auch möglich: „wurden für schuldig befunden“. Wörtlicher liegt „wurden/erwiesen sich als Sünder“ nahe; im Zusammenhang handelt es sich um eine gerichtliche Feststellung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝኩ
  choice: und jene
  rationale: Die Form ist eine Verbindung aus der Konjunktion und einem Demonstrativ; sie bedeutet hier nicht „und ich sah“. „Und jene“ nimmt die bereits genannten Gestalten wieder auf.
- source_word: ኖላዊያን
  choice: Hirten
  rationale: Die trotz der beschädigten Transkription erkennbare Form bezeichnet die Hirten und verweist im Zusammenhang auf die zuvor gerichteten Hirten. Die apokalyptische Bildsprache bleibt als solche erhalten.
- source_word: ተኰነኑ
  choice: wurden gerichtet
  rationale: Das Passiv gehört zur Gerichtsszene. „Gerichtet“ bewahrt die Offenheit zwischen Gerichtsverfahren und verurteilendem Urteil besser als das engere „verurteilt“.
- source_word: ወኮኑ ኃጥኣነ
  choice: wurden als Sünder befunden
  rationale: Wörtlich steht eine Verbindung von „werden/sein“ mit „Sünder“. Im gerichtlichen Zusammenhang drückt sie die Feststellung ihres Sünderseins aus, ohne die moralisch-religiöse Bezeichnung durch das rein juristische „schuldig“ zu ersetzen.
- source_word: ወተወድዩ እሙንቱ
  choice: und sie wurden … geworfen
  rationale: Das passive Verb bezeichnet ein gewaltsames Hineinwerfen; das Pronomen nimmt die Hirten wieder auf. Die deutsche Satzstellung ist natürlich und wahrt den Nachdruck des Passivs.
- source_word: ውስተ'ዛ ማዕምቀ እሳት
  choice: in jenen Abgrund aus Feuer
  rationale: Die Wiedergabe erhält sowohl das Bild des Abgrunds als auch die nähere Bestimmung durch Feuer. Ein zusätzliches „tief“ wäre im Deutschen redundant und im Ausdruck nicht eigens erforderlich.
theological_decisions:
- issue: Identität der gerichteten Gestalten
  choice: Die symbolische Bezeichnung „Hirten“ bleibt im Haupttext stehen.
  alternative: Die Hirten durch ihre mutmaßlichen historischen oder angelischen Entsprechungen ersetzen.
  rationale: Der Abschnitt arbeitet mit einer fortlaufenden apokalyptischen Bildwelt. Eine identifizierende Deutung im Haupttext würde die Bildsprache auflösen und mehr festlegen, als der Vers selbst sagt.
- issue: Moralische oder rein juristische Wiedergabe von ኃጥኣነ
  choice: „als Sünder befunden“
  alternative: „für schuldig befunden“ oder „wurden zu Sündern“
  rationale: „Sünder“ bewahrt die moralisch-theologische Aussage, während „befunden“ ihre gerichtliche Funktion im Kontext erkennen lässt. So bleibt die Spannung zwischen Wesensbeschreibung und Schuldfeststellung erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer apokalyptischer Gerichtssprache. Das zweimalige Passiv entspricht dem gerichtlichen Charakter des Ausgangstextes; die symbolische Bezeichnung „Hirten“ wird nicht ausgedeutet.
