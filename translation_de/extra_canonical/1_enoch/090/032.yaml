  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die zentralen Aussagen des geʿezischen Textes zuverlässig wieder: die bezeichneten Schafe werden sämtlich weiß; ihr Haar wird groß bzw. voll/dicht und rein. „Dicht“ ist hier eine idiomatische, kontextgerechte Wiedergabe von ዐቢየ im Bezug auf Haar und behauptet keine über den Bildausdruck hinausgehende Deutung.'
  naturalness: „Und alle jene Schafe wurden weiß, und ihr Haar wurde dicht und rein“ ist klares, würdiges modernes Standarddeutsch. Das etwas formellere „jene“ passt zum visionär-bildhaften Register. Die Verbindung „Haar wurde dicht und rein“ ist verständlich und angemessen.
