translation:
  language: de
  text: Und alle jene Schafe wurden weiß, und ihr Haar wurde dicht und rein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እልኩ፡ አባግዕ
  choice: alle jene Schafe
  rationale: Gibt das demonstrative Element und die Gesamtheit der Schafe natürlich und vollständig wieder.
- source_word: ጻዕዳ
  choice: weiß
  rationale: Direkte Wiedergabe der Farbbezeichnung.
- source_word: ጸጕረ፡ ዚአሆሙ
  choice: ihr Haar
  rationale: Das Substantiv bezeichnet Haar; obwohl bei Schafen im Deutschen auch „Wolle“ naheliegt, bewahrt „Haar“ die allgemeinere Bildsprache des Ausgangstextes und folgt der geprüften Konsultationsfassung.
- source_word: ዐቢየ
  choice: wurde dicht
  rationale: Wörtlich liegt die Vorstellung von Großwerden oder Zunehmen vor. Auf Haar bezogen drückt „dicht werden“ diese Zunahme in natürlichem Deutsch aus.
- source_word: ንጹሐ
  choice: rein
  rationale: Bewahrt den möglichen körperlichen wie auch symbolischen Sinn von Reinheit, ohne ihn auf „sauber“ oder eine ausdrücklich kultische Bedeutung zu verengen.
theological_decisions:
- issue: Mögliche symbolische Bedeutung von Weißsein und Reinheit
  choice: Die Bildsprache bleibt ohne erklärende Deutung stehen.
  alternative: Die Schafe ausdrücklich als gerecht, geläutert oder heilig bezeichnen.
  rationale: Der Vers nennt Weißsein und Reinheit, deutet ihre theologische Bedeutung hier aber nicht ausdrücklich aus; die Übersetzung soll diese Spannung bewahren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit einfacher Satzstruktur. „Haar“ ist bewusst allgemeiner als „Wolle“; „dicht“ gibt die auf das Haar bezogene Vorstellung des Zunehmens idiomatisch wieder.
