base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/021.yaml
  text: And the Lord of the sheep called those seven first white ones and commanded that they bring before him[a], beginning with the first star that went before those stars whose private parts were like those of horses, that first one which went out before them[e][d][c][b]; and they brought them before him.
translation:
  language: de
  text: Und der Herr der Schafe rief jene sieben ersten weißen Männer und befahl ihnen, sie vor ihn zu bringen[a], angefangen bei dem ersten Stern, der jenen Sternen voranging, deren Schamteile denen von Pferden glichen[c] — jenem ersten Stern, der vor ihnen hervorgetreten war[b]. Und sie brachten sie vor ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der folgende Satzteil ist im äthiopischen Text schwierig überliefert. Wahrscheinlich bezeichnet er die Reihenfolge der Vorführung und nimmt denselben führenden Stern noch einmal auf.
    reason: textual_variant
  - marker: b
    text: In dem eingeklammerten, offenbar beschädigten Satzteil ist wahrscheinlich „Stern“ zu lesen. Gemeint ist demnach derselbe erste Stern, nicht eine weitere Gestalt.
    reason: textual_variant
  - marker: c
    text: Die Sterne stehen in dieser Vision sinnbildlich für himmlische Wesen. Der Vergleich mit Pferden ist ein bewusst beschämendes sexuelles Bild und erinnert an die Verfehlung der rebellischen himmlischen Wesen.
    reason: cultural_note
lexical_decisions:
- source_word: እግዚአ ሰብኡ
  choice: der Herr der Schafe
  rationale: Bewahrt den erhabenen Titel und die Bildsprache der Tierapokalypse.
- source_word: ሰብአ ፯ጸዓድወ ቀዳማዊያን
  choice: jene sieben ersten weißen Männer
  rationale: ሰብአ bezeichnet ausdrücklich Männer; die Formulierung erhält zugleich die visionäre Kennzeichnung durch Weißsein und Vorrang.
- source_word: ያምጽኡ ቅድሜሁ
  choice: sie vor ihn zu bringen
  rationale: Gibt die gerichtliche Vorführung natürlich und quellennah wieder.
- source_word: እምክቡበ ቀዳማዊ ዘይቀድም እምነ ዝኩ ከዋክብት
  choice: angefangen bei dem ersten Stern, der jenen Sternen voranging
  rationale: Versteht እም in diesem Zusammenhang inzeptiv und wahrt die Abfolge der Vorführung.
- source_word: ከዋክብት
  choice: Sterne
  rationale: Erhält das apokalyptische Bild, statt es im Haupttext als Engel auszudeuten.
- source_word: ኃፍረቶሙ ከመ ኃፍረተ አፍራስ
  choice: deren Schamteile denen von Pferden glichen
  rationale: Gibt das absichtlich beschämende sexuelle Bild klar, würdig und ohne Abschwächung wieder.
- source_word: '[ወሰነኩበ፡ ቀዳማዊ፡ ዘወፅአ፡ ቅድመ፡]'
  choice: jenem ersten Stern, der vor ihnen hervorgetreten war
  rationale: Folgt der textkritisch plausiblen Lesung, wonach das fehlerhaft überlieferte Wort „Stern“ bezeichnet, und versteht den Satzteil als Wiederaufnahme des führenden Sterns.
- source_word: ወአምጽእዎሙ ለእሎሙ ቅድሜሁ
  choice: Und sie brachten sie vor ihn
  rationale: Erhält die wiederholte Verfahrensformel des Gerichtsgeschehens.
theological_decisions:
- issue: Deutung der Sterne als Engelwesen
  choice: Im Haupttext bleibt „Sterne“ stehen.
  alternative: Die Sterne unmittelbar als „Engel“ wiedergeben.
  rationale: Die Tierapokalypse spricht in visionären Symbolen; eine direkte Auflösung würde die literarische und theologische Spannung einebnen.
- issue: Wiedergabe der sieben weißen Gestalten
  choice: „sieben ersten weißen Männer“
  alternative: „sieben ersten Weißen“ oder „sieben ersten weißen Wesen“
  rationale: Das ausdrücklich vorhandene ሰብአ wird als „Männer“ wiedergegeben, ohne die Gestalten darüber hinaus dogmatisch zu bestimmen.
- issue: Explizitheit des sexuellen Vergleichs
  choice: „Schamteile“
  alternative: „Geschlechtsteile“ oder eine stärkere Verhüllung
  rationale: „Schamteile“ entspricht dem Schamwortfeld der Quelle und bewahrt die anstößige Bildkraft in würdigem Deutsch.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die apokalyptische Bildsprache und die Wiederholung der gerichtlichen Handlung bleiben erhalten; der schwierige überlieferte Satzbau wird behutsam geglättet, ohne seine sachliche Mehrdeutigkeit zu verdecken.
