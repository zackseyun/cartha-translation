base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/029.yaml
  text: And I saw until the Lord of the sheep brought a new house[a], greater and loftier than the first, and set it up in the place of the first, which had been folded up; and all its pillars were new, and its ornaments were new and greater than those of the first old one that he had taken away[b], and all the sheep were within it.
translation:
  language: de
  text: Und ich sah, bis der Herr der Schafe ein neues Haus brachte, größer und höher als das erste, und es an der Stelle des ersten errichtete, das zusammengerollt worden war[a]. Alle seine Säulen waren neu, und sein Schmuck war neu und größer als der des ersten, alten Hauses, das er weggenommen hatte[b]. Und alle Schafe waren darin.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zusammengefaltet“ oder „eingewickelt“; das zugrunde liegende ge’ezische Verb ist schwierig und kann beschreiben, wie das frühere Haus vor seiner Ersetzung zusammengelegt wurde.'
    reason: lexical_alternative
  - marker: b
    text: Das „Haus“ steht wahrscheinlich für das wiederhergestellte oder endzeitliche Heiligtum; im Haupttext bleibt jedoch die Bildsprache der Vision erhalten.
    reason: cultural_note
lexical_decisions:
- source_word: እግዚአ አባግዕ
  choice: der Herr der Schafe
  rationale: Bewahrt den erhabenen apokalyptischen Ton und das wiederkehrende Bild Gottes als Herrn der Herde.
- source_word: ቤት ኀዲስ
  choice: ein neues Haus
  rationale: Das Grundwort bezeichnet ein Haus. Die mögliche symbolische Bedeutung als Tempel oder Heiligtum wird nicht in den Haupttext eingetragen.
- source_word: ዓቢይ ... ልዑል
  choice: größer und höher
  rationale: Gibt sowohl die gesteigerte Größe als auch die Höhe natürlich und verständlich wieder.
- source_word: አቀሞ ውስተ መካነ ቀዳማዊት
  choice: errichtete es an der Stelle des ersten
  rationale: Verbindet den Gedanken des Aufstellens oder Errichtens mit dem Ersatz am selben Ort.
- source_word: እንተ ትጠብለለት
  choice: das zusammengerollt worden war
  rationale: Bewahrt das ungewöhnliche konkrete Bild des schwierigen Verbs, ohne es interpretierend als Zerstörung wiederzugeben.
- source_word: አዕማዲ
  choice: Säulen
  rationale: Ein geläufiger architektonischer Ausdruck, der zum Bild des Hauses passt.
- source_word: ስና
  choice: Schmuck
  rationale: Gibt die Verzierungen oder schmückenden Merkmale des Hauses wieder, ohne die sachliche Bedeutung zu stark einzuengen.
- source_word: አውፅአ
  choice: weggenommen hatte
  rationale: Drückt im Zusammenhang mit dem Ersatz des alten Hauses dessen Entfernung aus.
- source_word: ማእከላ
  choice: darin
  rationale: Bezeichnet knapp und natürlich den Aufenthalt aller Schafe im Inneren des neuen Hauses.
theological_decisions:
- issue: Ob ቤት als „Haus“ oder deutend als „Tempel“ wiederzugeben ist
  choice: Haus
  alternative: Tempel; Heiligtum
  rationale: Die Bildsprache der Tiervision bleibt erhalten; eine wahrscheinliche Deutung wird nicht an die Stelle des im Text genannten Bildes gesetzt.
- issue: Wie das Schicksal des ersten Hauses in እንተ ትጠብለለት auszudrücken ist
  choice: zusammengerollt worden war
  alternative: zusammengefaltet worden war; eingewickelt worden war; abgerissen worden war
  rationale: Die konkrete, aber lexikalisch unsichere Bildsprache wird bewahrt; die stärker deutende Wiedergabe „abgerissen“ wird vermieden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die langen Satzketten der Vorlage sind zur besseren Lesbarkeit maßvoll gegliedert, ohne ihre Abfolge oder Bildsprache aufzulösen.
