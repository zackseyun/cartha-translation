base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/016.yaml
  text: And all the eagles and the vultures and the ravens and the kites gathered together and came with them, with all the wild sheep; and they all came together and helped one another so as to break the horn of that ram.
translation:
  language: de
  text: Da versammelten sich alle Adler, Geier, Raben und Milane, und mit ihnen kamen alle wilden Schafe. Sie alle kamen zusammen und halfen einander, um das Horn jenes Widders zu zerbrechen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አንስርት፡ ወዓውስት፡ ወቋዓት፡ ወሀባይ
  choice: Adler, Geier, Raben und Milane
  rationale: Die vier Vogelbezeichnungen werden entsprechend ihrer üblichen zoologischen Zuordnung in der Tierapokalypse wiedergegeben; „Milane“ ist im Deutschen die natürliche Bezeichnung für die zuletzt genannte Greifvogelart.
- source_word: ኵሉ፡ አባግዕ፡ ገዳም
  choice: alle wilden Schafe
  rationale: Wörtlich bezeichnet die Wendung die Gesamtheit der Schafe des Wildlands beziehungsweise der Wildnis; „wilde Schafe“ bewahrt die Bildsprache knapp und verständlich.
- source_word: ይቀትቅጥዎ
  choice: zu zerbrechen
  rationale: Das Verb bezeichnet ein gewaltsames Zerschlagen oder Zerbrechen. Beim Horn ist „zerbrechen“ idiomatisch und erhält die Stärke der Handlung.
theological_decisions:
- issue: Bezug des unbestimmten Pronomens in „kamen mit ihnen“
  choice: Das Pronomen bleibt als „ihnen“ unaufgelöst.
  alternative: Den Bezug ausdrücklich als eine bestimmte zuvor erwähnte Tiergruppe benennen.
  rationale: Der Vers selbst nennt den Bezug nicht erneut. Eine explizite Identifizierung würde die genuine erzählerische Mehrdeutigkeit unnötig auflösen.
- issue: Symbolische Deutung von Horn und Widder
  choice: Die Tier- und Hornsymbolik wird ohne interpretierende Zusätze übersetzt.
  alternative: Das Horn oder den Widder mit einer historischen beziehungsweise theologischen Gestalt identifizieren.
  rationale: Die Übersetzung soll das apokalyptische Bild bewahren, statt eine bestimmte Auslegung in den Wortlaut einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer apokalyptischer Bildsprache. Die Wiederholung von „kamen“ und „alle“ bleibt weitgehend erhalten, da sie die Sammlung und Geschlossenheit der angreifenden Tiere betont.
