base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/023.yaml
  text: And behold[a], I saw all the prisoners, and they all stood before him.
translation:
  language: de
  text: Und siehe, ich sah alle Gefangenen[a], und sie alle standen vor ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Gebundenen“ oder „die Gefangenen“. Das Geʽez-Wort bezeichnet Menschen oder Wesen, die gebunden oder in Gewahrsam gehalten werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወናሁ
  choice: Und siehe
  rationale: Bewahrt die deiktische Formel der Vision und den apokalyptischen Sprachklang, statt sie auf eine bloße Erzählverknüpfung zu reduzieren.
- source_word: ኵሎሙ
  choice: alle / sie alle
  rationale: Gibt die zweimalige, nachdrückliche Gesamtheitsangabe des Ge'ez auch im Deutschen wieder.
- source_word: እሱራነ
  choice: Gefangenen
  rationale: Bezeichnet Menschen oder Wesen, die gebunden beziehungsweise in Gewahrsam gehalten werden. „Gefangene“ ist im Deutschen klar und idiomatisch; wörtlichere Möglichkeiten werden in der Fußnote genannt.
- source_word: ርኢኩ
  choice: ich sah
  rationale: Entspricht der üblichen Ich-Form eines Visionsberichts und gibt die abgeschlossene Wahrnehmung schlicht wieder.
- source_word: ወቆሙ
  choice: und sie standen
  rationale: Das Verb kann „stehen“ oder „sich erheben“ bedeuten. Im gerichtlichen Zusammenhang bezeichnet „standen“ natürlich das Erscheinen vor einer übergeordneten Gestalt.
- source_word: ቅድሜሁ
  choice: vor ihm
  rationale: Direkte, formelle Wiedergabe, die den gerichtlichen Anklang wahrt und die im Vers nicht erneut bestimmte Identität der männlichen Bezugsperson offenlässt.
theological_decisions:
- issue: Identität und Bedeutung der festgehaltenen Gruppe
  choice: „Gefangenen“, ohne sie im Haupttext näher als Sterne, Hirten oder engelhafte Übeltäter zu bestimmen
  alternative: „Gebundenen“ oder „Gefesselten“ mit ausdrücklicher Deutung der Gruppe
  rationale: Der Wortlaut kennzeichnet die Gruppe durch ihren Zustand der Gefangenschaft beziehungsweise Bindung. Ihre genauere allegorische Identität ergibt sich allenfalls aus dem Kontext und wird deshalb hier nicht in den Text eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formel „Und siehe“ bewahrt den apokalyptischen Ton; der Doppelpunkt macht den anschließenden Visionsbericht lesbar. Die Wiederholung von „alle“ entspricht der Hervorhebung im Ausgangstext.
