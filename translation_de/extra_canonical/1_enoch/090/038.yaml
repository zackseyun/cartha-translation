base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/038.yaml
  text: And I saw until all their kinds were transformed[a], and they all became white cattle; and the first among them became a wild ox, and that wild ox became a great beast[d][c][b], and it had great black horns on its head.
translation:
  language: de
  text: Und ich sah, wie alle ihre Arten verwandelt wurden und sie alle zu weißen Rindern wurden. Das Erste unter ihnen wurde zu einem Wildochsen,[a] und dieser Wildochse wurde zu einem großen Tier; es hatte große schwarze Hörner auf seinem Kopf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte ge''ezische Text hat hier zweimal ነገር, „Wort“ oder „Sache“, und kennzeichnet die erste Stelle als textkritisch verdächtig. Im Zusammenhang der Tiergestalten ist wahrscheinlich ein Tiername gemeint; daher steht im Haupttext „Wildochse“. Wörtlich nach dem erhaltenen Text könnte es heißen: „Das Erste unter ihnen wurde zu einem Wort, und dieses Wort wurde zu einem großen Tier.“'
    reason: textual_variant
lexical_decisions:
- source_word: ተወለጠ
  choice: verwandelt wurden
  rationale: Das Verb bezeichnet in dieser visionären Verwandlungsszene am ehesten einen Wechsel der Gestalt oder des Zustands.
- source_word: አዝማዲሆሙ
  choice: ihre sämtlichen Arten
  rationale: Die Wiedergabe bewahrt die zoologisch-symbolische Einteilung, ohne sie als Familienverhältnis zu deuten.
- source_word: አልህምተ ጻዕዳ
  choice: weiße Rinder
  rationale: „Rinder“ hält das kollektive Rinderbild fest, ohne Geschlecht oder Alter unnötig festzulegen.
- source_word: ቀዳማዊ … ማእከሎሙ
  choice: der Erste unter ihnen
  rationale: Dies gibt sowohl den Vorrang als auch die Zugehörigkeit zur Gruppe knapp und idiomatisch wieder.
- source_word: †ነገር … ነገር
  choice: Wildstier … Wildstier
  rationale: Der überlieferte ge'ezische Wortlaut („Wort/Sache“) ist im zoomorphischen Zusammenhang offenkundig schwierig und bereits kritisch markiert. „Wildstier“ folgt der wahrscheinlichen tierischen Lesart hinter der verderbten Überlieferung; die Abweichung wird in der Fußnote offengelegt.
- source_word: አርዌ ዐቢየ
  choice: ein großes Tier
  rationale: Die Formulierung bewahrt den allgemeinen Tierbegriff und den erhabenen visionären Ton.
- source_word: አቅርንት፡ ጸሊም፡ ዐቢይ፡ ዲበ፡ ርእሱ
  choice: große schwarze Hörner auf dem Kopf
  rationale: Der in der vollständigen Editionszeile belegte Fortgang vervollständigt das Bild und wird direkt wiedergegeben.
theological_decisions:
- issue: Umgang mit dem zweimaligen, textkritisch schwierigen ነገር in einer durchgehend zoomorphischen Vision
  choice: Im Haupttext „Wildstier“ als wahrscheinliche Wiederherstellung des tierischen Sinnes
  alternative: 'Wörtlich nach dem erhaltenen Ge''ez: „Wort“ oder „Sache“'
  rationale: Die ge'ezische Lesart unterbricht den konsequenten Tiercode und ist in der Edition mit einem Obelus als verdächtig gekennzeichnet. Die Hauptlesart stellt den wahrscheinlich gemeinten Tierbegriff her, während die Fußnote die echte textliche Unsicherheit ausdrücklich bewahrt und keine christologische Deutung des Wortes einträgt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Satzstruktur hält den Ablauf der visionären Verwandlungen sichtbar; die textkritische Rekonstruktion wird nicht verschwiegen.
