base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/017.yaml
  text: And I saw until that man[a], who was writing a book by the word of the Lord, opened that book of destruction which those twelve shepherds had wrought[e][d][c][b], and he showed before the Lord of the sheep that they had destroyed much more than those before them.
translation:
  language: de
  text: Und ich sah, bis jener Mann, der auf das Wort des Herrn hin ein Buch schrieb, jenes Buch der Zerstörung öffnete, die jene zwölf Hirten angerichtet hatten, und er zeigte vor dem Herrn der Schafe, dass sie weitaus mehr zerstört hatten als ihre Vorgänger.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „als die vor ihnen“. Gemeint sind wahrscheinlich die Hirten, die ihnen vorausgingen. Die schwierige Wendung wurde auch als Hinweis darauf verstanden, dass die zwölf Hirten das ihnen gesetzte Maß überschritten.'
    reason: textual_variant
lexical_decisions:
- source_word: ወርኢክዎ … እስከ
  choice: Und ich sah, bis
  rationale: Bewahrt die wiederkehrende Visionsformel und gibt እስከ entsprechend mit „bis“ wieder.
- source_word: ብእሲ
  choice: jener Mann
  rationale: Das Wort bezeichnet einen Mann beziehungsweise Menschen; die Wiedergabe vermeidet eine nicht ausdrücklich genannte Identifizierung als Engel.
- source_word: ዘይጽሕፍ መጽሐፈ
  choice: der … ein Buch schrieb
  rationale: Erhält das konkrete Bild des Schreibenden und lässt den Aspekt offen, soweit dies im Deutschen natürlich möglich ist.
- source_word: በቃለ እግዚአ
  choice: auf das Wort des Herrn hin
  rationale: Drückt aus, dass das Schreiben durch das Wort des Herrn veranlasst oder autorisiert ist, ohne eine bestimmte Art der Vermittlung festzulegen.
- source_word: ፈትሖ ለውእቱ መጽሐፈ
  choice: jenes Buch … öffnete
  rationale: „Öffnete“ ist die direkte Bedeutung; „entsiegelte“ würde ein im Ausgangstext nicht ausdrücklich genanntes Siegel hinzufügen.
- source_word: መጽሐፈ ሐጕል
  choice: Buch der Vernichtung
  rationale: Gibt den Gedanken von Zerstörung oder Verderben wieder und passt zum gerichtlichen Zusammenhang.
- source_word: ዘአሕጐሉ እልኩ ፲ወ፪የአቱ ይኃርያን
  choice: die jene zwölf Hirten angerichtet hatten
  rationale: Bezieht den Relativsatz idiomatisch auf die Vernichtung, die von den zwölf Hirten verursacht wurde, statt missverständlich zu sagen, sie hätten das Buch vernichtet.
- source_word: አርአዩ
  choice: er zeigte
  rationale: Der Singular knüpft an den schreibenden Mann an und bewahrt den vorführenden, gerichtlichen Charakter.
- source_word: ፈድፋደ እምቅድሜሆሙ
  choice: weit mehr … als ihre Vorgänger
  rationale: እምቅድሜሆሙ bedeutet wörtlich „als die vor ihnen“; „ihre Vorgänger“ gibt den Vergleich natürlich wieder, ohne einen nicht ausdrücklich genannten Auftrag einzufügen.
- source_word: ቅድመ እግዚአ አባግዕ
  choice: vor dem Herrn der Schafe
  rationale: Bewahrt den charakteristischen Gottes-Titel innerhalb der Tierbildwelt der Vision.
theological_decisions:
- issue: Identität des Mannes, der das Buch schreibt
  choice: „jener Mann“ ohne nähere Identifizierung
  alternative: „jener Engel“ oder „jener Schreiberengel“
  rationale: Der ge’ezische Text sagt „Mann“. Eine genauere Bestimmung würde die Vision über den Wortlaut hinaus auslegen.
- issue: Gegenstand des Vergleichs im Schlusssatz
  choice: Die zwölf Hirten vernichteten mehr als ihre Vorgänger.
  alternative: Sie überschritten das ihnen gesetzte Maß oder vernichteten mehr als befohlen.
  rationale: Der unmittelbare Wortlaut von እምቅድሜሆሙ weist auf „die vor ihnen“ und damit auf Vorgänger. Die alternative Deutung aus dem weiteren Kontext wird nicht in den Haupttext eingetragen.
- issue: Titel „Herr der Schafe“
  choice: Bildtitel wörtlich beibehalten
  alternative: durch „Gott“ oder „der Herr“ ersetzen
  rationale: Die wörtliche Wiedergabe erhält die symbolische Welt der Tierapokalypse und vermeidet eine glättende Auflösung des Bildes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederkehrende Visionsformel bleibt erkennbar; ungewöhnliche Bildtitel werden nicht verallgemeinert. Die Syntax ist gegenüber dem Ge’ez behutsam geglättet, ohne die Identität der Gestalt oder die schwierige Schlusswendung dogmatisch festzulegen.
