base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/007.yaml
  text: And they cried out to them[a], but they did not heed their words; rather, they were exceedingly deaf[c][b], and their eyes were exceedingly blinded.
translation:
  language: de
  text: Und sie riefen ihnen laut zu[a], doch jene achteten nicht auf ihre Worte. Vielmehr waren sie überaus taub[b], und ihre Augen waren überaus geblendet[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die äthiopischen Formen bedeuten hier: „sie riefen ihnen zu“ und „ihre Worte“. Eine ältere Wiedergabe verstand sie als „ich rief über sie“ und „meine Worte“.'
    reason: previous_rendering
  - marker: b
    text: Das mit „überaus“ wiedergegebene Verstärkungswort steht sowohl bei der Taubheit als auch bei der Blendung der Augen und betont die äußerste Unempfänglichkeit.
    reason: lexical_alternative
  - marker: c
    text: Taubheit und geblendete Augen haben in der Vision wahrscheinlich auch moralisch-geistliche Bedeutung; die Übersetzung bewahrt jedoch die konkrete Sinnesmetaphorik des äthiopischen Textes.
    reason: cultural_note
lexical_decisions:
- source_word: ወአስርኅዎሙ
  choice: Und sie riefen ihnen laut zu
  rationale: Die Verbform hat ein Subjekt in der 3. Person Plural und ein Objektssuffix in der 3. Person Plural. „Laut zurufen“ gibt den kräftigen Ruf natürlich wieder.
- source_word: ወኢያጽምኡ፡ ነገሮሙ
  choice: doch jene achteten nicht auf ihre Worte
  rationale: Die Wendung bezeichnet hier nicht bloß fehlendes akustisches Hören, sondern ein Nichtbeachten. „Ihre Worte“ bewahrt das Suffix der 3. Person Plural.
- source_word: ፈድፋደ
  choice: überaus
  rationale: Das Intensivierungsadverb steht zweimal. Die Wiederholung wird beibehalten, um den Nachdruck des äthiopischen Textes zu wahren.
- source_word: ተጸመሙ
  choice: waren taub
  rationale: Die konkrete Sinnesmetaphorik wird bewahrt, ohne sie ausdrücklich als geistliche Verstockung auszudeuten.
- source_word: ተጸለሉ፡ አዕይንቲሆሙ
  choice: ihre Augen waren geblendet
  rationale: Die Form beschreibt eine Verdunkelung beziehungsweise den Verlust der Sehfähigkeit. „Geblendet“ erhält das starke visionäre Bild und lässt offen, wodurch dieser Zustand verursacht wurde.
- source_word: ተወንየሉ
  choice: vielmehr
  rationale: 'Der Ausdruck leitet eine steigernde, adversative Fortführung ein: Sie beachteten die Worte nicht, vielmehr waren sie völlig unempfänglich.'
theological_decisions:
- issue: Körperliche Sinnesunfähigkeit oder moralisch-geistliche Unempfänglichkeit
  choice: Die Übersetzung bewahrt die konkreten Bilder von Taubheit und geblendeten Augen.
  alternative: Sie hörten nicht auf sie, weil sie geistlich verstockt waren.
  rationale: Im visionären Zusammenhang kann die Sinnesunfähigkeit moralisch-geistliche Bedeutung tragen. Der Text wird jedoch nicht durch eine ausdrücklich deutende Paraphrase vereindeutigt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem visionärem Ton. Die Wiederholung von „überaus“ ist bewusst quellennah; „jene“ verdeutlicht den Wechsel von den Rufenden zu den Angesprochenen.
