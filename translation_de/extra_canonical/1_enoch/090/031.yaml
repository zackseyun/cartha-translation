base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/031.yaml
  text: And after that[a], those three clothed in white who had taken me by the hand, who had brought me up before, and the hand of that ram holding me[c][b], brought me up and set me down in the midst of those sheep before the judgment took place.
translation:
  language: de
  text: Und danach brachten jene drei, die weiß gekleidet waren und mich bei der Hand genommen hatten – sie hatten mich schon zuvor hinaufgebracht[a] –, und die Hand jenes Widders[b], die mich festhielt, mich hinauf und setzten mich mitten unter jene Schafe[c], ehe das Gericht stattfand.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die eingeklammerte Wendung ist textlich schwierig; gemeint ist offenbar, dass dieselben Gestalten Henoch bereits zuvor hinaufgebracht hatten.
    reason: textual_variant
  - marker: b
    text: Die Lesung „Widder“ beruht auf einer Korrektur der an dieser Stelle fehlerhaften Textgestalt. Der Widder gehört zur Tiersymbolik dieser Vision.
    reason: textual_variant
  - marker: c
    text: Die „Schafe“ gehören zur Bildsprache der Tierapokalypse, in der Menschengruppen als Tiere dargestellt werden.
    reason: cultural_note
lexical_decisions:
- source_word: ወእምኔሁ
  choice: Und danach
  rationale: Die Wendung wird temporal verstanden; sie leitet den nächsten Vorgang der Vision ein und bedeutet nicht „von ihnen“.
- source_word: እልኩ ፫እለ ይለብሱ ጸዓዳወ
  choice: jene drei, die weiß gekleidet waren
  rationale: Die drei Gestalten werden nicht ausdrücklich als Menschen oder Engel bezeichnet. Die Übersetzung wahrt diese Offenheit und erhält das Bild ihrer weißen Kleidung.
- source_word: አኃዙኒ በእዴየ
  choice: mich bei der Hand genommen hatten
  rationale: Die deutsche Wendung gibt die persönliche Führung natürlich wieder, ohne dem Verb die härtere Bedeutung „packen“ aufzuzwingen.
- source_word: እለ ቀደሙ አዕረጉኒ
  choice: sie hatten mich schon zuvor hinaufgebracht
  rationale: ቀደሙ bezeichnet hier das frühere Geschehen; das wiederholte Aufsteigen beziehungsweise Hinaufbringen bleibt ausdrücklich erhalten.
- source_word: እዴሁ ለውእቱ ዴቤላ እንዘ ትእኅዘኒ
  choice: die Hand jenes Widders, die mich festhielt
  rationale: Die Lesart „Widder“ berücksichtigt die erkannte Textkorrektur des fehlerhaft überlieferten beziehungsweise erfassten ይቤላ und bewahrt die zentrale Tiersymbolik. Die auffällige Konstruktion mit „Hand“ wird nicht geglättet oder allegorisch erklärt.
- source_word: አዕረጉኒ ወአንበሩኒ
  choice: brachten … mich hinauf und setzten mich
  rationale: 'Beide Hauptverben werden wiedergegeben: das Hinaufbringen und das anschließende Platzieren.'
- source_word: ማእከሎሙ ለዝኩ አባግዕት
  choice: mitten unter jene Schafe
  rationale: Die räumliche Aussage und die Bildsprache der Tierapokalypse bleiben erhalten.
- source_word: እንበለ ትኩን ኵነኔ
  choice: ehe das Gericht stattfand
  rationale: Die Formulierung gibt den zeitlichen Bezug auf das noch bevorstehende Gericht wieder, ohne die Szene dogmatisch näher festzulegen.
theological_decisions:
- issue: Identität der drei weiß gekleideten Gestalten
  choice: Nur als „jene drei“ bezeichnen
  alternative: „drei Engel“ oder „drei Männer“
  rationale: Der vorliegende ge’ezische Wortlaut bestimmt ihre Wesensart nicht ausdrücklich. Daher wird keine Identifizierung hinzugefügt.
- issue: Identität der einzelnen Tiergestalt
  choice: „jener Widder“
  alternative: „jener eine“ beziehungsweise „jene Gestalt“
  rationale: Die textkritisch begründete Lesart „Widder“ passt zum unmittelbaren Symbolzusammenhang der Tierapokalypse und bewahrt ein inhaltlich wichtiges Bildelement.
- issue: Zeitliche Aussage der Schlussklausel
  choice: „ehe das Gericht stattfand“
  alternative: „bis das Gericht kam“ oder „bevor Gericht war“
  rationale: Die gewählte Fassung stellt das Gericht als noch bevorstehendes Ereignis dar, ohne eine besondere Lehre über dessen Art oder Ablauf einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Verbindung der drei Gestalten mit der festhaltenden „Hand jenes Widders“ bleibt wegen der schwierigen Quellensyntax sichtbar; Gedankenstriche entlasten den langen Satz, ohne seine Mehrdeutigkeit aufzulösen.
