base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/002.yaml
  text: And after that I saw in my vision all the birds of heaven coming—eagles[a], vultures, kites, and ravens—and the eagles led all the birds. And they began to devour those sheep[c][b], and to peck out their eyes and devour their flesh.
translation:
  language: de
  text: 'Und danach sah ich in meiner Vision alle Vögel des Himmels kommen: Adler, Geier, Milane und Raben[a]. Die Adler führten alle Vögel an. Und sie begannen, jene Schafe zu verschlingen[b], ihnen die Augen auszupicken und ihr Fleisch zu verschlingen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue zoologische Bestimmung einiger Vogelnamen ist unsicher; statt „Milane“ beziehungsweise „Raben“ sind auch Wiedergaben wie „Habichte“ beziehungsweise „Krähen“ möglich.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Und sie ergriffen jene Schafe und fraßen sie.“ Die Verbfolge kann entweder den Beginn des Fressens oder ein Ergreifen mit anschließendem Fressen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ በራእየየ
  choice: sah ich in meiner Vision
  rationale: Bewahrt den visionären Bericht in der ersten Person und gibt das Possessiv natürlich und ausdrücklich wieder.
- source_word: ኵሉ አዕዋፈ ሰማይ
  choice: alle Vögel des Himmels
  rationale: Entspricht der gehobenen apokalyptischen Ausdrucksweise und bleibt im modernen Deutsch verständlich.
- source_word: አንስርት
  choice: Adler
  rationale: Der äthiopische Ausdruck bezeichnet in biblischem Sprachgebrauch gewöhnlich Adler, kann aber allgemeiner große Greifvögel umfassen.
- source_word: አውስት
  choice: Geier
  rationale: Passt im Katalog der Raub- und Aasvögel am besten zur gewaltsamen Bildwelt.
- source_word: ሆባይ
  choice: Milane
  rationale: Bezeichnet wahrscheinlich eine kleinere Greifvogelart; die genaue zoologische Zuordnung bleibt unsicher.
- source_word: ቋዓት
  choice: Raben
  rationale: Eine passende, würdige Wiedergabe für den Rabenvogel; auch Krähen wäre möglich.
- source_word: ወአንስርት ይመረሕዎሙ ለኵሎሙ አዕዋፍ
  choice: Die Adler führten alle Vögel an
  rationale: Versteht das zweite Vorkommen von ‚Adler‘ als ausdrückliches Subjekt des Verbs und nicht als fünften Eintrag der Aufzählung.
- source_word: አኃዙ ይብልዕዎሙ
  choice: sie begannen ... zu verschlingen
  rationale: Gibt die wahrscheinlich inchoative Konstruktion wieder; alternativ lässt sich die Folge als Ergreifen und Fressen auffassen.
- source_word: ዝኩ አባግዕ
  choice: jene Schafe
  rationale: Verweist auf die bereits zuvor in der Vision genannten Schafe.
- source_word: ይክረዩ አዕይንቲሆሙ
  choice: ihnen die Augen auszuhacken
  rationale: Bewahrt durch das vogeltypische Verb die konkrete und brutale Bildlichkeit.
- source_word: ይበልዕዎሙ ለሥጋሆሙ
  choice: ihr Fleisch zu fressen
  rationale: Gibt den körperlich-konkreten Sinn klar wieder, ohne die unmittelbar vorausgehende Formulierung stilistisch unnötig zu verdoppeln.
theological_decisions:
- issue: Symbolik der Tierapokalypse
  choice: Die Tierbilder werden im Vers wörtlich als Vögel und Schafe wiedergegeben.
  alternative: Die Tiere im Haupttext ausdrücklich mit geschichtlichen Völkern oder Herrschern identifizieren.
  rationale: Die Übersetzung soll die allegorische Bildwelt und ihre Deutungsoffenheit erhalten, statt eine historische oder konfessionelle Auslegung in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer apokalyptischer Bildsprache. Die Satzgliederung macht deutlich, dass die Adler die übrigen Vögel anführen. Alle Fußnotenmarker erscheinen im Haupttext.
