base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/024.yaml
  text: And judgment took place first upon the stars[a], and they were judged and were found to be sinners, and they went to the place of judgment; and they cast them into an abyss, full of fire and flaming[c][b], and full of pillars of fire.
translation:
  language: de
  text: Und zuerst erging das Gericht über die Sterne[a]. Sie wurden gerichtet und als Sünder befunden. Dann gingen sie an den Ort des Gerichts, und man warf sie in einen Abgrund, voll von Feuer und Flammen und voll von Feuersäulen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und das Gericht fand vor den Sternen statt.« Das zugrunde liegende Ge’ez kann formal auch räumlich beziehungsweise im Sinn von »in Gegenwart der Sterne« verstanden werden; der Zusammenhang legt jedoch nahe, dass zuerst über die als Sterne dargestellten himmlischen Wesen Gericht gehalten wird.'
    reason: lexical_alternative
  - marker: b
    text: Die wiederholten Ausdrücke »Gericht«, »gerichtet« und »Ort des Gerichts« entsprechen der Wiederholung desselben Wortfeldes im Ge’ez und wurden nicht stilistisch geglättet.
    reason: cultural_note
lexical_decisions:
- source_word: ኵነኔ
  choice: Gericht
  rationale: Bewahrt den wiederholten forensischen und endzeitlichen Sinn, ohne den Vorgang vorschnell auf das Ergebnis »Verdammnis« zu verengen.
- source_word: ቅድመ እምከዋክብት
  choice: zuerst … über die Sterne
  rationale: Im erzählerischen Ablauf bezeichnet ቅድመ wahrscheinlich die zeitliche Reihenfolge, während die Sterne die zuerst Gerichteten sind. Die formal mögliche Lesart »vor den Sternen« bleibt in der Fußnote erhalten.
- source_word: ተኰነኑ
  choice: sie wurden gerichtet
  rationale: Nimmt die Wiederholung des Gerichtswortfeldes auf; der anschließende Satzteil nennt gesondert den Schuldbefund.
- source_word: ኃጥኣነ
  choice: als Sünder befunden
  rationale: Gibt sowohl den moralisch-religiösen Gehalt von »Sünder« als auch die prädikative Feststellung im Gericht wieder.
- source_word: ሖሩ መካነ ኵነኔ
  choice: sie gingen an den Ort des Gerichts
  rationale: Erhält die konkrete Bewegung und die Wiederholung des Gerichtsbegriffs.
- source_word: ወደይዎሙ
  choice: man warf sie
  rationale: Das unbestimmte deutsche »man« wahrt das nicht ausdrücklich benannte Subjekt, statt die Sterne selbst zu den Werfenden zu machen.
- source_word: ውስተ ዕሙቅ
  choice: in einen Abgrund
  rationale: Gibt das Bild einer tiefen Strafstätte wieder, ohne einen späteren dogmatischen Fachbegriff einzutragen.
- source_word: ምሉእ እሳት ወይላህብ
  choice: voll von Feuer und Flammen
  rationale: Natürliches, würdevolles Deutsch, das die gehäufte Feuerbildlichkeit bewahrt.
- source_word: አዕማደ እሳት
  choice: Feuersäulen
  rationale: Bewahrt die anschauliche visionäre Architektur der Vorlage knapp und verständlich.
theological_decisions:
- issue: Gerichtsvorgang oder bereits feststehende Verurteilung
  choice: »Gericht«, »wurden gerichtet« und danach »als Sünder befunden«
  alternative: »Verdammung« und »wurden verdammt«
  rationale: Die Vorlage wiederholt den Gerichtsstamm und nennt den sündigen Status anschließend gesondert. So bleiben Verfahren und Befund unterscheidbar.
- issue: Deutung von ቅድመ እምከዋክብት
  choice: »zuerst … über die Sterne« als Abfolge und Ziel des Gerichts
  alternative: »vor den Sternen« beziehungsweise »in Gegenwart der Sterne«
  rationale: Der Kontext der folgenden Gerichtsgruppen stützt die sequenzielle Lesart; die sprachlich mögliche räumlich-juridische Alternative wird jedoch nicht verschwiegen.
- issue: Bezeichnung des Strafortes
  choice: Konkrete Bilder von Abgrund, Feuer, Flammen und Feuersäulen
  alternative: »Hölle« oder »Höllenfeuer«
  rationale: Die apokalyptische Bildsprache wird beibehalten, ohne eine spätere systematisch-theologische Benennung einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer apokalyptischer Bildsprache. Kurze Sätze lösen die lange parataktische Quellstruktur behutsam auf. Das unbestimmte Subjekt bei »man warf sie« vermeidet die irreführende Aussage, die verurteilten Sterne hätten sich selbst in den Abgrund geworfen.
