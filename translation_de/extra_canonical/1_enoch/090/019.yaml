base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/019.yaml
  text: And I saw until a great sword was given to the sheep[a], and the sheep went out against all the beasts of the field to kill them; and all the beasts and the birds of heaven fled from before their face.
translation:
  language: de
  text: Und ich sah, bis den Schafen ein großes Schwert gegeben wurde. Da zogen die Schafe gegen alle Tiere des Feldes aus, um sie zu töten; und alle Tiere und die Vögel des Himmels flohen vor ihnen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher lautet die Wendung: „flohen weg vor ihrem Angesicht“. Gemeint ist, dass sie vor den Schafen flohen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ
  choice: ich sah
  rationale: Gibt die übliche visionäre Erzählformel klar und ohne altertümelnde Färbung wieder.
- source_word: እስከ ተውህበ
  choice: bis ... gegeben wurde
  rationale: Bewahrt den zeitlichen Fortgang der Vision bis zu dem entscheidenden Ereignis, statt die Formulierung zu einem bloßen Präteritum zu glätten.
- source_word: ለአባግዕ
  choice: den Schafen
  rationale: Der deutsche Dativ entspricht der Zuwendung des Schwertes an die Schafe; die symbolische Tierbezeichnung bleibt unaufgelöst.
- source_word: ሰይፍ ዐቢይ
  choice: ein großes Schwert
  rationale: Bewahrt die Größe und symbolische Wucht des Bildes, ohne einseitig nur körperliche Größe oder Macht festzulegen.
- source_word: ወወፅኡ አባግዕ
  choice: Da zogen die Schafe ... aus
  rationale: „Ausziehen“ bezeichnet im Deutschen natürlich das Vorrücken zum Kampf; „Da“ verbindet die Handlung flüssig mit der Übergabe des Schwertes.
- source_word: ዲበ ኵሉ አራዊተ ገዳም
  choice: gegen alle Tiere des Feldes
  rationale: Gibt die feindliche Ausrichtung wieder und erhält zugleich die Tierbildwelt der Vision; „Tiere des Feldes“ entspricht der konkreten Quellformulierung.
- source_word: ከመ ይቅትልዎሙ
  choice: um sie zu töten
  rationale: Drückt den Zweck unmittelbar und in gegenwärtigem Standarddeutsch aus, ohne die Gewalt der Szene abzuschwächen.
- source_word: አዕዋፈ ሰማይ
  choice: die Vögel des Himmels
  rationale: Erhält den gehobenen visionären Ton und die räumliche Gegenüberstellung von Feld und Himmel.
- source_word: ነፍጹ እምቅድመ ገጾሙ
  choice: flohen vor ihnen
  rationale: Gibt die semitisch geprägte Wendung natürlich auf Deutsch wieder; die wörtlichere Bildgestalt wird in der Fußnote dokumentiert.
theological_decisions:
- issue: Deutung der Tiersymbolik im Haupttext
  choice: „Schafe“, „Tiere“ und „Vögel“ bleiben als visionäre Symbole stehen.
  alternative: Die Bilder deutend durch Israel, feindliche Völker und verbündete Mächte ersetzen.
  rationale: Die Tierapokalypse spricht durch eine fortlaufende symbolische Bildwelt. Eine Übersetzung soll diese nicht durch eine bestimmte historische oder theologische Auslegung ersetzen.
- issue: Bedeutung des „großen“ Schwertes
  choice: Die Formulierung bleibt offen zwischen außergewöhnlicher Größe und besonderer Macht.
  alternative: Mit „mächtiges Schwert“ die Bedeutung ausdrücklich auf Wirksamkeit oder Macht festlegen.
  rationale: Das zugrunde liegende Adjektiv erlaubt eine weitere Bedeutung; „groß“ wahrt diese Spannung und vermeidet eine unnötige Auslegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem apokalyptischem Ton. Die Tierbilder und die zeitliche Formel „ich sah, bis ...“ bleiben erhalten; schwer verständliche semitische Idiomatik wird im Haupttext natürlich wiedergegeben und in der Fußnote kenntlich gemacht.
