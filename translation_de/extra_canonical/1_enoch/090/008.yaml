base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/008.yaml
  text: And I saw in the vision that ravens flew down upon those lambs[b][a], and they seized one of those lambs and dashed the sheep to pieces and devoured them.
translation:
  language: de
  text: Und ich sah in der Vision, wie Raben auf jene Lämmer herabflogen[a][b]. Sie packten eines von jenen Lämmern, zerschmetterten die Schafe und fraßen sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Äthiopische verwendet für die angegriffenen Tiere Bezeichnungen, deren Bedeutungsbereiche sich überschneiden können. Hier steht zunächst „Lämmer“, später „Schafe“, um den Wechsel im Wortlaut sichtbar zu machen.
    reason: lexical_alternative
  - marker: b
    text: Das mit „herabflogen“ wiedergegebene Verb kann allgemeiner auch als „auf sie losstürmten“ oder „über sie herfielen“ verstanden werden; der Zusammenhang mit den Raben legt eine Bewegung im Flug nahe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ፡ በራእይ
  choice: Und ich sah in der Vision
  rationale: Bewahrt die übliche Ich-Formel des Visionsberichts und kennzeichnet die fortlaufende visionäre Szene in natürlichem Deutsch.
- source_word: ቋዓተ
  choice: Raben
  rationale: Gibt die konkrete Vogelart der symbolischen Tierwelt wieder; „schwarze Vögel“ wäre unnötig allgemein, „Krähen“ eine mögliche, aber weniger passende Alternative.
- source_word: ከመ፡ ሰረሩ፡ ዲበ
  choice: wie … auf … herabflogen
  rationale: Drückt die feindliche Bewegung der Vögel von oben aus, ohne das Verb durch das stärker bildhafte „herabstürzten“ zu überzeichnen.
- source_word: እልክቱ፡ መዓስእ
  choice: jene Lämmer
  rationale: Erhält die im Vers erkennbare Bezeichnungsverschiebung gegenüber dem späteren Wort für „Schafe“.
- source_word: ወአኀዝዎ፡ ለአሐዱ፡ እምዝኩ፡ መዓስእ
  choice: Sie packten eines von jenen Lämmern
  rationale: Gibt sowohl das gewaltsame Ergreifen als auch die Auswahl eines einzelnen Tieres aus der Gruppe klar wieder.
- source_word: ወቀጥቀጥዎሙ፡ ለአባግዕ
  choice: schlugen die Schafe in Stücke
  rationale: Bewahrt die intensive, gewaltsame Aussage des reduplizierten Verbs und zugleich das ausdrücklich folgende Substantiv „Schafe“.
- source_word: ወበልዕዎሙ
  choice: und fraßen sie
  rationale: „Fraßen“ ist bei Raubvögeln natürlich, anschaulich und gibt den Pluralbezug des äthiopischen Ausdrucks wieder.
theological_decisions:
- issue: Deutung der Tiere in der Tierapokalypse
  choice: Die konkrete Bildsprache mit Raben, Lämmern und Schafen bleibt im Text stehen.
  alternative: Die Tiere unmittelbar als feindliche Völker oder Herrscher und Israel wiederzugeben.
  rationale: Die Übersetzung soll die symbolische Oberfläche der Vision bewahren und ihre geschichtliche oder theologische Auslegung nicht in den Haupttext eintragen.
- issue: Wechsel zwischen Lämmern und Schafen
  choice: Beide unterschiedlichen Herdenbezeichnungen werden wiedergegeben.
  alternative: Alle Bezeichnungen einheitlich mit „Schafe“ oder „Lämmer“ zu übersetzen.
  rationale: Die äthiopische Wortwahl wechselt innerhalb des Verses. Auch wenn sich die Bezüge überschneiden können, soll diese mögliche Differenz nicht stillschweigend eingeebnet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer apokalyptischer Bildsprache. Die Gewaltdarstellung bleibt deutlich, aber nicht unnötig ausgeschmückt. Der zweite Satz vermeidet eine schwerfällige Reihung, ohne die Abfolge der Handlungen zu verändern.
