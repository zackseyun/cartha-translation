  yaml_path: translation/extra_canonical/1_enoch/090/026.yaml
  text: And I saw at that time that a similar deep abyss was opened in the middle of the earth[a], full of fire; and they brought those blinded sheep, and all of them were judged and were found to be sinners, and they were cast into that deep abyss of fire, and they burned[f][e][d][c][b]. And this abyss came to be at the right side of that house.
translation:
  language: de
  text: Und ich sah zu jener Zeit, wie mitten in der Erde ein ähnlicher tiefer Abgrund[a] geöffnet wurde, voll Feuer. Man brachte jene geblendeten Schafe[b] herbei; sie alle wurden gerichtet und als Sünder befunden[c]. Sie wurden in jenen tiefen Feuerabgrund geworfen und verbrannten. Dieser Abgrund befand sich rechts von jenem Haus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine ähnliche tiefe Grube“. Das ge’ezische Wort bezeichnet eine große Tiefe; „Abgrund“ bewahrt den apokalyptischen Klang.'
    reason: lexical_alternative
  - marker: b
    text: Die „geblendeten Schafe“ gehören zur symbolischen Bildwelt der Tierapokalypse und bezeichnen in der Vision Menschen, nicht buchstäbliche Tiere. Auch die Übersetzung „blinde Schafe“ ist möglich.
    reason: cultural_note
  - marker: c
    text: 'Möglich ist eine stärker wörtliche Wiedergabe: „sie wurden gerichtet und wurden zu Sündern“. Im gerichtlichen Zusammenhang ist wahrscheinlich gemeint, dass sie als Sünder beziehungsweise schuldig befunden wurden.'
    reason: alternative_reading
lexical_decisions:
- source_word: ተርኅወ
  choice: geöffnet wurde
  rationale: Bewahrt die Passivform und die visionäre Vorstellung, dass sich der Abgrund durch ein nicht genanntes Handeln öffnet.
- source_word: ማዕምቅ
  choice: tiefer Abgrund
  rationale: „Abgrund“ erhält die apokalyptische Bildkraft; „tief“ gibt die im Ausdruck liegende Intensivierung wieder.
- source_word: ምሉዕ እሳተ
  choice: voll Feuer
  rationale: Nahe und konkrete Wiedergabe des singularisch-kollektiven Ausdrucks.
- source_word: አምጽእዎሙ
  choice: Man brachte … herbei
  rationale: Gibt das Veranlassen des Kommens wieder und lässt die im Ausgangstext ungenannten Handelnden unbestimmt.
- source_word: እልኩ አባግዕ ጽዑላነ
  choice: jene geblendeten Schafe
  rationale: „Geblendet“ bewahrt die mögliche resultative Bedeutung und den Rückbezug auf die Bildwelt der Tierapokalypse.
- source_word: ተኰነኑ
  choice: wurden gerichtet
  rationale: Bewahrt den gerichtlichen Sinn, ohne das Urteil vor der folgenden Aussage vorwegzunehmen.
- source_word: ወኮኑ ኃጥኣነ
  choice: als Sünder befunden
  rationale: Gibt die deklarative Bedeutung in der gerichtlichen Abfolge natürlich wieder und vermeidet den Eindruck, das Gericht habe sie erst zu Sündern gemacht.
- source_word: ተወድዩ
  choice: wurden … geworfen
  rationale: Bewahrt Passiv und gerichtlichen Ernst in idiomatischem modernem Deutsch.
- source_word: ውዕዩ
  choice: verbrannten
  rationale: Entspricht der knappen aktiven Form und lässt offen, ob bloßes Brennen oder Vernichtung gemeint ist.
- source_word: ዝንቱ … በየማኑ ለዝኩ ቤት
  choice: Dieser Abgrund befand sich rechts von jenem Haus
  rationale: Erhält den Gegensatz zwischen dem nahen Demonstrativ „dieser“ und dem fernen „jenem“ sowie die konkrete räumliche Beziehung.
theological_decisions:
- issue: Bedeutung der Blindheit der Schafe innerhalb der Allegorie
  choice: jene geblendeten Schafe
  alternative: jene blinden Schafe
  rationale: Die partizipiale Wiedergabe lässt eine zuvor bewirkte Blindheit anklingen, ohne deren moralische oder gerichtliche Ursache ausdrücklich festzulegen.
- issue: Gerichtliche Folge „wurden gerichtet und wurden/sind Sünder“
  choice: wurden gerichtet und als Sünder befunden
  alternative: wurden gerichtet und wurden zu Sündern
  rationale: Im gerichtlichen Zusammenhang ist eine feststellende Bedeutung wahrscheinlich. Die beiden Aussagen bleiben dennoch als Abfolge erhalten, statt zu „als Sünder verurteilt“ zusammengezogen zu werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer visionärer Erzählweise. Die Wiederholungen und die gerichtliche Abfolge des ge’ezischen Textes bleiben erkennbar; unnatürliche Häufungen von „und“ werden behutsam gegliedert.
