base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/090/012.yaml
  text: And those ravens fought and battled with him[a], and they wanted to remove his horn[c][b], but they did not prevail against him.
translation:
  language: de
  text: Und jene Raben kämpften und stritten mit ihm[a]. Sie wollten sein Horn[b] entfernen[c], doch sie konnten ihn nicht überwältigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gegen ihn“. Die Präposition bedeutet wörtlich „mit“, bezeichnet hier im Zusammenhang aber eine feindliche Auseinandersetzung.'
    reason: lexical_alternative
  - marker: b
    text: Das „Horn“ wird als Bestandteil der symbolischen Bildwelt der Vision wörtlich wiedergegeben und nicht als „Macht“ oder „Stärke“ gedeutet.
    reason: cultural_note
  - marker: c
    text: 'Oder: „wegnehmen“. Ältere Wiedergaben verstehen das Verb auch im Sinn von „niederwerfen“; hier bezeichnet es am ehesten das Entfernen des Horns.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እልኩ
  choice: jene Raben
  rationale: Die konkrete Vogelart der apokalyptischen Bildwelt bleibt erhalten; „Raben“ entspricht dem in diesem Zusammenhang üblichen Verständnis des Ausdrucks.
- source_word: ቋዓት፡ ይትጋደሉ፡ ወይትባአሱ
  choice: kämpften und stritten
  rationale: Die zwei Ausdrücke des Kampfes werden nicht zu einem einzigen Verb zusammengezogen, sondern als erzählerische Verstärkung wiedergegeben.
- source_word: ምስሌሁ
  choice: mit ihm
  rationale: Die Präposition bedeutet wörtlich „mit“; der feindliche Sinn ergibt sich aus den Kampfverben. Die mögliche Wiedergabe „gegen ihn“ wird in einer Fußnote genannt.
- source_word: ፈቀዱ
  choice: sie wollten
  rationale: Die Form bezeichnet Willen oder Absicht; die moderne Formulierung übersteigert den Grad der Entschlossenheit nicht.
- source_word: ያእትቱ
  choice: entfernen
  rationale: Das Verb bezeichnet hier das Entfernen oder Wegnehmen und wird konkreter wiedergegeben als durch eine freie Wendung wie „niederwerfen“.
- source_word: ቀርኖ
  choice: sein Horn
  rationale: Das Horn bleibt als konkretes Element der Vision stehen und wird nicht deutend durch „Macht“ oder „Stärke“ ersetzt.
- source_word: አእህሉዎ
  choice: sie konnten ihn nicht überwältigen
  rationale: Die Wendung bringt das Scheitern des Angriffs in natürlichem Deutsch zum Ausdruck, ohne den Ausgang symbolisch auszudeuten.
theological_decisions:
- issue: Symbolische Deutung des Horns im Haupttext
  choice: Die wörtliche Bildsprache „sein Horn“ bleibt erhalten.
  alternative: seine Stärke; seine Macht; seine Herrschaft
  rationale: Die Tierapokalypse entfaltet ihre Aussage durch eine fortlaufende symbolische Bildwelt. Eine Auflösung des Symbols im Haupttext würde mehr festlegen, als der Wortlaut selbst sagt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die verdoppelten Kampfverben und die apokalyptische Horn-Bildsprache bleiben erhalten; Mehrdeutigkeiten werden in Fußnoten offengelegt.
