base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/007.yaml
  text: 'And from there I went to another place[a], more terrible than this, and I saw a fearful work: a great fire was there, burning and blazing, and the place had a cleft reaching to the abyss, full of great pillars of fire descending; neither its measure nor its size was I able to see[c][b], and I was not able to look at it.'
translation:
  language: de
  text: 'Und von dort ging ich an einen anderen Ort, schrecklicher als dieser, und ich sah ein furchterregendes Werk: Dort war ein großes Feuer, das brannte und loderte; der Ort hatte eine Kluft, die bis zum Abgrund reichte[a], und war voll großer Feuersäulen, die hinabstiegen[c]. Weder sein Maß noch seine Größe vermochte ich zu erkennen[b], und ich konnte ihn nicht ansehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Aussage über die Kluft des Ortes ist im Ge’ez schwer zu deuten. Möglich ist auch: „Der Ort war bis in die äußerste Tiefe gespalten.“'
    reason: textual_variant
  - marker: b
    text: 'Oder: „Ich konnte sein Ausmaß und seine Größe nicht erfassen.“ Gemeint ist Henochs Unfähigkeit, die Dimensionen des Geschauten zu begreifen.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „und große Feuersäulen stiegen darin hinab“.'
    reason: previous_rendering
lexical_decisions:
- source_word: ወእምህየ፡ ሖርኩ፡ ካልአ፡ መካነ
  choice: Und von dort ging ich an einen anderen Ort
  rationale: Gibt die fortlaufende Bewegung innerhalb der Vision schlicht und ohne zusätzliche Deutung wieder.
- source_word: እምዝ፡ ዘይገርም
  choice: schrecklicher als dieser
  rationale: Bewahrt den Vergleich mit dem zuvor gesehenen Ort und den furchteinflößenden Zusammenhang.
- source_word: ወርኢኩ፡ ግብረ፡ ግሩመ
  choice: und ich sah ein furchterregendes Werk
  rationale: „Werk“ erhält das konkrete Substantiv ግብር, während „furchterregend“ im heutigen Deutsch natürlicher ist als „furchtbar“ und die Wirkung des Geschauten ausdrückt.
- source_word: እሳት፡ ዐቢይ፡ በህየ፡ ዘይነድድ፡ ወያንበለብል
  choice: Dort war ein großes Feuer, das brannte und loderte
  rationale: Erhält sowohl die Größe als auch die beiden aktiven Feuerbeschreibungen in anschaulichem, modernem Deutsch.
- source_word: ወመምተርተ፡ ቦቱ፡ መካኑ፡ እስከ፡ ቀላይ
  choice: der Ort war bis zum Abgrund hin gespalten
  rationale: Gibt die schwierige Wendung vorsichtig als Spaltung oder Kluft wieder, die sich in äußerste Tiefe erstreckt.
- source_word: ፍጹም፡ አዕማደ፡ እሳት፡ ዐበይተ፡ ዘይወርዶሙ
  choice: voll großer Feuersäulen, die hinabstiegen
  rationale: „Voll“ wahrt die Fülle-Aussage von ፍጹም; „hinabstiegen“ erhält die vertikale Bewegung der großen Feuersäulen.
- source_word: ወኢእምጣኖ፡ ወኢዕበዮ፡ አክሀልኩ፡ ነጽሮ
  choice: Weder sein Maß noch seine Größe vermochte ich zu erkennen
  rationale: Bewahrt das parallele Wortpaar und betont Henochs Unfähigkeit, die Ausmaße des Geschauten zu erfassen.
- source_word: ወስእነኩ፡ [ነጽሮ፡] ዐይኖ
  choice: und ich konnte ihn nicht ansehen
  rationale: Die schlichte Formulierung trägt der textlichen Unsicherheit der Schlusswendung Rechnung, ohne den Grund der visuellen Unfähigkeit auszudeuten.
theological_decisions:
- issue: Art des geschauten Ortes
  choice: Als schrecklicher visionärer Ort mit Feuer und unergründlicher Tiefe beschrieben, ohne ihn lehrmäßig zu benennen
  alternative: Hölle, Unterwelt oder kosmisches Gefängnis
  rationale: Der Vers nennt den Ort nicht ausdrücklich. Die bildhafte Gerichtsszenerie bleibt daher bestehen, ohne sie mit einer späteren theologischen Kategorie gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptischer Bildkraft. Der Satzbau bleibt eng am Ge’ez, wird aber durch Doppelpunkt, Semikolon und Relativsätze für heutige Leser klar gegliedert. Unklare räumliche Bezüge und die instabile Schlusswendung werden nicht dogmatisch vereindeutigt.
