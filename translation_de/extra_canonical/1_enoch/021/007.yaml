  to: 'Und von dort ging ich an einen anderen Ort, schrecklicher als dieser, und ich sah ein furchterregendes Werk: Dort war ein großes Feuer, das brannte und loderte; der Ort hatte eine Kluft, die bis zum Abgrund reichte[a], und war voll großer Feuersäulen, die hinabstiegen[c]. Weder sein Maß noch seine Größe vermochte ich zu erkennen[b], und ich konnte ihn nicht ansehen.'
