base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/002.yaml
  text: 'And there I saw a fearful work: I saw neither the heavens above nor the firmly founded earth, but a place unformed and terrible.'
translation:
  language: de
  text: 'Und dort sah ich ein furchterregendes Werk: Ich sah weder die Himmel oben noch die fest gegründete Erde, sondern einen ungeformten und schrecklichen Ort.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ግብረ፡ ግሩመ
  choice: ein furchterregendes Werk
  rationale: ግብር bezeichnet ein Werk, Gebilde oder Geschehen; „Werk“ wahrt die konkrete, zugleich mehrdeutige Ausdrucksweise. ግሩም wird hier als Furcht erregend wiedergegeben.
- source_word: አሰማየ፡ ላዕለ
  choice: die Himmel oben
  rationale: Der Plural „die Himmel“ bildet die äthiopische Form ab; „oben“ entspricht der räumlichen Angabe, ohne „über mir“ in den Text einzutragen.
- source_word: ወአምድረ፡ ሱርርተ
  choice: noch die fest gegründete Erde
  rationale: Die Form beschreibt die Erde als gegründet beziehungsweise fest gegründet und steht im Kontrast zu dem ungeformten Ort.
- source_word: መካነ፡ ዘአኮ፡ ድልወ
  choice: einen ungeformten … Ort
  rationale: Die Wendung bezeichnet einen Ort, der nicht bereitet, geordnet oder gestaltet ist. „Ungeformt“ bewahrt diese Vorstellung knapp und vermeidet die weitergehende Deutung „chaotisch“.
- source_word: ግሩምም
  choice: und schrecklichen
  rationale: Die erneute Verwendung des Wortfelds des Schreckens wird im Deutschen natürlich wiedergegeben, ohne die Wiederholung semantisch aufzulösen.
theological_decisions:
- issue: Beschaffenheit des gesehenen Ortes
  choice: ungeformt
  alternative: chaotisch / nicht bereitet
  rationale: „Ungeformt“ lässt offen, ob eine kosmische Unordnung, fehlende Zurichtung oder mangelnde Gestaltung gemeint ist, und vermeidet eine unnötige kosmologische Festlegung.
- issue: Bezeichnung des ersten Schauobjekts
  choice: Werk
  alternative: Ding / Gebilde
  rationale: „Werk“ folgt der Grundbedeutung von ግብር und der geprüften englischen Konsultationsfassung, ohne festzulegen, wer es hervorgebracht hat.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht markierte Formulierung „die Himmel oben“ erhält den kosmischen Plural und die räumliche Gegenüberstellung des Ausgangstextes; unnötige Archaismen werden vermieden.
