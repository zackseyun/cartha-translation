base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/003.yaml
  text: And there I saw seven stars of heaven[a], bound together in it, like great mountains[c][b], and burning with fire.
translation:
  language: de
  text: Und dort sah ich sieben Sterne des Himmels, die darin zusammengebunden waren, wie große Berge, und im Feuer brannten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Sterne können hier sinnbildlich für himmlische Wesen unter dem Gericht stehen; der Text selbst nennt sie jedoch „Sterne“.
    reason: cross_reference
lexical_decisions:
- source_word: ርኢኩ
  choice: sah ich
  rationale: Bewahrt die schlichte visionäre Berichtsform in natürlichem modernem Deutsch.
- source_word: ሰብዐተ ከዋክብተ ሰማይ
  choice: sieben Sterne des Himmels
  rationale: Gibt die genitivische Wendung wieder und belässt die kosmische Bildsprache, ohne die Sterne im Haupttext als Engel zu deuten.
- source_word: እሱራነ
  choice: zusammengebunden
  rationale: Bezeichnet Gebundensein beziehungsweise Gefangensein; zusammen mit ኅቡረ wird die gemeinsame Fesselung ausgedrückt, ohne eine bestimmte Art von Ketten einzutragen.
- source_word: በላዕሌሁ
  choice: darin
  rationale: Folgt der kontextuell und durch die griechische Überlieferung gestützten räumlichen Bedeutung „in ihm/darin“ und vermeidet das irreführende Bild eines Schwebens darüber.
- source_word: ኅቡረ
  choice: zusammen
  rationale: Wird adverbial auf das Gebundensein bezogen, nicht als eigenständiges „versammelt“ wiedergegeben.
- source_word: ከመ አድባር ዐበይት
  choice: wie große Berge
  rationale: Erhält den auffälligen apokalyptischen Vergleich ohne erklärende Glättung.
- source_word: ወበእሳት እንዘ ይነዱ
  choice: und im Feuer brannten
  rationale: Gibt die fortdauernde, anschauliche Feuerhandlung in idiomatischem Deutsch wieder.
theological_decisions:
- issue: Identität der sieben Sterne
  choice: Im Haupttext bleiben sie „Sterne des Himmels“.
  alternative: Sie ausdrücklich als Engel oder himmlische Wesen bezeichnen.
  rationale: Obwohl Sterne in henochischer Bildsprache himmlische Wesen unter Gericht darstellen können, nennt der vorliegende Text sie Sterne. Die mögliche symbolische Bedeutung wird nicht in den Wortlaut eingetragen.
- issue: Räumliche Beziehung der gefesselten Sterne zum zuvor beschriebenen Ort
  choice: „darin“
  alternative: „darüber“ oder „auf ihm“
  rationale: Der unmittelbare Kontext und die zugrunde liegende Überlieferung sprechen für eine Bindung innerhalb des chaotischen Ortes. Die alternative räumliche Deutung bleibt philologisch möglich, ist hier aber weniger wahrscheinlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt bildkräftig und quellennah; der schwierige Ausdruck ኅቡረ wird adverbial mit „zusammengebunden“ wiedergegeben. Der einzige Fußnotenmarker [a] steht im Haupttext.
