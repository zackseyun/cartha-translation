  naturalness: Die Auslassung in »und nach wem erkundigst du dich und suchst?« ist im Deutschen syntaktisch und rhythmisch holprig, weil »dich« unmittelbar neben »suchst« steht und die dritte Tätigkeit nicht klar als eigene Frage erkennbar ist. Die Wiederholung von »nach wem« ist hier natürlich und bewahrt die nachdrückliche Reihung.
  terminology: »Uriel«, »Henoch« und »heilige Engel« sind im modernen Standarddeutsch angemessen und registergerecht. »führte« ist eine idiomatische, quellennahe Wiedergabe.
