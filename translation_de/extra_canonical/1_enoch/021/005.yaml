base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/005.yaml
  text: And Uriel[a], one of the holy angels who was with me and was guiding me, said to me, “Enoch, about whom are you asking[b], and about whom are you inquiring and searching?”
translation:
  language: de
  text: 'Und Uriel, einer der heiligen Engel, der bei mir war und mich führte, sagte zu mir: »Henoch, nach wem fragst du, nach wem erkundigst du dich, und nach wem suchst du?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Bedeutung des letzten Verbs ist unsicher. Es kann auch eifriges Nachforschen, Neugier oder innere Unruhe ausdrücken.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኡርኤል
  choice: Uriel
  rationale: Der Personenname wird nach der im Deutschen gebräuchlichen biblischen Form transliteriert.
- source_word: ፩እምቅዱሳን መላእክት
  choice: einer der heiligen Engel
  rationale: Die Wendung bezeichnet Uriel als einen aus dem Kreis der heiligen Engel; »heilig« bewahrt die gewichtige angelologische Bezeichnung.
- source_word: ዘምስሌየ
  choice: der bei mir war
  rationale: Die Relativwendung bezeichnet Uriels Anwesenheit an Henochs Seite; »bei mir« klingt im Deutschen natürlich und bleibt quellennah.
- source_word: ዘይመርሐኒ
  choice: mich führte
  rationale: Das Verb bezeichnet Führen oder Leiten. Das Präteritum fügt sich in die deutsche Erzählweise, ohne den begleitenden Charakter auszuschließen.
- source_word: በእንተ መኑ ትስእል
  choice: nach wem fragst du
  rationale: Im Deutschen ist »nach jemandem fragen« die natürliche Wiedergabe einer auf eine Person gerichteten Frage.
- source_word: ወበእንተ መኑ ትጠይቅ
  choice: und nach wem erkundigst du dich
  rationale: »Sich erkundigen« erhält die beabsichtigte Wiederholung mit einem bedeutungsnahen, aber unterscheidbaren Verb.
- source_word: ወትጽህቅ
  choice: und suchst
  rationale: Die genaue Nuance des schwierigen Schlussverbs ist unsicher. »Suchen« folgt der jüngsten textkritischen Revision und vermeidet eine Festlegung auf Sorge, Angst oder bloße Neugier.
theological_decisions:
- issue: Bezeichnung der Engel als heilig
  choice: heilige Engel
  alternative: geweihte Engel
  rationale: »Heilig« bewahrt die traditionelle und in diesem apokalyptischen Zusammenhang theologisch gewichtige Kategorie, ohne eine konfessionelle Zusatzdeutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Frageform und das zusätzliche Schlussverb bleiben erhalten, auch wenn die Reihung im Deutschen bewusst markiert klingt. Der Name ሄኖክ wird in der geläufigen deutschen Form »Henoch« wiedergegeben.
