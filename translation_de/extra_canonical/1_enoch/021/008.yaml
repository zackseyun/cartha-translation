base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/008.yaml
  text: And at that time I said[a], “How terrible this place is[c][b], and grievous to behold.”
translation:
  language: de
  text: 'Zu jener Zeit sagte ich: »Wie furchtbar dieser Ort ist und wie qualvoll es ist, ihn anzusehen!«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Wie schrecklich dieser Ort ist und wie schmerzlich anzusehen!«'
    reason: lexical_alternative
lexical_decisions:
- source_word: ውእተ፡ ጊዜ
  choice: zu jener Zeit
  rationale: Bewahrt die gehobene zeitliche Erzählformel und den Anschluss an die Abfolge der Vision.
- source_word: እቤ
  choice: sagte ich
  rationale: Die Form leitet unmittelbar Henochs Ausspruch ein; die natürliche deutsche Redeeinleitung gibt dies präzise wieder.
- source_word: አፎ
  choice: wie
  rationale: Hier ist das Wort als Ausrufsadverb zu verstehen, nicht als Substantiv »Mund«; damit entsteht der Ausruf »Wie furchtbar …!«.
- source_word: ግሩም
  choice: furchtbar
  rationale: Im Zusammenhang der Gerichtsschau bezeichnet das Wort eine Furcht einflößende, erschreckende Beschaffenheit und keine positiv verstandene Erhabenheit.
- source_word: ዝንቱ፡ መካን
  choice: dieser Ort
  rationale: Die schlichte deiktische Ortsbezeichnung passt zur visionären Topografie des Abschnitts.
- source_word: ወሕሙም
  choice: und wie qualvoll es ist
  rationale: »Qualvoll« wahrt den Sinn von Schmerz und Bedrängnis, ohne ihn mit »furchtbar« gleichzusetzen; die deutsche Satzgestalt macht den Bezug auf das Anschauen verständlich.
- source_word: ለነጽሮ
  choice: ihn anzusehen
  rationale: Die Infinitivkonstruktion beschreibt, wie belastend der Ort für den Betrachter ist; »anzusehen« ist würdig, aber gegenwärtig und verständlich.
theological_decisions:
- issue: Deutung von አፎ als Ausrufspartikel oder als »mein Mund«
  choice: Ausrufspartikel »wie«
  alternative: »mein Mund«
  rationale: Die Form und Syntax stützen den Ausruf »Wie furchtbar …«; die Lesart »mein Mund« würde eine andere äthiopische Form erwarten lassen und den Satzbau unnötig verändern.
- issue: Bedeutungsstärke von ግሩም in der Gerichtsschau
  choice: furchtbar
  alternative: ehrfurchtgebietend
  rationale: Der Ort wird als quälend anzusehen beschrieben. Daher steht das erschreckende Moment im Vordergrund; eine positiv klingende Wiedergabe würde die Gerichtsstimmung abschwächen.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Ausrufstruktur. Die Semantik des äthiopischen Textes wird eng gewahrt, während die koordinierte Wendung für natürliches Deutsch leicht entfaltet wird.
