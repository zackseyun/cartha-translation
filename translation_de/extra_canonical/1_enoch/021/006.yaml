base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/006.yaml
  text: These are among the stars that transgressed the command of the Lord[a], and they are bound here until ten thousand years are completed[e][d][c][b], the number of the days of their sins.
translation:
  language: de
  text: Diese gehören zu den Sternen[a], die das Gebot des Herrn übertreten haben, und sie sind hier gebunden, bis zehntausend Jahre vollendet sind[b] – die Zahl der Tage ihrer Sünden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Diese stammen von den Sternen“. Die äthiopische Präposition kann sowohl Herkunft als auch Zugehörigkeit zu einer Gruppe ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: „Zehntausend Jahre“ kann eine gewaltige festgesetzte Strafzeit bezeichnen; die konkrete Zahl des äthiopischen Textes bleibt hier wörtlich erhalten.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „die Zahl der Tage ihrer Sünden“. Das Bild verbindet die festgesetzte Dauer mit ihren Verfehlungen, ohne die genaue Beziehung näher auszuführen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እሉ ውእቶሙ
  choice: Diese gehören
  rationale: Die deiktische Identifikation wird zusammen mit der folgenden partitiven Wendung in natürliches Deutsch überführt; „Diese gehören zu …“ vermeidet ein missverständliches bloßes Ortsverhältnis.
- source_word: እምነ ከዋክብት
  choice: zu den Sternen
  rationale: እምነ kann Herkunft oder eine partitive Zugehörigkeit ausdrücken. Im Zusammenhang bezeichnet die Wendung diese Gestalten als Angehörige der im Gesicht geschauten Sterne; die Herkunftsnuance bleibt in einer Fußnote erhalten.
- source_word: እለ ኃለፉ ትእዛዘ እግዚአብሔር
  choice: die das Gebot des Herrn übertreten haben
  rationale: ኃለፉ hat wörtlich den Sinn des Hinüber- oder Überschreitens und bezeichnet hier einen Verstoß gegen ein Gebot. Das Perfekt ist im modernen Deutsch für die vorausliegende Übertretung natürlich.
- source_word: እግዚአብሔር
  choice: der Herr
  rationale: Der traditionelle göttliche Hoheitstitel wird als „der Herr“ wiedergegeben; im Kontext steht seine gebietende Autorität im Vordergrund.
- source_word: ወተአስሩ በዝየ
  choice: und sie sind hier gebunden
  rationale: Die Form bezeichnet ihre Fesselung beziehungsweise ihren Zustand der Gefangenschaft. „Gebunden“ bewahrt das konkrete Strafbild, ohne es deutend durch „eingekerkert“ zu ersetzen.
- source_word: እስከ ሶበ ይትፌጸም
  choice: bis … vollendet sind
  rationale: Die Wendung bezeichnet den festgesetzten Endpunkt ihrer Fesselung und bewahrt den Gedanken von Vollendung oder Erfüllung.
- source_word: ትእልፊተ ዓም
  choice: zehntausend Jahre
  rationale: Die unbestimmte Zahlwortfügung wird ohne bestimmten Artikel wiedergegeben. So bleibt die ausdrücklich genannte sehr lange Zeitspanne erhalten.
- source_word: ኈልቈ መዋዕለ ኃጢአቶሙ
  choice: die Zahl der Tage ihrer Sünden
  rationale: Die wörtliche Bildsprache von Zahl, Tagen und Sünden bleibt bestehen. Der Gedankenstrich kennzeichnet die nachgestellte erläuternde Apposition, ohne ihre genaue logische Beziehung stärker festzulegen als der Ausgangstext.
theological_decisions:
- issue: Identität der „Sterne“
  choice: Die Bezeichnung „Sterne“ bleibt als visionäre Darstellung himmlischer Wesen stehen.
  alternative: Die Sterne ausdrücklich als Engel oder Wächter bezeichnen.
  rationale: Der Zusammenhang legt himmlische Wesen nahe, doch eine Ersetzung durch „Engel“ würde das apokalyptische Bild auflösen und die Deutung in den Haupttext eintragen.
- issue: Bedeutung der zehntausend Jahre
  choice: Die konkrete Angabe „zehntausend Jahre“ wird im Haupttext beibehalten.
  alternative: Die Wendung als unbestimmte „unermesslich lange Zeit“ wiedergeben.
  rationale: Der äthiopische Text nennt eine bestimmte große Zahl. Dass sie zugleich eine gewaltige festgesetzte Strafzeit bezeichnen kann, wird angemerkt, aber nicht an die Stelle des Wortlauts gesetzt.
- issue: Beziehung der Schlusswendung zur Zeitangabe
  choice: „die Zahl der Tage ihrer Sünden“ bleibt als nachgestellte Erläuterung in bildhafter Form erhalten.
  alternative: Explizit formulieren, die Strafdauer sei nach dem Maß ihrer Sünden festgesetzt.
  rationale: Eine solche Ausdeutung ist möglich, würde aber die knappe und spannungsreiche Zuordnung von Strafzeit, Tagen und Sünden stärker erklären, als es der Wortlaut tut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzführung bleibt feierlich und bildhaft, ist aber unmittelbar verständlich. Visionäre und gerichtliche Sprache wird nicht durch konfessionelle oder systematisch-theologische Begriffe ersetzt.
