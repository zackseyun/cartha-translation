base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/004.yaml
  text: At that time I said[a], “For what sin have they been bound[c][b], and for what reason have they been cast here?”
translation:
  language: de
  text: 'Zu jener Zeit sagte ich[a]: »Wegen welcher Sünde sind sie gebunden worden, und aus welchem Grund sind sie hierher geworfen worden[b]?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »fragte ich«; die unmittelbar folgende Frage kann diese Wiedergabe nahelegen.'
    reason: lexical_alternative
  - marker: b
    text: Das letzte Verb kann auch bedeuten, dass sie hier zurückgelassen oder preisgegeben wurden; im Gerichtszusammenhang liegt jedoch »hierher geworfen« nahe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ውእተ፡ ጊዜ
  choice: Zu jener Zeit
  rationale: Die ge'ezische Zeitangabe eröffnet den Satz ohne Konjunktion. „Zu jener Zeit“ wahrt den gehobenen Erzählton und den abrupten Übergang.
- source_word: እቤ
  choice: sagte ich
  rationale: Die Form bezeichnet zunächst das Sprechen. Obwohl die folgende direkte Frage im Deutschen auch „fragte ich“ nahelegt, bleibt „sagte ich“ näher am Wortlaut.
- source_word: በእንተ፡ አይ፡ ኃጢአት
  choice: Wegen welcher Sünde
  rationale: Die Präpositionalfügung fragt nach dem verursachenden Grund; „wegen“ gibt diese kausale Bedeutung natürlich wieder.
- source_word: ተአስሩ
  choice: sind sie gebunden worden
  rationale: Das Passiv bezeichnet konkretes Binden oder Fesseln. Die Formulierung erhält das anschauliche Bild strafender Gefangenschaft.
- source_word: ወበእንተ፡ ምንት
  choice: und aus welchem Grund
  rationale: Die Formulierung bewahrt die parallele Frage nach Ursache beziehungsweise Grund, ohne sie zum bloßen „warum“ zu verkürzen.
- source_word: ዝየ
  choice: hierher
  rationale: Der deiktische Ausdruck verweist auf den Ort, an den die Betroffenen gelangt sind; mit dem Bewegungsverb ist „hierher“ im Deutschen idiomatisch.
- source_word: ተገደፉ
  choice: sind sie hierher geworfen worden
  rationale: Das Verb kann Werfen, Hinabwerfen oder Zurücklassen bezeichnen. Im Gerichtskontext gibt „geworfen“ die gewaltsame Verbringung wieder, ohne die lexikalische Alternative zu verschweigen.
theological_decisions:
- issue: Art der beschriebenen Strafe
  choice: Konkretes Gebundensein und gewaltsames Verbringen an einen Strafort
  alternative: Sie wurden gefangen gesetzt und hier zurückgelassen beziehungsweise preisgegeben
  rationale: Die sichtbare apokalyptische Gerichtsszene wird nicht zu abstrakter Schuld oder bloßer Ausgrenzung verflacht. Zugleich bleibt die Bedeutungsbreite des letzten Verbs in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener apokalyptischer Bildsprache. Der Satz beginnt entsprechend dem ge'ezischen Text ohne ein zusätzliches „Und“.
