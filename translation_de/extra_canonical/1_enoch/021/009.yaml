base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/009.yaml
  text: And at that time Uriel—one of the holy angels[a], who was with me—answered me and said to me, “Enoch,”
translation:
  language: de
  text: 'Zu jener Zeit antwortete mir Uriel, einer der heiligen Engel, der bei mir war, und sagte zu mir: »Henoch,[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Vers endet mit Uriels direkter Anrede »Henoch«; seine Rede wird im folgenden Vers fortgesetzt.
    reason: cross_reference
lexical_decisions:
- source_word: ውእተ፡ ጊዜ
  choice: Da
  rationale: Die ge’ezische Zeitformel führt den nächsten Erzählungsschritt ein. Im modernen deutschen Erzählstil gibt »Da« den zeitlichen Anschluss natürlich und würdig wieder.
- source_word: አውሥአኒ
  choice: antwortete mir
  rationale: Das Verb bezeichnet eine Antwort oder Erwiderung; die im Ausgangstext vorhandene Antwortsituation bleibt ausdrücklich erhalten.
- source_word: ኡርኤል
  choice: Uriel
  rationale: Der Personenname wird in seiner geläufigen deutschen Form wiedergegeben.
- source_word: ፩እምቅዱሳን፡ መላእክት
  choice: einer der heiligen Engel
  rationale: Die Wendung ordnet Uriel der Gruppe der heiligen Engel zu, ohne diese Bezeichnung dogmatisch weiter auszudeuten.
- source_word: እንዘ፡ ምስሌየ፡ ሀሎ
  choice: der bei mir war
  rationale: Die begleitende Konstruktion wird als natürliche deutsche Relativsatzbeschreibung Uriels wiedergegeben.
- source_word: ወይቤለኒ
  choice: und sagte zu mir
  rationale: Die wiederholende Redeeinleitungsformel des ge’ezischen Erzählstils wird bewusst bewahrt.
- source_word: ሄኖክ
  choice: Henoch
  rationale: Verwendet wird die im Deutschen geläufige biblische Namensform; die Anrede wird durch die Zeichensetzung kenntlich gemacht.
theological_decisions:
- issue: Wiedergabe von ቅዱሳን፡ መላእክት
  choice: heilige Engel
  alternative: Engel der Heiligkeit
  rationale: »Heilige Engel« ist im Deutschen die natürliche gruppenbezogene Wiedergabe und erhält die kosmologische Bezeichnung des Textes, ohne spätere lehrmäßige Einzelheiten einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die für den apokalyptischen Erzählstil typische Wiederholung von »antwortete« und »sagte« bleibt erhalten; unnötig altertümliche Formen werden vermieden.
