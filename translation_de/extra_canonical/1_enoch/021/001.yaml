base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/021/001.yaml
  text: And I went on until I came to a place where nothing is made[a].
translation:
  language: de
  text: Und ich ging weiter, bis ich an einen Ort kam, an dem nichts gemacht wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Zeile kann auch verstanden werden als: „an dem nichts gemacht worden war“ oder „an dem nichts existierte“. Das knappe Ge’ez hebt hervor, dass es dort keinerlei geformte Dinge gab.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አድኩ
  choice: ich ging weiter
  rationale: Das Verb bezeichnet die Fortsetzung von Henochs Bewegung auf seiner visionären Reise; „ging weiter“ ist natürlich und bewahrt den Erzählfortschritt.
- source_word: እስከነ
  choice: bis ich … kam
  rationale: Die Wendung führt zum erreichten Ziel. Die deutsche Wiedergabe macht die Ankunft idiomatisch deutlich, ohne den Sinn zu erweitern.
- source_word: ኀበ
  choice: an einen Ort
  rationale: Die Präposition bezeichnet hier das Ziel der Bewegung. „Ort“ wird dem Zusammenhang entsprechend ergänzt und ergibt eine klare, natürliche Formulierung.
- source_word: አልቦቱ
  choice: an dem nichts
  rationale: Der negative Existenz-Ausdruck beschreibt den Ort durch das Fehlen dessen, was im folgenden Relativsatz genannt wird. Die knappe Form bewahrt die eindringliche Wirkung.
- source_word: ዘይትገበር
  choice: gemacht wird
  rationale: Die passive imperfektische Relativform des Verbs „machen/tun“ wird bewusst allgemein wiedergegeben. „Geschaffen“ würde eine kosmologische Aussage stärker festlegen, als es der ge’ezische Wortlaut verlangt.
theological_decisions:
- issue: Beschaffenheit des Zielortes in Henochs Vision
  choice: ein Ort, an dem nichts gemacht wird
  alternative: ein Ort, an dem nichts gemacht worden war; ein Ort, an dem nichts existierte
  rationale: Der ge’ezische Wortlaut betont das Fehlen gemachter oder geformter Dinge, ohne eindeutig metaphysische Nichtexistenz oder ein bestimmtes Konzept des Ungeschaffenen zu lehren. Die Übersetzung erhält diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt bewusst schlicht und eindringlich; die ungewöhnliche Formulierung „nichts gemacht wird“ spiegelt die Mehrdeutigkeit des ge’ezischen Ausdrucks.
