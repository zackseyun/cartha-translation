base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/031/001.yaml
  text: And I saw other mountains[a], in which there were trees, and from them there came out something like nectar[c][b], whose name was serera and galbanum.
translation:
  language: de
  text: Und ich sah andere Berge, in denen Bäume standen; aus ihnen trat etwas wie Nektar hervor, das Serera[a] und Galbanum[b] genannt wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die botanische Bestimmung von Serera ist unsicher; das geʿezische Wort scheint den Namen einer aromatischen Substanz zu bewahren.
    reason: lexical_alternative
  - marker: b
    text: Galbanum ist ein aromatisches Harz, das in antiken Räuchertraditionen verwendet wurde; das zugrunde liegende geʿezische Wort kann auch als „Kelbene“ wiedergegeben werden.
    reason: cultural_note
lexical_decisions:
- source_word: ወርኢኩ
  choice: Und ich sah
  rationale: Bewahrt die geläufige Ich-Formel des visionären Berichts in klarem, würdigem Deutsch.
- source_word: ካልአነ አደባረ
  choice: andere Berge
  rationale: Beide Formen sind pluralisch; auch das folgende pronominale Suffix bestätigt den Plural.
- source_word: ዘቦ ውስቴቶሙ ዕፀወ
  choice: auf denen Bäume standen
  rationale: Gibt die Lokalisierung der Bäume an den Bergen natürlich wieder, ohne eine botanisch oder räumlich engere Deutung einzutragen.
- source_word: ወይወፅእ እምኔሁ
  choice: aus ihnen trat … hervor
  rationale: Behält das konkrete Bild einer austretenden Substanz bei und stimmt grammatisch mit dem pluralischen Bezug auf die Berge überein.
- source_word: ከመ ኔቄጥር
  choice: etwas wie Nektar
  rationale: Die Vergleichspartikel wird ausdrücklich wiedergegeben; „etwas“ wahrt die Unsicherheit darüber, welche süße oder aromatische Substanz gemeint ist.
- source_word: ዘስሙ ሰረራ ወከልበኔ
  choice: das Serera und Galbanum genannt wurde
  rationale: Serera bleibt wegen unsicherer botanischer Bestimmung transliteriert; Galbanum ist die etablierte deutsche Bezeichnung der aromatischen Harzsubstanz.
theological_decisions:
- issue: Soll die aromatische Bildsprache zu einem bloßen Duft verallgemeinert werden?
  choice: Das konkrete Bild einer hervortretenden Substanz bleibt erhalten.
  alternative: „von ihnen ging ein Duft aus“ oder „sie verströmten Wohlgeruch“
  rationale: Der Text schildert ein greifbares Element der visionären Naturwelt. Eine abstrakte Duftangabe würde die apokalyptische Bildlichkeit unnötig glätten.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Erzählton. Der sichere Plural „andere Berge“ wird konsequent durch „auf denen“ und „aus ihnen“ aufgenommen. Die ungewöhnlichen Stoffnamen und die sachliche Unbestimmtheit des Vergleichs bleiben erhalten.
