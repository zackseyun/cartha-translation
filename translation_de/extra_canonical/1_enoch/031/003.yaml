  yaml_path: translation/extra_canonical/1_enoch/031/003.yaml
  text: And when they crush that fruit[c][b][a], it is better than every fragrance.
translation:
  language: de
  text: Und wenn sie jene Frucht zerreiben,[a] übertrifft sie jeden Duft.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die zugrunde liegende Lesart ist unsicher. Die überlieferte Transkription kann „sie nehmen jene Frucht auf“ bedeuten; wahrscheinlich liegt jedoch eine fehlerhafte Texterfassung für ein Verb mit der Bedeutung „reiben“ oder „zerreiben“ vor.
    reason: textual_variant
  - marker: b
    text: 'Oder: „ist sie besser als alle Duftstoffe“. Die schwierige Schlusswendung kann die besondere Duftqualität der Frucht hervorheben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይሔስዎ (erschlossene Lesart hinter dem überlieferten/OCR-erfassten ተይነሥእዎ)
  choice: sie zerreiben
  rationale: Die revidierte Lesart bezeichnet ein Reiben oder Zerreiben, wodurch der Duft der Frucht freigesetzt wird. „Zerreiben“ passt zum aromatischen Zusammenhang, ohne ein vollständiges Zerstampfen zwingend vorauszusetzen.
- source_word: ፍሬ
  choice: Frucht
  rationale: Die botanische Bedeutung ist im Zusammenhang eindeutig und wird im Deutschen natürlich wiedergegeben.
- source_word: ይኄይስ
  choice: übertrifft
  rationale: Das Imperfekt bezeichnet hier eine gegenwärtige bzw. allgemeine Überlegenheit. „Übertrifft“ gibt die Vergleichskonstruktion knapp und idiomatisch wieder.
- source_word: እምኵሉ አፈው
  choice: jeden Duft
  rationale: Die schwierige Schlusswendung vergleicht die Frucht wahrscheinlich mit allen Düften oder Duftstoffen. „Jeden Duft“ bewahrt den sensorischen Bezug und die distributive Kraft von ኵሉ.
