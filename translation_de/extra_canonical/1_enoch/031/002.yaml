base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/031/002.yaml
  text: And upon that mountain I saw another mountain[a], and within it were trees; and those trees were full and strong[c][b], like almond trees.
translation:
  language: de
  text: Und auf jenem Berg sah ich einen anderen Berg[a], und darin waren Bäume; diese Bäume waren voll und kräftig wie Mandelbäume.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Wortlaut zeichnet ein ungewöhnliches räumliches Bild: Auf jenem Berg sieht Henoch einen weiteren Berg. Die Übersetzung glättet diese Darstellung nicht.'
    reason: source_ambiguity
  - marker: b
    text: Das mit »Mandelbäume« wiedergegebene Wort kann die Mandel oder den Mandelbaum bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ዲበ
  choice: auf
  rationale: Die räumliche Präposition bezeichnet den Ort der Vision; »auf« ist im modernen Deutschen die natürliche Entsprechung.
- source_word: ደብር
  choice: Berg
  rationale: Das Wort bezeichnet einen Berg oder eine Anhöhe; im topografischen Zusammenhang ist »Berg« angemessen.
- source_word: ካልአ
  choice: einen anderen
  rationale: Kennzeichnet einen weiteren, davon unterschiedenen Berg in der Abfolge der Vision.
- source_word: ውስቴቱ
  choice: darin
  rationale: Das Suffix verweist auf den Berg zurück. »Darin« bewahrt die ungewöhnliche räumliche Aussage, ohne sie erklärend zu glätten.
- source_word: ዕፀወ / ዕፀው
  choice: Bäume
  rationale: Beide Formen bezeichnen hier konkret Bäume beziehungsweise Gehölz; die Wiederholung wird entsprechend erhalten.
- source_word: እልኩ
  choice: diese
  rationale: Die Form wird als pluralischer Demonstrativausdruck verstanden, der auf die zuvor genannten Bäume zurückverweist, nicht als Verb der Wahrnehmung.
- source_word: ምሉኣን
  choice: voll
  rationale: Bewahrt die wörtliche Vorstellung von Fülle, auch wenn deren genauer Bezug offenbleibt.
- source_word: ዘከመ ከርካዕ
  choice: wie Mandelbäume
  rationale: Die botanische Vergleichsgröße wird als Mandel beziehungsweise Mandelbaum verstanden; die deutsche Form macht den Vergleich mit den Bäumen grammatisch klar.
- source_word: ጽኑዕተ
  choice: kräftig
  rationale: Gibt Festigkeit, Stärke oder Robustheit der Bäume in natürlichem Deutsch wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die knappe visionäre Struktur und das ungewöhnliche »darin« bleiben erhalten. »Voll« wird trotz seiner im Deutschen offenen Ergänzung beibehalten, um die Unbestimmtheit des ge'ezischen Ausdrucks nicht durch »üppig« oder »reich belaubt« zu verengen.
