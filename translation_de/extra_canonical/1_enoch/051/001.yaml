base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/051/001.yaml
  text: And in those days the earth will give back from its womb[c][b][a], and Sheol will give back what it has received, .
translation:
  language: de
  text: '**1 Henoch 51,1**


    Und in jenen Tagen wird die Erde ihren Mutterschoß zurückgeben[a], und der Scheol wird zurückgeben, was er empfangen hat[b], und der Ort des Verderbens wird zurückgeben, was er schuldet[c]. Dann wird er aus ihnen die Gerechten und Heiligen auswählen; denn der Tag ist nahe, an dem sie gerettet werden. In jenen Tagen wird der Erwählte auf seinem Thron sitzen, und aus seinem Mund wird er alle Gedanken der Weisheit hervorbringen; denn der Herr der Geister hat ihn beschenkt und ihn verherrlicht. In jenen Tagen werden die Berge wie Widder tanzen und die Hügel wie Lämmer springen, die von Milch satt sind. Die Gesichter aller Engel im Himmel werden vor Freude leuchten; denn in jenen Tagen wird sich der Erwählte erheben. Die Erde wird sich freuen, die Gerechten werden auf ihr wohnen, und die Erwählten werden auf ihr umhergehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird das ihr Anvertraute zurückgeben“. Die überlieferte Form wird unterschiedlich als Bild des Mutterschoßes beziehungsweise Innenraums der Erde oder als Bezeichnung eines ihr anvertrauten Gutes verstanden.'
    reason: lexical_ambiguity
  - marker: b
    text: „Scheol“ bezeichnet im altjüdischen Sprachgebrauch den Bereich der Toten; der Ausdruck ist nicht ohne Weiteres mit der späteren Vorstellung der Hölle gleichzusetzen.
    reason: cultural_note
  - marker: c
    text: Wörtlich steht ein Ausdruck für „Verderben“ oder „Untergang“. Im Parallelismus erscheint er wie ein Bereich, der Tote verwahrt und wieder herausgeben muss; auch „das Verderben“ ist möglich.
    reason: lexical_and_conceptual_ambiguity
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: in jenen Tagen
  rationale: Bewahrt die wiederkehrende apokalyptische Zeitformel und ihren feierlichen Rhythmus.
- source_word: ታገብእ / ያገብእ
  choice: wird zurückgeben
  rationale: Das wiederholte Verb bezeichnet hier das Herausgeben beziehungsweise Zurückgeben dessen, was zuvor aufgenommen oder verwahrt wurde.
- source_word: ማሕፀንታ
  choice: ihren Mutterschoß
  rationale: Die überlieferte Form lässt sich als Bild für den bergenden Innenraum der Erde verstehen; wegen der diskutierten Nähe zu einer Lesart im Sinn von ‚anvertrautes Gut‘ wird die Alternative in einer Fußnote erhalten.
- source_word: ሲኦል
  choice: Scheol
  rationale: Die Transliteration bewahrt den altjüdischen Begriff für den Bereich der Toten, ohne ihn mit der späteren Vorstellung der Hölle gleichzusetzen.
- source_word: ሀጕል
  choice: Ort des Verderbens
  rationale: Das Substantiv bezeichnet Verderben oder Untergang; die räumliche Wiedergabe passt zum Parallelismus mit Erde und Scheol, ohne vorschnell eine spätere Höllenvorstellung einzutragen.
- source_word: ኅሩይ
  choice: der Erwählte
  rationale: Die substantivische messianisch-apokalyptische Bezeichnung wird entsprechend ihrem wiederholten Gebrauch im Abschnitt einheitlich wiedergegeben.
- source_word: ኅሊናተ ጥበብ
  choice: Gedanken der Weisheit
  rationale: Die Formulierung wahrt die Verbindung von innerem Denken, Einsicht und Weisheit und vermeidet die unbelegte Einengung auf ‚Geheimnisse‘.
- source_word: እግዚአ መናፍስት
  choice: der Herr der Geister
  rationale: Formale und im Henochbuch etablierte Wiedergabe des göttlichen Titels.
- source_word: ይዘፍኑ አድባር ከመ ሐራጊት
  choice: die Berge wie Widder tanzen
  rationale: Bewahrt das lebendige poetische Bild; das Verb kann freudiges Springen oder Tanzen ausdrücken.
theological_decisions:
- issue: 'Auferstehungsbild: Mutterschoß oder anvertrautes Gut'
  choice: ihren Mutterschoß zurückgeben
  alternative: das ihr Anvertraute zurückgeben
  rationale: Die Hauptfassung bewahrt das konkrete Bild des Inneren der Erde; die philologisch und kontextuell mögliche Verwahrungsmetapher bleibt ausdrücklich in der Fußnote sichtbar.
- issue: Bedeutung von Scheol
  choice: Scheol
  alternative: Totenreich
  rationale: Der Eigenbegriff bewahrt die antike Vorstellungswelt und vermeidet eine Gleichsetzung mit ‚Hölle‘.
- issue: Identität und Funktion des Erwählten
  choice: der Erwählte
  alternative: der Auserwählte
  rationale: Der Titel wird ohne zusätzliche christologische oder konfessionelle Deutung wiedergegeben.
- issue: Bezug von ‚ihnen‘ in ‚hat sie ihm gegeben‘
  choice: Bezug auf die Gedanken der Weisheit
  alternative: unbestimmter Gegenstandsbezug
  rationale: Der feminine Plural im Deutschen stellt den naheliegenden Bezug auf die zuvor genannten Gedanken her, ohne über den Satz hinausgehende Inhalte einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst wiederholtem „in jenen Tagen“ zur Wahrung des apokalyptischen Rhythmus. Die poetischen Bilder bleiben konkret. Ungebräuchliche Begriffe werden nur dort beibehalten, wo eine glättende Übersetzung den antiken Vorstellungshorizont oder eine echte Mehrdeutigkeit verengen würde.
