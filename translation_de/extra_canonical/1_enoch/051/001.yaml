  - severity: medium
    issue: „denn der Herr der Geister hat sie ihm gegeben“
    rationale: Das feminine „sie“ legt als ausdrücklich gegebenes Objekt die „Gedanken der Weisheit“ fest. Die ge'ezische Formulierung bezeichnet den Erwählten als Empfänger und als verherrlicht, ohne diese Ergänzung im Deutschen erzwingen zu müssen. „hat ihn beschenkt“ gibt die Aussage ohne künstlichen Objektbezug wieder.
