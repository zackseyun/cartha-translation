base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/010.yaml
  text: And with them was the Head of Days[a], and his head was like white and pure wool[c][b], and his garment cannot be described.
translation:
  language: de
  text: Und mit ihnen war das Haupt der Tage[a], und sein Haupt war wie weiße und reine Wolle, und sein Gewand ließ sich nicht beschreiben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder traditionell: »der Alte an Tagen«. Wörtlich steht hier »das Haupt der Tage«; der traditionelle Titel nimmt wahrscheinlich die Anspielung auf Daniel 7 auf.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »ließ sich nicht erklären oder auslegen«. Im visionären Zusammenhang liegt nahe, dass das Gewand jede gewöhnliche Beschreibung übersteigt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ምስሌሆሙ
  choice: bei ihnen
  rationale: Die Präposition ምስለ bezeichnet ein Mit- oder Beisein. „Bei ihnen“ gibt die räumlich-relationale Aussage im Deutschen natürlich wieder, ohne sie zu „unter ihnen“ umzudeuten.
- source_word: ርእሰ መዋዕል
  choice: das Haupt der Tage
  rationale: Die wörtliche Wiedergabe bewahrt den eigentümlichen äthiopischen Titel und vermeidet eine stillschweigende Angleichung an den traditionellen Danieltitel „der Alte an Tagen“.
- source_word: ፀምር
  choice: Wolle
  rationale: Nach dem Vergleichswort ከመ ist Wolle der konkrete Vergleichsgegenstand; „Haar“ würde das Bild erklärend umformen.
- source_word: ጻዕዳ ወንጹሕ
  choice: weiße, reine
  rationale: 'Die beiden Eigenschaften werden getrennt bewahrt: sichtbare Weiße und Reinheit, ohne Letztere ausschließlich rituell oder moralisch festzulegen.'
- source_word: ልብሱ
  choice: sein Gewand
  rationale: „Gewand“ ist eine natürliche, würdige Wiedergabe des allgemeinen Ausdrucks für Kleidung, ohne eine bestimmte Gewandform festzulegen.
- source_word: ዘኢይትረጐም
  choice: ließ sich nicht beschreiben
  rationale: Das Verb kann erklären, auslegen oder wiedergeben bedeuten. Im visionären Zusammenhang bezeichnet die Formulierung am ehesten die Unbeschreiblichkeit des Gewandes; die Fußnote erhält die weitere Bedeutungsbreite.
theological_decisions:
- issue: Beziehung des Titels ርእሰ መዋዕል zum „Alten an Tagen“ aus Daniel 7
  choice: das Haupt der Tage
  alternative: der Alte an Tagen
  rationale: Die Übersetzung folgt dem Wortlaut des ge'ezischen Zeugen. Die wahrscheinliche Daniel-Anspielung wird in der Fußnote kenntlich gemacht, aber nicht als harmonisierende Haupttextfassung eingesetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Haupt“ bleibt erhalten, weil sie Titel und Körperbeschreibung im Ausgangstext miteinander verbindet. Alle Fußnotenmarker stehen an der jeweils einschlägigen Stelle im Haupttext.
