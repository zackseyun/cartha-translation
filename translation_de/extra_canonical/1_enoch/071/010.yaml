  terminology: »Haupt« wahrt sowohl den wörtlichen Charakter des Titels als auch die anschließende körperliche Bezeichnung. »Gewand« ist registergerecht und nicht überpräzise. Die Formulierung »der Alte an Tagen« bleibt zutreffend als traditionelle Alternative in der Fußnote.
