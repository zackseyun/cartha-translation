base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/011.yaml
  text: And I fell on my face[a], and all my flesh melted away, and my spirit was transformed; and I cried out with a loud voice ... in the spirit of power[e][d][c][b], and I blessed and praised and exalted him.
translation:
  language: de
  text: Und ich fiel auf mein Angesicht, und mein ganzes Fleisch schmolz dahin, und mein Geist wurde verwandelt.[a] Und ich rief mit lauter Stimme …[b] im Geist der Kraft,[c] und ich segnete, lobte und erhob ihn.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mein Geist veränderte sich“. Das geʿezische Verb ist schwierig; die genaue Art der Veränderung bleibt ungewiss.'
    reason: lexical_alternative
  - marker: b
    text: Der Text ist nach „mit lauter Stimme“ offenbar lückenhaft oder verderbt; die Auslassungspunkte geben diese Unsicherheit wieder.
    reason: textual_variant
  - marker: c
    text: 'Auch möglich: „durch einen Geist der Kraft“ oder „durch den Geist der Kraft“. Die Wendung kann Henochs inneren Zustand oder die Kraft bezeichnen, durch die er spricht.'
    reason: lexical_alternative
  - marker: d
    text: Wörtlich stehen die drei Verben ohne ausdrücklich genanntes Objekt; „ihn“ ist aus dem Zusammenhang ergänzt.
    reason: supplied_word
lexical_decisions:
- source_word: ወወደቁ በገጽየ
  choice: Und ich fiel auf mein Angesicht
  rationale: Bewahrt sowohl das plötzliche Niederfallen als auch die konkrete Körperhaltung, ohne zwischen freiwilliger Niederwerfung und Zusammenbrechen zu entscheiden.
- source_word: ኵሉ ሥጋየ ተመስወ
  choice: mein ganzes Fleisch schmolz dahin
  rationale: „Fleisch“ erhält die anthropologische Bildkraft des geʿezischen Ausdrucks; „schmolz dahin“ gibt die eindringliche visionäre Auflösung wieder.
- source_word: መንፈስየ ተወለጠ
  choice: mein Geist wurde verwandelt
  rationale: Die Formulierung bezeichnet eine tiefgreifende innere Veränderung, legt deren genaue Art aber nicht fest.
- source_word: ጸራኅኩ በቃል ዓቢይ
  choice: ich rief mit lauter Stimme
  rationale: Gibt die gemeinte Lautstärke in natürlichem modernem Deutsch wieder, ohne den geʿezischen Ausdruck unidiomatisch als „große Stimme“ abzubilden.
- source_word: በመንፈሰ ኃይል
  choice: im Geist der Kraft
  rationale: Die bewusst offene Formulierung bewahrt die Möglichkeit, dass die Wendung Henochs inneren Zustand oder die ihn befähigende Wirkmacht bezeichnet.
- source_word: ወባረኩ ወሰብሕኩ ወአልዓልኩ
  choice: und ich segnete, lobte und erhob ihn
  rationale: Die drei parallelen Verehrungsverben bleiben erhalten. Das im Geʿez nicht ausdrücklich genannte Objekt wird für einen vollständigen, natürlichen deutschen Satz ergänzt und in einer Fußnote ausgewiesen.
theological_decisions:
- issue: Anthropologische Aussage von „Fleisch“ beim visionären Zusammenbruch
  choice: mein ganzes Fleisch schmolz dahin
  alternative: mein ganzer Körper löste sich auf
  rationale: Das konkrete Wort „Fleisch“ wahrt die theologische und apokalyptische Spannung des Ausgangstextes, statt sie zu einem neutralen Hinweis auf den Körper abzuschwächen.
- issue: Bedeutung der Veränderung des Geistes
  choice: mein Geist wurde verwandelt
  alternative: mein Geist veränderte sich / wich von mir
  rationale: „Wurde verwandelt“ bezeichnet eine innere Veränderung, ohne sie als Tod, Entrückung oder bloße Gefühlsregung festzulegen; die Unsicherheit wird offengelegt.
- issue: Bezug von „im Geist der Kraft“
  choice: Die syntaktische und theologische Mehrdeutigkeit bleibt im Haupttext erhalten.
  alternative: durch einen Geist der Kraft / in machtvoller Ergriffenheit
  rationale: Der Ausgangstext entscheidet nicht eindeutig, ob von Henochs innerem Zustand, einer Art und Weise oder einer befähigenden geistigen Wirkmacht die Rede ist.
- issue: Ungenanntes Objekt der abschließenden Verehrungsverben
  choice: „ihn“ wird aus dem Zusammenhang ergänzt und gekennzeichnet.
  alternative: Die Verben ohne Objekt stehen lassen.
  rationale: Natürliches Deutsch verlangt hier ein Bezugswort; die Ergänzung darf jedoch nicht den Eindruck erwecken, das Pronomen stehe ausdrücklich im geʿezischen Text.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter apokalyptischer Bildsprache. Ungewöhnliche, aber bedeutungstragende Wendungen wie „mein ganzes Fleisch“ und „im Geist der Kraft“ bleiben stehen; Unsicherheiten werden nicht stillschweigend aufgelöst.
