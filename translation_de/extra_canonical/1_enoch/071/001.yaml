  rationale: 'Die Revision korrigiert die deutsche Orthographie und folgt der einfachen Erzählverknüpfung des Ausgangstextes. Entscheidend ist die transparentere Behandlung des in der Edition eingeklammerten Wortes für „Mäntel“: Es wird weder ausgelassen noch durch das nicht ausdrücklich belegte „auch“ zu einer glatten, sicheren Aussage umgeformt. Die eckigen Klammern und die Fußnote erhalten die textkritische Unsicherheit und die überlieferte Syntax sichtbar.'
