base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/001.yaml
  text: 'And after this it happened: my spirit was taken up[a], and it ascended into the heavens; and I saw the sons of the holy angels walking upon a flame of fire, and their garments were white[d][c][b], and their faces shone like snow.'
translation:
  language: de
  text: 'Und danach geschah es: mein Geist wurde emporgehoben[a] und stieg in die Himmel auf, und ich sah die Söhne der heiligen Engel[b], die auf einer Flamme aus Feuer gingen. Ihre Gewänder waren weiß – [und ihre Mäntel][c] –, und ihre Gesichter leuchteten wie Schnee[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung beschreibt eine visionäre Entrückung; auch „emporgetragen“ ist möglich.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „die Söhne der heiligen Engel“. Die ungewöhnliche Bezeichnung kann weiter gefasst Engelwesen meinen, die den heiligen Engeln zugeordnet sind.
    reason: lexical_alternative
  - marker: c
    text: „Und ihre Mäntel“ steht in der zugrunde gelegten Ausgabe in eckigen Klammern und ist daher textlich unsicher; möglicherweise handelt es sich um eine Glosse. Die syntaktisch unvollständige Stellung des Zusatzes wird im Haupttext bewusst beibehalten.
    reason: textual_variant
  - marker: d
    text: Das Vergleichswort kann auch „Hagel“ oder „Eis“ bezeichnen. Hier ist „Schnee“ als Bild strahlender Helligkeit und Weiße gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረዝ
  choice: danach
  rationale: Eine natürliche neuhochdeutsche Erzählüberleitung, die die Abfolge der Vision wahrt.
- source_word: ትትከበት መንፈስየ
  choice: Mein Geist wurde emporgehoben
  rationale: Die Passivform und der visionäre Transport bleiben erkennbar; „emporgehoben“ verbindet sich zugleich natürlich mit dem anschließenden Aufstieg.
- source_word: ተዐርገ ውስተ ሰማያት
  choice: stieg in die Himmel auf
  rationale: Der Plural „Himmel“ wird entsprechend der apokalyptischen Kosmologie des Ausgangstextes bewahrt.
- source_word: ለውሉዶሙ ለመላእክት ቅዱሳን
  choice: die Söhne der heiligen Engel
  rationale: Die ungewöhnliche familiäre Formulierung wird nicht zu „die heiligen Engel“ geglättet.
- source_word: ዲበ ላህበ እሳት
  choice: auf einer Feuerflamme
  rationale: Die konkrete Vorstellung des Gehens auf einer einzelnen Feuerflamme bleibt erhalten.
- source_word: አልባሶሙ ጻዓዳ
  choice: Ihre Gewänder waren weiß
  rationale: „Gewänder“ ist würdig und hinreichend allgemein, ohne eine bestimmte Kleidungsform vorauszusetzen.
- source_word: '[ወዐጸፎሙ]'
  choice: auch ihre Mäntel
  rationale: Das in der Edition eingeklammerte Wort wird als „ihre Mäntel“ wiedergegeben und durch Gedankenstriche sowie eine Fußnote als textlich unsicher gekennzeichnet.
- source_word: ብሩሃን ገጾሙ ከመ በረድ
  choice: ihre Gesichter leuchteten wie Schnee
  rationale: „Leuchteten“ bewahrt die Helligkeit des Ausdrucks; „Schnee“ vermittelt in diesem Zusammenhang das Bild blendender Weiße.
theological_decisions:
- issue: Identität der „Söhne der heiligen Engel“
  choice: Die wörtliche verwandtschaftliche Bezeichnung bleibt im Haupttext stehen.
  alternative: die heiligen Engel
  rationale: Der ungewöhnliche Wortlaut darf nicht durch eine harmonisierende Identifikation ersetzt werden; seine mögliche Bedeutung wird lediglich in der Fußnote erläutert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die visionäre Bildsprache, der Plural „Himmel“ und die ungewöhnliche Bezeichnung der Engelwesen bleiben erhalten. Die unsichere Mantel-Lesart wird weder verschwiegen noch als sicherer Text ausgegeben.
