base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/012.yaml
  text: And those blessings that went out from my mouth became acceptable before that Head of Days[a][b][c].
translation:
  language: de
  text: 'Und ich sagte: Die Segnungen, die aus meinem Mund hervorgingen, fanden vor jenem Haupt der Tage[a][b] Gefallen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wurden vor jenem Haupt der Tage wohlgefällig aufgenommen“. Der ge’ezische Ausdruck kann sowohl Wohlgefallen als auch günstige Annahme bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Haupt der Tage“ gibt den ge’ezischen Titel an dieser Stelle wörtlich wieder. Er wird nicht mit der aus Daniel bekannten Bezeichnung „Uralter an Tagen“ gleichgesetzt.
    reason: cross_reference
lexical_decisions:
- source_word: በረከት
  choice: Segnungen
  rationale: Das Substantiv bezeichnet Segen beziehungsweise Segenssprüche. Die umgebenden Demonstrativ-, Relativ- und Verbformen stehen im Plural; deshalb gibt die Übersetzung den Ausdruck als „Segnungen“ wieder.
- source_word: ወፅኣ እምነ አፉየ
  choice: die aus meinem Mund hervorgingen
  rationale: Die konkrete Bildsprache des Herausgehens aus dem Mund bleibt erhalten, statt den Ausdruck auf „die ich sprach“ zu verkürzen.
- source_word: ሥሙረተ
  choice: fanden Gefallen
  rationale: Die Form bezeichnet, dass die Segnungen wohlgefällig beziehungsweise günstig aufgenommen wurden. „Fanden Gefallen“ ist im modernen Deutschen natürlich und bewahrt die wertende Aussage, ohne sie näher zu erklären.
- source_word: ቅድመ
  choice: vor
  rationale: „Vor“ gibt die räumlich-höfische Beziehung knapp wieder und passt zum apokalyptischen Szenarium.
- source_word: ዝኩ ርእሰ መዋዕል
  choice: jenem Haupt der Tage
  rationale: „Jenem“ bildet das Demonstrativum ab; „Haupt der Tage“ bewahrt die besondere äthiopische Titelform und harmonisiert sie nicht stillschweigend mit Daniel.
theological_decisions:
- issue: Wiedergabe des göttlichen Titels ርእሰ መዋዕል
  choice: Haupt der Tage
  alternative: Uralter an Tagen; Haupt der Tage
  rationale: Die Übersetzung folgt der eigentümlichen Formulierung des ge’ezischen Textes. Sie ersetzt sie nicht durch die vertrautere, an Daniel angelehnte Bezeichnung und lässt so die literarische Eigenart des Henochtextes bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Hervorgingen“ erhält die anschauliche visionäre Ausdrucksweise; „fanden Gefallen“ vermeidet eine schwerfällige wörtliche Konstruktion. Der grammatisch deutlich markierte Plural wird konsequent wiedergegeben.
