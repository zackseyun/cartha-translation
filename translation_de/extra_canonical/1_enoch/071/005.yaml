base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/005.yaml
  text: And my spirit was covered in the heaven of heavens[a], and I saw there, in the midst of that light, something built of stones of hail[c][b], and in the midst of those stones were tongues of living fire.
translation:
  language: de
  text: Und mein Geist wurde im Himmel der Himmel verborgen[a], und dort sah ich mitten in jenem Licht etwas, das aus Hagelsteinen[b] erbaut war; und mitten unter diesen Steinen waren Zungen lebendigen Feuers.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder möglicherweise: »wurde bedeckt«. Die zugrunde liegende Form gehört wahrscheinlich zur Wortfamilie »verbergen«; der überlieferte Wortlaut ist jedoch unsicher.'
    reason: textual_variant
  - marker: b
    text: Wörtlich ein Bau aus »Steinen des Hagels«; möglich sind auch die Auffassungen »Hagelkörner« oder »Eissteine«. Das eigentümliche Bild bleibt bewusst erhalten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ተከብተ (im überlieferten Text offenbar fehlerhaft ከበቶ)
  choice: wurde … verborgen
  rationale: Die zugrunde liegende Wurzel k-b-t bezeichnet das Verbergen. Das Passiv und die enochische Bildsprache bleiben erhalten, ohne den Vorgang als körperliche Himmelfahrt oder bloß innere Vision festzulegen.
- source_word: መንፈስየ
  choice: mein Geist
  rationale: Gibt die persönliche Geistbezeichnung direkt wieder und vermeidet die Verengung auf »Seele«, »Sinn« oder »Bewusstsein«.
- source_word: ውስተ ሰማየ ሰማያት
  choice: im Himmel der Himmel
  rationale: Bewahrt die semitisch geprägte, gesteigerte Himmelsbezeichnung, statt sie zu »höchster Himmel« zu glätten.
- source_word: ማእከለ ዝኩ ብርሃን
  choice: mitten in jenem Licht
  rationale: Erhält sowohl die räumliche Mitte als auch die demonstrative Bestimmung des Lichtes.
- source_word: ከመ ቦቱ ዘይትነደቅ
  choice: etwas, das … erbaut war
  rationale: Die schwierige Syntax weist auf etwas Gebautes oder ein Bauwerk. Die unbestimmte Formulierung bewahrt die Unsicherheit des Textes.
- source_word: እምእብነ አስሐትያ
  choice: aus Hagelsteinen
  rationale: Gibt das konkrete und fremdartige apokalyptische Bild natürlich wieder; »Eissteine« bleibt als mögliche Alternative in der Fußnote genannt.
- source_word: ልሳናተ እሳት ሕያው
  choice: Zungen lebendigen Feuers
  rationale: Bewahrt die wörtliche Flammenmetapher und die belebte Qualität des Feuers.
theological_decisions:
- issue: Art von Henochs Entrückung
  choice: mein Geist wurde … verborgen
  alternative: mein Geist wurde hinaufgenommen / Henoch wurde leiblich entrückt
  rationale: Der geʿezische Text nennt ausdrücklich Henochs Geist und verwendet Verbergungssprache. Die Übersetzung entscheidet nicht, ob das Erlebnis körperlich, visionär oder auf andere Weise zu verstehen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die semitisch geprägte Wendung »Himmel der Himmel« und das fremdartige apokalyptische Bild werden bewahrt; die schwierige Bauwerkszeile wird bewusst vorsichtig formuliert.
