base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/002.yaml
  text: And I saw two rivers of fire[a], and the light of that fire shone like hyacinth[b], and I fell on my face before the Lord of Spirits.
translation:
  language: de
  text: Und ich sah zwei Feuerströme, und das Licht jenes Feuers[b] leuchtete wie Hyazinth[a], und ich fiel auf mein Angesicht vor dem Herrn der Geister.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Hyazinth“ ist hier wahrscheinlich ein Edelstein gemeint; seine genaue mineralogische Bestimmung ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: Die geʽezische Wendung ist knapp gefasst und kann sinngemäß auch als „sein feuriger Glanz“ verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: ክልኤተ፡ አፍላገ፡ እሳት
  choice: zwei Feuerströme
  rationale: Die Wendung bewahrt das eindrückliche Bild zweier fließender Feuerläufe; „Ströme“ ist im Deutschen natürlicher und visionär kraftvoller als „Kanäle“.
- source_word: ብርሃነ፡ ዝኩ፡ እሳት
  choice: das Licht jenes Feuers
  rationale: „Licht“ gibt ብርሃን direkt wieder, während „jenes“ die demonstrative Rückbindung an das zuvor genannte Feuer erhält.
- source_word: ያክንት
  choice: Hyazinth
  rationale: Der traditionelle Edelsteinname wahrt den konkreten Vergleich, ohne die unsichere mineralogische Bestimmung zu verallgemeinern.
- source_word: ያበርህ
  choice: leuchtete
  rationale: Das Verb bezeichnet Leuchten oder Lichtgeben; „leuchtete“ ist klar, natürlich und bewahrt die visuelle Wirkung.
- source_word: ወወደቁ፡ በገጽየ
  choice: und ich fiel … auf mein Angesicht
  rationale: Die körperliche Gebärde der Niederwerfung wird bildhaft und quellennah wiedergegeben, statt sie lediglich als innere Ehrfurcht zu umschreiben.
- source_word: ቅድመ
  choice: vor
  rationale: Die knappe Präposition gibt sowohl die räumliche als auch die ehrerbietige Bedeutung angemessen wieder.
- source_word: እግዚአ፡ መንፈሳት
  choice: der Herr der Geister
  rationale: Die wiederkehrende göttliche Titulatur wird als feste Bezeichnung bewahrt und nicht zu einer allgemeinen Umschreibung verflacht.
theological_decisions:
- issue: Wiedergabe des göttlichen Titels እግዚአ መንፈሳት
  choice: der Herr der Geister
  alternative: der Herr von Geistern
  rationale: Die Genitivfügung klingt im Deutschen wie ein fester Hoheitstitel und entspricht der wiederkehrenden Formel im Gleichnisbuch, ohne näher festzulegen, welche Geister gemeint sind.
- issue: Bedeutung des Edelsteinvergleichs
  choice: leuchtete wie Hyazinth
  alternative: leuchtete wie ein kostbarer Stein
  rationale: Die traditionelle Benennung erhält die Eigenart und zugleich die Unsicherheit des antiken Edelsteinbegriffs; die Fußnote macht deutlich, dass die genaue mineralogische Zuordnung offenbleibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht gehobenem visionärem Ton. Die wiederholte Satzverbindung mit „und“ sowie das konkrete Niederwerfungsbild bleiben erhalten. Die Fußnotenmarker stehen unmittelbar bei den jeweils erklärten Ausdrücken.
