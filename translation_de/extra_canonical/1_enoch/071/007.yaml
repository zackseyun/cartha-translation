base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/007.yaml
  text: And around it were the seraphim and the cherubim and the ophannim[b][a], and these are those who do not sleep and who keep watch over the throne of his glory.
translation:
  language: de
  text: Und um es herum waren die Serafim, die Kerubim und die Ophannim[a]. Diese sind es, die nicht schlafen und über den Thron seiner Herrlichkeit wachen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Ophannim“ ist die transliterierte Bezeichnung einer himmlischen Ordnung; das zugrunde liegende Wort bedeutet „Räder“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወአውዶ
  choice: Und rings um es waren
  rationale: Die Wendung gibt sowohl die räumliche Anordnung als auch das maskuline Singularsuffix „um es“ wieder, das auf das zuvor genannte Gebäude zurückweist.
- source_word: ሱራፌን
  choice: Serafim
  rationale: Die eingebürgerte deutsche Umschrift bewahrt die Bezeichnung einer himmlischen Ordnung und den apokalyptischen Sprachton.
- source_word: ኪሩቤን
  choice: Kerubim
  rationale: Die traditionelle deutsche Form bezeichnet diese himmlische Ordnung präzise und entspricht der parallelen Aufzählung.
- source_word: አፋኒን
  choice: Ofannim
  rationale: Die Umschrift behandelt das Wort parallel zu Serafim und Kerubim als Namen einer himmlischen Ordnung; der zugrunde liegende Sinn „Räder“ wird in einer Fußnote genannt.
- source_word: እሙንቱ
  choice: Sie sind es
  rationale: Die betonte Identifizierung der zuvor genannten Wesen mit der folgenden Beschreibung wird in natürlichem Deutsch erhalten.
- source_word: እለ ኢይነውሙ
  choice: die nicht schlafen
  rationale: Die schlichte Verneinung des Schlafens wird direkt wiedergegeben, ohne sie zu „niemals“ zu verstärken.
- source_word: የዐቅቡ
  choice: über … wachen
  rationale: Die Formulierung bewahrt den Sinn aufmerksamer, fortdauernder Bewachung.
- source_word: መንበረ ስብሐተ ዚአሁ
  choice: den Thron seiner Herrlichkeit
  rationale: Die substantivische Genitivkonstruktion bleibt erhalten und wird nicht zum deutenderen Adjektiv „herrlich“ geglättet.
theological_decisions:
- issue: Benennung der himmlischen Wesen in der Thronvision
  choice: Die drei Klassen werden als „Serafim“, „Kerubim“ und „Ofannim“ umschrieben.
  alternative: „Ofannim“ wörtlich als „Räder“ wiedergeben oder alle drei allgemein als Engelwesen bezeichnen.
  rationale: Die parallele Aufzählung weist auf unterscheidbare himmlische Ordnungen. Die Umschrift bewahrt die kosmologische Eigenart und lässt zugleich durch die Fußnote die wörtliche Bilddimension erkennen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung und die apokalyptische Terminologie bleiben erhalten; „Sie sind es“ gibt die emphatische Identifizierung natürlich wieder.
