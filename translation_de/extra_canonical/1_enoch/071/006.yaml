revisions:
- from: Und mein Geist sah die Einfassung, die jenes Feuerhaus[a] umgab, und von seinen vier Seiten[c] ausgehende Flüsse voll lebendigen Feuers[b]; sie umgaben jenes Haus.
  to: Und mein Geist sah die Einfassung, die jenes Haus des Feuers[a] umgab, und Flüsse voll lebendigen Feuers[b], die von dessen vier Seiten[c] ausgingen; sie umgaben jenes Haus.
  rationale: Die Revision behebt die grammatische Inkongruenz, macht die Flüsse eindeutig zu einem weiteren Objekt des Sehens und erhält zugleich die Angabe, dass sie von den vier Seiten des Hauses ausgingen. Der Wechsel zu „Haus des Feuers“ wahrt die offene Bildlichkeit des ge'ezischen Genitivs.
