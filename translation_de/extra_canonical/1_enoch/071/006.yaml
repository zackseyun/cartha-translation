base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/006.yaml
  text: And my spirit saw the enclosure that surrounded that house of fire[a], and from its four sides were rivers full of living fire[d][c][b], and they surrounded that house.
translation:
  language: de
  text: Und mein Geist sah die Einfassung, die jenes Haus des Feuers[a] umgab, und Flüsse voll lebendigen Feuers[b], die von dessen vier Seiten[c] ausgingen; sie umgaben jenes Haus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Haus des Feuers“. Das Bild kann ein Haus aus Feuer oder ein vom Feuer bestimmtes Haus bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: „Lebendiges Feuer“ ist eine ungewöhnliche, wörtlich bewahrte Wendung. Gemeint sein kann belebtes, wirksames oder übernatürlich kraftvolles Feuer.
    reason: lexical_alternative
  - marker: c
    text: Das hier mit „Seiten“ wiedergegebene Wort kann auch äußerste Bereiche, Grenzen oder Himmelsgegenden bezeichnen; „Ecken“ ist ebenfalls möglich, aber enger.
    reason: alternative_reading
lexical_decisions:
- source_word: መንፈስየ
  choice: mein Geist
  rationale: In diesem visionären Zusammenhang bezeichnet መንፈስ den Geist des Sehers als wahrnehmendes Subjekt, nicht bloß Atem.
- source_word: አውዶ / ዘየአውዶ
  choice: die Einfassung, die … umgab
  rationale: „Einfassung“ gibt die substantivische Form ohne den nicht ausdrücklich vorhandenen Zusatz „Mauer“ wieder; das Verb „umgab“ bewahrt die Wiederholung des Motivs.
- source_word: ቤተ እሳት
  choice: Feuerhaus
  rationale: Das deutsche Kompositum bewahrt das markante Bild eines Hauses aus beziehungsweise von Feuer und bleibt natürlicher als „Haus des Feuers“.
- source_word: እምአርባዕቱ አጽናፊሁ
  choice: von seinen vier Seiten
  rationale: አጽናፍ kann Seiten, äußerste Bereiche oder Himmelsgegenden bezeichnen; „Seiten“ ist anschaulich, ohne die Bedeutung vorschnell auf Ecken festzulegen.
- source_word: አፍላገ
  choice: Flüsse
  rationale: Der Plural bezeichnet fließende Wasserläufe; „Flüsse“ entspricht der Größe der apokalyptischen Vision.
- source_word: ምሉኣነ እሳተ ሕያው
  choice: voll lebendigen Feuers
  rationale: Die ungewöhnliche Wendung wird bewusst nicht zu „loderndem Feuer“ geglättet; sie lässt offen, ob das Feuer belebt, wirksam oder übernatürlich vital gedacht ist.
- source_word: የአውድዎ
  choice: sie umgaben
  rationale: Die Wiederaufnahme des Verbs bewahrt das im Vers mehrfach hervorgehobene Motiv des Umgebens.
theological_decisions:
- issue: Art der visionären Wahrnehmung
  choice: mein Geist sah
  alternative: ich sah im Geist / meine Seele sah
  rationale: Der äthiopische Text nennt ausdrücklich den Geist als Subjekt des Sehens. Diese Formulierung bewahrt den apokalyptischen Wahrnehmungsmodus, ohne ihn psychologisch oder konfessionell festzulegen.
- issue: Syntaktische Stellung der Feuerflüsse
  choice: als zweites Objekt dessen, was der Geist sah
  alternative: 'selbstständiger Existenzsatz: „von seinen vier Seiten waren Flüsse“'
  rationale: Die Akkusativformen stützen die Anbindung der Flüsse an „sah“. „Ausgehende“ macht im Deutschen die Beziehung zu „von seinen vier Seiten“ verständlich, ohne ein nicht belegtes finites „waren“ einzusetzen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst bewahrter apokalyptischer Bildhaftigkeit. Die Wiederholung von „umgab/umgaben“ spiegelt die wiederkehrende äthiopische Wortwurzel. Der Satzbau folgt der wahrscheinlich durch die Akkusative angezeigten Objektstruktur, bleibt jedoch im Deutschen lesbar.
