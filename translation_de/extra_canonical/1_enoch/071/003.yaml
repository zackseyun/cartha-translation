base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/003.yaml
  text: And the angel Mika'el[a], one of the chief angels, took hold of my right hand and raised me up, and brought me out to all the hidden things; and he showed me all the hidden things of mercy[c][b], and he showed me all the hidden things of righteousness.
translation:
  language: de
  text: Und der Engel Michael, einer der obersten Engel,[a] ergriff meine rechte Hand, hob mich empor und führte mich hinaus zu allem Verborgenen.[b] Und er zeigte mir alles Verborgene der Barmherzigkeit, und er zeigte mir alles Verborgene der Gerechtigkeit.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „einer von den Häuptern der Engel“; auch „einer der Erzengel“ ist möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zu allen Geheimnissen“. Das äthiopische Wort bezeichnet Verborgenes oder Verheimlichtes und wird in diesem Vers mehrfach wiederholt.'
    reason: lexical_alternative
  - marker: c
    text: „Gerechtigkeit“ kann hier auch den Sinn von „Rechtschaffenheit“ haben.
    reason: lexical_alternative
lexical_decisions:
- source_word: መልአከ፡ ሚካኤል
  choice: der Engel Michael
  rationale: መልአከ bezeichnet hier eindeutig ein himmlisches Wesen. Für den Eigennamen wird die im modernen Deutschen geläufige biblische Form „Michael“ verwendet.
- source_word: ፩እምአርእስተ፡ መላእክት
  choice: einer von den obersten Engeln
  rationale: Die Wendung bedeutet wörtlich etwa „einer von den Häuptern der Engel“. „Oberste Engel“ gibt den Rang wieder, ohne vorschnell den späteren Fachausdruck „Erzengel“ einzusetzen.
- source_word: አኃዘኒ፡ እዴየ፡ ዘየማን
  choice: ergriff meine rechte Hand
  rationale: Das Verb bezeichnet das Ergreifen oder Festhalten; zusammen mit der ausdrücklichen Angabe der rechten Hand ergibt sich eine konkrete visionäre Handlung.
- source_word: አንሥአኒ
  choice: richtete mich auf
  rationale: Das Verb kann „heben“, „emporheben“ oder „aufrichten“ bedeuten. „Richtete mich auf“ ist im Deutschen natürlich und hält offen, ob eine eigentliche Erhebung oder ein Aufstehen gemeint ist.
- source_word: አውፅአኒ
  choice: führte mich hinaus
  rationale: Die Kausativform beschreibt, dass Michael Henoch hinausbringt. „Führte mich hinaus“ passt zur persönlichen Begleitung durch den Engel.
- source_word: ኀበ፡ ኵሉ፡ ኅቡአት
  choice: zu allem Verborgenen
  rationale: ኅቡአት bezeichnet Verborgenes oder Geheimnisse. Die substantivierte Form „alles Verborgene“ ist würdig, verständlich und erlaubt die Wiederholung des Leitworts.
- source_word: ኅቡአተ፡ ምሕረት
  choice: alles Verborgene der Barmherzigkeit
  rationale: Der Genitivverband verbindet das Verborgene unmittelbar mit ምሕረት. „Barmherzigkeit“ bewahrt den religiös-ethischen Gehalt genauer als bloße „Güte“.
- source_word: ኅቡአተ፡ ጽድቅ
  choice: alles Verborgene der Gerechtigkeit
  rationale: ጽድቅ umfasst Gerechtigkeit und Rechtschaffenheit. „Gerechtigkeit“ ist hier im Deutschen idiomatisch und bewahrt zugleich die moralische und richtende Dimension.
theological_decisions:
- issue: Bezeichnung des Engelrangs
  choice: einer von den obersten Engeln
  alternative: einer der Erzengel; einer von den Häuptern der Engel
  rationale: Der äthiopische Ausdruck bezeichnet eine leitende Stellung unter den Engeln, ist aber nicht zwingend ein technischer Titel. Die Übersetzung wahrt diese Offenheit.
- issue: Bedeutungsumfang von ጽድቅ
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: Beide Bedeutungsrichtungen sind möglich. In der Verbindung mit Barmherzigkeit klingt „Gerechtigkeit“ im Deutschen natürlicher, ohne die ethische Dimension auszuschließen.
- issue: Deutung des wiederholten ኅቡአት
  choice: Verborgene
  alternative: Geheimnisse
  rationale: „Verborgene“ spiegelt das wiederholte äthiopische Leitwort enger und lässt offen, ob verborgene Dinge, Bereiche oder Geheimnisse gemeint sind.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die wiederholte Formulierung „alles Verborgene“ bildet den Parallelismus des Ge’ez ab. Die Satzglieder wurden moderat gegliedert, ohne den fortschreitenden Bewegungs- und Offenbarungsablauf zu verwischen.
