base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/004.yaml
  text: And he showed me all the hidden things of the ends of heaven[a], and all the storehouses of the stars and the lights[c][b], from where they all come forth before the face of the holy ones.
translation:
  language: de
  text: Und er zeigte mir alle Geheimnisse der Enden des Himmels[a] und alle Vorratskammern der Sterne und der Lichter[b], von wo sie alle vor dem Angesicht der Heiligen[c] hervorkommen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an den äußersten Grenzen des Himmels“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „der Sterne und der Himmelslichter“. Der ge’ezische Text unterscheidet die Sterne von einer weiter gefassten Gruppe leuchtender Himmelskörper.'
    reason: lexical_alternative
  - marker: c
    text: „Vor dem Angesicht“ bedeutet hier „in der Gegenwart“. Wer mit den „Heiligen“ gemeint ist, wird nicht näher bestimmt; im Zusammenhang können himmlische heilige Wesen gemeint sein.
    reason: ambiguity
lexical_decisions:
- source_word: አርአየኒ
  choice: er zeigte mir
  rationale: Die Kausativform bezeichnet das Zeigen beziehungsweise Sehenlassen; „er zeigte mir“ ist im Deutschen natürlich und bewahrt die Struktur des Visionsberichts.
- source_word: ኵሎ ኅቡኣተ
  choice: alles Verborgene
  rationale: Die Formulierung bezeichnet die Gesamtheit verborgener Wirklichkeiten. „Alles Verborgene“ wahrt die apokalyptische Sprache, ohne sie vorschnell als Geheimlehre zu deuten.
- source_word: አጽናፈ ሰማይ
  choice: die Enden des Himmels
  rationale: Die wörtlich-räumliche Wendung bewahrt das kosmische Bild des Ausgangstextes; „Grenzen“ oder „äußerste Bereiche“ wären ebenfalls möglich.
- source_word: መዛግብተ
  choice: Vorratskammern
  rationale: Das Wort bezeichnet Schatz- oder Vorratskammern. Im kosmischen Zusammenhang macht „Vorratskammern“ die Vorstellung himmlischer Räume verständlich, aus denen Himmelserscheinungen hervortreten.
- source_word: ከዋክብት ወብርሃናት
  choice: die Sterne und die Lichter
  rationale: Die zwei Begriffe werden unterschieden wiedergegeben. „Lichter“ bleibt breit genug für weitere leuchtende Himmelskörper und vermeidet eine nicht ausdrücklich genannte nähere Bestimmung.
- source_word: ኵሎሙ
  choice: sie alle
  rationale: Das ausdrücklich vorhandene Pronomen betont, dass sämtliche zuvor genannten Sterne und Lichter hervorkommen; diese Hervorhebung wird nicht ausgelassen.
- source_word: እምኀበ ወፅኡ
  choice: von wo sie ... hervorkommen
  rationale: Die Wendung bezeichnet den Ausgangspunkt einer Bewegung. „Hervorkommen“ wahrt das Bild des Austretens aus den himmlischen Vorratskammern.
- source_word: ለገጸ ቅዱሳን
  choice: vor dem Angesicht der Heiligen
  rationale: Die nahezu wörtliche Wiedergabe erhält die semitisch geprägte Ausdrucksweise. Gemeint sein kann „in der Gegenwart der Heiligen“, ohne dass deren Identität festgelegt wird.
theological_decisions:
- issue: Identität der „Heiligen“
  choice: die Heiligen
  alternative: die Engel; die heiligen Wesen; die geheiligten Menschen
  rationale: Im henochischen Schrifttum kann die Bezeichnung himmlische heilige Wesen, aber auch Gerechte meinen. Der kosmische Zusammenhang legt einen himmlischen Bezug nahe, doch der Vers bestimmt die Gruppe nicht eindeutig; deshalb bleibt die allgemeinere Bezeichnung stehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter apokalyptischer Bildsprache. „Vorratskammern“, „Enden des Himmels“ und „vor dem Angesicht“ halten die kosmisch-semitische Textur fest; Fußnoten erläutern ungewohnte Wendungen und echte Mehrdeutigkeiten.
