base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/013.yaml
  text: And that Head of Days came with Michael and Raphael and Gabriel and Phanuel[c][b][a], and thousands and ten thousands of angels who have no number.
translation:
  language: de
  text: Und jenes Haupt der Tage[a] kam mit Michael, Raphael, Gabriel und Fanuel[b] und mit Tausenden und Zehntausenden von Engeln, die keine Zahl haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Haupt der Tage“. Der Titel wird in Anlehnung an Daniel traditionell auch mit „der Hochbetagte“ oder „der Alte an Tagen“ wiedergegeben; hier bleibt die eigenständige Formulierung des Ge'ez erhalten.
    reason: lexical_alternative
  - marker: b
    text: Die Engelnamen werden in ihren geläufigen deutschen Formen wiedergegeben; „Fanuel“ entspricht dem äthiopischen Namen, der auch als „Phanuel“ geschrieben wird.
    reason: cultural_note
lexical_decisions:
- source_word: ርእሰ መዋዕል
  choice: Haupt der Tage
  rationale: Die wörtungsnahe Wiedergabe bewahrt den eigenständigen henochischen Titel und vermeidet eine vorschnelle Angleichung an die geläufige danielische Formel „der Hochbetagte“.
- source_word: መጽአ
  choice: kam
  rationale: Das gewöhnliche Bewegungsverb wird schlicht wiedergegeben und erhält so den Ablauf der Vision.
- source_word: ምስለ
  choice: mit
  rationale: Die Präposition bezeichnet Begleitung; „mit“ ist im Deutschen natürlich und präzise.
- source_word: ሚካኤል ወሩፋኤል ወገብርኤል ወፋኑኤል
  choice: Michael, Rafael, Gabriel und Fanuel
  rationale: Die Namen werden in geläufigen modernen deutschen Formen wiedergegeben, ohne ihre Identität zu verändern; Fanuel folgt dabei der Form des äthiopischen Zeugen.
- source_word: አእላፍ ወትእልፊተ
  choice: Tausenden und Zehntausenden
  rationale: Die beiden Zahlbegriffe bleiben konkret und parallel; die Formulierung erhält die apokalyptische Häufung, statt sie zu „Myriaden“ zu glätten.
- source_word: መላእክት
  choice: Engeln
  rationale: Im himmlischen Kontext ist „Engel“ die sachlich eindeutige und natürliche Wiedergabe.
- source_word: እለ አልቦሙ ኍልቈ
  choice: die keine Zahl haben
  rationale: Die ungewöhnliche, starke Bildsprache des Ge'ez bleibt erhalten. Das idiomatischere „die nicht zu zählen sind“ wäre möglich, würde den Ausdruck jedoch glätten.
theological_decisions:
- issue: Wiedergabe des göttlichen Titels ርእሰ መዋዕል
  choice: Haupt der Tage
  alternative: der Hochbetagte / der Alte an Tagen
  rationale: Die Übersetzung folgt zunächst dem Ge'ez und bewahrt dessen auffällige Titelform. Eine traditionelle Daniel-Wiedergabe könnte eine textliche Angleichung nahelegen, die der vorliegende Wortlaut nicht erzwingt.
translation_notes:
  register: Moderner, würdiger Erzählstil. Die Reihung und die konkrete Zahlenformel bleiben bewusst erhalten; das zweite „mit“ macht im Deutschen deutlich, dass auch die unzähligen Engel das Haupt der Tage begleiten.
