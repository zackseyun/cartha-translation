base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/008.yaml
  text: And I saw angels beyond number[a], thousands of thousands and ten thousand times ten thousand, surrounding that house; and Mikael and Rufael and Gabrʾel and Fanʾuel[b], and the holy angels who are above the heavens, were going in and coming out of that house.
translation:
  language: de
  text: Und ich sah Engel, die nicht zu zählen waren[a] – Tausende von Tausenden und zehntausendmal zehntausend –, die jenes Haus umringten; auch Mikael, Rufael, Gabrʾel und Fanʾuel[b] sowie die heiligen Engel, die über den Himmeln sind, gingen in jenes Haus hinein und kamen aus ihm heraus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die gewaltige Zahlenformel ist eine typische apokalyptische Darstellung einer unzählbaren himmlischen Menge. Die Übersetzung bleibt nahe an der Formulierung des Ge’ez, statt sie durch eine geläufigere biblische Wendung zu ersetzen.
    reason: cultural_note
  - marker: b
    text: 'Die Namen sind hier nach ihren Formen im Ge’ez wiedergegeben: Mikael, Rufael, Gabrʾel und Fanʾuel. Im Deutschen sind die Schreibweisen Michael, Raphael, Gabriel und Phanuel geläufiger.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: Und ich sah
  rationale: Bewahrt den schlichten visionären Berichtsstil und gibt die übliche Wahrnehmungsformel natürlich wieder.
- source_word: መላእክተ
  choice: Engel
  rationale: Im himmlischen Kontext sind eindeutig überirdische Botenwesen gemeint; „Engel“ ist daher die präzise und geläufige Wiedergabe.
- source_word: እለ፡ ኢይትኌለቍ
  choice: die nicht zu zählen waren
  rationale: Gibt die im Ge’ez ausgedrückte Unmöglichkeit des Zählens direkt und verständlich wieder, ohne die anschließende Zahlenformel zu glätten.
- source_word: አእላፈ፡ አእላፍ
  choice: Tausende von Tausenden
  rationale: Erhält die wiederholende apokalyptische Zahlenformel in natürlichem Deutsch.
- source_word: ወትእልፊተ፡ ትእልፊት
  choice: und zehntausendmal Zehntausend
  rationale: Bildet die gewaltige Zahlenmultiplikation transparent ab, ohne sie an vertrautere Formulierungen anderer biblischer Texte anzugleichen.
- source_word: የአውድዎ፡ ለውእቱ፡ ቤት
  choice: umringten jenes Haus
  rationale: Vermittelt das räumliche Umschließen des Hauses anschaulich und wahrt den bestimmten Rückbezug von „jenes“.
- source_word: ቤት
  choice: Haus
  rationale: Der Ausgangstext bezeichnet den Ort schlicht als „Haus“; „Palast“ oder „Tempel“ wäre eine interpretierende Präzisierung.
- source_word: ሚካኤል፡ ወሩፋኤል፡ ወገብርኤል፡ ወፋኑኤል
  choice: Mikael, Rufael, Gabrʾel und Fanʾuel
  rationale: Die Namensformen werden aus dem Ge’ez transliteriert und nicht stillschweigend an die im Deutschen geläufigeren Formen angeglichen.
- source_word: መላእክተ፡ ቅዱሳን
  choice: die heiligen Engel
  rationale: Natürliche attributive Wiedergabe, welche die Kennzeichnung dieser Engelgruppe bewahrt.
- source_word: እለ፡ መልዕልተ፡ ሰማያት
  choice: die über den Himmeln sind
  rationale: Bewahrt die räumliche und kosmologische Aussage, ohne daraus ein festes Stufenschema der Himmel abzuleiten.
- source_word: ይበውኡ፡ ወይወፅኡ፡ በውእቱ፡ ቤት
  choice: gingen in jenes Haus hinein und kamen aus ihm heraus
  rationale: Gibt die beiden entgegengesetzten Bewegungen ausdrücklich wieder und vermeidet die deutsche Redewendung „ein und aus gehen“, die bloße Vertrautheit mit einem Ort bedeuten könnte.
theological_decisions:
- issue: Angleichung der Formel für die unermessliche Menge an geläufige Formulierungen aus Daniel oder der Offenbarung
  choice: Tausende von Tausenden und zehntausendmal Zehntausend
  alternative: Abertausende und Myriaden über Myriaden
  rationale: Die eigenständige Zahlenformel des Ge’ez bleibt erkennbar; vertraute kanonische oder liturgische Wendungen werden nicht in den Text zurückgetragen.
- issue: Deutung von „Haus“ als himmlischer Palast oder Tempel
  choice: Haus
  alternative: Palast oder Tempel
  rationale: Obwohl die Vision eine himmlische Hofszene zeigt, legt das Ge’ez nur „Haus“ fest. Die offenere Bildsprache wird daher nicht theologisch präzisiert.
- issue: Bezug der Wendung „über den Himmeln“
  choice: auf die heiligen Engel bezogen
  alternative: auf das Haus bezogen
  rationale: Wortstellung und Relativkonstruktion sprechen dafür, dass die heiligen Engel als diejenigen bezeichnet werden, die über den Himmeln sind; die räumliche Wendung wird nicht zum Haus verschoben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer visionärer Erzählweise. Die wiederholende apokalyptische Zahlensprache und das schlichte Bild des „Hauses“ bleiben erhalten; unnötige Archaismen und konfessionell geprägte Deutungen werden vermieden.
