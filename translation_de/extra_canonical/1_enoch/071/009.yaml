base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/071/009.yaml
  text: And there came out from that house Mikael and Rufael and Gabr'el and Fanuel, and many holy angels without number.
translation:
  language: de
  text: Und aus jenem Haus kamen Mikael, Rufael, Gabr’el und Fanuel[a] sowie viele heilige Engel ohne Zahl.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Namen sind nach ihren ge’ezischen Formen wiedergegeben; geläufiger sind im Deutschen Michael, Rafael, Gabriel und Phanuel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወወፅኡ
  choice: Und … kamen
  rationale: Das Verb bezeichnet das Heraus- oder Fortgehen. Mit der nachfolgenden Herkunftsangabe gibt »kamen … aus« die Bewegung im Deutschen natürlich wieder; das pluralische Subjekt folgt in den Namen und Engeln.
- source_word: እምኔ ውእቱ ቤት
  choice: aus jenem Haus
  rationale: እምኔ bezeichnet Herkunft oder Trennung, ቤት ein Haus und ውእቱ verweist auf einen bereits genannten bestimmten Ort. »Jenem« bewahrt diesen rückverweisenden Charakter.
- source_word: ሚካኤል … ሩፋኤል … ገብርኤል … ፋኑኤል
  choice: Mikael, Rufael, Gabr’el und Fanuel
  rationale: Die Namen werden quellennah aus ihren ge’ezischen Formen übertragen, statt durch die im Deutschen geläufigeren Formen Michael, Rafael, Gabriel und Phanuel ersetzt zu werden.
- source_word: ብዙኃን ቅዱሳን መላእክት
  choice: viele heilige Engel
  rationale: ብዙኃን und ቅዱሳን bestimmen hier መላእክት. »Viele heilige Engel« ist klar, würdig und bewahrt die apokalyptische Ausdrucksweise.
- source_word: እለ አልቦሙ ኍልቈ
  choice: ohne Zahl
  rationale: Die Relativkonstruktion besagt wörtlich, dass es für sie keine Zahl gab. »Ohne Zahl« gibt dieses Idiom knapp und gehoben wieder, ohne die Aussage abzuschwächen.
theological_decisions:
- issue: Wiedergabe von ቅዱሳን im Zusammenhang mit Engeln
  choice: heilige Engel
  alternative: Engel, die Heilige sind; heilige Wesen, Engel
  rationale: Im henochischen Sprachgebrauch kann »Heilige« himmlische Wesen bezeichnen; hier bestimmt das Wort jedoch unmittelbar »Engel«. »Heilige Engel« bewahrt den örtlichen Sinn, ohne den späteren kirchlichen Begriff der Heiligen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht gehobenem apokalyptischem Klang. Die Voranstellung »aus jenem Haus« hält die räumliche Bewegung präsent; »sowie« verhindert eine missverständliche Verschachtelung der Aufzählung.
