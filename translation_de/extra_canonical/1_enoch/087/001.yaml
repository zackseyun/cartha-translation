base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/001.yaml
  text: And again I saw them[a], and behold, they were butting one another and devouring one another[c][b], and the earth began to cry out.
translation:
  language: de
  text: 'Und wieder sah ich sie: Sie begannen[c], einander zu stoßen[a] und einander zu verschlingen[b], und die Erde begann zu schreien.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „einander zu rammen“, „zu durchbohren“ oder allgemeiner „anzugreifen“. Das Bild kämpfender Tiere ist beabsichtigt.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „einander hinunterzuschlingen“ oder „aufzuzehren“.'
    reason: lexical_alternative
  - marker: c
    text: Die wahrscheinlich zugrunde liegende äthiopische Lesung bedeutet „sie begannen“. Die vorliegende Transkription lässt sich dagegen formal auch als „während sie …“ lesen.
    reason: textual_uncertainty
lexical_decisions:
- source_word: ወካዕበ፡ ርኢክዎሙ
  choice: Und wieder sah ich sie
  rationale: Die schlichte visionäre Berichtsform und die wiederaufnehmende Erzählfolge bleiben erhalten, ohne altertümelndes „siehe“ einzufügen.
- source_word: ይወግኡ፡ ለካልኡ
  choice: einander zu stoßen
  rationale: Das Verb bezeichnet einen gewaltsamen Angriff und kann Stoßen, Rammen oder Durchbohren ausdrücken. „Stoßen“ bewahrt im Zusammenhang der Tierapokalypse das Bild kämpfender Tiere, ohne Hörner ausdrücklich in den Text einzutragen.
- source_word: ወይውሑጦ፡ ለካልኡ
  choice: und einander zu verschlingen
  rationale: „Verschlingen“ gibt sowohl das konkrete Schlucken als auch das gewaltsame Verzehren idiomatisch wieder und erhält die drastische Tierbildsprache.
- source_word: ወምድር፡ … ትጽራኅ
  choice: und die Erde begann zu schreien
  rationale: Die Erde bleibt als personifiziertes Subjekt erhalten; „schreien“ gibt den lauten Klageruf unmittelbar und natürlich wieder.
theological_decisions:
- issue: Personifizierung der Erde als Reaktion auf die Gewalt
  choice: Die Erde selbst „begann zu schreien“.
  alternative: „Von der Erde erhob sich ein Schrei“ oder „im Land entstand ein Aufruhr“.
  rationale: Der äthiopische Text stellt die Erde als handelndes Subjekt dar. Diese kosmisch-apokalyptische Bildspannung darf nicht zu einer unpersönlichen Unruhe abgeschwächt werden.
- issue: Beginn oder Verlauf des gegenseitigen Angriffs
  choice: „Sie begannen …“ im Haupttext.
  alternative: „Während sie einander stießen und verschlangen …“
  rationale: Die wahrscheinlich zugrunde liegende Lesung ist eine inchoative Konstruktion („sie begannen“); die bereitgestellte Transkription kann jedoch formal als wiederholtes እንዘ („während“) verstanden werden. Die textliche Unsicherheit wird offengelegt und nicht dogmatisch geglättet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer apokalyptischer Bildsprache. Der Doppelpunkt gliedert den erneuten Visionsbericht natürlich. Keine konfessionelle Deutung wird ergänzt; die Personifizierung der Erde und die Unsicherheit der transkribierten Verbform bleiben sichtbar.
