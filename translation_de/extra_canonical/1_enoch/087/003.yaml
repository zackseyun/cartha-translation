base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/003.yaml
  text: And those three who came out afterward seized me by my hand[a], and they lifted me up from the offspring of the earth and brought me up onto a high place, and showed me a lofty tower above the earth[d][c][b], and all the hills became low.
translation:
  language: de
  text: Und jene drei, die danach herauskamen, ergriffen mich an der Hand. Sie hoben mich von den aus der Erde Geborenen weg[a], brachten mich hinauf auf einen hohen Ort und zeigten mir einen hoch aufragenden Turm über der Erde[b]. Da wurden alle Hügel niedrig[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher als eine bloß räumliche Wiedergabe „von der Erde“ ist: „von den aus der Erde Geborenen“; möglich ist auch „von der Nachkommenschaft der Erde“.'
    reason: lexical_alternative
  - marker: b
    text: Das mit „Turm“ wiedergegebene äthiopische Wort ist schwierig; gemeint sein kann allgemeiner ein hoch aufragendes Bauwerk.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Da wurden alle Berge niedrig“ beziehungsweise „herabgesetzt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ፫እለ ወጽኡ ድኅረ
  choice: jene drei, die danach herauskamen
  rationale: Die Relativkonstruktion bezieht „die danach herauskamen“ auf die bereits bekannten drei Gestalten. „Danach“ gibt die zeitliche Folge wieder, ohne sie als „zuletzt“ festzulegen.
- source_word: አሐዙኒ በእዴየ
  choice: ergriffen mich an der Hand
  rationale: Die Wendung bezeichnet ein tatsächliches Ergreifen; der äthiopische Text nennt die Hand im Singular. Die deutsche Formulierung bewahrt die körperliche Anschaulichkeit.
- source_word: አንሥኡኒ
  choice: hoben mich … weg
  rationale: Das Verb bezeichnet ein Aufheben beziehungsweise Emporheben. Zusammen mit der folgenden Herkunftsangabe bringt „weghoben“ sowohl die vertikale Bewegung als auch die Trennung zum Ausdruck.
- source_word: እምትውልደ ምድር
  choice: von den aus der Erde Geborenen weg
  rationale: Die Formulierung bewahrt das im Ausgangstext enthaltene Bild von Geburt beziehungsweise Abstammung aus der Erde und klingt im Deutschen verständlicher als „Nachkommenschaft der Erde“.
- source_word: አልዐሉኒ ዲበ መካን ነዋኅ
  choice: brachten mich hinauf auf einen hohen Ort
  rationale: Die Übersetzung erhält sowohl das Motiv des Hinaufbringens als auch die erhöhte Lage des Ortes, ohne dem „hohen Ort“ eine kultische Bedeutung aufzudrängen.
- source_word: ማኅፈደ ነዋኅ
  choice: einen hoch aufragenden Turm
  rationale: Das schwierige Substantiv bezeichnet im Zusammenhang wahrscheinlich ein erhöhtes Bauwerk. „Turm“ gibt das naheliegende Bild wieder; „hoch aufragend“ erhält die Höhenvorstellung des Modifikators.
- source_word: ሕፁፀ ኵሉ አውግር
  choice: alle Hügel wurden niedrig
  rationale: Im topografischen Zusammenhang ist eine sichtbare Absenkung gemeint, nicht notwendig eine moralische Erniedrigung. „Hügel“ ist möglich, während „Berge“ eine ebenfalls vertretbare Alternative bleibt.
theological_decisions:
- issue: Henochs Trennung von den „aus der Erde Geborenen“
  choice: Das Geburts- und Herkunftsbild wird im Haupttext bewahrt.
  alternative: „Sie hoben mich von der Erde empor“ oder „von den Bewohnern der Erde weg“
  rationale: Eine rein räumliche Wiedergabe würde den ausdrücklichen Gedanken von Geburt beziehungsweise Abstammung einebnen. Die gewählte Fassung lässt offen, welche anthropologische oder apokalyptische Bedeutung die Bezeichnung im Visionszusammenhang trägt.
- issue: Deutung des niedriger werdenden Geländes
  choice: Die Aussage wird als visionäre topografische Veränderung wiedergegeben.
  alternative: „Alle Berge wurden erniedrigt“
  rationale: Der Kontext legt eine räumliche Wahrnehmung nahe. Die Übersetzung vermeidet es, daraus ohne sprachliche Notwendigkeit eine Aussage über moralische oder geistliche Demütigung zu machen.
translation_notes:
  register: Moderne, würdige Standardsprache mit kurzen, klaren Sätzen. Die wiederholte Aufwärtsbewegung und die anschauliche Handberührung bleiben erhalten. Ungewöhnliche Bilder des äthiopischen Textes werden nicht vorschnell geglättet; ihre wichtigsten lexikalischen Alternativen stehen in den Fußnoten.
