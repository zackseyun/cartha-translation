base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/002.yaml
  text: And again I lifted up my eyes to heaven[a], and I saw in a vision—and behold, there came out from heaven beings in the likeness of white men; and four came out from that place[d][c][b], and three with them.
translation:
  language: de
  text: 'Und wieder erhob ich meine Augen zum Himmel und sah in einer Vision – und siehe: Aus dem Himmel kamen Gestalten hervor, die in ihrer Erscheinung weißen Menschen ähnlich waren.[a] Vier kamen von jenem Ort hervor, und drei waren bei ihnen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „wie die Gestalt weißer Menschen“. Der ge''ezische Ausdruck beschreibt ihr Aussehen vergleichend und bezeichnet sie hier nicht ausdrücklich als Engel.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Zählung ist im Ge''ez unvermittelt: „Vier kamen von jenem Ort hervor, und drei bei ihnen.“ Vermutlich sind insgesamt sieben himmlische Gestalten gemeint; der Haupttext glättet die Formulierung jedoch nicht zu einer ausdrücklichen Gesamtsumme.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: አንሣእኩ አዕይንትየ ካዕበ ውስተ ሰማየ
  choice: Und wieder erhob ich meine Augen zum Himmel
  rationale: Bewahrt die wiederkehrende apokalyptische Wendung mit dem konkreten Bild des Erhebens der Augen und gibt die Richtung zum Himmel natürlich wieder.
- source_word: ወርኢኩ በራእይ
  choice: und sah in einer Vision
  rationale: Die unbestimmte Form entspricht dem artikellosen ge'ezischen Ausdruck und klingt im Deutschen natürlich.
- source_word: ወነዋ
  choice: und siehe
  rationale: Erhält den deiktischen Ausruf und den würdevollen apokalyptischen Ton.
- source_word: ወፁኡ እምሰማይ
  choice: Aus dem Himmel kamen ... hervor
  rationale: Gibt den pluralischen Bewegungsvorgang als Hervorkommen aus dem Himmel klar wieder.
- source_word: ከመ እምሳለ ሰብእ ጸዓዳ
  choice: Gestalten in der Erscheinungsform weißer Menschen
  rationale: Bewahrt die ausdrückliche Sprache der Ähnlichkeit, ohne die himmlischen Erscheinungen unmittelbar als Menschen oder Engel zu bestimmen. „Erscheinungsform“ vermittelt das visionäre Aussehen natürlicher als die schwerfällige Doppelung „wie das Abbild“.
- source_word: ፬ ወፁኡ እምውእቱ መካን
  choice: Vier kamen von jenem Ort hervor
  rationale: Behält Zahl, wiederholtes Hervorkommen und demonstrative Ortsangabe ausdrücklich bei.
- source_word: ፫ ምስሌሆሙ
  choice: und drei waren bei ihnen
  rationale: Spiegelt die knappe, unvermittelte Schlussformulierung, ohne das Verhältnis der drei zu den vier näher zu deuten.
theological_decisions:
- issue: Identität der weißen menschengestaltigen Erscheinungen
  choice: Deskriptiv als „Gestalten in der Erscheinungsform weißer Menschen“ wiedergegeben
  alternative: Engel in Menschengestalt
  rationale: Der Vers beschreibt Herkunft und Erscheinung, nennt sie aber nicht ausdrücklich Engel. Die Übersetzung wahrt diese Zurückhaltung.
- issue: Verhältnis der vier zu den drei
  choice: Die abrupte Zählung bleibt erhalten
  alternative: Sieben himmlische Gestalten kamen hervor
  rationale: Ein Gesamtumfang von sieben liegt nahe, wird syntaktisch jedoch nicht ausdrücklich als geglättete Summe formuliert.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Traditionelle Formeln wie „erhob ich meine Augen“ und „siehe“ bleiben erhalten; unnötig altertümliche Syntax wird vermieden.
