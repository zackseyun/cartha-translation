base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/087/004.yaml
  text: And they said to me[a], “Remain here until you see everything that will come upon those elephants and camels and donkeys, and upon the stars and upon the cattle[c][b], and all of them.”
translation:
  language: de
  text: 'Und sie sagten zu mir: „Bleib hier, bis du alles siehst, was über jene Elefanten, Kamele und Esel, über die Sterne, über die Rinder[a] und über sie alle kommen wird.“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „Großvieh“. Das ge’ezische Wort bezeichnet hier Rinder, nicht Schafe.'
    reason: lexical_alternative
  - marker: b
    text: Der Wortlaut lässt offen, was über diese Gestalten kommen wird. Im Zusammenhang kann ein Gericht gemeint sein, doch wird es hier nicht ausdrücklich so genannt.
    reason: alternative_reading
lexical_decisions:
- source_word: ይቤሉኒ
  choice: sie sagten zu mir
  rationale: Die gebräuchliche Erzählformel und das ausdrückliche Objektsuffix werden unmittelbar wiedergegeben.
- source_word: ንበር ዝየ
  choice: Bleib hier
  rationale: Der Imperativ bezeichnet das Verweilen an diesem Ort; „Bleib hier“ ist modern, klar und würdig.
- source_word: እስከ ትሬኢ ኵሎ ዘይመጽእ
  choice: bis du alles siehst, was … kommen wird
  rationale: Die Formulierung bewahrt sowohl die zeitliche Dauer der Anweisung als auch die Zukunftsperspektive der Vision.
- source_word: ዲበ
  choice: über
  rationale: Das wiederholte „über“ lässt offen, welcher Art das Kommende ist, und vermeidet eine nicht ausdrücklich genannte Deutung als Gericht.
- source_word: እልኩ ነጌያት
  choice: jene Elefanten
  rationale: „Jene“ erhält den deiktischen Bezug auf die bereits in der Vision wahrgenommenen Tiere.
- source_word: አግማል
  choice: Kamele
  rationale: Wörtliche Wiedergabe der Tierbezeichnung im symbolischen Bildbestand der Vision.
- source_word: አእዱግ
  choice: Esel
  rationale: Klare moderne Wiedergabe der Tierbezeichnung.
- source_word: ከዋክብት
  choice: die Sterne
  rationale: Das kosmische Bild wird wörtlich bewahrt und nicht im Haupttext als Engel oder Mächte ausgedeutet.
- source_word: አልህምታት
  choice: die Rinder
  rationale: Das Wort bezeichnet hier Rinder beziehungsweise Großvieh, nicht Schafe; diese Unterscheidung ist für die zoomorphe Symbolik wesentlich.
- source_word: ወኵሎሙ
  choice: über sie alle
  rationale: Die abschließende Zusammenfassung wird ausdrücklich erhalten und idiomatisch auf sämtliche genannten Gruppen bezogen.
theological_decisions:
- issue: Ob das kommende Geschehen ausdrücklich als Strafgericht bezeichnet werden soll
  choice: was über … kommen wird
  alternative: welches Gericht über … kommen wird
  rationale: Der ge’ezische Wortlaut benennt nicht ausdrücklich ein Gericht. Die Übersetzung erhält daher die mögliche Gerichtsdimension, ohne sie festzuschreiben.
- issue: Ob die visionären Tiere und Sterne im Haupttext entschlüsselt werden sollen
  choice: Elefanten, Kamele, Esel, Sterne und Rinder wörtlich beibehalten
  alternative: die Bilder durch vermeintlich bezeichnete geschichtliche Gruppen oder Engel ersetzen
  rationale: Der Vers bietet die Symbole selbst, nicht ihre Auslegung; die apokalyptische Bildsprache soll deshalb unverändert sichtbar bleiben.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, visionärem Ton. Die Aufzählung und die Wiederholung der Präposition werden weitgehend bewahrt; der Schlusssatz „über sie alle“ macht die umfassende Zusammenfassung im Deutschen klar.
