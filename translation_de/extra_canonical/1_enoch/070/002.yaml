revisions:
- from: 'Und danach geschah es: Sein Name wurde noch zu Lebzeiten jenes Menschensohnes zu ihm und zum Herrn der Geister emporgehoben, fort von denen, die auf dem Festland wohnen. Und er wurde auf den Wagen des Geistes emporgehoben, und ein Name ging unter ihnen hervor.[a] Von jenem Tag an wurde ich nicht mehr zu ihnen gerechnet.[b] Und er setzte mich zwischen die beiden Winde, zwischen Norden und Westen, dorthin, wo die Engel die Messschnüre nahmen, um mir den Ort für die Erwählten und die Gerechten auszumessen. Dort sah ich die ersten Väter und die Gerechten, die von Ewigkeit her an jenem Ort wohnen.'
  to: 'Und danach geschah es: Sein Name wurde noch zu Lebzeiten vor jenem Menschensohn und vor dem Herrn der Geister aus der Mitte derer, die auf dem trockenen Land wohnen, emporgehoben. Und er wurde auf Wagen des Geistes emporgehoben, und ein Name ging aus ihrer Mitte hervor.[a] Von jenem Tag an wurde ich nicht mehr in ihre Mitte gezogen.[b] Und er setzte mich zwischen die beiden Winde, zwischen Norden und Westen, dorthin, wo die Engel Messschnüre nahmen, um mir einen Ort für die Erwählten und die Gerechten auszumessen. Dort sah ich die Väter der Vorzeit und die Gerechten, die von Anbeginn der Welt an jenem Ort wohnen.'
  rationale: Die Revision folgt dem vollständigen ge'ezischen Text, korrigiert unbelegte bzw. interpretierende Zusätze und bewahrt zugleich seine syntaktischen und semantischen Spannungen. Insbesondere werden die ungewöhnliche Abfolge „sein Name“/„ein Name“, der Plural „Wagen“ und die offene Aussage über das Nicht-mehr-in-ihre-Mitte-Gezogenwerden nicht harmonisiert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:09:43Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf berücksichtigt zutreffend den vollständigen bereitgestellten ge'ezischen Wortlaut und nicht die verkürzte englische Auditfassung. Jedoch ist „zu ihm“ im ersten Satz nicht sicher gedeckt, „zu ihnen gerechnet“ glättet das Bild von „gezogen werden“ zu stark, und „von Ewigkeit her“ verstärkt den Ausdruck „von/seit der Welt“ unangemessen. Der Plural bei „Wagen“ und die auffällige Formulierung „ein Name ging ... hervor“ sollen erhalten bleiben.
  naturalness: Die Satzgliederung ist grundsätzlich verständlich und dem apokalyptischen Register angemessen. „auf dem Festland wohnen“ wirkt im heutigen Deutsch jedoch geographisch unpassend; „auf dem trockenen Land wohnen“ gibt das Bild ohne diese Nebenbedeutung wieder. „Väter der Vorzeit“ ist idiomatischer als „erste Väter“.
  terminology: „Menschensohn“, „Herr der Geister“, „Erwählte“ und „Gerechte“ sind angemessen und konsistent. „Wagen des Geistes“ ist als vorsichtige, nicht dogmatisierende Wiedergabe beizubehalten; der source_text verlangt dabei den Plural „Wagen“.
  issues:
  - severity: medium
    issue: Nicht gedecktes „zu ihm“ im ersten Satz
    rationale: Die Formulierung fügt eine eigenständige Bezugnahme auf „ihn“ ein. Die ge'ezische Konstruktion ist besser mit „vor jenem Menschensohn und vor dem Herrn der Geister“ wiederzugeben, ohne das Verhältnis weiter zu präzisieren.
  - severity: medium
    issue: „zu ihnen gerechnet“ ersetzt das Quellbild
    rationale: Für ኢተስሕብኩ ist das Bild des Ziehens/Heranziehens wesentlich. Die Deutung als Zugehörigkeitsrechnung kann in einer Anmerkung stehen, sollte aber nicht den Haupttext bestimmen.
  - severity: medium
    issue: „von Ewigkeit her“ ist zu stark
    rationale: Der Ausdruck እምዓለም bezeichnet hier die Weltzeit bzw. ihren Anfang und rechtfertigt nicht ohne Weiteres die metaphysisch stärkere Aussage „von Ewigkeit her“.
  - severity: low
    issue: „Festland“ ist im modernen Deutsch missverständlich
    rationale: Es ruft den Gegensatz zu Inseln hervor. „Trockenes Land“ erhält die konkrete Bedeutung von የብስ natürlicher.
