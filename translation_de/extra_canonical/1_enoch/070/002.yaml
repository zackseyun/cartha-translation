base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/070/002.yaml
  text: And he was lifted up on the chariot of the spirit[b][a], and his name vanished from among them.
translation:
  language: de
  text: 'Und danach geschah es: Sein Name wurde noch zu Lebzeiten vor jenem Menschensohn und vor dem Herrn der Geister aus der Mitte derer, die auf dem trockenen Land wohnen, emporgehoben. Und er wurde auf Wagen des Geistes emporgehoben, und ein Name ging aus ihrer Mitte hervor.[a] Von jenem Tag an wurde ich nicht mehr in ihre Mitte gezogen.[b] Und er setzte mich zwischen die beiden Winde, zwischen Norden und Westen, dorthin, wo die Engel Messschnüre nahmen, um mir einen Ort für die Erwählten und die Gerechten auszumessen. Dort sah ich die Väter der Vorzeit und die Gerechten, die von Anbeginn der Welt an jenem Ort wohnen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und ein Name ging aus ihrer Mitte hervor“. Der vorliegende äthiopische Wortlaut enthält weder ein Possessivsuffix („sein“) noch ein Verb mit der eindeutigen Bedeutung „verschwinden“. Andere Textformen und ältere Übersetzungen lesen sinngemäß: „und sein Name verschwand aus ihrer Mitte“.'
    reason: textual_variant
  - marker: b
    text: 'Wörtlicher: „wurde ich nicht mehr in ihre Mitte gezogen“. Das Verb kann je nach Zusammenhang auch ein Einbeziehen oder Zurechnen andeuten; der genaue Sinn bleibt offen.'
    reason: idiom
lexical_decisions:
- source_word: ተለዐለ
  choice: wurde emporgehoben
  rationale: Die passive beziehungsweise reflexive Form bezeichnet ein Hinaufsteigen oder Emporgehobenwerden. Die deutsche Wiedergabe bewahrt sowohl die räumliche Aufwärtsbewegung als auch die nicht ausdrücklich benannte Handlungsmacht.
- source_word: ሠረገላተ፡ መንፈስ
  choice: Wagen des Geistes
  rationale: ሠረገላተ steht im vorliegenden Wortlaut im Plural, während መንፈስ singularisch ist. Die formal nahe Wiedergabe vermeidet eine vorschnelle Deutung als Windwagen oder als rein inneres Visionserlebnis.
- source_word: ወወፅአ፡ ስም፡ በማእከሎሙ
  choice: und ein Name ging unter ihnen hervor
  rationale: Der bereitgestellte äthiopische Text lautet wörtlich eher ‚und ein Name ging/hervorkam unter ihnen‘ und nicht ‚sein Name verschwand aus ihrer Mitte‘. Die ungewöhnliche Formulierung und das Fehlen eines Possessivsuffixes werden bewahrt.
- source_word: ኢተስሕብኩ፡ በማእከሎሙ
  choice: wurde ich nicht mehr zu ihnen gerechnet
  rationale: Das Verb hat grundlegend den Sinn des Ziehens oder Einbeziehens; im Zusammenhang bezeichnet es idiomatisch, dass der Sprecher nicht länger ihrer Gemeinschaft zugerechnet wird.
- source_word: ክልኤቱ፡ መናፍስት
  choice: die beiden Winde
  rationale: Obwohl መናፍስት auch ‚Geister‘ bedeuten kann, bestimmen die unmittelbar folgenden Himmelsrichtungen Norden und Westen hier die Bedeutung ‚Winde‘.
- source_word: አሕባላተ
  choice: Messschnüre
  rationale: Das Substantiv bezeichnet Schnüre oder Seile. Da sie ausdrücklich zum Ausmessen eines Ortes genommen werden, ist ‚Messschnüre‘ im Deutschen sachlich und natürlich.
theological_decisions:
- issue: Art der Erhöhung Henochs
  choice: Emporgehobenwerden in einer visionär-apokalyptischen Erzählung
  alternative: körperliche Entrückung oder bloß sinnbildliche Erhöhung
  rationale: Die Übersetzung hält die Aufwärtsbewegung fest, legt aber nicht fest, ob das Geschehen körperlich, visionär oder rangbezogen zu verstehen ist.
- issue: Beziehung zwischen Henoch und dem Menschensohn
  choice: Die wechselnden Bezeichnungen und Pronomen des Quelltexts bleiben erkennbar
  alternative: Henoch und den Menschensohn ausdrücklich gleichsetzen oder ausdrücklich voneinander trennen
  rationale: Der Text erzeugt eine echte Spannung zwischen ‚jenem Menschensohn‘, ‚er‘ und dem Ich-Erzähler. Eine dogmatische Identifizierung oder Trennung wäre interpretierend.
- issue: Bewohner des für die Erwählten bestimmten Ortes
  choice: die ersten Väter und die Gerechten, die von Ewigkeit her dort wohnen
  alternative: die Erzväter und alle prädestinierten Gerechten
  rationale: Die Quellbegriffe werden ohne spätere heilsgeschichtliche oder konfessionelle Präzisierung wiedergegeben.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrtem apokalyptischem Ton. Lange äthiopische Satzketten wurden behutsam gegliedert. Ungewöhnliche Bilder und Pronomenwechsel wurden nicht harmonisiert; erklärungsbedürftige Stellen sind knapp in Fußnoten ausgewiesen.
