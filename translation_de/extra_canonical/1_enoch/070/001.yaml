base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/070/001.yaml
  text: And it came to pass after this that his name was lifted up during his lifetime before that Son of Man and before the Lord of Spirits[b][a], away from those who dwell on the dry ground.
translation:
  language: de
  text: Und es geschah danach, dass sein Name noch zu seinen Lebzeiten zu jenem Menschensohn und zum Herrn der Geister hinaufgehoben wurde[a], fort von denen, die auf dem trockenen Land wohnen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich heißt es: „Sein Name wurde hinaufgehoben.“ Die Wendung kann darauf hinweisen, dass Henoch selbst noch zu Lebzeiten in die Gegenwart des Menschensohns und des Herrn der Geister aufgenommen wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „von denen, die auf der Erde wohnen“. Das Ge''ez spricht genauer vom „trockenen Land“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተለዓለ፡
  choice: hinaufgehoben wurde
  rationale: Das Verb bezeichnet eine Bewegung oder Erhebung nach oben. „Hinaufgehoben“ bewahrt die räumliche Bildsprache und lässt offen, ob Aufnahme, Erhöhung oder beides gemeint ist.
- source_word: ስሙ፡
  choice: sein Name
  rationale: Der Wortlaut nennt ausdrücklich „seinen Namen“. Da „Name“ zugleich eng für Person und Identität stehen kann, bleibt die auffällige Formulierung im Haupttext erhalten.
- source_word: ሕያው፡
  choice: noch zu seinen Lebzeiten
  rationale: 'Die Formulierung gibt den zeitlichen Sinn natürlich wieder: Das Geschehen ereignet sich, während Henoch lebt, nicht erst nach seinem Tod.'
- source_word: በኀቤሁ፡ ለውእቱ፡ ወልደ፡ እጓለ፡ እመሕያው፡
  choice: zu jenem Menschensohn
  rationale: „Zu“ bezeichnet die Bewegung hin zu dieser Gestalt, ohne die mögliche Bedeutung „in seine Gegenwart“ auszuschließen. „Jenem“ gibt das Demonstrativ wieder.
- source_word: እግዚአ፡ መናፍስት፡
  choice: der Herr der Geister
  rationale: Dies bewahrt den etablierten feierlichen Titel im Henochbuch ohne erläuternde Umdeutung.
- source_word: እምእለ፡ የኃድሩ፡ ዲበ፡ የብስ።
  choice: fort von denen, die auf dem trockenen Land wohnen
  rationale: „Trockenes Land“ gibt የብስ konkreter wieder als das allgemeinere „Erde“ und erhält die kosmologische Bildsprache.
theological_decisions:
- issue: Ob „sein Name wurde hinaufgehoben“ wörtlich beizubehalten oder unmittelbar als Aufnahme Henochs auszulegen ist
  choice: Die Wendung „sein Name … wurde hinaufgehoben“ bleibt im Haupttext erhalten.
  alternative: „Er wurde lebend aufgenommen“ oder „sein Ansehen wurde erhöht“
  rationale: Der ge'ezische Text stellt ausdrücklich den „Namen“ heraus. Die wörtliche Wiedergabe bewahrt die mögliche Überlagerung von Name, Identität und Person und legt weder ausschließlich eine leibliche Entrückung noch bloß eine Steigerung des Ansehens fest.
- issue: Wiedergabe des Ausdrucks ወልደ እጓለ እመሕያው
  choice: jener Menschensohn
  alternative: jener Mensch; jener Sohn des Menschen
  rationale: Im Kontext der Bilderreden hat der Ausdruck den Charakter eines gewichtigen apokalyptischen Titels. Die Zusammenschreibung und Großschreibung machen diese Funktion sichtbar, ohne spätere christologische Aussagen in den Text hineinzulesen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die ungewöhnliche Rede vom hinaufgehobenen Namen und die konkrete Wendung „trockenes Land“ wurden bewusst bewahrt; die Satzstellung bleibt dennoch natürlich.
