base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/008/001.yaml
  text: 'And Azazel taught men to make swords[a], and knives, and shields, and breastplates; and he showed them what was behind them and their works: bracelets, and ornaments, and the painting of the eyes, and the beautifying of the eyelids, and every kind of costly stone[b], and all coloring tinctures.'
translation:
  language: de
  text: 'Und Azazel lehrte die Menschen, Schwerter, Messer, Schilde und Brustpanzer anzufertigen. Er zeigte ihnen, was hinter ihnen war, und ihre Werke[a]: Armreife, Schmuck, das Schminken der Augen, das Verschönern der Augenlider[b], jede Art kostbarer Steine und alle Farbstoffe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „was hinter ihnen war, und ihre Werke“ gibt eine schwierige, in der Quelle als unsicher markierte äthiopische Lesart (†ዘእምድኅሬሆሙ†) formnah wieder. Der Text könnte verderbt sein oder auf das verweisen, was aus diesen Künsten hervorging; eindeutigere Wiedergaben beruhen auf stärkerer Glättung oder Konjektur.
    reason: textual_variant
  - marker: b
    text: Die kosmetischen Ausdrücke bezeichnen wahrscheinlich Augenschminke und verwandte Praktiken der Verschönerung, nicht lediglich abstrakte „Schönheit“.
    reason: cultural_note
lexical_decisions:
- source_word: መሀሮሙ ለሰብእ
  choice: lehrte die Menschen
  rationale: Das Verb bezeichnet gewöhnlich Lehren oder Unterweisen. „Menschen“ gibt ሰብእ hier generisch und im heutigen Deutsch natürlich wieder.
- source_word: ገቢረ አሰይፍት
  choice: Schwerter anzufertigen
  rationale: ገቢረ bezeichnet das Herstellen beziehungsweise handwerkliche Arbeiten, nicht bloß den Besitz der Waffen.
- source_word: መጣብኅት
  choice: Messer
  rationale: Die breite Bezeichnung für schneidende Geräte oder Waffen vermeidet die nicht gesicherte Präzisierung als Dolche.
- source_word: ወወልታ ወድርዐ አንግድዓ
  choice: Schilde und Brustpanzer
  rationale: Dies sind klare, gegenwärtig verständliche Bezeichnungen für die genannten Schutzwaffen und Körperrüstung.
- source_word: ዘእምድኅሬሆሙ ወምግባሮሙ
  choice: was hinter ihnen war, und ihre Werke
  rationale: Die überlieferte, obelisierte Wendung ist dunkel. Die möglichst formnahe Wiedergabe bewahrt diese Unsicherheit, statt „Metalle“ oder eine andere Konjektur in den Haupttext einzutragen.
- source_word: እውቃፋተ ወስርጐ
  choice: Armreife, Schmuck
  rationale: Die Wörter bezeichnen tragbaren Zierrat; „Armreife“ ist konkreter als „Bänder“, während „Schmuck“ die Breite des zweiten Ausdrucks wahrt.
- source_word: ተጽሕሎተ
  choice: das Schminken der Augen
  rationale: Gemeint ist eine konkrete kosmetische Praxis, wahrscheinlich das Auftragen dunkler Augenschminke; „Schminken“ ist natürlich und verständlich.
- source_word: አስንዮተ ቀርንብ
  choice: das Verschönern der Augenlider
  rationale: Die Wiedergabe hält die Körperreferenz fest, ohne eine bestimmte kosmetische Technik zu ergänzen.
- source_word: እብነ እምኵሉ እብን
  choice: jede Art kostbarer Steine
  rationale: Die Formulierung bezeichnet kostbare beziehungsweise wertvolle Steine unterschiedlicher Art; der deutsche Plural ist idiomatisch.
theological_decisions:
- issue: Azazels Unterweisung als neutrales Handwerk oder verderbliche verbotene Erkenntnis
  choice: Die Verben bleiben wertungsneutral als „lehrte“ und „zeigte“; die negative Einordnung ergibt sich aus Aufzählung und Erzählkontext.
  alternative: Ausdrückliche Zusätze wie „zum Krieg“ oder „zur Verführung“.
  rationale: Der Vers selbst versieht die Künste nicht mit einem ausdrücklichen moralischen Adjektiv. Zusätze würden die im Henochkontext vorhandene negative Wertung stärker ausdeuten, als es der Wortlaut erlaubt.
- issue: Deutung der dunklen Wendung ዘእምድኅሬሆሙ
  choice: Die Unklarheit wird im Haupttext formnah bewahrt und in einer Fußnote erläutert.
  alternative: Konjekturale Glättung als „ihre Metalle und deren Bearbeitung“.
  rationale: Die vorhandene Quelle markiert die Wörter als problematisch. Eine eindeutige sachliche Auflösung wäre textkritisch unsicher und würde echte Überlieferungsspannung verdecken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Aufzählungsstruktur. Der dunkle textkritische Befund bleibt bewusst hörbar; zugleich werden die Waffen-, Schmuck- und Kosmetikbegriffe alltagssprachlich verständlich wiedergegeben.
