base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/001.yaml
  text: And they took me into a place where those who were there were like burning fire[a], and whenever they wished, they appeared like men.
translation:
  language: de
  text: Und sie brachten mich an einen Ort, an dem die dort Anwesenden wie brennendes Feuer waren, und wann immer sie wollten, zeigten sie sich in menschlicher Gestalt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „erschienen sie wie Menschen“. Das Verb kann ausdrücken, dass sie sich in menschlicher Gestalt sichtbar machten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወነሥኡኒ
  choice: Und sie brachten mich
  rationale: Das Verb bezeichnet ein Nehmen, Tragen oder Hinbringen. „Brachten mich“ gibt die visionäre Ortsveränderung natürlich wieder, ohne ihre genaue Art festzulegen.
- source_word: ውስተ አሐዱ መካን
  choice: an einen Ort
  rationale: Wörtlich steht „an/in einen Ort“. Im Deutschen bewahrt „an einen Ort“ die unbestimmte Ortsangabe und klingt zugleich natürlich.
- source_word: ኀበ እለ ሀለዉ ህየ
  choice: wo die, die dort waren
  rationale: Die Formulierung erhält den örtlichen und demonstrativen Sinn des äthiopischen Ausdrucks, ohne die dort Anwesenden näher zu bestimmen.
- source_word: ከመ እሳት ዘይነድድ
  choice: wie brennendes Feuer waren
  rationale: Die ausdrückliche Vergleichsform und das intensive Bild von Feuer, das brennt, bleiben erhalten.
- source_word: ወሶበ ይፈቅዱ
  choice: und wann immer sie wollten
  rationale: Die Wendung verbindet zeitlich wiederholte Möglichkeit mit dem Willen der Wesen. „Wann immer“ bildet diesen Sinn klar ab.
- source_word: ያስተርእዩ
  choice: zeigten sie sich
  rationale: Die causative beziehungsweise reflexive Nuance des Verbs spricht für ein sichtbares Sich-Zeigen; dies ist genauer als das bloße „erschienen“.
- source_word: ከመ ሰብእ
  choice: wie Menschen
  rationale: Der Vergleich bezieht sich auf menschliche Erscheinung oder Gestalt. Das geschlechtsübergreifende „Menschen“ ist im heutigen Deutsch die direkte und natürliche Wiedergabe.
theological_decisions:
- issue: Identität der feurigen Wesen
  choice: Die Wesen werden nur als „die, die dort waren“ bezeichnet.
  alternative: Engel, Geister oder Wächter
  rationale: Der Vers selbst benennt ihre Wesensklasse nicht. Eine nähere Identifizierung würde Kontextwissen oder Auslegung in den Text eintragen.
- issue: Art ihrer menschlichen Erscheinung
  choice: „zeigten sie sich wie Menschen“
  alternative: „erschienen sie wie Menschen“
  rationale: Die gewählte Fassung bewahrt die mögliche willentliche Selbstmanifestation, ohne festzulegen, ob sich ihr Wesen, ihre Gestalt oder lediglich ihre Sichtbarkeit veränderte.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener visionärer Bildsprache. Die Wiederholung „die, die“ ist idiomatisch möglich und spiegelt die unbestimmte Bezeichnung der Anwesenden; ihre Identität wird nicht aus dem weiteren Kontext ergänzt.
