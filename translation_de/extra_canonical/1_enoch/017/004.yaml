base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/004.yaml
  text: And they took me as far as the living waters[a], and as far as the fire of the west[c][b], which receives every setting of the sun.
translation:
  language: de
  text: Und sie brachten mich bis zu den lebendigen Wassern[a] und bis zum Feuer des Westens, das jeden Untergang der Sonne aufnimmt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nach »lebendigen Wassern« steht in der äthiopischen Ausgabe ein eingeklammertes, textlich unsicheres Wort, das etwa »die sprechen« bedeuten könnte; es ist im Haupttext nicht wiedergegeben.
    reason: textual_variant
lexical_decisions:
- source_word: ወነሥኡኒ
  choice: Und sie brachten mich
  rationale: Die Form von ነሥአ kann »nehmen, tragen, bringen« bedeuten. Im Zusammenhang der geführten Visionsreise gibt »brachten mich« die Bewegung zu einem Ziel natürlich wieder, ohne ein tatsächliches Tragen festzulegen.
- source_word: እስከ
  choice: bis zu
  rationale: Das zweimalige እስከ bezeichnet Reichweite beziehungsweise Ziel und wird durch die Wiederholung von »bis zu« formal und verständlich abgebildet.
- source_word: ማያት ሕያዋን
  choice: den lebendigen Wassern
  rationale: Die äthiopische Nominal-Adjektiv-Verbindung bedeutet wörtlich »lebendige Wasser«. Diese Wiedergabe bewahrt die Grammatik und die konkrete apokalyptische Bildsprache.
- source_word: '[ዘይትናገር]'
  choice: im Haupttext ausgelassen
  rationale: Das in der Edition eingeklammerte Wort ist textlich unsicher und ergibt nach »lebendigen Wassern« in seiner naheliegenden Bedeutung »das/die spricht/sprechen« keinen klaren Zusammenhang. Die Unsicherheit wird in einer Fußnote ausgewiesen.
- source_word: እሳት ዐረብ
  choice: das Feuer des Westens
  rationale: ዐረብ bezeichnet hier am ehesten den Westen beziehungsweise die Gegend des Sonnenuntergangs. Die genitivische Formulierung erhält den kosmisch-geografischen Charakter des Bildes.
- source_word: ዘውእቱ ይነሥእ ኵሎ ዕርበተ ፀሐይ
  choice: das jeden Untergang der Sonne aufnimmt
  rationale: Der Relativsatz schildert das westliche Feuer als dasjenige, das den jeweiligen Niedergang der Sonne empfängt beziehungsweise in sich aufnimmt. »Untergang der Sonne« bleibt näher am Vorgang als das kompaktere »Sonnenuntergang«.
theological_decisions:
- issue: Kosmische Bildsprache in Henochs Visionsreise
  choice: Die lebendigen Wasser und das Feuer des Westens werden als konkrete Orte beziehungsweise Erscheinungen der Vision beibehalten.
  alternative: Die Ausdrücke im Haupttext symbolisch deuten oder zu gewöhnlichen Naturphänomenen modernisieren.
  rationale: Der Text entfaltet visionäre kosmische Geografie. Eine Übersetzung soll ihre Fremdheit und Spannung bewahren, statt ihre Bedeutung durch eine bestimmte allegorische oder naturkundliche Erklärung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter apokalyptischer Bildsprache. Die Satzstruktur folgt dem äthiopischen Parallelismus, bleibt aber im Deutschen natürlich. Der einzige Fußnotenmarker [a] steht unmittelbar bei der betroffenen Stelle.
