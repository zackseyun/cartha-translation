base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/006.yaml
  text: And I saw great rivers[a], and I reached as far as the great darkness[c][b], and I went to where no flesh walks.
translation:
  language: de
  text: Und ich sah große Ströme, und ich gelangte bis zu der großen Finsternis, und ich ging dorthin, wo kein Fleisch wandelt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Textgestalt des äthiopischen Schlussverbs ist in der zugrunde liegenden Transkription unsicher. Wahrscheinlich ist die Negation zu lesen: „wo kein Fleisch wandelt“; dies wird durch den griechischen Text bestätigt.'
    reason: textual_variant
lexical_decisions:
- source_word: ወርኢኩ
  choice: und ich sah
  rationale: Das gewöhnliche Verb des Sehens passt zum fortlaufenden Visionsbericht und klingt im heutigen Deutschen natürlich.
- source_word: ዐበይተ አፍላገ
  choice: große Ströme
  rationale: Die Verbindung bezeichnet große Fließgewässer; „Ströme“ bewahrt die kosmisch-geografische Größe des Bildes.
- source_word: ወእስከ ዐቢይ ጽልመት በጻሕኩ
  choice: und ich gelangte bis zu der großen Finsternis
  rationale: „Bis zu“ gibt die räumliche Ausdehnung der Reise wieder; „große Finsternis“ erhält den gewichtigen apokalyptischen Ausdruck, ohne ihn auszudeuten.
- source_word: ወሖርኩ ኀበ
  choice: und ich ging dorthin
  rationale: Die schlichte Bewegungsformulierung wahrt den wiederholenden Erzählrhythmus.
- source_word: ኵሉ ሥጋ
  choice: kein Fleisch
  rationale: In Verbindung mit dem negierten Verb wird die wörtliche Struktur „alles Fleisch geht nicht“ im Deutschen idiomatisch als „kein Fleisch“ wiedergegeben. „Fleisch“ bewahrt den breiten semitischen Ausdruck.
- source_word: ኢያንሶሱ (im OCR unsicher als (አ)ያንሶሱ)
  choice: wandelt
  rationale: Die korrigierte negative Lesart wird durch den griechischen Zeugen οὐ περιπατεῖ bestätigt. „Wandelt“ gibt das Gehen/Umhergehen in würdigem biblisch-apokalyptischem Register wieder.
theological_decisions:
- issue: Umfang des Ausdrucks „alles Fleisch“
  choice: kein Fleisch
  alternative: kein Mensch / kein Lebewesen
  rationale: Die Wiedergabe bewahrt die traditionelle und bewusst weite Bezeichnung, die sowohl Menschen als auch sterbliche Lebewesen umfassen kann, ohne den Bezug vorzeitig einzuengen.
- issue: Positive oder negative Aussage des Schlussverbs
  choice: wo kein Fleisch wandelt
  alternative: wo alles Fleisch umherwandert
  rationale: Die im überlieferten OCR unsichere Initiale ist als Negationspartikel zu lesen; der griechische Parallelzeuge bestätigt ausdrücklich die Verneinung. So bleibt der Sinn eines für Sterbliche unzugänglichen Bereichs erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht biblisch-apokalyptischem Klang. „Ströme“, „Finsternis“ und „wandelt“ erhalten die Bildkraft und den traditionellen Sprachraum, bleiben aber allgemein verständlich.
