base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/003.yaml
  text: And I saw the places of the lights and of the thunder[a], in the extremities, in the depth, where there was a bow of fire, and arrows and their quiver, and a sword of fire[d][c][b], and all the lightnings.
translation:
  language: de
  text: Und ich sah die Stätten der Lichter und des Donners, in den äußersten Bereichen, in der Tiefe[a], wo es einen Bogen aus Feuer, Pfeile und ihren Köcher, ein Schwert aus Feuer und alle Blitze gab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich stehen zwei Ortsangaben nebeneinander: „in den äußersten Enden/Bereichen“ und „bei/in der Tiefe“. Auch möglich: „in den äußersten Bereichen, zur Tiefe hin“.'
    reason: Die ge’ezische Syntax und das genaue räumliche Verhältnis der beiden Wendungen sind schwer eindeutig ins Deutsche zu übertragen.
lexical_decisions:
- source_word: መካናተ
  choice: Stätten
  rationale: Das Wort bezeichnet zunächst Orte oder Stätten. Die kontextuell mögliche Deutung als kosmische Vorratskammern wird nicht in den Haupttext eingetragen, sondern als Alternative in einer Fußnote bewahrt.
- source_word: ብርሃናት
  choice: Lichter
  rationale: Der Plural bezeichnet Lichter beziehungsweise leuchtende Erscheinungen. Da Blitze am Versende eigens genannt werden, vermeidet „Lichter“ eine sachliche Vermischung.
- source_word: ነጐድጓድ
  choice: Donner
  rationale: Die natürliche deutsche Kollektivbezeichnung gibt die Wettererscheinung würdig und knapp wieder.
- source_word: ውስተ አጽናፍ
  choice: an den äußersten Enden
  rationale: Die Wendung bezeichnet Randbereiche oder äußerste Grenzen und wird als eigenständige Ortsangabe erhalten.
- source_word: ኀበ ዕመቃ
  choice: in der Tiefe
  rationale: Diese zweite Ortsangabe wird nicht mit den „äußersten Enden“ zu einer einzigen Formulierung verschmolzen; die genaue räumliche Beziehung bleibt offen.
- source_word: ቀሥተ እሳት
  choice: ein Bogen aus Feuer
  rationale: Die nahezu wörtliche Form bewahrt sowohl das Waffenbild als auch dessen apokalyptische Schärfe.
- source_word: ሐጾ
  choice: Pfeile
  rationale: Im Zusammenhang mit Bogen und Köcher ist dies die klare und sachlich passende Entsprechung.
- source_word: ምጕንጻቲሆሙ
  choice: ihr Köcher
  rationale: Das Possessivsuffix wird erhalten; „Köcher“ fügt sich eindeutig in die Waffenfolge ein.
- source_word: ሰይፈ እሳት
  choice: ein Schwert aus Feuer
  rationale: Die konkrete apokalyptische Bildsprache bleibt ohne abstrahierende Umschreibung erhalten.
- source_word: መበርቅት ኵሉ
  choice: alle Blitze
  rationale: Der Plural mit dem Totalitätsausdruck wird im Deutschen idiomatisch und vollständig wiedergegeben.
theological_decisions:
- issue: Art der kosmischen Orte
  choice: Stätten der kosmischen Erscheinungen
  alternative: Vorratskammern der kosmischen Erscheinungen
  rationale: መካናተ kann im visionären Kontext Aufbewahrungsorte meinen, bedeutet jedoch grundlegender „Orte/Stätten“. Der Haupttext wahrt diese Offenheit, während die apokalyptische Vorratskammer-Deutung in der Fußnote genannt wird.
- issue: Verhältnis der beiden Ortsangaben
  choice: „an den äußersten Enden, in der Tiefe“ als zwei aufeinanderfolgende Angaben
  alternative: „in den fernsten Tiefen“ als zusammengezogene Ortsangabe
  rationale: Der ge’ezische Text hat zwei verschiedene präpositionale Wendungen. Ihre getrennte Wiedergabe bewahrt die räumliche Spannung und vermeidet eine stillschweigende syntaktische Glättung.
- issue: Waffenbilder und Naturerscheinungen
  choice: Bogen, Pfeile, Köcher und Schwert bleiben konkrete Waffenbilder
  alternative: Paraphrase als allgemeine Sturm- oder Himmelserscheinungen
  rationale: Der Text selbst entfaltet eine Waffenfolge. Eine meteorologische Auflösung würde die visionäre Bildsprache und ihre mögliche theologische Spannung vorschnell erklären.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem visionärem Ton. Die wiederholte Satzverknüpfung und die aufzählende Bildfolge bleiben weitgehend erhalten; „dazu“ macht die deutsche Syntax lesbar, ohne die einzelnen Gegenstände zu verschmelzen.
