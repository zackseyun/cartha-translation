base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/002.yaml
  text: And they took me to a place of whirlwind[b][a], and to a mountain whose summit reached to heaven.
translation:
  language: de
  text: Und sie brachten mich an einen Ort des Wirbelsturms[a] und zu einem Berg, dessen Gipfel bis an den Himmel reichte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an einen Ort des Sturms“ beziehungsweise „des Unwetters“. Der geʿezische Ausdruck bezeichnet heftige atmosphärische Bewegung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወወሰዱኒ
  choice: Und sie brachten mich
  rationale: Das Verb bezeichnet ein Nehmen oder Führen. „Brachten mich“ gibt die Bewegung im visionären Geschehen natürlich wieder, ohne festzulegen, ob Henoch geführt oder getragen wurde.
- source_word: መካን
  choice: Ort
  rationale: Der allgemeine Ortsbegriff wird transparent und ohne zusätzliche Deutung wiedergegeben.
- source_word: ዘዐውሎ
  choice: des Wirbelsturms
  rationale: Die Wendung bewahrt das Bild heftiger, wirbelnder atmosphärischer Bewegung; die allgemeineren Möglichkeiten „Sturm“ und „Unwetter“ bleiben in der Fußnote sichtbar.
- source_word: ደብር
  choice: Berg
  rationale: „Berg“ ist in der visionären Topografie die klare und idiomatische deutsche Entsprechung.
- source_word: ዘክተማ ርእሱ
  choice: dessen Gipfel
  rationale: Die wörtliche Vorstellung vom „Kopf“ beziehungsweise oberen Ende des Berges wird im Deutschen natürlich als „Gipfel“ ausgedrückt.
- source_word: ይበጽሕ እስከ ሰማይ
  choice: bis an den Himmel reichte
  rationale: Die Formulierung erhält sowohl die vertikale Ausdehnung als auch das kosmische Bild und klingt in modernem Deutsch würdig und natürlich.
theological_decisions:
- issue: Wiedergabe von ሰማይ im Kontext einer apokalyptischen Vision
  choice: Himmel
  alternative: Himmelsgewölbe; Luftraum
  rationale: „Himmel“ wahrt die kosmische Mehrdeutigkeit des Begriffs und den apokalyptischen Ton, ohne eine spätere dogmatische Vorstellung festzuschreiben.
- issue: Richtungsangabe ውስተ vor Ort und Berg
  choice: an einen Ort … und zu einem Berg
  alternative: in einen Ort … und in einen Berg
  rationale: Die Präposition kann eine Bewegung zu einem Ziel oder hinein bezeichnen. Beim Berg würde „in einen Berg“ im Deutschen unnötig ein Betreten seines Inneren nahelegen; die zielgerichtete Bewegung wird daher idiomatisch mit „zu“ wiedergegeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper apokalyptischer Bildsprache. Die Wiederholung der Zielrichtung wird idiomatisch variiert, während die Struktur mit Ort und Berg erhalten bleibt.
