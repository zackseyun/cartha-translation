base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/017/005.yaml
  text: And I came to a river of fire[a], whose fire flowed like water, and it emptied into the great sea toward the west.
translation:
  language: de
  text: Und ich kam zu einem Feuerfluss, dessen Feuer wie Wasser floss und sich in das große Meer nach Westen hin ergoss.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Schlusswendung lautet wörtlich etwa „in Richtung ʿArab“. Sie kann die westliche Himmelsrichtung bezeichnen; möglich ist jedoch auch ein geografisches Verständnis, etwa „in Richtung Arabien“.
    reason: lexical_alternative
lexical_decisions:
- source_word: መጻእኩ
  choice: ich kam
  rationale: Die schlichte Erzählform der visionären Reise bleibt erhalten, ohne die Bewegungsrichtung näher auszudeuten.
- source_word: ፈለገ እሳት
  choice: Feuerfluss
  rationale: Die Verbindung bezeichnet einen Fluss aus Feuer. Das kompakte deutsche Wort bewahrt das konkrete, ungewöhnliche Bild.
- source_word: ዘይውሕዝ እሳቱ ከመ ማይ
  choice: dessen Feuer wie Wasser floss
  rationale: Die Relativkonstruktion, das Besitzverhältnis und der ausdrückliche Vergleich mit Wasser werden eng am Ge’ez wiedergegeben.
- source_word: ይትከዐው
  choice: sich … ergoss
  rationale: Das Verb beschreibt das Ausgießen oder Einströmen in ein größeres Gewässer; „sich ergoss“ ist im Deutschen anschaulich und idiomatisch.
- source_word: ባሕር ዐቢይ
  choice: das große Meer
  rationale: Die wörtliche und möglicherweise konventionelle geografische Bezeichnung wird beibehalten.
- source_word: መንገለ ዐረብ
  choice: nach Westen hin
  rationale: Die Wendung kann die westliche Himmelsrichtung bezeichnen; die mögliche geografische Lesart mit Bezug auf Arabien wird in der Fußnote offengehalten.
theological_decisions:
- issue: Deutung des Feuerflusses als Symbol oder als visionär wahrgenommene Landschaft
  choice: Das Bild wird als konkrete visionäre Beschreibung wiedergegeben.
  alternative: Den Feuerfluss ausdrücklich als Sinnbild des Gerichts deuten.
  rationale: Der Ausgangstext schildert die unmögliche kosmische Landschaft als etwas Geschautes. Eine symbolische Erklärung würde eine nicht ausdrücklich formulierte Deutung in den Text eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe visionäre Erzählweise und das befremdliche Bild von Feuer, das wie Wasser fließt, bleiben erhalten.
