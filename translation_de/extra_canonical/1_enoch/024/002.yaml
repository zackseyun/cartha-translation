revisions:
- from: Und ich ging in jene Richtung[a] und sah sieben herrliche Berge[b], von denen jeder anders war als der andere. Ihre Steine waren prächtig und schön; sie alle boten einen herrlichen und glanzvollen Anblick und waren schön von Angesicht[c]. Drei lagen nach Osten hin, fest einer über dem anderen, und drei nach Norden hin, fest einer über dem anderen. Dazwischen waren tiefe, gewundene Schluchten[d], von denen keine der anderen nahekam.
  to: Und ich ging auf meinem Weg weiter[a] und sah sieben herrliche Berge[b], von denen jeder anders war als der andere. Ihre Steine waren prächtig und schön; sie alle boten einen herrlichen und glanzvollen Anblick und waren schön von Angesicht[c]. Drei lagen nach Osten hin, fest übereinander angeordnet, und drei nach Norden hin, fest übereinander angeordnet, mit tiefen, gewundenen Schluchten[d], von denen keine an die andere heranreichte.
  rationale: Die Revision entfernt die nicht ausdrücklich bezeugte Ergänzung „Dazwischen“, rückt die Wiedergabe des Wegausdrucks näher an den ge’ezischen Wortlaut und glättet die Beschreibung der gestaffelten Berge. Die textkritische bzw. syntaktische Unsicherheit am Versende bleibt in der Fußnote ausgewiesen, ohne die Hauptübersetzung über die Quelle hinaus festzulegen.
