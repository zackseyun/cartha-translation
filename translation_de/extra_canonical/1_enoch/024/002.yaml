base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/024/002.yaml
  text: And I went in that direction and saw seven glorious mountains[a], each one differing from the other; and their stones were glorious and beautiful, and all of them were glorious and splendid in appearance, and fair in face. Three were toward the east, one set upon another, and three toward the north, one set upon another, with deep and winding ravines[d][c][b], no one coming near to another.
translation:
  language: de
  text: Und ich ging auf meinem Weg weiter[a] und sah sieben herrliche Berge[b], von denen jeder anders war als der andere. Ihre Steine waren prächtig und schön; sie alle boten einen herrlichen und glanzvollen Anblick und waren schön von Angesicht[c]. Drei lagen nach Osten hin, fest übereinander angeordnet, und drei nach Norden hin, fest übereinander angeordnet, mit tiefen, gewundenen Schluchten[d], von denen keine an die andere heranreichte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in jene Richtung“. Die kurze ge’ezische Wendung kann sowohl den Weg des Erzählers als auch seine Bewegungsrichtung bezeichnen.'
    reason: translation_ambiguity
  - marker: b
    text: „Herrlich“ kann hier zugleich den Gedanken von Würde, Kostbarkeit und majestätischer Pracht tragen.
    reason: lexical_note
  - marker: c
    text: 'Wörtlich: „ihr Angesicht war schön“. Die Berge werden in auffällig bildhafter, beinahe personifizierender Sprache beschrieben.'
    reason: cultural_note
  - marker: d
    text: Der ge’ezische Satzbau am Versende ist schwierig. Die femininen Formen sprechen dafür, den letzten Satzteil auf die Schluchten zu beziehen; möglicherweise beschreibt die ganze Wendung die Zwischenräume der beiden Berggruppen.
    reason: textual_ambiguity
lexical_decisions:
- source_word: ሖርኩ መንገሌሁ
  choice: ich ging in jene Richtung
  rationale: Das Bewegungsverb führt die visionäre Reise fort. መንገሌሁ lässt sich richtungsbezogen verstehen; die mögliche wörtlichere Auffassung „auf meinem Weg“ bleibt in der Fußnote erhalten.
- source_word: ሰብዐተ አድባረ ክቡራነ
  choice: sieben herrliche Berge
  rationale: አድባር bezeichnet Berge; ክቡራነ verbindet Würde, Kostbarkeit und Pracht. „Herrlich“ bewahrt den gehobenen apokalyptischen Ton.
- source_word: ወኵሉ ፩እምነ ፩እንዘ ይትዌለጥ
  choice: von denen jeder anders war als der andere
  rationale: Die Wendung bezeichnet einen Unterschied zwischen den einzelnen Bergen, ohne diesen näher zu bestimmen.
- source_word: እእባኒ ክቡራነ ወሠናያነ
  choice: ihre Steine waren prächtig und schön
  rationale: Die materielle Bildsprache des Ausgangstextes wird mit „Steine“ ausdrücklich bewahrt; ክቡራነ wird hier zur Vermeidung eintöniger Wiederholung kontextgerecht mit „prächtig“ wiedergegeben.
- source_word: ወኵሉ ክቡር ወስቡሕ ራእዮሙ
  choice: sie alle boten einen herrlichen und glanzvollen Anblick
  rationale: Die Formulierung gibt sowohl die visuelle Erscheinung als auch die gesteigerte Pracht der Berge wieder.
- source_word: ወሠናይ ገጾሙ
  choice: schön von Angesicht
  rationale: ገጽ bedeutet wörtlich „Gesicht/Angesicht“. Die ungewöhnliche, beinahe personifizierende Bildsprache wird nicht zu einem bloßen „schön anzusehen“ eingeebnet.
- source_word: ጽኑዓን ፩ዲበ ፩
  choice: fest einer über dem anderen
  rationale: ጽኑዓን trägt den Gedanken von Festigkeit oder fester Anordnung; die räumliche Staffelung „einer über dem anderen“ bleibt erhalten.
- source_word: ቈላት ዕሙቅ ወጠዋያት
  choice: tiefe, gewundene Schluchten
  rationale: Die Adjektive beschreiben die Schluchten als tief und gewunden beziehungsweise verschlungen; der Plural wird bewahrt.
- source_word: አሐቲ ለአሐቲ ኢይትቃረባ
  choice: von denen keine der anderen nahekam
  rationale: Die feminine Singularform bezieht sich am natürlichsten auf die Schluchten. Die räumliche Trennung wird wiedergegeben, ohne ein menschliches Subjekt einzuführen.
