base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/024/003.yaml
  text: And the seventh mountain was in the midst of these[a], and its height surpassed them all, resembling the seat of a throne[c][b], and fragrant trees encircled it.
translation:
  language: de
  text: Und der siebte Berg lag mitten unter diesen, und seine Höhe überragte sie alle. Er glich dem Sitz eines Thrones[a], und duftende Bäume umgaben ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dem Sitz eines Thrones“. Die doppelte Bezeichnung des Thronsitzes wird hier bewusst beibehalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ሳብዕ ደብር
  choice: der siebte Berg
  rationale: Die Ordnungszahl führt den nächsten Berg der visionären Reihe ein; „Berg“ entspricht dem Landschaftsbild.
- source_word: ማእከሎሙ ለእሎንቱ
  choice: mitten unter diesen
  rationale: Bewahrt sowohl die Mittellage als auch den demonstrativen Bezug auf die zuvor genannten Berge.
- source_word: ኖኆሙ ዘይትማሰሉ [ኵሎሙ]
  choice: seine Höhe überragte sie alle
  rationale: Die äthiopische Überlieferung ist an dieser Stelle gestört; die Formulierung folgt dem durch den griechischen Zeugen gestützten Sinn, dass der siebte Berg höher als die übrigen war.
- source_word: መንበረ አትራኖስ
  choice: Sitz eines Thrones
  rationale: Die doppelte Ausdrucksweise aus „Sitz“ und „Thron“ bleibt erhalten, statt zu bloß „Thron“ vereinfacht zu werden.
- source_word: የአውድዎ
  choice: umgaben ihn
  rationale: Natürliche deutsche Wiedergabe des Verbs für das ringsum Befinden oder Umschließen.
- source_word: ዕጸወ መዓዛ
  choice: duftende Bäume
  rationale: Gibt die konstruktive Wendung „Bäume des Duftes“ idiomatisch wieder und bewahrt den sinnlichen Akzent.
