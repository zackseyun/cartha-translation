  yaml_path: translation/extra_canonical/1_enoch/024/004.yaml
  text: And among them was a tree whose fragrance I had never smelled[a][b].
translation:
  language: de
  text: Und unter ihnen war ein Baum, dessen Duft ich noch nie gerochen hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die überlieferte Transkription ist an dieser Stelle fehlerhaft: Statt ጼወኒ ist wahrscheinlich ጼኖኩ („ich roch“) zu lesen. Auch die griechische Überlieferung hat: „den ich niemals gerochen hatte“.'
    reason: textual_variant
lexical_decisions:
- source_word: ወሀሎ
  choice: Und … war
  rationale: Die Form bezeichnet das Vorhandensein und führt die Beschreibung im Erzählfluss fort.
- source_word: እምውስቴቶሙ
  choice: unter ihnen
  rationale: Die Präpositionalfügung lokalisiert den Baum inmitten der zuvor genannten Gruppe.
- source_word: ዕፅ
  choice: ein Baum
  rationale: Im Zusammenhang der visionären Landschaft ist die konkrete Bedeutung „Baum“ angemessen.
- source_word: ዘአልቦ ገሙራ አመ ጼኖኩ
  choice: dessen Duft ich noch nie gerochen hatte
  rationale: Die korrigierte Lesung ጼኖኩ („ich roch“) und die negative Wendung ergeben den Sinn „den ich niemals gerochen hatte“. „Duft“ macht das im Deutschen erforderliche Bezugsobjekt natürlich deutlich.
theological_decisions:
- issue: Deutung der Eigenschaft des Baumes
  choice: Der Erzähler hatte den Duft des Baumes noch nie gerochen.
  alternative: Der Duft sei mit Myrrhe vergleichbar.
  rationale: Die Myrrhe-Deutung beruht auf einer fehlerhaften OCR-Lesung. Die korrigierte äthiopische Lesung entspricht dem griechischen Zeugnis und bezeichnet etwas noch nie zuvor Gerochenes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Duft“ gibt den angenehmen Geruch im botanischen Kontext idiomatisch wieder; das Plusquamperfekt wahrt die zeitliche Rückschau.
