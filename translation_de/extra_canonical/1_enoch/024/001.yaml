base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/024/001.yaml
  text: And from there I went to another place of the earth[a], and he showed me a mountain of fire that blazed day and night.
translation:
  language: de
  text: Und von dort ging ich an einen anderen Ort der Erde, und er zeigte mir[a] einen Berg aus Feuer, der Tag und Nacht loderte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Subjekt von »zeigte mir« wird im Ge’ez nicht ausdrücklich genannt; dem Zusammenhang nach ist wohl Henochs engelhafter Führer gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምህየ
  choice: von dort
  rationale: Kennzeichnet das Weiterziehen innerhalb der visionären Reise und gibt die räumliche Abfolge knapp und natürlich wieder.
- source_word: ሖርኩ
  choice: ging ich
  rationale: Entspricht dem schlichten Bewegungsverb in der Ich-Erzählung, ohne eine zusätzliche Nuance wie eine längere Reise einzutragen.
- source_word: ካልአ መካነ ምድር
  choice: an einen anderen Ort der Erde
  rationale: Bewahrt die wörtliche kosmisch-geografische Ausdrucksweise »ein anderer Ort der Erde/des Landes«; die Präposition »an« macht die Zielrichtung im Deutschen idiomatisch.
- source_word: አርአየኒ
  choice: er zeigte mir
  rationale: Gibt das gebräuchliche Verb eines Visionsberichts direkt wieder. Das männliche Subjekt ist im Vers nicht ausdrücklich benannt.
- source_word: ደብረ እሳት
  choice: einen Berg aus Feuer
  rationale: Bewahrt das eindringliche Bild der Konstruktverbindung »Berg des Feuers/Feuerberg«, ohne es lediglich als Eigenschaft des Berges abzuschwächen.
- source_word: ዘያንበለብል
  choice: der … loderte
  rationale: Die Relativkonstruktion beschreibt ein anhaltendes, intensives Brennen; »lodern« ist im Deutschen anschaulich und würdevoll.
- source_word: መዐልተ ወሌሊተ
  choice: Tag und Nacht
  rationale: Gibt das feste Zeitpaar knapp wieder und vermittelt die ununterbrochene Dauer.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt von »er zeigte mir«
  choice: Das maskuline Singularsubjekt bleibt als »er« stehen und wird durch eine Fußnote erläutert.
  alternative: »Der Engel zeigte mir« oder »mein Führer zeigte mir«
  rationale: Der Zusammenhang legt einen engelhaften Führer nahe, doch der Vers selbst benennt ihn nicht. Die Übersetzung bewahrt diese Offenheit, statt die Identität im Haupttext festzulegen.
translation_notes:
  register: Moderne, klare und zugleich würdevolle Erzählsprache. Die wiederholte einfache Satzverknüpfung mit »und« sowie das apokalyptische Bild bleiben erhalten; unnötige erklärende Zusätze werden vermieden.
