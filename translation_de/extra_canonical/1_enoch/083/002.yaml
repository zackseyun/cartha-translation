  register: Modernes, würdevolles Standarddeutsch mit leicht gehobenem Erzählton. Das eheliche Idiom der Vorlage bleibt erkennbar, während ungebräuchliche Wörtlichkeit vermieden wird. Die syntaktische Spannung und die lexikalischen Mehrdeutigkeiten werden nicht stillschweigend aufgelöst.
