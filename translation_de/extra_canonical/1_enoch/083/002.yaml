base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/002.yaml
  text: 'I saw two visions before I took a wife[a], and one of them was not like the other: the first when I was learning the book, and the second before I took your mother—I saw a mighty vision[d][c][b]; and concerning them I made supplication to the Lord.'
translation:
  language: de
  text: 'Zwei Visionen sah ich, bevor ich mir eine Frau nahm, und die eine war der anderen nicht gleich: Die erste sah ich, als ich im Buch unterwiesen wurde[a], die zweite, bevor ich deine Mutter zur Frau nahm: eine mächtige Vision[b]. Ihretwegen[c] flehte ich zum Herrn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »als ich das Buch lernte« oder »studierte«. Das Verb kann sowohl Lernen als auch Unterwiesenwerden bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: »Mächtige Vision« kann auch mit »starke« oder »schwere Vision« wiedergegeben werden; gemeint ist die besondere Intensität der Offenbarung.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »über sie«. Die Formulierung kann bedeuten, dass Henoch wegen der Visionen oder im Blick auf sie zum Herrn flehte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ክልኤተ፡ ራእየ
  choice: zwei Visionen
  rationale: Gibt die beiden visionären Erfahrungen direkt wieder und bewahrt den apokalyptischen Sprachgebrauch.
- source_word: ርኢኩ
  choice: ich sah
  rationale: Eine schlichte, natürliche Wiedergabe des visionären Berichts in der ersten Person.
- source_word: እንበለ፡ እንሣእ፡ ብእሲተ
  choice: bevor ich mir eine Frau nahm
  rationale: Bewahrt das eheliche Idiom der Vorlage, bleibt aber im Deutschen verständlich.
- source_word: ወአሐዱሂ፡ እምኔሆሙ፡ ኢይትማሰል፡ ምስለ፡ ካልኡ
  choice: und die eine war der anderen nicht gleich
  rationale: Erhält den ausdrücklichen Vergleich und die Verschiedenheit der beiden Visionen.
- source_word: አመ፡ እትሜሀር፡ መጽሐፈ
  choice: als ich das Buch studierte
  rationale: Natürliches modernes Deutsch; die mögliche Bedeutung des Lernens oder Unterwiesenwerdens wird in der Fußnote offengehalten.
- source_word: እንበለ፡ እንሥእ፡ ለእምከ
  choice: bevor ich deine Mutter zur Frau nahm
  rationale: Bewahrt sowohl die direkte familiäre Anrede als auch das eheliche Idiom.
- source_word: ራእየ፡ ጽኑዐ
  choice: eine gewaltige Vision
  rationale: Vermittelt Stärke und Intensität, ohne die Vision einseitig als furchtbar oder bedrohlich festzulegen.
- source_word: ወበእንቲአሆሙ፡ አስተብቋዕክዎ፡ ለእግዚእ
  choice: und ihretwegen flehte ich zum Herrn
  rationale: Drückt die nachdrückliche Bitte aus; die alternative Beziehung »über sie« wird in der Fußnote bewahrt.
theological_decisions:
- issue: Wiedergabe von ለእግዚእ
  choice: zum Herrn
  alternative: zum Gebieter
  rationale: Im Gebetszusammenhang bezeichnet der Ausdruck Gott. »Herr« ist die natürliche, theologisch gewichtige Wiedergabe, ohne eine spätere konfessionelle Deutung einzutragen.
- issue: Bezug von በእንቲአሆሙ
  choice: ihretwegen
  alternative: über sie / ihretwegen
  rationale: Die Hauptfassung versteht die Visionen als Anlass des Flehens; die Vorlage lässt auch einen thematischen Bezug zu, der in der Fußnote genannt wird.
