base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/011.yaml
  text: And when I went out below and saw the heaven[a], and the sun rising in the east, and the moon setting in the west, and a few stars, and the whole earth, and everything as He had known it in the beginning, then I blessed the Lord of judgment and extolled Him, because He had brought forth the sun from the windows of the east, and it ascended and rose on the face of the heaven[c][b], and set out and followed the path which He showed it.
translation:
  language: de
  text: Als ich nach unten hinausging[a] und den Himmel sah[b] und die Sonne, die im Osten aufging, und den Mond, der im Westen unterging, und einige Sterne und die ganze Erde und alles so, wie er es am Anfang erkannt hatte, da pries ich den Herrn des Gerichts und rühmte ihn; denn er hatte die Sonne aus den Fenstern des Ostens hervorgehen lassen. Sie stieg empor, erhob sich über dem Angesicht des Himmels, machte sich auf und folgte dem Weg, den er ihr gezeigt hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „hinab“ beziehungsweise „darunter“. Der genaue räumliche Bezug ergibt sich aus der weiteren Traumszene.'
    reason: lexical_alternative
  - marker: b
    text: 'Im Ge’ez steht zunächst wörtlich ein vorausweisendes Objektpronomen („ihn“) und danach „den Himmel“. Gemeint ist daher: „und den Himmel sah“.'
    reason: source_language_clarification
lexical_decisions:
- source_word: ወሶበ
  choice: Als
  rationale: Die Verbindung aus waw und der temporalen Konjunktion ሶበ eröffnet einen zeitlichen Nebensatz. Im Deutschen gibt „Als“ die einmalige Handlung natürlich wieder; der anschließende Hauptsatz mit „da“ bildet die Satzperiode klar ab.
- source_word: ወፃእኩ
  choice: ich hinausging
  rationale: Die erste Person Singular des Verbs für das Hinausgehen bezeichnet eine Bewegung aus einem vorherigen Ort heraus. „Hinausging“ bewahrt diese Richtung, ohne den Ausgangsort näher festzulegen.
- source_word: ታሕተ
  choice: nach unten
  rationale: Das räumliche Adverb kann „unten“, „hinab“ oder „darunter“ bedeuten. „Nach unten“ wahrt die räumliche Bewegung und lässt den genauen Bezug im Traum offen.
- source_word: ወርኢክዎ
  choice: und den Himmel sah
  rationale: Das suffigierte Objektpronomen ist in der vollständigen Versfortsetzung kataphorisch und wird durch „den Himmel“ erläutert. Natürliches Deutsch gibt direkt das folgende Bezugswort wieder, statt ein missverständliches selbstständiges „ihn“ zu setzen.
- source_word: እግዚአ ኵነኔ
  choice: den Herrn des Gerichts
  rationale: Die formale Wiedergabe bewahrt den richterlichen Hoheitstitel, ohne ihn konfessionell oder dogmatisch auszudeuten.
theological_decisions:
- issue: Bezug des Objektsuffixes in ወርኢክዎ
  choice: Das Suffix kataphorisch auf den anschließend genannten Himmel beziehen.
  alternative: Das Suffix als eigenständiges „ihn“ auf eine nicht genannte Gestalt beziehen.
  rationale: Die in Charles’ vollständigem Vers unmittelbar folgende Formulierung nennt den Himmel als Objekt. Dadurch wird das Suffix am besten als vorausweisendes Objektpronomen verstanden; eine geheimnisvolle männliche Gestalt wäre hier aus einem abgeschnittenen Text künstlich erschlossen.
- issue: Bezug von „er“ in „wie er es am Anfang erkannt hatte“
  choice: Das Pronomen beibehalten, ohne den Referenten im Text durch „Gott“ zu ersetzen.
  alternative: Explizit „wie Gott es am Anfang erkannt hatte“ schreiben.
  rationale: Die pronominale Form und die theologische Spannung des Ausgangstextes bleiben erhalten; der Zusammenhang legt einen göttlichen Referenten nahe, doch die Übersetzung ergänzt keinen Namen.
- issue: Herrschafts- und Gerichtstitel
  choice: „Herr des Gerichts“
  alternative: „Herr des Gerichtsverfahrens“, „Herr des Urteils“ oder „Richter“
  rationale: „Herr des Gerichts“ bildet die kompakte Titelform ab und bewahrt die mögliche Bedeutungsbreite zwischen Gerichtshandlung und Urteil.
translation_notes:
  register: Moderne, würdige Standardsprache mit einer bewusst weit gespannten Satzperiode, die den Ablauf des apokalyptischen Traums erhält. „Angesicht des Himmels“ wurde als bildhafte, quellennahe Wendung bewahrt; unnötig altertümliche Verbformen wurden vermieden. Die Übersetzung berücksichtigt die in der Revisionsnotiz belegte vollständige Fortsetzung des bei der Verserfassung abgeschnittenen Ge’ez-Textes.
