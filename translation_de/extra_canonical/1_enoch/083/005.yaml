base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/005.yaml
  text: And a word fell into my mouth because of it[a], and I lifted up a cry and said[d][c][b], “The earth is destroyed.”
translation:
  language: de
  text: 'Und deswegen fiel mir ein Wort in den Mund[a], und ich erhob einen Schrei und sagte: »Die Erde ist vernichtet.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »Und von ihm/ihm zufolge fiel ein Wort in meinen Mund.« Die einleitende Wendung kann Herkunft, Ursache oder zeitliche Folge ausdrücken; möglich sind daher auch »daraufhin« oder »von daher«.'
    reason: lexical_alternative
  - marker: b
    text: Das Verb kann auch mit »ist zugrunde gegangen« oder »ist untergegangen« wiedergegeben werden. »Ist verschlungen« beruht dagegen wahrscheinlich auf einer Verwechslung mit einem anderen Verb im vorausgehenden Vers.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምኔሁ
  choice: deswegen
  rationale: Die Präposition mit Pronominalsuffix kann Herkunft, Ursache oder zeitliche Folge bezeichnen. Im Zusammenhang der vorausgehenden Vision gibt »deswegen« den wahrscheinlichen ursächlichen beziehungsweise folgernden Sinn natürlich wieder, ohne die anderen Möglichkeiten auszuschließen.
- source_word: ወድቀ ነገር ውስተ አፉየ
  choice: fiel mir ein Wort in den Mund
  rationale: Die bildhafte und möglicherweise visionär-unwillkürliche Ausdrucksweise des Ge'ez wird bewahrt, statt sie zu einem bloßen »ich sprach« zu verflachen.
- source_word: አንሣእኩ እጽራሕ
  choice: ich erhob einen Schrei
  rationale: Die Verbindung gibt sowohl das Erheben als auch den lauten, emotionalen Ausruf wieder; sie bleibt im Deutschen verständlich und würdevoll.
- source_word: ተሐጕለት
  choice: ist vernichtet
  rationale: Der verbesserte lexikalische Befund spricht für Vernichtung beziehungsweise Untergang, nicht für »verschlungen«. So bleibt auch der bewusste Wortwechsel gegenüber dem Verb des vorausgehenden Verses erkennbar.
- source_word: ምድር
  choice: die Erde
  rationale: Im kosmisch-apokalyptischen Zusammenhang ist »Erde« naheliegender als das enger gefasste »Land«.
theological_decisions:
- issue: Reichweite von ምድር in der Flutvision
  choice: die Erde
  alternative: das Land
  rationale: Die kosmische Bildsprache der Traumvision legt die umfassende Wiedergabe nahe. Die Übersetzung entscheidet dabei nicht über spätere dogmatische Fragen zum geografischen Umfang der Flut.
- issue: Art der Äußerung
  choice: bildhafte Wendung »ein Wort fiel mir in den Mund« bewahren
  alternative: ich begann zu sprechen
  rationale: Die wörtlichere Form lässt offen, ob die Äußerung als spontan, überwältigend oder inspiriert verstanden werden soll, und löst diese Spannung nicht konfessionell auf.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die ungewöhnliche Mund-Metapher bleibt als prägnantes Merkmal des Ausgangstextes erhalten; Satzbau und Zeichensetzung sind zugleich natürlich deutsch.
