base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/006.yaml
  text: And Malyal my grandfather lifted me up while I was lying beside him[a], and he said to me, “Why do you cry out like this, my son[c][b], and why do you lament like this?”
translation:
  language: de
  text: 'Und mein Großvater Malyal[a] hob mich auf, während ich neben ihm lag, und sagte zu mir: »Warum schreist du so, mein Sohn, und warum klagst du so?«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Namensform »Malyal« entspricht wahrscheinlich dem Patriarchen Mahalalel; manche Übersetzungen geben den Namen in dieser vertrauteren Form wieder.
    reason: lexical_alternative
  - marker: b
    text: 'Der Wortlaut unterscheidet zwei verwandte Handlungen: zuerst lautes Schreien, dann Klagen oder Trauern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መላእያል
  choice: Malyal
  rationale: Die Namensform des äthiopischen Zeugen wird beibehalten und nicht stillschweigend an die geläufigere biblische Form »Mahalalel« angeglichen.
- source_word: እምሔውየ
  choice: mein Großvater
  rationale: Das Wort ist als Verwandtschaftsbezeichnung mit Suffix der ersten Person Singular zu verstehen, nicht als Ortsangabe »von dort, wo ich war«.
- source_word: አንሥአኒ
  choice: hob mich auf
  rationale: Die Form bezeichnet ein Aufheben oder Aufrichten und wird anschaulich, aber ohne zusätzliche Deutung wiedergegeben.
- source_word: እንዘ እነ እስክብ ኀቤሁ
  choice: während ich neben ihm lag
  rationale: Die Wendung beschreibt den gleichzeitigen Zustand des Liegens in seiner Nähe; Schlaf wird nicht ausdrücklich ergänzt.
- source_word: ትጸርኅ
  choice: schreist du
  rationale: Das Verb bezeichnet lautes Rufen oder Schreien; »schreien« wahrt die Intensität.
- source_word: ወልድየ
  choice: mein Sohn
  rationale: Die direkte familiäre Anrede wird in natürlichem, würdigem Deutsch wiedergegeben.
- source_word: ትአወዩ
  choice: klagst du
  rationale: Das zweite Verb bezeichnet Klagen oder Trauern und bleibt vom vorausgehenden lauten Schreien unterschieden.
theological_decisions:
- issue: Identität von መላእያል
  choice: Die äthiopische Namensform »Malyal« bleibt im Haupttext stehen.
  alternative: Normalisierung zu »Mahalalel«.
  rationale: Der unmittelbare Quellzeuge hat eine eigene Namensform. Die wahrscheinliche Identifizierung mit dem Patriarchen Mahalalel wird deshalb in einer Fußnote genannt, nicht stillschweigend in den Text eingetragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur bleibt nahe am Ge’ez, ohne im Deutschen schwerfällig zu wirken; die beiden Verben für den Gefühlsausdruck werden bewusst nicht eingeebnet.
