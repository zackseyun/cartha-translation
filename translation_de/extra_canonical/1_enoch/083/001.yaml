  source_fidelity: Die Stellung von በቅድሜከ unmittelbar vor እነግር spricht im ge'ezischen Satzbau eher dafür, dass die Wendung das abschließende Berichten betrifft, nicht das Sehen im Relativsatz. Die vorliegende deutsche Fassung übernimmt hier eine nicht hinreichend abgesicherte Umstellung aus der englischen Auditspur und legt dadurch eine unwahrscheinliche Szene fest, in der Methuselah beim Sehen der Visionen anwesend gewesen wäre. Die zweite Person ist bereits beim ersten Verb als Objekt markiert und kann beim abschließenden Mitteilungsverb im Deutschen idiomatisch als Dativ wiedergegeben werden.
  naturalness: „Und nun“ sowie „mein Sohn Metuschelach“ sind modernes, würdiges Standarddeutsch. Die Fassung „die ich vor dir gesehen habe“ klingt zwar grammatisch möglich, ist aber semantisch missverständlich. Die Umstellung zu „die ich gesehen habe; ich werde sie dir erzählen“ ist klarer und natürlich.
  terminology: „Metuschelach“ ist die gebräuchliche deutsche Namensform. „Visionen“ ist für רእያት angemessen. „zeigen“ und „erzählen“ bewahren die zwei unterschiedlichen Verben der Offenlegung, ohne eine weitergehende theologische Deutung einzutragen.
