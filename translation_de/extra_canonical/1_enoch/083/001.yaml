    issue: Bezug von „vor dir“
    rationale: Die Fußnote b und der Text binden በቅድሜከ an „gesehen habe“. Seine Stellung direkt vor dem abschließenden Verb እነግር legt jedoch näher, dass es die Mitteilung an Methuselah bestimmt. Im Deutschen ist der Empfänger bei „erzählen“ idiomatisch durch „dir“ ausgedrückt; so wird keine ungesicherte Anwesenheit Methuselahs bei den Visionen behauptet.
