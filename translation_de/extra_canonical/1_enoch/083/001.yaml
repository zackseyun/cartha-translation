base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/001.yaml
  text: And now[a], my son Methuselah, I will show you all my visions that I have seen before you; I will recount them.
translation:
  language: de
  text: Und nun, mein Sohn Metuschelach, werde ich dir alle meine Visionen zeigen, die ich gesehen habe; ich werde sie dir erzählen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Vorlage verwendet zwei unterschiedliche Verben der Mitteilung: zunächst „zeigen“, dann „erzählen“. Dadurch werden die Visionen sowohl als Geschautes als auch als mündlich Berichtetes dargestellt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: Und nun
  rationale: Bewahrt den einleitenden Übergangsmarker in natürlichem, würdigem Deutsch.
- source_word: አርእየከ፡
  choice: werde ich dir … zeigen
  rationale: Gibt das Kausativverb mit dem Objekt der zweiten Person Singular wieder und passt zur unmittelbar angekündigten Offenlegung.
- source_word: ወልድየ፡ ማቱሳላ፡
  choice: mein Sohn Metuschelach
  rationale: Erhält die persönliche Anrede; „Metuschelach“ ist eine geläufige moderne deutsche Form des Namens.
- source_word: ኵሎ፡ ራእያትየ፡
  choice: alle meine Visionen
  rationale: „Visionen“ bezeichnet anschaulich die geschauten Offenbarungen und wahrt den apokalyptischen Sprachgebrauch.
- source_word: እለ፡ ርኢኩ፡
  choice: die ich … gesehen habe
  rationale: Der Relativsatz bezieht sich auf die Visionen; das Perfekt bezeichnet vorausgegangenes Schauen, das nun berichtet wird.
- source_word: በቅድሜከ፡
  choice: vor dir
  rationale: Die knappe räumliche Formulierung folgt der Vorlage und bewahrt im Deutschen deren mögliche Bedeutungsnuancen.
- source_word: እነግር።
  choice: ich werde sie erzählen
  rationale: Das Verb bezeichnet das mündliche Berichten oder Erzählen und bleibt bewusst vom vorherigen „zeigen“ unterschieden.
theological_decisions:
- issue: Verhältnis von „zeigen“ und „erzählen“
  choice: Beide Offenlegungsverben werden ausdrücklich und verschieden wiedergegeben.
  alternative: Beide Verben zu „mitteilen“ oder „erzählen“ zusammenziehen.
  rationale: Die Vorlage verbindet ein Verb des Zeigens mit einem Verb des Erzählens. Diese Spannung zwischen visionärer Schau und mündlichem Bericht soll erhalten bleiben.
- issue: Bezug und Sinn von በቅድሜከ፡
  choice: „vor dir“ bleibt beim Relativsatz „gesehen habe“.
  alternative: Die Wendung auf das folgende Erzählen beziehen oder eindeutig als „in deiner Gegenwart“ auslegen.
  rationale: Wortstellung und unmittelbarer Zusammenhang sprechen für den Bezug auf das Sehen; die knappe Formulierung sollte semantisch nicht stärker festgelegt werden als die Quelle.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die absichtliche Wiederholung von „zeigen“ und „erzählen“ bleibt trotz ihrer leichten Sperrigkeit erhalten; das Semikolon macht die zweigliedrige Aussage lesbar.
