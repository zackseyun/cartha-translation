base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/004.yaml
  text: And when it fell upon the earth[a], I saw the earth being swallowed into a great abyss, and mountains were suspended upon mountains, and hills sank down upon hills[d][c][b], and tall trees were cut off from their trunks and were thrown down and sank into the abyss.
translation:
  language: de
  text: Und als es auf die Erde fiel, sah ich, wie die Erde von einem großen Abgrund[a] verschlungen wurde, wie Berge über Bergen schwebten[b] und Hügel über Hügel hinabsanken. Hohe Bäume wurden an ihren Stämmen abgehauen[c], niedergeworfen und versanken im Abgrund.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „eine große Tiefe“ oder „eine große Kluft“. Das geezische Wort bezeichnet eine gewaltige Tiefe; „Abgrund“ bewahrt hier die apokalyptische Bildkraft.'
    reason: lexical_alternative
  - marker: b
    text: Das ungewöhnliche Bild, dass Berge über Bergen schweben oder hängen, entspricht dem Wortlaut der Vision und wird deshalb nicht zu einem gewöhnlicheren Vorgang geglättet.
    reason: cultural_note
  - marker: c
    text: Gemeint sein kann auch, dass die Bäume von ihrem Stock oder unteren Stamm abgetrennt wurden. Der geezische Ausdruck bezeichnet ein Abhauen oder Abschneiden, nicht ausdrücklich ein Entwurzeln.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወድቅ
  choice: es fiel
  rationale: Das Imperfekt mit narrativem waw bezeichnet hier innerhalb des Traumberichts am natürlichsten ein vergangenes Ereignis; das nicht näher bestimmte Subjekt bleibt wie im Kontext erhalten.
- source_word: ትትወሐጥ
  choice: verschlungen wurde
  rationale: Die passive beziehungsweise reflexive Form zeichnet die Erde als von der Tiefe verschlungen; die bildkräftige Katastrophensprache bleibt gewahrt.
- source_word: ቀላይ ዐቢይ
  choice: ein großer Abgrund
  rationale: Die Wortgruppe bezeichnet eine gewaltige Tiefe. „Abgrund“ ist im Deutschen natürlich und bewahrt den apokalyptischen Klang.
- source_word: አድባር ዲበ አድባር ይስቀሉ
  choice: Berge über Bergen schwebten
  rationale: Das Verb bezeichnet ein Hängen oder Schweben. Die absichtlich befremdliche visionäre Vorstellung wird nicht zu einem bloßen Aufhäufen geglättet.
- source_word: አውግር ዲበ አውግር ይሰጠሙ
  choice: Hügel über Hügel hinabsanken
  rationale: Das Verb vermittelt Sinken oder Untertauchen; „hinabsanken“ erhält sowohl Bewegung als auch Katastrophenbild.
- source_word: ዕፀወ ነዋኃት
  choice: Hohe Bäume
  rationale: Das Adjektiv bezeichnet Höhe beziehungsweise Erhabenheit; „hohe Bäume“ ist klares, modernes Deutsch.
- source_word: ይትገዘሙ እምጕንዶቲሆሙ
  choice: wurden von ihren Stämmen abgehauen
  rationale: ገዘመ bedeutet schneiden, hauen oder abtrennen, nicht entwurzeln. „Von ihren Stämmen abgehauen“ gibt die gewaltsame Trennung von Stamm beziehungsweise Stock wieder, ohne Wurzeln in den Text einzutragen.
- source_word: ይትገደፉ
  choice: niedergeworfen
  rationale: Die Passivform beschreibt kräftiges Werfen oder Schleudern; „niedergeworfen“ passt zur Bewegungsrichtung und zum würdigen Register.
- source_word: ይሰጠሙ ውስተ ቀላይ
  choice: versanken in dem Abgrund
  rationale: Die Wiederaufnahme von „Abgrund“ erhält den lexikalischen und bildlichen Zusammenhang des Verses.
theological_decisions:
- issue: Charakter der kosmischen Katastrophenbilder
  choice: Die Vision wird als konkrete Auflösung der Schöpfungsordnung wiedergegeben, ohne die Bilder in der Übersetzung symbolisch umzudeuten.
  alternative: Berge, Hügel und Bäume als politische Größen deuten oder die Szene allgemein als Erdbeben beziehungsweise Flut umschreiben.
  rationale: Der Ausgangstext bietet rohe, verstörende Visionsbilder. Ihre mögliche Symbolik bleibt offen und wird nicht konfessionell oder interpretierend festgelegt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die Satzstruktur wurde leicht gegliedert, ohne die Abfolge der Bilder zu verändern. Befremdliche kosmische Motive bleiben bewusst stehen; unnötig altertümliche Wörter wurden vermieden.
