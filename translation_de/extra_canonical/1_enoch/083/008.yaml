base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/008.yaml
  text: And now[a], my son, rise and make your petition to the Lord of glory, since you are faithful[b], that a remnant may remain upon the earth and that he may not wipe out the whole earth.
translation:
  language: de
  text: Und nun, mein Sohn, steh auf und flehe den Herrn der Herrlichkeit an, denn du bist treu, damit ein Überrest auf der Erde übrig bleibe[a] und er nicht die ganze Erde vernichte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht hier eine betonte Verbindung aus verwandten Wörtern, etwa: »damit ein Rest verbleibe«. Die Wiedergabe »ein Überrest ... übrig bleibe« bewahrt den Nachdruck in natürlichem Deutsch.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተንሥእ
  choice: steh auf
  rationale: Der Imperativ bezeichnet das Sich-Erheben; »steh auf« ist im modernen Deutschen natürlich und bewahrt die Dringlichkeit der Aufforderung.
- source_word: አስተብቍዖ
  choice: flehe
  rationale: Das Verb bezeichnet eine eindringliche Bitte oder Fürbitte. »Flehe« gibt den ernsten, interzessorischen Ton knapp und würdig wieder.
- source_word: ለእግዚአ ስብሐት
  choice: zum Herrn der Herrlichkeit
  rationale: Der Genitivtitel wird formal bewahrt und nicht zum Adjektiv »herrlicher Herr« verflacht.
- source_word: መሃይምን
  choice: treu
  rationale: Das Wort kann Glauben, Zuverlässigkeit und Standhaftigkeit bezeichnen. »Treu« bewahrt diese Bedeutungsbreite, ohne sie auf bloßes Für-wahr-Halten einzuengen.
- source_word: ይትረፍ ትራፍ
  choice: ein Rest als Rest ... bleibe
  rationale: Die figura etymologica aus Verb und verwandtem Substantiv wird bewusst hörbar gemacht. Die leicht markierte Formulierung erhält den Nachdruck des ge'ezischen Ausdrucks.
- source_word: ወኢይደምስሳ ለኵላ ምድር
  choice: und er nicht die ganze Erde vernichte
  rationale: »Vernichten« gibt die Vorstellung vollständiger Zerstörung in würdigem, geläufigem Deutsch wieder; »die ganze Erde« bewahrt den universalen Umfang.
theological_decisions:
- issue: Ob መሃይምን vor allem inneren Glauben oder verlässliche Treue bezeichnet
  choice: treu
  alternative: gläubig; zuverlässig
  rationale: Im Zusammenhang begründet der Ausdruck die Eignung zur Fürbitte. »Treu« lässt Glauben und verlässliche Standhaftigkeit zugleich anklingen, ohne die Spannung einseitig aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit apokalyptisch-feierlichem Ton. Der formale Gottesname und die auffällige Wiederholung des ge'ezischen Textes bleiben erhalten; unnötig altertümliche Formen werden vermieden.
