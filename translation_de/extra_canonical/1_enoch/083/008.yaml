  verdict: revise
  source_fidelity: Die Übersetzung gibt die Imperative, den Hoheitstitel, die Begründung durch መሃይምን sowie die Bitte um Bewahrung eines Restes und gegen die Vernichtung der ganzen Erde sachgerecht wieder. Die verstärkende Verbindung ይትረፍ ትራፍ sollte jedoch nicht mit der im Deutschen unnatürlichen Formulierung „ein Rest als Rest“ nachgebildet werden.
  naturalness: „Ein Rest als Rest bleibe“ wirkt im modernen Standarddeutsch künstlich und ist ohne Fußnote kaum verständlich. „Ein Überrest ... übrig bleibe“ ist idiomatisch, wahrt die Wiederholung bzw. Verstärkung und besitzt einen angemessen würdevollen Registerton. Bei „flehen“ ist die Konstruktion mit Akkusativ und „an“ natürlicher und präziser als „zum Herrn flehen“.
  terminology: „Herr der Herrlichkeit“, „treu“, „Überrest“ und „vernichte“ sind angemessene Wiedergaben. „Überrest“ passt besonders gut zur gerichtssprachlichen Bewahrungssemantik, ohne diese konfessionell auszudeuten.
