  - severity: low
    issue: Rektion von „flehen“
    rationale: „jemanden anflehen“ ist im Deutschen die natürliche Verbindung für eindringliches Bitten an eine Person. Sie gibt die an den Herrn gerichtete Bitte klar wieder.
