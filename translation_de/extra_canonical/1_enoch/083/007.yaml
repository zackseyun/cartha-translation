base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/007.yaml
  text: 'And I told him all the vision that I had seen[a], and he said to me, “Severe is the sight you have seen, my son, and mighty is the vision of your dream: it reveals all the hidden sin of the earth[f][e][d][c][b], and it is about to sink into the abyss and be destroyed with a great destruction.”'
translation:
  language: de
  text: 'Und ich erzählte ihm die ganze Vision, die ich gesehen hatte. Da sagte er zu mir: »Schwer ist, was du gesehen hast, mein Sohn, und gewaltig ist die Vision deines Traumes: die Geheimnisse aller Sünde der Erde.[a] Sie wird in die Tiefe[b] sinken und mit gewaltiger Vernichtung zugrunde gehen.[c]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die äthiopische Wendung ist schwierig. Das Wort kann „Geheimnisse“ oder „verborgene Dinge“ bedeuten; auch eine Wiedergabe wie „die verborgene Sünde der Erde“ ist möglich. Ein ausdrückliches Verb wie „offenbaren“ steht im Text nicht eindeutig.
    reason: lexical_alternative
  - marker: b
    text: Das mit „Tiefe“ wiedergegebene Wort kann auch das Meer oder den Abgrund bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich steht eine verstärkende Verbindung aus dem Wortfeld „zugrunde gehen/vernichtet werden“, etwa: „mit großer Vernichtung zugrunde gehen“. Der Bezug von „sie“ ist in der knappen äthiopischen Syntax nicht völlig eindeutig; die Erde ist eine mögliche Deutung.'
    reason: source_idiom
lexical_decisions:
- source_word: ነገርክዎ
  choice: ich erzählte ihm
  rationale: Das Verb bezeichnet hier Henochs ausführlichen Bericht über die Vision; „erzählte ihm“ ist natürlich und wahrt den erzählerischen Zusammenhang.
- source_word: ራእየ
  choice: Vision
  rationale: Im apokalyptischen Zusammenhang bezeichnet das Wort eine visionäre Schau und nicht bloß gewöhnliches Sehen.
- source_word: ጽኑዐ
  choice: schwer
  rationale: Das Adjektiv kann Festigkeit, Härte oder Schwere ausdrücken. „Schwer“ bewahrt den unheilvollen Ernst, ohne die Bedeutung vorschnell auf „schrecklich“ festzulegen.
- source_word: ኃያለ
  choice: gewaltig
  rationale: Das Wort beschreibt die überwältigende Kraft und Tragweite der Traumvision.
- source_word: ኅቡኣተ ኵሉ ኃጢአተ ምድር
  choice: das Verborgene an der ganzen Sünde der Erde
  rationale: Die schwierige Fügung wird möglichst eng am Motiv des Verborgenen wiedergegeben. Eine ausdrückliche Aussage, die Vision „offenbare“ die Sünde, würde ein im überlieferten Wortlaut nicht klar vorhandenes Verb ergänzen.
- source_word: ትሰጠም
  choice: wird … sinken
  rationale: Das Verb vermittelt das Bild des Hinabsinkens oder Versinkens im kommenden Gericht.
- source_word: ቀላይት
  choice: die Tiefe
  rationale: Der Ausdruck kann Meer, Wassertiefe oder Abgrund bezeichnen. „Tiefe“ erhält das Wasserbild und zugleich dessen kosmisch-apokalyptischen Klang.
- source_word: ተሐጕል ኅጕለ ዐቢየ
  choice: einer gewaltigen Vernichtung anheimfallen
  rationale: Die figura etymologica aus dem Wortfeld „zugrunde gehen/vernichten“ bezeichnet umfassende Vernichtung. Die deutsche Formulierung gibt die Verstärkung idiomatisch wieder.
theological_decisions:
- issue: Bezug des Subjekts in den abschließenden Gerichtsaussagen
  choice: Die Erde wird ausdrücklich als dasjenige benannt, das in die Tiefe sinkt und vernichtet wird.
  alternative: Das Subjekt könnte unbestimmt auf die Sünde, die Vision oder das in ihr angekündigte Geschehen bezogen werden.
  rationale: Die feminine Verbform und die unmittelbar zuvor genannte Erde stützen diesen Bezug. Wegen der gedrängten Syntax bleibt die alternative Zuordnung jedoch erwähnenswert und wird nicht zu einer weitergehenden theologischen Aussage ausgebaut.
- issue: Funktion der Vision gegenüber der verborgenen Sünde
  choice: „Sie betrifft das Verborgene“
  alternative: „Sie offenbart die verborgene Sünde“ oder „sie verbirgt die Sünde“
  rationale: Der äthiopische Ausdruck ist lexikalisch und syntaktisch schwierig. Die gewählte Fassung bewahrt den Bezug, ohne der Vision eindeutig eine offenbarende oder verbergende Funktion zuzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Vision“ erhält den apokalyptischen Charakter; „anheimfallen“ hebt sich leicht vom Alltagsdeutsch ab, bleibt aber verständlich und bildet die feierliche Gerichtssprache ab.
