base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/003.yaml
  text: I was lying down in the house of my grandfather Mahalalel[a], and I saw in a vision that the heaven was being cleansed and swept away[c][b], and it fell upon the earth.
translation:
  language: de
  text: Ich lag im Haus meines Großvaters Mahalalel und sah in einer Vision, wie der Himmel zusammenstürzte, fortgerissen wurde und auf die Erde fiel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ስኩበ፡ ኮንኩ
  choice: Ich lag
  rationale: Die Umschreibung aus Partizip und Hilfsverb bezeichnet einen andauernden Zustand in der Vergangenheit. „Ich lag“ gibt diesen Hintergrund natürlich wieder, ohne ausdrücklich Schlaf vorauszusetzen.
- source_word: በቤት፡ መላሕእል፡ እምሑውየ
  choice: im Haus meines Großvaters Mahalalel
  rationale: Die Ortsangabe bleibt konkret; die Verwandtschaftsbezeichnung wird im genealogischen Zusammenhang präzise mit „Großvater“ wiedergegeben.
- source_word: ርኢኩ፡ በራእይ
  choice: sah in einer Vision
  rationale: Dies ist eine natürliche deutsche Wiedergabe der geoffenbarten Wahrnehmung und bewahrt den visionären Charakter.
- source_word: ሰማይ
  choice: der Himmel
  rationale: „Himmel“ wahrt die kosmische Dimension der apokalyptischen Szene und deckt zugleich den möglichen Bezug auf das sichtbare Himmelsgewölbe ab.
- source_word: ይትነጻጻ
  choice: zusammenstürzte
  rationale: Die Form ist in der Transkription offenbar unsicher. Im Zusammenhang mit dem anschließenden Fortgerissenwerden und Fallen ist die Deutung als Einstürzen beziehungsweise Niederstürzen am wahrscheinlichsten.
- source_word: ወይትሀየድ
  choice: fortgerissen wurde
  rationale: Die passive Form schildert gewaltsames Entfernen oder Wegtragen. „Fortgerissen“ erhält die katastrophische Bewegung des Bildes.
- source_word: ወይወድቅ፡ ዲበ፡ ምድር
  choice: und auf die Erde fiel
  rationale: Die Wendung bezeichnet die Abwärtsbewegung auf die Erde und bewahrt den kosmischen Maßstab der Vision.
theological_decisions:
- issue: Kosmischer Bezug von ሰማይ
  choice: der Himmel als kosmisches Himmelsgewölbe
  alternative: der sichtbare Himmel
  rationale: Der Zusammenhang beschreibt eine apokalyptische Welterschütterung. Das deutsche „Himmel“ bewahrt diese Weite, ohne eine übergenaue kosmologische Deutung festzuschreiben.
- issue: Deutung des umstrittenen Verbs ይትነጻጻ
  choice: zusammenstürzte
  alternative: gereinigt wurde
  rationale: Die wahrscheinlich zugrunde liegende Form gehört zum Bedeutungsfeld des Niederwerfens oder Zusammenbrechens und passt zur Folgehandlung. Wegen der unsicheren Transkription wird die abweichende Deutung in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Präteritum trägt den visionären Erzählstil; „fortgerissen“ hält die gewaltsame kosmische Bildsprache fest, ohne sie erklärend auszudeuten.
