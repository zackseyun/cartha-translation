base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/010.yaml
  text: And after this I arose and prayed and entreated and asked[a], and I wrote down my prayer for the generations of the world; and I showed you everything[b], my son Methuselah.
translation:
  language: de
  text: Danach stand ich auf, betete, flehte und bat; ich schrieb mein Gebet für die Generationen der Welt[a] nieder und werde dir alles zeigen[b], mein Sohn Metuschelach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für alle künftigen Generationen“ beziehungsweise „für die Generationen in Ewigkeit“. Die geezische Wendung kann Generationen über die gegenwärtige Zeit hinaus bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die Verbform ist textkritisch unsicher. Die hier zugrunde gelegte, häufig angenommene Korrektur lautet „ich werde dir alles zeigen“; die vorliegende Transkription kann für sich genommen auch als „er zeigte dir alles“ verstanden werden.
    reason: textual_variant
lexical_decisions:
- source_word: እምኔሁ
  choice: Danach
  rationale: Markiert knapp und natürlich den zeitlichen Übergang vom vorausgehenden Traumgeschehen.
- source_word: ተንሣእኩ
  choice: stand ich auf
  rationale: Gibt die körperliche Reaktion in heutigem, würdigem Deutsch wieder.
- source_word: ጸለይኩ ወአስተብቋዕኩ ወሰአልኩ
  choice: betete, flehte und bat
  rationale: Bewahrt die dreifache Häufung unterschiedlicher Gebetshandlungen, ohne sie stilistisch einzuebnen.
- source_word: ጸሎትየ ጸሐፍኩ
  choice: Mein Gebet schrieb ich … nieder
  rationale: „Niederschreiben“ macht deutlich, dass das Gebet schriftlich festgehalten wurde; die Voranstellung von „Mein Gebet“ wahrt den Anschluss an die Gebetshandlungen.
- source_word: ለትውልደ ዓለም
  choice: für die Generationen der Welt
  rationale: Bleibt nahe an der mehrdeutigen geezischen Wendung und legt ዓለም nicht einseitig als „Ewigkeit“ oder „Zukunft“ fest.
- source_word: ኵሎ
  choice: alles
  rationale: Natürliche umfassende Wiedergabe des Objekts.
- source_word: አርአየከ
  choice: ich zeigte dir
  rationale: Folgt der erzählerischen Vergangenheitsfolge und der konsultierten Lesart, kennzeichnet jedoch die textkritische und morphologische Unsicherheit in einer Fußnote.
- source_word: ወልድየ ማቱሳላ
  choice: mein Sohn Metuschelach
  rationale: Natürliche deutsche Anrede mit der im Deutschen geläufigen biblischen Namensform.
theological_decisions:
- issue: Zeitliche Reichweite von ለትውልደ ዓለም
  choice: für die Generationen der Welt
  alternative: für alle künftigen Generationen; für die Generationen in Ewigkeit
  rationale: Die Wendung kann Welt, Zeitalter oder zeitliche Dauer anklingen lassen. Die Hauptfassung bewahrt diese Spannung, statt den Geltungsbereich des Gebets dogmatisch festzulegen.
- issue: Zeitform und Person von አርአየከ
  choice: ich zeigte dir alles
  alternative: 'ich werde dir alles zeigen; nach der vorliegenden Konsonantenform auch: er zeigte dir alles'
  rationale: Die vorgelegte Transkription, die vermutete kritische Lesart und der Erzählzusammenhang weisen nicht eindeutig in dieselbe Richtung. Daher steht eine gut anschlussfähige Hauptlesart im Text, während die abweichenden Möglichkeiten ausdrücklich dokumentiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung „betete, flehte und bat“ erhält die eindringliche Gebetssprache des Ge'ez. Die Satzteilung vermeidet eine schwerfällige Kette, ohne die Abfolge der Handlungen zu verändern.
