base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/083/009.yaml
  text: My son[a], from heaven all this will come upon the earth[c][b], and upon the earth there will be a great destruction.
translation:
  language: de
  text: Mein Sohn, vom Himmel wird all dies[a] auf die Erde[b] kommen, und auf der Erde wird es eine große Verwüstung geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »alles« oder »alle diese Dinge«; die genaue Form und der Bezug sind in der vorliegenden äthiopischen Überlieferung nicht völlig sicher.'
    reason: lexical_alternative
  - marker: b
    text: Das mit »Erde« wiedergegebene Wort kann je nach Zusammenhang auch »Land« bedeuten; der umfassende Horizont der Vision spricht hier für »Erde«.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወልድየ
  choice: Mein Sohn
  rationale: Die Form enthält das Possessivsuffix der ersten Person. Im Zusammenhang ist sie am natürlichsten als direkte Anrede zu verstehen, nicht als Subjekt des folgenden Satzes.
- source_word: እምሰማይ
  choice: vom Himmel
  rationale: Gibt den ablativischen Ausgangspunkt knapp wieder und bewahrt die vertikale Bildsprache der Vision.
- source_word: ይሄሉ
  choice: wird … kommen
  rationale: Die Form gehört zu ሀለወ, »sein, vorhanden sein«. Zusammen mit »vom Himmel« und »auf die Erde« wird die räumliche Aussage im Deutschen idiomatisch mit »kommen« ausgedrückt; ein Verb des Sagens liegt nicht vor.
- source_word: ኵሉዝ
  choice: all dies
  rationale: Bewahrt die Totalität und den wahrscheinlichen hinweisenden Bezug auf den zuvor geschilderten Inhalt, ohne den unsicheren Referenten näher festzulegen.
- source_word: ዲበ ምድር
  choice: auf die Erde / auf der Erde
  rationale: Die zweimalige Präpositionalfügung wird entsprechend ihrer Funktion als Ziel beziehungsweise Ort natürlich wiedergegeben.
- source_word: ይከውን
  choice: wird es … geben
  rationale: Eine idiomatische deutsche Existenzkonstruktion, die gut zum folgenden Nominalausdruck passt.
- source_word: ሐጕል
  choice: Verwüstung
  rationale: Bezeichnet zerstörerischen Untergang beziehungsweise Verheerung. »Verwüstung« bewahrt die Gerichtssprache, ohne sie unnötig auf völlige Vernichtung oder militärische Zerstörung einzuengen.
- source_word: ዐቢይ
  choice: große
  rationale: Die gewöhnliche Größen- und Intensitätsangabe wird transparent wiedergegeben.
theological_decisions:
- issue: Identität von »mein Sohn«
  choice: Die familiäre Anrede wird wörtlich beibehalten und nicht als Titel gedeutet.
  alternative: »mein Kind« oder die Deutung als symbolische beziehungsweise messianische Gestalt
  rationale: Der Vers selbst bestimmt die Identität des Angeredeten nicht. Die Übersetzung lässt diese Frage daher offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede wird durch das Komma klar vom folgenden Satz getrennt. »Wird … kommen« macht die Bewegung vom Himmel zur Erde natürlich verständlich, ohne die ältere Fehlanalyse als Redeakt zu übernehmen.
