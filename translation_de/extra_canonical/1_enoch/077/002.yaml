base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/002.yaml
  text: And the wind from the west is named Hegulā[b][a], because there all the lights of heaven fade and go down.
translation:
  language: de
  text: Und der Wind aus dem Westen heißt Hegulā, weil dort alle Lichter des Himmels schwächer werden[a] und hinabgehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „abnehmen“ beziehungsweise „schwinden“. Das Verb bezeichnet ein Schwächer- oder Geringerwerden.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint ist wahrscheinlich ihr Untergehen im Westen; wörtlich: „hinabsteigen“.'
    reason: contextual_clarification
lexical_decisions:
- source_word: ነፋስ
  choice: Wind
  rationale: Im astronomischen Zusammenhang bezeichnet das Wort einen Richtungswind, nicht einen Geist.
- source_word: እምዕራብ
  choice: aus dem Westen
  rationale: Die Präposition እም bezeichnet Herkunft oder Ausgangspunkt.
- source_word: ስሙ
  choice: heißt
  rationale: Gibt die Namensformel im modernen Deutschen natürlich und knapp wieder.
- source_word: ኀጕላ
  choice: Hegulā
  rationale: Der Eigenname des Westwinds wird transliteriert und nicht übersetzt.
- source_word: በህየ
  choice: dort
  rationale: Verweist auf den unmittelbar zuvor genannten westlichen Bereich.
- source_word: የሐፅፁ
  choice: schwächer werden
  rationale: Das Verb bezeichnet hier ein Abnehmen oder Schwinden; diese Wiedergabe ist im Deutschen verständlich und legt weder bloßes Verlöschen noch ein technisches 'Abnehmen' der Mondphase fest.
- source_word: ኵሉ ብርሃናት ሰማይ
  choice: alle Lichter des Himmels
  rationale: Bewahrt das anschauliche kosmologische Bild und bleibt für heutige Leser verständlich.
- source_word: ወይወርዱ
  choice: und hinabgehen
  rationale: Bewahrt die konkrete Bedeutung des Hinabsteigens, ohne sie im Haupttext vorschnell auf den astronomischen Fachbegriff 'untergehen' zu verengen.
theological_decisions:
- issue: Technische astronomische Sprache oder breitere apokalyptisch-kosmologische Bildsprache
  choice: alle Lichter des Himmels ... schwächer werden und hinabgehen
  alternative: alle Himmelskörper ... abnehmen und untergehen
  rationale: Die Formulierung hält die anschauliche Sprache des ge'ezischen Textes fest und lässt zugleich offen, ob insbesondere Phasenabnahme, Verblassen oder das Verschwinden am westlichen Horizont gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem Ausgangstext eng, während „heißt“ und „schwächer werden“ natürliches heutiges Deutsch bieten. Der überlieferte Eigenname wird als Hegulā wiedergegeben.
