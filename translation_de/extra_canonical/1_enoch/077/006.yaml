base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/006.yaml
  text: And the two of them come from the west as far as the sea[d][c][b][a], and they pour out their waters into the Erythraean Sea in the east.
translation:
  language: de
  text: Und die beiden kommen von Westen her bis zum Meer[a] und ergießen ihre Wasser in das Erythräische Meer im Osten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis ans Meer“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier die antike Bezeichnung „Meer von Erythra“ mit der Angabe „Osten“. Gemeint sein kann das Rote Meer oder ein weiter gefasstes Erythräisches Meer der antiken Geografie.
    reason: cultural_note
lexical_decisions:
- source_word: ክልኤቱ፡ ክልኤ፡
  choice: die beiden
  rationale: Die wiederholte Zahlform hebt das Paar ausdrücklich hervor; „die beiden“ gibt dies im Deutschen natürlich und knapp wieder.
- source_word: ይመጽኡ፡
  choice: kommen
  rationale: Das gewöhnliche Bewegungsverb entspricht dem geographischen Verlauf, der hier beschrieben wird.
- source_word: እመስዕ፡
  choice: von Westen her
  rationale: Die Richtungsangabe wird hier entsprechend dem quellenkritisch revidierten Verständnis als Westen wiedergegeben; „von … her“ formuliert den Ausgangspunkt im Deutschen idiomatisch.
- source_word: እስከ፡ ባሕር፡
  choice: bis zum Meer
  rationale: Die Präposition bezeichnet die räumliche Erstreckung bis zu einem Ziel.
- source_word: ወይከዕዉ፡ ማዮሙ፡
  choice: und ergießen ihre Wasser
  rationale: „Ergießen“ bewahrt das anschauliche Bild des Ausgießens und passt zugleich natürlich zur Beschreibung von Gewässern.
- source_word: በባሕረ፡ ኤርትራ፡ እምሥራቅ።
  choice: in das Erythräische Meer im Osten
  rationale: Die Wiedergabe erhält sowohl den ausdrücklich genannten antiken Meeresnamen als auch die östliche Richtungsangabe, ohne das Gewässer vorschnell mit einer modernen geographischen Einheit gleichzusetzen.
