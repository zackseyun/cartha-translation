base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/003.yaml
  text: 'And the fourth wind[a], whose name is the North, is divided into three parts: one part for a dwelling for humankind, and another is over the seas of water of water, and over the abysses, and over the forests, and over the rivers, and over darkness, and over mist[g][f][e][d][c][b]; and the third part is in the garden of righteousness.'
translation:
  language: de
  text: 'Und der vierte Wind, dessen Name Mesʿ[a] ist, ist in drei Teile geteilt: Einer davon ist eine Wohnstätte für die Menschen; ein anderer erstreckt sich über die Meere des Wassers[b], über die Täler, über die Wildnis, über die Flüsse, über die Finsternis und über den Nebel[c]; und der dritte Teil befindet sich im Garten der Gerechtigkeit[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name „Mesʿ“ ist aus dem Ge’ez übertragen; seine Bedeutung ist unsicher. Er wurde auch als Bezeichnung des Nordens verstanden.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht hier eine auffällige Verbindung wie „Meere des Wassers“. Gemeint sein können schlicht die Meere.
    reason: lexical_alternative
  - marker: c
    text: Das zugrunde liegende Wort kann auch „Dunst“, „Wolke“ oder eine ähnliche atmosphärische Erscheinung bezeichnen.
    reason: lexical_alternative
  - marker: d
    text: Der Ausdruck kann an Eden oder das Paradies erinnern; der ge’ezische Wortlaut setzt den „Garten der Gerechtigkeit“ jedoch nicht ausdrücklich mit einem von beiden gleich.
    reason: cross_reference
lexical_decisions:
- source_word: ራብዕ ነፋስ
  choice: der vierte Wind
  rationale: Die Ordnungszahl führt den nächsten Wind in einer Reihe ein; ነፋስ bezeichnet hier im kosmologischen Zusammenhang einen Wind, nicht Geist oder Atem.
- source_word: ዘስሙ መስዕ
  choice: dessen Name Mesʿ ist
  rationale: Die Formulierung nennt ausdrücklich einen Namen. መስዕ wird wegen seiner unsicheren Bedeutung transliteriert, statt ohne eindeutige Grundlage mit „Norden“ übersetzt zu werden.
- source_word: ይትከፈል ሠለስተ ክፍለ
  choice: ist in drei Teile geteilt
  rationale: Die passive Verbform mit „drei Teile“ bezeichnet eine dreifache Aufteilung.
- source_word: ማኅደር ለሰብእ
  choice: als Wohnstätte für die Menschen bestimmt
  rationale: ማኅደር bedeutet Wohn- oder Aufenthaltsstätte. Die deutsche Fassung gibt die knappe nominale Konstruktion natürlich wieder, ohne ihren Zweckcharakter aufzugeben.
- source_word: አብሕርት ማይ
  choice: Wassermeere
  rationale: Die auffällige Verbindung von „Meere“ und „Wasser“ bleibt in kompakter deutscher Form erhalten, statt auf das bloße „Meere“ verkürzt zu werden.
- source_word: ቀላያት
  choice: Täler
  rationale: Das Wort bezeichnet wahrscheinlich Niederungen, Täler oder Schluchten; „Täler“ ist die verständlichste, nicht übermäßig präzisierende Wiedergabe.
- source_word: ፆም
  choice: Wildnis
  rationale: Gemeint ist eine öde oder wüstenartige Gegend. „Wildnis“ bewahrt den breiten geografischen Sinn.
- source_word: አፍላግ
  choice: Flüsse
  rationale: Das Wort bezeichnet Flüsse oder fließende Wasserläufe; „Flüsse“ ist hier die klare Standardwiedergabe.
- source_word: ጽልመት
  choice: Finsternis
  rationale: Die wörtliche Wiedergabe erhält die kosmische Reichweite der Aufzählung.
- source_word: ጊሜ
  choice: Nebel
  rationale: Das Wort bezeichnet offenbar eine atmosphärische Trübung; die genaue Nuance zwischen Nebel, Dunst und Wolke bleibt unsicher.
- source_word: ገነት ጽድቅ
  choice: Garten der Gerechtigkeit
  rationale: Die Genitivverbindung wird wörtlich wiedergegeben und nicht vorschnell mit Eden oder dem Paradies gleichgesetzt.
theological_decisions:
- issue: Identität des „Gartens der Gerechtigkeit“
  choice: Garten der Gerechtigkeit
  alternative: Eden oder Paradies
  rationale: Der ge’ezische Ausdruck erlaubt paradiesische Anklänge, legt aber keine bestimmte Gleichsetzung ausdrücklich fest. Die wörtliche Wiedergabe bewahrt diese Offenheit.
- issue: Deutung des Namens መስዕ
  choice: Mesʿ als Eigenname transliteriert
  alternative: Norden
  rationale: Der Quelltext formuliert „dessen Name Mesʿ ist“. Da die Bedeutung des Namens unsicher ist, wird eine mögliche Richtungsdeutung nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Die wiederholte Präposition „über“ erhält den feierlichen Aufzählungsrhythmus. Seltene oder unsichere Quellbegriffe werden nicht stillschweigend vereinheitlicht; notwendige Erläuterungen stehen in Fußnoten.
