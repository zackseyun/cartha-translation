  terminology: „Wind“, „Mesʿ“, „Täler“, „Wildnis“, „Flüsse“, „Finsternis“, „Nebel“ und „Garten der Gerechtigkeit“ sind angemessen. Der Eigenname bleibt mit Recht transliteriert; eine Deutung als Himmelsrichtung wird nicht in den Haupttext eingetragen.
