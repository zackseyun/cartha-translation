  to: 'Und der vierte Wind, dessen Name Mesʿ[a] ist, ist in drei Teile geteilt: Einer davon ist eine Wohnstätte für die Menschen; ein anderer erstreckt sich über die Meere des Wassers[b], über die Täler, über die Wildnis, über die Flüsse, über die Finsternis und über den Nebel[c]; und der dritte Teil befindet sich im Garten der Gerechtigkeit[d].'
