base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/004.yaml
  text: I saw seven high mountains[a], which are higher than all the mountains that are on the earth; and from them frost comes forth[d][c][b], and days and seasons and years pass.
translation:
  language: de
  text: Sieben hohe Berge sah ich, die höher sind als alle Berge auf der Erde. Aus ihnen geht Reif hervor, und Tage, Zeiten[a] und Jahre vergehen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Jahreszeiten“ beziehungsweise „festgesetzte Zeiten“. Das Ge''ez-Wort kann allgemein Zeiten oder Zeitabschnitte bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist, dass die kalendarischen Zeiträume verstreichen, nicht dass sie vernichtet werden.
    reason: cultural_note
lexical_decisions:
- source_word: ሰብዓተ አድባረ ነዋኃነ
  choice: sieben hohe Berge
  rationale: Die Zahl und das kosmische Bild werden unmittelbar wiedergegeben; ነዋኃነ bezeichnet hier im Vergleich mit anderen Bergen ihre Höhe.
- source_word: ርኢኩ
  choice: sah ich
  rationale: Die einfache visionäre Wahrnehmungsformel wird ohne altertümliches „schaute“ wiedergegeben. Die Voranstellung des Objekts wahrt zugleich den abrupten Einsatz des Ge'ez.
- source_word: እለ ይነውሑ እምኵሉ አድባር እለ ውስተ ምድር
  choice: die höher sind als alle Berge auf der Erde
  rationale: Die Vergleichsaussage über die Höhe und ihr umfassender irdischer Bezug bleiben ausdrücklich erhalten.
- source_word: ወእምኔሆሙ ይወፅእ አሰሐትያ
  choice: Aus ihnen geht Reif hervor
  rationale: ይወፅእ beschreibt ein Hervorgehen; „Reif“ ist für die meteorologische Erscheinung präzise und im Deutschen natürlicher als eine spekulative Umschreibung.
- source_word: ወየኀልፍ
  choice: vergehen
  rationale: Bei Zeitangaben bezeichnet das Verb das Ablaufen oder Verstreichen. „Vergehen“ ist im modernen Deutschen idiomatisch und bedeutet hier nicht Vernichtung.
- source_word: መዋዕለ ወዘመን ወዓመት
  choice: Tage, Zeiten und Jahre
  rationale: „Zeiten“ bewahrt die Breite von ዘመን, das sowohl Zeitabschnitte als auch festgesetzte oder jahreszeitliche Zeiten bezeichnen kann.
theological_decisions:
- issue: Kosmologische Funktion der sieben Berge
  choice: Die Berge werden als Orte dargestellt, aus denen Reif hervorgeht und mit denen das Vergehen kalendarischer Zeit verbunden ist, ohne den Zusammenhang näher zu erklären.
  alternative: Die Berge ausschließlich als gewöhnliche irdische Berge oder ausschließlich als symbolische Himmelsregionen zu deuten.
  rationale: Der Ge'ez-Text stellt visionäre Geografie, Wettererscheinung und Zeitablauf nebeneinander. Die Übersetzung bewahrt diese Spannung und ergänzt keinen kosmologischen Mechanismus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der erste Satz beginnt entsprechend dem Ge'ez ohne hinzugesetztes „Und“. Die Objektvoranstellung „Sieben hohe Berge sah ich“ bildet den abrupten visionären Einsatz natürlich nach.
