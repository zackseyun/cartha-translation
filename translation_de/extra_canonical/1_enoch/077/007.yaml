base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/007.yaml
  text: And the four remaining ones go out by the north side to their own sea—two of them to the Eritrean Sea[d][c][b][a], and two to the Great Sea.
translation:
  language: de
  text: 'Und die übrigen vier ziehen an der Nordseite hinaus bis zu ihrem Meer[a]: zwei bis zum Eritreischen Meer[b][d] und zwei bis zum Großen Meer[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu ihrem Meer«. Die Präposition kann sowohl die Erstreckung »bis zu« als auch die Richtung auf ein Ziel hin ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: »Eritreisches Meer« gibt den antiken geografischen Namen der äthiopischen Textüberlieferung wieder. Sein Bedeutungsumfang kann sich mit dem Gebiet überschneiden, das heute teilweise als Rotes Meer bezeichnet wird.
    reason: cultural_note
  - marker: c
    text: »Das Große Meer« ist eine traditionelle antike Bezeichnung, die gewöhnlich das Mittelmeer meint.
    reason: cultural_note
  - marker: d
    text: Die Wiederholung um »zwei … und zwei« in der Textüberlieferung kann auf eine Abschreibstörung oder auf eine nachdrückliche Zweiteilung zurückgehen. Die Übersetzung gibt den erkennbaren Sinn wieder.
    reason: textual_variant
lexical_decisions:
- source_word: እለ ተርፉ አርባዕቱ
  choice: die übrigen vier
  rationale: Die Formulierung bezeichnet die nach einer vorherigen Einteilung verbleibende, ausdrücklich gezählte Vierergruppe.
- source_word: ይወፅኡ
  choice: ziehen ... hinaus
  rationale: Die Wendung gibt die räumliche Bewegung im kosmologischen Zusammenhang natürlich wieder und bewahrt zugleich das Bild des Hervortretens.
- source_word: በገቦ መስዕ
  choice: an der Nordseite
  rationale: Die Übersetzung hält die räumliche Orientierung fest, ohne einen unsicheren astronomischen Fachbegriff einzuführen.
- source_word: እስከ ባሕረ ዚአሆሙ
  choice: bis zu ihrem Meer
  rationale: እስከ kann eine räumliche Erstreckung bis zu einem Ziel bezeichnen; ዚአሆሙ bewahrt die auffällige Zuordnung als „ihr Meer“.
- source_word: ባሕረ ኤርትራ
  choice: das Eritreische Meer
  rationale: Die historische Namensform bleibt erhalten und wird nicht vorschnell mit dem engeren modernen Begriff „Rotes Meer“ gleichgesetzt.
- source_word: ባሕር ዓቢይ
  choice: das Große Meer
  rationale: Die traditionelle antike Bezeichnung wird formal bewahrt, statt sie im Haupttext durch „Mittelmeer“ zu ersetzen.
theological_decisions:
- issue: Kosmisch-geografische Sprache im Astronomischen Buch
  choice: Die schematischen Meeresnamen und die Richtungsangabe werden beibehalten.
  alternative: Die Angaben durch moderne geografische Namen ersetzen oder allgemein von Ozeanen sprechen.
  rationale: So bleibt die apokalyptisch-kosmologische Vorstellungswelt des Textes sichtbar, ohne sie an moderne Geografie anzugleichen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche kosmisch-geografische Ausdrucksweise bleibt erhalten; die Satzstellung wurde für gute deutsche Lesbarkeit behutsam geordnet. Alle Fußnotenmarker stehen unmittelbar bei den betreffenden Ausdrücken.
