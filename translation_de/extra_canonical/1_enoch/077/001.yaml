base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/001.yaml
  text: And they call the first wind the eastern one, because it is the first; and they call the second the south, because the Most High descends there, and there especially the Blessed One descends forever.
translation:
  language: de
  text: Den ersten Wind nennen sie den östlichen[a], denn er ist der erste; und den zweiten nennen sie den Süden. Denn dort steigt der Höchste herab, und ganz besonders steigt dort der auf ewig Gepriesene herab.[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier ein mit „Morgen“ oder „Morgendämmerung“ verwandter Ausdruck, der die östliche Richtung bezeichnet.
    reason: lexical_alternative
  - marker: b
    text: Der Wortlaut der zweiten Vershälfte ist schwierig. Die ge'ezische Vorlage scheint zu sagen, dass der Süden so genannt wird, weil dort „der Höchste herabsteigt“; danach folgt eine verstärkende Wendung vor dem letzten Satzglied.
    reason: textual_variant
  - marker: c
    text: 'Die letzten Worte können auch verstanden werden als: „und dort steigt er ganz besonders herab, gepriesen in Ewigkeit“.'
    reason: previous_rendering
lexical_decisions:
- source_word: ይጼውዕዎ
  choice: nennen sie
  rationale: Das Verb bezeichnet das Benennen. Die aktive, unpersönliche Form entspricht dem darstellenden Stil des astronomischen Abschnitts.
- source_word: ለነፋስ
  choice: Wind
  rationale: Die Grundbedeutung ist „Wind“. Obwohl die Winde hier zugleich kosmische Himmelsrichtungen bezeichnen, bleibt das Bild im Haupttext erhalten.
- source_word: ቀዳማዊ
  choice: der erste
  rationale: Das Wort ist als Ordinalzahl zu verstehen; die Wiederholung der Vorlage wird beibehalten.
- source_word: ለጽባሓዊ
  choice: den östlichen
  rationale: Der Ausdruck hängt mit Morgen beziehungsweise Morgendämmerung zusammen und bezeichnet hier die östliche Richtung. Die adjektivische Wiedergabe wahrt seine Form.
- source_word: እስመ
  choice: denn
  rationale: Die kausale Konjunktion leitet die Begründung der Benennung ein.
- source_word: ለካልእ
  choice: den zweiten
  rationale: Im aufzählenden Zusammenhang ist der Ausdruck ordinal und nicht bloß als „den anderen“ zu verstehen.
- source_word: አዜብ
  choice: den Süden
  rationale: Das Wort bezeichnet den Süden beziehungsweise die südliche Region. „Süden“ ist im Deutschen klar, während die Windvorstellung durch den ersten Satzteil präsent bleibt.
- source_word: ልዑል
  choice: der Höchste
  rationale: Der göttliche Titel wird mit der im Deutschen natürlichen und traditionsübergreifend verständlichen Entsprechung wiedergegeben.
- source_word: ህየ
  choice: dort
  rationale: Das Ortsadverb verweist auf die südliche Region. Seine Wiederholung wird im Deutschen bewahrt.
- source_word: ይወርድ
  choice: steigt … herab
  rationale: Das Verb bezeichnet eine Bewegung nach unten. Die Wiedergabe bewahrt die vertikale, theophanische Bildsprache.
- source_word: ወፈድፋደ
  choice: und ganz besonders
  rationale: Die schwierige Form scheint die wiederholte Aussage zu verstärken oder zu steigern. Die Übersetzung gibt diese Funktion wieder, ohne eine unsichere engere Bedeutung festzulegen.
- source_word: ቡሩክ፡ ለዓለም
  choice: der auf ewig Gepriesene
  rationale: Die Wortgruppe wird als substantivischer göttlicher Titel und als ausdrückliches Subjekt des zweiten „steigt herab“ verstanden, parallel zu „der Höchste“.
theological_decisions:
- issue: Ob das Herabsteigen des Höchsten wörtlich wiederzugeben oder als Aussage über herabgesandten Segen beziehungsweise Hitze zu glätten ist
  choice: „dort steigt der Höchste herab“
  alternative: „dort lässt der Höchste [Segen/Hitze] herabkommen“
  rationale: Die ge'ezische Vorlage gebraucht ausdrücklich das Verb „herabsteigen“ mit dem göttlichen Titel. Die apokalyptische Vorstellung göttlicher Bewegung wird nicht rationalisierend aufgelöst.
- issue: Syntaktische Funktion von ቡሩክ፡ ለዓለም
  choice: 'Substantivischer Titel und Subjekt: „der auf ewig Gepriesene steigt herab“'
  alternative: 'Prädikative oder doxologische Ergänzung: „er steigt herab, gepriesen in Ewigkeit“'
  rationale: Die substantivische Lesart ergibt eine Parallelführung mit „der Höchste“ und dem wiederholten Verb. Wegen der schwierigen Syntax wird die alternative Auffassung in einer Fußnote offengehalten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die Wiederholungen und die apokalyptisch-räumliche Bildsprache der Vorlage bleiben erhalten; die unsichere Syntax der zweiten Vershälfte wird nicht stillschweigend vereindeutigt.
