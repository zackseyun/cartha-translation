base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/077/005.yaml
  text: And I saw seven rivers upon the earth[a], greater than all the rivers[b]; and one of them comes from the west and pours its waters into the Great Sea.
translation:
  language: de
  text: Und ich sah sieben Flüsse auf der Erde, größer als alle anderen Flüsse. Einer von ihnen kommt aus dem Westen und ergießt sein Wasser in das Große Meer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in das große Meer“. Die Wendung kann als geografische Bezeichnung, wahrscheinlich für das Mittelmeer, oder als bloße Beschreibung gelesen werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ፯ አፍላገ
  choice: sieben Flüsse
  rationale: Die vorangestellte Zahl ፯ bezeichnet ausdrücklich sieben; አፍላገ ist der Plural von „Fluss“ beziehungsweise „Strom“.
- source_word: ዲበ ምድር
  choice: auf der Erde
  rationale: Die Wendung ist eine einfache Ortsangabe; „auf der Erde“ ist im modernen Deutschen klar und quellennah.
- source_word: ርኢኩ
  choice: ich sah
  rationale: Die erste Person des Verbs des Sehens führt den Visionsbericht in schlichter, würdiger Sprache fort.
- source_word: ዓበይተ እምኵሎሙ አፍላገ
  choice: größer als alle anderen Flüsse
  rationale: Die Vergleichskonstruktion bezeichnet ein Übertreffen an Größe oder Ausmaß. „anderen“ macht den im Deutschen vorausgesetzten Vergleich mit der Gesamtheit der übrigen Flüsse deutlich, ohne eine bestimmte Messgröße festzulegen.
- source_word: አሐዱ እምኔሆሙ
  choice: Einer von ihnen
  rationale: Dies gibt die partitive Wendung natürlich und genau wieder.
- source_word: ይመጽእ እምዓረብ
  choice: kommt aus dem Westen
  rationale: Verb und Herkunftspräposition bezeichnen den Ursprung beziehungsweise die Fließrichtung aus dem Westen.
- source_word: ውስተ ባሕር ዐቢይ
  choice: in das Große Meer
  rationale: Die Präposition bezeichnet die Richtung in das Meer hinein. Die Großschreibung behandelt die Bezeichnung wahrscheinlich als geografischen Namen, während die Fußnote die beschreibende Lesart offenhält.
- source_word: ይከዑ ማዮ
  choice: ergießt sein Wasser
  rationale: Die Formulierung bewahrt das konkrete Bild des Ausgießens und klingt für einen Fluss im Deutschen natürlich.
theological_decisions:
- issue: Ist „das Große Meer“ ein geografischer Name oder lediglich die Beschreibung eines großen Meeres?
  choice: das Große Meer
  alternative: das große Meer
  rationale: Im antiken jüdischen geografischen Sprachgebrauch kann „das Große Meer“ das Mittelmeer bezeichnen. Der ge'ezische Wortlaut selbst kann jedoch auch rein beschreibend verstanden werden; deshalb wird die Alternative in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Das zweimalige „Flüsse“ bewahrt die ausdrückliche Vergleichsform des Ausgangstextes; der Semikolonbau der englischen Konsultationsfassung wurde zugunsten zweier natürlicher deutscher Sätze aufgelöst.
