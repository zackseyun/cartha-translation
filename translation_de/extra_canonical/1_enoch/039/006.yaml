base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/006.yaml
  text: And in that place my eyes saw the Chosen One of righteousness and of faith[a], and righteousness shall be in his days[c][b]; and the righteous and the chosen will be without number before him forever and ever.
translation:
  language: de
  text: Und an jenem Ort sahen meine Augen den Erwählten der Gerechtigkeit und des Glaubens[a]. In seinen Tagen wird Gerechtigkeit sein[c], und die Gerechten und die Erwählten werden ohne Zahl[b] vor ihm sein, für immer und ewig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Treue“. Das ge''ezische Wort kann Glaube, Treue oder Beständigkeit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Für sie gibt es vor ihm keine Zahl.“'
    reason: lexical_alternative
  - marker: c
    text: 'Oder sinngemäß: „In seinen Tagen wird Gerechtigkeit herrschen.“'
    reason: previous_rendering
lexical_decisions:
- source_word: መካን
  choice: Ort
  rationale: Die übliche Ortsbezeichnung bewahrt den räumlichen Rahmen der Vision, ohne ihn näher zu bestimmen.
- source_word: ኀሩየ
  choice: der Erwählte
  rationale: Das substantivierte Wort hat hier die Funktion eines Titels. „Der Erwählte“ wahrt diese Funktion, ohne die Gestalt mit einer späteren theologischen Identifikation gleichzusetzen.
- source_word: ለጽድቅ
  choice: der Gerechtigkeit
  rationale: Der Genitiv gibt die knappe titelartige Verbindung wieder und kennzeichnet den Erwählten durch Gerechtigkeit.
- source_word: ወዘሃይማኖት
  choice: und des Glaubens
  rationale: „Glaube“ ist lexikalisch transparent; die ebenfalls mögliche Bedeutung „Treue“ wird wegen der echten Mehrdeutigkeit in einer Fußnote genannt.
- source_word: ይከውን
  choice: wird … sein
  rationale: Das Verb ist die gewöhnliche Form von „sein/werden“. Die schlichte Wiedergabe vermeidet die zusätzliche Deutung „wird herrschen“ oder „wird sich durchsetzen“.
- source_word: በመዋዕሊሁ
  choice: in seinen Tagen
  rationale: Die geläufige Zeitangabe wird knapp und strukturell nah am Ausgangstext wiedergegeben.
- source_word: ኄራያን
  choice: die Erwählten
  rationale: Die Wiedergabe hält die lexikalische Verbindung zum singularischen Titel „der Erwählte“ aufrecht.
- source_word: ኈልቈ አልቦሙ
  choice: werden ohne Zahl sein
  rationale: Die gehobene Wendung bewahrt das Bild der Unzählbarkeit und bleibt näher am Wortlaut als „werden unzählbar sein“.
- source_word: ቅድሜሁ
  choice: vor ihm
  rationale: Die Formulierung wahrt sowohl die räumliche als auch die höfisch-visionäre Bedeutung der Gegenwart vor der erhöhten Gestalt.
- source_word: ለዓለመ ዓለም
  choice: für immer und ewig
  rationale: Die geläufige deutsche Ewigkeitsformel gibt die feierliche Dauerangabe verständlich wieder.
theological_decisions:
- issue: Titel oder bloße Beschreibung bei ኀሩየ
  choice: Wiedergabe als Titel „der Erwählte“
  alternative: „ein Erwählter“ oder adjektivisch „erwählt“
  rationale: Im literarischen Zusammenhang bezeichnet das Wort eine bestimmte erhöhte Gestalt. Der Titel bildet diese Funktion ab, ohne eine spätere dogmatische Identifikation einzutragen.
- issue: Bedeutung von ሃይማኖት
  choice: Im Haupttext „Glaube“, mit „Treue“ als Fußnotenalternative
  alternative: „Treue“ oder „Zuverlässigkeit“
  rationale: Das ge'ezische Substantiv kann sowohl Glaube als auch Treue bezeichnen. Die Mehrdeutigkeit wird offengelegt und nicht konfessionell entschieden.
- issue: Aussage über die Gerechtigkeit in seinen Tagen
  choice: „In seinen Tagen wird Gerechtigkeit sein“
  alternative: „In seinen Tagen wird Gerechtigkeit herrschen“
  rationale: Die schlichte Kopula des Ausgangstextes wird bewahrt. Die Alternative macht eine mögliche Aussagewirkung deutlich, fügt aber eine stärkere dynamische Nuance hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst schlichter apokalyptischer Ausdrucksweise. Die leicht feierlichen Wendungen „sahen meine Augen“, „ohne Zahl“ und „für immer und ewig“ bewahren den visionären Ton; die Satzstellung der zweiten Aussage wurde für natürliches Deutsch angepasst.
