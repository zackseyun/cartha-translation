base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/002.yaml
  text: And in those days Enoch received books of zeal and wrath[a], and books of tumult and confusion; and mercy shall not be upon them, says the Lord of Spirits.
translation:
  language: de
  text: Und in jenen Tagen empfing Henoch Bücher des Eifers und des Zorns sowie Bücher des Aufruhrs und der Verwirrung[a]. »Und ihnen wird keine Barmherzigkeit zuteilwerden«, spricht der Herr der Geister.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der geezische Wortlaut in der Mitte des Verses ist in diesem Textzeugen schwierig. Das hier mit »Aufruhr und Verwirrung« wiedergegebene Wortpaar kann allgemeiner auch Unruhe, Geschrei oder Unordnung bezeichnen.
    reason: textual_variant
lexical_decisions:
- source_word: መዋዕል
  choice: Tage
  rationale: Bewahrt die geläufige apokalyptische Zeitformel »in jenen Tagen«, ohne sie näher zu bestimmen.
- source_word: ነሥአ
  choice: empfing
  rationale: Im Zusammenhang mit Henoch und den Büchern bezeichnet das Verb am natürlichsten ein Empfangen, nicht eigenmächtiges Nehmen.
- source_word: መጻሕፍተ
  choice: Bücher
  rationale: Gibt den Plural direkt wieder; »Schriftrollen« würde eine im Text nicht ausdrücklich genannte materielle Form ergänzen.
- source_word: ቅንአት
  choice: Eifer
  rationale: Das Wort kann Eifer oder Eifersucht bezeichnen. In Verbindung mit Zorn bewahrt »Eifer« die mögliche Bedeutung göttlichen Gerichtseifers, ohne auf menschlichen Neid einzuengen.
- source_word: መዐት
  choice: Zorn
  rationale: Ein kräftiger und im Deutschen würdevoller Gerichtsbegriff, der die apokalyptische Aussage natürlich wiedergibt.
- source_word: ጐጕአ
  choice: Aufruhr
  rationale: Die überlieferte Form ist schwierig; »Aufruhr« hält das Bedeutungsfeld von Lärm, Unruhe und Erschütterung offen.
- source_word: ሀውክ
  choice: Verwirrung
  rationale: Gibt Störung und Unordnung breit wieder und vermeidet angesichts des unsicheren Wortlauts eine zu enge Festlegung.
- source_word: ምሕረት
  choice: Barmherzigkeit
  rationale: Entspricht dem üblichen theologischen Sprachgebrauch und bewahrt den Gegensatz zu Eifer und Zorn.
- source_word: ኢይከውን ላዕሌሆሙ
  choice: ihnen wird keine Barmherzigkeit zuteilwerden
  rationale: Natürliches modernes Deutsch für die semitisch geprägte Wendung »Barmherzigkeit wird nicht über ihnen sein«; der zukünftige Gerichtssinn bleibt erhalten.
- source_word: እግዚአ መናፈስት
  choice: Herr der Geister
  rationale: Bewahrt den wiederkehrenden erhabenen Gottestitel des Henochbuches ohne zusätzliche Bestimmung des Genitivs.
theological_decisions:
- issue: Art und Gliederung der Bücher
  choice: Mehrere Bücher werden als Bücher über Eifer, Zorn, Aufruhr und Verwirrung beschrieben.
  alternative: Die Ausdrücke könnten zusammen eine einzige Gruppe von Schriften kennzeichnen; die schwierigen mittleren Wörter könnten auch Klage, Geschrei oder allgemeine Unordnung meinen.
  rationale: Das wiederholte መጻሕፍተ stützt eine gegliederte Mehrzahl. Die Präposition »über« macht im Deutschen deutlich, dass die Bücher durch diese Inhalte oder Themen gekennzeichnet sind, ohne ihre genaue Beschaffenheit festzulegen.
- issue: Bezug von »ihnen«
  choice: Das Pronomen verweist auf die im Kontext Gerichteten.
  alternative: Rein nach der unmittelbaren Wortfolge könnte es locker auf die zuvor genannten Dinge bezogen werden, doch ergäbe dies sachlich kaum Sinn.
  rationale: Die Aussage über ausbleibende Barmherzigkeit ist eine Gerichtsformel und bezieht sich im umgebenden apokalyptischen Zusammenhang natürlich auf Personen.
- issue: Sprecherzuordnung der Schlussaussage
  choice: Die Aussage über die ausbleibende Barmherzigkeit wird als direktes Wort des Herrn der Geister gesetzt.
  alternative: Die gesamte Aussage könnte als indirekter Bericht mit nachgestellter Redeeinleitung wiedergegeben werden.
  rationale: Das geezische »spricht der Herr der Geister« erlaubt eine direkte Rede; Anführungszeichen machen die Sprecherzuordnung im Deutschen transparent, ohne den Inhalt auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptischem Ton. Die Satzführung bleibt gut verständlich; der etablierte Titel »Herr der Geister« und die feierliche Gerichtsformel werden bewahrt. Die schwierige mittlere Wortgruppe wird im Text lesbar wiedergegeben und in der Fußnote transparent offengehalten.
