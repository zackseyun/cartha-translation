base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/003.yaml
  text: And in those days a whirlwind of winds carried me away from the face of the earth and set me down at the end of the heavens[a].
translation:
  language: de
  text: Und in jenen Tagen trug mich ein Wirbelwind vom Angesicht der Erde hinweg und setzte mich ans Ende der Himmel[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an die äußerste Grenze der Himmel“. Der geʽezische Ausdruck bezeichnet das äußerste Ende oder die fernste Grenze innerhalb der kosmischen Bildwelt der Vision.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መዋዕል
  choice: Tagen
  rationale: Die feste apokalyptische Zeitformel በውእቱ መዋዕል wird als „in jenen Tagen“ wiedergegeben; dies ist im Deutschen natürlich und bewahrt den erzählerischen Klang.
- source_word: መሠጠኒ
  choice: trug mich … hinweg
  rationale: Das Verb bezeichnet hier die durch eine äußere Macht bewirkte Fortbewegung. „Hinwegtragen“ wahrt die Kraft des Vorgangs, ohne ausschließlich eine Aufwärtsbewegung festzulegen.
- source_word: ዐውሎ ነፋሳት
  choice: ein Wirbelsturm von Winden
  rationale: Die bewusst verdichtete Wind- und Sturmmetaphorik der Vorlage bleibt erhalten, statt sie zu einem bloßen „Wind“ zu verflachen.
- source_word: እምገጸ ሰምድር
  choice: vom Angesicht der Erde
  rationale: Die semitisch geprägte Wendung enthält ausdrücklich das Bild des „Angesichts“ beziehungsweise der Oberfläche der Erde. Die gewählte Form ist würdevoll und im Deutschen verständlich.
- source_word: አንበረኒ
  choice: setzte mich
  rationale: Im Zusammenhang der visionären Entrückung bezeichnet das Verb das Platzieren am Zielort. „Setzte mich“ ist knapp und bewahrt den vollendeten Ortswechsel.
- source_word: ጽንፈ ሰማያት
  choice: ans Ende der Himmel
  rationale: ጽንፍ bezeichnet ein äußerstes Ende oder eine Grenze. Die Wiedergabe wahrt sowohl die räumliche kosmische Bildwelt als auch den Plural „Himmel“.
theological_decisions:
- issue: Kosmische Geografie der visionären Entrückung
  choice: ans Ende der Himmel
  alternative: an die äußerste Grenze der Himmel; an den Rand des Himmels
  rationale: Die räumliche Bildsprache der apokalyptischen Vision wird nicht zu einer allgemeinen Aussage über eine himmlische Erfahrung abgeschwächt. Zugleich erläutert die Fußnote die mögliche Grenzbedeutung, ohne sie im Haupttext festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter apokalyptischer Bildsprache. Die leicht fremdartige Wendung „Wirbelsturm von Winden“ spiegelt die Intensivierung der ge’ezischen Vorlage; „Angesicht der Erde“ erhält deren semitisch geprägtes Oberflächenbild.
