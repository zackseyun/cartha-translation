base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/001.yaml
  text: And it will happen in those days that the chosen and holy ones will descend from the high heaven[d][c][b][a], and their offspring will become one with the children of men.
translation:
  language: de
  text: 'Und es wird in jenen Tagen geschehen: Auserwählte und heilige Kinder[a] werden vom hohen Himmel[b] herabsteigen, und ihre Nachkommenschaft wird eins werden mit den Menschenkindern.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der ge'ezische Ausdruck kann auch mit „auserwählte und heilige Söhne“ wiedergegeben werden. Seine grammatische Form spricht hier eher dafür, „auserwählt“ und „heilig“ auf die Kinder selbst zu beziehen als „Kinder der Auserwählten und Heiligen“ zu lesen.
    reason: lexical_alternative
  - marker: b
    text: Die Wendung bezeichnet einen himmlischen Ursprung; wer diese auserwählten und heiligen Kinder genau sind, legt der Vers allein nicht fest.
    reason: cultural_note
  - marker: c
    text: 'Wörtlicher: „ihr Same wird eins werden mit den Menschenkindern“. Gemeint ist offenbar eine Verbindung oder Vermischung; deren genaue Art bleibt im ge''ezischen Wortlaut unausgesprochen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይከውን፡ በዝኩ፡ መዋዕል
  choice: Und es wird in jenen Tagen geschehen
  rationale: Bewahrt die einleitende apokalyptische Zeitformel und gibt das ge'ezische Existenz- bzw. Geschehensverb in natürlichem, würdigem Deutsch wieder.
- source_word: ደቂቅ፡ ኅሩያን፡ ወቅዱሳን
  choice: auserwählte und heilige Kinder
  rationale: ደቂቅ ist ein pluralischer Verwandtschaftsbegriff und steht hier in der absoluten Form; die folgenden Plurale lassen sich daher am unmittelbarsten als attributive Adjektive verstehen. „Kinder“ wahrt den Abstammungsbezug, ohne das Geschlecht auf männliche Nachkommen festzulegen.
- source_word: ይወርዱ
  choice: werden … herabsteigen
  rationale: Erhält die vertikale Bewegung aus dem Himmel und den gehobenen apokalyptischen Ton.
- source_word: እምልዑል፡ ሰማይ
  choice: vom hohen Himmel
  rationale: Gibt den Singular und die Vorstellung eines erhabenen himmlischen Ursprungs wieder, ohne eine bestimmte mehrstufige Himmelskosmologie vorauszusetzen.
- source_word: ዘርኦሙ
  choice: ihre Nachkommenschaft
  rationale: Das Wort kann wörtlicher „ihr Same“ bedeuten; „Nachkommenschaft“ vermittelt den genealogischen Sinn im modernen Deutsch ohne unnötige biologische Verengung.
- source_word: አሐደ፡ ይከውን
  choice: wird eins werden
  rationale: Bewahrt die offene Aussage eines Einswerdens oder einer Verbindung, statt die Art dieser Verbindung ausdrücklich als Heirat oder Geschlechtsgemeinschaft zu bestimmen.
- source_word: ምስለ፡ ውሉደ፡ ሰብእ
  choice: mit den Menschenkindern
  rationale: Erhält die traditionelle anthropologische Wendung und den Kontrast zwischen himmlischer Herkunft und menschlicher Linie; zugleich ist sie im Deutschen verständlich.
theological_decisions:
- issue: Identität der auserwählten und heiligen Kinder
  choice: Die Gruppe wird mit dem im Ge'ez ausdrücklich vorhandenen Verwandtschaftsbegriff wiedergegeben, aber nicht als Engel, menschliche Gerechte oder eine andere fest umrissene Klasse identifiziert.
  alternative: „die Auserwählten und Heiligen“ oder „die Kinder der Auserwählten und Heiligen“
  rationale: Der hohe Himmel spricht für himmlische Herkunft, bestimmt die Identität jedoch nicht abschließend. Die absolute Form von ደቂቅ stützt am ehesten die attributive Lesart „auserwählte und heilige Kinder“.
- issue: Art des Einswerdens mit den Menschenkindern
  choice: „wird eins werden mit“ lässt die Art der Verbindung offen.
  alternative: „wird sich mit den Menschen vermischen“ oder eine ausdrücklich sexuelle Verbindung
  rationale: Der Hintergrund der Wächterüberlieferung kann eine geschlechtliche Vereinigung nahelegen; der Wortlaut dieses Verses benennt den Mechanismus jedoch nicht.
translation_notes:
  register: Modernes Standarddeutsch in würdigem apokalyptischem Register. Die einleitende Geschehensformel und das Bild des Herabsteigens bleiben erhalten; schwer verständliche Wörtlichkeit wird nur dort geglättet, wo der Sinn und die echte Mehrdeutigkeit gewahrt bleiben.
