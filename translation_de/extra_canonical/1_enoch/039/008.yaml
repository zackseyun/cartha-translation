base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/008.yaml
  text: There I desired to dwell[a], and my spirit longed for that dwelling place; there my portion was before[c][b], for thus it was established for me before the Lord of Spirits.
translation:
  language: de
  text: Dort wünschte ich zu wohnen, und mein Geist sehnte sich nach jener Wohnstätte. Mein Anteil war dort schon zuvor[a]; denn so stand es für mich vor dem Herrn der Geister[b] fest.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Dort wurde es schon zuvor mein Anteil.“ Das knappe Ge’ez kann Sein oder Werden ausdrücken, nennt aber keine ausdrückliche Zuweisung.'
    reason: lexical_alternative
  - marker: b
    text: „Herr der Geister“ ist eine charakteristische Gottesbezeichnung in den Bilderreden dieses Werkes und wird nicht an spätere Formeln angeglichen.
    reason: cross_reference
lexical_decisions:
- source_word: ህየ
  choice: dort
  rationale: Das Ortsadverb verweist auf den zuvor geschauten Ort, ohne ihn näher zu bestimmen.
- source_word: ፈቀድኩ አኅድር
  choice: wünschte ich zu wohnen
  rationale: Die Verbindung drückt den Wunsch nach einem bleibenden Aufenthalt aus; „wohnen“ ist im heutigen Deutsch natürlicher als „weilen“ und bewahrt dennoch den räumlichen Sinn.
- source_word: ወፈተወት መንፈስየ
  choice: und mein Geist sehnte sich
  rationale: Die Formulierung gibt die innere Zuneigung beziehungsweise das Verlangen des visionären Sprechers wieder, ohne es rein verstandesmäßig abzuschwächen.
- source_word: ለውእቱ ማኅደር
  choice: nach jener Wohnstätte
  rationale: ማኅደር bezeichnet einen Wohn- oder Aufenthaltsort. „Wohnstätte“ erhält das konkrete Bild und passt zum würdevollen Erzählton.
- source_word: በህየ ኮነ ክፍለየ ቅድመ
  choice: Dort war mein Anteil schon zuvor
  rationale: ኮነ wird schlicht mit „war“ wiedergegeben, statt eine nicht ausdrücklich genannte Zuweisung einzutragen. ቅድመ wird hier zeitlich als „schon zuvor“ verstanden.
- source_word: እስመ ከመዝ
  choice: denn so
  rationale: Die knappe Begründungsverbindung des Ausgangstextes bleibt erhalten.
- source_word: ጸንዐ በእንቲአየ
  choice: stand es für mich fest
  rationale: Die Wendung bringt Festigkeit und Beständigkeit zum Ausdruck, ohne den einfachen Quellenausdruck durch ein ausdrücklich passives „wurde zugewiesen“ zu überdeuten.
- source_word: በቅድመ እግዚአ መናፍስት
  choice: vor dem Herrn der Geister
  rationale: Hier wird ቅድመ relational als „vor“ verstanden. Der charakteristische Gottestitel der Bilderreden wird wörtlich und werkimmanent wiedergegeben.
theological_decisions:
- issue: Art von Henochs „Anteil“ am himmlischen Ort
  choice: Der Text bezeichnet die Wohnstätte als Henochs bereits zuvor bestehenden Anteil, ohne den Vorgang einer förmlichen Zuweisung ausdrücklich zu machen.
  alternative: Der Anteil wurde Henoch schon vorher ausdrücklich zugewiesen.
  rationale: Die Verbindung von Wohnstätte, Anteil und festem Bestand vor dem Herrn der Geister legt einen bestimmten himmlischen Anteil nahe; das einfache ኮነ („war/wurde“) benennt jedoch keine ausdrückliche Zuweisung.
- issue: Bedeutung des Titels „Herr der Geister“
  choice: Der Titel bleibt als charakteristische Gottesbezeichnung dieses Werkteils unverändert stehen.
  alternative: Der Titel könnte durch eine geläufigere spätere Gottesbezeichnung ersetzt oder harmonisiert werden.
  rationale: Eine Harmonisierung würde die eigene Ausdrucksweise der Bilderreden und ihre mögliche theologische Spannung verdecken.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem visionärem Ton. Die Wiederholung von „dort“ und die Folge von „schon zuvor“ und „vor dem Herrn“ bleiben erhalten, weil sie zwei unterschiedliche Verwendungen von ቅድመ abbilden. Interpretierende Zusätze wie „zugewiesen“ wurden im Haupttext vermieden.
