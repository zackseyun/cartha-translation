base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/007.yaml
  text: And I saw the dwelling-place beneath the wings of the Lord of Spirits[a]; and all the righteous and the chosen shone before him like the light of fire, and their mouths were filled with blessing, and their lips praised the name of the Lord of Spirits. And righteousness does not fail before him[c][b], and uprightness does not fail before him.
translation:
  language: de
  text: Und ich sah die Wohnstätte unter den Flügeln des Herrn der Geister.[a] Alle Gerechten und Auserwählten leuchteten vor ihm wie das Licht des Feuers. Ihr Mund war mit Segen erfüllt, und ihre Lippen priesen den Namen des Herrn der Geister. Die Gerechtigkeit vergeht vor ihm nicht,[b] und die Aufrichtigkeit vergeht vor ihm nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bild „unter den Flügeln“ ist wörtlich wiedergegeben und bezeichnet in der Vision Schutz und Nähe beim Herrn der Geister.
    reason: cultural_note
  - marker: b
    text: „Vergeht … nicht“ kann auch mit „hört … nicht auf“, „geht … nicht zugrunde“ oder „findet … kein Ende“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ማኅደረ
  choice: Wohnstätte
  rationale: Bezeichnet einen konkreten Ort des Wohnens; „Wohnstätte“ wahrt den visionären und würdevollen Ton.
- source_word: መትሕተ አክናፈ
  choice: unter den Flügeln
  rationale: Die räumliche Formulierung und das Schutzbild werden wörtlich bewahrt.
- source_word: እግዚአ መናፍስት
  choice: Herr der Geister
  rationale: Wiederkehrender Titel in 1 Henoch; die knappe Genitivform entspricht dem äthiopischen Ausdruck.
- source_word: ጻድቃን ወኄሩያን
  choice: Gerechten und Auserwählten
  rationale: Die beiden parallelen Personengruppen bleiben als substantivierte Bezeichnungen unterscheidbar.
- source_word: ይትሰሐዩ
  choice: leuchteten
  rationale: Gibt das sichtbare Strahlen in natürlichem Deutsch wieder.
- source_word: ከመ ብርሃነ እሳት
  choice: wie das Licht des Feuers
  rationale: Bewahrt den ungewöhnlichen Vergleich, ohne ihn zu einem allgemeinen Helligkeitsbild zu glätten.
- source_word: አፉሆሙ ይመልእ በረከተ
  choice: Ihr Mund war mit Segen erfüllt
  rationale: „Segen“ wird nicht interpretierend durch „Lob“ ersetzt; der kollektive Singular des Körperteils bleibt möglich und poetisch.
- source_word: ከናፍሪሆሙ ይሴብሑ
  choice: ihre Lippen priesen
  rationale: Erhält den poetischen Parallelismus von Mund und Lippen.
- source_word: ጽድቅ
  choice: Gerechtigkeit
  rationale: Passt als abstrakte ethische Größe in der Gegenwart Gottes und zum folgenden Parallelbegriff.
- source_word: ርትዕ
  choice: Aufrichtigkeit
  rationale: Gibt die Vorstellung moralischer Geradheit wieder, ohne sie auf „Wahrheit“ festzulegen.
- source_word: ኢየኃልቅ
  choice: vergeht nicht
  rationale: Drückt Dauer und Nicht-Enden idiomatisch aus; die Wiederholung wird in beiden Schlussgliedern beibehalten.
theological_decisions:
- issue: Apokalyptische Bezeichnung ኄሩያን
  choice: die Auserwählten
  alternative: die Erwählten
  rationale: „Auserwählten“ bezeichnet die Gruppe klar, ohne die Stelle stärker mit späterer dogmatischer Terminologie aufzuladen.
- issue: Aussage über Gerechtigkeit und Aufrichtigkeit vor Gott
  choice: vergeht vor ihm nicht
  alternative: hört vor ihm nicht auf / geht vor ihm nicht zugrunde
  rationale: Der wiederholte Ausdruck bezeichnet wahrscheinlich bleibende Dauer. „Vergeht nicht“ wahrt zugleich die möglichen Nuancen von Nicht-Enden und Nicht-Zugrundegehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit dichterischem Parallelismus. Die wiederholte Titelformel „Herr der Geister“ und die beiden parallelen Schlussaussagen bleiben erhalten; übermäßig altertümliche Wörter werden vermieden.
