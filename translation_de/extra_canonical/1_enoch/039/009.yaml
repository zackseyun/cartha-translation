base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/009.yaml
  text: In those days I praised and exalted the name of the Lord of Spirits with blessing and with praise[a], because he has strengthened me with blessing and with praise[b], according to the will of the Lord of Spirits.
translation:
  language: de
  text: In jenen Tagen pries und erhob ich den Namen des Herrn der Geister mit Segen und Lobpreis, denn er hatte mich in Segen und Lobpreis gefestigt[a], nach dem Willen des Herrn der Geister.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „gestärkt“. Das äthiopische Verb kann sowohl „fest machen/festigen“ als auch „stärken“ bedeuten. Auch „mit Segen und Lobpreis“ ist statt „in Segen und Lobpreis“ möglich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በውእቱን፡ መዋዕል
  choice: In jenen Tagen
  rationale: Bewahrt die wiederkehrende apokalyptische Zeitformel in gehobenem, aber geläufigem Deutsch.
- source_word: ሰባሕኩ፡ ወአልዐልኩ፡ ስሞ
  choice: pries ich den Namen … und erhob ihn
  rationale: Gibt beide Verben wieder und bewahrt das biblische Bild vom Erheben des göttlichen Namens, ohne es zu einer allgemeinen Aussage über Anbetung abzuflachen.
- source_word: ለእግዚአ፡ መናፍስት
  choice: des Herrn der Geister
  rationale: Bewahrt den charakteristischen henochischen Gottestitel als feste Bezeichnung.
- source_word: በረከተ፡ ወስብሐተ
  choice: mit Segenswort und Lobpreis
  rationale: Versteht den Segen an dieser Stelle als doxologischen Vollzug und nicht als empfangene Wohltat; „Segenswort“ macht dies im Deutschen deutlich.
- source_word: አጽንዐኒ
  choice: er hatte mich … gefestigt
  rationale: Das Kausativ bezeichnet ein Festmachen oder Stärken. „Gefestigt“ wahrt diese Bedeutungsbreite und lässt zugleich die lexikalische Verbindung zum Feststehen offen.
- source_word: በበረከት፡ ወስብሐት
  choice: in Segen und Lobpreis
  rationale: Nach dem Verb des Festigens bezeichnet die Präposition plausibel den Bereich oder Zustand, in dem Henoch gefestigt wurde; die Substantive werden bewusst wiederholt.
- source_word: በከመ፡ ፈቃዱ
  choice: nach dem Willen
  rationale: Gibt die Übereinstimmung mit dem göttlichen Willen klar wieder, ohne zusätzliche dogmatische Färbung.
theological_decisions:
- issue: Bedeutung der wiederholten Wendung „Segen und Lobpreis“
  choice: Die erste Wendung bezeichnet die Weise des Preisens; die zweite den Bereich oder Zustand der göttlichen Festigung.
  alternative: Beide Vorkommen können instrumental als „mit Segen und Lobpreis“ verstanden werden; möglich ist auch ein stärker statisches Verständnis als „in Gesegnetsein und Herrlichkeit“.
  rationale: Die Präposition በ erlaubt mehrere Beziehungen. Der deutsche Text bewahrt die liturgische Ausrichtung und vermeidet eine Deutung als materiellen Segen, ohne die syntaktische Spannung ganz aufzulösen.
- issue: Gottestitel እግዚአ መናፍስት
  choice: Herr der Geister
  alternative: Herr von Geistern / Herr der geistigen Wesen
  rationale: „Herr der Geister“ erhält die charakteristische Titelform von 1 Henoch und legt nicht fest, welche Geistwesen im Einzelnen gemeint sind.
- issue: Semantik von አጽንዐኒ
  choice: gefestigt
  alternative: gestärkt; fest gegründet; bestätigt
  rationale: „Gefestigt“ umfasst sowohl Stärkung als auch Festmachen und wahrt damit die echte lexikalische Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptisch-biblischem Klang. Der charakteristische Titel „Herr der Geister“ und die feierliche Wiederholung von „Segen und Lobpreis“ bleiben erhalten; altertümliche Verbformen und konfessionell geprägte Zusätze werden vermieden.
