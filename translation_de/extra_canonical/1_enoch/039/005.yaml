    rationale: Das ge'ezische ውስተ፡ ምድር ist hier lokativ. Deutsch »auf die Erde« legt eine Richtung nahe; »auf der Erde« gibt den Ort des Taus treffender und natürlicher wieder.
  - severity: low
    issue: Fußnotenanker a bündelt zwei unterschiedliche Erläuterungen und steht nur bei »Heiligen«
    rationale: Die Alternativen zu »Ruhestätten« und die offene Bedeutung von »Heiligen« betreffen verschiedene Textstellen. Getrennte Anker machen den Bezug transparent.
