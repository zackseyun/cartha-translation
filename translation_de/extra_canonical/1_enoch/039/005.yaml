base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/005.yaml
  text: There my eyes saw their dwelling places with the angels of righteousness, and their resting places with the holy ones; and they were asking and pleading and praying on behalf of the children of men, and righteousness was flowing before them like water, and mercy like dew upon the earth. So it is among them forever and ever.
translation:
  language: de
  text: Dort sahen meine Augen ihre Wohnstätten bei den Engeln der Gerechtigkeit und ihre Ruhestätten[a] bei den Heiligen[b]. Sie baten, flehten und beteten für die Menschenkinder. Gerechtigkeit strömte vor ihnen wie Wasser und Barmherzigkeit wie Tau auf der Erde. So ist es in ihrer Mitte für immer und ewig.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Ruhestätten« kann auch »Lager« oder »Liegestätten« bedeuten.
    reason: lexical_alternative
  - marker: b
    text: »Die Heiligen« kann himmlische heilige Wesen, die Gerechten in der himmlischen Versammlung oder beide Gruppen bezeichnen. Der äthiopische Wortlaut legt keine engere Bestimmung fest.
    reason: alternative_reading
  - marker: c
    text: 'Der letzte Satz kann auch verstanden werden: »So wird es in ihrer Mitte für immer und ewig sein.«'
    reason: alternative_reading
lexical_decisions:
- source_word: በህየ፡ ርእያ፡ አዕይንትየ
  choice: Dort sahen meine Augen
  rationale: Bewahrt die auffällige äthiopische Syntax, in der »meine Augen« ausdrücklich Subjekt des Sehens sind, und erhält den visionären Nachdruck.
- source_word: ማኅደሮሙ
  choice: ihre Wohnstätten
  rationale: Gibt Orte des Wohnens oder Bleibens in würdigem, zugleich verständlichem Deutsch wieder.
- source_word: መላእክተ፡ ጽድቅ
  choice: Engel der Gerechtigkeit
  rationale: Erhält die Genitivverbindung und stimmt mit dem erneuten Auftreten von ጽድቅ im Bild des strömenden Wassers überein.
- source_word: ምስካቢሆሙ
  choice: ihre Ruhestätten
  rationale: Bewahrt die Vorstellung von Ruhe und Lager, ohne das himmlische Bild unnötig auf konkrete Betten oder Liegen festzulegen.
- source_word: ቅዱሳን
  choice: die Heiligen
  rationale: Ist im Deutschen natürlich und lässt offen, ob himmlische heilige Wesen, die vollendeten Gerechten oder beide gemeint sind.
- source_word: ይስእሉ፡ ወያስተበቍዑ፡ ወይጼልዩ
  choice: Sie baten, flehten und beteten
  rationale: Gibt alle drei Verben gesondert wieder und erhält so die steigernde Häufung der Fürbitte.
- source_word: በእንተ፡ ውሉደ፡ ሰብእ
  choice: für die Menschenkinder
  rationale: Bewahrt die traditionelle anthropologische Wendung, ohne sie geschlechtlich auf Männer einzuengen.
- source_word: ጽድቅ፡ ከመ፡ ማይ፡ ይውሕዝ፡ ቅድሜሆሙ
  choice: Gerechtigkeit strömte vor ihnen wie Wasser
  rationale: Erhält das konkrete Bild sowie die räumliche Mehrdeutigkeit von »vor ihnen«.
- source_word: ምሕረት፡ ከመ፡ ጠል፡ ውስተ፡ ምድር
  choice: Barmherzigkeit wie Tau auf die Erde
  rationale: Gibt das lebenspendende Bild knapp und idiomatisch wieder; das im zweiten Glied ausgelassene Verb wird aus dem ersten mitverstanden.
- source_word: ከመዝ፡ ውእቱ፡ ማእከሎሙ፡ ለዓለመ፡ ዓለም
  choice: So ist es in ihrer Mitte für immer und ewig
  rationale: Bewahrt die zusammenfassende Aussage, den räumlichen Ausdruck »in ihrer Mitte« und die nachdrückliche Ewigkeitsformel.
theological_decisions:
- issue: Identität der Fürbittenden und der himmlischen Gemeinschaft
  choice: Das Pronomen bleibt ohne ausdrückliche Auflösung; die dargestellte Gemeinschaft bittet für die Menschheit.
  alternative: Nur Engel oder nur verstorbene Gerechte werden als Fürbittende bestimmt.
  rationale: Der Satz verbindet Wohnstätten mit Engeln der Gerechtigkeit und Ruhestätten mit Heiligen, legt den genauen Bezug des anschließenden Plurals aber nicht eindeutig fest.
- issue: Bedeutung von ጽድቅ
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: »Gerechtigkeit« funktioniert sowohl in der Bezeichnung der Engel als auch im kosmischen Bild des strömenden Wassers, ohne den Begriff auf bloß persönliche Tugend zu verengen.
- issue: Zeitbezug des Schlusssatzes
  choice: 'Präsentisch: »So ist es«'
  alternative: 'Futurisch: »So wird es sein«'
  rationale: Die Formulierung beschreibt am unmittelbarsten den geschauten bleibenden Zustand; der visionäre Zusammenhang lässt jedoch auch eine zukünftige Nuance zu.
translation_notes:
  register: Modernes Standarddeutsch in würdigem apokalyptischem Erzählton. Die markante Subjektstellung »meine Augen« sowie die dreifache Bitte werden formal bewahrt; altertümliche Wörter und eine konfessionelle Festlegung von »die Heiligen« werden vermieden.
