base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/004.yaml
  text: 'And there I saw another vision: the dwelling places of the holy ones[a], and the resting places of the righteous.'
translation:
  language: de
  text: 'Und dort sah ich eine weitere Vision: die Wohnstätten der Heiligen und die Ruheplätze der Gerechten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „Ruheplätze“ wiedergegebene Wort kann wörtlicher auch Lager, Liegestätten oder Schlafstätten bezeichnen. Wegen der visionären Darstellung der Wohnorte der Gerechten steht im Haupttext der weitere Ausdruck.
    reason: lexical_alternative
lexical_decisions:
- source_word: በህየ
  choice: dort
  rationale: Das Ortsadverb führt unmittelbar in den Schauplatz der Vision zurück; „dort“ ist natürlich und prägnant.
- source_word: ርኢኩ
  choice: sah ich
  rationale: Die schlichte Formulierung entspricht dem wiederkehrenden Berichtsstil visionärer Schau.
- source_word: ራእየ ካልአ
  choice: eine weitere Vision
  rationale: „Weitere“ bezeichnet eine zusätzliche Schau, ohne sie unnötig als genau die zweite zu nummerieren.
- source_word: ማኅደሪሆሙ
  choice: die Wohnstätten
  rationale: Das Wort bezeichnet Wohnungen oder Aufenthaltsorte. „Wohnstätten“ wahrt den gehobenen visionären Ton und bleibt verständlich.
- source_word: ለቅዱሳን
  choice: der Heiligen
  rationale: Die Genitivverbindung gibt Zugehörigkeit wieder. „Heilige“ lässt offen, ob himmlische Wesen, geheiligte Menschen oder Gottes bestätigtes Volk gemeint sind.
- source_word: ወምስካባቲሆሙ
  choice: und die Ruheplätze
  rationale: Das Substantiv gehört zum Bedeutungsfeld des Liegens, Schlafens und Ruhens. „Ruheplätze“ passt zum Zusammenhang der seligen Wohnorte, während die konkreteren Möglichkeiten in der Fußnote erhalten bleiben.
- source_word: ለጻድቃን
  choice: der Gerechten
  rationale: „Die Gerechten“ ist die geläufige und sachlich passende Wiedergabe des ethisch-apokalyptischen Schlüsselbegriffs.
theological_decisions:
- issue: Ob ቅዱሳን Engel, verstorbene Glaubende oder das bestätigte Volk Gottes bezeichnet
  choice: der Heiligen
  alternative: der heiligen Wesen; der Frommen
  rationale: „Der Heiligen“ bewahrt die apokalyptische Offenheit des Ausdrucks. „Heilige Wesen“ würde die Deutung auf überirdische Gestalten verengen, während „Fromme“ die Heiligkeitsbedeutung abschwächt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem visionärem Ton. Die parallele Struktur „Wohnstätten der Heiligen … Ruheplätze der Gerechten“ wird beibehalten. Der Fußnotenmarker steht bei dem tatsächlich erläuterten Ausdruck.
