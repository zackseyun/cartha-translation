  source_fidelity: Die Übersetzung gibt den knappen Visionsbericht, die Ortsangabe und das maskuline Objekt von ባረክዎ angemessen wieder. Das im Text nicht ausdrücklich bezeichnete Subjekt des Schlussverbs wird nicht inhaltlich festgelegt; die Anmerkung markiert diese Unsicherheit zutreffend. Die auffällige bzw. möglicherweise beschädigte Anfangsüberlieferung wird nicht durch eine spekulative Ergänzung ausgeglichen.
  naturalness: »Und meine Augen sahen dort, an jenem Ort« ist bewusst leicht gehoben, aber im Kontext eines Visionsberichts verständlich und würdig. Die Wiederaufnahme durch »sie« kann ohne Anmerkung formal auf »Augen« bezogen wirken; die Fußnote ist deshalb wichtig und ausreichend, da sie den im Deutschen sonst irritierenden Bezug transparent macht.
  terminology: »segneten ihn« ist eine sachgerechte, nicht konfessionell zugespitzte Wiedergabe. »Himmlische Wesen« in der Fußnote bleibt als vorsichtige Kontextmöglichkeit formuliert und behauptet keine textlich ausdrückliche Identifikation.
