base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/039/010.yaml
  text: And my eyes saw in that place[a][him], and they blessed him.
translation:
  language: de
  text: Und meine Augen sahen dort, an jenem Ort[a], und sie[b] segneten ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Und meine Augen sahen an jenem Ort.«'
    reason: previous_rendering
  - marker: b
    text: Wer mit »sie« gemeint ist, wird in dieser kurzen Zeile nicht ausdrücklich gesagt; gemeint sein können die dort anwesenden himmlischen Wesen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርእዩ፡ አዕይንትየ
  choice: meine Augen sahen
  rationale: Das Verb bezeichnet gewöhnliches Sehen; die nachgestellte Nominalgruppe nennt »meine Augen« als Subjekt. Die natürliche deutsche Wortstellung bewahrt den schlichten Visionsbericht.
- source_word: በውእቱ፡ መካን
  choice: dort, an jenem Ort
  rationale: Die Wiedergabe nimmt sowohl die örtliche Aussage als auch die demonstrative Hervorhebung des Ortes auf, ohne altertümlich zu klingen.
- source_word: ባረክዎ
  choice: sie segneten ihn
  rationale: Das Verb bedeutet »segnen«; die Form enthält ein maskulines Objekt der dritten Person. »Ihn« gibt dieses Objekt wieder. Das deutsche »sie« lässt den Bezug des nicht eigens genannten pluralischen Handlungsträgers offen.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt des abschließenden Verbs
  choice: sie segneten ihn
  alternative: ich segnete ihn
  rationale: In der überlieferten Zeile steht kein eigenes Substantiv als Subjekt des letzten Verbs. Die pluralische Wiedergabe folgt der vorliegenden Form und vermeidet es, die Handlung ohne klare Textgrundlage Henoch allein zuzuschreiben. Eine Fußnote macht deutlich, dass der gemeinte Personenkreis in dieser kurzen Zeile nicht ausdrücklich bezeichnet wird.
- issue: Nicht genanntes Objekt von »sahen«
  choice: kein Objekt ergänzt
  alternative: sie sahen ihn
  rationale: Das Sehverb trägt in der vorliegenden Form kein ausdrückliches Objekt. Die offene Formulierung bewahrt diese Kürze, statt den im folgenden Satzteil genannten männlichen Bezug ohne eindeutiges Formsignal auch zum Objekt des Sehens zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht ungewöhnliche Formulierung »meine Augen sahen dort« hält die knappe und in ihrem Objekt offene Gestalt der überlieferten Zeile fest. Wegen der nur mittleren Quellensicherheit und der auffälligen, möglicherweise beschädigten Anfangslesart wird kein zusätzliches »viel« oder »lange« in den Haupttext aufgenommen.
