base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/011/001.yaml
  text: And in those days I will open the storehouses of blessing that are in heaven[a], so that I may bring them down upon the earth, upon their work and upon their labor[g][f][e][d][c][b], for the children of men.
translation:
  language: de
  text: Und in jenen Tagen werde ich die Vorratshäuser des Segens öffnen, die im Himmel sind, damit ich sie auf die Erde, auf das Werk und die Mühe der Menschenkinder herabbringe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: በእማንቱ፡ መዋዕል
  choice: in jenen Tagen
  rationale: Gibt die übliche apokalyptische Zeitformel präzise und in würdigem, heutigem Deutsch wieder.
- source_word: እፈትሕ
  choice: werde ich … öffnen
  rationale: Das Imperfekt der 1. Person Singular hat hier Zukunftssinn; die Wiedergabe bleibt schlicht und direkt.
- source_word: መዛግብተ፡ በረከት
  choice: die Vorratshäuser des Segens
  rationale: Bewahrt sowohl das konkrete Bild himmlischer Vorratshäuser als auch den singularischen Abstraktbegriff „Segen“. Ein zusätzliches Wort für „Türen“ steht im Geʿez nicht.
- source_word: እለ፡ በሰማይ
  choice: die im Himmel sind
  rationale: Entspricht dem Relativsatz und wahrt den Singular „Himmel“.
- source_word: ከመ፡ አውርዶሙ
  choice: damit ich sie … herabbringe
  rationale: „Damit“ bewahrt die finale Bedeutung; „herabbringen“ gibt den Kausativ von „hinabsteigen“ sowie das pluralische Objektsuffix wieder, ohne dessen Bezug ausdrücklich festzulegen.
- source_word: ዲበ፡ ምድር
  choice: auf die Erde
  rationale: Der kosmische Zusammenhang spricht für „Erde“ statt für das örtlichere „Land“.
- source_word: ዲበ፡ ግብሮሙ፡ ወዲበ፡ ፃማሆሙ
  choice: auf ihr Werk und auf ihre Mühe
  rationale: Bewahrt die wiederholte Präposition und unterscheidet ግብር („Werk, Arbeit“) von ፃማ („Mühe, Anstrengung“). ፃማ bedeutet hier nicht „Nachkommenschaft“.
- source_word: ለውሉደ፡ ሰብእ
  choice: für die Menschenkinder
  rationale: Erhält die für Henoch charakteristische Wendung wörtlich genug, während „Menschenkinder“ im Deutschen verständlich und traditionsnah ist.
theological_decisions:
- issue: Identität des Ich-Sprechers
  choice: Die erste Person bleibt ohne ergänzende Sprecherbezeichnung stehen.
  alternative: Gott, einen Engel oder Henoch ausdrücklich als Sprecher nennen.
  rationale: Der Zusammenhang legt eine göttliche Rede nahe, doch der Vers selbst nennt den Sprecher nicht; deshalb wird kein Name in den Text eingefügt.
- issue: Bezug des pluralischen Objektsuffixes in አውርዶሙ
  choice: Das Pronomen „sie“ bleibt formal pluralisch und in seinem Bezug offen.
  alternative: Explizit „die Segnungen“ oder „deren Inhalt“ sagen.
  rationale: Die unmittelbar vorausgehende Genitivverbindung enthält pluralische „Vorratshäuser“ und singularischen „Segen“, während das Verb ein pluralisches Objekt trägt. Eine eindeutige Auflösung würde die formale Spannung des Textes beseitigen.
- issue: Zuordnung von „für die Menschenkinder“
  choice: Die Wendung wird vor die Zielangaben gestellt, sodass sie den Zweck des Herabbringens bezeichnet; zugleich können „ihr Werk“ und „ihre Mühe“ natürlich auf die Menschenkinder bezogen werden.
  alternative: Die Ausgangsreihenfolge streng beibehalten und dadurch den syntaktischen Bezug im Deutschen stärker offenlassen.
  rationale: Die Umstellung verändert keine Textaussage, vermeidet aber einen schwer verständlichen deutschen Satz und entspricht der naheliegenden semantischen Zuordnung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Klang. „Vorratshäuser“, „Menschenkinder“ und „herabbringen“ erhalten die konkrete kosmische Bildsprache, ohne veraltete Syntax zu verwenden.
