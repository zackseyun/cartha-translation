  source_fidelity: Die Übersetzung gibt ሰላም und ርትዕ treffend als „Frieden“ und „Wahrheit“ wieder. Für die umstrittene Wendung ሱቱፋነ ይከውኑ wahrt „werden miteinander verbunden sein“ die relationale Lesart, ohne das im Deutschen missverständliche „Partner sein“ zu verwenden; die Fußnote hält die konkurrierende Deutung von Vermehrung bzw. Fülle ausdrücklich offen. „an allen Tagen der Welt“ entspricht በኵሉ መዋዕለ ዓለም angemessen; መዋዕል ist hier „Tage“, nicht „Zeitalter“.
