  terminology: „Frieden“, „Wahrheit“, „Welt“ und „Generationen“ sind konsistent und sachgerecht. Die Fußnote zu ዓለም markiert dessen mögliche Bedeutungsweite, ohne die im Satz durch den Kontext gut begründete Wiedergabe „Welt“ zu relativieren.
