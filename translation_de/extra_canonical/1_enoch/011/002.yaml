base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/011/002.yaml
  text: And peace and truth shall be partners throughout all the days of the world and throughout all the generations of the world[a][b][c][d].
translation:
  language: de
  text: Und Frieden und Wahrheit werden miteinander verbunden sein[a] an allen Tagen der Welt[b] und in allen Generationen der Welt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die ge’ezische Wendung kann ein Verbundensein oder gemeinsames Teilhaben ausdrücken. Sie wird auch im Sinn von „werden sich mehren“ oder „werden in Fülle vorhanden sein“ verstanden.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „an allen Tagen der Welt“; ዓለም kann je nach Zusammenhang auch „Zeitalter“ oder „Ewigkeit“ bedeuten.
    reason: semantic_ambiguity
lexical_decisions:
- source_word: ሰላም
  choice: Frieden
  rationale: Die übliche Bedeutung des ge’ezischen Wortes; zusammen mit „Wahrheit“ bezeichnet es eine umfassende heilsame und rechte Ordnung.
- source_word: ርትዕ
  choice: Wahrheit
  rationale: Bewahrt die geläufige Bedeutung und die ausgewogene Verbindung „Frieden und Wahrheit“.
- source_word: ሱቱፋነ ይከውኑ
  choice: werden miteinander verbunden sein
  rationale: Die Wendung bezeichnet hier am ehesten gemeinsames Verbundensein beziehungsweise Teilhabe. Diese Wiedergabe folgt der Satzstruktur und vermeidet das missverständliche deutsche „Partner sein“; die mögliche Deutung als Fülle oder Vermehrung wird in einer Fußnote offengehalten.
- source_word: በኵሉ መዋዕለ ዓለም
  choice: an allen Tagen der Welt
  rationale: መዋዕል ist der Plural von „Tag“. Die umfassende Zeitangabe wird daher wörtlich und idiomatisch als „an allen Tagen der Welt“ wiedergegeben.
- source_word: በኵሉ ትውልደ ዓለም
  choice: in allen Generationen der Welt
  rationale: Gibt die aufeinanderfolgenden Generationen und den wiederholten umfassenden Quantor wieder.
- source_word: ዓለም
  choice: Welt
  rationale: „Welt“ erhält in beiden Genitivverbindungen die konkrete Weite des Ausdrucks; je nach Kontext kann das Wort auch „Zeitalter“ oder „Ewigkeit“ bezeichnen.
theological_decisions:
- issue: Zeitlicher Umfang der Verheißung
  choice: Die doppelte umfassende Formulierung wird als „an allen Tagen der Welt“ und „in allen Generationen der Welt“ beibehalten.
  alternative: Beschränkung auf ein einziges endzeitliches Zeitalter.
  rationale: Der zweimalige Ausdruck „alle“ legt eine fortdauernde, umfassende Reichweite nahe, ohne einen bestimmten endzeitlichen Zeitplan festzulegen.
- issue: Verhältnis von Frieden und Wahrheit
  choice: Beide werden als miteinander verbunden dargestellt.
  alternative: Beide werden zahlreich oder überreich sein.
  rationale: Die Formulierung wahrt die wahrscheinlich relationale Bedeutung von ሱቱፋነ, während die lexikalisch mögliche Fülle-Deutung in der Fußnote genannt wird und nicht dogmatisch entschieden wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die koordinierte Satzform und die Wiederholung von „allen … der Welt“ bewahren den feierlichen Rhythmus des Ge’ez; „miteinander verbunden sein“ ist natürlicher und genauer als das im Deutschen missverständliche „Partner sein“.
