base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/035/001.yaml
  text: And from there I went toward the west[a], to the ends of the earth, and there I saw three open portals of heaven, like what I had seen in the east[d][c][b], corresponding to their portals and corresponding to their outlets.
translation:
  language: de
  text: Und von dort ging ich nach Westen bis an die Enden der Erde. Dort sah ich drei offene Tore des Himmels[a], wie ich sie im Osten gesehen hatte, entsprechend den Toren und entsprechend ihren Ausgängen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Pforten des Himmels“ beziehungsweise „Öffnungen des Himmels“. Das Ge''ez-Wort bezeichnet Öffnungen in der vorgestellten Himmelsstruktur.'
    reason: lexical_alternative
  - marker: b
    text: Der Wortlaut lässt offen, ob die Tore in Maß, Anordnung oder Zuordnung den zuvor im Osten gesehenen Toren und ihren Ausgängen entsprachen.
    reason: ambiguity
lexical_decisions:
- source_word: ወእምህየ፡ ሖርኩ
  choice: Und von dort ging ich
  rationale: Bewahrt die erzählerische Übergangsformel und den schlichten Bewegungsbericht des Ge'ez in natürlichem modernem Deutsch.
- source_word: መንገለ፡ ዐረብ
  choice: nach Westen
  rationale: ዐረብ bezeichnet hier den Westen, den Ort des Sonnenuntergangs; dies entspricht zudem der Abfolge der Himmelsrichtungen in den Kapiteln 33–36.
- source_word: በአጽናፈ፡ ምድር
  choice: bis an die Enden der Erde
  rationale: Erhält die kosmisch-apokalyptische Raumvorstellung und gibt die Bewegungsrichtung idiomatisch wieder.
- source_word: ሠለስተ፡ ኆዋኅወ፡ ሰማይ፡ ርኁዋተ
  choice: drei offene Tore des Himmels
  rationale: „Tore“ wahrt das Bild baulicher Öffnungen am Himmel; ርኁዋተ beschreibt sie als offen.
- source_word: በከመ፡ ርኢኩ፡ በምሥራቅ
  choice: wie ich sie im Osten gesehen hatte
  rationale: Das Plusquamperfekt verdeutlicht den Rückbezug auf die zuvor geschauten östlichen Tore, ohne zusätzliche Deutung einzutragen.
- source_word: በአምጣነ፡ ኆዋኅው
  choice: entsprechend den Toren
  rationale: ኆዋኅው ist hier ein Plural ohne Possessivsuffix; die Wiedergabe erhält die lexikalische Wiederholung von „Tore“ und lässt offen, ob Maß, Anordnung oder Zuordnung gemeint ist.
- source_word: ወበአምጣነ፡ ሞፃእቱ
  choice: und entsprechend ihren Ausgängen
  rationale: „Ausgänge“ gibt den Sinn des Heraus- oder Hinausgehens wieder und bewahrt die kosmologische Vorstellung, ohne die betreffenden Himmelserscheinungen ausdrücklich zu bestimmen.
theological_decisions:
- issue: Kosmische Geografie und Himmelsarchitektur
  choice: Die visionären Bilder „Enden der Erde“ und „Tore des Himmels“ werden konkret beibehalten.
  alternative: Modernisierende Wiedergaben wie „im äußersten Westen“ und „Öffnungen am Himmel“.
  rationale: Der Text entwirft eine strukturierte apokalyptische Welt. Eine naturalisierende Übersetzung würde diese genuine Bildwelt abschwächen.
- issue: Art der Entsprechung zwischen den Toren
  choice: „entsprechend“ bleibt semantisch offen.
  alternative: Eine Festlegung auf gleiche Größe, Anzahl oder Anordnung.
  rationale: በአምጣነ kann Maß oder Zuordnung ausdrücken; der Vers bestimmt nicht eindeutig, worin die Entsprechung besteht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener apokalyptischer Bildsprache. „Tore“ ist allgemein verständlicher als „Portale“, während „Pforten“ als Alternative in der Fußnote erscheint.
