base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/015.yaml
  text: And the sinners will cry out and see them while they shine[a], and they themselves will go to where the days and the times have been written down for them[e][d][c][b]. The vision of the hidden things of Enoch.
translation:
  language: de
  text: Und die Sünder werden aufschreien und sie sehen, während sie leuchten[a]. Sie selbst werden dorthin gehen, wo ihnen die Tage und die Zeiten aufgeschrieben sind[b]. Die Schau der verborgenen Dinge Henochs.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die zugrunde liegende Verbform ist schwierig. Sie kann möglicherweise auch eine unruhige Bewegung bezeichnen: „während sie umherirren“ oder „während sie in Aufruhr sind“.'
    reason: lexical_alternative
  - marker: b
    text: Das Aufschreiben der Tage und Zeiten greift das apokalyptische Bild im Voraus verzeichneter Gerichtszeiten auf.
    reason: cultural_note
  - marker: c
    text: 'Diese Schlussworte sind wahrscheinlich eine eigenständige Überschrift oder Unterschrift; wörtlich: „Schau der verborgenen Dinge Henochs“.'
    reason: textual_note
lexical_decisions:
- source_word: ወይጸርኁ
  choice: Und … werden aufschreien
  rationale: Das Verb bezeichnet ein lautes Rufen oder Klagen. „Aufschreien“ bewahrt die eindringliche apokalyptische Wirkung, ohne den Ausruf ausschließlich als Trauer zu bestimmen.
- source_word: ወይሬእይዎሙ ኃጥኣን
  choice: und die Sünder werden sie sehen
  rationale: Die Objektendung wird mit „sie“ wiedergegeben; „die Sünder“ bezeichnet wie im Kontext eine bestimmte Gruppe.
- source_word: እንዘ ይትወሐውሑ
  choice: während sie leuchten
  rationale: Die überlieferte Form ist schwierig. Die Wiedergabe folgt dem durch den Kontext gestützten Verständnis eines sichtbaren Leuchtens, während die mögliche Deutung als unruhige Bewegung in einer Fußnote erhalten bleibt.
- source_word: ወየሐውሩ እሙንቱሂ
  choice: Sie selbst aber werden … gehen
  rationale: Das häufige Bewegungsverb wird schlicht mit „gehen“ wiedergegeben; „sie selbst“ bewahrt die Hervorhebung des Pronomens samt Partikel. „Aber“ macht den im Zusammenhang liegenden Gegensatz im Deutschen lesbar.
- source_word: በኀበ
  choice: dorthin …, wohin
  rationale: Die Formulierung gibt die gerichtete Bewegung zu einem Ziel idiomatisch und zugleich ausdrücklich wieder.
- source_word: ተጽሕፉ ሎሙ መዋዕለ ወእዝማን
  choice: wohin ihnen die Tage und die Zeiten aufgeschrieben sind
  rationale: Das Passiv mit Dativ wird eng am Wortlaut wiedergegeben. „Aufgeschrieben“ wahrt das apokalyptische Bild im Voraus verzeichneter Zeiten.
- source_word: ራእየ ኅቡኣት ዘሄኖክ
  choice: Die Schau der verborgenen Dinge Henochs
  rationale: Die geʿezische Wortgruppe enthält weder eine Präposition mit der Bedeutung „in“ noch ein Relativverb „sah“. Daher wird sie als eigenständige nominale Schlussformel wiedergegeben.
theological_decisions:
- issue: Funktion der abschließenden Wortgruppe ራእየ ኅቡኣት ዘሄኖክ
  choice: 'Eigenständige Schlussformel: „Die Schau der verborgenen Dinge Henochs.“'
  alternative: Ein in den vorangehenden Satz einbezogener Hinweis auf das von Henoch Geschaute
  rationale: Die vorliegende geʿezische Syntax spricht für eine nominale Überschrift oder Unterschrift. Die formale Zuordnung als Titel oder Kolophon bleibt dennoch offen und wird nicht konfessionell ausgedeutet.
- issue: Vorherbestimmte Zeiten des Gerichts
  choice: „ihnen die Tage und die Zeiten aufgeschrieben sind“
  alternative: „ihre bestimmten Tage und Zeitabschnitte festgesetzt sind“
  rationale: Die Übersetzung bewahrt das Motiv der schriftlichen Verzeichnung, ohne über den Text hinaus eine besondere Lehre über Vorherbestimmung zu formulieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah an der geʿezischen Bewegungs- und Zielkonstruktion, ohne unnatürlich zu wirken. „Schau“ wahrt den visionären Charakter von ራእይ und klingt im Deutschen gehoben, aber verständlich. Die Schlussformel wird wegen der fehlenden Präposition und des fehlenden Relativverbs nicht in den vorangehenden Satz integriert.
