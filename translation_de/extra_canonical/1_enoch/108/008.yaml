base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/008.yaml
  text: those who love God[a], and did not love gold or silver or any of the good things that are in the world[b], but gave their bodies to affliction.
translation:
  language: de
  text: die Gott lieben und weder Gold noch Silber noch irgendetwas Gutes, das in der Welt ist[b], liebten, sondern ihre Körper[a] der Bedrängnis hingaben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das ge’ezische Wort ሥጋ kann „Fleisch“ oder „Körper“ bedeuten. Hier steht „Körper“, doch die Formulierung betont in jedem Fall leibliches Leiden.
    reason: lexical_alternative
  - marker: b
    text: Die hier mit „irgendetwas Gutes, das in der Welt ist“ wiedergegebene Wendung ist in der vorliegenden Textgestalt unsicher. Gemeint sind wahrscheinlich allgemein die begehrenswerten Güter der Welt.
    reason: textual_variant
lexical_decisions:
- source_word: እለ
  choice: die
  rationale: Der pluralische Relativmarker leitet die beschriebene Personengruppe ein; im fortlaufenden deutschen Satz ist „die“ natürlich und genau.
- source_word: ያፈቅርዎ ለአምላክ
  choice: Gott lieben
  rationale: Die Wendung bezeichnet die Liebe und Hingabe an Gott. Das Präsens bewahrt den charakterisierenden, nicht auf einen einzelnen Zeitpunkt beschränkten Sinn.
- source_word: ወኢወርቀ ወኢብሩረ አፍቀሩ
  choice: weder Gold noch Silber … liebten
  rationale: „Lieben“ erhält die lexikalische Verbindung und den bewussten Gegensatz zwischen der Liebe zu Gott und der Liebe zum Reichtum; „weder … noch“ gibt die wiederholte Verneinung idiomatisch wieder.
- source_word: ወኢኵሎ ሠናየ ዘውስተ ዓለም
  choice: noch irgendeines der guten Dinge in der Welt
  rationale: Die Formulierung wahrt den wahrscheinlich distributiven Sinn und zugleich die Breite der Aussage über begehrenswerte weltliche Güter, ohne den unsicheren Text stärker als nötig zu glätten.
- source_word: አላ
  choice: sondern
  rationale: Nach der verneinten Aussage markiert „sondern“ im Deutschen den starken Gegensatz zur anschließenden Hingabe an Bedrängnis.
- source_word: ወሀቡ ሥጋሆሙ
  choice: ihre Körper hingaben
  rationale: ሥጋ kann „Fleisch“ oder „Körper“ bedeuten. „Körper“ bezeichnet hier verständlich die leibliche Selbsthingabe; „hingaben“ bringt die zielgerichtete Konstruktion natürlich zum Ausdruck.
- source_word: ለጻዕር
  choice: der Bedrängnis
  rationale: Das Substantiv umfasst Mühsal, Not und Leiden. „Bedrängnis“ lässt offen, ob Verfolgung, asketische Härte oder sonstiges Leiden gemeint ist.
theological_decisions:
- issue: Ob lediglich materielle Armut oder eine bewusste Abkehr von weltlichen Gütern aus Liebe zu Gott beschrieben wird
  choice: Der Text stellt die Liebe zu Gott der Liebe zu Reichtum und weltlichen Gütern gegenüber und verbindet dies mit leiblicher Hingabe an Bedrängnis.
  alternative: Die Personen werden lediglich als arm beschrieben, oder der Vers richtet sich nur allgemein gegen Habgier.
  rationale: Die Wiederaufnahme des Verbs „lieben“ schafft einen ausdrücklichen Gegensatz der Bindungen. Die abschließende Hingabe des Körpers an Bedrängnis deutet auf bewusst angenommenes oder treu ertragenes Leiden, ohne dessen genaue Art festzulegen.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die wechselnden Verbzeiten des ge’ezischen Textes werden beibehalten: gegenwärtige Liebe zu Gott steht neben den vollzogenen Entscheidungen, weltliche Güter nicht zu lieben und den Körper der Bedrängnis hinzugeben. Der Satz bleibt als Relativsatzfragment erhalten, weil der Vers syntaktisch an seinen Kontext anschließt.'
