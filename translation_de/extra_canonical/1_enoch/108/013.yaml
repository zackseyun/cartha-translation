base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/013.yaml
  text: And they will shine in times without number[a], for the righteousness belongs to God[f][e][d][c][b]; for he will give faith to the faithful in the dwelling of the paths of uprightness.
translation:
  language: de
  text: Und sie werden sich freuen in Zeiten ohne Zahl[a], denn Gottes Gericht ist gerecht[b]; denn er wird den Gläubigen Glauben schenken[c] im Wohnort der Pfade der Rechtschaffenheit[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch unzählige Zeitalter“. Der ge''ezische Ausdruck spricht von Zeiten, die nicht gezählt werden können.'
    reason: lexical_alternative
  - marker: b
    text: Die Übersetzung folgt der wahrscheinlich ursprünglichen Lesart „sein Gericht“ (ኵነኔሁ). Die vorliegende Transkription bietet አነኒሁ; daraus wurde auch „denn die Gerechtigkeit gehört Gott“ erschlossen.
    reason: textual_variant
  - marker: c
    text: 'Oder: „Er wird den Treuen Treue“ beziehungsweise „Standhaftigkeit schenken“. Im Ge''ez stehen verwandte Wörter für „Gläubige/Treue“ und „Glaube/Treue“.'
    reason: lexical_alternative
  - marker: d
    text: Die ungewöhnliche Wendung bewahrt das konkrete Bild eines Wohnorts, der durch Pfade der Rechtschaffenheit gekennzeichnet ist.
    reason: cultural_note
lexical_decisions:
- source_word: ይትወሐውሑ
  choice: sie werden sich freuen
  rationale: Die Verbform bezeichnet hier am ehesten künftige Freude beziehungsweise jubelnde Erhebung. Diese Wiedergabe folgt dem überlieferten ge'ezischen Verb und vermeidet das im englischen Konsultationstext stehende, lexikalisch weniger gut gestützte „leuchten“.
- source_word: በእዝማን ዘአልቦ ኍልቈ
  choice: in Zeiten ohne Zahl
  rationale: Die Formulierung bewahrt sowohl den zeitlichen Ausdruck als auch das Bild des Nicht-Zählbaren; „unzählige Zeitalter“ bleibt als mögliche Nuance offen.
- source_word: ጽድቅ ኵነኔሁ ለአምላክ
  choice: Gottes Gericht ist gerecht
  rationale: Die Übersetzung folgt der textkritisch begründeten Lesart ኵነኔሁ („sein Gericht“) statt des offenbar verderbten beziehungsweise fehlerhaft transkribierten አነኒሁ. Dadurch ergibt sich die natürliche Aussage, dass Gottes Gericht gerecht ist.
- source_word: ለመሃይምናን
  choice: den Gläubigen
  rationale: Das Wort bezeichnet Glaubende beziehungsweise Treue und bildet mit ሃይማኖተ eine bewusste Wortverbindung; „den Weisen“ wäre lexikalisch nicht sachgerecht.
- source_word: ሃይማኖተ
  choice: Glauben
  rationale: Das Substantiv kann Glauben, Treue oder Standhaftigkeit bezeichnen. „Glauben“ gibt die unmittelbare Wortverbindung mit „den Gläubigen“ wieder, während die ethische Nuance in der Fußnote erhalten bleibt.
- source_word: በማኅደረ ፍናዋተ ርትዕ
  choice: in der Wohnstätte der Pfade der Rechtschaffenheit
  rationale: Die bewusst konkrete und dichte Bildsprache des Ortes und der moralischen Wege wird bewahrt, statt sie zu einer abstrakten Aussage zu verflachen.
theological_decisions:
- issue: Wesen der göttlichen Gabe an die Gläubigen
  choice: Gott schenkt den Gläubigen Glauben
  alternative: Gott schenkt den Treuen Treue beziehungsweise Standhaftigkeit
  rationale: Das ge'ezische Wortfeld umfasst sowohl Glauben als auch Treue. Der Haupttext wahrt die erkennbare Stammverbindung, während die Fußnote die für das Ausharren relevante Bedeutungsnuance offenhält.
- issue: Begründung der endzeitlichen Freude
  choice: Gottes Gericht ist gerecht
  alternative: Die Gerechtigkeit gehört Gott
  rationale: Die textkritisch wahrscheinlichere Lesart nennt ausdrücklich Gottes Gericht. Die Alternative beruht auf der überlieferten Transkription አነኒሁ, die sehr wahrscheinlich eine Verlesung von ኵነኔሁ ist; diese Unsicherheit wird transparent vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht gehobener apokalyptischer Bildsprache. Die ungewöhnliche Ortsmetapher bleibt bewusst erhalten; textkritische und lexikalische Unsicherheiten werden nicht stillschweigend aufgelöst.
