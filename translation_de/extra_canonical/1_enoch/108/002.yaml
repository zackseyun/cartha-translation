base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/002.yaml
  text: You who have done good[a], wait for those days until those who do evil are brought to an end[c][b], and the power of the sinners comes to an end.
translation:
  language: de
  text: 'Ihr, die ihr Gutes getan habt: Wartet auf jene Tage, bis diejenigen, die Böses tun, an ihr Ende gebracht werden[b] und die Macht der Sünder ein Ende nimmt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Wörtlich auch: „vollendet werden“ oder „zu ihrem Ende kommen“. Die passive Form bezieht sich auf diejenigen, die Böses tun.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እለ ገበርክሙ ሠናየ
  choice: Ihr, die ihr Gutes getan habt
  rationale: Die Relativkonstruktion mit Perfekt redet eine Gruppe an, die durch gutes Handeln gekennzeichnet ist; die Formulierung bewahrt den Gegensatz zu denen, die Böses tun.
- source_word: ትጸንሑ
  choice: Haltet stand
  rationale: Das Verb bezeichnet Bleiben, Ausharren oder geduldiges Warten. „Haltet stand“ bewahrt den Gedanken beharrlicher Ausdauer, während der Zusatz „in Erwartung“ die zeitliche Ausrichtung des Zusammenhangs ausdrückt.
- source_word: ለእሉ መዋዕል
  choice: in Erwartung jener Tage
  rationale: መዋዕል bezeichnet Tage beziehungsweise Zeiten; die Präposition ist hier flexibel. Diese Wiedergabe ergibt natürliches Deutsch und lässt die folgende Bis-Klausel die Dauer bestimmen.
- source_word: እስከ ይትፌጸሙ እለ ይገብሩ እኩየ
  choice: bis die, die Böses tun, an ihr Ende gebracht werden
  rationale: Die passive Form bezeichnet das Erreichen beziehungsweise Herbeiführen eines Endes. Die Übersetzung macht deutlich, dass die Übeltäter selbst enden, nicht lediglich ihr böses Tun.
- source_word: ወይትፌጸም ኃይሎሙ ለመአብሳን
  choice: und die Macht der Sünder ein Ende nimmt
  rationale: ኃይል bedeutet Macht, Kraft oder Stärke; መአብሳን bezeichnet Sünder. Die Formulierung wiederholt natürlich den Gedanken des Zu-Ende-Kommens.
theological_decisions:
- issue: Wiedergabe von መአብሳን
  choice: Sünder
  alternative: Frevler; Gottlose
  rationale: „Sünder“ wahrt den moralisch-religiösen Gehalt des Substantivs und unterscheidet es von der vorhergehenden verbalen Beschreibung „die Böses tun“.
- issue: Schicksal derer, die Böses tun
  choice: an ihr Ende gebracht werden
  alternative: vollendet werden; zu Ende gehen
  rationale: Die passive Form wird als eschatologisches Ende der Handelnden wiedergegeben, ohne näher festzulegen, auf welche Weise dieses Ende eintritt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt markiert die anschließende Aufforderung; „Haltet stand in Erwartung“ verbindet die Bedeutungsanteile von Ausharren und Warten, ohne die zeitliche Präposition übermäßig festzulegen.
