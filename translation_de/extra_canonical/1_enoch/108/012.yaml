base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/012.yaml
  text: And I will bring out into bright light those who loved my holy name[c][b][a], and I will seat each one on the throne of his glory.
translation:
  language: de
  text: Und ich werde die, die meinen heiligen Namen geliebt haben, in strahlendes Licht hinausführen und jeden Einzelnen auf den Thron seiner Herrlichkeit setzen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: እወፅኦሙ
  choice: ich werde … hinausführen
  rationale: Das Verb bezeichnet ein Veranlassen oder Führen nach draußen. „Hinausführen“ bewahrt die Bewegungsrichtung und klingt im Deutschen natürlich und würdevoll.
- source_word: በብሩህ ብርሃን
  choice: in strahlendes Licht
  rationale: Die Verbindung verstärkt das Lichtmotiv. Bei dem Bewegungsverb gibt „in … Licht“ das Ziel idiomatisch wieder, ohne das Bild auszuschmücken.
- source_word: ለእለ አፍቀርዎ ለስምየ ቅዱስ
  choice: die, die meinen heiligen Namen geliebt haben
  rationale: Das präfigierte ለ- kann hier als Objektmarkierung zu dem vorausweisenden Objektsuffix am Verb verstanden werden. Die deutsche Fassung kennzeichnet diese Menschen daher als direktes Objekt; die alternative Benefaktivlesart bleibt in der Fußnote erhalten.
- source_word: አነብር
  choice: ich werde … setzen
  rationale: Im Zusammenhang mit einem Thron bezeichnet das Verb das Platznehmenlassen beziehungsweise Einsetzen, nicht bloß ein Wohnen.
- source_word: አሐደ አሐደ
  choice: jeden Einzelnen
  rationale: Die Wiederholung hat distributiven Sinn und betont, dass jeder individuell eingesetzt wird.
- source_word: መንበረ ክብር ዚአሁ
  choice: den Thron seiner Herrlichkeit
  rationale: „Thron“ entspricht dem apokalyptischen Kontext; die Genitivfügung und das männliche Singularpronomen werden formal bewahrt.
theological_decisions:
- issue: Bezug von „seiner“ in der Schlusswendung
  choice: 'Das Pronomen bezieht sich am ehesten auf „jeden Einzelnen“: Jeder wird auf den Thron seiner eigenen Herrlichkeit gesetzt.'
  alternative: Das Pronomen kann auf Gott beziehungsweise den Herrn bezogen oder die Wendung allgemeiner als „den herrlichen Thron“ verstanden werden.
  rationale: Das unmittelbar vorausgehende distributive Singularglied አሐደ አሐደ bietet einen grammatisch naheliegenden Bezug für ዚአሁ. Die deutsche Hauptfassung lässt das Pronomen dennoch stehen, statt die theologische Bildsprache weiter auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die apokalyptische Licht- und Thronbildsprache bleibt erhalten; grammatische und theologische Mehrdeutigkeiten werden nicht stillschweigend aufgelöst.
