base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/001.yaml
  text: Another book that Enoch wrote for his son Methuselah[a], and for those who will come after him and keep the ordinance in the latter days.
translation:
  language: de
  text: Ein weiteres Buch, das Henoch für seinen Sohn Metuschelach schrieb und für die, die nach ihm kommen und in den letzten Tagen die Ordnung[a] bewahren werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Regel“, „die Satzung“ oder „den vorgeschriebenen Weg“. Das ge’ezische Wort kann eine festgelegte Norm oder Ordnung bezeichnen, an die man sich halten soll.'
    reason: Lexikalische Bedeutungsbreite von ሥርዐተ.
lexical_decisions:
- source_word: ካልእ
  choice: ein weiteres
  rationale: Kennzeichnet eine zusätzliche, vom Vorhergehenden unterschiedene Schrift, ohne zwingend eine genaue Reihenfolge festzulegen.
- source_word: መጽሐፍ
  choice: Buch
  rationale: Entspricht der gewöhnlichen Bedeutung und passt zum Charakter einer Überschrift.
- source_word: ዘጸሐፈ
  choice: das … schrieb
  rationale: Gibt die Relativkonstruktion und den einfachen Sinn des Verbs unmittelbar wieder.
- source_word: ለወልዱ ማቱሳላ
  choice: für seinen Sohn Metuschelach
  rationale: Die Dativmarkierung bezeichnet hier den vorgesehenen Empfänger; „für“ ist im Deutschen natürlich. „Metuschelach“ folgt der im deutschen Bibelgebrauch verbreiteten Namensform.
- source_word: ለእለ ይመጽኡ እምድኅሬሁ
  choice: für die, die nach ihm kommen
  rationale: Bewahrt den persönlichen Bezug und die Ausrichtung auf nachfolgende Menschen beziehungsweise Generationen.
- source_word: የዓቅቡ
  choice: bewahren werden
  rationale: Das Verb kann „bewahren“, „hüten“ oder „beachten“ bedeuten. „Bewahren“ verbindet die Vorstellung treuen Festhaltens mit der futurischen Ausrichtung des Satzes.
- source_word: ሥርዐተ
  choice: die Ordnung
  rationale: Der Ausdruck bezeichnet eine festgelegte Ordnung, Regel oder verbindliche Lebensweise. „Ordnung“ wahrt diese Bedeutungsbreite besser als eine enger rechtlich klingende Wiedergabe.
- source_word: በደኃሪ መዋዕል
  choice: in den letzten Tagen
  rationale: Bewahrt im apokalyptischen Kontext den endzeitlichen Klang der ge’ezischen Zeitangabe.
theological_decisions:
- issue: Endzeitlicher Gehalt von በደኃሪ መዋዕል
  choice: in den letzten Tagen
  alternative: in späteren Zeiten; am Ende der Tage
  rationale: Die Formulierung lässt in 1 Henoch eine endzeitliche Perspektive anklingen. Die gewählte Fassung erhält diesen Klang, ohne ihn mit einem späteren Lehrsystem näher zu bestimmen.
- issue: Normativer Sinn von ሥርዐተ
  choice: die Ordnung
  alternative: die Regel; die Satzung; den vorgeschriebenen Weg
  rationale: Der Kontext spricht von etwas, das eingehalten oder bewahrt wird, legt aber nicht eindeutig fest, ob eine einzelne Satzung, eine umfassende Ordnung oder eine vorgeschriebene Lebensweise gemeint ist. Die Übersetzung hält diese Spannung offen.
translation_notes:
  register: Moderne, würdige Standardsprache mit dem knappen Charakter einer Überschrift. Der Satzbau bleibt quellennah, wird aber durch die wiederholte Formulierung „für die, die“ im Deutschen klar gegliedert.
