revisions:
- from: Und ich habe in den Büchern von all ihren Segnungen gesprochen und sie für ihre Häupter bestimmt[a]; denn von diesen zeigt sich, dass sie den Himmel mehr lieben als ihr Leben in der Welt[b]. Während sie von bösen Menschen niedergetreten werden, hören sie von ihnen Beschimpfungen und Schmähungen und erleiden Schande, während sie mich segnen.[c]
  to: Und ich habe in den Büchern von all ihren Segnungen gesprochen und sie für ihre Häupter bestimmt[a]; denn diese erweisen sich als solche, die den Himmel mehr lieben als ihr Leben in der Welt[b]. Während sie von bösen Menschen niedergetreten werden, hören sie von ihnen Beschimpfungen und Schmähungen und erleiden Schande, während sie mich segnen.[c]
  rationale: Eine kleine stilistische Korrektur ersetzt allein die unidiomatische Wendung „von diesen zeigt sich, dass sie“ durch eine klare, textnahe deutsche Konstruktion. Die schwierige Häupter-Wendung, die konkrete Metapher des Niedergetretenwerdens und der auffällige erste-Person-Bezug im Schluss bleiben unverändert und werden weiterhin durch Fußnoten abgesichert.
