  terminology: „Segnungen“, „Himmel“, „böse Menschen“, „Beschimpfungen und Schmähungen“ sowie „Schande erleiden“ treffen Register und Sinn. „Niedergetreten werden“ erhält die Bildlichkeit von ይትከየዱ. Die Wendung „für ihre Häupter bestimmt“ darf wegen der Schwierigkeit des Ausgangstextes nicht zu „zu Anführern eingesetzt“ vereinseitigt werden.
