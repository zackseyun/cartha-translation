base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/010.yaml
  text: And I have spoken of all their blessings in the books, and he has rewarded them themselves, because these are found to love heaven more than their life in the world; and while they are trodden down by evil men, they hear from them abuse and reviling and are put to shame while blessing me.
translation:
  language: de
  text: Und ich habe in den Büchern von all ihren Segnungen gesprochen und sie für ihre Häupter bestimmt[a]; denn diese erweisen sich als solche, die den Himmel mehr lieben als ihr Leben in der Welt[b]. Während sie von bösen Menschen niedergetreten werden, hören sie von ihnen Beschimpfungen und Schmähungen und erleiden Schande, während sie mich segnen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „für ihre Häupter“. Gemeint sein könnten ihre Anführer oder Oberhäupter; die geezische Wendung und ihr Satzbezug sind schwierig.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „mehr als ihren Atem in der Welt“. „Atem“ bezeichnet hier wahrscheinlich ihr irdisches Leben.'
    reason: lexical_alternative
  - marker: c
    text: Der überlieferte Wortlaut lautet „während sie mich segnen“. Das ungewöhnliche Objekt der ersten Person bleibt erhalten; möglicherweise liegt eine schwierige oder verderbte Lesart vor.
    reason: textual_variant
lexical_decisions:
- source_word: ኵሎ፡ በረከቶሙ
  choice: all ihren Segnungen
  rationale: Der Plural von በረከት bezeichnet die den Gerechten zukommenden Segnungen; die konkrete apokalyptische Ausdrucksweise bleibt erhalten.
- source_word: ነገርኩ፡ በመጻሕፍት
  choice: ich habe in den Büchern … gesprochen
  rationale: Die erste Person und der Plural „Bücher“ werden bewahrt; „gesprochen“ gibt das Aussage- und Berichtswort zurück, ohne es auf bloßes Schreiben einzuengen.
- source_word: ዐሰዮሙ፡ ለአርእስቲሆሙ
  choice: ich habe sie für ihre Häupter bestimmt
  rationale: Die schwierige Wendung wird möglichst eng wiedergegeben. „Häupter“ bewahrt sowohl den wörtlichen Sinn als auch die mögliche Bedeutung „Anführer“, während „bestimmt“ den Sinn des Einsetzens oder Zuordnens offenhält.
- source_word: ተረክቡ
  choice: von diesen zeigt sich
  rationale: Die passive Bedeutung „werden gefunden/erweisen sich“ wird in natürlichem Deutsch ausgedrückt, ohne die Aussage stärker als nötig festzulegen.
- source_word: ያፈቅርዎ፡ ለሰማይ
  choice: den Himmel lieben
  rationale: „Himmel“ wird als unmittelbares Objekt beibehalten und nicht zu einer allgemeineren Umschreibung wie „das Himmlische“ verflacht.
- source_word: እምእስትንፋሶሙ፡ ዘበዓለም
  choice: mehr … als ihr Leben in der Welt
  rationale: እስትንፋስ bedeutet wörtlich „Atem“, bezeichnet hier aber idiomatisch das Leben. Die Fußnote hält das konkrete Bild fest.
- source_word: ይትከየዱ
  choice: niedergetreten werden
  rationale: Die bildhafte Sprache des Tretens und der Unterdrückung bleibt stärker erhalten als bei dem abstrakteren „bedrängt werden“.
- source_word: እምእኩያን፡ ሰብእ
  choice: von bösen Menschen
  rationale: Die moralische Kennzeichnung wird klar wiedergegeben; „Menschen“ ist im modernen Deutschen geschlechtsübergreifend und natürlich.
- source_word: ትዕይርተ፡ ወጽርፈተ
  choice: Beschimpfungen und Schmähungen
  rationale: Das Paar feindseliger Redeakte wird als Doppelung bewahrt, ohne „Lästerung“ vorschnell auf Gotteslästerung festzulegen.
- source_word: ኀሥሡ (wohl ኀስሩ)
  choice: erleiden Schande
  rationale: 'Die Lesung wird als Form der Wurzel ኀስረ verstanden: „beschämt werden/Schande erleiden“, nicht „ausharren“. Die deutsche Formulierung vermeidet den Eindruck bloßer innerer Verlegenheit.'
- source_word: እንዘ፡ ይባርኩኒ
  choice: während sie mich segnen
  rationale: Das ungewöhnliche Objekt der ersten Person wird grammatisch unverändert bewahrt und nicht stillschweigend durch „Gott“ oder „den Herrn“ ersetzt.
theological_decisions:
- issue: Bezug der ersten Person in „während sie mich segnen“
  choice: Das „mich“ bleibt im Haupttext stehen und bezieht sich grammatisch auf den Ich-Sprecher.
  alternative: „Während sie Gott/den Herrn segnen“ oder Annahme eines verderbten Textes.
  rationale: Der überlieferte Wortlaut enthält ausdrücklich ein Objekt der ersten Person. Eine theologisch glättende Ersetzung wäre textlich nicht ausgewiesen; die auffällige Spannung wird daher in einer Fußnote benannt.
- issue: Bedeutung von „ihre Häupter“
  choice: Die körperliche Metapher „Häupter“ bleibt erhalten.
  alternative: Eindeutige Auflösung als „Anführer“ oder „Oberhäupter“.
  rationale: አርእስት kann wörtliche Köpfe/Häupter oder übertragene Führer bezeichnen. Da auch der Satzbau schwierig ist, soll die Übersetzung keine nur mögliche Deutung als sicher ausgeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer apokalyptischer Bildsprache. Schwierige geezische Formulierungen werden weder konfessionell geglättet noch unnötig paraphrasiert; drei knappe Fußnoten machen die wesentlichen lexikalischen und textlichen Unsicherheiten transparent.
