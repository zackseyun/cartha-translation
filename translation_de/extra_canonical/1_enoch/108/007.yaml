base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/007.yaml
  text: For there are writings and records concerning them in heaven above[a], so that the angels may read them and know what will come upon the sinners, and upon the humble in spirit, and upon those who afflicted their bodies and received recompense from God[d][c][b], and those who were put to shame by evil men.
translation:
  language: de
  text: Denn über sie gibt es oben im Himmel Schriften und Verzeichnisse[a], damit die Engel sie lesen und erkennen, was über die Sünder kommen wird, über die demütigen Geister[b], über diejenigen, die ihren Leib leiden ließen und von Gott ihren Lohn empfingen[c], und über diejenigen, die von bösen Menschen beschämt wurden[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die mit „Schriften und Verzeichnisse“ wiedergegebene Wortverbindung ist schwierig. Das zweite Wort kann anders verstanden werden; weil im nächsten Satz vom Lesen durch Engel die Rede ist, liegt hier die Bedeutung himmlischer Aufzeichnungen nahe.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „demütige Geister“; je nach Verständnis von „Geister“ ist auch „demütige Seelen“ möglich. Die ge'ezische Formulierung bedeutet grammatisch nicht einfach „demütig im Geist“.
    reason: lexical_alternative
  - marker: c
    text: Das zugrunde liegende Wort kann auch mit „Vergeltung“ oder „Entgeltung“ wiedergegeben werden. Im Zusammenhang ist wahrscheinlich eine positive Belohnung oder Rechtfertigung durch Gott gemeint.
    reason: theological_ambiguity
  - marker: d
    text: Die schwierige Schlusswendung kann auch mit „von bösen Menschen geschmäht“ oder „verachtet“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: Denn
  rationale: Leitet eine Begründung oder Erläuterung zum vorausgehenden Zusammenhang ein und bewahrt die verbindende Kraft.
- source_word: ጽሑፋን ወእኩያን
  choice: Schriften und Verzeichnisse
  rationale: Der erste Ausdruck bezeichnet Geschriebenes; der zweite ist lexikalisch schwierig. Der folgende Hinweis, dass Engel sie lesen, spricht hier für himmlische Aufzeichnungen oder Verzeichnisse.
- source_word: ላዕለ በሰማይ
  choice: oben im Himmel
  rationale: Gibt sowohl den Ort als auch die Höhenvorstellung der apokalyptischen Szene natürlich wieder.
- source_word: ከመ ይንብብዎሙ መላእክት
  choice: damit die Engel sie lesen
  rationale: Bewahrt den Zweckcharakter des Satzes und den pluralischen Rückbezug auf die schriftlichen Gegenstände.
- source_word: ወይእምሩ
  choice: und erkennen
  rationale: Bezeichnet das Erlangen von Wissen; „erkennen“ passt zum feierlichen Register und zum Zusammenhang himmlischer Urteilsakten.
- source_word: ዘሀሎ ይብጽሖሙ
  choice: was über … kommen wird
  rationale: Bewahrt die Vorstellung eines künftig eintreffenden Geschicks, ohne dessen Art vorwegzunehmen.
- source_word: ለመናፍስት ትኁታን
  choice: über die demütigen Geister
  rationale: Die ge'ezische Nominalfügung besteht aus dem Plural „Geister“ mit dem pluralischen Adjektiv „demütig“; sie wird daher nicht zur bloßen Charaktereigenschaft „demütig im Geist“ umgeformt.
- source_word: እለ አሕመሙ ሥጋሆሙ
  choice: die ihren Leib leiden ließen
  rationale: Gibt die körperliche Härte wieder, legt die Wendung aber nicht ausdrücklich auf eine bestimmte spätere Askeselehre fest.
- source_word: ወተፈድዩ በኀበ አምላክ
  choice: und von Gott ihren Lohn empfingen
  rationale: Das Verb bezeichnet Entgeltung oder Vergeltung. Der Zusammenhang mit den demütigen und leidenden Gerechten legt hier eine positive göttliche Entlohnung nahe.
- source_word: እለ ኀሥሡ እምእኩያን ሰብእ
  choice: die von bösen Menschen beschämt wurden
  rationale: Die schwierige Schlusswendung wird im Sinn von Schmähung oder Entehrung durch böse Menschen wiedergegeben; die Unsicherheit wird in einer Fußnote offengelegt.
theological_decisions:
- issue: Bedeutung der himmlischen Schriftstücke
  choice: Himmlische Schriften und Verzeichnisse, die von Engeln gelesen werden
  alternative: Schriften über böse Taten oder ausdrücklich Bücher des Gerichts
  rationale: Die unmittelbar folgende Tätigkeit des Lesens stützt die Vorstellung schriftlicher himmlischer Aufzeichnungen, ohne ihre genaue Gattung festzulegen.
- issue: Grammatische und eschatologische Bedeutung von መናፍስት ትኁታን
  choice: die demütigen Geister
  alternative: die Demütigen im Geist oder die demütigen Seelen
  rationale: Die wörtliche Substantiv-Adjektiv-Verbindung wird bewahrt. So bleibt offen, ob „Geister“ hier verstorbene Personen, Seelen oder eine andere eschatologische Bezeichnung meint.
- issue: Charakter der göttlichen Vergeltung
  choice: positiver Lohn von Gott
  alternative: wertneutrale Vergeltung oder allgemeine göttliche Heimsuchung
  rationale: Die genannten demütigen und leidenden Gruppen stehen im Gegensatz zu den Sündern; daher ist die göttliche Entgeltung hier am ehesten als Anerkennung oder Lohn zu verstehen, ohne eine besondere Askeselehre einzuführen.
- issue: Art des körperlichen Leidens
  choice: selbstverursachtes oder bewusst getragenes körperliches Leiden, nicht näher bestimmt
  alternative: ausdrücklich asketische Selbstkasteiung oder ausschließlich von außen auferlegtes Leiden
  rationale: Die Formulierung bewahrt die Härte des Ausgangstextes, lässt aber dessen genaue lebenspraktische und theologische Einordnung offen.
translation_notes:
  register: Moderne, würdige Standardsprache mit apokalyptischem Ton. Die Satzstruktur folgt der Aufzählung des Ge'ez, wird aber durch wiederholtes „über“ im Deutschen verdeutlicht. Ungebräuchliche oder konfessionell aufgeladene Begriffe wie „Selbstkasteiung“ wurden im Haupttext vermieden.
