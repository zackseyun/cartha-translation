base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/005.yaml
  text: And I asked the two holy angels who were with me[a], and I said to him, “What is this glorious thing? For it is not heaven, but only a burning flame of fire[c][b], and the sound of weeping and crying out and lamentation and grievous pain.”
translation:
  language: de
  text: 'Und ich fragte die zwei heiligen Engel, die bei mir waren, und sagte zu ihm[a]: „Was ist dieses Herrliche[b]? Denn es ist nicht der Himmel, sondern nur eine brennende Feuerflamme[c] und der Klang von Weinen, Schreien und Klagen sowie heftiger Schmerz.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Ge’ez steht „ich sagte zu ihm“, obwohl unmittelbar zuvor „die zwei heiligen Engel“ genannt werden. Henoch könnte einen der Engel als Sprecher anreden; möglich ist auch eine Unregelmäßigkeit der Textüberlieferung.
    reason: textual_variant
  - marker: b
    text: 'Auch möglich: „Was ist dieser herrliche Ort?“ oder „Was ist dieser Glanz?“ Der Bezug wird im Vers selbst noch nicht ausdrücklich benannt.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlicher auch: „eine Feuerflamme, die brennt“. Die Formulierung bewahrt sowohl das Bild der Feuerflamme als auch das ausdrücklich genannte Brennen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስእልክዎ
  choice: ich fragte
  rationale: Das Verb bezeichnet Henochs Frage an seine engelhaften Begleiter; „fragte“ ist direkt, natürlich und quellennah.
- source_word: ፪አመላእክት ቅዱሳን
  choice: die zwei heiligen Engel
  rationale: Die Zahl zwei steht ausdrücklich im Text; „heilig“ bewahrt die übliche apokalyptische Bezeichnung.
- source_word: እለ ምስሌየ
  choice: die bei mir waren
  rationale: Die Relativkonstruktion kennzeichnet die Engel als Henochs Begleiter, ohne über den Wortlaut hinauszugehen.
- source_word: እቤሎ
  choice: sagte zu ihm
  rationale: Die überlieferte ge’ezische Form ist Singular und wird trotz des unmittelbar vorausgehenden Plurals bewahrt.
- source_word: ምንት ውእቱ ዝስቡሕ
  choice: Was ist dieses Herrliche?
  rationale: Die substantivierte Form „dieses Herrliche“ lässt den noch nicht eindeutig benannten Bezug offen und bewahrt zugleich den Sinn von Herrlichkeit oder Glanz.
- source_word: አኮኑ ሰማየ
  choice: es ist nicht der Himmel
  rationale: Die Aussage stellt das Gesehene dem Himmel gegenüber; der Singular ist im Deutschen idiomatisch und entspricht dem visionären Zusammenhang.
- source_word: ላህበ እሳት ባሕቲቱ ዘይነድድ
  choice: nur eine brennende Feuerflamme
  rationale: „Feuerflamme“ erhält die apokalyptische Bildformel, „brennende“ gibt das ausdrückliche Brennen wieder, und „nur“ markiert den ausschließenden Gegensatz zum Himmel.
- source_word: ቃለ ብካይ
  choice: der Klang von Weinen
  rationale: „Klang“ gibt das akustische ቃለ wieder und fügt sich natürlich in die Aufzählung hörbarer Leiden ein.
- source_word: ጽራሕ ወአውያት
  choice: Schreien und Klagen
  rationale: Die beiden Ausdrücke bleiben als unterschiedliche Formen laut geäußerten Leids erhalten.
- source_word: ሕማም ኀያል
  choice: schwerer Schmerz
  rationale: Die Wendung bezeichnet intensiven Schmerz; „schwer“ wahrt Stärke und würdigen Ton ohne zusätzliche Deutung.
theological_decisions:
- issue: Ob die Szene zu einer allgemeinen Aussage über Strafe oder Qual zusammengefasst werden soll
  choice: Die konkreten Bilder von Feuer, Weinen, Schreien, Klagen und Schmerz bleiben erhalten.
  alternative: Die Aufzählung verallgemeinernd als „Qual“ oder „Strafe“ wiederzugeben.
  rationale: Der Vers wirkt durch seine sinnlich-konkrete, kumulative apokalyptische Bildsprache. Eine Zusammenfassung würde die visionäre Spannung und die Eigenart des Wortlauts abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener apokalyptischer Wiederholung. Die Reihung „Weinen, Schreien und Klagen“ bleibt konkret und klanglich abgestuft; konfessionell geprägte Deutungsbegriffe werden vermieden.
