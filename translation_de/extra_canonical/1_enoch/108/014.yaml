review_pass:
  verdict: revise
  source_fidelity: 'Die deutsche Fassung gibt die entscheidende Aussage korrekt wieder: Die in der Finsternis Geborenen werden in die Finsternis geworfen, im Kontrast zum Leuchten der Gerechten. Allerdings lässt „Und sie werden sehen“ das im geezischen Wortlaut ausdrücklich vorhandene visionäre Subjekt der ersten Person („Und ich sah“) aus. Die englische POB-Hauptzeile ist an dieser Stelle offenbar fehlerhaft verkürzt; ihr eigener lexikalischer Audit-Trail bestätigt jedoch „And I saw“.'
  naturalness: '„Und ich sah: Diejenigen, die in der Finsternis geboren wurden, werden in die Finsternis geworfen, während die Gerechten leuchten“ ist modernes, würdiges und idiomatisches Standarddeutsch. Der Doppelpunkt gibt den Wahrnehmungsinhalt natürlich wieder, ohne das nicht vorhandene „wie“ einzuführen.'
  terminology: '„Finsternis“, „geworfen“ und „die Gerechten“ sind sachgerecht. Die Fußnote ist als lexikalische Alternative vertretbar, sollte aber präziser formuliert werden: „erhellt werden“ verschiebt die Form stärker ins Passive, während „hell werden“ bzw. „aufleuchten“ die genannte Alternative besser abbildet.'
  issues:
  - severity: high
    issue: Auslassung von „ich“ in der einleitenden Visionsformel
    rationale: Der geezische Wortlaut beginnt mit ወይሬ („und ich sah“). Die Übersetzung „Und sie werden sehen“ folgt zwar der verkürzten englischen Hauptzeile, widerspricht aber dem Quelltext und auch dem englischen lexikalischen Entscheidungsprotokoll, das ausdrücklich „And I saw“ festhält.
  - severity: low
    issue: Zusatz „wie“
    rationale: „wie“ ist im Deutschen möglich, aber der geezische Text hat nach „ich sah“ unmittelbar den gesehenen Sachverhalt. Ein Doppelpunkt bildet die Visionseinleitung genauer und klarer ab.
  - severity: low
    issue: Fußnotenalternative „erhellt werden“
    rationale: Diese passive Umschreibung kann als weitergehende Deutung gelesen werden. „hell werden“ wahrt die alternative Vorgangsnuance ohne einen ausdrücklich verursachenden Akteur nahezulegen.
  revised_text: 'Und ich sah: Diejenigen, die in der Finsternis geboren wurden, werden in die Finsternis geworfen, während die Gerechten leuchten.[a]'
  revised_footnotes:
  - marker: a
