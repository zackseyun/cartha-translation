base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/014.yaml
  text: And they will see those who were born in darkness cast into darkness[e][d][c][b][a], while the righteous shine.
translation:
  language: de
  text: 'Und ich sah: Diejenigen, die in der Finsternis geboren wurden, werden in die Finsternis geworfen, während die Gerechten leuchten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „während die Gerechten hell werden“ oder „aufleuchten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይሬ እይዎሙ
  choice: Und sie werden sehen
  rationale: Der überlieferte Wortlaut wird im Kontext als Zukunftsaussage verstanden. Die Formulierung folgt der revidierten Lesart und führt den Gegenstand des Sehens natürlich mit „wie“ ein.
- source_word: ለእለ ተወልዱ በጽልመት
  choice: die, die in der Finsternis geboren wurden
  rationale: Bewahrt die relative Konstruktion, den Passivcharakter von „geboren wurden“ und die erste Nennung der Finsternis.
- source_word: ይትወደዩ በጽልመት
  choice: in die Finsternis geworfen werden
  rationale: ይትወደዩ wird als passiver Imperfekt des geezischen Verbs ወደየ „werfen, setzen“ verstanden; በ bezeichnet hier im Zusammenhang die Richtung. Die Wiedergabe vermeidet die sachlich unzutreffende Ableitung von einem Wort für „lieben“.
- source_word: እንዘ ይትወሐውሑ
  choice: während … leuchten
  rationale: Die durch እንዘ eingeleitete Begleitumstandskonstruktion wird temporal wiedergegeben. Der Imperfekt erhält durch den Zukunftskontext der Hauptaussage gegenwärtig-zukünftigen Bezug.
- source_word: ጻድቃን
  choice: die Gerechten
  rationale: Die übliche, theologisch nicht weiter einengende Wiedergabe des zentralen henochischen Ausdrucks.
theological_decisions:
- issue: Gerichtsaussage über die in der Finsternis Geborenen
  choice: „in die Finsternis geworfen werden“
  alternative: „in der Finsternis geliebt werden“
  rationale: Die alternative Deutung beruht auf einer Verwechslung mit einem späteren beziehungsweise anderen semitischen Wortstamm. Der geezische Wortlaut bezeichnet hier das Geworfenwerden und stellt es dem Leuchten der Gerechten gegenüber.
- issue: Aktives Leuchten oder Erhelltwerden der Gerechten
  choice: „die Gerechten leuchten“
  alternative: „die Gerechten werden erhellt“
  rationale: Die Verbform kann als Zustand beziehungsweise Vorgang des Hellwerdens verstanden werden. „Leuchten“ gibt den bildhaften Kontrast zur Finsternis knapp wieder, ohne ausdrücklich eine verursachende Instanz einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Finsternis“ bleibt als rhetorischer Kontrast erhalten; „wie“ macht die deutsche Satzfügung natürlich, ohne den Inhalt zu erweitern.
