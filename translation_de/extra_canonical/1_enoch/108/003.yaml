  source_fidelity: Die Übersetzung gibt die ge'ezischen Imperative, die Zukunftsaussagen und die Bildfolge zutreffend wieder. „wartet“ entspricht ጽንሑ und bewahrt die Wiederaufnahme des vorausgehenden Verses. Die Namen werden aus beiden ausdrücklich unterschiedenen Büchern getilgt; Plural und offene Genitivbeziehung bei „Büchern der Heiligen“ bleiben erhalten. Auch die spannungsvolle Folge „Geister werden getötet“ und anschließendes Schreien und Wehklagen wird nicht dogmatisch geglättet. „unsichtbaren“ trifft ዘኢያስተርኢ im Sinn von nicht sichtbar/nicht erscheinend. Die ungewöhnliche Schlussaussage über das Fehlen von Erde bleibt sachgerecht wörtlich.
