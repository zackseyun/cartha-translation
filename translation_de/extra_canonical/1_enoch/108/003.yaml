base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/003.yaml
  text: But you[a], wait until sin passes away; for their names will be blotted out from the book of life and from the books of the holy ones, and their offspring will be destroyed forever. And their spirits will be slain, and they will cry out and lament in a desolate place that is unseen, and in burning fire[d][c][b]; for there is no earth there.
translation:
  language: de
  text: Ihr aber, wartet, bis die Sünde vergeht; denn ihre Namen werden aus dem Buch des Lebens und aus den Büchern der Heiligen getilgt werden, und ihre Nachkommen werden für immer zugrunde gehen. Ihre Geister werden getötet werden, und sie werden an einem öden, unsichtbaren Ort[a] und in loderndem Feuer schreien und wehklagen; denn dort gibt es keine Erde.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „der nicht sichtbar ist“ oder „der nicht erscheint“.'
    reason: lexical_alternative
  - marker: b
    text: Die ungewöhnliche Aussage „dort gibt es keine Erde“ gehört offenbar zur visionären Beschreibung des Strafortes; sie wird bewusst nicht zu „kein Boden“ oder „kein Land“ geglättet.
    reason: cultural_note
lexical_decisions:
- source_word: ጽንሑ
  choice: wartet
  rationale: Der pluralische Imperativ gehört zu ጸንሐ („warten, erwarten“) und nimmt die Formulierung des vorausgehenden Verses auf; er bedeutet hier nicht „haltet stand“.
- source_word: ተሐልፍ ኃጢአት
  choice: bis die Sünde vergeht
  rationale: Die Wendung bewahrt die apokalyptische Vorstellung, dass die Sünde vorübergeht, ohne sie auf Vergebung oder bloße Beseitigung einzuengen.
- source_word: ይደመስስ
  choice: werden … getilgt werden
  rationale: Bei Namen in himmlischen Büchern gibt „tilgen“ den Vorgang des Auslöschens eines Eintrags präzise und würdig wieder.
- source_word: እመጽሐፈ ሕይወት
  choice: aus dem Buch des Lebens
  rationale: Die geläufige deutsche Wendung entspricht dem Bild eines himmlischen Lebensregisters.
- source_word: እመጻሕፍተ ቅዱሳን
  choice: aus den Büchern der Heiligen
  rationale: Der Plural „Bücher“ bleibt erhalten. „der Heiligen“ lässt offen, ob die Bücher den Heiligen gehören, sie betreffen oder in anderer Weise mit ihnen verbunden sind.
- source_word: ዘርኦሙ ይትሐጐል ለዓለም
  choice: ihre Nachkommen werden für immer zugrunde gehen
  rationale: „Nachkommen“ vermittelt den Abstammungsbezug natürlich; „zugrunde gehen“ bewahrt die Aussage dauerhafter Vernichtung.
- source_word: መንፈሳቲሆሙ ይትቀተሉ
  choice: Ihre Geister werden getötet werden
  rationale: „Geister“ bildet den Quellbegriff ab, ohne ihn zu „Seelen“ umzudeuten. Die ungewöhnliche Verbindung von Geist und Tötung bleibt bewusst stehen.
- source_word: ይጸርኁ ወየአውይዉ
  choice: schreien und wehklagen
  rationale: Das Verbenpaar bezeichnet einen lauten, qualvollen Ausruf und Klageruf.
- source_word: በመካነ ባድው
  choice: an einem öden … Ort
  rationale: Die Formulierung bezeichnet einen leeren, verlassenen oder verwüsteten Strafort; „öde“ ist knapp und bildkräftig.
- source_word: ዘኢያስተርኢ
  choice: unsichtbaren
  rationale: Die Form von አስተርአየ bezeichnet Nicht-Erscheinen beziehungsweise Nicht-Sichtbarsein; „unsichtbar“ gibt dies sachgerecht wieder.
- source_word: በእሳተ ነዱ
  choice: in loderndem Feuer
  rationale: Die Wiedergabe erhält die intensivierte Feuerdarstellung in natürlichem Deutsch.
- source_word: ኢሀሎ ህየ ምድር
  choice: denn dort gibt es keine Erde
  rationale: Die ungewöhnliche kosmische Aussage wird wörtlich genug bewahrt und nicht vorschnell auf „Boden“ oder „Land“ eingeengt.
theological_decisions:
- issue: Die himmlischen Bücher, aus denen Namen getilgt werden
  choice: Der Text nennt das „Buch des Lebens“ und daneben mehrere „Bücher der Heiligen“ als unterscheidbare himmlische Verzeichnisse.
  alternative: Die „Bücher der Heiligen“ könnten Bücher im Besitz der Heiligen, Aufzeichnungen über sie oder allgemeiner heilige Schriften sein.
  rationale: Die Genitivbeziehung ist nicht näher bestimmt. Die Übersetzung erhält daher die Mehrdeutigkeit und fasst die Bücher nicht zu einem einzigen Register zusammen.
- issue: Art der Strafe für die Geister
  choice: Die widersprüchlich wirkenden Bilder von Tötung, fortgesetztem Schreien, Wehklagen und Feuer bleiben nebeneinander stehen.
  alternative: Die Bilder könnten als vollständige Vernichtung oder als bewusste jenseitige Qual systematisiert werden.
  rationale: Der Vers selbst löst die Spannung nicht auf; eine dogmatische Harmonisierung würde über die Quelle hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer apokalyptischer Bildsprache. Ungewöhnliche Aussagen und theologische Spannungen werden nicht harmonisiert. Sämtliche Fußnotenmarker stehen an der zugehörigen Stelle im Haupttext.
