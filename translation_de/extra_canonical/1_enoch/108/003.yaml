  terminology: „Buch des Lebens“, „Bücher der Heiligen“, „Nachkommen“ und „Geister“ sind konsistent und quellennah. „Heiligen“ erhält die offene Referenz von ቅዱሳን besser als eine einengende Deutung. „loderndem Feuer“ vermittelt die intensivierte Feuerformel idiomatisch, ohne die Aussage abzuschwächen.
