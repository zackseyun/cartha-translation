base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/009.yaml
  text: those who[a], from the time they came to be, did not desire the food that is on the earth, but regarded their souls as a passing breath, and kept this, and the Lord tested them greatly, and their spirits were found pure[c][b], so that they might bless his name.
translation:
  language: de
  text: die seit sie ins Dasein kamen nicht nach der Nahrung verlangten, die auf der Erde ist, sondern ihre Seelen wie einen vorübergehenden Hauch[a] betrachteten und daran festhielten. Der Herr prüfte sie schwer, und ihre Geister wurden als rein befunden, damit sie seinen Namen preisen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wie einen Geist, der vorübergeht«, beziehungsweise: »wie vorüberwehenden Wind«. Das entsprechende ge’ezische Wort kann Geist, Wind oder Hauch bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢፈተዉ
  choice: nicht nach … verlangten
  rationale: Gibt das innere Begehren oder Gefallen wieder und nicht lediglich eine äußere Verweigerung.
- source_word: መብልዕተ ዘውስተ ምድር
  choice: die Nahrung, die auf der Erde ist
  rationale: Bewahrt den konkreten Bezug auf Nahrung und die räumliche Bildsprache, ohne sie zu »weltlichen Genüssen« zu verallgemeinern.
- source_word: ረሰዩ ነፍሳቶሙ ከመ መንፈስ እንተ ተሐልፍ
  choice: ihre Seelen wie einen vorübergehenden Hauch betrachteten
  rationale: ረሰዩ bezeichnet hier im Zusammenhang mit ከመ ein Betrachten oder Ansehen als; »Seelen« entspricht ነፍሳቶሙ eng, während »Hauch« die Vergänglichkeit des Vergleichs ausdrückt.
- source_word: ዐቀቡ
  choice: daran festhielten
  rationale: Gibt das Bewahren, Hüten oder Einhalten idiomatisch wieder, ohne den unbestimmten Bezug vorschnell als Gebot oder asketische Regel festzulegen.
- source_word: ብዙኃ አመከሮሙ እግዚእ
  choice: Der Herr prüfte sie schwer
  rationale: Bringt eine intensive Erprobung in natürlichem Deutsch zum Ausdruck; »schwer« bezeichnet die Härte der Prüfung, nicht eine moralische Züchtigung.
- source_word: ተረክቡ መንፈሳቲሆሙ ንጹሕተ
  choice: ihre Geister wurden als rein befunden
  rationale: Bewahrt den passiven, prüfenden Zusammenhang und unterscheidet die Geister sprachlich von den zuvor genannten Seelen.
- source_word: ከመ ይባርክዎ ለስሙ
  choice: sodass sie seinen Namen preisen konnten
  rationale: Gibt die mögliche Zweck- oder Ergebnisnuance von ከመ mit dem Imperfekt wieder; »preisen« ist im Deutschen für das Segnen des göttlichen Namens natürlich.
theological_decisions:
- issue: Art und Reichweite der Entsagung
  choice: Die konkrete Aussage über irdische Nahrung und die Vergänglichkeit der Seele beziehungsweise des Lebens bleibt bestehen.
  alternative: Allgemeine Ablehnung weltlicher Freuden oder ausdrückliches Fasten bis zum Tod.
  rationale: Der Text nennt Nahrung auf der Erde, bestimmt aber weder eine monastische Praxis noch Martyrium oder Selbsttötung.
- issue: Bedeutung von መንፈስ im Vergleich
  choice: Hauch
  alternative: Geist oder Wind
  rationale: Im Vergleich steht die Flüchtigkeit im Vordergrund. Eine Fußnote bewahrt die weitere Bedeutungsbreite.
- issue: Verhältnis von göttlicher Prüfung und Reinheit
  choice: Die Geister werden nach schwerer Prüfung als rein befunden.
  alternative: Die Geister werden durch die Prüfung erst gereinigt.
  rationale: Der Wortlaut bezeichnet einen Befund nach der Prüfung und sagt nicht ausdrücklich, dass die Prüfung die Reinheit verursacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit weitgehend formnaher Satzfolge. Der lange Ausgangssatz wurde nach »festhielten« geteilt, um die Verständlichkeit zu erhöhen, ohne die Abfolge der Aussagen zu verändern. Die schwierige Formulierung wird nicht als »gaben ihre Seelen auf« wiedergegeben, da ረሰዩ hier das Betrachten beziehungsweise Ansehen als bezeichnet.
