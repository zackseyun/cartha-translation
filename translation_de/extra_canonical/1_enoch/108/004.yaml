base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/004.yaml
  text: And there I saw something like an invisible cloud[a], for because of its depth I was unable to look upon it; and I saw a flame of fire burning gloriously[d][c][b], and something like glorious mountains was circling and moving this way and that way.
translation:
  language: de
  text: Und dort sah ich etwas wie eine unsichtbare Wolke[a]; denn wegen ihrer Tiefe vermochte ich nicht, sie zu überschauen. Und ich sah eine Feuerflamme, die herrlich brannte, und Gebilde wie herrliche Berge kreisten umher und bewegten sich hin und her.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die folgende Wendung ist in der überlieferten Textgestalt schwierig. Möglich ist auch: „Denn aus ihrer Tiefe konnte ich über ihr Ausmaß hinausblicken.“'
    reason: textual_variant
  - marker: b
    text: 'Oder: „wurden hin und her geschüttelt“. Das zugrunde liegende ge’ezische Verb bezeichnet eine wiederholte Bewegung in wechselnde Richtungen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ በህየ
  choice: dort sah ich
  rationale: Gibt den schlichten visionären Bericht in der ersten Person und die Ortsangabe natürlich wieder.
- source_word: ከመ ደመና ዘኢይትረአይ
  choice: etwas wie eine unsichtbare Wolke
  rationale: ከመ bezeichnet einen Vergleich; die paradoxe Vision einer gesehenen und doch unsichtbaren Wolke bleibt bewusst erhalten.
- source_word: እምዕሙቁ
  choice: wegen ihrer Tiefe
  rationale: Bewahrt den kausalen Zusammenhang und gibt das Nomen für Tiefe mit dem aus dem Kontext erschlossenen Bezug auf die Wolke wieder.
- source_word: አክሀልኩ ላዕለ ነጽሮ
  choice: vermochte ich nicht, sie zu überschauen
  rationale: Der Textbereich ist schwierig. Die Formulierung wahrt sowohl die Vorstellung begrenzter Sehfähigkeit als auch den räumlichen Sinn von ላዕለ, ohne die unsichere Wendung allzu wörtlich festzulegen.
- source_word: ላህበ እሳት
  choice: eine Feuerflamme
  rationale: Erhält die semitische Verstärkungsform, klingt dabei im Deutschen würdevoll und verständlich.
- source_word: እንዘ ይነድድ ስቡሕ
  choice: die herrlich brannte
  rationale: Gibt den andauernden Brennvorgang und den Glanz- beziehungsweise Herrlichkeitsbegriff flüssig wieder.
- source_word: ከመ አድባር ስቡሓን
  choice: Gebilde wie herrliche Berge
  rationale: Der ergänzte allgemeine Ausdruck „Gebilde“ macht die visionäre Vergleichskonstruktion auf Deutsch verständlich, ohne ihre Identität festzulegen; der Plural passt zu den folgenden pluralischen Verben.
- source_word: ይትከበቡ
  choice: kreisten umher
  rationale: Gibt die pluralische, intransitive Bewegung wieder und vermeidet ein nicht ausdrücklich genanntes Objekt.
- source_word: ይትሀወኩ ለፌ ወለፌ
  choice: bewegten sich hin und her
  rationale: Drückt die wiederholte Bewegung in wechselnde Richtungen idiomatisch aus.
theological_decisions:
- issue: Das paradoxe Bild einer gesehenen, aber unsichtbaren Wolke
  choice: etwas wie eine unsichtbare Wolke
  alternative: etwas wie eine Wolke, die man nicht sehen konnte
  rationale: Die apokalyptische Spannung wird nicht rationalisierend aufgelöst; zugleich kennzeichnet „etwas wie“ die visionäre Annäherung.
- issue: Bezug der pluralischen Bewegungsverben
  choice: Bezug auf Gebilde wie herrliche Berge
  alternative: Bezug im Singular auf die Feuerflamme
  rationale: Die Ge’ez-Verben sind pluralisch und weisen daher eher auf die bergähnlichen Erscheinungen als auf die singularische Feuerflamme.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer visionärer Bildsprache. Die schwierige Textstelle wird im Haupttext lesbar wiedergegeben und in der Fußnote als echte Unsicherheit kenntlich gemacht; die pluralischen Verbformen werden grammatisch gewahrt.
