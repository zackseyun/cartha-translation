base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/011.yaml
  text: And now I will summon the spirits of the good ones from the generation of light, and I will transform those who were born in darkness[c][b][a], who in their flesh were not repaid with honor as their faith deserved.
translation:
  language: de
  text: Und nun werde ich die Geister der Guten aus dem Geschlecht des Lichts herbeirufen, und ich werde die verwandeln[b], die in der Finsternis geboren wurden, die in ihrem Fleisch nicht mit Ehre vergolten wurden, wie es ihrem Glauben gebührte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie es ihrer Treue gebührte.“ Das äthiopische Wort kann sowohl Glauben als auch standhafte Treue bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Das mit „verwandeln“ wiedergegebene Verb ist schwierig. Möglicherweise ist bildhafter gemeint: „zum Leuchten bringen“ oder „erhellen“.'
    reason: textual_uncertainty
lexical_decisions:
- source_word: እጼውዕ
  choice: werde ich … herbeirufen
  rationale: Das Verb bezeichnet ein Rufen oder Herbeirufen. „Herbeirufen“ bewahrt den feierlichen apokalyptischen Ton und gibt zusammen mit dem Futur den imperfektischen Formen beider Verben einheitlich Ausdruck.
- source_word: መናፍስቲሆሙ ለኄራን
  choice: die Geister der Guten
  rationale: Die vorausweisende Pronominalsuffix-Konstruktion mit la- bildet hier einen bestimmten Genitiv; daher nicht „ihre Geister – die Guten“, sondern „die Geister der Guten“. „Geister“ wahrt die anthropologische Offenheit des Ausdrucks.
- source_word: እምትውልድ እንተ ብርሃን
  choice: aus dem Geschlecht des Lichts
  rationale: „Geschlecht“ bezeichnet eine zusammengehörige Herkunfts- oder Abstammungsgruppe und erhält die apokalyptische Lichtmetaphorik; „Generation“ wäre im heutigen Deutsch stärker zeitlich eingeengt.
- source_word: እዊልጥ
  choice: ich werde … verwandeln
  rationale: Die schwierige Form legt im Zusammenhang eine bewirkte Veränderung nahe. „Verwandeln“ erhält das Motiv der Umkehrung, ohne die mögliche Lichtbildlichkeit als sicher auszugeben.
- source_word: ተወልዱ በጽልመት
  choice: die in der Finsternis geboren wurden
  rationale: Die Wiedergabe bewahrt den deutlichen Kontrast zum „Geschlecht des Lichts“ und die apokalyptische Symbolik.
- source_word: በሥጋሆሙ
  choice: in ihrem Fleisch
  rationale: Die wörtliche Wiedergabe erhält den Bezug auf ihre leiblich-sterbliche Existenz, ohne eine spätere Leib-Seele-Systematik einzutragen.
- source_word: ኢተፈደዩ ክብር
  choice: nicht mit Ehre vergolten wurden
  rationale: Die Formulierung erhält sowohl den Gedanken der Vergeltung beziehungsweise Entlohnung als auch die Ehre als deren Inhalt.
- source_word: ከመ ይደሉ ለሃይማኖቶሙ
  choice: wie es ihrem Glauben gebührte
  rationale: Die Wendung bezeichnet Angemessenheit oder das Gebührende. „Glaube“ bleibt die Hauptwiedergabe; „Treue“ wird wegen der ethischen Bedeutungsnähe in einer Fußnote genannt.
theological_decisions:
- issue: Bedeutung von ሃይማኖት im ethisch-apokalyptischen Zusammenhang
  choice: Glaube
  alternative: Treue beziehungsweise Glaubenstreue
  rationale: Der Ausdruck kann sowohl Glauben als auch standhafte Treue bezeichnen. Der Haupttext wahrt die etablierte Grundbedeutung „Glaube“, während die Fußnote die ethische Alternative offenhält.
- issue: Verhältnis der „Guten“ zu den „in der Finsternis Geborenen“
  choice: Die eng verbundenen Satzglieder lassen eine Gruppe unter dem Bild künftiger Umkehrung beziehungsweise Verwandlung erkennen.
  alternative: Die in der Finsternis Geborenen könnten als eine zweite, von den Guten unterschiedene Gruppe verstanden werden.
  rationale: Die Syntax verbindet Herbeirufung und Verwandlung eng, entscheidet die genaue Identität der Gruppen jedoch nicht ausdrücklich. Die Übersetzung lässt diese Spannung stehen und systematisiert sie nicht.
- issue: Bildgehalt des schwierigen Verbs እዊልጥ
  choice: verwandeln
  alternative: zum Leuchten bringen beziehungsweise erhellen
  rationale: „Verwandeln“ gibt den allgemeinen Umschlag wieder, ohne eine bestimmte physische oder soteriologische Ausgestaltung festzulegen; die mögliche Lichtbedeutung wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher apokalyptischer Bildsprache. „Geschlecht des Lichts“ klingt natürlicher und traditionsoffener als das zeitlich missverständliche „Generation des Lichts“. Die Satzstruktur folgt dem geʿezischen Genitiv und hält beide Hauptverben im Futur.
