base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/108/006.yaml
  text: 'And he said to me, “This is the place that you see: here the spirits of sinners and blasphemers and those who do evil will be cast, and those who twist everything that the Lord has spoken by the mouth of the prophets—all the things that are to be done.”'
translation:
  language: de
  text: 'Und er sagte zu mir: »Dies ist der Ort, den du siehst: Hier werden die Geister der Sünder, der Lästerer und derer, die Böses tun und alles verdrehen, was der Herr durch den Mund der Propheten gesagt hat – alles, was geschehen soll –, hingeworfen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Schlussworte können auch als selbstständige Bekräftigung verstanden werden: „… was der Herr durch den Mund der Propheten gesagt hat – all das wird geschehen.“'
    reason: Die Abfolge der Relativ- und Verbformen erlaubt sowohl die engere Verbindung mit „alles“ als auch eine abschließende Aussage über die Erfüllung des Gesagten.
lexical_decisions:
- source_word: ይትወደዩ
  choice: werden … geworfen
  rationale: Das passive Verb bezeichnet ein Geworfen- bzw. Hineingeworfenwerden; die deutsche Zukunftsform entspricht dem eschatologischen Zusammenhang.
- source_word: መናፍስተ፡ ኃጥኣን፡ ወጽኁፋን
  choice: die Geister der Sünder und Lästerer
  rationale: Die koordinierte Nominalgruppe wird eng am äthiopischen Wortlaut wiedergegeben; „Lästerer“ bleibt allgemeiner als das deutender wirkende „Gotteslästerer“.
- source_word: ይመይጡ
  choice: verdrehen
  rationale: Das Verb bezeichnet hier ein veränderndes bzw. verfälschendes Umdeuten. „Verdrehen“ bewahrt den vorwurfsvollen Sinn, ohne eine spezifische Auslegungslehre einzutragen.
- source_word: በኣፈ፡ ነቢያት
  choice: durch den Mund der Propheten
  rationale: Die feste semitische Wendung wird formal bewahrt und ist auch im gehobenen modernen Deutsch verständlich.
- source_word: ኵሉ፡ ይትገበር
  choice: all das …, was geschehen wird
  rationale: Die passive Form von „tun/machen“ kann idiomatisch das Geschehen bzw. Eintreten bezeichnen; der Zukunftsbezug passt zum gerichtlichen Kontext.
theological_decisions:
- issue: Bezugsbereich des prophetischen Redens im Schlusssatz
  choice: „was der Herr … über all das gesagt hat, was geschehen wird“
  alternative: „was der Herr … gesagt hat — all das wird geschehen“
  rationale: Syntax und Interpunktion des äthiopischen Textes lassen offen, ob die Schlusswörter den Inhalt der Prophetie bestimmen oder als selbstständige Bekräftigung dienen. Der Haupttext folgt der engeren syntaktischen Anbindung, während die Alternative in der Fußnote erhalten bleibt.
- issue: Art der Lästerung
  choice: „Lästerer“
  alternative: „Gotteslästerer“
  rationale: Der Vers benennt das Objekt der Lästerung nicht ausdrücklich. Die allgemeinere Wiedergabe vermeidet eine unnötige theologische Präzisierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurze Ortsangabe und die Aufzählung wurden für natürliche Lesbarkeit gegliedert; Bildsprache und semitische Wendung „durch den Mund der Propheten“ bleiben erhalten.
