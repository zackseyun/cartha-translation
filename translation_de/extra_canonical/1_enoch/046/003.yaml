base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/003.yaml
  text: And he answered me and said to me[a], “This is the Son of Man, to whom righteousness belongs, and righteousness dwells with him; and he will reveal all the treasuries of what is hidden, because the Lord of Spirits has chosen him[c][b], and his lot has prevailed before the Lord of Spirits forever in uprightness.”
translation:
  language: de
  text: 'Und er antwortete mir und sagte zu mir: „Dies ist der Menschensohn, dem Gerechtigkeit gehört und bei dem Gerechtigkeit wohnt. Er wird alle Schatzkammern des Verborgenen[a] offenbaren, denn der Herr der Geister hat ihn erwählt, und sein Los hat sich vor dem Herrn der Geister für immer in Aufrichtigkeit durchgesetzt.[b]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die Vorratshäuser der verborgenen Dinge“. Gemeint sind nicht nur abstrakte Geheimnisse, sondern verborgene Wirklichkeiten, die bildlich in himmlischen Schatzkammern verwahrt werden.'
    reason: lexical_alternative
  - marker: b
    text: Der äthiopische Schluss ist schwierig. „Sein Los hat sich durchgesetzt“ kann auch „sein Anteil hat triumphiert“ bedeuten; weniger wahrscheinlich ist ein Bezug auf das Los derer, die zu ihm gehören.
    reason: alternative_reading
lexical_decisions:
- source_word: ወልደ ሰብእ
  choice: der Menschensohn
  rationale: Die feste äthiopische Wortverbindung bezeichnet den ‚Sohn des Menschen‘. Im visionären Zusammenhang dient sie als titelartige Bezeichnung; ‚Menschensohn‘ ist im Deutschen zugleich verständlich und traditionsgemäß, ohne den Vers durch spätere christologische Aussagen zu erweitern.
- source_word: ዘሎቱ ኮነ ጽድቅ
  choice: dem Gerechtigkeit gehört
  rationale: Die Konstruktion drückt Zugehörigkeit beziehungsweise Besitz aus. Die Wiedergabe bewahrt diese Beziehung deutlicher als das bloße ‚der gerecht ist‘.
- source_word: ወጽድቅ ምስሌሁ ኃደረ
  choice: und bei dem Gerechtigkeit wohnt
  rationale: Das Verb bezeichnet Wohnen oder Bleiben. Die Formulierung erhält die bildhafte, nahezu personifizierte Darstellung der Gerechtigkeit und die bewusste Wiederholung.
- source_word: መዛግብተ ዘኅቡእ
  choice: die Schatzkammern des Verborgenen
  rationale: Das Substantiv bezeichnet Schatzkammern oder Vorratshäuser. Die Übersetzung bewahrt das apokalyptische Bild verborgener Wirklichkeiten, die gleichsam in himmlischen Kammern aufbewahrt werden.
- source_word: ይከሥት
  choice: er wird … offenbaren
  rationale: Das Verb bezeichnet Enthüllen oder Sichtbarmachen; die Zukunftsform entspricht der angekündigten Aufgabe dieser Gestalt.
- source_word: እግዚአ መንፈሳት
  choice: der Herr der Geister
  rationale: Dies ist ein wiederkehrender Gottesname in 1 Henoch. Die wörtlich-nahe Form erhält die charakteristische Ausdrucksweise des Buches.
- source_word: ኀረዮ ኃርየ
  choice: hat ihn erwählt
  rationale: Die etymologische Wiederholung verstärkt den Wahlakt. Im natürlichen Deutschen gibt ‚erwählt‘ diesen Sinn ohne schwerfällige Verdoppelung wieder.
- source_word: ዘክፍሉ ሞአ
  choice: sein Los hat … obsiegt
  rationale: Die schwierige Wendung spricht offenbar von dem ihm zugeteilten Los oder Anteil, der sich durchsetzt. ‚Los‘ erhält das Zuteilungsbild, während ‚obsiegt‘ die dynamische Kraft des Verbs wiedergibt.
- source_word: በርቱዕ ለዓለም
  choice: für immer in Aufrichtigkeit
  rationale: Die Wiedergabe erhält sowohl die zeitlich unbegrenzte Aussage als auch die sittliche Qualität des Schlussausdrucks, ohne das bereits zweimal verwendete Wort ‚Gerechtigkeit‘ erneut einzusetzen.
theological_decisions:
- issue: Titelartige oder allgemein-menschliche Bedeutung von ወልደ ሰብእ
  choice: Titelartig als „der Menschensohn“ wiedergegeben.
  alternative: „ein Menschensohn“ oder „der Menschliche“
  rationale: Die Gestalt wird in einer Vision identifiziert und trägt besondere Funktionen der Offenbarung. Der bestimmte, titelartige Ausdruck passt zum örtlichen Zusammenhang, ohne spätere neutestamentliche Aussagen in den Text hineinzulesen.
- issue: Wiederholung der Gerechtigkeitsaussagen
  choice: 'Beide Aussagen wurden beibehalten: Gerechtigkeit gehört ihm und wohnt bei ihm.'
  alternative: Zusammenfassung zu „der Gerechte“
  rationale: Die Wiederholung ist inhaltlich gewichtig und verstärkt die enge Verbindung der Gestalt mit der Gerechtigkeit. Eine Zusammenfassung würde diese Spannung und Bildlichkeit vermindern.
- issue: Deutung der schwierigen Schlussklausel über Los oder Anteil
  choice: „sein Los hat … obsiegt“
  alternative: „sein Anteil hat triumphiert“ oder Bezug auf das Los derer, die zu ihm gehören
  rationale: Mangels sicherer Textkontrolle bleibt die naheliegende grammatische Beziehung auf den Menschensohn im Haupttext erhalten. Die sachliche Unsicherheit wird in einer Fußnote offengelegt, statt sie dogmatisch festzulegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst beibehaltener apokalyptischer Bildwelt. Die Wiederholung von „Gerechtigkeit“ ist quellennah und theologisch bedeutsam; seltenere Wendungen wie „Herr der Geister“ und „sein Los hat obsiegt“ werden wegen ihres festen beziehungsweise bildhaften Charakters nicht geglättet.
