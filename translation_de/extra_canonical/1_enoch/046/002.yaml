base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/002.yaml
  text: And I asked one of the angels who was going with me[a], and who was showing me all the hidden things, concerning that Son of Man—who he was, and from where he came[c][b], and why he was going with the Head of Days.
translation:
  language: de
  text: 'Und ich fragte einen der Engel, der mit mir ging und mir all das Verborgene[a] zeigte, nach jenem Menschensohn: wer er sei, woher er komme und warum er mit dem Haupt der Tage[b] gehe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Geheimnisse“. Gemeint sind verborgene himmlische Dinge, die in der Vision enthüllt werden.'
    reason: lexical_alternative
  - marker: b
    text: „Haupt der Tage“ gibt den äthiopischen Wortlaut unmittelbar wieder. In Anlehnung an Daniel wird traditionell auch „der Alte an Tagen“ übersetzt.
    reason: cross_reference
lexical_decisions:
- source_word: ተስእልክዎ
  choice: ich fragte
  rationale: Das Verb leitet Henochs unmittelbare Frage an den begleitenden Engel ein; „fragte“ ist natürlich und bewahrt die schlichte Erzählweise.
- source_word: ፩እመላእክት
  choice: einen der Engel
  rationale: Die partitive Wendung bezeichnet einen Engel aus der Gruppe der Engel, ohne den Zusatz „heilig“.
- source_word: ዘየሐውር ምስሌየ
  choice: der mit mir ging
  rationale: Die Relativkonstruktion beschreibt den Engel als Begleiter Henochs; das Bewegungsverb bleibt ausdrücklich erhalten.
- source_word: ኵሎ ኅቡኣተ
  choice: all das Verborgene
  rationale: Die Formulierung bezeichnet verborgene himmlische Dinge oder Sachverhalte, die in der Vision enthüllt werden, ohne sie vorschnell als technische „Geheimnisse“ festzulegen.
- source_word: ዘያርእየኒ
  choice: mir … zeigte
  rationale: Das Verb hat einen visuellen und offenbarenden Sinn; „zeigte“ passt zum Visionszusammenhang und bleibt nahe an der Grundbedeutung.
- source_word: ወልደ ሰብእ
  choice: Menschensohn
  rationale: Die feste deutsche Wiedergabe wahrt die hervorgehobene apokalyptische Bezeichnung der bestimmten Gestalt, ohne deren spätere dogmatische Identifikation vorauszusetzen.
- source_word: እምአይቴ ይከውን
  choice: woher er komme
  rationale: Die Frage betrifft Herkunft oder Ursprung; der Konjunktiv fügt sich im Deutschen natürlich in die indirekte Frage ein.
- source_word: ርእሰ መዋዕል
  choice: Haupt der Tage
  rationale: Die Wiedergabe folgt dem äthiopischen Ausdruck transparent und harmonisiert ihn nicht stillschweigend mit dem aus Daniel vertrauten Titel „der Alte an Tagen“.
- source_word: ምስለ ... የሐውር
  choice: mit … gehe
  rationale: Das wiederholte Bewegungsverb bleibt sichtbar und bewahrt das auffällige Bild der gemeinsamen Bewegung.
theological_decisions:
- issue: Titelhafte oder allgemeine Wiedergabe von ወልደ ሰብእ
  choice: „jener Menschensohn“ als hervorgehobene Bezeichnung
  alternative: „jener Mensch“ oder „jener Sohn eines Menschen“
  rationale: Demonstrativum und Kontext weisen auf eine bestimmte visionäre Gestalt. Die Zusammenschreibung entspricht etabliertem Deutsch, ohne eine spätere christologische Gleichsetzung in den Text einzutragen.
- issue: Verhältnis von ርእሰ መዋዕል zur Daniel-Tradition
  choice: „Haupt der Tage“
  alternative: „der Alte an Tagen“
  rationale: Die quellennähere Form bewahrt die besondere äthiopische Wendung und die mögliche Spannung zur traditionellen Daniel-Wiedergabe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die wiederholten Bewegungsverben und die quellenspezifische Gottesbezeichnung bleiben erhalten; unnötige Archaismen werden vermieden.
