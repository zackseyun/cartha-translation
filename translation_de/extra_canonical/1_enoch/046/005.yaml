base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/005.yaml
  text: And he will cast down the kings from their thrones and from their kingdoms[a], because they do not exalt him, and do not praise him[c][b], and do not acknowledge from where the kingdom was given to them.
translation:
  language: de
  text: Und er wird die Könige von ihren Thronen und aus ihren Königreichen stürzen, weil sie ihn nicht erhöhen und ihn nicht preisen und nicht anerkennen, woher[a] ihnen die Königsherrschaft[b] gegeben wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „von wem“. Die ge’ezische Wendung kann allgemein nach dem Ursprung oder persönlicher nach dem Geber fragen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „das Königtum“ beziehungsweise „die königliche Vollmacht“. Gemeint sein kann die Herrschaftsgewalt, nicht nur ein territoriales Reich.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይገፈትኦሙ
  choice: er wird … stürzen
  rationale: Das Verb bezeichnet eine gewaltsame Entfernung oder einen Sturz und bewahrt hier die eindringliche apokalyptische Bildsprache.
- source_word: ነገሥት
  choice: die Könige
  rationale: Die konkrete königliche Bezeichnung passt zum Zusammenhang mit Thronen und Königreichen besser als das allgemeinere „Herrscher“.
- source_word: መናብርቲሆሙ
  choice: von ihren Thronen
  rationale: Im Kontext des Gerichts über Könige bezeichnet das Wort ihre Throne als sichtbares Zeichen königlicher Macht.
- source_word: መንገሥቲሆሙ
  choice: aus ihren Königreichen
  rationale: Die pluralische Form steht parallel zu den Thronen und bezeichnet die jeweiligen Bereiche ihrer Herrschaft.
- source_word: ኢያሌዕልዎ
  choice: sie ihn nicht erhöhen
  rationale: „Erhöhen“ gibt die Bedeutung des Hochhebens beziehungsweise Erhebens eng wieder und behält den gehobenen Ton bei.
- source_word: ኢይሴብሕዎ
  choice: ihn nicht preisen
  rationale: „Preisen“ ist eine natürliche und würdige Wiedergabe des Verbs für loben oder verherrlichen.
- source_word: ኢይገንዩ
  choice: nicht anerkennen
  rationale: Im Zusammenhang bezeichnet das Verb die verweigerte Anerkennung des Ursprungs ihrer Herrschaft. Die mögliche Nuance von Unterwerfung oder demütigem Eingeständnis wird nicht ausdrücklich in den Haupttext eingetragen.
- source_word: እምአይቴ
  choice: woher
  rationale: Das Wort fragt nach dem Ursprung; im Kontext kann dieser räumlich-allgemein („woher“) oder persönlich („von wem“) verstanden werden.
- source_word: ተውህበት ሎሙ መንግሥት
  choice: ihnen die Königsherrschaft gegeben wurde
  rationale: Die Passivkonstruktion bleibt erhalten. „Königsherrschaft“ bezeichnet hier treffender die verliehene königliche Gewalt als ein bloßes Territorium.
theological_decisions:
- issue: Bezug von „ihn“ und Ursprung der königlichen Herrschaft
  choice: Das Pronomen „ihn“ bleibt ohne ergänzenden Titel stehen, und der Geber bleibt im Passiv unausgesprochen.
  alternative: „Ihn“ ausdrücklich auf den Höchsten, den Herrn oder den Erwählten beziehen und „von wem“ schreiben.
  rationale: Der weitere Zusammenhang legt einen göttlichen Geber nahe, doch der Vers selbst nennt ihn nicht ausdrücklich. Die Übersetzung bewahrt daher die vorhandene Spannung und vermeidet eine konfessionelle oder kontextuell zu enge Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer apokalyptischer Bildsprache. Die Satzstruktur bleibt eng am Ge’ez, ohne im Deutschen unnötig schwerfällig zu wirken.
