base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/001.yaml
  text: And there I saw one who had a head of days[a], and his head was like white wool; and with him was another, whose face was like the appearance of a man, and his face was full of grace[c][b], like one of the holy angels.
translation:
  language: de
  text: Und dort sah ich einen, der ein Haupt der Tage hatte[a], und sein Haupt war wie weiße Wolle. Bei ihm war ein anderer, dessen Gesicht dem Aussehen eines Menschen glich[c]; sein Gesicht war voller Gnade[b], wie das eines der heiligen Engel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Alte an Tagen“. Wörtlicher lautet das Ge’ez „Haupt der Tage“; diese auffällige Wendung bleibt im Haupttext erhalten.'
    reason: lexical_alternative
  - marker: b
    text: „Voller Gnade“ gibt das Ge’ez unmittelbar wieder und ist hier nicht als Übernahme einer späteren neutestamentlichen Formulierung zu verstehen.
    reason: cross_reference
  - marker: c
    text: 'Auch möglich: „dessen Gesicht war wie die Erscheinung eines Menschen“. Der Haupttext gibt den ausdrücklichen Vergleich idiomatisch mit „glich“ wieder.'
    reason: previous_rendering
lexical_decisions:
- source_word: በህየ፡ ርኢኩ
  choice: Und dort sah ich
  rationale: Die schlichte Ortsangabe und der unmittelbare Visionsbericht werden in natürlichem, heutigem Deutsch wiedergegeben.
- source_word: ዘሎቱ፡ ርእሰ፡ መዋዕል
  choice: einen, der ein Haupt der Tage hatte
  rationale: Die auffällige äthiopische Wendung wird transparent bewahrt und nicht stillschweigend an den aus Daniel bekannten Titel angeglichen.
- source_word: ወርእሱ፡ ከመ፡ ፀምር፡ ጻዕዳ
  choice: und sein Haupt war wie weiße Wolle
  rationale: Der Ausgangstext nennt ausdrücklich das Haupt, nicht das Haar; zugleich bleibt der Vergleich mit weißer Wolle erhalten.
- source_word: ወምስሌሁ፡ ካልእ
  choice: Bei ihm war ein anderer
  rationale: Dies führt die zweite Gestalt klar ein, ohne sie schon durch einen späteren Titel zu identifizieren.
- source_word: ዘገጹ፡ ከመ፡ ርእየተ፡ ሰብእ
  choice: dessen Gesicht wie die Erscheinung eines Menschen war
  rationale: Das ausdrückliche Vergleichswort ከመ („wie“) und der visionäre Akzent auf der sichtbaren Erscheinung bleiben erhalten.
- source_word: ወምሉእ፡ ጸጋ፡ ገጹ
  choice: sein Gesicht war voller Gnade
  rationale: „Gnade“ gibt ጸጋ direkt wieder; die vertraute Formulierung ist hier im äthiopischen Wortlaut selbst begründet.
- source_word: ከመ፡ ፩እመላእክት፡ ቅዱሳን
  choice: wie das eines der heiligen Engel
  rationale: Die partitive Bedeutung „einer von den heiligen Engeln“ wird gewahrt und der Vergleich im Deutschen eindeutig auf das Gesicht bezogen.
theological_decisions:
- issue: Soll ርእሰ መዋዕል mit dem traditionellen Daniel-Titel wiedergegeben werden?
  choice: Haupt der Tage
  alternative: der Alte an Tagen / der Hochbetagte
  rationale: Die Hauptfassung folgt der eigentümlichen äthiopischen Formulierung, statt den traditionellen Titel aus Daniel einzusetzen; die geläufige Deutung wird in der Fußnote genannt.
- issue: Soll die zweite Gestalt bereits als „Menschensohn“ bezeichnet werden?
  choice: ein anderer, dessen Gesicht wie die Erscheinung eines Menschen war
  alternative: der Menschensohn / eine menschengleiche Gestalt
  rationale: Der Vers beschreibt die Gestalt, gibt ihr hier aber noch keinen Titel. Die Übersetzung wahrt diese Spannung und nimmt eine spätere Identifizierung nicht vorweg.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst quellennaher Bildsprache. „Haupt der Tage“ ist absichtlich fremdartig, weil die ungewöhnliche Ge’ez-Wendung nicht durch einen geläufigen theologischen Titel ersetzt werden soll. Die dreifache Vergleichsstruktur mit ከመ wird soweit idiomatisch möglich sichtbar gehalten.
