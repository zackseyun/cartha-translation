base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/006.yaml
  text: And he will cast down the face of the strong ones[a], and he will fill them with shame; and darkness shall become their dwelling, and worms their bed. And they shall have no hope of rising from their beds[c][b], because they do not exalt the name of the Lord of Spirits.
translation:
  language: de
  text: Und er wird die Gesichter der Starken zu Boden zwingen und sie mit Schande erfüllen. Finsternis wird ihre Wohnung sein und Würmer[a] ihr Bett. Sie werden keine Hoffnung haben, sich von ihren Betten zu erheben[b], weil sie den Namen des Herrn der Geister nicht erhöhen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die mit „Würmer“ wiedergegebene Form ist in dieser transkribierten Ge'ez-Textgrundlage nicht völlig sicher. Im Zusammenhang passt sie zum Bild von Verwesung an einem grabähnlichen Ruheort.
    reason: textual_variant
  - marker: b
    text: „Sich von ihren Betten zu erheben“ kann schlicht das Aufstehen bezeichnen; im Zusammenhang von Finsternis, Würmern und Gericht kann zugleich eine ausbleibende Wiederherstellung nach dem Tod anklingen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ገጸ፡ ጽኑዓን
  choice: das Gesicht der Starken
  rationale: Die konkrete Wendung „Gesicht der Starken“ bewahrt das Bild öffentlicher Erniedrigung. „Starken“ gibt die Personenbezeichnung allgemein wieder, ohne sie enger als Könige oder Herrscher zu bestimmen.
- source_word: ይገፈትእ
  choice: er wird … niederschlagen
  rationale: Die aktive Form der 3. Person Singular wird mit dem aus dem Zusammenhang fortwirkenden Subjekt „er“ wiedergegeben. „Niederschlagen“ wahrt sowohl die körperliche Bildhaftigkeit als auch den Gedanken des Sturzes im Gericht.
- source_word: ይመልኦሙ፡ ኃፍረተ
  choice: er wird sie mit Schande erfüllen
  rationale: Die aktive Konstruktion und „Schande“ als das, womit sie erfüllt werden, werden grammatisch ausdrücklich bewahrt.
- source_word: ጽልመት
  choice: Finsternis
  rationale: „Finsternis“ ist eine direkte, würdevolle Wiedergabe des apokalyptischen Gerichtsmotivs.
- source_word: መንደሪሆሙ
  choice: ihre Wohnung
  rationale: Die konkrete Bezeichnung des Wohnortes bleibt erhalten; „Wohnung“ ist im Deutschen verständlich und bildet einen scharfen Gegensatz zum vertrauten Sinn des Wortes.
- source_word: ዕፀያት
  choice: Würmer
  rationale: Im Zusammenhang mit Bett, Finsternis und ausbleibendem Aufstehen passt „Würmer“ zum Bild von Verwesung und Grab; die unsichere überlieferte beziehungsweise transkribierte Form wird in einer Fußnote kenntlich gemacht.
- source_word: ምስካቦሙ
  choice: ihr Bett / ihre Betten
  rationale: Das konkrete Bild des Bettes wird beibehalten. Der Numerus wird im jeweiligen deutschen Satz idiomatisch angepasst, ohne es ausdrücklich als Grab zu deuten.
- source_word: ኢይሴፈዉ
  choice: sie werden keine Hoffnung haben
  rationale: Diese Formulierung gibt das Fehlen von Hoffnung oder Erwartung natürlich und unmittelbar wieder.
- source_word: ይትነሥኡ
  choice: sich … zu erheben
  rationale: „Sich erheben“ lässt offen, ob lediglich das Aufstehen oder eine Wiederherstellung beziehungsweise Auferstehung im Gerichtshorizont gemeint ist.
- source_word: ኢያሌዕሉ፡ ስሞ
  choice: sie … den Namen … nicht erhöhen
  rationale: „Erhöhen“ bewahrt die Grundvorstellung des Großmachens beziehungsweise Erhebens und vermeidet eine Einengung auf „loben“ oder „ehren“.
- source_word: እግዚአ፡ መናፍስት
  choice: Herr der Geister
  rationale: Der wiederkehrende Gottesname des 1. Henoch wird wörtlich und in seiner charakteristischen Form wiedergegeben.
theological_decisions:
- issue: Bezeichnet ይትነሥኡ ausdrücklich eine Auferstehung?
  choice: „sich von ihren Betten zu erheben“
  alternative: „von ihren Betten aufzustehen“ oder „von ihren Betten auferweckt zu werden“
  rationale: Finsternis, Würmer und Bett können Tod und Gericht anklingen lassen, doch das Verb allein legt eine ausdrückliche Auferstehungsaussage nicht fest. Die Übersetzung erhält diese Spannung.
- issue: Wer sind die ጽኑዓን?
  choice: „die Starken“
  alternative: „die Mächtigen“ oder „die mächtigen Herrscher“
  rationale: Der Ausdruck bezeichnet starke beziehungsweise mächtige Personen, nennt sie in diesem Vers aber nicht ausdrücklich Könige oder Herrscher. Die allgemeinere Wiedergabe vermeidet eine unbelegte politische Präzisierung.
- issue: Fortwirkendes Subjekt der ersten beiden Verben
  choice: „er wird … und sie … erfüllen“
  alternative: 'passivisch: „das Gesicht … wird niedergeschlagen, und Schande wird sie erfüllen“'
  rationale: Die geezischen Verbformen sind aktiv in der 3. Person maskulin Singular; das Subjekt wird aus dem vorhergehenden Zusammenhang aufgenommen. Die aktive Wiedergabe folgt daher der Grammatik, ohne die Identität im Vers selbst neu auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit weitgehend formnaher Bildsprache. Die ungewöhnliche Wendung „das Gesicht der Starken niederschlagen“ wurde bewusst bewahrt, weil sie das konkrete Erniedrigungsbild des Ausgangstextes trägt. Archaische Formen und konfessionell festgelegte Auferstehungssprache wurden vermieden.
