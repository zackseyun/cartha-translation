review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Abfolge und die konkreten Gerichtsbilder des ge'ezischen Textes zuverlässig wieder. „Menschensohn“ ist im Kontext als bestimmte Visiongestalt angemessen. Das unsichere Wort ኃማተ sollte nicht als sichere Lesung behandelt werden; „Lenden“ bildet jedoch die durch die bekannte biblische Wendung gestützte wahrscheinliche Deutung besser ab als „Hüften“.
  naturalness: Der Entwurf ist überwiegend modernes, würdiges Deutsch. Die Koordination „wird Könige … aufstehen lassen und die Starken von ihren Thronen“ lässt das Verb im zweiten Glied zu weit aus und wirkt syntaktisch unvollständig. Eine sowohl-als-auch-Konstruktion klärt die Zuordnung der jeweiligen Gruppen zu Betten und Thronen. „Betten“ ist im heutigen Deutsch für den Ruheplatz verständlicher als „Lager“.
  terminology: „Menschensohn“, „Könige“, „Mächtige“, „Throne“, „Starke“ und „Sünder“ sind passend und erhalten die Wiederholungen sowie den apokalyptisch-politischen Registerton. „Die Lenden lösen“ ist ein verständliches, traditionssprachlich etabliertes Bild und vermeidet die anatomisch weniger passende, nicht idiomatische Formulierung „die Hüften lösen“.
  issues:
  - severity: medium
    issue: Die syntaktische Zuordnung im ersten Teilsatz ist nicht klar genug.
    rationale: Nach „… von ihren Lagern aufstehen lassen“ folgt „und die Starken von ihren Thronen“ ohne unmittelbar anschließendes Verb. Die beabsichtigte Ellipse ist zwar erschließbar, klingt im Deutschen aber abgebrochen. Die Revision macht die parallele Zuordnung explizit.
  - severity: low
    issue: „Die Hüften der Starken lösen“ trifft das wahrscheinlich zugrunde liegende Idiom weniger gut.
    rationale: Die überlieferte ge'ezische Form ist unsicher; die von Charles angeführte Nähe zur Wendung vom Lösen der Lenden von Königen stützt „Lenden“. Die Fußnote muss die textliche Unsicherheit weiterhin kenntlich machen.
  - severity: low
    issue: „Lager“ ist im modernen Deutsch mehrdeutig.
    rationale: Es kann vor allem ein Camp oder Warenlager bezeichnen. „Betten“ bewahrt die konkrete Grundbedeutung und ist mit einer Fußnotenalternative für „Lager“ ausreichend offen.
  revised_text: Und dieser Menschensohn, den du gesehen hast, wird sowohl Könige und Mächtige von ihren Betten[a] als auch die Starken von ihren Thronen aufstehen lassen; er wird die Lenden der Starken lösen[b] und die Zähne der Sünder zermalmen.
