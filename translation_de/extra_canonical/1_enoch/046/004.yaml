- from: Und dieser Menschensohn, den du gesehen hast, wird Könige und Mächtige von ihren Lagern[a] aufstehen lassen und die Starken von ihren Thronen; er wird die Hüften der Starken lösen[b] und die Zähne der Sünder zermalmen.
  to: Und dieser Menschensohn, den du gesehen hast, wird sowohl Könige und Mächtige von ihren Betten[a] als auch die Starken von ihren Thronen aufstehen lassen; er wird die Lenden der Starken lösen[b] und die Zähne der Sünder zermalmen.
  rationale: Die Revision behebt die unklare Satzkoordination, verwendet mit „Betten“ ein eindeutigeres modernes Wort für den Ruheplatz und stellt mit „Lenden“ das wahrscheinlich beabsichtigte biblische Bild idiomatisch dar. Die Fußnoten bewahren sowohl die lexikalische Alternative beim Ruheplatz als auch die echte textkritische und lexikalische Unsicherheit der Wendung mit ኃማተ.
