base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/004.yaml
  text: And this Son of Man whom you have seen will raise up kings and the mighty from their couches, and the strong from their thrones; and he will loosen the loins of the strong, and crush the teeth of sinners.
translation:
  language: de
  text: Und dieser Menschensohn, den du gesehen hast, wird sowohl Könige und Mächtige von ihren Betten[a] als auch die Starken von ihren Thronen aufstehen lassen; er wird die Lenden der Starken lösen[b] und die Zähne der Sünder zermalmen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lagern“. Gemeint sind Ruheplätze, von denen die Herrschenden aufgescheucht werden.'
    reason: lexical_alternative
  - marker: b
    text: Die überlieferte ge'ezische Wortform ist unsicher. Wahrscheinlich liegt die biblische Wendung „die Lenden lösen“ zugrunde, ein Bild für das Entgürten und Entkräften; auch Deutungen wie „Riemen“ oder „Zügel“ wurden erwogen.
    reason: textual_and_lexical_uncertainty
lexical_decisions:
- source_word: ወልደ ሰብእ
  choice: Menschensohn
  rationale: Bewahrt die semitische Ausdrucksform und kennzeichnet im Zusammenhang die bestimmte endzeitliche Gestalt, ohne spätere christologische Aussagen in den Vers hineinzutragen.
- source_word: ዘርኢከ
  choice: den du gesehen hast
  rationale: Gibt den Relativsatz natürlich wieder und hält den Rückbezug auf Henochs Vision fest.
- source_word: ያነሥኦሙ
  choice: wird … aufstehen lassen
  rationale: Bewahrt die konkrete Grundbedeutung des Verbs, jemanden zum Aufstehen zu bringen. Im Gerichtskontext ist keine Erhöhung gemeint, sondern das Aufscheuchen beziehungsweise Entfernen aus Ruhe- und Machtpositionen.
- source_word: ነገሥት፡ ወኃያላን
  choice: Könige und Mächtige
  rationale: Gibt die beiden Herrschergruppen knapp und würdig wieder.
- source_word: እምስካበቲሆሙ
  choice: von ihren Lagern
  rationale: Das Substantiv bezeichnet Bett, Lager oder Ruheplatz. „Lager“ bewahrt sowohl die konkrete räumliche Vorstellung als auch das Bild gesicherter Ruhe.
- source_word: ጽኑዓን
  choice: die Starken
  rationale: Bewahrt die konkrete Bezeichnung und ihre Wiederholung im folgenden Satzglied.
- source_word: መናብርቲሆሙ
  choice: ihren Thronen
  rationale: Im königlich-politischen Zusammenhang bezeichnet das Wort passend die Herrschaftssitze.
- source_word: ይፈትሕ
  choice: wird … lösen
  rationale: Gibt die Grundbedeutung „lösen, losbinden“ wieder und erhält das bildhafte Gerichtshandeln.
- source_word: ኃማተ
  choice: die Hüften
  rationale: Folgt der textkritisch und intertextuell naheliegenden Deutung als „Hüften/Lenden“, entsprechend dem Bild vom Entgürten und Entkräften eines Herrschers; die überlieferte Wortform bleibt jedoch unsicher.
- source_word: ይደቅቅ
  choice: zermalmen
  rationale: Bewahrt die heftige Gewalt des apokalyptischen Gerichtsbildes.
- source_word: አስናነ ኃጥኣን
  choice: die Zähne der Sünder
  rationale: Erhält das konkrete Bild von gebrochener Angriffskraft, ohne es auszudeuten.
theological_decisions:
- issue: Titelhafte oder allgemeine Wiedergabe von ወልደ ሰብእ
  choice: „Menschensohn“ als Bezeichnung der bestimmten Gestalt der Vision
  alternative: „ein Menschensohn“ oder „der Menschliche“
  rationale: Die Gestalt ist in diesem Zusammenhang individualisiert und übt Gericht aus. Die traditionelle semitische Form bleibt erhalten, ohne den Vers ausdrücklich mit späteren Lehrformulierungen gleichzusetzen.
- issue: Deutung der Handlung an Königen und Mächtigen
  choice: Das konkrete Bild „von ihren Lagern aufstehen lassen“ bleibt stehen
  alternative: „entfernen“, „absetzen“ oder „demütigen“
  rationale: Das Verb bezeichnet zunächst das Aufstehenlassen. Der Gerichtskontext legt gewaltsame Entfernung nahe, doch eine abstrakte Paraphrase würde das Bild und seine mögliche Mehrdeutigkeit einebnen.
- issue: Deutung der schwierigen Wendung mit ኃማተ
  choice: „die Hüften der Starken lösen“
  alternative: „die Zügel/Riemen der Starken lösen“
  rationale: Die Hüften- beziehungsweise Lendenlesart passt zu der biblischen Wendung vom Lösen der Hüften eines Königs als Bild des Entgürtens und Entkräftens. Wegen der unsicheren ge'ezischen Überlieferung wird die Alternative in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter apokalyptischer Bildsprache. Die Satzstruktur folgt dem parallelen Aufbau des Ge'ez, wird aber für heutige Leser leicht geglättet. Fachsprachlich-archaisches „Lenden“ wird im Haupttext durch verständlicheres „Hüften“ ersetzt; die idiomatische Bedeutung wird in der Fußnote erläutert.
