base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/046/007.yaml
  text: And these are those who judge the stars of heaven[a][b].
translation:
  language: de
  text: Und diese sind es, die über die Sterne des Himmels Gericht halten[a][b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Verb kann auch im Sinn von »herrschen« oder »regieren« verstanden werden. Da dieser Abschnitt im Wesentlichen nur auf Ge’ez erhalten ist, bleibt die genaue Bedeutungsnuance mit einer gewissen Unsicherheit behaftet.
    reason: lexical_alternative
  - marker: b
    text: In apokalyptischen Schriften können »Sterne« sowohl Himmelskörper als auch himmlische Wesen bezeichnen; der Text legt sich hier nicht eindeutig fest.
    reason: cultural_note
lexical_decisions:
- source_word: እሙንቱ
  choice: diese
  rationale: Das pluralische Demonstrativpronomen bewahrt den hinweisenden Charakter des Visionsberichts.
- source_word: ኮኑ
  choice: sind es
  rationale: Die Form von »sein/werden« dient hier der Identifikation; das deutsche Präsens passt zur visionären Beschreibung.
- source_word: እለ
  choice: die
  rationale: Der Relativmarker leitet den bestimmenden Relativsatz ein; zusammen mit »diese sind es« ergibt sich eine natürliche deutsche Struktur.
- source_word: ይኴንኑ
  choice: Gericht halten
  rationale: Die Wendung gibt die lexikalische Grundbedeutung »richten« in würdigem, natürlichem Deutsch wieder, ohne die mögliche Nuance »herrschen/regieren« in den Haupttext einzutragen.
- source_word: ከዋክብተ ሰማይ
  choice: die Sterne des Himmels
  rationale: Die Genitivverbindung bewahrt das kosmische Bild und den gehobenen apokalyptischen Ton.
theological_decisions:
- issue: Ob die Aussage als kosmische Herrschaft statt als Gericht wiederzugeben ist
  choice: über die Sterne des Himmels Gericht halten
  alternative: über die Sterne des Himmels herrschen / die Sterne des Himmels regieren
  rationale: Die gerichtliche Bedeutung des geezischen Verbs bleibt im Haupttext erhalten. Zugleich nennt die Fußnote die mögliche Herrschaftsnuance, damit die theologische Spannung nicht vorschnell aufgelöst wird.
- issue: Ob »Sterne« ausdrücklich als Himmelswesen auszulegen sind
  choice: Sterne
  alternative: Himmelswesen / Engel
  rationale: Das apokalyptische Bild kann reale Gestirne oder sinnbildlich himmlische Wesen bezeichnen. Die Übersetzung lässt diese Mehrdeutigkeit bestehen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem apokalyptischem Klang. »Gericht halten über« ist idiomatisch und etwas gehobener als schlichtes »richten«, bleibt aber für heutige Leser verständlich. Die beiden Fußnoten sichern die lexikalische und bildliche Mehrdeutigkeit.
