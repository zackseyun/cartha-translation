- source_word: ስኂን፡ ወከርቤ
  choice: nach Weihrauch und Myrrhe
  rationale: Die beiden Wörter bezeichnen konkret Weihrauch und Myrrhe und dürfen nicht als Orts- oder Verknüpfungsangabe missverstanden werden.
- source_word: ወዕፀወሂ
  choice: und auch die Bäume …
  rationale: Bewahrt die additive Aussage und den in der vorliegenden Verszeile unvollständigen Abschluss, ohne ein nicht überliefertes Prädikat zu ergänzen.
