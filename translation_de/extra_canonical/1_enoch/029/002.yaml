  text: And there I saw trees of incense[a], with the fragrance of frankincense and myrrh, and trees also[c][b],
translation:
  language: de
  text: Und dort sah ich Weihrauchbäume[a] mit überaus angenehmem[b] Duft nach Weihrauch und Myrrhe; und auch die Bäume …[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die überlieferte äthiopische Form ist schwierig und kann formal auch „Bäume des Gerichts“ bedeuten. Im Zusammenhang mit dem Duft von Weihrauch und Myrrhe liegt jedoch eine Bezeichnung für Weihrauch- oder Duftbäume nahe; möglicherweise beruht die Form auf einer alten Überlieferungsstörung.
    reason: textual_variant
  - marker: b
    text: Das Wort in der Mitte des Verses ist in der Vorlage unsicher. Gemeint ist offenbar ein besonders angenehmer Duft; möglich sind auch Wiedergaben wie „sehr kräftigem“ oder „würzigem Duft“.
    reason: textual_variant
  - marker: c
    text: Die vorliegende Verszeile bricht nach diesen Worten ab. Denkbar ist, dass ursprünglich noch eine weitere Beschreibung der Bäume folgte; sie wird hier nicht ergänzt.
    reason: alternative_reading
