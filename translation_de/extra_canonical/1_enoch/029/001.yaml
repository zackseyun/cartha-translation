base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/029/001.yaml
  text: And from there I went into another place[a], away from the wilderness[c][b]; and I drew near to the east of this mountain.
translation:
  language: de
  text: Von dort ging ich an einen anderen Ort, fort aus der Wildnis[a], und näherte mich der Ostseite dieses Berges.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Wüste« beziehungsweise »öde Gegend«.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich ist von der Richtung des Morgens oder Sonnenaufgangs die Rede, also vom Osten dieses Berges. Die Wendung kann auch räumlich als das Gebiet östlich des Berges verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወእምህየኒ
  choice: Von dort
  rationale: Gibt den erzählerischen Übergang und die Bewegung vom vorherigen Ort in natürlichem modernem Deutsch wieder.
- source_word: ሖርኩ
  choice: ging ich
  rationale: Bewahrt die schlichte Bedeutung des Bewegungsverbs, ohne eine besondere Art des Reisens hinzuzufügen.
- source_word: ውስተ መካን ካልእ
  choice: an einen anderen Ort
  rationale: Bezeichnet den Wechsel zu einem weiteren Ort, ohne die visionäre Landschaft näher festzulegen.
- source_word: እምነ መደባራ
  choice: fort aus der Wildnis
  rationale: Drückt die Bewegung von einer unbewohnten oder öden Gegend weg aus; »Wildnis« wahrt den breiten Bedeutungsumfang.
- source_word: ወመንገለ ጽባሕ
  choice: der Ostseite
  rationale: Die Wendung bezeichnet wörtlich die Richtung des Morgens beziehungsweise Sonnenaufgangs und damit den Osten.
- source_word: ለደብር ዝንቱ ቀረብኩ
  choice: näherte mich der Ostseite dieses Berges
  rationale: Fasst ለደብር ዝንቱ als genitivische Bestimmung zu der östlichen Richtung auf und erhält zugleich die Annäherungsbewegung sowie den deiktischen Sinn von »dieses«.
