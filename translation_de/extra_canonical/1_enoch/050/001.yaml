base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/050/001.yaml
  text: And in those days a change shall come for the holy ones and the chosen ones[a][b].
translation:
  language: de
  text: Und in jenen Tagen wird für die Heiligen und die Erwählten eine Veränderung eintreten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „wird für die Heiligen und die Erwählten eine Wende kommen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: in jenen Tagen
  rationale: Bewahrt die wiederkehrende apokalyptische Zeitformel und gibt መዋዕል konkret mit „Tagen“ wieder.
- source_word: ሚጠት
  choice: Veränderung
  rationale: Das Substantiv bezeichnet eine Veränderung, Wendung oder Umkehrung. „Veränderung“ ist im Haupttext präzise, verständlich und legt die Art des bevorstehenden Umschwungs nicht unnötig fest.
- source_word: ትከውን
  choice: wird … eintreten
  rationale: Das Verb bedeutet „sein/werden“. In Verbindung mit „Veränderung“ gibt „eintreten“ das Entstehen des neuen Zustands in natürlichem Deutsch wieder.
- source_word: ለቅዱሳን
  choice: für die Heiligen
  rationale: Bezeichnet heilige beziehungsweise Gott geweihte Personen; „die Heiligen“ ist die geläufige und würdige deutsche Wiedergabe.
- source_word: ወለኅሩያን
  choice: und die Erwählten
  rationale: Bewahrt die für 1 Henoch wichtige Bezeichnung als klaren, theologisch nicht weiter eingeengten Ausdruck.
theological_decisions:
- issue: Deutung von ሚጠት als „Veränderung“ oder als „Barmherzigkeit“
  choice: Veränderung
  alternative: Barmherzigkeit
  rationale: ሚጠት bezeichnet hier eine Veränderung oder Wendung und ist nicht das äthiopische Wort für „Barmherzigkeit“. Die Übersetzung vermeidet daher eine sachlich und theologisch nicht begründete Eintragung.
- issue: Bestimmung der Art der angekündigten Veränderung
  choice: offen gelassen
  alternative: Wende beziehungsweise Umkehrung der Verhältnisse
  rationale: Der einzelne Satz nennt eine Veränderung zugunsten der Heiligen und Erwählten, bestimmt ihren genauen Charakter aber nicht ausdrücklich. Der Haupttext bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Eine Veränderung eintreten“ verbindet natürliche deutsche Syntax mit enger Bindung an den äthiopischen Ausdruck; die Fußnote hält die stärkere Bedeutung „Wende“ als mögliche Lesart offen.
