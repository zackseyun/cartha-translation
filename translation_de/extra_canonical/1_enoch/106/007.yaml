base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/007.yaml
  text: And now[a], my father, I am here asking you and petitioning you, that you should go to Henok our father and hear from him the truth[b], for his dwelling is with the angels.
translation:
  language: de
  text: Und nun, mein Vater, bin ich hier und bitte dich und flehe dich an, zu Henok, unserem Vater, zu gehen und von ihm die Wahrheit zu hören; denn seine Wohnstätte ist bei den Engeln.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወይእዜኒ
  choice: Und nun
  rationale: Bewahrt den zeitlichen Übergang und klingt im modernen Deutschen natürlich.
- source_word: ሀለውኩ
  choice: bin ich hier
  rationale: Gibt die ausdrücklich bezeichnete gegenwärtige Anwesenheit in der Szene wieder.
- source_word: አስተበቍዐከ ወእስእል እምኀቤከ
  choice: bitte dich inständig
  rationale: Die beiden nahezu gleichbedeutenden Verben steigern die Dringlichkeit; eine natürliche deutsche Intensivierung vermeidet eine schwerfällige Doppelung.
- source_word: ከመ ትሖር ኀበ
  choice: zu … zu gehen
  rationale: Gibt den Inhalt der Bitte als Zielhandlung idiomatisch wieder.
- source_word: ሄኖክ አቡነ
  choice: Henok, unserem Vater
  rationale: Henok entspricht der Form ሄኖክ; die verwandtschaftlich-ehrende Bezeichnung wird ausdrücklich bewahrt.
- source_word: ትስማዕ እምኀቤሁ አማነ
  choice: von ihm die Wahrheit zu hören
  rationale: Bewahrt das konkrete Verb „hören“, die Herkunftsangabe „von ihm“ und die geezische Abfolge.
- source_word: እስመ
  choice: denn
  rationale: Leitet die Begründung für den Besuch bei Henok ein.
- source_word: ውእቱ ምስለ መላእክት ምኅዳሩ
  choice: seine Wohnstätte ist bei den Engeln
  rationale: Erhält die nominale Aussage über Henoks bleibenden Aufenthaltsort und das apokalyptische Bild.
theological_decisions:
- issue: Henoks Verhältnis zu den Engeln
  choice: seine Wohnstätte ist bei den Engeln
  alternative: er wohnt bei den Engeln
  rationale: Die nominale Formulierung des Ge'ez wird beibehalten, ohne die Art seines himmlischen Aufenthalts näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Inständig bitten“ bündelt die rhetorische Doppelung der beiden Bittverben, ohne den Nachdruck abzuschwächen. Keine Fußnote ist erforderlich; daher erscheinen auch keine Fußnotenmarker im Haupttext.
