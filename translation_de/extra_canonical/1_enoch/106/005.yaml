base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/005.yaml
  text: And he said to him[a], “I have begotten a strange son, and he is not like a human being; rather, he is like the children of the angels of heaven. And his nature is different, and he is not like us; and his eyes are like the rays of the sun[c][b], and his face is glorious.”
translation:
  language: de
  text: 'Und er sagte zu ihm: „Ich habe einen fremdartigen Sohn gezeugt,[a] und er ist nicht wie ein Mensch; vielmehr gleicht er den Kindern der Engel des Himmels.[b] Seine Natur ist anders, und er ist nicht wie wir; seine Augen sind wie die Strahlen der Sonne,[c] und sein Gesicht ist herrlich.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „einen ungewöhnlichen Sohn“. Das geʿezische Wort betont, dass das Kind deutlich vom Normalen abweicht.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „den Kindern der Engel des Himmels“. Die auffällige familiäre Ausdrucksweise bleibt erhalten und wird nicht zu „engelgleich“ abgeschwächt.'
    reason: lexical_alternative
  - marker: c
    text: 'Der Ausdruck vergleicht die Augen mit dem von der Sonne ausgehenden Licht; möglich ist auch: „wie Sonnenstrahlen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወለድኩ
  choice: ich habe … gezeugt
  rationale: Die erste Person der perfektischen Form bezeichnet hier aus dem Mund Lamechs das väterliche Zeugen. „Gezeugt“ bewahrt den gehobenen Ton und die ausdrückliche Vaterschaftsaussage.
- source_word: ውሉጠ
  choice: fremdartig
  rationale: Das Wort hebt die auffällige Andersartigkeit des Kindes hervor. „Fremdartig“ gibt Lamechs Beunruhigung wieder, ohne festzulegen, ob das Anderssein positiv oder bedrohlich ist.
- source_word: አኮኑ ከመ ሰብእ
  choice: er ist nicht wie ein Mensch
  rationale: Der Ausdruck stellt das Kind der gewöhnlichen Menschheit gegenüber. „Mensch“ ist im Deutschen natürlich und vermeidet eine unnötige Beschränkung auf männliche Personen.
- source_word: ወይመ ስል
  choice: vielmehr
  rationale: Das Wort leitet eine nachdrückliche kontrastierende Gegenüberstellung ein; „vielmehr“ gibt diese rhetorische Korrektur idiomatisch wieder.
- source_word: ደቂቀ መላእክተ ሰማይ
  choice: die Kinder der Engel des Himmels
  rationale: Die wörtliche familiäre Bezeichnung bleibt erhalten und wird nicht zum bloßen Adjektiv „engelgleich“ abgeschwächt.
- source_word: ፍጥረቱ
  choice: seine Natur
  rationale: Das Substantiv kann Schöpfung, Gestalt oder Beschaffenheit bezeichnen. „Natur“ ist verständlich und bewahrt die Aussage über das Wesen beziehungsweise die Beschaffenheit des Kindes.
- source_word: ካልእት
  choice: anders
  rationale: Prädikativ gebraucht bezeichnet es die Andersartigkeit seiner Natur; „anders“ ist die natürliche deutsche Entsprechung.
- source_word: አዕይንቲሁ ከመ አገሪሁ ለፀሐይ
  choice: seine Augen sind wie die Strahlen der Sonne
  rationale: Der Vergleich gilt dem von der Sonne ausgehenden Licht. „Strahlen der Sonne“ bewahrt das anschauliche apokalyptische Bild.
- source_word: ገጹ ስቡሕ
  choice: sein Gesicht ist herrlich
  rationale: Das Adjektiv bezeichnet Herrlichkeit, Ehre oder Glanz. „Herrlich“ wahrt den erhöhten Ton und lässt offen, ob vor allem sichtbarer Glanz oder Würde gemeint ist.
theological_decisions:
- issue: Ob der Vergleich mit den „Kindern der Engel des Himmels“ zu einem bloß engelgleichen Aussehen abgeschwächt werden soll
  choice: Die familiäre Wendung „die Kinder der Engel des Himmels“ bleibt im Haupttext erhalten.
  alternative: „den Engeln des Himmels“ oder „himmlischen Engeln“
  rationale: Der geʿezische Text verwendet ausdrücklich eine Kind-Bezeichnung, und der Erzählzusammenhang enthält die Sorge um eine ungewöhnliche Abstammung. Eine rein adjektivische Wiedergabe würde diese Spannung mindern.
- issue: Ob ሰብእ geschlechtsspezifisch als „Mann“ wiederzugeben ist
  choice: Mensch
  alternative: Mann
  rationale: Der Gegensatz betrifft gewöhnliches Menschsein und nicht speziell männliche Personen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht gehobenem erzählerischem Ton. Die Semikola erhalten die dichte Satzstruktur des Ausgangstextes, ohne die Verständlichkeit zu beeinträchtigen. Die apokalyptische Bildsprache und die Spannung hinsichtlich der Natur und möglichen Abstammung des Kindes werden nicht geglättet.
