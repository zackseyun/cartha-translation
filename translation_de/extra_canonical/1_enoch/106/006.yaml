base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/006.yaml
  text: And it seems to me that he is not from me, but from the angels; and I fear that a wonder might be done in his days upon the earth.
translation:
  language: de
  text: Und es scheint mir, dass er nicht von mir, sondern von den Engeln stammt; und ich fürchte, dass in seinen Tagen auf der Erde ein Wunder[a] geschehen könnte.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „etwas Außergewöhnliches“ oder „ein unheimliches Ereignis“. Das geʿezische Wort bezeichnet etwas Außerordentliches oder Staunen Erregendes.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „Und es schien mir, dass er nicht von mir, sondern von den Engeln stammte; und ich fürchtete mich, dass in seinen Tagen auf der Erde ein Wunder geschehen könnte.“ Das Präsens ist hier wegen der fortlaufenden direkten Rede und der geʿezischen Verbformen vorzuziehen.'
    reason: previous_rendering
lexical_decisions:
- source_word: ይመስለኒ
  choice: es scheint mir
  rationale: Bewahrt die Wahrnehmungsformel und den präsentischen Charakter von Lamechs direkter Rede, ohne seine Vermutung als Gewissheit darzustellen.
- source_word: አኮኑ፡ እምኔየ
  choice: dass er nicht von mir … stammt
  rationale: Gibt die negierte Herkunftsaussage in natürlichem Deutsch wieder und hält die implizite Frage der Vaterschaft offen.
- source_word: እመላእክት
  choice: sondern von den Engeln
  rationale: Erhält den scharfen Gegensatz zwischen menschlicher und engelhafter Herkunft, ohne Lamechs Vermutung erzählerisch zu bestätigen.
- source_word: እፈረሀ
  choice: ich fürchte
  rationale: Der Präsensgebrauch entspricht dem Imperfekt in der fortlaufenden direkten Rede und gibt Lamechs gegenwärtige Furcht wieder.
- source_word: ኢይትገበር
  choice: geschehen könnte
  rationale: Natürliches deutsches Passiv beziehungsweise unpersönliches Ereignisprädikat; der Konjunktiv wahrt den Inhalt der Befürchtung und dessen Unsicherheit.
- source_word: መንክር
  choice: ein Wunder
  rationale: Bezeichnet ein außergewöhnliches, Staunen oder Unbehagen auslösendes Ereignis; Alternativen werden in der Fußnote kenntlich gemacht.
- source_word: በመዋዕሊሁ
  choice: in seinen Tagen
  rationale: Bewahrt die gehobene zeitliche Wendung und ihren Bezug auf das Kind.
- source_word: ዲበ፡ ምድር
  choice: auf der Erde
  rationale: Passt zum kosmisch-apokalyptischen Zusammenhang und vermeidet die engere Bedeutung „Land“.
theological_decisions:
- issue: Die vermutete Herkunft des Kindes
  choice: Lamech hält das Kind möglicherweise für von Engeln stammend; dies bleibt ausdrücklich seine Wahrnehmung.
  alternative: Die Aussage als objektiv bestätigte engelhafte Zeugung oder lediglich als Übertreibung angesichts des ungewöhnlichen Aussehens zu verstehen.
  rationale: „Es scheint mir“ rahmt die Aussage als subjektive, von Furcht geprägte Schlussfolgerung. Die Übersetzung bestätigt oder widerlegt sie nicht.
- issue: Gewissheitsgrad des erwarteten Wunders
  choice: „geschehen könnte“ innerhalb einer Befürchtung
  alternative: „geschehen wird“ oder „getan werden könnte“
  rationale: Die Formulierung wahrt die Spannung zwischen Lamechs Furcht und der nicht ausdrücklich als sichere Prophezeiung markierten Zukunftsaussage; zugleich klingt sie im Deutschen natürlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem apokalyptischem Ton. „In seinen Tagen“ bewahrt die Quellensprache, während „geschehen könnte“ idiomatischer ist als eine wörtliche passive Formulierung. Sämtliche Fußnotenmarker stehen im Haupttext.
