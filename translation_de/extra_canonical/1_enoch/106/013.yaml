base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/013.yaml
  text: And I[a], Enoch, answered and said to him, “The Lord will do a new thing on the earth; and this I have already seen in a vision, and I have made it known to you[e][d][c][b], because in the generation of Jared my father they transgressed the word of my Lord from the heights of heaven.”
translation:
  language: de
  text: 'Und ich, Henoch, antwortete und sagte zu ihm: »Der Herr wird etwas Neues auf der Erde tun[a]. Das habe ich schon in einer Vision gesehen und dir mitgeteilt. Denn in der Generation meines Vaters Jared übertraten sie das Wort meines Herrn von den Höhen des Himmels[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Der Herr wird auf der Erde erneuern« beziehungsweise »etwas neu machen«. Verb und Objekt greifen beide die Vorstellung des Neuen auf.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Schlusswendung kann auch so verstanden werden, dass sie den Herrn näher bestimmt: »das Wort meines Herrn, der von den Höhen des Himmels ist«. Im Ge''ez ist nicht eindeutig, ob »von den Höhen des Himmels« das Wort oder den Herrn näher bestimmt.'
    reason: alternative_reading
lexical_decisions:
- source_word: አውሣእኩ … ወእቤሎ
  choice: antwortete und sagte zu ihm
  rationale: Bewahrt die für semitische Erzählungen typische doppelte Redeeinleitung und den würdevollen Ton.
- source_word: ይኄድስ … ኀዳሳተ
  choice: wird etwas Neues … tun
  rationale: Verb und Objekt beruhen beide auf der Vorstellung des Neuen. Die Formulierung ist im Deutschen natürlich und lässt offen, ob eine neue Tat oder eine Erneuerung gemeint ist.
- source_word: ዲበ ምድር
  choice: auf der Erde
  rationale: Natürliche moderne Wiedergabe der Ortsangabe, ohne den erhöhten Stil unnötig zu archaisieren.
- source_word: ወዳእኩ ርኢኩ በራእይ
  choice: habe ich schon in einer Vision gesehen
  rationale: Gibt die vorausliegende Schau und ihre fortdauernde Bedeutung für Henochs Aussage wieder.
- source_word: አይዳዕኩከ
  choice: dir mitgeteilt
  rationale: Gibt den kausativen Sinn des Bekanntmachens idiomatisch wieder.
- source_word: በትውልዱ ለአያሬድ አቡየ
  choice: in der Generation meines Vaters Jared
  rationale: Bewahrt die genealogische Zeitangabe und verbindet »mein Vater« im Deutschen eindeutig mit Jared.
- source_word: አኅለፉ
  choice: übertraten
  rationale: Erhält das Grundbild des Überschreitens und passt zum folgenden »Wort«, ohne die Verfehlung enger als »Sünde« auszulegen.
- source_word: ነገረ ለእግዚእየ
  choice: das Wort meines Herrn
  rationale: Bewahrt sowohl das Possessivsuffix als auch die Bedeutungsbreite von »Wort« gegenüber der engeren Wiedergabe »Gebot«.
- source_word: እመልዕልተ ሰማይ
  choice: von den Höhen des Himmels
  rationale: Gibt die vertikale Bildsprache wieder; wegen der schwierigen Syntax bleibt die Zuordnung der Wendung in einer Fußnote offen.
theological_decisions:
- issue: Art des angekündigten Handelns des Herrn
  choice: Der Herr wird etwas Neues auf der Erde tun.
  alternative: Der Herr wird die Erde erneuern.
  rationale: Der ge'ezische Wortlaut bezeichnet Neuheit beziehungsweise Erneuerung, legt aber nicht eindeutig eine umfassende kosmische Erneuerung fest.
- issue: Verfehlung in Jareds Generation
  choice: sie übertraten das Wort meines Herrn
  alternative: sie übertraten das Gebot des Herrn
  rationale: Die breitere Wiedergabe benennt die im Kontext naheliegende urzeitliche Rebellion nicht genauer, als es der Vers selbst tut.
- issue: Syntaktische Zuordnung der Herkunftsangabe
  choice: Die Wendung »von den Höhen des Himmels« steht im Haupttext beim »Wort meines Herrn«.
  alternative: 'Sie kann den Herrn näher bestimmen: »meines Herrn von den Höhen des Himmels«.'
  rationale: Die ge'ezische Syntax erlaubt keine sichere Entscheidung; die Fußnote bewahrt beide Möglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die semitische doppelte Redeeinleitung bleibt erhalten; unnötig altertümliche Formen werden vermieden. Die Fußnoten stehen unmittelbar an den Stellen, auf die sie sich beziehen.
