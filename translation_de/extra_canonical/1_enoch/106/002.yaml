base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/002.yaml
  text: And his body was white like snow[a], and red like the blooming of a rose; and the hair of his head was like white wool, and his locks were beautiful. And his eyes were beautiful; and when he opened his eyes, he lit up the whole house like the sun[c][b], and the whole house became exceedingly bright.
translation:
  language: de
  text: Und sein Körper war weiß wie Schnee und rot wie eine Rosenblüte[a]. Das Haar auf seinem Kopf war wie weiße Wolle, und seine Locken waren schön. Und seine Augen waren schön[b]. Als er seine Augen öffnete, erhellte er das ganze Haus wie die Sonne, und das ganze Haus wurde überaus hell.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „wie das Blühen einer Rose“; der Ausdruck bezeichnet einen floralen Vergleich für die rote Farbe.'
    reason: lexical_alternative
  - marker: b
    text: Die Formulierung über die Augen ist im äthiopischen Text schwierig. „Schön“ kann auch im Sinn von „prächtig“ oder „glänzend“ verstanden werden.
    reason: textual_variant
lexical_decisions:
- source_word: ሥጋሁ
  choice: sein Körper
  rationale: Die Aussage beschreibt das sichtbare körperliche Erscheinungsbild insgesamt; „Körper“ ist hier natürlicher und weniger missverständlich als „Fleisch“.
- source_word: ጻዕዳ ከመ አስሐትያ
  choice: weiß wie Schnee
  rationale: Bewahrt den klaren Farbvergleich ohne zusätzliche Verstärkung.
- source_word: ቀይሕ ከመ ጽጌ ረዳ
  choice: rot wie eine Rosenblüte
  rationale: Gibt den floralen Vergleich für die rote Farbe knapp und bildhaft wieder; „wie das Blühen einer Rose“ wäre ebenfalls möglich, klingt im Deutschen aber weniger natürlich.
- source_word: ጸጕረ ርእሱ ከመ ፀምር ጻዕዳ
  choice: das Haar auf seinem Kopf war wie weiße Wolle
  rationale: Erhält das vollständige Bild und ordnet „weiß“ entsprechend der geʿezischen Wortfolge der Wolle zu.
- source_word: ተወድምድማሁ ሠናይ
  choice: seine Locken waren schön
  rationale: Berücksichtigt das in einer älteren Wiedergabe ausgelassene Substantiv für die Locken und bezieht das singularische Prädikat sachgemäß darauf.
- source_word: አዕይንቲሁ
  choice: seine Augen
  rationale: Die Augen werden ausdrücklich genannt und im anschließenden Satz erneut aufgenommen.
- source_word: ከሠተ አዕይንቲሁ
  choice: wenn er seine Augen öffnete
  rationale: „Öffnen“ ist im Kontext die natürliche deutsche Wiedergabe des Ausdrucks.
- source_word: አብርሀ ኵሎ ቤተ ከመ ፀሐይ
  choice: erhellte er das ganze Haus wie die Sonne
  rationale: Bewahrt die konkrete kausative Lichtwirkung und den Sonnenvergleich.
- source_word: ወፈድፋደ በርሀ ኵሉ ቤት
  choice: und das ganze Haus wurde überaus hell
  rationale: Gibt die starke Intensivierung wieder, ohne das apokalyptische Bild abzuschwächen.
theological_decisions:
- issue: Außergewöhnliche Leuchtkraft des Kindes
  choice: Die körperlichen Farbbilder und das Erhellen des Hauses werden als konkrete, wunderhafte Erscheinung beibehalten.
  alternative: Die Aussagen als bloße Metaphern für Schönheit oder Herrlichkeit verallgemeinern.
  rationale: Der geʿezische Text schildert eine auffällige sichtbare Wirkung. Eine Abstraktion würde die apokalyptische Spannung und Bildkraft mindern.
- issue: Bezug des Ausdrucks „schön“ im schwierigen Satzgefüge
  choice: „Schön“ wird sowohl auf die Locken als auch, entsprechend der überlieferten fortlaufenden Lesart, auf die Augen bezogen; die Unsicherheit wird in einer Fußnote kenntlich gemacht.
  alternative: Nur die Locken als schön bezeichnen und nach „seine Augen“ einen Satzabbruch annehmen.
  rationale: Die unmittelbare Überlieferung ist syntaktisch schwierig. Die gewählte Fassung ergibt einen lesbaren deutschen Satz, ohne die textliche Unsicherheit zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer apokalyptischer Bildsprache. Die Wiederholung von „das ganze Haus“ bleibt erhalten, da sie die Intensivierung des Ausgangstextes trägt.
