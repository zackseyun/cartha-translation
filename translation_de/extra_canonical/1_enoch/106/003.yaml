base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/003.yaml
  text: And at that time[a], he rose from the hands of the midwife[b], and he opened his mouth and spoke to the Lord of righteousness.
translation:
  language: de
  text: Da erhob er sich aus den Händen der Hebamme[a], öffnete seinen Mund und sprach zum Herrn der Gerechtigkeit[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus ihren Händen“; das Ge''ez bezeichnet die Frau als Geburtshelferin, daher „Hebamme“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zum Herrn des Rechts“. Das Ge''ez-Wort kann sowohl sittliche Gerechtigkeit als auch Recht im richterlichen Sinn bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሶቤሃ
  choice: Da
  rationale: Der zeitlich-erzählende Anschluss wird im Deutschen natürlich und zugleich würdig mit „Da“ wiedergegeben; er bezeichnet den Zeitpunkt des folgenden Geschehens, ohne eine unnötig genaue Zeitspanne einzuführen.
- source_word: ተንሥአ
  choice: erhob er sich
  rationale: Das Verb bezeichnet ein Sich-Erheben oder Aufstehen. „Erhob er sich“ bewahrt das außergewöhnliche Bild des Neugeborenen, ohne seine genaue Körperhaltung festzulegen.
- source_word: እምእዴሃ ለመውለዲት
  choice: aus den Händen der Hebamme
  rationale: Wörtlich steht „aus ihren Händen“, wobei das folgende Substantiv die Frau als Geburtshelferin bezeichnet. Die deutsche Fassung macht den Bezug verständlich und bleibt nahe an der Bildsprache.
- source_word: ወከሠተ አፉሁ
  choice: öffnete seinen Mund
  rationale: Die aktive Form und die anschauliche Redeeinleitung des Ge'ez werden unmittelbar beibehalten.
- source_word: ተወተናገረ
  choice: sprach
  rationale: Das schlichte Verb gibt den direkten Erzählstil wieder, ohne den Ausdruck rhetorisch auszuschmücken.
- source_word: ለእግዚአ ጽድቅ
  choice: zum Herrn der Gerechtigkeit
  rationale: „Herr“ entspricht dem religiös erhöhten Titel; „Gerechtigkeit“ umfasst im Deutschen sowohl die sittliche Richtigkeit als auch den rechtsprechenden Aspekt besser als das enger wirkende „Recht“.
theological_decisions:
- issue: Wiedergabe von ጽድቅ im göttlichen Titel
  choice: Gerechtigkeit
  alternative: Recht; Rechtschaffenheit
  rationale: Der Ausdruck kann moralische wie richterliche Bedeutung tragen. „Gerechtigkeit“ wahrt diese Spannweite und das theologische Gewicht des Titels, ohne ihn ausschließlich auf gerichtliches Handeln oder persönliche Tugend einzuengen.
translation_notes:
  register: Moderne, allgemein verständliche Standardsprache mit würdigem erzählerischem Ton. Die ungewöhnliche Handlung des Neugeborenen und die formelhafte Wendung „öffnete seinen Mund“ bleiben bewusst sichtbar. Die Fußnotenmarker stehen unmittelbar bei den jeweils erläuterten Ausdrücken.
