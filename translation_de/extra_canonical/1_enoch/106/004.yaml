base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/004.yaml
  text: And Lamech his father was afraid of him[b][a], and he fled and came to his father Methuselah.
translation:
  language: de
  text: Und Lamech, sein Vater, fürchtete sich vor ihm[a]; er floh und kam zu seinem Vater Metuschelach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Ihm“ bezieht sich im unmittelbaren Zusammenhang am ehesten auf das zuvor beschriebene neugeborene Kind.
    reason: cross_reference
lexical_decisions:
- source_word: ፈረሀ
  choice: fürchtete sich
  rationale: Das Verb bezeichnet Furcht; die reflexive deutsche Wendung gibt Lamechs unmittelbare Reaktion natürlich und ohne zusätzliche Deutung wieder.
- source_word: እምኔሁ
  choice: vor ihm
  rationale: Die Präpositionalform bezeichnet hier am naheliegendsten die Person, die Lamech fürchtet. Das Pronomen bleibt wie in der Vorlage erhalten.
- source_word: ጐየ
  choice: floh
  rationale: Das Verb beschreibt eine rasche, von Furcht bestimmte Entfernung und wird daher stärker als das neutrale „ging weg“ wiedergegeben.
- source_word: መጽአ ኀበ
  choice: kam zu
  rationale: Die Verbindung aus Bewegungsverb und Präposition bezeichnet die Ankunft bei einer Person und lässt sich im Erzählzusammenhang direkt mit „kam zu“ wiedergeben.
- source_word: አቡሁ
  choice: sein Vater / seinem Vater
  rationale: 'Beide Vorkommen der Possessivverbindung werden wiedergegeben: Das erste steht als Apposition zu Lamech, das zweite bezeichnet Metuschelach als Lamechs Vater.'
- source_word: ማቱሳላ
  choice: Metuschelach
  rationale: Verwendet wird die im modernen deutschen Bibelgebrauch geläufige Namensform.
theological_decisions:
- issue: Bezug des Pronomens bei Lamechs Furcht
  choice: Das Pronomen „ihm“ bleibt im Haupttext stehen; im unmittelbaren Kontext bezieht es sich am ehesten auf das neugeborene Kind.
  alternative: Im Haupttext ausdrücklich „vor dem Kind“ schreiben.
  rationale: Die Vorlage nennt nur ein Pronomen. Seine Beibehaltung wahrt die knappe Ausdrucksweise und eine mögliche formale Mehrdeutigkeit, während die Fußnote den wahrscheinlichsten Kontextbezug nennt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Apposition „sein Vater“ bleibt erhalten, weil sie in der ge’ezischen Vorlage ausdrücklich steht und hervorhebt, dass der eigene Vater des Kindes erschrak. Das Semikolon gliedert Furchtreaktion und anschließende Flucht, ohne die Erzählfolge zu verändern.
