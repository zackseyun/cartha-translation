base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/008.yaml
  text: And when Methuselah heard the words of his son[a], he came to me at the ends of the earth, because he had heard that I was there. And he cried out, and I heard his voice, and I came to him and said to him, “Behold, I am here, my son. Why have you come to me?”
translation:
  language: de
  text: 'Als Metuschelach die Worte seines Sohnes hörte, kam er zu mir an die Enden der Erde, denn er hatte gehört, dass ich dort war. Er rief laut, und ich hörte seine Stimme. Da kam ich zu ihm und sagte: »Siehe, hier bin ich, mein Sohn. Warum bist du zu mir gekommen?[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Schlussklausel des Verses lautet im Äthiopischen bei wörtlicher Wiedergabe schwer verständlich: »denn/weil du zu mir gekommen bist«. Im Zusammenhang ist sie wohl als Frage nach dem Grund oder Zweck zu verstehen: »Warum bist du zu mir gekommen?«'
    reason: textual_variant
lexical_decisions:
- source_word: ሰምዐ
  choice: hörte
  rationale: Das grundlegende Verb des Hörens passt an beiden Stellen und bewahrt die Erzählfolge.
- source_word: ነገረ ወልዱ
  choice: die Worte seines Sohnes
  rationale: ነገር kann Wort, Sache oder Botschaft bezeichnen; »Worte« bleibt konkret und ist im Deutschen natürlich.
- source_word: ውስተ አጽናፈ ምድር
  choice: an die Enden der Erde
  rationale: Die Formulierung bewahrt die apokalyptisch-geografische Bildkraft und reduziert den Ort nicht auf bloße Ferne.
- source_word: እስመ ሰምዐ ከመ ህየ ሀለውኩ
  choice: denn er hatte gehört, dass ich dort war
  rationale: Die Ortsangabe »dort« und das Plusquamperfekt geben Grund und zeitliche Abfolge der Reise klar wieder.
- source_word: ጸርኀ
  choice: rief laut
  rationale: Die Wendung vermittelt einen kräftigen Ruf, ohne unnötig umgangssprachlich zu wirken.
- source_word: ቃሎ
  choice: seine Stimme
  rationale: Im Zusammenhang mit dem lauten Rufen bezeichnet das Wort am natürlichsten die hörbare Stimme.
- source_word: ናሁ ሀለውኩ
  choice: Siehe, hier bin ich
  rationale: »Siehe« bewahrt den gehobenen, feierlichen Ton; »hier bin ich« ist zugleich klares modernes Deutsch.
- source_word: ወልድየ
  choice: mein Sohn
  rationale: Die direkte familiäre Anrede wird unverändert bewahrt.
- source_word: እስመ መጻእከ ኀቤየ
  choice: Warum bist du zu mir gekommen?
  rationale: Der überlieferte äthiopische Wortlaut ist bei streng wörtlicher Wiedergabe schwierig; im Kontext liegt eine Frage nach dem Grund oder Zweck des Kommens nahe.
theological_decisions:
- issue: Kosmische Ortsformel
  choice: an die Enden der Erde
  alternative: in einer fernen Gegend / an die äußersten Grenzen des Landes
  rationale: Die apokalyptische Weite der Ortsangabe bleibt erhalten, ohne sie zu einer bloß allgemeinen Entfernung zu verflachen.
- issue: Schwierige Schlussklausel
  choice: Warum bist du zu mir gekommen?
  alternative: denn/weil du zu mir gekommen bist
  rationale: Die Frage entspricht dem wahrscheinlichen Sinn im Gespräch, während die Fußnote die formale Schwierigkeit und die wörtlich mögliche kausale Lesart offenlegt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem Erzählton. Die traditionelle Signalformel »Siehe« bleibt wegen des feierlichen Registers erhalten; Satzbau und direkte Rede sind zugleich gut verständlich.
