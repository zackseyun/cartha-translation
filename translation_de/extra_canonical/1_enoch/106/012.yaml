base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/012.yaml
  text: And his father Lamech was afraid[a], and he fled to me, and he did not believe that he was from him, but that his likeness was like the angels of heaven. And behold[b], I have come to you so that you may make righteousness known to me.
translation:
  language: de
  text: Da fürchtete sich sein Vater Lamech und floh zu mir. Er glaubte nicht, dass das Kind von ihm stammte, sondern meinte, seine Gestalt gleiche der der Engel des Himmels.[a] Und sieh, ich bin zu dir gekommen, damit du mir kundtust, was recht ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „sondern dass seine Gestalt von den Engeln des Himmels sei“. Die Formulierung bezeichnet jedenfalls eine engelhafte Ähnlichkeit; eine Abstammung von Engeln wird nicht ausdrücklich festgestellt.'
    reason: textual_and_lexical_ambiguity
  - marker: b
    text: 'Oder: „damit du mir die Wahrheit kundtust“, „damit du mir die Gerechtigkeit kundtust“ oder „damit du mir kundtust, was wahr ist“. Das geezische Wort kann Wahrheit beziehungsweise Richtigkeit sowie Gerechtigkeit bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ፈርሀ
  choice: fürchtete sich
  rationale: Gibt das einfache geezische Verb für Furcht natürlich und ohne zusätzliche Intensivierung wieder.
- source_word: ጐየ
  choice: floh
  rationale: Bewahrt im Zusammenhang mit Lamechs Schrecken die dringliche Bewegung zum Sprecher.
- source_word: ኀቤየ
  choice: zu mir
  rationale: Bezeichnet die Bewegung auf den Sprecher zu.
- source_word: ኢአምነ (wahrscheinliche Lesart statt des überlieferten/OCR-erfassten አአምነ)
  choice: Er glaubte nicht
  rationale: Die revidierte Textbeurteilung setzt eine Negation beim Verb voraus; die Wiedergabe wahrt diese grammatische Lesart.
- source_word: እምኔሁ
  choice: von ihm stammte
  rationale: Drückt Herkunft beziehungsweise Abstammung idiomatisch aus; „das Kind“ verdeutlicht lediglich den im Kontext gegebenen Bezug des Pronomens.
- source_word: አምሳሉ
  choice: seine Gestalt
  rationale: Bewahrt das Substantiv mit Possessivsuffix statt es in eine bloße Präpositionalwendung aufzulösen.
- source_word: እመላእክተ ሰማይ
  choice: der der Engel des Himmels
  rationale: Erhält den Vergleich mit den himmlischen Engeln und behauptet keine ausdrückliche Engelsabstammung.
- source_word: ናሁ መጻእኩ ኀቤከ
  choice: Und sieh, ich bin zu dir gekommen
  rationale: Bewahrt den deiktischen Diskursmarker und die vollzogene Bewegung zum Angesprochenen in natürlichem modernem Deutsch.
- source_word: ታይድዐኒ
  choice: damit du mir kundtust
  rationale: Gibt den kausativen Sinn „mich wissen lassen“ in einem würdigen, noch gut verständlichen Register wieder.
- source_word: ጽድቀ
  choice: was wahr und recht ist
  rationale: Bewahrt sowohl den Wahrheitsbezug der konkreten Auskunft als auch die moralisch-juridische Bedeutungsbreite des geezischen Nomens.
theological_decisions:
- issue: Behauptet der Vers Engelsvaterschaft oder lediglich eine Ähnlichkeit mit Engeln?
  choice: Der Haupttext spricht von der Gestalt des Kindes, die der Gestalt der Engel gleiche.
  alternative: Das Kind stamme von den Engeln des Himmels oder sei selbst einer von ihnen.
  rationale: አምሳሉ bezeichnet ausdrücklich seine Gestalt beziehungsweise Ähnlichkeit; eine direkte Engelsabstammung wird hier nicht eindeutig ausgesagt.
- issue: Bedeutung von ጽድቀ im Anliegen Lamechs
  choice: was wahr und recht ist
  alternative: die Wahrheit; die Gerechtigkeit; das Rechte
  rationale: Die Formulierung hält die semantische Spannung zwischen wahrer Auskunft und moralisch-juridischer Richtigkeit offen, statt sie zugunsten nur einer Bedeutung aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kurze Hauptsätze erleichtern das Verständnis; „kundtun“ erhält den feierlichen Erzählton, ohne altertümliche Syntax zu verwenden. Die Wiederholung „seine Gestalt gleiche der der Engel“ ist bewusst gewählt, um das geezische Substantiv präzise abzubilden.
