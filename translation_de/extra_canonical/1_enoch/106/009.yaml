base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/009.yaml
  text: And he answered me and said[a], “Because of a great trouble I have come to you[c][b], and because of a marvelous vision I have drawn near.”
translation:
  language: de
  text: 'Und er antwortete mir: „Wegen großer Bedrängnis bin ich zu dir gekommen, und wegen einer wunderbaren Vision habe ich mich genähert.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አውሥአኒ ወይቤ
  choice: er antwortete mir
  rationale: Die Wendung bezeichnet eine Antwort; das zusätzliche ወይቤ („und sagte“) ist im natürlichen Deutschen in „antwortete“ bereits enthalten.
- source_word: በእንተ
  choice: wegen
  rationale: Die Präposition bezeichnet hier den Anlass oder Grund des Kommens und wird daher kausal wiedergegeben.
- source_word: ጻህቅ ዐቢይ
  choice: großer Bedrängnis
  rationale: ጻህቅ bezeichnet hier Bedrängnis, Unruhe oder Dringlichkeit, nicht „Gerechtigkeit“; „große Bedrängnis“ bewahrt den gewichtigen Anlass.
- source_word: መጻእኩ ኀቤከ
  choice: bin ich zu dir gekommen
  rationale: Gibt das Verb des Kommens mit der Zielangabe „zu dir“ direkt und idiomatisch wieder.
- source_word: ራእይ ዐፁብ
  choice: einer staunenswerten Vision
  rationale: ራእይ bezeichnet im apokalyptischen Zusammenhang eine Vision; ዐፁብ hebt deren außergewöhnlichen, Staunen erregenden Charakter hervor.
- source_word: ቀረብኩ
  choice: bin ich herbeigekommen
  rationale: Das Verb bedeutet „sich nähern/herantreten“. „Herbeigekommen“ bewahrt die Bewegung zum Angesprochenen und vermeidet ein unnatürlich feierliches „habe mich genaht“.
theological_decisions:
- issue: Deutung von ጻህቅ
  choice: Bedrängnis als Anlass des Besuchs
  alternative: eine Sache der Gerechtigkeit bzw. ein großer Gerechter
  rationale: Die betreffende ge'ezische Form ist von ጽድቅ („Gerechtigkeit“) zu unterscheiden und bezeichnet Bedrängnis, Unruhe oder Dringlichkeit. Eine personifizierte oder messianische Deutung wäre textlich nicht begründet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur des Ge'ez wird bewahrt; die beiden Verben des Kommens bleiben unterscheidbar, ohne im Deutschen gekünstelt zu wirken.
