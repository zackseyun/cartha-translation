base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/011.yaml
  text: And he rose up in the hands of the midwife[a], and he opened his mouth and blessed the Lord of heaven.
translation:
  language: de
  text: Und er erhob sich in den Händen der Geburtshelferin[a], öffnete seinen Mund und segnete den Herrn des Himmels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Wort kann je nach Kontext die gebärende Frau oder eine bei der Geburt tätige Frau bezeichnen. In dieser Geburtsszene ist offenbar die Frau gemeint, die das Kind entgegennimmt und in den Händen hält.
    reason: lexical_alternative
lexical_decisions:
- source_word: ተንሥአ
  choice: richtete sich ... auf
  rationale: Das Verb bezeichnet ein Sich-Erheben oder Aufstehen. Beim neugeborenen Noah gibt die reflexive Form die erstaunliche Bewegung natürlich und anschaulich wieder.
- source_word: ውስተ እዴሃ
  choice: in den Händen
  rationale: Die Wendung enthält wörtlich die Vorstellung »in/innerhalb ihrer Hände«; »in den Händen« ist im Deutschen idiomatisch und bewahrt die körperliche Szene.
- source_word: መውላዲት
  choice: Geburtshelferin
  rationale: Das feminine Nomen kann wörtlich eine gebärende oder bei der Geburt tätige Frau bezeichnen. Im Zusammenhang ist die Frau gemeint, die das Neugeborene in den Händen hält; »Geburtshelferin« gibt dies wieder, ohne zwingend eine moderne medizinische Berufsqualifikation vorauszusetzen.
- source_word: ፈትሐ አፉሁ
  choice: öffnete seinen Mund
  rationale: Die bildhafte, formelhafte Wendung wird beibehalten, da hier gerade das Sprechen unmittelbar nach der Geburt Teil des Wunders ist.
- source_word: ባረኮ
  choice: pries
  rationale: Das Verb kann »segnen« oder in auf Gott gerichteter Rede »preisen« bedeuten. Im Deutschen ist »Gott preisen« natürlicher als »Gott segnen« und bezeichnet hier ehrende Lobpreisung, ohne den Inhalt auszudeuten.
- source_word: እግዚአ ሰማይ
  choice: den Herrn des Himmels
  rationale: Der Herrschertitel wird übersetzt; der singularische Genitiv entspricht der geʿezischen Form und ist im Deutschen würdig und verständlich.
theological_decisions:
- issue: Wiedergabe des an Gott gerichteten Verbs ባረኮ
  choice: pries
  alternative: segnete
  rationale: »Segnete« wäre formal näher und bleibt lexikalisch möglich, kann im heutigen Deutschen bei einem menschlichen Subjekt und Gott als Objekt jedoch missverständlich wirken. »Pries« gibt die hier naheliegende doxologische Bedeutung natürlich wieder.
- issue: Wiedergabe des göttlichen Titels
  choice: Herr des Himmels
  alternative: Gebieter des Himmels
  rationale: »Herr« ist die übliche, konfessionell nicht weiter spezifizierende Wiedergabe des göttlichen Herrschertitels; der Singular »Himmel« bewahrt die Form der Vorlage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit anschaulicher Satzfolge. »Geburtshelferin« ist verständlicher und weniger berufsrechtlich festgelegt als »Hebamme«; die Fußnote bewahrt die lexikalische Mehrdeutigkeit. Die auffällige Formel »öffnete seinen Mund« bleibt erhalten.
