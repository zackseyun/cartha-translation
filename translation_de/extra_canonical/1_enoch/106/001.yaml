base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/001.yaml
  text: And after some days my son Methuselah took a wife for his son Lamech[a], and she conceived by him and bore a son.
translation:
  language: de
  text: Und nach einiger Zeit nahm mein Sohn Metuschelach für seinen Sohn Lamech eine Frau[a]. Sie wurde von ihm schwanger und gebar einen Sohn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlicher könnte der Anfang auch mit »nach einigen Tagen« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረ መዋዕል
  choice: nach einiger Zeit
  rationale: Die Wendung bezeichnet einen späteren Zeitpunkt nach einem gewissen Zeitraum. »Nach einiger Zeit« gibt den zeitlichen Sinn im Deutschen natürlich wieder, ohne die mögliche Bedeutung unnötig auf eine bestimmte Zahl von Tagen einzuengen.
- source_word: ነሥአ
  choice: nahm
  rationale: Im ehelichen Zusammenhang bedeutet das Verb, eine Frau zu nehmen beziehungsweise eine Ehe zu veranlassen. Mit Metuschelach als Subjekt bleibt die familiäre Vermittlung erhalten.
- source_word: ብእሲተ
  choice: eine Frau
  rationale: Das Wort kann allgemein »Frau« bedeuten; in der Verbindung mit »nahm ... für seinen Sohn« ist eine Ehefrau gemeint. Die deutsche Wendung »eine Frau nehmen« macht diesen Sinn deutlich.
- source_word: ወፀንሰት
  choice: sie wurde schwanger
  rationale: Diese Formulierung ist in modernem Deutsch klar und natürlich und gibt den Eintritt der Schwangerschaft wieder.
- source_word: እምኔሁ
  choice: von ihm
  rationale: Die Präpositionalform kennzeichnet Lamech als den Vater. »Von ihm« wahrt die knappe Ausdrucksweise des Ausgangstextes.
- source_word: ወወለደት ወልደ
  choice: und gebar einen Sohn
  rationale: Die kompakte, würdige Erzählform entspricht unmittelbar dem Sinn des geʿezischen Ausdrucks.
theological_decisions:
- issue: Handelnde Person bei der Eheschließung im Eröffnungssatz
  choice: Metuschelach nahm für seinen Sohn Lamech eine Frau
  alternative: Metuschelachs Sohn Lamech nahm eine Frau
  rationale: Die geʿezische Syntax legt am ehesten Metuschelach als Subjekt und Lamech als Begünstigten nahe. So bleibt die im Text erkennbare familiäre Vermittlung erhalten, ohne eine spätere Auslegung einzutragen.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Erzählton. Der erste Satz folgt der geʿezischen Satzstruktur, wird aber zur besseren deutschen Lesbarkeit vor dem Bericht über Schwangerschaft und Geburt geteilt. Die Namensform »Metuschelach« orientiert sich am üblichen deutschen Bibelgebrauch.
