base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/010.yaml
  text: 'And now[a], my father, hear me: a son has been born to Lamech my son, and his appearance and form are not like the form of a human being. His color is whiter than snow and redder than the blossom of a rose, and the hair of his head is whiter than white wool. And his eyes are like the rays of the sun[c][b]; and he opened his eyes and lit up the whole house.'
translation:
  language: de
  text: 'Und nun, mein Vater, hör mich an: Lamech, meinem Sohn, ist ein Sohn geboren worden, und sein Aussehen und seine Gestalt gleichen nicht der Gestalt eines Menschen. Seine Farbe ist weißer als Schnee und röter als eine Rosenblüte[a], und sein Haupthaar ist weißer als weiße Wolle. Seine Augen sind wie die Strahlen der Sonne[b]; und er öffnete seine Augen und erhellte das ganze Haus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Wort wird traditionell als „Rosenblüte“ verstanden, kann aber allgemeiner eine rote Blüte bezeichnen; die genaue Pflanzenart ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: 'Die ge''ezische Wendung ist schwierig. Gemeint ist jedenfalls ein Glanz wie der der Sonne; möglich ist auch: „wie Sonnenstrahlen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ስምዐኒ
  choice: hör mich an
  rationale: Der Imperativ mit Objektsuffix bezeichnet eine eindringliche Aufforderung. „Hör mich an“ klingt im heutigen Deutsch natürlich und bewahrt den dringlichen Ton.
- source_word: ተወልደ
  choice: ist … geboren worden
  rationale: Die perfektive Passivform meldet eine vollzogene Geburt mit gegenwärtiger Bedeutung; das deutsche Perfekt passt zum berichtenden Kontext.
- source_word: ዘአምሳሉ ወፍጥረቱ
  choice: sein Aussehen und seine Gestalt
  rationale: Die beiden Ausdrücke bezeichnen Ähnlichkeit beziehungsweise sichtbare Erscheinung und Formung. Die Paarung „Aussehen und Gestalt“ ist verständlich, ohne daraus eine Aussage über das Wesen des Kindes zu machen.
- source_word: ኢኮነ ከመ ፍጥረተ ሰብእ
  choice: gleichen nicht der Gestalt eines Menschen
  rationale: Die Formulierung hält den Vergleich mit menschlicher Gestalt eng am Ausgangstext und vermeidet die stärkere Behauptung, das Kind sei kein Mensch.
- source_word: ኅብሩ
  choice: seine Farbe
  rationale: Der Ausdruck verweist hier auf die sichtbare Färbung. „Farbe“ ist direkter als „Teint“ und lässt den ungewöhnlichen Vergleich mit Weiß und Rot bestehen.
- source_word: ይጸዐዳ እምአስኃትያ
  choice: weißer als Schnee
  rationale: Die klare Steigerung der Weiße wird unmittelbar wiedergegeben.
- source_word: ይቀይሕ እምጽጌ ረዳ
  choice: röter als eine Blüte
  rationale: Die Rotfärbung und der florale Vergleich sind deutlich, die genaue Pflanzenart ist jedoch unsicher. Daher bleibt der Haupttext allgemein.
- source_word: ጸጕረ ርእሱ
  choice: sein Haupthaar
  rationale: „Haupthaar“ ist eine knappe, würdige und genaue Wiedergabe des wörtlichen Ausdrucks „Haar seines Kopfes“.
- source_word: እምፀምር ጸዐዳ
  choice: weißer als weiße Wolle
  rationale: Die auffällige Wiederholung von „weiß“ wird als Intensivierung bewahrt.
- source_word: ከመ እግረን ለፀሐይ
  choice: wie die Strahlen der Sonne
  rationale: Die ge'ezische Wendung ist schwierig; im Kontext bezeichnet sie eindeutig solaren Glanz. „Strahlen der Sonne“ erhält das Bild, ohne es technisch zu verengen.
- source_word: ከሠተ አዕይንቲሁ ወአበርሀ ኵሎ ቤተ
  choice: er öffnete seine Augen und erhellte das ganze Haus
  rationale: Die aufeinanderfolgenden Verben werden als koordinierte Handlungen wiedergegeben; eine zeitliche Unterordnung wie „als“ oder „sobald“ wird nicht ergänzt.
theological_decisions:
- issue: Wie stark die Andersartigkeit des neugeborenen Kindes auszudrücken ist
  choice: sein Aussehen und seine Gestalt gleichen nicht der Gestalt eines Menschen
  alternative: er ist seinem Aussehen und seiner Gestalt nach kein Mensch
  rationale: Der Text schildert eine erstaunliche sichtbare Abweichung von gewöhnlicher menschlicher Gestalt. Die gewählte Fassung erhält diese Spannung, ohne daraus eine metaphysische Aussage über eine nichtmenschliche Natur abzuleiten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählton. Die Anrede „mein Vater“ und die parataktische Satzfolge bewahren den feierlichen Charakter. Die Wiederholung von „Gestalt“ sowie „weißer als weiße Wolle“ bleibt wegen ihrer formalen und rhetorischen Bedeutung erhalten.
