base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/106/014.yaml
  text: And they will commit sin[a], and they will transgress the ordinance; and they will join themselves with women and commit sin with them, and they will take wives from among them[c][b], and they will beget children.
translation:
  language: de
  text: Und sie werden Sünde begehen und die festgesetzte Ordnung übertreten; sie werden sich mit Frauen verbinden und mit ihnen sündigen; sie werden Frauen aus ihrer Mitte zu Ehefrauen nehmen und Kinder zeugen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይገብሩ፡ ኀጢአተ
  choice: Sünde begehen
  rationale: Die Verbindung aus dem Verb „tun/machen“ und „Sünde“ ist idiomatisch als „Sünde begehen“ wiederzugeben; die Wiederholung wird inhaltlich bewahrt.
- source_word: የኀልፉ፡ ሥርዐተ
  choice: die festgesetzte Ordnung übertreten
  rationale: Das Verb bezeichnet hier das Übertreten oder Verletzen einer Norm. „Festgesetzte Ordnung“ bewahrt die rechtlich-moralische Bedeutung, ohne vorschnell ein bestimmtes Gesetz zu benennen.
- source_word: ተደመሩ
  choice: sich verbinden
  rationale: Die Grundbedeutung des Sich-Anschließens oder Verbindens bleibt erhalten. Die im Kontext unerlaubte Verbindung wird deutlich, ohne das Verb unnötig zu sexualisieren.
- source_word: አንስት
  choice: Frauen
  rationale: Der allgemeine Ausdruck bezeichnet Frauen; „Ehefrauen“ wäre an dieser ersten Stelle zu spezifisch.
- source_word: አውሰቡ
  choice: zu Ehefrauen nehmen
  rationale: Das Verb bedeutet in diesem Zusammenhang heiraten beziehungsweise eine Frau zur Ehe nehmen; die frühere Deutung als „sich trennen“ ist lexikalisch nicht haltbar.
- source_word: ወይወልዱ፡ ውሉደ
  choice: und Kinder zeugen
  rationale: Die durch Überprüfung der Ausgabe wiederhergestellte Schlussklausel bezeichnet das Zeugen von Kindern; sie korrigiert die fehlerhafte OCR-Lesung mit der Wiederholung „von ihnen“.
theological_decisions:
- issue: Art der sündhaften Verbindung mit Frauen
  choice: Die breitere Formulierung „sich mit Frauen verbinden“ wird beibehalten und durch „mit ihnen sündigen“ moralisch eingeordnet.
  alternative: Die Verbindung ausdrücklich als Geschlechtsverkehr bezeichnen.
  rationale: Der Text wertet die Verbindung klar als Sünde, verwendet an dieser Stelle jedoch ein allgemeineres Verb des Verbindens. Die Übersetzung soll nicht expliziter sein als die Vorlage.
- issue: Heirat und Nachkommenschaft in der Schlussklausel
  choice: „Frauen aus ihrer Mitte zu Ehefrauen nehmen und Kinder zeugen“
  alternative: Die beschädigte OCR-Lesung wörtlich als Trennung beziehungsweise als wiederholtes „von ihnen“ wiedergeben.
  rationale: Die geprüfte Lesung der Charles-Ausgabe und die Bedeutung von አውሰቡ stützen eindeutig Heirat und das Zeugen von Kindern. Daher ist hier keine textkritische Ausweichformulierung nötig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem erzählerisch-apokalyptischem Ton. „Festgesetzte Ordnung“ vermeidet sowohl das altertümliche „Satzung“ als auch die theologisch engere Festlegung auf „Gesetz“. Keine Fußnoten sind erforderlich, da die jüngste Quellenprüfung die früheren OCR-bedingten Unsicherheiten auflöst.
