base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/016/001.yaml
  text: From the days of the slaughter and destruction and death of the giants[a], the spirits that have gone out from the souls of their flesh shall destroy without incurring judgment; thus they shall destroy until the day of the completion of the great judgment[d][c][b], when the great age shall be brought to its end.
translation:
  language: de
  text: Von den Tagen des Schlachtens, der Vernichtung und des Todes der Riesen[a] an werden die Geister, die aus den Seelen ihres Fleisches hervorgegangen sind[b], ohne Gericht Verderben anrichten. So werden sie Verderben anrichten bis zum Tag der Vollendung des großen Gerichts, wenn das große Zeitalter vollendet wird[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Anfang des Verses ist in der überlieferten Textgestalt schwierig. Gemeint ist offenbar die Zeit, die durch das Schlachten, die Vernichtung und den Tod der Riesen gekennzeichnet ist.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich und ungewöhnlich: „die aus den Seelen ihres Fleisches hervorgegangen sind“. Im Zusammenhang sind wahrscheinlich die körperlosen Geister gemeint, die mit den Nachkommen der Wächter verbunden sind.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „wenn die große Weltordnung ihre Vollendung erreicht“. Das äthiopische Wort kann sowohl „Zeitalter“ als auch „Welt“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እመዋዕለ
  choice: Seit den Tagen
  rationale: Die Verbindung bezeichnet einen zeitlichen Ausgangspunkt; „seit“ gibt zugleich den Beginn und die fortdauernde Wirkung natürlich wieder.
- source_word: ቀትል ወሙስና ወሞተ ረዓይት
  choice: des Schlachtens, der Vernichtung und des Todes der Riesen
  rationale: Die drei Katastrophenbegriffe bleiben als eindringliche Reihung erhalten; ረዓይት wird kontextuell und nach der griechischen Parallelüberlieferung als „Riesen“ verstanden.
- source_word: ወፅአ መናፍስት እምነፍሳት ሥጋሆሙ
  choice: die Geister, die aus den Seelen ihres Fleisches hervorgegangen sind
  rationale: Die ungewöhnliche Genitivfügung wird bewusst nicht zu „aus ihren Körpern“ geglättet, damit die konkrete, theologisch spannungsreiche Formulierung des Zeugen sichtbar bleibt.
- source_word: ዘያማስን
  choice: Verderben anrichten
  rationale: Das Verb bezeichnet schweres schädigendes und verwüstendes Wirken. Die deutsche Wendung bewahrt die Härte, ohne vorschnell vollständige Vernichtung zu behaupten.
- source_word: ዘእንበለ ኵነኔ
  choice: ohne Gericht
  rationale: Die knappe Formulierung bildet das Fehlen eines vollzogenen richterlichen Urteils ab und wahrt die mögliche Spannung zwischen „Gericht“, „Urteil“ und „Verurteilung“.
- source_word: እስከ ዕለተ ተፍጻሜት ኵነኔ ዐቢይ
  choice: bis zu dem Tag, an dem das große Gericht vollendet wird
  rationale: Die nominale Vorstellung der Vollendung bleibt erhalten, wird aber in gegenwärtigem, verständlichem Deutsch verbal formuliert.
- source_word: አመ ዓለም ዐቢይ ይትፌጸም
  choice: wenn das große Zeitalter an sein Ende kommt
  rationale: ዓለም kann „Zeitalter“ oder „Welt“ bedeuten. „Zeitalter“ passt zum eschatologischen Abschluss, ohne die Vernichtung der Schöpfung vorauszusetzen.
theological_decisions:
- issue: Identität der Geister
  choice: Die Geister gehen „aus den Seelen ihres Fleisches“ hervor; ihre genaue ontologische Bestimmung wird im Haupttext nicht weiter erklärt.
  alternative: Ausdrückliche Identifikation als körperlose Geister der getöteten Riesen.
  rationale: Der Kontext legt die Verbindung mit den Nachkommen der Wächter nahe, doch die schwierige äthiopische Formulierung soll nicht durch eine lehrhafte Präzisierung ersetzt werden.
- issue: Dauer und gerichtliche Einordnung ihres Wirkens
  choice: Sie richten bis zur Vollendung des großen Gerichts „ohne Gericht“ Verderben an.
  alternative: „ohne verurteilt zu werden“ oder „ungestraft“.
  rationale: „Ohne Gericht“ hält offen, ob das Fehlen eines Urteils, einer Verurteilung oder ihres Vollzugs gemeint ist, und bewahrt dadurch die Spannung des Wortlauts.
- issue: Bedeutung von ዓለም
  choice: Zeitalter
  alternative: Welt bzw. Weltordnung
  rationale: Die zeitliche Lesart fügt sich in die apokalyptische Rede von einer Vollendung; die sachlich mögliche räumlich-kosmische Lesart wird in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit apokalyptischem Ernst. Die Satzstruktur wurde für die Verständlichkeit behutsam gegliedert; schwierige Genitivfügung und eschatologische Mehrdeutigkeit bleiben sichtbar.
