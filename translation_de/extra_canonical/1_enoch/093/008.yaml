base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/008.yaml
  text: And after this[a], in the sixth week, all who are in it will be blind, and the hearts of all of them will forget wisdom. And in it a man will ascend, and at its completion the house of the kingdom will be burned with fire[d][c][b], and in it the whole stock of the chosen root will be scattered.
translation:
  language: de
  text: Und danach werden in der sechsten Woche alle, die in ihr sind, blind sein, und die Herzen aller werden die Weisheit vergessen. In ihr wird ein Mann emporsteigen[a], und an ihrem Ende wird das Haus des Königtums[b] mit Feuer verbrannt werden; und in ihr wird die ganze Sippe der erwählten Wurzel[c] zerstreut werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird ein Mann aufsteigen“ beziehungsweise „wird ein Mann auftreten“. Das Verb kann ein Hinaufsteigen wie auch einen Aufstieg oder ein Hervortreten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Haus des Königtums“ kann auch das Königshaus oder die königliche Ordnung und nicht nur ein bestimmtes Gebäude bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: „Sippe der erwählten Wurzel“ verbindet das Bild einer Abstammungslinie mit dem einer Pflanze; gemeint sein kann eine erwählte Linie oder ein erwählter Rest.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሳድስት ሰንበት
  choice: die sechste Woche
  rationale: Im Zusammenhang der Wochenapokalypse bezeichnet der Ausdruck eine symbolische Woche beziehungsweise Siebenerperiode, nicht einen einzelnen Sabbattag.
- source_word: ውስቴታ ጽሉላነ ኵሎሙ
  choice: alle, die in ihr leben, werden blind sein
  rationale: Die Wendung beschreibt die Menschen innerhalb der sechsten Woche als blind; die natürliche deutsche Formulierung bewahrt das wahrscheinlich geistlich-moralische Bild, ohne es auszudeuten.
- source_word: ይትረሣዕ ልቦሙ ለኵሎሙ እምጥበብ
  choice: ihrer aller Herzen werden die Weisheit vergessen
  rationale: Die bewusst bildhafte Formulierung folgt dem Gedanken, dass die Herzen die Weisheit vergessen, und erhält den Bezug zur Weisheitstradition.
- source_word: ባቲ የዓርግ ብእሲ
  choice: in ihr wird ein Mann emporsteigen
  rationale: „Emporsteigen“ wahrt sowohl die räumliche Bedeutung des Aufsteigens als auch die mögliche Bedeutung eines Hervortretens oder Aufstiegs, ohne die Person zu identifizieren.
- source_word: ቤተ መንግሥት
  choice: das Haus des Königtums
  rationale: Diese quellennähere Wiedergabe bewahrt die Offenheit zwischen einem Herrscherhaus, einer Dynastie und einer mit dem Königtum verbundenen Einrichtung.
- source_word: ይውዒ ... በእሳት
  choice: mit Feuer verbrannt werden
  rationale: Die Formulierung gibt das kraftvolle Gerichtsbild direkt und idiomatisch wieder.
- source_word: ኵሉ ዘመደ ሥርወ ኀሩይ
  choice: die ganze Nachkommenschaft der erwählten Wurzel
  rationale: „Nachkommenschaft“ erhält den genealogischen Sinn von ዘመድ, während „Wurzel“ das Pflanzenbild und „erwählt“ die Erwählungssprache bewahrt.
theological_decisions:
- issue: Identität des emporsteigenden Mannes
  choice: 'Die Person bleibt unbestimmt: „ein Mann wird emporsteigen“.'
  alternative: Ein bestimmter historischer Herrscher, eine priesterliche Gestalt oder eine messianische Gestalt wird auftreten beziehungsweise auffahren.
  rationale: Der ge'ezische Text nennt lediglich einen Mann. Eine genauere Identifizierung würde mehr festlegen, als der Vers selbst aussagt.
- issue: Bedeutung des Hauses des Königtums
  choice: Die mehrdeutige Wendung „Haus des Königtums“ bleibt erhalten.
  alternative: Königshaus, Dynastie, Palast oder ein mit dem Königtum verbundener Tempel.
  rationale: Der Ausdruck kann eine konkrete Stätte oder die königliche Ordnung beziehungsweise Linie bezeichnen; die Übersetzung entscheidet dies nicht vorzeitig.
- issue: Bedeutung der erwählten Wurzel
  choice: Das Bild bezeichnet eine erwählte Abstammungslinie, ohne einen späteren theologischen Bezug ausdrücklich festzulegen.
  alternative: Der erwählte Rest, eine erwählte Pflanze beziehungsweise Linie oder eine messianische Wurzel.
  rationale: Der Vers verbindet Erwählungs-, Abstammungs- und Pflanzenbilder, identifiziert die Wurzel aber nicht ausdrücklich mit einer einzelnen Person.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit quellennaher apokalyptischer Bildsprache. Die ungewöhnlichen Bilder von den vergessenden Herzen, dem Haus des Königtums und der erwählten Wurzel bleiben bewusst erhalten; Fußnoten erläutern echte Mehrdeutigkeiten.
