base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/005.yaml
  text: And after this[a], in the third week, at its completion, a man shall be chosen as the plant of righteous judgment[c][b], and after him there shall come forth the plant of righteousness forever and ever.
translation:
  language: de
  text: Und danach wird in der dritten Woche[a], bei ihrem Abschluss, ein Mann[b] als Pflanze des gerechten Gerichts[c] erwählt werden; und nach ihm wird die Pflanze der Gerechtigkeit für immer und ewig hervorgehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die „dritte Woche“ gehört zur symbolischen Abfolge der Wochenapokalypse; gemeint ist keine wörtliche Woche von sieben Tagen.
    reason: cultural_note
  - marker: b
    text: Der erwählte „Mann“ wird im Text nicht identifiziert. Ausleger haben ihn mit verschiedenen bedeutenden gerechten Gestalten verbunden, doch der Vers selbst nennt keinen Namen.
    reason: alternative_reading
  - marker: c
    text: Das Pflanzenbild kann auf eine gerechte Linie, auf Wachstum oder auf eine fortbestehende Gemeinschaft hinweisen. Die Übersetzung bewahrt die Metapher, ohne ihre Bedeutung festzulegen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሣልስት ሰንበት
  choice: in der dritten Woche
  rationale: Im Zusammenhang der Wochenapokalypse bezeichnet der Ausdruck eine symbolische Siebenerperiode, nicht einen einzelnen Sabbattag. „Woche“ bewahrt das Gliederungsschema des Textes.
- source_word: በተፍጻሜታ
  choice: bei ihrem Abschluss
  rationale: Das Suffix verweist auf die dritte Woche. Die Formulierung bezeichnet das Ende dieser symbolischen Periode und klingt im Deutschen natürlich und würdig.
- source_word: ይትኃረይ
  choice: wird … erwählt werden
  rationale: Die passive Bedeutung „erwählt werden“ gibt den Gedanken einer herausgehobenen, ausgewählten Gestalt wieder, ohne ein bestimmtes Amt vorauszusetzen.
- source_word: ብእሲ
  choice: ein Mann
  rationale: Das Substantiv bezeichnet hier eine einzelne männliche Person. Die unbestimmte Wiedergabe wahrt, dass der Text sie nicht namentlich identifiziert.
- source_word: ለተክለ
  choice: als Pflanze
  rationale: Die schwierige Konstruktion wird entsprechend dem klaren Pflanzenbild wiedergegeben. „Pflanze“ bleibt bewusst weiter als „Spross“ und legt nicht fest, ob Person, Linie oder Gemeinschaft gemeint ist.
- source_word: ኵነኔ ጽድቅ
  choice: gerechten Gerichts
  rationale: Die Formulierung bewahrt sowohl den gerichtlichen als auch den moralischen Bedeutungsanteil und lässt die attributive beziehungsweise genitivische Beziehung knapp stehen.
- source_word: ይወፅእ
  choice: wird … hervorgehen
  rationale: Das Verb bedeutet „herauskommen/hervorgehen“. „Hervorgehen“ passt zum Motiv des Entstehens, ohne das Pflanzenbild durch „hervorsprießen“ zusätzlich auszudeuten.
- source_word: ለተክለ ጽድቅ
  choice: die Pflanze der Gerechtigkeit
  rationale: Die konkrete Pflanzenmetapher und die genitivische Beziehung bleiben erhalten; eine Deutung als Nachkommenschaft, Linie oder Gemeinschaft wird nicht in den Haupttext eingetragen.
- source_word: ለዓለመ ዓለም
  choice: für immer und ewig
  rationale: Die verdoppelte Zeitalterformel ist eine emphatische Wendung für unbegrenzte Dauer. Die gewählte deutsche Formulierung ist geläufig und bewahrt den Nachdruck.
theological_decisions:
- issue: Identität des am Ende der dritten Woche erwählten Mannes
  choice: 'Die Gestalt bleibt im Haupttext unbestimmt: „ein Mann“.'
  alternative: Enoch, Noah, Abraham oder ein repräsentativer gerechter Führer
  rationale: Der Vers nennt keinen Namen. Eine Identifizierung würde eine Auslegung in die Übersetzung eintragen und die echte Offenheit des Textes beseitigen.
- issue: Bedeutung des Pflanzenbildes
  choice: Die landwirtschaftliche Metapher wird in beiden Aussagen als „Pflanze“ bewahrt.
  alternative: Geschlecht, Wurzel, Nachkommenschaft oder Gemeinschaft
  rationale: Das Ge’ez verwendet ausdrücklich ein Pflanzenbild. Eine abstraktere Wiedergabe würde die apokalyptische Symbolik verflachen und vorzeitig entscheiden, worauf sie verweist.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die Satzstruktur wahrt die zeitliche Abfolge und die parallele Pflanzenmetaphorik, ohne die unklare Identität des Mannes oder die Reichweite des Bildes konfessionell festzulegen.
