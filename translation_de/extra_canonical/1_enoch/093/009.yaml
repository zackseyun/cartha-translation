base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/009.yaml
  text: And after this[a], in the seventh week, an apostate generation will arise, and many will be its deeds[b], and all its deeds will be apostasy.
translation:
  language: de
  text: Und danach wird in der siebten Woche[a] eine abtrünnige Generation aufstehen; ihre Taten werden zahlreich sein, und alle ihre Taten werden Abfall sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann der Ausdruck „siebter Sabbat“ beziehungsweise „siebte Woche“ bedeuten. In diesem Abschnitt bezeichnet er die symbolische Wochenperiode der Geschichtsvision, nicht einen einzelnen Tag.
    reason: cultural_note
  - marker: b
    text: Das letzte Wort kann auch mit „Irrtum“, „Verkehrtheit“ oder „Auflehnung“ wiedergegeben werden. „Abfall“ bewahrt hier den religiösen Nachdruck der Aussage.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሳብዕት ሰንበት
  choice: in der siebten Woche
  rationale: Im Zusammenhang der Wochenapokalypse bezeichnet ሰንበት einen symbolischen, siebenfach gegliederten Geschichtszeitraum und nicht einen einzelnen Sabbattag. „Woche“ bewahrt die Bildstruktur und ist im Deutschen unmittelbar verständlich.
- source_word: ትትነሣእ
  choice: wird … aufstehen
  rationale: Das Verb bezeichnet das Sich-Erheben oder Hervortreten. „Aufstehen“ erhält das konkrete Bild des Ausgangstextes; „wird auftreten“ wäre möglich, aber weniger bildhaft.
- source_word: ትውልድ
  choice: Generation
  rationale: Der Ausdruck kann Generation, Geschlecht oder Nachkommenschaft bezeichnen. Hier geht es um eine geschichtliche Menschengruppe innerhalb des Wochenschemas, wofür „Generation“ am klarsten ist.
- source_word: ዕሉት
  choice: abtrünnige
  rationale: Das Wort bezeichnet ein Abweichen oder Abirren vom Rechten. „Abtrünnig“ bewahrt den religiös-moralischen Nachdruck, ohne die Aussage auf bloße allgemeine Bosheit zu reduzieren.
- source_word: ብዙኅ
  choice: zahlreich
  rationale: Das Wort bezeichnet Vielheit oder Fülle und steht prädikativ zu den Taten. „Ihre Taten werden zahlreich sein“ bildet diese Struktur in natürlichem Deutsch nach.
- source_word: ምግባራቲሃ
  choice: ihre Taten
  rationale: Der Ausdruck bezeichnet Handlungen oder Werke. „Taten“ ist verständlich und behält im Gerichtszusammenhang das moralische Gewicht.
- source_word: ዕልወት
  choice: Abfall
  rationale: Das Abstraktum entspricht inhaltlich dem Adjektiv ዕሉት und kann Abirrung, Verkehrtheit, Auflehnung oder religiösen Abfall bezeichnen. „Abfall“ bewahrt hier die religiöse Schärfe und die Verbindung zur „abtrünnigen Generation“.
theological_decisions:
- issue: Allgemein moralische Verderbtheit oder religiös geprägter Abfall der Generation
  choice: abtrünnige Generation … alle ihre Taten werden Abfall sein
  alternative: verkehrte Generation … alle ihre Taten werden Verkehrtheit sein
  rationale: Das Wortpaar ዕሉት und ዕልወት weist auf Abweichung beziehungsweise Abfall hin. Die gewählte Fassung erhält diese religiös-moralische Spannung, ohne einen bestimmten historischen oder konfessionellen Bezug festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der dreigliedrigen Aussage des Ausgangstextes; das Semikolon hält die enge Verbindung der Aussagen fest. „Generation“ ist gegenwärtig verständlicher als das mehrdeutige „Geschlecht“.
