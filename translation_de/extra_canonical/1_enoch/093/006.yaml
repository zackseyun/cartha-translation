base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/006.yaml
  text: And after this[a], in the fourth week, at its completion, visions of the holy and righteous shall be seen[c][b], and a law for generation after generation and an enclosure shall be made for them.
translation:
  language: de
  text: Und danach werden in der vierten Woche, an ihrem Ende, Visionen der Heiligen und Gerechten[a] zu sehen sein, und ein Gesetz für Generation um Generation sowie eine Einfriedung[b] werden für sie geschaffen werden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Visionen heiliger und gerechter Menschen“ oder „Visionen der Heiligen und der Gerechten“. Der genaue Bezug der substantivischen Ausdrücke bleibt im apokalyptischen Zusammenhang offen.'
    reason: lexical_alternative
  - marker: b
    text: Das letzte Substantiv ist schwierig. Es kann an etwas Umhegtes, Gepflanztes oder für sie Bereitetes denken lassen; möglich wären etwa „Garten“ oder „Pflanzung“.
    reason: lexical_alternative
  - marker: c
    text: „Gesetz“ kann hier auch weiter als „Ordnung“ oder „Satzung“ verstanden werden. Das eine Verb am Satzende bezieht sich wahrscheinlich sowohl auf das Gesetz als auch auf die Einfriedung.
    reason: textual_and_syntactic_clarification
lexical_decisions:
- source_word: እምድኅረዝ
  choice: danach
  rationale: Bewahrt die zeitliche Abfolgeformel knapp und natürlich.
- source_word: ራብዕት ሰንበት
  choice: die vierte Woche
  rationale: Im Kontext der Wochenapokalypse bezeichnet der Ausdruck eine symbolische Woche beziehungsweise Siebenerperiode, nicht einen einzelnen Sabbattag.
- source_word: በተፍጻሜታ
  choice: an ihrem Ende
  rationale: Das Suffix verweist auf die vierte Woche; die Wendung bezeichnet deren Abschluss.
- source_word: ራእያተ
  choice: Visionen
  rationale: Gibt den apokalyptischen Sinn visionärer Schauungen wieder.
- source_word: ቅዱሳን ወጻድቃን
  choice: der Heiligen und Gerechten
  rationale: Die substantivisch gebrauchten Plurale bleiben als zwei verbundene Bezeichnungen erhalten; die Formulierung lässt den genauen Bezug offen.
- source_word: ይትረአይ
  choice: werden gesehen werden
  rationale: Bewahrt die passive beziehungsweise medial-reflexive Aussage und legt nicht fest, ob die Visionen gewährt werden oder sichtbar hervortreten.
- source_word: ሥርዐት
  choice: ein Gesetz
  rationale: Im historischen Schema der vierten Woche und in der Parallelität des Abschnitts ist die normative Bedeutung wahrscheinlich; dennoch bleibt der weitere Bedeutungsraum von Ordnung oder Satzung in einer Fußnote sichtbar.
- source_word: ለትውልደ ትውልድ
  choice: für Generation um Generation
  rationale: Gibt die Wiederholung des Nomens und damit die Fortdauer über aufeinanderfolgende Generationen wieder.
- source_word: ዐጸድ
  choice: eine Einfriedung
  rationale: Der schwierige Ausdruck kann etwas Umhegtes oder Gepflanztes bezeichnen. „Einfriedung“ bewahrt das konkrete Bild, ohne Garten oder Pflanzung festzulegen.
- source_word: ይትገበር ሎሙ
  choice: werden für sie geschaffen werden
  rationale: Das einmal gesetzte passive Verb wird auf beide koordinierten Nominalglieder bezogen; der Plural ist im Deutschen wegen des zusammengesetzten Subjekts erforderlich.
theological_decisions:
- issue: Identität der Heiligen und Gerechten
  choice: Die Hauptfassung lässt die Gruppe in apokalyptischer Offenheit stehen.
  alternative: heilige und gerechte Menschen; himmlische Heilige; eine gemischte Gruppe
  rationale: Der historische Zusammenhang und „Gerechte“ sprechen eher für Menschen, doch der Ausdruck selbst erzwingt diese Eingrenzung nicht.
- issue: Bedeutung von ሥርዐት
  choice: Gesetz
  alternative: Ordnung oder Satzung
  rationale: Die vierte Woche wird gewöhnlich mit der Sinai-Epoche verbunden, und die Parallelität im Abschnitt stützt die gesetzliche Bedeutung. Die lexikalische Weite wird jedoch nicht verschwiegen.
- issue: Bezug des Schlussverbs
  choice: Das eine Verb regiert sowohl „Gesetz“ als auch „Einfriedung“.
  alternative: Das Verb bei beiden Gliedern ausdrücklich wiederholen
  rationale: Die geʿezische Syntax bietet nur ein Schlussverb; die gemeinsame Zuordnung wird daher auch in der deutschen Hauptfassung bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst erhaltener apokalyptischer Bildsprache. Futur und Passiv spiegeln die Form des Ausgangstextes; „Generation um Generation“ erhält dessen feierliche Wiederholung.
