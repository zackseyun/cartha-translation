base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/012.yaml
  text: And who is there that can behold heaven? And who is there that can understand the works of heaven? Or see a soul—or[a], if not[e][d][c][b], a spirit—and tell of it? Or else ascend and see all their ends?
translation:
  language: de
  text: Und wer ist es, der den Himmel schauen kann? Und wer ist es, der das Wirken des Himmels erkennen kann? Oder wie könnte jemand eine Seele sehen – oder, wenn nicht, einen Geist[a] – und davon berichten? Oder aber hinaufsteigen und alle ihre Enden sehen?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „eine Seele sehen – oder, wenn nicht, einen Geist“ ist sprachlich und inhaltlich schwierig. Auch „Leben“ und „Atem“ sind als Wiedergaben der beiden Wörter möglich. Der Wortlaut wird hier nicht zu einer bestimmten Lehre über Seele und Geist geglättet.
    reason: textual_variant
  - marker: b
    text: Der letzte Ausdruck ist unsicher. Er kann „alle ihre Enden/äußersten Bereiche“ bedeuten; wörtlich kommt auch „alle ihre Flügel“ infrage.
    reason: lexical_alternative
lexical_decisions:
- source_word: ምነት ውእቱ ዘይክል
  choice: wer ist es, der … kann?
  rationale: Gibt die wiederholte rhetorische Frage und den Ausdruck der Fähigkeit in natürlichem, würdigem Deutsch wieder.
- source_word: ነጽሮተ ሰማይ
  choice: den Himmel schauen
  rationale: ነጽሮተ ist hier als Verbalform zu ነጸረ, „schauen/betrachten“, zu verstehen; der revidierten Quellenprüfung folgend wird kein im Text nicht vorhandenes „Vorratshaus“ eingeführt.
- source_word: አእምሮ ግብረ ሰማይ
  choice: das Wirken des Himmels erkennen
  rationale: „Wirken“ bewahrt den kosmischen Bezug von ግብር und klingt im Deutschen natürlicher als „Taten des Himmels“; „erkennen“ gibt die Wahrnehmungs- und Wissenskomponente wieder.
- source_word: ከመ ይርአይ ነፍሰ
  choice: wie könnte er eine Seele sehen
  rationale: Bewahrt die auffällige konkrete Rede vom Sehen einer Seele, ohne sie anthropologisch auszudeuten oder zu glätten.
- source_word: መንፈሰ
  choice: einen Geist
  rationale: Unterscheidet den Begriff von ነፍስ („Seele“); „Atem“ wäre lexikalisch möglich, ist in diesem Zusammenhang jedoch weniger naheliegend.
- source_word: ይክል ነጊረ
  choice: davon berichten
  rationale: Gibt die Fähigkeit wieder, das Wahrgenommene mitzuteilen, und vermeidet im Deutschen eine unnötig altertümliche Formulierung.
- source_word: ወእመ አኮ ዐሪገ
  choice: oder sonst hinaufsteigen
  rationale: Versteht እመ አኮ als feste Wendung „oder (sonst)“ und setzt die Reihe unmöglicher menschlicher Handlungen fort, statt die Aussage als negierte Bedingung misszuverstehen.
- source_word: ኵሎ አክናፊሆሙ
  choice: alle ihre Enden
  rationale: Die schwierige Schlusswendung kann Extremitäten, äußerste Enden oder wörtlich Flügel bezeichnen. „Enden“ hält den räumlichen Sinn offen; die Unsicherheit wird in einer Fußnote kenntlich gemacht.
theological_decisions:
- issue: Verhältnis von ነፍስ und መንፈስ
  choice: Die beiden Wörter werden getrennt als „Seele“ und „Geist“ wiedergegeben.
  alternative: „Leben“ und „Atem“ oder eine Zusammenfassung beider Begriffe zu einem einzigen anthropologischen Konzept.
  rationale: Der Ausgangstext stellt zwei verwandte, aber unterschiedliche Begriffe nebeneinander. Die Übersetzung bewahrt diese Spannung, ohne daraus eine bestimmte Lehre über die Bestandteile des Menschen abzuleiten.
- issue: Menschliche Erkenntnis himmlischer Wirklichkeit
  choice: Die Aussagen bleiben rhetorische Fragen über die Grenzen menschlichen Schauens und Erkennens.
  alternative: Die Fragen als absolute dogmatische Behauptung oder als Beschreibung einer bestimmten Himmelsreise auslegen.
  rationale: Die Form des Textes fordert keine weitergehende systematische Deutung; daher wird die offene rhetorische Gestalt erhalten.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, apokalyptischem Ton. Die wiederholten rhetorischen Fragen bleiben klar erkennbar. Ungewohnte Bilder und die schwierige Gegenüberstellung von Seele und Geist werden nicht konfessionell oder spekulativ aufgelöst.
