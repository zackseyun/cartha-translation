base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/011.yaml
  text: For who among all the children of men is able to hear the voice of the Holy One and not be shaken? And who is able to comprehend his thoughts? And who is able to look upon all the works of heaven?[a][b][c]
translation:
  language: de
  text: Denn wer unter allen Menschenkindern vermag die Stimme des Heiligen[a] zu hören, ohne erschüttert zu werden? Und wer vermag seine Gedanken zu erfassen?[b] Und wer vermag alle Werke des Himmels zu schauen?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das entsprechende ge’ezische Wort kann „Stimme“, „Wort“ oder „Rede“ bedeuten. Wegen des Verbs „hören“ steht hier „Stimme“.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher etwa: „seine Gedanken zu denken“. Das Pronomen kann auf den Heiligen bezogen werden; möglich ist auch eine Auffassung im Sinn von: „mit seinem Denken zu begreifen“.'
    reason: textual_ambiguity
  - marker: c
    text: „Die Werke des Himmels“ kann umfassend die Vorgänge, Ordnungen und Erscheinungen des Himmels bezeichnen, nicht nur sichtbare Gegenstände.
    reason: cultural_note
lexical_decisions:
- source_word: እስመ
  choice: Denn
  rationale: Leitet eine begründende oder erläuternde Aussage ein und bewahrt den rhetorischen Anschluss.
- source_word: ውሉደ ሰብእ
  choice: Menschenkinder
  rationale: Bewahrt die semitisch geprägte Bezeichnung für die Menschheit in einem würdigen, im Deutschen verständlichen Ausdruck.
- source_word: ዘይክል
  choice: vermag
  rationale: Gibt die dreimal wiederholte Aussage über menschliches Unvermögen knapp und gehoben wieder.
- source_word: ሰሚዐ ቃሉ ለቅዱስ
  choice: die Stimme des Heiligen zu hören
  rationale: ቃል kann Stimme, Wort oder Rede bezeichnen; in Verbindung mit „hören“ ist „Stimme“ natürlich. „Der Heilige“ wird als göttlicher Titel verstanden.
- source_word: ወኢይትሀወክ
  choice: ohne erschüttert zu werden
  rationale: Bezeichnet innere Beunruhigung oder Erschütterung und lässt deren genaue emotionale Ausprägung offen.
- source_word: ከመ የሐሊ ኅሊናሁ
  choice: seine Gedanken zu erfassen
  rationale: Gibt den Gedanken des geistigen Erfassens natürlich wieder. Das Possessivpronomen bewahrt im Deutschen die mögliche Bezugsoffenheit zwischen den Gedanken des Heiligen und dem menschlichen Denken.
- source_word: ነጽሮተ
  choice: zu schauen
  rationale: Passt zum visionär-apokalyptischen Register und ist würdiger als das schlichte „sehen“, ohne altertümlich zu wirken.
- source_word: ምግባረ ሰማይ
  choice: die Werke des Himmels
  rationale: Bewahrt den weiten Sinn von Taten, Werken, Vorgängen oder geordneten Erscheinungen des Himmels, ohne ihn vorschnell einzuengen.
theological_decisions:
- issue: Wiedergabe von ለቅዱስ als göttlicher Titel
  choice: des Heiligen
  alternative: des heiligen [Wesens]
  rationale: Der Zusammenhang beschreibt einen transzendenten Sprecher, dessen Stimme Menschen erschüttert. Die substantivierte und großgeschriebene Form kennzeichnet den Titel, ohne eine spätere christologische Deutung einzutragen.
- issue: Bezug von „seine Gedanken“
  choice: Die pronominale Offenheit im Haupttext bleibt erhalten.
  alternative: „die Gedanken des Heiligen“ oder „mit seinem Denken zu begreifen“
  rationale: Die Formulierung kann auf die Gedanken des zuvor genannten Heiligen bezogen werden; eine stärker anthropologische Lesart ist in der Überlieferung und Übersetzungsgeschichte ebenfalls vertreten. Der Haupttext entscheidet diese Spannung nicht stillschweigend, die Fußnote erläutert sie.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusstem rhetorischem Parallelismus. „Vermag“ und „schauen“ tragen den apokalyptischen Ton, bleiben aber allgemein verständlich. Die drei Fragen und die Wiederholung werden entsprechend der Vorlage bewahrt.
