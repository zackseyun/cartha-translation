base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/003.yaml
  text: And now Enoch began to speak from the books[a], and he said, “I was born the seventh in the first week[d][c][b], while righteousness and justice still endured.”
translation:
  language: de
  text: 'Und nun begann Henoch, aus den Büchern[a] zu sprechen, und sagte: »Ich wurde als Siebter in der ersten Woche[b] geboren, als Gericht[c] und Gerechtigkeit noch Bestand hatten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Aus den Büchern« stellt Henoch wahrscheinlich als jemanden dar, der aus schriftlichen Aufzeichnungen vorliest oder sie wiedergibt, nicht lediglich spontan spricht.
    reason: cultural_note
  - marker: b
    text: Die »erste Woche« ist eine symbolische Geschichtsperiode innerhalb der sogenannten Wochenapokalypse und nicht notwendig eine wörtliche Woche von sieben Tagen.
    reason: cross_reference
  - marker: c
    text: Die hier zugrunde gelegte Lesart lautet wahrscheinlich »Gericht«. Die im transkribierten Text stehende Form ist offenbar fehlerhaft erkannt worden; bei Beibehaltung dieser Form wären auch Wiedergaben wie »Aufrichtigkeit« oder »Wahrheit« erwogen worden.
    reason: textual_variant
lexical_decisions:
- source_word: አኀዘ፡ እንከ፡ ይትናገር
  choice: Und nun begann … zu sprechen
  rationale: Die Wendung bezeichnet den Beginn einer Rede und markiert zugleich einen neuen Abschnitt; die deutsche Form ist natürlich und wahrt den Erzählfluss.
- source_word: እመጻሕፍት
  choice: aus den Büchern
  rationale: Die Präposition bezeichnet am ehesten die Quelle der Rede. Die Formulierung lässt offen, ob Henoch vorliest oder schriftliche Aufzeichnungen rezitiert.
- source_word: አነ፡ ሳብዕ፡ ተወለድኩ
  choice: Ich wurde als der Siebte … geboren
  rationale: Das Ordinalzahlwort kennzeichnet Henoch als siebtes Glied einer Abfolge, wahrscheinlich der Generationen seit Adam.
- source_word: በቀዳሚት፡ ሰንበት
  choice: in der ersten Woche
  rationale: Im literarischen Zusammenhang der Wochenapokalypse bezeichnet der Ausdruck eine symbolische Geschichtsperiode, nicht bloß einen einzelnen Sabbattag.
- source_word: እስከ፡ አመ
  choice: als … noch
  rationale: Im rückblickenden historischen Zusammenhang gibt die Wendung eine gleichzeitig fortbestehende Lage wieder. Die frühere futurische Deutung »bis zu der Zeit, da« passt hier weniger gut.
- source_word: ኵነኔ
  choice: Gericht
  rationale: Die überlieferte OCR-Form ጽጌነ beruht nach der kritischen Prüfung wahrscheinlich auf einer Verkennung von ኵነኔ, das »Gericht« oder »Urteil« bedeutet.
- source_word: ጽድቅ
  choice: Gerechtigkeit
  rationale: Dies ist die übliche und kontextuell passende Wiedergabe des zentralen ethischen Begriffs.
- source_word: ትዓገሠ
  choice: noch Bestand hatten
  rationale: Das Verb beschreibt hier im historischen Rückblick einen fortdauernden Zustand; die idiomatische deutsche Wendung erhält diesen durativen Sinn.
theological_decisions:
- issue: Bedeutung der »ersten Woche«
  choice: symbolische erste Geschichtsperiode
  alternative: wörtliche Siebentagewoche oder erster Sabbat
  rationale: Der Abschnitt gliedert die Geschichte in symbolische Wochen. »Woche« bewahrt diese literarische Struktur, ohne eine konkrete Dauer festzulegen.
- issue: Unsichere ethische Begriffspaarung am Versende
  choice: Gericht und Gerechtigkeit
  alternative: Aufrichtigkeit und Gerechtigkeit; Gerechtigkeit und Recht
  rationale: Die im bereitgestellten Text stehende Form ist offenbar durch OCR beschädigt. Die kritisch rekonstruierte Lesart ኵነኔ spricht für »Gericht«. Eine Fußnote macht die textliche Unsicherheit sichtbar, statt sie stillschweigend zu beseitigen.
- issue: Zeitbezug des Schlusssatzes
  choice: vergangener, während Henochs Geburt noch andauernder Zustand
  alternative: zukünftiges Andauern bis zu einem späteren Zeitpunkt
  rationale: Der historische Rückblick und die revidierte Quellenprüfung stützen die durative Vergangenheitsdeutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Als der Siebte« ist für gewöhnliche Leser verständlich, ohne die vermutete Generationenfolge ausdrücklich in den Haupttext einzutragen. Die Satzstellung folgt dem erzählenden Ton des Originals; die direkte Rede verwendet deutsche Anführungszeichen.
