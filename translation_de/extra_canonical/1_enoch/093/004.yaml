base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/004.yaml
  text: And after me[a], in the second week, great evil shall arise, and deceit shall spring up in it. And in it there shall be the first end, and in it a man shall be saved; and after it has been completed, unrighteousness shall grow[d][c][b], and a law shall be made for the sinners.
translation:
  language: de
  text: Und nach mir wird in der zweiten Woche[a] großes Böses aufkommen, und in ihr wird Falschheit aufkeimen. In ihr wird das erste Ende eintreten, und in ihr wird ein Mann gerettet werden[b]. Nachdem sie vollendet ist, wird das Unrecht zunehmen, und für die Sünder wird ein Gesetz erlassen werden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die „zweite Woche“ gehört zur symbolischen Wochengliederung dieser Geschichtsschau und bezeichnet nicht notwendig einen Zeitraum von sieben Tagen.
    reason: cultural_note
  - marker: b
    text: 'Wörtlich steht hier die Einzahl: „ein Mann“. Häufig wird darin eine Anspielung auf Noah gesehen, doch der Vers nennt ihn nicht.'
    reason: cross_reference
  - marker: c
    text: 'Oder: „eine Satzung“ beziehungsweise „eine Ordnung wird für die Sünder geschaffen“. Die Formulierung kann eine Regelung für, über oder möglicherweise gegen Sünder meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይቀውም
  choice: wird … aufkommen
  rationale: Das Verb kann „stehen“, „sich erheben“ oder „auftreten“ bedeuten. „Aufkommen“ gibt hier natürlich das Entstehen eines geschichtlichen Zustands wieder.
- source_word: በካልእት ሰንበት
  choice: in der zweiten Woche
  rationale: Die wörtliche Zeitangabe wird beibehalten; im Kontext bezeichnet „Woche“ einen symbolischen Geschichtsabschnitt.
- source_word: ዐቢይ እኩይ
  choice: großes Böses
  rationale: Bewahrt die schroffe moralische Aussage, ohne sie enger als „Bosheit“ oder „Verbrechen“ festzulegen.
- source_word: ትሕሱት በቀለት
  choice: Falschheit aufkeimen
  rationale: „Falschheit“ deckt Lüge und Täuschung ab; „aufkeimen“ erhält das organische Bild des Verbs für Sprießen oder Wachsen.
- source_word: ቀዳሚት ፍጻሜ
  choice: das erste Ende
  rationale: Die auffällige apokalyptische Formulierung wird formal bewahrt, statt sie deutend als „erste Vollendung“ umzuschreiben.
- source_word: ይድኅን ብእሲ
  choice: ein Mann gerettet werden
  rationale: Der ausdrücklich singularische Mensch wird beibehalten; die Übersetzung identifiziert ihn nicht eigenmächtig mit Noah.
- source_word: ትእህቱ ዓመፃ
  choice: das Unrecht zunehmen
  rationale: Die überlieferte Stelle ist textlich schwierig. „Unrecht“ hält das Bedeutungsspektrum moralischer Verkehrtheit offen, während „zunehmen“ den Wachstumssinn wiedergibt.
- source_word: ሥርዐት ይትገበር ለኃጥኣን
  choice: für die Sünder wird ein Gesetz erlassen werden
  rationale: „Gesetz“ gibt Ordnung, Satzung oder Regel wieder. „Für“ wahrt die mehrdeutige Beziehung zu den Sündern, ohne sie vorschnell als „gegen“ zu bestimmen.
theological_decisions:
- issue: Identität des geretteten Mannes
  choice: Die Einzahl bleibt erhalten, ohne den Mann im Haupttext zu benennen.
  alternative: Den Mann ausdrücklich als Noah identifizieren oder kollektiv von der Rettung der Menschheit sprechen.
  rationale: Der Zusammenhang kann an Noah denken lassen, doch der Vers selbst nennt ihn nicht. Die textliche Zurückhaltung und die mögliche Anspielung bleiben gewahrt.
- issue: Bedeutung des Gesetzes für die Sünder
  choice: „Für die Sünder“ bleibt als offene Verhältnisbestimmung stehen.
  alternative: „Gegen die Sünder“ oder deutend „ein Gericht über die Sünder“.
  rationale: Das Ge’ez kann eine Ordnung für, bezüglich oder möglicherweise gegen Sünder bezeichnen. Eine eindeutig strafende Deutung wäre enger als der Wortlaut.
- issue: Das „erste Ende“
  choice: Die schwer deutbare Wendung wird wörtlich als „das erste Ende“ wiedergegeben.
  alternative: „die erste Vollendung“ oder „der erste Abschluss“.
  rationale: Die apokalyptische Spannung zwischen Ende und Vollendung soll nicht durch eine harmonisierende Auslegung beseitigt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Wendung „in ihr“ erhält die schematische Struktur der apokalyptischen Geschichtsschau. Ungewohnte Ausdrücke wie „das erste Ende“ werden bewusst nicht geglättet, weil ihre Mehrdeutigkeit zum Ausgangstext gehört.
