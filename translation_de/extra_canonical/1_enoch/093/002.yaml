base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/002.yaml
  text: And Enoch said[a], “Concerning the children of righteousness, and concerning the chosen of the world, and concerning the plant of uprightness, I will speak to you and make known to you, my children—I, Enoch—what was shown to me from a vision of heaven, and what I learned from the words of the holy angels[e][d][c][b], and understood from the tablets of heaven.”
translation:
  language: de
  text: '**1 Henoch 93,2**


    Und Henoch sagte: »Über die Kinder der Gerechtigkeit, über die Erwählten der Welt[a] und über die Pflanze der Rechtschaffenheit will ich zu euch sprechen und euch kundtun, meine Kinder – ich, Henoch –, was mir aus einer Vision des Himmels gezeigt wurde, was ich aus dem Wort der heiligen Engel erfuhr und was ich aus den Tafeln des Himmels[b] verstand.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die Erwählten des Zeitalters« beziehungsweise »der Weltordnung«; ዓለም kann sowohl die Welt als auch ein Zeitalter bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die »Tafeln des Himmels« sind ein in Henoch häufiges Bild für himmlische Aufzeichnungen; die Wendung kann allgemeiner auch als »Schriften« oder »Bücher des Himmels« verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ውሉደ፡ ጽድቅ
  choice: Kinder der Gerechtigkeit
  rationale: Bewahrt sowohl das familiäre Bild als auch die Genitivverbindung und ersetzt die Wendung nicht verallgemeinernd durch »die Gerechten«.
- source_word: ኅሩያነ፡ ዓለም
  choice: Erwählte der Welt
  rationale: Gibt die äthiopische Wendung transparent wieder. »Erwählte« ist im heutigen Deutsch verständlich, während die mögliche Bedeutung von ዓለም als »Zeitalter« in einer Fußnote erhalten bleibt.
- source_word: ተክለ፡ ርትዕ
  choice: Pflanze der Geradheit
  rationale: Erhält das konkrete pflanzliche Bild und unterscheidet ርትዕ sprachlich von der zuvor genannten ጽድቅ, ohne beide Ausdrücke vorschnell gleichzusetzen.
- source_word: እሎንተ፡ እብለክሙ፡ ወአየድዐክሙ
  choice: will ich zu euch sprechen und euch kundtun
  rationale: Bildet die beiden Verben als Sprechen und offenbarendes Bekanntmachen ab; die folgende Was-Konstruktion liefert den inhaltlichen Bezug.
- source_word: ደቂቅየ
  choice: meine Kinder
  rationale: Natürliches modernes Deutsch für die direkte familiäre Anrede, ohne sie auf männliche Nachkommen zu beschränken.
- source_word: እምራእየ፡ ሰማይ
  choice: aus einer Vision des Himmels
  rationale: Die Präposition እም wird als Herkunftsangabe »aus« wiedergegeben. »Vision des Himmels« bewahrt die formale Mehrdeutigkeit, ob der Himmel Gegenstand oder Herkunftsbereich der Vision ist.
- source_word: እምቃለ፡ ቅዱሳን፡ መላእክት
  choice: aus dem Wort der heiligen Engel
  rationale: ቃለ ist formal Singular und kann »Wort«, »Rede« oder »Stimme« bezeichnen. »Wort« wahrt den Singular und passt zur vermittelten Offenbarung.
- source_word: እምነ፡ ጸፍጸፈ፡ ሰማይ
  choice: aus den Tafeln des Himmels
  rationale: Bewahrt das konkrete henochische Bild himmlischer Aufzeichnungen; eine Fußnote nennt die allgemeineren möglichen Wiedergaben.
theological_decisions:
- issue: Verhältnis der drei Bezeichnungen für die Gerechten
  choice: Die drei Bezeichnungen bleiben nebeneinander stehen.
  alternative: Sie als bloße Synonyme zusammenzufassen oder ausdrücklich drei verschiedene Gruppen daraus zu machen.
  rationale: Der Text erklärt nicht, ob »Kinder der Gerechtigkeit«, »Erwählte der Welt« und »Pflanze der Geradheit« identische, überlappende oder verschiedene Gruppen sind.
- issue: Bedeutung von ኅሩያነ፡ ዓለም
  choice: Erwählte der Welt
  alternative: Erwählte des Zeitalters
  rationale: ዓለም kann Welt, Zeitalter oder Weltordnung bezeichnen. Die Hauptfassung bleibt nahe am unmittelbaren Wortlaut; die zeitliche Deutung wird in der Fußnote offengehalten.
- issue: Art der Offenbarungsvermittlung
  choice: Vision, Engelwort und Himmelstafeln werden als parallele Erkenntnisquellen wiedergegeben.
  alternative: Die drei Ausdrücke zu einer einzigen Offenbarungsform zu verschmelzen.
  rationale: Die wiederholte Herkunftsangabe mit እም unterscheidet die drei Formulierungen, ohne ihr genaues Verhältnis abschließend zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrtem apokalyptischem Bildfeld. Die wiederholte Präposition »über« und die dreifache Was-Konstruktion erhalten die feierliche Parallelität, ohne unnötig altertümlich zu wirken.
