base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/007.yaml
  text: And after this[a], in the fifth week, at its completion[b], the house of glory and kingship shall be built forever.
translation:
  language: de
  text: Danach wird am Ende der fünften Woche[a] das Haus der Herrlichkeit und der Königsherrschaft für immer erbaut werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „Woche“ ist in der Wochenapokalypse eine symbolische Geschichtsperiode gemeint, nicht unbedingt ein Zeitraum von sieben Tagen.
    reason: cultural_note
lexical_decisions:
- source_word: እምድኅረዝ
  choice: danach
  rationale: Gibt die zeitliche Übergangsformel knapp und natürlich wieder und wahrt die Abfolge der Vision.
- source_word: ኃምስ ሰንበት
  choice: in der fünften Woche
  rationale: Im Kontext der Wochenapokalypse bezeichnet ሰንበት eine Woche beziehungsweise symbolische Siebenerperiode, nicht einen einzelnen Sabbattag.
- source_word: በተፍጻሜታ
  choice: bei ihrem Abschluss
  rationale: Das Suffix bezieht sich auf die fünfte Woche; die Formulierung bewahrt sowohl den Gedanken des Endes als auch den der Vollendung.
- source_word: ቤተ ስብሐት
  choice: das Haus der Herrlichkeit
  rationale: Bewahrt das konkrete Bild eines Hauses beziehungsweise Heiligtums; ስብሐት wird hier im sakralen Kontext angemessen mit „Herrlichkeit“ wiedergegeben.
- source_word: መንግሥት
  choice: Königsherrschaft
  rationale: Bezeichnet Königsherrschaft, Herrschaft oder Königreich. „Königsherrschaft“ lässt die königliche Dimension erkennen, ohne vorschnell ein geografisches Reich vorauszusetzen.
- source_word: ይትሐነጽ
  choice: wird … gebaut werden
  rationale: Die passive Bauaussage passt unmittelbar zum „Haus“ und erhält die konkrete Tempel- beziehungsweise Heiligtumsmetaphorik.
- source_word: እስከ ለዓለም
  choice: für immer
  rationale: Natürliche moderne Wiedergabe der festen Wendung für unbegrenzte, dauerhafte Geltung.
theological_decisions:
- issue: Ob von einem einzigen, durch Herrlichkeit und Königsherrschaft bestimmten Haus oder von Haus und Königreich als zwei koordinierten Größen die Rede ist
  choice: Ein einziges „Haus der Herrlichkeit und der Königsherrschaft“
  alternative: „Das Haus der Herrlichkeit und das Königreich werden für immer gebaut werden.“
  rationale: Die Konstruktion mit „Haus“ und die singularische Verbform sprechen eher für ein einziges Haus, das durch beide folgenden Substantive näher bestimmt wird. Die mögliche koordinierte Lesart bleibt in einer Fußnote ausdrücklich erhalten.
- issue: Ob das Haus ausschließlich als endzeitlicher Tempel zu identifizieren ist
  choice: Das konkrete Bild „Haus“ bleibt ohne ausdrückliche dogmatische Identifizierung stehen
  alternative: Ausdrückliche Wiedergabe als „Tempel“ oder als politisches „Reich“
  rationale: Der Ausgangstext bietet sakrale und königliche Bildsprache, legt aber keine eindeutige systematische Identifizierung fest. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung folgt dem zeitlichen Aufbau des ge’ezischen Textes, ohne im Deutschen unnötig schwerfällig zu wirken. „Königsherrschaft“ erhält die abstrakte Bedeutung und die apokalyptische Spannung; die alternative syntaktische Deutung wird nicht in den Haupttext eingetragen, sondern transparent in der Fußnote dokumentiert.
