revisions:
- from: Und danach, in der fünften Woche[a], bei ihrem Abschluss, wird das Haus der Herrlichkeit und der Königsherrschaft[b] für immer gebaut werden.
  to: Danach wird am Ende der fünften Woche[a] das Haus der Herrlichkeit und der Königsherrschaft für immer erbaut werden.
  rationale: Der Text wird sprachlich gestrafft und die problematische alternative Fußnote entfernt. Dadurch bleibt die Singularstruktur des ge'ezischen Textes gewahrt, ohne die Bildsprache dogmatisch als Tempel oder politisches Reich festzulegen. Der Fußnotenanker steht unmittelbar bei „Woche“ und ist damit eindeutig zugeordnet.
