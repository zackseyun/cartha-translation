  verdict: revise
  source_fidelity: 'Der Haupttext gibt die Abfolge, die fünfte symbolische Woche, deren Abschluss, das einzelne „Haus“ sowie die Verbindung von Herrlichkeit und Königsherrschaft zutreffend wieder. Die alternative Fußnote ist jedoch nicht quellentreu formuliert: Der überlieferte ge''ezische Text hat bei ይትሐነጽ ein Singularverb und stützt daher nicht die Aussage, Haus und Königreich „werden“ als zwei Subjekte gebaut.'
  naturalness: „Danach wird am Ende der fünften Woche“ ist im modernen Standarddeutsch flüssiger als die doppelte Zeitangabe „in der fünften Woche, bei ihrem Abschluss“. „Für immer erbaut werden“ ist in gehoben-prophetischem Register idiomatischer als „für immer gebaut werden“, das einen endlos andauernden Bauvorgang nahelegen kann.
  terminology: „Haus der Herrlichkeit und der Königsherrschaft“ bewahrt die konkrete und zugleich sakral-königliche Bildsprache. „Königsherrschaft“ ist für መንግሥት angemessen; eine Festlegung auf ein räumliches „Königreich“ ist nicht erforderlich.
  issues:
  - severity: medium
    issue: Die Fußnote b bietet eine koordinierte Lesart mit Pluralverb als Alternative an.
    rationale: Das vorliegende ge'ezische Textzeugnis lautet mit Singularverb „soll gebaut werden“. Die Fußnote schafft damit eine syntaktische Alternative, die der überlieferten Verbkongruenz widerspricht, und sollte entfernt werden statt als gleichwertige Lesart zu erscheinen.
  - severity: low
    issue: Die zeitliche Einleitung ist unnötig schwerfällig.
    rationale: „In der fünften Woche, bei ihrem Abschluss“ verdoppelt im Deutschen die Zeitbestimmung. „Am Ende der fünften Woche“ vermittelt በተፍጻሜታ klar und natürlich.
  revised_text: Danach wird am Ende der fünften Woche[a] das Haus der Herrlichkeit und der Königsherrschaft für immer erbaut werden.
