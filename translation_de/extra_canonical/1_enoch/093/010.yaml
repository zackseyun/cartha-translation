base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/093/010.yaml
  text: And at its completion the chosen righteous ones will be selected from the eternal plant of righteousness[c][b][a], and to them will be given the sevenfold instruction concerning all his creation.
translation:
  language: de
  text: Und bei ihrer Vollendung werden die erwählten Gerechten aus der ewigen Pflanze der Gerechtigkeit[a] ausgewählt, denen die siebenfache Unterweisung[b] über seine ganze Schöpfung zuteilwerden wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »aus der ewigen Pflanzung der Gerechtigkeit« oder »aus der Pflanze ewiger Gerechtigkeit«.'
    reason: Die Genitivbeziehungen und der genaue Sinn des landwirtschaftlichen Bildes lassen mehrere Wiedergaben zu.
  - marker: b
    text: Die äthiopische Wortgruppe ist schwierig; möglich sind auch »die sieben Unterweisungen« oder »die sieben Arten der Unterweisung«.
    reason: Es ist nicht völlig sicher, ob die Siebenzahl eine siebenfache Gesamtheit oder sieben einzelne Unterweisungen bezeichnet.
lexical_decisions:
- source_word: በተፍጻሜታ
  choice: bei ihrer Vollendung
  rationale: Die Wendung bezeichnet den Abschluss des vorausgehenden Zeitabschnitts beziehungsweise der vorausgehenden »Woche«, ohne den Bezug im Vers selbst ausdrücklich festzulegen.
- source_word: ይትኃረዩ
  choice: werden … ausgewählt
  rationale: Die passive Form bezeichnet ein Erwählt- oder Ausgewähltwerden. »Ausgewählt« wahrt den Sinn und lässt zugleich die Wahlterminologie des folgenden Adjektivs erkennen.
- source_word: ኅሩያን ጻድቃን
  choice: die erwählten Gerechten
  rationale: Beide Kennzeichnungen bleiben erhalten; »Gerechte« ist im Deutschen natürlich und wahrt den theologischen Leitbegriff der Gerechtigkeit.
- source_word: እምተክለ ጽድቅ ዘለዓለም
  choice: aus der ewigen Pflanze der Gerechtigkeit
  rationale: Die konkrete Wachstumsmetapher wird nicht zu einer abstrakten Gemeinschaft oder Grundlage verflacht. Die Stellung von »ewig« folgt der naheliegenden Zuordnung zu »Pflanze«.
- source_word: እለ ይትወሀብ ሎሙ
  choice: denen … gegeben werden wird
  rationale: Der Relativanschluss እለ wird ausdrücklich wiedergegeben; die passive Zukunft und der Bezug auf die ausgewählten Gerechten bleiben erhalten.
- source_word: ሰብዓቱ መክዕቢተ ትምህርት
  choice: die siebenfache Unterweisung
  rationale: Die schwierige Wortgruppe wird mit ihrem klaren semantischen Kern wiedergegeben; die mögliche Gliederung in sieben Unterweisungen oder Arten der Unterweisung wird in der Fußnote offengehalten.
- source_word: በኵሉ ፍጥረት ዚአሁ
  choice: über seine ganze Schöpfung
  rationale: Die Präpositionalgruppe wird als Gegenstandsbereich der Unterweisung verstanden. »Schöpfung« gibt den kollektiven Sinn natürlich wieder.
theological_decisions:
- issue: Verhältnis von Erwählung und Gerechtigkeit
  choice: die erwählten Gerechten
  alternative: die gerechten Erwählten
  rationale: Erwählung und Gerechtigkeit bleiben als zwei verbundene Kennzeichnungen stehen, ohne sie in spätere Lehrsysteme einzuordnen.
- issue: Agrarische Metapher für den Ursprung der Gerechten
  choice: aus der ewigen Pflanze der Gerechtigkeit
  alternative: aus der ewigen Pflanzung der Gerechtigkeit
  rationale: Die apokalyptische Wachstumsmetapher wird konkret bewahrt; die Alternative bleibt wegen des möglichen Kollektiv- oder Vorgangscharakters des Ausgangsworts in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst erhaltener apokalyptischer Bildsprache. Der etwas feierliche Relativanschluss folgt der ge’ezischen Syntax; die ungewöhnliche Futurform »gegeben werden wird« erhält den Zukunftsbezug und das Passiv.
