base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/066/001.yaml
  text: And after this he showed me the angels of punishment[c][b][a], who are prepared to come and release all the power of the waters.
translation:
  language: de
  text: Und danach zeigte er mir die Engel der Strafe, die bereit sind[a], zu kommen und die ganze Kraft der Wasser freizusetzen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die vorbereitet sind“. Die zugrunde liegende ge’ezische Form ist schwierig und kann Bereitschaft oder Zurüstung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: „die ganze Kraft der Wasser öffnen“; gemeint ist wahrscheinlich, ihre volle Gewalt loszulassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረ ዝ
  choice: danach
  rationale: Gibt die zeitliche Übergangsformel knapp und natürlich wieder und wahrt die Abfolge der Vision.
- source_word: አርአየኒ
  choice: zeigte er mir
  rationale: Bewahrt den visuellen Charakter des Verbs, ohne es deutend zu „offenbarte“ zu erweitern.
- source_word: መላእክተ መቅሠፍት
  choice: die Engel der Strafe
  rationale: Erhält die Genitivverbindung und den gerichtlichen Ton; „Strafe“ ist im heutigen Deutsch klarer und weiter als körperlich eingeengte Wiedergaben wie „Geißelung“.
- source_word: እለ ይልዋን
  choice: die bereit sind
  rationale: Die schwierige Form bezeichnet wahrscheinlich Bereitschaft oder Zurüstung. „Bereit sind“ ist idiomatisch und lässt offen, ob eine vorausgehende Zurüstung mitgemeint ist.
- source_word: ከመ ይምጽኡ
  choice: zu kommen
  rationale: Gibt den Zweck- beziehungsweise Ergänzungssinn nach der Bereitschaftsformulierung natürlich wieder.
- source_word: ወይፍትሑ
  choice: freizusetzen
  rationale: Das Verb kann „öffnen“, „lösen“ oder „freilassen“ bedeuten. In Verbindung mit Kraft ist „freisetzen“ die natürliche deutsche Kollokation und bewahrt den Gedanken entfesselter Wassergewalt.
- source_word: ኵሎ ኀይለ ማይ
  choice: die ganze Kraft der Wasser
  rationale: „Kraft“ gibt ኀይል in diesem elementar-kosmischen Zusammenhang natürlich wieder; der Plural „Wasser“ bewahrt die überlieferte Bildwelt.
theological_decisions:
- issue: Wesen der strafenden Akteure
  choice: übernatürliche „Engel der Strafe“, die die Kraft der Wasser freisetzen
  alternative: menschliche Boten des Gerichts oder lediglich erzieherisch züchtigende Engel
  rationale: Der unmittelbare apokalyptische Zusammenhang stellt Engel als Vollstrecker kosmischen Gerichts dar. Die Übersetzung bewahrt diese Darstellung, ohne ihre genaue Funktion über den Wortlaut hinaus dogmatisch festzulegen.
- issue: Art der Wasserhandlung
  choice: die Kraft der Wasser freisetzen
  alternative: die Kraft der Wasser öffnen
  rationale: „Freisetzen“ entspricht dem Bedeutungsbereich des Verbs und ist mit „Kraft“ idiomatisch. Es deutet die Wasser nicht näher als Flut, damit die kosmische Bildsprache und ihre Offenheit erhalten bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper visionärer Erzählweise. Die ungewöhnliche apokalyptische Wendung „Kraft der Wasser“ bleibt erhalten; nur das Verb wird für eine natürliche deutsche Verbindung sinngemäß als „freisetzen“ wiedergegeben.
