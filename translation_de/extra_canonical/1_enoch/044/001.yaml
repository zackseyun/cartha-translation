base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/044/001.yaml
  text: 'And another thing I saw concerning the lightning: how some of the stars arise and become lightning[b][a], and they are not able to leave it.'
translation:
  language: de
  text: 'Und noch etwas sah ich über den Blitz: wie einige von den Sternen sich erheben und zu Blitzen werden[a] und es nicht verlassen können.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie einige der Sterne aufstehen und zu Blitzen werden“.'
    reason: lexical_alternative
  - marker: b
    text: Der letzte Satzteil ist unsicher. Das Verb kann „verlassen“ oder „aufgeben“ bedeuten; möglicherweise ist auch der Sinn „nicht aufhören können“ gemeint. Der Text nennt nicht ausdrücklich, was sie nicht verlassen können.
    reason: textual_uncertainty
lexical_decisions:
- source_word: ካልእተ
  choice: noch etwas
  rationale: Leitet einen weiteren Gegenstand der Vision ein und bewahrt den fortschreitenden Erzählstil.
- source_word: ርኢኩ
  choice: sah ich
  rationale: Natürliche, gegenwärtige deutsche Wiedergabe der visionären Berichtsformel.
- source_word: በእንተ መብረቅ
  choice: über den Blitz
  rationale: Gibt den Bezug sachlich wieder; መብረቅ bezeichnet hier den Blitz beziehungsweise das Blitzen.
- source_word: እፎ
  choice: wie
  rationale: Leitet anschaulich den Inhalt des Geschauten ein.
- source_word: ይቀውሙ እምከዋክብተ
  choice: einige von den Sternen sich erheben
  rationale: Versteht እም partitiv und ይቀውሙ im Sinn von sich erheben beziehungsweise aufstehen, ohne das missverständliche ‚hervortreten‘.
- source_word: ወይከውኑ መብረቀ
  choice: und zu Blitzen werden
  rationale: Bewahrt die dynamische Verwandlungsaussage und gibt den Plural im Deutschen idiomatisch wieder.
- source_word: ወኢይክሉ ኃዲገ
  choice: und es nicht verlassen können
  rationale: Bewahrt die ausdrückliche Unfähigkeit und den wahrscheinlich transitiven Sinn von ኃዲገ; das ungenannte Bezugsobjekt wird durch ‚es‘ nur grammatisch aufgenommen und bleibt inhaltlich mehrdeutig.
theological_decisions:
- issue: Deutung der Sterne und Blitze
  choice: Die kosmisch-visionäre Bildsprache bleibt ohne Identifikation der Sterne als Engel oder Geister stehen.
  alternative: Die Sterne ausdrücklich als Engelwesen oder die Aussage ausschließlich als Beschreibung eines Naturvorgangs deuten.
  rationale: Der Vers selbst bestimmt die Referenten nicht ausdrücklich; eine nähere Identifikation würde die offene apokalyptische Bildsprache unzulässig festlegen.
- issue: Bezugsobjekt des abschließenden Verlassens
  choice: Das deutsche Pronomen ‚es‘ bleibt bewusst ohne eindeutige Auflösung.
  alternative: Explizit ‚den Blitz‘, ‚diesen Zustand‘ oder ‚ihre Bahn‘ einsetzen beziehungsweise das Verb als ‚aufhören‘ verstehen.
  rationale: Der ge’ezische Text nennt kein klares Objekt. Die Übersetzung wahrt deshalb die syntaktische und sachliche Unsicherheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht visionärem Satzrhythmus. Die ungewöhnliche kosmische Bildsprache und die Unsicherheit des Schlusses werden nicht geglättet.
