  source_fidelity: Die Übersetzung gibt die partitive Konstruktion እምከዋክብተ zutreffend als „einige von den Sternen“ wieder und fasst ይቀውሙ angemessen als „sich erheben“ auf. Die Verwandlung zu Blitzen bleibt erhalten. Der Schlussteil wahrt mit „es nicht verlassen können“ die wahrscheinliche transitive Bedeutung von ኃዲገ, ohne ein im Ge’ez nicht ausdrücklich genanntes Bezugsobjekt inhaltlich festzulegen.
