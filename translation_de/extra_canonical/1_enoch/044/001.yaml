  terminology: „Blitz/Blitze“, „sich erheben“ und „werden“ sind semantisch angemessen. Die Übersetzung vermeidet eine nicht belegte Identifikation der Sterne und bewahrt die apokalyptische Bildsprache. Die Fußnotenanker sind sinnvoll platziert; Fußnote b beschreibt die lexikalische und syntaktische Unsicherheit des letzten Satzteils ausreichend.
