base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/007.yaml
  text: And do not imagine in your spirit[a], and do not say in your heart[c][b], that you do not know and do not see that every sin is written in heaven every day before the Most High.
translation:
  language: de
  text: Und bildet euch in eurem Geist nicht ein und sagt nicht in eurem Herzen, dass ihr nicht wisst und nicht seht, dass jede Sünde im Himmel aufgeschrieben ist und Tag für Tag vor dem Höchsten liegt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Wendung kann auch enger auf den Schreibvorgang bezogen werden: „dass jede Sünde Tag für Tag im Himmel aufgeschrieben wird und vor dem Höchsten liegt“. Sie kann zugleich das fortdauernde Vorliegen des himmlischen Eintrags ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢታምስሉ
  choice: bildet euch … nicht ein
  rationale: Gibt das Verbot einer inneren, selbsttäuschenden Annahme natürlich wieder; „meint nicht“ wäre ebenfalls möglich, aber weniger prägnant.
- source_word: በመንፈስክሙ
  choice: in eurem Geist
  rationale: Bewahrt die wörtliche anthropologische Sprache und die Parallelität zu „in eurem Herzen“.
- source_word: በልብክሙ
  choice: in eurem Herzen
  rationale: Erhält die biblische Rede vom Herzen als Ort innerer Überlegung und Selbstrede.
- source_word: ኢታእምሩ ወኢትሬእዩ
  choice: ihr wüsstet und sähet nicht
  rationale: Die Verben stehen in der zweiten Person Plural. Der Konjunktiv kennzeichnet im Deutschen den Inhalt dessen, was die Angeredeten sich nicht einreden oder im Herzen sagen sollen.
- source_word: ኵሉ ኃጢአት
  choice: jede Sünde
  rationale: Der distributive Singular hebt hervor, dass keine einzelne Sünde dem himmlischen Verzeichnis entgeht.
- source_word: በሰማይ ይጸሐፍ
  choice: im Himmel aufgeschrieben ist
  rationale: Bewahrt das konkrete apokalyptische Bild eines himmlischen Schriftregisters, ohne es zu einer bloßen Aussage über Gottes Wissen zu verallgemeinern.
- source_word: ሀሎ በኵሉ ዕለት
  choice: Tag für Tag … steht
  rationale: Verbindet die Aussage des Vorhandenseins bzw. fortdauernden Bestehens mit der täglichen Gegenwart des Eintrags; „Tag für Tag“ klingt im Deutschen natürlicher als „an jedem Tag“.
- source_word: በቅድሜሁ ለልዑል
  choice: vor dem Höchsten
  rationale: Bewahrt sowohl den erhabenen Gottestitel als auch die Vorstellung eines Registers in Gottes Gegenwart.
theological_decisions:
- issue: Himmlisches Verzeichnis der Sünden
  choice: Das konkrete Bild eines im Himmel aufgeschriebenen und vor dem Höchsten stehenden Sündenregisters bleibt erhalten.
  alternative: Die Aussage allgemein als Gottes Kenntnis aller Sünden wiederzugeben.
  rationale: Das ge’ezische Verb für „schreiben“ und die Ortsangabe „im Himmel“ stützen ausdrücklich die apokalyptische Registervorstellung.
- issue: Grammatische Person der Leugnung
  choice: „ihr wüsstet und sähet nicht“ in der zweiten Person Plural
  alternative: 'Direkte Rede in der ersten Person Plural: „Wir wissen und sehen nicht“'
  rationale: Die ge’ezischen Verbformen sind zweite Person Plural; eine Umformung in direkte Rede würde die grammatische Person verändern.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewahrter biblisch-apokalyptischer Bildwelt. „Geist“ und „Herz“ bleiben als parallele innere Bereiche stehen; der Konjunktiv macht die indirekte innere Behauptung im Deutschen verständlich.
