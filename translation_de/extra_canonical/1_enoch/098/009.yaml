base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/009.yaml
  text: Woe to you[a], fools, for you will perish in your folly, and you oppress the wise[c][b], and good will not come upon you.
translation:
  language: de
  text: Wehe euch, ihr Toren! Denn ihr werdet in eurer Torheit zugrunde gehen; ihr vergesst die Weisen[a], und das Gute wird euch nicht erreichen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihr missachtet die Weisen“ beziehungsweise „ihr kümmert euch nicht um die Weisen“. Das Verb bedeutet wörtlich „vergessen“, kann aber auch Vernachlässigung oder Nichtbeachtung ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch: „Das Gute wird euch nicht finden“. Mit „dem Guten“ kann allgemein Gutes, Wohlergehen oder Segen gemeint sein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Wehe euch
  rationale: Bewahrt die prophetische Weheruf-Formel und ihren ankündigenden Gerichtscharakter.
- source_word: አብዳን
  choice: ihr Toren
  rationale: Bezeichnet Torheit im moralisch-geistlichen Sinn; „Toren“ wahrt den Weisheitskontext und den würdigen Ton.
- source_word: ትትሐጐሉ
  choice: ihr werdet … zugrunde gehen
  rationale: Die Form bezeichnet Untergang oder Verderben, nicht Vertrauen auf Reichtum.
- source_word: በአቢድክሙ
  choice: in eurer Torheit
  rationale: Das Wort gehört zum Bedeutungsfeld Torheit/Wahnsinn und greift die Anrede „Toren“ auf; ein Bezug auf Vermögen ist hier nicht gegeben.
- source_word: ለጠበብን
  choice: die Weisen
  rationale: Die Form wird im Zusammenhang mit dem pronominalen Objekt des folgenden Verbs am natürlichsten auf weise Personen bezogen.
- source_word: ትረሰዕዎሙ
  choice: ihr vergesst
  rationale: Der zugrunde liegende Wortstamm bedeutet „vergessen“ und kann kontextuell auch Vernachlässigung oder Missachtung ausdrücken. Die wörtliche Grundbedeutung bleibt im Haupttext erhalten.
- source_word: ሠናይት
  choice: das Gute
  rationale: Die breite Bedeutung wird nicht vorschnell auf Wohlergehen, Segen oder Wohlstand verengt.
- source_word: ኢይረክበክሙ
  choice: wird euch nicht erreichen
  rationale: Der Wortstamm bezeichnet Finden, Erreichen oder Antreffen. Mit „das Gute“ als Subjekt ist „erreichen“ im Deutschen natürlich und quellennah.
theological_decisions:
- issue: Grund der Weherede
  choice: Die Toren gehen in ihrer eigenen Torheit zugrunde und vergessen beziehungsweise missachten die Weisen.
  alternative: Eine Verurteilung des Vertrauens auf Reichtum und der Unterdrückung der Weisen.
  rationale: Die ge’ezischen Wörter dieses Verses sprechen von Untergang, Torheit und Vergessen. Die Reichtumsdeutung gehört nicht in diesen Wortlaut und wird daher nicht aus dem Kontext hineingetragen.
- issue: Bedeutungsumfang des abschließenden Gerichtsfolgesatzes
  choice: „Das Gute“ wird die Angeredeten nicht erreichen.
  alternative: Wohlergehen, Segen oder Wohlstand wird sie nicht erreichen.
  rationale: Die allgemeinere Wiedergabe bewahrt die theologische und semantische Offenheit des Ausdrucks.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Weheruf-Formel. Die Satzstruktur bleibt eng am ge’ezischen Text; genuine Bedeutungsbreite wird in den Fußnoten dokumentiert.
