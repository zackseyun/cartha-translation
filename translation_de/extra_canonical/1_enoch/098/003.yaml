base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/003.yaml
  text: Therefore they have no instruction or wisdom[a]; and because of this they will perish together with their possessions, and with all their glory and their honor. And in shame, and in slaughter, and in great destitution[c][b], their spirits will be cast into the furnace of fire.
translation:
  language: de
  text: Darum besitzen sie weder Unterweisung noch Weisheit[a]; deshalb werden sie zusammen mit ihrem Besitz und mit all ihrem Glanz und ihrer Ehre zugrunde gehen. In Schande, im Gemetzel und in großem Elend[b] werden ihre Geister in den Feuerofen geworfen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Lehre“. „Unterweisung und Weisheit“ bildet wahrscheinlich ein zusammengehöriges weisheitliches Begriffspaar.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung ist schwierig; möglich sind auch „in großer Not“, „in großer Armut“ oder „in schwerer Bedrängnis“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ትምህርት
  choice: Unterweisung
  rationale: Das Wort bezeichnet Lehre oder empfangene Anleitung. „Unterweisung“ passt zum weisheitlichen Gerichtskontext und bildet mit „Weisheit“ ein natürliches Begriffspaar.
- source_word: ጥበብ
  choice: Weisheit
  rationale: Im moralisch-apokalyptischen Zusammenhang ist praktische und ethische Weisheit gemeint, nicht bloß technische Fertigkeit.
- source_word: አልቦሙ
  choice: besitzen sie weder … noch
  rationale: Die gegenwärtige negative Besitzkonstruktion wird als bestehender Mangel wiedergegeben und klar vom folgenden zukünftigen Untergang unterschieden.
- source_word: ይትሐጐሉ
  choice: werden sie … zugrunde gehen
  rationale: Die Wendung bewahrt den kräftigen Gerichtston, ohne die Art der Vernichtung genauer festzulegen als der Ausgangstext.
- source_word: ኅቡረ ምስለ
  choice: zusammen mit
  rationale: Die Formulierung unterstreicht, dass Menschen, Besitz und Ansehen dasselbe Geschick trifft.
- source_word: ንዋያቲሆሙ
  choice: ihrem Besitz
  rationale: „Besitz“ umfasst materielle Güter, ohne den Sinn auf Geld oder Reichtum einzuengen.
- source_word: ስብሐቶሙ
  choice: ihrem Glanz
  rationale: „Glanz“ gibt das weltliche Ansehen wieder und bleibt zugleich von der nachfolgenden „Ehre“ unterscheidbar.
- source_word: ክብሮሙ
  choice: ihrer Ehre
  rationale: Der Ausdruck bezeichnet Ehre, Würde oder gesellschaftliches Ansehen; „Ehre“ erhält den Parallelismus.
- source_word: በጽእለት
  choice: in Schande
  rationale: Die knappe präpositionale Wendung bewahrt den öffentlichen und moralischen Aspekt der Erniedrigung.
- source_word: በቅትል
  choice: im Gemetzel
  rationale: Das starke Substantiv erhält die drastische Häufung der Gerichtsausdrücke, ohne einen Täter zu bestimmen.
- source_word: በንዴት ዐቢይ
  choice: in großem Elend
  rationale: Die genaue Nuance ist unsicher und kann schwere Not, Entbehrung oder Armut bezeichnen. „Großes Elend“ bewahrt diese Bedeutungsbreite; eine Fußnote nennt engere Möglichkeiten.
- source_word: ትትወደይ መንፈሶሙ
  choice: werden ihre Geister … geworfen werden
  rationale: Die passive, gewaltsame Überstellung wird beibehalten; das ausdrückliche Objekt „ihre Geister“ wird weder verallgemeinert noch als bloßer körperlicher Tod umgedeutet.
- source_word: እቶነ እሳት
  choice: in den Feuerofen
  rationale: „Feuerofen“ gibt die genitivische Verbindung idiomatisch und bildkräftig wieder, ohne zusätzliche Deutung.
theological_decisions:
- issue: Ob der letzte Gerichtssatz Vernichtung oder eine strafende Überstellung nach dem Tod bezeichnet
  choice: ihre Geister werden in den Feuerofen geworfen werden
  alternative: sie selbst werden im Feuer vernichtet werden
  rationale: Da der Ausgangstext ausdrücklich „ihre Geister“ zum Objekt macht, bleibt das apokalyptische Bild eines Gerichts an den Geistern erhalten. Dauer und Endzustand dieses Gerichts werden nicht festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wahrt den Gegensatz zwischen ihrem gegenwärtigen Mangel an Unterweisung und Weisheit und ihrem zukünftigen Untergang. Die Häufung der Gerichtswörter bleibt bewusst erhalten; ungebräuchliche Wörtlichkeit wird jedoch vermieden.
