base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/008.yaml
  text: From now on[b][a], know that all your violence that you commit is being written down every day until the day of your judgment.
translation:
  language: de
  text: 'Wisst von nun an: All eure Gewalt[a], die ihr verübt, wird jeden Tag bis zum Tag eures Gerichts aufgezeichnet[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »all eure Unterdrückung« beziehungsweise »all euer gewaltsames Unrecht«; das ge''ezische Wort kann gewaltsame Ungerechtigkeit und Unterdrückung bezeichnen, nicht nur körperliche Gewalt.'
    reason: lexical_alternative
  - marker: b
    text: Die Formulierung greift das apokalyptische Bild auf, dass Taten im Hinblick auf den Tag des Gerichts schriftlich festgehalten werden.
    reason: cross_reference
lexical_decisions:
- source_word: እምይእዜ
  choice: Von nun an
  rationale: Bewahrt den vorwärtsgerichteten zeitlichen Einsatz und klingt in modernem Standarddeutsch natürlich.
- source_word: ታእምሩ
  choice: sollt ihr wissen
  rationale: Gibt die pluralische direkte Anrede mit eindringlichem Mahnton wieder; die deutsche Konstruktion ist würdevoll und natürlich.
- source_word: ግፍዕክሙ
  choice: all die Gewalt, die ihr verübt
  rationale: Der Ausdruck bezeichnet gewaltsames Unrecht beziehungsweise Unterdrückung. »Gewalt verüben« bewahrt die Schwere des Vorwurfs, ohne ihn auf bloße körperliche Gewalt festzulegen; die Alternative wird in einer Fußnote genannt.
- source_word: ዘትገፍዑ
  choice: die ihr verübt
  rationale: Das Relativverb greift dieselbe Wurzel wie das Substantiv auf. Die Formulierung ist im Deutschen idiomatisch und hält den Bezug auf fortgesetzte Gewalttaten fest.
- source_word: ይጸሐፍ
  choice: wird ... aufgezeichnet
  rationale: Gibt den passivischen Vorgang eines fortlaufenden schriftlichen Festhaltens wieder und wahrt das apokalyptische Bild, ohne den nicht ausdrücklich genannten Schreiber einzuführen.
- source_word: በኵሉ ዕለት
  choice: Tag für Tag
  rationale: Natürliche Wiedergabe der wiederholten, kontinuierlichen Zeitangabe.
- source_word: እስከ ዕለተ ኵነኔክሙ
  choice: bis zum Tag eures Gerichts
  rationale: Bewahrt die eschatologische Gerichtsformel und lässt offen, ob ኵነኔ hier Urteil, Gericht oder Verurteilung betont.
theological_decisions:
- issue: Aufzeichnung der Taten
  choice: Die Gewalttaten werden fortlaufend bis zum Gerichtstag aufgezeichnet.
  alternative: Die Aussage könnte lediglich bildhaft bedeuten, dass die Taten in Erinnerung bleiben, oder sich auf ein menschliches Rechtsregister beziehen.
  rationale: Das Passiv und die Ausrichtung auf den Tag des Gerichts entsprechen dem apokalyptischen Motiv eines für das Endgericht geführten Verzeichnisses. Der Haupttext bewahrt das Bild, ohne ausdrücklich »himmlisch« hinzuzufügen.
- issue: Bedeutung des Gerichtstags
  choice: Tag eures Gerichts
  alternative: Tag eurer Verurteilung
  rationale: »Gericht« gibt die Formel wieder, ohne das Ergebnis des richterlichen Vorgangs bereits im Wortlaut festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter pluralischer Anrede. »Tag für Tag« vermittelt den fortlaufenden Vorgang; die Fußnoten stehen unmittelbar an den jeweils erläuterten Ausdrücken.
