base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/001.yaml
  text: And now I swear to you[a], to the wise and to the foolish[b], that you will see much upon the earth.
translation:
  language: de
  text: Und nun schwöre ich euch, den Weisen wie den Toren, dass ihr vieles auf der Erde sehen werdet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Und nun schwöre ich euch, den Weisen wie den Toren: Denn ihr werdet viel auf der Erde sehen.“ Das zugrunde liegende Wort kann eine Fülle von Dingen bezeichnen; außerdem lässt sich die Verbindung zum vorhergehenden Schwur auch kausal verstehen.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: Und nun
  rationale: Die Verbindung aus Konjunktion und Zeitadverb markiert einen neuen, eindringlichen Aussageschritt.
- source_word: እኔ እምሕል
  choice: schwöre ich
  rationale: Das ausdrückliche Pronomen wird durch die deutsche Wortstellung hervorgehoben; das Verb bezeichnet hier ein Schwören beziehungsweise Ablegen eines Eides, nicht bloß ein Erklären.
- source_word: ለክሙ ለጠቢባን ወለአብዳን
  choice: euch, den Weisen wie den Toren
  rationale: Die Apposition bewahrt die umfassende Anrede und den zugespitzten Gegensatz. „Wie“ gibt das einschließende Nebeneinander beider Gruppen natürlich wieder.
- source_word: እስመ
  choice: dass
  rationale: Im Zusammenhang mit dem Schwur wird die Partikel als Einleitung des Inhalts der eidlichen Aussage verstanden; eine kausale Wiedergabe mit „denn“ bleibt grammatisch denkbar.
- source_word: ብዙኅ
  choice: vieles
  rationale: Das substantivierte „vieles“ drückt die unbestimmte Fülle dessen aus, was gesehen werden wird, und klingt im Deutschen natürlicher als „viel sehen“.
- source_word: ትሬእዩ
  choice: ihr ... sehen werdet
  rationale: Die Zukunftsform passt zum warnenden, vorausblickenden Zusammenhang.
- source_word: ዲበ ምድር
  choice: auf der Erde
  rationale: Die räumlich weit gefasste Formulierung bleibt erhalten, ohne den Bezug verengend als „im Land“ wiederzugeben.
theological_decisions:
- issue: Umfang der Anrede an Weise und Toren
  choice: Eine breit gefasste moralische Anrede, die beide gegensätzlichen Gruppen einschließt
  alternative: Eine engere Anrede an zwei Gruppen innerhalb Israels oder eine ironische, vornehmlich gegen die Frevler gerichtete Anrede
  rationale: Der Vers selbst grenzt die Adressaten nicht weiter ein. Die direkte Wiedergabe erhält diese Offenheit.
- issue: Verhältnis von Schwur und folgender Aussage
  choice: Die folgende Zukunftsaussage wird als Inhalt des Schwurs mit „dass“ angeschlossen
  alternative: Die Aussage wird kausal mit „denn“ als Begründung der Anrede verstanden
  rationale: Der Inhaltssatz ergibt im Deutschen einen natürlichen Schwursatz und entspricht der jüngsten textkritischen Revision, ohne die mögliche kausale Nuance der Partikel dogmatisch auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptisch-feierlichem Ton. „Schwöre“ bewahrt die konkrete Eidesformel; „Toren“ erhält den Weisheitskontrast, ohne unnötig umgangssprachlich oder beleidigend zu wirken.
