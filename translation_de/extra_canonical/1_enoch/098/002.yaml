base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/002.yaml
  text: For you men love adornment on yourselves more than women[a], and companionship more than a virgin; in kingship and in greatness and in authority and in silver and gold and purple[d][c][b], and in splendor and in food they will be poured out like water.
translation:
  language: de
  text: Denn ihr Männer liebt Schmuck an euch mehr als Frauen und farbige Gewänder mehr als eine Jungfrau.[a] In Königsherrschaft, Größe und Macht, in Silber, Gold und Purpur[b], in Pracht und Speise werden sie wie Wasser ausgegossen werden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nahe am Äthiopischen: „und Farbe mehr als eine Jungfrau“. Im Zusammenhang ist wahrscheinlich auffällige farbige Kleidung gemeint.'
    reason: lexical_alternative
  - marker: b
    text: „Purpur“ bezeichnet wahrscheinlich kostbaren purpurfarbenen Stoff, ein verbreitetes Zeichen von Luxus und hohem Rang.
    reason: cultural_note
  - marker: c
    text: Worauf sich „sie“ bezieht, ist nicht eindeutig. Das Bild kann verschwenderisches Ausschütten von Besitz oder das Vergehen der genannten Pracht wie abfließendes Wasser bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: ሥነ፡ ትወድዩ፡ ላዕሌክሙ
  choice: ihr liebt Schmuck an euch
  rationale: ሥነ bezeichnet hier Schönheit beziehungsweise Schmuck, ትወድዩ das Lieben oder Begehren und ላዕሌክሙ wörtlich „auf/an euch“. Die Wendung beschreibt die Vorliebe der angesprochenen Männer für eigenen Schmuck.
- source_word: አንትሙ፡ ዕደው
  choice: ihr Männer
  rationale: Die Wortgruppe ist als ausdrückliche Anrede an Männer zu verstehen; ዕደው wird nicht als „Taten“ aufgefasst.
- source_word: ፈድፋደ፡ እምአንስት
  choice: mehr als Frauen
  rationale: ፈድፋደ mit እም bildet hier einen Vergleich („mehr als“) und bezeichnet nicht „Übermaß von“.
- source_word: ኅብረ
  choice: farbige Gewänder
  rationale: Im Zusammenhang mit Schmuck und Luxus wird das Wort als Farbe beziehungsweise farbige Kleidung verstanden. Die Deutung „Gemeinschaft“ wäre eher mit einer anders gebildeten Nominalform zu erwarten.
- source_word: መንንግሥት … ዕበይ … ሥልጣን
  choice: Königsherrschaft, Größe und Macht
  rationale: Die drei Begriffe benennen königlichen Rang, Größe beziehungsweise Erhabenheit und Herrschaftsmacht; die Reihung des Ausgangstextes bleibt erhalten.
- source_word: ሜላት
  choice: Purpur
  rationale: Gemeint ist wahrscheinlich kostbarer purpurfarbener Stoff als Zeichen von Reichtum und hohem Rang.
- source_word: ክብር
  choice: Pracht
  rationale: Im Katalog sichtbaren Luxus bezeichnet das Wort eher Glanz und Pracht als die zwischenmenschliche Bedeutung „Ehre“.
- source_word: ከመ፡ ማይ፡ ይትከዐዉ
  choice: werden sie wie Wasser ausgegossen werden
  rationale: Die passive Verbform und das Vergleichsbild werden formal bewahrt. Der Bezug des pluralischen Pronomens bleibt wie im Ausgangstext offen.
theological_decisions:
- issue: Gegenstand der Kritik
  choice: Der Vers wird als Kritik an männlicher Prunksucht und verschwenderischem Luxus wiedergegeben.
  alternative: Eine Deutung als Verurteilung sexueller Beziehungen mit Frauen und Jungfrauen.
  rationale: Die Vergleichskonstruktion ፈድፋደ እም, die Anrede „ihr Männer“, der Schmuck beziehungsweise die farbigen Gewänder und der anschließende Luxuskatalog stützen die Kritik an Prachtentfaltung. Eine spezielle Aussage über sexuelle Unmoral wird daher nicht in den Haupttext eingetragen.
- issue: Bezug von „sie“ im Schlussbild
  choice: Das unbestimmte pluralische Subjekt bleibt durch „sie“ erhalten.
  alternative: Ausdrückliche Festlegung auf die Männer, ihre Güter oder die aufgezählten Luxusgüter.
  rationale: Der äthiopische Text lässt den genauen Rückbezug in der vorliegenden Form unsicher. Eine eindeutige Ergänzung würde die genuine Mehrdeutigkeit beseitigen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die anklagende direkte Anrede und die katalogartige Reihung des Ge’ez bleiben erhalten. Ungewohnte Bildlichkeit und der unsichere pronominale Rückbezug werden nicht durch eine konfessionelle oder moraltheologische Ausdeutung geglättet.
