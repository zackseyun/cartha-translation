base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/010.yaml
  text: And now know that you are prepared for the day of destruction[a], and do not hope that you sinners will live; rather, you will depart and die, for you do not know any ransom[d][c][b], because you have been made ready for it.
translation:
  language: de
  text: 'Und nun erkennt: Ihr seid für den Tag des Verderbens[a] bereit. Hofft nicht, dass ihr Sünder leben werdet; vielmehr werdet ihr dahingehen und sterben. Denn ihr kennt kein Lösegeld[b], weil ihr dafür vorbereitet worden seid.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für den Tag der Vernichtung“; möglicherweise auch mit der schärferen Bedeutung: „für den Tag des Gemetzels“. Das ge’ezische Wort bezeichnet hier zerstörerischen Untergang und kann im Gerichtskontext einen gewaltsameren Sinn tragen.'
    reason: lexical_alternative
  - marker: b
    text: „Lösegeld“ meint einen Preis oder ein Mittel zur Befreiung aus dem kommenden Gericht. Die ungewöhnliche Wendung „ihr kennt kein Lösegeld“ kann sinngemäß besagen, dass ihnen kein Ausweg bekannt ist.
    reason: cultural_note
lexical_decisions:
- source_word: ወይእዜኒ አእምሩ
  choice: Und nun erkennt
  rationale: Bewahrt den zeitlichen Übergang und den direkten pluralischen Imperativ in natürlichem, würdigem Deutsch.
- source_word: ድልዋን
  choice: bereit
  rationale: Gibt den Zustand des Bereitseins wieder, ohne vorschnell festzulegen, ob Ernennung oder Vorbereitung gemeint ist.
- source_word: ለዕለተ ሐጕል
  choice: für den Tag des Verderbens
  rationale: „Verderben“ trägt die Bedeutung katastrophalen Untergangs im Gerichtskontext und lässt die mögliche schärfere Nuance der Schlachtung offen.
- source_word: ወኢትስፈዉ
  choice: Hofft nicht
  rationale: Der negative Imperativ weist die trügerische Hoffnung der Angeredeten unmittelbar zurück.
- source_word: ከመ ትሕየዉ ኃጥኣን
  choice: dass ihr Sünder am Leben bleiben werdet
  rationale: Die Verbform ist zweite Person Plural; „ihr Sünder“ bezeichnet die Angeredeten. „Am Leben bleiben“ entspricht im Gerichtskontext idiomatischem Deutsch.
- source_word: አላ ትሐውሩ ወትመውቱ
  choice: vielmehr werdet ihr dahingehen und sterben
  rationale: Erhält die Abfolge von Fortgehen und Sterben sowie den feierlich-drohenden Ton.
- source_word: ቤዛ
  choice: Lösegeld
  rationale: Bewahrt das konkrete Bild eines Preises oder Mittels zur Freilassung, ohne es als Sühne oder allgemeine Rettung auszudeuten.
- source_word: ኢታእምሩ ቤዛ
  choice: ihr kennt kein Lösegeld
  rationale: Bleibt nahe an der schwierigen Wendung und lässt deren ungewöhnliche Ausdrucksweise sichtbar.
- source_word: ተደለውክሙ
  choice: ihr dafür zugerichtet worden seid
  rationale: Gibt die passive Vorbereitung wieder und unterscheidet die Schlussformulierung sprachlich vom vorausgehenden ድልዋን.
theological_decisions:
- issue: Bedeutung von „Lösegeld“ im Gerichtswort
  choice: Lösegeld
  alternative: Rettung; Loskaufpreis
  rationale: Die konkrete Freikaufsmetapher bleibt erhalten; der Text wird nicht in eine spätere dogmatische Sühneformel überführt.
- issue: Bezug der Vorbereitung am Versende
  choice: „dafür“ bezieht sich auf das angekündigte Verderben beziehungsweise Sterben
  alternative: Unbestimmter Bezug ohne ergänzendes Pronomen
  rationale: Der Bezug ist im Kontext naheliegend, wird aber so knapp formuliert, dass keine handelnde Instanz oder genaue Art der Vorbereitung ergänzt wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die direkte Anrede in der zweiten Person Plural wird grammatisch ausdrücklich bewahrt. „Dahingehen“ ist bewusst feierlicher als „weggehen“, während „zugerichtet“ die abschließende Passivform von der anfänglichen Zustandsangabe „bereit“ unterscheidet.
