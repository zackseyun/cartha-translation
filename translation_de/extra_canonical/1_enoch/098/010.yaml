  source_fidelity: 'Die Anrede bleibt zutreffend in der zweiten Person Plural: ትሕየዉ ist nicht als dritte Person („die Sünder“) zu verstehen. „Lösegeld“ bildet ቤዛ angemessen konkret ab und bewahrt die schwierige Formulierung. Die abschließende Passivform ተደለውክሙ verlangt jedoch eine idiomatische Wiedergabe von „vorbereitet/gemacht worden“; „zugerichtet“ ist hierfür im heutigen Deutsch semantisch ungeeignet.'
  naturalness: Der apokalyptisch-gehobene Ton ist gelungen. „Ihr seid … bereit“ und „ihr werdet dahingehen und sterben“ sind natürlich. „Dafür zugerichtet worden seid“ klingt dagegen entweder nach der Zubereitung von Speisen oder nach körperlicher Zurichtung und verfälscht dadurch den Sinn. „dafür vorbereitet worden seid“ ist klar, modern und weiterhin passivisch.
  terminology: „Verderben“ und „Lösegeld“ sind geeignete, nicht dogmatisch überladene Schlüsselbegriffe. Die Fußnote zu „Lösegeld“ erklärt die Metapher zurückhaltend. Die Alternativangabe „Tag des Schlachtens“ ist im Deutschen weniger idiomatisch als „Tag des Gemetzels“ oder schlicht die mit Vorsicht gekennzeichnete Möglichkeit eines gewaltsamen Untergangs; sie kann ohne Verlust knapper formuliert werden.
