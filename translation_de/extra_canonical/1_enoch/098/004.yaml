base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/004.yaml
  text: 'I swear to you[a], sinners: as a mountain has not become a servant, and a hill does not become a maidservant of a woman, so sin was not sent upon the earth; rather, men created it from themselves[c][b], and those who do it will come under a great curse.'
translation:
  language: de
  text: 'Ich schwöre euch, ihr Sünder: Wie ein Berg nicht zum Sklaven geworden ist und ein Hügel nicht zur Sklavin einer Frau wird,[a] so wurde auch die Sünde nicht auf die Erde gesandt. Vielmehr haben die Menschen sie aus sich selbst hervorgebracht,[b] und wer sie tut, wird unter einen schweren Fluch kommen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Vergleich mit Berg, Hügel, Sklave und Sklavin ist im geezsprachigen Text schwer verständlich. Offenbar soll er verdeutlichen, dass die Sünde der Schöpfung nicht als etwas Fremdbestimmtes auferlegt wurde.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich steht eine im Geez übliche reflexive Wendung: „aus sich selbst“. Gemeint ist, dass die Sünde von den Menschen selbst ausgeht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መሐልኩ
  choice: Ich schwöre euch
  rationale: Bewahrt die feierliche, eidähnliche Bekräftigung des Verbs und seinen Bezug auf die angeredeten Sünder.
- source_word: ኃጥኣን
  choice: ihr Sünder
  rationale: Gibt die direkte Anrede und die moralisch-religiöse Gerichtssprache natürlich wieder.
- source_word: ደብር
  choice: Berg
  rationale: Erhält das konkrete topografische Bild.
- source_word: ገብረ
  choice: zum Sklaven geworden
  rationale: Bewahrt in der schwierigen Vergleichsklausel den starken Sinn gesellschaftlicher Unterordnung, statt ihn zu „Diener“ abzuschwächen.
- source_word: እማገር ለብእሲት
  choice: zur Sklavin einer Frau
  rationale: Erhält die weibliche Parallelfigur und die auffällige Formulierung des Ausgangstextes, ohne sie spekulativ zu glätten.
- source_word: ኃጢአትኒ ኢተፈነወት ዲበ ምድር
  choice: so wurde auch die Sünde nicht auf die Erde gesandt
  rationale: Bewahrt das Passiv und damit den Gegensatz zwischen äußerer Sendung und menschlichem Hervorbringen.
- source_word: አላ ሰብእ እምርእሶሙ ፈጠርዋ
  choice: Vielmehr haben die Menschen sie aus sich selbst hervorgebracht
  rationale: እምርእሶሙ ist hier reflexiv als „aus sich selbst“ zu verstehen; „hervorgebracht“ gibt ፈጠርዋ idiomatisch wieder, ohne den Menschen eine absolute Schöpfung aus dem Nichts zuzuschreiben.
- source_word: ለመርገም ዐቢይ ይከውኑ እለ ገብርዋ
  choice: wer sie tut, wird unter einen schweren Fluch kommen
  rationale: Gibt die Gerichtsfolge in natürlichem Deutsch wieder und bewahrt zugleich die Handlungsaussage „sie tun“.
theological_decisions:
- issue: Ursprung der Sünde
  choice: Die Sünde wurde nicht auf die Erde gesandt, sondern von Menschen aus sich selbst hervorgebracht.
  alternative: Die Aussage könnte schwächer nur bestreiten, dass Sünde ein natürlicher oder auferlegter Bestandteil der Schöpfung sei.
  rationale: Der ausdrückliche Gegensatz zwischen „nicht gesandt“ und menschlichem Hervorbringen legt menschliche Verantwortung nahe. Die Übersetzung bewahrt diese Aussage, ohne daraus eine umfassende Lehre über den Ursprung des Bösen abzuleiten.
- issue: Bedeutung des schwierigen Berg-Hügel-Vergleichs
  choice: Die ungewöhnliche Sklavenmetaphorik bleibt im Haupttext stehen und wird in einer Fußnote als textlich schwierig gekennzeichnet.
  alternative: Der Vergleich könnte frei als Aussage paraphrasiert werden, dass Sünde der Schöpfung nicht von außen auferlegt wurde.
  rationale: Eine freie Deutung würde die unsichere Bildsprache vorschnell auflösen. Die formale Fremdheit soll sichtbar bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptischem Gerichtsregister. Die ungewöhnliche Vergleichsstruktur wurde wegen der Unsicherheit des Ausgangstextes nicht geglättet; „schwerer Fluch“ klingt im Deutschen natürlicher als „großer Fluch“, ohne die Intensität abzuschwächen.
