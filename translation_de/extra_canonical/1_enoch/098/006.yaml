  source_fidelity: Die Übersetzung gibt die Schwurformel, die Anrede an die Sünder, den göttlichen Hoheitstitel, die Offenlegung aller bösen Taten in den Himmeln sowie die negative Schlussaussage zuverlässig wieder. Insbesondere ist die Schlussklausel im Einklang mit dem Geʽez und dem korrigierten englischen Audit Trail als Verneinung von „verhüllt oder verborgen“ wiedergegeben, nicht als himmlische Aufzeichnung.
  naturalness: Das Deutsch ist gehoben, klar und gegenwartssprachlich. „Ich habe euch … geschworen“ und „keine eurer Gewalttaten ist verhüllt oder verborgen“ sind idiomatisch. Der Plural „in den Himmeln“ ist bewusst quellennah und im apokalyptischen Register vertretbar.
  terminology: „Sünder“, „der große Heilige“, „böse Taten“ und „Gewalttaten“ sind treffend und registergerecht. Die Kleinschreibung von „großen“ folgt der normalen deutschen Flexion vor dem substantivierten „Heiligen“ und zwingt keine später festgelegte Titelform auf.
