base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/006.yaml
  text: I have sworn to you[a], sinners, by the Great Holy One, that all your evil deeds are revealed in the heavens[b], and none of your deeds of violence are covered or hidden.
translation:
  language: de
  text: 'Ich habe euch, ihr Sünder, bei dem großen Heiligen geschworen: Alle eure bösen Taten sind in den Himmeln aufgedeckt, und keine eurer Gewalttaten ist verhüllt oder verborgen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: መሐልኩ
  choice: Ich habe … geschworen
  rationale: Die erste Person der vollendeten Verbform bezeichnet ein feierliches Schwören. Das deutsche Perfekt gibt die fortwirkende Geltung des Schwurs natürlich wieder.
- source_word: ኃጥኣን
  choice: ihr Sünder
  rationale: Die direkte Anrede wird im Deutschen durch „ihr“ klar und idiomatisch markiert.
- source_word: በቅዱስ ዐቢይ
  choice: bei dem großen Heiligen
  rationale: Die Präposition leitet die Schwurformel ein; beide Bestandteile des göttlichen Hoheitstitels bleiben erhalten, ohne eine spätere dogmatische Formel einzutragen.
- source_word: ኵሉ ግብርክሙ እኩይ
  choice: alle eure bösen Taten
  rationale: „Taten“ gibt das konkrete moralische Handeln wieder; „böse“ entspricht der wertenden Bezeichnung im Gerichtskontext.
- source_word: ክሡት ውእቱ በሰማያት
  choice: sind in den Himmeln aufgedeckt
  rationale: „Aufgedeckt“ bewahrt das Bild des Offenlegens und bildet den beabsichtigten Gegensatz zu „verhüllt oder verborgen“. Der Plural „Himmel“ wird als „Himmeln“ erhalten.
- source_word: ግብረ ግፍዕ
  choice: Gewalttaten
  rationale: Das Kompositum ist im modernen Deutsch knapp und verständlich und umfasst konkrete Gewalt und gewaltsames Unrecht.
- source_word: ወአልብክሙ … ክዱነ ወእኁቡአ
  choice: und keine eurer … ist verhüllt oder verborgen
  rationale: Die negative Existenzkonstruktion wird ausdrücklich wiedergegeben. Die beiden Prädikate bezeichnen Bedecken beziehungsweise Verbergen, nicht Niederschreiben oder Aufzeichnen.
theological_decisions:
- issue: Göttlicher Titel in der Schwurformel
  choice: bei dem großen Heiligen
  alternative: bei dem Großen Heiligen
  rationale: Die Formulierung lässt den Ausdruck als göttlichen Hoheitstitel erkennen, ohne durch ungewöhnliche Großschreibung eine stärker festgelegte Titelform zu erzeugen.
- issue: Himmlische Offenlegung der Taten
  choice: aufgedeckt … verhüllt oder verborgen
  alternative: offenbar … bedeckt oder verborgen
  rationale: 'Die Wortwahl erhält den gerichtlichen Kontrast: Das Böse liegt vor der himmlischen Sphäre offen, und keine Gewalttat bleibt dem Urteil entzogen.'
translation_notes:
  register: Gehobene, aber gegenwärtige Standardsprache. Die direkte Anrede und die Schwurformel bleiben feierlich; der Doppelpunkt macht den Inhalt des Schwurs klar. Keine Fußnote ist nötig, da die jüngste Quellenprüfung die negative Schlussklausel überzeugend als „nicht verhüllt oder verborgen“ bestätigt.
