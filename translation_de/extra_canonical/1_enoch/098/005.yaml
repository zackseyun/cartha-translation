base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/098/005.yaml
  text: And barrenness was not given to a woman[a]; rather[c][b], because of the work of her hands she dies childless.
translation:
  language: de
  text: Und Unfruchtbarkeit wurde einer Frau nicht gegeben[a]; vielmehr stirbt sie wegen des Werks ihrer Hände[b] kinderlos.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Kinderlosigkeit wurde einer Frau nicht zugeteilt.« Das ge’ezische Wort bezeichnet Unfruchtbarkeit oder Kinderlosigkeit; die Formulierung stellt sie dem Tod als dem tatsächlich beschriebenen Geschick gegenüber.'
    reason: lexical_alternative
  - marker: b
    text: »Das Werk ihrer Hände« ist eine bildhafte Wendung für ihre Taten oder ihr Handeln.
    reason: cultural_note
  - marker: c
    text: 'Oder mit Zukunftssinn: »vielmehr wird sie wegen des Werks ihrer Hände kinderlos sterben.«'
    reason: grammatical_alternative
lexical_decisions:
- source_word: ምክነት
  choice: Unfruchtbarkeit
  rationale: Das Substantiv bezeichnet Unfruchtbarkeit beziehungsweise Kinderlosigkeit. »Unfruchtbarkeit« bewahrt hier den körperlich-reproduktiven Sinn und lässt den Kontrast zum abschließenden »kinderlos« erkennen.
- source_word: ለብእሲት
  choice: einer Frau
  rationale: Die Präpositionalfügung bezeichnet die Empfängerin dessen, was gegeben wird. Der unmarkierte, allgemein-sprichwörtliche Zusammenhang spricht für »einer Frau« statt für eine bestimmte Frau.
- source_word: ኢተውህበት
  choice: wurde … nicht gegeben
  rationale: Die passive Form des Verbs »geben« wird transparent und ohne zusätzliche Deutung wiedergegeben.
- source_word: አላ
  choice: vielmehr
  rationale: »Vielmehr« bringt den starken Gegensatz zwischen der nicht gegebenen Unfruchtbarkeit und dem anschließend beschriebenen Tod zum Ausdruck.
- source_word: በእንተ
  choice: wegen
  rationale: Die Präposition führt den Grund oder Anlass ein; »wegen« gibt den kausalen Zusammenhang knapp wieder.
- source_word: ግብረ እዴሃ
  choice: des Werks ihrer Hände
  rationale: Die konkrete Wendung bleibt erhalten, obwohl sie idiomatisch ihre Taten beziehungsweise ihr Handeln bezeichnet.
- source_word: ትመውት
  choice: sie stirbt
  rationale: Das Präsens passt zur allgemeinen, sprichwörtlichen Aussage des Zusammenhangs. Die Form kann je nach Verständnis auch zukünftig wiedergegeben werden.
- source_word: ዘእንበለ ውሉድ
  choice: kinderlos
  rationale: Die Wendung bedeutet wörtlich »ohne Kinder/Nachkommen«. »Kinderlos« ist im Deutschen natürlich und bewahrt die inhaltliche Zuspitzung am Versende.
theological_decisions:
- issue: Art des Gerichts über die Frau
  choice: Der Vers stellt die nicht zugeteilte Unfruchtbarkeit dem Tod gegenüber, der wegen ihrer eigenen Taten eintritt und sie kinderlos lässt.
  alternative: Die Aussage kann allgemeiner so verstanden werden, dass nicht Kinderlosigkeit als solche ihr zugeteiltes Los ist, sondern der Tod; außerdem kann »Werk ihrer Hände« bestimmte verwerfliche Handlungen statt ihrer Taten im Allgemeinen meinen.
  rationale: Die Abfolge aus Verneinung, starkem Gegensatz und kausaler Wendung verbindet das Geschick mit ihrem Handeln. Die Übersetzung benennt weder bestimmte Taten noch eine weitergehende dogmatische Erklärung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die relativ formale Wendung »wurde … gegeben« und das konkrete Bild »Werk ihrer Hände« bewahren die Struktur des Ge’ez; »einer Frau« und das Präsens kennzeichnen die Aussage als allgemein beziehungsweise sprichwörtlich.
