    text: 'Die Wendung „hört auf die aufrichtigen Worte meines Mundes“ ist im Geʽez schwierig und kann auch bedeuten: „Hört recht auf die Worte meines Mundes.“ Das anschließend mit „ich spreche zu euch“ wiedergegebene Verb bedeutet wörtlich etwa „ich mache euch hören“ und kann sinngemäß auch „ich bezeuge euch“ oder „ich ermahne euch“ heißen.'
