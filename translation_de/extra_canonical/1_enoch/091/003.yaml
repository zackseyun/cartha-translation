  revised_text: 'Und er sprach zu ihnen allen, zu allen Kindern der Gerechtigkeit, und sagte: „Hört, Kinder Henochs, jedes Wort eures Vaters, und hört auf die aufrichtigen Worte meines Mundes; denn ich spreche zu euch und sage euch, ihr Geliebten: Liebt die Gerechtigkeit und wandelt in ihr.“'
