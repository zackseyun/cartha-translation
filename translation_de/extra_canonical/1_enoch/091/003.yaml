base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/003.yaml
  text: 'And he spoke to them all[a], to all the children of righteousness, and said, “Hear, children of Enoch, every word of your father, and listen to the upright words of my mouth; for I speak to you and tell you[c][b], beloved ones: love righteousness and walk in it.”'
translation:
  language: de
  text: 'Und er sprach zu ihnen allen, zu allen Kindern der Gerechtigkeit, und sagte: „Hört, Kinder Henochs, jedes Wort eures Vaters, und hört auf die aufrichtigen Worte meines Mundes; denn ich spreche zu euch und sage euch, ihr Geliebten: Liebt die Gerechtigkeit und wandelt in ihr.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውሉደ ጽድቅ
  choice: Kinder der Gerechtigkeit
  rationale: Bewahrt die für Henoch charakteristische familiäre Identitätsbezeichnung und den programmatischen Begriff „Gerechtigkeit“.
- source_word: ደቂቀ ሄኖክ
  choice: Kinder Henochs
  rationale: Gibt die direkte Anrede natürlich wieder, ohne sie enger als „Söhne“ oder weiter als „Nachkommen“ festzulegen.
- source_word: ኵሎ ነገረ አቡክሙ
  choice: jedes Wort eures Vaters
  rationale: Entspricht dem umfassenden Singular und passt zur Aufforderung, aufmerksam zuzuhören.
- source_word: አጽምኡ ርርትዐ ቃለ አፉየ
  choice: hört auf die aufrichtigen Worte meines Mundes
  rationale: Versteht die schwierige Form bei ርርትዐ attributiv; die semitische Wendung bleibt erkennbar und ist zugleich verständliches Deutsch.
- source_word: አሰምዕ ... ወእነግረክሙ
  choice: ich lasse euch hören und sage euch
  rationale: Bewahrt die kausative Bedeutung des ersten Verbs sowie den emphatischen Doppel-Ausdruck, ohne „ermahnen“ interpretierend einzutragen.
- source_word: ፍቁራን
  choice: ihr Geliebten
  rationale: Eine würdevolle, warme Anrede im Deutschen.
- source_word: ርትዕ
  choice: Gerechtigkeit
  rationale: Der Begriff bezeichnet hier die ethische Rechtschaffenheit und Lebensweise; „Gerechtigkeit“ hält die Verbindung zur vorausgehenden Identitätsbezeichnung fest.
- source_word: ባቲ ሑሩ
  choice: wandelt in ihr
  rationale: Erhält das biblisch-ethische Bild des Gehens als Lebensführung; das Pronomen verweist auf die Gerechtigkeit.
theological_decisions:
- issue: Wiedergabe von ጽድቅ/ርትዕ
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit / Recht
  rationale: „Gerechtigkeit“ umfasst hier den ethischen Lebensweg und wahrt die terminologische Wiederholung, ohne den Ausdruck ausschließlich juristisch oder dogmatisch zu bestimmen.
- issue: Bezug und syntaktische Funktion von ርርትዐ
  choice: 'attributiv: „die aufrichtigen Worte meines Mundes“'
  alternative: 'adverbial: „hört recht auf die Worte meines Mundes“'
  rationale: Die Ge’ez-Fügung ist schwierig. Die Hauptfassung folgt einer plausiblen attributiven Deutung; die adverbiale Möglichkeit wird nicht verschwiegen, sondern in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltenen henochischen Leitbegriffen. „Wandelt“ ist leicht gehoben, bewahrt aber das ethische Wegmotiv besser als das flachere „lebt“.
