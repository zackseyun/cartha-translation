base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/002.yaml
  text: And after this[a], Methuselah went and called all his brothers to him[b], and gathered his kindred.
translation:
  language: de
  text: Und danach[a] ging Methusalem hin, rief alle seine Brüder zu sich und versammelte seine Verwandten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der einleitende Ausdruck kann auch mit »daraufhin« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምኔሁ
  choice: danach
  rationale: Die präpositionale Form bedeutet wörtlich etwa »von dort/davon her«, dient hier im Erzählfluss jedoch als zeitlicher Übergang. »Danach« gibt diese Funktion natürlich und knapp wieder.
- source_word: ሖረ
  choice: ging … hin
  rationale: Das Verb bezeichnet eine gewöhnliche Bewegung. Die Wiedergabe bewahrt den eigenständigen Handlungsschritt, ohne ein Fortgehen oder Abreisen hineinzulesen.
- source_word: ማቱሳላ
  choice: Methusalem
  rationale: Die im Deutschen geläufige biblische Namensform dient der Verständlichkeit und Wiedererkennbarkeit.
- source_word: ጸውዖሙ
  choice: rief
  rationale: Das Verb kann »rufen« oder »herbeirufen« bedeuten. »Rief … zu sich« bewahrt die Offenheit zwischen einfachem Rufen und ausdrücklicher Aufforderung zum Zusammenkommen.
- source_word: ለኵሎሙ አኃዊሁ
  choice: alle seine Brüder
  rationale: Die Wendung ist ausdrücklich familial; »Brüder« ist im modernen Deutsch klarer als das altertümliche »Brüderschaft/Brüder insgesamt«.
- source_word: ኀቤሁ
  choice: zu sich
  rationale: Die Präposition bezeichnet eine Bewegung auf Methusalem hin beziehungsweise in seine Gegenwart. Im Deutschen ist »zu sich« hier die natürliche Entsprechung.
- source_word: አስተጋብኦሙ
  choice: versammelte
  rationale: Die Kausativbedeutung bezeichnet das Zusammenbringen von Personen. »Versammelte« gibt dies prägnant und in angemessenem Erzählregister wieder.
- source_word: አዝማዲ ዚአሁ
  choice: seine Verwandten
  rationale: Die Wortgruppe bezeichnet seine durch Verwandtschaft verbundenen Angehörigen. »Verwandten« ist heute verständlicher als »Sippe« oder »Verwandtschaft« und vermeidet eine unnötige Eingrenzung auf den engeren Haushalt.
theological_decisions:
- issue: Umfang der Verwandtschaftsbezeichnungen
  choice: »Brüder« und »Verwandte« werden als tatsächliche familiäre Beziehungen wiedergegeben.
  alternative: »Brüder« als bloße Clanmitglieder oder als geistliche Gemeinschaft zu verstehen.
  rationale: Der unmittelbare Wortlaut und der testamentarisch-familiäre Zusammenhang verlangen keine metaphorische oder konfessionell geprägte Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählsyntax. Die Reihung der drei Handlungen bleibt erhalten. Ein zweiter Fußnotenhinweis wurde nicht übernommen, weil der ge'ezische Schluss nur »seine Verwandten« besagt und kein weiteres »zu sich« enthält.
