base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/009.yaml
  text: And all will be given over with the nations[a], and the towers will be burned with fire; and they will be removed from all the earth, and they will be cast into the judgment of fire[d][c][b], and they will perish in wrath and in mighty judgment forever.
translation:
  language: de
  text: Und alle Götzen werden zusammen mit den Völkern[a] weggeworfen werden, und die Heiligtümer[b] werden im Feuer verbrannt werden. Man wird sie von der ganzen Erde entfernen, und sie werden in das Feuergericht geworfen werden; sie werden im Zorn und in gewaltigem Gericht für immer[c] zugrunde gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Zusammen mit den Völkern“ kann je nach Auffassung der Präposition auch „unter den Völkern“ heißen.
    reason: lexical_alternative
  - marker: b
    text: Das zugrunde liegende Wort ist textlich und lexikalisch schwierig; möglich sind auch „Tempel“ oder „Türme“. Die vorliegende Wiedergabe versteht es im Zusammenhang mit den Götzen als kultische Bauwerke. Die bereitgestellte Transkription weist hier offenbar einen Lesefehler auf.
    reason: textual_variant
  - marker: c
    text: „Für immer“ bezeichnet hier die bleibende eschatologische Endgültigkeit. Der Vers selbst legt damit nicht alle Einzelheiten eines später entwickelten Lehrmodells über die Strafe fest.
    reason: cultural_note
lexical_decisions:
- source_word: ጣዖት፡ ይትገደፍ
  choice: die Götzen werden weggeworfen werden
  rationale: Die in der Editionsüberprüfung wiederhergestellte Lesart bezeichnet Götzen und ein verwerfendes beziehungsweise fortschaffendes Werfen. Die Formulierung erhält das konkrete Gerichtsbild.
- source_word: ምስለ፡ አሕዛብ
  choice: zusammen mit den Völkern
  rationale: ምስለ bedeutet gewöhnlich „mit“; „Völker“ vermeidet die später stärker konfessionell geprägte Wiedergabe „Heiden“.
- source_word: ማኅፈድ
  choice: Heiligtümer
  rationale: Das korrigierte Wort kann im Kontext kultische Bauwerke beziehungsweise Tempel bezeichnen; „Heiligtümer“ passt zu den unmittelbar zuvor genannten Götzen, ohne die unsichere bauliche Gestalt als Turm festzulegen.
- source_word: በእሳት፡ ትነድድ
  choice: werden im Feuer verbrannt werden
  rationale: Die passive deutsche Form gibt das Bild ihrer Vernichtung durch Feuer natürlich und deutlich wieder.
- source_word: ወይወፅእዎሙ፡ እምኵሉ፡ ምድር
  choice: Man wird sie von der ganzen Erde entfernen
  rationale: Die unbestimmte deutsche Konstruktion bildet das nicht ausdrücklich genannte handelnde Subjekt ab; „ganze Erde“ bewahrt den kosmisch-apokalyptischen Umfang.
- source_word: በኵነኔ፡ እሳት
  choice: in das Feuergericht
  rationale: Das deutsche Kompositum bewahrt sowohl den gerichtlichen als auch den feurigen Aspekt und ist verständlicher als die schwerfällige Wendung „in das Gericht des Feuers“.
- source_word: ይትሐጐሉ
  choice: zugrunde gehen
  rationale: Die Wendung drückt Vernichtung aus, ohne über den im Vers genannten Vorgang hinaus eine bestimmte Wirkungsweise festzulegen.
- source_word: በመዓት፡ ወበኵነኔ፡ ኃያል
  choice: in Zorn und durch ein mächtiges Gericht
  rationale: „Zorn“ erhält den gehobenen Gerichtston; „mächtig“ gibt die Stärke des Gerichts wieder, ohne sie interpretierend zu „streng“ abzuschwächen.
- source_word: እንተ፡ ለዓለም
  choice: für immer
  rationale: Die idiomatische deutsche Wendung erhält die ausdrückliche, fortdauernde Endgültigkeit der eschatologischen Aussage.
theological_decisions:
- issue: Bezugsgruppe der abschließenden Gerichtsankündigung
  choice: Das Pronomen „sie“ bleibt stehen und wird nicht durch eine ausdrücklich benannte Gruppe ersetzt.
  alternative: Man könnte das zweite „sie“ ausdrücklich auf die Völker beziehungsweise deren Angehörige beziehen.
  rationale: Der unmittelbare Zusammenhang nennt Götzen, Heiligtümer und Völker, während die Pronomenfolge den Wechsel des Bezugs nicht völlig ausbuchstabiert. Die Übersetzung bewahrt diese Spannung.
- issue: Dauer und Art des Gerichts
  choice: „für immer“ wird als Aussage eschatologischer Endgültigkeit übersetzt.
  alternative: Die Wendung könnte als „für das Zeitalter“ beziehungsweise als zeitalterlange Endgültigkeit erklärt werden.
  rationale: Der Vers verbindet Feuer, Zorn, Gericht und eine Dauerformel. Die Übersetzung erhält deren Gewicht, legt aber kein späteres Lehrsystem über Bewusstseinszustand oder genaue Beschaffenheit der Strafe in den Text hinein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener apokalyptischer Bildsprache. Die parataktische Satzfolge des Ge’ez bleibt erkennbar, wird aber durch deutsche Zeichensetzung lesbar gegliedert. Wegen der dokumentierten OCR-Probleme folgt der Entwurf an den entscheidenden Stellen der editionskritisch wiederhergestellten Lesart „Götzen“ und „Heiligtümer/Tempel“ statt den fehlerhaft transkribierten Formen.
