base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/004.yaml
  text: And do not draw near to righteousness with a double heart[a], nor join yourselves with those who are of a double heart; but walk in righteousness, my children, and it will lead you on a good path[d][c][b], and righteousness will be your companion.
translation:
  language: de
  text: Nähert euch der Rechtschaffenheit nicht mit doppeltem Herzen[b], und schließt euch nicht denen an, die ein doppeltes Herz haben[a]. Geht vielmehr in Gerechtigkeit, meine Kinder; sie wird euch auf einem guten Weg führen, und die Gerechtigkeit wird euch Gefährtin sein[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Satzteil „und schließt euch nicht denen an, die ein doppeltes Herz haben“ steht im vorliegenden äthiopischen Zeugen in Klammern. Er kann eine Textvariante oder eine spätere Erweiterung sein, passt aber zum parallelen Aufbau des Verses und wurde deshalb aufgenommen.
    reason: textual_variant
  - marker: b
    text: „Mit doppeltem Herzen“ ist eine wörtliche Redeweise für geteilte Loyalität, innere Zwiespältigkeit oder Unaufrichtigkeit.
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: „Die Gerechtigkeit wird mit euch verbunden sein“ oder „wird eure Teilhaberin sein“. Das äthiopische Wort bezeichnet Gemeinschaft, Verbindung oder Teilhabe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ርትዕ
  choice: Rechtschaffenheit
  rationale: Das Wort bezeichnet hier moralische Geradheit oder Lauterkeit. Die Wiedergabe unterscheidet es bewusst vom später wiederholten ጽድቅ („Gerechtigkeit“).
- source_word: በክልኤ ልብ
  choice: mit doppeltem Herzen
  rationale: Die konkrete äthiopische Redeweise bleibt erhalten; sie bezeichnet ein geteiltes Inneres, zwiespältige Loyalität oder Unaufrichtigkeit.
- source_word: ኢትኅበሩ ምስለ እለ በክልኤ ልብ
  choice: schließt euch nicht denen an, die ein doppeltes Herz haben
  rationale: „Sich anschließen“ gibt den sozialen Sinn von Verbindung und Gemeinschaft natürlich wieder. Der im Zeugen eingeklammerte Satzteil wird beibehalten und textkritisch erläutert.
- source_word: ሑሩ በጽድቅ
  choice: Geht vielmehr in Gerechtigkeit
  rationale: Die Formulierung bewahrt sowohl die Bewegungsmetapher als auch den substantivischen ethischen Begriff, ohne ihn auf bloßes „richtiges Verhalten“ zu verengen.
- source_word: ደቂቅየ
  choice: meine Kinder
  rationale: Die familiäre, lehrhafte Anrede wird in natürlichem und inklusivem Deutsch wiedergegeben.
- source_word: ትመርሐክሙ በፍኖት ኄርት
  choice: sie wird euch auf einem guten Weg führen
  rationale: Das feminine Verb wird auf die zuvor genannte Gerechtigkeit bezogen. ፍኖት steht hier im Singular; daher „auf einem guten Weg“.
- source_word: ወጽድቅ ይከውን ለክሙ ሱታፌ
  choice: und die Gerechtigkeit wird euch Gefährtin sein
  rationale: ሱታፌ bezeichnet Gemeinschaft, Teilhabe oder Gefährtenschaft. „Gefährtin“ wahrt die personifizierende Wegmetapher und stimmt grammatisch mit „Gerechtigkeit“ überein.
theological_decisions:
- issue: Bildsprache für innere Zwiespältigkeit
  choice: doppeltes Herz
  alternative: zwiespältiges Herz; zwei Herzen
  rationale: Die quellensprachliche Herzmetapher bleibt sichtbar, ohne sie in einen modernen psychologischen Fachausdruck aufzulösen.
- issue: Status des eingeklammerten Satzteils
  choice: im Haupttext aufgenommen und mit Fußnote gekennzeichnet
  alternative: als sekundären Zusatz auslassen
  rationale: Der gelieferte äthiopische Zeuge enthält den Satzteil, kennzeichnet ihn jedoch durch Klammern als unsicher. Aufnahme samt transparenter Fußnote bewahrt sowohl den überlieferten Wortlaut als auch die textkritische Unsicherheit.
- issue: Personifizierung der Gerechtigkeit
  choice: „sie“ führt und wird „Gefährtin“
  alternative: 'unpersönlich: „sie wird euch begleiten“'
  rationale: 'Die grammatische und bildhafte Spannung des Textes bleibt erhalten: Gerechtigkeit erscheint zugleich als Lebensbereich, Führerin und Weggefährtin.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter Herz- und Wegmetaphorik. „Rechtschaffenheit“ und „Gerechtigkeit“ geben die unterschiedlichen äthiopischen Begriffe ርትዕ und ጽድቅ wieder. Die leicht gehobene Wendung „Geht in Gerechtigkeit“ wurde gewählt, um die ungewöhnliche Bildsprache der Quelle nicht einzuebnen.
