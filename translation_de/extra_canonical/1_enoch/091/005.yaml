base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/005.yaml
  text: For I know that violence will endure upon the earth[a], and a great scourge will be carried out upon the earth; and all lawlessness will be brought to completion and be cut off from its roots[c][b], and every structure will pass away.
translation:
  language: de
  text: Denn ich weiß, dass gewaltsames Unrecht auf der Erde fortbestehen wird und eine große Heimsuchung[a] sich auf der Erde vollziehen wird. Alle Gesetzlosigkeit wird zur Vollendung kommen[b] und von ihren Wurzeln her ausgerottet werden; und jedes Bauwerk[c] wird vergehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine große Plage« beziehungsweise »eine große Strafe«. Das geʿezische Wort kann allgemein eine vernichtende oder strafende Bedrängnis bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Dass alle Gesetzlosigkeit »zur Vollendung kommt«, kann bedeuten, dass sie vor dem Gericht ihr volles Maß erreicht; damit wird sie nicht gebilligt oder dauerhaft bestätigt.
    reason: alternative_reading
  - marker: c
    text: 'Oder weiter gefasst: »jedes Gebilde« oder »alles Errichtete«. Gemeint sein können konkrete Gebäude, möglicherweise aber auch menschliche Konstruktionen oder Ordnungen allgemein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: Denn
  rationale: Bewahrt die begründende Verknüpfung mit dem vorausgehenden Zusammenhang und klingt im Deutschen natürlich und würdig.
- source_word: አእምር
  choice: ich weiß
  rationale: Gibt die schlichte Wissensaussage und den Ton prophetischer Gewissheit wieder.
- source_word: ይጸንዕ
  choice: wird fortbestehen
  rationale: Das Verb bezeichnet Festigkeit oder Fortdauer; »fortbestehen« drückt das Anhalten des Bösen aus, ohne dessen Billigung anzudeuten.
- source_word: ሀላዌ ግፍዕ
  choice: gewaltsames Unrecht
  rationale: Die Wendung umfasst das Vorhandensein von Gewalt, Bedrückung und Unrecht. Die zweigliedrige deutsche Wiedergabe bewahrt diese größere Bedeutungsbreite.
- source_word: በዲበ ምድር
  choice: auf der Erde / über die Erde
  rationale: 'Die unterschiedliche deutsche Präposition folgt dem jeweiligen Zusammenhang: Das Unrecht besteht auf der Erde fort, die Heimsuchung kommt über sie.'
- source_word: መቅሠፍት ዐቢይ
  choice: eine große Heimsuchung
  rationale: Der Ausdruck kann eine Plage, einen vernichtenden Schlag oder eine strafende Bedrängnis bezeichnen. »Heimsuchung« hält den katastrophalen und möglichen Strafcharakter offen.
- source_word: ኵላ ዓመፃ
  choice: alle Gesetzlosigkeit
  rationale: Bezeichnet umfassend rebellisches, normwidriges Unrecht und passt zum apokalyptischen Zusammenhang.
- source_word: ትትፈጸም
  choice: wird zur Vollendung kommen
  rationale: Bewahrt beim zweiten Vorkommen die Spannung, dass die Gesetzlosigkeit zunächst ihr Ende oder volles Maß erreicht, ehe sie beseitigt wird.
- source_word: ትትገዘም እምሥረዊሃ
  choice: von ihren Wurzeln her ausgerottet werden
  rationale: Erhält das Bild einer vollständigen Beseitigung bis an die Wurzeln; »ausgerottet« ist im Deutschen idiomatischer als eine wörtliche Verbindung von Abschneiden und Wurzeln.
- source_word: ኵሉ ሕንጻ
  choice: jedes Bauwerk
  rationale: Die konkrete Grundbedeutung ist ein Gebäude oder etwas Errichtetes; die Fußnote weist auf den möglichen weiteren Sinn hin.
- source_word: የኃልፍ
  choice: wird vergehen
  rationale: Gibt das Verschwinden oder Aufhören in knapper, feierlicher Gerichtssprache wieder.
theological_decisions:
- issue: Fortdauer, Vollendung und anschließende Beseitigung des Bösen
  choice: 'Die Abfolge bleibt erhalten: Das Unrecht besteht fort, die Gesetzlosigkeit kommt zur Vollendung und wird danach ausgerottet.'
  alternative: Die Aussage könnte glättend als sofortige Vernichtung des Bösen wiedergegeben werden.
  rationale: Die Folge der ge'ezischen Verben legt eine zeitliche und theologische Spannung nahe, die nicht zugunsten eines bestimmten Lehrsystems aufgelöst werden darf.
- issue: Charakter der großen Heimsuchung
  choice: Die Übersetzung lässt offen, ob vor allem eine Plage, eine allgemeine Katastrophe oder ein Strafgericht gemeint ist.
  alternative: Eine eindeutige Wiedergabe als »göttliches Strafgericht«.
  rationale: Der Quellbegriff hat eine weitere Bedeutung und nennt den Handelnden nicht ausdrücklich.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, apokalyptischem Ton. Der Satzbau bleibt feierlich, wird jedoch zur besseren Lesbarkeit in zwei Sätze gegliedert. Fachsprachliche oder konfessionell festgelegte Deutungen werden vermieden; die schwer aufzulösenden Bedeutungsfelder werden in Fußnoten offengehalten.
