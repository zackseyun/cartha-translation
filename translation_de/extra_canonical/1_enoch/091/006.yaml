base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/006.yaml
  text: And lawlessness will again increase[a], and it will be brought to completion upon the earth[c][b]; and every work of lawlessness and violence and sin will again take hold.
translation:
  language: de
  text: Und die Gesetzlosigkeit wird erneut auftreten[a] und auf der Erde vollendet werden[b]; und jedes Werk der Gesetzlosigkeit, der Gewalt und der Sünde wird wieder um sich greifen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „wird wiederholt werden“ oder „wird sich wiederholen“. Die Formulierung bezeichnet die erneute Wiederkehr der Gesetzlosigkeit; „zunehmen“ ist möglich, aber nicht ausdrücklich gesagt.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „wird auf der Erde vollendet werden“ oder „wird zu Ende gebracht werden“. Gemeint sein kann, dass die Gesetzlosigkeit ihr volles Maß erreicht.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich steht ein Verb des Greifens oder Erfassens; möglich ist auch: „wird wieder die Oberhand gewinnen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ትደገም ካዕበ
  choice: wird erneut auftreten
  rationale: Die Verbindung bezeichnet ein erneutes Geschehen beziehungsweise eine Wiederholung. „Erneut auftreten“ gibt die Wiederkehr natürlich wieder, ohne die im Deutschen schwerfällige Doppelung „wird wieder wiederholt werden“ zu erzeugen.
- source_word: ዓመፃ
  choice: Gesetzlosigkeit
  rationale: Diese Wiedergabe hält den Begriff von ግፍዕ („Gewalt/Unterdrückung“) und አበሳ („Sünde/Schuld“) auseinander und bewahrt so die dreigliedrige Anklage.
- source_word: ትትፈጸም
  choice: sich vollenden
  rationale: Das Verb kann „vollendet“, „zu Ende gebracht“ oder „erfüllt werden“ bedeuten. Die reflexive deutsche Form bewahrt die ungenannte Urheberschaft und den unheilvollen Gedanken, dass die Gesetzlosigkeit ihr volles Maß erreicht.
- source_word: ዲበ ምድር
  choice: auf der Erde
  rationale: Die Wendung bezeichnet hier am ehesten die Erde im umfassenden apokalyptischen Sinn, nicht bloß ein bestimmtes Land.
- source_word: ትትአኀዝ
  choice: um sich greifen
  rationale: Das Verb trägt das Bild des Greifens oder Erfassens. „Um sich greifen“ ist im Deutschen idiomatisch und bewahrt das Bild davon, dass böse Taten erneut Macht gewinnen.
- source_word: ኵሉ ግብረ
  choice: jedes Werk der
  rationale: Die Formulierung erhält den distributiven Sinn von ኵሉ und die konkrete Rede von den Erscheinungsformen des Bösen.
- source_word: ግፍዕ
  choice: Gewalt
  rationale: Der Ausdruck kann auch Unterdrückung oder Unrecht bezeichnen; „Gewalt“ wahrt die harte soziale Dimension und unterscheidet ihn von den benachbarten Begriffen.
- source_word: አበሳ
  choice: Sünde
  rationale: „Sünde“ ist die klare, breite moralisch-religiöse Entsprechung; „Schuld“ oder „Vergehen“ bleiben mögliche Nuancen.
theological_decisions:
- issue: Verhältnis der drei Bezeichnungen des Bösen
  choice: 'Unterschiedene Dreierreihe: „Gesetzlosigkeit, Gewalt und Sünde“'
  alternative: „Bosheit, Unterdrückung und Schuld“ oder eine zusammenfassende Wiedergabe
  rationale: Der geezische Text reiht drei koordinierte, teilweise überlappende Begriffe aneinander. Ihre Unterscheidung bewahrt die rhetorische Steigerung, ohne sie auf eine bestimmte Lehrtradition festzulegen.
- issue: Bedeutung der Vollendung der Gesetzlosigkeit
  choice: „sich vollenden“ ohne ausdrückliche Nennung eines Handelnden
  alternative: „wird zu ihrem vollen Maß gebracht“
  rationale: Der Text lässt offen, wodurch oder durch wen diese Vollendung geschieht. Die Übersetzung wahrt diese Offenheit und deutet die Aussage nicht als ausdrückliche göttliche Verursachung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht gehobenem apokalyptischem Ton. Die Satzstruktur und die wiederholten Bindewörter bleiben weitgehend erhalten; schwerfällige geezische Redundanz wird idiomatisch wiedergegeben, in der Fußnote jedoch offengelegt.
