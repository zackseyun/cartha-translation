base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/008.yaml
  text: In those days[a], violence shall be cut off from its roots[d][c][b], and iniquity together with deceit from under heaven.
translation:
  language: de
  text: In jenen Tagen[a] wird die Gewalt bis zu ihren Wurzeln abgeschnitten[b], und das Unrecht wird samt dem Trug[c] unter dem Himmel beseitigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich und idiomatisch: „in jenen Tagen“. Die Wendung verweist auf den betreffenden Zeitabschnitt der umgebenden Vision.'
    reason: cross_reference
  - marker: b
    text: Das Verb kann auch „wird verkürzt“ oder „nimmt ein Ende“ bedeuten. Hier bezieht es sich syntaktisch auf die Gewalt, nicht auf die Tage.
    reason: lexical_alternative
  - marker: c
    text: Die genaue Lesung und Abgrenzung des letzten Lasterbegriffs ist nicht völlig sicher; neben „Trug“ kommen sinngemäß auch „Arglist“ oder „Täuschung“ infrage.
    reason: textual_uncertainty
lexical_decisions:
- source_word: በአማንቱ፡ መዋዕል
  choice: In jenen Tagen
  rationale: Die Wortgruppe bildet die übliche Zeitangabe „in jenen Tagen“. Sie ist hier nicht als „in ihm werden Tage“ zu zerlegen.
- source_word: ትትገዘም
  choice: wird … abgeschnitten
  rationale: Das Verb bezeichnet ein Abschneiden, Verkürzen oder Beenden. „Abgeschnitten“ bewahrt das konkrete Bild und lässt sich mit der folgenden Wurzelmetapher verbinden.
- source_word: ግፍዕ
  choice: Gewalt
  rationale: Das Wort umfasst Gewalt, Bedrückung und schweres Unrecht. Im vorliegenden Lasterkatalog gibt „Gewalt“ die konkrete Grundbedeutung knapp und natürlich wieder.
- source_word: እምነ፡ ሥረዊሃ
  choice: an ihren Wurzeln
  rationale: Die Wendung beschreibt eine Beseitigung bis an die Wurzeln. Der Plural und das Bild radikaler Ausrottung bleiben erhalten.
- source_word: ወዓመፃ
  choice: ebenso das Unrecht
  rationale: Das Substantiv kann Unrecht, Übertretung oder Auflehnung bezeichnen. „Unrecht“ wahrt die moralische Breite, ohne die Bedeutung unnötig auf Rebellion zu verengen.
- source_word: ምስለ፡ ጕሕሉት
  choice: samt dem Trug
  rationale: ምስለ drückt Begleitung aus; das folgende, in der Überlieferung beziehungsweise Wortabgrenzung nicht völlig sichere Lasterwort wird vorsichtig als „Trug“ wiedergegeben.
- source_word: እምታሕተ፡ ሰማይ
  choice: unter dem Himmel
  rationale: Die kosmische Ortsangabe bezeichnet die Welt unter dem Himmel und erhält den apokalyptischen Horizont des Satzes.
theological_decisions:
- issue: Reichweite der Beseitigung des Bösen
  choice: Die Aussage schildert die umfassende Entfernung von Gewalt, Unrecht und Trug aus der Welt unter dem Himmel.
  alternative: Eine bloß örtliche gesellschaftliche Reform oder eine Verkürzung menschlicher Lebenszeit.
  rationale: Die Wendung „unter dem Himmel“ erweitert den Horizont, und das Wurzelbild weist auf eine grundlegende Beseitigung hin. Der Text wird dennoch bildhaft belassen und nicht in ein bestimmtes endzeitliches Lehrsystem eingeordnet.
- issue: Verhältnis der Lasterbegriffe zum einzigen ausdrücklich gesetzten Verb
  choice: „Ebenso“ macht im Deutschen kenntlich, dass das Verb „abgeschnitten“ sinngemäß auch für „Unrecht samt Trug“ gilt.
  alternative: Für den zweiten Satzteil ein zusätzliches Verb wie „wird beseitigt“ einzufügen.
  rationale: So bleibt die knappe elliptische Struktur des Ge’ez erkennbar, ohne ein im Ausgangstext nicht ausdrücklich vorhandenes zweites Verb als eigenständige Aussage einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter apokalyptischer Bildsprache. Die Formulierung vermeidet die ältere Fehlanalyse, nach der „Tage“ das Subjekt von „abgeschnitten werden“ wären. Der Zusatz „ebenso“ dient nur dazu, die im Ge’ez knappe verbale Ellipse im Deutschen verständlich zu machen.
