  to: Und nun, mein Sohn Metuschelach, ruf alle deine Brüder zu mir und versammle alle Kinder deiner Mutter bei mir. Denn ein Wort ruft mich, und ein Geist ist über mich ausgegossen[a], damit ich euch alles zeige, was euch bis in Ewigkeit widerfahren wird[b].
