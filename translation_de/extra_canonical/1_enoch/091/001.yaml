base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/001.yaml
  text: And now[a], my son Methuselah, call all your brothers to me, and gather to me all the children of your mother; for a word calls me, and a spirit of uprightness is poured out upon me[d][c][b], so that I may show you everything that will come upon you forever.
translation:
  language: de
  text: Und nun, mein Sohn Metuschelach, ruf alle deine Brüder zu mir und versammle alle Kinder deiner Mutter bei mir. Denn ein Wort ruft mich, und ein Geist ist über mich ausgegossen[a], damit ich euch alles zeige, was euch bis in Ewigkeit widerfahren wird[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »der Geist ist über mich ausgegossen«. Der äthiopische Ausdruck legt nicht eindeutig fest, ob von einem Geist allgemein oder vom göttlichen Geist die Rede ist.'
    reason: theological_ambiguity
  - marker: b
    text: Die Schlusswendung kann auch »für immer«, »für alle Zeitalter« oder im Blick auf kommende Generationen verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: Und nun
  rationale: Natürlicher, zugleich würdevoller Übergang, der die unmittelbare Fortführung der Rede wiedergibt.
- source_word: ማቱሳላ
  choice: Metuschelach
  rationale: Im Deutschen geläufige biblische Namensform.
- source_word: ጸውዕ ሊተ
  choice: ruf ... zu mir
  rationale: Gibt den Imperativ und die Bewegung in Henochs Gegenwart knapp und idiomatisch wieder.
- source_word: ኵሎ አኃዊከ
  choice: alle deine Brüder
  rationale: Bewahrt die konkrete familiäre Bezeichnung, ohne sie zu Verwandten zu verallgemeinern.
- source_word: አስተጋብእ ሊተ
  choice: versammle bei mir
  rationale: Drückt aus, dass die Genannten in Henochs Gegenwart zusammengebracht werden sollen.
- source_word: ኵሎ ደቂቀ እምከ
  choice: alle Kinder deiner Mutter
  rationale: ደቂቅ bezeichnet Kinder beziehungsweise Nachkommen und verlangt hier nicht die Verengung auf Söhne.
- source_word: እስመ ቃል ይጼውዐኒ
  choice: Denn ein Wort ruft mich
  rationale: Bewahrt das unbestimmte und möglicherweise offenbarende »Wort«, ohne dessen Ursprung näher festzulegen.
- source_word: መንፈስ ትክዕወት ላዕሌየ
  choice: ein Geist ist über mich ausgegossen
  rationale: Versteht ትክዕወት als feminine Verbform zu »ausgegossen werden«, passend zum grammatisch femininen መንፈስ, und vermeidet die sachlich unbegründete Ergänzung »der Aufrichtigkeit«.
- source_word: ከመ አርእክሙ
  choice: damit ich euch ... zeige
  rationale: Gibt den Zwecksatz verständlich wieder und lässt dessen Offenbarungscharakter im Kontext hervortreten.
- source_word: ኵሎ ዘይበጽሐክሙ
  choice: alles ..., was ... über euch kommen wird
  rationale: Bewahrt die Vorstellung eines eintreffenden beziehungsweise widerfahrenden Geschehens und den prophetischen Ton.
- source_word: እስከ ለዓለም
  choice: für immer
  rationale: Naheliegende knappe Wiedergabe der zeitlichen Wendung; ihre mögliche Reichweite wird in der Fußnote offengehalten.
theological_decisions:
- issue: Bestimmtheit und mögliche Personhaftigkeit von መንፈስ
  choice: ein Geist
  alternative: der Geist
  rationale: Der äthiopische Text erzwingt weder einen bestimmten Artikel noch die Deutung als feststehenden göttlichen Titel. Die unbestimmte Kleinschreibung im Deutschen bewahrt diese Offenheit.
- issue: Deutung von ትክዕወት
  choice: ist ... ausgegossen
  alternative: Geist der Aufrichtigkeit
  rationale: Die Form ist als Verb »ist ausgegossen« zu analysieren, nicht als Substantiv »Aufrichtigkeit«. Dadurch bleibt die Inspirationssprache des Textes erhalten, ohne eine nicht belegte moralische Qualität einzutragen.
- issue: Zeitliche Reichweite von እስከ ለዓለም
  choice: für immer
  alternative: bis in Ewigkeit / für die kommenden Zeitalter
  rationale: Die Hauptfassung folgt der unmittelbaren zeitlichen Bedeutung, während die Fußnote die denkbare eschatologische beziehungsweise generationenbezogene Weite offenhält.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem prophetischem Ton. Die Satzstruktur bleibt quellennah, wird aber durch einen Punkt nach der Versammlungsaufforderung lesbarer. Nicht quellengestützte Formulierungen wie »Geist der Aufrichtigkeit« werden vermieden.
