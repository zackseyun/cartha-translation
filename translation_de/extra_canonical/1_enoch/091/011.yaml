base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/011.yaml
  text: And from it shall be cut off the roots of oppression[a], and sinners shall be delivered up to the sword. From the blasphemers they shall be cut off in every place[d][c][b], and those who devise violence and those who commit blasphemy shall be destroyed by the sword.
translation:
  language: de
  text: Und daraus werden die Wurzeln der Unterdrückung ausgerottet[a], und die Sünder werden dem Schwert ausgeliefert. Aus der Mitte der Lästerer werden sie an jedem Ort ausgerottet[b][c], und alle, die Gewalt planen, sowie alle, die Lästerung verüben, werden im Gemetzel vernichtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der äthiopische Wortlaut dieses Verses ist textlich schwierig. Statt „Wurzeln der Unterdrückung“ wurde auch „zehn Wochen der Unterdrückung“ verstanden.
    reason: textual_variant
  - marker: b
    text: Die Zuordnung von „aus der Mitte der Lästerer“ und „an jedem Ort“ sowie der Bezug von „sie“ sind im äthiopischen Text schwierig. Die Übersetzung bewahrt diese Kürze des Wortlauts.
    reason: textual_variant
  - marker: c
    text: „Lästerer“ und „Lästerung verüben“ geben im äthiopischen Text miteinander verwandte Wörter wieder.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትገዘሙ
  choice: werden … ausgerottet
  rationale: Die Passivform bezeichnet ein Abschneiden oder Beseitigen. Bei „Wurzeln“ gibt „ausrotten“ das Bild und die apokalyptische Gerichtsschärfe natürlich wieder.
- source_word: አሥራወ ዓመፃ
  choice: Wurzeln der Unterdrückung
  rationale: Der überlieferte Wortlaut ist schwierig; im gegebenen Satzgefüge wird die in der englischen Konsultationsfassung vertretene Lesung „Wurzeln“ beibehalten. ዓመፃ umfasst Unrecht, Gewalt und Unterdrückung; „Unterdrückung“ wahrt die sozial-ethische Kraft.
- source_word: ኃጥኣን
  choice: die Sünder
  rationale: Die geläufige religiös-moralische Bezeichnung passt zum Gerichtskontext und bewahrt den apokalyptischen Ton.
- source_word: ይትሐጐሉ
  choice: werden … ausgeliefert / werden … vernichtet
  rationale: Das Verb kann ein Übergeben oder dem Untergang Preisgeben ausdrücken. Die erste Wiedergabe wahrt die gerichtliche Übergabe; im Schlussglied ergibt sich mit dem Instrument des Schlachtens idiomatisch „vernichtet“.
- source_word: በሰይፍ
  choice: dem Schwert
  rationale: Die Wendung bezeichnet das Schwert als Mittel beziehungsweise Macht des Gerichts; „dem Schwert ausgeliefert“ ist natürliches Deutsch.
- source_word: ጽሩፋን / ጽርፈት
  choice: Lästerer / Lästerung
  rationale: Die verwandten deutschen Wörter erhalten die lexikalische Verbindung zwischen Täterbezeichnung und Tat.
- source_word: በኵሉ መካን
  choice: an jedem Ort
  rationale: Formale, klare Wiedergabe der umfassenden Ortsangabe.
- source_word: ይሔልይዋ ለግፍዕ
  choice: Gewalt planen
  rationale: Das Verb bezeichnet Denken, Ersinnen oder Planen; die Formulierung erhält das Moment der Absicht.
- source_word: ይገብርዋ ለጽርፈት
  choice: Lästerung verüben
  rationale: Bewahrt die Bedeutung „tun/begehen“ und klingt im Deutschen würdig und verständlich.
- source_word: በመጥባሕት
  choice: durch das Schlachtmesser
  rationale: Das Substantiv weist konkret auf ein Messer beziehungsweise Schlachtwerkzeug oder auf Schlachtung. Diese Wiedergabe unterscheidet es vom zuvor genannten Schwert, ohne die Gewaltsamkeit abzuschwächen.
theological_decisions:
- issue: Bedeutungsumfang von ዓመፃ
  choice: Unterdrückung
  alternative: Unrecht oder Gewalt
  rationale: „Unterdrückung“ verbindet moralisches Unrecht mit sozialer Gewalt und passt zu den anschließend genannten Gewalttätern.
- issue: Gerichtsbedeutung von ይትሐጐሉ
  choice: dem Schwert ausgeliefert
  alternative: durch das Schwert getötet
  rationale: „Ausgeliefert“ erhält die Spannung zwischen gerichtlicher Übergabe und tödlichem Ausgang, statt beides in einem Verb zusammenzuziehen.
- issue: Bezug des Schlussglieds
  choice: Die Gewalt Planenden und Lästerung Verübenden sind Subjekt des letzten Gerichtsverbs.
  alternative: Sie gehören zu denen, die aus der Mitte der Lästerer ausgerottet werden.
  rationale: Das vorangehende ወ („und“) stützt die Abgrenzung eines neuen Satzglieds; die syntaktische Schwierigkeit des Abschnitts wird dennoch in einer Fußnote angezeigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit apokalyptischer Gerichtssprache. Die Wiederholungen und die Härte der Bilder bleiben erhalten; die textliche und syntaktische Unsicherheit wird nicht stillschweigend aufgelöst.
