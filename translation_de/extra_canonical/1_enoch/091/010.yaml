base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/010.yaml
  text: And the righteous one shall arise from their sleep[b][a], and wisdom shall arise and be given to them.
translation:
  language: de
  text: Und der Gerechte[a] wird sich aus ihrem Schlaf erheben, und die Weisheit wird sich erheben und ihnen gegeben werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Einzahl „der Gerechte“ kann eine bestimmte Einzelgestalt oder einen repräsentativen Gerechten bezeichnen; der Wortlaut legt dies nicht näher fest.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትነሣእ
  choice: wird sich erheben
  rationale: Das Verb bezeichnet ein Aufstehen oder Sich-Erheben. Die wiederholte Wiedergabe bewahrt den Parallelismus und lässt sowohl das Erwachen als auch eine erhöhte, apokalyptische Bedeutung anklingen.
- source_word: ጻድቅ
  choice: der Gerechte
  rationale: Die singularische Form wird ausdrücklich bewahrt. Die substantivierte deutsche Form ist würdevoll und lässt offen, ob eine bestimmte Einzelgestalt oder ein repräsentativer Gerechter gemeint ist.
- source_word: እምነዋሙ
  choice: aus seinem Schlaf
  rationale: Die Form ist als Präposition እም („aus/von“) mit ነዋም („Schlaf“) und einem maskulinen Singularsuffix zu verstehen; sie bezieht sich daher auf den zuvor genannten Gerechten.
- source_word: ጥበብ
  choice: die Weisheit
  rationale: Der Ausdruck bezeichnet hier am natürlichsten moralische beziehungsweise offenbarende Weisheit; die bestimmte Form unterstützt die im Parallelismus angelegte Personifikation, ohne sie weiter auszudeuten.
- source_word: ይትወሀብ ሎሙ
  choice: ihnen gegeben werden
  rationale: Das Passiv mit pluralischem indirektem Objekt wird schlicht und ohne zusätzliche theologische Ausdeutung wiedergegeben.
theological_decisions:
- issue: Ist ጻድቅ kollektiv oder als einzelne Gestalt zu verstehen?
  choice: Singularisch als „der Gerechte“ wiedergegeben
  alternative: „ein Gerechter“ oder kollektiv „die Gerechten“
  rationale: Die ge’ezische Form ist singularisch. Die Übersetzung wahrt mögliche individuelle, repräsentative oder messianische Anklänge, ohne sich auf eine davon festzulegen.
- issue: Bezug des Schlafes und des pluralischen Empfängers der Weisheit
  choice: „aus seinem Schlaf“ bezieht sich auf den Gerechten; „ihnen“ gibt das eigenständige Pluralpronomen des letzten Satzglieds wieder
  alternative: „aus ihrem Schlaf“
  rationale: Das Suffix an „Schlaf“ ist maskulin singularisch, während ሎሙ („ihnen“) pluralisch ist. Die unterschiedliche Numerusform wird erhalten und nicht harmonisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „wird sich erheben“ bildet den ge’ezischen Parallelismus bewusst nach. Die Spannung zwischen dem singularischen Gerechten und dem pluralischen „ihnen“ bleibt erhalten.
