    rationale: Das ge'ezische Verb bezeichnet gewalttätiges bzw. bedrückendes Unrecht. Die Paarformel fügt ohne textlichen Anlass einen zusätzlichen Begriff hinzu.
  - severity: low
    issue: Die Abfolge der Appositionen zur achten Woche klingt leicht holprig.
    rationale: Eine Umstellung verbessert die deutsche Lesbarkeit, ohne die symbolische Zählung oder den Sinn zu verändern.
