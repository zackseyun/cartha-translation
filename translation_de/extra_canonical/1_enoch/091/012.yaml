base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/012.yaml
  text: And after this there shall be another week[a], the eighth, of righteousness; and a sword shall be given to it, so that righteous judgment may be carried out against the oppressors[b], and sinners shall be delivered into the hands of the righteous.
translation:
  language: de
  text: Und danach wird eine weitere Woche kommen – die achte Woche, eine Woche der Gerechtigkeit[a]. Ihr wird ein Schwert gegeben, damit ein gerechtes Gericht gegen diejenigen vollzogen wird, die Gewalt üben; und die Sünder werden in die Hände der Gerechten ausgeliefert[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die „achte Woche“ ist eine symbolische Geschichtsperiode in der apokalyptischen Abfolge, nicht notwendig eine gewöhnliche Kalenderwoche.
    reason: cultural_note
  - marker: b
    text: '„In die Hände“ bedeutet hier: in die Macht oder Verfügungsgewalt eines anderen.'
    reason: cultural_note
lexical_decisions:
- source_word: ካልእት ሳምንት ሰንበት
  choice: eine weitere Woche kommen, die achte
  rationale: Die Formulierung markiert die nächste symbolische Geschichtsperiode und bewahrt zugleich ihre Zählung als achte Woche. „Weitere“ gibt die Abfolge natürlich wieder, ohne eine gewöhnliche Kalenderwoche anzunehmen.
- source_word: እንተ ጽድቅ
  choice: eine Woche der Gerechtigkeit
  rationale: Die Genitivverbindung beschreibt den prägenden Charakter dieser Woche. „Gerechtigkeit“ bewahrt das zentrale Leitwort und klingt im modernen Deutschen natürlich und würdig.
- source_word: ይትወሀብ ላቲ ሰይፍ
  choice: Ihr wird ein Schwert gegeben werden
  rationale: Das feminine Pronomen bezieht sich auf die Woche. Das ausdrücklich genannte Schwert bleibt als apokalyptisches Gerichtsbild erhalten und wird nicht als bloße Vollmacht ausgedeutet.
- source_word: ከመ ይትገበር ኵነኔ ጽድቅ
  choice: damit ... ein gerechtes Urteil vollstreckt wird
  rationale: Die Zweckbeziehung und der gerichtliche Vollzug werden klar wiedergegeben. „Gerechtes Urteil“ erhält sowohl die rechtliche als auch die ethisch-religiöse Bedeutung.
- source_word: እምእለ ይገፍዑ
  choice: an denen, die Unrecht und Gewalt üben
  rationale: Die verbale Form bezeichnet Menschen nach ihrem gewaltsamen oder bedrückenden Handeln. Die Umschreibung bewahrt beide Bedeutungsanteile, ohne den Ausdruck auf einen modernen politischen Fachbegriff zu verengen.
- source_word: ይትሜጠዉ ኃጥኣን በእደዊሆሙ ለጻድቃን
  choice: die Sünder werden in die Hände der Gerechten ausgeliefert werden
  rationale: Die Wendung bezeichnet die Übergabe in die Macht oder Verfügungsgewalt der Gerechten. Das konkrete biblische Bild der Hände bleibt erhalten.
theological_decisions:
- issue: Wiedergabe von ጽድቅ in der Kennzeichnung der Woche und des Urteils
  choice: „Gerechtigkeit“ beziehungsweise „gerechtes Urteil“
  alternative: „Rechtschaffenheit“ beziehungsweise „Urteil der Gerechtigkeit“
  rationale: Der gemeinsame Wortstamm und damit die thematische Verbindung zwischen der neuen Zeit und ihrem Gericht bleiben erkennbar, während idiomatisches Deutsch gewahrt wird.
- issue: Bedeutung des Schwertes
  choice: Das Schwert als apokalyptisches Gerichtsbild ausdrücklich stehen lassen
  alternative: Deutend mit „Vollmacht zum Gericht“ oder „Sieg“ wiedergeben
  rationale: Der ge'ezische Text nennt ausdrücklich ein Schwert. Ob es wörtlich oder symbolisch zu verstehen ist, entscheidet die Übersetzung nicht.
- issue: Rolle der Gerechten bei der Auslieferung der Sünder
  choice: Die Übergabe „in die Hände der Gerechten“ ohne nähere dogmatische Auslegung bewahren
  alternative: Die Gerechten ausdrücklich als Richter, Herrscher oder Vollstrecker bezeichnen
  rationale: Der Text beschreibt Machtübergabe, legt die genaue Funktion der Gerechten aber nicht abschließend fest.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die Satzstruktur bleibt nahe am Ge'ez, wird aber für natürliche deutsche Lesbarkeit gegliedert. Schlüsselbilder und mögliche theologische Spannungen werden nicht erklärend aufgelöst.
