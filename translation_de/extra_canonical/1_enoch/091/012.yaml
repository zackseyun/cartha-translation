  source_fidelity: Die Abfolge „weitere Woche, die achte“ sowie das Schwert- und Übergabebild sind im Entwurf zutreffend bewahrt. Die Wiedergabe von እምእለ ይገፍዑ als „die Unrecht und Gewalt üben“ erweitert jedoch den einzelnen Begriff unnötig zu zwei Deliktsarten; „die Gewalt üben“ gibt den gewalttätig-bedrückenden Charakter genauer und knapper wieder.
  naturalness: Der Entwurf ist insgesamt verständlich, doch die Apposition „die achte, eine Woche der Gerechtigkeit“ ist stilistisch etwas abgehackt. Eine leichte Umstellung gliedert die apokalyptische Zählung im modernen Standarddeutsch klarer. „Ein gerechtes Gericht vollzogen wird“ ist zudem die natürlichere gerichtliche Verbindung als „ein gerechtes Urteil vollstreckt wird“.
  terminology: „Gerechtigkeit“ und „gerechtes Gericht“ bewahren die wiederkehrende Wurzel ጽድቅ angemessen. „Sünder“, „Gerechte“, „Schwert“ und „in die Hände ... ausgeliefert“ sind registergerecht und vermeiden eine auslegende Festlegung.
