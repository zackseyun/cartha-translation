base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/013.yaml
  text: And at its completion[a], houses shall be chosen because of their righteousness[c][b], and the house of the great King shall be built in glory forever.
translation:
  language: de
  text: Und bei ihrer Vollendung werden Häuser aufgrund ihrer Gerechtigkeit erwählt,[a] und das Haus des großen Königs[b] wird in Herrlichkeit für immer errichtet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte ge''ezische Text lautet sinngemäß: „Häuser werden erwählt.“ Vorgeschlagen wurde jedoch, die Verbform als fehlerhaft überliefert oder verlesen zu verstehen und zu übersetzen: „Sie werden aufgrund ihrer Gerechtigkeit Häuser erwerben.“ „Häuser“ kann auch Wohnstätten oder Hausgemeinschaften meinen.'
    reason: textual_and_lexical_alternative
  - marker: b
    text: Mit dem „großen König“ ist in diesem endzeitlichen Zusammenhang wahrscheinlich Gott gemeint; der Titel selbst lässt den Bezug jedoch unausgesprochen.
    reason: theological_ambiguity
lexical_decisions:
- source_word: በተፍጻሜታ
  choice: bei ihrer Vollendung
  rationale: Die mit በ- gebildete Zeitangabe bezeichnet den Abschluss der zuvor beschriebenen apokalyptischen Periode. „Vollendung“ wahrt sowohl den zeitlichen Abschluss als auch den feierlichen Ton.
- source_word: ይመረዩ
  choice: werden … erwählt werden
  rationale: Der überlieferte Wortlaut weist auf ein passivisches Erwählen bzw. Auswählen. Trotz einer vorgeschlagenen OCR-Korrektur zu „sie werden erwerben“ folgt der Entwurf dem tatsächlich vorgelegten ge'ezischen Text und lässt die Unsicherheit in einer Fußnote erkennen.
- source_word: አብያተ
  choice: Häuser
  rationale: Der Plural wird konkret wiedergegeben und mit dem folgenden „Haus des großen Königs“ bildlich verbunden; mögliche Bedeutungen wie Hausgemeinschaften oder Wohnstätten werden nicht in den Haupttext eingetragen.
- source_word: እምጽድቅ ዚአሆሙ
  choice: aufgrund ihrer Gerechtigkeit
  rationale: Die Formulierung versteht ዚአሆሙ possessiv zu „Gerechtigkeit“ und እም kausal. So wird die jüngste philologische Korrektur übernommen, ohne das ausdrücklich genannte Substantiv „Häuser“ zu abstrahieren.
- source_word: ወይትሐነጽ
  choice: und … wird gebaut werden
  rationale: Die passive Bauaussage und das architektonische Bild bleiben formal erhalten.
- source_word: ቤት ንጉሥ ዐቢይ
  choice: das Haus des großen Königs
  rationale: „Haus“ bewahrt zugleich königliche und mögliche kultische Resonanzen; der Titel wird übersetzt, ohne den Bezug im Haupttext ausdrücklich mit Gott gleichzusetzen.
- source_word: በስብሐት
  choice: in Herrlichkeit
  rationale: Die Wendung erhält Präposition und gehobenen apokalyptischen Sprachton; „Herrlichkeit“ umfasst Ruhm und Glanz.
- source_word: እስከ ለዓለም
  choice: für immer
  rationale: Natürliche moderne Wiedergabe der Aussage dauerhafter, eschatologischer Beständigkeit.
theological_decisions:
- issue: Identität des „großen Königs“
  choice: Titel im Haupttext mit „König“ wiedergeben; wahrscheinlichen Gottesbezug nur in der Fußnote benennen
  alternative: den Ausdruck ausdrücklich als „Gottes Haus“ paraphrasieren oder auf einen irdischen König beziehen
  rationale: Der eschatologische Zusammenhang legt Gott als Bezug nahe, doch der Quelltext nennt nur den Titel. Die Übersetzung wahrt diese Spannung.
- issue: Häuser und Gerechtigkeit
  choice: das konkrete Bild der erwählten Häuser und die possessive Wendung „ihre Gerechtigkeit“ bewahren
  alternative: zu „die Gerechten werden erwählt“ abstrahieren oder „Wohnstätten werden den Gerechten zugeteilt“ paraphrasieren
  rationale: Der ge'ezische Wortlaut nennt ausdrücklich Häuser. Die konkrete Architektur verbindet beide Vershälften und sollte nicht stillschweigend vergeistigt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener apokalyptischer Bildsprache. Die doppelte Passivform ist formal, aber verständlich; sie folgt dem vorgelegten Quelltext. Sämtliche Fußnotenmarker stehen im Haupttext.
