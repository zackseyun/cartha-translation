  terminology: „Gerechtes Gericht“, „Frevler“, „Untergang“ und „Rechtschaffenheit“ sind registergerecht und inhaltlich präzise. Der Singular „Weg“ entspricht dem ge'ezischen ፍኖተ und ist beizubehalten. „Schauen auf“ bewahrt die offene Bedeutung von Hinsehen bzw. Ausrichtung, ohne ein Befolgen einzutragen.
