base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/014.yaml
  text: And after this[a], in the ninth week, the righteous judgment will be revealed to the whole world, and all the deeds of the wicked will depart from all the earth; and the world will be written down for destruction[d][c][b], and all people will look to the path of uprightness.
translation:
  language: de
  text: Und danach, in der neunten Woche[a], wird das gerechte Gericht der ganzen Welt offenbart werden. Alle Taten der Frevler werden von der ganzen Erde verschwinden; und die Welt wird zum Untergang verzeichnet werden[b], und alle Menschen werden auf den Weg der Rechtschaffenheit schauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die „Woche“ bezeichnet in der symbolischen Geschichtsordnung dieses Abschnitts eine Epoche, nicht eine gewöhnliche Siebentagewoche.
    reason: cultural_note
  - marker: b
    text: 'Die äthiopische Formulierung ist schwierig. Die aramäische Textüberlieferung stützt die Wiedergabe „die Welt wird zum Untergang verzeichnet werden“; möglich wäre nach dem äthiopischen Wortlaut auch: „Es wird für den Untergang des Zeitalters aufgeschrieben werden.“'
    reason: textual_variant
lexical_decisions:
- source_word: በሰንበት ታስዕ
  choice: in der neunten Woche
  rationale: Im Kontext der Wochenapokalypse bezeichnet ሰንበት eine Woche beziehungsweise symbolische Epoche, nicht einen einzelnen Sabbattag.
- source_word: ኵነኔ ጽድቅ
  choice: das gerechte Gericht
  rationale: Die Formulierung bewahrt sowohl den richterlichen als auch den ethisch-rechten Sinn der Wortgruppe und klingt im Deutschen natürlich.
- source_word: ትትከሠት ለኵሉ ዓለም
  choice: wird der ganzen Welt offenbart werden
  rationale: Die passive Offenbarung des Gerichts und der Dativ mit ለ werden transparent wiedergegeben; ዓለም bezeichnet hier am ehesten die Welt als Empfängerkreis.
- source_word: ተግባረ ረሲዓን
  choice: die Taten der Frevler
  rationale: „Taten“ erhält die konkrete Bedeutung der Werke; „Frevler“ gibt die moralisch-religiöse Färbung würdig und knapp wieder.
- source_word: ይወፅእ እምዲበ ኵሉ ምድር
  choice: werden von der ganzen Erde verschwinden
  rationale: Das wörtliche Hinausgehen wird im Zusammenhang als Entfernung verstanden, ohne einen handelnden Beseitiger hinzuzufügen.
- source_word: ይጽሐፍ ለሐጕለ ዓለም
  choice: die Welt wird zum Untergang aufgeschrieben werden
  rationale: Die durch die aramäische Textüberlieferung gestützte Syntax behandelt „die Welt“ als Subjekt und wahrt zugleich das auffällige apokalyptische Bild des Aufschreibens zum Untergang.
- source_word: ይኔጽሩ ለፍኖተ ርትዕ
  choice: werden auf den Weg der Rechtschaffenheit schauen
  rationale: „Schauen“ lässt die mögliche Bedeutung zwischen Hinblicken, Beachten und Sich-Ausrichten offen; „Weg“ steht entsprechend der äthiopischen und aramäischen Form im Singular.
theological_decisions:
- issue: Symbolische Bedeutung der neunten Woche
  choice: Woche im Haupttext, mit Erklärung als Epoche in der Fußnote
  alternative: Sabbat oder Zeitabschnitt
  rationale: Die Bildsprache der Wochenapokalypse soll erhalten bleiben, ohne eine buchstäbliche Siebentagewoche nahezulegen.
- issue: Syntax und Sinn von ይጽሐፍ ለሐጕለ ዓለም
  choice: die Welt wird zum Untergang aufgeschrieben werden
  alternative: es wird für den Untergang des Zeitalters geschrieben werden; es wird zur ewigen Vernichtung aufgeschrieben werden
  rationale: Die aramäische Lesart stützt „Welt“ als Subjekt. Eine Fußnote hält fest, dass die äthiopische Formulierung schwierig ist und auch anders gegliedert werden kann, ohne die Spannung dogmatisch aufzulösen.
- issue: Reaktion der Menschheit auf den rechten Weg
  choice: auf den Weg der Rechtschaffenheit schauen
  alternative: den Weg der Rechtschaffenheit beachten oder einhalten
  rationale: Die Übersetzung vermeidet es, bloße Hinwendung bereits als vollständigen Gehorsam auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe an der apokalyptischen Reihung des Ausgangstextes. Fachsprachlich veraltete Wendungen werden vermieden; echte textliche und semantische Unsicherheit wird in einer Fußnote offengelegt.
