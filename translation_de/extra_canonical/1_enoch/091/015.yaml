base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/015.yaml
  text: And after this[a], in the tenth week, in the seventh part, there shall be the eternal judgment [and it shall be executed by the watchers of the eternal heaven][b], a great judgment that will be exacted in the midst of the angels.
translation:
  language: de
  text: Und danach, in der zehnten Woche, in ihrem siebten Teil, wird das ewige Gericht stattfinden [und es wird von den Wächtern des ewigen Himmels vollzogen werden][a] – ein großes Gericht, das inmitten der Engel vollzogen wird.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die in eckigen Klammern stehenden Worte sind auch in der vorliegenden Quellenausgabe als textlich unsicher beziehungsweise eingeschoben gekennzeichnet.
    reason: textual_variant
  - marker: b
    text: Die zugrunde liegende Verbform kann auch im Sinn von »Vergeltung üben« oder »Rache nehmen« verstanden werden. Die Übersetzung folgt hier der passiven Deutung »vollzogen wird« und vermeidet damit eine stärkere Festlegung.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ወእምድኅረ ዝ
  choice: Und danach
  rationale: Gibt die zeitliche Übergangsformel knapp und natürlich wieder.
- source_word: በሰንበት ዓሥርት ፯እደ
  choice: in der zehnten Woche, in ihrem siebten Teil
  rationale: Der Wortlaut nennt im Rahmen der Wochenapokalypse ausdrücklich die zehnte Woche und anschließend deren siebten Teil; »Woche« bewahrt die symbolische Periodisierung.
- source_word: ኵነኔ እንተ ለዓለም
  choice: das ewige Gericht
  rationale: ኵነኔ bezeichnet hier Gericht beziehungsweise Verurteilung; እንተ ለዓለም kennzeichnet es als ewig beziehungsweise immerwährend.
- source_word: ወትትገበር እምትጉሃነ ሰማይ ዘለዓለም
  choice: und es wird von den Wächtern des ewigen Himmels vollzogen werden
  rationale: Die passive Konstruktion und die Bezeichnung der himmlischen Wächter werden erhalten; die in der Edition eingeklammerte Klausel bleibt auch in der Übersetzung sichtbar eingeklammert.
- source_word: ዐቢይ ዘይትቤቀል እማእከሎሙ ለመላእክት
  choice: ein großes Gericht, das mitten unter den Engeln vollstreckt werden wird
  rationale: ዐቢይ wird als »groß« wiedergegeben, die passive Gerichtsaussage nicht durch das stärker deutende »Rache nehmen« vereindeutigt, und »mitten unter den Engeln« folgt der räumlich-sozialen Wendung.
theological_decisions:
- issue: Rolle der Wächter beim ewigen Gericht
  choice: Die Wächter erscheinen grammatisch als Ausführende des Gerichts, ohne ihre genaue Identität oder Vollmacht weiter zu bestimmen.
  alternative: Gott selbst vollzieht das Gericht, oder »Wächter« wird als allgemeine Bezeichnung für Engel erklärt.
  rationale: Die eingeklammerte ge’ezische Klausel nennt die Wächter ausdrücklich; eine dogmatische Identifizierung oder Harmonisierung wäre über den Wortlaut hinausgehend.
- issue: Bedeutung des Gerichts unter den Engeln
  choice: Die Engel werden als der Bereich dargestellt, in dem das Gericht vollstreckt wird.
  alternative: Das Gericht rächt sich aktiv an den Engeln oder wird durch die Engel vollzogen.
  rationale: Die passive Wiedergabe bewahrt die syntaktische und theologische Spannung des schwierigen Wortlauts, ohne den Gegenstand oder die Ausführenden des Gerichts im Schlusssatz festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit apokalyptischem Sprachklang. Die symbolische »Woche« und die Wiederholung von »Gericht« bleiben zur Wahrung der Struktur erhalten; textliche Unsicherheit und mögliche Vergeltungsbedeutung werden nicht stillschweigend aufgelöst.
