base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/007.yaml
  text: And when sin and transgression and blasphemy and violence increase in every deed, and lawlessness and wrongdoing and uncleanness increase, a great punishment will come from heaven upon them all, and the Holy Lord will come forth in wrath and in punishment, to execute judgment upon the earth.
translation:
  language: de
  text: Und wenn Sünde, Übertretung, Lästerung und Gewalt in allem Tun zunehmen und Gesetzlosigkeit, Unrecht und Unreinheit sich mehren, wird eine große Strafe[a] vom Himmel über sie alle kommen. Der heilige Herr wird im Zorn und zur Strafe hervortreten, um auf der Erde Gericht zu halten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine große Plage“ beziehungsweise „eine schwere Geißel“. Das äthiopische Wort kann sowohl Strafe allgemein als auch eine konkrete strafende Heimsuchung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወእመኒ
  choice: Und wenn
  rationale: Die einleitende Partikel eröffnet einen temporalen beziehungsweise konditionalen Vordersatz; „wenn“ bewahrt diese Struktur natürlich im Deutschen.
- source_word: ትልህቅ / ትለህቅ
  choice: zunehmen / sich mehren
  rationale: Das wiederholte Verb bezeichnet die Steigerung des Bösen. Die leichte Variation vermeidet schwerfällige Wiederholung, ohne den Parallelismus aufzulösen.
- source_word: ኃጢአት
  choice: Sünde
  rationale: Die übliche religiös-ethische Entsprechung bewahrt die volle moralische Aussage.
- source_word: ዓመፃ
  choice: Übertretung
  rationale: Bezeichnet die Verletzung der rechten Ordnung und bleibt von dem später genannten allgemeinen Unrecht unterscheidbar.
- source_word: ጽርፈት
  choice: Lästerung
  rationale: Erfasst ehrverletzende und wahrscheinlich gegen Gott gerichtete Rede, ohne die Bedeutung unnötig auf eine feste Lehrformel zu verengen.
- source_word: ግፍዕ
  choice: Gewalt
  rationale: Gibt brutale Unterdrückung und gewaltsames Unrecht knapp und eindringlich wieder.
- source_word: በኵሉ ተግባር
  choice: in allem Tun
  rationale: Bewahrt den umfassenden Sinn und klingt im Deutschen natürlicher als „in jeder Tat“.
- source_word: ዕልወት
  choice: Gesetzlosigkeit
  rationale: Erhält den apokalyptisch-rechtlichen Charakter des Ausdrucks.
- source_word: አበሳ
  choice: Unrecht
  rationale: Ein breiter moralischer Begriff, der sich von Sünde und Übertretung noch hinreichend abhebt.
- source_word: ርኵስ
  choice: Unreinheit
  rationale: Bewahrt sowohl moralische als auch mögliche kultische Anklänge.
- source_word: መቅሠፍት ዐቢይ
  choice: eine große Strafe
  rationale: Im Zusammenhang mit Zorn und Gericht steht die vergeltende Bedeutung im Vordergrund; mögliche konkretere Bedeutungen werden in der Fußnote erhalten.
- source_word: እግዚእ ቅዱስ
  choice: der heilige Herr
  rationale: Gibt die kompakte Gottesbezeichnung würdig wieder, ohne sie an eine spätere feststehende Formel anzugleichen.
- source_word: በመዓት ወበመቅሠፍት
  choice: in Zorn und Strafgericht
  rationale: Bewahrt die beiden koordinierten Bestimmungen. „Strafgericht“ vermeidet im Deutschen die unbeholfene Wiederholung von „Strafe“, während der punitive Sinn erhalten bleibt.
- source_word: ይግበር ኵነኔ ዲበ ምድር
  choice: um auf der Erde Gericht zu halten
  rationale: Eine natürliche, würdige Wiedergabe des Zwecksatzes und der gerichtlichen Handlung.
theological_decisions:
- issue: Wiedergabe der Gottesbezeichnung እግዚእ ቅዱስ
  choice: der heilige Herr
  alternative: der Herr, der Heilige
  rationale: Die gewählte Fassung behandelt die Wörter als kompakte Gottesbezeichnung und bewahrt sowohl Herrschaft als auch Heiligkeit, ohne spätere kanonische Formeln einzutragen.
- issue: Bedeutung von መቅሠፍት
  choice: Strafe / Strafgericht
  alternative: Plage / Geißel
  rationale: Der ausdrückliche Gerichtskontext legt die punitive Bedeutung nahe. Da das Wort zugleich eine konkrete strafende Heimsuchung bezeichnen kann, bleibt diese Möglichkeit in der Fußnote sichtbar.
- issue: Verhältnis von Vordersatz und Gerichtsaussage
  choice: temporale Bedingungsstruktur mit „wenn“ und folgendem Hauptsatz
  alternative: Folge selbstständiger Zukunftsaussagen
  rationale: Die einleitende Partikel verbindet die Zunahme des Bösen mit dem kommenden Gericht, ohne festzulegen, ob der Akzent rein zeitlich oder zugleich bedingend ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptisch-gerichtlichem Ton. Die Aufzählung bleibt klar gegliedert; altertümliche oder konfessionell festgelegte Formulierungen werden vermieden. Sämtliche Fußnotenmarker stehen im Haupttext.
