base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/091/016.yaml
  text: And the first heaven shall depart and pass away[a], and a new heaven shall appear[b], and all the powers of the heavens shall shine sevenfold forever.
translation:
  language: de
  text: Und der erste Himmel wird weichen und vergehen, und ein neuer Himmel wird erscheinen; und alle Mächte der Himmel[a] werden für immer siebenfach leuchten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Heerscharen der Himmel“. Der ge''ezische Ausdruck kann Mächte, Kräfte oder himmlische Heerscharen bezeichnen und sowohl Himmelskörper als auch himmlische Wesen einschließen.'
    reason: lexical_alternative
  - marker: b
    text: Die Schlusswendung ist schwierig. Wahrscheinlich ist gemeint, dass sie „siebenfach“ oder „siebenmal heller“ leuchten. Wegen der nicht völlig klaren überlieferten ge'ezischen Form bleibt auch die genaue Verbindung mit „für immer“ unsicher.
    reason: textual_variant
lexical_decisions:
- source_word: ሰማይ፡ ቀዳማይ፡
  choice: der erste Himmel
  rationale: ቀዳማይ bezeichnet das Erste oder Frühere in einer Abfolge. „Der erste Himmel“ bewahrt den konkreten apokalyptischen Gegensatz zum folgenden „neuen Himmel“, ohne vorwegzunehmen, ob Ersetzung oder Erneuerung gemeint ist.
- source_word: ይወፅእ፡ ወየኃልፍ፡
  choice: wird weichen und vergehen
  rationale: Die beiden Verben bezeichnen ein Hinausgehen beziehungsweise Fortgehen und ein Vorüber- oder Vergehen. Die deutsche Doppelung erhält die Bewegung und Nachdrücklichkeit des Ausgangstextes, ohne ausdrücklich Vernichtung zu behaupten.
- source_word: ሰማይ፡ ሐዲስ፡
  choice: ein neuer Himmel
  rationale: ሐዲስ bedeutet „neu“ oder „frisch“. „Ein neuer Himmel“ ist direkt und deutet den Vorgang nicht vorschnell als bloße Erneuerung.
- source_word: ይትረአይ፡
  choice: wird erscheinen
  rationale: Die Form kann „wird gesehen werden“, „wird sichtbar werden“ oder „wird erscheinen“ bedeuten. „Wird erscheinen“ ist im Deutschen natürlich und bewahrt den visionären Charakter.
- source_word: ኵሉ፡ ኃይለ፡ ሰማያት፡
  choice: alle Mächte der Himmel
  rationale: ኃይል kann Kraft, Macht oder Heerschar bezeichnen. „Mächte der Himmel“ hält offen, ob himmlische Wesen, Gestirne oder kosmische Kräfte gemeint sind; der Plural „Himmel“ entspricht ሰማያት.
- source_word: ያበርህ፡
  choice: werden leuchten
  rationale: Das Verb bezeichnet Leuchten oder Lichtgeben. „Leuchten“ gibt das kosmische Bild knapp und anschaulich wieder.
- source_word: ሰብዓተ፡ ምእዕቢተ።
  choice: für immer siebenfach
  rationale: ሰብዓተ weist klar auf sieben beziehungsweise Siebenfachheit. Die gesamte Schlusswendung ist in der überlieferten Form schwierig; die Wiedergabe folgt vorsichtig dem wahrscheinlichen Sinn einer siebenfach gesteigerten und andauernden Helligkeit und kennzeichnet die Unsicherheit in einer Fußnote.
theological_decisions:
- issue: Ersetzung oder Erneuerung des Kosmos
  choice: 'Die visionäre Abfolge bleibt bestehen: Der erste Himmel vergeht, und ein neuer erscheint.'
  alternative: Entweder vollständige Ersetzung des alten Kosmos oder dessen Erneuerung und Verwandlung.
  rationale: Der ge'ezische Text schildert einen Kontrast und eine Abfolge, legt aber keine systematische Kosmologie vor. Die Übersetzung entscheidet daher nicht zwischen völliger Ersetzung und verwandelnder Erneuerung.
- issue: Identität der „Mächte der Himmel“
  choice: Die mehrdeutige Bezeichnung „Mächte“ bleibt im Haupttext erhalten.
  alternative: „Heerscharen der Himmel“ oder eine ausdrückliche Identifikation als Gestirne beziehungsweise Engel.
  rationale: Der Quellbegriff kann Kräfte, himmlische Heerscharen, Himmelskörper oder himmlische Wesen bezeichnen. Eine engere Festlegung wäre exegetisch überbestimmt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper apokalyptischer Bildsprache. Die Verbfolge „weichen und vergehen“ wahrt die Doppelung des Ausgangstextes; das Semikolon gliedert den kosmischen Übergang und die anschließende Aussage über die himmlischen Mächte.
