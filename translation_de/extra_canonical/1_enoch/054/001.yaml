base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/001.yaml
  text: And I looked and turned to another part of the earth[b][a], and I saw there a deep valley with burning fire.
translation:
  language: de
  text: Und ich blickte hin und wandte mich einem anderen Teil der Erde zu[a]. Dort sah ich ein tiefes Tal, in dem Feuer brannte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »einem anderen Angesicht der Erde«; gemeint ist eine andere Gegend oder Seite der Erde.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »ein tiefes Tal mit brennendem Feuer«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ነጸርኩ
  choice: ich blickte hin
  rationale: Das erste Wahrnehmungsverb wird von dem späteren »ich sah« unterschieden und leitet die neue Blickrichtung der Vision ein.
- source_word: ተመየጥኩ
  choice: wandte mich … zu
  rationale: Die Wendung gibt die Änderung der Blick- oder Bewegungsrichtung natürlich wieder, ohne eine rein körperliche Ortsbewegung festzulegen.
- source_word: ካልአ ገጸ ምድር
  choice: einem anderen Teil der Erde
  rationale: Wörtlich steht »einem anderen Angesicht der Erde«; »Teil« vermittelt im Deutschen den räumlichen Sinn, während die konkrete Ausgangsmetapher in der Fußnote erhalten bleibt.
- source_word: ርኢኩ
  choice: ich sah
  rationale: Das gewöhnliche und klare deutsche Äquivalent für das zentrale Wahrnehmungsverb der Vision.
- source_word: ህየ
  choice: dort
  rationale: Das Ortsadverb verweist auf den soeben genannten anderen Teil der Erde.
- source_word: ቈላ ዕሙቀ
  choice: ein tiefes Tal
  rationale: Die Verbindung bezeichnet eine durch Tiefe gekennzeichnete Senke oder ein Tal; »tiefes Tal« bewahrt das topografische Bild, ohne es unnötig zu präzisieren.
- source_word: እንዘ ትነድድ እሳት
  choice: in dem Feuer brannte
  rationale: Die verbale deutsche Fassung gibt den fortdauernden Brand anschaulich und natürlich wieder; die syntaktisch mögliche knappere Zuordnung als »mit brennendem Feuer« bleibt in der Fußnote vermerkt.
