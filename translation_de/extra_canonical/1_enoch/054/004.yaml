base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/004.yaml
  text: And I asked the angel of peace who went with me[a], saying[b], “These chains of the instruments—for whom are they being prepared?”
translation:
  language: de
  text: 'Und ich fragte den Engel des Friedens, der mit mir ging: »Für wen werden diese Ketten der Geräte[a] bereitgemacht?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das hier überlieferte ge’ezische Wort ist unsicher und steht in dieser Textausgabe in Klammern. Es kann „Geräte“, „Werkzeuge“ oder „Instrumente“ bezeichnen. Auch die genaue Verbindung mit „Ketten“ ist unsicher; möglich ist etwa: „diese Ketten, diese Geräte“.'
    reason: textual_variant
lexical_decisions:
- source_word: ተስእእክዎ
  choice: ich fragte
  rationale: Das Verb bezeichnet Henochs direkte Frage an den begleitenden Engel; „fragte“ ist im Deutschen natürlich und fügt keine zusätzliche Deutung hinzu.
- source_word: መልአከ ሰላም
  choice: den Engel des Friedens
  rationale: Die Genitivverbindung wird als titelartige Bezeichnung des himmlischen Begleiters bewahrt; „friedlicher Engel“ würde sie zu einer bloßen Eigenschaft abschwächen.
- source_word: ዘየሐውር ምስሌየ
  choice: der mit mir ging
  rationale: Die Relativkonstruktion kennzeichnet den Engel als Henochs Begleiter und bewahrt zugleich die im Ausgangstext ausgedrückte Bewegung.
- source_word: እሉ እስረተ
  choice: diese Fesseln
  rationale: Der Ausdruck verweist auf konkrete, in der Vision sichtbare Gegenstände. „Fesseln“ gibt den Straf- und Gefangenschaftskontext wieder, ohne ihre genaue Gestalt festzulegen.
- source_word: መበልዕት
  choice: diese Strafgeräte
  rationale: Die eingeklammerte und unsichere Lesart scheint Geräte oder Werkzeuge im Zusammenhang mit der Bestrafung zu bezeichnen. „Strafgeräte“ macht den Kontext verständlich, während die Fußnote die textliche und lexikalische Unsicherheit offenlegt.
- source_word: ለመኑ ይዴለዉ
  choice: für wen werden … bereitgemacht
  rationale: Die Formulierung fragt nach den vorgesehenen Empfängern der Gegenstände und bewahrt den passiven, vorausweisenden Sinn der Vorbereitung.
theological_decisions:
- issue: Art der Strafgegenstände in der Vision
  choice: Die Gegenstände werden konkret als „Fesseln“ und möglicherweise näher erläuternd als „Strafgeräte“ wiedergegeben.
  alternative: „Strafe“ oder „Gericht“ als abstrakte Sammelbegriffe
  rationale: Der Ausgangstext beschreibt sichtbare Gegenstände und fragt, für wen sie bereitgemacht werden. Die konkrete apokalyptische Bildsprache bleibt daher erhalten, ohne die Gegenstände zu einer allgemeinen Lehraussage über das Gericht zu verflachen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist flüssig gestaltet; die Apposition „diese Strafgeräte“ wahrt die im schwierigen Ausgangstext bezeugte zusätzliche Sachbezeichnung, während die Fußnoten sowohl die Lesart als auch das Verhältnis der beiden Substantive als unsicher kennzeichnen.
