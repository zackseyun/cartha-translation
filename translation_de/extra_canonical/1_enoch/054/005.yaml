base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/005.yaml
  text: And he said to me[a], “These are being prepared for the host of Azazʾel, so that they may take them and cast them into the lowest part of the place of judgment; and they will cover their jaws with rough stones[e][d][c][b], just as the Lord of Spirits commanded.”
translation:
  language: de
  text: 'Und er sagte zu mir: „Diese werden für Azazels Gefolge[a] bereitgemacht, damit dessen Angehörige sie ergreifen und in den tiefsten Teil des Gerichtsortes[b] werfen; und sie werden ihre Kiefer mit rauen Steinen bedecken, wie der Herr der Geister befohlen hat.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die ge’ezische Wendung ist textlich schwierig. Statt „für Azazels Gefolge“ sind auch Deutungen wie „für das Werk Azazels“, „für die Anhänger Azazels“ oder „für das Heer Azazels“ möglich.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich beziehungsweise nach anderer Auffassung: „unter allem Gericht“. Der Zusammenhang legt jedoch einen tief gelegenen Ort des Gerichts nahe. Die vorliegende ge’ezische Transkription liest später „ihre Engel“; wahrscheinlich beruht dies auf einer Verwechslung mit „ihre Kiefer/Wangen“.'
    reason: textual_and_lexical_note
lexical_decisions:
- source_word: ይዴለዉ
  choice: werden bereitgemacht
  rationale: Die Form bezeichnet Bereitmachung beziehungsweise Bereitschaft; das Passiv gibt die zielgerichtete Vorbereitung in der Gerichtsszene natürlich wieder.
- source_word: ለትዕይንተ አዛዜኤል
  choice: für das Gefolge Asaëls
  rationale: Die schwierige Wendung wird aufgrund der folgenden Pluralbezüge als Kollektiv verstanden. „Gefolge“ wahrt die Verbindung zu Asaël, ohne unnötig eine militärische Bedeutung festzulegen.
- source_word: አዛዜኤል
  choice: Asaël
  rationale: Die eingedeutschte Transliteration bleibt der ge'ezischen Namensform erkennbar nahe.
- source_word: ይትመጠውዎሙ
  choice: damit man sie ergreift
  rationale: Das Verb bezeichnet ein Nehmen oder Packen; „ergreifen“ passt zur gewaltsamen Abführung in der Gerichtsszene.
- source_word: ወይደይዎሙ
  choice: und … wirft
  rationale: Die Wendung drückt ein Hinabwerfen aus. Das deutsche Verb hält das Bild kraftvoll, ohne altertümlich zu wirken.
- source_word: መትሕተ ኵሉ ደይን
  choice: in den untersten Teil des Strafortes
  rationale: Die räumliche Abwärtsbewegung und der konkrete Ort der Ahndung werden wiedergegeben; „Strafort“ vermeidet die spätere dogmatische Festlegung auf „Hölle“.
- source_word: አእባኒ ጠያያነ
  choice: mit rauen Steinen
  rationale: Das Substantiv bezeichnet Steine, das Adjektiv ihre raue beziehungsweise unregelmäßige Beschaffenheit.
- source_word: ይክድኑ
  choice: man wird … bedecken
  rationale: Die aktive Pluralform führt die handelnde Gruppe fort; das unpersönliche „man“ ist im Deutschen natürlich, da die Handelnden nicht eigens benannt werden.
- source_word: መላእክቲሆሙ / emendiert መላትሒሆሙ
  choice: ihre Kiefer
  rationale: Der überlieferte Transkriptionstext beruht wahrscheinlich auf einer OCR-Verwechslung. Die emendierte Lesart „ihre Kiefer/Wangen“ passt zur Grammatik, zum Strafbild und zur Parallele in 1 Henoch 10,4.
- source_word: እግዚአ መናፍስት
  choice: der Herr der Geister
  rationale: Der feststehende Gottesname der Bilderreden wird wörtlich und konsistent wiedergegeben.
theological_decisions:
- issue: Identität der mit Asaël verbundenen Gruppe
  choice: ein Asaël zugehöriges Kollektiv („das Gefolge Asaëls“)
  alternative: das Werk beziehungsweise die Tat Asaëls; die Anhänger Asaëls; das Heer Asaëls
  rationale: Die Textgestalt ist schwierig. Die pluralischen Bezüge im Fortgang sprechen für eine Personengruppe, doch die Fußnote hält die sachlichen Alternativen offen.
- issue: Deutung von መትሕተ ኵሉ ደይን
  choice: ein räumlich gedachter Strafort
  alternative: unter allem Gericht; unter jedes Gericht
  rationale: Der Kontext schildert ein Hinabwerfen an einen konkreten Ort. „Strafort“ bewahrt die henochische Gerichtstopografie, ohne sie mit einer späteren Höllenvorstellung gleichzusetzen.
- issue: Lesart des mutmaßlich fehlerhaft transkribierten Wortes መላእክቲሆሙ
  choice: ihre Kiefer
  alternative: ihre Engel beziehungsweise Boten
  rationale: Grammatik, Bildzusammenhang und die Parallele zu Asaëls Bestrafung stützen die Emendation zu „Kiefer/Wangen“. Weil die vorgelegte Transkription tatsächlich „ihre Engel“ bietet, wird die Abweichung transparent in einer Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer apokalyptischer Bildsprache. Die Übersetzung vermeidet sowohl unnötigen Archaismus als auch die dogmatisch stärker festgelegte Wiedergabe „Hölle“. Unsichere Lesarten werden nicht stillschweigend harmonisiert, sondern durch Fußnoten offengelegt.
