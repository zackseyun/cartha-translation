revisions:
- from: Und in jenen Tagen wird die Strafe des Herrn der Geister kommen, und alle Vorratskammern der Wasser oberhalb der Himmel[a] [und die Quellen unterhalb der Himmel][b] und die unter der Erde werden geöffnet werden.
  to: Und in jenen Tagen wird die Strafe des Herrn der Geister kommen, und alle Vorratskammern der Wasser über den Himmeln[a], [und die Quellen unterhalb der Himmel][b] sowie die Quellen unter der Erde werden geöffnet.
  rationale: Die Revision behebt die deutsche Satzstruktur und die Passivform. Sie macht die im Ge’ez nach der eingeklammerten Wendung erneut genannten Quellen unter der Erde explizit, ohne die überlieferte, möglicherweise verdoppelte Zwischenwendung zu glätten oder ihre Unsicherheit zu verdecken.
