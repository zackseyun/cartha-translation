  - severity: medium
    issue: Nicht idiomatische doppelte Passivbildung
    rationale: Nach dem finiten „wird“ im ersten Teilsatz lautet das zukünftige Passiv im koordinierten Hauptsatz „werden geöffnet“, nicht „werden geöffnet werden“.
