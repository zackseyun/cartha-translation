base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/007.yaml
  text: And in those days the punishment from the Lord of Spirits will come[b][a], and all the storehouses of the waters that are above the heavens [and the fountains that are beneath the heavens] and those beneath the earth will be opened.
translation:
  language: de
  text: Und in jenen Tagen wird die Strafe des Herrn der Geister kommen, und alle Vorratskammern der Wasser über den Himmeln[a], [und die Quellen unterhalb der Himmel][b] sowie die Quellen unter der Erde werden geöffnet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die „Vorratskammern der Wasser“ gehören zum antiken kosmologischen Bild himmlischer Wasserreserven, die für Gottes Gericht aufbewahrt werden.
    reason: cultural_note
  - marker: b
    text: Die eingeklammerte Wendung ist im vorliegenden Textzeugen überliefert, wirkt aber möglicherweise wie eine gestörte oder verdoppelte Lesart neben der anschließenden Angabe „unter der Erde“.
    reason: textual_variant
lexical_decisions:
- source_word: መዋዕል
  choice: Tage
  rationale: Mit በውእቱ bildet das Wort die geläufige apokalyptische Zeitformel „in jenen Tagen“.
- source_word: መቅሠፍቱ
  choice: Strafe
  rationale: Der Ausdruck bezeichnet eine strafende Heimsuchung; „Strafe“ bewahrt die gerichtliche Kraft, ohne ihre konkrete Form vorwegzunehmen.
- source_word: እግዚአ መናፍስት
  choice: Herr der Geister
  rationale: Die wörtliche und im Henochbuch charakteristische Titelform bleibt erhalten.
- source_word: ታርሑ
  choice: werden geöffnet werden
  rationale: Das Passiv entspricht der Form des Ausgangstextes und passt sowohl zu Vorratskammern als auch zu Quellen.
- source_word: መዛግብተ ማያት
  choice: Vorratskammern der Wasser
  rationale: Die Formulierung gibt das antike kosmologische Bild himmlischer Wasservorräte konkret und verständlich wieder.
- source_word: ዘመልዕልተ ሰማያት
  choice: oberhalb der Himmel
  rationale: Der Plural und die räumliche Schichtung der kosmologischen Vorstellung werden bewahrt.
- source_word: አንቅዕተ
  choice: Quellen
  rationale: „Quellen“ ist im heutigen Deutsch natürlich und bezeichnet die kosmischen Wasseraustritte treffend.
- source_word: መትሕተ ምድር
  choice: unter der Erde
  rationale: Die schlichte räumliche Wendung entspricht dem Ge’ez und ist im Deutschen idiomatisch.
theological_decisions:
- issue: Art des kommenden Gerichts
  choice: Die konkrete kosmische Wasserbildsprache bleibt stehen.
  alternative: Die Passage als allgemeine oder rein metaphorische Strafe wiederzugeben.
  rationale: Der Text nennt ausdrücklich Wasservorräte und Quellen; diese apokalyptische Gerichtsbildsprache darf nicht verallgemeinert oder spiritualisiert werden.
- issue: Textlich auffällige Wiederholung
  choice: Die überlieferte eingeklammerte Wendung wird im Haupttext sichtbar bewahrt.
  alternative: Die Wendung als bloße Verdoppelung auszulassen.
  rationale: Da sie in der vorgelegten Ge’ez-Quelle vorhanden ist und die Überlieferung unsicher erscheint, soll die echte textliche Spannung nicht stillschweigend beseitigt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter apokalyptischer Bildsprache. Der ungewöhnliche Plural „Himmel“ und der Titel „Herr der Geister“ werden aus Gründen der Form- und Motivtreue beibehalten.
