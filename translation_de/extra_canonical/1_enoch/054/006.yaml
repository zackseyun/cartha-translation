base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/006.yaml
  text: And Michael and Gabriel and Raphael and Phanuel—they will seize them on that great day and cast them into the burning furnace on that day[a], so that the Lord of Spirits may take vengeance on them for their lawlessness[c][b], because they became servants of Satan and led astray those who dwell upon the dry land.
translation:
  language: de
  text: Und Michael, Gabriel, Rafael und Phanuel – sie werden sie an jenem großen Tag ergreifen[a] und sie an jenem Tag in den brennenden Ofen werfen, damit der Herr der Geister wegen ihrer Gesetzlosigkeit an ihnen Vergeltung übt, weil sie Diener Satans wurden[b] und die irreführten, die auf dem trockenen Land wohnen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „festhalten“. Das Ge’ez-Verb bezeichnet ein kraftvolles Ergreifen; die genaue Nuance ist in diesem nur auf Ge’ez erhaltenen Abschnitt schwer zu bestimmen.'
    reason: lexical_alternative
  - marker: b
    text: Die Wendung ist textlich und lexikalisch schwierig. Möglich sind auch „Sklaven Satans“ oder, weniger wahrscheinlich, „Boten Satans“.
    reason: textual_variant
  - marker: c
    text: 'Wörtlich: „auf dem trockenen Land“. Gemeint sein können allgemein die Bewohner der Erde; die konkrete Ausdrucksweise des Ge’ez wurde beibehalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ያፀንዕዎሙ
  choice: sie werden sie … ergreifen
  rationale: Das Verb bezeichnet ein kraftvolles Ergreifen oder Festhalten. „Ergreifen“ bewahrt den gewaltsamen und gerichtlichen Charakter, ohne die Handlung durch „fesseln“ zu präzisieren.
- source_word: ዕለት ዐባይ
  choice: jener große Tag
  rationale: Die knappe apokalyptische Formel bleibt erhalten; eine erklärende Erweiterung zu „Gerichtstag“ wäre interpretierend.
- source_word: እቶን ዘይነድድ
  choice: der brennende Ofen
  rationale: Die konkrete Feuerdarstellung wird direkt und in natürlichem Deutsch wiedergegeben.
- source_word: ይወድይዎሙ
  choice: in … werfen
  rationale: „Werfen“ gibt die gewaltsame Strafhandlung klar wieder und klingt im heutigen Deutsch natürlicher als „schleudern“.
- source_word: ይትበቀል
  choice: Vergeltung übt
  rationale: Die Formulierung erhält den Gedanken retributiver Gerechtigkeit und mildert ihn nicht zu einem allgemeinen „straft“ oder „richtet“ ab.
- source_word: በዓመፃሆሙ
  choice: für ihre Gesetzlosigkeit
  rationale: „Gesetzlosigkeit“ bewahrt das starke moralische und gerichtliche Gewicht des Begriffs; „Unrecht“ wäre schwächer, „Auflehnung“ enger.
- source_word: ላእከ ሰሰይጣን
  choice: Diener Satans
  rationale: Die schwierige Wendung bezeichnet am ehesten Zugehörigkeit beziehungsweise Dienst für Satan. „Diener“ vermeidet sowohl die stärkere Festlegung „Sklaven“ als auch die weniger wahrscheinliche Deutung „Boten“.
- source_word: አስኀትዎሙ
  choice: die irreführten
  rationale: Das Verb bezeichnet das Veranlassen zum Irren. „Irreführen“ bewahrt sowohl die moralische als auch die bildhafte Richtungskomponente.
- source_word: እለ የኀድሩ ዲበ የብስ
  choice: die auf dem trockenen Land wohnen
  rationale: Die konkrete kosmologische Ausdrucksweise des Ge’ez wird bewahrt und nicht zum allgemeineren „Erdbewohner“ eingeebnet.
theological_decisions:
- issue: Ausdrücklichkeit der Gerichtssprache
  choice: Ofenbild und Vergeltung ausdrücklich beibehalten
  alternative: Die Aussage als allgemeine Strafe oder allgemeines Gericht wiedergeben
  rationale: Der Vers spricht in apokalyptischen Bildern von Gericht. Eine Abschwächung würde die theologische Spannung und die Härte des Ausgangstextes verdecken.
- issue: Verhältnis der Verurteilten zu Satan
  choice: „sie wurden Diener Satans“
  alternative: „sie wurden Sklaven Satans“ oder „Boten Satans“
  rationale: „Diener“ gibt moralische Zugehörigkeit und tätigen Dienst wieder, ohne eine bestimmte ontologische oder sozialrechtliche Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptischem Ernst. Die Namensformen „Rafael“ und „Fanuel“ folgen geläufigen deutschen Schreibweisen. Der Gedankenstrich hebt die vier genannten Engel als gemeinsames Subjekt hervor; die Wiederholung „an jenem Tag“ bleibt wegen ihrer Entsprechung im Ausgangstext erhalten.
