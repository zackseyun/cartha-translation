base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/054/002.yaml
  text: And they shall bring the kings and the mighty[a], and cast them into that deep valley.
translation:
  language: de
  text: Und sie[a] werden die Könige und die Mächtigen herbeibringen und sie in jenes tiefe Tal werfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Subjekt wird in diesem Vers nicht genannt. Das „sie“ bezieht sich wahrscheinlich auf zuvor erwähnte Handelnde in der Vision, möglicherweise auf engelhafte Diener.
    reason: alternative_reading
lexical_decisions:
- source_word: እምጽእዎሙ
  choice: sie werden … herbeibringen
  rationale: Die plurale Verbform bezeichnet ein künftiges beziehungsweise narrativ-jussivisches Bringen oder Heranführen. „Herbeibringen“ gibt die Bewegung zum Gerichtsort natürlich wieder; das Objekt wird durch die folgende Benennung der Könige und Mächtigen ausgedrückt.
- source_word: ለነገሥት
  choice: die Könige
  rationale: Der übliche ge’ezische Ausdruck für Könige oder Herrscher; der bestimmte Artikel entspricht dem im Gerichtskontext identifizierbaren Referenten.
- source_word: ወለኃያላን
  choice: und die Mächtigen
  rationale: „Die Mächtigen“ bewahrt sowohl den gesellschaftlich-politischen Sinn als auch den würdigen apokalyptischen Ton.
- source_word: ይውድ ይዎሙ
  choice: und sie … werfen
  rationale: Die Wendung bezeichnet ein gewaltsames Befördern an den Gerichtsort. „Werfen“ ist im heutigen Deutsch klar und kräftig, ohne die Aussage unnötig zu steigern.
- source_word: ውስተ
  choice: in
  rationale: Im Deutschen bezeichnet „in“ mit Akkusativ die Bewegung in einen Ort hinein und entspricht daher dem gerichteten Sinn der Präposition.
- source_word: ዝኩ
  choice: jenes
  rationale: Das Demonstrativ verweist auf einen zuvor gezeigten Ort innerhalb der Vision; „jenes“ erhält diese deiktische Distanz.
- source_word: ዕሙቅ
  choice: tiefe
  rationale: Die einfache räumliche Bedeutung „tief“ bleibt anschaulich und vermeidet eine überdeutende mythologische Färbung.
- source_word: ቈላ
  choice: Tal
  rationale: Das Wort bezeichnet eine talartige Vertiefung. „Tal“ ist die natürliche deutsche Entsprechung und bewahrt das sichtbare Ortsbild des Gerichts.
theological_decisions:
- issue: Identität des unausgesprochenen Handlungssubjekts
  choice: Nur mit „sie“ wiedergeben, ohne Engel ausdrücklich zu nennen
  alternative: „Die Engel werden … herbeibringen“ oder „Die Diener werden … herbeibringen“
  rationale: Im ge’ezischen Vers steht eine plurale Verbform, aber kein ausdrücklich genanntes Subjekt. Der Zusammenhang kann engelhafte Vollstrecker nahelegen, doch der Vers selbst legt ihre Identität nicht fest; diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer apokalyptischer Bildsprache. Die Satzstellung bleibt flüssig, während das ungenannte Subjekt und der demonstrative Verweis des Ausgangstextes bewahrt werden.
