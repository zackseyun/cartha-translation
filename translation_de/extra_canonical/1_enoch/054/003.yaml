  text: And there my eyes saw their instruments[d][c][b][a], as they were making iron chains without measure.
translation:
  language: de
  text: 'Und dort sahen meine Augen ihre Werkzeuge[a], während sie sie anfertigten: eiserne Fesseln[b] von unermesslichem Gewicht[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geräte“ beziehungsweise „Arbeitsgeräte“. Die genaue Art der Gegenstände ist nicht näher bestimmt.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „eiserne Ketten“. Gemeint sind Vorrichtungen zum Binden.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich möglicherweise: „ohne Gewicht“ beziehungsweise „ohne Wägung“; die Wendung kann auch allgemeiner im Sinn von „ohne Maß“ oder „unermesslich“ verstanden werden.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ርእያ አዕይንትየ
  choice: sahen meine Augen
  rationale: Bewahrt die ausdrückliche, für Visionsberichte typische Nennung der Augen und damit die eindringliche Bildsprache des Ausgangstextes.
- source_word: ዘመባዕዕቲሆሙ
  choice: ihre Werkzeuge
  rationale: Gibt den Possessivsuffix der 3. Person Plural wieder. „Werkzeuge“ bezeichnet natürliche und konkrete Arbeitsgeräte, ohne deren genaue Art festzulegen.
- source_word: እንዘ ይገብርዎሙ
  choice: während sie sie anfertigten
  rationale: Die Konstruktion bezeichnet eine gleichzeitig ablaufende Handlung; das zweite „sie“ wahrt den Objektsuffix der 3. Person Plural, dessen Bezug syntaktisch mehrdeutig bleibt.
- source_word: መአስርተ ሐጺን
  choice: eiserne Fesseln
  rationale: Bezeichnet konkrete Vorrichtungen aus Eisen zum Binden. „Fesseln“ ist im Deutschen präzise und lässt offen, ob Ketten im engeren Sinn gemeint sind.
- source_word: ዘአልቦ መደለውተ
  choice: von unermesslichem Gewicht
  rationale: Versteht መደለውተ im Sinn von Gewicht bzw. Wägung und gibt die Negation idiomatisch als Unermesslichkeit wieder; die mögliche allgemeinere Deutung wird in einer Fußnote bewahrt.
theological_decisions:
- issue: Art der in der Vision hergestellten Gegenstände
  choice: Konkrete eiserne Fesseln als Bestandteil einer Gerichtsszene
  alternative: Allgemeine Strafwerkzeuge oder rein sinnbildliche Bindungen
  rationale: 'Wortfeld und Bildsprache sind materiell: Werkzeuge, Anfertigen, Eisen und Fesseln. Der Vers erklärt ihre Funktion jedoch nicht ausdrücklich; daher wird die Gerichtsbedeutung nicht in den Haupttext hineingetragen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter apokalyptischer Konkretheit. Die markierte Objektwiederaufnahme „sie sie“ ist bewusst formal näher am ge'ezischen Text; der Doppelpunkt macht die nachfolgende Bestimmung als Apposition lesbar.
