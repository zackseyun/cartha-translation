  text: Und sie werden vereint werden.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorgelegte geʽezische Wortlaut ist sehr kurz und offenbar nur ein Ausschnitt des Verses; wer oder was vereint wird, bleibt darin ungenannt.
