lexical_decisions:
- source_word: ወ
  choice: Und
  rationale: Die vorangestellte Konjunktion wird am natürlichsten mit „und“ wiedergegeben; ein stärker folgernder Anschluss ist durch den knappen Text nicht gesichert.
- source_word: ይዴመሩ
  choice: sie werden miteinander verbunden werden
  rationale: Die Form gehört zu ደመረ im Bedeutungsfeld „verbinden, vereinigen, hinzufügen“ und ist als imperfektische passive beziehungsweise reflexive Pluralform zu verstehen. Das deutsche Futur gibt den Zukunftsbezug wieder; „miteinander“ verdeutlicht idiomatisch die wechselseitige Verbindung, ohne ein Objekt zu ergänzen.
theological_decisions:
- issue: Wie sicher die sehr kurze, isoliert überlieferte Klausel zu deuten ist
  choice: Und sie werden miteinander verbunden werden.
  alternative: Und sie werden vereinigt werden.
  rationale: Die Übersetzung folgt der grammatischen Zukunftsbedeutung und dem Verbstamm „verbinden/vereinigen“, ergänzt aber wegen des verkürzten Zeugnisses keine ausdrücklich genannten Beteiligten. Dadurch bleibt die Unbestimmtheit des Satzes erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas markierte Futur-Passiv-Form bewahrt die grammatische Aussage des Ge’ez; „miteinander verbunden“ klingt im Deutschen natürlicher als eine rein wörtliche Konstruktion.
