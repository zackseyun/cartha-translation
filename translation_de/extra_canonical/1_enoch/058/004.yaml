base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/058/004.yaml
  text: And they will seek the light and find righteousness with the Lord of Spirits[c][b][a]. Peace be to the righteous in the name of the Lord of Eternity.
translation:
  language: de
  text: Und sie werden das Licht suchen und beim Herrn der Geister Gerechtigkeit finden.[a] Friede sei den Gerechten im Namen des Herrn der Ewigkeit.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gerechtigkeit erlangen“. Das äthiopische Verb kann sowohl „finden“ als auch „erlangen“ bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Der Titel kann auch „Herr des Zeitalters“, „ewiger Herr“ oder „Herr der Welt“ wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: የኃሥሡ
  choice: sie werden suchen
  rationale: Die plurale Verbform bezeichnet ein Suchen; das Futur passt zur visionären Abfolge des Zusammenhangs.
- source_word: ለብርሃን
  choice: das Licht
  rationale: Die Objektmarkierung weist „Licht“ als Gegenstand des Suchens aus; das apokalyptische Bild bleibt unverändert erhalten.
- source_word: ይረክቡ
  choice: finden
  rationale: Das Verb kann sowohl „finden“ als auch „erlangen“ bedeuten. „Finden“ nimmt den Gedanken des Suchens natürlich auf, ohne die mögliche Erwerbsnuance zu verschweigen.
- source_word: ጽድቀ
  choice: Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt hier den moralischen und gemeinschaftsbezogenen Sinn und entspricht der anschließenden Bezeichnung „die Gerechten“.
- source_word: በኀበ
  choice: bei
  rationale: „Bei“ gibt die räumlich-relationale Bedeutung knapp wieder und lässt offen, ob die Gerechtigkeit in Gottes Gegenwart oder von ihm her gefunden wird.
- source_word: እግዚአ መናፍስት
  choice: der Herr der Geister
  rationale: Dies ist ein feststehender Gottesname im Henochbuch; die formnahe Wiedergabe erhält seinen kosmischen Klang.
- source_word: ሰላም ለጻድቃን
  choice: Friede sei den Gerechten
  rationale: Die Formulierung gibt den Segens- beziehungsweise Zuspruchscharakter in würdigem, verständlichem Deutsch wieder.
- source_word: በስመ
  choice: im Namen
  rationale: Die formelhafte Wendung wird transparent und ohne erklärende Paraphrase wiedergegeben.
- source_word: እግዚአ ዓለም
  choice: der Herr der Ewigkeit
  rationale: ዓለም kann „Zeitalter“, „Ewigkeit“ oder „Welt“ bezeichnen. „Herr der Ewigkeit“ wahrt den zeitlich-kosmischen Umfang des Titels und vermeidet im Deutschen die mögliche Begrenzung auf ein einzelnes Zeitalter.
theological_decisions:
- issue: Beziehung der Gerechtigkeit zum Herrn der Geister
  choice: beim Herrn der Geister
  alternative: vom Herrn der Geister
  rationale: Die Präposition bezeichnet Nähe oder Beziehung, legt aber die Gerechtigkeit nicht eindeutig als unmittelbar von Gott empfangene Gabe fest. „Bei“ erhält diese Offenheit.
- issue: Wiedergabe des abschließenden Gottestitels እግዚአ ዓለም
  choice: Herr der Ewigkeit
  alternative: Herr des Zeitalters; ewiger Herr; Herr der Welt
  rationale: Der äthiopische Ausdruck besitzt eine zeitliche und kosmische Bedeutungsbreite. Die Hauptfassung bringt die umfassende Dauer zum Ausdruck; die Fußnote bewahrt die übrigen ernsthaften Möglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem Segensklang. Die henochischen Gottestitel und das Lichtbild bleiben formnah erhalten; ungeklärte lexikalische Spielräume werden in den Fußnoten offengelegt.
