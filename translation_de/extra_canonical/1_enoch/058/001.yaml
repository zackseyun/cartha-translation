base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/058/001.yaml
  text: And I began to speak the third parable concerning the righteous and concerning the chosen[a].
translation:
  language: de
  text: Und ich begann, das dritte Gleichnis über die Gerechten und über die Erwählten[a] vorzutragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die dritte Vergleichsrede“. Das ge’ezische Wort kann eine gleichnis- oder vergleichsartige Rede bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አኀዝኩ እበል
  choice: ich begann … vorzutragen
  rationale: Die Verbindung bezeichnet hier den Beginn eines neuen Redeteils. „Vorzutragen“ klingt bei einer längeren, als Gleichnis bezeichneten Rede im Deutschen natürlicher als das wörtlichere „zu sagen“.
- source_word: ሣልሰ ምሳሌ
  choice: das dritte Gleichnis
  rationale: ምሳሌ kann Gleichnis, Vergleichsrede oder Spruch bezeichnen. „Gleichnis“ ist die verständliche und in diesem literarischen Zusammenhang passende deutsche Bezeichnung; die mögliche Nuance einer Vergleichsrede bleibt in der Fußnote sichtbar.
- source_word: በእንተ ጻድቃን
  choice: über die Gerechten
  rationale: በእንተ markiert das Thema der Rede; „über“ gibt dies idiomatisch wieder. ጻድቃን wird als apokalyptische Gruppenbezeichnung mit „die Gerechten“ bewahrt.
- source_word: ወበእንተ ኅሩያን
  choice: und über die Erwählten
  rationale: ኅሩያን bezeichnet die Ausgewählten bzw. Erwählten. „Erwählte“ wahrt den wiederkehrenden Gruppentitel, ohne ihn durch eine erklärende Umschreibung aufzulösen.
theological_decisions:
- issue: Gruppenbezeichnung ኅሩያን
  choice: die Erwählten
  alternative: die Auserwählten; die Ausgewählten
  rationale: „Die Erwählten“ ist eine natürliche, würdige deutsche Wiedergabe des lokalen apokalyptischen Identitätsbegriffs. Sie lässt dessen genaue theologische Reichweite offen und legt kein späteres Lehrsystem in den Text hinein.
- issue: Literarische Bezeichnung ምሳሌ
  choice: Gleichnis
  alternative: Vergleichsrede; Sinnbild
  rationale: „Gleichnis“ ist im modernen Deutschen gut verständlich und bezeichnet den dritten großen Redeteil angemessen. Da das äthiopische Wort semantisch weiter sein kann, wird die Alternative in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bewahrt den feierlichen Einleitungscharakter, vermeidet aber unnötig altertümliche Formulierungen.
