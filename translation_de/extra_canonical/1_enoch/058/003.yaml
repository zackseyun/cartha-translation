base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/058/003.yaml
  text: And the righteous shall be in the light of the sun[a], and the chosen in the light of eternal life; and there shall be no end to the days of their life[b], and the holy ones shall have days without number.
translation:
  language: de
  text: Und die Gerechten werden im Licht der Sonne sein und die Erwählten im Licht des ewigen Lebens. Die Tage ihres Lebens werden kein Ende haben, und die Heiligen werden Tage ohne Zahl haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Und für die Heiligen gibt es keine Zahl von Tagen.“ Die äthiopische Wendung bezeichnet Tage, die sich nicht zählen oder begrenzen lassen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ጻድቃን
  choice: die Gerechten
  rationale: Die substantivierte Bezeichnung gibt Menschen wieder, die durch Gerechtigkeit gekennzeichnet sind, und entspricht dem üblichen deutschen Sprachgebrauch.
- source_word: በብርሃነ ፀሐይ
  choice: im Licht der Sonne
  rationale: Die relativ formnahe Wiedergabe bewahrt die kosmisch-visionäre Bildsprache und klingt zugleich natürlich.
- source_word: ኅሩያን
  choice: die Erwählten
  rationale: Die Bezeichnung meint die von Gott Erwählten; „Erwählten“ ist verständlich und weniger konfessionell vorgeprägt als manche dogmatische Fachausdrücke.
- source_word: በብርሃነ ሕይወት ዘለዓለም
  choice: im Licht des ewigen Lebens
  rationale: Diese Wiedergabe erhält die Verbindung von Licht, Leben und ewiger Dauer, ohne das Bild zu einer bloßen Aussage über Unsterblichkeit abzuflachen.
- source_word: ማኅለቆተ አልቦቱ መዋዕለ ሕይወቶሙ
  choice: Die Tage ihres Lebens werden kein Ende haben
  rationale: Die deutsche Formulierung wahrt das ausdrückliche Bild der „Tage“ und gibt die uneingeschränkte Verneinung eines Endes idiomatisch wieder.
- source_word: ቅዱሳን
  choice: die Heiligen
  rationale: Die substantivierte Form bewahrt die im Henochbuch verwendete Gruppenbezeichnung, ohne sie enger als der Ausgangstext zu bestimmen.
- source_word: ኍልቈ መዋዕለ አልቦሙ
  choice: werden Tage ohne Zahl haben
  rationale: Die Formulierung gibt die äthiopische Zählmetapher verständlich wieder und vermeidet das mögliche Missverständnis, sie hätten überhaupt keine Tage.
theological_decisions:
- issue: Wiedergabe von ኅሩያን als Gruppenbezeichnung
  choice: die Erwählten
  alternative: die Auserwählten
  rationale: „Die Erwählten“ erhält die theologische Kategorie des Textes, bleibt aber sprachlich schlicht und legt keine bestimmte spätere Erwählungslehre fest.
- issue: Sinn der abschließenden Aussage über die Tage der Heiligen
  choice: Tage ohne Zahl
  alternative: für sie gibt es keine Zahl von Tagen
  rationale: Die Wendung bezeichnet eine nicht begrenzte, nicht zählbare Dauer. Die gewählte Form bewahrt das Bild, ohne die Aussage als „keine Tage“ missverständlich werden zu lassen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst erhaltener apokalyptischer Licht- und Zeitbildsprache. Die parallelen Gruppenbezeichnungen „die Gerechten“, „die Erwählten“ und „die Heiligen“ bleiben sichtbar.
