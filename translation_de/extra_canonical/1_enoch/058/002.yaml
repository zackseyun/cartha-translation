base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/058/002.yaml
  text: Blessed are you[a], O righteous and chosen ones, for your portion is glorious.
translation:
  language: de
  text: Glückselig seid ihr, ihr Gerechten und Erwählten, denn herrlich ist euer Anteil.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „euer Teil“, „euer Erbteil“ oder „euer Los“. Das ge’ezische Wort bezeichnet einen zugeteilten Anteil und kann an ein Erbteil erinnern.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ብፁዓን
  choice: Glückselig
  rationale: Bewahrt die feierliche, an eine Seligpreisung erinnernde Kraft des Ausdrucks; „glücklich“ wäre im apokalyptischen Kontext zu alltäglich und zu schwach.
- source_word: አንትሙ
  choice: seid ihr
  rationale: Gibt die direkte Anrede in der zweiten Person Plural innerhalb der Seligpreisungsformel natürlich wieder.
- source_word: ጻድቃን
  choice: Gerechten
  rationale: Entspricht dem etablierten biblisch-apokalyptischen Sprachgebrauch und bewahrt den wiederkehrenden Gegensatz zu den Frevlern beziehungsweise Gottlosen.
- source_word: ወኅሩያን
  choice: Erwählten
  rationale: Gibt die substantivische Pluralbezeichnung für die Ausgewählten knapp und würdig wieder, ohne die Aussage über ihre Erwählung näher zu systematisieren.
- source_word: እስመ
  choice: denn
  rationale: Leitet den Grund der Seligpreisung prägnant und natürlich ein.
- source_word: ስቡሕ
  choice: herrlich
  rationale: Passt als prädikative Beschreibung des Anteils und bewahrt den Sinn von Herrlichkeit beziehungsweise Glanz.
- source_word: ክፍልክሙ
  choice: euer Anteil
  rationale: Bewahrt das Bild eines zugeteilten Anteils, das auch einen erbteilähnlichen Sinn tragen kann.
theological_decisions:
- issue: Wiedergabe der Gruppenbezeichnung ወኅሩያን
  choice: Erwählten
  alternative: Auserwählten; Ausgewählten
  rationale: „Erwählten“ erhält das bundestheologische und endzeitliche Gewicht des Ausdrucks, ohne seine Bedeutung durch eine nähere dogmatische Bestimmung festzulegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst bibelnaher Seligpreisungsformel. Die Voranstellung „herrlich ist euer Anteil“ erhält den feierlichen Ton, ohne unnatürlich zu wirken.
