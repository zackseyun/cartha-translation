  text: And after this it will be said to the holy ones in heaven[c][b][a],
translation:
  language: de
  text: Und danach wird zu den Heiligen im Himmel gesagt:[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die unpersönliche Passivform nennt nicht, wer dies sagt.
    reason: lexical_alternative
  - marker: b
    text: Mit den „Heiligen“ können himmlische Wesen oder die Gerechten im Himmel gemeint sein; der Satz legt dies nicht fest.
