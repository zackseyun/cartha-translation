lexical_decisions:
- source_word: ወእምድኅረዝ
  choice: Und danach
  rationale: Die zusammengesetzte Zeitangabe führt die nächste Phase der Vision ein. „Danach“ ist im modernen Deutsch natürlich und bewahrt den erzählerischen Anschluss.
- source_word: ይትበሀል
  choice: wird … gesagt
  rationale: Die Form gibt ein unpersönliches Passiv von „sagen“ wieder. Die Übersetzung nennt daher keinen Sprecher und ist lexikalisch genauer als „wird gesprochen“.
- source_word: ለቅዱሳን
  choice: zu den Heiligen
  rationale: Die Präposition bezeichnet hier die Adressaten. „Die Heiligen“ gibt den lexikalischen Sinn wieder, ohne die Gruppe näher als Engel oder gerechtfertigte Menschen zu bestimmen.
- source_word: በሰማይ
  choice: im Himmel
  rationale: Der im Zeugen belegte Singular wird mit der geläufigen deutschen Wendung „im Himmel“ wiedergegeben.
theological_decisions:
- issue: Identität der „Heiligen“
  choice: Die Bezeichnung bleibt offen und wird nicht näher bestimmt.
  alternative: Himmelswesen beziehungsweise Engel; oder gerechte Menschen im Himmel
  rationale: Der kurze Satz entscheidet nicht, ob mit den „Heiligen“ himmlische Wesen oder die Gerechten im Himmel gemeint sind. Die Übersetzung bewahrt diese Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt zeigt an, dass die angekündigte Rede im folgenden Text einsetzt. Die Wortstellung wahrt die unpersönliche Aussage des geezischen Passivs.
