base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/006.yaml
  text: Saraqael[a], one of the holy angels[b], who is over the spirits of the children of men who sin.
translation:
  language: de
  text: Saraqael[a], einer der heiligen Engel, der über die Geister der Menschen wacht, die sündigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wortfolge in der Mitte des überlieferten äthiopischen Textes ist unsicher. Wahrscheinlich ist eine geläufige Wendung für „Menschen“ oder wörtlich „Menschenkinder“ gemeint.
    reason: textual_variant
lexical_decisions:
- source_word: ሰራቃኤል
  choice: Saraqael
  rationale: Der Personenname wird entsprechend der äthiopischen Form transliteriert; die Schreibweise bleibt nahe am vorliegenden Zeugen.
- source_word: ፩እምነ፡ መላእክት፡ ቅዱሳን
  choice: einer der heiligen Engel
  rationale: Die partitive Wendung bezeichnet Saraqael als einen aus der Gruppe der heiligen Engel und wird im Deutschen natürlich wiedergegeben.
- source_word: ዘዲበ
  choice: der über … wacht
  rationale: Die Wendung bezeichnet Aufsicht beziehungsweise Zuständigkeit. „Über … wacht“ ist im Deutschen natürlich und bewahrt diesen Sinn.
- source_word: መናፍስት፡ [እስለ፡ እመሕያው፡]
  choice: die Geister der Menschen
  rationale: Die Klammerstelle beruht wahrscheinlich auf einer fehlerhaften Überlieferung beziehungsweise OCR-Erfassung von እጓለ፡ እመሕያው, der geläufigen äthiopischen Bezeichnung für Menschen beziehungsweise Menschenkinder. „Der Menschen“ gibt den Sinn idiomatisch wieder.
- source_word: ዘመናፍስት፡ ያኃጥኡ
  choice: die sündigen
  rationale: Das Relativgefüge qualifiziert die Menschen durch ihr Sündigen. Eine zusätzliche Wendung „im Geist“ wird nicht eingefügt, da sie in dieser Lesart nicht hinreichend gestützt ist.
theological_decisions:
- issue: Wessen Geister unter Saraqaels Aufsicht stehen
  choice: die Geister der Menschen, die sündigen
  alternative: die Geister der Menschenkinder, die sündigen; die Geister derer, die im Geist sündigen
  rationale: Die wahrscheinlich wiederherzustellende äthiopische Wendung bezeichnet die Menschen beziehungsweise Menschenkinder. Die grammatische Zuordnung bleibt dennoch etwas offen; die Fußnote macht die textliche Unsicherheit sichtbar, ohne eine besondere Lehre über eine Sünde „im Geist“ in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Menschen“ ist natürlicher als das wörtliche „Menschenkinder“; der apokalyptische Ausdruck „heilige Engel“ bleibt erhalten.
