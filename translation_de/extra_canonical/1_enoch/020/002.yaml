  text: Uriel[a], one of the holy angels[b], who is over the world and over Tartarus.
translation:
  language: de
  text: Uriel, einer der heiligen Engel, der über die Welt und über den Tartaros[a] gesetzt ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Schlussform im zugrunde liegenden Textzeugen ist schwer zu deuten. Gemeint sein könnte der „Tartaros“, der Gefängnisbereich rebellischer Himmelswesen, oder allgemeiner der „Abgrund“; sprachlich wurden auch „Schrecken“ beziehungsweise „Beben“ erwogen.
    reason: textual_variant
lexical_decisions:
- source_word: ኡርኤል
  choice: Uriel
  rationale: Der Personenname wird nach der im Deutschen üblichen Form transliteriert und nicht übersetzt.
- source_word: ፩እመላእክት፡ ቅዱሳን
  choice: einer von den heiligen Engeln
  rationale: Die Zahl mit Präposition bezeichnet die Zugehörigkeit zu einer Gruppe; „heilige Engel“ bewahrt die feste apokalyptische Bezeichnung himmlischer Wesen.
- source_word: እሰመ
  choice: der … gesetzt ist
  rationale: Die Relativkonstruktion des listenartigen Zusammenhangs bleibt erhalten; „gesetzt ist“ drückt Uriels Zuständigkeitsbereich aus, ohne seine konkrete Tätigkeit näher zu bestimmen.
- source_word: ዘዓለም
  choice: die Welt
  rationale: Im Zusammenhang kosmischer Zuständigkeitsbereiche ist „Welt“ wahrscheinlicher als die ebenfalls möglichen zeitlichen Bedeutungen „Zeitalter“ oder „Ewigkeit“.
- source_word: ወዘተረዓድ
  choice: und über den Tartaros
  rationale: Die schwierige Schlussform wird im Kontext der Aufteilung kosmischer Bereiche am ehesten als Bezeichnung des unterweltlichen Gefängnisraums verstanden; die Unsicherheit wird in einer Fußnote offengelegt.
theological_decisions:
- issue: Bezeichnung von Uriels zweitem Zuständigkeitsbereich
  choice: Tartaros
  alternative: Abgrund; möglicherweise Schrecken oder Beben
  rationale: Ein konkreter unterweltlicher Bereich passt zur apokalyptischen Kosmologie und zur listenartigen Zuweisung von Zuständigkeitsbereichen. Da die überlieferte Form unsicher ist, wird die alternative Deutung nicht stillschweigend ausgeschlossen, sondern in der Fußnote genannt.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Relativsatzform wahrt den gleichförmigen Aufbau der Engelliste; die Wiederholung von „über“ macht die beiden kosmischen Zuständigkeitsbereiche deutlich.
