base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/007.yaml
  text: Gabriʾel[a], one of the holy angels, who is over Paradise and the serpents and the cherubim.
translation:
  language: de
  text: Gabriel, einer der heiligen Engel, der über das Paradies, die Schlangen[a] und die Cherubim gesetzt ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit »Schlangen« wiedergegebene Wort ist in der äthiopischen Überlieferung lexikalisch schwierig. Die traditionelle Deutung weist auf schlangenartige Wesen, doch bleibt die genaue Bedeutung unsicher.
    reason: lexical_alternative
lexical_decisions:
- source_word: ገብርኤል
  choice: Gabriel
  rationale: Die im Deutschen fest etablierte Namensform gibt den äthiopischen Eigennamen natürlich und würdig wieder.
- source_word: ፩እምነ
  choice: einer von
  rationale: Die Wendung bezeichnet eindeutig die Zugehörigkeit zu einer Gruppe.
- source_word: መላእክት ቅዱሳን
  choice: den heiligen Engeln
  rationale: Dies bewahrt die übliche apokalyptische Bezeichnung der himmlischen Wesen.
- source_word: ዘዲበ
  choice: der über … gesetzt ist
  rationale: Die Formulierung bringt die hier gemeinte Zuständigkeit oder Aufsicht im Deutschen klar zum Ausdruck.
- source_word: ገነት
  choice: das Paradies
  rationale: Im Zusammenhang der Engelsämter bezeichnet das Wort am ehesten den paradiesischen Bereich und nicht lediglich einen gewöhnlichen Garten.
- source_word: አክይስት
  choice: die Schlangenwesen
  rationale: Das lexikalisch schwierige Wort wird traditionell auf schlangenartige Wesen bezogen; „Schlangenwesen“ erhält sowohl diese Deutung als auch den übernatürlichen Kontext, ohne gewöhnliche Tiere zwingend vorauszusetzen.
- source_word: ኪሩቤን
  choice: die Kerubim
  rationale: „Kerubim“ ist die traditionelle deutsche Wiedergabe des Namens dieser himmlischen Wesen und erhält die Pluralform.
theological_decisions:
- issue: Ob ገነት einen gewöhnlichen Garten oder einen kosmisch-theologischen Ort bezeichnet
  choice: das Paradies
  alternative: der Garten; Eden
  rationale: Der Katalog der Engel und ihrer Zuständigkeitsbereiche legt den paradiesischen Bereich nahe. „Paradies“ bewahrt diese apokalyptische Bedeutung, ohne spätere Lehrvorstellungen hinzuzufügen.
- issue: Bestimmung der durch አክይስት bezeichneten Wesen
  choice: Schlangenwesen
  alternative: Schlangen
  rationale: Die Überlieferung ist lexikalisch unsicher. Die gewählte Form wahrt die traditionelle schlangenartige Deutung, legt den Ausdruck aber nicht vorschnell auf gewöhnliche Tiere fest.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die Satzstruktur bleibt nahe am knappen Aufbau des ge’ezischen Textes; die echte lexikalische Unsicherheit wird in einer Fußnote offengelegt.
