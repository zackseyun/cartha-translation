base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/005.yaml
  text: Mikael[a], one of the holy angels[b], who is set over the good of mankind and over the people.
translation:
  language: de
  text: Michael, einer der heiligen Engel, der über das Wohl der Menschen und über das Volk eingesetzt ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die in der vorliegenden äthiopischen Transkription überlieferte Wortfolge ist an dieser Stelle unsicher. Eine abweichende Lesung wäre: „der über die Guten unter den Menschen eingesetzt ist“ oder „der über die gute Ordnung des Volkes eingesetzt ist“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ሚካኤል
  choice: Michael
  rationale: Die im Deutschen vertraute Namensform entspricht dem äthiopischen Mikael und ist für eine natürliche, würdige Übersetzung vorzuziehen.
- source_word: ፩እምነ መላእክት ቅዱሳን
  choice: einer der heiligen Engel
  rationale: Die Formulierung bezeichnet Michael als Mitglied der Gruppe der heiligen Engel.
- source_word: እሰመ / zugrunde liegendes ተሰይመ
  choice: eingesetzt ist
  rationale: Die überlieferungsgeschichtlich erschlossene Verbform bezeichnet eine Bestellung zu einem Aufsichtsbereich; das Passiv wahrt den Gedanken übertragener Zuständigkeit.
- source_word: ዲበ ሠናይቱ ለሰብእ
  choice: über das Wohl der Menschen
  rationale: ‚Wohl‘ gibt das Gute bzw. die guten Belange der Menschen idiomatisch wieder, ohne daraus eine moralisch abgegrenzte Gruppe ‚der Guten‘ zu machen.
- source_word: ዲበ ሕዝብ
  choice: über das Volk
  rationale: Die Präposition bezeichnet hier Michaels Zuständigkeitsbereich. Der Singular ‚Volk‘ folgt dem Quellenausdruck und bewahrt dessen unbestimmten Bezug.
theological_decisions:
- issue: Michaels zugewiesener Zuständigkeitsbereich
  choice: das Wohl der Menschen und das Volk
  alternative: die Guten unter den Menschen; die gute Ordnung des Volkes; ein gutes Gebot für das Volk
  rationale: Die eingereichte Zeile beruht offenbar teilweise auf einer fehlerhaften Lesung bzw. Transkription. Die im Revisionshinweis angeführte zugrunde liegende äthiopische und griechische Evidenz stützt zwei koordinierte Zuständigkeitsbereiche. Eine Fußnote macht die textliche Unsicherheit transparent, ohne die problematische Lesung ‚Gebot‘ in den Haupttext zu übernehmen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem erzählerischem Register. ‚Michael‘ folgt der geläufigen deutschen Namensform; ‚eingesetzt‘ erhält den Gedanken einer übertragenen Zuständigkeit. Der Fußnotenmarker steht im Haupttext.
