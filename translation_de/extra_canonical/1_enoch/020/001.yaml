base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/001.yaml
  text: And these are the names of the holy angels who keep watch[a].
translation:
  language: de
  text: Und dies sind die Namen der heiligen Engel, die Wache halten[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit „Wache halten“ wiedergegebene Verb kann auch „wachsam sein“ oder „wachen“ bedeuten. Im weiteren Zusammenhang von 1 Henoch berührt diese Ausdrucksweise die Vorstellung von den himmlischen Wächtern; im Vers selbst dient sie jedoch als Beschreibung der Engel.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝንቱ
  choice: Und dies sind
  rationale: Die Verbindung aus Konjunktion und Demonstrativ leitet eine Aufzählung beziehungsweise Identifikation ein. Der Plural von አስማቲሆሙ stützt im Deutschen die pluralische Wiedergabe „dies sind“.
- source_word: አስማቲሆሙ
  choice: die Namen
  rationale: Wörtlich steht „ihre Namen“. In der deutschen Einleitungsformel ist „die Namen“ natürlicher; der folgende Relativsatz macht deutlich, wessen Namen gemeint sind.
- source_word: ለእለ
  choice: der …, die
  rationale: Der Relativmarker verknüpft „Namen“ mit der nachfolgenden Beschreibung. Die Konstruktion „die Namen der …, die“ gibt diese Beziehung idiomatisch wieder.
- source_word: ይተግሁ
  choice: Wache halten
  rationale: Das Verb bezeichnet Wachsamkeit beziehungsweise wachsames Beobachten. „Wache halten“ bewahrt den aktiven verbalen Charakter, ohne daraus ausdrücklich den festen Titel „Wächter“ zu machen.
- source_word: ቅዱሳን
  choice: heiligen
  rationale: „Heilig“ ist die übliche und dem gehobenen Kontext angemessene Wiedergabe des Adjektivs.
- source_word: መላእክት
  choice: Engel
  rationale: Im apokalyptischen Zusammenhang sind himmlische Wesen gemeint; daher ist „Engel“ treffender als das allgemeinere „Boten“.
theological_decisions:
- issue: Ob die wachenden Engel mit dem technischen Titel „Wächter“ bezeichnet werden sollen
  choice: die Wache halten
  alternative: die Wächter; die Wachenden
  rationale: Obwohl die Wächtervorstellung in 1 Henoch eine wichtige Rolle spielt, enthält dieser Vers eine verbale Beschreibung und nicht zwingend einen feststehenden Titel. Die gewählte Formulierung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Einleitungsformel entspricht dem Beginn einer Namensliste; die Formulierung vermeidet eine unnötige Festlegung auf den technischen Titel „Wächter“.
