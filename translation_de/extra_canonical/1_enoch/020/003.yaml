base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/003.yaml
  text: Raphael[a], one of the holy angels, who is over the spirits of men.
translation:
  language: de
  text: Raphael, einer der heiligen Engel, der über die Geister der Menschen[a] gesetzt ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Geister der Menschheit“. Das ge’ezische Wort bezeichnet Menschen hier kollektiv und nicht notwendig nur Männer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ሩፋኤል
  choice: Raphael
  rationale: Der Personenname wird entsprechend der im Deutschen etablierten biblischen Namensform transliteriert, nicht übersetzt.
- source_word: ፩እምነ
  choice: einer der
  rationale: Zahlwort und partitive Präposition bezeichnen die Zugehörigkeit zu einer Gruppe; „einer der“ gibt dies natürlich und knapp wieder.
- source_word: ቅዱሳን፡ መላእክት
  choice: heiligen Engel
  rationale: Die geläufige Verbindung bewahrt den feierlichen apokalyptischen Ton und den Sinn geweihter himmlischer Wesen.
- source_word: ዘ
  choice: der
  rationale: Das Relativzeichen bezieht sich auf Raphael und leitet die Angabe seines Zuständigkeitsbereichs ein.
- source_word: መናፍስተ
  choice: Geister
  rationale: „Geister“ ist die unmittelbarste Entsprechung und wahrt die kosmologisch-anthropologische Offenheit besser als „Seelen“.
- source_word: ሰብእ
  choice: Menschen
  rationale: Das Wort bezeichnet Menschen kollektiv und ist hier nicht notwendig auf männliche Personen beschränkt.
- source_word: ዘመናፍስተ፡ ሰብእ
  choice: der über die Geister der Menschen gesetzt ist
  rationale: Die Wendung beschreibt Raphaels Aufsicht oder Zuständigkeit. „Gesetzt ist“ macht dieses Verhältnis in natürlichem, würdigem Deutsch deutlich, ohne seine genaue Funktion weiter auszudeuten.
theological_decisions:
- issue: Umfang von Raphaels Zuständigkeit
  choice: Raphael wird als über die Geister der Menschen gesetzt beschrieben.
  alternative: Raphael ist ausschließlich für die Seelen der Toten oder für die Heilung beziehungsweise das innere Leben der Menschheit zuständig.
  rationale: Der ge'ezische Text nennt lediglich „die Geister der Menschen“. Er beschränkt sie weder ausdrücklich auf Verstorbene noch erwähnt er hier eine heilende Aufgabe; diese Offenheit bleibt erhalten.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die knappe Form einer Engelliste bleibt erhalten; „Geister“ wahrt die Mehrdeutigkeit gegenüber „Seelen“.
