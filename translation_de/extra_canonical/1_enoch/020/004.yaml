base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/020/004.yaml
  text: Raguel[a], one of the holy angels[b], who takes vengeance on the world and on the luminaries.
translation:
  language: de
  text: 'Raguel, einer von den heiligen Engeln, der an der Welt und an den Himmelslichtern[b] Vergeltung übt[a].


    [a] Auch möglich: »der die Welt und die Himmelslichter rächt«. Das zugrunde liegende Verb bezeichnet vergeltendes, richterliches Handeln.


    [b] Mit den »Himmelslichtern« sind im apokalyptischen Weltbild die leuchtenden Himmelskörper gemeint, wahrscheinlich Sonne, Mond und Sterne.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »der die Welt und die Himmelslichter rächt«. Das zugrunde liegende Verb bezeichnet vergeltendes, richterliches Handeln.'
    reason: lexical_alternative
  - marker: b
    text: Mit den »Himmelslichtern« sind im apokalyptischen Weltbild die leuchtenden Himmelskörper gemeint, wahrscheinlich Sonne, Mond und Sterne.
    reason: cultural_note
lexical_decisions:
- source_word: ራጉኤል
  choice: Raguel
  rationale: Der Personenname wird nach der im Deutschen geläufigen Form wiedergegeben, nicht übersetzt.
- source_word: ፩እምነ
  choice: einer von
  rationale: Die Formulierung bewahrt den partitiven Sinn und klingt im Deutschen natürlich.
- source_word: መላእክት ቅዱሳን
  choice: den heiligen Engeln
  rationale: Dies gibt die feste Bezeichnung der Engelgruppe unmittelbar und in geläufigem Deutsch wieder.
- source_word: ዘይትቤቀሎ
  choice: der … Vergeltung übt
  rationale: Die Wendung erhält den vergeltenden und richterlichen Sinn des Verbs, ohne die Handlung zu einer bloßen Aufsicht abzuschwächen.
- source_word: ለዓለም
  choice: an der Welt
  rationale: »Welt« entspricht hier am ehesten der kosmischen Reichweite der Aussage; »Erde« oder »Zeitalter« bleiben lexikalisch denkbar, sind im Zusammenhang aber weniger naheliegend.
- source_word: ለብርሃናት
  choice: an den Himmelslichtern
  rationale: Die präzisierende Zusammensetzung bezeichnet im Deutschen klar die kosmischen Lichter und bleibt zugleich verständlicher als das fachsprachlichere »Luminarien«.
theological_decisions:
- issue: Umfang von Raguels vergeltendem Auftrag
  choice: Raguel übt sowohl an der Welt als auch an den Himmelslichtern Vergeltung.
  alternative: Raguel wacht allgemeiner über die Ordnung der Welt und der Himmelslichter; oder er ahndet Vergehen, die mit ihnen zusammenhängen.
  rationale: Die ge’ezische Syntax ordnet der einen vergeltenden Handlung am naheliegendsten zwei koordinierte Bezugsgrößen zu. Die schroffe apokalyptische Gerichtsaussage wird daher nicht zu einer bloßen Aufsicht gemildert.
- issue: Mögliche Ziel- oder Objektdeutung des vergeltenden Verbs
  choice: »an der Welt und an den Himmelslichtern Vergeltung übt«
  alternative: »die Welt und die Himmelslichter rächt«
  rationale: Die gewählte Fassung bewahrt den naheliegenden Sinn, dass Welt und Himmelslichter vom Gericht betroffen sind; die grammatisch und lexikalisch mögliche Deutung als Gegenstände, die gerächt werden, bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Vergeltung üben« hält den richterlich-apokalyptischen Nachdruck fest, ohne die stärker persönlich klingende Vorstellung von Rachsucht aufzudrängen. Die Fußnotenmarker stehen unmittelbar nach dem Satz, auf dessen strittige Verbform und kosmische Bildsprache sie sich beziehen.
