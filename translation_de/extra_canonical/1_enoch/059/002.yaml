base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/059/002.yaml
  text: And there I saw the hidden chambers of the thunder[a], and how, when it crashes in the height of heaven, its sound is heard; and he showed me the dwellings of the dry land, and the sound of the thunder, whether for peace and blessing or for a curse[c][b], according to the word of the Lord of Spirits.
translation:
  language: de
  text: Und dort sah ich die verborgenen Kammern des Donners[a] und wie, wenn er in der Höhe des Himmels kracht, sein Schall zu hören ist. Und er zeigte mir die Wohnstätten des Festlandes und den Schall des Donners – ob zum Frieden und zum Segen oder zum Fluch[b] – nach dem Wort des Herrn der Geister.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „die verborgenen Orte des Donners“. Der Ausdruck kann verborgene Dinge oder Orte bezeichnen; „Kammern“ nimmt hier das kosmologische Bild verborgener Aufbewahrungsorte auf.'
    reason: lexical_alternative
  - marker: b
    text: Ein in der Textausgabe eingeklammerter Ausdruck wiederholt „und den Schall des Donners“. Die Wiederholung kann ursprünglich sein oder auf eine spätere Erweiterung zurückgehen; ihr Sinn ist im Haupttext berücksichtigt.
    reason: textual_variant
lexical_decisions:
- source_word: ኅቡኣተ ነጐድጓድ
  choice: die verborgenen Kammern des Donners
  rationale: ኅቡኣተ bezeichnet Verborgenes beziehungsweise verborgene Orte. Im apokalyptisch-kosmologischen Zusammenhang ist die räumliche Wiedergabe „Kammern“ plausibel und bewahrt das Bild verborgener Aufbewahrungsorte des Donners.
- source_word: ይደቅቅ
  choice: dröhnt
  rationale: Das Verb bezeichnet ein Schlagen, Zerschmettern oder Krachen. Bei Donner gibt „dröhnt“ die heftige akustische Wirkung in natürlichem Deutsch wieder.
- source_word: መልዕልተ ሰማይ
  choice: in der Höhe des Himmels
  rationale: Die Konstruktverbindung bezeichnet die Höhe beziehungsweise den oberen Bereich des Himmels; die Wiedergabe vermeidet den nicht ausdrücklich vorhandenen Herkunftssinn „von oben“.
- source_word: ተመመንደርት የብስ
  choice: die Wohnstätten des Festlandes
  rationale: Die schwierige Wendung verbindet Wohn- oder Siedlungsstätten mit trockenem Land. „Festland“ bewahrt den Gegensatz zum Wasser, ohne den Ausdruck vorschnell zu „Erde“ zu verallgemeinern.
- source_word: አስተአርአየኒ
  choice: er zeigte mir
  rationale: Die kausative Verbform nennt einen persönlichen, im unmittelbaren Satz jedoch nicht näher bestimmten Handelnden.
- source_word: ለሰላም ወለበረከት ወእመ ለረገም
  choice: ob zu Frieden und Segen oder zum Fluch
  rationale: Die Formulierung bewahrt sowohl die Gegenüberstellung wohltätiger und strafender Wirkung als auch die offene syntaktische Beziehung zum Donnerschall.
- source_word: በቃለ እግዚአ መናፍስት
  choice: nach dem Wort des Herrn der Geister
  rationale: „Nach dem Wort“ hält die Bedeutung zwischen göttlichem Ausspruch, Verfügung und Befehl offen; „Herr der Geister“ wahrt den etablierten Henoch-Titel.
theological_decisions:
- issue: Wohltätige oder strafende Funktion des Donners
  choice: Der Donnerschall steht unter dem Wort des Herrn der Geister und kann mit Frieden und Segen oder mit Fluch verbunden sein.
  alternative: Der Donner verkündet lediglich verschiedene Folgen, oder unterschiedliche Donnerklänge zeigen diese an.
  rationale: Die Syntax lässt die genaue Art der Beziehung offen. Die Übersetzung bewahrt diese kosmisch-gerichtliche Spannung, statt sie meteorologisch oder prophetisch festzulegen.
- issue: Titel እግዚአ መናፍስት
  choice: Herr der Geister
  alternative: Herr der Geistwesen
  rationale: „Herr der Geister“ entspricht dem wiederkehrenden Titel in 1 Henoch und legt die Identität der Geister nicht näher fest.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die Satzgliederung wurde gegenüber der langen Quellperiode behutsam aufgelockert. Schwierige kosmologische Bilder und syntaktische Mehrdeutigkeit bleiben erhalten.
