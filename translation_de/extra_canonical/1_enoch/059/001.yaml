base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/059/001.yaml
  text: In those days my eyes saw the secrets of the lightnings and the lights[a], and their courses, and they flash forth for blessing and for curse[d][c][b], as the Lord of Spirits has willed.
translation:
  language: de
  text: In jenen Tagen sahen meine Augen die Geheimnisse der Blitze und der Lichter sowie ihre Bahnen[a]; und sie leuchten auf zum Segen und zum Fluch, wie der Herr der Geister es gewollt hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die überlieferte beziehungsweise eingelesene Wortform ist unsicher. Möglich sind auch „ihre Ordnungen“ oder „ihre Verläufe“. Nach einer vorgeschlagenen Korrektur des ge'ezischen Textes wäre dagegen „ihre Gerichte“ zu lesen.
    reason: textual_and_lexical_uncertainty
lexical_decisions:
- source_word: በአማንቱ፡ መዋዕል
  choice: In jenen Tagen
  rationale: Bewahrt die wiederkehrende apokalyptische Zeitformel in einem gehobenen, aber gegenwärtig verständlichen Deutsch.
- source_word: ርእያ፡ አዕይንትየ
  choice: sahen meine Augen
  rationale: Gibt die ausdrückliche Nennung der Augen und damit die Unmittelbarkeit der Vision wieder.
- source_word: ኅቡኣተ
  choice: die Geheimnisse
  rationale: Das Wort bezeichnet hier am ehesten verborgene Dinge oder Geheimnisse; „Vorratskammern“ würde einen konkreten kosmischen Aufbewahrungsort in den Text hineintragen, obwohl dafür in 1 Henoch ein anderes Wort üblich ist.
- source_word: መባርቅት፡ ወብርሃናት
  choice: der Blitze und der Lichter
  rationale: Behält die beiden pluralischen Himmelserscheinungen bei, ohne „Lichter“ unnötig auf Sterne oder Gestirne einzuengen.
- source_word: ወአክኒሆሙ
  choice: sowie ihre Bahnen
  rationale: Folgt der vorgelegten ge'ezischen Lesart und gibt im kosmologischen Zusammenhang eine geregelte Bewegung beziehungsweise einen Verlauf wieder; die Textform und ihre genaue Bedeutung sind jedoch unsicher.
- source_word: ወይበርቁ
  choice: und sie leuchten auf
  rationale: Gibt die plötzlich hervortretende Lichtwirkung natürlich wieder und lässt als Subjekt sowohl die Blitze als auch die Lichter zu.
- source_word: ለበረከት፡ ወለመረገም
  choice: zum Segen und zum Fluch
  rationale: Bewahrt die scharfe Gegenüberstellung von wohltätiger und verheerender Wirkung.
- source_word: በከመ፡ ፈቀደ
  choice: wie ... es gewollt hat
  rationale: Drückt die Übereinstimmung der kosmischen Vorgänge mit dem göttlichen Willen idiomatisch aus.
- source_word: እግዚአ፡ መናፍስት
  choice: der Herr der Geister
  rationale: Gibt den festen göttlichen Titel im Henochbuch konsequent und ohne konfessionelle Erweiterung wieder.
theological_decisions:
- issue: Verhältnis der Himmelserscheinungen zu Segen und Fluch
  choice: Die Erscheinungen leuchten unter dem Willen des Herrn der Geister zum Segen und zum Fluch auf.
  alternative: Segen und Fluch könnten lediglich ihre Wirkungen beschreiben, ohne eine ausdrückliche Beauftragung der Erscheinungen zu behaupten.
  rationale: Die Zweckangaben stehen unmittelbar beim Verb und werden auf den Willen des Herrn der Geister bezogen. Die Übersetzung bewahrt diese göttliche Einordnung, ohne die genaue Art der Verursachung weiter festzulegen.
- issue: Unsichere Lesart des Ausdrucks nach „Lichter“
  choice: Bahnen
  alternative: Gerichte
  rationale: Die im Auftrag angeführte Textform und die jüngste Revisionsschicht stützen eine kosmologische Deutung als Bahnen oder Verläufe. Zugleich ist eine Korrektur der gedruckten Form zu einem Wort für „Gerichte“ vorgeschlagen worden; diese textkritische Spannung wird in der Fußnote offengelegt und nicht stillschweigend entschieden.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem apokalyptischem Ton. Die markante Formel „sahen meine Augen“ bleibt bewusst erhalten. Archaisierende Formen werden vermieden; die echte textkritische Unsicherheit bei ወአክኒሆሙ wird durch eine Fußnote sichtbar gemacht.
