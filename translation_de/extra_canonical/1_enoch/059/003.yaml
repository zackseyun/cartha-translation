base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/059/003.yaml
  text: And after this all the hidden things of the lights and of the lightnings were shown to me[c][b][a]; they flash for blessing and for abundance.
translation:
  language: de
  text: Und danach wurden mir alle verborgenen Dinge der Lichter und der Blitze gezeigt[a][b]; sie leuchten auf zum Segen und zur Fülle.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »alle Geheimnisse der Lichter und der Blitze«. Wörtlich steht hier »alle ihre verborgenen Dinge«.'
    reason: lexical_alternative
  - marker: b
    text: Mit den »Lichtern« können in diesem visionären Zusammenhang besonders die Himmelslichter gemeint sein.
    reason: cultural_note
  - marker: c
    text: 'Die transkribierte Vorlage hat ትርእየ, was auch als »du wirst mir zeigen« verstanden werden könnte. Wahrscheinlich ist jedoch ተርእየ zu lesen: »wurden mir gezeigt« beziehungsweise »erschienen mir«.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: ወእምድኅረዝ
  choice: Und danach
  rationale: Bewahrt die zeitliche Übergangsformel der Visionsfolge in natürlichem modernem Deutsch.
- source_word: ትርእየ ሊተ
  choice: wurden mir … gezeigt
  rationale: 'Der überlieferte Wortlaut wird aufgrund der wahrscheinlichen Lesart ተርእየ passivisch verstanden: Die verborgenen Dinge wurden dem Seher offenbart.'
- source_word: ኵሉ ኅቡኣቲሆሙ
  choice: alle verborgenen Dinge
  rationale: Gibt den substantivierten Plural eng wieder, ohne ihn vorschnell als technischen Ausdruck »Geheimnisse« festzulegen.
- source_word: ለብርሃናት
  choice: der Lichter
  rationale: Die breite Bedeutung »Lichter« bleibt erhalten; im kosmischen Zusammenhang können Himmelslichter gemeint sein.
- source_word: ወለመባርቅት
  choice: und der Blitze
  rationale: Der Plural und die lebhafte kosmische Bildsprache werden im Deutschen natürlich wiedergegeben.
- source_word: ወለበረከት
  choice: zum Segen
  rationale: Die Präposition wird hier final verstanden und auf das folgende Aufleuchten bezogen.
- source_word: ወለጽጋብ
  choice: und zur Fülle
  rationale: »Fülle« gibt Überfluss oder reichliches Vorhandensein in gehobenem, aber verständlichem Deutsch wieder; die Präposition wird final verstanden.
- source_word: ይበርቁ
  choice: sie leuchten auf
  rationale: Bewahrt die plötzliche Lichtbewegung des Verbs und klingt im Deutschen natürlicher als ein erneutes »blitzen« unmittelbar nach »Blitze«.
theological_decisions:
- issue: Ob der Text von technischen apokalyptischen »Geheimnissen« spricht
  choice: verborgene Dinge
  alternative: Geheimnisse
  rationale: Die konkrete, weitere Bedeutung des geʿezischen Ausdrucks bleibt im Haupttext erhalten; eine technische apokalyptische Deutung wird nicht erzwungen.
- issue: Bezug von »zum Segen und zur Fülle«
  choice: finale Bestimmung des Aufleuchtens
  alternative: 'weitere Genitivglieder: »des Segens und der Fülle«'
  rationale: Die Präpositionen bei Segen und Fülle werden entsprechend der grammatischen Revision als Zweckangabe zu ይበርቁ verstanden, nicht parallel zu den Lichtern und Blitzen.
- issue: Person und Diathese des Offenbarungsverbs
  choice: 'Passiv: »wurden mir … gezeigt«'
  alternative: 'Aktiv/Futur: »du wirst mir … zeigen«'
  rationale: Die wahrscheinlich korrigierte Lesart ተርእየ unterstützt das passive beziehungsweise mediale Verständnis; die abweichende überlieferte Transkription wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kosmische Bildsprache bleibt konkret; schwer verständliche Nominalketten werden maßvoll geglättet. Echte lexikalische und textkritische Mehrdeutigkeit wird in den Fußnoten bewahrt.
