  source_fidelity: Der Entwurf gibt die Imperative, die doppelte Schutzformel, die intensive Hitze und die abschließende Unmöglichkeit, Erde oder Felsen zu betreten, insgesamt quellentreu wieder. Die schwierige Klausel über Sonne und Sommerbeginn ist angemessen als unsicher markiert. Allerdings legt „ihrer Hitze“ im Schlusssatz das im Geʿez nicht eindeutig festgelegte Bezugswort auf „die Erde“ fest; die Vorlage lässt den Bezug von „seiner/ihrer Hitze“ offener.
  naturalness: Modernes, würdiges Deutsch. Die Satzfolge wird mit einem Komma statt Semikolon vor der kausalen Schlussfolgerung flüssiger. „Wegen der Hitze“ ist idiomatisch und vermeidet einen unnötig bestimmten pronominalen Bezug.
  terminology: „Betrachtet“, „Zuflucht und Schatten“, „glühende Hitze“ und „versengt“ passen zum beobachtenden, gehobenen Register und bewahren die lexikalische Doppelung. „Sommertage“ ist vertretbar. Die Fußnote zur schwierigen Anfangsklausel wahrt die Auslegungs- und Textunsicherheit.
  issues:
