base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/004/001.yaml
  text: And again[a], observe the days of summer—how the sun comes upon it at its beginning, and you seek shelter and shade because of the heat of the sun[c][b], and the earth is scorched with burning heat, and you cannot tread on the earth or upon a rock because of its heat.
translation:
  language: de
  text: 'Und wiederum: Betrachtet die Sommertage – wie die Sonne gleich zu Beginn über ihnen steht[a]. Ihr sucht Zuflucht und Schatten[b] vor der Hitze der Sonne, und die Erde wird von glühender Hitze versengt, sodass ihr wegen der Hitze weder auf die Erde noch auf einen Felsen treten könnt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Formulierung im Ge’ez ist schwierig. Sie kann auch bedeuten: „wie die Sonne zu ihrem Beginn über sie kommt“; vermutlich ist die Stärke oder Stellung der Sonne zu Beginn des Sommers gemeint.'
    reason: textual_variant
  - marker: b
    text: Wörtlich steht eine doppelte Wendung, etwa „Zuflucht und Schatten“. Die Übersetzung bewahrt diese Doppelung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ዳግመ
  choice: wiederum
  rationale: Kennzeichnet ein weiteres, zum vorherigen Abschnitt paralleles Beispiel und bewahrt den wiederholenden Lehrstil.
- source_word: ጠየቁ
  choice: Betrachtet
  rationale: Der Imperativ fordert im Kontext zur eingehenden Wahrnehmung der Natur auf; die Bedeutung „fragen/untersuchen“ bleibt möglich, doch „betrachtet“ entspricht dem argumentativen Zusammenhang und dem griechischen Zeugnis καταμάθετε.
- source_word: መዋዕለ ሐጋይ
  choice: die Sommertage
  rationale: Bewahrt die konkrete Zeitangabe des Ge’ez und ist im modernen Deutschen verständlich.
- source_word: ከመ ኮነ ፀሓይ ላዕሌሃ በቅድሜሃ
  choice: wie die Sonne gleich zu Beginn über ihnen steht
  rationale: Gibt die schwierige Klausel zurückhaltend wieder und bezieht die pronominale Form sinngemäß auf die Sommertage, ohne die genaue Vorstellung vom Wirken der Sonne zu überpräzisieren.
- source_word: ተኀሥሡ ምጽላለ ወጽላሎተ
  choice: ihr sucht Zuflucht und Schatten
  rationale: Bewahrt sowohl die Tätigkeit des Suchens als auch die doppelte Ausdrucksweise für Schutz vor der Sonne.
- source_word: በእንተ ዋዕየ ፀሓይ
  choice: vor der Hitze der Sonne
  rationale: Natürliches Deutsch für den kausalen Anlass der Schutzsuche; „vor“ bezeichnet hier das Ausweichen angesichts der Sonnenhitze.
- source_word: ወምድርኒ ትውዒ እሙቀተ ሐሩር
  choice: und die Erde wird von glühender Hitze versengt
  rationale: Gibt die intensive Erhitzung der Erde anschaulich wieder, ohne eine zusätzliche symbolische Deutung einzutragen.
- source_word: ኢትክሉ ከይዶታ ለምድር ወኢ ኰኵሐ በእንተ ዋዕያ
  choice: wegen ihrer Hitze könnt ihr weder auf die Erde noch auf einen Felsen treten
  rationale: Bewahrt die negierte Doppelstruktur und die konkrete Folge der Hitze; das Pronomen wird naheliegend auf die Erde bezogen.
theological_decisions:
- issue: Naturbeobachtung als theologische Zeugenschaft
  choice: Der Vers bleibt eine konkrete Beschreibung der geordneten Jahreszeit und ihrer Wirkungen.
  alternative: Die Hitze ausdrücklich als Bild des göttlichen Gerichts auslegen.
  rationale: Der einzelne Vers beschreibt Naturphänomene; seine theologische Funktion ergibt sich aus dem größeren Zusammenhang und soll nicht interpretierend in den Wortlaut eingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter pluralischer Anrede. Der rhythmische Beobachtungsstil und die konkreten Naturbilder bleiben erhalten; die schwierige Anfangsklausel wird durch eine Fußnote offengehalten.
