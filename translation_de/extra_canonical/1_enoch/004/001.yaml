    rationale: Die geʿezische Schlusswendung benennt die Hitze, ohne dass im Deutschen ein eindeutiger Bezug auf die Erde erzwungen werden sollte. „Wegen der Hitze“ bewahrt die Offenheit der Vorlage und bleibt natürlich.
  - severity: low
    issue: Das Semikolon vor „wegen ihrer Hitze“ trennt eine eng zum vorangehenden Hitzebild gehörende Folgerung unnötig stark.
    rationale: Ein Komma stellt den fortlaufenden, parataktischen Charakter des Verses besser dar.
