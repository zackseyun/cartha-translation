base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/009.yaml
  text: And into the hands of my chosen ones I will deliver them[a], and like straw in the fire, so they will burn before the face of the holy ones; and like lead in water, they will sink before the face of the righteous[e][d][c][b], and no trace will be found for them.
translation:
  language: de
  text: Und in die Hände meiner Erwählten werde ich sie ausliefern,[a] und wie Stroh im Feuer, so werden sie vor den Heiligen verbrennen; und wie Blei im Wasser werden sie vor den Gerechten versinken, und keine Spur wird von ihnen zu finden sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht das Bild einer Übergabe „in die Hände“ der Erwählten; gemeint sein kann, dass sie ihrer richterlichen Gewalt übergeben werden.
    reason: lexical_alternative
  - marker: b
    text: 'Das heißt: Von ihnen wird nichts zurückbleiben, nicht einmal eine Spur.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ውስተ፡ እዴሆሙ፡ ለኅሩያን፡ ዚአየ
  choice: in die Hände meiner Erwählten
  rationale: Bewahrt das konkrete Hand-Bild des Ge’ez; „meiner“ gibt ዚአየ als Possessivform wieder. Der mögliche Sinn „in ihre Gewalt“ bleibt unausgesprochen.
- source_word: እወድዮሙ
  choice: werde ich sie ausliefern
  rationale: Die Form wird als Verb der ersten Person Singular im Futur verstanden. „Ausliefern“ passt zur Übergabe in die Hände und zum folgenden Gerichtsgeschehen.
- source_word: ከመ፡ ሣዕር፡ ውስተ፡ እሳት
  choice: wie Stroh im Feuer
  rationale: „Stroh“ ist eine klare, natürliche Wiedergabe des rasch verbrennenden Pflanzenmaterials; „Stoppeln“ wäre ebenfalls möglich.
- source_word: ከመዝ፡ ይውዕዩ
  choice: so werden sie … verbrennen
  rationale: „So“ nimmt die Vergleichskonstruktion ausdrücklich auf; das Futur entspricht dem imperfektischen Verb und dem eschatologischen Zusammenhang.
- source_word: እምቅድመ፡ ገጸ፡ ቅዱሳን
  choice: vor den Heiligen
  rationale: Gibt die Gegenwartsformel idiomatisch wieder, ohne die „Heiligen“ näher als Engel oder Menschen zu bestimmen.
- source_word: ዐረር፡ ውስተ፡ ማይ
  choice: Blei im Wasser
  rationale: Die spezifische Metallbezeichnung erhält das Bild schnellen, unausweichlichen Versinkens.
- source_word: ይሠጠሙ
  choice: werden sie … versinken
  rationale: „Versinken“ ist im Deutschen für das Untergehen im Wasser bildkräftig und entspricht der zukünftigen Aussage.
- source_word: ጻድቃን
  choice: die Gerechten
  rationale: Natürliche und traditionsnahe Bezeichnung der im Gericht bestätigten Gemeinschaft.
- source_word: ወኢይትረከብ፡ ሎሙ፡ አሰር
  choice: und keine Spur wird von ihnen zu finden sein
  rationale: Drückt das völlige Verschwinden aus und bewahrt die unpersönliche Passivkonstruktion sowie den Zukunftsbezug.
theological_decisions:
- issue: Bedeutung der Übergabe „in die Hände“ der Erwählten
  choice: Das konkrete Bild wird beibehalten und durch „ausliefern“ syntaktisch klar gemacht.
  alternative: „in die Gewalt meiner Erwählten“
  rationale: Der Text kann richterliche Macht andeuten, formuliert sie aber durch das Bild der Hände. Die Übersetzung vermeidet eine weitergehende dogmatische Festlegung.
- issue: Identität der „Heiligen“ und der „Gerechten“
  choice: Beide Bezeichnungen bleiben als unterschiedliche Ausdrücke stehen.
  alternative: Beide ausdrücklich als dieselbe Gruppe behandeln oder die Heiligen als Engel bestimmen.
  rationale: Der Parallelismus erlaubt mehrere Identifikationen; der Vers selbst legt keine eindeutige ontologische Zuordnung fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Zukunftsform. Die apokalyptischen Gruppenbezeichnungen und die beiden Vernichtungsbilder werden ohne konfessionelle Ausdeutung bewahrt.
