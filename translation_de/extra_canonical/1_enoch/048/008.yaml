base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/008.yaml
  text: In those days the faces of the kings of the earth and the mighty who possess the dry land shall be humbled[a], because of the works of their hands; for on the day of their distress and affliction[d][c][b], they will not save themselves.
translation:
  language: de
  text: In jenen Tagen werden die Könige der Erde und die Mächtigen, die das trockene Land in Besitz haben, wegen der Werke ihrer Hände mit gesenktem Blick dastehen[a][b]; denn am Tag ihrer Bedrängnis und Drangsal werden sie sich nicht retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »werden niedergeschlagenen Gesichts sein«. Auch möglich: »Ihre Gesichter werden erniedrigt.« Die überlieferte Formulierung ist an dieser Stelle verkürzt bzw. textlich unsicher; die Übersetzung folgt der wahrscheinlichen Lesung, nach der die Könige und Mächtigen das Subjekt sind.'
    reason: textual_and_translation_alternative
  - marker: b
    text: Die »Werke ihrer Hände« sind zunächst ihre Taten; die Wendung kann zugleich selbst geschaffene Macht oder Götzen anklingen lassen.
    reason: cultural_note
lexical_decisions:
- source_word: በዝንቱ፡ መዋዕል
  choice: In jenen Tagen
  rationale: Bewahrt die geläufige apokalyptische Zeitformel in natürlichem, würdigem Deutsch.
- source_word: ክኑ፡ ትሑታነ፡ ገጽ
  choice: werden … den Blick senken
  rationale: Folgt der wahrscheinlich verderbten bzw. verkürzten Überlieferung von ይከውኑ, »sie werden werden«, und gibt ትሑታነ ገጽ als idiomatische Beschreibung eines niedergeschlagenen oder gedemütigten Gesichts wieder, ohne ein zusätzliches Beschämungsverb einzutragen.
- source_word: ነገሥተ፡ ምድር
  choice: die Könige der Erde
  rationale: Die apokalyptische Bezeichnung meint irdische Herrscher; »Erde« bewahrt den umfassenden Horizont.
- source_word: ጽኑዓን
  choice: die Mächtigen
  rationale: Bezeichnet einflussreiche oder starke Personen neben den Königen und entspricht dem erhöhten Register des Gerichtswortes.
- source_word: እለ፡ ይእኅዝዋ፡ ለየብስ
  choice: die das trockene Land in Besitz haben
  rationale: Gibt sowohl das Halten bzw. Besitzen als auch die konkrete Bedeutung von የብስ, »trockenes Land«, wieder.
- source_word: በእንተ፡ ምግባረ፡ እደዊሆሙ
  choice: wegen der Werke ihrer Hände
  rationale: Erhält die biblische Wendung für menschliches Tun und lässt einen möglichen Anklang an selbst geschaffene Macht oder Götzen offen.
- source_word: በዕለተ፡ ጻዕቆሙ፡ ወጻሕቦሙ
  choice: am Tag ihrer Bedrängnis und ihres Leidens
  rationale: Bewahrt die zwei einander verstärkenden Begriffe des eschatologischen Unheils.
- source_word: ኢይድኅኑ፡ ርእሶሙ
  choice: werden sie sich nicht selbst retten können
  rationale: Gibt das ausdrückliche reflexive Objekt klar wieder; »können« bringt im Deutschen die im Zusammenhang gemeinte Unfähigkeit zur Selbstrettung natürlich zum Ausdruck.
theological_decisions:
- issue: Bezug der Wendung ትሑታነ ገጽ
  choice: Sie beschreibt den niedergeschlagenen Zustand der Könige und Mächtigen.
  alternative: Die Gesichter der Könige und Mächtigen werden erniedrigt; nach weniger wahrscheinlicher Analyse könnte die Wendung als eigene nominale Gruppe verstanden werden.
  rationale: Der wahrscheinliche Wortlaut mit ይከውኑ macht die Herrscher zum Subjekt und »niedergeschlagen im Gesicht« zum Prädikat. Die Fußnote erhält die bildhafte und syntaktische Alternative.
- issue: Möglicher Götzenbezug der »Werke ihrer Hände«
  choice: Die breite Formulierung bleibt im Haupttext stehen.
  alternative: Die Wendung ausdrücklich als ihre Götzen oder als ihre selbst geschaffene politische Macht deuten.
  rationale: Der Ausdruck kann Götzendienst anklingen lassen, fordert diese Engführung hier aber nicht.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem apokalyptischem Ton. Konkrete Bilder wie »trockenes Land« und »Werke ihrer Hände« bleiben erhalten; die schwerfällige wörtliche Gesichtsformel wird im Haupttext idiomatisch wiedergegeben und in der Fußnote dokumentiert.
