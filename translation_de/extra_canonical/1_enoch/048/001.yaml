base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/001.yaml
  text: In that place I saw the spring of righteousness[a], which is inexhaustible, and around it were many springs of wisdom. And all the thirsty drank from them and were filled with wisdom[f][e][d][c][b], and their dwelling was with the righteous and the holy and the chosen.
translation:
  language: de
  text: An jenem Ort sah ich die unerschöpfliche Quelle der Gerechtigkeit, und viele Quellen der Weisheit umgaben sie ringsum[a]. Alle Durstigen tranken aus ihnen und wurden mit Weisheit erfüllt; ihre Wohnstätte war bei den Gerechten, den Heiligen[b] und den Erwählten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die ge'ezische Formulierung für die Anordnung der Weisheitsquellen ist schwierig und im vorliegenden Textzeugen offenbar wiederholt. Die Übersetzung folgt dem wahrscheinlichen Sinn, dass viele Quellen der Weisheit die Quelle der Gerechtigkeit umgaben.
    reason: textual_variant
  - marker: b
    text: 'Oder: »denen, die heilig sind« beziehungsweise »den heiligen Menschen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መካን
  choice: Ort
  rationale: Die übliche ge'ezische Ortsbezeichnung wird im visionären Zusammenhang natürlich und ohne geografische Überbestimmung wiedergegeben.
- source_word: ነቅዐ / አንቅዕተ
  choice: Quelle / Quellen
  rationale: Bezeichnet Wasserquellen, aus denen getrunken wird. Die einheitliche Wiedergabe bewahrt die Parallelität zwischen Gerechtigkeit und Weisheit.
- source_word: ጽድቅ
  choice: Gerechtigkeit
  rationale: Bewahrt den moralisch-eschatologischen Leitbegriff und die Bildspannung einer Quelle der Gerechtigkeit.
- source_word: ዘኢይትኄለቍ
  choice: unerschöpflich
  rationale: Gibt im Zusammenhang einer Quelle die Vorstellung nicht messbarer beziehungsweise nicht aufbrauchbarer Fülle knapp und idiomatisch wieder.
- source_word: አውዳ፡ የአውዳ
  choice: rings um sie waren
  rationale: Vermittelt die räumliche Anordnung der Weisheitsquellen um die Quelle der Gerechtigkeit, ohne die schwierige beziehungsweise wiederholte Form des Zeugen zu überdeuten.
- source_word: ጥበብ
  choice: Weisheit
  rationale: Die übliche und sachlich passende Wiedergabe des sapientialen Begriffs.
- source_word: ጽሙኣን
  choice: die Durstigen
  rationale: Erhält das konkrete Wasserbild und deutet den Durst nicht vorschnell allegorisch aus.
- source_word: ይሰትዩ
  choice: tranken
  rationale: Der einfache Vergangenheitssinn passt zur Abfolge des Visionsberichts.
- source_word: ይትመልኡ
  choice: wurden … erfüllt
  rationale: Bewahrt den passiv-resultativen Sinn und das Bild, dass Weisheit die Trinkenden erfüllt.
- source_word: ማኅደሪሆሙ
  choice: ihre Wohnstätte
  rationale: Bezeichnet einen bleibenden Aufenthalts- oder Wohnort; die gewählte Form ist würdig und verständlich.
- source_word: ጻድቃን
  choice: die Gerechten
  rationale: Entspricht dem Leitwort Gerechtigkeit und ist die natürliche Bezeichnung der eschatologischen Gruppe.
- source_word: ቅዱሳን
  choice: die Heiligen
  rationale: Bewahrt den substantivischen Plural als Gruppenbezeichnung; ein Hinweis nennt die mögliche adjektivische Lesart.
- source_word: ኅሩያን
  choice: die Erwählten
  rationale: Gibt die dritte Gruppenbezeichnung parallel und ohne zusätzliche konfessionelle Festlegung wieder.
theological_decisions:
- issue: Ausgestaltung der Wasserbilder
  choice: Quelle, Durstige, tranken und erfüllt bleiben als konkrete Bilder stehen.
  alternative: Die Bilder im Haupttext als geistlichen Empfang von Gerechtigkeit und Weisheit ausdeuten.
  rationale: Der apokalyptische Visionstext soll seine bildhafte Offenheit und theologische Spannung behalten.
- issue: Wiedergabe der abschließenden Dreiergruppe
  choice: die Gerechten, die Heiligen und die Erwählten
  alternative: die Gerechten, die heilig sind, und die Auserwählten
  rationale: Die substantivischen Gruppenbezeichnungen erhalten die parallele Struktur des Ge'ez; zugleich wird keine spätere ekklesiale Systematik eingetragen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem visionärem Erzählton. Kurze, klare Satzführung; zentrale Bild- und Gruppenbegriffe werden konsequent beibehalten.
