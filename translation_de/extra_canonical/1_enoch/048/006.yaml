base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/006.yaml
  text: For this reason[a], he was chosen and hidden before him before the world was created[c][b], and forever.
translation:
  language: de
  text: Aus diesem Grund wurde er vor ihm erwählt und verborgen, noch bevor die Welt erschaffen wurde, und für immer.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Vor ihm« kann auch mit »in seiner Gegenwart« wiedergegeben werden. Gemeint ist wahrscheinlich Gott; die Übersetzung bewahrt jedoch die relationale Ausdrucksweise des Ge'ez.
    reason: lexical_alternative
  - marker: b
    text: Wörtlicher könnte der Schluss auch »bis in Ewigkeit« oder »bis zum Zeitalter« lauten.
    reason: lexical_alternative
lexical_decisions:
- source_word: በእንተዝ
  choice: Aus diesem Grund
  rationale: Gibt die begründende Funktion natürlich und präzise wieder.
- source_word: ኮነ
  choice: wurde er
  rationale: Mit den folgenden Prädikaten ergibt sich im Deutschen eine natürliche resultative beziehungsweise passivische Formulierung.
- source_word: ኅሩየ
  choice: erwählt
  rationale: Entspricht der apokalyptischen Bezeichnung einer durch göttliche Entscheidung ausgesonderten Gestalt, ohne zusätzliche Lehrbegriffe einzutragen.
- source_word: ወኅቡአ
  choice: und verborgen
  rationale: Bewahrt die parallele Verbindung mit »erwählt« und das Motiv einer bis zur bestimmten Zeit verborgenen Gestalt.
- source_word: በቅድሜሁ
  choice: vor ihm
  rationale: Bewahrt die räumlich-relationale Ausdrucksweise und lässt den Bezug, wahrscheinlich auf Gott, unausgesprochen.
- source_word: ዘእንበለ ይትፈጠር ዓለም
  choice: noch bevor die Welt erschaffen wurde
  rationale: Kennzeichnet klar die zeitliche Priorität gegenüber der Schöpfung; »noch« verhindert eine schwerfällige Wiederholung von »vor«.
- source_word: ወእስከ ለዓለም
  choice: und für immer
  rationale: Gibt die fortdauernde zeitliche Weite idiomatisch wieder, während eine wörtlichere Alternative in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Ob der Vers mit ausdrücklicher späterer Terminologie zur christologischen Präexistenz wiedergegeben werden soll
  choice: Die lokale apokalyptische Aussage wird als »vor ihm erwählt und verborgen, noch bevor die Welt erschaffen wurde« bewahrt.
  alternative: Interpretierende Formulierungen wie »präexistent bei Gott« oder »von Ewigkeit her vorherbestimmt«.
  rationale: Der Text behauptet eine Erwählung und Verborgenheit vor der Weltschöpfung, formuliert jedoch keine spätere dogmatische Begrifflichkeit. Die Übersetzung erhält die starke zeitliche Aussage, ohne sie konfessionell auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Stellung von »noch bevor« vermeidet die schwerfällige Folge »vor ihm, bevor«, ohne die räumliche und zeitliche Unterscheidung des Ausgangstextes aufzugeben.
