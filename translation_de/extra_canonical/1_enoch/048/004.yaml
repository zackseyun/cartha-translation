base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/004.yaml
  text: He will be a staff for the righteous[a], so that they may lean on him and not fall; and he will be the light of the nations[c][b], and he will be hope for those who are troubled in heart.
translation:
  language: de
  text: Er wird den Gerechten ein Stab sein, damit sie sich auf ihn stützen und nicht fallen. Und er wird das Licht der Völker sein[a] und denen Hoffnung sein, die in ihrem Herzen leiden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Licht für die Völker“. „Das Licht der Völker“ gibt die Genitivverbindung unmittelbar wieder; die Alternative fasst ihre Beziehung zu den Völkern sinnentsprechend.'
    reason: lexical_alternative
  - marker: b
    text: Das Verb kann „leiden“ oder „krank sein“ bedeuten. Mit „in ihrem Herzen“ bezeichnet die Wendung wahrscheinlich innere Bedrängnis, ohne körperliches Leiden grundsätzlich auszuschließen.
    reason: lexical_alternative
lexical_decisions:
- source_word: በትረ
  choice: Stab
  rationale: Das Substantiv bezeichnet einen Stab oder eine Rute. Weil die Gerechten sich darauf stützen und nicht fallen, bewahrt „Stab“ das konkrete Bild einer tragenden Stütze, ohne die königlichen Untertöne von „Zepter“ einzutragen.
- source_word: ለጻድቃን
  choice: den Gerechten
  rationale: Die substantivierte Form ist im Deutschen die natürliche Bezeichnung dieser Gruppe und entspricht dem apokalyptischen Sprachgebrauch.
- source_word: ይትመረጐዙ
  choice: sich auf ihn stützen
  rationale: Die folgende Wendung „und nicht fallen“ legt das Bild körperlicher und zugleich sinnbildlicher Stütze nahe.
- source_word: ወኢይደቁ
  choice: und nicht fallen
  rationale: „Fallen“ führt das Bild des Stabes unmittelbar fort; „straucheln“ wäre möglich, würde den Zusammenhang mit dem Sichstützen aber abschwächen.
- source_word: ብርሃነ አሕዛብ
  choice: das Licht der Völker
  rationale: Dies bildet die äthiopische Genitivverbindung knapp und unmittelbar ab. „Völker“ vermeidet eine unnötige spätere Gegenüberstellung von Juden und Heiden.
- source_word: ተስፋ
  choice: Hoffnung
  rationale: „Hoffnung“ gibt die eschatologische und tröstende Bedeutung in diesem Zusammenhang am besten wieder.
- source_word: ለእለ የሐምሙ በልቦሙ
  choice: denen, die in ihrem Herzen leiden
  rationale: Das Verb kann Krankheit oder Leiden bezeichnen. Zusammen mit „in ihrem Herzen“ weist es auf innere Bedrängnis hin, ohne die körperliche Bedeutung völlig auszuschließen.
theological_decisions:
- issue: Bezug des wiederholten ውእቱ
  choice: Durchgehend mit dem Personalpronomen „er“ wiedergegeben
  alternative: Wiederholt „dieser“ verwenden oder den Bezug teilweise unausgesprochen lassen
  rationale: Der unmittelbare Kontext verweist auf eine einzelne erhöhte Gestalt. „Er“ ist im Deutschen klar und natürlich, ohne spätere dogmatische Formulierungen in den Text einzutragen.
- issue: Bestimmtheit von ብርሃነ አሕዛብ
  choice: „das Licht der Völker“ im Haupttext
  alternative: „ein Licht für die Völker“
  rationale: Die knappe Genitivverbindung wird formal am unmittelbarsten mit „das Licht der Völker“ wiedergegeben. Da der unbestimmte und zielgerichtete Sinn ebenfalls möglich ist, bleibt er in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Satzform mit „sein“ bewahrt den feierlichen Parallelismus des Ge’ez; „denen Hoffnung sein“ ist bewusst etwas gehoben, bleibt aber verständlich und bildet die prädikative Konstruktion genauer ab als „Hoffnung geben“.
