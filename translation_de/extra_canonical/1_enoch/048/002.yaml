base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/002.yaml
  text: And at that hour that Son of Man was named in the presence of the Lord of Spirits[b][a], and his name was before the Head of Days.
translation:
  language: de
  text: Und in jener Stunde wurde jener Menschensohn[a] in der Gegenwart des Herrn der Geister genannt, und sein Name war vor dem Haupt der Tage[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »wurde gerufen«. Das passive Verb kann eine Benennung oder ein Rufen bezeichnen; »wurde genannt« passt zur anschließenden Wiederholung von »sein Name«.'
    reason: lexical_alternative
  - marker: b
    text: »Haupt der Tage« ist die wörtliche Wiedergabe eines göttlichen Titels in den Bilderreden. Die ungewöhnliche Bildsprache bleibt bewusst erhalten.
    reason: cultural_note
lexical_decisions:
- source_word: በይእቲ ሰዓት
  choice: in jener Stunde
  rationale: Bewahrt die feierliche apokalyptische Zeitangabe und die zeitliche Bestimmtheit von »Stunde«.
- source_word: ተጸውዐ
  choice: wurde … genannt
  rationale: Das Passiv bezeichnet hier am ehesten Benennung oder Bezeichnung; die Wahl nimmt zugleich die folgende Erwähnung seines Namens auf, ohne die mögliche Bedeutung »gerufen« zu verschweigen.
- source_word: ወልደ ሰብእ ዝኩ
  choice: jener Menschensohn
  rationale: Das Demonstrativum verweist auf die bestimmte visionäre Gestalt. »Menschensohn« bewahrt den titelartigen Charakter im Kontext der Bilderreden; »jener« entspricht der distalen Verweisung.
- source_word: በኀበ እግዚአ መናፈስት
  choice: in der Gegenwart des Herrn der Geister
  rationale: Gibt die Nähe vor dem himmlischen Herrscher in würdiger, verständlicher Sprache wieder und bewahrt die höfisch-apokalyptische Szenerie.
- source_word: ስሙ
  choice: sein Name
  rationale: Die ausdrückliche Wiederholung des Namensmotivs bleibt erhalten.
- source_word: መቅድመ
  choice: war vor
  rationale: Die knappe räumliche Formulierung lässt offen, ob Gegenwart, Vorrang oder Präexistenz anklingt.
- source_word: ርእሰ መዋዕል
  choice: dem Haupt der Tage
  rationale: Die wörtliche Wiedergabe erhält das charakteristische Bild des göttlichen Titels, statt es durch eine geläufigere Deutung zu ersetzen.
theological_decisions:
- issue: Generische Bezeichnung oder Titel bei ወልደ ሰብእ
  choice: jener Menschensohn
  alternative: jener Mensch; jener Sohn des Menschen
  rationale: Im unmittelbaren Kontext bezeichnet der Ausdruck eine bestimmte erhöhte endzeitliche Gestalt. Die titelartige Wiedergabe folgt diesem lokalen Gebrauch, ohne sie durch spätere christliche Lehre weiter auszudeuten.
- issue: Mögliche Präexistenz in »sein Name war vor dem Haupt der Tage«
  choice: sein Name war vor dem Haupt der Tage
  alternative: sein Name wurde vor dem Haupt der Tage genannt; sein Name bestand schon vor dem Haupt der Tage
  rationale: Der knappe geezische Wortlaut kann himmlische Gegenwart, Vorrang oder Präexistenz nahelegen, legt sich aber nicht eindeutig fest. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst beibehaltener apokalyptischer Bildsprache. »Jener« wahrt die distale Verweisung; die Satzstruktur bleibt nahe am geezischen Text, ohne im Deutschen unverständlich zu wirken.
