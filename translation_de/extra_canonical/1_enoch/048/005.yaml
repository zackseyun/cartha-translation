base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/005.yaml
  text: And all who dwell upon the dry land shall fall down and bow before him[a], and they shall praise and bless and sing to the Lord of Spirits.
translation:
  language: de
  text: Und alle, die auf dem trockenen Land wohnen[a], werden niederfallen und sich vor ihm verbeugen, und sie werden ihn preisen und segnen und dem Herrn der Geister singen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „auf der Erde“. Im Ge’ez lautet es wörtlich: „auf dem trockenen Land“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወድቁ
  choice: werden niederfallen
  rationale: Bewahrt die körperliche, apokalyptische Gebärde der Unterwerfung, ohne sie bereits als kultische Handlung auszudeuten.
- source_word: ይሰግዱ
  choice: sich verbeugen
  rationale: Gibt die körperliche Ehrenbezeugung natürlich wieder und vermeidet das stärker deutende „anbeten“.
- source_word: ቅድሜሁ
  choice: vor ihm
  rationale: Entspricht der räumlichen Formulierung und erhält den männlichen Singularbezug.
- source_word: ኵሎሙ
  choice: alle
  rationale: Gibt den universalen Umfang knapp und idiomatisch wieder.
- source_word: እለ የኃድሩ ዲበ የብስ
  choice: die auf dem trockenen Land wohnen
  rationale: Bewahrt die konkrete Bedeutung „trockenes Land“ statt sie ohne Kennzeichnung zum umfassenderen „Erde“ zu verallgemeinern.
- source_word: ይሴብሕዎ
  choice: sie werden ihn preisen
  rationale: Das angefügte Objektsuffix wird ausdrücklich wiedergegeben; „preisen“ passt zum doxologischen Zusammenhang.
- source_word: ይባርክዎ
  choice: segnen
  rationale: Erhält die eigenständige Segenssprache; das gemeinsame Objekt „ihn“ ist im Deutschen bei der koordinierten Verbfolge verständlich.
- source_word: ይዜምሩ
  choice: dem Herrn der Geister singen
  rationale: „Singen“ ist die natürliche deutsche Wiedergabe gesungenen Lobes; der Dativ gibt die mit ለ markierte Ausrichtung idiomatisch wieder.
- source_word: ለእግዚአ መናፈስት
  choice: dem Herrn der Geister
  rationale: Bewahrt den wiederkehrenden göttlichen Titel und das apokalyptische Register.
theological_decisions:
- issue: Bezug von „ihm“ und Verhältnis zum abschließenden Titel
  choice: Die Singularpronomen bleiben auf die im unmittelbaren Kontext erhöhte Gestalt bezogen, während „dem Herrn der Geister“ als ausdrücklich genannter Adressat des Singens stehen bleibt.
  alternative: Sämtliche Pronomen und der Titel könnten auf dieselbe Gestalt bezogen werden; oder der ganze Vers könnte ausschließlich Gott meinen.
  rationale: Der ge'ezische Wortlaut stellt Singularsuffixe und den ausdrücklichen Titel eng nebeneinander. Die Übersetzung erhält diese Spannung, ohne die Identitäten gleichzusetzen oder voneinander zu trennen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die doppelte Körperbewegung „niederfallen und sich verbeugen“ sowie der etablierte Titel „Herr der Geister“ bewahren den visionär-apokalyptischen Ton.
