base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/010.yaml
  text: And on the day of their affliction[b][a], rest shall come upon the earth.
translation:
  language: de
  text: Und am Tag ihrer Bedrängnis[a] wird Ruhe über die Erde kommen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Not« beziehungsweise »Bedrückung«. Das geʿezische Wort bezeichnet Druck oder schwere Not; die genaue Nuance lässt sich aus diesem kurzen Satz allein nicht sicher bestimmen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: »wird Ruhe auf der Erde sein« oder »wird Ruhe auf der Erde entstehen«. Das Verb kann ein Sein oder Werden ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በዕለተ
  choice: am Tag
  rationale: Die temporale Präpositionalverbindung wird knapp und natürlich wiedergegeben; zugleich bleibt die apokalyptische Zeitangabe erhalten.
- source_word: ጻሕበ
  choice: Bedrängnis
  rationale: Das Substantiv bezeichnet Druck, Not oder schwere Bedrückung. »Bedrängnis« ist würdig und verständlich, ohne den Ausdruck unnötig zu einem feststehenden endzeitlichen Fachbegriff zu machen.
- source_word: ዚአሆሙ
  choice: ihrer
  rationale: Die genitivische Pronominalform verweist auf die zuvor genannte Gruppe zurück und wird im Deutschen possessiv wiedergegeben.
- source_word: ዕረፍት
  choice: Ruhe
  rationale: »Ruhe« bewahrt den Grundgedanken des Aufhörens oder Ruhens und lässt offen, ob Erleichterung für bestimmte Menschen, Frieden oder ein allgemeines Ende der Unruhe gemeint ist.
- source_word: ትከውን
  choice: wird … kommen
  rationale: Das Verb bezeichnet Sein oder Werden. Die eventive Wiedergabe ist im Deutschen natürlich und bringt das zukünftige Eintreten der Ruhe zum Ausdruck, ohne dessen genaue Art festzulegen.
- source_word: ዲበ ምድር
  choice: über die Erde
  rationale: Die Formulierung wahrt den umfassenden, kosmischen Klang des apokalyptischen Zusammenhangs. Sie ist gegenüber »im Land« nicht unnötig geografisch verengt.
theological_decisions:
- issue: Reichweite und Bedeutung der »Ruhe«
  choice: Eine nicht näher bestimmte Ruhe, die über die Erde kommt
  alternative: Erleichterung ausschließlich für die Gerechten; Ende nach dem Gericht; Frieden in einem bestimmten Land
  rationale: Der knappe Satz nennt weder die Empfänger noch die genaue Art der Ruhe. Die Übersetzung bewahrt diese theologische Offenheit, statt sie aus einer bestimmten Deutung des Kontextes aufzulösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit einem knappen, würdigen und leicht erhöhten apokalyptischen Ton. Die Satzstruktur bleibt nahe am geʿezischen Ausgangstext, ohne im Deutschen steif zu wirken.
