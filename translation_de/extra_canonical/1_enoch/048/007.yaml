base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/007.yaml
  text: And the wisdom of the Lord of Spirits has revealed him to the holy and to the righteous[a]; for they have kept the portion of the righteous, because they hated and despised this world of unrighteousness, and they hated all its works and its ways in the name of the Lord of Spirits. For by his name they are saved[d][c][b], and by his good pleasure their life came to be.
translation:
  language: de
  text: Und die Weisheit des Herrn der Geister offenbarte ihn den Heiligen[a] und den Gerechten; denn sie haben den Anteil der Gerechten bewahrt, weil sie diese Welt der Ungerechtigkeit hassten und verachteten; und sie hassten alle Werke und Wege dieser Welt im Namen des Herrn der Geister. Denn durch seinen Namen werden sie gerettet[b], und durch sein Wohlgefallen entstand ihr Leben[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den heiligen Menschen“. Der ge’ezische Ausdruck bezeichnet eine Gruppe geheiligter oder ausgesonderter Menschen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „durch seinen Namen werden sie gerettet werden“ beziehungsweise „finden sie Rettung“. Die Form kann eine gegenwärtige, allgemeine oder zukünftige Aussage ausdrücken.'
    reason: temporal_ambiguity
  - marker: c
    text: 'Oder: „durch seinen Willen wurde ihr Leben begründet“. Gemeint ist, dass ihr Leben vom Willen des Herrn der Geister abhängt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ከሠተ
  choice: offenbarte
  rationale: Das aktive Verb bedeutet hier „offenbaren/enthüllen“. Sein Objekt ist das im Kontext vorausgesetzte „ihn“; eine passive Wiedergabe als „wurde ausgegossen“ wäre nicht quellengerecht.
- source_word: ቅዱሳን
  choice: die Heiligen
  rationale: Bezeichnet kollektiv Menschen, die geheiligt beziehungsweise ausgesondert sind, ohne notwendig spätere kirchliche Vorstellungen aufzurufen.
- source_word: ጻድቃን
  choice: die Gerechten
  rationale: Bewahrt die zentrale ethische und apokalyptische Gruppenbezeichnung.
- source_word: ጥበቡ ለእግዚአ መናፍስት
  choice: die Weisheit des Herrn der Geister
  rationale: „Weisheit“ ist das Subjekt des Satzes; die Genitivverbindung darf nicht ausgelassen werden.
- source_word: ዐቀቡ
  choice: haben … bewahrt
  rationale: Gibt die vollendete, fortwirkende Treue natürlich wieder; „bewahrt“ passt idiomatisch zum folgenden „Anteil“.
- source_word: ክፍሎሙ ለጻድቃን
  choice: den Anteil der Gerechten
  rationale: „Anteil“ lässt offen, ob ein zugemessener Teil, Los oder Erbe gemeint ist, und vermeidet eine unnötige Festlegung.
- source_word: ዘዓመፃ
  choice: der Ungerechtigkeit
  rationale: Kennzeichnet die Welt als von moralischem Unrecht geprägt und korrespondiert sprachlich mit „die Gerechten“.
- source_word: ምግባሮ ወፍናዊሁ
  choice: ihre Werke und ihre Wege
  rationale: Bewahrt die rhetorische Paarung von Handlungen und sittlicher Lebensrichtung.
- source_word: በስሙ
  choice: im Namen / durch seinen Namen
  rationale: Die erste Stelle bezeichnet die Sphäre oder Grundlage ihrer Ablehnung; die zweite den Grund beziehungsweise das Mittel ihrer Rettung. Die unterschiedlichen deutschen Präpositionen folgen dem jeweiligen Satzbezug.
- source_word: ይድኅኑ
  choice: werden sie gerettet
  rationale: Die Form kann präsentisch, allgemein oder zukunftsbezogen verstanden werden. Das deutsche Präsens Passiv wahrt die allgemeine Aussage, ohne den endzeitlichen Horizont auszuschließen.
- source_word: በፈቃዱ
  choice: durch sein Wohlgefallen
  rationale: Gibt den göttlichen Willen mit seiner wohlwollenden, absichtsvollen Färbung wieder.
- source_word: ኮነ ሕይወቶሙ
  choice: entstand ihr Leben
  rationale: Folgt dem Wortsinn „ihr Leben kam zustande/entstand“, ohne den Satz zu „wurde begründet“ oder „wurde erhalten“ auszudeuten.
theological_decisions:
- issue: Zeitlicher Bezug der Rettung durch den Namen
  choice: Denn durch seinen Namen werden sie gerettet
  alternative: Denn durch seinen Namen werden sie gerettet werden / finden sie Rettung
  rationale: Die präsentische Form kann eine allgemeine Heilswirklichkeit ausdrücken und lässt zugleich eine eschatologische Erfüllung offen.
- issue: Bedeutung des Anteils der Gerechten
  choice: den Anteil der Gerechten bewahrt
  alternative: ihr Los unter den Gerechten bewahrt / das Erbe der Gerechten bewahrt
  rationale: Die Quelle lässt offen, ob Anteil, Los, Erbe oder zugewiesener Stand gemeint ist. „Anteil“ wahrt diese Mehrdeutigkeit.
- issue: Wirkung des göttlichen Wohlgefallens auf das Leben
  choice: durch sein Wohlgefallen entstand ihr Leben
  alternative: durch seinen Willen wurde ihr Leben begründet
  rationale: Die relativ konkrete Formulierung folgt dem Ge’ez, ohne genauer zu bestimmen, ob Schöpfung, Bewahrung oder eschatologisches Leben gemeint ist.
- issue: Das nicht ausdrücklich genannte Objekt von „offenbarte“
  choice: offenbarte ihn
  alternative: machte ihn bekannt
  rationale: Der maskuline Objektbezug wird entsprechend dem Kontext bewahrt, statt ihn durch eine unpersönliche Aussage über ausgegossene Weisheit zu ersetzen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Satzbau bleibt nahe am ge’ezischen Gedankengang, wird jedoch durch einen Satzpunkt lesbarer gemacht. „Herr der Geister“ wird als feste apokalyptische Bezeichnung konsequent beibehalten; konfessionell geprägte Zusatzdeutungen werden vermieden.
