revisions:
- from: Und die Weisheit des Herrn der Geister offenbarte ihn den Heiligen[a] und den Gerechten; denn sie haben den Anteil der Gerechten bewahrt, weil sie diese Welt der Ungerechtigkeit hassten und verachteten. Auch alle ihre Werke und ihre Wege hassten sie im Namen des Herrn der Geister. Denn durch seinen Namen werden sie gerettet[b], und durch sein Wohlgefallen entstand ihr Leben[c].
  to: Und die Weisheit des Herrn der Geister offenbarte ihn den Heiligen[a] und den Gerechten; denn sie haben den Anteil der Gerechten bewahrt, weil sie diese Welt der Ungerechtigkeit hassten und verachteten; und sie hassten alle Werke und Wege dieser Welt im Namen des Herrn der Geister. Denn durch seinen Namen werden sie gerettet[b], und durch sein Wohlgefallen entstand ihr Leben[c].
  rationale: Die einzige Änderung macht den im Ausgangstext eindeutigen Bezug von „Werken und Wegen“ auf die ungerechte Welt auch im Deutschen eindeutig. Die Satzverknüpfung mit „und“ bildet dabei die geʿezische Reihung genauer ab. Bedeutung, Ambiguitäten, Terminologie und sämtliche Fußnotenanker bleiben erhalten.
