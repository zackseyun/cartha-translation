    issue: Mehrdeutiger Bezug von „ihre Werke und ihre Wege“
    rationale: Im Geʿez beziehen sich die Suffixe eindeutig auf „diese Welt der Ungerechtigkeit“. Im Deutschen kann „ihre“ nach dem vorangehenden „sie“ jedoch auf die Gerechten bezogen werden. Eine explizite Wiederaufnahme von „dieser Welt“ beseitigt diese nicht quellentextliche Mehrdeutigkeit.
