base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/048/003.yaml
  text: And before the sun and the signs were created[a], before the stars of heaven were made[c][b], his name was called before the Lord of Spirits.
translation:
  language: de
  text: Und bevor die Sonne und die Zeichen erschaffen wurden, bevor die Sterne des Himmels gemacht wurden, wurde sein Name vor dem Herrn der Geister[a] genannt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »in der Gegenwart des Herrn der Geister«. Die ge’ezische Präposition kann hier das Stehen vor jemandem beziehungsweise die Gegenwart an seinem Hof bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ዘእንበለ / እንበለ
  choice: bevor
  rationale: In Verbindung mit den folgenden Verben bezeichnet die Wendung jeweils zeitliche Vorordnung. Die Wiederholung bildet die beiden Schöpfungssätze des Ge'ez ab.
- source_word: ፀሐይ ወታእምር
  choice: die Sonne und die Zeichen
  rationale: Das verbindende ወ ordnet »die Zeichen« zusammen mit »der Sonne« dem ersten Verb zu; die Zeichen dürfen daher nicht syntaktisch mit den Sternen des folgenden Satzglieds verbunden werden.
- source_word: ትትፈጠር
  choice: erschaffen wurden
  rationale: Die passive Schöpfungssprache und der Plural im Deutschen entsprechen den verbundenen Subjekten »Sonne und Zeichen«.
- source_word: ከዋክብተ ሰማይ
  choice: die Sterne des Himmels
  rationale: Die natürliche deutsche Genitivverbindung bewahrt den kosmologischen und gehobenen Sinn des Ausdrucks.
- source_word: ይትገበሩ
  choice: gemacht wurden
  rationale: Die passive Wiedergabe erhält die Parallelität zu »erschaffen wurden«, ohne beide ge'ezischen Verben einzuebnen.
- source_word: ስሙ ተጸውዐ
  choice: sein Name wurde genannt
  rationale: Die Formulierung bewahrt das maskuline Pronomen und lässt offen, ob das Verb vor allem Benennung, Verkündigung oder Anrufung bezeichnet.
- source_word: በቅድመ
  choice: vor
  rationale: »Vor« kann im Deutschen wie die ge'ezische Präposition sowohl die Stellung angesichts einer Person als auch eine schlichte Vorordnung ausdrücken; der Anwesenheitssinn wird in der Fußnote verdeutlicht.
- source_word: እግዚአ መናፈስት
  choice: der Herr der Geister
  rationale: Dies bewahrt den im Henochbuch etablierten Titel wörtlich und in würdigem, verständlichem Deutsch.
theological_decisions:
- issue: Identität dessen, auf den sich »sein Name« bezieht
  choice: Das maskuline Pronomen bleibt ohne ergänzenden Titel stehen.
  alternative: Den Bezug ausdrücklich als »der Erwählte« oder »der Menschensohn« identifizieren.
  rationale: Der Zusammenhang weist auf die zuvor beschriebene erhöhte Gestalt, doch der Vers selbst nennt hier keinen Titel. Eine Ergänzung würde die im Wortlaut verbleibende Offenheit unnötig auflösen.
- issue: Aussage über die Existenz der Gestalt vor der Schöpfung
  choice: Der Text spricht ausdrücklich nur davon, dass sein Name vor der Erschaffung der Himmelskörper genannt wurde.
  alternative: Den Satz als ausdrückliche Aussage über seine persönliche Präexistenz formulieren.
  rationale: Die zeitliche Aussage über den Namen besitzt theologisches Gewicht, darf aber nicht ohne Kennzeichnung in eine weitergehende ontologische Behauptung umgeschrieben werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Konstruktion mit »bevor« wahrt den feierlichen Parallelismus; »gemacht« bleibt bewusst neben »erschaffen« stehen, damit die unterschiedlichen Verben der Quelle erkennbar bleiben.
