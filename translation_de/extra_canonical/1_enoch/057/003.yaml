base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/057/003.yaml
  text: And all of them shall fall down and worship the Lord of Spirits[a]. And this is the end of the second parable.
translation:
  language: de
  text: Und sie alle werden niederfallen und den Herrn der Geister anbeten. Und dies ist das Ende des zweiten Gleichnisses.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »das Ende eines anderen Gleichnisses« beziehungsweise »das Ende des anderen Gleichnisses«, falls ካልእ nicht im Sinn von »zweiten« verstanden wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወድቁ
  choice: werden niederfallen
  rationale: Bewahrt die konkrete körperliche Bewegung des Niederfallens, ohne sie bereits als kultische Prostration auszudeuten.
- source_word: ኵሎሙ
  choice: sie alle
  rationale: Gibt sowohl die Gesamtheit als auch den ausdrücklichen pronominalen Rückbezug natürlich wieder.
- source_word: ይሰግዱ
  choice: anbeten
  rationale: Im Zusammenhang mit dem Niederfallen vor dem Herrn der Geister bezeichnet das Verb ehrfürchtige, kultische Verehrung; die körperliche Gebärde ist bereits im vorhergehenden Verb ausgedrückt.
- source_word: ለእግዚአ መናፍስት
  choice: den Herrn der Geister
  rationale: Erhält den für 1 Henoch charakteristischen Gottes­titel und gibt die Genitivverbindung formal und verständlich wieder.
- source_word: ዝንቱ ውእቱ
  choice: dies ist
  rationale: Natürliche Wiedergabe der identifizierenden Formel ohne unnötige Hervorhebung.
- source_word: ተፍጻሜተ
  choice: das Ende
  rationale: Bezeichnet hier den Abschluss eines literarischen Abschnitts; „Ende“ ist prägnant und idiomatisch.
- source_word: ካልእ ምሳሌ
  choice: des zweiten Gleichnisses
  rationale: Im gliedernden Schlussvermerk liegt eine ordinale Bedeutung nahe; die ebenfalls möglichen nicht sequenziellen Bedeutungen werden in der Fußnote erhalten.
theological_decisions:
- issue: Wiedergabe des Gottestitels ለእግዚአ መናፍስት
  choice: Herr der Geister
  alternative: Herr der Geisterwesen
  rationale: Der charakteristische henochische Titel bleibt in seiner örtlichen Form erhalten und wird nicht an spätere theologische Formeln angeglichen.
- issue: Bedeutung von ካልእ in der Schlussformel
  choice: zweiten
  alternative: eines anderen / des anderen
  rationale: Die Funktion als Abschnittsschluss innerhalb der Gleichnisreden spricht für eine ordinale Lesart; da das Wort auch nicht sequenziell verstanden werden kann, bleibt diese Mehrdeutigkeit in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am ge’ezischen Text, klingt jedoch natürlich; der traditionelle henochische Titel „Herr der Geister“ wird bewahrt.
