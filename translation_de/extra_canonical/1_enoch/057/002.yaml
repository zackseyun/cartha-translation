base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/057/002.yaml
  text: And the sound of their chariots was heard[a]; and when this turmoil came to be, the holy ones in heaven took notice, and the pillars of the earth were shaken from their foundations[e][d][c][b], and it was heard from one end of heaven to the other in one day.
translation:
  language: de
  text: Und das Geräusch ihrer Streitwagen war zu hören[a]. Als diese Unruhe entstand, bemerkten es die Heiligen aus dem Himmel[b], und die Säule der Erde wurde von ihrem Platz erschüttert[c]. Und es war an einem einzigen Tag von einem Ende des Himmels bis zum anderen zu hören[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Der Schall des Geräusches ihrer Streitwagen wurde gehört.“ Das Ge’ez verbindet hier zwei Ausdrücke für Schall oder Geräusch.'
    reason: lexical_alternative
  - marker: b
    text: Mit den „Heiligen aus dem Himmel“ sind hier wahrscheinlich himmlische Wesen gemeint; der Text nennt sie jedoch nicht ausdrücklich Engel.
    reason: cultural_note
  - marker: c
    text: 'Das Ge’ez steht hier im Singular: „die Säule der Erde“. Das zugrunde liegende Wort kann Sitz, Ort, Stand oder Grundlage bezeichnen; die Formulierung bewahrt die kosmologische Bildsprache.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich: „von den Enden des Himmels bis zu den Enden“; gemeint ist die ganze Ausdehnung des Himmels.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተሰምዐ / ተሰምዓ
  choice: war zu hören / es war … zu hören
  rationale: Bewahrt die passive Wahrnehmungsformel des ge’ezischen Visionsberichts in natürlichem Deutsch.
- source_word: ቃለ ድምፀ ሰረገላቲሆሙ
  choice: der Schall ihrer Streitwagen
  rationale: „Schall“ gibt die akustische Wirkung der Wagen würdig und idiomatisch wieder; die im Ge’ez verdichtete doppelte Klangbezeichnung wird nicht durch das schwerfällige „Schall des Geräusches“ nachgebildet.
- source_word: ዝሀውክ
  choice: diese Unruhe
  rationale: Der Ausdruck bezeichnet Aufruhr, Erschütterung oder Unruhe; „Unruhe“ hält die genaue Art des Geschehens offen.
- source_word: ቅዱሳን
  choice: die Heiligen
  rationale: Gibt die substantivierte Bezeichnung wieder, ohne im Haupttext ausdrücklich „Engel“ einzusetzen.
- source_word: አእመሩ
  choice: bemerkten es
  rationale: Drückt das Wahrnehmen oder Gewahrwerden in unmittelbarer Reaktion auf das Ereignis aus.
- source_word: ዐምደ ምድር
  choice: die Säulen der Erde
  rationale: Bewahrt die kosmologische Bildsprache des Ausgangstextes.
- source_word: ተሐውሰ እመንበሩ
  choice: wurden von ihren Grundfesten erschüttert
  rationale: „Grundfesten“ passt zur Säulenmetaphorik; eine Fußnote hält die wörtlicheren Möglichkeiten „Ort“ und „Stand“ offen.
- source_word: እምአጽናፈ ሰማይ እስከ አጽናፍ
  choice: von einem Ende des Himmels bis zum anderen
  rationale: Gibt die ge’ezische Wendung für die gesamte Ausdehnung des Himmels in verständlichem Deutsch wieder.
- source_word: በአሐቲ ዕለት
  choice: an einem einzigen Tag
  rationale: Natürliche deutsche Zeitangabe, die die Betonung der Einheit des Tages wahrt.
theological_decisions:
- issue: Identität der „Heiligen“
  choice: Die Bezeichnung „die Heiligen“ bleibt im Haupttext bestehen; ihre himmlische Verortung wird ausdrücklich genannt.
  alternative: „die heiligen Engel“ oder „die Heiligen vom Himmel“
  rationale: Der Kontext legt himmlische Wesen nahe, doch der Ausgangstext nennt sie nicht ausdrücklich Engel. Die Übersetzung bewahrt diese Spannung.
- issue: Kosmologische Säulen der Erde
  choice: Die Bildsprache wird wörtlich als „Säulen der Erde“ beibehalten.
  alternative: „die Grundfesten der Erde“ oder eine entmythologisierende Umschreibung
  rationale: Das apokalyptische Weltbild gehört zur Aussageform des Textes und soll nicht modernisierend aufgelöst werden.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem apokalyptischem Ton. Die Satzglieder bleiben eng an der ge’ezischen Abfolge, werden jedoch durch Punktsetzung lesbarer gestaltet. Altertümliche Formen und unnötig technische Formulierungen wurden vermieden.
