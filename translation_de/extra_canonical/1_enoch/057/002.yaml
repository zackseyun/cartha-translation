revisions:
- from: Und der Schall ihrer Streitwagen war zu hören[a]. Als diese Unruhe entstand, bemerkten es die Heiligen im Himmel[b], und die Säulen der Erde wurden von ihren Grundfesten erschüttert[c]. Und es war an einem einzigen Tag von einem Ende des Himmels bis zum anderen zu hören[d].
  to: Und das Geräusch ihrer Streitwagen war zu hören[a]. Als diese Unruhe entstand, bemerkten es die Heiligen aus dem Himmel[b], und die Säule der Erde wurde von ihrem Platz erschüttert[c]. Und es war an einem einzigen Tag von einem Ende des Himmels bis zum anderen zu hören[d].
  rationale: 'Eine sichere Revision ist erforderlich, weil die Richtungsangabe „aus dem Himmel“ und der Singular von „Säule“ im deutschen Haupttext zu korrigieren sind. Die übrigen Entscheidungen bleiben sachgerecht: Die genaue Art der Unruhe bleibt offen, die himmlischen Heiligen werden nicht dogmatisch als Engel festgelegt, und die kosmologische Metapher wird nicht abgeschwächt.'
