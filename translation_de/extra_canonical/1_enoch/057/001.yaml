revisions:
- from: Danach sah ich ein weiteres Heer von Streitwagen, auf denen Männer fuhren. Sie kamen auf den Winden vom Osten und vom Westen bis zum Süden.
  to: 'Danach sah ich eine weitere Vision: Streitwagen und Männer, die in ihnen fuhren; sie kamen auf den Winden aus Osten und Westen bis zum Süden.'
  rationale: Die Revision stellt den in der ge'ezischen Vorlage ausdrücklich genannten Charakter als „Vision“ wieder her und präzisiert die Stellung der Männer in den Streitwagen. Die ungewöhnliche, aber beabsichtigte Bildsprache vom Kommen auf den Winden und die Richtungsangabe zum Süden bleiben unverändert in ihrer Aussage erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:08:38Z'
review_pass:
  verdict: revise
  source_fidelity: Die ge'ezische Wortfolge enthält ትዕይንተ („Vision/Schau“) als Kern von „eine weitere Vision von Streitwagen“. „Heer von Streitwagen“ ist daher keine tragfähige Wiedergabe und folgt dem englischen Audittext, nicht vorrangig dem überlieferten Ausgangstext. Die Männer befinden sich „in“ den Wagen; die Ankunft „auf den Winden“ sowie die Richtungsangabe bis zum Süden bleiben erhalten.
  naturalness: Der Entwurf ist insgesamt verständlich und würdevoll. Nach der notwendigen Wiederherstellung von „Vision“ macht ein Doppelpunkt die Bildfolge im modernen Deutsch klar. „in ihnen fuhren“ gibt die Lokalangabe der Quelle präziser wieder als „auf denen fuhren“.
  terminology: „Vision“ ist hier der einschlägige Begriff für ትዕይንተ und sollte nicht durch das militärische „Heer“ ersetzt werden. „Streitwagen“ und „auf den Winden“ sind passend. „Süden“ gibt die wörtlich „Tagesmitte“ bedeutende Himmelsrichtung angemessen wieder.
  issues:
  - severity: high
    issue: „Heer von Streitwagen“ ersetzt „eine weitere Vision von Streitwagen“.
    rationale: Das im Ausgangstext stehende ትዕይንተ bezeichnet eine Schau bzw. Vision. Die kollektive Lesart „Heer“ ist weder durch den Wortlaut gedeckt noch gegenüber der englischen Auditfassung zu bevorzugen.
  - severity: medium
    issue: „auf denen Männer fuhren“ weicht von der Ortsangabe „in ihnen“ ab.
    rationale: Die Quelle lokalisiert die Männer in den Streitwagen. Die Korrektur wahrt dieses Detail, ohne über ihre genaue Rolle als Lenker oder Kämpfer zu entscheiden.
  revised_text: 'Danach sah ich eine weitere Vision: Streitwagen und Männer, die in ihnen fuhren; sie kamen auf den Winden aus Osten und Westen bis zum Süden.'
  revised_footnotes: []
