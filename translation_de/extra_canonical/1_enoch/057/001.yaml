base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/057/001.yaml
  text: And after that I saw another host of chariots, and men riding in them; and they were coming upon the winds from the east and from the west, as far as the south.
translation:
  language: de
  text: 'Danach sah ich eine weitere Vision: Streitwagen und Männer, die in ihnen fuhren; sie kamen auf den Winden aus Osten und Westen bis zum Süden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ትዕይንተ፡ ሠረገላት
  choice: Heer von Streitwagen
  rationale: Die Wendung bezeichnet hier eine große geordnete Schar von Wagen. „Heer“ bewahrt das kollektive und eindrucksvolle Bild, ohne es zu einer bloßen „Vision“ umzudeuten.
- source_word: ይጼዐኑ፡ ሰብእ፡ ውስቴቶሙ
  choice: auf denen Männer fuhren
  rationale: Gibt das Bild von Männern wieder, die von den Wagen getragen werden beziehungsweise auf ihnen fahren; „fuhren“ ist im Deutschen bei Streitwagen natürlicher als „ritten“.
- source_word: ዲበ፡ ነፋሳት
  choice: auf den Winden
  rationale: Die räumliche Präposition und das übernatürliche Bild werden bewusst wörtlich bewahrt.
- source_word: እስከ፡ መንፈቀ፡ ዕለት
  choice: bis zum Süden
  rationale: Die wörtliche Vorstellung der „Tagesmitte“ beziehungsweise Mittagsrichtung ist eine gebräuchliche Bezeichnung für den Süden.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Bildsprache der auf den Winden kommenden Streitwagen bleibt erhalten; die Satzstruktur wurde für flüssiges Deutsch leicht gegliedert.
