base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/036/002.yaml
  text: And from there I went toward the east to the ends of heaven[a], and I saw three open portals of heaven toward the east[b], and above them small portals.
translation:
  language: de
  text: Und von dort ging ich nach Süden bis an die Enden der Erde. Dort sah ich drei offene Tore des Himmels; aus ihnen kommen der Südwind, der Tau, der Regen und der Wind hervor. Von dort ging ich nach Osten bis an die Enden des Himmels. Dort sah ich drei offene Tore des Himmels, die nach Osten gerichtet waren, und über ihnen kleinere Tore. Durch jedes dieser kleineren Tore ziehen die Sterne des Himmels hindurch und gehen auf der ihnen sichtbaren Bahn nach Westen. Als ich das sah, pries ich den Herrn der Herrlichkeit. Zu jeder Zeit preise ich ihn, der große und herrliche Wunder vollbracht hat, um seinen Engeln und den Seelen der Menschen die Größe seines Wirkens zu zeigen, damit sie sein Werk und all sein Tun rühmen, das Wirken seiner Macht sehen, das große Werk seiner Hände preisen und ihn in Ewigkeit segnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አዜብ
  choice: Süden / Südwind
  rationale: Das Wort bezeichnet zunächst die Himmelsrichtung Süden; bei den aus den Toren hervorkommenden Wettererscheinungen ist die natürliche deutsche Wiedergabe „Südwind“.
- source_word: አጽናፈ፡ ምድር / አጽናፈ፡ ሰማይ
  choice: Enden der Erde / Enden des Himmels
  rationale: Die unterschiedliche Formulierung des ge'ezischen Textes wird beibehalten und nicht aneinander angeglichen.
- source_word: ኀዋኅወ፡ ሰማይ
  choice: Tore des Himmels
  rationale: „Tore“ gibt die kosmischen Öffnungen der Vision verständlich und traditionsnah wieder.
- source_word: ጽባሕ
  choice: Osten
  rationale: In diesem Richtungskontext bezeichnet der Ausdruck den Osten beziehungsweise die Richtung des Sonnenaufgangs.
- source_word: ነፍሳተ፡ ሰብእ
  choice: Seelen der Menschen
  rationale: Die formale Wiedergabe bewahrt die anthropologische Ausdrucksweise der Quelle, ohne sie als bloßes „Menschen“ zu glätten.
- source_word: እግዚአ፡ ስብሐት
  choice: Herrn der Herrlichkeit
  rationale: Die feste Ehrenbezeichnung wird würdig und quellennah wiedergegeben.
theological_decisions:
- issue: Bezug der abschließenden Lob- und Segenssätze
  choice: 'Die wechselnden Objekte werden entsprechend der ge''ezischen Syntax wiedergegeben: Gottes Werk wird gerühmt, Gott selbst wird gepriesen und gesegnet.'
  alternative: Alle Verben einheitlich unmittelbar auf Gott beziehen.
  rationale: Die Quelle wechselt zwischen dem Schöpfer und seinem Werk; diese Spannung wird nicht durch Harmonisierung beseitigt.
- issue: „Seelen der Menschen“
  choice: Die ausdrückliche Seelensprache bleibt erhalten.
  alternative: „den Menschen“
  rationale: Eine Vereinfachung könnte die anthropologische Aussage der Quelle abschwächen oder vorentscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer visionärer Erzählbewegung. Die vollständige ge'ezische Quelle wurde gegenüber der veralteten, fragmentarischen englischen Konsultationsschicht priorisiert. Keine Fußnoten sind nötig, da die frühere Fragmentannahme durch den nun vollständig vorliegenden Quelltext überholt ist.
