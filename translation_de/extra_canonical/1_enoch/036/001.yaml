base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/036/001.yaml
  text: And from there I went toward the south[a], to the ends of the earth; and there I saw three open portals of heaven, and from there come out the south wind, and dew, and rain[c][b], and wind.
translation:
  language: de
  text: Und von dort ging ich nach Süden bis an die Enden der Erde. Dort sah ich drei offene Tore des Himmels,[a] und aus ihnen kommen der Südwind, Tau, Regen und Wind hervor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die visionäre Darstellung beschreibt den Himmel als Bauwerk mit offenen Durchgängen, aus denen Wettererscheinungen hervorkommen. Das zugrunde liegende Wort kann auch mit „Öffnungen“ oder „Fenster“ wiedergegeben werden.
    reason: Kultur- und Übersetzungshinweis zur kosmischen Bildsprache
lexical_decisions:
- source_word: እምህየ
  choice: von dort
  rationale: Bewahrt die wiederholte ge'ezische Orts- und Übergangsformel in natürlichem Deutsch.
- source_word: ሖርኩ
  choice: ging ich
  rationale: Gibt das schlichte Bewegungsverb in der ersten Person ohne zusätzliche Bedeutungsnuance wieder.
- source_word: መንገለ አዜብ
  choice: nach Süden
  rationale: Die Wendung bezeichnet die Bewegungsrichtung; die knappe deutsche Form ist natürlich und genau.
- source_word: በአጽናፈ ምድር
  choice: bis an die Enden der Erde
  rationale: Erhält die apokalyptisch-kosmographische Vorstellung und gibt die Ziel- beziehungsweise Grenzbedeutung idiomatisch wieder.
- source_word: ሠለስተ ኆዋኅወ ሰማይ ርኁዋተ
  choice: drei offene Tore des Himmels
  rationale: „Tore“ bewahrt das Bild wirklicher himmlischer Durchgänge; ርኁዋተ wird direkt mit „offene“ wiedergegeben.
- source_word: ወይወፅእ እምህየ
  choice: und aus ihnen kommen ... hervor
  rationale: Der beschreibende Präsenscharakter bleibt erhalten; das Pronomen bezieht den Ausgang natürlich auf die zuvor genannten Tore.
- source_word: አዜብ
  choice: Südwind
  rationale: In der Reihe meteorologischer Erscheinungen bezeichnet das Wort plausibel den Wind aus südlicher Richtung.
- source_word: ጠል
  choice: Tau
  rationale: Die konkrete meteorologische Bedeutung „Tau“ entspricht dem ge'ezischen Ausdruck und der enochischen Einteilung der Wettererscheinungen besser als „Nebel“.
- source_word: ዝናም
  choice: Regen
  rationale: Direkte und geläufige Wiedergabe des Wetterbegriffs.
- source_word: ነፋስ
  choice: Wind
  rationale: Der meteorologische Kontext verlangt die physische Bedeutung „Wind“, nicht „Geist“.
theological_decisions:
- issue: Kosmische Architektur des Himmels
  choice: Tore des Himmels
  alternative: Öffnungen beziehungsweise Fenster des Himmels
  rationale: Die Übersetzung bewahrt die konkrete visionäre Kosmographie, ohne sie zu rationalisieren oder auf eine bloße Metapher zu reduzieren.
