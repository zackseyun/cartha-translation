base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/003.yaml
  text: And the moon wanes[a], which takes place through the sixth gate; for in this sixth gate its light is completed[c][b], and from it comes the beginning of the waning.
translation:
  language: de
  text: Und der Mond nimmt ab[a]; dies geschieht durch das sechste Tor. Denn in diesem sechsten Tor erreicht sein Licht sein volles Maß, und von dort setzt die Abnahme ein[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Und der Mond nimmt ab, was durch das sechste Tor geschieht.“ Die äthiopische Formulierung beschreibt den Vorgang in sachlich-prozeduraler Sprache.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „und von dort ist das Haupt [oder: der Anfang] der Verminderung“. „Von dort“ kann auch „von ihm“ wiedergegeben werden.'
    reason: literal_and_referential_alternative
lexical_decisions:
- source_word: ሐጸጸ
  choice: nimmt ab
  rationale: Das einfache Verb bezeichnet das Abnehmen oder Schwinden des Mondes. „Nimmt ab“ gibt den Vorgang direkt und in natürlichem modernem Deutsch wieder.
- source_word: ወርኅ
  choice: der Mond
  rationale: Die übliche Bezeichnung für den Mond in den astronomischen Beschreibungen dieses Abschnitts.
- source_word: ይትገበር
  choice: dies geschieht
  rationale: Die passivisch-reflexive Form beschreibt einen eintretenden Vorgang. „Geschieht“ bewahrt den sachlich-prozeduralen Ton, ohne die im Deutschen schwerfällige Form „wird bewirkt“ zu verwenden.
- source_word: በሳድስት ኆኅት
  choice: durch das sechste Tor
  rationale: Die Präposition bezeichnet im kosmologischen Bild den Durchgang, durch den sich das Gestirn bewegt.
- source_word: ይትፌጸም
  choice: erreicht sein volles Maß
  rationale: Das Verb bezeichnet Vollendung beziehungsweise das Erreichen der Fülle. Bezogen auf das Licht des Mondes ist „sein volles Maß erreichen“ klarer als das missverständliche „vollendet werden“.
- source_word: ብርሃኑ ዚአሁ
  choice: sein Licht
  rationale: Direkte Wiedergabe der auf den Mond bezogenen Wendung.
- source_word: እምኔሁ
  choice: von dort
  rationale: Das Pronomen verweist im unmittelbaren Zusammenhang am ehesten auf das sechste Tor als Ausgangspunkt des folgenden Vorgangs; „von dort“ macht diesen räumlichen Bezug natürlich verständlich.
- source_word: ርእሰ ታሕጻጼት
  choice: beginnt die Abnahme
  rationale: Wörtlich steht „Haupt/Anfang der Verminderung“. Die verbale deutsche Form gibt den idiomatischen Sinn als Einsetzen der Mondabnahme wieder.
theological_decisions:
- issue: Apokalyptisch-kosmologische Verfahrenssprache gegenüber moderner astronomischer Glättung
  choice: Das Bild des sechsten Tores und des geordneten Vorgangs bleibt ausdrücklich erhalten.
  alternative: Den Vers lediglich als Beobachtung von Vollmond und abnehmender Mondphase wiederzugeben.
  rationale: Der Text beschreibt die Bewegungen der Himmelskörper innerhalb seiner eigenen kosmologischen Ordnung. Eine Modernisierung würde diese Aussageebene beseitigen.
- issue: Bezug von እምኔሁ
  choice: „von dort“ mit wahrscheinlichem Bezug auf das sechste Tor
  alternative: „von ihm“ mit möglichem Bezug auf das Licht oder den Mond
  rationale: Der nächstliegende räumliche Bezug im Satz ist das sechste Tor. Da die pronominale Form grundsätzlich weniger eindeutig sein kann, wird die Alternative in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Tor-Metaphorik und die geordnete kosmische Verfahrenssprache bleiben erhalten; schwerfällige Nominalkonstruktionen werden vermieden. Alle Fußnotenmarker stehen im Haupttext.
