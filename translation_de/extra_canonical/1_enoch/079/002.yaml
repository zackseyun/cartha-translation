    reason: textual_variant
  - marker: b
    text: 'Oder: „für seinen Ausgang und seine Anordnung“. Beide ge’ezischen Formen tragen ein Suffix der dritten Person Singular; worauf sich „sein“ bezieht, ist nicht eindeutig.'
    reason: lexical_alternative
  - marker: c
    text: „Sabbat“ kann in dieser kalendarischen Aufzählung auch „Woche“ bedeuten.
    reason: lexical_alternative
