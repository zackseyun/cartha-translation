base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/002.yaml
  text: And he showed me all their ordinances—those for every day and every season[a], and for every year, and for its going out and its command[c][b], in every month and every sabbath.
translation:
  language: de
  text: 'Und er zeigte mir alle ihre Ordnungen: die für jeden Tag und jede Zeit, die Macht hat,[a] und für jedes Jahr, für sein Hervortreten und seinen Befehl,[b] in jedem Monat und jedem Sabbat.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der ge’ezische Satzbau ist hier unsicher. Die im Transkript stehenden Zahlzeichen gehören wahrscheinlich zur Zeilenzählung und bedeuten an dieser Stelle nicht „dreihundertfünfundsechzig“. Der Bezug von „die Macht hat“ bleibt offen.
    reason: textual_variant
  - marker: b
    text: 'Oder: „für seinen Ausgang und seine Anordnung“. Beide ge’ezischen Formen tragen ein Suffix der dritten Person Singular; worauf sich „sein“ bezieht, ist nicht eindeutig.'
    reason: lexical_alternative
  - marker: c
    text: „Sabbat“ kann in dieser kalendarischen Aufzählung auch „Woche“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: አርአየኒ
  choice: er zeigte mir
  rationale: Die Wendung bezeichnet visionäres Zeigen und bleibt in natürlichem Deutsch nahe am ge’ezischen Ausdruck.
- source_word: ኵሎ ሥርዓቶሙ
  choice: alle ihre Ordnungen
  rationale: Im astronomischen Zusammenhang sind festgelegte, regelhafte Abläufe gemeint; „Ordnungen“ bewahrt sowohl den kosmischen als auch den normativen Klang.
- source_word: በኵሉ ዕለት
  choice: für jeden Tag
  rationale: Gibt den wiederkehrenden zeitlichen Geltungsbereich schlicht und katalogartig wieder.
- source_word: በኵሉ ዘመን
  choice: jede Zeit
  rationale: ዘመን kann Zeit, Zeitraum oder Jahreszeit bedeuten. „Zeit“ erhält die Bedeutungsbreite, ohne vorschnell eine saisonale Einteilung festzulegen.
- source_word: ዘበ…ሥልጣን
  choice: die Macht hat
  rationale: Die im Transkript eingebetteten Zahlzeichen sind wahrscheinlich Zeilennummern und dürfen nicht als „365“ gelesen werden. Der erkennbare Ausdruck mit ሥልጣን wird daher vorsichtig als Relativsatz wiedergegeben; sein genauer Bezug bleibt unsicher.
- source_word: ወበኵሉ ዓመት
  choice: und für jedes Jahr
  rationale: Entspricht der wiederholten Struktur der zeitlichen Aufzählung.
- source_word: ወበሙጻኡ
  choice: für sein Hervortreten
  rationale: Das Suffix ist Singular. „Hervortreten“ lässt offen, ob technisch Aufgang, Erscheinen oder Ausgang gemeint ist.
- source_word: ወበትእዛዙ
  choice: und seinen Befehl
  rationale: Auch hier ist das Suffix Singular. „Befehl“ bewahrt den autoritativen Sinn von ትእዛዝ, obwohl im Kontext auch eine vorgeschriebene Ordnung gemeint sein kann.
- source_word: በኵሉ ወርኅ
  choice: in jedem Monat
  rationale: Direkte und natürliche Wiedergabe der kalendarischen Angabe.
- source_word: ኵሉ ሰንበት
  choice: jedem Sabbat
  rationale: „Sabbat“ gibt den wörtlichen und möglicherweise kultischen Sinn wieder; „Woche“ bleibt im kalendarischen Kontext möglich.
theological_decisions:
- issue: Deutung von ሰንበት
  choice: Sabbat
  alternative: Woche
  rationale: Der wörtliche Ausdruck erhält die kultische und theologische Färbung. Die kalendarisch mögliche allgemeinere Bedeutung wird in einer Fußnote genannt.
- issue: Deutung der scheinbaren Zahl vor ሥልጣን
  choice: keine Zahl übersetzen; „die Macht hat“
  alternative: „unter der Herrschaft der dreihundertfünfundsechzig“
  rationale: Die Zeichen ፴, ፴፭ und ፵ entsprechen offenbar eingeschobenen Zeilennummern 30, 35 und 40 des Transkripts. Eine Aussage über 365 wäre daher nicht quellengestützt und stünde zudem spannungsvoll zum 364-Tage-Kalender des Werkes.
- issue: Numerus der Suffixe bei ሙጻኡ und ትእዛዙ
  choice: 'Singular: „sein“'
  alternative: 'Plural: „ihr“'
  rationale: Die ge’ezischen Suffixe sind dritte Person Singular. Die Übersetzung wahrt diese Form, auch wenn der genaue sachliche Bezug im schwierigen Satz nicht eindeutig ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst aufzählender Satzführung. Die syntaktische Rauheit der schwierigen Quelle wird nicht durch eine unbelegte Deutung geglättet; Unklarheiten werden knapp in Fußnoten ausgewiesen.
