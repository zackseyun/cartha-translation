base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/004.yaml
  text: And the waning that is done in the first gate in its season until one hundred and seventy-seven days are completed—by the reckoning of weeks, twenty-five and two days.
translation:
  language: de
  text: Und die Abnahme, die im ersten Tor zu ihrer Zeit erfolgt, dauert an, bis einhundertsiebenundsiebzig Tage vollendet sind – nach der Zählung der Wochen fünfundzwanzig und zwei Tage.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der äthiopische Text ist bei der Wochenrechnung offenbar gestört. Einhundertsiebenundsiebzig Tage entsprechen fünfundzwanzig Wochen und zwei Tagen; einzelne überlieferte Zahlzeichen scheinen davon abzuweichen.
    reason: Die Handschriften- beziehungsweise Editionsgrundlage weist in der Zahlenfolge eine innere Unstimmigkeit auf, die für Leser transparent gemacht werden muss.
lexical_decisions:
- source_word: ታሕጻጼት
  choice: Abnahme
  rationale: Bezeichnet hier im astronomischen Zusammenhang das Abnehmen beziehungsweise Schwinden; die substantivische Wiedergabe wahrt die Form des Textes.
- source_word: ይትገበር
  choice: erfolgt
  rationale: Das passive Verb bedeutet wörtlich „wird getan/gemacht“. „erfolgt“ gibt den Vorgang in natürlichem Deutsch wieder, ohne eine handelnde Person einzuführen.
- source_word: ቀዳሚት
  choice: ersten
  rationale: Bezieht sich auf das erste Tor in der zuvor beschriebenen Ordnung.
- source_word: በዘመኑ ዚአሁ
  choice: zu ihrer Zeit
  rationale: Gibt die zeitliche Zuordnung wieder; das grammatische Bezugswort ist im Deutschen als die „Abnahme“ gefasst.
- source_word: እስከ ይትፌጸም መዋዕል ፻ወ፸ወ፯
  choice: bis einhundertsiebenundsiebzig Tage vollendet sind
  rationale: Bewahrt die Vollendungsformel und die ausdrücklich genannte Tageszahl 177.
- source_word: በ፶፬ ሥርዓተ ሰንበት
  choice: nach der Zählung der Wochen
  rationale: Der überlieferte Wortlaut ist an dieser Stelle textlich beziehungsweise rechnerisch schwierig; die Wiedergabe folgt dem klar erkennbaren Bezug auf eine Wochenordnung oder Wochenrechnung, ohne die problematische Zahl 54 in den Haupttext zu übernehmen.
- source_word: ፳ወ፭ ወ፶፮ ክልኤቱ መዋዕል
  choice: fünfundzwanzig und zwei Tage
  rationale: Der Sinn entspricht 25 Wochen und zwei Tagen (= 177 Tage), doch die äthiopische Zahlenüberlieferung wirkt gestört. Die Übersetzung hält sich an den durch die Gesamtrechnung gestützten Textsinn und kennzeichnet die Schwierigkeit in einer Fußnote.
theological_decisions:
- issue: Personifizierung oder willentliche Verursachung der Abnahme
  choice: 'neutraler Vorgang: „erfolgt“'
  alternative: „wird vollzogen“ / „wird bewirkt“
  rationale: Der Vers beschreibt eine kalendarisch-astronomische Bewegung. Das Passiv des Quelltexts verlangt nicht, einen göttlichen oder anderen Handelnden ausdrücklich einzusetzen.
- issue: Deutung der Zahlenangaben
  choice: Die Gleichung 177 Tage = 25 Wochen und 2 Tage wird im Haupttext bewahrt.
  alternative: Die sichtbaren äthiopischen Zahlzeichen durchgehend wörtlich wiedergeben.
  rationale: Die überlieferte Zahlenfolge ist offenbar gestört; eine rein mechanische Wiedergabe ergäbe keine stimmige Rechnung. Die Unsicherheit wird offengelegt, nicht dogmatisch aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer astronomisch-kalendarischer Terminologie. Die etwas ungewöhnliche Formulierung „fünfundzwanzig und zwei Tage“ bewahrt die erkennbare Struktur der Vorlage beziehungsweise der konsultierten Textschicht; die Fußnote erläutert, dass fünfundzwanzig Wochen gemeint sind.
