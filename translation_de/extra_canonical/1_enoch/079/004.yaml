review_pass:
  verdict: revise
  source_fidelity: Der Entwurf folgt dem erkennbaren kalendarischen Sinn der Stelle (177 Tage = 25 Wochen und 2 Tage), fügt jedoch mit „dauert an“ einen nicht ausgedrückten Aspekt hinzu und unterschlägt die in der bereitgestellten äthiopischen Transkription sichtbare, problematische Zahlenangabe vor „Ordnung der Wochen“. Da die Zahlenüberlieferung bzw. -transkription unsicher ist, muss die textkritische Normalisierung klarer als solche gekennzeichnet werden.
  naturalness: „Und die Abnahme, die im ersten Tor zu ihrer Zeit erfolgt, dauert an“ ist im Deutschen sowohl schwerfällig als auch syntaktisch unnötig erweitert. „Das Abnehmen, das … geschieht“ ist idiomatischer und näher am passivischen Vorgangsausdruck der Vorlage.
  terminology: „Abnehmen“ passt im astronomisch-kalendarischen Zusammenhang besser als das substantivierte „die Abnahme“. „Tor“ und „Wochenrechnung“ sind angemessen. Die Ergänzung „Wochen“ zu „fünfundzwanzig“ ist rechnerisch naheliegend, aber im Haupttext als editorische Ergänzung kenntlich zu machen.
  issues:
  - severity: medium
    issue: Nicht belegte Dauerangabe „dauert an“
    rationale: Die Vorlage sagt, dass das Abnehmen im ersten Tor zu seiner Zeit geschieht, bis 177 Tage vollendet sind; sie fügt nicht ausdrücklich hinzu, dass der Vorgang „andauert“. Die Ergänzung sollte entfallen.
  - severity: high
    issue: Textkritische Zahlenbereinigung wird im Haupttext nicht ausreichend markiert
    rationale: Die überlieferte Transkription enthält eine auffällige Zahlenfolge, während der Haupttext eine geglättete Rechnung bietet. Die rechnerisch überzeugende Lesung 25 Wochen und 2 Tage kann verwendet werden, muss aber durch eckige Ergänzung und eine präzise Fußnote als editorisch erschlossene Lesung ausgewiesen sein.
  - severity: low
    issue: Unnatürliche Nominalformulierung
    rationale: „Das Abnehmen“ bezeichnet den astronomischen Vorgang im heutigen Deutsch klarer und flüssiger als „die Abnahme“.
  revised_text: 'Und das Abnehmen, das im ersten Tor zu seiner Zeit geschieht, bis einhundertsiebenundsiebzig Tage vollendet sind – nach der Wochenrechnung: fünfundzwanzig [Wochen] und zwei Tage.[a]'
  revised_footnotes:
  - marker: a
    text: Wörtlich ist die Zahlenfolge in der bereitgestellten äthiopischen Textgrundlage auffällig und rechnerisch nicht eindeutig. Die hier wiedergegebene Lesung „fünfundzwanzig [Wochen] und zwei Tage“ ergibt 177 Tage und entspricht auch der englischen POB-Prüfspur. Die Ergänzung „Wochen“ ist editorisch.
    reason: Die Fußnote wahrt die Unsicherheit der überlieferten Zahlen, erklärt die rechnerische Grundlage der Übersetzung und kennzeichnet die nicht ausdrücklich ausgeschriebene Einheit als Ergänzung.
  revision_rationale: Die Revision entfernt die unbelegte Aussage einer fortdauernden Abnahme, verbessert die deutsche Syntax und macht die aus dem Zusammenhang erschlossene Wochenangabe transparent. Sie folgt dem plausiblen Sinn der 177-Tage-Rechnung, ohne die auffällige äthiopische Zahlenüberlieferung als eindeutig zu behandeln.
