base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/079/001.yaml
  text: And now[a], my son, I have shown you everything[b], and the order of all the stars of heaven has been completed.
translation:
  language: de
  text: Und nun, mein Sohn, habe ich dir alles gezeigt, und die Ordnung aller Sterne des Himmels ist vollendet worden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Aussage kann den Abschluss der vorausgehenden Darstellung meinen; sie kann aber auch so verstanden werden, dass die Ordnung beziehungsweise Anordnung aller Sterne des Himmels selbst vollendet oder erfüllt worden ist.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: Und nun
  rationale: Gibt den abschließenden beziehungsweise überleitenden Diskursmarker knapp und natürlich wieder.
- source_word: ወልድየ
  choice: mein Sohn
  rationale: Bewahrt die direkte familiäre Anrede im belehrenden Offenbarungskontext.
- source_word: ኵሎ
  choice: alles
  rationale: Steht als umfassendes Objekt zu „habe ich dir … gezeigt“ und klingt im Deutschen idiomatisch.
- source_word: አርአይኩከ
  choice: habe ich dir … gezeigt
  rationale: Gibt das Verb des Zeigens beziehungsweise Offenbarens wieder; das Perfekt passt zum rückblickenden Abschluss.
- source_word: ተፈጸመት
  choice: ist vollendet worden
  rationale: Bewahrt die passive, resultative Aussage, ohne ein Ende oder eine Vernichtung der Sterne nahezulegen.
- source_word: ሥርዓተ
  choice: Ordnung
  rationale: Bezeichnet hier die geregelte Anordnung beziehungsweise den geordneten Lauf der Himmelskörper und ist im Deutschen natürlicher als „Ordnungssystem“ oder „Anordnung“.
- source_word: ኵሉ ከዋክብተ ሰማያት
  choice: aller Sterne des Himmels
  rationale: Bewahrt die umfassende kosmische Wendung in gehobenem, aber verständlichem Deutsch.
theological_decisions:
- issue: Ob die Ordnung der Himmelskörper selbst vollendet ist oder ob die Darstellung dieser Ordnung zum Abschluss gebracht wurde
  choice: 'Die passive Formulierung bleibt im Haupttext erhalten: „die Ordnung aller Sterne des Himmels ist vollendet worden“.'
  alternative: „Damit ist die Darstellung der Ordnung aller Sterne des Himmels abgeschlossen.“
  rationale: Der Zusammenhang mit „habe ich dir alles gezeigt“ legt den Abschluss der Unterweisung nahe; der äthiopische Wortlaut benennt jedoch nicht ausdrücklich eine „Darstellung“. Die Übersetzung erhält deshalb die Spannung und erläutert sie in einer Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem apokalyptischem Ton. Die syntaktische Nähe zum Ge’ez bewahrt die Mehrdeutigkeit des Schlusssatzes; „aller Sterne“ vermeidet eine doppelte Wiedergabe von ኵሉ.
