base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/019/003.yaml
  text: And I[a], Enoch, alone saw the vision, the ends of all things[b]; and no human being will see as I have seen.
translation:
  language: de
  text: Und ich, Henoch,[a] sah allein die Vision von den Grenzen von allem[b]; und kein Mensch wird sehen, wie ich gesehen habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich nach der äthiopischen Namensform auch „Henok“.
    reason: Namensvariante
  - marker: b
    text: 'Oder: „die äußersten Grenzen von allem“. Der ge’ezische Ausdruck kann die fernsten Grenzen oder Enden bezeichnen und sowohl räumliche als auch kosmische Bedeutung haben.'
    reason: Lexikalische Alternative
lexical_decisions:
- source_word: ሄኖክ
  choice: Henoch
  rationale: „Henoch“ ist die im Deutschen geläufige biblische Namensform und entspricht der etablierten Bezeichnung des Buches.
- source_word: አርአያ
  choice: Vision
  rationale: Im apokalyptischen Zusammenhang bezeichnet das Wort eine offenbarende Schau; „Vision“ bewahrt diese Aussagekraft besser als „Anblick“ oder „Erscheinung“.
- source_word: ባሕቲትየ
  choice: allein
  rationale: Das Wort hebt Henoch als den einzigartigen Empfänger und Augenzeugen der Schau hervor. Die Stellung nach dem Verb ergibt natürliches Deutsch, ohne den Sinn abzuschwächen.
- source_word: አጽናፈ ኵሉ
  choice: die Grenzen von allem
  rationale: አጽናፍ kann äußerste Grenzen, Enden oder Randbereiche bezeichnen. Die Wiedergabe bewahrt die räumlich-kosmische Weite, ohne sie ausschließlich geografisch oder zeitlich festzulegen.
- source_word: አልቦ ዘይሬኢ እምሰብእ
  choice: kein Mensch wird sehen
  rationale: Die Formulierung verneint, dass ein anderer Mensch eine vergleichbare Schau haben wird, und gibt ሰብእ geschlechtsübergreifend wieder.
- source_word: ከመ አነ ርኢኩ
  choice: wie ich gesehen habe
  rationale: Die Vergleichsformel unterstreicht Henochs persönliche und einzigartige Erfahrung; das deutsche Perfekt gibt die abgeschlossene Schau natürlich wieder.
theological_decisions:
- issue: Reichweite von Henochs einzigartiger Offenbarung
  choice: Henoch beansprucht, allein eine kosmisch umfassende Vision bis zu den Grenzen von allem gesehen zu haben.
  alternative: Die Wendung könnte enger als die physischen Enden der Erde oder zeitlich als das Ende aller Dinge verstanden werden.
  rationale: Der äthiopische Ausdruck ist weit und bildhaft. „Die Grenzen von allem“ erhält diese Offenheit, ohne die apokalyptische Aussage auf eine rein geografische oder rein zeitliche Deutung zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, feierliche Ich-Aussage und die apokalyptische Spannung bleiben erhalten. Das Semikolon bildet die Zweiteilung des Ausgangstextes ab; die Fußnotenmarker wurden den jeweils sachlich passenden Stellen zugeordnet.
