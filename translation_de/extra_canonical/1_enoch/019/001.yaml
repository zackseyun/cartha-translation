base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/019/001.yaml
  text: And Uriel said to me[a], “Here shall stand the angels who joined themselves with women; and their spirits, having taken on many forms, defile humankind and lead them astray so that they sacrifice to demons as to gods, until the day of the great judgment[d][c][b], on which they will be judged until they are finished.”
translation:
  language: de
  text: 'Und Uriel sagte zu mir: „Hier werden die Engel stehen, die sich mit Frauen verbunden haben. Ihre Geister[a], die vielerlei Gestalt angenommen haben[b], haben die Menschen verunreinigt und führen sie in die Irre, sodass sie den Dämonen Opfer darbringen, als wären sie Götter – bis zum Tag des großen Gerichts. An jenem Tag werden sie gerichtet, bis sie ihr Ende erreicht haben.[c]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „ihre Geister“. Es bleibt offen, ob damit die Geister der gefallenen Wesen selbst, Geister ihrer Nachkommen oder mit ihnen verbundene dämonische Geister gemeint sind.
    reason: alternative_reading
  - marker: b
    text: 'Oder: „die zu vielerlei Erscheinungen geworden sind“. Die ge''ezische Wendung ist schwierig und kann unterschiedliche Erscheinungsweisen bezeichnen, durch die diese Geister die Menschen verderben.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich etwa: „bis sie vollendet sind“ oder „bis sie zu Ende gebracht sind“. Die genaue Nuance des abschließenden Ausdrucks ist unsicher; er bezeichnet den vollständigen Abschluss des Gerichts, ohne die Art dieses Endes näher festzulegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተደሚሮሙ
  choice: die sich mit Frauen verbunden haben
  rationale: Bewahrt den reflexiven Sinn des Verbindens und benennt die unerlaubte Verbindung, ohne über den Wortlaut hinaus ausdrücklich sexuelle Sprache einzuführen.
- source_word: ይቀውሙ
  choice: werden … stehen
  rationale: Gibt die zukunftsbezogene, feierliche Orts- und Zustandsangabe der Vision wieder.
- source_word: መናፍስቲሆሙ
  choice: ihre Geister
  rationale: Folgt dem possessiven Ausdruck wörtlich und lässt offen, auf welche Geistwesen er sich genau bezieht.
- source_word: ብዙኃ ራእየ ከዊኖሙ
  choice: die vielerlei Gestalt angenommen haben
  rationale: Die schwierige Wendung verbindet Vielheit mit Erscheinung beziehungsweise Gestalt und Werden; diese Fassung wahrt die Vorstellung unterschiedlicher Manifestationen.
- source_word: አርኰስዎሙ
  choice: haben die Menschen verunreinigt
  rationale: Bewahrt den perfektischen Aspekt sowie die moralischen und kultischen Konnotationen von Verunreinigung.
- source_word: ለሰብእ
  choice: die Menschen
  rationale: Gibt den kollektiven Bezug auf die Menschheit in natürlichem modernem Deutsch wieder.
- source_word: ያስሕትዎሙ
  choice: führen sie in die Irre
  rationale: Erhält den kausativen und fortdauernden Sinn des Imperfekts.
- source_word: ይሡዑ
  choice: Opfer darbringen
  rationale: Bezeichnet präzise die kultische Handlung gegenüber den Dämonen und ist enger als das allgemeinere „anbeten“.
- source_word: አጋንንት
  choice: Dämonen
  rationale: Direkte und etablierte deutsche Entsprechung für die bezeichneten dämonischen Wesen.
- source_word: ከመ አማልክት
  choice: wie Göttern
  rationale: Macht deutlich, dass den Dämonen Opfer dargebracht werden, als wären sie Götter.
- source_word: ዕለተ ዐባይ ኵነኔ
  choice: Tag des großen Gerichts
  rationale: Bewahrt die feierliche apokalyptische Formel und die Grundstruktur des ge'ezischen Ausdrucks.
- source_word: ይትኴነኑ
  choice: werden sie gerichtet
  rationale: Gibt den passivischen Gerichtssinn wieder, ohne das genaue Urteil im Verb vorwegzunehmen.
- source_word: እስከ ይትፈጸሙ
  choice: bis ihr Ende vollendet ist
  rationale: Drückt die Vollendung des Endes beziehungsweise des Gerichtsvollzugs aus, ohne eine bestimmte Lehre über die Art der endgültigen Strafe festzulegen.
theological_decisions:
- issue: Referenz von „ihre Geister“
  choice: Der possessive Ausdruck wird wörtlich als „ihre Geister“ wiedergegeben.
  alternative: „die Geister, die von ihnen ausgingen“ oder „die Geister ihrer Nachkommen“
  rationale: Der Vers bestimmt nicht ausdrücklich, ob die Geister den gefallenen Engeln selbst, ihren Nachkommen oder ihren Wirkungen zuzuordnen sind; diese Spannung bleibt erhalten.
- issue: Sinn des abschließenden Vollendungsausdrucks
  choice: „bis ihr Ende vollendet ist“
  alternative: „bis ihre Verurteilung vollendet ist“ oder „bis sie völlig vernichtet sind“
  rationale: Die Quelle betont Vollendung beziehungsweise Abschluss, legt aber die genaue Art des Endgerichts nicht eindeutig fest.
- issue: Zeitlicher Verlauf von Verunreinigung und Irreführung
  choice: „haben … verunreinigt und führen … in die Irre“
  alternative: „verunreinigen … und führen … in die Irre“ oder durchgehend Vergangenheit
  rationale: 'Die Übersetzung bildet den Wechsel vom ge''ezischen Perfekt zum Imperfekt ab: eine bereits geschehene Verunreinigung mit fortdauernder Irreführung.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer apokalyptischer Bildsprache. Der Wechsel zwischen vollendeter Verunreinigung und fortdauernder Irreführung wird grammatisch sichtbar gemacht; schwer bestimmbare Geisterterminologie und die Aussage über das endgültige Gericht bleiben bewusst offen.
