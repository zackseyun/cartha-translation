- from: 'Und Uriel sagte zu mir: „Hier werden die Engel stehen, die sich mit Frauen verbunden haben. Ihre Geister[a], die vielerlei Gestalt angenommen haben[b], haben die Menschen verunreinigt und führen sie in die Irre, sodass sie den Dämonen wie Göttern Opfer darbringen – bis zum Tag des großen Gerichts. An jenem Tag werden sie gerichtet, bis ihr Ende vollendet ist.[c]“'
  to: 'Und Uriel sagte zu mir: „Hier werden die Engel stehen, die sich mit Frauen verbunden haben. Ihre Geister[a], die vielerlei Gestalt angenommen haben[b], haben die Menschen verunreinigt und führen sie in die Irre, sodass sie den Dämonen Opfer darbringen, als wären sie Götter – bis zum Tag des großen Gerichts. An jenem Tag werden sie gerichtet, bis sie ihr Ende erreicht haben.[c]“'
  rationale: Die Revision beseitigt die nicht quellengemäße und stilistisch unnatürliche Nominalisierung „ihr Ende vollendet ist“. „Bis sie ihr Ende erreicht haben“ gibt den Abschlussgedanken in natürlichem Deutsch wieder, ohne eine bestimmte Lehre über Vernichtung oder Dauer des Gerichts festzulegen; die Fußnote dokumentiert die engere wörtliche Möglichkeit. Die Umstellung zu „als wären sie Götter“ klärt die kultische Vergleichsaussage, ohne den Sinn zu verändern.
