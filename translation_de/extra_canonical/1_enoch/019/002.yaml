review_pass:
  verdict: revise
  source_fidelity: 'Die Genitivgruppe ist zutreffend auf „Frauen“ bezogen: „die Frauen der Engel, die irregegangen sind“. Die Vergleichskonstruktion verlangt „wie/gleich“, nicht eine Wesensidentifikation. Das einleitende ወ ist jedoch primär mit „Und“ wiederzugeben; „Auch“ fügt eine fokussierende Nuance hinzu, die im Deutschen zwar kontextuell denkbar, hier aber nicht erforderlich ist.'
  naturalness: „Friedfertigen gleich werden“ ist grammatisch möglich, klingt aber ohne Artikel und bei unklarem Referenten unnötig sperrig. „wie Friedfertige werden“ bildet die substantivierte Pluralform klar und bewahrt die auffällige Aussage. „irregegangen“ ist würdig und verständlich, aber „in die Irre gegangen“ ist modernes Standarddeutsch.
  terminology: „Engel“ und „Frauen“ sind angemessen. Die Bedeutung von ሰላማዊያት ist im überlieferten Kontext schwierig; „Friedfertige“ gibt die im vorliegenden ge’ezischen Audit angesetzte friedensbezogene Lesart wieder, sollte aber nicht durch eine zu starke Paraphrase erklärt werden. Die Anmerkung darf die verbleibende Unsicherheit markieren.
  issues:
  - severity: low
    issue: „Auch“ als Satzanschluss
    rationale: Das ge’ezische ወ entspricht zunächst „Und“. „Auch“ kann eine zusätzliche Betonung eintragen, die der Wortlaut nicht ausdrücklich verlangt.
  - severity: low
    issue: Unnatürliche substantivische Vergleichsform
    rationale: „Friedfertigen gleich werden“ ist möglich, doch „wie Friedfertige werden“ ist im modernen Deutsch klarer und behält Vergleich sowie Plural bei.
  - severity: low
    issue: Fußnote b erklärt die Verbwiederholung zu wörtlich
    rationale: Die Formulierung „werden wie Friedfertige werden“ ist im Deutschen keine hilfreiche wörtliche Glosse. Die Anmerkung sollte stattdessen die unsichere Referenz und die Art der Vergleichsaussage benennen.
  revised_text: Und die Frauen[a] der Engel, die in die Irre gegangen sind, werden wie Friedfertige werden.[b]
  revised_footnotes:
  - marker: a
    text: 'Oder: „Ehefrauen“. Das ge’ezische Wort kann Frauen allgemein oder Ehefrauen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die Formulierung ist schwierig. Der Ausdruck „Friedfertige“ kann die Wesen bezeichnen, denen die Frauen ähnlich werden, oder einen friedvollen Zustand andeuten; die Art dieser Ähnlichkeit bleibt offen.
    reason: alternative_reading
  revision_rationale: Die Revision hält die Frauen als Subjekt und die irregegangenen Engel als genitivisch zugehörige Gruppe fest. Sie gibt die Vergleichspartikel explizit wieder, modernisiert „irregegangen“ behutsam und verbessert die deutsche Lesbarkeit, ohne die schwierige Bezeichnung am Satzende auszudeuten.
