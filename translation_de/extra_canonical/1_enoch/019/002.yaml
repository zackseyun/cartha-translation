base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/019/002.yaml
  text: And their wives[a], the angels who went astray[c][b], will become like peaceful ones.
translation:
  language: de
  text: Auch die Frauen[a] der Engel, die irregegangen sind, werden Friedfertigen gleich werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ehefrauen“. Das ge’ezische Wort kann Frauen allgemein oder Ehefrauen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „werden wie Friedfertige werden“. Die schwierige Formulierung lässt offen, wer die „Friedfertigen“ sind und welche Art von Ähnlichkeit gemeint ist.'
    reason: alternative_reading
lexical_decisions:
- source_word: አንስትያሆሙኒ
  choice: Auch die Frauen der Engel
  rationale: Das Substantiv kann sowohl „Frauen“ als auch „Ehefrauen“ bezeichnen. „Frauen“ bewahrt diese lexikalische Offenheit; die Zugehörigkeit zu den nachfolgend genannten Engeln wird im Deutschen ausdrücklich gemacht.
- source_word: ለስሑታን፡ መላእክት
  choice: der Engel, die irregegangen sind
  rationale: Die Wortgruppe wird als Genitivbeziehung zu „Frauen“ verstanden. „Irregegangen“ erhält die moralische und bildhafte Bedeutung des zugrunde liegenden Verbs, ohne sie pauschal mit „gesündigt“ oder dogmatisch mit „gefallen“ wiederzugeben.
- source_word: ተከመ
  choice: gleich
  rationale: Die Vergleichspartikel bezeichnet Ähnlichkeit, nicht Wesensgleichheit. Die deutsche Wendung „jemandem gleich werden“ gibt den Vergleich natürlich wieder.
- source_word: ሰላማዊያት
  choice: Friedfertigen
  rationale: Das pluralische Adjektiv ist von „Frieden“ abgeleitet und wird substantivisch wiedergegeben. Die ungewöhnliche und im Zusammenhang schwierige Formulierung bleibt sichtbar.
- source_word: ይከውና
  choice: werden ... werden
  rationale: Das Verb bezeichnet ein Werden beziehungsweise Zu-etwas-Werden; die futurische Aussage wird durch „werden“ ausgedrückt.
theological_decisions:
- issue: Art der angekündigten Verwandlung
  choice: Die Frauen werden Friedfertigen gleich, ohne mit ihnen wesensmäßig identifiziert zu werden.
  alternative: Die Frauen werden selbst zu Friedfertigen beziehungsweise zu friedvollen Wesen.
  rationale: Die Vergleichspartikel ተከመ verlangt eine Aussage der Ähnlichkeit. Wer genau die „Friedfertigen“ sind und worin die Ähnlichkeit besteht, wird nicht näher bestimmt.
- issue: Bezug von „Engel, die irregegangen sind“
  choice: Die Wendung bezeichnet die Engel, zu denen die Frauen gehören.
  alternative: „Die Engel, die irregegangen sind“ steht als Apposition zu „ihre Frauen“.
  rationale: Die Genitivkonstruktion ergibt syntaktisch und inhaltlich am ehesten „die Frauen der irregegangenen Engel“. Eine appositionelle Wiedergabe würde Frauen und Engel missverständlich gleichsetzen.
translation_notes:
  register: Moderne, würdige Standardsprache. „Irregegangen“ bewahrt den bildhaften und moralischen Gehalt; „Friedfertigen gleich werden“ hält die auffällige Vergleichsaussage aus, ohne ihre sachliche Schwierigkeit stillschweigend aufzulösen.
