base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/003.yaml
  text: And at that time I blessed the Great Lord, the King of Glory forever, because he has made all the works of the world; and I praised the Lord for his patience, and I blessed him on account of the children of Adam.
translation:
  language: de
  text: Und zu jener Zeit pries ich den großen Herrn, den König der Herrlichkeit in Ewigkeit, weil er alle Werke der Welt geschaffen hat. Und ich lobte den Herrn für seine Geduld[a] und pries ihn im Hinblick auf die Kinder Adams[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für seine Langmut“ beziehungsweise „für seine Nachsicht“. Das ge’ezische Wort bezeichnet geduldiges Ertragen und zurückhaltende Duldsamkeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich „Kinder Adams“: eine Bezeichnung für die Menschen, die den ausdrücklichen Bezug auf Adam bewahrt.'
    reason: cultural_note
lexical_decisions:
- source_word: እምሶቤሃ
  choice: zu jener Zeit
  rationale: Bewahrt den zeitlichen Übergang und den gehobenen erzählerisch-apokalyptischen Ton.
- source_word: ባረክዎ
  choice: ich pries
  rationale: Im Deutschen ist „Gott preisen“ die natürliche Entsprechung für menschliches Segnen Gottes; zugleich bleibt der Ausdruck von „lobte“ im folgenden Satz unterschieden.
- source_word: እግዚአ ዐቢይ
  choice: den großen Herrn
  rationale: Gibt Adjektiv und Gottesbezeichnung unmittelbar wieder, ohne „groß“ deutend zu „mächtig“ zu erweitern.
- source_word: ንጉሠ ስብሐት
  choice: den König der Herrlichkeit
  rationale: Bewahrt die Genitivverbindung und den doxologischen Titel.
- source_word: ለዓለም
  choice: in Ewigkeit
  rationale: Natürliche deutsche Wendung für unbegrenzte Dauer in einem Lobpreis.
- source_word: በከመ ገብረ ኵሎ ግብረ ዓለም
  choice: weil er alle Werke der Welt geschaffen hat
  rationale: Erhält „Werke“ und „Welt“, statt die Formulierung zu „alles“ oder „Universum“ zu glätten.
- source_word: ሰባሕኩ
  choice: ich lobte
  rationale: Unterscheidet das Verb vom vorherigen und folgenden „pries“, ohne einen unnatürlichen deutschen Ausdruck zu verwenden.
- source_word: ትዕግሥቱ
  choice: seine Geduld
  rationale: Verständliche moderne Wiedergabe; die stärkeren Bedeutungsnuancen von Langmut und Nachsicht werden in einer Fußnote genannt.
- source_word: ዲበ ውሉደ አዳም
  choice: im Hinblick auf die Kinder Adams
  rationale: Gibt die flexible Präposition zurückhaltend wieder und bewahrt den ausdrücklichen Bezug auf Adam.
theological_decisions:
- issue: Wiedergabe von ውሉደ አዳም
  choice: die Kinder Adams
  alternative: die Menschen; die Söhne Adams
  rationale: Die Formulierung erhält den Bezug auf Adam und bezeichnet zugleich die Menschheit, ohne sie männlich zu verengen oder zu einer Abstraktion zu glätten.
- issue: Bezug der abschließenden Präpositionalphrase
  choice: im Hinblick auf
  alternative: wegen; um ... willen; über
  rationale: Die Quelle lässt die genaue Relation offen. Die gewählte Formulierung wahrt diesen Bezug, ohne eindeutig einen Grund, eine Begünstigung oder ein Gericht auszudrücken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doxologische Höhe bleibt erhalten, während „preisen“ und „loben“ die zwei verschiedenen Verben der Quelle unterscheidbar machen. Die Satzteilung verbessert die Lesbarkeit, ohne die gedankliche Abfolge zu verändern.
