translation:
  language: de
  text: Ein Jahr lang werden wir dich bei deinem Sohn lassen, bis zu einem weiteren Befehl[b], damit …[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte Textausschnitt endet mit dem Geʿez-Wort für »damit/ sodass«; der Satz bleibt daher unvollständig.
    reason: textual_variant
