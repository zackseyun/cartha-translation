lexical_decisions:
- source_word: ዓመተ፡ አሐደ፡
  choice: ein Jahr lang
  rationale: Die Akkusativverbindung bezeichnet eine Zeitdauer; »ein Jahr lang« ist im Deutschen natürlich und präzise.
- source_word: ነኅድገከ፡
  choice: werden wir dich … lassen
  rationale: Die Verbform ist 1. Person Plural und bedeutet hier »zurücklassen/bleiben lassen«. Der Plural der Sprecher wird ausdrücklich bewahrt; »verlassen« wäre im Kontext zu stark.
- source_word: በኀበ፡ ወልድከ፡
  choice: bei deinem Sohn
  rationale: Die Präposition bezeichnet Nähe oder Gemeinschaft. »Bei deinem Sohn« gibt die örtlich-persönliche Beziehung idiomatisch wieder, ohne eine Fürsorgebeziehung hinzuzufügen.
- source_word: እስከ፡ ካዕበ፡ ትእዛዝ፡
  choice: bis zu einem weiteren Befehl
  rationale: Die knappe Folge lässt sich sinnvoll als zeitliche Grenze bis zu einer erneuten bzw. weiteren Anordnung verstehen. Die Wiedergabe bleibt knapp und wahrt die Autorität des Befehls.
- source_word: ከመ፡
  choice: damit …
  rationale: ከመ ist eine Zweck- oder Inhaltspartikel, kein Verb mit der Bedeutung »kommen«. Da der überlieferte Ausschnitt hier abbricht, wird der unvollständige Satz durch Auslassungspunkte sichtbar gehalten.
theological_decisions:
- issue: Art der maßgeblichen Anordnung
  choice: Befehl
  alternative: Anordnung; Weisung
  rationale: »Befehl« bewahrt im apokalyptischen Kontext die verbindliche Autorität, ohne die Quelle näher festzulegen, als es der Text tut.
- issue: Zahl der Sprecher
  choice: wir werden
  alternative: ich werde
  rationale: Die geʿezische Verbform steht in der 1. Person Plural. Der Plural wird nicht zugunsten einer aus dem Zusammenhang erschlossenen Einzahl eingeebnet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die abgebrochene Syntax des mittelmäßig sicher bezeugten Ausgangstextes wird nicht durch ein erfundenes Verb geschlossen; die Auslassungspunkte machen das Fragment transparent.
