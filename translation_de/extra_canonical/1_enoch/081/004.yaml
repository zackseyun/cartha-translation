base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/004.yaml
  text: 'And from it And from it I said: blessed is the man who dies righteous and good, upon whom no book of wrongdoing has been written, and for whom no day of judgment will be found.: blessed is the man who dies righteous and good, upon whom no book of wrongdoing has been written, and for whom no day of judgment will be found.'
translation:
  language: de
  text: 'Daraufhin[a] sagte ich: Glücklich ist der Mensch, der gerecht und gut stirbt, gegen den kein Buch der Übertretung geschrieben worden ist und für den sich kein Tag des Gerichts finden wird.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Und daraus/von ihm aus“. Gemeint ist wahrscheinlich der Übergang zu Enoks Reaktion auf das zuvor Geschaute.'
    reason: Die pronominale Wendung ወእምኔሁ ist ohne ihren weiteren Kontext mehrdeutig; die Fußnote dokumentiert die wörtliche Form hinter der idiomatischen Übersetzung.
lexical_decisions:
- source_word: ወእምኔሁ (wa-ʾəmnehu)
  choice: Daraufhin
  rationale: Die Wendung bedeutet wörtlich etwa „und von ihm/daraus“. Im Zusammenhang führt sie Enoks Reaktion auf das zuvor Geschaute ein; „Daraufhin“ gibt diese Funktion natürlich wieder, ohne den fehlerhaft verdoppelten englischen Beratungstext zu übernehmen.
- source_word: ብፁዕ (bəṣuʿ)
  choice: Glücklich
  rationale: Das Wort bezeichnet einen begünstigten, seligen oder glücklichen Menschen. „Glücklich“ ist in modernem Deutsch verständlich und behält den Charakter eines Glückwunsches bei.
- source_word: ብእሲ (bəʾəsi)
  choice: Mensch
  rationale: Das Substantiv kann „Mann“ oder allgemein „Mensch“ bezeichnen. Hier ist die allgemeine Aussage über einen Menschen im Blick; deshalb ist „Mensch“ sachgerecht und inklusiv, ohne den Sinn auszuweiten.
- source_word: ዘይመውት፡ ጻድቅ፡ ወኄር
  choice: der gerecht und gut stirbt
  rationale: Die prädikative Stellung von „gerecht und gut“ beim Verb „stirbt“ wird bewahrt. Die Formulierung legt nicht zusätzlich fest, ob damit der Zustand beim Tod oder die gesamte Lebensführung gemeint ist.
- source_word: መጽሐፈ፡ ዐመፃ (maṣḥafa ʿamaṣā)
  choice: Buch der Übertretung
  rationale: Die formale Verbindung „Buch der Übertretung“ wahrt die Bildsprache eines himmlischen Schuldregisters. „Unrecht“ wäre ebenfalls möglich, wäre aber etwas allgemeiner.
- source_word: ዕለተ፡ ኵነኔ (ʿəlata kwənane)
  choice: Tag des Gerichts
  rationale: Die feste Verbindung bezeichnet einen Gerichtstag beziehungsweise Tag der Verurteilung. „Gericht“ wahrt die Offenheit zwischen Prüfung und Verurteilung besser als das engere „Verdammung“.
theological_decisions:
- issue: Verhältnis des Gerechten zum Gerichtstag
  choice: „für den sich kein Tag des Gerichts finden wird“
  alternative: „den kein Tag der Verurteilung treffen wird“
  rationale: Die gewählte Fassung bleibt nahe an „nicht gefunden werden“ und „Tag des Gerichts“. Sie behauptet weder ausdrücklich, dass der Mensch überhaupt keinem Gericht unterliegt, noch deutet sie den Satz konfessionell als bestimmte Heilslehre aus.
- issue: Aufzeichnung von Schuld
  choice: „gegen den kein Buch der Übertretung geschrieben worden ist“
  alternative: „über den kein Schuldbuch geführt wurde“
  rationale: „Gegen den“ macht den belastenden Charakter der Aufzeichnung verständlich, während „Buch der Übertretung“ die antike Bildsprache und ihre theologische Spannung bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt bewusst nahe am ge’ezischen Ausgangstext, wird jedoch idiomatisch geglättet. Die Verdopplung im englischen POB-Beratungstext ist offenkundig redaktionell und hat keine Grundlage im überlieferten ge’ezischen Vers.
