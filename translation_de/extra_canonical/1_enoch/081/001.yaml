base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/001.yaml
  text: And he said to me[a], “Look, Enoch, at the tablets of heaven, and read what is written on them, and understand everything[c][b], one by one.”
translation:
  language: de
  text: 'Und er sagte zu mir: „Sieh, Henoch, die Tafeln des Himmels an, lies, was auf ihnen geschrieben steht, und erfasse alles, eines nach dem anderen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und erkenne alles, eins nach dem anderen“.'
    reason: Lexikalische Alternative für እእምር („erfasse/erkenne“) und formnahe Wiedergabe der distributiven Wiederholung አሐደ አሐደ.
lexical_decisions:
- source_word: ነጽር
  choice: sieh … an
  rationale: Der Imperativ bezeichnet bewusstes Hinsehen. „Sieh … an“ ist natürliches modernes Deutsch und wahrt den Aufforderungscharakter ohne archaisches „siehe“.
- source_word: ዘፀፍፀፈ ሰማይ
  choice: die Tafeln des Himmels
  rationale: Die konkrete apokalyptische Vorstellung himmlischer Schrifttafeln bleibt erhalten; „Bücher“ oder „Aufzeichnungen“ wären stärker deutend.
- source_word: አንብብ
  choice: lies
  rationale: Direkte Wiedergabe des Imperativs; der Kontext verlangt nicht ausdrücklich „lies laut vor“.
- source_word: ዘጽሑፍ ዲቤሆሙ
  choice: was auf ihnen geschrieben steht
  rationale: Die Relativkonstruktion bezieht sich auf die Tafeln. Diese Formulierung ist im Deutschen natürlich und bewahrt den schriftlichen Befund.
- source_word: እእምር
  choice: erfasse
  rationale: Das Verb kann Erkennen, Wissen oder Verstehen ausdrücken. „Erfasse“ bezeichnet hier das begreifende Aufnehmen des Gelesenen und vermeidet die Wiederholung einer rein visuellen Wahrnehmung.
- source_word: ኵሎ አሐደ አሐደ
  choice: alles, eines nach dem anderen
  rationale: Die Wiederholung von „eins“ hat distributive Kraft. Die Wendung bewahrt sowohl die Vollständigkeit als auch das einzelne, schrittweise Erfassen.
theological_decisions:
- issue: Apokalyptisches Bild himmlischer Aufzeichnungen
  choice: die Tafeln des Himmels
  alternative: die himmlischen Tafeln; die Bücher des Himmels
  rationale: Die Übersetzung erhält das konkrete Bild himmlischer Tafeln, ohne es zu abstrakten Aufzeichnungen zu verflachen oder durch die nicht ausdrücklich genannte Vorstellung von Büchern zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und die konkrete apokalyptische Bildsprache bleiben erhalten; archaisierende Formen werden vermieden.
