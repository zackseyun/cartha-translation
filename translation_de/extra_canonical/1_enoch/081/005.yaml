  terminology: »Metuschelach«, »Herr«, »kein Fleisch« und »gerecht« sind angemessen. Die Wendung »kein Fleisch« bewahrt den konkreten biblisch-apokalyptischen Ausdruck, ohne ihn lehrmäßig aufzulösen. »Heilige Wesen« vermeidet eine nicht erforderliche Gleichsetzung mit späteren kirchlichen Heiligen.
