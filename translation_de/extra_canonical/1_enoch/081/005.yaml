    rationale: »Absetzen« klingt im Deutschen vor allem nach Aussteigenlassen bzw. Transport und ist stilistisch deutlich umgangssprachlicher als die Vorlage. »Niedersetzen« gibt Platzieren/Setzen natürlicher und registergerecht wieder.
