base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/005.yaml
  text: And those seven holy ones brought me near and set me on the earth before the door of my house[a], and they said to me, “Make everything known to Methuselah your son, and show all your children that no flesh is righteous before the Lord[b], for he is the one who created them.”
translation:
  language: de
  text: 'Und jene sieben heiligen Wesen brachten mich herbei und setzten mich auf der Erde vor der Tür meines Hauses[a] nieder. Sie sagten zu mir: »Mache deinem Sohn Metuschelach alles bekannt und zeige allen deinen Kindern, dass kein Fleisch vor dem Herrn gerecht ist[b]; denn er ist es, der sie erschaffen hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vor dem Eingang meines Hauses«. Das ge''ezische Wort kann eine Tür oder den Eingangsbereich bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: »Kein Fleisch« bewahrt die konkrete Ausdrucksweise der Vorlage. Gemeint sind sterbliche Geschöpfe beziehungsweise die Menschheit in ihrer leiblichen Existenz.
    reason: lexical_alternative
lexical_decisions:
- source_word: አቅረቡኒ
  choice: brachten mich herbei
  rationale: Bewahrt die kausative Bewegung des Heranbringens, ohne im Deutschen eine unnatürliche Formulierung wie »brachten mich nahe« zu verwenden.
- source_word: ፯ ቅዱሳን
  choice: sieben Heilige
  rationale: Gibt die himmlischen heiligen Wesen mit dem etablierten apokalyptischen Ausdruck wieder; der Kontext verhindert hier ein rein kirchengeschichtliches Verständnis.
- source_word: አንበሩኒ
  choice: setzten mich … ab
  rationale: Passt zur Rückkehr auf die Erde und umfasst sowohl das Platzieren als auch das mögliche Niedersetzen, ohne die Körperhaltung unnötig festzulegen.
- source_word: በቅድመ ኆኅተ ቤትየ
  choice: vor der Tür meines Hauses
  rationale: Bewahrt die konkrete räumliche Aussage sowie die direkte Bedeutung von Tür; »am Eingang« bleibt als mögliche Alternative in der Fußnote.
- source_word: አይድዕ ኵሎ
  choice: Mach … alles bekannt
  rationale: Der Imperativ ist kausativ und bezeichnet ein Bekanntmachen, nicht bloß ein Wissen oder Erzählen.
- source_word: አርኢ ለኵሎሙ ውሉድከ
  choice: zeige allen deinen Kindern
  rationale: Gibt das Verb des Zeigens direkt wieder; »Kinder« bezeichnet die Nachkommen umfassend, ohne das Geschlecht einzuschränken.
- source_word: ከመ ኢ ይጸድቅ ኵሉ ዘሥጋ
  choice: dass kein Fleisch … gerecht ist
  rationale: Bewahrt die universale Verneinung und die konkrete biblisch-apokalyptische Rede von »Fleisch«, statt sie deutend durch »kein Mensch« zu ersetzen.
- source_word: በቅድመ እግዚአ
  choice: vor dem Herrn
  rationale: Direkte und im Deutschen idiomatische Wiedergabe der räumlich-relationalen Wendung.
- source_word: እስመ ውእቱ ፈጠሮሙ
  choice: denn er ist es, der sie erschaffen hat
  rationale: Die Konstruktion bewahrt die Hervorhebung des Pronomens und bezieht den Plural »sie« auf die zuvor genannten fleischlichen Geschöpfe.
theological_decisions:
- issue: Aussage über Fleisch und Gerechtigkeit
  choice: Universale Feststellung, dass kein Fleisch vor dem Herrn gerecht ist
  alternative: Engere Aussage über rituelle Unreinheit oder eine später geprägte forensische Rechtfertigungsformel
  rationale: Der ge'ezische Wortlaut spricht konkret von »Fleisch« und davon, vor dem Herrn gerecht zu sein. Die Übersetzung erhält diese Spannung und deutet sie weder ausschließlich anthropologisch noch im Sinn einer späteren Lehrformel aus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt quellennah, wird aber durch die Teilung nach dem ersten Hauptsatz gut verständlich. »Metuschelach« folgt einer geläufigen deutschen Namensform; »kein Fleisch« bleibt als bewusster biblisch-apokalyptischer Ausdruck erhalten.
