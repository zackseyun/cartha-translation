base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/081/002.yaml
  text: And I looked at the tablets of heaven[a], and I read all that was written, and I understood it all; and I read the book of all the deeds of humankind and of all the children of flesh upon the earth[d][c][b], to the generations of eternity.
translation:
  language: de
  text: Und ich blickte auf die Tafeln des Himmels und las alles, was geschrieben stand, und verstand alles. Dann las ich das Buch über alle Taten der Menschen[a] und über alle Kinder des Fleisches[b] auf der Erde bis zu den Geschlechtern der Ewigkeit.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Buch aller Taten der Menschen“. Die ge''ezische Genitivkonstruktion kann den Inhalt des Buches unmittelbar bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Kinder des Fleisches“ ist eine wörtliche Wiedergabe einer semitisch geprägten Bezeichnung für Menschen in ihrer sterblichen, irdischen Existenz.
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: „bis zu ewigen Geschlechtern“ oder „für die Geschlechter in Ewigkeit“. Die Schlussformel ist weit gefasst und nicht nur als enge Zeitangabe zu verstehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ነጸርኩ
  choice: ich blickte
  rationale: Gibt das visionäre Sehen schlicht und würdig wieder; „blickte“ passt natürlich zur folgenden Richtungsangabe.
- source_word: በፀፍፀፈ ሰማይ
  choice: auf die Tafeln des Himmels
  rationale: Bewahrt das konkrete apokalyptische Bild himmlischer Schrifttafeln, statt es zu „Buch“ oder „Aufzeichnungen“ zu verallgemeinern.
- source_word: አንበብኩ ኵሎ ዘጽሑፍ
  choice: las alles, was geschrieben stand
  rationale: Bewahrt sowohl die Gesamtheit als auch den passiven Sinn der Formulierung in natürlichem Deutsch.
- source_word: አእመርኩ ኵሎ
  choice: verstand alles
  rationale: Bezeichnet hier das Erfassen beziehungsweise Verstehen und nicht nur die Kenntnisnahme.
- source_word: አንበብክዋ ለመጽሐፈ
  choice: Dann las ich das Buch
  rationale: Gibt die wiederholte Leseformel flüssig wieder; „Dann“ markiert den Fortgang, ohne einen starken zeitlichen Gegensatz einzuführen.
- source_word: ኵሉ ምግባሮሙ ለሰብእ
  choice: über alle Taten der Menschen
  rationale: „Taten“ deckt Handlungen und Verhalten ab; „Menschen“ ist im universalen Kontext inklusiv und idiomatisch.
- source_word: ውሉደ ሥጋ
  choice: Kinder des Fleisches
  rationale: Die wörtliche, semitisch geprägte Wendung erhält die anthropologische und apokalyptische Bildsprache.
- source_word: ዘዲበ ምድር
  choice: auf der Erde
  rationale: Die verblos-relative ge'ezische Wendung wird ohne zusätzlich eingeführte Gegenwarts- oder Zukunftsform wiedergegeben.
- source_word: እስከ ትውልደ ዓለም
  choice: bis zu den Geschlechtern der Ewigkeit
  rationale: Bewahrt die expansive, erhöhte Zeitformel und ihre Mehrdeutigkeit besser als das geglättete „für immer“.
theological_decisions:
- issue: Anthropologische Wendung ውሉደ ሥጋ
  choice: Kinder des Fleisches
  alternative: Sterbliche
  rationale: Die wörtliche Fassung bewahrt den Kontrast zwischen irdisch-fleischlicher Menschheit und himmlischen Aufzeichnungen, ohne ihn begrifflich zu glätten.
- issue: Zeitlicher Bezug von ዘዲበ ምድር
  choice: auf der Erde
  alternative: die auf der Erde sein werden
  rationale: Der Ausgangstext nennt in der verblosen Relativkonstruktion keine ausdrückliche Zeitstufe; die deutsche Fassung vermeidet daher eine theologisch oder chronologisch einschränkende Ergänzung.
- issue: Reichweite der Schlussformel እስከ ትውልደ ዓለም
  choice: bis zu den Geschlechtern der Ewigkeit
  alternative: für alle ewigen Geschlechter
  rationale: Die gewählte Form erhält die apokalyptische Weite und die Spannung zwischen zeitlicher Erstreckung und dauernder Geltung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter apokalyptischer Bildsprache. Die Satzgliederung wurde zur besseren Lesbarkeit leicht gegliedert; konkrete Bilder und echte grammatische beziehungsweise zeitliche Mehrdeutigkeiten bleiben erhalten.
