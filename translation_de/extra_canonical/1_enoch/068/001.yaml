base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/001.yaml
  text: And after this my grandfather Hēnok gave me the sign of all the hidden things in a book[a], and the parables that had been given to him[c][b]; and they shall recount them to me in the account of the book of the Parable.
translation:
  language: de
  text: Und danach gab mir mein Großvater Henoch in einem Buch[a] das Zeichen für alles Verborgene. Auch die Gleichnisse[b], die ihm gegeben worden waren; und sie werden sie mir im Bericht des Buches des Gleichnisses erzählen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der ge'ezische Wortlaut ist in diesem Vers stellenweise schwierig. Die Übersetzung bleibt deshalb nahe an der überlieferten Formulierung, statt die Satzverknüpfung zu glätten.
    reason: textual_variant
  - marker: b
    text: 'Oder: „Bildreden“.'
    reason: lexical_alternative
  - marker: c
    text: 'Der letzte Satzteil ist sprachlich unsicher. Auch möglich: „und sie werden sie mir in den Worten des Buches des Gleichnisses darlegen“.'
    reason: textual_variant
lexical_decisions:
- source_word: ትእምርተ
  choice: das Zeichen
  rationale: Das Substantiv bezeichnet ein Zeichen, Kennzeichen oder Merkmal. „Zeichen“ wahrt den apokalyptischen Offenbarungscharakter, ohne den Sinn als „Erklärung“ festzulegen.
- source_word: ኵሎሙ ኅቡኣት
  choice: alles Verborgene
  rationale: Die Wendung meint verborgene, durch Offenbarung erschlossene Dinge. „Alles Verborgene“ ist natürlich und vermeidet die theologisch stärker besetzten Begriffe „Mysterien“ oder „Geheimnisse“.
- source_word: በመጽሐፍ
  choice: in einem Buch
  rationale: Die Präposition lokalisiert das Mitgeteilte am natürlichsten im Buch. Der unbestimmte Artikel entspricht dem Erzählzusammenhang, ohne ein bereits näher bestimmtes Buch vorauszusetzen.
- source_word: እምሔውየ ሄኖክ
  choice: mein Großvater Henoch
  rationale: እምሔውየ ist als ein Wort mit Possessivsuffix zu verstehen und bezeichnet den Großvater beziehungsweise Ahnherrn des Sprechers; Henoch ist das Subjekt von „gab mir“.
- source_word: ምሳሌያተ
  choice: die Gleichnisse
  rationale: „Gleichnisse“ ist die geläufige deutsche Wiedergabe und bleibt auch für den traditionellen Abschnittstitel verständlich; „Bildreden“ wäre ebenfalls möglich.
- source_word: ተውህበ ሎቱ
  choice: die ihm gegeben worden waren
  rationale: Die Passivform bezeichnet den Empfang durch Henoch; das deutsche Plusquamperfekt gibt den zeitlichen Rückblick wieder.
- source_word: ይመርሙ ሊተ
  choice: sie werden sie mir erzählen
  rationale: Verb und pluralisches Subjekt sind schwierig. „Erzählen“ bewahrt den Gedanken des Darlegens, ohne eine technische Auslegung oder Deutung festzuschreiben; das unbestimmte „sie“ bleibt erhalten.
- source_word: ነገረ መጽሐፍ ዘምሳሌ
  choice: in der Darlegung des Buches vom Gleichnis
  rationale: ነገር kann Sache, Wort, Bericht oder Darlegung bedeuten. „Darlegung“ passt in den literarischen Zusammenhang; der Singular „Gleichnis“ folgt der unmittelbaren Form des Zeugen.
theological_decisions:
- issue: Wiedergabe des verborgenen Offenbarungsinhalts
  choice: alles Verborgene
  alternative: alle Geheimnisse / alle Mysterien
  rationale: Der ge'ezische Ausdruck verlangt keinen technischen theologischen Begriff. Die gewählte Formulierung wahrt den Offenbarungscharakter und die Spannung des Textes.
- issue: Bedeutung von ትእምርተ
  choice: das Zeichen
  alternative: die Erklärung
  rationale: „Zeichen“ entspricht dem belegten Bedeutungsfeld Zeichen/Kennzeichen/Merkmal. „Erklärung“ würde die Art der Gabe interpretierend festlegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Eigenname wird in der im Deutschen geläufigen Form „Henoch“ wiedergegeben. Die ungewöhnliche Syntax und das nicht ausdrücklich benannte pluralische Subjekt im letzten Satzteil werden nicht stillschweigend aufgelöst.
