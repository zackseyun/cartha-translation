revisions:
- from: Und danach gab mir mein Großvater Henoch das Zeichen für alles Verborgene in einem Buch[a] und die Gleichnisse[b], die ihm gegeben worden waren; und sie werden sie mir in der Darlegung des Buches vom Gleichnis erzählen.[c]
  to: Und danach gab mir mein Großvater Henoch in einem Buch[a] das Zeichen für alles Verborgene. Auch die Gleichnisse[b], die ihm gegeben worden waren; und sie werden sie mir im Bericht des Buches des Gleichnisses erzählen.[c]
  rationale: Die Revision trennt die Gabe des Zeichens von der Aussage, dass die Gleichnisse Henoch gegeben worden waren, damit die deutsche Syntax keine im Quellentext nicht ausdrücklich behauptete zweite Gabe durch Henoch nahelegt. „Darlegung“ wird durch das weniger interpretierende „Bericht“ ersetzt; zugleich wird die Genitivverbindung „Buch des Gleichnisses“ dem Quellenwortlaut entsprechend gefasst. Die fragmentarische zweite Einheit und das unbestimmte „sie“ erhalten die überlieferte Schwierigkeit, statt sie zu harmonisieren.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:09:29Z'
