    rationale: Für ነገር („Sache, Wort, Bericht, Angelegenheit“) legt „Darlegung“ eine erklärende Ausarbeitung nahe. „Bericht“ ist neutraler und vermeidet zusammen mit „erzählen“ die stilistisch ungünstige Verbindung „in der Darlegung ... erzählen“.
