  source_fidelity: Die zentrale Lesung „mein Großvater Henoch“ gibt እምሔውየ korrekt als eine possessivisch bestimmte Verwandtschaftsbezeichnung wieder und nicht als „von den Worten Henochs“. „Zeichen“, „alles Verborgene“, „in einem Buch“, die passiv empfangenen Gleichnisse und das unbestimmte Pluralsubjekt im Schlussteil bleiben quellennahe. Die vorliegende Satzfügung lässt jedoch unnötig den Eindruck entstehen, Henoch habe auch die Gleichnisse unmittelbar gegeben; außerdem ist „Darlegung“ für ነገር stärker auslegend als erforderlich.
  naturalness: Der Text ist überwiegend verständliches, würdiges modernes Standarddeutsch. „in der Darlegung ... erzählen“ klingt jedoch sowohl semantisch überdeutend als auch stilistisch schwerfällig. „Bericht“ und „Buch des Gleichnisses“ sind näher an der Struktur und im Deutschen klarer.
  terminology: „Henoch“, „Zeichen“, „alles Verborgene“ und „Gleichnisse“ sind angemessen. Der Singular in „Buch des Gleichnisses“ bewahrt die Form des vorliegenden Zeugen; die Fußnote weist zutreffend auf „Bildreden“ als lexikalische Alternative hin.
