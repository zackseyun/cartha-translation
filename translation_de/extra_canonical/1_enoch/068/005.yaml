translation:
  language: de
  text: Deshalb wird alles Verborgene für immer über sie kommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Deshalb wird alles, was für immer verborgen ist, über sie kommen.“ Die letzte Wendung kann auch „für das Zeitalter“ oder „seit alters“ bedeuten; möglicherweise bezieht sie sich statt auf das Verborgensein auf das Kommen über sie.'
    reason: lexikalische und syntaktische Alternative
lexical_decisions:
- source_word: በእንተ'ዝ
  choice: Deshalb
  rationale: Die kausale Wendung verweist ausdrücklich auf den vorausgehenden Zusammenhang. „Deshalb“ gibt diese Folgerungsbeziehung knapp und natürlich wieder.
- source_word: ይመጽእ
  choice: wird … kommen
  rationale: Die Verbform trägt hier im Gerichtszusammenhang zukunftsbezogene Kraft. Das deutsche Futur bewahrt die angekündigte Folge, ohne sie als bloße Gegenwartsaussage wiederzugeben.
- source_word: ላዕሌሆሙ
  choice: über sie
  rationale: Die Präposition bezeichnet eine Bewegung beziehungsweise ein Eintreffen auf die Betroffenen hin. „Über sie kommen“ ist im Deutschen eine natürliche, zugleich gerichtliche Wendung und weniger deutend als „gegen sie“.
- source_word: ኵሉ ዘኅቡእ
  choice: alles Verborgene
  rationale: Die Verbindung bezeichnet umfassend das, was verborgen ist. Die substantivierte Form ist würdig und lässt offen, ob Taten, Geheimnisse oder aufbewahrte Gerichte gemeint sind.
- source_word: ለዓለመ
  choice: für immer
  rationale: Die Wendung kann Ewigkeit, ein Zeitalter oder lange beziehungsweise alte Dauer bezeichnen. Ihre Stellung im deutschen Satz lässt die im knappen ge’ezischen Ausdruck bestehende mögliche Zuordnung zum Verborgensein oder zum Kommen nicht vorschnell verschwinden.
theological_decisions:
- issue: Ob Verborgenes offenbar wird oder ob ein verborgenes Gericht über die Betroffenen kommt
  choice: „alles Verborgene … über sie kommen“
  alternative: „alles, was verborgen war, wird gegen sie offenbar werden“
  rationale: Der ge’ezische Text spricht ausdrücklich vom Kommen über sie, nicht lediglich vom Offenbarwerden. Die Formulierung bewahrt daher den unheilvollen Gerichtscharakter und lässt zugleich offen, worin das Verborgene besteht.
- issue: Bezug von ለዓለመ
  choice: Eine im Haupttext nicht abschließend aufgelöste Stellung von „für immer“
  alternative: „alles für immer Verborgene wird über sie kommen“ oder „alles Verborgene wird für immer über sie kommen“
  rationale: Die Endstellung der ge’ezischen Wendung und ihr Bedeutungsspektrum erlauben unterschiedliche Bezüge. Da die Überlieferungs- und Auslegungslage keine sichere Vereindeutigung verlangt, wird die Spannung in Text und Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit apokalyptischem Ernst. Die kompakte Satzgestalt folgt dem Ge’ez, bleibt aber für heutige Leser verständlich; unnötige konfessionelle oder dogmatische Festlegungen werden vermieden.
