base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/004.yaml
  text: 'And it came to pass[a], when he stood before the Lord of Spirits, that Michael said this to Raphael: “He will not be for them before the eye of the Lord, for the Lord of Spirits is angry with them[c][b], because they act as if they were the Lord.”'
translation:
  language: de
  text: 'Und es geschah, als er vor dem Herrn der Geister stand, da sagte Michael zu Rafael: »Er wird vor den Augen des Herrn nicht auf ihrer Seite sein[a]; denn der Herr der Geister ist zornig auf sie, weil sie handeln, als wären sie der Herr[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Bezug von »er« wird in diesem Vers nicht ausdrücklich genannt. Die Wendung kann bedeuten, dass er nicht auf ihrer Seite stehen oder nicht für sie eintreten wird.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »weil sie wie Herren handeln«. Die knappe ge''ezische Formulierung kann ihnen anmaßendes Handeln in göttlicher oder herrscherlicher Stellung vorwerfen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወኮነ፡ ሶበ፡
  choice: Und es geschah, als
  rationale: Bewahrt den erzählerischen Übergang und den zeitlichen Anschluss in würdigem, verständlichem Deutsch.
- source_word: ቆመ፡
  choice: er ... stand
  rationale: Gibt die Grundbedeutung direkt wieder und passt zur visionären Gerichtsszene.
- source_word: በቅድመ፡ እግዚአ፡ መናፍስት፡
  choice: vor dem Herrn der Geister
  rationale: Bewahrt den räumlichen beziehungsweise gerichtlichen Sinn und den für 1 Henoch charakteristischen Gottestitel.
- source_word: ወከመ'ዝ፡ ይቤሎ፡
  choice: da sagte ... zu
  rationale: Gibt den Übergang zur direkten Rede natürlich wieder; das demonstrative Moment ist im Deutschen entbehrlich, ohne den Aussagegehalt zu verändern.
- source_word: ወኢይከውን፡ ሎሙ፡ በውስተ፡ ዓይነ፡ እግዚአ፡
  choice: Er wird vor den Augen des Herrn nicht auf ihrer Seite sein
  rationale: „Auf ihrer Seite sein“ gibt die Wendung kona la- verständlich wieder, ohne das nicht ausdrücklich genannte Eintreten oder Fürsprechen in den Text einzutragen. Der Singular bleibt ohne bestimmten Bezug.
- source_word: ተምዕዖሙ፡
  choice: ist zornig auf sie
  rationale: Drückt den göttlichen Zorn klar und mit angemessenem gerichtlichem Ernst aus.
- source_word: እምሳለ፡ እግዚአ፡ ይገብሩ።
  choice: weil sie handeln, als wären sie der Herr
  rationale: Bewahrt den möglichen Vorwurf, göttliche Autorität anzumaßen, ohne die alternative Deutung „wie Herren“ zu verschweigen.
theological_decisions:
- issue: Bezug des singularischen Pronomens in Michaels Aussage
  choice: „Er wird ... nicht auf ihrer Seite sein“, ohne den Gemeinten zu bestimmen.
  alternative: „Ich werde nicht auf ihrer Seite sein“ oder ausdeutend „Er wird nicht für sie eintreten“.
  rationale: Die gegebene ge'ezische Form stützt die dritte Person Singular, nennt in diesem Vers aber keinen eindeutigen Bezug. Die Übersetzung erhält diese Unbestimmtheit.
- issue: Tragweite des Vorwurfs gegen die Verurteilten
  choice: „als wären sie der Herr“
  alternative: „wie Herren“
  rationale: Die gewählte Fassung erhält den möglichen Vorwurf der Anmaßung göttlicher Stellung; die knappe Ausgangsform lässt jedoch auch einen Bezug auf angemaßte Herrschergewalt zu, der in der Fußnote genannt wird.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem apokalyptischem Erzählton. Die formelhafte Einleitung und der Enoch-spezifische Titel „Herr der Geister“ bleiben erhalten; schwer verständliche Ausgangsformulierungen werden natürlich, aber nicht überdeutend wiedergegeben.
