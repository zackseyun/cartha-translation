base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/003.yaml
  text: And Mikael answered again and said to Rufael, "Who is he whose heart is not softened concerning it, and whose kidneys are not troubled by this word of severity and the sentence that has gone out against them because of those who brought them out thus?"
translation:
  language: de
  text: 'Und Mikael antwortete erneut und sagte zu Rufael: „Wer ist es, dessen Herz darüber nicht weich wird und dessen Nieren[a] durch dieses Wort der Strenge und durch das Urteil, das über sie ergangen ist, nicht in Unruhe geraten wegen derer, die sie so herausgeführt haben?“[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dessen Innerstes nicht in Unruhe gerät“. Im Ge’ez steht wörtlich „Nieren“, ein traditionelles Körperbild für das innere Empfinden und Gewissen.'
    reason: lexical_alternative
  - marker: b
    text: Der Schluss des Verses ist im äthiopischen Text schwer verständlich; besonders das eingeklammerte Wort ist textlich unsicher. Möglich ist auch eine Wiedergabe mit „von ihnen“ oder „aus ihrer Mitte“ statt „wegen derer“.
    reason: textual_variant
lexical_decisions:
- source_word: አውሥአ፡ ካዕበ
  choice: antwortete erneut
  rationale: ካዕበ bezeichnet die Wiederholung. „Erneut“ gibt die Erzählformel natürlich wieder, ohne die Bedeutung auf eine ausdrücklich zweite Antwort zu verengen.
- source_word: ሚካኤል፡ ለሩፋኤል
  choice: Mikael … zu Rufael
  rationale: Die Namen werden entsprechend den äthiopischen Formen transliteriert und nicht an die im Deutschen geläufigeren Formen Michael und Rafael angeglichen.
- source_word: ዘኢይረክሕ፡ ልቡ፡ ዲቤሃ
  choice: dessen Herz darüber nicht weich wird
  rationale: Die konkrete Vorstellung eines weich werdenden Herzens bleibt erhalten. „Darüber“ lässt den im Ausgangstext nicht eindeutig bestimmten Bezug des Pronomens offen.
- source_word: ወኢይትሀወክ፡ ኵልያቲሁ
  choice: und dessen Nieren nicht erschüttert werden
  rationale: ኵልያት bedeutet wörtlich „Nieren“ und bezeichnet in semitischer Anthropologie zugleich das emotionale und moralische Innere. „Erschüttert“ vermittelt die bezeichnete innere Beunruhigung.
- source_word: እምዛቲ፡ ቃለ፡ ጽነኒ
  choice: von diesem Wort der Strenge
  rationale: Die formelhafte und gewichtige Diktion des Ausgangstextes bleibt gewahrt; „Strenge“ vermeidet eine unnötige Festlegung auf bloße Härte, Bedrängnis oder ein förmliches Dekret.
- source_word: ወፅእት፡ ዲቤሆሙ
  choice: und dem Urteil, das über sie ergangen ist
  rationale: Die Wendung bezeichnet einen gegen beziehungsweise über sie ausgegangenen Ausspruch. „Urteil“ entspricht dem gerichtlichen Zusammenhang, während „ergangen“ das Bild des Herausgehens bewahrt.
- source_word: '[እምኔሆሙ፡] ዘአውፅእዎሙ፡ ከመ''ዝ'
  choice: wegen derer, die sie so hervorgebracht haben
  rationale: Die Wiedergabe erhält den Relativsatz und versteht እም kausal. Wegen des eingeklammerten Wortes und der schwierigen Überlieferung wird die Unsicherheit in einer Fußnote ausdrücklich kenntlich gemacht.
theological_decisions:
- issue: Anthropologische Bildsprache von Herz und Nieren
  choice: Die konkreten Körperbegriffe bleiben im Haupttext stehen.
  alternative: „dessen Innerstes nicht erschüttert wird“ oder eine vollständig psychologisierende Wiedergabe
  rationale: Der Text beschreibt moralische und emotionale Reaktion in alter semitischer Körpersprache. Eine Abstraktion zu „Gemüt“, „Geist“ oder „Gewissen“ würde diese Bildwelt einebnen.
- issue: Charakter des ergangenen Ausspruchs
  choice: „Urteil“
  alternative: „Spruch“, „Verfügung“ oder „Strafurteil“
  rationale: „Urteil“ bewahrt den gerichtlichen Ton, ohne durch „Strafurteil“ Art und Ergebnis des Ausspruchs stärker festzulegen, als es die schwierige Formulierung erlaubt.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewusst bewahrter semitischer Körperbildsprache. Der Fragesatz bleibt rhetorisch zugespitzt; ungeklärte Bezüge und die textliche Schwierigkeit des Schlusses werden nicht stillschweigend harmonisiert.
