base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/068/002.yaml
  text: And on that day Michael answered[a], saying to Raphael, “The power of the spirit seizes me and provokes me to anger because of the severity of the judgment concerning the hidden secrets. Who is there that can endure the severe judgment that has been executed[c][b], and before which they melt away?”
translation:
  language: de
  text: 'Und an jenem Tag antwortete Michael und sagte zu Raphael: „Die Kraft des Geistes[a] ergreift mich und versetzt mich in Zorn wegen der Härte des Urteils über die verborgenen Geheimnisse.[b] Wer kann das harte Urteil ertragen, das vollstreckt worden ist,[c] und vor dem sie dahinschmelzen?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ausdruck kann „Geist“, „Wind“ oder „Atem“ bedeuten. Hier ist „Geist“ wahrscheinlich; ob damit ausdrücklich der göttliche Geist gemeint ist, bleibt offen.
    reason: theological_ambiguity
  - marker: b
    text: Der äthiopische Wortlaut ist schwierig. Wörtlicher kann die Wendung auch etwas Schreckliches bezeichnen, das dem Ohr über verborgene Dinge zu hören kommt.
    reason: textual_variant
  - marker: c
    text: 'Oder: „Wer kann das Schreckliche ertragen, das geschehen ist?“ Die Aussage kann sich auf das Gericht selbst oder auf dessen Offenbarung beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ
  choice: antwortete
  rationale: Das übliche Erzählverb bezeichnet hier eine Antwort oder Erwiderung; der anschließende Ausspruch an Raphael bestätigt den dialogischen Zusammenhang.
- source_word: ኀይሉ ለመንፈስ
  choice: die Kraft des Geistes
  rationale: ኀይል bezeichnet wirksame Kraft oder Macht; መንፈስ kann Geist, Wind oder Atem bedeuten. Im visionären Zusammenhang liegt „Geist“ am nächsten, ohne den Referenten näher festzulegen.
- source_word: ይመሥጠኒ
  choice: ergreift mich
  rationale: Das Verb beschreibt ein machtvolles Ergreifen oder Fortreißen. „Ergreift mich“ bewahrt das eindringliche Bild und klingt im Deutschen natürlich.
- source_word: ያምዕዐኒ
  choice: versetzt mich in Zorn
  rationale: Die kausative Form bezeichnet das Hervorrufen von Zorn oder Entrüstung. Die Übersetzung gibt diesen spezifischen Gefühlsgehalt wieder, statt ihn zu einer bloßen inneren Bewegung abzuschwächen.
- source_word: ዕፁቡ
  choice: die Härte / das harte
  rationale: Das Wort bezeichnet etwas Schweres, Schreckliches oder Hartes. Im erschlossenen Gerichtszusammenhang gibt „Härte“ den Sinn wieder, ohne ausschließlich Furcht oder Grauen zu bezeichnen.
- source_word: እንተ ኅቡኣት
  choice: die verborgenen Geheimnisse
  rationale: Die Wendung verweist auf verborgene oder geheime Dinge. Die leicht verstärkende Formulierung entspricht dem apokalyptischen Zusammenhang und der schwierigen, wiederholten Rede vom Hören.
- source_word: ተዐግሦተ
  choice: ertragen
  rationale: Gemeint ist die Fähigkeit, unter etwas Überwältigendem standzuhalten; „ertragen“ ist präzise und idiomatisch.
- source_word: ተገብረት
  choice: vollstreckt worden ist
  rationale: Die passive Perfektform bedeutet grundsätzlich „getan worden ist“. Im Gerichtszusammenhang ist „vollstreckt“ eine plausible kontextuelle Wiedergabe, während die wörtlichere Möglichkeit in der Fußnote erhalten bleibt.
- source_word: ይትመሰዉ
  choice: sie dahinschmelzen
  rationale: Das Verb zeichnet das Bild des Auflösens oder Hinschwindens angesichts eines überwältigenden Gerichts. „Dahinschmelzen“ bewahrt diese apokalyptische Bildsprache.
theological_decisions:
- issue: Ob መንፈስ ausdrücklich den göttlichen Geist bezeichnet
  choice: Geist, ohne nähere Bestimmung
  alternative: der göttliche Geist / der Heilige Geist
  rationale: Der äthiopische Ausdruck legt die geistige Wirklichkeit nahe, identifiziert sie aber nicht ausdrücklich als den Heiligen Geist. Da deutsche Substantive stets großgeschrieben werden, wird die offene Referenz in einer Fußnote benannt.
- issue: Ob ዕፁቡ ein Gericht oder eine schreckliche, dem Ohr mitgeteilte Sache bezeichnet
  choice: Härte des Urteils über die verborgenen Geheimnisse
  alternative: etwas Schreckliches, das das Ohr über verborgene Dinge hört
  rationale: Der überlieferte Wortlaut ist schwierig und enthält eine wiederholte Wendung mit „Ohr“. Die gewählte Fassung ergibt im Kontext einen kohärenten Gerichtssinn, während die wörtlichere Deutungsmöglichkeit ausdrücklich in der Fußnote bewahrt wird.
- issue: Ob sich die abschließende Aussage auf das Gericht selbst oder auf dessen Offenbarung bezieht
  choice: das vollstreckte Urteil
  alternative: das Schreckliche, das geschehen ist, beziehungsweise seine Offenbarung
  rationale: Der gerichtliche Zusammenhang stützt die Hauptfassung, doch die grammatisch allgemeinere Formulierung des Ausgangstextes lässt die Alternative offen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit klarer apokalyptischer Bildsprache. Die geläufigen deutschen Namensformen Michael und Raphael werden verwendet. Wiederholungen werden nur dort geglättet, wo der schwierige äthiopische Wortlaut sonst unverständlich wäre; seine wesentlichen Mehrdeutigkeiten bleiben durch Fußnoten sichtbar.
