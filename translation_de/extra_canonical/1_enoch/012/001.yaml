translation:
  language: de
  text: '**1 Henoch 12,1**


    Vor all dem wurde Henoch verborgen. Niemand von den Menschen wusste, wo er verborgen worden war, wo er sich befand oder was mit ihm geschehen war. Sein ganzes Wirken vollzog sich in seinen Tagen bei den Heiligen und bei den Wächtern.[a]


    Ich, Henoch, pries den großen Herrn und den König der Ewigkeit. Da riefen mich die Wächter – mich, Henoch, den Schreiber – und sagten zu mir: »Henoch, Schreiber der Gerechtigkeit, geh und verkünde den Wächtern des Himmels, die den hohen Himmel und die heilige, ewige Wohnstätte verlassen haben, die sich mit Frauen verunreinigt und so gehandelt haben, wie Menschen handeln, die sich Frauen genommen und großes Verderben über die Erde gebracht haben: Auf Erden wird es für sie weder Frieden noch Vergebung der Sünde geben. Denn sie freuen sich über ihre Kinder; sie werden die Tötung ihrer Lieben mit ansehen. Über den Untergang ihrer Kinder werden sie wehklagen und in Ewigkeit flehen; aber weder Erbarmen noch Frieden wird ihnen zuteilwerden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Wächter“ ist hier ein Titel für himmlische Wesen; das zugrunde liegende Wort bezeichnet wachsame oder wachende Wesen.
    reason: Begriffserklärung
lexical_decisions:
- source_word: ተከብተ
  choice: wurde verborgen
  rationale: Die Form bezeichnet hier Henochs Verborgenwerden bzw. Entrücktheit; die passive Wiedergabe bewahrt die Aussage, ohne den Handelnden zu bestimmen.
- source_word: ግብሩ
  choice: sein ganzes Wirken
  rationale: Das Substantiv kann Werk, Tun oder Tätigkeit bezeichnen. „Wirken“ passt zum erzählenden Zusammenhang und vermeidet eine unnötige Festlegung auf einzelne Taten.
- source_word: ትጉሃን
  choice: Wächter
  rationale: Die traditionelle sachgerechte Wiedergabe bezeichnet die wachsamen himmlischen Wesen; eine Fußnote erklärt den Titel.
- source_word: ጸሓፌ፡ ጽድቅ
  choice: Schreiber der Gerechtigkeit
  rationale: Die Genitivverbindung wird formal bewahrt und nicht als bloß wertendes „gerechter Schreiber“ vereindeutigt.
- source_word: ማሰኑ / ሙስና
  choice: sich verunreinigt / Verderben
  rationale: Die verwandten Formen tragen im Kontext sowohl den Gedanken sittlicher Befleckung als auch verderblichen Handelns; die unterschiedlichen deutschen Ausdrücke entsprechen den jeweiligen Satzfunktionen.
- source_word: ለዓለም
  choice: in Ewigkeit
  rationale: Der Ausdruck bezeichnet unbegrenzte Dauer; „in Ewigkeit“ wahrt den feierlichen, gerichtlichen Ton.
theological_decisions:
- issue: Umfang des bereitgestellten äthiopischen Textes
  choice: Den vollständig gelieferten Geʽez-Text übersetzen
  alternative: Nur den kurzen Anfangssatz nach der älteren, abgeschnittenen Überlieferungsvorlage wiedergeben
  rationale: Die aktuelle Quelle enthält ausdrücklich den vollständigen Orakeltext und ist als korrigierter, hochverlässlicher Zeuge gekennzeichnet. Daher darf die frühere Kürzung nicht beibehalten werden.
- issue: Bezeichnung Henochs als „Schreiber der Gerechtigkeit“
  choice: Die mehrdeutige Genitivkonstruktion beibehalten
  alternative: „gerechter Schreiber“
  rationale: Die Quelle kann einen Schreiber bezeichnen, der zur Gerechtigkeit gehört oder sie aufzeichnet. Die formale Wendung lässt diese theologische Nuance offen.
- issue: Gerichtsankündigung in der dritten Person
  choice: Die wiederholten Formen „für sie/ihnen“ als dritte Person wiedergeben
  alternative: Nach traditioneller Textgestalt unmittelbar in die zweite Person („für euch“) wechseln
  rationale: Der vorliegende Geʽez-Wortlaut verwendet in diesen Sätzen Formen der dritten Person. Diese Perspektive wird nicht stillschweigend an andere Texttraditionen angepasst.
- issue: Fehlender Friede und fehlende Vergebung
  choice: Als angekündigtes Gericht über die abgefallenen Wächter übersetzen
  alternative: Die Aussage zu einer allgemeinen Lehre über unvergebbare Sünde ausweiten
  rationale: Der unmittelbare Adressatenkreis des Textes sind die himmlischen Wächter; eine darüber hinausgehende dogmatische Verallgemeinerung wäre nicht quellengestützt.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit erzählerischem Fluss. Die längeren Satzgefüge wurden behutsam gegliedert, ohne die Abfolge des Geʽez-Textes oder seine Perspektivwechsel zu glätten. Der Gottesname wird nicht ergänzt; „großer Herr“ und „König der Ewigkeit“ folgen den ausdrücklich überlieferten Titeln.
