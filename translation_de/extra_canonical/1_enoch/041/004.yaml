base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/004.yaml
  text: And there I saw the storehouses of the lightning[a], and from them are apportioned the wind from the storehouse of hail, and the wind from the storehouse of mist[d][c][b], and the cloud and its cloud remain over the earth from before the world.
translation:
  language: de
  text: Dort sah ich die Vorratskammern der Blitze. Aus ihnen werden der Wind aus der Vorratskammer des Hagels und der Wind aus der Vorratskammer des Nebels[a] verteilt; und das zur Wolke Gehörige und ihre Wolke[b] bleiben über der Erde – von vor der Welt her.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit „Nebel“ wiedergegebene äthiopische Wort ist in diesem Textzeugen unsicher; möglich sind auch „Frost“, „Raureif“, „Tau“ oder eine verwandte Wettererscheinung.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „und das der Wolke und ihre Wolke“. Die äthiopische Formulierung ist ungewöhnlich; möglicherweise ist eine zur Wolke gehörende Vorratskammer oder Wettererscheinung gemeint. Die Übersetzung lässt das Bezugswort unausgesprochen.'
    reason: textual_ambiguity
  - marker: c
    text: 'Oder: „von vor dem Zeitalter her“. Das äthiopische Wort kann je nach Zusammenhang „Welt“, „Weltzeit“ oder „Zeitalter“ bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መዛግብተ
  choice: Vorratskammern
  rationale: Das Wort bezeichnet Orte, an denen Vorräte verwahrt werden. „Vorratskammern“ erhält das konkrete kosmologische Bild und vermeidet den in modernem Deutsch leicht finanziellen Beiklang von „Schatzkammern“.
- source_word: ፀዳዋነ
  choice: Blitze
  rationale: Im Zusammenhang mit Hagel, Nebel und Wolken ist die meteorologische Bedeutung naheliegend; der deutsche Plural entspricht der Form und klingt natürlich.
- source_word: ይትከፈሉ
  choice: werden … zugeteilt
  rationale: Die passive Form beschreibt eine geordnete Zuteilung oder Verteilung aus den himmlischen Vorratskammern, nicht bloß eine physische Teilung.
- source_word: ነፋስ
  choice: Wind
  rationale: Der unmittelbare Wetterkontext verlangt hier die meteorologische Bedeutung. Die zweimalige Nennung wird entsprechend dem äthiopischen Text bewahrt.
- source_word: በረድ
  choice: Hagel
  rationale: Die gewöhnliche und im Wetterkontext eindeutige deutsche Entsprechung.
- source_word: ጊሜ
  choice: Nebel
  rationale: Der genaue Wetterbegriff ist in diesem Textzeugen unsicher. „Nebel“ passt zum anschließenden Wolkenwort, während mögliche Alternativen in einer Fußnote offengehalten werden.
- source_word: ወዘደመና ወደመና ዚአሁ
  choice: und das zur Wolke Gehörige und ihre Wolke
  rationale: Die ungewöhnliche relative beziehungsweise demonstrative Konstruktion und die anschließende Wiederholung von „Wolke“ werden nicht zu einer eindeutigeren Beziehung geglättet. „Das zur Wolke Gehörige“ gibt ዘ wieder, ohne ein im Ausgangstext nicht genanntes Substantiv einzusetzen.
- source_word: የኀድር
  choice: bleiben
  rationale: Das Verb bezeichnet anhaltendes Verweilen oder Ruhen. „Bleiben“ ist verständlich und wahrt den Gedanken fortdauernder Gegenwart.
- source_word: እምቅድመ ዓለም
  choice: von vor der Welt her
  rationale: Die bewusst ungewöhnliche Formulierung erhält die ursprüngliche zeitliche Bildsprache und legt nicht fest, ob ዓለም hier „Welt“, „Weltzeit“ oder „Zeitalter“ meint.
theological_decisions:
- issue: Ursprüngliche Zeitangabe im kosmologischen Zusammenhang
  choice: von vor der Welt her
  alternative: seit der Zeit vor der Welt; von vor dem Zeitalter her
  rationale: Die Wiedergabe bewahrt die Aussage von einer uranfänglichen Dauer, ohne sie auf eine spätere Lehre über Ewigkeit oder Schöpfung aus dem Nichts festzulegen.
- issue: Beziehung zwischen Wolke, Vorratskammer und Wettererscheinung
  choice: das zur Wolke Gehörige und ihre Wolke
  alternative: die Vorratskammer der Wolke und ihre Wolke; die Wolke und ihre Wolke
  rationale: Der äthiopische Wortlaut ist syntaktisch auffällig. Die Übersetzung lässt die genaue Beziehung offen, statt ein ausgelassenes Bezugswort dogmatisch oder kosmologisch zu ergänzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste lange Satz wurde nach dem ersten Bild geteilt, um die Aufzählung verständlich zu halten. Die auffällige Wolkenkonstruktion und die uranfängliche Zeitangabe bleiben bewusst ungeglättet; alle Fußnotenmarker erscheinen im Haupttext.
