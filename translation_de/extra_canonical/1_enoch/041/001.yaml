base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/001.yaml
  text: And after this I saw all the hidden things of the heavens[a], and how the kingdom is divided[c][b], and how the deeds of human beings are weighed in the balance.
translation:
  language: de
  text: Und danach sah ich alle verborgenen Dinge der Himmel[a] und wie das Königreich aufgeteilt wird[b] und wie die Taten der Menschen auf der Waage gewogen werden[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle Geheimnisse der Himmel“. Das ge''ezische Wort kann Dinge bezeichnen, die dem gewöhnlichen Blick oder Wissen verborgen sind.'
    reason: lexical_alternative
  - marker: b
    text: Die Aussage „wie das Königreich aufgeteilt wird“ ist schwierig. Gemeint sein könnte die Ordnung oder Zuteilung des himmlischen Herrschaftsbereichs.
    reason: alternative_reading
  - marker: c
    text: Wörtlich verwendet der Text für das menschliche Tun das Bild des Wiegens auf einer Waage; es kann Bewertung oder Gericht nahelegen.
    reason: cultural_note
lexical_decisions:
- source_word: እምድኅረዝ
  choice: danach
  rationale: Bewahrt die zeitliche Übergangsformel der Visionserzählung in natürlichem modernem Deutsch.
- source_word: ርኢኩ
  choice: sah ich
  rationale: Gibt das übliche Verb des visionären Schauens direkt und ohne Archaisierung wieder.
- source_word: ኵሎ ኅቡኣቲሁ ለሰማያት
  choice: alle verborgenen Dinge der Himmel
  rationale: Bewahrt den konkreten Plural und die Bedeutung des dem gewöhnlichen Blick oder Wissen Verborgenen; „der Himmel“ spiegelt die pluralische Genitivkonstruktion.
- source_word: መንግሥተ
  choice: das Königreich
  rationale: Erhält den kosmisch-politischen Sinn des Nomens, ohne ihn auf eine bestimmte himmlische Ordnung festzulegen.
- source_word: እፎ
  choice: wie
  rationale: Leitet natürlich den Inhalt dessen ein, was der Seher wahrnahm.
- source_word: ትትካፈል
  choice: aufgeteilt wird
  rationale: Gibt den passivisch-reflexiven Sinn des Teilens oder Zuteilens wieder und lässt offen, ob Teilung oder geordnete Zuweisung gemeint ist.
- source_word: ትገበረ ሰብእ
  choice: die Taten der Menschen
  rationale: Bezeichnet verständlich das von Menschen Getane, ohne den Ausdruck zu einer abstrakten Lehre vom menschlichen Verhalten auszuweiten.
- source_word: በመዳልው
  choice: auf der Waage
  rationale: Bewahrt das konkrete Bild eines Wiegegeräts, das Beurteilung oder Gericht nahelegt.
- source_word: ይደለው
  choice: gewogen werden
  rationale: Passt zum vorausgehenden Waagebild und erhält die gerichtliche Metaphorik.
theological_decisions:
- issue: Bedeutung der Aussage über das Königreich
  choice: Das Königreich wird aufgeteilt.
  alternative: Das himmlische Herrschaftsgebiet wird geordnet oder verschiedenen Bereichen zugeteilt.
  rationale: Der ge'ezische Wortlaut ist knapp und schwierig. Die Übersetzung bewahrt die Vorstellung von Teilung beziehungsweise Zuteilung, ohne die kosmologische Bedeutung näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer visionärer Erzählweise. Die ungewöhnliche Wendung „der Himmel“ erhält den Plural des Ausgangstextes; die schwierige Königreichsklausel wird nicht harmonisiert oder konfessionell ausgelegt.
