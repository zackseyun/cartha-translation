base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/005.yaml
  text: And I saw the storehouses of the sun and of the moon[a], where they come out and where they go in, and their glorious return; and one is more honored than the other. And their course is blessed, and they do not overstep their course, and they do not add to it, and they do not take away from their course[d][c][b]; and they keep faith with one another by an oath.
translation:
  language: de
  text: 'Und ich sah die Vorratskammern der Sonne und des Mondes[a]: woher sie hervorkommen und wo sie hineingehen, ihre herrliche Rückkehr und wie eines dem anderen an Ehre überlegen ist[b]. Ihr Lauf ist gesegnet, und sie überschreiten ihre Bahn nicht; sie fügen ihr nichts hinzu und nehmen nichts von ihrer Bahn weg. Und durch einen Eid halten sie einander die Treue[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schatzkammern“. Gemeint sind himmlische Kammern, aus denen Sonne und Mond hervorkommen und in die sie zurückkehren.'
    reason: lexical_alternative
  - marker: b
    text: Die Aussage ist schwierig. Sie kann den unterschiedlichen Glanz oder Rang von Sonne und Mond bezeichnen; welches von beiden höher geehrt wird, sagt der Wortlaut hier nicht ausdrücklich.
    reason: ambiguity_note
  - marker: c
    text: Die Wendung gebraucht Treue- und Eidessprache für die geordnete Bewegung der Himmelskörper und beschreibt damit mehr als bloß mechanische Regelmäßigkeit.
    reason: cultural_theological_note
lexical_decisions:
- source_word: መዛግብተ
  choice: Vorratskammern
  rationale: Das Wort bezeichnet Schatz- oder Vorratskammern. „Vorratskammern“ bewahrt das konkrete kosmische Bild von Räumen, aus denen Sonne und Mond hervorkommen, ohne einen vorwiegend finanziellen Beiklang.
- source_word: እምአይቴ ይወፅኡ / አይቴ ይገብኡ
  choice: woher sie hervorkommen / wohin sie hineingehen
  rationale: Die räumlichen Bewegungsverben und das Präfix እም- („von/aus“) werden ausdrücklich wiedergegeben. So bleibt das Bild himmlischer Kammern erhalten; „aufgehen/untergehen“ wäre stärker deutend.
- source_word: ግብኦቶሙ ስቡሕ
  choice: ihre herrliche Rückkehr
  rationale: ግብኦት bezeichnet hier das Eingehen beziehungsweise die Rückkehr; ስቡሕ trägt den Sinn von Herrlichkeit und Glanz. Die Formulierung wahrt den zyklischen und erhabenen Charakter.
- source_word: አፎ ይከብር አሐዱ ለካልኡ
  choice: wie das eine mehr geehrt wird als das andere
  rationale: „Wie“ bildet das interrogative አፎ ab. Die schwierige Vergleichsaussage wird nicht auf ein bestimmtes Gestirn oder ausschließlich auf sichtbaren Glanz festgelegt.
- source_word: ምሕዋሮሙ / ምሕዋረ
  choice: ihr Lauf / ihre Bahn
  rationale: Das Wortfeld umfasst Lauf, Weg und Umlauf. Die beiden natürlichen deutschen Ausdrücke vermeiden das moderne, technisch engere „Orbit“.
- source_word: ብፁዕ
  choice: gesegnet
  rationale: Die religiöse Wertung des geordneten Laufs bleibt erhalten und wird nicht zum neutralen „regelmäßig“ abgeschwächt.
- source_word: ኢየኃልፉ ምሕዋረ
  choice: sie überschreiten ihre Bahn nicht
  rationale: Die Formulierung bezeichnet das Nichtüberschreiten gesetzter Grenzen und bewahrt sowohl den räumlichen als auch den normativen Unterton.
- source_word: ኢይዌስኩ ወኢያኃጽጹ
  choice: sie fügen ihr nichts hinzu und nehmen nichts von ihrer Bahn weg
  rationale: Die beiden gegenläufigen Verben werden in ihrer parallelen, ausdrücklich negierten Struktur wiedergegeben.
- source_word: ሃይማኖተ የዐቅቡ ... በመሐላ
  choice: sie halten einander die Treue durch einen Eid
  rationale: Hier meint ሃይማኖት Treue beziehungsweise Verlässlichkeit, nicht eine Lehrmeinung. „Durch einen Eid“ erhält die feierliche, bundeshafte Sprache.
theological_decisions:
- issue: Astronomische Regelmäßigkeit oder religiös-bundeshafte Sprache
  choice: „gesegnet“ sowie „einander die Treue durch einen Eid halten“ werden ausdrücklich beibehalten.
  alternative: Neutralisierend mit „regelmäßig“ und „sich an ihre Vereinbarung halten“ übersetzen.
  rationale: Der ge'ezische Wortlaut beschreibt die Himmelskörper nicht nur mechanisch, sondern mit religiös und ethisch gefärbten Begriffen. Diese Spannung der apokalyptischen Kosmologie darf nicht eingeebnet werden.
- issue: Vergleich von Sonne und Mond
  choice: Offen lassen, welches Gestirn mehr geehrt wird und worin diese Ehre besteht.
  alternative: Ausdrücklich sagen, die Sonne übertreffe den Mond an Glanz oder Rang.
  rationale: Der Wortlaut enthält einen Vergleich, identifiziert hier aber nicht eindeutig dessen Träger und genaue Hinsicht. Die Übersetzung bewahrt diese genuine Unbestimmtheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit anschaulicher apokalyptischer Bildsprache. Die Syntax folgt dem visionären Bericht, bleibt aber für heutige Leser flüssig. Archaismen und moderne astronomische Fachbegriffe wurden vermieden; die schwierige Vergleichsaussage und die bundeshafte Sprache wurden nicht harmonisiert.
