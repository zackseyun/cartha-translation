revisions:
- from: 'Und ich sah die Vorratskammern der Sonne und des Mondes[a]: woher sie hervorkommen und wohin sie hineingehen, ihre herrliche Rückkehr und wie das eine mehr geehrt wird als das andere[b]. Ihr Lauf ist gesegnet, und sie überschreiten ihre Bahn nicht; sie fügen ihr nichts hinzu und nehmen nichts von ihrer Bahn weg. Und sie halten einander die Treue durch einen Eid[c].'
  to: 'Und ich sah die Vorratskammern der Sonne und des Mondes[a]: woher sie hervorkommen und wo sie hineingehen, ihre herrliche Rückkehr und wie eines dem anderen an Ehre überlegen ist[b]. Ihr Lauf ist gesegnet, und sie überschreiten ihre Bahn nicht; sie fügen ihr nichts hinzu und nehmen nichts von ihrer Bahn weg. Und durch einen Eid halten sie einander die Treue[c].'
