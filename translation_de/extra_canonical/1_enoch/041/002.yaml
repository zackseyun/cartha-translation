base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/002.yaml
  text: There I saw the dwelling places of the sinners and the dwelling places of the holy ones[a]; and there my eyes saw all the sinners being driven away from there—those who deny the name of the Lord of Spirits—and they were being dragged off[d][c][b], and they could not stand because of the punishment that goes out from the Lord of Spirits.
translation:
  language: de
  text: Dort sah ich die Wohnstätten der Sünder und die Wohnstätten der Heiligen[a]. Dort sahen meine Augen, wie alle Sünder von dort vertrieben wurden – jene, die den Namen des Herrn der Geister verleugnen. Sie wurden fortgeschleppt und konnten der Strafe, die vom Herrn der Geister ausgeht, nicht standhalten[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Ge’ez gebraucht für beide Gruppen dasselbe Wort für „Wohnstätten“. Mit den „Heiligen“ können geheiligte Menschen, himmlische Wesen oder beide gemeint sein.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „Stehen war ihnen nicht möglich.“ Die Wendung kann auch bedeuten, dass sie nicht stehen oder nicht bleiben konnten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መኃድሪሆሙ
  choice: Wohnstätten
  rationale: Das Substantiv bezeichnet Orte des Wohnens oder Aufenthalts. „Wohnstätten“ bewahrt die konkrete räumliche Bildsprache und wird entsprechend der Wiederholung im Ge’ez für beide Gruppen wiederholt.
- source_word: ኃጥኣን
  choice: Sünder
  rationale: Der Ausdruck ist eine geläufige moralische Bezeichnung und erhält den apokalyptischen Gegensatz zu den Heiligen.
- source_word: ቅዱሳን
  choice: die Heiligen
  rationale: Die Form kann geheiligte Menschen, himmlische Wesen oder beide Gruppen bezeichnen. „Die Heiligen“ lässt den Bezug offen; die Fußnote macht diese echte Mehrdeutigkeit ausdrücklich.
- source_word: ይሰደዱ
  choice: vertrieben wurden
  rationale: Die Wiedergabe vermittelt sowohl die gewaltsame Entfernung als auch den gerichtlichen Charakter des Vorgangs.
- source_word: ይክሕድዎ ለስመ
  choice: den Namen … verleugnen
  rationale: Die ausdrückliche Nennung des Namens bleibt erhalten und wird nicht zu einer allgemeinen Aussage über Unglauben verflacht.
- source_word: እግዚአ መናፍስት
  choice: Herr der Geister
  rationale: Dies ist ein charakteristischer Gottesname im Henochbuch. Die transparente, etablierte Wiedergabe bewahrt seine besondere Form.
- source_word: ይስሐቡ
  choice: fortgeschleppt
  rationale: Das Verb bezeichnet ein Ziehen oder Schleppen und trägt im Zusammenhang deutliche gewaltsame und strafende Konnotationen.
- source_word: ቀዊመ አልቦሙ
  choice: konnten … nicht bestehen
  rationale: Die Wendung besagt wörtlich, dass ihnen kein Stehen zukommt. „Nicht bestehen“ erhält sowohl die körperliche Vorstellung des Nicht-stehen-Könnens als auch den Sinn, der Strafe nicht standhalten zu können.
- source_word: መቅሠፍት
  choice: Strafe
  rationale: Das Wort kann Schlag, Plage oder strafende Heimsuchung bezeichnen. „Strafe“ gibt hier den gerichtlichen Sinn wieder, ohne ihre konkrete Gestalt festzulegen.
- source_word: ትወጽእ እምእግዚአ መናፍስት
  choice: die vom Herrn der Geister ausgeht
  rationale: Die dynamische Vorstellung, dass die Strafe von der göttlichen Quelle ausgeht, bleibt unmittelbar erhalten.
theological_decisions:
- issue: Identität der Heiligen
  choice: Die Heiligen
  alternative: die heiligen Menschen; die Engel; die heiligen Wesen
  rationale: Das Ge’ez legt an dieser Stelle nicht fest, ob geheiligte Menschen, himmlische Wesen oder beide gemeint sind. Die Übersetzung wahrt diese Offenheit.
- issue: Verleugnung des Namens des Herrn der Geister
  choice: die den Namen des Herrn der Geister verleugnen
  alternative: die den Herrn der Geister ablehnen; die nicht an den Herrn der Geister glauben
  rationale: Der Ausgangstext nennt ausdrücklich den göttlichen Namen. Diese theologisch gewichtige Formulierung darf nicht zu einer allgemeinen Aussage über Unglauben eingeebnet werden.
- issue: Unfähigkeit, unter dem Gericht zu stehen
  choice: konnten … nicht bestehen
  alternative: konnten nicht stehen; konnten nicht bleiben; fanden keinen Ort, an dem sie stehen konnten
  rationale: Die Formulierung bewahrt die Spannung zwischen körperlichem Stehen, Standhalten und Fortbestehen, ohne sich ausschließlich auf eine dieser Nuancen festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer apokalyptischer Bildsprache. Die Wiederholung von „Wohnstätten“ folgt bewusst dem Ausgangstext. Der Satzbau wurde behutsam gegliedert, ohne die Abfolge von Vertreibung, Verleugnung, Fortschleppen und göttlicher Strafe umzudeuten.
