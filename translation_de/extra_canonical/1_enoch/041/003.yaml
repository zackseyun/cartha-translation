base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/041/003.yaml
  text: And there my eyes saw the hidden treasuries of the lightning and the thunder[a], and the hidden treasuries of the winds—how they are divided so that they may blow upon the earth—and the hidden treasuries of the clouds and the dew; and there I saw from where they come in that place[e][d][c][b], and from there they water the dust of the earth.
translation:
  language: de
  text: Und dort sahen meine Augen die verborgenen Schatzkammern des Blitzes und des Donners[a], die verborgenen Schatzkammern der Winde und wie ihre Mündungen aufgeteilt sind[b], damit sie über die Erde wehen, sowie die verborgenen Schatzkammern der Wolken und des Taus. Dort sah ich auch, woher sie an jenem Ort kommen[c]; und von dort wird der Staub der Erde mit Feuchtigkeit gesättigt[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die verborgenen Aufbewahrungsorte des Blitzes und des Donners“. Das zugrunde liegende Wort kann Verborgenes oder für später Zurückbehaltenes bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „wie ihre Münder aufgeteilt sind“; gemeint sind offenbar die Austrittsöffnungen oder die Verteilung der Winde.'
    reason: lexical_alternative
  - marker: c
    text: Der grammatische Bezug ist nicht völlig eindeutig; die Aussage kann sich besonders auf Wolken und Tau oder weiter auf die zuvor genannten Erscheinungen beziehen.
    reason: ambiguity
  - marker: d
    text: 'Wörtlich etwa: „und von dort wird der Staub der Erde satt/gefüllt“. Andere verstehen den Satz aktiv: „und von dort tränken sie den Staub der Erde“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ኅቡኣተ
  choice: verborgene Vorratskammern
  rationale: Das Wort bezeichnet Verborgenes oder Zurückbehaltenes. Im kosmischen Visionszusammenhang bewahrt „Vorratskammern“ das Bild aufgespeicherter Naturkräfte, ohne das Adjektiv „verborgen“ preiszugeben.
- source_word: መብረቅት / ነጐድጓድ
  choice: Blitz / Donner
  rationale: Die meteorologischen Erscheinungen werden im Deutschen idiomatisch als Kollektivbegriffe im Singular wiedergegeben.
- source_word: ነፋሳት
  choice: Winde
  rationale: Das anschließende Wehen über die Erde legt hier eindeutig die meteorologische Bedeutung nahe, nicht „Geister“.
- source_word: አፎ ይትከፈሉ
  choice: deren Mündungen geteilt sind
  rationale: „Mündungen“ erhält das körperhafte Bild der „Münder“, klingt im Deutschen aber zugleich natürlich für Austrittsöffnungen; das Passiv gibt die Aufteilung beziehungsweise Verteilung wieder.
- source_word: ከመ ይንፍሑ ዲበ ምድር
  choice: damit sie über die Erde wehen
  rationale: Die Zweckangabe und die aktive Bewegung der Winde werden klar und idiomatisch ausgedrückt.
- source_word: ደመናት / ጠል
  choice: Wolken / Tau
  rationale: Unmittelbare, geläufige Bezeichnungen der genannten Feuchtigkeitsphänomene.
- source_word: እምኀበ ይመጽእ
  choice: woher sie … kommen
  rationale: Die schlichte Bewegungsbedeutung des Verbs wird bewahrt. Der Plural bezieht die zuvor genannten Erscheinungen ein, obwohl die Formulierung hinsichtlich des Bezugs nicht völlig eindeutig ist.
- source_word: ይፀግቡ ጸበለ ምድር
  choice: wird der Staub der Erde mit Feuchtigkeit gesättigt
  rationale: Die intransitive Grundbedeutung „satt/gefüllt werden“ wird gegenüber einer aktiv-kausativen Wiedergabe bevorzugt. Der Zusatz „mit Feuchtigkeit“ macht im Deutschen den meteorologischen Sinn verständlich.
theological_decisions:
- issue: 'Bedeutung von ነፋሳት: „Winde“ oder „Geister“'
  choice: Winde
  alternative: Geister
  rationale: Blitz, Donner, Wolken und Tau bilden einen meteorologischen Katalog; außerdem heißt es ausdrücklich, dass sie über die Erde wehen. Daher ist „Winde“ die lokal begründete Lesart.
- issue: Aktive oder intransitive Deutung des Schlusssatzes
  choice: Der Staub der Erde wird mit Feuchtigkeit gesättigt
  alternative: Sie tränken den Staub der Erde
  rationale: Die G-Stamm-Form spricht für „satt beziehungsweise gefüllt werden“ und nicht für eine kausativ-transitive Handlung. Die grammatische Spannung wird nicht zugunsten einer glatteren aktiven Aussage eingeebnet.
translation_notes:
  register: Moderne, würdevolle Visionsprosa. Die Reihung und das kosmische Bild verborgener Vorratskammern bleiben erhalten; schwer verständliche Anthropomorphismen werden im Haupttext nur leicht idiomatisiert und in den Fußnoten wörtlich offengelegt.
