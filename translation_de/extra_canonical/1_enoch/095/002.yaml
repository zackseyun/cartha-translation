base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/002.yaml
  text: Who has allowed you to do hatred and evil? And condemnation will overtake you sinners[a][b].
translation:
  language: de
  text: Wer hat euch erlaubt, Hass und Böses zu tun? Und die Verurteilung wird euch Sünder[a][b] ereilen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Mit die Apposition ausdrücklich verdeutlichender Zeichensetzung: »Die Verurteilung wird euch, die Sünder, ereilen.«'
    reason: Die Umschreibung verdeutlicht die wahrscheinlich appositionelle Funktion von »Sünder« zu »euch«.
  - marker: b
    text: Eine ältere grammatische Deutung versteht das Präfix an »Sünder« präpositional im Sinn von »für Sünder« statt als Akkusativmarkierung; diese Satzanalyse ist weniger wahrscheinlich.
    reason: Dokumentiert die im englischen Audit überlieferte alternative Analyse, ohne sie als unnatürlichen deutschen Alternativsatz auszugeben.
lexical_decisions:
- source_word: መኑ
  choice: Wer
  rationale: Bewahrt die unmittelbare rhetorische Frage des äthiopischen Textes.
- source_word: ወሀበክሙ ከመ ትግበሩ
  choice: hat euch erlaubt, … zu tun
  rationale: Die Verbindung von »geben« mit dem ከመ-Satz bezeichnet hier eine eingeräumte Befugnis; die deutsche Formulierung ist natürlich und bewahrt den vorwurfsvollen Sinn.
- source_word: ጽልአ
  choice: Hass
  rationale: Direkte, moralisch gewichtige Wiedergabe des Nomens für Hass oder Feindschaft.
- source_word: ወእኩየ
  choice: und Böses
  rationale: Bewahrt den breiten moralischen Sinn, wobei die Substantivierung im Deutschen natürlich klingt.
- source_word: ይረከበክሙ
  choice: wird euch … ereilen
  rationale: Das Verb kann »finden, erreichen, ereilen« bedeuten; im Gerichtskontext vermittelt »ereilen« das drohende Eintreffen angemessen.
- source_word: ለኃጥኣን
  choice: euch Sünder
  rationale: 'Das Präfix ለ- markiert hier wahrscheinlich den Akkusativ einer Apposition zum vorweggenommenen Objektsuffix »euch«: »euch, die Sünder«.'
- source_word: ኵነኔ
  choice: die Verurteilung
  rationale: Der gerichtliche Ausdruck bezeichnet in diesem anklagenden Zusammenhang nicht bloß eine neutrale Beurteilung, sondern ein verurteilendes Urteil.
theological_decisions:
- issue: Wiedergabe von ኵነኔ als allgemeines Gericht oder als verurteilender Urteilsspruch
  choice: Verurteilung
  alternative: Gericht; Strafurteil
  rationale: Der Kontext ist ausdrücklich gegen Übeltäter gerichtet; »Verurteilung« bewahrt den negativen Ausgang, ohne zusätzliche konfessionelle Deutung einzutragen.
- issue: Syntaktische Funktion von ለኃጥኣን
  choice: 'appositionell: »euch Sünder«'
  alternative: 'dativisch: »für Sünder«'
  rationale: Das ለ- ist hier am besten als äthiopische Akkusativmarkierung in Apposition zum Objektsuffix an ይረከበክሙ zu verstehen. Wegen der früher vertretenen dativischen Analyse wird diese als textkritisch-grammatische Alternative vermerkt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. »Hass und Böses« hält den apokalyptisch-moralischen Ton knapp und verständlich; »ereilen« ist gehoben, aber geläufig. Alle Fußnotenmarker stehen im Haupttext.
