base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/005.yaml
  text: Woe to you who repay evil to your neighbor, for you will be repaid according to your deeds.
translation:
  language: de
  text: Wehe euch, die ihr eurem Nächsten Böses vergeltet! Denn euch wird nach euren Taten vergolten werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'In beiden Satzteilen steht derselbe geʿezische Verbstamm: Wer Böses „vergilt“, dem wird selbst „vergolten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Wehe euch
  rationale: Bewahrt die prophetisch-apokalyptische Weheruf-Formel in natürlichem, gehobenem Deutsch.
- source_word: ትፈድዩ ... ትትፈድዩ
  choice: vergeltet ... wird vergolten werden
  rationale: Derselbe deutsche Verbstamm bildet die beabsichtigte Entsprechung zwischen dem Handeln der Angeredeten und der ihnen bevorstehenden Vergeltung ab.
- source_word: እኩየ
  choice: Böses
  rationale: Gibt den breiten moralischen und schädigenden Sinn wieder, ohne ihn auf körperlichen Schaden einzuengen.
- source_word: ለቢጽክሙ
  choice: eurem Nächsten
  rationale: Bezeichnet einen Mitmenschen in sozialer Beziehung und entspricht dem biblisch vertrauten, weiterhin verständlichen deutschen Ausdruck.
- source_word: በከመ፡ ምግባሪክሙ
  choice: nach euren Taten
  rationale: Drückt knapp aus, dass die Vergeltung sich an den Handlungen der Angeredeten bemisst.
theological_decisions:
- issue: Urheber der Vergeltung
  choice: Passiv ohne genannten Handelnden
  alternative: 'Gott vergilt euch; oder: Das Böse fällt von selbst auf die Täter zurück'
  rationale: Der geʿezische Wortlaut lässt den Handelnden unausgesprochen. Das Passiv bewahrt sowohl den gerichtlichen Sinn als auch die offene Frage nach der ausdrücklich handelnden Instanz.
translation_notes:
  register: Modernes Standarddeutsch in würdigem prophetischem Ton. Der Ausruf nach dem Weheruf ist im Deutschen idiomatisch; der zweite Satz bleibt als begründende Gerichtsaussage eng an der Quellstruktur.
