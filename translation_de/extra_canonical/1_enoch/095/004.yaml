base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/004.yaml
  text: Woe to you who pronounce curses that cannot be undone[c][b][a], and healing is far from you because of your sins.
translation:
  language: de
  text: Wehe euch, die ihr Flüche aussprecht[b], die nicht gelöst werden können[a]; und Heilung ist euch fern wegen eurer Sünden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „die nicht gelöst werden können“; gemeint sein kann auch, dass diese Flüche nicht aufgehoben oder widerrufen werden können.
    reason: Bewahrt die konkrete Bildsprache und erläutert die mögliche rechtlich-rituelle Bedeutung.
  - marker: b
    text: Oder „Bannflüche verhängt“. Das Wort kann Flüche, Bannformeln oder Anathemata bezeichnen.
    reason: Dokumentiert die lexikalische Spannweite, ohne den Haupttext konfessionell oder fachsprachlich einzuengen.
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Wehe euch
  rationale: Bewahrt die prophetische Weheruf-Formel und ihren Charakter als Gerichtsankündigung.
- source_word: እለ፡ ታወግዙ፡ ግዘታተ
  choice: die ihr Flüche aussprecht
  rationale: Das Verb bezeichnet hier das Verfluchen beziehungsweise Verhängen eines Banns; das verwandte Objekt meint Flüche, Bannformeln oder Anathemata. „Flüche aussprechen“ gibt den Sinn in natürlichem, allgemein verständlichem Deutsch wieder, ohne eine bestimmte kirchenrechtliche Bedeutung festzulegen.
- source_word: ከመ፡ እ ይትፈትሑ
  choice: die nicht gelöst werden können
  rationale: Der Text ist als Negation mit dem Passiv von „lösen, freigeben“ zu verstehen. Die bewusst konkrete Wiedergabe „gelöst“ erhält das Bild und lässt offen, ob Widerruf, Aufhebung oder Lossprechung gemeint ist.
- source_word: ወፈውስ
  choice: und Heilung
  rationale: „Heilung“ bewahrt sowohl die körperliche als auch die moralisch-geistliche Bedeutungsmöglichkeit.
- source_word: ርኁቅ፡ እምኔክሙ
  choice: ist euch fern
  rationale: Gibt die räumliche Metapher knapp und idiomatisch wieder.
- source_word: በእንተ፡ ኃጢአተ፡ ዚአክሙ
  choice: wegen eurer Sünden
  rationale: Bewahrt die kausale Aussage und den Plural des Ausgangstextes.
theological_decisions:
- issue: Art der ausgesprochenen Flüche
  choice: Flüche
  alternative: Bannflüche; Anathemata; Verwünschungen
  rationale: Der Ausgangstext bezeichnet ein wirksames Verfluchen oder Binden, legt aber keine präzise kirchenrechtliche Kategorie fest. „Flüche“ ist verständlich und vermeidet eine konfessionelle Überbestimmung.
- issue: Bedeutung des Lösens
  choice: nicht gelöst werden können
  alternative: nicht aufgehoben oder widerrufen werden können
  rationale: Die wörtlich-bildhafte Formulierung wahrt die Spannung zwischen dem Lösen einer Bindung, dem Aufheben eines Fluchs und möglicher Lossprechung.
- issue: Reichweite von „Heilung“
  choice: Heilung
  alternative: Heil; Abhilfe; Genesung
  rationale: „Heilung“ lässt körperliche, gesellschaftliche und geistliche Wiederherstellung gleichermaßen anklingen, ohne den Vers auf eine einzige theologische Deutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der prophetische Weheruf bleibt knapp und eindringlich; ungewöhnliche Fachwörter werden im Haupttext vermieden und nur als Übersetzungsalternativen in den Fußnoten genannt.
