base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/003.yaml
  text: Do not fear the sinners[a], O righteous ones, for again the Lord will deliver them into your hands[c][b], so that you may execute judgment upon them according to your pleasure.
translation:
  language: de
  text: Fürchtet euch nicht vor den Sündern[a], ihr Gerechten! Denn der Herr wird sie euch wieder in die Hände geben[b], damit ihr an ihnen Gericht vollstreckt, wie ihr wollt[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Habt keine Angst wegen der Sünder.“ Die Präposition እም kann wörtlicher mit „von“ oder „wegen“ wiedergegeben werden; im Deutschen heißt es idiomatisch „sich vor jemandem fürchten“.'
    reason: lexical_alternative
  - marker: b
    text: „In die Hände geben“ ist eine Redewendung für die Übergabe in die Macht oder Verfügungsgewalt eines anderen.
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: „nach eurem Willen“ oder „wie es euch gefällt“. Die Wendung bezeichnet das Handeln entsprechend dem Willen oder Wunsch der Gerechten und schildert die Umkehrung, dass sie Autorität über die Sünder erhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትፍርሁ
  choice: Fürchtet euch nicht
  rationale: Der verneinte Imperativ im Plural richtet eine unmittelbare Ermahnung an die Gerechten; die reflexive deutsche Form ist natürlich und bewahrt den Nachdruck.
- source_word: ጻድቃን
  choice: ihr Gerechten
  rationale: Die substantivierte Pluralform bezeichnet die angesprochene Gruppe. „Ihr Gerechten“ gibt die direkte Anrede in natürlichem, würdigem Deutsch wieder.
- source_word: እምኃጥኣን
  choice: vor den Sündern
  rationale: Die Präposition እም kann Herkunft, Trennung oder Ursache ausdrücken. Beim Verb des Fürchtens entspricht „vor den Sündern“ dem deutschen Sprachgebrauch, ohne den konkreten Gegnerbezug abzuschwächen.
- source_word: ካዕበ
  choice: wieder
  rationale: Das Adverb bezeichnet eine erneute Handlung und passt knapp und natürlich zur angekündigten Umkehrung der Verhältnisse.
- source_word: ያገብኦሙ
  choice: wird sie ... geben
  rationale: Zusammen mit „in eure Hände“ bezeichnet das Verb die Übergabe in die Gewalt oder Verfügung anderer. „Geben“ erhält das Bild, ohne den Vorgang unnötig näher festzulegen.
- source_word: ውስተ እዴክሙ
  choice: euch ... in die Hände
  rationale: Die anschauliche Redewendung bezeichnet die Übergabe in Macht oder Verfügungsgewalt. Die deutsche Form bewahrt sowohl das Bild als auch den Pluralbezug.
- source_word: ከመ ትግበሩ
  choice: damit ihr ... vollstreckt
  rationale: Die Konstruktion bildet einen Zwecksatz. Mit „Gericht“ als Objekt gibt „vollstrecken“ den aktiven Vollzug idiomatischer wieder als ein wörtliches „tun“.
- source_word: ኵነኔ
  choice: Gericht
  rationale: Das Wort gehört in den richterlichen Bereich. „Gericht“ lässt sowohl Urteil als auch dessen strafenden Vollzug anklingen und wahrt so die Bedeutungsbreite.
- source_word: በከመ ፈቀድክሙ
  choice: wie ihr wollt
  rationale: Die Wendung bezeichnet die Übereinstimmung mit Willen oder Wunsch der Gerechten. „Wie ihr wollt“ ist klar und gegenwärtig, ohne die ungewöhnlich weitreichende Aussage abzuschwächen.
theological_decisions:
- issue: Ob die Gerechten selbst am Gericht über die Sünder mitwirken oder lediglich Gottes Rechtfertigung erleben
  choice: Die Gerechten erscheinen als Handelnde, die an den ihnen übergebenen Sündern Gericht vollstrecken.
  alternative: Die Gerechten sind nur Zeugen des von Gott allein vollzogenen Gerichts oder erhalten lediglich Macht über die Sünder.
  rationale: Der Zwecksatz „damit ihr ... Gericht vollstreckt“ und die Übergabe „in die Hände“ sprechen gemeinsam für eine aktive Beteiligung. Die Übersetzung bewahrt diese apokalyptische Spannung und mildert sie nicht zu bloßer passiver Rechtfertigung ab.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, unmittelbar verständlichem Ton. Die direkte Anrede und das Bild von der Übergabe „in die Hände“ bleiben erhalten; „Gericht vollstrecken“ wahrt den richterlich-apokalyptischen Ernst und die aktive Rolle der Gerechten.
