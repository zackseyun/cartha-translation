base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/095/001.yaml
  text: Who will grant me that my eyes might become a cloud of water[a], so that I may weep over you and pour out my tears like a cloud of water[c][b], and find rest from the sorrow of my heart?
translation:
  language: de
  text: Wer gewährt mir, dass meine Augen zu einer Wolke aus Wasser[a] werden, damit ich über euch[b] weine, meine Tränen wie eine Wolke aus Wasser ausgieße und Ruhe finde vom Kummer meines Herzens?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu einer Regenwolke“. Das im Ge’ez zweimal wiederholte Bild kann andeuten, dass die Augen selbst zu einer Wolke voller Tränen werden.'
    reason: lexical_alternative
  - marker: b
    text: Das „euch“ steht in der Mehrzahl und bezieht sich im Zusammenhang wahrscheinlich auf die Sünder beziehungsweise Frevler, denen die umliegenden Weherufe gelten.
    reason: cross_reference
lexical_decisions:
- source_word: መኑ፡ ይሁበኒ
  choice: Wer gewährt mir
  rationale: Die Frage drückt einen klagenden Wunsch aus. „Gewährt mir“ bewahrt sowohl das Geben bzw. Ermöglichen als auch das ausdrücklich markierte Objekt der ersten Person Singular.
- source_word: ለአዕይንትየ፡ ከመ፡ ይኩና
  choice: dass meine Augen … werden
  rationale: Die im Ge’ez vorangestellten „meinen Augen“ werden im Deutschen natürlich in den folgenden Inhaltssatz aufgenommen, ohne den Bezug zu den Augen abzuschwächen.
- source_word: ደመና፡ ማይ
  choice: Wasserwolke
  rationale: Das ungewöhnliche poetische Bild wird sichtbar bewahrt. Das deutsche Kompositum ist verständlicher als „Wolke von Wasser“, ohne die Metapher zu einer bloßen Tränenfülle zu glätten.
- source_word: እብኪ፡ ዲቤክሙ
  choice: über euch weine
  rationale: „Über euch“ lässt den pluralischen Adressaten erkennen und eignet sich für eine Klage, ohne eindeutig zwischen Mitleid, Trauer und Anklage zu entscheiden.
- source_word: እክዐው፡ አንብዐየ
  choice: meine Tränen … ausgieße
  rationale: „Ausgießen“ erhält die Intensität und die aktive Bewegung des Tränenstroms.
- source_word: ከመ፡ ደመና፡ ማይ
  choice: wie eine Wasserwolke
  rationale: Die Wiederholung desselben Bildes wird entsprechend der rhetorischen Gestaltung des Ausgangstextes beibehalten.
- source_word: ወአዕርፍ፡ እምሐዘነ፡ ልብየ
  choice: und Ruhe finde vom Kummer meines Herzens
  rationale: „Ruhe finden“ wahrt das konkrete Ruhebild und lässt zugleich die emotionale Erleichterung anklingen. Die koordinierte Verbfolge wird fortgeführt.
theological_decisions:
- issue: Ob das ungewöhnliche Wolkenbild idiomatisch geglättet werden soll
  choice: Das Bild „Wasserwolke“ bleibt im Haupttext erhalten.
  alternative: „Regenwolke“ oder eine Paraphrase wie „Augen voller Tränen“
  rationale: Der poetisch-apokalyptische Ausdruck soll nicht in gewöhnliche Klagesprache aufgelöst werden; zugleich nennt eine Fußnote die naheliegende idiomatischere Lesart.
- issue: Bezug und Ton von „über euch“
  choice: Die Formulierung bleibt semantisch offen.
  alternative: „um euch“ als eindeutiger Ausdruck des Mitleids oder eine stärker anklagende Wiedergabe
  rationale: Der Präpositionalausdruck bezeichnet die Ausrichtung der Klage, legt aber den theologischen oder emotionalen Charakter nicht vollständig fest.
translation_notes:
  register: Modernes, würdevolles Klage- und Poesieregister. Die auffällige Metapher und ihre Wiederholung bleiben erhalten; der deutsche Satzbau ist dennoch flüssig und bildet die zusammenhängende Folge „weine … ausgieße … Ruhe finde“ ab.
