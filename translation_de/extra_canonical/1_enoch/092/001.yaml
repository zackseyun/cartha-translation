base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/092/001.yaml
  text: The book written by Hanok—[Hanok indeed wrote every sign of wisdom[a], praised among all people and a judge of all the earth]—for all my children who will dwell on the dry land[d][c][b], and for the generations to come who practice righteousness and peace.
translation:
  language: de
  text: Das von Henoch geschriebene Buch — [Henoch nämlich schrieb jedes Zeichen der Weisheit; er war von allen Menschen gepriesen und Richter der ganzen Erde] — für alle meine Kinder, die auf dem trockenen Land wohnen werden,[b] und für die kommenden Generationen, die Gerechtigkeit und Frieden üben.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Wörtlich »auf dem trockenen Land«; manche Übersetzungen geben die Wendung glatter mit »auf der Erde« oder »in der Welt« wieder.
    reason: lexical_alternative
  - marker: c
    text: 'Der Text bei »kommenden Generationen« ist gedrängt und möglicherweise fehlerhaft überliefert. Die vorliegende Fassung versteht den betreffenden Ausdruck zeitlich; bei anderer Lesung wäre auch möglich: »für eine künftige Generation, die Erwählten, die Gerechtigkeit und Frieden üben«.'
    reason: alternative_reading
lexical_decisions:
- source_word: ዘተጽሕፈ፡ እምሄኖክ፡ መጽሐፍ
  choice: Das Buch, von Henoch geschrieben
  rationale: Die knappe, überschriftenartige Form wahrt die passive Aussage und gibt መጽሐፍ natürlich mit »Buch« wieder.
- source_word: ትእምርተ፡ ጥበብ
  choice: jedes Zeichen der Weisheit
  rationale: »Zeichen« bewahrt die konkrete, gehobene Bildsprache; mit »jedes« wird die durch ኵሉ ausgedrückte Gesamtheit aufgenommen.
- source_word: እምኵሉ፡ ሰብእ፡ ስቡሕ
  choice: unter allen Menschen gepriesen
  rationale: Die Wendung bezeichnet Henoch als gepriesen bzw. geehrt und lässt die mögliche Nuance von »unter« beziehungsweise »von allen Menschen« offen genug anklingen.
- source_word: መኰንነ፡ ኵሉ፡ ምድር
  choice: Richter der ganzen Erde
  rationale: መኰንን kann einen Machthaber, Statthalter oder Richter bezeichnen. »Richter« folgt dem unmittelbaren Zeugnis und wahrt den autoritativen Sinn, ohne ihn zu einer allgemeinen Herrschaftsaussage auszuweiten.
- source_word: ለኵሎሙ፡ ውሉድየ
  choice: für alle meine Kinder
  rationale: Die ausdrückliche familiäre Anrede wird ohne unnötige Beschränkung auf männliche Nachkommen wiedergegeben.
- source_word: የኃድሩ፡ ዲበ፡ የብስ
  choice: die auf dem trockenen Land wohnen werden
  rationale: Die konkrete Bedeutung »trockenes Land/Festland« bleibt erhalten, statt sie zu »Erde« oder »Welt« zu glätten; der Relativsatz wird syntaktisch auf »meine Kinder« bezogen.
- source_word: ለትውልድ፡ ይኃርያን
  choice: für die kommenden Generationen
  rationale: Im Licht der festgestellten fehlerhaften bzw. unsicheren Textgestalt wird ይኃርያን nicht zusätzlich als »die Erwählten« übersetzt, sondern die zeitliche Aussage »kommend/später« wiedergegeben.
- source_word: ርተዐ፡ ወሰላመ
  choice: Gerechtigkeit und Frieden
  rationale: Die traditionelle und zugleich verständliche Wortwahl erhält das ethische und religiöse Gewicht des Begriffspaars.
theological_decisions:
- issue: Ob ይኃርያን als Bezeichnung »die Erwählten« verstanden werden soll
  choice: die kommenden Generationen
  alternative: eine künftige Generation, die Erwählten
  rationale: Die überlieferte bzw. transkribierte Form ist unsicher und wurde als Lesefehler für eine zeitliche Bezeichnung beurteilt. Deshalb wird keine Erwählungstheologie in den Vers eingeführt; die alternative Analyse wird in der Fußnote offengelegt.
- issue: Amtsbezeichnung መኰንነ
  choice: Richter
  alternative: Herrscher
  rationale: »Richter« bewahrt die im konsultierten Textzeugnis vertretene gerichtliche Funktion. Da das Wort auch allgemeiner einen Machthaber bezeichnen kann, wird die Alternative in der textkritischen Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit überschriftenartigem Auftakt. Die konkrete Wendung »trockenes Land« und die ungewöhnliche Formulierung »Zeichen der Weisheit« bleiben erhalten. Eckige Klammern kennzeichnen wie in der Vorlage den textlich unsicheren Einschub; die Satzzeichen dienen der Lesbarkeit, ohne die syntaktischen Bezüge umzudeuten.
