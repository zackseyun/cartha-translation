base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/092/002.yaml
  text: Do not let your spirit be grieved because of the times[a], for the Holy and Great One has appointed days for all.
translation:
  language: de
  text: Lasst euren Geist wegen der Zeiten nicht betrübt sein; denn der Heilige und Große hat für alles[a] Tage bestimmt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für alle“ beziehungsweise „für jeden Menschen“. Die weite ge’ezische Formulierung kann sich allgemein auf alles oder auf alle Menschen beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አትሕዝኑ
  choice: Lasst … nicht betrübt sein
  rationale: Der verneinte Imperativ bezeichnet Trauer oder Betrübnis. Zusammen mit „euren Geist“ wahrt diese Formulierung den inneren, affektiven Bezug und klingt im Deutschen zugleich würdig und verständlich.
- source_word: መንፈስክሙ
  choice: euren Geist
  rationale: Das Wort kann Geist, Atem oder innere Verfassung bezeichnen. „Geist“ erhält die anthropologische Weite und den gehobenen Ton, ohne die Aussage auf Gedanken oder Gefühle zu verengen.
- source_word: በአዝማን
  choice: wegen der Zeiten
  rationale: Die Präposition wird hier am natürlichsten kausal verstanden. „Die Zeiten“ bewahrt den apokalyptischen Bezug auf bedrängende geschichtliche Zeitläufe.
- source_word: መዋዕለ
  choice: Tage
  rationale: Das Substantiv bezeichnet wörtlich Tage; die konkrete Wiedergabe lässt zugleich die mögliche Bedeutung festgesetzter Zeitabschnitte anklingen.
- source_word: ወሀበ
  choice: bestimmt
  rationale: Die Grundbedeutung ist „gab“. In Verbindung mit Tagen und göttlicher Ordnung gibt „bestimmt“ den naheliegenden Sinn der Zuteilung oder Festsetzung wieder.
- source_word: ቅዱስ ወዐቢይ
  choice: der Heilige und Große
  rationale: Die beiden Adjektive bilden zusammen eine ehrerbietige Gottesbezeichnung. Die Substantivierung und Großschreibung bewahren diesen Titelcharakter.
- source_word: ለኵሉ
  choice: für alles
  rationale: Die Form ist umfassend und nennt nicht ausdrücklich „Dinge“. „Für alles“ gibt den kosmisch-geschichtlichen Umfang knapp wieder; der mögliche Personenbezug wird in der Fußnote offengehalten.
theological_decisions:
- issue: Reichweite der göttlichen Bestimmung in ለኵሉ
  choice: für alles
  alternative: für alle / für jeden Menschen
  rationale: Der Trost über bedrängende Zeiten wird mit Gottes ordnendem Handeln begründet. Die breite sachliche Wiedergabe erhält den kosmisch-geschichtlichen Sinn, ohne die ebenfalls mögliche Beziehung auf alle Menschen zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem apokalyptischem Ton. Die ungewöhnliche Verbindung „euren Geist … betrübt“ bleibt nahe an der inneren Ausrichtung des Ausgangstextes; die Schlussformulierung wird nicht konfessionell oder systematisch eingeengt.
