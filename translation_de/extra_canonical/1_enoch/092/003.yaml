base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/092/003.yaml
  text: And the righteous one shall rise from sleep[a], and he shall arise and walk in the path of righteousness[d][c][b]; and all his path and his course shall be in goodness and in everlasting kindness.
translation:
  language: de
  text: Und der Gerechte wird sich aus dem Schlaf erheben[a], wird aufstehen und auf dem Pfad der Gerechtigkeit gehen; und sein ganzer Weg und sein Wandel werden in Güte und ewiger Gnade verlaufen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Aus dem Schlaf“ kann wirklichen Schlaf bezeichnen oder bildlich für das Erwachen zu erneuertem Leben stehen; der Vers selbst legt keine dieser Deutungen eindeutig fest.
    reason: lexical_alternative
  - marker: b
    text: Das hier mit „Gnade“ wiedergegebene Wort kann auch „Erbarmen“, „Milde“ oder „wohlwollende Zuwendung“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ጻድቅ
  choice: der Gerechte
  rationale: Der Singular wird bewahrt. Die Form bezeichnet hier eine einzelne gerechte Person, ohne sie ausdrücklich messianisch oder kollektiv zu deuten.
- source_word: ይትነሣእ ... ይትነሣእ
  choice: wird sich ... erheben, wird aufstehen
  rationale: Die Wiederholung des Verbs wird im Deutschen durch zwei nahe verwandte Ausdrücke wiedergegeben. Vor dem zweiten Verb steht in der überlieferten Form kein Bindewort; daher bleibt auch die deutsche Fassung asyndetisch.
- source_word: እምንዋም
  choice: aus dem Schlaf
  rationale: እም bezeichnet den Ausgangspunkt, ንዋም Schlaf oder Schlummer. Die natürliche deutsche Wendung bewahrt das Bild, ohne es ausdrücklich als Auferstehung oder nur als geistliches Erwachen festzulegen.
- source_word: የኃልፍ
  choice: gehen
  rationale: Das Verb kann vorübergehen, weitergehen oder fortschreiten bedeuten. Zusammen mit dem Pfadbild gibt „gehen“ die Bewegung klar und idiomatisch wieder.
- source_word: በፍኖተ ጽድቅ
  choice: auf dem Pfad der Gerechtigkeit
  rationale: Das Wegbild und der Bezug auf Gerechtigkeit bleiben ausdrücklich erhalten. „Pfad“ ist würdevoll, aber im heutigen Standarddeutsch verständlich.
- source_word: ኵሉ ፍኖቱ
  choice: sein ganzer Weg
  rationale: Die Singularform und der umfassende Sinn von ኵሉ werden eng am Wortlaut wiedergegeben.
- source_word: ምሕዋሩ
  choice: sein Wandel
  rationale: Das Wort bezeichnet Gang, Verlauf oder Lebensführung. „Wandel“ verbindet das Bewegungsbild mit der möglichen ethischen Bedeutung, ohne diese auf eine bloße Charakterbeschreibung zu verengen.
- source_word: በኂሩት
  choice: in Güte
  rationale: Der Ausdruck bezeichnet Güte oder Wohltätigkeit. Die breite Wiedergabe „Güte“ vermeidet eine unnötige Einengung.
- source_word: በሣህል ዘለዓለም
  choice: in ewiger Gnade
  rationale: ሣህል kann Gnade, Erbarmen, Milde oder wohlwollende Zuwendung bezeichnen. „Gnade“ ist natürlich und weit genug, während die Fußnote die Bedeutungsbreite offenlegt; ዘለዓለም wird mit „ewig“ wiedergegeben.
theological_decisions:
- issue: Bezeichnet das Aufstehen aus dem Schlaf ausdrücklich die Auferstehung von den Toten oder ein anderes Erwachen?
  choice: Das Bild „sich aus dem Schlaf erheben“ bleibt ohne erklärenden Zusatz stehen.
  alternative: Ausdrückliche Wiedergabe als leibliche Auferstehung oder als moralisch-geistliches Erwachen.
  rationale: Der ge’ezische Wortlaut nennt Schlaf und Aufstehen, aber weder Tod noch eine ausdrückliche Auferstehungsformel. Daher soll die mögliche theologische Spannung nicht aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die asyndetische Wiederholung „wird sich ... erheben, wird aufstehen“ bildet die auffällige Wiederholung der Quelle nach. „Wandel“ erhält sowohl das Wegmotiv als auch den möglichen Bezug auf die Lebensführung.
