base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/096/003.yaml
  text: But you[a], do not fear—you who have suffered—for healing will come to you, and a bright light will shine for you[b], and you will hear the voice of rest from heaven.
translation:
  language: de
  text: Ihr aber fürchtet euch nicht, die ihr gelitten habt[a]; denn Heilung wird euch zuteilwerden, und ein helles Licht wird für euch leuchten, und ihr werdet vom Himmel die Stimme der Ruhe hören[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die ihr in Bedrängnis seid“. Der geʿezische Ausdruck kann Leiden, Schmerz oder Bedrängnis allgemein bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Stimme/das Wort der Ruhe“. Die Formulierung bleibt eng am Geʿez und wird nicht als „Frieden“ oder „Trost“ umschrieben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትፍርሁ
  choice: fürchtet euch nicht
  rationale: Der negative Imperativ im Plural wird direkt und in einem würdigen, zugleich geläufigen Deutsch wiedergegeben.
- source_word: እለ ሐመምክሙ
  choice: die ihr gelitten habt
  rationale: Die Form bezeichnet die Angeredeten als von Leiden oder Bedrängnis Betroffene, ohne das Leiden auf körperliche Schmerzen einzuengen.
- source_word: ፈውስ
  choice: Heilung
  rationale: „Heilung“ bewahrt sowohl die körperliche als auch die umfassendere Bedeutung von Wiederherstellung.
- source_word: ይከውነክሙ
  choice: wird euch zuteilwerden
  rationale: Das breite Verb des Werdens oder Seins wird in Verbindung mit „Heilung“ idiomatisch wiedergegeben, ohne die Verheißung näher auszudeuten.
- source_word: ብርሃነ ብሩህ
  choice: ein helles Licht
  rationale: Die verstärkte Lichtmetaphorik bleibt in natürlichem Deutsch erhalten.
- source_word: ያበርህ ለክሙ
  choice: wird für euch leuchten
  rationale: Die persönliche Zielrichtung der Verheißung und das Bild des Leuchtens werden eng am Ausgangstext bewahrt.
- source_word: ቃለ ዕረፍት
  choice: die Stimme der Ruhe
  rationale: Die konkrete Hörmetapher und die Grundbedeutung „Ruhe“ bleiben erhalten; „Frieden“ oder „Trost“ wären stärker deutend.
- source_word: እምሰማይ
  choice: vom Himmel
  rationale: Dies ist die natürliche deutsche Wiedergabe der Herkunftsangabe und wahrt den Offenbarungscharakter.
theological_decisions:
- issue: Ob ቃለ ዕረፍት mit einem stärker deutenden theologischen Ausdruck wiederzugeben ist
  choice: die Stimme der Ruhe
  alternative: die Stimme des Friedens; das Wort des Trostes
  rationale: Der ge'ezische Wortlaut verweist zunächst auf Ruhe oder Rast. Diese ungewöhnliche Wendung wird bewahrt, statt sie an vertrautere religiöse Formulierungen anzugleichen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede und bewahrter apokalyptischer Bildsprache. Ungewöhnliche, aber sinntragende Wendungen des Ausgangstextes werden nicht unnötig geglättet.
