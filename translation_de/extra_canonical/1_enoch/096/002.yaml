base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/096/002.yaml
  text: And on the day of the judgment of sinners[a], your children will rise up and be lifted up like eagles, and your nest will be higher than the vultures. You will go up and enter the clefts of the earth and the fissures of the rock forever, like coneys before the lawless[f][e][d][c][b]; and the sirens will groan over you and weep.
translation:
  language: de
  text: Und am Tag der Bedrängnis[a] der Sünder werden eure Kinder sich erheben und emporgehoben werden wie Adler; höher als die Geier wird euer Zufluchtsort sein[b]. Ihr werdet hinaufsteigen und für immer in die Spalten der Erde und die Klüfte des Felsens hineingehen, wie Klippdachse[c] auf der Flucht vor den Gesetzlosen. Und die Sirenen[d] werden über euch stöhnen und weinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Wort kann auch „Not“, „Heimsuchung“ oder „Strafe“ bedeuten; der Zusammenhang verleiht der Bedrängnis gerichtliche Züge.
    reason: lexical_alternative
  - marker: b
    text: Der äthiopische Wortlaut dieses Satzteils ist schwierig. Statt „Zufluchtsort“ ist auch „schattige Behausung“ oder, im fortgeführten Vogelbild, „Nest“ möglich.
    reason: textual_variant
  - marker: c
    text: Klippdachse, auch Schliefer genannt, sind kleine, in felsigen Verstecken lebende Tiere. Ältere Übersetzungen verwenden mitunter die Bezeichnung „Klippschliefer“ oder „Schliefer“.
    reason: cultural_note
  - marker: d
    text: Gemeint sind nicht moderne Warnanlagen, sondern die aus der antiken Überlieferung bekannten Sirenen, hier als klagende Wesen der Einöde.
    reason: cultural_note
lexical_decisions:
- source_word: ምንዳቤሆሙ
  choice: Bedrängnis der Sünder
  rationale: Das Substantiv bezeichnet Bedrängnis, Trübsal oder strafendes Leid. „Bedrängnis“ wahrt sowohl die erlebte Not als auch den gerichtlichen Unterton, ohne den Ausdruck eindeutig auf ein formelles Gericht festzulegen.
- source_word: ይትሌዐሉ / ይትነሥኡ
  choice: sich erheben und emporgehoben werden
  rationale: Die beiden Verben bleiben als parallele, aber unterscheidbare Aussagen erhalten; so wird die emphatische Erhöhung nicht zu einem einzigen Verb verkürzt.
- source_word: አንስርት
  choice: Adler
  rationale: Die übliche Bedeutung und das Bild majestätischer Erhöhung werden bewahrt.
- source_word: እጐለ ዚአክሙ
  choice: eure Kinder
  rationale: Die Wendung bezeichnet die Nachkommenschaft der angeredeten Gemeinschaft. „Kinder“ ist natürlich und erhält das familiäre Bild.
- source_word: ምጽላልክሙ
  choice: euer Zufluchtsort
  rationale: Die schwierige Form kann einen schattigen Schutzplatz oder eine Behausung bezeichnen. „Zufluchtsort“ ist im Zusammenhang verständlich, ohne die unsichere Deutung als wörtliches Nest festzuschreiben.
- source_word: ንደብታተ ምድር / ንቅዓታተ ኰኵሕ
  choice: die Spalten der Erde / die Klüfte des Felsens
  rationale: Die parallelen Ausdrücke bezeichnen gespaltene oder offene Stellen im Boden und Fels und werden bildhaft, aber verständlich wiedergegeben.
- source_word: ጊሔ
  choice: Klippdachse
  rationale: Der traditionell als „Kaninchen“ oder „Schliefer“ wiedergegebene Felsbewohner ist zoologisch am ehesten als Klippdachs zu verstehen.
- source_word: እምቅድመ ዓማፅያን
  choice: auf der Flucht vor den Gesetzlosen
  rationale: እምቅድመ bedeutet wörtlich „von vor/aus der Gegenwart von“. Im Bild des Verbergens in Felsspalten bringt „auf der Flucht vor“ diese Bewegungsrichtung im Deutschen klar zum Ausdruck.
- source_word: ጼደናት
  choice: Sirenen
  rationale: Das Wort ist als Lehnwort für Sirenen belegt und bezeichnet hier klagende Wesen der Einöde; es ist nicht von dem Wortstamm für „gerecht“ abzuleiten.
theological_decisions:
- issue: Bezeichnet ምንዳቤሆሙ ausdrücklich das Gericht über die Sünder?
  choice: Bedrängnis der Sünder
  alternative: Gericht über die Sünder
  rationale: Der Kontext hat gerichtliche Züge, doch das Wort selbst kann Bedrängnis oder strafendes Leid bezeichnen. Die Übersetzung wahrt diese Spannung, statt das formelle Gericht ausdrücklich in den Haupttext einzutragen.
- issue: Wer wird in der zweiten Person Plural angeredet?
  choice: Die Anrede wird als Zuspruch an eine den Sündern gegenübergestellte Gemeinschaft beibehalten.
  alternative: Eine allgemeinere oder wegen der schwierigen mittleren Satzteile unbestimmte Bezugsgruppe
  rationale: Der unmittelbare Zusammenhang stellt Sünder und Angeredete einander gegenüber. Die Übersetzung lässt diese literarische Gegenüberstellung stehen, ohne die Gruppe mit einer späteren konfessionellen Kategorie gleichzusetzen.
- issue: Wie ist das Weinen der Sirenen über den Angeredeten theologisch zu deuten?
  choice: Die auffällige Aussage wird ohne Harmonisierung wiedergegeben.
  alternative: Das Weinen als Klage über die Gesetzlosen oder als Jubel über die Geretteten umdeuten
  rationale: Der überlieferte Text lässt eine Spannung zwischen der Erhöhung der Angeredeten und der anschließenden Klage über sie bestehen. Diese wird nicht stillschweigend aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die apokalyptischen Bilder und die parallelen Bewegungsverben bleiben erhalten. Ungewohnte Tier- und Wesenbezeichnungen werden knapp erläutert; textliche und lexikalische Unsicherheiten werden nicht im Haupttext geglättet.
