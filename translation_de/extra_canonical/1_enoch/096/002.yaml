  source_fidelity: 'Die Übersetzung gibt den ge''ezischen Satzbau und die zentralen Bilder im Wesentlichen zutreffend wieder: Bedrängnis der Sünder, die doppelte Erhebung der Kinder, Adler, felsige Verstecke, Flucht vor den Gesetzlosen und die Sirenen. „Auf der Flucht vor“ bildet እምቅድመ idiomatisch und semantisch angemessen ab. Der Vergleich des Zufluchtsorts mit den Geiern benötigt jedoch eine grammatisch und semantisch klare Formulierung.'
