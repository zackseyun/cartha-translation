  to: Und am Tag der Bedrängnis[a] der Sünder werden eure Kinder sich erheben und emporgehoben werden wie Adler; höher als die Geier wird euer Zufluchtsort sein[b]. Ihr werdet hinaufsteigen und für immer in die Spalten der Erde und die Klüfte des Felsens hineingehen, wie Klippdachse[c] auf der Flucht vor den Gesetzlosen. Und die Sirenen[d] werden über euch stöhnen und weinen.
  rationale: Die Revision beschränkt sich auf eine notwendige grammatische Klärung des Vergleichs mit den Geiern, die korrekte Platzierung des lexikalischen Fußnotenankers und eine sachlichere Tiererläuterung. Die textkritische Unsicherheit von ምጽላልክሙ bleibt im Haupttext zurückhaltend als „Zufluchtsort“ und in Fußnote b sichtbar. Die überlieferte Spannung der abschließenden Klage der Sirenen wird nicht harmonisiert.
