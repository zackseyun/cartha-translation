  terminology: „Klippdachse“ ist als moderne Bezeichnung angemessen; die Erläuterung sollte nicht „Kaninchen“ als bloße ältere Übersetzung ausgeben, da dies zoologisch irreführend ist. „Sirenen“ ist für ጼደናት richtig und die kulturelle Erläuterung hilfreich. „Gesetzlose“ bewahrt den moralisch-juristischen Registerwert von ዓማፅያን.
