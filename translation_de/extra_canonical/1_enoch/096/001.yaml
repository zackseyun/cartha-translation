base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/096/001.yaml
  text: Hope[a], you righteous, for the sinners will swiftly be destroyed from before you, and authority over them will be yours[c][b], according to your desire.
translation:
  language: de
  text: Hofft[a], ihr Gerechten! Denn die Sünder werden rasch vor euch hinweg vernichtet werden[b], und die Herrschaft über sie wird euch gehören[c], so wie ihr es gewünscht habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Seid voller Hoffnung, ihr Gerechten!“ Der Imperativ richtet sich unmittelbar an die Gerechten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „von vor euch“. Das räumliche Bild stellt dar, wie die Sünder aus der Gegenwart der Gerechten entfernt werden.'
    reason: lexical_alternative
  - marker: c
    text: 'Die „Herrschaft über sie“ bezeichnet eine apokalyptische Umkehrung: Die Gerechten erhalten Gewalt über diejenigen, die nun gerichtet werden. Wie diese Herrschaft ausgeübt wird, bleibt offen.'
    reason: cultural_note
lexical_decisions:
- source_word: ተስፈዉ
  choice: Hofft
  rationale: Der pluralische Imperativ fordert die Gerechten unmittelbar zum Hoffen beziehungsweise Vertrauen auf und bewahrt die knappe, eindringliche Form des Ausgangstextes.
- source_word: ጻድቃን
  choice: ihr Gerechten
  rationale: Die Anredeform ergibt sich aus dem Imperativ und dem weiteren Gebrauch der zweiten Person Plural; „ihr Gerechten“ klingt im Deutschen unmittelbar und würdevoll.
- source_word: ፍጡነ
  choice: rasch
  rationale: Das Adverb bezeichnet die schnelle Vollstreckung des Gerichts. „Rasch“ wahrt den gehobenen Ton, ohne wie „bald“ ausschließlich den Zeitpunkt zu bezeichnen.
- source_word: ይትሀጐሉ
  choice: werden vernichtet werden
  rationale: Die passive beziehungsweise medial-passive Form bezeichnet in diesem Gerichtszusammenhang Untergang oder Vernichtung, ohne die Art der Vollstreckung näher festzulegen.
- source_word: ኃጥኣን
  choice: die Sünder
  rationale: Das substantivische Pluralwort bezeichnet die im vorliegenden Gegensatz zu den Gerechten stehende Gruppe.
- source_word: እምቅድሜክሙ
  choice: vor euch hinweg
  rationale: Die Formulierung erhält das räumliche Bild, nach dem die Sünder aus dem Bereich vor den Gerechten entfernt werden, und ist im Deutschen natürlicher als das streng wörtliche „von vor euch“.
- source_word: ሥልጣን
  choice: Herrschaft
  rationale: Das Wort bezeichnet verliehene oder ausgeübte Autorität und Regierungsgewalt. „Herrschaft“ passt zur folgenden Bestimmung „über sie“ und bewahrt die apokalyptische Umkehrung der Machtverhältnisse.
- source_word: ይከውን ለክሙ ዲቤሆሙ
  choice: die Herrschaft über sie wird euch gehören
  rationale: Die Konstruktion drückt Besitz beziehungsweise Ausübung von Herrschaft über die Gerichteten aus. Diese Wiedergabe erhält beides, ohne ausdrücklich ein im Ausgangstext nicht genanntes Verleihen einzufügen.
- source_word: በከመ ፈቀድክሙ
  choice: so, wie ihr es gewünscht habt
  rationale: Die Wendung beschreibt die Übereinstimmung mit dem Wunsch oder Willen der Gerechten. Das Perfekt gibt die vorliegende Verbform wieder und vermeidet eine Abschwächung zu bloß gegenwärtigem Belieben.
theological_decisions:
- issue: Künftiges Verhältnis der Gerechten zu den Sündern
  choice: Den Gerechten wird wirkliche Herrschaft über die gerichteten Sünder zugesprochen.
  alternative: Die Aussage lediglich als moralischen Sieg oder öffentliche Rechtfertigung der Gerechten wiederzugeben.
  rationale: Das ausdrückliche Wort ሥልጣን zusammen mit „über sie“ bezeichnet mehr als Trost oder Anerkennung. Die Übersetzung erhält diese apokalyptische Umkehrung, legt aber nicht fest, in welcher Weise die Herrschaft ausgeübt wird.
- issue: Bezug des Wunsches der Gerechten
  choice: „So, wie ihr es gewünscht habt“ bleibt eng an die unmittelbar vorausgehende Aussage von ihrer Herrschaft gebunden.
  alternative: Den Wunsch ausdrücklich auf die Vernichtung der Sünder oder auf das gesamte verheißene Geschehen zu beziehen.
  rationale: Die Syntax lässt den genauen Umfang des Schlussglieds nicht völlig eindeutig erkennen. Die Übersetzung vermeidet eine erklärende Ergänzung und bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede und knappem apokalyptischem Ton. Das ungewöhnliche räumliche Bild und die Aussage wirklicher Herrschaft werden verständlich wiedergegeben, ohne ihre theologische Spannung zu glätten.
