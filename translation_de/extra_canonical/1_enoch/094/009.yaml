base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/009.yaml
  text: You have committed reproach and violence[a], and you have made yourselves ready for the day of the shedding of blood, and for the day of darkness[c][b], and for the day of the great judgment.
translation:
  language: de
  text: Ihr habt Schmähung und Gewalttat verübt[a] und euch bereit gemacht für den Tag des Blutvergießens[b], für den Tag der Finsternis und für den Tag des großen Gerichts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „Ihr habt Schmähung und Gewalt getan.“ Das Objektsuffix des Verbs nimmt wahrscheinlich die folgenden Objekte vorweg; daher ist nicht „ihr habt es zur Schmähung und zur Gewalt bereitet“ gemeint.'
    reason: grammatical_alternative
  - marker: b
    text: 'Oder: „des Vergießens von Blut“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ገበርክምዋ፡ ለጽርፈት፡ ወለዓመፃ
  choice: Ihr habt Schmähung und Gewalttat verübt
  rationale: Das Verb ገበረ bezeichnet Tun oder Verüben; das feminine Objektsuffix kann proleptisch auf die mit ለ markierten Objekte vorausweisen. Daher wird ለ hier nicht als Zweckangabe verstanden. „Schmähung“ bewahrt den aktiven Sinn von Beschimpfung oder Verunglimpfung, „Gewalttat“ den von gewaltsamem Unrecht.
- source_word: ወድልዋነ፡ ኮንክሙ
  choice: und euch bereit gemacht
  rationale: Die Verbindung drückt aus, dass die Angesprochenen bereit oder zugerüstet geworden sind. Die reflexive deutsche Form ist natürlich und erhält ihre aktive Verantwortlichkeit.
- source_word: ለዕለተ፡ ክዕወት፡ ደም
  choice: für den Tag des Blutvergießens
  rationale: Die Wendung bezeichnet das Vergießen von Blut. „Blutvergießen“ folgt der Handlungsvorstellung und passt zum feierlich-apokalyptischen Register.
- source_word: ወለዕለተ፡ ጽልመት
  choice: für den Tag der Finsternis
  rationale: „Finsternis“ gibt den substantivischen Ausdruck wieder und bewahrt die wiederholte Formel „Tag des/der …“.
- source_word: ወለዕለተ፡ ኵነኔ፡ ዐቢይ
  choice: für den Tag des großen Gerichts
  rationale: ኵነኔ kann Gericht, Urteil oder Verurteilung bezeichnen. „Großes Gericht“ hält die gerichtliche Bedeutung offen, ohne sie auf den Schuldspruch allein zu verengen.
theological_decisions:
- issue: Historische Katastrophe oder endzeitliches Gericht
  choice: Die dreifache Tagesformel wird als apokalyptische Gerichtsankündigung bewahrt.
  alternative: Eine allgemeine Aussage über geschichtliche Not und Bestrafung.
  rationale: Die Abfolge von Blutvergießen, Finsternis und großem Gericht trägt deutlich apokalyptischen Charakter; die Übersetzung bewahrt diese Bildsprache, ohne den Zeitpunkt genauer festzulegen.
- issue: Bedeutungsumfang von ኵነኔ
  choice: Gericht
  alternative: Verurteilung oder Urteil
  rationale: „Gericht“ wahrt den umfassenderen und theologisch weniger vorentscheidenden Sinn; die engeren Möglichkeiten werden in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit beibehaltener apokalyptischer Wiederholung. „Gewalttat“ ist konkreter als das abstrakte „Gewalt“ und lässt sich idiomatisch mit „verüben“ verbinden. Alle Fußnotenmarker stehen im Haupttext.
