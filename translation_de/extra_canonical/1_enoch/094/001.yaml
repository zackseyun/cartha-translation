base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/001.yaml
  text: 'And now I say to you[a], my children: love righteousness and walk in it; for the paths of righteousness are worthy and acceptable[c][b], but the paths of iniquity will quickly be destroyed and vanish.'
translation:
  language: de
  text: 'Und nun sage ich euch, meine Kinder: Liebt die Gerechtigkeit und lebt nach ihr; denn die Pfade der Gerechtigkeit sind angemessen und anerkannt[a], doch die Pfade des Unrechts[b] werden schnell zugrunde gehen und verschwinden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die beiden zugrunde liegenden Wörter sind nicht ganz eindeutig; möglich ist auch: »würdig und anerkannt« oder »angemessen und angenommen«.'
    reason: lexical_alternative
  - marker: b
    text: Das Wort kann auch »Ungerechtigkeit«, »Frevel« oder, je nach Zusammenhang, gewaltsames Unrecht bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: እብለክሙ
  choice: sage ich euch
  rationale: Bewahrt die direkte väterliche Anrede und gibt die schlichte Redeeinleitung natürlich wieder.
- source_word: ደቂቅየ
  choice: meine Kinder
  rationale: Erhält den familiären Lehrton, ohne den angesprochenen Kreis unnötig auf männliche Nachkommen zu beschränken.
- source_word: አፍቅርዋ ለጽድቅ
  choice: Liebt die Gerechtigkeit
  rationale: „Gerechtigkeit“ umfasst hier die breite ethisch-religiöse Bedeutung von ጽድቅ und klingt im modernen Deutschen natürlicher als „Rechtschaffenheit“.
- source_word: ወባቲ ሖሩ
  choice: und lebt nach ihr
  rationale: Gibt den ethischen Wandel idiomatisch wieder. Das folgende Bild der „Pfade“ bewahrt zugleich die Wegmetaphorik des Verses.
- source_word: ፍኖዋተ ጽድቅ
  choice: die Pfade der Gerechtigkeit
  rationale: Bewahrt das konkrete Bild moralischer Wege und den Parallelismus zum Gegenbegriff.
- source_word: ይደሉ ወይትወከፍ
  choice: sind würdig und wohlgefällig
  rationale: Erhält beide wertenden Prädikate. „Wohlgefällig“ bringt den Gedanken des Angenommenseins zum Ausdruck, ohne ausdrücklich festzulegen, wem die Pfade gefallen.
- source_word: ፍኖዋተ ዓመፃ
  choice: die Pfade des Unrechts
  rationale: ዓመፃ bezeichnet hier als Gegenbegriff zu ጽድቅ am ehesten Unrecht oder Frevel. „Unrecht“ erhält die breite moralische Bedeutung und vermeidet eine Verengung auf Gewalt.
- source_word: ፍጡነ
  choice: schnell
  rationale: Gibt die zeitliche Dringlichkeit schlicht und unmittelbar wieder.
- source_word: ይትሐጐላ ወየሐፅፃ
  choice: werden zugrunde gehen und verschwinden
  rationale: Bewahrt die doppelte Aussage von Vernichtung und anschließendem Verschwinden.
theological_decisions:
- issue: Bedeutungsumfang von ጽድቅ
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: Der Ausdruck bezeichnet eine umfassende rechte Lebenshaltung, nicht nur Rechtsprechung oder soziale Fairness. „Gerechtigkeit“ wahrt diese biblisch-ethische Weite.
- issue: Bedeutung von ዓመፃ als Gegenbegriff zu ጽድቅ
  choice: Unrecht
  alternative: Gewalt; Ungerechtigkeit; Frevel
  rationale: Der unmittelbare Gegensatz zur Gerechtigkeit spricht für den umfassenden moralischen Begriff „Unrecht“. Eine mögliche Nuance von Gewalt oder Auflehnung bleibt in der Fußnote sichtbar.
- issue: Evaluatives Prädikat ይትወከፍ
  choice: wohlgefällig
  alternative: annehmbar; angenommen
  rationale: Die Form kann ein Angenommen- oder Gebilligtwerden bezeichnen. „Wohlgefällig“ bewahrt die wertende Aussage, ohne den nicht genannten Beurteiler ausdrücklich zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Weisheitsmahnung. „Lebt nach ihr“ vermeidet das im Deutschen missverständliche „wandelt darin“, während „Pfade“ die Wegmetaphorik ausdrücklich fortführt.
