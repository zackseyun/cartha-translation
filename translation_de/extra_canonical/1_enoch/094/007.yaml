base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/007.yaml
  text: Woe to those who build their houses by sin, for they will be torn down from all their foundations; [and they will fall by the sword;] and those who acquire gold and silver will quickly be destroyed in judgment.
translation:
  language: de
  text: Wehe denen, die ihre Häuser durch Sünde bauen! Denn sie werden von all ihren Fundamenten weggerissen; [und durch das Schwert werden sie fallen][a]. Und diejenigen, die Gold und Silber erwerben, werden im Gericht[b] rasch zugrunde gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „und durch das Schwert werden sie fallen“ stehen in der vorgelegten Ausgangsedition in eckigen Klammern und sind daher textkritisch unsicher.
    reason: Kennzeichnet offen den unsicheren Überlieferungsstatus der Klausel.
  - marker: b
    text: 'Oder: „Und diejenigen, die Gold und Silber durch Gewalt (oder: Unrecht) erwerben, werden rasch zugrunde gehen.“'
    reason: Bewahrt die mögliche alternative Zuordnung und Bedeutung von በጽነኔ.
lexical_decisions:
- source_word: በኃጢአት
  choice: durch Sünde
  rationale: Die Präposition በ- kann Mittel oder Begleitumstand bezeichnen. „Durch Sünde“ gibt hier die instrumentale Aussage prägnant wieder, ohne den Satz auf bloß sündhaftes Verhalten abzuschwächen.
- source_word: ይትነሠቱ
  choice: werden … weggerissen
  rationale: Die Form beschreibt hier die gewaltsame Beseitigung vom Fundament her. „Weggerissen“ bewahrt dieses Bild besser als das allgemeinere „zerstört“.
- source_word: በጽነኔ
  choice: im Gericht
  rationale: Die überlieferte englische Konsultationsfassung versteht die Wendung gerichtlich. Da Stellung und Bedeutungsbreite auch eine Verbindung mit dem Erwerb zulassen, wird die Ambiguität in einer Fußnote offengelegt.
- source_word: ፍጡነ ይትሐጐሉ
  choice: wird … rasch zugrunde gehen
  rationale: „Rasch“ entspricht dem Adverb, während „zugrunde gehen“ die Vernichtung natürlich und würdig ausdrückt.
theological_decisions:
- issue: Bezug von በጽነኔ
  choice: „im Gericht“ auf das Zugrundegehen bezogen
  alternative: „durch Gewalt/Unrecht“ auf den Erwerb von Gold und Silber bezogen
  rationale: Die Syntax lässt den Bezug offen. Der Haupttext folgt der gerichtlichen Lesart der geprüften Konsultationsschicht; die alternative, ethisch zugespitzte Lesart wird nicht verschwiegen.
- issue: Textstatus der Schwertklausel
  choice: Klausel im Haupttext in eckigen Klammern beibehalten
  alternative: Klausel ohne Kennzeichnung aufnehmen oder auslassen
  rationale: Die vorgelegte Ausgangsedition kennzeichnet die Worte als textkritisch unsicher. Diese Unsicherheit darf nicht stillschweigend beseitigt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Weheruf bleibt knapp und eindringlich; das Fundamentbild und die textkritische Unsicherheit werden erhalten. Der Wechsel vom pluralischen Relativsatz zum generischen Singular „wer“ sorgt im Deutschen für einen natürlichen Satzbau, ohne den Sinn einzuschränken.
