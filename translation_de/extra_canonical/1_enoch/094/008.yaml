base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/008.yaml
  text: Woe to you[a], rich ones, for you have trusted in your riches, and from your riches you will depart[b], because you did not remember the Most High in the days of your riches.
translation:
  language: de
  text: Wehe euch, ihr Reichen! Denn ihr habt auf euren Reichtum vertraut, und von eurem Reichtum werdet ihr scheiden[a], weil ihr in den Tagen eures Reichtums nicht an den Höchsten gedacht habt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „von eurem Reichtum werdet ihr hinausgehen/fortgehen“. Gemeint sein kann, dass ihnen der Reichtum genommen wird oder dass sie ihn im Gericht zurücklassen müssen.'
    reason: Die räumliche Formulierung des Ge’ez ist im Deutschen ungewöhnlich und lässt die genaue Art der Trennung offen.
lexical_decisions:
- source_word: አሌ፡ ለክሙ፡ አብዕልት
  choice: Wehe euch, ihr Reichen!
  rationale: Die Formulierung bewahrt die direkte Anrede und den Charakter eines prophetischen Weherufs; „ihr Reichen“ klingt im modernen Deutschen natürlicher als „Reiche“ als bloßer Vokativ.
- source_word: ብዕልክሙ
  choice: euren Reichtum
  rationale: „Reichtum“ gibt die Bedeutung präzise wieder und wird an allen drei Stellen wiederholt, damit die rhetorische Prägung des Ausgangstextes erhalten bleibt.
- source_word: ተወከልክሙ
  choice: ihr habt ... vertraut
  rationale: Die Wendung bezeichnet Vertrauen beziehungsweise Sichverlassen auf etwas und erhält so den Vorwurf fehlgeleiteten Vertrauens.
- source_word: እምነ፡ ብዕልክሙ፡ ትወፅኡ
  choice: von eurem Reichtum werdet ihr scheiden
  rationale: „Scheiden“ bewahrt das Bild einer Trennung oder eines Fortgehens, ohne eindeutig festzulegen, ob Tod, Enteignung oder eine andere Form des Gerichts gemeint ist.
- source_word: ለልዑል
  choice: den Höchsten
  rationale: Dies ist die etablierte deutsche Wiedergabe des göttlichen Titels und passt syntaktisch zur Wendung „an den Höchsten denken“.
- source_word: ኢተዘከርክምዎ
  choice: nicht an ... gedacht habt
  rationale: Die natürliche deutsche Formulierung gibt das Erinnern oder Bedenken wieder, ohne dem Verb eine speziellere kultische Bedeutung beizulegen.
- source_word: በመዋዕለ፡ ብዕልክሙ
  choice: in den Tagen eures Reichtums
  rationale: Die zeitliche Wendung und die erneute Nennung des Reichtums bleiben eng am Ausgangstext erhalten.
theological_decisions:
- issue: Bedeutung des Fortgehens vom Reichtum
  choice: Das Bild der Trennung vom Reichtum bleibt mit „von eurem Reichtum werdet ihr scheiden“ offen.
  alternative: „Ihr werdet sterben und euren Reichtum zurücklassen“ oder „euer Reichtum wird euch genommen werden“.
  rationale: Der ge’ezische Wortlaut benennt die genaue Art des Gerichts nicht. Die Übersetzung legt daher weder Tod noch Enteignung ausdrücklich fest.
translation_notes:
  register: Moderner, würdevoller Mahn- und Gerichtston. Die dreifache Wiederholung von „Reichtum“ ist bewusst beibehalten; das etwas feierliche „scheiden“ dient dazu, die Mehrdeutigkeit der knappen Ausgangsformulierung zu erhalten.
