  naturalness: Der Text ist modernes, verständliches Standarddeutsch in angemessen würdigem Mahn- und Gerichtston. „Von etwas scheiden“ ist leicht gehoben, aber idiomatisch und für den prophetischen Register passend; es ist hier der sachlichste Weg, die räumlich formulierte, im Deutschen sonst ungewohnte Wendung wiederzugeben.
