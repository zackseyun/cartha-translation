base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/004.yaml
  text: But seek and choose for yourselves righteousness and a good life[a], and walk in the paths of peace[c][b], so that you may live and prosper.
translation:
  language: de
  text: Doch strebt[a] nach Gerechtigkeit und entscheidet euch für ein gutes Leben[b]. Geht auf den Pfaden des Friedens[c], damit ihr lebt und gedeiht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sucht“ beziehungsweise „begehrt“. Die überlieferte Anfangsform ist textlich unsicher und wird hier als adversatives „doch“ verstanden; das folgende Verb ist eine Aufforderung zum Streben oder Suchen.'
    reason: textual_variant
  - marker: b
    text: Die äthiopische Wortfolge kann auch im Sinn von „ein Leben in Güte“ verstanden werden.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „auf den Wegen des Friedens“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እላ
  choice: doch
  rationale: Die Form wird entsprechend der jüngsten textkritischen Beurteilung als fehlerhafte Überlieferung von አላ verstanden und adversativ wiedergegeben.
- source_word: ፍቅዱ
  choice: strebt nach
  rationale: Der Imperativ von ፈቀደ bezeichnet hier ein willentliches Suchen oder Begehren; „strebt nach“ passt zum ethischen Mahnruf.
- source_word: ወኀረዩ ለክሙ
  choice: und erwählt für euch
  rationale: Bewahrt sowohl den ausdrücklichen Wahlakt als auch den benefaktiv-reflexiven Sinn von ለክሙ.
- source_word: ጽድቀ
  choice: Gerechtigkeit
  rationale: Der Begriff umfasst ethische Rechtschaffenheit und gerechtes Handeln; „Gerechtigkeit“ wahrt im Deutschen den gehobenen biblischen Sprachgebrauch.
- source_word: ወሕይወተ ኄራተ
  choice: ein gutes Leben
  rationale: Die Wortgruppe wird als „gutes Leben“ beziehungsweise „Leben in Güte“ verstanden und natürlich wiedergegeben.
- source_word: ወሖሩ
  choice: Geht
  rationale: Der Imperativ leitet das biblische Wegbild ethischer Lebensführung ein; im Deutschen ist „geht auf den Pfaden“ idiomatischer als „wandelt“.
- source_word: በፍኖዋተ ሰላም
  choice: auf den Pfaden des Friedens
  rationale: Erhält Plural, Wegmetapher und Friedensmotiv des äthiopischen Textes.
- source_word: ወተሐደዉ ወትደለዉ
  choice: damit ihr lebt und gedeiht
  rationale: Die Schlussverben werden als Folge oder Ziel der Mahnung verstanden; „gedeiht“ bezeichnet Wohlergehen, ohne es auf materiellen Reichtum zu verengen.
theological_decisions:
- issue: Wiedergabe von ጽድቀ als „Gerechtigkeit“ oder „Rechtschaffenheit“
  choice: Gerechtigkeit
  alternative: Rechtschaffenheit
  rationale: „Gerechtigkeit“ bewahrt die breite religiös-ethische Bedeutung, während „Rechtschaffenheit“ den Sinn stärker auf persönliche Moral einengen könnte.
- issue: Verhältnis der abschließenden Verben zur vorausgehenden Mahnung
  choice: damit ihr lebt und gedeiht
  alternative: und lebt und gedeiht
  rationale: Die finale beziehungsweise resultative Verknüpfung ist im Zusammenhang plausibel, bleibt jedoch eine syntaktische Deutung der koordinierenden Ge’ez-Formen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener Weisheits- und Wegmetaphorik. Archaisches „wandelt“ wurde vermieden; die Unsicherheiten des OCR-Zeugen und der syntaktischen Gliederung werden in den Fußnoten offengelegt.
