base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/006.yaml
  text: Woe to those who build up unrighteousness and oppression[a], and who lay the foundation of deceit, for they will be swiftly overthrown[b], and they will have no peace.
translation:
  language: de
  text: Wehe denen, die Unrecht und Unterdrückung errichten und dem Betrug ein Fundament legen[a]! Denn sie werden rasch niedergerissen werden und keinen Frieden haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die ge’ezische Wendung ist nicht völlig sicher. Möglich ist auch: „und trügerische Fundamente legen“ oder „und Betrug begründen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ
  choice: Wehe
  rationale: Leitet einen prophetisch-apokalyptischen Gerichtsruf ein und bewahrt dessen Schärfe.
- source_word: የሐንጽዋ ለዓመፃ ወለግፍዕ
  choice: die Unrecht und Unterdrückung errichten
  rationale: Bewahrt das Bau-Bild des Verbs und gibt die beiden gesellschaftlich-moralischen Übel als dessen Objekte wieder. „Errichten“ klingt im Deutschen natürlicher als „aufbauen“, ohne die Metapher aufzulösen.
- source_word: ወይሣርርዋ ለጕሕሉት
  choice: und dem Betrug ein Fundament legen
  rationale: Bewahrt ጕሕሉት als abstraktes Substantiv („Betrug/Täuschung“) und führt zugleich das architektonische Bild fort. Wegen der nicht völlig sicheren ge’ezischen Formulierung wird die Alternative in einer Fußnote dokumentiert.
- source_word: ፍጡነ ይትነሠቱ
  choice: sie werden rasch niedergerissen werden
  rationale: „Rasch“ gibt die zeitliche Dringlichkeit wieder; „niedergerissen“ verbindet das Gericht sprachlich mit dem vorausgehenden Bau-Bild und wahrt die passive Aussage.
- source_word: ወአልቦሙ ሰላመ
  choice: und keinen Frieden haben
  rationale: Eine direkte, gewichtige Wiedergabe der abschließenden Gerichtsformel.
theological_decisions:
- issue: Soll die moralische Aussage abstrakt wiedergegeben oder das durchgehende Bau-Bild erhalten werden?
  choice: Das Bau- und Fundamentbild wird durchgehend bewahrt.
  alternative: „Wehe denen, die Unrecht, Unterdrückung und Betrug üben.“
  rationale: Die ge’ezischen Verben entfalten ein architektonisches Bild, auf das das anschließende Niederreißen als Gericht antwortet. Eine rein abstrakte Fassung würde diese rhetorische Spannung einebnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der markante, absichtlich ungewöhnliche Ausdruck „Unrecht und Unterdrückung errichten“ erhält die apokalyptische Baumetaphorik; der Ausruf nach dem Weheruf und der folgende Begründungssatz sorgen für klare, mündlich verständliche Gliederung.
