base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/003.yaml
  text: 'And now I say to you[a], the righteous: do not walk in the paths of evil, nor in the paths of death, and do not draw near to them[b], lest you be destroyed.'
translation:
  language: de
  text: 'Und nun sage ich euch, den Gerechten: Geht nicht auf den Pfaden des Bösen und nicht auf den Pfaden des Todes. Nähert euch ihnen nicht[a], damit ihr nicht zugrunde geht[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Ihnen“ kann sich auf die genannten Pfade beziehen; möglicherweise sind zugleich die Menschen gemeint, die diesen Wegen folgen.
    reason: referential_ambiguity
  - marker: b
    text: 'Auch möglich: „damit ihr nicht vernichtet werdet“ oder „damit ihr nicht umkommt“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: Und nun
  rationale: Bewahrt den zeitlichen Übergang und leitet die neue Mahnung in natürlichem Deutsch ein.
- source_word: እብል
  choice: sage ich
  rationale: Gibt das einfache Redeverb und die unmittelbare Anrede ohne Verstärkung wieder.
- source_word: ለጻድቃን
  choice: euch, den Gerechten
  rationale: Macht die adressierte Gruppe klar und erhält die wiederkehrende ethische Bezeichnung des Textes.
- source_word: ኢትሖሩ
  choice: Geht nicht
  rationale: Zusammen mit „Pfaden“ bleibt das Bild eines sittlichen Lebensweges erhalten; „gehen“ klingt im heutigen Deutsch natürlicher als „wandeln“.
- source_word: በፍኖዋተ
  choice: auf den Pfaden
  rationale: Der Plural und die weisheitliche Wegmetapher werden konkret und würdig wiedergegeben.
- source_word: እኩይ
  choice: des Bösen
  rationale: Gibt den moralischen Sinn wieder, ohne das Wort unnötig als persönliche Gestalt zu deuten.
- source_word: ሞት
  choice: des Todes
  rationale: Bewahrt die scharfe und theologisch offene Todesmetaphorik der Vorlage.
- source_word: ኢትቅረቡ ኀቤሆሙ
  choice: Nähert euch ihnen nicht
  rationale: Erhält den pluralischen Rückverweis, ohne im Haupttext festzulegen, ob Menschen, Pfade oder beides gemeint sind.
- source_word: ከመ ኢትትሐጐሉ
  choice: damit ihr nicht zugrunde geht
  rationale: Gibt die negative Zweck- oder Folgeaussage natürlich wieder und lässt offen, ob moralischer, gerichtlicher oder leiblicher Untergang gemeint ist.
theological_decisions:
- issue: Bezugswort des pluralischen Pronomens in der Warnung vor Annäherung
  choice: Der deutsche Haupttext lässt den Bezug mit „ihnen“ bewusst offen.
  alternative: Das Pronomen ausdrücklich auf Menschen beziehen, die auf diesen Pfaden gehen, oder ausschließlich auf die Pfade selbst.
  rationale: Die äthiopische Form ist pluralisch, doch der unmittelbare Zusammenhang erlaubt sowohl einen Rückbezug auf die genannten Pfade als auch eine sinngemäße Beziehung auf ihre Anhänger. Eine Festlegung würde die genuine Mehrdeutigkeit unnötig auflösen.
- issue: Art des angedrohten Untergangs
  choice: „zugrunde geht“ ohne nähere Bestimmung
  alternative: „vernichtet werdet“ oder „umkommt“
  rationale: Die offene Formulierung bewahrt die Spannung zwischen moralischem Verderben, göttlichem Gericht und physischem Tod.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wegmetapher bleibt erhalten; das altertümlich wirkende „wandelt nicht“ wird zugunsten von „geht nicht“ vermieden. Die beiden kurzen Imperativsätze geben der Warnung Klarheit und Nachdruck.
