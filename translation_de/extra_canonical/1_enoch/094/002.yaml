base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/002.yaml
  text: And to wise men from a generation[a], the paths of violence and death will be revealed[b], and they will keep far from them and will not follow them.
translation:
  language: de
  text: Und bestimmten Menschen einer Generation[a] werden die Pfade von Gewalttat und Tod offenbar werden; sie werden sich von ihnen fernhalten und ihnen nicht folgen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weisen Menschen aus einer Generation“. Das äthiopische Wort እሙራን kann unterschiedlich aufgefasst werden; außerdem steht „Generation“ im Singular.'
    reason: lexikalische und grammatische Alternative
lexical_decisions:
- source_word: እሙራን ሰብእ
  choice: bestimmten Menschen
  rationale: እሙራን kann als passives Partizip im Sinn von „bekannt/bestimmt“ idiomatisch „bestimmte“ bezeichnen. Zusammen mit ሰብእ ergibt dies „bestimmte Menschen“; diese quellennahe Deutung wird gegenüber der ebenfalls überlieferten Auffassung „Weise“ bevorzugt.
- source_word: እምትውልድ
  choice: einer Generation
  rationale: Die Präposition እም bezeichnet Herkunft beziehungsweise Zugehörigkeit. Der Singular wird bewahrt und nicht ohne ausdrückliches sprachliches Signal zu „von Generation zu Generation“ erweitert.
- source_word: ይትከሠት
  choice: werden ... offenbar werden
  rationale: Die Form bezeichnet ein Sichtbar- oder Offenbarwerden. „Offenbar werden“ hält den Offenbarungscharakter fest, ohne einen ausdrücklich genannten Handelnden hinzuzufügen.
- source_word: ፍኖዋተ
  choice: die Pfade
  rationale: Das konkrete Bild von Wegen oder Pfaden wird erhalten; es trägt hier zugleich moralisch-metaphorischen Sinn.
- source_word: ግፍዕ
  choice: Gewalttat
  rationale: Das Wort umfasst gewaltsames Unrecht und Bedrückung. „Gewalttat“ gibt die konkrete Schärfe wieder, ohne den Sinn auf bloße körperliche Gewalt zu verengen.
- source_word: ሞት
  choice: Tod
  rationale: Die direkte Grundbedeutung genügt; eine Erweiterung zu „Verderben“ ist nicht erforderlich.
- source_word: ይርኅቁ እምኔሆሙ
  choice: sie werden sich von ihnen fernhalten
  rationale: Die Wendung bezeichnet Abstand von den genannten Pfaden und lässt sich im Deutschen natürlich als bewusstes Fernhalten ausdrücken.
- source_word: ኢይትለውዎሙ
  choice: ihnen nicht folgen
  rationale: Das Verb bedeutet „folgen/nachgehen“ und führt das Bild der Pfade konsequent weiter.
theological_decisions:
- issue: Konkretes Wegbild oder abstrakte ethische Umschreibung
  choice: „die Pfade von Gewalttat und Tod“
  alternative: „gewalttätiges und todbringendes Handeln“
  rationale: Die konkrete Metapher des Ausgangstextes bleibt stehen; eine ethische Ausdeutung würde das apokalyptisch-weisheitliche Bild unnötig glätten.
- issue: Bedeutung von እሙራን
  choice: „bestimmten“
  alternative: „weisen“
  rationale: Die morphologisch naheliegende Bedeutung „bekannt/bestimmt“ wird im Zusammenhang mit „Menschen“ als „bestimmte Menschen“ wiedergegeben. Da die Beleg- und Revisionslage widersprüchlich ist, wird die alternative traditionelle Deutung in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah an der ge’ezischen Abfolge, wird jedoch durch das Semikolon lesbar gegliedert. Das konkrete Pfadbild und die unpersönliche Aussage des Offenbarwerdens bleiben erhalten.
