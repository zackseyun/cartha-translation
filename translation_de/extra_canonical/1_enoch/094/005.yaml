base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/094/005.yaml
  text: And command them in the thought of your hearts[a], and do not let my words be blotted out from your hearts; for I know that sinners will tempt men to practice evil wisdom, and no place will be found for it[f][e][d][c][b], and no temptation will diminish.
translation:
  language: de
  text: 'Und gebietet ihnen nach dem Entschluss eurer Herzen[a] und lasst meine Worte nicht aus euren Herzen tilgen. Denn ich weiß: Sünder werden Menschen dazu verleiten, böse Weisheit zu üben. Für diese böse Weisheit wird sich kein Raum finden[b], und keine Versuchung wird nachlassen[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in den Gedanken eurer Herzen“ beziehungsweise „in der Absicht eurer Herzen“. Die Wendung verbindet inneres Denken mit dem Herzen als Sitz des Entschlusses.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „Kein Ort wird für sie gefunden werden.“ Gemeint sein können ein Ort, Raum oder eine Gelegenheit für die böse Weisheit; die Aussage ist im Geʿez schwierig.'
    reason: alternative_reading
  - marker: c
    text: Der Schlusssatz ist unsicher. መከራ kann auch „Prüfung“ oder „Bedrängnis“ bedeuten; der Satz könnte entsprechend besagen, dass keine Bedrängnis sie vermindern, beseitigen oder verkürzen wird.
    reason: textual_uncertainty
lexical_decisions:
- source_word: ትእዛዙ
  choice: gebietet ihnen
  rationale: Die Wiedergabe bewahrt den gebietenden Charakter der Pluralform. Das pronominale Objekt bleibt wie im überlieferten Wortlaut stehen, obwohl sein Bezug ohne den weiteren Zusammenhang nicht völlig deutlich ist.
- source_word: በሐሊና ልብክሙ
  choice: in der Gesinnung eurer Herzen
  rationale: ሐሊና bezeichnet Denken, Sinn oder Absicht. „Gesinnung“ verbindet inneres Denken und Willensausrichtung und erhält zusammen mit „Herzen“ die bildhafte Sprache des Geʿez.
- source_word: ኢይደምስስ ነገርየ እምልብክሙ
  choice: lasst meine Worte nicht aus euren Herzen getilgt werden
  rationale: Das Verb bezeichnet Auslöschen oder Tilgen. Die passive Formulierung bewahrt das Bild, dass die Worte aus dem inneren Gedächtnis entfernt werden könnten.
- source_word: ያሜክሮዎሙ ኃጥኣን ለሰብእ
  choice: Sünder die Menschen versuchen werden
  rationale: Die Kausativform von አመከረ bezeichnet versuchen, verführen oder auf die Probe stellen, nicht bloß unterweisen. „Versuchen“ erhält zudem die Wortverbindung zum Substantiv መከራ im Schlusssatz.
- source_word: ይግበሩ ጥበበ እኩየ
  choice: böse Weisheit zu üben
  rationale: „Böse Weisheit“ hält die paradoxe sapientiale Ausdrucksweise fest, statt sie zu „Bosheit“ oder „List“ zu verflachen. „Üben“ gibt das Tun bzw. Praktizieren wieder.
- source_word: ኵሉ መካን ኢይትረከብ ላቲ
  choice: nirgends wird Raum für sie gefunden werden
  rationale: መካን kann Ort, Raum oder Gelegenheit bedeuten. „Raum“ lässt sowohl eine örtliche als auch eine übertragene Deutung zu; das feminine Pronomen wird auf die böse Weisheit bezogen.
- source_word: ኵሉ መከራ አያሐፅፅ
  choice: keine Versuchung wird nachlassen
  rationale: መከራ kann Versuchung, Prüfung oder Bedrängnis bedeuten. „Versuchung“ bewahrt den lexikalischen Zusammenhang mit dem vorherigen Verb; „nachlassen“ gibt den schwierigen Schluss allgemein wieder, ohne eine präzisere Bedeutung vorzutäuschen.
theological_decisions:
- issue: Bezeichnet ጥበበ እኩየ allgemein böses Handeln oder eine verdorbene Form von Weisheit?
  choice: böse Weisheit
  alternative: böse List / ruchloses Handeln
  rationale: 'Die ausdrückliche Beibehaltung von „Weisheit“ erhält die moralische und weisheitliche Spannung: Sünder verleiten andere zu einer Weisheit, die ihrem Wesen nach böse ist.'
- issue: Ist መከራ am Versende als Versuchung, Prüfung oder Bedrängnis zu verstehen?
  choice: Versuchung
  alternative: Prüfung / Bedrängnis
  rationale: „Versuchung“ macht die wahrscheinliche Wortverbindung mit dem vorausgehenden Verb sichtbar. Wegen der semantischen Breite und des schwierigen Schlussverbs werden die anderen Möglichkeiten in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlichem Satzbau. Die ungewöhnliche Herzenssprache, die paradoxe „böse Weisheit“ und die Unsicherheit des Schlusssatzes wurden nicht harmonisiert. „Menschen“ gibt das generische ሰብእ inklusiv und natürlich wieder.
