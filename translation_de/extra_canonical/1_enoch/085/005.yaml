  text: And that black heifer grew up[b][a], and she came
translation:
  language: de
  text: Und jenes schwarze Jungrind wuchs heran und kam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich am Schluss: „und sie kam“. Daher ist auch möglich: „Und jene schwarze Färse wuchs heran, und sie kam.“'
    reason: grammatical_and_lexical_alternative
lexical_decisions:
- source_word: ወዝኩ
  choice: Und jenes
  rationale: Die Form ist demonstrativ und führt kein Verb des Sehens ein. „Jenes“ bewahrt den rückverweisenden Charakter.
- source_word: ጸሊም
  choice: schwarze
  rationale: Die direkte Farbbezeichnung erhält die symbolische Farbgebung der Tierapokalypse.
- source_word: ጣዕዋ
  choice: Jungrind
  rationale: Das Wort bezeichnet ein Kalb beziehungsweise junges Rind. „Jungrind“ lässt das Geschlecht offen, während das feminine Verb im weiteren Satz durch eine sachbezogene deutsche Formulierung natürlich wiedergegeben wird.
- source_word: ላህቀ
  choice: wuchs heran
  rationale: Das Verb bezeichnet das Heranwachsen beziehungsweise Großwerden; es ist kein Demonstrativ.
- source_word: ወመጽአት
  choice: und kam
  rationale: Die Form bedeutet „und sie kam“ und ist grammatisch feminin. Im Deutschen kann das grammatisch sächliche „Jungrind“ ohne ausdrückliches Pronomen als Subjekt fortgeführt werden.
theological_decisions:
- issue: Symbolische Tierdarstellung in der Tierapokalypse
  choice: Das konkrete Bild eines schwarzen Jungrinds bleibt unaufgelöst stehen.
  alternative: Das Tier deutend mit einer Nation, Herrscherfigur oder anderen geschichtlichen Größe gleichsetzen.
  rationale: Die Übersetzung soll die apokalyptische Bildsprache bewahren; historische oder theologische Identifizierungen gehören in die Auslegung.
- issue: Geschlecht des dargestellten Tieres
  choice: „Jungrind“ mit einer natürlichen deutschen Satzfortführung ohne Personalpronomen.
  alternative: „schwarze Färse … und sie kam“ oder allgemeiner „schwarzes Kalb … und es kam“.
  rationale: Die äthiopische Verbform ist feminin, doch die genaue zoologische Geschlechtsbezeichnung des Nomens ist bei mittlerer Quellensicherheit nicht völlig eindeutig. Die Hauptfassung vermeidet eine stärkere Festlegung als nötig; die Fußnote dokumentiert die feminine Form.
translation_notes:
  register: Kurzer, würdevoller Erzählstil mit bewahrter parataktischer Satzfolge. „Jungrind“ ist modernes Standarddeutsch und vermeidet sowohl das sachlich ungenauere „Wildschwein“ als auch eine unnötig sichere Festlegung auf „Färse“.
