base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/085/001.yaml
  text: And after this I saw another dream[a], and I will show you the whole dream[b], my son.
translation:
  language: de
  text: Danach sah ich einen weiteren Traum, und ich werde dir den ganzen Traum[a] zeigen, mein Sohn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »jeden Traum«. Die Formulierung kann auch distributiv verstanden werden; im unmittelbaren Zusammenhang bezieht sie sich jedoch wahrscheinlich auf den gerade genannten Traum als Ganzes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረዝ
  choice: Danach
  rationale: Die zeitliche Übergangsformel wird knapp und natürlich wiedergegeben.
- source_word: ካልአ ሕለመ
  choice: einen weiteren Traum
  rationale: Die Formulierung bezeichnet einen vom vorherigen unterschiedenen, nachfolgenden Traum; »weiteren« klingt im modernen Deutschen natürlich.
- source_word: ርኢኩ
  choice: sah ich
  rationale: Die direkte visionäre Aussage des Ausgangstextes bleibt erhalten.
- source_word: ኵሎ ሕልመ
  choice: den ganzen Traum
  rationale: Das Wort für »ganz/alle« bestimmt hier ein singularisches »Traum« und verweist am ehesten auf den soeben genannten weiteren Traum in seinem gesamten Umfang.
- source_word: አርእየከ
  choice: ich werde dir … zeigen
  rationale: Die kausative Bedeutung »sehen lassen/zeigen« wird bewahrt, ohne sie zum bloßen Erzählen abzuschwächen.
- source_word: ወልድየ
  choice: mein Sohn
  rationale: Die unmittelbare, vertrauliche Anrede wird schlicht und würdig wiedergegeben.
theological_decisions:
- issue: Bezugsumfang von ኵሎ ሕልመ
  choice: den ganzen Traum
  alternative: jeden Traum
  rationale: Grammatik und unmittelbarer Rückbezug sprechen für die Gesamtheit des gerade eingeführten Traums. Da die Formulierung grundsätzlich auch distributiv verstanden werden kann, wird diese Möglichkeit in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzstruktur folgt dem knappen visionären Bericht des Ge’ez, ohne unnötig altertümlich zu wirken.
