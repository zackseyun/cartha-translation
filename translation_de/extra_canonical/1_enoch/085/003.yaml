  to: Bevor ich deine Mutter Edna zur Frau nahm, sah ich in einer Vision auf meinem Lager:[a] Siehe, ein Stier kam aus der Erde hervor, und dieser Stier war weiß. Nach ihm kam eine einzelne Färse hervor, und zusammen mit ihr kamen zwei junge Stiere hervor.[b] Einer von ihnen war schwarz, der andere rot.
  rationale: Die Revision ist auf zwei sichere sprachliche Präzisierungen beschränkt. Sie glättet die deutsche Visionsformel, ohne die Beziehung zwischen Vision und Lager näher festzulegen, und ersetzt die weniger genaue „junge Kuh“ durch „Färse“. Inhalt, Bildsprache, Farben, Tiergeschlechter und Fußnotenanker bleiben erhalten.
