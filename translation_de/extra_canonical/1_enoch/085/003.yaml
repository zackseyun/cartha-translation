base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/085/003.yaml
  text: Before I took your mother Edna[a], I saw in a vision on my bed, and behold, a bull came up from the earth; and that bull was white. And after it there came out one heifer, and with her came out two bulls[c][b], and one of them was black and one red.
translation:
  language: de
  text: Bevor ich deine Mutter Edna zur Frau nahm, sah ich in einer Vision auf meinem Lager:[a] Siehe, ein Stier kam aus der Erde hervor, und dieser Stier war weiß. Nach ihm kam eine einzelne Färse hervor, und zusammen mit ihr kamen zwei junge Stiere hervor.[b] Einer von ihnen war schwarz, der andere rot.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Ich sah in der Vision meines Lagers.“ Die Formulierung bezeichnet eine Vision im Zusammenhang mit Schlaf oder Nachtlager.'
    reason: lexical_alternative
  - marker: b
    text: Die Tiergestalten gehören zur symbolischen Bildsprache der Traumvisionen. Der Haupttext bewahrt die Tierbezeichnungen, ohne die Gestalten hier zu identifizieren.
    reason: cultural_note
lexical_decisions:
- source_word: እንበለ፡ እንሥአ፡ ለአምክ፡ ኤድና
  choice: Bevor ich deine Mutter Edna zur Frau nahm
  rationale: Die Wendung bezeichnet das Nehmen einer Frau im ehelichen Sinn. Die Ergänzung „zur Frau“ macht dies im heutigen Deutsch klar, ohne die Aussage weiter auszulegen.
- source_word: ርኢኩ፡ በራእየ፡ ምስካብየ
  choice: sah ich auf meinem Lager eine Vision
  rationale: Die Wiedergabe bewahrt sowohl das ausdrückliche Sehen einer Vision als auch den Bezug auf das Schlaflager. „Lager“ passt zum würdevollen visionären Erzählton und vermeidet die unnötige Festlegung, dass die Vision selbst nur ein gewöhnlicher Traum gewesen sei.
- source_word: ላህም
  choice: Stier
  rationale: Im Zusammenhang der Tierapokalypse ist ein männliches Rind gemeint; „Stier“ wahrt den Geschlechtskontrast zur anschließend genannten weiblichen Gestalt.
- source_word: ወፅአ፡ እምድር
  choice: kam aus der Erde hervor
  rationale: Dies bildet die sichtbare Bewegung aus der Erde natürlich und zugleich eng am Ausgangstext ab.
- source_word: ጸዓዳ
  choice: weiß
  rationale: Der schlichte Farbwert ist in der symbolischen Darstellung wichtig und wird nicht interpretierend erweitert.
- source_word: ጣዕዋ፡ እንስቲያት፡ አሐቲ
  choice: eine einzelne junge Kuh
  rationale: Die Formulierung kennzeichnet ausdrücklich ein einziges weibliches Rind. „Junge Kuh“ ist im modernen Deutsch verständlicher als das fachsprachliche „Färse“ und erhält die Alters- und Geschlechtsangabe.
- source_word: ወምስሌሃ፡ ወፅኡ፡ ክልኤቱ፡ ጣዕዋ
  choice: zusammen mit ihr kamen zwei junge Stiere hervor
  rationale: Die Übersetzung wahrt die Zuordnung der beiden männlichen Jungtiere zu ihrem Auftreten und gibt ihre Zahl ausdrücklich wieder.
- source_word: ጸሊመ
  choice: schwarz
  rationale: Der direkte Farbwert bewahrt den symbolisch bedeutsamen Kontrast.
- source_word: ቀይሐ
  choice: rot
  rationale: „Rot“ ist die klare, unmarkierte Wiedergabe des Farbworts und erhält den Kontrast.
theological_decisions:
- issue: Tiersymbolik in den Traumvisionen
  choice: Die Gestalten werden im Haupttext als Tiere beschrieben und nicht mit Menschen identifiziert.
  alternative: Die Tiere bereits in der Übersetzung als bestimmte menschliche Gestalten deuten.
  rationale: Der Text entfaltet seine Aussage durch eine fortlaufende apokalyptische Bildsprache. Eine Identifizierung im Haupttext würde die Vision auslegen, statt sie zu übersetzen.
- issue: Charakter der nächtlichen Offenbarung
  choice: Das ausdrückliche Visionswort bleibt erhalten, verbunden mit dem Lager als Schauplatz.
  alternative: Die Wendung lediglich als gewöhnlichen Traum oder als „während ich schlief“ wiedergeben.
  rationale: So bleiben der visionäre Charakter und der nächtliche beziehungsweise lagerbezogene Kontext nebeneinander bestehen, ohne ihre genaue Beziehung dogmatisch festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Erzählton. „Siehe“ erhält das visionäre Aufmerksamkeitssignal; kurze Hauptsätze bewahren die eindringliche Abfolge der Erscheinungen.
