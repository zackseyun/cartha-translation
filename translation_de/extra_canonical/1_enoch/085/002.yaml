base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/085/002.yaml
  text: 'And Enoch lifted up his voice and said to his son Methuselah[a], “To you I speak, my son: hear my words, and incline your ear to the vision of your father’s dream.”'
translation:
  language: de
  text: 'Und Henoch erhob seine Stimme und sagte zu seinem Sohn Metuschelach: »Zu dir rede ich, mein Sohn: Höre meine Worte und neige dein Ohr dem Traumgesicht[a] deines Vaters.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der Schau eines Traumes«. Die ge’ezische Wendung verbindet die Sprache des Schauens beziehungsweise einer Vision mit der des Traumes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አንሥአ
  choice: erhob seine Stimme
  rationale: Das Verb bedeutet wörtlich »erheben«. Im Zusammenhang mit der folgenden Rede gibt die feste Wendung den feierlichen Erzählton wieder; »seine Stimme« ist sinngemäß ergänzt.
- source_word: ወይቤ
  choice: sagte
  rationale: Natürliche und transparente Wiedergabe des gewöhnlichen erzählenden Redeverbs.
- source_word: ለወልዱ ማቱሳላ
  choice: zu seinem Sohn Metuschelach
  rationale: Die Präposition bezeichnet den Adressaten; der Personenname folgt der im Deutschen geläufigen biblischen Form.
- source_word: ለከ እብለከ
  choice: Zu dir rede ich
  rationale: Die Voranstellung von »Zu dir« bewahrt die im Ge’ez ausgedrückte Betonung des Adressaten.
- source_word: ወልድየ
  choice: mein Sohn
  rationale: Bewahrt die zugleich familiäre und lehrende Anrede ohne archaisches Anrufungswort.
- source_word: ስማዕ ነገርየ
  choice: Höre meine Worte
  rationale: Die imperative Form und der gehobene, weisheitliche Ton bleiben erhalten.
- source_word: አጽንን እዝነከ
  choice: neige dein Ohr
  rationale: Die konkrete Körpermetapher für aufmerksames Hören wird nicht zu bloßem »Achte darauf« verflacht.
- source_word: ለርእየ ሕልመ
  choice: dem Traumgesicht
  rationale: Das Kompositum bewahrt sowohl das Traum- als auch das Schau- beziehungsweise Visionselement der ge’ezischen Wortverbindung.
- source_word: አቡከ
  choice: deines Vaters
  rationale: Gibt die Genitivbeziehung knapp und natürlich wieder und bezeichnet Henoch als den Vater, dessen Traumgesicht erzählt wird.
theological_decisions:
- issue: Wiedergabe der visionären Wendung ርእየ ሕልመ
  choice: Traumgesicht
  alternative: die Schau eines Traumes; die Vision des Traumes
  rationale: »Traumgesicht« lässt sowohl den Traumzustand als auch den visionären Charakter erkennen, ohne die ge’ezische Verbindung auf einen gewöhnlichen Traum zu reduzieren oder ihre genaue syntaktische Beziehung endgültig festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter biblisch-weisheitlicher Bildsprache. Die Satzstellung »Zu dir rede ich« erhält die Betonung des Originals; »neige dein Ohr« bleibt anschaulich, ohne insgesamt einen altertümlichen Sprachstand nachzuahmen.
