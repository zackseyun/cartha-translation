base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/085/004.yaml
  text: And that black calf struck the red calf and pursued it onto the earth[c][b][a], and after that I could no longer see that red calf.
translation:
  language: de
  text: Und jenes schwarze Kalb schlug das rote Kalb und verfolgte es auf die Erde[a][b]; danach konnte ich jenes rote Kalb nicht mehr sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Schlug“ kann angesichts der Rinderbilder auch als „stieß es mit den Hörnern“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: „Auf die Erde“ kann je nach räumlichem Verständnis auch „zu Boden“ oder „in die Erde“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ጐድአ
  choice: schlug
  rationale: Das Verb bezeichnet ein Schlagen oder Verwunden. „Schlug“ gibt die Gewalttätigkeit wieder, ohne die Art des Angriffs stärker festzulegen, als es der ge'ezische Wortlaut tut.
- source_word: ጸሊም
  choice: schwarz
  rationale: Der gewöhnliche Farbwert passt zur bildhaften Tierszene.
- source_word: ጣዕዋ
  choice: Kalb
  rationale: Der unmarkierte Ausdruck bezeichnet hier ein junges Rind; „Kalb“ vermeidet eine unbegründete Festlegung auf ein weibliches Tier.
- source_word: ለቀይሕ
  choice: das rote Kalb
  rationale: Die Farbe bestimmt das Objekt; das Substantiv wird aus dem unmittelbar vorausgehenden Ausdruck wiederholt, wie es im Deutschen für Klarheit natürlich ist.
- source_word: ተለዎ
  choice: jagte ... nach
  rationale: Nach dem gewaltsamen Schlag ist ein feindseliges Verfolgen gemeint; „jagte ... nach“ vermittelt dies natürlicher als das neutrale „folgte“.
- source_word: ውስተ ምድር
  choice: auf die Erde
  rationale: Die Wendung beschreibt eine Bewegung zur Erde beziehungsweise zum Boden, ohne eindeutig festzulegen, ob das Tier auf den Boden oder in die Erde gelangt.
- source_word: አክሀልኩ እምሶቤሃ ርእዮቶ
  choice: danach konnte ich ... nicht mehr sehen
  rationale: Die Formulierung gibt sowohl den zeitlichen Übergang als auch das Ende der Sichtbarkeit im Deutschen natürlich wieder.
theological_decisions:
- issue: Deutung der Tiere in der Vision
  choice: Die schwarzen und roten Kälber bleiben im Haupttext als visionäre Tiere stehen.
  alternative: Die Tiere unmittelbar als die von ihnen dargestellten Menschen benennen.
  rationale: Die apokalyptische Bildsprache soll bewahrt und nicht durch eine interpretierende Identifizierung ersetzt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die wiederholte Bezeichnung „Kalb“ bewahrt die Bildsprache und vermeidet eine im Ge'ez nicht ausdrücklich markierte weibliche Geschlechtszuweisung.
