base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/006.yaml
  text: For seven days it goes out and turns about[a], and it returns again through the gate from which the sun goes out; and it completes all its light, and it withdraws from the sun[d][c][b], and it enters for eight days through the sixth gate from which the sun goes out.
translation:
  language: de
  text: Sieben Tage lang geht es hinaus und zieht seine Bahn[a]; dann kehrt es wieder durch das Tor zurück, aus dem die Sonne hinausgeht. Es vollendet sein ganzes Licht[b], entfernt sich von der Sonne und tritt acht Tage lang durch das sechste Tor ein, aus dem die Sonne hinausgeht.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „dreht sich im Kreis“ oder „vollzieht einen Umlauf“.'
    reason: lexical_alternative
  - marker: b
    text: Die technische Wendung kann bedeuten, dass das Gestirn das volle Maß seines Lichts erreicht.
    reason: cultural_note
  - marker: c
    text: Das Subjekt bleibt im überlieferten Wortlaut unausgesprochen. Dem Zusammenhang nach ist wahrscheinlich der Mond gemeint.
    reason: alternative_reading
lexical_decisions:
- source_word: ይወፅእ
  choice: geht hinaus
  rationale: Das grundlegende Bewegungsverb bezeichnet das Hinausgehen. Die Wiedergabe bleibt in der astronomischen Bewegungsformel einheitlich und legt das unausgesprochene Subjekt nicht fest.
- source_word: ሰብዓተ መዋዕለ
  choice: sieben Tage lang
  rationale: Die adverbiale Zeitangabe bezeichnet eine Dauer; diese Formulierung ist im Deutschen natürlich und genau.
- source_word: የአውድ
  choice: zieht seine Bahn
  rationale: Das Verb bezeichnet eine kreisende oder umlaufende Bewegung. Die Formulierung passt zum astronomischen Zusammenhang, ohne die genaue Gestalt der Bewegung stärker festzulegen.
- source_word: ይገብእ ካዕበ
  choice: kehrt wieder … zurück
  rationale: Zusammen mit „wieder“ beschreibt das Verb die Rückbewegung nach dem Hinausgehen und Umlauf.
- source_word: በኆኅት
  choice: durch das Tor
  rationale: ኆኅት bezeichnet ein Tor, eine Tür oder ein Portal und gehört hier zur kosmologischen Architektur der Gestirnbahnen.
- source_word: ወይፌጽም ኵሎ ብርሃኖ
  choice: Es vollendet sein ganzes Licht
  rationale: Die bewusst etwas technische Ausdrucksweise bewahrt den Gedanken, dass das Licht sein volles Maß erreicht, ohne ihn paraphrasierend aufzulösen.
- source_word: ወይፀንን እምፀሐይ
  choice: entfernt sich von der Sonne
  rationale: Das Verb drückt Trennung oder Entfernung aus. Die Übersetzung wahrt die räumliche Beziehung, ohne eine zusätzliche kosmologische Erklärung einzutragen.
- source_word: ስሙነ መዋዕለ
  choice: acht Tage lang
  rationale: Wie die erste Zeitangabe bezeichnet die Wendung eine Dauer.
- source_word: በሳድስት ኆኅት
  choice: durch das sechste Tor
  rationale: Ordinalzahl und Torbezeichnung werden entsprechend dem Schema der Gestirnbahnen und konsistent mit dem ersten Vorkommen übersetzt.
theological_decisions:
- issue: Identität des handelnden Gestirns
  choice: Die Verben werden mit dem neutralen Pronomen „es“ wiedergegeben.
  alternative: Im Haupttext ausdrücklich „der Mond“ ergänzen.
  rationale: Im Zusammenhang ist wahrscheinlich der Mond gemeint, doch der vorliegende Vers nennt das Subjekt nicht ausdrücklich. Das neutrale Pronomen bewahrt diese formale Unbestimmtheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt nahe an der parataktischen Gestalt des Ge’ez, wird aber durch Zeichensetzung und einen natürlichen astronomischen Ausdruck lesbar gemacht. „Tor“ wird gegenüber „Fenster“ bevorzugt, da es ኆኅት genauer wiedergibt.
