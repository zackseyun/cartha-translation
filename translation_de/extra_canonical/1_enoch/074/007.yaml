base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/007.yaml
  text: And when the sun goes out from the fourth gate[a], it goes out for seven days, until it goes out from the fifth; and again it returns for seven days through the fourth gate, and completes all its light[c][b], and it withdraws and enters through the first gate for eight days.
translation:
  language: de
  text: Und wenn die Sonne aus dem vierten Tor hervorgeht, geht sie sieben Tage lang hervor, bis sie aus dem fünften Tor[a] hervorgeht. Dann kehrt sie wieder sieben Tage lang durch das vierte Tor[c] zurück, vollendet ihr ganzes Licht[b], zieht sich zurück und tritt acht Tage lang durch das erste Tor ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im äthiopischen Text wird das Wort „Tor“ hier nicht ausdrücklich wiederholt; nach dem Zusammenhang ist „aus dem fünften Tor“ gemeint.
    reason: lexical_alternative
  - marker: b
    text: „Vollendet ihr ganzes Licht“ gibt die äthiopische Wendung eng wieder. Gemeint sein könnte, dass die Sonne in dieser Phase das volle Maß ihrer Helligkeit erreicht.
    reason: cultural_note
  - marker: c
    text: 'Oder: „zum vierten Tor“.'
    reason: textual_or_translation_ambiguity
lexical_decisions:
- source_word: ፀሐይ
  choice: die Sonne
  rationale: Der bestimmte Artikel ist im Deutschen bei diesem konkreten astronomischen Bezug natürlich.
- source_word: ይወፅእ
  choice: hervorgehen
  rationale: Bewahrt die wiederholte Bewegungsformel und das Bild der Sonne, die aus einem kosmischen Tor hervortritt.
- source_word: እምራብዕት ኆኅት
  choice: aus dem vierten Tor
  rationale: „Tor“ erhält die konkrete kosmische Architektur des Abschnitts; die Präposition bezeichnet hier den Ausgangspunkt.
- source_word: ሰቡዐ መዋዕለ
  choice: sieben Tage lang
  rationale: Gibt die zeitliche Dauer innerhalb der beschriebenen Sonnenbahn klar und idiomatisch wieder.
- source_word: እስከ ይወፅእ እምነ ኃምስት
  choice: bis sie aus dem fünften hervorgeht
  rationale: Die Ellipse des überlieferten Textes bleibt erhalten; aus dem Zusammenhang ist „dem fünften Tor“ zu ergänzen.
- source_word: ካዕበ
  choice: wieder
  rationale: Kennzeichnet knapp die erneute beziehungsweise umgekehrte Bewegung im Zyklus.
- source_word: ይገብእ
  choice: kehrt … zurück
  rationale: Im Zusammenhang bezeichnet das Verb die Rückbewegung der Sonne innerhalb ihres zyklischen Laufs.
- source_word: በኆኅት ራብዕ
  choice: durch das vierte Tor
  rationale: Die Präposition በ bezeichnet hier am ehesten den Weg des Durchgangs; die mögliche Zielrichtung bleibt in einer Fußnote sichtbar.
- source_word: ይፌጽም ኵሎ ብርሃኖ
  choice: vollendet ihr ganzes Licht
  rationale: Bewahrt die auffällige, möglicherweise technische Redeweise des astronomischen Schemas, ohne sie als „erreicht ihre volle Helligkeit“ auszudeuten.
- source_word: ይደንን
  choice: zieht sich zurück
  rationale: Passt zur anschließenden Eintrittsbewegung und erhält das räumliche Bild.
- source_word: ይበውእ በቀዳሚት ኆኅት
  choice: tritt … durch das erste Tor ein
  rationale: Bildet ein natürliches Gegenstück zu „hervorgehen“ und gibt በ als Durchgangsweg wieder.
- source_word: ስሙነ መዋዕለ
  choice: acht Tage lang
  rationale: Gibt die Dauer der letzten genannten Phase klar wieder.
theological_decisions:
- issue: Astronomisch-kosmische Bildsprache der Tore
  choice: Die wörtliche Rede von Toren, durch die sich die Sonne bewegt, bleibt erhalten.
  alternative: Die Tore als Horizontpunkte, Bahnen oder Stationen paraphrasieren.
  rationale: Der astronomische Teil des Henochbuches beschreibt einen gegliederten Kosmos mit konkreten Öffnungen oder Toren. Eine Modernisierung zu abstrakten astronomischen Punkten würde die apokalyptische Vorstellungswelt des Quelltextes einebnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst wiederholter Bewegungsformel. Die konkrete kosmische Torbildsprache und die eigentümliche Wendung „ihr ganzes Licht vollenden“ werden erhalten; erklärungsbedürftige Ellipsen und Präpositionsvarianten stehen in Fußnoten.
