  text: And in certain months it changes its settings[a], and in certain months it travels its course[d][c][b], one by one.
translation:
  language: de
  text: Und in bestimmten Monaten verändert er seine Untergangsorte[a], und in bestimmten Monaten durchläuft er seine Bahn[b], jeweils einzeln.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „seine Untergänge“. Gemeint sind wahrscheinlich die wechselnden Punkte am westlichen Horizont, an denen der Himmelskörper untergeht.'
    reason: lexical_alternative
  - marker: b
    text: „Bahn“ bezeichnet hier die festgelegte Route bzw. den regelmäßigen Lauf des Himmelskörpers.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich steht eine Wiederholung: „einen, einen“. Sie hat wahrscheinlich verteilenden Sinn: „jeweils einzeln“ oder „einen nach dem anderen“. Worauf sich die Folge genau bezieht, bleibt im knappen Satz offen.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: አውራኅ
  choice: Monaten
  rationale: Hier ist die Pluralform von „Monat“ gemeint, nicht „Pfade“; die wiederholte Präpositionalfügung wird entsprechend mit „in bestimmten Monaten“ wiedergegeben.
- source_word: እመራት
  choice: bestimmten
  rationale: Das Wort bezeichnet hier bestimmte oder festgesetzte Monate und bildet mit አውራኅ die Wendung „in bestimmten Monaten“.
- source_word: ይዌልጥ
  choice: verändert
  rationale: Das Verb bedeutet „ändern/verändern“ und bezieht sich auf die wechselnden Untergangsorte.
- source_word: ምዕራባተ
  choice: Untergangsorte
  rationale: Der Plural bezeichnet im astronomischen Zusammenhang die Orte bzw. Punkte des Untergangs; „Untergangsorte“ macht den räumlichen Plural im Deutschen deutlich.
- source_word: የሐውር
  choice: durchläuft
  rationale: Das allgemeine Bewegungsverb wird im Zusammenhang mit einer geordneten Himmelsbahn natürlich als „durchläuft“ wiedergegeben.
- source_word: ምሕዋሪሁ
  choice: seine Bahn
  rationale: Die Form bezeichnet seinen Lauf oder seine Bahn; „Bahn“ passt zur geregelten Bewegung eines Himmelskörpers.
- source_word: አሐዱ፡ አሐዱ
  choice: einen nach dem anderen
  rationale: Die Wiederholung hat wahrscheinlich distributiven Sinn. Die Formulierung bewahrt den Gedanken einer geordneten Folge, ohne das unnatürliche „jeden einen nach dem anderen“.
