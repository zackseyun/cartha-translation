translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das maskuline Pronomen „er“ setzt den im Kontext genannten Himmelskörper fort. Die schwerfällige Wiederholung des Ausgangstextes wird in den Anmerkungen offengelegt; die Übersetzung erhält ihre distributive Aussage und lässt den genauen Bezug bewusst offen.
