base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/011.yaml
  text: And their excess for the sun and the stars comes to six days[a]; in five years, at six each, it amounts for them to thirty days[c][b], and the moon falls behind the sun and the stars by thirty days.
translation:
  language: de
  text: Und der Überschuss der Sonne und der Sterne beträgt sechs Tage[a]; in fünf Jahren beläuft er sich bei jeweils sechs Tagen auf dreißig Tage, und der Mond[b] bleibt um dreißig Tage hinter Sonne und Sternen zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Rechnung ist stark verkürzt: Offenbar sammeln Sonne und Sterne jährlich sechs zusätzliche Tage an, also dreißig Tage in fünf Jahren.'
    reason: cultural_note
  - marker: b
    text: 'Oder: »der Monat«. Das äthiopische Wort kann in kalendarischen Zusammenhängen sowohl »Mond« als auch »Monat« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ምብጻሒሆሙ
  choice: ihr Überschuss
  rationale: Das vom Verb »erreichen/ankommen« abgeleitete Substantiv kann einen erreichten Gesamtbetrag bezeichnen. Im astronomisch-kalendarischen Zusammenhang ist damit die zusätzlich auflaufende Tageszahl gemeint; »Überschuss« gibt diesen Sinn knapp wieder.
- source_word: ስሱ
  choice: sechs
  rationale: Kardinalzahl; sie bezeichnet die jährlich auflaufenden sechs Tage.
- source_word: መዋዕለ
  choice: Tage
  rationale: Der übliche Plural von »Tag«; hier werden kalendarische Differenzen berechnet.
- source_word: በበስሱ
  choice: jeweils sechs Tage
  rationale: 'Die wiederholende Bildung mit በበ- hat distributiven Sinn: sechs für jedes der fünf Jahre. Die Ergänzung »Tage« macht die knappe Rechnung im Deutschen verständlich.'
- source_word: ይበጽሖሙ
  choice: ergibt das für sie
  rationale: Das Verb bedeutet »erreichen, gelangen zu«. In der Rechnung bezeichnet es das Erreichen beziehungsweise Sich-Belaufen auf die Gesamtsumme von dreißig Tagen.
- source_word: የሐፀፁ
  choice: bleibt … zurück
  rationale: Das Verb ሐፀፀ bedeutet hier »zu kurz kommen, weniger sein, zurückbleiben«, nicht »weggenommen werden«. Die Wendung bezeichnet die um dreißig Tage geringere Rechnung des Mondes.
- source_word: ወርኅ
  choice: der Mond
  rationale: Das Wort kann »Mond« oder »Monat« bedeuten. Der unmittelbare Gegensatz zu Sonne und Sternen spricht hier für »Mond«, während die kalendarische Nebenbedeutung in einer Fußnote bewahrt wird.
theological_decisions:
- issue: Verdichtete astronomisch-kalendarische Rechnung
  choice: Die Abfolge von sechs Tagen jährlich, dreißig Tagen in fünf Jahren und dem Zurückbleiben des Mondes wird verständlich wiedergegeben, ohne sie in ein modernes Kalendersystem umzudeuten.
  alternative: Die Aussage ausdrücklich als Differenz zwischen Sonnen- und Mondjahren paraphrasieren.
  rationale: Der äthiopische Text nennt die Rechenschritte, erklärt aber das zugrunde liegende System nicht vollständig. Die Übersetzung wahrt diese Begrenzung und macht nur die grammatisch erkennbare Rechnung deutlich.
- issue: Bezug von ወርኅ
  choice: »der Mond«
  alternative: »der Monat«
  rationale: Sonne und Sterne sind die unmittelbar genannten Vergleichsgrößen, sodass der Himmelskörper im Vordergrund steht. Wegen der echten lexikalischen Mehrdeutigkeit wird »Monat« als Alternative vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die technische Wiederholung des Ausgangstextes wird leicht geglättet; die Zahlenfolge und die Mehrdeutigkeit von »Mond/Monat« bleiben erhalten.
