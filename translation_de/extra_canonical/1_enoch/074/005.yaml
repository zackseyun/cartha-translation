base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/005.yaml
  text: For two months it sets with the sun in these two middle portals[c][b][a], in the third and in the fourth portal.
translation:
  language: de
  text: Zwei Monate lang geht er zusammen mit der Sonne in diesen beiden mittleren Toren – dem dritten und dem vierten Tor – unter.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die knappe Formulierung setzt die beiden mittleren Tore mit dem dritten und dem vierten Tor gleich. Das nicht ausdrücklich genannte maskuline Subjekt wird aus dem Zusammenhang erschlossen.
    reason: syntaktische_und_kontextuelle_Klärung
lexical_decisions:
- source_word: በክልኤ ወርኅ
  choice: Zwei Monate lang
  rationale: ክልኤ ist die Kardinalzahl »zwei«, nicht die Ordinalzahl »zweite«; በ kennzeichnet hier die zeitliche Dauer.
- source_word: የዓርብ
  choice: geht er … unter
  rationale: Die Form ist als Imperfekt 3. Person Singular Maskulinum von ዐረበ, »untergehen«, zu verstehen. Das Pronomen bezieht sich im astronomischen Zusammenhang auf den zuvor genannten Himmelskörper.
- source_word: ምስለ ፀሐይ
  choice: zusammen mit der Sonne
  rationale: ምስለ bedeutet »mit«; »zusammen mit« gibt die Gleichzeitigkeit der Bewegung natürlich wieder.
- source_word: በእሉ ክልኤ ኆዋኅው እለ ማእከል
  choice: durch diese beiden mittleren Tore
  rationale: ኆኅት bzw. der Plural ኆዋኅው bezeichnet Türen, Tore oder Portale; »Tore« bewahrt die konkrete kosmische Architektur. ማእከል bezeichnet die Mitte.
- source_word: በሣልስት ወበራብዕት ኆኅት
  choice: durch das dritte und das vierte Tor
  rationale: Die Ordinalzahlen bestimmen die nummerierten Tore. Die Wiederholung von »durch« verdeutlicht im Deutschen die Beziehung zum Verb, ohne die Bildsprache aufzulösen.
theological_decisions:
- issue: Wesen der himmlischen Tore
  choice: konkrete Tore innerhalb des apokalyptisch-kosmischen Schemas
  alternative: Fenster oder allgemein Öffnungen
  rationale: Der äthiopische Ausdruck bezeichnet primär Tür oder Tor. Die architektonische Bildsprache wird beibehalten und nicht in moderne astronomische Begriffe umgedeutet.
- issue: Subjekt von »geht unter«
  choice: maskulines »er« als Rückverweis auf den im Zusammenhang beschriebenen Himmelskörper
  alternative: unpersönliches »es« oder ausdrückliche Ergänzung des Mondes
  rationale: Die Verbform ist maskulin singular, doch der vorgelegte Vers nennt das Subjekt nicht ausdrücklich. Daher wird kein bestimmter Himmelskörper in den Text eingefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche apokalyptisch-astronomische Bildsprache bleibt erhalten; erläuternde Ergänzungen und konfessionelle Deutungen werden vermieden.
