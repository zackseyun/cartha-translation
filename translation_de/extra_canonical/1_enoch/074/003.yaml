base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/003.yaml
  text: In fifteen parts it completes all its light in the east[b][a], and in fifteen parts it completes all its darkness in the west.
translation:
  language: de
  text: In fünfzehn Teilen[a] vollendet er sein ganzes Licht im Osten, und in fünfzehn Teilen vollendet er seine ganze Dunkelheit im Westen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Zahlzeichen der zugrunde liegenden Transkription sind unsicher beziehungsweise beschädigt. Der Mondrechnung dieses Abschnitts entsprechend ist hier wahrscheinlich in beiden Satzhälften „fünfzehn Teile“ zu lesen.
    reason: textual_variant
lexical_decisions:
- source_word: በ፭*፷፯ እደ
  choice: in fünfzehn Teilen
  rationale: Die vorliegende Transkription der Zahlzeichen ist offenbar beschädigt. Im Zusammenhang der schematischen Mondrechnung ist ፲፭ („fünfzehn“) zu lesen. እደ bezeichnet hier Teile oder Anteile (wörtlich „Hände“), nicht Tage.
- source_word: ይፌጽም
  choice: vollendet er
  rationale: Die aktive Verbform wird aktiv wiedergegeben. „Vollendet“ bewahrt den formelhaften, rechnerischen Charakter der Aussage.
- source_word: ኵሎ ብርሃኖ
  choice: sein ganzes Licht
  rationale: ኵሎ drückt die Gesamtheit aus; das Suffix an ብርሃኖ wird possessiv wiedergegeben.
- source_word: በሠርቅ
  choice: im Osten
  rationale: Die Präposition wird im astronomischen Zusammenhang lokativ verstanden.
- source_word: ኵሎ ጽልመተ
  choice: seine ganze Dunkelheit
  rationale: Die konkrete Gegenüberstellung von Licht und Dunkelheit bleibt erhalten; eine erklärende Umschreibung als Zu- oder Abnahme würde über den Wortlaut hinausgehen.
- source_word: በምዕራብ
  choice: im Westen
  rationale: Die lokative Wiedergabe wahrt den Parallelismus mit „im Osten“.
theological_decisions:
- issue: Deutende astronomische Umschreibung der Vollendungsformel
  choice: Die aktive, wörtlich-kompletive Formulierung „vollendet er“ bleibt in beiden Satzhälften erhalten.
  alternative: „erreicht er seine volle Helligkeit … erreicht er völlige Dunkelheit“
  rationale: Eine stärker erklärende Fassung könnte das angenommene astronomische Phänomen verdeutlichen, würde aber die knappe, gemessene Bildsprache des ge’ezischen Textes festlegen und damit seine Spannung vermindern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst formelhaftem Parallelismus. Das grammatische Maskulinum „er/sein“ folgt der ge’ezischen Verb- und Suffixform und lässt den im Zusammenhang vorausgesetzten Himmelskörper unausgesprochen.
