base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/014.yaml
  text: As for the moon alone[c][b][a], its days come to one thousand and sixty-two days for three years and for five years.
translation:
  language: de
  text: 'Was den Mond allein[c] betrifft: Die Zahl seiner Tage beläuft sich in drei Jahren auf eintausendzweiundsechzig Tage[b] – und in fünf Jahren …[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der abschließende Ausdruck „und in fünf Jahren“ ist in der vorliegenden geʿezischen Textzeile unvollständig; vermutlich fehlt hier eine Zahl oder weiterer Wortlaut.
    reason: textual_variant
  - marker: b
    text: Der Vers gehört zu einer Kalenderrechnung im Astronomischen Buch. „Die Zahl seiner Tage beläuft sich auf“ bezeichnet die Gesamtzahl der Tage; 1.062 Tage entsprechen drei Jahren zu je 354 Tagen.
    reason: cultural_note
  - marker: c
    text: 'Oder: „Was den einzelnen Monat betrifft“. Das geʿezische Wort kann „Mond“ oder „Monat“ bedeuten; die vorliegende Rechnung spricht jedoch für „Mond“.'
    reason: previous_rendering
lexical_decisions:
- source_word: ለወርኅ
  choice: den Mond
  rationale: ወርኅ kann sowohl „Monat“ als auch „Mond“ bedeuten. Da 1.062 Tage genau drei Mondjahren zu je 354 Tagen entsprechen und der Zusammenhang astronomisch ist, bezeichnet das Wort hier am wahrscheinlichsten den Mond beziehungsweise dessen Jahreslauf.
- source_word: ለባሕቲቱ
  choice: allein
  rationale: Die Form bedeutet „allein“, „für sich“ oder „einzig“. „Den Mond allein“ bewahrt die Abgrenzung gegenüber einer gemeinsamen Sonnen- und Mondrechnung.
- source_word: ይበጽሕ
  choice: beläuft sich … auf
  rationale: Das Verb bedeutet in einer Zahlenangabe „erreichen“ oder „sich belaufen auf“. Die gewählte Wendung ist im Deutschen natürlich und macht den rechnerischen Sinn deutlich.
- source_word: መዋዕሊሁ
  choice: die Zahl seiner Tage
  rationale: Wörtlich steht „seine Tage“. Im technischen Kalenderzusammenhang bezeichnet dies die Gesamtzahl der Tage; die deutsche Formulierung vermeidet die missverständliche Vorstellung einzelner Tage, ohne den Bezug zum Mond aufzugeben.
- source_word: ለ፫ዓም
  choice: in drei Jahren
  rationale: Die Präposition markiert hier den Zeitraum, über den die Tage summiert werden. „In drei Jahren“ gibt dies idiomatisch wieder.
- source_word: ፲፻ ወ፷ወ፪ መዋዕለ
  choice: eintausendzweiundsechzig Tage
  rationale: Die Zahlzeichen ergeben 1000 + 60 + 2; das folgende መዋዕለ bezeichnet ausdrücklich „Tage“.
- source_word: ወለ፭ ዓም
  choice: – und in fünf Jahren …
  rationale: Der überlieferte Wortlaut beginnt einen zweiten Zeitraum („und für/in fünf Jahren“), bietet in der vorliegenden Zeile aber keine dazugehörige Summe. Gedankenstrich und Auslassungspunkte machen den unvollständigen Sinn sichtbar, ohne eine Zahl zu ergänzen.
theological_decisions:
- issue: Unvollständige oder beschädigte abschließende Kalenderangabe
  choice: Den erhaltenen Ansatz „und in fünf Jahren“ sichtbar unvollständig stehen lassen.
  alternative: Aus einer anderen Ausgabe oder durch rechnerische Rekonstruktion eine Fünfjahressumme ergänzen.
  rationale: Die vorgelegte geʿezische Textzeile enthält nach der Fünfjahresangabe keine erkennbare Summe. Eine Ergänzung im Haupttext würde eine nicht belegte Sicherheit erzeugen; daher wird der Textbefund transparent bewahrt.
- issue: Bedeutung von ወርኅ zwischen „Mond“ und „Monat“
  choice: „Mond“ im Haupttext, mit „Monat“ als Fußnotenalternative.
  alternative: „Monat“ beziehungsweise „ein einzelner Monat“.
  rationale: Die Summe von 1.062 Tagen entspricht drei Mondjahren zu 354 Tagen und spricht im astronomischen Kontext deutlich für den Mond als berechneten Himmelskörper beziehungsweise seinen Zyklus. Die lexikalische Mehrdeutigkeit bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sachlichem Ton für eine technische Kalenderangabe. Die Zahl wird ausgeschrieben. Der Gedankenstrich und die Auslassungspunkte kennzeichnen offen den abgebrochenen Schluss, statt ihn stillschweigend zu glätten oder zu ergänzen.
