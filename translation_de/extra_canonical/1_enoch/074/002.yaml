revisions:
- from: Und all dies zeigte mir Uriel, der heilige Engel, der sie alle führt, samt ihren Standorten. Ich schrieb ihre Standorte so auf, wie er sie mir zeigte, und ich schrieb ihre Monate auf, wie sie sind, sowie das Erscheinen ihrer Lichter[a], bis fünfzehn Tage vollendet waren.
  to: 'Alles, was Uriel, der heilige Engel, der sie alle führt, mir zeigte, schrieb ich auf: ihre Standorte, so wie er sie mir zeigte, ihre Monate, wie sie sind, und das Erscheinen ihrer Lichter[a] bis zur Vollendung von fünfzehn Tagen.'
  rationale: 'Die Revision stellt die Abfolge des Geʽez wieder her: Uriel zeigt, Henoch schreibt daraufhin Standorte, Monate und das Erscheinen der Lichter auf. Sie erhält die quellentreue Deutung von „Monate“ und der nominalen Form „Erscheinen“ gegen die abweichenden Angaben im englischen Audit-Trail und bewahrt die unaufgelösten Pronomen.'
