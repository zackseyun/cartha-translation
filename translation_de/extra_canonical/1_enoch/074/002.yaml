base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/002.yaml
  text: And all that Uriel[a], the holy angel who is their leader, showed me—I wrote down their positions as he showed them to me, and I wrote down their paths as they are[e][d][c][b], and I saw their lights until fifteen days were completed.
translation:
  language: de
  text: 'Alles, was Uriel, der heilige Engel, der sie alle führt, mir zeigte, schrieb ich auf: ihre Standorte, so wie er sie mir zeigte, ihre Monate, wie sie sind, und das Erscheinen ihrer Lichter[a] bis zur Vollendung von fünfzehn Tagen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Erscheinen“ oder „der Anblick ihrer Lichter“. ርእየ ist hier eine nominale Konstruktform, nicht „ich sah“; „schrieb ich auf“ ist als Verb auch für diesen letzten Gegenstand mitzudenken.'
    reason: grammar_and_ellipsis
lexical_decisions:
- source_word: ኵሎዘ
  choice: all dies
  rationale: Die umfassende Relativkonstruktion wird im Deutschen natürlich und ohne inhaltliche Einengung wiedergegeben.
- source_word: አርአየኒ
  choice: zeigte mir
  rationale: Das Verb bezeichnet ein Zeigen beziehungsweise Sehenlassen; „zeigte mir“ bewahrt den visionären, zugleich konkreten Sinn.
- source_word: መልአክ ቅዱስ
  choice: der heilige Engel
  rationale: Dies ist die geläufige und sachlich genaue Wiedergabe des Titels.
- source_word: መራሒሆሙ ለኵሎሙ
  choice: der sie alle führt
  rationale: Die verbale Formulierung gibt die leitende beziehungsweise führende Aufgabe Uriels wieder und klingt im modernen Deutschen natürlicher als „ihr aller Anführer“.
- source_word: ምንባሪሆሙ
  choice: ihre Standorte
  rationale: Im astronomischen Zusammenhang sind die geordneten Positionen der Himmelskörper gemeint; „Standorte“ erhält diesen räumlich-technischen Sinn.
- source_word: አውራኂሆሙ
  choice: ihre Monate
  rationale: Die Form ist der Plural mit Possessivsuffix zu ወርኅ, „Monat“, nicht ein Wort für Wege oder Bahnen.
- source_word: በከመ ሀለዉ
  choice: wie sie sind
  rationale: Die Wendung bezeichnet die Übereinstimmung der Aufzeichnung mit ihrem tatsächlichen Zustand oder ihrer Ordnung.
- source_word: ርእየ ብርሃኖሙ
  choice: das Erscheinen ihrer Lichter
  rationale: ርእየ wird als Konstruktform des Nomens „Erscheinung/Anblick“ verstanden, nicht als Verb in der ersten Person „ich sah“.
- source_word: እስከ ተፈጸመ ዐሡር ወኀሙስ መዋዕለ
  choice: bis fünfzehn Tage vollendet waren
  rationale: Die formale Vollendungsformulierung und der zeitliche Bezug bleiben erhalten.
theological_decisions:
- issue: Bezug der wiederholten Pronomen
  choice: Die Pronomen bleiben unaufgelöst und beziehen sich im Kontext naheliegend auf die zuvor behandelten Himmelskörper.
  alternative: Ausdrückliche Ergänzung „der Himmelskörper“ oder Bezug auf die ihnen zugeordneten Engelwesen.
  rationale: Der unmittelbare astronomische Kontext legt die Himmelskörper nahe; die nicht ausgeschriebenen Pronomen bewahren jedoch die Form und eine mögliche Restmehrdeutigkeit des Ausgangstextes.
- issue: Grammatische Deutung von ርእየ
  choice: 'Nominale Konstruktform: „das Erscheinen ihrer Lichter“.'
  alternative: 'Verbale Deutung: „ich sah ihre Lichter“.'
  rationale: Die vorliegende Form entspricht dem Nomen in Konstruktstellung; für ein Verb der ersten Person Singular wäre eine andere Form zu erwarten. Dadurch ist die Wendung als weiteres Objekt des elliptisch fortwirkenden „ich schrieb auf“ zu verstehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die teilweise reihende und verdichtete Struktur des ge'ezischen Textes bleibt erkennbar, wird aber durch Satzgliederung und die Ergänzung „samt“ lesbar gemacht. „Monate“ folgt der ge'ezischen Wortform gegen die im englischen Konsultationstext gebotene Wiedergabe „paths“.
