base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/010.yaml
  text: And five days are added[a], and for the sun it reaches thirty days; and all the days that accrue to it for one of those five years, when completed[c][b], amount to three hundred and sixty-four days.
translation:
  language: de
  text: Und fünf Tage werden hinzugefügt[a], und für die Sonne erreicht die Zählung dreißig Tage. Alle Tage, die ihr in einem jener fünf Jahre zufallen, ergeben, wenn sie vollständig gezählt sind[b][c], dreihundertvierundsechzig Tage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der äthiopische Wortlaut ist hier schwierig: Wörtlich steht „fünf Jahre“. Der kalendarische Zusammenhang und die Jahressumme von 364 Tagen legen jedoch „fünf Tage“ nahe.'
    reason: textual_variant
  - marker: b
    text: Das Astronomische Buch ordnet das Jahr nach einem Schema von 364 Tagen und nicht nach einer rein lunaren Rechnung.
    reason: cross_reference
  - marker: c
    text: 'Andere mögliche Wiedergabe des schwierigen Satzes: „Und die fünf Tage werden hinzugefügt, und für die Sonne kommen sie auf dreißig Tage; alle dem Jahr zugeteilten Tage ergeben, nachdem diese fünf Tage ergänzt worden sind, dreihundertvierundsechzig Tage.“'
    reason: alternative_rendering
lexical_decisions:
- source_word: ይትዌሰክ
  choice: werden hinzugefügt
  rationale: Die passive Bedeutung des Verbs und der kalendarische Zusammenhang sprechen für das Hinzufügen ergänzender Tage.
- source_word: ኃምስቱ ዓመት
  choice: fünf Tage
  rationale: Der überlieferte Wortlaut lautet wörtlich „fünf Jahre“, doch der unmittelbare Rechenzusammenhang legt hier „fünf Tage“ nahe; die textliche Schwierigkeit wird in der Fußnote offengelegt.
- source_word: ለፀሐይ
  choice: für die Sonne
  rationale: Die wörtliche Beziehung zur Sonne bewahrt den astronomischen Bezugsrahmen.
- source_word: ሠላሳ መዋዕለ
  choice: dreißig Tage
  rationale: Dies ist die natürliche deutsche Wiedergabe des kalendarischen Ausdrucks.
- source_word: ኵሎሙ መዋዕለ ይበጽሕዎ ለዓመት
  choice: alle Tage, die ihr … zufallen, ergeben
  rationale: Die Formulierung gibt sowohl das Erreichen beziehungsweise Zufallen als auch die resultierende Gesamtsumme wieder.
- source_word: ፭እምእሉኩ ፭ዓመት ተመሊኦሙ
  choice: in einem jener fünf Jahre … wenn sie vollständig gezählt sind
  rationale: Die Stelle ist offenbar fehlerhaft oder unsicher überliefert. „Einem“ folgt der plausiblen Korrektur der ersten Zahl zu ፩; die deutsche Fassung bleibt dennoch nahe an der syntaktischen Spannung des Textes.
- source_word: ፻፷ወ፰ወረቡዐ መዋዕለ
  choice: dreihundertvierundsechzig Tage
  rationale: Die Zahl entspricht dem ausdrücklich vorausgesetzten 364-Tage-Schema des Astronomischen Buches; die vorliegende Transkription ist an dieser Stelle beschädigt.
theological_decisions:
- issue: Bedeutung der fünf hinzugefügten Einheiten
  choice: Die fünf Einheiten werden im Haupttext als ergänzende Tage wiedergegeben.
  alternative: Eine streng buchstäbliche Wiedergabe des erhaltenen ዓመት wäre „fünf Jahre“.
  rationale: Der jährliche Gesamtwert von 364 Tagen und der kalendarische Zusammenhang verlangen wahrscheinlich Tage; da der überlieferte Wortlaut abweicht, wird die Unsicherheit nicht verschwiegen.
- issue: Bezug auf eines der fünf Jahre
  choice: Die mehrjährige Bezugsgröße bleibt als „einem jener fünf Jahre“ erhalten.
  alternative: Man könnte die gesamte Aussage ausschließlich auf die fünf Ergänzungstage eines einzelnen Jahres beziehen.
  rationale: So bleibt die im Text erkennbare Spannung zwischen Ergänzungstagen und einem Fünfjahresbezug sichtbar, statt sie durch Harmonisierung zu beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wendung „die Zählung“ verdeutlicht das unpersönliche „es erreicht“, ohne den astronomischen Sinn festzulegen. Die echte textliche Unsicherheit zwischen „Tagen“ und „Jahren“ wird im Haupttext nicht unnötig verkompliziert, aber in den Fußnoten ausdrücklich dokumentiert.
