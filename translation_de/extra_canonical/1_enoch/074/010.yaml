review_pass:
  verdict: revise
  source_fidelity: Die Fassung gibt die ausdrücklich genannte Gesamtsumme von 364 Tagen wieder und behandelt die erste, im Geʽez als „fünf Jahre“ lesbare Einheit mit einer transparenten textkritischen Fußnote. Der Haupttext vermischt jedoch die kontextuelle Lesart „fünf Tage“ mit „einem jener fünf Jahre“ und erzeugt dadurch eine unbegründete und schwer verständliche Konstruktion. Die unsichere Syntax sollte nicht stärker harmonisiert werden, als es der Kontext erlaubt.
  naturalness: „Für die Sonne erreicht die Zählung dreißig Tage“ und insbesondere „die ihr in einem jener fünf Jahre zufallen“ sind im Deutschen unnötig sperrig und der Bezug von „ihr“ ist nicht sicher erkennbar. Eine knappe, unpersönliche Formulierung bleibt näher an der schwierigen Vorlage und ist zugleich lesbar.
  terminology: „hinzugefügt“, „Sonne“, „Tage“ und „dreihundertvierundsechzig Tage“ sind angemessen. Die Fußnoten sollen die konkurrierende Lesart „fünf Jahre“ ausdrücklich als erhaltenen Wortlaut dokumentieren, ohne die Rekonstruktion als Gewissheit auszugeben.
  issues:
  - severity: medium
    issue: Unstimmige Verbindung von „fünf Tage“ mit „einem jener fünf Jahre“ im Haupttext
    rationale: Die Übersetzung übernimmt zwei miteinander spannungsreiche Deutungen derselben schwierigen Zahlenangaben. Der Satz wird dadurch nicht nur schwer verständlich, sondern lässt auch eine textliche Rekonstruktion sicherer erscheinen, als sie ist.
  - severity: medium
    issue: Fußnote c bietet eine zu stark harmonisierende Alternativwiedergabe
    rationale: „Nachdem diese fünf Tage ergänzt worden sind“ ist im erhaltenen, textlich schwierigen Wortlaut nicht klar ausgedrückt und verdeckt die Lesart „fünf Jahre“. Die Alternative sollte die Unsicherheit beschreiben statt eine zusätzliche Erklärung in den Text einzutragen.
  - severity: low
    issue: Unklarer Bezug von „ihr“ und schwerfällige Wendung „für die Sonne erreicht die Zählung“
    rationale: Die Formulierung ist nicht idiomatisch und macht nicht deutlich, ob sich „ihr“ auf die Sonne oder die Zählung bezieht.
  revised_text: Und fünf Tage werden hinzugefügt[a], und bei der Sonne ergibt sich eine Zahl von dreißig Tagen. Und alle Tage belaufen sich, wenn das Jahr vollendet ist[b][c], auf dreihundertvierundsechzig Tage.
  revised_footnotes:
  - marker: a
    text: 'Der äthiopische Wortlaut ist hier schwierig: Wörtlich steht „fünf Jahre“. Der kalendarische Zusammenhang und die Jahressumme von 364 Tagen legen jedoch „fünf Tage“ nahe.'
    reason: textual_variant
  - marker: b
    text: Das Astronomische Buch ordnet das Jahr nach einem Schema von 364 Tagen und nicht nach einer rein lunaren Rechnung.
    reason: cross_reference
  - marker: c
    text: 'Der Satz ist im Äthiopischen syntaktisch und in den Zahlenangaben schwierig. Möglich ist auch eine engere Wiedergabe: „Und fünf Tage werden hinzugefügt; bei der Sonne ergibt sich eine Zahl von dreißig Tagen. Alle Tage ergeben, wenn eines jener fünf Jahre vollendet ist, dreihundertvierundsechzig Tage.“'
    reason: alternative_rendering
  revision_rationale: Die Revision beseitigt die im deutschen Haupttext entstandene Vermischung von ergänzenden Tagen und einem Fünfjahresbezug. Sie gibt die im Kontext wahrscheinliche Lesart knapp wieder, belässt die problematische alternative Zahlenangabe aber ausdrücklich in der Fußnote. Der unklare syntaktische Mittelteil wird nicht durch eine zusätzliche, nicht sichere Erklärung („die ihr zufallen“) ausgelegt.
