base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/001.yaml
  text: 'And I saw for it another course and regulation: by that regulation it makes its course of the months[a][b][c].'
translation:
  language: de
  text: 'Und ich sah für ihn einen weiteren Lauf und eine Ordnung: Nach dieser Ordnung vollzieht er seinen Lauf der Monate.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Genitivfügung kann einen durch die Monate bestimmten, also monatlichen Lauf bezeichnen.
    reason: syntaktische_ambiguität
lexical_decisions:
- source_word: ካልአ
  choice: einen weiteren
  rationale: Bezeichnet einen zusätzlichen Lauf in der Abfolge; „weiteren“ klingt im Deutschen natürlich und bewahrt diesen Sinn.
- source_word: ምሕዋረ
  choice: Lauf
  rationale: Bezeichnet im astronomischen Zusammenhang eine geordnete Bewegung oder Umlaufbahn, ohne moderne Fachterminologie aufzudrängen.
- source_word: ትእዛዘ
  choice: Ordnung
  rationale: Gemeint ist hier eher eine festgelegte kosmische Regelung als ein ausgesprochener Befehl.
- source_word: ርኢኩ
  choice: ich sah
  rationale: Bewahrt die schlichte visionäre Berichtsformel des Ausgangstextes.
- source_word: ሎቱ
  choice: für ihn
  rationale: Gibt den Bezug auf den zuvor behandelten Himmelskörper wieder; das grammatische Geschlecht folgt dem deutschen Kontextbegriff.
- source_word: በውእቱ ትእዛዝ
  choice: Nach dieser Ordnung
  rationale: Drückt die maßgebende Norm aus, gemäß der die Bewegung erfolgt.
- source_word: ይገብር
  choice: vollzieht er
  rationale: Erhält den aktiven Sinn des Ausführens oder Vollbringens und klingt bei einem geordneten Lauf idiomatisch.
- source_word: ምሕዋሮ ዘአውራኅ
  choice: seinen Lauf der Monate
  rationale: Bewahrt die Genitivkonstruktion und die Wiederholung von „Lauf“; አውራኅ bedeutet hier „Monate“, nicht „Winde“.
theological_decisions:
- issue: Art der kosmischen Ordnung
  choice: Eine festgelegte Ordnung bestimmt den kosmischen beziehungsweise kalendarischen Lauf.
  alternative: Ein unmittelbar an den Himmelskörper gerichteter Befehl.
  rationale: Der Kontext beschreibt geregelte Bewegungen der Schöpfung. „Ordnung“ wahrt den kosmologischen Sinn, ohne persönliche Befehlsrede oder eine bestimmte theologische Auslegung vorauszusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „Ordnung“ und „Lauf“ spiegelt bewusst die technische, formelhafte Ausdrucksweise des ge'ezischen Textes; die ungewöhnliche Schlusswendung wird nicht stillschweigend geglättet.
