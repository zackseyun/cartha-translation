base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/009.yaml
  text: 'Thus I saw their workings: how the moon rises and the sun sets in those days[a][b].'
translation:
  language: de
  text: 'So sah ich ihr Wirken: wie in jenen Tagen die Monde aufgehen[a] und die Sonne untergeht.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier eine Pluralform, die »Monde« oder »Monate« bedeuten kann. Die Wiedergabe »Monde« folgt der Parallele zum Untergehen der Sonne; gemeint sein können die wiederkehrenden monatlichen Erscheinungen des Mondes.
    reason: lexical_number_ambiguity
lexical_decisions:
- source_word: ከመዝ
  choice: So
  rationale: Leitet die zusammenfassende visionäre Beobachtung natürlich und zugleich würdig ein.
- source_word: ርኢኩ
  choice: sah ich
  rationale: Direkte Wiedergabe des Verbs der Wahrnehmung in der ersten Person.
- source_word: ምግባሮሙ
  choice: ihr Wirken
  rationale: Bezeichnet hier die beobachtbaren Vorgänge der Himmelskörper, nicht moralische Taten; der deutsche Kollektivsingular klingt natürlich.
- source_word: በከመ
  choice: wie
  rationale: Führt den Inhalt der Beobachtung ein.
- source_word: ይሠርቅ
  choice: aufgeht
  rationale: Das mit ሠ geschriebene Verb bezeichnet hier das Aufgehen eines Himmelskörpers und ist nicht mit dem ähnlich geschriebenen Verb für »stehlen« zu verwechseln.
- source_word: አውራኅ
  choice: der Mond
  rationale: Die Form ist formal pluralisch und kann »Monde« oder »Monate« bedeuten; im parallelen astronomischen Satzgefüge ist im Deutschen der kollektive Singular »der Mond« sachlich und idiomatisch.
- source_word: የዓርብ
  choice: untergeht
  rationale: Idiomaticher deutscher Ausdruck für das abendliche Sinken der Sonne.
- source_word: ፀሐይ
  choice: die Sonne
  rationale: Direkte Wiedergabe des genannten Himmelskörpers.
- source_word: በእማንቱ መዋዕል
  choice: in jenen Tagen
  rationale: Bewahrt die zeitliche Formel und bezieht sie durch ihre Stellung natürlich auf beide Vorgänge.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem visionärem Ton. Die astronomische Parallelität zwischen dem Aufgehen des Mondes und dem Untergehen der Sonne bleibt erhalten; die frühere Deutung als »Pfade stehlen sich davon« beruht auf der Verwechslung ähnlich geschriebener äthiopischer Wörter.
