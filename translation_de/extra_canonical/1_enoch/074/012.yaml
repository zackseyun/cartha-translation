base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/012.yaml
  text: And the sun and the stars bring in all the years exactly[a]; according to their stations forever, they do not advance or fall behind by a single day, but they complete the year in righteousness, exactly[d][c][b], in three hundred and sixty-four days.
translation:
  language: de
  text: Und Sonne und Sterne lassen alle Jahre genau eintreten[a]; nach ihren Stellungen für immer gehen sie nicht einen einzigen Tag voraus und bleiben nicht zurück, sondern sie lassen das Jahr in Gerechtigkeit[b] genau in dreihundertvierundsechzig Tagen umschlagen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „präzise“. Das ge''ezische Wort betont die sorgfältige Genauigkeit der Berechnung durch die Himmelskörper.'
    reason: lexical_alternative
  - marker: b
    text: „In Gerechtigkeit“ kann hier auch „richtig“ oder „ordnungsgemäß“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: Das Verb kann „ändern“, „wenden“ oder „umschlagen“ bedeuten. Die Übersetzung gibt den zyklischen Wechsel des Jahres wieder, ohne ihn auf ein bloßes Vollenden festzulegen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ያመጽእሙ
  choice: führen … herbei
  rationale: Bewahrt das konkrete, kausative Bild, dass Sonne und Sterne die Jahre herbeiführen beziehungsweise ihren Eintritt bestimmen.
- source_word: ጥንቁቃት / ጥንቁቀ
  choice: genau
  rationale: Gibt die sorgfältige Präzision der astronomischen und kalendarischen Ordnung natürlich wieder.
- source_word: ከመ ምንባሪሆሙ ለዓለም
  choice: gemäß ihren Stellungen für immer
  rationale: Gibt sowohl ከመ im Sinn von „gemäß“ als auch das ausdrücklich vorhandene Substantiv „ihre Stellungen/Wohnstätten“ wieder und wahrt die Aussage ihrer dauerhaften festen Ordnung.
- source_word: ኢይበድሩ ወኢይጐንዱ
  choice: gehen sie … nicht voraus und bleiben … nicht zurück
  rationale: Die symmetrische deutsche Wendung bewahrt die zeitlich-kalendarische Vorstellung, dass die Himmelskörper weder vor- noch nachgehen.
- source_word: አሐተ ዕለተ
  choice: keinen einzigen Tag
  rationale: Drückt das Maß selbst der kleinsten Abweichung klar und idiomatisch aus.
- source_word: ይዌልጡ ዓመተ
  choice: sie vollenden das Jahr
  rationale: Im kalendarischen Zusammenhang bezeichnet die Wendung das Zu-Ende-Führen beziehungsweise Umschlagen des Jahreszyklus; „vollenden“ ergibt den Zusammenhang natürlich, ohne den zyklischen Vorgang technisch zu verengen.
- source_word: በጽድቅ
  choice: in Gerechtigkeit
  rationale: Bewahrt bewusst die moralisch-theologische Färbung des ge'ezischen Ausdrucks, statt ihn auf bloße rechnerische Korrektheit zu reduzieren.
- source_word: ፫፻ወ፷ወረቡዕ መዋዕለ
  choice: dreihundertvierundsechzig Tagen
  rationale: Gibt die für den Kalenderabschnitt zentrale Zahl vollständig und eindeutig wieder.
theological_decisions:
- issue: Soll በጽድቅ rein technisch oder mit seiner theologischen Bedeutung wiedergegeben werden?
  choice: in Gerechtigkeit
  alternative: richtig / ordnungsgemäß
  rationale: Der Text verbindet kosmische Genauigkeit mit einer wertgeladenen, gerechten Ordnung. Die stärkere Formulierung wahrt diese Spannung.
- issue: Wie ist ይዌልጡ im Zusammenhang mit dem Jahreslauf zu verstehen?
  choice: sie vollenden das Jahr
  alternative: sie lassen das Jahr umschlagen / sie verändern das Jahr
  rationale: Der lexikalische Grundsinn kann ein Ändern oder Umschlagen bezeichnen; im Satz geht es um den ordnungsgemäßen Abschluss des 364-tägigen Zyklus. Die Hauptfassung folgt diesem Kontext, während die Anmerkung die echte lexikalische Alternative offenhält.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur folgt der ge'ezischen Gedankenfolge, verwendet jedoch ein Semikolon zur klaren Gliederung. Sämtliche Fußnotenmarker stehen im Haupttext.
