base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/008.yaml
  text: And again[a], it returns for seven days to the fourth gate[c][b], from which the sun comes out.
translation:
  language: de
  text: Und wieder kehrt es[a] sieben Tage lang zum vierten Tor zurück[b], aus dem die Sonne hervorkommt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Subjekt ist im Ge’ez nicht ausdrücklich genannt; gemeint ist das im Zusammenhang beschriebene Gestirn beziehungsweise dessen Lauf.
    reason: source_ambiguity
  - marker: b
    text: 'Auch möglich: „kehrt sieben Tage lang durch das vierte Tor zurück“ oder „kehrt sieben Tage lang am vierten Tor zurück“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ካዕበ
  choice: wieder
  rationale: Kennzeichnet die erneute, zyklische Bewegung und bewahrt den wiederholenden Erzählstil des Abschnitts.
- source_word: ይገብእ
  choice: kehrt … zurück
  rationale: Das Verb ገብአ bezeichnet hier die Rückkehr beziehungsweise das Zurückkehren, nicht primär das Eintreten.
- source_word: ሰቡዐ መዋዕለ
  choice: sieben Tage lang
  rationale: Gibt die zeitliche Dauer natürlich und zugleich präzise wieder.
- source_word: በራብዕት ኆኅት
  choice: zum vierten Tor
  rationale: Die Präposition በ ist mehrdeutig. Im Zusammenhang mit dem Verb der Rückkehr bezeichnet die Formulierung hier am ehesten das Ziel beziehungsweise den zugeordneten Ort; eine instrumentale oder lokale Wiedergabe bleibt möglich.
- source_word: እንተ እምኔሃ
  choice: aus dem
  rationale: Der Relativausdruck verweist auf das zuvor genannte Tor; das grammatische Geschlecht wird im Deutschen an „Tor“ angepasst.
- source_word: ይወፅእ ፀሐይ
  choice: die Sonne hervorkommt
  rationale: Bewahrt das konkrete Bild der Sonne, die aus einem himmlischen Tor hervortritt, in natürlichem, würdigem Deutsch.
theological_decisions:
- issue: Unausgesprochenes Subjekt von ይገብእ
  choice: es, mit Fußnote zur fehlenden ausdrücklichen Benennung
  alternative: sie (die Sonne)
  rationale: Der gegebene Vers nennt das Subjekt des Verbs nicht ausdrücklich. Da die anschließend genannte Sonne grammatisch nicht zwingend dasselbe Subjekt sein muss, wird die Identität des Gestirns nicht stillschweigend festgelegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die knappe, wiederholende Ausdrucksweise des astronomischen Abschnitts bleibt erhalten; echte syntaktische und präpositionale Mehrdeutigkeit wird in den Fußnoten offengelegt.
