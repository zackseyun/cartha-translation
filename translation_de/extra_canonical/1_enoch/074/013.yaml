base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/074/013.yaml
  text: For three years there are one thousand ninety-two days[a], and for five years, one thousand eight hundred twenty days and eight; thus for eight years there are two thousand nine hundred twelve days, and ten and two days.
translation:
  language: de
  text: Für drei Jahre sind es eintausendzweiundneunzig Tage[a], und für fünf Jahre eintausendachthundertzwanzig Tage und acht; so sind es für acht Jahre zweitausendneunhundertzwölf Tage und zehn und zwei Tage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Zahlenfolge dieser äthiopischen, durch OCR erfassten Zeile ist schwierig. Offenbar werden die Tage für Zeiträume von drei, fünf und acht Jahren zusammengerechnet; die Schlussformulierung könnte jedoch eine geteilte oder ungewöhnlich angeordnete Zahl bewahren. Geglättet ließe sich der Vers so wiedergeben: „Für drei Jahre sind es 1.092 Tage, für fünf Jahre 1.828 Tage; so sind es für acht Jahre 2.912 Tage.“'
    reason: textual_variant
lexical_decisions:
- source_word: ለ፫ዓም
  choice: für drei Jahre
  rationale: Die Präposition ለ mit der Zeitangabe bezeichnet hier im astronomisch-kalendarischen Zusammenhang den Zeitraum, dem die berechnete Tagessumme entspricht.
- source_word: መዋዕለ
  choice: Tage
  rationale: መዋዕል ist die gewöhnliche Bezeichnung für Tage und dient hier als Einheit der Kalenderrechnung.
- source_word: ፲፻ወ፺ወክልኤ
  choice: eintausendzweiundneunzig
  rationale: Die Zahlzeichen werden additiv als 1000 + 90 + 2 gelesen.
- source_word: ወለ፭ዓመት
  choice: und für fünf Jahre
  rationale: Dies setzt dasselbe Berechnungsmuster wie im ersten Satzglied fort.
- source_word: ፲ወ፰፻፳መዋዕለ፡ ወ፰
  choice: eintausendachthundertzwanzig Tage und acht
  rationale: Die überlieferte beziehungsweise OCR-erfasste Wortfolge setzt „Tage“ vor die abschließende Acht. Die Übersetzung bewahrt diese auffällige additive Struktur, statt sie stillschweigend zu 1.828 Tagen zu glätten.
- source_word: ከመ፡ ይኩን
  choice: so sind es
  rationale: Im Zusammenhang leitet die Wendung das Ergebnis der vorangehenden Berechnung ein; die deutsche Formulierung gibt dies natürlich wieder, ohne einen Zweck auszudrücken.
- source_word: ለ፰ዓመት
  choice: für acht Jahre
  rationale: Die Wendung bezeichnet erneut den Zeitraum, für den die Tagessumme angegeben wird.
- source_word: ፪ወ፱፻፲፪
  choice: zweitausendneunhundertzwölf
  rationale: Die Zahl wird additiv als 2000 + 900 + 12 gelesen.
- source_word: ወዓሡር፡ ወስኑይ፡ መዋዕለ
  choice: und zehn und zwei Tage
  rationale: Die auffällige Schlussformulierung nennt zehn und zwei ausdrücklich getrennt. Diese additive Gestalt bleibt zur Nachprüfbarkeit des schwierigen Zeugen erhalten.
theological_decisions:
- issue: Kalendarische Rechnung in einer textlich beziehungsweise durch OCR schwierigen äthiopischen Zeile
  choice: Die Folge der Tagessummen für drei, fünf und acht Jahre wird einschließlich der auffälligen abschließenden Zusätze bewahrt.
  alternative: Die Zahlen zu „1.092 Tage; 1.828 Tage; daher 2.912 Tage“ glätten und die Schlusswörter fortlassen.
  rationale: Es handelt sich nicht um eine Lehrfrage, sondern um textliche Transparenz. Da die Zahlen für das Astronomische Buch wesentlich sind, soll die schwierige Überlieferung sichtbar bleiben und nicht stillschweigend harmonisiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ausgeschriebenen Zahlen und die bewusst unbeholfene additive Syntax erhalten die Form des schwierigen äthiopischen Zeugen; die Fußnote bietet die rechnerisch geglättete Lesart.
