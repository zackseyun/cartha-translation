base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/013/004.yaml
  text: And they asked me to write for them a petition of remembrance[a], so that there might be forgiveness for them[c][b], and that I might bring it up
translation:
  language: de
  text: Und sie baten mich, für sie eine Bittschrift zum Gedenken[a] zu verfassen, damit ihnen Vergebung zuteilwürde und damit ich sie hinaufbrächte[b] …
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ein Gedenkgebet“ beziehungsweise „eine schriftliche Bitte zur Erinnerung“. Der ge’ezische Ausdruck verbindet die Vorstellungen von Gedenken und flehentlicher Bitte.'
    reason: lexical_alternative
  - marker: b
    text: Der Satz endet in der hier überlieferten Verseinteilung unvollständig und wird im folgenden Text fortgeführt. Das Verb bedeutet kausativ „hinaufbringen“ oder „emporbringen“, nicht lediglich „hinaufsteigen“. „Sie“ verweist auf die zuvor genannte Bittschrift.
    reason: textual_variant
lexical_decisions:
- source_word: ተስእሉኒ
  choice: sie baten mich
  rationale: Das Verb bezeichnet ein eindringliches Bitten oder Ersuchen. „Sie baten mich“ ist natürliches modernes Deutsch und gibt den unmittelbaren Appell wieder.
- source_word: እጽሐፍ
  choice: zu verfassen
  rationale: Im Zusammenhang mit einer schriftlichen Eingabe bezeichnet das Wort nicht nur den Schreibvorgang, sondern das Abfassen des erbetenen Textes.
- source_word: ተዝካረ ስእለት
  choice: eine Bittschrift zum Gedenken
  rationale: 'Die Wiedergabe bewahrt beide Bedeutungselemente: ተዝካር bezeichnet Erinnerung beziehungsweise Gedenken, ስእለት eine Bitte oder ein Flehen. „Bittschrift“ macht zugleich deutlich, dass Henoch ein Schriftstück verfassen soll, ohne dessen genaue kultische oder gerichtliche Funktion festzulegen.'
- source_word: ይኩኖሙ ኅድገተ
  choice: damit ihnen Vergebung zuteilwürde
  rationale: ኅድገት kann Loslassung, Erlass oder Vergebung bezeichnen. Im Kontext des erbetenen Aufschubs vom Gericht ist „Vergebung“ naheliegend; „zuteilwürde“ erhält den Wunsch- und Möglichkeitscharakter.
- source_word: አዕርግ
  choice: damit ich hinaufbrächte
  rationale: Die Form ist kausativ und bedeutet „hinaufbringen“ beziehungsweise „emporbringen“, nicht bloß intransitiv „hinaufsteigen“. Da das ausdrückliche Objekt im vorliegenden Versabschnitt fehlt, bleibt auch die deutsche Wendung bewusst unvollständig.
theological_decisions:
- issue: Art des von den Wächtern erbetenen Schriftstücks
  choice: Bittschrift zum Gedenken
  alternative: Gedenkgebet; schriftliche Bitte zur Erinnerung
  rationale: Die Formulierung lässt eine Eingabe vor dem himmlischen Gericht anklingen, bestimmt sie aber nicht eindeutig als liturgisches Gebet. Die Übersetzung bewahrt diese Spannung und vermeidet eine konfessionelle Festlegung.
- issue: Bedeutung des erhofften ኅድገት
  choice: Vergebung
  alternative: Erlass; Freilassung
  rationale: „Vergebung“ passt zum Zusammenhang von Schuld und Gericht, ohne vorwegzunehmen, ob die Bitte tatsächlich gewährt wird.
- issue: Unvollständiger Schlusssatz
  choice: damit ich hinaufbrächte …
  alternative: damit ich sie hinaufbrächte
  rationale: Der überlieferte Ausschnitt endet, bevor das Objekt ausdrücklich genannt wird. Es wird daher kein Gegenstand ergänzt; die Ellipse verweist auf die Fortsetzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Bittschrift“ wahrt den schriftlichen und bittenden Charakter; die bewusst unvollständige Schlusswendung folgt der vorliegenden Überlieferung und Verseinteilung.
