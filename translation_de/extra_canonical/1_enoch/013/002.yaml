base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/013/002.yaml
  text: And no mercy or petition will be granted to you[a], because of the violence that you have taught[c][b], and because of all the works of blasphemy and violence and sin that you have shown to humankind.
translation:
  language: de
  text: Und weder Erbarmen noch Fürbitte wird dir zuteilwerden[a] wegen der Gewalt, die du gelehrt hast, und wegen all der Werke der Lästerung, der Gewalt und der Sünde, die du den Menschen gezeigt hast[b][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die vorliegende äthiopische Transkription hat ሣሕት; dies gilt wahrscheinlich als OCR-Fehler für ሣህል, „Erbarmen“, „Gnade“ oder „Linderung“. Bei wörtlicher Auswertung der fehlerhaften Form wäre auch eine Wiedergabe als „Bitte“ erwogen worden.
    reason: textual_variant
  - marker: b
    text: 'Oder: „die du den Menschen offenbart hast“. Das äthiopische Verb kann bedeuten, etwas sichtbar oder bekannt zu machen.'
    reason: lexical_alternative
  - marker: c
    text: „Lästerung“ kann hier auch Schmähung, frevelhaftes Verhalten oder trotzige Anmaßung einschließen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሣሕት (wohl OCR für ሣህል)
  choice: Erbarmen
  rationale: Die überlieferte Transkription scheint hier einen OCR-Fehler zu enthalten; ሣህል bezeichnet Erbarmen, Gnade oder Linderung. „Erbarmen“ passt zum gerichtlichen Zusammenhang und vermeidet die unzutreffende Verdoppelung „Bitte und Flehen“.
- source_word: ስእለት
  choice: Fürbitte
  rationale: Das Wort bezeichnet eine Bitte oder ein Flehen. „Fürbitte“ entspricht dem Kontext, in dem für den verurteilten Wächter eingetreten werden soll.
- source_word: ኢይከውከ
  choice: wird dir nicht zuteilwerden
  rationale: Die negative Verbform von „sein/werden“ mit Dativ drückt hier aus, dass Erbarmen und Fürbitte für den Angeredeten nicht eintreten oder wirksam werden.
- source_word: ዘመሀርከ
  choice: die du gelehrt hast
  rationale: Die Form bezeichnet das Lehren beziehungsweise Vermitteln und trägt im Kontext die Anklage verbotener Unterweisung.
- source_word: ግፍዐ / ወግፍዕ
  choice: Gewalttat
  rationale: „Gewalttat“ wahrt die konkrete moralische und gesellschaftliche Schwere des Begriffs; mögliche weitere Bedeutungen sind Unterdrückung und Unrecht.
- source_word: ምግባረ
  choice: Werke
  rationale: „Werke“ erhält den konkreten, gehobenen Charakter der Anklageformel.
- source_word: ጽርፈት
  choice: Lästerung
  rationale: Der Ausdruck kann frevelhaftes, schmähendes Reden oder Verhalten bezeichnen. „Lästerung“ bewahrt den religiös-gerichtlichen Ton, ohne ihn ausdrücklich auf Gotteslästerung zu verengen.
- source_word: ሓጢአት
  choice: Sünde
  rationale: „Sünde“ ist die natürliche umfassende Wiedergabe und erhält die steigernde Reihe der Anklagepunkte.
- source_word: ዘአርአይከ
  choice: die du den Menschen gezeigt hast
  rationale: Das Verb bedeutet „zeigen“ oder „sichtbar/bekannt machen“. Die Hauptfassung bleibt nah am Wortlaut; die mögliche Nuance „offenbart“ wird in einer Fußnote festgehalten.
- source_word: ለሰብእ
  choice: den Menschen
  rationale: Der Ausdruck bezieht sich hier allgemein auf die Menschheit; „den Menschen“ ist im modernen Deutschen natürlich und inklusiv.
theological_decisions:
- issue: Art des ersten verweigerten Gutes
  choice: Erbarmen
  alternative: Bitte
  rationale: Die jüngste Quellenprüfung erkennt im transkribierten ሣሕት einen OCR-Fehler für ሣህል („Erbarmen“, „Gnade“, „Linderung“). Dadurch bildet der Vers nicht bloß ein rhetorisches Synonympaar für Gebet, sondern verweigert sowohl Erbarmen als auch Fürbitte.
- issue: Art des Vergehens im Schlusssatz
  choice: Der Vers beschuldigt den Wächter, den Menschen Gewalttat gelehrt und verderbliche Werke gezeigt beziehungsweise vermittelt zu haben.
  alternative: Die Aussage könnte schwächer bedeuten, dass er diese Taten lediglich vor den Menschen zur Schau stellte; „offenbart“ könnte dagegen die Weitergabe geheimen Wissens stärker hervorheben.
  rationale: Die Verbindung von „gelehrt“ und „gezeigt“ stützt im unmittelbaren Kontext die Weitergabe verderblicher Kenntnisse oder Praktiken. Die Übersetzung lässt mit „gezeigt“ dennoch offen, ob Unterweisung, Offenbarung oder Vorführung im Vordergrund steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gerichtlichem Klang. Die Aufzählung bleibt bewusst schwer und kumulativ. Das Singularpronomen „dir/du“ folgt der äthiopischen Anrede; „den Menschen“ bezeichnet die Menschheit allgemein.
