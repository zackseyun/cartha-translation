base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/013/001.yaml
  text: 'And Enoch went and said to Azazel[a], “You shall have no peace; a great sentence has gone out against you: you will be bound.”'
translation:
  language: de
  text: 'Und Henoch ging hin und sagte zu Asasel: »Du wirst keinen Frieden haben. Ein gewaltiges Urteil[a] ist gegen dich ergangen: Du wirst gefesselt werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Richterspruch«, »Strafurteil« oder »Verurteilung«. Das ge’ezische Wort ist juristisch geprägt und leitet die folgende Strafe ein.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኃሊፎ
  choice: ging hin
  rationale: Gibt Henochs Bewegung vor dem Sprechen natürlich wieder, ohne eine im Text nicht bezeichnete Richtung hinzuzufügen.
- source_word: ይቤሎ
  choice: sagte zu
  rationale: Entspricht dem schlichten Redeverb und vermeidet zusätzliche rhetorische Schärfe.
- source_word: አዛዝኤል
  choice: Asasel
  rationale: Der Eigenname wird in einer im Deutschen geläufigen Form transliteriert, nicht übersetzt.
- source_word: ኢይከውከ ሰላም
  choice: Du wirst keinen Frieden haben
  rationale: 'Bewahrt die feierliche Gerichtsformel und bezeichnet mehr als das Fehlen innerer Ruhe: Asasel wird kein Wohlergehen zuteil.'
- source_word: ዓቢይ
  choice: gewaltiges
  rationale: Gibt die verstärkende Wirkung des Adjektivs in natürlichem, würdigem Deutsch wieder; gemeint ist die Tragweite beziehungsweise Schwere des Urteils.
- source_word: ኵነኔ
  choice: Urteil
  rationale: Bewahrt den juristischen Sinn, ohne vorschnell zwischen Richterspruch, Verurteilung und Strafurteil festzulegen.
- source_word: ወጽአ ላዕሌከ
  choice: ist gegen dich ergangen
  rationale: Die deutsche Rechts- und Verkündigungssprache gibt das Bild eines hervorgegangenen, gegen Asasel gerichteten Spruchs idiomatisch wieder.
- source_word: ይእስርከ
  choice: Man wird dich fesseln
  rationale: Gibt das Binden als bevorstehende Strafhandlung klar wieder und lässt den im Satz nicht ausdrücklich genannten Handelnden offen.
theological_decisions:
- issue: Bedeutung der Friedensformel im Gerichtswort
  choice: Du wirst keinen Frieden haben
  alternative: Für dich wird es keinen Frieden geben
  rationale: Die Aussage ist keine gewöhnliche Gruß- oder Abschiedsformel, sondern verweigert dem verurteilten Wächter Frieden und Wohlergehen. Die gewählte Form bewahrt den apokalyptischen Ernst.
- issue: Juristische Nuance von ኵነኔ
  choice: Urteil
  alternative: Richterspruch; Strafurteil; Verurteilung
  rationale: Der Begriff bezeichnet eine rechtliche Entscheidung mit strafender Folge. »Urteil« ist breit genug, um die echte lexikalische Spannung nicht einseitig aufzulösen.
- issue: Nicht genannter Vollstrecker der Fesselung
  choice: Man wird dich fesseln
  alternative: Du wirst gefesselt werden; um dich zu fesseln
  rationale: Die Übersetzung benennt keinen Täter, den der Ausgangstext hier nicht ausdrücklich nennt. Zugleich macht sie die angekündigte Fesselung als Folge des Urteils verständlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit feierlichem apokalyptischem Ton. Direkte und verständliche Syntax; keine konfessionell geprägte Deutung. Der Doppelpunkt macht die Fesselung als Folge beziehungsweise Inhalt des ergangenen Urteils kenntlich, ohne das genaue syntaktische Verhältnis stärker festzulegen als nötig.
