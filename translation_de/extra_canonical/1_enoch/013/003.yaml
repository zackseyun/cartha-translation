  yaml_path: translation/extra_canonical/1_enoch/013/003.yaml
  text: Then I went and spoke to them all together[a], and they all feared, and fear and trembling seized them.
translation:
  language: de
  text: Dann ging ich hin und redete zu allen, die versammelt waren; und sie alle fürchteten sich, und Furcht und Zittern ergriffen sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Vorlage häuft Ausdrücke der Angst: Sie „fürchteten sich“, und anschließend ergriffen sie „Furcht und Zittern“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እሜሃ
  choice: Dann
  rationale: Die temporal-sequenzielle Partikel führt den nächsten Schritt der Erzählung ein, ohne den Zeitpunkt näher festzulegen.
- source_word: ሐዊርየ
  choice: ging ich hin
  rationale: Die Form bezeichnet das Gehen; „ging ich hin“ ist im Deutschen ein natürlicher erzählerischer Anschluss.
- source_word: ነገርክዎሙ
  choice: redete zu ihnen
  rationale: Das Verb bezeichnet Sprechen oder Mitteilen und enthält einen Objektbezug; die Formulierung passt zu Henochs Anrede an die Wächter.
- source_word: ለኵሎሙ ኅቡረ
  choice: zu ihnen allen gemeinsam
  rationale: Bewahrt sowohl die ausdrückliche Gesamtheit als auch den Gedanken, dass sie als versammelte Gruppe angesprochen wurden.
- source_word: ወእሙንቱ ኵሎሙ
  choice: und sie alle
  rationale: Die Wiederholung der Gesamtheit wird entsprechend dem Stil der Vorlage beibehalten.
- source_word: ፈርሁ
  choice: fürchteten sich
  rationale: Gibt das einfache Furchtverb direkt wieder und lässt die anschließende Steigerung durch die Substantive bestehen.
- source_word: ፍርሃት ነሥአሙ ወረዓድ
  choice: Furcht und Zittern ergriffen sie
  rationale: „Ergriffen“ bewahrt die kraftvolle Vorstellung des Überwältigtwerdens; „Zittern“ hält die körperliche Dimension der Reaktion fest.
theological_decisions:
- issue: Art und Intensität der Reaktion der Wächter
  choice: Die Häufung „fürchteten sich, und Furcht und Zittern ergriffen sie“ bleibt erhalten.
  alternative: „Sie gerieten in große Angst“ oder „Schrecken und Beben kamen über sie“.
  rationale: Die ge’ezische Vorlage verbindet ein Furchtverb mit den Nomen „Furcht“ und „Zittern“. Diese apokalyptische Steigerung wird nicht zu einer einzigen allgemeinen Aussage geglättet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas markante Wiederholung von „fürchten/Furcht“ folgt bewusst der Vorlage; das Semikolon gliedert die aufeinanderfolgenden Handlungen klar.
