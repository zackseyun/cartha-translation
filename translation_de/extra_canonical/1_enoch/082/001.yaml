base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/001.yaml
  text: And now[a], my son Methuselah, I tell you all these things, and I write them down for you, and I have revealed them all to you, and I have given you their books concerning all these things. Keep, my son, the book from the hand of your father[c][b], so that you may give it to the generations of the world.
translation:
  language: de
  text: Und nun, mein Sohn Metuschelach, teile ich dir all diese Dinge mit und schreibe sie für dich auf. Ich habe dir alles offenbart und dir ihre Bücher über all diese Dinge gegeben. Bewahre, mein Sohn, das Buch aus der Hand deines Vaters[a], damit du es den Generationen der Welt weitergibst.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „das Buch der Hand deines Vaters“; gemeint sein kann ein Buch, das unmittelbar vom Vater stammt oder aus seiner Hand übergeben wurde.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Schlusswendung kann auch verstanden werden als: „allen Generationen für immer“ oder „den Generationen der Ewigkeit“. Statt „damit du es … weitergibst“ ist auch die ältere Auffassung „und gib es weiter“ möglich.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: Und nun
  rationale: Bewahrt die einleitende Übergangsformel in natürlichem, würdevollem Deutsch.
- source_word: ወልድየ፡ ማቱሳላ
  choice: mein Sohn Metuschelach
  rationale: Gibt die direkte väterliche Anrede wieder und verwendet die im Deutschen geläufige biblische Namensform.
- source_word: ኵሎሙ፡ እሉንተ፡ ለከ፡ እነግር
  choice: teile ich dir dies alles mit
  rationale: Entspricht dem Verb des Sagens bzw. Mitteilens und klingt im Zusammenhang einer umfassenden Unterweisung natürlicher als eine wiederholte Folge mit „sagen“.
- source_word: ወእጽሕፍ፡ ለከ
  choice: und schreibe es für dich auf
  rationale: „Aufschreiben“ verdeutlicht idiomatisch die schriftliche Fixierung des zuvor Mitgeteilten.
- source_word: ወኵሎሙ፡ ከሠትኩ፡ ለከ
  choice: Ich habe dir alles offenbart
  rationale: Bewahrt das Motiv des Enthüllens bzw. Offenbarens, das zum apokalyptischen Kontext passt.
- source_word: ወወሀብኩከ፡ መጻሕፍቲሆሙ፡ ለእሉ፡ ኵሎሙ
  choice: und dir die dazugehörigen Schriften übergeben
  rationale: Die komprimierte Formulierung bezeichnet die diesen Dingen zugeordneten Bücher bzw. Schriften. „Dazugehörig“ bildet den Bezug idiomatisch ab, ohne eine unklare deutsche Possessivkonstruktion zu erzwingen.
- source_word: ዕቀብ
  choice: Bewahre
  rationale: Erfasst sowohl das Behalten als auch das schützende Erhalten und passt zur Weitergabe eines Schriftstücks.
- source_word: መጽሐፈ፡ እዴሁ፡ ለአቡከ
  choice: das Buch aus der Hand deines Vaters
  rationale: Bewahrt das Hand-Motiv der wörtlichen Wendung und lässt sowohl Herkunft als auch unmittelbare Übergabe anklingen.
- source_word: ወከመ፡ ትሀብ
  choice: damit du es … weitergibst
  rationale: Gibt ከመ mit dem abhängigen Verb als Zwecksatz wieder. „Weitergeben“ passt zum generationsübergreifenden Überlieferungsvorgang.
- source_word: ለትውልደ፡ ዓለም
  choice: den Generationen der Welt
  rationale: Bewahrt die offene Welt-/Zeitalter-Semantik, ohne sie ausschließlich temporal als „für immer“ festzulegen.
theological_decisions:
- issue: Reichweite der Überlieferung in ለትውልደ፡ ዓለም
  choice: den Generationen der Welt
  alternative: allen Generationen für immer / den Generationen der Ewigkeit
  rationale: Die gewählte Formulierung hält die mögliche räumlich-universale und zeitlich-fortdauernde Bedeutung offen, statt die Wendung auf nur eine Dimension festzulegen.
- issue: Verhältnis von Bewahren und Weitergeben
  choice: damit du es … weitergibst
  alternative: und gib es weiter
  rationale: 'Die Konstruktion mit ከመ drückt einen Zweck aus: Das Buch soll bewahrt werden, damit es überliefert werden kann. Die Alternative als zweiter Imperativ wird in einer Fußnote dokumentiert.'
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzähl- und Unterweisungston. Die längere parataktische Folge des Ge'ez wurde behutsam in zwei Sätze gegliedert. Die genuine Mehrdeutigkeit der Schlusswendung und der idiomatischen Hand-Formel bleibt durch Fußnoten sichtbar.
