base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/005.yaml
  text: Because of them, people go astray and do not reckon them in the reckoning of all the world; for people err concerning them and do not know them exactly.
translation:
  language: de
  text: Ihretwegen gehen die Menschen in die Irre und beziehen sie nicht in die Berechnung der ganzen Welt ein;[a] denn die Menschen irren sich über sie und kennen sie nicht genau.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die äthiopische Formulierung in der Mitte des Verses ist schwierig. Sie wird hier im Sinn einer kalendarischen „Berechnung“ verstanden; möglich ist auch: „im Denken der ganzen Welt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Denn sie führen sie in die Irre, und die Menschen kennen sie nicht genau.“ Das letzte Wort kann auch „sorgfältig“ oder „präzise“ bedeuten.'
    reason: textual_and_lexical_alternative
lexical_decisions:
- source_word: በእንቲአሆሙ
  choice: ihretwegen
  rationale: Die Präpositionalfügung bezeichnet hier am natürlichsten Ursache oder Anlass; das deutsche „ihretwegen“ lässt den im Kontext nicht ausdrücklich benannten Bezug der Pronomen offen.
- source_word: ይጌግዩ
  choice: gehen in die Irre
  rationale: Die Wendung bewahrt sowohl den Gedanken des Irrtums als auch das Bild des Abirrens.
- source_word: ኢየኀስብዎሙ
  choice: beziehen sie nicht … in die Berechnung … ein
  rationale: Im kalendarisch-astronomischen Zusammenhang ist rechnen oder berechnen vorrangig. Die deutsche Formulierung gibt die transitive Konstruktion natürlich wieder.
- source_word: ተበሐሳቤ
  choice: in die Berechnung
  rationale: Der mit ሐሳብ verwandte Ausdruck bezeichnet im Astronomischen Buch wahrscheinlich eine kalendarische Berechnung; die Form des äthiopischen Textes ist jedoch schwierig.
- source_word: ኵሉ ዓለም
  choice: der ganzen Welt
  rationale: Die Wiedergabe erhält den umfassenden, kollektiven Sinn, ohne den Ausdruck näher zu bestimmen.
- source_word: ይጌግይዎሙ
  choice: irren sich über sie
  rationale: Der überlieferte Wortlaut und seine syntaktische Zuordnung sind unsicher. Diese Wiedergabe folgt der kontextuell plausiblen Aussage über menschlichen Irrtum, während die mögliche kausative Lesart in der Fußnote genannt wird.
- source_word: ኢያእምርዎሙ
  choice: kennen sie nicht
  rationale: Das allgemeine Verb des Wissens oder Erkennens wird breit wiedergegeben und nicht vorschnell auf Verstehen oder Wiedererkennen eingeengt.
- source_word: ጥንቁቀ
  choice: genau
  rationale: Das Wort bezeichnet sorgfältige beziehungsweise präzise Kenntnis; „genau“ ist im Deutschen natürlich und bewahrt beide Nuancen.
theological_decisions:
- issue: Bezug der wiederholten Pluralpronomen
  choice: Die Pronomen bleiben als „sie“ unaufgelöst.
  alternative: Ausdrückliche Benennung als Himmelslichter, festgesetzte Zeiten, Ordnungen oder Kalendereinteilungen.
  rationale: Der nähere Kontext legt diese Größen nahe, doch der Vers selbst benennt den Bezug nicht ausdrücklich. Eine Konkretisierung würde die echte Mehrdeutigkeit aufheben.
- issue: Subjekt und Kausalität im zweiten Satzteil
  choice: „Die Menschen irren sich über sie“
  alternative: „Denn sie führen sie in die Irre, und die Menschen kennen sie nicht genau.“
  rationale: Die Form ይጌግይዎሙ kann kausativ verstanden werden; zugleich stützt die konsultierte Überlieferung eine Aussage über den Irrtum der Menschen. Die Hauptfassung bleibt im Kontext verständlich, die abweichende syntaktische Deutung wird transparent in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas technische „Berechnung“ entspricht dem kalendarisch-astronomischen Zusammenhang. Alle nicht ausdrücklich benannten Bezugsgrößen bleiben pronominal, damit die Mehrdeutigkeit des Ausgangstextes erhalten bleibt.
