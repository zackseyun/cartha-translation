base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/008.yaml
  text: And they have authority by night and by day in heaven[a], so that they may give light upon humankind—the sun and the moon and the stars and all the powers of heaven[b], which return in their courses.
translation:
  language: de
  text: 'Und er hat bei Nacht und bei Tag im Himmel Vollmacht, damit sie den Menschen Licht geben: die Sonne, der Mond, die Sterne und alle Mächte des Himmels[a], die auf ihren Bahnen wiederkehren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Mächte des Himmels“ kann sowohl himmlische Gewalten als auch die geordneten Kräfte des Himmels bezeichnen.
    reason: preserved_ambiguity
lexical_decisions:
- source_word: ስልጣነ ቦቱ
  choice: bei ihm ist die Herrschaft
  rationale: ቦቱ trägt ein maskulines Singularsuffix und bedeutet wörtlich etwa „bei/in ihm“; zusammen mit ስልጣነ ergibt sich idiomatisch, dass er Herrschaft bzw. Vollmacht besitzt. Die Formulierung bewahrt den Singularbezug, vermutlich auf Uriel aus dem Kontext.
- source_word: በሌሊት ወበመዓልት
  choice: bei Nacht und bei Tag
  rationale: Die wiederholte Präposition und die feierliche Paarformel des Ge’ez bleiben im Deutschen erkennbar.
- source_word: ውስተ ሰማይ
  choice: im Himmel
  rationale: „Himmel“ entspricht dem kosmischen Kontext des astronomischen Buches besser als das rein meteorologisch klingende „am Himmel“.
- source_word: ከመ ያርኡ ብርሃነ
  choice: damit sie … Licht geben
  rationale: Die Konstruktion bezeichnet einen Zweck; „Licht geben“ gibt die Funktion der Himmelslichter natürlich wieder.
- source_word: ዲበ ሰብእ
  choice: den Menschen
  rationale: Die kollektive Bezeichnung für die Menschheit wird in modernem Deutsch inklusiv und idiomatisch ausgedrückt.
- source_word: ፀሐየ ወወርኀ ወከዋክብተ
  choice: die Sonne, der Mond, die Sterne
  rationale: Die Aufzählung der benannten Himmelslichter wird klar und würdig wiedergegeben.
- source_word: ኵሎሙ ስልጣናት ሰማይ
  choice: alle Mächte des Himmels
  rationale: „Mächte“ bewahrt die mögliche kosmische oder personale Bedeutung, ohne die Wendung eindeutig auf Engelwesen festzulegen.
- source_word: እለ ይትመየጡ በዓስቢሆሙ
  choice: die auf ihren Bahnen wiederkehren
  rationale: Das Verb bezeichnet Umkehr oder Wiederkehr; „Bahnen“ vermittelt die geordneten, wiederkehrenden Himmelsläufe, ohne ein modernes heliozentrisches Modell vorauszusetzen.
theological_decisions:
- issue: 'Bezug von ስልጣነ ቦቱ: singularischer Träger der Herrschaft oder pluralische Himmelslichter'
  choice: 'Singularisch: „bei ihm ist die Herrschaft“'
  alternative: „Sie haben Herrschaft“ oder „Über sie besteht Herrschaft“
  rationale: Das Suffix von ቦቱ ist grammatisch maskulin Singular und weist im Zusammenhang wahrscheinlich auf Uriel zurück. Ein pluralisches Subjekt würde diese Form nicht unmittelbar abbilden.
- issue: Ob „Mächte des Himmels“ personale Himmelswesen oder unpersönliche kosmische Kräfte bezeichnet
  choice: Die mehrdeutige Wendung „Mächte des Himmels“
  alternative: „Gewalten des Himmels“ mit stärker personalem Klang oder „Himmelskräfte“ mit stärker unpersönlichem Klang
  rationale: Der astronomische Zusammenhang legt geordnete kosmische Größen nahe, doch der Text schließt personale Mächte nicht eindeutig aus. Die Übersetzung hält diese Spannung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht feierlichem Satzrhythmus. Die ungewöhnliche Wendung „bei ihm ist die Herrschaft“ wurde gewählt, um die singularische Ge’ez-Konstruktion sichtbar zu halten; die anschließende Mehrzahl „sie“ bezieht sich auf Sonne, Mond, Sterne und die Mächte des Himmels.
