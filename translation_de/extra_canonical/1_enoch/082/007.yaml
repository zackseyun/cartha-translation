base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/007.yaml
  text: And the matter is true[a], and the reckoning is exact; for Uriel showed me the luminaries, and the paths, and the appointed times, and the years, and the days, and breathed on me—Uriel[f][e][d][c][b], to whom the Lord of all creation of the world gave command concerning the host of heaven.
translation:
  language: de
  text: Und die Aussage ist wahr[a], und die Berechnung ist genau; denn Uriel zeigte mir die Himmelslichter, die Monate, die Festzeiten, die Jahreszeiten[b] und die Tage und hauchte mich an – Uriel, dem der Herr aller Geschöpfe der Welt Weisung über das Heer des Himmels gegeben hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Sache ist wahr“. Der Ausdruck kann die Sache, den Bericht oder die Aussage meinen.'
    reason: lexical_alternative
  - marker: b
    text: Das Wort bezeichnet gewöhnlich Jahreszeiten, besonders Winter- oder Regenzeiten. In dieser kalendarischen Aufzählung wird es teils weitergehend als eine jährliche Einteilung verstanden.
    reason: lexical_alternative
lexical_decisions:
- source_word: አማን
  choice: wahr
  rationale: 'Das Wort ist hier prädikativ zu verstehen: Die Sache bzw. Aussage ist wahr. Damit bleibt die ausdrückliche Wahrheitsbehauptung des Ge''ez erhalten.'
- source_word: ነገሩ
  choice: die Sache
  rationale: Der breite Ausdruck kann Sache, Aussage oder Bericht bezeichnen. „Sache“ wahrt die Offenheit des Ausgangstextes.
- source_word: ጥንቁቅ ሐሳቡ ዘልኩዕ
  choice: die Berechnung ist genau
  rationale: Die Wortgruppe bezeichnet im astronomisch-kalendarischen Zusammenhang eine sorgfältige, präzise Berechnung. ዘልኩዕ ist textlich bzw. syntaktisch nicht völlig klar; eine zusätzliche Wiedergabe als „festgesetzt“ würde die deutsche Aussage unnötig überladen.
- source_word: ብርሃናት
  choice: Himmelslichter
  rationale: Gemeint sind die geordneten leuchtenden Himmelskörper. „Himmelslichter“ ist verständlicher als „Leuchten“ und bewahrt den astronomischen Bezug.
- source_word: አውራኅ
  choice: Monate
  rationale: Im vorliegenden kalendarischen Kontext ist die Lesung als „Monate“ gegenüber „Pfade/Bahnen“ vorzuziehen und passt zur folgenden Reihe zeitlicher Einteilungen.
- source_word: በዓላት
  choice: Festzeiten
  rationale: Das Wort kann Feste oder Festtage bezeichnen. „Festzeiten“ bewahrt sowohl den kultischen als auch den kalendarischen Aspekt.
- source_word: ክረማት
  choice: Jahre
  rationale: Die Form ist in der überlieferten Textgestalt schwierig; innerhalb der Reihe kalendarischer Größen ist „Jahre“ sachlich plausibel, ohne die Unsicherheit zu verschweigen.
- source_word: መዋዕል
  choice: Tage
  rationale: In der Aufzählung zeitlicher Einheiten ist die geläufige Bedeutung „Tage“ passend.
- source_word: ነፍሐ ዲቤየ
  choice: hauchte mich an
  rationale: Die konkrete visionäre Handlung des Hauchens wird bewahrt und nicht deutend zu „unterrichtete“ oder „inspirierte“ abgeschwächt.
- source_word: ዘአዘዘ ሎቱ
  choice: dem ... Weisung ... gegeben hatte
  rationale: Die Relativkonstruktion beschreibt Uriel als Empfänger eines göttlichen Auftrags. „Weisung geben“ klingt im Deutschen natürlich und erhält den Autoritätsbezug.
- source_word: ሐይለ ሰማይ
  choice: das Heer des Himmels
  rationale: Die traditionelle kosmische Wendung kann die geordnete himmlische Schar einschließlich der Himmelskörper bezeichnen.
theological_decisions:
- issue: Wiedergabe von እግዚእ als göttlicher Herrschertitel
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist der geläufige, würdige Titel für göttliche Souveränität und fügt keine konfessionelle Sonderdeutung hinzu.
- issue: Konkretes Bild von ነፍሐ ዲቤየ
  choice: hauchte mich an
  alternative: inspirierte mich
  rationale: Die bildhafte Handlung bleibt als solche stehen; „inspirierte“ würde ihre Bedeutung bereits theologisch auslegen.
- issue: Bezug des himmlischen Heeres
  choice: Heer des Himmels
  alternative: Schar der Himmelskörper
  rationale: Die allgemeinere Formulierung erhält die mögliche Spannung zwischen himmlischen Wesen und der geordneten Gestirnwelt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählung ist gegenüber dem Ge'ez leicht gestrafft, ohne Elemente auszulassen. Der Gedankenstrich verdeutlicht die nachgestellte nähere Bestimmung Uriels. Die Unebenheit von „der gesamten Schöpfung der Welt“ bleibt bewusst relativ nah an der kosmisch umfassenden Ausgangsformulierung.
