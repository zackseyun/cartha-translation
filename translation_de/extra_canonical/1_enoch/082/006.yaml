base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/006.yaml
  text: 'For they belong to the reckoning of the year[a], and they are truly fixed forever: one in the first gate, one in the third gate, one in the fourth, and one in the sixth[b]; and the year is completed in three hundred and sixty-four days.'
translation:
  language: de
  text: 'Denn sie gehören zur Berechnung des Jahres[a], und sie sind wahrhaftig für immer festgesetzt: einer im ersten Tor, einer im dritten Tor, einer im vierten und einer im sechsten[b]; und das Jahr wird mit dreihundertvierundsechzig Tagen vollendet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das viermalige „einer … einer … einer … einer“ bezieht sich auf die vier zusätzlichen Tage, die im henochischen Kalender mit 364 Tagen auf die vier Abschnitte des Sonnenjahres verteilt sind.
    reason: cultural_note
  - marker: b
    text: In der vorliegenden Textzeile fehlt nach „vierten“ und „sechsten“ das Wort „Tor“; die Abfolge legt jedoch nahe, dass es jeweils mitzudenken ist.
    reason: textual_variant
lexical_decisions:
- source_word: እስመ
  choice: Denn
  rationale: Bewahrt die begründende Verknüpfung mit dem vorausgehenden Zusammenhang.
- source_word: ሀለዉ፡ በሐሳበ፡ ዓመት
  choice: sie gehören zur Berechnung des Jahres
  rationale: Gibt im kalendarischen Kontext nicht bloß Existenz, sondern Zugehörigkeit zur Jahresberechnung wieder.
- source_word: ወአማን፡ ልኩዓን፡ እሙንቱ፡ ለዓለም
  choice: und sie sind wahrhaftig für immer festgesetzt
  rationale: Erhält die emphatische Bekräftigung sowie die Vorstellung einer dauerhaft festgelegten Ordnung.
- source_word: አሐቲ
  choice: einer
  rationale: Das feminine Zahlwort bezieht sich wahrscheinlich auf die vier zusätzlichen Tage; im Deutschen verlangt „Tag“ jedoch die maskuline Form. Die distributive Wiederholung bleibt erhalten.
- source_word: ኆኅት
  choice: Tor
  rationale: Die wörtliche und im astronomischen Schema etablierte Bezeichnung wird beibehalten.
- source_word: ወይትፌጸም፡ ዓመተ፡ መዋዕል
  choice: So wird das Jahr ... vollendet
  rationale: Gibt die Vollendung des Jahreszyklus klar wieder; „So“ macht den folgernden Zusammenhang natürlich verständlich.
- source_word: ፫፻ወ፷ወረቡዕ
  choice: dreihundertvierundsechzig Tagen
  rationale: Entspricht der äthiopischen Zahl 364 und der kalendarischen Aussage des Verses.
theological_decisions:
- issue: Charakter der kosmisch-kalendarischen Ordnung
  choice: Die Anordnung wird als wahrhaftig und dauerhaft festgesetzt wiedergegeben.
  alternative: Die Aussage lediglich als wertfreie astronomische Beobachtung zu formulieren.
  rationale: Die Wörter für Wahrheit, Festsetzung und Ewigkeit verleihen der Ordnung einen normativen, beständigen Charakter; dieser darf nicht abgeschwächt werden.
- issue: Bezugswort der viermaligen Zahl „einer“
  choice: Die Wiederholung wird als Verteilung von vier einzelnen Tagen verstanden, ohne das Bezugswort in den Haupttext einzufügen.
  alternative: „je ein Tag“ ausdrücklich in den Haupttext zu setzen.
  rationale: Der Zusammenhang legt Tage nahe, doch das Bezugswort steht im überlieferten Wortlaut dieses Verses nicht ausdrücklich; die Fußnote erklärt den Bezug, ohne die Ambiguität im Text zu beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit technischem kalendarischem Wortschatz. Die wiederholte Aufzählung und die Aussage einer dauerhaften kosmischen Ordnung bleiben erhalten; nicht ausdrücklich vorhandene Bezugswörter werden nur in den Fußnoten erläutert.
