base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/015.yaml
  text: At the beginning of the year[a], first rises and rules Melkiyal, whose name is called Tam'ade'eni and the sun; and all the days of his dominion, while he rules[c][b], are ninety-one days.
translation:
  language: de
  text: Am Anfang des Jahres geht Melkiyal als Erster auf und herrscht. Sein Name wird Tam'ade'eni und »die Sonne« genannt.[a] Alle Tage seiner Herrschaft, während er herrscht,[b] sind einundneunzig Tage.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der äthiopische Wortlaut dieser Namensformel ist schwierig. Tam'ade'eni wird als Name oder Fachbezeichnung umschriftlich wiedergegeben; »die Sonne« scheint eine weitere Bezeichnung Melkiyals zu sein.
    reason: textual_variant
  - marker: b
    text: Der Abschnitt am Anfang des Jahres wird als Zeitraum unter Melkiyals Herrschaft personifiziert; er umfasst einundneunzig Tage.
    reason: cultural_note
lexical_decisions:
- source_word: በቅድመ፡ ዓመት
  choice: Am Anfang des Jahres
  rationale: Die zeitliche Bedeutung von በቅድመ ist im Zusammenhang mit dem Jahr idiomatisch als »am Anfang« wiederzugeben.
- source_word: ቀዳማዊ፡ ይሠርቅ
  choice: geht ... als Erster auf
  rationale: ቀዳማዊ wird adverbial auf das Aufgehen bezogen; die Formulierung bewahrt diese Zuordnung in natürlichem Deutsch.
- source_word: ወይመልክ
  choice: und herrscht
  rationale: Die Herrschaftssprache prägt den Vers und erhält die Personifikation der kosmischen Ordnung.
- source_word: ምልኪያል
  choice: Melkiyal
  rationale: Der Eigenname wird transliteriert und nicht gedeutet.
- source_word: ዘይሠመይ፡ ስሞ
  choice: Sein Name wird ... genannt
  rationale: Die ausdrückliche Namensformel bleibt erhalten, wird aber in verständliches modernes Deutsch gebracht.
- source_word: ተመአደኒ
  choice: Tam'ade'eni
  rationale: Wahrscheinlich ein Eigenname oder technischer Ausdruck; eine Transliteration vermeidet eine spekulative Übersetzung.
- source_word: ወፀሐይ
  choice: und »die Sonne«
  rationale: Gemäß Syntax und Parallelgebrauch gehört »die Sonne« zur Namens- beziehungsweise Bezeichnungsformel, nicht zum Subjekt der Tageszählung.
- source_word: ኵሎሙ፡ መዋዕለ፡ ዘበስልጣኑ፡ ዚአሁ
  choice: Alle Tage seiner Herrschaft
  rationale: Die Formulierung gibt sowohl die Gesamtheit der Tage als auch ihre Zuordnung zu seiner Herrschaft knapp wieder.
- source_word: እለ፡ ይመልክ
  choice: während er herrscht
  rationale: Der Relativausdruck bezeichnet den Zeitraum, in dem Melkiyal herrscht, und bewahrt zugleich die Wiederholung des Herrschaftsverbs.
- source_word: ፺ወ፩ ዕለት
  choice: einundneunzig Tage
  rationale: Direkte Wiedergabe der angegebenen Zeitspanne.
theological_decisions:
- issue: Personifikation der kalendarischen Ordnung
  choice: Die Wörter »herrscht« und »Herrschaft« bleiben erhalten.
  alternative: »steht vor«, »kennzeichnet« oder »leitet die Jahreszeit«
  rationale: Der Text stellt die kosmische Ordnung als zugeteilte Herrschaft eines benannten Wesens dar. Eine neutralisierende Kalenderformulierung würde die apokalyptische Bildwelt einebnen.
- issue: Zuordnung von »die Sonne«
  choice: »die Sonne« wird als weitere Benennung Melkiyals verstanden.
  alternative: »die Sonne« zusammen mit den Tagen zum Subjekt des letzten Satzteils machen
  rationale: Die Stellung im Namenssatz und die Parallele innerhalb des Kapitels stützen die Zuordnung zur Bezeichnung; die Alternative ergäbe zudem die sachlich widersinnige Aussage, die Sonne sei einundneunzig Tage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Namensformel und die wiederholte Herrschaftssprache werden nicht geglättet; die Satzteilung sorgt dennoch für gute Verständlichkeit.
