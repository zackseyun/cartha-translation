base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/016.yaml
  text: 'And these are the signs of the days that appear on the earth in the days of his dominion: heat and warmth and calm[a]; and all the trees bear fruit, and leaves come forth on all the trees, and the harvest of wheat, and the blossom of the rose, and every flower that comes forth in the field[f][e][d][c][b]; but the trees of winter dry up.'
translation:
  language: de
  text: 'Und dies sind die Zeichen der Tage, die sich auf der Erde zeigen[a], in den Tagen seiner Herrschaft[b]: Schweiß, Hitze und milde Witterung[c]. Alle Bäume tragen Frucht, und an allen Bäumen kommen Blätter hervor; es gibt die Weizenernte, die Blüte der Rose[e] und jede Blume, die auf dem Feld[d] hervorkommt. Die Bäume des Winters aber verdorren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die auf der Erde sichtbar gemacht werden“; das ge’ezische Verb kann sowohl ein Sichzeigen als auch ein Zeigen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Seiner“ bezieht sich wahrscheinlich auf die im Zusammenhang behandelte Himmelsleuchte; der Vers selbst nennt den Bezug jedoch nicht ausdrücklich.
    reason: cross_reference
  - marker: c
    text: Die Bedeutung des hier mit „milde Witterung“ wiedergegebenen Wortes ist unsicher; möglicherweise bezeichnet es eine angenehme, sanfte oder ruhige Wetterlage.
    reason: lexical_alternative
  - marker: d
    text: Das mit „Feld“ wiedergegebene Wort kann auch „Wildnis“ oder „offenes Land“ bedeuten; die Pflanzenbilder sprechen hier für „Feld“.
    reason: lexical_alternative
  - marker: e
    text: Die Bestimmung als „Rose“ ist traditionell; möglicherweise ist allgemeiner eine blühende Pflanze gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: ትእምርተ
  choice: Zeichen
  rationale: Das Substantiv bezeichnet erkennbare Kennzeichen oder Hinweise; „Zeichen“ passt zum astronomisch-kalendarischen Zusammenhang.
- source_word: መዋዕለ
  choice: Tage
  rationale: Die wörtliche Bedeutung „Tage“ bleibt erhalten, obwohl im Zusammenhang auch Zeitabschnitte oder Jahreszeiten mitschwingen.
- source_word: ያስተርእዩ
  choice: sich zeigen
  rationale: Die Verbform gehört zum Bedeutungsfeld des Zeigens und Sichtbarwerdens; „sich zeigen“ ist im Deutschen natürlich und bewahrt den beobachtenden Charakter.
- source_word: ስልጣኑ
  choice: seiner Herrschaft
  rationale: Das Wort bezeichnet Herrschaft oder Machtbereich. Das Pronomen bleibt wie in der Quelle ohne ausdrücklich benannten Bezug.
- source_word: ሀፍ
  choice: Schweiß
  rationale: Die Grundbedeutung ist wahrscheinlich „Schweiß“, mit möglicher Erweiterung zu „Hitze“. Als sichtbares Sommerzeichen bleibt die konkrete Bedeutung erhalten.
- source_word: ሞቅ
  choice: Hitze
  rationale: Das Wort bezeichnet Hitze oder Wärme; neben „Schweiß“ gibt „Hitze“ die klimatische Erscheinung klar wieder.
- source_word: ዛሕን
  choice: milde Witterung
  rationale: Die genaue Bedeutung ist unsicher; gemeint scheint eine angenehme oder sanfte Wetterlage zu sein. Die Fußnote hält diese Unsicherheit offen.
- source_word: ዕፀው
  choice: Bäume
  rationale: Im botanischen Zusammenhang ist „Bäume“ die natürliche deutsche Entsprechung.
- source_word: ይፈርዩ
  choice: tragen Frucht
  rationale: Das Verb bezeichnet das Hervorbringen von Frucht; die feste deutsche Wendung ist konkret und idiomatisch.
- source_word: ቈጽል
  choice: Blätter
  rationale: Das Wort bezeichnet hier das an den Bäumen hervorkommende Laub.
- source_word: ይወጽእ
  choice: hervorkommen
  rationale: Das wiederholte Verb bezeichnet Hervortreten oder Erscheinen und wird zur Wahrung der Wiederholung gleichlautend wiedergegeben.
- source_word: ማእረረ ስርናይ
  choice: Weizenernte
  rationale: Die Wortgruppe bezeichnet den Ertrag oder die Ernte des Weizens; „Weizenernte“ ist knapp und sachlich.
- source_word: ጽጌ ረዳ
  choice: Blüte der Rose
  rationale: Die traditionelle Pflanzenbestimmung als Rose wird beibehalten, aber wegen ihrer Unsicherheit in einer Fußnote erläutert.
- source_word: ገዳም
  choice: Feld
  rationale: Das Wort kann offenes Land oder Wildnis bezeichnen; wegen der geschilderten Vegetation ist „Feld“ hier passend.
- source_word: ዕፀወ ክረምት
  choice: Bäume des Winters
  rationale: Die ungewöhnliche genitivische Formulierung wird bewahrt, statt sie deutend als bestimmte Baumart oder als winterliche Bäume aufzulösen.
theological_decisions:
- issue: Bezugswort von „seiner“ in „in den Tagen seiner Herrschaft“
  choice: Das Pronomen ohne ausdrückliche Bestimmung des Bezugs beibehalten.
  alternative: „in den Tagen der Herrschaft der betreffenden Himmelsleuchte“ oder „in den Tagen der Herrschaft der Sonne“
  rationale: Der weitere astronomische Kontext dürfte den Bezug nahelegen, doch der Vers selbst benennt ihn nicht. Eine ausdrückliche Identifizierung würde die Mehrdeutigkeit der Quelle auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer, leicht gehobener Satzführung. Die aufzählende Struktur des ge’ezischen Textes bleibt erkennbar, wird jedoch durch deutsche Zeichensetzung lesbar gegliedert. Ungewöhnliche oder unsichere Ausdrücke werden nicht stillschweigend harmonisiert.
