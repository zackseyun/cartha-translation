base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/003.yaml
  text: And those who understand shall not sleep[a], but shall listen with their ears so as to learn this wisdom[d][c][b]; and it will be sweeter to them than good food is to those who eat.
translation:
  language: de
  text: Und die Verständigen werden nicht schlafen, sondern mit ihren Ohren aufmerksam hören, um diese Weisheit zu lernen; und sie wird ihnen angenehmer sein als gute Speise denjenigen, die sie essen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ኢይነውሙ
  choice: werden nicht schlafen
  rationale: Bewahrt die gewöhnliche Bedeutung „schlafen“ und damit das Bild geistiger Wachsamkeit, ohne es in eine bloße Paraphrase aufzulösen.
- source_word: እለ ይሌብዉ
  choice: die Verständigen
  rationale: Gibt die Bezeichnung für Menschen mit Einsicht knapp, würdig und in modernem Deutsch wieder.
- source_word: ይጸምኡ በእዝናሆሙ
  choice: mit ihren Ohren aufmerksam hören
  rationale: Die Wendung bezeichnet hier ein positives, aufmerksames Hören und darf nicht als Taubheit oder Trägheit verstanden werden. Die Ohren-Metaphorik bleibt erhalten.
- source_word: ከመ ይትመሀርዋ
  choice: um diese Weisheit zu lernen
  rationale: Gibt den Zweck des aufmerksamen Hörens natürlich und präzise wieder.
- source_word: ለዛ ጥበብ
  choice: diese Weisheit
  rationale: Bewahrt den deiktischen Bezug auf die unmittelbar zuvor vermittelte Lehre.
- source_word: ትደልዎሙ
  choice: sie wird ihnen angenehmer sein
  rationale: Das Verb bezeichnet etwas Passendes, Angenehmes oder Wohlgefälliges; „angenehmer“ vermeidet die lexikalisch unbegründete Festlegung auf „süßer“.
- source_word: እመበልዕት ሠናያት
  choice: als gute Speise
  rationale: Hält den konkreten Vergleich mit guten essbaren Dingen fest und klingt im würdigen deutschen Register natürlich.
- source_word: ለእለ ይበልዑ
  choice: denen, die essen
  rationale: 'Bewahrt den syntaktischen Parallelismus: Weisheit ist den Verständigen angenehm, wie gute Speise den Essenden angenehm ist; ein Objekt „sie“ wird nicht ergänzt.'
theological_decisions:
- issue: Bildsprache von Schlafen und Hören
  choice: Die körperlichen Bilder des Nichtschlafens und des Hörens mit den Ohren bleiben als Ausdruck wacher Aufnahme offenbarter Weisheit erhalten.
  alternative: 'Paraphrase: „Die Einsichtigen werden wachsam sein und gut aufpassen.“'
  rationale: Die Bildsprache gehört zum apokalyptisch-weisheitlichen Charakter des Abschnitts und sollte nicht in eine allgemeine Ermahnung eingeebnet werden.
- issue: Vergleich zwischen Weisheit und Speise
  choice: Der Satz wahrt die parallele Beziehung zwischen der Freude der Verständigen an der Weisheit und der Freude der Essenden an guter Speise.
  alternative: „Sie wird ihnen süßer sein als gute Speise, wenn sie davon essen.“
  rationale: Die gewählte Fassung vermeidet sowohl eine nicht zwingende Geschmacksangabe als auch die Ergänzung, dass die Weisheit selbst gegessen werde.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur folgt dem poetisch-weisheitlichen Parallelismus des Ge’ez, ohne unnatürlich wörtlich zu wirken.
