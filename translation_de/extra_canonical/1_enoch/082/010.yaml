base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/010.yaml
  text: 'And these are the names of those who lead them: those who keep watch and go in at their appointed times, those who lead them in their stations and in their orders and in their times and in their months and in their authorities and in their positions.'
translation:
  language: de
  text: 'Und dies sind die Namen derjenigen, die sie führen: diejenigen, die Wache halten und zu den für sie bestimmten Zeiten eintreten, diejenigen, die sie an ihren Plätzen und in ihren Ordnungen, zu ihren Zeiten und in ihren Monaten, in ihren Befugnissen und in ihren Stellungen führen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመርኅዎሙ
  choice: sie führen
  rationale: Gibt das wiederholte Verb mit seinem Objekt unmittelbar und natürlich wieder.
- source_word: የዐቅቡ
  choice: Wache halten
  rationale: Bewahrt die konkrete Bedeutung des Wachens beziehungsweise Bewachens.
- source_word: ይበውኡ
  choice: eintreten
  rationale: Entspricht dem Bewegungsverb „hineingehen/eintreten“, ohne den Bezug näher festzulegen.
- source_word: በአዝማነ፡ ዚአሆሙ
  choice: zu den für sie bestimmten Zeiten
  rationale: Drückt ihre jeweiligen beziehungsweise zugehörigen Zeitabschnitte idiomatisch aus; der zeitliche Bezug bleibt erhalten.
- source_word: በመካናቲሆሙ
  choice: an ihren Plätzen
  rationale: Gibt die räumlichen oder zugewiesenen Orte wieder, ohne sie technisch zu überdeuten.
- source_word: በሥርዓታቲሆሙ
  choice: nach ihren Ordnungen
  rationale: „Ordnungen“ wahrt den strukturellen und geregelten Sinn des Ausdrucks.
- source_word: በአውራኂሆሙ
  choice: in ihren Monaten
  rationale: Direkte Wiedergabe der Monatsangabe.
- source_word: በስልጣናቲሆሙ
  choice: gemäß ihren Vollmachten
  rationale: „Vollmachten“ erfasst zugewiesene Autoritäts- oder Herrschaftsbereiche; „gemäß“ ist im Deutschen bei abstrakter Autorität natürlicher als ein bloßes „in“.
- source_word: በምቅዋማቲሆሙ
  choice: in ihren Stellungen
  rationale: Bewahrt den Sinn von Standorten, Positionen oder zugewiesenen Stellungen, ohne eine einzige Deutung festzuschreiben.
theological_decisions:
- issue: Identität der Führenden und Geführten
  choice: Die Pronomen und die wiederholte Bezeichnung „derer, die sie führen“ bleiben ohne erklärende Identifizierung stehen.
  alternative: Die Führenden ausdrücklich als Engel und die Geführten als Himmelskörper benennen.
  rationale: Der Vers selbst nennt diese Identitäten nicht ausdrücklich; eine Ergänzung würde die aus dem Kontext erschließbare Deutung in den Text importieren.
- issue: Bedeutung von „Vollmachten“
  choice: Als zugewiesene Vollmachten beziehungsweise Autoritätsbereiche wiedergeben.
  alternative: Mit „Herrschaften“ eine stärker personifizierende oder kosmologisch-technische Deutung wählen.
  rationale: Die neutrale Formulierung erhält die mögliche kosmische Verwaltungssprache, ohne eine bestimmte Angelologie festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die katalogartige Wiederholung und Parallelstruktur des ge'ezischen Textes werden bewahrt, zugleich wird die lange Satzperiode durch klare Kasusführung lesbar gehalten. Wegen der nur mittleren Quellensicherheit werden keine textkritischen Behauptungen oder unnötigen Präzisierungen eingeführt.
