review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die wiederholte Führungsbezeichnung, das Wachen, Eintreten sowie die vollständige Reihe von Zuordnungen im Wesentlichen treffend wieder. „Gemäß ihren Vollmachten“ verändert jedoch die wiederholte, zuordnende Präposition des Ausgangstextes zu einer normativen Bedeutung („entsprechend/aufgrund von“).
  naturalness: Der Satz ist insgesamt verständlich und dem katalogartigen Charakter angemessen. Die Wiederholung von „derer“ unmittelbar nach dem Doppelpunkt ist jedoch unnötig schwerfällig. Eine klarere Relativsatzfügung bewahrt die Struktur ohne diesen Stolperer.
  terminology: „Wache halten“, „eintreten“, „Ordnungen“, „Monate“ und „Stellungen“ sind angemessen. „Befugnissen“ ist für die betreffende, bewusst nicht weiter spezifizierte Autoritäts- bzw. Vollmachtsangabe natürlicher als die im Deutschen hier semantisch verschobene Fügung „gemäß ihren Vollmachten“.
  issues:
