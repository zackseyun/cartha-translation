    issue: „gemäß ihren Vollmachten“
    rationale: Das ge'ezische Präfix steht hier wie in den übrigen Gliedern der Aufzählung zuordnend („in/bei ihren ...“). „Gemäß“ lässt die Führungsweise als durch Vollmachten geregelt erscheinen und verändert damit die Beziehung.
  - severity: low
    issue: Schwerfällige Wiederholung „derer ... derer ... derer“
    rationale: Die Konstruktion ist nicht ungrammatisch, aber im modernen Standarddeutsch unnötig sperrig. „diejenigen, die“ macht die dreigliedrige Bezeichnung der Personen klarer, ohne den offenen Bezug aufzulösen.
