base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/018.yaml
  text: The second leader after him is Helemmelek[c][b][a], whose name they call the Sun.
translation:
  language: de
  text: Der zweite Leiter nach ihm ist Helemmelek[a], dessen Namen sie »die Sonne« nennen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Helemmelek ist aus dem Ge’ez übertragen; seine genaue Vokalisierung ist unsicher.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich unter Beibehaltung der aktiven Form: »dessen Namen sie die Sonne nennen«. Sinngemäß: »den sie die Sonne nennen« oder »der die Sonne genannt wird«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልእ
  choice: der zweite
  rationale: Das Wort führt im aufzählenden Zusammenhang den zweiten Träger eines Amtes ein; daher ist die ordinale Wiedergabe treffender als das unbestimmte »ein anderer«.
- source_word: መራሒ
  choice: Führer
  rationale: Der Ausdruck bezeichnet hier denjenigen, der in der geordneten Bewegung der Himmelskörper führt; »Führer« bewahrt diesen Funktionssinn, ohne einen bestimmten Rang hinzuzufügen.
- source_word: ዘድኅሬሁ
  choice: nach ihm
  rationale: Die Wendung bezeichnet die Abfolge innerhalb der Aufzählung und wird im Deutschen natürlich mit »nach ihm« wiedergegeben.
- source_word: ሄልእምሜሌክ
  choice: Helemmelek
  rationale: Der Eigenname wird gemäß der bereits im Kontext verwendeten Form transliteriert; seine genaue Vokalisierung bleibt unsicher.
- source_word: ዘይጼውዕዎ ስሞ
  choice: seinen Namen nennen sie
  rationale: Die Wiedergabe erhält sowohl das ausdrücklich genannte »sein Name« als auch die aktive Verbform in der dritten Person Plural.
- source_word: ፀሐየ
  choice: die Sonne
  rationale: Gemeint ist der als benannte Himmelsleuchte aufgeführte Sonnenkörper. Der bestimmte Artikel erhält den quasi-titularen Charakter; die Großschreibung ist im Deutschen regulär.
theological_decisions:
- issue: Behandlung der Schlussbezeichnung als gewöhnliches Substantiv oder als formelle Benennung eines Himmelskörpers
  choice: »die Sonne«
  alternative: »Sonne«
  rationale: Der Zusammenhang katalogisiert Himmelsleuchten und ihre Führer innerhalb einer geordneten kosmischen Struktur. Artikel und Anführungszeichen kennzeichnen die Benennung, ohne eine weitergehende Personifikation oder theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Aufzählungsform des astronomisch-apokalyptischen Zusammenhangs bleibt erhalten; das Semikolon macht die im Deutschen ungewöhnliche, aber quellnahe Namensformel lesbar.
