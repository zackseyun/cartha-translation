base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/013.yaml
  text: 'And these are the names of the leaders who divide the four parts of the year[a], who are appointed: Milkiel, Helemmelek, Meleyal[b], and Narel.'
translation:
  language: de
  text: 'Und dies sind die Namen der eingesetzten Anführer, die die vier Teile des Jahres[a] voneinander scheiden: Milkiel, Helemmelek, Meleyal[b] und Narel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die vier Abschnitte des Jahres«; die ge''ezische Wendung lautet wörtlich »die vier Teile des Jahres«.'
    reason: lexical_alternative
  - marker: b
    text: Der zweite und der dritte Name sind in diesem Textzeugen schwer zu bestimmen. Die Schreibungen folgen den ge'ezischen Formen vorsichtig, statt sie zu geläufigeren Namensformen zu normalisieren.
    reason: textual_variant
lexical_decisions:
- source_word: አስማቲሆሙ
  choice: ihre Namen / die Namen
  rationale: Die ge'ezische Pluralform mit Possessivsuffix wird in der deutschen Vorstellungsformel idiomatisch als »dies sind die Namen« wiedergegeben.
- source_word: መራሕያያን
  choice: Anführer
  rationale: Das vom Verb »führen, leiten« abgeleitete Wort bezeichnet hier benannte kosmische Amtsträger. »Anführer« wahrt ihre Leitungsfunktion, ohne ihren Rang oder ihre Natur näher festzulegen.
- source_word: ይፈልጡ
  choice: voneinander scheiden
  rationale: Das Verb bedeutet »trennen, teilen«. Da sein Objekt bereits »die vier Teile des Jahres« lautet, ist »voneinander scheiden« im Deutschen klarer als das missverständliche »die vier Teile teilen«.
- source_word: ፬መክፈልተ ዓመት
  choice: die vier Teile des Jahres
  rationale: Dies gibt die ge'ezische Wendung eng wieder. »Abschnitte« wäre idiomatischer, aber auch stärker deutend; die Alternative wird in einer Fußnote genannt.
- source_word: ሥሩዓን
  choice: eingesetzt
  rationale: Die Form bezeichnet ein Geordnet-, Bestimmt- oder Eingesetztsein. »Eingesetzt« passt zum kosmisch-administrativen Zusammenhang, ohne die religiös stärker besetzte Bedeutung »ordiniert« einzutragen.
- source_word: ሚልኪኤል
  choice: Milkiel
  rationale: Der Personenname wird konservativ nach der vorliegenden ge'ezischen Form transliteriert und nicht zu einer geläufigeren semitischen Namensform normalisiert.
- source_word: ህልእምሜሌክ
  choice: Helemmelek
  rationale: Die schwer lesbare Namensform des Zeugen wird vorsichtig und lesbar transliteriert; die Unsicherheit wird in der Fußnote offengelegt.
- source_word: ሜሌአየል
  choice: Meleyal
  rationale: Konservative Transliteration der überlieferten ge'ezischen Form; die unsichere Vokalfolge wird nicht spekulativ rekonstruiert.
- source_word: ናሬል
  choice: Narel
  rationale: Nahe, unkomplizierte Transliteration des ge'ezischen Namens.
theological_decisions:
- issue: Wesen der genannten Gestalten
  choice: kosmische Anführer mit einer Funktion in der Jahreseinteilung
  alternative: personifizierte astronomische Markierungen oder Engeloberste der Jahreszeiten
  rationale: Der Zusammenhang des astronomischen Buches legt himmlische Amtsträger nahe. Die Bezeichnung »Anführer« bewahrt diese Bildwelt, ohne ausdrücklich eine ausgearbeitete Engellehre oder eine bloße Personifikation festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte Bestimmung »eingesetzten« macht den Satz flüssig und bezieht ሥሩዓን klar auf die Anführer. »Voneinander scheiden« vermeidet die unnatürliche Formulierung »vier Teile teilen« und wahrt zugleich die Bedeutung des ge'ezischen Verbs. Die Eigennamen bleiben bewusst konservativ transliteriert.
