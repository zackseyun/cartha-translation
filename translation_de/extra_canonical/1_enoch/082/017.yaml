base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/017.yaml
  text: 'And these are the names of the leaders who are under them: Berkael[a], Zelbesael, and another who is added, the head of a thousand, whose name is Helyaseph[c][b]. And the days of the dominion of this one are completed.'
translation:
  language: de
  text: 'Und dies sind die Namen der Anführer, die unter ihnen stehen: Berkael, Zelbesael und ein weiterer, der hinzugefügt wird, ein Haupt über Tausend, dessen Name Helyaseph ist.[a] Und die Tage der Herrschaft dieses einen sind vollendet.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Satzfügung im Ge’ez ist sperrig. Möglich ist auch: „… und ein weiterer, der als Haupt über Tausend hinzugefügt wird; sein Name ist Helyaseph.“'
    reason: textual_variant
  - marker: b
    text: 'Oder: „Und die Tage der Vollmacht dieses einen sind erfüllt.“ Das zugrunde liegende Wort kann Herrschaft, Vollmacht oder übertragene Gewalt bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አስማቲሆሙ
  choice: ihre Namen
  rationale: Natürliche deutsche Wiedergabe der pluralischen Possessivverbindung in der einleitenden Namensformel.
- source_word: መራሕያነ
  choice: Anführer
  rationale: Bezeichnet leitende Personen, ohne sie näher als militärische, priesterliche oder ausdrücklich engelhafte Amtsträger festzulegen.
- source_word: እለ መትሕቴሆሙ
  choice: die unter ihnen stehen
  rationale: Bewahrt das hierarchische Verhältnis und klingt im modernen Standarddeutsch natürlicher als das wörtlichere „die unter ihnen sind“.
- source_word: ብርክኤል
  choice: Berkael
  rationale: Konservative Transliteration des Personennamens.
- source_word: ዜልብስኤል
  choice: Zelbesael
  rationale: Konservative Transliteration; die unsichere Vokalisierung wird nicht durch eine stärker deutende Form verdeckt.
- source_word: ዘይትዌሰክ
  choice: der hinzugefügt wird
  rationale: Gibt den passivischen Sinn wieder und bewahrt die textlich sperrige Vorstellung eines zusätzlich in die Reihe aufgenommenen Amtsträgers.
- source_word: ርእሰ ፲፻
  choice: das Haupt über Tausend
  rationale: Bewahrt das Bild des „Hauptes“ und den Rangcharakter, ohne einen bestimmten späteren militärischen Titel einzutragen.
- source_word: ስሙ ሂሉያሴፍ
  choice: dessen Name Helyaseph ist
  rationale: Gibt das im Ge’ez ausdrücklich vorhandene „sein Name“ wieder und transliteriert den Namen konservativ.
- source_word: ተፈጸመ መዋዕለ ስልጣኑ ለዝ
  choice: die Tage der Herrschaft dieses einen sind vollendet
  rationale: Erhält sowohl den Vollendungsaspekt als auch die deiktische Wendung „dieses einen“; das Präsens passt zum wiederkehrenden kalendarischen Ablauf des Zusammenhangs.
theological_decisions:
- issue: Wesen der hierarchischen Titel in der Ordnung der Himmelslichter
  choice: Administrative Rangbegriffe („Anführer“, „Haupt über Tausend“) ohne ausdrückliche Identifikation als Engel
  alternative: Die Genannten ausdrücklich als Engelfürsten oder ausschließlich als astronomische Funktionsträger bezeichnen
  rationale: Der Vers setzt eine kosmische Hierarchie voraus, bestimmt das Wesen der genannten Gestalten an dieser Stelle aber nicht ausdrücklich. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit maßvoll formaler Syntax. Die hierarchischen Titel bleiben quellennah; die ungewöhnliche Fügung beim zusätzlich genannten Amtsträger wird nicht stillschweigend geglättet. Alle Fußnotenmarker stehen im Haupttext.
