  to: 'Und dies sind die Namen der Anführer, die unter ihnen stehen: Berkael, Zelbesael und ein weiterer, der hinzugefügt wird, ein Haupt über Tausend, dessen Name Helyaseph ist.[a] Und die Tage der Herrschaft dieses einen sind vollendet.[b]'
