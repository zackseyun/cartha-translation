base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/012.yaml
  text: 'And these are the heads of a thousand: between leader and leader[a], six are added after the station[e][d][c][b]; and their leaders make the distinction.'
translation:
  language: de
  text: 'Und dies sind die Obersten über Tausend[a]: Zwischen je einem Führer und dem nächsten werden nach der Stellung sechs hinzugefügt; und ihre Führer unterscheiden sie.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »Häupter von tausend« oder »Oberste von tausend«. Gemeint ist wahrscheinlich ein technischer Rangtitel; die genaue Beziehung dieser Obersten zu den astronomischen Größen bleibt unklar.'
    reason: lexical_alternative
  - marker: b
    text: 'Der äthiopische Wortlaut dieses Verses ist textlich und syntaktisch schwierig. Der letzte Satz kann auch bedeuten: »Ihre Führer trennen sie« oder »ihre Führer erkennen sie«. Vermutlich geht es um technische Einteilungen innerhalb der Ordnung der Himmelslichter.'
    reason: textual_variant
lexical_decisions:
- source_word: እሙንቱ
  choice: dies
  rationale: Der pluralische Demonstrativausdruck führt die unmittelbar behandelten Größen ein.
- source_word: አርእስት፡ ፲፻
  choice: Obersten über Tausend
  rationale: Die Verbindung bezeichnet wahrscheinlich den bekannten administrativen beziehungsweise militärischen Rang eines über Tausend gesetzten Obersten; die technische Ausdrucksweise bleibt erhalten.
- source_word: ማእከለ፡ መራኂ፡ ወመራኂ
  choice: zwischen je einem Führer und dem nächsten
  rationale: 'Die wiederholte Substantivkonstruktion mit ማእከለ und ወ ist idiomatisch distributiv zu verstehen: zwischen einem Führer und einem anderen.'
- source_word: ይትዌሰኩ፡ ፮
  choice: werden sechs hinzugefügt
  rationale: Die Verbform bezeichnet ein Hinzufügen; was genau hinzugefügt wird, bleibt wie im Ausgangstext unausgesprochen.
- source_word: በድኅረ፡ ምቅዋም
  choice: nach dem festgelegten Standort
  rationale: ምቅዋም bezeichnet ein Stehen, einen Standort oder eine feste Position; die Wiedergabe wahrt den astronomisch-technischen Charakter.
- source_word: መራሕያኒሆሙ
  choice: ihre Führer
  rationale: Die mit መራኂ verwandte Bezeichnung wird aus Gründen der lexikalischen Kohärenz ebenfalls mit „Führer“ wiedergegeben.
- source_word: ይፈልጡ
  choice: unterscheiden sie
  rationale: Das Verb kann trennen, unterscheiden oder erkennen bedeuten; „unterscheiden“ bewahrt die Mehrdeutigkeit zwischen Einteilung und Wahrnehmung.
theological_decisions:
- issue: Soll die schwierige Aussage ausdrücklich als Kalenderregel oder als Einschaltung von Zusatztagen erklärt werden?
  choice: Die technische und teilweise dunkle Formulierung über Oberste, Führer, sechs Hinzugefügte und Unterscheidung bleibt bestehen.
  alternative: Eine deutende Paraphrase über Schalttage oder Jahresabschnitte.
  rationale: Der äthiopische Text nennt die ergänzten Einheiten nicht ausdrücklich, und seine Syntax ist schwierig. Eine eindeutige kalendarische Erklärung würde mehr festlegen, als die Quelle sicher erkennen lässt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener technischer Fremdheit. Unausgesprochene Bezugswörter wurden nicht ergänzt; der idiomatische Ausdruck zwischen den Führern wurde dagegen natürlich verdeutscht.
