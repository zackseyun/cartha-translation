base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/011.yaml
  text: And their four leaders enter first, those who divide the four parts of the year; and after them the twelve leaders of the orders, those who divide the months; and the three hundred and sixty-four heads of thousands, the ones who distinguish the days; and the four that are added with them, the leaders who distinguish the four divisions of the years.
translation:
  language: de
  text: 'Und ihre vier Leiter treten zuerst ein: diejenigen, die das Jahr in vier Teile gliedern[a]. Nach ihnen kommen die zwölf Leiter der Ordnungen, die die Monate gliedern, und die dreihundertvierundsechzig Tausendschaftsobersten[b], die die Tage unterscheiden[c], sowie die vier, die ihnen hinzugefügt werden: die Leiter, die die vier Abschnitte der Jahre unterscheiden[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die vier Teile des Jahres“; gemeint sein können die vier Jahresabschnitte oder Quartale.'
    reason: lexical_alternative
  - marker: b
    text: Die Zahl 364 entspricht dem schematischen 364-Tage-Kalender des Astronomischen Buches. Der Ausdruck „Tausendschaftsoberste“ gibt wörtlich „Häupter/Oberste der Tausende“ wieder.
    reason: cultural_note
  - marker: c
    text: 'Oder: „die die Tage kenntlich machen“ beziehungsweise „bestimmen“.'
    reason: lexical_alternative
  - marker: d
    text: 'Die Syntax des ge''ezischen Textes ist hier schwierig. Möglich ist auch: „diejenigen, die die Leiter der vier Abschnitte des Jahres unterscheiden“.'
    reason: textual_syntax
lexical_decisions:
- source_word: መራሕያኒሆሙ / መራሕያን
  choice: ihre Leiter / die Leiter
  rationale: Das Wort bezeichnet Führende oder Leitende. „Leiter“ bewahrt die hierarchische, kosmisch-administrative Bildsprache, ohne die Gestalten ausdrücklich als Engel zu bestimmen.
- source_word: ይበውኡ ቀዳሚ
  choice: treten zuerst ein
  rationale: Gibt sowohl die Bewegung des Eintretens als auch die zeitliche Reihenfolge wieder.
- source_word: ይሌልዩ
  choice: gliedern
  rationale: Im kalendarischen Zusammenhang bezeichnet das Verb das Einteilen beziehungsweise Abgrenzen von Jahr und Monaten. „Gliedern“ klingt im Deutschen natürlicher als das mögliche, aber härtere „teilen“.
- source_word: ፬ ክፍለ ዓመት
  choice: das Jahr in vier Teile
  rationale: Bewahrt die wörtliche Vorstellung von vier Teilen des Jahres, ohne sie im Haupttext bereits als Quartale oder Jahreszeiten zu deuten.
- source_word: ዘሥርዓታት
  choice: der Ordnungen
  rationale: Das Substantiv bezeichnet geordnete Anordnungen oder festgelegte Reihen. „Ordnungen“ wahrt den strukturierten kosmisch-kalendarischen Sinn.
- source_word: ፲፻ወ፷፬ አርእስት ፲፻
  choice: die dreihundertvierundsechzig Tausendschaftsobersten
  rationale: „Tausendschaftsoberste“ gibt die überlieferte Verbindung von „Häuptern/Obersten“ und „Tausenden“ verständlich wieder und vermeidet das im Deutschen missverständliche „Häupter der Tausende“.
- source_word: ይፈልጥዎሙ ለመዋዕል
  choice: die die Tage unterscheiden
  rationale: Das Verb kann unterscheiden, erkennen, kenntlich machen oder bestimmen bedeuten. Die Übersetzung wahrt diese Offenheit im kalendarischen Kontext.
- source_word: ይትዌሰኩ ምስሌሆሙ
  choice: die ihnen hinzugefügt werden
  rationale: Bewahrt den ergänzenden Charakter dieser Vier und den Bezug auf die zuvor genannten Gruppen.
- source_word: ፬ መክፈልተ ዓመታት
  choice: die vier Abschnitte der Jahre
  rationale: „Abschnitte“ bildet die Teilungsmetaphorik ab; der ungewöhnliche Plural „Jahre“ bleibt als echte Eigenheit des ge'ezischen Wortlauts erhalten.
theological_decisions:
- issue: Wesen der beschriebenen kosmischen Gestalten
  choice: Sie werden als „Leiter“ und „Tausendschaftsoberste“ bezeichnet, nicht ausdrücklich als Engel.
  alternative: Die Gestalten ausdrücklich als Engel oder lediglich als abstrakte Kalendereinheiten benennen.
  rationale: Der Vers beschreibt eine kosmisch-kalendarische Hierarchie, legt ihre Ontologie aber nicht ausdrücklich fest. Die Übersetzung erhält diese Spannung.
- issue: Syntax des letzten Satzglieds
  choice: Die vier Hinzugefügten werden appositionell als Leiter verstanden, die die vier Abschnitte der Jahre unterscheiden.
  alternative: „Diejenigen, die die Leiter der vier Jahresabschnitte unterscheiden.“
  rationale: Die ge'ezische Wortfolge ist aufgrund der überlieferten Textgestalt syntaktisch schwierig. Die gewählte Lesart folgt der erkennbaren Parallelstruktur des Verses, ohne die alternative Zuordnung zu verschweigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener apokalyptisch-administrativer Bildsprache. Die lange Aufzählung wird durch Doppelpunkt, Punkte und „sowie“ lesbar gegliedert; ungewöhnliche Kalenderterminologie wird nicht vereinfachend aufgelöst.
