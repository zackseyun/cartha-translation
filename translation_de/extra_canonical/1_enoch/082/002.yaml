base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/002.yaml
  text: Wisdom I have given to you[a], and to your children, and to those who shall be your children, so that they may give this wisdom, which is beyond their understanding[c][b], to their children throughout the generations.
translation:
  language: de
  text: Weisheit habe ich dir gegeben[a], deinen Kindern und denen, die deine Kinder sein werden, damit sie diese Weisheit, die über ihr Verständnis hinausgeht[b], ihren Kindern von Generation zu Generation weitergeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „und denen, die deine Kinder sein werden“ stehen in der zugrunde gelegten äthiopischen Textgestalt in Klammern; möglicherweise sind allgemein spätere Nachkommen gemeint.
    reason: textual_variant
  - marker: b
    text: 'Wörtlicher möglicherweise: „auf ihrem Denken“ oder „in ihrem Sinn“. Der äthiopische Ausdruck kann räumlich „über/auf ihrem Denken bzw. Verständnis“ lauten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ጥበበ
  choice: Weisheit
  rationale: Das Substantiv bezeichnet Weisheit oder Einsicht. „Weisheit“ wahrt den umfassenden, gehobenen Sinn und lässt den Kontext den Inhalt näher bestimmen.
- source_word: ወሀብኩ
  choice: habe ich gegeben
  rationale: Das Perfekt wird so wiedergegeben, dass die fortdauernde Bedeutung der vollzogenen Gabe im gegenwärtigen Redekontext hörbar bleibt.
- source_word: ወለውሉድከ
  choice: deinen Kindern
  rationale: Der Ausdruck meint Kinder beziehungsweise Nachkommen; „Kinder“ passt zur anschließenden Weitergabe über mehrere Generationen.
- source_word: '[ወለእለ፡ ይከውኑ፡ ለከ፡ ውሉደ፡]'
  choice: und denen, die deine Kinder sein werden
  rationale: Die relativ nahe Wiedergabe erhält den Bezug auf künftige Kinder oder Nachkommen. Die Klammerung im Zeugen wird durch eine textkritische Fußnote kenntlich gemacht.
- source_word: ከመ፡ የሀቡ፡
  choice: damit sie … weitergeben
  rationale: Die Konstruktion drückt einen Zweck aus. „Weitergeben“ macht im Deutschen die Übermittlung an die nächste Generation natürlich und präzise verständlich.
- source_word: ለትውልዳት
  choice: von Generation zu Generation
  rationale: Der Plural bezeichnet die fortlaufende Überlieferung durch aufeinanderfolgende Generationen.
- source_word: ዲበ፡ ሕሊናሆሙ
  choice: die über ihr Verständnis hinausgeht
  rationale: ዲበ kann „über/oberhalb“ bedeuten, während ሕሊና Denken, Sinn oder Verständnis bezeichnet. Im Zusammenhang ist eine die natürliche Einsicht übersteigende Weisheit wahrscheinlich; die wörtlichere räumliche Fassung bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Art der weitergegebenen Gabe
  choice: „Weisheit“ als offenbarte, weiterzugebende Einsicht
  alternative: allgemeine praktische Klugheit oder ausschließlich astronomisch-kalendarische Unterweisung
  rationale: Der Zusammenhang des Buches der Himmelslichter legt astronomisch-kalendarische Unterweisung nahe, doch der Vers selbst verwendet den weiteren Ausdruck „Weisheit“. Die Übersetzung engt ihn daher nicht ein.
- issue: Verhältnis der Weisheit zum menschlichen Verständnis
  choice: Die Weisheit geht über das Verständnis der Empfänger hinaus
  alternative: Die Weisheit befindet sich „in“ oder „auf“ ihrem Denken
  rationale: Die Präposition kann räumlich „über/auf“ wiedergegeben werden. Die kontextuelle Lesart „über … hinaus“ ist sinnvoll, bleibt jedoch auslegungsbedürftig und wird deshalb durch eine Fußnote abgesichert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die vorangestellte „Weisheit“ bewahrt die Hervorhebung des Ausgangstextes; „weitergeben“ vermeidet eine im Deutschen missverständliche Wiederholung von „geben“. Die textlich unsichere Klausel und die mehrdeutige Wendung zum Verständnis werden nicht stillschweigend geglättet, sondern in Fußnoten ausgewiesen.
