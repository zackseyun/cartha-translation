base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/014.yaml
  text: And the names of those who lead them are Adnarel[a], Iyasusael, and Elomeel. These three follow after the leaders of the orders, and there are two that follow after the leaders of the orders, which follow after all the leaders of the fixed stations[c][b], who divide the four parts of the year.
translation:
  language: de
  text: Und die Namen derer, die sie führen, sind Adnarel, Iyasusael und Elomeel. Diese drei folgen auf die Leiter der Ordnungen, und einer folgt auf die drei Leiter der Ordnungen, die auf alle Leiter der festen Standorte folgen, die die vier Teile des Jahres einteilen.[a][b][c][d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die kritische Druckausgabe liest hier sinngemäß: „einer, der auf die drei Leiter der Ordnungen folgt“. In der überlieferten elektronischen Transkription stehen offenbar durch Zeichenerkennung verursachte Zahlfehler: „zwei“ und später „siebzig“.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „festgesetzte Plätze“ oder „Stellungen“. Gemeint sind feste Positionen innerhalb der beschriebenen Himmelsordnung.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „die vier Abschnitte des Jahres“. Der Ausdruck bezeichnet die kalendarische Vierteilung des Jahres im Astronomischen Buch.'
    reason: lexical_alternative
  - marker: d
    text: Die Satzfügung ist schwierig, da mehrere Gruppen von Leitern durch wiederholtes „folgen“ aneinandergereiht werden. Die Übersetzung bewahrt die Abfolge der kritischen Lesart, ohne die Art dieses Folgens weiter zu bestimmen.
    reason: textual_ambiguity
lexical_decisions:
- source_word: አስማቲሆሙ ለእለ ይመርሃዎሙ
  choice: die Namen derer, die sie führen
  rationale: Die Genitivverbindung mit Relativsatz wird im Deutschen idiomatisch wiedergegeben; „führen“ bewahrt die Vorstellung geordneter Leitung.
- source_word: ይተልዉ / ዘይተሉ
  choice: folgen auf / der ... folgt
  rationale: Die wiederholte Wurzel bezeichnet eine Abfolge. Die Wiederholung bleibt sichtbar, ohne das Deutsche unnötig schwerfällig zu machen.
- source_word: መራሕያነ
  choice: Leiter
  rationale: Das Wort bezeichnet führende Gestalten innerhalb der kosmischen Ordnung; „Leiter“ ist sachlich und vermeidet die weichere Bedeutung von „Führer“ im Sinn bloßer Begleitung.
- source_word: ሥርዓታት
  choice: Ordnungen
  rationale: Gemeint sind strukturierte kosmische Anordnungen beziehungsweise Abläufe. „Ordnungen“ erhält den formalen Sinn, ohne ihn technisch zu verengen.
- source_word: ምቅዋማት
  choice: feste Stellungen
  rationale: Der Ausdruck bezeichnet Standorte oder festgesetzte Positionen. „Feste Stellungen“ bewahrt das räumlich-astronomische Bild.
- source_word: ይፈልጡ
  choice: einteilen
  rationale: Im Zusammenhang mit den vier Teilen des Jahres bezeichnet das Verb deren Aufteilung; „einteilen“ ist im Deutschen natürlicher als das wörtlichere „teilen“.
- source_word: አርባዕተ ክፍለ ለዓመት
  choice: die vier Teile des Jahres
  rationale: Die transparente Wiedergabe vermeidet eine vorschnelle Gleichsetzung mit modernen Quartalen oder Jahreszeiten.
theological_decisions:
- issue: Art der genannten Wesen
  choice: Die drei Bezeichnungen werden als Eigennamen himmlischer Leiter transliteriert.
  alternative: Die Namen als beschreibende Titel übersetzen oder aufgrund vermuteter Verderbnis emendieren.
  rationale: Der astronomische Zusammenhang stellt sie als benannte kosmische Amtsträger dar; der Text selbst bietet keine sichere Grundlage für eine Übersetzung als Epitheta.
- issue: Hierarchie der Leitergruppen
  choice: Die mehrfachen Relativsätze und das wiederholte „folgen“ bleiben syntaktisch offen.
  alternative: Die Gruppen in eine eindeutig aufgelöste Rangordnung umformulieren.
  rationale: Die ge’ezische Satzfügung lässt die genaue Zuordnung der Relativsätze nicht völlig zweifelsfrei erkennen; eine Glättung würde mehr Eindeutigkeit vortäuschen, als der Text bietet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die langen, gestaffelten Relativsätze des Ge’ez werden weitgehend erhalten, durch ein Semikolon jedoch lesbarer gegliedert. Die Eigennamen folgen einer eng am ge’ezischen Lautbestand orientierten Transliteration.
