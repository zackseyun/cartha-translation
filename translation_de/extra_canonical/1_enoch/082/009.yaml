base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/009.yaml
  text: And this is the order of the stars[a], those that set in their places, and in their times, and in their festivals[b], and in their months.
translation:
  language: de
  text: Und dies ist die Ordnung der Sterne, die an ihren Orten[a], zu ihren Zeiten, an ihren Festtagen[b] und in ihren Monaten untergehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „an ihren Standorten“; das geʽezische Wort kann die ihnen zugewiesenen Orte innerhalb des geordneten Laufs der Sterne bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Mit den „Festtagen“ sind kalendarische Festzeiten gemeint, nicht Feste, welche die Sterne selbst feiern. Der Vers verbindet die Ordnung der Sterne mit der Bestimmung heiliger Zeiten.
    reason: cultural_note
lexical_decisions:
- source_word: ሥርዓተ
  choice: Ordnung
  rationale: Der Ausdruck bezeichnet hier die geordnete beziehungsweise festgelegte Abfolge der Gestirnbewegungen; „Ordnung“ bewahrt sowohl die strukturelle als auch die regelhafte Bedeutung.
- source_word: ከዋክብት
  choice: Sterne
  rationale: Dies ist die konkrete Grundbedeutung; „Himmelskörper“ wäre weiter gefasst als der ge’ezische Ausdruck.
- source_word: የዐርቡ
  choice: gehen … unter
  rationale: Im astronomischen Zusammenhang bezeichnet das Verb am ehesten das Hinabgehen beziehungsweise Eintreten der Sterne am Horizont. Die deutsche Wendung „untergehen“ gibt dies natürlich wieder.
- source_word: በመካናቲሆሙ
  choice: an ihren Orten
  rationale: Der Plural mit Possessivsuffix verweist auf die den Sternen zugeordneten Orte oder Standorte. „Orte“ bleibt nah am Wortlaut; „Standorte“ ist als Alternative in der Fußnote vermerkt.
- source_word: በአዝማኒሆሙ
  choice: zu ihren Zeiten
  rationale: Der Ausdruck kann Zeiten oder festgesetzte Zeiträume bezeichnen. „Zu ihren Zeiten“ ist natürlich und lässt den Gedanken bestimmter Zeiten erkennen, ohne ihn ausdrücklich hinzuzufügen.
- source_word: በበዓላቲሆሙ
  choice: an ihren Festtagen
  rationale: Das Substantiv bezeichnet Feste beziehungsweise Festzeiten. „Festtage“ erhält die kultisch-kalendarische Bedeutung und passt idiomatisch zur deutschen Präposition „an“.
- source_word: በአውራኂሆሙ
  choice: in ihren Monaten
  rationale: Der Ausdruck bedeutet „Monate“. Eine Präzisierung als „Mondmonate“ wäre nicht ausdrücklich durch den Vers gedeckt.
theological_decisions:
- issue: Soll die kalendarische Sprache rein säkular wiedergegeben werden?
  choice: „Festtage“ neben „Zeiten“ und „Monaten“ beibehalten
  alternative: Alle Ausdrücke allgemein als „Zeiten“, „Jahreszeiten“ oder „Zeiträume“ wiedergeben
  rationale: Der Vers verbindet die kosmische Ordnung mit der Bestimmung heiliger Zeiten. „Festtage“ bewahrt diese kultisch-kalendarische Dimension, ohne zu unterstellen, die Sterne selbst feierten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt gliedert den ge’ezischen Relativanschluss natürlich; das finite Verb wird im Deutschen ans Satzende gestellt. Die parallele Reihe „Orte – Zeiten – Festtage – Monate“ bleibt erhalten.
