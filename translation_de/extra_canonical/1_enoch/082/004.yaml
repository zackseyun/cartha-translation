base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/082/004.yaml
  text: Blessed are all the righteous who walk in the path of righteousness and have no sin like sinners[a], in the whole count of all their days, while the sun goes on its course in heaven, entering and going out through the gates for thirty days, together with the heads of the thousands of the order of the stars, and with the four that are added, which divide the four parts of the year[c][b], which lead them and enter with them on four days.
translation:
  language: de
  text: Selig sind alle Gerechten, die auf dem Pfad der Gerechtigkeit wandeln und bei denen sich keine Sünde findet wie bei den Sündern[a], während der ganzen Zählung all ihrer Tage, solange die Sonne am Himmel ihre Bahn zieht und durch die Tore ein- und ausgeht, jeweils dreißig Tage lang, zusammen mit den Oberhäuptern der Tausendschaften der Ordnung der Sterne[b] und mit den vier Hinzugefügten[c], die die vier Teile des Jahres teilen, sie führen und an vier Tagen mit ihnen eintreten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Formulierung ist stark und wörtlich etwa: „Bei ihnen ist keine Sünde wie bei den Sündern.“ Sie kann völlige Schuldlosigkeit bezeichnen oder den Lebenswandel der Gerechten dem der Sünder gegenüberstellen.'
    reason: theological_ambiguity
  - marker: b
    text: 'Wörtlicher auch: „die Häupter der Tausendschaften der Ordnung der Sterne“. Die äthiopische Wendung verbindet hierarchische und zahlenbezogene Sprache, ist aber syntaktisch schwierig.'
    reason: lexical_alternative
  - marker: c
    text: Die vorliegende Transkription zeigt an dieser Stelle ein Zahlzeichen, das als „zehn“ gelesen werden kann. Der Zusammenhang mit den vier Teilen des Jahres spricht jedoch für die überlieferte Deutung als vier zusätzliche, eingeschobene Tage.
    reason: textual_variant
lexical_decisions:
- source_word: ብፁዓን፡ ጻድቃን
  choice: Selig sind alle Gerechten
  rationale: „Selig“ bewahrt den feierlichen, an Seligpreisungen erinnernden Klang; „Gerechte“ entspricht dem biblisch-ethischen Leitbegriff.
- source_word: የሐውሩ፡ በፍኖተ፡ ጽድቅ
  choice: die auf dem Pfad der Gerechtigkeit wandeln
  rationale: Bewahrt sowohl das Wegbild als auch das ethische „Wandeln“ in natürlichem, gehobenem Deutsch.
- source_word: ወአልቦሙ፡ ኃጢአት፡ ከመ፡ ኃጥኣን
  choice: und bei denen sich keine Sünde findet wie bei den Sündern
  rationale: Gibt die starke Aussage über das Fehlen von Sünde wieder und lässt zugleich die Funktion des Vergleichs mit den Sündern offen.
- source_word: በኍልቈ፡ ኵሉ፡ መዋዕሊሆሙ
  choice: während der ganzen Zählung all ihrer Tage
  rationale: „Zählung“ erhält die rechnerisch-kalendarische Sprache des astronomischen Abschnitts, auch wenn „Zahl“ idiomatischer wäre.
- source_word: ለዘ፡ የኀውር፡ ፀሐይ፡ በሰማይ
  choice: solange die Sonne am Himmel ihre Bahn zieht
  rationale: Gibt die fortgesetzte Bewegung der Sonne natürlich wieder und lässt einen sprachlichen Widerhall zum Wandeln auf dem Pfad bestehen.
- source_word: በአናቅጽ፡ ይበውእ፡ ወይወጽእ
  choice: durch die Tore ein- und ausgeht
  rationale: Bewahrt die für diesen Abschnitt zentrale Vorstellung der Himmelstore knapp und anschaulich.
- source_word: አርእስተ፡ ፲፻ዘሥርዓቶሙ፡ ለከዋክብት
  choice: Oberhäuptern der Tausendschaften in der Ordnung der Sterne
  rationale: Macht die hierarchisch-administrative Bildsprache sichtbar und erhält zugleich den Singular „Ordnung“.
- source_word: ምስለ፲እለ፡ ይትዌሰኩ
  choice: mit den vier Hinzugefügten
  rationale: Der überlieferte bzw. transkribierte Zahlwert ist problematisch; der unmittelbare Kalenderkontext und die folgenden vier Jahresabschnitte stützen die traditionelle Lesart „vier“. Das Bezugswort „Tage“ wird nicht stillschweigend in den Haupttext eingefügt.
- source_word: እለ፡ ይጼልዩ፡ ማእከለ፡ ፬ክፍለ፡ ዓመት
  choice: die die vier Teile des Jahres voneinander scheiden
  rationale: Natürliches Deutsch für die Funktion der eingeschobenen Einheiten an den Grenzen der vier Jahresabschnitte.
theological_decisions:
- issue: Ob die Gerechten als absolut sündlos bezeichnet werden
  choice: 'Die starke Aussage bleibt stehen: Bei ihnen findet sich keine Sünde wie bei den Sündern.'
  alternative: Sie sündigen nicht in derselben gewohnheitsmäßigen Weise wie die Sünder.
  rationale: Der äthiopische Wortlaut darf weder zu einer bloßen Aussage über Lebensstil abgeschwächt noch als spätere dogmatische Definition absoluter Sündlosigkeit festgelegt werden; der Vergleich bleibt deshalb ausdrücklich erhalten.
- issue: Identität und Zahl der hinzugefügten kalendarischen Einheiten
  choice: Vier Hinzugefügte, die das Jahr in vier Teile gliedern.
  alternative: Zehn hinzugefügte Größen gemäß dem in der Transkription sichtbaren Zahlzeichen.
  rationale: Der Zusammenhang des astronomischen Kalenders und die ausdrückliche Nennung der vier Jahresabschnitte sprechen für vier eingeschobene Tage; die unsichere Textlage wird in einer Fußnote offengelegt.
- issue: Bezug der Relativsätze am Versende
  choice: Die Pronomen und Relativbezüge bleiben im Deutschen weitgehend unaufgelöst.
  alternative: Die vier Zusatztage oder die Oberhäupter ausdrücklich als handelndes Subjekt bestimmen.
  rationale: Die Syntax lässt die Bezüge nicht völlig eindeutig erkennen; eine eindeutige Zuordnung würde die genuine Mehrdeutigkeit des Textes beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener astronomisch-kalendarischer Fachsprache. Ungewohnte Wendungen wie „Zählung all ihrer Tage“ und „Oberhäupter der Tausendschaften“ bleiben erhalten, um die numerische und hierarchische Bildwelt des Ausgangstextes nicht einzuebnen. Die schwierigen Relativbezüge am Schluss werden nicht künstlich vereindeutigt.
