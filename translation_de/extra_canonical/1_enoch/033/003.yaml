  source_fidelity: 'Der deutsche Text folgt dem geʿezischen Satzbau und der in der maßgeblichen älteren Übersetzung bezeugten Lesung: አፎ ist adverbial („wie“), und die anschließende Wendung wird plausibel als „ich zählte die Tore, aus denen sie hervortreten“ verstanden. Die konkreten Tore und die doppelte Bewegungsbeschreibung bleiben erhalten. Die geordnete Aufzählung von Zahl, Namen, Ordnung, Wirken, Zeiten und Monaten ist vollständig wiedergegeben.'
  naturalness: Modernes, gut lesbares Standarddeutsch mit angemessen würdigem Register. „Ausgänge“ bewahrt die räumlich-kosmologische Bildsprache, ohne unverständlich zu sein. Die längere Aufzählung ist für den Ausgangstext charakteristisch und im Deutschen noch klar nachvollziehbar.
  terminology: „Sterne des Himmels“, „Tore“, „Ausgänge“, „Wirken“ und „heiliger Engel“ sind sachgerecht und registerstimmig. Der Eigenname Uriel ist korrekt. Die Fußnote ist sinnvoll am strittigen ersten Satzteil verankert und erläutert die alternative Gliederung, ohne sie als sicher auszugeben.
