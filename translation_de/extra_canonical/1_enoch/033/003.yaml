base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/003.yaml
  text: And I saw the portals from which the stars of heaven come out[a], and I wrote down all their outlets, each one by itself, according to their number and their names, by their order and their activity and their times and their months, as Uriel, the holy angel who was with me[c][b], showed me.
translation:
  language: de
  text: Und ich sah, wie die Sterne des Himmels hervorkommen, und ich zählte die Tore, aus denen sie hervortreten.[a] Ich schrieb alle ihre Ausgänge auf, jeden einzeln, nach ihrer Zahl und ihren Namen, nach ihrer Ordnung und ihrem Wirken, ihren Zeiten und ihren Monaten, wie Uriel, der heilige Engel, der bei mir war, es mir zeigte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die überlieferte Form des Ausdrucks für „ich zählte“ ist in dieser Textwiedergabe schwierig; nach Satzbau und Zusammenhang sind die „Tore“ das, was Henoch zählt. Eine andere Gliederung versteht den Anfang als: „Ich sah die Tore, aus denen die Sterne des Himmels hervorkommen“, lässt dabei aber das Zählen unausgedrückt.'
    reason: textual_variant
lexical_decisions:
- source_word: አፎ
  choice: wie
  rationale: 'Hier ist አፎ als Adverb „wie“ zu verstehen, nicht als „Münder“. So bildet es mit dem folgenden Verb die Aussage: Henoch sah, wie die Sterne hervorkommen.'
- source_word: ወኍለቁ ... ኀዋኅወ
  choice: und ich zählte die Tore
  rationale: Der Zusammenhang verlangt ein Verb des Zählens mit „Tore“ als Objekt. „Tore“ bewahrt zudem die konkrete architektonische Bildwelt der henochischen Kosmologie.
- source_word: ይወጽኡ / ይወፅኡ
  choice: hervorkommen / hervortreten
  rationale: Zwei nahe verwandte deutsche Verben geben die Wiederholung im Ausgangstext lesbar wieder.
- source_word: ጸሐፍኩ ኵሎ ሙፃኣቲሆሙ
  choice: Ich schrieb alle ihre Ausgänge auf
  rationale: „Ausgänge“ kann sowohl die Austrittsstellen als auch die geordneten Vorgänge des Hervortretens bezeichnen und wahrt damit die Bildsprache und eine gewisse semantische Offenheit.
- source_word: ለለ፩፩
  choice: jeden einzeln
  rationale: Die distributive Wendung betont die gesonderte Erfassung jedes einzelnen Ausgangs.
- source_word: በደርጎሙ
  choice: nach ihrer Ordnung
  rationale: „Ordnung“ lässt die möglichen Bedeutungsnuancen von Reihenfolge, Anordnung und Rang offen.
- source_word: ወምገባሮሙ
  choice: und ihrem Wirken
  rationale: „Wirken“ bezeichnet im kosmologischen Zusammenhang Tätigkeit oder Funktionsweise, ohne den Ausdruck technisch zu verengen.
- source_word: ወጊዜሆሙ ወአውራኂሆሙ
  choice: ihren Zeiten und ihren Monaten
  rationale: Die direkte Wiedergabe bewahrt die zeitliche Gliederung des astronomischen Verzeichnisses.
theological_decisions:
- issue: Konkrete kosmologische Bildwelt
  choice: Die Sterne treten aus wirklichen „Toren“ hervor.
  alternative: Die Aussage als gewöhnliche Beobachtung des Aufgangs der Sterne zu modernisieren.
  rationale: Der Text schildert eine offenbarte, konkret vorgestellte Himmelsordnung. Diese apokalyptische Bildwelt darf nicht in moderne astronomische Sprache umgedeutet werden.
- issue: Uriels Rolle
  choice: Uriel zeigt Henoch die geordnete Darstellung.
  alternative: Uriel als Urheber oder Herrscher dieser Ordnung darzustellen.
  rationale: Das Verb bezeichnet hier das Zeigen bzw. Offenbaren; weitergehende Aussagen über Uriels Funktion wären nicht durch diesen Vers gedeckt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete apokalyptische Sprache bleibt erhalten; die aufzählende Satzstruktur spiegelt Henochs geordnete Bestandsaufnahme, ohne unnötig altertümlich zu wirken.
