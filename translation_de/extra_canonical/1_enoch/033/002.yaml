base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/002.yaml
  text: And to the east of these beasts I saw the ends of the earth[a], where the heaven rests[d][c][b], and the open gates of heaven.
translation:
  language: de
  text: Und östlich von diesen Tieren sah ich die Enden der Erde[a], wo der Himmel ruht[b], und die offenen Tore des Himmels[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »die äußersten Grenzen der Erde«. Der ge’ezische Ausdruck bezeichnet die fernsten Grenzen oder Ränder der Welt.'
    reason: lexical_alternative
  - marker: b
    text: Das Bild setzt die antike Vorstellung voraus, dass der Himmel am Rand der Welt einen Ruhe- oder Stützpunkt hat.
    reason: cultural_note
  - marker: c
    text: »Tore des Himmels« kann je nach Verständnis der himmlischen Architektur auch mit »Öffnungen« oder »Fenster des Himmels« wiedergegeben werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ጽባሖሙ ለእሉ አርዌ
  choice: östlich von diesen Tieren
  rationale: Die Wortfolge bezeichnet nach der revidierten quellenbezogenen Analyse ausdrücklich die Himmelsrichtung Osten und nennt die zuvor erwähnten Tiere; beides wird im Deutschen bewahrt.
- source_word: አጽናፈ ምድር
  choice: die Enden der Erde
  rationale: Die geläufige Wendung erhält das Bild von den äußersten Grenzen der Welt in der apokalyptischen Kosmografie.
- source_word: በኀበ ሰማይ የዐርፍ
  choice: wo der Himmel ruht
  rationale: Die natürliche deutsche Formulierung gibt das konkrete Ruhen des Himmels am Rand der Erde wieder, ohne das antike Weltbild zu modernisieren.
- source_word: ኀዋኅወ ሰማይ ርኁዋተ
  choice: die offenen Tore des Himmels
  rationale: „Tore“ ist im Deutschen ein klares, würdevolles Bild für die Öffnungen der himmlischen Architektur; „offenen“ gibt ihren Zustand unmittelbar wieder.
theological_decisions:
- issue: Antikes kosmologisches Bild vom ruhenden Himmel an den Enden der Erde
  choice: wo der Himmel ruht
  alternative: wo der Himmel die Erde berührt
  rationale: Die konkrete visionäre Kosmografie bleibt erhalten. Eine Deutung als bloßer Horizont oder abstraktes Zusammentreffen von Himmel und Erde würde das Bild abschwächen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdevollem visionärem Ton. Die antike kosmologische Bildwelt und die mögliche Bedeutungsbreite der himmlischen Tore werden bewahrt.
