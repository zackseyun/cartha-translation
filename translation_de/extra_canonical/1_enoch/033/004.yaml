base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/004.yaml
  text: He showed me everything[a], and wrote it down for me; and again he wrote down for me their names, and their commands[c][b], and their companies.
translation:
  language: de
  text: Er zeigte mir alles und schrieb es für mich auf; und wiederum schrieb er mir ihre Namen, ihre Anordnungen[a] und ihre Gruppen[b] auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Befehle“, „ihre Gesetze“ oder „ihre Ordnungen“. Das äthiopische Wort kann sowohl autoritative Weisungen als auch vorgeschriebene Regelungen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „ihre Versammlungen“, „ihre Gemeinschaften“ oder „ihre Scharen“. Gemeint sind wahrscheinlich geordnete Gliederungen innerhalb der geschauten kosmischen Welt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎ
  choice: alles
  rationale: Gibt den umfassenden Gegenstand des Zeigens knapp und natürlich wieder.
- source_word: አርአየኒ
  choice: er zeigte mir
  rationale: Bewahrt den konkreten visuellen Charakter der Schau; „offenbarte“ wäre stärker deutend.
- source_word: ጸሐፈ ሊተ
  choice: schrieb es für mich auf / schrieb er für mich … auf
  rationale: „Aufschreiben“ bringt den dokumentierenden Sinn zum Ausdruck. Die Wiederholung des Verbs im Ausgangstext bleibt erhalten.
- source_word: ወዓዲ
  choice: außerdem
  rationale: Kennzeichnet einen weiteren Schreibakt in flüssigem modernem Deutsch; auch „und weiter“ oder „wiederum“ wäre möglich.
- source_word: አስማቲሆሙ
  choice: ihre Namen
  rationale: Direkte Wiedergabe des Plurals mit pronominalem Suffix.
- source_word: ትእዛዞሙ
  choice: ihre Anordnungen
  rationale: Deckt sowohl autoritative Weisungen als auch festgelegte Regelungen ab und legt im kosmischen Zusammenhang weder ausschließlich mündliche Befehle noch abstrakte Naturgesetze fest.
- source_word: ማኅበራቲሆሙ
  choice: ihre Verbände
  rationale: Bezeichnet organisierte Gruppierungen, ohne die Wesen ausdrücklich als militärische Heerscharen oder als bloße menschliche Versammlungen zu bestimmen.
theological_decisions:
- issue: Ob die possessiven Formen geordnete himmlische beziehungsweise kosmische Gruppen bezeichnen
  choice: „Verbände“ bewahrt den Gedanken geordneter Gruppierungen, ohne ihren Charakter näher festzulegen.
  alternative: „Scharen“, „Versammlungen“ oder „Gruppen“
  rationale: Der visionäre Zusammenhang legt geordnete kosmische Größen nahe, doch der Vers selbst benennt sie nicht ausdrücklich. „Scharen“ könnte eine militärisch-himmlische Deutung importieren, „Gruppen“ wäre zu farblos.
- issue: Ob ትእዛዞሙ als Befehle, Gesetze oder Ordnungen zu verstehen ist
  choice: „Anordnungen“ lässt autoritative Weisung und vorgeschriebene Ordnung zugleich anklingen.
  alternative: „Befehle“, „Gesetze“ oder „Ordnungen“
  rationale: Der Ausdruck besitzt eine autoritative Bedeutung, kann im astronomisch-kosmischen Zusammenhang aber auch festgesetzte Regelungen meinen. Die Übersetzung soll diese Spannung nicht stillschweigend zugunsten nur einer Lesart auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die zweimalige Aussage des Aufschreibens folgt der Wiederholung im äthiopischen Text. Die Fußnoten sichern die lexikalische Offenheit der Begriffe für Anordnung und Gruppierung.
