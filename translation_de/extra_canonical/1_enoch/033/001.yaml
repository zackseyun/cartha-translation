base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/033/001.yaml
  text: And from there I went to the ends of the earth[a], and there I saw great beasts, and they differed from one another; and the birds also differed in their appearance and their forms[c][b], and their voices also differed one from another.
translation:
  language: de
  text: Und von dort ging ich bis an die Enden der Erde. Dort sah ich große wilde Tiere, die sich voneinander unterschieden. Auch die Vögel unterschieden sich in ihrem Aussehen[a] und ihrer Gestalt[b], und auch ihre Stimmen unterschieden sich voneinander.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ihren Gesichtern«.'
    reason: lexical_alternative
  - marker: b
    text: Das zugrunde liegende Wort ist in diesem Textzeugen in Bedeutung beziehungsweise Überlieferung nicht völlig sicher; möglich sind etwa »Gestalt«, »Form« oder vielleicht »Schönheit«.
    reason: textual_variant
lexical_decisions:
- source_word: እምህየ
  choice: von dort
  rationale: Die deiktisch-ablativische Wendung bezeichnet den Ausgangspunkt der weiteren Bewegung und lässt sich im modernen Deutsch schlicht mit »von dort« wiedergeben.
- source_word: ሖርኩ
  choice: ging ich
  rationale: Das einfache Bewegungsverb der ersten Person wird ohne zusätzliche Färbung wiedergegeben und wahrt den berichtenden Stil.
- source_word: አጽናፈ ምድር
  choice: die Enden der Erde
  rationale: Die geläufige apokalyptisch-kosmische Wendung bewahrt die räumliche Bildwelt des Textes.
- source_word: አራዊተ ዐበይተ
  choice: große wilde Tiere
  rationale: አራዊት bezeichnet hier große, nicht domestizierte Tiere; »wilde Tiere« ist im heutigen Deutsch klarer als das missverständliche »Bestien«.
- source_word: ይትዌለጥ
  choice: unterschieden sich
  rationale: Das wiederholte Verb bezeichnet die Verschiedenheit der Tiere beziehungsweise ihrer Merkmale. Seine Wiederholung wird im Deutschen erhalten.
- source_word: ፩እምካልኡ
  choice: voneinander
  rationale: Die reziproke Wendung wird idiomatisch und präzise mit »voneinander« wiedergegeben.
- source_word: አዕዋፍሂ
  choice: auch die Vögel
  rationale: Das additive Element wird durch »auch« bewahrt.
- source_word: ገጾሙ
  choice: ihr Aussehen
  rationale: Wörtlich liegt »ihre Gesichter« nahe; im Zusammenhang der sichtbaren Unterschiede zwischen Vögeln bezeichnet »Aussehen« den Sinn natürlicher, ohne die wörtliche Möglichkeit zu verdecken.
- source_word: ስኖሙ
  choice: ihre Gestalt
  rationale: Das in diesem Zeugen nicht völlig sichere Wort scheint Form, Gestalt oder körperliche Beschaffenheit zu bezeichnen. »Gestalt« bleibt knapp und vermeidet eine unbelegte Ausweitung.
- source_word: ቃሎሙሂ
  choice: auch ihre Stimmen
  rationale: »Stimmen« entspricht dem Grundsinn; »auch« gibt das additive Element wieder und die erneute Verbform bleibt im Satz sichtbar.
theological_decisions:
- issue: Kosmische Ortsangabe አጽናፈ ምድር
  choice: die Enden der Erde
  alternative: die Grenzen der Erde
  rationale: »Enden der Erde« erhält die apokalyptische Weltbeschreibung, ohne sie als bloße Bezeichnung ferner Länder umzudeuten.
- issue: Bedeutungsumfang von ገጾሙ
  choice: ihr Aussehen
  alternative: ihre Gesichter
  rationale: Die kontextgemäße Wiedergabe bezeichnet die sichtbare Erscheinung der Vögel; die wörtlichere Lesart wird in einer Fußnote festgehalten.
- issue: Unsichere Bedeutung von ስኖሙ
  choice: ihre Gestalt
  alternative: ihre Form / ihre Schönheit
  rationale: »Gestalt« bewahrt die körperlich-visuelle Bedeutung, ohne die textlich und lexikalisch bestehende Unsicherheit dogmatisch aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit schlichter visionärer Erzählweise. Die Wiederholung von »unterschieden sich« und das zweimalige »auch« bilden die wiederholten äthiopischen Formen ab; die Satzteilung erhöht die Lesbarkeit, ohne den Gedankengang zu verändern.
