base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/004.yaml
  text: In the disk of the sun there are seven portions of light which are added to it beyond the moon[e][d][c][b][a], and in measure they are added until the seventh portion of the sun is completed.
translation:
  language: de
  text: In der Sonnenscheibe sind sieben Lichtanteile, die ihr über den Mond hinaus hinzugefügt werden,[a] und nach Maß werden sie hinzugefügt, bis der siebte Anteil der Sonne vollendet ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der äthiopische Satzbau ist schwierig. Gemeint scheint zu sein, dass das Licht der Sonne das des Mondes um sieben bemessene Anteile übertrifft. Der Schluss kann auch heißen: „bis der siebte Anteil der Sonne überschritten ist“.'
    reason: textual_variant
lexical_decisions:
- source_word: በክበበ ፀሐይ
  choice: Im Sonnenkreis
  rationale: ክበብ bezeichnet Kreis, Umfang oder kreisförmige Scheibe. „Sonnenkreis“ bewahrt die antike Vorstellung vom kreisförmigen Himmelskörper, ohne eine moderne Umlaufbahn vorauszusetzen.
- source_word: ሰብዓቱ ክፍለ ብርሃን
  choice: sieben Lichtanteile
  rationale: Die Wendung bezeichnet sieben quantitativ verstandene Teile oder Anteile des Lichts; „Lichtanteile“ gibt den schematisch-messenden Charakter knapp wieder.
- source_word: ዘይትዌሰክ ቦቱ
  choice: die ihm ... hinzugefügt werden
  rationale: Die additive beziehungsweise passive Bedeutung passt zur beschriebenen Zunahme; das Pronomen wird auf die Sonne bezogen.
- source_word: እምወርኅ
  choice: über den Mond hinaus
  rationale: እም kann Herkunft oder Vergleich ausdrücken. Hier bleibt die vergleichende Aussage erhalten, ohne eine eindeutige mathematische Beziehung stärker festzulegen, als es der schwierige Satzbau erlaubt.
- source_word: መስፈርት
  choice: nach Maß
  rationale: Die Formulierung erhält die Vorstellung einer geregelten, bemessenen Zunahme.
- source_word: ትትወደይ
  choice: werden sie hinzugefügt
  rationale: Im Zusammenhang mit dem vorherigen additiven Verb wird die Aussage als weitere Beschreibung der Zunahme verstanden; die Wiederholung entspricht dem schematischen Stil.
- source_word: እስከ የሐልፍ ሳብዕ ክፍለ ፀሐይ
  choice: bis der siebte Anteil der Sonne vollendet ist
  rationale: ሳብዕ ist der bestimmte Ordinalbegriff „der siebte“. Das Verb kann ein Hindurchgehen oder Überschreiten bezeichnen; im Kontext ist „vollendet“ eine plausible Wiedergabe des Erreichens des siebten Anteils, während die Unsicherheit angemerkt wird.
theological_decisions:
- issue: Art der kosmologischen Aussage
  choice: Als antike, schematisch bemessene Beschreibung der Himmelslichter wiedergeben
  alternative: Die Aussage symbolisch deuten oder in moderne astronomische Begriffe übertragen
  rationale: Der Abschnitt beschreibt Himmelserscheinungen in der gemessenen Kosmologie des astronomischen Henochbuchs. Die Übersetzung wahrt diese Vorstellungswelt, ohne sie zu allegorisieren oder zu modernisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sonnenkreis“ ist für gewöhnliche Leser verständlich und vermeidet sowohl das technisch-moderne „Umlaufbahn“ als auch das weniger natürliche „Sonnenscheibe“ in dieser Satzkonstruktion. Die quantitative und zugleich altertümlich-kosmologische Ausdrucksweise bleibt bewusst erhalten.
