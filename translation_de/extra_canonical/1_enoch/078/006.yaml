base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/006.yaml
  text: And when the moon rises[a], it appears in the sky as half of a seventh part[c][b], [and all the light is in it,] and it completes its light as fourteen parts.
translation:
  language: de
  text: Und wenn der Mond aufgeht, erscheint er am Himmel als die Hälfte eines siebten Teils[a], [und alles Licht ist in ihm,][b] und er vollendet sein Licht als vierzehn Teile.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich eine zahlenmäßig bestimmte Lichtmenge: „die Hälfte eines siebten Teils“. Das astronomische Buch rechnet die Beleuchtung des Mondes schematisch in Teilen.'
    reason: cultural_note
  - marker: b
    text: Der eingeklammerte ge'ezische Satzteil ist textlich und syntaktisch schwierig. Er scheint auszusagen, dass alles Licht in ihm vorhanden ist; die Übersetzung bewahrt ihn als eigenständige Aussage.
    reason: textual_variant
  - marker: c
    text: 'Die „vierzehn Teile“ gehören zum schematischen Rechensystem dieses Abschnitts und sind nicht als moderne naturwissenschaftliche Beschreibung zu verstehen. Möglich ist auch: „und so wird sein Licht als vierzehn Teile vollendet“.'
    reason: translation_note
lexical_decisions:
- source_word: ይትነሣእ
  choice: aufgeht
  rationale: Im Zusammenhang mit einem Himmelskörper bezeichnet das Verb dessen Aufsteigen beziehungsweise Erscheinen; „aufgeht“ ist die natürliche astronomische Formulierung.
- source_word: ወርኅ
  choice: der Mond
  rationale: Der Kontext handelt vom sichtbaren Himmelskörper und seinem Licht, nicht vom Monat.
- source_word: ያስተርኢ በሰማይ
  choice: erscheint er am Himmel
  rationale: Dies bewahrt den beobachtenden, visuellen Charakter des ge'ezischen Ausdrucks in natürlichem Deutsch.
- source_word: መንፈቀ ሳብዕተ እደ
  choice: die Hälfte eines Siebtels
  rationale: Die technisch-numerische Ausdrucksweise wird bewahrt; „Teil“ ist im Deutschen innerhalb des Bruchs entbehrlich und würde die Formulierung unnötig schwer machen.
- source_word: ብርሃን
  choice: Licht
  rationale: Der einfache Ausdruck passt zur zahlenmäßigen Beschreibung der sichtbaren Mondbeleuchtung.
- source_word: ብርሃን ይከውን ቦቱ ኵሉ
  choice: und alles Licht ist in ihm
  rationale: Die eigenständige, im Zeugen eingeklammerte Aussage wird nicht mit dem folgenden Satzteil verschmolzen; ihre knappe und etwas schwierige Syntax bleibt erkennbar.
- source_word: ከመ ዐሡር ወረቡዕ
  choice: zu vierzehn Teilen
  rationale: Die Zahl vierzehn wird als Bestandteil des schematischen Systems von Lichtteilen wiedergegeben, ohne sie modern-wissenschaftlich umzudeuten.
- source_word: ይፈጽም ብርሃኖ
  choice: er vervollständigt sein Licht
  rationale: Die aktive Verbform und der Gedanke eines bis zur Vollständigkeit fortschreitenden Vorgangs bleiben erhalten.
theological_decisions:
- issue: Numerische Mondbeschreibung oder idiomatische Beschreibung einer Mondphase
  choice: Die schematische Zahlenangabe „die Hälfte eines Siebtels“ und „vierzehn Teile“ bleibt erhalten.
  alternative: Die Stelle als gewöhnliche Beschreibung von zunehmendem Mond oder Vollmond wiedergeben.
  rationale: Der Abschnitt beschreibt die Gestirne in einem technisch-apokalyptischen Rechensystem. Eine Glättung zu modernen Phasenbezeichnungen würde mehr festlegen, als der Text sagt.
- issue: Verhältnis der eingeklammerten Aussage zum abschließenden Vollendungssatz
  choice: Beide Aussagen werden als getrennte Satzteile übersetzt.
  alternative: Beide zu einer Aussage über die Vollendung des gesamten Lichts zusammenziehen.
  rationale: Der überlieferte Text enthält zwei unterscheidbare Aussagen. Ihre Trennung bewahrt die textliche Spannung, auch wenn das Verhältnis sachlich nicht völlig klar ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die technisch-fremdartige Zahlenrede des astronomischen Abschnitts bleibt bewusst sichtbar; die im Quelltext markierte Klammer wird beibehalten.
