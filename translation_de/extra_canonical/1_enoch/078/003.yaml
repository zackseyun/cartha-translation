base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/003.yaml
  text: These are the two great luminaries[a]; their disks are like the disk of heaven[b], and the size of the disks of the two of them is equal.
translation:
  language: de
  text: Dies sind die beiden großen Himmelslichter. Ihre Scheiben sind wie die Scheibe des Himmels,[a] und das Maß ihrer Scheiben ist bei beiden gleich.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Ihre Kreise sind wie der Kreis des Himmels.“ Das entsprechende ge’ezische Wort kann eine Scheibe, einen Kreis oder einen kreisförmigen Umlauf bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Schlusswendung ist schwierig. Wörtlicher etwa: „und das Maß ihrer Kreise ist für die beiden dasselbe.“'
    reason: textual_difficulty
lexical_decisions:
- source_word: ብርሃናት
  choice: Himmelslichter
  rationale: Das Wort bezeichnet hier die beiden kosmischen Lichtträger. „Himmelslichter“ ist im Deutschen natürlich und bewahrt den astronomisch-kosmologischen Sinn besser als das allgemeinere „Lichter“.
- source_word: ዐበይት
  choice: großen
  rationale: Im Zusammenhang mit Sonne und Mond gibt „groß“ die beschreibende Bedeutung wieder, ohne eine Bedeutung wie „mächtig“ einzutragen.
- source_word: ክበቦሙ / ክበበ
  choice: ihre Scheiben / die Scheibe
  rationale: ክበብ kann Kreis, Umfang oder Scheibe bezeichnen. Im Zusammenhang mit den beiden Himmelslichtern und ihrem gleichen Maß ist „Scheibe“ eine verständliche, gegenständliche Wiedergabe; die mögliche Bedeutung „Kreis“ oder „Umlauf“ bleibt in der Fußnote erhalten.
- source_word: ከመ፡ ክበበ፡ ሰማይ
  choice: wie die Scheibe des Himmels
  rationale: ከመ wird als Vergleichspartikel „wie“ verstanden. Die Formulierung bewahrt das ungewöhnliche kosmologische Bild des Ausgangstextes, statt es erklärend aufzulösen.
- source_word: ወእምጣነ
  choice: und das Maß
  rationale: „Maß“ entspricht der Bedeutung von gemessener Größe oder Ausdehnung genauer als das stärker deutende „Größe“ und passt zur folgenden Gleichheitsaussage.
- source_word: ለክልኤሆሙ፡ ዕሩይ
  choice: ist bei beiden gleich
  rationale: Die Schlusswendung bezeichnet wahrscheinlich Gleichheit beziehungsweise Übereinstimmung des Maßes. Die deutsche Fassung ist klar, lässt aber die lexikalische Unsicherheit durch eine Fußnote erkennen.
