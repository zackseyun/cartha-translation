base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/011.yaml
  text: And throughout the time when the moon is waning[a], it diminishes its light before the sun until fourteen days [its light is completed]; and when it is extinguished[d][c][b], all its light is completed in the sky.
translation:
  language: de
  text: Und während der ganzen Zeit, in der der Mond abnimmt, gibt er sein Licht vor der Sonne ab[a], bis zum Ablauf von vierzehn Tagen [sein Licht wird vollendet][b]; und wenn er erlischt, geht sein ganzes Licht am Himmel zu Ende.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich „vor der Sonne“. Das Verb kann hier ein Geben, Setzen, Ablegen oder Übertragen des Lichtes bezeichnen; nach einer anderen Deutung: „vermindert er sein Licht vor der Sonne“.'
    reason: lexical_alternative
  - marker: b
    text: Die eingeklammerten Wörter sind textlich unsicher. Im überlieferten Wortlaut ist „sein Licht“, nicht „vierzehn Tage“, das Subjekt von „wird vollendet“. Gemeint sein kann, dass das Mondlicht innerhalb dieses Zeitraums vollständig zu Ende geht.
    reason: textual_variant
lexical_decisions:
- source_word: ኵሎ፡ ዘመነ፡ ዘተነሡር፡ ወርኅ፡
  choice: während der ganzen Zeit, in der der Mond abnimmt
  rationale: Gibt die Gesamtdauer der abnehmenden Mondphase natürlich und zugleich eng am äthiopischen Ausdruck wieder.
- source_word: ብርሃነ፡ ዚአሃ፡
  choice: sein Licht
  rationale: Bezeichnet das dem Mond zugehörige Licht, ohne zusätzliche Personifizierung.
- source_word: ትወዲ፡
  choice: gibt … ab
  rationale: Die Form kann im Sinn von setzen, legen oder übertragen verstanden werden. „Gibt … ab“ bewahrt gegenüber „vermindert“ die mögliche Vorstellung einer Lichtübertragung, ohne sie übermäßig festzulegen.
- source_word: በቅድመ፡ ፀሐይ፡
  choice: vor der Sonne
  rationale: Bewahrt die räumlich-relationale Formulierung des Ge’ez und lässt offen, ob Gegenwart, Stellung oder Beziehung zur Sonne gemeint ist.
- source_word: እስከ፡ ፲ወ፬መዋዕል፡
  choice: bis zu vierzehn Tagen
  rationale: Die Zeitangabe wird nicht fälschlich zum Subjekt des folgenden Verbs gemacht.
- source_word: '[ይትፌጸም፡ ብርሃና፡]'
  choice: '[wird sein Licht vollendet]'
  rationale: Gibt das ausdrückliche Subjekt „sein Licht“ und den unsicheren, in der Vorlage eingeklammerten Wortlaut sichtbar wieder.
- source_word: ወሶበ፡ ይውዒ፡
  choice: und wenn er erlischt
  rationale: Bewahrt das konkrete Bild vom Erlöschen des Mondes beziehungsweise seines Lichtes.
- source_word: ኵሉ፡ ይትፌጸም፡ ብርሃኑ፡
  choice: kommt sein ganzes Licht … an sein Ende
  rationale: Das Vollendungsverb bezeichnet hier im Zusammenhang des abnehmenden Mondes plausibel das vollständige Zu-Ende-Gehen des Lichtes; die deutsche Wendung vermeidet den missverständlichen Eindruck maximaler Helligkeit.
- source_word: ውስተ፡ ሰማይ።
  choice: am Himmel
  rationale: Passt zum astronomischen Kontext und bezeichnet den sichtbaren Himmelsraum.
theological_decisions:
- issue: Kosmische Bildsprache beim Endzustand des Mondlichts
  choice: wenn er erlischt
  alternative: wenn er dunkel wird / wenn er untergeht
  rationale: Die konkrete, apokalyptisch-kosmische Darstellung wird bewahrt und nicht in moderne astronomische Fachsprache aufgelöst.
- issue: Bedeutung von ትወዲ im Modell des Mondlichts
  choice: gibt er sein Licht … ab
  alternative: vermindert er sein Licht / überträgt er sein Licht
  rationale: Die Überlieferungs- und Begutachtungslage ist widersprüchlich. Die gewählte Form hält die mögliche Vorstellung eines Abgebens oder Übertragens fest, ohne eine technisch präzise Lichtübertragung zu behaupten oder das Verb stillschweigend nur als Abnahme zu deuten.
