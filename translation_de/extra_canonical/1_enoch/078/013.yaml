base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/013.yaml
  text: 'It is completed with exactness: by day the sun goes down in the west[a], and from the east the moon rises by night and gives light all night, until the sun rises before it[c][b], and the moon is seen before the sun.'
translation:
  language: de
  text: 'Es wird mit Genauigkeit vollendet: Am Tag geht die Sonne im Westen unter, und vom Osten steigt der Mond bei Nacht auf und leuchtet die ganze Nacht, bis die Sonne vor ihm aufgeht[b], und der Mond vor der Sonne zu sehen ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: Die mit »aufgeht« wiedergegebene Verbform ist textlich unsicher. Im Zusammenhang ist vermutlich das Aufgehen oder Erscheinen der Sonne gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትፌጸም
  choice: es wird vollendet
  rationale: Die passive beziehungsweise reflexive Form bezeichnet Vollendung; die Wiedergabe wahrt den sachlichen Zusammenhang und vermeidet unnötig prophetische Anklänge.
- source_word: ጥንቀቀ
  choice: mit Genauigkeit
  rationale: Die adverbiale Bedeutung von Sorgfalt und Präzision beschreibt hier die geordnete Regelmäßigkeit der Himmelsbewegungen.
- source_word: በዕለት
  choice: am Tag
  rationale: Ohne Demonstrativpronomen und im Gegensatz zu በሌሊት ist die allgemeine Zeitangabe gemeint, nicht »an jenem Tag«.
- source_word: ይወርድ
  choice: geht … unter
  rationale: Wörtlich bezeichnet das Verb ein Hinabsteigen; im Deutschen ist »untergehen« für die Sonne natürlich und bildnah.
- source_word: ዐረብ
  choice: im Westen
  rationale: Im Gegenüber zu »Osten« ist hier die Richtungsbezeichnung gemeint.
- source_word: ምሥራቅ
  choice: vom Osten
  rationale: Die Richtungsbezeichnung bezeichnet den Ort des Aufstiegs.
- source_word: የዐርግ
  choice: steigt … auf
  rationale: Das Verb bedeutet »aufsteigen«. Der nachgestellte Mond ist als Subjekt der verbundenen Verben »aufsteigen« und »leuchten« verstanden.
- source_word: ያበርህ
  choice: leuchtet
  rationale: Die Form bezeichnet das Lichtgeben; »leuchtet« ist im Deutschen knapp und idiomatisch.
- source_word: በኵሉ ሌሊት
  choice: die ganze Nacht
  rationale: Bewahrt den Umfangsausdruck in natürlichem modernem Deutsch.
- source_word: ይሠርቅ
  choice: geht … auf
  rationale: Die Form ist textlich schwierig; im Zusammenhang mit der Sonne liegt deren Aufgehen oder Erscheinen nahe.
- source_word: በቅድሜሁ
  choice: vor ihm
  rationale: Die Form kann zeitliche oder räumliche Vorrangigkeit ausdrücken; »vor ihm« lässt diese Mehrdeutigkeit bestehen.
- source_word: ይትረአይ
  choice: ist … zu sehen
  rationale: Die passive beziehungsweise reflexive Sichtbarkeitsform wird transparent und zugleich natürlich wiedergegeben.
- source_word: በቅድመ ፀሐይ
  choice: vor der Sonne
  rationale: Die Wiedergabe erhält die mögliche zeitliche oder räumliche Bedeutung von »vor«.
theological_decisions:
- issue: Ob die ungewöhnliche astronomische Abfolge geglättet werden soll
  choice: Die Abfolge bleibt einschließlich des zweimaligen »vor« weitgehend unverändert.
  alternative: Den Vers als allgemeine Beschreibung von Sonnenuntergang, Mondlicht und Sonnenaufgang paraphrasieren.
  rationale: Die schwierige und möglicherweise technische Ausdrucksweise des äthiopischen Textes soll nicht durch eine stillschweigende astronomische Harmonisierung ersetzt werden.
- issue: Subjekt von የዐርግ und ያበርህ
  choice: 'Der nachgestellte »Mond« ist Subjekt beider Verben: Er steigt auf und leuchtet.'
  alternative: Die Sonne als unausgesprochenes Subjekt von »steigt auf« verstehen.
  rationale: Die geʿezische Syntax kann das gemeinsame Subjekt nach einer Verbkette setzen; außerdem ergibt sich so die Parallelität von Sonne am Tag und Mond bei Nacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit sachlich-astronomischem Ton. Die etwas sperrige Satzfolge und die Mehrdeutigkeit von »vor« bleiben erhalten. Es wird nur eine Fußnote gesetzt, weil die frühere englische Fußnote [a] auf einer inzwischen korrigierten Subjektzuordnung beruht und [c] lediglich eine überholte Lesart dokumentiert.
