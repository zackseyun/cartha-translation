base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/005.yaml
  text: And they set[a], and they enter the western portals, and make their circuit by the north[b], and by the eastern portals they come out upon the face of the sky.
translation:
  language: de
  text: Und sie gehen unter und treten durch die Tore im Westen ein[a]; dann ziehen sie auf der Nordseite[b] herum und kommen durch die Tore im Osten auf der Himmelsfläche hervor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das wiederkehrende Bild der Tore stellt den Himmel als geordnetes Gefüge mit festen Öffnungen dar, durch die sich die Himmelskörper bewegen.
    reason: cultural_note
  - marker: b
    text: Die äthiopische Wendung ist knapp; sie kann auch eine Bewegung um den Norden herum oder am nördlichen Bereich entlang bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: የዐርቡ
  choice: sie gehen unter
  rationale: Im astronomischen Zusammenhang bezeichnet das Verb das Untergehen der Himmelskörper; die geläufige deutsche Wendung bewahrt diesen Fachsinn.
- source_word: ይበውኡ
  choice: sie treten … ein
  rationale: Das Bewegungsverb bildet den natürlichen Gegenpol zum späteren Hervorkommen und passt zum Bild fester Himmelsöffnungen.
- source_word: ኆዋኅወ
  choice: Tore
  rationale: „Tore“ bewahrt die kosmisch-architektonische Bildsprache und ist im Deutschen natürlicher und würdevoller als „Portale“.
- source_word: ምዕራብ
  choice: im Westen
  rationale: In Verbindung mit den Toren gibt die deutsche Ortsangabe die westliche Lage klar und idiomatisch wieder.
- source_word: የአውዱ
  choice: ziehen … herum
  rationale: Die Form bezeichnet ein Umher- oder Herumgehen; die Übersetzung wahrt die kreisende Bewegung, ohne einen vollständigen Umlauf stärker zu behaupten, als der Wortlaut erlaubt.
- source_word: እንተ መስዕ
  choice: auf der Nordseite
  rationale: Die knappe Richtungsangabe kann die Route beziehungsweise die Seite der Bewegung bezeichnen; diese Wiedergabe erhält die räumliche Unbestimmtheit weitgehend.
- source_word: እንተ ኆዋኅወ ምሥራቅ
  choice: durch die Tore im Osten
  rationale: Da unmittelbar das Hervorkommen folgt, drückt „durch“ den Weg aus den östlichen Öffnungen im Deutschen am klarsten aus und hält die Parallele zu den westlichen Toren fest.
- source_word: ይወፅኡ
  choice: sie kommen … hervor
  rationale: Das Verb bezeichnet das Hinausgehen oder Hervortreten und entspricht dem vorherigen Eintreten.
- source_word: ዲበ ገጸ ሰማይ
  choice: auf der Himmelsfläche
  rationale: Die konkrete Wendung „auf dem Angesicht/der Oberfläche des Himmels“ wird kompakt bewahrt, statt sie zum bloßen „am Himmel“ zu verflachen.
