base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/002.yaml
  text: 'And the moon has four names: the first is Asonya[a], the second Abla, the third Benase[b], and the fourth Erae.'
translation:
  language: de
  text: 'Und der Mond hat vier Namen: Der erste ist Asonya[a], der zweite Abla, der dritte Benase[b] und der vierte Erae.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das ge’ezische Wort ወርኅ kann sowohl „Mond“ als auch „Monat“ bedeuten. Hier ist „Mond“ vorzuziehen, weil der Vers der Himmelsleuchte vier Namen zuordnet.
    reason: lexical_alternative
  - marker: b
    text: Die vier Namen sind Umschriften der ge’ezischen Formen. Ob ihnen ältere Namensformen zugrunde liegen und wie diese gegebenenfalls lauteten, ist ungewiss.
    reason: cultural_note
lexical_decisions:
- source_word: ወርኅ
  choice: Mond
  rationale: Das Wort kann sowohl den Mond als auch den Monat bezeichnen. Da hier vier Eigennamen aufgezählt werden, passt im unmittelbaren Zusammenhang die Himmelsleuchte „Mond“ am besten.
- source_word: አርባዕተ አስማተ ቦቱ
  choice: hat vier Namen
  rationale: Die wörtliche Besitzkonstruktion „ihm sind vier Namen“ wird in natürlichem Deutsch als „hat vier Namen“ wiedergegeben.
- source_word: ፩ ስሙ … ወካልእ … ወሣልስ … ወራብዕ
  choice: Der erste ist …, der zweite …, der dritte … und der vierte …
  rationale: Die knappe deutsche Aufzählung bewahrt die ordnende Struktur und ist zugleich gut verständlich.
- source_word: አሶንያ / አብላ / ብናሴ / ኤራእ
  choice: Asonya / Abla / Benase / Erae
  rationale: Die vier Bezeichnungen werden als Eigennamen konservativ aus dem äthiopischen Text transliteriert und nicht übersetzt.
theological_decisions:
- issue: Ob ወርኅ als „Mond“ oder „Monat“ wiederzugeben ist
  choice: Mond
  alternative: Monat
  rationale: Im Buch der Himmelslichter und insbesondere angesichts der vier Eigennamen ist die Himmelsleuchte gemeint. Die lexikalische Alternative bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Verbindung „Und“ sowie die schlichte Katalogform des ge’ezischen Textes bleiben erhalten; seltene Namen werden lesbar, aber konservativ transliteriert.
