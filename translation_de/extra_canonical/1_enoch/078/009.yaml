lexical_decisions:
- source_word: አውራኅ
  choice: Monaten
  rationale: Die Form ist als Plural von ወርኅ („Monat“) zu verstehen; der Zusammenhang behandelt die unterschiedliche Länge der Monate.
- source_word: እሙራን
  choice: bestimmten
  rationale: Das Wort bezeichnet hier bestimmte oder festgelegte Monate, nicht die Himmelslichter.
- source_word: ይከውን
  choice: hat
  rationale: Die Kopula wird im Deutschen als natürliche Aussage über die Monatslänge wiedergegeben.
- source_word: ፳ወ፱መዋዕል
  choice: neunundzwanzig Tage
  rationale: Zahl und Zeiteinheit werden unmittelbar und idiomatisch übersetzt.
- source_word: ለወርኅ
  choice: der Monat
  rationale: Die äthiopische Konstruktion bezeichnet die Zahl der Tage, die auf einen Monat entfällt.
- source_word: ወቦ አመ
  choice: einmal aber
  rationale: Die knappe Wendung führt einen einzelnen abweichenden Fall ein; „aber“ macht den Gegensatz im Deutschen deutlich, ohne ihn sachlich auszubauen.
- source_word: ፭ወሳሙን
  choice: achtundzwanzig
  rationale: Die überlieferte Transkription ist wahrscheinlich durch eine Zeichen- oder OCR-Verwechslung entstellt; im kalendarischen Zusammenhang ist ፳ወ፰ („achtundzwanzig“) die plausible Lesart.
