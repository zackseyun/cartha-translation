  text: And in certain months[a], the month has twenty-nine days[c][b], and once twenty-eight.
translation:
  language: de
  text: Und in bestimmten Monaten hat der Monat neunundzwanzig Tage, einmal aber achtundzwanzig.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die überlieferte Transkription ist an dieser Stelle unsicher und lässt sich wörtlich als „fünf Wochen“ lesen. Wahrscheinlich liegt jedoch eine Zeichen- oder OCR-Verwechslung vor, und gemeint ist „achtundzwanzig“.
