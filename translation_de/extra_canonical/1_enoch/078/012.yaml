base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/012.yaml
  text: On the first day she is called the new moon[d][c][b][a], because on that day light rises upon her.
translation:
  language: de
  text: Am ersten Tag wird sie »Neumond«[a] genannt, denn an diesem Tag geht Licht auf ihr auf.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »die Zunehmende«. Gemeint ist der Mond zu Beginn seiner zunehmenden Phase.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »denn an diesem Tag erscheint Licht auf ihr«. Das Geʽez beschreibt, wie Licht auf dem Mond aufgeht beziehungsweise sichtbar wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በቀዳሚት፡ ዕለት
  choice: Am ersten Tag
  rationale: Die Präpositionalverbindung bezeichnet den ersten Tag innerhalb der beschriebenen Mondfolge; »am« ist die natürliche deutsche Zeitangabe.
- source_word: ሠርቀ
  choice: Neumond
  rationale: Das Wort kann »Aufgang« beziehungsweise das Aufgehen oder Zunehmen des Mondes bezeichnen und dient hier als kalendarische Benennung. »Neumond« gibt diese konkrete Bezeichnung im Deutschen verständlich wieder; die mögliche Bedeutung »die Zunehmende« wird in der Fußnote erläutert.
- source_word: ትሠመይ
  choice: wird sie … genannt
  rationale: Die feminine Verbform bezieht sich auf den Mond. Das feminine Pronomen bewahrt die personifizierende Ausdrucksweise des ge’ezischen Textes.
- source_word: እስመ
  choice: denn
  rationale: Die Konjunktion leitet die Begründung für die zuvor genannte Bezeichnung ein.
- source_word: ይትነሣእ፡ ላዕሌሃ፡ ብርሃን
  choice: geht auf ihr Licht auf
  rationale: Die Wiedergabe bewahrt sowohl die Bewegungsvorstellung des Aufgehens als auch den Bezug des Lichts auf die Mondoberfläche. Der fehlende bestimmte Artikel bei ብርሃን wird mit unbestimmtem »Licht« wiedergegeben.
theological_decisions:
- issue: Femininum beim Mond
  choice: Der Mond wird mit »sie/ihr« bezeichnet.
  alternative: Im Deutschen durchgehend das grammatisch maskuline »er/ihm« verwenden.
  rationale: Die ge’ezischen Verb- und Pronominalformen sind feminin und verleihen dem Himmelskörper eine leicht personifizierte Gestalt. Diese Quellennuance wird bewahrt, ohne ihr eine weitergehende theologische Bedeutung zuzuschreiben.
- issue: Bedeutung von ሠርቀ
  choice: Im Haupttext steht die kalendarische Bezeichnung »Neumond«.
  alternative: »die Zunehmende« oder »Aufgang«
  rationale: Im astronomisch-kalendarischen Zusammenhang ist »Neumond« die verständlichste konkrete Benennung. Die dynamische Bedeutung des Wortes und die zunehmende Mondphase bleiben durch die Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewohnte feminine Bezugnahme auf den Mond und das Bild vom aufgehenden Licht bleiben als Merkmale der Vorlage erhalten; die Fußnoten erklären die lexikalischen Alternativen knapp.
