  naturalness: „Fünfzehn Teile Licht“ ist verständlich, aber „fünfzehn Lichtanteile“ ist im Deutschen idiomatischer. Außerdem ist das feminine Pronomen „ihr“ neben „der Mond“ grammatisch inkonsistent. Die bewusst wörtliche Schlussformulierung bleibt ungewöhnlich, wird aber durch die Fußnote sachgerecht erklärt.
  terminology: „Lichtanteile“, „Zeichen des Jahres“ und „Mond“ passen zum technischen, kalendarisch-astronomischen Register. „Zeichen des Jahres“ wahrt den Wortlaut, ohne eine omenartige oder theologische Auslegung einzutragen.
