base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/007.yaml
  text: And fifteen parts of light are added within it until the fifteenth day[a]; and its light is completed as a sign of the year, and it becomes fifteen parts[c][b], and the moon comes into being by half of a seventh part.
translation:
  language: de
  text: Dem Mond werden bis zum fünfzehnten Tag fünfzehn Lichtanteile hinzugefügt[a]. Sein Licht wird als Zeichen des Jahres vollendet, und es beträgt fünfzehn Teile[b]; und der Mond entsteht durch die Hälfte eines Siebtels[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »bis zehn und fünf«; »Tag« ist aus der beschriebenen Mondphasenrechnung ergänzt.'
    reason: clarification
  - marker: b
    text: Die wiederholte Zahl fünfzehn bezeichnet wahrscheinlich fünfzehn gezählte Anteile des Mondlichts.
    reason: cultural_note
  - marker: c
    text: 'Wörtlich etwa: »durch die Hälfte eines siebten Teils«. Die Formulierung ist im Äthiopischen schwierig. Im astronomischen Zusammenhang ist wahrscheinlich die Zunahme um ein Vierzehntel gemeint; dies wird im Haupttext jedoch nicht ausdrücklich gesagt.'
    reason: textual_variant
lexical_decisions:
- source_word: ፲ትኅምስት ብርሃን
  choice: fünfzehn Teile Licht
  rationale: Die Zahl bezeichnet im Zusammenhang die gezählten Lichtanteile des Mondes. »Teile« ist aus dem astronomischen Kontext ergänzt.
- source_word: ይትወደደ ውስቴታ
  choice: werden ihr hinzugefügt
  rationale: Die Form beschreibt die schrittweise Zunahme des Lichtes; das feminine Pronomen bezieht sich im Zusammenhang auf den Mond.
- source_word: እስከ ዐሡር ወኃሙስ
  choice: bis zum fünfzehnten Tag
  rationale: Wörtlich steht »bis zehn und fünf«. »Tag« wird entsprechend der Mondphasenrechnung sinngemäß ergänzt.
- source_word: ይትፈጸም ብርሃነ ዚአሁ
  choice: Dann ist ihr Licht vollständig
  rationale: Das Verb bezeichnet das Erreichen der vollen Lichtmenge.
- source_word: ለትእምርተ ዓመት
  choice: als Zeichen für das Jahr
  rationale: Die Formulierung bewahrt die kalendarische Funktion des Mondlichts, ohne sie allegorisch auszudeuten.
- source_word: ወይከውን ለ፲፲ትኅምስት
  choice: und es beträgt fünfzehn Teile
  rationale: Die schwer verständliche Wendung scheint die volle, in fünfzehn Anteile gegliederte Lichtmenge nochmals anzugeben.
- source_word: ወርኅ
  choice: der Mond
  rationale: Das Wort kann sowohl »Monat« als auch »Mond« bedeuten. Als Subjekt der beschriebenen Lichtzunahme ist hier »Mond« sachlich angemessener.
- source_word: በመንፈቀ ሳብዕ እደ
  choice: nimmt jeweils um die Hälfte eines Siebtels zu
  rationale: Die Präposition wird instrumental beziehungsweise maßangebend verstanden. »Die Hälfte eines Siebtels« entspricht einem Vierzehntel und damit der im Kontext vorausgesetzten täglichen Zunahme des Mondlichts.
theological_decisions:
- issue: Kalendarische Bedeutung des vollendeten Mondlichts
  choice: als Zeichen für das Jahr
  alternative: als Vorzeichen für das Jahr
  rationale: Der Abschnitt beschreibt die geordnete Zeitrechnung durch die Himmelskörper. »Zeichen« wahrt diese kosmologisch-kalendarische Aussage, ohne eine omenartige oder konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die technische Zählweise des astronomischen Abschnitts bleibt erkennbar; Ergänzungen und die Unsicherheit der Schlusswendung werden in den Fußnoten offengelegt.
