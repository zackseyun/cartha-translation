base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/010.yaml
  text: 'And Uriel showed me another law: when light is transferred into the moon[c][b][a], and from where it is transferred from the sun.'
translation:
  language: de
  text: 'Und Uriel zeigte mir eine weitere Ordnung[a]: wenn Licht auf den Mond übertragen wird und von woher es von der Sonne übertragen wird.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein weiteres Gesetz«, »eine weitere Regel« oder »eine weitere Anordnung«. Das ge’ezische Wort kann eine festgelegte kosmische Ordnung oder Regel bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der ge’ezische Satz ist stark verdichtet. Gemeint ist offenbar die Ordnung, nach der der Mond sein Licht von der Sonne empfängt. »Von woher« kann hier möglicherweise auch »von welcher Seite« oder »aus welcher Richtung« bedeuten.
    reason: alternative_reading
lexical_decisions:
- source_word: ካልእት
  choice: eine weitere
  rationale: Kennzeichnet eine zusätzliche Regelung innerhalb einer Folge astronomischer Ordnungen; »weitere« klingt im Deutschen natürlich und bewahrt den fortlaufenden Sinn.
- source_word: ሥርዓተ
  choice: Ordnung
  rationale: Das Wort bezeichnet hier eine festgefügte kosmische Regel oder Anordnung. »Ordnung« bewahrt diese Bedeutungsbreite besser als das stärker juristische »Gesetz«.
- source_word: አርአየኒ
  choice: zeigte mir
  rationale: Gibt das Verb des visionären Berichts unmittelbar wieder, ohne es durch »offenbarte« theologisch zu verstärken.
- source_word: ይትወደይ
  choice: übertragen wird
  rationale: Die Passiv- beziehungsweise Reflexivform beschreibt die Bewegung des Lichts zwischen den Himmelskörpern; die Wiederholung entspricht der gedrängten Struktur des Ausgangstextes.
- source_word: ብርሃን
  choice: Licht
  rationale: Die schlichte Bezeichnung für das Licht eines Himmelskörpers ist klar und vermeidet die interpretativ stärkeren Wörter »Glanz« oder »Strahlung«.
- source_word: ውስተ፡ ወርኅ
  choice: auf den Mond
  rationale: Die Präposition bezeichnet eine gerichtete Übertragung. Im heutigen Deutschen ist bei Licht, das einen Himmelskörper erreicht, »auf den Mond« natürlicher als »in den Mond«, ohne die Bewegungsrichtung aufzugeben.
- source_word: እምኀበ
  choice: von woher
  rationale: Bewahrt den räumlichen Herkunftsbezug und die ungewöhnlich gedrängte Formulierung. Eine genauere Deutung als »von welcher Seite« oder »aus welcher Richtung« bleibt möglich, wird aber nicht in den Haupttext eingetragen.
- source_word: እምፀሐይ
  choice: von der Sonne
  rationale: Bezeichnet die Sonne ausdrücklich als Ausgangspunkt der Lichtübertragung.
theological_decisions:
- issue: Art des Mondlichts
  choice: Der Wortlaut beschreibt das Licht des Mondes als von der Sonne übertragen.
  alternative: Der Text könnte nur eine räumliche Beziehung zwischen Mond- und Sonnenlicht oder eine heute schwer erkennbare astronomische Einzelheit bezeichnen.
  rationale: Das wiederholte Verb zusammen mit der gerichteten Präposition und »von der Sonne« legt abgeleitetes Mondlicht nahe. Die räumliche Einzelheit wird wegen der komprimierten Formulierung nicht weiter festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, leicht sperrige Wiederholung des Ausgangstextes bleibt erkennbar; eine glättende astronomische Erklärung steht nur in der Fußnote.
