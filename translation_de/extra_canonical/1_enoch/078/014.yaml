base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/014.yaml
  text: From where the light comes to the moon, from there again it wanes until all the light is finished, and the days of the month pass, and its disk remains empty, without light.
translation:
  language: de
  text: Von dort, wo das Licht zum Mond kommt, nimmt es von dort wieder ab, bis das ganze Licht erloschen ist und die Tage des Monats vergehen; seine Scheibe bleibt leer, ohne Licht.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Von wo das Licht zum Mond kommt, von dort nimmt es wiederum ab.“ Die korrelative Formulierung hebt hervor, dass das Abnehmen dort einsetzt, woher das Licht kommt.'
    reason: lexical_alternative
  - marker: b
    text: „Seine Scheibe“ kann auch mit „sein Kreis“ oder „seine Rundung“ wiedergegeben werden; gemeint ist die sichtbare runde Gestalt des Mondes.
    reason: lexical_alternative
lexical_decisions:
- source_word: እምኀበ ... እምህየ
  choice: Von dort, wo ... von dort
  rationale: Gibt das korrelative Gefüge „von wo … von dort“ wieder und bewahrt den Hinweis, dass das Abnehmen an derselben Stelle einsetzt, von der das Licht kommt.
- source_word: ይመጽእ ብርሃን ለወርኅ
  choice: das Licht zum Mond kommt
  rationale: Bewahrt die schlichte Bewegungs- und Richtungsangabe, ohne einen modernen Mechanismus der Lichtreflexion einzutragen.
- source_word: ካዕበ የሐፅፅ
  choice: wieder abnimmt
  rationale: „Abnehmen“ ist im Deutschen die natürliche Bezeichnung für die Mondphase und entspricht dem beschriebenen Vermindern des Lichts.
- source_word: እስከ ይትዌዳእ ኵሉ ብርሃን
  choice: bis das ganze Licht erloschen ist
  rationale: Drückt das vollständige Ende des sichtbaren Lichts natürlich und würdig aus; das zugrunde liegende Verb bezeichnet den Abschluss bzw. das Zu-Ende-Gehen.
- source_word: ወየኀልፍ መዋዕለ ወርኅ
  choice: und die Tage des Monats vergehen
  rationale: Versteht ወርኅ hier in seinem zeitlichen Sinn „Monat“, während die zyklische Zeitangabe erhalten bleibt.
- source_word: ወይነብር ክበቡ ባክ ዘእንበለ ብርሃን
  choice: dann bleibt seine Scheibe leer, ohne Licht
  rationale: „Scheibe“ bezeichnet die sichtbare runde Gestalt des Mondes; „leer, ohne Licht“ bewahrt die nachdrückliche Darstellung des Lichtmangels.
theological_decisions:
- issue: Art der Beschreibung des Mondlichts
  choice: Beobachtende kosmologische Beschreibung des Kommens und Abnehmens des Lichts
  alternative: Symbolische Deutung des Lichts oder Modernisierung als reflektiertes Sonnenlicht
  rationale: Der Text beschreibt den geordneten Himmelsvorgang in seiner eigenen apokalyptisch-kosmologischen Sprache. Die Übersetzung erklärt den Mechanismus weder allegorisch noch naturwissenschaftlich um.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, sachlich-kosmologischem Ton. Die Satzstruktur bleibt nahe am korrelativen Aufbau des Ge'ez, wird jedoch durch „dann“ am Schluss im Deutschen lesbarer gemacht.
