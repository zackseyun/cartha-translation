base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/015.yaml
  text: And it makes three months of thirty days[a], and in its season[d][c][b], when its waning occurs.
translation:
  language: de
  text: Und es macht drei Monate mit je dreißig Tagen[a], und dies zu seinen Zeiten[b], wenn seine Berechnung vollendet ist.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Es macht drei Monate, dreißig Tage.“ Gemeint sind drei Monate mit jeweils dreißig Tagen.'
    reason: clarity
  - marker: b
    text: 'Oder: „zu seinen festgesetzten Zeiten“; das ge’ezische Wort kann Zeiten oder bestimmte Zeitabschnitte bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: 'Die Schlussklausel ist unsicher. Möglich ist auch: „wenn seine Abnahme eintritt“ oder „wenn seine Abnahme vollendet ist“. Im kalendarischen Zusammenhang kann die Form jedoch den Abschluss einer Berechnung, Anordnung oder Zählung bezeichnen.'
    reason: textual_uncertainty
lexical_decisions:
- source_word: ሠለስተ፡ ወርኀ
  choice: drei Monate
  rationale: Das Zahlwort mit dem Substantiv bezeichnet drei Monate; im Deutschen steht nach der Kardinalzahl der Plural.
- source_word: ይገብር
  choice: es macht
  rationale: Die Verbform steht in der 3. Person Singular. Das unpersönliche Pronomen wahrt den Rückbezug auf den zuvor behandelten Himmelskörper beziehungsweise Zyklus und vermeidet die grammatisch unzutreffende Lesart „drei Monate ergeben“.
- source_word: ፴መዋዕለ
  choice: zu je dreißig Tagen
  rationale: Die Verbindung bezeichnet dreißig Tage. „Zu je“ macht im Deutschen verständlich, dass die genannten Monate jeweils dreißig Tage umfassen, ohne den Singular des Verbs aufzugeben.
- source_word: በአዝማነ፡ ዚአሁ
  choice: zu seinen festgesetzten Zeiten
  rationale: አዝማን kann Zeiten oder bestimmte Zeitabschnitte beziehungsweise Jahreszeiten bezeichnen. Der Plural „Zeiten“ folgt der Form und „festgesetzt“ lässt den kalendarischen Sinn erkennen.
- source_word: ሶበ
  choice: wenn
  rationale: Die Konjunktion leitet einen temporalen Nebensatz ein.
- source_word: ታኀጻጺተ፡ ዚአሁ
  choice: wenn seine Berechnung vollendet ist
  rationale: Die schwierige Form wird im astronomisch-kalendarischen Zusammenhang als Abschluss einer Berechnung oder Ordnung verstanden. Die Fußnote hält die alternative Deutung als Abnahme ausdrücklich offen.
theological_decisions:
- issue: Mehrdeutige astronomisch-kalendarische Schlussklausel
  choice: „wenn seine Berechnung vollendet ist“ als technische Aussage über den Abschluss einer kalendarischen Berechnung
  alternative: „wenn seine Abnahme eintritt“ beziehungsweise „wenn seine Abnahme vollendet ist“
  rationale: Der Zusammenhang des Astronomischen Buches spricht für technische Kalendersprache; die sprachlich mögliche Beziehung auf das Abnehmen des Mondes darf wegen der unsicheren Form jedoch nicht stillschweigend ausgeschlossen werden.
- issue: Subjekt des singularischen Verbs
  choice: Das vorausgesetzte Gestirn beziehungsweise der Zyklus wird mit „es“ aufgenommen.
  alternative: „Drei Monate ergeben dreißig Tage“
  rationale: Die Alternative glättet den Satz, macht aber „drei Monate“ zum Subjekt und widerspricht damit der singularischen Verbform.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst knapper astronomischer Fachsprache. Die etwas fremdartige Konstruktion „es macht“ bewahrt die singularische Verbform des Ge’ez; Fußnoten erläutern die syntaktische Härte und die echte Unsicherheit der Schlussklausel.
