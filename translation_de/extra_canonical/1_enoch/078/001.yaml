lexical_decisions:
- source_word: አስማቲሁ ለፀሐይ
  choice: die Namen der Sonne
  rationale: Der Plural „Namen“ mit dem auf die Sonne bezogenen Ausdruck wird im Deutschen natürlich als Genitivverbindung wiedergegeben.
- source_word: ከመዝ
  choice: dies sind
  rationale: Die Wendung führt eine Aufzählung ein; „dies sind“ bewahrt die hinweisende, leicht feierliche Form des Ge’ez.
- source_word: ፩
  choice: der eine
  rationale: Die Zahl kennzeichnet den ersten von zwei Namen. „Der eine“ gibt die paarige Gegenüberstellung mit „der zweite“ im Deutschen klar wieder.
- source_word: አርያሬስ
  choice: Aryares
  rationale: Der Sonnenname wird nach dem Ge’ez-Zeugen transliteriert und nicht spekulativ gedeutet.
- source_word: ካልእ
  choice: der zweite
  rationale: Im aufzählenden Zusammenhang bezeichnet das Wort das zweite Glied des Namenspaares.
- source_word: ቶማስ
  choice: Tomas
  rationale: Der Eigenname wird entsprechend der bezeugten Form transliteriert; „Thomas“ würde unnötig eine vertraute Namensform und mögliche spätere Assoziationen eintragen.
theological_decisions:
- issue: Ob die beiden Namen der Sonne vertrauten Formen angeglichen oder inhaltlich gedeutet werden sollen
  choice: Beide werden als transliterierte Eigennamen beibehalten.
  alternative: Die Namen etymologisch deuten oder Tomas zu Thomas normalisieren.
  rationale: Der Text nennt besondere astronomische Namen, deren frühere Form und Bedeutung unsicher sind. Die Transliteration bewahrt diese Unsicherheit und vermeidet spekulative oder spätere religiöse Assoziationen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlicher Aufzählungsform. Die fremdartigen Eigennamen bleiben bewusst unübersetzt.
