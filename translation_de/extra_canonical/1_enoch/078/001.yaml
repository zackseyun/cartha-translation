translation:
  language: de
  text: 'Und dies sind die Namen der Sonne: Der eine ist Aryares[a], und der zweite Tomas.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die beiden Namen der Sonne werden nach dem ge'ezsprachigen Textzeugen transliteriert wiedergegeben. Ihre genaue Form in früheren Textstufen ist unsicher.
