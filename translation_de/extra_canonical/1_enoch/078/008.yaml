base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/078/008.yaml
  text: And in its waning[a], on the first day it diminishes to fourteen parts of its light, and on the second it diminishes to thirteen parts of light, and on the third it diminishes to twelve, and on the fourth to eleven parts, and on the fifth it diminishes to ten parts, and on the sixth it diminishes to nine parts, and on the seventh it diminishes to eight parts, and on the eighth it diminishes to seven, and on the ninth it diminishes to six, and on the tenth it diminishes to five, and on the eleventh it diminishes to four, and on the twelfth it diminishes to three, and on the thirteenth it diminishes to two, and on the fourteenth it diminishes to half of a seventh part of all its light[d][c][b]; and on the fifteenth day that which remains from the whole is consumed.
translation:
  language: de
  text: Und während es abnimmt[a], nimmt es am ersten Tag bis auf vierzehn Teile seines Lichts ab, und am zweiten nimmt es bis auf dreizehn Teile des Lichts ab, und am dritten nimmt es bis auf zwölf ab, und am vierten bis auf elf Teile, und am fünften nimmt es bis auf zehn Teile ab, und am sechsten nimmt es bis auf neun Teile ab, und am siebten nimmt es bis auf acht Teile ab, und am achten nimmt es bis auf sieben ab, und am neunten nimmt es bis auf sechs ab, und am zehnten nimmt es bis auf fünf ab, und am elften nimmt es bis auf vier ab, und am zwölften nimmt es bis auf drei ab, und am dreizehnten nimmt es bis auf zwei ab, und am vierzehnten nimmt es bis auf die Hälfte eines Siebtels seines gesamten Lichts ab[b][c]; und am fünfzehnten Tag wird das, was vom Ganzen übrig ist, aufgezehrt[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „bei seiner Verminderung“. Gemeint ist das Abnehmen des Mondlichts.'
    reason: lexical_alternative
  - marker: b
    text: „Bis auf“ gibt die Teile als jeweils verbleibende Lichtmenge wieder. Grammatisch wäre eine rein formale Wiedergabe ohne ausdrückliche Richtungsangabe möglich; „um vierzehn Teile“ würde jedoch die absteigende Zahlenfolge als Subtraktionsbeträge missverständlich machen.
    reason: source_ambiguity
  - marker: c
    text: „Die Hälfte eines Siebtels“ gibt die mathematisch ungewöhnliche ge’ezische Wendung wörtlich wieder; der auffällige Bruch wird nicht geglättet.
    reason: lexical_alternative
  - marker: d
    text: 'Auch: „wird verbraucht“ oder „geht zu Ende“. Die Verbform bedeutet hier nicht „wird sichtbar“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ሕጸጸ / የኀጽጽ
  choice: Abnehmen / nimmt … ab
  rationale: Die Wortgruppe bezeichnet die fortschreitende Verminderung des Mondlichts. „Abnehmen“ ist im astronomischen Zusammenhang idiomatisch und bewahrt zugleich die formelhafte Wiederholung des ge’ezischen Verbs.
- source_word: እደ / ክፍለ
  choice: Teile
  rationale: Beide Ausdrücke bezeichnen hier gezählte Einheiten des Lichts. „Teile“ ist verständlich, ohne eine nicht ausdrücklich vorgegebene technische Maßeinheit einzuführen.
- source_word: ብርሃኑ / ብርሃን
  choice: sein Licht / das Licht
  rationale: „Licht“ gibt den sichtbaren und messbaren Gegenstand der Zahlenfolge unmittelbar wieder.
- source_word: መንፈቀ፡ ሳብዐቱ
  choice: die Hälfte eines Siebtelteils
  rationale: Die mathematisch auffällige Bruchangabe wird möglichst wörtlich bewahrt und nicht zu einem glatteren Wert normalisiert.
- source_word: ይትዌዳእ
  choice: wird … aufgezehrt
  rationale: Die Form gehört zu ወደአ im Sinn von beenden, verbrauchen oder aufzehren. Im Kontext des fünfzehnten Tages bezeichnet sie das vollständige Verschwinden des verbleibenden Lichts, nicht dessen Sichtbarwerden.
- source_word: ዘተረፈ፡ እምኵሉ
  choice: das, was vom Ganzen übrig ist
  rationale: Die Formulierung hält den Bezug auf den nach der abgestuften Verminderung verbleibenden Rest fest.
theological_decisions:
- issue: Bedeutung der Zahlenfolge
  choice: Die Zahlen werden als verbleibende Teile des abnehmenden Mondlichts wiedergegeben.
  alternative: Die Zahlen als jeweils abgezogene Teile oder als bloß symbolische Folge verstehen.
  rationale: Der Akkusativ des Maßes und die absteigende Reihe 14 bis 2 sprechen für den jeweils erreichten Restbestand. Der astronomische Zusammenhang verlangt keine allegorische Deutung.
- issue: Endzustand am fünfzehnten Tag
  choice: Der verbliebene Rest wird aufgezehrt.
  alternative: Der Rest wird sichtbar oder erscheint.
  rationale: Die ge’ezische Verbform bezeichnet hier Vollendung beziehungsweise Verbrauch. Das entspricht auch dem Abschluss der Abnahmefolge.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange, formelhafte Reihung und die wiederholte Verbform bleiben erhalten, weil sie die gemessene Ordnung des Ausgangstextes prägen. „Bis auf“ verdeutlicht, dass die Zahlen die verbleibenden Lichtteile angeben.
