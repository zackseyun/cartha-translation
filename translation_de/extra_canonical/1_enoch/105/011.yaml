base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/011.yaml
  text: And when they write all the words truthfully in their languages[a], and neither alter nor omit anything from my words[d][c][b], but write down everything truthfully—all the former things—
translation:
  language: de
  text: Und wenn sie alle Worte wahrheitsgetreu in ihren Sprachen[a] niederschreiben und nichts von meinen Worten ändern oder weglassen, sondern alles wahrheitsgetreu niederschreiben – alles Frühere[b] –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »auf/in ihren Zungen«; im Zusammenhang des Schreibens ist damit »in ihren Sprachen« gemeint.'
    reason: lexical_alternative
  - marker: b
    text: Die Schlusswendung ist im äthiopischen Text knapp und kann sinngemäß auch als »alles, was zuvor geschrieben wurde« verstanden werden.
    reason: alternative_reading
lexical_decisions:
- source_word: ወሶበሰ፡
  choice: Und wenn
  rationale: Bewahrt sowohl die Satzverknüpfung als auch die temporale Einleitung.
- source_word: ኵሎ፡ ነገራተ፡
  choice: alle Worte
  rationale: ነገራተ ist Akkusativ und damit direktes Objekt; ein Possessivsuffix fehlt hier. Im literarischen Zusammenhang ist »Worte« natürlicher als »Dinge«.
- source_word: ይጽሐፉ፡
  choice: sie … niederschreiben
  rationale: Die aktive Form wird beibehalten und mit den folgenden aktiven Verben parallel geführt.
- source_word: በርትዕ፡
  choice: wahrheitsgetreu
  rationale: Vereint die Bedeutungsaspekte von Wahrheit, Richtigkeit und gewissenhafter Texttreue.
- source_word: ዲበ፡ ልሳናቲሆሙ፡
  choice: in ihren Sprachen
  rationale: Wörtlich »auf/in ihren Zungen«; im Zusammenhang schriftlicher Überlieferung bezeichnet die Wendung idiomatisch die jeweiligen Sprachen.
- source_word: ወኢይዌልጡ፡ ወኢየሐጽጹ፡
  choice: nichts … ändern oder weglassen
  rationale: 'Gibt die beiden Verbote idiomatisch wieder: weder verändern noch etwas aus dem Text entfernen.'
- source_word: እምነገራቲየ፡
  choice: von meinen Worten
  rationale: Das Possessivsuffix der ersten Person wird ausdrücklich wiedergegeben.
- source_word: አላ፡ ኵሎ፡ በርትዕ፡ ይጽሐፉ፡
  choice: sondern alles wahrheitsgetreu niederschreiben
  rationale: Bewahrt den Gegensatz und die im Ausgangstext wiederholte Forderung nach treuer Niederschrift.
- source_word: ኵሎ፡ ዘቀዳሚ፡
  choice: alles Frühere
  rationale: Die knappe, substantivierte Formulierung wird ohne die nicht ausdrücklich vorhandene Ergänzung »was zuvor geschrieben wurde« wiedergegeben.
theological_decisions:
- issue: Art der geforderten Treue
  choice: Treue schriftliche Übermittlung von Henochs Worten in verschiedenen Sprachen
  alternative: Allgemeine moralische Wahrhaftigkeit oder mündliche Verkündigung
  rationale: Die wiederholten Schreibverben sowie das Verbot des Änderns und Weglassens sprechen vorrangig von Textüberlieferung; »Zungen« lässt dennoch die sprachliche Dimension erkennen.
- issue: Bezug der Schlusswendung
  choice: Die komprimierte und syntaktisch spannungsreiche Wendung »alles Frühere« bleibt erhalten.
  alternative: »alles, was zuvor geschrieben wurde«
  rationale: Das Ausgangswort nennt ausdrücklich das Frühere, aber kein zusätzliches Verb für »geschrieben wurde«; eine präzisierende Deutung gehört daher in die Fußnote.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von »wahrheitsgetreu niederschreiben« und die Gedankenstriche am offenen, komprimierten Versschluss bewahren Struktur und Spannung des ge'ezischen Textes.
