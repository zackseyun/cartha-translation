base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/006.yaml
  text: And now[a], righteous ones, do not fear when you see sinners growing strong and prospering in their ways. Do not become their companions, but keep far from their violence[b]; for you shall be companions of the good ones of heaven.
translation:
  language: de
  text: Und nun, ihr Gerechten, fürchtet euch nicht, wenn ihr seht, dass die Sünder stark werden und auf ihren Wegen Erfolg haben. Seid nicht ihre Gefährten, sondern haltet euch fern von ihrer Gewalt[a]; denn ihr werdet Gefährten der Guten des Himmels[b] sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »von ihrer Unterdrückung« beziehungsweise »von ihrem gewaltsamen Unrecht«.'
    reason: lexical_alternative
  - marker: b
    text: Gemeint ist eine gute himmlische Gemeinschaft; der Ausdruck legt nicht ausdrücklich fest, dass ausschließlich Engel bezeichnet sind.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ኢትፍርሁ
  choice: fürchtet euch nicht
  rationale: Der negative Imperativ wird direkt und in würdigem, natürlichem Deutsch wiedergegeben.
- source_word: ጻድቃን
  choice: ihr Gerechten
  rationale: Bewahrt die substantivische Gruppenbezeichnung und den ethischen Gegensatz zu den Sündern.
- source_word: ይጸንዑ
  choice: stark werden
  rationale: Gibt den Vorgang des Erstarkens wieder, ohne den sichtbaren Erfolg der Sünder weiter auszudeuten.
- source_word: ይደልዉ ፍኖቶሙ
  choice: auf ihren Wegen Erfolg haben
  rationale: Verbindet das günstige Fortkommen mit dem im Ausgangstext bewahrten Bild des Weges als Lebensführung.
- source_word: ሱቱፋነ
  choice: Gefährten
  rationale: Dasselbe Wort wird in beiden Satzhälften gleich übersetzt, sodass der Gegensatz zwischen Gemeinschaft mit den Sündern und Gemeinschaft mit den Guten erhalten bleibt.
- source_word: ግፍዐ
  choice: Gewalttätigkeit
  rationale: Bezeichnet gewaltsames Unrecht; eine Fußnote bewahrt die mögliche Nuance der Unterdrückung.
- source_word: ኄራነ ሰማይ
  choice: die Guten des Himmels
  rationale: ኄራነ ist als substantivierter Plural von „gut“ zu verstehen. Die Wiedergabe wahrt den ethischen Kontrast und vermeidet die sachlich unzutreffende Übersetzung „Heerschar des Himmels“.
theological_decisions:
- issue: Identität der Guten des Himmels
  choice: Die kollektive und nicht näher bestimmte Bezeichnung „die Guten des Himmels“ bleibt erhalten.
  alternative: die Engel des Himmels
  rationale: Der Text bezeichnet die Gruppe nicht ausdrücklich als Engel. Eine breitere Wiedergabe bewahrt die genuine Offenheit des apokalyptischen Ausdrucks.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Mahnung und die Parallelität von „Gefährten“ wurden bewahrt. Das etwas erhöhte „die Guten des Himmels“ bildet die ungewöhnliche und theologisch offene Ge'ez-Wendung genauer ab als eine glättende Umschreibung.
