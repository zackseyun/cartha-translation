base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/004.yaml
  text: Hope[a], and do not abandon your hope, for great joy will be yours[b], like the angels of heaven.
translation:
  language: de
  text: Hofft und gebt eure Hoffnung nicht auf; denn euch wird große Freude zuteilwerden, wie den Engeln des Himmels.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „wie die Engel des Himmels“. Der Vergleich ist ausdrücklich, doch bleibt offen, ob er sich besonders auf ihre Freude, ihren seligen Zustand oder ihren himmlischen Lohn bezieht.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስፈዉ
  choice: Hofft
  rationale: Der pluralische Imperativ wird als direkte, natürliche Aufforderung wiedergegeben; ein im Ausgangstext nicht genanntes Objekt wird nicht ergänzt.
- source_word: ወኢትኅድጉ ተስፋክሙ
  choice: und gebt eure Hoffnung nicht auf
  rationale: Die negative Aufforderung und die Wiederholung des Hoffnungsbegriffs bleiben erhalten. „Nicht aufgeben“ ist im heutigen Deutsch natürlicher als „nicht verlassen“, ohne die Nachdrücklichkeit abzuschwächen.
- source_word: እስመ
  choice: denn
  rationale: Die Konjunktion leitet die Begründung der Aufforderung ein und wahrt einen würdigen, gut verständlichen Ton.
- source_word: ትከዉኑ ለክሙ
  choice: euch wird … zuteilwerden
  rationale: Diese Formulierung gibt die futurische Konstruktion mit Dativ idiomatisch wieder und vermeidet den missverständlichen Anschluss, der bei „wird euch gehören“ entstehen könnte.
- source_word: ፍሥሓ ዐቢይ
  choice: große Freude
  rationale: Die Verbindung aus Substantiv und Adjektiv wird direkt und natürlich wiedergegeben.
- source_word: ከመ መላእክተ ሰማይ
  choice: wie den Engeln des Himmels
  rationale: Der ausdrückliche Vergleich bleibt bestehen. Der Dativ passt zur vorangehenden Wendung „zuteilwerden“, ohne eine Verwandlung der Menschen in Engel zu behaupten.
theological_decisions:
- issue: Reichweite des Vergleichs mit den Engeln
  choice: Die verheißene Freude wird mit der Freude beziehungsweise dem Los der Engel des Himmels verglichen.
  alternative: Die Angesprochenen werden selbst den Engeln gleich oder in Engel verwandelt.
  rationale: Die einfache Vergleichskonstruktion sagt keine Wesensverwandlung aus. Zugleich bleibt offen, ob sich der Vergleich speziell auf die Freude, den seligen Zustand oder den himmlischen Lohn bezieht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter pluralischer Anrede. Das Semikolon gliedert Aufforderung und Begründung. Die rhetorische Wiederholung von „hoffen/Hoffnung“ bleibt erhalten; die Mehrdeutigkeit des Engelvergleichs wird nicht dogmatisch aufgelöst.
