base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/007.yaml
  text: And because you sinners say[a], ‘We are not sought out[d][c][b], and all our sins are not written down’—all your sins are being written down every day.
translation:
  language: de
  text: 'Denn ihr Sünder sagt[a]: »Ihr forscht nicht nach[b], und sie schreiben nicht alle unsere Sünden auf[c].« Doch sie schreiben Tag für Tag alle eure Sünden auf.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht beim Verb „sagt“: „ihr Sünder“. Eine verbreitete Wiedergabe zieht diese Wörter in die anschließende Rede hinein: „Wir Sünder werden nicht aufgesucht …“; grammatisch liegt die Anrede „ihr Sünder“ jedoch näher.'
    reason: textual_variant
  - marker: b
    text: 'Das Verb kann auch „untersuchen“ oder „aufsuchen“ bedeuten. Hier dürfte das Nachforschen nach Schuld im Blick auf das Gericht gemeint sein. Wegen der schwierigen Überlieferung wird die Form bisweilen passiv verstanden: „Wir werden nicht aufgesucht/untersucht“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich steht ein unbestimmtes „sie“. Gemeint sein können himmlische Schreiber; der Vers selbst benennt sie jedoch nicht. Alternativ wird der ganze Satz passiv wiedergegeben: „… und nicht alle unsere Sünden werden aufgeschrieben.“'
    reason: ambiguity
lexical_decisions:
- source_word: ወእስመ
  choice: Denn
  rationale: Die Verbindung leitet eine Begründung ein; „Denn“ gibt den argumentativen Anschluss im Deutschen natürlich und würdig wieder.
- source_word: ትብሉ፡ አንትሙ፡ ኃጥኣን
  choice: ihr Sünder sagt
  rationale: Das ausdrückliche Pronomen der zweiten Person Plural und „Sünder“ stehen als Subjekt beziehungsweise Apposition beim Verb „sagt“.
- source_word: ኢትኅሥሡ
  choice: Ihr forscht nicht nach
  rationale: Die Form wird als zweite Person Plural aktiv wiedergegeben. „Nachforschen“ bewahrt im Zusammenhang mit Sündenregister und Gericht den untersuchenden, möglicherweise gerichtlichen Sinn.
- source_word: ኢይጽሐፉ
  choice: sie schreiben nicht … auf
  rationale: Die Form ist dritte Person Plural aktiv. „Aufschreiben“ erhält das Bild eines fortlaufenden Sündenregisters.
- source_word: ይጽሐፉ፡ ሀለዉ
  choice: sie schreiben … auf
  rationale: Das Hilfsverb ሀለዉ bildet mit dem Imperfekt eine fortdauernde Gegenwart; es ist hier keine Aufforderung wie „siehe“.
- source_word: በኵሉ፡ ዕለት
  choice: Tag für Tag
  rationale: Die distributive Wendung bezeichnet ein tägliches, fortlaufendes Geschehen und klingt im modernen Deutschen natürlich.
theological_decisions:
- issue: Das fortlaufende Verzeichnen der Sünden
  choice: Die Sünden werden Tag für Tag aufgeschrieben.
  alternative: Die Aussage bezeichnet lediglich allgemein Gottes Kenntnis der Sünden.
  rationale: Das zweimal verwendete Verb „schreiben“ und der Gerichtskontext bewahren das apokalyptische Bild eines fortlaufenden Registers, ohne dessen genaue Beschaffenheit festzulegen.
- issue: Die nicht ausdrücklich genannten Schreibenden
  choice: Das unbestimmte „sie“ bleibt erhalten.
  alternative: Die Schreibenden ausdrücklich als Engel oder himmlische Schreiber benennen.
  rationale: Der Vers nennt das Subjekt nicht ausdrücklich. Eine nähere Identifizierung würde über den vorliegenden Wortlaut hinausgehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die auffällige Folge von „ihr“ und „sie“ in der direkten Rede bleibt erhalten, weil sie den erkennbaren Personenformen des äthiopischen Textes entspricht; die überlieferungs- und deutungsbedingte passive Alternative wird in den Fußnoten offengelegt.
