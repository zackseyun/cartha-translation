base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/005.yaml
  text: What will you have to do? You will not have to hide on the day of the great judgment[a], and you will not be found as sinners[c][b]; and everlasting judgment will be upon you for all the generations of the world.
translation:
  language: de
  text: Was werdet ihr tun müssen? Am Tag des großen Gerichts werdet ihr euch nicht verbergen müssen, und man wird euch nicht als Sünder vorfinden[a]. Das ewige Gericht wird euch fernbleiben[b], durch alle Generationen der Welt hindurch.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Formulierung „man wird euch nicht als Sünder vorfinden“ ist im überlieferten Text syntaktisch und inhaltlich schwierig. Man hat sie auch im gegenteiligen Sinn verstanden, etwa: „Man wird euch als Sünder vorfinden.“ Die Übersetzung behält die ge''ezische Verneinung bei.'
    reason: textual_variant
  - marker: b
    text: 'Wörtlich steht hier: „Das ewige Gericht wird von euch sein.“ Das ge''ezische „von euch“ kann in diesem Zusammenhang eine Entfernung oder Trennung ausdrücken; daher: „wird euch fernbleiben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ምንተ፡ ሀለወክሙ፡ ትግበሩ
  choice: Was werdet ihr tun müssen?
  rationale: Die knappe Verbindung aus Fragewort, Existenzkonstruktion und dem Verb „tun“ fragt rhetorisch nach dem, was den Angesprochenen zu tun bleibt. Die deutsche Fassung bleibt nahe an dieser offenen Formulierung.
- source_word: አኮ፡ ትትኀብኡ፡ ሀለወክሙ
  choice: werdet ihr euch nicht verbergen müssen
  rationale: Der t-Stamm von ኀብአ lässt hier eine reflexive Bedeutung zu. In Verbindung mit ሀለወክሙ gibt „nicht … müssen“ natürlich wieder, dass für die Angesprochenen keine Notwendigkeit besteht, sich zu verbergen.
- source_word: በዕለተ፡ ኵነኔ፡ ዐቢይ
  choice: am Tag des großen Gerichts
  rationale: Bewahrt die feierliche apokalyptische Zeitangabe in natürlichem Deutsch.
- source_word: ወኢትትረከቡ፡ ከመ፡ ኃጥኣን
  choice: und man wird euch nicht als Sünder vorfinden
  rationale: Die unpersönliche aktive Form ist im Deutschen natürlicher als ein schwerfälliges Passiv und erhält sowohl die Verneinung als auch den gerichtlichen Unterton von „gefunden werden“.
- source_word: ኵነኔ፡ እንተ፡ ለዓለም
  choice: das ewige Gericht
  rationale: Die wörtliche Bedeutung „Gericht, das für immer ist“ wird knapp wiedergegeben, ohne „Gericht“ vorschnell als „Verdammnis“ zu deuten.
- source_word: ትከዉን፡ እምኔክሙ
  choice: wird euch fernbleiben
  rationale: እምኔክሙ bedeutet formal „von euch“. Im tröstenden Zusammenhang wird die Trennung idiomatisch als „euch fernbleiben“ ausgedrückt; eine Fußnote macht die wörtliche Konstruktion sichtbar.
- source_word: ለእሉ፡ ትዉልደ፡ ዓለም
  choice: durch alle Generationen der Welt hindurch
  rationale: Die Formulierung erhält sowohl die lange zeitliche Erstreckung als auch den Bezug auf die Generationen der Welt.
theological_decisions:
- issue: Bezug des ewigen Gerichts auf die Angesprochenen
  choice: Das Gericht bleibt ihnen fern.
  alternative: Das Gericht kommt über sie.
  rationale: Die Präposition እም („von, weg von“) bezeichnet zunächst Herkunft oder Trennung, nicht „auf/über“. Zusammen mit der Aussage, dass die Angesprochenen nicht als Sünder vorgefunden werden, trägt die tröstende Lesart den unmittelbaren Zusammenhang besser und vermeidet eine Umkehrung der Präpositionsbedeutung.
- issue: Schwierige Verneinung bei „als Sünder vorfinden“
  choice: Die überlieferte Verneinung wird im Haupttext beibehalten.
  alternative: 'Man wird euch als Sünder vorfinden; oder: Man wird euch als nichts anderes als Sünder vorfinden.'
  rationale: Der ge'ezische Text enthält ausdrücklich die Verneinung. Auch wenn die Konstruktion in der Überlieferung und Auslegung Schwierigkeiten bereitet, wird sie nicht stillschweigend beseitigt; die Fußnote legt die Unsicherheit offen.
- issue: Charakter der Anrede
  choice: Trost und Zusicherung für Menschen, die nicht als Sünder gelten
  alternative: Gerichtsdrohung gegen Sünder
  rationale: Die erhaltenen Satzglieder – kein notwendiges Verbergen, nicht als Sünder vorgefunden werden und Gericht „von euch“ – weisen zusammen eher auf eine Zusicherung als auf eine Drohung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage bleibt knapp; gerichtliche Begriffe werden nicht konfessionell ausgelegt. Zwei Fußnoten kennzeichnen die wirklichen sprachlichen Unsicherheiten, ohne den Haupttext unnötig zu belasten.
