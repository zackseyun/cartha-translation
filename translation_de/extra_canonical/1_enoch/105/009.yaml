base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/009.yaml
  text: Do not be wicked in your hearts[a], and do not lie, and do not alter the word of uprightness, and do not declare false the word of the Great Holy One, and do not account your idols as anything; for all your falsehood and all your uncleanness are not for righteousness[f][e][d][c][b], but for great sin.
translation:
  language: de
  text: Geht in euren Herzen nicht in die Irre[a] und lügt nicht. Verändert das Wort der Rechtschaffenheit nicht[b] und erklärt das Wort des Großen Heiligen nicht für falsch[c]. Haltet eure Götzen nicht für etwas[d]; denn all eure Falschheit und all eure Unreinheit gehören nicht zur Gerechtigkeit, sondern zu großer Sünde[e].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Irrt euch nicht in euren Herzen« beziehungsweise »Sündigt nicht in euren Herzen«.'
    reason: lexical_alternative
  - marker: b
    text: Das Verb kann auch »verdrehen« oder »verkehren« bedeuten; »Wort der Rechtschaffenheit« kann ebenso als »Sache der Richtigkeit« verstanden werden.
    reason: lexical_alternative
  - marker: c
    text: Die Fügung kann möglicherweise auch als »das große heilige Wort« verstanden werden.
    reason: textual_ambiguity
  - marker: d
    text: 'Wörtlich im Sinn von »rechnet/achtet eure Götzen nicht als etwas«; möglich ist auch: »Messt euren Götzen keine Bedeutung bei«.'
    reason: lexical_alternative
  - marker: e
    text: 'Oder: »sind nicht für die Gerechtigkeit, sondern für große Sünde« beziehungsweise freier: »führen nicht zur Gerechtigkeit, sondern zu großer Sünde«.'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ኢትርሥዑ፡ በልብክሙ
  choice: Geht in euren Herzen nicht in die Irre
  rationale: Das Verb bezeichnet ein Irren oder Abirren; die Verbindung mit »in euren Herzen« wird bewahrt, ohne bereits ausdrücklich »sündigen« einzusetzen.
- source_word: ወኢተሐስዉ
  choice: und lügt nicht
  rationale: Eine direkte, natürliche Wiedergabe des einfachen Verbs für Lügen.
- source_word: ወአትሚጥዋ፡ ለነገረ፡ ርትዕ
  choice: Verändert das Wort der Rechtschaffenheit nicht
  rationale: Das Verb kann verändern, verdrehen oder verkehren bezeichnen. »Verändert« wahrt die Grundbedeutung; »Rechtschaffenheit« hält ርትዕ vom späteren ጽድቅ, »Gerechtigkeit«, unterscheidbar.
- source_word: ወኢታሐስውዋ፡ ለነገረ፡ ቅዱስ፡ ዐቢይ
  choice: und erklärt das Wort des Großen Heiligen nicht für falsch
  rationale: Die kausativ-faktive Verbform bezeichnet hier nicht bloß eigenes Lügen, sondern das Für-falsch-Erklären beziehungsweise Lügen-Strafen. Die Adjektive werden gemäß dem syntaktisch und kontextuell naheliegenden Personenbezug als Titel verstanden.
- source_word: ወኢትሕስብዋ፡ ለጣዖትክሙ
  choice: Haltet eure Götzen nicht für etwas
  rationale: Das Verb hat die kognitive Bedeutung »rechnen, ansehen, für etwas halten«. Die deutsche Formulierung bewahrt diese Kraft und macht die im Satz vorausgesetzte Nichtigkeit der Götzen idiomatisch verständlich.
- source_word: እስመ፡ አኮነት፡ ኵሉ፡ ሐሰትክሙ፡ ወኵሉ፡ ርኩስነክሙ፡ ለጽድቅ፡ አላ፡ ለኃጢአት፡ ዐቢይ
  choice: denn all eure Falschheit und all eure Unreinheit gehören nicht zur Gerechtigkeit, sondern zu großer Sünde
  rationale: »Gehören zu« bildet die beiden mit ለ markierten Gegenpole ab, ohne die im Ausgangstext nicht ausdrücklich genannte Vorstellung eines Hinführens einzutragen.
theological_decisions:
- issue: Bezug von ቅዱስ ዐቢይ
  choice: das Wort des Großen Heiligen
  alternative: das große heilige Wort
  rationale: Die überlieferte Lesart und der Kontext legen einen Titel für den Urheber des Wortes nahe. Da die knappe geʿezische Fügung auch adjektivisch auf »Wort« bezogen werden kann, bleibt diese Möglichkeit in einer Fußnote sichtbar.
- issue: Aussage über die Götzen
  choice: Haltet eure Götzen nicht für etwas
  alternative: Schätzt eure Götzen nicht hoch
  rationale: Die Übersetzung bleibt bei der Bedeutung des Rechnens oder Dafürhaltens und trägt weder »vertrauen« noch eine ausgearbeitete Aussage über Anbetung in den Text ein.
- issue: Verhältnis von Falschheit und Unreinheit zu Gerechtigkeit und Sünde
  choice: gehören nicht zur Gerechtigkeit, sondern zu großer Sünde
  alternative: führen nicht zur Gerechtigkeit, sondern zu großer Sünde
  rationale: Die relationale Ausgangskonstruktion wird gewahrt; eine ausdrückliche Aussage über kausale Folgen wäre interpretierender.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen, klaren Imperativen. Die Wiederholungen der Verbote und die ethischen Schlüsselbegriffe bleiben erhalten. Ungewöhnliche, aber bedeutungstragende Bilder wie »in euren Herzen« werden nicht geglättet; echte lexikalische und syntaktische Mehrdeutigkeiten erscheinen in den Fußnoten.
