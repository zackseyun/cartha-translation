base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/010.yaml
  text: 'And now I know this mystery: that many sinners will alter the word of righteousness and pervert it[a], and speak evil words and lie, and they will devise great fabrications[d][c][b], and they will write books concerning their own words.'
translation:
  language: de
  text: 'Und nun kenne ich dieses Geheimnis: Viele Sünder werden das Wort der Gerechtigkeit verändern und verdrehen[a]; sie werden böse Worte reden und lügen, große Erdichtungen ersinnen[b] und Bücher über ihre eigenen Worte schreiben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Lesart und Zuordnung des hier mit „verdrehen“ wiedergegebenen Verbs sind unsicher. Möglich ist auch: „Viele Sünder werden das Wort der Gerechtigkeit verändern und davon abweichen“ beziehungsweise „in die Irre gehen“.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „große Erfindungen“ beziehungsweise „große Gebilde hervorbringen“. Der äthiopische Ausdruck bezeichnet etwas Geformtes oder Hervorgebrachtes; der Zusammenhang mit Lüge und böser Rede legt hier eine negative Bedeutung nahe.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አአምር
  choice: kenne ich
  rationale: Das Verb bezeichnet Wissen oder Verstehen; zusammen mit „nun“ ist das deutsche Präsens natürlich und sachlich.
- source_word: ምሥጢር
  choice: Geheimnis
  rationale: „Geheimnis“ bewahrt im apokalyptischen Zusammenhang den Gedanken zuvor verborgener, nun offenbarter Erkenntnis.
- source_word: ነገረ ርትዕ
  choice: das Wort der Gerechtigkeit
  rationale: Die Wendung lässt die Genitivbeziehung offen und kann eine gerechte beziehungsweise wahre Botschaft bezeichnen.
- source_word: ይመይጡ
  choice: werden … verändern
  rationale: Die Form ist aktiv und hat „das Wort der Gerechtigkeit“ zum Objekt; „verändern“ gibt den Grundsinn wieder, ohne die Art der Verfälschung zu eng festzulegen.
- source_word: የዐልዉ
  choice: verdrehen
  rationale: Die überlieferte Lesart beziehungsweise ihre Deutung ist schwierig. Im Zusammenhang mit dem zuvor genannten Wort wird sie hier als weiteres Verfälschen verstanden; die Unsicherheit wird in einer Fußnote offengelegt.
- source_word: ነገራተ እኩያተ
  choice: böse Worte
  rationale: Das anschließende Lügen und Schreiben rückt sprachliche Inhalte in den Vordergrund.
- source_word: ይሐስዉ
  choice: lügen
  rationale: Die direkte Wiedergabe erhält die knappe und scharfe Anklage.
- source_word: ይፈጥሩ ፍጥረተ ዐቢየተ
  choice: gewaltige Truggebilde ersinnen
  rationale: Der Wortstamm bezeichnet Formen oder Hervorbringen. Der polemische Zusammenhang mit bösen Worten und Lügen legt erfundene Gebilde nahe; „Truggebilde“ erhält zugleich etwas von der bildhaften Wortbildung.
- source_word: መጻሕፍተ ይጽሐፉ ዲበ ነገራቲሆሙ
  choice: Bücher über ihre eigenen Worte schreiben
  rationale: Die enge Wiedergabe bindet die Bücher an die eigenen Aussagen der Sünder und vermeidet eine pauschale Verurteilung des Bücherschreibens.
theological_decisions:
- issue: Ob der Text vom Niedergang des gerechten Wortes oder von seiner aktiven Veränderung durch Sünder spricht
  choice: Viele Sünder verändern das Wort der Gerechtigkeit aktiv.
  alternative: Das Wort der Gerechtigkeit wird vernachlässigt oder verliert an Geltung.
  rationale: Die gegebene Form wird syntaktisch als aktives Verb im Plural verstanden, dessen Objekt „das Wort der Gerechtigkeit“ ist. Dadurch bleibt die Warnung gegen menschliche Verfälschung im Vordergrund.
- issue: Bezug und Bedeutung des schwierigen Verbs የዐልዉ
  choice: Es wird auf das Wort bezogen und mit „verdrehen“ wiedergegeben.
  alternative: Die Sünder „weichen ab“ oder „gehen in die Irre“.
  rationale: Der unmittelbare Zusammenhang erlaubt den Objektbezug, doch die Lesart ist nicht sicher. Die Fußnote bewahrt deshalb die mögliche Aussage über das Abirren der Sünder.
- issue: Ob das Schreiben von Büchern an sich verurteilt wird
  choice: Verurteilt werden Bücher, die auf den eigenen falschen Worten der Sünder beruhen.
  alternative: Der Vers verurteilt das Verfassen weiterer Bücher grundsätzlich.
  rationale: Die Syntax verbindet die Bücher mit den zuvor erwähnten bösen Worten, Lügen und Erfindungen; eine allgemeine Verurteilung des Schreibens wäre eine unbegründete Ausweitung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die apokalyptische Schlüsselwendung „Wort der Gerechtigkeit“ bleibt formal erhalten. Textliche und lexikalische Unsicherheiten werden nicht in zusätzliche Haupttextbehauptungen umgewandelt, sondern knapp in Fußnoten ausgewiesen.
