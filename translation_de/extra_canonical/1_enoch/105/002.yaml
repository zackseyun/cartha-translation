base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/002.yaml
  text: Hope[a], for formerly you were put to shame by evil and by affliction; but now you will shine like the light of heaven, you will shine and be seen[c][b], and the portals of heaven will be opened for you.
translation:
  language: de
  text: Hofft! Denn früher wurdet ihr durch Böses und durch Bedrängnis beschämt[a]. Jetzt aber werdet ihr leuchten wie das Licht des Himmels; ihr werdet leuchten und gesehen werden, und die Tore des Himmels werden für euch geöffnet[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „durch Bosheit und durch Leiden“. Der knappe geʿezische Ausdruck lässt offen, ob das Böse persönlich, gesellschaftlich oder als widrige Lage zu verstehen ist.'
    reason: lexical_alternative
  - marker: b
    text: Das Bild sagt nicht ausdrücklich, ob durch die geöffneten Himmelstore Segen herabkommt oder ob den Angeredeten Zugang zum Himmel gewährt wird.
    reason: cultural_note
lexical_decisions:
- source_word: ተስፈዉ
  choice: Hofft!
  rationale: Der Pluralimperativ wird als unmittelbare, knappe Aufforderung wiedergegeben; so bleibt die feierliche Kraft des Ausdrucks erhalten.
- source_word: ቀዳሚ
  choice: früher
  rationale: Das Zeitadverb markiert den Gegensatz zwischen der vergangenen Erniedrigung und der nun verheißenen Wendung.
- source_word: ኃሠርክሙ
  choice: wurdet ihr … beschämt
  rationale: Die passive Wiedergabe bewahrt den Gedanken erlittener Schande und passt zur späteren öffentlichen Rechtfertigung.
- source_word: በእኩይ ወበምራኅ
  choice: durch Böses und durch Bedrängnis
  rationale: Die Präposition wird in beiden Gliedern wiederholt. „Böses“ lässt offen, ob Bosheit, böse Menschen oder schlimme Umstände gemeint sind; „Bedrängnis“ bezeichnet leidvolle Not ohne unnötige Präzisierung.
- source_word: ትበርሁ
  choice: werdet ihr leuchten
  rationale: Das Verb wird entsprechend seiner Wiederholung im Ausgangstext zweimal wiedergegeben und erhält dadurch die nachdrückliche apokalyptische Bildsprache.
- source_word: ብርሃነ ሰማይ
  choice: das Licht des Himmels
  rationale: Die Genitivverbindung wird konkret und quellennah wiedergegeben.
- source_word: ትትረአዩ
  choice: gesehen werden
  rationale: Die wahrscheinlich passive beziehungsweise reflexive Form wird ohne die stärkere Deutung „offenbart werden“ übersetzt.
- source_word: ኆኅተ ሰማይ
  choice: die Tore des Himmels
  rationale: ኆኅት bezeichnet Tür, Tor oder Portal. „Tore“ bewahrt die in 1 Henoch geläufige kosmologische Vorstellung und vermeidet die sachlich weniger passende Wiedergabe „Fenster“.
- source_word: ይትረኀዉ ለክሙ
  choice: werden für euch geöffnet werden
  rationale: Die passive Form bleibt erhalten; „für euch“ gibt den Bezug auf die Angeredeten wieder, ohne festzulegen, was durch die Öffnung geschieht.
theological_decisions:
- issue: Bedeutung der geöffneten Himmelstore
  choice: Das Bild bleibt als Verheißung geöffneter Himmelstore stehen.
  alternative: Die Öffnung könnte näher als Herabkommen himmlischen Segens oder als Zugang der Gerechten zum Himmel gedeutet werden.
  rationale: Der geʿezische Text sagt weder ausdrücklich, dass Segen herabströmt, noch dass die Angeredeten in den Himmel eintreten. Die Übersetzung bewahrt diese theologische Offenheit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit feierlichem apokalyptischem Ton. Die Wiederholung von „leuchten“ und die passive Satzführung wurden bewusst beibehalten; konfessionelle oder über den Wortlaut hinausgehende Deutungen wurden vermieden.
