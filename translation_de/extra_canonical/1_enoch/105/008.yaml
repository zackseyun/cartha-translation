base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/008.yaml
  text: And now[a], I show you that light and darkness, day and night[b], see all your sins.
translation:
  language: de
  text: Und nun zeige ich euch, dass[b] Licht und Finsternis, Tag und Nacht,[a] alle eure Sünden sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Licht und Finsternis, Tag und Nacht erscheinen hier als Zeugen, die alle Sünden sehen. Zugleich kann die Vorstellung anklingen, dass Sünden offen und verborgen, zu jeder Zeit begangen werden.
    reason: cultural_note
  - marker: b
    text: 'Die Konjunktion kann auch begründend verstanden werden: „Und nun zeige ich euch: Denn Licht und Finsternis, Tag und Nacht sehen alle eure Sünden.“'
    reason: textual_syntax
lexical_decisions:
- source_word: ወይ እዜኒ
  choice: Und nun
  rationale: Bewahrt den zeitlichen und diskursiven Übergang in natürlichem modernem Deutsch.
- source_word: አነ አርእየክሙ
  choice: zeige ich euch
  rationale: Gibt die kausative Seh-Bedeutung konkret wieder und bewahrt die visionäre Bildsprache.
- source_word: እስመ
  choice: dass
  rationale: Nach dem Verb des Zeigens ist die Konjunktion am ehesten als Ergänzungssatz einleitender Komplementierer zu verstehen.
- source_word: ብርሃን፡ ወጽልመት
  choice: Licht und Finsternis
  rationale: Direkte antithetische Wiedergabe des ersten Merismus; „Finsternis“ wahrt den würdevollen apokalyptischen Ton.
- source_word: ዕለት፡ ወሌሊት
  choice: Tag und Nacht
  rationale: Bewahrt den zweiten Merismus, der Ganzheit und unablässiges Zeugnis ausdrückt.
- source_word: ይሬእዩ
  choice: sehen
  rationale: Der einfache Präsens entspricht der allgemeinen Aussage und lässt die kosmischen Größen als handelnde Zeugen stehen.
- source_word: ኵሎ፡ ኃጢአትክሙ
  choice: alle eure Sünden
  rationale: Bewahrt sowohl die umfassende Aussage als auch den konkreten Plural der Verfehlungen.
theological_decisions:
- issue: Sind Licht und Finsternis sowie Tag und Nacht nur Zeitangaben oder handelnde Zeugen menschlicher Verfehlungen?
  choice: Die kosmischen Größen werden als Subjekt des Sehens wiedergegeben.
  alternative: Die Wendung könnte lediglich offen und verborgen beziehungsweise zu jeder Zeit begangene Sünden bezeichnen.
  rationale: Grammatisch sind die gepaarten Substantive das naheliegende Subjekt von „sehen“. Die apokalyptische Vorstellung der Schöpfung als Zeugin wird daher nicht zu einer bloßen Zeitangabe verflacht.
- issue: Funktion von እስመ nach „ich zeige euch“
  choice: Komplementierer „dass“
  alternative: Begründende Konjunktion „denn/weil“
  rationale: Nach einem Verb des Zeigens oder Erkennens führt እስመ hier am natürlichsten den Inhalt dessen ein, was gezeigt wird; die kausale Lesart bleibt jedoch sprachlich möglich und wird in der Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Klang. Die Personifikation der kosmischen Größen und die genuine syntaktische Mehrdeutigkeit werden bewahrt.
