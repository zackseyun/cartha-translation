  source_fidelity: Die Übersetzung gibt die altäthiopische Genitivkonstruktion ስብሐቲሁ ለዐቢይ zutreffend als „die Herrlichkeit des Großen“ wieder und bewahrt die Wiederholung dieser Wortgruppe. Das pluralische „eure Namen“, das Zukunftspassiv und በቅድመ als „vor“ entsprechen dem vorliegenden Text. Die nominale, spannungsvoll-unvollständige Eröffnung wird nicht unberechtigt zu einem prädikativen Satz umgedeutet.
  naturalness: „Die Herrlichkeit des Großen – und eure Namen werden vor der Herrlichkeit des Großen geschrieben werden“ ist bewusst feierlich und elliptisch. Der Gedankenstrich macht die im Ausgangstext angelegte nominale Eröffnung im modernen Standarddeutsch lesbar, ohne den Sinn zu ergänzen. Das doppelte Futurpassiv ist etwas förmlich, aber grammatisch korrekt und dem Register angemessen.
  terminology: „Herrlichkeit“ ist für ስብሐቲሁ im apokalyptisch-göttlichen Kontext treffend; „der Große“ wahrt den substantivischen Ehrentitel ohne konfessionelle Zuspitzung. Die Fußnoten behandeln die Wiederholung und die weniger wahrscheinliche prädikative Analyse transparent. Beide Marker sind korrekt verankert.
