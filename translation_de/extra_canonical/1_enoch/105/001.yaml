base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/001.yaml
  text: The glory of the Great One[b][a], and your names shall be written before the glory of the Great One.
translation:
  language: de
  text: Die Herrlichkeit des Großen[a][b] – und eure Namen werden vor der Herrlichkeit des Großen geschrieben werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Altäthiopische wiederholt „die Herrlichkeit des Großen … vor der Herrlichkeit des Großen“. Die Wiederholung wurde beibehalten, weil sie offenbar beabsichtigt ist und der Verheißung feierlichen Nachdruck verleiht.
    reason: lexical_alternative
  - marker: b
    text: 'Weniger wahrscheinlich: „Seine Herrlichkeit ist groß, und eure Namen werden vor der Herrlichkeit des Großen geschrieben werden.“ Die altäthiopische Konstruktion spricht jedoch eher für ein Genitivverhältnis: „die Herrlichkeit des Großen“.'
    reason: previous_rendering
lexical_decisions:
- source_word: ስብሐቲሁ
  choice: die Herrlichkeit
  rationale: Das Substantiv kann Herrlichkeit, Lob oder Glanz bezeichnen. Da die Namen vor dieser Wirklichkeit geschrieben werden, gibt „Herrlichkeit“ die apokalyptische Vorstellung göttlicher Gegenwart und Majestät am besten wieder.
- source_word: ለዐቢይ
  choice: des Großen
  rationale: 'Die Verbindung ist als Genitivkonstruktion zu verstehen: „seine Herrlichkeit, nämlich die des Großen“. „Der Große“ bewahrt den substantivisch gebrauchten, ehrfürchtigen Gottestitel.'
- source_word: ወእስማቲከሙ
  choice: und eure Namen
  rationale: Sowohl „Namen“ als auch das Suffix der zweiten Person stehen im Plural; die Anrede gilt einer Gruppe.
- source_word: ይጸሐፍ
  choice: werden … geschrieben werden
  rationale: Das Verb bedeutet „schreiben“. Das deutsche Futur Passiv gibt den verheißenden Zukunftsbezug wieder, ohne einen im Satz nicht ausdrücklich genannten Handelnden einzuführen.
- source_word: በቅድመ
  choice: vor
  rationale: Die Präposition bezeichnet ein Sein vor jemandem oder in dessen Gegenwart. „Vor“ ist knapp, feierlich und lässt die räumliche wie gegenwartsbezogene Bildlichkeit bestehen.
theological_decisions:
- issue: Bedeutung von ስብሐቲሁ im apokalyptischen Zusammenhang
  choice: Herrlichkeit
  alternative: Lob; Glanz
  rationale: „Herrlichkeit“ wahrt die Vorstellung der göttlichen Majestät, vor der die Namen verzeichnet werden, ohne sie auf einen Akt des Lobens zu verengen.
- issue: Deutung der einleitenden Wortgruppe ስብሐቲሁ ለዐቢይ
  choice: die Herrlichkeit des Großen
  alternative: Seine Herrlichkeit ist groß
  rationale: Die vorangestellte pronominale Form mit ለ bildet eine im Altäthiopischen übliche Genitivkonstruktion. Die prädikative Deutung bleibt als frühere beziehungsweise weniger wahrscheinliche Auffassung in einer Fußnote sichtbar.
translation_notes:
  register: Moderne, feierliche Standardsprache. Der Gedankenstrich macht die ungewöhnliche nominale Eröffnung lesbar, ohne sie zu einem vollständigen Satz auszubauen oder ihre Spannung aufzulösen. Der Gottestitel „der Große“ bleibt bewusst substantivisch erhalten.
