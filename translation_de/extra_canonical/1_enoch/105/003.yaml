base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/105/003.yaml
  text: And as for your cry[a], cry out, and he will make it appear to you[e][d][c][b]; for all your affliction will be sought out from the angels and from all those who helped those who plundered you.
translation:
  language: de
  text: 'Und was euren Ruf betrifft: Ruft laut, und er wird es euch zeigen[a]; denn eure ganze Bedrängnis wird bei den Engeln[b] und bei allen, die denen halfen, die euch ausplünderten, untersucht werden.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „und er wird es euch offenbaren“. Der ge’ezische Ausdruck ist schwierig; weder das Subjekt noch das Gemeinte wird hier ausdrücklich genannt.'
    reason: lexical_alternative
  - marker: b
    text: Das ge’ezische Wort bedeutet gewöhnlich „Engel“, kann aber auch „Boten“ und in bestimmten Zusammenhängen „Machthaber“ bezeichnen.
    reason: alternative_reading
  - marker: c
    text: Die Konstruktion ist mehrdeutig. Sie kann auch bedeuten, dass die Bedrängnis von den Engeln und von den Helfern der Plünderer ermittelt oder von ihnen zurückgefordert wird.
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: ወጽራኅ … ጽርኁ
  choice: 'Und was euren Hilferuf betrifft: Ruft laut'
  rationale: Die Wiederholung des Stammes für lautes Rufen wird im Deutschen durch „Hilferuf“ und „ruft laut“ hörbar gehalten. Eine Ergänzung wie „um Recht“ wäre sachlich naheliegend, steht aber nicht ausdrücklich im Text.
- source_word: ወያስተርኢ ለክሙ
  choice: und er wird es euch sichtbar machen
  rationale: Die Kausativform bezeichnet ein Sehenlassen, Zeigen oder Offenbaren. „Sichtbar machen“ wahrt dieses Bild und lässt das nicht ausdrücklich genannte Objekt offen.
- source_word: ኵሉ ምንዳቤክሙ
  choice: eure ganze Bedrängnis
  rationale: Der Ausdruck umfasst Leiden, Not und Bedrückung, ohne ausschließlich körperliche Verfolgung oder innere Sorge zu bezeichnen.
- source_word: መላእክት
  choice: Engel
  rationale: „Engel“ ist die gewöhnliche Bedeutung und entspricht dem apokalyptischen Sprachraum von 1 Henoch; die ebenfalls mögliche allgemeinere Bedeutung „Boten“ wird in einer Fußnote genannt.
- source_word: ይትኃሠሥ
  choice: wird … untersucht werden
  rationale: Die Form bezeichnet ein Suchen, Nachforschen oder Untersuchen. „Untersucht“ gibt den möglichen gerichtlichen Unterton in natürlichem Deutsch wieder.
- source_word: እለ አርደእዎሙ
  choice: die denen halfen
  rationale: Das Verb gehört zum Bedeutungsfeld „helfen, beistehen“ und bezeichnet hier die Unterstützer der Plünderer, nicht die Bedrücker selbst.
- source_word: ለእለ የሀይዱክሙ
  choice: die euch ausplünderten
  rationale: Das Verb bedeutet rauben, plündern oder entreißen. „Ausplündern“ passt zum transitiven Bezug auf die Angeredeten und vermeidet die sachlich falsche Wiedergabe „irreführen“.
theological_decisions:
- issue: Ob መላእክት himmlische Engel oder menschliche Boten beziehungsweise Machthaber bezeichnet
  choice: Engel
  alternative: Boten; möglicherweise Machthaber
  rationale: Die Grundbedeutung und der apokalyptische Kontext sprechen für himmlische Engel. Da der unmittelbare Zusammenhang auch irdische Helfer von Plünderern nennt, wird die allgemeinere lexikalische Möglichkeit nicht verschwiegen.
- issue: Wie die Untersuchung der Bedrängnis und die mit እም eingeleiteten Gruppen zueinander stehen
  choice: Die Engel und die Helfer der Plünderer erscheinen grammatisch als diejenigen, von denen her beziehungsweise durch die die Untersuchung erfolgt.
  alternative: Die Bedrängnis wird bei ihnen ermittelt oder von ihnen zurückgefordert; damit könnten sie als zur Rechenschaft Gezogene gemeint sein.
  rationale: Die Präposition und das Passiv ergeben eine schwierige Konstruktion. Der Haupttext bleibt nahe an der Formulierung der Quelle; die Fußnote weist auf die mögliche gerichtliche Deutung hin, ohne Engel und menschliche Täter vorschnell gleichzusetzen.
- issue: Nicht genanntes Subjekt von „er wird es sichtbar machen“
  choice: Das maskuline Singularpronomen „er“ wird ohne ausdrückliche Identifizierung beibehalten.
  alternative: Gott beziehungsweise der Herr wird es sichtbar machen.
  rationale: Der Vers nennt das Subjekt in der überlieferten Form nicht ausdrücklich. Eine Identifizierung mit Gott mag im Kontext möglich sein, soll aber nicht in den Wortlaut hineingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der eindringliche Imperativ und der gerichtliche Ton bleiben erhalten. Schwierige Bezüge werden nicht durch konfessionelle oder spekulative Ergänzungen geglättet; insbesondere wird das unausgedrückte Subjekt nicht ausdrücklich mit Gott identifiziert.
