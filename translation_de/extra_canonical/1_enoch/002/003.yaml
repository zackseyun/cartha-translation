base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/002/003.yaml
  text: Look at the summer and the winter[a], how the whole earth is filled with water[b], and clouds and dew and rain rest upon it.
translation:
  language: de
  text: Betrachtet den Sommer und den Winter[a] und seht, wie die ganze Erde mit Wasser erfüllt ist und Wolken, Tau[b] und Regen auf ihr ruhen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Begriffspaar „Sommer und Winter“ gibt den Wortlaut des Ge’ez unmittelbar wieder. Im äthiopischen Umfeld kann „Winter“ eher die Regenzeit als eine kalte Jahreszeit im heutigen mitteleuropäischen Sinn bezeichnen.
    reason: cultural_note
  - marker: b
    text: Das hier mit „Tau“ wiedergegebene Wort ist für sich genommen nicht eindeutig. In dieser Aufzählung von Wettererscheinungen bezeichnet es jedoch wahrscheinlich Feuchtigkeit wie Tau; auch „Nebel“ wäre möglich.
    reason: lexical_alternative
lexical_decisions:
- source_word: ርእይዎ
  choice: Betrachtet
  rationale: Der Imperativ fordert gemeinschaftlich dazu auf, die Schöpfung aufmerksam wahrzunehmen; „Betrachtet“ ist würdevoll und bewahrt den beobachtenden Charakter.
- source_word: ለሐጋይ ወለክረምት
  choice: den Sommer und den Winter
  rationale: Die direkte Wiedergabe erhält das jahreszeitliche Begriffspaar des Ge’ez; die klimatische Bedeutung von „Winter“ wird in einer Fußnote erläutert.
- source_word: ከመ
  choice: wie
  rationale: Leitet den Inhalt dessen ein, was betrachtet werden soll, und erhält den anschaulich-beobachtenden Ton.
- source_word: ኵሉ ምድር
  choice: die ganze Erde
  rationale: Im Kontext der Schöpfungsbetrachtung liegt der umfassende Sinn „Erde“ näher als das enger mögliche „Land“.
- source_word: መልአት ማየ
  choice: mit Wasser erfüllt ist
  rationale: Gibt den Zustand der Fülle und das konkrete Bild des Wassers in idiomatischem Deutsch wieder.
- source_word: ወደመና
  choice: und Wolken
  rationale: Bewahrt das erste Glied der Aufzählung von Feuchtigkeits- und Wettererscheinungen.
- source_word: ወጠለ
  choice: Tau
  rationale: Im Zusammenhang mit Wasser, Wolken und Regen ist „Tau“ die wahrscheinlichste meteorologische Bedeutung; die lexikalische Unsicherheit wird vermerkt.
- source_word: ወዝናም
  choice: und Regen
  rationale: Direkte und konkrete Wiedergabe des Wetterbegriffs.
- source_word: ያዓርፍ ላዕሌሃ
  choice: auf ihr ruhen
  rationale: Erhält das Bild, dass die genannten Erscheinungen sich auf der Erde niederlassen beziehungsweise auf ihr ruhen, ohne es erklärend aufzulösen.
