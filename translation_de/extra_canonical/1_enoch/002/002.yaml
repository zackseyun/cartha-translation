base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/002/002.yaml
  text: Look at the earth and understand concerning the works that are done upon it from the beginning to their completion[a], that none of the works of God changes[d][c][b], as they appear.
translation:
  language: de
  text: 'Betrachtet die Erde und erkennt die Werke, die auf ihr getan werden, vom Anfang bis zu ihrer Vollendung[a]: Keines von Gottes Werken verändert sich, wie sie sichtbar werden[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht „Werk“ in der Einzahl; das Wort kann hier die auf der Erde geschehenden Werke insgesamt bezeichnen. Daher ist auch möglich: „das Werk, das auf ihr getan wird, vom Anfang bis zu seiner Vollendung“.'
    reason: grammar_and_lexical_alternative
  - marker: b
    text: 'Oder kollektiv: „Alle Werke Gottes verändern sich nicht, wie sie sichtbar werden.“ Die ge’ezische Formulierung kann als Gesamtaussage oder auf jedes einzelne Werk bezogen verstanden werden. Die Schlussform kann auch mit „wie sie erscheinen“ oder „indem sie sichtbar werden“ wiedergegeben werden; sie bedeutet eher „erscheinen/sichtbar werden“ als aktiv „zeigen“.'
    reason: lexical_and_alternative_reading
lexical_decisions:
- source_word: ርእይዋ፡ ለምድር
  choice: Betrachtet die Erde
  rationale: Der Imperativ fordert zu bewusster Beobachtung auf. „Betrachtet“ ist gegenwärtiges, würdiges Deutsch und gibt den angehängten Bezug auf die Erde ausdrücklich wieder.
- source_word: ወለብዉ
  choice: und erkennt
  rationale: Das Verb bezeichnet aufmerksames Erfassen beziehungsweise Verstehen. „Erkennt“ führt natürlich vom Sehen zum Begreifen.
- source_word: በእንተ፡ ምግባር፡ ዘይትገበር፡ ላዕሌሃ
  choice: wie es sich mit den Werken verhält, die auf ihr getan werden
  rationale: ምግባር kann Werk, Tat oder Geschehen bezeichnen. Die Formulierung bewahrt den Werkbegriff und gibt den passiven beziehungsweise unpersönlichen Relativsatz wieder.
- source_word: እምቀዳሚ፡ እስከ፡ ተፍጻሜቱ
  choice: vom Anfang bis zu ihrer Vollendung
  rationale: „Vollendung“ gibt den Gedanken des Zu-Ende-Gelangens genauer wieder als bloßes Aufhören. Das deutsche Pluralpronomen stimmt mit „Werken“ überein, während eine Fußnote die grammatische Singularform erläutert.
- source_word: ከመ፡ ኢይትመየጥ፡ ኵሉ፡ ምግባረ፡ ለአምላክ
  choice: Keines von Gottes Werken verändert sich
  rationale: Die Formulierung gibt die distributive Aussage idiomatisch wieder, ohne sie zu einer abstrakten Lehre über jede denkbare göttliche Handlung auszuweiten. Die mögliche kollektive Auffassung wird in der Fußnote bewahrt.
- source_word: እንዘ፡ ያስተርኢ
  choice: so wie es sichtbar wird
  rationale: Die Ast-Stammform ist intransitiv beziehungsweise passiv und bedeutet „erscheinen“ oder „sichtbar werden“, nicht aktiv „zeigen“. Das Singularpronomen lässt den Rückbezug auf das kollektiv oder distributiv verstandene Werk offen.
theological_decisions:
- issue: Unveränderlichkeit sämtlicher göttlicher Handlungen oder beobachtbare Beständigkeit der Schöpfungswerke
  choice: Die Aussage wird auf die bei der Betrachtung der Erde erkennbaren Werke Gottes bezogen.
  alternative: Eine umfassende metaphysische Aussage, nach der Gott niemals irgendein Werk verändert.
  rationale: Der unmittelbare Zusammenhang fordert zur Beobachtung der Erde und ihrer Vorgänge auf. Die Übersetzung bewahrt die starke Aussage über Gottes Werke, ohne ihr eine spätere systematisch-theologische Präzisierung aufzuzwingen.
- issue: Aktives göttliches Zeigen oder intransitives Sichtbarwerden
  choice: so wie es sichtbar wird
  alternative: während er es zeigt / wie er sie zeigt
  rationale: Die bezeugte Ast-Stammform spricht für „erscheinen“ beziehungsweise „sichtbar werden“. Die aktive Alternative beruht auf einer anderen Stammauffassung und wird daher nicht in den Haupttext aufgenommen, aber textkritisch erläutert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit pluralischer Anrede. „Betrachtet“ und „erkennt“ erhalten den auffordernden und nachdenklichen Charakter; unnötig altertümliche Formen werden vermieden. Die leichte Spannung im Schluss bleibt bestehen, statt durch eine eindeutige Ergänzung des Bezugsworts aufgelöst zu werden.
