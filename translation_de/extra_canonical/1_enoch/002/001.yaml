base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/002/001.yaml
  text: 'Consider all the works in heaven: how they do not alter their paths[a], and the lights in heaven, how all of them rise and set in order, each in its season[c][b], and do not transgress their appointed order.'
translation:
  language: de
  text: 'Betrachtet alle Werke am Himmel und die Lichter am Himmel: Sie ändern ihre Bahnen nicht[a]; sie alle gehen geordnet auf und unter, jedes zu seiner Zeit, und weichen nicht von der ihnen bestimmten Ordnung ab[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihre Wege nicht verändern“. Gemeint sind die festgelegten Bahnen der Himmelskörper.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „und ihre festgesetzte Ordnung nicht übertreten“. Die Formulierung kann sowohl das Abweichen von einer Ordnung als auch deren Übertretung ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ጠይቁ
  choice: Betrachtet
  rationale: Der Pluralimperativ fordert zur aufmerksamen Betrachtung der sichtbaren Schöpfung auf; „Betrachtet“ klingt im Deutschen natürlich und bewahrt den nachdenklichen Ton.
- source_word: ግብረ
  choice: Werke
  rationale: Im Zusammenhang bezeichnet das Wort die Werke beziehungsweise Vorgänge am Himmel. „Werke“ erhält die Schöpfungssprache, ohne den Ausdruck unnötig einzuengen.
- source_word: ኢይመይጡ ፍናዊሆሙ
  choice: sie ihre Bahnen nicht ändern
  rationale: Die Wendung beschreibt die Beständigkeit der himmlischen Bewegungsbahnen. „Bahnen“ ist im Deutschen für Himmelskörper natürlich und bewahrt das konkrete Bild.
- source_word: ብርሃናት
  choice: die Lichter
  rationale: Gemeint sind die Himmelslichter, wahrscheinlich Sonne, Mond und Sterne. „Lichter“ ist verständlich und bleibt näher am Bild als das fachsprachlichere „Gestirne“.
- source_word: ይሠርቅ ወየዐርብ
  choice: auf- und untergehen
  rationale: Das Verbpaar bezeichnet die regelmäßig wiederkehrende Bewegung der Himmelslichter und wird idiomatisch mit „auf- und untergehen“ wiedergegeben.
- source_word: ሥሩዕ
  choice: geordnet
  rationale: Das Wort betont geregelte, festgefügte Abläufe. Das Adverb „geordnet“ fügt sich natürlich in den deutschen Satz ein.
- source_word: በበዘመኑ
  choice: jedes zu seiner Zeit
  rationale: Die distributive Form besagt, dass jedes Himmelslicht zu der ihm zukommenden Zeit handelt. „Zeit“ bewahrt die Bedeutung, ohne zwingend eine Jahreszeit anzunehmen.
- source_word: ኢይትኀደዉ እምሥርዓቶሙ
  choice: nicht von der ihnen bestimmten Ordnung abweichen
  rationale: Die Konstruktion mit እም („von, aus“) lässt sich unmittelbar und idiomatisch als Abweichen von einer festgelegten Ordnung wiedergeben; die kräftigere Bedeutung „übertreten“ bleibt in der Fußnote erhalten.
theological_decisions:
- issue: Neutrale Beschreibung kosmischer Regelmäßigkeit oder rechtlich-moralisch gefärbte Sprache
  choice: nicht von der ihnen bestimmten Ordnung abweichen
  alternative: ihre festgesetzte Ordnung nicht übertreten
  rationale: „Abweichen von“ entspricht der Präposition des ge'ezischen Textes und wahrt die Vorstellung einer gesetzten kosmischen Ordnung. Die Alternative erhält den stärkeren rechtlich-moralischen Beiklang und wird deshalb als echte Übersetzungsmöglichkeit dokumentiert, ohne den Haupttext konfessionell oder dogmatisch zuzuspitzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bewahrt die wiederholte Beobachtungsform des Ausgangstextes, wird jedoch so gegliedert, dass er auch mündlich gut verständlich bleibt. Die Himmelslichter werden nicht ausdrücklich als Sonne, Mond und Sterne identifiziert, da der Ausgangstext diese Deutung offenlässt.
