base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/003.yaml
  text: And in every month its going out and its returning vary[a], and its days are like the days of the sun; and when its light is full[c][b], it is a seventh part of the light of the sun.
translation:
  language: de
  text: Und in jedem Monat verändern sich sein Hervorgehen und seine Rückkehr[a], und seine Tage sind wie die Tage der Sonne; und wenn sein Licht voll ist, beträgt es ein Siebtel des Lichtes der Sonne.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Vers verwendet für die Bahn des Himmelskörpers Ausdrücke, die wörtlich ein Hervorgehen und eine Rückkehr beziehungsweise einen Eintritt bezeichnen. Im astronomischen Zusammenhang könnten damit Aufgang und Untergang gemeint sein; der ge’ezische Wortlaut legt diese genauere Deutung jedoch nicht eindeutig fest.
    reason: lexical_alternative
lexical_decisions:
- source_word: ሙፃኢሁ
  choice: sein Hervorgehen
  rationale: Das Substantiv bezeichnet ein Herausgehen oder Hervortreten. „Hervorgehen“ bewahrt die räumliche und astronomische Bildsprache, ohne sie vorschnell auf „Aufgang“ festzulegen.
- source_word: ምብዋኢሁ
  choice: seine Rückkehr
  rationale: Der Ausdruck steht parallel zu „Hervorgehen“ und kann Eintritt oder Rückkehr bezeichnen. „Rückkehr“ erhält diese formale Paarung; „Untergang“ wäre stärker deutend.
- source_word: ይትዌለጥ
  choice: verändern sich
  rationale: Das Verb bezeichnet Veränderung oder Verschiedenheit. Die deutsche Formulierung gibt den monatlichen Wechsel klar und natürlich wieder.
- source_word: መዋዕሊሁ
  choice: seine Tage
  rationale: Die einfache Wiedergabe wahrt die Form des Ausgangstextes, ohne ausdrücklich eine Zyklusdauer oder festgesetzte Tage hineinzulesen.
- source_word: ከመ መዋዕለ ፀሐይ
  choice: wie die Tage der Sonne
  rationale: ከመ ist hier am unmittelbarsten als Vergleichspartikel „wie“ wiederzugeben; dadurch bleibt offen, worin genau die Entsprechung besteht.
- source_word: ይፄሪ
  choice: wenn sein Licht voll ist
  rationale: Das Verb bezeichnet hier Klarheit, Helligkeit beziehungsweise die volle Leuchtkraft des Mondes. Diese Wiedergabe folgt dem astronomischen Zusammenhang und vermeidet die sachlich entgegengesetzte Deutung „dunkel werden“.
- source_word: ከዊነ ብርሃኑ ይከውን
  choice: beträgt es
  rationale: Die Seinsformen leiten einen resultierenden beziehungsweise quantifizierten Zustand ein. „Beträgt“ ist im Deutschen bei dem folgenden Bruchteil natürlich.
- source_word: ሳብዓደ እደ
  choice: ein Siebtel
  rationale: Die Wendung bezeichnet einen siebten Teil; „ein Siebtel“ ist präzise und idiomatisch.
- source_word: እምብርሃነ ፀሐይ
  choice: des Lichtes der Sonne
  rationale: Die Präposition kann Quelle oder Vergleich markieren. In Verbindung mit „ein Siebtel“ ergibt sich im Deutschen natürlich die partitive Fügung „des Lichtes der Sonne“.
