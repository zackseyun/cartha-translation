translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die ge’ezische Satzstruktur. Das Pronomen bezieht sich aus dem Kontext des Abschnitts auf den Mond, doch die implizite Referenz des Verses wurde nicht durch eine ausdrückliche Nennung ersetzt. Die sachlich gebotene Lesart der vollen beziehungsweise klaren Leuchtkraft wurde gegenüber der älteren gegenteiligen Deutung bevorzugt.
