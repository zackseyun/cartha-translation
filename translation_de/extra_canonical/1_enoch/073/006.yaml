base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/006.yaml
  text: And on the day it takes up a seventh part of half of its light[c][b][a], and its light becomes one and a half seventh parts.
translation:
  language: de
  text: Und an dem Tag nimmt er ein Siebtel von der Hälfte seines Lichts auf[a], und sein Licht wird zu anderthalb Siebteln.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die zugrunde liegende Wendung verwendet wörtlich das Wort „Hand“ als Bezeichnung für einen abgemessenen Anteil; hier ist ein Siebtel gemeint.
    reason: lexical_alternative
  - marker: b
    text: Die äthiopische Zahlenfolge ist knapp und lässt sich wörtlich nur schwer eindeutig wiedergeben. Sie wird hier als „anderthalb Siebtel“ verstanden; formal wäre auch eine Wiedergabe wie „ein Siebtel und eine Hälfte“ möglich.
    reason: textual_variant
lexical_decisions:
- source_word: በዕለተ
  choice: an dem Tag
  rationale: Die Präpositionalfügung bezeichnet einen konkreten Zeitpunkt innerhalb der kalendarisch-astronomischen Darstellung.
- source_word: ትነሥእ
  choice: nimmt … auf
  rationale: Das Verb kann ein Nehmen, Empfangen oder Aufnehmen bezeichnen. „nimmt … auf“ passt zum Anwachsen des Mondlichts, ohne ein zusätzliches Verb wie „geht auf“ einzuführen.
- source_word: ሳብዐተ እደ
  choice: ein Siebtel
  rationale: Die wörtlich mit „Hand“ gebildete Maßangabe bezeichnet hier im astronomischen Rechensystem einen siebten Anteil, nicht sieben ganze Teile.
- source_word: መንፈቀ ብርሃኑ
  choice: von der Hälfte seines Lichts
  rationale: Die Genitivbeziehung wird transparent wiedergegeben; das maskuline Possessiv entspricht der Suffixform und dem deutschen Genus von „Mond“.
- source_word: ይከውን
  choice: beträgt
  rationale: Das Verb bezeichnet das Eintreten beziehungsweise Bestehen eines resultierenden Werts. Im Deutschen gibt „beträgt“ die numerische Aussage natürlich wieder.
- source_word: ሳብዐተ እደ አሐተ ወመንፈቃ
  choice: anderthalb Siebtel
  rationale: Die gedrängte Zahlenfolge wird als eineinhalb Einheiten von je einem Siebtel verstanden; dies erhält die astronomisch sinnvolle Größenangabe.
theological_decisions:
- issue: Personifizierung und Genus des Himmelskörpers
  choice: Maskulines Pronomen „er/seines“
  alternative: Femininum „sie/ihres“ oder neutrales „es/seines“
  rationale: Das Suffix an „Licht“ ist maskulin; zugleich ist „Mond“ im Deutschen maskulin. So bleibt der Bezug natürlich, ohne eine zusätzliche weibliche Personifizierung einzutragen.
- issue: Deutung der Zahlenangabe
  choice: „anderthalb Siebtel“ als Gesamtwert
  alternative: „ein Siebtel und eine Hälfte“ oder wörtlich „sieben Hände, eine und eine Hälfte“
  rationale: Die alternative Wiedergabe wäre mathematisch mehrdeutig und würde den gestuften Zuwachs des Mondlichts verdunkeln. Wegen der gedrängten Quellform wird die Unsicherheit in einer Fußnote offengelegt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die astronomische Maßsprache bleibt erkennbar, wird aber ohne irreführenden wörtlichen Semitismus („Hand“) lesbar formuliert. Das maskuline Pronomen setzt den im Kontext vorausgesetzten Mond als Bezugswort voraus.
