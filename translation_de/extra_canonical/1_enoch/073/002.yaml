base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/002.yaml
  text: And its circuit is like the circuit of heaven[a], and its chariots, by which it goes out, are driven by the wind[c][b]; and light is given to it by measure.
translation:
  language: de
  text: Ihr Kreis ist wie der Kreis des Himmels, und ihre Streitwagen, mit denen sie hinauszieht, werden vom Wind angetrieben[a]; und Licht wird ihr nach Maß gegeben[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die ge'ezische Wendung ist schwierig. Sie kann auch so verstanden werden, dass die Streitwagen dorthin ziehen, wohin der Wind weht, oder dass sie von den Winden getragen werden.
    reason: textual_variant
  - marker: b
    text: 'Auch möglich: „gemäß einem festgelegten Maß“. Gemeint ist eine geordnete, bemessene Zuteilung des Lichts.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ክበቡ
  choice: ihr Kreis
  rationale: Das Substantiv bezeichnet einen Kreis, Umfang oder kreisförmigen Lauf. „Kreis“ bewahrt die räumliche und die bewegungsbezogene Bedeutung, ohne die moderne astronomische Vorstellung einer Umlaufbahn einzutragen. Das feminine Pronomen bezieht sich im deutschen Kontext auf den Mond.
- source_word: ከመ ክበበ ሰማይ
  choice: wie der Kreis des Himmels
  rationale: Die ausdrückliche Vergleichsform bleibt erhalten. „Himmel“ entspricht dem kosmischen Register des Abschnitts besser als eine rein atmosphärische Wiedergabe.
- source_word: ሰረገላተ ዚአሁ
  choice: ihre Wagen
  rationale: Der Plural bezeichnet Wagen beziehungsweise Streitwagen. „Wagen“ erhält das visionär-kosmische Bild in natürlichem Deutsch, ohne es durch moderne Begriffe zu ersetzen.
- source_word: በኀበ ይጼዓን ነፋስ ትነፍስ
  choice: mit denen sie hinauszieht, werden vom Wind angetrieben
  rationale: Die schwierige Wendung enthält sowohl das Hinausziehen als auch die Windbewegung. Die Übersetzung gibt beide Elemente wieder, kennzeichnet die syntaktische Unsicherheit jedoch in einer Fußnote.
- source_word: በመስፈርት
  choice: nach Maß
  rationale: Die Wendung bezeichnet Maß, Regel oder festgelegte Proportion. „Nach Maß“ ist knapp und lässt den Gedanken einer geordneten Zuteilung bestehen.
- source_word: ይትወሀብ ሎቱ ብርሃን
  choice: Licht wird ihr gegeben
  rationale: Die passive Form bleibt gewahrt und stellt das Licht als zugeteilt dar, ohne über dessen Ursprung hinausgehende Aussagen einzuführen.
theological_decisions:
- issue: Darstellung der Bewegung des Himmelskörpers
  choice: Die kosmische Bildsprache mit „Kreis“ und „Wagen“ bleibt erhalten.
  alternative: „Umlaufbahn“ und „Transportmittel“ oder eine allgemeinere Beschreibung seiner Bewegung.
  rationale: Der Text spricht in visionär-kosmischen Bildern. Eine Modernisierung in mechanistische oder heutige astronomische Fachsprache würde mehr festlegen, als der ge'ezische Wortlaut sagt.
- issue: Zuteilung des Lichts
  choice: Die Passivform „Licht wird ihr … gegeben“ bleibt erhalten.
  alternative: „Sie empfängt Licht“ oder „sie leuchtet nach festem Maß“.
  rationale: Die Passivform bildet den Quelltext eng ab und vermeidet sowohl eine Aussage über selbst erzeugtes Licht als auch eine nähere Bestimmung des Gebers.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter apokalyptisch-kosmischer Bildsprache. Die Satzstruktur folgt dem Quelltext, bleibt aber flüssig; echte syntaktische und lexikalische Mehrdeutigkeiten werden in den Fußnoten offengelegt.
