base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/005.yaml
  text: And its distant half is one seventh part[a], and all its disk is empty, without light[c][b], except for a seventh part of it—a fourteenth part of its light.
translation:
  language: de
  text: Und ihre ferne Hälfte beträgt ein Siebtel[a], und ihre ganze Scheibe ist leer, ohne Licht[b], außer einem Siebtel von ihr – einem Vierzehntel ihres Lichts.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Zahlenformulierung ist im äthiopischen Text schwierig. Das hier als Bruchteil verstandene Wort bedeutet wörtlich „Hand“, bezeichnet in diesem Zusammenhang jedoch einen Anteil im gemessenen Zyklus des Himmelskörpers.
    reason: lexical_alternative
  - marker: b
    text: Der Vers beschreibt beleuchtete und dunkle Anteile der Mondscheibe im schematischen Stil des Astronomischen Buches, nicht in den Begriffen moderner Naturwissenschaft.
    reason: cultural_note
  - marker: c
    text: Die Ausdrücke sind im Geʿez als Bruchangaben formuliert. Die Verbindung von „Siebtel“ und „Vierzehntel“ folgt dem schematischen, vierzehnteiligen Rechensystem des Abschnitts und wird nicht in moderne astronomische Begriffe übertragen.
    reason: textual_ambiguity
lexical_decisions:
- source_word: መንፈቀ ርኁቅ
  choice: ihre ferne Hälfte
  rationale: መንፈቀ bezeichnet eine Hälfte oder einen abgeteilten Anteil; ርኁቅ bedeutet „fern“ oder „entfernt“. Die Wiedergabe bewahrt die räumliche Ausdrucksweise, ohne sie als moderne astronomische Fachangabe zu deuten.
- source_word: ሳብዐተ እደ አሐደ
  choice: ein Siebtel
  rationale: እድ bedeutet wörtlich „Hand“, dient hier aber in Verbindung mit der Ordnungszahl als Bruch- bzw. Anteilsbezeichnung. Im Rechenschema des Kapitels ist „ein Siebtel“ dem missverständlichen „sieben Teile“ vorzuziehen.
- source_word: ኵሉ ክበበ ዚአሁ
  choice: ihre ganze Scheibe
  rationale: ክበብ bezeichnet einen Kreis oder eine runde Gestalt. Im Zusammenhang mit dem sichtbaren Himmelskörper ist „Scheibe“ natürlich und anschaulich.
- source_word: ባክ ዘአልቦ ብርሃነ
  choice: ist leer, ohne Licht
  rationale: Die beiden Ausdrücke betonen Mangel und Abwesenheit von Licht. Die zweigliedrige Wiedergabe erhält diese auffällige Häufung, statt sie zu glätten.
- source_word: ዘእንበለ
  choice: außer
  rationale: Die Partikel führt eine Ausnahme ein; „außer“ ist im Deutschen knapp und eindeutig.
- source_word: ሳብዐተ እዴሁ
  choice: einem Siebtel von ihr
  rationale: Die wiederholte Verbindung bezeichnet im Kontext am ehesten einen siebten Anteil der Scheibe. Das Pronomen wird ausdrücklich beibehalten.
- source_word: ዐሠርተ ራብዐተ እደ ብርሃኑ
  choice: einem Vierzehntel ihres Lichts
  rationale: Die äthiopische Bruchbildung und das vierzehnteilige Lichtschema des Abschnitts sprechen für „ein Vierzehntel“. „Licht“ hält die Wortwahl für ብርሃን im Vers einheitlich.
theological_decisions:
- issue: Art der Beschreibung des Himmelskörpers
  choice: Die gezählten Anteile als technisch-apokalyptische Maßangaben bewahren
  alternative: Den Satz allgemein als Beschreibung einer zu- oder abnehmenden Mondphase umschreiben
  rationale: Das Astronomische Buch beschreibt die himmlischen Zyklen in einem eigenen, wiederholenden Maßschema. Eine Modernisierung würde die antike kosmologische Darstellungsweise verdecken.
- issue: Deutung der schwer verständlichen Zahlenfolge
  choice: Die Ausdrücke im Zusammenhang als Brüche wiedergeben und die sprachliche Schwierigkeit in den Fußnoten offenlegen
  alternative: Die Wortfolge oberflächlich als „sieben Teile“ und „vierzehn Teile“ wiedergeben
  rationale: Die Bruchdeutung ergibt innerhalb des vierzehnteiligen Schemas einen nachvollziehbaren Bezug, ohne die überlieferte Spannung zwischen Siebtel und Vierzehntel aus dem Haupttext zu entfernen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knapper, formelhafter Satzstruktur. Das Femininum bezieht sich auf die im Zusammenhang vorausgesetzte Mondscheibe. Die ungewöhnliche Wiederholung „leer, ohne Licht“ und die Spannung der Maßangaben bleiben erhalten.
