base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/001.yaml
  text: And after this law I saw another law for the lesser light[b][a], whose name is the moon.
translation:
  language: de
  text: Und nach dieser Ordnung[a] sah ich eine weitere Ordnung für das kleinere Licht, das Mond heißt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Gebot“, „Satzung“ oder „Gesetz“; ebenso beim zweiten Vorkommen von „Ordnung“. Das ge’ezische Wort kann sowohl eine autoritative Anweisung als auch eine festgelegte Regelung bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወድኅሬሁ
  choice: Und nach dieser
  rationale: Gibt die zeitliche Übergangsformel knapp und natürlich wieder und verknüpft den Satz mit der vorhergehenden Ordnung.
- source_word: ትእዛዝ / ትእዛዘ
  choice: Ordnung / Ordnung
  rationale: Im astronomischen Zusammenhang bezeichnet das wiederholte Wort am ehesten eine vorgeschriebene kosmische Regelung. „Ordnung“ wahrt sowohl den autoritativen als auch den systematischen Sinn und erhält die Wiederholung des Ge’ez.
- source_word: ርኢኩ
  choice: sah ich
  rationale: Direkte, moderne Wiedergabe des visionären Berichts in der ersten Person.
- source_word: ካልአ
  choice: eine weitere
  rationale: Kennzeichnet eine zusätzliche, entsprechende Ordnung; im Deutschen ist dies in der Satzfolge natürlicher als „eine andere“.
- source_word: ለብርሃን ንኡስ
  choice: für das kleinere Licht
  rationale: Bewahrt das Bild eines im Verhältnis zum vorher behandelten Himmelslicht kleineren Lichts, ohne den Mond vorzeitig einzusetzen.
- source_word: ዘስሙ
  choice: das den Namen … trägt
  rationale: Natürliche deutsche Wiedergabe der Relativkonstruktion „dessen Name ist“, ohne deren Benennungsfunktion aufzugeben.
- source_word: ወርኅ
  choice: Mond
  rationale: Die übliche Bedeutung des Ge’ez-Wortes; nach „den Namen“ steht es im Deutschen idiomatisch ohne Artikel.
theological_decisions:
- issue: Bedeutung von ትእዛዝ im Astronomischen Buch
  choice: Ordnung
  alternative: Gebot; Satzung; Gesetz
  rationale: Der Kontext beschreibt die festgelegten Abläufe der Himmelskörper. „Ordnung“ lässt offen, ob vor allem die göttliche Anweisung oder die daraus hervorgehende kosmische Regelmäßigkeit gemeint ist, während „Gebot“ zu stark an einen einzelnen gesprochenen Befehl und „Gesetz“ an eine stärker technische Terminologie denken lassen könnte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die formelhafte Wiederholung von „Ordnung“ wird entsprechend dem Ge’ez beibehalten; die Identifizierung des kleineren Lichts als Mond bleibt in der vom Ausgangstext vorgegebenen Reihenfolge.
