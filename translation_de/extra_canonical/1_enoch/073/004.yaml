  to: 'Und auf diese Weise ist er verborgen[a]. Sein Haupt[b], das nach Osten gerichtet ist, tritt am dreißigsten Morgen hervor; an diesem Tag wird er sichtbar. Er soll euch als Monatsanfang[c] gelten: am dreißigsten Tag[d] zusammen mit der Sonne, in dem Tor[e], aus dem die Sonne hervortritt.'
  rationale: Eine vollständige Revision ist erforderlich, weil der erste Satz in der Entwurfsfassung die dokumentierte und im Kontext passendere Bedeutung des ge'ezischen Verbs umkehrt. Die Neufassung stellt „verborgen“ in den Haupttext, erhält die abweichende Übertragung transparent in der Fußnote und ersetzt die überinterpretierende, im Deutschen sperrige „Vorderseite“ durch das quellennähere „Haupt“. Die kalendarischen Angaben und die antike Tor-Metaphorik bleiben unverändert erhalten.
