review_pass:
  verdict: revise
  source_fidelity: Der Auftakt ይሠርቅ ist im überlieferten ge'ezischen Text am ehesten „ist/wird verborgen“ und nicht „geht auf“. Die aktuelle Hauptübersetzung folgt damit der englischen Textzeile, widerspricht aber der dokumentierten lexikalischen Entscheidung und verkehrt die Aussage. Die übrigen Zeitangaben, die kalendarische Funktion von „am dreißigsten Tag“ sowie die Tor-Bildsprache sind grundsätzlich sachgemäß wiedergegeben.
  naturalness: „Seine Vorderseite ... tritt ... hervor“ ist im Deutschen schwer verständlich und legt eine nicht ausdrücklich bezeichnete sichtbare Mondseite nahe. „Sein Haupt“ bewahrt das konkrete Bild des Ausgangstextes; die Fußnote kann die mögliche Umschreibung erklären. „An diesem Tag“ ist im modernen Standarddeutsch etwas unmittelbarer als „an jenem Tag“.
  terminology: „Monatsanfang“ ist eine natürliche und treffende Wiedergabe von ርእሰ ወርኅ, sofern die wörtliche Metapher in der Anmerkung erhalten bleibt. „Tor“ und „hervortritt“ bewahren die kosmologische Bildsprache. Die maskuline Bezugnahme ist im Deutschen nur dann eindeutig, wenn der Mond aus dem unmittelbaren Kontext vorausgesetzt ist; sie wird hier wie im Entwurf beibehalten.
