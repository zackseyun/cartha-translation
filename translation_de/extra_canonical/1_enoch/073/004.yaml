base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/004.yaml
  text: And in this way it rises[a], and its front, which is toward the east, comes out on the thirtieth morning, and on that day it becomes visible, and it shall be for you the head of the month, on the thirtieth day with the sun[e][d][c][b], in the gate from which the sun comes out.
translation:
  language: de
  text: 'Und auf diese Weise ist er verborgen[a]. Sein Haupt[b], das nach Osten gerichtet ist, tritt am dreißigsten Morgen hervor; an diesem Tag wird er sichtbar. Er soll euch als Monatsanfang[c] gelten: am dreißigsten Tag[d] zusammen mit der Sonne, in dem Tor[e], aus dem die Sonne hervortritt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Verb kann in diesem Zusammenhang „verborgen sein“ oder „verhüllt sein“ bedeuten. Eine abweichende Wiedergabe lautet: „geht auf“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „sein Haupt“. Möglich ist auch, den Satz anders zu gliedern: „und sein Haupt ist nach Osten gerichtet; es tritt hervor“.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: „Haupt des Monats“, eine konkrete Bezeichnung für den Beginn des Monats.'
    reason: lexical_alternative
  - marker: d
    text: Auch als „dreißig Tage“ auffassbar; der parallele kalendarische Ausdruck im Vers spricht für „am dreißigsten Tag“.
    reason: grammatical_alternative
  - marker: e
    text: Das „Tor“ gehört zur wiederkehrenden Darstellung des Astronomischen Buches, nach der die Himmelskörper durch festgelegte Tore des Himmels hervortreten.
    reason: cultural_note
lexical_decisions:
- source_word: ይሠርቅ
  choice: geht er auf
  rationale: Das Verb bezeichnet im Zusammenhang mit Himmelskörpern am natürlichsten das Aufgehen. Das maskuline Pronomen bezieht sich im Deutschen sinngemäß auf den Mond.
- source_word: ርእሱ
  choice: seine Vorderseite
  rationale: Wörtlich steht „sein Haupt/Kopf“. „Vorderseite“ bewahrt die räumliche Vorstellung und ergibt in der Beschreibung der sichtbaren Mondseite verständliches Deutsch.
- source_word: ዘመንገለ ጽባሕ
  choice: die nach Osten gerichtet ist
  rationale: Die Wendung bezeichnet die Richtung des Morgens beziehungsweise Sonnenaufgangs und damit den Osten.
- source_word: በሠላሳ ጽባሕ
  choice: am dreißigsten Morgen
  rationale: Die Zeitangabe markiert den dreißigsten Morgen im beschriebenen Zyklus.
- source_word: ያስተርኢ
  choice: wird er sichtbar
  rationale: Die Kausativbildung kann „sichtbar machen/zeigen“ bedeuten; im astronomischen Zusammenhang bezeichnet sie idiomatisch das Sichtbarwerden des Mondes.
- source_word: ርእሰ ወርኅ
  choice: Monatsanfang
  rationale: Die wörtliche Wendung „Haupt des Monats“ ist ein konkretes Idiom für den Beginn des Monats. „Monatsanfang“ vermittelt diesen Sinn natürlich, während die Fußnote das Bild erhält.
- source_word: ሠላሳ ዕለት
  choice: am dreißigsten Tag
  rationale: Im kalendarischen Zusammenhang fungiert die Kardinalzahl als Ordinaldatum und entspricht der parallelen Angabe „am dreißigsten Morgen“.
- source_word: ምስለ ፀሐይ
  choice: zusammen mit der Sonne
  rationale: Die Präposition bezeichnet die Zuordnung oder das gemeinsame Auftreten mit der Sonne.
- source_word: በኆኅት
  choice: in dem Tor
  rationale: Die konkrete Torvorstellung gehört zur Kosmologie des Astronomischen Buches und wird nicht zu einem modernen Begriff wie „Horizont“ verflacht.
- source_word: እንተ ይወፅእ ፀሐይ
  choice: aus dem die Sonne hervortritt
  rationale: Der Relativsatz bestimmt das Tor durch das Hervortreten der Sonne und bewahrt die Bewegungsbildlichkeit des Ausgangstextes.
theological_decisions:
- issue: Übertragung der antiken kosmologischen Bildsprache
  choice: Die Bilder vom Hervortreten und vom Tor des Himmels bleiben erhalten.
  alternative: Die Aussagen als „Neumond“, „östlicher Horizont“ oder „Sonnenaufgangspunkt“ modernisieren.
  rationale: Der Text stellt sein kalendarisch-kosmologisches System in konkreten räumlichen Bildern dar. Eine Modernisierung würde seine eigene Vorstellungswelt verdecken.
- issue: Deutung von ርእሰ ወርኅ
  choice: Im Haupttext steht das verständliche „Monatsanfang“, die wörtliche Metapher wird in der Fußnote genannt.
  alternative: Im Haupttext „Haupt des Monats“ schreiben.
  rationale: Die idiomatische Bedeutung ist klar, während die Fußnote die konkrete Form des ge'ezischen Ausdrucks transparent hält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzgliederung. Die astronomisch-apokalyptische Bildsprache bleibt konkret; schwer verständliche wörtliche Idiome werden im Haupttext behutsam erschlossen und in Fußnoten offengelegt.
