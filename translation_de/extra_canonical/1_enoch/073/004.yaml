    rationale: Das Wort bedeutet wörtlich „sein Haupt“. „Vorderseite“ interpretiert es als sichtbare Seite eines Himmelskörpers und macht den Satz im Deutschen nicht klarer. Die wörtliche Bildsprache sollte mit einer erläuternden Fußnote bewahrt werden.
