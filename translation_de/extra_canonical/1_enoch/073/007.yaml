base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/007.yaml
  text: And it sets with the sun[a]; and when the sun rises, the moon rises with it and takes half a portion of light. And on that night, at the beginning of its morning, before the day[c][b], the moon sets with the sun and is dark through that night—seven parts and a half.
translation:
  language: de
  text: Und er geht mit der Sonne unter. Wenn die Sonne aufgeht, geht der Mond mit ihr auf und empfängt einen halben Teil Licht.[b] Und in jener Nacht, zu Beginn seines Morgens, vor dem Tag,[a] geht der Mond mit der Sonne unter und ist in jener Nacht dunkel – siebeneinhalb Teile.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Wortlaut in der Mitte des Verses ist schwierig, besonders die Folge „zu Beginn seines Morgens, vor dem Tag“. Die Übersetzung hält sich eng an die zeitlichen Angaben, ohne sie als moderne astronomische Erklärung zu glätten.
    reason: textual_variant
  - marker: b
    text: Das Kapitel bemisst das Licht des Mondes wiederholt in gezählten Teilen. Der „halbe Teil Licht“ gehört wahrscheinlich zu diesem System abgestufter Helligkeit.
    reason: cultural_note
  - marker: c
    text: Wörtlich steht am Schluss eine Maßangabe von „sieben Teilen und einer Hälfte“; ihr genauer syntaktischer Anschluss ist im überlieferten Wortlaut knapp.
    reason: translation_note
lexical_decisions:
- source_word: የዓርብ
  choice: geht … unter
  rationale: Im astronomischen Zusammenhang bezeichnet das Verb den Untergang eines Himmelskörpers; die deutsche Wendung ist natürlich und sachlich.
- source_word: ይሠርቅ
  choice: geht … auf
  rationale: Das Verb wird von Sonne und Mond gebraucht und steht im Gegensatz zum Untergehen.
- source_word: ምስሌሁ
  choice: mit ihr
  rationale: Das Pronomen verweist auf die im Deutschen feminine Sonne.
- source_word: ይነሥእ
  choice: nimmt … auf
  rationale: Die Formulierung bewahrt die konkrete Vorstellung, dass der Mond eine bemessene Lichtmenge empfängt, ohne den Vorgang modern-astronomisch auszudeuten.
- source_word: መንፈቀ እደ ብርሃን
  choice: eine halbe Einheit Licht
  rationale: Die Verbindung bezeichnet eine Hälfte einer gezählten Lichtabteilung; „Einheit“ ist im Deutschen verständlicher als „Teil eines Lichts“ und hält das Maßsystem offen.
- source_word: በርእሰ ጽባሐ ዚአሁ
  choice: zu Beginn seines Morgens
  rationale: Dies gibt das wörtliche Bild „am Kopf/Anfang seines Morgens“ wieder und erhält den nicht ganz eindeutigen Pronomenbezug.
- source_word: በቅድመ ዕለቱ ለወርኅ
  choice: vor dem Tag
  rationale: Die überlieferte Wortfolge ist schwierig. „Vor dem Tag“ bewahrt die zeitliche Abfolge, ohne die syntaktische Unsicherheit durch einen ausdrücklichen Besitzbezug zu beseitigen.
- source_word: ይጸልም
  choice: bleibt … dunkel
  rationale: Das Verb bezeichnet Dunkelheit beziehungsweise Verdunkelung; die Wiedergabe beschreibt den Zustand, ohne eine Finsternis oder moderne Mondphase einzutragen.
- source_word: ፯ሳብዓተ እደ ወንፍቃ
  choice: siebeneinhalb Einheiten
  rationale: Die Wendung nennt sieben gezählte Teile und eine Hälfte. Die kompakte deutsche Form macht die Maßangabe klar.
theological_decisions:
- issue: Vormoderne kosmologische Beschreibung
  choice: Konkretes Auf- und Untergehen sowie bemessene Einheiten des Lichts beibehalten
  alternative: Den Text als moderne Beschreibung einer Mondphase, Konjunktion oder Finsternis paraphrasieren
  rationale: Der Abschnitt schildert die Ordnung der Himmelskörper in seiner eigenen visionär-kosmologischen Begriffswelt; eine moderne Harmonisierung würde zusätzliche Deutung eintragen.
- issue: Unklare zeitliche und syntaktische Abfolge in der Versmitte
  choice: „zu Beginn seines Morgens, vor dem Tag“
  alternative: „vor dem Tag des Mondes“ oder eine geglättete astronomische Erklärung
  rationale: Die gewählte Fassung wahrt den schwierigen Wortlaut und dessen Pronomenbezug, statt eine umstrittene syntaktische Zuordnung festzuschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Verben für Auf- und Untergang sowie die vormoderne Rede von messbaren Lichteinheiten bleiben erhalten. Ungewöhnliche zeitliche Formulierungen werden nicht zu moderner Astronomie umgedeutet.
