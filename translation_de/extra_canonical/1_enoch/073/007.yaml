revisions:
- from: 'Und er geht zusammen mit der Sonne unter.[a] Wenn die Sonne aufgeht, geht der Mond mit ihr auf und nimmt eine halbe Einheit Licht auf.[b] Und in jener Nacht, zu Beginn seines Morgens, vor dem Tag, geht der Mond zusammen mit der Sonne unter und bleibt in jener Nacht dunkel: siebeneinhalb Einheiten.[c]'
  to: Und er geht mit der Sonne unter. Wenn die Sonne aufgeht, geht der Mond mit ihr auf und empfängt einen halben Teil Licht.[b] Und in jener Nacht, zu Beginn seines Morgens, vor dem Tag,[a] geht der Mond mit der Sonne unter und ist in jener Nacht dunkel – siebeneinhalb Teile.[c]
  rationale: Die Revision vereinheitlicht die Maßterminologie auf „Teil“, ersetzt die wenig natürliche Verbindung „eine halbe Einheit Licht aufnehmen“ durch eine quellennahe deutsche Formulierung und vermeidet mit „ist ... dunkel“ eine nicht erforderliche Aspektverstärkung. Die umstrittene zeitlich-syntaktische Satzmitte bleibt bewusst unaufgelöst. Die Fußnoten werden inhaltlich beibehalten, aber korrekt verankert.
