base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/073/008.yaml
  text: And on that day it rises with exactly seven parts[b][a], and it comes out.
translation:
  language: de
  text: Und an jenem Tag geht er mit genau sieben Anteilen[a] auf und kommt hervor.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »sieben Teile«; dem Zusammenhang nach sind sieben Anteile seines Lichts gemeint.
    reason: lexical_clarification
lexical_decisions:
- source_word: ይሠርቅ
  choice: geht … auf
  rationale: Das Verb bezeichnet hier das Aufgehen eines Himmelskörpers. Diese astronomische Bedeutung passt zum unmittelbaren Zusammenhang.
- source_word: በይእቲ ዕለት
  choice: an jenem Tag
  rationale: Die Präposition mit Demonstrativ und ዕለት bildet eine Zeitangabe und verweist auf den betreffenden Tag.
- source_word: ሳብዐተ እደ
  choice: sieben Anteilen
  rationale: ሳብዐተ ist die Zahl »sieben«; እደ bezeichnet hier mehrere Teile oder Anteile. »Anteile« bewahrt die schematische Größenangabe, ohne das im Wortlaut nicht ausdrücklich genannte Licht einzufügen.
- source_word: ጥንቁቀ
  choice: genau
  rationale: Das Adverb gibt Genauigkeit beziehungsweise exakte Entsprechung an.
- source_word: ይወፅእ
  choice: kommt hervor
  rationale: Das Bewegungsverb bedeutet hinausgehen oder hervorkommen. »Kommt hervor« gibt im Zusammenhang des aufgehenden Himmelskörpers die Bewegung natürlich wieder, ohne sie mit dem vorherigen Verb gleichzusetzen.
theological_decisions:
- issue: Bezug der maskulinen Singularformen
  choice: Das maskuline Pronomen »er« wird beibehalten und auf den im Kontext genannten Himmelskörper, den Mond, bezogen.
  alternative: Den Himmelskörper mit dem neutralen Pronomen »es« wiedergeben oder das Subjekt unausgesprochen lassen.
  rationale: Die geʿezischen Verbalformen stehen im maskulinen Singular; zudem ist »der Mond« im Deutschen grammatisch maskulin. »Er« bewahrt daher sowohl die Form des Ausgangstextes als auch dessen kosmologische Darstellungsweise.
- issue: Ungenannter Gegenstand der sieben Anteile
  choice: Im Haupttext steht lediglich »sieben Anteile«; »des Lichts« wird nicht ergänzt.
  alternative: Zur Verdeutlichung »sieben Lichtanteile« oder »sieben Teile seines Lichts« schreiben.
  rationale: Der Kontext legt Lichtanteile nahe, doch das entsprechende Substantiv steht nicht ausdrücklich in diesem Vers. Die knappe Form wahrt diese textliche Offenheit.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Wiederholung von Aufgehen und Hervorkommen bleibt erhalten, weil beide Bewegungsverben im Ausgangstext stehen. »Anteile« klingt in der astronomisch-schematischen Beschreibung natürlicher als »Teile«, während die Fußnote die wörtlichere Möglichkeit nennt.
