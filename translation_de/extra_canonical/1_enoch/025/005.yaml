  source_fidelity: 'Die Übersetzung folgt dem erhaltenen Ge’ez-Auszug eng: ፍሬ ist treffend als »Frucht«, ኅሩያን als »den Erwählten«, ሐይወት unaufgelöst als »Leben«, und መንገለ መስዕ als Richtungsangabe »nach Norden hin« wiedergegeben. Das Futurpassiv gibt ይትወሀብ und ይተከል angemessen wieder. Besonders korrekt ist, ዲበ als unabgeschlossene Präposition »auf …« zu behandeln, nicht als Adverb »oben«; der Auszug endet vor dem Bezugswort.'
