base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/005.yaml
  text: From its fruit life shall be given to the chosen ones[a], and it shall be planted toward the north[b], upon...
translation:
  language: de
  text: Von seiner Frucht wird den Erwählten Leben gegeben werden[a], und nach Norden hin wird er auf … gepflanzt werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wörter für »von« und »wird gegeben« sind in der zugrunde liegenden Edition als textkritisch ergänzte Lesarten gekennzeichnet; auch die Überlieferung um »Leben« ist unsicher.
    reason: textual_variant
  - marker: b
    text: Der vorgelegte Ge’ez-Auszug bricht nach der Präposition »auf« ab. Ihr Bezugswort gehört zum folgenden, hier nicht erhaltenen Text; deshalb bleibt der Satz offen.
    reason: truncated_source
lexical_decisions:
- source_word: ፍሬ
  choice: Frucht
  rationale: Bewahrt das konkrete Bild der Frucht des geschauten Baumes.
- source_word: ይትወሀብ
  choice: wird … gegeben werden
  rationale: Gibt die passive, zukunftsbezogene Verbform wieder, ohne den Sinn durch »verleihen« oder eine andere Deutung zu erweitern.
- source_word: ኅሩያን
  choice: den Erwählten
  rationale: Bewahrt die für die Henochliteratur wichtige apokalyptische Gruppenbezeichnung; »Erwählte« ist im heutigen Deutsch verständlich, ohne die Stelle auf eine spätere Lehrtradition festzulegen.
- source_word: ሐይወት
  choice: Leben
  rationale: Entspricht unmittelbar dem Substantiv. Obwohl der Zusammenhang auf endzeitliches Leben hindeutet, wird nicht erläuternd »ewiges Leben« eingesetzt.
- source_word: መንገለ መስዕ
  choice: nach Norden hin
  rationale: Bewahrt die Richtungsangabe in natürlichem Deutsch.
- source_word: ይተከል
  choice: wird er … gepflanzt werden
  rationale: Die Passivform und das Baumbild bleiben erhalten; das maskuline Pronomen bezieht sich im Deutschen sinngemäß auf den Baum.
- source_word: ዲበ
  choice: auf …
  rationale: Das Wort ist eine Präposition mit der Bedeutung »auf/über« und verlangt ein Bezugswort. Da der vorgelegte Versauszug unmittelbar danach abbricht, bleibt die Ergänzung durch Auslassungspunkte offen.
theological_decisions:
- issue: Identität der Erwählten
  choice: Die lokale henochische Bezeichnung »die Erwählten« bleibt stehen.
  alternative: »die Auserwählten«, »die Gerechten« oder eine spätere technische Bestimmung der Erwählung
  rationale: Die Übersetzung erhält die apokalyptische Gruppenbezeichnung, ohne sie mit einer späteren konfessionellen Erwählungslehre gleichzusetzen.
- issue: Art des verheißenen Lebens
  choice: Schlicht »Leben«
  alternative: »ewiges Leben«, »Heilung« oder »Wiederherstellung«
  rationale: Der Kontext kann ein erhöhtes oder endzeitliches Leben nahelegen, doch der erhaltene Text nennt lediglich »Leben«; diese Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der feierliche Futurpassiv wird beibehalten. Die Ellipse nach »auf« macht den tatsächlichen Abbruch des Quellenauszugs sichtbar, statt die Präposition fälschlich als Adverb »oben« wiederzugeben.
