base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/004.yaml
  text: And this fragrant tree—no flesh has authority to touch it until the great judgment[a], when all will be avenged and brought to completion forever[d][c][b]; then it will be given to the righteous and the humble.
translation:
  language: de
  text: Und diesen duftenden Baum darf kein Sterblicher berühren[a] bis zum großen Gericht, wenn er an allen Vergeltung üben und alles für immer vollenden wird.[b] Jener Baum wird den Gerechten und den Demütigen gegeben werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Keiner vom Fleisch hat Vollmacht, ihn zu berühren.“ Gemeint sind sterbliche Menschen, nicht Fleisch als Stoff.'
    reason: lexical_alternative
  - marker: b
    text: Der Satz ist sprachlich schwierig. Das Subjekt von „Vergeltung üben“ und „vollenden“ wird nicht ausdrücklich genannt. Auch der Bezug von „allen/alles“ bleibt weit gefasst.
    reason: source_ambiguity
lexical_decisions:
- source_word: ዕፀ መዓዛ
  choice: duftender Baum
  rationale: Die Wortverbindung bezeichnet einen durch seinen Duft gekennzeichneten Baum. „Duftender Baum“ ist natürliches, bildhaftes Deutsch.
- source_word: ዘሥጋ
  choice: kein Sterblicher
  rationale: Wörtlich steht eine Bezeichnung mit „Fleisch“. Gemeint sind hier sterbliche Menschen; „kein Sterblicher“ gibt diese anthropologische Bedeutung verständlich wieder, ohne Fleisch als Stoff misszuverstehen.
- source_word: ሥልጣነ … ይግሥሦ
  choice: darf … berühren
  rationale: Die Verbindung besagt wörtlich, dass niemand die Vollmacht beziehungsweise das Recht hat, den Baum zu berühren. Das deutsche Modalverb „darf“ bringt den untersagten Zugang knapp und idiomatisch zum Ausdruck.
- source_word: ኵነኔ
  choice: Gericht
  rationale: Im apokalyptischen Zusammenhang bezeichnet das Wort das endzeitliche Gericht; „Gericht“ bewahrt die nötige Bedeutungsbreite.
- source_word: ይትቤቀል
  choice: Vergeltung üben
  rationale: Das Verb bezeichnet das Rächen beziehungsweise Vollziehen vergeltender Gerechtigkeit. Die aktive Form mit unausgesprochenem singularischem Subjekt bleibt durch „er“ erhalten.
- source_word: ኵሎ
  choice: an allen / alles
  rationale: Die Form ist umfassend und kann sich je nach syntaktischer Zuordnung auf alle Personen oder alle Dinge beziehen. Die deutsche Wiedergabe lässt den universalen Umfang bestehen.
- source_word: ይፌጽም
  choice: vollenden
  rationale: Das Verb bedeutet, etwas zum Abschluss oder zur Erfüllung zu bringen. „Vollenden“ wahrt den feierlichen Ton und legt den nicht ausdrücklich genannten Gegenstand nicht unnötig fest.
- source_word: ዝኩ
  choice: jener Baum
  rationale: Das Demonstrativpronomen bedeutet „jener/derjenige“ und verweist auf den Baum zurück. Die ausdrückliche Wiederaufnahme mit „Baum“ verhindert die sachlich nicht begründete Deutung als Zeitadverb „dann“.
- source_word: ጻድቃን
  choice: die Gerechten
  rationale: „Die Gerechten“ ist die geläufige und kontextgerechte Bezeichnung dieser apokalyptischen Gruppe.
- source_word: ትሑታን
  choice: die Demütigen
  rationale: Das Wort bezeichnet Menschen in Niedrigkeit beziehungsweise Demut. „Die Demütigen“ ist verständlich und vermeidet eine unnötige Angleichung an feststehende Formulierungen anderer Texte.
- source_word: ይትወሀብ
  choice: wird … gegeben werden
  rationale: Das Passiv der Vorlage wird beibehalten und stellt den Baum als künftige Gabe dar.
theological_decisions:
- issue: Bedeutung von „Fleisch“ beim Zugangsverbot
  choice: Das Verbot gilt sterblichen Menschen.
  alternative: 'Wörtlich: „Keiner vom Fleisch hat Vollmacht“; möglich wäre auch eine allgemeinere Beziehung auf leibliche Geschöpfe.'
  rationale: Im Kontext kennzeichnet „Fleisch“ die sterbliche Menschheit im Gegensatz zum geschützten heiligen Baum. Die Übersetzung vermeidet zugleich die nicht belegte Einengung auf das Essen seiner Frucht.
- issue: Subjekt der Vergeltungs- und Vollendungsaussage
  choice: Das unausgesprochene singularische Subjekt wird mit „er“ wiedergegeben, ohne es im Haupttext ausdrücklich als Gott zu benennen.
  alternative: 'Eine unpersönliche Passivform: „wenn an allen Vergeltung geübt und alles vollendet wird“.'
  rationale: Die Verbformen tragen ein singularisches Subjekt, doch dessen Identität wird in diesem Vers nicht ausdrücklich genannt. Das Pronomen wahrt die Grammatik und lässt die kontextuell naheliegende göttliche Bezugnahme unausgesprochen.
- issue: Empfänger des Baumes
  choice: Der Baum wird sowohl den Gerechten als auch den Demütigen gegeben.
  alternative: „Die Demütigen“ könnte als nähere Kennzeichnung derselben Gruppe verstanden werden.
  rationale: Die koordinierte Formulierung der Vorlage bleibt erhalten, ohne zu entscheiden, ob zwei Gruppen oder zwei Eigenschaften derselben Menschen gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptisch-feierlichem Ton. Der Satzbau wurde gegenüber der Vorlage behutsam geglättet; echte Unbestimmtheiten beim Gerichtssatz werden nicht konfessionell aufgelöst.
