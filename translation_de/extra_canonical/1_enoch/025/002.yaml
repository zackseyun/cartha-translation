base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/002.yaml
  text: At that time I[a], Enoch, answered him, saying, “I desire to know about everything[b], but especially about this tree.”
translation:
  language: de
  text: 'Zu jener Zeit antwortete ich, Henoch, ihm und sagte: „Ich möchte alles wissen, besonders aber über diesen Baum.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: አውሣእክዎ
  choice: antwortete ich ihm
  rationale: Das Verb bezeichnet eine Antwort; das Objektsuffix der 3. Person Singular maskulin wird mit „ihm“ ausdrücklich wiedergegeben.
- source_word: እንዘ፡ እብል
  choice: und sagte
  rationale: Die Konstruktion leitet die direkte Rede ein. „Und sagte“ gibt sie in natürlichem, zugleich würdigem Deutsch wieder.
- source_word: በእንተ፡ ኵሉ
  choice: über alles
  rationale: Die Präposition mit „alles“ bezeichnet den umfassenden Gegenstand von Henochs Erkenntniswunsch und bleibt vom anschließenden besonderen Interesse am Baum unterschieden.
- source_word: እፈቅድ፡ ኣእምር
  choice: möchte … Bescheid wissen
  rationale: Die Verbindung drückt den Wunsch nach Erkenntnis aus. Die deutsche Formulierung ist natürlich und wahrt sowohl das Wollen als auch das Wissen.
- source_word: ወፈድፋደሰ
  choice: ganz besonders aber
  rationale: Die Form verstärkt und kontrastiert Henochs Interesse am Baum gegenüber seinem Wunsch, alles zu erfahren.
- source_word: በእንተዝ፡ ዕፅ
  choice: über diesen Baum
  rationale: „Baum“ ist im visionären Kontext die sachlich passende Bedeutung von ዕፅ; das Demonstrativum wird mit „diesen“ erhalten.
theological_decisions:
- issue: Art und Intensität von Henochs Erkenntniswunsch
  choice: Ich möchte über alles Bescheid wissen, ganz besonders aber über diesen Baum.
  alternative: Von all diesem möchte ich Kenntnis haben, umso mehr aber von diesem Baum.
  rationale: Die Übersetzung stellt Henochs Bitte als Wunsch nach weiterer Offenbarung dar, ohne sie als bloße Neugier abzuschwächen. Zugleich bleibt der Kontrast zwischen dem umfassenden Erkenntniswunsch und dem besonderen Interesse am Baum erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt natürlich; „ganz besonders aber“ bildet die Hervorhebung und den Kontrast des äthiopischen Wortlauts ab.
