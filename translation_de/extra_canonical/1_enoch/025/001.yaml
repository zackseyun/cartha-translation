base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/001.yaml
  text: And he said to me[a], “Enoch, why do you ask about the fragrance of this tree, and inquire so that you may know?”
translation:
  language: de
  text: 'Und er sagte zu mir: „Henoch, warum fragst du nach dem Duft[a] dieses Baumes und erkundigst dich, damit du Kenntnis erlangst?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geruch“. Das ge’ezische Wort kann Geruch oder Duft bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይቤለኒ
  choice: er sagte zu mir
  rationale: Die geläufige Erzählformel gibt die direkte Einleitung der Rede ohne unnötige Erweiterung wieder.
- source_word: ሄኖክ
  choice: Henoch
  rationale: Der Personenname wird in seiner im Deutschen etablierten biblischen Form wiedergegeben.
- source_word: ምንተ ትስእል
  choice: warum fragst du
  rationale: Obwohl ምንተ wörtlich auf „was“ beruht, ergibt die Verbindung mit dem anschließend genannten Gegenstand der Frage idiomatisch „warum“.
- source_word: በእንተ መዓዛሁ
  choice: nach dem Duft
  rationale: መዓዛ bezeichnet Geruch oder Duft; „Duft“ passt zum positiven, erhabenen Charakter der visionären Szene. Der pronominale Bezug wird im Deutschen durch „dieses Baumes“ ausgedrückt.
- source_word: ለዝ ዕፅ
  choice: dieses Baumes
  rationale: ዕፅ kann Baum, Holz oder Pflanze bezeichnen; im Zusammenhang mit dem bestimmten wundersamen Gewächs ist „Baum“ die natürlichste konkrete Wiedergabe.
- source_word: ወትጠየቅ
  choice: und erkundigst dich
  rationale: Das zweite Verb des Fragens bleibt eigenständig erhalten, sodass die Wiederholung des Ausgangstextes nicht eingeebnet wird.
- source_word: ከመ ታእምር
  choice: damit du es weißt
  rationale: Die Formulierung bewahrt den Zweckcharakter der Wendung und gibt den Erkenntnisbezug von ታእምር direkt wieder.
theological_decisions:
- issue: Ton der Antwort an Henoch
  choice: Eine milde, prüfende Nachfrage nach Henochs Beweggrund
  alternative: Ein scharfer Tadel wegen ungehöriger Neugier oder eine rein sachliche Bitte um Klarstellung
  rationale: Die wiederholten Verben des Fragens und der Zwecksatz lenken den Blick auf Henochs Erkenntniswunsch, ohne ausdrücklich Verurteilung oder Zorn auszudrücken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht feierliche Wiederholung von „fragst“ und „erkundigst“ folgt dem Ausgangstext; der ungewöhnliche Zwecksatz bleibt erhalten, ohne ihn deutend aufzulösen.
