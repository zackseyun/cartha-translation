base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/025/003.yaml
  text: And he answered me[a], saying, “This high mountain that you have seen, whose summit is like the throne of the Lord, is his throne, where the Holy and Great One, the Lord of Glory, the Eternal King[c][b], will dwell when he comes down to visit the earth with goodness.”
translation:
  language: de
  text: 'Und er antwortete mir: „Dieser hohe Berg, den du gesehen hast und dessen Gipfel dem Thron des Herrn gleicht, ist sein Thron. Dort wird der Heilige und Große, der Herr der Herrlichkeit, der ewige König, wohnen, wenn er herabkommt, um die Erde in Güte zu besuchen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der letzte Ausdruck kann auch heißen: „um die Erde zum Guten aufzusuchen“ oder „um die Erde zum Guten zu prüfen“. Gemeint ist eine wohltätige göttliche Heimsuchung; die genaue Nuance bleibt offen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ
  choice: antwortete
  rationale: Bewahrt den dialogischen Charakter der Visionserzählung in natürlichem Deutsch.
- source_word: ደብር ... ነዋኅ
  choice: hohe Berg
  rationale: Gibt die erhabene apokalyptische Landschaft klar und idiomatisch wieder.
- source_word: ዘርእሱ ይመስል መንበረ ለእግዚአ
  choice: dessen Gipfel dem Thron des Herrn gleicht
  rationale: Versteht ርእስ im topografischen Sinn als Gipfel und erhält den ausdrücklichen Vergleich.
- source_word: መንበሩ ውእቱ
  choice: ist sein Thron
  rationale: Bewahrt die ausdrückliche Identifikation und die Wiederholung des Thronmotivs.
- source_word: ኀበ ይነብር
  choice: Dort wird ... wohnen
  rationale: ይነብር bezeichnet hier Wohnen oder Verweilen; das Futur entspricht dem folgenden zeitlichen Zusammenhang der Herabkunft.
- source_word: ቅዱስ ወዐቢይ
  choice: der Heilige und Große
  rationale: Gibt die substantivisch gebrauchten göttlichen Epitheta wieder, ohne sie zu bloßen Adjektiven von „Herr“ zu machen.
- source_word: እግዚአ ስብሐት
  choice: der Herr der Herrlichkeit
  rationale: Erhält den gewichtigen göttlichen Titel und seine biblisch-apokalyptische Resonanz.
- source_word: ንጉሥ ዘለዓለም
  choice: der ewige König
  rationale: Eine knappe, würdevolle Wiedergabe des königlichen Titels und seiner unbegrenzten Dauer.
- source_word: የኀውጻ ለምድር በሠናይ
  choice: um die Erde zum Guten aufzusuchen
  rationale: Bewahrt sowohl den Gedanken göttlicher Visitation als auch die positive Ziel- oder Sinnangabe, ohne die Mehrdeutigkeit auf bloße räumliche Bewegung zu reduzieren.
theological_decisions:
- issue: Verhältnis von Berg, Gipfel und göttlichem Thron
  choice: Der Gipfel gleicht dem Thron, und der Berg wird anschließend ausdrücklich als sein Thron bezeichnet.
  alternative: Nur der Gipfel ist der Thron; oder der Berg ist lediglich der Ort des Thrones.
  rationale: Die Formulierung erhält Vergleich und Identifikation nebeneinander und glättet die Spannung des ge'ezischen Textes nicht.
- issue: Zeit und Art der göttlichen Gegenwart
  choice: „wird ... wohnen, wenn er herabkommt“
  alternative: „wohnt“ oder „wird sitzen“
  rationale: Das Verb bezeichnet Wohnen beziehungsweise Verweilen, während die folgende Herabkunft die Szene zukünftig rahmt. Eine reine Sitz- oder Thronbesteigungsdeutung wäre enger als der Quelltext.
- issue: Funktion von ቅዱስ ወዐቢይ
  choice: substantivischer Titel „der Heilige und Große“
  alternative: adjektivisch „der heilige und große Herr der Herrlichkeit“
  rationale: Die appositionelle Titelfolge bleibt sichtbar und wird nicht konfessionell oder dogmatisch vereinheitlicht.
- issue: Zweck oder Qualität der göttlichen Visitation
  choice: „zum Guten“
  alternative: „in Güte“ oder „um die Erde zum Guten zu prüfen“
  rationale: Die knappe Form bewahrt die positive, heilvolle Ausrichtung, ohne festzulegen, ob በሠናይ stärker modal, final oder prüfend zu verstehen ist.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die wiederholte Thronsprache und die appositionellen Gottestitel wurden bewusst erhalten; altertümliche Wendungen wurden vermieden.
