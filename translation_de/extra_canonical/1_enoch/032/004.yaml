base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/004.yaml
  text: And it looked like the carob tree[a], and its fruit was like clusters of good grapes, very beautiful[d][c][b]; and the fragrance of that tree spread far away.
translation:
  language: de
  text: Und er sah aus wie ein Johannisbrotbaum, und seine Frucht war wie sehr schöne Trauben; und der Duft dieses Baumes verbreitete sich weithin.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይመስል
  choice: er sah aus wie
  rationale: Das Verb bezeichnet eine wahrnehmbare Ähnlichkeit; die Formulierung ist im modernen Deutschen natürlich und bewahrt den Vergleich.
- source_word: ሐመረ ጽራእ
  choice: Johannisbrotbaum
  rationale: Die Baumbezeichnung entspricht dem auch im griechischen Fragment belegten Johannisbrotbaum (κερατία; Ceratonia siliqua).
- source_word: ፍሬሁ
  choice: seine Frucht
  rationale: Konkrete und kontextgemäße Wiedergabe der Frucht des beschriebenen Baumes.
- source_word: ከመ እስካለ ወይን
  choice: wie Trauben
  rationale: Die Wendung vergleicht die Frucht mit der Frucht des Weinstocks; „Trauben“ gibt das Bild knapp und idiomatisch wieder.
- source_word: ሠናይ ጥቀ
  choice: sehr schön
  rationale: ጥቀ ist hier als verstärkendes Adverb zu verstehen; die griechische Parallelüberlieferung καλοὶ λίαν bestätigt „sehr schön“.
- source_word: ወጼናሁ ለውእቱ ዕፅ
  choice: der Duft dieses Baumes zog
  rationale: Die Wendung beschreibt, wie der angenehme Geruch von dem Baum ausgeht und sich ausbreitet.
- source_word: የሐውር ነዋኃ
  choice: weithin
  rationale: Das Wort gibt die große räumliche Ausdehnung des Duftes prägnant und würdig wieder.
