base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/003.yaml
  text: And I came into the garden of righteousness[a], and I saw beyond those trees many large trees growing there, with good fragrance, great and very beautiful and glorious; and the tree of wisdom[c][b], from which those who eat know great wisdom.
translation:
  language: de
  text: Und ich kam in den Garten der Gerechtigkeit. Dort sah ich jenseits jener Bäume[a] viele große Bäume wachsen. Ihr Duft war angenehm; sie waren mächtig, von großer Schönheit und herrlich. Auch sah ich den Baum der Weisheit[b], von dem diejenigen, die davon essen, große Weisheit erlangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die räumliche Wendung im äthiopischen Text ist schwierig; statt „jenseits jener Bäume“ sind auch „zwischen jenen Bäumen“ oder „neben jenen Bäumen“ möglich.
    reason: textual_variant
  - marker: b
    text: Die Bezeichnung „Baum der Weisheit“ erinnert an die Gartenerzählung der Genesis, entspricht aber nicht genau deren Bezeichnung „Baum der Erkenntnis von Gut und Böse“.
    reason: cross_reference
lexical_decisions:
- source_word: ገነት ጽድቅ
  choice: Garten der Gerechtigkeit
  rationale: ገነት bezeichnet einen Garten bzw. ein Paradies; „Garten“ bewahrt die Bildwelt und klingt im Deutschen natürlich. ጽድቅ wird als „Gerechtigkeit“ wiedergegeben, ohne die Wendung konfessionell auszudeuten.
- source_word: ከሐክቲሆሙ ለእልክቱ ዕፀው
  choice: jenseits jener Bäume
  rationale: Die schwierige räumliche Wendung wird entsprechend der wahrscheinlichsten Lesart als „jenseits“ übersetzt; die Alternativen „zwischen“ und „neben“ bleiben in einer Fußnote sichtbar.
- source_word: ዕፀወ ብዙኃነ ወዐቢይነ ይበቍሉ
  choice: viele große Bäume wachsen
  rationale: Die Wiedergabe erhält sowohl die Vielzahl und Größe der Bäume als auch das ausdrücklich genannte Wachstum.
- source_word: ጼናሆሙ ሠናይ
  choice: Ihr Duft war angenehm
  rationale: Die idiomatische deutsche Formulierung gibt die positive Bewertung ihres Duftes klar und sinnlich wieder.
- source_word: ዐቢያን ወሥናሙ ብዙኅ ወስቡሓን
  choice: sie waren mächtig, von großer Schönheit und herrlich
  rationale: Die drei Aspekte Größe beziehungsweise Erhabenheit, reiche Schönheit und Herrlichkeit werden getrennt bewahrt, insbesondere das zuvor leicht übergangene ወስቡሓን.
- source_word: ዕፀ ጥበብ
  choice: der Baum der Weisheit
  rationale: Die direkte Genitivverbindung bewahrt die Weisheitsterminologie des Textes und ersetzt sie nicht durch die abweichende Genesisformel vom Baum der Erkenntnis.
- source_word: ዘእምኔሁ በሊዖሙ ይአምርዋ ለጥበብ ዐቢይ
  choice: von dem die, die essen, große Weisheit erkennen
  rationale: Die knappe Folge von Essen und Erkennen bleibt erhalten, ebenso das ausdrückliche Objekt „große Weisheit“. Die etwas offene Personenreferenz wird nicht durch eine zusätzliche Bestimmung wie „seine Frucht“ eingeengt.
theological_decisions:
- issue: Beziehung des Weisheitsbaums zur Edenüberlieferung
  choice: „Baum der Weisheit“ ohne Harmonisierung mit der Genesisformel
  alternative: „Baum der Erkenntnis“ oder „Baum der Erkenntnis von Gut und Böse“
  rationale: Der Text weckt bewusst Erinnerungen an den heiligen Garten, nennt jedoch Weisheit und nicht die vollständige Genesisbezeichnung. Die lokale Ausdrucksweise und ihre theologische Spannung werden bewahrt.
- issue: Wirkung des Essens
  choice: „große Weisheit erkennen“
  alternative: „weise werden“
  rationale: Die Übersetzung erhält ጥበብ als ausdrückliches Objekt und vermeidet eine glättende Umformung, die den Wortlaut stärker deutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Die wiederholte Baum-Bildsprache und die feierliche Reihung der Eigenschaften bleiben erhalten; ungewöhnliche oder textlich unsichere Nuancen werden nicht stillschweigend geglättet.
