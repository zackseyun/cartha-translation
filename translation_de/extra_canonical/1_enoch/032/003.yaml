revisions:
- from: Und ich kam in den Garten der Gerechtigkeit. Dort sah ich jenseits jener Bäume[a] viele große Bäume wachsen. Ihr Duft war angenehm; sie waren mächtig, von großer Schönheit und herrlich. Auch sah ich den Baum der Weisheit[b], von dem die, die essen, große Weisheit erkennen[c].
  to: Und ich kam in den Garten der Gerechtigkeit. Dort sah ich jenseits jener Bäume[a] viele große Bäume wachsen. Ihr Duft war angenehm; sie waren mächtig, von großer Schönheit und herrlich. Auch sah ich den Baum der Weisheit[b], von dem diejenigen, die davon essen, große Weisheit erlangen.
  rationale: Die Revision beschränkt sich auf eine idiomatische und semantisch präzisere Formulierung des Schlusssatzes sowie auf die Bereinigung der erläuternden Fußnote. Die räumliche Unsicherheit bleibt durch Fußnote a sichtbar. Die konditionale Nuance ist mit „diejenigen, die davon essen“ ausreichend abgebildet; eine zusätzliche Fußnote ist dafür nicht erforderlich.
