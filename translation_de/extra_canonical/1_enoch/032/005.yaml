  yaml_path: translation/extra_canonical/1_enoch/032/005.yaml
  text: And I said[b][a], “It is beautiful.”
translation:
  language: de
  text: 'Und ich sagte: »Dies ist schön.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich knapp: »Und ich sagte: schön/gut [ist] dies.« Das Ge’ez kann hier sowohl »schön« als auch »gut« bedeuten; »ist« wird im Deutschen sinngemäß ergänzt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወእቤ
  choice: Und ich sagte
  rationale: ወ führt die Erzählung schlicht weiter; እቤ ist eine Verbform der 1. Person Singular mit der Bedeutung »ich sagte/sprach«. »Und ich sagte« bewahrt die knappe Erzählfolge.
- source_word: ሠናይዝ
  choice: Dies ist schön
  rationale: ሠናይ bezeichnet etwas Gutes, Schönes oder Angenehmes; das abschließende ዝ lässt sich als Demonstrativ »dies« verstehen. Im Deutschen wird die im Ge’ez unausgesprochene Kopula mit »ist« ergänzt. »Schön« passt zum beschreibenden Zusammenhang, ohne »gut« als unmögliche Alternative auszuschließen.
theological_decisions:
- issue: Knappes, elliptisches Urteil
  choice: »Dies ist schön.«
  alternative: »Dies ist gut.« / »Schön ist dies.«
  rationale: Die sehr kurze Aussage enthält keine ausdrückliche Kopula. Die gewählte Fassung ergänzt nur das im Deutschen erforderliche »ist« und erhält mit »dies« den möglichen demonstrativen Gehalt von ዝ. Ob ሠናይ stärker ästhetisch oder allgemein positiv gemeint ist, bleibt in der Fußnote offen.
translation_notes:
  register: Knappe, würdige moderne Standardsprache. Die direkte Rede bleibt ebenso kurz wie die überlieferte Ge’ez-Zeile; die Ellipse wird nur so weit ergänzt, wie es für natürliches Deutsch nötig ist.
