base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/001.yaml
  text: And after these[a], toward the south, as I looked over the mountains, I saw seven mountains full of choice nard and fragrant trees[c][b], and cinnamon and pepper.
translation:
  language: de
  text: '**1 Henoch 32,1**


    Nach diesen Wohlgerüchen sah ich, als ich nach Norden über die Berge blickte, sieben Berge, die voll von erlesener Narde, duftenden Bäumen, Zimt und Pfeffer waren.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Pflanzenbezeichnung für „Narde“ ist unsicher; möglich sind allgemeiner auch „kostbare Duftpflanzen“ oder „erlesene Gewürze“. Die Aufzählung kostbarer Aromata hebt die Fülle und Fremdartigkeit der visionären Landschaft hervor; sie ist nicht als moderne botanische Bestandsaufnahme zu verstehen.
    reason: lexical_alternative; cultural_note
lexical_decisions:
- source_word: እምድኅረ እሉ አፈው
  choice: nach diesen Duftstoffen
  rationale: Die Wendung führt die zuvor genannten Wohlgerüche beziehungsweise aromatischen Stoffe fort. „Duftstoffe“ bewahrt den Rückbezug und passt zur anschließenden Aufzählung kostbarer Aromata.
- source_word: ለመስዕ
  choice: nach Norden
  rationale: Das geʿezische Richtungswort bezeichnet hier den Norden. Diese Wiedergabe folgt dem Ausgangstext trotz der widersprüchlichen Angabe „south“ in der englischen Konsultationsschicht.
- source_word: እንዘ እኔጽር መልዕልተ አድባር
  choice: blickte ich … über die Berge hinweg
  rationale: Die partizipiale Konstruktion beschreibt das fortdauernde Schauen; መልዕልተ አድባር bezeichnet den Blick über beziehungsweise oberhalb der Berge und wird nicht ausgelassen.
- source_word: ፯አድባረ
  choice: sieben Berge
  rationale: Zahl und Substantiv sind ausdrücklich genannt; „Berge“ entspricht der großräumigen visionären Landschaft besser als „Hügel“.
- source_word: ምሉኣነ
  choice: voll von
  rationale: Die Form drückt die Fülle der nachfolgend aufgezählten Pflanzen und Gewürze aus.
- source_word: ሰንብላተ ቅድዋተ
  choice: erlesene Narde
  rationale: Die genaue botanische Bestimmung ist nicht völlig sicher. Im Zusammenhang mit Zimt und Pfeffer liegt eine kostbare aromatische Pflanze oder Würze nahe; „Narde“ erhält die konkrete traditionelle Bestimmung, „erlesen“ die wertende Qualifikation.
- source_word: ዕፀ መዓዛ
  choice: duftende Bäume
  rationale: Wörtlich handelt es sich um Bäume beziehungsweise Holz des Wohlgeruchs. „Duftende Bäume“ bewahrt das konkrete Landschaftsbild.
- source_word: ቀናንሞን
  choice: Zimt
  rationale: Das Lehnwort bezeichnet Zimt und ist im modernen Deutsch eindeutig wiederzugeben.
- source_word: ፐፐሬ
  choice: Pfeffer
  rationale: Das Gewürzlehnwort entspricht „Pfeffer“ und schließt die Reihe kostbarer Aromata ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer visionärer Bildsprache. Die Satzstruktur bleibt nahe am geʿezischen Fortgang, wird aber für heutige Leser flüssig gestaltet. „Nach Norden“ folgt dem geʿezischen Richtungswort und nicht der abweichenden englischen Konsultationsfassung.
