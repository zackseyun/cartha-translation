  naturalness: Der Satz ist verständlich und würdig, aber „Und nach diesen Duftstoffen blickte ich“ verbindet die zeitliche Folge und den Blick etwas holprig. Eine Umstellung mit „als ich ... blickte“ bildet die partizipiale Konstruktion natürlicher ab.
  terminology: „Narde“, „duftende Bäume“, „Zimt“ und „Pfeffer“ sind angemessen. Die botanische Unsicherheit bei „Narde“ soll durch die Fußnote gewahrt bleiben. „Wohlgerüche“ ist für die ausdrücklich genannte Duftbezeichnung im visionären Register treffender als „Duftstoffe“.
