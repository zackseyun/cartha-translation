    rationale: Die Quelle nennt an dieser Stelle die „Düfte/Wohlgerüche“ selbst; sie erklärt sie nicht lediglich zu einem impliziten Bezugsobjekt von „diesen“. Die revidierte Fassung erhält sowohl die ausdrückliche Duftbezeichnung als auch die zeitliche Abfolge.
  - severity: low
    issue: Die Stellung der Richtungs- und Blickangabe ist im Entwurf schwerfällig.
    rationale: „Als ich nach Norden über die Berge blickte“ ist modernes Standarddeutsch und gibt die fortlaufende Schauhandlung klar wieder.
