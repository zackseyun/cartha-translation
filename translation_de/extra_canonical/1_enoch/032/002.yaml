base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/032/002.yaml
  text: And from there I went above the summits of those mountains[a], far to the east, and I crossed over the Erythraean Sea; and I went far from it[c][b], and passed above the angel Zutel.
translation:
  language: de
  text: Und von dort zog ich über die Gipfel jener Berge hinweg, weit nach Osten. Ich überquerte das Erythräische Meer[a], entfernte mich weit von ihm[b] und zog über den Engel Zutel hinweg[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Rote Meer“. Die antike Bezeichnung „Erythräisches Meer“ kann ein größeres Gebiet als das heutige Rote Meer meinen.'
    reason: lexical_alternative
  - marker: b
    text: Die hier mit „entfernte mich weit von ihm“ wiedergegebene Wendung ist im äthiopischen Text schwierig; gemeint ist wahrscheinlich die weitere Reise fort vom Meer.
    reason: textual_variant
  - marker: c
    text: Der Name des Engels wird in anderen Ausgaben und Übersetzungen auch anders vokalisiert, etwa „Zutael“.
    reason: textual_variant
lexical_decisions:
- source_word: መልዕልተ ርእሶሙ ለእልኩ አድባር
  choice: über die Gipfel jener Berge hinweg
  rationale: መልዕልተ bezeichnet eine Bewegung oberhalb bzw. über etwas hinweg; ርእሶሙ bedeutet wörtlich „ihre Köpfe“, meint bei Bergen aber idiomatisch ihre Gipfel. „Jener“ bewahrt den demonstrativen Bezug.
- source_word: እንዘ ርሑቅ ውእቱ ለጽባሕ
  choice: weit nach Osten
  rationale: ጽባሕ kann den Sonnenaufgang und damit die Himmelsrichtung Osten bezeichnen. Die knappe Richtungsangabe gibt den räumlichen Sinn natürlich wieder, ohne die apokalyptische Geografie weiter festzulegen.
- source_word: ባሕረ ኤርትራ
  choice: das Erythräische Meer
  rationale: Die historische Bezeichnung wird beibehalten, da ihr antiker geografischer Umfang nicht sicher mit dem heutigen Roten Meer gleichzusetzen ist.
- source_word: ወእምኔሁ ርሑቀ ተከንኩ
  choice: entfernte mich weit von ihm
  rationale: Der äthiopische Wortlaut dieser Klausel ist schwierig; im Zusammenhang bezeichnet er am ehesten eine fortgesetzte Bewegung in große Entfernung vom zuvor genannten Meer.
- source_word: መልዕልተ ለመልአክ ዙጥኤል
  choice: über den Engel Zutel hinweg
  rationale: Die zweite Verwendung von መልዕልተ wird entsprechend der ersten räumlich wiedergegeben. Der Eigenname wird konservativ transliteriert und nicht gedeutet.
theological_decisions:
- issue: Bezeichnung des Meeres
  choice: Erythräisches Meer
  alternative: Rotes Meer
  rationale: Die ältere geografische Bezeichnung bewahrt den Horizont der antiken apokalyptischen Weltbeschreibung und vermeidet eine unbelegte Verengung auf das heutige Rote Meer.
- issue: Räumliches Verhältnis zum Engel
  choice: über den Engel Zutel hinweg
  alternative: an dem Engel Zutel vorbei
  rationale: Die auffällige Aussage des Quelltexts, dass Henoch sich „über“ dem Engel bewegt, wird nicht zu einer gewöhnlichen Vorbeibewegung geglättet; so bleibt die visionäre Spannung erhalten.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Reisebewegung. Die historische Meeresbezeichnung und die ungewöhnliche Bewegung „über“ dem Engel bleiben erhalten. Die Satzteilung nach der Ostwärtsbewegung verbessert die Lesbarkeit, ohne den Ablauf zu verändern.
