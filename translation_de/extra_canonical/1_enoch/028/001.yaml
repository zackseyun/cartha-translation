  yaml_path: translation/extra_canonical/1_enoch/028/001.yaml
  text: And from there I went on a journey..[a][b].
translation:
  language: de
  text: Von dort zog ich ostwärts, in die Mitte des Berglandes der Wüste. Ich sah eine einsame Wildnis, die voll von Bäumen und Gewächsen war. Von oben sprudelte Wasser hervor; wie ein mächtiger Wasserlauf strömte es nach Norden und Westen und ließ ringsum Wolken, Wasser und Tau aufsteigen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Schlusssequenz ist im geʿezischen Wortlaut syntaktisch schwer zu gliedern. Sie kann auch so verstanden werden, dass der mächtige Wasserlauf ringsum Wolken und Tau aufsteigen ließ; die auffällige Nennung von „Wasser und Tau“ bleibt in der Übersetzung erhalten.
    reason: textual_or_syntactic_ambiguity
lexical_decisions:
- source_word: መንገለ፡ ጽባሕ
  choice: ostwärts
  rationale: መንገለ bezeichnet die Richtung auf ein Ziel hin; ጽባሕ bezeichnet hier den Osten. „Ostwärts“ gibt die Richtungsangabe knapp und natürlich wieder.
- source_word: ማእከላ፡ ለደብረ፡ መድበራ
  choice: mitten in das Bergland der Wüste
  rationale: Die Wendung verbindet „Mitte“, „Berg/Bergland“ und „Wüste“. „Bergland“ lässt offen, ob ein einzelner Berg oder eine Gebirgslandschaft vorgestellt ist, und ergibt im Deutschen einen natürlichen Bewegungssatz.
- source_word: ገዳመ፡ ባሕቲቶ
  choice: eine einsame Wildnis
  rationale: ገዳም bezeichnet eine unbewohnte Wildnis oder Einöde; ባሕቲቶ hebt ihre Abgeschiedenheit hervor.
- source_word: ዕፀወ፡ እምነ፡ ዝንቱ፡ ዘርዕ
  choice: Bäumen und Gewächsen
  rationale: ዕፀወ bezeichnet Bäume bzw. Gehölze, während ዘርዕ Saat, Pflanzenwuchs oder Gewächse bezeichnen kann. Die koordinierte Wiedergabe folgt dem erkennbaren Bild üppiger Vegetation, ohne eine bestimmte Pflanzenart einzutragen.
- source_word: ይፈለፍል
  choice: sprudelte … hervor
  rationale: Das Verb beschreibt hervorbrechendes oder hervorsprudelndes Wasser. Die deutsche Formulierung bewahrt die lebhafte Bewegung.
- source_word: ከመ፡ መንገለ፡ መስዕ፡ መንገለ፡ ዐረብ
  choice: nach Nordwesten
  rationale: Die aufeinander bezogenen Richtungsangaben nennen Norden und Westen und bezeichnen zusammen die nordwestliche Richtung.
- source_word: ማይ፡ ወጠል
  choice: Wasser und Tau
  rationale: Die beiden Substantive bedeuten wörtlich „Wasser“ und „Tau“. Die Übersetzung wahrt diese auffällige Bildsprache, statt „Wasser“ stillschweigend als „Wolken“ oder „Nebel“ zu deuten.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Die Wiederholungen des äthiopischen Richtungsausdrucks wurden idiomatisch gebündelt; die ungewöhnliche Verbindung „Wasser und Tau“ blieb wegen ihrer möglichen bildlichen Bedeutung im Haupttext erhalten.
