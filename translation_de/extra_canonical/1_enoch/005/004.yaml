base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/004.yaml
  text: But you have not endured[a], and you have not done the command of the Lord; rather, you have transgressed and spoken proud and harsh words with your unclean mouths against his greatness. Because of the hardness of your heart[d][c][b], you will have no peace.
translation:
  language: de
  text: 'Ihr aber habt nicht ausgeharrt und das Gebot des Herrn nicht befolgt. Vielmehr seid ihr abgewichen[a] und habt mit euren unreinen Mündern gegen seine Erhabenheit[b] hochmütige und harte Worte geredet. Ihr, die ihr ein verhärtetes Herz habt: Für euch wird es keinen Frieden geben.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „habt übertreten“ beziehungsweise „habt euch abgewandt“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „gegen seine Größe“ beziehungsweise „Majestät“. Gemeint ist Gottes erhabener Rang; die genaue Nuance lässt sich hier nicht enger bestimmen.'
    reason: lexical_alternative
  - marker: c
    text: „Frieden“ meint hier wahrscheinlich nicht nur innere Ruhe, sondern umfassendes Wohlergehen und einen günstigen Ausgang.
    reason: cultural_note
lexical_decisions:
- source_word: አተዓገሥክሙ
  choice: ihr habt nicht ausgeharrt
  rationale: Das Verb bezeichnet standhaftes Ertragen beziehungsweise Ausharren; „ausgeharrt“ bewahrt den moralischen Nachdruck besser als bloßes „Geduld gehabt“.
- source_word: ትእዛዘ እግዚእ
  choice: das Gebot des Herrn
  rationale: Der Singular wird erhalten; „Herr“ ist in diesem göttlichen Kontext die angemessene, würdevolle Wiedergabe des Titels.
- source_word: ተዓደውክሙ
  choice: ihr seid abgewichen
  rationale: Das Wort bezeichnet hier ein moralisches Abweichen oder Übertreten. „Abgewichen“ wahrt diese Breite, ohne ausschließlich Abfall oder Gesetzesübertretung festzulegen.
- source_word: ሐመይክሙ
  choice: ihr habt … geredet
  rationale: Im Satz mit „Worte“ ergibt sich natürliches Deutsch. Eine mögliche feindselige oder verleumderische Nuance des Verbs wird nicht eigens zugespitzt, da die genaue Bestimmung im vorliegenden Kontext unsicher ist.
- source_word: ዓበይተ ወድሩካተ ቃላተ
  choice: hochmütige und harte Worte
  rationale: Die Adjektive kennzeichnen die Rede als überheblich und schroff beziehungsweise anmaßend; die koordinierte Form des Ge'ez bleibt erhalten.
- source_word: በአፈ ርኵሳት ዘዚአክሙ
  choice: mit eurem unreinen Mund
  rationale: Das Ge'ez verwendet trotz des Bezugs auf mehrere Angeredete eine entsprechende Körperteilform; der deutsche kollektive Singular klingt natürlich und bewahrt die Bildsprache der Unreinheit.
- source_word: በላዕለ ዕበዩ ዚአሁ
  choice: über seine Erhabenheit
  rationale: Die Wendung bezeichnet Gottes erhöhte Größe oder Majestät. „Erhabenheit“ gibt den Statusbezug idiomatisch wieder, ohne die Bedeutung auf „Herrlichkeit“ festzulegen.
- source_word: ይቡሳነ ልብ
  choice: die ihr ein verhärtetes Herz habt
  rationale: Die Wendung bezeichnet Verstocktheit und moralische Unempfänglichkeit. Die direkte Anrede wird beibehalten, statt sie kausal als „wegen eurer Herzenshärte“ auszulegen.
- source_word: ኢትከውኑክሙ ሰላም
  choice: Für euch wird es keinen Frieden geben
  rationale: Die Formulierung erhält den Charakter einer prophetischen Gerichtsansage; „Frieden“ bleibt bewusst weit und umfasst mehr als innere Ruhe.
theological_decisions:
- issue: Reichweite des abschließenden Friedensbegriffs
  choice: Für euch wird es keinen Frieden geben
  alternative: Ihr werdet kein Wohlergehen haben
  rationale: „Frieden“ bewahrt die biblisch-apokalyptische Bedeutungsbreite von Unversehrtheit, Wohlergehen und günstigem Ausgang, ohne sie auf ein einzelnes Konzept zu verengen.
- issue: Verhältnis von Herzensverhärtung und Friedensurteil
  choice: 'direkte Anrede: „Ihr, die ihr ein verhärtetes Herz habt“'
  alternative: 'kausal: „Wegen der Härte eures Herzens“'
  rationale: Die Ge'ez-Fügung lässt sich als Anrede beziehungsweise Charakterisierung verstehen. Diese Wiedergabe vermeidet, eine ausdrückliche Kausalverknüpfung einzutragen, und bewahrt die syntaktische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Ton. Die Anrede im Plural und die markante Schlussformel bleiben erhalten. Der Doppelpunkt vor dem Urteil bildet die knappe, spannungsreiche Fügung des Ausgangstextes ab.
