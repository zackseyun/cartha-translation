base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/009.yaml
  text: And they shall not again sin[c][b][a], and they shall not be condemned all the days of their life.
translation:
  language: de
  text: Und sie werden nicht wieder sündigen[a], und sie werden alle Tage ihres Lebens nicht verurteilt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Sie werden nicht länger sündigen.“ Die ge’ezische Form kann Wiederholung oder Fortdauer ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወኢይደግሙ፡ አብሶ
  choice: Und sie werden nicht wieder sündigen
  rationale: Die negative Imperfektform mit ደገመ bewahrt den Gedanken der Wiederholung beziehungsweise Fortsetzung. „Nicht wieder sündigen“ gibt diesen Sinn natürlich wieder und entspricht der identischen Wendung im vorhergehenden Vers.
- source_word: ወኢይትኴነኑ
  choice: und sie werden … nicht verurteilt werden
  rationale: Die passive gerichtliche Bedeutung wird mit „verurteilt werden“ bewahrt; „bestraft werden“ wäre enger und würde Urteil und Vollstreckung miteinander vermischen.
- source_word: ኵሎ፡ መዋዕለ፡ ሕይወቶሙ
  choice: alle Tage ihres Lebens
  rationale: Die semitisch geprägte Zeitangabe lässt sich im Deutschen eng am Wortlaut und zugleich idiomatisch wiedergeben. Der Singular „Lebens“ ist auch bei pluralischem Bezug natürlich.
theological_decisions:
- issue: Verheißung sittlicher Veränderung oder lediglich des Endes strafwürdiger Handlungen
  choice: 'Die beiden Aussagen bleiben unterschieden: Sie werden nicht wieder sündigen und nicht verurteilt werden.'
  alternative: „Sie werden kein Unrecht mehr tun und nicht bestraft werden.“
  rationale: Der Ausgangstext verbindet eine ethische Aussage über das Sündigen mit einer gerichtlichen Aussage über das Verurteiltwerden. Die Übersetzung wahrt diese Spannung, ohne die zweite Aussage bloß als Strafe oder als automatische Folge der ersten auszulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „sie werden“ hält die zwei parallelen Aussagen klar auseinander; „alle Tage ihres Lebens“ bewahrt die quellennah formulierte Zeitangabe.
