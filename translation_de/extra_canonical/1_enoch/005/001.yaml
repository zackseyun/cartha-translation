base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/001.yaml
  text: Observe how the trees are covered with green leaves and bear fruit[c][b][a], and understand concerning everything that the Ever-Living One has made all these things.
translation:
  language: de
  text: Betrachtet, wie die Bäume sich mit grünen Blättern bedecken und Frucht tragen. Bedenkt all dies und erkennt, dass der ewig Lebende[a] all dies geschaffen hat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „der für immer lebt“. Die Wendung bezeichnet hier wahrscheinlich Gott.'
    reason: alternative_reading
  - marker: b
    text: Die überlieferte äthiopische Verbform ist schwierig und scheint wörtlich „ihr habt gemacht“ zu lauten. Wahrscheinlich ist der Text an dieser Stelle verderbt; die Lesart „er hat all dies gemacht“, möglicherweise „für euch“, wird durch die weitere Überlieferung gestützt.
    reason: textual_variant
lexical_decisions:
- source_word: ጠይቁ እፎ
  choice: Betrachtet, wie
  rationale: Die Aufforderung leitet eine aufmerksame Beobachtung ein; እፎ bezeichnet hier die Art und Weise („wie“), nicht eine Höflichkeitsbitte.
- source_word: ዕፀው
  choice: die Bäume
  rationale: Die gewöhnliche Bezeichnung für Bäume beziehungsweise Holzgewächse; der bestimmte Artikel passt zur betrachteten Gattung.
- source_word: በሐመልማለ አቍጽል ይትከደኑ
  choice: sich mit grünen Blättern bedecken
  rationale: Die Wortgruppe beschreibt die Belaubung der Bäume. Die reflexive Formulierung gibt das passive beziehungsweise mediale Bild des Bekleidetwerdens natürlich wieder.
- source_word: ወይፈሪዩ
  choice: und Frucht tragen
  rationale: Eine konkrete und im Deutschen idiomatische Wiedergabe des Verbs für das Hervorbringen von Frucht.
- source_word: ወለበዉ በእንተ ኵሉ
  choice: Bedenkt all dies
  rationale: Der pluralische Imperativ richtet sich an die Angesprochenen. „Bedenkt“ bewahrt den Aufruf zum verstehenden Nachdenken über das Beobachtete.
- source_word: ወአእምሩ በከመ
  choice: und erkennt, dass
  rationale: Der zweite pluralische Imperativ wird ausdrücklich beibehalten und leitet den Inhalt der Erkenntnis ein.
- source_word: ዘሕያው ለዓለም
  choice: der ewig Lebende
  rationale: Die singularische Relativwendung bezeichnet den, der für immer lebt. Die substantivierte Form ist würdig und lässt den titelartigen Gottesbezug erkennen.
- source_word: ገበርክሙ ለአሉንቱ ኵሎሙ
  choice: all dies geschaffen hat
  rationale: Die überlieferte Verbform ist grammatisch schwierig; der Zusammenhang verlangt den ewig Lebenden als Handelnden. „Geschaffen“ bringt den Schöpfungszusammenhang im Deutschen klar zum Ausdruck, ohne die Textunsicherheit zu verschweigen.
theological_decisions:
- issue: Bezug der Schlusswendung ዘሕያው ለዓለም
  choice: der ewig Lebende
  alternative: der für immer lebt
  rationale: Die Wendung ist am natürlichsten als singularische Bezeichnung Gottes zu verstehen. Die Fußnote bewahrt die weniger titelartige, wörtliche Ausdrucksmöglichkeit.
- issue: Subjekt und Form des abschließenden Schöpfungsverbs
  choice: Der ewig Lebende hat all dies geschaffen
  alternative: ihr habt all dies gemacht / er hat all dies für euch gemacht
  rationale: Die überlieferte äthiopische Form wirkt wie eine zweite Person Plural und ist im Satz wahrscheinlich verderbt. Der Kontext und die anderweitige Textüberlieferung stützen ein Handeln Gottes; die mögliche Ergänzung „für euch“ wird wegen der Unsicherheit nicht in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Ton. Die beiden Aufforderungen zum Nachdenken und Erkennen bleiben getrennt erhalten. „Frucht tragen“ und „sich mit grünen Blättern bedecken“ bewahren die konkrete Naturbeobachtung; textliche und theologische Unsicherheiten werden in Fußnoten offengelegt.
