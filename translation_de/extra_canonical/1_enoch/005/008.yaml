base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/008.yaml
  text: And then wisdom will be given to the chosen[a], and all these will live and will not again sin, whether through ungodliness or through pride[b]; but those who possess wisdom will be humble.
translation:
  language: de
  text: Und dann wird den Erwählten[a] Weisheit gegeben werden. Sie alle werden leben und nicht wieder sündigen, weder durch Gottlosigkeit noch durch Hochmut; vielmehr werden die, die Weisheit besitzen, demütig sein.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Auserwählten“.'
    reason: lexical_alternative
  - marker: b
    text: 'Der Schlusssatz kann auch verstanden werden als: „Vielmehr werden sie demütig sein, weil sie Weisheit besitzen.“'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: እሜሃ
  choice: dann
  rationale: Gibt die zeitliche Abfolge im vorausgehenden apokalyptischen Zusammenhang knapp und natürlich wieder.
- source_word: ይትወሀቦሙ ለሕሩያን ጥበብ
  choice: den Erwählten wird Weisheit gegeben werden
  rationale: Die Passivform bewahrt Weisheit als empfangene Gabe; „Erwählten“ gibt die Gruppenbezeichnung wieder, ohne sie weiter dogmatisch auszudeuten.
- source_word: ኵሎሙ እሉንቱ የሐይዉ
  choice: Sie alle werden leben
  rationale: Bewahrt den umfassenden Bezug auf die eben genannten Erwählten und lässt die mögliche Fülle des Verbs „leben“ offen.
- source_word: ወኢይደግሙ አብሶ
  choice: und nicht wieder sündigen
  rationale: Gibt Negation, Wiederholungsaspekt und das allgemeine Sündigen direkt wieder.
- source_word: እበረሲዕ ወእበኅዕቢት
  choice: weder aus Gottlosigkeit noch aus Hochmut
  rationale: Erhält die religiös-moralische Bedeutung des ersten Begriffs und den Gegensatz zwischen Hochmut und nachfolgender Demut. „Aus“ lässt die genannten Haltungen als Beweggründe oder Ursprünge des Sündigens erkennen.
- source_word: አላ ይገንዩ
  choice: vielmehr werden … demütig sein
  rationale: „Vielmehr“ markiert den starken Gegensatz; „demütig sein“ ist eine natürliche, würdevolle Wiedergabe der Niedrigkeit bzw. Demut.
- source_word: ዘቦሙ ጥበበ
  choice: die, die Weisheit besitzen
  rationale: Gibt die Relativkonstruktion verständlich wieder und bewahrt die ausdrückliche Verbindung von Weisheitsbesitz und Demut.
theological_decisions:
- issue: Bezeichnung ሕሩያን
  choice: die Erwählten
  alternative: die Auserwählten
  rationale: „Erwählten“ bewahrt die apokalyptische Gruppenbezeichnung und vermeidet zusätzliche dogmatische Festlegungen; die geläufige Alternative wird in der Fußnote genannt.
- issue: Umfang der künftigen moralischen Veränderung
  choice: „nicht wieder sündigen“, gefolgt von Gottlosigkeit und Hochmut
  alternative: nur das Ende der beiden ausdrücklich genannten Sünden
  rationale: Der Wortlaut enthält zunächst die breite Aussage über das Sündigen und nennt anschließend zwei konkrete Haltungen. Die Übersetzung erhält diese Spannung, ohne die allgemeine Aussage einzuengen.
- issue: Syntaktischer Bezug der Schlusswendung
  choice: „die, die Weisheit besitzen, [werden] demütig sein“
  alternative: „sie werden demütig sein, weil Weisheit ihnen gehört“
  rationale: Die Relativdeutung liegt nahe, doch die knappe Ge'ez-Konstruktion kann auch einen begründenden Zusammenhang zwischen Weisheit und Demut ausdrücken; die Fußnote bewahrt diese Möglichkeit.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Die Zukunftsformen bewahren den apokalyptischen Ausblick; kurze Hauptsätze vermeiden unnötige Schwere. Alle Fußnotenmarker stehen im Haupttext.
