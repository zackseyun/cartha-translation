  text: Seht, wie die Meere und die Flüsse gemeinsam ihr Werk vollbringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ርእዩ
  choice: Seht
  rationale: Der Pluralimperativ bewahrt die unmittelbare Aufforderung, die Schöpfung zu betrachten.
- source_word: እፎ
  choice: wie
  rationale: Leitet hier in der beobachtenden, staunenden Redeweise das ein, worauf geachtet werden soll.
- source_word: አብሕርት
  choice: die Meere
  rationale: Plural zu ባሕር („Meer“); die wasserbezogene Bedeutung passt zusammen mit den nachfolgend genannten Flüssen.
- source_word: ወአፍላግ
  choice: und die Flüsse
  rationale: Plural zu ፈልግ („Fluss“), nicht „Zweige“; der Ausdruck bildet mit „Meere“ ein Paar von Gewässern.
- source_word: ኅቡረ
  choice: gemeinsam
  rationale: Gibt den adverbialen Sinn koordinierter beziehungsweise vereinter Tätigkeit natürlich wieder.
- source_word: ይፌጽሙ
  choice: vollbringen
  rationale: Drückt aus, dass sie die ihnen zukommende Tätigkeit ausführen und zur Erfüllung bringen, ohne im Deutschen schwerfällig zu wirken.
- source_word: ግብሮሙ
  choice: ihr Werk
  rationale: Bezeichnet ihre eigentümliche Tätigkeit innerhalb der geschaffenen Ordnung, ohne eine moralische Wertung einzutragen.
