base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/007.yaml
  text: And for the chosen there shall be light and joy and peace[a], and they shall inherit the earth. But for you, the wicked[b], there shall be a curse.
translation:
  language: de
  text: Und für die Erwählten wird es Licht, Freude und Frieden geben, und sie werden die Erde[a] erben. Für euch aber, die Frevler, wird es einen Fluch geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Land“. Das ge’ezische Wort kann sowohl „Erde“ als auch „Land“ bedeuten; der weitere apokalyptische Zusammenhang spricht hier eher für „Erde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ሕሩያን
  choice: die Erwählten
  rationale: Die substantivierte Pluralform bezeichnet die Ausgewählten als Gruppe. „Die Erwählten“ ist im Deutschen verständlich, würdevoll und weniger umständlich als „die Auserwählten“.
- source_word: ብርሃን
  choice: Licht
  rationale: Die Grundbedeutung „Licht“ bewahrt das Bild der Segenszusage ohne zusätzliche Deutung.
- source_word: ፍሥሐ
  choice: Freude
  rationale: „Freude“ gibt den Begriff in der dreigliedrigen Segensformel natürlich und gewichtig wieder.
- source_word: ሰላም
  choice: Frieden
  rationale: „Frieden“ ist die naheliegende Wiedergabe und lässt den möglichen weiteren Sinn von Wohlergehen mitschwingen.
- source_word: ይወርስዋ ለምድር
  choice: sie werden die Erde erben
  rationale: Das Verb bezeichnet Erben beziehungsweise Besitzergreifen; ምድር kann „Erde“ oder „Land“ bedeuten. Im apokalyptischen Zusammenhang ist „Erde“ vorzuziehen, während die Alternative in einer Fußnote erhalten bleibt.
- source_word: ረሲዓን
  choice: die Frevler
  rationale: „Frevler“ bewahrt die moralisch-gerichtliche Gruppenbezeichnung und klingt in einem würdevollen deutschen Bibelregister natürlicher als das substantivierte „die Bösen“.
- source_word: ርገመት
  choice: einen Fluch
  rationale: Der Ausdruck bezeichnet einen Fluch beziehungsweise eine Verwünschung; „einen Fluch“ ist im deutschen Urteilssatz klar und idiomatisch.
theological_decisions:
- issue: Bedeutungsumfang von ምድር
  choice: Erde
  alternative: Land
  rationale: Der Begriff kann beides bedeuten. Der kosmische und gerichtliche Horizont des Abschnitts spricht für „Erde“, ohne die engere Möglichkeit auszuschließen.
- issue: Wiedergabe von ሕሩያን
  choice: die Erwählten
  alternative: die Auserwählten
  rationale: „Die Erwählten“ erhält die markierte Gruppenbezeichnung, ohne durch eine stärker traditionsgeprägte Formulierung zusätzliche dogmatische Vorstellungen einzutragen.
- issue: Kontraststruktur der Satzverknüpfungen
  choice: „Und“ im ersten Satz; „aber“ beim Übergang zu den Frevlern
  alternative: „Aber“ auch am Versanfang
  rationale: Das einfache ወ eröffnet die Zusage an die Erwählten, während das enklitische -ሰ im zweiten Teil den ausdrücklichen Gegensatz markiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer apokalyptischer Gegenüberstellung. Die Satzstellung „Für euch aber“ bildet die ge’ezische Kontrastmarkierung natürlich ab; unnötig altertümliche Formen werden vermieden.
