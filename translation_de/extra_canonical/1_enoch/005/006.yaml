  naturalness: Modernes, gut verständliches Standarddeutsch mit einem passenden erhöhten apokalyptischen Ton. Die Formulierung „zu einem ewigen Fluch ... werden“ ist idiomatisch; die Wiederholung von „werden“ ist als reguläre Zukunftsform des Prädikats „zu etwas werden“ vertretbar.
