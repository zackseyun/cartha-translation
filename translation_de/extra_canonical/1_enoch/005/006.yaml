base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/006.yaml
  text: In those days you will give your names to an everlasting curse for all the righteous[a], and the sinners will curse you[d][c][b]; and for you there will be a joining together with sinners.
translation:
  language: de
  text: In jenen Tagen werden eure Namen zu einem ewigen Fluch für alle Gerechten werden[a], und die Sünder werden euch verfluchen[b]; und ihr werdet mit den Sündern verbunden sein[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Eure Namen werden zu einem ewigen Fluch für alle Gerechten gegeben.“ Gemeint ist wahrscheinlich, dass ihre Namen beim Aussprechen von Flüchen als abschreckendes Beispiel gebraucht werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Eine andere, textgeschichtlich bezeugte Deutung lautet: „Die Sünder werden bei euch Flüche schwören“ beziehungsweise „durch euch fluchen“. Der vorliegende äthiopische Wortlaut lässt sich jedoch am ehesten mit „euch verfluchen“ verstehen.'
    reason: alternative_reading
  - marker: c
    text: 'Auch möglich: „Ihr werdet zu den Sündern gerechnet“ oder „ihr werdet Gemeinschaft mit den Sündern haben“.'
    reason: alternative_reading
lexical_decisions:
- source_word: በውእቱ መዋዕል
  choice: In jenen Tagen
  rationale: Bewahrt die übliche prophetisch-apokalyptische Zeitformel und den Plural von መዋዕል in natürlichem, gehobenem Deutsch.
- source_word: ትሁቡ ስመ ዚአክሙ
  choice: werden eure Namen … werden
  rationale: ትሁቡ ist eine passive Form („werden gegeben“). Im Deutschen gibt „zu einem Fluch werden“ die idiomatische Bedeutung wieder, dass die Namen zur Fluchformel beziehungsweise zum Inbegriff des Fluches werden, ohne einen ungenannten Handelnden einzuführen.
- source_word: በርገመት ዘለዓለም
  choice: zu einem ewigen Fluch
  rationale: Gibt Ziel beziehungsweise Ergebnis der Preisgabe der Namen knapp und mit dem gerichtlichen Gewicht des Ausgangstextes wieder.
- source_word: ለኵሉ ጻድቃን
  choice: für alle Gerechten
  rationale: 'Lässt die Funktion der Gerechten in der Aussage bewusst offen: Der Fluch kann ihnen als gebräuchliche Formel dienen oder in ihrem Bereich gelten.'
- source_word: ወኪያክሙ ይረግሙ ኃጥኣን
  choice: und die Sünder werden euch verfluchen
  rationale: Das selbstständige Pronomen ኪያክሙ wird im vorliegenden äthiopischen Text am natürlichsten als direktes Objekt verstanden; daher ist „euch“ vorzuziehen gegenüber einem instrumentalen „bei euch/durch euch“.
- source_word: ተኅቡረ ምስለ ኃጥኣን
  choice: ihr werdet mit den Sündern verbunden sein
  rationale: Bewahrt den konkreten Gedanken der Verbindung oder Zuordnung und bleibt zugleich offen dafür, ob Gemeinschaft, Einordnung oder gemeinsames Geschick gemeint ist.
theological_decisions:
- issue: Die Namen als ewiger Fluch
  choice: Die Namen der Angeredeten werden zum Inbegriff beziehungsweise zur Formel eines Fluches.
  alternative: Die Namen werden lediglich dem Fluch übergeben, ohne selbst als Fluchformel gebraucht zu werden.
  rationale: Die Verbindung von „Namen“ und „Fluch“ legt öffentliche Schande und exemplarisches Gericht nahe. Die Übersetzung wahrt dieses Bild, ohne die genaue Art des Gebrauchs festzulegen.
- issue: Objekt oder Mittel des Verfluchens
  choice: Die Sünder verfluchen die Angeredeten direkt.
  alternative: Die Sünder sprechen unter Berufung auf die Angeredeten Flüche aus („verfluchen bei/durch euch“).
  rationale: Die Grammatik des überlieferten Ge’ez mit ኪያክሙ als selbstständigem Akkusativpronomen stützt die direkte Objektlesart; die textgeschichtlich bekannte instrumentale Deutung bleibt in der Fußnote sichtbar.
- issue: Verbindung mit den Sündern
  choice: Die Angeredeten werden den Sündern verbunden beziehungsweise mit ihnen zusammengeordnet.
  alternative: Sie schließen sich aktiv den Sündern an oder werden rechtlich zu ihnen gerechnet.
  rationale: Der nominale Ausdruck bezeichnet zunächst Verbindung oder Gemeinschaft. Im Gerichtszusammenhang kann ein gemeinsames Geschick mitschwingen, soll aber nicht dogmatisch festgelegt werden.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem apokalyptischem Ton. Die Formulierungen bleiben verständlich und vermeiden konfessionelle Fachsprache. Die schwierigen syntaktischen und semantischen Stellen werden im Haupttext natürlich wiedergegeben und in den Fußnoten transparent offengehalten.
