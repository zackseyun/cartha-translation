base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/002.yaml
  text: And his works are before him for every year that shall be[a], and all his works are subject to him and do not change; but as God has ordained[b], so everything is done.
translation:
  language: de
  text: Und seine Werke sind vor ihm in jedem kommenden Jahr[a]; alle seine Werke dienen ihm[b] und verändern sich nicht. Sondern wie Gott es geordnet hat, so geschieht alles.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „für jedes künftige Jahr“. Die ge’ezische Wendung hebt den fortdauernden Lauf der kommenden Jahre hervor.'
    reason: lexical_alternative
  - marker: b
    text: „Dienen ihm“ kann hier auch im Sinn von „sind ihm untergeordnet“ oder „gehorchen ihm“ verstanden werden; gemeint ist die beständige Ausrichtung der Schöpfung an Gottes Ordnung.
    reason: lexical_alternative
lexical_decisions:
- source_word: ምግባሩ
  choice: seine Werke
  rationale: Das Substantiv bezeichnet Werke, Taten oder Wirken. „Werke“ bewahrt die Wiederholung des Ausgangstextes und passt zum Zusammenhang der geordneten Schöpfung.
- source_word: ቅድሜሁ
  choice: vor ihm
  rationale: Die räumlich-relationale Wendung wird direkt wiedergegeben und bewahrt das Bild, dass Gottes Werke offen vor ihm stehen.
- source_word: ለለ ዓመት ዘይከውን
  choice: in jedem Jahr, das kommen wird
  rationale: Die Formulierung bezeichnet die fortlaufende Folge künftiger Jahre. Das Deutsche macht den Zukunftsbezug ausdrücklich, ohne ihn auf ein einzelnes Jahr zu beschränken.
- source_word: ይትቀነይ ሎቱ
  choice: dienen ihm
  rationale: Das Verb kann Dienst, Unterordnung oder geordneten Gehorsam ausdrücken. „Dienen ihm“ erhält die personale Beziehung zu Gott und bleibt zugleich für die Ordnung der Schöpfung verständlich.
- source_word: ኢይትመየጥ
  choice: verändern sich nicht
  rationale: Die Wendung bezeichnet Beständigkeit und fehlende Abweichung. Die gewählte Form ist klares modernes Deutsch.
- source_word: ሠርዐ አምላክ
  choice: Gott es geordnet hat
  rationale: Das Verb kann ordnen, festsetzen oder bestimmen bedeuten. „Geordnet“ entspricht besonders gut dem Zusammenhang einer beständigen kosmischen Ordnung.
- source_word: ይትገበር ኵሉ
  choice: geschieht alles
  rationale: Die allgemeine Passivform fasst die Ausführung der von Gott gesetzten Ordnung zusammen. „Geschieht alles“ ist idiomatisch und vermeidet eine unnötige dogmatische Zuspitzung.
theological_decisions:
- issue: Bezug der wiederholten Suffixe in „seine Werke“
  choice: Die Suffixe werden auf Gott bezogen.
  alternative: Formal wäre ein Bezug auf einen anderen zuvor genannten Gegenstand denkbar.
  rationale: Die ausdrückliche Nennung Gottes im Schlusssatz sowie der Zusammenhang der unveränderlichen Schöpfungsordnung sprechen deutlich für Gott als Bezugspunkt, ohne dass zusätzliche harmonisierende Aussagen eingeführt werden.
- issue: Art der Beziehung der Werke zu Gott
  choice: „dienen ihm“
  alternative: „sind ihm untergeordnet“ oder „gehorchen ihm“
  rationale: Der Ausgangsausdruck umfasst Dienst und geordnete Unterstellung. „Dienen“ bewahrt die personale Aussage und legt sich nicht ausschließlich auf Herrschaftssprache fest; die Fußnote hält die Bedeutungsbreite offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem Satzrhythmus. Die Wiederholung von „seine Werke“ und die Spannung zwischen persönlichem Dienst und fester Schöpfungsordnung bleiben erhalten.
