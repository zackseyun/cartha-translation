base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/005/005.yaml
  text: And because of this[a], you will curse your days, and you will shorten the years of your life; and the years of your destruction will increase in an eternal curse[b], and there will be no mercy for you.
translation:
  language: de
  text: Und deshalb werdet ihr eure Tage verfluchen und die Jahre eures Lebens verkürzen[a]; die Jahre eures Verderbens werden unter einem ewigen Fluch zunehmen[b], und für euch wird es kein Erbarmen geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Verb ist eine aktive Form der zweiten Person Plural und kann auch bedeuten: „die Jahre eures Lebens zugrunde richten“ oder „verlieren“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Wendung „die Jahre eures Verderbens werden zunehmen“ ist textlich und inhaltlich schwierig. Möglich ist auch: „die Jahre eures Untergangs“ oder „die Jahre eures Zugrundegehens werden zunehmen“.'
    reason: textual_and_lexical_difficulty
lexical_decisions:
- source_word: ወበእንተዝ
  choice: Und deshalb
  rationale: Gibt den ausdrücklichen kausalen Anschluss knapp und natürlich wieder.
- source_word: መዋዕሊክሙ ትረግሙ
  choice: ihr werdet eure Tage verfluchen
  rationale: 'Bewahrt das aktive Verb in der zweiten Person Plural: Die Angesprochenen verfluchen im Gericht ihre eigenen Tage.'
- source_word: ዓመታት ሕይወትክሙ ትኃጕሉ
  choice: die Jahre eures Lebens verkürzen
  rationale: Die Verbform ist aktiv und hat die Angesprochenen zum Subjekt. „Verkürzen“ gibt die Folge für ihre Lebensjahre verständlich wieder, ohne sie fälschlich zum grammatischen Subjekt zu machen.
- source_word: ዓመታት ኀጕልክሙ
  choice: die Jahre eures Verderbens
  rationale: „Verderben“ wahrt den Zusammenhang mit dem vorangehenden Verb sowie den gerichtlichen Ton; auch „Untergang“ oder „Zugrundegehen“ sind möglich.
- source_word: ይበዝኅ
  choice: werden … zunehmen
  rationale: Entspricht dem Grundsinn „zahlreich werden, sich mehren“ und lässt das schwierige paradoxe Bild stehen.
- source_word: በርገመት ዘለዓለም
  choice: unter einem ewigen Fluch
  rationale: Natürliches Deutsch für den Zustand unter einem dauerhaften Fluch; „ewig“ erhält die apokalyptische Endgültigkeit.
- source_word: ወኢይከውነክሙ ሣህል
  choice: und für euch wird es kein Erbarmen geben
  rationale: Gibt die existentielle Verneinung klar, würdig und mit ihrer ganzen Härte wieder.
theological_decisions:
- issue: Selbstverfluchung oder Verfluchung durch andere
  choice: Die Angesprochenen verfluchen selbst ihre Tage.
  alternative: Ihre Tage werden verflucht oder andere verfluchen sie.
  rationale: Die äthiopische Verbform ist am besten als aktive zweite Person Plural zu verstehen; die Übersetzung bewahrt diese grammatische Aussage, ohne den theologischen Vorgang weiter auszudeuten.
- issue: Zeitliche Tragweite von ዘለዓለም
  choice: ewiger Fluch
  alternative: immerwährender oder äonenlanger Fluch
  rationale: Im apokalyptischen Gerichtskontext bringt „ewig“ die anhaltende Endgültigkeit am klarsten zum Ausdruck, ohne eine spätere Lehrformel einzutragen.
- issue: Das paradoxe Zunehmen der Jahre des Verderbens
  choice: Das Bild wird wörtlich als Zunahme bewahrt.
  alternative: Die Aussage glätten oder als bloße Verkürzung der Lebenszeit deuten.
  rationale: Der überlieferte Wortlaut ist schwierig; seine Spannung soll nicht stillschweigend aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knappem apokalyptischem Gerichtston. Die aktive Anrede und die schwierige Spannung zwischen verkürztem Leben und zunehmenden Jahren des Verderbens bleiben erhalten.
