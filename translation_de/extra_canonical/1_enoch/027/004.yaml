  naturalness: Der Entwurf ist überwiegend würdevoll und verständlich. Die Formulierung »so wie er ihnen zugeteilt hat« ist im modernen Standarddeutsch jedoch syntaktisch unvollständig und wirkt ohne ausgedrücktes Akkusativobjekt unnatürlich. »Entsprechend dem, was er ihnen zugeteilt hat« ist idiomatisch und lässt weiterhin offen, was zugeteilt wurde.
  terminology: »Gericht« bewahrt die juristische Mehrdeutigkeit von ኵነኔሆሙ. »Barmherzigkeit« und »segnen« sind als theologisch gewichtige Entsprechungen angemessen. Die Fußnote kann die im Deutschen weniger gewöhnliche, aber lexikalisch unmittelbare Wendung »ihn segnen« knapp als kontextuell auch »preisen« erläuterbar ausweisen.
