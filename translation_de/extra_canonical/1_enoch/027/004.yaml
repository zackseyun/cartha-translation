base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/004.yaml
  text: In the days of their judgment they will bless him for the mercy[b][a], according as he has apportioned to them.
translation:
  language: de
  text: In den Tagen ihres Gerichts werden sie ihn für die Barmherzigkeit segnen[a], entsprechend dem, was er ihnen zugeteilt hat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »werden sie ihn segnen«. Das Verb kann hier auch »werden sie ihn preisen« bedeuten.'
    reason: idiomatic_clarification
  - marker: b
    text: Was er ihnen zugeteilt hat, bleibt unausgesprochen; gemeint sein kann ein zugemessener Anteil, ein Los oder ein Anteil an Barmherzigkeit beziehungsweise Segen.
    reason: lexical_alternative
lexical_decisions:
- source_word: መዋዕለ
  choice: Tagen
  rationale: Der Plural bezeichnet hier am natürlichsten »Tage« und bewahrt die apokalyptische Zeitangabe.
- source_word: ኵነኔሆሙ
  choice: ihres Gerichts
  rationale: Die Form bezeichnet eine richterliche Entscheidung beziehungsweise ein Gericht. »Gericht« lässt offen, ob Verurteilung, Strafe oder ein günstiger Ausgang im Blick ist.
- source_word: ይባርክዎ
  choice: werden sie ihn … segnen
  rationale: 'Die Form hat ein Subjekt in der 3. Person Plural und ein Objektsuffix der 3. Person maskulin Singular: »sie werden ihn segnen«. Damit wird die ältere Deutung »er wird sie segnen« morphologisch ausgeschlossen.'
- source_word: በምሕረት
  choice: für die Barmherzigkeit
  rationale: Die Präposition በ kann hier den Anlass beziehungsweise Grund des Segnens angeben. Die substantivische Wiedergabe bewahrt das theologische Gewicht von »Barmherzigkeit«.
- source_word: በከመ
  choice: so wie
  rationale: Die vergleichende Verbindung drückt Entsprechung nach Maß oder Art aus; »so wie« ist im modernen Deutsch natürlich und bleibt nahe an der offenen Beziehung des Ausgangstextes.
- source_word: ከፈሎሙ
  choice: er ihnen zugeteilt hat
  rationale: Das Verb bezeichnet Teilen oder Zuteilen. Weil das zugeteilte Objekt im Ge’ez unausgesprochen bleibt, wird es auch im Haupttext nicht ausdrücklich festgelegt.
theological_decisions:
- issue: Gericht als Verurteilung oder als umfassender richterlicher Vorgang
  choice: Gericht
  alternative: Verurteilung; Bestrafung
  rationale: Die anschließende Rede von Barmherzigkeit und Segnen spricht gegen eine unnötige Verengung auf Strafe. »Gericht« bewahrt die gerichtliche Bildwelt und die Spannung des Textes.
- issue: Subjekt und Objekt des Segnens
  choice: Die Betroffenen segnen ihn
  alternative: Er segnet sie
  rationale: Die ge’ezische Morphologie verlangt ein plurales Subjekt und ein maskulines singularisches Objekt. Die Übersetzung folgt daher der Form und nicht der älteren, morphologisch unzutreffenden Deutung.
- issue: Unausgesprochenes Objekt des Zuteilens
  choice: Das Objekt bleibt im Haupttext offen
  alternative: Er teilte ihnen Barmherzigkeit beziehungsweise ihren Anteil zu
  rationale: Der Ausgangstext nennt nicht ausdrücklich, was zugeteilt wurde. Eine Festlegung auf Barmherzigkeit, Segen, Los oder Anteil würde die echte Mehrdeutigkeit auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das ungewöhnliche »ihn segnen« bleibt im Haupttext erhalten, weil es die direkte Bedeutung des ge’ezischen Verbs und seine Objektbeziehung wiedergibt; die idiomatischere Bedeutung »preisen« steht in der Fußnote. Die syntaktische Offenheit des letzten Satzglieds wird bewusst nicht geglättet.
