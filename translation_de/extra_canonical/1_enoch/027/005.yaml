base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/005.yaml
  text: At that time I blessed the Lord of glory[b][a], and I spoke and sang praise as is fitting for his majesty.
translation:
  language: de
  text: Zu jener Zeit segnete ich den Herrn der Herrlichkeit und verkündete seine Herrlichkeit[a] und sang Lob, wie es seiner Majestät gebührt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die vorliegende geʿezische OCR-Transkription ist an dieser Stelle unsicher; die Standardlesung lautet „und seine Herrlichkeit verkündete ich“ und wird durch die griechische Überlieferung gestützt.
    reason: Textkritische Klarstellung
lexical_decisions:
- source_word: ውእቱ፡ ጊዜ
  choice: Zu jener Zeit
  rationale: Gibt die zeitliche Übergangsformel natürlich und zugleich feierlich wieder.
- source_word: ባረክዎ
  choice: segnete ich
  rationale: Bewahrt die unmittelbare Bedeutung des Verbs und unterscheidet sie vom anschließenden Singen des Lobes.
- source_word: ለእግዚአ፡ ስብሐት
  choice: den Herrn der Herrlichkeit
  rationale: Gibt den erhöhten Gottestitel kompakt wieder; „Herrlichkeit“ deckt das Bedeutungsfeld von Ruhm, Glanz und Ehre ab.
- source_word: ተሎቱ፡ ነገርኩ
  choice: ich sprach
  rationale: Die vorliegende Transkription ist an dieser Stelle unsicher. Die knappe Wiedergabe folgt dem zuletzt revidierten Sinn, ohne ein nicht sicher bezeugtes Objekt in den Haupttext einzutragen.
- source_word: ዘመርኩ
  choice: sang Lob
  rationale: Macht den kultisch-doxologischen Zusammenhang deutlich, bleibt aber nahe am Verb „singen“.
- source_word: በከመ፡ ይደሉ
  choice: wie es … gebührt
  rationale: Eine natürliche deutsche Entsprechung für die Aussage von Angemessenheit und Würdigkeit.
- source_word: ለዕበዩ
  choice: seiner Majestät
  rationale: Trifft im Lobkontext die Bedeutung von Größe und Erhabenheit und vermeidet eine unbeholfene Wiederholung.
theological_decisions:
- issue: Wiedergabe des Gottestitels እግዚአ
  choice: Herr
  alternative: Gebieter
  rationale: „Herr“ ist im deutschen Gotteslob die natürliche und traditionsübergreifend verständliche Wiedergabe, während „Gebieter“ hier unnötig sozial oder herrschaftlich markiert wäre.
- issue: Unsichere Wortfolge vor ነገርኩ
  choice: Kein bestimmtes Objekt im Haupttext ergänzen
  alternative: „ich verkündete seine Herrlichkeit“ beziehungsweise „ich sprach von ihm“
  rationale: Die bereitgestellte Transkription und die angeführten textkritischen Angaben weisen in verschiedene Richtungen. Der Haupttext soll diese Unsicherheit nicht durch eine unbelegte Festlegung verdecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht feierlichem doxologischem Ton. Der syntaktische Parallelismus des Ausgangstextes bleibt erhalten; die textliche Unsicherheit wird transparent in der Fußnote ausgewiesen.
