base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/001.yaml
  text: At that time I said[a], “For what reason is this blessed land, all of it full of trees[b], and this accursed valley in their midst?”
translation:
  language: de
  text: 'Da sagte ich: „Warum sind dieses gesegnete Land, ganz mit Bäumen bedeckt, und dieses verfluchte Tal mitten darin?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ውእቱ ጊዜ
  choice: Da
  rationale: Gibt die zeitliche Erzählformel im modernen Deutschen knapp und natürlich wieder.
- source_word: እቤ
  choice: sagte ich
  rationale: Bleibt bei der allgemeinen Redeeinleitung des Ge’ez; die anschließende direkte Frage macht den fragenden Sinn deutlich.
- source_word: በእንተ ምንት
  choice: Warum
  rationale: Gibt die Frage nach Grund oder Zweck idiomatisch und ohne unnötige Schwere wieder.
- source_word: ዛቲ ምድር ቡርክት
  choice: dieses Land gesegnet
  rationale: Bewahrt den lokalen Landschaftsbezug und den wertenden Gegensatz zum verfluchten Tal.
- source_word: ወኵለንታሃ ምልእት ዕፀወ ወዛ ቈላ
  choice: und ganz mit Bäumen bedeckt
  rationale: Bewahrt die koordinierende Struktur und den Sinn üppigen Baumwuchses, ohne die textlich schwierige Vegetationsformel zu überspezifizieren.
- source_word: ርጉምት
  choice: verfluchte
  rationale: Erhält den bewusst theologischen und gerichtlichen Gegensatz zu „gesegnet“.
- source_word: ማእከሎሙ
  choice: mitten darin
  rationale: Bezeichnet die zentrale Lage des Tales innerhalb der beschriebenen Landschaft natürlich auf Deutsch.
theological_decisions:
- issue: Wertender Gegensatz zwischen Land und Tal
  choice: gesegnet / verflucht
  alternative: fruchtbar / unfruchtbar
  rationale: Der Text zeichnet einen sakral-moralischen Gegensatz und nicht lediglich einen Unterschied der Bodenbeschaffenheit.
- issue: Verhältnis der beiden Landschaftselemente in der Frage
  choice: während
  alternative: und
  rationale: „Während“ macht den im Ausgangstext angelegten Gegensatz im Deutschen verständlich, ohne seine Ursache oder theologische Auflösung vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Frage und der apokalyptische Gegensatz bleiben erhalten; schwerfällige Wörtlichkeit und konfessionelle Deutung werden vermieden.
