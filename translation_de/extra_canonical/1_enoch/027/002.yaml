- from: 'Zu jener Zeit antwortete mir Uriel, einer der heiligen Engel, der bei mir war, und sagte zu mir: „Dieses verfluchte Tal ist für die bestimmt, die auf ewig verflucht sind. Hier werden alle versammelt, die mit ihrem Mund ungehörige Worte gegen den Herrn reden[a] und über seine Herrlichkeit empörende Dinge sagen[b]. Hier wird man sie zusammenbringen, und hier wird der Ort ihres Gerichts sein.“'
  to: 'Zu jener Zeit antwortete mir Uriel, einer der heiligen Engel, der bei mir war, und sagte zu mir: „Dieses verfluchte Tal ist für die, die auf ewig verflucht sind. Hier werden alle versammelt, die mit ihrem Mund ungehörige Worte gegen den Herrn reden[a] und über seine Herrlichkeit empörende Dinge sagen[b]. Hier wird man sie zusammenbringen, und hier wird ihr Gericht sein.“'
  rationale: Die Revision entfernt zwei nicht notwendige Ausdeutungen und folgt dadurch enger dem ge'ezischen Wortlaut, ohne die apokalyptische Gerichtsszene oder die kausative Nuance des Zusammenbringens zu verändern. Die vorhandenen Fußnotenanker und ihre lexikalische Funktion bleiben erhalten.
