base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/002.yaml
  text: At that time Uriel[a], one of the holy angels who was with me, answered me and said to me, “This accursed valley is for those who are accursed forever. Here all those will be gathered who speak with their mouths improper words against the Lord, and who utter harsh things concerning his glory. Here they will be gathered[b], and here will be their place of judgment.”
translation:
  language: de
  text: 'Zu jener Zeit antwortete mir Uriel, einer der heiligen Engel, der bei mir war, und sagte zu mir: „Dieses verfluchte Tal ist für die, die auf ewig verflucht sind. Hier werden alle versammelt, die mit ihrem Mund ungehörige Worte gegen den Herrn reden[a] und über seine Herrlichkeit empörende Dinge sagen[b]. Hier wird man sie zusammenbringen, und hier wird ihr Gericht sein.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „Worte, die nicht angemessen sind“; auch „unpassende Worte“ oder „Worte, die nicht recht sind“.'
    reason: lexical_alternative
  - marker: b
    text: Der Ausdruck kann empörende, schockierende, harte oder vermessene Rede über die Herrlichkeit des Herrn bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ
  choice: antwortete mir
  rationale: Bewahrt den gewöhnlichen Sinn des Verbs und den Zusammenhang eines visionären Dialogs.
- source_word: ቅዱሳን መላእክት
  choice: heilige Engel
  rationale: Entspricht der etablierten apokalyptischen Bezeichnung in natürlichem biblischem Deutsch.
- source_word: ዛቈላ
  choice: Tal
  rationale: Gibt die visionäre Topografie allgemein und ohne unnötige Verengung auf Schlucht oder Klamm wieder.
- source_word: ርጉምት
  choice: verfluchte
  rationale: Kennzeichnet das Tal als unter einem Fluch stehend und erhält den ernsten Gerichtston.
- source_word: ለርጉማን እስከ ለዓለም
  choice: für die bestimmt, die auf ewig verflucht sind
  rationale: Macht die Bestimmung des Tals und die zeitliche Endgültigkeit in idiomatischem Deutsch deutlich.
- source_word: ይትጋብኡ
  choice: werden versammelt
  rationale: Der passive beziehungsweise reflexive Sinn passt zum endzeitlichen Zusammenführen zum Gericht.
- source_word: በአፉሆሙ
  choice: mit ihrem Mund
  rationale: Erhält das konkrete Bild des Mundes als Werkzeug der verwerflichen Rede.
- source_word: ላዕለ እግዚአብሔር
  choice: gegen den Herrn
  rationale: Der Zusammenhang legt eine feindselige, nicht bloß thematische Beziehung der Rede zum Herrn nahe.
- source_word: ቃለ ዘኢይደሉ
  choice: ungehörige Worte
  rationale: Bezeichnet Worte, die nicht angemessen oder richtig sind, ohne die Verfehlung auf einen späteren Fachbegriff festzulegen.
- source_word: ስብሐቲ ዚአሁ
  choice: seine Herrlichkeit
  rationale: Gibt hier am transparentesten die göttliche Herrlichkeit beziehungsweise Majestät wieder.
- source_word: ይትናገሩ ዕፁብተ
  choice: empörende Dinge sagen
  rationale: Vermittelt die schockierende, anstößige oder vermessene Kraft des Ausdrucks natürlicher als eine wörtliche Wiedergabe mit „harte Dinge“.
- source_word: ያስተጋብእዎሙ
  choice: wird man sie zusammenbringen
  rationale: 'Wahrt gegenüber dem vorherigen Passiv die mögliche kausative Nuance: Andere bringen die Betreffenden an diesem Ort zusammen.'
- source_word: ምኵናኒሆሙ
  choice: Ort ihres Gerichts
  rationale: Im Zusammenspiel mit dem wiederholten „hier“ verbindet die Formulierung den geografischen Ort mit dem gerichtlichen Geschehen.
theological_decisions:
- issue: Art der verurteilten Rede
  choice: Feindselige, ungehörige und empörende Rede gegen den Herrn und über seine Herrlichkeit, ohne sie ausschließlich als einen späteren technischen Tatbestand zu bezeichnen.
  alternative: Ausdrücklich und ausschließlich „Gotteslästerung“ oder lediglich allgemeine böse Rede.
  rationale: Der ge'ezische Text beschreibt die Rede selbst, legt sie aber nicht auf eine spätere dogmatische oder rechtliche Kategorie fest.
- issue: Bedeutung des abschließenden Gerichtssatzes
  choice: Das Tal ist der Ort, an dem die Verfluchten zusammengebracht werden und ihr Gericht stattfindet.
  alternative: Das Tal selbst ist ihre Verdammung oder die Aussage meint nur abstrakt das Gericht ohne räumlichen Bezug.
  rationale: Das wiederholte „hier“ hebt die visionäre Örtlichkeit hervor, während das Gericht ausdrücklich als ihr dortiges Geschick bezeichnet wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit apokalyptischem Gerichtston. Die Wiederholung von „hier“ und das konkrete Bild „mit ihrem Mund“ bleiben erhalten. Das zweimalige „sagte zu mir“ folgt bewusst der formalen Wiederholung des Ausgangstextes; die Fußnoten markieren echte lexikalische Spannweiten.
