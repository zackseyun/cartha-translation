base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/027/003.yaml
  text: In the latter days this will become for them a spectacle of righteous judgment in the presence of the righteous forever[a]; all the days here the wise will bless the Lord of glory[d][c][b], the eternal King.
translation:
  language: de
  text: 'In den letzten Tagen wird dies für sie zu einem sichtbaren Zeichen gerechten Gerichts vor den Gerechten, für immer[a]. Hier werden die Barmherzigen ihn alle Tage preisen: den Herrn der Herrlichkeit, den ewigen König.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Für immer“ steht in diesem Textzeugen in Klammern und ist daher textlich unsicher. Die Worte können zu „vor den Gerechten“ gehören oder eine abweichende Lesart widerspiegeln.
    reason: textual_variant
lexical_decisions:
- source_word: በዳኃሪ መዋዕል
  choice: In den letzten Tagen
  rationale: Bewahrt den zukünftigen, wahrscheinlich endzeitlichen Zeithorizont der Wendung in natürlichem apokalyptischem Deutsch.
- source_word: ይከውን ላዕሌሆሙ
  choice: wird dies für sie ... werden
  rationale: Gibt das futurische Werden und die relationale Bedeutung der Präposition wieder, ohne sie unnötig räumlich festzulegen.
- source_word: አርአያ
  choice: ein sichtbares Zeichen
  rationale: Der Ausdruck kann Erscheinung, Zeichen, Beispiel oder Schaustück bedeuten. Diese Wiedergabe erhält sowohl den visuellen als auch den zeichenhaften Sinn und vermeidet den im Deutschen leicht abwertenden Beiklang von „Spektakel“.
- source_word: ኵነኔ ዘበ ጽድቅ
  choice: gerechten Gerichts
  rationale: Gibt die enge Verbindung von Gericht und Gerechtigkeit knapp und würdig wieder.
- source_word: በቅድመ ጻድቃን
  choice: vor den Gerechten
  rationale: Bewahrt die räumliche und öffentliche Aussage des äthiopischen Ausdrucks unmittelbar.
- source_word: ለዓለም
  choice: für immer
  rationale: Die übliche temporale Bedeutung wird im Text wiedergegeben; da das Wort im Zeugen eingeklammert ist und seine syntaktische Zuordnung unsicher bleibt, wird dies in einer Fußnote vermerkt.
- source_word: ኵሎ መዋዕለ ዝየ
  choice: Alle Tage hier
  rationale: ዝየ bedeutet hier „hier“ und hält den räumlichen Bezug der Szene fest; eine Deutung als „dieses Zeitalter“ wird nicht in den Text eingetragen.
- source_word: ምሑራን
  choice: die Weisen
  rationale: Im vorliegenden Editions- und Konsultationszusammenhang wird die überlieferte Deutung als „Weise/Unterwiesene“ beibehalten; die graphisch und etymologisch mögliche Lesart „die Barmherzigen“ beziehungsweise „die, denen Erbarmen widerfuhr“ wird wegen der mittleren Quellensicherheit ausdrücklich vermerkt.
- source_word: ይባርክዎ
  choice: werden ... preisen
  rationale: Beim Segnen Gottes bezeichnet das Verb lobendes Preisen; dies ist im modernen Deutschen natürlicher als „Gott segnen“.
- source_word: ለእግዚአ ስብሐት
  choice: den Herrn der Herrlichkeit
  rationale: Gibt den erhabenen göttlichen Titel direkt wieder, ohne ihn an eine andere Formel anzugleichen.
- source_word: ንጉሥ ዘለዓለም
  choice: den ewigen König
  rationale: Bewahrt sowohl das göttliche Königtum als auch dessen ewigen Charakter in natürlichem Deutsch.
theological_decisions:
- issue: Wiedergabe der göttlichen Titel ohne Harmonisierung
  choice: den Herrn der Herrlichkeit, den ewigen König
  alternative: den Herrn der Majestät, den König in Ewigkeit
  rationale: Die beiden erhabenen Titel bleiben als Apposition erhalten; keine spätere kanonische Formulierung oder konfessionelle Deutung wird in den Vers eingetragen.
- issue: Identität der als ምሑራን bezeichneten Gruppe
  choice: die Weisen
  alternative: die Barmherzigen / die, denen Erbarmen widerfuhr
  rationale: Die Überlieferungs- und Revisionsangaben widersprechen sich bei der lexikalischen Analyse. Der Haupttext folgt der zuletzt geprüften Lesart, während die echte Unsicherheit in einer Fußnote offengelegt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptischem Klang. Die Satzfolge bleibt nahe am Ge'ez; „sichtbares Zeichen“ vermeidet den negativen modernen Beiklang von „Spektakel“. Sämtliche Fußnotenmarker stehen im Haupttext.
