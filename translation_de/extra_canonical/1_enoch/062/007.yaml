base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/007.yaml
  text: For from the beginning the Son of Man was hidden[a], and the Most High kept him in the presence of his power[b], and revealed him to the chosen ones.
translation:
  language: de
  text: Denn von Anfang an war der Menschensohn verborgen, und der Höchste bewahrte ihn in der Gegenwart seiner Macht[a] und offenbarte ihn den Erwählten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »vor seiner Macht«. Oder: »durch seine Macht«. Die ge’ezische Wendung ist schwierig; die Übersetzung bewahrt ihre räumliche Bildsprache, ohne anzudeuten, der Menschensohn sei vor der Macht des Höchsten geschützt worden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: Denn
  rationale: Leitet die Begründung oder Erläuterung des vorher Gesagten ein und bewahrt die verbindende Kraft des Ausdrucks.
- source_word: እምቅድሙ
  choice: von Anfang an
  rationale: Der Ausdruck ist hier temporal zu verstehen; diese Wiedergabe bewahrt das Motiv einer anfänglichen Verborgenheit.
- source_word: ኅቡእ ኮነ
  choice: war verborgen
  rationale: Gibt den Zustand des Verborgenseins natürlich wieder und vermeidet eine unnötige Aussage darüber, wann dieser Zustand eintrat.
- source_word: ወልደ እጓለ እመሕያው
  choice: der Menschensohn
  rationale: Die feste Wendung bezeichnet in den Bilderreden eine erkennbare apokalyptische Gestalt. Die deutsche Titelbildung gibt diesen Gebrauch wieder, ohne spätere christologische Deutungen hinzuzufügen.
- source_word: ዐቀቦ
  choice: bewahrte ihn
  rationale: Deckt das Bedeutungsspektrum von bewahren, erhalten und hüten ab und passt zum Motiv der Zurückhaltung bis zur Offenbarung.
- source_word: ልዑል
  choice: der Höchste
  rationale: Natürliche und traditionsübergreifend verständliche deutsche Wiedergabe des göttlichen Titels.
- source_word: በቅድመ ኃይሉ
  choice: vor seiner Macht
  rationale: Bewahrt die schwierige räumliche Bildsprache und das konkrete Substantiv »Macht«, statt die Wendung interpretierend zu glätten.
- source_word: ከሠቶ
  choice: offenbarte ihn
  rationale: Bildet den beabsichtigten Gegensatz zur vorherigen Verborgenheit und wahrt das apokalyptische Offenbarungsmotiv.
- source_word: ለኅሩያን
  choice: den Erwählten
  rationale: Klare, geläufige substantivische Wiedergabe für die erwählte Gemeinschaft.
theological_decisions:
- issue: Titelartige Wiedergabe von ወልደ እጓለ እመሕያው
  choice: der Menschensohn
  alternative: der Sohn des Menschen; der Sohn der Nachkommen der Lebenden
  rationale: Im örtlichen Kontext fungiert die Wendung als Bezeichnung einer apokalyptischen Gestalt. »Menschensohn« wahrt diesen Titelgebrauch, ohne ihn ausdrücklich mit einer späteren Lehrtradition gleichzusetzen.
- issue: Vorherige Verborgenheit und spätere Offenbarung
  choice: von Anfang an war ... verborgen ... bewahrte ihn ... offenbarte ihn
  alternative: war von Ewigkeit her verborgen; wurde vom Höchsten vorbehalten
  rationale: Die Formulierung lässt das Verhältnis von anfänglicher Verborgenheit, Bewahrung und Offenbarung stehen, ohne daraus weitergehende metaphysische Aussagen abzuleiten.
- issue: Deutung der schwierigen Wendung በቅድመ ኃይሉ
  choice: vor seiner Macht
  alternative: in der Gegenwart seiner Macht; durch seine Macht
  rationale: Die formal nahe Wiedergabe bewahrt die echte sprachliche und theologische Spannung, statt das Verhältnis zwischen dem Höchsten, dem Menschensohn und der Macht eindeutig festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptischem Klang. Die schwer verständliche Wendung »vor seiner Macht« bleibt im Haupttext bildhaft erhalten und wird in der Fußnote erläutert.
