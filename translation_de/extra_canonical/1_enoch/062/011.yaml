  text: And he will deliver them over to the angels for punishment[a][b].
translation:
  language: de
  text: Und er wird sie den Engeln zur Bestrafung übergeben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und er wird sie den Engeln mit einer Strafe übergeben.“ Die ge''ezische Konstruktion kann „zur Bestrafung“ als Zweck oder Ergebnis bezeichnen, aber auch instrumentaler als „mit einer Strafe“ verstanden werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይሜጥዎሙ
  choice: Und er wird sie … übergeben
  rationale: Das Verb bezeichnet hier die Übergabe von Personen in die Gewalt oder Obhut anderer. „Übergeben“ bewahrt den gerichtlichen Charakter; die vorangestellte Konjunktion wird mit „Und“ wiedergegeben.
- source_word: ለመላእክት
  choice: den Engeln
  rationale: Die Präposition kennzeichnet den Empfänger der Übergabe. Der deutsche Dativ gibt dies natürlich und direkt wieder, ohne eine besondere Engelgruppe anzunehmen.
- source_word: በመቅሠፍት
  choice: zur Bestrafung
  rationale: Das Substantiv kann Strafe, Züchtigung oder Geißelung bezeichnen. „Zur Bestrafung“ passt zum gerichtlichen Zusammenhang, ohne eine bestimmte körperliche Qual näher festzulegen; die mögliche instrumentale Deutung wird in der Fußnote bewahrt.
theological_decisions:
- issue: Identität und Aufgabe der Engel
  choice: Die Engel bleiben unqualifiziert und erscheinen als Empfänger beziehungsweise Vollstrecker im Strafgericht.
  alternative: ausdrücklich „Strafengel“ oder lediglich allgemeine himmlische Wesen
  rationale: Der ge'ezische Text sagt nur „die Engel“. Die Übersetzung fügt daher keine besondere Engelklasse ein; ihre strafende Funktion ergibt sich allein aus dem Zusammenhang.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur des ge'ezischen Ausgangstextes bleibt erhalten. Übersetzt wird ausschließlich der vorgelegte, validierte Versbestand; die in einer früheren Revision ergänzte Fortsetzung ist in diesem Ausgangstext nicht enthalten.
