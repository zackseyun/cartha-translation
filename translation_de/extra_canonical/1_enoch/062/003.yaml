base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/003.yaml
  text: And in that day all the kings and the mighty and the exalted[a], and those who possess the earth, shall stand up, and they shall see and recognize that he sits on the throne of his glory; and righteousness shall be judged before him[b], and no lying word shall be spoken before him.
translation:
  language: de
  text: Und an jenem Tag werden alle Könige, die Mächtigen und die Erhabenen sowie jene, die die Erde besitzen,[a] aufstehen. Sie werden sehen und erkennen, dass er auf dem Thron seiner Herrlichkeit sitzt. Und die Gerechtigkeit wird vor ihm gerichtet werden,[b] und kein lügnerisches Wort wird vor ihm gesprochen werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „jene, die die Erde innehaben“ beziehungsweise „jene, die über das Land oder die Welt herrschen“. Das ge’ezische Verb kann festhalten, besitzen oder Kontrolle ausüben bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Die Aussage „die Gerechtigkeit wird vor ihm gerichtet werden“ ist im Äthiopischen textlich und syntaktisch schwierig. Die Übersetzung bewahrt den gerichtlichen Sinn der Formulierung, statt sie zu einer geläufigeren Aussage zu glätten.
    reason: textual_variant
lexical_decisions:
- source_word: ወይቀውሙ
  choice: werden ... aufstehen
  rationale: Das Verb bezeichnet ein Aufstehen oder Sich-Erheben. „Aufstehen“ bewahrt das körperliche, gerichtshofartige Bild, ohne eine Auferstehung hineinzulesen.
- source_word: በይእቲ ዕለት
  choice: an jenem Tag
  rationale: Natürliche deutsche Wiedergabe der prophetisch-apokalyptischen Zeitformel.
- source_word: ኵሎሙ ነገሥት ወዐዚዛን ወልዑላን
  choice: alle Könige, die Mächtigen und die Erhabenen
  rationale: Die drei Gruppen politisch-sozialer Größen bleiben unterscheidbar; „Mächtige“ und „Erhabene“ erhalten die gesteigerte apokalyptische Rhetorik.
- source_word: ወእለ ይእኅዝዋ ለምድር
  choice: sowie jene, die die Erde in ihrer Gewalt haben
  rationale: Die Formulierung gibt Besitz, Festhalten und Herrschaft wieder, ohne die Bedeutung auf Grundeigentümer oder formelle Regenten zu verengen.
- source_word: ወይሬእይዎ ወያአምርዎ
  choice: sie werden sehen und erkennen
  rationale: Das Wortpaar verbindet Wahrnehmung mit Erkenntnis beziehungsweise Anerkennung.
- source_word: ከመ ይነብር ዲበ መንበረ ስብሐቲሁ
  choice: dass er auf dem Thron seiner Herrlichkeit sitzt
  rationale: Bewahrt das Thronbild in natürlichem, würdigem Deutsch.
- source_word: ወጽድቅ ቅድሜሁ ይትኴነን
  choice: Und die Gerechtigkeit wird vor ihm gerichtet werden
  rationale: 'Die schwierige Formulierung wird nicht geglättet: Das Substantiv bleibt „Gerechtigkeit“, und der gerichtliche Sinn des Verbs bleibt erkennbar.'
- source_word: ወነገረ በከ አልቦ ዘይትበሀል በቅድሜሁ
  choice: und kein lügnerisches Wort wird vor ihm gesprochen werden
  rationale: Gibt die Verneinung falscher oder trügerischer Rede in der feierlichen Gerichtsszene wieder.
theological_decisions:
- issue: Identität der thronenden Gestalt
  choice: Die Gestalt wird nur mit „er“ bezeichnet.
  alternative: Sie ausdrücklich als „Menschensohn“ oder „Herrn der Geister“ identifizieren.
  rationale: Der Vers selbst verwendet lediglich ein Pronomen. Die lokale Mehrdeutigkeit wird nicht aus dem weiteren Kontext aufgelöst.
- issue: Bedeutung derer, die die Erde festhalten oder besitzen
  choice: „jene, die die Erde in ihrer Gewalt haben“ bleibt politisch-kosmisch weit.
  alternative: „Grundbesitzer“, „Besitzer des Landes“ oder „Herrscher der Welt“.
  rationale: Der äthiopische Ausdruck kann Besitz, Festhalten und Machtausübung bezeichnen; die breite Bedeutung soll erhalten bleiben.
- issue: Gericht über die Gerechtigkeit
  choice: Die syntaktisch schwierige Aussage wird wörtlich-nahe als passiver Gerichtsvorgang bewahrt.
  alternative: „Ein gerechtes Gericht ergeht vor ihm“ oder „Gerechtigkeit wird vor ihm aufgerichtet“.
  rationale: Eine Glättung würde die überlieferte Spannung beseitigen und möglicherweise eine nicht eindeutige Auslegung festschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptisch-feierlichem Ton. Kurze Satzglieder verbessern die Verständlichkeit; ungewöhnliche Formulierungen werden dort bewahrt, wo sie eine echte Schwierigkeit oder Mehrdeutigkeit des Ge’ez widerspiegeln.
