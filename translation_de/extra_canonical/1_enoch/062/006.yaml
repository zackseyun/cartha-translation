base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/006.yaml
  text: And the kings and the mighty and all who possess the earth shall bless and praise and exalt him who rules over all that is hidden[a][b].
translation:
  language: de
  text: Und die Könige und die Mächtigen und alle, die die Erde besitzen[a], werden den segnen, preisen und hoch erheben, der über alles Verborgene herrscht[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alle, die die Erde in ihrer Gewalt haben“. Das ge’ezische Verb kann „halten“ oder „besitzen“ bedeuten; im Zusammenhang sind wahrscheinlich Menschen gemeint, die irdische Macht ausüben.'
    reason: lexical_alternative
  - marker: b
    text: Die beschreibende Formulierung „der über alles Verborgene herrscht“ bleibt stehen, weil der Vers dieser Gestalt keinen ausdrücklichen Titel gibt.
    reason: alternative_reading
lexical_decisions:
- source_word: ይባርክዎ
  choice: werden den segnen
  rationale: Der Imperfekt mit vorangestellter Konjunktion setzt die zukünftige beziehungsweise visionäre Aussage fort. „Segnen“ bewahrt den feierlich-kultischen Gehalt.
- source_word: ይሴብሕዎ
  choice: preisen
  rationale: Das Verb bezeichnet lobende, insbesondere doxologische Anerkennung; „preisen“ entspricht dem würdevollen Kontext.
- source_word: የልዕልዎ
  choice: hoch erheben
  rationale: Die Wendung gibt das Erhöhen beziehungsweise Verherrlichen wieder und ist im modernen Deutschen verständlicher als das substantivisch oder altertümlich wirkende „exaltieren“.
- source_word: ነገሥት
  choice: die Könige
  rationale: Die konkrete politische Bezeichnung wird beibehalten und nicht zum allgemeineren „Herrscher“ abgeschwächt.
- source_word: መዛዝእት
  choice: die Mächtigen
  rationale: Im Zusammenhang bezeichnet das Wort einflussreiche oder machtvolle Personen neben den Königen. „Die Mächtigen“ wahrt diese gesellschaftlich-politische Bedeutung.
- source_word: ኵሎሙ እለ ይእሕዝዋ ለምድር
  choice: alle, die die Erde besitzen
  rationale: Das Verb kann „halten“ oder „besitzen“ bedeuten. „Die Erde besitzen“ passt zum Zusammenhang irdischer Macht, ohne die möglicherweise vorhandene Nuance gewaltsamer Besitznahme in den Haupttext einzutragen.
- source_word: ለዘይመልክ
  choice: der ... herrscht
  rationale: Die relative Konstruktion bezeichnet eine einzelne Gestalt durch ihr Herrschen, ohne ihr einen ausdrücklichen Titel zu geben.
- source_word: ኵሎ ዘኅቡእ
  choice: über alles Verborgene
  rationale: Die breite Formulierung wird nicht auf „Geheimnisse“ verengt, sondern umfasst alles Verdeckte oder Verborgene.
theological_decisions:
- issue: Identität der einzelnen Gestalt, die über alles Verborgene herrscht
  choice: Die Gestalt wird im Haupttext ausschließlich durch den Relativsatz beschrieben.
  alternative: Sie ausdrücklich als „Herr der Geister“, „Menschensohn/Erwählter“ oder als Gott zu benennen.
  rationale: Der ge’ezische Vers verwendet keinen ausdrücklichen Titel. Eine nähere Identifizierung würde die im Wortlaut bestehende theologische Offenheit harmonisierend auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit apokalyptisch-feierlichem Ton. Die dreigliedrige Folge „segnen, preisen und hoch erheben“ bildet die ge’ezische Reihung ab; die Identität der angesprochenen Gestalt wird nicht über den Wortlaut hinaus festgelegt.
