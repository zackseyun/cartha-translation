    rationale: Das Verb bezeichnet Hinzufügung/Zunahme. „Ihren Gesichtern hinzugefügt werden“ gibt dies präzise wieder, ohne die Bedeutung zu „bedecken“ oder „sich auftürmen“ zu verschieben.
