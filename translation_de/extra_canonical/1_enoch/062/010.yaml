revisions:
- from: Und der Herr der Geister wird sie forttreiben, sodass sie eilig von seinem Angesicht[a] weggehen. Ihr Gesicht wird sich mit Scham füllen, und Finsternis wird zu ihrem Gesicht hinzukommen.[b]
  to: Und der Herr der Geister wird sie forttreiben, sodass sie eilen und von vor seinem Angesicht weggehen.[a] Ihre Gesichter werden mit Scham erfüllt werden, und Finsternis wird ihren Gesichtern hinzugefügt werden.[b]
  rationale: Die Revision stellt die im geʿezischen Text ausdrücklich genannte räumlich-höfische Formel „von vor seinem Angesicht“ wieder her und bewahrt die zweimalige Pluralform „Gesichter“. Die Schlussaussage bleibt bei der lexikalisch belegten Addition bzw. Zunahme der Finsternis und vermeidet die semantisch abweichende Vorstellung eines Bedeckens.
