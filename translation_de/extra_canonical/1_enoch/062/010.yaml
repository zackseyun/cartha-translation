    rationale: Der geʿezische Ausdruck እምቅድመ ገጹ bedeutet wörtlich „von vor seinem Angesicht“. Die Fußnote nennt dies zwar, doch der Haupttext glättet es zu „von seinem Angesicht weg“.
  - severity: medium
    issue: „Ihr Gesicht“ bzw. „ihrem Gesicht“ steht im Singular.
    rationale: Der Ausgangstext hat zweimal „ihre Gesichter“. Eine distributive Singularauffassung ist möglich, aber im modernen Deutschen weder erforderlich noch hier stilistisch vorteilhaft; der Plural bewahrt die wiederholte Bildlichkeit des Ausgangstextes.
  - severity: low
