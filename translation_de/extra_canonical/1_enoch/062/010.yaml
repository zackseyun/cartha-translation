  source_fidelity: 'Die Grundzüge sind zutreffend: Der feste Titel „Herr der Geister“, die bewahrte Angesichtsmetaphorik, die erzwungene Eile und die additive Bedeutung von ተወሰከ sind angemessen wiedergegeben. Allerdings fehlt im Übersetzungstext bei „von seinem Angesicht“ das ausdrücklich vorhandene „vor“, und die pluralischen „Gesichter“ werden im Deutschen ohne zwingenden Grund singularisch wiedergegeben.'
  naturalness: „Finsternis wird zu ihrem Gesicht hinzukommen“ ist im Deutschen wegen des Singulars und der Konstruktion mit „zu“ unnötig sperrig. „Finsternis wird ihren Gesichtern hinzugefügt werden“ ist quellentreuer und verständlich, wenn auch bewusst bildhaft. „Sie eilen“ ist für den gerichtlichen, gehobenen Registerton natürlich.
  terminology: „Herr der Geister“ und „Angesicht“ sind passend. „Scham“ gibt ኃፍረተ angemessen wieder. Die pluralische Bildsprache („ihre Gesichter“) sollte auch im Deutschen erhalten bleiben.
