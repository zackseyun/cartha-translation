base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/010.yaml
  text: And the Lord of Spirits will drive them so that they hasten and go out from before his face[a], and their faces will be filled with shame[c][b], and darkness will be added to their faces.
translation:
  language: de
  text: Und der Herr der Geister wird sie forttreiben, sodass sie eilen und von vor seinem Angesicht weggehen.[a] Ihre Gesichter werden mit Scham erfüllt werden, und Finsternis wird ihren Gesichtern hinzugefügt werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aus seiner Gegenwart fortgehen“. Wörtlich: „von vor seinem Angesicht weggehen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Finsternis wird ihren Gesichtern hinzugefügt werden.“ Das Bild bezeichnet eine weitere Steigerung ihrer sichtbaren Schmach.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይጐጕኦሙ
  choice: wird sie forttreiben
  rationale: Das Verb bezeichnet ein kraftvolles Antreiben oder Vertreiben. „Forttreiben“ bewahrt sowohl den Zwang als auch die vom folgenden Weggehen bestimmte Bewegungsrichtung, ohne zusätzlich Angst als Motiv einzutragen.
- source_word: እግዚአ መናፍስት
  choice: der Herr der Geister
  rationale: Die feste apokalyptische Gottesbezeichnung wird im Deutschen wörtlich und verständlich wiedergegeben.
- source_word: ከመ ይፍጥኑ
  choice: sodass sie eilig
  rationale: Die Formulierung erhält den konsekutiv-finalen Zusammenhang und die erzwungene Eile, klingt aber natürlicher als „damit sie sich beeilen“.
- source_word: ወይፃኡ እምቅድመ ገጹ
  choice: von seinem Angesicht weggehen
  rationale: „Angesicht“ bewahrt das ausdrücklich vorhandene Bild des göttlichen Gesichts und die gerichtliche Szene; „aus seiner Gegenwart fortgehen“ wäre eine glättende Alternative.
- source_word: ገጾሙ ይመልእ ኃፍረተ
  choice: Ihr Gesicht wird sich mit Scham füllen
  rationale: Die Übersetzung hält am Bild des Gesichts fest und gibt die öffentliche Beschämung unmittelbar wieder. Der Singular „Gesicht“ folgt der distributiven Verwendung des geʿezischen Ausdrucks für die Gesichter der Gruppe.
- source_word: ጽልመት ይትዌሰክ ገጾሙ
  choice: Finsternis wird zu ihrem Gesicht hinzukommen
  rationale: Das Verb bedeutet „hinzugefügt werden, zunehmen“. „Hinzukommen“ erhält den Gedanken der Steigerung, ohne die nicht belegte Vorstellung des Bedeckens oder Auftürmens einzuführen.
theological_decisions:
- issue: Anthropomorphe Rede von Gottes Gegenwart
  choice: von seinem Angesicht weggehen
  alternative: aus seiner Gegenwart fortgehen
  rationale: Der geʿezische Text nennt ausdrücklich sein „Gesicht“. Die konkrete apokalyptische und höfisch-gerichtliche Bildsprache wird bewahrt, ohne sie zu einer abstrakten Aussage über Gegenwart umzudeuten.
- issue: Bild der zunehmenden gerichtlichen Finsternis
  choice: Finsternis wird zu ihrem Gesicht hinzukommen
  alternative: Finsternis wird ihr Gesicht bedecken
  rationale: Die gewählte Fassung lässt die Finsternis zur bereits genannten Scham hinzutreten. „Bedecken“ wäre idiomatischer, verschiebt die Aussage jedoch von Addition beziehungsweise Zunahme zu Verhüllung.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit bewahrter apokalyptischer Bildlichkeit. „Angesicht“ ist bewusst gehoben, da „Gesicht“ in der Gottesbezeichnung den höfisch-gerichtlichen Klang abschwächen würde; bei den Gerichteten steht dagegen das natürliche „Gesicht“. Die Satzteilung verbessert die Lesbarkeit, ohne die Abfolge der geʿezischen Aussagen zu verändern.
