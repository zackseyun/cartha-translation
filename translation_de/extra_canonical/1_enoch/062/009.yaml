base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/009.yaml
  text: And all the kings and the mighty and the exalted[a], and those who rule the dry land, shall fall down before him on their faces, and they shall bow down and set their hope on that Son of Man[c][b], and they shall petition him and seek mercy from him.
translation:
  language: de
  text: Und alle Könige und Mächtigen und Hochgestellten sowie jene, die über das Festland herrschen,[a] werden vor ihm mit dem Gesicht zur Erde fallen. Sie werden sich niederwerfen[b] und ihre Hoffnung auf jenen Menschensohn setzen; sie werden ihn bitten und ihn um Erbarmen bitten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „jene, die über das trockene Land herrschen“; gemeint sein kann auch: „jene, die über das Land herrschen“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „huldigen“; stärker verstanden auch: „anbeten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይወድቁ
  choice: werden … fallen
  rationale: Bewahrt die konkrete, eindringliche Bewegung des Fallens; zusammen mit „auf ihr Angesicht“ wird die Niederwerfung deutlich.
- source_word: ነገሥት
  choice: Könige
  rationale: Gibt die konkrete politische Rangbezeichnung unmittelbar wieder.
- source_word: መዛዝእት
  choice: Mächtigen
  rationale: Bezeichnet allgemein Personen mit großer Macht oder Autorität und passt zum gehobenen Register.
- source_word: ልዑላን
  choice: Hochgestellten
  rationale: Drückt hohen gesellschaftlichen Rang natürlich aus, ohne den Begriff unnötig zu theologisieren.
- source_word: እለ ይመልከዋ ለየብስ
  choice: jene, die über das Festland herrschen
  rationale: Erhält das konkrete Bild des trockenen Landes und gibt die Herrschaftsbeziehung idiomatisch wieder.
- source_word: በቅድሜሁ በገጾሙ
  choice: vor ihm auf ihr Angesicht
  rationale: Bewahrt sowohl die räumliche Beziehung „vor ihm“ als auch die drastische Körperhaltung.
- source_word: ይሰግዱ
  choice: sie werden sich niederwerfen
  rationale: Lässt offen, ob politische Huldigung oder religiöse Anbetung gemeint ist, und wahrt so die semantische und theologische Spannung.
- source_word: ይሴፈዉ
  choice: ihre Hoffnung … setzen
  rationale: Gibt den Sinn des Hoffens beziehungsweise Vertrauens mit seiner Ausrichtung auf eine Person natürlich wieder.
- source_word: ለዝኩ ወልደ እጓለ እመሕያው
  choice: jenen Menschensohn
  rationale: Erhält den Demonstrativcharakter und behandelt die Wendung ihrem örtlichen Gebrauch in den Bilderreden entsprechend als apokalyptischen Titel.
- source_word: ይስእልዎ ወይስእሉ ኀቤሁ ምሕረተ
  choice: sie werden ihn bitten und ihn um Erbarmen bitten
  rationale: Die Wiederholung von „bitten“ bildet die Wiederholung des äthiopischen Verbs sichtbar ab und bleibt im Deutschen verständlich.
theological_decisions:
- issue: Ob ይሰግዱ ausdrücklich als Anbetung wiederzugeben ist
  choice: sich niederwerfen
  alternative: anbeten; huldigen
  rationale: Das Verb kann körperliche Huldigung bis hin zu Anbetung bezeichnen. „Sich niederwerfen“ wahrt den Bedeutungsumfang, ohne die Szene dogmatisch festzulegen.
- issue: Wiedergabe des Titels ወልደ እጓለ እመሕያው
  choice: jener Menschensohn
  alternative: jener Menschensohn im rein generischen Sinn; jener Sohn der Nachkommen der Lebenden
  rationale: Im lokalen Kontext der Bilderreden funktioniert die Wendung als erkannter apokalyptischer Titel. Die Übersetzung wahrt zugleich den Demonstrativ und vermeidet zusätzliche christologische Formulierungen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptischer Eindringlichkeit. Die Rangbezeichnungen bleiben parallel; konkrete Körper- und Landschaftsbilder werden möglichst erhalten. Die verbale Wiederholung am Versende ist bewusst beibehalten.
