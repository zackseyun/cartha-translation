base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/004.yaml
  text: And pain shall come upon them as upon a woman in labor[a], when her child comes to the mouth of the womb[c][b], and she is constrained in giving birth.
translation:
  language: de
  text: Und Schmerz wird über sie kommen wie über eine Frau in den Wehen[a], wenn ihr Kind den Muttermund erreicht[b] und sie bei der Geburt in Bedrängnis gerät.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wie über eine Frau, die in den Wehen liegt“.'
    reason: lexical_alternative
  - marker: b
    text: „Muttermund“ gibt wörtlich „Mund der Gebärmutter“ wieder. Die Quelle enthält zuvor eine eingeklammerte Klausel über die Bedrängnis der Frau bei der Geburt; sie könnte eine textlich unsichere oder doppelte Überlieferung darstellen. Die Übersetzung gibt den erhaltenen Sinn wieder, ohne den genauen Satzbau dieser Klausel festzulegen.
    reason: textual_variant
lexical_decisions:
- source_word: ሕማም
  choice: Schmerz
  rationale: Das Wort bezeichnet körperlichen Schmerz oder Bedrängnis. Im Geburtsvergleich bewahrt „Schmerz“ die konkrete Bildlichkeit und lässt zugleich die apokalyptische Dimension erkennen.
- source_word: ማሕምም
  choice: in den Wehen
  rationale: Die Wendung beschreibt eine Frau unter Geburtsschmerzen. „In den Wehen“ ist im modernen Deutschen natürlich und wahrt das konkrete Bild.
- source_word: የዓፅብ / ተዐፅብ
  choice: bedrängt wird
  rationale: Das wiederholte Verb kann Druck, Bedrängnis oder schwere Mühe ausdrücken. „Bedrängt wird“ erhält diese Spannung, ohne sie auf rein seelische Not zu verengen.
- source_word: ወሊድ
  choice: Geburt
  rationale: Das Substantiv gehört zum durchgehenden Geburtsbild; „bei der Geburt“ gibt die Handlung knapp und idiomatisch wieder.
- source_word: በአፈ ማሕፀን
  choice: an den Muttermund
  rationale: Wörtlich steht „an den Mund der Gebärmutter“. „Muttermund“ ist die natürliche deutsche anatomische Bezeichnung und bewahrt den konkreten Sinn des Bildes.
theological_decisions:
- issue: Ob das Geburtsbild zu allgemeiner Angst oder Qual verallgemeinert werden soll
  choice: Den konkreten Vergleich mit Wehenschmerz, Muttermund und Bedrängnis bei der Geburt beibehalten
  alternative: Nur allgemein von Angst oder Qual sprechen, die sie wie eine Gebärende ergreift
  rationale: Der Vers entfaltet ein zusammenhängendes Geburtsbild. Seine konkrete Wiedergabe wahrt die apokalyptische Rhetorik und vermeidet eine theologisierende Verflachung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vergleich ist grammatisch so gefasst, dass der Schmerz über die Menschen kommt, wie er über eine Frau in den Wehen kommt. Die anatomische Bildlichkeit bleibt mit dem geläufigen Wort „Muttermund“ erhalten.
