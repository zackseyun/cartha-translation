base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/002.yaml
  text: And the Lord of Spirits seated him on the throne of his glory[a], and the spirit of righteousness was poured out upon him, and the word of his mouth slays all the sinners[d][c][b], and all the lawless are destroyed from before his face.
translation:
  language: de
  text: Und der Herr der Geister setzte ihn auf den Thron seiner Herrlichkeit, und der Geist der Gerechtigkeit wurde über ihn ausgegossen[a]. Das Wort seines Mundes tötet alle Sünder, und alle Gesetzlosen werden von seinem Angesicht hinweggetilgt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Bezug von „ihn“ wird im Wortlaut nicht ausdrücklich benannt; aus dem Zusammenhang kann der Erwählte beziehungsweise Menschensohn gemeint sein.
    reason: referential_ambiguity
  - marker: b
    text: 'Wörtlich: „von seinem Angesicht hinweg“. Die gerichtliche Wendung bezeichnet ihre Entfernung beziehungsweise Vernichtung aus seiner Gegenwart.'
    reason: cultural_note
lexical_decisions:
- source_word: አንበረ
  choice: setzte ihn
  rationale: Die Kausativform bezeichnet hier ein Setzen beziehungsweise Einsetzen auf den Thron; das aus dem Zusammenhang ergänzte Objekt bleibt als Pronomen stehen.
- source_word: እግዚእ መናፍስት
  choice: Herr der Geister
  rationale: Bewahrt den etablierten apokalyptischen Titel in natürlichem, feierlichem Deutsch.
- source_word: መንበረ ስብሐቲሁ
  choice: den Thron seiner Herrlichkeit
  rationale: Erhält die Genitivfügung und die konkrete Thronvision, ohne sie zum bloßen Adjektiv abzuschwächen.
- source_word: መንፈሰ ጽድቅ
  choice: der Geist der Gerechtigkeit
  rationale: Gibt die moralisch-gerichtliche Bedeutung von ጽድቅ wieder und bewahrt die substantivische Form.
- source_word: ተክዕወ ዲቤሁ
  choice: wurde über ihn ausgegossen
  rationale: Bewahrt das starke Bild des Ausgießens und lässt den Bezug des männlichen Pronomens unaufgelöst.
- source_word: ነገረ አፉሁ
  choice: Das Wort seines Mundes
  rationale: Erhält die feierliche Vorstellung eines wirksamen, vom Mund ausgehenden Gerichtswortes.
- source_word: ይቀትል ኵሎሙ ኃጥኣነ
  choice: tötet alle Sünder
  rationale: Der Imperfekt wird präsentisch wiedergegeben und die ausdrücklich tödliche Bedeutung des Verbs bewahrt.
- source_word: ዐማፂያን
  choice: Gesetzlosen
  rationale: Bezeichnet Menschen, die sich der göttlichen Ordnung widersetzen, ohne die Aussage auf politische Rebellen zu verengen.
- source_word: እምገጹ ይትሐጐሉ
  choice: werden vor seinem Angesicht vernichtet
  rationale: Das Präsens im Passiv bildet den äthiopischen Imperfekt ab; die räumlich-gerichtliche Wendung bleibt sichtbar.
theological_decisions:
- issue: Bezugswort von „ihn“ beim Ausgießen des Geistes
  choice: Das männliche Pronomen wird unverändert als „über ihn“ wiedergegeben.
  alternative: „über ihn, den Erwählten/Menschensohn“ oder „über den Thron“
  rationale: Der unmittelbare Wortlaut enthält ein männliches Singularpronomen; eine namentliche Identifizierung würde die im Text verbleibende Mehrdeutigkeit auflösen.
- issue: Wirkung des Wortes im Gericht
  choice: „Das Wort seines Mundes tötet alle Sünder“
  alternative: „Durch das Wort seines Mundes sterben alle Sünder“
  rationale: Die gewählte Form wahrt das Wort als grammatisches Subjekt und gibt die wirksame gerichtliche Rede wieder, ohne spätere kanonische Formulierungen einzutragen.
- issue: Zeit- und Aspektwechsel
  choice: Die vorausgehenden Perfektformen werden vergangen, die beiden Imperfektformen präsentisch wiedergegeben.
  alternative: Durchgehend Vergangenheit oder futurische Wiedergabe der Imperfekte
  rationale: So bleibt der auffällige Aspektwechsel des Ge'ez erhalten; das Präsens kann die charakteristische beziehungsweise fortdauernde Gerichtswirkung ausdrücken, ohne sie ausschließlich futurisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrten apokalyptischen Bildern. Der Satz wurde zur besseren Lesbarkeit nach dem zweiten Glied geteilt, während die inhaltliche Reihung erhalten bleibt.
