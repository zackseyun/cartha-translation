  source_fidelity: 'Die Kausativform von አንበረ ist zutreffend mit „setzte ihn“ wiedergegeben. Die Perfekte („setzte“, „wurde ... ausgegossen“) und die Imperfekte („tötet“, „werden ...“) sind sinnvoll differenziert. Der einzige sichere Korrekturbedarf betrifft die abschließende Präpositionalwendung እምገጹ: Sie bedeutet „von/vor seinem Angesicht hinweg“, nicht lediglich Vernichtung „vor seinem Angesicht“.'
  naturalness: Der Text ist modernes, würdiges Standarddeutsch. „Von seinem Angesicht hinweggetilgt“ ist als bewusst bildhafte Gerichtssprache idiomatisch genug und gibt die räumlich-entfernende Wendung genauer wieder als „vor seinem Angesicht vernichtet“.
