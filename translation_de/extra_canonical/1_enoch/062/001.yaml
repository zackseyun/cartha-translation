base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/001.yaml
  text: And thus the Lord commanded the kings and the mighty and the exalted[a], and those who dwell on the earth, and said, “Open your eyes and lift up your horns[b], if you are able to recognize the Chosen One.”
translation:
  language: de
  text: 'Und so gebot der Herr den Königen, den Mächtigen und den Hochgestellten sowie denen, die auf der Erde wohnen, und sprach: »Öffnet eure Augen und erhebt eure Hörner[a], wenn ihr den Erwählten[b] erkennen könnt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Erheben der »Hörner« ist wahrscheinlich ein Bild für Stärke, hohen Rang oder stolze Macht; die bildhafte Ausdrucksweise bleibt deshalb erhalten.
    reason: cultural_note
  - marker: b
    text: 'Auch: »den Auserwählten«. Das ge’ezische Wort wird in den Bilderreden als fester Titel gebraucht, nicht nur als beschreibendes Eigenschaftswort.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አዘዘ
  choice: gebot
  rationale: Das starke Weisungsverb entspricht dem feierlichen, gerichtlichen Zusammenhang und bewahrt den gehobenen Ton.
- source_word: እግዚእ
  choice: der Herr
  rationale: Die geläufige deutsche Wiedergabe des göttlichen Herrschaftstitels bringt die souveräne Stellung des Sprechers zum Ausdruck.
- source_word: ነገሥት
  choice: Könige
  rationale: Der konkrete politische Titel wird beibehalten und nicht zum allgemeineren »Herrscher« abgeschwächt.
- source_word: ዐዚዛን
  choice: die Mächtigen
  rationale: Die Wiedergabe bezeichnet einflussreiche und machtvolle Personen und passt zur Aufzählung gesellschaftlicher Eliten.
- source_word: ልዑላን
  choice: die Hochgestellten
  rationale: Das Wort bezeichnet Personen von hohem Rang; »Hochgestellte« ist im heutigen Deutsch verständlich und vermeidet eine zu enge Festlegung auf den Adel.
- source_word: እለ የሐድርዋ ለምድር
  choice: denen, die auf der Erde wohnen
  rationale: Die relative Konstruktion und die apokalyptische Bezeichnung der Erdbewohner werden natürlich und zugleich formnah wiedergegeben.
- source_word: ክሥቱ አዕይንቲክሙ
  choice: Öffnet eure Augen
  rationale: Der Imperativ fordert im Offenbarungszusammenhang zum Wahrnehmen auf und ist im Deutschen idiomatisch.
- source_word: አንሥኡ አቅርንቲክሙ
  choice: erhebt eure Hörner
  rationale: Das konkrete apokalyptische Bild wird bewahrt, statt es durch eine eindeutige abstrakte Deutung zu ersetzen.
- source_word: ትክሉ
  choice: wenn ihr … könnt
  rationale: Die Bedingung drückt Fähigkeit oder Vermögen aus; die knappe Form ist im Deutschen natürlich.
- source_word: አእምሮቶ
  choice: erkennen
  rationale: Im Zusammenhang geht es um das Wahrnehmen und Identifizieren der offenbarten Gestalt, nicht nur um abstraktes Wissen.
- source_word: ሐሩይ
  choice: der Erwählte
  rationale: Die substantivierte Form wahrt den Charakter als feststehender Titel innerhalb der Bilderreden.
theological_decisions:
- issue: Wiedergabe von ሐሩይ als Titel der endzeitlichen Gestalt
  choice: der Erwählte
  alternative: der Auserwählte
  rationale: »Der Erwählte« ist prägnant, verständlich und bewahrt den formalen Titel, ohne zusätzliche christologische Deutungen in den Text einzutragen.
- issue: Deutung des Bildes vom Erheben der Hörner
  choice: das Bild »erhebt eure Hörner« im Haupttext beibehalten
  alternative: »zeigt eure Macht« oder »erhebt euch stolz«
  rationale: Das Bild kann Stärke, Rang oder stolze Macht bezeichnen. Eine abstrakte Wiedergabe würde die echte Bildhaftigkeit und ihre Deutungsoffenheit vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem apokalyptischem Ton. Die Reihung der angesprochenen Gruppen und das Hornbild bleiben erhalten; »sowie« verhindert dabei eine schwerfällige Häufung von »und«. Die Fußnotenmarker wurden sachlich den jeweils erläuterten Ausdrücken zugeordnet.
