base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/008.yaml
  text: And the congregation of the chosen and the holy ones shall be sown[c][b][a], and all the chosen shall stand before him on that day.
translation:
  language: de
  text: Und die Gemeinschaft der Erwählten und Heiligen[a] wird gesät werden, und alle Erwählten werden an jenem Tag vor ihm stehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Heilige“ kann die geheiligte Gemeinschaft bezeichnen, in apokalyptischen Texten aber auch himmlische heilige Wesen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይዘራእ
  choice: wird ausgesät werden
  rationale: Die Form ist als passiver Imperfekt von ዘርአ („säen“) zu verstehen. Die wörtliche Saatmetapher wird bewahrt, da sie im Henochbuch bedeutsam ist und nicht erklärend aufgelöst werden sollte.
- source_word: ማኅበረ
  choice: Gemeinschaft
  rationale: Bezeichnet eine versammelte oder zusammengehörige Gruppe. „Gemeinschaft“ klingt im modernen Deutschen natürlich und würdevoll; „Versammlung“ bleibt eine mögliche Alternative.
- source_word: ኅሩያን
  choice: Erwählten
  rationale: Gibt den zentralen henochischen Ausdruck transparent wieder, ohne zusätzliche konfessionelle Festlegung.
- source_word: ቅዱሳን
  choice: Heiligen
  rationale: Die substantivierte Pluralform bewahrt die Offenheit zwischen geheiligten Menschen und himmlischen heiligen Wesen.
- source_word: ወይቀውሙ
  choice: werden … stehen
  rationale: Entspricht dem Grundsinn des Stehens beziehungsweise Sich-Hinstellens und passt zur Gegenwart vor der erhöhten Gestalt.
- source_word: በቅድሜሁ
  choice: vor ihm
  rationale: Knappes und idiomatisches Deutsch für die räumliche beziehungsweise personale Gegenwart.
- source_word: ኵሎሙ
  choice: alle
  rationale: Die ausdrückliche Gesamtheit der Erwählten bleibt erhalten.
- source_word: በይእቲ ዕለት
  choice: an jenem Tag
  rationale: Bewahrt die apokalyptische Zeitformel in natürlichem, gehobenem Deutsch.
theological_decisions:
- issue: Bezug von ቅዱሳን auf menschliche Glaubende oder himmlische Wesen
  choice: „Heiligen“ ohne nähere Bestimmung
  alternative: „die heiligen Menschen“ oder „die heiligen Wesen“
  rationale: Die Verbindung mit den Erwählten deutet auf die gerechte Gemeinschaft, doch der apokalyptische Sprachgebrauch kann auch himmlische Wesen einschließen. Die Übersetzung lässt diese Spannung bestehen.
- issue: Deutung der Saatmetapher
  choice: Wörtlich „wird ausgesät werden“
  alternative: Deutend „wird eingepflanzt/ausgebreitet werden“
  rationale: Das Bild vom Säen beziehungsweise Pflanzen der Gerechten ist im Henochbuch theologisch aufgeladen. Eine Glättung würde die Bildsprache und ihre mögliche Mehrdeutigkeit abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am ge'ezischen Parallelismus; die ungewöhnliche, aber zentrale Saatmetapher wird nicht geglättet.
