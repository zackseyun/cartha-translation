base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/062/005.yaml
  text: And one half of them shall look at the other half[a], and they shall be terrified, and their faces shall fall[b], and pain shall seize them when they see that Son of Man sitting on the throne of his glory.
translation:
  language: de
  text: Und die eine Hälfte von ihnen wird die andere Hälfte ansehen[a]. Sie werden erschrecken, ihre Gesichter werden sich senken, und Schmerz wird sie ergreifen, wenn sie jenen Menschensohn[b] auf dem Thron seiner Herrlichkeit sitzen sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und sie werden einander ansehen.“ Die Wiederholung von „Hälfte“ kann zwei einander gegenüberstehende Gruppen bezeichnen, lässt aber möglicherweise auch eine reziproke Wiedergabe zu.'
    reason: lexical_alternative
  - marker: b
    text: „Menschensohn“ wird hier als apokalyptische Bezeichnung der in den Bilderreden dargestellten Gestalt wiedergegeben, ohne damit spätere lehrmäßige Aussagen in diesen Vers einzutragen.
    reason: theological_clarity
lexical_decisions:
- source_word: መንፈቆሙ ... ለመንፈቆሙ
  choice: die eine Hälfte von ihnen ... die andere Hälfte
  rationale: Die Wiederholung des Substantivs mit Pronominalsuffix bezeichnet am ehesten zwei Hälften beziehungsweise Gruppen. Die konkrete Vorstellung einer geteilten Menge bleibt so erhalten; die mögliche reziproke Deutung wird in der Fußnote genannt.
- source_word: ይሬእዩ
  choice: ansehen / sehen
  rationale: Das gewöhnliche Verb des Sehens wird im ersten Satzteil wegen des Gegenübers mit „ansehen“, später vor dem Menschensohn mit „sehen“ wiedergegeben.
- source_word: ይደነግጹ
  choice: erschrecken
  rationale: „Erschrecken“ ist im modernen Deutsch natürlich und gibt die starke Furcht in der Gerichtsszene wieder, ohne über das Verb hinaus körperliches Zittern festzulegen.
- source_word: ይቴሕቱ ገጾሙ
  choice: ihre Gesichter werden sich senken
  rationale: Die bildhafte Wendung bezeichnet sichtbar niedergeschlagene Gesichter aus Furcht oder Scham. „Sich senken“ bewahrt das Bild und klingt im Deutschen natürlicher als „fallen“.
- source_word: ይእኅዞሙ ሕማም
  choice: Schmerz wird sie ergreifen
  rationale: Die Konstruktion bedeutet wörtlich, dass Schmerz, Leiden oder Krankheit sie ergreift. „Schmerz“ hält körperliche und seelische Bedrängnis offen.
- source_word: ወልደ ብእሲ
  choice: Menschensohn
  rationale: In den Bilderreden bezeichnet der Ausdruck eine bestimmte endzeitliche Gestalt. Die etablierte deutsche Zusammensetzung wahrt den Titelcharakter, ohne zusätzliche christologische Aussagen in den Vers einzutragen.
- source_word: ይነብር
  choice: sitzen
  rationale: Das Verb kann sitzen, bleiben oder wohnen bedeuten; zusammen mit dem Thron ist „sitzen“ die naheliegende konkrete Bedeutung.
- source_word: መንበረ ስብሐቲሁ
  choice: Thron seiner Herrlichkeit
  rationale: Die Genitivfügung des Ausgangstextes und die apokalyptische Thronformel bleiben erhalten. „Herrlichkeit“ entspricht dem Bedeutungsfeld des zugrunde liegenden Substantivs genauer als „Majestät“.
theological_decisions:
- issue: Titel oder allgemeine Bezeichnung bei ወልደ ብእሲ
  choice: „jenen Menschensohn“ als Bezeichnung einer bestimmten endzeitlichen Gestalt
  alternative: „jenen Menschensohn“ als rein allgemeine Bezeichnung eines Menschen beziehungsweise „jenen Menschen“
  rationale: Der Ausdruck wird in den Bilderreden wiederholt für eine unterscheidbare endzeitliche Gestalt verwendet. „Jenen“ gibt die deiktische Kraft von ለዝኩ wieder; die Übersetzung vermeidet zugleich, spätere dogmatische Formulierungen in den Vers einzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt eng am ge'ezischen Text, wird aber zur besseren Lesbarkeit in zwei Sätze gegliedert. Das konkrete Bild der beiden Hälften und die genitivische Wendung „Thron seiner Herrlichkeit“ werden bewusst bewahrt.
