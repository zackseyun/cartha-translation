base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/003.yaml
  text: As he created and gave to humankind to understand the word of knowledge[a], so also he created me and gave me reproof for the Watchers[c][b], the sons of heaven.
translation:
  language: de
  text: So wie er die Menschen erschaffen und ihnen gegeben hat, das Wort der Erkenntnis zu verstehen, so hat er auch mich erschaffen und mir den Auftrag gegeben, die Wächter, die Söhne des Himmels, zurechtzuweisen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der äthiopische Text ist hier schwierig überliefert; insbesondere die Lesung, die „mich“ und „damit ich sie zurechtweise“ ergibt, ist nicht völlig sicher. Eine plausible Deutung lautet: „Auch mich erschuf er und gab mir den Auftrag, sie zurechtzuweisen – die Wächter, die Söhne des Himmels.“ Nach einer anderen Analyse kann der Schluss etwa bedeuten: „Er gab mir einen Tadel für die Wächter.“'
    reason: textual_variant
lexical_decisions:
- source_word: ሰብእ
  choice: die Menschen
  rationale: Das Wort bezeichnet hier die Menschheit kollektiv; „die Menschen“ ist im modernen Deutschen natürlich und umfassend.
- source_word: ቃለ አእምሮ
  choice: das Wort der Erkenntnis
  rationale: 'Die konkrete Wortverbindung wird bewahrt: ቃል bezeichnet „Wort/Rede“, አእምሮ „Erkenntnis/Verstehen“.'
- source_word: ወለቲኒ
  choice: auch mich
  rationale: Im Licht der plausiblen Korrektur zu ወሊተኒ wird die erste Person als Enochs Beauftragung verstanden; die überlieferte Form ist jedoch unsicher.
- source_word: እዝልፎሙ
  choice: den Auftrag gegeben, … zurechtzuweisen
  rationale: 'Die Form wird als Verb der 1. Person Singular mit pronominalem Objekt verstanden: Enoch soll sie tadeln bzw. zurechtweisen. Die Formulierung macht die idiomatische Funktion von „geben“ im Deutschen deutlich.'
- source_word: ትጉሃን
  choice: die Wächter
  rationale: Wörtlich bezeichnet das Wort die Wachsamen oder Wachenden; im Henochbuch ist „Wächter“ die etablierte Bezeichnung dieser Engelwesen.
- source_word: ውሉደ ሰማይ
  choice: die Söhne des Himmels
  rationale: Die familiäre und himmlische Bildsprache des Ausgangstextes bleibt formal erhalten.
theological_decisions:
- issue: Identität der ትጉሃን ውሉደ ሰማይ
  choice: die Wächter, die Söhne des Himmels
  alternative: die Wachsamen, die Söhne des Himmels
  rationale: Der erzählerische Zusammenhang weist auf die Engelwesen des Wächterbuches. „Wächter“ wahrt den etablierten Titel, während die Apposition ihre himmlische Identität im Text selbst erhält.
- issue: Enochs Rolle gegenüber den Wächtern
  choice: Er erhält den Auftrag, sie zurechtzuweisen.
  alternative: Ihm wird ein Tadel für die Wächter gegeben.
  rationale: Die erste Lesart folgt der morphologisch plausiblen Analyse von እዝልፎሙ als Verb und stellt Enochs prophetische Beauftragung heraus, ohne den Inhalt des Tadels näher auszulegen. Wegen der schwierigen Überlieferung wird die alternative syntaktische Deutung in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bewahrt die Gegenüberstellung zwischen der Gabe an die Menschen und Enochs Auftrag. Die textliche und grammatische Unsicherheit wird nicht im Haupttext geglättet, sondern transparent in der Fußnote ausgewiesen.
