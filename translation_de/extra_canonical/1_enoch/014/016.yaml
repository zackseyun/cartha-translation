base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/016.yaml
  text: And in every respect it excelled in splendor and glory and greatness[d][c][b][a], so that I am unable to tell you about its splendor and about its greatness.
translation:
  language: de
  text: Und in jeder Hinsicht übertraf es an Glanz, Herrlichkeit und Größe alles andere,[a] sodass ich euch von seinem Glanz und seiner Größe nicht zu berichten vermag.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Es war überreich an Glanz, Herrlichkeit und Größe.“ Das Verb kann sowohl außergewöhnliches Übertreffen als auch überströmende Fülle ausdrücken.'
    reason: lexical_alternative
  - marker: b
    text: „Seinem“ bezieht sich wahrscheinlich auf das unmittelbar beschriebene himmlische Gebilde; zugleich kann die Vision dessen Glanz mit dem Glanz der göttlichen Gegenwart verschränken.
    reason: alternative_reading
lexical_decisions:
- source_word: በኵሉ፡ ይፈደፍድ
  choice: in jeder Hinsicht übertraf es alles
  rationale: በኵሉ bezeichnet umfassend „in jeder Hinsicht“; das reduplizierte Verb drückt hier ein Übertreffen beziehungsweise außergewöhnliches Hervorragen aus. Die Ergänzung „alles“ ergibt im Deutschen eine natürliche, nicht statische Wendung.
- source_word: በስብሐት
  choice: an Glanz
  rationale: Im Zusammenhang der himmlischen Vision bezeichnet das Wort sichtbare Pracht beziehungsweise strahlende Herrlichkeit, nicht gesprochenes Lob. „Glanz“ hält es vom folgenden ክብር unterschieden.
- source_word: ወበክብር
  choice: Herrlichkeit
  rationale: Das Wort bezeichnet gewichtige, ehrenvolle oder majestätische Pracht. „Herrlichkeit“ ist in diesem visionären Kontext treffend und bewahrt die Abgrenzung zu „Glanz“.
- source_word: ወበዕበይ
  choice: Größe
  rationale: Der Ausdruck bezeichnet Größe, Erhabenheit oder außerordentliche Dimension. „Größe“ bewahrt außerdem die Wiederholung im Schlusssatz.
- source_word: እስከ፡ ኢይክል፡ ዜንዎተክሙ
  choice: sodass ich euch … nicht zu berichten vermag
  rationale: Die Konstruktion bezeichnet das erreichte Ausmaß beziehungsweise dessen Folge. ዜንዎተክሙ ist als Mitteilung an die Angeredeten zu verstehen, nicht als Hinweis auf deren Augen; „nicht zu berichten vermag“ wahrt den gehobenen, aber verständlichen Ton.
- source_word: በእንተ፡ ስብሐቲሁ፡ ወበእንተ፡ ዕበዩ
  choice: von seinem Glanz und seiner Größe
  rationale: Die Präpositionalphrasen geben den Gegenstand des Berichtens an. Die männlich-sächlichen Possessivformen lassen den Bezug des geezischen Suffixes bewusst offen.
theological_decisions:
- issue: Bezug des Suffixes in „sein Glanz … seine Größe“
  choice: Das Pronomen bleibt ohne ausdrücklich genanntes Bezugswort stehen.
  alternative: Den Glanz und die Größe ausdrücklich entweder dem himmlischen Bauwerk oder der göttlichen Gegenwart zuschreiben.
  rationale: Der geezische Text nennt den Bezug nicht erneut. Im Kontext liegt das visionäre Gebilde nahe, doch Bauwerk und göttliche Gegenwart können in der Schilderung ineinander übergehen. Eine ausdrückliche Festlegung würde diese Spannung unnötig auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache mit visionär-erhabenem Klang. Die dreigliedrige Reihung und die Wiederholung von „Glanz“ und „Größe“ bleiben erhalten; archaisierende oder konfessionell festgelegte Formulierungen werden vermieden.
