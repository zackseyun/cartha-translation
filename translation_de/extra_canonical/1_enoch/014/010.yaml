base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/010.yaml
  text: And I went into the tongue of fire[a], and I drew near to a great house built of hailstones; and the roof of that house was like a mosaic of hailstones[c][b], and its floor was hail.
translation:
  language: de
  text: Und ich trat in die Feuerzunge hinein und näherte mich einem großen Haus, das aus Hagelsteinen gebaut war. Das Dach[a] dieses Hauses glich einem Mosaik[b] aus Hagelsteinen, und sein Boden war Hagel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die überlieferte äthiopische Bezeichnung für diesen Gebäudeteil ist schwierig. Sie kann auch als eine andere bauliche Fläche, etwa die Wände oder die Decke, verstanden werden.
    reason: textual_variant
  - marker: b
    text: Gemeint ist eine aus Platten zusammengesetzte oder gemusterte Fläche, nicht unbedingt ein Mosaik im heutigen Sinn.
    reason: cultural_note
lexical_decisions:
- source_word: ልሳነ እሳት
  choice: Feuerzunge
  rationale: Die konkrete, visionäre Metapher »Zunge des Feuers« bleibt in der im Deutschen geläufigen Zusammensetzung erhalten; eine Verallgemeinerung zu »Flamme« würde das Bild abschwächen.
- source_word: ቤት ዓቢይ
  choice: großes Haus
  rationale: ቤት bezeichnet allgemein ein Haus oder Gebäude. »Großes Haus« bewahrt den Wortlaut und legt die Erscheinung nicht vorschnell als Tempel oder Palast aus.
- source_word: ዘኅኑጽ በእእባነ በረድ
  choice: das aus Hagelsteinen gebaut war
  rationale: Die Konstruktion und das ungewöhnliche Baumaterial werden klar und idiomatisch wiedergegeben; »Hagelsteine« erhält die befremdliche apokalyptische Bildwelt.
- source_word: አረፍተ ውእቱ ቤት
  choice: das Dach dieses Hauses
  rationale: Im gegebenen Kontext ist eine obere bauliche Fläche gemeint; »Dach« folgt der jüngsten textkritischen Beurteilung. Da die überlieferte Form schwierig ist und auch anders verstanden wurde, wird die Unsicherheit in einer Fußnote offengelegt.
- source_word: ከመ ጸፍጸፈ ሳሌዳት
  choice: glich einem Mosaik
  rationale: Die Wendung bezeichnet eine aus Platten gefügte oder gemusterte Fläche. »Mosaik« vermittelt das Bild natürlich, ohne die verglichene Fläche selbst als Fußboden zu bezeichnen.
- source_word: በእእባን ዘእምበረድ
  choice: aus Hagelsteinen
  rationale: Die wiederholte Materialangabe wird ausdrücklich beibehalten und nicht zu »Eis« oder »Kristall« geglättet.
- source_word: ምድረ በረድ
  choice: sein Boden war Hagel
  rationale: Im Inneren eines Hauses ist »Boden« die natürliche Kontextbedeutung von ምድር. Die prädikative Form »war Hagel« bewahrt die knappe und fremdartige Aussage des Textes.
theological_decisions:
- issue: Deutung des visionären Gebäudes als Tempel oder Palast
  choice: Die neutrale Bezeichnung »großes Haus« und die Hagelbilder bleiben erhalten.
  alternative: Das Gebäude aufgrund des weiteren Zusammenhangs »Tempel« oder »Palast« nennen.
  rationale: Der Vers selbst gibt dem Gebäude keine solche kultische oder königliche Bezeichnung. Eine interpretierende Festlegung würde mögliche theologische Bezüge in den Haupttext eintragen, statt die Spannung der Vision zu bewahren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter visionärer Fremdheit. Kurze Satzglieder und konkrete Baustoffbilder folgen dem Ge'ez; »Tempel«, »Palast«, »Eis« und »Kristall« werden als interpretierende Normalisierungen vermieden.
