base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/004.yaml
  text: 'I wrote down your petition[a], and in my vision it was shown thus: that your petition will not be granted to you for all the days of eternity, and the sentence against you has been completed[c][b], and it will not be granted to you.'
translation:
  language: de
  text: 'Ich schrieb eure Bittschrift nieder, und in meiner Vision wurde mir Folgendes gezeigt: dass eure Bitte euch in alle Ewigkeit nicht gewährt werden wird,[a] und das Urteil über euch endgültig festgesetzt ist; sie wird euch nicht gewährt werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „für alle Tage der Weltzeit/Ewigkeit“ – eine nachdrückliche Formel für unbegrenzte Dauer.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ስእለትክሙ
  choice: eure Bittschrift / eure Bitte
  rationale: Das Substantiv bezeichnet ein an eine höhere Instanz gerichtetes Ersuchen. „Bittschrift“ passt beim Niederschreiben zum förmlich-rechtlichen Zusammenhang; die anschließende Wiederaufnahme mit „Bitte“ klingt im Deutschen natürlich und bewahrt denselben Bezug.
- source_word: ጻሐፍኩ
  choice: Ich schrieb … nieder
  rationale: Gibt den einfachen Schreibakt wieder und macht im Deutschen idiomatisch deutlich, dass Henoch das Ersuchen schriftlich festhielt.
- source_word: በራእየየ
  choice: in meiner Vision
  rationale: Bezeichnet offenbarendes Schauen; „Vision“ bewahrt den apokalyptischen Charakter.
- source_word: ያስተርኢ
  choice: wurde mir … gezeigt
  rationale: Die unpersönliche Offenbarungsformel vermeidet es, einen im Satz nicht ausdrücklich genannten Handelnden einzuführen.
- source_word: ኢትከውነክሙ
  choice: wird euch … nicht gewährt werden
  rationale: Wörtlicher wäre „wird euch nicht zuteil/sein“. Im Zusammenhang einer Bitte drückt „gewährt“ die gemeinte Ablehnung klar aus, ohne das stärker religiös geprägte „erhört“ einzutragen.
- source_word: መዋዕለ ዓለም
  choice: in alle Ewigkeit
  rationale: Die Formel bedeutet wörtlich etwa „alle Tage der Weltzeit/Ewigkeit“ und bezeichnet nachdrücklich unbegrenzte Dauer. Die idiomatische deutsche Wendung wahrt Bedeutung und Würde.
- source_word: ወኵነኔ ፍጽምት ላዕሌክሙ
  choice: und das Urteil über euch ist endgültig vollstreckt
  rationale: Die anhand der Überlieferung und des griechischen Zeugnisses berichtigte Lesart bezeichnet ein gegen die Wächter gerichtetes, zum Abschluss gebrachtes Gerichtsurteil. „Vollstreckt“ gibt die Vollendung des Urteils natürlicher wieder als „vollendet“, ohne bloß eine noch ausstehende Entscheidung zu bezeichnen.
- source_word: ወኢይከውነ ክሙ
  choice: sie wird euch nicht gewährt werden
  rationale: Das feminine Pronomen „sie“ nimmt im Deutschen eindeutig „Bitte“ auf; die erneute Verweigerung bewahrt die nachdrückliche Wiederholung des Ausgangstextes.
theological_decisions:
- issue: Ablehnung der Bitte der Wächter
  choice: „Eure Bitte wird euch … nicht gewährt werden“
  alternative: „Euer Gebet wird nicht erhört werden“
  rationale: „Gewährt“ hält den rechtlich-apokalyptischen Charakter fest und vermeidet die zusätzliche Aussage, das Gebet sei nicht gehört worden.
- issue: Bedeutung der Gerichtsklausel
  choice: Ein endgültig vollstrecktes Urteil über die Wächter
  alternative: Ein bloß gefälltes oder festgesetztes Urteil
  rationale: Das zugrunde liegende Wortfeld betont Abschluss und Endgültigkeit. Die Formulierung lässt die Spannung zwischen bereits abgeschlossenem Urteil und fortdauernder Verweigerung stehen.
- issue: Textkritische Korrektur der übermittelten Ge'ez-Zeile
  choice: Die in der Überlieferung gestützte Lesart „Gericht/Urteil“ wird übersetzt
  alternative: Die offenbar fehlerhafte Transkription ወአነኒ („und ich“) mechanisch wiedergeben
  rationale: Die angegebene Transkription enthält nach dem Revisionsbefund einen OCR-/Lesefehler; die korrigierte äthiopische Lesart stimmt zudem mit griechisch ἡ κρίσις überein und ergibt den kohärenten Satzsinn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit förmlich-apokalyptischem Ton. Der Satzbau folgt der Abfolge des Ge'ez, wird jedoch durch Doppelpunkt und klare Pronomenführung lesbar gehalten. Die wiederholte Ablehnung bleibt als rhetorischer Nachdruck erhalten.
