lexical_decisions:
- source_word: እምታሕተ
  choice: unter … hervor
  rationale: Die Verbindung gibt sowohl die räumliche Lage unterhalb des Thrones als auch die Bewegung von dort weg wieder. Im Deutschen drückt „unter dem Thron hervor“ dies natürlicher und anschaulicher aus als das schwerfällige „von unter dem Thron“.
- source_word: መንበሩ
  choice: dem Thron
  rationale: መንበር bezeichnet einen Sitz oder Thron; im Kontext der himmlischen Vision ist „Thron“ angemessen. Das Suffix -u kann hier anaphorisch-definit auf den zuvor genannten Thron zurückweisen, weshalb „dem Thron“ im Haupttext steht.
- source_word: ይወፅእ
  choice: kam … hervor
  rationale: Das Verb bezeichnet das Hinausgehen oder Hervorkommen. „kam … hervor“ wahrt die visionäre Bewegung und lässt wie der knappe ge’ezische Satz offen, was hervortrat.
theological_decisions:
- issue: Funktion des Suffixes in መንበሩ
  choice: 'Anaphorisch-definit: „dem Thron“'
  alternative: 'Possessiv: „seinem Thron“'
  rationale: Das maskuline Singularsuffix kann im Ge’ez auf einen bereits genannten bestimmten Gegenstand zurückverweisen. Da der erhöhte Thron im vorausgehenden Kontext eingeführt ist, wird diese Lesart im Haupttext bevorzugt; die mögliche possessive Deutung bleibt in einer Fußnote sichtbar.
- issue: Ungenanntes Subjekt dessen, was hervorkam
  choice: Im Haupttext nicht ergänzen
  alternative: Ein Subjekt aus der folgenden Bildaussage oder dem weiteren Kontext einsetzen
  rationale: Der ge’ezische Vers ist eine knappe, offen endende Teilaussage. Eine ausdrückliche Ergänzung würde die syntaktische und bildhafte Spannung vorzeitig auflösen.
translation_notes:
  register: Moderne, würdige Visionssprache. Die ungewöhnlich offen endende Wortstellung ist bewusst beibehalten, damit der Haupttext die Unvollständigkeit und Spannung der ge’ezischen Zeile nicht durch eine Ergänzung glättet.
