translation:
  language: de
  text: Und unter dem Thron hervor kam …[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der ge’ezische Vers besteht aus einem kurzen, offen endenden Satzteil und sagt nicht ausdrücklich, was hervorkam; die folgende Zeile führt das Bild weiter aus.
