base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/002.yaml
  text: I saw in my sleep what I now speak with a tongue of flesh and with my spirit[a], which the Great One has given to men as a mouth[c][b], so that they might speak with it and understand in the heart.
translation:
  language: de
  text: Ich sah im Schlaf, was ich nun mit einer Zunge aus Fleisch und mit meinem Geist[a] ausspreche, den der Große den Menschen als Mund gegeben hat[b], damit sie durch ihn sprechen und im Herzen verstehen.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit meinem Atem“. Das ge''ezische Wort kann „Geist“, „Atem“ oder „Wind“ bedeuten; Zunge, Mund und Sprechen machen hier auch „Atem“ plausibel.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich steht im überlieferten ge''ezischen Text: „den der Große den Menschen als Mund gegeben hat“. Die Formulierung ist ungewöhnlich; möglicherweise ist die Textüberlieferung an dieser Stelle gestört.'
    reason: textual_difficulty
  - marker: c
    text: Das „Herz“ gilt hier als Ort des inneren Verstehens und Urteilens, nicht nur als Sitz der Gefühle.
    reason: cultural_note
lexical_decisions:
- source_word: ርኢኩ በንዋምየ
  choice: Ich sah im Schlaf
  rationale: Gibt den vergangenen visionären Vorgang und den Schlaf- beziehungsweise Traumzustand schlicht wieder, ohne stärker auf einen Traum als Inhalt festzulegen.
- source_word: ይእዜ እነግር
  choice: was ich nun … ausspreche
  rationale: Bewahrt den Übergang vom früheren Sehen zum gegenwärtigen mündlichen Berichten; „ausspreche“ lässt sich im Deutschen natürlich mit dem folgenden Mittel der Rede verbinden.
- source_word: በልሳን ዘሥጋ
  choice: mit einer Zunge aus Fleisch
  rationale: Erhält das konkrete, apokalyptisch-anthropologische Bild des Ausgangstextes.
- source_word: ወበመንፈስየ
  choice: und mit meinem Geist
  rationale: መንፈስ kann Geist, Atem oder Wind bezeichnen. „Geist“ gibt die übliche anthropologische Bedeutung wieder; die im Redekontext plausible Bedeutung „Atem“ bleibt in der Fußnote erhalten.
- source_word: ዓቢይ
  choice: der Große
  rationale: Bewahrt die substantivierte göttliche Ehrenbezeichnung, ohne sie erklärend durch „Gott“ zu ersetzen.
- source_word: ዘወሀበ ዓቢይ አፈ ለሰብእ
  choice: den der Große den Menschen als Mund gegeben hat
  rationale: Gibt das im überlieferten ge'ezischen Text ausdrücklich vorhandene አፈ („Mund“) wieder und behandelt es als prädikative Ergänzung zum gegebenen Geist.
- source_word: ይትናገሩ ቦቱ
  choice: damit sie durch ihn sprechen
  rationale: Drückt den Zweck der Gabe aus und bezieht das singularische Mittel der Rede auf „Geist“ zurück.
- source_word: ወይለብዉ በልብ
  choice: und im Herzen verstehen
  rationale: Bewahrt die antike Vorstellung des Herzens als Ort inneren Erkennens und Urteilens.
theological_decisions:
- issue: Bedeutung von መንፈስ in der Aussage über menschliches Sprechen
  choice: Geist
  alternative: Atem
  rationale: „Geist“ wahrt die breite anthropologische und theologische Bedeutung des ge'ezischen Wortes. Da Zunge, Mund und Sprechen zugleich konkret an den Atem denken lassen, wird diese echte Mehrdeutigkeit nicht aufgelöst, sondern in einer Fußnote dokumentiert.
- issue: Wiedergabe der göttlichen Bezeichnung ዓቢይ
  choice: der Große
  alternative: Gott
  rationale: Die lokale Ehrenbezeichnung bleibt erhalten; eine Ersetzung durch „Gott“ würde die besondere Ausdrucksweise des Textes einebnen.
- issue: Schwierige Verbindung von Geist und Mund
  choice: den Geist als von dem Großen gegebenen „Mund“ verstehen
  alternative: die Relativkonstruktion auf die gesamte menschliche Redefähigkeit beziehen
  rationale: Diese Fassung folgt der greifbaren ge'ezischen Wortfolge und lässt deren ungewöhnliches Bild stehen, statt das ausdrücklich vorhandene Wort „Mund“ auszulassen oder die Spannung stillschweigend zu glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener apokalyptischer Bildsprache. Die ungewöhnliche Wendung „Zunge aus Fleisch“ und die schwierige Aussage vom Geist als Mund werden nicht geglättet; lexikalische und textliche Unsicherheiten werden knapp in Fußnoten offengelegt.
