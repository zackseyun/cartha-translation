base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/005.yaml
  text: And from now on you shall not ascend into heaven for all eternity[b][a], and on the earth it has been declared that you shall be bound for all the days of eternity.
translation:
  language: de
  text: Und von nun an sollt ihr nicht mehr für alle Ewigkeit in den Himmel hinaufsteigen[a]; und auf der Erde ist verkündet worden[b], euch für alle Tage der Ewigkeit zu binden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der äthiopische Text verwendet in diesem Vers zwei einander überlappende Zeitformeln: eine beim Verbot, in den Himmel hinaufzusteigen, und eine beim Urteil der Bindung. Beide werden beibehalten und nicht zu einem einzigen „für immer“ zusammengezogen.'
    reason: lexical_alternative
  - marker: b
    text: Die passive Formulierung „ist verkündet worden“ lässt offen, wer die Verkündigung ausgesprochen hat; der Zusammenhang deutet auf einen himmlischen Gerichtsbeschluss. Die anschließende Formulierung bezeichnet aktiv das Binden, ohne den Handelnden ausdrücklich zu nennen.
    reason: cultural_note
lexical_decisions:
- source_word: እምይእዜ
  choice: von nun an
  rationale: Gibt den zeitlichen Beginn des neuen, durch das Urteil bestimmten Zustands in natürlichem modernem Deutsch wieder.
- source_word: ኢትዓርጉ
  choice: sollt ihr … nicht mehr hinaufsteigen
  rationale: Bewahrt den feierlich-deklarativen Charakter der negierten Verbform; „hinaufsteigen“ erhält zugleich die vertikale Bildsprache.
- source_word: ውስተ ሰማይ
  choice: in den Himmel
  rationale: Der apokalyptische Zusammenhang bezeichnet den kosmischen Himmel, nicht bloß den sichtbaren Luftraum.
- source_word: እስከ ኵሉ ዓለም
  choice: in alle Ewigkeit
  rationale: Gibt die umfassende Zeitformel idiomatisch und mit der Endgültigkeit des Urteilsspruchs wieder.
- source_word: ወውስተ ምድር ተነግረ
  choice: und auf der Erde ist verkündet worden
  rationale: Erhält das Passiv und lässt die verkündende Instanz wie im Ausgangstext unausgesprochen.
- source_word: ይእስርክሙ
  choice: dass ihr … gebunden sein sollt
  rationale: Bewahrt das konkrete Motiv des Bindens, statt es deutend zu „eingesperrt“ oder „gefangen“ zu verallgemeinern.
- source_word: በኵሉ መዋዕለ ዓለም
  choice: für alle Tage der Ewigkeit
  rationale: Erhält die zweite, eigenständige Zeitformel und ihre rhythmische Wiederholung, statt beide Formeln zusammenzuziehen.
theological_decisions:
- issue: Konkretes apokalyptisches Strafbild oder verallgemeinernde Wiedergabe
  choice: gebunden sein sollt
  alternative: eingesperrt oder gefangen sein sollt
  rationale: Das konkrete Bild des Bindens gehört zur Gerichtssprache über die rebellischen Wächter und sollte nicht durch eine abstraktere Deutung ersetzt werden.
- issue: Unausgesprochene Autorität hinter der Verkündigung
  choice: Passiv ohne Ergänzung eines Handelnden
  alternative: Gott hat verkündet
  rationale: Der äthiopische Text nennt die verkündende Instanz nicht ausdrücklich; die Übersetzung bewahrt diese grammatische Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit feierlichem Urteilscharakter. Die Satzstruktur folgt dem Parallelismus des äthiopischen Textes, bleibt aber für heutige Leser verständlich. Die Fußnotenmarker stehen jeweils unmittelbar bei der erklärten Formulierung.
