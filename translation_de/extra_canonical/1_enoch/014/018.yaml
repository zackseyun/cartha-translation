base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/018.yaml
  text: And I looked and saw within it a lofty throne[a]; and its appearance was like crystal, and its wheels like the shining sun[d][c][b], and the voice of the cherubim.
translation:
  language: de
  text: Und ich blickte hin und sah darin einen hohen Thron; sein Aussehen war wie Kristall[a], seine Räder[b] wie die leuchtende Sonne; und die Stimme der Cherubim.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit „Kristall“ wiedergegebene Wort kann auch Eis, Reif oder eine hell glänzende kristallartige Substanz bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Das Wort kann auch „Kreis“, „Umfang“ oder „das ihn Umgebende“ bedeuten. Die Wiedergabe „Räder“ wird durch die griechische und aramäische Parallelüberlieferung gestützt.
    reason: textual_and_lexical_alternative
  - marker: c
    text: 'Wörtlich und ebenso knapp: „und die Stimme der Cherubim“. Gemeint sein kann auch der Laut oder Klang der Cherubim; ein Verb des Hörens steht nicht ausdrücklich da.'
    reason: lexical_and_syntactic_ambiguity
lexical_decisions:
- source_word: ነጸርኩ / ርኢኩ
  choice: ich blickte hin und sah
  rationale: Die beiden Verben des Sehens bleiben als feierliche Doppelung erhalten, ohne im Deutschen unnötig altertümlich zu klingen.
- source_word: ውስቴቱ
  choice: darin
  rationale: Die knappe räumliche Angabe verweist natürlich auf das zuvor beschriebene Gebäude beziehungsweise dessen Inneres.
- source_word: መንበረ ልዑለ
  choice: einen hohen Thron
  rationale: „Thron“ gibt መንበር wieder; „hoch“ bewahrt die räumliche Höhe und lässt zugleich die mitschwingende Erhabenheit bestehen, ohne sie dogmatisch auszudeuten.
- source_word: ራእዩ
  choice: sein Aussehen
  rationale: Die Formulierung bezeichnet die sichtbare Erscheinung des Thrones und ist in modernem Deutsch klar und würdig.
- source_word: አስሐትያ
  choice: Kristall
  rationale: Das Wort bezeichnet hier wahrscheinlich eine helle, durchscheinende oder eisartig glänzende Substanz. „Kristall“ vermittelt das visionäre Leuchten am natürlichsten; die Unsicherheit wird in einer Fußnote bewahrt.
- source_word: ክበቡ
  choice: seine Räder
  rationale: Das Wort kann Kreis, Umfang oder Rad bezeichnen. Im Kontext der Thronvision sowie angesichts der griechischen und aramäischen Parallelüberlieferung ist die Wiedergabe als Räder vorzuziehen.
- source_word: ፀሐይ ዘያበርህ
  choice: die leuchtende Sonne
  rationale: Die Wiedergabe bewahrt den ausdrücklich als leuchtend beschriebenen Charakter der Sonne und bleibt zugleich knapp.
- source_word: ቃለ ኪሩቤን
  choice: die Stimme der Kerubim
  rationale: ቃል kann „Stimme“ oder „Laut/Klang“ bedeuten. „Stimme“ folgt der Grundbedeutung; die ungewöhnlich knappe Syntax bleibt sichtbar.
theological_decisions:
- issue: Beschreibung des Thrones
  choice: einen hohen Thron
  alternative: einen erhabenen Thron
  rationale: „Hoch“ beschreibt zunächst die visionär wahrgenommene Höhe, während „erhaben“ die Aussage stärker theologisch wertend festlegen könnte.
- issue: Deutung des kreisförmigen Elements am Thron
  choice: seine Räder
  alternative: sein Umfang / das ihn Umgebende
  rationale: „Räder“ bewahrt das aus den alten Parallelzeugen erkennbare Thronwagenmotiv, ohne die Vision darüber hinaus zu erklären; die lexikalische Mehrdeutigkeit wird angemerkt.
- issue: Unvollständige Schlusswendung
  choice: und die Stimme der Kerubim
  alternative: und man hörte die Stimme der Kerubim
  rationale: Der ge'ezische Text bietet eine knappe Nominalwendung und kein ausdrückliches Verb des Hörens. Die fragmentarische Spannung wird deshalb nicht stillschweigend aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener visionärer Doppelung am Anfang und der abgebrochen wirkenden Schlusswendung. Die Semikola gliedern die dichte Reihung, ohne zusätzliche Beziehungen zwischen den Bildern einzutragen.
