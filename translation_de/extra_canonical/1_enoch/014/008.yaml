base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/008.yaml
  text: 'And a vision showed me thus: behold[a], in the vision the clouds were calling me, and the mist was calling me; and the course of the stars and the lightnings were driving me and urging me on, and in the vision the winds were making me fly, and carrying me off[c][b], and lifting me upward into heaven.'
translation:
  language: de
  text: 'Und eine Vision zeigte mir Folgendes: Siehe, in der Vision riefen mich die Wolken, und der Nebel rief mich; der Lauf der Sterne[a] und die Blitze trieben mich und drängten mich voran. In der Vision ließen mich die Winde[b] fliegen, trugen mich hinweg und hoben mich hinauf in den Himmel.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »das Eilen der Sterne« beziehungsweise »die Bahnen der Sterne«; der ge’ezische Ausdruck stellt die Sterne als bewegt dar.
    reason: lexical_alternative
  - marker: b
    text: »Winde« kann hier auch mit »Geister« wiedergegeben werden; der unmittelbare Zusammenhang spricht jedoch eher für atmosphärische Kräfte, die Henochs Aufstieg bewirken.
    reason: lexical_alternative
lexical_decisions:
- source_word: ራእይ
  choice: Vision
  rationale: Im apokalyptischen Zusammenhang ist »Vision« die geläufige und präzise Wiedergabe; die Wiederholung erhält den visionären Rahmen.
- source_word: አስተአርአየኒ
  choice: zeigte mir
  rationale: Die Kausativform zu »sehen« bezeichnet ein Zeigen beziehungsweise Sehenlassen; »zeigte mir« ist natürlich und wahrt den visuellen Sinn.
- source_word: ደመናት
  choice: Wolken
  rationale: Die Grundbedeutung genügt; eine Verstärkung zu »Sturmwolken« wäre vom Wortlaut nicht gefordert.
- source_word: ይጼውዑኒ / ይጼውዐኒ
  choice: riefen mich / rief mich
  rationale: Die wiederholte Verbform beschreibt einen aktiven Ruf. Die deutsche Wiederholung bewahrt den Parallelismus und berücksichtigt den Numerus der Subjekte.
- source_word: ጊሜ
  choice: Nebel
  rationale: Das Wort bezeichnet wahrscheinlich Nebel oder Dunst; der Singular entspricht der Form im Ausgangstext.
- source_word: ሩጸተ ከዋክብት
  choice: der Lauf der Sterne
  rationale: Die Wendung hebt die Bewegung der Sterne hervor. »Lauf« ist im Deutschen idiomatisch und lässt offen, ob Bewegung, Bahn oder stürmisches Eilen gemeint ist.
- source_word: መበርቅት
  choice: die Blitze
  rationale: Der deutsche Plural gibt das atmosphärische Phänomen klar wieder und passt zum kosmischen Parallelismus.
- source_word: ይንጐዑኒ
  choice: trieben mich
  rationale: Die Form vermittelt kraftvolle Fortbewegung; »trieben« bewahrt diese Dynamik.
- source_word: ወተያድህቁኒ
  choice: drängten mich voran
  rationale: Die Wiedergabe verstärkt, wie im Ausgangstext, den Gedanken des Weitergetriebenwerdens, ohne ihn mit dem vorherigen Verb gleichzusetzen.
- source_word: ነፋሳት
  choice: Winde
  rationale: Im unmittelbaren Zusammenhang mit Wolken, Nebel und Blitzen ist die meteorologische Bedeutung am wahrscheinlichsten; die mögliche Bedeutung »Geister« bleibt in einer Fußnote sichtbar.
- source_word: ያበርሩኒ
  choice: ließen mich fliegen
  rationale: Die ausdrückliche Flugbewegung bleibt erhalten und wird nicht zu einem allgemeinen Tragen abgeschwächt.
- source_word: ያንጉጹኒ
  choice: trugen mich hinweg
  rationale: Die Form bezeichnet eine kraftvolle Beförderung; »hinwegtrugen« wäre möglich, doch die getrennte Form klingt in der Satzreihe natürlicher.
- source_word: ላዕለ ውስተ ሰማይ
  choice: aufwärts in den Himmel
  rationale: Die Formulierung bildet sowohl die aufwärts gerichtete Bewegung als auch das Eintreten in den Himmel ab.
theological_decisions:
- issue: Ob ነፋሳት als »Winde« oder »Geister« wiederzugeben ist
  choice: Winde
  alternative: Geister
  rationale: Die Reihe meteorologischer und kosmischer Kräfte spricht im lokalen Kontext für »Winde«. Die Alternative wird jedoch nicht ausgeschlossen, sondern in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenem visionärem Parallelismus. »Siehe« erhält das apokalyptische Signalwort; die Satzglieder wurden nur maßvoll gegliedert, damit die kumulative Bewegung des ge’ezischen Textes spürbar bleibt.
