base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/013.yaml
  text: And I went into that house[a], and it was hot like fire and cold like ice, and there was no delight of life within it; fear covered me, and trembling seized me.
translation:
  language: de
  text: Und ich trat in jenes Haus ein; es war heiß wie Feuer und kalt wie Eis, und in seinem Inneren gab es keine Lebensfreude[a]. Furcht bedeckte mich, und Zittern ergriff mich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hier mit „keine Lebensfreude“ wiedergegebene äthiopische Wendung ist schwer zu deuten. Sie kann bedeuten, dass sich in dem Haus nichts Lebenspendendes oder Wohltuendes befand, oder allgemeiner, dass dort jeder lebendige Trost fehlte.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወቦእኩ
  choice: Und ich trat … ein
  rationale: Das Verb bezeichnet das Hineingehen oder Eintreten. „trat … ein“ gibt die Bewegung in der Vision klar und in natürlichem, würdigem Deutsch wieder.
- source_word: ውእቱ ቤት
  choice: jenes Haus
  rationale: Das Demonstrativpronomen verweist auf das zuvor beschriebene visionäre Bauwerk. „jenes Haus“ bewahrt diesen rückverweisenden Charakter.
- source_word: ምውቅ
  choice: heiß
  rationale: Die Grundbedeutung wird durch den Vergleich mit Feuer verstärkt; „heiß“ vermeidet eine unnötige Doppelung wie „brennend wie Feuer“.
- source_word: ቈሪር
  choice: kalt
  rationale: Das schlichte Adjektiv bewahrt zusammen mit „wie Eis“ den paradoxen Gegensatz zur Feuerhitze.
- source_word: በረድ
  choice: Eis
  rationale: Das Wort kann auch Hagel bezeichnen; im Gegensatz von Hitze und Kälte passt „Eis“ hier am besten.
- source_word: ወኢምንተ ፍግዐ ሕይወት አልቦቱ ውስቴቱ
  choice: und in seinem Inneren gab es keine Freude des Lebens
  rationale: Die schwierige Wendung scheint das Fehlen von lebenspendender Annehmlichkeit, Freude oder Behagen auszudrücken. Die bewusst ungewöhnliche Formulierung hält diese Bedeutungsbreite offen, statt sie auf bloße Leblosigkeit zu verengen.
- source_word: ፍርሃት ከደነኒ
  choice: Furcht bedeckte mich
  rationale: Das Verb trägt das konkrete Bild des Bedeckens oder Umhüllens. Die wörtlichere Wiedergabe erhält die körperhafte Bildsprache.
- source_word: ወረዓድ አኃዘኒ
  choice: und Zittern ergriff mich
  rationale: Substantiv und Verb bezeichnen ein Zittern sowie dessen machtvolles Ergreifen; die Übersetzung bewahrt diese körperliche Reaktion.
theological_decisions:
- issue: Bedeutung der schwierigen Aussage über das, was im Haus fehlte
  choice: keine Freude des Lebens
  alternative: nichts Lebendiges / keine Annehmlichkeit des Lebens
  rationale: Der Text verneint wahrscheinlich eine mit Leben verbundene Freude, Wohltat oder Behaglichkeit und nicht eindeutig das Vorhandensein biologischen Lebens. Die ungewöhnliche Wendung und eine Fußnote bewahren die Spannung der Thronsaalvision.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem visionärem Ton. Die parallelen Gegensätze „heiß wie Feuer“ und „kalt wie Eis“ sowie die körperhaften Bilder „Furcht bedeckte mich“ und „Zittern ergriff mich“ bleiben erhalten.
