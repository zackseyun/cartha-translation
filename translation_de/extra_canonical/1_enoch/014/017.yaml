base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/017.yaml
  text: And its floor was of fire[a], and above it were lightnings and the path of the stars[b], and its ceiling was blazing fire.
translation:
  language: de
  text: Und sein Boden war aus Feuer, und über ihm waren Blitze und die Bahn der Sterne[a], und seine Decke war loderndes Feuer[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Die Bahn der Sterne“ kann auch mit „der Lauf der Sterne“ wiedergegeben werden und ihre geordnete Bewegung am Himmel bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Das mit „Decke“ wiedergegebene Wort kann auch „Dach“ oder, weniger wahrscheinlich, „Gewölbe/Firmament“ bedeuten, je nachdem, ob das Bild stärker architektonisch oder kosmisch verstanden wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: ምድሩሰ
  choice: sein Boden
  rationale: ምድር bezeichnet Erde oder Grund; im Zusammenhang des geschauten himmlischen Hauses gibt „Boden“ die Innenfläche natürlich wieder, ohne einen gepflasterten Untergrund vorauszusetzen.
- source_word: ዘእሳት
  choice: aus Feuer
  rationale: Die Genitivverbindung wird knapp und bildkräftig wiedergegeben; „aus Feuer“ entspricht im Deutschen natürlicher als „von Feuer“ der Aussage über die Beschaffenheit.
- source_word: መልዕልቴሁ
  choice: über ihm
  rationale: Die räumliche Bedeutung „oberhalb/über ihm“ bleibt erhalten und passt zur Beschreibung des Bauwerks.
- source_word: መበርቅት
  choice: Blitze
  rationale: Der Plural bewahrt die Vielzahl der visionären Lichterscheinungen und ist im modernen Deutschen idiomatisch.
- source_word: ምርዋፀ ከዋክብት
  choice: die Bahn der Sterne
  rationale: ምርዋፀ kann Weg, Lauf oder Bahn bezeichnen. „Bahn“ lässt sowohl eine sichtbare Himmelsbahn als auch die geordnete Bewegung der Sterne anklingen.
- source_word: ጠፈሩኒ
  choice: seine Decke
  rationale: Das Wort bezeichnet wahrscheinlich die obere Bedeckung beziehungsweise das Dach. Im Inneren des geschauten Hauses ist „Decke“ naheliegend, ohne die mögliche kosmische Bedeutung ganz auszuschließen.
- source_word: እሳት ዘይነድድ
  choice: loderndes Feuer
  rationale: Die Konstruktion bedeutet wörtlich „Feuer, das brennt“. „Loderndes Feuer“ wahrt Intensität und Bildhaftigkeit in natürlichem Deutsch.
theological_decisions:
- issue: Architektonische und kosmische Bildsprache des himmlischen Bauwerks
  choice: Die räumlichen Begriffe werden als Merkmale eines Innenraums wiedergegeben („Boden“, „über ihm“, „Decke“), während „Blitze“ und „Bahn der Sterne“ die kosmische Dimension bewahren.
  alternative: Stärker kosmisch mit „Gewölbe/Firmament“ oder stärker gegenständlich mit „Dach“ übersetzen.
  rationale: Die Vision verbindet die Architektur eines himmlischen Hauses beziehungsweise Thronraums mit Himmelserscheinungen. Die Übersetzung soll diese Spannung nicht zugunsten nur einer Bildebene auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, rhythmischer Reihung. Die apokalyptische Bildsprache bleibt anschaulich; ungewöhnliche Mehrdeutigkeiten werden in Fußnoten offengehalten. Die Fußnotenmarker stehen jeweils bei dem Ausdruck, den die betreffende Anmerkung erläutert.
