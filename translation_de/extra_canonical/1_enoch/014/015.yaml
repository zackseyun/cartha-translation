base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/015.yaml
  text: And behold[a], another house, greater than that one, and every doorway stood open before me[c][b]; and it was built with tongues of fire.
translation:
  language: de
  text: Und siehe[a], ein anderes Haus, größer als jenes[b]; jede Tür stand vor mir offen[c], und es war mit Feuerzungen erbaut[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und seht“. Der Ausdruck leitet hier einen neuen Anblick innerhalb der Vision ein.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich mit einem fernen Demonstrativ: „größer als jenes“, nämlich als das zuvor gesehene Haus.'
    reason: source_clarification
  - marker: c
    text: 'Auch möglich: „Alle Türen waren vor mir offen.“ Die geʿezische Wendung kann distributiv („jede Tür“) oder zusammenfassend („alle Türen“) wiedergegeben werden.'
    reason: lexical_alternative
  - marker: d
    text: „Feuerzungen“ bewahrt das konkrete Bild zungenförmiger Flammen; manche Übersetzungen glätten es zu „Feuerflammen“.
    reason: lexical_alternative
lexical_decisions:
- source_word: ናሁ
  choice: siehe
  rationale: Bewahrt den hinweisenden, visionären Ausruf der apokalyptischen Erzählung; das im heutigen Deutsch ungebräuchlichere „siehe“ bleibt in diesem würdevollen visionären Register verständlich.
- source_word: ካልእ ቤት
  choice: ein anderes Haus
  rationale: Gibt die architektonische Bezeichnung unmittelbar wieder, ohne sie deutend als Tempel oder Palast festzulegen.
- source_word: ዘየዓቢ እምዝክቱ
  choice: größer als jenes
  rationale: „Größer“ lässt sowohl räumliche Größe als auch Erhabenheit anklingen; „jenes“ entspricht dem fernen Demonstrativ und verweist auf das zuvor gesehene Haus zurück.
- source_word: ኵሉ ኆኅተ
  choice: jede Türöffnung
  rationale: Bewahrt die distributive Formulierung und den Sinn einer Tür beziehungsweise Öffnung, ohne einen im Ausgangstext nicht ausdrücklich markierten Besitzer in den Haupttext einzuführen.
- source_word: ርኁት
  choice: stand … offen
  rationale: Gibt den statischen Zustand idiomatisch und anschaulich wieder.
- source_word: በቅድሜየ
  choice: vor mir
  rationale: Bewahrt die räumliche Perspektive des Sehers knapp und natürlich.
- source_word: ሕኑጽ
  choice: erbaut
  rationale: Passt zum Hausmotiv und gibt den architektonischen Zustand ohne zusätzliche Deutung wieder.
- source_word: በልሳናተ እሳት
  choice: mit Feuerzungen
  rationale: Erhält das konkrete, ungewöhnliche Bild zungenförmigen Feuers, statt es zu dem allgemeineren „Flammen“ zu glätten.
theological_decisions:
- issue: Bestimmung des visionären Bauwerks
  choice: Haus
  alternative: Palast oder Tempel
  rationale: Der geʿezische Text bezeichnet es als „Haus“. Der Zusammenhang kann an einen himmlischen Palast oder Tempel denken lassen, doch diese Identifikation wird nicht in den Haupttext eingetragen.
- issue: Art des feurigen Baumaterials beziehungsweise der Baugestalt
  choice: mit Feuerzungen erbaut
  alternative: aus Feuerflammen erbaut
  rationale: Die Formulierung bewahrt sowohl das konkrete Bild der „Zungen“ als auch eine gewisse Offenheit darüber, ob Feuerzungen als Material, Bauelemente oder Erscheinungsform gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst visionärem „siehe“. Die Satzglieder folgen dem fortschreitenden Blick des Sehers; das Semikolon trennt den neuen Bau von der Beschreibung seiner Öffnungen und seines feurigen Aufbaus, ohne den knappen apokalyptischen Stil aufzulösen.
