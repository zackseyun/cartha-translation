base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/011.yaml
  text: Its ceiling was like the path of the stars and the lightnings[a], and among them were fiery cherubim[c][b], and their heaven was water.
translation:
  language: de
  text: Seine Decke war wie die Bahn der Sterne und der Blitze[a]; mitten unter ihnen waren feurige Cherubim, und ihr Himmel war Wasser[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, wörtlicher: „der Lauf der Sterne und der Blitze“.'
    reason: lexical_alternative
  - marker: b
    text: „Ihr Himmel war Wasser“ ist eine schwierige Wendung. Gemeint sein könnte der mit den feurigen Cherubim verbundene Himmel oder der obere Bereich des geschauten Bauwerks; der Wortlaut legt den Bezug nicht eindeutig fest.
    reason: alternative_reading
lexical_decisions:
- source_word: ጠፈሩ
  choice: seine Decke
  rationale: Im unmittelbaren architektonischen Zusammenhang bezeichnet das Wort die obere Begrenzung des geschauten Bauwerks. „Decke“ ist hier natürlicher als das kosmischere „Firmament“.
- source_word: ሩጸተ
  choice: Bahn
  rationale: Das Wort bezeichnet Lauf oder Bewegung. Bei Sternen gibt „Bahn“ die sichtbare Bewegungsstrecke knapp und idiomatisch wieder; „Lauf“ bleibt als wörtlichere Möglichkeit in der Fußnote erhalten.
- source_word: ከዋክብት
  choice: Sterne
  rationale: Die übliche und kontextgemäße Wiedergabe der Himmelskörper.
- source_word: መበርቅት
  choice: Blitze
  rationale: Der Plural bewahrt die Mehrzahl beziehungsweise wiederholte Erscheinung im visionären Bild und klingt im Deutschen natürlich.
- source_word: ማእከሎሙ
  choice: mitten unter ihnen
  rationale: Die Wendung lokalisiert die Cherubim innerhalb der zuvor genannten Himmels- und Lichterscheinungen und erhält den räumlichen Bezug.
- source_word: ኪሩቤን
  choice: Cherubim
  rationale: Die im Deutschen geläufige traditionelle Bezeichnung für diese himmlischen Wesen wahrt den apokalyptischen Ton.
- source_word: ዘእሳት
  choice: feurige
  rationale: Die Genitivverbindung „des Feuers“ beschreibt die Cherubim durch Feuer. „Feurige“ ist knapp und lässt offen, ob Beschaffenheit oder Erscheinung gemeint ist.
- source_word: ሰማዮሙ
  choice: ihr Himmel
  rationale: Die Possessivform wird trotz ihrer ungewöhnlichen Aussage ausdrücklich bewahrt, statt sie als „der Himmel über ihnen“ zu glätten.
- source_word: ማይ
  choice: Wasser
  rationale: Das singularische Massenwort wird direkt wiedergegeben. Eine mögliche Anspielung auf himmlische Wasser wird nicht in den Haupttext hineinerklärt.
theological_decisions:
- issue: Die ungewöhnliche Aussage, dass „ihr Himmel Wasser war“
  choice: und ihr Himmel war Wasser
  alternative: und der Himmel über ihnen war Wasser / und ihr Himmel war wie Wasser
  rationale: Der gegebene ge'ezische Text enthält sowohl die Possessivform als auch eine direkte Nominalgleichsetzung ohne ausdrückliches „wie“. Die befremdliche apokalyptische Bildsprache wird daher nicht harmonisiert oder erklärend erweitert.
- issue: Bezug des Possessivpronomens in „ihr Himmel“
  choice: Bezug im Haupttext offengelassen
  alternative: ausdrücklicher Bezug auf die Cherubim oder auf den oberen Bereich des Bauwerks
  rationale: Die Form kann im Zusammenhang unterschiedlich zugeordnet werden. Eine eindeutige Festlegung würde eine im Ausgangstext bestehende Spannung beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter apokalyptischer Fremdheit. Die Wiederholung der entsprechenden Bildformel aus 1 Henoch 14,8 sollte in der deutschen Gesamtübersetzung möglichst mit derselben Formulierung „die Bahn der Sterne und die Blitze“ wiedergegeben werden.
