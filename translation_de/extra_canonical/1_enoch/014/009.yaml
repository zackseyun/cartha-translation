base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/009.yaml
  text: And I went in until I drew near to a wall built of stones of hail[a], and a tongue of fire surrounded it[e][d][c][b], and it began to make me afraid.
translation:
  language: de
  text: Und ich ging hinein, bis ich mich einer Mauer näherte, die aus Hagelsteinen[a] gebaut war. Eine Feuerzunge umgab sie, und das begann, mir Angst zu machen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „aus Steinen des Hagels“; möglich ist auch: „aus Hagelsteinen“.'
    reason: lexical_alternative
  - marker: b
    text: Der Schluss des Satzes ist in diesem Textzeugen schwierig; dem Sinn nach begann das Gesehene, Henoch Angst zu machen.
    reason: textual_variant
lexical_decisions:
- source_word: ወቦእኩ
  choice: Und ich ging hinein
  rationale: Gibt die Bewegung des Eintretens schlicht und in natürlichem modernem Deutsch wieder.
- source_word: እስከ፡ እቀርብ
  choice: bis ich mich ... näherte
  rationale: Bewahrt die fortschreitende Bewegung bis in die Nähe des beschriebenen Gegenstands.
- source_word: ጥቅም
  choice: Mauer
  rationale: Die Bedeutung wird durch das griechische τεῖχος und das aramäische שור gestützt; im unmittelbaren Baukontext ist „Mauer“ genauer als das allgemeinere „Bauwerk“.
- source_word: ዘሕንጽት፡ በእእባነ፡ በረድ
  choice: die aus Hagelsteinen gebaut war
  rationale: Gibt die Konstruktion idiomatisch wieder und erhält mit „Hagelsteinen“ die ungewöhnliche visionäre Stofflichkeit der wörtlichen Wendung „Steine des Hagels“.
- source_word: ልሳነ፡ እሳት
  choice: eine Feuerzunge
  rationale: Bewahrt den Singular des ge'ezischen Ausdrucks sowie das konkrete apokalyptische Bild.
- source_word: የዓውዳ
  choice: umgab sie
  rationale: Gibt das räumliche Umschließen klar wieder; das feminine Pronomen bezieht sich im Deutschen auf die Mauer.
- source_word: ወጠነ፡ ያፍርሀኒ
  choice: sie begann, mir Angst zu machen
  rationale: Bewahrt vorsichtig den in der vorliegenden Textgestalt naheliegenden Beginn-Aspekt und die kausative Bedeutung des Verbs für das Erschrecken.
theological_decisions:
- issue: Bewahrung der visionären Architektur- und Feuerbildsprache
  choice: Mauer aus Hagelsteinen ... eine Feuerzunge
  alternative: Bauwerk aus Hagel ... Flammen
  rationale: Die ungewöhnlichen Einzelbilder werden weder zu gewöhnlicher Architektur noch zu allgemeiner Feuersprache geglättet.
- issue: Bezug des letzten Satzglieds
  choice: sie begann, mir Angst zu machen
  alternative: ihr Fundament machte mir Angst
  rationale: Die Lesart „Fundament“ ist durch den angegebenen ge'ezischen Wortlaut nicht hinreichend gestützt. Das feminine „sie“ lässt im Deutschen jedoch offen, ob unmittelbar die Mauer oder die Feuerzunge als Auslöserin der Angst verstanden wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die auffällige apokalyptische Bildsprache und die Unsicherheit des letzten Satzglieds bleiben erhalten.
