base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/006.yaml
  text: And before this[a], you will have seen the destruction of your beloved sons, and you will not have them for yourselves[c][b], but they will fall before you by the sword.
translation:
  language: de
  text: Und zuvor werdet ihr den Untergang eurer geliebten Söhne gesehen haben[a]; ihr werdet sie nicht für euch haben[b], sondern sie werden vor euren Augen durch das Schwert fallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder einfacher: „Und zuvor werdet ihr den Untergang eurer geliebten Söhne sehen.“ Die Verbform kann im prophetischen Zusammenhang als Futur II oder als einfache Zukunft verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: 'Die äthiopische Lesart ist hier textkritisch schwierig und lässt sich wörtlich etwa mit „ihr werdet ihre Besitztümer/ihren Reichtum nicht haben“ wiedergeben. Die griechische Parallelüberlieferung hat sinngemäß: „Ihr werdet keine Freude und keinen Nutzen an ihnen haben.“'
    reason: textual_variant
lexical_decisions:
- source_word: እምቅድመ ዝንቱ
  choice: schon vorher
  rationale: Gibt die zeitliche Abfolge knapp und natürlich wieder, ohne den nicht ausdrücklich genannten Bezug von „dies“ näher festzulegen.
- source_word: ርኢክሙ
  choice: werdet ihr … gesehen haben
  rationale: Das Futur II bildet die im prophetischen Zusammenhang vorausliegende, vollendete Wahrnehmung ab; die einfachere Zukunft bleibt in einer Fußnote erhalten.
- source_word: ሐጕለ
  choice: Untergang
  rationale: Bezeichnet das gewaltsame Verderben, ohne den Vorgang stärker als die Vorlage auf „Vernichtung“ oder „Abschlachtung“ festzulegen.
- source_word: ውሉድክሙ ፍቁራን
  choice: eure geliebten Söhne
  rationale: „Söhne“ entspricht im unmittelbaren Zusammenhang den männlich bezeichneten Nachkommen der Wächter; „geliebten“ bewahrt die emotionale Färbung.
- source_word: አልብክሙ †ጥራያኒሆሙ†
  choice: Ihr werdet sie nicht mehr für euch haben
  rationale: Die überlieferte äthiopische Wortfolge ist textkritisch schwierig. Die gewählte Formulierung bewahrt den Gedanken des Verlusts und passt zum anschließenden Tod der Söhne, ohne die unsichere Lesart „ihre Schätze“ ungekennzeichnet in den Haupttext zu übernehmen.
- source_word: ይወድቁ ቅድሜክሙ በሰይፍ
  choice: sie werden vor euren Augen durch das Schwert fallen
  rationale: „Vor euren Augen“ gibt die Bedeutung „in eurer Gegenwart“ idiomatisch wieder; „durch das Schwert fallen“ erhält das apokalyptische Gerichtsbild und das gewaltsame Mittel.
theological_decisions:
- issue: Bezug von „eure geliebten Söhne“
  choice: Die angesprochenen Wächter müssen den gewaltsamen Untergang ihrer Nachkommen miterleben.
  alternative: Die Aussage könnte allgemein menschliche Väter oder Nachkommen betreffen.
  rationale: Der unmittelbare Kontext richtet das Gerichtswort an die Wächter und spricht von den aus ihren verbotenen Verbindungen hervorgegangenen Söhnen. Diese lokale Erzählfunktion wird beibehalten, ohne spätere Lehrsysteme einzutragen.
- issue: Sinn der textkritisch schwierigen Verlustformel
  choice: Die Wächter verlieren ihre Söhne und können sie nicht für sich behalten.
  alternative: 'Wörtlich nach dem schwierigen äthiopischen Wortlaut: „Ihr werdet ihre Besitztümer/ihren Reichtum nicht haben“; nach griechischer Parallelüberlieferung: „Ihr werdet keine Freude/keinen Nutzen an ihnen haben“.'
  rationale: Die Hauptfassung folgt der jüngsten textkritischen Entscheidung und dem Satzzusammenhang, während die tatsächlich überlieferten Alternativen ausdrücklich in der Fußnote offengelegt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Satzführung. „Vor euren Augen“ ist verständlicher als das steifere „vor euch“, während „durch das Schwert fallen“ den traditionellen apokalyptischen Klang bewahrt. Sämtliche für die Auslegung erheblichen sprachlichen und textkritischen Unsicherheiten werden in den Fußnoten offengelegt.
