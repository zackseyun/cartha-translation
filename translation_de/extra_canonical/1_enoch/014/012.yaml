translation:
  language: de
  text: Und rings um die Mauern brannte Feuer, und darunter loderte Feuer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der hier vorgelegte äthiopische Text lautet „unter ihm/ihnen“. Eine vorgeschlagene Emendation liest stattdessen: „und seine Türen brannten mit Feuer“; diese Lesart wird durch eine griechische Textüberlieferung gestützt.'
    reason: textual_variant
lexical_decisions:
- source_word: እሳት
  choice: Feuer
  rationale: Das Grundwort für „Feuer“ wird an beiden Stellen gleich wiedergegeben, um die eindringliche Wiederholung des äthiopischen Textes zu bewahren.
- source_word: ዘይነድድ
  choice: brannte
  rationale: Die relative Verbform beschreibt das brennende Feuer; „brannte“ ist im Deutschen natürlich und passt zum visionären Erzählstil.
- source_word: በአውደ
  choice: rings um
  rationale: Die Wendung bezeichnet eine umgebende räumliche Ausdehnung; „rings um“ gibt dies knapp und in würdigem Gegenwartsdeutsch wieder.
- source_word: አረፍት
  choice: die Mauern
  rationale: Das Wort ist als Plural „Mauern“ zu verstehen und bezeichnet ausdrücklich das von Feuer umgebene Bauelement.
- source_word: ጥሕቱ
  choice: unter ihnen
  rationale: Die räumliche Angabe wird entsprechend dem überlieferten Vers als „unter ihnen“ wiedergegeben; das Pronomen bezieht sich im deutschen Satz natürlich auf die Mauern.
- source_word: ይውዒ በእሳት
  choice: loderte Feuer
  rationale: Die Form bezeichnet ein aktives Brennen oder Lodern. Die Wiedergabe bewahrt das konkrete Feuerbild und vermeidet eine schwerfällige Wiederholung von „brannte mit Feuer“.
theological_decisions:
- issue: Ob die zweite Vershälfte anhand einer vorgeschlagenen Textrekonstruktion als Hinweis auf brennende Türen wiederzugeben ist
  choice: 'Dem vorgelegten äthiopischen Wortlaut folgen: „unter ihnen loderte Feuer“'
  alternative: „und seine Türen brannten mit Feuer“
  rationale: Der bereitgestellte äthiopische Haupttext bietet die räumliche Aussage „unter ihm/ihnen“. Die abweichende Lesart setzt eine Emendation voraus. Sie wird daher nicht stillschweigend in den Haupttext aufgenommen, sondern transparent in einer Fußnote genannt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem visionärem Klang. „Rings um“ und „loderte“ bewahren die lebhafte apokalyptische Bildsprache, ohne altertümlich zu wirken.
