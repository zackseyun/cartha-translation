base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/001.yaml
  text: This is the book of the words of righteousness and of the reproof of the vigilant ones who are from eternity[c][b][a], just as the Holy and Great One commanded in that vision.
translation:
  language: de
  text: Dies ist das Buch der Worte der Gerechtigkeit und der Zurechtweisung für die Wachsamen[a], die von alters her sind[b], wie der Heilige und Große es in jener Vision geboten hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Wächter“. Das ge’ezische Wort bezeichnet wörtlich wache oder wachsame Wesen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „die von Ewigkeit her sind“. Die Wendung kann sowohl uralte Herkunft als auch Ewigkeit ausdrücken.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መጽሐፈ
  choice: Buch
  rationale: Bezeichnet hier ein schriftliches Werk und passt zur überschriftartigen Funktion des Verses.
- source_word: ቃለ
  choice: Worte
  rationale: Die Einzahl kann kollektiv gebraucht werden; „Worte“ gibt den Inhalt des Buches natürlich und quellennah wieder.
- source_word: ጽድቅ
  choice: Gerechtigkeit
  rationale: Bewahrt das ethische und theologische Gewicht des Ausdrucks, ohne ihn auf Rechtsprechung zu verengen.
- source_word: ዘለፋ
  choice: Zurechtweisung
  rationale: Gibt den Sinn von Tadel oder Rüge in einem würdigen, verständlichen Register wieder.
- source_word: ትጉሃን
  choice: die Wachsamen
  rationale: Bildet die Bedeutung „wach, wachsam“ transparent ab und lässt zugleich den technischen Bezug auf die himmlischen Wächter erkennen.
- source_word: እለ እምዓለም
  choice: die von alters her sind
  rationale: Bewahrt den Gedanken uralter Herkunft, ohne den Wesen ausdrücklich absolute Ewigkeit zuzuschreiben.
- source_word: አዘዘ
  choice: geboten hat
  rationale: Entspricht dem direkten Verb des Befehlens und wahrt die Autorität des göttlichen Sprechers.
- source_word: ቅዱስ ወዓቢይ
  choice: der Heilige und Große
  rationale: Gibt die verbundenen göttlichen Epitheta unmittelbar wieder; das substantivierende Deutsch benötigt keinen Zusatz „Eine“.
- source_word: በይእቲ ራእይ
  choice: in jener Vision
  rationale: Bewahrt die mögliche lokale Bedeutung der Präposition und fügt sich natürlich in den Offenbarungsrahmen ein.
- source_word: በከመ
  choice: so wie
  rationale: Gibt den vergleichenden beziehungsweise modalen Sinn in modernem, natürlichem Deutsch wieder.
theological_decisions:
- issue: Identität der ትጉሃን
  choice: „die Wachsamen“ als Bezeichnung der himmlischen Wächter
  alternative: „die Wächter“ oder allgemein „die Wachenden“
  rationale: Der Kontext des Wächterbuchs spricht für eine bestimmte Klasse himmlischer Wesen. Die Wiedergabe bleibt nah am äthiopischen Wortsinn, während die Fußnote die traditionelle Benennung nennt.
- issue: Bedeutung von እለ እምዓለም
  choice: „die von alters her sind“
  alternative: „die von Ewigkeit her sind“
  rationale: Die Wendung kann ferne Vorzeit oder Ewigkeit bezeichnen. Die Hauptfassung vermeidet eine ontologische Festlegung, während die Alternative dokumentiert wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem Ton. Die überschriftartige Satzform und die apokalyptischen Titel bleiben erhalten; echte lexikalische und theologische Mehrdeutigkeit wird in den Fußnoten ausgewiesen.
