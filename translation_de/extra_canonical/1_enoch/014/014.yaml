base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/014.yaml
  text: And as I shook and trembled[a], I fell on my face and saw in the vision.
translation:
  language: de
  text: Und während ich bebte und zitterte[a], fiel ich auf mein Angesicht und sah in der Vision.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „während ich verstört war und zitterte“. Die beiden Verben sind eng verwandt und drücken zusammen heftige Furcht oder Erschütterung aus.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እንዘ
  choice: während
  rationale: Leitet einen gleichzeitigen Begleitumstand ein und verbindet das Beben und Zittern mit dem Niederfallen und Sehen.
- source_word: እትሀወክ
  choice: ich bebte
  rationale: Gibt die starke innere und körperliche Erschütterung im visionären Zusammenhang wieder, ohne sie auf bloße Angst zu verengen.
- source_word: እርዕድ
  choice: ich zitterte
  rationale: Bewahrt neben dem ersten Verb ein zweites, eng verwandtes körperliches Reaktionswort und damit die Intensität des Ausgangstextes.
- source_word: ወድቁ
  choice: ich fiel
  rationale: Die schlichte Bewegungsangabe entspricht dem Grundsinn; die folgende Wendung bezeichnet bereits die niedergeworfene Haltung.
- source_word: በገጽየ
  choice: auf mein Angesicht
  rationale: Bewahrt die konkrete, in Offenbarungsszenen typische Körperhaltung in würdiger, verständlicher Sprache.
- source_word: እሬኢ
  choice: ich sah
  rationale: Die geläufige Wiedergabe des visionären Sehens ist klar und vermeidet unnötig altertümliche Sprache.
- source_word: በራእይ
  choice: in der Vision
  rationale: Bewahrt die Präpositionalform und versteht die Vision als den bereits laufenden visionären Zusammenhang.
theological_decisions:
- issue: Die beiden Reaktionsverben als allgemeine innere Angst oder als körperlich-inneres Erschüttertsein wiedergeben
  choice: 'körperlich-inneres Erschüttertsein: „ich bebte und zitterte“'
  alternative: „ich war verstört und von Furcht erfüllt“
  rationale: Die zwei eng verbundenen Verben und die Intensität der apokalyptischen Szene bleiben erhalten, ohne beide zu einer abstrakten Gefühlsangabe einzuebnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Auf mein Angesicht“ ist leicht gehoben, bewahrt hier aber die konkrete biblisch-apokalyptische Haltung; die doppelte Reaktion „bebte und zitterte“ erhält die Intensität und die echte lexikalische Spannweite.
