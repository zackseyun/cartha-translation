base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/014/007.yaml
  text: And your petition on their behalf will not be granted; nor on your own behalf; and you yourselves, while you weep and make supplication, will not speak a single word from the book that I wrote.
translation:
  language: de
  text: Und eure Bitte für sie wird nicht gewährt werden[a], ebenso wenig eure Bitte für euch selbst. Und ihr selbst werdet, während ihr weint und fleht, kein einziges Wort aus dem Buch sprechen, das ich geschrieben habe.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wird nicht sein“; im Zusammenhang einer Bitte auch: „wird nicht zustande kommen“.'
    reason: lexical_alternative
  - marker: b
    text: Der letzte Satzteil ist schwierig. Gemeint sein könnte, dass die Wächter Henochs schriftliche Bitte vor Gott weder vortragen noch wiederholen oder für sich geltend machen können.
    reason: alternative_reading
lexical_decisions:
- source_word: ስእለትክሙ
  choice: eure Fürbitte
  rationale: Das Substantiv bezeichnet eine Bitte oder ein Flehen; „Fürbitte“ gibt im Zusammenhang die stellvertretende Bitte für andere natürlich und präzise wieder.
- source_word: በእንቲአሆሙ
  choice: für sie
  rationale: Die Präpositionalfügung bezeichnet hier das Eintreten zugunsten anderer.
- source_word: ኢይከውን
  choice: wird nicht gewährt werden
  rationale: Wörtlich heißt die Form „wird nicht sein“; auf eine Bitte bezogen bezeichnet sie idiomatisch, dass diese nicht zustande kommt beziehungsweise nicht gewährt wird.
- source_word: ወበእንቲአክሙ
  choice: ebenso wenig die für euch selbst
  rationale: Die parallele Präpositionalfügung gehört zur vorausgehenden Aussage über die nicht gewährte Bitte. Die Ellipse ist im Deutschen natürlich ergänzt.
- source_word: ወአንትሙሂ
  choice: Und ... ihr selbst
  rationale: Das Pronomen mit Enklitikon hebt die Angesprochenen hervor; „ihr selbst“ bewahrt diesen Nachdruck.
- source_word: እንዘ ትበክዩ ወታስተበቍዑ
  choice: während ihr selbst weint und fleht
  rationale: እንዘ führt eine begleitende Umstandsangabe ein. „Flehen“ ist gegenwärtig, verständlich und wahrt den eindringlichen Ton.
- source_word: ወኢትተናገሩ ወኢምንተ ቃለ
  choice: werdet ihr kein einziges Wort ... sprechen
  rationale: Die Wendung verstärkt die Negation. „Kein einziges Wort“ bildet diese Betonung im Deutschen klar ab.
- source_word: እምውስተ መጽሐፍ ዘጻሐፍኩ
  choice: aus dem Buch, das ich geschrieben habe
  rationale: Die Formulierung hält sowohl das konkrete Schriftstück als auch den ausdrücklichen Relativsatz des Ge’ez fest.
theological_decisions:
- issue: 'Bedeutung des letzten Satzteils: Verbot, Unvermögen oder Wirkungslosigkeit des Sprechens aus Henochs Schrift'
  choice: 'Die direkte Aussage wird beibehalten: Sie werden kein einziges Wort aus dem Buch sprechen.'
  alternative: 'Sie dürfen kein Wort daraus sprechen; oder: Durch das Buch erhalten sie keine Antwort.'
  rationale: Der Ge’ez-Text verneint unmittelbar das Sprechen der Angesprochenen. Ob dies Verbot, Unvermögen oder Ausschluss bezeichnet, wird nicht dogmatisch festgelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Fürbitte“ bewahrt den stellvertretenden Gebetskontext; „flehen“ vermeidet das heute steife „Bittflehen“. Die Parallelität der beiden Für-Phrasen und die mit እንዘ markierte Gleichzeitigkeit bleiben erhalten.
