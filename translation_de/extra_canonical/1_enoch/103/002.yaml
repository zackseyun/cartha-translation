base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/002.yaml
  text: For I know the mystery[a], and I have read the tablets of heaven, and I have seen the holy writings[c][b], and I found written in them and understood concerning them.
translation:
  language: de
  text: Denn ich kenne das Geheimnis und habe die Tafeln des Himmels[a] gelesen und die heilige Schrift[b] gesehen; ich fand darin geschrieben, was sie[c] betraf, und verstand es.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die „Tafeln des Himmels“ sind ein apokalyptisches Bild für himmlische Aufzeichnungen oder Beschlüsse; die Formulierung muss nicht im heutigen Sinn wörtlich verstanden werden.
    reason: cultural_note
  - marker: b
    text: Wörtlich „die heilige Schrift“ beziehungsweise „die heilige Aufzeichnung“. Im Ge’ez steht die Wendung im Singular; „die Schrift der Heiligen“ ist grammatisch weniger wahrscheinlich.
    reason: lexical_alternative
  - marker: c
    text: Worauf sich „sie“ bezieht, bleibt in diesem Vers offen.
    reason: ambiguity
lexical_decisions:
- source_word: ምሥጢረ
  choice: das Geheimnis
  rationale: Das Wort bezeichnet verborgenes, durch Offenbarung zugängliches Wissen. „Geheimnis“ bewahrt den apokalyptischen Klang, ohne den Inhalt näher festzulegen.
- source_word: ፀፍፀፈ፡ ሰማይ
  choice: die Tafeln des Himmels
  rationale: Die Wendung bezeichnet himmlische Aufzeichnungen oder Beschlüsse. „Tafeln“ erhält das konkrete Bild der antiken Überlieferung.
- source_word: ጽሕፈተ፡ ቅድስተ
  choice: die heilige Schrift
  rationale: Substantiv und Adjektiv stehen im Ge’ez im femininen Singular; auch das griechische Fragment bietet einen entsprechenden Singular. Daher ist nicht „Schrift der Heiligen“ und trotz der englischen Revisionsfassung auch nicht der Plural „Schriften“ zu übersetzen.
- source_word: ውስቴቶሙ
  choice: darin
  rationale: Das pluralische Pronomen bezieht sich am ehesten auf die zuvor genannten Tafeln des Himmels. Das deutsche „darin“ gibt den Bezug natürlich wieder, ohne die Tafeln nochmals zu nennen.
- source_word: አኩዐ
  choice: verstand es
  rationale: Das Verb beschreibt das Erfassen oder Begreifen des Gelesenen. Das ergänzte „es“ sorgt im Deutschen für einen vollständigen Satz, ohne einen neuen Inhalt einzuführen.
- source_word: በእንቲአሆሙ
  choice: über sie
  rationale: Die Präpositionalfügung bedeutet „über sie“ oder „sie betreffend“. Das Pronomen bleibt absichtlich ohne erklärende Identifizierung, da sein Bezug im Vers nicht eindeutig ist.
theological_decisions:
- issue: Deutung von ጽሕፈተ፡ ቅድስተ
  choice: die heilige Schrift
  alternative: die Schrift der Heiligen / die heiligen Schriften
  rationale: Die grammatische Kongruenz im Ge’ez und die griechische Parallelüberlieferung sprechen für ein feminines Singulargefüge „die heilige Schrift“. Eine Beziehung auf heilige Wesen beziehungsweise Engel wird daher nicht in den Text eingetragen.
- issue: Bezug von „über sie“
  choice: Pronomen unaufgelöst beibehalten
  alternative: eine bestimmte Personengruppe ausdrücklich nennen
  rationale: Der vorliegende Vers nennt den Bezug nicht eindeutig. Eine ausdrückliche Identifizierung würde die im Quelltext bestehende Mehrdeutigkeit theologisch oder erzählerisch festlegen.
translation_notes:
  register: Moderne, würdige Standardsprache mit leicht gehobenem apokalyptischem Ton. Das Perfekt gibt die vorausgegangenen Offenbarungserfahrungen natürlich wieder; das Präsens „ich kenne“ bezeichnet den daraus bestehenden Wissensstand. Das Semikolon hält die enge Gedankenfolge lesbar zusammen.
