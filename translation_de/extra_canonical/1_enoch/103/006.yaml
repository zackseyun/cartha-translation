base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/006.yaml
  text: And now they have died in prosperity and in wealth and they did not see distress and slaughter in their lifetime[a]; and they died in honor[c][b], and judgment was not executed against them in their lifetime.
translation:
  language: de
  text: Und nun sind sie in Wohlergehen[a] und Reichtum gestorben; Bedrängnis und Gemetzel haben sie zu ihren Lebzeiten nicht gesehen. Sie starben in Ehren[b], und zu ihren Lebzeiten wurde kein Gericht an ihnen vollstreckt.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „im Guten“. Das zugrunde liegende Wort kann allgemein Gutes oder günstige Umstände bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher auch: „in Herrlichkeit“ oder „in Ansehen“.'
    reason: lexical_alternative
  - marker: c
    text: Die vorliegende Textform kann äußerlich auch als „sie sahen“ gelesen werden. Wahrscheinlich liegt jedoch ein Überlieferungs- oder Transkriptionsfehler für „sie sahen nicht“ vor; „Bedrängnis und Gemetzel“ sind dann die direkten Objekte. Die Aussage beschränkt das ausgebliebene Gericht auf ihre Lebenszeit und verneint damit nicht notwendig ein späteres Gericht.
    reason: textual_and_theological_ambiguity
lexical_decisions:
- source_word: ሠናይ
  choice: Wohlergehen
  rationale: Das Wort bezeichnet hier im Zusammenhang mit Reichtum günstige Lebensumstände, ohne auf moralische Güte eingeengt zu werden.
- source_word: ብዕል
  choice: Reichtum
  rationale: Die Verbindung mit Wohlergehen weist auf materiellen Besitz oder Überfluss.
- source_word: ምንዳቤ
  choice: Bedrängnis
  rationale: Der Ausdruck bezeichnet Not oder leidvolle Bedrückung; „Bedrängnis“ wahrt den gehobenen apokalyptischen Ton.
- source_word: ቀትለ
  choice: Gemetzel
  rationale: Das Substantiv benennt gewaltsames Töten und ist stärker als das allgemeine „Tod“.
- source_word: ስብሐት
  choice: Ehren
  rationale: Im Kontext ihres Sterbens bezeichnet der Ausdruck gesellschaftliches Ansehen beziehungsweise einen ehrenvollen Zustand, nicht notwendig göttliche Herrlichkeit.
- source_word: ኵነኔ
  choice: Gericht
  rationale: „Gericht“ bewahrt den umfassenden forensischen Sinn, ohne ihn vorschnell auf Strafe oder Urteilsspruch zu verengen.
- source_word: ኢትገብረ ሎሙ
  choice: wurde kein Gericht an ihnen vollstreckt
  rationale: Die passive Formulierung gibt wieder, dass ein gerichtliches Handeln an ihnen zu Lebzeiten ausblieb.
theological_decisions:
- issue: Ob die Frevler jedem Gericht oder nur einem Gericht zu ihren Lebzeiten entgangen sind
  choice: Die Aussage wird ausdrücklich auf ihre Lebenszeit begrenzt.
  alternative: Sie seien endgültig jedem Gericht entgangen.
  rationale: Die wiederholte Zeitangabe „zu ihren Lebzeiten“ beschreibt das Ausbleiben irdischer Vergeltung, ohne über ein späteres Gericht abschließend zu entscheiden.
- issue: Textkritische und syntaktische Deutung von አርአዩ
  choice: Als fehlerhaft überliefertes beziehungsweise transkribiertes ኢርእዩ („sie sahen nicht“) verstanden; „Bedrängnis und Gemetzel“ sind direkte Objekte.
  alternative: „Und in Bedrängnis, und sie sahen Gemetzel.“
  rationale: Die fehlende Präposition vor den beiden Substantiven, der Verszusammenhang und die anschließende Aussage vom ausgebliebenen Gericht stützen die negative Lesart; wegen der abweichenden vorliegenden Zeichenfolge wird sie in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe an der äthiopischen Abfolge, wird aber durch Semikolon und klare deutsche Verbformen lesbar gemacht. Die textkritische Unsicherheit der Negation und die zeitliche Begrenzung des Gerichts werden nicht stillschweigend eingeebnet.
