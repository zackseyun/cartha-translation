base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/007.yaml
  text: Know that they will bring your souls down to Sheol[e][d][c][b][a], and their recompense will be evil and great.
translation:
  language: de
  text: Wisst, dass sie eure Seelen[a] in den Scheol[b] hinabführen[c] werden und dass eure Seelen elend sein werden und ihre Bedrängnis groß sein wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eure Geister“. Das geʽezische Wort kann Seelen oder Geister bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Der Scheol ist in jüdischer Überlieferung der Bereich der Toten; der Ausdruck bedeutet hier nicht ohne Weiteres „Hölle“.
    reason: cultural_note
  - marker: c
    text: 'Oder: „er wird eure Seelen in den Scheol hinabführen“.'
    reason: textual_or_grammatical_alternative
lexical_decisions:
- source_word: ታእምርዎሙ፡ እስመ
  choice: Wisst, dass
  rationale: Das Objektsuffix kann proleptisch auf den folgenden Inhaltssatz vorausweisen; im Deutschen gibt „Wisst, dass“ die Konstruktion natürlich und klar wieder.
- source_word: ለሲኦል
  choice: in den Scheol
  rationale: Der traditionsgeschichtlich geprägte Name für den Totenbereich bleibt erhalten, statt ihn auf „Grab“ oder eine allgemeine „Unterwelt“ zu reduzieren.
- source_word: ያወርዶዎሙ
  choice: sie … hinabführen werden
  rationale: Die Verbform bezeichnet das Hinabbringen bzw. Hinabführen; das nicht näher bestimmte pluralische Subjekt bleibt als „sie“ erhalten.
- source_word: ለመናፍስቲክሙ
  choice: eure Seelen
  rationale: Im Zusammenhang mit dem Hinabsteigen in den Scheol ist „Seelen“ idiomatisch; „Geister“ bleibt als echte lexikalische Alternative in der Fußnote erhalten.
- source_word: ወእኩያተ፡ ይከውና
  choice: Eure Seelen werden elend sein
  rationale: Das feminine Pluralprädikat bezieht sich auf መናፍስት. Die Wiederholung von „eure Seelen“ verdeutlicht im Deutschen den gegenüber dem vorherigen „sie“ wechselnden Bezug.
- source_word: ምንዳቤሆሙ
  choice: ihre Bedrängnis
  rationale: Das Substantiv bezeichnet Bedrängnis, Trübsal oder Leid, nicht eine Vergeltung; „Bedrängnis“ bewahrt den apokalyptischen Ernst ohne unnötige dogmatische Festlegung.
- source_word: ዐቢየ
  choice: wird groß sein
  rationale: Das abschließende Adjektiv prädiziert die Größe bzw. Schwere der Bedrängnis und behält seine hervorgehobene Schlussstellung soweit im Deutschen möglich bei.
theological_decisions:
- issue: Wiedergabe von ሲኦል
  choice: Scheol
  alternative: Grab; Unterwelt
  rationale: „Scheol“ bewahrt die jüdische Vorstellungswelt des Textes und legt den Ausdruck weder auf das physische Grab noch auf eine spätere Höllenvorstellung fest.
- issue: Wiedergabe von መናፍስት
  choice: Seelen
  alternative: Geister
  rationale: Beide Bedeutungen sind möglich. „Seelen“ passt zum nachtodlichen Gerichtskontext; die verbleibende anthropologische Mehrdeutigkeit wird durch eine Fußnote sichtbar gehalten.
- issue: Deutung von ምንዳቤ
  choice: Bedrängnis
  alternative: Trübsal; Leid
  rationale: Die lexikalische Bedeutung ist Not bzw. Bedrängnis. Die ältere Deutung als „Vergeltung“ wird nicht übernommen, da sie das Wort semantisch verfehlt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zweimalige Nennung von „eure Seelen“ vermeidet eine irreführende Pronomenfolge, da die pluralischen Handelnden des ersten Satzes und die Seelen als Subjekt des zweiten Satzes nicht dieselbe Bezugsgröße sind. „Scheol“ bleibt als erklärter Traditionsbegriff stehen.
