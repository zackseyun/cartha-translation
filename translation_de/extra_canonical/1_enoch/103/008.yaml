base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/008.yaml
  text: And into darkness and into a snare and into a blazing fire your spirits shall enter[a], into the great judgment; and the great judgment shall be for all the generations of eternity. Woe to you[e][d][c][b], for you have no peace.
translation:
  language: de
  text: Und in die Finsternis, in eine Schlinge und in loderndes Feuer wird euer Geist eingehen – in das große Gericht.[a] Das große Gericht aber wird für alle Geschlechter der Ewigkeit sein.[b] Wehe euch, denn ihr habt keinen Frieden!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung kann auch „zum großen Gericht“ wiedergegeben werden. Das zugrunde liegende Verhältniswort bezeichnet hier eine Richtung oder ein Ziel.
    reason: alternative_reading
  - marker: b
    text: 'Wörtlich: „für alle Geschlechter der Ewigkeit“. Die schwierige Formulierung hebt wahrscheinlich die umfassende und bleibende Reichweite dieses Gerichts hervor, ohne deren genaue Weise näher zu bestimmen.'
    reason: cultural_note
lexical_decisions:
- source_word: በጽልመት
  choice: in die Finsternis
  rationale: Die Präposition steht in einer Reihe von Zielangaben zum Verb „eingehen“; die deutsche Akkusativform gibt diese Richtung natürlich wieder.
- source_word: በመርበብት
  choice: in eine Schlinge
  rationale: Das Substantiv ist hier singularisch und bezeichnet ein Fangmittel. „Schlinge“ bewahrt das konkrete Bild und klingt im Deutschen natürlicher als „in ein Netz“.
- source_word: በላህብ ዘይነድድ
  choice: in loderndes Feuer
  rationale: Die Verbindung bezeichnet wörtlich eine Flamme beziehungsweise ein Feuer, das brennt; „loderndes Feuer“ erhält die verstärkte Gerichtsmetaphorik.
- source_word: ኀበ ኵነኔ ዐባይ
  choice: in das große Gericht
  rationale: ኀበ hat räumlich-direktionale Kraft. „In das“ setzt die Bewegung der vorangehenden Zielangaben fort, statt die Wendung als bloße Zweckangabe aufzulösen.
- source_word: ትበውእ መንፈስክሙ
  choice: wird euer Geist eingehen
  rationale: Das Nomen „Geist“ und das darauf bezogene Verb stehen im Singular, während das Possessivsuffix die angeredete Mehrzahl bezeichnet. Daher ist „euer Geist“ quellennäher als „eure Geister“.
- source_word: ኵነኔ ዐባይ
  choice: das große Gericht
  rationale: „Gericht“ bewahrt die Breite des Rechtsbegriffs und verengt ihn nicht vorschnell auf „Verdammnis“ oder „Strafe“.
- source_word: ለኵሉ ትውልደ ዓለም
  choice: für alle Geschlechter der Ewigkeit
  rationale: Die feierliche und schwierige Verbindung wird weitgehend formal bewahrt; ዓለም trägt hier den Sinn von unermesslicher beziehungsweise ewiger Dauer.
- source_word: ኴሌ ለክሙ
  choice: Wehe euch
  rationale: Dies ist die geläufige und kraftvolle deutsche Form der prophetischen Weheruf-Formel.
- source_word: እስመ አልብክሙ ሰላመ
  choice: denn ihr habt keinen Frieden
  rationale: Die direkte Formulierung erhält sowohl die Begründung als auch die Endgültigkeit der Aussage.
theological_decisions:
- issue: Bedeutung von „euer Geist“ im Gerichtskontext
  choice: Die singularische Form „euer Geist“ wird beibehalten, ohne daraus eine umfassende Lehre über den Zustand nach dem Tod abzuleiten.
  alternative: eure Geister; eure Seelen; ihr selbst
  rationale: Der Ausgangstext nennt ausdrücklich den „Geist“ im Singular mit einem Possessivsuffix der zweiten Person Plural. Die Übersetzung bewahrt diese sprachliche Spannung.
- issue: Bedeutungsumfang von ኵነኔ
  choice: Gericht
  alternative: Verdammnis; Verurteilung; Strafurteil
  rationale: Obwohl der Zusammenhang eindeutig strafend ist, lässt „Gericht“ den weiteren richterlichen Bedeutungsumfang des Wortes bestehen.
- issue: Dauer und Reichweite des großen Gerichts
  choice: für alle Geschlechter der Ewigkeit bestehen
  alternative: allen ewigen Geschlechtern widerfahren; für alle Generationen ewig sein
  rationale: Die schwer verständliche Formulierung wird nicht auf eine bestimmte dogmatische Erklärung reduziert. „Bestehen“ gibt idiomatisch wieder, dass das Gericht für diese Geschlechter gilt beziehungsweise fortdauert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter apokalyptischer Bildsprache. Der Satzbau wurde für deutsche Leser leicht gegliedert, ohne die Abfolge von Finsternis, Schlinge, Feuer und Gericht einzuebnen.
