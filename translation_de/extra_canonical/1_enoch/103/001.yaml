base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/001.yaml
  text: And now I know this mystery for you[a], O righteous ones, by the glory of the Great and Honored and Mighty One in dominion[c][b], and by his greatness I know it for you.
translation:
  language: de
  text: 'Und nun schwöre ich euch, ihr Gerechten: Bei der Herrlichkeit des Großen, Ehrwürdigen und an Herrschaft Mächtigen[a] und bei seiner Größe schwöre ich euch.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „des Großen und Ehrwürdigen und Mächtigen an Herrschaft“. „Herrschaft“ kann auch „Königsherrschaft“, „Reich“ oder „Regentschaft“ bedeuten. Wegen der gedrängten Formulierung ist auch eine abweichende Zuordnung der letzten Wörter denkbar.'
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: ወይእዜኒ
  choice: Und nun
  rationale: Bewahrt sowohl die Verknüpfung mit dem Vorhergehenden als auch den zeitlichen Übergang.
- source_word: እምሕል
  choice: ich schwöre
  rationale: Das Verb gehört zum Wortfeld des Schwörens bzw. Eides. Diese im Vers zweimal wiederholte Bedeutung passt zur anschließenden Formel mit „bei“ und ist gegenüber der konsultierten englischen Deutung „wissen“ quellenphilologisch vorzuziehen.
- source_word: ለክሙ
  choice: euch
  rationale: Die Präposition mit dem Suffix der zweiten Person Plural bezeichnet hier die Adressaten des Schwurs und wird im Deutschen idiomatisch mit dem Dativ wiedergegeben.
- source_word: ጻድቃን
  choice: ihr Gerechten
  rationale: Gibt die substantivierte Pluralform als direkte Anrede natürlich und mit dem für 1 Henoch typischen Gruppenbegriff wieder.
- source_word: በስብሐቱ
  choice: bei der Herrlichkeit
  rationale: In Verbindung mit dem Schwurverb bezeichnet die Präposition das, wobei geschworen wird; „Herrlichkeit“ bewahrt den erhabenen religiösen Sprachgebrauch.
- source_word: ለዐቢይ
  choice: des Großen
  rationale: Das substantivierte Adjektiv wird als Hoheitstitel bewahrt, ohne den gemeinten göttlichen Referenten durch den Zusatz „Gott“ ausdrücklich festzulegen.
- source_word: ወለክቡር
  choice: Ehrwürdigen
  rationale: Drückt Ehre und Würde aus und vermeidet eine unnötige Wiederholung von „Herrlichkeit“.
- source_word: ወዕዙዘ፡ መንግሥት
  choice: und an Herrschaft Mächtigen
  rationale: 'Versteht die Wortgruppe als dritte, auf denselben Hoheitsträger bezogene Beschreibung: Er ist hinsichtlich Herrschaft bzw. Herrschergewalt mächtig.'
- source_word: ወበዕበዩ
  choice: und bei seiner Größe
  rationale: Setzt die Schwurformel parallel zu „bei der Herrlichkeit“ fort und gibt den pronominalen Bezug ausdrücklich wieder.
theological_decisions:
- issue: Bedeutung des zweimaligen Verbs እምሕል
  choice: Der Sprecher schwört den Gerechten feierlich.
  alternative: Der Sprecher erklärt, für die Gerechten ein Geheimnis zu wissen.
  rationale: Die Wurzel und insbesondere die Konstruktion mit den durch በ eingeleiteten Größen sprechen für eine Eidesformel. Ein „Geheimnis“ steht nicht ausdrücklich im überlieferten ge’ezischen Wortlaut und wird daher nicht ergänzt.
- issue: Referent der Hoheitstitel
  choice: Die Titel „der Große, Ehrwürdige und an Herrschaft Mächtige“ bleiben als Titel stehen.
  alternative: Der Referent wird im Haupttext ausdrücklich als Gott oder Herr bezeichnet.
  rationale: Der Zusammenhang legt einen göttlichen Referenten nahe, doch der Wortlaut verwendet Hoheitsbezeichnungen. Die Übersetzung wahrt diese indirekte Benennung.
- issue: Syntaktische Zuordnung von መንግሥት
  choice: „Herrschaft“ bestimmt die Macht des zuvor genannten Hoheitsträgers näher.
  alternative: „das ehrwürdige und mächtige Königreich“ wird als eigenständige Größe verstanden.
  rationale: Die koordinierte Adjektivfolge wird am plausibelsten auf einen gemeinsamen Referenten bezogen. Die abweichende syntaktische Möglichkeit wird wegen der gedrängten Formulierung in einer Fußnote offengehalten.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die auffällige Wiederholung von „ich schwöre euch“ bleibt als Bestandteil der feierlichen Eidesformel erhalten. Der Doppelpunkt macht die folgende Schwurgrundlage im Deutschen verständlich, ohne sie inhaltlich zu ergänzen.
