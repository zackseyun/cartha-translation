base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/005.yaml
  text: Woe to you[a], dead sinners, when you die in the wealth of your sins, and those like you say about you, ‘Blessed are these sinners[d][c][b]; they have seen all their days.’
translation:
  language: de
  text: 'Wehe euch, ihr toten Sünder, wenn ihr im Reichtum eurer Sünden sterbt und Menschen euresgleichen über euch sagen: »Selig sind diese Sünder; sie haben alle ihre Tage gesehen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Sie haben alle ihre Tage erlebt«, das heißt, sie gelten als glücklich, weil sie anscheinend ihre volle Lebenszeit genießen konnten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Wehe euch
  rationale: Bewahrt den prophetischen Weheruf und seinen gerichtlichen Nachdruck.
- source_word: ምውታን፡ ኃጥኣን
  choice: ihr toten Sünder
  rationale: Gibt beide ausdrücklich bezeugten Wörter wieder und erhält die auffällige Spannung zur folgenden Aussage »wenn ihr … sterbt«.
- source_word: ሶበ፡ ትመውቱ
  choice: wenn ihr … sterbt
  rationale: Gibt den temporalen Satz unmittelbar und natürlich wieder.
- source_word: በብዕለ፡ ኃጢአትክሙ
  choice: im Reichtum eurer Sünden
  rationale: Folgt der als wahrscheinlich erkannten Lesart በብዕለ und bewahrt die Verbindung von Reichtum und Sünde, die in den Zusammenhang der Passage gehört.
- source_word: ወይብሉ፡ ዲቤክሙ
  choice: über euch sagen
  rationale: Gibt die Rede über die Verstorbenen in idiomatischem Deutsch wieder.
- source_word: እለ፡ ከማክሙ
  choice: euresgleichen
  rationale: Knappes, natürliches Deutsch für Menschen derselben Art oder Gesinnung.
- source_word: ብፁዓን፡ እሙንቱ
  choice: Glückselig sind diese
  rationale: Erhält den gehobenen, an eine Seligpreisung erinnernden Ausdruck und dessen ironische Umkehrung.
- source_word: ኵሎ፡ መዋዕሎሙ፡ ርእዩ
  choice: sie haben alle ihre Tage gesehen
  rationale: Bewahrt die bildhafte und möglicherweise mehrdeutige Redeweise, statt sie eindeutig als langes Leben auszulegen.
theological_decisions:
- issue: Urteil der gleichgesinnten Sünder über die Verstorbenen
  choice: Als ironische Seligpreisung wiedergegeben
  alternative: Als nüchterne Feststellung eines langen oder wohlhabenden Lebens
  rationale: Der Gegensatz zwischen dem göttlichen Weheruf und dem menschlichen Urteil bleibt sichtbar, ohne die Ironie erklärend in den Haupttext einzutragen.
- issue: Spannung zwischen »toten Sünder« und »wenn ihr sterbt«
  choice: Die Wiederholung des Todesmotivs bleibt erhalten
  alternative: »toten« aus stilistischen Gründen auslassen
  rationale: Der geʿezische Text nennt die Angesprochenen ausdrücklich tot; die ungewöhnliche zeitliche Spannung darf nicht stillschweigend geglättet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Weheruf und die ironische Seligpreisung bleiben gehoben; die ungewöhnliche Formulierung »alle ihre Tage gesehen« wahrt die Bildsprache und Mehrdeutigkeit des Ausgangstextes.
