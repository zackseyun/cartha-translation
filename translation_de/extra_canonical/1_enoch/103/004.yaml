revisions:
- from: Und eure Geister werden leben, ihr, die ihr in Gerechtigkeit gestorben seid,[a] und sie werden sich freuen und froh sein. Ihre Geister werden nicht zugrunde gehen, und das Gedenken an sie wird vor dem Angesicht des Großen[b] durch alle Geschlechter der Ewigkeit[c] fortbestehen. Und nun fürchtet euch nicht vor ihrer Erniedrigung.[d]
  to: Und eure Geister werden leben, ihr, die ihr in Gerechtigkeit gestorben seid,[a] und sie werden sich freuen und froh sein. Ihre Geister werden nicht zugrunde gehen, und ihr Gedenken wird vor dem Angesicht des Großen[b] für alle Generationen der Ewigkeit[c] sein. Und nun fürchtet euch nicht vor ihrer Erniedrigung.[d]
