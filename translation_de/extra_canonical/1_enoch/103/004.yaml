base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/004.yaml
  text: And your spirits will live[a], you who died in righteousness, and they will rejoice and be glad, and their spirits will not perish, and their remembrance will be before the face of the Great One for all the generations of eternity. And now[e][d][c][b], do not fear their humiliation.
translation:
  language: de
  text: Und eure Geister werden leben, ihr, die ihr in Gerechtigkeit gestorben seid,[a] und sie werden sich freuen und froh sein. Ihre Geister werden nicht zugrunde gehen, und ihr Gedenken wird vor dem Angesicht des Großen[b] für alle Generationen der Ewigkeit[c] sein. Und nun fürchtet euch nicht vor ihrer Erniedrigung.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Und euer Geist wird leben – ihr, deren Tod in Gerechtigkeit geschah.« Die ge’ezische Konstruktion lässt sowohl eine unmittelbare Anrede der gerecht Verstorbenen als auch eine nähere Bestimmung von »Geist« zu.'
    reason: grammatical_ambiguity
  - marker: b
    text: 'Wörtlich: »vor dem Angesicht des Großen«; dies ist eine bildhafte Wendung für die Gegenwart des erhabenen Herrschers im himmlischen Hof.'
    reason: cultural_note
  - marker: c
    text: 'Auch möglich: »für alle Generationen der Welt« beziehungsweise »des Zeitalters«. ዓለም kann je nach Zusammenhang »Welt«, »Zeitalter« oder »Ewigkeit« bedeuten.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: »vor ihrer Schmach« beziehungsweise »vor ihrer Schande«. Auf wen sich »ihrer« bezieht, bleibt im Text unausgesprochen.'
    reason: lexical_and_referential_ambiguity
lexical_decisions:
- source_word: የሐይዉ መንፈስክሙ
  choice: eure Geister werden leben
  rationale: Die Zukunftsaussage und die Anrede an eine Mehrzahl werden unmittelbar wiedergegeben. »Geister« bewahrt den Bedeutungsbereich von መንፈስ, ohne ihn auf eine spätere Lehre von der Seele festzulegen.
- source_word: ለእለ ሞትክሙ በጽድቅ
  choice: ihr, die ihr in Gerechtigkeit gestorben seid
  rationale: Die Wendung bestimmt die Angeredeten näher. Die substantivische Form »Gerechtigkeit« erhält den theologischen Leitbegriff, statt ihn lediglich adverbial als »gerecht« wiederzugeben.
- source_word: ይትፌሥሑ ወይትሐሠዩ
  choice: sie werden sich freuen und froh sein
  rationale: Die zwei nah verwandten Verben der Freude bleiben als feierliche Doppelung erhalten.
- source_word: ኢይትሐጐሉ መንፈሳቲሆሙ
  choice: ihre Geister werden nicht zugrunde gehen
  rationale: »Zugrunde gehen« gibt die negative Zukunftsaussage klar und mit ihrer eschatologischen Tragweite wieder.
- source_word: ዝካሮሙ
  choice: das Gedenken an sie
  rationale: »Gedenken« bezeichnet hier die bleibende erinnernde Gegenwart besser als das vorwiegend psychologische Wort »Erinnerung«.
- source_word: እምቅድመ ገጸ ለዐቢይ
  choice: vor dem Angesicht des Großen
  rationale: Die anschauliche Gegenwarts- und Hofsprache des äthiopischen Ausdrucks sowie der göttliche Beiname bleiben erhalten.
- source_word: ለኵሉ ትውልደ ዓለም
  choice: durch alle Geschlechter der Ewigkeit
  rationale: Im apokalyptischen Zusammenhang hat ዓለም temporalen Sinn. »Geschlechter« wahrt zugleich die generationale Formulierung des Ausgangstextes.
- source_word: ኢትፍርህዎ ለኀሣሮሙ
  choice: fürchtet euch nicht vor ihrer Erniedrigung
  rationale: Die Konstruktion und der unbestimmte Bezug des Pronomens werden nicht stillschweigend aufgelöst; ኀሣር kann Erniedrigung, Schmach oder Schande bezeichnen.
theological_decisions:
- issue: Bezeichnung der Fortexistenz nach dem Tod
  choice: Geister
  alternative: Seelen; Lebenshauch
  rationale: »Geister« entspricht መንፈስ und lässt die anthropologische Aussage des Textes stehen, ohne eine spätere dogmatische Präzisierung einzutragen.
- issue: Göttlicher Titel ለዐቢይ
  choice: der Große
  alternative: Gott; der große Gott
  rationale: Der Text verwendet einen Hoheitstitel und nicht ausdrücklich das allgemeine Wort für Gott. Der Titel wird deshalb als solcher bewahrt.
- issue: Dauer des Gedenkens
  choice: Ewigkeit
  alternative: Welt; Zeitalter
  rationale: Der Ausdruck bezeichnet in dieser apokalyptischen Formel eine unbegrenzte zeitliche Dauer; die mögliche wörtlichere Wiedergabe »Welt« wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht erhöhtem apokalyptischem Ton. Wiederholungen, göttlicher Hoheitstitel und echte grammatische beziehungsweise referenzielle Mehrdeutigkeiten wurden bewahrt; ungewöhnliche Formulierungen werden durch Fußnoten erschlossen.
