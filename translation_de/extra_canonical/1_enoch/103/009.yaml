base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/009.yaml
  text: Do not say[a], you righteous and good who are in life, “In the days of our affliction we toiled hard, and we saw every trouble, and we encountered many evils, and we were oppressed and made few[d][c][b], and our spirit became small.”
translation:
  language: de
  text: 'Sagt nicht[a] von den Gerechten und Guten, die am Leben sind: »In den Tagen unserer Bedrängnis mühten wir uns sehr ab, wir erlebten jede Not und begegneten vielen Übeln. Wir wurden unterdrückt und an Zahl vermindert, und unser Geist wurde klein.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Satzkonstruktion ist mehrdeutig. Möglich ist auch: »Sagt nicht, ihr Gerechten und Guten, die ihr am Leben seid: …«'
    reason: syntactic_ambiguity
  - marker: b
    text: 'Wörtlich: »Unser Geist wurde klein.« Gemeint sein können innere Schwächung, Entmutigung oder schwindender Mut; das Bild wird im Text nicht näher aufgelöst.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ኢትበልዎሙ፡ ለጻድቃን፡ ወኄራን
  choice: Sagt nicht von den Gerechten und Guten
  rationale: Die negative Pluralaufforderung und das Suffix der dritten Person werden möglichst direkt wiedergegeben. Die Präposition bei »den Gerechten« kann jedoch auch eine Anrede oder ein indirektes Objekt anzeigen; diese syntaktische Mehrdeutigkeit wird in Fußnote [a] bewahrt.
- source_word: እለ፡ ሀለዉ፡ ውስተ፡ ሕይወት
  choice: die am Leben sind
  rationale: Natürliches modernes Deutsch für die wörtlichere Wendung »die im Leben sind«, ohne sie auf ein künftiges oder ausschließlich geistliches Leben festzulegen.
- source_word: በመዋዕለ፡ ሥራሕነ፡ ዳማ፡ ጻመውነ
  choice: In den Tagen unserer Bedrängnis mühten wir uns sehr ab
  rationale: Der überlieferte Wortlaut ist an dieser Stelle schwierig. Die Übersetzung hält sowohl die schwere Not als auch die intensive Mühe fest, ohne die unsichere Wortform zu überpräzisieren.
- source_word: ወኵሎ፡ ሥራኀ፡ ርኢነ
  choice: wir erlebten jede Not
  rationale: Das wörtliche »wir sahen« bezeichnet idiomatisch das Erfahren; »Not« entspricht im Klagezusammenhang besser als das neutrale »Arbeit«.
- source_word: ወእኩያተ፡ ብዙኃተ፡ ረከብነ
  choice: und begegneten vielen Übeln
  rationale: Bewahrt sowohl den Plural »Übel« als auch das Verb des Findens oder Antreffens.
- source_word: ወተወጻዕነ
  choice: Wir wurden unterdrückt
  rationale: Die passive Form bezeichnet Bedrückung, ungerechte Behandlung oder erlittene Gewalt und sollte nicht bis zur völligen Vernichtung gesteigert werden.
- source_word: ወውኅድነ
  choice: und an Zahl vermindert
  rationale: Gibt die konkrete Vorstellung des Wenigerwerdens verständlich wieder, lässt aber offen, ob außer der Zahl auch Macht oder Stellung betroffen ist.
- source_word: ወንእስት፡ መንፈስነ
  choice: und unser Geist wurde klein
  rationale: Die auffällige Metapher innerer Verkleinerung bleibt erhalten; mögliche Bedeutungen wie Mutlosigkeit oder Schwäche werden nicht stillschweigend in den Haupttext eingesetzt.
theological_decisions:
- issue: Bedeutung der Gerechten und Guten, »die am Leben sind«
  choice: gegenwärtig lebende Gerechte und Gute
  alternative: Menschen im künftigen oder im geistlich verstandenen wahren Leben
  rationale: Die anschließende Klage handelt von erfahrener Bedrängnis und passt am unmittelbarsten zum gegenwärtigen irdischen Leben. Die Formulierung selbst bleibt jedoch schlicht und trägt keine weitergehende Lehrdeutung ein.
- issue: Sprecherbezug der Klage
  choice: Die Worte werden als eine Aussage über die Gerechten eingeführt
  alternative: Die Gerechten und Guten werden direkt aufgefordert, diese Klage nicht auszusprechen
  rationale: Das pronominale Suffix an ኢትበልዎሙ stützt den Bezug auf »sie«; die Präposition und der Kontext erlauben aber auch die direkte Anrede. Fußnote [a] hält diese echte syntaktische Spannung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem Ton. Die Klage bleibt rhythmisch und verständlich; ungewöhnliche Quellmetaphorik wird bewahrt. Alle Fußnotenmarker erscheinen im Haupttext.
