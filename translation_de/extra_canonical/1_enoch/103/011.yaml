base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/011.yaml
  text: We hoped to become the head[a], and we became the tail; we toiled, but we did not gain mastery over our labor; and we became food for sinners and for the lawless[c][b], and they laid their yoke heavily upon us.
translation:
  language: de
  text: Wir hofften, zum Haupt zu werden, doch wir wurden zum Schwanz. Wir mühten uns bei unserer Arbeit ab, gewannen aber keine Verfügungsgewalt über den Ertrag unserer Arbeit.[a] Wir wurden den Sündern und den Gesetzlosen zur Speise,[b] und sie ließen ihr Joch schwer auf uns lasten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die äthiopische Wendung ist schwierig. Möglich ist auch: „Wir mühten uns bei unserer Arbeit ab, erlangten aber keine Macht über unsere Arbeit“ oder „… über unseren Arbeitslohn“.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich „Speise“; das Bild besagt, dass sie den Sündern und Gesetzlosen wie Beute ausgeliefert wurden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ንሴፎ ንኩን ርእሰ
  choice: Wir hofften, zum Haupt zu werden
  rationale: Die Erwartung der Gemeinschaft und das konkrete Bild des Hauptes bleiben erhalten; „Haupt“ bildet den würdevollen, idiomatischen Gegenpol zu „Schwanz“.
- source_word: ወኮነ ዘነበ
  choice: doch wir wurden zum Schwanz
  rationale: Die adversative Wendung macht den im Äthiopischen angelegten Gegensatz deutlich, ohne das konkrete Umkehrbild zu verallgemeinern.
- source_word: ጻመውነ እንዘ ንትጌበር
  choice: Wir mühten uns bei unserer Arbeit ab
  rationale: Die Wiedergabe erfasst sowohl die Mühsal als auch die begleitende Arbeit und vermeidet eine im Text nicht vorhandene Verneinung oder Passivkonstruktion.
- source_word: ወኢሠለጥነ ዲበ ዳማነ
  choice: gewannen aber keine Verfügungsgewalt über den Ertrag unserer Arbeit
  rationale: ሠለጠ bezeichnet Macht oder Verfügungsmacht; ዳማነ ist im Zusammenhang als Arbeit, Lohn oder Frucht der Arbeit zu verstehen. „Ertrag unserer Arbeit“ ergibt im Unterdrückungskontext einen natürlichen deutschen Sinn, ohne die unsichere Stelle zu verdecken.
- source_word: መብልዕተ
  choice: zur Speise
  rationale: Die konkrete Metapher „Speise“ wird bewahrt; gemeint ist, dass die Bedrängten den Unterdrückern wie Beute ausgeliefert sind.
- source_word: ለኃጥኣን ወለዓማፅያን
  choice: den Sündern und den Gesetzlosen
  rationale: Das moralisch scharfe Begriffspaar wird beibehalten; „Gesetzlose“ gibt den zweiten Ausdruck präziser wieder als ein allgemeines „Übeltäter“.
- source_word: አክበዱ ላዕሌነ አርዑተ ዚአሆሙ
  choice: sie ließen ihr Joch schwer auf uns lasten
  rationale: Die konkrete Jochmetapher und die Vorstellung drückender Herrschaft bleiben in natürlichem, würdigem Deutsch sichtbar.
theological_decisions:
- issue: Konkretes Umkehrbild von Haupt und Schwanz
  choice: Haupt … Schwanz
  alternative: Anführer … Geringste
  rationale: Die Bildsprache soll nicht in eine bestimmte gesellschaftliche Rangordnung aufgelöst werden; so bleiben ihre sprichwörtliche Kraft und mögliche traditionsgeschichtliche Bezüge offen.
- issue: Bild der völligen Auslieferung an die Unterdrücker
  choice: zur Speise
  alternative: zur Beute
  rationale: „Speise“ entspricht dem konkreten Ausgangsbild, während „Beute“ bereits dessen Sinn auslegt. Eine Fußnote erläutert die Metapher.
- issue: Bild der bedrückenden Fremdherrschaft
  choice: sie ließen ihr Joch schwer auf uns lasten
  alternative: sie unterdrückten uns schwer
  rationale: Das Joch ist rhetorisch und theologisch bedeutsame Unterdrückungsbildsprache und wird daher nicht abstrahiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Klagesprache und die konkreten Bilder „Haupt/Schwanz“, „Speise“ und „Joch“ werden bewahrt. Die syntaktisch und lexikalisch unsichere Mittelpartie wird lesbar übersetzt und in Fußnote [a] transparent gemacht.
