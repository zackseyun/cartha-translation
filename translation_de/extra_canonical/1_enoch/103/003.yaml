base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/003.yaml
  text: For every good thing and joy and glory have been prepared and written down for the spirits of those who died in righteousness[a]; and much good will be given to you as the fruit of your labor[c][b], and your portion will abound beyond the portion of the living.
translation:
  language: de
  text: Denn alles Gute, alle Freude und alle Herrlichkeit sind für die Geister derer, die in Gerechtigkeit gestorben sind, bereitet und niedergeschrieben[a] worden; und viel Gutes wird euch als Frucht eurer Mühe[b] gegeben werden, und euer Anteil wird den Anteil der Lebenden weit übertreffen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „verzeichnet“. Die Formulierung kann an ein himmlisches Verzeichnis des für die gerecht Verstorbenen bestimmten Gutes erinnern.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Frucht eurer Mühe“. Das Bild bewahrt die Vorstellung, dass Mühe künftig Frucht trägt.'
    reason: lexical_alternative
  - marker: c
    text: 'Auch: „euer Anteil wird größer sein als der Anteil der Lebenden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: Denn
  rationale: Bewahrt die begründende oder erläuternde Verknüpfung mit dem vorausgehenden Zusammenhang, ohne sie stärker als nötig festzulegen.
- source_word: ኵሉ ሠናይ ወፍሥሓ ወክብር
  choice: alles Gute, alle Freude und alle Herrlichkeit
  rationale: Gibt die umfassende Dreierreihe natürlich und würdevoll wieder; „Herrlichkeit“ bewahrt im apokalyptischen Zusammenhang Gewicht und Glanz des Ausdrucks.
- source_word: ተደለወ ወተጽሕፈ
  choice: bereitet und niedergeschrieben worden
  rationale: Die beiden Passivformen bleiben erhalten. „Niedergeschrieben“ wahrt das konkrete Bild einer schriftlichen Aufzeichnung, ohne ausdrücklich himmlische Bücher einzuführen.
- source_word: ለመንፈሳቲሆሙ ለእለ ሞቱ በጽድቅ
  choice: für die Geister derer, die in Gerechtigkeit gestorben sind
  rationale: „Geister“ entspricht dem Quellbegriff genauer als „Seelen“; „in Gerechtigkeit“ erhält die substantivische Form und ihre mögliche theologische Weite.
- source_word: ወብዙኅ ሠናይ ይትወሀብ ለክሙ
  choice: und viel Gutes wird euch gegeben werden
  rationale: Eine klare futurische Passivform bewahrt den Verheißungscharakter.
- source_word: ተክለ ጻማክሙ
  choice: als Frucht eurer Mühe
  rationale: Bewahrt das Bild von Wachstum beziehungsweise Ertrag und verbindet es mit der aufgewandten Mühe, statt es zum abstrakten „Lohn“ zu verflachen.
- source_word: ወክፍልክሙ ፈድፋደ እምክፍለ ሕያዋን
  choice: und euer Anteil wird den Anteil der Lebenden weit übertreffen
  rationale: Gibt den komparativen Überschuss prägnant wieder; „Anteil“ passt zum Zuteilungs- und Lohngedanken, ohne ihn auf Erbsprache einzuengen.
theological_decisions:
- issue: Anthropologische Bezeichnung der Verstorbenen
  choice: Geister
  alternative: Seelen
  rationale: Der ge'ezische Ausdruck bezeichnet hier unmittelbar die Geister der Verstorbenen. „Seelen“ wäre geläufig, könnte aber spätere anthropologische Vorstellungen in den Wortlaut eintragen.
- issue: Bedeutung des Niedergeschriebenen
  choice: niedergeschrieben
  alternative: in den himmlischen Büchern verzeichnet
  rationale: Der Wortlaut legt eine schriftliche Aufzeichnung nahe, nennt an dieser Stelle jedoch weder den Himmel noch bestimmte Bücher. Die Übersetzung erhält das Bild, ohne es auszudeuten.
- issue: Verhältnis des künftigen Anteils zum Anteil der Lebenden
  choice: wird den Anteil der Lebenden weit übertreffen
  alternative: wird über den Anteil der Lebenden hinaus überreich sein
  rationale: Die gewählte Fassung wahrt die Vergleichsaussage klar und lässt offen, worin der größere Anteil genau besteht.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Der Satzbau bleibt eng an der ge'ezischen Aussagefolge, wird jedoch durch Artikelwiederholung und klare Vergleichsform idiomatisch gestaltet. Keine konfessionell festgelegte Deutung des Zustands der Toten oder der himmlischen Aufzeichnung wird hinzugefügt.
