base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/103/010.yaml
  text: And we were destroyed, and there was no one to help us with a word; and we found nothing. We were tormented and destroyed, and we had no hope of seeing life from day to day.
translation:
  language: de
  text: Und wir gingen zugrunde[a], und niemand war da, der uns auch nur mit einem Wort[b] half; und wir fanden nichts[c]. Wir wurden gequält und gingen zugrunde, und wir hatten keine Hoffnung, von Tag zu Tag das Leben zu sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wir kamen um“ beziehungsweise „wir wurden ins Verderben gestürzt“. Dasselbe Verb steht später im Vers noch einmal.'
    reason: lexical_alternative
  - marker: b
    text: „Mit einem Wort“ kann bedeuten, dass niemand uns auch nur durch Zuspruch, Bitte oder Fürsprache zu Hilfe kam.
    reason: cultural_note
  - marker: c
    text: 'Der Satz ist sprachlich schwierig. Möglich ist auch: „und wir erlangten nichts“ oder „und auf keinerlei Weise fanden wir Erleichterung“.'
    reason: textual_variant
lexical_decisions:
- source_word: ተሐጕልነ
  choice: wir gingen zugrunde
  rationale: Das zweimal vorkommende Verb bezeichnet schweren Untergang oder Ruin. „Zugrunde gehen“ bewahrt die Härte und die bedeutungsvolle Wiederholung, ohne zwingend eine vollendete Vernichtung zu behaupten.
- source_word: አልቦ፡ ዘይረድአነ
  choice: niemand war da, der uns … geholfen hätte
  rationale: Die Konstruktion bezeichnet hier das Fehlen einer helfenden Person; die deutsche Formulierung gibt den Klagecharakter natürlich wieder.
- source_word: በነገር
  choice: auch nur mit einem Wort
  rationale: Die relativ wörtliche Wiedergabe erhält den Gedanken, dass selbst Hilfe durch Rede, Fürsprache oder Zuspruch ausblieb. „Auch nur“ verdeutlicht den im Zusammenhang naheliegenden emphatischen Sinn, ohne ihn im Haupttext festzulegen.
- source_word: ወኢበምንትኒ፡ ኢረከብነ
  choice: und wir fanden nichts
  rationale: Die schwierige Wendung lässt offen, ob vom Finden, Erlangen oder Erfahren von Hilfe die Rede ist. Die knappe Wiedergabe bewahrt diese Unbestimmtheit.
- source_word: ተጸዐርነ
  choice: wir wurden gequält
  rationale: Das Verb kann Bedrängnis, schwere Plage oder Unterdrückung bezeichnen. „Gequält“ passt zur gesteigerten Klage, während die Fußnote nicht nötig ist, da keine entscheidende theologische Festlegung entsteht.
- source_word: ኢተስፈውነ
  choice: wir hatten keine Hoffnung
  rationale: Die Form drückt hier den völligen Mangel an Hoffnung aus und nicht bloß einen einzelnen unterlassenen Hoffnungsakt.
- source_word: ከመ፡ ንርአይ፡ ሕይወተ፡ ዕለት፡ እምዕለት
  choice: von Tag zu Tag das Leben zu sehen
  rationale: Die Wiedergabe erhält das Bild des Sehens von Leben und zugleich den zeitlichen Sinn fortdauernden Überlebens.
theological_decisions:
- issue: Ob die Klage zu einer allgemeinen Aussage über Leiden geglättet oder in ihrer wiederholten Untergangssprache bewahrt werden soll
  choice: Die Wiederholung von „wir gingen zugrunde“ und die ausdrückliche Hoffnungslosigkeit bleiben erhalten.
  alternative: Die Wiederholung zu einer einzigen allgemeinen Aussage über Elend oder Bedrängnis zusammenziehen.
  rationale: Die Wiederholung verstärkt die apokalyptische Klage. Ihre Beibehaltung bewahrt die rhetorische und theologische Spannung des Textes, statt das Leiden zu verallgemeinern oder abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt klageartig und leicht gehoben; die markante Wiederholung sowie das Bild, „das Leben zu sehen“, werden nicht geglättet.
