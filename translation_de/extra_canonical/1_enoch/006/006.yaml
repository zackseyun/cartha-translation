base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/006.yaml
  text: And all of them were two hundred[a], and they came down onto Ardis[b], which is the summit of Mount Hermon.
translation:
  language: de
  text: Und sie alle – zweihundert an der Zahl – stiegen auf Ardis[a] hinab, den Gipfel des Berges Hermon.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die genaue Umschrift des Ortsnamens „Ardis“ ist unsicher. Im Ge’ez bezeichnet er hier den Ort, der mit dem Gipfel des Berges Hermon gleichgesetzt wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: ኵሎሙ
  choice: sie … insgesamt
  rationale: Die Verbindung gibt die Gesamtheit der zuvor genannten Gruppe idiomatisch wieder, ohne die ausdrückliche kollektive Bedeutung abzuschwächen.
- source_word: ክልኤ ምእት
  choice: zweihundert
  rationale: Die einfache Zahlform wird im Deutschen ebenso knapp und unmittelbar wiedergegeben.
- source_word: ወወረዱ
  choice: stiegen … hinab
  rationale: Die Form bezeichnet eine Abwärtsbewegung. „Hinabsteigen“ bewahrt die räumliche, im Zusammenhang auch kosmische Bewegung, ohne sie theologisch auszudeuten.
- source_word: ውስተ
  choice: nach
  rationale: Die Präposition bezeichnet hier das Ziel der Bewegung. Vor dem als Ortsnamen verstandenen „Ardis“ klingt „nach“ im Deutschen natürlicher als ein wörtliches „in“, während die genaue topografische Beziehung im folgenden Satzteil erläutert wird.
- source_word: አርዲስ
  choice: Ardis
  rationale: Der unsichere Ortsname wird aus dem Ge’ez transliteriert und nicht übersetzt.
- source_word: ዝውእቱ ድማኁ ለደብረ አርሞን
  choice: so heißt der Gipfel des Berges Hermon
  rationale: Die Formulierung gibt die Identifizierung von Ardis mit dem Gipfel des Hermon in natürlichem Deutsch wieder. Das etwas erklärende „so heißt“ vermeidet eine unklare Genuszuweisung beim fremden Eigennamen.
theological_decisions:
- issue: Darstellung des Hinabsteigens der Wächter
  choice: stiegen … hinab
  alternative: kamen … herab
  rationale: „Stiegen hinab“ bildet die im Ge’ez bezeichnete Abwärtsbewegung direkt ab und erhält die apokalyptische räumliche Bildwelt, ohne zusätzliche Aussagen über Ausgangspunkt oder Wesen der Gestalten einzuführen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Satzverbindung bewahrt den fortlaufenden Stil des Ge’ez; der Gedankenstrich macht die nachfolgende Identifizierung des Ortsnamens klar lesbar.
