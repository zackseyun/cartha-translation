  source_fidelity: 'Die Übersetzung gibt die ge''ezische Satzstruktur korrekt wieder: Die Engel sind eindeutig Subjekt von »sahen« und »begehrten«. Beide Bezeichnungen, »Engel« und »Söhne des Himmels«, bleiben erhalten. »begehrten« und »Nachkommen zeugen« treffen den zurückhaltenden, aber deutlichen Wortlaut angemessen.'
  naturalness: Der Ausdruck »Frauen aus den Menschenkindern« ist im heutigen Standarddeutsch missverständlich, da »Menschenkinder« leicht konkret als Kinder gelesen wird und »aus« die Auswahl von Frauen aus einer Gruppe von Kindern nahelegen kann. »Frauen unter den Menschen« ist idiomatischer und macht die gemeinte Gegenüberstellung zu den himmlischen Wesen klar. Der wörtlichere Ausdruck kann in einer Fußnote dokumentiert werden.
  terminology: »Söhne des Himmels« bewahrt die Terminologie des Ausgangstextes. »Frauen« ist gegenüber »Ehefrauen« richtig zurückhaltend. Die Fußnote soll die Quelle mit »Kinder der Menschen« erklären, ohne den missverständlichen Ausdruck »Menschenkinder« im Haupttext zu erzwingen.
