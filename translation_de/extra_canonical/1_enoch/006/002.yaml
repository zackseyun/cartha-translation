base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/002.yaml
  text: And the angels[a], the sons of heaven, saw them and desired them. And they said among themselves, “Come, let us choose for ourselves wives from the children of men[d][c][b], and let us beget children for ourselves.”
translation:
  language: de
  text: 'Und die Engel, die Söhne des Himmels, sahen sie[a] und begehrten sie. Da sagten sie zueinander: »Kommt, lasst uns unter den Menschen Frauen[b] für uns auswählen und uns Nachkommen zeugen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Pronomen »sie« bezieht sich auf die im vorherigen Vers genannten Frauen; der Ge’ez-Text wiederholt hier das Wort »Frauen« nicht ausdrücklich.
    reason: cross_reference
  - marker: b
    text: 'Wörtlich: »aus den Kindern der Menschen«. Die Formulierung bezeichnet menschliche Nachkommenschaft im Gegensatz zu den himmlischen Wesen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርእዩ ኪያሆን
  choice: sahen sie
  rationale: Das direkte Verb des Sehens und das feminine Pluralpronomen werden ohne erklärende Ergänzung im Haupttext wiedergegeben; der Bezug auf die Frauen aus dem vorherigen Vers bleibt erhalten.
- source_word: መላእክት ውሉደ ሰማያት
  choice: die Engel, die Söhne des Himmels
  rationale: Beide ausdrücklichen Bezeichnungen werden appositionell bewahrt, statt zu einer einzigen Benennung verschmolzen zu werden.
- source_word: ወፈተውዎን
  choice: begehrten sie
  rationale: »Begehren« gibt das starke Verlangen wieder, ohne dessen sexuelle oder emotionale Färbung über den Wortlaut hinaus festzulegen.
- source_word: በበይናቲሆሙ
  choice: zueinander
  rationale: Natürliche deutsche Wiedergabe der wechselseitigen Rede innerhalb der Gruppe.
- source_word: ንዑ
  choice: Kommt
  rationale: Bewahrt den direkten auffordernden Auftakt der gemeinsamen Rede.
- source_word: ንሕረይ ለነ አንስተ
  choice: lasst uns Frauen ... für uns auswählen
  rationale: Das Verb bezeichnet ein Auswählen; »Frauen« bewahrt die lexikalische Offenheit besser als das bereits statusbestimmende »Ehefrauen«, während der Kontext die beabsichtigte Verbindung erkennen lässt.
- source_word: እምውሉደ ሰብእ
  choice: aus den Menschenkindern
  rationale: Die gehobene Gegenüberstellung zwischen den Söhnen des Himmels und menschlicher Nachkommenschaft bleibt erhalten.
- source_word: ወንለድ ለነ ውሉደ
  choice: und uns Nachkommen zeugen
  rationale: »Nachkommen zeugen« gibt den Vorgang idiomatisch und würdevoll wieder; das reflexive »uns« bewahrt den Nutznießerbezug des Ge’ez.
theological_decisions:
- issue: Identität der Wesen als Engel und Söhne des Himmels
  choice: 'Beide Bezeichnungen appositionell bewahren: »die Engel, die Söhne des Himmels«'
  alternative: Nur »Engel«, nur »Söhne des Himmels« oder zusammengezogen »Himmelsengel«
  rationale: Der Ge’ez-Text nennt ausdrücklich beide Bezeichnungen. Ihre Beibehaltung vermeidet eine theologische Einebnung.
- issue: Stärke und Art des Begehrens
  choice: »begehrten sie«
  alternative: »gelüstete es nach ihnen« oder »verliebten sich in sie«
  rationale: Der Kontext weist auf eine unerlaubte Verbindung, doch der Wortlaut verlangt weder eine explizit sexualisierte noch eine romantisierende Ausdeutung.
- issue: Status der ausgewählten Frauen
  choice: »Frauen«
  alternative: »Ehefrauen«
  rationale: »Frauen« wahrt die sprachliche Offenheit des Nomens und legt keinen bereits rechtmäßig begründeten Ehestatus fest; die beabsichtigte Verbindung ergibt sich aus dem Zusammenhang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem apokalyptischem Ton. Die Satzstellung macht eindeutig, dass die Engel das Subjekt des Sehens sind. Archaische Formen werden vermieden; die Parallelität von »Söhne des Himmels« und »Menschenkinder« bleibt hörbar.
