base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/003.yaml
  text: And Semyaza[a], who was their leader, said to them, “I fear that you may not be willing to do this deed[b], and I alone will become liable for a great sin.”
translation:
  language: de
  text: 'Und Semjasa[a], ihr Anführer, sagte zu ihnen: »Ich fürchte, ihr werdet nicht bereit sein, diese Tat auszuführen, und ich allein werde für eine große Sünde büßen müssen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit »ihr Anführer« wiedergegebene ge’ezische Wort bedeutet wörtlich eher »ihr Engel« oder »ihr Bote«; im Zusammenhang bezeichnet es Semjasa als Oberhaupt der Gruppe.
    reason: lexical_alternative
lexical_decisions:
- source_word: ስምያዛ
  choice: Semjasa
  rationale: Der Personenname wird entsprechend der im Deutschen geläufigen Form lautnah wiedergegeben.
- source_word: መልአኮሙ
  choice: ihr Anführer
  rationale: Das Wort ist wörtlich mit »ihr Engel/Bote« verwandt, bezeichnet hier aber im Zusammenhang Semjasas leitende Stellung innerhalb der Gruppe; die wörtliche Möglichkeit bleibt in der Fußnote sichtbar.
- source_word: እፈርህ
  choice: ich fürchte
  rationale: Direkte, natürliche Wiedergabe der Ich-Form und des besorgten Tons.
- source_word: ኢትፍቅዱ
  choice: ihr nicht bereit sein könntet
  rationale: Bewahrt den Sinn von Willigkeit beziehungsweise Zustimmung sowie die nach »ich fürchte« ausgedrückte Befürchtung.
- source_word: ይትገበር ዝንቱ ግብር
  choice: diese Tat auszuführen
  rationale: Gibt sowohl das Vollbringen als auch den moralisch gewichtigen Charakter der Tat idiomatisch wieder.
- source_word: ባሕቲትየ
  choice: ich allein
  rationale: Erhält die nachdrückliche Vorstellung, dass Semjasa die Folgen ohne die anderen tragen müsste.
- source_word: ፈዳዪ
  choice: büßen muss
  rationale: Bringt die rechtlich-moralische Bedeutung des Einstehens beziehungsweise Strafetragens in natürlichem Deutsch zum Ausdruck, ohne die konkrete Strafe festzulegen.
- source_word: ለኃጢአት ዐባይ
  choice: für eine große Sünde
  rationale: Transparente Wiedergabe der schweren sittlichen Verfehlung ohne abschwächende oder konfessionell geprägte Deutung.
theological_decisions:
- issue: Semjasas Rolle gegenüber den übrigen Wächtern
  choice: ihr Anführer
  alternative: ihr Engel / ihr Bote
  rationale: Der Kontext stellt Semjasa als Leiter der Gruppe dar. Die funktionale Wiedergabe vermeidet den missverständlichen Eindruck, er sei ein anderer Engel, verschweigt die wörtliche Form aber nicht.
- issue: Rechtlich-moralische Tragweite von ፈዳዪ
  choice: büßen muss
  alternative: dafür einstehen muss / haftbar werde
  rationale: Die Übersetzung wahrt den Gedanken, die Folgen oder Strafe der großen Sünde tragen zu müssen, ohne die genaue Art dieser Folgen zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt feierlich, aber allgemein verständlich; die syntaktische Wiederholung »dass … und dass …« verdeutlicht die beiden Gegenstände von Semjasas Befürchtung.
