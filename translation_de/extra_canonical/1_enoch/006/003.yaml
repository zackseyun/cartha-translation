  source_fidelity: 'Die Wiedergabe trifft die Aussage im Wesentlichen: Semjasa spricht als Leiter der Gruppe, fürchtet mangelnde Zustimmung der anderen und rechnet damit, die Schuld beziehungsweise Strafe allein tragen zu müssen. Das Modalverb „könntet“ schwächt jedoch die erwartete bzw. befürchtete Verweigerung unnötig ab. „büßen muss“ lässt zudem die zukunftsbezogene Folge weniger deutlich hervortreten.'
