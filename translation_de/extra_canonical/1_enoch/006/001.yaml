base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/001.yaml
  text: And it came to pass[a], when the children of men had multiplied in those days, daughters were born to them, beautiful and comely.
translation:
  language: de
  text: 'Und es geschah: Als die Menschen sich in jenen Tagen vermehrten, wurden ihnen schöne und anmutige Töchter geboren.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ወኮነ
  choice: Und es geschah
  rationale: Die formelhafte Eröffnung leitet einen neuen Erzählabschnitt ein. Die deutsche Wendung bewahrt den gehobenen biblisch-apokalyptischen Ton und bleibt allgemein verständlich.
- source_word: እምዘ በዝኁ
  choice: Als sich ... vermehrten
  rationale: Die Konstruktion gibt den zeitlichen Umstand des folgenden Geschehens an; „sich vermehrten“ bezeichnet zugleich die zahlenmäßige Zunahme.
- source_word: ውሉደ ሰብእ
  choice: die Menschenkinder
  rationale: Die herkömmliche Bezeichnung für menschliche Nachkommen bleibt erkennbar und bereitet den Gegensatz zu den himmlischen Wächtern in den folgenden Versen vor, ohne nur männliche Menschen zu bezeichnen.
- source_word: በእማንቱ መዋዕል
  choice: in jenen Tagen
  rationale: Die geläufige apokalyptische Zeitformel wird in natürlichem, würdevollem Deutsch wiedergegeben.
- source_word: ተወልዳ ሎሙ አዋልድ
  choice: wurden ihnen ... Töchter geboren
  rationale: Die passive Form und der Bezug auf die Menschenkinder werden unmittelbar bewahrt; „Töchter“ entspricht dem literarischen Register und weist auf den folgenden Vers voraus.
- source_word: ሠናያት
  choice: schöne
  rationale: Das Adjektiv bezeichnet Schönheit beziehungsweise ansprechendes Aussehen; „schön“ ist die natürliche moderne Entsprechung.
- source_word: ወላሕያት
  choice: anmutige
  rationale: Das zweite Adjektiv verstärkt die Beschreibung, ohne sie mit dem ersten gleichzusetzen; „anmutig“ wahrt den gehobenen Ton und die doppelte Charakterisierung.
theological_decisions:
- issue: Anthropologische Bezeichnung im Gegensatz zu den himmlischen Wesen des folgenden Zusammenhangs
  choice: Menschenkinder
  alternative: Söhne der Menschen; Menschen
  rationale: „Menschenkinder“ bewahrt die traditionelle, auf menschliche Nachkommenschaft bezogene Wendung und den literarischen Gegensatz zu den Wächtern, ohne den Ausdruck unnötig auf männliche Personen zu beschränken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter biblisch-apokalyptischer Eröffnungsformel. Der Doppelpunkt macht die zeitliche Einleitung klar, ohne die knappe Satzstruktur des Ausgangstextes unnötig auszubauen.
