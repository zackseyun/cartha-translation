review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt መሐሉ zutreffend als „schworen“ wieder und bewahrt mit „alle gemeinsam“ die doppelte Betonung von Gesamtbeteiligung und Gemeinsamkeit (ኵሎሙ ኅቡረ). Auch die fluchbewehrte gegenseitige Bindung in ወአውገዙ ... በበይናቲሆሙ ist sachlich erfasst. „Deswegen“ ist jedoch im Deutschen primär kausal („aus diesem Grund“), während ቦቱ hier den Gegenstand der Handlung meint: „betreffend/darüber“.'
  naturalness: „Jemanden unter einen Fluch binden“ ist verständlich, aber im modernen Standarddeutsch weniger idiomatisch und kann den Eindruck erwecken, die anderen würden einem Fluch ausgeliefert. „Einander durch einen Fluch binden“ erhält die Bildlichkeit und macht die Art der gegenseitigen Verpflichtung klarer.
  terminology: „Fluch“ ist für die im Kontext imprekatorische Bindung angemessen. Eine dogmatisch engere Terminologie ist nicht erforderlich.
  issues:
  - severity: medium
    issue: „deswegen“ verschiebt den Bezug von ቦቱ in eine Kausalbegründung.
    rationale: Das Pronomen verweist auf die zuvor besprochene Angelegenheit als Gegenstand der Eide und Bindung, nicht ausdrücklich auf deren Grund. „Darüber“ wahrt diesen Bezug.
  - severity: low
    issue: „unter einen Fluch binden“ ist stilistisch und semantisch weniger klar als eine instrumentale Formulierung.
    rationale: „Durch einen Fluch binden“ gibt die fluchbewehrte Weise der gegenseitigen Bindung natürlich wieder, ohne die Beteiligten als bloße Objekte eines Fluchs erscheinen zu lassen.
  revised_text: Da schworen sie alle gemeinsam und banden einander darüber durch einen Fluch.[a]
