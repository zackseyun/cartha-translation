  text: Then they all swore together and bound one another with a curse concerning it[a][b][c].
translation:
  language: de
  text: Da schworen sie alle gemeinsam und banden einander darüber durch einen Fluch.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „verpflichteten sich einander darüber durch einen Fluch“. Gemeint ist eine gegenseitige, durch einen Fluch bekräftigte Bindung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሜሃ
  choice: Da
  rationale: Kennzeichnet den nächsten Schritt der Erzählung knapp und natürlich.
- source_word: መሐሉ
  choice: schworen
  rationale: Das Verb bedeutet hier „schwören/einen Eid leisten“, nicht bloß „sprechen“; dies entspricht auch dem Eidkontext des vorhergehenden Verses.
- source_word: ኵሎሙ፡ ኅቡረ
  choice: sie alle gemeinsam
  rationale: Bewahrt die doppelte Betonung der vollständigen und gemeinschaftlichen Beteiligung.
- source_word: ወአውገዙ
  choice: und banden … unter einen Fluch
  rationale: Gibt die konkrete Bedeutung des Verpflichtens durch einen Fluch bzw. der Selbstverfluchung wieder, ohne die Wendung auf ein bloßes Versprechen abzuschwächen.
- source_word: በበይናቲሆሙ
  choice: einander
  rationale: Bringt den wechselseitigen Charakter ihrer Verpflichtung idiomatisch zum Ausdruck.
- source_word: ቦቱ
  choice: deswegen
  rationale: Verweist knapp auf das unmittelbar zuvor besprochene Vorhaben, ohne den pronominalen Bezug näher festzulegen.
theological_decisions:
- issue: Art der gegenseitigen Verpflichtung
  choice: banden einander deswegen unter einen Fluch
  alternative: verpflichteten sich einander deswegen unter einem Fluch
  rationale: Der Text beschreibt nicht nur einen gemeinsamen Eid, sondern zusätzlich eine gegenseitige, fluchbewehrte Bindung. Die gewählte Fassung erhält die Härte und Eigenart dieser doppelten Aussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Da“ führt die Handlung natürlich fort; „unter einen Fluch binden“ bewahrt die markante Bildlichkeit und den im Ausgangstext ausdrücklich vorhandenen Fluchcharakter.
