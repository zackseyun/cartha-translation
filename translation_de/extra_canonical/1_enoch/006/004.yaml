base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/006/004.yaml
  text: And they all answered him and said[a], "Let us all swear an oath, and let us all bind one another with a curse, so that we do not turn back from this plan[b], but carry out this deed."
translation:
  language: de
  text: 'Und sie alle antworteten ihm und sagten: „Lasst uns alle einen Eid schwören und einander durch einen Fluch binden[a], damit wir von diesem Plan nicht zurückweichen, sondern diese Tat ausführen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Ge’ez stehen sowohl „einen Eid schwören“ als auch „durch einen Fluch binden“. Diese Doppelung unterstreicht den feierlichen Charakter ihrer gegenseitigen Verpflichtung.
    reason: lexical_alternative
  - marker: b
    text: Die Schlussformulierung ist in der Textüberlieferung wiederholend („dieser Plan … diese Tat/Handlung“). Die Übersetzung bewahrt den Übergang vom Beschluss zu seiner Ausführung.
    reason: textual_variant
lexical_decisions:
- source_word: አውሥኡ
  choice: antworteten
  rationale: Das Erzählverb leitet die gemeinsame Antwort ein; „antworteten“ bewahrt den formellen dialogischen Ton.
- source_word: መሐላ፡ ንምሐል
  choice: einen Eid schwören
  rationale: Die Verbindung aus Substantiv und Verb ist im Ge’ez ausdrücklich formuliert und wird als feierliche, im Deutschen natürliche Wendung wiedergegeben.
- source_word: ናውግዝ፡ ኵልነ፡ በበይናቲነ
  choice: einander durch einen Fluch binden
  rationale: Die Formulierung bezeichnet hier einen gegenseitig verpflichtenden, selbstverwünschenden Bund und nicht bloß das Aussprechen einer Beschimpfung oder eines allgemeinen Fluches.
- source_word: ከመ፡ ኢንምጠ
  choice: damit wir … nicht zurückweichen
  rationale: „Zurückweichen“ bewahrt die willentliche und richtungsbezogene Bedeutung des Abstehens von einem bereits beschlossenen Vorhaben.
- source_word: ለዛቲ፡ ምክር
  choice: von diesem Plan
  rationale: Das Wort kann „Rat“, „Beschluss“ oder „Plan“ bedeuten; im Zusammenhang bezeichnet es das gemeinsam erwogene Vorhaben.
- source_word: ወንግብራ፡ ለዛቲ፡ [ምክር፡] ግብር
  choice: sondern diese Tat ausführen
  rationale: Die Wiedergabe hält die Bewegung vom Plan zur Ausführung fest und bewahrt das gewichtige „Tat“, ohne die repetitive und unsichere Überlieferung künstlich auszubauen.
theological_decisions:
- issue: Art des gegenseitigen Eides der Wächter
  choice: Ein durch gegenseitigen Fluch bekräftigter, selbstbindender Bund
  alternative: Ein bloßes Versprechen oder ein allgemeiner Fluch ohne bindenden Charakter
  rationale: Die gekoppelte Eid- und Fluchformel stellt eine feierliche gegenseitige Verpflichtung dar. Ihre rechtliche und moralische Schwere bleibt ausdrücklich erhalten, ohne zusätzliche konfessionelle Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt feierlich und verständlich; die gegenseitige Verpflichtung sowie die Spannung zwischen Plan und Tat werden nicht geglättet.
