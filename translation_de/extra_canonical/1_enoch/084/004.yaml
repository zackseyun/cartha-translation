base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/004.yaml
  text: And now the angels of your heavens have transgressed[c][b][a], and your wrath is upon the flesh of men until the great day of judgment.
translation:
  language: de
  text: Und nun haben die Engel deiner Himmel gesündigt[a], und dein Zorn liegt auf dem Fleisch der Menschen[b] bis zum großen Tag des Gerichts.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die überlieferte Transkription hat hier offenbar einen Lesefehler. Die textkritisch wiederhergestellte Lesart bedeutet „sie haben gesündigt“ beziehungsweise „sie haben sich vergangen“, nicht „sie bitten“.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich: „auf dem Fleisch des Menschen“. Der Ausdruck bezeichnet hier wahrscheinlich die Menschheit in ihrer sterblichen, leiblichen Existenz.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መላእክተ ሰማያቲከ
  choice: die Engel deiner Himmel
  rationale: Der apokalyptische Zusammenhang bezeichnet himmlische Wesen. Der Plural „Himmel“ und das Possessivsuffix werden bewahrt.
- source_word: ይጌግዩ (korrigiert gegenüber OCR ይጼብቡ)
  choice: haben … gesündigt
  rationale: Die anhand der Textkritik wiederhergestellte Lesart bedeutet „sie sündigen/verfehlen sich“. Das Perfekt gibt hier die vorausliegende Übertretung natürlich wieder, ohne eine besondere Art des Vergehens festzulegen.
- source_word: ዲበ ሥጋ ሰብእ
  choice: auf dem Fleisch der Menschen
  rationale: Die konkrete Anthropologie des Ausdrucks „Fleisch“ bleibt erhalten; „der Menschen“ bringt den kollektiv gemeinten Singular im natürlichen Deutschen zum Ausdruck.
- source_word: ትከውን መዐትከ
  choice: dein Zorn liegt auf
  rationale: Die indikativische Aussage wird gegenüber einer irrtümlichen Aufforderung bewahrt. „liegt auf“ drückt den fortdauernden Zorn idiomatisch aus.
- source_word: እስከ ዕለት ዐባይ እንተ ኵነኔ (korrigiert gegenüber OCR ጽጌ)
  choice: bis zum großen Tag des Gerichts
  rationale: Die textkritisch wiederhergestellte Schlusslesart bezeichnet eindeutig das Gericht und entspricht der apokalyptischen Wendung.
theological_decisions:
- issue: Art der Sünde der Engel
  choice: allgemein als „gesündigt“ wiedergegeben
  alternative: „haben sich vergangen“ / „haben übertreten“
  rationale: Der Vers stellt das Vergehen fest, bestimmt hier aber nicht eigens dessen genaue Art; die Übersetzung vermeidet eine zusätzliche dogmatische Präzisierung.
- issue: Reichweite von „Fleisch des Menschen“
  choice: kollektiv auf die Menschen in ihrer leiblich-sterblichen Existenz bezogen
  alternative: ein einzelner Mensch oder alles Fleisch in einem umfassenderen kosmischen Sinn
  rationale: Der Kontext legt die kollektive Bedeutung nahe, während „Fleisch“ die spannungsreiche Bildsprache der Quelle erhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die äthiopische Bildsprache. Die schwerwiegenden OCR-Fehler werden gemäß der dokumentierten textkritischen Revision berichtigt; die Fußnoten machen die entscheidende Unsicherheit transparent.
