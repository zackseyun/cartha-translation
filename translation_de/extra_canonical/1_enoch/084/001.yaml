base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/001.yaml
  text: And I lifted up my hands in righteousness[a], and I blessed the Holy and Great One; and I spoke with the spirit of my mouth and with the tongue of flesh, which God has made for the children of the flesh of men, so that they might speak with it; and he gave them spirit and tongue and mouth[b], so that they might speak by them.
translation:
  language: de
  text: Und ich erhob meine Hände in Gerechtigkeit und pries den Heiligen und Großen. Ich sprach mit dem Atem meines Mundes[a] und mit der Zunge aus Fleisch, die Gott für die Kinder des Fleisches der Menschen[b] geschaffen hat, damit sie mit ihr sprechen. Und er gab ihnen Atem, Zunge und Mund, damit sie damit sprechen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „mit dem Geist meines Mundes“. Das Ge’ez-Wort kann „Atem“, „Geist“ oder „Wind“ bedeuten; im Zusammenhang der zum Sprechen dienenden Fähigkeiten liegt hier „Atem“ nahe.'
    reason: lexical_alternative
  - marker: b
    text: Die Formulierung ist bewusst leiblich. Wörtlich steht etwa „die Kinder des Fleisches der Menschen“; sie hebt die geschöpfliche Körperlichkeit des Menschen hervor.
    reason: cultural_note
lexical_decisions:
- source_word: አልዐልኩ እደዋየ
  choice: ich erhob meine Hände
  rationale: Das Verb bezeichnet hier die körperliche Gebärde des Erhebens der Hände beim Gebet; der Pluralsinn von እደዋየ wird bewahrt.
- source_word: በጽድቅ
  choice: in Gerechtigkeit
  rationale: Die präpositionale Form erhält den feierlichen Ton und lässt offen, ob die Wendung die Haltung, die Art oder die sittliche Qualität des Betens näher bestimmt.
- source_word: ባረክዎ ለቅዱስ ወለዓቢይ
  choice: pries den Heiligen und Großen
  rationale: Im Deutschen ist „preisen“ für menschliches Segnen Gottes natürlich und würdig. Die beiden Adjektive werden als zusammengehörige Gottesbezeichnung wiedergegeben.
- source_word: መንፈስ አፉየ
  choice: Atem meines Mundes
  rationale: መንፈስ kann Atem, Geist oder Wind bedeuten. In der Aufzählung der zum Sprechen gegebenen Fähigkeiten und Organe passt „Atem“ am besten, ohne die Alternative „Geist“ zu verschweigen.
- source_word: በልስነ ሥጋ
  choice: mit der Zunge aus Fleisch
  rationale: Die konkrete leibliche Bildsprache bleibt erhalten; „aus Fleisch“ klingt im heutigen Deutsch natürlicher als „Zunge des Fleisches“ und vermeidet irreführende moralische Nebenbedeutungen.
- source_word: ውሉደ ሥጋ ሰብእ
  choice: die Kinder menschlichen Fleisches
  rationale: Die auffällig körperbezogene und leicht redundante Formulierung des Ge'ez wird weitgehend bewahrt, statt sie zu einem allgemeinen „Menschen“ zu glätten.
- source_word: ከመ ይትናገሩ ባቲ
  choice: damit sie mit ihr sprechen
  rationale: Das feminine Singularpronomen verweist am ehesten auf die Zunge; „mit ihr“ gibt den instrumentalen Sinn idiomatisch wieder.
- source_word: ወወሀቦሙ መንፈሰ ወልሳነ ወአፈ
  choice: und er gab ihnen Atem, Zunge und Mund
  rationale: Die dreigliedrige Reihe der Voraussetzungen beziehungsweise Organe des Sprechens bleibt knapp und körperbezogen erhalten.
- source_word: ከመ ይትናገሩ ቦቱ
  choice: damit sie damit sprechen
  rationale: „Damit“ kann sich im Deutschen auf die unmittelbar vorausgehende Dreiergruppe beziehen und bewahrt deren instrumentale Funktion ohne schwerfälliges „mit ihnen“.
theological_decisions:
- issue: Bedeutung von መንፈስ in diesem Vers
  choice: Atem
  alternative: Geist; Geist Gottes
  rationale: Der Zusammenhang nennt Mund und Zunge als geschaffene Mittel menschlicher Rede. „Atem“ erhält diesen anthropologisch-schöpfungstheologischen Schwerpunkt; eine Fußnote bewahrt die echte lexikalische Mehrdeutigkeit.
- issue: Grad der Bewahrung der leiblichen Anthropologie
  choice: „Zunge aus Fleisch“ und „Kinder menschlichen Fleisches“ im Haupttext beibehalten
  alternative: zu „menschliche Zunge“ und „Menschen“ glätten
  rationale: Die wiederholte Fleisch-Sprache prägt die Aussage des Ge'ez und soll nicht durch eine konfessionell oder philosophisch gefärbte Verallgemeinerung eingeebnet werden.
- issue: Gottesbezeichnung ቅዱስ ወዓቢይ
  choice: der Heilige und Große
  alternative: der Heilige und der Große
  rationale: Die Übersetzung versteht beide Adjektive als verbundenen Titel für denselben Gott, ohne daraus eine weitergehende dogmatische Formel abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit feierlichem Gebetston. Die parataktische Satzführung und die konkrete Körperbildlichkeit bleiben erhalten; ungebräuchliche Wörtlichkeit wird nur dort geglättet, wo sie das Verständnis unnötig erschweren würde.
