base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/002.yaml
  text: Blessed are you[a], O Lord, great King and mighty in your greatness, Lord of all the creation of heaven, King of kings and God of all the world. And your kingship and your kingdom and your greatness endure forever and ever, and your authority is for all generations of generations. And all the heavens are your throne forever[d][c][b], and the whole earth is the footstool of your feet forever and ever.
translation:
  language: de
  text: Gepriesen bist du, Herr, großer König, mächtig in deiner Größe, Herr über die ganze himmlische Schöpfung[a], König der Könige und Gott der ganzen Welt. Deine Königsherrschaft[b], dein Reich und deine Größe bestehen für immer und ewig, und deine Macht gilt für alle Geschlechter, von Geschlecht zu Geschlecht. Alle Himmel sind für immer dein Thron[c], und die ganze Erde ist für immer und ewig der Schemel deiner Füße.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier eine knappe Verbindung wie „die ganze Schöpfung des Himmels“; gemeint sein kann auch „alles, was im Himmel geschaffen ist“.
    reason: lexical_alternative
  - marker: b
    text: Der überlieferte Ausdruck ist textlich und lexikalisch schwierig. Er kann königliche Herrschaft bezeichnen und auch mit „Königtum“, „Herrschergewalt“ oder „Majestät“ wiedergegeben werden.
    reason: textual_variant
  - marker: c
    text: Vergleiche das kosmische Bild von Himmel als Thron und Erde als Fußschemel in Jesaja 66,1; die Formulierung hier muss damit nicht in jedem Einzelwort übereinstimmen.
    reason: cross_reference
lexical_decisions:
- source_word: ቡሩክ አንተ
  choice: Gepriesen bist du
  rationale: Die prädikative Segensformel richtet sich unmittelbar an Gott. „Gepriesen bist du“ gibt ihren doxologischen Charakter in natürlichem, würdigem Deutsch wieder.
- source_word: እግዚኦ
  choice: Herr
  rationale: Der Vokativ wird im Deutschen durch die direkte Anrede ausgedrückt; ein zusätzliches „o“ wäre möglich, klänge aber unnötig altertümlich.
- source_word: ንጉሥ ዐቢይ ወኃያል በዕበየ ዚአከ
  choice: großer König, mächtig in deiner Größe
  rationale: Die königliche Anrede und das Attribut bleiben unterscheidbar; die Wiederholung von „Größe“ wird entsprechend dem Geʿez bewahrt.
- source_word: ኵሉ ፍጥረት ሰማይ
  choice: die ganze himmlische Schöpfung
  rationale: Die knappe Geʿez-Verbindung von „ganze Schöpfung“ und „Himmel“ bezeichnet am ehesten die gesamte Schöpfung des Himmels; die deutsche Form ist verständlich, ohne die Mehrdeutigkeit völlig zu verdecken.
- source_word: ንጉሠ ነገሥት
  choice: König der Könige
  rationale: Die traditionelle königliche Steigerungsform entspricht dem Wortlaut und ist im Deutschen geläufig.
- source_word: አምላከ ኵሉ ዓለም
  choice: Gott der ganzen Welt
  rationale: Im kosmischen Zusammenhang bezeichnet ዓለም hier am natürlichsten die Welt beziehungsweise Weltordnung.
- source_word: መላኵትከ
  choice: deine Königsherrschaft
  rationale: Das Wort bezeichnet im Kontext königliche Herrschaft. „Königsherrschaft“ wahrt die Nähe zum Ausgangstext und unterscheidet den Ausdruck vom folgenden „Reich“.
- source_word: መንግሥትከ
  choice: dein Reich
  rationale: Die Wiedergabe bewahrt neben dem abstrakten Herrschaftsaspekt des vorhergehenden Ausdrucks den konkreteren Sinn von Königtum beziehungsweise Reich.
- source_word: ዕበይከ
  choice: deine Größe
  rationale: Die bewusste Wiederholung des Motivs göttlicher Größe bleibt erhalten.
- source_word: ይነብር
  choice: bestehen
  rationale: Bei Herrschaft, Reich und Größe drückt „bestehen“ die dauernde Fortdauer natürlich aus.
- source_word: ስልጣንከ
  choice: deine Macht
  rationale: Der eigenständige Nominalsatz des Geʿez wird ausdrücklich wiedergegeben; „Macht“ umfasst hier Vollmacht und Herrschaftsgewalt.
- source_word: ለዓለም ወለዓለመ ዓለም
  choice: für immer und ewig
  rationale: Die feste deutsche Ewigkeitsformel gibt die gesteigerte Dauerformel idiomatisch und feierlich wieder.
- source_word: መካይደ እገሪከ
  choice: der Schemel deiner Füße
  rationale: Die konkrete kosmische Thron- und Schemelsymbolik wird nicht verallgemeinert oder abgeschwächt.
theological_decisions:
- issue: Kosmisches Königtum sowie Thron- und Schemelsymbolik
  choice: Die königlich-kosmischen Bilder werden als direkte Aussagen über Gottes universale Herrschaft beibehalten.
  alternative: Die Bilder als allgemeines Lob oder ausschließlich als Tempelmetaphorik wiederzugeben.
  rationale: Der Vers entfaltet eine apokalyptische Doxologie mit konkreter kosmischer Bildsprache. Eine abstrakte Umschreibung würde die Spannung und Anschaulichkeit des Textes vermindern.
- issue: Verhältnis von Königsherrschaft, Reich, Größe und Macht
  choice: Alle vier Ausdrücke werden jeweils ausdrücklich wiedergegeben.
  alternative: Nahe Begriffe zusammenzuziehen oder einen von ihnen in die vorherige Aussage einzugliedern.
  rationale: Das Geʿez häuft bewusst verschiedene Herrschaftsbegriffe an und nennt ስልጣንከ in einem eigenen Satzteil; diese rhetorische Fülle soll erhalten bleiben.
translation_notes:
  register: Modernes Standarddeutsch in würdigem Gebets- und Lobpreisregister. Die direkte Anrede bleibt feierlich, vermeidet jedoch unnötig archaische Formen. Parallelismen, Wiederholungen und die konkrete apokalyptische Bildsprache werden bewahrt.
