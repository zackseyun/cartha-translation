base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/003.yaml
  text: For you have made all things[a], and over all things you rule; and no deed is too hard for you, and not even a single wisdom passes beyond the throne of your dwelling, nor turns away from before your face. And you know all things, and see, and hear, and there is nothing hidden from you[d][c][b], for you see all things.
translation:
  language: de
  text: Denn du hast geschaffen, und über alles herrschst du. Keine Tat ist zu schwer für dich,[a] und nicht eine einzige Weisheit geht über den Thron deiner Wohnstätte hinaus oder wendet sich von deinem Angesicht ab.[b] Du weißt alles, siehst und hörst, und nichts ist vor dir verborgen; denn du siehst alles.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die ge’ezische Wendung ist eine idiomatische Ausdrucksweise für etwas, das jemandem zu schwer oder zu schwierig ist.
    reason: lexical_alternative
  - marker: b
    text: Der Satzteil ist im Ge’ez schwierig. „Eine einzige Weisheit“ könnte auch einen weisen Gedanken, einen Plan oder eine Angelegenheit bezeichnen. Die räumliche Aussage über Thron, Wohnstätte und Angesicht ist deshalb bewusst nah am Wortlaut wiedergegeben.
    reason: lexical_alternative
  - marker: c
    text: Der abschließende Satz wiederholt das Motiv von Gottes umfassender Erkenntnis. Einige Textzeugen scheinen die ausdrückliche Schlusszeile „denn du siehst alles“ zu bewahren.
    reason: textual_variant
lexical_decisions:
- source_word: ገበርከ
  choice: du hast geschaffen
  rationale: Das Verb bedeutet grundsätzlich „machen, tun“. Hier steht im überlieferten Vers kein ausdrückliches Objekt; die absolute Formulierung bewahrt diese Struktur und lässt im Gebetskontext den Schöpfungsbezug erkennen.
- source_word: ለኵሉ አንተ ትመልክ
  choice: über alles herrschst du
  rationale: Die Wendung bezeichnet umfassende königliche Herrschaft. „Herrschen“ ist im Deutschen würdig und natürlich, ohne das Bild unnötig auszuweiten.
- source_word: ኢይጸንዐከ ግብር
  choice: Keine Tat ist zu schwer für dich
  rationale: Die Konstruktion mit ጸንዐ und Objektsuffix kann idiomatisch „jemandem zu schwer sein“ bedeuten und drückt hier aus, dass keine Tat Gottes Macht übersteigt.
- source_word: ወአሐቲ ጥበብ
  choice: nicht eine einzige Weisheit
  rationale: Die ungewöhnliche Verbindung „eine Weisheit“ bleibt bewusst erhalten, weil der genaue Bezug – Weisheit, weiser Gedanke, Plan oder Angelegenheit – unsicher ist.
- source_word: ኢትሐልፍ እምንባራተ ምንባሪከ
  choice: geht über den Thron deiner Wohnstätte hinaus
  rationale: Die räumliche Bewegung und die doppelte Thron-/Wohnstättenbildlichkeit des Ge’ez werden transparent wiedergegeben.
- source_word: ኢትትመየጥ ኢእምገጽከ
  choice: wendet sich von deinem Angesicht ab
  rationale: „Angesicht“ erhält die konkrete, personale Gegenwartsmetaphorik; „wendet sich ab“ gibt die Bewegung wieder, ohne sie bloß als abstraktes Entgehen zu deuten.
- source_word: ታአምር ወትሬኢ ወትሰምዕ
  choice: du weißt alles, siehst und hörst
  rationale: Die drei Verben werden in ihrer Folge bewahrt; das ergänzte „alles“ bei „wissen“ entspricht dem ausdrücklich universalen Objekt ኵሎ.
- source_word: ዘይትኀባእ እምኔከ
  choice: nichts ist vor dir verborgen
  rationale: Die natürliche deutsche Wendung bewahrt die Aussage, dass sich nichts Gottes Wahrnehmung entziehen kann.
theological_decisions:
- issue: Göttliche Herrschaft, Macht und Erkenntnis
  choice: Die universalen Aussagen über Gottes Herrschaft und Wissen werden stark und unverkürzt wiedergegeben.
  alternative: Die Aussagen als allgemeine oder lediglich poetische Lobpreisung abschwächen.
  rationale: Die wiederholten Totalitätsausdrücke und der Schluss „du siehst alles“ stützen eine umfassende Aussage über göttliche Souveränität und Erkenntnis.
- issue: Die schwierige Aussage über „eine einzige Weisheit“
  choice: Die ungewöhnliche Formulierung und die räumliche Thronmetaphorik bleiben im Haupttext erhalten.
  alternative: 'Deutend übersetzen: „Kein weiser Plan entgeht dir“ oder „Kein Gedanke liegt außerhalb deiner Gegenwart“.'
  rationale: Der Ge’ez-Text ist semantisch schwierig. Eine stärkere Glättung würde den möglichen Sinn vorzeitig festlegen und die echte Mehrdeutigkeit verdecken.
- issue: Fehlendes ausdrückliches Objekt bei ገበርከ
  choice: „du hast geschaffen“ ohne ergänztes Objekt
  alternative: „du hast alles geschaffen“ oder „du hast sie geschaffen“
  rationale: Der erhaltene Wortlaut setzt bei diesem Verb kein Objekt; „alles“ erscheint ausdrücklich erst in der folgenden Herrschaftsaussage. Die deutsche absolute Verwendung bleibt verständlich und vermeidet eine unbelegte Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht biblischem Klang. Konkrete Bilder wie „Thron“, „Wohnstätte“ und „Angesicht“ bleiben erhalten; unklare Stellen werden nicht konfessionell oder dogmatisch geglättet.
