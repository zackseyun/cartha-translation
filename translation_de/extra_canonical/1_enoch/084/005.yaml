revisions:
- from: Und nun, Gott und Herr und großer König, flehe ich dich an und bitte dich, mein Gebet für mich zu bestätigen.[a]
  to: Und nun, o Gott und Herr und großer König, flehe und bitte ich dich, dass du meinem Gebet für mich Bestand gibst.[a]
  rationale: Die Revision ersetzt die im Deutschen unübliche Verbindung „ein Gebet bestätigen“ durch „einem Gebet Bestand geben“. Sie bewahrt dabei sowohl die Bitte um göttliches Handeln am Gebet als auch das im Ausgangstext vorhandene „für mich“ und vermeidet die theologisch engeren Deutungen „erhören“ und „erfüllen“.
