base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/084/005.yaml
  text: And now, O God and Lord and great King, I beseech and ask that you establish my prayer for me.
translation:
  language: de
  text: Und nun, o Gott und Herr und großer König, flehe und bitte ich dich, dass du meinem Gebet für mich Bestand gibst.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „mein Gebet für mich aufrichten“ oder „festmachen“. Das äthiopische Verb kann das Aufrichten, Befestigen oder Herstellen von Bestand bezeichnen.'
    reason: Erläutert die bildhafte und semantisch breitere Grundbedeutung des Verbs, ohne sie voreilig als „erhören“ oder „erfüllen“ festzulegen.
lexical_decisions:
- source_word: ወይእዜኒ (wa-yǝʾǝzē-ni)
  choice: Und nun
  rationale: Gibt die einleitende zeitliche Wendung knapp und natürlich wieder.
- source_word: አምላክ፡ ወእግዚእ፡ ወንጉሥ፡ ዐቢይ (ʾamlāk wa-ʾǝgziʾ wa-nǝguś ʿabiy)
  choice: Gott und Herr und großer König
  rationale: Bewahrt die feierliche dreifache Anrede und die wiederholte Verknüpfung des Ausgangstextes.
- source_word: አስተበቍዕ፡ ወእስእል (ʾastabāqʷǝʿ wa-ʾǝsʾǝl)
  choice: flehe ich dich an und bitte dich
  rationale: Erhält die beiden parallelen Verben und ihre zunehmende Eindringlichkeit in idiomatischem Deutsch.
- source_word: ታቅም፡ ሊተ፡ ስእለተየ (tāqǝm litē sǝʾǝlataya)
  choice: mein Gebet für mich zu bestätigen
  rationale: Gibt das Kausativ von qwm („aufrichten, festmachen, bestätigen“) verständlich wieder und bewahrt das ausdrücklich vorhandene „für mich“.
theological_decisions:
- issue: Bedeutung von „das Gebet aufrichten/festmachen“
  choice: mein Gebet für mich zu bestätigen
  alternative: mein Gebet für mich zu erhören / meine Bitte zu erfüllen
  rationale: „Bestätigen“ wahrt die Bild- und Bedeutungsnähe zum Verb qwm, ohne die Bitte vorschnell als ausdrückliche Bitte um Erhörung oder Erfüllung festzulegen.
translation_notes:
  register: Feierliche, aber gegenwärtig verständliche Gebetssprache. Die Reihung „Gott und Herr und großer König“ sowie die Doppelung „flehe … an und bitte“ bleiben bewusst erhalten.
