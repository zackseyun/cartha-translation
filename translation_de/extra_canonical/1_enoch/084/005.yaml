    issue: „mein Gebet für mich zu bestätigen“ ist im Deutschen keine natürliche Verbindung.
    rationale: Man kann Aussagen oder Zusagen bestätigen, aber ein Gebet wird eher erhört, bekräftigt oder ihm wird Bestand gegeben. „Erhören“ wäre hier allerdings bereits eine engere Auslegung des Verbs.
  - severity: low
