    rationale: Die Alternative „aufzurichten/festzumachen“ erläutert weiterhin den Bedeutungsbereich, während der Haupttext nun „Bestand geben“ verwendet.
  revised_text: Und nun, o Gott und Herr und großer König, flehe und bitte ich dich, dass du meinem Gebet für mich Bestand gibst.[a]
