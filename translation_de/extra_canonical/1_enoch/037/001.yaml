base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/001.yaml
  text: The second vision of wisdom that Enoch son of Jared[a], son of Mahalalel, son of Cainan, son of Enos, son of Seth, son of Adam[c][b], saw.
translation:
  language: de
  text: Die zweite[a] Vision, die er sah – die Vision der Weisheit, die Henoch, Sohn von Jared, Sohn von Mahalalel, Sohn von Kainan, Sohn von Enos, Sohn von Set, Sohn von Adam, sah.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »eine weitere Vision«. Das ge''ezische Wort kann »andere/weitere« oder in diesem Zusammenhang »zweite« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: Die Wiederholung von »Vision«, »sah« und »Sohn von« entspricht der wiederholenden Formulierung der ge'ezischen Überschrift.
    reason: textual_style
lexical_decisions:
- source_word: ራእይ / ራእየ
  choice: Vision
  rationale: Das Wort bezeichnet hier ein in einem Offenbarungszusammenhang Geschautes. »Vision« wahrt den apokalyptischen Ton und wird an beiden Stellen wiedergegeben.
- source_word: ካልእ
  choice: zweite
  rationale: Das Wort kann »andere/weitere« bedeuten, hat in dieser Überschrift aber wahrscheinlich eine ordnende, sequenzielle Funktion. Die echte Mehrdeutigkeit wird in Fußnote [a] bewahrt.
- source_word: ጥበብ
  choice: Weisheit
  rationale: Die direkte Bedeutung »Weisheit« bewahrt die besondere Charakterisierung der Vision.
- source_word: ዘርእየ
  choice: die er sah / die Henoch … sah
  rationale: Die beiden Relativkonstruktionen werden jeweils wiedergegeben, damit die auffällige Wiederholung des Originals nicht eingeebnet wird.
- source_word: ወልደ
  choice: Sohn von
  rationale: Die ausdrücklich wiederholte genealogische Formel bleibt vollständig erhalten und wird nicht zu »Nachkomme« verallgemeinert.
- source_word: ሄኖክ
  choice: Henoch
  rationale: Gebräuchliche deutsche Form des biblischen Namens.
- source_word: ያሬድ
  choice: Jared
  rationale: Die Form bleibt dem ge’ezischen Namen Yared/Jared nahe.
- source_word: ቃይናን
  choice: Kainan
  rationale: »Kainan« entspricht dem ge’ezischen Zeugnis genauer als eine Normalisierung zu »Kenan«.
- source_word: ሄኖስ
  choice: Enos
  rationale: Die Form folgt dem ge’ezischen Zeugnis eng, ohne sie an eine andere biblische Namenstradition anzugleichen.
theological_decisions:
- issue: Bedeutung von ካልእ in der Überschrift
  choice: »zweite« im Haupttext, mit »weitere« als Fußnotenalternative
  alternative: »eine weitere/andere Vision«
  rationale: Die Stellung in einer neuen Visionseinheit spricht für eine ordnende Bedeutung, doch der Wortlaut legt die Reihenfolge nicht eindeutig fest. Darum wird die Alternative ausdrücklich bewahrt.
- issue: Wiederholende Struktur der Überschrift
  choice: Beide Vorkommen von »Vision« und beide Relativsätze mit »sah« wiedergeben
  alternative: Zu »Die zweite Vision der Weisheit, die Henoch … sah« glätten
  rationale: Der ge’ezische Text enthält zwei unterscheidbare, appositionell verbundene Wendungen. Ihre Wiederholung gehört zur literarischen Gestalt und darf nicht stillschweigend beseitigt werden.
- issue: Genealogische Einordnung Henochs
  choice: Die vollständige Abstammungsreihe bis Adam beibehalten
  alternative: Die Genealogie verkürzen oder Namen an eine andere Texttradition angleichen
  rationale: Die Reihe verankert Henoch ausdrücklich in der Urgeschichte und ist integraler Bestandteil des Verses.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Gedankenstrich kennzeichnet die zweite Wendung als Apposition, ohne die syntaktische Spannung und Wiederholung des ge’ezischen Textes aufzulösen. Die bewusst wiederholte Formel »Sohn von« klingt genealogisch und bewahrt die Struktur der Vorlage.
