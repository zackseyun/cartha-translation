base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/003.yaml
  text: It is better to speak to the former ones[b][a], but even from the latter ones we will not withhold the beginning of wisdom.
translation:
  language: de
  text: Es ist besser, zu den Früheren zu sprechen[a]; doch auch den Späteren werden wir den Anfang der Weisheit nicht vorenthalten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich und in der Zuordnung der Satzglieder ist der äthiopische Wortlaut knapp. Mit den »Früheren« können frühere Menschen oder Generationen gemeint sein; der Text legt dies nicht näher fest.
    reason: source_ambiguity
  - marker: b
    text: »Anfang« gibt ein Wort wieder, das wörtlich »Kopf« bedeutet und auch den Anfang, die Grundlage oder das Hauptstück bezeichnen kann.
    reason: lexical_ambiguity
lexical_decisions:
- source_word: እሉ
  choice: zu den
  rationale: Das deiktische Element wird im Zusammenhang mit der folgenden Bezeichnung der früheren Adressaten idiomatisch in die deutschen Präpositionalphrase aufgenommen; die genaue syntaktische Zuordnung bleibt unsicher.
- source_word: ቀዳሚ
  choice: den Früheren
  rationale: Bezeichnet im Gegensatz zu ደኃርያን die früheren beziehungsweise vorangegangenen Menschen oder Generationen.
- source_word: ይኄይስ
  choice: Es ist besser
  rationale: Die Form gehört zu ኀየሰ, »gut/besser sein«, und bezeichnet hier keine Parabel.
- source_word: ብሂል
  choice: zu sprechen
  rationale: Infinitivische Bildung zum Verb »sagen, sprechen«; sie ergänzt »Es ist besser«.
- source_word: ወደኃርያንሂ
  choice: doch auch den Späteren
  rationale: Die Verbindung bezeichnet kontrastierend auch die später Kommenden; »doch auch« gibt den fortführend-gegensätzlichen Zusammenhang natürlich wieder.
- source_word: ኢንከልእ
  choice: werden wir … nicht vorenthalten
  rationale: Erste Person Plural eines Verbs mit der Bedeutung »zurückhalten, verweigern, vorenthalten«.
- source_word: ርእሳ
  choice: den Anfang
  rationale: Wörtlich »Kopf«; in dieser Verbindung liegt die übertragene Bedeutung »Anfang« nahe, ohne andere Nuancen völlig auszuschließen.
- source_word: ለጥበብ
  choice: der Weisheit
  rationale: Die Genitivverbindung »Anfang der Weisheit« ist im Deutschen natürlich und bewahrt den weisheitlichen Klang.
theological_decisions:
- issue: Identität der früheren und späteren Adressaten
  choice: die Früheren / die Späteren
  alternative: die Ersten / die Letzten; die früheren / späteren Generationen
  rationale: Der Text benennt den Gegensatz, erklärt aber nicht ausdrücklich, auf welche Personen oder Generationen er sich bezieht. Die substantivierten Adjektive bewahren diese Offenheit.
- issue: Bedeutung von ርእሳ ለጥበብ
  choice: Anfang der Weisheit
  alternative: Hauptstück der Weisheit; Grundlage der Weisheit
  rationale: »Anfang« folgt der naheliegenden übertragenen Bedeutung von »Kopf«, ohne die Wendung theologisch auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt bewusst knapp und erhält den Gegensatz zwischen den früheren und späteren Adressaten. Die ältere Deutung als Aussage über den Beginn einer ersten Parabel wird nicht übernommen, da die maßgeblichen Formen besser als »es ist besser«, »sprechen« und »wir werden nicht vorenthalten« verstanden werden.
