base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/004.yaml
  text: Until now[a], it had not been given to me before the Lord of Spirits[b], what I have received.
translation:
  language: de
  text: Bis jetzt[a] war mir aus der Gegenwart des Herrn der Geister[b] nicht gegeben worden, was ich empfangen habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Schlusssatz ist schwierig. Das Verb kann „empfangen“, „nehmen/aufnehmen“ oder, in erweitertem Sinn, „eine Rede anheben bzw. beginnen“ bedeuten; ein Objekt wird im ge'ezischen Wortlaut nicht ausdrücklich genannt.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „von vor dem Herrn der Geister“. Die Wendung kann die Herkunft aus seiner Gegenwart bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እስከ፡ ይእዜ
  choice: Bis jetzt
  rationale: Die Zeitangabe bezeichnet den Zeitraum bis zum gegenwärtigen Augenblick und klingt im modernen Deutschen natürlich.
- source_word: ኢተውህበኒ
  choice: war mir nicht gegeben worden
  rationale: Die passive Form mit Objekt der ersten Person wird wörtlich bewahrt; das Plusquamperfekt stellt den zuvor bestehenden Zustand im Verhältnis zum jetzigen Empfang verständlich dar.
- source_word: እምቅድመ
  choice: vor
  rationale: Die Wendung kann sowohl Gegenwart beziehungsweise Angesicht als auch Herkunft aus dieser Gegenwart ausdrücken. „Vor“ wahrt die räumlich-höfische Bildsprache, ohne im Deutschen das unnatürliche „von vor“ zu erzeugen.
- source_word: እግዚአ፡ መንፈሳት
  choice: dem Herrn der Geister
  rationale: Der wiederkehrende Gottesname wird formal und einheitlich wiedergegeben; der bestimmte Genitiv ist im Deutschen idiomatisch.
- source_word: ዘነሣእኩ
  choice: was ich empfangen habe
  rationale: ነሣእ kann „nehmen“ oder „empfangen“ bedeuten. Zusammen mit „gegeben werden“ ergibt „empfangen“ ein natürliches lexikalisches Paar, ohne ein unausgesprochenes Objekt wie „Rede“ oder „Gleichnis“ einzufügen.
theological_decisions:
- issue: Bezug und Sinn des Schlusssatzes
  choice: „was ich empfangen habe“ ohne ergänztes Sachobjekt
  alternative: „was ich aufgenommen habe“, „was ich ausgesprochen habe“ oder „die Rede, die ich begonnen habe“
  rationale: Der überlieferte ge'ezische Wortlaut nennt kein ausdrückliches Sachobjekt. Die Übersetzung deutet daher weder auf ein Gleichnis noch auf eine Rede fest und bewahrt die syntaktische Spannung.
- issue: Bedeutung von እምቅድመ beim göttlichen Titel
  choice: „vor dem Herrn der Geister“
  alternative: „aus der Gegenwart des Herrn der Geister“
  rationale: Die Präposition kann Herkunft aus der Gegenwart einer Person markieren. Im Haupttext bleibt die knappe, mehrdeutige Form erhalten; die Herkunftsnuance wird in der Fußnote genannt.
translation_notes:
  register: Moderne, würdige Standardsprache mit dem für 1 Henoch charakteristischen Titel „Herr der Geister“. Die ungewöhnliche Spannung zwischen „nicht gegeben worden“ und „empfangen habe“ bleibt als Eigenschaft des schwierigen Ausgangssatzes sichtbar; die Fußnoten erläutern, ohne sie aufzulösen.
