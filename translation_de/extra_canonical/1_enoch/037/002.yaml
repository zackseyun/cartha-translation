base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/037/002.yaml
  text: 'And this is the beginning of the word of wisdom that I lifted up to speak and say to those who dwell on the dry land: Hear[a], you former ones, and see, you latter ones[d][c][b], the holy words that I speak before the Lord of Spirits.'
translation:
  language: de
  text: 'Und dies ist der Anfang des Wortes der Weisheit, das ich erhob, um es denen zu verkünden, die auf dem trockenen Land wohnen[a]: Hört, ihr Früheren, und seht, ihr Späteren, die heiligen Worte, die ich vor dem Herrn der Geister spreche[b].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die auf der Erde wohnen“. Wörtlicher steht hier „auf dem trockenen Land“.'
    reason: lexical_alternative
  - marker: b
    text: „Vor“ kann hier auch im Sinn von „in der Gegenwart des Herrn der Geister“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወዝ፡ ርእሱ
  choice: Und dies ist der Anfang
  rationale: ርእስ bedeutet wörtlich „Kopf“, bezeichnet hier aber idiomatisch den Anfang oder Auftakt der Rede.
- source_word: ነገረ፡ ጥበብ
  choice: des Weisheitswortes
  rationale: Bewahrt die Einzahl und den gehobenen Charakter von ነገር, ohne den Ausdruck unnötig zu einer ausführlichen „Abhandlung“ zu erweitern.
- source_word: ዘአንሣእኩ
  choice: das ich erhob
  rationale: Gibt das Bild des Erhebens beziehungsweise Aufnehmens möglichst transparent wieder und erhält den feierlichen Verkündigungscharakter.
- source_word: እትናገር፡ [እብል]
  choice: um es … zu verkünden
  rationale: Natürliches Deutsch für die beabsichtigte öffentliche Rede; die eingeklammerte zweite Verbform ist textlich unsicher und wird nicht künstlich verdoppelt.
- source_word: ለእለ፡ ይነድሩ፡ ውስተ፡ የብስ
  choice: denen …, die auf dem trockenen Land wohnen
  rationale: Erhält das konkrete Bild von የብስ („trockenes Land“), statt es im Haupttext zum allgemeineren „Erde“ zu glätten.
- source_word: ስምዑ፡ ቀደምት
  choice: Hört, ihr Früheren
  rationale: Bewahrt Imperativ, Anrede und den zeitlichen Gegensatz zum folgenden Ausdruck.
- source_word: ወርእዩ፡ ደኃርያን
  choice: und seht, ihr Späteren
  rationale: Gibt die parallele Form aus Imperativ und Anrede wieder und lässt die zeitliche Reichweite offen.
- source_word: ነገረ፡ ቅዱሰ፡ እለ
  choice: die heiligen Worte, die
  rationale: ቅዱሰ ist als Adjektiv zu ነገረ zu verstehen; das plurale Relativpronomen እለ stützt hier die Wiedergabe „heilige Worte“ statt „Wort des Heiligen“.
- source_word: ቅድመ፡ እግዚአ፡ መንፈሳት
  choice: vor dem Herrn der Geister
  rationale: Übersetzt den charakteristischen henochischen Gottestitel direkt und bewahrt „vor“ in seiner räumlich-präsentischen Offenheit.
theological_decisions:
- issue: Deutung von ነገረ ቅዱሰ
  choice: „die heiligen Worte“
  alternative: „das Wort des Heiligen“
  rationale: Kasusübereinstimmung und plurales Relativpronomen sprechen grammatisch für ein adjektivisch bestimmtes „heilige Worte“. Dadurch wird kein göttlicher Titel in den Text eingetragen, den die vorliegende Form nicht verlangt.
- issue: Reichweite der Bewohner des trockenen Landes
  choice: Konkretes Bild im Haupttext beibehalten
  alternative: „die auf der Erde wohnen“
  rationale: Der Ausdruck kann allgemein die Menschen auf der Erde meinen, doch die konkrete Bildsprache der ge'ezischen Vorlage soll nicht stillschweigend verallgemeinert werden.
- issue: „Frühere“ und „Spätere“
  choice: Zeitlich offene Anrede beider Gruppen
  alternative: Ausdrücklich „frühere und spätere Generationen“
  rationale: Der Generationenbezug ist plausibel, wird aber nicht explizit gemacht; die knappe Parallelform bewahrt die Mehrdeutigkeit.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit bewusst erhaltener prophetisch-apokalyptischer Parallelität. Ungewöhnliche, aber verständliche Wendungen wie „das Weisheitswort … erhob“ bewahren die Bildsprache der Vorlage; die grammatisch gestützte Lesart „heilige Worte“ ersetzt die ältere Deutung als Gottesbezeichnung.
