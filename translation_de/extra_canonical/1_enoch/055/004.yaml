translation:
  language: de
  text: Ihr Könige und Mächtigen, die ihr wohnt[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hier vorliegende äthiopische Wortlaut scheint unvollständig oder elliptisch zu sein. Das Verb kann auch „lagert“, „übernachtet“ oder „bleibt“ bedeuten; aus dem weiteren Zusammenhang könnte eine nicht ausdrücklich genannte Ortsangabe zu ergänzen sein.
    reason: textual_variant
  - marker: b
    text: 'Ältere Wiedergabe: „die Könige und die Mächtigen, die [dort] wohnen“. Die ge’ezische Verbform spricht jedoch für eine direkte Anrede in der zweiten Person Plural.'
    reason: previous_rendering
lexical_decisions:
- source_word: ነገሥት
  choice: Könige
  rationale: Das gewöhnliche ge’ezische Pluralwort bezeichnet Könige oder Herrscher. Ohne Artikel und zusammen mit der Verbform der zweiten Person ist es hier am ehesten als Anrede zu verstehen.
- source_word: ኃያላን
  choice: Mächtige
  rationale: Im apokalyptischen Gerichtszusammenhang sind damit eher einflussreiche und mächtige Menschen als lediglich körperlich Starke gemeint.
- source_word: እለ
  choice: die ihr
  rationale: Der Relativmarker leitet den folgenden Relativsatz ein; im Deutschen nimmt „ihr“ die Anrede in der zweiten Person Plural ausdrücklich wieder auf.
- source_word: ትኃድሩ
  choice: wohnt
  rationale: Die Form ist zweite Person Plural und kann wohnen, bleiben, lagern oder übernachten bedeuten. „Wohnt“ ist ohne erhaltene Ortsangabe die am wenigsten spezifizierende Wiedergabe.
theological_decisions:
- issue: Unvollständiger oder elliptischer Wortlaut des überlieferten Verses
  choice: Nur die erhaltene Anrede samt unvollständigem Relativsatz übersetzen und die fehlende Ortsangabe nicht im Haupttext ergänzen.
  alternative: Ihr Könige und Mächtigen, die ihr dort wohnt / die ihr lagert
  rationale: Der vorliegende ge’ezische Wortlaut endet offenbar mitten im Gedanken. Eine Ergänzung im Haupttext würde mehr Sicherheit vortäuschen, als die Quelle erlaubt.
- issue: Anrede oder Beschreibung in der dritten Person
  choice: 'Direkte Anrede: „Ihr Könige und Mächtigen“'
  alternative: „Die Könige und Mächtigen, die [dort] wohnen“
  rationale: Die Verbform ትኃድሩ ist zweite Person Plural; auch die artikellosen Substantive stützen die vokativische Lesart. Die beschreibende Lesart wird nur als ältere beziehungsweise alternative Wiedergabe dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede wird ohne das heute stark altertümlich wirkende „O“ wiedergegeben. Der im Ausgangstext abgebrochene beziehungsweise elliptische Satz bleibt sichtbar und wird nicht stillschweigend vervollständigt.
