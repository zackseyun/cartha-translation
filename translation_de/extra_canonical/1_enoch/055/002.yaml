base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/055/002.yaml
  text: And he swore by his great name that from this time onward he would not do thus to all who dwell upon the dry land[a]; and I will set a sign in the heavens, and it will be a pledge of faithfulness between me and them forever, for as long as the days of heaven are upon the earth[c][b]; and this is by my command.
translation:
  language: de
  text: Und er schwor bei seinem großen Namen, dass er von nun an nicht mehr in dieser Weise mit allen verfahren werde, die auf dem trockenen Land wohnen. Und ich werde ein Zeichen am Himmel setzen[a], und es wird zwischen mir und ihnen für immer ein Unterpfand der Treue sein[b], solange die Tage des Himmels über der Erde währen. Dies ist meine Anordnung.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das „Zeichen am Himmel“ erinnert wahrscheinlich an das Zeichen nach der Flut; der Vers selbst sagt jedoch nicht, um welches Zeichen es sich handelt.
    reason: cross_reference
  - marker: b
    text: Das hier mit „Unterpfand der Treue“ wiedergegebene Wort kann auch allgemeiner „Treue“, „Glaube“ oder „Verlässlichkeit“ bedeuten; im Zusammenhang ist auch ein bundesähnliches Unterpfand denkbar.
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „Dies entspricht meiner Anordnung“ oder „Dies ist mein Beschluss.“'
    reason: lexical_alternative
lexical_decisions:
- source_word: መሐለ
  choice: er schwor
  rationale: Die Verbform bezeichnet das Ablegen eines Eides; „schwor“ ist direkt, würdevoll und idiomatisch.
- source_word: በስሙ ዐቢይ
  choice: bei seinem großen Namen
  rationale: Bewahrt die feierliche Schwurformel ohne zusätzliche Deutung.
- source_word: እምይእዜ
  choice: von nun an
  rationale: Gibt den zeitlichen Sinn klar und in natürlichem modernem Deutsch wieder.
- source_word: ኢይገብር ከመዝ
  choice: nicht mehr so … handeln werde
  rationale: Lässt wie die Vorlage offen, auf welches zuvor beschriebene Handeln sich „so“ bezieht.
- source_word: ለኵሎሙ እለ ይነብሩ ዲበ የብስ
  choice: an allen …, die auf dem trockenen Land wohnen
  rationale: „Trockenes Land“ wahrt die gegenüber dem allgemeineren „Erde“ spezifischere Bedeutung von የብስ und den möglichen Flutbezug.
- source_word: ትእምርተ እወዲ በሰማያት
  choice: ich werde ein Zeichen am Himmel setzen
  rationale: „Zeichen“ ist die natürliche Wiedergabe eines sichtbaren Kennzeichens; „am Himmel“ entspricht im Deutschen idiomatisch dem Ort des Zeichens.
- source_word: ማእከሌየ ወማእከሌሆሙ
  choice: zwischen mir und ihnen
  rationale: Dies ist die klare und idiomatische Wiedergabe der relationalen Wendung.
- source_word: ሃይማኖተ
  choice: ein Unterpfand der Treue
  rationale: Der Ausdruck kann Glaube, Treue oder Verlässlichkeit bezeichnen. „Unterpfand der Treue“ erfasst im Zusammenhang von Eid und Zeichen die bestätigende Funktion, ohne ausdrücklich „Bund“ in den Text einzutragen.
- source_word: እስከ ለዓለም መጠነ መዋዕለ ሰማይ ዲበ ምድር
  choice: für immer …, solange die Tage des Himmels über der Erde währen
  rationale: Bewahrt die poetische Dauerformel, statt sie zu einem bloßen „ewig“ zu verkürzen.
- source_word: ዝ በትእዛዝየ ውእቱ
  choice: Dies geschieht auf meinen Befehl
  rationale: Gibt die abschließende göttliche Autorisierung knapp und verständlich wieder; „nach meiner Anordnung“ bleibt möglich.
theological_decisions:
- issue: Ob das himmlische Zeichen ausdrücklich als Regenbogen bezeichnet werden soll
  choice: Das Zeichen bleibt im Haupttext unbenannt.
  alternative: „den Regenbogen am Himmel“ oder „den Bogen in den Wolken“
  rationale: Die Flutüberlieferung klingt deutlich an, doch der geezische Wortlaut nennt lediglich ein „Zeichen“. Eine genauere Benennung würde über den Vers hinausgehen.
- issue: Ob ሃይማኖተ ausdrücklich mit „Bund“ wiederzugeben ist
  choice: „ein Unterpfand der Treue“
  alternative: „ein Bund“, „Treue“ oder „Verlässlichkeit“
  rationale: Die Vorlage verwendet hier keinen eindeutigen Bundesbegriff. Die gewählte Formulierung wahrt den Zusammenhang von Eid, Zeichen und Treue, ohne die mögliche Bundestheologie als einziges Verständnis festzuschreiben.
- issue: Der Wechsel von der dritten zur ersten Person
  choice: „er schwor … Und ich werde“
  alternative: Die gesamte Aussage an eine einheitliche Erzählperspektive angleichen.
  rationale: Der vorliegende geezische Text wechselt von der dritten Person zur göttlichen Rede in der ersten Person. Dieser auffällige Wechsel wird nicht stillschweigend geglättet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die poetische Dauerformel, der spezifische Ausdruck „trockenes Land“ und der unvermittelte Personenwechsel der Vorlage bleiben erhalten. Die Zeichensetzung trennt Schwur und anschließende Ich-Rede, ohne eine in der Quelle nicht ausdrücklich markierte Sprecherzuweisung hinzuzufügen.
