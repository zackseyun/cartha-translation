revisions:
- from: Und er schwor bei seinem großen Namen, dass er von nun an nicht mehr so an allen handeln werde, die auf dem trockenen Land wohnen. Und ich werde ein Zeichen am Himmel setzen[a], und es wird zwischen mir und ihnen für immer ein Unterpfand der Treue sein[b], solange die Tage des Himmels über der Erde währen. Dies geschieht auf meinen Befehl.[c]
  to: Und er schwor bei seinem großen Namen, dass er von nun an nicht mehr in dieser Weise mit allen verfahren werde, die auf dem trockenen Land wohnen. Und ich werde ein Zeichen am Himmel setzen[a], und es wird zwischen mir und ihnen für immer ein Unterpfand der Treue sein[b], solange die Tage des Himmels über der Erde währen. Dies ist meine Anordnung.[c]
  rationale: 'Die Überarbeitung beschränkt sich auf zwei sichere sprachliche bzw. semantische Korrekturen: Die unidiomatische Verbindung „an allen handeln“ wird durch „mit allen verfahren“ ersetzt, ohne den bewusst offenen Verweis von „in dieser Weise“ zu konkretisieren. Die letzte Aussage wird als Anordnung wiedergegeben, um die kopulative göttliche Schlussformel angemessen abzubilden. Alle Fußnotenanker bleiben an ihren sachlich zugehörigen Stellen; die Fußnoten selbst bleiben inhaltlich gültig.'
  reviewer_model: gpt-5.6-terra
