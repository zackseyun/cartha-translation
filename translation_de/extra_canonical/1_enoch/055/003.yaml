base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/055/003.yaml
  text: When I desired to deliver them into the hand of the angels on the day of tribulation and pain[a], I will cause my punishment and my wrath to abide upon them, says God[d][c][b], the Lord of spirits.
translation:
  language: de
  text: Als ich sie am Tag der Bedrängnis und des Schmerzes in die Hand der Engel ausliefern wollte,[a][b] werde ich meine Strafe und meinen Zorn auf ihnen ruhen lassen, spricht Gott, der Herr der Geister.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Wortlaut am Übergang zu „meine Strafe und meinen Zorn“ ist im Geʿez schwierig. Gemeint scheint der Übergang von der Auslieferung an die Engel zum dauernden göttlichen Gericht zu sein.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich: „in die Hand der Engel“; dies ist eine gerichtliche Wendung für die Übergabe in die Gewalt eines anderen.'
    reason: cultural_note
  - marker: c
    text: 'Oder mit stärker bedingender Verknüpfung: „Wenn ich sie am Tag der Bedrängnis und des Schmerzes in die Hand der Engel ausliefern will, dann werde ich meine Strafe und meinen Zorn auf ihnen ruhen lassen.“'
    reason: previous_rendering
lexical_decisions:
- source_word: ፈቀድኩ
  choice: ich beschloss
  rationale: Das Verb bezeichnet Wollen oder Beabsichtigen. „Ich beschloss“ gibt hier den göttlichen Willensentschluss natürlich wieder, ohne ihn als förmlichen Erlass zu überzeichnen.
- source_word: አጽንዖሙ
  choice: sie … zu geben
  rationale: In Verbindung mit „in die Hand der Engel“ bezeichnet das Verb eine Übergabe in deren Gewalt; die vollständige Wendung trägt den gerichtlichen Sinn.
- source_word: በእደ መላእክት
  choice: in die Hand der Engel
  rationale: Die konkrete biblisch-gerichtliche Metapher bleibt erhalten und wird nicht zur bloßen Angabe „an die Engel“ abgeflacht.
- source_word: በዕለተ ምንዳቤ ወሕማም
  choice: am Tag der Bedrängnis und des Schmerzes
  rationale: Die Paarung bewahrt sowohl äußere Not als auch erlittenen Schmerz und passt zum apokalyptischen Register.
- source_word: መቅሠፍተየ
  choice: meine Strafe
  rationale: Das Wort kann Schlag, Geißel oder strafendes Unheil bezeichnen. „Strafe“ wahrt den gerichtlichen Zusammenhang, ohne die konkrete Form festzulegen.
- source_word: መዐትየ
  choice: meinen Zorn
  rationale: „Zorn“ ist im Deutschen die natürliche, würdevolle Wiedergabe göttlichen Gerichtsornes.
- source_word: አኃድር ዲቤሆሙ
  choice: auf ihnen ruhen lassen
  rationale: Die kausative Form vermittelt das Bild, dass Strafe und Zorn sich auf ihnen niederlassen und dort bleiben.
- source_word: እግዚአብሔር እግዚአ መናፈስት
  choice: Gott, der Herr der Geister
  rationale: 'Die zwei unterschiedlichen äthiopischen Bezeichnungen werden unterschieden wiedergegeben: እግዚአብሔር als „Gott“ und እግዚአ መናፈስት als „Herr der Geister“.'
theological_decisions:
- issue: Göttliches Handeln durch Engel
  choice: Gott gibt die Gerichteten in die Hand der Engel; zugleich lässt er seine eigene Strafe und seinen Zorn auf ihnen ruhen.
  alternative: Die Engel selbst bilden die Strafe, oder die Bedrängnis wird unabhängig vom göttlichen Zorn verstanden.
  rationale: Der Satz unterscheidet die vermittelte Ausführung durch Engel von Gottes eigenem Strafhandeln. Beide Ebenen bleiben nebeneinander bestehen.
- issue: Zeitliches und syntaktisches Verhältnis der Satzteile
  choice: Der schwierige Übergang wird als Folge von beabsichtigter Übergabe und angekündigtem Gericht wiedergegeben.
  alternative: „Wenn ich sie … übergeben will, dann …“ beziehungsweise eine engere konditionale Verknüpfung.
  rationale: Die Geʿez-Formulierung am Übergang ist schwierig; die Übersetzung lässt die Spannung stehen, statt einen eindeutigen zeitlichen Ablauf zu erzwingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht erhöhtem apokalyptischem Ton. Die Hand-Metapher sowie der Titel „Herr der Geister“ bleiben quellennah erhalten; schwerfällige oder konfessionell geprägte Formulierungen werden vermieden.
