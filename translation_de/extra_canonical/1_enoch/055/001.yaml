    issue: Unidiomatische und potenziell missverständliche Formulierung „bereute es das Haupt der Tage“
    rationale: Das Verb „bereuen“ wird im heutigen Deutschen normalerweise mit einem ausgedrückten Objekt verwendet. Das unbestimmte „es“ hat keinen klaren textlichen Bezug und kann die Aussage verfälschen.
  - severity: low
    issue: Fußnotenalternative „ließ sich umstimmen“
    rationale: Diese Formulierung kann einen Veranlasser des Sinneswandels implizieren. Das ge’ezische Verb selbst nennt keinen solchen Veranlasser.
