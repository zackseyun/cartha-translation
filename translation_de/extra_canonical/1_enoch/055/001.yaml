base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/055/001.yaml
  text: And after this the Head of Days relented and said[a], “In vain I have destroyed all those who dwell on the dry land.”
translation:
  language: de
  text: 'Danach empfand das Haupt der Tage[a] Reue und sagte: »Vergeblich habe ich alle vernichtet, die auf dem trockenen Land wohnen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bereute«; »änderte seinen Entschluss«. Das ge’ezische Verb kann Reue, ein Nachgeben oder eine Sinnesänderung ausdrücken; bei einem göttlichen Subjekt muss es nicht dieselbe moralische Färbung haben wie das deutsche »bereuen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እምድኅረዝ
  choice: Danach
  rationale: Gibt die zeitliche Übergangsformel knapp und natürlich wieder und wahrt die Abfolge der apokalyptischen Erzählung.
- source_word: ነሥሐ
  choice: bereute es
  rationale: Bewahrt die auffällige Aussage des ge’ezischen Verbs mit seiner Bedeutung von Reue, Umkehr oder Sinnesänderung, ohne die theologische Spannung bei einem göttlichen Subjekt abzumildern.
- source_word: ርእሰ መዋዕል
  choice: das Haupt der Tage
  rationale: Durchsichtige, formnahe Wiedergabe des besonderen Titels; vermeidet eine harmonisierende Ersetzung durch einen geläufigeren biblischen Titel.
- source_word: ሕኵፖልክዎሙ
  choice: habe ich … vernichtet
  rationale: Gibt die starke, auf eine Mehrzahl bezogene Vernichtungsaussage direkt wieder, ohne sie auszuschmücken.
- source_word: ለኵሎሙ ለእለ ይነብሩ
  choice: alle …, die … wohnen
  rationale: Erhält sowohl die ausdrückliche Gesamtheit als auch den durativen Sinn des Wohnens.
- source_word: ውስተ የብስ
  choice: auf dem trockenen Land
  rationale: Bewahrt gegenüber dem allgemeineren „Erde“ die konkrete Bedeutung „trockenes Land“ und damit den möglichen Anklang an Flut- und Gerichtsbildsprache.
theological_decisions:
- issue: Ob ነሥሐ beim „Haupt der Tage“ theologisch abgemildert werden soll
  choice: bereute es
  alternative: ließ sich umstimmen; änderte seinen Entschluss
  rationale: Der Ausgangstext verwendet eine auffällige anthropopathische Aussage. Die Hauptfassung bewahrt diese Spannung; die Fußnote nennt weniger moralisch gefärbte, semantisch mögliche Wiedergaben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Haupt der Tage“ bleibt als eigentümlicher apokalyptischer Titel erhalten. Die Formulierung „bereute es“ ist bewusst klar und zugleich spannungsvoll; „trockenes Land“ hält die konkrete Bildsprache des Ge’ez fest.
