base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/004.yaml
  text: Likewise[a], Uriel showed me twelve openings in the circuit of the chariots of the sun in the sky, from which the rays of the sun go out[b], and from which warmth comes forth upon the earth when they are opened in the seasons appointed for them.
translation:
  language: de
  text: Ebenso zeigte mir Uriel zwölf Öffnungen im Umlauf der Wagen der Sonne am Himmel. Aus ihnen gehen die Strahlen der Sonne hervor[a], und von ihnen geht Wärme auf die Erde aus, wenn sie zu den ihnen bestimmten Zeiten geöffnet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich möglicherweise „die Füße der Sonne“; im Zusammenhang sind wohl die ausgehenden Strahlen der Sonne oder ihr Licht gemeint.
    reason: lexical_alternative
lexical_decisions:
- source_word: ፲ወ፪ኆኃውተ (erschlossene Lesart hinter ፲ሥሩ ወካልእ *ኃዋላወ)
  choice: zwölf Öffnungen
  rationale: Die überlieferte Transkription ist offenbar stark entstellt; die erschlossene Lesart bezeichnet zwölf Öffnungen und passt zum astronomischen Zusammenhang.
- source_word: በአውደ (erschlossene Lesart hinter በአበበ)
  choice: im Umlauf
  rationale: Die erschlossene Form bezeichnet den Kreis beziehungsweise Umlauf; „im Umlauf“ bewahrt die räumlich-astronomische Vorstellung in natürlichem Deutsch.
- source_word: ሰረገላት ፀሐይ
  choice: Sonnenwagen
  rationale: Das Kompositum erhält das konkrete kosmologische Bild der Wagen der Sonne knapp und würdig.
- source_word: እገሪሃ ለፀሐይ
  choice: die Strahlen der Sonne
  rationale: Die schwierige Form kann wörtlich auf „Füße“ weisen; im Kontext sind die ausgehenden Strahlen der Sonne gemeint. Die Unsicherheit wird in der Fußnote bewahrt.
- source_word: ሞቅ
  choice: Wärme
  rationale: „Wärme“ gibt die saisonale Wirkung auf die Erde wieder, ohne die Intensität unnötig zu steigern.
- source_word: ሶበ ይትረኃዉ
  choice: wenn sie ... geöffnet werden
  rationale: Die passive Formulierung hält an der konkreten Vorstellung himmlischer Öffnungen fest.
- source_word: በአዝማን እለ እሙራን ሎሙ
  choice: zu den für sie bestimmten Zeiten
  rationale: Dies wahrt die Vorstellung einer festgelegten zeitlichen Ordnung, ohne deren Urheber ausdrücklich hinzuzufügen.
theological_decisions:
- issue: Art des himmlischen Mechanismus
  choice: Die konkreten Bilder von Sonnenwagen, Umlauf und Öffnungen bleiben erhalten.
  alternative: Die Aussage als moderne Beschreibung von Sonnenlicht und Jahreszeiten zu verallgemeinern.
  rationale: Der Text schildert die Himmelsordnung in apokalyptisch-kosmologischen Bildern; diese dürfen nicht in abstrakte moderne Naturbeschreibung aufgelöst werden.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die Satzteilung verbessert die Lesbarkeit, ohne die logische Verbindung der beiden Wirkungen der Öffnungen aufzugeben. Die textkritisch erschlossenen Lesarten „zwölf Öffnungen“ und „im Umlauf“ folgen der jüngsten Quellenprüfung statt der offenbar verderbten Transkription.
