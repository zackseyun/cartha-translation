base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/002.yaml
  text: 'And because of them people go astray concerning them[a], for these lights render service at the stations of the world in righteousness: one in the first portal, and one in the third portal of heaven, and one in the fourth portal, and one in the sixth portal[e][d][c][b]; and the careful ordering of the world is completed in three hundred and sixty-four stations of the world.'
translation:
  language: de
  text: 'Und ihretwegen irren die Menschen in Bezug auf sie[a]; denn diese Lichter wechseln in Gerechtigkeit[b] die Standorte der Welt[c]: eines im ersten Tor, zwei im dritten Tor des Himmels, zwei im vierten Tor und zwei im sechsten Tor[d]. Und die genaue Ordnung der Welt wird in dreihundertvierundsechzig Standorten der Welt vollendet[e].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: »Und ihretwegen irren die Menschen; denn diese Lichter wechseln ihre Standorte auf rechte Weise.« Die schwierige Satzfügung stellt möglicherweise den menschlichen Irrtum der regelmäßigen Ordnung der Himmelslichter gegenüber.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »ordnungsgemäß« beziehungsweise »auf rechte Weise«. Wörtlich steht hier der Ausdruck »in Gerechtigkeit«.'
    reason: theological_ambiguity
  - marker: c
    text: 'Oder: »verändern ihre Standorte«; wörtlicher auch: »die Sitze der Welt«.'
    reason: lexical_alternative
  - marker: d
    text: Die vorliegende geʿezische Zeile nennt eines beim ersten Tor und jeweils zwei beim dritten, vierten und sechsten Tor. Eine geglättete Überlieferung beziehungsweise Übersetzung liest an allen vier Stellen »eines«.
    reason: textual_difficulty
  - marker: e
    text: Der schwierige Schlusssatz bezieht sich wahrscheinlich auf das henochische Schema eines Jahres mit 364 geordneten Positionen oder Tagen; der geʿezische Wortlaut spricht wörtlicher von der genauen Ordnung der Welt, die in 364 »Standorten« vollendet wird.
    reason: alternative_reading
lexical_decisions:
- source_word: ወበእንቲአሆሙ
  choice: Und ihretwegen
  rationale: Die Präpositionalverbindung hat hier am ehesten kausale Bedeutung und führt den Grund für den menschlichen Irrtum an.
- source_word: ይጌግዩ ሰብእ ቦሙ
  choice: irren sich die Menschen in Bezug auf sie
  rationale: Das Verb bezeichnet Irren oder Abirren; ቦሙ wird im Zusammenhang als Gegenstand des Irrtums verstanden, nicht als räumliches »unter ihnen«.
- source_word: እሙንቱ ብርሃናት
  choice: diese Lichter
  rationale: Gemeint sind die Himmelslichter des astronomischen Abschnitts; »Lichter« ist verständlich und wahrt die Bildsprache.
- source_word: በጽድቅ
  choice: in Gerechtigkeit
  rationale: Die formale Wiedergabe bewahrt die moralisch-kosmische Bedeutungsspannung; im Kontext kann zugleich die richtige, geordnete Regelmäßigkeit gemeint sein.
- source_word: ይትቀየዩ
  choice: wechseln
  rationale: Das Verb bezeichnet Wechsel oder Veränderung und wird hier auf die wechselnden Positionen der Himmelslichter bezogen, ohne den Vorgang technisch festzulegen.
- source_word: መንበረ ዓለም
  choice: Standorte der Welt
  rationale: »Standorte« gibt die für die Himmelslichter bestimmten Plätze wieder und erhält zugleich den wiederholten Ausdruck der Vorlage.
- source_word: ኆኅት
  choice: Tor
  rationale: Das gewöhnliche deutsche Wort wahrt das wiederkehrende Bild von Öffnungen oder Toren des Himmels und klingt natürlicher als »Portal«.
- source_word: ይትፌጸም ጥንቃቄ ዓለም
  choice: die genaue Ordnung der Welt vollendet sich
  rationale: ጥንቃቄ trägt die Nuance von Sorgfalt, Genauigkeit und Präzision; die mediale Form wird mit »vollendet sich« wiedergegeben.
