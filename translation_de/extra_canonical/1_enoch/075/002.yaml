- issue: Bedeutung von በጽድቅ im astronomischen Zusammenhang
  choice: in Gerechtigkeit
  alternative: ordnungsgemäß; auf rechte Weise
  rationale: Die Übersetzung erhält den eigenständigen Begriff der Gerechtigkeit und damit die Verbindung von kosmischer Ordnung und theologischer Wertung.
- issue: Deutung der Zahl 364 im Schlusssatz
  choice: 364 Standorte der Welt
  alternative: 364 Tage des schematischen Jahres
  rationale: Der Haupttext bleibt bei der wiederholten Ortsbezeichnung der geʿezischen Vorlage; die naheliegende kalendarische Deutung wird in der Fußnote erläutert.
- issue: Zahlenverteilung auf die Himmelstore
  choice: eines im ersten, zwei im dritten, zwei im vierten und zwei im sechsten Tor
  alternative: je eines im ersten, dritten, vierten und sechsten Tor
  rationale: Die überlieferte geʿezische Zeile bietet ausdrücklich die Zahlen 1, 2, 2 und 2. Die abweichende, geglättete Lesart wird nicht stillschweigend in den Haupttext übernommen.
