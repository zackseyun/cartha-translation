base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/005.yaml
  text: and for the winds[a], and for the spirit of dew[c][b], when the openings are opened in heaven at the ends.
translation:
  language: de
  text: und für die Winde[a] und für den Geist des Taus[b], wenn die Öffnungen im Himmel an den Enden geöffnet werden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit „Winde“ wiedergegebene Wort kann auch „Geister“ bedeuten; in diesem kosmologisch-meteorologischen Zusammenhang sind wahrscheinlich Winde gemeint.
    reason: lexical_alternative
  - marker: b
    text: Die Wendung „Geist des Taus“ ist sprachlich schwierig; möglich sind auch „Hauch des Taus“ oder ein taubringender Wind.
    reason: lexical_alternative
  - marker: c
    text: Der eingeklammerte Satzteil ist in der Textüberlieferung unsicher. „Öffnungen“ kann auch als „Fenster“ oder „Durchlässe“ verstanden werden.
    reason: textual_variant
lexical_decisions:
- source_word: ነፋሳት
  choice: Winde
  rationale: Im Astronomischen Buch bezeichnet das Wort hier am ehesten kosmische Winde als geschaffene Wetterphänomene; „Winde“ wahrt diesen Sinn besser als „Geister“.
- source_word: መንፈሰ
  choice: Geist
  rationale: Die schwierige Verbindung mit „Tau“ wird möglichst formal wiedergegeben, ohne sie auf ein rein physisches Phänomen zu reduzieren.
- source_word: ጠል
  choice: Tau
  rationale: Das Wort ist eine klare meteorologische Bezeichnung und wird wörtlich beibehalten.
- source_word: ሶበ
  choice: wenn
  rationale: Die temporale Konjunktion leitet den Umstand ein, unter dem die himmlischen Öffnungen geöffnet werden.
- source_word: ይትረኃዉ
  choice: geöffnet werden
  rationale: Die passive Wiedergabe entspricht der Form und vermeidet es, einen nicht genannten Handelnden einzuführen.
- source_word: ርኅወተ
  choice: die Öffnungen
  rationale: „Öffnungen“ ist weit genug, um die mögliche Bedeutung als Fenster oder Durchlässe einzuschließen, ohne den unsicheren Ausdruck zu stark festzulegen.
- source_word: በሰማይ
  choice: des Himmels
  rationale: Der Singular wird gewahrt; im Deutschen verbindet die Genitivfügung die Öffnungen natürlich mit dem Himmel.
- source_word: አጽናፈ
  choice: am Rand
  rationale: Der Ausdruck bezeichnet die äußersten Grenzen oder Enden. „Am Rand des Himmels“ ist im Deutschen natürlich und bewahrt die kosmische Raumvorstellung.
theological_decisions:
- issue: Ob die Wendung über den Tau in gewöhnliche Wettersprache aufgelöst werden soll
  choice: „Geist des Taus“ im Haupttext
  alternative: „Hauch des Taus“ oder „taubringender Wind“
  rationale: Die ungewöhnliche kosmologische Bildsprache bleibt erhalten und wird nicht rationalisierend oder konfessionell gedeutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die elliptische Fortsetzung mit „und für“ bleibt erhalten, da der Vers offenbar Teil einer Aufzählung ist. Die fremdartige apokalyptische Kosmologie wird nicht geglättet.
