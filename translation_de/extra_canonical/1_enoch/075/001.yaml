base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/001.yaml
  text: And the leaders of the heads of thousands[a], who are over all creation and over all the stars, together with those four that are added and do not separate from their service[e][d][c][b], according to the reckoning of the year—and these render service on the four days that are not counted in the reckoning of the year.
translation:
  language: de
  text: Und die Leiter der Häupter der Tausendschaften[a], die über die ganze Schöpfung und über alle Sterne gesetzt sind, trennen sich zusammen mit jenen vier, die hinzugefügt werden, nicht von ihrem Dienst[b], gemäß der Berechnung des Jahres; und diese versehen Dienst an den vier Tagen[c], die bei der Berechnung des Jahres nicht mitgezählt werden[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Leiter der Häupter der Tausenden“. Die Wendung bezeichnet eine gestufte Rangordnung.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „weichen nicht von ihrer Aufgabe ab“. Der Ausdruck kann Dienst, Werk oder zugewiesene Funktion bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Das zugrunde liegende Verb ist schwierig. Es kann auch einen Wechsel beziehungsweise eine Veränderung bezeichnen; „Dienst versehen“ gibt im Zusammenhang die Funktion wieder, ohne die genaue Nuance festzulegen.
    reason: lexical_alternative
  - marker: d
    text: Gemeint sind die vier zusätzlichen kalendarischen Tage an den Wendepunkten des Jahres im 364-Tage-Schema des Astronomischen Buches.
    reason: cultural_note
lexical_decisions:
- source_word: መራሕያኒሆሙ ለአርእስተ አእላፍ
  choice: die Führer der Obersten über Tausend
  rationale: Gibt sowohl das auf Führen bezogene መራሕያኒሆሙ als auch die wörtlich hierarchische Wendung „Häupter über Tausend“ wieder; „Oberste über Tausend“ ist in würdigem modernem Deutsch verständlicher.
- source_word: ዲበ ኵሉ ፍጥረት ወዲበ ኵሉ ከዋክብት
  choice: über die ganze Schöpfung und über alle Sterne gesetzt
  rationale: Bewahrt den kosmischen Umfang von ፍጥረት und die Leitungsrelation von ዲበ; „gesetzt“ ergänzt idiomatisch das im Deutschen erforderliche Prädikat.
- source_word: ምስለ እሉ ፬ እለ ይትዌሰኩ
  choice: zusammen mit jenen vier, die hinzugefügt werden
  rationale: Beachtet das Relativpronomen እለ, sodass „hinzugefügt werden“ ausdrücklich die vier näher bestimmt.
- source_word: ኢይትሌለዩ እምነ ምግባሮሙ
  choice: trennen sich ... nicht von ihrem Dienst
  rationale: Folgt eng der negierten Trennungsform und gibt ምግባር im Zusammenhang der geordneten kosmischen Aufgabe als „Dienst“ wieder.
- source_word: በከመ ሐሳበ ዓመት
  choice: gemäß der Berechnung des Jahres
  rationale: „Berechnung“ vermittelt den technischen kalendarischen Sinn von ሐሳብ in natürlichem Deutsch.
- source_word: ይትቀየዩ
  choice: wechseln sich ... im Dienst ab
  rationale: Die schwierige Form kann Veränderung oder turnusmäßigen Wechsel bezeichnen; diese Wiedergabe bewahrt den Wechselaspekt und fügt sich in den Kontext zugewiesener Aufgaben.
- source_word: ፬ መዋዐለ እለ ኢይትኃሰቡ በሐሳበ ዓመት
  choice: die vier Tage, die bei der Berechnung des Jahres nicht mitgezählt werden
  rationale: Gibt die kalendarische Aussage klar wieder, ohne zu behaupten, die Tage gehörten überhaupt nicht zum Jahr.
theological_decisions:
- issue: Wesen der genannten vier
  choice: Der Haupttext nennt sie zunächst nur „jene vier“ und bezeichnet am Ende vier nicht mitgezählte Tage.
  alternative: Die vier könnten himmlische Amtsträger, die zusätzlichen Tage selbst oder apokalyptisch zugleich Tage und ihre Aufseher sein.
  rationale: Der ge’ezische Text lässt den Bezug zunächst offen. Die Übersetzung erhält diese Spannung und löst die kosmisch-kalendarische Bildsprache nicht konfessionell auf.
- issue: Bezug von „die hinzugefügt werden“
  choice: Der Relativsatz bestimmt die vier.
  alternative: Die Hinzufügung könnte syntaktisch auf die Führergruppe insgesamt bezogen werden.
  rationale: Das unmittelbar vorausgehende Relativpronomen እለ stützt klar den Bezug auf „jene vier“.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die ge’ezische Syntax. Technische Kalenderbegriffe bleiben verständlich; die Mehrdeutigkeit der vier und des schwierigen Verbs wird nicht im Haupttext dogmatisch aufgelöst.
