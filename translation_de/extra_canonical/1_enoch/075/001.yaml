  to: Und die Leiter der Häupter der Tausendschaften[a], die über die ganze Schöpfung und über alle Sterne gesetzt sind, trennen sich zusammen mit jenen vier, die hinzugefügt werden, nicht von ihrem Dienst[b], gemäß der Berechnung des Jahres; und diese versehen Dienst an den vier Tagen[c], die bei der Berechnung des Jahres nicht mitgezählt werden[d].
