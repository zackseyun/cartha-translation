base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/006.yaml
  text: When the twelve other portals in heaven[a], at the ends of the earth, are opened[c][b], from which the sun and the moon and the stars come out.
translation:
  language: de
  text: Wenn die zwölf Tore[a] im Himmel an den Enden der Erde[b] geöffnet werden, aus denen die Sonne, der Mond und die Sterne hervorgehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Öffnungen“ beziehungsweise „Fenster“. Gemeint sind Durchgänge in der vorgestellten Himmelsstruktur.'
    reason: lexical_alternative
  - marker: b
    text: Die „Enden der Erde“ gehören zur antiken kosmologischen Bildwelt des Textes und sind keine moderne naturwissenschaftliche Beschreibung.
    reason: cultural_note
lexical_decisions:
- source_word: ሶበ
  choice: Wenn
  rationale: Die Konjunktion leitet hier einen temporalen Nebensatz ein; „wenn“ gibt diese syntaktische Funktion wieder.
- source_word: ይትረኃዉ
  choice: geöffnet werden
  rationale: Die Verbform bezeichnet das Geöffnetwerden und ist nicht als bloße Existenzangabe zu verstehen.
- source_word: ፲ሥሩ ወካልእ
  choice: die zwölf anderen
  rationale: Die Wendung bezeichnet zwölf weitere beziehungsweise andere Tore; „anderen“ bewahrt den Bezug auf die zuvor beschriebenen Tore.
- source_word: ኃዋላወ
  choice: Tore
  rationale: Gemeint sind Durchgänge oder Öffnungen in der vorgestellten Himmelsstruktur. „Tore“ vermeidet die unschöne Verbindung „Öffnungen werden geöffnet“ und erhält das konkrete Bild.
- source_word: በሰማይ
  choice: am Himmel
  rationale: Im Deutschen bezeichnet „am Himmel“ natürlich den Ort der kosmischen Tore, ohne die apokalyptische Vorstellung abzuschwächen.
- source_word: ዲበ አጽናፈ ምድር
  choice: über den Enden der Erde
  rationale: ዲበ hat hier den räumlichen Sinn „über/auf“; „über den Enden der Erde“ bewahrt die räumliche Anordnung der antiken Kosmologie.
- source_word: እለ እምኔሆሙ ይወፅእ
  choice: aus denen … hervorgehen
  rationale: Der Relativsatz bezieht sich auf die Tore und beschreibt die konkrete Bewegung der Himmelskörper aus ihnen heraus.
- source_word: ፀሐይ ወወርኅ ወከዋክብት
  choice: die Sonne, der Mond und die Sterne
  rationale: Die vollständige Aufzählung und das wiederholte verbindende „und“ des Ausgangstextes bleiben in natürlichem Deutsch erhalten.
theological_decisions:
- issue: Kosmologische Sprache von Himmelstoren und Enden der Erde
  choice: Die konkrete räumliche Bildwelt wird beibehalten.
  alternative: Die Ausdrücke als moderne Himmelsrichtungen, Horizonte oder astronomische Sektoren wiedergeben.
  rationale: Der Text beschreibt eine strukturierte kosmische Architektur. Eine Modernisierung würde seine antike apokalyptische Vorstellungswelt interpretierend auflösen.
- issue: Unvollständiger Satzbau des Einzelverses
  choice: Der mit „Wenn“ eingeleitete Nebensatz bleibt als solcher stehen.
  alternative: Den Vers durch „Dann gibt es …“ zu einem selbstständigen Hauptsatz umformen.
  rationale: Die abhängige Syntax entspricht dem überlieferten Wortlaut und sollte nicht durch eine sachlich andere Existenzaussage ersetzt werden; der Gedankengang setzt sich im Kontext fort.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete kosmologische Bildsprache und der abhängige Satzbau des Ausgangstextes werden bewahrt; „hervorgehen“ ist zugleich natürlich und dem gehobenen apokalyptischen Register angemessen.
