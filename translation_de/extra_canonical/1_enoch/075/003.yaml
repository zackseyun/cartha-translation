base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/075/003.yaml
  text: For concerning the signs and the seasons and the years and the days[a], Uriel, the angel whom the Lord of glory appointed forever over all the luminaries of heaven in heaven and in the world, showed me how they rule over the face of heaven and are seen upon the earth[e][d][c][b], and become guides for day and for night—the sun and the moon and the stars and all the ministering powers that make their circuit in all the chariots of heaven.
translation:
  language: de
  text: 'Denn über die Zeichen, die festgesetzten Zeiten[a], die Jahre und die Tage zeigte mir Uriel, der Engel, den der Herr der Herrlichkeit für immer über alle Himmelslichter im Himmel und in der Welt eingesetzt hat, wie sie über das Antlitz des Himmels[b] herrschen und auf der Erde zu sehen sind und zu Wegweisern für Tag und Nacht werden: die Sonne, der Mond, die Sterne und alle dienenden Mächte[c], die in allen Wagen des Himmels[d] ihre Kreise ziehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Zeiten“ beziehungsweise „Zeitabschnitte“. Gemeint sind festgelegte Einteilungen der Zeit im kalendarischen Sinn.'
    reason: lexical_alternative
  - marker: b
    text: „Das Antlitz des Himmels“ ist ein wörtliches Bild für die sichtbare Weite des Himmels.
    reason: cultural_note
  - marker: c
    text: „Dienende Mächte“ ist unsicher; gemeint sein könnten dienende himmlische Ordnungen oder Funktionen, die mit den Himmelskörpern verbunden sind.
    reason: lexical_alternative
  - marker: d
    text: Die „Wagen des Himmels“ können die geordneten Bahnen bezeichnen, auf denen sich die Himmelskörper bewegen; im Haupttext bleibt jedoch das Bild der Vorlage erhalten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ትእምርት
  choice: Zeichen
  rationale: Bezeichnet hier beobachtbare Himmelszeichen für die Zeitrechnung, ohne notwendig Vorzeichen im unheilvollen Sinn zu meinen.
- source_word: አዝማን
  choice: festgesetzte Zeiten
  rationale: Gibt kosmisch geordnete Zeitabschnitte präziser wieder als das im Deutschen leicht meteorologisch verstandene „Jahreszeiten“.
- source_word: መዋዕል
  choice: Tage
  rationale: Entspricht in der Reihe von Zeichen, Zeiten, Jahren und Tagen am unmittelbarsten der geordneten Zeiteinheit.
- source_word: አርአየኒ
  choice: zeigte mir
  rationale: Bewahrt die konkrete Sprache der Vision, ohne durch „offenbarte“ zusätzliches theologisches Gewicht einzutragen.
- source_word: እግዚአ ስብሐት
  choice: der Herr der Herrlichkeit
  rationale: Bewahrt den erhabenen göttlichen Titel und seine Genitivkonstruktion.
- source_word: ለዓለም
  choice: für immer
  rationale: Das ausdrücklich vorhandene Zeitelement bezieht sich auf Uriels Einsetzung und darf nicht ausgelassen werden.
- source_word: ብርሃናት ሰማይ
  choice: Himmelslichter
  rationale: Natürliches modernes Deutsch für die geordneten leuchtenden Himmelskörper; der kosmisch-technische Sinn bleibt erhalten.
- source_word: በሰማይ ወበዓለም
  choice: im Himmel und in der Welt
  rationale: Folgt der räumlichen Zweiteilung des äthiopischen Textes, ohne sie kosmologisch enger festzulegen.
- source_word: ይምልኩ
  choice: herrschen
  rationale: Erhält die ausdrücklich personale Sprache kosmischer Herrschaft und ersetzt sie nicht durch moderne mechanische Beschreibung.
- source_word: ገጸ ሰማይ
  choice: das Antlitz des Himmels
  rationale: Bewahrt das bildhafte Idiom für die sichtbare Himmelsfläche.
- source_word: መራሕያነ
  choice: Wegweiser
  rationale: Drückt ihre leitende und zeitordnende Funktion verständlich aus, ohne die bereits genannte Herrschaftssprache zu verdoppeln.
- source_word: ቅንየታት
  choice: dienende Mächte
  rationale: Die schwierige Bezeichnung kann himmlische Diener, Ordnungen oder Funktionen meinen; diese Wiedergabe bewahrt ihre personale und kosmische Offenheit.
- source_word: የአውዱ
  choice: ihre Kreise ziehen
  rationale: Gibt die umlaufende Bewegung natürlich und bildhaft wieder.
- source_word: ሰረገላት ሰማይ
  choice: Wagen des Himmels
  rationale: Erhält das apokalyptische Bild, statt es vorschnell als Bahnen oder Umlaufbahnen auszulegen.
theological_decisions:
- issue: Personale Herrschaftssprache für die Himmelslichter
  choice: „sie … herrschen“ und „zu Wegweisern … werden“
  alternative: Unpersönliche astronomische Formulierung wie „sie ziehen über den Himmel und markieren Tag und Nacht“
  rationale: Der äthiopische Text beschreibt die kosmische Ordnung mit Herrschafts- und Leitungsbegriffen. Diese Spannung zwischen Himmelskörpern und personaler Sprache bleibt bewusst bestehen.
- issue: Bezug und Dauer der Einsetzung Uriels
  choice: Uriel ist „für immer über alle Himmelslichter … eingesetzt“
  alternative: „für immer“ auf die Himmelslichter oder ihre Tätigkeit beziehen beziehungsweise auslassen
  rationale: Die Wortfolge stützt den Bezug auf die Einsetzung Uriels; zugleich wird die im Quelltext ausdrücklich genannte Dauer vollständig wiedergegeben.
- issue: Bild der Himmelswagen
  choice: Wörtliches Bild „Wagen des Himmels“ im Haupttext
  alternative: Deutende Wiedergabe „Bahnen des Himmels“ oder „Umlaufbahnen“
  rationale: Die apokalyptische Bildwelt soll nicht in moderne Astronomiesprache aufgelöst werden; die mögliche funktionale Bedeutung wird in der Fußnote genannt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter apokalyptischer Bildsprache. Der lange Satzbau folgt der Quelle, wird aber durch Doppelpunkt und klare Gliederung lesbar gehalten. „Festgesetzte Zeiten“ vermeidet die im Deutschen meteorologische Verengung von „Jahreszeiten“.
