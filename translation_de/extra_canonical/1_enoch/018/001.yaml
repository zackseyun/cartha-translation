base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/001.yaml
  text: And I saw the storehouses of all the winds[b][a], and I saw how with them he adorned all creation and the foundations of the earth.
translation:
  language: de
  text: Und ich sah die Vorratskammern[a] aller Winde, und ich sah, wie er mit ihnen die ganze Schöpfung und die Fundamente der Erde schmückte[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Schatzkammern“. Gemeint sind himmlische Kammern, in denen die Winde verwahrt werden.'
    reason: lexical_alternative
  - marker: b
    text: Das Verb kann hier auch den Sinn „ordnete“ oder „gründete“ haben, nicht nur „schmückte“.
    reason: lexical_alternative
lexical_decisions:
- source_word: መዛግብተ
  choice: Vorratskammern
  rationale: Das Substantiv bezeichnet Schatz- oder Vorratskammern. „Vorratskammern“ bewahrt hier das konkrete kosmische Bild von himmlischen Räumen, in denen die Winde verwahrt werden, ohne einen finanziellen Beiklang hervorzurufen.
- source_word: ኵሉ፡ ነፋሳት
  choice: aller Winde
  rationale: Obwohl ነፋሳት auch „Geister“ oder „Atemzüge“ bedeuten kann, legt der kosmologische Zusammenhang „Winde“ nahe.
- source_word: ከመ
  choice: wie
  rationale: Die Konjunktion führt den Inhalt der Schau ein und bezeichnet hier die Weise, in der die Winde in Bezug auf die Schöpfung eingesetzt werden.
- source_word: ቦሙ
  choice: mit ihnen
  rationale: Die Form verweist instrumental oder begleitend auf die Winde zurück. „Mit ihnen“ bleibt nah am Wortlaut und lässt zugleich zu, dass sie als Mittel verstanden werden.
- source_word: አሰርገወ
  choice: schmückte
  rationale: Das schwierige Verb kann das Schmücken oder Schönmachen bezeichnen, möglicherweise mit dem zusätzlichen Sinn des Ordnens oder Festfügens. „Schmückte“ erhält das anschauliche Bild des Ausgangstextes.
- source_word: ኵሎ፡ ፍጥረተ
  choice: die ganze Schöpfung
  rationale: Die kollektive Wiedergabe entspricht der kosmischen Reichweite der Aussage und klingt im modernen Deutschen natürlich.
- source_word: መሰረታቲሃ፡ ለምድር
  choice: die Fundamente der Erde
  rationale: Die konkrete architektonische Ausdrucksweise der apokalyptischen Kosmographie wird bewahrt.
theological_decisions:
- issue: Ob ነፋሳት als „Winde“ oder „Geister“ wiederzugeben ist
  choice: Winde
  alternative: Geister; Atemzüge
  rationale: Die Vorratskammern und der unmittelbare kosmologische Zusammenhang sprechen für Naturkräfte. So wird keine nicht zwingend vorausgesetzte angelologische Deutung eingetragen.
- issue: Ob አሰርገወ das Schmücken oder das Ordnen und Festigen der Schöpfung bezeichnet
  choice: schmückte
  alternative: ordnete; gründete; machte schön
  rationale: Die Hauptübersetzung wahrt das lebendige Bild des äthiopischen Textes; die mögliche kosmische Ordnungsbedeutung wird in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener apokalyptisch-kosmischer Bildsprache. Die zweimalige Wendung „ich sah“ folgt der Struktur des Ausgangstextes; die sachlichen und theologischen Mehrdeutigkeiten werden nicht im Haupttext eingeebnet.
