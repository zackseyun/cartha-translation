base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/004.yaml
  text: And I saw the winds that turn the sky and cause the disk of the sun and all the stars to set[a][b].
translation:
  language: de
  text: Und ich sah die Winde, die den Himmel drehen und die Sonnenscheibe und alle Sterne untergehen lassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „die den Himmel wenden und den Kreis der Sonne und alle Sterne untergehen lassen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: Und ich sah
  rationale: Bewahrt die wiederkehrende visionäre Erzählformel in natürlichem, würdigem Deutsch.
- source_word: ነፋሳተ
  choice: die Winde
  rationale: Im kosmologischen Zusammenhang bezeichnet das Wort am ehesten konkrete Winde; „Geister“ würde eine Personifizierung einführen, die der Vers nicht ausdrücklich verlangt.
- source_word: እለ ይመይጥዋ ለሰማይ
  choice: die den Himmel drehen
  rationale: Gibt die Vorstellung kosmischer Bewegung wieder, ohne sie durch moderne astronomische Fachsprache zu präzisieren.
- source_word: ወእለ ያዐርቡ
  choice: und … untergehen lassen
  rationale: 'ያዐርቡ ist hier als Kausativ zu ዐረበ, „untergehen“, verstanden: Die Winde bewirken den Untergang der Himmelskörper.'
- source_word: ለክበበ ፀሐይ
  choice: die Sonnenscheibe
  rationale: ክበበ bezeichnet etwas Rundes beziehungsweise einen Kreis; „Sonnenscheibe“ bewahrt das sichtbare kosmische Bild.
- source_word: ወኵሎ ከዋክብተ
  choice: und alle Sterne
  rationale: Entspricht der kollektiven Aussage des ge'ezischen Ausdrucks in idiomatischem Deutsch.
theological_decisions:
- issue: Ob ነፋሳተ unpersönliche kosmische Winde oder persönliche Geister bezeichnet
  choice: kosmische Winde
  alternative: Geister oder Windgeister
  rationale: Der unmittelbare Zusammenhang schildert kosmische Kräfte, die Himmel und Gestirne bewegen. „Winde“ wahrt diese apokalyptische Bildwelt, ohne eine nicht ausdrücklich genannte persönliche oder engelhafte Wirksamkeit einzutragen.
- issue: Bedeutung von ያዐርቡ
  choice: untergehen lassen
  alternative: heranbringen
  rationale: Die Form gehört hier zum Kausativ von ዐረበ, „untergehen“, besonders von Sonne und Gestirnen. Damit sind die Winde als Kräfte beschrieben, die deren Untergang bewirken; die ältere Deutung „heranbringen“ beruht auf einer Verwechslung mit einem anderen Verbalstamm.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem visionärem Ton. Die knappe Satzstruktur und die kosmologische Bildsprache des Ge'ez werden bewahrt; „Sonnenscheibe“ ist anschaulicher und natürlicher als „Sonnenkreis“, während die Fußnote die formnähere Möglichkeit dokumentiert.
