base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/006.yaml
  text: And I went on toward the south[a], and I saw a place burning day and night[b], where there were seven mountains of precious stone—three toward the east and three toward the south.
translation:
  language: de
  text: 'Und ich zog weiter nach Süden. Da sah ich einen Ort, der Tag und Nacht brannte. Dort waren sieben Berge aus kostbarem Gestein[a]: drei nach Osten hin und drei nach Süden hin.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Kostbares Gestein“ kann auch mit „prächtigem Gestein“ oder „wertvollem Stein“ wiedergegeben werden; das ge’ezische Wort hebt den außergewöhnlichen Wert oder Glanz hervor.
    reason: lexical_alternative
  - marker: b
    text: 'Der überlieferte ge’ezische Text nennt sieben Berge, bestimmt danach aber nur sechs näher: drei nach Osten und drei nach Süden. Wo der siebte Berg liegt, wird in diesem Vers nicht gesagt.'
    reason: textual_variant
lexical_decisions:
- source_word: ሐለፍኩ
  choice: ich zog weiter
  rationale: Gibt die fortgesetzte Bewegung innerhalb der Visionsreise natürlich und zugleich erzählerisch würdevoll wieder.
- source_word: መንገለ አዜብ
  choice: nach Süden
  rationale: Bewahrt die Richtungsangabe; im modernen Deutsch ist „nach Süden“ idiomatischer als „gegen Süden hin“.
- source_word: ወርኢኩ መካነ
  choice: Da sah ich einen Ort
  rationale: Führt einen neuen Schauplatz der Vision ein, ohne eine im Ge’ez nicht eindeutig geforderte Bestimmtheit hinzuzufügen.
- source_word: ዘይነድድ
  choice: der … brannte
  rationale: Gibt den Relativsatz und das fortdauernde Brennen klar wieder, ohne das Bild auszuschmücken.
- source_word: መዐልተ ወሌሊተ
  choice: Tag und Nacht
  rationale: Die geläufige deutsche Wendung bewahrt den Sinn ununterbrochener Dauer.
- source_word: ኀበ ሰብዓቱ አድባር
  choice: Dort waren sieben Berge
  rationale: Versteht ኀበ lokal und stellt die Berge als Bestandteil des geschauten Ortes dar.
- source_word: ዘእምእብን ክቡር
  choice: aus kostbarem Gestein
  rationale: „Gestein“ passt im Deutschen zu ganzen Bergen besser als der Singular „Stein“; „kostbar“ bewahrt den Wert- und Prachtaspekt von ክቡር.
- source_word: ፫መንገለ ጽባሕ
  choice: drei nach Osten hin
  rationale: Im Zusammenhang der parallelen Richtungsangaben bezeichnet ጽባሕ den Osten; „hin“ erhält die Richtungsnuance.
- source_word: ወ፫መንገለ አዜብ
  choice: und drei nach Süden hin
  rationale: Bewahrt den Parallelismus und die überlieferte Angabe, obwohl damit nur sechs der sieben Berge örtlich bestimmt werden.
theological_decisions:
- issue: Kosmisch-geografische Bilder des brennenden Ortes und der Berge aus kostbarem Gestein
  choice: Die visionäre Landschaft wird im Haupttext konkret und ohne symbolische Deutung wiedergegeben.
  alternative: Den Ort verallgemeinernd als Feuerregion oder die Berge ausdrücklich als himmlische beziehungsweise symbolische Gebilde deuten.
  rationale: Der Vers schildert apokalyptische Topografie, bietet aber selbst keine Auslegung. Die Übersetzung soll diese Offenheit und Bildhaftigkeit erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Kurze Hauptsätze bewahren die fortschreitende Visionsschilderung; die apokalyptischen Bilder bleiben bewusst konkret und ungedeutet.
