base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/008.yaml
  text: And the middle one reached to heaven[a], like the throne of the Lord, which was of crystal stone[d][c][b], and the top of the throne was of sapphire stone.
translation:
  language: de
  text: Und der Mittlere ragte bis zum Himmel empor, wie der Thron des Herrn, der aus Kristallstein[a] war; und der obere Teil des Thrones[b] war aus Saphir.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die mit „Kristallstein“ wiedergegebene Steinbezeichnung ist lexikalisch unsicher; sie bezeichnet ein helles oder kostbares Material in dieser Thronvision.
    reason: lexical_alternative
  - marker: b
    text: Die Wendung „der obere Teil des Thrones“ ist schwierig; sie kann allgemeiner den oberen Teil oder Gipfel der mit dem Thron verbundenen Struktur bezeichnen.
    reason: alternative_reading
lexical_decisions:
- source_word: ማእከላይሰ
  choice: der mittlere
  rationale: Die Form bezeichnet das mittlere beziehungsweise zentrale Element der zuvor beschriebenen visionären Struktur. Das substantivierte Adjektiv wahrt den knappen Bezug, ohne den nicht ausdrücklich genannten Gegenstand zu ergänzen.
- source_word: ይጐድእ እስከ ሰማይ
  choice: ragte bis zum Himmel empor
  rationale: Die Wendung beschreibt eine aufwärts gerichtete Ausdehnung bis zum Himmel. „Ragte … empor“ gibt die vertikale Bildhaftigkeit im Deutschen natürlich wieder.
- source_word: ከመ መንበረ ለእግዚአብሔር
  choice: wie der Thron des Herrn
  rationale: ከመ kennzeichnet einen Vergleich, keine Gleichsetzung. Die Formulierung bewahrt das visionäre Gleichnis und den ehrerbietigen Gottestitel.
- source_word: ዘእምእብነ ፑክ
  choice: der aus Kristallgestein war
  rationale: Der Relativsatz bezieht sich syntaktisch auf den Thron. Die genaue Bezeichnung des hellen oder kostbaren Materials ist unsicher; „Kristallgestein“ erhält die Stein- und Glanzvorstellung.
- source_word: ወይማሑ ለመንበሩ
  choice: und die Oberseite des Thrones
  rationale: Die schwierige Wendung bezeichnet wahrscheinlich den oberen Teil oder Gipfelbereich des Thrones. „Oberseite“ bietet ein verständliches architektonisches Bild, ohne ein Fundament in den Text einzutragen.
- source_word: እምእብነ ሰንፔር
  choice: aus Saphirgestein
  rationale: Der Edelsteinname wird herkömmlich als Saphir verstanden. Die Zusammensetzung wahrt zugleich die ausdrückliche Materialangabe „Stein“.
theological_decisions:
- issue: Wiedergabe von እግዚአብሔር
  choice: der Herr
  alternative: Gott; der Herr, Gott
  rationale: „Der Herr“ entspricht dem ehrerbietigen Gottestitel, ohne ein weiteres, im Ausgangstext nicht vorhandenes Wort hinzuzufügen.
- issue: Verhältnis der visionären Struktur zum göttlichen Thron
  choice: wie der Thron des Herrn
  alternative: als Thron des Herrn
  rationale: Der Ausgangstext formuliert einen Vergleich. Die Übersetzung vermeidet daher, die geschilderte Struktur mit dem Thron des Herrn gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe visionäre Bildsprache und die syntaktische Zuordnung des Kristallgesteins zum Thron bleiben erhalten; die genuine Unsicherheit bei Materialbezeichnung und oberem Teil wird in Fußnoten ausgewiesen.
