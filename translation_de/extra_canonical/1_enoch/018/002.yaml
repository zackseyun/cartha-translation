base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/002.yaml
  text: And I saw the cornerstones of the earth[c][b][a], and I saw the four winds that bear up the earth and the firmament of heaven.
translation:
  language: de
  text: Und ich sah die Ecksteine der Erde[a], und ich sah die vier Winde[b], die die Erde und das Himmelsgewölbe[c] tragen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Steine an den Ecken der Erde“. Die ge’ezische Wendung ist architektonisch und kann in der Bildwelt der Vision die grundlegenden äußersten Punkte der Erde bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das hier mit „Winde“ wiedergegebene Wort kann je nach Zusammenhang auch „Geister“ oder „Atemzüge“ bedeuten; in dieser kosmologischen Szene liegt „Winde“ näher.
    reason: lexical_alternative
  - marker: c
    text: „Himmelsgewölbe“ bewahrt die antike kosmische Vorstellung einer gegliederten oder festen Himmelsausdehnung.
    reason: cultural_note
lexical_decisions:
- source_word: እብነ ማእዘንተ ምድር
  choice: die Ecksteine der Erde
  rationale: Die Verbindung aus „Steine“ und „Ecken/Winkel“ ist architektonisch geprägt. „Ecksteine der Erde“ bewahrt das konkrete kosmische Bild und klingt im Deutschen natürlicher als eine rein formale Wiedergabe.
- source_word: ምድር
  choice: Erde
  rationale: Der Zusammenhang beschreibt die Welt als Ganzes, nicht ein örtlich begrenztes Land.
- source_word: አርባዕተ ነፋሳተ
  choice: die vier Winde
  rationale: Das Substantiv kann je nach Kontext auch Atem oder Geist bezeichnen; die Vierzahl und die kosmologische Szene sprechen hier am stärksten für „Winde“.
- source_word: ይጸውርዋ
  choice: tragen
  rationale: Das Verb bezeichnet Tragen oder Stützen. „Tragen“ erhält das anschauliche Bild kosmischer Lastenträger.
- source_word: ወጽንዐ ሰማይ
  choice: und das Himmelsgewölbe
  rationale: Die Wiedergabe bewahrt die antike Vorstellung einer strukturierten, festen Himmelsausdehnung, ohne sie in moderne kosmologische Begriffe umzudeuten.
theological_decisions:
- issue: Antike kosmologische Darstellung der Weltordnung
  choice: Die konkrete Bildwelt von Ecksteinen, tragenden Winden und Himmelsgewölbe bleibt erhalten.
  alternative: Die Bilder als „Enden der Erde“ und „Kräfte, die die Welt erhalten“ verallgemeinern.
  rationale: Die Vision schildert kosmische Architektur. Eine abstrahierende oder entmythologisierende Wiedergabe würde den Aussagecharakter des Textes unnötig glätten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt bewusst schlicht und wiederholend, entsprechend dem visionären Bericht. Die konkreten kosmologischen Bilder werden nicht modernisiert oder dogmatisch ausgelegt.
