base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/003.yaml
  text: And I saw how the winds support the heights of heaven[a], and they stand between heaven and earth; these are the pillars of heaven.
translation:
  language: de
  text: Und ich sah, wie die Winde die Höhen des Himmels tragen[a]. Sie stehen zwischen Himmel und Erde; sie sind die Säulen des Himmels.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das zugrunde liegende Verb ist schwer zu bestimmen. Es kann außer „tragen“ möglicherweise auch „ausspannen“, „erstrecken“ oder eine ähnliche Einwirkung auf die Höhen des Himmels bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ነፋሳት
  choice: die Winde
  rationale: Im Zusammenhang der kosmischen Schau bezeichnet der Plural am ehesten die Winde als Kräfte der Schöpfung; „Geister“ wäre möglich, würde hier aber eine nicht notwendige personale Deutung einführen.
- source_word: ይረብብዋ
  choice: tragen
  rationale: Das schwierige Verb beschreibt eine Einwirkung auf die Höhen des Himmels. „Tragen“ passt zur anschließenden Identifizierung als Säulen, ohne die unsichere Bedeutung übermäßig festzulegen.
- source_word: አዕልና፡ ሰማይ
  choice: die Höhen des Himmels
  rationale: Die Formulierung wird von den am Versende ausdrücklich genannten „Säulen des Himmels“ unterschieden. Daher ist hier „Höhen“ statt einer vorweggenommenen Wiederholung von „Säulen“ vorzuziehen.
- source_word: ይቀውሙ
  choice: sie stehen
  rationale: Die schlichte Wiedergabe bewahrt das räumliche Bild und den Übergang zur Identifizierung der Winde als Säulen.
- source_word: ማእከለ፡ ሰማይ፡ ወምድር
  choice: zwischen Himmel und Erde
  rationale: Dies ist die natürliche deutsche Wiedergabe des wörtlichen Bildes „inmitten von Himmel und Erde“.
- source_word: እሙንቱ፡ ውእቶሙ፡ አዕማደ፡ ሰማይ
  choice: sie sind die Säulen des Himmels
  rationale: Die emphatische Identifizierung wird im Deutschen klar wiedergegeben; das Pronomen verweist am natürlichsten auf die zuvor genannten Winde.
theological_decisions:
- issue: Deutung von ነፋሳት als Winde oder Geister
  choice: Winde
  alternative: Geister
  rationale: Die kosmographische Umgebung und die strukturelle Bildsprache des Verses sprechen für unpersönliche kosmische Winde. So wird keine angelologische Bestimmung eingetragen, die der Text nicht ausdrücklich fordert.
- issue: Bezugswort des wiederholten Pronomens im zweiten Satz
  choice: Die Winde stehen zwischen Himmel und Erde und werden als Säulen identifiziert.
  alternative: Die Höhen beziehungsweise nicht näher bestimmte Stützen stehen zwischen Himmel und Erde.
  rationale: Grammatisch und im fortlaufenden Bild ist der Rückbezug auf die pluralischen „Winde“ am nächsten; zugleich bleibt die eigentümliche kosmische Gleichsetzung des Textes erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, visionärem Klang. Die kurzen Hauptsätze bewahren die eindringliche Struktur des ge'ezischen Textes; die ungewöhnliche kosmische Bildsprache wird nicht geglättet.
