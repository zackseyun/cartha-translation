lexical_decisions:
- source_word: እሳተ
  choice: ein Feuer
  rationale: Der unbestimmte Singular bewahrt das konkrete Bild der Vision, ohne Ursprung oder Zweck des Feuers näher festzulegen.
- source_word: ዘይነድድ
  choice: brennendes
  rationale: Die Relativform beschreibt das Feuer als gegenwärtig brennend; das deutsche Partizip gibt dies natürlich und knapp wieder.
- source_word: ርኢኩ
  choice: ich sah
  rationale: Die schlichte Wiedergabe erhält die wiederkehrende Ich-Form des visionären Augenzeugenberichts.
- source_word: ወዘሀሎ
  choice: das sich … befand
  rationale: Die schwierige Formulierung wird als zweite, auf das Feuer bezogene Relativbestimmung verstanden. Diese syntaktische Zuordnung entspricht am ehesten dem Satzbau, ohne die textliche Unsicherheit zu verschweigen.
- source_word: ውስተ፡ ኵሉ፡ አድባር
  choice: im Innern aller Berge
  rationale: ውስተ bezeichnet eine Lage im Inneren; die kollektive Wendung mit ኵሉ und dem Plural wird als „aller Berge“ wiedergegeben und bewahrt die kosmische Raumvorstellung.
theological_decisions:
- issue: Art des Feuerbildes in den Bergen
  choice: Das Feuer bleibt ein konkretes apokalyptisches Visionsbild im Innern der Berge.
  alternative: Das Bild als allgemeines Gerichtssymbol oder als natürliches unterirdisches Feuer auslegen.
  rationale: Der Vers berichtet visionäre Topografie, erklärt aber weder Bedeutung noch natürliche Ursache des Feuers. Die Übersetzung vermeidet daher eine allegorische oder naturalistische Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die einfache Sehformel und das konkrete apokalyptische Bild bleiben erhalten; die schwer verständliche Syntax wird im Haupttext lesbar wiedergegeben und in den Fußnoten transparent offengehalten.
