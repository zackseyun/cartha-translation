translation:
  language: de
  text: Und ich sah ein brennendes Feuer, das sich im Innern aller Berge befand.[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wortstellung der auf das Feuer bezogenen Wendung „das sich … befand“ ist in diesem äthiopischen Textzeugen ungewöhnlich. Sie wird hier als zweite Relativbestimmung zu „Feuer“ verstanden.
    reason: textual_variant
  - marker: b
