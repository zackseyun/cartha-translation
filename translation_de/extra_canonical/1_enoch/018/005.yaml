base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/005.yaml
  text: I saw the winds upon the earth[a], which bear the clouds; I saw the paths of the angels[d][c][b]; I saw at the end of the earth the firm support of the heaven above.
translation:
  language: de
  text: Ich sah die Winde auf der Erde, die die Wolken tragen[a]; ich sah die Pfade der Engel; ich sah am Ende der Erde die feste Stütze des Himmels in der Höhe[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Satzfügung am Anfang ist schwierig. Die Präposition kann je nach Zusammenhang „auf“ oder „über“ bedeuten; ein griechischer Zeuge stützt die Auffassung: „die Winde auf der Erde, die die Wolken tragen“.'
    reason: textual_variant
  - marker: b
    text: 'Oder: „das Fundament des Himmels in der Höhe“. Das Ge’ez-Wort kann Festigkeit, tragende Stärke oder Grundlage bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ
  choice: ich sah
  rationale: Gibt die dreimal wiederholte visionäre Berichtsformel schlicht wieder und bewahrt durch den Verzicht auf zusätzliche Bindewörter den knappen Rhythmus des Ge’ez.
- source_word: ነፋሳተ
  choice: die Winde
  rationale: Im kosmologischen Zusammenhang und angesichts des Tragens der Wolken ist die physische Bedeutung wahrscheinlicher als „Geister“.
- source_word: ዘዲበ ምድር
  choice: über der Erde
  rationale: Die Präpositionalgruppe bestimmt die Winde näher. „Über“ bewahrt die räumliche Vorstellung; möglich ist im Deutschen auch „auf der Erde“.
- source_word: ዘይጸውር በደመናት
  choice: die die Wolken tragen
  rationale: Das Verb bezeichnet Tragen oder Stützen. Die Wolken sind hier das Getragene; diese Syntax wird auch durch den griechischen Zeugen gestützt.
- source_word: ፍናወ መላእክት
  choice: die Pfade der Engel
  rationale: „Pfade“ erhält das konkrete räumliche Bild von Wegen oder Bahnen; „Engel“ bezeichnet im apokalyptischen Kontext eindeutig himmlische Boten.
- source_word: ውስተ ጽንፈ ምድር
  choice: am Ende der Erde
  rationale: Die Wendung bezeichnet die äußerste Grenze der Welt und bewahrt die kosmische Horizontvorstellung.
- source_word: ጽንዐ
  choice: die feste Stütze
  rationale: Das Substantiv kann Festigkeit, tragende Stärke oder Grundlage bezeichnen. „Feste Stütze“ hält die kosmische Tragvorstellung offen, ohne ausschließlich ein Fundament zu behaupten.
- source_word: ዘሰማይ መልዕልተ
  choice: des Himmels in der Höhe
  rationale: Die Formulierung macht die vertikale kosmologische Ausrichtung deutlich und klingt im modernen Deutschen natürlich und würdig.
theological_decisions:
- issue: Ob ነፋሳተ als „Winde“ oder „Geister“ wiederzugeben ist
  choice: Winde
  alternative: Geister
  rationale: 'Der Vers nennt kosmische Erscheinungen und Strukturen: Winde, Wolken, Engelspfade und die Stütze des Himmels. „Winde“ entspricht diesem unmittelbaren Zusammenhang, ohne eine geistwesenbezogene Deutung einzutragen.'
- issue: Ob ጽንዐ eine architektonische Grundlage oder allgemeiner tragende Festigkeit bezeichnet
  choice: feste Stütze
  alternative: Fundament
  rationale: Die gewählte Formulierung bewahrt das Bild einer tragenden Himmelsstruktur, legt sich aber nicht enger fest, als es das Ge’ez verlangt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem visionärem Ton. Die dreifache Wiederholung „ich sah“ und das Asyndeton des Ge’ez bleiben erhalten; archaisierende Formen und zusätzliche Konjunktionen werden vermieden.
