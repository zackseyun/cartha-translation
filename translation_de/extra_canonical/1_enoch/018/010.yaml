lexical_decisions:
- source_word: ወርኢኩ
  choice: Und … sah ich
  rationale: Bewahrt die geläufige erzählerische Schauformel des visionären Berichts.
- source_word: ህየ
  choice: dort
  rationale: Das zweimalige deiktische Adverb wird an beiden Stellen wiedergegeben und erhält die räumliche Struktur.
- source_word: መካነ
  choice: einen Ort
  rationale: Die anarthrische Form führt hier am natürlichsten einen neuen Ort in der visionären Schau ein.
- source_word: ማዕዶተ
  choice: jenseits
  rationale: Gibt die wahrscheinlichste Bedeutung »auf der anderen Seite von/jenseits« knapp und räumlich wieder; die abweichende ältere Deutung wird in einer Fußnote bewahrt.
- source_word: ዐቢይ ምድር
  choice: der großen Erde
  rationale: Eine weitgehend formale Wiedergabe wahrt die kosmische Bildsprache; »Erde« passt hier besser als »Land«.
- source_word: ይትጋብኡ
  choice: versammeln sie sich
  rationale: Gibt den reflexiv-kollektiven Sinn natürlich wieder, ohne einen im Text nicht ausdrücklich genannten Handelnden für ein Passiv einzuführen.
theological_decisions:
- issue: Kosmische Geografie der Ortsangabe
  choice: jenseits der großen Erde
  alternative: an den Enden oder Grenzen der großen Erde
  rationale: Die wahrscheinlichste lexikalische Deutung bezeichnet die andere Seite beziehungsweise das Jenseits eines Bereichs. Die konkrete apokalyptische Geografie bleibt dabei erhalten und wird nicht rationalisierend verflacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper visionärer Satzstruktur. Das wiederholte »dort« und die kosmische Bezeichnung »große Erde« wurden bewusst beibehalten.
