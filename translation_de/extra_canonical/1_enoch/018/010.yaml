  text: And there I saw a place beyond the great earth[b][a]; there they gather together.
translation:
  language: de
  text: Und dort sah ich einen Ort jenseits der großen Erde[a][b]; dort versammeln sie sich.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Lesart des betreffenden ge’ezischen Ausdrucks ist in der überlieferten Textgestalt schwierig.
