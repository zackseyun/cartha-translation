base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/018/007.yaml
  text: And those toward the east were of colored stone, and one was of pearl stone, and one of healing stone; and those toward the south were of red stone.
translation:
  language: de
  text: Und die auf der Ostseite waren aus farbigem Stein; einer war aus Perlstein und einer aus Heilstein. Die auf der Südseite aber waren aus rotem Stein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ዘመንገለ፡ ጽባሕ
  choice: die auf der Ostseite
  rationale: Gibt die räumliche Wendung natürlich wieder; ጽባሕ bezeichnet hier den Osten.
- source_word: እብነ፡ ሕብር
  choice: farbigem Stein
  rationale: Bewahrt die allgemeine Farbbezeichnung des geezischen Ausdrucks, ohne eine bestimmte Farbe einzutragen.
- source_word: እብነ፡ ባሕርይ
  choice: Perlstein
  rationale: Folgt der überlieferten Deutung als Perle beziehungsweise perlenartiger Stein und erhält zugleich die parallele Stein-Terminologie.
- source_word: እብነ፡ ፈውስ
  choice: Heilstein
  rationale: ፈውስ bedeutet Heilung oder Heilmittel; die wörtlich-nahe Wiedergabe bewahrt die ungewöhnliche Bezeichnung, statt sie zu 'Edelstein' zu glätten.
- source_word: ዘመንገለ፡ አዜብ
  choice: die auf der Südseite
  rationale: አዜብ bezeichnet in diesem Kontext den Süden.
- source_word: እብነ፡ ቀይሕ
  choice: rotem Stein
  rationale: Direkte Wiedergabe der Farbangabe ቀይሕ, 'rot'.
