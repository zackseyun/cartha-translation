base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/002.yaml
  text: And when righteousness appears on the faces of the righteous[a], the chosen, whose deeds hang upon the Lord of Spirits, and light will appear to the righteous and to the chosen who dwell on the dry ground, where then is the dwelling of sinners[d][c][b], and where the resting place of those who denied the Lord of Spirits? It would have been better for them had they not been born.
translation:
  language: de
  text: 'Und wenn die Gerechtigkeit auf den Gesichtern der Gerechten – der Erwählten, deren Taten am Herrn der Geister hängen[a] – erscheinen wird und den Gerechten und Erwählten, die auf dem trockenen Land wohnen[b], Licht erscheinen wird: Wo ist dann die Wohnstätte der Sünder und wo der Ruheort derer, die den Herrn der Geister verleugnet haben? Es wäre besser für sie gewesen, wenn sie nicht geboren worden wären.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „deren Taten am Herrn der Geister hängen“ ist schwierig. Sie kann bedeuten, dass ihre Taten von ihm abhängen oder vor ihm aufrechterhalten werden.
    reason: lexical_alternative
  - marker: b
    text: „Trockenes Land“ ist eine wörtliche Wiedergabe und bezeichnet wahrscheinlich das bewohnte Land im Gegensatz zu den kosmischen Wassern.
    reason: cultural_note
lexical_decisions:
- source_word: ያስተርኢ
  choice: erscheint
  rationale: Das ast-Stamm-Verb bezeichnet hier am besten ein Sichtbarwerden. Da ብርሃን grammatisch als Subjekt steht, wird auch beim zweiten Vorkommen intransitiv mit „Licht erscheint“ übersetzt.
- source_word: ጽድቅ
  choice: Gerechtigkeit
  rationale: Bewahrt den zentralen henochischen Begriff für sittliche Gerechtigkeit und endzeitliche Rechtfertigung, ohne ihn auf soziale Gerechtigkeit zu verengen.
- source_word: በገጾሙ
  choice: auf den Gesichtern
  rationale: Erhält das konkrete visionäre Bild einer sichtbar werdenden Gerechtigkeit.
- source_word: ጻድቃን
  choice: die Gerechten
  rationale: Geläufige und sachlich genaue deutsche Wiedergabe der bezeichneten Gruppe.
- source_word: ኅሩያን
  choice: die Erwählten
  rationale: „Erwählte“ ist im Deutschen eine natürliche Gruppenbezeichnung und bewahrt den apokalyptischen Sinn.
- source_word: ተግባሮሙ ስቁል በእግዚአ መናፍስት
  choice: deren Taten am Herrn der Geister hängen
  rationale: Die ungewöhnliche konkrete Metapher wird erhalten, statt sie vorschnell als Abhängigkeit, Bewahrung oder Beurteilung auszulegen.
- source_word: ብርሃን
  choice: Licht
  rationale: Entspricht der Grundbedeutung und bewahrt die visionäre sowie theologische Bildsprache.
- source_word: የኃድሩ ዲበ የብስ
  choice: die auf dem trockenen Land wohnen
  rationale: Gibt die konkrete kosmologische Unterscheidung von trockenem Land und Wasser wieder; „Erde“ wäre allgemeiner.
- source_word: መኃደሪ
  choice: Wohnstätte
  rationale: Bewahrt die örtliche Bedeutung und passt zur Frage nach dem Verbleib der Sünder.
- source_word: ምዕራፎሙ
  choice: Ruheort
  rationale: Erhält sowohl den Gedanken der Ruhe als auch den lokativen Sinn und bildet eine natürliche Parallele zu „Wohnstätte“.
- source_word: ክሕድዎ
  choice: verleugnet haben
  rationale: Gibt die persönliche und religiös-juridische Zurückweisung des Herrn der Geister präzise wieder.
- source_word: እምኃየሶሙ ሶበ ኢተወልዱ
  choice: Es wäre besser für sie gewesen, wenn sie nicht geboren worden wären
  rationale: Natürliche deutsche Wiedergabe der scharfen irrealen Gerichtsformel.
theological_decisions:
- issue: Bedeutung der schwierigen Aussage über die Taten der Erwählten
  choice: „deren Taten am Herrn der Geister hängen“
  alternative: „deren Taten vom Herrn der Geister abhängen“ oder „vor dem Herrn der Geister aufrechterhalten werden“
  rationale: Der äthiopische Wortlaut ist ungewöhnlich und textgeschichtlich nur begrenzt kontrollierbar. Die Hauptfassung bewahrt daher die Metapher und legt ihre theologische Beziehung nicht eindeutig fest.
- issue: Bezug des Ausdrucks für trockenes Land
  choice: „auf dem trockenen Land“
  alternative: „auf der Erde“ oder „auf dem Land“
  rationale: Die wörtlichere Fassung erhält die kosmologische Textur der apokalyptischen Vision, obwohl wahrscheinlich die bewohnte Welt gemeint ist.
- issue: Syntax des zweiten Vorkommens von ያስተርኢ
  choice: „Licht erscheint“
  alternative: „er zeigt Licht“
  rationale: Die grammatische Form von „Licht“ weist es als Subjekt aus, und das Verb bedeutet im ast-Stamm hier „erscheinen/sichtbar werden“. Dadurch wird keine handelnde Person ergänzt, die der Ausgangstext nicht ausdrücklich nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange eschatologische Satzbewegung bleibt erhalten, wird aber durch Gedankenstriche gegliedert. Konkrete apokalyptische Bilder und die Mehrdeutigkeit der schwierigen Wendung über die Taten werden nicht geglättet.
