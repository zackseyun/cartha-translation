base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/003.yaml
  text: When the hidden things of the righteous are revealed, sinners will be judged, and the wicked will be driven away from the face of the righteous and the chosen.
translation:
  language: de
  text: Wenn das Verborgene der Gerechten offenbar wird[a], werden die Sünder gerichtet, und die Frevler werden aus der Gegenwart der Gerechten und der Erwählten vertrieben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »ihre Geheimnisse«. Der geezische Ausdruck bezeichnet Verborgenes, legt aber nicht fest, ob Taten, Identität oder der Grund ihrer Rechtfertigung gemeint sind.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »vom Angesicht der Gerechten und der Erwählten«. Gemeint ist der Ausschluss aus ihrer Gegenwart in der Gerichtsszene.'
    reason: cultural_note
lexical_decisions:
- source_word: ሶበ
  choice: Wenn
  rationale: Die Konjunktion leitet einen temporalen Nebensatz ein und bewahrt die wiederholte apokalyptische Wenn-Struktur des Zusammenhangs.
- source_word: ይትከሠት
  choice: offenbar wird
  rationale: Die passive Bedeutung bezeichnet das Sichtbarwerden dessen, was zuvor verborgen war; die Formulierung ist natürlich und würdevoll.
- source_word: ኅቡኣቲሆሙ ለጻድቃን
  choice: das Verborgene der Gerechten
  rationale: Das substantivierte Neutrum wahrt die Unbestimmtheit des geezischen Plurals, ohne ihn auf Geheimnisse, Taten oder Personen festzulegen.
- source_word: ይትኴነኑ
  choice: werden gerichtet
  rationale: Die gerichtliche Passivform wird wiedergegeben, ohne das stärkere Ergebnis „verurteilt“ vorwegzunehmen.
- source_word: ኃጥኣን
  choice: die Sünder
  rationale: Direkte und im Gerichtskontext geläufige Bezeichnung der moralischen Gruppe.
- source_word: ይትሀወዙ
  choice: werden … vertrieben
  rationale: Die Formulierung vermittelt eine gewaltsame Entfernung und bewahrt damit die räumliche Gerichtsszene.
- source_word: ረስዓን
  choice: die Frevler
  rationale: „Frevler“ bildet einen klaren, würdevollen Gegenbegriff zu den Gerechten und unterscheidet den Ausdruck sprachlich von „Sünder“.
- source_word: እምገጸ
  choice: aus der Gegenwart
  rationale: Die Wendung gibt den idiomatischen Sinn „vom Angesicht/vor der Gegenwart weg“ in natürlichem Deutsch wieder; die wörtliche Bildform wird in der Fußnote bewahrt.
- source_word: ወኅሩያን
  choice: und der Erwählten
  rationale: „Erwählte“ ist die etablierte, verständliche Wiedergabe für die von Gott Ausgewählten.
theological_decisions:
- issue: Bedeutung des Verborgenen der Gerechten
  choice: das Verborgene der Gerechten
  alternative: ihre Geheimnisse; die Verborgenen unter den Gerechten
  rationale: Der Ausgangstext bestimmt nicht, ob Taten, Geheimnisse, Identität oder der Grund ihrer Rechtfertigung enthüllt werden. Die breite Formulierung erhält diese Spannung.
- issue: Reichweite des Gerichtsverbs
  choice: werden gerichtet
  alternative: werden verurteilt
  rationale: Das Urteilsgeschehen ist eindeutig, sein Ergebnis soll jedoch nicht durch ein stärkeres deutsches Verb zusätzlich festgelegt werden.
- issue: Bild der abschließenden Ausstoßung
  choice: aus der Gegenwart der Gerechten und der Erwählten vertrieben
  alternative: vom Angesicht der Gerechten und der Erwählten vertrieben
  rationale: Die Übersetzung bewahrt die Ausstoßung aus der Gegenwart der gerechtfertigten Gemeinschaft; die Fußnote dokumentiert das konkrete Bild des Ausgangstextes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der temporale Wenn-Satz, die gerichtliche Passivform und die inhaltliche Offenheit von „das Verborgene“ bleiben erhalten. „Aus der Gegenwart“ vermeidet im Haupttext die im Deutschen missverständliche Wendung „vom Angesicht“, während die Fußnote das Quellbild dokumentiert.
