base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/001.yaml
  text: The first parable[a]. When the assembly of the righteous appears, and sinners are judged for their sins, and are driven away from the face of the earth[b],
translation:
  language: de
  text: Das erste Gleichnis. Wenn die Versammlung der Gerechten erscheint und Sünder wegen ihrer Sünden gerichtet und vom Angesicht der Erde vertrieben werden,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „vom Angesicht des trockenen Bodens“ oder „vom Angesicht des Landes“. Der Satz wird in Vers 2 fortgeführt.'
    reason: Die Fußnote bewahrt sowohl die konkrete Bedeutung von የብስ als auch die syntaktische Unabgeschlossenheit des mit „Wenn“ eröffneten Satzes.
lexical_decisions:
- source_word: ምሳሌ፡ ቀዳማ፲
  choice: Das erste Gleichnis
  rationale: Die Wendung bezeichnet die erste visionäre Rede dieses Buchteils; „Gleichnis“ ist im Deutschen verständlich und traditionsgemäß. Als Gliederungsüberschrift steht sie in einem eigenen Satz.
- source_word: ሶበ
  choice: Wenn
  rationale: Die temporale Konjunktion eröffnet einen noch nicht abgeschlossenen Bedingungs- bzw. Zeitsatz, der in Vers 2 fortgeführt wird.
- source_word: ያስተርኢ
  choice: erscheint
  rationale: Das Verb bezeichnet hier das Sichtbarwerden bzw. Erscheinen und sollte nicht stärker als „offenbart wird“ gedeutet werden.
- source_word: ማኅበረ፡ ጻድቃን
  choice: die Versammlung der Gerechten
  rationale: „Versammlung“ bewahrt den kollektiven Sinn und klingt zugleich natürlich und würdig.
- source_word: ወይትኴነኑ፡ ኃጥኣን
  choice: und Sünder ... gerichtet werden
  rationale: Der bloße Plural wird ohne bestimmten Artikel wiedergegeben. „Gerichtet“ hält den gerichtlichen Vorgang fest, ohne das Verb vorschnell als „verurteilt“ zu präzisieren.
- source_word: በኃጢአቶሙ
  choice: wegen ihrer Sünden
  rationale: Die Präposition bezeichnet hier am natürlichsten den Grund des Gerichts.
- source_word: ወእምገጸ፡ የብስ
  choice: vom Angesicht der Erde
  rationale: Die wörtlichere Bildsprache „vom Angesicht des trockenen Bodens/Landes“ wird idiomatisch als „vom Angesicht der Erde“ wiedergegeben; die konkrete Alternative bleibt in der Fußnote sichtbar.
- source_word: ይትሀወዙ
  choice: vertrieben werden
  rationale: Das Passiv und der strafende Charakter der Entfernung werden so knapp und deutlich bewahrt.
theological_decisions:
- issue: Gericht oder ausdrückliche Verurteilung der Sünder
  choice: gerichtet
  alternative: verurteilt
  rationale: Das Verb bezeichnet den gerichtlichen Vorgang; obwohl die anschließende Vertreibung ein negatives Ergebnis zeigt, soll dieses nicht rückwirkend in das Verb hineingelesen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Vers bleibt als Protasis syntaktisch offen und endet deshalb mit einem Komma; die Überschrift ist durch einen Punkt abgesetzt. Der Fußnotenmarker steht unmittelbar vor dem abschließenden Satzzeichen.
