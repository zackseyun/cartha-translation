base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/038/004.yaml
  text: And from now on the mighty and exalted who possess the earth shall not be so[a], nor shall they be able to look on the face of the holy ones, because the Lord of Spirits has caused his light to appear on the face of the holy, the righteous[d][c][b], and the chosen.
translation:
  language: de
  text: Und von nun an werden die, die die Erde in Besitz halten[a], nicht mehr mächtig und erhaben sein. Auch werden sie das Angesicht der Heiligen nicht sehen können[b], denn der Herr der Geister hat sein Licht auf dem Angesicht der Heiligen, Gerechten und Erwählten erscheinen lassen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »die die Erde festhalten«. Das ge''ezische Verb kann Ergreifen, Halten oder beherrschende Verfügung bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: »Das Angesicht sehen« bezeichnet hier eine unmittelbare Begegnung oder gewährten Zugang. Die bildhafte Wendung ist bewusst beibehalten.
    reason: cultural_note
  - marker: c
    text: Der Satz kann das Licht des Herrn als sichtbar auf dem Angesicht der Heiligen, Gerechten und Erwählten darstellen und so ihre Rechtfertigung anzeigen. »Angesicht« steht im Ausgangstext in einer kollektiv wirkenden Einzahl.
    reason: alternative_reading
lexical_decisions:
- source_word: ዐዚዛነ፡ ወእልዑላነ
  choice: mächtig und erhaben
  rationale: 'Die beiden Wörter bezeichnen Macht beziehungsweise hohen Rang. Aufgrund ihrer Form nach dem Verb »sein« werden sie hier prädikativ verstanden: Diejenigen, die über die Erde verfügen, verlieren ihren mächtigen und erhabenen Status.'
- source_word: እለ፡ ይእኅዝዋ፡ ለምድር
  choice: die, die die Erde in Besitz halten
  rationale: Das Verb bezeichnet ein Ergreifen oder Festhalten und kann dauerhafte Verfügung ausdrücken. »In Besitz halten« bewahrt sowohl die konkrete Vorstellung des Festhaltens als auch den Sinn beherrschender Kontrolle, ohne ein gewaltsames Aneignen festzuschreiben.
- source_word: ገጸ፡ ቅዱሳን
  choice: das Angesicht der Heiligen
  rationale: Die konkrete, semitisch geprägte Wendung wird bewahrt. »Angesicht« passt zum würdevollen apokalyptischen Register und lässt die Bedeutung unmittelbarer Begegnung beziehungsweise gewährten Zugangs anklingen.
- source_word: እግዚአ፡ መናፍስት
  choice: der Herr der Geister
  rationale: Die feste henochische Gottesbezeichnung wird ohne erklärende Erweiterung wiedergegeben.
- source_word: አርአየ፡ ብርሃኖ
  choice: hat sein Licht … erscheinen lassen
  rationale: Die kausative Aussage und das Bild einer sichtbaren Manifestation bleiben erhalten; eine rein gedankliche Wiedergabe wie »offenbart« wäre weniger konkret.
- source_word: በገጸ፡ ቅዱሳን፡ ጻድቃን፡ ወኅሩያን
  choice: auf dem Angesicht der Heiligen, Gerechten und Erwählten
  rationale: Die lokale Bedeutung »auf« und das konkrete Bild des Angesichts werden beibehalten. Die drei Bezeichnungen bleiben unterscheidbar, ohne zu entscheiden, ob sie drei Gruppen oder drei Kennzeichnungen derselben Gemeinschaft meinen.
theological_decisions:
- issue: Satzfunktion der Mächtigen und Erhabenen
  choice: Diejenigen, die die Erde in Besitz halten, werden nicht mehr mächtig und erhaben sein.
  alternative: Die Mächtigen und Erhabenen, die die Erde besitzen, werden nicht mehr sein.
  rationale: Die Formen von »mächtig« und »erhaben« lassen sich nach dem ge'ezischen Verb »sein« als Prädikatsnomen verstehen. So beschreibt der Satz einen Verlust von Macht und Rang, nicht zwingend die Vernichtung der betreffenden Menschen.
- issue: Bedeutung des Lichtes auf dem Angesicht
  choice: Das Licht des Herrn erscheint auf dem Angesicht der Heiligen, Gerechten und Erwählten.
  alternative: Das Licht erscheint vor ihnen oder strahlt von ihren Gesichtern wider.
  rationale: Die Übersetzung folgt der konkreten lokalen Formulierung, ohne näher zu bestimmen, wie das Verhältnis zwischen Gottes Licht und dem Angesicht der Erwählten zu verstehen ist. Dadurch bleibt das Bild ihrer sichtbaren Rechtfertigung offen.
- issue: Bezug der drei Gruppenbezeichnungen
  choice: »Heilige, Gerechte und Erwählte« bleibt als dreigliedrige Formulierung stehen.
  alternative: Alle drei Wörter werden ausdrücklich als Bezeichnungen einer einzigen Gruppe zusammengezogen.
  rationale: Der Text erlaubt, die Ausdrücke als drei Kennzeichnungen derselben Gemeinschaft oder als rhetorisch unterschiedene Gruppen zu hören; die Übersetzung legt sich nicht unnötig fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter apokalyptischer Bildsprache. »Angesicht« ist gehobener als »Gesicht«, bleibt aber allgemein verständlich und erhält die wiederholte Bildverknüpfung des Verses. Die doppelte Form »die, die« ist grammatisch klar; sie macht die relative Gruppe zum Satzgegenstand und stützt damit die ge'ezische Prädikatskonstruktion.
