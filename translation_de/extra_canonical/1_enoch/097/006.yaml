base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/006.yaml
  text: And all the words of your lawlessness shall be read out before the Great Holy One[a], and your faces shall be put to shame[c][b], and every deed that is founded in lawlessness shall be rejected.
translation:
  language: de
  text: Und alle Worte eurer Gesetzlosigkeit werden vor dem Großen Heiligen[a] verlesen, und eure Gesichter werden beschämt, und jede Tat, die in Gesetzlosigkeit gegründet ist[b], wird verworfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich entsprechend der Wortfolge: „der Große Heilige“; möglich ist auch „der Große und Heilige“, doch im überlieferten Text steht keine Konjunktion.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „jede Tat, die in Gesetzlosigkeit festgemacht oder gegründet ist, wird weggeworfen.“ Das zugrunde liegende Verb kann ein Festmachen, Gründen oder Verankern bezeichnen; die genaue Nuance ist unsicher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይትነበብ
  choice: werden verlesen werden
  rationale: Die passive Zukunfts- bzw. Jussivbedeutung wird gewahrt; „verlesen“ vermittelt die öffentliche, gerichtliche Bekanntmachung.
- source_word: ኵሉ ነገረ
  choice: alle Worte
  rationale: ነገር kann „Wort“, „Sache“ oder „Angelegenheit“ bedeuten. In Verbindung mit dem Verlesen passt „Worte“ zur Vorstellung öffentlich vorgetragener Anklagepunkte; die weitere Bedeutung wird in der Fußnote bewahrt.
- source_word: ዓመፃክሙ
  choice: eurer Gesetzlosigkeit
  rationale: „Gesetzlosigkeit“ bewahrt die moralisch-forensische Kraft rebellischen Unrechts, ohne den Ausdruck auf körperliche Gewalt zu verengen.
- source_word: ቅድመ ዐቢይ ቅዱስ
  choice: vor dem Großen Heiligen
  rationale: Die Wortfolge des Ge'ez wird ohne ergänzendes „und“ wiedergegeben; Großschreibung kennzeichnet den Ausdruck als göttlichen Titel.
- source_word: ይትኀፈር ገጽክሙ
  choice: eure Gesichter werden beschämt werden
  rationale: Die Form bezeichnet das Beschämtwerden bzw. Zuschandenwerden. Die Übersetzung wahrt das Gesicht als sichtbaren Träger der Schande und vermeidet die nicht ausdrücklich vorhandene Metapher des Bedeckens.
- source_word: ይገደፍ
  choice: wird verworfen werden
  rationale: „Verworfen“ gibt im Gerichtskontext das Zurückweisen oder Wegwerfen wieder, ohne Vernichtung oder ein förmliches Verdammungsurteil hineinzulesen.
- source_word: ተግባረ
  choice: Tat
  rationale: „Tat“ bezeichnet eine konkrete moralische Handlung und passt zum Gerichtskontext.
- source_word: ዘጸንዐ በዓመፃ
  choice: die in Gesetzlosigkeit gegründet ist
  rationale: Die Wendung enthält die stärkere Vorstellung des Festgegründet- oder Verankertseins und wird daher nicht zum allgemeineren „in Gesetzlosigkeit getan“ abgeflacht.
theological_decisions:
- issue: Wiedergabe des göttlichen Titels ዐቢይ ቅዱስ
  choice: der Große Heilige
  alternative: der Große und Heilige
  rationale: Der Ausdruck fungiert in der Gerichtsszene als ehrfürchtiger göttlicher Titel. „Der Große Heilige“ folgt der überlieferten Wortfolge und fügt keine im Text fehlende Konjunktion ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst forensischem Klang. Die wiederholte Passivkonstruktion folgt der Gerichtsszene des Ge'ez. Echte lexikalische Unsicherheiten werden in den Fußnoten offengehalten.
