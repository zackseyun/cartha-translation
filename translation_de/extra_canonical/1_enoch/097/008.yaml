base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/008.yaml
  text: Woe to you who acquire silver and gold not by righteousness[a], and say, ‘We have become rich with wealth, and we have acquired possessions[c][b], and we have acquired everything we desired.’
translation:
  language: de
  text: 'Wehe euch, die ihr Silber und Gold nicht auf gerechte Weise[a] erwerbt und sagt: »Wir sind reich geworden, wir haben Vermögen[b], und wir haben alles erworben, was wir begehrten.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nicht in Gerechtigkeit«. Die Wendung kann die Art des Erwerbs oder allgemeiner dessen moralische Beschaffenheit bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: »und Vermögen ist uns geworden«; auch möglich: »und wir haben Besitz«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አሌ
  choice: Wehe euch
  rationale: Bewahrt die Kraft der prophetischen Gerichtsankündigung und ist im Deutschen idiomatisch.
- source_word: ታጠርዩ / አጥረይነ
  choice: erwerbt / haben erworben
  rationale: Die Wiedergabe mit demselben deutschen Verbstamm erhält die bewusste Wiederholung des äthiopischen Verbs.
- source_word: ብሩረ ወወርቀ
  choice: Silber und Gold
  rationale: Die konkrete Bezeichnung der Edelmetalle wird wörtlich beibehalten.
- source_word: ዘአኮ በጽድቅ
  choice: nicht in Gerechtigkeit
  rationale: Bleibt nahe an der präpositionalen Wendung und bewahrt den umfassenden ethisch-theologischen Begriff.
- source_word: ብዕልነ ብዕለ
  choice: Wir sind reich an Vermögen geworden
  rationale: Gibt sowohl den erreichten Zustand des Reichseins als auch den materiellen Bezug wieder.
- source_word: ወኮነ ለነ ንዋይ
  choice: und Besitz ist uns zuteilgeworden
  rationale: Gibt die eigenständige mittlere Aussage vollständig wieder, ohne sie mit dem folgenden Erwerbssatz zu verschmelzen.
- source_word: ኵሎ ዘፈቀድነ
  choice: alles, was wir begehrten
  rationale: Erhält die umfassende, selbstzufriedene Behauptung und den deutlichen Bezug auf das Begehren.
theological_decisions:
- issue: Bedeutung von በጽድቅ bei der Verurteilung unrechtmäßig erworbenen Reichtums
  choice: in Gerechtigkeit
  alternative: auf gerechte Weise / rechtmäßig
  rationale: „Gerechtigkeit“ bewahrt die moralisch-theologische Weite des Ausdrucks; eine rein rechtliche Deutung als „rechtmäßig“ wäre enger.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die dreigliedrige Prahlerei des Ausgangstextes bleibt vollständig erhalten; ebenso die Wiederholung des Verbs für „erwerben“. Die direkte Rede verwendet deutsche Anführungszeichen.
