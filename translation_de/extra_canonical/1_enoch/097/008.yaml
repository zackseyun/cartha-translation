  - severity: low
    issue: „nicht in Gerechtigkeit erwerbt“
    rationale: Die Form ist zwar quellennah, aber im modernen Deutsch weniger idiomatisch. „Nicht auf gerechte Weise“ gibt die Art des Erwerbs natürlich wieder, ohne den ethischen Gehalt auf bloße Legalität zu verengen.
