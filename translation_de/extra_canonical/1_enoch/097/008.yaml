  source_fidelity: 'Die drei Bestandteile der Prahlerei bleiben erhalten: Reichwerden, das Haben von Vermögen/Besitz und der Erwerb alles Begehrten. Die Wiederholung von „erwerben“ für ታጠርዩ und አጥረይነ wird bewahrt. „Zuteilgeworden“ ist jedoch für ወኮነ፡ ለነ፡ ንዋይ eine unnötig interpretierende und im Kontext zu stark passiv-providenzielle Wiedergabe.'
