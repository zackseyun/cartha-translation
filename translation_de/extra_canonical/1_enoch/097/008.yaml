  terminology: „Wehe euch“, „Gerechtigkeit“, „Silber und Gold“ sowie „erwerben“ sind angemessen. „Gerechtigkeit“ bleibt als Hauptwiedergabe erhalten; die idiomatischere präpositionale Verbindung wird im Text gewählt und die nähere formale Alternative in der Fußnote dokumentiert.
