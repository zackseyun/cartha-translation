base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/003.yaml
  text: What will you do[a], you sinners, and where will you flee on that day of judgment[b], when you hear the voice of the prayer of the righteous?
translation:
  language: de
  text: Was werdet ihr tun, ihr Sünder, und wohin werdet ihr fliehen an jenem Tag des Gerichts[a], wenn ihr die Stimme des Gebets der Gerechten[b] hört?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »an jenem Tag der Bedrängnis«; auch »der Strafe« oder »der Verurteilung« ist möglich.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich auch möglich: »den Laut des Gebets der Gerechten« oder »das Wort ihres Gebets«; das ge’ezische Wort kann »Stimme«, »Laut« oder »Wort« bedeuten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ምንተ፡ ትገብሩ
  choice: Was werdet ihr tun
  rationale: Die Verbindung aus Fragewort und Imperfekt hat im bevorstehenden Gerichtszusammenhang natürliche Zukunftsbedeutung und formuliert eine direkte Herausforderung.
- source_word: ኃጥኣን
  choice: ihr Sünder
  rationale: Die Anrede wird ausdrücklich und in prophetisch-konfrontativem Ton wiedergegeben.
- source_word: አይቴ፡ ትጐይዩ
  choice: wohin werdet ihr fliehen
  rationale: Das Verb bezeichnet eine eilige Bewegung; im Gerichtskontext trifft „fliehen“ den Versuch, dem drohenden Geschehen zu entkommen.
- source_word: በይእቲ፡ ዕለት
  choice: an jenem Tag
  rationale: Dies ist die natürliche deutsche Zeitangabe und bewahrt zugleich den apokalyptischen Klang.
- source_word: እንተ፡ ጽነፄ
  choice: des Gerichts
  rationale: Im Zusammenhang bezeichnet der Ausdruck eine bedrängende, strafende Abrechnung. „Gericht“ gibt die forensisch-apokalyptische Bedeutung wieder, ohne die möglichen Nuancen zu verschweigen.
- source_word: ሶበ፡ ትሰምዑ
  choice: wenn ihr … hört
  rationale: Der Temporalsatz trägt Zukunftsbezug; im modernen Deutschen ist dafür das Präsens nach „wenn“ idiomatisch.
- source_word: ቃለ፡ ጸሎቶሙ፡ ለጻድቃን
  choice: die Stimme des Gebets der Gerechten
  rationale: ቃል kann „Stimme“, „Laut“ oder „Wort“ bedeuten. „Stimme“ bewahrt hier den hörbaren, eindringlichen Charakter des Gebets besser als ein bloß akustisches „Geräusch“; „der Gerechten“ erhält den substantivierten Plural.
theological_decisions:
- issue: Bedeutung des Gebets der Gerechten in der Gerichtsszene
  choice: Die Sünder hören beim gerichtlichen Umschwung das Gebet der Gerechten.
  alternative: Sie hören unmittelbar den Ruf der Gerechten oder deren anklagendes Zeugnis.
  rationale: Der ge’ezische Text nennt ausdrücklich das „Gebet“. Die direkte Wiedergabe bewahrt die Vorstellung, dass die Gerechten den Himmel um Gerechtigkeit anrufen, ohne das Gebet mit einer späteren theologischen Formel gleichzusetzen.
- issue: Charakter des angekündigten Tages
  choice: Tag des Gerichts
  alternative: Tag der Bedrängnis, Strafe oder Verurteilung
  rationale: Der Kontext legt eine strafende Abrechnung nahe, doch die lexikalische Spannweite wird in der Fußnote offengehalten.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter prophetischer Anrede. Der Satzbau bleibt nahe am ge’ezischen Frage- und Temporalsatz, während die deutschen Verbformen idiomatisch gehalten sind. Die ungewöhnliche, aber verständliche Wendung „Stimme des Gebets“ bewahrt bewusst das Bild des Ausgangstextes.
