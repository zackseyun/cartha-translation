base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/005.yaml
  text: And in those days the prayers of the holy ones will reach the Lord[b][a], and the days of your judgment will come upon you.
translation:
  language: de
  text: Und in jenen Tagen werden die Gebete der Heiligen[a] den Herrn erreichen, und die Tage eures Gerichts werden über euch kommen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der heiligen Menschen«. Der ge’ezische Ausdruck bedeutet wörtlich »die Heiligen« und kann je nach Zusammenhang auch weiter verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: Der letzte Ausdruck ist in diesem Textzeugen schwer zu deuten. Wahrscheinlich sind die kommenden Tage der Abrechnung oder Bestrafung für die hier angesprochenen Frevler gemeint.
    reason: textual_variant
lexical_decisions:
- source_word: በእማንቱ መዋዕል
  choice: in jenen Tagen
  rationale: Bewahrt die geläufige apokalyptische Zeitformel sowie die Wiederholung von »Tagen« im zweiten Satzteil.
- source_word: ትበጽኅ ጸሎቶሙ
  choice: werden die Gebete … erreichen
  rationale: Das Verb bezeichnet das Ankommen an einem Ziel. »Erreichen« bewahrt hier das Bild, dass die Gebete zum Herrn gelangen.
- source_word: ለቅዱሳን
  choice: der Heiligen
  rationale: Die substantivierte Form gibt den Ausdruck knapp und transparent wieder, ohne festzulegen, ob ausschließlich gerechte Menschen oder auch himmlische Wesen gemeint sind.
- source_word: ኀበ እግዚእ
  choice: den Herrn
  rationale: Bei »erreichen« wird die im Ge’ez ausgedrückte Richtung im Deutschen natürlich durch das Akkusativobjekt wiedergegeben.
- source_word: ይበጽሕ መዋዕለ ኵነክሙ
  choice: die Tage eures Gerichts werden über euch kommen
  rationale: Die Überlieferung des letzten Ausdrucks ist schwierig. Im Zusammenhang der Weherufe bezeichnet er wahrscheinlich eine bevorstehende gerichtliche Abrechnung; »über euch kommen« bringt ihren bedrohlichen Eintritt zum Ausdruck, ohne sie auf körperliche Vernichtung einzuengen.
theological_decisions:
- issue: Identität der mit ቅዱሳን bezeichneten »Heiligen«
  choice: Die mehrdeutige Bezeichnung »die Heiligen« bleibt im Haupttext erhalten.
  alternative: die Gerechten; heilige Menschen; Engel
  rationale: Im unmittelbaren Zusammenhang sind wahrscheinlich bedrängte Gerechte gemeint, deren Gebete Gott erreichen. Der Ausdruck selbst kann jedoch weiter gefasst sein; eine ausdrückliche Festlegung auf Menschen oder Engel würde die echte Deutungsoffenheit beseitigen.
- issue: Art des angekündigten Unheils
  choice: Gericht
  alternative: Vernichtung; Strafe; Abrechnung
  rationale: »Gericht« wahrt den richterlich-apokalyptischen Sinn des Kontexts, ohne eine bestimmte Form der Strafe vorwegzunehmen; wegen der schwierigen Textgestalt wird die Unsicherheit in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem apokalyptischem Klang. Die wiederholte Rede von den »Tagen« und das Bild der den Herrn erreichenden Gebete bleiben erhalten; schwer verständliche altertümliche Wendungen werden vermieden.
