base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/004.yaml
  text: 'And you will become like them[d][c][b][a], against whom this word will be a witness: ‘You have become companions of sinners.’'
translation:
  language: de
  text: 'Und ihr werdet wie jene werden, gegen die dieses Wort[a] als Zeugnis dienen wird: »Ihr seid zu Gefährten von Sündern[b] geworden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dieser Ausspruch« beziehungsweise »diese Sache«.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »zu Gefährten mit Sündern« oder »zu Genossen von Sündern«; gemeint ist ihre Teilhabe oder Gemeinschaft mit ihnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ትከውኑ
  choice: ihr werdet werden
  rationale: Die Zukunftsform von »sein/werden« bezeichnet hier das Eintreten in einen Zustand; die Wiederholung von »werden« ist im Deutschen zwar markant, bewahrt aber die Verbindung zum späteren »seid … geworden«.
- source_word: ከማሆሙ
  choice: wie jene
  rationale: Die knappe Vergleichsformulierung wird natürlich wiedergegeben; »jene« stellt den Bezug zu der folgenden Relativkonstruktion her.
- source_word: ሰማዕተ ይከውን ዴቤሆሙ ዝንቱ ነገር
  choice: gegen die dieses Wort Zeugnis ablegen wird
  rationale: ሰማዕተ wird als »Zeugnis/Zeuge« verstanden, nicht als Form von »hören«. ዴቤሆሙ trägt hier die gegen die Betroffenen gerichtete, gerichtliche Aussagekraft.
- source_word: ዝንቱ ነገር
  choice: dieses Wort
  rationale: ነገር kann »Wort«, »Ausspruch« oder »Sache« bedeuten. »Wort« passt zur Funktion als belastendes Zeugnis, ohne die Bedeutungsbreite unnötig einzuengen.
- source_word: ሱቱፋነ
  choice: Gefährten
  rationale: Das Wort bezeichnet Teilhabe oder Gemeinschaft. »Gefährten« drückt die soziale und moralische Verbindung aus, ohne einen technischen theologischen Begriff einzuführen.
- source_word: ኮንክሙ
  choice: ihr seid … geworden
  rationale: Die vollendete Form beschreibt einen eingetretenen Zustand und spiegelt die einleitende Warnung, dass die Angesprochenen wie jene werden.
- source_word: ለኃጥኣን
  choice: von Sündern
  rationale: In Verbindung mit »Gefährten« wird die Zuordnung beziehungsweise Gemeinschaft idiomatisch ausgedrückt; die mögliche Nuance des Umgangs »mit Sündern« bleibt in einer Fußnote sichtbar.
theological_decisions:
- issue: Art der Warnung
  choice: Die Angesprochenen werden den Verurteilten gleich, indem sie sich mit Sündern verbinden; das Wort tritt als Zeugnis gegen solche Menschen auf.
  alternative: Der Satz könnte als bloße Feststellung verstanden werden, dass die Angesprochenen selbst Sünder sind, oder ausschließlich als gerichtliches Urteil ohne Betonung ihrer Gemeinschaft mit Sündern.
  rationale: Der Wortlaut verbindet das Werden »wie jene« ausdrücklich mit der Anklage, Gefährten von Sündern geworden zu sein. Die Übersetzung erhält sowohl die ethische als auch die gerichtliche Spannung, ohne sie zu einer weitergehenden Lehraussage auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die gerichtliche Bildsprache von Wort und Zeugnis bleibt erhalten. Die bewusst parallele Formulierung »werdet werden« / »seid … geworden« bildet die beiden geezischen Formen desselben Verbs ab.
