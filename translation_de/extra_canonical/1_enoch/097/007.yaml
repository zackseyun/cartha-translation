base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/007.yaml
  text: Woe to you[a], sinners, who are in the midst of the sea and upon the dry land[b], whose memory is evil against you.
translation:
  language: de
  text: Wehe euch, ihr Sünder, die ihr mitten im Meer und auf dem trockenen Land[b] seid, deren Andenken böse gegen euch ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Schlusssatz ist schwer zu deuten. Die Übersetzung folgt eng der überlieferten Wortfolge. Möglich sind auch: „deren Andenken böse ist“, „deren Andenken gegen euch steht“ oder „an denen böse Erinnerung haftet“.'
    reason: lexical_alternative
  - marker: b
    text: 'Die Verbindung „mitten im Meer und auf dem trockenen Land“ dürfte umfassend gemeint sein: Der Weheruf gilt überall, wo Menschen sich aufhalten oder unterwegs sind.'
    reason: cultural_note
lexical_decisions:
- source_word: አሌ፡ ለክሙ
  choice: Wehe euch
  rationale: Bewahrt den prophetischen Weheruf und seinen Gerichtston; „Ach über euch“ wäre im heutigen Deutsch weniger natürlich und schwächer.
- source_word: ኃጥኣን
  choice: ihr Sünder
  rationale: Direkte und geläufige Wiedergabe der als Gruppe angeredeten Menschen unter dem Gericht.
- source_word: እለ፡ ማእከለ፡ ባሕር
  choice: die ihr mitten im Meer ... seid
  rationale: Gibt die räumliche Wendung anschaulich und relativ wörtlich wieder, ohne sie zu „auf See“ zu verallgemeinern.
- source_word: ወዲበ፡ የብስ
  choice: und auf dem trockenen Land
  rationale: Erhält den ausdrücklichen Gegensatz zwischen Meer und trockenem Land.
- source_word: ዝክርሙ
  choice: Andenken
  rationale: „Andenken“ lässt eher als „Erinnerung“ offen, ob der fortlebende Ruf, das Gedenken oder ein memorialer Eintrag gemeint ist.
- source_word: እኩይ
  choice: böses
  rationale: Bewahrt die klare moralische Wertung des Quellworts.
- source_word: ዴቤክሙ
  choice: auf denen ... lastet
  rationale: Die schwierige Form scheint eine auf die Angeredeten bezogene Bedeutung wie „auf/über euch“ zu tragen. „Lastet“ ergibt im Deutschen einen verständlichen Satz, ohne die gerichtliche Belastung abzuschwächen.
theological_decisions:
- issue: Sinn des schwierigen Schlusssatzes über das Andenken
  choice: auf denen ein böses Andenken lastet
  alternative: deren Andenken böse gegen euch ist; deren Andenken böse ist; an denen böse Erinnerung haftet
  rationale: Der äthiopische Wortlaut ist syntaktisch und lexikalisch unsicher. Die Fassung wahrt die Vorstellung, dass das fortbestehende Gedenken den Sündern belastend entgegensteht, legt aber nicht fest, ob Ruf, Erinnerung oder memorialer Eintrag gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der prophetische Weheruf bleibt knapp und eindringlich; die ungewöhnliche Bildsprache des Schlusssatzes wird nicht konfessionell oder dogmatisch aufgelöst.
