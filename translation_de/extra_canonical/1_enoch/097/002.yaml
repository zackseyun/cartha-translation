base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/002.yaml
  text: Know that the Most High remembers your destruction[c][b][a], and the angels of heaven rejoice over your destruction.
translation:
  language: de
  text: 'Seid gewiss: Der Höchste gedenkt eures Untergangs[a], und die Engel des Himmels freuen sich über euren Untergang.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »eures Verderbens« oder »eures Ruins«; ebenso beim zweiten Vorkommen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እሙረ፡ ይከውን፡ ለክሙ፡ እስመ
  choice: 'Ihr sollt wissen:'
  rationale: Die Wendung bedeutet idiomatisch „Es sei euch bekannt, dass“. Die deutsche Fassung gibt sie natürlich und eindringlich wieder; der Doppelpunkt leitet den Inhalt des Wissens ein.
- source_word: ልዑል
  choice: der Höchste
  rationale: Geläufiger, würdevoller deutscher Gottesname, der den apokalyptischen Titel wahrt.
- source_word: ይዜከር
  choice: gedenkt
  rationale: Bewahrt gegenüber „erinnert sich“ das erhöhte Register und lässt die im Kontext mögliche Gegenwarts- beziehungsweise Zukunftsbedeutung als sichere Gerichtsaussage bestehen.
- source_word: ሐጕልክሙ / ሐጕለ ዚአክሙ
  choice: eures Untergangs / euren Untergang
  rationale: „Untergang“ bezeichnet schweres Verderben, ohne die Art des Gerichts als Tötung oder Vernichtung enger festzulegen. Die Wiederholung des Quellwortes bleibt erhalten.
- source_word: ይትፌሥሑ
  choice: freuen sich
  rationale: Gibt das ausdrückliche Freudenverb klar und idiomatisch wieder, ohne die Aussage abzuschwächen.
- source_word: መላእክተ፡ ሰማይ
  choice: die Engel des Himmels
  rationale: Bewahrt die Genitivkonstruktion und die apokalyptische Bildsprache.
theological_decisions:
- issue: Freude der himmlischen Engel über das Gericht an den Angesprochenen
  choice: Die Engel freuen sich ausdrücklich über den Untergang der Angesprochenen.
  alternative: Die Engel bezeugen oder billigen lediglich das Gericht; oder sie freuen sich nur abstrakt über Gottes Gerechtigkeit.
  rationale: Das ge'ezische Freudenverb und die Präposition beziehen die Freude unmittelbar auf den Untergang. Die schroffe apokalyptische Spannung wird daher nicht abgeschwächt oder erklärend aufgelöst.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem apokalyptischem Ton. „Ihr sollt wissen“ ist natürlicher als das wörtlichere „Es sei euch bekannt“; „gedenkt“ hält den gehobenen Klang. Die Wiederholung von „Untergang“ ist bewusst beibehalten.
