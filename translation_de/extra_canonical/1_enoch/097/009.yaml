base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/009.yaml
  text: And now let us do what we planned[a], for we have gathered silver, and we have filled our storehouses like water[d][c][b], and many are the laborers of our houses.
translation:
  language: de
  text: Und nun lasst uns tun, was wir geplant haben[a]; denn wir haben Silber zusammengetragen und unsere Vorratshäuser wie Wasser gefüllt[b], und zahlreich sind die Arbeiter unserer Häuser[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „was wir gedacht haben“ beziehungsweise „was wir ersonnen haben“. Das ge’ezische Verb kann sowohl Denken als auch Planen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht der auffällige Vergleich „wie Wasser“. Gemeint ist wahrscheinlich die überreiche oder überfließende Fülle.
    reason: cultural_note
  - marker: c
    text: Das mit „Arbeiter“ wiedergegebene Wort kann besonders Landarbeiter oder Ackerleute bezeichnen. „Häuser“ kann in diesem Zusammenhang auch Haushalte oder Landgüter meinen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ንግበር
  choice: lasst uns tun
  rationale: Die kohortative Bedeutung der ersten Person Plural passt zur prahlerischen Selbstaufforderung der Sprecher.
- source_word: ዘኀለይነ
  choice: was wir geplant haben
  rationale: Das Verb umfasst Denken und Planen; im Zusammenhang bezeichnet es einen absichtlichen Entschluss, ohne die weitere Bedeutungsbreite zu verschweigen.
- source_word: ብሩረ
  choice: Silber
  rationale: Die konkrete Sachbezeichnung bewahrt das Bild materiellen Reichtums besser als das allgemeinere „Geld“.
- source_word: አስተጋባእነ
  choice: angehäuft
  rationale: Das Verb bezeichnet das Zusammentragen; „angehäuft“ gibt hier die große Menge und den prahlerischen Ton natürlich wieder.
- source_word: መዛግብቲነ
  choice: unsere Vorratshäuser
  rationale: Der Plural bezeichnet Aufbewahrungs- oder Schatzräume. „Vorratshäuser“ passt zum Bild des Füllens und lässt den genauen Inhalt offen.
- source_word: ከመ ማይ
  choice: wie mit Wasser
  rationale: Im Deutschen verlangt das Füllen idiomatisch „mit“; zugleich bleibt der auffällige Vergleich mit Wasser erhalten.
- source_word: ሐራስተ
  choice: Arbeiter
  rationale: Das Wort weist wahrscheinlich auf landwirtschaftliche Arbeiter hin, kann aber breiter verstanden werden; die allgemeinere Wiedergabe bewahrt die Unsicherheit.
- source_word: አብያቲነ
  choice: unserer Häuser
  rationale: Dies entspricht der Grundbedeutung. Ob hier Haushalte oder Landgüter gemeint sind, bleibt durch eine Fußnote offen.
theological_decisions:
- issue: Ton der reichen Sprecher im Weheruf-Kontext
  choice: Prahlerische Selbstaufforderung
  alternative: Neutrale Absichtserklärung
  rationale: Die Kohortativform und der Kontext der Verurteilung reicher Frevler lassen die Rede als selbstsichere Prahlerei erscheinen; zusätzliche wertende Wörter werden dennoch vermieden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede behält ihre selbstsichere, prahlerische Kraft. Der ungewöhnliche Wasservergleich sowie die Unsicherheit in der Schlussklausel werden nicht stillschweigend geglättet.
