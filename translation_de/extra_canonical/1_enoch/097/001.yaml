base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/097/001.yaml
  text: Trust[a], you righteous, for sinners will become a disgrace[b], and they will perish on the day of iniquity.
translation:
  language: de
  text: Habt Vertrauen[a], ihr Gerechten! Denn die Sünder werden zur Schande und gehen am Tag der Gesetzlosigkeit zugrunde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Glaubt“; der Vers nennt nicht ausdrücklich, wem oder worauf die Gerechten vertrauen sollen.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ተአመኑ
  choice: Habt Vertrauen
  rationale: Der pluralische Imperativ bezeichnet Glauben oder Vertrauen. Die deutsche Wendung wahrt die unausgesprochene Bezugsgröße und klingt zugleich wie eine Ermutigung.
- source_word: ጻድቃን
  choice: ihr Gerechten
  rationale: Die Anredeform erhält den Vokativ und den ethischen Gegensatz zu den Sündern.
- source_word: ለጽእለት
  choice: zur Schande
  rationale: Die Wendung bezeichnet Schande, Schmach oder Verachtung als den Zustand beziehungsweise das Geschick der Sünder.
- source_word: ይከውኑ
  choice: werden
  rationale: Die Zukunftsform des Verbs ‚sein/werden‘ wird zusammen mit der prädikativen Wendung ‚zur Schande‘ als ‚werden‘ wiedergegeben.
- source_word: ኃጥኣን
  choice: die Sünder
  rationale: Die übliche moralisch-religiöse Bezeichnung bewahrt den ausdrücklichen Gegensatz zu den Gerechten.
- source_word: ወይትሐጕሉ
  choice: und … zugrunde gehen
  rationale: Die Form gehört zur Wurzel ሐጕለ mit der Bedeutung ‚zugrunde gehen, vernichtet werden‘; der Zusammenhang mit dem folgenden Vers stützt diese Lesart.
- source_word: በዕለተ ዓመፃ
  choice: am Tag der Gesetzlosigkeit
  rationale: ዓመፃ bezeichnet hier Frevel, Unrecht oder Gesetzlosigkeit. ‚Gesetzlosigkeit‘ wahrt den apokalyptischen Gerichtston, ohne den Ausdruck auf körperliche Gewalt einzuengen.
theological_decisions:
- issue: Ob der einleitende Imperativ ausdrücklich religiösen Glauben oder allgemeine Zuversicht bezeichnet
  choice: Habt Vertrauen
  alternative: Glaubt
  rationale: Der Vers nennt kein ausdrückliches Objekt. ‚Habt Vertrauen‘ bewahrt sowohl die religiöse als auch die ermutigende Dimension, ohne eine Bezugsgröße hinzuzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede und der knappe apokalyptische Gerichtston bleiben erhalten; die schwierige Schandewendung wird bewusst eng am Ausgangstext wiedergegeben.
