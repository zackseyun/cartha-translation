base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/008.yaml
  text: Was it not he who made heaven and earth and everything that is in them? Who gave instruction and wisdom to all who move upon the earth and to those at sea?[a][b][c]
translation:
  language: de
  text: Ist er es nicht, der Himmel und Erde und alles, was in ihnen ist,[a] gemacht hat? Wer hat allen, die sich auf der Erde bewegen, und denen auf dem Meer[b] Unterweisung und Weisheit gegeben?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und alles, was sich in ihnen befindet“.'
    reason: lexical_alternative
  - marker: b
    text: Die knappe ge'ezische Wendung kann Menschen auf See oder allgemeiner Wesen bezeichnen, die mit dem Meer verbunden sind.
    reason: lexical_alternative
lexical_decisions:
- source_word: አኮኑ ውእቱ
  choice: Ist er es nicht
  rationale: Gibt die rhetorische Frage wieder, die Zustimmung erwartet. Das deutsche Präsens mit anschließendem Perfekt klingt natürlich und bewahrt den Bezug auf den gegenwärtig als Schöpfer Erkannten.
- source_word: ገብረ
  choice: gemacht hat
  rationale: Das Verb bezeichnet allgemein ein Machen oder Tun. „Gemacht“ bleibt näher an dieser Breite als das theologisch stärker festgelegte „erschaffen“.
- source_word: ሰማየ ወምድረ
  choice: Himmel und Erde
  rationale: Entspricht der knappen ge'ezischen Paarformel für die gesamte geschaffene Ordnung.
- source_word: ወኵሎ ዘሀሎ ውስቴቶሙ
  choice: und alles, was in ihnen ist
  rationale: Bewahrt die umfassende Aussage und bezieht den Plural natürlich auf Himmel und Erde.
- source_word: መኑ ወሀበ
  choice: Wer hat ... gegeben
  rationale: መኑ eröffnet ohne Konjunktion eine zweite, pointierte Frage; deshalb wird kein „Und“ ergänzt.
- source_word: ትምህርተ ወጥበበ
  choice: Unterweisung und Weisheit
  rationale: „Unterweisung“ bezeichnet vermittelte Lehre oder Anleitung; „Weisheit“ ist die natürliche Entsprechung für ጥበብ, ohne sie auf bloßes Können zu verengen.
- source_word: ለኵሉ እለ ይትኀወሱ ዲበ ምድር
  choice: allen, die sich auf der Erde bewegen
  rationale: Die Formulierung erhält den Bewegungsaspekt des Verbs und legt nicht fest, ob ausschließlich Menschen oder Lebewesen allgemein gemeint sind.
- source_word: ወለእለ ባሕር
  choice: und denen auf dem Meer
  rationale: Die knappe Wendung wird als Gegenstück zu denen auf der Erde verstanden. „Auf dem Meer“ ist im Deutschen natürlich, lässt aber die genaue Bezugsgruppe offen.
theological_decisions:
- issue: Wiedergabe der Schöpferaussage
  choice: gemacht hat
  alternative: erschaffen hat
  rationale: Der ge'ezische Ausdruck bezeugt Gott als Urheber von Himmel, Erde und ihrem Inhalt, verwendet aber ein breiteres Verb. Die Übersetzung vermeidet daher eine unnötige dogmatische Präzisierung.
- issue: Umfang der Empfänger von Unterweisung und Weisheit
  choice: allen, die sich auf der Erde bewegen, und denen auf dem Meer
  alternative: allen Menschen zu Land und auf dem Meer
  rationale: Der Wortlaut ist weit und bestimmt die Empfänger nicht ausdrücklich als Menschen oder Tiere. Diese Offenheit wird bewahrt.
- issue: Verknüpfung der beiden Fragen
  choice: Wer hat
  alternative: Und wer hat
  rationale: Vor dem ge'ezischen Fragewort መኑ steht keine Konjunktion. Die abrupte zweite Frage bleibt deshalb unverbunden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung der zweiten Frage wurde für natürliches Deutsch angepasst, ohne die asyndetische Eröffnung mit „Wer“ aufzugeben. Die Formulierung vermeidet sowohl eine Einschränkung auf Menschen als auch eine ausdrückliche Ausweitung auf sämtliche Tiere.
