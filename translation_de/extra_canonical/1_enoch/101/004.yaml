base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/004.yaml
  text: Have you not seen the captains of the ships[a], how they are tossed by the waves, and their ships are shaken by the winds[c][b], and they are distressed?
translation:
  language: de
  text: Habt ihr nicht die Kapitäne der Schiffe gesehen, wie sie von den Wellen hin und her geworfen werden, wie ihre Schiffe von den Winden erschüttert werden und wie sie in Bedrängnis geraten?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die vorliegende Transkription ist an der Stelle, die hier mit „von den Wellen“ wiedergegeben wird, unsicher; im Zusammenhang ist diese Lesart wahrscheinlich.
    reason: textual_uncertainty
lexical_decisions:
- source_word: ኢትሬእይዎሙኑ
  choice: Habt ihr nicht gesehen
  rationale: Die verneinte Frage ist rhetorisch und richtet sich unmittelbar an die Angesprochenen. Das deutsche Perfekt klingt natürlich und bewahrt den mahnenden Ton.
- source_word: ለተነገሥተ፡ አሕማር
  choice: die Kapitäne der Schiffe
  rationale: Die Wortverbindung bezeichnet im nautischen Zusammenhang die Befehlshaber beziehungsweise Führer der Schiffe. Eine mechanische Wiedergabe als „Könige der Schiffe“ wäre im Deutschen missverständlich.
- source_word: እፎ
  choice: wie
  rationale: Leitet die anschauliche Beschreibung der beobachteten Vorgänge ein.
- source_word: ይትሀወኩ
  choice: hin und her geworfen werden
  rationale: Das Verb bezeichnet heftige Bewegung oder Erschütterung; im Zusammenhang mit Wellen gibt die Formulierung das maritime Bild natürlich wieder.
- source_word: እምገደ
  choice: von den Wellen
  rationale: Die überlieferte Transkription scheint hier verkürzt oder fehlerhaft zu sein; der erschließbare maritime Ausdruck bezeichnet die Wellen als Ursache der Bewegung.
- source_word: ወያንቀለቅሉ
  choice: erschüttert werden
  rationale: Das Verb beschreibt Schütteln oder heftiges Schwanken und passt zu Schiffen im Sturm.
- source_word: እምነፋሳት
  choice: von den Winden
  rationale: ነፋሳት ist der Plural „Winde“; die Präposition kennzeichnet hier die verursachende Kraft.
- source_word: አሕማሮሙ
  choice: ihre Schiffe
  rationale: Die Form ist als Plural von „Schiff“ mit Suffix der dritten Person Plural zu verstehen, nicht als „ihre Seelen“.
- source_word: ወይትመነደቡ
  choice: und sie in Bedrängnis geraten
  rationale: Der Schluss beschreibt die Not und innere Beunruhigung der Seeleute, ohne die Intensität unnötig zu „Entsetzen“ oder „Panik“ zu steigern.
theological_decisions:
- issue: Wörtliche Seenot oder Sinnbild für die Erschütterung der Mächtigen
  choice: Das konkrete Bild von Seeleuten, Schiffen, Wellen und Winden bleibt im Haupttext erhalten; eine weitergehende sinnbildliche Deutung wird nicht in die Übersetzung eingetragen.
  alternative: Die ganze Aussage ausdrücklich als politische oder seelische Erschütterung der Mächtigen wiedergeben.
  rationale: Der äthiopische Wortlaut bietet ein deutliches maritimes Bild. Dessen mögliche mahnende oder sinnbildliche Kraft bleibt bestehen, ohne dass eine bestimmte Auslegung zur Übersetzung gemacht wird.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer maritimer Bildsprache. Die Satzstruktur folgt der rhetorischen Frage des Ausgangstextes, ohne ungebräuchliche wörtliche Wendungen zu erzwingen.
