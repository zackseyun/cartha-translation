base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/006.yaml
  text: Is not the whole sea[a], and all its waters, and all its movements[c][b], the work of the Most High? And he has measured all its works and bound its shores with sand.
translation:
  language: de
  text: Ist nicht das ganze Meer mit all seinen Wassern und all seinen Bewegungen[a] das Werk des Höchsten? Er hat alle Werke des Meeres abgemessen und seine Ufer mit Sand begrenzt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit „Bewegungen“ wiedergegebene Wort kann genauer das Wogen, Aufbrausen oder die Wellen des Meeres bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Die Schlussklausel ist textlich schwierig. Die vorliegende ge’ezische Transkription lässt sich auch etwa als „band seine Fundamente mit Sand“ verstehen; wahrscheinlich ist das Festsetzen der Grenze des Meeres gemeint.
    reason: textual_variant
lexical_decisions:
- source_word: አኮ
  choice: Ist nicht
  rationale: Leitet eine rhetorische Frage ein, die Zustimmung erwartet, und bewahrt deren Frageform.
- source_word: ኵሉ ባሕር
  choice: das ganze Meer
  rationale: Die kollektive Einzahl passt zu den folgenden femininen Singularbezügen und bezeichnet das Meer in seiner Gesamtheit.
- source_word: ማያቲሃ
  choice: all seinen Wassern
  rationale: Bewahrt die Pluralform und gibt die Gesamtheit der zum Meer gehörenden Wassermassen idiomatisch wieder.
- source_word: ሑሳታ
  choice: all seinen Bewegungen
  rationale: Der Ausdruck bezeichnet Bewegungen oder Erregungen des Meeres; die breite Wiedergabe vermeidet eine unbegründete Festlegung auf Wellen oder Brandung.
- source_word: ግብረ ልዑል
  choice: das Werk des Höchsten
  rationale: Kennzeichnet das Meer und seine Erscheinungen als Schöpfungswerk Gottes und bewahrt den erhabenen Gottesnamen.
- source_word: ዐቀመ
  choice: abgemessen
  rationale: Erhält das kosmologische Bild, nach dem Gott Ausmaß und Ordnung der Schöpfung bestimmt.
- source_word: አሰረ
  choice: begrenzt
  rationale: Gibt die Vorstellung des Bindens beziehungsweise Festsetzens der Meeresgrenze in natürlichem Deutsch wieder.
- source_word: እብንታሃ ቡኖባ
  choice: seine Ufer mit Sand
  rationale: Folgt der kontextuell sinnvollen Deutung als durch Sand festgesetzte Grenzen des Meeres; die überlieferte beziehungsweise transkribierte Schlussformulierung ist jedoch schwierig und wird deshalb in einer Fußnote offengelegt.
theological_decisions:
- issue: Gottesbezeichnung ልዑል
  choice: der Höchste
  alternative: der Erhabene
  rationale: „Der Höchste“ ist eine verständliche und gewichtige Gottesbezeichnung im jüdisch-apokalyptischen Sprachraum, ohne spätere konfessionelle Formeln einzutragen.
- issue: Bezug von „seine Werke“
  choice: Die grammatische Mehrdeutigkeit bleibt im Haupttext erhalten.
  alternative: „alle Werke des Meeres“ oder „alle seine Wirkungen“
  rationale: Der feminine Singularbezug kann auf das Meer weisen, während der unmittelbare Kontext auch einen Bezug auf den Höchsten nahelegen kann. Eine ausdrückliche Auflösung würde die Spannung des Textes beseitigen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die rhetorische Frage und das kosmologische Bild bleiben erhalten; unsichere Einzelheiten werden nicht stillschweigend dogmatisch oder sprachlich vereindeutigt.
