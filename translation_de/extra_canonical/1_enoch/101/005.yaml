review_pass:
  verdict: revise
  source_fidelity: Die Gegenwartsformen in der Beschreibung der Seeleute (»fürchten sie sich«, »geht … hinaus«, »denken …«) geben den fortlaufend-allgemeinen Charakter des geʿezischen Imperfekts angemessen wieder. Das folgende Futur (»wird … verschlingen«, »werden … untergehen«) ist als drohende Folge möglich. »Untergehen« wahrt die konkrete und die weitergehende Bedeutung des finalen Verbs, ohne sie zu eng auf »vernichtet werden« festzulegen.
  naturalness: »Ihr Besitz fährt … hinaus« wirkt im modernen Deutsch unidiomatisch, weil Besitz nicht selbst fährt. Ebenso ist »nichts Gutes denken« zwar verständlich, aber keine natürliche deutsche Verbindung. »… geht mit ihnen aufs Meer hinaus« und »denken sie an nichts Gutes« sind idiomatischer und erhalten die knappe Aussage samt der Ortsangabe »in ihrem Herzen«.
  terminology: »Wertvoller Besitz« gibt die guten bzw. wertvollen Güter sachgerecht wieder. »Verschlingen« und »untergehen« bewahren die Bildkraft des Meeres. Die Fußnote dokumentiert angemessen, dass »das Gute« auch auf den zuvor genannten Besitz bezogen werden kann.
  issues:
  - severity: low
    issue: Unidiomatische Prädikation bei »Besitz fährt«
    rationale: Das geʿezische »hinausgehen« verlangt nicht die spezifische deutsche Fortbewegungsart »fahren«. Bei Gütern klingt »geht mit ihnen aufs Meer hinaus« natürlicher und bleibt quellennah.
  - severity: medium
    issue: Unnatürliche Wendung »denken sie nichts Gutes«
    rationale: Deutsch verwendet hier gewöhnlich »an etwas denken«. »In ihrem Herzen denken sie an nichts Gutes« bewahrt die Negation, das Denken und die Herzensangabe, ohne eine moralische Deutung wie »sie beachten das Gute nicht« einzutragen.
  revised_text: Und deshalb fürchten sie sich, denn all ihr wertvoller Besitz geht mit ihnen aufs Meer hinaus, und in ihrem Herzen denken sie an nichts Gutes; denn das Meer wird sie verschlingen, und sie werden darin untergehen.
