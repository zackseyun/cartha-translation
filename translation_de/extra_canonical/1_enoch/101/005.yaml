base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/005.yaml
  text: And because of this they fear[a], for all their good possessions go out into the sea with them, and they do not think good in their hearts[b], for the sea will swallow them and they will sink in it.
translation:
  language: de
  text: Und deshalb fürchten sie sich, denn all ihr wertvoller Besitz geht mit ihnen aufs Meer hinaus, und in ihrem Herzen denken sie an nichts Gutes; denn das Meer wird sie verschlingen, und sie werden darin untergehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ይፈርሁ
  choice: sie fürchten sich
  rationale: Das äthiopische Imperfekt setzt hier die allgemeine, gegenwärtige Schilderung der Seeleute fort; die reflexive deutsche Wendung ist natürlich und bewahrt den Sinn von »sich fürchten«.
- source_word: ኵሉ፡ ንዋዮሙ፡ ሠናይ
  choice: all ihr wertvoller Besitz
  rationale: ንዋይ bezeichnet Besitz oder Güter; ሠናይ kennzeichnet diese hier als gut beziehungsweise wertvoll. »Wertvoller Besitz« klingt im Deutschen natürlich und vermeidet die abstrakte Bedeutung »das Gute« an dieser Stelle.
- source_word: ይወፅእ፡ ውስተ፡ ባሕር፡ ምስሌሆሙ
  choice: fährt mit ihnen aufs Meer hinaus
  rationale: Die Grundbedeutung von ይወፅእ ist »hinausgehen/hinausziehen«. Im Zusammenhang mit Seeleuten und ihren mitgeführten Gütern gibt »aufs Meer hinausfahren« den konkreten Vorgang idiomatisch wieder, ohne ein passives »hineingeworfen werden« einzutragen.
- source_word: ወሠናየ፡ ኢይሐልዩ፡ በልቦሙ
  choice: und in ihrem Herzen denken sie nichts Gutes
  rationale: Die Formulierung folgt der Negation und dem Wortfeld von Denken/Erwägen eng. Sie bewahrt zugleich die mögliche psychologische oder moralische Färbung, ohne den Satz ausdrücklich zu einer moralischen Anklage auszubauen.
- source_word: ባሕር፡ ይውኅጦሙ
  choice: das Meer wird sie verschlingen
  rationale: »Verschlingen« erhält das kräftige, bildhafte Verb und die bedrohliche Personifikation des Meeres.
- source_word: ወይትኀጐሉ፡ ውስቴታ
  choice: und sie werden darin untergehen
  rationale: »Untergehen« passt zum Tod im Meer und kann zugleich das Versinken und das endgültige Verderben ausdrücken, ohne eines von beidem unnötig festzulegen.
theological_decisions:
- issue: Bezug und Bedeutung von ሠናየ in der Aussage über das Denken des Herzens
  choice: Die Hauptfassung versteht die Wendung als »nichts Gutes denken« und belässt offen, ob damit fehlende Hoffnung oder eine innere moralische Haltung gemeint ist.
  alternative: 'Die Wendung kann auf den zuvor genannten wertvollen Besitz zurückverweisen: Sie denken in ihrem Herzen nicht an ihre Güter.'
  rationale: Die äthiopische Form erlaubt sowohl einen allgemeineren Bezug auf »Gutes« als auch einen Rückbezug auf den Besitz. Die Hauptfassung wahrt die knappe Ausdrucksweise; die Fußnote dokumentiert die echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der erste Teil bleibt als allgemeine Gegenwartsschilderung im Präsens; die erwartete Wirkung des Meeres steht im Futur. »Untergehen« bewahrt sowohl das konkrete Bild des Versinkens als auch den Sinn des Umkommens.
