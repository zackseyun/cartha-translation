  to: Und deshalb fürchten sie sich, denn all ihr wertvoller Besitz geht mit ihnen aufs Meer hinaus, und in ihrem Herzen denken sie an nichts Gutes; denn das Meer wird sie verschlingen, und sie werden darin untergehen.
  rationale: Die Revision beschränkt sich auf zwei idiomatische Anpassungen im Deutschen. Sie erhält die gegenwärtige Schilderung, die Mehrdeutigkeit von »Gutes« und den bedrohlichen Ausgang der Szene. Der Fußnotenanker bleibt an der mehrdeutigen Wendung stehen.
