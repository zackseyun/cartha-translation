base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/003.yaml
  text: And if he sends his wrath upon you for all your deeds[a], will you not entreat him? For you speak great and harsh words against his righteousness[d][c][b], and you have no peace.
translation:
  language: de
  text: Und wenn er seinen Zorn über euch kommen lässt wegen all eurer Taten, werdet ihr ihn dann nicht anflehen?[a] Denn ihr redet große und harte Worte gegen seine Gerechtigkeit[b], und ihr habt keinen Frieden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Formulierung kann auch verneinend verstanden werden: „Ihr seid nicht imstande, ihn anzuflehen.“ Das Ge’ez lässt sowohl eine Verneinung als auch eine rhetorische Frage zu.'
    reason: textual_or_grammatical_ambiguity
  - marker: b
    text: „Gerechtigkeit“ kann hier auch Gottes gerechtes Gericht oder sein Recht bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ፈነወ
  choice: kommen lässt
  rationale: Das Verb bezeichnet ein Aussenden oder Loslassen. In Verbindung mit Zorn gibt „über euch kommen lässt“ das gerichtliche Bild natürlich wieder, ohne den pronominalen Urheber ausdrücklich als Gott zu benennen.
- source_word: መዐቶ
  choice: Zorn
  rationale: „Zorn“ bewahrt im Gerichtskontext die apokalyptische und richterliche Kraft des Ausdrucks.
- source_word: በኵሉ ምግባሪክሙ
  choice: wegen all eurer Taten
  rationale: Die Wendung stellt den Zorn als Folge der gesamten Lebensführung der Angeredeten dar; „Taten“ ist knapp und moralisch gewichtig.
- source_word: አኮ አንትሙ እለ ታስተበቍዕዎ
  choice: werdet ihr ihn dann nicht anflehen?
  rationale: አኮ wird im fortlaufenden Zusammenhang als rhetorische Frage verstanden. „Anflehen“ bewahrt den persönlichen Sinn des inständigen Bittens und vermeidet die schwerfällige Wiedergabe „werdet ihr nicht diejenigen sein, die …“.
- source_word: ጽድቅ ዚአሁ
  choice: seine Gerechtigkeit
  rationale: „Gerechtigkeit“ kann im Deutschen sowohl Gottes moralische Rechtschaffenheit als auch sein gerechtes Gericht bezeichnen und erhält damit die Bedeutungsbreite des Ausdrucks.
- source_word: ዐቢይተ ወጽኑዓተ
  choice: große und harte Worte
  rationale: Die formal nahe Wiedergabe erhält die besondere henochische Redeweise; „harte“ kann hier zugleich schroffe, vermessene oder lästerliche Rede bezeichnen.
- source_word: አልብክሙ ሰላመ
  choice: ihr habt keinen Frieden
  rationale: Die knappe Gerichtsformel wird unmittelbar und in prophetisch würdigem Register wiedergegeben.
theological_decisions:
- issue: Funktion von አኮ in der Aussage über das Anflehen
  choice: 'rhetorische Frage: „werdet ihr ihn dann nicht anflehen?“'
  alternative: 'negative Feststellung: „ihr seid nicht imstande, ihn anzuflehen“'
  rationale: Die Partikel kann eine Verneinung oder eine rhetorische Frage einleiten. Der Zusammenhang der Fragen und die überlieferungsgeschichtliche Evidenz stützen hier die rhetorische Lesart, nach der die Gerichteten ihn tatsächlich anflehen werden.
- issue: Bedeutungsumfang von ጽድቅ
  choice: seine Gerechtigkeit
  alternative: sein Recht / seine Rechtschaffenheit
  rationale: Der Kontext ist richterlich, doch der Ausdruck kann über einen einzelnen Urteilsspruch hinaus Gottes moralische Richtigkeit bezeichnen. „Gerechtigkeit“ lässt diese Spannung offen.
- issue: Bezeichnung dessen, der den Zorn sendet
  choice: er
  alternative: Gott / der Herr
  rationale: Der ge’ezische Text nennt an dieser Stelle keinen ausdrücklichen Gottesnamen. Das Pronomen vermeidet eine erklärende Ergänzung, während der Kontext den Bezug erkennen lässt.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem prophetisch-apokalyptischem Klang. Die henochische Wendung „große und harte Worte“ bleibt bewusst formal erhalten. Die Satzfolge wahrt die rhetorische Frage und den anschließenden begründenden Vorwurf.
