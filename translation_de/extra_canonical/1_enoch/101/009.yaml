base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/009.yaml
  text: Do not those kings of the sea fear the sea[b][a], while sinners do not fear the Most High?
translation:
  language: de
  text: Fürchten nicht jene Könige der Schiffe[a] das Meer, während die Sünder den Höchsten nicht fürchten?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die äthiopische Wendung ist ungewöhnlich und textlich unsicher; wörtlich steht hier etwa »Könige der Schiffe«. Gemeint sein können Schiffsführer oder allgemein Seeleute.
    reason: textual_variant
lexical_decisions:
- source_word: አኮኑ
  choice: Fürchten nicht …?
  rationale: Leitet eine rhetorische Frage ein, die Zustimmung erwartet; im Deutschen wird die Frage natürlich durch die Verberststellung wiedergegeben.
- source_word: ውእቶሙ
  choice: jene
  rationale: Bewahrt den demonstrativen Sinn des Ausdrucks und bezieht ihn auf die folgende Personengruppe.
- source_word: ተነገሥተ አሕማር
  choice: Herren der Schiffe
  rationale: Gibt die schwierige, wohl wörtlich auf ‚Könige/Herrscher der Schiffe‘ zielende Wendung relativ formnah wieder, bleibt aber im Deutschen verständlicher als ‚Könige der Schiffe‘. Gemeint sein können Schiffsführer oder Seeleute; die Unsicherheit wird in der Fußnote offengelegt.
- source_word: ይፈርህዋ ለባሕር
  choice: das Meer fürchten
  rationale: Gibt das gewöhnliche Verb für ‚fürchten‘ und sein konkretes Objekt direkt wieder.
- source_word: ወኃጥኣን
  choice: während die Sünder
  rationale: Das verbindende ‚und‘ trägt hier im rhetorischen Zusammenhang einen deutlichen Gegensatz; ‚während‘ macht diesen Kontrast idiomatisch sichtbar.
- source_word: ለልዑል
  choice: den Höchsten
  rationale: Der Ausdruck fungiert als Gottesbezeichnung. ‚der Höchste‘ ist im Deutschen eine etablierte, würdevolle und semantisch genaue Wiedergabe.
- source_word: ኢይፈርህዎ
  choice: nicht fürchten
  rationale: Die Wiederholung desselben Verbs wie im ersten Satzteil wird beibehalten und stärkt so den beabsichtigten rhetorischen Gegensatz.
theological_decisions:
- issue: Wiedergabe von ልዑል als Gottesbezeichnung
  choice: der Höchste
  alternative: der Erhabene
  rationale: Der Kontext bezeichnet Gott durch einen Hoheitstitel. ‚Der Höchste‘ bewahrt den jüdisch-biblischen Sprachgebrauch, ohne zusätzliche dogmatische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die rhetorische Frage und die bewusste Wiederholung von »fürchten« bleiben erhalten. Die ungewöhnliche Schiffsbezeichnung wird nicht stillschweigend zu »Seeleute« vereindeutigt, sondern im Haupttext relativ formnah und in der Fußnote transparent wiedergegeben.
