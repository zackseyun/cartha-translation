base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/001.yaml
  text: Observe heaven[a], you sons of heaven, and every work of the Most High; and fear him[b], and do not do evil before him.
translation:
  language: de
  text: Betrachtet den Himmel[a], ihr Söhne des Himmels, und jedes Werk des Höchsten; fürchtet ihn und tut nichts Böses vor ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Beobachtet den Himmel und jedes Werk des Höchsten.“ Das zugrunde liegende Verb kann auch „fragen“ oder „sich erkundigen“ bedeuten; im Zusammenhang liegt jedoch „betrachten/beobachten“ näher.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ጠይቅዋ
  choice: Beobachtet
  rationale: Der Pluralimperativ wird im vorliegenden Zusammenhang als Aufforderung zum Beobachten bzw. Betrachten verstanden; dies entspricht dem kosmischen Anschauungszusammenhang und vermeidet die syntaktisch problematische Deutung „fragt“.
- source_word: ለሰማይ
  choice: den Himmel
  rationale: „Himmel“ bewahrt das kosmisch-apokalyptische Register; die Objektmarkierung wird im Deutschen durch den Akkusativ wiedergegeben.
- source_word: ውሉደ፡ ሰማይ
  choice: ihr Söhne des Himmels
  rationale: Die wörtliche und bewusst rätselhafte Anrede bleibt erhalten, ohne die Angesprochenen als Menschen oder himmlische Wesen festzulegen.
- source_word: ወኵሎ፡ ግብር፡ ለልዑል
  choice: und jedes Werk des Höchsten
  rationale: Die Konjunktion verbindet „den Himmel“ und „jedes Werk“ als parallele Gegenstände des Beobachtens; „Werk“ wahrt die breite Bedeutung von Tun, Wirken oder Geschaffenem.
- source_word: ወፍርሁ፡ እምኔሁ
  choice: fürchtet ihn
  rationale: Die knappe biblische Wendung lässt sowohl Furcht als auch ehrfürchtige Scheu anklingen.
- source_word: ወኢትግበሩ፡ እኩየ፡ በቅድሜሁ
  choice: und tut nichts Böses vor ihm
  rationale: Die Formulierung bewahrt sowohl das moralische Verbot als auch die Vorstellung des Handelns in Gottes Gegenwart.
theological_decisions:
- issue: Identität der „Söhne des Himmels“
  choice: Die wörtliche Anrede „ihr Söhne des Himmels“ bleibt stehen.
  alternative: „Kinder des Himmels“ oder interpretierend „ihr himmlischen Wesen“
  rationale: Der Ausdruck ist theologisch und rhetorisch mehrdeutig. Die Übersetzung soll nicht entscheiden, ob Menschen, Engelwesen oder eine metaphorisch bezeichnete Gruppe gemeint sind.
- issue: Bedeutungsumfang der Gottesfurcht
  choice: „fürchtet ihn“
  alternative: „habt Ehrfurcht vor ihm“
  rationale: „Fürchten“ erhält die Spannung zwischen Angst und Ehrfurcht, statt den Ausdruck ausschließlich als religiöse Verehrung auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst biblisch-apokalyptischem Klang. Die parallele Syntax des Ge’ez wird erhalten; die rätselhafte Anrede und die Mehrdeutigkeit von Gottesfurcht werden nicht interpretierend aufgelöst.
