base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/002.yaml
  text: If he shuts the windows of heaven[a], and withholds the rain and the dew so that it does not come down upon the earth because of you[c][b], what will you do?
translation:
  language: de
  text: Wenn er die Fenster des Himmels[a] verschließt und Regen und Tau zurückhält, sodass sie euretwegen nicht auf die Erde herabkommen – was werdet ihr tun?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Bild von den „Fenstern des Himmels“ gehört zur antiken Vorstellung von Öffnungen, durch die Regen aus dem Himmel kommt. Die Übersetzung bewahrt dieses Bild.
    reason: cultural_note
  - marker: b
    text: 'Die Schlussfrage ist rhetorisch und betont die Hilflosigkeit der Angesprochenen. Wörtlicher: „Was ist es, das ihr tun werdet?“'
    reason: lexical_alternative
lexical_decisions:
- source_word: እመ
  choice: Wenn
  rationale: Gibt die konditionale Einleitung ohne ein im Ausgangstext nicht vorhandenes „Und“ wieder.
- source_word: ዐፀወ
  choice: verschließt
  rationale: Bewahrt den konkreten Sinn des Schließens und verbindet sich im Deutschen natürlich mit den „Fenstern des Himmels“.
- source_word: መስኮተ ሰማይ
  choice: die Fenster des Himmels
  rationale: Erhält das alte kosmologische Bild und seine biblische Sprachprägung, statt es meteorologisch aufzulösen.
- source_word: ከለአ ዝናመ ወጠለ
  choice: Regen und Tau zurückhält
  rationale: „Zurückhält“ gibt das Verhindern beziehungsweise Vorenthalten wieder; Regen und Tau bleiben als zwei landwirtschaftlich bedeutsame Feuchtigkeitsquellen erhalten.
- source_word: ከመ ኢይረድ ዲበ ምድር
  choice: sodass sie nicht auf die Erde herabkommen
  rationale: Gibt Zweck beziehungsweise Folge des Zurückhaltens verständlich wieder. Das deutsche Pluralpronomen bezieht sich grammatisch auf Regen und Tau, obwohl das ge’ezische Verb formal im Singular steht.
- source_word: በእንቲአክሙ
  choice: euretwegen
  rationale: 'Bewahrt im Gerichtszusammenhang den kausalen Sinn: Das Ausbleiben des Niederschlags geschieht um der Angesprochenen willen beziehungsweise ihretwegen.'
- source_word: ሚሀለወክሙ ትግበሩ
  choice: was werdet ihr tun?
  rationale: Gibt die abschließende rhetorische Herausforderung knapp wieder, ohne ein erklärendes „dann“ hinzuzufügen.
theological_decisions:
- issue: Wer den Himmel verschließt
  choice: Das unausgesprochene Subjekt wird mit „er“ wiedergegeben.
  alternative: „Gott“ oder „der Herr“ ausdrücklich als Subjekt nennen.
  rationale: Der ge’ezische Text setzt ein männliches Singularsubjekt voraus, nennt es in diesem Vers aber nicht ausdrücklich. „Er“ wahrt die Syntax und lässt die im Zusammenhang erkennbare göttliche Urheberschaft unausgesprochen.
- issue: Bezug von „euretwegen“
  choice: „Euretwegen“ wird auf das Nicht-Herabkommen von Regen und Tau bezogen.
  alternative: Die Wendung allgemeiner auf das gesamte Verschließen und Zurückhalten beziehen.
  rationale: Die Stellung im ge’ezischen Satz legt den unmittelbaren Bezug zur ausbleibenden Herabkunft nahe, ohne einen weiteren Bezug auf die ganze Bedingung auszuschließen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die konkrete kosmologische Bildsprache bleibt erhalten; die rhetorische Frage wird knapp und ohne konfessionelle Ausdeutung formuliert.
