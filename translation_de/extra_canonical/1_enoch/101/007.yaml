base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/101/007.yaml
  text: And at his rebuke it will be afraid and dry up[a], and all its fish will die, and everything that is in it[c][b]. But you sinners who are upon the earth do not fear him.
translation:
  language: de
  text: Und bei seiner Zurechtweisung wird es sich fürchten und austrocknen,[a] und alle seine Fische werden sterben, ebenso alles, was darin ist. Ihr Sünder aber, die ihr auf der Erde seid, fürchtet ihn nicht.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das mit »es« bezeichnete Gewässer ist wahrscheinlich das Meer oder Wasser aus dem vorangehenden Vers. Im Ge'ez bleibt der Bezug unausgesprochen.
    reason: cross_reference
  - marker: b
    text: 'Wörtlich steht am Schluss ein maskulines Objektsuffix: »ihr fürchtet ihn nicht«. Es bezieht sich auf Gott, während die Formen für das Gewässer im übrigen Vers feminin sind.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በተግሣጹ
  choice: bei seiner Zurechtweisung
  rationale: Die Präposition በ bezeichnet hier den Umstand oder Anlass. Das Suffix -u ist maskulin Singular und verweist auf Gott; daher »seiner«, nicht »seiner/ihrer« bezogen auf das feminine Gewässer.
- source_word: ትፈርህ ወትየብስ
  choice: wird es sich fürchten und austrocknen
  rationale: Die beiden femininen Singularformen beziehen sich wahrscheinlich auf das Meer oder Gewässer des vorangehenden Zusammenhangs. Die Personifikation und die Abfolge der Gerichtswirkungen bleiben erhalten.
- source_word: ዓሣቲሃ ይመውት
  choice: alle seine Fische werden sterben
  rationale: Das feminine Possessivsuffix verweist auf das Gewässer. »sterben« gibt das konkrete ይመውት unmittelbar wieder.
- source_word: ኵሉ ዘሀሎ ውስቴታ
  choice: alles, was darin ist
  rationale: Die Wendung erweitert die Vernichtung über die Fische hinaus und wird in natürlichem, zugleich würdevollem Deutsch wiedergegeben.
- source_word: ኃጥኣን እለ ዲበ ምድር
  choice: ihr Sünder aber, die ihr auf der Erde seid
  rationale: »Sünder« bewahrt den zentralen moralischen Gegenbegriff des apokalyptischen Textes. Das ergänzte »aber« macht den im Kontext angelegten Kontrast im Deutschen deutlich.
- source_word: ኢትፈርህዎ
  choice: fürchtet ihn nicht
  rationale: Das Objektsuffix -wo ist maskulin Singular und verweist auf Gott. Die Form kann im deutschen Kontext als Feststellung der an die Sünder gerichteten Anklage wiedergegeben werden.
theological_decisions:
- issue: Referenten der unterschiedlichen Pronominalsuffixe
  choice: Gott ist der Referent von »seiner« und »ihn«; das Gewässer ist der Referent der femininen Verben und Possessivformen.
  alternative: Alle Pronomen auf das Meer beziehungsweise Gewässer beziehen.
  rationale: Das Ge'ez unterscheidet grammatisch zwischen maskulinen Suffixen bei der Zurechtweisung und beim abschließenden Objekt einerseits und femininen Formen für das reagierende Gewässer und seinen Inhalt andererseits.
- issue: Personifikation des Gewässers
  choice: Das Gewässer »fürchtet sich« und trocknet aus.
  alternative: 'Die Personifikation abschwächen, etwa: »es erbebt« oder »es wird ausgetrocknet«.'
  rationale: Die einfache Bedeutung von ትፈርህ ist Furcht; ihre Beibehaltung wahrt den rhetorischen Kontrast zwischen der auf Gottes Zurechtweisung reagierenden Schöpfung und den furchtlosen Sündern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Anrede »ihr Sünder« erhält den apokalyptischen Ernst; Gottespronomen werden gemäß dem allgemeinen Übersetzungsstil kleingeschrieben. Die grammatisch erkennbare Unterscheidung zwischen Gott und dem personifizierten Gewässer wird bewahrt.
