base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/026/003.yaml
  text: And I saw another mountain toward the east[a], higher than this one; and between them was a deep ravine, but not wide[d][c][b], and water was flowing in it toward the mountain.
translation:
  language: de
  text: Und ich sah nach Osten hin[a] einen weiteren Berg, der höher war als dieser[b]. Zwischen ihnen lag eine tiefe, aber nicht breite Schlucht, und darin floss Wasser auf den Berg zu.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich mit einem Wort für „Morgen“ oder „Morgendämmerung“; gemeint ist die Richtung des Sonnenaufgangs, also der Osten.
    reason: lexical_alternative
  - marker: b
    text: Das zugrunde liegende Wort kann auch „länger“, „größer“ oder „weiter ausgedehnt“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: Der letzte Satzteil ist schwer zu deuten. Am unmittelbarsten besagt der ge’ezische Text, dass sich Wasser in der Schlucht befand und sich „zum Berg hin“ bewegte.
    reason: textual_difficulty
lexical_decisions:
- source_word: መንገለ ጽባሕ
  choice: nach Osten hin
  rationale: ጽባሕ bezeichnet Morgen beziehungsweise Morgendämmerung und daraus abgeleitet den Osten. Die Wiedergabe vermeidet die nicht ausdrücklich belegte Präzisierung „Nordosten“ und passt zum Richtungsgebrauch im Zusammenhang.
- source_word: ካልአ ደብረ
  choice: einen weiteren Berg
  rationale: ካልአ kennzeichnet einen anderen beziehungsweise zweiten Gegenstand; „einen weiteren Berg“ ist im fortlaufenden Visionsbericht natürlich.
- source_word: ዘይነውኅ እምዝ
  choice: der höher war als dieser
  rationale: Das Verb kann Länge, Ausdehnung oder Größe bezeichnen. Bei miteinander verglichenen Bergen ist die Höhe im Kontext die naheliegendste räumliche Dimension, ohne dass die lexikalische Mehrdeutigkeit verschwiegen wird.
- source_word: ማእከሎሙ
  choice: zwischen ihnen
  rationale: Das pluralische Suffix verweist auf die beiden Berge und bezeichnet den Raum zwischen ihnen.
- source_word: ቈላ ዕሙቀ
  choice: eine tiefe Schlucht
  rationale: Die Verbindung bezeichnet eine tiefe Geländevertiefung. „Schlucht“ gibt die konkrete, markante Landschaft der Vision prägnant wieder.
- source_word: አልቦ ርሐበ
  choice: aber nicht breite
  rationale: Wörtlich liegt die Aussage „ohne Breite“ vor. „Nicht breit“ bleibt ihr eng verbunden und ergibt zusammen mit „tief“ einen verständlichen Gegensatz.
- source_word: ቦቱኒ ማይ
  choice: darin … Wasser
  rationale: Die Formulierung lokalisiert das Wasser in der Schlucht; die deutsche Satzstellung verbindet diese Ortsangabe natürlich mit dem folgenden Bewegungsverb.
- source_word: የሐውር መንገለ ደብር
  choice: floss … auf den Berg zu
  rationale: Das Verb bedeutet grundsätzlich gehen oder sich bewegen. Bei Wasser entspricht „fließen“ dem Zusammenhang; die ungewöhnliche Richtungsangabe zum Berg bleibt erhalten.
theological_decisions:
- issue: Konkrete oder symbolisch ausgedeutete Wiedergabe der visionären Landschaft
  choice: Berg, Schlucht und fließendes Wasser bleiben konkrete Bestandteile der geschauten Landschaft.
  alternative: Die Landschaft bereits in der Übersetzung symbolisch deuten oder zu einer allgemeinen Ortsangabe verflachen.
  rationale: Der Text entfaltet seine apokalyptische Bildwelt durch konkrete räumliche Erscheinungen. Eine mögliche symbolische Bedeutung darf nicht in die Übersetzung selbst eingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die konkrete visionäre Topografie und die ungewöhnliche Richtung des Wasserlaufs werden bewahrt; echte lexikalische Unsicherheiten stehen in knappen Fußnoten.
