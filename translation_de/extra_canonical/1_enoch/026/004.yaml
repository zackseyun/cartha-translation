base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/026/004.yaml
  text: And to the west of this was another[b][a],
translation:
  language: de
  text: Und westlich davon lag ein anderer[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht nur „ein anderer“; was gemeint ist, wird in diesem Vers nicht ausdrücklich genannt. Der Zusammenhang kann auf einen weiteren Berg weisen.
    reason: alternative_reading
lexical_decisions:
- source_word: መንገለ፡ ዐረቡ
  choice: westlich
  rationale: መንገለ fungiert hier wie in den vorausgehenden Versen als Richtungs- beziehungsweise Lageangabe, nicht als Substantiv „Weg“. Zusammen mit ዐረቡ bezeichnet die Wendung die Lage im Westen.
- source_word: ለዝ
  choice: davon
  rationale: Die Präposition mit dem Demonstrativ stellt den räumlichen Bezug zu dem zuvor genannten Gegenstand her; „davon“ ist im Deutschen die natürliche Entsprechung zu „von diesem“.
- source_word: ካልእ
  choice: ein anderer
  rationale: Das Wort bedeutet „ein anderer/weiterer“. Die substantivische Wiedergabe lässt das im Vers nicht wiederholte Bezugswort unausgesprochen und wahrt damit die Ellipse des ge'ezischen Textes.
theological_decisions:
- issue: Nicht ausdrücklich genannter Bezug von ካልእ in der Visionsbeschreibung
  choice: Das Bezugswort wird im Haupttext nicht ergänzt; übersetzt wird substantivisch mit „ein anderer“.
  alternative: „ein anderer Berg“ oder „etwas anderes“
  rationale: Der Zusammenhang kann einen weiteren Berg nahelegen, doch der vorliegende ge'ezische Vers nennt kein Substantiv. Die Übersetzung bewahrt diese Auslassung, ohne den möglichen Bezug auszuschließen.
translation_notes:
  register: Knappes, würdiges Standarddeutsch. „Lag“ gibt die topografische Lage natürlich wieder; die elliptische Formulierung des Ausgangstextes bleibt erhalten.
