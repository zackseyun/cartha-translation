  source_fidelity: 'Der Entwurf gibt die wesentlichen ge''ezischen Elemente zutreffend wieder: Enochs Sehen, den heiligen Berg, das Wasser aus dem Osten und dessen nordwärtigen Verlauf. „Unterhalb des Berges“ bezeichnet jedoch eher eine Lage am Fuß oder an der Seite des Berges, während መትሕተ ደብር unmittelbarer „unter dem Berg“/„unterhalb des Berges“ im Sinn von „darunter“ bedeutet. „Unter dem Berg“ wahrt die räumliche Aussage präziser.'
  naturalness: Der Satz ist im modernen Standarddeutsch verständlich und würdig. „Dessen Lauf nach Norden gerichtet war“ ist möglich, aber etwas schwerfällig; „dessen Lauf nach Norden führte“ ist idiomatischer. Die verblose ge'ezische Schlussfügung kann im Deutschen sinnvoll mit einem Verb wiedergegeben werden, sofern die Fußnote dies transparent macht.
  terminology: „Heiliger Berg“ bewahrt ቅዱሰ angemessen. „Wasser“ sollte nicht zu „Fluss“ oder „Bach“ präzisiert werden. „Lauf“ gibt ውሕዘቱ angemessen wieder und lässt offen, ob ein bestimmtes Gewässer gemeint ist.
