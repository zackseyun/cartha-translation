  - severity: low
    issue: Stil der Verlaufsangabe
    rationale: „Nach Norden gerichtet war“ ist verständlich, aber für den Lauf eines Wassers weniger idiomatisch als „nach Norden führte“.
  - severity: low
    issue: Grammatik der Fußnote
    rationale: „Wörtlicher lautet“ ist hier nicht idiomatisch; korrekt und klar ist „Wörtlich lautet der letzte Teil …“.
