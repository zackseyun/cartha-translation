base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/026/002.yaml
  text: And there I saw a holy mountain[a], and beneath the mountain water from the east, and its flow toward the north.
translation:
  language: de
  text: Und dort sah ich einen heiligen Berg und unter dem Berg Wasser aus dem Osten, dessen Lauf nach Norden führte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich lautet der letzte Teil: „Wasser aus dem Osten und sein Lauf nach Norden“; im Ge’ez steht in diesem Teil kein ausdrückliches Verb.'
    reason: Die Fußnote weist transparent darauf hin, dass „führte“ zur Bildung eines natürlichen deutschen Satzes ergänzt ist, ohne die knappe nominale Formulierung des Ausgangstextes zu verdecken.
lexical_decisions:
- source_word: ደብረ
  choice: Berg
  rationale: Das Substantiv bezeichnet gewöhnlich einen Berg oder ein Hochland; „Berg“ passt zur visionären Topografie und ist im Deutschen natürlich.
- source_word: ቅዱሰ
  choice: heilig
  rationale: Das Adjektiv bezeichnet etwas Geheiligtes beziehungsweise Abgesondertes und bewahrt hier das theologische Gewicht der Vision.
- source_word: መትሕተ ደብር
  choice: unterhalb des Berges
  rationale: Die Wendung gibt die räumliche Beziehung klar und in einem würdigen, modernen Register wieder.
- source_word: ማይ
  choice: Wasser
  rationale: Der Grundbegriff lautet „Wasser“. Die fließende Bewegung wird erst durch die folgende Wendung ausgedrückt und daher nicht vorwegnehmend als „Fluss“ oder „Bach“ übersetzt.
- source_word: እመንገለ ጽባሕ
  choice: aus dem Osten
  rationale: Die Phrase bezeichnet die Richtung des Ostens beziehungsweise Sonnenaufgangs; „aus dem Osten“ erhält den Herkunftssinn knapp und natürlich.
- source_word: ውሕዘቱ
  choice: dessen Lauf
  rationale: Die Form bezeichnet das Fließen oder den Verlauf des Wassers. „Lauf“ ist idiomatisch und wahrt den Bezug auf das zuvor genannte Wasser.
- source_word: መንገለ ሰሜን
  choice: nach Norden gerichtet
  rationale: Die Richtungsangabe bezeichnet eine nordwärts weisende Bewegung. Die Ergänzung „gerichtet war“ macht den nominalen ge'ezischen Ausdruck im Deutschen zu einem vollständigen und natürlichen Satz.
theological_decisions:
- issue: Wiedergabe von ቅዱሰ mit ausdrücklich theologischer Sprache
  choice: heiliger Berg
  alternative: heiliger/sakraler Berg beziehungsweise geweihter Berg
  rationale: In der henochischen Visionslandschaft gehört die Heiligkeit zur theologischen Bedeutung des Ortes. „Heilig“ bewahrt diese Aussage stärker und natürlicher als „sakral“ oder „geweiht“.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die ungewöhnliche Topografie und die Unbestimmtheit von „Wasser“ bleiben erhalten; lediglich die im Deutschen erforderliche Satzaussage wird behutsam ergänzt.
