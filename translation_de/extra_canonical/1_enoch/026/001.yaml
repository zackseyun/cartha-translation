base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/026/001.yaml
  text: And from there I went to the middle of the earth[a], and I saw a blessed place, shaded[c][b], in which there were trees with abiding and sprouting branches from a tree that had been cut down.
translation:
  language: de
  text: Und von dort ging ich zur Mitte der Erde und sah einen gesegneten, schattigen Ort.[a] Dort standen Bäume mit fortbestehenden und sprossenden Zweigen aus einem gefällten Baum.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der äthiopische Text ist in der botanischen Beschreibung schwierig. Wahrscheinlich ist ein schattiger Ort mit lebendigem Baumwuchs gemeint; Einzelheiten können auch anders gegliedert oder auf Zweige beziehungsweise Schösslinge bezogen werden.
    reason: lexical_alternative
  - marker: b
    text: Der letzte Satzteil beschreibt wahrscheinlich sprossende Triebe aus einem gefällten Baum. Wie die Zweige genau zu diesem Baum gehören, ist im überlieferten Text jedoch nicht völlig eindeutig.
    reason: textual_variant
lexical_decisions:
- source_word: ማእከለ ምድር
  choice: zur Mitte der Erde
  rationale: Die formnahe Wiedergabe bewahrt die kosmisch-geografische Sprache der Vision; „Erde“ passt hier besser als das örtlich begrenztere „Land“.
- source_word: መካነ ቡሩከ
  choice: einen gesegneten ... Ort
  rationale: Die Wendung bezeichnet einen durch Segen gekennzeichneten Ort, ohne ihn ausdrücklich mit Eden oder dem Paradies gleichzusetzen.
- source_word: ጥሉለ
  choice: schattigen
  rationale: Die eingeklammerte Lesart beschreibt den Ort wahrscheinlich als schattig; die Unsicherheit des schwierigen botanischen Textes wird in Fußnote [a] kenntlich gemacht.
- source_word: ዕፀወ / አዕፁቀ
  choice: Bäume mit Zweigen
  rationale: Die beiden botanischen Ausdrücke werden unterschieden, sodass der ausdrückliche Hinweis auf Bäume erhalten bleibt und die Zweige als deren lebender Austrieb erscheinen.
- source_word: ዘይነብር ወይሠርፅ
  choice: die fortbestanden und ... neu austrieben
  rationale: Die Verben drücken Fortdauer und hervorkommendes Wachstum aus; „neu austrieben“ gibt das Bild lebendiger Erneuerung natürlich wieder.
- source_word: እምዕፅ ዘተመተረ
  choice: aus einem gefällten Baum
  rationale: Die Formulierung bewahrt das anschauliche Bild von Wachstum, das aus einem zuvor umgehauenen Baum hervorgeht.
theological_decisions:
- issue: Gewöhnliche Landschaft oder symbolische heilige Geografie
  choice: Die konkrete visionäre Geografie bleibt mit „Mitte der Erde“ und „gesegneter ... Ort“ stehen, ohne allegorische Ausdeutung.
  alternative: Den Ort im Haupttext ausdrücklich als Eden oder Paradies bezeichnen.
  rationale: Der Vers trägt sakrale und möglicherweise symbolische Züge, benennt den Ort jedoch nicht. Die Übersetzung wahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erleichtert das Verständnis, ohne Elemente des äthiopischen Textes auszulassen. Die schwierige botanische Syntax wird lesbar wiedergegeben, während ihre echte Unsicherheit in den Fußnoten erhalten bleibt.
