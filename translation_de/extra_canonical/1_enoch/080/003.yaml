base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/003.yaml
  text: And in those times the fruit of the earth will be delayed[a], and it will not sprout in its season[d][c][b]; and the fruit of the trees will be withheld in its season.
translation:
  language: de
  text: Und in jenen Zeiten wird sich die Frucht der Erde verspäten[a] und nicht zu ihrer Zeit sprießen; und die Frucht der Bäume wird zu ihrer eigenen Zeit zurückgehalten werden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird verspätet sein“ beziehungsweise „wird spät kommen“. Das Ge’ez betont die Verzögerung gegenüber der vorgesehenen Zeit.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: „wird zu ihrer eigenen Zeit gehindert werden“ oder idiomatischer: „wird zu ihrer eigenen Zeit ausbleiben“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አዝማን
  choice: jenen Zeiten
  rationale: Der temporale Plural bleibt erhalten; „Zeiten“ wahrt den weiten apokalyptischen Rahmen, ohne ihn auf Tage oder landwirtschaftliche Jahreszeiten zu verengen.
- source_word: ፍሬ፡ ምድር
  choice: die Frucht der Erde
  rationale: Die konkrete landwirtschaftliche Bildsprache der ge’ezischen Genitivverbindung wird bewahrt; „Ertrag des Landes“ wäre idiomatischer, aber weniger bildnah.
- source_word: ደሓራዊ፡ ይከውን
  choice: wird sich … verspäten
  rationale: Gibt den Gedanken des Zu-spät-Seins gegenüber der vorgesehenen Zeit in natürlichem Deutsch wieder, ohne eine Ursache der Verzögerung festzulegen.
- source_word: ወኢይበቍል
  choice: und nicht … sprießen
  rationale: Das Verb bezeichnet das Hervorsprießen oder Austreiben; „sprießen“ passt zur landwirtschaftlichen Bildwelt und vermeidet das allgemeinere „wachsen“.
- source_word: በዘመኑ
  choice: zu ihrer Zeit
  rationale: Der Singularbezug auf die kollektiv verstandene „Frucht der Erde“ bleibt erhalten; die Formulierung bezeichnet den vorgesehenen Zeitpunkt beziehungsweise die vorgesehene Saison.
- source_word: ፍሬ፡ ዕፅ
  choice: die Frucht der Bäume
  rationale: ዕፅ kann Baum, Holz oder Pflanze bezeichnen; im landwirtschaftlichen Zusammenhang ist „Bäume“ am klarsten.
- source_word: ይትከላእ
  choice: wird … zurückgehalten werden
  rationale: Die passive Vorstellung des Gehindert- oder Zurückgehaltenwerdens wird bewahrt; das natürlichere „wird ausbleiben“ würde diese Nuance abschwächen.
- source_word: በዘመኑ፡ ዚአሁ
  choice: zu ihrer eigenen Zeit
  rationale: „eigenen“ bildet die emphatische possessive Wendung ዚአሁ ab; das feminine Singularpronomen richtet sich im Deutschen nach „Frucht“.
theological_decisions:
- issue: Art des Gerichtszeichens
  choice: Konkrete Störung der landwirtschaftlichen Fruchtbarkeit und ihres geordneten zeitlichen Ablaufs
  alternative: Bloße Beschreibung schlechter Ernten oder rein moralische Metapher
  rationale: Im astronomisch-apokalyptischen Zusammenhang erscheint die gestörte Ordnung der Zeiten als reales Zeichen; die Übersetzung lässt die landwirtschaftliche Bildsprache deshalb konkret stehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener apokalyptisch-landwirtschaftlicher Bildsprache. Die Satzstruktur folgt dem dreigliedrigen Aufbau des Ge’ez, ohne unnatürlich wörtlich zu werden.
