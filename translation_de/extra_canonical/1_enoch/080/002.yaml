base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/002.yaml
  text: And in the days of the sinners the years shall be shortened, and their seed shall be late upon their land and in their fields; and all the works that are on the earth shall change and shall not appear in their times, and the rain shall be withheld, and heaven shall hold back.
translation:
  language: de
  text: Und in den Tagen der Sünder werden die Jahre verkürzt werden, und ihr Same[a] wird auf ihrem Land und in ihren Feldern verspätet sein. Alle Werke auf der Erde werden sich verändern und nicht zu ihren Zeiten erscheinen[b], und der Regen wird zurückgehalten werden, und der Himmel wird den Regen zurückhalten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Same“ kann hier sowohl Saat beziehungsweise Ertrag als auch Nachkommenschaft bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Das Bild beschreibt eine kosmische und landwirtschaftliche Unordnung: Was zu seiner bestimmten Zeit erscheinen sollte, bleibt aus.'
    reason: cultural_note
lexical_decisions:
- source_word: መዋዕለ፡ ኃጥኣን
  choice: in den Tagen der Sünder
  rationale: Bewahrt die apokalyptische Zeitformel und den gerichtlichen Sinn von ኃጥኣን, ohne sie abzuschwächen.
- source_word: ክረማት፡ የኀጽሩ
  choice: die Jahre werden verkürzt werden
  rationale: Gibt die künftige Verkürzung des Jahres- beziehungsweise Zeitenlaufs formal wieder und passt zum Motiv kosmischer Unordnung.
- source_word: ዘርአ፡ ዚአሆሙ
  choice: ihr Same
  rationale: „Same“ erhält die mögliche Doppelbedeutung von Saat und Nachkommenschaft; der unmittelbare Zusammenhang mit Land und Feldern legt zugleich die landwirtschaftliche Bedeutung nahe.
- source_word: ዳኃራዊ
  choice: wird sich verspäten
  rationale: Natürliches modernes Deutsch für ein verspätetes Eintreten oder Hervorkommen; die Störung der vorgesehenen Zeiten bleibt deutlich.
- source_word: ኵሉ፡ ግብር፡ ዘዲበ፡ ምድር
  choice: alle Werke auf der Erde
  rationale: „Werke“ hält den Ausdruck weit und kann sowohl Vorgänge und Erzeugnisse als auch menschliches Wirken umfassen.
- source_word: ኢያስተርኢ፡ ለአዝማኖሙ
  choice: zu ihren Zeiten nicht erscheinen
  rationale: Bewahrt ausdrücklich den Plural „ihre Zeiten“ und das Motiv, dass die Dinge nicht zu den ihnen bestimmten Zeiten hervortreten.
- source_word: ዝናም፡ ይትከላእ
  choice: der Regen wird zurückgehalten werden
  rationale: Gibt die passive Aussage knapp wieder, ohne den Handelnden ausdrücklich zu bestimmen.
- source_word: ሰማይ፡ ታቀውም
  choice: der Himmel wird ihn zurückhalten
  rationale: Versteht den abschließenden Satz im Zusammenhang als weiteres Zurückhalten des Regens; das Pronomen macht die im Deutschen sonst unvollständige Aussage lesbar, während eine stärker wörtliche Alternative in der Fußnote genannt wird.
theological_decisions:
- issue: Bedeutung von „ihr Same“ im Zusammenhang landwirtschaftlicher Unordnung
  choice: „ihr Same“ als bewusst mehrdeutige Wiedergabe
  alternative: „ihre Nachkommen“ oder „ihre Saat“
  rationale: Land, Felder, Jahreszeiten und Regen sprechen für Saat oder Ertrag; das zugrunde liegende Wort kann jedoch auch Nachkommenschaft bezeichnen. Die Übersetzung entscheidet diese Spannung nicht vorschnell.
- issue: Handelnder beim Zurückhalten des Regens
  choice: Das Passiv bleibt im ersten Satzteil ohne ausdrücklich genannten Handelnden; anschließend wird der Himmel als zurückhaltend dargestellt.
  alternative: Gott ausdrücklich als Handelnden nennen
  rationale: Der Text nennt Gott hier nicht ausdrücklich. Eine Ergänzung würde eine theologische Deutung in den Wortlaut eintragen.
- issue: Bedeutung des abschließenden Verbs ታቀውም
  choice: als Zurückhalten des Regens verstanden
  alternative: „der Himmel wird stillstehen“
  rationale: Der unmittelbare Parallelismus mit dem zurückgehaltenen Regen stützt die gewählte Lesart, doch die Grundbedeutung des Verbs kann auch ein Stehen oder Stillstehen nahelegen; deshalb wird die Alternative dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptischem Klang. Die Zukunftsformen und die Wiederholung von „zurückhalten“ bewahren die feierliche Parallelstruktur. Mehrdeutigkeiten bei „Same“ und beim abschließenden Verb werden nicht stillschweigend aufgelöst, sondern im Text beziehungsweise in den Fußnoten offengelegt.
