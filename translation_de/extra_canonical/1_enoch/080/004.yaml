base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/004.yaml
  text: And the moon will alter its order[c][b][a], and it will not appear in its season.
translation:
  language: de
  text: Und der Mond[a] wird seine Ordnung[b] verändern, und zu seiner Zeit[c] wird er nicht erscheinen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das ge’ezische Wort kann sowohl »Mond« als auch »Monat« bedeuten; der Zusammenhang mit den Himmelskörpern spricht hier für »Mond«.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: »seinen geregelten Lauf«; wörtlicher: »seine Ordnung«.'
    reason: lexical_alternative
  - marker: c
    text: 'Oder: »in seiner Zeit« oder »zu seinem Zeitpunkt«. Die Wendung bezeichnet den ihm eigenen Zeitpunkt, ohne ausdrücklich »bestimmt« zu sagen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኅ
  choice: der Mond
  rationale: Das Wort kann »Mond« oder »Monat« bedeuten. Der Zusammenhang beschreibt jedoch das sichtbare Verhalten eines Himmelskörpers und spricht daher für »Mond«.
- source_word: ይዌልጥ
  choice: wird … verändern
  rationale: Das Verb bezeichnet eine Veränderung oder Abweichung; die Wiedergabe legt weder Ursache noch genaue Art der Veränderung fest.
- source_word: ሥርዓቶ
  choice: seine Ordnung
  rationale: Der Ausdruck bezeichnet eine geordnete oder festgelegte Regelung. »Ordnung« bewahrt im astronomischen Zusammenhang sowohl den Gedanken eines geregelten Ablaufs als auch die kosmische Dimension.
- source_word: ወኢይትረአይ
  choice: wird er nicht erscheinen
  rationale: Die Form betrifft das Gesehenwerden beziehungsweise Sichtbarwerden. Bei einem Himmelskörper ist »erscheinen« natürlich, während die konkrete Bedeutung der Sichtbarkeit erhalten bleibt.
- source_word: በዘመኑ ዚአሁ
  choice: zu seiner Zeit
  rationale: Die Wendung bedeutet wörtlich »in/zu seiner eigenen Zeit«. Diese knappe Wiedergabe wahrt die Wiederholung im Kontext und fügt den im Ausgangstext nicht ausdrücklich vorhandenen Begriff »bestimmt« nicht hinzu.
theological_decisions:
- issue: Astronomische Unregelmäßigkeit oder Störung der kosmischen Ordnung
  choice: Der Mond verändert »seine Ordnung« und erscheint nicht »zu seiner Zeit«.
  alternative: Nur seine Phase oder die Berechnung des Monats verändert sich.
  rationale: Die Formulierung lässt die astronomische Aussage und den Gedanken einer gestörten Ordnung nebeneinander bestehen, ohne ausdrücklich eine theologische Ursache hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hebt die gestörte zeitliche Regelmäßigkeit hervor. Die männlichen Pronomen beziehen sich eindeutig auf »der Mond«.
