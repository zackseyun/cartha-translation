base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/080/001.yaml
  text: And in those days Uriel the angel answered me and said to me[a], “Behold, I have shown you everything, Enoch, and I have revealed everything to you, that you may look upon this sun and this moon and those who lead the stars of heaven[c][b], and all those who turn them—their works and their times and their risings.”
translation:
  language: de
  text: 'Und in jenen Tagen antwortete mir der Engel Uriel und sagte zu mir: „Sieh, ich habe dir alles gezeigt, Henoch, und dir alles enthüllt, damit du diese Sonne und diesen Mond siehst sowie diejenigen, die die Sterne des Himmels führen, und alle, die sie wenden: ihre Tätigkeiten, ihre Zeiten und ihre Untergänge.[a]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „ihre Eingänge“. Gemeint sind im astronomischen Bild des Buches ihre Untergänge, wenn die Himmelskörper in die westlichen Tore eintreten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ
  choice: antwortete mir
  rationale: Bewahrt den üblichen Sinn des Verbs als »antworten/erwidern«, auch wenn im unmittelbaren Vers keine Frage steht.
- source_word: ነዋ
  choice: Sieh
  rationale: Gibt die aufmerksamkeitslenkende Partikel unmittelbar und in gegenwärtigem, würdigem Deutsch wieder.
- source_word: አርአይኩከ
  choice: ich habe dir alles gezeigt
  rationale: Die visuell-kausative Bedeutung und die gegenwärtige Relevanz der abgeschlossenen Unterweisung bleiben erhalten.
- source_word: ከሠትኩ ለከ
  choice: dir alles enthüllt
  rationale: »Enthüllt« wahrt den Gedanken des Offenlegens und passt zum apokalyptischen Zusammenhang, ohne zusätzliche Deutung einzutragen.
- source_word: ትርአዮ
  choice: damit du ... siehst
  rationale: Gibt die Zweck- beziehungsweise Folgebeziehung natürlich wieder.
- source_word: ይመርኅዎሙ
  choice: führen
  rationale: Bewahrt die personale Konstruktion und das Bild, dass die Sterne von handelnden Wesen geführt werden.
- source_word: ከዋክብተ ሰማይ
  choice: die Sterne des Himmels
  rationale: Direkte, gehobene und im Deutschen natürliche Wiedergabe der Genitivverbindung.
- source_word: ይመይጥዎሙ
  choice: sie wenden
  rationale: Hält die Bewegungs- und Wendungsbildlichkeit offen, ohne moderne Himmelsmechanik einzutragen.
- source_word: ግብሮሙ
  choice: ihre Tätigkeiten
  rationale: Im astronomischen Zusammenhang bezeichnet der Ausdruck eher Funktionen oder Wirksamkeiten; »Tätigkeiten« bleibt verständlich und wahrt zugleich die personale Darstellung.
- source_word: አዝማኖሙ
  choice: ihre Zeiten
  rationale: Direkte Wiedergabe, die weder »Jahreszeiten« noch »festgesetzte Zeiten« interpretierend voraussetzt.
- source_word: ሙባኢሆሙ
  choice: ihre Untergänge
  rationale: Das von der Wurzel »eintreten« gebildete Substantiv bezeichnet im astronomischen System das Eingehen in die westlichen Tore, also die Untergänge, nicht die Aufgänge.
theological_decisions:
- issue: Identität der mit den Himmelskörpern verbundenen Handelnden
  choice: 'Personale Relativsätze: »die ... führen« und »die sie wenden«'
  alternative: Unpersönliche Naturgesetze oder bloße Bewegungsabläufe
  rationale: Der ge'ezische Text spricht von Handelnden. Diese apokalyptische Kosmologie wird bewahrt, ohne die Wesen näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht erhöhtem apokalyptischem Ton. Die personale kosmische Bildsprache bleibt erhalten; der astronomische Fachsinn von ሙባኢሆሙ wird als »Untergänge« wiedergegeben.
