base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/012.yaml
  text: All who do not sleep in the heights of heaven shall bless him[a]; all the holy ones who are in heaven shall bless him, and all the chosen ones who dwell in the garden of life; and every spirit of light that is able to bless and glorify and exalt and sanctify your blessed name[d][c][b]; and all flesh shall exceedingly and with power praise and bless your name forever and ever.
translation:
  language: de
  text: Alle, die in den Höhen des Himmels nicht schlafen, werden ihn segnen[a]; alle Heiligen, die im Himmel sind, werden ihn segnen, und alle Erwählten, die im Garten des Lebens wohnen; und jeder Geist des Lichts, der deinen gesegneten Namen segnen, verherrlichen, erhöhen und heiligen kann; und alles Fleisch wird deinen Namen überaus und mit Macht loben und segnen für immer und ewig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit »die nicht schlafen« sind wahrscheinlich wache himmlische Wesen gemeint, die unablässig ihren Dienst versehen, nicht lediglich besonders wachsame Menschen.
    reason: cultural_note
lexical_decisions:
- source_word: ይባርክዎ / ትባርክ
  choice: ihn segnen / deinen Namen segnen
  rationale: Die wiederholte Segenswurzel prägt den liturgischen Aufbau. Das Suffix der ersten beiden Formen bezeichnet »ihn«; später wechselt der Text ausdrücklich zur zweiten Person.
- source_word: እለ ኢይነውሙ
  choice: die nicht schlafen
  rationale: Die vergleichsweise formale Wiedergabe bewahrt das apokalyptische Bild der ständig wachen himmlischen Wesen, ohne das stärkere »niemals« einzutragen.
- source_word: በመልዕልተ ሰማይ
  choice: in den Höhen des Himmels
  rationale: Die räumliche Höhenvorstellung bleibt erhalten, ohne einen bestimmten kosmologischen Rang wie den »höchsten Himmel« festzulegen.
- source_word: ቅዱሳን
  choice: Heiligen
  rationale: Die Bezeichnung bleibt offen und wird nicht ausdrücklich auf Engel oder Menschen eingegrenzt.
- source_word: ኅሩያን
  choice: Erwählten
  rationale: Der zentrale henochische Ausdruck wird knapp und ohne spätere dogmatische Präzisierung wiedergegeben.
- source_word: ገነት ሕይወት
  choice: Garten des Lebens
  rationale: Diese Wiedergabe bewahrt unmittelbar das Gartenbild des Ge'ez und vermeidet zusätzliche Traditionsassoziationen von »Paradies«.
- source_word: መንፈሰ ብርሃን
  choice: Geist des Lichts
  rationale: Die direkte Wiedergabe erhält die kosmische Bildsprache.
- source_word: ዘትክል
  choice: der … kann
  rationale: Die Form bezeichnet Fähigkeit oder Eignung; »kann« ist im Deutschen natürlich und zurückhaltend.
- source_word: ባርኮተ ወሰብሖተ ወአልዕሎተ ወቀድሶተ
  choice: segnen, verherrlichen, erhöhen und heiligen
  rationale: Die viergliedrige doxologische Reihe bleibt vollständig und in ihrer gehobenen Kadenz erhalten.
- source_word: ለስምከ ቡሩክ
  choice: deinen gesegneten Namen
  rationale: Die Konstruktion wird am natürlichsten als Qualifizierung des Namens verstanden.
- source_word: ኵሉ ሥጋ
  choice: alles Fleisch
  rationale: Die gewichtige biblisch-apokalyptische Wendung bleibt erhalten und wird nicht zu »alle Geschöpfe« verallgemeinert.
- source_word: ፈድፋደ እምኃይል
  choice: überaus und mit Macht
  rationale: Die Ausdrücke werden entsprechend ihrer wahrscheinlich adverbialen Funktion auf die folgenden Verben bezogen.
- source_word: ትሴብሕ
  choice: loben
  rationale: Im letzten Satzglied gibt »loben« das betreffende Preisverb wieder und unterscheidet es von dem zuvor stehenden »verherrlichen«.
- source_word: ለዓለመ ዓለም
  choice: für immer und ewig
  rationale: Die geläufige feierliche Formel bewahrt die intensivierte Ewigkeitsaussage.
theological_decisions:
- issue: Identität der Heiligen und Erwählten
  choice: Beide Gruppen werden benannt, ohne ihre Identität näher zu bestimmen.
  alternative: Die Heiligen ausschließlich als Engel und die Erwählten ausschließlich als erlöste Menschen bestimmen.
  rationale: Die visionäre Aufzählung erzwingt keine eindeutige ontologische Zuordnung; die Spannung bleibt daher bestehen.
- issue: Pronomenwechsel im Gotteslob
  choice: Zunächst »ihn«, danach »deinen … Namen«.
  alternative: Den ganzen Vers einheitlich in der zweiten Person wiedergeben.
  rationale: Das Ge'ez wechselt tatsächlich von einem Objekt der dritten Person zur direkten Anrede; dieser auffällige Wechsel darf nicht harmonisiert werden.
- issue: Garten- oder Paradiesbegriff
  choice: Garten des Lebens
  alternative: Paradies des Lebens
  rationale: Das Gartenbild entspricht der Ausgangsformulierung unmittelbarer und trägt keine unnötige spätere Terminologie ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit liturgisch-doxologischem Klang. Die lange Reihung und der Wechsel von »ihn« zu »deinen« bleiben als Merkmale des Ausgangstextes erhalten; die schwierige Kraftformel wird natürlich, aber quellentreu adverbial wiedergegeben.
