  terminology: »Heilige« und »Erwählte« bleiben ohne konfessionell oder ontologisch einengende Deutung offen. »Geist des Lichts«, »Garten des Lebens« und »deinen gesegneten Namen« sind quellentreu und terminologisch konsistent. Die Fußnote ist korrekt an »die nicht schlafen« verankert und erläutert zurückhaltend, ohne die Identität der Gruppe festzulegen.
