  terminology: ‚Maße‘, ‚Gerechte‘ und ‚Herr der Geister‘ sind sachgerecht. ‚Schnüre‘ wahrt die lexikalische Breite von ማእሰረ besser als ‚Messschnüre‘; der Messkontext kann bei Bedarf in einer Anmerkung erläutert werden, ohne ihn in den Text einzutragen.
