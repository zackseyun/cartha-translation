base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/003.yaml
  text: And the angel who went with me said to me[a], “These are the measures of the righteous and the cords of the righteous; they will come to the righteous[d][c][b], so that they may rely on the name of the Lord of Spirits forever and ever.”
translation:
  language: de
  text: 'Und der Engel, der mit mir ging, sagte zu mir: „Dies sind die Maße der Gerechten und die Schnüre der Gerechten; sie werden zu den Gerechten kommen[a], damit die Gerechten sich für immer und ewig auf den Namen des Herrn der Geister stützen[b].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sie kommen zu den Gerechten“. Die Verbform kann je nach Zusammenhang gegenwärtig oder zukünftig verstanden werden.'
    reason: tense_aspect_ambiguity
  - marker: b
    text: 'Oder: „damit die Gerechten auf den Namen des Herrn der Geister vertrauen“ beziehungsweise „durch den Namen Halt finden“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ዘምስሌየ የሐውር
  choice: der mit mir ging
  rationale: Die Relativkonstruktion mit dem Verb des Gehens bezeichnet natürlich den begleitenden Engel und bewahrt die wiederkehrende Henoch-Formel.
- source_word: እምጣነ ጻድቃን
  choice: die Maße der Gerechten
  rationale: እምጣነ ist hier als Plural-Konstrukt von „Maß“ zu verstehen, nicht als Präposition „von/aus“ mit einem folgenden Substantiv. Der Rückbezug auf den Vorgang des Messens in 61,1–2 wird dadurch gewahrt.
- source_word: ማእሰረ ጻድቃን
  choice: die Messschnüre der Gerechten
  rationale: Das Substantiv bezeichnet Schnüre, Stricke oder Bänder. „Messschnüre“ macht im unmittelbaren Kontext die Funktion deutlich, ohne das Bild durch „Vorratskammern“ zu verfälschen.
- source_word: ይመጽኡ ለጻድቃን
  choice: sie werden zu den Gerechten kommen
  rationale: Die Imperfektform wird zukunftsbezogen wiedergegeben; die Dativkonstruktion bezeichnet hier die Richtung beziehungsweise Zuordnung zu den Gerechten.
- source_word: ከመ ይትመረጐዙ
  choice: damit diese sich … stützen
  rationale: Die reflexiv-passive Verbform vermittelt das Bild, Halt oder Festigkeit an etwas zu finden. „Sich stützen auf“ bewahrt dieses Bild und lässt zugleich die Nuance des Vertrauens anklingen.
- source_word: ስሙ ለእግዚአ መናፍስት
  choice: den Namen des Herrn der Geister
  rationale: „Herr der Geister“ wird als charakteristischer Titel des Henochbuches beibehalten.
- source_word: ለዓለመ ዓለም
  choice: für immer und ewig
  rationale: Die feierliche Dauerformel wird in geläufigem, würdigem Deutsch wiedergegeben.
theological_decisions:
- issue: Bezug des Subjekts im Zwecksatz
  choice: „diese“ bezieht sich auf die Gerechten
  alternative: Das grammatische Subjekt könnte formal mit den Maßen und Schnüren verbunden werden.
  rationale: Inhaltlich ist am ehesten gemeint, dass die Gerechten am göttlichen Namen Halt finden. Die Formulierung vermeidet dennoch eine weitergehende dogmatische Ausdeutung.
- issue: Nuance von ይትመረጐዙ
  choice: sich auf den Namen stützen
  alternative: auf den Namen vertrauen oder durch den Namen gestärkt werden
  rationale: Das konkrete Bild des Sich-Stützens wahrt die semantische Breite zwischen Halt, Stärkung und Vertrauen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die konkrete Bildsprache des Messens und der Schnüre wird im Anschluss an 61,1–2 bewahrt; altertümliche Satzformen und konfessionell geprägte Vertrauensformeln werden vermieden.
