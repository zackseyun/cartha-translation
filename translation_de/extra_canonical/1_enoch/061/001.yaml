base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/001.yaml
  text: And I saw in those days that long cords were given to those angels[a], and they took for themselves wings and flew[b], and they went toward the north.
translation:
  language: de
  text: 'Und ich sah in jenen Tagen: Jenen Engeln[b] wurden lange Seile[a] gegeben. Sie nahmen sich Flügel, flogen und zogen nach Norden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der mit »lange Seile« wiedergegebene ge’ezische Ausdruck kann auch »lange Stricke« oder, spezieller, »Messschnüre« bedeuten.
    reason: lexical_alternative
  - marker: b
    text: »Jenen Engeln« kann je nach Verständnis des Demonstrativums auch mit »den anderen Engeln« wiedergegeben werden.
    reason: alternative_reading
lexical_decisions:
- source_word: ወርኢኩ
  choice: Und ich sah
  rationale: Bewahrt die übliche Ich-Formel des visionären Berichts in klarem, gehobenem Gegenwartsdeutsch.
- source_word: በእማንቱ መዋዕል
  choice: in jenen Tagen
  rationale: Entspricht der wiederkehrenden apokalyptischen Zeitformel und wahrt ihren würdevollen Klang.
- source_word: ወተውህበ
  choice: wurden gegeben
  rationale: Gibt die passive Form wieder; im Deutschen richtet sich der Plural nach »lange Seile«.
- source_word: ለአልእቱ መላእክት
  choice: jenen Engeln
  rationale: »Engel« ist im apokalyptischen Zusammenhang die naheliegende Bedeutung; das Demonstrativum wird ohne zusätzliche Identifizierung wiedergegeben.
- source_word: አሕባል ነዋኃን
  choice: lange Seile
  rationale: Gibt das konkrete Bild und das Längenmerkmal natürlich wieder, ohne die mögliche Funktion als Messschnüre in den Haupttext einzutragen.
- source_word: ወነሡአ ሎሙ ክንፈ
  choice: Sie nahmen sich Flügel
  rationale: Bewahrt die reflexive Nuance von ሎሙ und das auffällige Bild des Ausgangstextes.
- source_word: ወሰረሩ
  choice: flogen
  rationale: Die schlichte Bewegungsangabe passt unmittelbar zu den Flügeln und vermeidet eine unbelegte Verstärkung wie »schwebten empor«.
- source_word: ወሖሩ ሰመንገለ መስዕ
  choice: zogen nach Norden
  rationale: Gibt die gerichtete Bewegung idiomatisch wieder, ohne zwingend einen endgültigen Zielpunkt festzulegen.
theological_decisions:
- issue: Identität der Engel
  choice: »jenen Engeln« ohne nähere Bestimmung
  alternative: »den anderen Engeln« oder eine Deutung als besondere Gerichtsengel
  rationale: Der Vers selbst benennt keine bestimmte Engelgruppe. Eine weitergehende Identifizierung würde Deutung aus dem Kontext in den Wortlaut eintragen.
- issue: Bedeutung der Seile
  choice: Im Haupttext allgemein »lange Seile«
  alternative: »lange Messschnüre«
  rationale: Eine Messfunktion ist möglich, aber im Ausdruck selbst nicht eindeutig festgelegt; die Spannung bleibt durch die Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter apokalyptischer Erzählformel. Der Doppelpunkt erhält die parataktische Wirkung des Ge’ez, ohne einen im Ausgangstext nicht ausdrücklich markierten dass-Satz einzuführen. Die Fußnotenmarker stehen jeweils unmittelbar bei dem Ausdruck, auf den sie sich beziehen.
