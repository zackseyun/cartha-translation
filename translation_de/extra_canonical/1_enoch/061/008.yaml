base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/008.yaml
  text: And the Lord of Spirits seated the Chosen One on the throne of glory[a], and he will judge all the works of the holy ones in the height of heaven[d][c][b], and he will weigh their deeds in the balance.
translation:
  language: de
  text: Und der Herr der Geister setzte den Erwählten auf den Thron der Herrlichkeit[a]. Er wird alle Werke der Heiligen in der Höhe des Himmels[b] richten und ihre Taten auf der Waage wägen[c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „den Auserwählten“. Das ge’ezische ኅሩይ bezeichnet hier eine bestimmte erwählte Gestalt und hat titelartigen Charakter.'
    reason: lexical_alternative
  - marker: b
    text: „Die Heiligen“ kann die heilige Gemeinschaft, himmlische heilige Wesen oder beide umfassen; der ge’ezische Wortlaut grenzt die Bezeichnung nicht weiter ein.
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich ist vom Wägen auf einer Waage die Rede, einem Bild für gerichtliche Prüfung und Bewertung. Das Verb steht aktiv: „er wird wägen“.'
    reason: grammar_and_cultural_note
lexical_decisions:
- source_word: እግዚአ መናፍስት
  choice: der Herr der Geister
  rationale: Die feste Gottesbezeichnung in den Bilderreden wird würdevoll und konstruktionsnah wiedergegeben.
- source_word: መንበረ ስብሐት
  choice: der Thron der Herrlichkeit
  rationale: Bewahrt das konkrete Thronbild und die biblisch-apokalyptische Bedeutung von Herrlichkeit.
- source_word: አንበረ ለኅሩይ
  choice: setzte den Erwählten
  rationale: „Setzte“ gibt den kausativen Sinn des Verbs natürlich wieder; „der Erwählte“ kennzeichnet ኅሩይ als Titel einer bestimmten Gestalt.
- source_word: ይኴንን ኵሎ ግብሮሙ
  choice: wird alle Werke … richten
  rationale: Die Zukunftsform und der gerichtliche Sinn bleiben erhalten; „Werke“ unterscheidet den ersten Ausdruck vom späteren Wort für Taten bzw. Lebensführung.
- source_word: ለቅዱሳን
  choice: der Heiligen
  rationale: Die Formulierung lässt offen, ob die heilige Gemeinschaft, himmlische Wesen oder beide gemeint sind, und vermeidet die Einengung auf eine bestimmte Gruppe.
- source_word: በመልዕልተ ሰማይ
  choice: in der Höhe des Himmels
  rationale: Eine quellennähere Wiedergabe, welche die erhöhte räumliche Vorstellung bewahrt, ohne daraus ausdrücklich den „höchsten Himmel“ zu machen.
- source_word: በመዳልው ይደሉ ምግባሮሙ
  choice: ihre Taten auf der Waage wägen
  rationale: Gibt die aktive Verbform der dritten Person Singular und das Bild gerichtlicher Abwägung wieder; „Taten“ vermeidet eine unnötige Wiederholung von „Werke“.
theological_decisions:
- issue: Identität der mit ለቅዱሳን bezeichneten Heiligen
  choice: „der Heiligen“ ohne nähere Bestimmung
  alternative: „der Frommen“, „der Gerechten“ oder „der heiligen Engel“
  rationale: Der äthiopische Wortlaut legt nicht eindeutig fest, ob Menschen, himmlische Wesen oder beide gemeint sind. Die Übersetzung erhält diese Spannung.
- issue: Titel ለኅሩይ
  choice: „den Erwählten“ als bestimmter Titel
  alternative: „den Auserwählten“ oder „einen Erwählten“
  rationale: Kontext und Syntax weisen auf eine bestimmte, bereits bekannte Gestalt hin. „Der Erwählte“ ist im Deutschen knapp, verständlich und titelartig.
- issue: Subjekt des Wägens
  choice: aktive Wiedergabe mit „er“ als fortgeführtem Subjekt
  alternative: „ihre Taten werden auf der Waage gewogen“
  rationale: Die ge’ezische Verbform ist aktiv, dritte Person maskulin Singular. Die Übersetzung bewahrt daher die handelnde Richtergestalt, ohne deren Identität über den syntaktischen Bezug hinaus dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptisch-biblischem Ton. Die Satzteilung verbessert die Lesbarkeit, ohne die Abfolge der ge’ezischen Aussagen zu verändern. „Wägen“ wird gegenüber dem alltäglicheren „wiegen“ gewählt, weil es die bildliche Bedeutung des prüfenden Abwägens klarer trägt.
