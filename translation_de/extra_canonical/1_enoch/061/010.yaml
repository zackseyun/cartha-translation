base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/010.yaml
  text: And all the hosts of the heavens shall cry out[a], and all the holy ones above, and the host of the Lord—the Keruben, the Seraphen, and the Ophannin—and all the angels of power, and all the angels of principalities, and the Chosen One[d][c][b], and the other powers that are on the dry land and over the water.
translation:
  language: de
  text: Und alle Heerscharen der Himmel werden laut rufen[a], ebenso alle Heiligen in der Höhe und die Heerschar des Herrn – die Keruben, die Serafen und die Ofannin[b] –, alle Engel der Macht, alle Engel der Herrschaften[c], der Erwählte[d] und die anderen Mächte, die auf dem trockenen Land und über dem Wasser sind.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden aufschreien“ beziehungsweise „werden laut ausrufen“. Das geʿezische Verb bezeichnet einen hörbaren Ausruf.'
    reason: lexical_alternative
  - marker: b
    text: „Ofannin“ ist der Name einer himmlischen Ordnung. Im Zusammenhang mit Thronvisionen wird der Ausdruck auch als „Räder“ gedeutet.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „Engel der Herrschaftsgewalten“. Gemeint sind offenbar regierende Ordnungen oder Ränge; auch „Herrschaftsbereiche“ ist möglich.'
    reason: lexical_alternative
  - marker: d
    text: „Der Erwählte“ ist hier als Titel zu verstehen. Möglich ist auch die Wiedergabe „der Auserwählte“.
    reason: theological_ambiguity
lexical_decisions:
- source_word: ይጼውዑ
  choice: werden laut rufen
  rationale: Das Verb bezeichnet ein hörbares Rufen oder Aufschreien. „Laut rufen“ gibt dies unmittelbar wieder und vermeidet die in 61,11 eigens ausgedrückte Wendung „die Stimme erheben“.
- source_word: ኵሉ ኃይለ ሰማያት
  choice: alle Heerscharen der Himmel
  rationale: ኃይል kann Macht, Kraft oder Heerschar bedeuten. Im Katalog himmlischer Wesen ist die kollektive Bedeutung „Heerscharen“ naheliegend; der Plural „Himmel“ bewahrt ሰማያት.
- source_word: ቅዱሳን በመልዕልተ
  choice: alle Heiligen in der Höhe
  rationale: Die Wendung bezeichnet heilige himmlische Wesen. „In der Höhe“ ist natürliches, würdevolles Deutsch und vermeidet eine unnötige Festlegung auf menschliche Heilige.
- source_word: ኃይለ እግዚአብሔር
  choice: die Heerschar des Herrn
  rationale: Der unmittelbare Zusammenhang nennt himmlische Ordnungen; daher ist die kollektive Lesart wahrscheinlicher als die abstrakte „Macht des Herrn“.
- source_word: ኪሩቤን / ሱራፌን / እፋኒን
  choice: Keruben / Serafen / Ofannin
  rationale: Die Namen der himmlischen Ordnungen werden in ge’eznahen, für deutsche Leser aussprechbaren Formen wiedergegeben, statt sie deutend zu übersetzen oder vollständig an hebräisch geprägte Traditionsformen anzugleichen.
- source_word: መላእክተ ኃይል
  choice: Engel der Macht
  rationale: Die formale Genitivverbindung erhält den Charakter einer benannten Engelordnung und lässt offen, ob „Macht“ Rang, Bereich oder Eigenschaft bezeichnet.
- source_word: መላእክተ አጋእዝት
  choice: Engel der Herrschaften
  rationale: Der Ausdruck weist auf regierende Gewalten oder Rangordnungen. „Herrschaften“ bewahrt den titularen, kosmischen Sinn, ohne die Engel schlicht als weltliche „Herrscher“ zu bezeichnen.
- source_word: ኅሩይ
  choice: der Erwählte
  rationale: In den Bilderreden ist dies eine wiederkehrende Bezeichnung der eschatologischen Gestalt. Der bestimmte Artikel und die Großschreibung kennzeichnen den Titel, ohne eine weitergehende christologische Identifizierung einzutragen.
- source_word: ካእአ ኃይል
  choice: die anderen Mächte
  rationale: ካእአ führt eine weitere Gruppe ein; „Mächte“ erhält die absichtlich weite und etwas rätselhafte Bedeutung von ኃይል.
- source_word: እለ ውስተ የብስ ወዲበ ማይ
  choice: die auf dem trockenen Land und über dem Wasser sind
  rationale: የብስ bezeichnet ausdrücklich das trockene Land im Gegensatz zum Wasser. Die unterschiedlichen Präpositionen werden mit „auf“ und „über“ sichtbar gehalten.
theological_decisions:
- issue: Ist ኅሩይ ein Titel der einzelnen endzeitlichen Gestalt oder nur ein allgemeines Adjektiv?
  choice: der Erwählte
  alternative: ein Erwählter / der Auserwählte als bloße Beschreibung
  rationale: Der Sprachgebrauch der Bilderreden stützt die titular gebrauchte Einzahl. Die Übersetzung wahrt diese lokale Funktion, ohne die Gestalt mit einer späteren dogmatischen Bezeichnung gleichzusetzen.
- issue: Wie sollen die himmlischen Ordnungen wiedergegeben werden?
  choice: 'ge’eznahe Namensformen: Keruben, Serafen, Ofannin'
  alternative: 'Cherubim, Seraphim, Ophanim; oder deutend: Räder'
  rationale: Die Namensformen bewahren die besondere Gestalt des ge’ezischen Zeugnisses und die Fremdheit des apokalyptischen Katalogs. Eine Deutung der Ofannin als „Räder“ bleibt der Fußnote vorbehalten.
- issue: Bezeichnet ኃይለ እግዚአብሔር eine Gruppe oder eine göttliche Eigenschaft?
  choice: die Heerschar des Herrn
  alternative: die Macht des Herrn
  rationale: Die anschließende Aufzählung von Keruben, Serafen und Ofannin begünstigt eine kollektive Lesart. Die abstrakte Lesart ist grammatisch möglich, passt jedoch weniger gut zur Struktur des Katalogs.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange Aufzählung bleibt erhalten, wird aber durch „ebenso“ und Gedankenstriche syntaktisch gegliedert. Die ungewohnten Namen der himmlischen Ordnungen bleiben bewusst fremdartig; erklärende Deutungen stehen nur in den Fußnoten.
