base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/011.yaml
  text: On that day they shall raise one voice[a], and they shall bless and praise and exalt in the spirit of faith, and in the spirit of wisdom, and in the spirit of patience, and in the spirit of mercy, and in the spirit of righteousness and peace, and in the spirit of goodness; and all of them shall say with one voice, ‘Blessed be he[e][d][c][b], and blessed be the name of the Lord of Spirits forever and ever.’
translation:
  language: de
  text: 'An jenem Tag werden sie gemeinsam ihre Stimme erheben[a]; sie werden segnen, preisen und erhöhen im Geist des Glaubens[b], im Geist der Weisheit, im Geist der Geduld, im Geist des Erbarmens, im Geist der Gerechtigkeit und des Friedens und im Geist der Güte[c]. Und sie alle werden mit einer Stimme sagen: »Gesegnet sei er, und gesegnet sei der Name des Herrn der Geister für immer und ewig.«[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „eine Stimme erheben“; gemeint ist der gemeinsame, einmütige Ruf.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Geist der Treue“ beziehungsweise „der Glaubenstreue“. Das Ge''ez-Wort kann Glauben und Treue bezeichnen.'
    reason: lexical_alternative
  - marker: c
    text: Auch „Freundlichkeit“ oder „Wohlwollen“. Die wiederholte Wendung „Geist des …“ kann eine Haltung des Lobpreises, verliehene Eigenschaften oder stärker personifiziert gedachte himmlische Gaben bezeichnen.
    reason: alternative_reading
  - marker: d
    text: 'Das erste Glied kann auch deklarativ übersetzt werden: „Gesegnet ist er, und gesegnet sei …“. Im Ge''ez steht zunächst ein passives Partizip, danach eine jussive Verbform.'
    reason: grammar
lexical_decisions:
- source_word: ይነሥኡ አሐደ ቃለ / በአሐዱ ቃል
  choice: gemeinsam ihre Stimme erheben / mit einer Stimme
  rationale: Die wörtliche Wendung „eine Stimme erheben“ bezeichnet hier den einmütigen gemeinschaftlichen Ruf. Die beiden deutschen Formulierungen geben denselben Gedanken natürlich wieder und bewahren die Wiederholung des Stimmenmotivs.
- source_word: ወይባርኩ ወይሴብሑ ወያሌዕሉ
  choice: sie werden segnen, preisen und erhöhen
  rationale: Die drei Verben bleiben als gesteigerte liturgische Reihe erhalten und werden nicht zu einem einzigen Ausdruck zusammengezogen.
- source_word: በመንፈሰ ሃይማኖት
  choice: im Geist des Glaubens
  rationale: Die Formulierung bewahrt die wiederholte Ge'ez-Konstruktion. ሃይማኖት kann sowohl Glauben als auch Treue beziehungsweise Glaubenstreue bezeichnen; die Alternative wird in einer Fußnote offengehalten.
- source_word: በመንፈሰ ትዕግሥት
  choice: im Geist der Geduld
  rationale: „Geduld“ ist im Deutschen klar und fügt sich in die Tugendreihe; Standhaftigkeit oder Ausdauer liegen ebenfalls im Bedeutungsbereich.
- source_word: በመንፈሰ ምሕረት
  choice: im Geist des Erbarmens
  rationale: „Erbarmen“ wahrt den religiös-ethischen Ton und gibt die Bedeutung von Barmherzigkeit beziehungsweise Mitgefühl wieder.
- source_word: በመንፈሰ ጽድቅ ወሰላም
  choice: im Geist der Gerechtigkeit und des Friedens
  rationale: Die im Ge'ez eng verbundene Paarung bleibt unter einer gemeinsamen Wiederholung von „im Geist“ erhalten.
- source_word: መንፈሰ ኂሩት
  choice: im Geist der Güte
  rationale: ኂሩት bezeichnet breit Güte, Freundlichkeit oder Wohlwollen. „Güte“ vermeidet die unnötige Verengung auf Freigebigkeit.
- source_word: ቡሩክ ወይትባረክ
  choice: Gesegnet sei er, und gesegnet sei
  rationale: Die liturgische Segensformel wird im Deutschen einheitlich und würdig wiedergegeben. Das Pronomen „er“ wird zur notwendigen Verdeutlichung des unausgesprochenen Bezugs ergänzt.
- source_word: ስሙ ለእግዚአ መናፍስት
  choice: der Name des Herrn der Geister
  rationale: „Herr der Geister“ bleibt als charakteristischer Titel der Bilderreden des 1. Henoch erhalten.
- source_word: ለዓለም ወእስከ ለዓለም
  choice: für immer und ewig
  rationale: Die geläufige deutsche doxologische Wendung gibt die feierliche zeitliche Doppelung natürlich wieder.
theological_decisions:
- issue: Bedeutung der wiederholten Wendung „im Geist …“
  choice: Die Wendungen bleiben wörtlich transparent und können die Haltung oder Sphäre des Lobpreises bezeichnen.
  alternative: Sie können auch auf verliehene geistliche Gaben oder stärker personifiziert gedachte himmlische Geister bezogen werden.
  rationale: Der Ge'ez-Text entscheidet die metaphysische Frage nicht eindeutig. Die Übersetzung bewahrt daher die Spannung, statt eine bestimmte Geist- oder Gabenlehre festzuschreiben.
- issue: Bezug des ersten Segensrufs
  choice: „Er“ wird auf den Herrn der Geister bezogen; anschließend wird dessen Name gesegnet.
  alternative: Das erste Wort kann als selbstständiger Ausruf „Gesegnet!“ verstanden oder enger auf den nachfolgenden Namen bezogen werden.
  rationale: Der unmittelbare Zusammenhang legt den Herrn der Geister als Bezug nahe, doch der knappe Ge'ez-Ausdruck nennt das Pronomen nicht ausdrücklich.
- issue: Modus der zweigliedrigen Segensformel
  choice: Beide Glieder werden als Segenswunsch mit „sei“ formuliert.
  alternative: Das erste Glied kann wegen des passiven Partizips deklarativ als „Gesegnet ist er“ wiedergegeben werden, während das zweite jussiv bleibt.
  rationale: Die einheitliche deutsche Formel bildet den liturgischen Parallelismus gut ab; die grammatische Differenz des Ge'ez wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener liturgischer Reihung. Die häufige Wiederholung von „im Geist“ und die dreifache Verbfolge werden nicht geglättet, weil sie Rhythmus und theologische Offenheit des Ge'ez-Textes tragen.
