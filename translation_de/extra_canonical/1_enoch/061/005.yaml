base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/005.yaml
  text: And these measures shall reveal all the hidden things in the depth of the earth[a], and those who were destroyed in the wilderness, and those who were devoured by wild beasts, and those who were devoured by the fish of the sea, so that they may return and be supported on the day of the Chosen One; for none shall perish before the Lord of Spirits[d][c][b], and none can perish.
translation:
  language: de
  text: Und diese Maße[a] werden alles Verborgene in der Tiefe der Erde[b] offenbar machen, ebenso diejenigen, die in der Wildnis umkamen, die von wilden Tieren gefressen wurden und die von den Fischen des Meeres gefressen wurden, damit sie zurückkehren und am Tag des Erwählten gestützt werden[c]; denn vor dem Herrn der Geister wird niemand zugrunde gehen, und niemand kann zugrunde gehen[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die „Maße“ knüpfen an den vorhergehenden Vers an. Der äthiopische Text nennt sie hier ausdrücklich als diejenigen, die das Verborgene offenbar machen.
    reason: cross_reference
  - marker: b
    text: Wörtlich etwa „alles Verborgene der Tiefe der Erde“. Die Form kann sowohl verborgene Dinge als auch verborgene Personen umfassen; die folgende Aufzählung weist besonders auf Verstorbene hin.
    reason: lexical_alternative
  - marker: c
    text: Das hier verwendete Verb ist schwer zu bestimmen. Möglich sind auch „aufgerichtet werden“ oder „gestärkt werden“; vereinzelt wird an ein Zusammengebrachtwerden gedacht.
    reason: lexical_alternative
  - marker: d
    text: 'Der Schluss ist im Ge’ez knapp und nachdrücklich formuliert. Er lautet sinngemäß: Niemand wird vor dem Herrn der Geister zugrunde gehen, und niemand vermag zugrunde zu gehen.'
    reason: textual_difficulty
lexical_decisions:
- source_word: እሉ እምጣን
  choice: diese Maße
  rationale: Das ausdrücklich vorhandene Substantiv እምጣን wird wiedergegeben; der demonstrative Ausdruck knüpft an die im vorigen Vers genannten Maße an.
- source_word: ይከሥቱ
  choice: werden … offenbar machen
  rationale: Die Wiedergabe bewahrt sowohl den zukunftsbezogenen Ablauf der Vision als auch den apokalyptischen Gedanken, dass Verborgenes sichtbar wird.
- source_word: ኵሎ ኅቡኣተ ለዕመቀ ምድር
  choice: alles Verborgene in der Tiefe der Erde
  rationale: Die substantivische Form bleibt hinsichtlich Sachen und Personen offen; der folgende Katalog erläutert sie durch Menschen, deren Leiber unzugänglich geworden sind.
- source_word: ተኃጕሉ እምበድው
  choice: die in der Wildnis umkamen
  rationale: „Umkamen“ bezeichnet hier den Tod, ohne die spätere Wiederholung von „zugrunde gehen“ unnötig vorwegzunehmen; „Wildnis“ wahrt das biblisch-apokalyptische Register.
- source_word: ተበልዑ እምአራዊት
  choice: von wilden Tieren gefressen wurden
  rationale: Die konkrete und drastische Bildsprache des Ausgangstextes wird ohne Abschwächung bewahrt.
- source_word: ተበልዑ እምዓሣ ባሕር
  choice: von den Fischen des Meeres gefressen wurden
  rationale: Die relativ wörtliche Fassung erhält die kumulative Aufzählung der an unerreichbaren Orten Verstorbenen.
- source_word: ከመ ይግብኡ
  choice: So sollen sie zurückkehren
  rationale: Die Zweck- beziehungsweise Folgebeziehung wird klar ausgedrückt; „zurückkehren“ wahrt die Wiederherstellungs- und Auferstehungsbildlichkeit, ohne sie dogmatisch auszudeuten.
- source_word: ወይትመረጐዙ
  choice: und … Halt finden
  rationale: Das Verb ist an dieser Stelle schwierig. „Halt finden“ lässt die möglichen Nuancen von gestützt, aufgerichtet oder gestärkt werden bestehen und klingt im Deutschen natürlich.
- source_word: በዕለተ ኅሩይ
  choice: am Tag des Erwählten
  rationale: „Der Erwählte“ gibt den singularischen Titel verständlich und würdevoll wieder, ohne eine spätere christologische Identifizierung in den Text einzutragen.
- source_word: አልቦቱ ዘይትኃጐል … ወአልቦ ዘይክል ተኃጕሎተ
  choice: wird niemand zugrunde gehen, und niemand kann zugrunde gehen
  rationale: Die Wiederholung desselben Wortfelds und die zweifache nachdrückliche Verneinung bleiben erhalten.
theological_decisions:
- issue: Auferstehungs- oder Wiederherstellungsbezug der Aufzählung
  choice: Die unauffindbar Verstorbenen kehren am eschatologischen Tag zurück.
  alternative: Lediglich ihre verborgenen Überreste werden zum Gericht offengelegt.
  rationale: Die Verbindung von Menschen, die in Wildnis, Tieren und Meer verloren gingen, mit „zurückkehren“ und der anschließenden Verneinung ihres endgültigen Untergangs spricht für Wiederherstellungs- beziehungsweise Auferstehungsbildlichkeit.
- issue: Titel ኅሩይ
  choice: der Erwählte
  alternative: der Auserwählte
  rationale: „Der Erwählte“ wahrt die titularische Funktion und ist im Deutschen knapp, gegenwärtig und würdevoll; die Identität der Gestalt wird nicht über den Text hinaus festgelegt.
- issue: Absolute Aussage über das Zugrundegehen
  choice: Die doppelte, spannungsreiche Verneinung wird wörtlich bewahrt.
  alternative: Die Aussage wird erläuternd auf ein endgültiges Zugrundegehen in Gottes Gegenwart begrenzt.
  rationale: Der Ausgangstext formuliert umfassend und komprimiert. Eine dogmatische Eingrenzung im Haupttext würde die genuine apokalyptische Spannung stillschweigend auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener apokalyptischer Bildsprache. Die anaphorische Aufzählung wurde lesbar gegliedert, ohne ihre Steigerung abzuschwächen. Schwierige oder theologisch spannungsreiche Formulierungen werden im Haupttext nicht harmonisiert, sondern in Fußnoten transparent gemacht.
