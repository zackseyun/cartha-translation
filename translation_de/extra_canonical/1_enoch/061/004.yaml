base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/004.yaml
  text: And the chosen ones shall dwell with the chosen ones[a], and these are the measures that shall be given for faith[d][c][b], and they shall strengthen righteousness.
translation:
  language: de
  text: Und die Erwählten werden anfangen, bei den Erwählten zu wohnen.[a] Dies sind die Maße,[b] die für den Glauben[c] gegeben werden, und sie werden die Gerechtigkeit festigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher gegliedert: „werden anfangen und bei den Erwählten wohnen (oder: bleiben)“.'
    reason: lexical_alternative
  - marker: b
    text: „Maße“ kann hier auch bemessene Anteile, Zuteilungen oder Maßstäbe bedeuten; die genaue Bedeutung ist unsicher.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „für die Treue“ beziehungsweise „für die Standhaftigkeit“.'
    reason: theological_ambiguity
lexical_decisions:
- source_word: ይዌጥኑ፡ ወየሐድሩ
  choice: werden anfangen … zu wohnen
  rationale: ይዌጥኑ bezeichnet das Beginnen, während የሐድሩ das Wohnen oder Bleiben ausdrückt. Die deutsche Infinitivkonstruktion gibt beide Verben natürlich und ohne Bedeutungsverlust wieder.
- source_word: ኅሩያን
  choice: die Erwählten
  rationale: Die substantivierte Form ist im Deutschen klar, würdevoll und bewahrt die apokalyptische Gruppenbezeichnung ohne zusätzliche konfessionelle Deutung.
- source_word: እሉ
  choice: Dies
  rationale: Das Demonstrativpronomen verweist auf Nahes beziehungsweise unmittelbar Genanntes; „dies“ entspricht daher dem Geʽez genauer als „jenes“.
- source_word: እምጣናት
  choice: Maße
  rationale: Die konkrete, aber mehrdeutige Bedeutung bleibt erhalten; möglich sind bemessene Anteile, Zuteilungen oder Maßstäbe.
- source_word: ይትወሀቡ
  choice: gegeben werden
  rationale: Die schlichte Passivform entspricht der grammatischen Form und dem feierlichen Offenbarungsstil.
- source_word: ለሃይማኖት
  choice: für den Glauben
  rationale: Die Präposition und der semantisch breite Begriff werden direkt wiedergegeben; Treue oder Standhaftigkeit bleiben als kontextuell mögliche Bedeutungen in der Fußnote offen.
- source_word: ያፀንዕዋ
  choice: sie werden … festigen
  rationale: Das Verb bezeichnet ein Fest- oder Starkmachen. „Festigen“ klingt im Deutschen natürlich und bewahrt die aktive Aussage.
- source_word: ለጽድቅ
  choice: die Gerechtigkeit
  rationale: „Gerechtigkeit“ bewahrt sowohl die moralische als auch die gemeinschaftlich-rechtliche Tragweite des Ausdrucks.
theological_decisions:
- issue: Bedeutung von ሃይማኖት im Zusammenhang von endzeitlicher Erwählung
  choice: Glaube
  alternative: Treue oder Standhaftigkeit
  rationale: Der Begriff ist semantisch weit. Der Haupttext wahrt die direkte Wiedergabe, während die Fußnote mögliche Bezüge auf beständige Treue offenhält und keine dogmatische Entscheidung erzwingt.
- issue: Verhältnis der beiden Verben am Versanfang
  choice: anfangen, … zu wohnen
  alternative: anfangen und … wohnen/bleiben
  rationale: Das erste Verb trägt die Bedeutung „beginnen“, das zweite „wohnen/bleiben“. Als deutsche Verbalkonstruktion bilden sie sinnvoll eine Einheit; die formal koordinierte Lesart wird in der Fußnote transparent gemacht.
- issue: Sinn von „Maße“
  choice: Maße
  alternative: Zuteilungen, Anteile oder Maßstäbe
  rationale: Der Kontext entscheidet nicht sicher zwischen einer quantitativen und einer normativen Bedeutung. Die Übersetzung bewahrt diese Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die Satzstruktur wurde leicht gegliedert, ohne die Abfolge der Aussagen zu verändern. Ungewohnte Bildsprache und theologisch relevante Mehrdeutigkeit werden nicht geglättet, sondern durch knappe Fußnoten erschlossen.
