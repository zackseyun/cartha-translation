base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/002.yaml
  text: And I asked the angel[a], saying, “Why have they taken these cords and gone?” And he said to me[c][b], “They have gone so that they may measure.”
translation:
  language: de
  text: 'Und ich fragte den Engel: „Warum haben sie diese Stricke genommen und sind fortgegangen?“ Und er sagte zu mir: „Sie sind fortgegangen, um zu messen.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „um Maß zu nehmen“ oder „um abzumessen“. Was gemessen wird, sagt dieser Vers nicht ausdrücklich.'
    reason: alternative_reading
lexical_decisions:
- source_word: ተስአልክዎ
  choice: ich fragte
  rationale: Die narrative Perfektform bezeichnet eine direkte Frage an den himmlischen Gesprächspartner; „fragte“ ist natürlich und präzise.
- source_word: መላእክ
  choice: den Engel
  rationale: Der Singular bezeichnet im unmittelbaren Kontext den himmlischen Deuteengel.
- source_word: እንዘ እብሎ
  choice: 'fragte …:'
  rationale: Die wörtlich redeeinleitende Konstruktion „indem ich sagte“ wird im Deutschen idiomatisch durch den Doppelpunkt nach „fragte“ wiedergegeben.
- source_word: ነሡ
  choice: haben … genommen
  rationale: Die Form gehört zu ነሥአ „nehmen, ergreifen“, nicht zu einem Verb für „aufstehen“; das Perfekt wird in der Frage natürlich mit deutschem Perfekt wiedergegeben.
- source_word: እሎንቱ አኅበለ
  choice: diese Stricke
  rationale: Das Substantiv bezeichnet die im vorausgehenden Vers genannten Stricke; das Demonstrativum verweist auf diese bereits sichtbaren Gegenstände.
- source_word: ሖሩ
  choice: sind fortgegangen / Sie sind fortgegangen
  rationale: Das Bewegungsverb wird in Frage und Antwort entsprechend der Wiederholung des ge'ezischen Textes wiederholt.
- source_word: ከመ ይመጥኑ
  choice: um zu messen
  rationale: 'Die Verbform ist aktiv und bezeichnet den Zweck ihres Fortgehens: Sie selbst sollen mit den Stricken messen.'
theological_decisions:
- issue: Zweck und Gegenstand des Messens
  choice: um zu messen
  alternative: damit sie Maß nehmen / um abzumessen
  rationale: Der Text nennt hier nicht ausdrücklich, was gemessen wird oder welche theologische Funktion das Messen hat. Die Übersetzung bewahrt diese Offenheit und vermeidet eine Deutung als Zuteilung oder Gericht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „fortgegangen“ folgt bewusst dem ge'ezischen Erzählstil; die umständliche Redeformel wird zugunsten natürlichen deutschen Ausdrucks gestrafft.
