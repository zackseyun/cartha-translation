base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/006.yaml
  text: And all those in the height of heaven received a command[a], and power, and a voice[c][b], and light like fire.
translation:
  language: de
  text: Und alle, die in der Höhe des Himmels waren[b], empfingen einen Befehl, Kraft, eine Stimme und Licht wie Feuer[a][c].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der äthiopische Wortlaut in der zweiten Hälfte des Verses ist in diesem Textzeugen schwer zu beurteilen. Die Übersetzung versteht „Kraft“, „Stimme“ und „Licht“ als weitere Gegenstände dessen, was empfangen wurde.
    reason: textual_variant
  - marker: b
    text: 'Auch möglich: „alle im höchsten Himmel“.'
    reason: lexical_alternative
  - marker: c
    text: „Licht“ kann hier auch „Helligkeit“ oder „Glanz“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወነሥኡ
  choice: empfingen
  rationale: Das Verb bedeutet „nehmen/empfangen“. Zusammen mit ትእዛዘ bezeichnet „empfingen“ natürlich das Entgegennehmen eines Befehls und lässt zugleich die weiteren Akkusativobjekte bei demselben Verb stehen.
- source_word: ትእዛዘ
  choice: einen Befehl
  rationale: Das Substantiv bezeichnet eine verbindliche Anordnung. Der unbestimmte Artikel entspricht hier dem aufzählenden Charakter der Konstruktion, ohne eine bestimmte, zuvor genannte Anordnung vorauszusetzen.
- source_word: እለ፡ በ‘መልዕልተ፡ ሰማይ፡ ኵሎሙ
  choice: alle, die sich in der Höhe des Himmels befanden
  rationale: Diese Wiedergabe erhält die räumliche Bildsprache und vermeidet, aus der Formulierung vorschnell einen feststehenden kosmologischen Begriff wie „höchster Himmel“ zu machen.
- source_word: ኃይለ
  choice: Kraft
  rationale: „Kraft“ gibt die Bedeutung von Macht oder Stärke knapp wieder und passt als direktes Objekt zu „empfingen“.
- source_word: ቃለ
  choice: eine Stimme
  rationale: Das Wort kann Stimme, Laut, Rede oder Wort bedeuten. Im Zusammenhang mit Licht und Feuer bewahrt „Stimme“ die sinnlich-visionäre Bildsprache.
- source_word: ብርሃነ
  choice: Licht
  rationale: Das Wort bezeichnet Licht, Helligkeit oder Glanz. „Licht“ ist die unmittelbarste Wiedergabe; „Glanz“ bleibt als mögliche Nuance in der Fußnote erhalten.
- source_word: ከመ፡ እሳት
  choice: wie Feuer
  rationale: Die knappe Vergleichsform wird direkt bewahrt. Grammatisch bezieht sich der Vergleich am naheliegendsten auf das unmittelbar vorausgehende „Licht“.
theological_decisions:
- issue: Identität der Wesen in der Höhe des Himmels
  choice: allgemeine Bezeichnung der dort befindlichen himmlischen Wesen
  alternative: bestimmte Engelordnungen oder die himmlischen Heerscharen insgesamt
  rationale: Der Vers benennt keine besondere Klasse. Die Übersetzung hält den Bezug daher bewusst offen.
- issue: Syntaktische Zuordnung von Kraft, Stimme und Licht
  choice: alle drei als weitere Objekte von „empfingen“
  alternative: „Kraft und Stimme des Lichtes waren wie Feuer“ als neuer Satzteil
  rationale: Die koordinierten Akkusativformen sprechen dafür, die Substantive gemeinsam vom Verb „empfingen“ abhängig zu machen. Die ältere alternative Gliederung wird wegen der schwierigen Überlieferung in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Aufzählung. „Höhe des Himmels“ bewahrt die fremdartige apokalyptische Raumvorstellung, ohne sie unnötig zu systematisieren; die wiederholten Konjunktionen des Ausgangstextes werden weitgehend natürlich gebündelt.
