base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/007.yaml
  text: And to him belongs the first word[a]; they shall bless and exalt and praise with wisdom[c][b], and they shall be wise in speech and in the spirit of life.
translation:
  language: de
  text: Und ihm gehört das erste Wort[a]; sie werden segnen, erhöhen und mit Weisheit preisen, und sie werden in der Rede und im Geist des Lebens[b] weise sein.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Anfang der Rede“.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „im Atem des Lebens“. Das entsprechende äthiopische Wort kann sowohl „Geist“ als auch „Atem“ bedeuten.'
    reason: lexical_alternative
  - marker: c
    text: 'Der letzte Satzteil ist im Äthiopischen schwierig; möglich ist auch: „und sie werden in der Rede und im Atem des Lebens weise handeln“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ወለዉእቱ፡ መቅድመ፡ ቃለ
  choice: Und ihm gehört das erste Wort
  rationale: ወለዉእቱ bedeutet „und ihm/zu ihm“; መቅድመ ቃለ bildet eine Nominalverbindung im Sinn von „das erste Wort“ beziehungsweise „der Anfang der Rede“. Die Wiedergabe vermeidet die syntaktisch weniger wahrscheinliche Deutung „vor ihm … mit der Stimme“.
- source_word: ይባርኩ፡ ወያሌዕሉ፡ ወይሴብሑ
  choice: sie werden segnen, erhöhen und preisen
  rationale: Die drei parallelen Verben werden als zukünftige beziehungsweise erwartete Handlungen wiedergegeben; „erhöhen“ bewahrt das Bild des Hochhebens und passt zum doxologischen Zusammenhang.
- source_word: በጥበብ
  choice: mit Weisheit
  rationale: Die präpositionale Wendung bezeichnet wahrscheinlich die Art und Weise des Segnens, Erhöhens und Preisens. „Mit Weisheit“ klingt im modernen Deutschen natürlicher als „in Weisheit“, ohne den nominalen Ausdruck aufzulösen.
- source_word: ይጠብቡ
  choice: weise sein
  rationale: Die Wiedergabe erhält die erkennbare lexikalische Verbindung zu ጥበብ („Weisheit“) und legt das Verb nicht vorschnell als bloßes „klug handeln“ fest.
- source_word: በነገር
  choice: in der Rede
  rationale: ነገር kann „Wort“, „Rede“, „Sache“ oder „Angelegenheit“ bezeichnen. Hier passt „Rede“ zum sprachlichen Zusammenhang und unterscheidet das Lexem von ቃለ im ersten Satzteil.
- source_word: መንፈሰ፡ ሕይወት
  choice: Geist des Lebens
  rationale: መንፈስ kann sowohl „Geist“ als auch „Atem“ bedeuten. „Geist des Lebens“ wahrt den erhabenen apokalyptischen Ton; die konkrete Alternative wird in einer Fußnote offengehalten.
theological_decisions:
- issue: Ist መንፈሰ ሕይወት als „Geist des Lebens“ oder als „Atem des Lebens“ zu verstehen?
  choice: Geist des Lebens
  alternative: Atem des Lebens
  rationale: Der himmlisch-doxologische Kontext stützt „Geist“, doch das äthiopische Wort umfasst zugleich den konkreten Atem. Die Fußnote bewahrt diese theologisch bedeutsame Mehrdeutigkeit.
- issue: Bezeichnet መቅድመ ቃለ „das erste Wort“ oder „den Anfang der Rede“?
  choice: das erste Wort
  alternative: der Anfang der Rede
  rationale: Beide Fassungen respektieren die Nominalverbindung. „Das erste Wort“ ist knapp und direkt, während die Alternative den möglichen Vorgangscharakter von „Rede“ sichtbar macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener Satzparallelität. Die Formulierung ist verständlich, ohne die schwierige Syntax und die Mehrdeutigkeit von „Geist/Atem“ stillschweigend festzulegen.
