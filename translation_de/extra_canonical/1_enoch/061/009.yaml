base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/009.yaml
  text: And when he lifts up his face to judge their hidden ways by the word of the name of the Lord of Spirits[a], and their conduct by the path of righteousness of the Lord of Spirits, then all of them will speak with one voice[d][c][b], and they will bless and praise and exalt and sanctify the name of the Lord of Spirits.
translation:
  language: de
  text: Und wenn er sein Angesicht erhebt, um ihre verborgenen Wege durch das Wort des Namens des Herrn der Geister[a] zu richten und ihre Schritte anhand des Pfades der Gerechtigkeit des Herrn der Geister[b], dann werden sie alle mit einer Stimme sprechen und den Namen des Herrn der Geister segnen, loben, erhöhen und heiligen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung „durch das Wort des Namens“ ist im geʿezischen Text schwierig. Gemeint sein können ein Ausspruch, ein Befehl oder die mit dem göttlichen Namen verbundene Vollmacht.
    reason: alternative_reading
  - marker: b
    text: Wörtlich steht hier „ihre Spur“ oder „ihre Schritte“. Gemeint sein kann ihr Lebenswandel, der am Pfad der Gerechtigkeit beurteilt wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: ያሌዕል ገጾ
  choice: sein Angesicht erhebt
  rationale: Bewahrt das konkrete, feierliche Körperbild des geʿezischen Ausdrucks, ohne es zu einem bloßen „erscheint“ oder „blickt“ abzuschwächen.
- source_word: ይኰንን
  choice: zu richten
  rationale: Der Zusammenhang ist gerichtlich; „richten“ erhält diese forensisch-apokalyptische Kraft, ohne ausdrücklich eine Verurteilung festzulegen.
- source_word: ፍኖቶሙ እንተ ኅቡእ
  choice: ihre verborgenen Wege
  rationale: „Wege“ erhält die Metapher des sittlichen Lebenswegs; „verborgen“ bezeichnet das dem Blick Entzogene, das dem Gericht dennoch offenliegt.
- source_word: በነገረ ስሙ
  choice: durch das Wort des Namens
  rationale: Die ungewöhnliche geʿezische Verbindung wird transparent und nahezu formal wiedergegeben, statt sie vorschnell als Befehl, Ausspruch oder Vollmacht zu vereindeutigen.
- source_word: አሰረ ዚአሆሙ
  choice: ihre Schritte
  rationale: Die Form ist als Nominalfügung „ihre Spur/ihre Schritte“ zu verstehen, nicht als Verb „er setzt sie“. „Schritte“ bewahrt das Wegbild und bezeichnet zugleich den Lebenswandel.
- source_word: በፍኖተ ጽድቅ
  choice: anhand des Pfades der Gerechtigkeit
  rationale: „Anhand“ macht die parallele richterliche Norm verständlich; „Pfad der Gerechtigkeit“ bewahrt die ethische Wegmetapher.
- source_word: በ፩ቃል
  choice: mit einer Stimme
  rationale: Die idiomatische deutsche Wendung gibt die gemeinsame, einmütige Äußerung wieder und bleibt dem Bild des Ausgangstextes nahe.
- source_word: ይባርኩ ወይሴብሑ ወያሌዕሉ ወይቄድሱ
  choice: segnen, loben, erhöhen und heiligen
  rationale: Die viergliedrige Lobpreisungsformel bleibt ungekürzt erhalten; „heiligen“ wahrt insbesondere die kultische Aussagekraft des letzten Verbs.
- source_word: እግዚአ መናፍስት
  choice: Herr der Geister
  rationale: Die für 1 Henoch charakteristische Gottesbezeichnung wird einheitlich und ohne zusätzliche dogmatische Deutung wiedergegeben.
theological_decisions:
- issue: Subjekt der singularischen Handlungen
  choice: Das Pronomen „er“ bleibt ohne ausdrückliche Identifizierung stehen.
  alternative: Der Herr der Geister oder die erwählte endzeitliche Gestalt wird ausdrücklich als Handelnder benannt.
  rationale: Der Vers selbst nennt das Subjekt nicht erneut. Eine Identifizierung müsste aus dem weiteren Zusammenhang erschlossen werden und würde die im Text verbleibende Spannung auflösen.
- issue: Kraft der Wendung „Wort des Namens des Herrn der Geister“
  choice: Die schwierige instrumentale Wendung wird als „durch das Wort des Namens“ formal bewahrt.
  alternative: „durch den im Namen des Herrn ergehenden Befehl“ oder „durch die Vollmacht des göttlichen Namens“
  rationale: Der geʿezische Wortlaut kann Ausspruch, Befehl oder mit dem Namen verbundene Autorität anklingen lassen; keine dieser Deutungen ist sicher genug, um sie allein in den Haupttext aufzunehmen.
- issue: Funktion von „ihre Schritte“
  choice: Die Nominalfügung wird als zweites Objekt des Richtens verstanden.
  alternative: „und er setzt sie auf den Pfad der Gerechtigkeit“
  rationale: አሰረ ዚአሆሙ ist hier als „ihre Spur/ihre Schritte“ zu analysieren, nicht als singularisches Verb mit Objektpronomen. So entsteht eine parallele Gerichtsaussage über verborgene Wege und sichtbare Schritte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenen apokalyptischen Wegbildern. Die ungewöhnliche Formel „Wort des Namens“ bleibt wegen ihrer textlichen und theologischen Offenheit stehen; erklärungsbedürftige Stellen sind knapp in Fußnoten erläutert.
