base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/061/013.yaml
  text: For abundant is the mercy of the Lord of Spirits[a], and he is slow to anger[c][b]; and all his works and all the measure of what he has made he has revealed to the righteous and the chosen in the name of the Lord of Spirits.
translation:
  language: de
  text: Denn reich ist das Erbarmen des Herrn der Geister, und er ist langsam zum Zorn[a]; alle seine Werke und das ganze Maß dessen, was er geschaffen hat[b], hat er den Gerechten und den Erwählten im Namen des Herrn der Geister[c] offenbart.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „und sein Zorn ist fern“. Die Wendung kann idiomatisch Gottes Langmut bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Die äthiopische Formulierung ist schwierig. Möglich ist auch: „jedes Maß dessen, was er getan hat“; gemeint sein können Umfang, Ordnung oder festgesetztes Maß seiner Werke.'
    reason: textual_uncertainty
  - marker: c
    text: „Im Namen des Herrn der Geister“ kann die Sphäre, die Vollmacht oder die Anrufung bezeichnen, in der diese Offenbarung geschieht.
    reason: lexical_alternative
lexical_decisions:
- source_word: ብዙኅ ምሕረቱ
  choice: reich ist das Erbarmen
  rationale: Bewahrt die Aussage von der Fülle göttlicher Barmherzigkeit in natürlichem, würdevollem Deutsch; „Erbarmen“ gibt sowohl Zuwendung als auch Milde wieder.
- source_word: ለእግዚአ መናፍስት
  choice: des Herrn der Geister
  rationale: Bewahrt den charakteristischen apokalyptischen Gottestitel aus 1 Henoch.
- source_word: ወርሑቅ መዓት
  choice: und er ist langsam zum Zorn
  rationale: Gibt die semitisch-biblische Wendung idiomatisch wieder, ohne die wörtliche Bildgestalt „der Zorn ist fern“ zu verschweigen; diese erscheint in der Fußnote.
- source_word: ወኵሉ ግብሩ
  choice: alle seine Werke
  rationale: „Werke“ umfasst sowohl Gottes Handeln als auch sein Schaffen und passt zum weiten Aussagebereich.
- source_word: ወኵሉ እምጣነ ገብረ
  choice: das ganze Maß dessen, was er geschaffen hat
  rationale: Hält die schwierige Maß- bzw. Ordnungsformulierung transparent, statt sie durch eine sichere Deutung zu ersetzen.
- source_word: ከሠተ
  choice: hat er … offenbart
  rationale: Entspricht dem apokalyptischen Zusammenhang, in dem Verborgenes enthüllt und bekannt gemacht wird.
- source_word: ለጻድቃን ወለኅሩያን
  choice: den Gerechten und den Erwählten
  rationale: Verwendet geläufige, theologisch nicht unnötig eingeengte Gruppenbezeichnungen.
- source_word: በስሙ
  choice: im Namen
  rationale: Bewahrt die formale Mehrdeutigkeit hinsichtlich Sphäre, Vollmacht oder Anrufung.
theological_decisions:
- issue: Sinn der Aussage über den Zorn
  choice: Als biblische Charakteraussage „langsam zum Zorn“ wiedergegeben.
  alternative: „Sein Zorn ist fern.“
  rationale: Die idiomatische Lesart ist im Zusammenhang mit reichem Erbarmen wahrscheinlich; die wörtlichere Möglichkeit bleibt in einer Fußnote sichtbar und bewahrt die Spannung zu künftigem Gericht.
- issue: Bedeutung des Maßes des Geschaffenen
  choice: Die schwierige Formulierung wird weitgehend formal als „das ganze Maß dessen, was er geschaffen hat“ erhalten.
  alternative: „die ganze Ordnung seiner Werke“ oder „alles, was er bestimmt hat“
  rationale: Da die genaue Referenz unsicher ist, vermeidet die Übersetzung eine unbelegte Festlegung auf Umfang, Zahl, Ordnung oder Bestimmung.
- issue: Bedeutung von „im Namen des Herrn der Geister“
  choice: Die Präpositionalformel wird unverändert mehrdeutig belassen.
  alternative: „durch die Vollmacht des Herrn der Geister“ oder „unter Anrufung des Herrn der Geister“
  rationale: Der Text entscheidet nicht eindeutig zwischen Sphäre, Autorität, Mittel und Anrufung.
translation_notes:
  register: Modernes Standarddeutsch in gehobenem, aber allgemein verständlichem Register. Der Satzbau folgt dem feierlichen Begründungscharakter des Ausgangstextes, ohne unnötige Archaismen. Die Wiederholung des Titels „Herr der Geister“ bleibt erhalten.
