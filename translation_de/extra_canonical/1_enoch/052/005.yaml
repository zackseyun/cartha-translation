base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/005.yaml
  text: And that angel of peace answered[a], saying to me, 'Wait a little[c][b], and every hidden thing that the Lord of Spirits has enclosed will be revealed to you.'
translation:
  language: de
  text: 'Und jener Engel des Friedens antwortete und sagte zu mir: »Warte noch ein wenig[a], dann wird dir alles Verborgene offenbart werden, was der Herr der Geister eingeschlossen hat[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Bleib noch ein wenig« beziehungsweise »Hab noch ein wenig Geduld«; der Imperativ kann Warten, Verweilen oder geduldiges Ausharren bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Das zugrunde liegende Verb kann auch »verschlossen« oder »verborgen gehalten« bedeuten. Es betont, dass das Verborgene bis zu seiner Offenbarung unter der Verfügung des Herrn der Geister bleibt.
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ፡ እንዘ፡ ይብለኒ
  choice: antwortete und sagte zu mir
  rationale: Die Verbindung gibt eine idiomatische Redeeinleitung wieder. Die deutsche Form bewahrt sowohl das Antworten als auch das anschließende Sagen, ohne den zeitlichen Ablauf umzukehren.
- source_word: መልአከ፡ ሰላም
  choice: Engel des Friedens
  rationale: Die Genitivverbindung wird als charakteristische henochische Bezeichnung wörtlich und natürlich bewahrt.
- source_word: ጽናሕ፡ ንስቲተ
  choice: Warte noch ein wenig
  rationale: Der Imperativ bezeichnet Warten beziehungsweise Verweilen; ንስቲተ schränkt dies zeitlich ein. „noch“ ergibt im Deutschen eine natürliche Aufforderung, ohne eine längere Dauer festzulegen.
- source_word: ይትከሠት
  choice: wird … offenbart werden
  rationale: Die passive Zukunft bezeichnet apokalyptische Enthüllung; „offenbart“ wahrt diesen gehobenen Sachregisterton.
- source_word: ኵሉ፡ ዘኅቡእ
  choice: alles Verborgene
  rationale: Die umfassende, substantivierte Wendung ist idiomatisches Deutsch und lässt offen, welche verborgenen Dinge gemeint sind.
- source_word: ዘከለለ
  choice: eingeschlossen hat
  rationale: Die Wahl erhält das räumliche Bild des Umschließens beziehungsweise Verschlossenhaltens und deutet es nicht vorschnell als Reservieren oder Versiegeln.
- source_word: እግዚአ፡ መናፈስት
  choice: der Herr der Geister
  rationale: Der formelhafte göttliche Titel wird in seiner eigentümlichen henochischen Gestalt beibehalten.
theological_decisions:
- issue: Göttlicher Titel እግዚአ መናፈስት
  choice: der Herr der Geister
  alternative: der Herr von Geistern
  rationale: „Herr der Geister“ wahrt den formelhaften Titel und seine Mehrdeutigkeit, ohne festzulegen, um welche Geister es sich handelt.
- issue: Göttliche Verfügung über das Verborgene
  choice: eingeschlossen hat
  alternative: verborgen gehalten hat
  rationale: Das konkrete Bild des Ausgangstextes bleibt erhalten; zugleich wird nicht näher bestimmt, ob das Einschließen Schutz, Geheimhaltung oder Zurückhaltung bis zur Offenbarung bedeutet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht gehobenem apokalyptischem Ton. Die Redeeinleitung ist idiomatisch, der charakteristische Titel „Herr der Geister“ sowie die Bildsprache des Einschließens bleiben erhalten.
