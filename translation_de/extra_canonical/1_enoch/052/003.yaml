base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/003.yaml
  text: And I asked the angel who went with me[a], saying, “What are these things that I have seen in secret?”
translation:
  language: de
  text: 'Und ich fragte den Engel, der mit mir ging: „Was sind diese Dinge, die ich im Verborgenen[a] gesehen habe?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „heimlich“ beziehungsweise „an einem verborgenen Ort“. Der ge’ezische Ausdruck bezeichnet Verborgenheit; ob er den Ort, die Art des Sehens oder den verborgenen Charakter des Geschauten beschreibt, ist nicht völlig sicher.'
    reason: lexikalische Alternative und syntaktische Mehrdeutigkeit
lexical_decisions:
- source_word: ተስእልክዎ
  choice: ich fragte
  rationale: Das Verb bezeichnet Fragen oder Erkundigen. „Ich fragte“ ist im Deutschen natürlich und lässt das anschließend genannte Objekt „den Engel“ klar hervortreten.
- source_word: መልአክ
  choice: Engel
  rationale: Im apokalyptischen Zusammenhang ist ein himmlisches Wesen gemeint; daher ist „Engel“ treffender als das allgemeinere „Bote“.
- source_word: ዘምስሌየ የሐውር
  choice: der mit mir ging
  rationale: Die Relativkonstruktion bezeichnet den Engel, der den Seher begleitet. Diese Wiedergabe bewahrt die erzählerische Bewegung und klingt zugleich natürlich.
- source_word: እንዘ እብል
  choice: durch direkte Rede wiedergegeben
  rationale: Die Wendung führt die Rede ein. Im modernen Deutschen genügt nach „fragte“ ein Doppelpunkt; ein zusätzliches „indem ich sagte“ wäre unnötig schwerfällig.
- source_word: ምንት ውእቱ … እሙንቱ እሉ
  choice: Was sind diese Dinge
  rationale: Obwohl ein Teil der Formulierung formal singularisch wirkt, weisen die folgenden Demonstrativformen auf mehrere zuvor geschaute Gegenstände. „Diese Dinge“ gibt den Bezug verständlich wieder.
- source_word: በኅቡእ
  choice: im Verborgenen
  rationale: Die Wendung bezeichnet Verborgenheit oder Geheimhaltung. „Im Verborgenen“ erhält die Mehrdeutigkeit zwischen verborgenem Ort, verborgener Weise des Sehens und verborgenem Charakter des Geschauten besser als eine stärker festlegende Formulierung.
- source_word: ርኢኩ
  choice: gesehen habe
  rationale: Das Perfekt stellt im Deutschen einen natürlichen Bezug zwischen dem unmittelbar vorausgehenden Sehen und der nun gestellten Frage her.
theological_decisions:
- issue: Bedeutung von በኅቡእ innerhalb der apokalyptischen Vision
  choice: im Verborgenen
  alternative: heimlich; an einem verborgenen Ort; als verborgene Dinge
  rationale: Der Ausdruck kann den Ort, die Art des Sehens oder den verborgenen Charakter der geschauten Wirklichkeit bezeichnen. Die Übersetzung hält diese offenbarungstheologische Spannung offen, statt sie auf eine Deutung festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Redeformel wurde idiomatisch mit einem Doppelpunkt wiedergegeben; die genuine Mehrdeutigkeit des Ausdrucks für Verborgenheit bleibt im Haupttext erhalten und wird in der Fußnote erläutert.
