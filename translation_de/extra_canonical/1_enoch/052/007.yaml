base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/007.yaml
  text: And in those days they will not be saved by gold or by silver[b][a], nor will they be able to flee.
translation:
  language: de
  text: 'Und es wird geschehen: In jenen Tagen werden sie weder durch Gold noch durch Silber gerettet werden[a], und sie werden nicht fliehen können.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das zugrunde liegende Verb kann hier auch im Sinn von „heil davonkommen“ oder „entrinnen“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይከውን
  choice: Und es wird geschehen
  rationale: Bewahrt die einleitende prophetisch-apokalyptische Formel, ohne sie mit dem folgenden Zeitausdruck zu verschmelzen.
- source_word: በእማንቱ፡ መዋዕል
  choice: in jenen Tagen
  rationale: Entspricht der wiederkehrenden apokalyptischen Zeitformel und klingt im modernen Standarddeutsch würdig und natürlich.
- source_word: ኢይድኅኑ
  choice: werden sie … nicht gerettet werden
  rationale: Die Grundstammform des Verbs ist intransitiv und bezeichnet, sicher zu sein, davonzukommen oder gerettet zu werden. Die passive deutsche Form vermeidet die unbegründete Wiedergabe als aktives „sich selbst retten“.
- source_word: እበወርቅ፡ ወእበብሩር
  choice: weder durch Gold noch durch Silber
  rationale: Die Präposition bezeichnet hier das Mittel; die deutsche Paarformel „weder … noch“ gibt die verneinte Verbindung idiomatisch wieder.
- source_word: ወኢይክሉ፡ ጐይየ
  choice: und sie werden nicht fliehen können
  rationale: Gibt sowohl die verneinte Fähigkeit als auch das konkrete Bild der Flucht wieder.
theological_decisions:
- issue: Art der Rettung
  choice: Rettung aus dem bevorstehenden Gericht, wobei Reichtum als untaugliches Mittel erscheint
  alternative: „Sich mit Gold und Silber selbst retten“ oder eine Aussage über geistliches Heil im späteren dogmatischen Sinn
  rationale: Der Grundstamm stützt eine intransitive beziehungsweise passive Aussage. Der apokalyptische Zusammenhang handelt vom Entkommen aus dem Gericht; eine spätere soteriologische Fachbedeutung sollte nicht eingetragen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter apokalyptischer Einleitungsformel. Die Satzstruktur bleibt nah am Ge’ez, wird aber durch „weder … noch“ natürlich deutsch gefasst.
