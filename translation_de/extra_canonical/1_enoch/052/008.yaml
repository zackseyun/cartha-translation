revisions:
- from: Und Eisen wird nicht für den Krieg da sein.[a]
  to: Und Eisen wird nicht für den Krieg bestimmt sein.[a]
  rationale: Die Revision ersetzt die im Deutschen schwerfällige und potenziell existenziell missverständliche Wendung »da sein« durch »bestimmt sein«. Damit bleibt die im Ausgangstext durch die Zweckangabe nahegelegte funktionale Aussage erhalten, ohne das knappe Original zu überdeuten. Die Fußnote kennzeichnet die funktionale Erklärung weiterhin ausdrücklich als wahrscheinlich.
