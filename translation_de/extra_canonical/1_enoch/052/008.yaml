  text: And iron shall not be for war[a].
translation:
  language: de
  text: Und Eisen wird nicht für den Krieg bestimmt sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Geʽez ist sehr knapp, wörtlich etwa: »Und Eisen wird nicht für den Krieg sein.« Gemeint ist wahrscheinlich, dass Eisen nicht mehr zur Kriegsführung verwendet wird.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወኢይከውን
  choice: Und ... wird nicht ... da sein
  rationale: Die Verbindung aus ወ und dem verneinten Imperfekt von »sein/werden« hat hier zukunftsbezogenen Sinn. Die Formulierung bewahrt den knappen prophetischen Ton und ergibt zusammen mit der Zweckangabe natürliches Deutsch.
- source_word: ኃጺን
  choice: Eisen
  rationale: Das Substantiv bezeichnet unmittelbar Eisen; eine weitergehende metaphorische Deutung ist nicht erforderlich.
- source_word: ለፀብእ
  choice: für den Krieg
  rationale: Die Präposition ለ bezeichnet hier Zweck oder Verwendung; »Krieg« gibt den Begriff im apokalyptischen Zusammenhang knapp und treffend wieder.
theological_decisions:
- issue: Reichweite der Verneinung in der knappen ge'ezischen Aussage
  choice: Eisen wird nicht mehr dem Krieg dienen.
  alternative: Es wird kein Eisen mehr geben.
  rationale: 'Die auf »Eisen« folgende Verbindung ለ mit dem Wort für Krieg legt eine funktionale Aussage nahe: Eisen ist nicht für den Krieg bestimmt beziehungsweise wird nicht dafür verwendet. Die Übersetzung hält sich eng an den Wortlaut; die Fußnote erläutert den wahrscheinlichen Sinn, ohne die Mehrdeutigkeit im Haupttext völlig aufzulösen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper prophetisch-apokalyptischer Satzführung. Die ungewöhnliche Kürze des Originals bleibt erhalten; eine idiomatischere Ausdeutung wird nur in der Fußnote geboten.
