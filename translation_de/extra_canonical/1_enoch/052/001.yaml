base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/001.yaml
  text: And after those days[a], in that place where I had seen all the visions of what is hidden, for I had been snatched up by a whirlwind[c][b], and it had carried me westward—
translation:
  language: de
  text: Und nach jenen Tagen, an jenem Ort, wo ich alle Visionen des Verborgenen[a] gesehen hatte – denn ein Wirbelsturm hatte mich hinweggerissen[b] und nach Westen getragen –
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »alle verborgenen Visionen«.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »durch einen Wirbelsturm des Windes hinweggerissen«; die Ausdrucksweise verstärkt das Bild einer gewaltsamen, vom Wind getragenen Versetzung.'
    reason: cultural_note
lexical_decisions:
- source_word: እምድኅረ እማንቱ መዋዕል
  choice: nach jenen Tagen
  rationale: Bewahrt die zeitliche Abfolge und die deiktische Distanz von እማንቱ in natürlichem Deutsch.
- source_word: በውእቱ መካን
  choice: an jenem Ort
  rationale: Gibt den konkreten räumlichen Bezug der Vision wieder; im Deutschen ist bei »Ort« die Präposition »an« hier idiomatisch.
- source_word: ርኢኩ ኵሎ ራእያተ ዘበኅቡእ
  choice: ich alle Visionen des Verborgenen gesehen hatte
  rationale: Bewahrt die mögliche Beziehung der Relativfügung auf verborgene Wirklichkeiten, ohne die alternative Lesart »alle verborgenen Visionen« auszuschließen.
- source_word: እስመ
  choice: denn
  rationale: Gibt die ausdrücklich vorhandene begründende bzw. erläuternde Konjunktion wieder und erhält den satzfragmentartigen Anschluss an den Folgevers.
- source_word: ተመሠጥኩ
  choice: hatte mich hinweggerissen
  rationale: Vermittelt die plötzliche, machtvolle Entrückung, ohne festzulegen, ob sie körperlich oder ekstatisch geschah.
- source_word: በአውሎጋኒ ነፋስ
  choice: ein Wirbelsturm
  rationale: Natürliches, würdiges Deutsch für die intensive meteorologische Wendung; die wörtliche Doppelung »Wirbelsturm des Windes« wird in der Fußnote kenntlich gemacht.
- source_word: ወወሰደኒ ዓረበ
  choice: und nach Westen getragen
  rationale: Versteht ዓረበ richtungsbezogen und bewahrt das vom Sturm bewirkte Getragenwerden.
theological_decisions:
- issue: Art der visionären Versetzung
  choice: ein Wirbelsturm hatte mich hinweggerissen
  alternative: der Geist des Windes hatte mich fortgenommen
  rationale: Der geezische Wortlaut stellt eine gewaltsame, windgetragene Versetzung dar. Die Übersetzung wahrt das visionäre Bild, ohne zu entscheiden, ob das Erlebnis leiblich oder ekstatisch war.
- issue: Bezug von ዘበኅቡእ
  choice: Visionen des Verborgenen
  alternative: verborgene Visionen
  rationale: Die Konstruktion erlaubt eine gewisse Mehrdeutigkeit. Der Haupttext hebt verborgene Wirklichkeiten als Gegenstand der Visionen hervor; die mögliche attributive Lesart bleibt in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Gedankenstriche bewahren den erläuternden Einschub mit እስመ und den syntaktisch offenen Übergang zum folgenden Vers. Das Plusquamperfekt markiert die Vorzeitigkeit der bereits erfolgten Versetzung.
