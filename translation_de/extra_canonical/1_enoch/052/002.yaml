base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/002.yaml
  text: 'There my eyes saw all the hidden things of heaven that are to come: a mountain of iron[a], and a mountain of copper, and a mountain of silver, and a mountain of gold, and a mountain of soft metal[b], and a mountain of lead.'
translation:
  language: de
  text: 'Dort sahen meine Augen alle verborgenen Dinge des Himmels, die künftig sein werden[a]: einen Berg aus Eisen, einen Berg aus Kupfer, einen Berg aus Silber, einen Berg aus Gold, einen Berg aus weichem Metall[b] und einen Berg aus Blei.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die mit „die künftig sein werden“ wiedergegebene Wendung ist schwierig. Sie kann auch eher statisch verstanden werden: „die dort waren“ oder „die im Himmel vorhanden sind“.'
    reason: alternative_reading
  - marker: b
    text: Die genaue Bedeutung des fünften Metallbegriffs ist unsicher. Gemeint sein könnte ein weiches oder gemischtes Metall; teilweise wird es genauer als Zinn oder Elektron bestimmt.
    reason: lexical_alternative
lexical_decisions:
- source_word: በህየ
  choice: Dort
  rationale: Das Ortsadverb eröffnet die visionäre Szene; „Dort“ bewahrt den räumlichen Bezug knapp und natürlich.
- source_word: ርእዩ አዕይንትየ
  choice: sahen meine Augen
  rationale: Die ausdrückliche Nennung der Augen wird beibehalten und erhält die anschauliche visionäre Ausdrucksweise.
- source_word: ኵሎ ኅቡኣተ ሰማይ
  choice: all die verborgenen Dinge des Himmels
  rationale: Die Wendung bezeichnet Verborgenes oder Verhülltes; „verborgene Dinge“ ist transparent und vermeidet eine unnötige Festlegung auf den stärker fachsprachlichen Begriff „Geheimnisse“.
- source_word: ዘይኩን ሀሎ
  choice: die kommen sollen
  rationale: Im apokalyptischen Zusammenhang gibt die Wendung wahrscheinlich eine zukünftige beziehungsweise bestimmte Wirklichkeit an. „Kommen sollen“ wahrt diesen prophetisch-modalen Klang; die sprachliche Unsicherheit wird in einer Fußnote offengelegt.
- source_word: ደብረ
  choice: einen Berg aus
  rationale: Die wiederholte Bezeichnung wird als Materialangabe mit „aus“ wiedergegeben; die Wiederholung von „einen Berg“ bewahrt den feierlichen Katalogstil.
- source_word: ኃጺን
  choice: Eisen
  rationale: Eindeutige und übliche Bezeichnung des Metalls.
- source_word: ጸሪቅ
  choice: Kupfer
  rationale: Das Wort kann Kupfer oder eine Kupferlegierung bezeichnen; „Kupfer“ ist die grundlegende, nicht übermäßig spezifizierende Wiedergabe.
- source_word: ብሩር
  choice: Silber
  rationale: Eindeutige und übliche Bezeichnung des Metalls.
- source_word: ወርቅ
  choice: Gold
  rationale: Eindeutige und übliche Bezeichnung des Metalls.
- source_word: ነጠብጣብ
  choice: weichem Metall
  rationale: Die genaue Metallart ist unsicher. Die allgemeine Wiedergabe wahrt diese Unsicherheit, während mögliche genauere Identifizierungen in der Fußnote genannt werden.
- source_word: ዐረር
  choice: Blei
  rationale: Übliche Wiedergabe, die auch sachlich in die Reihe der Metalle passt.
theological_decisions:
- issue: Ob die verborgenen Dinge des Himmels gegenwärtige himmlische Wirklichkeiten oder zukünftige Dinge bezeichnen
  choice: 'zukunftsbezogen: „die kommen sollen“'
  alternative: „die dort waren“ oder „die im Himmel vorhanden sind“
  rationale: Der apokalyptische Zusammenhang und die anschließende Gerichtsbildsprache sprechen für einen Zukunftsbezug. Da die ge'ezische Wendung schwierig ist, bleibt die alternative statische Deutung in der Fußnote ausdrücklich sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ausdrückliche Formulierung „sahen meine Augen“ und die wiederholte Berg-Aufzählung erhalten den feierlichen Charakter der Vision; echte sprachliche Unsicherheiten werden nicht im Haupttext aufgelöst, sondern durch Fußnoten kenntlich gemacht.
