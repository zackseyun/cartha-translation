base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/006.yaml
  text: And those mountains that your eyes saw—the mountain of iron, and the mountain of copper, and the mountain of silver, and the mountain of gold, and the mountain of soft metal, and the mountain of lead—all these will be before the Chosen One like wax before the fire, and like water that runs down from above upon those mountains; and they will become weak before his feet.
translation:
  language: de
  text: Und jene Berge, die deine Augen gesehen haben – den Berg aus Eisen, den Berg aus Kupfer, den Berg aus Silber, den Berg aus Gold, den Berg aus weichem Metall[a] und den Berg aus Blei –, sie alle werden vor dem Erwählten[b] wie Wachs vor dem Feuer und wie Wasser, das von oben auf jene Berge herabfließt; und vor seinen Füßen werden sie kraftlos werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Welches Metall hier genau gemeint ist, bleibt im äthiopischen Text unsicher; vorgeschlagen wurden unter anderem Zinn oder ein anderes weicheres Metall.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „dem Auserwählten“. Der Ausdruck ist in den Bilderreden eine wichtige Titelbezeichnung und wird hier aus dem unmittelbaren Zusammenhang heraus wiedergegeben.'
    reason: lexical_alternative
lexical_decisions:
- source_word: አድባር
  choice: Berge
  rationale: Der Plural bezeichnet in der visionären Szene große Bergmassen; „Berge“ bewahrt den apokalyptischen Maßstab.
- source_word: ኃጺን
  choice: Eisen
  rationale: Eindeutige Materialbezeichnung innerhalb der Reihe metallischer Berge.
- source_word: ጸሪቅ
  choice: Kupfer
  rationale: Das Wort kann auch auf Kupferlegierungen bezogen werden; „Kupfer“ ist hier die breiteste und am wenigsten festlegende Wiedergabe.
- source_word: ብሩር
  choice: Silber
  rationale: Die übliche Bezeichnung für das Edelmetall.
- source_word: ወርቅ
  choice: Gold
  rationale: Die übliche Bezeichnung für das Edelmetall.
- source_word: ነጠብጣብ
  choice: weiches Metall
  rationale: Die genaue Bestimmung des Metalls ist in dieser äthiopischen Zeile unsicher. Die allgemeine Wiedergabe wahrt diese Unsicherheit, statt vorschnell „Zinn“ festzulegen.
- source_word: ዐረር
  choice: Blei
  rationale: Dies ist die am besten gestützte Identifikation in der Metallreihe.
- source_word: ለኅሩይ
  choice: dem Erwählten
  rationale: Der Ausdruck dient in den Bilderreden als gewichtiger Titel. Die Substantivierung und Großschreibung kennzeichnen den Titel, ohne eine spätere Terminologie einzutragen.
- source_word: መዓረ፡ ግራ
  choice: Wachs
  rationale: Das Bild bezeichnet einen Stoff, der vor Feuer nachgibt und schmilzt; „Wachs“ gibt das Gleichnis natürlich wieder.
- source_word: ዘይወርድ፡ እምላዕሉ
  choice: das von oben … herabfließt
  rationale: Die Formulierung bewahrt die anschauliche Abwärtsbewegung des Wassers.
- source_word: ድኩማነ
  choice: kraftlos
  rationale: Das Wort bezeichnet den Verlust von Stärke und Widerstandskraft, ohne zwingend einen körperlichen Einsturz auszusagen.
theological_decisions:
- issue: Wiedergabe von ለኅሩይ in den Bilderreden
  choice: der Erwählte
  alternative: der Auserwählte
  rationale: Der Ausdruck fungiert hier als Titel. „Der Erwählte“ hält die örtliche henochische Bezeichnung fest und vermeidet eine Harmonisierung mit späterer kanonischer Ausdrucksweise.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange Aufzählung und die beiden Vergleiche bleiben erhalten; Gedankenstriche gliedern den komplexen Satz. „Kraftlos“ ist verständlich und lässt offen, ob nur Widerstandsunfähigkeit oder auch ein materielles Zerfallen vorgestellt wird.
