base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/052/004.yaml
  text: And he said to me[a], “All these that you have seen will belong to the dominion of his Anointed One[c][b], so that he may command and be mighty upon the earth.”
translation:
  language: de
  text: 'Und er sagte zu mir: „Alle diese, die du gesehen hast, werden der Herrschaft[a] seines Gesalbten[b] angehören, damit er auf der Erde gebiete und mächtig sei[c].“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für die Herrschaft“. Der äthiopische Ausdruck kann die geschauten Dinge der Herrschaft zuordnen oder sie als deren Mittel beziehungsweise Bereich bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch: „seines Messias“. „Gesalbter“ übersetzt den Titel; die äthiopische Form enthält das Possessivsuffix „sein“.'
    reason: translation_and_grammar
  - marker: c
    text: „Mächtig sei“ kann hier auch „sich durchsetze“ oder „Macht ausübe“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይቤለኒ
  choice: Und er sagte zu mir
  rationale: Bewahrt die übliche äthiopische Einleitungsformel direkter Offenbarungsrede in natürlichem Deutsch.
- source_word: እሉ ኵሎሙ ዘርኢከ
  choice: Alle diese, die du gesehen hast
  rationale: Gibt den rückverweisenden Demonstrativausdruck und die Gesamtheit der zuvor geschauten Dinge wieder, ohne sie näher zu bestimmen.
- source_word: ለስልጣነ
  choice: der Herrschaft
  rationale: ስልጣን bezeichnet Macht, Vollmacht oder Herrschaft; „Herrschaft“ passt zum königlich-apokalyptischen Zusammenhang und lässt die Art dieser Herrschaft offen.
- source_word: መሲሑ
  choice: seines Gesalbten
  rationale: Die Form enthält das maskuline Possessivsuffix „sein“; „Gesalbter“ übersetzt den Titel, statt ihn als „Messias“ zu transliterieren.
- source_word: እሙንቱ ይከውኑ
  choice: werden … angehören
  rationale: Bringt die durch die Präpositionalfügung ausgedrückte Zuordnung zur Herrschaft idiomatisch zum Ausdruck, ohne materiellen Besitz zu behaupten.
- source_word: ከመ ይእዝዝ
  choice: damit er … gebietet
  rationale: Bewahrt sowohl die Ziel- beziehungsweise Folgerelation von ከመ als auch den konkreten Sinn des Befehlens oder Gebietens.
- source_word: ወይትኃየል
  choice: und mächtig ist
  rationale: Gibt den Stärke- und Machtaspekt des Verbs wieder; mögliche dynamische Bedeutungen wie „sich durchsetzen“ bleiben in der Fußnote sichtbar.
- source_word: ዲበ ምድር
  choice: auf der Erde
  rationale: Natürliches modernes Deutsch für die räumliche Wendung, ohne die Präposition herrschaftlich als „über“ auszudeuten.
theological_decisions:
- issue: Wiedergabe von መሲሑ
  choice: seines Gesalbten
  alternative: seines Messias
  rationale: Die Übersetzung bewahrt das Possessivsuffix und behandelt den Ausdruck als Titel. „Messias“ wäre eine geläufige, aber transliterierte Alternative.
- issue: Beziehung der geschauten Dinge zur Herrschaft des Gesalbten
  choice: werden der Herrschaft … angehören
  alternative: werden für die Herrschaft … da sein
  rationale: Die gewählte Formulierung drückt Unterordnung beziehungsweise Zuordnung aus, legt jedoch weder materiellen Besitz noch die genaue politische Gestalt der Herrschaft fest.
- issue: Bedeutung von ይትኃየል
  choice: mächtig ist
  alternative: sich durchsetzt
  rationale: Die stative Wiedergabe bleibt nahe am Ausdruck von Stärke; die dynamische Möglichkeit wird nicht ausgeschlossen, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem Ton. Die Satzstruktur folgt dem äthiopischen Gedankengang, bleibt aber idiomatisch. Titel werden übersetzt; echte lexikalische und syntaktische Mehrdeutigkeiten werden in den Fußnoten erhalten.
