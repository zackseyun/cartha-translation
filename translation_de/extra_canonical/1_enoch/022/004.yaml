base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/004.yaml
  text: And these places were made for them to dwell in until the day of their judgment[a], and until their appointed time, and that appointed time is long[c][b], until the time of the great judgment upon them.
translation:
  language: de
  text: Und diese Orte wurden für sie geschaffen[a], damit sie dort wohnen bis zum Tag ihres Gerichts und bis zu ihrer festgesetzten Zeit[b]; und diese Zeit ist lang[c], bis zur Zeit des großen Gerichts über sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die mit einem textkritischen Zeichen versehene Form im äthiopischen Text (†ገብሩ†) ist unsicher. Der Zusammenhang besagt, dass diese Orte für ihren Aufenthalt bis zum Gericht bestimmt oder geschaffen wurden.
    reason: textual_variant
  - marker: b
    text: „Festgesetzte Zeit“ gibt ein Wort wieder, das auch „Alter“, „Lebenszeit“ oder „Frist“ bedeuten kann. Gemeint ist hier wahrscheinlich die ihnen bis zum endgültigen Gericht zugeteilte Zeit.
    reason: lexical_alternative
  - marker: c
    text: 'Auch wörtlich: „und diese Zeit ist groß“. Das Adjektiv kann sich hier auf die Länge der Zeit beziehen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: መካናት
  choice: Orte
  rationale: Die allgemeine Bezeichnung wahrt die visionäre Topografie, ohne die Orte näher als Kammern oder Wohnstätten zu bestimmen.
- source_word: ይነብርዎሙ
  choice: damit sie dort wohnen
  rationale: Das Verb bezeichnet Wohnen oder Verbleiben; „wohnen“ gibt den fortdauernden Aufenthalt natürlich wieder.
- source_word: እስከ ዕለተ ኵነኔሆሙ
  choice: bis zum Tag ihres Gerichts
  rationale: „Gericht“ bewahrt den richterlich-eschatologischen Sinn, ohne das Ergebnis vorschnell als Verurteilung festzulegen.
- source_word: አመ ዕድሜሆሙ
  choice: bis zu ihrer festgesetzten Zeit
  rationale: ዕድሜ kann Alter, Lebenszeit oder Frist bezeichnen; im Kontext ist eine zugeteilte Frist gemeint.
- source_word: ዘየዓቢ
  choice: ist lang
  rationale: Das Grundwort bedeutet „groß“, kann sich bei einer Zeitangabe jedoch auf lange Dauer beziehen; der Haupttext gibt hier die kontextuelle Bedeutung wieder, während die Fußnote die formnähere Alternative festhält.
- source_word: ኵነኔ ዐቢይ በላዕሌሆሙ
  choice: des großen Gerichts über sie
  rationale: Die nominale Fügung bleibt erhalten und vermeidet einen im Ausgangstext nicht ausdrücklich vorhandenen Zusatz wie „kommt“.
- source_word: †ገብሩ†
  choice: wurden ... geschaffen
  rationale: Die textlich unsichere Form wird als passivisch beziehungsweise unpersönlich verstandenes „wurden gemacht“ wiedergegeben; die Unsicherheit wird angemerkt.
theological_decisions:
- issue: Bedeutung von ኵነኔ
  choice: Gericht
  alternative: Verurteilung / Urteilsspruch
  rationale: Der Ausdruck ist richterlich und eschatologisch, legt aber für sich allein das Ergebnis nicht so eng fest wie „Verurteilung“.
- issue: Charakter der abschließenden Gerichtsformulierung
  choice: bis zur Zeit des großen Gerichts über sie
  alternative: bis das große Gericht über sie kommt
  rationale: Die nominale Gestalt des ge’ezischen Textes und dessen Betonung der festgesetzten Zeiten werden bewahrt, ohne ein zusätzliches Verb einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem ge’ezischen Zeitgefüge, wird aber durch ein Semikolon lesbarer gemacht. Sämtliche Fußnotenmarker stehen im Haupttext.
