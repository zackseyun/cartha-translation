base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/009.yaml
  text: And he answered me and said to me[a], “These three have been made so that the spirits of the dead might be separated. And thus a division has been made for the spirits of the righteous, where there is a spring of water[e][d][c][b], with light above it.”
translation:
  language: de
  text: 'Und er antwortete mir und sagte zu mir: »Diese drei Bereiche wurden geschaffen[a], damit die Geister der Toten voneinander getrennt würden. Und so wurde für die Geister der Gerechten ein Bereich abgetrennt[b]: Dort ist eine Wasserquelle[c], und darüber ist Licht[d].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nur: »Diese drei wurden geschaffen.« Aus dem Zusammenhang sind drei Bereiche oder Abteilungen gemeint.'
    reason: implicit_context
  - marker: b
    text: 'Das Ge’ez wiederholt hier dieselbe Wortwurzel wie zuvor bei »getrennt«. Wörtlicher: »Und so wurde es für die Geister der Gerechten abgetrennt.« Das Bezugswort von »es« bleibt unausgesprochen.'
    reason: alternative_reading
  - marker: c
    text: 'Auch möglich: »eine Quelle von Wasser« oder »ein Wasserquell«.'
    reason: lexical_alternative
  - marker: d
    text: Die knappe Wendung lautet sinngemäß »darüber Licht«. Das Licht kann über der Quelle oder über dem Bereich der Gerechten gedacht sein.
    reason: referent_ambiguity
lexical_decisions:
- source_word: ፫ትገብሩ
  choice: Diese drei Bereiche wurden geschaffen
  rationale: Die Form verbindet die Zahl »drei« mit einem passivischen Sinn von »machen«. »Bereiche« wird aus den zuvor beschriebenen Hohlräumen beziehungsweise Abteilungen erschlossen und macht den Bezug im Deutschen verständlich, ohne die räumliche Bildwelt aufzugeben.
- source_word: ይትፈለጠ / ተፈልጠ
  choice: voneinander getrennt würden / ein Bereich abgetrennt
  rationale: Die wiederholte Wortwurzel wird durch »getrennt« und »abgetrennt« hörbar bewahrt. Beim zweiten Vorkommen ergänzt »ein Bereich« das im Ge’ez nur implizite Bezugswort, damit der deutsche Satz verständlich bleibt.
- source_word: መንፈሶሙ
  choice: die Geister
  rationale: »Geister« entspricht dem wiederholten anthropologischen Ausdruck in dieser Vision unmittelbarer als »Seelen« und vermeidet eine unnötige dogmatische Festlegung.
- source_word: ምዉታን
  choice: der Toten
  rationale: Die kollektive Bezeichnung wird schlicht und idiomatisch wiedergegeben.
- source_word: ጻድቃን
  choice: der Gerechten
  rationale: »Die Gerechten« ist die natürliche deutsche Wiedergabe für die im Gericht als gerecht geltende Gruppe.
- source_word: ነቅዐ ማይ
  choice: eine Wasserquelle
  rationale: Der Ausdruck bezeichnet einen Quellort beziehungsweise Ursprung von Wasser. »Wasserquelle« bewahrt das konkrete Bild und klingt im Deutschen natürlich.
- source_word: በላዕሌሁ ብርሃን
  choice: darüber ist Licht
  rationale: Die knappe räumliche Formulierung des Ge’ez bleibt erhalten. »Darüber« lässt offen, ob das Licht über der Quelle oder über dem ganzen abgetrennten Bereich ist.
theological_decisions:
- issue: Bezeichnung der Verstorbenen in den Bereichen der Unterwelt
  choice: Geister der Toten
  alternative: Seelen der Toten
  rationale: »Geister« gibt den Quellbegriff in diesem visionären Zusammenhang direkt wieder und trägt keine spätere systematische Anthropologie in den Text ein.
- issue: Beschaffenheit des den Gerechten zugewiesenen Ortes
  choice: ein abgetrennter Bereich mit Wasserquelle und Licht darüber
  alternative: Die Gerechten selbst bilden die dritte Abteilung; oder Quelle und Licht sind nicht räumlich auf einen eigenen Bereich bezogen
  rationale: Der Zusammenhang legt einen besonderen Ort für die Geister der Gerechten nahe. Die genaue Beziehung des Lichts zur Quelle oder zum gesamten Bereich bleibt jedoch bewusst offen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die feierliche Doppelung »antwortete mir und sagte zu mir« sowie die räumlich-apokalyptische Bildsprache bleiben erhalten. Implizite Bezugswörter werden nur dort ergänzt, wo ein verständlicher deutscher Satz es erfordert; echte Mehrdeutigkeit wird in den Fußnoten ausgewiesen.
