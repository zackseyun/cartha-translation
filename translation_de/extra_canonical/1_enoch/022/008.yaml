base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/008.yaml
  text: 'And at that time I asked concerning him and concerning the judgment of all: for what reason were they separated[c][b][a], one from another?'
translation:
  language: de
  text: 'Und zu jener Zeit fragte ich nach ihm[a] und nach dem Gericht über alle: Aus welchem Grund waren sie voneinander getrennt?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit „ihm“ ist wahrscheinlich Abels Geist aus dem vorhergehenden Vers gemeint. Die entsprechenden Wörter sind in der zugrunde liegenden Transkription zwar als textlich unsicher markiert, doch das ge’ezische Suffix und die griechische Überlieferung stehen im Singular.
    reason: textual_variant
lexical_decisions:
- source_word: ውእተ፡ ጊዜ
  choice: zu jener Zeit
  rationale: Die erzählerische Zeitformel wird in einem gehobenen, aber gegenwärtigen Standarddeutsch wiedergegeben.
- source_word: ተስእልኩ
  choice: fragte ich
  rationale: Die einfache Verbform des Fragens bleibt direkt und verständlich; die Gegenstände der Frage folgen in den Präpositionalgruppen.
- source_word: በእንቲአሁ
  choice: nach ihm
  rationale: Das Suffix ist maskulin Singular und bezeichnet daher „ihn“, nicht „sie“. Im Zusammenhang verweist es wahrscheinlich auf Abels Geist aus dem vorhergehenden Vers.
- source_word: ኵነኔ፡ ኵሉ
  choice: das Gericht über alle
  rationale: „Gericht“ bewahrt den umfassenden richterlichen Sinn, ohne ihn auf Strafe oder Verurteilung einzuengen. „Über alle“ ist im Deutschen natürlicher als „aller“ und lässt den universalen Umfang bestehen.
- source_word: በእንተ፡ ምንት
  choice: aus welchem Grund
  rationale: Die Wendung fragt ausdrücklich nach dem Grund der Trennung und wahrt den leicht gehobenen Ton.
- source_word: ተፈልጡ
  choice: waren sie getrennt
  rationale: Die passive Trennung der zuvor beschriebenen Bereiche oder Gruppen wird sachlich wiedergegeben, ohne deren genaue Identität im Vers festzulegen.
- source_word: ፩እምነ፡ ፩
  choice: voneinander
  rationale: Dies ist die natürliche deutsche Entsprechung der reziproken Wendung „einer vom anderen“.
theological_decisions:
- issue: Bedeutungsumfang von ኵነኔ („Gericht“)
  choice: das Gericht über alle
  alternative: die Bestrafung aller
  rationale: Der Begriff hat einen richterlichen Sinn, der Bestrafung einschließen kann, aber nicht darauf beschränkt ist. Die weitere Formulierung bewahrt die Spannung zwischen Urteil, Zuweisung und möglicher Strafe.
- issue: Bezug des Singularpronomens
  choice: ihm, wahrscheinlich Abels Geist
  alternative: ihnen, bezogen auf die Gruppen oder Orte
  rationale: Das ge’ezische Suffix ist maskulin Singular; auch die griechische Parallele stützt den Singular. Damit wird der konkrete Bezug nicht zugunsten einer verallgemeinernden pluralischen Lesart verwischt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am ge’ezischen Wortlaut, während „voneinander“ und „Gericht über alle“ natürlich deutsch formuliert sind. Der nicht ausdrücklich bestimmte Bezug von „sie“ bleibt erhalten.
