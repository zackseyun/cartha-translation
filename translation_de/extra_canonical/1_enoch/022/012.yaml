revisions:
- from: Und so wurde für die Seelen jener eine Abteilung geschaffen, die ihre Klage erheben[a] und ihr Verderben bekannt machen[b], als sie in den Tagen der Sünder getötet wurden.[c]
  to: Und so wurde eine Abteilung für die Seelen derer abgesondert, die ihre Klage erheben[a] und ihr Verderben kundtun[b], als sie in den Tagen der Sünder getötet wurden.[c]
  rationale: Die Revision ersetzt die schöpfungssprachliche Zuspitzung „geschaffen“ durch „abgesondert“, das den Sinn der Trennung wahrt. „Kundtun“ ist stilistisch und semantisch passender. Die Kontextnote wurde auf eine nicht-dogmatische, im Kapitelzusammenhang verankerte Aussage beschränkt.
