base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/012.yaml
  text: And thus a division has been made for the souls of those who make their complaint[d][c][b][a], who make known their destruction when they were slain in the days of the sinners.
translation:
  language: de
  text: Und so wurde eine Abteilung für die Seelen derer abgesondert, die ihre Klage erheben[a] und ihr Verderben kundtun[b], als sie in den Tagen der Sünder getötet wurden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die aufschreien“ oder „Anklage erheben“. Das geezische Verb kann Klage, Aufschrei oder Protest bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Ihr Verderben“ kann hier besonders die gewaltsame Art ihres Todes meinen.
    reason: lexical_alternative
  - marker: c
    text: Der Vers setzt die Beschreibung voneinander getrennter Bereiche für die Toten im Totenreich fort; die Getöteten warten dort auf das Gericht.
    reason: context
lexical_decisions:
- source_word: ተፈልጠ
  choice: wurde … eine Abteilung geschaffen
  rationale: Die Passivform bezeichnet ein Absondern oder Einteilen. Im Zusammenhang der voneinander getrennten Aufenthaltsorte der Toten gibt „eine Abteilung geschaffen“ den räumlichen Sinn natürlich wieder, ohne die Art der Trennung näher festzulegen.
- source_word: ለነፍሰ
  choice: für die Seelen
  rationale: Die Präposition hat hier dativischen bzw. zuweisenden Sinn; der Plural ergibt sich aus den folgenden Relativsätzen.
- source_word: እለ ይስክዩ
  choice: die ihre Klage erheben
  rationale: Das Verb kann Klagen, Aufschreien oder Anklagen bezeichnen. „Ihre Klage erheben“ bewahrt sowohl den Ausdruck des Leids als auch den möglichen forensischen Protest.
- source_word: እለ ያርእዩ
  choice: und … bekannt machen
  rationale: Das Verb bedeutet zeigen, offenbaren oder bekannt machen. Die Formulierung ist im Deutschen natürlich und lässt den möglichen Zeugnischarakter offen.
- source_word: በእንተ ሕጉለት
  choice: ihr Verderben
  rationale: Die Wendung bezeichnet ihr Verderben, ihren Untergang oder ihr gewaltsames Ende. „Verderben“ bleibt nahe am breiten Bedeutungsumfang, während eine Fußnote die kontextuell mögliche Verengung erläutert.
- source_word: አመ ተቀትሉ
  choice: als sie … getötet wurden
  rationale: Die passive Form bezeichnet eindeutig das Getötetwerden. „Getötet“ ist gegenwärtiges, würdevolles Standarddeutsch und legt gegenüber „ermordet“ keine zusätzliche rechtliche Wertung fest.
- source_word: በመዋዕለ ኃጥኣን
  choice: in den Tagen der Sünder
  rationale: Die zeitliche Wendung charakterisiert die Epoche durch die Sünder und bewahrt den für die Henochliteratur typischen apokalyptischen Gegensatz.
theological_decisions:
- issue: Ob die Seelen allgemein wehklagen oder wegen ihres gewaltsamen Todes Anklage erheben
  choice: die ihre Klage erheben
  alternative: die aufschreien; die Anklage erheben
  rationale: Der Kapitelzusammenhang erinnert an das Blut Abels, das nach Gerechtigkeit ruft. Die gewählte Formulierung hält Trauer und forensischen Protest zugleich offen und löst die Spannung nicht einseitig auf.
- issue: Ob ሕጉለት allgemein Verderben oder speziell die gewaltsame Todesart bezeichnet
  choice: ihr Verderben
  alternative: ihr gewaltsames Ende
  rationale: Der weitere Ausdruck wird im Haupttext bewahrt; die durch den Zusammenhang naheliegende Bedeutung des gewaltsamen Todes wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Abteilung“ bewahrt den räumlich-gerichtlichen Zusammenhang, „ihre Klage erheben“ die Mehrdeutigkeit zwischen Trauer und Anklage. Sämtliche Fußnotenmarker stehen in aufsteigender Reihenfolge im Haupttext.
