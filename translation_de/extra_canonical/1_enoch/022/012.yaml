  naturalness: Der Satz ist insgesamt gut verständlich und registergerecht. „Abteilung abgesondert“ wäre im Deutschen unnötig tautologisch; „eine Abteilung ... abgesondert“ ist hingegen eine natürliche, knappe Formulierung. „Kundtun“ ist in diesem würdevollen Kontext idiomatischer als „bekannt machen“.
  terminology: „Seelen“, „Klage erheben“, „Verderben“, „getötet wurden“ und „Sünder“ sind angemessen. Die Kontextnote sollte nicht von „Rechtfertigung“ sprechen, da dies im modernen theologischen Deutsch leicht als paulinisch-dogmatischer Fachbegriff missverstanden wird und über den Vers hinausgeht.
