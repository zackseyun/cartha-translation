base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/003.yaml
  text: 'And at that time Raphael[a], one of the holy angels who was with me, answered and said to me, “These hollow places were made so that the spirits, the souls of the dead, might be gathered into them[c][b]. For this purpose they were created here: that they might gather all the souls of the children of men.”'
translation:
  language: de
  text: 'Damals antwortete Raphael, einer der heiligen Engel, der bei mir war, und sagte zu mir: »Diese schönen Orte[a] wurden geschaffen, damit die Geister – die Seelen der Toten[b] – in ihnen versammelt würden. Dazu wurden sie hier erschaffen: damit sie alle Seelen der Menschenkinder in sich sammeln.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »guten Orte«. Der überlieferte äthiopische Text hat »gut/schön«; eine griechische Textüberlieferung liest dagegen »hohl/ausgehöhlt«.'
    reason: textual_variant
  - marker: b
    text: Der Vers gebraucht sowohl »Geister« als auch »Seelen«. Wahrscheinlich stehen die Ausdrücke hier erläuternd nebeneinander und bezeichnen nicht zwei klar getrennte Kategorien.
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአ
  choice: antwortete
  rationale: Das Verb leitet im erzählenden Zusammenhang eine Erwiderung ein; zusammen mit »sagte zu mir« bleibt die formelhafte Doppelung des Ausgangstextes erhalten.
- source_word: ቅዱሳን መላእክት
  choice: heilige Engel
  rationale: Die geläufige apokalyptische Bezeichnung wird in natürlichem und theologisch offenem Deutsch wiedergegeben.
- source_word: ዝመካናት ሰናያት
  choice: diese ausgehöhlten Orte[a]
  rationale: »Orte« bewahrt die räumliche Unbestimmtheit. »Ausgehöhlt« folgt der kontextuell passenden, textkritisch erschlossenen griechischen Lesart κοῖλοι; die tatsächlich bezeugte äthiopische Lesart »gut/schön« wird in der Fußnote ausdrücklich dokumentiert.
- source_word: ይትጋብኡ ዲቤሆን
  choice: damit in ihnen ... versammelt würden
  rationale: Die passive beziehungsweise reflexive Bedeutung des Sammelns und die Aufnahme in die dafür bestimmten Orte werden idiomatisch wiedergegeben.
- source_word: መናፍስት ለነፍሶሙ ለምዉታን
  choice: die Geister – die Seelen der Toten –
  rationale: Beide anthropologischen Begriffe bleiben erhalten; Gedankenstriche kennzeichnen »die Seelen der Toten« als wahrscheinliche Apposition, ohne eine scharfe begriffliche Trennung zu behaupten.
- source_word: ሎቱ ዝንቱ
  choice: Dazu
  rationale: Die knappe deutsche Zweckangabe gibt den erklärenden Übergang natürlich wieder.
- source_word: ተፈጥሩ
  choice: wurden ... erschaffen
  rationale: »Erschaffen« bewahrt die Aussage einer absichtsvollen Hervorbringung.
- source_word: ያስተጋብኡ
  choice: damit sie ... in sich sammeln
  rationale: Die aktive beziehungsweise kausative Wiederholung des Sammelmotivs bleibt erhalten; das Pronomen bezieht sich wie im Zusammenhang am ehesten auf die Orte.
- source_word: ኵሎ ነፍሰ ውሉደ ሰብእ
  choice: alle Seelen der Menschenkinder
  rationale: Die kollektive Aussage und die alte anthropologische Wendung werden bewahrt, ohne sie zu »Menschheit« zu verallgemeinern.
theological_decisions:
- issue: Verhältnis von »Geistern« und »Seelen der Toten«
  choice: 'Beide Ausdrücke werden appositionell wiedergegeben: »die Geister – die Seelen der Toten –«.'
  alternative: Die Begriffe könnten als verschiedene Kategorien verstanden oder zu »Geister der Toten« zusammengezogen werden.
  rationale: Der äthiopische Text verwendet beide Wörter. Die appositionelle Fassung bewahrt diese Doppelung und vermeidet zugleich, dem Vers eine ausgearbeitete Zweiteilung des Menschen aufzuzwingen.
- issue: Textkritische Lesart der beschriebenen Orte
  choice: Im Haupttext steht »ausgehöhlten Orte«, mit ausdrücklicher Fußnote zur äthiopischen Lesart »guten/schönen Orte«.
  alternative: Dem überlieferten äthiopischen Wortlaut unmittelbar folgen und »diese schönen Orte« schreiben.
  rationale: Die griechische Lesart κοῖλοι (»hohl, ausgehöhlt«) passt zum unmittelbaren Bild der Vertiefungen; das äthiopische ሰናያት bedeutet dagegen »gut, schön«. Da die äthiopische Überlieferung tatsächlich abweicht, wird die Spannung nicht verschwiegen.
- issue: Umfang der Wendung »Menschenkinder«
  choice: Die traditionelle Wendung »Menschenkinder« bleibt stehen.
  alternative: »Menschen« oder »alle menschlichen Seelen«.
  rationale: Die Formulierung wahrt den apokalyptischen Sprachklang und den kollektiven Umfang, ohne eine geschlechtsspezifische Einschränkung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem Erzählton. Die formelhafte Verbindung »antwortete ... und sagte« sowie »Menschenkinder« bewahren den apokalyptischen Charakter; Satzbau und Wortwahl bleiben dennoch allgemein verständlich.
