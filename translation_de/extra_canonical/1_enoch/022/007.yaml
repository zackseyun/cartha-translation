base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/007.yaml
  text: And he answered me and said to me[a], “This is the spirit that came out from Abel, whom Qayin his brother killed; and it makes accusation against him until his seed is destroyed from before the face of the earth[d][c][b], and his seed is blotted out from among the seed of men.”
translation:
  language: de
  text: Und er antwortete mir und sagte zu mir:[a] „Dies ist der Geist, der aus Abel hervorging, den sein Bruder Qajin tötete. Er erhebt Anklage gegen ihn,[b] bis dessen Same vom Angesicht der Erde vernichtet ist[c] und dessen Same aus der Nachkommenschaft der Menschen getilgt ist.“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die überlieferte Redeformel enthält sowohl „er antwortete mir“ als auch das in dieser Textgestalt eingeklammerte „und sagte zu mir“.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich bzw. alternativ: „Er klagt ihn an.“ Die gewählte Formulierung hebt den gerichtlichen Sinn der fortdauernden Klage von Abels Geist hervor.'
    reason: lexical_alternative
  - marker: c
    text: „Same“ bezeichnet hier die Nachkommenschaft und wird zweimal beibehalten, um die wiederholte genealogische Gerichtssprache der Quelle sichtbar zu machen.
    reason: lexical_alternative
lexical_decisions:
- source_word: አውሥአኒ / ወይቤለኒ / እንዘ ይብል
  choice: er antwortete mir und sagte zu mir
  rationale: Beide Verben samt Ich-Suffix werden wiedergegeben. Die zusätzliche geezische Redeeinleitung wird im Deutschen nicht nochmals mit „indem er sagte“ ausgedrückt, da dies die übliche Redeformel unnötig verdoppeln würde.
- source_word: መንፈስ
  choice: Geist
  rationale: Im Kontext der Unterweltsvision bezeichnet das Wort Abels fortbestehenden, personal vorgestellten Geist; „Geist“ wahrt diese apokalyptische Aussage.
- source_word: ዘወጽአ እምአቤል
  choice: der aus Abel hervorging
  rationale: „Hervorging“ bewahrt das Bild des Austretens, ohne im Deutschen unbeholfen zu klingen.
- source_word: ዘቀተሎ ቃየን እኁሁ
  choice: den sein Bruder Qajin tötete
  rationale: Die natürliche deutsche Wortstellung macht die verwandtschaftliche Beziehung eindeutig; „Qajin“ folgt dem Namen der Quelltradition.
- source_word: ይሰኪ ኪያሁ
  choice: er erhebt Anklage gegen ihn
  rationale: Die Wendung bringt den fortdauernden gerichtlichen Charakter deutlicher zum Ausdruck als das allgemeinere „er klagt ihn an“.
- source_word: ይትኀጐል ዘርኡ
  choice: dessen Same ... vernichtet ist
  rationale: „Same“ erhält die wiederholte genealogische Bildsprache; „dessen“ klärt im Deutschen, dass Kains Linie gemeint ist.
- source_word: እምቅድመ ገጸ ለምድር
  choice: vom Angesicht der Erde
  rationale: Dies ist die geläufige, würdevolle deutsche Entsprechung der semitisch geprägten Formel.
- source_word: ይማስን ዘርኡ / እምዘርአ ሰብእ
  choice: dessen Same aus der Nachkommenschaft der Menschen getilgt ist
  rationale: „Getilgt“ wahrt die Kraft des Auslöschens. Beim letzten Vorkommen verdeutlicht „Nachkommenschaft“ den Sinn des erneut verwendeten Quellworts, während „dessen Same“ die Wiederholung sichtbar hält.
theological_decisions:
- issue: Bezeichnung von Abels postmortaler Gegenwart
  choice: Geist
  alternative: Seele; Stimme; Schatten
  rationale: Die Quelle verwendet ausdrücklich መንፈስ. Die Übersetzung bewahrt die personale und apokalyptische Vorstellung, ohne sie dogmatisch näher zu bestimmen.
- issue: Gericht über Qajins Linie
  choice: dessen Same ... vernichtet; dessen Same ... getilgt
  alternative: dessen Nachkommen sterben; seine Nachkommenschaft wird abgeschnitten
  rationale: Die wiederholte Samen-Sprache und die parallelen Gerichtsformulierungen bleiben erkennbar; zugleich vermeidet „dessen“ eine falsche Zuordnung des Pronomens zu Abel.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst bewahrter apokalyptischer Bildsprache. Die semitische Formel „vom Angesicht der Erde“ und die Wiederholung von „Same“ bleiben erhalten; unnötige Verdopplungen der Redeeinleitung werden idiomatisch geglättet.
