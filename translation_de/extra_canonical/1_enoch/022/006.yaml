base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/006.yaml
  text: At that time I asked Raphael[a], the angel who was with me, and I said to him[c][b], “This spirit whose voice reaches thus and accuses—to whom does it belong?”
translation:
  language: de
  text: 'Zu jener Zeit fragte ich Rafael, den Engel, der bei mir war, und sagte zu ihm: »Dieser Geist, dessen Stimme auf diese Weise dringt und Anklage erhebt – wem gehört er?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Dieser Geist, dessen Stimme auf diese Weise dringt und fleht – wem gehört er?« Das letzte Verb kann auch eine dringliche Bitte oder Klage bezeichnen. Der folgende Vers identifiziert den Geist als den Geist Abels.'
    reason: lexikalische Alternative und Kontextverweis
lexical_decisions:
- source_word: ውእቱ፡ ጊዜ
  choice: Zu jener Zeit
  rationale: Die geläufige erzählerische Zeitangabe wahrt den gehobenen apokalyptischen Ton und klingt zugleich natürlich.
- source_word: ተስእልክዎ
  choice: fragte ich
  rationale: Das Verb leitet unmittelbar Henochs Frage an den begleitenden Engel ein.
- source_word: ለሩፋኤል፡ መልአክ
  choice: Rafael, den Engel
  rationale: Die Apposition folgt der Struktur des ge'ezischen Textes; die im Deutschen übliche Namensform lautet Rafael.
- source_word: እንዘ፡ ሀሎ፡ ምስሌየ
  choice: der bei mir war
  rationale: Die Wendung kennzeichnet Rafael idiomatisch als den gegenwärtigen Begleiter Henochs.
- source_word: ዝመንፈስ
  choice: dieser Geist
  rationale: መንፈስ bezeichnet hier den Geist eines Verstorbenen; »Geist« bewahrt die Ausdrucksweise, ohne eine spätere anthropologische Systematik einzutragen.
- source_word: ዘከመዝ፡ ቃሉ፡ ይበጽሕ
  choice: dessen Stimme so weit dringt
  rationale: ቃል bezeichnet im Zusammenhang den hörbaren Ruf, daher »Stimme«; ይበጽሕ vermittelt das Erreichen beziehungsweise Vordringen. »So weit dringt« ist im Deutschen verständlich und wahrt die Bildlichkeit.
- source_word: ወይሰኪ
  choice: und Anklage erhebt
  rationale: Das Verb hat hier im Zusammenhang mit Abels Ruf gegen Kain einen forensischen Sinn. Die feste deutsche Wendung gibt diesen deutlicher und natürlicher wieder als ein bloßes »bittet«.
theological_decisions:
- issue: Ob መንፈስ als »Geist« oder »Seele« wiederzugeben ist
  choice: Geist
  alternative: Seele
  rationale: »Geist« entspricht dem ge'ezischen Ausdruck unmittelbar und lässt die genaue Anthropologie der Unterweltszene offen.
- issue: Ob der letzte Verbalbegriff Bitte, Klage oder Anklage bezeichnet
  choice: Anklage erhebt
  alternative: fleht / bringt eine Bitte vor
  rationale: Der Kontext identifiziert den Ruf als denjenigen Abels gegen Kain und stützt die forensische Bedeutung. Die Fußnote hält die lexikalisch mögliche Auffassung als dringliche Bitte fest.
- issue: Wie die Zugehörigkeitsfrage des Geistes auszudrücken ist
  choice: Wem gehört dieser Geist
  alternative: Wessen ist dieser Geist
  rationale: Die gewählte Form ist modernes, natürliches Deutsch und fragt nach der Identität des Geistes, ohne dessen ontologischen Status näher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die apokalyptische Bildsprache und der forensische Zug des Rufes bleiben erhalten; schwerfällige Wörtlichkeit und konfessionell geprägte Deutungen werden vermieden.
