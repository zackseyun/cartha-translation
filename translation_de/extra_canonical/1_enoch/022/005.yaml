base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/005.yaml
  text: And I saw the spirits of the children of men who were dead[b][a], and their voice reached to heaven and cried out.
translation:
  language: de
  text: Und ich sah die Geister der Menschenkinder, die tot waren; ihre Stimme drang bis zum Himmel und klagte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und sie riefen um Hilfe“ beziehungsweise „und sie erhoben Anklage“. Das letzte Verb kann eine Klage, eine Bitte um Beistand oder eine Anklage bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ርኢኩ
  choice: ich sah
  rationale: Die schlichte visionäre Berichtsform wird unmittelbar und in heutigem Deutsch wiedergegeben.
- source_word: መናፍስተ
  choice: die Geister
  rationale: „Geister“ entspricht dem äthiopischen Ausdruck und vermeidet die stärker deutende Wiedergabe „Seelen“.
- source_word: ውሉደ ሰብእ
  choice: die Menschenkinder
  rationale: Die gehobene semitische Kollektivbezeichnung bleibt erhalten, ohne eine christologische Titelbedeutung anzudeuten.
- source_word: እንዘ ሙታን ውእቶሙ
  choice: die tot waren
  rationale: Diese formal nahe Wiedergabe bewahrt den beschriebenen Todeszustand und deutet ihn nicht weiter aus.
- source_word: ቃሎሙ
  choice: ihre Stimme
  rationale: Der Singular des Ausgangstextes wird bewahrt; „Stimme“ ist weniger interpretierend als „Klagegeschrei“.
- source_word: ይበጽሕ እስከ ሰማይ
  choice: drang bis zum Himmel
  rationale: Die Formulierung gibt sowohl das Erreichen als auch die aufwärtsgerichtete Bildsprache natürlich wieder.
- source_word: ወይስኪ
  choice: sie klagten
  rationale: „Klagen“ wahrt die mögliche Bedeutung als Hilferuf, Beschwerde oder Anklage besser als eine ausschließlich juristische Formulierung.
theological_decisions:
- issue: Art der Äußerung der Toten
  choice: Die Geister der Toten erheben eine bis zum Himmel dringende Klage.
  alternative: Ihre Stimme ruft lediglich laut; oder sie bringen ausdrücklich eine Bitte beziehungsweise Anklage vor.
  rationale: Der Text stellt die Toten als Geister mit einer zum Himmel dringenden Stimme dar, legt aber nicht eindeutig fest, ob ihre Äußerung Klage, Bitte oder förmliche Anklage ist. Diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht gehobenem apokalyptischem Ton. „Menschenkinder“ bewahrt die Ausdrucksweise des Ausgangstextes; der Wechsel von „ihre Stimme“ zum pluralischen „sie klagten“ macht im Deutschen deutlich, dass die Geister die Handelnden sind.
