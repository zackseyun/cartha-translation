base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/010.yaml
  text: And so it was made for sinners[a], when they die and are buried in the earth[c][b], and judgment has not come upon them during their lifetime.
translation:
  language: de
  text: 'Und so wurde es für die Sünder[a] geschaffen[b]: wenn sie sterben und in der Erde begraben werden[c] und das Gericht zu ihren Lebzeiten nicht über sie gekommen ist.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Und so“ verweist wahrscheinlich auf die zuvor beschriebenen, voneinander getrennten Bereiche für die Toten und ordnet auch diesen Fall jener Gliederung zu.
    reason: cross_reference
  - marker: b
    text: „Geschaffen“ kann hier auch im Sinn von „eingerichtet“ oder „bestimmt“ verstanden werden. Was geschaffen wurde, wird in diesem Satz nicht ausdrücklich wiederholt, sondern ist aus dem Zusammenhang zu ergänzen.
    reason: lexical_alternative
  - marker: c
    text: 'Auch möglich: „Und so wurde es für die Sünder geschaffen, wenn sie sterben und in der Erde begraben werden und das Gericht zu ihren Lebzeiten nicht über sie gekommen ist.“ Der Doppelpunkt macht deutlicher, dass der folgende Satzteil die betreffenden Sünder kennzeichnet.'
    reason: syntactic_alternative
lexical_decisions:
- source_word: በከመ፡ ከማሁ
  choice: Und so
  rationale: Die verbundenen Vergleichspartikeln knüpfen an die zuvor beschriebene Ordnung an und drücken eine Entsprechung aus.
- source_word: ተፈጥረ
  choice: wurde es … geschaffen
  rationale: Das passive Perfekt bezeichnet eine bereits eingerichtete oder geschaffene Ordnung. Das Pronomen bleibt wie im Ausgangstext inhaltlich vom vorangehenden Zusammenhang abhängig.
- source_word: ለኃጥኣን
  choice: für die Sünder
  rationale: Die Dativfügung bezeichnet diejenigen, für die diese Ordnung besteht; „Sünder“ entspricht dem gerichtlichen Kontext unmittelbar.
- source_word: ሶበ፡ ይመውቱ፡ ወይትቀበሩ
  choice: Wenn sie sterben und … begraben werden
  rationale: Die Wiedergabe erhält sowohl den temporalen Nebensatz als auch das Passiv des Begrabens.
- source_word: ውስተ፡ ምድር
  choice: in der Erde
  rationale: Im Bestattungskontext bewahrt „Erde“ das konkrete Grab- und Erdreichbild besser als das geografisch missverständliche „Land“.
- source_word: ወኵነኔ፡ ኢኮነ፡ በላዕሌሆሙ
  choice: und das Gericht … nicht über sie gekommen ist
  rationale: Die Formulierung gibt das Ausbleiben eines sie treffenden Gerichts wieder, ohne „Gericht“ stärker als Verurteilung festzulegen.
- source_word: በሕይወቶሙ
  choice: zu ihren Lebzeiten
  rationale: Die idiomatische deutsche Wendung macht den Gegensatz zwischen dem irdischen Leben und dem Zustand nach dem Tod deutlich.
theological_decisions:
- issue: Art der jenseitigen Bestimmung für die Sünder
  choice: Der Vers beschreibt eine für Sünder bestehende Ordnung, die zu Lebzeiten nicht vom Gericht getroffen wurden.
  alternative: Man könnte ausdrücklich von einem für sie erschaffenen „Ort“ oder „Abteil“ sprechen.
  rationale: Das Subjekt von „wurde geschaffen“ wird im Vers nicht erneut genannt, sondern ist aus dem vorhergehenden Zusammenhang zu ergänzen. Die Übersetzung fügt daher keinen ausdrücklich benannten Ort ein und legt weder Vernichtung noch Freispruch nahe.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe, kontextabhängige Aussage des ge'ezischen Textes bleibt erhalten; der Doppelpunkt verhindert, dass der Wenn-Satz irrtümlich nur den Zeitpunkt des Erschaffens bezeichnet.
