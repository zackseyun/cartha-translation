base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/002.yaml
  text: And there were four hollow places in it[a], deep and wide and very smooth; three of them were dark, and one was bright, and water was springing up in its midst. And I said, “How smooth these hollow places are[c][b], and deep and dark to look at.”
translation:
  language: de
  text: 'Und darin waren vier Hohlräume,[a] tief, weit und sehr glatt.[b] Drei von ihnen waren dunkel, einer war hell, und in der Mitte quoll Wasser hervor.[c] Da sagte ich: „Wie glatt[d] diese Hohlräume sind – und wie tief und dunkel sie anzusehen sind!“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der äthiopische Text enthält hier ein textkritisch unsicheres Wort, das möglicherweise „schön“ oder „gut“ bedeutet. Seine Verbindung mit dem Satz ist unklar.
    reason: textual_uncertainty
  - marker: b
    text: Der äthiopische Text ist an mehreren Stellen schwierig, besonders bei der Beschreibung der Hohlräume als „glatt“. Gemeint sein könnte, dass ihre Flächen steil oder wie poliert erschienen.
    reason: lexical_alternative
  - marker: c
    text: Manche verstehen die Aussage so, dass sich die Quelle oder der Wasserlauf in der Mitte des hellen Hohlraums befand.
    reason: alternative_reading
  - marker: d
    text: Möglicherweise ist hier ein stärkerer Ausdruck gemeint, etwa „spiegelglatt“ oder „steil und glatt“.
    reason: lexical_alternative
lexical_decisions:
- source_word: አርባዕቱ፡ መካናት
  choice: vier Hohlräume
  rationale: መካናት bezeichnet grundsätzlich Orte oder Räume; im Inneren des zuvor beschriebenen Felsgebildes sind räumliche Vertiefungen beziehungsweise Hohlräume gemeint.
- source_word: ዕሙቀ፡ ወርኂበ፡ ወልሙጸ፡ ጥቀ
  choice: tief, weit und sehr glatt
  rationale: 'Die drei eigenständigen Beschreibungen werden vollständig wiedergegeben: Tiefe, Weite und – durch ጥቀ verstärkt – Glätte. So bleibt insbesondere ርኂበ („weit“) erhalten.'
- source_word: ጸልማት፡ … ብርህት
  choice: dunkel … hell
  rationale: Die schlichte Gegenüberstellung gibt den sichtbaren Kontrast der drei dunklen Hohlräume zu dem einen hellen unmittelbar wieder.
- source_word: ነቅዐ፡ ማይ
  choice: quoll Wasser hervor
  rationale: Die Wendung bezeichnet hervortretendes oder hervorquellendes Wasser und nicht bloß ruhendes Wasser.
- source_word: በማእከላ
  choice: in der Mitte
  rationale: Die unbestimmte Formulierung vermeidet es, den nicht völlig eindeutigen Bezug ausdrücklich auf den hellen Hohlraum oder auf die gesamte Anlage festzulegen.
- source_word: ልሙጽ
  choice: glatt
  rationale: Das Wort beschreibt wahrscheinlich eine glatte, polierte oder steile Oberfläche. „Glatt“ bewahrt das konkrete Bild, ohne die unsichere Beschaffenheit genauer festzulegen.
- source_word: ለነጽሮ
  choice: anzusehen
  rationale: Der Infinitiv bezeichnet den visuellen Eindruck der Hohlräume; „anzusehen“ ist idiomatisches modernes Deutsch und wahrt den Beobachtungscharakter.
theological_decisions:
- issue: Sprecherformel nach der Beschreibung
  choice: Da sagte ich
  alternative: Da sah ich; bloßer Ausruf ohne Redeeinleitung
  rationale: Das überlieferte እቤ („ich sagte“) kennzeichnet die Worte als Reaktion des Sehers und bewahrt die rhetorische Form des Visionsberichts.
- issue: Bezug der Wasserquelle
  choice: in der Mitte
  alternative: in der Mitte des hellen Hohlraums
  rationale: Der Zusammenhang legt den hellen Hohlraum nahe, doch die knappe äthiopische Formulierung lässt den Bezug nicht völlig zweifelsfrei erkennen. Der Haupttext hält diese Spannung offen; die Fußnote nennt die verbreitete Konkretisierung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Reihung der räumlichen Eigenschaften folgt eng dem Ge’ez, während Gedankenstrich und Ausrufezeichen den natürlichen deutschen Ausruf des Sehers kenntlich machen. Unsichere lexikalische und syntaktische Einzelheiten werden nicht dogmatisch vereindeutigt.
