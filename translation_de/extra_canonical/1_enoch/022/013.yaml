base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/013.yaml
  text: And thus it has been made for the souls of the people who are not righteous[a], but sinners, who are complete in transgression, and they will be with the lawless like them[d][c][b]. But as for their souls...
translation:
  language: de
  text: Und so ist es für die Seelen der Menschen bestimmt worden[a], die nicht gerecht, sondern Sünder sind, die ganz von Übertretung erfüllt sind; und sie werden bei den Gesetzlosen, bei ihresgleichen, sein.[b] Was aber ihre Seelen betrifft …
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Verb kann auch mit „gemacht“, „bereitet“ oder „geschaffen“ wiedergegeben werden. Im Zusammenhang der für die Toten vorgesehenen Orte ist „bestimmt worden“ als Bezeichnung einer Zuordnung verstanden.
    reason: lexical_alternative
  - marker: b
    text: 'Die Schlusswendung ist schwer zu deuten. Sie kann bedeuten: „Sie werden bei den Gesetzlosen sein“, „sie werden wie jene sein“ oder beides zugleich.'
    reason: alternative_reading
lexical_decisions:
- source_word: ተፈጥረ
  choice: ist … bestimmt worden
  rationale: Das Verb kann „geschaffen“, „gemacht“, „bereitet“ oder „bestimmt“ bedeuten. Im Zusammenhang der für die Toten vorgesehenen Orte gibt „bestimmt worden“ die funktionale Zuordnung am natürlichsten wieder.
- source_word: ለነፍሶሙ፡ ለሰብእ
  choice: für die Seelen der Menschen
  rationale: Die lamed-Konstruktion bezeichnet die Empfänger beziehungsweise diejenigen, für die etwas bestimmt ist. „Menschen“ gibt das generische ሰብእ im heutigen Standarddeutsch verständlich wieder.
- source_word: ኢኮኑ፡ ጻድቃነ፡ አላ፡ ኃጥኣነ
  choice: die nicht gerecht, sondern Sünder sind
  rationale: Die für 1 Henoch kennzeichnende Gegenüberstellung von Gerechten und Sündern bleibt unmittelbar erhalten.
- source_word: ፍጹማነ፡ እበሳ
  choice: die ganz von Übertretung erfüllt sind
  rationale: Die Wendung bezeichnet eine vollständige oder gesteigerte Verstrickung in Vergehen. Die deutsche Formulierung bewahrt die Intensität, ohne unnatürlich „vollkommen in Sünde“ zu sagen.
- source_word: አባሲያን
  choice: die Gesetzlosen
  rationale: „Gesetzlose“ erhält den gerichtlichen und apokalyptischen Ton und unterscheidet den Ausdruck vom zuvor stehenden allgemeinen Wort „Sünder“.
- source_word: ይከውኑ፡ ከማሆሙ
  choice: sie werden bei den Gesetzlosen sein, ihresgleichen
  rationale: Die gedrängte Wendung kann Gemeinschaft mit den Gesetzlosen oder Gleichartigkeit mit ihnen ausdrücken. Die Formulierung lässt beide Bezüge anklingen; eine Fußnote weist auf die Unsicherheit hin.
- source_word: ወነፍሶሙሰ
  choice: Was aber ihre Seelen betrifft …
  rationale: Das Enklitikon -ሰ ist hier adversativ beziehungsweise topicalisierend. Die Wendung eröffnet offenbar den im folgenden Vers fortgesetzten Satz und darf nicht additiv als „auch ihre Seelen“ an den vorherigen Satz angeschlossen werden.
theological_decisions:
- issue: Schöpfung oder Bestimmung eines jenseitigen Loses
  choice: Bestimmung eines Ortes oder Loses für die Seelen
  alternative: Erschaffung der Seelen selbst
  rationale: Der unmittelbare Kontext handelt von abgesonderten Aufenthaltsorten der Toten. „Bestimmt worden“ passt dazu, ohne die grundsätzlich mögliche Bedeutung „geschaffen/gemacht“ zu verschweigen.
- issue: Bedeutung der Schlusswendung über die Gesetzlosen
  choice: Die Mehrdeutigkeit zwischen Zusammensein und Gleichartigkeit bleibt erhalten.
  alternative: Eine ausdrückliche Aussage über Vernichtung, Strafe oder Verwandlung
  rationale: Der äthiopische Text ist komprimiert und rechtfertigt keine nähere dogmatische Festlegung auf Art oder Vollzug des Gerichts.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher apokalyptischer Gerichtssprache. Das generische „Menschen“ vermeidet eine unnötig altertümliche Formulierung. Die Ellipse am Ende bleibt erhalten, weil der äthiopische Text in den folgenden Satz überleitet.
