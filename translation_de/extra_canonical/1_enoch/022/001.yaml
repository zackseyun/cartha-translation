base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/001.yaml
  text: And from there I went to another place[a], and he showed me in the west a great and high mountain[b], and a hard rock.
translation:
  language: de
  text: Und von dort ging ich an einen anderen Ort, und er zeigte mir im Westen einen großen und hohen Berg[a] und einen harten Felsen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich werden beide Eigenschaften bewahrt: Der Berg ist sowohl groß als auch hoch.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »ein fester Felsen« oder »ein massiver Felsen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እምህየ
  choice: von dort
  rationale: Bewahrt den räumlichen Übergang vom vorherigen Schauplatz in natürlichem modernem Deutsch.
- source_word: ሖርኩ
  choice: ging ich
  rationale: Gibt das Bewegungsverb in der ersten Person schlicht und ohne zusätzliche Nuance wieder.
- source_word: ካልአ መካነ
  choice: an einen anderen Ort
  rationale: Bezeichnet einen vom vorherigen Schauplatz verschiedenen Ort; die Formulierung ist idiomatisch und würdevoll.
- source_word: አርአየኒ
  choice: er zeigte mir
  rationale: Bewahrt die übliche Wendung eines geführten Visionsberichts, ohne den nicht ausdrücklich benannten Handelnden näher zu bestimmen.
- source_word: በምዕራብ
  choice: im Westen
  rationale: Gibt die lokative Richtungsangabe knapp und natürlich wieder.
- source_word: ደብረ ዐቢየ ወነዋኅ
  choice: einen großen und hohen Berg
  rationale: Erhält beide Eigenschaften des Berges, Größe und Höhe, statt sie in einem einzigen Adjektiv zusammenzufassen.
- source_word: ኵኵሐ ጽኑዐ
  choice: einen harten Felsen
  rationale: Gibt die körperliche Festigkeit des Gesteins wieder und bewahrt die markante Landschaftsschilderung; je nach Bedeutungsnuance ist auch »fest« oder »massiv« möglich.
theological_decisions:
- issue: Ob der führende Handelnde ausdrücklich als Engel bezeichnet werden soll
  choice: Das einfache Pronomen in »er zeigte mir« beibehalten
  alternative: »Der Engel zeigte mir« oder »mein Führer zeigte mir«
  rationale: Die geezische Verbform enthält lediglich ein männliches Subjekt der dritten Person. Der Zusammenhang kann einen Engel nahelegen, doch dieser Vers benennt ihn nicht ausdrücklich.
translation_notes:
  register: Modernes Standarddeutsch in schlichtem, würdevollem Erzählstil. Die wiederholte Satzverknüpfung mit »und« erhält den parataktischen Charakter des geezischen Textes; der ungenannte männliche Führer bleibt unbestimmt.
