base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/022/011.yaml
  text: Here their souls are set apart in this great affliction until the great day of judgment and punishment and affliction for those who curse forever; and vengeance on their souls. There he will bind them forever.
translation:
  language: de
  text: Hier werden ihre Seelen in dieser großen Qual abgesondert bis zum großen Tag des Gerichts, der Strafe und der Qual für diejenigen, die für immer verflucht sind,[a] und der Vergeltung an ihren Seelen. Dort wird er sie für immer binden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die für immer fluchen“. Die Verbform kann aktiv oder passiv verstanden werden; im Zusammenhang des Gerichts liegt die passive Bedeutung näher.'
    reason: lexical_alternative
  - marker: b
    text: 'Ein in der Textausgabe eingeklammerter, unsicherer Zusatz lautet etwa: „Und auch dies [war] vor der Welt.“ Er wurde nicht in den Haupttext aufgenommen.'
    reason: textual_variant
lexical_decisions:
- source_word: ይትፈለጠ
  choice: werden … abgesondert
  rationale: Die passive beziehungsweise reflexive Form bezeichnet eine Trennung oder Zuweisung zu einem besonderen Ort oder Zustand. „Abgesondert“ bewahrt sowohl den räumlichen als auch den gerichtlichen Beiklang.
- source_word: ነፍሳቲሆሙ
  choice: ihre Seelen
  rationale: Im Zusammenhang mit den Toten, die an abgesonderten Orten das Gericht erwarten, ist „Seelen“ die naheliegende und transparente Wiedergabe.
- source_word: ዐቢይ ጻዕር
  choice: diese große Qual
  rationale: ጻዕር kann Schmerz, Bedrängnis oder Qual bezeichnen. „Qual“ bringt das wirkliche Leiden deutlich zum Ausdruck, ohne dessen genaue Art festzulegen.
- source_word: ኵነኔ
  choice: Gericht
  rationale: Der Ausdruck ist hier ein gerichtlicher Begriff und steht in einer Reihe mit Strafe, Qual und Vergeltung. „Gericht“ ist die weiteste sachgerechte Wiedergabe.
- source_word: መቅሠፍት
  choice: Strafe
  rationale: Obwohl das Wort auch einen Schlag oder eine Plage bezeichnen kann, meint es in dieser apokalyptisch-gerichtlichen Aufzählung am ehesten die verhängte Strafe.
- source_word: ይረግሙ
  choice: verflucht sind
  rationale: Die Form lässt eine aktive oder passive Deutung zu. Im Zusammenhang des Gerichts ist die passive Wiedergabe plausibler; die aktive Möglichkeit wird in Fußnote [a] erhalten.
- source_word: በቀል ለነፍሶሙ
  choice: Vergeltung an ihren Seelen
  rationale: Die ge’ezische Wendung ist hier als Nominalphrase zu verstehen, die die vorhergehende Reihe fortsetzt, nicht als selbstständiger Satz mit einem ergänzten Verb.
- source_word: ይእስሮሙ
  choice: er wird sie … binden
  rationale: Die konkrete Bildsprache des Bindens bleibt erhalten. Das nicht ausdrücklich benannte singularische Subjekt wird entsprechend der Verbform als „er“ wiedergegeben.
- source_word: እስከ ለዓለም
  choice: für immer
  rationale: Die feste Wendung bezeichnet eine unbegrenzte Dauer; „für immer“ ist im modernen Deutschen natürlich und bewahrt die feierliche Endgültigkeit.
theological_decisions:
- issue: Ob die Seelen nur räumlich getrennt werden oder bereits vor dem großen Gericht leiden
  choice: „in dieser großen Qual abgesondert“ bewahrt sowohl die Absonderung als auch das gegenwärtige Leiden.
  alternative: Eine neutrale Verwahrung bis zum Gericht oder eine bereits vollständig vollzogene Endstrafe.
  rationale: Der ge’ezische Text verbindet ausdrücklich das Trennungsverb mit ጻዕር („Qual, Leiden“). Keine der beiden Aussagen soll zugunsten eines theologischen Systems abgeschwächt werden.
- issue: Aktive oder passive Deutung von ይረግሙ
  choice: Im Haupttext steht „die … verflucht sind“; die aktive Lesart wird in Fußnote [a] genannt.
  alternative: „die für immer fluchen“
  rationale: Die passive Deutung fügt sich besser in den Gerichtskontext, doch die morphologische beziehungsweise textliche Mehrdeutigkeit ist echt und wird nicht verschwiegen.
- issue: Das Subjekt von „wird … binden“
  choice: Das unbestimmte singularische „er“ bleibt stehen.
  alternative: „Gott wird sie binden“ oder unpersönlich „sie werden gebunden werden“.
  rationale: Die Verbform weist auf einen singularischen Handelnden, doch dieser wird im vorliegenden Vers nicht ausdrücklich benannt. Eine Identifizierung mit Gott wäre eine erklärende Ergänzung.
- issue: Syntaktische Funktion der Vergeltung
  choice: „und der Vergeltung an ihren Seelen“ gehört zur Aufzählung dessen, was der große Tag mit sich bringt.
  alternative: „und dort wird er an ihren Seelen Vergeltung üben“.
  rationale: ወበቀል ለነፍሶሙ ist eine Nominalphrase; ein zusätzliches Verb und ein vorgezogenes „dort“ würden die ge’ezische Satzstruktur verändern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholten Gerichtsbegriffe bleiben bewusst nebeneinander stehen. „Qual“ ist allgemein verständlich und kräftig; „Vergeltung an ihren Seelen“ wahrt die nominale Struktur des Ausgangstextes, auch wenn sie im Deutschen leicht fremdartig klingt.
