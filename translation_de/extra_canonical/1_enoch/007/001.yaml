base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/007/001.yaml
  text: And all the others with them took wives for themselves[a], and each chose one for himself.
translation:
  language: de
  text: Und alle anderen, die bei ihnen waren, nahmen sich Frauen[a], und jeder wählte eine für sich aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nahmen sich Ehefrauen“. Das geezische Substantiv kann allgemein Frauen bezeichnen; in dieser Konstruktion hat es häufig den Sinn „Ehefrauen“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ባዕዳን
  choice: die anderen
  rationale: Im Zusammenhang bezeichnet das Wort die übrigen Mitglieder der zuvor genannten Gruppe, nicht allgemein Fremde.
- source_word: ኵሉ
  choice: alle
  rationale: 'Die umfassende Bedeutung wird bewahrt: Die gesamte übrige Gruppe handelte ebenso.'
- source_word: ምስሌሆሙ
  choice: die bei ihnen waren
  rationale: Diese natürliche deutsche Formulierung gibt die Zugehörigkeit beziehungsweise Begleitung wieder, ohne den Bezug auf die zuvor Genannten zu verwischen.
- source_word: ነሥኡ ሎሙ አንስተ
  choice: nahmen sich Frauen
  rationale: Die Konstruktion beschreibt, dass sie Frauen für sich nahmen. „Frauen“ bewahrt im Deutschen sowohl die mögliche allgemeine Bedeutung als auch den ehelichen Sinn der Wendung; die Fußnote nennt die eindeutig eheliche Wiedergabe.
- source_word: ኃረዩ
  choice: wählte ... aus
  rationale: Das Verb bezeichnet eine bewusste Auswahl; „auswählen“ ist hier natürliches modernes Deutsch.
- source_word: ለለ ርእሱ አሐተ
  choice: jeder ... eine für sich
  rationale: 'Die Wiedergabe erhält den distributiven, reflexiven Sinn und die ausdrückliche Einzahl: Jeder nahm jeweils eine Frau.'
theological_decisions:
- issue: Ob አንስተ mit „Frauen“ oder „Ehefrauen“ wiederzugeben ist
  choice: Frauen
  alternative: Ehefrauen
  rationale: Das Substantiv kann Frauen allgemein bezeichnen, während die Konstruktion häufig das Nehmen zur Frau ausdrückt. „Frauen“ bewahrt die lexikalische Mehrdeutigkeit und vermeidet, den unerlaubten Verbindungen stillschweigend einen rechtmäßigen Status zuzuschreiben; die eheliche Lesart bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau ist leicht verständlich; die Wiederholung von „für sich“ erhält den reflexiven und distributiven Nachdruck des Geez.
