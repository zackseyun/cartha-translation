base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/001.yaml
  text: And I saw other lightnings and the stars of heaven[a], and I saw how he calls them all by their respective names[d][c][b], and they hear him.
translation:
  language: de
  text: Und ich sah andere Blitze und die Sterne des Himmels. Und ich sah, wie er sie alle einzeln bei ihrem Namen ruft[a], und sie hören ihn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „bei ihren jeweiligen Namen“; die geezische Formulierung ist distributiv und meint jedes einzelne.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „sie hören ihn“; im Zusammenhang kann darin auch Gehorsam beziehungsweise folgsames Reagieren mitschwingen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢኩ
  choice: Und ich sah
  rationale: Bewahrt die wiederholte Formel des visionären Berichts in natürlichem, biblisch geprägtem Deutsch.
- source_word: ካልአ መባርቅተ
  choice: andere Blitze
  rationale: ካልአ ist hier am plausibelsten als Adjektiv zum pluralischen መባርቅተ zu verstehen; die Fügung bezeichnet daher weitere beziehungsweise andere Blitze.
- source_word: ወከዋክብተ ሰማይ
  choice: und die Sterne des Himmels
  rationale: Gibt die geläufige himmlische Wendung würdig und quellennah wieder.
- source_word: ከመ ይጼውዖሙ
  choice: wie er sie … ruft
  rationale: Nach dem Wahrnehmungsverb gibt „wie“ den beobachteten Vorgang natürlich wieder; das Präsens erhält die unmittelbare Visionserzählung.
- source_word: ለኵሎሙ
  choice: sie alle
  rationale: Gibt die Gesamtheit der angesprochenen Himmelserscheinungen knapp und eindeutig wieder.
- source_word: በበአስማቲሆሙ
  choice: einzeln bei ihrem Namen
  rationale: Das wiederholte በበ- hat distributive Kraft. Die Formulierung macht deutlich, dass jedes einzelne bei seinem Namen gerufen wird.
- source_word: ወይሰምዕዎ
  choice: und sie hören auf ihn
  rationale: „Auf jemanden hören“ bewahrt den Grundsinn des Hörens und lässt zugleich die im Zusammenhang mögliche Bedeutung des Folgens oder Gehorchens anklingen, ohne sie festzuschreiben.
theological_decisions:
- issue: Ob die Sterne nur poetisch angeredet oder als reaktionsfähige himmlische Wesen dargestellt werden
  choice: 'Die personale Ausdrucksweise bleibt erhalten: Er ruft sie, und sie hören auf ihn.'
  alternative: Er ruft sie, und sie gehorchen ihm.
  rationale: Der Text beschreibt die Himmelserscheinungen in personaler, apokalyptischer Sprache. Die Übersetzung legt weder eine bloße Metapher noch eine ausgearbeitete Engellehre fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht biblisch-apokalyptischem Klang. Die Wiederholung „Und ich sah“ und die personale kosmische Bildsprache bleiben bewusst erhalten.
