base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/004.yaml
  text: 'And he said to me[d][c][b][a], “The Lord of Spirits has shown you their names: these are the names of the holy ones who dwell upon the dry ground and believe in the name of the Lord of Spirits forever and ever.”'
translation:
  language: de
  text: 'Und er sagte zu mir: »Der Herr der Geister hat dir ihr Gleichnis gezeigt:[a] Dies sind die Namen der Heiligen,[b] die auf dem trockenen Land wohnen[c] und an den Namen des Herrn der Geister glauben[d] für immer und ewig.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die äthiopische Wendung ist schwierig. Möglich ist auch: »hat dir ihre Namen gezeigt« oder, bei anderer Wortanalyse, eine Wendung im Sinn von »mit diesen/betreffs dieser«.'
    reason: alternative_reading
  - marker: b
    text: Wörtlich steht zunächst »ihre Namen«, gefolgt von »der Heiligen«; dies kann im Altäthiopischen zusammen »die Namen der Heiligen« bedeuten.
    reason: source_grammar
  - marker: c
    text: 'Wörtlich: »auf dem Trockenen«. Gemeint sein kann das trockene Land im Gegensatz zum himmlischen Bereich.'
    reason: lexical_alternative
  - marker: d
    text: 'Oder: »auf den Namen des Herrn der Geister vertrauen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ምስለ ዘዚአሆሙ
  choice: ihr Gleichnis
  rationale: ምስለ kann hier als Konstruktform zu ምስል („Gleichnis, Abbild“) verstanden werden, verbunden mit „von ihnen/ihr“. Diese Analyse erklärt den Bezug der zuvor gesehenen Himmelserscheinungen auf die Heiligen; die handschriftliche Form bleibt jedoch mehrdeutig und wird deshalb vermerkt.
- source_word: እግዚአ መንፈሳት
  choice: Herr der Geister
  rationale: Bewahrt den charakteristischen henochischen Gottestitel in würdiger, verständlicher Form.
- source_word: አርአየከ
  choice: hat dir … gezeigt
  rationale: Gibt die vollendete Offenbarungshandlung natürlich wieder.
- source_word: እሉ እሙንቱ አስማቲሆሙ ለቅዱሳን
  choice: Dies sind die Namen der Heiligen
  rationale: Das vorwegnehmende Pronominalsuffix bei „ihre Namen“ wird zusammen mit der nachfolgenden Genitivangabe idiomatisch als „die Namen der Heiligen“ wiedergegeben.
- source_word: እለ የኃድሩ ዲበ የብስ
  choice: die auf dem trockenen Land wohnen
  rationale: Bewahrt das konkrete Bild von የብስ („Trockenes, trockenes Land“) und dessen möglichen Gegensatz zum himmlischen Bereich.
- source_word: ወየአምኑ በስሙ
  choice: und an den Namen … glauben
  rationale: Der Ausdruck kann sowohl Glauben als auch Vertrauen bezeichnen. Die Hauptübersetzung erhält die Namensformel ohne konfessionelle Ausdeutung.
- source_word: ለዓለመ ዓለም
  choice: für immer und ewig
  rationale: Natürliche und zugleich feierliche Wiedergabe der emphatischen Ewigkeitsformel.
theological_decisions:
- issue: Identität der Heiligen
  choice: irdische Heilige bzw. Glaubende
  alternative: himmlische Heilige oder eine bewusst doppeldeutige Verbindung zwischen irdischen und himmlischen Heiligen
  rationale: Die nähere Bestimmung, dass sie auf dem trockenen Land wohnen und glauben, weist am ehesten auf Menschen hin. Die Übersetzung benennt sie dennoch nur als „Heilige“ und vermeidet eine erklärende Festlegung im Text.
- issue: Bezug des Gleichnisses
  choice: Die zuvor geschauten Erscheinungen dienen als Gleichnis bzw. Abbild der Heiligen.
  alternative: Der Herr habe dem Seher ihre Namen gezeigt; oder die schwierige Wendung bedeute „mit diesen/betreffs dieser“.
  rationale: Die Analyse von ምስለ als Konstruktform von „Gleichnis/Abbild“ ist grammatisch plausibel und passt zum visionären Zusammenhang. Da die überlieferte Form auch anders segmentiert werden kann, bleibt die Alternative in einer Fußnote sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit apokalyptischem Klang. Der Satzbau bleibt quellennah, wird aber durch Doppelpunkt und Relativsatz gut lesbar gehalten. Die umstrittene Lesart von ምስለ wird nicht stillschweigend geglättet, sondern im Haupttext gewählt und in der Fußnote transparent relativiert.
