base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/003.yaml
  text: And I asked the angel who went with me[a], who showed me what was hidden, “What are these?”
translation:
  language: de
  text: 'Und ich fragte den Engel, der mit mir ging und mir das Verborgene[a] zeigte: „Was sind das für Dinge?“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „die verborgenen Dinge“ oder „die Geheimnisse“. Das ge’ezische Wort bezeichnet Wirklichkeiten, die verborgen waren, bis sie in der Vision gezeigt wurden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ተስእልክዎ
  choice: ich fragte
  rationale: Das Verb aus ሰአለ bezeichnet Fragen oder Sich-Erkundigen. „Ich fragte“ ist im Zusammenhang mit der folgenden direkten Frage natürlich und präzise.
- source_word: መልአክ
  choice: Engel
  rationale: Im apokalyptischen Zusammenhang ist der Begleiter Henochs ein himmlischer Deuteengel; „Engel“ gibt diese Funktion treffender wieder als das allgemeinere „Bote“.
- source_word: ዘየሐውር ምስሌየ
  choice: der mit mir ging
  rationale: Die Relativkonstruktion kennzeichnet den Engel als Begleiter auf dem visionären Weg. Die Formulierung bewahrt das Bewegungsmotiv und bleibt im Deutschen natürlich.
- source_word: ዘአርአየኒ
  choice: mir … zeigte
  rationale: Das Verb bedeutet „zeigen“ beziehungsweise „sehen lassen“. „Zeigte“ wahrt den visionären Charakter, ohne bereits stärker als „offenbarte“ theologisch auszudeuten.
- source_word: ኅቡእ
  choice: das Verborgene
  rationale: Die substantivierte Form bezeichnet etwas, das verborgen war und in der Vision gezeigt wird. „Das Verborgene“ erhält die mögliche kollektive Bedeutung, ohne eine bestimmte Zahl von Geheimnissen festzulegen.
- source_word: ምንት እሙንቱ እሉ
  choice: Was sind das für Dinge?
  rationale: Die Frage verweist im Plural auf die soeben geschauten Gegenstände oder Erscheinungen. Die deutsche Wendung ist natürlicher als das wörtlichere, aber steife „Was sind diese?“; „Dinge“ bleibt bewusst allgemein.
theological_decisions:
- issue: Bezeichnung des in der Vision enthüllten Verborgenen
  choice: das Verborgene
  alternative: die verborgenen Dinge / die Geheimnisse
  rationale: „Das Verborgene“ bewahrt das apokalyptische Motiv zuvor verhüllter Wirklichkeiten, ohne daraus einen technischen Geheimnisbegriff oder ausdrücklich mehrere Einzelgegenstände zu machen.
- issue: Sachlicher oder persönlicher Bezug der Schlussfrage
  choice: Was sind das für Dinge?
  alternative: Wer sind diese?
  rationale: Der unmittelbare Wortlaut legt eher geschautes Geschehen oder Erscheinungen als Personen nahe. Da der Vers allein einen persönlichen Bezug jedoch nicht völlig ausschließt, wird diese Möglichkeit nicht dogmatisch verworfen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem ge’ezischen Aufbau, vermeidet jedoch unnötige Steifheit. Der Fußnotenmarker steht unmittelbar bei dem Ausdruck, auf den die lexikalische Alternative tatsächlich bezogen ist.
