base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/043/002.yaml
  text: And I saw the balances of righteousness[a], how they are weighed according to their lights, the width of their places, and the day of their appearing; and their revolution brings forth lightning, and their revolution is according to the number of the angels[e][d][c][b], and they keep faith with one another.
translation:
  language: de
  text: 'Und ich sah die Waagen der Gerechtigkeit[a]: wie sie gewogen werden: nach ihren Lichtern, nach der Breite ihrer Orte und nach dem Tag ihres Erscheinens; und ihr Umlauf bringt Blitze hervor, und ihr Umlauf richtet sich nach der Zahl der Engel[b], und sie halten einander die Treue[c].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Anfang des Verses ist textlich und sprachlich schwierig. Die hier zugrunde gelegte Lesart versteht den Ausdruck als „Waagen der Gerechtigkeit“; ältere Deutungen bezogen ihn auf eine geordnete Zuteilung himmlischer Leuchten.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich: „gemäß der Zahl der Engel“. Gemeint sein kann eine von Engeln bestimmte oder überwachte zahlenmäßige Ordnung; der Text legt die genaue Beziehung nicht fest.'
    reason: lexical_alternative
  - marker: c
    text: Der letzte Satz kann sich auf die zuvor beschriebenen Himmelserscheinungen oder auf die Engel beziehen. Daher bleibt das Subjekt im Deutschen unbestimmt.
    reason: alternative_reading
lexical_decisions:
- source_word: መዳልወ፡ ጽድቅ
  choice: die Waagen der Gerechtigkeit
  rationale: መዳልወ wird gemäß der jüngsten textkritischen Prüfung als „Waagen“ verstanden, nicht als „Leuchten“. Der Genitiv „der Gerechtigkeit“ bewahrt die gehobene und mehrdeutige Bildsprache.
- source_word: ይደለው
  choice: sie werden gewogen
  rationale: Die passive Bedeutung wird direkt wiedergegeben und mit dem Bild der Waagen verbunden.
- source_word: በብርሃናቲሆሙ
  choice: nach ihren Lichtern
  rationale: „Lichter“ erhält den konkreten kosmischen Ausdruck; „nach“ gibt den Maßstab wieder, ohne die Beziehung genauer festzulegen, als es die Quelle erlaubt.
- source_word: ሰረኃበ፡ መካናቲሆሙ
  choice: die Breite ihrer Orte
  rationale: Unter Berücksichtigung des wahrscheinlichen Überlieferungs- oder Transkriptionsfehlers wird der Ausdruck als „Breite ihrer Orte“ verstanden.
- source_word: ዕለተ፡ ክነቶሙ
  choice: den Tag ihres Erscheinens
  rationale: Die Wiedergabe unterscheidet das Erscheinen von der anschließend genannten Umdrehung und bewahrt den Singular „Tag“.
- source_word: ሚጠቶሙ
  choice: ihre Umdrehung
  rationale: Der Ausdruck bezeichnet hier eher das Wenden beziehungsweise den Umlauf als eine Jahreszeit. „Umdrehung“ erhält die astronomische Bewegung und die Wiederholung im Ausgangstext.
- source_word: መብረቅ፡ ይወልድ
  choice: bringt Blitze hervor
  rationale: Die anschauliche Geburtsmetapher des Verbs bleibt in natürlichem Deutsch erkennbar.
- source_word: በኍልቈ፡ መላእክት
  choice: nach der Zahl der Engel
  rationale: Die Präpositionalfügung bezeichnet eine zahlenmäßige Ordnung; es wird kein im Text fehlendes Verb wie „gezählt“ ergänzt.
- source_word: ሃይማኖቶሙ፡ የዓቅቡ፡ በበይናቲሆሙ
  choice: sie halten einander die Treue
  rationale: Die Formulierung bewahrt den Beziehungs- und Verlässlichkeitsaspekt, ohne den Bezug der Pronomen vorschnell auf Engel oder Himmelskörper festzulegen.
theological_decisions:
- issue: Bedeutung der „Waagen der Gerechtigkeit“
  choice: Das Bild wird wörtlich als „Waagen der Gerechtigkeit“ wiedergegeben.
  alternative: Geordnete Zuteilung der Leuchten beziehungsweise „Leuchten der Gerechtigkeit“.
  rationale: Die revidierte lexikalische Analyse stützt „Waagen“. Der Genitiv bleibt absichtlich offen und wird weder als moralisches Urteil noch als Bezeichnung bestimmter himmlischer Wesen erklärt.
- issue: Bezug des abschließenden Treuesatzes
  choice: Das unbestimmte „sie“ bleibt erhalten.
  alternative: Ausdrückliche Zuordnung zu den Engeln oder zu den Himmelskörpern.
  rationale: Der unmittelbare Zusammenhang erlaubt mehrere Bezüge. Die Übersetzung bewahrt diese echte syntaktische und theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die schwer verständliche apokalyptisch-kosmische Bildsprache wird nicht geglättet; Wiederholungen wie „ihre Umdrehung“ bleiben erhalten. Alle Fußnotenmarker stehen im Haupttext.
