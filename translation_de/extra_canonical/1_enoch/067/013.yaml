revisions:
- from: Denn diese Wasser des Gerichts[a] dienen zur Heilung des Fleisches der Könige und der Lust ihres Fleisches[b]; deshalb sehen sie nicht und glauben nicht, dass jene Wasser sich verwandeln und zu einem Feuer werden, das für immer und ewig brennt.
  to: Denn diese Wasser des Gerichts[a] dienen zur Heilung des Fleisches der Könige und zur Befriedigung der Begierde ihres Fleisches[b]; deshalb sehen sie nicht und glauben nicht, dass jene Wasser sich verwandeln und zu einem Feuer werden, das für immer und ewig brennt.
  rationale: Die Revision verdeutlicht durch die wiederholte Zweckangabe, dass Heilung des Fleisches und Befriedigung der fleischlichen Begierde parallel genannt werden. „Begierde“ ist im modernen Standarddeutsch die weiter und natürlicher verständliche Wiedergabe; „Befriedigung“ macht den durch die Zweckkonstruktion ausgedrückten Bezug idiomatisch, ohne die Art des Begehrens zu bestimmen. Die textkritisch auffällige Kürze der mitgelieferten Geʽez-Extraktion wird nicht als Grund behandelt, den durch den dokumentierten Seitenumbruch und Auditverlauf gesicherten restlichen Vers zu streichen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-17T19:10:03Z'
review_pass:
