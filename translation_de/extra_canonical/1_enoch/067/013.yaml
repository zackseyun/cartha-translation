  source_fidelity: Der Entwurf gibt den im Überlieferungs- und Auditkontext belegten vollständigen Vers wieder, nicht nur den offenbar an einem Seitenumbruch abgeschnittenen Teilsatz der bereitgestellten Geʽez-Extraktion. „Wasser des Gerichts“, „Heilung des Fleisches der Könige“, das körperliche Begehren sowie die Verwandlung in ewig brennendes Feuer sind sachgerecht erhalten. Die demonstrative Distanzierung bei der zweiten Nennung („jene Wasser“) ist möglich und wahrt den Bezug auf die zuvor genannten Wasser.
  naturalness: Der Satz ist insgesamt gut verständlich und dem apokalyptischen Register angemessen. In „dienen zur Heilung des Fleisches der Könige und der Lust ihres Fleisches“ kann die Koordination jedoch nahelegen, auch die Lust werde geheilt. Eine Wiederholung der Präposition stellt die zwei Zweckbezüge klarer heraus, ohne den Sinn festzulegen.
  terminology: „Gericht“ ist für ኵነኔ die angemessen offene Wiedergabe. „Fleisch“ bewahrt die bewusste Wiederholung. Für ፍትወተ ist „Begierde“ in diesem Kontext idiomatischer und weniger missverständlich als das heute häufig sexuell verstandene „Lust“, ohne die Bedeutung auf Sexualität zu verengen.
