base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/013.yaml
  text: For these waters of judgment are for the healing of the flesh of the kings and for the lust of their flesh[b][a]; and because of this they do not see and do not believe that those waters will change and become a fire that burns forever and ever.
translation:
  language: de
  text: Denn diese Wasser des Gerichts[a] dienen zur Heilung des Fleisches der Könige und zur Befriedigung der Begierde ihres Fleisches[b]; deshalb sehen sie nicht und glauben nicht, dass jene Wasser sich verwandeln und zu einem Feuer werden, das für immer und ewig brennt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „dieses Wasser des Gerichts“, wenn „Wasser“ kollektiv verstanden wird.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „zur Befriedigung der Lust ihres Fleisches“ bzw. „zur Befriedigung des Verlangens ihres Fleisches“. Das zugrunde liegende Wort kann Lust, Begehren oder Verlangen bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: Denn
  rationale: Leitet eine begründende Erklärung ein und bewahrt den gehobenen, argumentativen Zusammenhang.
- source_word: እሉ
  choice: diese
  rationale: Der pluralische Demonstrativ verweist auf die unmittelbar zuvor geschauten Wasser.
- source_word: ማየ
  choice: Wasser
  rationale: Im Deutschen kann „Wasser“ auch als Pluralform stehen; die konkrete apokalyptische Bildsprache bleibt dadurch erhalten.
- source_word: ኵነኔ
  choice: Gericht
  rationale: Bewahrt die Breite des forensisch-apokalyptischen Begriffs, ohne ihn auf Verurteilung oder Strafe zu verengen.
- source_word: ለፈውሰ
  choice: zur Heilung
  rationale: Gibt die Zweckbestimmung der Wasser unmittelbar und idiomatisch wieder.
- source_word: ሥጋሆሙ
  choice: ihres Fleisches
  rationale: Bewahrt die auffällige Wiederholung und die körperlich-moralische Spannung des Ausgangstextes.
- source_word: ፍትወተ
  choice: Lust
  rationale: Der Ausdruck kann Begehren, Verlangen oder Lust bezeichnen; „Lust“ wahrt hier die leiblich-negative Färbung, ohne eine spezielle sexuelle Deutung festzulegen.
- source_word: ኢይሬእዩ
  choice: sehen sie nicht
  rationale: Entspricht dem konkreten Wahrnehmungsverb und vermeidet die interpretierende Erweiterung „erkennen“.
theological_decisions:
- issue: Gericht als richterlicher Akt oder als Strafvollzug
  choice: Gericht
  alternative: Strafe; Verurteilung
  rationale: „Gericht“ hält offen, ob der Akzent auf dem göttlichen Urteil, seiner Verurteilung oder seiner strafenden Auswirkung liegt.
- issue: Das paradoxe Verhältnis von Heilung und ewig brennendem Feuer
  choice: Die Aussagen werden ohne harmonisierende Erklärung nebeneinandergestellt.
  alternative: Die Heilung ausdrücklich als Täuschung oder vorläufige Wirkung deuten.
  rationale: Der Text verbindet die vermeintliche Heilwirkung mit der künftigen Verwandlung in Feuer; die Übersetzung bewahrt diese apokalyptische Spannung.
- issue: Bedeutung der Lust des Fleisches
  choice: Lust ihres Fleisches
  alternative: Befriedigung ihres körperlichen Verlangens
  rationale: Die knappere Formulierung wahrt die Mehrdeutigkeit zwischen Begehren, Genuss und körperlicher Begierde und fügt keine ausdrückliche Befriedigung hinzu.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem apokalyptischem Erzählton. Die Wiederholung von „Fleisch“ und „Wasser“ bleibt bewusst erhalten; ebenso die Spannung zwischen Heilung, mangelndem Glauben und dem künftigen ewigen Feuer.
