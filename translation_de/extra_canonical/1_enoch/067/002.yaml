base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/002.yaml
  text: And now the angels are making a wooden structure[a]; and when the angels have finished that, I will place my hand upon it and guard it, and from it there will come the seed of life, and a transformation will occur[e][d][c][b], so that the dry ground may not remain barren.
translation:
  language: de
  text: Und nun errichten die Engel ein Bauwerk aus Holz[a]. Wenn die Engel es vollendet haben, werde ich meine Hand darauflegen und es bewahren[b]. Aus ihm wird der Same des Lebens hervorgehen[c], und eine Verwandlung wird eintreten[d], damit der trockene Boden nicht unfruchtbar bleibt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich etwa „Holzwerk“ oder „Hölzer“; möglich sind auch „hölzerner Aufbau“ oder „Bauwerk aus Holz“. Im Zusammenhang kann Noahs Arche gemeint sein.
    reason: lexical_alternative
  - marker: b
    text: 'Die äthiopische Wortfolge ist schwierig. Möglich ist auch: „Die Engel werden meine Hände darauflegen und darüber wachen.“'
    reason: textual_variant
  - marker: c
    text: „Same des Lebens“ ist wörtlich wiedergegeben. Gemeint sein können lebensspendende Nachkommenschaft, Lebenskraft oder erneuerte Fruchtbarkeit.
    reason: lexical_alternative
  - marker: d
    text: 'Oder: „eine Veränderung wird sichtbar werden“. Die Wendung bezeichnet eine eintretende Veränderung, ohne deren Art eindeutig festzulegen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ይገብሩ
  choice: errichten
  rationale: Das Imperfekt bezeichnet hier eine gegenwärtig ablaufende oder unmittelbar bevorstehende Handlung. „Errichten“ passt natürlich zu einem aus Holz gefertigten Bauwerk.
- source_word: መላእክት
  choice: Engel
  rationale: Im apokalyptischen Zusammenhang sind himmlische Wesen gemeint, nicht menschliche Boten.
- source_word: ዕፀወ
  choice: ein Bauwerk aus Holz
  rationale: Das Wort gehört zum Bedeutungsfeld Holz/Baum und kann Holzstücke, Holzwerk oder hölzerne Gegenstände bezeichnen. Der Kontext und die folgenden femininen Singularbezüge sprechen für ein einzelnes Gebilde; die konkrete Bezeichnung als Arche bleibt jedoch eine Kontextdeutung und wird nicht in den Haupttext eingetragen.
- source_word: ወድኡ
  choice: vollendet haben
  rationale: Das Verb bezeichnet den Abschluss des zuvor genannten Herstellens oder Bauens.
- source_word: እወዲ እዴየ ዲቤሃ
  choice: werde ich meine Hand darauflegen
  rationale: Die schwierige Wortfolge enthält klar den Gedanken „meine Hand/Hände“ und „darauf“. Die erste Person wird beibehalten, ohne die syntaktische Unsicherheit zu verschweigen.
- source_word: እዐቅባ
  choice: es bewahren
  rationale: Das Verb umfasst bewachen, behüten und erhalten. „Bewahren“ lässt sowohl den schützenden als auch den erhaltenden Sinn offen.
- source_word: ዘርአ ሕይወት
  choice: der Same des Lebens
  rationale: Die wörtliche Bildsprache bleibt erhalten und wird nicht auf Nachkommenschaft, Fruchtbarkeit oder Auferstehung festgelegt.
- source_word: ተወላጥ ይባእ
  choice: eine Verwandlung wird eintreten
  rationale: Die schwierige Wendung weist auf eine eintretende Veränderung hin. Diese Wiedergabe ist idiomatisch, ohne die Art der Veränderung näher zu bestimmen.
- source_word: የብስ ዕራቆ
  choice: der trockene Boden nicht unfruchtbar bleibt
  rationale: Die Begriffe verbinden Trockenheit mit Leere beziehungsweise fehlender Fruchtbarkeit. Die Übersetzung erhält das konkrete Boden- und Fruchtbarkeitsbild.
theological_decisions:
- issue: Landwirtschaftliche Erneuerung oder symbolisches Hervorgehen neuen Lebens
  choice: Die konkreten Bilder von Holzbauwerk, Same des Lebens und unfruchtbarem Boden bleiben nebeneinander stehen.
  alternative: Den Vers entweder vollständig als gewöhnliche landwirtschaftliche Erneuerung oder ausschließlich als Bild für Auferstehung beziehungsweise Neuschöpfung auslegen.
  rationale: Der äthiopische Text legt keine einzige Erklärungsebene zwingend fest. Die Übersetzung bewahrt daher die visionäre Mehrdeutigkeit.
- issue: Identifikation des hölzernen Bauwerks mit der Arche
  choice: Im Haupttext steht allgemein „Bauwerk aus Holz“.
  alternative: Direkt „Arche“ übersetzen.
  rationale: Der Zusammenhang kann auf Noahs Arche weisen, doch das betreffende Wort selbst bedeutet Holz beziehungsweise Holzwerk und nennt die Arche nicht ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die visionäre Bildsprache und die Unsicherheiten des mittelmäßig sicher überlieferten bzw. erschlossenen Ge’ez-Textes werden bewahrt; erklärende Festlegungen stehen nur in den Fußnoten.
