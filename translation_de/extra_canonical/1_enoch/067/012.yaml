base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/012.yaml
  text: And I heard Michael answering and saying[a], “This judgment by which the angels are judged is a testimony against the kings and the mighty[b], those who possess the dry land.”
translation:
  language: de
  text: 'Und ich hörte Michael antworten und sagen: »Dieses Gericht, durch das die Engel gerichtet werden, ist ein Zeugnis[a] gegen die Könige und die Mächtigen, die das trockene Land[b] besitzen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »ein Zeuge gegen die Könige und die Mächtigen«. Das geʿezische Substantiv kann im forensischen Sinn sowohl »Zeugnis« als auch »Zeuge« bedeuten.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »das trockene Land«. Gemeint sein kann das von Menschen bewohnte und beherrschte Land, nicht unbedingt die Erde in einem umfassend kosmischen Sinn.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወሰማዕክዎ፡ ለሚካኤል
  choice: Und ich hörte Michael
  rationale: Die erste Person Perfekt mit Objektsuffix und die folgende lamed-Konstruktion bezeichnen Michael als den Gehörten; die deutsche Formulierung ist natürlich und wahrt die Erzählperspektive.
- source_word: ያውሥእ፡ ወይብል
  choice: antworten und sagen
  rationale: Die doppelte Redeeinleitung wird beibehalten, da sie dem gehobenen apokalyptischen Stil entspricht.
- source_word: ኵነኔ
  choice: Gericht
  rationale: Der Ausdruck ist forensisch und eschatologisch; »Gericht« lässt sowohl den Vorgang als auch dessen strafendes Ergebnis offen.
- source_word: እንተ፡ ይትኴነኑ፡ መላእክት
  choice: durch das die Engel gerichtet werden
  rationale: Die Relativkonstruktion wird auf »Gericht« bezogen. Das Passiv bleibt erhalten; »gerichtet« legt sich weniger stark als »verurteilt« auf den Ausgang fest.
- source_word: ሰማዕተ
  choice: ein Zeugnis
  rationale: Das Substantiv kann im forensischen Sinn »Zeugnis« oder »Zeuge« bedeuten. Im Haupttext steht die idiomatischere sachliche Lesart; die Alternative wird in einer Fußnote bewahrt.
- source_word: ለነገሥት፡ ወለዐዚዛን
  choice: gegen die Könige und die Mächtigen
  rationale: Das lamed wird im forensischen Zusammenhang als gegen die betroffenen Herrscher gerichtet verstanden. »Die Mächtigen« wahrt den gehobenen sozialpolitischen Klang.
- source_word: እለ፡ ይእኅዝዋ፡ ለየብስ
  choice: die das trockene Land in Besitz haben
  rationale: Die konkrete Bedeutung von የብስ als trockenes Land im Gegensatz zum Wasser bleibt erhalten; der verbale Ausdruck bezeichnet Halten oder Besitzen.
theological_decisions:
- issue: Bezug und Tragweite der Zeugnis-Aussage
  choice: Das Gericht über die Engel dient als Zeugnis gegen die irdischen Herrscher.
  alternative: Die Engel selbst sind Zeugen gegenüber den Königen und Mächtigen; oder die Wendung ist neutral als »Zeugnis für die Könige und Mächtigen« zu verstehen.
  rationale: Die Syntax verbindet »Zeugnis« am natürlichsten mit dem zuvor genannten Gericht; die lamed-Phrasen bezeichnen dann diejenigen, gegen die es steht. Wegen der lexikalischen Mehrdeutigkeit von ሰማዕተ wird die Zeugen-Lesart in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter apokalyptischer Redeform. Die doppelte Redeeinleitung und das konkrete Bild vom trockenen Land bleiben erhalten; echte lexikalische und syntaktische Mehrdeutigkeiten werden nicht konfessionell aufgelöst.
