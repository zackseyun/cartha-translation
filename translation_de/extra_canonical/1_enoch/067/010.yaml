base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/010.yaml
  text: For judgment will come upon them[a], because they trust in the indulgence of their flesh and deny the Spirit of the Lord.
translation:
  language: de
  text: Denn das Gericht wird über sie kommen, weil sie auf die Ausschweifung ihres Fleisches[a] vertrauen und den Geist des Herrn verleugnen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier mit „Ausschweifung“ wiedergegebene Wort ist in diesem nur auf Ge’ez erhaltenen Abschnitt unsicher. Es kann auch Lust oder Zügellosigkeit und möglicherweise eine mit ihrem Fleisch verbundene Täuschung bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: እስመ
  choice: denn / weil
  rationale: 'Das zweimalige እስመ bildet eine kausale Folge: „Denn“ knüpft an den vorherigen Zusammenhang an, „weil“ leitet die ausdrückliche Begründung ein.'
- source_word: ትመጽእ
  choice: wird kommen
  rationale: Die Zukunftsform entspricht der apokalyptischen Gerichtsankündigung.
- source_word: ኵነኔ
  choice: Gericht
  rationale: „Gericht“ bewahrt den umfassenden richterlichen und endzeitlichen Sinn, ohne auf Urteil oder Verurteilung einzuengen.
- source_word: ዲቤሆሙ
  choice: über sie
  rationale: Die Präposition wird in der deutschen Wendung „das Gericht kommt über sie“ natürlich und sachgerecht wiedergegeben.
- source_word: የአምኑ
  choice: vertrauen
  rationale: Das Verb kann Glauben oder Vertrauen bezeichnen; beim folgenden Gegenstand drückt „vertrauen“ die fehlgeleitete Zuversicht am klarsten aus.
- source_word: በተውኔተ
  choice: auf die Ausschweifung
  rationale: Das seltene und unsichere Substantiv bezeichnet im Zusammenhang mit „Fleisch“ wahrscheinlich sinnliche Selbstbefriedigung oder Zügellosigkeit. Die verbleibende Unsicherheit wird in einer Fußnote offengelegt.
- source_word: ሥጋሆሙ
  choice: ihres Fleisches
  rationale: „Fleisch“ erhält den konkreten anthropologischen Ausdruck und seine moralische Spannung; „Körper“ wäre enger und neutraler.
- source_word: ወመንፈሰ
  choice: und den Geist
  rationale: Das Wort kann Geist oder Atem bedeuten; die folgende Genitivverbindung weist hier am natürlichsten auf den Geist des Herrn.
- source_word: እግዚአ
  choice: des Herrn
  rationale: „Herr“ ist die übliche deutsche Wiedergabe dieses göttlichen Titels.
- source_word: ይክሕዱ
  choice: verleugnen
  rationale: „Verleugnen“ bewahrt die starke Bedeutung einer bewussten Zurückweisung im theologischen Zusammenhang.
theological_decisions:
- issue: Bedeutung von „Geist des Herrn“
  choice: Bezug auf den Geist, der dem Herrn zugehört und von ihnen verleugnet wird
  alternative: ihr eigener, von Gott gegebener Geist oder die geistliche Lebensweise des Herrn
  rationale: Die Genitivverbindung weist am ehesten auf den Geist des Herrn. Der Gegensatz zu ihrem Vertrauen auf das Fleisch stützt diese Lesart; die Formulierung wird jedoch nicht mit späteren dogmatischen Begriffen harmonisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Gerichtssprache und der Gegensatz zwischen Fleisch und Geist bleiben erhalten; die unsichere sinnliche beziehungsweise täuschende Nuance des seltenen Substantivs wird nicht im Haupttext übererklärt.
