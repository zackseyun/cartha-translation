base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/001.yaml
  text: And in those days the word of the Lord came to me[a], and he said to me, “Noah, your portion has come up before me—a portion without blame[b], a portion of love and uprightness.”
translation:
  language: de
  text: 'Und in jenen Tagen erging das Wort des Herrn an mich, und er sagte zu mir: »Noah, dein Anteil ist zu mir emporgestiegen[a] – ein Anteil ohne Tadel[b], ein Anteil der Liebe und der Aufrichtigkeit.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »dein Los ist zu mir emporgestiegen«. Das Ge’ez bewahrt hier das Bild einer Aufwärtsbewegung in die göttliche Gegenwart.'
    reason: lexical_alternative
  - marker: b
    text: Die mit »ohne Tadel« wiedergegebene Wendung kann auch »untadelig« oder »ohne Vorwurf« bedeuten. Da die Bilderreden an dieser Stelle praktisch nur im Ge’ez erhalten sind, bleibt die genaue Nuance mit einer gewissen Unsicherheit behaftet.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወበእማንቱ መዋዕል
  choice: Und in jenen Tagen
  rationale: Bewahrt die wiederkehrende apokalyptische Zeitformel und ihren gehobenen, zugleich verständlichen Ton.
- source_word: ቃለ እግዚአብሔር
  choice: das Wort des Herrn
  rationale: Entspricht der prophetischen Offenbarungsformel und gibt den bestimmten Ausdruck formal und natürlich wieder.
- source_word: ኀቤየ
  choice: an mich / zu mir
  rationale: Beim Ergehen des Wortes ist »an mich«, beim Sprechen »zu mir« im Deutschen idiomatisch; beide geben die jeweilige Richtung zum Sprecher wieder.
- source_word: ክፍልከ
  choice: dein Anteil
  rationale: »Anteil« hält die Bedeutungsbreite zwischen zugewiesenem Teil, Los und Stellung offen und klingt im Deutschen natürlicher als »Portion«.
- source_word: ዐርገ ኀቤየ
  choice: ist zu mir emporgestiegen
  rationale: Bewahrt ausdrücklich die vertikale Bewegung in die göttliche Gegenwart, ohne das Bild durch eine bloße Aussage über Anerkennung zu ersetzen.
- source_word: ዘአልቦቱ ሒስ
  choice: ohne Tadel
  rationale: Erhält den forensischen beziehungsweise reputativen Sinn von Schuldlosigkeit oder fehlendem Vorwurf, ohne absolute Sündlosigkeit zu behaupten.
- source_word: ፍቅር
  choice: Liebe
  rationale: Bewahrt das Substantiv und damit die parallele Beschreibung des Anteils.
- source_word: ወርትዕ
  choice: Aufrichtigkeit
  rationale: Gibt ethische Geradheit wieder, ohne den Ausdruck unnötig auf einen späteren dogmatischen Begriff von Gerechtigkeit festzulegen.
theological_decisions:
- issue: Bedeutung von Noahs »Anteil« im Offenbarungs- und Gerichtskontext
  choice: dein Anteil ist zu mir emporgestiegen
  alternative: dein Los ist vor mich gelangt
  rationale: Die Formulierung wahrt die Mehrdeutigkeit zwischen Erbteil, Zuweisung und anerkannter Stellung und erhält zugleich das Bild des Aufsteigens.
- issue: Reichweite der Aussage ዘአልቦቱ ሒስ
  choice: ohne Tadel
  alternative: untadelig
  rationale: »Ohne Tadel« lässt eine gerichtliche oder reputative Nuance bestehen und macht daraus keine ausdrückliche Behauptung absoluter moralischer Vollkommenheit.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, leicht gehobenem Erzählton. Die wiederholte Wendung »ein Anteil« bildet die Parallelstruktur des Ausgangstextes ab; die Gottesrede steht in deutschen Anführungszeichen.
