base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/007.yaml
  text: And through its valleys come rivers of fire, where those angels shall be judged who led astray those who dwell upon the dry land.
translation:
  language: de
  text: Und durch ihre Täler kommen Feuerströme,[a] wo jene Engel gerichtet werden, die die Bewohner des trockenen Landes[b] in die Irre geführt haben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Feuerflüsse“. Gemeint sind fließende Ströme oder Bahnen aus Feuer.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „die auf dem trockenen Land wohnen“. Gemeint sein können allgemein die menschlichen Bewohner der Erde; die konkrete Ausdrucksweise des Textes bleibt erhalten.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወእነተ፡ ቈላት፡ ዚአሃ
  choice: Und durch ihre Täler
  rationale: Im Zusammenhang mit den Tälern der vorangehenden Verse wird ቈላት als Plural „Täler“ und ዚአሃ als rückbezügliches „ihre“ verstanden. Diese Lesart folgt der korrigierten Analyse des geezischen Textes und vermeidet die ältere Deutung als „Hitze“.
- source_word: አፍላገ፡ እሳት
  choice: Feuerströme
  rationale: Die Wendung bezeichnet fließende Gewässer oder Bahnen aus Feuer. „Feuerströme“ bewahrt das apokalyptische Bild und klingt im Deutschen natürlicher als „Flüsse von Feuer“.
- source_word: ይመጽኡ
  choice: kommen
  rationale: Der Imperfekt wird als visionarisches Präsens wiedergegeben. Das Verb bedeutet wörtlicher „kommen“ bzw. „hervorkommen“; „kommen“ erhält die Form des Ausgangstextes, ohne das Fließen ausdrücklich in das Verb einzutragen.
- source_word: ኀበ፡ ይትኴነኑ
  choice: wo … gerichtet werden
  rationale: ኀበ führt den Ort ein; die passive Verbform bezeichnet ein Gericht. „Gerichtet werden“ wahrt den gerichtlichen Sinn, ohne ihn vorzeitig auf „verdammt werden“ zu verengen.
- source_word: እልኩቱ፡ መላእክት
  choice: jene Engel
  rationale: Im apokalyptischen Zusammenhang sind mit መላእክት Engel gemeint. Das Demonstrativ wird durch „jene“ bewahrt.
- source_word: አስሐትዎሙ
  choice: in die Irre geführt haben
  rationale: Die Kausativform besagt, dass die Engel andere zum Irrtum oder Fehlgehen brachten. Die deutsche Wendung erhält sowohl die Kausalität als auch das moralische Gewicht.
- source_word: ለእለ፡ የኃድሩ፡ ዲበ፡ የብስ
  choice: die Bewohner des trockenen Landes
  rationale: Die konkrete kosmologische Formulierung „die auf dem trockenen Land wohnen“ wird knapp und natürlich wiedergegeben, ohne sie zum allgemeineren „Menschen auf der Erde“ zu verflachen.
theological_decisions:
- issue: Identität der gerichteten Engel
  choice: Der Text nennt sie lediglich Engel, die die Bewohner des trockenen Landes in die Irre führten.
  alternative: Sie ausdrücklich als die Wächter der Genesis-6-Tradition zu identifizieren.
  rationale: Die nähere Identifikation ergibt sich möglicherweise aus dem weiteren Henoch-Kontext, steht aber nicht ausdrücklich in diesem Vers. Die Übersetzung lässt diese Spannung offen.
- issue: Bedeutung des Gerichts
  choice: „gerichtet werden“
  alternative: „verurteilt werden“
  rationale: Die passive Gerichtsform lässt das negative Ergebnis im Kontext erkennen, legt es lexikalisch jedoch nicht stärker fest als der Ausgangstext.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das visionarische Präsens und die konkrete Bildsprache wurden beibehalten; unnötig altertümliche Formen und eine über den Vers hinausgehende Identifikation der Engel wurden vermieden.
