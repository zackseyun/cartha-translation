base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/004.yaml
  text: And they bound those angels who had shown lawlessness in that burning valley which my grandfather Enoch had previously shown me in the west[d][c][b][a], by the mountains of gold and silver and iron and soft metal and lead.
translation:
  language: de
  text: Und sie werden jene Engel, die die Gesetzlosigkeit sichtbar gemacht hatten, in jenem brennenden Tal einschließen, das mir mein Großvater Henoch zuvor im Westen[a] gezeigt hatte, bei den Bergen aus Gold, Silber, Eisen, Weichmetall[b] und Blei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach Westen hin“; das Wort kann auch „am Abend“ bedeuten, doch die folgenden Ortsangaben sprechen eher für eine westliche Lage.'
    reason: lexical_alternative
  - marker: b
    text: Die genaue Bezeichnung dieses Metalls ist unsicher; möglich sind unter anderem „Zinn“, „Elektron“ oder ein anderes veredeltes beziehungsweise weiches Metall.
    reason: lexical_alternative
lexical_decisions:
- source_word: የዐጽዎሙ
  choice: sie werden … einschließen
  rationale: Die Imperfektform weist hier im Zusammenhang des kommenden Gerichts am ehesten in die Zukunft. Das Verb bezeichnet das Verschließen beziehungsweise Einschließen; diese Wiedergabe bewahrt das konkrete Bild, ohne es unnötig auf Fesseln zu verengen.
- source_word: እሙንቱ መላእክት
  choice: jene Engel
  rationale: Im apokalyptischen Gerichtskontext sind übermenschliche Engel gemeint, nicht menschliche Boten.
- source_word: እለ አርአይዋ ለዓመፃ
  choice: die die Gesetzlosigkeit sichtbar gemacht hatten
  rationale: Die Formulierung bewahrt die Bedeutung des Zeigens oder Offenbarmachens und legt nicht vorschnell fest, ob die Engel die Gesetzlosigkeit lehrten oder selbst begingen.
- source_word: ቈላ እንተ ትነድድ
  choice: brennendes Tal
  rationale: Die Wendung bezeichnet ein Tal, das brennt, und gehört zur anschaulichen Gerichtstopografie des Abschnitts.
- source_word: እንተ አርአየኒ ቀዳሚ እምሔውየ ሄኖክ
  choice: das mir mein Großvater Henoch zuvor gezeigt hatte
  rationale: Henoch ist ausdrücklich der Großvater des Sprechers und das Subjekt des aktiven Verbs „zeigen“. „Zuvor“ gibt den Rückverweis von ቀዳሚ natürlich wieder.
- source_word: በዓረብ
  choice: im Westen
  rationale: Die anschließenden Ortsangaben sprechen eher für eine geografische als für eine zeitliche Bedeutung; die mögliche Richtungsnuance wird in der Fußnote erhalten.
- source_word: አድባረ ወርቅ ወብሩር ወሐፂን
  choice: Berge aus Gold, Silber, Eisen
  rationale: Der Konstruktus nennt mehrere aus Metallen bestehende Berge. „Berge“ entspricht der Größe der visionären Landschaft.
- source_word: ነጠብጣብ
  choice: Weichmetall
  rationale: Die genaue Metallbezeichnung ist in diesem Textzeugen unsicher. Eine vorsichtige allgemeine Wiedergabe vermeidet Scheingenauigkeit; mögliche konkrete Deutungen stehen in der Fußnote.
- source_word: ናእስ
  choice: Blei
  rationale: Das Wort wird in Metalllisten gewöhnlich als Blei verstanden und passt zur vorliegenden Aufzählung.
theological_decisions:
- issue: Art des Vergehens der Engel
  choice: Sie hatten die Gesetzlosigkeit sichtbar gemacht.
  alternative: Sie hatten Gesetzlosigkeit gelehrt oder begangen.
  rationale: Der ge'ezische Wortlaut stellt das Zeigen beziehungsweise Sichtbarmachen in den Vordergrund. Die Übersetzung bewahrt diese Spannung und entscheidet nicht unbelegt zwischen Lehren und eigenem Tun.
- issue: Zeitpunkt des Einschließens
  choice: 'zukünftiges Gericht: „sie werden … einschließen“'
  alternative: 'vergangenes Geschehen: „sie schlossen … ein“'
  rationale: Die Imperfektform und der Gerichtszusammenhang stützen den Zukunftsbezug. Damit wird zugleich die konkrete Grundbedeutung des Verbs als Einschließen beibehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am visionären Ortsbild, ist aber für heutige Leser flüssig geordnet. „Sichtbar gemacht“ erhält die ungewöhnliche Aussage über die Gesetzlosigkeit, ohne eine bestimmte theologische Auslegung einzutragen.
