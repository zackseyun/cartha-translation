  yaml_path: translation/extra_canonical/1_enoch/067/008.yaml
  text: And in those days those waters will be for the kings and the mighty and the exalted[a], and for those who dwell on the dry ground, for the healing of the body and for the punishment of the spirit; and their spirit will be full of pleasure, so that their bodies may be judged, because they have denied the Lord of Spirits, and they see their judgment every day[d][c][b], yet they do not believe in his name.
translation:
  language: de
  text: Und in jenen Tagen werden diese Wasser für die Könige, die Mächtigen und die Hochgestellten und für die Bewohner des trockenen Landes zur Heilung des Körpers und zur Bestrafung des Geistes dienen. Ihr Geist wird von Lust erfüllt sein,[a] sodass ihre Körper gerichtet werden, denn sie haben den Herrn der Geister verleugnet. Tag für Tag sehen sie ihr Gericht, glauben aber dennoch nicht an seinen Namen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung ist sprachlich und im Zusammenhang schwierig. Das ge'ezische Wort kann positiv „Lust“, „Wohlbehagen“ oder „Freude“ bedeuten, obwohl der Zusammenhang vom Gericht handelt.
    reason: textual_variant
  - marker: b
    text: „Körper“ und „Geist“ bleiben als unterschiedliche Begriffe stehen, weil der Vers von körperlicher Heilung und der Bestrafung des Geistes spricht.
    reason: lexical_alternative
lexical_decisions:
- source_word: ወይከውኑ፡ እልኩ፡ ማያት፡ በአማንቱ፡ መዋዕል
  choice: Und in jenen Tagen werden diese Wasser ... dienen
  rationale: Die Zukunftsaussage und die apokalyptische Zeitformel werden gewahrt; „dienen“ gibt im Deutschen die wiederholte Zweckangabe mit ל-/ለ- natürlich wieder.
- source_word: ለነገሥት፡ ወለዐዚዛን፡ ወለልዑላን
  choice: für die Könige, die Mächtigen und die Hochgestellten
  rationale: Die dreigliedrige soziale Rangfolge bleibt erhalten, ohne die drei Bezeichnungen zu einer einzigen Gruppe einzuebnen.
- source_word: ወለእለ፡ የኃድሩ፡ ዲበ፡ የብስ
  choice: und für die Bewohner des trockenen Landes
  rationale: „Trockenes Land“ bewahrt den konkreten Gegensatz zu den Wassern und klingt zugleich natürlicher als eine streng wörtliche Relativkonstruktion.
- source_word: ለፈውሰ፡ ሥጋ
  choice: zur Heilung des Körpers
  rationale: Die körperliche Bedeutung wird klar wiedergegeben; „Körper“ vermeidet die moralischen Nebenbedeutungen von „Fleisch“.
- source_word: ወለአዝነ፡ መንፈስ
  choice: zur Bestrafung des Geistes
  rationale: አዝነ bezeichnet hier im Gerichtskontext Bestrafung oder Qual; „Bestrafung“ wahrt die eschatologische Schärfe, ohne übermäßig auszumalen.
- source_word: ወትውኔተ፡ ይመልእ፡ መንፈሶሙ
  choice: Ihr Geist wird von Lust erfüllt sein
  rationale: Die schwierige positive Bedeutung von ትውኔተ wird nicht aufgrund des Gerichtskontexts in ihr Gegenteil verkehrt. „Lust“ hält die mögliche Nuance von Genuss bzw. sinnlichem Wohlbehagen offen.
- source_word: ከመ፡ ይትኰነኑ፡ ሥጋሆሙ
  choice: sodass ihre Körper gerichtet werden
  rationale: Die passive Gerichtsformulierung bleibt erhalten; „gerichtet“ legt das Ergebnis weniger stark fest als „verdammt“.
- source_word: እስመ፡ ክሕድዎ፡ ለእግዚአ፡ መንፈሳት
  choice: denn sie haben den Herrn der Geister verleugnet
  rationale: Der etablierte Titel wird wörtlich bewahrt; „verleugnet“ gibt die starke Zurückweisung angemessen wieder.
- source_word: ወይሬእዩ፡ ኵነኔሆሙ፡ እንተ፡ ኵሉ፡ ዕለት
  choice: Tag für Tag sehen sie ihr Gericht
  rationale: „Tag für Tag“ ist eine natürliche Wiedergabe der fortdauernden zeitlichen Aussage; „Gericht“ bewahrt den forensischen Sinn.
- source_word: ወኢየአምኑ፡ በስሙ
  choice: glauben aber dennoch nicht an seinen Namen
  rationale: „Dennoch“ macht den im Satz liegenden Gegensatz zum fortwährenden Sehen ihres Gerichts idiomatisch deutlich.
theological_decisions:
- issue: Heilende und strafende Funktion der Wasser
  choice: Die Wasser dienen zugleich „zur Heilung des Körpers“ und „zur Bestrafung des Geistes“.
  alternative: Die Heilungssprache ironisch oder ausschließlich als Qual wiederzugeben.
  rationale: Der ge'ezische Text stellt die beiden Aussagen nebeneinander. Die theologische Spannung zwischen körperlicher Heilung und geistiger Bestrafung darf nicht durch Harmonisierung beseitigt werden.
- issue: Bedeutung der schwierigen Wendung mit ትውኔተ
  choice: „Ihr Geist wird von Lust erfüllt sein“ mit textkritischer Fußnote.
  alternative: „Freude“, „Wohlbehagen“, „Genuss“ oder eine konjekturale negative Bedeutung.
  rationale: Eine positive Grundbedeutung ist lexikalisch plausibel, wirkt im Gerichtskontext aber auffällig. Der Haupttext bewahrt diese Schwierigkeit, während die Fußnote die Unsicherheit offenlegt.
- issue: Gericht oder ausdrückliche Verdammnis
  choice: „gerichtet werden“ und „ihr Gericht“
  alternative: „verdammt werden“ und „ihre Strafe“
  rationale: Die neutralere Gerichtsterminologie wahrt den forensischen Wortlaut und lässt den ernsten Kontext dessen Ausgang anzeigen, ohne die Lexeme unnötig zu verschärfen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit apokalyptischem Ton. Die Satzstruktur wurde für gute Lesbarkeit in drei Sätze gegliedert. Archaismen und konfessionell geprägte Ausdeutungen wurden vermieden; die auffällige Spannung des Ausgangstextes bleibt sichtbar.
