base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/011.yaml
  text: And the waters themselves will be changed in those days[a], for when those angels are judged in those waters, these springs of water will change, and when the angels ascend[c][b], that water of the springs will change and grow cold.
translation:
  language: de
  text: Und die Wasser selbst werden sich in jenen Tagen verändern; denn wenn jene Engel in diesen Wassern gerichtet werden, werden sich diese Wasserquellen verändern. Und wenn die Engel emporsteigen[a], wird sich jenes Quellwasser verändern und kalt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wenn die Engel aufsteigen“. Worauf sich diese Aufwärtsbewegung genau bezieht, bleibt im äthiopischen Text unklar.'
    reason: alternative_reading
lexical_decisions:
- source_word: ኪያሁ፡ ማያት
  choice: die Wasser selbst
  rationale: Die emphatische Form wird mit „selbst“ wiedergegeben; der Plural bewahrt das konkrete visionäre Bild.
- source_word: ተውላጠ
  choice: werden sich verändern
  rationale: Die reflexive deutsche Form gibt den Zustandswechsel natürlich wieder, ohne eine handelnde Ursache hinzuzusetzen.
- source_word: ይትኴነኑ
  choice: gerichtet werden
  rationale: Die gerichtliche Bedeutung bleibt erhalten, ohne das Urteil bereits als Verurteilung oder Bestrafung festzulegen.
- source_word: በውእቱ፡ ማያት
  choice: in diesen Wassern
  rationale: Die Ortsangabe des ge’ezischen Textes wird ausdrücklich bewahrt.
- source_word: ዐያኖሙ፡ እልኩ፡ አንቅዐተ፡ ማያት
  choice: diese Wasserquellen
  rationale: Die Wendung wird quellenbezogen wiedergegeben; die frühere Deutung als „Hitze“ wird nicht in den Haupttext übernommen.
- source_word: የዐርጉ
  choice: emporsteigen
  rationale: Das Verb der Aufwärtsbewegung wird wörtlich genug wiedergegeben, ohne den unklaren Ablauf näher zu bestimmen.
- source_word: ዝኩ፡ ማያት፡ ዘአንቅዐት
  choice: jenes Quellwasser
  rationale: Die demonstrative und quellenbezogene Formulierung wird in idiomatischem Deutsch knapp bewahrt.
- source_word: ይቈርሩ
  choice: kalt werden
  rationale: Die resultative Veränderung wird unmittelbar und natürlich ausgedrückt.
theological_decisions:
- issue: Art des Gerichts über die Engel
  choice: Die Engel werden gerichtet.
  alternative: Die Engel werden verurteilt oder bestraft.
  rationale: Das Verb bezeichnet ein Gerichtsgeschehen; der Haupttext legt dessen Ausgang nicht stärker fest als die Quelle.
- issue: Zusammenhang zwischen dem Aufsteigen der Engel und der Veränderung des Wassers
  choice: Beide Vorgänge werden zeitlich miteinander verknüpft.
  alternative: Die Engel steigen aus den Quellen oder Strafwassern herauf.
  rationale: Der Text nennt die Aufwärtsbewegung, erklärt aber weder ihren Ausgangspunkt noch ihren Mechanismus; diese Unbestimmtheit bleibt erhalten.
- issue: Deutung von ዐያኖሙ
  choice: als Quellen
  alternative: als Hitze beziehungsweise heißer Zustand der Quellen
  rationale: Die belegte Bedeutung „Quellen/Augen“ wird im Haupttext bevorzugt. Eine aus dem abschließenden Kaltwerden erschlossene Bedeutung „Hitze“ würde den überlieferten Wortlaut interpretierend überschreiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer apokalyptischer Bildsprache. Die Satzstruktur bleibt nahe am ge’ezischen Zeugnis; die schwierige Passage wird nicht durch die nicht ausdrücklich vorhandene Vorstellung von „Hitze“ geglättet.
