base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/009.yaml
  text: And as the burning of their bodies is very great[a], so a change comes upon them in spirit forever and ever[c][b], because before the Lord of Spirits there is none who speaks a vain word.
translation:
  language: de
  text: Und wie die Glut ihrer Leiber sehr groß ist, so widerfährt ihnen im Geist eine Veränderung für immer und ewig,[a] denn vor dem Herrn der Geister gibt es niemanden, der ein nichtiges Wort spricht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die äthiopische Zeile ist schwierig. Der Satzteil kann auch wörtlicher verstanden werden: „So gibt es für sie eine Veränderung des Geistes für immer und ewig.“'
    reason: alternative_reading
lexical_decisions:
- source_word: ውዕየ
  choice: Glut
  rationale: Das Wort bezeichnet Brennen beziehungsweise starke Hitze. „Glut“ bewahrt das konkrete apokalyptische Bild und fügt sich natürlich zur Wendung von der großen körperlichen Pein.
- source_word: ሥጋሆሙ
  choice: ihre Leiber
  rationale: Wörtlich steht „ihr Fleisch“. „Ihre Leiber“ bezeichnet hier klar die körperliche Seite und wahrt zugleich einen würdevollen, apokalyptischen Ton.
- source_word: ተውላጠ
  choice: widerfährt ihnen … eine Veränderung
  rationale: Die Form bezeichnet eine Änderung oder einen Wechsel. Diese Wiedergabe erhält den resultativen Charakter, ohne eine vollständige Verwandlung zu behaupten.
- source_word: ለመንፈስ
  choice: im Geist
  rationale: Die Präpositionalfügung lässt sich als Bereich oder Hinsicht der Veränderung verstehen und bildet so den Gegensatz zur Glut der Leiber ab.
- source_word: ለዓለመ ዓለም
  choice: für immer und ewig
  rationale: Die verstärkte Zeitformel bezeichnet unabsehbare beziehungsweise unendliche Dauer und wird im Deutschen idiomatisch und feierlich wiedergegeben.
- source_word: እግዚአ መንፈሳት
  choice: Herr der Geister
  rationale: Dies ist ein fester göttlicher Titel im Henochbuch; die titelartige deutsche Form bleibt nahe am Ge'ez.
- source_word: ዘይነግር ነገረ በከ
  choice: der ein nichtiges Wort spricht
  rationale: „በከ“ ist hier als „nichtig, vergeblich“ zu verstehen. Die Wiedergabe bewahrt die Verbindung mit dem Wort des Sprechens, ohne unbegründet einen gegen andere gerichteten oder forensischen Sinn einzutragen.
theological_decisions:
- issue: Art und Träger der Veränderung
  choice: Die Veränderung widerfährt „ihnen im Geist“, ohne ihre genaue Beschaffenheit näher zu bestimmen.
  alternative: „Für sie gibt es eine Veränderung des Geistes für immer und ewig.“
  rationale: Die schwierige Ge'ez-Fügung lässt sowohl eine Veränderung hinsichtlich des Geistes als auch eine Veränderung des Geistes selbst zu. Der Haupttext wahrt den Kontrast zwischen Leib und Geist; die Fußnote hält die grammatische Alternative offen.
- issue: Aussage über das Sprechen vor dem Herrn der Geister
  choice: Niemand spricht dort ein nichtiges Wort.
  alternative: Niemand kann dort ein Wort gegen sie sprechen.
  rationale: Der Wortlaut stützt „nichtig/vergeblich“ stärker als einen pluralischen Bezug „gegen sie“. Daher wird keine nicht ausdrücklich markierte Anklagesituation in den Text eingetragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Klang. „Leiber“, „Glut“ und der feste Titel „Herr der Geister“ halten die Bildkraft und Feierlichkeit aufrecht; die schwierige Geist-Fügung wird nicht dogmatisch vereindeutigt.
