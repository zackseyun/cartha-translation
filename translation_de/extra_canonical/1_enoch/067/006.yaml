base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/006.yaml
  text: And when all this happened[a], from that fiery stream and their convulsion in that place, a smell of sulfur was produced and joined with those waters[c][b]; and that valley of the angels who led astray burns beneath that land.
translation:
  language: de
  text: Und als dies alles geschah, entstand aus jenem Feuerstrom und ihrer Erschütterung an jenem Ort ein Geruch von Schwefel[a], der sich mit jenen Wassern verband[b][c]; und das Tal der Engel, die in die Irre führten, brennt unter jenem Land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Auch „Schwefelgeruch“ oder, stärker wertend, „Schwefelgestank“.
    reason: lexical_alternative
  - marker: b
    text: „Der sich mit jenen Wassern verband“ kann auch mit „der sich mit jenen Wassern vermischte“ wiedergegeben werden.
    reason: alternative_reading
  - marker: c
    text: 'Der schwierige Satzbau lässt auch folgende Gliederung zu: „Und dies alles geschah aus jenem Feuerstrom; und an jenem Ort entstand aus ihrer Erschütterung ein Geruch von Schwefel.“'
    reason: alternative_reading
lexical_decisions:
- source_word: ነጠብጣብ እሳት
  choice: Feuerstrom
  rationale: Die Wendung bezeichnet bildhaft tropfendes oder fließendes Feuer. „Feuerstrom“ gibt das Bild in natürlichem Deutsch wieder, ohne es auf einzelne Tropfen einzuengen.
- source_word: ሀውኮሙ
  choice: ihre Erschütterung
  rationale: Das Wort bezeichnet hier eine Unruhe, Erschütterung oder heftige Bewegung. Das Possessivsuffix wird mit „ihre“ ausdrücklich wiedergegeben; sein Bezug bleibt wie im Ge’ez offen.
- source_word: መካን
  choice: Ort
  rationale: Der allgemeine Ortsbegriff wird ohne unnötige topografische Präzisierung wiedergegeben.
- source_word: ተወልደ
  choice: entstand
  rationale: Wörtlich liegt die Vorstellung des Geborenwerdens oder Hervorkommens vor; bei einem Geruch ist „entstand“ idiomatisch und bewahrt den Entstehungssinn.
- source_word: ጼና ተይ
  choice: Geruch von Schwefel
  rationale: Die Wiedergabe bewahrt sowohl den sinnlich wahrnehmbaren Geruch als auch den schwefelartigen Stoffbezug und ist im heutigen Deutsch klar.
- source_word: ተኃብረ ምስለ እልኩ ማያት
  choice: der sich mit jenen Wassern verband
  rationale: Das Verb kann ein Verbinden, Zusammenkommen oder Vermischen bezeichnen. „Sich verbinden“ wahrt diese Bedeutungsbreite; die Alternative „sich vermischen“ wird in der Fußnote genannt.
- source_word: ቈላ
  choice: Tal
  rationale: Der Ausdruck bezeichnet eine talartige Niederung; „Tal“ ist im visionären Landschaftsbild klar und angemessen.
- source_word: እንተ መላእክት እለ አስሐቱ
  choice: der Engel, die in die Irre führten
  rationale: Die aktive Relativform kennzeichnet die Engel am natürlichsten als diejenigen, die andere irreführten, ohne das nicht genannte Objekt zu ergänzen.
- source_word: ትነድድ መትሕተ ይእቲ ምድር
  choice: brennt unter jenem Land
  rationale: Die Form beschreibt ein fortdauerndes Brennen unter dem örtlich gemeinten Land beziehungsweise Boden; „Land“ vermeidet eine vorschnelle Ausweitung auf die ganze Erde.
theological_decisions:
- issue: Rolle der Engel bei der Irreführung
  choice: die Engel, die in die Irre führten
  alternative: die Engel, die in die Irre geführt wurden; die Engel der Täuschung
  rationale: Die aktive Verbform spricht am ehesten von den Engeln als Handelnden. Die Formulierung bleibt beim örtlichen henochischen Wortlaut und harmonisiert ihn nicht mit späteren dämonologischen Vorstellungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die schwer aufzulösende Satzfügung und der unklare Bezug von „ihre“ werden nicht stillschweigend vereindeutigt; alternative Gliederung und Mischungsbedeutung stehen in den Fußnoten.
