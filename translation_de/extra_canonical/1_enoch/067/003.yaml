base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/003.yaml
  text: And I will establish your offspring before me forever and ever[a], and I will make those who dwell with you fruitful. It shall not be barren upon the face of the dry ground[c][b], but it shall be blessed and multiplied on the dry ground in the name of the Lord.
translation:
  language: de
  text: Und ich werde deine Nachkommenschaft vor mir für immer und ewig festigen, und ich werde die, die bei dir wohnen, ausstreuen. Sie wird auf dem trockenen Boden nicht unfruchtbar sein[a][b], sondern auf dem trockenen Boden im Namen des Herrn gesegnet werden und sich vermehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte äthiopische Wortlaut ist hier mit einem Obelus als problematisch gekennzeichnet und bedeutet anscheinend: „Sie wird auf dem trockenen Boden nicht beraten/überlegen.“ Die Übersetzung „nicht unfruchtbar sein“ folgt einer naheliegenden, aber emendierten Lesart, die zum anschließenden Gesegnetwerden und Sichvermehren passt.'
    reason: textual_variant
  - marker: b
    text: „Trockener Boden“ gibt den konkreten Ausdruck wörtlich wieder; gemeint sein kann allgemeiner auch „Land“ oder „Erde“.
    reason: lexical_alternative
lexical_decisions:
- source_word: አጸንዖ
  choice: fest gründen
  rationale: Das Verb bezeichnet ein Festmachen oder dauerhaftes Begründen. „Fest gründen“ bewahrt sowohl die Beständigkeit als auch den gehobenen Verheißungston.
- source_word: ዘርእከ
  choice: deine Nachkommenschaft
  rationale: Der kollektive Singular bezeichnet Same beziehungsweise Nachkommen. „Nachkommenschaft“ ist im Deutschen natürlich und ermöglicht den singularischen Rückbezug der folgenden Verben.
- source_word: በቅድሜየ
  choice: vor mir
  rationale: Die knappe räumlich-relationale Wendung bleibt erhalten, ohne eine besondere Bundesterminologie hinzuzufügen.
- source_word: ለዓለመ ዓለም
  choice: für immer und ewig
  rationale: Die geläufige deutsche Ewigkeitsformel gibt die verstärkende Wiederholung angemessen wieder.
- source_word: አዘርኦሙ
  choice: fruchtbar machen
  rationale: Die Form gehört in das Bedeutungsfeld von Säen, Ausbreiten und Hervorbringen. Im Zusammenhang mit Unfruchtbarkeit, Segen und Vermehrung gibt „fruchtbar machen“ den positiven Sinn natürlich wieder, ohne den Satz als Zerstreuung zu deuten.
- source_word: እለ ያኃድሩ ምስሌከ
  choice: die, die bei dir wohnen
  rationale: Die Formulierung gibt das gemeinsame Wohnen verständlich und zugleich würdevoll wieder.
- source_word: †ኢይመክር
  choice: nicht unfruchtbar sein
  rationale: Der überlieferte, mit einem Obelus als problematisch gekennzeichnete Wortlaut bedeutet anscheinend „nicht beraten/überlegen“. Im Kontext legt eine sehr nahe Emendation jedoch „nicht unfruchtbar sein“ nahe; diese kontextuell stimmige Lesart steht im Haupttext, die Unsicherheit wird offengelegt.
- source_word: ገጸ የብስ
  choice: auf der Oberfläche des trockenen Bodens
  rationale: Die konkrete Bildsprache von „Oberfläche/Angesicht“ und „trockenem Boden“ wird bewahrt, statt sie stillschweigend zu „Erde“ oder „Land“ zu verallgemeinern.
- source_word: ይትባረክ
  choice: gesegnet werden
  rationale: Die passive Wiedergabe passt zur grammatischen Form und zur Folge von Segen und Vermehrung.
- source_word: ይትባዛሕ
  choice: sich vermehren
  rationale: Die singularische Verbform wird auf die kollektive „Nachkommenschaft“ bezogen und mit einer natürlichen deutschen Vermehrungsformel wiedergegeben.
- source_word: በስሙ ለእግዚአ
  choice: im Namen des Herrn
  rationale: Dies ist die natürliche und traditionsübergreifend verständliche Wiedergabe der Präpositionalwendung mit dem göttlichen Titel.
theological_decisions:
- issue: Soll die Verheißung ausdrücklich als Bundesaussage formuliert werden?
  choice: Die Nachkommenschaft wird „vor mir fest gegründet“, ohne das Wort „Bund“ einzufügen.
  alternative: „Ich werde meinen Bund mit deiner Nachkommenschaft bestätigen.“
  rationale: Der Wortlaut trägt starke Verheißungs- und Dauersemantik, nennt aber keinen Bund. Die Übersetzung bewahrt das theologische Gewicht, ohne eine zusätzliche Kategorie einzutragen.
- issue: Wie ist die verderbte negative Klausel zu behandeln?
  choice: Im Haupttext steht die kontextuell naheliegende Lesart „nicht unfruchtbar sein“, versehen mit einer textkritischen Fußnote.
  alternative: „Sie wird auf der Oberfläche des trockenen Bodens nicht beraten/überlegen.“
  rationale: Der überlieferte Wortlaut ist syntaktisch und semantisch schwierig und im Text mit einem Obelus markiert. Eine nahezu gleich geschriebene Lesart aus dem Bedeutungsfeld „unfruchtbar sein“ passt zum anschließenden Gesegnetwerden und Sichvermehren; die handschriftliche Unsicherheit darf dennoch nicht verborgen werden.
- issue: Worauf beziehen sich die singularischen Verben des letzten Satzes?
  choice: Auf die kollektiv-singularische „Nachkommenschaft“, daher „sie“ im Singular.
  alternative: Auf „die, die bei dir wohnen“, daher ein pluralischer Rückbezug.
  rationale: Die Verben sind maskulin Singular und passen grammatisch zu ዘርእከ, der kollektiv-singularischen Nachkommenschaft, besser als zur pluralischen Personengruppe.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die Wiederholung „trockener Boden“ bleibt wegen der Wiederholung im Ausgangstext erhalten. Der singularische Rückbezug „sie“ bezeichnet die kollektiv verstandene Nachkommenschaft.
