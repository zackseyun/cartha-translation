  to: Und ich werde deine Nachkommenschaft vor mir für immer und ewig festigen, und ich werde die, die bei dir wohnen, ausstreuen. Sie wird auf dem trockenen Boden nicht unfruchtbar sein[a][b], sondern auf dem trockenen Boden im Namen des Herrn gesegnet werden und sich vermehren.
