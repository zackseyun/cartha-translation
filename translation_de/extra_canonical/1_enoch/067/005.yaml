base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/067/005.yaml
  text: And I saw that valley in which there was a great convulsion and a convulsion of waters[a].
translation:
  language: de
  text: Und ich sah jenes Tal, in dem es eine gewaltige Erschütterung und eine Erschütterung der Wasser gab[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „eine gewaltige Umwälzung … und eine Umwälzung der Wasser“. Der wiederholte geʽezische Ausdruck bezeichnet eine heftige Störung; seine genaue Bedeutung kann von Aufruhr bis zu Erschütterung oder Umwälzung reichen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ወርኢክዋ
  choice: Und ich sah
  rationale: Die visionäre Erzählformel des Verbs „sehen“ wird direkt wiedergegeben; „Und“ bewahrt die fortlaufende apokalyptische Erzählstruktur. Das Objektsuffix wird zusammen mit dem folgenden Ausdruck natürlich als „jenes Tal“ erfasst.
- source_word: ለይእቲ ቈላ
  choice: jenes Tal
  rationale: ቈላ bezeichnet eine Niederung oder ein Tal. „Tal“ ist im Deutschen natürlich und passt zur Landschaft des Kontextes; das Demonstrativ wird mit „jenes“ bewahrt.
- source_word: እንተ ሀውከ ዓቢይ ባቲ
  choice: in dem eine gewaltige Erschütterung herrschte
  rationale: Die Relativkonstruktion beschreibt, was sich in dem Tal befand beziehungsweise dort herrschte. ሀውከ bezeichnet heftige Unruhe, Erschütterung oder Umwälzung; „Erschütterung“ wahrt die konkrete apokalyptische Kraft, ohne ausdrücklich ein Erdbeben zu behaupten. ዓቢይ wird idiomatisch mit „gewaltig“ wiedergegeben.
- source_word: ወሀውከ ማያት
  choice: eine Erschütterung der Wasser
  rationale: Dasselbe deutsche Wort wird wiederholt, um die Wiederholung von ሀውከ zu erhalten. Der Plural ማያት wird als „Wasser“ im pluralisch-kollektiven Sinn wiedergegeben.
theological_decisions:
- issue: Art der Unruhe im Tal
  choice: Konkrete, kosmisch-physische Erschütterung
  alternative: allgemeiner Aufruhr oder bloße Unruhe
  rationale: Der Gerichtskontext legt eine heftige Störung der geschaffenen Welt nahe. „Erschütterung“ hält das Bild konkret und apokalyptisch, legt es aber nicht enger als der ge'ezische Ausdruck auf ein Erdbeben fest.
- issue: Verhältnis der beiden Vorkommen von ሀውከ
  choice: Die lexikalische Wiederholung wird im Deutschen bewahrt
  alternative: Das zweite Vorkommen mit einem anderen Ausdruck stilistisch variieren
  rationale: Die Wiederholung ist ein erkennbares rhetorisches Merkmal des Ausgangstextes und soll nicht geglättet werden. Die Zeichensetzung lässt offen, ob der zweite Ausdruck die erste Erschütterung näher bestimmt oder eine weitere nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erschütterung“ klingt natürlicher als „Konvulsion“, bewahrt jedoch dessen körperlich-kosmische Stärke. Die Wiederholung des Schlüsselworts bleibt erhalten; „Wasser“ ist hier als pluralischer Sammelbegriff zu verstehen.
