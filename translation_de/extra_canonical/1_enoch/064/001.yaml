base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/064/001.yaml
  text: And I saw other hidden faces in that place[a].
translation:
  language: de
  text: Und ich sah an jenem Ort andere verborgene Gesichter[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Antlitze«; das ge’ezische Wort bedeutet wörtlich »Gesichter« und kann hier Personen meinen, die in einer Vision erscheinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ካልአ
  choice: andere
  rationale: Das Adjektiv bezeichnet weitere Erscheinungen neben den zuvor gesehenen und stimmt hier mit dem pluralischen Substantiv überein.
- source_word: ገጻተ
  choice: Gesichter
  rationale: Die konkrete Grundbedeutung wird bewahrt, damit das eindringliche visionäre Bild nicht vorschnell als »Personen« oder »Wesen« gedeutet wird.
- source_word: ርኢኩ
  choice: ich sah
  rationale: Die schlichte Vergangenheitsform gibt den visionären Bericht klar und in modernem Deutsch wieder.
- source_word: በውእቱ መካን
  choice: an jenem Ort
  rationale: Die Wendung verweist auf den bereits vorausgesetzten Schauplatz; »an jenem Ort« klingt im Deutschen natürlich und würdevoll.
- source_word: ኅቡኣተ
  choice: verborgene
  rationale: Das Wort bezeichnet etwas Verborgenes oder Verdecktes. »Verborgen« erhält den geheimnisvollen apokalyptischen Charakter ohne zusätzliche Deutung.
theological_decisions:
- issue: Ob ገጻተ konkret als »Gesichter« oder deutend als »Personen/Wesen« wiederzugeben ist
  choice: Gesichter
  alternative: Personen; Wesen; Antlitze
  rationale: Da der kurze Vers visionäre Bildsprache verwendet und der Zusammenhang keine abstraktere Wiedergabe erzwingt, bleibt das konkrete Bild erhalten. Eine Übersetzung als »Personen« oder »Wesen« würde eine mögliche Bedeutung zur eindeutigen Auslegung machen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, knappem Erzählton. Die ungewöhnliche visionäre Bildsprache bleibt bewusst erhalten.
