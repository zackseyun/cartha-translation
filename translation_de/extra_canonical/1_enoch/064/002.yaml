base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/064/002.yaml
  text: And I heard the voice of the angel saying[a], 'These are the angels who came down upon the earth and revealed what was hidden to the children of men[b], and led the children of men astray so that they committed sin.'
translation:
  language: de
  text: 'Und ich hörte die Stimme des Engels, der sagte: »Dies sind die Engel, die auf die Erde herabstiegen, den Menschenkindern[a] das Verborgene enthüllten[b] und die Menschenkinder in die Irre führten, sodass sie Sünde begingen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich »den Kindern der Menschen«; eine für das Henochbuch typische Bezeichnung für die Menschheit.
    reason: cultural_note
  - marker: b
    text: 'Auch möglich: »das Verborgene offenlegten«. Der geezische Ausdruck bezeichnet die Enthüllung dessen, was verborgen war, ohne hier näher anzugeben, um welche Geheimnisse es sich handelte.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ሰማዕኩ
  choice: ich hörte
  rationale: Die erste Person des abgeschlossenen Hörvorgangs wird im visionären Erzählzusammenhang unmittelbar und natürlich wiedergegeben.
- source_word: ቃሎ ለመልአክ
  choice: die Stimme des Engels
  rationale: ቃል kann »Wort«, »Rede« oder »Stimme« bedeuten; zusammen mit dem Verb des Hörens bezeichnet »Stimme« am klarsten das hörbare Sprechen des Engels.
- source_word: እንዘ ይብል
  choice: sagen
  rationale: Die Konstruktion führt die direkte Rede ein; der deutsche Infinitiv nach »hörte« bildet den fortlaufenden Erzählfluss idiomatisch ab.
- source_word: እሉ ውእቶሙ
  choice: Dies sind
  rationale: Bewahrt die hinweisende Identifikationsformel in natürlichem modernem Deutsch.
- source_word: መላእክት እለ ወረዱ ዲበ ምድር
  choice: die Engel, die auf die Erde herabstiegen
  rationale: »Herabstiegen« erhält die räumliche und apokalyptische Vorstellung des Abstiegs; »auf die Erde« gibt die Präposition angemessen wieder.
- source_word: ወዘበኅቡእ ከሠቱ
  choice: das Verborgene enthüllten
  rationale: Die Formulierung wahrt den Gegensatz zwischen Verborgenheit und Offenlegung, ohne den nicht näher bestimmten Inhalt als Geheimkünste, Mysterien oder besondere Lehren auszudeuten.
- source_word: ለውሉደ ሰብእ
  choice: den Menschenkindern
  rationale: »Menschenkinder« bewahrt die für Henoch charakteristische kollektive Bezeichnung und ist zugleich im Deutschen verständlich.
- source_word: ወአስሐትዎሙ
  choice: in die Irre führten
  rationale: Die Wendung umfasst Täuschung und moralische Irreführung, ohne die Art der Verführung genauer festzulegen als der Ausgangstext.
- source_word: ከመ ይግበሩ ኃጢአተ
  choice: sodass sie Sünde begingen
  rationale: Die Formulierung gibt die mögliche Zweck- beziehungsweise Folgebeziehung wieder und bezeichnet die moralische Handlung ohne zusätzliche dogmatische Präzisierung.
theological_decisions:
- issue: Identität der herabgestiegenen Engel
  choice: Nur »die Engel, die auf die Erde herabstiegen«
  alternative: »die Wächter« oder »die gefallenen Engel«
  rationale: Der örtliche Wortlaut nennt sie lediglich Engel. Die im weiteren henochischen Zusammenhang mögliche Identifikation mit den Wächtern wird daher nicht in diesen Vers hineingetragen.
- issue: Art des offenbarten verborgenen Inhalts
  choice: »das Verborgene«
  alternative: »geheimes Wissen«, »verbotene Künste« oder »Mysterien«
  rationale: Der Vers bestimmt den Inhalt nicht näher. Die allgemeine Wiedergabe erhält diese Offenheit und vermeidet eine Harmonisierung mit ausführlicheren Traditionen.
- issue: Verhältnis von Irreführung und Sünde
  choice: »sodass sie Sünde begingen«
  alternative: »damit sie Sünde begingen«
  rationale: Die geezische Konstruktion kann Zweck oder Folge ausdrücken. »Sodass« bildet die erkennbare Folge ab, ohne ausdrücklich zu behaupten, die Sünde der Menschen sei das alleinige Ziel der Engel gewesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle henochische Bezeichnung »Menschenkinder« bleibt erhalten, während Satzbau und direkte Rede für heutige Leser klar und flüssig gestaltet sind.
