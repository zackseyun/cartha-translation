base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/004.yaml
  text: On that day I will cause my Chosen One to dwell among them[c][b][a], and I will transform heaven and make it a blessing and a light forever.
translation:
  language: de
  text: An jenem Tag werde ich meinen Erwählten[a] in ihrer Mitte wohnen lassen; ich werde den Himmel verwandeln und ihn für immer zu einem Segen und einem Licht machen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: „meinen Auserwählten“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: በይእቲ፡ ዕለት
  choice: An jenem Tag
  rationale: Gibt die geläufige apokalyptische Zeitformel in natürlichem, würdevollem Deutsch wieder.
- source_word: አነብር
  choice: werde ich … wohnen lassen
  rationale: 'Bewahrt die kausative Bedeutung des Verbs: Der Sprecher lässt die bezeichnete Person wohnen beziehungsweise setzt sie als Bewohner ein.'
- source_word: ማእከሎሙ
  choice: in ihrer Mitte
  rationale: Entspricht dem räumlichen Ausdruck genauer als das ebenfalls mögliche „unter ihnen“ und klingt im Deutschen natürlich.
- source_word: ለኅሩየ፡ ዚአየ
  choice: meinen Erwählten
  rationale: Gibt den Titel transparent wieder, ohne ihn mit einer späteren messianischen Benennung zu harmonisieren; „meinen Auserwählten“ bleibt als mögliche Wiedergabe in der Fußnote erhalten.
- source_word: ወእዌልጦ፡ ለሰማይ
  choice: ich werde den Himmel verwandeln
  rationale: „Verwandeln“ erhält die Kraft des kosmischen Erneuerungsbildes; „Himmel“ bezeichnet hier eher den kosmischen Bereich als nur den sichtbaren Luftraum.
- source_word: ወእገብራ፡ በረከተ፡ ወብርሃነ
  choice: und ihn … zu einem Segen und einem Licht machen
  rationale: Das Pronomen bezieht sich auf den Himmel. Die beiden Substantive werden konkret belassen, statt sie zu den Adjektiven „gesegnet“ und „licht“ zu verflachen.
- source_word: ለዓለም
  choice: für immer
  rationale: Gibt die adverbiale Zeitbestimmung syntaktisch genauer wieder als ein attributives „ewig“.
theological_decisions:
- issue: Titel ኅሩየ ዚአየ
  choice: meinen Erwählten
  alternative: meinen Auserwählten
  rationale: Der lokale Titel wird übersetzt, aber weder christologisch erweitert noch mit späteren Titelformeln harmonisiert.
- issue: Art der Verwandlung des Himmels
  choice: den Himmel verwandeln und ihn … zu einem Segen und einem Licht machen
  alternative: den Himmel verändern und ihn für immer gesegnet und licht machen
  rationale: Die gewählte Fassung bewahrt das konkrete apokalyptische Bild, in dem der Himmel selbst Gegenstand kosmischer Erneuerung ist, sowie die substantivische Spannung von „Segen“ und „Licht“.
translation_notes:
  register: Modernes Standarddeutsch mit würdevollem apokalyptischem Ton. Die Satzstruktur bleibt quellennah, ohne unnötig altertümlich zu wirken; das Semikolon gliedert die beiden Zukunftsaussagen klar.
