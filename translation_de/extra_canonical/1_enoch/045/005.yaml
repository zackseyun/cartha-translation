base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/005.yaml
  text: And I will transform the dry land and make it a blessing[a], and I will cause my chosen ones to dwell in it[c][b]; but those who commit sin and transgression shall not set foot in it.
translation:
  language: de
  text: Und ich werde das trockene Land verwandeln und es zu einem Segen machen; und ich werde meine Erwählten darin wohnen lassen. Doch die, die Sünde und Übertretung begehen, werden es nicht betreten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »werden nicht darin/darauf gehen«; gemeint ist, dass ihnen der Zugang zu dem verwandelten Land verwehrt bleibt.'
    reason: lexical_alternative
lexical_decisions:
- source_word: እዌልጦ
  choice: ich werde … verwandeln
  rationale: Das Verb bezeichnet eine Zustandsänderung; »verwandeln« gibt die starke eschatologische Umkehr natürlicher wieder als das schwächere »verändern«.
- source_word: ለየብስ
  choice: das trockene Land
  rationale: የብስ bezeichnet trockenes Land bzw. Festland. Im Zusammenhang mit dem Himmel des vorangehenden Verses wahrt »das trockene Land« sowohl das konkrete Bild als auch den möglichen kosmischen Umfang.
- source_word: እገብራ በበረከት
  choice: es zu einem Segen machen
  rationale: Die resultative Konstruktion beschreibt, dass das Land zum Segen wird; die substantivische Formulierung bewahrt diesen Sinn.
- source_word: ሕሩያነ ዚአየ
  choice: meine Erwählten
  rationale: Die Wendung bezeichnet die von Gott Ausgewählten. »Meine Erwählten« ist im Deutschen klar und würdig, ohne die Gruppe mit einer späteren kirchlichen Kategorie gleichzusetzen.
- source_word: አነብሮሙ ውስቴታ
  choice: ich werde … darauf wohnen lassen
  rationale: Die Kausativform macht den Sprecher zum Handelnden, der die Erwählten dort ansiedelt; »darauf« nimmt das Land als bewohnbare Fläche auf.
- source_word: ኃጢአተ ወጌጋየ
  choice: Sünde und Übertretung
  rationale: Die beiden Ausdrücke werden nicht zu einem allgemeinen Begriff eingeebnet, sondern bewahren die verstärkende Doppelung moralischer Verfehlung.
- source_word: ኢይከይዱ ውስቴታ
  choice: werden es nicht betreten
  rationale: Wörtlich steht ein Verb des Gehens. »Nicht betreten« ist natürliches Deutsch und drückt den verweigerten Zugang aus, ohne das Verb unnötig bildhaft zu verstärken.
theological_decisions:
- issue: Identität der »Erwählten«
  choice: meine Erwählten
  alternative: meine Heiligen
  rationale: Die Übersetzung bewahrt die lokale apokalyptische Bezeichnung für Gottes Ausgewählte und vermeidet eine Harmonisierung mit späterer kirchlicher Terminologie.
- issue: Umfang der Landverheißung
  choice: konkret als Verwandlung des »trockenen Landes« wiedergeben
  alternative: als »Erde« verallgemeinern oder als »Wüste« lokalisieren
  rationale: Der äthiopische Ausdruck lässt das Bild des trockenen Landes erkennen und kann im Kontext zugleich kosmische Weite haben. Die Übersetzung hält beide Möglichkeiten offen.
- issue: Ausschluss der Sünder
  choice: werden es nicht betreten
  alternative: werden nicht darauf gehen
  rationale: Die Formulierung bewahrt den konkreten Zugang zum erneuerten Land, ohne eine weitergehende Aussage über das endgültige Schicksal der Betroffenen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit biblisch-apokalyptischem Klang. Die Satzglieder folgen der Wiederholungsstruktur des Ge’ez, während Wortstellung und Zeichensetzung natürlich deutsch gestaltet sind.
