base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/003.yaml
  text: On that day my Chosen One will sit on the throne of glory[a], and he will choose their works and their resting places without number[d][c][b]; and their souls will grow strong within them when they see my Chosen Ones and those who have called on my glorious name.
translation:
  language: de
  text: An jenem Tag wird mein Erwählter auf dem Thron der Herrlichkeit sitzen. Er wird ihre Werke auswählen,[a] und ihre Ruhestätten werden zahllos sein.[b] Ihre Seelen werden in ihrem Innern erstarken, wenn sie meine Erwählten[c] und jene sehen, die bei meinem herrlichen Namen Zuflucht gesucht haben.[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Verb kann hier „auswählen“, „ordnen“ oder möglicherweise „prüfen“ bedeuten. Die schwierige Formulierung wird nicht zu „richten“ vereindeutigt.
    reason: lexical_alternative
  - marker: b
    text: 'Die Satzfügung ist unsicher. Möglich ist auch: „Er wird ihre Werke und ihre zahllosen Ruhestätten auswählen.“ „Ruhestätten“ kann außerdem „Wohnstätten“ oder „Standorte“ bedeuten.'
    reason: textual_ambiguity
  - marker: c
    text: Der Text wechselt vom Singular „mein Erwählter“ zum Plural „meine Erwählten“. Dieser möglicherweise bedeutsame, jedoch schwierige Wechsel wird nicht angeglichen.
    reason: textual_variant
  - marker: d
    text: Wörtlich geht es um Menschen, die zu dem herrlichen Namen geflohen sind beziehungsweise bei ihm Zuflucht genommen haben; nicht einfach um solche, die den Namen „angerufen“ haben.
    reason: lexical_clarification
lexical_decisions:
- source_word: በይእቲ ዕለት
  choice: An jenem Tag
  rationale: Bewahrt die prophetisch-apokalyptische Zeitformel in natürlichem modernem Deutsch.
- source_word: ይነብር ዲበ መንበረ ስብሐት
  choice: wird … auf dem Thron der Herrlichkeit sitzen
  rationale: Im Zusammenhang mit einem Thron bezeichnet das Verb das Sitzen beziehungsweise die Inthronisierung; die Genitivverbindung bleibt erhalten.
- source_word: ኅሩየየ
  choice: mein Erwählter
  rationale: Gibt Singular und Possessivsuffix wieder und bewahrt den Titel, ohne ihn mit einer anderen Gestaltbezeichnung gleichzusetzen.
- source_word: የኀሪ ምግባሪሆሙ
  choice: Er wird ihre Werke auswählen
  rationale: Das Verb ist mit der Bezeichnung „Erwählter“ verwandt und bedeutet zunächst auswählen; „Werke“ bewahrt den offenen Bezug auf Taten oder Verhalten.
- source_word: ወምዕራፎሙ ኍልቈ አልቦ
  choice: und ihre Ruhestätten werden zahllos sein
  rationale: 'Die Abfolge lässt sich am natürlichsten als neuer, nominaler Satz verstehen: Von ihren Ruheorten wird gesagt, dass sie ohne Zahl sind.'
- source_word: ወነፍሶሙ በማእከሎሙ ትጸንዕ
  choice: Ihre Seelen werden in ihrem Innern erstarken
  rationale: Gibt sowohl die innere Verortung als auch den Sinn von Festwerden beziehungsweise Erstarken wieder.
- source_word: ለኅሩያነ ዚአየ
  choice: meine Erwählten
  rationale: Bewahrt den auffälligen Wechsel vom singularischen „mein Erwählter“ zum Plural.
- source_word: እለ ሰከዩ ስምየ ስቡሐ
  choice: jene, die bei meinem herrlichen Namen Zuflucht gesucht haben
  rationale: ሰከየ bezeichnet Fliehen beziehungsweise Zufluchtnehmen; diese Wiedergabe vermeidet die sachlich weniger genaue Angleichung an die Wendung „den Namen anrufen“.
theological_decisions:
- issue: Identität des singularischen Titels „mein Erwählter“
  choice: Der örtliche Titel wird unverändert beibehalten.
  alternative: Messias; Menschensohn
  rationale: Der Vers selbst verwendet den Titel „mein Erwählter“; eine Gleichsetzung mit anderen Titeln würde eine weitergehende theologische Identifikation in den Text eintragen.
- issue: Wechsel vom singularischen Erwählten zu den pluralischen Erwählten
  choice: Singular und Plural werden im Haupttext unterschieden.
  alternative: Beide Stellen an den Singular oder beide an den Plural angleichen
  rationale: Der überlieferte geezsprachige Text zeigt den Wechsel. Er kann eine Unterscheidung zwischen der thronenden Gestalt und einer zugehörigen Gemeinschaft ausdrücken, bleibt aber schwierig und wird daher nicht harmonisiert.
- issue: Bezug von „ohne Zahl“
  choice: „Ohne Zahl“ wird prädikativ auf die Ruhestätten bezogen.
  alternative: Der Erwählte wählt ihre Werke und ihre unzähligen Ruhestätten aus.
  rationale: Wortfolge und syntaktische Gliederung begünstigen einen eigenen Satz über die Ruhestätten; die alternative Verbindung bleibt jedoch möglich und wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptischer Bildsprache. Ungewöhnliche Quelltextformulierungen werden lesbar wiedergegeben, ohne die syntaktischen und theologischen Spannungen stillschweigend aufzulösen.
