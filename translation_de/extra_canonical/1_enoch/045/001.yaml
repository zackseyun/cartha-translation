base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/001.yaml
  text: And this is the second parable concerning those who deny the name of the dwelling of the holy ones and of the Lord of Spirits[a][b][c].
translation:
  language: de
  text: Und dies ist das zweite Gleichnis über diejenigen, die den Namen der Wohnstätte der Heiligen und des Herrn der Geister verleugnen.[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der ge'ezische Wortlaut nach „verleugnen“ ist schwer zu deuten. Gemeint sein kann „den Namen der Wohnstätte der Heiligen und des Herrn der Geister“; auch andere syntaktische Zuordnungen sind möglich.
    reason: textual_variant
  - marker: b
    text: „Die Heiligen“ kann hier himmlische heilige Wesen, die Gerechten oder eine bewusst beide Vorstellungen umfassende Gruppe bezeichnen.
    reason: lexical_alternative
  - marker: c
    text: 'Oder: „ein anderes Gleichnis“. Im Zusammenhang der nummerierten Abfolge der Gleichnisse ist „das zweite Gleichnis“ wahrscheinlicher.'
    reason: previous_rendering
lexical_decisions:
- source_word: ወዝ
  choice: Und dies ist
  rationale: Die Verbindung aus Konjunktion und Demonstrativ leitet einen neuen Abschnitt ein; im Deutschen ist „Und dies ist“ eine natürliche und zugleich formnahe Wiedergabe.
- source_word: ካልእ ምሳሌ
  choice: das zweite Gleichnis
  rationale: ካልእ kann „ein anderes“ oder „das zweite“ bedeuten. Da die Gleichnisreden ausdrücklich als Abfolge gegliedert sind und später das dritte Gleichnis folgt, gibt „das zweite“ hier die strukturelle Funktion am besten wieder.
- source_word: ዲበ
  choice: über
  rationale: Die Präposition bezeichnet hier das Thema des Gleichnisses und nicht eine räumliche Lage.
- source_word: እለ ይክሕዱ
  choice: diejenigen, die … verleugnen
  rationale: Die Verbindung aus Relativmarker und Verb bezeichnet eine Personengruppe. „Verleugnen“ bewahrt den Sinn einer entschiedenen Zurückweisung, ohne festzulegen, ob sie sprachlich, praktisch oder bundestheologisch gemeint ist.
- source_word: ስሞ
  choice: den Namen
  rationale: Das Wort bedeutet am unmittelbarsten „Name“. Wegen der schwierigen Anschlusskonstruktion wird es nicht deutend als „Autorität“ oder „Majestät“ paraphrasiert.
- source_word: ለማኅደረ ቅዱሳን
  choice: der Wohnstätte der Heiligen
  rationale: ማኅደር bezeichnet gewöhnlich eine Wohn- oder Aufenthaltsstätte. „Wohnstätte“ bewahrt die räumliche Bildwelt und den schwer verständlichen Genitivanschluss.
- source_word: ቅዱሳን
  choice: der Heiligen
  rationale: Der Ausdruck kann in diesem apokalyptischen Zusammenhang himmlische heilige Wesen, die gerechte Gemeinschaft oder beide zugleich bezeichnen. „Die Heiligen“ lässt den Bezug offen.
- source_word: ወእግዚአ መናፍስት
  choice: und des Herrn der Geister
  rationale: Dies ist ein wiederkehrender göttlicher Titel in den Gleichnisreden und wird als Titel übersetzt.
theological_decisions:
- issue: Bezug von „die Heiligen“
  choice: Als „die Heiligen“ bewusst offengelassen
  alternative: Himmlische heilige Wesen; die Gemeinschaft der Gerechten
  rationale: Der unmittelbare Wortlaut bestimmt die Gruppe nicht eindeutig. Die Übersetzung bewahrt daher die für 1 Henoch charakteristische mögliche Überlagerung.
- issue: Sinn der schwierigen Wortfolge nach „den Namen … verleugnen“
  choice: 'Relativ wörtliche Wiedergabe: „den Namen der Wohnstätte der Heiligen und des Herrn der Geister“'
  alternative: „den Namen verleugnen, durch den die Heiligen wohnen“; „die Wohnstätte der Heiligen und den Herrn der Geister verleugnen“; „den Namen des Herrn der Geister in der Wohnstätte der Heiligen verleugnen“
  rationale: Die ge'ezische Konstruktion ist syntaktisch schwer zu bestimmen, und es fehlt hier eine sichere griechische oder qumranische Kontrollüberlieferung. Eine transparente Wiedergabe mit Fußnote vermeidet eine unbegründete theologische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schwer verständliche Genitivfolge des Ausgangstextes bleibt erkennbar, wird aber durch geläufige Satzstellung lesbar gemacht. „Gleichnis“, „Wohnstätte“ und „Herr der Geister“ halten das apokalyptische Register, ohne unnötig altertümlich zu wirken.
