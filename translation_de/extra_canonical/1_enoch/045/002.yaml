base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/045/002.yaml
  text: And they will not ascend to heaven, nor will they arrive on earth; thus it shall be the portion of the sinners who denied the name of the Lord of Spirits, who are thus kept for the day of affliction and tribulation.
translation:
  language: de
  text: Und sie werden weder zum Himmel hinaufsteigen noch auf die Erde gelangen.[a][c] So wird es das Los der Sünder sein, die den Namen des Herrn der Geister verleugnet haben und für den Tag der Bedrängnis und Drangsal[b] aufbewahrt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Anfangssatz ist im Ge’ez inhaltlich ungewöhnlich. Gemeint ist offenbar, dass den Sündern weder der Himmel noch die Erde als Ziel oder Zuflucht offensteht; das genaue Bild bleibt jedoch unsicher.
    reason: textual_variant
  - marker: b
    text: 'Oder: „für den Tag der Unterdrückung und Bedrängnis“. Das Begriffspaar verstärkt die Ankündigung des kommenden Gerichts.'
    reason: lexical_alternative
  - marker: c
    text: 'Eine ältere Deutung versteht Himmel und Erde als Subjekte: „Und der Himmel wird sie nicht aufnehmen, noch wird die Erde sie erreichen.“ Die Grammatik spricht jedoch eher dafür, die Sünder als Subjekt der beiden Verben zu lesen.'
    reason: previous_rendering
lexical_decisions:
- source_word: የዐርጉ
  choice: zum Himmel hinaufsteigen
  rationale: Das Verb bezeichnet eine Aufwärtsbewegung; zusammen mit dem Richtungsakkusativ ሰማየ ist „zum Himmel hinaufsteigen“ grammatisch und lexikalisch naheliegend.
- source_word: ይበጽሑ
  choice: auf die Erde gelangen
  rationale: Das Verb bedeutet „ankommen, gelangen, erreichen“. Die Wiedergabe erhält die parallele Richtungsangabe, ohne das schwierige Bild zu glätten.
- source_word: ክፍለ
  choice: Los
  rationale: „Los“ bezeichnet hier den einer Gruppe zugewiesenen Anteil beziehungsweise ihr Geschick und passt zum Gerichtskontext.
- source_word: ኃጥኣን
  choice: Sünder
  rationale: Direkte, verständliche Wiedergabe der moralischen Gruppenbezeichnung.
- source_word: ክሕዱ
  choice: verleugnet haben
  rationale: Das Verb bezeichnet das Leugnen oder Zurückweisen; „verleugnen“ bewahrt den Bezug auf den göttlichen Namen.
- source_word: ስሞ ለእግዚአ መናፍስት
  choice: den Namen des Herrn der Geister
  rationale: Die Konstruktion verbindet „Name“ mit dem in 1 Henoch feststehenden Hoheitstitel „Herr der Geister“.
- source_word: ይትዐቀቡ
  choice: aufbewahrt werden
  rationale: Die Passivform bezeichnet das Zurück- oder Bereithalten für den Gerichtstag; der Handelnde bleibt wie im Ausgangstext ungenannt.
- source_word: ዕለተ ስራሕ ወምንዳቤ
  choice: Tag der Bedrängnis und Drangsal
  rationale: Die doppelte Wendung bewahrt die Steigerung zweier verwandter Begriffe für die Not des kommenden Gerichts.
theological_decisions:
- issue: Deutung der Aussage über Himmel und Erde
  choice: Die Sünder steigen nicht zum Himmel hinauf und gelangen nicht auf die Erde.
  alternative: Himmel und Erde nehmen die Sünder nicht auf.
  rationale: Die Richtungsformen „zum Himmel“ und „zur/auf die Erde“ sowie die Verben im Plural sprechen dafür, die Sünder als Subjekt zu verstehen. Das rätselhafte kosmische Bild bleibt bestehen und wird nicht in eine Lehrdeutung aufgelöst.
- issue: Bedeutung des göttlichen Namens
  choice: „den Namen des Herrn der Geister verleugnet“
  alternative: „den Herrn der Geister verworfen“
  rationale: Der Ausgangstext nennt ausdrücklich den „Namen“. Diese theologisch gewichtige Formulierung wird daher nicht auf eine allgemeinere Zurückweisung Gottes reduziert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die apokalyptische Fremdheit des ersten Satzes wird bewahrt; „Los“, „Herr der Geister“ und „Drangsal“ halten den gehobenen Gerichtston aufrecht, bleiben aber allgemein verständlich.
