base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/107/001.yaml
  text: And I saw written upon them that generation after generation will transgress[a], until a generation of righteousness arises, and iniquity is destroyed, and sin passes away from the earth[b], and every good thing comes upon it.
translation:
  language: de
  text: 'Und ich sah auf ihnen geschrieben: Eine Generation nach der anderen wird sich vergehen, bis eine Generation der Gerechtigkeit aufsteht, das Unrecht vernichtet wird, die Sünde von der Erde verschwindet und alles Gute über sie kommt.


    Und nun, mein Sohn, geh und teile deinem Sohn Lamech mit: Dieses Kind, das geboren wurde, ist wirklich sein Sohn; das ist wahr und keine Lüge.


    Als Metuschelach die Worte seines Vaters Henoch gehört hatte – denn dieser hatte ihm im Verborgenen alles Geschehen gezeigt –, kehrte er zurück, nachdem er ihn gesehen hatte,[a] und gab jenem Kind den Namen Noach, denn er wird die Erde nach allem Verderben erfreuen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der geezische Wortlaut nach „kehrte er zurück“ ist syntaktisch knapp. Die Form kann als „nachdem er ihn/es gesehen hatte“ verstanden werden; der genaue Bezug des Pronomens bleibt unsicher.
    reason: grammatical_ambiguity
  - marker: b
    text: 'Wörtlicher: „denn er wird die Erde von/aus allem Verderben froh machen“. Die Präposition kann zeitlich („nach allem Verderben“) oder als Angabe des Ausgangspunkts verstanden werden; das Verb selbst bedeutet „erfreuen, frohmachen“ und sagt nicht ausdrücklich Befreiung aus.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: ትኤብስ
  choice: sich vergehen wird
  rationale: Das Verb bezeichnet ein Übertreten beziehungsweise sündiges Handeln. „Sich vergehen“ bewahrt den ethischen Sinn, ohne eine konkrete Art der Übertretung hinzuzufügen.
- source_word: ትውልደ፡ ጽድቅ
  choice: eine Generation der Gerechtigkeit
  rationale: Die formale Genitivverbindung bleibt erhalten. „Gerechte Generation“ wäre flüssiger, könnte den abstrakten und eschatologischen Akzent von ጽድቅ jedoch abschwächen.
- source_word: አበሳ
  choice: das Unrecht
  rationale: Das Wort kann Schuld, Vergehen oder Unrecht bezeichnen. Im Parallelismus mit der Sünde passt „Unrecht“, ohne beide Begriffe gleichzusetzen.
- source_word: ትትለሐስ
  choice: verschwindet
  rationale: Das Verb trägt hier den Sinn des Wegnehmens beziehungsweise Auslöschens. „Verschwindet“ ist natürlich und lässt offen, auf welche Weise die Sünde beseitigt wird.
- source_word: አይድዖ
  choice: teile … mit
  rationale: Die Kausativform bedeutet „wissen lassen“ oder „bekannt machen“. Die deutsche Wendung gibt den Auftrag natürlich wieder.
- source_word: አማን፡ ወኢኮነ፡ ሐሰተ
  choice: wirklich …; das ist keine Lüge
  rationale: Die ausdrückliche Bekräftigung und ihre verneinende Wiederholung werden beide bewahrt.
- source_word: ሀጕል
  choice: Verderben
  rationale: Das Substantiv kann Untergang, Vernichtung oder Verderben bezeichnen. „Verderben“ passt zum eschatologischen Zusammenhang und wahrt eine gewisse Bedeutungsbreite.
- source_word: ያስተፌሥሓ
  choice: ihr Freude bringen
  rationale: Die Kausativform bezeichnet ein Erfreuen beziehungsweise Frohmachen. Diese Bedeutung wird direkt wiedergegeben, statt das traditionelle Wortspiel mit Noachs Namen ausschließlich durch „trösten“ zu erklären.
theological_decisions:
- issue: Eschatologische „Generation der Gerechtigkeit“
  choice: Die Genitivform bleibt als „Generation der Gerechtigkeit“ stehen.
  alternative: „gerechte Generation“
  rationale: Die Übersetzung bewahrt die personifizierend-abstrakte Ausdrucksweise und legt nicht fest, ob ausschließlich die moralische Beschaffenheit der Menschen oder eine umfassendere Heilszeit gemeint ist.
- issue: Wahrheit über Noachs Abstammung
  choice: „ist wirklich sein Sohn; das ist keine Lüge“
  alternative: „ist in Wahrheit sein Sohn und nicht nur scheinbar“
  rationale: Der Text bestätigt Lamechs Vaterschaft, erklärt aber nicht näher, worauf sein Zweifel beruht. Die Übersetzung fügt daher keine Lehre über Noachs Herkunft oder Natur hinzu.
- issue: Noachs künftige Aufgabe
  choice: „wird die Erde von allem Verderben befreien und ihr Freude bringen“
  alternative: „wird die Erde nach all ihrem Verderben trösten“
  rationale: Die geezische Form bezeichnet ausdrücklich ein Frohmachen; die Präpositionalfügung mit „von“ kann Befreiung oder Ausgangspunkt ausdrücken. Die gewählte Fassung wahrt beides, ohne das Geschehen mit einer bestimmten späteren Tradition gleichzusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die apokalyptische Bildsprache und die Wiederholungen des Ausgangstextes bleiben erhalten. Archaismen und konfessionell geprägte Deutungen wurden vermieden; unklare Pronomenbezüge und die Mehrdeutigkeit der Schlussaussage werden nicht stillschweigend dogmatisch aufgelöst.
