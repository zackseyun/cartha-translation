base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/053/001.yaml
  text: There my eyes saw a valley whose mouths were open and deep; and all who dwell on the dry land and the sea and the islands will bring gifts and offerings and presents to it, yet that deep valley will not be filled.
translation:
  language: de
  text: Dort sahen meine Augen ein Tal, dessen Schlünde offen und tief waren;[a] und alle, die auf dem trockenen Land, im Meer und auf den Inseln wohnen, werden ihm Gaben, Opfergaben und Geschenke bringen,[b] doch jenes tiefe Tal wird nicht gefüllt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Ge’ez-Ausdruck ist grammatisch und bildlich schwierig. Wörtlicher ist von den „Mündern“ des Tales die Rede, die „offen und tief“ sind; möglich wäre daher auch: „ein Tal, dessen Münder offen und tief waren“.'
    reason: textual_variant
  - marker: b
    text: Die drei hier mit „Gaben, Opfergaben und Geschenke“ wiedergegebenen Wörter sind in diesem Zusammenhang bedeutungsnah und können tributartige Zuwendungen aus allen Weltgegenden bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: በህየ
  choice: Dort
  rationale: Das einleitende Ortsadverb verweist auf den Schauplatz der Vision; „Dort“ bewahrt diese deiktische Funktion knapp und natürlich.
- source_word: ርእያ አዕይንትየ
  choice: sahen meine Augen
  rationale: Die ausdrückliche Nennung der Augen bleibt erhalten und wahrt den nachdrücklichen visionären Ton des Ge’ez.
- source_word: ቈላ
  choice: Tal
  rationale: Der Ausdruck bezeichnet hier eine talartige Vertiefung oder Schlucht; „Tal“ ist die breiteste, am wenigsten deutende deutsche Entsprechung.
- source_word: ርኁወ ወዕሙቀ አፈዊሁ
  choice: dessen Schlünde offen und tief waren
  rationale: Die beiden koordinierten Adjektive „offen“ und „tief“ werden gemeinsam auf die bildlich als Münder bezeichneten Öffnungen bezogen. „Schlünde“ erhält das Körperbild und klingt im Deutschen natürlicher als „Münder“ bei einem Tal.
- source_word: የኃድሩ
  choice: die … wohnen
  rationale: Das gewöhnliche Verb des Wohnens wird in einem gehobenen, aber heutigen Register wiedergegeben.
- source_word: ዲበ የብስ ወባሕር ወደሰያት
  choice: auf dem Festland, dem Meer und den Inseln
  rationale: „Festland“ verdeutlicht den Gegensatz zum Meer, während die dreigliedrige, umfassende Geografie des Ausgangstextes erhalten bleibt.
- source_word: አምኃ ወአስካዓ ወጋዳ
  choice: Gaben, Opfergaben und Geschenke
  rationale: Drei weitgehend bedeutungsnahe Substantive bewahren die häufende Wirkung. „Opfergaben“ lässt eine kultische Nuance zu, ohne alle drei Begriffe darauf festzulegen.
- source_word: ይመጽኡ ሎቱ
  choice: werden ihm … bringen
  rationale: Wörtlich liegt ein Verb des Kommens vor; zusammen mit den vorangestellten Gegenständen ergibt sich idiomatisch der Sinn, mit ihnen zu kommen beziehungsweise sie hinzubringen.
- source_word: ወዝኩስ ዕሙቅ ቈላ ኢይመልእ
  choice: doch jenes tiefe Tal wird nicht gefüllt werden
  rationale: Die einfache futurische beziehungsweise nicht abgeschlossene Aussage und das unheilvolle Bild der Unersättlichkeit bleiben ohne zusätzliche Deutung erhalten.
theological_decisions:
- issue: Art dessen, was die Bewohner aller Regionen zum Tal bringen
  choice: Konkrete Gaben beziehungsweise tributartige Zuwendungen werden dem Tal selbst gebracht.
  alternative: Die Bewohner kommen lediglich zum Tal; oder die Gegenstände stehen sinnbildlich für Huldigung.
  rationale: Der Ge’ez-Text nennt drei konkrete, gehäufte Substantive unmittelbar vor dem Bewegungsverb. Die gegenständliche Darstellung wahrt das apokalyptische Bild, ohne es zu allegorisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrtem visionärem Nachdruck. Die ungewöhnliche Rede von den Augen bleibt stehen; das schwer verständliche Bild der „Münder“ wird im Haupttext mit „Schlünde“ natürlich, aber weiterhin anschaulich wiedergegeben. Die Satzstruktur folgt der langen, kumulativen Bewegung des Ausgangstextes.
