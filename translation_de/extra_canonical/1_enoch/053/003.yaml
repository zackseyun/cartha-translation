base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/053/003.yaml
  text: For I saw all the angels of punishment lodging there and preparing all the instruments of Satan[a][b][c].
translation:
  language: de
  text: Denn ich sah alle Engel der Strafe, die dort verweilten[b] und alle Werkzeuge Satans[a][c] vorbereiteten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hier vorgelegte Ge’ez-Transkription bricht nach »und vorbereiteten« ab. »Alle Werkzeuge Satans« folgt dem vollständigen Wortlaut, der nach der textkritischen Revisionsangabe in den kritischen Ausgaben bezeugt ist.
    reason: textual_variant
  - marker: b
    text: 'Oder: »die sich dort aufhielten«. Das zugrunde liegende ge’ezische Verb bezeichnet das Bleiben oder Verweilen an einem Ort.'
    reason: lexical_alternative
  - marker: c
    text: Der Genitiv »Satans« kann Zugehörigkeit oder Zuordnung ausdrücken; die genaue Beziehung der Werkzeuge zu Satan bleibt im Wortlaut offen.
    reason: ambiguity
lexical_decisions:
- source_word: እስመ
  choice: Denn
  rationale: Leitet die Begründung der vorausgehenden Aussage ein und bewahrt den verbindenden Charakter des Ge’ez.
- source_word: ርኢክዎሙ
  choice: ich sah
  rationale: Gibt den visionären Bericht in schlichter, würdiger Sprache wieder; das pronominale Objekt wird durch die folgende Nominalgruppe bestimmt.
- source_word: ኵሎሙ
  choice: alle
  rationale: Bewahrt den umfassenden Geltungsbereich der Aussage.
- source_word: መላእክተ መቅሠፍት
  choice: Engel der Strafe
  rationale: Die Genitivverbindung bezeichnet Engel, die mit strafendem Gericht verbunden sind. Die formnahe Wiedergabe vermeidet eine unnötige Festlegung darauf, ob ihre Wesensbezeichnung oder ihre Tätigkeit gemeint ist.
- source_word: እንዘ የኃድሩ
  choice: die dort verweilten
  rationale: Das Verb bezeichnet das Bleiben oder Sich-Aufhalten an einem Ort. »Verweilten« ist natürlich und legt keine dauerhafte Wohnstätte nahe.
- source_word: ወያስተዴ(ልዉ)
  choice: und … vorbereiteten
  rationale: Gibt den Sinn des Bereitmachens oder Herrichtens wieder. Die deutsche finite Konstruktion macht den ge’ezischen Begleitumstand verständlich.
- source_word: ኵሎ ንዋየ ሰይጣን
  choice: alle Werkzeuge Satans
  rationale: Die nach der abgebrochenen Vorlage aus dem vollständigen, in kritischen Ausgaben bezeugten Wortlaut ergänzte Wendung enthält ausdrücklich den Quantor »alle« und bezeichnet die für Satan bestimmten beziehungsweise ihm zugeordneten Gerätschaften, ohne deren genaue Art festzulegen.
theological_decisions:
- issue: Das Objekt des Vorbereitens fehlt in der bereitgestellten, offenbar abgebrochenen Ge’ez-Transkription.
  choice: »alle Werkzeuge Satans« steht im Haupttext und wird textkritisch erläutert.
  alternative: Den Satz mit »und Vorbereitungen trafen« beziehungsweise unvollständig mit »und vorbereiteten« enden lassen.
  rationale: Der angegebene Vers bricht mitten im Wortlaut ab; nach der mitgelieferten Revisionsangabe bieten vollständige kritische Texte jedoch ኵሎ ንዋየ ሰይጣን. Die Ergänzung stellt daher den überlieferten Volltext her, während die Fußnote die Einschränkung der unmittelbar vorgelegten Quelle transparent macht.
- issue: Bedeutung der Genitivverbindung »Werkzeuge Satans«
  choice: Die formal mehrdeutige Zuordnung bleibt erhalten.
  alternative: »Werkzeuge für Satans Werk« oder »Satans Folterwerkzeuge«
  rationale: Der Genitiv kann Zugehörigkeit, Zuordnung oder Zweck anzeigen. Eine nähere Bestimmung würde eine im Ausdruck selbst nicht ausdrücklich entschiedene theologische Deutung eintragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die Syntax ist nah am Ge’ez, ohne im Deutschen schwerfällig zu wirken. Textkritische Unsicherheit und die Mehrdeutigkeit des Genitivs werden ausdrücklich offengehalten.
