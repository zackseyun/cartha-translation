review_pass:
  verdict: revise
  source_fidelity: Der Haupttext folgt im ersten Satz einer nicht ausreichend begründeten Deutung von ጌጋየ/ለጌጋይ als „Unrecht“. Die Formen mit der Suffixreferenz und die überlieferte schwierige Bildsprache sprechen vorrangig für „meine Ketten/Fesseln“. Diese Lesart soll im Haupttext stehen; ihre syntaktische Härte ist in einer Anmerkung zu erläutern. Die negative Schlusslesart ist angemessen vorsichtig beibehalten.
  naturalness: Die vorhandene deutsche Fassung ist überwiegend idiomatisch, aber „für immer und ewig nicht bestehen bleiben“ ist schwerfällig. „nicht für immer und ewig bestehen bleiben“ ist natürliches modernes Standarddeutsch und wahrt die Aussage. Die absichtlich fremdartige Ketten-und-Essen-Bildsprache darf nicht geglättet werden.
  terminology: „Herr der Geister“ ist als enochischer Titel korrekt. „Entwurzelt werden“ passt zur wahrscheinlichen Korrektur der fehlerhaft eingelesenen Form. „Fesseln“ ist hier gegenüber „Unrecht“ die quellennähere Wiedergabe von ጌጋየ.
  issues:
  - severity: high
    issue: Die Übersetzung von ጌጋየ/ለጌጋይ als „Unrecht“ lässt die in der Quelle sichtbare Erstperson-Suffixform („meine“) und die konkrete Bildsprache unberücksichtigt.
    rationale: Die englische Audit-Spur dokumentiert zwar eine geglättete Fassung mit „lawless deeds“, hält aber zugleich die lesartlich und lexikalisch besser gestützte Deutung „my chains“ fest. Die deutsche Hauptfassung darf die schwierigere, quellennahe Lesart nicht zugunsten einer freien Sinnharmonisierung ersetzen.
  - severity: medium
    issue: Die erste Anmerkung stellt „Unrecht“ als Primärbedeutung dar und behandelt „meine Ketten“ nur als entfernte Alternative.
    rationale: 'Bei der revidierten quellenorientierten Fassung muss das Verhältnis umgekehrt werden: Die Kettenlesart steht im Text, während eine abweichende Deutung als Verfehlung/Unrecht lediglich als unsichere Alternative genannt werden kann.'
  - severity: low
    issue: Die Stellung von „nicht“ im Schlusssatz ist stilistisch unnötig schwerfällig.
    rationale: Eine Voranstellung vor die Zeitformel ist im heutigen Deutsch geläufiger und verändert weder die strittige Negation noch die Aussage.
  revised_text: Und ihre Hände fertigen meine Fesseln an[a], und alle, die nach ihnen hungern – die Sünder –, werden sie essen[b]. Die Sünder werden vor dem Herrn der Geister vernichtet und vom Angesicht seiner Erde entwurzelt werden[c]; sie werden nicht für immer und ewig bestehen bleiben[d].
  revised_footnotes:
  - marker: a
    text: Die erste Satzhälfte ist im Äthiopischen schwierig. Wörtlich stehen „meine Fesseln“ und „ihre Hände“ bei einem Verb „machen/anfertigen“. Eine abweichende Deutung versteht das Wort als „Verfehlung“ oder „Unrecht“; sie erklärt jedoch die Erstpersonform weniger gut.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „alle, die nach ihnen hungern, die Sünder, werden sie essen“. Die gedrängte Syntax und das Bild, dass Sünder Fesseln essen, bleiben unsicher; die Übersetzung bewahrt die konkrete Bildsprache.'
    reason: source_ambiguity
  - marker: c
    text: Die transkribierte Form ist wahrscheinlich fehlerhaft überliefert oder eingelesen. Vermutlich steht hier ein ähnlich geschriebenes Verb mit der Bedeutung „entwurzelt werden“; allgemeiner wäre auch „entfernt“ oder „verbannt werden“ möglich.
    reason: textual_variant
  - marker: d
    text: 'Der Schluss ist textlich unsicher, besonders wegen der eingeklammerten Verneinungspartikel. Mit der Verneinung lautet der Sinn: „Sie werden nicht für immer und ewig bestehen bleiben“; ohne sie könnte die Klausel anders verstanden werden.'
    reason: textual_variant
  revision_rationale: Eine sichere Korrektur ist erforderlich, weil die vorliegende Hauptfassung die schwierige, aber in der Quelle und im englischen Audit ausdrücklich bezeugte Ketten-/Fesselnlesart durch die sinnglättende Deutung „Unrecht“ ersetzt. Die Revision stellt die konkrete Erstpersonform und die apokalyptische Bildsprache wieder her, ohne die syntaktische und textkritische Unsicherheit zu verschweigen. Der Titel „Herr der Geister“, die wahrscheinliche Lesung „entwurzelt“ und die vorsichtige negative Schlusslesart bleiben erhalten.
