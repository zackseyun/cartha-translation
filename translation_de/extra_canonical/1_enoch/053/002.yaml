base_translation:
  language: en
  yaml_path: translation/extra_canonical/1_enoch/053/002.yaml
  text: And their hands commit lawless deeds[a], and all who support their lawless deeds the sinners devour. And the sinners shall be destroyed from before the Lord of Spirits, and from the face of his earth they shall be uprooted[d][c][b], and they shall not remain forever and ever.
translation:
  language: de
  text: Und ihre Hände verüben Unrecht[a], und alle, die nach Unrecht verlangen, verschlingen die Sünder[b]. Die Sünder werden vor dem Herrn der Geister zugrunde gehen und vom Angesicht seiner Erde entwurzelt werden[c]; sie werden für immer und ewig nicht bestehen bleiben[d].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das äthiopische Wort kann „Verfehlung“ oder „Unrecht“ bedeuten. Es ist auch als „meine Ketten“ beziehungsweise „meine Fesseln“ gedeutet worden; dann wäre der ganze erste Satz anders zu verstehen.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlicher: „alle, die nach Unrecht hungern, verschlingen die Sünder“. Die gedrängte Syntax ist unsicher; möglich ist auch: „und die Sünder verschlingen alles, was ihr Unrecht unterstützt“.'
    reason: source_ambiguity
  - marker: c
    text: Die transkribierte Form ist wahrscheinlich fehlerhaft überliefert beziehungsweise eingelesen. Vermutlich steht hier ein ähnlich geschriebenes Verb mit der Bedeutung „entwurzelt werden“; möglich wäre allgemeiner auch „entfernt“ oder „verbannt werden“.
    reason: textual_variant
  - marker: d
    text: 'Der Schluss ist textlich unsicher, besonders beim eingeklammerten Verneinungspartikel. Bei negativer Lesart heißt es wörtlich etwa: „und sie werden für immer und ewig nicht bestehen bleiben“; ohne die Verneinung wäre eine Aussage über endgültigen Untergang möglich.'
    reason: textual_variant
lexical_decisions:
- source_word: ጌጋየ / ለጌጋይ
  choice: Unrecht / nach Unrecht
  rationale: ጌጋ bezeichnet hier am ehesten Verfehlung oder Unrecht. Diese Bedeutung erklärt beide Vorkommen im Satz, ohne die im konsultierten englischen Material ebenfalls erwogene, aber sprachlich unsichere Deutung als „meine Ketten“ in den Haupttext zu übernehmen.
- source_word: እደዊሆሙ ይገብሩ
  choice: ihre Hände verüben
  rationale: Die Körperteilmetonymie „ihre Hände“ bleibt erhalten; „verüben“ gibt das allgemeine Verb „tun/machen“ in Verbindung mit Unrecht natürlich wieder.
- source_word: ዘይጻምዉ
  choice: die … verlangen
  rationale: Das Verb drückt Hunger oder starkes Begehren aus. „Verlangen“ ist im Deutschen verständlich; die wörtlichere Bildsprache wird in der Fußnote bewahrt.
- source_word: ይበልዑ
  choice: verschlingen
  rationale: Das Grundbild des Essens bleibt mit „verschlingen“ deutlich erhalten und wird nicht zu einer abstrakten Schädigung umgedeutet.
- source_word: እምገጸ ለእግዚአ መነፈሳት
  choice: vor dem Herrn der Geister
  rationale: „Vor“ gibt die feste räumlich-präsentische Formel idiomatisch wieder; „Herr der Geister“ bleibt als charakteristischer Henoch-Titel unverändert.
- source_word: ይትሐጐሉ
  choice: werden … zugrunde gehen
  rationale: Die Form bezeichnet Untergang oder Beseitigung. Die intransitive Wiedergabe vermeidet es, einen im Text nicht ausdrücklich genannten Handelnden einzuführen.
- source_word: እምገጸ ምድረ ዚአሁ
  choice: vom Angesicht seiner Erde
  rationale: Die konkrete semitische Wendung wird wegen ihrer apokalyptischen Bildkraft formal bewahrt.
- source_word: ይትቀወሙ [wahrscheinlich fehlerhaft für ይትነቀሉ]
  choice: entwurzelt werden
  rationale: Die überlieferte Transkription dürfte einen Lesefehler enthalten; der wahrscheinlich zugrunde liegende Ausdruck bedeutet „entwurzelt werden“ und passt zur Entfernung vom Angesicht der Erde.
- source_word: ወ[ኢ]ያነልቁ ለዓለመ ዓለም
  choice: sie werden für immer und ewig nicht bestehen bleiben
  rationale: Die Wiedergabe folgt der negativen Lesart und erhält die Dauerformel, ohne den Satz metaphysisch als Vernichtung zu präzisieren. Die Unsicherheit des Negationspartikels wird angemerkt.
theological_decisions:
- issue: Art des endzeitlichen Untergangs der Sünder
  choice: zugrunde gehen, entwurzelt werden und nicht bestehen bleiben
  alternative: für immer vernichtet werden
  rationale: Der Vers beschreibt endgültiges Gericht und Ausschluss, legt aber die metaphysische Art dieses Untergangs nicht eindeutig fest. Die Übersetzung wahrt diese Spannung.
- issue: Deutung von ጌጋ als Unrecht oder als Ketten
  choice: Unrecht
  alternative: meine Ketten/Fesseln
  rationale: Die Bedeutung „Verfehlung, Unrecht“ ergibt im unmittelbaren Satz einen zusammenhängenden Sinn. Da die alternative konkrete Deutung in der Überlieferungs- und Forschungsgeschichte vorkommt, wird sie in der Fußnote offengelegt statt stillschweigend ausgeschlossen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewahrter apokalyptischer Bildsprache. Ungewöhnliche Wendungen wie „Herr der Geister“ und „vom Angesicht seiner Erde“ bleiben als kennzeichnende Formeln stehen; schwer verständliche oder textkritisch unsichere Stellen werden nicht geglättet, sondern in Fußnoten kenntlich gemacht.
