  text: ἣν ἔδωκέ μοι Κύριος ἐν ὑπακοῇ πατρός μου¹⁹,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/001.yaml
  text: The Lord gave me favor in obedience to my father,
translation:
  language: de
  text: die mir der Herr im Gehorsam gegenüber meinem Vater schenkte,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἣν
  choice: die
  rationale: Das feminine Relativpronomen wird als solches wiedergegeben; sein Bezugswort steht im vorausgehenden Kontext und wird nicht eigens ergänzt.
- source_word: ἔδωκέ μοι
  choice: mir … schenkte
  rationale: δίδωμι bedeutet grundsätzlich „geben“; „schenken“ klingt hier im Zusammenhang einer vom Herrn gewährten Gunst natürlich und würdevoll.
- source_word: Κύριος
  choice: der Herr
  rationale: Die übliche und sachlich entsprechende Wiedergabe des griechischen Gottesprädikats Κύριος.
- source_word: ἐν ὑπακοῇ πατρός μου
  choice: im Gehorsam gegenüber meinem Vater
  rationale: Die Präposition ἐν wird eng als „im“ wiedergegeben, ohne sie kausal als „weil“ auszudeuten; der Genitiv bezeichnet die Person, der Gehorsam erwiesen wird.
theological_decisions:
- issue: Verhältnis zwischen göttlicher Gabe und Judas Gehorsam
  choice: „im Gehorsam“
  alternative: „weil ich meinem Vater gehorchte“
  rationale: Die gewählte Fassung bewahrt die offene Beziehung, die ἐν ausdrückt, und legt nicht fest, dass der Gehorsam die Ursache oder verdienstliche Grundlage der Gabe war.
translation_notes:
  register: Moderner, würdevoller Standarddeutsch-Stil. Die fragmentarische Form des griechischen Versabschnitts und das abschließende Komma bleiben erhalten, da das feminine Relativpronomen auf den vorausgehenden Kontext zurückverweist.
