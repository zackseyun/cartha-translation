  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/004.yaml
  text: And I know what evils you will do in the last days.
translation:
  language: de
  text: Und ich weiß, welche bösen Taten ihr in den letzten Tagen begehen werdet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte »in den letzten Tagen« stehen in der zugrunde gelegten Ausgabe in eckigen Klammern und gelten daher als textkritisch unsicher.
    reason: Die Ausgangsausgabe kennzeichnet die Wortgruppe [ταῖς ἐσχάταις ἡμέραις] als unsicheren beziehungsweise möglicherweise sekundären Textbestand.
lexical_decisions:
- source_word: ἔγνωκα
  choice: ich weiß
  rationale: Das griechische Perfekt bezeichnet hier einen gegenwärtigen Wissensstand; im natürlichen modernen Deutsch gibt »ich weiß« diesen Sinn treffend wieder.
- source_word: ὅσα κακὰ
  choice: welche bösen Taten
  rationale: Das substantivierte Neutrum bezeichnet die bösen Dinge beziehungsweise Handlungen, die folgen werden. »Böse Taten« ist im Kontext klar und natürlich.
- source_word: ποιήσετε
  choice: ihr … begehen werdet
  rationale: Das Futur der zweiten Person Plural wird bewahrt; in Verbindung mit »Taten« ist »begehen« idiomatischer als das wörtliche »tun«.
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: in den letzten Tagen
  rationale: Die geläufige zeitliche und eschatologisch offene Formulierung wird formal und ohne zusätzliche Deutung wiedergegeben.
theological_decisions:
- issue: Eschatologische Reichweite von »den letzten Tagen«
  choice: Die Wendung bleibt ohne nähere zeitliche oder heilsgeschichtliche Festlegung stehen.
  alternative: »am Ende der Zeit« oder eine ausdrückliche Beschränkung auf die letzten Lebenstage der Angeredeten
  rationale: Der griechische Ausdruck selbst legt die genaue Reichweite nicht fest; eine Präzisierung würde die bestehende Mehrdeutigkeit auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp; »böse Taten begehen« vermeidet eine unbeholfene wörtliche Wiedergabe von ποιεῖν und bewahrt zugleich den konkreten moralischen Sinn.
