review_pass:
  verdict: revise
  source_fidelity: Die Singularformen werden korrekt mit „es“ wiedergegeben. „beraubt seine Seele alles Guten“, das Festhalten „in“ Leiden und Mühen sowie das Vertreiben des Schlafs entsprechen dem griechischen Satzbau und Sinn. Bei τὰς σάρκας ist jedoch „Fleisch“ näher als „Leib“, da σάρξ ausdrücklich die körperliche Substanz bezeichnet.
  naturalness: Die revidierte Fassung ist modernes, idiomatisches Standarddeutsch und bewahrt die knappe, fortschreitende Reihung des Originals.
  terminology: '„Schmerzen und Mühen“ bildet πόνοις καὶ μόχθοις genauer ab als „Mühsal und Plagen“: πόνοι sind Leiden bzw. Schmerzen, μόχθοι mühevolle Anstrengungen. „Fleisch“ bewahrt die konkrete Terminologie von σάρκας ohne lehrmäßige Aufladung.'
  issues:
  - severity: low
    issue: „Leib“ statt „Fleisch“
    rationale: Das griechische τὰς σάρκας („das Fleisch“, formal Plural) ist konkreter als „Leib“. „Leib“ verallgemeinert den Ausdruck zu „Körper“ und schwächt das Bild des Aufzehrens des Fleisches ab.
  - severity: low
    issue: „Mühsal und Plagen“ für πόνοις καὶ μόχθοις
    rationale: Die Wortwahl ist verständlich, aber „Plagen“ bezeichnet eher widerfahrende Heimsuchungen. „Schmerzen und Mühen“ erhält die Unterscheidung zwischen leidvollen Schmerzen und aufreibender Arbeit bzw. Anstrengung klarer.
  revised_text: Es beraubt seine Seele alles Guten und hält ihn in Schmerzen und Mühen fest; es vertreibt ihm den Schlaf und zehrt sein Fleisch auf.
  revised_footnotes: []
  revision_rationale: 'Die Revision beschränkt sich auf zwei lexikalische Präzisierungen: Sie gibt πόνοις καὶ μόχθοις als „Schmerzen und Mühen“ wieder und erhält mit „Fleisch“ die Bildlichkeit von σάρκας. Der singuläre, im Kontext nicht ausdrücklich benannte Bezug von „es“ bleibt wie im griechischen Text gewahrt.'
