  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/007.yaml
  text: It deprives his soul of every goodness, and holds him fast in pains and labors; it drives sleep away from him, and consumes his flesh.
translation:
  language: de
  text: Es beraubt seine Seele alles Guten und hält ihn in Schmerzen und Mühen fest; es vertreibt ihm den Schlaf und zehrt sein Fleisch auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Στερίσκει … ἀπὸ πάσης ἀγαθότητος
  choice: beraubt … alles Guten
  rationale: Gibt den Entzug umfassend und in natürlichem Deutsch wieder; πάσης ἀγαθότητος bezeichnet hier die Gesamtheit des Guten.
- source_word: συνέχει
  choice: hält … gefangen
  rationale: Bewahrt den Sinn des Festhaltens beziehungsweise Eingeschlossenseins, ohne eine übermäßig technische Formulierung.
- source_word: πόνοις καὶ μόχθοις
  choice: Mühsal und Plagen
  rationale: Spiegelt die Verbindung von leidvoller Bedrängnis und aufreibender Anstrengung in verständlichem, würdigem Deutsch.
- source_word: τὸν ὕπνον ἐκδιδάσκει ἀπ᾽ αὐτοῦ
  choice: vertreibt ihm den Schlaf
  rationale: Gibt die ungewöhnliche griechische Wendung idiomatisch als Entfernung des Schlafes von der Person wieder.
- source_word: καταδαπανᾷ τὰς σάρκας αὐτοῦ
  choice: zehrt seinen Leib auf
  rationale: καταδαπανάω bezeichnet vollständiges Aufzehren; der griechische Plural σάρκας wird nach deutschem Sprachgebrauch kollektiv mit „Leib“ wiedergegeben.
theological_decisions:
- issue: Singularisches Subjekt der Verbformen
  choice: Durchgehend „es“
  alternative: „sie“ oder ein ergänztes Nomen
  rationale: Die griechischen Verbformen und Pronomen stehen im Singular. Das neutrale „es“ bewahrt den Bezug auf den im Kontext vorausgesetzten singulären Gegenstand, ohne ihn interpretierend zu benennen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die parallele Satzstruktur und die Steigerung bis zum körperlichen Aufzehren bleiben erhalten.
