source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Θυσίας Θεοῦ ἐμποδίζει²⁹, *καὶ εὐλογίαν Θεοῦ οὐ μνημονεύει³⁰. *Προφήτου λαλοῦντος οὐκ ἀκούει³¹, καὶ λόγους εὐσεβείας³³ προσοχθίζει³⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/008.yaml
  text: They hinder the sacrifices of God, and do not remember the blessing of God. They do not listen when a prophet speaks, and resent words of godliness.
translation:
  language: de
  text: Sie verhindern die Opfer für Gott und denken nicht an den Segen Gottes. Sie hören nicht auf einen Propheten, wenn er redet, und ärgern sich über Worte der Gottesfurcht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θυσίας Θεοῦ
  choice: die Opfer für Gott
  rationale: Der Genitiv kann Zugehörigkeit oder Ausrichtung bezeichnen. „Opfer für Gott“ ist im Deutschen natürlich und bewahrt den kultischen Bezug, ohne eine bestimmte Opferart festzulegen.
- source_word: ἐμποδίζει
  choice: verhindern
  rationale: Das Verb bedeutet „hindern, hemmen, verhindern“. Der Plural folgt dem im Kontext und in der konsultierten Fassung erkennbaren kollektiven Subjekt; die griechische Form ist formal Singular und dürfte textlich oder syntaktisch auffällig sein.
- source_word: εὐλογίαν Θεοῦ
  choice: den Segen Gottes
  rationale: Gibt die Genitivverbindung direkt wieder und lässt offen, ob es um Gottes Segen als Gabe oder um einen Gott geltenden Segensspruch geht.
- source_word: οὐ μνημονεύει
  choice: denken nicht an
  rationale: μνημονεύω bezeichnet das Erinnern oder Gedenken. „an … denken“ ist hier idiomatisches modernes Deutsch und vermeidet die unnatürliche Formulierung „erwähnen nicht“.
- source_word: Προφήτου λαλοῦντος
  choice: auf einen Propheten, wenn er redet
  rationale: Der Genitivus absolutus wird als gleichzeitige Handlung wiedergegeben. Der fehlende Artikel erlaubt im Deutschen am natürlichsten die indefinite Wiedergabe.
- source_word: λόγους εὐσεβείας
  choice: Worte der Gottesfurcht
  rationale: εὐσέβεια bezeichnet ehrfürchtige, auf Gott ausgerichtete Frömmigkeit. „Gottesfurcht“ ist würdig und verständlich, ohne eine konfessionelle Sonderdeutung einzutragen.
- source_word: προσοχθίζει
  choice: ärgern sich über
  rationale: Das Verb drückt Unwillen, Verdruss oder Empörung aus. „sich ärgern über“ bildet diese ablehnende Reaktion natürlich ab.
theological_decisions:
- issue: Bedeutung des Genitivs in εὐλογίαν Θεοῦ
  choice: den Segen Gottes
  alternative: den Lobpreis Gottes
  rationale: Die Formulierung bleibt bewusst genitivisch offen. Eine eindeutige Festlegung auf göttliche Segensgabe oder menschlichen Lobpreis wäre vom Ausdruck allein nicht erzwungen.
- issue: Wiedergabe von εὐσέβεια
  choice: Gottesfurcht
  alternative: Frömmigkeit
  rationale: „Gottesfurcht“ bringt die religiöse Ausrichtung ausdrücklich zum Ausdruck. „Frömmigkeit“ wäre ebenfalls möglich, kann modern jedoch stärker eine allgemeine Haltung oder konfessionelle Prägung anklingen lassen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die koordinierte Struktur des griechischen Textes bleibt erhalten. Trotz formal singularischer griechischer Verben wird das im Zusammenhang vorausgesetzte kollektive Subjekt pluralisch wiedergegeben, entsprechend der textkritisch plausiblen und in der konsultierten englischen Fassung bestätigten Lesart.
