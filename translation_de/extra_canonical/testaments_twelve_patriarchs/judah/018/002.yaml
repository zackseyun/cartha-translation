  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/002.yaml
  text: Therefore I never grieved Jacob my father, for I did everything he told me.
translation:
  language: de
  text: Ich habe meinem Vater Jakob nie widersprochen, denn ich tat alles, was er mir sagte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρελάλησα
  choice: widersprochen
  rationale: Das Verb bezeichnet hier am ehesten ein Reden gegen jemanden bzw. Widersprechen. Dies folgt dem griechischen Wortlaut enger als die englische Wiedergabe „grieved“ und ergibt im Zusammenhang mit dem anschließenden Gehorsam einen natürlichen Gegensatz.
- source_word: πάντα ὅσα μοι ἔλεγεν
  choice: alles, was er mir sagte
  rationale: Die distributive Verbindung wird idiomatisch und vollständig wiedergegeben; das Imperfekt ἔλεγεν lässt wiederholtes väterliches Anweisen erkennen, ohne dass dies im Deutschen eigens markiert werden muss.
- source_word: ἐποίουν
  choice: ich tat
  rationale: Die schlichte Tätigkeits- und Gehorsamsaussage des Imperfekts wird in natürlichem Deutsch bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das im englischen Beratungstext ergänzte „Therefore“ wird nicht übernommen, da der vorgelegte griechische Wortlaut keine entsprechende Konjunktion enthält. Ebenso wird παρελάλησα nicht als „betrübte“ wiedergegeben, sondern in seinem naheliegenden Sinn „widersprach“.
