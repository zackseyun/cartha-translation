source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Φυλάξασθε⁵ οὖν, τέκνα μου, ἀπὸ τῆς πορνείας *καὶ τῆς φιλαργυρίας⁷, καὶ ἀκούσατε⁸ Ἰούδα τοῦ πατρὸς ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/005.yaml
  text: Guard yourselves, therefore, my children, from sexual immorality and the love of money, and listen to Judah your father.
translation:
  language: de
  text: Darum hütet euch, meine Kinder, vor sexueller Unmoral und Geldgier und hört auf euren Vater Juda.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: hütet euch
  rationale: Der mediale Imperativ bezeichnet ein wachsames Sich-in-Acht-Nehmen und wird im Deutschen natürlich mit „hütet euch“ wiedergegeben.
- source_word: πορνείας
  choice: sexueller Unmoral
  rationale: Der Ausdruck bezeichnet unerlaubtes sexuelles Verhalten allgemein; „sexuelle Unmoral“ bewahrt diesen Umfang, ohne ihn auf eine einzelne Form zu verengen.
- source_word: φιλαργυρίας
  choice: Geldgier
  rationale: Das Wort bezeichnet die Liebe zum Geld beziehungsweise Habgier; „Geldgier“ ist prägnant, modern und in diesem Mahnzusammenhang eindeutig.
- source_word: ἀκούσατε
  choice: hört auf
  rationale: Gemeint ist nicht bloß akustisches Hören, sondern das Beachten der väterlichen Mahnung; „hört auf“ gibt diesen auffordernden Sinn idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Mahnrede mit direkter familiärer Anrede. Die gemeinsame Präposition ἀπό vor beiden Lastern wird im Deutschen natürlich nur einmal durch „vor“ ausgedrückt.
