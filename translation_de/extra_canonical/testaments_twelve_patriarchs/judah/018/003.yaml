  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/003.yaml
  text: And Abraham my forefather blessed me to reign in Israel, and Jacob blessed me likewise.
translation:
  language: de
  text: Und Abraham, mein Vorfahr, segnete mich dazu, in Israel zu herrschen, und Jakob segnete mich ebenso.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πρόπατός μου
  choice: mein Vorfahr
  rationale: Gibt die Bezeichnung für einen früheren Ahnen natürlich und würdevoll wieder, ohne einen genaueren Verwandtschaftsgrad festzulegen.
- source_word: εὐλόγησέ με βασιλεύειν
  choice: segnete mich dazu, … zu herrschen
  rationale: Bewahrt die Verbindung zwischen dem Segen und dem nachfolgenden Infinitiv; „herrschen“ gibt βασιλεύειν idiomatisch wieder, ohne zwingend eine bereits erfolgte Königseinsetzung auszudrücken.
- source_word: ἐν Ἰσραήλ
  choice: über Israel
  rationale: Im Zusammenhang mit βασιλεύειν bezeichnet die Präpositionalgruppe den Herrschaftsbereich; im Deutschen ist „über Israel herrschen“ natürlich.
- source_word: οὕτως
  choice: ebenso
  rationale: Drückt knapp aus, dass Jakob Judah in entsprechender Weise segnete.
theological_decisions:
- issue: Verhältnis des Segens zur Königsherrschaft
  choice: „segnete mich dazu, über Israel zu herrschen“
  alternative: „segnete mich, König in Israel zu sein“
  rationale: Die gewählte Fassung wahrt den finalen beziehungsweise ergänzenden Bezug des Infinitivs, ohne den Segen als unmittelbare Verleihung eines Königstitels auszulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, leicht gehobenem Ton. Die zweimalige Nennung von „segnete mich“ folgt der Parallelstruktur des griechischen Textes.
