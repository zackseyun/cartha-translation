  source_fidelity: 'Die Übersetzung gibt die vier Prädikate des griechischen Satzes vollständig und in sachgemäßer Reihenfolge wieder: Abbringen vom Gesetz Gottes, Blindmachen des inneren Urteilsvermögens, Lehren von Hochmut und Verhindern barmherzigen Handelns gegenüber dem Nächsten. „Urteilsvermögen der Seele“ trifft τὸ διαβούλιον τῆς ψυχῆς angemessen als innere Beratungs- bzw. Urteilskraft. Die pluralische deutsche Kongruenz bei „diese Dinge bringen“ ist eine idiomatische Glättung der im überlieferten Griechisch vorhandenen Numerusspannung ταῦτα ... ἀφιστᾷ und verändert den Sinn nicht.'
  naturalness: Modernes, gut verständliches Standarddeutsch mit angemessen mahnend-würdigem Register. Die Reihung ist klar und bewahrt den rhetorischen Parallelismus. „Erbarmen erweisen“ ist etwas gehoben, aber natürlich und für den ethischen Kontext passend.
  terminology: „Gesetz Gottes“, „Seele“, „Hochmut“, „Erbarmen“ und „Nächster“ sind präzise und registergerecht. „Nächster“ bewahrt πλησίον ohne konfessionell einengende Auslegung. Es bestehen keine Fußnotenanker oder Fußnoten, die zu prüfen oder zu ergänzen wären.
