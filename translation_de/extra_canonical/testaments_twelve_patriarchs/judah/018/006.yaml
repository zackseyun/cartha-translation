id: T12P.JUD.18.6
reference: Testament of Judah 18:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὅτι¹⁰ ταῦτα¹¹ ἀφιστᾷ¹² τοῦ νόμου τοῦ θεοῦ, καὶ τυφλοῖ¹⁴ τὸ διαβούλιον τῆς ψυχῆς, καὶ ὑπερηφανίαν¹⁵ ἐκδιδάσκει, καὶ οὐκ ἀφίει¹⁶ ἄνδρα ἐλεῆσαι¹⁷ τὸν¹⁸ πλησίον αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018/006.yaml
  text: For these turn one away from the law of God, and blind the judgment of the soul, and teach arrogance, and do not allow a man to show mercy to his neighbor.
translation:
  language: de
  text: Denn diese Dinge bringen einen vom Gesetz Gottes ab, machen das Urteilsvermögen der Seele blind, lehren Hochmut und lassen einen Menschen seinem Nächsten kein Erbarmen erweisen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφιστᾷ
  choice: bringen einen … ab
  rationale: Gibt das Abbringen beziehungsweise Entfernen vom Gesetz Gottes idiomatisch wieder, ohne die Aussage unnötig zu verstärken.
- source_word: τυφλοῖ
  choice: machen … blind
  rationale: Bewahrt das konkrete Bild des griechischen Verbs und bleibt im Deutschen verständlich.
- source_word: τὸ διαβούλιον τῆς ψυχῆς
  choice: das Urteilsvermögen der Seele
  rationale: διαβούλιον bezeichnet hier das innere Beraten und Urteilen; „Urteilsvermögen“ gibt dies natürlicher wieder als „Absicht“ oder „Zweck“.
- source_word: ὑπερηφανίαν
  choice: Hochmut
  rationale: Bezeichnet überheblichen Stolz und passt zum ethisch-mahnenden Kontext.
- source_word: ἐλεῆσαι τὸν πλησίον αὐτοῦ
  choice: seinem Nächsten … Erbarmen erweisen
  rationale: Bewahrt sowohl den Gedanken tätigen Erbarmens als auch den traditionellen, weiterhin verständlichen Begriff „Nächster“.
theological_decisions:
- issue: Bezug des pluralischen Demonstrativs ταῦτα bei einem singularischen Verb
  choice: „diese Dinge bringen“ als sinngemäß pluralische Wiedergabe
  alternative: „dies bringt“
  rationale: ταῦτα verweist auf mehrere zuvor genannte Sachverhalte; der Numerusunterschied im griechischen Satz wird nicht künstlich in das Deutsche übertragen.
- issue: Anthropologische Bedeutung von ψυχή
  choice: „Seele“
  alternative: „Inneres“ oder „Leben“
  rationale: Die Verbindung mit dem inneren Urteilsvermögen legt hier „Seele“ nahe; die traditionelle anthropologische Offenheit bleibt erhalten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die parallele Satzstruktur des Griechischen bleibt weitgehend erhalten; „einen Menschen“ bewahrt die allgemeine Personenbezeichnung des Ausgangstextes.
