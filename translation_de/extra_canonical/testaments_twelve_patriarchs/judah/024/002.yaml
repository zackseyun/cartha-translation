  source_fidelity: Der Entwurf gibt die futurischen Aussagen, den Dativ αὐτῷ, die konkrete Bezeichnung υἱούς, ἐν ἀληθείᾳ sowie die Wegmetapher von πορεύεσθε sachgerecht wieder. Die Dativformen πρώτοις καὶ ἐσχάτοις können sich auf προστάγμασιν beziehen; „in den ersten wie in den letzten“ erhält diese syntaktische und sachliche Nähe, ohne den möglichen Sinn unnötig zu glätten.
  naturalness: „Ihm in Wahrheit Söhne sein“ und „in seinen Geboten wandeln“ sind bewusst würdig-biblisch, aber im modernen Standarddeutsch verständlich und angemessen. Die abschließende Wiederaufnahme „in den ersten wie in den letzten“ ist knapp, jedoch durch „Geboten“ unmittelbar zuvor klar verständlich.
  terminology: „Söhne“ bewahrt υἱούς präzise; „Gebote“ ist für προστάγματα idiomatisch und ausreichend verbindlich. „In Wahrheit“ wahrt die semantische Offenheit der griechischen Wendung.
