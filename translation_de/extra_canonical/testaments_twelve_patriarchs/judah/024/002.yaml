source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ἔσεσθε αὐτῷ εἰς υἱοὺς¹⁷ ἐν ἀληθείᾳ¹⁸, *καὶ πορεύεσθε¹⁸ ἐν προστάγμασιν¹⁹ αὐτοῦ πρώτοις καὶ ἐσχάτοις.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/002.yaml
  text: And you will be to him sons in truth, and you will walk in his commandments, the first and the last.
translation:
  language: de
  text: Und ihr werdet ihm in Wahrheit Söhne sein, und ihr werdet in seinen Geboten wandeln, in den ersten wie in den letzten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: υἱούς
  choice: Söhne
  rationale: Bewahrt die konkrete Sohnesbezeichnung des griechischen Textes, statt sie ohne sprachlichen Anlass zu „Kinder“ zu verallgemeinern.
- source_word: ἐν ἀληθείᾳ
  choice: in Wahrheit
  rationale: Gibt die Präpositionalfügung formal und zugleich idiomatisch wieder; gemeint sein kann sowohl Wahrhaftigkeit als auch ein wirkliches Sohnverhältnis.
- source_word: πορεύεσθε
  choice: ihr werdet … wandeln
  rationale: Erhält das biblisch geprägte Bild des Gehens als Lebensführung und entspricht der futurischen Form.
- source_word: προστάγμασιν
  choice: Geboten
  rationale: Bezeichnet verbindliche Anordnungen und passt natürlich zur Wendung „in Geboten wandeln“.
- source_word: πρώτοις καὶ ἐσχάτοις
  choice: in den ersten wie in den letzten
  rationale: Die Adjektive stimmen mit „Geboten“ überein. Die Formulierung wahrt die Unterscheidung zwischen ersten und letzten Geboten, ohne sie ausdrücklich als bloße Redewendung für Gesamtheit auszulegen.
theological_decisions:
- issue: Geschlechtsspezifische Gotteskindschaft
  choice: „Söhne“
  alternative: „Kinder“
  rationale: Das Griechische verwendet ausdrücklich υἱούς. Die Übersetzung bewahrt diese Benennung, ohne daraus eine weitergehende dogmatische Aussage über Geschlecht oder Zugehörigkeit abzuleiten.
- issue: Reichweite von „die ersten und die letzten“
  choice: 'Als nähere Bestimmung der Gebote: „in den ersten wie in den letzten“'
  alternative: „vom ersten bis zum letzten Gebot“ beziehungsweise „in allen seinen Geboten“
  rationale: Der griechische Wortlaut kann umfassenden Gehorsam nahelegen, formuliert aber konkret „erste und letzte“. Die Übersetzung erhält diese Spannung, statt die Aussage auf „alle“ festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter biblischer Wegmetapher. Die leicht feierliche Konstruktion „ihm … Söhne sein“ folgt bewusst eng dem griechischen Dativ und vermeidet eine unnötige dogmatische Ausdeutung.
