source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ἐξ αὐτῆς βλαστήσει²⁴ ῥάβδος δικαιοσύνης²⁵ τοῖς ἔθνεσι, *κρῖναι καὶ σῶσαι²⁶ πάντας τοὺς²⁷ ἐπικαλουμένους τὸν²⁸ Κύριον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/005.yaml
  text: And from it will spring up a rod of righteousness for the nations, to judge and to save all who call upon the Lord.
translation:
  language: de
  text: Und aus ihr wird für die Völker ein Stab der Gerechtigkeit hervorsprossen, um alle zu richten und zu retten, die den Herrn anrufen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βλαστήσει
  choice: wird … hervorgehen
  rationale: Gibt das Bild des Hervorsprossens natürlich wieder, ohne die pflanzliche Metapher des folgenden Substantivs zu verdoppeln.
- source_word: ῥάβδος δικαιοσύνης
  choice: ein Spross der Gerechtigkeit
  rationale: ῥάβδος kann einen Stab, Zweig oder Schössling bezeichnen. Im Zusammenhang mit βλαστήσει liegt die botanisch-messianische Bildsprache eines Sprosses näher als der wörtliche „Stab“.
- source_word: τοῖς ἔθνεσι
  choice: für die Völker
  rationale: Bewahrt den Dativ des Nutzens bzw. Bezugs und vermeidet die je nach Kontext enger wirkende Wiedergabe „Heiden“.
- source_word: κρῖναι καὶ σῶσαι
  choice: um … zu richten und zu retten
  rationale: Gibt beide koordinierte Infinitive gleichrangig und in ihrer theologischen Spannung wieder.
- source_word: ἐπικαλουμένους τὸν Κύριον
  choice: die den Herrn anrufen
  rationale: „Anrufen“ ist eine natürliche und sachlich genaue Wiedergabe für religiöses Sich-an-den-Herrn-Wenden.
theological_decisions:
- issue: Beziehung von Gericht und Rettung
  choice: Beide Handlungen werden ohne nähere Harmonisierung auf „alle, die den Herrn anrufen“ bezogen.
  alternative: „alle richten und die retten, die den Herrn anrufen“
  rationale: Die griechische Syntax verbindet πάντας τοὺς ἐπικαλουμένους mit beiden Infinitiven. Die mögliche theologische Spannung wird daher nicht durch eine Umgliederung beseitigt.
- issue: Identität des „Sprosses“
  choice: Keine ausdrückliche Identifikation im Text ergänzt.
  alternative: „der Messias“ oder eine andere benennende Deutung
  rationale: Die Bildsprache kann messianisch verstanden werden, doch der griechische Wortlaut nennt die Gestalt nicht ausdrücklich so.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Griechischen, klingt aber idiomatisch; „Völker“ und „Herr“ bewahren den offenen, schriftgeprägten theologischen Registerton.
