  source_fidelity: Die Wiedergabe der Satzstruktur, des Dativs τοῖς ἔθνεσι und der gemeinsamen Beziehung von πάντας τοὺς ἐπικαλουμένους auf beide Infinitive ist zutreffend. Bei ῥάβδος ist jedoch „Spross“ zu eng und verschiebt das ausdrücklich vorhandene Stab-/Zepterbild. Das Verb βλαστήσει trägt bereits das Hervorsprossen.
  naturalness: Der Satz ist in modernem, würdigem Standarddeutsch flüssig. „Stab der Gerechtigkeit“ ist in diesem bildhaft-schriftsprachlichen Register natürlich genug und wahrt die Metapher genauer als „Spross der Gerechtigkeit“.
  terminology: „Völker“, „Gerechtigkeit“, „richten“, „retten“ und „den Herrn anrufen“ sind angemessen. „Stab“ erhält die lexikalische Offenheit von ῥάβδος besser als die botanisch spezifizierende Wahl „Spross“.
