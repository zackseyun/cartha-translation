  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/003.yaml
  text: '[This is the shoot of the Most High God, a spring providing life to all flesh.]'
translation:
  language: de
  text: '[Dieser ist der Spross des höchsten Gottes, und diese ist die Quelle, die allen Leben schenkt.][a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Wortlaut dieses Satzes ist textkritisch unsicher; insbesondere sind Teile der Formulierung einschließlich „und diese ist die Quelle“ in der Vorlage markiert. Wörtlich steht am Ende „die allen Leben gewährt“; „allem Fleisch“ steht nicht ausdrücklich im vorgelegten griechischen Text.
    reason: Die eckige Klammerung und Sternmarkierungen der Edition sowie die Abweichung vom englischen Beratungstext sollen transparent bleiben.
lexical_decisions:
- source_word: βλαστός
  choice: Spross
  rationale: Gibt das Bild eines jungen Triebs bzw. Nachkommens knapp und würdig wieder, ohne es ausdrücklich messianisch auszudeuten.
- source_word: Θεοῦ ὑψίστου
  choice: Gottes, des Höchsten
  rationale: Bewahrt die genitivische Verbindung und gibt ὑψίστου als substantivierten Hoheitstitel natürlich wieder.
- source_word: πηγή
  choice: Quelle
  rationale: Entspricht dem konkreten Bild einer Wasserquelle und klingt im Deutschen natürlicher als „Quell“.
- source_word: πᾶσι
  choice: allen
  rationale: Folgt dem überlieferten griechischen Text. Ein ausdrückliches „Fleisch“ steht in der vorgelegten griechischen Fassung nicht.
- source_word: παρέχουσα ζωήν
  choice: die allen Leben schenkt
  rationale: Gibt den aktiven Sinn von „Leben gewährend/bereitstellend“ idiomatisch und würdig wieder.
theological_decisions:
- issue: Bezug und Identität von βλαστός
  choice: „Spross“ ohne ergänzende Identifizierung
  alternative: „Nachkomme“, „Messias“ oder „Zweig“
  rationale: Das Pflanzenbild und die mögliche messianische Spannung bleiben erhalten; der Text selbst benennt die Gestalt hier nicht ausdrücklich.
- issue: Umfang der Lebensgabe
  choice: „allen“
  alternative: „allem Fleisch“
  rationale: Die gelieferte griechische Lesart hat πᾶσι, aber kein σαρξ/σαρκί. Daher wird die im englischen Beratungstext enthaltene Präzisierung „all flesh“ nicht in den Haupttext übernommen.
- issue: Textgestalt mit καί
  choice: „und dies ist die Quelle“
  alternative: 'asyndetisch: „dies ist die Quelle“'
  rationale: Das im Quellenapparat markierte καί wird übersetzt, wobei seine textkritische Markierung durch eine Fußnote kenntlich gemacht wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Zeigestruktur („Dieser ist … und dies ist …“) wird trotz leichter Markiertheit bewahrt, um den Unterschied zwischen dem maskulinen βλαστός und dem femininen πηγή sichtbar zu halten.
