base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/001.yaml
  text: He will pour out the spirit of the holy Father’s blessing upon him, and he himself will pour out a spirit of grace upon you.
translation:
  language: de
  text: Und über ihm werden sich die Himmel öffnen, um Geist auszugießen, den Segen des heiligen Vaters[a]; und er selbst gießt über euch Geist der Gnade aus.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geist des Segens des heiligen Vaters“. Die griechische Wortfolge lässt das genaue Verhältnis von „Geist“ und „Segen“ offen.'
    reason: Die ungewöhnliche Folge zweier Akkusative erlaubt sowohl eine appositionelle als auch eine genitivisch verstandene Deutung.
lexical_decisions:
- source_word: ἀνοιγήσονται ἐπ᾽ αὐτῷ οἱ οὐρανοί
  choice: über ihm werden sich die Himmel öffnen
  rationale: Bewahrt das Passiv und die räumlich bzw. relational offene Präposition ἐπί; die im Englischen ausgelassene Aussage wird gemäß der griechischen Vorlage wiedergegeben.
- source_word: πνεῦμα
  choice: Geist
  rationale: Die artikellose Form wird im Deutschen ohne bestimmten Artikel wiedergegeben, soweit dies natürlich möglich ist.
- source_word: πνεῦμα χάριτος
  choice: Geist der Gnade
  rationale: Gibt den Genitiv eng und bewusst ohne zusätzliche dogmatische Präzisierung wieder.
- source_word: ἐκχέει
  choice: wird … ausgießen
  rationale: Das griechische Präsens steht im prophetischen Zukunftszusammenhang; das deutsche Futur stellt diesen Bezug natürlich dar.
theological_decisions:
- issue: Verhältnis von πνεῦμα und εὐλογίαν πατρὸς ἁγίου
  choice: 'Apposition: „Geist … – den Segen des heiligen Vaters –“'
  alternative: „Geist des Segens des heiligen Vaters“
  rationale: Beide Wörter stehen im Akkusativ; die appositionelle Wiedergabe erhält die Spannung der ungewöhnlichen Konstruktion, ohne „Geist“ und „Segen“ vorschnell zu einer Genitivverbindung umzudeuten.
- issue: Handelndes Subjekt beim ersten Ausgießen
  choice: Die sich öffnenden Himmel bleiben grammatischer Ausgangspunkt der Aussage.
  alternative: „Er wird … über ihn ausgießen“
  rationale: Die griechische Vorlage nennt vor dem Infinitiv kein ausdrückliches personales Subjekt; daher wird nicht wie in der englischen Konsultationsfassung ein ungenanntes „er“ ergänzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die doppelte Formulierung „Geist ausgießen“ folgt bewusst der Wiederholung im griechischen Text; Gedankenstriche machen die appositionelle Lesart verständlich, ohne die syntaktische Mehrdeutigkeit zu verdecken.
