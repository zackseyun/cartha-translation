  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024/004.yaml
  text: Then the scepter of my kingdom will shine forth, and from your root a shoot will arise.
translation:
  language: de
  text: Dann wird das Zepter meines Königtums[a] aufleuchten, und aus eurer Wurzel wird ein Stamm[b] hervorgehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: meines Königreichs.'
    reason: βασιλεία kann sowohl die Königsherrschaft als auch das Königreich bezeichnen.
  - marker: b
    text: Das griechische Wort kann auch „Wurzelstock“ oder „Grundstock“ bedeuten.
    reason: Bewahrt die lexikalische Spannweite von πυθμήν; „Stamm“ gibt im Kontext des Bildes vom Hervorgehen aus einer Wurzel die naheliegende Bedeutung wieder.
lexical_decisions:
- source_word: ἀναλάμψει
  choice: wird … aufleuchten
  rationale: Gibt das zukünftige Hervorleuchten oder Aufstrahlen natürlich und bildkräftig wieder.
- source_word: σκῆπτρον βασιλείας μου
  choice: das Zepter meines Königtums
  rationale: Bewahrt das Herrschaftsbild des Zepters; „Königtum“ bezeichnet hier eher königliche Herrschaft als ein räumlich verstandenes Reich.
- source_word: ἀπὸ τῆς ῥίζης ὑμῶν
  choice: aus eurer Wurzel
  rationale: Formnahe Wiedergabe des Herkunftsbildes; der Plural „eurer“ bleibt erhalten.
- source_word: πυθμήν
  choice: Spross
  rationale: Im Pflanzenbild bezeichnet das Wort den aus der Wurzel hervorgehenden Grundstock beziehungsweise Trieb; „Spross“ ist im Deutschen kontextgemäß und verständlich, obwohl das griechische Wort auch „Stamm“ oder „Grundstock“ bedeuten kann.
theological_decisions:
- issue: Bedeutung von βασιλεία im Herrschaftsbild
  choice: Königtum
  alternative: Königreich
  rationale: „Königtum“ lässt den Bezug auf königliche Herrschaft offen und vermeidet eine unnötige Festlegung auf ein Territorium.
- issue: Deutung des Pflanzenbildes πυθμήν
  choice: Spross mit Fußnote zur lexikalischen Spannweite
  alternative: Stamm oder Grundstock
  rationale: Der Zusammenhang mit dem Hervorgehen aus einer Wurzel legt einen neuen Trieb nahe; die Fußnote bewahrt die weitere Bedeutungsspanne, ohne eine bestimmte messianische Auslegung in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Herrschafts- und Pflanzenbilder bleiben knapp und poetisch; mögliche Bedeutungsvarianten werden in Fußnoten offengehalten.
