  source_fidelity: 'Der deutsche Text gibt den griechischen Satz vollständig und ohne sachliche Zusätze wieder: οὕτως = „So“, λάθρα = „heimlich“, ἐξ ἑκατέρων τῶν μερῶν τοῦ τείχους = „von beiden Seiten der Mauer“ und εἰσῆλθον εἰς τὴν πόλιν = „drangen … in die Stadt ein“. Anders als die englische Audit-Fassung fügt er weder Pfähle noch ein unbemerktes Handeln der Stadtbewohner hinzu. Das im Englischen ergänzte „all“ hat im vorgelegten griechischen Text keine Grundlage und wurde zu Recht nicht übernommen.'
