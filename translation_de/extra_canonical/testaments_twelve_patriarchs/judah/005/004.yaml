source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ἀνεπήδησεν τὸ τεῖχος¹⁶. 4. *Καὶ οὕτως λάθρα οἱ ἀδελφοί μου ἐξ ἑκατέρων τῶν μερῶν τοῦ τείχους εἰσῆλθον εἰς τὴν πόλιν¹⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/004.yaml
  text: But all my brothers, having driven stakes into the wall from both sides, entered the city while they were unaware.
translation:
  language: de
  text: So drangen meine Brüder heimlich von beiden Seiten der Mauer in die Stadt ein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως
  choice: so
  rationale: Gibt die folgernde bzw. modale Verknüpfung knapp und natürlich wieder.
- source_word: λάθρα
  choice: heimlich
  rationale: Bewahrt die ausdrückliche Bedeutung des griechischen Adverbs; die englische Konsultationsfassung lässt dieses Element aus.
- source_word: ἐξ ἑκατέρων τῶν μερῶν τοῦ τείχους
  choice: von beiden Seiten der Mauer
  rationale: Gibt die räumliche Angabe idiomatisch wieder, ohne zusätzliche Handlungen wie das Einschlagen von Pfählen einzutragen, die im vorgelegten griechischen Text nicht stehen.
- source_word: εἰσῆλθον εἰς τὴν πόλιν
  choice: drangen … in die Stadt ein
  rationale: Das deutsche Verbgefüge vermittelt in diesem militärischen Zusammenhang einen zielgerichteten Eintritt in die Stadt und bleibt natürlich.
theological_decisions: []
