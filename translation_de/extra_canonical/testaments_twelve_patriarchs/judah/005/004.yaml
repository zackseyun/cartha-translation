  register: Modernes, gut verständliches Standarddeutsch mit knapper erzählerischer Würde. Die Übersetzung folgt dem bereitgestellten griechischen Vers 5,4 unmittelbar und nicht den abweichenden Einzelheiten der englischen Konsultationsfassung.
