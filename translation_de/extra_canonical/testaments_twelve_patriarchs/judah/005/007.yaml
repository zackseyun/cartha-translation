  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem griechischen Wortlaut deutlich besser als die englische POB-Konsultationsfassung: ἀπεκτείναμεν πάντας entspricht „wir töteten sie alle“, und πάλιν ἐλάβομεν τὴν αἰχμαλωσίαν ἡμῶν bezeichnet die erneute Rückgewinnung der eigenen Gefangenen bzw. der eigenen Gefangenschaft. Im griechischen Text stehen weder ein Verbrennen der Stadt noch eine Ergänzung wie „alles darin“.'
  naturalness: „nahmen unsere Gefangenen wieder an uns“ ist im modernen Standarddeutsch unidiomatisch. „holten unsere Gefangenen zurück“ ist klar, natürlich und bewahrt den Rückgewinnungssinn von πάλιν ἐλάβομεν.
  terminology: „Gefangene“ gibt αἰχμαλωσία hier als kollektive Bezeichnung wieder. Die Formulierung lässt offen, ob konkret Gefangene oder die als Kollektiv gedachte Gefangenschaft gemeint ist, ohne einen nicht im Text genannten Ort oder Ablauf zu ergänzen.
