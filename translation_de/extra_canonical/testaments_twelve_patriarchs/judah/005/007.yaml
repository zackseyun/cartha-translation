translation:
  language: de
  text: Wir töteten sie alle[a] und holten unsere Gefangenen zurück.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hochgestellte 25 im griechischen Text verweist auf eine textkritische Anmerkung zu „alle“; der genaue Apparatinhalt liegt hier nicht vor.
    reason: Der überlieferte Apparatverweis wird sichtbar gemacht, ohne eine nicht bereitgestellte Lesart zu rekonstruieren.
lexical_decisions:
- source_word: Ἀπεκτείναμεν
  choice: Wir töteten
  rationale: Gibt den griechischen Aorist schlicht und direkt wieder.
- source_word: πάντας
  choice: sie alle
  rationale: Das substantivisch gebrauchte Akkusativpronomen bezeichnet sämtliche zuvor genannten Gegner; die textkritische Markierung wird in einer Fußnote vermerkt.
- source_word: πάλιν ἐλάβομεν
  choice: nahmen ... wieder an uns
  rationale: Bewahrt die Bedeutung von πάλιν und gibt ἐλάβομεν in diesem Rückgewinnungskontext natürlich wieder.
- source_word: τὴν αἰχμαλωσίαν ἡμῶν
  choice: unsere Gefangenen
  rationale: αἰχμαλωσία kann abstrakt „Gefangenschaft“ oder kollektiv die Gefangenen beziehungsweise Verschleppten bezeichnen. Im Zusammenhang mit ἐλάβομεν ist die kollektive Wiedergabe im Deutschen am verständlichsten.
theological_decisions: []
translation_notes:
  register: 'Kurzer, würdevoller Erzählstil in modernem Standarddeutsch. Die englische Konsultationsfassung weicht erheblich vom vorgelegten griechischen Text ab: Dieser erwähnt weder das Verbrennen einer Stadt noch „alles darin“, sondern die Rückgewinnung der eigenen Gefangenen; daher folgt die Übersetzung dem griechischen Quellenwortlaut.'
