  source_fidelity: Die Wendung προσέφθημεν beschreibt im Kontext ein Vorgehen gegen die Stadt; die Richtungsangaben markieren die östliche bzw. westliche Seite. „kamen ... zuvor“ trifft dies nicht zuverlässig und erzeugt im Deutschen zudem eine unpassende Bedeutung des Zuvorkommens.
  naturalness: „Ich aber und Gad kamen der Stadt von Osten zuvor“ ist im modernen Standarddeutsch semantisch und syntaktisch missverständlich. „Gad und ich rückten von Osten her gegen die Stadt vor“ ist idiomatisch und bewahrt, ohne über den griechischen Wortlaut hinauszugehen, den militärischen Kontext.
