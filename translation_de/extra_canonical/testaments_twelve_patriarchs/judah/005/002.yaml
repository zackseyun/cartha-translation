  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/002.yaml
  text: But I and Gad attacked from the east of the city, and Reuben and Levi from the west.
translation:
  language: de
  text: Gad und ich rückten von Osten her gegen die Stadt vor, Ruben aber und Levi von Westen her.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέφθημεν
  choice: kamen … zuvor
  rationale: Die Form von προφθάνω bezeichnet hier primär das Zuvorkommen bzw. frühere Eintreffen. Anders als die englische Konsultationsfassung legt das griechische Verb für sich genommen keinen ausdrücklichen Angriff nahe.
- source_word: ἀπὸ ἀνατολῶν τῆς πόλεως
  choice: der Stadt von Osten
  rationale: Gibt die östliche Annäherungsrichtung natürlich wieder, ohne das im Griechischen nicht ausdrücklich genannte Angriffsgeschehen zu ergänzen.
- source_word: ἀπὸ δυσμῶν
  choice: von Westen
  rationale: Knappes, idiomatisches Deutsch für die westliche Richtung; die elliptische Zuordnung zur Stadt wird aus dem ersten Satzglied übernommen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die adversative Parallelstruktur mit zweimaligem „aber“ bleibt erhalten; die genuine lexikalische Spannung gegenüber der englischen Deutung „attacked“ wird zugunsten des griechischen Wortlauts bewahrt.
