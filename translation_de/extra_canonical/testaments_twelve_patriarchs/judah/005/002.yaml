    rationale: „Jemandem zuvorkommen“ verlangt im Deutschen einen klaren Bezug auf eine Person oder Handlung und bedeutet, früher als diese zu handeln oder einzutreffen. Die griechische Aussage beschreibt hier das Vorgehen der Beteiligten aus entgegengesetzten Richtungen gegen die Stadt. „rückten ... gegen die Stadt vor“ gibt dieses Vorgehen wieder, ohne die stärker explizierende Formulierung „griffen an“ zwingend zu machen.
