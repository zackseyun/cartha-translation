  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/006.yaml
  text: And as we were departing, men of Thapphoue fell upon our captives; and after handing them over to our sons, we joined battle with them as far as Thapphoue.
translation:
  language: de
  text: Als wir aufbrachen, bemächtigten sich Männer aus Babue[a] unserer Gefangenen. Als wir das sahen, nahmen wir den Kampf mit ihnen auf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Ortsname ist im griechischen Text unsicher überliefert. Andere Textfassungen lesen hier „Thapphue“.
    reason: Die Edition kennzeichnet Βαβουὲ als textkritisch problematisch; die englische Konsultationsfassung bezeugt eine abweichende Ortsnamensform.
lexical_decisions:
- source_word: ἐν δὲ τῷ ἀπιέναι ἡμᾶς
  choice: Als wir aufbrachen
  rationale: Die temporale Konstruktion bezeichnet den Zeitpunkt des Fortgehens; „aufbrachen“ ist natürliches, würdevolles Deutsch.
- source_word: ἄνδρες †Βαβουὲ
  choice: Männer aus Babue[a]
  rationale: Βαβουὲ wird als indeklinabler Ortsname verstanden. Das kritische Zeichen der Edition weist jedoch auf eine unsichere beziehungsweise verderbte Lesart hin, was die Fußnote offenlegt.
- source_word: ἐπελάβοντο τὴν αἰχμαλωσίαν ἡμῶν
  choice: bemächtigten sich … unserer Gefangenen
  rationale: ἐπιλαμβάνομαι bezeichnet hier ein Ergreifen oder Sichbemächtigen. Das kollektive αἰχμαλωσία wird kontextgerecht mit „Gefangene“ wiedergegeben.
- source_word: καὶ ἰδόντες ἡμεῖς
  choice: Als wir das sahen
  rationale: Das Partizip wird als zeitlich-reaktive Angabe wiedergegeben; das ergänzte „das“ nimmt den unmittelbar vorherigen Vorgang auf.
- source_word: συνῆψαν πόλεμον μετ᾽ αὐτῶν
  choice: nahmen wir den Kampf mit ihnen auf
  rationale: Die Wendung bedeutet wörtlich, einen Krieg oder Kampf mit jemandem zu verbinden beziehungsweise zu beginnen. „Den Kampf aufnehmen“ ist idiomatisch und bewahrt den militärischen Sinn.
theological_decisions: []
translation_notes:
  register: Modernes, klares Standarddeutsch mit erzählerisch-würdigem Ton. Die Übersetzung folgt dem vorgelegten griechischen Text; die in der englischen Fassung enthaltenen zusätzlichen Aussagen über die Übergabe an die Söhne und den Kampf bis Thapphue stehen nicht im angegebenen griechischen Wortlaut und wurden daher nicht in den Haupttext aufgenommen.
