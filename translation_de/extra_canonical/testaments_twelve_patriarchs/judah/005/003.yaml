  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/003.yaml
  text: And those on the wall, thinking that we were alone, were drawn toward us.
translation:
  language: de
  text: Und die auf der Mauer wurden, weil sie meinten, wir seien allein, zu uns hingezogen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἐπὶ τοῦ τείχους
  choice: die Männer auf der Mauer
  rationale: Die substantivierte Wendung bezeichnet die Personen auf der Mauer; „Männer“ macht dies im Deutschen natürlich und im erzählerischen Zusammenhang verständlich.
- source_word: ὅτι ἡμεῖς μόνοι ἐσμὲν
  choice: weil sie meinten, wir seien allein
  rationale: ὅτι gibt hier den Beweggrund beziehungsweise die Annahme der Männer wieder. Der Konjunktiv „seien“ kennzeichnet diese als ihre Einschätzung, ohne sie als Erzählerfeststellung auszugeben.
- source_word: ἐφειλκύσθησαν
  choice: ließen sich … heranlocken
  rationale: Das Passiv beschreibt, dass sie angezogen beziehungsweise hervorgelockt wurden. „Sich heranlocken lassen“ gibt diese Nuance idiomatisch wieder, ohne einen Angriff ausdrücklich hinzuzufügen.
- source_word: πρὸς ἡμᾶς
  choice: zu uns heran
  rationale: πρός mit Akkusativ bezeichnet hier die Bewegung auf die Sprechergruppe zu; die Übersetzung bewahrt diese räumliche Richtung.
