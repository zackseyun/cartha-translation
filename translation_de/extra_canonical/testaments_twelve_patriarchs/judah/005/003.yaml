revisions:
- from: Und die Männer auf der Mauer ließen sich zu uns heranlocken, weil sie meinten, wir seien allein.
  to: Und die auf der Mauer wurden, weil sie meinten, wir seien allein, zu uns hingezogen.
  rationale: Die Revision hält die durch den englischen Audit Trail gestützte implizite Annahme („weil sie meinten“) bei, ersetzt aber die voluntative und kausal eingeengte Wendung „ließen sich … heranlocken“ durch ein deutsches Passiv, das ἐφειλκύσθησαν näher folgt. Zugleich wird die nicht ausdrücklich im Ausgangstext ausgedrückte Beschränkung auf Männer vermieden.
  reviewer_model: gpt-5.6-terra
