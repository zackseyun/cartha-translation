  source_fidelity: 'Die Übersetzung gibt alle Elemente des griechischen Textes wieder: τῇ ἑξῆς als „am folgenden Tag“, ἀπήλθομεν εἰς als Bewegung nach Areta, πόλιν κραταιάν als „mächtige Stadt“ und ἀπειλοῦσαν ἡμῖν θάνατον als Drohung mit dem Tod. Anders als die englische Audit-Fassung fügt sie kein unbelegtes „noch immer“ hinzu.'
  naturalness: „Und am folgenden Tag zogen wir nach Areta, einer mächtigen Stadt, die uns mit dem Tod drohte“ ist flüssiges, modernes Standarddeutsch und wahrt einen angemessen würdigen erzählerischen Registerton. Die Personifikation der Stadt ist im Deutschen verständlich und entspricht dem griechischen Partizip.
  terminology: „Mächtig“ trifft κραταιάν präzise; „mit dem Tod drohte“ ist eine idiomatische und semantisch genaue Wiedergabe. Der Ortsname Areta wird konsistent mit der Vorlage behandelt.
