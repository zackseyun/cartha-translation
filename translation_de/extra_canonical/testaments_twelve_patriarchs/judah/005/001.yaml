source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ¹ τῇ ἑξῆς ἀπήλθομεν εἰς Ἀρετὰν², πόλιν κραταιάν³, *ἀπειλοῦσαν ἡμῖν θάνατον⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/001.yaml
  text: And on the next day we went to Areta, a city still mighty and strong, threatening us with death.
translation:
  language: de
  text: Und am folgenden Tag zogen wir nach Areta, einer mächtigen Stadt, die uns mit dem Tod drohte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ἑξῆς
  choice: am folgenden Tag
  rationale: Die elliptische griechische Wendung bezeichnet im Erzählzusammenhang den folgenden Tag; die Ergänzung „Tag“ ist im Deutschen notwendig und natürlich.
- source_word: ἀπήλθομεν εἰς Ἀρετάν
  choice: zogen wir nach Areta
  rationale: ἀπέρχομαι mit εἰς bezeichnet hier die Bewegung zu einem Ziel. „zogen“ passt zum gemeinsamen Unterwegssein, ohne ein im Deutschen schwerfälliges „gingen fort nach“ zu erzwingen.
- source_word: πόλιν κραταιάν
  choice: einer mächtigen Stadt
  rationale: κραταιός bedeutet „stark, mächtig“. Der griechische Text enthält nur ein Adjektiv; daher wird die englische Doppelung „mighty and strong“ nicht übernommen.
- source_word: ἀπειλοῦσαν ἡμῖν θάνατον
  choice: die uns mit dem Tod drohte
  rationale: Die idiomatische deutsche Wendung gibt die aktive Bedrohung durch die Stadt beziehungsweise ihre Bewohner präzise wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerisch natürlichem „zogen“. Die personifizierende Aussage über die Stadt bleibt wie im Griechischen erhalten; gemeint sein können zugleich ihre Bewohner oder Verteidiger.
