review_pass:
  verdict: approve
  source_fidelity: 'Der deutsche Text gibt alle Satzglieder des griechischen Textes wieder: die Einnahme von αὐτήν durch das Schwert, die in den einzelnen Turm Geflohenen, das Verbrennen mit Feuer sowie die abschließende Erfassung sowohl aller Personen als auch alles dessen, was ihnen gehörte. Anders als die englische Audit-Fassung bewahrt er zutreffend auch καὶ πάντα τὰ αὐτῶν.'
  naturalness: Das Deutsch ist modernes, verständliches Standarddeutsch mit einem dem Werk angemessenen würdigen Register. Die Wiederholung „die, die“ ist zwar schlicht, aber natürlich und eindeutig.
  terminology: „Mit der Schärfe des Schwertes“ gibt die griechische idiomatische Wendung ἐν στόματι μαχαίρας angemessen wieder. Der Singular „Turm“ entspricht τῷ πύργῳ. „Gefangen nehmen“ ist für die Personen bei ἐλάβομεν kontextgerecht; „alles, was ihnen gehörte“ gibt πάντα τὰ αὐτῶν vollständig wieder.
