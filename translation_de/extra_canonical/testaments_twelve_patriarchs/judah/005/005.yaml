source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ κατελάβομεν αὐτὴν¹⁸ ἐν στόματι μαχαίρας¹⁹, καὶ τοὺς ἐν τῷ πύργῳ²⁰ καταφυγόντας ἐν πυρὶ ἐνεπρήσαμεν, καὶ οὕτως πάντας ἐλάβομεν, καὶ πάντα τὰ αὐτῶν²¹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/005/005.yaml
  text: And we took it by the edge of the sword, and those who had fled for refuge in the tower we burned with fire; and so we captured them all.
translation:
  language: de
  text: Und wir nahmen sie mit der Schärfe des Schwertes ein; die, die in den Turm geflohen waren, verbrannten wir mit Feuer. So nahmen wir sie alle gefangen und alles, was ihnen gehörte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν στόματι μαχαίρας
  choice: mit der Schärfe des Schwertes
  rationale: Die wörtliche Wendung »mit dem Mund des Schwertes« bezeichnet idiomatisch die Schwertschärfe. Die gewählte Form bewahrt das Bild in verständlichem, würdigem Deutsch.
- source_word: τῷ πύργῳ
  choice: in den Turm
  rationale: Der griechische Text steht im Singular; daher wird nicht »Türme« übersetzt.
- source_word: καταφυγόντας
  choice: die, die … geflohen waren
  rationale: Gibt die Flucht an einen Zufluchtsort natürlich wieder, ohne den Zielort über den ausdrücklich genannten Turm hinaus auszudeuten.
- source_word: ἐλάβομεν
  choice: nahmen … ein / nahmen … gefangen
  rationale: 'Dasselbe Verb wird kontextabhängig wiedergegeben: Bei einem weiblichen Bezugswort, wahrscheinlich einer Stadt oder Befestigung, passt »einnahmen«; bei Personen »gefangen nahmen«.'
- source_word: πάντα τὰ αὐτῶν
  choice: alles, was ihnen gehörte
  rationale: Dieser im griechischen Ausgangstext vorhandene Satzteil bezeichnet umfassend ihren Besitz beziehungsweise alles Ihrige. Er wird aufgenommen, obwohl er in der englischen Konsultationsfassung fehlt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den griechischen Text. Das feminine Pronomen αὐτήν bleibt als »sie« erhalten, da sein konkretes Bezugswort im isolierten Vers nicht ausdrücklich genannt wird. Die drastische Gewaltdarstellung wird weder abgeschwächt noch erläutert.
