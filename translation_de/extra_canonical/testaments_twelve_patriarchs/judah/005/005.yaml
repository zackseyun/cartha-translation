  revised_text: Und wir nahmen sie mit der Schärfe des Schwertes ein; die, die in den Turm geflohen waren, verbrannten wir mit Feuer. So nahmen wir sie alle gefangen und alles, was ihnen gehörte.
  revised_footnotes: []
