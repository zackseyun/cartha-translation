base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/002.yaml
  text: And the Lord blessed Levi, but the angel of the presence blessed me; the powers of glory, Simeon; heaven, Reuben; the earth, Issachar; the sea, Zebulun; the mountains, Joseph; the tent, Benjamin; the lights, Dan; delight, Naphtali; the sun, Gad; the moon, Asher.
translation:
  language: de
  text: Und der Herr segnete Levi; der Engel der Gegenwart segnete mich; die Mächte der Herrlichkeit segneten Simeon; der Himmel Ruben; die Erde —; das Meer Josef; die Himmelslichter Dan; die Wonne Naftali; die Sonne Gad und der Mond Ascher.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte griechische Wortlaut ist an dieser Stelle offenbar unvollständig oder gestört: Nach „die Erde“ fehlt der Name eines Stammes, und in der gesamten Reihe fehlen Issachar, Sebulon und Benjamin. Andere Textfassungen rekonstruieren hier eine vollständigere Zuordnung, doch der vorliegende griechische Text bietet dafür keine sichere Grundlage.'
    reason: Die Fußnote macht die textkritische Störung transparent und verhindert, dass eine unsichere Rekonstruktion als gesicherter Wortlaut erscheint.
lexical_decisions:
- source_word: ὁ ἄγγελος τοῦ προσώπου
  choice: der Engel der Gegenwart
  rationale: Die Wendung bezeichnet den Engel, der vor Gottes Angesicht beziehungsweise in seiner Gegenwart steht. „Engel der Gegenwart“ ist im Deutschen verständlich und wahrt den traditionellen theologischen Gehalt.
- source_word: αἱ δυνάμεις τῆς δόξης
  choice: die Mächte der Herrlichkeit
  rationale: Die formale Wiedergabe bewahrt die mögliche Bezeichnung himmlischer Mächte, ohne sie näher zu bestimmen.
- source_word: αἱ φωστῆρες
  choice: die Himmelslichter
  rationale: Gemeint sind leuchtende Himmelskörper; „Himmelslichter“ ist natürlicher und genauer als das allgemeinere „Lichter“.
- source_word: ἡ τρυφή
  choice: die Wonne
  rationale: τρυφή kann Genuss, Wohlleben oder Wonne bezeichnen. „Wonne“ passt zur personifizierten Segensgröße und erhält den gehobenen Ton.
theological_decisions:
- issue: Bezeichnung des Engels in der Wendung ὁ ἄγγελος τοῦ προσώπου
  choice: Engel der Gegenwart
  alternative: Engel des Angesichts
  rationale: Die gewählte Form gibt die Nähe zu Gottes Gegenwart idiomatisch wieder, ohne den Engel mit Gott gleichzusetzen oder seine Identität weiter festzulegen.
- issue: Unvollständige und offenbar gestörte Zuordnung der Stämme im überlieferten griechischen Wortlaut
  choice: Den tatsächlich vorliegenden Text wiedergeben, die Leerstelle nach „die Erde“ sichtbar lassen und die Textstörung in einer Fußnote erläutern
  alternative: Die im englischen Beratungstext rekonstruierte vollständige Reihe stillschweigend in den Haupttext übernehmen
  rationale: Die bereitgestellte griechische Primärquelle nennt nach „die Erde“ keinen zugehörigen Stamm und verbindet „das Meer“ unmittelbar mit Josef. Eine vollständige Rekonstruktion wäre ohne ausgewiesene zusätzliche griechische Evidenz textkritisch zu sicher und würde echte Unsicherheit verdecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Nach dem ersten vollständigen Satzglied wird das Verb „segnen“ in der aufzählenden Reihe elliptisch ausgelassen, entsprechend der knappen griechischen Konstruktion. Der Gedankenstrich nach „die Erde“ markiert sichtbar das fehlende Zuordnungsobjekt.
