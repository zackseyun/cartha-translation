base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/003.yaml
  text: And you will be the Lord’s people, with one language, and there will not be there a spirit of Belial’s deceit, because it will be thrown into the fire forever.
translation:
  language: de
  text: Und ihr werdet das Volk des Herrn sein, mit einer einzigen Sprache. Dort wird es keinen Geist der Verführung Beliars geben, denn er wird auf ewig geworfen werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „denn er wird auf ewig hineingeworfen werden“. Der griechische Text nennt kein Ziel; insbesondere steht hier nicht „ins Feuer“.'
    reason: Macht die syntaktisch auffällige, zieloffene Wendung des überlieferten griechischen Textes sichtbar und erklärt, warum die englische Ergänzung „ins Feuer“ nicht übernommen wird.
lexical_decisions:
- source_word: λαὸν Κυρίου
  choice: das Volk des Herrn
  rationale: Gibt die Zugehörigkeit zu Gott klar und in natürlichem biblischem Deutsch wieder.
- source_word: γλῶσσα μία
  choice: mit einer einzigen Sprache
  rationale: Bewahrt die elliptische Verbindung des Griechischen und versteht γλῶσσα im Zusammenhang als gemeinsame Sprache, ohne ausdrücklich ein nicht vorhandenes Verb wie „sprechen“ einzusetzen.
- source_word: πνεῦμα πλάνης τοῦ Βελιάρ
  choice: Geist der Verführung Beliars
  rationale: πλάνη kann Irrtum, Täuschung oder Verführung bezeichnen. „Verführung“ wahrt hier sowohl den irreführenden Charakter als auch die Zuordnung zu Beliar.
- source_word: ἐμβληθήσεται
  choice: wird … fortgeschleudert werden
  rationale: Das Passiv bezeichnet ein gewaltsames Werfen. Da im überlieferten Wortlaut kein Ziel genannt ist, vermeidet „fortgeschleudert“ die Ergänzung eines ungesicherten Zielorts.
- source_word: εἰς τὸν αἰῶνα
  choice: auf ewig
  rationale: Idiomatiche Wiedergabe der griechischen Zeitformel mit dauerhaftem Sinn.
theological_decisions:
- issue: Ziel des Hineinwerfens
  choice: Kein Ziel wie „ins Feuer“ im Haupttext ergänzt
  alternative: „ins Feuer geworfen“, wie in der englischen Konsultationsfassung
  rationale: Im angegebenen griechischen Ausgangstext steht lediglich ἐμβληθήσεται εἰς τὸν αἰῶνα. „Ins Feuer“ wäre eine inhaltlich gewichtige Ergänzung ohne Stütze im vorgelegten Primärtext.
- issue: Bezug des Pronomens im Begründungssatz
  choice: „er“ bezieht sich auf den Geist der Verführung
  alternative: Unpersönliche oder auf Beliar bezogene Wiedergabe
  rationale: Das sächliche griechische πνεῦμα ist das nächstliegende Bezugswort für die ebenfalls sächliche Verbform; im Deutschen verlangt „Geist“ das maskuline Pronomen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Beliar“ bleibt als Eigenname erhalten. „Mehr“ verdeutlicht im Deutschen den endzeitlichen Zustandswechsel, ohne den Inhalt sachlich zu verändern.
