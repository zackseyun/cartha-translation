source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Καὶ ἔσεσθε εἰς λαὸν³¹ Κυρίου, καὶ³² γλῶσσα μία³³, καὶ οὐκ ἔσται ἐκεῖ³⁴ πνεῦμα πλάνης³⁵ τοῦ Βελιάρ, ὅτι ἐμβληθήσεται³⁶ *εἰς τὸν αἰῶνα³⁷.
