  source_fidelity: 'Der Entwurf folgt der vorgelegten griechischen α-Spalte zuverlässig: μετὰ ταῦτα ist angemessen mit „danach“ wiedergegeben; ἀναστήσεται … εἰς ζωήν mit „zum Leben auferstehen“; und ἐν Ἰσραήλ bleibt korrekt „in Israel“. Insbesondere ergänzt „Anführer“ weder „Stämme“ noch „Zepter“, die im bereitgestellten griechischen Text nicht stehen. Die Rangfolge und die abschließende Aussage πάντες καθεξῆς sind vollständig erhalten.'
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. Die Aufzählung mit „an erster Stelle“ und den elliptisch folgenden Ordnungsangaben ist natürlich und klar. Der Satzwechsel nach „auferstehen“ ist im Deutschen stilistisch unproblematisch.
  terminology: Die Eigennamen sind in geläufiger deutscher Bibelschreibung wiedergegeben. „Anführer“ ist für ἔξαρχοι neutral und angemessen, ohne eine spezifischere politische oder stammesbezogene Funktion einzutragen. „Auferstehen“ wahrt die im griechischen Ausdruck vorhandene Auferstehungsterminologie.
