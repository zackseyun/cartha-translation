reference: Testament of Judah 25:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: XXV. Καὶ¹ μετὰ ταῦτα *ἀναστήσεται Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ εἰς ζωήν², *καὶ ἐγὼ καὶ οἱ ἀδελφοί μου ἔξαρχοι³ *ἐν Ἰσραὴλ ἐσόμεθα⁵, πρῶτος Λευί⁶, δεύτερος ἐγώ⁷, τρίτος Ἰωσήφ⁸, τέταρτος Βενιαμίν⁹, *πέμπτος Συμεών, ἕκτος Ἰσαχάρ¹⁰, καὶ¹² *πάντες καθεξῆς¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/001.yaml
  text: 'And after these things Abraham and Isaac and Jacob will rise to life, and I and my brothers will be rulers of scepters in Israel: Levi first, I second, Joseph third, Benjamin fourth, Simeon fifth, Issachar sixth, and thus all the rest in order.'
translation:
  language: de
  text: 'Und danach werden Abraham, Isaak und Jakob zum Leben auferstehen. Auch ich und meine Brüder werden Anführer in Israel sein: Levi an erster Stelle, ich an zweiter, Josef an dritter, Benjamin an vierter, Simeon an fünfter, Issachar an sechster und alle übrigen der Reihe nach.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: danach
  rationale: Gibt die zeitliche Abfolge natürlich und präzise wieder, ohne die im Deutschen schwerfällige Wendung „nach diesen Dingen“.
- source_word: ἀναστήσεται … εἰς ζωήν
  choice: werden … zum Leben auferstehen
  rationale: Bewahrt sowohl das Aufstehen beziehungsweise Auferstehen als auch das ausdrückliche Ziel „zum Leben“.
- source_word: ἔξαρχοι
  choice: Anführer
  rationale: Das griechische Wort bezeichnet führende Personen. „Anführer“ vermeidet die unbelegte Ergänzung „der Stämme“ und folgt dem vorliegenden griechischen Text, der an dieser Stelle weder „Stämme“ noch „Zepter“ enthält.
- source_word: πάντες καθεξῆς
  choice: alle übrigen der Reihe nach
  rationale: Im Zusammenhang sind die verbleibenden Brüder gemeint; „der Reihe nach“ gibt καθεξῆς idiomatisch wieder.
theological_decisions:
- issue: Art des künftigen Lebens Abrahams, Isaaks und Jakobs
  choice: zum Leben auferstehen
  alternative: wieder lebendig werden
  rationale: Die gewählte Formulierung wahrt die Auferstehungssprache von ἀνίστημι und löst nicht weiter auf, wie dieses künftige Leben theologisch zu verstehen ist.
- issue: Stellung Judas und seiner Brüder in Israel
  choice: Anführer in Israel
  alternative: Herrscher über Israel
  rationale: „In Israel“ entspricht ἐν Ἰσραήλ; „über Israel“ würde den Herrschaftsbereich stärker bestimmen, als es der griechische Wortlaut tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Aufzählungsstruktur. Die Wiederholung „an erster/zweiter … Stelle“ wird nach dem ersten Glied elliptisch fortgeführt, wie es im Deutschen natürlich ist. Der Entwurf folgt der angegebenen griechischen α-Spalte auch dort, wo die englische Konsultationsfassung offenbar eine andere Lesart voraussetzt.
