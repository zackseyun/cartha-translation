source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: '*Καὶ οἱ ἔλαφοι⁴⁸ Ἰακὼβ⁴⁹ δραμοῦνται ἐν ἀγαλλιάσει⁴⁹, καὶ ἀετοὶ Ἰσραὴλ⁴⁹ πετασθήσονται ἐν χαρᾷ· [οἱ δὲ ἀσεβεῖς πενθήσουσι καὶ οἱ ἁμαρτωλοὶ κλαύσονται]⁵¹, καὶ πάντες οἱ λαοὶ δοξάσουσι Κύριον εἰς αἰῶνας⁵².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/005.yaml
  text: And the deer of Joseph will run in exultation, and the eagles of Israel will fly in joy, and all the peoples will glorify the Lord forever.
translation:
  language: de
  text: Und die Hirsche Jakobs werden jubelnd laufen, und die Adler Israels werden voller Freude fliegen. [Die Gottlosen aber werden trauern, und die Sünder werden weinen.][a] Und alle Völker werden den Herrn in Ewigkeit verherrlichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der eingeklammerte Satz ist textlich unsicher.
    reason: Die Ausgangsedition setzt diesen Satz in eckige Klammern; die Unsicherheit soll für Leser sichtbar bleiben.
lexical_decisions:
- source_word: οἱ ἔλαφοι Ἰακώβ
  choice: die Hirsche Jakobs
  rationale: Die griechische Hauptlesart nennt ausdrücklich Jakob, nicht Josef. ἔλαφοι bezeichnet Hirsche beziehungsweise Rotwild; „Hirsche“ bewahrt das konkrete Bild.
- source_word: ἐν ἀγαλλιάσει
  choice: jubelnd
  rationale: Die adverbiale Wiedergabe klingt im modernen Deutsch natürlich und erhält den Sinn ausgelassener Freude.
- source_word: ἀετοὶ Ἰσραήλ
  choice: die Adler Israels
  rationale: Die bildhafte Genitivverbindung wird formal und ohne zusätzliche Deutung wiedergegeben.
- source_word: πετασθήσονται ἐν χαρᾷ
  choice: werden voller Freude fliegen
  rationale: Gibt Futur und Freudenmotiv idiomatisch wieder, ohne die Bildsprache abzuschwächen.
- source_word: πάντες οἱ λαοί
  choice: alle Völker
  rationale: λαοί meint hier kollektive Völker beziehungsweise Volksgruppen; „Völker“ ist im feierlichen Kontext passend.
- source_word: εἰς αἰῶνας
  choice: in Ewigkeit
  rationale: Eine natürliche, würdige Wiedergabe der zeitlich unbegrenzten Formel.
theological_decisions:
- issue: Identität der ersten Bildgruppe
  choice: Jakob
  alternative: Josef
  rationale: Der vorgelegte griechische Ausgangstext liest Ἰακώβ. Die abweichende englische Konsultationsfassung „Joseph“ wird daher nicht übernommen.
- issue: Textlich unsicherer Gerichtssatz
  choice: Im Haupttext in eckigen Klammern beibehalten und mit Fußnote kennzeichnen
  alternative: Den Satz auslassen
  rationale: Der Satz steht im bereitgestellten griechischen Text, ist dort jedoch bereits als textlich unsicher markiert. Seine Beibehaltung wahrt sowohl den überlieferten Inhalt als auch die Unsicherheit, ohne sie stillschweigend zu entscheiden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, bildhaftem Ton. Die Parallelität von Hirschen, Adlern, Gottlosen/Sündern und allen Völkern bleibt erhalten; unnötige konfessionelle Ausdeutungen werden vermieden.
