base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025/004.yaml
  text: And those who died in sorrow will rise in joy, and the poor because of the Lord will be made rich, and those dying because of the Lord will awake to life.
translation:
  language: de
  text: Und jene, die in Trauer gestorben sind, werden auferstehen; und die Armen werden wegen des Herrn reich werden, und jene, die wegen des Herrn sterben, werden zum Leben erwachen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die zweimalige Wendung »wegen des Herrn« kann je nach Zusammenhang eine Ursache, einen Anlass oder auch ein Handeln um des Herrn willen bezeichnen.
    reason: Bewahrt die Bedeutungsbreite von διὰ Κύριον mit Akkusativ und erläutert die in beiden Satzgliedern gleich wiedergegebene Formel.
lexical_decisions:
- source_word: ἐν λύπῃ
  choice: in Trauer
  rationale: Gibt den Zustand von Kummer oder Betrübnis natürlich und würdevoll wieder. Der griechische Ausgangstext enthält hier keinen ausdrücklichen Zusatz wie »in Freude«.
- source_word: ἀναστήσονται
  choice: werden auferstehen
  rationale: Entspricht dem eschatologisch gefärbten Verb und wahrt dessen Bezug auf die Auferstehung.
- source_word: διὰ Κύριον
  choice: um des Herrn willen
  rationale: Gibt διά mit Akkusativ als Begründung oder Anlass wieder, ohne die Formulierung vorschnell auf eine rein instrumentale Bedeutung festzulegen; die Wiederholung wird in beiden Satzteilen bewahrt.
- source_word: πλουτισθήσονται
  choice: werden reich werden
  rationale: Bildet das passive beziehungsweise intransitiv verstandene Werden reich ab, ohne einen im Griechischen nicht ausdrücklich genannten Handelnden einzufügen.
- source_word: ἐξυπνισθήσονται εἰς ζωήν
  choice: werden zum Leben erwachen
  rationale: Bewahrt das Bild des Erwachens und gibt εἰς ζωήν idiomatisch als Zielrichtung wieder.
theological_decisions:
- issue: Bedeutung von διὰ Κύριον
  choice: um des Herrn willen
  alternative: wegen des Herrn / aufgrund des Herrn
  rationale: Die Wendung kann Ursache, Anlass oder Beweggrund bezeichnen. Die gewählte Formulierung erhält diese Spannung besser als eine Festlegung auf unmittelbare Verursachung.
- issue: Im englischen Konsultationstext ergänztes »in joy«
  choice: Keine Ergänzung nach »werden auferstehen«
  alternative: »werden in Freude auferstehen«
  rationale: Der vorgelegte griechische Haupttext enthält nach ἀναστήσονται keine Entsprechung für »in Freude«. Die Übersetzung folgt daher der originalsprachlichen Quellenlage.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem eschatologischem Ton. Die Satzparallelität und die zweimalige Wiederholung derselben griechischen Wendung bleiben erhalten.
