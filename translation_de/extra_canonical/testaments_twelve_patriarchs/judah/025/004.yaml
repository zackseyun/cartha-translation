  source_fidelity: 'Der Haupttext folgt dem griechischen α-Text zuverlässig: ἐν λύπῃ wird ohne die im englischen Audittext ergänzte Freude wiedergegeben, ἀναστήσονται ist zutreffend als Auferstehen übersetzt, und ἐξυπνισθήσονται εἰς ζωήν bewahrt das Bild des Erwachens zum Leben. Bei διὰ Κύριον ist „um des Herrn willen“ im zweiten Vorkommen möglich, im ersten („die Armen ... werden reich“) jedoch weniger naheliegend als die kausale Wiedergabe „wegen des Herrn“. Die identische griechische Formel sollte in beiden Gliedern gleich wiedergegeben werden.'
  naturalness: Der Satz ist verständlich und dem würdigen Register angemessen. „Die, die“ ist zwar korrekt, aber „jene, die“ wirkt in diesem parallelen, prophetischen Satzbau etwas glatter. „Wegen des Herrn“ ist hier idiomatisch und bildet beide Vorkommen einheitlich ab.
  terminology: „Herr“, „auferstehen“ und „zum Leben erwachen“ sind terminologisch angemessen. „Wegen des Herrn“ hält die durch διά mit Akkusativ mögliche kausale bzw. anlassbezogene Bedeutung offen, ohne eine spezifische theologische Deutung festzulegen.
