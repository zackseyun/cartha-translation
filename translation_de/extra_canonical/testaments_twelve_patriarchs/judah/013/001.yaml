source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ νῦν ἐντέλλομαι ὑμῖν, τέκνα μου, ἀκούσατε *Ἰούδα¹ τοῦ πατρὸς ὑμῶν⁷² καὶ φυλάξασθε⁹ τοὺς λόγους μου¹⁰ τοῦ ποιεῖν⁷ πάντα¹¹ τὰ δικαιώματα Κυρίου¹³ καὶ ὑπακούειν¹⁴ ἐντολαῖς⁵ Θεοῦ¹⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013/001.yaml
  text: 'And now I command you, my children: listen to Judah, your father, and keep my words in your hearts, to do all the righteous commands of the Lord and to obey the commands of God.'
translation:
  language: de
  text: 'Und nun gebiete ich euch, meine Kinder: Hört auf Juda, euren Vater, und bewahrt meine Worte, um alle Satzungen des Herrn zu erfüllen und den Geboten Gottes zu gehorchen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντέλλομαι
  choice: gebiete ich
  rationale: Gibt den verbindlichen Charakter der väterlichen Weisung wieder, ohne ihn zu einer bloßen Bitte abzuschwächen.
- source_word: ἀκούσατε
  choice: Hört auf
  rationale: Drückt hier nicht nur akustisches Hören, sondern aufmerksames und folgebereites Hören auf eine Person aus.
- source_word: φυλάξασθε τοὺς λόγους μου
  choice: bewahrt meine Worte
  rationale: Bleibt nahe am Bild des sorgfältigen Festhaltens und Beachtens; ein Zusatz wie „in euren Herzen“ steht im vorgelegten griechischen Text nicht.
- source_word: τοῦ ποιεῖν
  choice: um … zu erfüllen
  rationale: Gibt den finalen beziehungsweise konsekutiven Bezug des artikulierten Infinitivs natürlich wieder; bei Satzungen bezeichnet ποιεῖν deren praktische Ausführung.
- source_word: δικαιώματα Κυρίου
  choice: Satzungen des Herrn
  rationale: δικαιώματα bezeichnet verbindliche, als recht geltende Bestimmungen. „Satzungen“ unterscheidet den Ausdruck von den nachfolgenden ἐντολαί, ohne einen fremden theologischen Zusatz einzutragen.
- source_word: ὑπακούειν ἐντολαῖς Θεοῦ
  choice: den Geboten Gottes zu gehorchen
  rationale: Entspricht der Dativrektion und bewahrt den deutlichen Gehorsamsaspekt von ὑπακούειν.
theological_decisions:
- issue: Verhältnis zwischen den „Satzungen des Herrn“ und den „Geboten Gottes“
  choice: Die beiden griechischen Bezeichnungen werden als „Satzungen“ und „Gebote“ unterschieden, ohne daraus zwei verschiedene göttliche Gesetzesordnungen abzuleiten.
  alternative: Beide Ausdrücke einheitlich mit „Gebote“ wiederzugeben.
  rationale: Die lexikalische Variation des Ausgangstextes soll sichtbar bleiben, während die parallelen Gottesbezeichnungen nicht künstlich gegeneinander ausgespielt werden.
- issue: Judas Selbstbezeichnung in der dritten Person
  choice: „Hört auf Juda, euren Vater“ wird unverändert als Selbstbezeichnung wiedergegeben.
  alternative: „Hört auf mich, euren Vater“.
  rationale: Die auffällige dritte Person gehört zum vorgelegten griechischen Text und sollte nicht stillschweigend geglättet werden.
translation_notes:
  register: Moderne, klare Standardsprache mit würdigem, leicht biblischem Ton. Die Satzstruktur bleibt eng am Griechischen, ohne unnatürliche deutsche Genitiv- oder Infinitivkonstruktionen. Kein nicht belegter Zusatz wie „in euren Herzen“ wurde übernommen.
