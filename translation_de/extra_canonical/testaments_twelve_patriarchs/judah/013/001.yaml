  verdict: approve
  source_fidelity: 'Die deutsche Fassung folgt dem vorgelegten griechischen Text eng: ἐντέλλομαι ist angemessen mit „gebiete ich“ wiedergegeben, ἀκούσατε mit dem im Deutschen gehorsamsbezogenen „Hört auf“, und die auffällige Selbstbezeichnung „Juda, euren Vater“ bleibt erhalten. φυλάξασθε τοὺς λόγους μου wird ohne unbelegten Zusatz korrekt als „bewahrt meine Worte“ übersetzt. Die Infinitivverbindungen geben die praktische Befolgung der δικαιώματα des Herrn und den Gehorsam gegenüber Gottes ἐντολαί wieder.'
  naturalness: „Und nun gebiete ich euch, meine Kinder“ und die anschließende direkte Mahnung sind modernes, gut verständliches Standarddeutsch mit einem dem Testament angemessenen würdigen Ton. „Hört auf Juda“ ist idiomatisch und bewahrt zugleich den Sinn des folgebereiten Hörens.
  terminology: „Satzungen des Herrn“ für δικαιώματα und „Gebote Gottes“ für ἐντολαί sind tragfähige, differenzierende Wiedergaben. Die Fassung führt keine theologische Harmonisierung oder zusätzliche Deutung ein. Im Unterschied zur englischen Audit-Fassung übernimmt sie zutreffend nicht den im vorgelegten griechischen Text nicht belegten Zusatz „in euren Herzen“.
