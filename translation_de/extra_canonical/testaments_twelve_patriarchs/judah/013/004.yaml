id: T12P.JUD.13.4
reference: Testament of Judah 13:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Ἔλεγον γὰρ τῷ πενθερῷ μου ὅτι συμβουλεύσομαι τῷ πατρί μου καὶ οὕτως λήψομαι³⁴ τὴν θυγατέρα σου⁵· ὁ δὲ οὐκ ἠθέλησεν, ἀλλ᾽ ἔδειξέ³⁵ μοι *εἰς δόσιν αὐτῆς³⁶ χρυσίου πλῆθος³⁷ ἄπειρον³⁸. *Βασιλεὺς γὰρ ἦν³⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013/004.yaml
  text: For I said to my father-in-law, “I will consult my father, and then I will take your daughter.” But he was unwilling; instead, he showed me an immense amount of gold in the name of his daughter, for he was a king.
translation:
  language: de
  text: 'Denn ich sagte zu meinem Schwiegervater: „Ich will meinen Vater um Rat fragen und dann deine Tochter zur Frau nehmen.“ Doch er wollte das nicht, sondern zeigte mir als Gabe für sie[a] eine unermessliche Menge Gold; denn er war ein König.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „als Mitgift für sie“; die griechische Wendung ist mehrdeutig.'
    reason: Die Formulierung εἰς δόσιν αὐτῆς kann allgemein eine Gabe im Zusammenhang mit der Tochter oder konkreter ihre Mitgift bezeichnen.
lexical_decisions:
- source_word: συμβουλεύσομαι τῷ πατρί μου
  choice: ich will meinen Vater um Rat fragen
  rationale: Gibt die Beratung mit dem Vater in natürlichem modernem Deutsch wieder, ohne daraus eine förmliche Einwilligung zu machen.
- source_word: λήψομαι τὴν θυγατέρα σου
  choice: deine Tochter zur Frau nehmen
  rationale: Im Heiratskontext bezeichnet λαμβάνειν das Nehmen zur Frau; der Zusatz verhindert im Deutschen ein irreführend wörtliches Verständnis.
- source_word: εἰς δόσιν αὐτῆς
  choice: als Gabe für sie
  rationale: Bewahrt die ungewöhnliche und mehrdeutige Formulierung des Griechischen. Eine eindeutige Festlegung auf „Mitgift“ wäre interpretierend.
- source_word: χρυσίου πλῆθος ἄπειρον
  choice: eine unermessliche Menge Gold
  rationale: Gibt sowohl πλῆθος als Mengenbezeichnung als auch ἄπειρον in seiner verstärkenden Bedeutung wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt schlicht; „zur Frau nehmen“ macht den Heiratskontext verständlich. Die semantische Unsicherheit der Goldgabe wird im Haupttext bewahrt und in der Fußnote ausgewiesen.
