base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013/003.yaml
  text: and I reproached Reuben my brother concerning Bilhah, my father’s wife, and the spirit of jealousy and sexual immorality arrayed themselves against me, until I completed it with Anan the Canaanite woman and with Tamar my daughter-in-law.
translation:
  language: de
  text: Und ich machte meinem Bruder Ruben wegen Bilha, der Frau meines Vaters, Vorwürfe, und der Geist der Eifersucht und der Unzucht stellte sich gegen mich auf, bis ich es mit der Kanaaniterin[a] und mit Tamar, meiner Schwiegertochter, vollendete.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „der Kanaaniterin“. Der griechische Text ist an dieser Stelle als unsicher gekennzeichnet; ein Frauenname steht in der vorgelegten Lesart nicht eindeutig da.'
    reason: Kennzeichnet die textkritische Unsicherheit und vermeidet, den im Englischen gebotenen Namen „Anan“ ohne sicheren Rückhalt im griechischen Ausgangstext zu übernehmen.
  - marker: b
    text: Die griechische Wendung ist ungewöhnlich und bedeutet wörtlich etwa „bis ich es … vollendete“. Gemeint ist im Zusammenhang offenbar, dass Juda in entsprechende sexuelle Verfehlungen geriet; das Verb selbst sagt jedoch nicht ausdrücklich „ich sündigte“.
    reason: Erklärt die schwer verständliche, aber bewusst formal bewahrte Wendung und ihre moralische Kontextbedeutung.
lexical_decisions:
- source_word: ὠνείδιζον
  choice: ich machte … Vorwürfe
  rationale: Gibt das imperfektive ὠνείδιζον natürlich wieder, ohne die fortdauernde oder wiederholte Handlung unnötig festzulegen.
- source_word: τὸ πνεῦμα τοῦ ζήλου καὶ τῆς πορνείας
  choice: der Geist der Eifersucht und der Unzucht
  rationale: Bewahrt den Singular „Geist“ sowie beide Genitivbestimmungen. „Eifersucht“ passt hier zum tadelnden Vergleich mit Ruben; „Unzucht“ ist eine würdige, hinreichend breite Wiedergabe von πορνεία.
- source_word: παρετάξατο ἐπ᾽ ἐμέ
  choice: stellte sich … gegen mich auf
  rationale: Erhält das bildhafte, konfrontative Moment des Verbs und vermeidet eine rein psychologisierende Umschreibung.
- source_word: συνετέλεσα
  choice: führte … zu Ende
  rationale: Folgt dem Grundsinn „vollenden/zu Ende bringen“ und ersetzt die ungewöhnliche Formulierung nicht interpretierend durch „sündigte“.
- source_word: τὴν Χανανανίτην
  choice: die Kanaaniterin
  rationale: Der vorgelegte griechische Text enthält nur die substantivierte Herkunftsbezeichnung und keinen sicher lesbaren Eigennamen.
- source_word: τὴν νύμφην μου
  choice: meine Schwiegertochter
  rationale: Im Verhältnis Judas zu Tamar bezeichnet νύμφη hier die Schwiegertochter.
theological_decisions:
- issue: Art der Wirksamkeit des „Geistes“
  choice: Die personale bzw. überpersonale Ausdrucksweise „der Geist … stellte sich gegen mich auf“ bleibt erhalten.
  alternative: Als bloßen inneren Trieb oder als ausdrücklich dämonisches Wesen erklären.
  rationale: Der griechische Text personifiziert den Geist, bestimmt dessen ontologischen Status aber nicht eindeutig.
- issue: Moralische Deutung von συνετέλεσα
  choice: Wörtlich-offen als „zu Ende führte“ wiedergeben.
  alternative: Explizit „sündigte“ oder „Unzucht trieb“ übersetzen.
  rationale: Der Zusammenhang ist klar negativ, doch das Verb selbst nennt die Handlung nicht ausdrücklich „Sünde“. Die befremdliche Mehrdeutigkeit soll nicht stillschweigend beseitigt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne die logische Abfolge zu verändern. Die militärische Bildsprache von παρετάξατο und die auffällige Unbestimmtheit von συνετέλεσα bleiben erhalten.
