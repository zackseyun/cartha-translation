  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013/005.yaml
  text: And he adorned her with gold and pearls, and made her pour wine for us at the banquet.
translation:
  language: de
  text: Und er schmückte sie mit Gold und Perlen und ließ sie uns beim Mahl Wein einschenken, in der Schönheit von Frauen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in der Schönheit von Frauen“. Die griechische Wendung ist ungewöhnlich; möglicherweise beschreibt sie ihr ansprechendes weibliches Erscheinungsbild.'
    reason: Erläutert eine im griechischen Text vorhandene, semantisch unsichere Wendung, die in der englischen Konsultationsfassung fehlt.
lexical_decisions:
- source_word: ἐκόσμησεν
  choice: schmückte
  rationale: Gibt das aktive Ausstatten oder Schmücken natürlich und quellennah wieder.
- source_word: μαργαρίταις
  choice: Perlen
  rationale: Die übliche und eindeutige Wiedergabe des griechischen Wortes.
- source_word: οἰνοχοεῖν ἡμῖν
  choice: uns … Wein einschenken
  rationale: Drückt die konkrete Tätigkeit idiomatisch aus; ἡμῖν bleibt ausdrücklich erhalten.
- source_word: ἐν τῷ δείπνῳ
  choice: beim Mahl
  rationale: Bewahrt den Bezug auf die gemeinsame Mahlzeit, ohne ein besonders festliches Bankett vorauszusetzen.
- source_word: ἐν κάλλει γυναικῶν
  choice: in der Schönheit von Frauen
  rationale: Formale Wiedergabe der schwer verständlichen griechischen Wendung; ihre mögliche Bedeutung wird nicht stillschweigend festgelegt.
theological_decisions:
- issue: Deutung der Schlusswendung ἐν κάλλει γυναικῶν
  choice: Die Wendung im Haupttext wörtlich und offen wiedergeben.
  alternative: Die Wendung auslassen wie die englische Konsultationsfassung oder deutend als „in weiblicher Schönheit“ übersetzen.
  rationale: Die griechische Quelle enthält die Wendung ausdrücklich. Ihre ungewöhnliche Form und mögliche textkritische Unsicherheit sprechen dafür, die echte Mehrdeutigkeit sichtbar zu bewahren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt flüssig; die schwierige Schlusswendung wird bewusst nicht geglättet oder ausgelassen.
