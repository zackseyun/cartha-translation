  source_fidelity: Die Übersetzung gibt ἐγκαυχησάμενος angemessen als rückblickendes Rühmen, ἐν πολέμοις im Plural und πρόσωπον γυναικὸς εὐμόρφου konkret wieder. Die ergänzte Verneinung ist nicht im erhaltenen griechischen Wortlaut belegt; sie ist jedoch wegen des mit † gekennzeichneten verderbten Textes und des Kontextes als Konjektur vertretbar, sofern sie klar in der Fußnote ausgewiesen bleibt.
  naturalness: Der Satz ist grundsätzlich modernes Standarddeutsch. Nach dem Plusquamperfekt „hatte mich … gebrüstet“ ist „nicht getäuscht hatte“ als zeitlich zurückliegende Inhaltsaussage idiomatischer als das im Entwurf stehende „nicht getäuscht habe“.
  terminology: „sich brüsten“, „Kriege“, „Gesicht“ und „schöne Frau“ sind registergerecht und quellentreu. Das bewusst konkrete „Gesicht“ sollte nicht zu dem interpretierenden „Anblick“ abgeschwächt werden.
