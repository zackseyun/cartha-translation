    rationale: „… hatte mich damit gebrüstet, dass … nicht getäuscht habe“ vermischt Plusquamperfekt und Konjunktiv-I-Perfekt ohne erkennbaren Anlass. „… nicht getäuscht hatte“ ist im deutschen Erzählrückblick natürlich und wahrt den Sinn.
  - severity: low
