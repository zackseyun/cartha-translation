  text: Because I boasted that in wars the face of a beautiful woman had not deceived me,
translation:
  language: de
  text: Denn auch ich hatte mich damit gebrüstet, dass mich in den Kriegen das Gesicht einer schönen Frau nicht getäuscht hatte,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text ist an dieser Stelle offenbar verderbt und enthält wörtlich keine Verneinung: »… dass mich in den Kriegen das Gesicht einer schönen Frau täuschte«. Der Zusammenhang legt die hier wiedergegebene Lesart nahe.'
    reason: Kennzeichnet transparent die textkritische Ergänzung „nicht“, ohne sie fälschlich als vom erhaltenen Satzbau erzwungen darzustellen.
lexical_decisions:
- source_word: ἐγκαυχησάμενος
  choice: hatte mich damit gebrüstet
  rationale: Gibt das prahlerische Sich-Rühmen natürlich wieder und passt zum rückblickenden Zusammenhang.
- source_word: ἐν πολέμοις
  choice: in den Kriegen
  rationale: Bewahrt den Plural und den konkreten Bereich, auf den sich Judas Prahlen bezieht.
- source_word: πρόσωπον γυναικὸς εὐμόρφου
  choice: das Gesicht einer schönen Frau
  rationale: Folgt dem konkreten Bild des griechischen Ausdrucks, ohne es deutend zu »Anblick« oder »Reiz« umzuschreiben.
- source_word: ἠπάτησέ με
  choice: mich … nicht getäuscht habe
  rationale: 'ἀπατάω bedeutet »täuschen, irreführen«. Die Negation ist eine textkritisch begründete Ergänzung: Der überlieferte Wortlaut ist an dieser Stelle als verderbt markiert, und Sinn sowie Satzbau verlangen offenbar die Aussage, mit der Juda geprahlt hatte.'
