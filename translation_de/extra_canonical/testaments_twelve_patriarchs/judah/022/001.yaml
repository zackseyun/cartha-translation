source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Ἐπάξει¹ δὲ αὐτοῖς Κύριος διαιρέσεις *κατ᾽ ἀλλήλων¹³, καὶ ἔσονται *συνεχεῖς ἔσονται³ ἐν Ἰσραήλ⁴.'
