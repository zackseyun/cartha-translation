review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt ἐπάξει, διαιρέσεις, κατ᾽ ἀλλήλων und συνεχεῖς im Wesentlichen angemessen wieder. „Kriege“ steht jedoch nicht im vorliegenden griechischen Wortlaut. Die doppelte Form ἔσονται ist zwar textlich auffällig, erlaubt aber keinen sicheren Haupttext mit dem ergänzten Substantiv „Kriege“.
  naturalness: „Der Herr aber wird … bringen“ und „fortwährend Kriege geben“ sind verständlich, doch „Spaltungen …, sodass sie gegeneinander stehen“ erklärt den Ausdruck leicht paraphrasierend. Die direkte Rückaufnahme von „Spaltungen“ ist im Deutschen klar und würdig formulierbar.
  terminology: „Der Herr“ und „Spaltungen“ sind passende, registergerechte Wiedergaben. Der problematische zweite Teilsatz soll ohne unbezeugte Konkretisierung als Fortdauer der zuvor genannten Spaltungen wiedergegeben werden.
  issues:
  - severity: medium
    issue: Unbezeugtes „Kriege“ im Haupttext
    rationale: Das überlieferte Griechisch enthält nach καὶ lediglich ἔσονται συνεχεῖς ἔσονται ἐν Ἰσραήλ; ein Substantiv für „Kriege“ ist nicht vorhanden. Die Fußnote macht dies zwar kenntlich, aber der Haupttext entscheidet die unsichere Ergänzung zu stark.
  - severity: low
    issue: Fußnote bietet die quellennahe Lesart nur als Alternative
    rationale: Die Rückbeziehung auf διαιρέσεις ist die nächstliegende Wiedergabe des vorliegenden Textes. Die textliche Auffälligkeit der Wiederholung von ἔσονται kann weiterhin knapp dokumentiert werden.
  revised_text: Der Herr aber wird unter ihnen Spaltungen hervorrufen, sodass sie gegeneinander stehen; und diese werden in Israel fortbestehen.[a]
  revised_footnotes:
