base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/022/001.yaml
  text: The Lord will bring divisions among them against one another, and continual wars will be in Israel.
translation:
  language: de
  text: Der Herr aber wird unter ihnen Spaltungen hervorrufen, sodass sie gegeneinander stehen; und diese werden in Israel fortbestehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Wortlaut wiederholt „sie werden“ und ist dadurch syntaktisch auffällig. Er nennt jedoch keine „Kriege“ ausdrücklich; „diese“ bezieht sich auf die zuvor genannten Spaltungen.
    reason: Kennzeichnet die textliche Unregelmäßigkeit und vermeidet eine im griechischen Wortlaut nicht ausdrücklich bezeugte Ergänzung.
lexical_decisions:
- source_word: Ἐπάξει … αὐτοῖς
  choice: wird … unter sie bringen
  rationale: Gibt die Bewegung beziehungsweise das Herbeiführen der Spaltungen idiomatisch wieder, ohne das in αὐτοῖς liegende Betroffensein abzuschwächen.
- source_word: διαιρέσεις κατ᾽ ἀλλήλων
  choice: Spaltungen …, sodass sie gegeneinander stehen
  rationale: „Spaltungen“ entspricht διαιρέσεις; die Folgeformulierung macht das wechselseitige Gegeneinander von κατ᾽ ἀλλήλων in natürlichem Deutsch deutlich.
- source_word: συνεχεῖς
  choice: fortwährend
  rationale: Drückt die zeitliche Kontinuität des griechischen Adjektivs in gegenwärtigem Standarddeutsch aus.
- source_word: Κύριος
  choice: der Herr
  rationale: Bewahrt die traditionelle und kontextuell angemessene Wiedergabe des Gottesprädikats.
theological_decisions:
- issue: Göttliche Verursachung der Spaltungen
  choice: „Der Herr … wird Spaltungen … bringen“
  alternative: „Der Herr wird zulassen, dass Spaltungen entstehen“
  rationale: Der griechische Kausativausdruck ἐπάξει darf nicht durch eine bloße Zulassung abgeschwächt werden.
- issue: Nicht ausdrücklich genanntes Subjekt des zweiten Satzteils
  choice: „Kriege“ im Haupttext, mit textkritischer Fußnote
  alternative: 'Rückbezug auf „Spaltungen“: „und sie werden in Israel fortdauern“'
  rationale: Die überlieferte Form ist syntaktisch gestört; die traditionelle Rekonstruktion „Kriege“ ergibt den bezeugten Sinn der Passage, während die Fußnote die echte Unsicherheit offenlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah am griechischen Gedankengang, wird aber für gewöhnliche Leser geglättet; die problematische Überlieferung des zweiten Satzteils wird transparent ausgewiesen.
