source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ἐν ἀλλοφύλοις⁵ συντελεσθήσεται ἡ βασιλεία μου⁶, ἕως⁷ τοῦ ἐλθεῖν⁸ τὸ⁹ σωτήριον τοῦ¹⁰ Ἰσραήλ¹⁰,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/022/002.yaml
  text: And my kingdom will be brought to an end among foreigners, until the salvation of Israel comes,
translation:
  language: de
  text: Und unter Fremdvölkern wird mein Königtum ein Ende finden, bis das Heil Israels kommt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλοφύλοις
  choice: Fremdvölkern
  rationale: Bezeichnet Menschen anderer Volkszugehörigkeit; »Fremdvölker« bewahrt den ethnisch-politischen Sinn und passt zum Zusammenhang des Königtums.
- source_word: συντελεσθήσεται
  choice: wird … ein Ende finden
  rationale: Das Futur Passiv kann Vollendung oder Beendigung ausdrücken. Im Zusammenhang mit βασιλεία gibt die Formulierung das Zu-Ende-Kommen natürlich wieder, ohne den nicht ausdrücklich genannten Handelnden festzulegen.
- source_word: βασιλεία
  choice: Königtum
  rationale: Hier ist wahrscheinlich Judas Königsherrschaft beziehungsweise dynastisches Königtum gemeint. »Königtum« wahrt diesen Sinn besser als das räumlich klingende »Königreich«.
- source_word: σωτήριον
  choice: Heil
  rationale: Das substantivierte Neutrum bezeichnet Rettung beziehungsweise Heil; »Heil« erhält die knappe, theologisch offene Formulierung.
theological_decisions:
- issue: Bedeutung von »das Heil Israels«
  choice: das Heil Israels
  alternative: der Retter Israels
  rationale: σωτήριον ist grammatisch ein substantiviertes Neutrum und bezeichnet hier zunächst Heil oder Rettung. Eine personale messianische Deutung ist möglich, sollte aber nicht durch »Retter« in den Haupttext eingetragen werden.
- issue: Handelnder bei der Beendigung des Königtums
  choice: wird … ein Ende finden
  alternative: wird … zu Ende gebracht werden
  rationale: Das griechische Passiv nennt keinen Handelnden. Die gewählte deutsche Form wahrt diese Offenheit und vermeidet eine ausdrückliche Zuschreibung an Gott oder die Fremdvölker.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Anlehnung an die griechische Satzstruktur. Die zeitliche Spannung von ἕως τοῦ ἐλθεῖν bleibt durch »bis … kommt« erhalten.
