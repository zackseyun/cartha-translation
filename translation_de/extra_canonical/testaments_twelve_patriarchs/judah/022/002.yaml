  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die zentralen Bedeutungen des Griechischen zuverlässig wieder: ἐν ἀλλοφύλοις als „unter Fremdvölkern“, das unpersönlich bleibende Futurpassiv συντελεσθήσεται als „wird … ein Ende finden“, βασιλεία als „Königtum“ und τὸ σωτήριον τοῦ Ἰσραήλ als „das Heil Israels“. Die nicht näher bestimmte Beziehung des Heils zu Israel bleibt angemessen offen.'
  naturalness: „Und unter Fremdvölkern wird mein Königtum ein Ende finden, bis das Heil Israels kommt.“ ist verständliches, würdevolles modernes Standarddeutsch. Die leicht gehobene Wortwahl passt zum testamentarisch-prophetischen Register.
  terminology: „Königtum“ wahrt den Herrschafts- bzw. dynastischen Bezug von βασιλεία besser als ein rein territorial verstandenes „Königreich“. „Heil“ ist für σωτήριον sachgerecht und vermeidet die nicht zwingende Personalisierung zu „Retter“. „Fremdvölkern“ ist als Entsprechung für ἀλλόφυλοι tragfähig.
