  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/024.yaml
  text: '1. He will pour out the spirit of the holy Father’s blessing upon him, and he himself will pour out a spirit of grace upon you.

    2. And you will be for him sons in truth, and you will walk in his commands, first and last.

    3. [This is the shoot of the Most High God, a spring for the life of all flesh.]

    4. Then the scepter of my kingdom will shine forth, and from your root a stem will arise.

    5. And from it will spring up a rod of righteousness for the nations, to judge and to save all who call upon the Lord.'
translation:
  language: de
  text: '**Testament Judas 24**


    1 Nach diesen Dingen wird euch in Frieden ein Stern aus Jakob aufgehen. Ein Mann aus meinem Samen wird sich erheben wie eine Sonne der Gerechtigkeit. Er wird mit den Menschen in Sanftmut und Gerechtigkeit einhergehen, und keine Sünde wird an ihm gefunden werden.


    2 Über ihm werden sich die Himmel öffnen, um den Geist auszugießen, den Segen des heiligen Vaters; und er selbst wird über euch einen Geist der Gnade ausgießen.


    3 Ihr werdet ihm in Wahrheit Söhne sein und in seinen Geboten gehen, in den ersten wie in den letzten.[a]


    4 [Dieser ist der Spross Gottes, des Höchsten, und dies ist die Quelle, die allen Leben spendet.][b]


    5 Dann wird das Zepter meines Königtums aufleuchten, und aus eurer Wurzel wird ein Stamm hervorgehen.


    6 Aus ihr wird ein Stab der Gerechtigkeit für die Völker hervorsprossen, um alle zu richten und zu retten, die den Herrn anrufen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in seinen ersten und letzten Geboten“. Der knappe griechische Ausdruck lässt offen, ob eine zeitliche Reihenfolge oder die Gesamtheit der Gebote vom Anfang bis zum Ende gemeint ist.'
    reason: Bewahrt die Mehrdeutigkeit von πρώτοις καὶ ἐσχάτοις.
  - marker: b
    text: Dieser Satz steht in der griechischen Ausgabe in eckigen Klammern und ist damit als textlich unsicher gekennzeichnet. Der griechische Text lautet „die allen Leben spendet“; einige Wiedergaben ergänzen „allem Fleisch“.
    reason: Kennzeichnet sowohl den editorischen Status des Satzes als auch die Abweichung der konsultierten englischen Fassung vom vorgelegten griechischen Text.
lexical_decisions:
- source_word: ἄστρον
  choice: Stern
  rationale: Gibt das Bild des aufgehenden Himmelskörpers unmittelbar und traditionsneutral wieder.
- source_word: σπέρματός μου
  choice: meinem Samen
  rationale: Bewahrt die konkrete Abstammungsmetapher des Griechischen; „Nachkommenschaft“ wäre glatter, aber weniger bildnah.
- source_word: ἥλιος δικαιοσύνης
  choice: Sonne der Gerechtigkeit
  rationale: Erhält die genitivische Bildsprache und ihre mögliche intertextuelle Resonanz, ohne sie auszudeuten.
- source_word: πραότητι
  choice: Sanftmut
  rationale: Bezeichnet milde, nicht gewaltsame Haltung und entspricht dem würdigen Register des Abschnitts.
- source_word: προστάγμασιν
  choice: Geboten
  rationale: Natürliches deutsches Wort für verbindliche Anordnungen; vermeidet die im Deutschen technisch oder militärisch klingende Wiedergabe „Befehle“.
- source_word: βλαστὸς
  choice: Spross
  rationale: Bewahrt das vegetative Herrschafts- und Herkunftsbild.
- source_word: πηγὴ
  choice: Quelle
  rationale: Direkte Wiedergabe des Bildes einer lebensspendenden Quelle.
- source_word: σκῆπτρον βασιλείας μου
  choice: Zepter meines Königtums
  rationale: „Königtum“ bezeichnet Herrschaft und Königswürde, ohne den Ausdruck unnötig auf ein geografisches Königreich einzuengen.
- source_word: πυθμήν
  choice: Stamm
  rationale: Der Begriff kann den unteren Stammteil oder Wurzelstock bezeichnen; „Stamm“ fügt sich verständlich in die Pflanzenmetapher ein.
- source_word: ῥάβδος δικαιοσύνης
  choice: Stab der Gerechtigkeit
  rationale: Erhält das Herrschaftsbild und unterscheidet es sprachlich vom zuvor genannten Zepter.
- source_word: ἔθνεσι
  choice: Völker
  rationale: Im Kontext ist die Gesamtheit der nicht näher bestimmten Nationen/Völker gemeint; „Heiden“ würde eine stärkere religiöse Festlegung eintragen.
theological_decisions:
- issue: Bezug von „Sonne der Gerechtigkeit“
  choice: Das Bild wird ohne christologische Benennung wiedergegeben.
  alternative: Explizite Identifikation der Gestalt als Messias oder Christus.
  rationale: Der griechische Text beschreibt die Gestalt durch Bilder und Eigenschaften, nennt sie hier aber nicht ausdrücklich Messias oder Christus.
- issue: πνεῦμα εὐλογίαν πατρὸς ἁγίου in Vers 2
  choice: „Geist …, den Segen des heiligen Vaters“ wird als lockere Apposition bewahrt.
  alternative: „den Geist des Segens des heiligen Vaters“ oder „Geist und Segen des heiligen Vaters“.
  rationale: Die griechische Konstruktion ist syntaktisch rau und lässt das genaue Verhältnis von „Geist“ und „Segen“ offen; die Übersetzung soll diese Spannung nicht dogmatisch glätten.
- issue: υἱούς in Vers 3
  choice: Söhne
  alternative: Kinder
  rationale: Die maskuline Form wird formal bewahrt, da mögliche Sohnschafts- und Erbschaftssprache nicht neutralisiert werden soll.
- issue: Richter- und Retterfunktion in Vers 6
  choice: „um alle zu richten und zu retten“
  alternative: „um über alle Recht zu sprechen und alle zu retten“
  rationale: Die koordinierte Spannung zwischen Gericht und Rettung wird genauso stehen gelassen, ohne ihr Verhältnis systematisch zu erklären.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltener Bildsprache. Die Verse folgen der vollständigen griechischen Vorlage und werden als 1–6 gezählt; die verkürzte englische Konsultationsfassung setzt erst beim Inhalt des griechischen Verses 2 ein und wurde deshalb nicht als alleinige Textbasis verwendet.
