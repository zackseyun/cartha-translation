  terminology: „Sonne der Gerechtigkeit“, „Sanftmut“, „Spross“, „Zepter“, „Stab der Gerechtigkeit“ und „Völker“ sind treffend und traditionsneutral. „Söhne“ wahrt die Form des griechischen υἱούς. „Herr“ gibt Κύριον korrekt wieder, ohne eine im Text nicht ausgedrückte Identifikation einzutragen.
