review_pass:
  verdict: revise
  source_fidelity: 'Eine sichere Korrektur ist in Vers 3 erforderlich: ἐν ὄρει Σεείρ bezeichnet den Ort („auf dem Gebirge Seïr“) und nicht eine Richtung („auf das Gebirge ... hinauf“). In Vers 5 ist δρώντων als allgemeines Tätigsein wiederzugeben; „zusahen“ folgt eher der englischen Audit-Fassung als dem griechischen Wortlaut. Im Übrigen bewahrt die Fassung die auffällige Passivkonstruktion in Vers 3, die Unterwerfungsbedeutung von ὑποφόρους sowie die unsichere Ölmaßeinheit angemessen.'
  naturalness: Die Erzählprosa ist klar, modern und dem Gegenstand angemessen. „Während sie tätig waren“ ist absichtlich zurückhaltend, da das griechische Partizip kein konkretes Beobachten ausdrückt.
  terminology: Eigennamen, „Tributpflichtige“, „Machthaber“ und „Kor“ sind angemessen. „Schwer gerüsteten und mächtigen Heer“ ist als kontextuelle Wiedergabe von λαῷ βαρεῖ καὶ ἰσχυρῷ vertretbar, ohne eine konkrete Truppengattung zu behaupten.
  issues:
  - severity: medium
    issue: Vers 3 gibt ἐν ὄρει Σεείρ richtungsweisend wieder.
    rationale: Das griechische ἐν steht hier lokal. „auf das Gebirge ... hinaufgebracht“ ergänzt eine nicht ausgedrückte Bewegungsrichtung. Die passive und inhaltlich ungewöhnliche Aussage soll erhalten bleiben.
  - severity: medium
    issue: Vers 5 übersetzt δρώντων αὐτῶν mit „während sie zusahen“.
    rationale: δράω bedeutet tun, handeln oder tätig sein, nicht spezifisch zusehen. Die englische Fassung „while they were watching“ darf den griechischen Ausgangstext nicht übersteuern.
