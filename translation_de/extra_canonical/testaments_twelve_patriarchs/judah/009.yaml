  text: 'For eighteen years my father made peace with his brother Esau, and his sons were with us after we came from Mesopotamia, from Laban.


    2 And when the eighteen years were fulfilled, Esau, my father''s brother, came against us with a heavy and powerful people.


    3 And Jacob struck Esau with a bow, and he fell, slain by Jacob''s bow, dead on Mount Seir.


    4 And we pursued the sons of Esau, and they also had a fortified city, and we were not able to enter it. But sitting down around it, we besieged it.


    5 And because they did not open to us after twenty days, while they were watching, I brought up a ladder; and placing my shield over my head, and receiving the stones, I went up and killed four of their mighty men.


    6 And Reuben and Gad killed another six. Then they entered in succession.


    7 Then they asked from us terms of peace, and after counsel had been taken with our father, we accepted them.


    8 And they were giving us five hundred cors of wheat, and five hundred measures of oil, and five hundred measures of wine, until the famine, when we went down into Egypt.'
translation:
  language: de
  text: '9 Achtzehn Jahre lang hielt mein Vater Frieden mit seinem Bruder Esau, und dessen Söhne lebten bei uns, nachdem wir aus Mesopotamien, von Laban, zurückgekehrt waren.


    2 Als die achtzehn Jahre vollendet waren, zog Esau, der Bruder meines Vaters, mit einem schwer gerüsteten und mächtigen Heer gegen uns.


    3 Jakob traf Esau mit dem Bogen, und der Tote wurde auf dem Gebirge Seïr fortgetragen.[a]


    4 Wir verfolgten die Söhne Esaus. Auch sie hatten eine befestigte Stadt, in die wir nicht eindringen konnten. Daher lagerten wir rings um sie und belagerten sie.


    5 Als sie uns auch nach zwanzig Tagen nicht öffneten, brachte ich, während sie tätig waren, eine Leiter heran. Ich hielt den Schild über meinen Kopf, stieg hinauf und fing die Steine ab, die von der Mauer kamen.[b] Dann tötete ich vier ihrer Machthaber.


    6 Ruben und Gad töteten sechs weitere.


    7 Darauf baten sie uns um Frieden. Nachdem wir uns mit unserem Vater beraten hatten, nahmen wir sie als Tributpflichtige an.


    8 Sie entrichteten uns fünfhundert Kor Weizen, fünfhundert Maß Öl[c] und fünfhundert Maß Wein bis zu der Hungersnot, als wir nach Ägypten hinabzogen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Jakob traf Esau mit dem Bogen, und der Tote wurde auf dem Gebirge Seïr fortgetragen.“ Der griechische Wortlaut sagt weder ausdrücklich, wer den Toten forttrug, noch in welcher Beziehung der Tote zu Esau steht.'
    reason: Bewahrt die passive, auffällige Formulierung und vermeidet die im Griechischen nicht ausgedrückte Bewegungsrichtung.
  - marker: b
    text: 'Oder: „nahm die Steine entgegen, die von der Mauer herabkamen“.'
    reason: Die genaue Nuance von ἀποδεχόμενος ist im Belagerungskontext nicht völlig sicher.
  - marker: c
    text: Die Bezeichnung des Ölmaßes ist im griechischen Text verderbt; daher steht hier allgemein „Maß“.
    reason: Das überlieferte †ὕφης ist textkritisch unsicher und erlaubt keine verlässliche spezifische Maßeinheit.
lexical_decisions:
- source_word: ἐποίησεν ... εἰρήνην
  choice: hielt ... Frieden
  rationale: Gibt die über achtzehn Jahre andauernde friedliche Beziehung natürlich wieder, ohne den Ausdruck zu einem förmlichen Bund zu machen.
- source_word: ἐν λαῷ βαρεῖ καὶ ἰσχυρῷ
  choice: mit einem schwer gerüsteten und mächtigen Heer
  rationale: λαός bezeichnet hier die angreifende Streitmacht; βαρεῖ kann Schwere beziehungsweise militärische Wucht ausdrücken. Die Wiedergabe vermeidet das im Deutschen missverständliche „schwere Volk“.
- source_word: ἤρθη ὁ νεκρὸς ἐν ὄρει Σεείρ
  choice: der Tote wurde auf das Gebirge Seïr hinaufgebracht
  rationale: Bewahrt Passiv, Bezeichnung als Toter und Ortsangabe des griechischen Textes; die ungewöhnliche Aussage wird nicht nach der englischen Konsultationsfassung ergänzt.
- source_word: ἀποδεχόμενος ἀπὸ τοίχου λίθους
  choice: fing die Steine ab, die von der Mauer kamen
  rationale: ἀποδέχομαι bedeutet hier wohl aufnehmen beziehungsweise abfangen; die Formulierung lässt offen, ob der Schild ausdrücklich das Mittel war.
- source_word: δυνάστας
  choice: Machthaber
  rationale: Bezeichnet führende oder mächtige Männer und nicht bloß körperlich starke Kämpfer.
- source_word: ὑποφόρους
  choice: Tributpflichtige
  rationale: Der Ausdruck bezeichnet Unterworfene, die Abgaben leisten; Vers 8 erläutert diese Stellung.
- source_word: κόρους
  choice: Kor
  rationale: Der antike Hohlmaßname wird transliteriert, weil eine Umrechnung ohne weitere Festlegung unsicher wäre.
theological_decisions:
- issue: Tod Esaus und Rolle Jakobs
  choice: Jakob trifft Esau; anschließend wird „der Tote“ nach Seïr hinaufgebracht.
  alternative: „Er fiel, von Jakobs Bogen erschlagen, tot auf dem Berg Seïr.“
  rationale: Die Alternative übernimmt Zusätze und eine eindeutige Ortsbeziehung aus der englischen Konsultationsfassung, die im vorgelegten griechischen Text nicht ausdrücklich stehen. Die Übersetzung wahrt den auffälligen Wechsel vom Treffer zum passiv fortgebrachten Toten.
- issue: Status der besiegten Söhne Esaus
  choice: „nahmen wir sie als Tributpflichtige an“
  alternative: „nahmen wir sie auf“
  rationale: ὑποφόρους trägt eine konkrete politische und wirtschaftliche Unterwerfungsbedeutung, die durch die folgenden Abgaben bestätigt wird.
translation_notes:
  register: Moderne, würdige Erzählprosa mit klarer militärischer Terminologie. Die Verse sind fortlaufend nummeriert. Ungewohnte antike Maße und textliche Unsicherheiten werden knapp erläutert; echte Mehrdeutigkeit wird nicht harmonisiert.
