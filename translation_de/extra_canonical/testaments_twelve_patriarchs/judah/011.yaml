  text: 1 And I knew that the race of the Canaanites was evil[a], but the impulse of youth blinded my understanding. 2 And when I saw her pouring wine, I was deceived, and I took her, though my father had not given counsel. 3 But while I was away, she went and took for Shelah a wife from Canaan. 4 And when I learned what she had done, I cursed her in the anguish of my soul. 5 And indeed she died in her wickedness[c][b], with her children.
translation:
  language: de
  text: 1 Ich wusste, dass das Geschlecht der Kanaaniter böse war[a]; doch der Drang der Jugend verblendete meinen Verstand. 2 Als ich sie Wein einschenken sah, ließ ich mich täuschen und nahm sie[b], ohne dass mein Vater dazu geraten hatte[c]. 3 Während ich fort war, ging sie hin und nahm für Schela eine Frau aus Kanaan. 4 Als ich erfuhr, was sie getan hatte, verfluchte ich sie in der Qual meiner Seele. 5 Und tatsächlich starb sie in ihrer Bosheit, zusammen mit ihren Kindern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dass die Sippe der Kanaaniter böse war“. Das griechische γένος bezeichnet Abstammung, Sippe oder Volksgruppe.'
    reason: lexical_alternative
  - marker: b
    text: '„Ich nahm sie“ hat hier wahrscheinlich den Sinn: „Ich nahm sie zur Frau“; das Griechische formuliert jedoch knapper.'
    reason: lexical_alternative
  - marker: c
    text: Die Wendung kann auch bedeuten, dass Juda ohne den Rat oder die Zustimmung seines Vaters Jakob handelte.
    reason: alternative_reading
lexical_decisions:
- source_word: πονηρὸν γένος
  choice: das Geschlecht ... böse
  rationale: γένος bezeichnet hier Abstammung, Sippe oder Volksgruppe. „Geschlecht“ bewahrt den antiken Bezug auf Herkunft, ohne moderne biologische Rassevorstellungen einzutragen; „böse“ gibt die moralische Wertung von πονηρός direkt wieder.
- source_word: διαβούλιον τῆς νεότητος
  choice: der Drang der Jugend
  rationale: διαβούλιον kann Beratung, Überlegung oder Plan bezeichnen; im Zusammenhang bekennt Juda jedoch eine jugendliche Triebkraft, die sein Urteil überwand. „Drang“ ist natürlich und bewahrt die Spannung zwischen Überlegung und Impuls.
- source_word: ἐτύφλωσε τὴν διάνοιάν μου
  choice: verblendete meinen Verstand
  rationale: Die Wendung erhält das Bild geistig-moralischer Blindheit; διάνοια bezeichnet das Denk- und Erkenntnisvermögen.
- source_word: οἰνοχοοῦσαν
  choice: Wein einschenken
  rationale: Das Partizip bezeichnet das Einschenken oder Darreichen von Wein. Die konkrete Tätigkeit passt besser als die formelle Bezeichnung „als Mundschenkin dienen“.
- source_word: ἠπατήθην
  choice: ließ ich mich täuschen
  rationale: Die deutsche reflexive Passivumschreibung wahrt das Getäuschtwerden, ohne Judas eigene Verantwortung auszublenden.
- source_word: ἔλαβον αὐτὴν
  choice: nahm sie
  rationale: λαμβάνω kann bei einer Frau die Eheschließung meinen, doch der griechische Ausdruck bleibt knapp und unvermittelt. Die deutsche Form bewahrt diese Kürze; eine Fußnote nennt den wahrscheinlichen ehelichen Sinn.
- source_word: μὴ βουλευσαμένου τοῦ πατρός μου
  choice: ohne dass mein Vater dazu geraten hatte
  rationale: Der Genitivus absolutus besagt wörtlich, dass der Vater nicht beraten bzw. Rat gegeben hatte. Die Fassung ist idiomatisch und legt die Aussage nicht vorschnell allein auf eine formelle Zustimmung fest.
- source_word: ἀπόντος ἐμοῦ
  choice: während ich fort war
  rationale: Natürliche Wiedergabe des Genitivus absolutus, die den Erzählfluss erhält.
- source_word: ἔλαβε τῷ Σηλὼμ γυναῖκα
  choice: nahm für Schela eine Frau
  rationale: Die Wendung bezeichnet das Beschaffen oder Auswählen einer Frau für jemanden. „Nahm ... eine Frau“ bleibt eng am Wortlaut und wahrt den patriarchalischen Erzählton.
- source_word: ἐκ τῆς Χαναάν
  choice: aus Kanaan
  rationale: Die Formulierung lässt wie das Griechische offen, ob vor allem das Land oder die Bevölkerung als Herkunftsbezug gemeint ist.
- source_word: κατηρασάμην αὐτὴν
  choice: verfluchte ich sie
  rationale: Die direkte, kräftige Wiedergabe entspricht dem griechischen Verb und mildert Judas Reaktion nicht ab.
- source_word: ἐν ὀδύνῃ ψυχῆς μου
  choice: in der Qual meiner Seele
  rationale: „Qual“ gibt die starke innere Pein von ὀδύνη wieder; „Seele“ bewahrt die testamentarische Würde von ψυχή.
- source_word: ἐν τῇ πονηρίᾳ αὐτῆς
  choice: in ihrer Bosheit
  rationale: 'Die Präpositionalphrase bleibt bewusst mehrdeutig: Sie kann den Zustand, den Lebenszusammenhang oder den Umstand ihres Todes bezeichnen.'
theological_decisions:
- issue: Kollektive moralische Aussage über die Kanaaniter
  choice: „das Geschlecht der Kanaaniter [war] böse“ wird direkt wiedergegeben.
  alternative: „das kanaanitische Volk war verdorben“ oder „diese kanaanitische Linie war böse“
  rationale: Der Text fällt eine umfassende moralische Aussage über eine Abstammungs- bzw. Volksgruppe. Die Übersetzung soll diese antike Rhetorik weder abschwächen noch durch moderne Rassenbegriffe verschärfen.
- issue: Ehelicher Sinn von ἔλαβον αὐτήν
  choice: Im Haupttext steht knapp „nahm sie“.
  alternative: „heiratete sie“ oder „nahm sie zur Frau“
  rationale: Der Zusammenhang legt eine Eheschließung nahe, doch das Griechische formuliert abrupt. Der Haupttext bewahrt diese Form, während die Fußnote den wahrscheinlichen Sinn erklärt.
- issue: Art der väterlichen Beteiligung
  choice: „ohne dass mein Vater dazu geraten hatte“
  alternative: „ohne die Zustimmung meines Vaters“ oder „ohne dass mein Vater darüber beraten hatte“
  rationale: Das Verb kann Rat, Beratung oder Beschlussfassung bezeichnen. „Dazu geraten“ wahrt den Bezug auf den Vater, ohne aus dem Text eindeutig eine rechtliche Zustimmungspflicht zu machen.
- issue: Tod „in ihrer Bosheit“
  choice: Die räumlich-zuständliche Formulierung bleibt erhalten.
  alternative: „wegen ihrer Bosheit“
  rationale: ἐν bezeichnet nicht eindeutig eine Ursache. Eine kausale Übersetzung würde die theologische Aussage über den Zusammenhang von Bosheit und Tod stärker festlegen, als der Wortlaut erlaubt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die Formulierungen „Geschlecht“, „verblendete“, „Qual meiner Seele“ und „verfluchte“ bewahren den testamentarischen Ernst, ohne archaisch zu wirken. Die antike kollektive Wertung wird transparent wiedergegeben, aber sprachlich nicht mit modernen Rassekategorien verbunden.
