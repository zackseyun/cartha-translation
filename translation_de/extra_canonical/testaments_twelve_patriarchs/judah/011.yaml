review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die klaren Teile des griechischen Textes überwiegend treffend wieder. Er folgt jedoch der englischen Audit-Fassung in einer entscheidenden Auslassung: Der vorgelegte griechische Primärtext enthält nach V. 2 ein fragmentarisches „Meinen Sohn Er“ sowie einen weiteren, schwer verständlichen Satz über dessen Tod. Diese Textbestandteile dürfen nicht stillschweigend ausgelassen werden. Da der griechische Wortlaut hier offenbar verderbt oder mindestens stark gestört ist, wird er vorsichtig und mit einer textkritischen Fußnote wiedergegeben, ohne einen Sinn zu rekonstruieren, den der Text nicht sicher hergibt.'
  naturalness: Das vorhandene Deutsch ist klar, würdig und modernes Standarddeutsch. „ließ ich mich täuschen“ ist idiomatisch, aber etwas weniger unmittelbar als das griechische Passiv; „wurde ich getäuscht“ ist hier näher am Wortlaut und weiterhin natürlich. Der neu aufzunehmende gestörte Abschnitt kann aufgrund der Vorlage nicht voll idiomatisch geglättet werden; die Fußnote erklärt dies.
  terminology: „Geschlecht der Kanaaniter“, „Drang der Jugend“, „verblendete meinen Verstand“, „nahm sie“, „verfluchte ich sie“ und „in ihrer Bosheit“ sind im Grundsatz angemessen. „Schela“ ist eine etablierte deutsche Namensform für Σηλώμ; „Er“ bleibt entsprechend stehen. Die Fußnoten b und c müssen an ihren jeweiligen Textstellen bleiben; die neue Fußnote d wird unmittelbar am textkritisch unsicheren Abschnitt verankert.
  issues:
  - severity: high
    issue: Auslassung von griechischem Text zwischen dem Satz über das Nehmen der Frau und der Erzählung über Schela
    rationale: Die Quelle enthält ausdrücklich den Fragmenttext „Τὸν υἱόν μου Ἦρ“ und danach einen schwierigen Satz (V. 4 der vorgelegten Quelle). Der deutsche Entwurf übernimmt stattdessen die verkürzte englische Audit-Fassung. Das ist keine zulässige stilistische Straffung, sondern eine nicht gekennzeichnete Auslassung von Quellenmaterial.
  - severity: medium
    issue: Der schwierige Wortlaut des griechischen Abschnitts über Er ist nicht textkritisch kenntlich gemacht
    rationale: Der Satz weist in der vorgelegten Form semantische und syntaktische Schwierigkeiten auf, insbesondere bei „ἑαυτοῦ μου“ und der Schlussformulierung. Eine glatte, inhaltlich festlegende Paraphrase wäre nicht sicher; eine engere Wiedergabe mit erläuternder Fußnote bewahrt die Unsicherheit.
  - severity: low
    issue: „ließ ich mich täuschen“ schwächt die passive Form leicht ab
    rationale: ἠπατήθην lautet schlicht „ich wurde getäuscht“. Die Änderung ist klein, wahrt aber die Form des griechischen Passivs genauer.
  revised_text: 1 Ich wusste, dass das Geschlecht der Kanaaniter böse war[a]; doch der Drang der Jugend verblendete meinen Verstand. 2 Als ich sie Wein einschenken sah, wurde ich getäuscht und nahm sie[b], obwohl mein Vater dazu keinen Rat gegeben hatte[c]. 3 Meinen Sohn Er. 4 Und als er im Alter von einem Jahr gestorben war, führte ich ihn hinauf, als er hinaufstieg, weil er sich meiner selbst bewusst geworden war aus Furcht, dass ich sterben würde.[d] 5 Während ich fort war, ging sie hin und nahm für Schela eine Frau aus Kanaan. Als ich erfuhr, was sie getan hatte, verfluchte ich sie in der Qual meiner Seele. Und tatsächlich starb sie in ihrer Bosheit, zusammen mit ihren Kindern.
  revised_footnotes:
  - marker: a
    text: 'Oder: „dass die Sippe der Kanaaniter böse war“. Das griechische γένος bezeichnet Abstammung, Sippe oder Volksgruppe.'
    reason: lexical_alternative
  - marker: b
    text: '„Ich nahm sie“ hat hier wahrscheinlich den Sinn: „Ich nahm sie zur Frau“; das Griechische formuliert jedoch knapper.'
    reason: lexical_alternative
  - marker: c
    text: Die Wendung kann auch bedeuten, dass Juda ohne den Rat oder die Zustimmung seines Vaters Jakob handelte.
    reason: alternative_reading
  - marker: d
    text: Der griechische Text dieses Abschnitts ist in der vorgelegten Fassung schwer verständlich und wahrscheinlich textlich gestört. Besonders die Wortfolge „sich meiner selbst bewusst geworden“ und der Schluss „führte ich ihn hinauf, als er hinaufstieg“ erlauben keine sichere glatte Deutung. Die Übersetzung gibt den überlieferten Wortlaut deshalb möglichst eng wieder.
    reason: textual_uncertainty
  revision_rationale: Die Revision richtet sich zuerst nach dem vorgelegten griechischen Text. Sie übernimmt die gelungenen deutschen Formulierungen weitgehend, ergänzt aber die im Entwurf fehlenden griechischen Bestandteile über Er. Weil deren Wortlaut nicht sicher zu einer kohärenten Aussage geglättet werden kann, wird die syntaktische und semantische Unsicherheit nicht durch eine freie Rekonstruktion verdeckt, sondern durch eine eng am Text bleibende Übersetzung und eine verankerte Fußnote transparent gemacht. Die in der englischen Audit-Fassung abweichende Verszählung bzw. Auslassung wird nicht gegen die Primärquelle bevorzugt.
