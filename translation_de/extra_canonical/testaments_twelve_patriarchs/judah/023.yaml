    issue: „öffentlich verfügbare Frauen“ für δημοσίας
    rationale: Die deutsche Wendung legt die sexuelle Ausbeutung bereits im Haupttext vergleichsweise stark aus und ist stilistisch sperrig. „Öffentliche Frauen“ entspricht der griechischen Bezeichnung näher; die Erläuterung der wahrscheinlichen Bedeutung gehört in die Fußnote.
  - severity: low
    issue: „mit den abscheulichen Bräuchen der Völker vermischen“ für ἐπιμιγήσεσθε ἐν βδελύγμασι ἐθνῶν
    rationale: „Bräuche“ ist im griechischen Text nicht ausdrücklich vorhanden, und „sich mit Bräuchen vermischen“ ist semantisch weniger präzise. „An den Gräueln der Völker teilhaben“ gibt die Präposition und die kultisch-ethische Wertung klarer wieder, ohne die Praktiken näher festzulegen.
