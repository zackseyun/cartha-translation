base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023.yaml
  text: 'Until the coming of the God of righteousness[a], to give Jacob rest in peace, and all the nations. And he will preserve the might of my kingdom forever; for the Lord swore to me with an oath not to blot out the kingdom.


    Great indeed is my grief, my children, because of the acts of sexual immorality and sorceries that you will practice in the kingdom, following ventriloquists and omens and demons of deception. You will make your daughters musicians and prostitutes, and you will mingle in the abominations of the nations. Because of these things the Lord will bring upon you famine and pestilence, death and a sword of vengeance, siege, and the insults of enemies and friends[d][c][b]. By foreigners my kingdom will be brought to its end.'
translation:
  language: de
  text: '**Testament Judas 23**


    **1** Großer Kummer erfüllt mich, meine Kinder, wegen der Ausschweifungen und Zaubereien, die ihr im Königreich treiben werdet. Ihr werdet Bauchrednern[a], Vorzeichen und Dämonen der Täuschung folgen. **2** Eure Töchter werdet ihr zu Musikerinnen und öffentlichen Frauen[b] machen, und ihr werdet an den Gräueln der Völker teilhaben.


    **3** Dafür wird der Herr über euch Hunger und Seuche bringen, Tod und ein rächendes Schwert, Belagerung und Hunde, die euch zerreißen, die Schmähungen von Feinden, Vernichtung durch Feinde, das Absterben der Augen, die Tötung von Kleinkindern, den Raub eures Besitzes, das Niederbrennen der Heiligtümer Gottes, die Verwüstung des Landes und eure eigene Versklavung unter den Völkern.[c] **4** Sie werden eure Söhne entmannen und zu Eunuchen für ihre Frauen machen.


    **5** Dies wird so lange dauern, bis der Herr sich euer annimmt, ihr von ganzem Herzen umkehrt und nach allen seinen Geboten lebt und er euch aus der Gefangenschaft unter den Völkern zurückführt.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich „Bauchsprecher“. Gemeint sind wahrscheinlich Geistermedien oder Totenbeschwörer, nicht Unterhaltungskünstler im heutigen Sinn.
    reason: cultural_note
  - marker: b
    text: Wörtlich „Musikerinnen und öffentliche Frauen“. Die Verbindung bezeichnet wahrscheinlich Frauen, die als Unterhalterinnen öffentlich verfügbar gemacht und sexuell ausgebeutet wurden, also Prostituierte.
    reason: lexical_alternative
  - marker: c
    text: Die lange Aufzählung weist mehrere sprachlich und textlich schwierige Wendungen auf. „Vernichtung durch Feinde“ kann formal auch „Vernichtung der Feinde“ bedeuten; im Zusammenhang der über Juda kommenden Gerichte ist die erste Deutung wahrscheinlicher.
    reason: textual_uncertainty
  - marker: d
    text: 'Der griechische Satz ist syntaktisch gedrängt. Auch möglich: „bis der Herr euch heimsucht … und euch aus der Gefangenschaft zurückführt“. Das Verhältnis zwischen Gottes Eingreifen, der Umkehr und der Rückführung bleibt im Wortlaut eng, aber nicht völlig eindeutig.'
    reason: textual_uncertainty
lexical_decisions:
- source_word: ἀσελγείας
  choice: Ausschweifungen
  rationale: Das Wort bezeichnet schamlose, häufig sexuelle Zügellosigkeit. „Ausschweifungen“ wahrt den breiteren Sinn, ohne den sexuellen Zusammenhang auszublenden.
- source_word: ἐγγαστρομύθους
  choice: Bauchredner
  rationale: Die konkrete griechische Bezeichnung bedeutet wörtlich „Bauchsprecher“ und bezeichnet im antiken religiösen Zusammenhang Geistermedien; eine Fußnote erläutert dies.
- source_word: κληδόσι
  choice: Vorzeichen
  rationale: Gemeint sind Äußerungen oder Zeichen, die mantisch als Omen gedeutet werden. „Vorzeichen“ ist im Deutschen verständlich und nicht unnötig technisch.
- source_word: δαίμοσιν πλάνης
  choice: Dämonen der Täuschung
  rationale: Die Genitivverbindung bleibt erhalten und wird weder zu bloßer „Verirrung“ abgeschwächt noch auf eine bestimmte Dämonologie festgelegt.
- source_word: μουσικὰς καὶ δημοσίας
  choice: Musikerinnen und öffentlich verfügbare Frauen
  rationale: μουσικάς weist auf musikalische Unterhaltung, δημοσίας wörtlich auf „öffentliche Frauen“ und wahrscheinlich auf sexuelle Ausbeutung beziehungsweise Prostitution. Die Formulierung bewahrt das Bild und erklärt es in der Fußnote.
- source_word: ἐπιμιγήσεσθε
  choice: ihr werdet euch ... vermischen
  rationale: Die Wiedergabe erhält das Bild des Sichvermischens, ohne den Ausdruck ausschließlich als sexuelle Verbindung oder ethnische Vermischung zu bestimmen.
- source_word: ῥομφαίαν, ἐκδικοῦσαν
  choice: ein rächendes Schwert
  rationale: Das Partizip beschreibt das Schwert als vergeltend beziehungsweise rächend. Die bildhafte Gerichtssprache bleibt erhalten.
- source_word: σφακελισμὸν ὀφθαλμῶν
  choice: das Absterben der Augen
  rationale: σφακελισμός bezeichnet Absterben, Fäulnis oder brandartige Zerstörung. Die Übersetzung gibt das drastische körperliche Bild wieder, ohne eine moderne Diagnose einzutragen.
- source_word: ἐκτεμοῦσι ... εἰς εὐνούχους
  choice: entmannen und zu Eunuchen ... machen
  rationale: Der Ausdruck bezeichnet ausdrücklich die körperliche Verstümmelung. „Entmannen“ ist würdevoll, aber eindeutig.
- source_word: ἐπισκέψηται
  choice: sich euer annimmt
  rationale: Das Verb kann hier Gottes gnädiges Aufsuchen und Eingreifen bezeichnen. Die gewählte Wendung passt zur folgenden Rückführung, ohne Art und Zeitpunkt des Eingreifens näher festzulegen.
theological_decisions:
- issue: Zusammenhang von Gericht, Umkehr und göttlichem Eingreifen in Vers 5
  choice: Die Satzfolge nennt Gottes Zuwendung, die ganzherzige Umkehr und das Leben nach seinen Geboten zusammen mit der Rückführung.
  alternative: „bis der Herr euch heimsucht“ oder eine syntaktische Lesart, bei der allein die Umkehr der Gefangenschaft ein Ende setzt
  rationale: Der griechische Satz ist gedrängt und syntaktisch unsicher. Die Übersetzung macht ihn lesbar, ohne die Spannung zwischen göttlichem Handeln und menschlicher Umkehr durch ein eindeutiges dogmatisches Kausalmodell aufzulösen.
- issue: „Abscheuliche Bräuche der Völker“
  choice: Die kultisch-ethische Wertung des Ausgangstextes bleibt stehen.
  alternative: Neutralisierung als bloße „Sitten anderer Völker“ oder Eingrenzung auf eine einzelne kultische beziehungsweise sexuelle Praxis
  rationale: βδελύγματα ist starke religiös-ethische Sprache; der Kontext bestimmt jedoch nicht abschließend, welche Praktiken sämtlich gemeint sind.
- issue: Plural „Heiligtümer Gottes“
  choice: Der überlieferte Plural ναῶν wird als „Heiligtümer“ wiedergegeben.
  alternative: „der Tempel Gottes“ als Angleichung an den Jerusalemer Tempel
  rationale: Die Übersetzung folgt der vorgelegten griechischen Form und harmonisiert sie nicht stillschweigend mit einer bestimmten Tempeltheologie.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer prophetischer Gerichtssprache. Archaische oder heute irreführende Wörter werden vermieden; drastische Einzelheiten des griechischen Textes werden jedoch nicht beschönigt. Die Verszählung folgt dem vorgelegten griechischen Kapitel.
