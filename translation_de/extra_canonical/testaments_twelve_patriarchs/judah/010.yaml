  text: After these things[a], Er my son took Tamar for himself as a wife, from Mesopotamia, a daughter of Aram. But Er was wicked, and an angel of the Lord killed him. And I gave her to Onan, my second son, and behold, the Lord struck him down also. For he did not know her, through the scheming of his mother, because he did not want to have children by her. During the days of the bridal chamber I gave Onan to her in levirate marriage; yet he too, in wickedness, did not know her, though he was with her for a year. And when I threatened him, he went in to her[b], but he wasted the seed on the ground, according to the command of his mother. So he too died in wickedness. And I wanted to give Shelah also to her, but his mother did not allow it; for she acted wickedly, because Tamar was not from the daughters of Canaan[d][c], as she herself was.
translation:
  language: de
  text: 10 1 Danach[a] nahm mein Sohn Er Tamar aus Mesopotamien, eine Tochter Arams, für sich zur Frau. 2 Er aber war böse, und ein Engel des Herrn tötete ihn. 3 Er hatte sie wegen der Hinterlist seiner Mutter nicht erkannt[b], denn er wollte keine Kinder von ihr haben. 4 Während der Hochzeitstage gab ich ihr Onan in der Schwagerehe[c]. Doch auch er erkannte sie in seiner Bosheit nicht, obwohl er ein Jahr mit ihr verbrachte. 5 Als ich ihm drohte, vereinigte er sich zwar mit ihr, ließ seinen Samen aber auf die Erde fallen, wie seine Mutter es ihm befohlen hatte. So starb auch er in seiner Bosheit[d]. 6 Ich wollte ihr auch Schela geben, doch seine Mutter ließ es nicht zu. Denn sie handelte böse, weil Tamar nicht zu den Töchtern Kanaans gehörte wie sie selbst.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Andere griechische Zeugen weichen in kleineren Einzelheiten der Abfolge und Zeitangaben ab, etwa darin, ob Er am zweiten Tag oder in der dritten Nacht starb und wann Onan mit Tamar verbunden wurde.
    reason: textual_variant
  - marker: b
    text: »Erkennen« ist hier ein biblischer verhüllender Ausdruck für geschlechtliche Gemeinschaft.
    reason: lexical_alternative
  - marker: c
    text: Bei der Schwagerehe sollte der Bruder eines kinderlos verstorbenen Mannes mit dessen Witwe Nachkommen für den Verstorbenen zeugen; vergleiche 1. Mose 38.
    reason: cultural_note
  - marker: d
    text: Die wiederholten Wörter »böse« und »Bosheit« verbinden die Charakterisierung Ers, Onans Verhalten und die Verhinderung durch ihre Mutter zu einem gemeinsamen moralischen Muster.
    reason: cross_reference
lexical_decisions:
- source_word: πονηρός / ἐν πονηρίᾳ / ἐπονηρεύσατο
  choice: böse / in seiner Bosheit / handelte böse
  rationale: Bewahrt den starken moralischen Vorwurf und macht zugleich die wiederkehrende Wortfamilie im Deutschen erkennbar.
- source_word: ἄγγελος Κυρίου
  choice: ein Engel des Herrn
  rationale: Die artikellose griechische Form verlangt keine Gleichsetzung mit der bestimmten biblischen Gestalt »dem Engel des Herrn«.
- source_word: ἔγνω / οὐκ ἔγνω αὐτήν
  choice: erkannte sie / hatte sie nicht erkannt
  rationale: Erhält den biblischen Euphemismus für geschlechtliche Gemeinschaft; die Fußnote macht ihn für heutige Leser verständlich.
- source_word: πανουργία
  choice: Hinterlist
  rationale: Bezeichnet das absichtliche, manipulative Vorgehen der Mutter in natürlichem, würdigem Deutsch.
- source_word: ἔχειν τέκνα ἐξ αὐτῆς
  choice: Kinder von ihr haben
  rationale: Gibt die auf Nachkommenschaft gerichtete Aussage knapp und idiomatisch wieder.
- source_word: ἐπεγυμβρευσα αὐτῇ
  choice: gab ich ihr Onan in der Schwagerehe
  rationale: Macht den im Verb enthaltenen leviratischen Sinn verständlich und bewahrt Judas Rolle als derjenige, der Onan Tamar zuweist.
- source_word: ἐν ταῖς ἡμέραις τοῦ θαλάμου
  choice: während der Hochzeitstage
  rationale: Gibt den zeitlichen und hochzeitlichen Sinn verständlich wieder, ohne die im Deutschen missverständliche wörtliche Form »Tage des Brautgemachs« zu erzwingen.
- source_word: συνῆλθε μὲν αὐτῇ
  choice: vereinigte er sich zwar mit ihr
  rationale: Bewahrt den verhüllenden, gehobenen Ausdruck und bildet zugleich die griechische zwar–aber-Struktur ab.
- source_word: διέφθειρε δὲ τὸ σπέρμα ἐπὶ τὴν γῆν
  choice: verdarb aber den Samen auf der Erde
  rationale: Hält das konkrete Bild und die Genesis-Anspielung fest, ohne eine medizinisch engere Ausdrucksweise einzuführen.
- source_word: οὐκ ἀφῆκεν
  choice: ließ es nicht zu
  rationale: Drückt die Verhinderung durch die Mutter in natürlichem Deutsch aus.
- source_word: τῶν θυγατέρων τῶν Χαναναίων
  choice: zu den Töchtern Kanaans
  rationale: Bewahrt die familiär-ethnische und biblisch geprägte Ausdrucksweise des Griechischen.
theological_decisions:
- issue: Handelnder bei Ers Tod
  choice: Ers Tod wird einem Engel des Herrn zugeschrieben.
  alternative: Den Herrn selbst als unmittelbar Handelnden nennen.
  rationale: Der vorgelegte griechische Primärtext nennt ausdrücklich einen Engel des Herrn; diese abgestufte Handlungszuschreibung darf nicht harmonisiert werden.
- issue: Im englischen Konsultationstext vorhandene zusätzliche Onan-Passage
  choice: Die Aussage, Juda habe Tamar zunächst Onan gegeben und der Herr habe auch ihn niedergeschlagen, wird nicht in den Haupttext aufgenommen.
  alternative: Die zusätzliche Passage aus dem englischen POB übernehmen.
  rationale: Diese Sätze stehen nicht im vorgelegten griechischen α-Text. Der Haupttext folgt daher der Primärquelle; die dortige Erzählfolge geht von Ers Tod und seiner Weigerung unmittelbar zur Schwagerehe Onans über.
- issue: Bezeichnung der Schwagerehe
  choice: Der leviratische Sinn wird mit »Schwagerehe« ausdrücklich gemacht.
  alternative: Nur allgemein von Heirat oder Übergabe sprechen.
  rationale: Das griechische Verb bezeichnet hier die Verpflichtung des Bruders eines Verstorbenen gegenüber dessen Witwe; die Verdeutlichung erschließt den kulturellen Sinn, ohne eine konfessionelle Deutung einzutragen.
- issue: Bezug von αὐτός in Vers 3
  choice: 'Das Pronomen wird auf Er bezogen: »Er hatte sie ... nicht erkannt«.'
  alternative: Den Satz auf Onan beziehen oder durch eine eingeschobene Variantenhandlung umstellen.
  rationale: In der überlieferten Satzfolge ist Er das unmittelbar vorausgehende männliche Bezugswort. Die Übersetzung folgt dieser Syntax, auch wenn andere Textformen die Erzählfolge anders ausgestalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit maßvoll biblischer Färbung. Die Euphemismen des griechischen Textes bleiben erhalten und werden erklärt. Die Satzfolge folgt dem vorgelegten griechischen α-Text statt der erweiterten englischen Konsultationsfassung.
