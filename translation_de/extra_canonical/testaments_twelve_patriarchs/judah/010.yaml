  text: X. *Μετὰ δὲ ταῦτα¹ Ἦρ² ὁ υἱός μου ἄγεται τὴν Θαμὰρ ἐκ Μεσοποταμίας θυγατέρα Ἀρὰμ³ †ἑαυτῷ εἰς γυναῖκα⁴. 2. Ἦν δὲ ὁ Ἦρ⁵ πονηρός, καὶ ἐθανάτωσεν αὐτὸν ἄγγελος Κυρίου. 3. Καὶ¹⁴ αὐτὸς οὐκ ἔγνω αὐτὴν¹⁵ κατὰ πανουργίαν τῆς μητρὸς αὐτοῦ¹⁵, οὐ γὰρ ἤθελεν ἔχειν τέκνα ἐξ¹⁷ αὐτῆς. 4. *Ἐν ταῖς ἡμέραις τοῦ θαλάμου¹⁸ *ἐπεγυμβρευσα αὐτῇ¹⁹ τὸν²⁰ Αὐνάν²⁰. Καίγε οὗτος²¹ ἐν πονηρίᾳ²² οὐκ ἔγνω αὐτήν²³, ποιήσας σὺν αὐτῇ ἐνιαυτόν²². 5. Καὶ ὅτε³³ ἠπείλησα αὐτῷ³⁴, συνῆλθε μὲν³⁵ αὐτῇ, *διέφθειρε δὲ τὸ σπέρμα³⁶ ἐπὶ³⁷ τῆν γῆν³⁸, κατὰ τὴν ἐντολὴν τῆς μητρὸς αὐτοῦ³⁹. καίγε οὗτος⁴⁰ ἀπέθανεν⁴¹ ἐν πονηρίᾳ⁴². 6. Ἤθελον δὲ *καὶ τὸν Σηλὼμ δοῦναι αὐτῇ⁴³, ἀλλ᾽ ἡ *μήτηρ αὐτοῦ⁴⁴ οὐκ ἀφῆκεν⁴⁵. Ἐπονηρεύσατο γὰρ⁴⁶, ὅτι⁴⁷ οὐκ ἦν ἐκ †τῶν θυγατέρων τῶν Χαναναίων ὡς καὶ αὐτή⁵⁰.
