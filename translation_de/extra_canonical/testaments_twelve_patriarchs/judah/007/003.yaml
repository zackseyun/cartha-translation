revisions:
- from: In tiefer Nacht kamen meine Brüder zu uns. Wir öffneten ihnen die Tore, vernichteten sie alle[a] und plünderten.
  to: Als meine Brüder in tiefer Nacht zu uns kamen, öffneten wir ihnen die Tore, vernichteten sie alle und machten Beute.
  rationale: Die Revision entfernt die irreführende Fußnote und ersetzt das im Deutschen unidiomatische objektlose „plünderten“ durch „machten Beute“. Sie bewahrt die Aussage und die syntaktisch erkennbare Referenz der griechischen Vorlage. Die zusätzlichen Aussagen des englischen POB-Audit-Texts werden bewusst nicht aufgenommen, weil sie in der bereitgestellten griechischen α-Fassung nicht stehen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:13:25Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Haupttext folgt der vorgelegten griechischen α-Fassung grundsätzlich korrekt: Er enthält weder den im englischen Audit-Text ergänzten Besitz noch die drei Mauern. Die Fußnote ist jedoch nicht quellentreu, weil αὐτούς im unmittelbaren syntaktischen Zusammenhang auf οἱ ἀδελφοί μου zurückweist; ein anderer Bezug wird im Satz nicht nahegelegt. Das objektlose ἐπρονομεύσαμεν lässt sich im Deutschen natürlicher durch „machten Beute“ wiedergeben.'
  naturalness: „In tiefer Nacht“ und die knappe erzählerische Satzfolge sind modernes, natürliches Standarddeutsch. „... und plünderten“ ohne Objekt wirkt im Deutschen allerdings unvollständig; „machten Beute“ ist idiomatisch und bewahrt, dass das griechische Verb hier kein ausgedrücktes Objekt hat.
  terminology: „vernichteten sie alle“ gibt πάντας αὐτούς ἐξωλοθρεύσαμεν angemessen wieder. „Meine Brüder“ ist für οἱ ἀδελφοί μου beizubehalten, auch wenn der geschilderte Vorgang hart ist. Die englischen Zusätze „all that was theirs“ und „their three walls“ dürfen nicht übernommen werden, da sie in der vorgelegten griechischen Quelle fehlen.
  issues:
  - severity: medium
    issue: Die Fußnote behauptet eine im Satz nicht ausdrücklich entscheidbare Referenz von αὐτούς.
    rationale: Syntaktisch ist οἱ ἀδελφοί μου der explizite und unmittelbare personale Bezug für αὐτοῖς und αὐτούς. Die Anmerkung erzeugt daher eine textlich nicht gebotene Mehrdeutigkeit und widerspricht zudem der normalen Lesung des deutschen Pronomens „sie“.
  - severity: low
    issue: „und plünderten“ bleibt im Deutschen ohne Objekt stilistisch offen.
    rationale: Das griechische ἐπρονομεύσαμεν steht zwar ohne ausgedrücktes Objekt, doch „machten Beute“ ist im Deutschen eine natürliche objektlose Wiedergabe und ergänzt keinen nicht vorhandenen Besitzgegenstand.
  revised_text: Als meine Brüder in tiefer Nacht zu uns kamen, öffneten wir ihnen die Tore, vernichteten sie alle und machten Beute.
