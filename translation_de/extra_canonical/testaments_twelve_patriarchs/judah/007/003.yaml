  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/007/003.yaml
  text: And in the deep night, when our brothers came, we opened the gates to them, and we destroyed all of them and all that was theirs; and after plundering all that was theirs, we tore down their three walls.
translation:
  language: de
  text: Als meine Brüder in tiefer Nacht zu uns kamen, öffneten wir ihnen die Tore, vernichteten sie alle und machten Beute.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Νυκτὸς δὲ βαθείας
  choice: In tiefer Nacht
  rationale: Gibt die bildhafte griechische Wendung wörtlich und zugleich in würdigem, verständlichem Deutsch wieder.
- source_word: ἤλθον πρὸς ἡμᾶς οἱ ἀδελφοί μου
  choice: kamen meine Brüder zu uns
  rationale: Bewahrt den Wechsel zwischen dem Singular des Erzählers („meine“) und der Gruppe, zu der er gehört („uns“).
- source_word: ἀνοίξαντες τὰς πύλας αὐτοῖς
  choice: Wir öffneten ihnen die Tore
  rationale: Das Partizip wird als beigeordneter Hauptsatz natürlich wiedergegeben; αὐτοῖς bezeichnet diejenigen, denen die Tore geöffnet wurden.
- source_word: πάντας αὐτοὺς ἐξωλοθρεύσαμεν
  choice: vernichteten sie alle
  rationale: ἐξολοθρεύω bezeichnet vollständiges Vernichten; die pronominale Referenz bleibt wie im Griechischen unausgesprochen und mehrdeutig.
- source_word: ἐπρονομεύσαμεν
  choice: und plünderten
  rationale: Das Verb bedeutet „plündern/Beute machen“. Da der vorgelegte griechische Text kein ausdrückliches Objekt und keinen Satz über drei Mauern enthält, wird nichts ergänzt.
theological_decisions:
- issue: Bezug von αὐτούς in „πάντας αὐτούς“
  choice: Das Pronomen wird als „sie“ beibehalten und durch eine Fußnote als im unmittelbaren Wortlaut mehrdeutig gekennzeichnet.
  alternative: Den Bezug ausdrücklich als die Bewohner oder Feinde bestimmen.
  rationale: Der griechische Satz nennt das Bezugswort nicht ausdrücklich. Eine Konkretisierung würde die textliche Spannung eigenmächtig auflösen.
translation_notes:
  register: Modernes Standarddeutsch in knapper, erzählerischer und würdiger Form. Die Übersetzung folgt ausschließlich dem vorgelegten griechischen Text. Die im englischen Konsultationstext stehenden Ergänzungen „und all das Ihre“ sowie der Abbruch ihrer drei Mauern fehlen in dieser griechischen Vorlage und wurden daher nicht in den Haupttext aufgenommen.
