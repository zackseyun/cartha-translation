lexical_decisions:
- source_word: ἐπροσεγγίσαμεν
  choice: wir näherten uns
  rationale: Gibt den aoristischen Bewegungsvorgang natürlich und nah am griechischen Wortlaut wieder.
- source_word: Θάμνῃ
  choice: Thamna
  rationale: Bewahrt die in der Vorlage bezeugte Namensform.
- source_word: πᾶσα ἡ ἀποσκευή
  choice: der gesamte Tross
  rationale: ἀποσκευή bezeichnet hier das mitgeführte Gepäck beziehungsweise die Ausrüstung eines Heeres; „Tross“ ist im militärischen Zusammenhang prägnant und idiomatisch.
- source_word: τῶν πολεμίων βασιλέων
  choice: der feindlichen Könige
  rationale: Gibt sowohl πολεμίων als auch βασιλέων ausdrücklich wieder; anders als die englische Konsultationsfassung lässt der griechische Text die Könige nicht nur durch ein Pronomen anklingen.
