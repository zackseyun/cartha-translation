  source_fidelity: 'Die Übersetzung gibt alle wesentlichen Elemente des griechischen Textes wieder: den Bewegungsabschluss („wir näherten uns“), den Ortsnamen Θάμνῃ als „Thamna“, den Relativbezug auf den Ort sowie πᾶσα ἡ ἀποσκευή τῶν πολεμίων βασιλέων als vollständigen Besitz-/Ausrüstungskomplex der feindlichen Könige. Anders als die englische Audit-Fassung wird die im Griechischen explizite Bezeichnung „feindliche Könige“ korrekt bewahrt.'
