  source_fidelity: Die Handlungskette und die räumliche Bewegung sind zutreffend wiedergegeben. »verhöhnten« ist für ὑβριζόμενος jedoch zu eng, da das griechische Wort allgemein beleidigt bzw. schmählich behandelt werden meint. Die Partizipialkonstruktion sollte außerdem nicht ausdrücklich als Kausalsatz festgelegt werden. Der imperfektische, andauernde Charakter der Gegenwehr lässt sich im Deutschen mit »weiterhin« natürlich ausdrücken.
  naturalness: Die revidierte Fassung ist modernes, flüssiges Standarddeutsch. »Den Gipfel hinauf« bleibt eine natürliche Wiedergabe der Aufwärtsbewegung, ohne die genaue topographische Nuance weiter einzuengen.
  terminology: »beleidigt« trifft den Grundwert von ὑβρίζω angemessener als »verhöhnt«. »mit Steinen bewarfen« und »mit Pfeilen auf mich schossen« geben die beiden Angriffe klar und ohne unnötige Spezifizierung der Waffentechnik wieder.
