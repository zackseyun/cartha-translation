  register: Modernes Standarddeutsch mit erzählerisch-dramatischem, aber nicht überhöhtem Ton. Die griechischen Imperfektformen der Gegenhandlung werden im Deutschen schlicht koordiniert wiedergegeben; der fortdauernde beziehungsweise wiederholte Charakter ergibt sich aus der Szene.
