base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/007/005.yaml
  text: Then, being insulted by them, I became angry, and I rushed against them up to the summit. And they kept pelting me with stones and shooting arrows at me.
translation:
  language: de
  text: Da wurde ich, von ihnen beleidigt, zornig und stürmte gegen sie den Gipfel hinauf. Sie aber bewarfen mich weiterhin mit Steinen und schossen mit Pfeilen auf mich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑβριζόμενος
  choice: weil sie mich verhöhnten
  rationale: Das Partizip bezeichnet eine entehrende oder beleidigende Behandlung; die kausale Wiedergabe ist im Deutschen natürlich und erhält den Zusammenhang mit Judas Zorn.
- source_word: ὠργίσθην
  choice: wurde ich zornig
  rationale: Gibt das Einsetzen des Zorns präzise und in würdigem, modernem Deutsch wieder.
- source_word: ὥρμησα ἐπ᾽ αὐτοὺς
  choice: stürmte gegen sie
  rationale: ὁρμάω bezeichnet einen heftigen, entschlossenen Vorstoß; »gegen sie« bewahrt die feindliche Ausrichtung.
- source_word: ἐπὶ τὴν κορυφήν
  choice: den Gipfel hinauf
  rationale: Im Kontext des Vorstoßes bezeichnet die Wendung die Bewegung bis zur beziehungsweise auf die Höhe; »hinauf« macht die räumliche Richtung natürlich deutlich, ohne mehr festzulegen als der Kontext erlaubt.
- source_word: ἐσφενδόνιζον με ἐν λίθοις
  choice: bewarfen mich mit Steinen
  rationale: Die Form beschreibt hier wiederholtes Schleudern beziehungsweise Werfen von Steinen auf Juda; die deutsche Formulierung ist idiomatisch und lässt offen, ob Schleudern als Waffen verwendet wurden.
- source_word: τοξεύοντες
  choice: schossen mit Pfeilen auf mich
  rationale: Das Verb bezeichnet das Schießen mit dem Bogen; im Deutschen benennt »mit Pfeilen schießen« die Handlung klar und natürlich.
