- source_word: πορευθέντες πρὸς Ἀμορραίους
  choice: gingen zu den Amoritern
  rationale: Gibt die Bewegung zu den Amoritern natürlich und quellennah wieder.
- source_word: προσποιησάμενοι αὐτοῖς συμμάχους
  choice: gaben uns ihnen gegenüber als Verbündete aus
  rationale: Bewahrt den Sinn einer vorgetäuschten Verbündetenrolle; αὐτοῖς bezieht sich auf die Amoriter und macht sie nicht zum Gegenstand der Verstellung.
- source_word: εἰσήλθομεν εἰς τὴν πόλιν αὐτῶν
  choice: gelangten so in ihre Stadt
  rationale: Gibt den Eintritt in die Stadt wieder; „so“ macht den im Partizipialgefüge angelegten Zusammenhang idiomatisch sichtbar.
