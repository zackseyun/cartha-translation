    issue: „große Menschenmenge“ für ἐν λαῷ πολλῷ
    rationale: Die Formulierung ist im Kontext eines heranziehenden Königs unnatürlich und kann eine bloße Menge von Zivilpersonen nahelegen. „große Schar“ bleibt allgemein und ist im modernen erzählerischen Deutsch flüssiger.
