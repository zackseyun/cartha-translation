  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/007/001.yaml
  text: And on the next day it was reported to us that the king of the city of Gaas was coming against us with a great multitude.
translation:
  language: de
  text: Am folgenden Tag wurde uns gemeldet, dass der König der Stadt Gaas mit einer großen Schar auf uns zukomme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ἑξῆς
  choice: Am folgenden Tag
  rationale: Die substantivierte Wendung bezeichnet im Erzählzusammenhang den folgenden Tag; „Tag“ ist im Griechischen ausgelassen, im Deutschen aber für eine natürliche Wiedergabe erforderlich.
- source_word: ἐρρέθη πρὸς ἡμᾶς
  choice: wurde uns gemeldet
  rationale: Das wörtliche „wurde zu uns gesagt“ bezeichnet hier das Überbringen einer Nachricht; „gemeldet“ gibt diese Funktion idiomatisch wieder.
- source_word: ἐν λαῷ πολλῷ
  choice: mit einer großen Menschenmenge
  rationale: Die Formulierung bewahrt den allgemeinen Sinn von λαός und vermeidet die unbelegte Präzisierung als „Heer“ oder „Kriegsvolk“.
- source_word: ἔρχεται πρὸς ἡμᾶς
  choice: auf uns zukomme
  rationale: Der griechische Präsens wird in der indirekten Rede durch den Konjunktiv Präsens wiedergegeben. „Auf uns zukommen“ erhält den gerichteten Sinn von πρός, ohne die mögliche feindliche Absicht ausdrücklich festzulegen.
