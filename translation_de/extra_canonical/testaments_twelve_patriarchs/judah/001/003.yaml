  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/001/003.yaml
  text: “Hear, my children, Judah your father. I was born the fourth son to my father Jacob, and Leah my mother named me Judah, saying, ‘I give praise to the Lord, because he has given me also a fourth son.’
translation:
  language: de
  text: '„Hört mich an, meine Kinder, mich, Juda, euren Vater. Ich war für meinen Vater Jakob der vierte Sohn. Lea, meine Mutter, gab mir den Namen Juda[a] und sagte: ‚Ich preise den Herrn, denn er hat mir auch einen vierten Sohn gegeben.‘“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Juda klingt im Hebräischen an ein Verb für „preisen“ oder „danken“ an.
    reason: Die unmittelbar folgende Aussage erklärt den Namen durch ein im Deutschen sonst nicht erkennbares Wortspiel.
lexical_decisions:
- source_word: Ἀκούσατε … Ἰούδα τοῦ πατρὸς ὑμῶν
  choice: Hört … auf Juda, euren Vater
  rationale: Die Aufforderung wird im Deutschen idiomatisch mit „auf jemanden hören“ wiedergegeben; Juda bezeichnet sich dabei als Vater seiner angesprochenen Kinder.
- source_word: τέταρτος υἱὸς ἐγενόμην τῷ πατρί μου Ἰακώβ
  choice: Ich wurde meinem Vater Jakob als vierter Sohn geboren
  rationale: „Geboren werden“ gibt den gemeinten familiären Zusammenhang natürlicher und genauer wieder als das wörtliche „werden“.
- source_word: ἐπωνόμασέν με Ἰούδαν
  choice: gab mir den Namen Juda
  rationale: Diese deutsche Wendung gibt die Namensgebung klar und natürlich wieder.
- source_word: Ἀνθομολογοῦμαι τῷ Κυρίῳ
  choice: Ich preise den Herrn
  rationale: Das Verb bezeichnet ein anerkennendes, dankbares Preisen; „preise“ bewahrt sowohl Lob als auch Dank, ohne die Aussage unnötig einzuengen.
theological_decisions:
- issue: Bezeichnung Gottes mit Κύριος
  choice: der Herr
  alternative: der HERR
  rationale: Der griechische Text bietet Κύριος ohne ausdrückliche Kennzeichnung als Wiedergabe des Gottesnamens; „der Herr“ bleibt daher quellennah und vermeidet eine nicht im griechischen Text markierte Festlegung.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem erzählerischem Ton. Die syntaktisch auffällige griechische Formulierung um Lea wird gemäß dem klaren Zusammenhang als Aussage über die Namensgebung wiedergegeben; die beschädigt oder fehlerhaft überlieferte Form ἤμην wird nicht künstlich in den deutschen Haupttext übernommen.
