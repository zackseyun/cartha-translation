revisions:
- from: '„Hört, meine Kinder, auf Juda, euren Vater. Ich wurde meinem Vater Jakob als vierter Sohn geboren. Lea, meine Mutter, gab mir den Namen Juda[a] und sagte: ‚Ich preise den Herrn, denn er hat mir auch einen vierten Sohn gegeben.‘“'
  to: '„Hört mich an, meine Kinder, mich, Juda, euren Vater. Ich war für meinen Vater Jakob der vierte Sohn. Lea, meine Mutter, gab mir den Namen Juda[a] und sagte: ‚Ich preise den Herrn, denn er hat mir auch einen vierten Sohn gegeben.‘“'
  rationale: Die erste Anrede wird so korrigiert, dass sie die direkte Anrede Judas als Sprecher wiedergibt, ohne die stärkere und hier nicht ausdrücklich ausgedrückte Bedeutung des Gehorsams einzutragen. Die Aussage über Judas Geburtsrang wird idiomatischer formuliert. Namenswortspiel, Gottesbezeichnung und die behutsame Behandlung der textlich auffälligen Lea-Klausel bleiben erhalten.
  reviewer_model: gpt-5.6-terra
