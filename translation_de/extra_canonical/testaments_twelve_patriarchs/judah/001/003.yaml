review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung trifft die Abfolge und den Sinn des griechischen Textes insgesamt gut: Juda spricht seine Kinder an, nennt seine Stellung als vierter Sohn Jakobs, berichtet die Namensgebung durch Lea und führt ihre Begründung an. Die Formulierung „auf Juda hören“ verschiebt jedoch die direkte, wenn auch elliptische Anrede Ἀκούσατε … Ἰούδα τοῦ πατρὸς ὑμῶν in die spezifischere Bedeutung „Juda gehorchen“. „Hört mich an“ gibt die im Kontext eindeutige Selbstbezeichnung Judas idiomatisch wieder. Die offenbar gestörte Überlieferung bei Lea wird mit der kontextuell gesicherten Aussage über die Namensgebung angemessen behandelt.'
  naturalness: „Ich wurde meinem Vater Jakob als vierter Sohn geboren“ ist verständlich, aber markiert und unnötig passiv. „Ich war für meinen Vater Jakob der vierte Sohn“ ist modernes, natürliches Deutsch und wahrt die Aussage. Die korrigierte Anrede ist ebenfalls deutlich natürlicher.
  terminology: „Juda“, „Lea“, „Jakob“ und „der Herr“ sind passend. „Ich preise den Herrn“ ist eine tragfähige Wiedergabe von Ἀνθομολογοῦμαι τῷ Κυρίῳ. Die Fußnote zum hebräischen Namenswortspiel ist sachlich und sinnvoll verankert.
  issues:
  - severity: medium
    issue: „auf Juda, euren Vater“
    rationale: Die Konstruktion „auf jemanden hören“ bedeutet im heutigen Deutsch regelmäßig „jemandem gehorchen“. Das griechische Ἀκούσατε mit Ἰούδαν ist hier eine elliptische Aufforderung, Juda selbst anzuhören; die zusätzliche Gehorsamsnuance sollte nicht eingeführt werden.
  - severity: low
    issue: „wurde meinem Vater Jakob als vierter Sohn geboren“
    rationale: Die Formulierung ist zwar verständlich, aber im modernen Standarddeutsch unnötig schwerfällig. Eine idiomatischere Formulierung kann die Aussage ohne Sinnverlust wiedergeben.
  revised_text: '„Hört mich an, meine Kinder, mich, Juda, euren Vater. Ich war für meinen Vater Jakob der vierte Sohn. Lea, meine Mutter, gab mir den Namen Juda[a] und sagte: ‚Ich preise den Herrn, denn er hat mir auch einen vierten Sohn gegeben.‘“'
