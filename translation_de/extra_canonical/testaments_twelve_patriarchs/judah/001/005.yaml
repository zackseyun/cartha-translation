  text: Und ich ehrte meine Mutter und die Schwester meiner Mutter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐτίμων
  choice: ehrte
  rationale: Das Imperfekt von τιμάω bezeichnet hier fortdauerndes oder wiederholtes Ehren; das schlichte Präteritum ist im deutschen Erzählstil natürlich und bewahrt den Sinn.
- source_word: τὴν ἀδελφὴν τῆς μητρός μου
  choice: die Schwester meiner Mutter
  rationale: Die Genitivverbindung wird wörtlich und eindeutig wiedergegeben; das natürliche deutsche Verwandtschaftswort „Tante“ wäre weniger formal und würde die ausdrückliche Wiederholung von „Mutter“ beseitigen.
