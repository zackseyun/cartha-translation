  text: And when I had grown up, my father prayed for me, saying, ‘You shall be a king, prospering in all things.’
translation:
  language: de
  text: 'Und als ich erwachsen geworden war, betete mein Vater für mich und sagte: »Du wirst ein König sein und in allem Gelingen haben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡδρύνθην
  choice: ich erwachsen geworden war
  rationale: Das Verb bezeichnet hier das Heranwachsen beziehungsweise Erlangen der Reife; die natürliche deutsche Wendung gibt den zeitlichen Zusammenhang klar wieder.
- source_word: ηὔξατό μοι
  choice: betete mein Vater für mich
  rationale: Die Form wird im Sinn eines für jemanden gesprochenen Gebets verstanden. Dies wahrt den Unterschied zu einem ausdrücklichen Verb für »segnen«.
- source_word: Βασιλεὺς ἔσῃ
  choice: Du wirst ein König sein
  rationale: Gibt die prädikative Aussage und den futurischen Sinn unmittelbar wieder.
- source_word: κατευοδούμενος ἐν πᾶσιν
  choice: und in allem Gelingen haben
  rationale: Das Partizip bezeichnet erfolgreiches Vorankommen oder Gedeihen. Die Formulierung ist idiomatisches modernes Deutsch und lässt den umfassenden Bezug von ἐν πᾶσιν bestehen.
theological_decisions:
- issue: Gebet oder Segen des Vaters
  choice: betete ... für mich
  alternative: segnete mich
  rationale: ηὔξατό μοι bezeichnet am ehesten ein Gebet beziehungsweise einen Wunsch zugunsten Judas; »segnete« würde eine stärker festgelegte kultisch-theologische Deutung eintragen.
- issue: Art der königlichen Aussage
  choice: Du wirst ein König sein
  alternative: Du sollst König sein
  rationale: Das griechische Futur ἔσῃ wird als Voraussage wiedergegeben, ohne es als Gebot oder bloßen Wunsch umzudeuten.
