translation:
  language: de
  text: 'Das Testament Judas, des vierten Sohnes Jakobs und Leas.


    1. Abschrift der Worte Judas, die er zu seinen Söhnen sprach, bevor er starb.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: Testament
  rationale: Als Werktitel und Gattungsbezeichnung bezeichnet das Wort hier die letztwillige Rede; „Testament“ ist im Deutschen natürlich und traditionsgemäß.
- source_word: Ἀντίγραφον
  choice: Abschrift
  rationale: Gibt die konkrete Bedeutung „Kopie/Abschrift“ wieder, ohne den Ausdruck zu einer bloßen Inhaltsüberschrift abzuschwächen.
- source_word: λόγων
  choice: Worte
  rationale: Entspricht dem Plural und bezeichnet hier die nachfolgend überlieferte Rede.
- source_word: ἐλάλησε
  choice: sprach
  rationale: Eine schlichte, würdige Wiedergabe des Verbs im erzählenden Kontext.
- source_word: πρὸ τοῦ ἀποθανεῖν αὐτόν
  choice: bevor er starb
  rationale: Natürliches modernes Deutsch, das das zeitliche Verhältnis des griechischen Ausdrucks genau wiedergibt.
