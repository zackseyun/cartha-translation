lexical_decisions:
- source_word: ὀξύς
  choice: tatkräftig
  rationale: Das Wort bezeichnet hier wahrscheinlich eine ausgeprägte jugendliche Energie, Entschlossenheit oder Einsatzbereitschaft. „Tatkräftig“ gibt dies im Deutschen natürlich wieder, ohne die im Kontext unpassende wörtliche Grundbedeutung „scharf“ zu übernehmen.
- source_word: ὑπήκουον
  choice: gehorchte
  rationale: Das Imperfekt beschreibt ein fortdauerndes beziehungsweise wiederholtes Verhalten in der Jugend; „gehorchte“ bewahrt die klare Bedeutung des Verbs.
- source_word: κατὰ πάντα λόγον
  choice: in allem, was er sagte
  rationale: Die Wendung bedeutet wörtlich etwa „nach jedem Wort“. Die gewählte Formulierung ist natürliches Deutsch und hält den Bezug auf die Weisungen des Vaters fest.
