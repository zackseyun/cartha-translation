    issue: Der letzte Begründungssatz bezieht beide deutschen „sie“-Formen auf Schelas Mutter.
    rationale: Damit lautet der Sinn, sie sei nicht von den Töchtern Kanaans gewesen, wie sie selbst es gewesen sei. Der griechische Kontext kontrastiert vielmehr Tamar (nicht kanaanäischer Herkunft) mit Schelas Mutter (selbst kanaanäischer Herkunft).
  - severity: medium
    issue: „ließ den Samen auf die Erde verderben“ schwächt διέφθειρε ab.
    rationale: Das griechische Verb beschreibt das aktive Verderben bzw. Verschütten des Samens auf die Erde, nicht ein bloßes Zulassen eines Verderbens.
