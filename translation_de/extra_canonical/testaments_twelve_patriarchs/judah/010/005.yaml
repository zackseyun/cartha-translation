revisions:
- from: Und als ich ihm drohte, ging er zu ihr ein; doch er ließ den Samen auf die Erde verderben, wie seine Mutter es ihm befohlen hatte. So starb auch er in Bosheit. Ich wollte ihr auch Schela geben, aber seine Mutter ließ es nicht zu; denn sie handelte boshaft, weil sie nicht von den Töchtern Kanaans war wie sie selbst.
  to: Und als ich ihm drohte, ging er zu ihr ein; doch er verschüttete seinen Samen auf die Erde, nach dem Befehl seiner Mutter. So starb auch er in Bosheit. Ich wollte ihr auch Schela geben, aber seine Mutter ließ es nicht zu; denn sie handelte boshaft, weil Tamar nicht von den Töchtern Kanaans war, wie sie selbst.
  rationale: 'Die Revision stellt die aktive Bedeutung von διέφθειρε wieder her und löst die abschließende, im Deutschen ansonsten widersprüchliche Pronominalreferenz im Sinn des unmittelbaren griechischen Kontexts auf: „sie selbst“ bezeichnet Schelas Mutter, während die nicht kanaanäische Frau Tamar ist. Es werden weder eine Todesursache noch weitergehende theologische Folgerungen ergänzt. Im vorgelegten Text sind keine Fußnotenanker vorhanden, daher sind keine Fußnoten erforderlich.'
