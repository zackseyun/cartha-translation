base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/005.yaml
  text: And when I threatened him, he went in to her, but he wasted the seed on the ground, according to the command of his mother. So he too died in wickedness. And I wanted to give Shelah also to her, but his mother did not allow it; for she acted wickedly, because she was not from the daughters of Canaan, as she herself was.
translation:
  language: de
  text: Und als ich ihm drohte, ging er zu ihr ein; doch er verschüttete seinen Samen auf die Erde, nach dem Befehl seiner Mutter. So starb auch er in Bosheit. Ich wollte ihr auch Schela geben, aber seine Mutter ließ es nicht zu; denn sie handelte boshaft, weil Tamar nicht von den Töchtern Kanaans war, wie sie selbst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνῆλθε ... αὐτῇ
  choice: ging er zu ihr ein
  rationale: Gibt den ehelich-sexuellen Sinn der griechischen Wendung in einer würdigen, bibelnahen Form wieder, ohne ihn abzuschwächen.
- source_word: διέφθειρε ... τὸ σπέρμα ἐπὶ τὴν γῆν
  choice: ließ den Samen auf die Erde verderben
  rationale: Bewahrt das ungewöhnliche und wertende Verb διαφθείρω möglichst eng; eine explizitere physiologische Auslegung würde den Wortlaut stärker festlegen.
- source_word: κατὰ τὴν ἐντολὴν τῆς μητρὸς αὐτοῦ
  choice: wie seine Mutter es ihm befohlen hatte
  rationale: Natürliches Deutsch für das Handeln gemäß dem Gebot beziehungsweise Auftrag seiner Mutter.
- source_word: ἐν πονηρίᾳ
  choice: in Bosheit
  rationale: Erhält die moralische Wertung des griechischen Ausdrucks knapp und deutlich.
- source_word: οὐκ ἀφῆκεν
  choice: ließ es nicht zu
  rationale: Entspricht im Kontext dem Verhindern der beabsichtigten Eheschließung.
- source_word: ἐκ τῶν θυγατέρων τῶν Χαναναίων
  choice: von den Töchtern Kanaans
  rationale: Bewahrt die antike Herkunftsbezeichnung und ihren kollektiven Charakter.
theological_decisions:
- issue: Art und Ursache des Todes
  choice: „So starb auch er in Bosheit“
  alternative: „Darum starb auch er wegen seiner Bosheit“
  rationale: καίγε und ἐν πονηρίᾳ bezeichnen sicher die ebenfalls böse Verfassung beziehungsweise Lebensweise, formulieren aber nicht ausdrücklich eine kausale Straflehre; daher wird keine eindeutige Ursache ergänzt.
- issue: Bezug des letzten αὐτή
  choice: „wie sie selbst“ mit Bezug auf Schelas Mutter
  alternative: „wie Tamar selbst“
  rationale: Das nächste grammatische Bezugswort ist die handelnde Mutter; die Übersetzung wahrt diesen Bezug und vermeidet die unbelegte Einfügung des Namens Tamar.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, bibelnahem Ton. Die altertümlich wirkende Wendung „zu ihr eingehen“ bleibt wegen ihrer präzisen sexuellen Bedeutung erhalten; sonst ist der Satzbau behutsam geglättet. Die Verse 10:5–6 werden entsprechend dem gelieferten Quellenausschnitt gemeinsam wiedergegeben.
