review_pass:
  verdict: revise
  source_fidelity: Der Satz gibt οὐκ ἔγνω αὐτήν treffend mit dem biblischen Euphemismus „erkannte sie nicht“ wieder und bewahrt die Aussage, dass er keine Kinder von ihr haben wollte. Für κατὰ πανουργίαν τῆς μητρὸς αὐτοῦ ist „durch die List seiner Mutter“ näher an der instrumentalen bzw. verursachenden Verbindung des Griechischen als „infolge der List“ und entspricht auch der englischen Audit-Fassung („by the scheming“).
  naturalness: „Und er erkannte sie nicht“ ist im bewusst biblisch-würdigen Register verständlich. „Durch die List seiner Mutter“ ist idiomatisches modernes Standarddeutsch; die Gedankenstriche sind nicht nötig und unterbrechen den Satzfluss.
  terminology: „erkennen“ als sexueller Euphemismus ist angemessen beibehalten. „List“ gibt πανουργία neutral genug als verschlagenes Handeln wieder, ohne die nicht näher erläuterte Einflussnahme der Mutter auszudeuten. „Kinder von ihr haben“ bildet ἐξ αὐτῆς etwas genauer ab als „Kinder mit ihr haben“.
  issues:
  - severity: low
    issue: Die kausale Wendung „infolge der List“ ist gegenüber κατὰ ... etwas weniger unmittelbar.
    rationale: „Durch die List seiner Mutter“ gibt die griechische Verbindung sowie die englische Kontrollübersetzung präziser wieder, ohne die Art der List zu ergänzen.
  - severity: low
    issue: „Kinder mit ihr haben“ ist leicht freier als ἔχειν τέκνα ἐξ αὐτῆς.
    rationale: „Kinder von ihr haben“ bewahrt die im Griechischen markierte Herkunftsbeziehung, bleibt aber natürliches Deutsch.
  revised_text: Und er erkannte sie nicht durch die List seiner Mutter, denn er wollte keine Kinder von ihr haben.
