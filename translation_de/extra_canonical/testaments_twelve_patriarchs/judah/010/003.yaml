  text: Καὶ¹⁴ αὐτὸς οὐκ ἔγνω αὐτὴν¹⁵ κατὰ πανουργίαν τῆς μητρὸς αὐτοῦ¹⁵, οὐ γὰρ ἤθελεν ἔχειν τέκνα ἐξ¹⁷ αὐτῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/003.yaml
  text: And he did not know her, by the scheming of his mother, for he did not want to have children by her.
translation:
  language: de
  text: Und er erkannte sie nicht durch die List seiner Mutter, denn er wollte keine Kinder von ihr haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἔγνω αὐτήν
  choice: er erkannte sie nicht
  rationale: Bewahrt den biblisch geprägten Euphemismus für Geschlechtsverkehr und folgt der griechischen Formulierung eng.
- source_word: κατὰ πανουργίαν
  choice: infolge der List
  rationale: πανουργία bezeichnet hier ein listiges beziehungsweise verschlagenes Vorgehen; „infolge“ gibt den Zusammenhang natürlich wieder, ohne die genaue Art der Einflussnahme näher festzulegen.
- source_word: τῆς μητρὸς αὐτοῦ
  choice: seiner Mutter
  rationale: Eindeutige Wiedergabe des Genitivattributs.
- source_word: ἔχειν τέκνα ἐξ αὐτῆς
  choice: Kinder mit ihr haben
  rationale: Natürliches modernes Deutsch für das griechische „Kinder aus/von ihr haben“, ohne den Sinn unnötig zu erweitern.
theological_decisions:
- issue: Bedeutung von „erkennen“
  choice: Der sexuelle Euphemismus bleibt als „erkannte sie nicht“ erhalten.
  alternative: „Er hatte keinen Verkehr mit ihr“
  rationale: Die formale Nähe bewahrt den biblischen Sprachklang und die indirekte Ausdrucksweise des Ausgangstextes; der Kontext erschließt die Bedeutung.
- issue: Zuschreibung der List
  choice: Die List wird entsprechend dem griechischen Text seiner Mutter zugeschrieben.
  alternative: Die Formulierung als seine eigene List oder als gemeinsame Absprache verstehen
  rationale: Der Genitiv τῆς μητρὸς αὐτοῦ ist grammatisch eindeutig und soll nicht umgedeutet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenem biblischem Euphemismus. Gedankenstriche grenzen die eingeschobene Ursachenangabe ab und vermeiden eine falsche unmittelbare Verknüpfung von „erkannte“ und „infolge“.
