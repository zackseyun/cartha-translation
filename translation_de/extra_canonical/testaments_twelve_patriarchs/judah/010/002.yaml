source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἦν δὲ ὁ Ἦρ⁵ πονηρός, καὶ ἐθανάτωσεν αὐτὸν ἄγγελος Κυρίου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/002.yaml
  text: But Er was wicked, and an angel of the Lord killed him.
translation:
  language: de
  text: Er aber war böse, und ein Engel des Herrn tötete ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πονηρός
  choice: böse
  rationale: Gibt das moralische Urteil des griechischen Ausdrucks knapp und natürlich wieder, ohne es näher auszudeuten.
- source_word: ἄγγελος Κυρίου
  choice: ein Engel des Herrn
  rationale: Bewahrt den unbestimmten griechischen Ausdruck und die traditionelle, allgemein verständliche Gottesbezeichnung.
- source_word: ἐθανάτωσεν
  choice: tötete
  rationale: Entspricht der direkten kausativen Aussage des griechischen Verbs, ohne sie abzuschwächen oder auszuschmücken.
theological_decisions:
- issue: Handelnder bei Ers Tod
  choice: Ein Engel des Herrn tötete ihn.
  alternative: Der Herr tötete ihn durch einen Engel.
  rationale: Der griechische Text nennt ausdrücklich einen Engel des Herrn als grammatisches Subjekt; eine unmittelbare Zuschreibung an den Herrn würde die Aussage interpretierend verändern.
translation_notes:
  register: Knappes, würdiges modernes Standarddeutsch. Die Voranstellung „Er aber“ bewahrt den kontrastierenden Anschluss von δέ und vermeidet eine Verwechslung des Namens Er mit dem deutschen Pronomen „er“.
