revisions:
- from: Während der Tage der Hochzeitskammer gab ich sie Onan zur Schwagerehe. Doch auch er erkannte sie aus Bosheit nicht, obwohl er ein Jahr mit ihr verbrachte.
  to: Während der Tage der Brautkammer wies ich ihr Onan zur Schwagerehe zu. Doch auch er erkannte sie in seiner Bosheit nicht, obwohl er ein Jahr mit ihr verbrachte.
  rationale: Die Revision berichtigt die für den Sinn entscheidende Zuordnung von Onan und der Frau entsprechend Dativ αὐτῇ und Akkusativ τὸν Αὐνάν. Sie ersetzt ferner die etwas weniger geläufige „Hochzeitskammer“ durch „Brautkammer“. Die euphemistische und hinsichtlich des genauen Fehlverhaltens nicht weiter festgelegte Ausdrucksweise der Vorlage bleibt erhalten.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:14:16Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Rollen bei ἐπεγυμβρεύσα αὐτῇ τὸν Αὐνάν sind im Entwurf vertauscht: αὐτῇ („ihr“) bezeichnet die Empfängerin, τὸν Αὐνάν („Onan“) das zugeordnete Objekt. Die deutsche Fassung muss daher ausdrücken, dass Juda ihr Onan zuwies, nicht dass er sie Onan gab. Die übrigen Aussagen werden quellentreu wiedergegeben; „erkannte sie nicht“ erhält den verhüllenden Sinn von οὐκ ἔγνω αὐτήν.'
  naturalness: „Jemandem jemanden zur Schwagerehe zuweisen“ ist modernes, verständliches Standarddeutsch und gibt die griechische Konstruktion natürlich wieder. „Brautkammer“ ist gegenüber „Hochzeitskammer“ die geläufigere Bezeichnung für θάλαμος in diesem Zusammenhang.
  terminology: „Schwagerehe“ trifft den leviratischen Charakter ohne unnötigen Fachjargon. Die traditionelle Umschreibung „erkannte sie nicht“ sollte beibehalten werden. „In seiner Bosheit“ gibt ἐν πονηρίᾳ ohne zusätzliche Motivdeutung wieder.
  issues:
  - severity: high
    issue: Vertauschung der semantischen Rollen in der Schwagerehe-Konstruktion
    rationale: 'Der Entwurf „gab ich sie Onan“ behandelt αὐτήν/sie als direktes Objekt. Der griechische Text hat jedoch αὐτῇ im Dativ und τὸν Αὐνάν im Akkusativ: Juda wies ihr Onan zur Schwagerehe zu.'
  - severity: low
    issue: „Hochzeitskammer“ ist weniger idiomatisch als „Brautkammer“
    rationale: Beide sind möglich, aber „Brautkammer“ ist im modernen deutschen Bibelregister die etabliertere und prägnantere Wiedergabe von θάλαμος.
  revised_text: Während der Tage der Brautkammer wies ich ihr Onan zur Schwagerehe zu. Doch auch er erkannte sie in seiner Bosheit nicht, obwohl er ein Jahr mit ihr verbrachte.
  revised_footnotes: []
