base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/004.yaml
  text: During the days of the bridal chamber I gave her to Onan in levirate marriage; yet he too, in wickedness, did not know her, though he was with her for a year.
translation:
  language: de
  text: Während der Tage der Brautkammer wies ich ihr Onan zur Schwagerehe zu. Doch auch er erkannte sie in seiner Bosheit nicht, obwohl er ein Jahr mit ihr verbrachte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ταῖς ἡμέραις τοῦ θαλάμου
  choice: Während der Tage der Hochzeitskammer
  rationale: Die konkrete Bildsprache des griechischen Ausdrucks wird bewahrt; θάλαμος bezeichnet hier die Hochzeits- bzw. Brautkammer.
- source_word: ἐπεγυμβρευσα αὐτῇ τὸν Αὐνάν
  choice: gab ich sie Onan zur Schwagerehe
  rationale: Das seltene Verb bezeichnet die Verbindung nach dem Schwagerehebrauch. Die deutsche Formulierung gibt die beabsichtigte Handlung natürlich wieder, ohne über den knappen griechischen Text hinauszugehen.
- source_word: οὐκ ἔγνω αὐτήν
  choice: erkannte sie nicht
  rationale: Das biblisch geläufige Verb „erkennen“ bewahrt den verhüllenden sexuellen Sinn und die Ausdrucksweise der Quelle.
- source_word: ποιήσας σὺν αὐτῇ ἐνιαυτόν
  choice: obwohl er ein Jahr mit ihr verbrachte
  rationale: Die idiomatische deutsche Wendung gibt das zeitliche Zusammenleben wieder; die konzessive Verknüpfung macht den Zusammenhang mit der verweigerten ehelichen Vereinigung verständlich.
theological_decisions:
- issue: Art von Onans Fehlverhalten
  choice: aus Bosheit
  alternative: in seiner Bosheit
  rationale: ἐν πονηρίᾳ wird eng wiedergegeben, ohne ein genaueres Motiv oder eine konfessionell geprägte Deutung des Vergehens einzutragen.
- issue: Bedeutung von „erkennen“
  choice: Die verhüllende Formulierung bleibt im Haupttext erhalten.
  alternative: „hatte keinen Geschlechtsverkehr mit ihr“
  rationale: Die Quelle verwendet die traditionelle euphemistische Ausdrucksweise; eine Explizierung würde eine im Griechischen vorhandene sprachliche Mehrschichtigkeit beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit biblisch verständlicher Begrifflichkeit. „Schwagerehe“ ist präziser und geläufiger als das fachsprachlichere „Leviratsehe“; „Hochzeitskammer“ bewahrt das Quellbild.
