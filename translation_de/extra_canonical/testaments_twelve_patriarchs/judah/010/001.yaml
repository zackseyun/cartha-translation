base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/010/001.yaml
  text: After these things, Er my son took Tamar for himself as a wife, from Mesopotamia, a daughter of Aram.
translation:
  language: de
  text: Danach nimmt mein Sohn Er Tamar aus Mesopotamien, eine Tochter Arams, zur Frau.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Danach
  rationale: Gibt die zeitliche Weiterführung natürlich und vollständig wieder; das δέ markiert hier lediglich den Fortgang der Erzählung.
- source_word: ἄγεται
  choice: nahm … zur Frau
  rationale: Der überlieferte griechische Text bietet eine auffällige Präsensform, die im erzählenden Zusammenhang als historisches Präsens beziehungsweise textliche Unregelmäßigkeit verstanden werden kann. Die deutsche Vergangenheitsform entspricht dem Erzählrahmen, ohne zusätzliche Bedeutung einzutragen.
- source_word: τὴν Θαμὰρ … ἑαυτῷ εἰς γυναῖκα
  choice: nahm Tamar … zur Frau
  rationale: Eine natürliche deutsche Wiedergabe der Wendung, die Tamar als die von Er geheiratete Frau bezeichnet.
- source_word: ἐκ Μεσοποταμίας θυγατέρα Ἀρὰμ
  choice: eine Tochter Arams aus Mesopotamien
  rationale: Bewahrt beide Angaben und ordnet sie im Deutschen so an, dass Aram als Vater und Mesopotamien als Herkunftsort verständlich bleiben.
