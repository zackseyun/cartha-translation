- from: Mit Brautschmuck geschmückt setzte sie sich in der Stadt Enan[a] ans Tor. Denn bei den Amoritern war es Gesetz, dass eine Witwe sieben Tage lang öffentlich am Tor saß.
  to: Mit Brautschmuck geschmückt setzte sie sich in der Stadt Enan[a] beim Tor nieder. Denn bei den Amoritern war es Gesetz, dass eine Witwe sieben Tage lang beim Tor saß.
  rationale: Die Revision entfernt allein die nicht ausdrücklich im griechischen Text markierte Ergänzung „öffentlich“ und glättet die Ortsformulierung zu „beim Tor“. Alle übrigen Entscheidungen des Entwurfs bleiben erhalten, insbesondere die Orientierung am griechischen Text gegenüber den nicht durch ihn gedeckten Zusätzen des englischen Audit-Texts.
