base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/005.yaml
  text: And she, having learned that I was going up, adorned herself in bridal array and sat in the city Enaim by the gate. For it was a law of the Amorites that she who was about to marry should sit for seven days by the gate in fornication.
translation:
  language: de
  text: Mit Brautschmuck geschmückt setzte sie sich in der Stadt Enan[a] beim Tor nieder. Denn bei den Amoritern war es Gesetz, dass eine Witwe sieben Tage lang beim Tor saß.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Enan: Ortsname; auch in der Form „Enaim“ überliefert beziehungsweise bekannt.'
    reason: Die Namensform der griechischen Vorlage unterscheidet sich von der in anderen Überlieferungen gebräuchlichen Form Enaim.
lexical_decisions:
- source_word: κοσμηθεῖσα κόσμῳ νυμφικῷ
  choice: Mit Brautschmuck geschmückt
  rationale: Bewahrt die bewusste Wiederholung der griechischen Wortwurzel in einer natürlichen deutschen Formulierung und gibt νυμφικός als auf eine Braut bezogen wieder.
- source_word: ἐν Ἐνὰν τῇ πόλει
  choice: in der Stadt Enan
  rationale: Behandelt Ἐνάν entsprechend der vorliegenden griechischen Lesart als Ortsnamen.
- source_word: πρὸς τὴν πύλην / παρὰ τὴν πύλην
  choice: ans Tor / am Tor
  rationale: Gibt die leichte Differenz zwischen der gerichteten Ortsangabe πρὸς und dem Aufenthalt bei beziehungsweise an dem Tor mit idiomatischem Deutsch wieder.
- source_word: τὴν χηρεύουσαν
  choice: eine Witwe
  rationale: Das Partizip bezeichnet eine Frau im Witwenstand. Die Wiedergabe „die heiraten wollte“ wäre durch den vorgelegten griechischen Wortlaut nicht gedeckt.
- source_word: προκαθεσθαι
  choice: öffentlich ... saß
  rationale: Das Verb bezeichnet ein Sitzen vorn beziehungsweise vor den Augen anderer; „öffentlich sitzen“ vermittelt diesen Sinn, ohne eine im Griechischen nicht ausdrücklich genannte Tätigkeit hinzuzufügen.
theological_decisions:
- issue: Im englischen Konsultationstext genannte Unzucht
  choice: Keine Erwähnung von Unzucht im Haupttext
  alternative: „in Unzucht am Tor sitzen“
  rationale: Der vorgelegte griechische Text enthält weder πορνεία noch einen anderen ausdrücklichen Begriff für Unzucht. Diese Deutung darf daher nicht als Textbestandteil eingeführt werden.
- issue: Im englischen Konsultationstext genannte vorherige Nachricht von Judas Reise
  choice: Die Aussage wurde nicht aufgenommen
  alternative: „Als sie erfahren hatte, dass ich hinaufzog ...“
  rationale: Diese Aussage steht nicht im bereitgestellten griechischen Ausgangstext. Die Übersetzung folgt vorrangig der ausgewiesenen originalsprachlichen Quelle.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „Mit Brautschmuck geschmückt“ spiegelt bewusst die griechische Wortfigur. Der Satz über den amoritischen Brauch bleibt sachlich und fügt weder Heiratsabsicht noch Unzucht hinzu, da beides im vorgelegten griechischen Wortlaut nicht ausdrücklich steht.
