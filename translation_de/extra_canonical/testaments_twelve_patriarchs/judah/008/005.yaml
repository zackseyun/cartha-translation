review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem vorgelegten griechischen Text grundsätzlich zuverlässig: Er gibt den Brautschmuck, Enan, das Tor, den amoritischen Brauch und die sieben Tage wieder. Er übernimmt zu Recht weder die im englischen Audit-Text enthaltene Nachricht von Judas Aufstieg noch die dort genannte Unzucht, da beides im bereitgestellten griechischen Wortlaut fehlt. τὴν χηρεύουσαν ist angemessen als „eine Witwe“ verstanden. „öffentlich“ für προκαθεσθαι geht jedoch über die ausdrückliche Aussage hinaus; das Präfix legt eher eine Stellung bzw. ein Sitzen vorn/an einem öffentlich zugänglichen Ort nahe, ohne dass das Deutsche hier „öffentlich“ ergänzen muss.'
  naturalness: „Mit Brautschmuck geschmückt“ ist trotz der bewussten Wiederholung gut verständlich und gibt die griechische Wortfigur angemessen wieder. „Beim Tor“ ist im Deutschen etwas unmittelbarer und idiomatischer als „ans Tor“ und kann beide griechischen Präpositionen in diesem Kontext ohne Sinnverlust wiedergeben.
  terminology: „Brautschmuck“, „Witwe“, „Amoriter“ und „Tor“ sind registergerecht und terminologisch unauffällig. Die Fußnote zur Namensform Enan/Enaim ist sinnvoll und korrekt vorsichtig formuliert.
  issues:
  - severity: low
    issue: „öffentlich“ ergänzt eine im griechischen Wortlaut nicht ausdrücklich bezeichnete Modalität.
    rationale: προκαθεσθαι kann ein Sitzen vorn bzw. an einem hervorgehobenen Ort bezeichnen; die Übersetzung „öffentlich“ legt den Sinn stärker fest, als es für den Satz erforderlich ist. Die Ortsangabe beim Tor vermittelt den öffentlichen Rahmen bereits hinreichend.
  revised_text: Mit Brautschmuck geschmückt setzte sie sich in der Stadt Enan[a] beim Tor nieder. Denn bei den Amoritern war es Gesetz, dass eine Witwe sieben Tage lang beim Tor saß.
