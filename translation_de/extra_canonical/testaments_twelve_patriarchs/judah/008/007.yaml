base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/007.yaml
  text: And I turned aside to her and said, "Let me go in to you." And she said, "What will you give me, that you may come in to me?"
translation:
  language: de
  text: 'Und ich wandte mich ihr zu und sagte: »Ich gehe zu dir ein.« Sie sagte: »Was wirst du mir geben?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκκλίνας πρὸς αὐτήν
  choice: wandte ich mich ihr zu
  rationale: Gibt die räumliche Hinwendung zu der Frau natürlich wieder, ohne zusätzliche Motive in den Text einzutragen.
- source_word: Εἰσέρχομαι πρὸς σε
  choice: Ich will zu dir eingehen
  rationale: Bewahrt den sexuellen Sinn der biblisch geprägten Wendung und zugleich ihre verhüllende Ausdrucksweise; das Präsens wird im Deutschen idiomatisch als erklärte Absicht wiedergegeben.
- source_word: Τί μοι δώσεις;
  choice: Was wirst du mir geben?
  rationale: Entspricht der knappen griechischen Frage und ergänzt nicht den längeren Zweck- beziehungsweise Bedingungssatz der englischen Konsultationsfassung.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wendung »zu dir eingehen« bleibt bewusst zurückhaltend und bibelsprachlich, ist aber im Zusammenhang als sexuelle Annäherung verständlich. Die Kürze des griechischen Ausgangstextes wird beibehalten.
