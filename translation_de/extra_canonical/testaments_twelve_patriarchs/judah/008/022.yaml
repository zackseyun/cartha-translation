source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐὰν δὲ παρέλθῃ τὸν ὅρον, ἐμβάλλει εἰς τὸν νοῦν αὐτοῦ τὸ πνεῦμα τῆς πλάνης, καὶ ποιεῖ τὸν μέθυσον αἰσχρορρημονεῖν καὶ παρανομεῖν καὶ μὴ αἰσχύνεσθαι ἀλλὰ καυχᾶσθαι τῇ ἀτιμίᾳ καὶ νομίζειν εἶναι καλόν.
  language: Greek
  note: Greek from Charles XIV.8 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/022.yaml
  text: But if he goes beyond the limit, the spirit of deceit attacks his mind and makes the drunkard speak obscenities and transgress, and not be ashamed, but even boast in his disgrace and count it glory.
translation:
  language: de
  text: Wenn er aber das Maß überschreitet, gibt der Geist des Irrtums ihm Gedanken ein und bringt den Betrunkenen dazu, unanständige Worte zu reden und das Gesetz zu übertreten, ohne sich zu schämen; vielmehr rühmt er sich seiner Schande und hält sie für etwas Gutes.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und hält sie für schön/ehrenhaft“.'
    reason: καλόν kann „gut“, „schön“, „edel“ oder „ehrenhaft“ bedeuten; der genaue Akzent bleibt mehrdeutig.
lexical_decisions:
- source_word: παρέλθῃ τὸν ὅρον
  choice: das Maß überschreitet
  rationale: Die Wendung bezeichnet das Überschreiten einer Grenze; im Zusammenhang mit Trunkenheit gibt „das Maß überschreiten“ den Sinn natürlich und präzise wieder.
- source_word: ἐμβάλλει εἰς τὸν νοῦν αὐτοῦ
  choice: gibt … ihm Gedanken ein
  rationale: Wörtlich wird etwas in den Verstand hineingeworfen. Die deutsche Wendung wahrt die Vorstellung äußerer geistiger Einwirkung, ohne das stärkere „angreifen“ einzutragen.
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: der Geist der Verirrung
  rationale: „Verirrung“ lässt sowohl Täuschung als auch Abweichen vom rechten Weg anklingen und bewahrt die personifizierte geistige Macht.
- source_word: αἰσχρορρημονεῖν
  choice: schamlos zu reden
  rationale: Das Verb bezeichnet schändliches, unanständiges oder obszönes Reden. „Schamlos reden“ ist würdig und allgemein verständlich, ohne den Ausdruck unnötig einzuengen.
- source_word: παρανομεῖν
  choice: das Gesetz zu übertreten
  rationale: Das Verb bedeutet gesetzeswidrig handeln beziehungsweise übertreten; die ausdrückliche Gesetzesbeziehung bleibt erhalten.
- source_word: καυχᾶσθαι τῇ ἀτιμίᾳ
  choice: sich seiner Schande rühmen
  rationale: Gibt den instrumentalen beziehungsweise gegenstandsbezogenen Dativ idiomatisch wieder und bewahrt die moralische Umkehrung.
- source_word: νομίζειν εἶναι καλόν
  choice: sie für etwas Gutes halten
  rationale: Das griechische καλόν bedeutet hier „gut“, „schön“ oder „ehrenhaft“. Die Hauptübersetzung folgt dem unmittelbarsten moralischen Sinn.
theological_decisions:
- issue: Wirken des „Geistes der Verirrung“
  choice: als handelndes geistiges Subjekt wiedergegeben
  alternative: psychologisch entpersonalisieren, etwa „Irrtum ergreift seinen Sinn“
  rationale: Der griechische Text nennt ausdrücklich „den Geist“ als Subjekt. Die Übersetzung bewahrt diese Aussage, ohne Wesen oder Herkunft dieses Geistes näher zu bestimmen.
- issue: Bezug von καλόν
  choice: moralisch als „etwas Gutes“ verstanden
  alternative: „ehrenhaft“ oder „ruhmvoll“
  rationale: Der Text beschreibt, dass Schande positiv umgedeutet wird. Da καλόν mehrere positive Wertungen tragen kann, wird die Spannweite in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzbewegung und die Steigerung des griechischen Textes bleiben erhalten; unnötig altertümliche oder konfessionell geprägte Begriffe werden vermieden.
