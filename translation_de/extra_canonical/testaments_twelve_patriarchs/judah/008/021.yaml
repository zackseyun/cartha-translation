  text: καὶ αὕτη ἐστὶν ἡ σύνεσις τῆς οἰνοποσίας, *ἕως ὅτε ἔχει αἰδῶ, πίνει.
  language: Greek
  note: Greek from Charles XIV.7b (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/021.yaml
  text: 'And this is the discretion in drinking wine: if a man drinks wine and keeps modesty, and if he does not go astray into shamelessness, he may drink wine.'
translation:
  language: de
  text: 'Und dies ist die Einsicht beim Weintrinken: Solange man Schamgefühl hat, trinkt man.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύνεσις
  choice: Einsicht
  rationale: Bezeichnet verständiges Urteilsvermögen; „Einsicht“ gibt den ethischen Sinn natürlich und ohne unnötige Erweiterung wieder.
- source_word: οἰνοποσίας
  choice: beim Weintrinken
  rationale: Gibt den Vorgang des Weintrinkens idiomatisch wieder.
- source_word: αἰδῶ
  choice: Schamgefühl
  rationale: Bewahrt den positiven ethischen Sinn von αἰδώς als sittliche Scheu beziehungsweise Zurückhaltung; „Bescheidenheit“ wäre weniger präzise.
- source_word: πίνει
  choice: darf man trinken
  rationale: Der griechische Indikativ „trinkt er“ steht hier im Rahmen einer Lebensregel. Die modale Wiedergabe erschließt die pragmatische Aussage, ohne die im Englischen ergänzten Bedingungen zu übernehmen.
theological_decisions:
- issue: Ethische Grenze des Weintrinkens
  choice: Weintrinken wird an das Bewahren des Schamgefühls gebunden.
  alternative: Ein vollständiges Verbot des Weintrinkens oder eine ausdrückliche Warnung vor „Schamlosigkeit“.
  rationale: Der erhaltene griechische Wortlaut formuliert kein absolutes Verbot und nennt Schamlosigkeit nicht ausdrücklich; diese Grenze ist nur als Gegenbegriff mitgedacht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die im englischen Beratungstext entfalteten Zusätze („wenn ein Mensch Wein trinkt“ und „wenn er nicht in Schamlosigkeit abirrt“) wurden nicht in den Haupttext aufgenommen, da sie im überlieferten griechischen Ausgangstext nicht ausdrücklich stehen.
