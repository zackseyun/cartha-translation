id: T12P.JUD.8.42
reference: Testament of Judah 8:42
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ἔγνωκα ὅσα κακὰ ποιήσετε ἐν [ταῖς ἐσχάταις ἡμέραις].'
  language: Greek
  note: Greek from Charles XVIII.1 (α). The project English's 'I have read in the books of Enoch the righteous' reflects the β-recension reading 'καίγε ἀνέγνων ἐν βίβλοις Ἐνὼχ τοῦ δικαίου' (Charles 1908 raw apparatus, p164 n.1); the α-text here has only 'Καὶ ἔγνωκα' ('And I have come to know'). The 'sons turning away from the Lord and committing every wickedness' is captured in α by 'ὅσα κακὰ ποιήσετε ἐν [ταῖς ἐσχάταις ἡμέραις]' (the bracketed clause is Charles' marked Christian interpolation, preserved per project policy). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/042.yaml
  text: And now I have commanded you these things, because I have read in the books of Enoch the righteous that your sons will turn away from the Lord, and will commit every wickedness and every affliction before the Lord.
translation:
  language: de
  text: Und ich weiß, wie viel Böses ihr in den letzten Tagen[a] tun werdet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte »in den letzten Tagen« stehen in der Ausgabe in eckigen Klammern; Charles kennzeichnet sie damit als christlichen Einschub.
    reason: Die editorische Unsicherheit beziehungsweise Interpolationsbewertung der erhaltenen Wendung soll transparent bleiben.
lexical_decisions:
- source_word: Καὶ
  choice: Und
  rationale: Gibt die einfache Fortführung des griechischen Satzes wieder.
- source_word: ἔγνωκα
  choice: ich habe erkannt
  rationale: Bewahrt den Erkenntnissinn des Perfekts. Die Lesart der β-Rezension über das Lesen in den Büchern Henochs wird nicht in den α-Text eingetragen.
- source_word: ὅσα κακὰ
  choice: was für Böses
  rationale: Gibt die unbestimmte Gesamtheit der angekündigten bösen Taten natürlich wieder, ohne zusätzliche Einzelheiten aus einer anderen Rezension einzuführen.
- source_word: ποιήσετε
  choice: ihr ... tun werdet
  rationale: Entspricht dem Futur der zweiten Person Plural.
- source_word: ἐν ταῖς ἐσχάταις ἡμέραις
  choice: in den letzten Tagen
  rationale: Formale und im Deutschen geläufige Wiedergabe der überlieferten Zeitangabe.
theological_decisions:
- issue: Abweichung zwischen α-Text und β-Rezension beziehungsweise englischer Konsultationsfassung
  choice: 'Nur die Aussage des vorgelegten α-Textes wird übersetzt: Juda hat erkannt, welches Böse die Angeredeten tun werden.'
  alternative: Erwähnung der Bücher Henochs, des Abfalls der Söhne vom Herrn und weiteren Unheils gemäß β-Rezension beziehungsweise englischer POB.
  rationale: Die Übersetzung folgt vorrangig dem angegebenen griechischen Ausgangstext und führt keine expansionsartige Lesart einer anderen Rezension in den Haupttext ein.
- issue: Als christliche Interpolation markierte Wendung
  choice: Die Wendung „in den letzten Tagen“ bleibt im Haupttext erhalten und wird durch eine Fußnote textkritisch kenntlich gemacht.
  alternative: Auslassung der eingeklammerten Wendung.
  rationale: Dies entspricht der Projektvorgabe, die von Charles eingeklammerte Passage zu bewahren, ohne ihren textkritischen Status zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der knappe Satzbau des griechischen α-Textes bleibt erhalten; Erweiterungen aus der β-Rezension und der englischen Konsultationsfassung werden nicht übernommen.
