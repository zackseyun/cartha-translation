source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καίγε *μετανοήσας ἐπὶ τούτοις, οἶνον καὶ κρέα οὐκ ἔφαγον ἕως γήρους μου, καὶ *πᾶσαν εὐφροσύνην οὐκ εἶδον.
  language: Greek
  note: Greek from Charles XV.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/025.yaml
  text: And indeed I repented of these things; and wine and meat I did not consume until old age, and I saw no joy.
translation:
  language: de
  text: 'Und tatsächlich bereute ich diese Dinge: Bis zu meinem hohen Alter trank ich keinen Wein und aß kein Fleisch, und ich erlebte keinerlei Freude.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und ich sah keinerlei Freude“.'
    reason: Dokumentiert das konkrete griechische Bild, während der Haupttext die im Deutschen natürlichere Erfahrungsformulierung verwendet.
lexical_decisions:
- source_word: Καίγε
  choice: Und tatsächlich
  rationale: Gibt die bekräftigende Verbindung natürlich und mit angemessenem Nachdruck wieder.
- source_word: μετανοήσας ἐπὶ τούτοις
  choice: bereute ich dies
  rationale: Bewahrt den Sinn von Umkehr beziehungsweise Reue im Blick auf die zuvor genannten Dinge, ohne eine weitergehende theologische Deutung einzutragen.
- source_word: οἶνον καὶ κρέα οὐκ ἔφαγον
  choice: aß ich weder Fleisch noch trank ich Wein
  rationale: Im Griechischen regiert ἔφαγον zeugmatisch sowohl Wein als auch Fleisch. Im Deutschen wird für Wein idiomatisch „trinken“ ergänzt; die Reihenfolge wird für die natürliche weder-noch-Konstruktion angepasst.
- source_word: ἕως γήρους μου
  choice: bis ins hohe Alter
  rationale: Natürliches modernes Deutsch für eine zeitliche Angabe, die bis zu Judas Alter beziehungsweise Greisenalter reicht.
- source_word: πᾶσαν εὐφροσύνην οὐκ εἶδον
  choice: ich erlebte keinerlei Freude
  rationale: „Freude sehen“ ist im Deutschen unidiomatisch; „Freude erleben“ erhält die Erfahrungsbedeutung und die umfassende Verneinung.
theological_decisions:
- issue: Verhältnis von Reue, Verzicht und Freudlosigkeit
  choice: Die drei Aussagen werden ohne ausdrückliche kausale Verknüpfung wiedergegeben.
  alternative: Den Verzicht und die Freudlosigkeit ausdrücklich als Bußhandlungen oder Folgen der Reue bezeichnen.
  rationale: Der griechische Text stellt die Aussagen nebeneinander, erklärt aber ihr genaues theologisches oder kausales Verhältnis nicht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt knapp und bekenntnishaft; das griechische Zeugma wird idiomatisch aufgelöst, ohne den Inhalt zu erweitern.
