  note: Project verse 8:8 (the 'I will send you a kid from the flock... will you give me a pledge until you send it?' exchange) has no direct counterpart in the Charles α-text of XII.4, which collapses Tamar's question 'Τί μοι δώσεις;' directly into Judah handing over the pledges. The kid-from-the-flock question is drawn from the broader Genesis 38 tradition that informs the project English; α witnesses no Greek for this specific exchange. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/008.yaml
  text: And I said, "I will send you a kid from the flock." And she said, "Will you give me a pledge until you send it?"
translation:
  language: de
  text: 'Und ich sagte: »Ich werde dir ein Ziegenböckchen aus der Herde schicken.« Sie aber sagte: »Gibst du mir ein Pfand, bis du es schickst?«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Wortwechsel hat im griechischen α-Text des Testaments Judas keine direkte Entsprechung. Er folgt der in Genesis 38,17 überlieferten Erzähltradition; dort bietet Juda ein Ziegenböckchen an, und Tamar verlangt bis zur Übersendung ein Pfand.
    reason: Textkritische Transparenz, da der angegebene griechische Hauptzeuge diesen Satz nicht enthält.
lexical_decisions:
- source_word: 'Genesis-Tradition: גְּדִי־עִזִּים / ἔριφος αἰγῶν'
  choice: Ziegenböckchen
  rationale: Gibt das in Genesis 38,17 genannte junge Tier präzise und in natürlichem modernem Deutsch wieder; »aus der Herde« folgt der Projektvorlage.
- source_word: 'Genesis-Tradition: עֵרָבוֹן / ἀρραβών'
  choice: Pfand
  rationale: Bezeichnet eine vorläufig überlassene Sicherheit und entspricht dem Zusammenhang von Genesis 38,17–18.
- source_word: 'Genesis-Tradition: עַד שָׁלְחֶךָ / ἕως τοῦ ἀποστεῖλαί σε'
  choice: bis du es schickst
  rationale: Bewahrt den zeitlichen Sinn der Frage und den Rückbezug auf das versprochene Ziegenböckchen.
theological_decisions:
- issue: Fehlender direkter Wortlaut im griechischen α-Text des Testaments Judas
  choice: Den aus Genesis 38 überlieferten Dialog übersetzen und seine textliche Herkunft in einer Fußnote offenlegen
  alternative: Den Vers auslassen oder so darstellen, als sei er unmittelbar im α-Text belegt
  rationale: Die Projektvorlage enthält den Vers, doch Quellenredlichkeit verlangt, die fehlende direkte Entsprechung im angegebenen griechischen Zeugen ausdrücklich kenntlich zu machen.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdiges Erzählregister. Die direkte Rede bleibt knapp. »Sie aber sagte« gibt den leichten Kontrast natürlich wieder; »Pfand« ist allgemeinverständlich und sachlich genau.
