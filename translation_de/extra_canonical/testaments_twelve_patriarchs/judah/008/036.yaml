source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐμοὶ γὰρ ἔδωκεν ὁ Θεὸς τὴν βασιλείαν, κἀκείνῳ τὴν ἱερατείαν, καὶ ὑπέταξε τὴν βασιλείαν τῇ ἱερωσύνῃ.
  language: Greek
  note: Greek from Charles XXI.2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/036.yaml
  text: For to me the Lord gave the kingship, and to him the priesthood; and he set the kingdom under the priesthood.
translation:
  language: de
  text: Denn mir gab Gott das Königtum und ihm das Priestertum; und er unterstellte das Königtum dem Priestertum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεός
  choice: Gott
  rationale: Der griechische Text hat ausdrücklich „Gott“, nicht „Herr“ wie die englische Konsultationsfassung.
- source_word: τὴν βασιλείαν
  choice: das Königtum
  rationale: Hier bezeichnet βασιλεία die königliche Herrschaft beziehungsweise das Königsamt, parallel zum Priestertum; „Königtum“ bildet diese institutionelle Bedeutung prägnant ab.
- source_word: τὴν ἱερατείαν / τῇ ἱερωσύνῃ
  choice: das Priestertum / dem Priestertum
  rationale: Obwohl zwei verwandte griechische Substantive verwendet werden, bezeichnen beide hier das priesterliche Amt beziehungsweise die priesterliche Ordnung. Eine einheitliche Wiedergabe ist im Deutschen natürlich und erhält den Parallelismus.
- source_word: ὑπέταξε
  choice: unterstellte
  rationale: Das Verb bezeichnet ein Unterordnen oder Unterstellen. „Unterstellte“ wahrt die Aussage über das Verhältnis von Königtum und Priestertum, ohne sie weiter auszudeuten.
theological_decisions:
- issue: Verhältnis von Königtum und Priestertum
  choice: „er unterstellte das Königtum dem Priestertum“
  alternative: „er ordnete das Königtum dem Priestertum unter“
  rationale: Die Übersetzung gibt die ausdrückliche Hierarchisierung des griechischen Textes wieder, ohne ihre historische oder theologische Reichweite konfessionell zu bestimmen.
- issue: Gottesbezeichnung
  choice: „Gott“
  alternative: „der Herr“
  rationale: Die direkte Ausgangstextgrundlage lautet ὁ Θεός. Daher wird die abweichende englische Wiedergabe nicht übernommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der parallele Satzbau und die knappe, feierliche Aussage des griechischen Textes bleiben erhalten.
