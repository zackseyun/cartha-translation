id: T12P.JUD.8.38
reference: Testament of Judah 8:38
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Οὕτως γὰρ *ὑπερέχει ἡ ἱερατεία τοῦ Θεοῦ τῆς ἐπιγείου βασιλείας, ἐὰν μὴ διὰ ἁμαρτιῶν ἐκπέσῃ ἀπὸ Κυρίου καὶ διὰ τοῦ τῆς ἐπιγείου βασιλείας *κυριευθῇ.
  language: Greek
  note: Greek from Charles XXI.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/038.yaml
  text: As heaven is higher than earth, so is the priesthood of God higher than the earthly kingdom—unless it falls away through sin from the Lord and is dominated by the earthly kingdom.
translation:
  language: de
  text: Denn so steht das Priestertum Gottes über dem irdischen Königtum – es sei denn, es fällt durch Sünden vom Herrn ab und wird vom irdischen Königtum beherrscht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερέχει
  choice: steht … über
  rationale: Gibt den Gedanken des Überragens beziehungsweise Höherstehens natürlich wieder, ohne den im griechischen Satz nicht ausdrücklich vorhandenen Vergleich von Himmel und Erde einzufügen.
- source_word: ἡ ἱερατεία τοῦ Θεοῦ
  choice: das Priestertum Gottes
  rationale: Formale und verständliche Entsprechung; der Genitiv bleibt in seiner möglichen Zugehörigkeits- beziehungsweise Herkunftsbedeutung offen.
- source_word: τῆς ἐπιγείου βασιλείας
  choice: dem irdischen Königtum
  rationale: „Königtum“ bezeichnet hier eher Herrschaft und Institution als ein räumliches Königreich und bewahrt den Kontrast zum Priestertum.
- source_word: ἐκπέσῃ ἀπὸ Κυρίου
  choice: fällt … vom Herrn ab
  rationale: Bewahrt die starke Vorstellung, durch Sünde die Bindung beziehungsweise Stellung beim Herrn zu verlieren.
- source_word: κυριευθῇ
  choice: gerät unter die Herrschaft
  rationale: Gibt das Passiv des Beherrschtwerdens idiomatisch und deutlich wieder.
theological_decisions:
- issue: Vorrang des Priestertums und seine Bedingtheit
  choice: Der Vorrang wird ausgesprochen, zugleich aber durch die Möglichkeit eines sündhaften Abfalls eingeschränkt.
  alternative: Den Vorrang uneingeschränkt oder als ontologische Überlegenheit zu formulieren.
  rationale: Die Konstruktion ἐὰν μή erhält die Spannung zwischen dem Vorrang des Priestertums und seinem möglichen Verlust durch Sünde.
- issue: Bezug des möglichen Abfalls
  choice: Das grammatische Subjekt bleibt „das Priestertum“.
  alternative: Den Satz ausdrücklich auf einzelne Priester oder den Priesterstamm zu beziehen.
  rationale: Der griechische Text setzt ἡ ἱερατεία als Subjekt; eine personelle Präzisierung wäre Auslegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den überlieferten griechischen Wortlaut. Die im englischen Konsultationstext ergänzte Himmels-Erde-Analogie wurde nicht übernommen, da sie in der angegebenen griechischen Quelle nicht steht.
