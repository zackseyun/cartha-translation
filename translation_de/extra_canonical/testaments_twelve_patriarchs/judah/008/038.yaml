  source_fidelity: Der Entwurf gibt ἡ ἱερατεία τοῦ Θεοῦ, ὑπερέχει, ἐκπέσῃ ἀπὸ Κυρίου und die Bedingung ἐὰν μή im Wesentlichen treffend wieder. Bei κυριευθῇ bleibt jedoch das passive Beherrschtwerden in „gerät unter die Herrschaft“ abgeschwächt; die griechische Konstruktion bezeichnet ausdrücklich, dass das Priestertum durch das irdische Königtum beherrscht wird.
  naturalness: „Denn so steht … über“ ist als an den vorausgehenden Kontext anschließende Formulierung möglich und würdig. „Vom irdischen Königtum beherrscht wird“ ist ebenso idiomatisch und bildet die griechische Passivform präziser ab.
  terminology: „Priestertum Gottes“, „irdisches Königtum“, „Sünden“ und „Herr“ sind angemessene, registergerechte Entsprechungen. Keine konfessionelle Konkretisierung wird eingeführt.
