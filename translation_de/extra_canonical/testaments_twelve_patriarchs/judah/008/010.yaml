source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ ὡς συνήλθον αὐτῇ συνελήφθη. 5. Ἀγνοῶν δὲ ἐγὼ ὃ ἐποίησα,'
  language: Greek
  note: 'Greek from Charles XII.4c-5a (α): the union and Judah''s unawareness. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/010.yaml
  text: So I gave them to her and went in to her, and she conceived by me. And because of the wine I did not perceive what I had done; neither did I recognize her when I went away.
translation:
  language: de
  text: Und als ich mit ihr zusammenkam, wurde sie schwanger. Ich aber wusste nicht, was ich getan hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνήλθον αὐτῇ
  choice: als ich mit ihr zusammenkam
  rationale: Die idiomatische Wendung bezeichnet hier den Geschlechtsverkehr. „Mit ihr zusammenkam“ wahrt den würdevollen, verhüllenden Ausdruck des Griechischen.
- source_word: συνελήφθη
  choice: wurde sie schwanger
  rationale: Das Passiv von συλλαμβάνω bedeutet in diesem Zusammenhang „empfangen/schwanger werden“. Die moderne Formulierung ist eindeutig und natürlich.
- source_word: Ἀγνοῶν δὲ ἐγώ
  choice: Ich aber wusste nicht
  rationale: Gibt Judas fehlendes Wissen wieder, ohne einen im erhaltenen griechischen Ausschnitt nicht genannten Grund hinzuzufügen.
- source_word: ὃ ἐποίησα
  choice: was ich getan hatte
  rationale: Das Plusquamperfekt bildet im Deutschen die Vorzeitigkeit gegenüber Judas späterem Nichtwissen natürlich ab.
theological_decisions:
- issue: Umfang von Judas Unwissenheit
  choice: 'Allgemein belassen: „wusste nicht, was ich getan hatte“'
  alternative: Das Nichtwissen ausdrücklich auf den Wein oder auf die Identität der Frau beziehen
  rationale: Der vorgelegte griechische Text nennt weder den Wein noch das Nichterkennen der Frau. Diese Einzelheiten werden daher nicht aus der englischen Konsultationsfassung in diesen Vers eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit zurückhaltender sexueller Ausdrucksweise. Die Übersetzung folgt dem angegebenen griechischen Ausschnitt; Zusätze der englischen POB, die darin nicht belegt sind, wurden nicht übernommen.
source_grounding:
  english_pob_role: consult_only
