  source_fidelity: 'Der deutsche Text gibt den vorgelegten griechischen Ausschnitt präzise wieder: καὶ ὡς („und als“), συνήλθον αὐτῇ als verhüllende Bezeichnung des Geschlechtsverkehrs, συνελήφθη im Sinn von Schwangerschaft/Empfängnis sowie ἀγνοῶν ... ὃ ἐποίησα als fehlendes Wissen über das Getane. Er fügt weder Wein noch ein Nichterkennen der Frau hinzu, die im englischen Audittext stehen, aber im angegebenen griechischen Ausschnitt nicht belegt sind.'
  naturalness: „Und als ich mit ihr zusammenkam, wurde sie schwanger. Ich aber wusste nicht, was ich getan hatte.“ ist natürliches, modernes und würdiges Standarddeutsch. Die Umschreibung ist klar, ohne unnötig explizit zu werden.
  terminology: Die Wahl „mit ihr zusammenkam“ bewahrt den zurückhaltenden Registerwert von συνέρχομαι in diesem Kontext. „Wurde sie schwanger“ ist idiomatisch und semantisch passend für συνελήφθη. Keine theologischen Fachbegriffe oder Eigennamen sind betroffen.
