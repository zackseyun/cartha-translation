source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἔπεμψα τοῦ λαβεῖν τοὺς ἀρραβῶνας. Καὶ οὐχ εὗρον αὐτήν,
  language: Greek
  note: Greek from Charles XII α-replacement passage (the abbreviated LXX-Gen 38.20-30 form that α substitutes for XII.6-10; preserved in Charles 1908 raw apparatus, p156). Project's English 'asked the people of the place' has no α counterpart and is drawn from the Genesis tradition. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/011.yaml
  text: And after this I sent the kid, but I did not find her. And I asked the people of the place, saying, "Where is the woman who sat at Enaim by the road?"
translation:
  language: de
  text: Ich schickte jemanden aus, um die Pfandstücke zurückzuholen. Doch ich fand sie nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔπεμψα
  choice: ich schickte jemanden
  rationale: Das griechische Verb nennt ausdrücklich weder den Gesandten noch den Ziegenbock. Die natürliche deutsche Form macht nur den im Verb vorausgesetzten Beauftragten sichtbar, ohne die aus Genesis bekannte Einzelheit in den Text einzutragen.
- source_word: τοῦ λαβεῖν
  choice: um … zurückzuholen
  rationale: Die Infinitivkonstruktion bezeichnet den Zweck des Sendens. Im Zusammenhang geht es darum, das zuvor übergebene Pfand wieder an sich zu nehmen; „zurückzuholen“ gibt diese Richtung idiomatisch wieder.
- source_word: τοὺς ἀρραβῶνας
  choice: das Pfand
  rationale: Der griechische Plural bezeichnet die als Sicherheit überlassenen Pfandstücke. Der deutsche Kollektivsingular „das Pfand“ ist natürlich und bewahrt die sachliche Bedeutung.
- source_word: οὐχ εὗρον αὐτήν
  choice: er fand sie nicht
  rationale: Das finite Verb kann im Griechischen ohne ausdrücklich genanntes Subjekt an den ausgesandten Beauftragten anschließen. Diese Lesart ist im Deutschen kohärenter als ein unvermittelter Wechsel zu „ich fand sie nicht“.
theological_decisions:
- issue: Ergänzungen aus der Genesisüberlieferung
  choice: Weder der Ziegenbock noch die Befragung der Ortsbewohner und die Frage nach der Frau bei Enaim werden aufgenommen.
  alternative: Den ausführlicheren Wortlaut der englischen POB nach Genesis 38 wiedergeben.
  rationale: Der angegebene griechische Quelltext enthält nur das Senden zur Rücknahme des Pfandes und das erfolglose Suchen. Eine Erweiterung würde hier nicht belegte Überlieferung in den Vers eintragen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die knappe Form des griechischen α-Ersatztextes bleibt erhalten; nicht im Quelltext belegte Einzelheiten der englischen Konsultationsfassung werden ausgelassen.
