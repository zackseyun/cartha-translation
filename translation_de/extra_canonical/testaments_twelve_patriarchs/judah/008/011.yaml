revisions:
- from: Und ich schickte jemanden, um das Pfand zurückzuholen. Doch er fand sie nicht.
  to: Ich schickte jemanden aus, um die Pfandstücke zurückzuholen. Doch ich fand sie nicht.
  rationale: Die Revision berichtigt die grammatische Person des zweiten Satzes und gibt den Plural von τοὺς ἀρραβῶνας wieder. Das ungenannte Objekt von ἔπεμψα wird weiterhin lediglich als „jemanden“ ergänzt; weder der im α-Text fehlende Ziegenbock noch die ebenfalls fehlende Nachfrage bei Ortsbewohnern werden aus dem englischen POB-Audit-Trail oder der Genesis-Tradition in den Vers übernommen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:13:37Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Auslassung des im griechischen Text nicht genannten Sendungsobjekts grundsätzlich umsichtig wieder und übernimmt zu Recht weder den Ziegenbock noch die Ortsbefragung aus der englischen bzw. Genesis-Überlieferung. Jedoch ist οὐχ εὗρον eindeutig 1. Person Singular: „ich fand nicht“, nicht „er fand nicht“.'
  naturalness: „Jemanden ausschicken“ ist im Deutschen idiomatisch; die Wiederaufnahme mit „ich fand sie nicht“ ist klar und bewahrt zugleich die knappe Erzählweise. „Pfandstücke“ gibt den griechischen Plural natürlicher und genauer wieder als der Kollektivsingular „das Pfand“.
  terminology: ἀρραβῶνες bezeichnet die als Sicherheit überlassenen Gegenstände. „Pfandstücke“ wahrt den Plural und vermeidet eine unnötige Festlegung auf einzelne, nur aus Genesis bekannte Gegenstände. „Sie“ bleibt wie αὐτήν ohne weitere Benennung der Frau.
  issues:
  - severity: high
    issue: Personwechsel bei „er fand sie nicht“
    rationale: εὗρον ist grammatisch erste Person Singular und knüpft an ἔπεμψα („ich sandte“) an. Der Entwurf führt ohne griechische Grundlage einen Wechsel zum ausgesandten Boten als Subjekt ein.
  - severity: low
    issue: Singular „das Pfand“ für τοὺς ἀρραβῶνας
    rationale: Der Kollektivsingular ist verständlich, doch der griechische Plural bezieht sich auf mehrere Pfandgegenstände. „Pfandstücke“ erhält diese Angabe ohne die Gegenstände aus der Genesisüberlieferung zu ergänzen.
  revised_text: Ich schickte jemanden aus, um die Pfandstücke zurückzuholen. Doch ich fand sie nicht.
  revised_footnotes: []
  revision_rationale: Die Revision berichtigt die grammatische Person des zweiten Satzes und gibt den Plural von τοὺς ἀρραβῶνας wieder. Das ungenannte Objekt von ἔπεμψα wird weiterhin lediglich als „jemanden“ ergänzt; weder der im α-Text fehlende Ziegenbock noch die ebenfalls fehlende Nachfrage bei Ortsbewohnern werden aus dem englischen POB-Audit-Trail oder der Genesis-Tradition in den Vers übernommen.
