source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καίγε οἱ ἐν τῇ πόλει ἔλεγον, μὴ *εἶναι ἐν τῇ πύλῃ τελεσικόμενον, ὅτι ἐξ ἄλλου χωρίου ἐλθοῦσα πρὸς βραχὺ ἐκαθέσθη ἐν τῇ πύλῃ. 10. Καὶ ἐνόμιζον, ὅτι οὐδεὶς ἔγνω ὅτι εἰσῆλθον πρὸς αὐτήν.
  language: Greek
  note: Greek from Charles XII.9-10 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/012.yaml
  text: And they said, "There has been no prostitute here, nor any stranger sitting by the gate." And I understood that I had sinned, and I did not make the matter known publicly, because I was ashamed.
translation:
  language: de
  text: Und tatsächlich sagten die Leute in der Stadt, es habe am Tor keine Prostituierte[a] gegeben; denn sie sei von einem anderen Ort gekommen und habe nur kurze Zeit am Tor gesessen. Und sie meinten, niemand habe erfahren, dass ich zu ihr hineingegangen war.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort ist selten und seine genaue Bedeutung unsicher. „Prostituierte“ ist eine kontextuelle Deutung.
    reason: Kennzeichnet die semantische und textliche Unsicherheit von τελεσικόμενον, ohne eine weitergehende Interpretation festzulegen.
lexical_decisions:
- source_word: τελεσικόμενον
  choice: Prostituierte
  rationale: Das seltene und textkritisch schwierige Wort wird im Kontext als Bezeichnung einer Prostituierten verstanden. Die englische Konsultationsfassung stützt diese Deutung; die Unsicherheit wird jedoch in einer Fußnote offengelegt.
- source_word: ἐν τῇ πύλῃ
  choice: an dem Tor
  rationale: Die Präposition bezeichnet hier den Aufenthaltsort beim Stadttor; natürliches modernes Deutsch verlangt »an dem Tor«.
- source_word: ἐξ ἄλλου χωρίου
  choice: von einem anderen Ort
  rationale: χωρίον kann Ort, Gegend oder Ortschaft bedeuten. Die allgemeine Wiedergabe bewahrt diese Bedeutungsbreite.
- source_word: πρὸς βραχύ
  choice: nur kurze Zeit
  rationale: Die Wendung bezeichnet eine kurze Dauer.
- source_word: εἰσῆλθον πρὸς αὐτήν
  choice: dass ich zu ihr hineingegangen war
  rationale: Die räumliche Aussage und ihre sexuelle Implikation bleiben wie im Griechischen indirekt, aber erkennbar.
theological_decisions:
- issue: Im englischen POB enthaltenes Sündenbekenntnis und Verschweigen aus Scham
  choice: Nicht in den Haupttext aufgenommen
  alternative: »Und ich verstand, dass ich gesündigt hatte, und machte die Sache aus Scham nicht öffentlich bekannt.«
  rationale: Diese Aussagen stehen nicht im vorgelegten griechischen Quelltext. Eine quellengründete Übersetzung darf sie nicht aus der englischen Konsultationsschicht ergänzen.
- issue: Subjekt von ἐνόμιζον
  choice: »sie meinten« mit Bezug auf die Leute in der Stadt
  alternative: »ich meinte« gemäß der englischen Erzählperspektive
  rationale: Die griechische Verbform ist dritte Person Plural und setzt das zuvor genannte städtische Kollektiv als Subjekt fort.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Übersetzung folgt dem vorgelegten griechischen Text statt den nicht belegten Erweiterungen der englischen Konsultationsfassung. Der Fußnotenmarker ist im Haupttext nach »Prostituierte« zu setzen.
