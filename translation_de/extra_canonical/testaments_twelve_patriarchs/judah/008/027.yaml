source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Φυλάξασθε οὖν, τέκνα μου, ἀπὸ τῆς πορνείας *καὶ τῆς φιλαργυρίας, καὶ ἀκούσατε Ἰούδα τοῦ πατρὸς ὑμῶν.
  language: Greek
  note: Greek from Charles XVIII.2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/027.yaml
  text: Therefore keep yourselves, my children, from sexual immorality and from the love of money, and listen to Judah your father.
translation:
  language: de
  text: Hütet euch daher, meine Kinder, vor sexueller Unmoral und vor Geldgier, und hört auf Juda, euren Vater.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: Hütet euch
  rationale: Gibt den medialen Imperativ mit dem Sinn wieder, sich wachsam von etwas fernzuhalten.
- source_word: πορνείας
  choice: sexueller Unmoral
  rationale: Der breite Ausdruck bezeichnet unerlaubtes sexuelles Verhalten; die Wiedergabe vermeidet eine unbegründete Verengung auf einen einzelnen Tatbestand.
- source_word: φιλαργυρίας
  choice: Geldgier
  rationale: Bezeichnet wörtlich die Liebe zum Geld und wird im modernen Deutschen natürlich und prägnant als „Geldgier“ wiedergegeben.
- source_word: ἀκούσατε
  choice: hört auf
  rationale: Im Zusammenhang väterlicher Ermahnung bedeutet das Verb nicht nur akustisches Hören, sondern aufmerksam zuhören und Rat annehmen.
- source_word: Ἰούδα τοῦ πατρὸς ὑμῶν
  choice: Juda, euren Vater
  rationale: Bewahrt die Selbstbezeichnung des Sprechers und gibt die griechische Apposition natürlich wieder.
theological_decisions: []
