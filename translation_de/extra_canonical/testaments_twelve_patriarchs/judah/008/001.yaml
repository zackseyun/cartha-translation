revisions:
- from: Zu ihm war ich gekommen und hielt mich dort auf. Da kam Barsaba, der König von Adullam, und veranstaltete für uns ein Trinkgelage. Nachdem er mir zugeredet hatte[a], gab er mir seine Tochter namens Saba zur Frau.
  to: Bei ihm hielt ich mich auf. Zu mir kam der König von Adullam, Barsaba, und veranstaltete für uns ein Trinkgelage. Nachdem er mir zugeredet hatte[a], gab er mir seine Tochter namens Saba zur Frau.
  rationale: Die Revision beseitigt eine mögliche Unklarheit bei der Ankunft Barsabas, reduziert die stilistisch störende Wiederholung von „kam“, wahrt die knappe und etwas unebene Erzählbewegung des Griechischen und formuliert den Hinweis zur markierten Stelle textkritisch vorsichtiger. Namen und die Eheformel bleiben am griechischen Text ausgerichtet.
