  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/001.yaml
  text: And while I was there, Barshaba, the king of Adullam, entertained us and made a drinking feast for us; and when he urged me, he gave me his daughter, whose name was Shua, as a wife.
translation:
  language: de
  text: Bei ihm hielt ich mich auf. Zu mir kam der König von Adullam, Barsaba, und veranstaltete für uns ein Trinkgelage. Nachdem er mir zugeredet hatte[a], gab er mir seine Tochter namens Saba zur Frau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch „mich gebeten“, „mich aufgefordert“ oder „mich ermuntert hatte“ bedeuten. Die Stelle ist im überlieferten griechischen Text auffällig markiert.
    reason: Die Fußnote erklärt den Bedeutungsumfang von παρακαλέσας und weist zurückhaltend auf die editorisch markierte Schwierigkeit hin, ohne eine nicht näher belegte textkritische Diagnose zu behaupten.
lexical_decisions:
- source_word: Πρὸς ὃν ἐλθὼν ἤμην
  choice: Zu ihm war ich gekommen und hielt mich dort auf
  rationale: Die griechische Wendung ist knapp und etwas unbeholfen. Die Übersetzung gibt sowohl die Ankunft bei der zuvor genannten Person als auch das dortige Verweilen wieder, ohne den Bezug eigenmächtig zu bestimmen.
- source_word: Βαρσαβὰ
  choice: Barsaba
  rationale: Der griechische Eigenname wird möglichst lautnah ins Deutsche übertragen; die abweichende Namensform der englischen Konsultationsschicht wird nicht zur Grundlage gemacht.
- source_word: ἐποίησεν ἡμῖν πότον
  choice: veranstaltete für uns ein Trinkgelage
  rationale: Wörtlich steht, dass er „für uns ein Trinken“ machte. „Trinkgelage“ gibt den festlichen gemeinschaftlichen Anlass natürlich und prägnant wieder.
- source_word: παρακαλέσας
  choice: Nachdem er mir zugeredet hatte
  rationale: Das Partizip kann je nach Zusammenhang auffordern, bitten, ermuntern oder zureden bedeuten. „Zureden“ bewahrt die erkennbare Einflussnahme, ohne ihren genauen Ton festzulegen.
- source_word: Σαβά
  choice: Saba
  rationale: Die Übersetzung folgt unmittelbar der im vorgelegten griechischen Text bezeugten Namensform und ersetzt sie nicht durch die harmonisierende Form „Schua“.
- source_word: εἰς γυναῖκα
  choice: zur Frau
  rationale: Dies ist die natürliche deutsche Entsprechung für die Aufnahme in die Ehe.
