id: T12P.JUD.8.3
reference: Testament of Judah 8:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἤθελον δὲ *καὶ τὸν Σηλὼμ δοῦναι αὐτῇ, ἀλλ᾽ ἡ *μήτηρ αὐτοῦ οὐκ ἀφῆκεν. Ἐπονηρεύσατο γὰρ, ὅτι οὐκ ἦν ἐκ †τῶν θυγατέρων τῶν Χαναναίων ὡς καὶ αὐτή.
  language: Greek
  note: 'Greek from Charles X.6 (α): Judah refuses to give Tamar to Shelah. Project ch.8 is a thematic consolidation; this verse re-flows narrative content from Charles ch.X.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/003.yaml
  text: And Shelah lived, and I did not give Tamar to him as wife. For I said, "Lest he also die like his brothers." For I did not know that the Lord was judging me because of the things I had done at Timnah to my father Jacob and to Joseph.
translation:
  language: de
  text: Ich wollte ihr auch Schela zum Mann geben, aber seine Mutter ließ es nicht zu. Sie handelte nämlich böse, weil Tamar nicht wie sie selbst zu den Töchtern der Kanaaniter gehörte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „weil sie nicht von den Töchtern der Kanaaniter war wie auch sie selbst“. Gemeint ist: Tamar war anders als Schelas Mutter keine Kanaaniterin.'
    reason: Die griechische Formulierung arbeitet mit zwei weiblichen Bezügen und wäre bei formgleicher Wiedergabe im Deutschen leicht missverständlich.
lexical_decisions:
- source_word: τὸν Σηλὼμ
  choice: Schela
  rationale: Die griechische Namensform bezeichnet Schela, den aus Genesis 38 bekannten Sohn Judas; verwendet wird die geläufige deutsche Namensform.
- source_word: δοῦναι αὐτῇ
  choice: ihr … zum Mann geben
  rationale: Der unmittelbare Erzählzusammenhang handelt von der beabsichtigten Heirat mit Tamar; „zum Mann“ macht die im Griechischen vorausgesetzte Beziehung natürlich und eindeutig.
- source_word: οὐκ ἀφῆκεν
  choice: ließ es nicht zu
  rationale: Gibt die verhindernde Bedeutung idiomatisch wieder, ohne einen im Griechischen nicht genannten konkreten Zwang hinzuzufügen.
- source_word: Ἐπονηρεύσατο
  choice: Sie handelte … böswillig
  rationale: Bewahrt die deutliche moralische Wertung des Verbs und lässt offen, auf welche konkrete Weise Schelas Mutter die Heirat verhinderte.
- source_word: τῶν θυγατέρων τῶν Χαναναίων
  choice: zu den Töchtern der Kanaaniter
  rationale: Nahe Wiedergabe der griechischen Herkunfts- beziehungsweise Gruppenzuordnung.
theological_decisions:
- issue: Abweichung der englischen Konsultationsfassung vom überlieferten griechischen Ausgangstext
  choice: 'Der griechische Text wird unmittelbar übersetzt: Judas wollte Schela Tamar geben, wurde aber von Schelas Mutter daran gehindert.'
  alternative: Die englische Fassung übernehmen, nach der Judas Tamar aus Todesfurcht nicht Schela gab und darin ein göttliches Gericht verkannte.
  rationale: Die bereitgestellte griechische Quelle enthält weder Judas’ Todesfurcht noch die Aussage über das Gericht des Herrn und Timna. Diese Inhalte dürfen nicht gegen die Primärquelle in den Vers eingeführt werden.
- issue: Bezug des unausgesprochenen Subjekts bei Ἐπονηρεύσατο
  choice: „Sie“ bezieht sich auf Schelas Mutter.
  alternative: Das Verb unpersönlich oder auf eine andere Frau beziehen.
  rationale: Das unmittelbar vorausgehende Subjekt ἡ μήτηρ αὐτοῦ legt die Fortführung mit Schelas Mutter grammatisch und narrativ am nächsten.
- issue: Explizite Nennung Tamars im Begründungssatz
  choice: „Tamar“ wird zur natürlichen deutschen Klärung des ausgelassenen griechischen Subjekts eingesetzt.
  alternative: Nur „sie“ verwenden.
  rationale: Im Griechischen ist die gemeinte Frau aus αὐτῇ und dem Kontext erschließbar; im Deutschen würde eine weitere weibliche Pronomenform neben „seiner Mutter“ leicht zu einer falschen Zuordnung führen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am knappen griechischen Erzählstil; erklärende Ergänzungen werden auf das für die deutsche Verständlichkeit nötige Maß beschränkt.
