source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὁ γὰρ ἄγγελος Κυρίου εἶπέ μοι· Αὐτὸν ὑπὲρ σὲ ἐξελέξατο Κύριος προσεγγίζειν αὐτῷ, καὶ ἐσθίειν τὴν τράπεζαν αὐτοῦ, καὶ ἀπαρχὰς αὐτῷ προσφέρειν ἐντρυφημάτων υἱῶν Ἰσραήλ. *Σὺ δὲ ἔσῃ βασιλεὺς Ἰακὼβ.
  language: Greek
  note: Greek from Charles XXI.5 (α). The project English's closing simile 'as a lion' (ὡς λέων) does not appear in α here; α has only 'βασιλεὺς Ἰακὼβ' ('king of Jacob'). The lion image draws on the broader testamentary tradition (cf. apocalyptic 'lion' imagery in ch.XXIV-XXV). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/039.yaml
  text: For the angel of the Lord said to me, "The Lord chose Levi before you, to be near him, and for you to be king with him, as a lion."
translation:
  language: de
  text: 'Denn der Engel des Herrn sagte zu mir: »Ihn hat der Herr dir vorgezogen, damit er ihm nahe, an seinem Tisch esse und ihm Erstlingsgaben von den Köstlichkeiten der Söhne Israels darbringe. Du aber wirst König über Jakob sein.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die vorliegende griechische Fassung hat am Schluss nur: »Du aber wirst König über Jakob sein.« Sie enthält weder »mit ihm« noch den Vergleich »wie ein Löwe«. Mit »ihn« ist dem Zusammenhang nach Levi gemeint.'
    reason: Dokumentiert die wesentlichen Abweichungen der griechischen Quelle von der englischen Konsultationsfassung und erläutert den im Haupttext bewusst bewahrten Pronomenbezug.
lexical_decisions:
- source_word: Αὐτὸν
  choice: Ihn
  rationale: Das Pronomen bleibt wie im griechischen Ausgangstext ohne ausdrücklich genannten Bezug; aus dem weiteren Zusammenhang ist Levi gemeint, doch wird dies nicht stillschweigend in den Haupttext eingesetzt.
- source_word: ὑπὲρ σὲ
  choice: an deiner Stelle
  rationale: Gibt hier die Bevorzugung beziehungsweise Erwählung des anderen gegenüber Juda natürlich wieder; die Wendung ist wörtlich mehrdeutig und kann auch »vor dir« bedeuten.
- source_word: προσεγγίζειν αὐτῷ
  choice: ihm zu nahen
  rationale: Bewahrt den kultischen Klang des Nahens zu Gott, ohne ihn durch eine bloß räumliche Formulierung abzuschwächen.
- source_word: ἐσθίειν τὴν τράπεζαν αὐτοῦ
  choice: an seinem Tisch zu essen
  rationale: Natürliches Deutsch für die griechische Wendung »seinen Tisch essen«.
- source_word: ἀπαρχὰς ... ἐντρυφημάτων
  choice: Erstlingsgaben von den Köstlichkeiten
  rationale: ἀπαρχαί bezeichnet kultische Erstlingsgaben; ἐντρυφήματα meint erfreuliche, kostbare Speisen oder Genüsse.
- source_word: υἱῶν Ἰσραήλ
  choice: der Söhne Israels
  rationale: Formale, im testamentarischen Register angemessene Wiedergabe der kollektiven Bezeichnung.
- source_word: βασιλεὺς Ἰακώβ
  choice: König über Jakob
  rationale: Das artikellose Genitivattribut wird idiomatisch als Herrschaft über Jakob verstanden; »Jakob« bezeichnet hier das Volk.
theological_decisions:
- issue: Identität des mit Αὐτόν bezeichneten Erwählten
  choice: Im Haupttext nur »Ihn«
  alternative: »Levi«
  rationale: Obwohl der Kontext Levi erkennen lässt und die englische Konsultationsfassung ihn nennt, enthält der vorgelegte griechische Wortlaut nur das Pronomen. Die Übersetzung wahrt diese Textgestalt.
- issue: Verhältnis von priesterlicher und königlicher Erwählung
  choice: Levis kultische Aufgaben und Judas Königtum werden als getrennte Aussagen wiedergegeben
  alternative: »für dich, mit ihm König zu sein«
  rationale: 'Der griechische Text sagt zunächst, dass der Erwählte Gott naht, an seinem Tisch isst und Erstlingsgaben darbringt; danach folgt eigenständig: »Du aber wirst König über Jakob sein.« Eine gemeinsame Königsherrschaft »mit ihm« steht nicht im Ausgangstext.'
- issue: Löwenbild am Versende
  choice: Nicht in den Haupttext aufgenommen
  alternative: »wie ein Löwe«
  rationale: ὡς λέων fehlt in der angegebenen griechischen Fassung α. Das traditionsgeschichtlich passende Bild darf nicht ohne Handschriftenbeleg in diesen Vers eingefügt werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht kultischem Ton. »Ihm nahen«, »Erstlingsgaben« und »Söhne Israels« erhalten die religiöse und testamentarische Sprachwelt, ohne unnötig altertümlich zu wirken. Die direkte Rede ist klar gegliedert; echte Unbestimmtheit des griechischen Pronomens bleibt erhalten.
