revisions:
- from: 'Denn der Engel des Herrn sagte zu mir: »Ihn hat der Herr an deiner Stelle erwählt, ihm zu nahen, an seinem Tisch zu essen und ihm die Erstlingsgaben von den Köstlichkeiten der Söhne Israels darzubringen. Du aber wirst König über Jakob sein.«[a]'
  to: 'Denn der Engel des Herrn sagte zu mir: »Ihn hat der Herr dir vorgezogen, damit er ihm nahe, an seinem Tisch esse und ihm Erstlingsgaben von den Köstlichkeiten der Söhne Israels darbringe. Du aber wirst König über Jakob sein.«[a]'
  rationale: Die einzige erforderliche Änderung vermeidet die nicht vom Griechischen geforderte Vorstellung einer Stellvertretung oder Ablösung Judas. Die finalen Infinitive werden im Deutschen als Finalsatz wiedergegeben; dadurch bleibt klar, dass die drei kultischen Handlungen dem Erwählten zukommen. Die Fußnote bleibt notwendig, weil die englische Konsultationsfassung nicht belegte Zusätze am Versschluss enthält.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:14:01Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Satzfolge, die kultischen Aufgaben des Erwählten und die abschließende Zusage des Königtums im Wesentlichen quellentreu wieder. »An deiner Stelle« für ὑπὲρ σέ ist jedoch zu stark, weil es im Deutschen eine Ersetzung Judas durch Levi nahelegt; der griechische Ausdruck bezeichnet hier vorrangig Vorordnung bzw. Bevorzugung.
  naturalness: Der Stil ist modernes, würdiges Standarddeutsch. »Dir vorgezogen« ist sowohl idiomatischer als auch semantisch genauer als »an deiner Stelle«; die übrigen kultisch geprägten Formulierungen sind verständlich und angemessen.
  terminology: »Engel des Herrn«, »Erstlingsgaben«, »Söhne Israels« und »König über Jakob« sind tragfähige Wiedergaben. Das unbestimmte Pronomen »ihn« bleibt im Haupttext entsprechend der griechischen Textgestalt erhalten; die Fußnote erläutert den kontextuellen Bezug auf Levi. Der nicht belegte Zusatz »mit ihm, wie ein Löwe« wird zu Recht nicht übernommen.
  issues:
  - severity: medium
    issue: ὑπὲρ σέ ist mit »an deiner Stelle« wiedergegeben.
    rationale: Die deutsche Wendung besagt gewöhnlich, dass jemand Judas ersetzt. Im Kontext und in dieser Konstruktion ist vielmehr gemeint, dass der Erwählte Juda vorgeordnet bzw. ihm vorgezogen wurde. Die getrennte königliche Verheißung an Juda bestätigt, dass keine Ersetzung ausgesagt wird.
