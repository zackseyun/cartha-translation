source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Στερίσκει τὴν ψυχὴν αὐτοῦ ἀπὸ πάσης ἀγαθότητος, καὶ συνέχει αὐτὸν ἐν πόνοις καὶ μόχθοις, *τὸν ὕπνον ἐκδιδάσκει ἀπ᾽ αὐτοῦ, καὶ καταδαπανᾷ τὰς σάρκας αὐτοῦ.
  language: Greek
  note: Greek from Charles XVIII.4 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/029.yaml
  text: They deprive his soul of every goodness and oppress him with toils and troubles, and drive sleep away from him and devour his flesh.
translation:
  language: de
  text: Sie beraubt seine Seele jeder Güte, hält ihn in Schmerzen und Mühen gefangen, vertreibt ihm den Schlaf und zehrt sein Fleisch auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Στερίσκει
  choice: raubt
  rationale: Gibt den starken Sinn von Entzug oder Beraubung natürlich und prägnant wieder.
- source_word: τὴν ψυχὴν αὐτοῦ
  choice: seiner Seele
  rationale: Bewahrt die anthropologische Ausdrucksweise des griechischen Textes, ohne sie psychologisch einzuengen.
- source_word: ἀπὸ πάσης ἀγαθότητος
  choice: alles Gute
  rationale: Natürliches modernes Deutsch für den umfassenden Entzug jeder Güte beziehungsweise alles Guten.
- source_word: συνέχει αὐτὸν
  choice: hält ihn … gefangen
  rationale: Bringt das Bedrängen und Festhalten durch die Mühen stärker zum Ausdruck als ein bloßes „belastet“.
- source_word: ἐν πόνοις καὶ μόχθοις
  choice: in Mühen und Beschwerden
  rationale: Erhält die Doppelung von schmerzlicher Belastung und anstrengender Arbeit in verständlichem Deutsch.
- source_word: τὸν ὕπνον ἐκδιδάσκει ἀπ᾽ αὐτοῦ
  choice: vertreibt ihm den Schlaf
  rationale: Die ungewöhnliche griechische Wendung meint dem Zusammenhang nach, dass der Schlaf von ihm weicht; die idiomatische deutsche Formulierung wahrt dieses Bild.
- source_word: καταδαπανᾷ τὰς σάρκας αὐτοῦ
  choice: zehrt seinen Leib auf
  rationale: „Aufzehren“ bewahrt die intensive Bedeutung des Verbs; „Leib“ gibt den pluralischen griechischen Ausdruck für das körperliche Dasein natürlich wieder.
theological_decisions:
- issue: Numerus des handelnden Subjekts
  choice: Singular „Sie“
  alternative: Plural „Sie“ entsprechend der englischen Konsultationsfassung
  rationale: Alle finiten Verben des griechischen Ausgangstextes stehen im Singular. Das feminine Pronomen verweist auf die im Kontext genannte Macht oder Leidenschaft, wahrscheinlich die Geldgier, ohne den Bezug im Vers selbst ausdrücklich festzulegen.
- issue: Wiedergabe von ψυχή
  choice: Seele
  alternative: Leben oder Inneres
  rationale: „Seele“ erhält die traditionelle und im Kontext passende Mehrdeutigkeit von ψυχή, statt den Begriff auf körperliches Leben oder Innenleben zu reduzieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kräftigen Verben und klarer Satzbewegung. Der Singular des griechischen Textes wurde gegen den Plural der englischen Konsultationsfassung beibehalten; die genaue Bezugsgröße des femininen Subjekts wird nicht in den Vers hineinerklärt.
