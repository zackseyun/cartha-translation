- from: Sie raubt seiner Seele alles Gute, hält ihn in Mühen und Beschwerden gefangen, vertreibt ihm den Schlaf und zehrt seinen Leib auf.
  to: Sie beraubt seine Seele jeder Güte, hält ihn in Schmerzen und Mühen gefangen, vertreibt ihm den Schlaf und zehrt sein Fleisch auf.
  rationale: Die Revision behält den vom griechischen Text geforderten Singular und die zurückhaltende feminine Bezugnahme bei. Sie präzisiert die Doppelformel πόνοις καὶ μόχθοις als „Schmerzen und Mühen“ und bewahrt mit „Fleisch“ das konkrete Bild von σάρκες. Die englische Audit-Fassung verwendet zwar den Plural „They“, bietet gegenüber den singularischen griechischen Verbformen jedoch keinen Grund, den deutschen Singular aufzugeben.
