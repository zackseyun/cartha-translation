    issue: „Beschwerden“ für πόνοις
    rationale: πόνοις bezeichnet Schmerzen, Leiden oder Mühsale; „Beschwerden“ ist möglich, schwächt aber die Schmerzdimension und überlappt stark mit „Mühen“ für μόχθοις.
  - severity: medium
    issue: „Leib“ für τὰς σάρκας
    rationale: Der griechische Ausdruck benennt das Fleisch; „Leib“ ist weiter und lässt das konkrete Bild des Aufzehrens von Fleisch verblassen.
  - severity: low
    issue: Konstruktion „raubt seiner Seele alles Gute“
    rationale: Die Formulierung ist verständlich, doch „beraubt seine Seele jeder Güte“ ist im Deutschen idiomatischer und entspricht der griechischen Entzugsstruktur präziser.
  revised_text: Sie beraubt seine Seele jeder Güte, hält ihn in Schmerzen und Mühen gefangen, vertreibt ihm den Schlaf und zehrt sein Fleisch auf.
