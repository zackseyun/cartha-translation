  text: VIII. *Ἦσαν δέ μοι¹ κτήνη πολλά, καὶ *εἶχον ἀρχιποίμενα² Ἱρὰμ³ τὸν Ὀδολομίτην⁴. 2. Πρὸς ὃν ἐλθὼν⁵ ἤμην, καὶ ἦλθεν Βαρσαβὰ⁶ τὸν⁷ βασιλεὺς⁸ Ὀδολλὰμ⁹, καὶ¹⁰ ἐποίησεν ἡμῖν πότον¹², καὶ †παρακαλέσας¹³ δέδωκέ¹⁴ μοι τὴν θυγατέρα αὐτοῦ¹⁵ *ὀνόματι Σαβά¹⁶ εἰς γυναῖκα. 3. Αὕτη¹⁷ ἔτεκέν μοι τὸν Ἦρ¹⁸ καὶ τὸν¹⁹ Αὐνὰν καὶ τὸν²⁰ Σηλώμ²¹. *Καὶ τοὺς μὲν δύο²² ἀνεῖλεν²³ Κύριος· ὁ γὰρ Σηλὼμ ἔζησεν²⁴.
  text_scope: related_parent_record_source
  language: Greek
  note: Project verse 8:40 ('be not lifted up over Levi, nor against me, but honor in full the Lord in both, and among men draw near to Levi') is a project paraphrase that consolidates the 'do not exalt yourselves' theme of Charles XXI.1 with the 'draw near' (προσεγγίζειν) language of XXI.5, plus an addition ('honor the Lord in both') with no direct α counterpart. The α-text proceeds at XXI.6 to 'Καὶ ἔσῃ ἐν αὐτοῖς ὡς ἡ θάλασσα...' rather than this exhortation. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/040.yaml
  text: Therefore be not lifted up over Levi, nor against me, but honor in full the Lord in both, and among men draw near to Levi.
translation:
  language: de
  text: Darum erhebt euch weder über Levi noch gegen mich, sondern ehrt den Herrn in beiden voll und ganz; und unter den Menschen naht euch Levi.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Dieser Projektvers hat im griechischen α-Text keinen direkten Gegenpart. Er verbindet das Thema „Erhebt euch nicht“ aus 21,1 mit der Sprache des Nahens aus 21,5. Die Worte „ehrt den Herrn in beiden voll und ganz“ sind dort nicht belegt; in 21,6 fährt der α-Text stattdessen fort: „Und du wirst unter ihnen sein wie das Meer …“'
    reason: 'Textkritische Transparenz: Die deutsche Fassung darf die zusammengestellte Projektparaphrase nicht als unmittelbar überlieferten griechischen Wortlaut ausgeben.'
lexical_decisions:
- source_word: προσεγγίζειν (XXI.5)
  choice: naht euch
  rationale: Gibt die ausdrücklich belegte Bedeutung „sich nähern/nahen“ wieder und bewahrt den mahnenden, würdevollen Ton.
- source_word: be not lifted up (Projektformulierung nach dem Thema von XXI.1)
  choice: erhebt euch nicht
  rationale: Natürliches modernes Deutsch, das sowohl Selbstüberhebung als auch den bildlichen Gegensatz zu Levi offenhält.
- source_word: in both (Projektformulierung ohne direkten α-Beleg)
  choice: in beiden
  rationale: Bewahrt die genuine Unbestimmtheit des englischen Konsultationstextes, statt „beide“ eigenmächtig als Personen, Ämter oder Bereiche auszulegen.
theological_decisions:
- issue: Das Verhältnis zu Levi und zum Sprecher
  choice: „weder über Levi noch gegen mich“
  alternative: „stellt euch weder über Levi noch gegen mich“
  rationale: Die gewählte Form folgt der parallelen Struktur des Projekttextes und vermeidet eine zusätzliche Deutung dessen, worin das Sich-Erheben besteht.
- issue: „ehrt in beiden den Herrn“ ohne direkten α-Textbeleg
  choice: Im Haupttext beibehalten und textkritisch offen kennzeichnen
  alternative: Aus dem Haupttext streichen
  rationale: Die Zeile gehört zum vorgegebenen Projektvers, darf aber nicht als direkt bezeugter Wortlaut des griechischen α-Zeugen dargestellt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Naht euch“ ist bewusst leicht gehoben, aber allgemein verständlich und entspricht der paränetischen Sprache. Die ungewöhnliche Wendung „in beiden“ bleibt erhalten, um die unaufgelöste Referenz des Projekttextes nicht konfessionell oder dogmatisch festzulegen.
