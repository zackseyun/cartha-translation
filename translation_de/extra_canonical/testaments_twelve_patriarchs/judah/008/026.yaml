    issue: Konstruktion von κατακυριεύουσιν
    rationale: Das Verb bezeichnet Herrschaft über eine Person; „über den Armen herrschen“ gibt dies im Deutschen präziser und natürlicher wieder als „den Armen beherrschen“.
  - severity: low
    issue: Wiedergabe der schwierigen Schlussgruppe
    rationale: „in seiner Armut“ deutet die griechische Genitivverbindung leicht um. „die geringste Stütze seiner Armut“ bleibt näher an der überlieferten, syntaktisch holprigen Formulierung und wahrt deren Kürze.
  revised_text: Und der Engel Gottes zeigte mir, dass Frauen Macht über den König haben und über den Armen herrschen. Dem König nehmen sie den Ruhm, dem Mann die Kraft und dem Armen selbst die geringste Stütze seiner Armut.
