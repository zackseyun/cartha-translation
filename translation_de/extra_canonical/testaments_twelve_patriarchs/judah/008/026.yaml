source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ἔδειξέ μοι ὁ ἄγγελος τοῦ Θεοῦ ὅτι αἱ γυναῖκες κρατοῦσι τοῦ βασιλέως καὶ τοῦ πτωχοῦ κατακυριεύουσιν αἱ γυναῖκες, *τοῦ μὲν βασιλέως αἴρουσιν τὴν δόξαν τοῦ ἀνδρὸς τὴν δύναμιν, *τοῦ δὲ πτωχοῦ *τὴν πτωχείας ἐλάχιστον στήριγμα.
  language: Greek
  note: Greek from Charles XV.5 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/026.yaml
  text: And the angel of God showed me that women rule forever over king and beggar alike. From a king they take away his glory, and from a strong man his strength, and from a beggar even the little support of his poverty.
translation:
  language: de
  text: Und der Engel Gottes zeigte mir, dass Frauen Macht über den König haben und über den Armen herrschen. Dem König nehmen sie den Ruhm, dem Mann die Kraft und dem Armen selbst die geringste Stütze seiner Armut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κρατοῦσι τοῦ βασιλέως
  choice: Macht über den König haben
  rationale: κρατεῖν mit Genitiv bezeichnet hier das Gewalthaben beziehungsweise Herrschen über jemanden; die Wendung wird in natürlichem modernem Deutsch wiedergegeben.
- source_word: κατακυριεύουσιν
  choice: beherrschen
  rationale: Das Verb bezeichnet ein entschiedenes Herrschen über jemanden. „Beherrschen“ bewahrt den starken Sinn, ohne ihn zusätzlich auszudeuten.
- source_word: δόξαν
  choice: Ruhm
  rationale: δόξα kann Ruhm, Ehre oder Herrlichkeit bedeuten. Im Zusammenhang mit einem König ist „Ruhm“ eine natürliche und quellennahe Wiedergabe.
- source_word: τοῦ ἀνδρὸς τὴν δύναμιν
  choice: dem Mann die Kraft
  rationale: ἀνήρ bedeutet ausdrücklich „Mann“, nicht „starker Mann“; δύναμις wird hier konkret mit „Kraft“ wiedergegeben.
- source_word: τὴν πτωχείας ἐλάχιστον στήριγμα
  choice: selbst die geringste Stütze in seiner Armut
  rationale: Die griechische Formulierung ist grammatisch holprig, doch der Sinn weist auf den äußerst geringen Halt beziehungsweise Unterhalt hin, der dem Armen in seiner Armut noch bleibt.
theological_decisions:
- issue: Reichweite der Aussage über Frauen
  choice: Die pauschale Formulierung des griechischen Textes wird bewahrt.
  alternative: Die Aussage auf bestimmte verführerische Frauen oder auf Judas persönliche Erfahrung beschränken.
  rationale: Der vorliegende griechische Wortlaut sagt allgemein „die Frauen“ und enthält in diesem Satz keine ausdrückliche Einschränkung. Eine solche Einschränkung wäre interpretierende Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zugespitzte und spannungsreiche Aussage des Ausgangstextes bleibt erhalten. Das im englischen Konsultationstext stehende „forever“ wurde nicht übernommen, da dafür im vorgelegten griechischen Wortlaut keine Entsprechung steht; ebenso wurde ἀνήρ nicht zu „starker Mann“ erweitert.
