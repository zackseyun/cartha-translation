revisions:
- from: Und der Engel Gottes zeigte mir, dass Frauen Macht über den König haben und den Armen beherrschen. Dem König nehmen sie den Ruhm, dem Mann die Kraft und dem Armen selbst die geringste Stütze in seiner Armut.
