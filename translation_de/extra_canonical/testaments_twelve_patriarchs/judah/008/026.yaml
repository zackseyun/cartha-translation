  rationale: 'Die Revision beschränkt sich auf zwei sichere sprachlich-semantische Anpassungen: die idiomatische Wiedergabe der Herrschaft über den Armen und eine näher am schwierigen griechischen Wortlaut bleibende Übersetzung der letzten Nominalgruppe. Die textliche Mehrdeutigkeit des Schlusses wird nicht durch eine erklärende Ergänzung aufgelöst.'
