source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὁ πορνεύσας γυμνούμενος οὐκ αἰσθάνεται καὶ ἀδοξῶν οὐκ αἰσχύνεται. 2. Κἂν γάρ τις *βασιλεὺς ἐστι καὶ πορνεύῃ, γυμνοῦται τῆς βασιλείας, δουλεύσας τῇ πορνείᾳ ὡς κἀγὼ ἔπαθον.
  language: Greek
  note: Greek from Charles XV.1-2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/023.yaml
  text: One who commits sexual immorality does not know when he suffers loss, and he is not ashamed when dishonored. For even if a man is a king and commits sexual immorality, he is stripped of his kingship by becoming a servant to sexual immorality, as I myself also suffered.
translation:
  language: de
  text: Wer Unzucht treibt, merkt nicht, dass er entblößt wird, und schämt sich nicht, wenn er entehrt wird. Denn selbst wenn jemand König ist und Unzucht treibt, wird er seiner Königsherrschaft entkleidet, weil er der Unzucht zum Sklaven geworden ist – so, wie es auch mir ergangen ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ πορνεύσας / πορνεύῃ
  choice: Wer Unzucht treibt / Unzucht treibt
  rationale: „Unzucht treiben“ gibt die sexuelle Bedeutung von πορνεύω in einem würdigen, verständlichen Register wieder, ohne sie unnötig auf Ehebruch oder Prostitution einzuengen.
- source_word: γυμνούμενος / γυμνοῦται
  choice: entblößt wird / wird … entkleidet
  rationale: Die Bildsprache des griechischen Wortstamms wird an beiden Stellen bewahrt. Im zweiten Satz bezeichnet der Genitiv τῆς βασιλείας ausdrücklich das, dessen der König beraubt wird.
- source_word: ἀδοξῶν
  choice: wenn er seine Ehre verliert
  rationale: Das Partizip beschreibt Ehrverlust beziehungsweise Entehrung. Die Formulierung ist im Deutschen natürlicher als „ehrlos werdend“, ohne die Aussage auf bloßes öffentliches Ansehen zu reduzieren.
- source_word: βασιλείας
  choice: Königsherrschaft
  rationale: Die Wahl hält die mögliche Bedeutung von βασιλεία als Herrschaft oder Königtum fest und vermeidet die räumliche Bedeutung „Königreich“, die hier weniger wahrscheinlich ist.
- source_word: δουλεύσας τῇ πορνείᾳ
  choice: weil er sich zum Sklaven der Unzucht macht
  rationale: Die harte Knechtschaftsmetapher von δουλεύω bleibt erhalten; der Aorist wird im deutschen Satz idiomatisch als begründende Handlung wiedergegeben.
- source_word: ὡς κἀγὼ ἔπαθον
  choice: so, wie es auch mir ergangen ist
  rationale: Die Selbstaussage und das Moment eigenen Erleidens werden natürlich wiedergegeben, ohne einen über das Griechische hinausgehenden konkreten Schaden festzulegen.
theological_decisions:
- issue: Verhältnis von sexueller Verfehlung, Ehrverlust und Herrschaftsverlust
  choice: Die kausale Verbindung und die Knechtschaftsmetapher werden deutlich bewahrt.
  alternative: Den Herrschaftsverlust nur als allgemeine moralische Schwächung umschreiben.
  rationale: Der griechische Text formuliert zugespitzt, dass selbst ein König durch den Dienst an der Unzucht seiner Herrschaft entkleidet wird. Diese Spannung darf nicht abgeschwächt oder als feste konfessionelle Lehre systematisiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Bildsprache von Entblößung und Entkleidung sowie die drastische Sklavenmetapher bleiben sichtbar. „Unzucht“ ist bewusst breit gewählt, da πορνεία hier sexuelle Unmoral bezeichnet, ohne im vorliegenden Satz eine engere Kategorie eindeutig festzulegen.
