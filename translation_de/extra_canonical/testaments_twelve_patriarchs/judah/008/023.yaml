review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Aussagefolge und die zentralen Metaphern des griechischen Textes im Wesentlichen zutreffend wieder: Unzucht, unbemerkte Entblößung, Entehrung, Verlust der Königsherrschaft und Knechtschaft gegenüber der Unzucht. Bei δουλεύσας τῇ πορνείᾳ bezeichnet das griechische Partizip jedoch genauer den Zustand bzw. Eintritt in die Knechtschaft („der Unzucht zum Sklaven geworden“), nicht ein reflexives Sich-selbst-Machen.'
  naturalness: Der Text ist flüssiges, würdiges modernes Standarddeutsch. „Entehrt wird“ bildet ἀδοξῶν unmittelbarer ab als „seine Ehre verliert“ und ist in diesem Kontext gleichermaßen natürlich.
  terminology: „Unzucht“ ist als bewusst weiter, registergemäßer Ausdruck für πορνεία/πορνεύω vertretbar. „Königsherrschaft“ gibt βασιλεία hier treffend wieder. Die Sklavenmetapher sollte ohne Abschwächung und ohne reflexive Umdeutung beibehalten werden.
  issues:
  - severity: medium
    issue: „weil er sich zum Sklaven der Unzucht macht“ bei δουλεύσας τῇ πορνείᾳ
    rationale: Die Formulierung deutet ein aktives reflexives Sich-selbst-Machen an. δουλεύσας bedeutet hier „der Unzucht gedient habend/zu ihrem Sklaven geworden“ und führt den Herrschaftsverlust als dessen Folge bzw. Grundlage an.
  - severity: low
    issue: „wenn er seine Ehre verliert“ bei ἀδοξῶν
    rationale: Die Aussage ist sinngemäß möglich, aber „entehrt wird“ folgt dem Partizip enger und bewahrt die passive Betroffenheit parallel zu „entblößt wird“.
  revised_text: Wer Unzucht treibt, merkt nicht, dass er entblößt wird, und schämt sich nicht, wenn er entehrt wird. Denn selbst wenn jemand König ist und Unzucht treibt, wird er seiner Königsherrschaft entkleidet, weil er der Unzucht zum Sklaven geworden ist – so, wie es auch mir ergangen ist.
