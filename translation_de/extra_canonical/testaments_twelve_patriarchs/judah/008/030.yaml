source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Θυσίας Θεοῦ ἐμποδίζει, *καὶ εὐλογίαν Θεοῦ οὐ μνημονεύει. *Προφήτου λαλοῦντος οὐκ ἀκούει, καὶ λόγους εὐσεβείας προσοχθίζει.'
  language: Greek
  note: Greek from Charles XVIII.5 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/030.yaml
  text: And he is hindered from offering sacrifices to God; and he does not remember blessing God; and when he hears a prophet speaking, he is offended and angered.
translation:
  language: de
  text: Er verhindert Opfer für Gott, erinnert sich nicht an Gottes Segen, hört nicht, wenn ein Prophet redet, und nimmt Anstoß an Worten der Frömmigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Θυσίας Θεοῦ ἐμποδίζει
  choice: Er verhindert Opfer für Gott
  rationale: Die aktive Form ἐμποδίζει bedeutet hier wörtlich „er behindert/verhindert“; anders als die englische Konsultationsfassung wird sie nicht passiv wiedergegeben. Der Plural Θυσίας bleibt als „Opfer“ erhalten.
- source_word: εὐλογίαν Θεοῦ οὐ μνημονεύει
  choice: denkt nicht daran, Gott zu preisen
  rationale: εὐλογία kann „Segen“, „Lobpreis“ oder „Segnung“ bezeichnen. Mit Θεοῦ ist die Beziehung grammatisch mehrdeutig; im parallelen religiösen Handlungskontext ist „Gott preisen“ natürlich, ohne eine Erinnerung an empfangenen Segen einzutragen.
- source_word: Προφήτου λαλοῦντος οὐκ ἀκούει
  choice: hört nicht zu, wenn ein Prophet redet
  rationale: Der Genitivus absolutus wird als zeitlicher Nebensatz wiedergegeben. οὐκ ἀκούει kann schlicht „hört nicht“ oder „hört nicht auf ihn“ bedeuten; „hört nicht zu“ bewahrt den Sinn verweigerter Aufmerksamkeit.
- source_word: λόγους εὐσεβείας προσοχθίζει
  choice: ärgert sich über Worte der Gottesfurcht
  rationale: προσοχθίζει bezeichnet Verdruss oder Anstoßnehmen. εὐσέβεια wird im jüdisch-religiösen Zusammenhang treffend als „Gottesfurcht“ wiedergegeben; „Worte“ erhält den Plural λόγους.
theological_decisions:
- issue: Bezug von εὐλογίαν Θεοῦ
  choice: „Gott zu preisen“
  alternative: „an Gottes Segen“ / „an den Lobpreis Gottes“
  rationale: Der griechische Genitiv lässt mehrere Beziehungen zu. Die gewählte verbale Fassung passt zur Reihe unterlassener oder bekämpfter Kult- und Frömmigkeitshandlungen, ohne eine konfessionelle Deutung einzuführen.
- issue: Subjekt und Aktivität bei ἐμποδίζει
  choice: aktives „Er verhindert“
  alternative: passives „Er wird daran gehindert“
  rationale: Die überlieferte griechische Form ist aktiv. Daher folgt die Übersetzung dem Originalsprachentext und nicht der abweichenden englischen Passivfassung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer paralleler Satzstruktur. „Gottesfurcht“ ist hier als allgemein verständlicher religiöser Begriff für εὐσέβεια gewählt; unnötig altertümliche Wendungen wurden vermieden.
