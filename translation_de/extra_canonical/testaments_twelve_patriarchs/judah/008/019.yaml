source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τοιοῦτός ἐστιν ὁ πάροινος, τέκνα μου, ὅτι ὁ μεθύων οὐκ αἰδεῖται οὐδένα. 5. *Ἰδοὺ γὰρ κἀμὲ ἐπλάνησεν μὴ αἰσχυνθῆναι τὸ πλῆθος πόλεως ὅτι ἐν ὀφθαλμῶν πάντων ἐξέκλινα πρὸς τὴν Θαμὰρ, καὶ ἐποίησα ἁμαρτίαν μεγάλην, καὶ ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου.
  language: Greek
  note: Greek from Charles XIV.4-5 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/019.yaml
  text: Such is the drunkard, my children. For the one who is drunk does not reverence anyone. For behold, it made me also transgress the commandment of God, and I went in to Tamar, not being ashamed of the multitude in the city, and before the eyes of all I uncovered the shame of my sons, since I went in to Tamar.
translation:
  language: de
  text: 'So ist es mit dem Trunkenbold, meine Kinder: Wer betrunken ist, kennt vor niemandem Scham. Seht, auch ich wurde dazu verleitet, mich vor der Menge in der Stadt nicht zu schämen: Vor aller Augen wandte ich mich Tamar zu, beging eine große Sünde und deckte die Hülle der Unreinheit meiner Söhne auf.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Wendung »die Hülle der Unreinheit meiner Söhne« ist ungewöhnlich und in ihrer genauen Bedeutung unklar; sie kann darauf zielen, ihre Schande offenzulegen.
    reason: Die Fußnote bewahrt die auffällige Bildsprache und nennt eine mögliche Bedeutung, ohne sie als sicher auszugeben.
lexical_decisions:
- source_word: πάροινος
  choice: Trunkenbold
  rationale: Bezeichnet hier einen vom Wein beherrschten Menschen; die substantivische Wiedergabe passt zur sprichwortartigen Charakterisierung.
- source_word: οὐκ αἰδεῖται οὐδένα
  choice: schämt sich vor niemandem
  rationale: Gibt den Gedanken fehlender Scham oder Scheu gegenüber anderen in natürlichem Deutsch wieder.
- source_word: ἐπλάνησεν
  choice: wurde dazu verleitet
  rationale: Das griechische Verb bedeutet irreführen oder vom rechten Weg abbringen. Da das Subjekt im überlieferten Satz nicht ausdrücklich genannt ist, wahrt die passive Form diese Offenheit.
- source_word: ἐξέκλινα πρὸς τὴν Θαμάρ
  choice: wandte ich mich Tamar zu
  rationale: Bewahrt die zurückhaltende, wörtliche Bewegungsmetapher des Griechischen, ohne den sexuellen Sinn stärker auszudeuten als der Wortlaut.
- source_word: τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου
  choice: die Hülle der Unreinheit meiner Söhne
  rationale: Die ungewöhnliche und schwer deutbare Bildformulierung wird formal erhalten, statt sie stillschweigend als bloße »Schande« zu paraphrasieren.
theological_decisions:
- issue: Im englischen Konsultationstext steht zusätzlich eine Übertretung des Gebots Gottes und zweimal das Eingehen zu Tamar.
  choice: Nur die im vorgelegten griechischen Ausgangstext belegten Aussagen werden übersetzt.
  alternative: Die zusätzlichen Aussagen des englischen POB in den Haupttext aufnehmen.
  rationale: Die Übersetzung folgt vorrangig der originalsprachlichen Quelle; nicht belegte Erweiterungen dürfen nicht aus der englischen Konsultationsschicht importiert werden.
- issue: Deutung der »Hülle der Unreinheit meiner Söhne«
  choice: Das schwierige Bild bleibt im Haupttext erhalten und wird als textlich unklar gekennzeichnet.
  alternative: Eindeutig als »Schande meiner Söhne« oder als konkrete sexuelle Enthüllung wiedergeben.
  rationale: Der griechische Ausdruck ist ungewöhnlich und lässt keine sichere theologische oder narrative Festlegung zu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. Die sprichwortartige Eröffnung ist knapp gehalten; die schwer verständliche Schlussmetapher bleibt bewusst sichtbar.
