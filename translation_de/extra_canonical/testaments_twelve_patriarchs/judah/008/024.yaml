- from: Denn ich gab meinen Stab hin, das heißt die Stütze meines Stammes, und meinen Gürtel, das heißt die Macht, und das Diadem, das heißt die Herrlichkeit meines Königtums.
  to: Denn ich gab meinen Stab, das heißt die Stütze meines Stammes, und meinen Gürtel, das heißt die Macht, und das Diadem, das heißt die Herrlichkeit meines Königtums.
  rationale: Eine minimale Korrektur entfernt die nicht ausdrücklich im griechischen Text enthaltene Zusatznuance von „hingab“. Die Bildsprache, die dreifache Deuteformel und die Ambiguität von βασιλεία bleiben erhalten.
