source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Δέδωκα γὰρ τὴν ῥάβδον μου, τουτέστι τὸ στήριγμα τῆς ἐμῆς φυλῆς, καὶ τὴν ζώνην μου, τουτέστιν τὴν δύναμιν, καὶ τὸ διάδημα, τουτέστιν τὴν δόξαν τῆς βασιλείας μου.
  language: Greek
  note: Greek from Charles XV.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/024.yaml
  text: For I gave my staff, that is, the stay of my tribe; and my girdle, that is, my power; and my diadem, that is, the glory of my kingdom.
translation:
  language: de
  text: Denn ich gab meinen Stab, das heißt die Stütze meines Stammes, und meinen Gürtel, das heißt die Macht, und das Diadem, das heißt die Herrlichkeit meines Königtums.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδον
  choice: Stab
  rationale: Die direkte und im Zusammenhang natürliche Entsprechung; das anschließende Deutewort bezeichnet ihn bildlich als Stütze des Stammes.
- source_word: στήριγμα
  choice: Stütze
  rationale: Bewahrt die konkrete Metapher für Halt, Festigung und tragende Grundlage.
- source_word: φυλῆς
  choice: Stammes
  rationale: Im patriarchalischen Zusammenhang bezeichnet φυλή den Stamm Juda, nicht allgemein eine Volksgruppe.
- source_word: ζώνην
  choice: Gürtel
  rationale: Sachlich genaue, geläufige Wiedergabe des Kleidungsstücks und seines symbolischen Sinns.
- source_word: δύναμιν
  choice: Macht
  rationale: Gibt hier die symbolische Autorität beziehungsweise Kraft des Gürtels wieder, ohne den Sinn unnötig einzuengen.
- source_word: διάδημα
  choice: Diadem
  rationale: Bezeichnet präzise das königliche Herrschaftszeichen und bleibt im modernen Deutschen verständlich.
- source_word: δόξαν τῆς βασιλείας μου
  choice: die Herrlichkeit meines Königtums
  rationale: βασιλεία kann Reich, Herrschaft oder Königtum bedeuten. „Königtum“ hält hier den Bezug auf die königliche Würde und Stellung offen.
theological_decisions:
- issue: Bedeutungsumfang von βασιλεία
  choice: Königtum
  alternative: Königreich / Herrschaft
  rationale: Da das Diadem als Herrlichkeit der königlichen Stellung erklärt wird, passt „Königtum“ zum persönlichen Bezug „meines“, ohne die Aussage auf ein Territorium oder allein auf Herrschaftsausübung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Orientierung an der griechischen Satzstruktur. Die dreifache erklärende Formel τουτέστι wird einheitlich mit „das heißt“ wiedergegeben. „hingab“ verdeutlicht bei Besitz- und Herrschaftszeichen den Verzicht beziehungsweise die Überlassung natürlicher als das isolierte „gab“, ohne ein Objekt hinzuzufügen.
