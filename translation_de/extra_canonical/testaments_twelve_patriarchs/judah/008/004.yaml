  text: And after these things, while Tamar was a widow, and after two years had passed, there was reported to me that she was going up to shear sheep at Timnah. And I also went to shear my sheep.
translation:
  language: de
  text: Nach diesen Ereignissen, nachdem Tamar zwei Jahre Witwe gewesen war, hörte sie, dass ich hinaufzog, um die Schafe zu scheren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ ταῦτα
  choice: Nach diesen Ereignissen
  rationale: Gibt die erzählerische Übergangsformel natürlich und würdevoll wieder.
- source_word: χηρευούσης τῆς Θαμὰρ μετὰ ἔτη δύο
  choice: als Tamar seit zwei Jahren Witwe war
  rationale: Bezieht die Zeitangabe in der naheliegenden griechischen Konstruktion auf Tamars Witwenstand, ohne zusätzliches Geschehen einzutragen.
- source_word: ἀκούσασα
  choice: hörte sie
  rationale: Das feminine Partizip bezieht sich grammatisch auf Tamar.
- source_word: ὅτι ἀνέρχομαι
  choice: dass ich hinaufzog
  rationale: Bewahrt die erste Person des griechischen Textes; im deutschen Erzählzusammenhang ist das Präteritum natürlich.
- source_word: τοῦ κεῖραι τὰ πρόβατα
  choice: um die Schafe zu scheren
  rationale: Gibt den finalen Infinitiv sachgerecht wieder; ein Besitzpronomen steht im überlieferten griechischen Wortlaut nicht.
