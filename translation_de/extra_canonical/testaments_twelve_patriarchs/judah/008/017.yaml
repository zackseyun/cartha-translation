revisions:
- from: Denn der Geist der sexuellen Unmoral nimmt den Wein als Diener für die Lust des Verstandes; denn auch diese beiden bringen den menschlichen Sinn von seinem Weg ab.
  to: Denn der Geist der sexuellen Unmoral hat den Wein als Diener zur Lust des Verstandes; denn diese beiden nehmen dem Menschen auch den Verstand.
  rationale: Die Revision stellt die Besitz- beziehungsweise Dienstmetapher von ἔχει ... ὡς διάκονον unmittelbar dar und entfernt die ergänzte Wegmetapher. Sie bewahrt zugleich die auffällige, nicht weiter aufgelöste Verbindung von Lust und Verstand sowie die mögliche personifizierende Dimension von πνεῦμα.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:13:42Z'
review_pass:
  verdict: revise
  source_fidelity: Die Bildstruktur des ersten Satzes und die personifizierte Rede vom ‚Geist der sexuellen Unmoral‘ sind im Entwurf grundsätzlich zutreffend. ‚nimmt den Wein als Diener‘ ist jedoch für ἔχει ... ὡς διάκονον weniger genau als ‚hat ... als Diener‘. Im zweiten Satz fügt ‚von seinem Weg‘ ein im griechischen Text nicht benanntes Ziel bzw. Bezugselement hinzu. ἀφιστῶσι τὴν διάνοιαν τοῦ ἀνθρώπου besagt hier, dass die beiden dem Menschen seine Einsicht bzw. seinen Verstand nehmen.
  naturalness: Die revidierte Fassung ist modernes, würdiges Standarddeutsch. ‚Lust des Verstandes‘ bleibt bewusst nahe an der auffälligen griechischen Verbindung ἡδονὴ τοῦ νοός. ‚Den Verstand nehmen‘ ist im Deutschen idiomatisch und gibt die im Kontext gemeinte Beeinträchtigung des Denkvermögens wieder.
  terminology: ‚Geist der sexuellen Unmoral‘ bewahrt πνεῦμα und den breiten ethischen Sinn von πορνεία. ‚Diener‘ gibt διάκονος angemessen wieder. ‚Verstand‘ ist für διάνοια in diesem Kontext klarer als ‚Sinn‘ und vermeidet die nicht im Ausgangstext vorhandene Wegmetapher.
  issues:
  - severity: medium
    issue: Zusätzliche Wegmetapher im zweiten Satz
    rationale: Die Formulierung ‚bringen den menschlichen Sinn von seinem Weg ab‘ ergänzt mit ‚von seinem Weg‘ einen Bezug, den der griechische Text nicht ausdrückt, und deutet die Aussage stärker in Richtung moralischer Verirrung.
  - severity: low
    issue: ‚nimmt den Wein als Diener‘ für ἔχει
    rationale: ἔχει bedeutet hier ‚hat‘ bzw. ‚bedient sich ... als‘. ‚nimmt‘ ist möglich, aber weniger unmittelbar und weniger präzise.
  revised_text: Denn der Geist der sexuellen Unmoral hat den Wein als Diener zur Lust des Verstandes; denn diese beiden nehmen dem Menschen auch den Verstand.
  revised_footnotes: []
  revision_rationale: Die Revision stellt die Besitz- beziehungsweise Dienstmetapher von ἔχει ... ὡς διάκονον unmittelbar dar und entfernt die ergänzte Wegmetapher. Sie bewahrt zugleich die auffällige, nicht weiter aufgelöste Verbindung von Lust und Verstand sowie die mögliche personifizierende Dimension von πνεῦμα.
