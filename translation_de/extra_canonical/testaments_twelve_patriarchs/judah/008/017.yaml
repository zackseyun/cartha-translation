id: T12P.JUD.8.17
reference: Testament of Judah 8:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τὸ γὰρ πνεῦμα τῆς πορνείας τὸν οἶνον ὡς διάκονον ἔχει πρὸς τὴν ἡδονὴν τοῦ νοός. ὅτι καίγε τὰ δύο ταῦτα ἀφιστῶσι τὴν διάνοιαν τοῦ ἀνθρώπου.
  language: Greek
  note: Greek from Charles XIV.2 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/017.yaml
  text: For the spirit of sexual immorality has wine as a servant to give pleasure to the mind; for these two also take away a person's understanding.
translation:
  language: de
  text: Denn der Geist der sexuellen Unmoral hat den Wein als Diener zur Lust des Verstandes; denn diese beiden nehmen dem Menschen auch den Verstand.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα τῆς πορνείας
  choice: Geist der sexuellen Unmoral
  rationale: Gibt die personifizierte sittliche Macht von πνεῦμα wieder; ‚sexuelle Unmoral‘ hält den weiteren Bedeutungsumfang von πορνεία offen.
- source_word: τὸν οἶνον ὡς διάκονον ἔχει
  choice: nimmt den Wein als Diener
  rationale: Bewahrt das Bild des Weins als dienstbares Mittel; ‚Diener‘ entspricht διάκονος natürlich und würdevoll.
- source_word: πρὸς τὴν ἡδονὴν τοῦ νοός
  choice: für die Lust des Verstandes
  rationale: Gibt die Zweckrichtung von πρός und die ungewöhnliche Verbindung von ἡδονή mit νοῦς möglichst transparent wieder, ohne sie psychologisch auszudeuten.
- source_word: ἀφιστῶσι τὴν διάνοιαν τοῦ ἀνθρώπου
  choice: bringen den menschlichen Sinn von seinem Weg ab
  rationale: ἀφίστημι bezeichnet ein Entfernen oder Abbringen; die Formulierung bewahrt diesen Vorgang besser als eine völlige Vernichtung des Verstehens. διάνοια wird hier als ‚Sinn‘ wiedergegeben.
theological_decisions:
- issue: Personifizierung des Geistes der πορνεία
  choice: Die personifizierende Redeweise ‚Geist der sexuellen Unmoral‘ bleibt erhalten.
  alternative: ‚Neigung zur sexuellen Unmoral‘
  rationale: Der griechische Text spricht ausdrücklich von πνεῦμα; eine Reduktion auf bloße Psychologie würde die mögliche geistliche Dimension vorentscheiden.
- issue: Wirkung von Wein und sexueller Unmoral auf die διάνοια
  choice: Sie bringen den Sinn ‚von seinem Weg ab‘.
  alternative: Sie ‚nehmen einem Menschen den Verstand‘.
  rationale: Die Alternative ist idiomatischer, legt aber einen vollständigen Verlust nahe. Die gewählte Fassung erhält die Bewegungs- und Abwendungskomponente von ἀφίστημι.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelität der beiden griechischen Sätze und die personifizierende Bildsprache werden bewahrt; die leicht fremdartige Wendung ‚Lust des Verstandes‘ bleibt bewusst stehen, um die Mehrdeutigkeit des Originals nicht aufzulösen.
