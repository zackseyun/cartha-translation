source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: καὶ δέδωκα αὐτῇ τὴν ῥάβδον μου καὶ τὸ διάδημά μου *εἰς ἀρραβῶνα.
  language: Greek
  note: 'Greek from Charles XII.4b (α): the pledge handover. Project''s English distributes this single α-clause across project vv 9-10. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/009.yaml
  text: And I said, "What pledge shall I give you?" And she said, "Your staff, and your girdle, and the diadem of your kingdom."
translation:
  language: de
  text: Und ich habe ihr meinen Stab und mein Diadem als Pfand gegeben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδον
  choice: Stab
  rationale: Die direkte und natürliche Entsprechung für den übergebenen persönlichen Stab.
- source_word: διάδημα
  choice: Diadem
  rationale: Bewahrt die konkrete Bezeichnung für ein Herrschaftszeichen, ohne das im griechischen Wort nicht ausdrücklich enthaltene »meines Königreichs« einzufügen.
- source_word: ἀρραβών
  choice: Pfand
  rationale: Bezeichnet hier eine als Sicherheit übergebene Sache; »Pfand« gibt den antiken Rechts- und Handlungssinn idiomatisch wieder.
theological_decisions:
- issue: Abweichung der englischen Konsultationsfassung vom vorgelegten griechischen Text
  choice: Übersetzung allein der im griechischen Quelltext bezeugten Übergabe von Stab und Diadem
  alternative: Die englische Frage-und-Antwort-Fassung mit zusätzlichem Gürtel und »deines Königreichs« übernehmen
  rationale: Die griechische Klausel enthält weder eine Frage noch einen Gürtel noch die nähere Bestimmung des Diadems als »deines Königreichs«. Diese Elemente dürfen nicht aus der englischen Konsultationsschicht in diesen Vers importiert werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; knapper Satzbau entsprechend der griechischen Einzelklausel. Keine Fußnoten erforderlich.
