id: T12P.JUD.8.31
reference: Testament of Judah 8:31
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Δυσὶ γὰρ πάθεσιν ἐναντίοις δουλεύει, *καὶ Θεῷ ὑπακοῦσαι οὐ δύναται, ὅτι ἐτύφλωσε τὴν ψυχὴν αὐτοῦ καὶ ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται.'
  language: Greek
  note: Greek from Charles XVIII.6 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/031.yaml
  text: For he is enslaved to two contrary passions and cannot obey God, because they have blinded his soul and he walks in the day as in the night.
translation:
  language: de
  text: Denn er dient zwei gegensätzlichen Leidenschaften und kann Gott nicht gehorchen, weil er seine Seele blind gemacht hat und am Tag wie in der Nacht umhergeht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δυσὶ ... πάθεσιν ἐναντίοις
  choice: zwei gegensätzlichen Leidenschaften
  rationale: Gibt Zahl, Gegensatz und die inneren beherrschenden Regungen des griechischen πάθη wieder, ohne sie enger als bestimmte Laster festzulegen.
- source_word: δουλεύει
  choice: dient
  rationale: Bewahrt das Bild eines Knechtschafts- bzw. Herrschaftsverhältnisses und verbindet sich im Deutschen natürlich mit dem Dativ.
- source_word: Θεῷ ὑπακοῦσαι οὐ δύναται
  choice: kann Gott nicht gehorchen
  rationale: Direkte und idiomatische Wiedergabe des Unvermögens zum Gehorsam gegenüber Gott.
- source_word: ἐτύφλωσε τὴν ψυχὴν αὐτοῦ
  choice: er seine Seele blind gemacht hat
  rationale: Folgt der überlieferten Singularform ἐτύφλωσε und bewahrt damit die Selbstverursachung, statt wie die englische Konsultationsfassung ein plurales Subjekt aus den Leidenschaften zu ergänzen.
- source_word: ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται
  choice: am Tag wie in der Nacht umhergeht
  rationale: Erhält den anschaulichen Gegensatz von Tag und Nacht sowie das Bild eines orientierungslosen Lebenswandels.
theological_decisions:
- issue: Ursache der Verblendung
  choice: 'Das grammatische Subjekt bleibt die betreffende Person: „weil er seine Seele blind gemacht hat“.'
  alternative: „weil sie seine Seele blind gemacht haben“, mit den zwei Leidenschaften als Subjekt.
  rationale: Der vorgelegte griechische Text hat das singularische ἐτύφλωσε. Die Übersetzung folgt dieser Form und löst die Spannung zur englischen Konsultationsfassung nicht zugunsten einer theologischen Deutung auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang; „Leidenschaften“ und das Tag-Nacht-Bild bewahren den ethisch-bildhaften Ton.
