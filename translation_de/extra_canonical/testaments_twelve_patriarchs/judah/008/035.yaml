source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ νῦν, τέκνα μου, παραγγέλλω ὑμῖν, ἀγαπᾶτε τὸν Λευὶ, ἵνα διαμείνητε, καὶ μὴ ἐπαίρεσθε ἐπ᾽ αὐτὸν, ἵνα μὴ ἐξολοθρευθῆτε.
  language: Greek
  note: Greek from Charles XXI.1 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/035.yaml
  text: And now I command you to love Levi, that you may live, and do not exalt yourselves against him, lest you be utterly destroyed.
translation:
  language: de
  text: 'Und nun, meine Kinder, gebiete ich euch: Liebt Levi, damit ihr bestehen bleibt, und erhebt euch nicht gegen ihn, damit ihr nicht vernichtet werdet.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγγέλλω
  choice: gebiete ich euch
  rationale: Gibt den verbindlichen Charakter der väterlichen Weisung wieder; „befehle“ wäre im Deutschen unnötig schroff.
- source_word: ἀγαπᾶτε
  choice: Liebt
  rationale: Direkte und natürliche Wiedergabe des Imperativs, ohne die Bedeutung auf bloße Achtung oder Loyalität einzuengen.
- source_word: ἵνα διαμείνητε
  choice: damit ihr bestehen bleibt
  rationale: διαμένω bezeichnet hier fortdauerndes Bestehen oder Bewahrtbleiben; die Wiedergabe vermeidet die gegenüber dem Griechischen engere Festlegung auf „leben“.
- source_word: μὴ ἐπαίρεσθε ἐπ᾽ αὐτόν
  choice: erhebt euch nicht gegen ihn
  rationale: Bewahrt das Bild des Sich-Erhebens und seine Bedeutung von Hochmut beziehungsweise Auflehnung gegen Levi.
- source_word: ἐξολοθρευθῆτε
  choice: vernichtet werdet
  rationale: Entspricht dem starken passiven Verb und vermeidet den im Ausgangstext nicht eigens markierten Zusatz „völlig“.
theological_decisions:
- issue: Begründung der Liebe zu Levi
  choice: „damit ihr bestehen bleibt“ als offene Ziel- oder Folgesaussage
  alternative: „damit ihr lebt“
  rationale: Die Formulierung wahrt die semantische Breite von διαμένω und legt nicht fest, ob körperliches Leben, Fortbestand oder dauerhafte Bewahrung gemeint ist.
- issue: Nicht genannter Urheber der Vernichtung
  choice: Passivform „vernichtet werdet“ ohne Benennung des Handelnden
  alternative: „damit Gott euch nicht vernichtet“
  rationale: Das griechische Passiv nennt keinen Urheber; eine ausdrückliche Zuschreibung an Gott wäre eine theologische Ergänzung.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter väterlicher Anrede. Die parallelen Finalsätze mit „damit“ bilden die griechischen ἵνα-Sätze ab; die zweite Formulierung gibt im Deutschen zugleich die warnende Folge natürlich wieder.
