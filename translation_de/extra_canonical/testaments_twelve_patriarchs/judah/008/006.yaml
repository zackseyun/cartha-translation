source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Μεθυσθεὶς οὖν οἴνῳ οὐκ ἐπέγνων αὐτὴν, καὶ ἠπάτησέ με τὸ κάλλος αὐτῆς διὰ τοῦ σχήματος τῆς κοσμήσεως.
  language: Greek
  note: Greek from Charles XII.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/006.yaml
  text: Therefore, being drunk with wine, I did not recognize her; and her beauty led my mind astray through the fashion of her adornment.
translation:
  language: de
  text: Als ich nun vom Wein betrunken war, erkannte ich sie nicht; und ihre Schönheit täuschte mich durch die Art, wie sie sich geschmückt hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μεθυσθεὶς οὖν οἴνῳ
  choice: Als ich nun vom Wein betrunken war
  rationale: Gibt das kausale Partizip in natürlichem Deutsch wieder und bewahrt οὖν als folgerndes „nun“.
- source_word: οὐκ ἐπέγνων αὐτήν
  choice: erkannte ich sie nicht
  rationale: ἐπιγινώσκω bezeichnet hier das Erkennen beziehungsweise Wiedererkennen ihrer Identität; die knappe Form bewahrt diese mögliche Bedeutungsbreite.
- source_word: ἠπάτησέ με
  choice: täuschte mich
  rationale: Entspricht direkt dem Verb ἀπατάω und vermeidet den im Griechischen nicht ausdrücklich genannten Zusatz „führte meinen Sinn in die Irre“.
- source_word: τὸ κάλλος αὐτῆς
  choice: ihre Schönheit
  rationale: Direkte und natürliche Wiedergabe des griechischen Subjekts.
- source_word: διὰ τοῦ σχήματος τῆς κοσμήσεως
  choice: durch die Art, wie sie sich geschmückt hatte
  rationale: σχῆμα bezeichnet hier Erscheinungsform oder Aufmachung, κόσμησις den Schmuck beziehungsweise das Sich-Schmücken. Die verbale Fassung ist im modernen Deutsch verständlich, ohne die genaue Art der Aufmachung festzulegen.
theological_decisions:
- issue: Zuschreibung der Täuschung
  choice: Die Schönheit wird entsprechend der griechischen Syntax als handelndes Subjekt beibehalten.
  alternative: „Durch ihre geschmückte Erscheinung ließ ich mich von ihrer Schönheit täuschen.“
  rationale: Der Text verbindet Judas Trunkenheit, sein Nichterkennen und die täuschende Wirkung ihrer Schönheit, ohne daraus eine weitergehende Lehraussage über Schuld oder Verführung abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Gedankengang, wird aber idiomatisch geglättet. Keine Fußnoten erforderlich.
