base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/002.yaml
  text: She bore me Er and Onan and Shelah. And the Lord killed the first two, for Er was wicked; and Onan, when he had married Tamar, spilled the seed upon the ground, according to the commandment of his mother, and he also died through wickedness.
translation:
  language: de
  text: Diese gebar mir Er, Onan und Schela.[a] Der Herr tötete die ersten beiden, denn Schela blieb am Leben.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: Σηλώμ (Shelom); gemeint ist Schela.'
    reason: Erklärt die abweichende griechische Namensform, ohne die geläufige deutsche Namensform im Haupttext aufzugeben.
  - marker: b
    text: Der vorliegende griechische Text endet hier. Eine längere Textform ergänzt, Er sei böse gewesen, Onan habe nach seiner Heirat mit Tamar auf Befehl seiner Mutter den Samen auf die Erde vergossen und sei ebenfalls wegen seiner Bosheit gestorben.
    reason: Dokumentiert die erhebliche Differenz zwischen dem gelieferten griechischen Text und der englischen Konsultationsfassung, ohne den längeren Inhalt in den Ausgangstext einzutragen.
lexical_decisions:
- source_word: Αὕτη
  choice: Sie
  rationale: Das Demonstrativpronomen verweist auf die zuvor genannte Frau; im natürlichen deutschen Erzählstil genügt „Sie“.
- source_word: Ἦρ / Αὐνὰν / Σηλώμ
  choice: Er / Onan / Schela
  rationale: Verwendet die im Deutschen geläufigen biblischen Namensformen; die griechische Form des dritten Namens lautet hier Σηλώμ.
- source_word: ἀνεῖλεν
  choice: tötete
  rationale: Gibt die aktive und starke Bedeutung des Verbs unmittelbar wieder, ohne sie durch „ließ sterben“ abzuschwächen.
- source_word: τοὺς μὲν δύο … ὁ γὰρ Σηλὼμ ἔζησεν
  choice: die beiden Ersten; Schela nämlich blieb am Leben
  rationale: Der Kontrast identifiziert die Getöteten als die ersten beiden der drei genannten Söhne. „Nämlich“ bewahrt den begründend-erläuternden Charakter von γάρ.
theological_decisions:
- issue: Göttliches Handeln beim Tod der beiden Söhne
  choice: „Der Herr tötete“
  alternative: „Der Herr ließ sterben“
  rationale: Der griechische Text schreibt dem Herrn das Handeln mit ἀνεῖλεν ausdrücklich zu. Die Übersetzung wahrt diese theologische Spannung, statt sie abzumildern.
- issue: Längere Begründung im englischen POB-Text
  choice: Nicht in den Haupttext aufgenommen
  alternative: Ergänzung über Ers Bosheit, Onans Verhalten und den Befehl seiner Mutter
  rationale: Diese Angaben stehen nicht im bereitgestellten griechischen Ausgangstext. Die Übersetzung folgt daher zuerst der vorliegenden originalsprachlichen Evidenz und weist die Abweichung in einer Textfußnote aus.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die knappe Struktur des griechischen Textes bleibt erhalten; zugleich wird durch „die beiden Ersten“ der im Kontrast mit dem überlebenden dritten Sohn enthaltene Bezug idiomatisch deutlich gemacht.
