  source_fidelity: 'Der Entwurf folgt dem griechischen Satz maßgeblich: Die Schwangerschaftsaussage ist gegenwärtig formuliert, und die Gegenstände stehen korrekt als „Ring, Stab und Diadem“ in der Reihenfolge der α-Fassung. Anders als die englische Audit-Fassung ergänzt er weder das Herausführen der Frau noch ein heimliches Senden; beides ist im vorgelegten griechischen Wortlaut nicht enthalten. Die Wiedergabe von ἀπέστειλε πρός με λέγουσα sollte jedoch enger als eine gesandte Botschaft mit wörtlicher Mitteilung gefasst werden.'
  naturalness: „Schickte mir eine Nachricht und ließ sagen“ ist verständlich, aber stilistisch doppelt und etwas schwerfällig. „Sandte mir eine Botschaft mit den Worten“ ist modernes, würdiges Deutsch und bildet die griechische Konstruktion klarer ab.
  terminology: „Ring“, „Stab“ und „Diadem“ sind treffend. „Schwanger“ gibt ἐν γαστρὶ ἔχω idiomatisch wieder. „Stelle nun fest“ wahrt den Aufforderungscharakter von ἐπίγνωθι und die forensische Identifizierungsfunktion ohne über „erkennen“ hinauszugehen.
