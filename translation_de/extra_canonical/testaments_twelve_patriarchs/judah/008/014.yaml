id: T12P.JUD.8.14
reference: Testament of Judah 8:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἡ δὲ ἀπέστειλε πρός με λέγουσα· Τοῦ ἀνθρώπου οὗτινος ταῦτά εἰσιν, ἐγὼ ἐν γαστρὶ ἔχω· ἐπίγνωθι οὖν τίνος ὁ δακτύλιος καὶ ἡ ῥάβδος καὶ τὸ διάδημα.
  language: Greek
  note: Greek from Charles XII α-replacement passage (Charles 1908 raw apparatus, p156). The α-replacement gives the order 'ring, staff, diadem' (δακτύλιος καὶ ἡ ῥάβδος καὶ τὸ διάδημα), rather than the project English's 'staff, girdle, diadem'; the girdle (ζώνη) belongs to β (XII.4) and to Judah's later interpretation in XV.3. Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/014.yaml
  text: But as she was being brought out, she sent secretly to me the staff and the girdle and the diadem, saying, "By the man to whom these belong I am with child."
translation:
  language: de
  text: 'Sie aber sandte mir eine Botschaft mit den Worten: »Von dem Mann, dem diese Dinge gehören, bin ich schwanger. Stelle nun fest, wem der Ring, der Stab und das Diadem gehören.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλε πρός με λέγουσα
  choice: schickte mir eine Nachricht und ließ sagen
  rationale: Gibt die indirekte Mitteilung natürlich wieder, ohne das im konsultierten englischen Text ergänzte »heimlich« einzutragen.
- source_word: Τοῦ ἀνθρώπου οὗτινος ταῦτά εἰσιν
  choice: Von dem Mann, dem diese Dinge gehören
  rationale: Bewahrt die vorangestellte Besitzangabe und ihren Bezug zur Schwangerschaft.
- source_word: ἐγὼ ἐν γαστρὶ ἔχω
  choice: bin ich schwanger
  rationale: Natürliche moderne Wiedergabe des griechischen Idioms »im Bauch haben«.
- source_word: ἐπίγνωθι
  choice: Finde nun heraus
  rationale: Drückt die Aufforderung aus, die Identität anhand der Gegenstände festzustellen; »erkenne« wäre hier im Deutschen weniger klar.
- source_word: ὁ δακτύλιος καὶ ἡ ῥάβδος καὶ τὸ διάδημα
  choice: der Ring, der Stab und das Diadem
  rationale: Folgt Wortlaut und Reihenfolge der angegebenen griechischen α-Fassung; ζώνη »Gürtel« steht hier nicht.
theological_decisions:
- issue: Art der Schwangerschaftsaussage
  choice: »Von dem Mann … bin ich schwanger«
  alternative: »Von dem Mann … habe ich empfangen«
  rationale: Die gewählte Form ist gegenwärtig und allgemein verständlich, ohne zusätzliche Aussagen über den Vorgang oder die Vaterschaft einzuführen.
- issue: Identifizierung der Gegenstände
  choice: offene Aufforderung »Finde nun heraus, wem … gehören«
  alternative: imperativisch »Erkenne doch, wessen … sind«
  rationale: Bewahrt die forensische Spannung der Identifizierung, ohne Judas Erkenntnis vorwegzunehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Entwurf folgt vorrangig dem griechischen Quellentext und übernimmt weder »als sie hinausgeführt wurde« noch »heimlich« aus der englischen Konsultationsfassung, da beides im vorgelegten griechischen Satz fehlt. Ebenso steht quellengetreu »Ring, Stab und Diadem« statt »Stab, Gürtel und Diadem«.
