id: T12P.JUD.8.16
reference: Testament of Judah 8:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ νῦν λέγω ὑμῖν, τέκνα μου, μὴ μεθύσκεσθε οἴνῳ, ὅτι ὁ οἶνος διαστρέφει τὸν νοῦν ἀπὸ τῆς ἀληθείας καὶ ἐμβάλλει ὀργὴν ἐπιθυμίας, καὶ ὁδηγεῖ εἰς πλάνην τοὺς ὀφθαλμούς.
  language: Greek
  note: 'Greek from Charles XIV.1 (α): the wine-warning exhortation. Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/016.yaml
  text: 'And now, my children, I say to you: do not be drunk with wine. For wine turns the mind away from the truth and inspires the passion of desire, and it leads the eyes into error.'
translation:
  language: de
  text: 'Und nun sage ich euch, meine Kinder: Berauscht euch nicht mit Wein; denn der Wein bringt den Verstand von der Wahrheit ab, entfacht den Zorn der Begierde und führt die Augen in die Irre.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθύσκεσθε οἴνῳ
  choice: Berauscht euch nicht mit Wein
  rationale: Gibt die mediale/passive Aufforderung natürlich wieder und bewahrt den ausdrücklichen Bezug auf Wein.
- source_word: διαστρέφει τὸν νοῦν ἀπὸ τῆς ἀληθείας
  choice: bringt den Verstand von der Wahrheit ab
  rationale: Bewahrt die Bewegung weg von der Wahrheit und gibt νοῦς allgemeinverständlich mit »Verstand« wieder.
- source_word: ἐμβάλλει ὀργὴν ἐπιθυμίας
  choice: entfacht den Zorn der Begierde
  rationale: Die ungewöhnliche Genitivverbindung bleibt bewusst erhalten, statt sie psychologisch oder theologisch zu glätten; »entfacht« vermittelt das Hineinwerfen bzw. Hervorrufen idiomatisch.
- source_word: ὁδηγεῖ εἰς πλάνην τοὺς ὀφθαλμούς
  choice: führt die Augen in die Irre
  rationale: Folgt dem konkreten Bild des griechischen Textes und klingt zugleich im modernen Deutschen natürlich.
theological_decisions:
- issue: Art der Warnung vor Wein
  choice: Warnung vor dem Sich-Berauschen
  alternative: Verbot jeglichen Weinkonsums
  rationale: Der griechische Imperativ μεθύσκεσθε bezeichnet Trunkenheit beziehungsweise Sich-Berauschen, nicht notwendig jede Verwendung von Wein.
- issue: Verhältnis von Zorn und Begierde
  choice: »Zorn der Begierde« als offene Genitivverbindung
  alternative: »leidenschaftliche Begierde« oder »Begierde und Zorn«
  rationale: Der schwer deutbare Ausdruck ὀργὴν ἐπιθυμίας soll nicht stillschweigend in eine eindeutigere Lehraussage umgeformt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter väterlicher Anrede. Der Satzbau bleibt nahe am griechischen Gedankengang, ohne unnötig altertümlich zu wirken.
