base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/015.yaml
  text: And I recognized them and was ashamed, and I said, "Tamar is more righteous than I, because I did not give her to Shelah my son." And I did not know her again.
translation:
  language: de
  text: 'Als ich dies erkannte, sagte ich: »Tamar ist im Recht, nicht ich.«[a] Danach hatte ich keinen Verkehr mehr mit ihr.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: »Tamar ist gerechtfertigt / im Recht erwiesen eher als ich.« Die knappe griechische Vergleichsform bezeichnet im Zusammenhang den Gegensatz zwischen Tamar und Juda.'
    reason: Korrigiert die unzutreffende Glossierung von ἤ als „oder“ und erläutert die knappe Passiv- und Vergleichsform.
  - marker: b
    text: 'Wörtlich: »Und ich fügte nicht mehr hinzu, sie zu erkennen.« „Erkennen“ ist hier ein im biblischen Sprachgebrauch verwendeter Euphemismus für Geschlechtsverkehr.'
    reason: Dokumentiert die formale griechische Wendung und ihren gemeinten Sinn.
lexical_decisions:
- source_word: Ἐπιγνοὺς
  choice: Als ich es erkannte
  rationale: Gibt das Erkennen bzw. Wiedererkennen wieder, ohne das im griechischen Satz nicht ausdrücklich genannte Objekt zu ergänzen.
- source_word: Δεδικαίωται
  choice: ist im Recht
  rationale: Das Perfekt Passiv von δικαιόω bezeichnet hier Tamars erwiesenes Recht bzw. ihre Rechtfertigung; die idiomatische deutsche Wendung bewahrt den gerichtlichen Vergleich.
- source_word: ἢ ἐγώ
  choice: nicht ich
  rationale: ἤ hat in diesem Vergleich den Sinn „als ich“; zusammen mit „im Recht“ ist „nicht ich“ natürlich und hält den Kontrast knapp.
- source_word: οὐ προσεθέμην ἔτι τοῦ γνῶναι αὐτήν
  choice: ich verkehrte danach nicht wieder mit ihr
  rationale: Das semitisch geprägte „sie erkennen“ ist hier ein Euphemismus für Geschlechtsverkehr. Die Übersetzung gibt den gemeinten Sinn in würdigem, verständlichem Deutsch wieder.
theological_decisions:
- issue: Umfang von Judas Bekenntnis
  choice: Tamar ist im Recht, nicht ich
  alternative: Tamar ist gerechter als ich
  rationale: Der griechische Text spricht von ihrer Rechtfertigung beziehungsweise davon, dass sie im Recht ist. Die Fassung vermeidet, daraus eine umfassende Aussage über die moralische Gesamtgerechtigkeit beider Personen zu machen.
- issue: Ergänzungen aus Genesis 38 beziehungsweise der englischen Konsultationsfassung
  choice: Keine Ergänzung von Scham, Siegel/Pfandstücken oder Schela
  alternative: „Ich erkannte sie und schämte mich ... weil ich sie meinem Sohn Schela nicht gegeben hatte“
  rationale: Diese Angaben stehen nicht im vorgelegten griechischen Quelltext. Die Übersetzung folgt daher der originalsprachlichen Evidenz und importiert die ausführlichere Genesisform nicht in den Haupttext.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp und bekenntnishaft. Nicht im griechischen Ausgangstext belegte Einzelheiten der englischen Konsultationsfassung wurden nicht in den Haupttext übernommen.
