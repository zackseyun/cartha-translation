source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Πιὼν τὸν οἶνον οὐκ ᾐσχύνθην τὴν ἐντολὴν τοῦ Θεοῦ, καὶ ἔλαβον γυναῖκα Χαναναίαν. 7. Πολλὴ γὰρ τῷ πίνοντι οἶνον, τέκνα μου,
  language: Greek
  note: Greek from Charles XIV.6-7a (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/020.yaml
  text: After I had drunk wine, I did not respect the commandment of God, and I took a woman of Canaan as wife. For much discretion is needed by the man who drinks wine, my children.
translation:
  language: de
  text: Nachdem ich Wein getrunken hatte, achtete ich Gottes Gebot nicht und nahm eine kanaanäische Frau zur Frau. Denn viel … für den, der Wein trinkt, meine Kinder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der erhaltene griechische Wortlaut ist an dieser Stelle unvollständig: Nach „Denn viel/groß“ folgt kein erhaltenes Substantiv oder Prädikat, das den Satz vervollständigt. Daher bleibt die Lücke im Haupttext sichtbar. Die englische Überlieferungsfassung ergänzt sinngemäß „Besonnenheit“ beziehungsweise „Umsicht“; dies ist jedoch nicht im griechischen Wortlaut belegt.'
    reason: Kennzeichnet die textliche Unvollständigkeit, ohne eine unsichere Ergänzung als Übersetzung auszugeben.
lexical_decisions:
- source_word: οὐκ ᾐσχύνθην
  choice: missachtete ich
  rationale: Wörtlich bezeichnet die Form, dass Juda sich Gottes Gebot gegenüber nicht schämte beziehungsweise keine beschämte Scheu zeigte. Im Zusammenhang gibt „missachtete“ die konkrete Haltung in natürlichem Deutsch wieder, ohne bloß ein inneres Schamgefühl zu behaupten.
- source_word: τὴν ἐντολὴν τοῦ Θεοῦ
  choice: Gottes Gebot
  rationale: Direkte und idiomatische Wiedergabe des griechischen Genitivs.
- source_word: γυναῖκα Χαναναίαν
  choice: eine kanaanäische Frau
  rationale: Gibt Herkunft beziehungsweise Zugehörigkeit wieder; die anschließende Wendung „zur Frau“ macht ἔλαβον im ehelichen Sinn deutlich.
- source_word: τῷ πίνοντι οἶνον
  choice: wer Wein trinkt
  rationale: Die substantivierte Partizipialkonstruktion wird als allgemeine Aussage natürlich ins Deutsche übertragen.
- source_word: Πολλὴ
  choice: braucht viel Besonnenheit
  rationale: Der überlieferte Ausschnitt bricht nach dem femininen Adjektiv „viel/groß“ syntaktisch ab. „Besonnenheit“ folgt der im konsultierten Text bezeugten sinngemäßen Ergänzung und passt zur Warnung vor Wein.
theological_decisions:
- issue: Art des göttlichen Gebots
  choice: Das Gebot bleibt unbestimmt.
  alternative: Das Gebot ausdrücklich als Verbot einer Ehe mit einer Kanaanäerin erklären.
  rationale: Der griechische Text nennt nur „Gottes Gebot“. Eine nähere Identifikation würde eine Auslegung in den Haupttext eintragen.
- issue: Bedeutung von οὐκ ᾐσχύνθην
  choice: Als Missachtung des Gebots wiedergegeben.
  alternative: „Ich schämte mich nicht vor Gottes Gebot“ oder „ich scheute Gottes Gebot nicht“.
  rationale: Die gewählte Formulierung ergibt im modernen Deutschen einen klaren Zusammenhang zwischen Trunkenheit und Übertretung, ohne eine zusätzliche konfessionelle Deutung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede „meine Kinder“ und der mahnende Ton bleiben erhalten. Wiederholungen um „Frau“ wurden trotz leichter stilistischer Schwere beibehalten, weil „eine kanaanäische Frau zur Frau nehmen“ den ehelichen Sinn präzise und allgemein verständlich ausdrückt.
