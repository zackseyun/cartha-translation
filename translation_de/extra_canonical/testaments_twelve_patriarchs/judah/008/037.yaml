  text: Ἐμοὶ ἔδωκε τὰ ἐπὶ γῆς, ἐκείνῳ τὰ ἐν οὐρανοῖς.
  language: Greek
  note: Greek from Charles XXI.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XXI.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/037.yaml
  text: To me he gave the things on earth; to him the things in heaven.
translation:
  language: de
  text: Mir gab er, was auf der Erde ist; ihm, was in den Himmeln ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐμοὶ … ἐκείνῳ
  choice: Mir … ihm
  rationale: Die betonte Gegenüberstellung der beiden Dativpronomen wird knapp und parallel wiedergegeben.
- source_word: τὰ ἐπὶ γῆς
  choice: was auf der Erde ist
  rationale: Die substantivierte Wendung wird natürlich und zugleich nah am griechischen Wortlaut übersetzt.
- source_word: τὰ ἐν οὐρανοῖς
  choice: was in den Himmeln ist
  rationale: Der griechische Plural οὐρανοῖς bleibt als „Himmel“ im Plural erhalten, ohne seinen Bezug näher festzulegen.
- source_word: ἔδωκε
  choice: gab er
  rationale: Der Aorist wird als einfacher vergangener Vorgang wiedergegeben; das nicht ausdrücklich benannte Subjekt bleibt wie im Ausgangstext nur pronominal bezeichnet.
theological_decisions:
- issue: Nicht genannte Bezugspersonen der Pronomen
  choice: „er“ und „ihm“ ohne erklärende Namen beibehalten
  alternative: Die Personen aus dem weiteren Kontext ausdrücklich benennen
  rationale: Der vorgelegte griechische Satz nennt die Bezugspersonen nicht. Eine Ergänzung würde die im Einzelvers vorhandene Offenheit unzulässig auflösen.
- issue: Singular oder Plural bei οὐρανοῖς
  choice: „in den Himmeln“
  alternative: „im Himmel“
  rationale: Der Plural des griechischen Textes wird bewahrt, da er kosmologische oder theologische Nuancen tragen kann.
translation_notes:
  register: Knapp, würdevoll und in modernem Standarddeutsch. Die elliptische Parallelstruktur des Griechischen bleibt erhalten; im zweiten Satzglied wird das Verb nicht wiederholt.
