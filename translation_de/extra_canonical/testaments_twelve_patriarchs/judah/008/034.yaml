source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: VIII. *Ἦσαν δέ μοι¹ κτήνη πολλά, καὶ *εἶχον ἀρχιποίμενα² Ἱρὰμ³ τὸν Ὀδολομίτην⁴. 2. Πρὸς ὃν ἐλθὼν⁵ ἤμην, καὶ ἦλθεν Βαρσαβὰ⁶ τὸν⁷ βασιλεὺς⁸ Ὀδολλὰμ⁹, καὶ¹⁰ ἐποίησεν ἡμῖν πότον¹², καὶ †παρακαλέσας¹³ δέδωκέ¹⁴ μοι τὴν θυγατέρα αὐτοῦ¹⁵ *ὀνόματι Σαβά¹⁶ εἰς γυναῖκα. 3. Αὕτη¹⁷ ἔτεκέν μοι τὸν Ἦρ¹⁸ καὶ τὸν¹⁹ Αὐνὰν καὶ τὸν²⁰ Σηλώμ²¹. *Καὶ τοὺς μὲν δύο²² ἀνεῖλεν²³ Κύριος· ὁ γὰρ Σηλὼμ ἔζησεν²⁴.
  text_scope: related_parent_record_source
  language: Greek
  note: Project verse 8:34 ('after my death you will act lawlessly and contend against Levi, and you will not be able to prevail against him, because the angel of the Lord guides him') has no direct α-counterpart in Charles VIII-XXVI. The 'contend against Levi' / 'angel guides Levi' theme is the project's homiletic bridge between the wine-warning section and the Levi/Judah priesthood-vs-kingship discourse of Charles XXI; the α-text moves directly from Judah's Canaanite-marriage shame (XIX-XX) to the 'love Levi' command at XXI.1 without the lawlessness-prediction the project English supplies. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/034.yaml
  text: For I know that after my death you will act lawlessly and contend against Levi, and you will not be able to prevail against him, because the angel of the Lord guides him and me the spirit of deceit has misled.
translation:
  language: de
  text: 'Denn ich weiß: Nach meinem Tod werdet ihr gesetzlos handeln und euch gegen Levi stellen. Ihr werdet ihn nicht überwältigen können, weil der Engel des Herrn ihn führt, während mich der Geist der Täuschung irregeführt hat.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Für diesen Vers gibt es in dem angegebenen griechischen α-Zeugen von Charles keine direkte Entsprechung. Die Aussage bildet in der Projektfassung eine thematische Brücke zur späteren Mahnung, Levi zu lieben, und zum Verhältnis von Priestertum und Königtum.
    reason: Kennzeichnet transparent, dass die deutsche Formulierung hier nicht unmittelbar aus dem vorgelegten griechischen Wortlaut übersetzt werden kann.
lexical_decisions:
- source_word: Kein direkter griechischer Ausgangstext im angegebenen α-Zeugen
  choice: gesetzlos handeln
  rationale: Gibt das englische „act lawlessly“ natürlich und in einem für testamentarische Mahnrede angemessenen Register wieder, ohne ein nicht belegtes griechisches Lexem vorzutäuschen.
- source_word: Kein direkter griechischer Ausgangstext im angegebenen α-Zeugen
  choice: euch gegen Levi stellen
  rationale: Bewahrt den Sinn von „contend against Levi“, ohne die Art des Widerstreits genauer festzulegen, als es die englische Konsultationsschicht erlaubt.
- source_word: Kein direkter griechischer Ausgangstext im angegebenen α-Zeugen
  choice: der Engel des Herrn ihn führt
  rationale: Folgt der englischen Fassung eng und wahrt die theologische Aussage, ohne „guides“ durch einen stärkeren Begriff wie „beschützt“ zu ersetzen.
- source_word: Kein direkter griechischer Ausgangstext im angegebenen α-Zeugen
  choice: der Geist der Täuschung
  rationale: Entspricht „the spirit of deceit“ und erhält die personifizierende beziehungsweise geistwesenhafte Mehrdeutigkeit.
theological_decisions:
- issue: Textkritischer Status des gesamten Verses
  choice: Der Vers wird als projektüberlieferte Brückenfassung übersetzt und mit einer Fußnote als im angegebenen griechischen α-Zeugen nicht direkt belegt gekennzeichnet.
  alternative: Den Vers auslassen oder ihn ohne Kennzeichnung als Übersetzung des griechischen Textes darbieten.
  rationale: Die Projektangaben verlangen eine deutsche Fassung, zugleich darf die fehlende direkte griechische Entsprechung nicht verschwiegen werden.
- issue: Gegenüberstellung von Levis Führung und Judas Irreführung
  choice: Die adversative Spannung wird mit „während“ ausdrücklich erhalten.
  alternative: Die beiden Aussagen nur mit „und“ verbinden.
  rationale: So bleibt der im englischen POB erkennbare Kontrast gewahrt, ohne zusätzliche Lehraussagen über Levi, Juda, Engel oder Geister einzuführen.
- issue: Wesen des „Geistes der Täuschung“
  choice: Die Formulierung bleibt ontologisch offen.
  alternative: Als bloße innere Selbsttäuschung oder eindeutig als persönlicher Dämon auslegen.
  rationale: Mangels direkter griechischer Grundlage darf die Übersetzung diese theologische Mehrdeutigkeit nicht auflösen.
translation_notes:
  register: Moderne, würdige Mahnrede mit klarer Satzstruktur. Wegen des fehlenden direkten griechischen Gegenstücks folgt die Fassung vorsichtig der englischen POB-Konsultationsschicht und macht ihren textkritischen Status ausdrücklich kenntlich.
