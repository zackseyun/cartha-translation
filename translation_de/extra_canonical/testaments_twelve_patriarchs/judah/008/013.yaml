id: T12P.JUD.8.13
reference: Testament of Judah 8:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: καὶ μεθ’ ἡμέρας τινὰς ἠκούσθη ὅτι Θαμὰρ ἐκπεπόρνευκε καὶ ἐν γαστρὶ ἔχει. Ἀκούσας δὲ ἐγὼ εἶπον· Ἐξαγάγετε αὐτὴν καὶ καυθήτω.
  language: Greek
  note: 'Greek from Charles XII α-replacement passage (Charles 1908 raw apparatus, p156): α omits XII.6-10 of β and substitutes an abbreviated LXX form of Gen 38.20, 24-30. The ''three months'' detail is from the Genesis tradition; α has ''μεθ'' ἡμέρας τινὰς'' (''after some days''). Project ch.8 is a thematic consolidation; sourced from Charles ch.XII α-replacement.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/013.yaml
  text: And after three months it was reported to me, "Tamar your daughter-in-law has played the prostitute, and behold, she is with child." And I, being without understanding in the arrogance of my anger, said, "Bring her out, and let her be burned."
translation:
  language: de
  text: 'Und nach einigen Tagen wurde bekannt, dass Tamar Unzucht getrieben hatte und schwanger war. Als ich davon hörte, sagte ich: »Führt sie hinaus, und sie soll verbrannt werden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεθ’ ἡμέρας τινὰς
  choice: nach einigen Tagen
  rationale: Folgt dem vorliegenden griechischen α-Text und übernimmt nicht die aus der Genesisüberlieferung stammende Angabe »nach drei Monaten«.
- source_word: ἐκπεπόρνευκε
  choice: Unzucht getrieben hatte
  rationale: Gibt den Vorwurf sexuellen Fehlverhaltens klar und würdig wieder, ohne den Text durch die Rollenbezeichnung »sich prostituiert« unnötig zu verengen.
- source_word: ἐν γαστρὶ ἔχει
  choice: schwanger war
  rationale: Natürliche moderne Wiedergabe der griechischen Wendung »im Leib haben«.
- source_word: καυθήτω
  choice: sie soll verbrannt werden
  rationale: Bewahrt den passivischen Imperativ und die Härte des angeordneten Urteils.
theological_decisions:
- issue: Im englischen Konsultationstext enthaltene moralpsychologische Deutung
  choice: Die Wendung »ohne Einsicht im Hochmut meines Zorns« wird nicht aufgenommen.
  alternative: »Und ich, ohne Einsicht im Hochmut meines Zorns, sagte …«
  rationale: Diese Charakterisierung steht nicht im angegebenen griechischen Ausgangstext; die Übersetzung fügt keine theologische oder psychologische Auslegung hinzu.
- issue: Verwandtschaftsbezeichnung für Tamar
  choice: Tamar wird ohne Zusatz genannt.
  alternative: »Tamar, deine Schwiegertochter«
  rationale: Der griechische Ausgangstext hat lediglich Θαμάρ; die aus Genesis bekannte Bezeichnung wird nicht in diesen Text importiert.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die knappe, harte Direktheit des griechischen Textes bleibt erhalten; Zusätze des englischen Konsultationstextes, die im vorgelegten Griechisch fehlen, wurden nicht übernommen.
