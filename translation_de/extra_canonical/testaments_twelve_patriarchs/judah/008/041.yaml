  text: VIII. *Ἦσαν δέ μοι¹ κτήνη πολλά, καὶ *εἶχον ἀρχιποίμενα² Ἱρὰμ³ τὸν Ὀδολομίτην⁴. 2. Πρὸς ὃν ἐλθὼν⁵ ἤμην, καὶ ἦλθεν Βαρσαβὰ⁶ τὸν⁷ βασιλεὺς⁸ Ὀδολλὰμ⁹, καὶ¹⁰ ἐποίησεν ἡμῖν πότον¹², καὶ †παρακαλέσας¹³ δέδωκέ¹⁴ μοι τὴν θυγατέρα αὐτοῦ¹⁵ *ὀνόματι Σαβά¹⁶ εἰς γυναῖκα. 3. Αὕτη¹⁷ ἔτεκέν μοι τὸν Ἦρ¹⁸ καὶ τὸν¹⁹ Αὐνὰν καὶ τὸν²⁰ Σηλώμ²¹. *Καὶ τοὺς μὲν δύο²² ἀνεῖλεν²³ Κύριος· ὁ γὰρ Σηλὼμ ἔζησεν²⁴.
  text_scope: related_parent_record_source
  language: Greek
  note: Project verse 8:41 ('because of him the Lord will choose from you the kingship, and from Levi the priesthood, that the Lord may be for all the nations and the race of Israel') has no direct α-counterpart. The 'kingship from Judah, priesthood from Levi, Lord for all nations' theme is the project's homiletic synthesis of Charles XXII.2-3 ('ἕως τοῦ ἐλθεῖν τὸ σωτήριον τοῦ Ἰσραὴλ') and XXIV.6 ('κρῖναι καὶ σῶσαι πάντας τοὺς ἐπικαλουμένους τὸν Κύριον'), but α has no single verse that says what the project English says here. Source.text left empty per project policy of honesty to the α-witness.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/041.yaml
  text: For because of him the Lord will choose from you the kingship, and from Levi the priesthood, that the Lord may be for all the nations and the race of Israel.
translation:
  language: de
  text: Denn seinetwegen wird der Herr aus euch das Königtum erwählen und aus Levi das Priestertum, damit der Herr für alle Völker und für das Geschlecht Israels da sei.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Für diesen Vers gibt es im griechischen α-Zeugen kein direktes Gegenstück. Der Wortlaut ist eine thematische Zusammenfassung von Testament Juda 22,2–3 und 24,6: Dort ist vom Kommen des Heils Israels sowie vom Gericht und von der Rettung aller die Rede, die den Herrn anrufen.'
    reason: Kennzeichnet transparent, dass der Projektvers nicht als einzelner Satz in der angegebenen griechischen Quelle belegt ist.
lexical_decisions:
- source_word: kingship (project synthesis; kein direkter α-Wortlaut)
  choice: das Königtum
  rationale: Gibt die Herrschaftsinstitution wieder, ohne sie auf einen einzelnen König zu verengen.
- source_word: priesthood (project synthesis; kein direkter α-Wortlaut)
  choice: das Priestertum
  rationale: Entspricht der parallelen institutionellen Aussage über Levi.
- source_word: because of him
  choice: seinetwegen
  rationale: Bewahrt den unbestimmten männlichen Rückverweis des Projekttextes, ohne seine Identität interpretierend festzulegen.
- source_word: for all the nations and the race of Israel
  choice: für alle Völker und für das Geschlecht Israels da sei
  rationale: Bewahrt die ungewöhnliche Zielaussage und vermeidet die stärkere, im vorgelegten Text nicht ausdrücklich formulierte Deutung „Herr über alle Völker“.
theological_decisions:
- issue: Verhältnis von Königtum aus Juda und Priestertum aus Levi
  choice: Beide Erwählungsaussagen werden parallel und ohne konfessionelle Ausdeutung wiedergegeben.
  alternative: Die Ämter messianisch, kirchlich oder heilsgeschichtlich näher bestimmen.
  rationale: Der Projekttext nennt beide Institutionen, legt ihre spätere theologische Beziehung aber nicht eindeutig fest.
- issue: Fehlendes direktes α-Gegenstück
  choice: Der Projektvers wird übersetzt, aber durch eine textkritische Fußnote ausdrücklich als Synthese gekennzeichnet.
  alternative: Den Vers auslassen oder ihn ohne Kennzeichnung als direkt bezeugten griechischen Wortlaut darstellen.
  rationale: So bleibt die Projektstruktur erhalten, ohne einen nicht vorhandenen Einzelvers im griechischen α-Zeugen vorzutäuschen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die syntaktische Parallelität von „aus euch das Königtum“ und „aus Levi das Priestertum“ bleibt erhalten. Die ungewöhnliche Wendung „für … da sei“ wahrt die Offenheit des konsultierten Projekttextes; die Fußnote legt dessen sekundären, zusammenfassenden Charakter offen.
