id: T12P.JUD.8.32
reference: Testament of Judah 8:32
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τέκνα μου, ἡ φιλαργυρία πρὸς εἰδωλολατρίαν ὁδηγεῖ, ὅτι ἐν πλάνῃ ἀργυρίου τοὺς μὴ ὄντας θεοὺς ὀνομάζουσι, καὶ ποιεῖ τὸν ἔχοντα αὐτὴν εἰς ἔκστασιν ἐμπεσεῖν.
  language: Greek
  note: 'Greek from Charles XIX.1 (α): love of money leads to idolatry. The project English compresses this with a ''wine to immorality'' summary that recapitulates ch.XIV; the wine half is implicit, the φιλαργυρία/εἰδωλολατρία half is α XIX.1. Project ch.8 is a thematic consolidation; sourced from Charles ch.XIX.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/032.yaml
  text: My children, I have shown you that wine leads to sexual immorality, and the love of money to idolatry; and these things turn the mind away from the law of God.
translation:
  language: de
  text: Meine Kinder, die Geldgier führt zum Götzendienst; denn in ihrer Verblendung durch Geld nennt man solche, die keine Götter sind, Götter. Und sie bringt den, der ihr verfallen ist, außer sich.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich kann der letzte Satz auch heißen: „Und sie lässt den, der sie hat, in einen Zustand des Außersichseins fallen.“ Das griechische Wort kann Entrückung, Verwirrung oder den Verlust besonnener Selbstkontrolle bezeichnen.'
    reason: Die Bedeutungsbreite von ἔκστασις soll sichtbar bleiben.
lexical_decisions:
- source_word: Τέκνα μου
  choice: Meine Kinder
  rationale: Direkte, natürliche Wiedergabe der väterlichen Anrede.
- source_word: ἡ φιλαργυρία
  choice: die Geldgier
  rationale: Bezeichnet nicht Geld an sich, sondern eine ungeordnete Liebe zum Geld; „Geldgier“ ist im modernen Deutsch klar und prägnant.
- source_word: πρὸς εἰδωλολατρίαν ὁδηγεῖ
  choice: führt zum Götzendienst
  rationale: Bewahrt Richtung und religiöse Bedeutung der griechischen Formulierung.
- source_word: ἐν πλάνῃ ἀργυρίου
  choice: im Wahn des Reichtums
  rationale: πλάνη kann Irrtum, Verführung oder Verblendung bezeichnen; „Wahn“ wahrt die starke Aussage, während „Reichtum“ den gemeinten Einfluss des Geldes natürlich ausdrückt.
- source_word: τοὺς μὴ ὄντας θεοὺς ὀνομάζουσι
  choice: nennt man solche, die keine Götter sind, Götter
  rationale: Folgt dem griechischen Wortlaut und bewahrt dessen pointierte Wiederholung.
- source_word: τὸν ἔχοντα αὐτήν
  choice: den, der ihr verfallen ist
  rationale: Wörtlich „den, der sie hat“; idiomatisch wird ausgedrückt, dass die Geldgier einen Menschen beherrscht.
- source_word: εἰς ἔκστασιν ἐμπεσεῖν
  choice: außer sich geraten
  rationale: Gibt den Verlust besonnener Selbstkontrolle wieder, ohne dem mehrdeutigen ἔκστασις vorschnell eine spezifisch mystische oder medizinische Bedeutung zuzuschreiben.
theological_decisions:
- issue: Zusätze der englischen Konsultationsfassung
  choice: Die Aussagen über Wein, sexuelle Unmoral und das Gesetz Gottes werden nicht in den Haupttext aufgenommen.
  alternative: „Ich habe euch gezeigt, dass Wein zu sexueller Unmoral führt … und diese Dinge den Sinn vom Gesetz Gottes abwenden.“
  rationale: Diese Elemente stehen nicht im vorgelegten griechischen Ausgangstext. Die Übersetzung folgt primär der originalsprachlichen Evidenz; die thematische englische Zusammenfassung darf den Quelltext nicht ersetzen.
- issue: Art der Wirkung der Geldgier
  choice: „außer sich“ mit erklärender Fußnote
  alternative: „in Ekstase“ oder „in Wahnsinn“
  rationale: Das griechische ἔκστασις lässt mehrere Nuancen zu. Die gewählte Formulierung bewahrt die Spannung zwischen Verblendung, Kontrollverlust und geistiger Entrückung, ohne sie dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Haupttext folgt dem überlieferten griechischen Wortlaut und verzichtet auf die nicht ausdrücklich belegten thematischen Ergänzungen der englischen Konsultationsfassung.
