  source_fidelity: 'Der deutsche Text folgt dem griechischen Satzbau und der Aussage insgesamt zuverlässig und entscheidet sich zu Recht gegen die nicht im vorgelegten griechischen Text enthaltenen Ergänzungen der englischen POB-Konsultationsfassung. Korrekturbedürftig ist jedoch „im Wahn des Reichtums“ für ἐν πλάνῃ ἀργυρίου: ἀργύριον bezeichnet hier Geld/Silber, nicht allgemein Reichtum, und πλάνη ist eher Verblendung, Irrtum oder Täuschung als ein klinisch oder absolut klingender „Wahn“.'
