id: T12P.JUD.8.28
reference: Testament of Judah 8:28
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ὅτι ταῦτα ἀφιστᾷ τοῦ νόμου τοῦ θεοῦ, καὶ τυφλοῖ τὸ διαβούλιον τῆς ψυχῆς, καὶ ὑπερηφανίαν ἐκδιδάσκει, καὶ οὐκ ἀφίει ἄνδρα ἐλεῆσαι τὸν πλησίον αὐτοῦ.
  language: Greek
  note: Greek from Charles XVIII.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XVIII.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/028.yaml
  text: For these things draw a person away from the law of God and blind the inclination of the soul, and teach arrogance, and do not allow one to have compassion on his neighbor.
translation:
  language: de
  text: Denn diese Dinge bringen einen Menschen vom Gesetz Gottes ab, verblenden das Urteilsvermögen der Seele, lehren Hochmut und lassen nicht zu, dass jemand mit seinem Nächsten Erbarmen hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: diese Dinge
  rationale: Bewahrt den allgemeinen Rückverweis des griechischen Plurals, ohne den nicht mitgelieferten Kontext näher festzulegen.
- source_word: ἀφιστᾷ
  choice: bringen … ab
  rationale: Gibt das Abbringen beziehungsweise Entfernen von einer maßgeblichen Norm natürlich und präzise wieder.
- source_word: τοῦ νόμου τοῦ θεοῦ
  choice: vom Gesetz Gottes
  rationale: Direkte und im Deutschen geläufige Wiedergabe des Genitivgefüges.
- source_word: τυφλοῖ
  choice: verblenden
  rationale: Erhält die Bildsprache des Blindmachens, klingt im Zusammenhang mit innerem Urteilsvermögen aber natürlich.
- source_word: τὸ διαβούλιον τῆς ψυχῆς
  choice: das Urteilsvermögen der Seele
  rationale: διαβούλιον bezeichnet hier wohl die Fähigkeit oder Instanz innerer Überlegung und Entscheidung; „Urteilsvermögen“ ist verständlich, ohne sie auf bloße Neigung zu verengen.
- source_word: ὑπερηφανίαν ἐκδιδάσκει
  choice: lehren Hochmut
  rationale: Bewahrt die aktive Aussage, dass diese Dinge Hochmut vermitteln beziehungsweise einüben.
- source_word: οὐκ ἀφίει ἄνδρα
  choice: lassen nicht zu, dass jemand
  rationale: Natürliches modernes Deutsch; ἄνδρα wird in seiner generischen Bedeutung wiedergegeben.
- source_word: ἐλεῆσαι τὸν πλησίον αὐτοῦ
  choice: mit seinem Nächsten Erbarmen hat
  rationale: Bewahrt sowohl den ethischen Gehalt von ἐλεέω als auch den traditionsreichen, weiterhin verständlichen Ausdruck „Nächster“.
theological_decisions:
- issue: Bedeutung von διαβούλιον τῆς ψυχῆς
  choice: Urteilsvermögen der Seele
  alternative: Neigung der Seele / innerer Ratschluss der Seele
  rationale: Der seltene Ausdruck kann Überlegung, Entschluss oder beratende Urteilskraft bezeichnen. „Urteilsvermögen“ hält den moralisch-kognitiven Sinn offen und vermeidet eine unbelegte Festlegung auf bloße Neigung.
- issue: Generisches ἄνδρα
  choice: jemand
  alternative: einen Mann
  rationale: Im Satz ist keine spezifisch männliche Person gemeint; „jemand“ bildet die allgemeine Reichweite im modernen Deutschen angemessen ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Syntax. Die vier parallelen Wirkungen bleiben erhalten; unnötige konfessionelle oder interpretierende Zusätze werden vermieden.
