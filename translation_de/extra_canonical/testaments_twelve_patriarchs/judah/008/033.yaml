revisions:
- from: Und ich weiß, dass mein Geschlecht durch diese beiden[a] am Verderben der Unzucht zugrunde gehen wird. Sie werden sogar weise Männer unter meinen Söhnen verderben und das Königtum Judas schmälern, das der Herr mir durch meinen Gehorsam gegenüber meinem Vater gegeben hat.[b]
  to: Und ich weiß, dass mein Geschlecht durch diese beiden[a] durch Unzucht ins Verderben geraten wird. Sie werden sogar weise Männer unter meinen Söhnen verderben und das Königtum Judas schmälern, das der Herr mir wegen des Gehorsams gegenüber meinem Vater gegeben hat.[b]
  rationale: Die Revision glättet die unidiomatische Verbindung von „Verderben“ und „zugrunde gehen“ und belässt zugleich πορνεία als Ursache des Untergangs. Sie ersetzt außerdem die explizite Zuschreibung von Judas Gehorsam durch eine im Deutschen verständliche Formulierung, die die syntaktische Offenheit der griechischen Vorlage wahrt. Die Fußnotenanker und ihre Bezüge bleiben unverändert korrekt.
