reference: Testament of Judah 8:33
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ οἶδα ὅτι διὰ τὰ δύο ταῦτα ἔσται τὸ γένος μου *εἰς ἀπώλειαν πορνείας, καὶ καίγε σοφοὺς ἄνδρας τῶν υἱῶν μου ἀλλοιώσουσι, καὶ βασιλείαν Ἰούδα σμικρυνθῆναι ποιήσουσιν, ἣν ἔδωκέ μοι Κύριος ἐν ὑπακοῇ πατρός μου.'
  language: Greek
  note: 'Greek from Charles XVII.2 (α): the warning that the two vices (gold and beauty of women) will ruin Judah''s race. Project''s English at v33 is a parenetic exhortation that paraphrases this material together with the broader Canaanite-marriage warnings of Charles ch.XIV-XVII; closest α-anchor is XVII.2. Project ch.8 is a thematic consolidation; sourced from Charles ch.XVII.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/033.yaml
  text: Therefore, if you do not walk in sobriety in truth and in the fear of God, you will perish through every evil deed and every plague, if you take wives from the daughters of Canaan and are joined to their wealth, being led astray by gifts.
translation:
  language: de
  text: Und ich weiß, dass mein Geschlecht durch diese beiden[a] durch Unzucht ins Verderben geraten wird. Sie werden sogar weise Männer unter meinen Söhnen verderben und das Königtum Judas schmälern, das der Herr mir wegen des Gehorsams gegenüber meinem Vater gegeben hat.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Gemeint sind die beiden zuvor genannten Verlockungen: Gold und die Schönheit von Frauen.'
    reason: Der Vers enthält nur einen Rückverweis; die Anmerkung macht dessen Bezug aus dem unmittelbaren Kontext verständlich.
  - marker: b
    text: 'Wörtlich: „in Gehorsam gegenüber meinem Vater“; das Griechische nennt nicht ausdrücklich, wer gehorsam war.'
    reason: Die Anmerkung weist auf die knappe und hinsichtlich des Handelnden offene griechische Formulierung hin.
lexical_decisions:
- source_word: διὰ τὰ δύο ταῦτα
  choice: durch diese beiden
  rationale: Bewahrt den Rückverweis auf die zuvor genannten beiden Gefahren, Gold und die Schönheit von Frauen, ohne sie erläuternd in den Haupttext einzutragen.
- source_word: εἰς ἀπώλειαν πορνείας
  choice: am Verderben der Unzucht zugrunde gehen
  rationale: Gibt sowohl ἀπώλεια als Verderben/Untergang als auch πορνεία als Unzucht wieder; die ungewöhnlich verdichtete griechische Wendung wird in verständliches Deutsch überführt, ohne ihren Zusammenhang auf eine bestimmte Einzeltat einzuengen.
- source_word: ἀλλοιώσουσι
  choice: verderben
  rationale: Das Verb bezeichnet hier eine nachteilige Veränderung beziehungsweise moralische Entstellung; „verderben“ ist im Deutschen natürlich und kontextgerecht.
- source_word: βασιλείαν Ἰούδα
  choice: das Königtum Judas
  rationale: „Königtum“ wahrt den möglichen Bezug auf Herrschaft, Königswürde oder Dynastie besser als das stärker territorial verstandene „Königreich“.
- source_word: ἐν ὑπακοῇ πατρός μου
  choice: durch meinen Gehorsam gegenüber meinem Vater
  rationale: Der Kontext legt nahe, dass Juda wegen seines Gehorsams gegenüber seinem Vater die Herrschaft empfing; das im Griechischen unausgedrückte Subjekt des Gehorsams wird für klares modernes Deutsch ergänzt.
theological_decisions:
- issue: Ursache des Niedergangs Judas
  choice: Die beiden zuvor genannten Verlockungen wirken als Ursache moralischen und politischen Verderbens.
  alternative: Die Aussage als allgemeine Warnung vor kanaanitischen Ehen, Reichtum, Geschenken und jeder bösen Tat ausweiten.
  rationale: Der erhaltene griechische Text nennt ausdrücklich „diese beiden“ und verbindet sie mit Unzucht, der Verderbnis weiser Nachkommen und der Schmälerung des Königtums. Die breitere Paränese der englischen Konsultationsfassung wird daher nicht in den Vers importiert.
- issue: Grund für die Gabe des Königtums
  choice: Das Königtum wird als Gabe des Herrn im Zusammenhang mit Judas Gehorsam gegenüber seinem Vater beschrieben.
  alternative: „im Gehorsam meines Vaters“, wobei der Vater selbst als der Gehorsame verstanden würde.
  rationale: 'Die griechische Genitivfügung ist knapp, doch der Erzählzusammenhang stützt die objektive Lesart: Juda gehorchte seinem Vater. Eine Fußnote weist auf die sprachliche Kürze hin.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer warnender Tonlage. „Unzucht“ und „Königtum“ sind bewusst etwas gehoben, aber allgemein verständlich und sachlich genauer als umgangssprachliche Alternativen. Der Entwurf folgt vorrangig dem griechischen Quellenwortlaut; die deutlich erweiterte englische Paraphrase dient nicht als Basistext.
