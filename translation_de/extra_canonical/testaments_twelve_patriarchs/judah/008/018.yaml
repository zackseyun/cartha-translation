review_pass:
  verdict: revise
  source_fidelity: Der Entwurf folgt dem griechischen Text grundsätzlich gut und vermeidet zu Recht die im englischen Audit-Text hinzugefügte Bedingung einer „Gelegenheit zur Begierde“, die im vorliegenden Griechisch nicht steht. Der Wechsel von τις („jemand“) zu τὸν νοῦν σου („deinen Verstand“) sowie die danach wieder singularischen Verben ist jedoch nicht nur eine Frage des erschlossenen Subjekts, sondern auch ein auffälliger Personenwechsel. Die Hauptfassung darf ihn glätten, sollte dies aber in der Anmerkung präziser dokumentieren.
  naturalness: „Erhitzt den Körper zur Unzucht um der Lust willen“ ist verständlich, wirkt im modernen Standarddeutsch jedoch syntaktisch schwer und leicht zweideutig. „Entflammt den Körper zur Unzucht und zur Lust“ gibt die Bildsprache und die auf Lust gerichtete Zielangabe flüssiger wieder. „Unreine Gedanken“ ist in diesem moralisch-paränetischen Register idiomatischer als „schmutzige Gedanken“, ohne die Wertung abzuschwächen.
  terminology: „Unzucht“ ist als Wiedergabe von πορνεία in diesem Text angemessen und wahrt den wertenden, nicht auf einen einzelnen Akt beschränkten Charakter. „Die Sünde“ gibt τὴν ἁμαρτίαν angemessen wieder. Die Formulierung soll keine über den Text hinausgehende sexualethische Auslegung festlegen.
  issues:
  - severity: low
    issue: Die Fußnote beschreibt die grammatische Unebenheit unvollständig.
    rationale: Sie nennt den Wechsel von „jemand“ zu „deinen Verstand“, erklärt aber nicht klar, dass die folgenden Verben im Griechischen weiterhin Singularformen sind und ihr Subjekt nicht ausdrücklich genannt wird. Die Formulierung „der Wein beziehungsweise das Trinken“ ist zudem unnötig unbestimmt.
  - severity: low
    issue: Die Wendung „zur Unzucht um der Lust willen“ ist im Deutschen schwerfällig.
    rationale: Sie ist nicht falsch, bildet πρὸς ἡδονήν aber weniger natürlich ab als eine koordinierte Zielangabe und kann deshalb stilistisch verbessert werden.
  revised_text: Denn wenn jemand Wein trinkt, bis er betrunken ist, bringt der Wein[a] den Verstand durch unreine Gedanken in Aufruhr und entflammt den Körper zur Unzucht und zur Lust; dann begeht der Mensch die Sünde und schämt sich nicht.
