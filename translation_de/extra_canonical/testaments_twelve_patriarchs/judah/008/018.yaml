id: T12P.JUD.8.18
reference: Testament of Judah 8:18
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐὰν γὰρ πίῃ τις οἶνον εἰς μέθην, ἐν διαλογισμοῖς ῥυπαροῖς συνταράσσει τὸν νοῦν σου, καὶ εἰς πορνείαν ἐκθερμαίνει τὸ σῶμα πρὸς ἡδονήν, καὶ πράσσει τὴν ἁμαρτίαν καὶ οὐκ αἰσχύνεται.
  language: Greek
  note: Greek from Charles XIV.3 (α). Project ch.8 is a thematic consolidation; sourced from Charles ch.XIV.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/008/018.yaml
  text: For if one drinks wine to drunkenness, it disturbs the mind with filthy thoughts and leads the body on to sexual union; and if the occasion of desire is present, he commits the sin and is not ashamed.
translation:
  language: de
  text: Denn wenn jemand Wein trinkt, bis er betrunken ist, bringt der Wein[a] den Verstand durch unreine Gedanken in Aufruhr und entflammt den Körper zur Unzucht und zur Lust; dann begeht der Mensch die Sünde und schämt sich nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich wechselt der griechische Text von „jemand“ zu „deinen Verstand“. Die folgenden Singularverben haben kein ausdrücklich genanntes Subjekt; im Zusammenhang ist zunächst der Wein gemeint, ehe die Aussage wieder den Trinkenden betrifft.
    reason: Die Anmerkung weist den Personenwechsel und das implizite, im Satzverlauf wechselnde Subjekt genauer aus, ohne die verständliche Glättung im deutschen Haupttext zu überladen.
lexical_decisions:
- source_word: εἰς μέθην
  choice: bis er betrunken ist
  rationale: Gibt das Ziel beziehungsweise Ergebnis des Trinkens natürlich und präzise wieder.
- source_word: ἐν διαλογισμοῖς ῥυπαροῖς
  choice: durch schmutzige Gedanken
  rationale: Bewahrt sowohl den gedanklichen Bezug von διαλογισμοῖς als auch die moralische Unreinheit von ῥυπαροῖς.
- source_word: συνταράσσει τὸν νοῦν σου
  choice: bringt ... den Verstand ... in Aufruhr
  rationale: Entspricht der starken Bedeutung von συνταράσσει; das griechische σου wird wegen des Wechsels von der unbestimmten dritten Person zur zweiten Person in einer Fußnote kenntlich gemacht.
- source_word: εἰς πορνείαν
  choice: zur Unzucht
  rationale: Gibt πορνείαν als umfassenden Ausdruck für unerlaubtes sexuelles Verhalten wieder, ohne es auf bloße 'sexuelle Vereinigung' zu verengen.
- source_word: ἐκθερμαίνει τὸ σῶμα πρὸς ἡδονήν
  choice: erhitzt den Körper ... um der Lust willen
  rationale: Bewahrt die körperliche Bildsprache des Erhitzens und den ausdrücklichen Bezug auf Lust.
- source_word: πράσσει τὴν ἁμαρτίαν
  choice: begeht die Sünde
  rationale: Formale und idiomatische Wiedergabe; der bestimmte Artikel bleibt in 'die Sünde' erkennbar.
theological_decisions:
- issue: Zusammenhang zwischen Trunkenheit, Begierde und Sünde
  choice: Die Aussage als fortschreitende Wirkungskette wiedergeben, ohne eine zusätzliche Bedingung einzufügen.
  alternative: 'Wie die englische Konsultationsfassung einen Bedingungssatz ergänzen: ''wenn sich eine Gelegenheit zur Begierde bietet''.'
  rationale: Im vorgelegten griechischen Text steht kein entsprechender Bedingungssatz. Die direkte Folge zur begangenen Sünde soll daher nicht abgeschwächt oder interpretierend erweitert werden.
- issue: Bedeutungsumfang von πορνεία
  choice: Unzucht
  alternative: sexuelle Vereinigung
  rationale: '''Unzucht'' erhält den moralisch wertenden und breiteren Bedeutungsumfang des griechischen Ausdrucks; ''sexuelle Vereinigung'' wäre neutraler und enger.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drastische moralische Sprache des Ausgangstextes bleibt erhalten; zugleich wird die syntaktische Unebenheit des Griechischen im Haupttext behutsam geglättet und in der Fußnote offengelegt.
