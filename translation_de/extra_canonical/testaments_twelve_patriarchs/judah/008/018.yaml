revisions:
- from: Denn wenn jemand Wein trinkt, bis er betrunken ist, bringt der Wein[a] den Verstand durch schmutzige Gedanken in Aufruhr, erhitzt den Körper zur Unzucht um der Lust willen, und der Mensch begeht die Sünde und schämt sich nicht.
  to: Denn wenn jemand Wein trinkt, bis er betrunken ist, bringt der Wein[a] den Verstand durch unreine Gedanken in Aufruhr und entflammt den Körper zur Unzucht und zur Lust; dann begeht der Mensch die Sünde und schämt sich nicht.
  rationale: Die Überarbeitung bewahrt die direkte Wirkungskette des griechischen Textes und ergänzt keine im Ausgangstext fehlende Bedingung. Sie verbessert lediglich die idiomatische deutsche Formulierung und präzisiert die Anmerkung zur auffälligen griechischen Syntax. Das „dann“ markiert die im Deutschen sonst schwer lesbare Rückkehr zum Handelnden, ohne eine zusätzliche sachliche Bedingung einzuführen.
  reviewer_model: gpt-5.6-terra
