id: T12P.JUD.20.1
reference: Testament of Judah 20:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: ὁδηγεῖ³, ὅτι⁴ ἐν πλάνῃ ἀργυρίου τοὺς μὴ ὄντας θεοὺς⁵ ὀνομάζουσι, καὶ ποιεῖ τὸν ἔχοντα⁷ αὐτὴν εἰς ἔκστασιν ἐμπεσεῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/001.yaml
  text: For it leads astray, because in the delusion of silver they call those who are not gods gods, and it causes the one who has it to fall into ecstasy.
translation:
  language: de
  text: 'Denn sie führt in die Irre: Im Wahn des Silbers nennen sie die, die keine Götter sind, Götter, und sie bringt den, der sie besitzt, dazu, außer sich zu geraten.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „in Ekstase zu fallen“; das griechische Wort kann auch einen Zustand des Außersichseins oder der Verwirrung bezeichnen.'
    reason: Die Bedeutungsbreite von ἔκστασις soll sichtbar bleiben, ohne im Haupttext vorschnell zwischen mystischer Ekstase und Raserei zu entscheiden.
lexical_decisions:
- source_word: ὁδηγεῖ
  choice: führt in die Irre
  rationale: Der unmittelbare Zusammenhang und πλάνῃ bestimmen das sonst allgemeinere „führt“ als irreführendes Leiten.
- source_word: ἐν πλάνῃ ἀργυρίου
  choice: im Wahn des Silbers
  rationale: „Wahn“ bewahrt den Gedanken einer täuschenden Verblendung; „Silber“ gibt ἀργύριον formal wieder und lässt den Bezug auf Geld oder Reichtum offen.
- source_word: τοὺς μὴ ὄντας θεοὺς ... θεοὺς
  choice: die, die keine Götter sind, Götter
  rationale: Die zugespitzte Wiederholung von θεούς wird erhalten.
- source_word: τὸν ἔχοντα αὐτήν
  choice: den, der sie besitzt
  rationale: Das feminine Pronomen wird auf die im Kontext bezeichnete Sache bezogen; „besitzt“ ist für ἔχειν in Verbindung mit Silber natürlich, ohne die Referenz im Text ausdrücklich festzulegen.
- source_word: εἰς ἔκστασιν ἐμπεσεῖν
  choice: außer sich zu geraten
  rationale: Die idiomatische Wendung bildet den Zustand des ἔκστασις ab, ohne positiv-mystische „Ekstase“ oder ausschließlich negative „Raserei“ festzuschreiben.
theological_decisions:
- issue: Bezeichnung nichtgöttlicher Wesen als Götter
  choice: „die, die keine Götter sind, Götter“
  alternative: „Nichtgötter Götter nennen“
  rationale: Die Formulierung wahrt die ausdrückliche ontologische Verneinung des griechischen Textes, ohne zu bestimmen, ob Götzenbilder, Dämonen oder andere Mächte gemeint sind.
- issue: Deutung von ἔκστασις
  choice: „außer sich geraten“ mit Fußnote
  alternative: „in Ekstase geraten“ oder „in Raserei verfallen“
  rationale: Der griechische Ausdruck kann Entrückung, den Verlust normaler Selbstkontrolle oder einen verstörten Zustand bezeichnen. Der Haupttext bewahrt diese Spannung; die Fußnote nennt die engere Wiedergabemöglichkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am griechischen Gedankengang, wird aber durch den Doppelpunkt lesbarer. Das wiederholte „Götter“ ist bewusst beibehalten; die Pronomenreferenz „sie“ bleibt entsprechend der Vorlage kontextabhängig.
