  text: But the God of my fathers had mercy on me, because I did this in ignorance.
translation:
  language: de
  text: Aber der Gott meiner Väter erbarmte sich meiner, weil ich dies aus Unwissenheit getan hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεὸς τῶν πατέρων μου
  choice: der Gott meiner Väter
  rationale: Gibt die familiär-bundestheologische Wendung eng und in natürlichem biblischem Deutsch wieder.
- source_word: ἐλέησε με
  choice: erbarmte sich meiner
  rationale: Bewahrt die Bedeutung von ἐλεέω und verwendet eine würdige, im modernen Standarddeutsch verständliche Formulierung.
- source_word: ἐν ἀγνωσίᾳ
  choice: aus Unwissenheit
  rationale: Drückt den Umstand beziehungsweise Beweggrund der Tat idiomatisch aus, ohne die Aussage zu entschuldigen oder weiter auszudeuten.
- source_word: τοῦτο ἐποίησα
  choice: ich dies … getan hatte
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass die Tat dem Erbarmen vorausging; τοῦτο bleibt mit „dies“ bewusst unspezifisch.
theological_decisions:
- issue: Verhältnis zwischen Gottes Erbarmen und der unwissentlich begangenen Tat
  choice: „weil ich dies aus Unwissenheit getan hatte“
  alternative: „denn ich hatte dies aus Unwissenheit getan“
  rationale: ὅτι wird kausal wiedergegeben. Die Formulierung bewahrt die im Text vorhandene Begründung, ohne daraus eine allgemeine Lehre über Schuld oder Vergebung abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht biblischem Klang. Keine Fußnote erforderlich, da der griechische Text an dieser Stelle knapp und hinreichend eindeutig ist.
