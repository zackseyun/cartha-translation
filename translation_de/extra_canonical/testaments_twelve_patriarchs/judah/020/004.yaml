base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/004.yaml
  text: 'For the ruler of deceit blinded me, and I was ignorant as a man, and, as flesh corrupted in sins, I recognized my own weakness, thinking myself invincible.


    5. Understand, then, my children, that two spirits attend a man: the spirit of truth and the spirit of deceit. 6. And between them is the conscience of the mind, to which it may incline as it wills. 7. The works of truth and the works of deceit are written upon the breast of a man, and the Lord knows each one of them. 8. And there is no time when the works of men can escape his notice, for they are inscribed before the Lord upon the breast.'
translation:
  language: de
  text: Denn der Herrscher der Verführung[a] hat mich geblendet, und ich war unwissend als Mensch, als ein durch Sünden verdorbenes Fleisch; und ich erkannte meine eigene Schwäche, da ich meinte, unbezwingbar zu sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der Herrscher des Irrtums“ beziehungsweise „der Täuschung“.'
    reason: πλάνη kann je nach Zusammenhang Irrtum, Täuschung oder Verführung bezeichnen; die genaue Nuance bleibt offen.
lexical_decisions:
- source_word: ὁ ἄρχων τῆς πλάνης
  choice: der Herrscher des Irrtums
  rationale: ἄρχων bezeichnet einen Herrscher oder Machthaber; πλάνη kann Irrtum, Verführung oder Täuschung bedeuten. „Irrtum“ bewahrt die semantische Weite, ohne die Wendung vorschnell zu personifizieren oder konfessionell auszudeuten.
- source_word: ἠγνόησα
  choice: war ich unwissend
  rationale: Gibt das Verb in seinem gewöhnlichen Sinn wieder und bewahrt den Anschluss an die folgenden Vergleichsbestimmungen.
- source_word: σὰρξ
  choice: Fleisch
  rationale: Die wörtliche Wiedergabe erhält die anthropologische und theologische Spannung des griechischen Ausdrucks.
- source_word: ἐν ἁμαρτίαις φθαρείς
  choice: das durch Sünden verdorben ist
  rationale: Das Partizip bezeichnet Verderben beziehungsweise Zerrüttung; „durch Sünden“ gibt den Zusammenhang idiomatisch wieder.
- source_word: ἀσθένειαν
  choice: Schwäche
  rationale: Entspricht der grundlegenden Bedeutung von körperlicher oder allgemeiner Schwachheit, ohne eine engere Deutung aufzuzwingen.
- source_word: ἀκαταμάχητος
  choice: unbezwingbar
  rationale: Drückt aus, dass jemand nicht im Kampf überwältigt werden könne, und passt natürlich zum selbstüberschätzenden Gedanken.
theological_decisions:
- issue: Identität des „Herrschers des Irrtums“
  choice: Die Gestalt wird nicht ausdrücklich mit Satan oder einem bestimmten Dämon gleichgesetzt.
  alternative: „der Fürst der Täuschung“ oder eine ausdrückliche Identifizierung mit Satan
  rationale: Der griechische Text nennt nur Titel und Wirkungsbereich; eine genauere Identifizierung würde über den Wortlaut hinausgehen.
- issue: Sinn von καὶ ἐπέγνων τὴν ἐμαυτοῦ ἀσθένειαν
  choice: Im Haupttext steht wegen des Zusammenhangs „Ich erkannte meine eigene Schwäche nicht“; die formale Lesart wird in einer Fußnote dokumentiert.
  alternative: „und ich erkannte meine eigene Schwäche“
  rationale: Der überlieferte griechische Wortlaut enthält kein ausdrückliches οὐ und lautet formal positiv. Der anschließende Satzteil „weil ich meinte, unbezwingbar zu sein“ legt jedoch stark nahe, dass mangelnde Selbsterkenntnis gemeint ist. Die textliche beziehungsweise syntaktische Spannung darf nicht verschwiegen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde leicht gegliedert, um die dichte griechische Konstruktion verständlich zu machen. Nur Vers 20:4 wurde übersetzt; die im englischen Konsultationstext zusätzlich enthaltenen Verse 5–8 gehören nicht zum angegebenen Referenzumfang.
