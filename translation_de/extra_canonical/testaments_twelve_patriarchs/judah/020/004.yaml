revisions:
- from: Denn der Herrscher des Irrtums[a] hatte mich blind gemacht. So war ich unwissend wie ein Mensch und als Fleisch, das durch Sünden verdorben ist. Ich erkannte meine eigene Schwäche nicht[b], weil ich meinte, unbezwingbar zu sein.
  to: Denn der Herrscher der Verführung[a] hat mich geblendet, und ich war unwissend als Mensch, als ein durch Sünden verdorbenes Fleisch; und ich erkannte meine eigene Schwäche, da ich meinte, unbezwingbar zu sein.
  rationale: Die unüberlieferte Negation wurde entfernt und die zugehörige Fußnote gestrichen. Damit folgt der Haupttext dem positiven ἐπέγνων und bewahrt die möglicherweise absichtliche Spannung zum anschließenden Selbstverständnis als „unbezwingbar“. Die Bezeichnung des Herrschers wurde idiomatisch gefasst und ihre semantische Offenheit in einer Fußnote bewahrt.
