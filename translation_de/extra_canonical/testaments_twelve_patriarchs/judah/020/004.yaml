    issue: Unbelegte Negation bei der Erkenntnis der eigenen Schwäche
    rationale: Der Haupttext fügt zu καὶ ἐπέγνων τὴν ἐμαυτοῦ ἀσθένειαν ein „nicht“ hinzu, obwohl der griechische Wortlaut keine Negation enthält. Eine Fußnote, die den abweichenden Wortlaut nennt, heilt die Änderung im Haupttext nicht.
  - severity: medium
    issue: Fußnote b verlagert eine kontextuelle Vermutung in den Haupttext
    rationale: Die Fußnote dokumentiert zwar die Spannung, doch der Zusammenhang ist keine ausreichende Grundlage, den ausdrücklich positiven Text in sein Gegenteil zu verkehren. Die mögliche gedankliche Spannung soll im Text erhalten bleiben.
  revised_text: Denn der Herrscher der Verführung[a] hat mich geblendet, und ich war unwissend als Mensch, als ein durch Sünden verdorbenes Fleisch; und ich erkannte meine eigene Schwäche, da ich meinte, unbezwingbar zu sein.
