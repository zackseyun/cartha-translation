  text: Ἐτύφλωσε γάρ²⁴ με ὁ ἄρχων τῆς πλάνης²⁵, καὶ ἠγνόησα²⁶ ὡς ἄνθρωπος²⁷ καὶ ὡς σὰρξ²⁸ ἐν ἁμαρτίαις φθαρείς²⁹, καὶ³⁰ ἐπέγνων³¹ τὴν ἐμαυτοῦ ἀσθένειαν, νομίζων³² ἀκαταμάχητος εἶναι¹.
