  to: Wegen des Silbers habe ich, meine Kinder, meine Kinder verloren. Wären mir nicht meine Umkehr und meine Demütigung sowie die Gebete meines Vaters zu Hilfe gekommen, wäre ich kinderlos gestorben.
  rationale: Die Revision ordnet lediglich die deutsche Satzstellung um und kennzeichnet die erste Nennung von „meine Kinder“ eindeutig als Anrede. Die auffällige Wiederholung bleibt als Merkmal des griechischen Textes erhalten. Der kontrafaktische Bedingungssatz wird im Deutschen flüssiger formuliert, ohne die Aussage oder die gemeinsame Subjektfunktion von Umkehr, Demütigung und den Gebeten des Vaters zu verändern.
