  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/020/002.yaml
  text: Because of silver I lost my children; and if my repentance and my humiliation, and the prayers of my father, had not come to my aid, I would have died childless.
translation:
  language: de
  text: Wegen des Silbers habe ich, meine Kinder, meine Kinder verloren. Wären mir nicht meine Umkehr und meine Demütigung sowie die Gebete meines Vaters zu Hilfe gekommen, wäre ich kinderlos gestorben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀργύριον
  choice: Silber
  rationale: Die konkrete Bedeutung des griechischen Wortes wird beibehalten; im Zusammenhang kann Silber zugleich als Geld beziehungsweise käuflicher Gewinn verstanden werden.
- source_word: μετάνοιά
  choice: Umkehr
  rationale: „Umkehr“ gibt die innere Sinnesänderung und Abkehr vom früheren Handeln im Deutschen umfassender wieder als bloße Reue.
- source_word: ταπείνωσίς
  choice: Demütigung
  rationale: Die Wiedergabe bewahrt die mögliche Spannung zwischen einem demütigen Sich-Beugen und erfahrener Erniedrigung, ohne den Sinn auf eine rein innere Tugend festzulegen.
- source_word: συνεδράμον
  choice: zu Hilfe gekommen wären
  rationale: Die idiomatische deutsche Formulierung bildet das bildhafte „mit-/zusammenlaufen“ als wirksames Beistehen ab.
- source_word: ἄτεκνος
  choice: kinderlos
  rationale: Direkte und natürliche Wiedergabe des griechischen Adjektivs.
theological_decisions:
- issue: Zusammenwirken von Umkehr, Demütigung und den Gebeten des Vaters
  choice: Alle drei werden parallel als zu Hilfe kommend dargestellt.
  alternative: Die Rettung ausschließlich den Gebeten des Vaters oder ausschließlich Judas eigener Buße zuschreiben.
  rationale: Die griechische Syntax nennt die drei Größen gemeinsam als Subjekt des Beistands; ihre Spannung wird nicht dogmatisch aufgelöst.
translation_notes:
  register: 'Moderne, würdevolle Standardsprache. Die doppelte Verwendung von „meine Kinder“ wird bewahrt: zuerst als Anrede und danach als Objekt von „verlor“, entsprechend der überlieferten griechischen Wortfolge.'
