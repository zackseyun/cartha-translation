  text: And the Spirit of truth accuses all, and the sinner is consumed from his own heart, and to lift up
translation:
  language: de
  text: Und der Geist der Wahrheit klagt alle an[a]. Der Sünder ist aus seinem eigenen Herzen heraus in Brand geraten[b] und kann sein Angesicht nicht zum Richter hin erheben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „klagt alles an“. Das griechische „alle“ kann sich auf Personen oder auf Dinge beziehungsweise Taten beziehen.'
    reason: Bewahrt die grammatische Mehrdeutigkeit von πάντων.
  - marker: b
    text: 'Wörtlich etwa: „ist aus seinem eigenen Herzen heraus in Brand gesetzt worden“. Die ungewöhnliche Verbindung mit „aus“ kann das eigene Herz als Ursprung oder Ausgangspunkt des Entflammtseins bezeichnen; die genaue Beziehung bleibt offen.'
    reason: Erläutert ἐμπεπύρισται und ἐκ, ohne ein Feuer als Agens oder ein Verzehrtwerden hinzuzufügen.
lexical_decisions:
- source_word: τὸ πνεῦμα τῆς ἀληθείας
  choice: der Geist der Wahrheit
  rationale: Bewahrt die substantivische Wendung und ihre mögliche personale wie auch nichtpersonale Deutung, ohne sie näher festzulegen.
- source_word: κατηγορεῖ
  choice: klagt … an
  rationale: Gibt die forensische Grundbedeutung des Verbs natürlich und im Blick auf den später genannten Richter kontextgerecht wieder.
- source_word: πάντων
  choice: alle
  rationale: Der Genitiv Plural kann sich auf Personen oder Sachen beziehen; im Deutschen bleibt „alle“ ähnlich offen.
- source_word: ἐμπεπύρισται
  choice: wird … vom Feuer verzehrt
  rationale: Bringt das Bild des in Brand Geratens beziehungsweise Verbrennens deutlich zum Ausdruck; die deutsche Passivform ist idiomatischer als eine starre Nachbildung des griechischen Perfekts.
- source_word: ἐκ τῆς ἰδίας καρδίας
  choice: aus seinem eigenen Herzen heraus
  rationale: Bewahrt die ungewöhnliche Herkunfts- oder Ausgangsangabe mit ἐκ und löst nicht vorschnell auf, ob das Herz Quelle, Ursache oder innerer Ort des Feuers ist.
- source_word: ἆραι πρόσωπον
  choice: sein Angesicht … erheben
  rationale: Entspricht der idiomatischen Wendung für ein zuversichtliches oder unbeschämtes Auftreten und wahrt den würdevollen Ton.
- source_word: πρὸς τὸν κριτὴν
  choice: zum Richter
  rationale: Gibt Richtung und Bezug der Bewegung knapp wieder; der Richter wird nicht näher identifiziert.
theological_decisions:
- issue: Personenstatus des „Geistes der Wahrheit“
  choice: Keine zusätzliche Personalisierung über die grammatische Form hinaus
  alternative: „Geist“ ausdrücklich als göttliche Person oder lediglich als innere Haltung deuten
  rationale: Der griechische Text selbst legt an dieser Stelle keine eindeutige dogmatische Identifikation fest.
- issue: Reichweite von πάντων
  choice: „alle“ mit Fußnote zur Mehrdeutigkeit
  alternative: „alle Menschen“ oder „alles“
  rationale: So bleibt offen, ob alle Personen oder alle Dinge beziehungsweise Taten gemeint sind.
- issue: Ursprung des verzehrenden Feuers
  choice: Die ungewöhnliche Formulierung „aus seinem eigenen Herzen heraus“ bewahren
  alternative: Das Herz als eindeutige Ursache, Gewissensqual oder Ort innerer Selbstanklage auslegen
  rationale: Der Ausgangstext nennt das eigene Herz, erklärt aber die genaue Beziehung zum Feuer nicht.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. „Angesicht“ wurde in der gerichtlichen Bildsprache beibehalten; die Syntax wurde für natürliches Deutsch in zwei Sätze gegliedert. Der im konsultierten englischen Text abgebrochene Schluss wurde anhand des vollständig vorliegenden griechischen Ausgangstextes übersetzt.
