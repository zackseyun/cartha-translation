source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ νῦν ἐντέλλομαι ὑμῖν, τέκνα μου, μὴ ἀγαπᾶτε⁵ ἀργύριον⁶ μηδὲ ἐπιβλέπει⁷ *εἰς κάλλος⁸ γυναικῶν, ὅτι κἀγὼ διὰ χρυσίον καὶ εὐμορφίαν¹⁰ ἐπλανήθην εἰς Βησουὲ¹¹ τὴν Χαναναίαν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017/001.yaml
  text: 'And now I command you, my children: do not love silver, nor set your gaze on the beauty of women; for I too, because of gold and beauty, was led astray to Besue the Canaanite woman.'
translation:
  language: de
  text: 'Und nun gebiete ich euch, meine Kinder: Liebt nicht das Silber und richtet euren Blick nicht auf die Schönheit von Frauen; denn auch ich wurde durch Gold und Schönheit zu Besue, der Kanaaniterin, verleitet.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντέλλομαι
  choice: gebiete ich
  rationale: Gibt die nachdrückliche väterliche Weisung präzise und in würdigem Deutsch wieder.
- source_word: ἀργύριον
  choice: Silber
  rationale: Bewahrt die konkrete Bedeutung des griechischen Wortes; im Zusammenhang kann Silber zugleich für Geld beziehungsweise Reichtum stehen.
- source_word: ἐπιβλέπει εἰς κάλλος γυναικῶν
  choice: richtet euren Blick nicht auf die Schönheit von Frauen
  rationale: Bildet die Blickrichtung des griechischen Ausdrucks natürlich ab, ohne die Warnung interpretierend zu verschärfen.
- source_word: ἐπλανήθην εἰς
  choice: ließ mich … zu … verleiten
  rationale: Vermittelt das Irregeführtwerden und erhält zugleich die ungewöhnliche Zielrichtung εἰς auf die genannte Frau hin.
- source_word: Βησουὲ τὴν Χαναναίαν
  choice: Besue, der Kanaaniterin
  rationale: Transliteriert den Eigennamen und gibt die feminine Volksbezeichnung eindeutig wieder.
theological_decisions:
- issue: Art der Warnung vor Silber und weiblicher Schönheit
  choice: Die konkreten Gegenstände der Warnung bleiben unverändert stehen.
  alternative: Die Aussage als allgemeine Warnung vor Habgier und sexueller Begierde paraphrasieren.
  rationale: Der griechische Text nennt ausdrücklich Silber, Gold und Schönheit; eine abstrakte Deutung würde die bildhafte und biografische Spannung voreilig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter väterlicher Anrede. Die Satzstruktur bleibt nahe am griechischen Gedankengang, klingt aber im Deutschen flüssig.
