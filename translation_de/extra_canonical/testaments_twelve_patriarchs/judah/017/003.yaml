id: T12P.JUD.17.3
reference: Testament of Judah 17:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: ὅτι καὶ¹⁶ καίγε σοφοὺς ἄνδρας τῶν υἱῶν μου ἀλλοιώσουσι, καὶ βασιλείαν¹⁷ Ἰούδα σμικρυνθῆναι ποιήσουσιν¹⁸, ἣν ἔδωκέ μοι Κύριος ἐν ὑπακοῇ πατρός μου¹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017/003.yaml
  text: For they will even corrupt wise men from among my sons, and they will cause the kingdom of Judah to be diminished, which he gave me because of my obedience to my father Jacob.
translation:
  language: de
  text: Denn sie werden sogar weise Männer unter meinen Söhnen verderben und bewirken, dass das Königtum Judas geschmälert wird, das mir der Herr wegen meines Gehorsams gegenüber meinem Vater gegeben hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀλλοιώσουσι
  choice: werden … verderben
  rationale: Das Verb bedeutet grundsätzlich „verändern, anders machen“; im feindlichen Zusammenhang bezeichnet es hier eine Veränderung zum Schlechteren. „Verderben“ gibt diesen negativen Sinn natürlich wieder, ohne eine bestimmte Art der Verführung festzulegen.
- source_word: βασιλείαν Ἰούδα
  choice: das Königtum Judas
  rationale: βασιλεία kann Herrschaft, Königtum oder Königreich bezeichnen. „Königtum“ passt zur abstrakten Vorstellung einer geschmälerten judäischen Herrschaft und bewahrt den möglichen dynastischen Bezug.
- source_word: σμικρυνθῆναι ποιήσουσιν
  choice: bewirken, dass … geschmälert wird
  rationale: Die kausative Konstruktion wird formal und zugleich verständlich wiedergegeben; „geschmälert“ kann sowohl eine Verringerung von Macht als auch von Umfang ausdrücken.
- source_word: ἐν ὑπακοῇ πατρός μου
  choice: wegen meines Gehorsams gegenüber meinem Vater
  rationale: ἐν bezeichnet hier wahrscheinlich den Umstand beziehungsweise Grund der Gabe. Der griechische Text nennt den Vater nicht ausdrücklich Jakob, daher wird der Name nicht ergänzt.
theological_decisions:
- issue: Subjekt von ἔδωκέ μοι
  choice: „der Herr“ wird ausdrücklich als Geber genannt
  alternative: „er gab mir“
  rationale: Anders als die jüngste englische Revision behauptet, steht Κύριος ausdrücklich im überlieferten griechischen Text. Die Übersetzung darf diese Gottesbezeichnung nicht auslassen.
- issue: Bedeutungsumfang von βασιλεία
  choice: Königtum
  alternative: Königreich oder Herrschaft
  rationale: „Königtum“ lässt offen, ob primär die Dynastie, die königliche Gewalt oder der Herrschaftsbereich gemeint ist, und vermeidet eine unnötige Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der griechischen Argumentation, wurde aber für heutige Leser geglättet. Keine Ergänzung des Namens Jakob, da im griechischen Ausgangstext nur „mein Vater“ steht.
