source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Καὶ οἶδα¹² ὅτι διὰ τὰ δύο ταῦτα ἔσται¹³ τὸ γένος μου¹⁴ *εἰς ἀπώλειαν πορνείας¹⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017/002.yaml
  text: And I know that because of these two things my offspring will be for destruction because of sexual immorality.
translation:
  language: de
  text: Und ich weiß, dass meine Nachkommenschaft wegen dieser beiden Dinge dem Verderben durch sexuelle Unmoral verfallen wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „zum Verderben der sexuellen Unmoral“. Das Griechische lässt offen, ob sexuelle Unmoral als Ursache des Verderbens oder als nähere Kennzeichnung dieses Verderbens gemeint ist.'
    reason: Bewahrt die Mehrdeutigkeit der Genitivverbindung ἀπώλειαν πορνείας, die in flüssigem Deutsch nicht vollständig nachgebildet werden kann.
lexical_decisions:
- source_word: οἶδα
  choice: ich weiß
  rationale: Gibt das griechische Perfekt mit präsentischer Bedeutung unmittelbar und natürlich wieder.
- source_word: τὰ δύο ταῦτα
  choice: diese beiden Dinge
  rationale: Bewahrt den rückverweisenden, zugleich nicht näher aufgelösten Ausdruck des Ausgangstextes.
- source_word: τὸ γένος μου
  choice: meine Nachkommenschaft
  rationale: γένος bezeichnet hier Judas künftige Abstammungslinie; „Nachkommenschaft“ ist im Deutschen klarer als das mehrdeutige „Geschlecht“.
- source_word: εἰς ἀπώλειαν
  choice: dem Verderben verfallen
  rationale: Gibt die Ziel- bzw. Ergebnisrichtung von εἰς mit ἀπώλεια in natürlichem, würdigem Deutsch wieder.
- source_word: πορνείας
  choice: durch sexuelle Unmoral
  rationale: πορνεία bezeichnet unerlaubtes sexuelles Verhalten allgemein. Die Wiedergabe mit „durch“ versteht den Genitiv als Ursache bzw. Mittel des Verderbens, ohne ihn auf einen einzelnen Tatbestand zu verengen.
theological_decisions:
- issue: Verhältnis von ἀπώλεια und πορνεία
  choice: „Verderben durch sexuelle Unmoral“ im Haupttext, mit Hinweis auf die grammatische Offenheit
  alternative: „Verderben der sexuellen Unmoral“ oder „Verderben wegen sexueller Unmoral“
  rationale: Der Genitiv πορνείας kann das Verderben näher bestimmen oder dessen Ursache bezeichnen. Der Kontext und die konsultierte englische Fassung stützen die kausale Lesart; eine Fußnote bewahrt die sprachliche Mehrdeutigkeit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. „Dem Verderben verfallen“ vermeidet eine unnatürliche Wort-für-Wort-Konstruktion und erhält zugleich die ernste Zukunftsaussage.
