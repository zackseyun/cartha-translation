id: T12P.JUD.23.2
reference: Testament of Judah 23:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τὰς θυγατέρας ὑμῶν μουσικὰς καὶ δημοσίας¹² ποιήσετε¹³, *καὶ ἐπιμιγήσεσθε¹⁴ ἐν βδελύγμασι ἐθνῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023/002.yaml
  text: You will make your daughters musicians and public women, and you will mingle with the abominations of the nations.
translation:
  language: de
  text: Ihr werdet eure Töchter zu Musikerinnen und Prostituierten[a] machen und euch mit den Gräueln der Völker einlassen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „öffentlichen Frauen“; im damaligen Sprachgebrauch eine Bezeichnung für Prostituierte.'
    reason: Die wörtliche Formulierung ist im Deutschen missverständlich, trägt aber zur Erklärung der gewählten Bedeutungswiedergabe bei.
  - marker: b
    text: 'Oder: „euch mit den Gräueln der Völker vermischen“.'
    reason: Das griechische Verb kann wörtlicher ein Vermischen oder Sichverbinden ausdrücken; die Alternative bewahrt diese Bildlichkeit.
lexical_decisions:
- source_word: μουσικὰς
  choice: Musikerinnen
  rationale: Das feminine Adjektiv bezeichnet hier Frauen, die Musik ausüben beziehungsweise als musikalische Unterhalterinnen auftreten. „Musikerinnen“ gibt den naheliegenden Sinn knapp und verständlich wieder, ohne eine im Griechischen nicht ausdrücklich genannte Form der Darbietung festzulegen.
- source_word: δημοσίας
  choice: Prostituierten
  rationale: In Verbindung mit „Töchter“ bezeichnet „öffentliche Frauen“ im antiken Sprachgebrauch Frauen, die sexuell öffentlich verfügbar sind, also Prostituierte. Eine rein wörtliche Wiedergabe als „öffentliche Frauen“ wäre im modernen Deutschen irreführend.
- source_word: ἐπιμιγήσεσθε
  choice: euch … einlassen
  rationale: Das Verb bezeichnet ein Sichvermischen oder Sichverbinden. Im Zusammenhang mit „Gräueln“ drückt „sich mit etwas einlassen“ die Beteiligung idiomatisch aus, ohne eine bloß körperliche Vermischung nahezulegen.
- source_word: βδελύγμασι ἐθνῶν
  choice: Gräueln der Völker
  rationale: Die traditionelle und weiterhin verständliche Wendung bewahrt sowohl die starke moralisch-religiöse Wertung von βδέλυγμα als auch den pluralischen Bezug von ἐθνῶν.
theological_decisions:
- issue: Art der Verbindung mit den Gräueln der Völker
  choice: „euch mit den Gräueln der Völker einlassen“
  alternative: „euch unter den Gräueln der Völker vermischen“ oder „euch mit den Gräueln der Völker vermengen“
  rationale: Die Formulierung lässt offen, ob vor allem Teilnahme, soziale Vermischung oder kultische Verstrickung gemeint ist. Sie vermeidet, eine bestimmte konfessionelle oder ethnische Deutung in den Text einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Zukunftsansage und die scharfe Wertung des Ausgangstextes bleiben erhalten; altertümliche oder heute missverständliche Wendungen werden durch verständliche Entsprechungen wiedergegeben.
