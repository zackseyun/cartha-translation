source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*ἕως τῆς¹¹ παρουσίας Θεοῦ¹² τῆς δικαιοσύνης¹³, *τοῦ ἡσυχάσαι τὸν¹⁴ Ἰακὼβ¹⁵ ἐν εἰρήνῃ καὶ πάντα τὰ ἔθνη¹⁴. 3. Καὶ αὐτὸς φυλάξει κράτος¹⁵ τῆς βασιλείας μου¹⁶ ἕως¹⁷ αἰῶνος¹⁸· ὅρκῳ γὰρ ὤμοσέ¹⁹ μοι Κύριος μὴ ἐξαλείψειν²⁰ τὸ βασίλειον ἐκ τοῦ σπέρματός μου ἕως αἰῶνος²¹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023/001.yaml
  text: Until the coming of the God of righteousness, to give Jacob rest in peace, and all the nations. And he will preserve the might of my kingdom forever; for the Lord swore to me by an oath not to blot out the kingdom. Much grief is mine, my children, because of the sexual immoralities and sorceries that you will do in the kingdom, following ventriloquists, omens, and deceiving demons.
translation:
  language: de
  text: Bis zum Kommen des Gottes der Gerechtigkeit, um Jakob und allen Völkern in Frieden Ruhe zu geben. Und er wird die Macht meines Königtums in Ewigkeit bewahren; denn der Herr hat mir bei einem Eid geschworen, das Königtum meiner Nachkommenschaft nicht in Ewigkeit auszulöschen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρουσία
  choice: Kommen
  rationale: Gibt das Eintreffen bzw. die Ankunft natürlich und ohne zusätzliche endzeitliche Festlegung wieder.
- source_word: Θεοῦ τῆς δικαιοσύνης
  choice: des Gottes der Gerechtigkeit
  rationale: Bewahrt die Genitivkonstruktion und ihre mögliche Spannung zwischen Gottes Wesen und der von ihm verwirklichten Gerechtigkeit.
- source_word: τοῦ ἡσυχάσαι
  choice: der … Ruhe … schenken wird
  rationale: Gibt den finalen bzw. erläuternden Infinitiv in flüssigem Deutsch wieder, ohne seine Beziehung zum Kommen inhaltlich zu überbestimmen.
- source_word: κράτος τῆς βασιλείας μου
  choice: die Macht meines Königtums
  rationale: κράτος bezeichnet Macht oder Stärke; βασιλεία ist hier als fortbestehende Königsherrschaft bzw. Dynastie zu verstehen.
- source_word: σπέρματός μου
  choice: meiner Nachkommenschaft
  rationale: Entspricht dem genealogischen Sinn von ‚Same‘ in natürlichem modernem Deutsch.
- source_word: ἕως αἰῶνος
  choice: in Ewigkeit / niemals
  rationale: Die zweimalige Wendung wird idiomatisch variiert; beide Wiedergaben drücken die unbegrenzte Dauer des griechischen Ausdrucks aus.
theological_decisions:
- issue: Bezug von αὐτός
  choice: „er“ bezieht sich auf den zuvor genannten Gott
  alternative: Bezug auf eine anderweitig vorausgesetzte messianische Gestalt
  rationale: Im vorgelegten griechischen Text ist „Gott“ das nächstliegende ausdrückliche Bezugswort; die Übersetzung belässt das Pronomen dennoch ohne erklärenden Zusatz.
- issue: Reich bzw. Königtum und Nachkommenschaft
  choice: „Königtum aus meiner Nachkommenschaft“
  alternative: „Reich von meinem Samen“
  rationale: Die gewählte Formulierung bewahrt die dynastische Aussage, ohne eine bestimmte spätere theologische Erfüllungslehre einzutragen.
- issue: Umfang des zu übersetzenden Textes
  choice: Nur den im griechischen Ausgangstext belegten Inhalt wiedergeben
  alternative: Die zusätzlichen Sätze der englischen Konsultationsfassung über Unzucht, Zauberei und Dämonen aufnehmen
  rationale: Diese zusätzlichen Sätze stehen nicht im bereitgestellten griechischen Quellenausschnitt und werden deshalb nicht in die quellengestützte Übersetzung importiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfügung wurde behutsam geglättet; zentrale Genitivkonstruktionen und theologische Mehrdeutigkeiten bleiben erhalten.
