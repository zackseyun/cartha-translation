revisions:
- from: Bis zum Kommen des Gottes der Gerechtigkeit, der Jakob und allen Völkern Ruhe in Frieden schenken wird. Und er wird die Macht meines Königtums in Ewigkeit bewahren; denn der Herr hat mir mit einem Eid geschworen, das Königtum aus meiner Nachkommenschaft niemals auszulöschen.
  to: Bis zum Kommen des Gottes der Gerechtigkeit, um Jakob und allen Völkern in Frieden Ruhe zu geben. Und er wird die Macht meines Königtums in Ewigkeit bewahren; denn der Herr hat mir bei einem Eid geschworen, das Königtum meiner Nachkommenschaft nicht in Ewigkeit auszulöschen.
  rationale: Die Revision glättet allein die deutsche Idiomatik und bewahrt genauer die im Griechischen wiederholte Dauerformel ἕως αἰῶνος. Die Zweckbeziehung des articularen Infinitivs τοῦ ἡσυχάσαι wird mit „um ... Ruhe zu geben“ transparent wiedergegeben. Es werden weder die nicht im griechischen Auszug stehenden englischen Zusatzsätze übernommen noch theologische Identifikationen ergänzt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:16:00Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt den vorgelegten griechischen Text insgesamt zuverlässig wieder und nimmt die in der englischen Audit-Fassung zusätzlich enthaltenen, im griechischen Auszug nicht belegten Sätze zu Recht nicht auf. Die finale Infinitivkonstruktion wird jedoch klarer und näher am Griechischen als Zweckangabe wiedergegeben. Die zweite Zeitformel ἕως αἰῶνος sollte nicht durch „niemals“ nivelliert werden, da die Wiederholung im Ausgangstext bedeutungstragend ist.
  naturalness: „Ruhe in Frieden schenken“ ist im heutigen Deutsch wegen der festen Grabinschrift-Assoziation von „Ruhe in Frieden“ weniger natürlich. „in Frieden Ruhe zu geben“ ist idiomatischer. Auch „das Königtum aus meiner Nachkommenschaft auszulöschen“ ist syntaktisch und semantisch unglücklich; eine Genitivverbindung mit „Nachkommenschaft“ macht die dynastische Aussage verständlich.
  terminology: „Kommen“, „der Gott der Gerechtigkeit“, „Macht meines Königtums“, „Herr“ und „Nachkommenschaft“ sind angemessen. Die wiederholte Dauerformel wird einheitlich mit „in Ewigkeit“ wiedergegeben, ohne zusätzliche eschatologische oder konfessionelle Festlegung.
  issues:
  - severity: low
    issue: Unidiomatische Wiedergabe von ἐν εἰρήνῃ
    rationale: „Ruhe in Frieden schenken“ klingt im modernen Deutschen leicht wie eine Totenformel. Die Stellung „in Frieden Ruhe zu geben“ bewahrt beide Begriffe und ist natürlicher.
  - severity: medium
    issue: Die Wiederholung von ἕως αἰῶνος wird im letzten Satz durch „niemals“ abgeschwächt bzw. verdeckt
    rationale: Das Griechische verwendet an beiden Stellen dieselbe Zeitformel. Eine einheitliche Wiedergabe mit „in Ewigkeit“ erhält die formale und semantische Wiederholung.
  - severity: medium
    issue: „das Königtum aus meiner Nachkommenschaft auszulöschen“ ist im Deutschen missverständlich
    rationale: ἐκ τοῦ σπέρματός μου bezeichnet hier die Abstammungslinie, aus der das Königtum nicht getilgt werden soll. „das Königtum meiner Nachkommenschaft ... auszulöschen“ ist verständlicher, ohne eine bestimmte Deutung der Dynastie einzutragen.
  revised_text: Bis zum Kommen des Gottes der Gerechtigkeit, um Jakob und allen Völkern in Frieden Ruhe zu geben. Und er wird die Macht meines Königtums in Ewigkeit bewahren; denn der Herr hat mir bei einem Eid geschworen, das Königtum meiner Nachkommenschaft nicht in Ewigkeit auszulöschen.
  revised_footnotes: []
  revision_rationale: Die Revision glättet allein die deutsche Idiomatik und bewahrt genauer die im Griechischen wiederholte Dauerformel ἕως αἰῶνος. Die Zweckbeziehung des articularen Infinitivs τοῦ ἡσυχάσαι wird mit „um ... Ruhe zu geben“ transparent wiedergegeben. Es werden weder die nicht im griechischen Auszug stehenden englischen Zusatzsätze übernommen noch theologische Identifikationen ergänzt.
