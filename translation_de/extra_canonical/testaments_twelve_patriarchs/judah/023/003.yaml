base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/023/003.yaml
  text: Because of these things the Lord will bring upon you famine and pestilence, death and the avenging sword, siege, and the reproaches of enemies and friends. By foreigners my kingdom will be brought to an end.
translation:
  language: de
  text: Dafür wird der Herr über euch Hunger und Seuche bringen, Tod und das rächende Schwert, Belagerung und Hunde, die euch zerreißen, dazu Schmähungen durch Feinde, Vernichtung durch Feinde[a], das Absterben der Augen[b], die Tötung von Säuglingen, die Plünderung eures Besitzes, das Niederbrennen der Tempel Gottes, die Verwüstung des Landes und eure eigene Versklavung unter den Völkern.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich ist auch möglich: „Vernichtung der Feinde“. Der griechische Genitiv lässt offen, ob die Feinde die Vernichtung herbeiführen oder selbst vernichtet werden.'
    reason: Bewahrt die grammatische Ambiguität von ἀπώλειαν ἐχθρῶν.
  - marker: b
    text: Das griechische Wort bezeichnet ein Absterben des Gewebes, etwa Gangrän; gemeint ist hier ein schweres Verderben der Augen.
    reason: Erläutert den seltenen medizinisch-konkreten Ausdruck σφακελισμός, ohne ihn vorschnell auf bloße Blindheit festzulegen.
lexical_decisions:
- source_word: Ἀνθ᾽ ὧν
  choice: Dafür
  rationale: 'Gibt die rückbezügliche Begründungs- bzw. Vergeltungsformel knapp und natürlich wieder: als Folge der zuvor genannten Dinge.'
- source_word: λιμὸν καὶ λοιμόν
  choice: Hunger und Seuche
  rationale: Bewahrt das traditionelle Begriffspaar, verwendet aber heutiges, verständliches Deutsch.
- source_word: ῥομφαίαν, ἐκδικοῦσαν
  choice: das rächende Schwert
  rationale: Das Partizip ist feminin und bezieht sich grammatisch auf ῥομφαίαν; die personifizierende Wirkung bleibt erhalten.
- source_word: κύνας εἰς διασπασμόν
  choice: Hunde, die euch zerreißen
  rationale: Gibt das Ziel bzw. die Folge des griechischen Ausdrucks idiomatisch wieder, ohne das drastische Bild abzuschwächen.
- source_word: σφακελισμὸν ὀφθαλμῶν
  choice: das Absterben der Augen
  rationale: σφακελισμός bezeichnet nekrotisches Absterben bzw. Gangrän; die Formulierung bleibt anschaulich und vermeidet eine unbelegte Diagnose.
- source_word: νηπίων ἀναιρέσεις
  choice: die Tötung von Säuglingen
  rationale: ἀναίρεσις bezeichnet hier gewaltsames Töten; νήπια sind kleine Kinder bzw. Säuglinge.
- source_word: ὑπαρχόντων ἁρπαγὴν
  choice: die Plünderung eures Besitzes
  rationale: τὰ ὑπάρχοντα bezeichnet Habe oder Besitz; ἁρπαγή die gewaltsame Wegnahme.
- source_word: ὑμῶν δὲ αὐτῶν δουλείαν ἐν ἔθνεσι
  choice: eure eigene Versklavung unter den Völkern
  rationale: Betont wie das Griechische, dass die Angeredeten selbst betroffen sein werden; ἐν ἔθνεσι wird räumlich-sozial als „unter den Völkern“ wiedergegeben.
theological_decisions:
- issue: Göttliches Gericht und menschliche bzw. geschichtliche Mittel
  choice: Der Herr „bringt“ die gesamte Reihe von Katastrophen über die Angeredeten.
  alternative: Die Ereignisse lediglich als vom Herrn zugelassene Folgen formulieren.
  rationale: Das aktive ἐπάξει schreibt dem Herrn ausdrücklich die Herbeiführung zu. Diese theologische Spannung darf nicht zu bloßer Zulassung abgeschwächt werden.
- issue: ναῶν θεοῦ im Plural
  choice: „Tempel Gottes“ im Plural
  alternative: „Gotteshäuser“ oder singularisch „der Tempel Gottes“
  rationale: Der überlieferte griechische Text hat den Plural ναῶν. Eine Harmonisierung auf den Jerusalemer Tempel im Singular wäre textlich nicht gerechtfertigt.
- issue: ἀπώλειαν ἐχθρῶν
  choice: „Vernichtung durch Feinde“ mit Fußnote zur grammatischen Mehrdeutigkeit
  alternative: „Vernichtung der Feinde“
  rationale: Der Genitiv ἐχθρῶν kann subjektiv oder objektiv verstanden werden. Im Zusammenhang der gegen die Angeredeten gerichteten Gerichte liegt der subjektive Sinn nahe, doch die echte Mehrdeutigkeit wird ausgewiesen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit dem aufzählenden, prophetischen Gerichtston des griechischen Textes. Die drastischen Einzelbilder werden nicht geglättet. Der Entwurf folgt dem angegebenen griechischen Quelltext, der erheblich mehr Glieder enthält als die englische Konsultationsfassung.
