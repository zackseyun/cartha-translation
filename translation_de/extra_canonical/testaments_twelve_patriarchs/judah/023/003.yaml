  source_fidelity: Der deutsche Text bildet die vollständige in der vorgelegten griechischen Edition enthaltene Strafliste getreu ab, einschließlich der Glieder, die in der englischen POB-Konsultationsfassung fehlen. „das rächende Schwert“, „Hunde, die euch zerreißen“, die Pluralform „Tempel Gottes“ und „eure eigene Versklavung unter den Völkern“ geben Syntax, Bildlichkeit und Nachdruck des Griechischen angemessen wieder. Die leichte Konkretisierung des bei „Zerreißen“ mitgemeinten Zieles durch „euch“ ist im Rahmen der gegen „euch“ gerichteten Unheilsankündigung vertretbar.
  naturalness: Die Übersetzung ist modernes, verständliches Standarddeutsch und bewahrt den feierlich-prophetischen Charakter der Reihung. Die teilweise harte Ausdrucksweise ist durch den Ausgangstext geboten. „Absterben der Augen“ ist ungewöhnlich, aber verständlich und wird durch die Anmerkung sachgerecht erläutert.
