- from: Und ich wusste, dass das Geschlecht der Kanaaniter böse war; doch der jugendliche Leichtsinn verblendete meinen Verstand.
  to: Und ich wusste, dass das Geschlecht der Kanaaniter böse war; doch der Entschluss meiner Jugend verblendete meinen Verstand.
  rationale: „Entschluss meiner Jugend“ gibt διαβούλιον als Ergebnis eines Beratens bzw. Überlegens wieder und lässt die genaue Nuance offen. Dadurch steht die deutsche Fassung näher am griechischen Ausgangstext als „jugendlicher Leichtsinn“, bleibt aber natürlich und bewahrt den Gegensatz der Aussage.
