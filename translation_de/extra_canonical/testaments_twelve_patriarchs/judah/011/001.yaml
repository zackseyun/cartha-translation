id: T12P.JUD.11.1
reference: Testament of Judah 11:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Κἀγὼ ᾔδειν ὅτι πονηρὸν² γένος ἦν³ τῶν Χαναναίων⁴, ἀλλὰ τὸ διαβούλιον⁵ τῆς νεότητος ἐτύφλωσε τὴν διάνοιάν μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/011/001.yaml
  text: And I knew that the race of the Canaanites was evil, but the impulse of youth blinded my understanding.
translation:
  language: de
  text: Und ich wusste, dass das Geschlecht der Kanaaniter böse war; doch der Entschluss meiner Jugend verblendete meinen Verstand.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γένος
  choice: Geschlecht
  rationale: Gibt die kollektive Bedeutung von γένος hier würdig und relativ nah am griechischen Wortlaut wieder, ohne den modernen biologisierenden Beiklang von „Rasse“.
- source_word: πονηρόν
  choice: böse
  rationale: Entspricht der moralischen Wertung des griechischen Adjektivs, ohne sie abzuschwächen.
- source_word: τὸ διαβούλιον τῆς νεότητος
  choice: der jugendliche Leichtsinn
  rationale: διαβούλιον bezeichnet hier das durch die Jugend geprägte innere Trachten bzw. die impulsive Überlegung; „jugendlicher Leichtsinn“ vermittelt die im Zusammenhang negative, vernunfttrübende Kraft natürlich im Deutschen.
- source_word: ἐτύφλωσε τὴν διάνοιάν μου
  choice: verblendete meinen Verstand
  rationale: Bewahrt die Blindheitsmetapher von ἐτύφλωσε und gibt διάνοια als Denk- und Urteilsvermögen wieder.
theological_decisions:
- issue: Pauschale moralische Aussage über die Kanaaniter
  choice: Die Aussage des Erzählers wird ohne Abschwächung als „das Geschlecht der Kanaaniter böse war“ wiedergegeben.
  alternative: „unter den Kanaanitern Böses herrschte“
  rationale: Der griechische Text prädiziert πονηρόν unmittelbar von γένος; eine Umformulierung würde die Aussage interpretierend abschwächen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Geschlecht“ vermeidet das heute problematische „Rasse“. Der Semikolon bildet den scharfen Gegensatz mit ἀλλά ab; „doch“ klingt im Deutschen natürlich und gehoben, ohne altertümlich zu wirken.
