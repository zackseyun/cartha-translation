  source_fidelity: Die Übersetzung gibt den temporalen Sinn des Partizips Ἐπιγνούς („als ich ... erfuhr/erkannte“), das Objekt „was sie getan hatte“, das ausdrücklich gesetzte Subjekt ἐγώ, κατηρασάμην („verfluchte ich“) und ἐν ὀδύνῃ ψυχῆς μου („in der Qual meiner Seele“) vollständig und ohne sachliche Einengung wieder.
