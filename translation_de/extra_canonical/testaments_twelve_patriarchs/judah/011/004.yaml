lexical_decisions:
- source_word: Ἐπιγνοὺς
  choice: als ich … erfuhr
  rationale: Das Partizip bezeichnet hier das Erkennen beziehungsweise Bekanntwerden dessen, was sie getan hatte; die temporale Wiedergabe ist im Deutschen natürlich.
- source_word: κατηρασάμην
  choice: verfluchte ich
  rationale: Gibt das starke Verb für das Aussprechen eines Fluches unmittelbar und ohne Abschwächung wieder.
- source_word: ἐν ὀδύνῃ ψυχῆς μου
  choice: in der Qual meiner Seele
  rationale: Bewahrt die bildhafte, intensive Formulierung und den Bezug auf die Seele.
