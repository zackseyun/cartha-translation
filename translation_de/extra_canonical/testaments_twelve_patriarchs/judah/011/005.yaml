  text: And indeed she died in her wickedness, with her children.
translation:
  language: de
  text: Und tatsächlich starb sie in ihrer Bosheit zusammen mit ihren Söhnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: Und tatsächlich
  rationale: Gibt die verstärkende und bestätigende Wirkung der Partikelverbindung natürlich im Deutschen wieder.
- source_word: ἐν τῇ πονηρίᾳ αὐτῆς
  choice: in ihrer Bosheit
  rationale: Bewahrt die bildhafte beziehungsweise zustandsbezogene Präposition und übersetzt πονηρία als moralische Bosheit, ohne die Beziehung zwischen ihrem Tod und ihrer Bosheit näher festzulegen.
- source_word: μετὰ τῶν υἱῶν αὐτῆς
  choice: zusammen mit ihren Söhnen
  rationale: υἱοί bezeichnet ausdrücklich Söhne; „zusammen mit“ macht die begleitende Bedeutung von μετά idiomatisch deutlich.
theological_decisions:
- issue: Bedeutung von „in ihrer Bosheit“
  choice: Die offene Formulierung „in ihrer Bosheit“ wird beibehalten.
  alternative: „wegen ihrer Bosheit“ oder „als sie noch in ihrer Bosheit lebte“
  rationale: Der griechische Wortlaut bezeichnet mit ἐν einen Zustand oder Zusammenhang, nennt aber nicht ausdrücklich eine Ursache oder einen zeitlichen Gegensatz; diese Spannung soll nicht aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; knapp und eng am griechischen Satzbau, zugleich idiomatisch formuliert.
