base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/011/002.yaml
  text: And when I saw her pouring wine, I was deceived, and I took her, my father not having taken counsel.
translation:
  language: de
  text: Als ich sie Wein einschenken sah, wurde ich getäuscht und nahm sie zur Frau, ohne dass mein Vater Rat eingeholt hatte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ohne dass mein Vater sich beraten“ oder „einen Entschluss gefasst“ hatte. Das griechische Verb kann sowohl das Einholen von Rat als auch Beraten oder Überlegen bezeichnen. In der Edition ist außerdem das vorangehende „nahm“ (griechisch ἔλαβον) textkritisch gekennzeichnet.'
    reason: Bewahrt die Bedeutungsbreite von μὴ βουλευσαμένου τοῦ πατρός μου und lokalisiert die textkritische Kennzeichnung korrekt.
lexical_decisions:
- source_word: οἰνοχοοῦσαν
  choice: Wein einschenken
  rationale: 'Gibt das Partizip natürlich und konkret wieder: Sie war als Weinschenkin tätig beziehungsweise schenkte Wein ein.'
- source_word: ἠπατήθην
  choice: ließ ich mich täuschen
  rationale: Bewahrt die passive Bedeutung von ἀπατάω und klingt im Deutschen natürlicher als „wurde ich getäuscht“, ohne ausdrücklich festzulegen, wer oder was die Täuschung bewirkte.
- source_word: ἔλαβον αὐτήν
  choice: nahm sie zur Frau
  rationale: Im Zusammenhang bezeichnet „nehmen“ die Eheschließung. Die Ergänzung „zur Frau“ macht den gemeinten Sinn im modernen Deutsch verständlich.
- source_word: μὴ βουλευσαμένου τοῦ πατρός μου
  choice: ohne dass mein Vater zu Rate gezogen worden war
  rationale: Die Genitivus-absolute-Konstruktion wird als fehlende Beteiligung des Vaters an der Beratung wiedergegeben. Wegen der textlichen und syntaktischen Unsicherheit wird die mögliche Alternative in einer Fußnote genannt.
theological_decisions:
- issue: Beteiligung des Vaters an der Eheschließung
  choice: Der Vater wurde nicht zu Rate gezogen.
  alternative: Mein Vater hatte keinen Rat gefasst bzw. keinen Entschluss gefasst.
  rationale: Das Medium βουλεύομαι kann sowohl „beraten/zu Rate ziehen“ als auch „überlegen, einen Entschluss fassen“ ausdrücken. Der Kontext legt eine ohne väterlichen Rat geschlossene Ehe nahe, doch die alternative Deutung bleibt möglich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Wein einschenken“ ist idiomatisch; „nahm sie zur Frau“ macht den ehelichen Sinn klar. Die passive Formulierung bei der Beratung vermeidet eine ungesicherte Ergänzung wie „darüber“.
