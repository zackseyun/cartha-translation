  text: Αὐτὴ δὲ¹¹ ἀπόντος ἐμοῦ¹² ἐπορεύθη καὶ ἔλαβε τῷ¹³ Σηλὼμ¹⁴ γυναῖκα ἐκ¹⁵ τῆς Χαναάν¹⁶.
