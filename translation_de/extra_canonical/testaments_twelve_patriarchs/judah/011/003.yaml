base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/011/003.yaml
  text: But while I was away, she went and took for Shelah a wife from Canaan.
translation:
  language: de
  text: Während ich aber fort war, ging sie hin und nahm für Schela eine Frau aus Kanaan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόντος ἐμοῦ
  choice: während ich fort war
  rationale: Gibt den Genitivus absolutus natürlich und zeitlich wieder, ohne über die Art oder Dauer der Abwesenheit hinauszugehen.
- source_word: ἐπορεύθη καὶ ἔλαβε
  choice: ging sie hin und nahm
  rationale: Bewahrt die beiden aufeinanderfolgenden Handlungen des griechischen Textes in flüssigem Deutsch.
- source_word: τῷ Σηλὼμ
  choice: für Schela
  rationale: Der Dativ bezeichnet hier die Person, für die die Frau genommen wurde; die Namensform folgt der im Deutschen gebräuchlichen biblischen Form Schela.
- source_word: γυναῖκα ἐκ τῆς Χαναάν
  choice: eine Frau aus Kanaan
  rationale: Entspricht der offenen Bedeutung von γυνή als Frau beziehungsweise Ehefrau; im Kontext bezeichnet sie die für Schela bestimmte Ehefrau, ohne dass dies im Deutschen zusätzlich erläutert werden muss.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Griechischen, klingt jedoch natürlich; es sind keine Fußnoten erforderlich.
