  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/001.yaml
  text: 'The Testament of Judah[a], the fourth son of Jacob and Leah.


    A copy of the words of Judah, which he spoke to his sons before he died.


    2 So they gathered and came to him, and he said to them:


    3 “Hear, my children, Judah your father. I was born the fourth son to my father Jacob, and Leah my mother named me Judah, saying, ‘I give praise to the Lord, because he has given me also a fourth son.’ 4 I was keen in my youth, and I obeyed my father in every matter. 5 And I honored my mother and my mother''s sister. 6 And when I had grown up, my father blessed me, saying, ‘You shall be a king[b], prospering in all things.’”'
translation:
  language: de
  text: 'Das Testament Judas, des vierten Sohnes Jakobs und Leas.



    1 Abschrift der Worte Judas, die er vor seinem Tod zu seinen Söhnen sprach.



    2 Sie versammelten sich nun und kamen zu ihm. Da sagte er zu ihnen:



    3 »Hört mich an, meine Kinder, Juda, euren Vater! Ich wurde als vierter Sohn meines Vaters Jakob geboren. Meine Mutter Lea gab mir den Namen Juda und sagte: ›Ich preise den Herrn, denn er hat mir auch einen vierten Sohn gegeben.‹ 4 In meiner Jugend war ich tatkräftig[a] und gehorchte meinem Vater in allem. 5 Ich ehrte meine Mutter und die Schwester meiner Mutter. 6 Als ich erwachsen geworden war, betete mein Vater für mich und sagte: ›Du wirst ein König sein und in allem Erfolg haben[b].‹«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch »schnell«, »scharf« oder »eifrig« bedeuten.
    reason: lexical_alternative
  - marker: b
    text: Das griechische Wort kann auch bedeuten, dass jemand erfolgreich geführt wird oder dass sein Weg zum Erfolg gebracht wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: Διαθήκη
  choice: Testament
  rationale: Im Titel dieser Abschiedsrede bezeichnet das Wort ein literarisches Testament, nicht einen Bund.
- source_word: Ἀντίγραφον
  choice: Abschrift
  rationale: Gibt die dokumentarische Rahmung als schriftliche Wiedergabe der Worte Judas knapp und natürlich wieder.
- source_word: Ἀκούσατε
  choice: Hört
  rationale: Bewahrt den feierlichen Imperativ; die Ergänzung »auf Juda« ergibt im Deutschen eine natürliche Aufforderung.
- source_word: ἐγὼ τέταρτος υἱὸς ἐγενόμην
  choice: Ich wurde ... als vierter Sohn geboren
  rationale: Drückt die Geburtsfolge idiomatisch aus, ohne das griechische ἐγενόμην mechanisch mit »wurde« im Sinn einer späteren Veränderung wiederzugeben.
- source_word: Ἀνθομολογοῦμαι
  choice: Ich preise
  rationale: Erfasst den dankbaren Lobpreis in Leas Namensdeutung klar und würdig.
- source_word: ὀξὺς
  choice: tatkräftig
  rationale: Das breite Adjektiv kann Schärfe, Schnelligkeit oder Energie bezeichnen; »tatkräftig« passt zum positiven jugendlichen Selbstbild, ohne es auf Intellekt zu verengen.
- source_word: κατὰ πάντα λόγον
  choice: in allem
  rationale: Im Zusammenhang des Gehorsams bezeichnet λόγος das jeweils Gesagte, Gebotene oder Verlangte; »in allem« ist im Deutschen natürlicher als »in jedem Wort«.
- source_word: ηὔξατό μοι
  choice: segnete mich
  rationale: Im patriarchalischen Kontext führt das Gebet über Juda eine verheißende Segensrede ein; die funktionale Wiedergabe »segnete« bildet diesen Zusammenhang idiomatisch ab.
- source_word: κατευοδούμενος
  choice: Erfolg haben
  rationale: Gibt den Gedanken erfolgreichen Fortkommens verständlich wieder, während die Fußnote die bildhafte und passivische Bedeutungsbreite wahrt.
theological_decisions:
- issue: Wiedergabe des göttlichen Titels Κυρίῳ
  choice: dem Herrn
  alternative: dem Herrscher / Herrn ohne Artikel
  rationale: In Leas Lobformel ist κύριος als Bezeichnung für Israels Gott gebraucht; »der Herr« ist die angemessene deutsche Titelform.
- issue: Art der väterlichen Handlung in Vers 6
  choice: segnete mich
  alternative: betete für mich
  rationale: Die griechische Form bezeichnet wörtlich ein Gebet für Juda; die unmittelbar folgende königliche Zusage hat jedoch die Funktion eines patriarchalischen Segens. Die Übersetzung gibt diese Funktion wieder, ohne eine bestimmte konfessionelle Lehre einzutragen.
- issue: Königsaussage in Vers 6
  choice: Du wirst ein König sein
  alternative: Du wirst König sein
  rationale: Der unbestimmte Ausdruck bewahrt die Form des griechischen Prädikats und lässt Reichweite und Erfüllung der Aussage offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit feierlichem Ton der Abschiedsrede. Verwandtschaftsbezeichnungen werden ausdrücklich bewahrt; syntaktische Härten des griechischen Textes werden behutsam idiomatisiert. Sämtliche Fußnotenmarker stehen im Haupttext.
