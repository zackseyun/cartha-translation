base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/017.yaml
  text: 'And now I command you, my children: do not love silver, and do not set your gaze on the beauty of women; for I too, because of gold and beauty, was led astray to Besue the Canaanite woman.


    And I know that because of these two things my seed will come to the ruin of sexual immorality. For they will even corrupt wise men from among my sons, and they will cause the kingdom of Judah to be diminished, which the Lord gave me because of my obedience to my father Jacob.'
translation:
  language: de
  text: '17


    1 Und nun gebiete ich euch, meine Kinder: Liebt das Silber nicht und richtet euren Blick nicht auf die Schönheit der Frauen. Denn auch ich ließ mich durch Gold und Schönheit zu Besue, der Kanaaniterin, verleiten.


    2 Ich weiß, dass meine Nachkommen durch diese beiden Dinge ins Verderben der Unzucht geraten werden. Sie werden sogar weise Männer unter meinen Nachkommen verderben und das Königtum Judas schwinden lassen, das der Herr mir wegen meines Gehorsams gegenüber meinem Vater gegeben hat.


    3 Ich habe meinem Vater Jakob niemals widersprochen, sondern tat alles, was er mir sagte.


    4 Auch Abraham, mein Urgroßvater, segnete mich dazu, in Israel zu herrschen, und ebenso segnete mich Jakob.


    5 Und ich weiß, dass aus mir das Königtum hervorgehen wird.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀργύριον
  choice: Silber
  rationale: Die konkrete Bedeutung des griechischen Wortes wird beibehalten; zugleich kann „Silber“ wie im Ausgangstext für Reichtum stehen.
- source_word: ἐπιβλέπει εἰς κάλλος γυναικῶν
  choice: richtet euren Blick nicht auf die Schönheit der Frauen
  rationale: Gibt die Blickrichtung und das begehrliche Fixieren verständlich wieder, ohne mehr als der griechische Text ausdrücklich sagt einzutragen.
- source_word: ἐπλανήθην εἰς Βησουὲ
  choice: ließ mich … zu Besuë … verführen
  rationale: Bewahrt das passive Moment des Irregeführtwerdens und die ungewöhnliche Richtungsangabe εἰς, formuliert sie aber in natürlichem Deutsch.
- source_word: τὸ γένος μου
  choice: meine Nachkommen
  rationale: Im Zusammenhang ist die Abstammungslinie Judas gemeint; „Nachkommen“ ist im Deutschen klarer und natürlicher als „mein Geschlecht“ oder „mein Same“.
- source_word: εἰς ἀπώλειαν πορνείας
  choice: ins Verderben der Unzucht geraten
  rationale: Bewahrt die dichte, mehrdeutige Genitivverbindung zwischen Verderben und Unzucht, statt eindeutig festzulegen, ob Unzucht Ursache oder Art des Verderbens ist.
- source_word: ἀλλοιώσουσι
  choice: verderben
  rationale: Das Verb bedeutet grundlegend „verändern“; im klar negativen Zusammenhang bezeichnet es eine sittliche Entstellung, die „verderben“ idiomatisch wiedergibt.
- source_word: βασιλείαν Ἰούδα
  choice: das Königtum Judas
  rationale: „Königtum“ erfasst hier eher die Herrschaft beziehungsweise königliche Stellung aus Juda als ein räumlich definiertes Königreich.
- source_word: παρελάλησα
  choice: widersprochen
  rationale: Das seltene Verb bezeichnet ein Gegenreden beziehungsweise Zuwiderreden; der Folgesatz über vollständiges Tun stützt diese Wiedergabe.
- source_word: στήσεται τὸ βασίλειον
  choice: das Königtum erstehen wird
  rationale: „Erstehen“ lässt sowohl das Aufkommen als auch das feste Bestehen der Herrschaft anklingen und bewahrt damit die Spannweite von στήσεται.
theological_decisions:
- issue: Grund für die Verleihung des Königtums
  choice: „wegen meines Gehorsams gegenüber meinem Vater“
  alternative: „im Gehorsam gegenüber meinem Vater“
  rationale: ἐν ὑπακοῇ kann Umstand oder Grundlage bezeichnen. „Wegen“ folgt dem Zusammenhang, in dem Judas seinen Gehorsam als Grund der Gabe nennt, ohne eine weitergehende Heilslehre einzutragen.
- issue: Fortbestand beziehungsweise Entstehung des Königtums aus Juda
  choice: „aus mir das Königtum erstehen wird“
  alternative: „aus mir wird das Königtum Bestand haben“
  rationale: Die futurische Aussage wird nicht auf eine bestimmte historische oder messianische Erfüllung festgelegt; die im Griechischen offene Aussage bleibt offen.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil mit direkter väterlicher Mahnrede. Die Verse 3–5 wurden entsprechend dem vollständigen griechischen Quelltext aufgenommen, obwohl die englische Konsultationsschicht nur die Verse 1–2 enthält. Der Gottesname Κύριος wird kontextgemäß mit „der Herr“ wiedergegeben.
