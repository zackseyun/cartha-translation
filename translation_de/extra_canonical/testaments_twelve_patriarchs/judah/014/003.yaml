source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Τοιοῦτός²³ ἐστιν ὁ πάροινος²⁴, τέκνα μου, ὅτι ὁ μεθύων²⁵ οὐκ αἰδεῖται οὐδένα²⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/003.yaml
  text: Such is the wine-drinker, my children, because the drunkard respects no one.
translation:
  language: de
  text: So ist der Trinker, meine Kinder; denn wer betrunken ist, hat vor niemandem Achtung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάροινος
  choice: Trinker
  rationale: Bezeichnet hier einen dem Wein bzw. Trinken ergebenen Menschen; „Trinker“ ist natürliches modernes Deutsch und wahrt den Bezug zum vorausgehenden Vergleich.
- source_word: ὁ μεθύων
  choice: wer betrunken ist
  rationale: Das substantivierte Präsenspartizip bezeichnet den Menschen im Zustand des Betrunkenseins. Die Formulierung gibt den Verlauf bzw. Zustand wieder, ohne stärker als der griechische Text eine dauerhafte Eigenschaft („Säufer“) festzulegen.
- source_word: οὐκ αἰδεῖται οὐδένα
  choice: hat vor niemandem Achtung
  rationale: αἰδέομαι umfasst Scheu, Rücksicht und ehrerbietige Achtung. Diese Wendung ist idiomatisch und bewahrt mehr von diesem Bedeutungsfeld als bloßes „respektiert niemanden“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede „meine Kinder“ und die sentenzartige Begründung bleiben erhalten; das Semikolon macht den engen Folgerungszusammenhang klar.
