  text: ὅτι καίγε τὰ δύο ταῦτα¹⁴ ἀφιστῶσι τὴν διάνοιαν¹⁵ τοῦ ἀνθρώπου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/001.yaml
  text: These two things turn a man's mind away.
translation:
  language: de
  text: Denn gerade diese beiden Dinge lenken den Verstand des Menschen ab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καίγε
  choice: gerade
  rationale: Die verstärkende Partikel hebt die beiden genannten Dinge hervor; „gerade“ gibt diese Betonung im natürlichen Deutschen wieder.
- source_word: τὰ δύο ταῦτα
  choice: diese beiden Dinge
  rationale: Entspricht der demonstrativen Wendung und verweist auf die zwei zuvor genannten Sachverhalte.
- source_word: ἀφιστῶσι
  choice: bringen … vom rechten Weg ab
  rationale: Das Verb bezeichnet ein Entfernen oder Abbringen. Die deutsche Wendung bewahrt die gerichtete Abkehr, ohne ein ausdrückliches Ziel oder Objekt zu ergänzen.
- source_word: τὴν διάνοιαν τοῦ ἀνθρώπου
  choice: den Verstand des Menschen
  rationale: διάνοια bezeichnet hier das Denk- und Urteilsvermögen; „des Menschen“ gibt den generischen Singular einschließlich aller Menschen würdig und quellennah wieder.
theological_decisions:
- issue: Unausgesprochenes Ziel der Abkehr
  choice: vom rechten Weg ab
  alternative: bringen den Verstand des Menschen ab
  rationale: Der griechische Text nennt nicht ausdrücklich, wovon der Verstand entfernt wird. „Vom rechten Weg“ macht die im Verb liegende negative Richtung idiomatisch verständlich, ohne eine konkrete theologische Bezugsgröße wie Gott oder das Gesetz einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Kausalsatz wird mit „Denn“ an den vorherigen Zusammenhang angeschlossen; der generische Ausdruck bleibt als „des Menschen“ erhalten.
