source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Ἐὰν δὲ παρέλθῃ⁴⁶ τὸν ὅρον, ἐμβάλλει⁴⁸ εἰς⁴⁹ τὸν νοῦν αὐτοῦ⁵⁰ τὸ πνεῦμα τῆς πλάνης, καὶ ποιεῖ τὸν μέθυσον αἰσχρορρημονεῖν⁵¹ καὶ παρανομεῖν καὶ μὴ αἰσχύνεσθαι ἀλλὰ καυχᾶσθαι⁵³ τῇ ἀτιμίᾳ⁵⁴ καὶ νομίζειν εἶναι καλόν⁵⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/007.yaml
  text: But if he goes on until he passes the limit, a spirit of deception enters into his mind and makes the drunkard speak shamefully and act lawlessly and not feel shame, but rather boast in his dishonor and think it good.
translation:
  language: de
  text: Wenn er aber die Grenze überschreitet, legt der Geist der Verirrung ihm etwas in den Sinn und lässt den Betrunkenen schändlich reden, das Gesetz übertreten und sich nicht schämen, sondern sich seiner Schande rühmen und sie für etwas Gutes halten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρέλθῃ τὸν ὅρον
  choice: die Grenze überschreitet
  rationale: Gibt die feste griechische Wendung unmittelbar und idiomatisch wieder, ohne den im Englischen ergänzten Gedanken eines fortgesetzten Handelns einzutragen.
- source_word: ἐμβάλλει εἰς τὸν νοῦν αὐτοῦ
  choice: bringt dies in seinen Sinn
  rationale: Bewahrt das aktive Bild des Hineinbringens und bezieht das elliptische Objekt sachgerecht auf die anschließend beschriebenen Wirkungen.
- source_word: τὸ πνεῦμα τῆς πλάνης
  choice: der Geist der Verirrung
  rationale: „Verirrung“ erhält die mögliche Spannweite von Irrtum, Täuschung und moralischem Abirren besser als eine einseitige Festlegung auf „Täuschung“.
- source_word: αἰσχρορρημονεῖν
  choice: schändlich reden
  rationale: Deckt die moralisch anstößige Rede ab, ohne sie unnötig auf Obszönität oder Beschimpfung zu verengen.
- source_word: παρανομεῖν
  choice: das Gesetz übertreten
  rationale: Gibt den Bezug von παράνομος/παρανομεῖν auf gesetzeswidriges Handeln deutlicher wieder als das im Deutschen weniger natürliche „gesetzlos handeln“.
- source_word: καυχᾶσθαι τῇ ἀτιμίᾳ
  choice: sich seiner Schande rühmen
  rationale: Bewahrt den Kontrast zwischen fehlender Scham und prahlerischer Umwertung der eigenen Unehre.
- source_word: νομίζειν εἶναι καλόν
  choice: sie für etwas Gutes halten
  rationale: Das Pronomen stellt im Deutschen den naheliegenden Rückbezug auf „Schande“ her; καλόν wird hier moralisch als „etwas Gutes“ wiedergegeben.
theological_decisions:
- issue: Handelndes Subjekt beim Eindringen in den Sinn
  choice: „der Geist der Verirrung“ bleibt das grammatische Subjekt, das etwas in den Sinn bringt
  alternative: „ein Geist der Täuschung dringt in seinen Sinn ein“
  rationale: Der griechische Text sagt ἐμβάλλει („wirft/bringt hinein“), nicht ausdrücklich, dass der Geist selbst eintritt. Die Übersetzung vermeidet daher diese in der englischen Fassung vorgenommene Bedeutungsverschiebung.
- issue: Personale oder unpersönliche Deutung des Geistes
  choice: keine zusätzliche Festlegung
  alternative: ausdrückliche Bezeichnung als Dämon oder bloße innere Haltung
  rationale: πνεῦμα kann hier personal verstanden werden, doch der Vers selbst bestimmt seine ontologische Bedeutung nicht genauer.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die mehrfachen Infinitive des Griechischen werden als koordinierte deutsche Verbgruppen wiedergegeben. Keine Fußnoten erforderlich.
