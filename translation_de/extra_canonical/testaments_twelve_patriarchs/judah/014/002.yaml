review_pass:
  verdict: revise
  source_fidelity: Die Bedingung εἰς μέθην ist mit „bis zur Trunkenheit“ treffend wiedergegeben. Die Fortführung der Verben mit dem Trinkenden als Subjekt ist im Deutschen die naheliegende und semantisch stimmige Lesart der griechischen Singularformen nach τις; die englische Audit-Fassung entscheidet sich dagegen ungewöhnlich für „wine“ als Subjekt. Die deutsche Fassung sollte diese im Griechischen nicht ausdrücklich festgelegte Subjektfrage nicht zusätzlich durch eine Wein-Personifikation erzwingen. Die Verbindung von εἰς πορνείαν und πρὸς ἡδονήν muss jedoch klarer als zwei Ausrichtungen des Erhitzens erscheinen.
  naturalness: 'Der Satz ist insgesamt modernes, würdiges Standarddeutsch. „den Körper zur Lust auf sexuelle Unmoral erhitzt“ ist jedoch syntaktisch und semantisch missverständlich: Es lässt „sexuelle Unmoral“ wie das Objekt der Lust wirken, während der griechische Satz Lust und πορνεία als Zielrichtungen nebeneinanderstellt.'
  terminology: „schmutzige Gedanken“, „Verstand“, „Lust“, „sexuelle Unmoral“ und „die Sünde“ sind angemessene, nicht konfessionell verengende Wiedergaben. Die direkte Anrede in „deinen Verstand“ ist trotz des Wechsels nach „jemand“ beizubehalten, weil σου im vorgelegten griechischen Text steht.
  issues:
  - severity: medium
    issue: Die Wendung „zur Lust auf sexuelle Unmoral“ verschiebt die syntaktische Beziehung von εἰς πορνείαν und πρὸς ἡδονήν.
    rationale: Im Griechischen steht εἰς πορνείαν vor dem Verb und πρὸς ἡδονήν danach; beide bestimmen das Erhitzen des Körpers. „zu Lust und sexueller Unmoral“ gibt diese Parallelität ohne unnötige Auslegung wieder.
  - severity: low
    issue: Die dokumentierte theologische Entscheidung behauptet, „Wein“ sei im deutschen Text das fortwirkende Subjekt.
    rationale: Der tatsächliche deutsche Text verwendet „er“ direkt nach „wenn jemand ... trinkt“ und wird daher regulär auf „jemand“ bezogen. Die Revision hält diese natürliche Lesart bei; eine Personifikation des Weins wäre weder nötig noch durch die deutsche Syntax gedeckt.
  revised_text: Denn wenn jemand Wein bis zur Trunkenheit trinkt, bringt er deinen Verstand durch schmutzige Gedanken in Aufruhr, erhitzt den Körper zu Lust und sexueller Unmoral, begeht die Sünde und schämt sich nicht.
