  to: Denn wenn jemand Wein bis zur Trunkenheit trinkt, bringt er deinen Verstand durch schmutzige Gedanken in Aufruhr, erhitzt den Körper zu Lust und sexueller Unmoral, begeht die Sünde und schämt sich nicht.
  rationale: Die Revision beschränkt sich auf die Wiedergabe der beiden griechischen Präpositionalbestimmungen beim Erhitzen des Körpers. Sie wahrt die Reihenfolge, die scharfe moralische Wertung und die direkte Anrede des Ausgangstextes. Die im Griechischen mögliche Subjektmehrdeutigkeit wird nicht durch eine künstliche Personifikation des Weins festgelegt; die fortlaufende deutsche Lesart mit „jemand/er“ bleibt erhalten.
