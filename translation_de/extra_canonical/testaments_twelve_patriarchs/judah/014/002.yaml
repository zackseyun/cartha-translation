  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/002.yaml
  text: For if you drink wine to drunkenness, it throws your mind into turmoil with filthy thoughts, and heats your body toward pleasure for sexual immorality, and it commits sin and is not ashamed.
translation:
  language: de
  text: Denn wenn jemand Wein bis zur Trunkenheit trinkt, bringt er deinen Verstand durch schmutzige Gedanken in Aufruhr, erhitzt den Körper zu Lust und sexueller Unmoral, begeht die Sünde und schämt sich nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς μέθην
  choice: bis zur Trunkenheit
  rationale: Gibt das Ziel beziehungsweise Ergebnis des Trinkens natürlich und präzise wieder.
- source_word: διαλογισμοῖς ῥυπαροῖς
  choice: durch schmutzige Gedanken
  rationale: Bewahrt die moralische Wertung von ῥυπαρός, ohne sie unnötig auf eine bestimmte Art von Gedanken einzuengen.
- source_word: συνταράσσει τὸν νοῦν
  choice: bringt ... den Verstand ... in Aufruhr
  rationale: Gibt die starke innere Verwirrung von συνταράσσω und νοῦς in verständlichem modernem Deutsch wieder.
- source_word: πορνείαν
  choice: sexuelle Unmoral
  rationale: Der griechische Oberbegriff ist weiter als Ehebruch oder Prostitution und sollte nicht konfessionell oder sachlich verengt werden.
- source_word: ἐκθερμαίνει τὸ σῶμα πρὸς ἡδονήν
  choice: erhitzt den Körper zur Lust
  rationale: Bewahrt die körperliche Bildsprache und die Ausrichtung auf sinnliches Begehren.
- source_word: πράσσει τὴν ἁμαρτίαν
  choice: begeht die Sünde
  rationale: Entspricht der konkreten Formulierung mit bestimmtem Artikel und vermeidet eine Abschwächung zu bloßer Neigung.
theological_decisions:
- issue: Bezug des Subjekts in den aufeinanderfolgenden Verben
  choice: „Wein“ wird als fortwirkendes Subjekt von „bringt“ und „erhitzt“ verstanden; beim Sündigen wird im Deutschen ohne neues Pronomen fortgesetzt.
  alternative: Den Trinkenden als Subjekt aller Verben ausdrücken oder den Körper als Subjekt von „begeht“ auffassen.
  rationale: Das griechische τις ist Subjekt von πίῃ, während die singularischen Verben danach formal mehrdeutig anschließen. Die Übersetzung bewahrt den rhetorischen Verlauf möglichst eng, ohne durch ein zusätzliches Pronomen eine nicht eindeutig markierte Referenz festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Syntax. Die abrupte Mischung aus unpersönlichem „jemand“ und direkter Anrede „deinen“ bleibt erhalten, da sie im Ausgangstext steht. Keine Fußnoten erforderlich.
