  text: After drinking the wine, I was not ashamed of the command of God, and I took a Canaanite woman.
translation:
  language: de
  text: Nachdem ich den Wein getrunken hatte, missachtete ich Gottes Gebot[a] und nahm eine kanaanäische Frau zur Frau.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Ich schämte mich nicht vor Gottes Gebot.“ Die griechische Wendung bezeichnet hier, dass ich dem Gebot nicht mit der gebotenen Scheu oder Achtung begegnete.'
    reason: Die wörtliche Bildlichkeit von αἰσχύνομαι mit „Gebot“ ist im modernen Deutschen nicht idiomatisch; der Haupttext gibt die gemeinte Missachtung klar wieder.
lexical_decisions:
- source_word: Πιὼν τὸν οἶνον
  choice: Nachdem ich den Wein getrunken hatte
  rationale: Das aoristische Partizip bezeichnet hier eine der folgenden Haupthandlung vorausgehende Handlung; der bestimmte Artikel bei οἶνον wird mit „den Wein“ wiedergegeben.
- source_word: οὐκ ᾐσχύνθην τὴν ἐντολὴν τοῦ Θεοῦ
  choice: nahm ich keine Rücksicht auf Gottes Gebot
  rationale: αἰσχύνομαι mit einer Person oder Sache im Akkusativ kann bedeuten, aus Scheu oder Achtung vor ihr zurückzuschrecken. Die deutsche Formulierung gibt im Zusammenhang den fehlenden Respekt vor Gottes Gebot natürlich wieder, ohne den schwer verständlichen Wortlaut „ich schämte mich nicht des Gebots“ zu übernehmen.
- source_word: ἔλαβον γυναῖκα Χαναναίαν
  choice: nahm mir eine kanaanäische Frau
  rationale: λαμβάνω γυναῖκα bezeichnet idiomatisch das Nehmen einer Frau zur Ehe; „nahm mir“ bewahrt die knappe Ausdrucksweise, ohne ausdrücklich mehr als der griechische Text zu sagen.
theological_decisions:
- issue: Verhältnis von Trunkenheit, Gottes Gebot und Eheschließung
  choice: 'Die Aussage bleibt als rückblickendes Eingeständnis stehen: Nach dem Trinken missachtete Juda Gottes Gebot und nahm eine kanaanäische Frau.'
  alternative: „Ich schämte mich nicht vor Gottes Gebot“ beziehungsweise „ich scheute Gottes Gebot nicht“.
  rationale: Die Alternative bildet die griechische Form enger ab, ist im modernen Deutschen jedoch semantisch dunkel oder missverständlich. „Keine Rücksicht nehmen“ wahrt den Vorwurf mangelnder Scheu und Achtung, ohne ein bestimmtes Gesetz oder eine weitergehende theologische Deutung einzuführen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Satzfolge bleibt knapp und nah am griechischen Ausgangstext; „kanaanäisch“ wird kleingeschrieben, wie es für deutsche Adjektive üblich ist.
