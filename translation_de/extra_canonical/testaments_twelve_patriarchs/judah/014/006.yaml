source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Πολλὴ⁴⁰ γὰρ⁴¹ τῷ πίνοντι οἶνον⁴², τέκνα μου⁴³, καὶ αὕτη ἐστὶν ἡ σύνεσις⁴⁴ τῆς οἰνοποσίας, *ἕως ὅτε ἔχει αἰδῶ⁴⁵, πίνει.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/006.yaml
  text: 'For the one who drinks wine, my children, has need of much understanding, and this is the understanding for drinking wine: as long as he still has shame, let him drink.'
translation:
  language: de
  text: 'Denn wer Wein trinkt, meine Kinder, braucht viel Einsicht. Und dies ist die Einsicht beim Weintrinken: Solange er noch Schamgefühl hat, trinkt er.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πολλὴ … σύνεσις
  choice: braucht viel Einsicht
  rationale: Die elliptische griechische Wendung wird entsprechend dem Sinnzusammenhang natürlich ergänzt; „Einsicht“ wahrt den Bezug zu vernünftigem, maßvollem Verhalten.
- source_word: οἰνοποσίας
  choice: beim Weintrinken
  rationale: Gibt das substantivierte Trinken von Wein in geläufigem modernem Deutsch wieder.
- source_word: αἰδῶ
  choice: Schamgefühl
  rationale: Bezeichnet hier das sittliche Empfinden beziehungsweise die Hemmung, die durch übermäßigen Weingenuss verloren gehen kann.
- source_word: πίνει
  choice: soll er trinken
  rationale: Der griechische Indikativ kann in diesem sentenzartigen Zusammenhang normativ verstanden werden; die Formulierung bewahrt die auffällige Erlaubnis mit ihrer begrenzenden Bedingung.
theological_decisions:
- issue: Bewertung des Weintrinkens
  choice: Die bedingte Aussage bleibt als Erlaubnis zum Trinken formuliert.
  alternative: Als generelle Warnung oder als vollständiges Alkoholverbot umformulieren.
  rationale: Der griechische Text untersagt Wein nicht grundsätzlich, sondern bindet das Trinken an den Fortbestand von αἰδώς; diese Spannung darf nicht konfessionell geglättet werden.
- issue: Bedeutung von αἰδώς
  choice: Schamgefühl
  alternative: Selbstbeherrschung oder Anstand
  rationale: „Schamgefühl“ entspricht der lexikalischen Grundbedeutung am unmittelbarsten; funktionale Deutungen wie „Selbstbeherrschung“ würden den Text stärker auslegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Einsicht“ bildet die griechische Wiederaufnahme ab; die abschließende Aussage bleibt bewusst pointiert und spannungsreich.
