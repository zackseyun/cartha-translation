base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/014/004.yaml
  text: For behold, it also led me astray, so that I was not ashamed before the multitude of the city. For in the sight of all I turned aside to Tamar, and I committed a great sin, and I uncovered the covering of uncleanness of my sons.
translation:
  language: de
  text: 'Denn siehe: Auch mich verleitete es dazu, mich vor der Menschenmenge der Stadt nicht zu schämen. Denn vor aller Augen wandte ich mich Tamar zu; ich beging eine große Sünde und enthüllte die Hülle der Unreinheit meiner Söhne[a].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Bedeckung/Hülle der Unreinheit meiner Söhne“. Der griechische Ausdruck ist ungewöhnlich; er kann auf sexuelle Schande, Unreinheit oder entehrende Bloßstellung anspielen.'
    reason: Die Fußnote erläutert die schwer verständliche, im Haupttext bewusst erhaltene Metapher und wahrt ihre Deutungsoffenheit.
lexical_decisions:
- source_word: Ἰδοὺ γὰρ
  choice: Denn seht
  rationale: Bewahrt sowohl die begründende Partikel γάρ als auch den aufmerksamkeitslenkenden Imperativ ἰδού in natürlichem, würdigem Deutsch.
- source_word: κἀμὲ ἐπλάνησεν
  choice: Auch mich verleitete es
  rationale: κἀμέ wird mit „auch mich“ wiedergegeben; das im unmittelbaren Vers nicht genannte Subjekt bleibt durch „es“ ebenso unbestimmt wie im Griechischen. „Verleitete“ passt zum moralischen Irreführen im Zusammenhang.
- source_word: μὴ αἰσχυνθῆναι
  choice: mich … nicht zu schämen
  rationale: Gibt den Infinitiv Aorist Passiv von αἰσχύνομαι idiomatisch wieder, ohne eine zusätzliche kausale Nuance einzutragen.
- source_word: τὸ πλῆθος πόλεως
  choice: die Menschenmenge der Stadt
  rationale: πλῆθος bezeichnet hier die versammelte Menge; der fehlende Artikel vor πόλεως wird im Deutschen natürlich als Genitivattribut ausgedrückt.
- source_word: ἐν ὀφθαλμῶν πάντων
  choice: vor aller Augen
  rationale: Die überlieferte Formulierung ist grammatisch auffällig, doch der Sinn „im Angesicht/vor den Augen aller“ ist klar; die deutsche Wendung bewahrt Öffentlichkeit und Anschaulichkeit.
- source_word: ἐξέκλινα πρὸς τὴν Θαμάρ
  choice: wandte ich mich Tamar zu
  rationale: ἐκκλίνω kann ein Abweichen oder Sich-Hinwenden bezeichnen. Die Wiedergabe hält die gerichtete Bewegung zu Tamar fest, ohne das Verb unnötig explizit sexuell auszudeuten.
- source_word: ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου
  choice: deckte die Scham meiner Söhne auf
  rationale: Die wörtliche Bildfolge „die Bedeckung der Unreinheit aufdecken“ ist im Deutschen schwer verständlich. „Scham“ erhält die körperlich-sexuelle und entehrende Mehrdeutigkeit; eine Fußnote dokumentiert die ungewöhnliche Metapher.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts von ἐπλάνησεν
  choice: Das Subjekt bleibt mit „es“ unbestimmt.
  alternative: Ein mögliches Subjekt aus dem vorausgehenden Kontext ausdrücklich nennen.
  rationale: Der vorgelegte griechische Vers nennt das verleitende Subjekt nicht. Eine Konkretisierung würde eine kontextuelle beziehungsweise theologische Deutung in den Text eintragen.
- issue: Bedeutung von ἀκαθαρσία im Ausdruck über die Söhne
  choice: Im Haupttext steht „Scham“, ergänzt durch eine textnahe Fußnote.
  alternative: „Unreinheit“ oder eine explizite Bezeichnung sexueller Verfehlung.
  rationale: „Scham“ bewahrt die mögliche Verbindung von Nacktheit, sexueller Entehrung und kultisch-moralischer Unreinheit, ohne die schwer verständliche griechische Metapher dogmatisch festzulegen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, erzählerischem Ton. „Denn seht“ setzt einen deutlichen Aufmerksamkeitsakzent; „vor aller Augen“ und „wandte ich mich Tamar zu“ sind idiomatisch, ohne die öffentliche Beschämung oder die sexuelle Anspielung abzuschwächen. Der Fußnotenmarker [a] steht im Haupttext.
