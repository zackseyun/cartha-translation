lexical_decisions:
- source_word: χάριν
  choice: Gunst
  rationale: Im Zusammenhang mit Judas Erfolgen bezeichnet χάρις das göttliche Wohlwollen, das seine Taten gelingen lässt. „Gunst“ ist hier natürlich und weniger dogmatisch festgelegt als „Gnade“; die Alternative wird in einer Fußnote bewahrt.
- source_word: Κύριος
  choice: Herr
  rationale: Als Gottesbezeichnung wird κύριος mit der im Deutschen geläufigen und würdigen Form „Herr“ wiedergegeben.
- source_word: συνέδραμον ἐλάφῳ
  choice: mit einer Hirschkuh um die Wette lief
  rationale: συντρέχω mit Dativ bedeutet hier, mit dem Tier mitzulaufen beziehungsweise sich im Lauf mit ihm zu messen. Das feminine Pronomen αὐτήν stützt die geschlechtsspezifische Wiedergabe „Hirschkuh“.
- source_word: δορκάδα διὰ τοῦ δρόμου
  choice: Eine Gazelle packte ich mitten im Lauf
  rationale: δορκάς bezeichnet gewöhnlich eine Gazelle; διὰ τοῦ δρόμου beschreibt das Ergreifen während ihres Laufes.
- source_word: ἀφειλόμην
  choice: entriss
  rationale: Das Verb bezeichnet das gewaltsame Wegnehmen des Ziegenböckchens aus dem Maul des Löwen.
- source_word: κρημνόν
  choice: Abhang
  rationale: κρημνός bezeichnet einen steilen Abhang oder Absturz. Der syntaktisch raue Satz wird als Hinabstürzen des Bären verstanden, ohne einen unnötig bestimmten Landschaftstyp vorauszusetzen.
- source_word: κατεσπάραξα
  choice: riss es auseinander
  rationale: Das Verb drückt gewaltsames Zerreißen oder Zerfleischen aus; die Formulierung erhält die drastische Bildlichkeit.
- source_word: ἐρράγη εἰς δύο
  choice: in zwei Stücke gerissen wurde
  rationale: Die Wendung besagt wörtlich, dass der Leopard infolge des Aufpralls entzwei barst. Die passive deutsche Form wahrt den Ereignisablauf.
- source_word: 'source_word: βοῦν ἄγριον'
  choice: wilden Ochsen
  rationale: βοῦς kann Rind, Ochse oder Stier bezeichnen. „Wilder Ochse“ ist eine natürliche, nicht überpräzisierende Wiedergabe; „wilder Stier“ bleibt als Alternative in der Fußnote.
- source_word: κύκλῳ συσσείσας
  choice: schleuderte ihn im Kreis herum
  rationale: Die Wendung beschreibt ein heftiges kreisförmiges Schütteln oder Herumschleudern und bewahrt die wiederholte Bewegungsintensität.
- source_word: σκοτίσας
  choice: betäubte ihn
  rationale: Wörtlich mit Dunkelheit verbunden, bezeichnet das Verb im Kontext wohl das Benommenmachen oder Betäuben des Tieres. Die Übersetzung vermeidet das im Deutschen missverständliche „blendete“.
- source_word: ἡμέρωσα
  choice: zähmte
  rationale: ἡμερόω bedeutet, ein wildes Tier zahm zu machen. Der abschließende Satz wird gemäß dem griechischen Ausgangstext vollständig aufgenommen.
theological_decisions:
- issue: Göttliche Mitwirkung an Judas Krafttaten
  choice: Der Herr schenkt Judas Gunst bei allem, was er tut.
  alternative: Die Aussage könnte als allgemeine Segensformel verstanden werden, ohne eine unmittelbare Befähigung zu jeder einzelnen Tat zu behaupten.
  rationale: Der Eingangssatz führt Judas Erfolge ausdrücklich auf die vom Herrn gewährte χάρις zurück. Die Übersetzung wahrt sowohl Judas eigenes Handeln als auch dessen theologische Einordnung unter Gottes Wohlwollen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, erzählerischem Ton. Die kurzen, kraftvollen Hauptsätze bewahren den katalogartigen Stil der griechischen Erzählung. Unnatürliche Gräzismen werden maßvoll aufgelöst, ohne die textlichen Unebenheiten oder die außergewöhnliche Gewalt der Bilder abzuschwächen. Der im englischen Konsultationstext enthaltene Satz über eine wilde Stute wurde nicht übernommen, da er im bereitgestellten griechischen Primärtext fehlt; dagegen wurden das Töten des wilden Ochsen und das abschließende Zähmen eines Löwen gemäß dem griechischen Text aufgenommen.
