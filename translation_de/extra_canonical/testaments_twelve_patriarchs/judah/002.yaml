  text: And the Lord gave me favor in all my works[a], in the field and in the house. I know that I ran with a hind and caught it, and I made it food for my father, and he ate. And I would seize the gazelle in its course, and I overtook everything that was in the fields. I killed the lion and snatched a kid from its mouth. I took hold of the bear by its foot and cast it down the cliff, and it was crushed. I ran down the wild boar, and I overtook it as I ran and tore it apart. I caught a wild mare and, after seizing it, subdued it. A leopard in Hebron sprang upon the dog, and I caught it by the tail and flung it against the rock, and it was split in two. I found a wild ox grazing in the land, and taking hold of its horns[c][b], I shook it round and round and struck it blind.
translation:
  language: de
  text: '**Testament Judas 2**


    Und der Herr schenkte mir Gunst bei allem, was ich tat[a][b], auf dem Feld wie im Haus. 2 Ich weiß noch, wie ich mit einer Hirschkuh um die Wette lief und sie fing. Ich bereitete sie meinem Vater zur Speise, und er aß davon. 3 Eine Gazelle packte ich mitten im Lauf, und alles, was auf den Feldern war, holte ich ein. 4 Ich tötete den Löwen und entriss seinem Maul ein Ziegenböckchen. Einen Bären packte ich am Fuß und stürzte ihn den Abhang hinunter; er wurde zerschmettert. 5 Dem Wildschwein lief ich nach, holte es im Lauf ein und riss es auseinander. 6 In Hebron sprang ein Leopard den Hund an. Ich packte ihn am Schwanz und schleuderte ihn gegen den Felsen, sodass er entzwei barst. 7 Ich fand einen wilden Ochsen[c], der im Land weidete. Ich packte ihn bei den Hörnern, schüttelte ihn im Kreis herum, blendete ihn, warf ihn nieder und tötete ihn. 8 Auch einen Löwen zähmte ich.


    [a] Der griechische Text dieses Kapitels ist stellenweise sprachlich und textlich schwierig, besonders in der Abfolge der geschilderten Krafttaten. Die Übersetzung folgt vorrangig dem erhaltenen griechischen Text und glättet seine knappe, sprunghafte Darstellung nur so weit, wie es für verständliches Deutsch nötig ist.


    [b] Für „Gunst“ ist auch „Gnade“ möglich. Hier bezeichnet das Wort den von Gottes Wohlwollen gewährten Erfolg bei Judas Taten.


    [c] Oder: „wilden Stier“. Das griechische Wort bezeichnet hier ein kräftiges, ungezähmtes Rind.'
