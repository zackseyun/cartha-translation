  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016.yaml
  text: '1[a]. Guard yourselves, therefore, my children, against the limit of wine; for in it there are four evil spirits: desire, heated passion, dissipation, and shameful gain[b].


    2. If you drink wine in gladness, be modest with the fear of God. For if, in gladness, the fear of God departs, then drunkenness follows, and shamelessness enters.


    3. But if you want to live with self-control, do not touch wine at all, lest you sin in words of insolence and in fights and in slanders and in transgressions of the commandments of God, and perish before your time.


    4. Wine also reveals the mysteries of God and of men, just as I too revealed the commandments of God and the mysteries of Jacob my father to the Canaanite woman—things that God told me not to reveal.


    5[c]. And wine becomes the cause of war and turmoil.'
translation:
  language: de
  text: '**Testament Juda 16**


    **1.** Haltet daher, meine Kinder, beim Wein die Grenze ein[a]; denn in ihm sind vier böse Geister[b]: Begierde, entflammte Leidenschaft, Ausschweifung und schändliche Gewinnsucht.


    **2.** Wenn ihr in Fröhlichkeit Wein trinkt, dann seid in Gottesfurcht zurückhaltend.


    **3.** Wenn ihr aber besonnen leben wollt, dann rührt überhaupt keinen Wein an, damit ihr euch nicht durch überhebliche Worte, Streitigkeiten, Verleumdungen und Übertretungen der Gebote Gottes versündigt und vor eurer Zeit umkommt.


    **4.** Der Wein deckt auch Geheimnisse Gottes und der Menschen auf. So offenbarte auch ich der Kanaaniterin die Gebote Gottes und die Geheimnisse meines Vaters Jakob[c] – Dinge, von denen Gott mir gesagt hatte, ich solle sie nicht offenbaren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Grenze des Weines“. Gemeint sein kann auch das rechte Maß beim Wein, das nicht überschritten werden soll.'
    reason: lexical_alternative
  - marker: b
    text: Mit den „bösen Geistern“ können personifizierte Laster oder tatsächliche geistige Mächte gemeint sein; der griechische Ausdruck lässt dies offen.
    reason: lexical_alternative
  - marker: c
    text: Juda erinnert hier daran, dass er der Kanaaniterin Dinge offenbarte, deren Offenlegung Gott ihm nach seinen Worten verboten hatte.
    reason: cross_reference
lexical_decisions:
- source_word: τὸν ὅρον τοῦ οἴνου
  choice: beim Wein die Grenze zu überschreiten
  rationale: ὅρος bezeichnet eine Grenze oder Begrenzung. Die deutsche Formulierung bewahrt das Grenzbild, macht aber zugleich natürlich verständlich, dass vor dessen Überschreitung gewarnt wird.
- source_word: πνεύματα πονηρά
  choice: böse Geister
  rationale: Die wörtliche Geist-Terminologie bleibt erhalten; der anschließende Lasterkatalog lässt sowohl eine personifizierende als auch eine übertragene Lesart offen.
- source_word: πύρωσις
  choice: entflammte Leidenschaft
  rationale: Die Wiedergabe bewahrt das Bild des Brennens und bezeichnet zugleich verständlich eine durch Wein angefachte Erregung.
- source_word: ἀσωτία
  choice: Ausschweifung
  rationale: Das Wort bezeichnet zügellose, verschwenderische Lebensführung; „Ausschweifung“ ist im Deutschen prägnant, ohne den Sinn ausschließlich zu sexualisieren.
- source_word: αἰσχροκερδία
  choice: schändliche Gewinnsucht
  rationale: Die Übersetzung gibt sowohl das Streben nach Gewinn als auch dessen moralisch verwerflichen Charakter wieder.
- source_word: αἰδούμενος μετὰ φόβου Θεοῦ
  choice: bleibt dabei zurückhaltend und habt Ehrfurcht vor Gott
  rationale: αἰδέομαι kann Schamgefühl, Scheu und rücksichtsvolle Zurückhaltung bezeichnen; φόβος Θεοῦ wird idiomatisch als Ehrfurcht vor Gott wiedergegeben.
- source_word: σωφρόνως
  choice: besonnen
  rationale: Das Adverb bezeichnet ein selbstbeherrschtes, maßvolles und vernünftiges Leben. „Besonnen“ hält diese Bedeutungsbreite zusammen.
- source_word: μηδ᾽ ὅλως τοῦ οἴνου ἐφάπτεσθε
  choice: rührt überhaupt keinen Wein an
  rationale: Die starke, absolute Form des griechischen Verbots wird beibehalten und nicht zu einer bloßen Warnung vor übermäßigem Trinken abgeschwächt.
- source_word: λόγοις ὕβρεως
  choice: überhebliche Worte
  rationale: ὕβρις bezeichnet anmaßendes, verletzendes Auftreten; die Formulierung wahrt hier den Bezug auf die Rede.
- source_word: οὐκ ἐν καιρῷ ὑμῶν
  choice: vor eurer Zeit
  rationale: Die idiomatische deutsche Wendung gibt den Gedanken eines unzeitigen Todes wieder.
- source_word: μυστήρια
  choice: Geheimnisse
  rationale: Im Kontext geht es um verborgene, nicht zur Offenlegung bestimmte Dinge; „Geheimnisse“ ist daher klarer als das im Deutschen stärker religiös-technische „Mysterien“.
theological_decisions:
- issue: Status der vier πνεύματα πονηρά
  choice: „böse Geister“ wird wörtlich wiedergegeben.
  alternative: „böse Regungen“ oder „verderbliche Neigungen“
  rationale: Der griechische Text verwendet ausdrücklich Geist-Sprache. Die Übersetzung soll nicht entscheiden, ob rein personifizierte Laster oder eigenständige geistige Mächte gemeint sind.
- issue: Reichweite des Weinverbots in Vers 3
  choice: Das Verbot wird als völliges Nichtanrühren wiedergegeben.
  alternative: Warnung lediglich vor übermäßigem Weingenuss
  rationale: μηδ᾽ ὅλως und ἐφάπτεσθε formulieren stärker als ein Gebot zur Mäßigung; diese Spannung zu Vers 2 bleibt erhalten.
- issue: Zusätzliche Sätze und Vers 5 der englischen Konsultationsfassung
  choice: Nur der vorgelegte griechische Haupttext wird übersetzt; die dort nicht belegten Zusätze nach Vers 2 und Vers 5 werden nicht aufgenommen.
  alternative: Übernahme der zusätzlichen englischen Sätze
  rationale: Die griechische Ausgangsevidenz dieser Aufgabe enthält weder den Zusatz über Trunkenheit und Schamlosigkeit noch einen fünften Vers. Die Konsultationsfassung darf fehlenden Ausgangstext nicht ersetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Mahnrede. Das ungewöhnliche Grenzbild des Griechischen bleibt erhalten, wird jedoch idiomatisch entfaltet. Die Spannung zwischen maßvollem Trinken in Vers 2 und vollständiger Enthaltung in Vers 3 wird nicht harmonisiert. Nicht im vorgelegten griechischen Text belegte Bestandteile der englischen Konsultationsfassung wurden ausgelassen.
