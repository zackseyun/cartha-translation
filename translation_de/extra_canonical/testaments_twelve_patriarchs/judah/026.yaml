  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/026.yaml
  text: 'Therefore keep[a], my children, the whole law of the Lord, for it is hope for all who keep his ways in righteousness. And bury me near my fathers.


    And he fell asleep in a good old age. And his sons did as he had commanded them, and they carried him up to Hebron and buried him there with his fathers.


    And if you walk in holiness according to all the commandments of the Lord, you will again dwell securely with me[b], and all Israel will be gathered to the Lord forever.'
translation:
  language: de
  text: '**Testament Judas 26**


    1 Darum, meine Kinder, haltet das ganze Gesetz des Herrn; denn es ist Hoffnung für alle, die seine Wege gerade ausrichten.[a]


    2 Und er sagte zu ihnen: »Seht, ich bin hundertachtzehn Jahre alt und sterbe heute.


    3 Niemand soll mich in einem kostbaren Gewand bestatten. Bringt mich vielmehr hinauf nach Hebron, wo auch meine Väter sind.«


    4 Nachdem er dies gesagt hatte, entschlief er.[b] Seine Söhne taten alles, was er ihnen geboten hatte, und bestatteten ihn bei seinen Vätern in Hebron.


    [a] Das griechische Verb kann »gerade machen«, »richtig ausrichten« oder »recht leiten« bedeuten. Die ungewöhnliche Verbindung mit »seine Wege« bleibt daher bewusst sichtbar.


    [b] »Entschlief« ist hier die herkömmliche ehrende Umschreibung für den Tod.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann »gerade machen«, »richtig ausrichten« oder »recht leiten« bedeuten. Die ungewöhnliche Verbindung mit »seine Wege« bleibt daher bewusst sichtbar.
    reason: lexical_alternative
  - marker: b
    text: »Entschlief« ist hier die herkömmliche ehrende Umschreibung für den Tod.
    reason: lexical_alternative
lexical_decisions:
- source_word: Φυλάξατε
  choice: haltet
  rationale: Der Imperativ bezeichnet das treue Befolgen und Bewahren des Gesetzes; »haltet« ist dafür im Deutschen klar und biblisch geläufig.
- source_word: τέκνα μου
  choice: meine Kinder
  rationale: Bewahrt die unmittelbare familiäre Anrede und kann neben den Söhnen auch die Nachkommenschaft als weitere Hörerschaft einschließen.
- source_word: πάντα τὸν νόμον Κυρίου
  choice: das ganze Gesetz des Herrn
  rationale: Gibt die betonte Gesamtheit des Gesetzes natürlich wieder, ohne sie auf einzelne Gebote zu verengen.
- source_word: ἐλπίς
  choice: Hoffnung
  rationale: Bewahrt den theologischen und ermahnenden Gehalt des griechischen Substantivs.
- source_word: τοῖς κατευθύνουσι τὰς ὁδοὺς αὐτοῦ
  choice: für alle, die seine Wege gerade ausrichten
  rationale: Hält die auffällige aktive Formulierung des Griechischen sichtbar. κατευθύνω kann »gerade machen«, »ausrichten« oder »recht leiten« bedeuten; eine glättende Wiedergabe als bloßes Wandeln auf Gottes Wegen würde die syntaktische Spannung verdecken.
- source_word: ἑκατὸν δέκα καὶ ὀκτὼ ἐτῶν
  choice: hundertachtzehn Jahre alt
  rationale: Natürliche deutsche Altersangabe bei genauer Bewahrung der Zahl des griechischen Textes.
- source_word: ἐν πολυτελεῖ ἐσθῆτι
  choice: in kostbarer Kleidung
  rationale: πολυτελής bezeichnet kostspielige oder prunkvolle Kleidung; »kostbar« bewahrt den Sinn ohne unnötige Ausschmückung.
- source_word: ἀναγάγετε
  choice: bringt ... hinauf
  rationale: Bewahrt die im Verb enthaltene Aufwärtsbewegung der Überführung nach Hebron.
- source_word: ἐκοιμήθη
  choice: entschlief
  rationale: Gibt die traditionelle Umschreibung des Todes wieder und wahrt den würdevollen testamentarischen Erzählton.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: bei seinen Vätern
  rationale: Die Wendung bezeichnet die Bestattung in der Gemeinschaft beziehungsweise Begräbnisstätte der Vorfahren; »bei« ist im Deutschen natürlicher als ein missverständliches »mit«.
theological_decisions:
- issue: Verhältnis von Gesetz, Hoffnung und rechtem Weg
  choice: Die Hoffnung bleibt ausdrücklich mit dem Halten des ganzen Gesetzes des Herrn und dem rechten Ausrichten seiner Wege verbunden.
  alternative: Die Aussage als allgemeine moralische Lebensregel ohne Bundes- oder Gesetzesbezug wiederzugeben.
  rationale: Der griechische Text nennt ausdrücklich das Gesetz des Herrn und verbindet damit die Hoffnung. Diese Spannung wird nicht abgeschwächt oder systematisch erklärt.
- issue: Todesformel
  choice: Die bildhafte Formel ἐκοιμήθη wird mit »entschlief« bewahrt.
  alternative: Die Formel vollständig zu »starb« aufzulösen.
  rationale: Das Bild des Schlafes gehört zum würdevollen patriarchalischen Erzählregister; die Fußnote stellt klar, dass der Tod gemeint ist.
- issue: Abgrenzung gegenüber nicht belegtem Zusatzmaterial
  choice: Übersetzt werden nur die vier im vorgelegten griechischen α-Text bezeugten Abschnitte.
  alternative: Zusätzliche Sätze über ein gutes Alter, ein künftiges sicheres Wohnen oder die endzeitliche Sammlung Israels aus der englischen Konsultationsfassung aufzunehmen.
  rationale: Diese Aussagen stehen nicht im bereitgestellten griechischen Ausgangstext und dürfen deshalb nicht als Teil dieses quellengestützten Entwurfs erscheinen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit testamentarisch-biblischem Ton. Die Syntax wurde maßvoll geglättet, die auffällige Formulierung zu den Wegen des Herrn jedoch nicht stillschweigend vereindeutigt. Die direkte Rede wird zur Lesbarkeit typografisch markiert.
