  text: '1. And on the next day it was reported to us that the king of the city of Gaas was coming against us with a great multitude.


    2. So Dan and I, pretending to be Amorites as though allies, entered their city.


    3. And in the deep night, when our brothers came, we opened the gates to them, and we destroyed all of them and all that was theirs; and after plundering everything that belonged to them, we tore down their three walls.


    4. And we drew near to Thamna, where all their baggage was.


    5. Then, being insulted by them, I became angry, and I rushed up against them to the summit. And they kept hurling stones and shooting arrows at me.


    6. And if Dan my brother had not fought alongside me,'
translation:
  language: de
  text: '1. Am folgenden Tag wurde uns berichtet, dass der König der Stadt Gaas mit zahlreichem Kriegsvolk gegen uns heranziehe.


    2. Da gingen Dan und ich zu den Amoritern, gaben uns ihnen gegenüber als Verbündete aus und gelangten in ihre Stadt.


    3. Tief in der Nacht kamen meine Brüder zu uns. Wir öffneten ihnen die Tore, vernichteten alle dort und plünderten die Stadt.


    4. Dann näherten wir uns Thamna, wo sich der gesamte Tross der feindlichen Könige befand.


    5. Als sie mich daraufhin verhöhnten, wurde ich zornig und stürmte gegen sie den Gipfel hinauf. Sie schleuderten Steine nach mir und schossen mit Pfeilen auf mich.


    6. Und wenn mein Bruder Dan nicht an meiner Seite gekämpft hätte,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν λαῷ πολλῷ
  choice: mit zahlreichem Kriegsvolk
  rationale: λαός bezeichnet hier im militärischen Zusammenhang die große Gefolgschaft bzw. Streitmacht des Königs; „Kriegsvolk“ gibt den Kontext natürlicher und genauer wieder als das allgemeine „Volk“.
- source_word: προσποιησάμενοι αὐτοῖς συμμάχους
  choice: gaben uns ihnen gegenüber als Verbündete aus
  rationale: Die Konstruktion bezeichnet ein Vortäuschen gegenüber den Amoritern. Anders als die englische Konsultationsfassung sagt der griechische Text nicht, dass Juda und Dan sich als Amoriter ausgaben.
- source_word: ἐξωλοθρεύσαμεν
  choice: vernichteten
  rationale: Das starke Verb bezeichnet vollständige Vernichtung; die Härte des Ausgangstextes bleibt erhalten.
- source_word: ἐπρονομεύσαμεν
  choice: plünderten die Stadt
  rationale: Das Verb bedeutet „ausplündern“. Das ergänzte Objekt „die Stadt“ ist aus dem unmittelbaren Kontext erschlossen und ergibt im Deutschen einen vollständigen Satz, ohne die im vorliegenden griechischen Text nicht belegten Zusätze der englischen Fassung zu übernehmen.
- source_word: ἀποσκευή
  choice: Tross
  rationale: Im Kriegskontext bezeichnet das Wort Gepäck, Ausrüstung und Begleitmaterial; „Tross“ bündelt diese Bedeutung idiomatisch.
- source_word: ὑβριζόμενος
  choice: als sie mich … verhöhnten
  rationale: Das Partizip kann Misshandlung, Beschimpfung oder überhebliche Kränkung bezeichnen. Im Zusammenhang des Fernkampfs ist „verhöhnten“ eine natürliche, aber nicht überpräzisierende Wiedergabe.
- source_word: ἐπ᾽ αὐτοὺς ἐπὶ τὴν κορυφήν
  choice: gegen sie den Gipfel hinauf
  rationale: Bewahrt sowohl die feindliche Zielrichtung als auch die Aufwärtsbewegung zum Gipfel.
- source_word: συνεμάχησεν
  choice: an meiner Seite gekämpft hätte
  rationale: Gibt das gemeinsame Kämpfen idiomatisch wieder und erhält die irreale Bedingung des unvollendeten Satzes.
theological_decisions:
- issue: Gewaltdarstellung
  choice: Die vollständige Vernichtung wird ohne Abschwächung wiedergegeben.
  alternative: Eine mildere Formulierung wie „besiegten“ oder „schlugen“ wäre möglich, entspräche aber nicht der Stärke von ἐξολοθρεύω.
  rationale: Die Übersetzung soll die moralische und theologische Spannung der Erzählung nicht stillschweigend glätten.
- issue: Zusätze der englischen Konsultationsfassung in Vers 3
  choice: Nur der im bereitgestellten griechischen Text belegte Inhalt wird übersetzt.
  alternative: Die Sätze über die Plünderung ihres gesamten Besitzes und den Abriss der drei Mauern könnten aus einer anderen Textfassung aufgenommen werden.
  rationale: Die vorgelegte griechische Primärquelle endet in Vers 3 mit καὶ ἐπρονομεύσαμεν und enthält weder den Abriss dreier Mauern noch die ausführlicheren Objekte der englischen Fassung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erzählerischem Fluss. Die Ortsnamen „Gaas“ und „Thamna“ folgen der gegebenen griechischen Form. Vers 6 bleibt absichtlich syntaktisch offen, da auch der bereitgestellte Ausgangstext mitten im Bedingungssatz abbricht.
