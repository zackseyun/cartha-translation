  to: '1. Am folgenden Tag wurde uns berichtet, dass der König der Stadt Gaas mit zahlreichem Kriegsvolk gegen uns heranziehe.


    2. Da gingen Dan und ich zu den Amoritern, gaben uns ihnen gegenüber als Verbündete aus und gelangten in ihre Stadt.


