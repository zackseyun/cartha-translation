  source_fidelity: Der Entwurf folgt der vorgelegten griechischen α-Fassung insgesamt eng. Er bewahrt zutreffend den Unterschied zur englischen Audit-Fassung in V. 2 (Vortäuschung einer Verbündetenschaft, nicht einer amoritischen Identität) und lässt die in dieser griechischen Vorlage nicht enthaltenen Zusätze zu V. 3 aus. In V. 3 erzeugt jedoch „vernichteten sie alle“ im Deutschen nach „meine Brüder“ eine vermeidbare und irreführende Rückbeziehung auf die Brüder; das griechische αὐτούς bezieht sich kontextuell auf die Menschen in der Stadt. Die Revision klärt dies behutsam, ohne einen weitergehenden, im Text nicht ausdrücklich benannten Personenkreis festzulegen.
  naturalness: Modernes, würdiges Standarddeutsch. Die leicht angepasste Formulierung in V. 3 beseitigt eine im Deutschen besonders naheliegende Fehlzuordnung des Pronomens. Der offen bleibende Bedingungssatz in V. 6 wird sachgerecht beibehalten.
  terminology: „Kriegsvolk“, „Verbündete“, „Tross“ und „an meiner Seite gekämpft“ sind im Kontext angemessen. „Gaas“ und „Thamna“ folgen den Formen der bereitgestellten griechischen Vorlage. Für ὑβριζόμενος bleibt „verhöhnten“ als mögliche, nicht dogmatisch oder übermäßig spezifizierende Kontextwiedergabe vertretbar.
