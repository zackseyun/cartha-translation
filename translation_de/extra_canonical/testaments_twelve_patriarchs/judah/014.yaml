  text: 'These two things turn away a man''s mind[a]. For if you drink wine to drunkenness, it throws your mind into turmoil with filthy thoughts, and heats your body toward pleasure for sexual immorality, and it commits sin and is not ashamed.


    Such is the wine-drinker, my children, because the one who gets drunk has regard for no one. For see, it also led me astray, so that I was not ashamed before the multitude of the city. In the sight of all I turned aside to Tamar, and I committed a great sin, and I uncovered the covering of uncleanness of my sons.


    After drinking wine, I was not ashamed of the commandment of God, and I took a Canaanite woman. For the one who drinks wine, my children, has need of much understanding, and this is the understanding for drinking wine: as long as he still has shame, let him drink. But if he goes on until he passes the limit, a spirit of deception enters into his mind and makes the drunkard speak shamefully and act lawlessly and feel no shame[c][b], but even boast in his dishonor and think it good.'
translation:
  language: de
  text: '14 Und nun sage ich euch, meine Kinder: Berauscht euch nicht mit Wein! Denn der Wein verdreht den Verstand und führt ihn von der Wahrheit weg; er weckt den Zorn der Begierde[a] und führt die Augen in die Irre. 2 Denn der Geist der sexuellen Unmoral nimmt den Wein als Diener für die Lust des Verstandes. Diese beiden bringen nämlich das Denken des Menschen ab.


    3 Wenn jemand Wein trinkt, bis er betrunken ist, bringt der Wein seinen Verstand durch schmutzige Gedanken völlig durcheinander und erhitzt seinen Körper zur Lust auf sexuelle Unmoral. Dann begeht er die Sünde und schämt sich nicht. 4 So ist der, der dem Wein ergeben ist, meine Kinder; denn wer sich betrinkt, nimmt auf niemanden Rücksicht.


    5 Seht, auch mich führte der Wein in die Irre, sodass ich mich vor den vielen Leuten der Stadt nicht schämte. Vor aller Augen wandte ich mich Tamar zu, beging eine große Sünde und deckte die Bedeckung der Unreinheit meiner Söhne auf.[b] 6 Nachdem ich Wein getrunken hatte, hatte ich keine Scheu vor Gottes Gebot und nahm mir eine kanaanäische Frau.


    7 Wer Wein trinkt, meine Kinder, braucht viel Einsicht.[c] Und darin besteht die Einsicht beim Weintrinken: Solange er noch Schamgefühl hat, trinkt er. 8 Überschreitet er aber die Grenze, dringt ein Geist der Verirrung[d] in seinen Verstand ein. Dieser bringt den Betrunkenen dazu, schändlich zu reden, gegen das Gesetz zu handeln und sich nicht zu schämen, sondern sich sogar seiner Schande zu rühmen und sie für etwas Gutes zu halten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Verbindung kann auch im Sinn von „begierigen Zorn“ oder „zornige Begierde“ verstanden werden.
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Ausdruck ist schwer verständlich. Möglich ist auch: „Ich stellte die schändliche Bedeckung meiner Söhne bloß.“ Gemeint sein könnte, dass Judas Sünde mit Tamar die Unreinheit oder Schande seiner Familie öffentlich machte.'
    reason: lexical_alternative
  - marker: c
    text: Der überlieferte griechische Satz ist elliptisch; „braucht viel Einsicht“ ergänzt die im Zusammenhang vorausgesetzte Aussage.
    reason: textual_note
  - marker: d
    text: 'Oder: „ein Geist der Täuschung“. Der Ausdruck lässt offen, ob eine geistige Macht oder personifiziertes Irren gemeint ist.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διαστρέφει τὸν νοῦν ἀπὸ τῆς ἀληθείας
  choice: verdreht den Verstand und führt ihn von der Wahrheit weg
  rationale: Die Wiedergabe bewahrt sowohl die Verformung des Denkens als auch dessen Abwendung von der Wahrheit und klingt im Deutschen natürlich.
- source_word: ὀργὴν ἐπιθυμίας
  choice: den Zorn der Begierde
  rationale: Die ungewöhnliche Genitivverbindung bleibt bewusst eng am griechischen Wortlaut, damit ihre echte Mehrdeutigkeit nicht vorschnell aufgelöst wird.
- source_word: πνεῦμα τῆς πορνείας
  choice: Geist der sexuellen Unmoral
  rationale: „Geist“ erhält die Personifizierung; „sexuelle Unmoral“ gibt den umfassenden sittlichen Sinn von πορνεία in heutiger verständlicher Sprache wieder.
- source_word: ἀφιστῶσι τὴν διάνοιαν
  choice: bringen das Denken des Menschen von seinem Weg ab
  rationale: ἀφίστημι bezeichnet hier ein Abbringen oder Entfremden. „Denken“ wahrt den geistig-sittlichen Bezug von διάνοια, ohne den Satz unnötig zu technisieren.
- source_word: συνταράσσει τὸν νοῦν
  choice: bringt den Verstand ... völlig durcheinander
  rationale: Das verstärkte Verb bezeichnet heftige innere Unruhe; die deutsche Formulierung bewahrt diese Intensität.
- source_word: πάροινος
  choice: der, der dem Wein ergeben ist
  rationale: Die Formulierung bezeichnet eine durch Wein geprägte Person, ohne πάροινος vorschnell mit dem später ausdrücklich genannten Betrunkenen gleichzusetzen.
- source_word: οὐκ αἰδεῖται οὐδένα
  choice: nimmt auf niemanden Rücksicht
  rationale: Die Wendung betrifft den Verlust sozialer und sittlicher Hemmung und ist weiter als bloßer Respekt oder ein enges Verständnis von Scham.
- source_word: ἀνεκάλυψα τὸ κάλυμμα ἀκαθαρσίας υἱῶν μου
  choice: deckte die unreine Bedeckung meiner Söhne auf
  rationale: Die absichtlich nahe Wiedergabe erhält das schwierige Bild, anstatt seine unklare Beziehung zu Juda, Tamar und seinen Söhnen im Haupttext festzulegen.
- source_word: σύνεσις τῆς οἰνοποσίας
  choice: Einsicht beim Weintrinken
  rationale: σύνεσις meint vernünftige Urteilskraft und Selbstbeherrschung; „Einsicht“ passt zum mahnenden Zusammenhang.
- source_word: πνεῦμα τῆς πλάνης
  choice: ein Geist der Verirrung
  rationale: „Geist“ bewahrt die Personifizierung, während „Verirrung“ sowohl Täuschung als auch moralisches Abirren offenhält.
- source_word: αἰσχρορρημονεῖν
  choice: schändlich zu reden
  rationale: Die Wiedergabe bezeichnet den anstößigen oder schändlichen Inhalt der Rede, nicht nur eine schamlose Haltung.
theological_decisions:
- issue: Personifizierung der sexuellen Unmoral und der Verirrung als πνεῦμα
  choice: Beide Wendungen werden als „Geist“ wiedergegeben.
  alternative: Eine entpersonalisierte Wiedergabe wie „Trieb zur sexuellen Unmoral“ beziehungsweise „Täuschung“.
  rationale: Der griechische Text verwendet ausdrücklich πνεῦμα. Die Übersetzung bewahrt diese geistige Personifizierung, ohne Wesen, Herkunft oder dämonischen Status näher zu bestimmen.
- issue: Die Aussage, man solle trinken, solange Schamgefühl vorhanden ist
  choice: Die auffällige Erlaubnis zur maßvollen Nutzung des Weins bleibt im Haupttext stehen.
  alternative: Eine generelle Abstinenzforderung oder die Umdeutung zu einer rein beschreibenden Aussage.
  rationale: Der Text verbindet ein anfängliches Verbot des Sich-Berauschens mit einer Grenze für das Trinken. Diese Spannung darf nicht konfessionell oder ethisch geglättet werden.
- issue: Judas Bekenntnis über Tamar und seine Söhne
  choice: Das metaphorische Bild wird eng und mehrdeutig wiedergegeben.
  alternative: Eine eindeutige Deutung als Familienschande oder sexuelle Entblößung.
  rationale: Der griechische Ausdruck ist dunkel. Eine präzisierende Deutung im Haupttext würde mehr behaupten, als die Quelle sicher erkennen lässt.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter mahnender Anrede. Wiederkehrende Leitwörter wie Wein, Verstand, Scham und Geist bleiben erkennbar. Ungewöhnliche oder beschädigte Stellen werden nicht stillschweigend harmonisiert, sondern im Haupttext möglichst lesbar bewahrt und in Fußnoten offengelegt.
