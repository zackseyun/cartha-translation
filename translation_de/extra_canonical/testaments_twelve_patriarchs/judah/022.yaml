  text: The Lord will bring divisions among them against one another[a], and there will be continual wars in Israel. And my kingdom will be brought to an end among foreigners, until the salvation of Israel comes[c][b],
translation:
  language: de
  text: 22 Der Herr wird Spaltungen unter ihnen hervorrufen, sodass sie gegeneinanderstehen, und in Israel wird es fortwährend Kriege geben. 2 Und mein Königreich wird unter Fremden zu Ende kommen[a], bis Israels Rettung kommt[b], bis Gott, der Gott der Gerechtigkeit, erscheint[c], um Jakob und alle Völker in Frieden zur Ruhe kommen zu lassen. 3 Und er wird die Macht meines Königreichs für immer bewahren. Denn der Herr hat mir mit einem Eid geschworen, das Königtum aus meiner Nachkommenschaft niemals auszulöschen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird unter Fremden vollendet werden“. Das griechische Verb kann sowohl das Vollenden als auch das Zu-Ende-Bringen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Israels Heil“. Die Wendung kann einen messianischen Anklang haben, nennt aber nicht ausdrücklich eine Person.'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlicher: „bis zur Erscheinung des Gottes der Gerechtigkeit“.'
    reason: literal_rendering
lexical_decisions:
- source_word: Ἐπάξει … διαιρέσεις
  choice: wird Spaltungen … hervorrufen
  rationale: Die Zukunftsform von ἐπάγω bezeichnet hier ein Herbeiführen; „hervorrufen“ gibt die göttliche Verursachung in natürlichem Deutsch wieder.
- source_word: κατ᾽ ἀλλήλων
  choice: sodass sie gegeneinanderstehen
  rationale: Die Wendung bezeichnet wechselseitige Feindschaft. Die Formulierung vermeidet die im Deutschen schwerfällige Verbindung „Spaltungen unter ihnen gegeneinander“.
- source_word: συνεχεῖς
  choice: fortwährend
  rationale: Das Adjektiv bezeichnet ununterbrochene oder anhaltende Zustände und wahrt den eindringlichen Ton der Warnung.
- source_word: ἀλλοφύλοις
  choice: Fremden
  rationale: Der weitere Sinn „Fremde“ passt hier besser als die in bestimmten Kontexten mögliche spezielle Bedeutung „Philister“.
- source_word: συντελεσθήσεται
  choice: wird … zu Ende kommen
  rationale: Im Zusammenhang mit Spaltungen und Kriegen liegt die Bedeutung des Zu-Ende-Kommens nahe; die ebenfalls mögliche Bedeutung „vollendet werden“ wird in einer Fußnote bewahrt.
- source_word: τὸ σωτήριον τοῦ Ἰσραήλ
  choice: Israels Rettung
  rationale: Das substantivierte Neutrum bezeichnet am natürlichsten Rettung oder Heil, ohne ausdrücklich eine Person zu benennen.
- source_word: παρουσίας Θεοῦ τῆς δικαιοσύνης
  choice: Gott, der Gott der Gerechtigkeit, erscheint
  rationale: Die finite Form ist in modernem Deutsch natürlicher als „bis zur Erscheinung des Gottes der Gerechtigkeit“ und hält den Gottesbezug ausdrücklich fest.
- source_word: τοῦ ἡσυχάσαι
  choice: um … zur Ruhe kommen zu lassen
  rationale: Der Infinitiv bezeichnet hier das Herbeiführen von Ruhe und Frieden.
- source_word: κράτος τῆς βασιλείας μου
  choice: die Macht meines Königreichs
  rationale: κράτος bezeichnet Stärke oder Herrschaftsmacht; die Formulierung unterscheidet sie vom unmittelbar folgenden βασίλειον.
- source_word: τὸ βασίλειον ἐκ τοῦ σπέρματός μου
  choice: das Königtum aus meiner Nachkommenschaft
  rationale: βασίλειον wird hier dynastisch verstanden; σπέρμα bezeichnet die leibliche Nachkommenschaft beziehungsweise Linie.
theological_decisions:
- issue: Bedeutung von τὸ σωτήριον τοῦ Ἰσραήλ
  choice: Israels Rettung
  alternative: Israels Heil; der Retter Israels
  rationale: Die grammatische Form bezeichnet primär Rettung oder Heil. Eine mögliche messianische Resonanz wird nicht durch die ausdrückliche Benennung eines persönlichen Retters festgelegt.
- issue: Bedeutung von συντελεσθήσεται ἡ βασιλεία μου ἐν ἀλλοφύλοις
  choice: mein Königreich wird unter Fremden zu Ende kommen
  alternative: mein Königreich wird unter Fremden vollendet werden
  rationale: Der negative Zusammenhang von Spaltungen und Kriegen spricht eher für das Ende der Herrschaft; die semantische Möglichkeit einer Vollendung bleibt in der Fußnote sichtbar.
- issue: Bezug von αὐτός in Vers 3
  choice: er
  alternative: Gott; die Rettung Israels als personale Gestalt
  rationale: Das griechische Pronomen lässt den unmittelbaren Bezug nicht völlig eindeutig erkennen. Das deutsche Pronomen bewahrt diese Offenheit, statt den Referenten im Haupttext festzulegen.
- issue: Reichweite des Friedens in Vers 2
  choice: Jakob und alle Völker in Frieden zur Ruhe kommen zu lassen
  alternative: Jakob in Frieden zur Ruhe kommen zu lassen, ebenso alle Völker
  rationale: Die koordinierte griechische Konstruktion verbindet Jakob und alle Völker mit demselben Ruhe stiftenden Handeln und verleiht der Aussage eine universale Reichweite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetisch-testamentarischem Ton. Ungebräuchliche Satzverschachtelungen wurden behutsam geglättet. Die Mehrdeutigkeit bei Rettung/Heil, dem Ende beziehungsweise der Vollendung des Königreichs und dem Bezug des Pronomens in Vers 3 bleibt erhalten.
