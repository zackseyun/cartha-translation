review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe folgt dem Sinn der überlieferten Passage, insbesondere bei den gegenseitigen Spaltungen, dem Ende bzw. der möglichen Vollendung der Königsherrschaft, der Rettung Israels und der bleibenden Dynastie. Allerdings enthält der bereitgestellte griechische α-Text in V. 1 kein Substantiv zu συνεχεῖς, während der englische Audit-Trail ausdrücklich πόλεμοι („Kriege“) dokumentiert. Die Übersetzung „Kriege“ ist daher durch den Audit-Trail und den offensichtlichen Satzsinn gestützt, muss aber gegen die maßgebliche griechische Vorlage bzw. einen erneuten Editionsabgleich geprüft werden.
  naturalness: Der Text ist insgesamt modernes, würdiges Standarddeutsch. In V. 2 ist jedoch „Gott, der Gott der Gerechtigkeit“ unnötig doppelt und weniger idiomatisch. „der Gott der Gerechtigkeit“ gibt παρουσίας Θεοῦ τῆς δικαιοσύνης ebenso genau und natürlicher wieder. Die Kennzeichnung „22,1“ verdeutlicht zudem die Kapitel-/Versgliederung.
  terminology: „Spaltungen“, „Rettung“, „Königreich“, „Königtum“ und „Nachkommenschaft“ sind tragfähig. Die Fußnote zur Vollendungslesart von συντελεσθήσεται bewahrt die lexikalische Alternative angemessen. Die Formulierung „Königtum meiner Nachkommenschaft“ macht in V. 3 den dynastischen Bezug von ἐκ τοῦ σπέρματός μου klarer als „Königtum aus meiner Nachkommenschaft“.
  issues:
  - severity: high
    issue: Textgrundlage für „Kriege“ in V. 1 widersprüchlich
    rationale: Der vorgelegte griechische Text bietet nach συνεχεῖς kein Wort πόλεμοι, sondern eine auffällige Wiederholung von ἔσονται. Der englische POB-Audit-Trail setzt dagegen ausdrücklich πόλεμοι voraus. Da „Kriege“ nicht aus dem vorgelegten griechischen Wortlaut allein abgesichert werden kann, ist ein Abgleich mit der Edition bzw. dem vollständigen α-Text erforderlich.
  - severity: low
    issue: Doppelte und schwerfällige Gottesbezeichnung in V. 2
    rationale: „bis Gott, der Gott der Gerechtigkeit, erscheint“ ist verständlich, doch „bis der Gott der Gerechtigkeit erscheint“ bildet die Genitivverbindung Θεοῦ τῆς δικαιοσύνης direkter und natürlicher ab.
  - severity: low
    issue: Dynastischer Genitiv in V. 3 kann klarer gefasst werden
    rationale: „das Königtum aus meiner Nachkommenschaft“ ist im Deutschen weniger idiomatisch. „das Königtum meiner Nachkommenschaft“ hält den Bezug auf die Nachkommenschaft bzw. Dynastie klar, ohne den Sinn zu verändern.
  revised_text: 22,1 Der Herr wird unter ihnen Spaltungen hervorrufen, sodass sie gegeneinanderstehen, und in Israel wird es fortwährend Kriege geben. 2 Und mein Königreich wird unter Fremden zu Ende kommen[a], bis Israels Rettung kommt[b], bis der Gott der Gerechtigkeit erscheint[c], um Jakob und alle Völker in Frieden zur Ruhe kommen zu lassen. 3 Und er wird die Macht meines Königreichs für immer bewahren. Denn der Herr hat mir mit einem Eid geschworen, das Königtum meiner Nachkommenschaft niemals auszulöschen.
  revised_footnotes:
  - marker: a
    text: 'Oder: „wird unter Fremden vollendet werden“. Das griechische Verb kann sowohl das Vollenden als auch das Zu-Ende-Bringen bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Israels Heil“. Die Wendung kann einen messianischen Anklang haben, nennt aber nicht ausdrücklich eine Person.'
    reason: alternative_reading
  - marker: c
    text: 'Wörtlicher: „bis zur Erscheinung des Gottes der Gerechtigkeit“.'
    reason: literal_rendering
  revision_rationale: Die Revision glättet lediglich die Gottesbezeichnung in V. 2, verdeutlicht die Verszählung und fasst den dynastischen Bezug in V. 3 idiomatischer. Die umstrittene bzw. semantisch mögliche Alternative bei συντελεσθήσεται bleibt in Fußnote a erhalten; die mögliche messianische Resonanz von σωτήριον wird weiterhin nicht dogmatisch festgelegt. „Kriege“ bleibt vorläufig gemäß dem englischen Audit-Trail stehen, obwohl der vorgelegte griechische Text an dieser Stelle überprüft werden muss.
