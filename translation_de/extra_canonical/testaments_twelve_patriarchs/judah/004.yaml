  text: '1. And after this there came to us a greater war toward the south than the one at Shechem; and when I had drawn up in battle with my brothers, we pursued a thousand men and killed two hundred of them, and four kings.

    2. And I went up upon the wall and killed their king.

    3. And so we set Hebron free and took all the captives.

    4. But the rest fled.

    5. Then my father Jacob killed Belisath, king of all the kings, a man giant in strength, twelve cubits high.

    6. And terror fell upon them, and they stopped making war against us.

    7. Therefore my father was without anxiety in the wars while I was with my brothers.

    8. For he saw in a vision concerning me that an angel of power went along with me in all things, so that no one might touch me.'
translation:
  language: de
  text: 'Das Testament Judas 4


    1 Danach kam es für uns zu einem Krieg im Süden, dem Krieg in Sichem.[a] Gemeinsam mit meinen Brüdern stellten wir uns zum Kampf auf, verfolgten tausend Mann und töteten zweihundert von ihnen sowie vier Könige.


    2 Ich stieg auf die Mauer und tötete ihren König. Dann nahmen wir alle Gefangenen mit.[b]


    3 Am folgenden Tag zogen wir nach Areta, einer mächtigen Stadt, die uns mit dem Tod drohte. Gad und ich gingen von Osten her gegen die Stadt vor;[c] Ruben und Levi von Westen her. So befreiten wir die Gefangenen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut ist hier elliptisch und syntaktisch schwierig: wörtlich etwa „ein Krieg im Süden, der in Sichem“. Manche Textfassungen beziehungsweise Übersetzungen verstehen ihn als Vergleich: „ein größerer Krieg als der in Sichem“. Im vorliegenden griechischen Text steht jedoch kein ausdrückliches Wort für „größer“; auch die genaue Beziehung zwischen „im Süden“ und „in Sichem“ bleibt unsicher.'
    reason: Bewahrt die tatsächliche syntaktische Unsicherheit und vermeidet sowohl die unbelegte Vergleichslesart als auch eine weitergehende Deutung eines sachlichen Zusammenhangs.
  - marker: b
    text: Das griechische Wort kann je nach Zusammenhang „Gefangenschaft“, „Gefangene“ oder „Kriegsbeute“ bedeuten. Weil in Vers 3 von Befreiung die Rede ist, sind hier wahrscheinlich Gefangene gemeint.
    reason: Dokumentiert die lexikalische Mehrdeutigkeit von αἰχμαλωσία.
  - marker: c
    text: Das griechische Verb bezeichnet hier ein Vorgehen oder Herankommen gegen die Stadt. Die genaue militärische Handlung bleibt offen.
    reason: Gibt die Bewegungsrichtung wieder, ohne eine nicht ausdrücklich bezeichnete Angriffstaktik festzulegen.
lexical_decisions:
- source_word: κατὰ νότον
  choice: im Süden
  rationale: Gibt die räumliche Angabe natürlich und ohne unnötige Präzisierung wieder.
- source_word: παραταξάμενοι
  choice: stellte ich mich zum Kampf auf
  rationale: Bezeichnet das Aufstellen zur Schlacht; der deutsche Ausdruck wahrt den militärischen Sinn.
- source_word: ἐδιώξαμεν
  choice: wir verfolgten
  rationale: Entspricht der üblichen Bedeutung des Verbs im militärischen Zusammenhang.
- source_word: πᾶσαν τὴν αἰχμαλωσίαν
  choice: alle Gefangenen
  rationale: αἰχμαλωσία kann die Gefangenschaft, die Gefangenen oder die erbeutete Menschenmenge bezeichnen. Der weitere Zusammenhang in Vers 3 spricht hier für Personen.
- source_word: πόλιν κραταιάν
  choice: eine stark befestigte Stadt
  rationale: κραταιός bezeichnet Stärke oder Macht; bei einer feindlichen Stadt ist die befestigte Stärke gemeint.
- source_word: προσέφθημεν
  choice: kamen ... zuvor
  rationale: Bewahrt den Grundsinn des Zuvorkommens beziehungsweise früheren Eintreffens, ohne den schwer verständlichen Satz zu stark festzulegen.
- source_word: ἠλευθερώσαμεν
  choice: befreiten wir
  rationale: Gibt den klaren Befreiungssinn des griechischen Verbs direkt wieder.
theological_decisions:
- issue: Verhältnis des südlichen Krieges zum Krieg in Sichem
  choice: der mit dem Krieg in Sichem zusammenhing
  alternative: größer als der Krieg in Sichem
  rationale: Der vorgelegte griechische Text enthält kein ausdrückliches Wort für „größer“. Die knappe Genitivverbindung bleibt syntaktisch schwierig; deshalb wird der Zusammenhang vorsichtig ausgedrückt und in einer Fußnote offengelegt.
- issue: Bedeutung von αἰχμαλωσία
  choice: Gefangene
  alternative: Beute beziehungsweise Gefangenschaft
  rationale: Vers 3 spricht vom Befreien, was Personen als Bezugsgröße nahelegt. Die lexikalische Mehrdeutigkeit wird dennoch in einer Fußnote bewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Eigennamen folgen gebräuchlichen deutschen Formen (Juda, Sichem, Gad, Ruben, Levi); der im griechischen Text belegte Ortsname Areta bleibt erhalten. Die Übersetzung folgt ausschließlich dem bereitgestellten griechischen Abschnitt mit drei Versen und übernimmt nicht die zusätzlichen, in diesem Quellenausschnitt unbelegten Verse des englischen Beratungstextes.
