review_pass:
  verdict: revise
  source_fidelity: Der Entwurf folgt dem vorgelegten griechischen Abschnitt grundsätzlich in Verszählung, Handlungsfolge und Zahlenangaben und überträgt die nicht im Quellenausschnitt enthaltenen englischen Zusatzverse zu Recht nicht. Allerdings ist „der mit dem Krieg in Sichem zusammenhing“ für die äußerst knappe und unsichere Konstruktion κατὰ νότον πόλεμος τοῦ ἐν Σικίμοις eine nicht hinreichend abgesicherte Deutung. Schwerer wiegt, dass προσέφθημεν im militärischen Kontext nicht „kamen ... zuvor“ bedeutet, sondern ein Herankommen bzw. Vorgehen gegen die Stadt von Osten bezeichnet.
  naturalness: Das Deutsch ist überwiegend klar und würdig. „kamen der Stadt von Osten her zuvor“ ist jedoch idiomatisch und semantisch unpassend; „gingen ... von Osten her gegen die Stadt vor“ ist natürlich und wahrt die Bewegungsrichtung, ohne die Taktik genauer festzulegen. „stark befestigt“ ist als Beschreibung von κραταιάν zu eng.
  terminology: Die Namen Juda, Sichem, Gad, Ruben und Levi sind korrekt und gebräuchlich. „Areta“ gibt den überlieferten Namen angemessen wieder. αἰχμαλωσία kann kontextbedingt mit „Gefangene“ wiedergegeben werden; die Fußnote erhält die relevante Bedeutungsbreite. Für κραταιάν ist „mächtig/stark“ quellentreuer als „stark befestigt“.
  issues:
  - severity: medium
    issue: Die Verbindung zum Krieg in Sichem wird im Haupttext als sachlicher Zusammenhang festgelegt.
    rationale: Der vorgelegte Text bietet kein ausdrückliches Vergleichswort und die Genitivfügung ist elliptisch bzw. syntaktisch problematisch. „zusammenhing“ geht über den Befund hinaus.
  - severity: high
    issue: προσέφθημεν wird als „kamen ... zuvor“ übersetzt.
    rationale: Die Form bezeichnet hier das Vorgehen/Herankommen gegen die Stadt, nicht ein zeitliches Zuvorkommen. Dadurch wird die geschilderte militärische Bewegung verfälscht.
  - severity: low
    issue: κραταιάν wird mit „stark befestigt“ eingeengt.
    rationale: κραταιός bezeichnet zunächst Stärke oder Macht; eine Befestigung ist nicht ausdrücklich genannt.
