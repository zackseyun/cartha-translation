revisions:
- from: 'Das Testament Judas 4


    1 Danach kam es für uns im Süden zu einem Krieg, der mit dem Krieg in Sichem zusammenhing.[a] Gemeinsam mit meinen Brüdern stellte ich mich zum Kampf auf. Wir verfolgten tausend Mann und töteten zweihundert von ihnen sowie vier Könige.


