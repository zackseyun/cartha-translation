review_pass:
  verdict: revise
  source_fidelity: Eine Revision ist erforderlich. Vers 4 gibt die partizipiale Konstruktion καίγε μετανοήσας ἐπὶ τούτοις nicht korrekt mit dem konzessiven „obwohl“ wieder; gemeint ist zeitlich bzw. begründend „nachdem/als ich darüber Buße getan hatte“. In Vers 2 fügt „weil er sich ... gemacht hat“ eine reflexiv-selbstverursachende Nuance hinzu, die δουλεύσας nicht ausdrücklich trägt. Die deutsche Fassung von Vers 5 folgt dagegen im Wesentlichen der schwierigen Dreigliederung des griechischen Wortlauts und sollte diese nicht an die geglättete englische Audit-Fassung angleichen.
  naturalness: Die Sprache ist überwiegend würdevoll und gut verständlich. „Nachdem ich ... Buße getan hatte“ ist sowohl idiomatischer als auch genauer als „obwohl ich ... Buße tat“. „Wird zum Sklaven der Unzucht“ bewahrt das Bild ohne die zusätzliche reflexive Aussage. Die Überschrift „Testament des Juda“ vermeidet im heutigen Deutsch die naheliegende Verwechslung mit Judas Iskariot.
  terminology: „Unzucht“, „Königsherrschaft“, „Diadem“ und „Stütze“ sind im gegebenen paränetischen Register vertretbar. Die Sklavereimetapher bleibt ausdrücklich erhalten. Die pauschale Aussage über Frauen in Vers 5 wird ohne entschärfenden Zusatz als Aussage des Quellentextes übersetzt.
  issues:
  - severity: medium
    issue: 'Vers 4: unbegründete Konzessivverbindung'
    rationale: καίγε μετανοήσας ἐπὶ τούτοις bedeutet nicht „obwohl ich darüber Buße tat“. Das Partizip bezeichnet Judas' Umkehr als dem anschließenden Verzicht vorausgehend bzw. ihn begleitend. „Nachdem ich ... Buße getan hatte“ gibt dies klar und ohne theologische Überdeutung wieder.
  - severity: medium
    issue: 'Vers 2: reflexive Zusatznuance bei δουλεύσας'
    rationale: „Weil er sich zum Sklaven ... gemacht hat“ behauptet ausdrücklich, dass der Betroffene sich selbst dazu gemacht habe. δουλεύσας bezeichnet vielmehr das Dienen bzw. die Unterwerfung unter die Unzucht. Eine nichtreflexive Formulierung ist quellentreuer.
  - severity: low
    issue: Überschrift kann mit Judas Iskariot verwechselt werden
    rationale: Der im Werk sprechende Patriarch ist Juda/Judah. „Testament des Juda“ ist im modernen Deutsch eindeutig und wahrt die Namenszuordnung.
  - severity: low
    issue: „auch“ in Vers 5 ohne Entsprechung
    rationale: Das einleitende καί heißt hier schlicht „und“. Das ergänzende „auch“ ist nicht gravierend, aber entbehrlich.
