revisions:
- from: '**Testament Judas 15**


    1 Wer Unzucht treibt, merkt nicht, dass er entblößt wird, und schämt sich nicht, wenn er seine Ehre verliert.[a] 2 Denn selbst wenn jemand König ist und Unzucht treibt, wird er seiner Königsherrschaft entkleidet, weil er sich zum Sklaven der Unzucht gemacht hat – so, wie es auch mir erging. 3 Denn ich gab meinen Stab her, das heißt die Stütze meines Stammes, meinen Gürtel, das heißt meine Kraft, und mein Diadem, das heißt die Herrlichkeit meiner Königsherrschaft. 4 Und obwohl ich darüber Buße tat, nahm ich bis in mein hohes Alter weder Wein noch Fleisch zu mir und erlebte keinerlei Freude. 5 Der Engel Gottes zeigte mir auch, dass Frauen den König in ihre Gewalt bringen und über den Armen herrschen: Dem König nehmen sie die Herrlichkeit, dem Mann die Kraft und dem Armen selbst seine geringste Stütze.[b]'
  to: '**Testament des Juda 15**


    1 Wer Unzucht getrieben hat, merkt nicht, dass er entblößt wird, und schämt sich nicht, wenn er seine Ehre verliert. 2 Denn selbst wenn jemand König ist und Unzucht treibt, wird er seiner Königsherrschaft entkleidet, weil er zum Sklaven der Unzucht geworden ist – so, wie es auch mir erging. 3 Denn ich gab meinen Stab her, das heißt die Stütze meines Stammes, meinen Gürtel, das heißt meine Kraft, und mein Diadem, das heißt die Herrlichkeit meiner Königsherrschaft. 4 Nachdem ich darüber Buße getan hatte, nahm ich bis in mein hohes Alter weder Wein noch Fleisch zu mir und erlebte keinerlei Freude. 5 Der Engel Gottes zeigte mir, dass Frauen über den König Gewalt haben und über den Armen herrschen: Dem König nehmen sie die Herrlichkeit, dem Mann die Kraft und dem Armen selbst seine geringste Stütze.[a]'
  rationale: Die Revision berichtigt die sicher erkennbaren syntaktischen und semantischen Abweichungen in Versen 2 und 4, entfernt einen kleinen ungestützten Zusatz in Vers 5 und präzisiert die Überschrift. Die schwierige, historisch bedingte pauschale Aussage in Vers 5 sowie ihre Dreierstruktur bleiben ohne Harmonisierung erhalten. Die Fußnote wird ausschließlich an der textlich schwierigen Stelle in Vers 5 verankert; für Vers 1 ist keine Fußnote nötig.
  reviewer_model: gpt-5.6-terra
