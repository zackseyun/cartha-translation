  text: 1[a]. The man who commits sexual immorality, even while being ruined, does not perceive it; and while being dishonored, he is not ashamed. 2. For even if a man is a king and commits sexual immorality, he is stripped of his kingship, having been enslaved to sexual immorality, as I also suffered. 3[b]. I gave my staff—that is, the support of my tribe—and my belt—that is, my strength—and my diadem—that is, the glory of my kingdom. 4. And although I repented concerning these things, I ate neither meat nor drank wine until my old age, and I saw no joy at all. 5. And the angel of God showed me that women rule forever over king and beggar alike, and they take away a king's glory and a strong man's might and the poor man's very support.
translation:
  language: de
  text: '**Testament des Juda 15**


    1 Wer Unzucht getrieben hat, merkt nicht, dass er entblößt wird, und schämt sich nicht, wenn er seine Ehre verliert. 2 Denn selbst wenn jemand König ist und Unzucht treibt, wird er seiner Königsherrschaft entkleidet, weil er zum Sklaven der Unzucht geworden ist – so, wie es auch mir erging. 3 Denn ich gab meinen Stab her, das heißt die Stütze meines Stammes, meinen Gürtel, das heißt meine Kraft, und mein Diadem, das heißt die Herrlichkeit meiner Königsherrschaft. 4 Nachdem ich darüber Buße getan hatte, nahm ich bis in mein hohes Alter weder Wein noch Fleisch zu mir und erlebte keinerlei Freude. 5 Der Engel Gottes zeigte mir, dass Frauen über den König Gewalt haben und über den Armen herrschen: Dem König nehmen sie die Herrlichkeit, dem Mann die Kraft und dem Armen selbst seine geringste Stütze.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Wortlaut des letzten Satzteils ist sprachlich schwierig. Er nennt nacheinander die Herrlichkeit des Königs, die Kraft des Mannes und die geringste Stütze des Armen; andere Textfassungen glätten diese Reihe unterschiedlich.
    reason: textual_variant
lexical_decisions:
- source_word: πορνεύσας / πορνεύῃ / πορνείᾳ
  choice: Unzucht treiben / Unzucht
  rationale: Die Wortfamilie bezeichnet hier verurteiltes sexuelles Fehlverhalten. „Unzucht“ erhält den moralischen Ernst und ermöglicht die Wiederholung des griechischen Leitworts, ohne den Sinn unnötig auf eine einzelne Handlung einzuengen.
- source_word: γυμνούμενος
  choice: entblößt wird
  rationale: Das griechische Wort bezeichnet wörtlich ein Entkleidet- oder Entblößtwerden. Diese Bildsprache wird beibehalten und nimmt das Entkleiden von der Königsherrschaft in Vers 2 vorweg.
- source_word: ἀδοξῶν
  choice: seine Ehre verliert
  rationale: Die partizipiale Form beschreibt einen Verlust an Ansehen beziehungsweise Herrlichkeit. Die deutsche Wendung ist verständlich und hält die Verbindung zu δόξα in den folgenden Versen aufrecht.
- source_word: γυμνοῦται τῆς βασιλείας
  choice: wird seiner Königsherrschaft entkleidet
  rationale: Die ungewöhnliche, anschauliche Metapher des griechischen Textes bleibt erhalten. „Königsherrschaft“ bezeichnet hier eher königliche Würde und Stellung als das beherrschte Gebiet.
- source_word: δουλεύσας τῇ πορνείᾳ
  choice: weil er sich zum Sklaven der Unzucht gemacht hat
  rationale: Die Versklavungsmetapher wird ausdrücklich bewahrt. Das Partizip bezeichnet die Unterwerfung unter die Unzucht und begründet den Verlust der Königsherrschaft.
- source_word: ῥάβδος / στήριγμα
  choice: Stab / Stütze
  rationale: „Stab“ wahrt sowohl den konkreten Gegenstand als auch sein unmittelbar erläutertes Sinnbild einer tragenden Stütze.
- source_word: ζώνη
  choice: Gürtel
  rationale: Der moderne, konkrete Ausdruck lässt die nachfolgende symbolische Deutung als Kraft klar hervortreten.
- source_word: διάδημα
  choice: Diadem
  rationale: Das spezifisch königliche Stirnband wird genauer wiedergegeben als mit dem allgemeineren Wort „Krone“.
- source_word: μετανοήσας
  choice: Buße tat
  rationale: Im Zusammenhang mit Judas Reaktion auf seine Verfehlung und seiner dauerhaften Entsagung hat das Partizip hier eine deutlich reue- und umkehrbezogene Bedeutung.
- source_word: οἶνον καὶ κρέα οὐκ ἔφαγον
  choice: nahm weder Wein noch Fleisch zu mir
  rationale: Das griechische Verb „essen“ steht gemeinsam bei Wein und Fleisch. Die übergeordnete deutsche Wendung gibt beide Objekte idiomatisch wieder, ohne den Wein zum Essen zu machen.
- source_word: κρατοῦσι / κατακυριεύουσιν
  choice: in ihre Gewalt bringen / herrschen über
  rationale: Die zwei unterschiedlichen griechischen Herrschaftsverben bleiben in ihrer Steigerung erkennbar und werden nicht zu einer einzigen Aussage eingeebnet.
theological_decisions:
- issue: Bedeutung von μετανοήσας in Judas Selbstbeschreibung
  choice: Buße tat
  alternative: seine Haltung änderte / umdachte
  rationale: Die anschließende langjährige Enthaltsamkeit kennzeichnet hier nicht nur einen gedanklichen Wechsel, sondern eine reuevolle Abkehr. Die Wiedergabe soll dennoch keine konfessionell bestimmte Bußlehre eintragen.
- issue: Versklavung durch sexuelle Verfehlung
  choice: sich zum Sklaven der Unzucht gemacht hat
  alternative: der Unzucht verfallen war
  rationale: Die ausdrückliche Sklavereimetapher des Ausgangstextes ist für die moralische und theologische Spannung des Abschnitts wesentlich und wird deshalb nicht abgeschwächt.
- issue: Verallgemeinernde Aussage über Frauen in Vers 5
  choice: Die harte, pauschale Aussage wird als Judas empfangene Warnung übersetzt
  alternative: Die Aussage durch Zusätze auf verführerische oder bestimmte Frauen begrenzen
  rationale: Der griechische Text sagt allgemein „die Frauen“. Eine ethisch oder theologisch motivierte Einschränkung wäre ein nicht belegter Zusatz; die historische Stimme des Textes bleibt sichtbar.
- issue: Soziale Dreiergruppe in Vers 5
  choice: König, Mann und Armer werden als drei Bezugspunkte wiedergegeben
  alternative: König und Bettler als bloßes Gegensatzpaar zusammenfassen
  rationale: Der vorliegende griechische Wortlaut unterscheidet in der Verlustliste ausdrücklich den König, den Mann und den Armen. Diese schwierige Struktur wird nicht nach der geglätteten englischen Konsultationsfassung harmonisiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener Bildsprache. Die Wiederholungen von „Unzucht“, die Entkleidungsmetapher und die harte Aussage von Vers 5 wurden nicht beschönigt. Wo der griechische Satzbau unidiomatisch oder textlich schwierig ist, wurde maßvoll geglättet und die Unsicherheit in einer Fußnote kenntlich gemacht.
