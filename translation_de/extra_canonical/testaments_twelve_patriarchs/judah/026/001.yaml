revisions:
- from: Bewahrt also, meine Kinder, das ganze Gesetz des Herrn; denn es ist Hoffnung für die, die seine Wege gerade gehen.[a]
  to: Haltet daher, meine Kinder, das ganze Gesetz des Herrn; denn es ist Hoffnung für diejenigen, die seine Wege gerade ausrichten.[a]
  rationale: Die Revision ersetzt die für ein Gesetz im Deutschen ungenauere Formulierung „Bewahrt“ durch „Haltet“ und gibt die transitive Wortverbindung κατευθύνουσι ... τὰς ὁδοὺς αὐτοῦ in der Hauptfassung näher wieder. Die alternative Deutung wird weiterhin ausdrücklich in einer korrekt verankerten Fußnote dokumentiert. Zusätze wie „in Gerechtigkeit“ werden nicht übernommen.
  reviewer_model: gpt-5.6-terra
