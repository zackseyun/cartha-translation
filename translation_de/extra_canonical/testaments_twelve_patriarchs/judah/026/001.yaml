  text: Therefore keep, my children, the whole law of the Lord, for it is hope for all who keep his ways in righteousness.
translation:
  language: de
  text: Haltet daher, meine Kinder, das ganze Gesetz des Herrn; denn es ist Hoffnung für diejenigen, die seine Wege gerade ausrichten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die seine Wege gerade gehen“. Das griechische κατευθύνω mit „Wege“ kann das Geraderichten beziehungsweise Ausrichten der Wege bezeichnen; im übertragenen Sinn ist auch das rechte Beschreiten der Wege möglich.'
    reason: Die Fußnote bewahrt die echte semantische Spannung des griechischen Ausdrucks, während die Hauptfassung dessen transitive Konstruktion abbildet.
lexical_decisions:
- source_word: Φυλάξατε
  choice: Bewahrt
  rationale: Der Imperativ bezeichnet das achtsame Hüten und Befolgen; „bewahrt“ erhält dieses Bild und klingt würdig und natürlich.
- source_word: πάντα τὸν νόμον Κυρίου
  choice: das ganze Gesetz des Herrn
  rationale: „πάντα“ bezieht sich auf das Gesetz in seiner Gesamtheit; die traditionelle und verständliche Wiedergabe lautet „das ganze Gesetz“.
- source_word: ἐλπὶς
  choice: Hoffnung
  rationale: Direkte Wiedergabe des griechischen Substantivs, ohne die ungewöhnliche Aussage theologisch umzudeuten.
- source_word: τοῖς κατευθύνουσι τὰς ὁδοὺς αὐτοῦ
  choice: für die, die seine Wege gerade gehen
  rationale: κατευθύνω enthält den Gedanken des Geradeausrichtens beziehungsweise geraden Beschreitens. Die Formulierung bewahrt das Wegbild und die aktive Bedeutung.
theological_decisions:
- issue: Das Gesetz des Herrn als „Hoffnung“
  choice: Die Gleichsetzung wird unmittelbar beibehalten.
  alternative: „Es gibt Hoffnung für …“ oder „es schenkt Hoffnung“
  rationale: Der griechische Wortlaut sagt ausdrücklich, dass es Hoffnung ist; eine glättende Umschreibung würde die theologische Spannung abschwächen.
- issue: Bedeutung von κατευθύνουσι im Zusammenhang mit Gottes Wegen
  choice: „seine Wege gerade gehen“
  alternative: „seine Wege in Gerechtigkeit bewahren“
  rationale: „In Gerechtigkeit“ steht nicht ausdrücklich im erhaltenen griechischen Wortlaut. Die gewählte Fassung vermeidet diesen Zusatz und erhält zugleich die mögliche Bedeutung des Geraderichtens beziehungsweise rechten Beschreitens.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Ton. Die Anrede „meine Kinder“ und das Wegbild bleiben erhalten; nicht ausdrücklich im Griechischen vorhandene Zusätze wie „in Gerechtigkeit“ wurden vermieden.
