translation:
  language: de
  text: Niemand soll mich in einem kostbaren Gewand bestatten; bringt mich vielmehr nach Hebron hinauf, wo auch meine Väter sind.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνταφιάσει
  choice: bestatten
  rationale: Das Verb bezeichnet hier die Bestattung; „bestatten“ ist natürlich, würdig und schließt den unmittelbaren Zusammenhang mit der Grablegung ein.
- source_word: ἐν πολυτελεῖ ἐσθῆτι
  choice: in einem kostbaren Gewand
  rationale: πολυτελής bezeichnet etwas Kostbares oder Aufwendiges, ἐσθής ein Kleid beziehungsweise Gewand. Die Formulierung bewahrt den konkreten Bezug zur Bestattungskleidung.
- source_word: ἀναγάγετε
  choice: bringt … hinauf
  rationale: Die räumliche Richtung des Verbs wird erhalten. Im Kontext bedeutet es, den Leichnam zur Bestattung nach Hebron zu überführen.
- source_word: οἱ πατέρες μου
  choice: meine Väter
  rationale: Die wörtliche und traditionsnahe Wiedergabe lässt offen, ob besonders die Vorfahren beziehungsweise Patriarchen oder die unmittelbaren Ahnen gemeint sind.
theological_decisions:
- issue: Ort bei den Vätern
  choice: „wo auch meine Väter sind“
  alternative: „wo auch meine Vorfahren begraben sind“
  rationale: Das griechische Original nennt weder ausdrücklich ein Grab noch das Begrabensein. Die knappere Wiedergabe bewahrt diese Ellipse und vermeidet eine erklärende Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der vorgelegte griechische Text weicht deutlich von der englischen Konsultationsfassung ab; der Entwurf folgt daher vorrangig dem griechischen Quellenwortlaut. Die griechischen hochgestellten Ziffern wurden als editorische Apparatszeichen, nicht als inhaltliche Fußnotenmarker behandelt.
