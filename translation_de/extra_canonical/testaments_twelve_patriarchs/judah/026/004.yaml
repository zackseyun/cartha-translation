translation:
  language: de
  text: 'Und er sagte zu ihnen: »Seht, ich bin hundertachtzehn Jahre alt und sterbe heute.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ εἶπεν αὐτοῖς
  choice: Und er sagte zu ihnen
  rationale: Gibt die Erzählfortsetzung mit καί und den pluralischen Adressaten von αὐτοῖς direkt wieder.
- source_word: Ἰδοὺ
  choice: Seht
  rationale: Die pluralische deutsche Aufforderung entspricht der Anrede mehrerer Personen und klingt natürlicher als das singularische »Siehe«.
- source_word: ἑκατὸν δέκα καὶ ὀκτὼ ἐτῶν
  choice: hundertachtzehn Jahre alt
  rationale: Überträgt die griechische Altersangabe idiomatisch und vollständig ins Deutsche.
- source_word: ἀποθνῄσκω σήμερον
  choice: sterbe heute
  rationale: Bewahrt Präsens, erste Person und die Zeitangabe des griechischen Wortlauts.
theological_decisions:
- issue: Abweichung zwischen griechischem Quellenwortlaut und englischer Konsultationsfassung
  choice: Übersetzung des bereitgestellten griechischen Wortlauts
  alternative: Übernahme der englischen Aussage über das Gesetz des Herrn und die Hoffnung
  rationale: Die englische Fassung entspricht dem angegebenen griechischen Text nicht. Gemäß Quellenpriorität wurde der griechische Wortlaut übersetzt, ohne sachfremdes Material einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das einleitende »Und« wahrt den fortlaufenden Erzählstil. Die hochgestellten Ziffern der Edition sind offenbar textkritische Verweiszeichen; da die zugehörigen Apparate nicht bereitgestellt wurden, wurden daraus keine unbelegten Fußnoten erstellt. Wegen des Hinweises, dass das griechische Fragment noch nicht versgenau ausgerichtet ist, sollte die Zuordnung zu Testament Juda 26,4 redaktionell geprüft werden.
