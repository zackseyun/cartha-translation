base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/026/003.yaml
  text: And he fell asleep in a good old age. And his sons did as he had commanded them, and they carried him up to Hebron and buried him there with his fathers.
translation:
  language: de
  text: Und nachdem er dies gesagt hatte, entschlief er. Seine Söhne befolgten alles, was er ihnen geboten hatte, und begruben ihn bei seinen Vätern in Hebron.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκοιμήθη
  choice: entschlief
  rationale: Bewahrt das griechische Bild des Einschlafens als ehrwürdige Umschreibung für den Tod, ohne die im Englischen ergänzte Wendung „in hohem Alter“ einzuführen.
- source_word: κατὰ πάντα ὅσα ἐνετείλατο αὐτοῖς
  choice: taten alles, was er ihnen geboten hatte
  rationale: Gibt Umfang und Verbindlichkeit des väterlichen Auftrags natürlich und vollständig wieder.
- source_word: ἔθαψαν αὐτὸν μετὰ τῶν πατέρων αὐτοῦ ἐν Χεβρών
  choice: begruben ihn bei seinen Vätern in Hebron
  rationale: Folgt der vorliegenden griechischen Wortfolge und vermeidet die nicht ausdrücklich belegte Ergänzung, dass sie ihn nach Hebron hinaufbrachten.
theological_decisions:
- issue: „Entschlafen“ als Bezeichnung des Todes
  choice: Die metaphorische Ausdrucksweise wird beibehalten.
  alternative: „starb“
  rationale: Das griechische ἐκοιμήθη verwendet bewusst das Schlafbild; die Übersetzung lässt dessen mögliche theologische Resonanz bestehen, ohne sie auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Klang. Der Entwurf folgt vorrangig dem angegebenen griechischen Text; Zusätze der englischen Konsultationsfassung („in hohem Alter“, „sie brachten ihn hinauf“, „dort“) wurden nicht übernommen, da sie in diesem griechischen Wortlaut fehlen.
