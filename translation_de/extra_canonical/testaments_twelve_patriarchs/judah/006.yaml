lexical_decisions:
- source_word: ὕδασι Χωζηβά
  choice: bei den Gewässern von Chozeba
  rationale: Der Plural ὕδασι bezeichnet einen durch Wasser geprägten Ort; »Gewässer« bewahrt sowohl den Plural als auch den gehobenen Erzählton. Der Ortsname wird nach der griechischen Form transliteriert.
- source_word: ἐφ᾽ ἡμᾶς εἰς πόλεμον
  choice: zogen ... gegen uns in den Kampf
  rationale: Die Formulierung erhält sowohl die feindliche Bewegung gegen die Sprecher als auch den ausdrücklich kriegerischen Zweck und klingt dabei im Deutschen natürlich.
- source_word: συνάψαντες ἐτρέψαμεν αὐτούς
  choice: Wir stellten uns ihnen zum Kampf und schlugen sie in die Flucht
  rationale: συνάπτω bezeichnet im militärischen Zusammenhang das Aufnehmen des Kampfes; τρέπω bedeutet hier, den Gegner zur Flucht zu wenden oder zu schlagen.
- source_word: διέξοδον τοῦ εἰσελθεῖν πρὸς ἡμᾶς
  choice: keinen Durchgang, um zu uns vorzudringen
  rationale: 'Der Genitiv des substantivierten Infinitivs bezeichnet nach dem vorhandenen Wortlaut den Zweck des Durchgangs: zu den Sprechern zu gelangen. »Fluchtweg« wäre im Kontext möglich, entspricht aber dem anschließenden εἰσελθεῖν πρὸς ἡμᾶς nicht unmittelbar und wird deshalb nur in der Fußnote als Alternative genannt.'
- source_word: ἐν κραταιᾷ μαχαίρᾳ
  choice: mit mächtigem Schwert
  rationale: Die konkrete Waffenmetapher des griechischen Textes bleibt erhalten; »mächtig« gibt κραταιός wieder, ohne die Wendung rationalisierend in eine bloße Aussage über Kampfkraft aufzulösen.
- source_word: περιγινόμεθα αὐτῶν
  choice: überwältigten wir sie
  rationale: Die Wendung bezeichnet das Gewinnen der Oberhand. »Überwältigen« ist im militärischen Zusammenhang klar und bewahrt den dynamischen Verlauf.
- source_word: ἐκύλιον λίθους ἐφ᾽ ἡμᾶς
  choice: ließen ... Steine auf uns herabrollen
  rationale: Das Rollen geschieht vom Berggipfel aus; »herabrollen« macht die im Kontext ausdrücklich angegebene Bewegungsrichtung im Deutschen natürlich sichtbar.
- source_word: ἐπελαβόμεθα τοῦ ὑψηλοῦ
  choice: nahmen wir die Höhe ein
  rationale: ἐπιλαμβάνομαι mit Genitiv bedeutet hier, sich der Anhöhe zu bemächtigen. »Die Höhe einnehmen« ist die passende moderne militärische Wendung.
- source_word: ἐξωλοθρεύσαμεν
  choice: vernichteten ... vollständig
  rationale: Die starke Aussage des Verbs wird nicht abgeschwächt. »Vollständig vernichten« gibt den intensivierenden Charakter der Form wieder, ohne archaische Sprache zu verwenden.
theological_decisions:
- issue: Darstellung der vollständigen Vernichtung einer Stadt
  choice: Die Gewaltaussage wird direkt als berichtete Handlung Judas wiedergegeben.
  alternative: Die Aussage abschwächen oder moralisch kommentieren.
  rationale: Der Text erzählt die Vernichtung ohne ausdrückliche theologische Bewertung. Die Übersetzung darf weder die Gewalt verharmlosen noch dem Bericht eine im Ausgangstext nicht formulierte Billigung oder Verurteilung hinzufügen.
- issue: Unklare Personenkonstellation in Vers 5
  choice: Die grammatische Lücke wird als »einen Mann« sichtbar gemacht und in einer Fußnote erläutert.
  alternative: Eine bestimmte Person aus anderen Textzeugen einsetzen oder »Simeon und die anderen« schreiben.
  rationale: Der vorgelegte griechische Zeuge nennt vor Simeon keine identifizierbare Person. Eine namentliche Ergänzung oder die Mehrzahl »die anderen« würde die Unsicherheit zugunsten einer Rekonstruktion auflösen.
- issue: Subjekt des Hinaufsteigens in Vers 3
  choice: »bevor sie den Aufstieg hinaufsteigen konnten« bezieht den Infinitiv auf die Gegner.
  alternative: Den Infinitiv auf Judas und seine Begleiter beziehen oder das Subjekt offenlassen.
  rationale: Die Gegner sind das unmittelbar vorausgehende Objekt des Überwältigens und Tötens; der militärische Zusammenhang legt nahe, dass sie am Erreichen der Höhe gehindert wurden. Da der griechische Infinitiv selbst kein ausdrückliches Subjekt nennt, wird diese kontextuelle Entscheidung nicht über die nötige Klarheit hinaus ausgebaut.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Militärische Vorgänge werden klar und direkt benannt, ohne archaische Ausdrücke wie »erschlagen« oder konfessionell geprägte Deutungen. Textstörungen und echte Mehrdeutigkeiten werden nicht harmonisiert, sondern knapp in Fußnoten offengelegt.
