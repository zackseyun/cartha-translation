  verdict: revise
  source_fidelity: 'Die Übersetzung folgt dem griechischen Zeugen insgesamt eng: Ortsnamen, die militärische Abfolge, die problematische Konstruktion in V. 3 und die Dittographie in V. 4 werden angemessen behandelt. In V. 5 ist jedoch »einen Mann« keine hinreichend neutrale Wiedergabe des verderbten τὸν τε καὶ Συμεών: Der bestimmte Artikel setzt im Griechischen offenbar ein ausgefallenes Substantiv bzw. einen Namen voraus. Die deutsche Ergänzung mit einem indefiniten »Mann« erzeugt eine nicht bezeugte Personenangabe.'
  naturalness: Das Deutsch ist überwiegend modernes, gut verständliches Standarddeutsch. »bevor sie den Aufstieg hinaufsteigen konnten« ist verständlich, aber stilistisch unnötig doppelt; »bevor sie den Aufstieg erklimmen konnten« ist idiomatischer und bewahrt die Aussage. In V. 5 ist »im Hintergrund« gegenüber ἐξωπίσθεν zu unbestimmt; »hinter ihnen« erhält die räumliche, zugleich im Bezug unklare Angabe.
  terminology: Die Namensformen Chozeba, Jobel, Schilom, Machir und Simeon sind konsequent transliteriert. »die Höhe einnehmen« und »vollständig vernichten« treffen die militärische und intensive Sprache des griechischen Textes. Es sind keine konfessionell oder doktrinär geprägten Begriffe problematisch.
  issues:
