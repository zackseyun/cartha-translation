    issue: V. 5 ergänzt »einen Mann«.
    rationale: τὸν τε καὶ Συμεών enthält einen bestimmten Artikel, aber das erwartete Bezugswort fehlt bzw. ist verderbt. »Einen Mann« macht daraus eine bestimmte, jedoch im griechischen Text nicht vorhandene Information. Eine markierte Lücke bewahrt den Befund besser.
  - severity: low
    issue: V. 5 gibt ἐξωπίσθεν als »im Hintergrund« wieder.
    rationale: Das Wort bezeichnet eher eine Lage ‚hinter ihnen‘. Die konkrete, aber referenziell offene räumliche Angabe sollte nicht verallgemeinert werden.
  - severity: low
    issue: 'V. 3: »den Aufstieg hinaufsteigen« ist stilistisch redundant.'
    rationale: Das griechische ἀναβῆναι τὴν ἀνάβασιν ist zwar nachdrücklich, verlangt im modernen Deutschen aber keine doppelte Verbalisierung. »den Aufstieg erklimmen« gibt den Sinn natürlich wieder.
