  text: 1. And when I was at the waters of Chozeba[a], those from Jobel came against us for battle. 2. And joining battle, we put them to flight; and we killed those from Shilom, their allies, and gave them no way of escape. 3. But those from Machir attacked us again on the fifth day; and charging at them with a mighty sword[b], we prevailed over them and killed them before they could scale the ascent. 4. And as we came to the city, their women were rolling stones down on us from the summit of the mountain on which the city stood[c]. 5. And having hidden Simeon and the others behind them, we seized the height, and utterly destroyed this city also.
translation:
  language: de
  text: '1 Als ich mich bei den Gewässern von Chozeba[a] aufhielt, zogen die Leute aus Jobel gegen uns in den Kampf. 2 Wir stellten uns ihnen zum Kampf und schlugen sie in die Flucht. Auch die Leute aus Schilom, ihre Verbündeten, töteten wir; wir ließen ihnen keinen Durchgang, um zu uns vorzudringen.[b] 3 Am fünften Tag griffen uns die Leute aus Machir erneut an. Als wir mit einem mächtigen Schwert gegen sie vorstießen,[c] überwältigten wir sie und töteten sie, bevor sie den Aufstieg erklimmen konnten. 4 Als wir uns der Stadt näherten, ließen ihre Frauen vom Gipfel des Berges, auf dem die Stadt lag, Steine auf uns herabrollen.[d] 5 Nachdem ich den [nicht überlieferten Namen] und Simeon hinter ihnen verborgen hatte,[e] nahmen wir die Höhe ein und vernichteten auch diese Stadt vollständig.


    [a] Die Ortsnamen »Chozeba«, »Jobel« und »Schilom« geben die griechischen Namensformen wieder. Welche Orte damit gemeint sind, ist unsicher.


    [b] Wörtlich steht hier: »keinen Durchgang, um zu uns hineinzugelangen«. Der überlieferte Wortlaut spricht von einem Zugang zu den Sprechern; im Zusammenhang ist die genaue Situation jedoch nicht ganz klar. Manche Übersetzungen verstehen die Wendung als »keinen Fluchtweg«.


    [c] Der griechische Wortlaut ist an dieser Stelle grammatisch gestört: Das Verb προσδίδωσι steht im Präsens der dritten Person Singular und passt nicht ohne Weiteres zur Erzählung in der ersten Person Plural. Die Übersetzung gibt den erkennbaren Sinn eines militärischen Vorgehens wieder, ohne den griechischen Text stillschweigend zu berichtigen.


    [d] Im griechischen Text steht vor »Stadt« der Artikel versehentlich zweimal. Die Übersetzung gibt ihn nur einmal wieder.


    [e] Der griechische Wortlaut ist hier unvollständig oder verderbt. Vor »und Simeon« steht ein bestimmter männlicher Artikel, dessen Bezugswort fehlt. Die eckige Klammer macht die Lücke sichtbar; wer oder was gemeint ist, bleibt offen. Auch der Bezug von »hinter ihnen« ist im überlieferten Text nicht eindeutig.'
