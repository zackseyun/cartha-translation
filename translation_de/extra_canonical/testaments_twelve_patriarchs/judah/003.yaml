  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003.yaml
  text: '1[a]. And when the two kings of the Canaanites came in armor against our flocks, with many people with them, I alone ran at one of the kings; and striking him on the shins, I dragged him down and so killed him.


    2. And the other king, Taphou, while he was sitting on his horse, I killed; and so I scattered all his people[b].


    3. And I found Achor, a giant of a man, shooting arrows. Leaping up, I took a stone of sixty litras and hurled it; I struck the horse and killed him.


    4. And after fighting with Achor for two hours, I killed him; and when I had cut his shield into two pieces, I hacked through his feet.


    5. And while I was stripping off his breastplate, behold, eight men, his companions, began to fight me.


    6. But I wrapped my garment around my arm and slung stones at them; four of them I killed[c], and the others fled.'
translation:
  language: de
  text: '**Testament Judas 3**


    **1** Als die beiden Könige der Kanaaniter in Rüstung mit einem großen Heer gegen unsere Herden zogen,[a] lief ich allein auf den einen König zu und zerschmetterte seine Knochen.


    **2** Den anderen König, Tafou, tötete ich, während er auf seinem Pferd saß. So zerstreute ich sein ganzes Heer.


    **3** Dann stieß ich auf Achor, einen riesenhaften König, der auf einem Pferd saß und Pfeile nach vorn und nach hinten schoss. Ich hob einen Stein von sechzig Litren[b] auf, schleuderte ihn gegen das Pferd und tötete es.


    **4** Zwei Stunden lang kämpfte ich mit Achor; dann tötete ich ihn. Ich spaltete seinen Schild in zwei Teile und hieb ihm die Füße ab.


    **5** Während ich ihm den Brustpanzer auszog, begannen auf einmal acht Männer aus seinem Gefolge gegen mich zu kämpfen.


    **6** Ich wickelte mein Gewand um meinen Arm und schleuderte Steine auf sie. Vier von ihnen tötete ich, die übrigen flohen.


    **7** Mein Vater Jakob tötete Belisath, den König aller Könige, einen Mann von gewaltiger Stärke, zwölf Ellen groß.[c]


    **8** Da befiel sie Schrecken, und sie hörten auf, gegen uns zu kämpfen.


    **9** Deshalb war mein Vater in den Kämpfen unbesorgt, wenn ich mit meinen Brüdern bei ihm war.


    **10** Denn er hatte in einer Vision über mich gesehen, dass mich ein Engel der Macht in allem begleitete, damit ich nicht besiegt würde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Überlieferung dieses Kapitels ist stellenweise ungeordnet. Einige Textzeugen bieten andere Namen der Gegner, darunter Formen wie Chora oder Nachor, und wiederholen oder verschieben Teile des Kampfberichts.
    reason: textual_variant
  - marker: b
    text: Die Litra war eine antike Gewichtseinheit. Der Text hebt vor allem das außergewöhnliche Gewicht des Steins hervor; deshalb wird keine unsichere Umrechnung in eine moderne Maßeinheit geboten.
    reason: cultural_note
  - marker: c
    text: 'Der griechische Wortlaut ist knapp und ungewöhnlich: wörtlich etwa „einen riesenhaften Mann an Stärke, zwölf Ellen“. Die Übersetzung versteht die zwölf Ellen als Angabe seiner Körpergröße. Eine Elle entsprach ungefähr der Länge eines Unterarms, war aber regional unterschiedlich.'
    reason: translation_note
lexical_decisions:
- source_word: τεθωρακισμένοι
  choice: in Rüstung
  rationale: Das Partizip bezeichnet militärische Ausrüstung oder Panzerung; „in Rüstung“ ist natürlich und lässt den genauen Umfang der Bewaffnung offen.
- source_word: ποίμνια
  choice: Herden
  rationale: Der Ausdruck bezeichnet das unter Hirtenaufsicht stehende Vieh, ohne hier eine Tierart eindeutig festzulegen.
- source_word: κατεσπάραξα τὰ ὀστᾶ αὐτοῦ
  choice: zerschmetterte seine Knochen
  rationale: Der vorliegende griechische Text spricht ausdrücklich von den Knochen und verwendet ein gewaltsames Verb. Die Übersetzung folgt ihm statt der abweichenden, glatteren Kampffassung der englischen Konsultationsschicht.
- source_word: ἀνεῖλον
  choice: tötete ich
  rationale: Das Verb bezeichnet im erzählenden Zusammenhang das Töten oder Niederstrecken; „töten“ ist klar, modern und nicht unnötig archaisch.
- source_word: διεσκόρπισα
  choice: zerstreute ich
  rationale: Die Bildlichkeit des griechischen Verbs wird unmittelbar bewahrt, ohne den militärischen Ausgang stärker als „in die Flucht schlagen“ auszudeuten.
- source_word: γίγαντα
  choice: riesenhaft
  rationale: Die Wiedergabe bewahrt die außergewöhnliche Größe und den heroischen Erzählton, ohne zwingend eine besondere übermenschliche Gattung festzulegen.
- source_word: λίθον ἑξήκοντα λιτρῶν
  choice: einen Stein von sechzig Litren
  rationale: Die antike Gewichtseinheit wird transliteriert, weil eine moderne Umrechnung Scheingenauigkeit erzeugen würde.
- source_word: δέδωκα τῷ ἵππῳ
  choice: schleuderte ihn gegen das Pferd
  rationale: Wörtlich steht eine ungewöhnliche Wendung mit „geben“. Im Kampfzusammenhang bezeichnet sie, dass der Stein das Pferd trifft; die dynamische Wiedergabe macht die Handlung verständlich.
- source_word: ἐνελύθην ... τὴν στολήν μου ἐπὶ τὴν χεῖρά μου
  choice: wickelte mein Gewand um meinen Arm
  rationale: Die Handlung dient offenbar dem Schutz des Arms; „Arm“ ist im Deutschen in diesem Zusammenhang natürlicher als das enger mögliche „Hand“.
- source_word: ἄγγελος δυνάμεως
  choice: Engel der Macht
  rationale: Die formale Genitivverbindung bleibt erhalten. „Macht“ lässt offen, ob die Macht den Engel kennzeichnet oder ihm zugeordnet ist.
theological_decisions:
- issue: Textliche Unordnung bei den Gegnernamen und der Abfolge der Kämpfe in V. 1–4
  choice: Der Haupttext folgt der gelieferten griechischen α-Fassung mit Tafua und Achor und glättet die doppelte Achor-Szene nur so weit, wie der unmittelbare Handlungsablauf es verlangt.
  alternative: Andere Zeugen bieten Namen wie Chora oder Nachor und ordnen beziehungsweise wiederholen Teile des Kampfberichts anders.
  rationale: Die Überlieferungsunsicherheit wird nicht durch eine harmonisierte Mischfassung verdeckt, sondern in einer Fußnote offengelegt.
- issue: Bezugswort von αὐτόν am Ende von V. 3
  choice: 'Das Pronomen wird auf das Pferd bezogen: „tötete es“.'
  alternative: 'Grammatisch kann das maskuline Pronomen auch auf Achor bezogen werden: „tötete ihn“.'
  rationale: V. 4 berichtet anschließend ausdrücklich von einem zweistündigen Kampf mit Achor und erst dann von seinem Tod. Der unmittelbare Erzählzusammenhang spricht daher trotz des grammatisch möglichen anderen Bezugs für das Pferd.
- issue: Der „Engel der Macht“ und Judas Unbesiegbarkeit in V. 10
  choice: Die finale Aussage wird als „damit ich nicht besiegt würde“ wiedergegeben.
  alternative: 'Möglich wäre eine stärker resultative Fassung: „sodass ich nicht besiegt wurde“.'
  rationale: Die griechische Konstruktion τοῦ μή mit Infinitiv bezeichnet hier am ehesten Zweck oder beabsichtigte Folge. Die Übersetzung lässt die Spannung zwischen göttlichem Beistand und Judas kriegerischer Selbstschilderung bestehen.
translation_notes:
  register: Moderne, würdevolle Erzählsprache mit bewusst knappen, kraftvollen Kampfsätzen. Eigennamen werden deutsch lesbar transliteriert. Archaismen wie „erschlug“ oder „Recken“ werden vermieden. Die drastische Gewalt des Ausgangstextes wird weder abgeschwächt noch zusätzlich ausgeschmückt.
