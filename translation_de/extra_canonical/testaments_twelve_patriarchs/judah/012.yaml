  - severity: medium
    issue: V. 5 und V. 6 fügen mit „töten lassen“ ein nicht vorhandenes Kausativ hinzu.
    rationale: ἀνελεῖν bedeutet hier „töten“. Der griechische Text nennt weder eine Vollstreckung durch Dritte noch eine Veranlassung dazu.
  - severity: low
    issue: Die Ortsformulierung in V. 1 ist syntaktisch etwas holprig.
    rationale: „In der Stadt Enan, beim Tor“ gibt ἐν Ἐνὰν τῇ πόλει πρὸς τὴν πύλην klar und natürlich wieder, ohne eine Herberge einzutragen.
