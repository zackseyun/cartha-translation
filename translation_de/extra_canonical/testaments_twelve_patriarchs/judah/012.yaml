  text: 1[a]. After this, when Tamar had been a widow for two years and heard that I was going up to shear the sheep, she adorned herself with bridal adornment and sat in Enaim, at the city gate of the inn. 2. For it was a law of the Amorites that a widow should sit there openly for prostitution. 3. So when I was drunk with wine, I did not recognize her, and she deceived me by her beauty through the appearance of her adornment. 4[b]. And turning aside to her I said, “I will come in to you.” And she said, “What will you give me?” And I gave her my staff and my ring and the diadem of my kingdom as a pledge. And when I had gone in to her, she conceived. 5. But I, not knowing what I had done, wanted to kill her. Yet she sent the pledges secretly and put me to shame. 6. And when I called her, I heard also the secret words that, while sleeping with her in my drunkenness, I had spoken. And I was not able to kill her, because it was from the Lord. 7. For I said, “Perhaps she did this deceitfully,
    having received the pledge from another.” 8. But I did not approach her again for the rest of my life, because I had done this abomination in all Israel. 9. Yet those in the city said that there had been no harlot sitting at the gate, because she had come from another place and sat for a short time at the gate. 10. And I supposed that no one knew that I had gone in to her. 11. And after this we came into Egypt to Joseph because of the famine. 12. Now I was forty-six years old[d][c], and I spent seventy-three years in Egypt.
translation:
  language: de
  text: '**Testament Judas 12**


    **1** Danach, als Tamar seit zwei Jahren Witwe war, hörte sie, dass ich hinaufzog, um die Schafe zu scheren. Da schmückte sie sich mit bräutlichem Schmuck und setzte sich in der Stadt Enan beim Tor.[a] **2** Denn bei den Amoritern galt das Gesetz, dass eine Witwe sieben Tage lang am Tor sitzen sollte. **3** Ich aber war vom Wein betrunken und erkannte sie nicht, und sie täuschte mich durch ihre Schönheit, durch die Erscheinung ihres Schmucks. **4** Ich wandte mich ihr zu und sagte: »Ich will zu dir eingehen.« Sie fragte: »Was wirst du mir geben?« Da gab ich ihr meinen Stab und mein Diadem als Pfand.[b] Und als ich mit ihr verkehrt hatte, wurde sie schwanger. **5** Weil ich nicht wusste, was ich getan hatte, wollte ich sie töten. Sie aber schickte mir heimlich die Pfänder und beschämte mich. **6** Da rief ich sie und hörte auch die vertraulichen Worte, die ich im Rausch ausgesprochen hatte, als ich bei ihr schlief.[c] Und ich konnte sie nicht töten, weil es vom Herrn war.[d] **7** Denn
    ich sagte: »Vielleicht hat sie arglistig gehandelt, die Pfänder von jemand anderem erhalten und mir gegenüber die früheren Worte gebraucht.« **8** Doch ich näherte mich ihr mein Leben lang nicht wieder. **9** Auch die Leute in der Stadt sagten, am Tor habe sich niemand gegen Entgelt angeboten; denn sie sei aus einem anderen Ort gekommen und habe nur kurze Zeit am Tor gesessen.[e] **10** So meinte ich, niemand wisse, dass ich zu ihr eingegangen war. **11** Danach kamen wir wegen der Hungersnot zu Josef nach Ägypten. **12** Ich war damals sechsundvierzig Jahre alt und verbrachte dreiundsiebzig Jahre in Ägypten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der vorgelegte griechische Text lautet: „in Enan, der Stadt, beim Tor“. Eine „Herberge“, wie sie in einer anderen Textgestalt erscheint, wird hier nicht erwähnt.'
    reason: textual_variant
  - marker: b
    text: Nach dem hier vorgelegten griechischen Wortlaut übergibt Juda seinen Stab und sein Diadem. Ein Ring und die Worte „meines Königtums“ stehen in diesem Text nicht.
    reason: textual_variant
  - marker: c
    text: 'Oder: „die im Geheimen gesprochenen Worte“. Die griechische Formulierung kann vertrauliche beziehungsweise geheime Worte bezeichnen.'
    reason: lexical_alternative
  - marker: d
    text: „Weil es vom Herrn war“ kann Judas Verständnis ausdrücken, dass Gottes Vorsehung das Geschehen übergeordnet lenkte; die Wendung muss keine moralische Billigung seiner Tat bedeuten.
    reason: theological_tension
  - marker: e
    text: Das hier zugrunde liegende griechische Wort ist selten oder textlich unsicher. Gemeint ist im Zusammenhang vermutlich eine Person, die am Tor sexuelle Dienste gegen Entgelt anbot.
    reason: textual_difficulty
lexical_decisions:
- source_word: χηρευούσης / χηρεύουσαν
  choice: Witwe war / eine Witwe
  rationale: Die Formen bezeichnen den Witwenstand Tamars; die idiomatische deutsche Wiedergabe wahrt ihre gesellschaftliche Stellung im Bericht.
- source_word: κοσμηθεῖσα κόσμῳ νυμφικῷ
  choice: schmückte sie sich mit bräutlichem Schmuck
  rationale: Die deutsche Kognatenfügung gibt die betonte Wiederholung von κοσμέω und κόσμος wieder, ohne sie unnötig zu glätten.
- source_word: ἐν Ἐνὰν τῇ πόλει πρὸς τὴν πύλην
  choice: in Enan, der Stadt, ans Tor
  rationale: Der vorgelegte griechische Text nennt Enan als Stadt und das Tor, enthält aber weder πανδοχεῖον noch einen entsprechenden Ausdruck für eine Herberge.
- source_word: προκαθεσθαι ἐπὶ ἑπτὰ ἡμέρας παρὰ τὴν πύλην
  choice: sieben Tage lang am Tor sitzen sollte
  rationale: Die Wiedergabe folgt den im vorgelegten Text ausdrücklich vorhandenen Angaben zu Dauer und Ort. Eine ausdrückliche Erwähnung von Prostitution steht in diesem Satz nicht.
- source_word: οὐκ ἐπέγνων αὐτήν
  choice: erkannte sie nicht
  rationale: Im Zusammenhang von Verkleidung und Trunkenheit bezeichnet ἐπιγινώσκω das Wiedererkennen, nicht den Geschlechtsverkehr.
- source_word: διὰ τοῦ σχήματος τῆς κοσμήσεως
  choice: wegen der Art, wie sie sich geschmückt hatte
  rationale: Die Formulierung gibt den visuellen Eindruck beziehungsweise die Erscheinungsform ihres Schmucks in natürlichem Deutsch wieder.
- source_word: Εἰσέρχομαι πρὸς σε / συνήλθον αὐτῇ
  choice: Ich will zu dir eingehen / als ich mit ihr verkehrt hatte
  rationale: Die erste Wendung bewahrt das biblische sexuelle Idiom; die zweite wird im erzählenden Satz verständlich und würdig wiedergegeben.
- source_word: ῥάβδον ... διάδημα
  choice: Stab ... Diadem
  rationale: Der gelieferte griechische Wortlaut nennt genau diese beiden Pfänder. Ein Ring und ein Zusatz wie „meines Königtums“ fehlen darin.
- source_word: ἀρραβῶνα / ἀρραβῶνας
  choice: Pfand / Pfänder
  rationale: ἀρραβών bezeichnet eine Sicherheit oder ein Unterpfand; die Numerusänderung des griechischen Textes wird beibehalten.
- source_word: οἱ ἐν μυστηρίῳ λόγοι
  choice: die vertraulichen Worte
  rationale: ἐν μυστηρίῳ kann geheime oder vertrauliche Rede bezeichnen. Die Übersetzung lässt offen, ob der Nachdruck auf ihrem Inhalt oder auf den Umständen des Sprechens liegt.
- source_word: τοῖς πρώτοις λόγοις ἐχρήσατο πρὸς ἐμέ
  choice: mir gegenüber die früheren Worte gebraucht
  rationale: Der im englischen Konsultationstext ausgelassene Satzteil wird formal nah wiedergegeben; „früheren“ wahrt den Rückbezug, ohne dessen genaue Referenz festzulegen.
- source_word: τελεσικόμενον
  choice: jemanden, der sich gegen Entgelt angeboten habe
  rationale: Das seltene beziehungsweise textlich schwierige Wort wird aus dem Kontext als Bezeichnung entgeltlicher sexueller Verfügbarkeit verstanden, aber wegen der Unsicherheit mit einer Fußnote versehen.
- source_word: ἑβδομήκοντα καὶ τρία ἔτη ἐποίησα εἰς Αἴγυπτον
  choice: verbrachte dreiundsiebzig Jahre in Ägypten
  rationale: Das idiomatische deutsche Verb gibt die Zeitangabe mit ποιεῖν klar wieder.
theological_decisions:
- issue: παρὰ Κυρίου ἦν in Vers 6
  choice: weil es vom Herrn war
  alternative: weil es nach dem Willen des Herrn geschah
  rationale: Die knappe Formulierung lässt offen, ob Juda von unmittelbarem Handeln, Vorsehung oder göttlichem Überwalten spricht, und behauptet nicht, dass der Herr die Handlung moralisch billigte.
- issue: Königliche Sprache beim Pfand in Vers 4
  choice: mein Diadem
  alternative: mein Siegelring beziehungsweise die Schnur aus Genesis 38
  rationale: διάδημα wird als überlieferter königlicher Ausdruck beibehalten und nicht stillschweigend an den Genesisbericht angeglichen. Der Zusatz „meines Königtums“ wird dagegen nicht aufgenommen, weil er im gelieferten griechischen Ausgangstext fehlt.
- issue: Inhalt von Vers 8
  choice: Doch ich näherte mich ihr mein Leben lang nicht wieder.
  alternative: 'Zusatz: „weil ich diesen Gräuel in ganz Israel begangen hatte“'
  rationale: Der Zusatz des englischen Konsultationstextes hat im vorgelegten griechischen Wortlaut keine Entsprechung und wird daher nicht in den Haupttext importiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gemäßigt biblischem Erzählton. Archaismen werden vermieden; traditionelle Wendungen wie „zu dir eingehen“ bleiben dort erhalten, wo sie ein bewusstes biblisches Idiom tragen. Der Entwurf folgt vorrangig dem tatsächlich gelieferten griechischen Wortlaut und übernimmt Zusätze der englischen Konsultationsschicht nicht, wenn sie darin keine Entsprechung haben.
