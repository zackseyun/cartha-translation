  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem vorgelegten griechischen α-Text im Wesentlichen sorgfältig und korrigiert zu Recht mehrere nicht durch diesen Wortlaut gedeckte Angaben der englischen Audit-Schicht: weder Herberge noch Ring noch „meines Königtums“ stehen im gelieferten griechischen Text; ebenso fehlen dort die Prostitution in V. 2 und der Zusatz zu V. 8. In V. 3 sollte jedoch deutlicher Tamar und nicht ihre Schönheit als handelndes Subjekt erscheinen. In V. 5–6 bedeutet ἀνελεῖν jeweils „töten“, nicht „töten lassen“.'
  naturalness: Das Deutsch ist überwiegend modernes, würdiges Standarddeutsch. „In der Stadt Enan, beim Tor“ ist klarer als die Apposition „in Enan, der Stadt, ans Tor“. Die Formulierung zu V. 3 wird mit einer kleinen Umstellung sowohl quellennäher als auch idiomatischer.
  terminology: „Witwe“, „bräutlicher Schmuck“, „Stab“, „Diadem“, „Pfand/Pfänder“ und „Herr“ sind angemessen. „Vertrauliche Worte“ wahrt die mögliche Bedeutung von ἐν μυστηρίῳ. Die Umschreibung des schwierigen τελεσικόμενον in V. 9 ist als kontextuelle, per Fußnote abgesicherte Lösung vertretbar.
