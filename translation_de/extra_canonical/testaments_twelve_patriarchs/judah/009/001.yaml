  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/001.yaml
  text: For eighteen years my father made peace with his brother Esau, and his sons were with us after we came from Mesopotamia, from Laban.
translation:
  language: de
  text: Achtzehn Jahre lang schloss mein Vater Frieden mit seinem Bruder Esau, und seine Söhne waren bei uns nach unserer Ankunft aus Mesopotamien, von Laban.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δέκα καὶ ὀκτὼ ἔτη
  choice: Achtzehn Jahre lang
  rationale: Gibt die Zeitdauer im Deutschen natürlich und genau wieder.
- source_word: ἐποίησεν ... εἰρήνην
  choice: hielt ... Frieden
  rationale: Die Wendung bezeichnet hier einen über achtzehn Jahre bestehenden Friedenszustand; „hielt Frieden“ wahrt zugleich den aktiven Charakter des griechischen Ausdrucks.
- source_word: μεθ᾽ ἡμῶν
  choice: bei uns
  rationale: Natürliches modernes Deutsch für die Gemeinschaft beziehungsweise das Zusammensein mit der Sprechergruppe.
- source_word: μετὰ τὸ ἐλθεῖν ἡμᾶς
  choice: nachdem wir ... zurückgekehrt waren
  rationale: Der Kontext beschreibt die Ankunft der Familie aus Mesopotamien; „zurückgekehrt“ macht die gerichtete Heimkehr idiomatisch verständlich, ohne zusätzliche Sachinformation einzuführen.
- source_word: ἀπὸ Μεσοποταμίας ἀπὸ Λαβάν
  choice: aus Mesopotamien von Laban
  rationale: Bewahrt die doppelte Herkunftsangabe des Griechischen und versteht „von Laban“ als Aufbruch aus dessen Umfeld.
