  text: Τότε αἰτοῦσιν⁴² αὐτὸ⁴³ ἡμᾶς⁴⁴ τὰ πρὸς εἰρήνην καὶ *γενομένης βουλῆς μετὰ⁴⁵ τοῦ πατρὸς ἡμῶν, ὑποδεξάμενοι αὐτοὺς ὑποφόρους⁴⁶.
