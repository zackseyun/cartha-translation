  text: Then they asked us for terms of peace, and after counsel had been taken with our father, we accepted them.
translation:
  language: de
  text: Da baten sie uns um Friedensbedingungen. Nachdem wir uns mit unserem Vater beraten hatten, nahmen wir sie als Tributpflichtige auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πρὸς εἰρήνην
  choice: Friedensbedingungen
  rationale: Die Wendung bezeichnet die für einen Frieden nötigen Vereinbarungen oder Bedingungen; die kompakte deutsche Wiedergabe ist natürlich und sachlich genau.
- source_word: γενομένης βουλῆς μετὰ τοῦ πατρὸς ἡμῶν
  choice: nachdem wir uns mit unserem Vater beraten hatten
  rationale: Der griechische Genitivus absolutus spricht von einer Beratung mit dem Vater. Die deutsche Verbalkonstruktion gibt den Vorgang idiomatisch wieder, ohne einen darüber hinausgehenden Beschluss zu unterstellen.
- source_word: ὑποδεξάμενοι
  choice: nahmen wir sie … auf
  rationale: Das Partizip bezeichnet hier ihre Annahme beziehungsweise Aufnahme nach der Beratung.
- source_word: ὑποφόρους
  choice: als Tributpflichtige
  rationale: Das Wort bezeichnet Personen oder Gruppen, die einer Herrschaft unterstellt und zur Abgabe von Tribut verpflichtet sind. Dieser im griechischen Text ausdrücklich vorhandene Aspekt wird bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Der historische Erzählzusammenhang wird im deutschen Präteritum wiedergegeben; der gegenüber der englischen Konsultationsfassung ausgelassene Ausdruck ὑποφόρους bleibt erhalten.
