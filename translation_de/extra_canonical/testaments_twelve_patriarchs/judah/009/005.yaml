  verdict: revise
  source_fidelity: 'Die Übersetzung gibt den Belagerungsablauf im Wesentlichen zutreffend wieder. „Wache hielten“ ist für δρώντων jedoch zu eng: Das Partizip bezeichnet allgemein ein Tätigsein/Handeln und besagt nicht ausdrücklich Wachehalten oder Beobachten. „fing ... ab“ verstärkt ἀποδεχόμενος leicht zu einem Abwehren; „auffing“ bewahrt das Entgegennehmen der von der Mauer kommenden Steine besser. Die Ergänzung „uns“ bei „nicht einließen“ ist aus der Situation und dem englischen Audit plausibel, während das deutsche Verb die im Griechischen implizite Öffnung eines Zugangs idiomatisch ausdrückt.'
  naturalness: Die Satzteilung und der erzählerische Präteritalstil sind natürliches modernes Standarddeutsch. „Während sie beschäftigt waren“ ist bewusst allgemein und klingt in diesem Kontext idiomatischer als eine ungesicherte Spezifizierung ihres Tuns. Die Abfolge von Schild, Steinen, Aufstieg und Tötung bleibt klar.
  terminology: „Leiter“, „Schild“ und „Machthaber“ sind angemessen. „Machthaber ihrer Stadt“ gibt δυνάστας als einflussreiche bzw. herrschende Männer wieder; die Stellung von πόλει αὐτῶν bleibt syntaktisch nicht völlig eindeutig und wird in einer Fußnote kenntlich gemacht.
  issues:
  - severity: medium
    issue: δρώντων αὐτῶν wird mit „während sie Wache hielten“ wiedergegeben.
    rationale: Das griechische δρῶντες bedeutet allgemein „handelnd/tätig seiend“. Eine Wach- oder Beobachtungstätigkeit wird im vorliegenden Wortlaut nicht genannt; die Übersetzung sollte diese nicht festlegen.
  - severity: low
    issue: „fing die Steine von der Mauer ab“ legt ein aktives Abwehren nahe.
    rationale: ἀποδεχόμενος bezeichnet hier primär das Entgegennehmen/Auffangen. „Die ... Steine auffing“ ist näher am Ausdruck und ausreichend verständlich.
