  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/005.yaml
  text: And because they did not open to us after twenty days, while they were watching, I brought a ladder; and placing my shield over my head and receiving the stones, I went up and killed four of their mighty men.
translation:
  language: de
  text: Und weil sie uns zwanzig Tage lang nicht einließen, brachte ich, während sie beschäftigt waren, eine Leiter heran. Ich hielt meinen Schild über meinen Kopf, fing die von der Mauer kommenden Steine auf, stieg hinauf und tötete vier Machthaber ihrer Stadt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Verbindung „ihrer Stadt“ ist im Griechischen syntaktisch knapp und kann auch auf den Ort der Tötung bezogen werden: „vier Machthaber in ihrer Stadt“.'
    reason: Bewahrt die Mehrdeutigkeit der Stellung von πόλει αὐτῶν, ohne die im Haupttext naheliegende Zugehörigkeitslesart auszuschließen.
lexical_decisions:
- source_word: ὡς οὐκ ἠνοίγον ἡμέρας εἴκοσι
  choice: weil sie uns zwanzig Tage lang nicht öffneten
  rationale: ὡς wird im Zusammenhang kausal verstanden; der Dativbezug „uns“ ist im Deutschen zur natürlichen Wiedergabe von „nicht öffnen“ ergänzt und entspricht der erschlossenen Situation.
- source_word: δρώντων αὐτῶν
  choice: während sie Wache hielten
  rationale: Die knappe Genitivus-­absolutus-Konstruktion beschreibt ihre fortdauernde aufmerksame Tätigkeit; „Wache hielten“ ergibt im Belagerungskontext natürliches Deutsch, ohne den Handlungsablauf zu verändern.
- source_word: προσάγω κλίμακα
  choice: brachte ich … eine Leiter her
  rationale: προσάγω bezeichnet das Heranbringen; das historische Präsens wird im deutschen Erzählzusammenhang als Präteritum wiedergegeben.
- source_word: τὴν ἀσπίδα ἐπὶ τῆς κεφαλῆς μου
  choice: meinen Schild über meinen Kopf
  rationale: Bewahrt die räumliche Schutzfunktion des Schildes und vermeidet die unnatürliche wörtliche Formulierung „auf meinem Kopf“.
- source_word: ἀποδεχόμενος ἀπὸ τοίχου λίθους
  choice: fing die Steine von der Mauer ab
  rationale: Gibt sowohl das Entgegennehmen beziehungsweise Abfangen der Geschosse als auch ihre Herkunft von der Mauer ausdrücklich wieder.
- source_word: τέσσαρας … δυνάστας
  choice: vier Machthaber
  rationale: δυνάσται bezeichnet einflussreiche oder herrschende Männer, nicht lediglich körperlich starke Kämpfer; „Machthaber“ bewahrt diese politische beziehungsweise soziale Bedeutung.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache mit klarer Abfolge der Belagerungshandlungen. Das lange griechische Satzgefüge wurde zur besseren Verständlichkeit in zwei Sätze gegliedert; die wiederholten koordinierenden Partikeln werden im Deutschen nur dort ausdrücklich wiedergegeben, wo sie für den Ablauf nötig sind.
