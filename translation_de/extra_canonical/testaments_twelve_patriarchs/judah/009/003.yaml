  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/003.yaml
  text: And Jacob struck Esau with a bow, and he fell by Jacob's bow, dead on Mount Seir.
translation:
  language: de
  text: Und Jakob traf Esau mit dem Bogen; dann wurde der Tote auf dem Berg Seïr fortgetragen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dann wurde der Tote auf dem Berg Seïr aufgehoben (oder weggenommen)“.'
    reason: Das griechische ἤρθη kann „wurde aufgehoben“, „wurde weggenommen“ oder kontextuell „wurde fortgetragen“ bedeuten. Die Quelle sagt nicht ausdrücklich, dass Esau fiel.
lexical_decisions:
- source_word: ἔπαισεν ἐν τόξῳ
  choice: traf … mit dem Bogen
  rationale: ἔπαισεν bezeichnet hier einen Schlag oder Treffer; zusammen mit ἐν τόξῳ ist „mit dem Bogen traf“ im Deutschen natürlich und bleibt nahe am griechischen Wortlaut.
- source_word: ἤρθη
  choice: wurde … fortgetragen
  rationale: Der passive Aorist von αἴρω bedeutet „wurde aufgehoben/weggenommen/fortgetragen“. Im Zusammenhang mit ὁ νεκρός gibt „fortgetragen“ den naheliegenden Sinn wieder, ohne daraus ein im Griechischen nicht genanntes Fallen zu machen.
- source_word: ὁ νεκρός
  choice: der Tote
  rationale: Die substantivierte Form bezeichnet ausdrücklich den toten Mann beziehungsweise Leichnam; „der Tote“ ist würdig und nicht unnötig technisch.
- source_word: ἐν ὄρει Σεείρ
  choice: auf dem Berg Seïr
  rationale: Die Ortsangabe wird direkt wiedergegeben; „Seïr“ markiert im Deutschen die getrennte Aussprache der Vokale.
