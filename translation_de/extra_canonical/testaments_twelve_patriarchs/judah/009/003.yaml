  verdict: approve
  source_fidelity: 'Die deutsche Fassung folgt dem griechischen α-Text zuverlässig: Jakob ist Subjekt von ἔπαισεν, Esau Objekt; ἐν τόξῳ ist sachgerecht als „mit dem Bogen“ wiedergegeben. Der folgende Passivsatz mit ἤρθη und ὁ νεκρός wird ohne die im Englischen enthaltene, im griechischen Wortlaut jedoch nicht ausgedrückte Fallbewegung wiedergegeben. Die Fußnote macht die verbleibende Bedeutungsbreite von ἤρθη transparent.'
  naturalness: Die Formulierung ist moderne, klare und würdige deutsche Erzählprosa. „Der Tote“ ist in diesem knappen Kontext natürlich; das Semikolon mit „dann“ stellt den Fortgang gut lesbar dar, ohne den Sinn wesentlich zu verändern.
  terminology: Die Eigennamen „Jakob“, „Esau“ und „Seïr“ sind angemessen. „Der Tote“ gibt ὁ νεκρός direkt wieder. „Fortgetragen“ ist als kontextuelle Hauptwiedergabe von ἤρθη vertretbar, und die Fußnote sichert die weniger spezifischen Möglichkeiten „aufgehoben“ beziehungsweise „weggenommen“ ab.
