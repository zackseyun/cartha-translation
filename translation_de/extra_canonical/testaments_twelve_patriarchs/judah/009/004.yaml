  text: And we pursued the sons of Esau, and they also had a fortified city, and we were not able to enter it. But sitting around it, we besieged it.
translation:
  language: de
  text: Und wir verfolgten die Söhne Esaus. Auch sie hatten eine befestigte Stadt, doch wir konnten nicht in sie eindringen. Da lagerten wir uns rings um sie und belagerten sie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεδιώξαμεν
  choice: wir verfolgten
  rationale: Gibt das intensive Verfolgen bzw. Nachsetzen natürlich und genau wieder.
- source_word: τοὺς υἱοὺς Ἡσαῦ
  choice: die Söhne Esaus
  rationale: Bewahrt die wörtliche genealogische bzw. ethnische Bezeichnung des griechischen Textes.
- source_word: πόλις ὀχυρά
  choice: eine befestigte Stadt
  rationale: Entspricht der militärisch gesicherten Stadt, ohne über den Ausgangstext hinaus ausdrücklich eine Festung daraus zu machen.
- source_word: εἰσελθεῖν ἐν αὐτῇ
  choice: in sie eindringen
  rationale: Im militärischen Zusammenhang bezeichnet die Wendung nicht bloß neutrales Betreten, sondern das erzwungene Hineingelangen.
- source_word: περικαθίσαντες
  choice: Da lagerten wir uns rings um sie
  rationale: Drückt das Sich-ringsherum-Niederlassen im Rahmen einer Belagerung idiomatisch aus und bewahrt den partizipialen zeitlich-begleitenden Zusammenhang.
- source_word: ἐπολιορκοῦμεν αὐτῇ
  choice: belagerten sie
  rationale: Gibt die fortdauernde militärische Handlung knapp und idiomatisch wieder; das griechische Dativobjekt wird im Deutschen regelgerecht als Akkusativ ausgedrückt.
theological_decisions: []
