  verdict: revise
  source_fidelity: Die Zeitangabe, die Rückkehr (ἐπανῆλθεν) und das ausdrücklich genannte Verwandtschaftsverhältnis sind treffend wiedergegeben. „Heer“ verengt λαός jedoch auf eine militärische Einheit. Der griechische Text sagt allgemein, dass Esau von einem großen/gewichtigen und starken Volk bzw. einer starken Schar begleitet war, ohne dessen Charakter hier ausdrücklich als Heer zu bestimmen.
  naturalness: „Als die achtzehn Jahre vergangen waren“ ist modernes, idiomatisches Standarddeutsch und wahrt die Bedeutung der Formel. „Mit einem großen und starken Volk“ ist in diesem erzählerischen, antik geprägten Zusammenhang verständlich; „Schar“ wäre flüssiger, aber bereits etwas interpretierender.
  terminology: Esau ist korrekt. „Bruder meines Vaters“ bewahrt die Formulierung des Ausgangstextes. Die Wiedergabe von λαός als „Volk“ vermeidet die nicht abgesicherte militärische Spezifizierung „Heer“.
  issues:
