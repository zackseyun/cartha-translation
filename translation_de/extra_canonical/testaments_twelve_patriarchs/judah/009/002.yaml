base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/002.yaml
  text: And when the eighteen years were fulfilled, Esau, my father's brother, returned to us with a large and strong people.
translation:
  language: de
  text: Und als die achtzehn Jahre vergangen waren, kehrte Esau, der Bruder meines Vaters, mit einem großen und starken Volk zu uns zurück.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πληρωθέντων τῶν δεκαοκτὼ ἐτῶν
  choice: als die achtzehn Jahre vollendet waren
  rationale: Bewahrt die zeitliche Genitivus-absolutus-Konstruktion und die Vorstellung eines vollständig verstrichenen Zeitraums.
- source_word: ἐπανῆλθεν
  choice: kehrte … zurück
  rationale: Gibt die Rückkehrbedeutung des Verbs wieder, ohne die im Kontext mögliche feindliche Absicht in das Verb hineinzulesen.
- source_word: ὁ ἀδελφὸς τοῦ πατρός μου
  choice: der Bruder meines Vaters
  rationale: Folgt der ausdrücklichen Verwandtschaftsbezeichnung des griechischen Textes statt sie lediglich mit „mein Onkel“ zusammenzufassen.
- source_word: ἐν λαῷ βαρεῖ καὶ ἰσχυρῷ
  choice: mit einem großen und starken Heer
  rationale: ἐν bezeichnet hier die Begleitung; λαός meint in diesem militärischen Zusammenhang eine Heerschar. βαρύς bezeichnet deren beträchtliche Größe beziehungsweise Wucht, ἰσχυρός ihre Stärke.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht feierliche Wendung „die Jahre vollendet waren“ erhält den antiken Erzählton; „Heer“ macht den militärischen Kontext natürlich verständlich, ohne eine Konfrontation ausdrücklich vorwegzunehmen.
