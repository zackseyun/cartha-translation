- from: Und als die achtzehn Jahre vollendet waren, kehrte Esau, der Bruder meines Vaters, mit einem großen und starken Heer zu uns zurück.
  to: Und als die achtzehn Jahre vergangen waren, kehrte Esau, der Bruder meines Vaters, mit einem großen und starken Volk zu uns zurück.
