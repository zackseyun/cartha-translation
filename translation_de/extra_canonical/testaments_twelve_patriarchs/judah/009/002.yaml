    issue: „Heer“ für λαός
    rationale: λαός bezeichnet primär ein Volk bzw. eine Menschenmenge. Zwar kann der Kontext eine bewaffnete Gefolgschaft nahelegen, doch der Vers selbst bezeichnet sie nicht ausdrücklich als Heer. Die Übersetzung sollte diese Einengung nicht vorwegnehmen.
