base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/009/008.yaml
  text: And they were giving us five hundred cors of wheat, and five hundred baths of oil, and five hundred measures of wine, until the famine, when we went down into Egypt.
translation:
  language: de
  text: Und sie gaben uns fünfhundert Kor Weizen, fünfhundert Bat Öl[a] und fünfhundert Maß Wein, bis zur Hungersnot, als wir nach Ägypten hinabzogen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text ist an dieser Stelle beschädigt; vermutlich ist eine Maßeinheit für Öl gemeint, hier als »Bat« wiedergegeben.
    reason: Kennzeichnet die echte textkritische Unsicherheit der verderbten Lesart †ὕφης, ohne sie im Haupttext zu überladen.
lexical_decisions:
- source_word: πυροῦ
  choice: Weizen
  rationale: Der griechische Singular bezeichnet hier Weizen als Stoff- bzw. Sammelbegriff.
- source_word: κόρους
  choice: Kor
  rationale: κόρος ist ein konkretes antikes Hohlmaß; die Transliteration bewahrt die Maßeinheit, ohne eine unsichere moderne Umrechnung einzuführen.
- source_word: ἐλαίου
  choice: Öl
  rationale: Im Kontext antiker Abgaben ist Olivenöl wahrscheinlich, doch der griechische Ausdruck nennt allgemein Öl; daher bleibt die Übersetzung entsprechend offen.
- source_word: †ὕφης
  choice: Bat
  rationale: Die überlieferte Form ist verderbt. Der Kontext und die textgeschichtliche Rekonstruktion sprechen für eine Maßeinheit beim Öl; entsprechend der konsultierten Fassung wird Bat gewählt und die Unsicherheit in einer Fußnote kenntlich gemacht.
- source_word: '*μέτρα'
  choice: Maß
  rationale: Der Ausdruck bezeichnet allgemein Maße bzw. Mengeneinheiten; wegen textlicher Unsicherheit wird keine spezifischere Einheit eingesetzt.
- source_word: ἕως τοῦ λιμοῦ
  choice: bis die Hungersnot kam
  rationale: Idiomatiche deutsche Wiedergabe des zeitlichen Endpunkts; das Eintreten der Hungersnot ist aus dem Zusammenhang erschließbar.
- source_word: κατήλθομεν εἰς Αἴγυπτον
  choice: wir nach Ägypten hinabzogen
  rationale: Bewahrt die traditionelle und geografisch geprägte Bewegungsangabe des griechischen Verbs.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Antike Maße werden nicht in moderne Mengen umgerechnet. Die wiederholte Zahlstruktur des griechischen Textes bleibt erhalten; der fortlaufende Aspekt von ἦσαν διδόντες wird im Deutschen natürlich mit »sie gaben uns« wiedergegeben.
