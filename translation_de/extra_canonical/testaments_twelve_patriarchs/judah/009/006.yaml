lexical_decisions:
- source_word: ἀνεῖλον
  choice: töteten
  rationale: Die Aoristform von ἀναιρέω bezeichnet hier im Kampfkontext das Töten; „töteten“ gibt dies klar und natürlich wieder.
- source_word: ἑτέρους ἕξ
  choice: sechs weitere
  rationale: ἑτέρους bezeichnet zusätzliche Personen derselben im Kontext vorausgesetzten Gruppe; die deutsche Wortstellung „sechs weitere“ ist idiomatisch.
