  text: A leopard in Hebron sprang upon the dog, and I caught it by the tail and hurled it against the rock, and it was split in two.
translation:
  language: de
  text: In Hebron sprang ein Leopard den Hund an. Ich packte ihn am Schwanz, schleuderte ihn gegen den Felsen, und er barst entzwei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πάρδαλις
  choice: Leopard
  rationale: Die übliche und kontextuell passende Wiedergabe des griechischen Tiernamens.
- source_word: προσεπήδησεν ἐπὶ
  choice: sprang … an
  rationale: Gibt die gegen ein Ziel gerichtete Sprungbewegung natürlich und präzise wieder.
- source_word: πιάσας … ἀπὸ τῆς κέρκου
  choice: packte … am Schwanz
  rationale: Eine idiomatische deutsche Wiedergabe des Ergreifens beim beziehungsweise am Schwanz.
- source_word: ἀπηκόντισα
  choice: schleuderte
  rationale: Bewahrt die kraftvolle Wurfbewegung des Verbs, dessen Bildfeld vom Werfen eines Wurfgeschosses geprägt ist.
- source_word: ἐρράγη εἰς δύο
  choice: barst entzwei
  rationale: Gibt das gewaltsame Auseinanderbrechen knapp und würdevoll wieder.
