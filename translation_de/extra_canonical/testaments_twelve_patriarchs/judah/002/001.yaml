  text: '*Καὶ ἔδωκέ μοι Κύριος¹ χάριν *ἐν πᾶσι τοῖς ἔργοις μου, ἐν τε² ἀγρῷ καὶ ἐν τῷ οἴκῳ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/002/001.yaml
  text: And the Lord gave me favor in all my works, in the field and in the house.
translation:
  language: de
  text: Und der Herr schenkte mir Gelingen bei allem, was ich tat, auf dem Feld und im Haus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδωκέ μοι Κύριος χάριν
  choice: der Herr schenkte mir Gelingen
  rationale: χάρις bezeichnet hier im Zusammenhang mit den Tätigkeiten Judas erwiesene Gunst beziehungsweise daraus erwachsendes Gelingen. „schenkte“ gibt ἔδωκεν natürlich wieder, ohne die göttliche Zuwendung abzuschwächen.
- source_word: ἐν πᾶσι τοῖς ἔργοις μου
  choice: bei allem, was ich tat
  rationale: Die idiomatische Formulierung erfasst den umfassenden Bezug auf Judas Tätigkeiten natürlicher als „in allen meinen Werken“.
- source_word: ἐν τε ἀγρῷ καὶ ἐν τῷ οἴκῳ
  choice: auf dem Feld und im Haus
  rationale: Die räumliche Gegenüberstellung von landwirtschaftlichem und häuslichem Bereich wird knapp und quellennah bewahrt.
theological_decisions:
- issue: Bedeutung der von Gott gegebenen χάρις
  choice: Gelingen
  alternative: Gunst / Gnade
  rationale: Im unmittelbaren Satz bezieht sich χάρις auf Judas gesamtes Tun im Feld und im Haus. „Gelingen“ drückt die konkrete Wirkung göttlicher Gunst aus; „Gnade“ könnte hier unnötig einen späteren dogmatischen Fachsinn nahelegen.
translation_notes:
  register: Moderne, würdige Standardsprache; bewusst flüssiger als eine wörtliche Wiedergabe mit „Werken“, dabei bleiben göttlicher Geber, umfassender Tätigkeitsbereich und die Paarung Feld/Haus erhalten.
