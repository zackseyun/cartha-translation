base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/002/004.yaml
  text: I caught a wild mare and, after seizing it, I subdued it.
translation:
  language: de
  text: Den Löwen tötete ich und entriss seinem Maul ein Ziegenböckchen. Den Bären packte ich am Fuß und ließ ihn den Abhang hinunterstürzen[a], sodass er zerschmettert wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte griechische Wortlaut lautet wörtlich etwa: „ließ ich den Abhang los“. Gemeint ist dem Zusammenhang nach wahrscheinlich, dass Juda den Bären den Abhang hinunterstürzen ließ.'
    reason: Der vorliegende griechische Text ist syntaktisch auffällig und wahrscheinlich verderbt; die Übersetzung gibt den naheliegenden Zusammenhang wieder, ohne die Textunsicherheit zu verschweigen.
lexical_decisions:
- source_word: λέων
  choice: Löwe
  rationale: Direkte, kontextgerechte Wiedergabe des griechischen Substantivs.
- source_word: ἀφειλόμην
  choice: entriss
  rationale: Das Medium bezeichnet hier, dass Juda dem Löwen das Tier aus dem Maul nahm; „entriss“ gibt die gewaltsame Rettung knapp und natürlich wieder.
- source_word: ἔριφος
  choice: Ziegenböckchen
  rationale: Bezeichnet ein junges Ziegentier, häufig besonders ein Böckchen; die konkrete Tierbezeichnung bleibt erhalten.
- source_word: ἄρκος
  choice: Bärin
  rationale: Das griechische Substantiv ist grammatisch feminin; die Wiedergabe als „Bärin“ ermöglicht zudem einen natürlichen Rückbezug mit „sie“, ohne das Geschlecht theologisch oder erzählerisch aufzuwerten.
- source_word: λαβὼν ἀπὸ τοῦ ποδός
  choice: packte ich am Fuß
  rationale: Bewahrt die ungewöhnlich konkrete Handlung des griechischen Wortlauts in natürlichem Deutsch.
- source_word: συνετρίβη
  choice: wurde zerschmettert
  rationale: Gibt das starke Passivverb wieder, das ein Zerbrechen oder Zerschmettern durch den Sturz bezeichnet.
