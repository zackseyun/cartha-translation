lexical_decisions:
- source_word: Τῷ ἀγρίῳ χοίρῳ κατέδραμον
  choice: Ich jagte dem Wildschwein nach
  rationale: κατατρέχω bezeichnet hier das verfolgende Hinterherlaufen; die deutsche Wendung gibt die Jagdbewegung natürlich wieder, ohne bereits das Einholen vorwegzunehmen.
- source_word: προέλαβον
  choice: holte es … ein
  rationale: Im Zusammenhang bezeichnet das Verb das Erreichen beziehungsweise Einholen des verfolgten Tieres.
- source_word: ἐν τῷ τρέχειν με
  choice: im Lauf
  rationale: 'Die knappe deutsche Fügung bewahrt den gleichzeitigen Vorgang: Juda holt das Tier während seines Laufens ein.'
- source_word: κατεσπάραξα αὐτόν
  choice: riss es in Stücke
  rationale: Das intensive Verb bezeichnet ein gewaltsames Zerreißen oder Zerfleischen; diese Wiedergabe erhält die drastische Aussage des Griechischen.
