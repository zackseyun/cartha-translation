id: T12P.JUD.2.3
reference: Testament of Judah 2:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Τὴν δὲ δορκάδα⁷ *διὰ τοῦ δρόμου⁸ ἐκράτουν, καὶ πᾶν ὃ ἦν ἐν τοῖς πεδίοις⁹ κατελάμβανον.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/002/003.yaml
  text: And I would seize the gazelle along the road, and I overtook everything that was in the fields. I killed the lion and snatched a kid from its mouth. I took hold of the bear by its foot and threw it down the cliff, and it was crushed.
translation:
  language: de
  text: Die Gazelle aber fing ich im Lauf[a], und alles, was sich auf den Feldern befand, holte ich ein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: auf dem Weg; die griechische Wendung kann auch den Weg oder die Laufstrecke bezeichnen.'
    reason: Die Mehrdeutigkeit von διὰ τοῦ δρόμου zwischen Lauf und Weg soll sichtbar bleiben.
lexical_decisions:
- source_word: δορκάδα
  choice: Gazelle
  rationale: Die übliche und im Kontext passende Bezeichnung für das schnelle Wildtier.
- source_word: διὰ τοῦ δρόμου
  choice: im Lauf
  rationale: δρόμος kann einen Lauf, eine Laufbahn oder einen Weg bezeichnen. Im Zusammenhang mit dem Einfangen einer Gazelle gibt „im Lauf“ die wahrscheinlich gemeinte Schnelligkeit natürlich wieder, ohne die Wendung unnötig festzulegen.
- source_word: ἐκράτουν
  choice: fing ich
  rationale: Das Imperfekt von κρατέω bezeichnet hier das Ergreifen beziehungsweise Einfangen des Tieres; „fing ich“ ist im Deutschen idiomatisch.
- source_word: κατελάμβανον
  choice: holte ich ein
  rationale: καταλαμβάνω bezeichnet in diesem Zusammenhang das Einholen oder Erreichen aufgrund von Schnelligkeit.
theological_decisions: []
