  text: I found a wild ox grazing in the land, and, taking hold of its horns, I shook it all around and blinded it.
translation:
  language: de
  text: Ich fand einen wilden Stier, der im Land weidete. Ich packte ihn bei den Hörnern, schüttelte ihn ringsum heftig, blendete ihn[a], warf ihn zu Boden und tötete ihn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „machte ihn benommen“. Das griechische Verb bedeutet wörtlich „verdunkeln“ und kann in diesem Zusammenhang unterschiedlich verstanden werden.'
    reason: Die konkrete Wirkung von σκοτίσας ist mehrdeutig und sollte nicht stillschweigend auf körperliche Blindheit festgelegt werden.
  - marker: b
    text: Die griechische Textüberlieferung ist im letzten Teil des Satzes unsicher; einige Textfassungen geben die Abfolge der Handlungen anders oder kürzer wieder.
    reason: Die Editionszeichen am Schluss des Verses weisen auf textkritische Unsicherheit hin; die Übersetzung folgt dem hier vorgelegten griechischen Wortlaut.
lexical_decisions:
- source_word: βοῦν ἄγριον
  choice: einen wilden Stier
  rationale: βοῦς kann Rind oder Ochse bedeuten; wegen der ausdrücklich genannten Hörner und der Kampfszene ist „Stier“ im Deutschen natürlich und anschaulich, ohne mehr als das griechische Maskulinum festzulegen.
- source_word: τὴν χώραν νεμόμενον
  choice: der im Land weidete
  rationale: νέμομαι bezeichnet hier das Weiden; χώρα ist allgemein „Land/Gegend“, daher die schlichte Wiedergabe „im Land“.
- source_word: κρατήσας τῶν κεράτων
  choice: Ich packte ihn bei den Hörnern
  rationale: κρατέω mit dem Genitiv bezeichnet festes Ergreifen oder Festhalten. Die finite deutsche Form sorgt für einen natürlichen Erzählfluss.
- source_word: κύκλῳ συσσείσας
  choice: schüttelte ihn ringsum heftig
  rationale: κύκλῳ trägt die Vorstellung „ringsum/im Kreis“, während συσσείω ein kräftiges Schütteln bezeichnet.
- source_word: σκοτίσας
  choice: blendete ihn
  rationale: Das Verb bedeutet wörtlich „verdunkeln“ und kann hier körperliches Blenden oder Benommenmachen ausdrücken. „blendete“ bewahrt die Bildlichkeit besser als eine rein psychologische Deutung.
- source_word: ῥίψας ἀνεῖλον αὐτόν
  choice: warf ihn zu Boden und tötete ihn
  rationale: ῥίπτω bedeutet werfen; „zu Boden“ macht im Deutschen die in der Kampfszene naheliegende Richtung ausdrücklich. ἀναιρέω bedeutet hier töten.
