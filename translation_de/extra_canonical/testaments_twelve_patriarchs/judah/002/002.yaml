base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/002/002.yaml
  text: I know that I ran with a hind and caught it, and I made it food for my father, and he ate.
translation:
  language: de
  text: Ich weiß, dass ich mit einer Hirschkuh lief, sie fing und sie meinem Vater zur Speise machte; und er aß.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἶδα
  choice: Ich weiß
  rationale: Gibt das griechische Perfekt mit präsentischer Bedeutung unmittelbar wieder.
- source_word: συνέδραμον ἐλάφῳ
  choice: mit einer Hirschkuh um die Wette lief
  rationale: συντρέχω bezeichnet hier ein Mit- beziehungsweise Wettlaufen; ἔλαφος ist in diesem Zusammenhang als weibliches Tier verstanden.
- source_word: ἐπίασα αὐτήν
  choice: sie fing
  rationale: Bewahrt die einfache, konkrete Aussage des griechischen Verbs πιάζω.
- source_word: ἐποίησα αὐτὴν βρῶμα τῷ πατρί μου
  choice: meinem Vater als Speise zubereitete
  rationale: Natürliches Deutsch für die wörtliche Wendung ‚machte sie meinem Vater zur Speise‘, ohne zusätzliche Einzelheiten zur Zubereitung einzutragen.
- source_word: ἔφαγεν
  choice: er aß davon
  rationale: Das ergänzte ‚davon‘ stellt im Deutschen den Rückbezug auf die zubereitete Speise idiomatisch klar.
