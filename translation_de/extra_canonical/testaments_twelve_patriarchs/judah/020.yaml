  text: '1[a]. For it leads astray, because in the delusion of silver they call those who are not gods gods, and it makes the one who has it fall into frenzy. 2. Because of silver I lost my children; and if my repentance and my humiliation, and the prayers of my father, had not come to my aid, I would have died childless. 3. But the God of my fathers had mercy on me, because I did this in ignorance[b]. 4. For the ruler of deceit blinded me, and I was ignorant as a man, and, as flesh corrupted in sins, I recognized my own weakness, thinking myself invincible.


    5. Understand, then, my children, that two spirits attend a man: the spirit of truth and the spirit of deceit. 6. And between them is the conscience of the mind, to which it may incline as it wills. 7. The works of truth and the works of deceit are written upon the breast of a man, and the Lord knows each one of them. 8. And there is no time when the works of men can escape his notice, for they are inscribed before the Lord upon the breast. 9. And the spirit of truth testifies against all things, and the sinner is burned up by his own heart[c], and cannot lift up his face to the judge.'
translation:
  language: de
  text: '**Testament Judas 20**


    1 Erkennt also, meine Kinder, dass zwei Geister sich mit dem Menschen befassen: der Geist der Wahrheit und der Geist der Täuschung. 2 Dazwischen steht das Gewissen; es kann sich neigen, wohin es will. 3 Jeder von ihnen wird an den Taten der Menschen erkannt; denn in ihrer Brust, in ihren Gebeinen, ist es vom Herrn eingeschrieben.[a] 4 Und zu keiner Zeit können die Taten der Menschen verborgen bleiben; denn sie sind vor dem Herrn in ihrer Brust, in ihren Gebeinen, eingeschrieben.[a] 5 Der Geist der Wahrheit aber klagt alles an; der Sünder wird vom Feuer seines eigenen Herzens verzehrt und kann sein Angesicht nicht zum Richter erheben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Wortlaut in den Versen 3–4 ist stark gestört und teilweise mehrdeutig. Sicher erkennbar sind die Taten der Menschen, das Eingeschriebensein in der Brust beziehungsweise den Gebeinen und der Bezug auf den Herrn. Die Übersetzung gibt diesen Zusammenhang wieder, ohne die grammatischen Brüche des überlieferten Textes nachzuahmen.
    reason: textual_variant
lexical_decisions:
- source_word: δύο πνεύματα
  choice: zwei Geister
  rationale: Die ausdrückliche geistliche Sprache des griechischen Textes bleibt erhalten; eine Reduktion auf bloße Neigungen oder Impulse wäre zu eng.
- source_word: σχολάζουσι τῷ ἀνθρώπῳ
  choice: sich mit dem Menschen befassen
  rationale: Die schwierige Wendung bezeichnet, dass die beiden Geister dem Menschen zugewandt und bei ihm wirksam sind, ohne ihre genaue Wirkungsweise festzulegen.
- source_word: πνεῦμα τῆς πλάνης
  choice: Geist der Täuschung
  rationale: πλάνη umfasst Irreführung, Verirrung und Täuschung. „Täuschung“ bewahrt hier die moralische Kraft und bildet den Gegenpol zur Wahrheit.
- source_word: συνείδησις
  choice: Gewissen
  rationale: Das Wort bezeichnet hier die innere moralische Instanz zwischen den beiden Geistern. Der knappe griechische Wortlaut bietet keinen sicheren Anlass für die erweiterte Lesart „Gewissen des Verstandes“.
- source_word: κλῖναι
  choice: sich neigen
  rationale: Die bildhafte Sprache einer Ausrichtung zu einer von zwei Seiten wird unmittelbar bewahrt.
- source_word: κατηγορεῖ
  choice: klagt … an
  rationale: Das Verb hat forensische Bedeutung und bereitet das Bild des Richters am Versende vor.
- source_word: ἐμπεπύρισται … ἐκ τῆς ἰδίας καρδίας
  choice: wird vom Feuer seines eigenen Herzens verzehrt
  rationale: Die Feuerbildlichkeit und der Ursprung im eigenen Inneren bleiben erhalten, ohne das Bild auf bloße Reue oder Gewissensqualen zu verengen.
- source_word: ἆραι πρόσωπον
  choice: sein Angesicht … erheben
  rationale: Die traditionelle körperlich-forensische Wendung wird in würdigem, verständlichem Deutsch wiedergegeben.
theological_decisions:
- issue: Moralische Anthropologie der zwei Geister
  choice: Zwei wirkliche moralisch-geistliche Mächte werden genannt, während das Gewissen zwischen ihnen steht.
  alternative: Die Geister ausschließlich als psychologische Neigungen oder eindeutig als Engel beziehungsweise Dämonen bestimmen.
  rationale: Der Text spricht ausdrücklich von πνεύματα, legt ihre Ontologie aber nicht näher fest. Die Übersetzung bewahrt diese Spannung.
- issue: Freiheit des Gewissens in Vers 2
  choice: Das Gewissen kann sich neigen, wohin es will.
  alternative: Der Mensch entscheidet autonom und uneingeschränkt zwischen Gut und Böse.
  rationale: Die Formulierung gibt die im Text ausgesagte Beweglichkeit wieder, ohne daraus eine ausgearbeitete Lehre vom freien Willen abzuleiten.
- issue: Inneres Gericht in Vers 5
  choice: Der Sünder wird vom Feuer seines eigenen Herzens verzehrt und kann dem Richter nicht entgegentreten.
  alternative: Das Feuer ausschließlich als gegenwärtige Gewissensqual oder ausschließlich als endzeitliche Strafe bestimmen.
  rationale: Der Text verbindet innere Anklage und gerichtliche Bildsprache, ohne deren zeitliches oder metaphysisches Verhältnis aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte körperliche Inschriftmetaphorik („Brust“, „Gebeine“) und die forensische Sprache („klagt an“, „Richter“) bleiben sichtbar. Die Verszählung folgt dem vorgelegten griechischen Kapiteltext (1–5), nicht der erweiterten englischen Zählung.
