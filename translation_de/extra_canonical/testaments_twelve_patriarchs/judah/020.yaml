review_pass:
  verdict: revise
  source_fidelity: 'Eine Revision ist erforderlich. Der Entwurf gibt die Grundstruktur zutreffend wieder, glättet jedoch die besonders schwierigen Verse 3–4 zu stark: Er macht aus der überlieferten, syntaktisch und semantisch unsicheren Aussage ausdrücklich die Unverborgenheit der Taten. Außerdem paraphrasiert er ἐμπεπύρισται in Vers 5 als ein Verzehrtwerden durch Feuer, obwohl der griechische Text wörtlicher von einem Entflammt- bzw. In-Brand-Gesetzt-Sein durch das eigene Herz spricht.'
  naturalness: Die Sprache ist überwiegend klares, würdiges modernes Standarddeutsch. „Sich mit dem Menschen befassen“ ist möglich, aber „bei einem Menschen wirksam sind“ ist idiomatischer und gibt die unpräzise Beziehung der Geister zum Menschen ohne unnötige Umgangssprachlichkeit wieder. Die Formulierung zur Brust und den Gebeinen muss wegen der Überlieferung zwar ungewohnt bleiben, wird aber durch eine Anmerkung erläutert.
  terminology: „Geister“, „Wahrheit“, „Täuschung“, „Gewissen“, „klagt an“, „Angesicht“ und „Richter“ sind treffend. „Täuschung“ für πλάνη wahrt den ethisch-irreführenden Charakter. Die gerichtliche und körperliche Bildsprache wird beibehalten, ohne die Ontologie der Geister oder die genaue Art des inneren Brennens dogmatisch festzulegen.
  issues:
  - severity: high
    issue: Verse 3–4 werden inhaltlich zu stark geglättet.
    rationale: Der griechische Wortlaut ist in diesen Versen schwer verständlich. Insbesondere sagt Vers 4 nicht ausdrücklich, dass die Werke „verborgen bleiben“ oder Gottes Kenntnis „entgehen“. Die Fassung muss die schwierige Aussage näher am Wortlaut lassen und ihre Unsicherheit in der Fußnote kennzeichnen.
  - severity: medium
    issue: Die körperliche Inschriftmetapher wird umgestaltet.
    rationale: „In ihrer Brust, in ihren Gebeinen“ löst die eigentümliche Formulierung ἐν στήθει τῶν ὀστέων αὐτῶν in zwei getrennte Orte auf. „In der Brust ihrer Gebeine“ ist absichtlich befremdlich, bildet die überlieferte Metapher aber genauer ab; die Anmerkung erklärt die Unsicherheit.
  - severity: medium
    issue: Vers 5 ergänzt ein nicht ausdrücklich genanntes Feuer und verschiebt die Aussage.
    rationale: ἐμπεπύρισται bedeutet, dass der Sünder durch sein eigenes Herz entflammt bzw. in Brand gesetzt ist. „Vom Feuer seines eigenen Herzens verzehrt“ ist eine plausible Auslegung, aber stärker und freier als der griechische Wortlaut.
  - severity: low
    issue: „sich mit dem Menschen befassen“ ist leicht behäbig.
    rationale: „bei einem Menschen wirksam sind“ ist in modernem Deutsch natürlicher und wahrt die offene, schwer präzisierbare Bedeutung von σχολάζουσι τῷ ἀνθρώπῳ.
  revised_text: '**Testament Judas 20**


    1 Erkennt also, meine Kinder, dass zwei Geister bei einem Menschen wirksam sind: der Geist der Wahrheit und der Geist der Täuschung. 2 Dazwischen steht das Gewissen, zu dem er sich neigen will. 3 An jedem von ihnen wird nach den Taten der Menschen erkennbar, dass es vom Herrn in der Brust ihrer Gebeine eingeschrieben ist.[a] 4 Und es gibt keine Zeit, in der ein Mensch die Werke der Menschen an sich nehmen könnte; denn sie sind vom Herrn in der Brust ihrer Gebeine eingeschrieben.[a] 5 Der Geist der Wahrheit aber klagt alles an, und der Sünder ist durch sein eigenes Herz in Brand gesetzt und kann sein Angesicht nicht zum Richter erheben.'
  revised_footnotes:
  - marker: a
    text: Der griechische Wortlaut in den Versen 3–4 ist textlich und syntaktisch schwierig. Besonders die Wendung „in der Brust ihrer Gebeine“ sowie die Aussage, dass ein Mensch die Werke der Menschen „an sich nehmen“ könne, sind nicht sicher zu erklären. Die Übersetzung folgt dem überlieferten Wortlaut möglichst eng, ohne die Unklarheiten durch eine weitergehende Deutung aufzulösen.
    reason: textual_variant
  revision_rationale: Die Revision folgt dem vorgelegten griechischen α-Text, nicht der abweichend erweiterten englischen Audit-Fassung. Sie bewahrt die moralisch-geistliche Gegenüberstellung von Wahrheit und Täuschung, die offene Stellung des Gewissens und die forensische Schlussszene. In den beschädigt oder schwer verständlich überlieferten Versen 3–4 wird keine zusätzliche Aussage über Gottes Kenntnis oder die Unverborgenheit menschlicher Taten eingeführt. Vers 5 gibt das Bild des durch das eigene Herz Entflammten näher am griechischen Passiv wieder.
