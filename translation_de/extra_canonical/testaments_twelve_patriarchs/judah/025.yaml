  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/025.yaml
  text: '1. And after these things Abraham and Isaac and Jacob will rise to life, and I and my brothers will be chiefs of the tribes in Israel: Levi first, I second, Joseph third, Benjamin fourth, Simeon fifth, Issachar sixth, and so all the rest in order.


    2. And the Lord blessed Levi, but the angel of the presence blessed me; the powers of glory, Simeon; heaven, Reuben; the earth, Issachar; the sea, Zebulun; the mountains, Joseph; the tent, Benjamin; the lights, Dan; delight, Naphtali; the sun, Gad; the moon, Asher.


    3. And you will be the Lord’s people, with one language, and there will not be there a spirit of Belial’s deceit, because it will be thrown into the fire forever.


    4. And those who died in sorrow will rise in joy, and the poor for the Lord’s sake will be made rich, and those dying for the Lord’s sake will awake to life.


    5. And the deer of Joseph will run in exultation, and the eagles of Israel will fly in joy, and all the peoples will glorify the Lord forever.'
translation:
  language: de
  text: '**Testament Judas 25**


    **1** Danach werden Abraham, Isaak und Jakob zum Leben auferstehen. Auch ich und meine Brüder werden Anführer in Israel sein: Levi als Erster, ich als Zweiter, Josef als Dritter, Benjamin als Vierter, Simeon als Fünfter, Issachar als Sechster und alle Übrigen der Reihe nach.


    **2** Und der Herr segnete Levi; der Engel seiner Gegenwart segnete mich; die Mächte der Herrlichkeit Simeon; der Himmel Ruben; die Erde; das Meer Josef[a]; die Himmelslichter Dan; die Wonne Naftali; die Sonne Gad und der Mond Asser.


    **3** Ihr werdet das Volk des Herrn sein und eine einzige Sprache haben. Dort wird es keinen Geist der Verführung Belials mehr geben, denn er wird für immer hineingeworfen werden.[b]


    **4** Auch die, die in Trauer gestorben sind, werden auferstehen; die Armen werden um des Herrn willen reich gemacht werden, und die um des Herrn willen sterben, werden zum Leben erwachen.


    **5** Die Hirsche Jakobs werden jubelnd laufen, und die Adler Israels werden voll Freude fliegen. [Die Gottlosen aber werden trauern, und die Sünder werden weinen.][c] Alle Völker werden den Herrn für immer verherrlichen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text ist hier offenbar beschädigt oder verkürzt. Wörtlich folgt auf »die Erde« unmittelbar »das Meer Josef«. In einer vollständigeren Aufzählung werden gewöhnlich weitere Namen und Bereiche ergänzt; sie stehen jedoch nicht im hier zugrunde gelegten griechischen Text.
    reason: Die syntaktische Störung und wahrscheinliche Textlücke müssen sichtbar bleiben, statt die vollständigere englische Rekonstruktion stillschweigend einzusetzen.
  - marker: b
    text: 'Wörtlich: »denn er wird für die Ewigkeit hineingeworfen werden«. Ein Ziel wie »ins Feuer« wird im vorgelegten griechischen Text nicht genannt.'
    reason: Die deutsche Hauptfassung muss verständlich sein, zugleich aber die ungewöhnliche und möglicherweise unvollständige griechische Formulierung dokumentieren.
  - marker: c
    text: Der Satz über die Gottlosen und Sünder ist in der griechischen Ausgabe als textlich unsicher gekennzeichnet.
    reason: Die eckigen Klammern der Quelle zeigen eine Überlieferungsunsicherheit an; der Satz wird nicht ausgelassen, aber entsprechend markiert.
lexical_decisions:
- source_word: ἔξαρχοι
  choice: Anführer
  rationale: Bezeichnet führende oder an der Spitze stehende Personen. Der griechische Text nennt hier weder ausdrücklich Stämme noch Zepter.
- source_word: ὁ ἄγγελος τοῦ προσώπου
  choice: der Engel seiner Gegenwart
  rationale: Die idiomatische Formulierung bewahrt den Bezug auf Gottes Gegenwart; das Possessivpronomen verdeutlicht im Deutschen den im Kontext vorausgesetzten Bezug auf den Herrn.
- source_word: αἱ δυνάμεις τῆς δόξης
  choice: die Mächte der Herrlichkeit
  rationale: Die formale Wiedergabe lässt offen, ob himmlische Mächte oder personifizierte Kräfte gemeint sind.
- source_word: πνεῦμα πλάνης
  choice: Geist der Verführung
  rationale: πλάνη kann Irrtum, Irreführung oder Verführung bezeichnen; im Zusammenhang mit Belial ist die aktive und moralische Dimension von »Verführung« angemessen.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Gibt die dauerhafte Zeitangabe natürlich wieder, ohne das im vorgelegten griechischen Text nicht vorhandene »Feuer« zu ergänzen.
- source_word: οἱ ἔλαφοι Ἰακώβ
  choice: die Hirsche Jakobs
  rationale: Folgt dem vorgelegten griechischen Text, der Jakob und nicht Josef liest.
- source_word: ἐν ἀγαλλιάσει
  choice: jubelnd
  rationale: Natürliche deutsche Wiedergabe für freudigen Jubel oder Frohlocken.
theological_decisions:
- issue: Auferstehung der Erzväter und der in Trauer Gestorbenen
  choice: »zum Leben auferstehen« beziehungsweise »auferstehen«
  alternative: die Aussagen als bloße nationale Wiederherstellung oder als bildliche Erneuerung deuten
  rationale: Der Text verwendet ἀναστήσεται/ἀναστήσονται und nennt ausdrücklich ζωή; die Übersetzung bewahrt die konkrete Auferstehungssprache, ohne ein weitergehendes Lehrsystem einzutragen.
- issue: Endgültiges Geschick des Geistes der Verführung
  choice: »für immer hinausgeworfen werden«
  alternative: »für immer ins Feuer geworfen werden«
  rationale: Im bereitgestellten griechischen Quelltext stehen ἐμβληθήσεται εἰς τὸν αἰῶνα, aber weder πῦρ noch eine entsprechende Feuerangabe. Die schwierig klingende Aussage wird nicht nach der englischen Konsultationsfassung ergänzt.
- issue: »um des Herrn willen« in Vers 4
  choice: Die kausale beziehungsweise hingebungsbezogene Offenheit bleibt erhalten
  alternative: ausschließlich Märtyrertum oder ausschließlich göttliche Belohnung gemeint sein lassen
  rationale: διά mit Akkusativ erlaubt »um ... willen«; der Zusammenhang nennt sowohl Arme als auch Sterbende, ohne die genaue Beziehung dogmatisch festzulegen.
- issue: Belial
  choice: Eigenname »Belial« beibehalten
  alternative: mit »Verderbtheit«, »Nichtsnutzigkeit« oder »Teufel« übersetzen
  rationale: Der griechische Text behandelt Βελιάρ als Namen. Eine eindeutige Gleichsetzung würde eine über den Wortlaut hinausgehende Deutung eintragen.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Satzführung. Die listenartige, feierliche Struktur bleibt erhalten. Ellipsen in Vers 2 werden soweit möglich natürlich ergänzt, doch die offenkundige Textstörung wird weder harmonisiert noch durch Angaben aus der englischen Konsultationsfassung aufgefüllt.
