lexical_decisions:
- source_word: Τέκνα μου
  choice: Meine Kinder
  rationale: Gibt die direkte, väterliche Anrede natürlich und würdevoll wieder.
- source_word: ἡ φιλαργυρία
  choice: die Geldgier
  rationale: Bezeichnet nicht Geld an sich, sondern ein habgieriges Verlangen nach Geld; „Geldgier“ ist im modernen Deutschen prägnant und verständlich.
- source_word: πρὸς εἰδωλολατρίαν ὁδηγεῖ
  choice: führt zum Götzendienst
  rationale: Bewahrt die Bewegungs- und Zielrichtung von ὁδηγεῖ πρός. „Götzendienst“ gibt εἰδωλολατρία idiomatisch und inhaltlich genau wieder.
theological_decisions:
- issue: Verhältnis von Geldgier und Götzendienst
  choice: führt zum Götzendienst
  alternative: ist Götzendienst
  rationale: Der griechische Text beschreibt eine hinführende Wirkung und setzt beides nicht ausdrücklich gleich; diese Spannung wird bewahrt.
translation_notes:
  register: Modernes, klares Standarddeutsch mit knapper, mahnender und würdevoller Aussage. Keine Fußnoten erforderlich.
