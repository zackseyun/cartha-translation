revisions:
- from: Denn selbst wenn jemand König ist und Unzucht treibt, wird er seiner Königsherrschaft beraubt, weil er sich zum Sklaven der Unzucht gemacht hat – so, wie es auch mir ergangen ist.
  to: Denn selbst wenn jemand König ist und Unzucht treibt, wird er seiner Königsherrschaft beraubt, da er der Unzucht als Sklave gedient hat, wie auch ich gelitten habe.
  rationale: Die Revision erhält Satzbau, Register, die Wiederholung von „Unzucht“ und die enge Verknüpfung von Verfehlung und Verlust der Königsherrschaft. Sie gibt zugleich das aktive Sklavendienst-Bild von δουλεύσας ohne zusätzliche Selbstverursachung wieder und übersetzt ἔπαθον mit seinem leidvollen Sinn.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:14:56Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur und die Wiederholung von πορνεύῃ/πορνείᾳ sind zutreffend wiedergegeben. Zwei Nuancen benötigen jedoch Korrektur: δουλεύσας ist aktiv und bezeichnet das Dienen als Sklave, nicht ein reflexives Sich-selbst-zum-Sklaven-Machen; ἔπαθον bedeutet hier ausdrücklich „erlitten habe“ und nicht lediglich „erfahren/ergangen ist“.'
  naturalness: Der Satz ist in modernem, würdigem Standarddeutsch gut lesbar. „Der Unzucht als Sklave dienen“ bewahrt das griechische Bild und bleibt dabei idiomatisch verständlich.
  terminology: „Unzucht“ ist als knappe, registergerechte Wiedergabe des Wortfelds πορνεία vertretbar und erhält die beabsichtigte Wiederholung. „Königsherrschaft“ gibt βασιλεία im vorliegenden Zusammenhang angemessen wieder.
  issues:
  - severity: medium
    issue: „weil er sich zum Sklaven der Unzucht gemacht hat“ verschiebt die Aussage von δουλεύσας.
    rationale: Das griechische Aktivpartizip bedeutet, dass der Betreffende der Unzucht als Sklave dient bzw. ihr verfallen ist. Die reflexiv-kausative deutsche Formulierung fügt die nicht ausgedrückte Aussage hinzu, er habe sich selbst dazu gemacht.
  - severity: medium
    issue: „so, wie es auch mir ergangen ist“ schwächt ἔπαθον ab.
    rationale: πάσχω bezeichnet Leiden bzw. Erleiden. Die Übersetzung sollte den leidvollen Charakter des persönlichen Verweises Judas nicht neutralisieren.
  revised_text: Denn selbst wenn jemand König ist und Unzucht treibt, wird er seiner Königsherrschaft beraubt, da er der Unzucht als Sklave gedient hat, wie auch ich gelitten habe.
