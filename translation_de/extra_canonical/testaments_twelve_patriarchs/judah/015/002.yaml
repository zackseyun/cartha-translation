source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Κἂν γάρ τις *βασιλεὺς ἐστι² καὶ πορνεύῃ, γυμνοῦται τῆς βασιλείας*, δουλεύσας τῇ πορνείᾳ⁶ ὡς κἀγὼ ἔπαθον⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/002.yaml
  text: For even if a man is a king and commits sexual immorality, he is stripped of his kingship, having been enslaved to sexual immorality, as I also suffered.
translation:
  language: de
  text: Denn selbst wenn jemand König ist und Unzucht treibt, wird er seiner Königsherrschaft beraubt, da er der Unzucht als Sklave gedient hat, wie auch ich gelitten habe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνεύῃ / πορνείᾳ
  choice: Unzucht treibt / Unzucht
  rationale: Gibt den sexuellen Sinn des griechischen Wortfeldes knapp und würdevoll wieder und bewahrt durch die Wiederholung die rhetorische Verknüpfung des Ausgangstextes.
- source_word: γυμνοῦται τῆς βασιλείας
  choice: wird seiner Königsherrschaft beraubt
  rationale: Überträgt das bildhafte ‚entblößt/entkleidet werden‘ idiomatisch als Verlust der königlichen Herrschaft, ohne den Gedanken auf einen bloßen Titel zu verengen.
- source_word: δουλεύσας
  choice: weil er sich zum Sklaven … gemacht hat
  rationale: Bewahrt das starke Bild der Versklavung und gibt das Partizip als begründenden Begleitumstand wieder.
- source_word: ὡς κἀγὼ ἔπαθον
  choice: so, wie es auch mir ergangen ist
  rationale: Natürliches Deutsch für Judas persönlichen Hinweis auf das, was er selbst erlitt bzw. erfuhr.
theological_decisions:
- issue: Verhältnis zwischen Unzucht und Verlust der Königsherrschaft
  choice: Die Aussage bleibt als unmittelbare Folge formuliert.
  alternative: Die Aussage ausdrücklich als allgemeines göttliches Strafgesetz oder als bloße persönliche Erfahrung deuten.
  rationale: Der griechische Text verbindet beide Gedanken eng, erläutert aber weder den genauen Mechanismus noch die allgemeine Reichweite; diese Spannung wird nicht dogmatisch aufgelöst.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die Wiederholung von „Unzucht“ und das drastische Sklavenbild wurden bewusst erhalten.
