  source_fidelity: Die zentrale Bildsprache von γυμνούμενος („entblößt werden“) ist im Entwurf zutreffend bewahrt. Die beiden griechischen Partizipien stehen jedoch jeweils begleitend zu den Hauptaussagen; „wenn er seine Ehre verliert“ macht ἀδοξῶν unnötig bedingend und weniger parallel zum ersten Satzteil. Eine explizite Wiedergabe als gegenwärtiger Vorgang ist genauer.
  naturalness: Die Revision ist modernes, würdiges Standarddeutsch. „Merkt nicht, dass er entblößt wird“ ist idiomatischer und semantisch unmittelbarer als „merkt nicht, wie er entblößt wird“.
  terminology: „Unzucht“ ist im biblisch-ethischen Register eine vertretbare knappe Wiedergabe von πορνεύειν; die Fußnote erläutert den weiteren Bedeutungsumfang. „In Unehre gerät“ gibt ἀδοξῶν angemessen wieder, ohne die Art der Entehrung näher festzulegen.
  issues:
