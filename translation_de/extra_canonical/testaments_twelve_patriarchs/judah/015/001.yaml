base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/001.yaml
  text: The one who commits sexual immorality, while being ruined, does not perceive it; and while being dishonored, he is not ashamed.
translation:
  language: de
  text: Wer Unzucht treibt[a], merkt nicht, dass er entblößt wird; und während er in Unehre gerät, schämt er sich nicht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Kann auch heißen: „Wer Unzucht begangen hat.“ Der griechische Ausdruck bezeichnet allgemein sexuelles Fehlverhalten.'
    reason: Der Fußnotenanker der Quellenausgabe wird beibehalten. Die Anmerkung erläutert die mögliche aoristische Nuance und den allgemeinen Bedeutungsumfang, ohne eine bestimmte Form des Verhaltens festzulegen.
lexical_decisions:
- source_word: ὁ πορνεύσας
  choice: Wer Unzucht treibt
  rationale: Das substantivierte Aoristpartizip bezeichnet verallgemeinernd eine Person, die sich sexuell unmoralisch verhält. Die präsentische deutsche Form gibt den sprichwortartigen Charakter natürlich wieder.
- source_word: γυμνούμενος
  choice: wie er entblößt wird
  rationale: Das griechische Partizip bedeutet wörtlich „entblößt/nackt gemacht werdend“. Die Bildsprache bleibt erhalten, statt sie deutend auf „zugrunde gerichtet“ zu verengen.
- source_word: οὐκ αἰσθάνεται
  choice: merkt nicht
  rationale: Gibt das Wahrnehmen oder Bemerken in klarem, natürlichem Deutsch wieder.
- source_word: ἀδοξῶν
  choice: wenn er seine Ehre verliert
  rationale: Das Partizip beschreibt das Geraten in Ehrlosigkeit beziehungsweise Ansehensverlust. Die Formulierung ist idiomatisch und wahrt den Gegensatz zur anschließenden Scham.
- source_word: οὐκ αἰσχύνεται
  choice: schämt er sich nicht
  rationale: Direkte und natürliche Wiedergabe des griechischen Verbs.
theological_decisions:
- issue: Deutung der Entblößung
  choice: Die konkrete Metapher „entblößt wird“ bleibt im Text stehen.
  alternative: „zugrunde gerichtet wird“ oder „ruiniert wird“
  rationale: Das Griechische nennt ausdrücklich das Entblößtwerden. Ob dies Verlust, Bloßstellung oder Verderben versinnbildlicht, soll nicht einseitig festgelegt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit sprichwortartigem Satzbau. Die konkrete griechische Bildsprache des Entblößens wird bewahrt; „Unzucht“ ist knapp und im biblisch-ethischen Zusammenhang verständlich, wird aber durch die Fußnote erläutert.
