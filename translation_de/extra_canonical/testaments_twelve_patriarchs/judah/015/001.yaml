    issue: Die Wendung „wie er entblößt wird“ ist gegenüber dem griechischen Partizip leicht mehrdeutig.
    rationale: „Wie“ kann im Deutschen die Art und Weise statt die Tatsache des Entblößtwerdens nahelegen. „Dass er entblößt wird“ gibt die nicht wahrgenommene Tatsache klar wieder.
  - severity: medium
    issue: „Wenn er seine Ehre verliert“ gibt ἀδοξῶν als Bedingung bzw. möglichen Einzelfall wieder.
    rationale: Das Partizip bezeichnet parallel zu γυμνούμενος einen begleitenden Zustand oder Vorgang. „Während er in Unehre gerät“ erhält diese Parallelität und wahrt die Bildlichkeit von Verlust an Ansehen.
  - severity: low
    issue: Die Fußnote bezeichnet die Erklärung als „Wörtlich“, obwohl „sexuell unmoralisch gehandelt hat“ keine enge wörtliche Übersetzung ist.
    rationale: Eine Formulierung mit „Kann auch heißen“ erläutert die aoristische Verbform genauer und vermeidet den Anspruch einer nicht ganz wörtlichen Wiedergabe.
