- from: 'Und tatsächlich: Nachdem ich diese Dinge bereut hatte, aß ich bis ins hohe Alter weder Fleisch noch trank ich Wein, und ich erlebte keinerlei Freude.'
  to: Und wahrlich, nachdem ich diese Dinge bereut hatte, nahm ich bis zu meinem Alter weder Wein noch Fleisch zu mir, und ich erlebte keinerlei Freude.
  rationale: Die Revision entfernt die nicht im Ausgangstext enthaltene Verstärkung „hoch“, wahrt die griechische Reihenfolge von Wein und Fleisch und glättet die deutsche Satzführung. Die idiomatische Wiedergabe von οὐκ ἔφαγον mit „nahm ... zu mir“ vermeidet die im Deutschen unnatürliche Aussage, Wein zu essen, ohne den Verzicht abzuschwächen.
