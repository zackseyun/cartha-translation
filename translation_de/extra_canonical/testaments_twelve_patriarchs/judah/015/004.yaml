  text: Καίγε *μετανοήσας ἐπὶ τούτοις¹⁴, οἶνον καὶ κρέα¹⁶ οὐκ¹⁷ ἔφαγον ἕως γήρους¹⁹ μου²⁰, καὶ *πᾶσαν εὐφροσύνην²¹ οὐκ εἶδον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/004.yaml
  text: And indeed, having repented concerning these things, I ate neither wine nor meat until my old age, and I saw no joy at all.
translation:
  language: de
  text: Und wahrlich, nachdem ich diese Dinge bereut hatte, nahm ich bis zu meinem Alter weder Wein noch Fleisch zu mir, und ich erlebte keinerlei Freude.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: Und tatsächlich
  rationale: Gibt die verstärkende und bestätigende Funktion der Partikelverbindung natürlich wieder.
- source_word: μετανοήσας ἐπὶ τούτοις
  choice: Nachdem ich diese Dinge bereut hatte
  rationale: Bewahrt den Sinn von μετάνοια als Reue und Umkehr; der temporale Nebensatz gibt das vorzeitige Aoristpartizip idiomatisch wieder.
- source_word: οἶνον καὶ κρέα οὐκ ἔφαγον
  choice: aß ich weder Fleisch noch trank ich Wein
  rationale: Im Griechischen regiert ἔφαγον sowohl Wein als auch Fleisch, doch im Deutschen wird Wein idiomatisch getrunken. Die Reihenfolge wurde für die natürliche Verbindung mit „aß“ angepasst.
- source_word: ἕως γήρους μου
  choice: bis ins hohe Alter
  rationale: Natürliches modernes Deutsch für die zeitliche Angabe; gemeint ist die Lebensphase des Alters.
- source_word: πᾶσαν εὐφροσύνην οὐκ εἶδον
  choice: ich erlebte keinerlei Freude
  rationale: „Freude sehen“ wäre im Deutschen unnatürlich; „erleben“ vermittelt die idiomatische Bedeutung, während „keinerlei“ die umfassende Verneinung erhält.
theological_decisions:
- issue: Bedeutung von μετανοήσας
  choice: bereut hatte
  alternative: umgekehrt war / meinen Sinn geändert hatte
  rationale: Im Kontext bezeichnet das Verb nicht bloß einen neutralen Sinneswandel, sondern Reue über das zuvor Geschilderte. „Bereuen“ wahrt diesen moralischen Gehalt, ohne eine weitergehende Lehrdeutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht ungewöhnliche griechische Verbindung von „essen“ mit Wein wurde idiomatisch aufgelöst; die Aussage über den Verzicht bleibt vollständig erhalten.
