source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Δέδωκα⁸ γὰρ τὴν ῥάβδον μου, τουτέστι⁹ τὸ στήριγμα τῆς ἐμῆς φυλῆς¹⁰, καὶ τὴν ζώνην μου, τουτέστιν¹¹ τὴν δύναμιν, καὶ τὸ διάδημα¹², τουτέστιν¹³ τὴν δόξαν τῆς βασιλείας μου¹⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/003.yaml
  text: I gave my staff—that is, the support of my tribe—and my belt—that is, my strength—and my diadem—that is, the glory of my kingdom.
translation:
  language: de
  text: Denn ich habe meinen Stab gegeben – das heißt die Stütze meines Stammes –, meinen Gürtel – das heißt meine Kraft – und mein Diadem – das heißt die Herrlichkeit meines Königtums.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδος
  choice: Stab
  rationale: Gibt den konkreten Gegenstand wieder und bewahrt zugleich seine im Text ausdrücklich erklärte symbolische Bedeutung.
- source_word: στήριγμα
  choice: Stütze
  rationale: Entspricht der Bedeutung von Halt bzw. tragender Stütze und passt zur Bildsprache des Stabes.
- source_word: φυλή
  choice: Stamm
  rationale: Bezeichnet hier Judas Stammesverband, nicht lediglich eine allgemeine Volksgruppe.
- source_word: ζώνη
  choice: Gürtel
  rationale: Die direkte und natürliche Wiedergabe des konkreten Kleidungsstücks.
- source_word: δύναμις
  choice: Kraft
  rationale: Bewahrt den weiten Sinn von Stärke oder Macht, ohne die Symbolik unnötig festzulegen.
- source_word: διάδημα
  choice: Diadem
  rationale: Bezeichnet das königliche Stirnband bzw. Herrschaftszeichen genauer als das allgemeinere Wort „Krone“.
- source_word: δόξα
  choice: Herrlichkeit
  rationale: Gibt die königliche Pracht, Ehre und Hoheit des Ausdrucks in würdigem Deutsch wieder.
- source_word: βασιλεία
  choice: Königtum
  rationale: Passt hier zur persönlichen königlichen Würde und Herrschaft Judas; „Reich“ würde stärker das beherrschte Gebiet bezeichnen.
theological_decisions:
- issue: Symbolische Deutung der drei hingegebenen Gegenstände
  choice: Die drei Erläuterungen werden als ausdrückliche Gleichsetzungen des Erzählers beibehalten.
  alternative: Die Symbole freier deuten oder ihre möglichen theologischen Bezüge ausformulieren.
  rationale: Das Griechische erklärt jeden Gegenstand selbst mit τουτέστι(ν); weitergehende Deutungen wären nicht ausdrücklich im Vers enthalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreigliedrige Parallelstruktur des griechischen Satzes bleibt erhalten; Gedankenstriche machen die eingeschobenen Erläuterungen klar lesbar.
