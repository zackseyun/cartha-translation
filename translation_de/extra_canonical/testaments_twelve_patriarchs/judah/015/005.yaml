revisions:
- from: Und der Engel Gottes zeigte mir, dass Frauen den König in ihrer Gewalt haben und über den Armen herrschen. Die Frauen nehmen dem König seine Herrlichkeit, dem Mann seine Kraft und dem Armen selbst den geringsten Halt in seiner Armut.[a]
  to: Und der Engel Gottes zeigte mir, dass Frauen den König in ihrer Gewalt haben und über den Armen herrschen. Die Frauen nehmen dem König seine Herrlichkeit, dem Mann seine Kraft und dem Armen den geringsten Halt in seiner Armut.[a]
  rationale: Die Revision entfernt allein die nicht erforderliche Verstärkung „selbst“. Sie wahrt die Ambiguität des schwierigen griechischen Schlussglieds und behält die sachgerechte Abweichung vom englischen Audittext bei, dessen „forever“ im angegebenen griechischen Text keine Grundlage hat.
