base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/015/005.yaml
  text: And the angel of God showed me that women rule forever over king and beggar alike, and they take away a king's glory and a strong man's might and the poor man's support.
translation:
  language: de
  text: Und der Engel Gottes zeigte mir, dass Frauen den König in ihrer Gewalt haben und über den Armen herrschen. Die Frauen nehmen dem König seine Herrlichkeit, dem Mann seine Kraft und dem Armen den geringsten Halt in seiner Armut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut des letzten Satzglieds ist grammatisch bzw. syntaktisch unregelmäßig; wörtlich steht ungefähr: „das geringste Stützmittel der Armut“.'
    reason: Die Fußnote macht die Schwierigkeit der überlieferten Formulierung transparent, ohne den Haupttext unnötig unverständlich zu machen.
lexical_decisions:
- source_word: κρατοῦσι τοῦ βασιλέως
  choice: den König in ihrer Gewalt haben
  rationale: κρατέω mit Genitiv bezeichnet hier das Beherrschen oder In-der-Gewalt-Haben; diese Wiedergabe ist im Deutschen natürlich und wahrt die Aussage des griechischen Textes.
- source_word: κατακυριεύουσιν ... τοῦ πτωχοῦ
  choice: über den Armen herrschen
  rationale: κατακυριεύω bezeichnet ein machtvolles Herrschen über jemanden. „Der Arme“ gibt πτωχός präzise wieder; ein „Bettler“ ist nicht zwingend gemeint.
- source_word: δόξαν
  choice: Herrlichkeit
  rationale: δόξα kann Ruhm, Ehre oder Herrlichkeit bezeichnen. „Herrlichkeit“ bewahrt den gehobenen Ton und lässt die semantische Breite bestehen.
- source_word: τοῦ ἀνδρὸς τὴν δύναμιν
  choice: dem Mann seine Kraft
  rationale: Der griechische Text sagt schlicht „des Mannes Kraft“; die englische Präzisierung zu einem „starken Mann“ wird nicht übernommen, da sie nicht ausdrücklich im Ausgangstext steht.
- source_word: ἐλάχιστον στήριγμα
  choice: den geringsten Halt
  rationale: ἐλάχιστος bedeutet „geringster/kleinster“, στήριγμα einen Halt oder eine Stütze. Die Formulierung bleibt nahe am Wortlaut und ist zugleich verständlich.
theological_decisions:
- issue: Reichweite der Herrschaft der Frauen
  choice: Zwei parallele Aussagen über König und Armen
  alternative: „Frauen herrschen für immer über König und Bettler gleichermaßen“
  rationale: Das im englischen Konsultationstext enthaltene „forever“ hat im vorgelegten griechischen Text keine erkennbare Entsprechung. Der griechische Satz nennt getrennt den König und den Armen und verwendet dafür zwei Herrschaftsverben.
- issue: Bezeichnung des Engels
  choice: „der Engel Gottes“
  alternative: „ein Engel Gottes“
  rationale: Der bestimmte Artikel ὁ spricht für die bestimmte Wiedergabe; eine weitergehende Identifizierung des Engels wird vermieden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Frauen/Die Frauen“ bildet die Betonung und Satzstruktur des griechischen Textes ab. Nicht belegte Zusätze des englischen Konsultationstextes wurden nicht übernommen.
