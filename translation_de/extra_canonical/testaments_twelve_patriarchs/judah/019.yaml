  text: My children[b][a], the love of money leads to idolatry.
translation:
  language: de
  text: '**Testament Judas 19**


    **1** Meine Kinder, die Geldliebe führt zum Götzendienst, denn im Wahn des Geldes nennt man solche, die keine Götter sind, Götter; und sie bringt den, der sie hat, außer sich.


    **2** Um des Geldes willen verlor ich, meine Kinder, meine Kinder. Und wären mir nicht meine Umkehr, meine Demut und die Gebete meines Vaters zu Hilfe gekommen, wäre ich kinderlos gestorben.


    **3** Doch der Gott meiner Väter erbarmte sich meiner, weil ich dies aus Unwissenheit getan hatte.


    **4** Denn der Herrscher des Irrwahns hatte mich verblendet, und als ein Mensch, als Fleisch, das in Sünden verdorben war, wusste ich nicht Bescheid; und ich erkannte meine eigene Schwäche, während ich meinte, unbesiegbar zu sein.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Der griechische Satzbau ist gedrängt. Das Partizip am Schluss kann den Gedanken zeitlich, begründend oder gegensätzlich näher bestimmen; daher ist auch möglich: „… und erkannte meine eigene Schwäche, da ich meinte, unbesiegbar zu sein.“'
    reason: syntactic_ambiguity
lexical_decisions:
- source_word: φιλαργυρία
  choice: Geldliebe
  rationale: Das griechische Kompositum bezeichnet ausdrücklich die Liebe zu Silber beziehungsweise Geld. „Geldliebe“ wahrt diese konkrete Bedeutung besser als das allgemeinere „Habgier“.
- source_word: πρὸς εἰδωλολατρίαν ὁδηγεῖ
  choice: führt zum Götzendienst
  rationale: ὁδηγεῖ drückt ausdrücklich ein Hinführen aus; πρὸς bezeichnet das Ziel. „Götzendienst“ ist im heutigen Deutsch verständlich und gibt εἰδωλολατρία prägnant wieder.
- source_word: ἐν πλάνῃ ἀργυρίου
  choice: im Wahn des Geldes
  rationale: 'πλάνη kann Irrtum, Verführung oder Wahn bezeichnen. Der Genitiv bleibt mehrdeutig: Das Geld kann Quelle oder Gegenstand des Wahns sein. Die knappe deutsche Wendung bewahrt diese Offenheit.'
- source_word: εἰς ἔκστασιν ἐμπεσεῖν
  choice: außer sich bringen
  rationale: ἔκστασις bezeichnet ein Heraustreten aus dem normalen geistigen Zustand. „Außer sich bringen“ ist natürliches Deutsch und vermeidet die heute oft positiv-mystische Färbung von „Ekstase“.
- source_word: συνεδράμον
  choice: zu Hilfe gekommen
  rationale: Das Verb bedeutet wörtlich „mitlaufen/zusammenlaufen“ und hier sinngemäß unterstützend eingreifen. Die deutsche Wendung gibt die resultierende Hilfe idiomatisch wieder.
- source_word: ἐν ἀγνωσίᾳ
  choice: aus Unwissenheit
  rationale: Die Wendung bezeichnet Handeln in Unkenntnis. „Aus Unwissenheit“ wahrt den im Kontext genannten Grund, ohne ihn als vollständige Entschuldigung auszulegen.
- source_word: ὁ ἄρχων τῆς πλάνης
  choice: der Herrscher des Irrwahns
  rationale: ἄρχων wird formal als „Herrscher“ wiedergegeben. „Irrwahn“ hält die moralisch-geistige Dimension von πλάνη fest, ohne den Herrscher ausdrücklich mit einer nicht genannten Gestalt gleichzusetzen.
- source_word: ἀκαταμάχητος
  choice: unbesiegbar
  rationale: Das Adjektiv bedeutet „nicht zu bezwingen“. „Unbesiegbar“ ist klar und bewahrt den Gegensatz zur erkannten eigenen Schwäche.
theological_decisions:
- issue: Verhältnis von Geldliebe und Götzendienst
  choice: „die Geldliebe führt zum Götzendienst“
  alternative: „die Geldliebe ist Götzendienst“
  rationale: Der überlieferte Text enthält mit ὁδηγεῖ ein Verb des Hinführens und mit πρός eine Zielrichtung. Er behauptet daher eine enge ursächliche Beziehung, setzt beides aber nicht ausdrücklich gleich.
- issue: Bezeichnung der nichtigen Götter
  choice: „nennt man solche, die keine Götter sind, Götter“
  alternative: „nennt man die Nichtgötter Götter“
  rationale: Die Wiederholung erhält die scharfe theologische Gegenüberstellung des Griechischen und bleibt zugleich verständliches Deutsch.
- issue: Identität des „Herrschers des Irrwahns“
  choice: Die Bezeichnung bleibt unaufgelöst stehen.
  alternative: Explizite Identifizierung mit Satan oder dem Teufel
  rationale: Der griechische Text nennt keine ausdrückliche Identität. Eine solche Festlegung würde mehr sagen als die Quelle.
- issue: Zusammenwirken von Umkehr, Demütigung und väterlichem Gebet
  choice: Alle drei werden gleichgeordnet als zu Hilfe kommend wiedergegeben.
  alternative: Eine der Größen als alleinige Ursache der Rettung hervorheben
  rationale: Das pluralische συνεδράμον bezieht die aufgezählten Größen gemeinsam ein. Die Übersetzung bewahrt dieses spannungsvolle Zusammenwirken, ohne ein dogmatisches Wirkmodell einzutragen.
- issue: Unwissenheit und Erbarmen
  choice: Gottes Erbarmen wird im Text mit Judas Handeln aus Unwissenheit verbunden.
  alternative: Unwissenheit als vollständige Schuldlosigkeit oder als theologisch unerheblich deuten
  rationale: ὅτι stellt den Zusammenhang her, erklärt jedoch nicht abschließend, wie Unwissenheit, Schuld und Erbarmen zueinander stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit testamentarisch-mahnendem Ton. Direkte Familienanrede als „meine Kinder“; keine geschlechtliche Verengung auf „Söhne“. Theologische Titel und Spannungen werden quellengetreu belassen, ohne konfessionelle Ausdeutung. Die Verszählung und alle Fußnotenmarker stehen im Haupttext.
