  naturalness: Die Sprache ist im Wesentlichen modernes, würdiges Standarddeutsch. „Demut“ und „wäre ich kinderlos gestorben“ sind zugleich genauer und idiomatischer. Die Umformung von Vers 4 vermeidet die etwas harte Konstruktion „als Mensch und als Fleisch“.
  terminology: „Geldliebe“, „Götzendienst“, „Umkehr“, „Herrscher des Irrwahns“ und „unbesiegbar“ sind angemessen. „Demut“ entspricht ταπείνωσις besser als „Demütigung“.
