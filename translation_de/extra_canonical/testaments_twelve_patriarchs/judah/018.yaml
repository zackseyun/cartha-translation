base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/018.yaml
  text: '1. The Lord gave me favor because I obeyed my father. 2. Therefore I never grieved Jacob my father, for I did everything he told me. 3. And Abraham my forefather blessed me to reign in Israel, and Jacob blessed me in the same way. 4. And I know what evils you will do in the last days.


    5. Guard yourselves, therefore, my children, from sexual immorality and from the love of money, and listen to Judah your father. 6. For these turn one away from the law of God, and blind the purpose of the soul, and teach arrogance, and do not allow a man to show mercy to his neighbor. 7. They deprive his soul of every goodness, and hold him fast in pains and labors; they drive sleep away from him, and consume his flesh. 8. They hinder the sacrifices of God, and he does not remember the blessing of God. He does not listen when a prophet speaks, and he resents words of godliness. 9. For he is enslaved to two contrary passions, and is not able to obey God, because they have blinded his soul.'
translation:
  language: de
  text: '**Testament Judas 18**


    1. Ich weiß auch, was für Böses ihr in den letzten Tagen[a] tun werdet.


    2. Darum hütet euch, meine Kinder, vor sexueller Unmoral und Geldgier, und hört auf Juda, euren Vater. 3. Denn diese Dinge bringen den Menschen vom Gesetz Gottes ab, verblenden das Urteilsvermögen seiner Seele, lehren ihn Hochmut und hindern ihn daran, seinem Nächsten Barmherzigkeit zu erweisen. 4. Sie berauben seine Seele alles Guten und halten ihn in Mühen und Beschwerden gefangen; sie vertreiben ihm den Schlaf und zehren seinen Leib auf. 5. Sie hindern ihn daran, Gott Opfer darzubringen, und er denkt nicht an Gottes Segen. Wenn ein Prophet spricht, hört er nicht darauf, und Worte der Gottesfurcht sind ihm zuwider. 6. Denn er ist zwei entgegengesetzten Leidenschaften versklavt und kann Gott nicht gehorchen, denn er hat seine Seele verblendet und geht bei Tag wie bei Nacht umher.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „in den letzten Tagen“ stehen in der griechischen Ausgabe in eckigen Klammern und sind daher textkritisch unsicher.
    reason: Die sichtbare Klammerung der Primärquelle signalisiert Unsicherheit, die in der Übersetzung nicht verschwiegen werden soll.
lexical_decisions:
- source_word: πορνεία
  choice: sexuelle Unmoral
  rationale: Der Ausdruck wahrt die breite Bedeutung des griechischen Begriffs und ist im heutigen Deutsch klarer als das enger oder altertümlich verstandene „Unzucht“.
- source_word: φιλαργυρία
  choice: Geldgier
  rationale: Bezeichnet nicht bloß Geldbesitz, sondern eine beherrschende Liebe zum Geld; „Geldgier“ ist knapp und idiomatisch.
- source_word: τὸ διαβούλιον τῆς ψυχῆς
  choice: das Urteilsvermögen seiner Seele
  rationale: διαβούλιον bezeichnet die innere Fähigkeit zum Überlegen und Entscheiden. „Urteilsvermögen“ gibt den Sinn natürlich wieder, ohne ihn auf bloße Absicht zu verengen.
- source_word: ἀγαθότης
  choice: alles Gute
  rationale: Im Zusammenhang bezeichnet das Abstraktum die Gesamtheit sittlicher Güte; diese deutsche Formulierung ist natürlich und umfassend.
- source_word: πόνοις καὶ μόχθοις
  choice: Mühen und Beschwerden
  rationale: Die beiden nahe verwandten Begriffe werden als belastende Anstrengung und leidvolle Mühsal wiedergegeben.
- source_word: λόγους εὐσεβείας
  choice: Worte der Gottesfurcht
  rationale: εὐσέβεια meint hier eine auf Gott ausgerichtete ehrfürchtige Lebenshaltung. „Gottesfurcht“ ist würdig und verständlich, ohne eine bestimmte Frömmigkeitstradition festzulegen.
- source_word: προσοχθίζει
  choice: sind ihm zuwider
  rationale: Das Verb drückt starken Unwillen oder Widerwillen aus; die Formulierung bewahrt die ablehnende Haltung, ohne eine konkrete emotionale Nuance überzubestimmen.
- source_word: ἐν ἡμέρᾳ ὡς ἐν νυκτὶ πορεύεται
  choice: So geht er am hellen Tag umher, als wäre es Nacht
  rationale: Die bildhafte Gegenüberstellung von Tag und Nacht wird unmittelbar und idiomatisch bewahrt.
theological_decisions:
- issue: Bezug der in Vers 3–5 beschriebenen Wirkung
  choice: Die beiden zuvor genannten Laster werden gemeinsam als wirkende Größe wiedergegeben.
  alternative: Die Aussagen ausschließlich auf die Geldgier beziehen.
  rationale: ταῦτα verweist zunächst auf beide genannten Laster. Die späteren Singularformen lassen zwar einen wechselnden oder zusammenfassenden Bezug zu, bestimmen aber nicht zweifelsfrei nur die Geldgier als Subjekt.
- issue: „Opfer Gottes“ in Vers 5
  choice: „ihn daran, Gott Opfer darzubringen“
  alternative: „Gottes Opfer“ oder „die Opfer Gottes“
  rationale: Der griechische Genitiv kann Zugehörigkeit oder Ausrichtung bezeichnen. Im Kontext menschlichen Fehlverhaltens ist die Ausrichtung der Opfer auf Gott die natürlichste Wiedergabe, ohne eine besondere Opfertheologie einzutragen.
- issue: Ursache der Verblendung in Vers 6
  choice: 'Passivisch: „weil seine Seele verblendet worden ist“'
  alternative: „weil es seine Seele verblendet hat“ oder „weil sie seine Seele verblendet haben“
  rationale: ἐτύφλωσε ist aktiv und singular, doch sein Subjekt ist im überlieferten Satz nicht ausdrücklich genannt und der vorausgehende Bezug schwankt zwischen zwei Leidenschaften und einer zusammengefassten Macht. Das deutsche Passiv bewahrt die Aussage und vermeidet eine unbelegte Festlegung des Handelnden.
- issue: Die „zwei entgegengesetzten Leidenschaften“
  choice: Die Spannung des Wortlauts wird unverändert bewahrt.
  alternative: Die Leidenschaften erklärend als sexuelle Unmoral und Geldgier benennen oder ihren Gegensatz auflösen.
  rationale: Der Text bezeichnet sie ausdrücklich als zwei und als entgegengesetzt, erklärt diesen Gegensatz jedoch nicht. Eine Ausdeutung wäre interpretative Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter väterlicher Mahnrede. Altertümliche Wörter wie „Unzucht“ und unnötig fachsprachliche Seelenbegriffe wurden vermieden. Die Bildsprache von Versklavung, Blindheit, Tag und Nacht bleibt erhalten. Die Verszählung folgt dem bereitgestellten griechischen Kapiteltext (1–6), nicht der erweiterten Zählung der englischen Konsultationsfassung.
