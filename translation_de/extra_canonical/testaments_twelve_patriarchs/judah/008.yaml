  to: '**Testament Judas 8**


    **1.** Ich besaß viel Vieh und hatte Hiram, den Adullamiter, als obersten Hirten.


    **2.** Als ich mich bei ihm aufhielt, kam Barsaba, der König von Adullam. Er veranstaltete für uns ein Trinkgelage und drängte mich, seine Tochter namens Saba zur Frau zu nehmen, und gab sie mir.


