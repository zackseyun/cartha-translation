  naturalness: Die Sprache ist modernes, gut lesbares Standarddeutsch und wahrt einen würdigen erzählerischen Ton. „Viel Vieh“ ist hier zugleich idiomatischer und quellennäher als „viele Herden“.
  terminology: „Oberster Hirte“, „Trinkgelage“, „drängte mich“ und „tötete der Herr“ geben die maßgeblichen Begriffe angemessen wieder. Die Namen Hiram, Barsaba, Saba, Er, Onan und Schela folgen entweder dem griechischen Zeugen oder etablierten deutschen biblischen Namensformen, ohne die im Zeugen bestehende Namenslage zu harmonisieren.
