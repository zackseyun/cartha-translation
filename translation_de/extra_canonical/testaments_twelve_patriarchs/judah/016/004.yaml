  text: Wine also reveals the mysteries of God and of men, just as I too revealed to the Canaanite woman the commandments of God and the mysteries of Jacob my father—things that God told me not to reveal.
translation:
  language: de
  text: Auch offenbart der Wein die Geheimnisse Gottes und der Menschen, so wie auch ich der Kanaaniterin die Gebote Gottes und die Geheimnisse Jakobs, meines Vaters, offenbarte – Dinge, die Gott mir sagte, nicht zu offenbaren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: Auch
  rationale: Gibt die ergänzende und leicht hervorhebende Funktion der Partikel natürlich wieder.
- source_word: μυστήρια
  choice: Geheimnisse
  rationale: Entspricht dem griechischen Ausdruck und bewahrt dessen religiöse wie allgemein verborgene Bedeutung.
- source_word: ἀποκαλύπτει / ἀπεκάλυψα / ἀποκαλῦψαι
  choice: enthüllt / enthüllte / offenbaren
  rationale: Die Wortfamilie bezeichnet das Aufdecken von Verborgenem. Die leichte deutsche Variation vermeidet eine schwerfällige dreifache Wiederholung, ohne den Zusammenhang zu verdunkeln.
- source_word: τῇ Χαναναίτιδι
  choice: der Kanaaniterin
  rationale: Präzise feminine Bezeichnung; die Stellung unmittelbar beim Verb wahrt den Bezug des griechischen Dativs.
- source_word: ἃ μοι εἶπεν ὁ Θεὸς μὴ ἀποκαλῦψαι
  choice: Dinge, von denen Gott mir sagte, ich solle sie nicht offenbaren
  rationale: Natürliches modernes Deutsch, das das Verbot im griechischen AcI sachlich und ohne zusätzliche Deutung wiedergibt.
theological_decisions:
- issue: Genitiv in μυστήρια Θεοῦ καὶ ἀνθρώπων
  choice: die Geheimnisse Gottes und der Menschen
  alternative: Geheimnisse über Gott und die Menschen
  rationale: Der griechische Genitiv bleibt mehrdeutig und kann Zugehörigkeit oder Inhalt bezeichnen; die formnahe Wiedergabe löst diese Spannung nicht einseitig auf.
- issue: Bezugsumfang des Relativpronomens ἃ
  choice: Dinge, die beide zuvor genannten Gruppen zusammenfassen
  alternative: Bezug nur auf die Geheimnisse Jakobs
  rationale: Das neutrale Pluralpronomen kann die Gebote und Geheimnisse gemeinsam aufnehmen; die deutsche Sammelbezeichnung erhält diesen möglichen weiten Bezug.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich macht den abschließenden Relativsatz gut erfassbar. Keine Fußnoten erforderlich.
