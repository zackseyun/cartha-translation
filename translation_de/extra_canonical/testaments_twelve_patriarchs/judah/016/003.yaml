revisions:
- from: Wenn ihr aber besonnen leben wollt, dann rührt den Wein überhaupt nicht an, damit ihr euch nicht durch überhebliche Worte, Streit, Verleumdungen und Übertretungen der Gebote Gottes versündigt und vor eurer Zeit umkommt.
  to: Wenn ihr aber besonnen leben wollt, dann rührt den Wein überhaupt nicht an, damit ihr nicht durch anmaßende Worte, Streitigkeiten, Verleumdungen und Übertretungen der Gebote Gottes sündigt und vor eurer Zeit umkommt.
  rationale: Leichte sprachliche Glättung der Aufzählung und präzisere Wiedergabe von ὕβρις. Die Übersetzung folgt beim fehlenden „trinken“ dem bereitgestellten griechischen Text, nicht der davon abweichenden englischen Audit-Fassung.
