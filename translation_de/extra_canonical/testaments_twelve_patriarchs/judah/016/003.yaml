id: T12P.JUD.16.3
reference: Testament of Judah 16:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Εἰ δὲ θέλετε σωφρόνως ζῆσαι, μηδ᾽ ὅλως τοῦ οἴνου ἐφάπτεσθε¹⁵, ἵνα μὴ ἁμαρτήσητε¹⁶ ἐν λόγοις ὕβρεως¹⁷ καὶ μάχαις²⁰ καὶ συκοφαντίαις²¹ καὶ παραβάσεσι²² ἐντολῶν²³ Θεοῦ²⁴, καὶ ἀπολεῖσθε²⁵ οὐκ²⁶ ἐν καιρῷ ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/003.yaml
  text: But if you want to live with self-control, do not touch wine at all, lest you drink and sin in words of insolence and in fights and in slanders and in transgressions of the commandments of God, and perish before your time.
translation:
  language: de
  text: Wenn ihr aber besonnen leben wollt, dann rührt den Wein überhaupt nicht an, damit ihr nicht durch anmaßende Worte, Streitigkeiten, Verleumdungen und Übertretungen der Gebote Gottes sündigt und vor eurer Zeit umkommt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφρόνως ζῆσαι
  choice: besonnen leben
  rationale: Gibt die Bedeutung eines vernünftigen, selbstbeherrschten Lebens in natürlichem modernem Deutsch wieder.
- source_word: μηδ᾽ ὅλως τοῦ οἴνου ἐφάπτεσθε
  choice: rührt den Wein überhaupt nicht an
  rationale: Bewahrt die nachdrückliche und bildhafte Formulierung des Griechischen.
- source_word: ἐν λόγοις ὕβρεως
  choice: durch überhebliche Worte
  rationale: ὕβρις bezeichnet hier anmaßende, verletzende Überheblichkeit; die Wendung bleibt nah an der griechischen Form.
- source_word: συκοφαντίαις
  choice: Verleumdungen
  rationale: Bezeichnet falsche, rufschädigende Anschuldigungen.
- source_word: οὐκ ἐν καιρῷ ὑμῶν
  choice: vor eurer Zeit
  rationale: Gibt die idiomatische Bedeutung eines vorzeitigen Todes wieder, ohne eine genauere Todesfrist einzutragen.
theological_decisions:
- issue: Reichweite der Warnung vor Wein
  choice: Die unbedingte Mahnung dieses Verses wird direkt wiedergegeben.
  alternative: Die Aussage zu einer bloßen Warnung vor übermäßigem Weingenuss abschwächen.
  rationale: Der griechische Text sagt ausdrücklich, man solle Wein überhaupt nicht anrühren; diese Schärfe darf nicht konfessionell oder ethisch geglättet werden.
- issue: Im englischen Beratungstext ergänztes „drink“
  choice: Kein zusätzliches Verb „trinken“ eingefügt.
  alternative: „damit ihr nicht trinkt und sündigt“
  rationale: Im bereitgestellten griechischen Ausgangstext steht nach ἵνα μὴ unmittelbar ἁμαρτήσητε; ein πίνητε ist dort nicht bezeugt. Daher folgt die Übersetzung der vorgelegten Originalsprachengrundlage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Die Aufzählung bleibt straff und der ernste mah­nende Ton des Ausgangstextes wird bewahrt.
