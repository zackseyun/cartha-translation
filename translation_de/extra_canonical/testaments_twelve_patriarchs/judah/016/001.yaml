base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/001.yaml
  text: 'Guard yourselves, therefore, my children, from the boundary of wine; for in it there are four evil spirits: desire, burning passion, debauchery, and shameful gain.'
translation:
  language: de
  text: 'Hütet euch also, meine Kinder, vor dem Übermaß an Wein; denn in ihm sind vier böse Geister: Begierde, brennende Leidenschaft, Ausschweifung und schändliche Gewinnsucht.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν ὅρον τοῦ οἴνου
  choice: vor dem Übermaß an Wein
  rationale: ὅρος bezeichnet wörtlich eine Grenze oder ein Maß. Im Zusammenhang mit der Warnung vor Wein gibt „Übermaß“ den gemeinten Grenzbereich im natürlichen Deutschen wieder, ohne Wein an sich ausdrücklich zu verurteilen.
- source_word: ἐπιθυμίας
  choice: Begierde
  rationale: Das Wort bezeichnet starkes Verlangen oder Begehren; „Begierde“ bewahrt hier den negativen Sinn der Aufzählung.
- source_word: πυρώσεως
  choice: entflammte Leidenschaft
  rationale: πύρωσις meint ein Brennen oder Entflammen und wird hier bildlich auf leidenschaftliche Erregung bezogen.
- source_word: ἀσωτίας
  choice: Ausschweifung
  rationale: Der Begriff umfasst zügelloses, verschwenderisches und liederliches Verhalten; „Ausschweifung“ passt zum Kontext des Weingenusses.
- source_word: αἰσχροκερδίας
  choice: schändliche Gewinnsucht
  rationale: Das Kompositum verbindet schändliches Verhalten mit Streben nach Gewinn; „Gewinnsucht“ bildet diesen Erwerbsaspekt genauer ab als bloß „Gier“.
theological_decisions:
- issue: Die vier bösen Geister im Wein
  choice: Die personale beziehungsweise geistliche Redeweise „vier böse Geister“ wird unverändert bewahrt.
  alternative: Die Ausdrücke als rein psychologische Folgen des Alkohols wiedergeben.
  rationale: Der griechische Text spricht ausdrücklich von πνεύματα πονηρά; ob dies personale Geister oder personifizierte Laster meint, wird nicht entschieden.
- issue: Reichweite der Warnung vor Wein
  choice: „vor dem Übermaß an Wein“
  alternative: „vor der Grenze des Weines“ oder eine pauschale Warnung „vor Wein“
  rationale: Die Formulierung wahrt den Maß- beziehungsweise Grenzgedanken von ὅρος und vermeidet es, aus dem Vers entweder ein ausdrückliches Abstinenzgebot oder eine unverständliche wörtliche Wendung zu machen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Anrede „meine Kinder“ und die viergliedrige Lasterreihe bleiben erhalten; die Bildsprache von Geist und Feuer wird nicht rationalisiert.
