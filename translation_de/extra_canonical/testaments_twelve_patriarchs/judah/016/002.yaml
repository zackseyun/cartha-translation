    issue: Die Fußnote erklärt αἰδούμενος als „der sich ... zurückhält“ und bietet eine syntaktisch missglückte wörtliche Wiedergabe.
    rationale: Das Partizip αἰδούμενος bedeutet „sich schämen“, „schamhaft/bescheiden sein“ und nicht primär reflexiv „sich zurückhalten“. Zudem hat ἐστὶ αἰδούμενος ein implizites singularisches Subjekt; „ist einer, der ...“ bildet dies nicht korrekt ab.
  - severity: low
