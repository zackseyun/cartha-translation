  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/016/002.yaml
  text: If you drink wine in gladness, be modest with the fear of God. For if, in gladness, the fear of God departs, then drunkenness follows, and shamelessness slips in.
translation:
  language: de
  text: Wenn ihr in Freude Wein trinkt, dann trinkt ihn zurückhaltend, in Ehrfurcht vor Gott.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Wenn ihr in Freude Wein trinkt, ist [er] in Gottesfurcht schamhaft/bescheiden.“ Nach dem Plural „ihr trinkt“ folgt im Griechischen „ist“ mit einem maskulinen Partizip im Singular; das Subjekt bleibt dabei unausgedrückt. Der Haupttext gibt die syntaktisch auffällige Form sinngemäß als Aufforderung wieder.'
    reason: Die Anmerkung dokumentiert sowohl die Singular-Anomalie als auch das Bedeutungsspektrum von αἰδούμενος, ohne die im Deutschen notwendige Glättung zu verschleiern.
lexical_decisions:
- source_word: ἐν εὐφροσύνῃ
  choice: in Freude
  rationale: Gibt die positive Bedeutung von εὐφροσύνη knapp und natürlich wieder, ohne sie zu Übermut oder Ausgelassenheit zu verschärfen.
- source_word: αἰδούμενος
  choice: mit Zurückhaltung
  rationale: Das Partizip bezeichnet hier ein von Schamgefühl, Bescheidenheit oder ehrfürchtiger Scheu bestimmtes Verhalten. „Mit Zurückhaltung“ passt idiomatisch zum Weintrinken und vermeidet die heute leicht missverständliche Aufforderung „seid schamhaft“.
- source_word: μετὰ φόβου Θεοῦ
  choice: in Ehrfurcht vor Gott
  rationale: φόβος kann Furcht bezeichnen, meint in diesem ethischen Zusammenhang aber zugleich ehrfürchtige Gottesachtung. Die Formulierung bewahrt diesen religiösen Sinn in natürlichem modernem Deutsch.
theological_decisions:
- issue: Verhältnis von Freude, Wein und Gottesfurcht
  choice: Die Freude am Wein wird nicht verworfen, sondern durch Zurückhaltung und Ehrfurcht vor Gott begrenzt.
  alternative: Den Satz als grundsätzliches Verbot freudigen Weintrinkens wiederzugeben.
  rationale: Der griechische Bedingungssatz setzt das Weintrinken in Freude voraus und fordert dabei eine bestimmte Haltung; ein Verbot steht nicht im Text.
- issue: Zusätzliche Aussagen der englischen Konsultationsfassung
  choice: Nur den im bereitgestellten griechischen Ausgangstext belegten Satz aufnehmen.
  alternative: Den englischen Zusatz über Trunkenheit und Schamlosigkeit ebenfalls in den Haupttext übernehmen.
  rationale: Dieser Zusatz ist in dem für diesen Vers übermittelten griechischen Text nicht vorhanden und darf daher nicht ohne weitere Quellenbelege als Übersetzung aufgenommen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede im Plural wird beibehalten. „Ehrfurcht vor Gott“ ist idiomatischer als „Furcht Gottes“, während „Zurückhaltung“ den ethischen Ton des griechischen αἰδούμενος wahrt.
