  text: 1[a]. And on the next day we went to Areta, a city still mighty and strong, threatening us with death. 2. But I and Gad attacked from the east of the city, and Reuben and Levi from the west. 3. And those on the wall, thinking that we were alone[b], were drawn out toward us. 4. So my brothers secretly, from both sides of the wall, climbed it with stakes and entered the city without their knowing it. 5. And we took it by the edge of the sword, and those who had fled for refuge in the towers we burned with fire; and so we captured them all. 6. And as we were departing, men of Thapphoue fell upon our captives; and after handing them over to our sons, we joined battle with them as far as Thapphoue. 7. And we killed them also, and burned the city[c], and everything in it.
translation:
  language: de
  text: "**Testament Judas 5**\n\n1 Am folgenden Tag zogen wir nach Areta, einer mächtigen Stadt, die uns mit dem Tod drohte. Ich und Gad rückten von Osten her gegen die Stadt vor, Ruben und Levi aber von Westen her.  \n2 Die auf der Mauer meinten, wir seien allein, und wurden zu uns herangezogen.  \n3 Und die Mauer sprang auf.[a]  \n4 So drangen meine Brüder heimlich von beiden Seiten der Mauer in die Stadt ein.  \n5 Wir nahmen sie mit der Schärfe des Schwertes ein; diejenigen, die in den Turm geflohen waren, verbrannten wir mit Feuer. So nahmen wir alle gefangen und alles, was ihnen gehörte.  \n6 Als wir abzogen, bemächtigten sich Männer aus Babue[b] unserer Gefangenen. Als wir das sahen, nahmen wir den Kampf mit ihnen auf.  \n7 Wir töteten sie alle und gewannen unsere Gefangenen wieder."
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text lautet wörtlich: „Und die Mauer sprang auf.“ Die Aussage ist im Zusammenhang schwer verständlich; möglicherweise ist der Text beschädigt, oder es liegt eine anders zu verstehende Überlieferung zugrunde.'
    reason: textual_difficulty
  - marker: b
    text: Die Lesung des Ortsnamens „Babue“ ist unsicher. Andere Textformen überliefern abweichende Namen.
    reason: textual_variant
lexical_decisions:
- source_word: κραταιάν
  choice: mächtig
  rationale: Das Adjektiv bezeichnet Stärke oder Macht. Die vorgelegte griechische α-Fassung enthält hier nur ein Adjektiv; deshalb wird die Doppelung der englischen Konsultationsfassung nicht übernommen.
- source_word: ἀπειλοῦσαν ἡμῖν θάνατον
  choice: die uns mit dem Tod drohte
  rationale: Bewahrt die partizipiale Aussage und den ausdrücklich tödlichen Charakter der Drohung in natürlichem Deutsch.
- source_word: προσέφθημεν
  choice: kamen … zuerst an
  rationale: προφθάνω bezeichnet hier das Zuvorkommen beziehungsweise frühere Eintreffen. Das militärisch stärkere „griffen an“ ist in der vorgelegten griechischen Form nicht ausdrücklich enthalten.
- source_word: ἐφειλκύσθησαν πρὸς ἡμᾶς
  choice: ließen sie sich zu uns herauslocken
  rationale: Gibt die auf die Angreifer gerichtete, taktisch bewirkte Bewegung wieder. „Heraus-“ verdeutlicht im Kontext, dass die Männer ihre Stellung auf der Mauer verließen.
- source_word: λάθρα
  choice: heimlich
  rationale: Eine klare, gegenwärtige Wiedergabe des unbemerkten beziehungsweise verborgenen Vorgehens.
- source_word: ἐξ ἑκατέρων τῶν μερῶν τοῦ τείχους
  choice: von beiden Seiten der Mauer
  rationale: Gibt die räumliche Verteilung knapp und natürlich wieder, ohne die in dieser griechischen Fassung nicht genannten Pfähle oder Pflöcke einzufügen.
- source_word: ἐν στόματι μαχαίρας
  choice: mit der Schärfe des Schwertes
  rationale: Bewahrt das traditionelle Bild vom „Mund“ beziehungsweise der Schneide des Schwertes in verständlichem, gehobenem Deutsch.
- source_word: τοὺς ἐν τῷ πύργῳ καταφυγόντας
  choice: diejenigen, die sich in den Turm geflüchtet hatten
  rationale: Folgt dem Singular πύργῳ und erhält den Gedanken der Flucht an einen Zufluchtsort.
- source_word: πάντας ἐλάβομεν, καὶ πάντα τὰ αὐτῶν
  choice: nahmen wir alle gefangen und bemächtigten uns ihres gesamten Besitzes
  rationale: Unterscheidet die Personen von „allem, was ihnen gehörte“, statt den zweiten Gegenstand auszulassen.
- source_word: αἰχμαλωσίαν
  choice: Kriegsbeute
  rationale: Der Singular bezeichnet hier wahrscheinlich das im Krieg Weggeführte oder Erbeutete insgesamt. Dass dieselbe Sache am Ende zurückgewonnen wird, spricht für „Kriegsbeute“; die mögliche Bedeutung „Gefangene“ bleibt kontextuell offen.
- source_word: συνῆψαν πόλεμον μετ᾽ αὐτῶν
  choice: nahmen wir den Kampf mit ihnen auf
  rationale: Gibt die feste militärische Verbindung idiomatisch wieder.
theological_decisions:
- issue: Unklarer Satz ἀνεπήδησεν τὸ τεῖχος
  choice: Da sprang die Mauer auf.
  alternative: Da sprang er auf die Mauer / Da sprangen sie auf die Mauer.
  rationale: In der überlieferten Form ist „die Mauer“ grammatisch das Subjekt. Die wörtliche, aber im Zusammenhang schwer verständliche Aussage wird im Haupttext bewahrt und ihre Unsicherheit in einer Fußnote offengelegt, statt stillschweigend ein menschliches Subjekt einzusetzen.
- issue: Umfang der Einnahme und der Beute
  choice: Alle Personen und ihr gesamter Besitz werden ausdrücklich unterschieden.
  alternative: Nur „wir nahmen sie alle gefangen“.
  rationale: Die α-Fassung enthält sowohl πάντας als auch πάντα τὰ αὐτῶν. Die vollständige Wiedergabe erhält die Härte und den Umfang der Kriegserzählung, ohne sie zu mildern oder auszubauen.
- issue: Identität der Männer in Vers 7
  choice: Männer aus Babue
  alternative: Männer von Babue / die Männer Babues
  rationale: Der schwer gesicherte Eigenname wird als Ortsbezeichnung verstanden, aber nicht mit dem abweichenden Namen der englischen Konsultationsfassung harmonisiert.
- issue: Gegenstand von αἰχμαλωσία
  choice: Kriegsbeute
  alternative: Gefangene
  rationale: Das Wort kann das Gefangene beziehungsweise die Gefangenschaft oder allgemeiner Kriegsbeute bezeichnen. Der parallele Rückgewinn derselben Sache am Schluss legt hier „Kriegsbeute“ nahe, ohne eine rein gegenständliche Bedeutung dogmatisch festzuschreiben.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, erzählendem Register. Die Übersetzung folgt vorrangig der vorgelegten griechischen α-Fassung und übernimmt keine Erweiterungen der englischen Konsultationsfassung, die dort nicht belegt sind. Gewalttätige Handlungen werden sachlich und unbeschönigt wiedergegeben; textliche Unsicherheiten werden nicht harmonisiert, sondern markiert.
