    rationale: προσέφθημεν enthält in der vorgelegten Textform keine eindeutig wiederzugebende Angabe, dass sie vor den anderen ankamen. „Zuerst“ ist daher eine unbelegte Ergänzung.
  - severity: medium
    issue: „Kriegsbeute“ für αἰχμαλωσία
    rationale: Das Wort bezeichnet hier am wahrscheinlichsten die gefangenen Personen; dies wird auch durch die englische Audit-Fassung („our captives“) gestützt. Die Übersetzung als Sachbeute verengt bzw. verschiebt den Sinn.
  - severity: low
    issue: Versgliederung weicht von der Quelle ab
    rationale: Der Entwurf verteilt die sieben Quellverse auf einzelne Sätze anders. Eine quellengerechte Nummerierung erleichtert Nachprüfbarkeit und Fußnotenbezug.
