revisions:
- from: '**Testament Judas 5**


    1 Am folgenden Tag zogen wir nach Areta, einer mächtigen Stadt, die uns mit dem Tod drohte. 2 Ich und Gad kamen von der Ostseite der Stadt her zuerst an, Ruben und Levi aber von Westen. 3 Als die Männer auf der Mauer sahen, dass wir allein waren, ließen sie sich zu uns herauslocken. 4 Da sprang die Mauer auf.[a] 5 So drangen meine Brüder heimlich von beiden Seiten der Mauer in die Stadt ein. 6 Wir nahmen sie mit der Schärfe des Schwertes ein. Diejenigen, die sich in den Turm geflüchtet hatten, verbrannten wir mit Feuer. So nahmen wir alle gefangen und bemächtigten uns ihres gesamten Besitzes. 7 Als wir abzogen, brachten Männer aus Babue[b] unsere Kriegsbeute in ihre Gewalt. Als wir das sahen, nahmen wir den Kampf mit ihnen auf. Wir töteten sie alle und gewannen unsere Kriegsbeute zurück.'
  to: "**Testament Judas 5**\n\n1 Am folgenden Tag zogen wir nach Areta, einer mächtigen Stadt, die uns mit dem Tod drohte. Ich und Gad rückten von Osten her gegen die Stadt vor, Ruben und Levi aber von Westen her.  \n2 Die auf der Mauer meinten, wir seien allein, und wurden zu uns herangezogen.  \n3 Und die Mauer sprang auf.[a]  \n4 So drangen meine Brüder heimlich von beiden Seiten der Mauer in die Stadt ein.  \n5 Wir nahmen sie mit der Schärfe des Schwertes ein; diejenigen, die in den Turm geflohen waren, verbrannten wir mit Feuer. So nahmen wir alle gefangen und alles, was ihnen gehörte.  \n6 Als wir abzogen, bemächtigten sich Männer aus Babue[b] unserer Gefangenen. Als wir das sahen, nahmen wir den Kampf mit ihnen auf.  \n7 Wir töteten sie alle und gewannen unsere Gefangenen wieder."
  rationale: Die Fassung folgt vorrangig dem überlieferten griechischen α-Text und übernimmt keine in dieser Vorlage nicht enthaltenen Erweiterungen aus abweichenden englischen Textformen. Die militärische Bewegung wird ohne die Zusatzannahme eines früheren Eintreffens wiedergegeben. αἰχμαλωσία wird in beiden Vorkommen konsistent als „Gefangene“ übersetzt. Die unverständliche Aussage über die Mauer wird nicht harmonisiert, sondern wörtlich wiedergegeben und erläutert.
