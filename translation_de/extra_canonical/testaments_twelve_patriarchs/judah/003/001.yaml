source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Ὅτε δὲ¹ *ἦλθον² οἱ δύο βασιλεῖς τῶν Χαναναίων τεθωρακισμένοι³ ἐπὶ τὰ *ποίμνια ἡμῶν⁴ καὶ λαὸς πολὺς⁵ *μετ᾽ αὐτῶν⁶, *κἀγὼ μόνος⁷ δραμὼν ἐπὶ τὸν βασιλέα⁸ †τὸν ἕνα⁹ καὶ κατεσπάραξα τὰ ὀστᾶ αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003/001.yaml
  text: And when the two kings of the Canaanites came in armor against our flocks, with many people with them, I alone ran at one of the kings; and striking him on the shins, I brought him down and so killed him.
translation:
  language: de
  text: Als aber die beiden Könige der Kanaaniter in Rüstung gegen unsere Herden heranzogen und viel Volk bei ihnen war, lief ich allein auf den einen König[a] zu und zertrümmerte ihm die Knochen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „auf den König, den einen“. Die griechische Wortfolge ist textkritisch unsicher, meint im Zusammenhang aber wahrscheinlich einen der beiden Könige.'
    reason: Das Editionszeichen † bei τὸν ἕνα weist auf eine problematische oder unsichere Lesart hin; die Fußnote bewahrt diese Unsicherheit, ohne den Haupttext unnötig zu belasten.
lexical_decisions:
- source_word: τεθωρακισμένοι
  choice: in Rüstung
  rationale: Gibt den militärischen Sinn des Partizips prägnant und idiomatisch wieder.
- source_word: ἐπὶ τὰ ποίμνια ἡμῶν
  choice: gegen unsere Herden
  rationale: ἐπί bezeichnet hier im Kontext eines bewaffneten Vorgehens die feindliche Ausrichtung gegen die Herden.
- source_word: λαὸς πολύς
  choice: viel Volk
  rationale: Bewahrt die kollektive und leicht feierliche Ausdrucksweise des griechischen Textes, ohne die Gruppe enger als ‚Heer‘ zu bestimmen.
- source_word: δραμὼν ἐπὶ τὸν βασιλέα
  choice: lief … auf den König zu
  rationale: Gibt sowohl die schnelle Bewegung von δραμών als auch die Zielrichtung von ἐπί natürlich wieder.
- source_word: κατεσπάραξα τὰ ὀστᾶ αὐτοῦ
  choice: zertrümmerte ihm die Knochen
  rationale: 'Folgt dem vorgelegten griechischen Wortlaut direkt: κατασπαράσσω bezeichnet ein gewaltsames Zerreißen oder Zerschmettern, und τὰ ὀστᾶ αὐτοῦ bedeutet ‚seine Knochen‘. Die englische Konsultationsfassung setzt hier offenbar eine abweichende Textgrundlage oder Rekonstruktion voraus.'
