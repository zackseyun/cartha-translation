base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003/003.yaml
  text: And I found Achor, a giant man, shooting arrows. Leaping up, I took a stone of sixty litras and hurled it; I struck the horse and killed him.
translation:
  language: de
  text: Und ich traf Achor, den König, einen Riesen, an, wie er vom Pferd aus nach vorn und nach hinten Pfeile schoss. Da hob ich einen sechzig Litra[a] schweren Stein auf, traf damit das Pferd und tötete ihn[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Litra war eine antike Gewichtseinheit; ihr genauer Wert konnte je nach Zeit und Ort variieren.
    reason: Die unbekannte antike Maßeinheit wird beibehalten und knapp erläutert, ohne eine Scheingenauigkeit durch moderne Umrechnung zu erzeugen.
  - marker: b
    text: Das griechische Pronomen lässt offen, ob Achor oder das Pferd getötet wurde.
    reason: Bewahrt eine echte grammatische Mehrdeutigkeit des Ausgangstextes, die im Deutschen sonst leicht unbemerkt aufgelöst würde.
lexical_decisions:
- source_word: Ἀχὼρ βασιλέα γίγαντα
  choice: Achor, den König, einen Riesen
  rationale: Gibt sowohl den im griechischen Text vorhandenen Königstitel als auch γίγαντα wieder; die appositionale Form bewahrt die syntaktische Beziehung.
- source_word: βάλλοντα τόξα
  choice: Pfeile schoss
  rationale: Natürliches modernes Deutsch für die griechische Wendung; τόξα kann in diesem Zusammenhang metonymisch die Geschosse des Bogens bezeichnen.
- source_word: ἔμπροσθεν καὶ ὄπισθεν ἐφ᾽ ἵππου
  choice: vom Pferd aus nach vorn und nach hinten
  rationale: Bewahrt die auffällige Aussage, dass Achor in beide Richtungen vom Pferd aus schoss.
- source_word: ἀνελάμενος λίθον
  choice: hob … einen Stein auf
  rationale: ἀναλαμβάνω bedeutet hier aufnehmen bzw. aufheben; die englische Wiedergabe „Leaping up“ wird vom griechischen Wortlaut nicht hinreichend gestützt.
- source_word: δέδωκα τῷ ἵππῳ
  choice: traf damit das Pferd
  rationale: Die wörtliche Formulierung „gab [ihn] dem Pferd“ bezeichnet im erzählerischen Zusammenhang einen mit dem Stein ausgeführten Schlag oder Wurf; „traf“ ergibt idiomatisches Deutsch ohne die konkrete Wurfbewegung zusätzlich festzulegen.
- source_word: ἑξήκοντα λιτρῶν
  choice: sechzig Litra schwer
  rationale: Bewahrt die antike Maßeinheit, statt sie mit einer unsicheren modernen Umrechnung zu ersetzen.
theological_decisions:
- issue: Bezugswort von αὐτόν in ἀπέκτεινα αὐτόν
  choice: „tötete ihn“ mit erklärender Fußnote
  alternative: „tötete Achor“ oder „tötete das Pferd“
  rationale: Im Griechischen sind sowohl ἵππος als auch Achor grammatisch maskulin, sodass das Pronomen den Getöteten nicht eindeutig bestimmt. Die Übersetzung bewahrt diese Mehrdeutigkeit.
translation_notes:
  register: Moderne, würdige Erzählsprache. „traf … an, wie“ bildet εὗρον mit Partizip natürlich ab. Der schwierige und textkritisch markierte griechische Wortlaut wird lesbar wiedergegeben, ohne den Königstitel auszulassen oder die unklare Identität des Getöteten stillschweigend festzulegen.
