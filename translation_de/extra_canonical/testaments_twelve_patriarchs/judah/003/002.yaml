  text: '*Τὸν δὲ¹⁰ ἕτερον βασιλέα *τὸν Ταφούα¹¹ καθήμενον ἐπὶ *τοῦ ἵππου¹² *ἀνεῖλον¹³, καὶ οὕτως πάντα τὸν λαὸν αὐτοῦ¹⁴ διεσκόρπισα.'
