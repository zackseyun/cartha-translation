  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003/002.yaml
  text: And the other king, Taphou, while he was sitting on the horse, I killed; and so I scattered all his people.
translation:
  language: de
  text: Den anderen König aber, Taphou, tötete ich, während er auf dem Pferd saß; und so zerstreute ich sein ganzes Volk.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεῖλον
  choice: tötete ich
  rationale: Gibt das Aoristverb in diesem Kampfzusammenhang unmittelbar und natürlich wieder, ohne die Art der Tötung näher festzulegen.
- source_word: καθήμενον ἐπὶ τοῦ ἵππου
  choice: während er auf dem Pferd saß
  rationale: Bewahrt die Gleichzeitigkeit des Partizips und folgt dem bestimmten Artikel, ohne einen im Griechischen nicht ausdrücklich genannten Besitzer hinzuzufügen.
- source_word: πάντα τὸν λαὸν αὐτοῦ
  choice: sein ganzes Volk
  rationale: Gibt sowohl πάντα als auch das possessive αὐτοῦ knapp und idiomatisch wieder.
- source_word: διεσκόρπισα
  choice: zerstreute ich
  rationale: Entspricht der Grundbedeutung des Verbs und passt zum militärischen Zusammenhang.
