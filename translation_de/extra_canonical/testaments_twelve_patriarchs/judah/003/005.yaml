  text: And while I was stripping off his breastplate, behold, eight men, his companions, began to fight me.
translation:
  language: de
  text: Während ich ihm den Brustpanzer auszog – siehe, da begannen acht Männer, seine Gefährten, gegen mich zu kämpfen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν δὲ τῷ ἐκδύειν με τὸν θώρακα αὐτοῦ
  choice: Während ich ihm den Brustpanzer auszog
  rationale: Die griechische Konstruktion bezeichnet eine gleichzeitig ablaufende Handlung. „Ihm … auszog“ gibt den Bezug von αὐτοῦ natürlich wieder; θώραξ ist hier ein Brustpanzer.
- source_word: ἰδού
  choice: siehe
  rationale: Das Aufmerksamkeitssignal bleibt in würdigem, bibelnahem Deutsch ausdrücklich erhalten.
- source_word: ἄνδρες ὀκτώ, ἑταῖροι αὐτοῦ
  choice: acht Männer, seine Gefährten
  rationale: Die appositionale Struktur des Griechischen wird bewahrt. „Gefährten“ entspricht ἑταῖροι ohne eine speziell militärische Funktion hinzuzufügen.
- source_word: ἤρξαντο πολεμεῖν με
  choice: begannen … gegen mich zu kämpfen
  rationale: Gibt sowohl den Beginn der Handlung als auch den gegen Juda gerichteten Kampf klar und idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem bibelnahen Ton. Die auffällige Interjektion „siehe“ und die Apposition „seine Gefährten“ wurden zur Wahrung der griechischen Erzählstruktur beibehalten.
