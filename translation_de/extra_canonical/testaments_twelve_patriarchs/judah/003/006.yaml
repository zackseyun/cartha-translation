id: T12P.JUD.3.6
reference: Testament of Judah 3:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Ἐνελύθην³⁶ δὲ ἐγὼ³⁷ τὴν στολήν μου *ἐπὶ τὴν χεῖρά μου³⁸ καὶ³⁹ σφενδονήσας αὐτοὺς λίθοις⁴⁰ τέσσαρας ἐξ αὐτῶν *ἀνεῖλον⁴¹, *οἱ δὲ λοιποὶ⁴² ἔφυγον.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003/006.yaml
  text: But I wrapped my garment around my arm and slung four stones at them; from behind and in front around the waist of one seated on a horse, I picked up a stone of sixty litras and hurled it, struck the horse, and killed it. And I fought King Nahor for about two hours, and after smashing the shield into pieces, I cut off his feet, and so I killed him.
translation:
  language: de
  text: Ich aber wickelte mein Gewand um meinen Arm[a] und schleuderte Steine auf sie. Vier von ihnen tötete ich; die übrigen flohen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »um meine Hand«; das griechische Wort kann auch den Arm bezeichnen.'
    reason: Bewahrt die lexikalische Spannweite von χείρ, während der Haupttext die im Zusammenhang natürlichere deutsche Formulierung verwendet.
lexical_decisions:
- source_word: Ἐνελύθην … τὴν στολήν μου
  choice: wickelte mein Gewand
  rationale: Gibt das Umschlingen beziehungsweise Umwickeln mit dem Gewand natürlich wieder. Obwohl die überlieferte Verbform formal passiv ist, verlangt die Konstruktion hier sinngemäß eine Handlung Judas.
- source_word: ἐπὶ τὴν χεῖρά μου
  choice: um meinen Arm
  rationale: χείρ kann Hand oder Arm bezeichnen; beim Umwickeln mit einem Gewand ist im Deutschen »Arm« anschaulicher und idiomatischer. Die wörtliche Möglichkeit wird in der Fußnote bewahrt.
- source_word: σφενδονήσας αὐτοὺς λίθοις
  choice: schleuderte Steine auf sie
  rationale: σφενδονάω bezeichnet das Schleudern beziehungsweise Bewerfen, häufig mit einer Schleuder. Da im Satz keine Schleuder ausdrücklich genannt wird, wird sie nicht ergänzt.
- source_word: τέσσαρας ἐξ αὐτῶν ἀνεῖλον
  choice: Vier von ihnen tötete ich
  rationale: Bewahrt Zahl, Bezugsgruppe und die klare Bedeutung von ἀναιρέω in diesem Kampfzusammenhang.
- source_word: οἱ δὲ λοιποὶ ἔφυγον
  choice: die übrigen flohen
  rationale: Direkte und natürliche Wiedergabe des griechischen Gegensatzes.
theological_decisions:
- issue: Abweichung der englischen Konsultationsfassung vom bereitgestellten griechischen Text
  choice: Nur den im griechischen Ausgangstext belegten Inhalt übersetzen
  alternative: Die zusätzlichen Einzelheiten über den Reiter, den schweren Stein und König Nahor aus der englischen Fassung übernehmen
  rationale: Diese Einzelheiten stehen nicht im angegebenen griechischen Text von Testament Juda 3,6. Eine quellengestützte Übersetzung darf sie daher in diesem Vers nicht ergänzen.
translation_notes:
  register: Modernes, klares und würdiges Standarddeutsch. Die knappe, rasche Kampfschilderung des griechischen Textes bleibt erhalten; unbelegte Inhalte der englischen Konsultationsfassung wurden nicht übernommen.
