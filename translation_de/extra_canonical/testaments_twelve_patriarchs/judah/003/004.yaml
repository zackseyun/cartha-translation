base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/003/004.yaml
  text: And after fighting with Achor for two hours, I killed him; and splitting his shield into two pieces, I chopped off his feet.
translation:
  language: de
  text: Und nachdem ich zwei Stunden lang gegen Achor[a] gekämpft hatte, tötete ich ihn. Dann spaltete ich seinen Schild in zwei Teile und hieb ihm die Füße ab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name „Achor“ ist in der zugrunde gelegten griechischen Ausgabe als textlich unsicher gekennzeichnet.
    reason: Die Edition setzt beim Namen ein textkritisches Unsicherheitszeichen; diese Unsicherheit soll nicht stillschweigend beseitigt werden.
lexical_decisions:
- source_word: πολεμήσας … ἐπὶ ὥρας δύο
  choice: nachdem ich zwei Stunden lang … gekämpft hatte
  rationale: Das Partizip wird als vorzeitige Begleithandlung wiedergegeben; „zwei Stunden lang“ drückt die Zeitdauer im natürlichen Deutschen aus.
- source_word: Ἀχώρ
  choice: Achor
  rationale: Der griechische Eigenname wird in einer im Deutschen gut lesbaren Form transliteriert; die textkritische Kennzeichnung der Edition wird in einer Fußnote bewahrt.
- source_word: εἰς δύο μέρη ποιήσας τὴν ἀσπίδα αὐτοῦ
  choice: spaltete ich seinen Schild in zwei Teile
  rationale: Die wörtliche Wendung „den Schild zu zwei Teilen machen“ bezeichnet hier das Zerteilen des Schildes; die finite Reihung klingt im Deutschen natürlicher und erhält die Handlungsfolge.
- source_word: συνέκοψα τοὺς πόδας αὐτοῦ
  choice: hieb ihm die Füße ab
  rationale: συγκόπτω bezeichnet ein heftiges Ab- oder Zerhauen; „abhauen“ wahrt die Gewaltsamkeit der Handlung, während πόδας direkt mit „Füße“ wiedergegeben wird.
