  verdict: revise
  source_fidelity: Eine sichere Korrektur ist nötig, weil Vers 3 „Kriegstaten“ als Gegenstand von Judas Rühmen einführt, obwohl der griechische Satz dies nicht sagt. Der schwierige und wahrscheinlich gestörte Wortlaut sollte nicht auf diese Weise harmonisiert werden. Außerdem ist ἐν κάλλει γυναικῶν in Vers 5 eher als weibliche/frauliche Pracht denn als „in der ganzen Schönheit einer Frau“ wiederzugeben.
  naturalness: Der Text ist insgesamt modernes, verständliches Standarddeutsch. Die überarbeitete Fassung hält die schwierige Syntax in Vers 3 so lesbar wie möglich und kennzeichnet die verbleibende Uneindeutigkeit in der Fußnote.
  terminology: „Rechtsbestimmungen“, „Gebote“, „Geist“, „sexuelle Unmoral“ und „Lust“ sind sachgerecht und konsistent. „Frauenpracht“ wahrt in Vers 5 den Bild- und Ausstattungscharakter des griechischen Ausdrucks besser.
  issues:
  - severity: medium
    issue: Vers 3 ergänzt „meiner Kriegstaten“ und deutet die griechische Aussage inhaltlich um.
    rationale: ἐγκαυχησάμενος ὅτι ἐν πολέμοις ἠπάτησέ με πρόσωπον γυναικὸς εὐμόρφου nennt keine Kriegstaten als Objekt des Rühmens. Der überlieferte Satz ist schwierig; eine Ergänzung, die das Rühmen auf Heldentaten festlegt, geht über den Text hinaus.
  - severity: low
    issue: 'Vers 5: „in der ganzen Schönheit einer Frau“ ist eine freie und semantisch ungenaue Ausgestaltung.'
    rationale: ἐν κάλλει γυναικῶν bezeichnet weibliche/frauliche Schönheit bzw. Pracht; „Frauenpracht“ gibt dies knapp wieder, ohne „ganzen“ oder eine einzelne Frau einzutragen.
