  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/013.yaml
  text: 'And now I command you[a], my children: hear Judah your father, and keep my words, with thoughts set on doing all the righteous requirements of the Lord and obeying the commands of God.


    Because I boasted that in wars the face of a beautiful woman had not deceived me, and I reproached Reuben my brother concerning Bilhah, my father’s wife, the spirit of jealousy and of sexual immorality arrayed themselves against me, until I sinned with Anan the Canaanite woman and with Tamar my daughter-in-law.


    For I said to my father-in-law, “I will consult my father, and then I will take your daughter.” But he was unwilling; instead, in the name of his daughter, he showed me an immeasurable abundance of gold, for he was a king. And he adorned her with gold and pearls[d][c][b], and made her pour wine for us at the banquet.'
translation:
  language: de
  text: '**Testament Judas 13**


    **1** Und nun gebiete ich euch, meine Kinder: Hört auf Juda, euren Vater,[a] und bewahrt meine Worte, indem ihr alle Rechtsbestimmungen des Herrn erfüllt und den Geboten Gottes gehorcht.


    **2** Folgt nicht euren Begierden und lasst euch nicht vom Hochmut eures Herzens leiten. Rühmt euch auch nicht eurer Taten und der Kraft eurer Jugend; denn auch das ist böse vor dem Herrn.


    **3** Denn auch ich hatte mich meiner Kriegstaten gerühmt; doch das Gesicht einer schönen Frau täuschte mich.[b] Ich machte meinem Bruder Ruben wegen Bilha, der Frau meines Vaters, Vorwürfe. Da trat der Geist der Eifersucht und der sexuellen Unmoral gegen mich an, bis ich mich mit der Kanaaniterin und mit Tamar, meiner Schwiegertochter, versündigte.[c]


    **4** Ich sagte nämlich zu meinem Schwiegervater: »Ich werde meinen Vater um Rat fragen und dann deine Tochter zur Frau nehmen.« Er aber wollte das nicht, sondern zeigte mir als Gabe für sie[d] eine unermessliche Menge Gold; denn er war ein König.


    **5** Er schmückte sie mit Gold und Perlen und ließ sie uns beim Festmahl Wein einschenken, in der ganzen Schönheit einer Frau.


    **6** Der Wein verdrehte mir den Blick, und die Lust verdunkelte mir das Herz.


    **7** Ich verliebte mich in sie und ließ mich mit ihr ein. So übertrat ich das Gebot des Herrn und das Gebot meines Vaters und nahm sie zur Frau.


    **8** Der Herr vergalt mir, was meine Seele ersonnen hatte: An ihren Kindern fand ich keine Freude.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Satzanfang ist sprachlich holprig; gemeint ist offenbar die Aufforderung, auf Juda als ihren Vater zu hören und seine Worte zu bewahren.
    reason: textual_variant
  - marker: b
    text: 'Der griechische Wortlaut dieses Satzes ist unsicher und syntaktisch schwierig. Wörtlich steht etwa: „Denn auch ich, der ich mich gerühmt hatte, dass in Kriegen … das Gesicht einer schönen Frau mich täuschte.“ Die Übersetzung versteht die Kriegstaten als Gegenstand von Judas Selbstvertrauen und den Anblick der Frau als dessen Widerlegung.'
    reason: textual_variant
  - marker: c
    text: Die Wendung, die hier mit „mich … versündigte“ wiedergegeben wird, ist im Griechischen ungewöhnlich und wohl verhüllend. Der vorliegende Text nennt außerdem keinen Namen „Anan“, sondern spricht lediglich von „der Kanaaniterin“.
    reason: lexical_alternative
  - marker: d
    text: Die griechische Wendung „als Gabe für sie“ ist mehrdeutig. Das Gold könnte als Gabe, Mitgift oder im Zusammenhang mit der beabsichtigten Eheschließung vorgezeigt worden sein.
    reason: lexical_alternative
lexical_decisions:
- source_word: φυλάξασθε τοὺς λόγους μου
  choice: bewahrt meine Worte
  rationale: „Bewahren“ erhält sowohl den Gedanken des Festhaltens als auch den des gehorsamen Befolgens und passt zum würdigen testamentarischen Ton.
- source_word: δικαιώματα Κυρίου
  choice: Rechtsbestimmungen des Herrn
  rationale: δικαιώματα bezeichnet verbindliche göttliche Satzungen oder Forderungen. „Rechtsbestimmungen“ unterscheidet den Ausdruck von den unmittelbar folgenden ἐντολαί.
- source_word: ὑπερηφανείᾳ καρδίας
  choice: Hochmut eures Herzens
  rationale: Die feste Wendung gibt die innere Selbstüberhebung natürlich und quellennah wieder.
- source_word: ἔργοις καὶ ἰσχύι τῆς νεότητος
  choice: Taten und der Kraft eurer Jugend
  rationale: Die koordinierte Struktur des Griechischen bleibt erhalten; „Taten“ lässt offen, ob besonders Heldentaten gemeint sind.
- source_word: πνεῦμα τοῦ ζήλου καὶ τῆς πορνείας
  choice: Geist der Eifersucht und der sexuellen Unmoral
  rationale: Die personifizierte Geist-Sprache wird bewahrt. „Sexuelle Unmoral“ gibt πορνεία verständlich wieder, ohne es auf eine einzige sexuelle Verfehlung einzuengen.
- source_word: παρετάξατο ἐπ᾽ ἐμέ
  choice: trat ... gegen mich an
  rationale: Die militärische Metapher bleibt erkennbar und klingt im Deutschen natürlicher als eine wörtliche Wiedergabe mit „in Schlachtordnung aufstellen“.
- source_word: τὴν Χανανανίτην
  choice: die Kanaaniterin
  rationale: Der vorgelegte griechische Text enthält hier eine ethnische Bezeichnung, keinen Eigennamen. Daher wird nicht der im englischen Beratungstext gebotene Name „Anan“ übernommen.
- source_word: εἰς δόσιν αὐτῆς
  choice: als Gabe für sie
  rationale: Die Wendung wird möglichst transparent wiedergegeben. Der genaue Bezug der Gabe im Zusammenhang der Heiratsverhandlung bleibt unsicher und wird in einer Fußnote erläutert.
- source_word: ἡ ἡδονή
  choice: die Lust
  rationale: Im Kontext von Wein, Schönheit und Verführung bezeichnet ἡδονή sinnliches Begehren; „Lust“ ist knapp und deutlich.
- source_word: κατὰ τὸ διαβούλιον τῆς ψυχῆς μου
  choice: was meine Seele ersonnen hatte
  rationale: Die Wiedergabe behält die innere, vorsätzliche Ausrichtung bei und vermeidet eine unnötig technische Formulierung wie „gemäß dem Ratschluss“.
theological_decisions:
- issue: Personifizierte Mächte der Laster
  choice: „der Geist der Eifersucht und der sexuellen Unmoral“ tritt als feindliche Macht gegen Juda an
  alternative: Die Aussage lediglich psychologisch als aufkommende Eifersucht und Begierde wiederzugeben
  rationale: Das Werk stellt Laster wiederholt als im moralischen Kampf handelnde Geister dar. Die Übersetzung wahrt diese theologische und rhetorische Spannung, ohne zu bestimmen, wie ontologisch die Rede zu verstehen ist.
- issue: Schuldcharakter von συνετέλεσα εἰς
  choice: „bis ich mich ... versündigte“
  alternative: „bis ich mit ... verkehrte“ oder formal „bis ich es mit ... vollendete“
  rationale: Die griechische Wendung ist schwierig und euphemistisch. Der Zusammenhang ist ein Schuldbekenntnis; „sich versündigen“ bewahrt diese Wertung, während die Fußnote die sprachliche Unsicherheit offenlegt.
- issue: Vergeltung durch den Herrn
  choice: „Der Herr vergalt mir, was meine Seele ersonnen hatte“
  alternative: „Der Herr vergalt mir nach dem Ratschluss meiner Seele“
  rationale: Die Aussage von göttlicher Vergeltung wird nicht abgeschwächt. Zugleich vermeidet die natürliche Formulierung eine dogmatische Präzisierung des Verhältnisses von innerem Vorsatz, Tat und Folge.
- issue: Judas Verstoß gegen zwei Gebote
  choice: „das Gebot des Herrn und das Gebot meines Vaters“
  alternative: Beide Gebote zu einer allgemeinen Norm zusammenzuziehen
  rationale: Die ausdrückliche doppelte Autorität des griechischen Textes bleibt erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem testamentarischem Ton. Die Imperative sind direkt, aber nicht altertümlich. Bildhafte und personifizierende Redeweisen des griechischen Textes bleiben erhalten. Unsichere oder beschädigte Formulierungen werden nicht stillschweigend harmonisiert, sondern im Haupttext behutsam übersetzt und in den Fußnoten offengelegt.
