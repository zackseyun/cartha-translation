- from: Denn er hatte in einer Vision über mich gesehen, dass ein Engel der Macht mich in allem begleitete, damit ich nicht überwältigt würde.
  to: Denn er sah in einer Vision über mich, dass ein Engel der Macht mich in allem begleitete, damit ich nicht überwältigt würde.
  rationale: Ausschließlich die Tempusform des einleitenden Verbs wurde von Plusquamperfekt zu Präteritum korrigiert. Die übrigen Formulierungen bleiben erhalten, da sie den griechischen Wortlaut, insbesondere die Bedeutung von ἡττᾶσθαι als Unterliegen oder Besiegtwerden, genau und in angemessenem Register wiedergeben.
