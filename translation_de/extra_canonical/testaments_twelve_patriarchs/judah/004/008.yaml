source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: '*Εἶδε⁵⁶ γὰρ⁵⁷ *ἐν ὁράματι⁵⁸ †περὶ ἐμοῦ⁵⁹ ὅτι ἄγγελος δυνάμεως⁶⁰ συνέπεταί μοι⁶¹ ἐν πᾶσι, τοῦ μὴ⁶² ἡττᾶσθαί⁶³ μοι.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/008.yaml
  text: For he saw in a vision concerning me that an angel of power accompanied me in all things, so that I might not be touched.
translation:
  language: de
  text: Denn er sah in einer Vision über mich, dass ein Engel der Macht mich in allem begleitete, damit ich nicht überwältigt würde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄγγελος δυνάμεως
  choice: ein Engel der Macht
  rationale: Bewahrt die Genitivverbindung und ihre mögliche Bedeutung als Engel, der durch Macht gekennzeichnet ist oder zur Macht gehört, ohne sie näher festzulegen.
- source_word: συνέπεταί μοι
  choice: mich begleitete
  rationale: Gibt das Mitgehen bzw. Begleiten natürlich und würdig wieder.
- source_word: ἐν πᾶσι
  choice: in allem
  rationale: Erhält den umfassenden, im Griechischen nicht weiter bestimmten Ausdruck.
- source_word: ἡττᾶσθαί μοι
  choice: damit ich nicht überwältigt würde
  rationale: ἡττάομαι bedeutet besiegt, unterlegen oder überwältigt werden; „berührt werden“ gibt den griechischen Wortlaut hier nicht angemessen wieder.
theological_decisions:
- issue: Art und Wirken des Engels
  choice: Engel der Macht
  alternative: mächtiger Engel
  rationale: Die formale Genitivfügung wahrt die theologische Offenheit des Ausdrucks und deutet ihn nicht bloß als Eigenschaft um.
- issue: Zweck des engelhaften Beistands
  choice: damit ich nicht überwältigt würde
  alternative: damit ich nicht besiegt würde
  rationale: „Überwältigt“ lässt sowohl eine Niederlage als auch ein Unterliegen unter feindlicher Macht zu und bewahrt damit die semantische Spannweite.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der vorzeitige Visionsakt wird mit Plusquamperfekt wiedergegeben; der folgende Inhalt steht in der indirekten Rede. Keine Ergänzung eines ausdrücklich handelnden Gegners.
