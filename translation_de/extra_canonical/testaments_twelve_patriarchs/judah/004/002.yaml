lexical_decisions:
- source_word: ἀνῆλθον
  choice: stieg auf
  rationale: Gibt die Aufwärtsbewegung des Verbs in natürlichem Deutsch wieder.
- source_word: τοῦ τείχους
  choice: die Mauer
  rationale: Der vorgelegte griechische Text hat den bestimmten Singular und bezeichnet eine Befestigungsmauer.
- source_word: ἀνεῖλον
  choice: tötete
  rationale: Entspricht im militärischen Zusammenhang der üblichen Bedeutung von ἀναιρέω.
- source_word: πᾶσαν τὴν αἰχμαλωσίαν
  choice: alle Gefangenen
  rationale: Das Kollektivum bezeichnet hier am ehesten die Gesamtheit der in Gefangenschaft geratenen Menschen; die Formulierung vermeidet das unnatürliche deutsche Abstraktum „die ganze Gefangenschaft“.
- source_word: ἐλάβομεν
  choice: brachten … in unsere Gewalt
  rationale: Gibt das Ergreifen beziehungsweise Inbesitznehmen der Gefangenen idiomatisch wieder und bewahrt den Wechsel von der ersten Person Singular zur ersten Person Plural.
