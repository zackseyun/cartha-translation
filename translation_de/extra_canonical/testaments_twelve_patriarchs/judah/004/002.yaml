  text: Und ich stieg auf die Mauer[a], tötete ihren König, und wir brachten alle Gefangenen in unsere Gewalt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Andere Lesart: „Doppelmauer“.'
