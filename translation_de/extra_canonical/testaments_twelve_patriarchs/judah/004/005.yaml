base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/004/005.yaml
  text: Then my father Jacob killed Belisath, king of all, father of kings, a giant man in strength, twelve cubits tall.
translation:
  language: de
  text: Mein Vater Jakob erschlug Belisath, den König aller Könige, einen Riesen von gewaltiger Kraft, zwölf Ellen groß.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Elle entsprach ungefähr der Länge eines Unterarms; zwölf Ellen wären je nach zugrunde gelegtem Ellenmaß etwa 5 bis 6 Meter.
    reason: Die antike Maßeinheit ist modernen Lesern meist nicht unmittelbar anschaulich; die Spannweite vermeidet eine unberechtigte Festlegung auf ein einziges Ellenmaß.
lexical_decisions:
- source_word: ἀνεῖλε
  choice: erschlug
  rationale: Gibt die gewaltsame Tötung präzise und in einem würdigen erzählerischen Register wieder.
- source_word: βασιλέα πάντων τῶν βασιλέων
  choice: den König aller Könige
  rationale: Folgt der überlieferten griechischen Wortfolge und bewahrt den Superlativanspruch; die englische Ergänzung „father of kings“ hat in diesem griechischen Text keine Entsprechung.
- source_word: ἄνδρα γίγαντα τῇ ἰσχύι
  choice: einen riesenhaften Mann von gewaltiger Kraft
  rationale: Gibt sowohl die Bezeichnung als Riese beziehungsweise riesenhafter Mann als auch seine außergewöhnliche Stärke in natürlichem modernem Deutsch wieder.
- source_word: πηχῶν δώδεκα
  choice: zwölf Ellen groß
  rationale: Der griechische Genitiv bezeichnet ein Maß; im Zusammenhang ist die Körpergröße gemeint. „groß“ macht die im Griechischen knappe Ellipse verständlich.
theological_decisions:
- issue: Königstitel Belisaths
  choice: König aller Könige
  alternative: König über alle Könige; König von allen, Vater von Königen
  rationale: Die gewählte Fassung bildet πάντων τῶν βασιλέων direkt ab, ohne den nicht belegten Gedanken einer Vaterschaft einzuführen oder den außergewöhnlichen Titel theologisch umzudeuten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdig-erzählerischem Ton. Die knappe, übersteigerte Riesendarstellung des griechischen Textes bleibt erhalten; ein im Englischen ergänztes „Dann“ und „Vater von Königen“ wurden mangels griechischer Grundlage nicht übernommen.
