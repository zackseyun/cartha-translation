  text: Therefore my father was free from चिंता in the wars while I was with my brothers.
translation:
  language: de
  text: Darum war mein Vater in den Kriegen unbesorgt, als ich mit meinen Brüdern zusammen war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀμέριμνος
  choice: unbesorgt
  rationale: Gibt den Zustand des Freiseins von Sorge oder Beunruhigung natürlich und knapp wieder, ohne absolute Sorglosigkeit über den unmittelbaren Zusammenhang hinaus zu behaupten.
- source_word: ἐν τοῖς πολέμοις
  choice: in den Kriegen
  rationale: Bewahrt den Plural und die schlichte lokale beziehungsweise situationsbezogene Formulierung des Griechischen.
- source_word: ὅτε
  choice: solange
  rationale: Im Zusammenhang bezeichnet die Konjunktion den Zeitraum, in dem Juda mit seinen Brüdern zusammen war; „solange“ macht diesen zeitlichen Bezug im Deutschen idiomatisch deutlich.
- source_word: σὺν τοῖς ἀδελφοῖς μου
  choice: mit meinen Brüdern zusammen
  rationale: Die Ergänzung „zusammen“ gibt die gemeinschaftliche Bedeutung von σύν in natürlichem Deutsch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit einfacher Satzstruktur. Die Aussage über die Sicherheit des Vaters wird weder psychologisiert noch theologisch erweitert.
