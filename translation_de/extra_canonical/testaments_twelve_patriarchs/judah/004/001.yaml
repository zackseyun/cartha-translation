  text: '*Καὶ μετὰ τοῦτο γέγονεν ἡμῖν κατὰ νότον¹ πόλεμος² *τοῦ ἐν Σικίμοις³· καὶ παραταξάμενοι *σὺν τοῖς ἀδελφοῖς⁴ μου ἐδιώξαμεν⁵ χιλίους⁶ καὶ ἀπεκτείναμεν⁷ ἐξ αὐτῶν διακοσίους⁸ *καὶ τέσσαρας βασιλεῖς⁹.'
