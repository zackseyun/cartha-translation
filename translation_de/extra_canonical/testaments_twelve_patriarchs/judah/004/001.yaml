  text: And after this there came to us a war toward the south, greater than the one at Shechem; and having drawn up in battle with my brothers, we pursued a thousand men and killed two hundred of them, and four kings.
translation:
  language: de
  text: Und danach kam es für uns im Süden zu einem Krieg, der größer war als der bei Sichem. Nachdem wir uns gemeinsam mit meinen Brüdern zum Kampf aufgestellt hatten, verfolgten wir tausend Mann und töteten zweihundert von ihnen sowie vier Könige.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ τοῦτο
  choice: danach
  rationale: Gibt die zeitliche Folge knapp und natürlich wieder.
- source_word: γέγονεν ἡμῖν ... πόλεμος
  choice: kam es für uns ... zu einem Krieg
  rationale: Bewahrt den Ereignischarakter der griechischen Wendung und das betroffene ἡμῖν, ohne unnatürliches Deutsch.
- source_word: κατὰ νότον
  choice: im Süden
  rationale: Natürliche räumliche Wiedergabe; die Formulierung kann eine südliche Gegend oder Richtung bezeichnen.
- source_word: τοῦ ἐν Σικίμοις
  choice: als der bei Sichem
  rationale: Der elliptische Genitiv wird als Vergleich mit dem Krieg bei Sichem verstanden, wie es der überlieferte Textzusammenhang nahelegt.
- source_word: παραταξάμενοι
  choice: stellten wir uns zum Kampf auf
  rationale: Gibt das militärische Aufstellen zur Schlacht idiomatisch und anschaulich wieder.
- source_word: ἐδιώξαμεν
  choice: verfolgten
  rationale: Entspricht dem üblichen militärischen Sinn des Verbs.
- source_word: χιλίους
  choice: tausend Mann
  rationale: Das substantivisch gebrauchte Maskulinum bezeichnet hier eine Anzahl von Kämpfern beziehungsweise Männern.
- source_word: ἀπεκτείναμεν
  choice: töteten
  rationale: Direkte, sachliche Entsprechung ohne abschwächende oder verstärkende Deutung.
- source_word: τέσσαρας βασιλεῖς
  choice: vier Könige
  rationale: Wörtliche und klare Wiedergabe des griechischen Ausdrucks.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer militärischer Erzählweise. Die ungewöhnliche Aussage über zweihundert Getötete und zusätzlich vier Könige bleibt unverändert erhalten. Der Komparativ „größer“ wird gemäß der von Charles durch Sternchen und englische Konsultationsfassung bezeugten Textgestalt wiedergegeben, obwohl er im bereitgestellten fortlaufenden griechischen Wortlaut nicht sichtbar ist.
