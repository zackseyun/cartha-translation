  text: And so we set Hebron free and took all the captives.
translation:
  language: de
  text: Am folgenden Tag zogen wir nach Areta, einer mächtigen Stadt, die uns mit dem Tod drohte. Gad und ich gingen von Osten her gegen die Stadt vor, Ruben und Levi von Westen her. So befreiten wir die Gefangenen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τῇ ἑξῆς
  choice: am folgenden Tag
  rationale: Die Wendung bezeichnet hier den darauffolgenden Tag; die Ergänzung „Tag“ ist im Deutschen für einen natürlichen Satz nötig.
- source_word: Ἀρετάν
  choice: Areta
  rationale: Der griechische Ortsname wird in einer gut lesbaren deutschen Form wiedergegeben; die abweichende Nennung Hebrons in der englischen Konsultationsfassung wird vom vorliegenden griechischen Text nicht gestützt.
- source_word: πόλιν κραταιάν
  choice: einer mächtigen Stadt
  rationale: κραταιός bezeichnet Stärke oder Macht. „Mächtig“ bewahrt die allgemeine Aussage, ohne ungenannte Befestigungen in den Text einzutragen.
- source_word: ἀπειλοῦσαν ἡμῖν θάνατον
  choice: die uns mit dem Tod drohte
  rationale: Dies gibt die personifizierende Ausdrucksweise des Griechischen knapp und idiomatisch wieder.
- source_word: προσέφθημεν ἀπὸ ἀνατολῶν τῆς πόλεως
  choice: rückten der Stadt von Osten her entgegen
  rationale: προφθάνω kann ein Zuvorkommen oder frühes Eintreffen ausdrücken. Im militärischen Zusammenhang vermittelt „rückten … entgegen“ die Bewegung auf die Stadt zu, ohne eine im Deutschen schwer verständliche Rangfolge zu behaupten.
- source_word: ἠλευθερώσαμεν τὴν αἰχμαλωσίαν
  choice: befreiten wir die Gefangenen
  rationale: αἰχμαλωσία kann sowohl Gefangenschaft als auch die Gesamtheit der Gefangenen bezeichnen. Mit einem transitiven Verb des Befreiens ist „die Gefangenen“ im Deutschen am natürlichsten.
