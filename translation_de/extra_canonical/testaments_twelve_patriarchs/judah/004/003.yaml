revisions:
- from: Am folgenden Tag zogen wir nach Areta, einer mächtigen Stadt, die uns mit dem Tod drohte. Gad und ich rückten der Stadt von Osten her entgegen, Ruben und Levi aber von Westen. So befreiten wir die Gefangenen.
  to: Am folgenden Tag zogen wir nach Areta, einer mächtigen Stadt, die uns mit dem Tod drohte. Gad und ich gingen von Osten her gegen die Stadt vor, Ruben und Levi von Westen her. So befreiten wir die Gefangenen.
  rationale: Die Revision präzisiert ausschließlich die gegen die Stadt gerichtete, von Osten und Westen erfolgende Bewegung. Sie bewahrt die knappe griechische Darstellung und vermeidet sowohl die unbelegte englische Nennung Hebrons als auch die dortige, mit dem griechischen Schluss nicht vereinbare Aussage, man habe sämtliche Gefangenen genommen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:13:12Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf folgt zu Recht dem griechischen Text, der Areta nennt, nicht Hebron, und von der Befreiung der Gefangenschaft/Gefangenen spricht. Die englische POB-Konsultationszeile weicht hiervon in Ortsname und Schlussaussage erheblich ab und ist für diese Übersetzung nicht maßgeblich. Bei προσέφθημεν ist „rückten … entgegen“ semantisch zu unbestimmt und lässt die gegen die Stadt gerichtete militärische Aktion weniger klar erkennen.
  naturalness: Der Text ist insgesamt modernes, würdiges Deutsch. Die parallele Richtungsangabe wird mit „von Westen“ am Satzende etwas knapp; „von Westen her“ stellt die Parallele klarer her. „gegen die Stadt vorgehen“ ist idiomatisch und wahrt die im griechischen Verb enthaltene Annäherungs-/Angriffsnuance, ohne eine genauer bestimmte Taktik einzutragen.
  terminology: Die Namen Areta, Gad, Ruben und Levi sind angemessen wiedergegeben. „mächtige Stadt“, „mit dem Tod drohte“ und „Gefangenen“ sind sachgerecht. Die ambige Kollektivbezeichnung τὴν αἰχμαλωσίαν wird mit „die Gefangenen“ natürlich und kontextgemäß wiedergegeben.
  issues:
  - severity: medium
    issue: Die Wiedergabe von προσέφθημεν als „rückten der Stadt … entgegen“ ist zu vage.
    rationale: Im Kontext der von zwei Seiten erfolgenden Aktion gegen die Stadt bezeichnet das Verb ein Vorgehen bzw. Herankommen gegen sie. „Gingen … gegen die Stadt vor“ gibt dies klar wieder, ohne über den griechischen Text hinaus eine bestimmte Kampfhandlung zu behaupten.
  - severity: low
    issue: Die zweite Richtungsangabe lautet nur „von Westen“.
    rationale: „Von Westen her“ bildet die vorausgehende Formulierung idiomatisch und syntaktisch vollständig parallel ab.
