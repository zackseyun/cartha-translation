- source_word: τρόμος
  choice: Schrecken
  rationale: Bezeichnet hier überwältigende Furcht; „Schrecken“ ist im Kontext idiomatischer als das körperlich akzentuierte „Zittern“.
- source_word: ἐπαύσαντο πολεμοῦντες ἡμᾶς
  choice: sie hörten auf, gegen uns zu kämpfen
  rationale: Bewahrt den durativen Sinn des Partizips und gibt das Ende der Kampfhandlung in modernem Standarddeutsch klar wieder.
