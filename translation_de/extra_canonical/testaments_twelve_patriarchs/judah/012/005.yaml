base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/005.yaml
  text: But I, not knowing what I had done, wanted to kill her. But she sent the pledges secretly and put me to shame.
translation:
  language: de
  text: 5 Ich aber wusste nicht, was ich getan hatte, und wollte sie töten. Sie aber sandte mir heimlich die Pfänder und beschämte mich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγνοῶν
  choice: wusste nicht
  rationale: Gibt das partizipiale ἀγνοῶν in natürlichem modernem Deutsch wieder, ohne die Aussage abzuschwächen.
- source_word: ἀνελεῖν
  choice: töten
  rationale: Entspricht hier der klaren Tötungsabsicht; „beseitigen“ wäre im Deutschen unnötig mehrdeutig.
- source_word: τοὺς ἀρραβῶνας
  choice: die Pfänder
  rationale: Bezeichnet die als Sicherheit übergebenen Gegenstände; „Pfänder“ bewahrt den Bezug zur Juda-Tamar-Erzählung.
- source_word: κατῄσχυνέ με
  choice: beschämte mich
  rationale: 'Gibt die kausative Bedeutung wieder: Durch die heimliche Übersendung der Pfänder wurde Juda seiner Schuld überführt und beschämt.'
theological_decisions:
- issue: Art und Grad von Judas Unwissenheit
  choice: „wusste nicht, was ich getan hatte“
  alternative: „erkannte nicht, was ich getan hatte“
  rationale: Die Übersetzung lässt offen, worauf sich seine Unwissenheit genau bezieht, und erklärt oder entschuldigt seine Schuld nicht über den griechischen Text hinaus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte adversative Struktur mit δέ wird durch „Ich aber“ und „Sie aber“ sichtbar gehalten; der zweite Satz bleibt dennoch idiomatisch.
