  source_fidelity: 'Der Entwurf gibt den griechischen Satzbau und Sinn zuverlässig wieder: Ἀγνοῶν wird angemessen als „wusste nicht“ wiedergegeben, ὃ ἐποίησα als „was ich getan hatte“, ἤθελον ... ἀνελεῖν als Tötungsabsicht und πέμψασα ... κρυπτῶς als heimliches Senden der Pfänder. Das eingefügte „mir“ ist im Kontext der Handlung sinnvoll und im Deutschen zur Valenz von „senden“ natürlich; es verändert den Sinn nicht. Die beiden δέ werden mit „aber“ erkennbar wiedergegeben.'
  naturalness: Modernes, klares und würdiges Standarddeutsch. Die Formulierung „Ich aber wusste nicht“ ist leicht markiert, aber für den testamentarisch-erzählenden Registerton gut vertretbar. „Sie aber sandte mir heimlich die Pfänder“ ist verständlich und flüssig.
  terminology: „Pfänder“ trifft τοὺς ἀρραβῶνας im Kontext der als Unterpfand übergebenen Gegenstände präzise. „töten“ und „beschämte mich“ geben ἀνελεῖν beziehungsweise κατῄσχυνέ με treffend und ohne interpretierende Ausdeutung wieder. Namen oder theologisch besonders festgelegte Begriffe kommen nicht vor.
