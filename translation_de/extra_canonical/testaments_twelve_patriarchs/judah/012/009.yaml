source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Καίγε οἱ⁵⁷ ἐν τῇ πόλει⁵⁸ ἔλεγον, μὴ *εἶναι ἐν τῇ πύλῃ τελεσικόμενον⁶⁰, ὅτι ἐξ ἄλλου χωρίου⁶¹ ἐλθοῦσα πρὸς βραχὺ ἐκαθέσθη ἐν τῇ⁶² πύλῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/009.yaml
  text: Yet those in the city said that there had been no prostitute at the gate, because she had come from another place and sat at the gate for a short time.
translation:
  language: de
  text: Doch die Leute in der Stadt sagten, am Tor habe es keine Prostituierte gegeben; denn sie sei von einem anderen Ort gekommen und habe nur kurze Zeit am Tor gesessen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἐν τῇ πόλει
  choice: die Leute in der Stadt
  rationale: Die substantivierte Ortsangabe bezeichnet natürlich die Menschen in der Stadt; „die Leute“ ist im modernen Deutsch klar und idiomatisch.
- source_word: τελεσικόμενον
  choice: Prostituierte
  rationale: Der seltene und textlich schwierige Ausdruck bezeichnet im Zusammenhang eine Frau, die sexuelle Dienste anbietet. „Prostituierte“ ist sachlich, modern und weniger altertümlich als „Hure“.
- source_word: ἐξ ἄλλου χωρίου
  choice: von einem anderen Ort
  rationale: χωρίον bezeichnet hier allgemein einen Ort beziehungsweise eine andere Örtlichkeit; die Übersetzung wahrt diese Unbestimmtheit.
- source_word: πρὸς βραχύ
  choice: nur kurze Zeit
  rationale: Die Wendung gibt eine kurze zeitliche Dauer an; „nur“ bringt die im Zusammenhang hervorgehobene Vorläufigkeit natürlich zum Ausdruck.
- source_word: ἐκαθέσθη ἐν τῇ πύλῃ
  choice: habe … am Tor gesessen
  rationale: Der indirekte Bericht nach ἔλεγον wird im Deutschen idiomatisch mit Konjunktiv I wiedergegeben; „am Tor“ bezeichnet den Aufenthaltsort.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz folgt der griechischen Begründungsstruktur und kennzeichnet die Aussage der Stadtbewohner durch indirekte Rede, ohne sie als objektive Feststellung des Erzählers auszugeben.
