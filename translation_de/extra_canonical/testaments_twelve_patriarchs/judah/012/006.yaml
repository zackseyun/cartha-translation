base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/006.yaml
  text: And when I called her, I also heard the secret words that, while sleeping with her in my drunkenness, I had spoken. And I was not able to kill her, because it was from the Lord.
translation:
  language: de
  text: Als ich sie aber rief, hörte ich auch die geheimen Worte, die ich im Schlaf bei ihr in meiner Trunkenheit gesprochen hatte. Und ich konnte sie nicht töten, weil es vom Herrn kam.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „weil es vom Herrn war“. Worauf „es“ sich genau bezieht, bleibt im Griechischen offen; gemeint sein können die Angelegenheit, das Geschehen oder die zuvor genannten Worte.'
    reason: Die grammatische Bezugnahme ist im Ausgangstext nicht eindeutig und sollte nicht stillschweigend auf eine bestimmte theologische Deutung festgelegt werden.
lexical_decisions:
- source_word: Καλέσας ... αὐτήν
  choice: als ich sie ... rufen ließ
  rationale: Καλέω kann hier das Herbeirufen oder Vorladen bezeichnen. „Rufen ließ“ gibt die veranlasste Herbeirufung natürlich wieder, ohne einen bloßen Zuruf nahezulegen.
- source_word: τοὺς ἐν μυστηρίῳ λόγους
  choice: die geheimen Worte
  rationale: Die Wendung bezeichnet im Verborgenen beziehungsweise vertraulich gesprochene Worte; „geheim“ ist hier verständlicher als das im Deutschen missverständliche „mystische“.
- source_word: καθεύδων σὺν αὐτῇ
  choice: im Schlaf bei ihr
  rationale: Καθεύδω bedeutet zunächst „schlafen“. Die Formulierung bewahrt den Wortlaut und vermeidet es, eine mögliche sexuelle Nebenbedeutung ausdrücklich festzulegen.
- source_word: ἐν τῇ μέθῃ μου
  choice: in meiner Trunkenheit
  rationale: Μέθη bezeichnet einen Zustand der Trunkenheit; die nominale Wiedergabe entspricht dem würdevollen Erzählregister.
- source_word: ἀνελεῖν
  choice: töten
  rationale: In diesem Zusammenhang bedeutet ἀναιρέω „töten“ beziehungsweise „umbringen“; „töten“ ist präzise und stilistisch angemessen.
- source_word: παρὰ Κυρίου
  choice: vom Herrn
  rationale: Παρά mit Genitiv bezeichnet hier Herkunft oder Urheberschaft. Der artikellose griechische Gottesbezug wird idiomatisch mit „vom Herrn“ wiedergegeben.
theological_decisions:
- issue: Bezug des unpersönlichen ἦν in „ὅτι παρὰ Κυρίου ἦν“
  choice: „weil es vom Herrn kam“ mit erläuternder Fußnote
  alternative: „weil sie vom Herrn war“ oder eine ausdrückliche Festlegung auf das Geschehen beziehungsweise die Offenbarung
  rationale: Das griechische Subjekt ist nicht ausdrücklich genannt. Das neutrale „es“ bewahrt die mögliche Beziehung auf die Angelegenheit, das Geschehen oder die gehörten Worte und vermeidet eine theologische Festlegung, dass die Frau selbst „vom Herrn“ gewesen sei.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Satzstruktur. Die ungewöhnliche Aussage, dass Juda seine eigenen geheimen Worte „hörte“, bleibt bewusst erhalten. Die Formulierung „im Schlaf bei ihr“ wahrt die semantische Offenheit des Griechischen.
