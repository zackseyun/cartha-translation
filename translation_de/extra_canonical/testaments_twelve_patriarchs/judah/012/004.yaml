source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: '*Καὶ ἐκκλίνας²⁶ πρὸς αὐτὴν εἶπον²⁶· *Εἰσέρχομαι²⁷ πρὸς σε. *Καὶ²⁸ εἶπεν¹³¹· Τί μοι δώσεις³²; καὶ δέδωκα³³ αὐτῇ τὴν ῥάβδον μου καὶ τὸ διάδημά μου³⁷ *εἰς ἀρραβῶνα³⁸. *Καὶ ὡς συνήλθον³⁹ αὐτῇ συνελήφθη⁴⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/004.yaml
  text: And turning aside to her, I said, “I will come in to you.” And she said, “What will you give me?” And I gave her my staff and my ring and the diadem of my kingdom as a pledge. And when I had gone in to her, she conceived.
translation:
  language: de
  text: 'Und ich wandte mich ihr zu und sagte: »Ich will zu dir eingehen.« Sie sagte: »Was wirst du mir geben?« Da gab ich ihr meinen Stab und mein Diadem als Pfand. Und als ich mit ihr verkehrt hatte, wurde sie schwanger.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκκλίνας πρὸς αὐτήν
  choice: ich wandte mich ihr zu
  rationale: Gibt die räumliche Hinwendung beziehungsweise das Abbiegen zu ihr natürlich wieder, ohne zusätzliche Deutung.
- source_word: Εἰσέρχομαι πρὸς σε
  choice: Ich will zu dir eingehen
  rationale: Bewahrt den biblisch geprägten Ausdruck und seine sexuelle Implikation, ohne sie im ersten Satz expliziter als die Vorlage zu machen.
- source_word: ῥάβδον
  choice: Stab
  rationale: Direkte und kontextuell passende Wiedergabe.
- source_word: διάδημα
  choice: Diadem
  rationale: Entspricht dem griechischen Substantiv; die Zusätze »Ring« und »meines Königreichs« aus der englischen Konsultationsfassung stehen nicht im vorgelegten griechischen Text.
- source_word: εἰς ἀρραβῶνα
  choice: als Pfand
  rationale: Bezeichnet hier eine verpfändete Sicherheit beziehungsweise ein Unterpfand.
- source_word: συνήλθον αὐτῇ
  choice: ich mit ihr verkehrt hatte
  rationale: Gibt den idiomatischen sexuellen Sinn von συνέρχομαι im Kontext in natürlichem, würdigem Deutsch wieder.
- source_word: συνελήφθη
  choice: wurde sie schwanger
  rationale: 'Kontextgemäße Bedeutung des passiven Verbs: empfangen beziehungsweise schwanger werden.'
theological_decisions:
- issue: Königliche Ausgestaltung des Diadems
  choice: mein Diadem
  alternative: das Diadem meines Königreichs
  rationale: Die vorgelegte griechische Primärfassung enthält μου bei διάδημα, aber keinen Ausdruck für »Königreich«; daher wird keine nicht belegte königliche Erläuterung ergänzt.
- issue: Zusätzlicher Ring
  choice: kein Ring erwähnt
  alternative: meinen Ring und das Diadem
  rationale: Im griechischen Ausgangstext stehen nur ῥάβδον und διάδημα. Eine mögliche textgeschichtliche Erweiterung aus anderen Zeugen wird ohne Apparatusbeleg nicht in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wörtlich-biblische Wendung »zu dir eingehen« bleibt erhalten; der nachfolgende Vollzug wird zur Verständlichkeit idiomatisch als »mit ihr verkehren« formuliert. Keine Fußnoten erforderlich.
