  text: I was forty-six years old, and I spent seventy-three years in Egypt.
translation:
  language: de
  text: Ich war sechsundvierzig Jahre alt, und ich verbrachte dreiundsiebzig Jahre in Ägypten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἤμην … ἐτῶν τεσσαράκοντα καὶ ἓξ
  choice: Ich war sechsundvierzig Jahre alt
  rationale: Die griechische Altersangabe mit εἰμί und Genitiv wird idiomatisch und genau als deutsche Altersangabe wiedergegeben.
- source_word: ἑβδομήκοντα καὶ τρία ἔτη ἐποίησα
  choice: ich verbrachte dreiundsiebzig Jahre
  rationale: ποιέω mit einer Zeitspanne bezeichnet hier das Verbringen bzw. Durchleben dieser Jahre; „verbrachte“ ist im Deutschen natürlich und bewahrt den zeitlichen Sinn.
- source_word: εἰς Αἴγυπτον
  choice: in Ägypten
  rationale: Obwohl εἰς gewöhnlich eine Richtung bezeichnet, verlangt die Verbindung mit einer verbrachten Zeitspanne hier idiomatisch eine Ortsangabe; „in Ägypten“ entspricht dem gemeinten Aufenthalt.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in schlichter, würdiger Erzählweise. Das einleitende δέ wird durch die Satzverknüpfung mit „und“ hinreichend abgebildet; ein zusätzliches „nun“ würde im Deutschen unnötig als zeitlicher Marker wirken.
