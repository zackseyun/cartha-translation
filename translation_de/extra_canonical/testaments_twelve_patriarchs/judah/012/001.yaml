  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/001.yaml
  text: After this, when Tamar had been a widow for two years and heard that I was going up to shear the sheep, she adorned herself with bridal attire and sat in Enaim, at the city gate of the inn.
translation:
  language: de
  text: 12,1 Danach, als Tamar seit zwei Jahren Witwe war und hörte, dass ich hinaufziehe, um die Schafe zu scheren, schmückte sie sich mit Brautschmuck und setzte sich am Tor der Stadt Enan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χηρευούσης τῆς Θαμὰρ μετὰ ἔτη δύο
  choice: als Tamar seit zwei Jahren Witwe war
  rationale: Gibt den Genitivus absolutus und die Zeitangabe natürlich wieder, ohne einen neuen Handlungsschritt zu konstruieren.
- source_word: ἀνέρχομαι τοῦ κεῖραι τὰ πρόβατα
  choice: dass ich hinaufzog, um die Schafe zu scheren
  rationale: Bewahrt die Ich-Perspektive Judas sowie die mit dem substantivierten Infinitiv ausgedrückte Absicht.
- source_word: κοσμηθεῖσα κόσμῳ νυμφικῷ
  choice: legte sie Brautschmuck an
  rationale: Das verwandte Wortpaar κοσμηθεῖσα/κόσμῳ bezeichnet hier das Sich-Schmücken mit hochzeitlichem Schmuck beziehungsweise entsprechender Ausstattung; „Brautschmuck“ ist knapp und natürlich.
- source_word: ἐν Ἐνὰν τῇ πόλει πρὸς τὴν πύλην
  choice: in der Stadt Enan ans Tor
  rationale: Versteht τῇ πόλει als nähere Bestimmung zu Enan und πρὸς τὴν πύλην räumlich. Die im englischen Konsultationstext ergänzte Herberge steht nicht im vorgelegten griechischen Text.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlichem Erzählfluss. Der Ortsname wird nach der vorgelegten griechischen Form als „Enan“ wiedergegeben; keine nicht im griechischen Ausgangstext belegte Herberge wurde ergänzt.
