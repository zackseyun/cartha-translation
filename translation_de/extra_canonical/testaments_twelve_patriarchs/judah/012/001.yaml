review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Handlung, die zweijährige Witwenschaft Tamars, Judas’ Ich-Perspektive, den Zweck des Hinaufziehens und die Ortsangabe insgesamt zutreffend wieder. Die griechische Vorlage nennt eine Stadt und ein Tor; eine „Herberge“ wie im englischen Audit-Text ist nicht belegt und darf nicht ergänzt werden.
  naturalness: „ans Tor“ nach „setzte sich“ ist verständlich, aber „am Tor der Stadt Enan“ ist im modernen Standarddeutsch idiomatischer und bildet die räumliche Zuordnung klarer ab. Der Indikativ Präteritum „hinaufzog“ kann fälschlich nahelegen, das Hinaufziehen sei bereits abgeschlossen; Konjunktiv I bewahrt den berichteten, noch bevorstehenden Vorgang.
  terminology: „Tamar“, „Schafe“, „Brautschmuck“ und „Enan“ sind angemessen. „Brautschmuck“ ist eine vertretbare knappe Wiedergabe von κόσμῳ νυμφικῷ; es besteht kein Anlass, eine spezifischere Art von Kleidung oder Schmuck festzulegen.
  issues:
  - severity: low
    issue: Zeitform in der indirekten Rede
    rationale: „dass ich hinaufzog“ klingt im Deutschen nach einem vergangenen, abgeschlossenen Vorgang. Das griechische Präsens ἀνέρχομαι steht hier in der von Tamar vernommenen Ankündigung eines bevorstehenden bzw. aktuellen Aufbruchs. „dass ich hinaufziehe“ erhält dies besser.
  - severity: low
    issue: Stellung der Ortsangabe
    rationale: „in der Stadt Enan ans Tor“ ist weniger idiomatisch und kann kurz irritieren. „am Tor der Stadt Enan“ ist natürlich und gibt ἐν Ἐνὰν τῇ πόλει πρὸς τὴν πύλην klar wieder.
  revised_text: 12,1 Danach, als Tamar seit zwei Jahren Witwe war und hörte, dass ich hinaufziehe, um die Schafe zu scheren, schmückte sie sich mit Brautschmuck und setzte sich am Tor der Stadt Enan.
