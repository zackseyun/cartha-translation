  text: For it was a law of the Amorites that a widow should sit openly in prostitution.
translation:
  language: de
  text: 2 Denn bei den Amoritern war es Gesetz, dass eine Witwe sieben Tage lang am Tor sitzen musste.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sieben Tage lang beim Tor sitzen musste“.'
    reason: παρὰ τὴν πύλην bezeichnet eine Lage beim beziehungsweise nahe am Tor; beide deutschen Wiedergaben sind möglich.
lexical_decisions:
- source_word: Νόμος … ἦν τῶν Ἀμορραίων
  choice: bei den Amoritern galt das Gesetz
  rationale: Gibt die Zugehörigkeitskonstruktion idiomatisch wieder, ohne νόμος auf einen bloßen Brauch abzuschwächen.
- source_word: τὴν χηρεύουσαν
  choice: eine Witwe
  rationale: Das substantivierte Partizip bezeichnet eine verwitwete Frau; „Witwe“ ist die natürliche deutsche Entsprechung.
- source_word: προκαθεσθαι
  choice: sitzen musste
  rationale: Der Infinitiv bezeichnet das vorgeschriebene Sitzen; die Verpflichtung ergibt sich aus νόμος. Die räumliche Nuance des Präfixes προ- wird zusammen mit der Torangabe verstanden.
- source_word: ἐπὶ ἑπτὰ ἡμέρας
  choice: sieben Tage lang
  rationale: Die Präposition mit Akkusativ bezeichnet hier die Zeitdauer.
- source_word: παρὰ τὴν πύλην
  choice: am Tor
  rationale: παρά mit Akkusativ lokalisiert das Sitzen beim beziehungsweise nahe am Tor; „am Tor“ ist im Deutschen natürlich und wahrt diese räumliche Offenheit.
theological_decisions:
- issue: Abweichung der englischen Konsultationsfassung von der angegebenen griechischen Vorlage
  choice: Die Zeitangabe „sieben Tage lang“ und der Ort „am Tor“ werden übersetzt; Prostitution wird nicht erwähnt.
  alternative: „öffentlich in Prostitution sitzen“ nach der englischen POB-Fassung
  rationale: Die vorgelegte griechische α-Spalte liest eindeutig ἐπὶ ἑπτὰ ἡμέρας παρὰ τὴν πύλην („sieben Tage lang am/beim Tor“) und enthält weder πορνεία noch einen entsprechenden Ausdruck. Die Übersetzung folgt daher vorrangig der Originalsprachenquelle.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist klar und allgemeinverständlich; „galt das Gesetz“ bewahrt den rechtlich-normativen Ton des griechischen νόμος.
