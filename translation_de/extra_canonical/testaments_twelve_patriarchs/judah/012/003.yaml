  source_fidelity: 'Die Übersetzung trifft den Rauschzustand und das Nichterkennen zutreffend. Im letzten Satzteil verschiebt sie jedoch die griechische Syntax und Aussage: Subjekt von ἠπάτησέ με ist τὸ κάλλος αὐτῆς („ihre Schönheit“), während διὰ τοῦ σχήματος τῆς κοσμήσεως die Art bzw. das Mittel der Täuschung näher bestimmt. Die deutsche Koordination „durch ihre Schönheit und das Erscheinungsbild ihres Schmucks“ macht daraus zwei gleichrangige Mittel und lässt sie zum handelnden Subjekt werden.'
  naturalness: „Ihre Schönheit täuschte mich durch das Erscheinungsbild ihres Schmucks“ ist modernes, verständliches Standarddeutsch und bildet die Satzstruktur des Griechischen deutlich genauer ab. Die etwas gehobene Formulierung passt zum testamentarisch-erzählenden Register.
  terminology: „betrunken“, „erkannte“, „täuschte“, „Schönheit“ und „Schmuck“ sind angemessen. „Erscheinungsbild“ gibt σχῆμα in diesem Kontext neutral wieder und vermeidet eine überdeutende Wiedergabe.
