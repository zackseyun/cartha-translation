  text: So when I was drunk with wine, I did not recognize her, and she deceived me by her beauty through the appearance of her adornment.
translation:
  language: de
  text: 3 Als ich nun vom Wein betrunken war, erkannte ich sie nicht, und ihre Schönheit täuschte mich durch das Erscheinungsbild ihres Schmucks.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μεθυσθεὶς … οἴνῳ
  choice: vom Wein betrunken
  rationale: Gibt den passivisch-zuständlichen Sinn und das Mittel des Rausches natürlich und vollständig wieder.
- source_word: οὐκ ἐπέγνων αὐτήν
  choice: erkannte ich sie nicht
  rationale: Bewahrt die naheliegende Bedeutung des Nichterkennens im Kontext ihrer veränderten äußeren Erscheinung.
- source_word: ἠπάτησέ με
  choice: sie täuschte mich
  rationale: Entspricht direkt dem griechischen Verb und lässt offen, worin die Täuschung im Einzelnen bestand.
- source_word: τὸ κάλλος αὐτῆς
  choice: durch ihre Schönheit
  rationale: Gibt die Schönheit als Mittel ihrer Täuschung wieder.
- source_word: διὰ τοῦ σχήματος τῆς κοσμήσεως
  choice: und das Erscheinungsbild ihres Schmucks
  rationale: σχῆμα bezeichnet hier die äußere Gestalt beziehungsweise Erscheinung; κόσμησις ihre Aufmachung oder ihren Schmuck. Das zweite „durch“ wird im Deutschen koordiniert, um die verschachtelte griechische Instrumentalangabe verständlich wiederzugeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kausale beziehungsweise instrumentale Verknüpfung der Schönheit mit dem Erscheinungsbild des Schmucks bleibt gewahrt, ohne zusätzliche moralische oder theologische Deutung.
