  text: '*Ἀλλ᾽ οὐδὲ⁵² ἤγγισα⁵³ αὐτῇ ἔτι⁵⁴ ἕως⁵⁵ τῆς ζωῆς μου⁵⁶.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/012/008.yaml
  text: But I did not approach her again for the rest of my life, because I had done this abomination in all Israel.
translation:
  language: de
  text: Doch ich näherte mich ihr bis zu meinem Lebensende nicht mehr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤγγισα αὐτῇ
  choice: ich näherte mich ihr
  rationale: Gibt die körperlich beziehungsweise sexuell deutbare Annäherung des griechischen Ausdrucks wieder, ohne sie eindeutiger zu machen als der Ausgangstext.
- source_word: ἔτι
  choice: wieder
  rationale: Im Zusammenhang mit der Verneinung bezeichnet das Adverb eine nicht erneut vollzogene Annäherung.
- source_word: ἕως τῆς ζωῆς μου
  choice: bis an mein Lebensende
  rationale: Natürliche deutsche Wiedergabe der zeitlichen Grenze; gemeint ist die gesamte verbleibende Lebenszeit.
theological_decisions:
- issue: Zusatz im englischen Beratungstext
  choice: Den Satz „weil ich diesen Gräuel in ganz Israel begangen hatte“ nicht aufgenommen
  alternative: Den kausalen Zusatz aus dem englischen POB übernehmen
  rationale: Der bereitgestellte griechische Ausgangstext enthält diesen Zusatz nicht. Die Übersetzung folgt daher der griechischen Quellenlage und ergänzt keine theologische oder moralische Begründung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die etwas offene Bedeutung von „sich ihr nähern“ bleibt erhalten; sie wird nicht ausdrücklich als Geschlechtsverkehr ausgelegt.
