  naturalness: Die Stellung von „bis an mein Lebensende“ vor „nicht wieder“ ist verständlich, aber im modernen Standarddeutsch weniger flüssig. „Bis zu meinem Lebensende ... nicht mehr“ ist idiomatischer und bewahrt die Aussage.
  terminology: „sich jemandem nähern“ erhält die im Griechischen mögliche körperliche beziehungsweise sexuelle Konnotation, ohne sie dogmatisch oder unnötig explizit festzulegen. Keine theologischen Fachbegriffe oder Eigennamen sind betroffen.
