revisions:
- from: Doch ich näherte mich ihr bis an mein Lebensende nicht wieder.
  to: Doch ich näherte mich ihr bis zu meinem Lebensende nicht mehr.
  rationale: Die Revision glättet ausschließlich die deutsche Idiomatik. Sie gibt ἀλλ᾽ οὐδέ als kontrastives „Doch“ wieder, bewahrt die Negation mit ἔτι als „nicht mehr“ und versteht ἕως τῆς ζωῆς μου als die verbleibende Lebenszeit. Der im englischen POB enthaltene Zusatz über einen „Gräuel“ bleibt zu Recht unübersetzt, da er im bereitgestellten griechischen Ausgangstext fehlt.
