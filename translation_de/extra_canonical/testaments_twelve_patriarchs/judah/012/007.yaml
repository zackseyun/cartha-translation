  revision_rationale: Die Fassung korrigiert zwingend den im Griechischen vorliegenden Sprecherwechsel zu einem pluralischen „sie sagten“. Sie gibt πρῶτοι mit „erste“ wieder, damit keine zeitliche Deutung vorweggenommen wird, und richtet die Fußnotenanker nach den im Ausgangstext markierten Positionen aus. Die feminine Referenz von ἑτέρας wird als „einer anderen Frau“ transparent gemacht; die unklare Bezugnahme der „ersten Worte“ bleibt ausdrücklich offen.
