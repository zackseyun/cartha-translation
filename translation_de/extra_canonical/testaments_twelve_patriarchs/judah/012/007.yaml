  text: For I said, “Perhaps she acted deceitfully, having received the pledge from another.”
translation:
  language: de
  text: 'Denn sie sagten: »Vielleicht handelte sie betrügerisch, nahm die Pfandgaben[a] von einer anderen Frau entgegen und gebrauchte mir gegenüber die ersten Worte[b].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch steht im Plural: Sicherheiten bzw. als Unterpfand übergebene Gegenstände.'
    reason: Erläutert ἀρραβῶνας und steht am ersten im Quelltext gesetzten Anker.
  - marker: b
    text: 'Wörtlich: „und bediente sich mir gegenüber der ersten Worte“. Welche Worte gemeint sind, bleibt offen.'
    reason: Bewahrt die referenzielle Mehrdeutigkeit von τοῖς πρώτοις λόγοις ἐχρήσατο πρὸς ἐμέ und steht am zweiten Quellanker.
lexical_decisions:
- source_word: ἐν δολιότητι ἐποίησε
  choice: handelte sie in betrügerischer Absicht
  rationale: Gibt die adverbiale Wendung natürlich wieder, ohne den im Griechischen nicht ausdrücklich genannten Gegenstand der Handlung zu ergänzen.
- source_word: παρὰ ἑτέρας
  choice: von einer anderen
  rationale: ἑτέρας ist eine feminine Genitivform und bezeichnet daher wahrscheinlich eine andere Frau; das Bezugswort bleibt im Griechischen jedoch unausgesprochen.
- source_word: τοὺς ἀρραβῶνας
  choice: die Pfänder
  rationale: Der Plural bezeichnet die als Sicherheit übergebenen Gegenstände; „Pfänder“ ist im Deutschen präzise und im Zusammenhang verständlich.
- source_word: τοῖς πρώτοις λόγοις ἐχρήσατο πρὸς ἐμέ
  choice: gebrauchte mir gegenüber die früheren Worte
  rationale: Die ungewöhnliche griechische Formulierung wird eng nachgebildet, da unklar bleibt, auf welche früheren Worte sie sich bezieht.
