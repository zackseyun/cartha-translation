lexical_decisions:
- source_word: ἐνόμιζον
  choice: ich dachte
  rationale: Gibt die subjektive Annahme des Sprechers natürlich und ohne zusätzliche Gewissheit wieder.
- source_word: οὐδεὶς ἔγνω
  choice: niemand wisse
  rationale: Der Konjunktiv in der indirekten Rede entspricht im Deutschen der abhängigen Aussage nach „ich dachte“ und bewahrt den behaupteten Wissensstand.
- source_word: εἰσῆλθον πρὸς αὐτήν
  choice: ich zu ihr hineingegangen war
  rationale: Bewahrt die konkrete Bewegungsformulierung des Griechischen und lässt eine mögliche sexuelle Nebenbedeutung unausgesprochen, statt sie interpretierend festzulegen.
