  text: But those from Machir attacked us again on the fifth day; and charging at them with a mighty sword[a], we prevailed over them and killed them before they could scale the ascent[b].
translation:
  language: de
  text: Doch die aus Machir griffen uns am fünften Tag erneut an. Mit mächtigem Schwert gingen wir gegen sie vor[a], gewannen die Oberhand über sie und töteten sie, bevor sie den Aufstieg erklommen[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Verb προσδίδωσι steht hier auffällig in der 3. Person Singular Präsens, obwohl die Erzählung sonst in der 1. Person Plural und in Vergangenheitsformen fortgeführt wird. Möglicherweise liegt eine verkürzte oder verderbte Überlieferung für eine Wendung im Sinn von »gegen sie vorgehend« vor. Die Übersetzung gibt den aus dem Zusammenhang erkennbaren Angriff wieder, ohne den griechischen Text stillschweigend zu ändern.
    reason: textual_variant
  - marker: b
    text: 'Wörtlich: »bevor sie den Aufstieg hinaufstiegen«. ἀναβῆναι und ἀνάβασιν sind stammverwandt. Gemeint sein kann ein Hang, ein Pass oder ein befestigter Zugang, den die Gegner erreichen oder erklimmen wollten.'
    reason: lexical_note
lexical_decisions:
- source_word: πάλιν
  choice: erneut
  rationale: Das Adverb bezeichnet den wiederholten Angriff; »erneut« ist in diesem militärischen Erzählzusammenhang natürlich und präzise.
- source_word: ἀπὸ Μαχίρ
  choice: die Männer aus Machir
  rationale: Die Präposition bezeichnet die Herkunft. Das im Griechischen substantivisch gebrauchte Maskulinum wird im Deutschen zur Verständlichkeit mit »Männer« ergänzt.
- source_word: ἐπῆλθον ἡμῶν
  choice: griffen uns … an
  rationale: ἐπέρχομαι bezeichnet hier mit Personenbezug ein feindliches Herankommen; »angreifen« gibt die militärische Bedeutung idiomatisch wieder.
- source_word: προσδίδωσι πρὸς αὐτούς
  choice: Als wir sie … angriffen
  rationale: Die überlieferte Form ist syntaktisch auffällig und wechselt unerwartet in die 3. Person Singular Präsens. Die Übersetzung gibt ohne stillschweigende Textherstellung den im Zusammenhang erkennbaren Sinn eines offensiven Vorgehens wieder; die Unsicherheit wird in Fußnote [a] offengelegt.
- source_word: ἐν κραταιᾷ μαχαίρᾳ
  choice: mit mächtigem Schwert
  rationale: κραταιός bedeutet »stark, mächtig«, μάχαιρα »Schwert«; ἐν bezeichnet hier das Mittel. Die leicht gehobene Wendung bewahrt den martialischen Ton.
- source_word: περιγινόμεθα αὐτῶν
  choice: gewannen wir die Oberhand über sie
  rationale: περιγίγνομαι mit Genitiv bedeutet, jemandem überlegen zu sein oder über ihn die Oberhand zu gewinnen. Die deutsche Wendung bildet dies genau und natürlich ab.
- source_word: πρὸ τοῦ ἀναβῆναι τὴν ἀνάβασιν
  choice: bevor sie den Aufstieg hinaufsteigen konnten
  rationale: Die Verbindung von ἀναβαίνω und dem stammverwandten ἀνάβασις lautet wörtlich »den Aufstieg hinaufsteigen«. Die bewusst nahe Wiedergabe erhält die auffällige rhetorische Konstruktion und den räumlich-taktischen Sinn.
