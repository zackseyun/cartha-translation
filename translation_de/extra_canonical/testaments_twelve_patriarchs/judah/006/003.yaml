  register: Moderne, verständliche Standardsprache mit würdigem militärischem Erzählton. Die Satzstruktur wurde zur Klarheit leicht gegliedert. Die ungewöhnliche Syntax bei προσδίδωσι wird nicht durch eine unmarkierte Konjektur verdeckt, sondern im Haupttext sinngemäß wiedergegeben und in Fußnote [a] erklärt; die stammverwandte Ausdrucksweise am Versende bleibt erkennbar.
