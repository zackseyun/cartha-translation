  text: And as we came to the city[a], their women were rolling stones down on us from the summit of the mountain on which the city stood.
translation:
  language: de
  text: Als wir zur Stadt kamen[a], rollten ihre Frauen vom Gipfel des Berges, auf dem die Stadt lag, Steine auf uns herab.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im griechischen Text steht τῇ τῇ πόλει; der doppelte Artikel ist offenbar ein Abschreibfehler. Übersetzt wird daher der einfache Ausdruck τῇ πόλει, »der Stadt«.
    reason: textual_variant
lexical_decisions:
- source_word: ἤκομεν τῇ πόλει
  choice: wir uns der Stadt näherten
  rationale: Das Verb bezeichnet hier im Zusammenhang mit dem Dativ das Herankommen an die Stadt. Die Formulierung ist im modernen Deutsch natürlich und bewahrt die Bewegung auf die Stadt zu.
- source_word: ἐκύλιον
  choice: rollten
  rationale: Der griechische Imperfekt schildert die andauernde beziehungsweise wiederholte Abwehrhandlung. Im deutschen Erzählzusammenhang kann das Präteritum diesen Verlauf ausdrücken; die Richtung wird durch „herab“ verdeutlicht.
- source_word: λίθους ἐφ’ ἡμᾶς
  choice: Steine auf uns herab
  rationale: λίθους bezeichnet Steine; ἐπί mit Akkusativ gibt die feindliche Zielrichtung an. „Auf uns herab“ verbindet diese Richtung mit der ausdrücklich genannten Höhenlage.
- source_word: κορυφῆς τοῦ ὄρους
  choice: Gipfel des Berges
  rationale: κορυφή bezeichnet den höchsten Punkt oder Gipfel, ὄρος einen Berg. Die Wiedergabe bleibt eng am griechischen Wortlaut.
- source_word: ἐν ᾗ ἦν ἡ πόλις
  choice: auf dem die Stadt lag
  rationale: Der Relativsatz bestimmt den Berg als Lageort der Stadt. „Lag“ ist für eine Stadt auf einem Berg idiomatisches modernes Deutsch, ohne zusätzliche Befestigungsmerkmale einzutragen.
