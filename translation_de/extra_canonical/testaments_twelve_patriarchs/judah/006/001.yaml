source:
  edition: Charles 1908 Greek Versions (pages 134-175, Judah pilot full)
  text: Καὶ ὡς ἤμην ἐν τοῖς ὕδασι Χωζηβά¹, οἱ ἀπὸ †Ἰωβὴλ² ἦλθον ἐφ᾽³ ἡμᾶς εἰς πόλεμον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/006/001.yaml
  text: And as I was by the waters of Chozeba, those from Jobel came against us for battle.
translation:
  language: de
  text: Und als ich bei den Wassern von Chozeba[a] war, kamen die aus Jobel[b] gegen uns zum Kampf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: Χωζηβά (Chozeba); der griechische Editionstext setzt bei diesem Ortsnamen die Anmerkungsziffer ¹.'
    reason: Der seltene Ortsname und die im zugrunde gelegten Editionstext vorhandene Anmerkungsmarkierung werden kenntlich gemacht.
  - marker: b
    text: 'Griechisch: Ἰωβήλ (Jobel); der Name ist in der Edition durch ein Dolchzeichen als textkritisch unsicher markiert.'
    reason: Die textkritische Unsicherheit der überlieferten Lesart wird transparent gemacht, ohne den Namen zu normalisieren.
lexical_decisions:
- source_word: ἐν τοῖς ὕδασι
  choice: an den Wassern
  rationale: Die Wendung bezeichnet hier den Aufenthalt bei den Gewässern; „an den Wassern“ ist natürliches, zugleich würdiges Deutsch.
- source_word: οἱ ἀπὸ Ἰωβὴλ
  choice: die Männer aus Jobel
  rationale: Der substantivierte Ausdruck meint Personen aus diesem Ort. „Männer“ macht die im Griechischen implizite Personengruppe im Kriegskontext verständlich, ohne sie näher zu bestimmen.
- source_word: ἦλθον ἐφ᾽ ἡμᾶς εἰς πόλεμον
  choice: zogen … gegen uns in den Krieg
  rationale: Gibt sowohl die feindliche Bewegung gegen die Gruppe als auch den Zweck beziehungsweise die Ausrichtung auf Krieg wieder.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit leicht feierlichem Erzählton. Die Satzverknüpfung mit „Und als“ bewahrt den fortlaufenden Charakter des griechischen Berichts; textkritisch unsichere Eigennamen werden nicht stillschweigend normalisiert.
