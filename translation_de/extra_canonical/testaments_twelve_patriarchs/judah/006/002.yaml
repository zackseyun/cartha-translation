  source_fidelity: 'Der Entwurf gibt die Abfolge des griechischen Satzes und die militärische Aussage zutreffend wieder: Nach dem Zusammentreffen im Kampf wurden die Gegner in die Flucht geschlagen, ihre Verbündeten aus Σιλώμ getötet und ihnen wurde kein Zugang zum Eindringen zu den Sprechern gewährt. Anders als die englische Audit-Fassung bildet der Entwurf das ausdrückliche εἰσελθεῖν πρὸς ἡμᾶς („zu uns hineinzukommen“) ab und macht daraus keinen Fluchtweg.'
  naturalness: „Ließen ihnen keinen Durchgang“ ist verständlich, aber im Deutschen etwas unidiomatisch und mit dem folgenden Finalinfinitiv schwerfällig. „Gewährten ihnen keinen Zugang“ ist natürlicher und bildet die verweigerte Möglichkeit des Eindringens präziser ab.
  terminology: „den Kampf aufnehmen“ und „in die Flucht schlagen“ sind angemessene moderne militärische Erzählsprache. „Verbündete“ entspricht συμμάχους. „Silo“ ist als im Deutschen gebräuchliche biblische Ortsform vertretbar; die abweichende griechische Form Σιλώμ verlangt hier keine Fußnote.
