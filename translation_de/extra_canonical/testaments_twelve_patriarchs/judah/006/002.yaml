base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/006/002.yaml
  text: And when we joined battle, we routed them; and we killed those from Shiloh, their allies, and gave them no way of escape.
translation:
  language: de
  text: Und als wir den Kampf aufnahmen, schlugen wir sie in die Flucht. Ihre Verbündeten aus Silo töteten wir, und wir gewährten ihnen keinen Zugang, um zu uns vorzudringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνάψαντες
  choice: als wir den Kampf aufnahmen
  rationale: Das Partizip bezeichnet hier im militärischen Zusammenhang das Aufnehmen beziehungsweise Beginnen des Kampfes; die temporale Wiedergabe fügt sich natürlich in den deutschen Satz ein.
- source_word: ἐτρέψαμεν
  choice: schlugen wir sie in die Flucht
  rationale: Das Verb bedeutet in diesem militärischen Kontext, den Gegner zurückzuschlagen oder in die Flucht zu treiben.
- source_word: τοὺς ἀπὸ Σιλὼμ συμμάχους αὐτῶν
  choice: ihre Verbündeten aus Silo
  rationale: Die griechische Ortsform Σιλώμ wird mit der im Deutschen geläufigen biblischen Form „Silo“ wiedergegeben; συμμάχους bezeichnet militärische Verbündete.
- source_word: διέξοδον τοῦ εἰσελθεῖν πρὸς ἡμᾶς
  choice: Durchgang, um zu uns vorzudringen
  rationale: Die Wiedergabe folgt der ausdrücklich bezeugten Bewegungsrichtung „zu uns“ und deutet διέξοδος daher als Durchgang oder Zugang, nicht als Fluchtweg.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Erzählsprache mit klarer militärischer Terminologie. Die Übersetzung folgt beim letzten Satzteil bewusst dem griechischen Wortlaut und nicht der englischen Konsultationsfassung, die daraus einen Fluchtweg macht.
