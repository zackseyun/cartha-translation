  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/006/005.yaml
  text: And having hidden Simeon and the others[a] behind them[b], we seized the height, and utterly destroyed this city also.
translation:
  language: de
  text: Und nachdem ich Simeon und einen weiteren Mann[a] hinter ihnen[b] verborgen hatte, nahmen wir die Anhöhe ein und zerstörten auch diese Stadt vollständig.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Formulierung τὸν τε καὶ Συμεών ist elliptisch und ungewöhnlich. Sie verbindet Simeon mit einer weiteren, nicht namentlich genannten Person; die erhaltene Form τὸν ist Singular. Deren Identität bleibt offen.
    reason: lexical_note
  - marker: b
    text: Das seltene Adverb ἐξωπίσθεν bedeutet „von hinten“ oder „im Rücken“. Es bezeichnet hier die rückwärtige Stellung der verborgenen Personen.
    reason: cultural_note
lexical_decisions:
- source_word: ὑποκρύψας
  choice: nachdem ich … verborgen hatte
  rationale: Das aoristische Partizip bezeichnet eine der gemeinsamen Haupthandlung vorausgehende, gezielte taktische Maßnahme. Die Ich-Form macht den Numeruswechsel zum anschließenden „wir“ sichtbar.
- source_word: τὸν τε καὶ Συμεών
  choice: Simeon und die anderen
  rationale: Die ungewöhnliche τε … καί-Verbindung ordnet Simeon einer weiteren, nicht ausdrücklich bezeichneten Person oder Gruppe zu. Die flüssige Wiedergabe nennt diese Begleiter, während die Fußnote die grammatische Unbestimmtheit wahrt.
- source_word: ἐξωπίσθεν
  choice: hinter ihnen
  rationale: Das seltene Adverb bezeichnet eine Stellung von hinten beziehungsweise im Rücken. Im Zusammenhang einer verdeckten Truppe gibt „hinter ihnen“ die taktische Position knapp wieder.
- source_word: ἐπελαβόμεθα τοῦ ὑψηλοῦ
  choice: nahmen wir die Anhöhe ein
  rationale: ἐπιλαμβάνομαι mit Genitiv bedeutet hier ergreifen oder sich bemächtigen; das substantivierte ὑψηλόν bezeichnet erhöhtes Gelände. „Die Anhöhe einnehmen“ ist im Deutschen eine natürliche militärische Formulierung.
- source_word: ἐξωλοθρεύσαμεν
  choice: zerstörten … vollständig
  rationale: Das intensive Verb bezeichnet völlige Vernichtung. Bei einer Stadt ist „vollständig zerstören“ natürlich und bewahrt die verstärkende Bedeutung.
- source_word: καὶ ταύτην τὴν πόλιν
  choice: auch diese Stadt
  rationale: καί hat hier additive Kraft und stellt die Stadt in eine Reihe weiterer eroberter oder zerstörter Städte.
