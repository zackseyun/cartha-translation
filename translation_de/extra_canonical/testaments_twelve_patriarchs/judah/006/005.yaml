- from: Und nachdem ich Simeon und die anderen[a] hinter ihnen[b] verborgen hatte, nahmen wir die Anhöhe ein und zerstörten auch diese Stadt vollständig.
  to: Und nachdem ich Simeon und einen weiteren Mann[a] hinter ihnen[b] verborgen hatte, nahmen wir die Anhöhe ein und zerstörten auch diese Stadt vollständig.
  rationale: Die Revision beseitigt die unbelegte Pluralisierung von „die anderen“ und wahrt die textliche Unbestimmtheit der auffälligen griechischen Konstruktion. Die übrigen Formulierungen bleiben erhalten, da sie den griechischen Wortlaut und den modernen deutschen Erzählregister zuverlässig wiedergeben.
