translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählbewegung. Der Wechsel vom singularischen „ich“ beim Verbergen zum pluralischen „wir“ bei Angriff und Zerstörung bleibt entsprechend dem griechischen Satzbau erhalten; die unsichere Ergänzung bei Simeon wird nicht kommentarlos vereindeutigt, sondern in der Fußnote offengelegt.
