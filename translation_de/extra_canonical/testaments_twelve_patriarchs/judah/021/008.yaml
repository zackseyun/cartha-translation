source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Καὶ πολλῶν σάρκας ἀδίκως⁵⁵ κόρακας⁵⁵ ἐπὶ κακῷ⁶⁰ τῇ πλεονεξίᾳ ὑψούμενοι· καὶ προκόψουσιν ἐπὶ κακὰ καὶ ὑπερηφανίᾳ τοιούτου ἕως ὑψοῦνται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/008.yaml
  text: And they will unjustly fill ravens and ibises[b] with the flesh of many, and they will advance in evil, being lifted up in greed.
translation:
  language: de
  text: Und sie werden das Fleisch vieler zu Unrecht den Raben preisgeben[a], indem sie sich in ihrer Habgier zum Bösen erheben. Und sie werden im Bösen und in solcher Überheblichkeit immer weiter gehen, bis sie erhöht werden[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut ist hier verkürzt oder beschädigt: Wörtlich steht nur „das Fleisch vieler zu Unrecht den Raben“. „Preisgeben“ ergänzt den naheliegenden Sinn. Ibisse werden im vorliegenden griechischen Text nicht genannt.'
    reason: textual_difficulty
  - marker: b
    text: 'Oder: „bis sie sich selbst erhöhen“. Die griechische Verbform kann passiv oder medial verstanden werden.'
    reason: ambiguity
lexical_decisions:
- source_word: κόρακας
  choice: den Raben
  rationale: Das griechische Wort bezeichnet ausdrücklich Raben; die im englischen Konsultationstext zusätzlich genannten Ibisse stehen nicht im vorgelegten griechischen Text.
- source_word: πλεονεξίᾳ
  choice: in ihrer Habgier
  rationale: Gibt das Streben nach immer mehr beziehungsweise eigennützige Gier in natürlichem modernem Deutsch wieder.
- source_word: προκόψουσιν ἐπὶ κακὰ
  choice: sie werden im Bösen immer weiter gehen
  rationale: Bewahrt die Vorstellung eines Fortschreitens beziehungsweise zunehmenden Vorankommens zum Bösen hin.
- source_word: ὑπερηφανίᾳ
  choice: Überheblichkeit
  rationale: Trifft den negativen Sinn von Stolz, Hochmut und Selbstüberhöhung in diesem Zusammenhang.
theological_decisions:
- issue: Stimme und Bedeutung von ὑψοῦνται am Versende
  choice: bis sie erhöht werden
  alternative: bis sie sich selbst erhöhen
  rationale: Die Form kann passiv oder medial verstanden werden. Der Haupttext wahrt mit dem Passiv die formale Offenheit; die mediale Möglichkeit wird in der Fußnote genannt, ohne den Urheber der Erhöhung festzulegen.
- issue: Elliptische Syntax im ersten Satzteil
  choice: preisgeben als sinngemäße Ergänzung
  alternative: 'eine unverbundene wörtliche Wiedergabe: „das Fleisch vieler zu Unrecht den Raben“'
  rationale: Im überlieferten griechischen Wortlaut fehlt für die Akkusativgruppe ein ausdrückliches finites Verb. „Preisgeben“ stellt den naheliegenden Sinn verständlich her, ohne das im englischen Text verwendete, im Griechischen aber nicht belegte „füllen“ zu übernehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gewaltdarstellung bleibt deutlich, aber nicht unnötig ausgeschmückt. Die syntaktische Beschädigung des ersten Satzteils und die Mehrdeutigkeit der Schlussform werden transparent gemacht.
