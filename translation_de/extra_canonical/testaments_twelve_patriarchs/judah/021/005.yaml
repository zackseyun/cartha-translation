source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Ὁ γὰρ⁵ ἄγγελος Κυρίου εἶπέ μοι· Αὐτὸν ὑπὲρ σὲ ἐξελέξατο Κύριος προσεγγίζειν αὐτῷ²⁸, καὶ ἐσθίειν τὴν τράπεζαν αὐτοῦ, καὶ ἀπαρχὰς αὐτῷ προσφέρειν³¹ ἐντρυφημάτων³² υἱῶν Ἰσραήλ. *Σὺ δὲ ἔσῃ βασιλεὺς Ἰακὼβ³⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/005.yaml
  text: For the angel of the Lord told me that the Lord chose him above you, to draw near to him, and to eat at his table, and to offer the firstfruits of the delights of the sons of Israel[c] to him. But you shall be king of Jacob.
translation:
  language: de
  text: 'Denn der Engel des Herrn sagte zu mir: »Ihn hat der Herr dir vorgezogen, damit er sich ihm nähert, an seinem Tisch isst und ihm die Erstlingsgaben von den Köstlichkeiten der Söhne Israels darbringt.[a] Du aber wirst König über Jakob sein.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Mit den »Erstlingsgaben von den Köstlichkeiten der Söhne Israels« sind wahrscheinlich ausgewählte Erzeugnisse oder besonders wertvolle erste Gaben aus Israel gemeint.
    reason: cultural_note
lexical_decisions:
- source_word: Αὐτὸν ὑπὲρ σὲ ἐξελέξατο Κύριος
  choice: Ihn hat der Herr dir vorgezogen
  rationale: Gibt die vergleichende Wahl ›ihn über dich‹ natürlich wieder, ohne den Sinn abzuschwächen.
- source_word: προσεγγίζειν αὐτῷ
  choice: damit er sich ihm nähert
  rationale: Bewahrt die kultisch deutbare, zugleich aber allgemein formulierte Annäherung des griechischen Textes.
- source_word: ἐσθίειν τὴν τράπεζαν αὐτοῦ
  choice: an seinem Tisch isst
  rationale: Das griechische Idiom lautet wörtlich ›seinen Tisch essen‹; die deutsche Fassung gibt dessen natürlichen Sinn wieder.
- source_word: ἀπαρχὰς ... ἐντρυφημάτων υἱῶν Ἰσραήλ
  choice: die Erstlingsgaben von den Köstlichkeiten der Söhne Israels
  rationale: Erhält sowohl den kultischen Begriff ›Erstlingsgaben‹ als auch die ungewöhnliche Genitivverbindung und vermeidet eine unnötige Festlegung auf bestimmte Erzeugnisse.
- source_word: βασιλεὺς Ἰακώβ
  choice: König über Jakob
  rationale: Im Deutschen verlangt die gemeinte Herrschaftsbeziehung hier eine Präposition; ›Jakob‹ bleibt als Bezeichnung des Volkes erhalten.
theological_decisions:
- issue: Bezug und Charakter des Sich-Näherns
  choice: damit er sich ihm nähert
  alternative: damit er als Priester vor ihn tritt
  rationale: Der Text legt im Kontext eine kultisch-priesterliche Rolle nahe, nennt sie in diesem Satz aber nicht ausdrücklich; die Übersetzung bewahrt diese Offenheit.
- issue: Deutung der Erstlingsgaben der Köstlichkeiten
  choice: wörtlich-nahe Formulierung mit erklärender Fußnote
  alternative: die besten Erzeugnisse Israels als Erstlingsgaben
  rationale: Die Alternative wäre verständlicher, würde aber die semantische Spannung zwischen ἀπαρχάς und ἐντρυφημάτων stärker auslegen als der griechische Wortlaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede wird klar gegliedert; kultische Begriffe bleiben erkennbar, während unnatürliche griechische Idiome idiomatisch übertragen werden.
