source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: XXI. Καὶ νῦν, τέκνα μου¹, παραγγέλλω ὑμῖν, ἀγαπᾶτε² τὸν Λευὶ³, ἵνα διαμείνητε⁴, καὶ⁵ μὴ ἐπαίρεσθε⁷ ἐπ᾽ αὐτὸν⁸, ἵνα μὴ ἐξολοθρευθῆτε⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/001.yaml
  text: 'And now, my children, I command you: love Levi, so that you may remain, and do not exalt yourselves against him, lest you be utterly destroyed.'
translation:
  language: de
  text: 'Und nun, meine Kinder, gebiete ich euch: Liebt Levi, damit ihr bestehen bleibt, und erhebt euch nicht gegen ihn, damit ihr nicht völlig vernichtet werdet.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραγγέλλω
  choice: gebiete
  rationale: Gibt den verbindlichen Charakter der väterlichen Weisung würdig und direkt wieder.
- source_word: ἀγαπᾶτε
  choice: Liebt
  rationale: Entspricht dem Imperativ und bewahrt den umfassenden Sinn von ἀγαπάω.
- source_word: διαμείνητε
  choice: bestehen bleibt
  rationale: Gibt das fortdauernde Bestehen oder Fortbestehen wieder, ohne den Bezug unnötig zu verengen.
- source_word: μὴ ἐπαίρεσθε ἐπ᾽ αὐτόν
  choice: erhebt euch nicht gegen ihn
  rationale: Bewahrt sowohl das Bild des Sich-Erhebens als auch die feindliche Ausrichtung gegen Levi.
- source_word: μὴ ἐξολοθρευθῆτε
  choice: damit ihr nicht völlig vernichtet werdet
  rationale: Der passive Aorist und die starke Intensität des Verbs werden klar wiedergegeben.
theological_decisions:
- issue: Folge des Gehorsams gegenüber Levi
  choice: „damit ihr bestehen bleibt“
  alternative: „damit ihr am Leben bleibt“
  rationale: Das griechische διαμένω bezeichnet allgemein fortdauerndes Bestehen; eine ausdrückliche Beschränkung auf körperliches Überleben wäre interpretierend.
- issue: Warnung vor dem Auftreten gegenüber Levi
  choice: „erhebt euch nicht gegen ihn“
  alternative: „überhebt euch nicht über ihn“
  rationale: Die gewählte Fassung erhält die mögliche Vorstellung von Hochmut, stellt aber gemäß ἐπ᾽ αὐτόν die gegen Levi gerichtete Haltung deutlicher heraus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter paränetischer Rede. Die beiden ἵνα-Sätze werden parallel mit „damit“ wiedergegeben; der zweite bleibt dadurch formal als negativer Zweck- bzw. Folgesatz erkennbar.
