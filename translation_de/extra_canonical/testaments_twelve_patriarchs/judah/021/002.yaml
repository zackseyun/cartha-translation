id: T12P.JUD.21.2
reference: Testament of Judah 21:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Ἐμοὶ γὰρ¹⁰ ἔδωκεν¹¹ ὁ Θεὸς¹² τὴν βασιλείαν, κἀκείνῳ¹² τὴν ἱερατείαν¹³, καὶ¹⁴ ὑπέταξε¹⁴ τὴν βασιλείαν τῇ ἱερωσύνῃ¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/002.yaml
  text: For God gave me the kingship, and to him the priesthood, and he subjected the kingship to the priesthood.
translation:
  language: de
  text: Denn mir gab Gott die Königsherrschaft, ihm aber das Priestertum; und er ordnete die Königsherrschaft dem Priestertum unter.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλείαν
  choice: Königsherrschaft
  rationale: Bezeichnet hier die königliche Herrschaft beziehungsweise das Königsamt; „Königsherrschaft“ wahrt den institutionellen Sinn im Gegensatz zum Priestertum.
- source_word: ἱερατείαν
  choice: Priestertum
  rationale: Gibt das Priesteramt beziehungsweise die priesterliche Institution natürlich und präzise wieder.
- source_word: ἱερωσύνῃ
  choice: Priestertum
  rationale: Obwohl ein anderes griechisches Substantiv als zuvor verwendet wird, bezeichnet es im Kontext ebenfalls die priesterliche Würde beziehungsweise Institution; die einheitliche Wiedergabe ist im Deutschen idiomatisch.
- source_word: ὑπέταξε
  choice: ordnete … unter
  rationale: Bewahrt die Aussage eines hierarchischen Unterstellungsverhältnisses, ohne sie weitergehend theologisch auszudeuten.
theological_decisions:
- issue: Verhältnis von Königsherrschaft und Priestertum
  choice: Die Königsherrschaft wird dem Priestertum untergeordnet.
  alternative: Die Königsherrschaft wird dem Priestertum dienstbar gemacht.
  rationale: Das griechische ὑπέταξε bezeichnet ausdrücklich Unterordnung; die Übersetzung erhält diese Spannung, ohne Art oder Reichweite der Unterordnung näher festzulegen.
- issue: Bezug von κἀκείνῳ und Subjekt von ὑπέταξε
  choice: „ihm“ bleibt ohne ergänzende Namensnennung; „er“ wird auf Gott bezogen.
  alternative: 'Den im Kontext gemeinten Empfänger namentlich einsetzen oder das Subjekt wiederholen: „Gott ordnete …“'
  rationale: Der Vers selbst nennt den Empfänger nur pronominal. Das grammatische Subjekt des vorangehenden Satzes, Gott, bleibt für ὑπέταξε maßgeblich; die pronominale Form bewahrt die Gestalt des Ausgangstextes.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Gegenüberstellung von Königsherrschaft und Priestertum sowie die abschließende Unterordnungsaussage bleiben eng am griechischen Satzbau, werden jedoch mit deutscher Zeichensetzung flüssig formuliert.
