  source_fidelity: 'Der deutsche Text gibt den vollständigen vorliegenden griechischen Satz getreu wieder: Das futurische Prädikat, der Vergleich „wie Unwetter“ (καταιγίδες), die falschen Propheten und die Verfolgung aller Gerechten sind enthalten. Die im englischen Auditvermerk behauptete Textunterbrechung nach dem Vergleich entspricht nicht dem hier vorgelegten griechischen Ausgangstext, der zudem „und sie werden alle Gerechten verfolgen“ enthält; für diese Prüfung ist der griechische Text maßgeblich.'
  naturalness: „Und falsche Propheten werden wie Unwetter sein und alle Gerechten verfolgen“ ist flüssiges, modernes und zugleich würdiges Standarddeutsch. Die gemeinsame Zukunftskonstruktion ist klar und vermeidet unnötige Wiederholung.
  terminology: „falsche Propheten“, „Unwetter“, „Gerechte“ und „verfolgen“ sind treffende, registergerechte Wiedergaben. „Unwetter“ wahrt die bedrohlich-gewaltsame Bildsprache, ohne sie übermäßig auszudeuten.
