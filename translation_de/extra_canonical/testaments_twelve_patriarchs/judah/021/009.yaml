source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Καὶ ἔσονται ὡς καταιγίδες⁶¹ ψευδοπροφῆται⁶³, καὶ πάντας τοὺς δικαίους διώξουσιν⁶⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/009.yaml
  text: And there will be false prophets like storms[a],
translation:
  language: de
  text: Und falsche Propheten werden wie Unwetter sein und alle Gerechten verfolgen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταιγίδες
  choice: Unwetter
  rationale: Gibt das Bild heftiger, bedrohlicher Stürme in natürlichem modernem Deutsch wieder; „Stürme“ wäre ebenfalls möglich, während „Unwetter“ die zerstörerische Wirkung stärker vermittelt.
- source_word: ψευδοπροφῆται
  choice: falsche Propheten
  rationale: Die übliche und klare deutsche Wiedergabe für Propheten, deren Anspruch oder Botschaft falsch ist.
- source_word: πάντας τοὺς δικαίους
  choice: alle Gerechten
  rationale: Bewahrt sowohl den umfassenden Sinn von πάντας als auch die substantivische Bezeichnung derjenigen, die als gerecht gelten.
- source_word: διώξουσιν
  choice: verfolgen
  rationale: Entspricht hier dem feindseligen Nachstellen und Bedrängen; das Futur wird mit „werden … verfolgen“ wiedergegeben.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der vollständige bereitgestellte griechische Ausgangstext wurde übersetzt; die kürzere englische Beratungsschicht, die nach dem ersten Satzteil abbricht, wurde nicht als maßgeblicher Grundtext behandelt.
