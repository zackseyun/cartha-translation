  source_fidelity: 'Die Übersetzung gibt den Vergleichssatz und seine Einschränkung sachgerecht wieder: ὑπερέχει ist treffend mit „überragt“ wiedergegeben; „das Priestertum Gottes“ wahrt den offenen Genitiv; „das irdische Königtum“ bildet τῆς ἐπιγείου βασιλείας angemessen ab. Die beiden nachfolgenden Verben beziehen sich plausibel auf das Priestertum. „Durch Sünden“ erhält den griechischen Plural und die kausale Vermittlung. Die Fassung folgt auch dem englischen POB-Audit-Trail ohne zusätzliche theologische Festlegung.'
  naturalness: Modernes, würdiges und gut verständliches Standarddeutsch. Die Personifizierung des Priestertums ist im Deutschen ebenso möglich wie im griechischen Ausgangstext. „Sofern es nicht“ ist eine natürliche konditionale Wiedergabe von ἐὰν μή; eine Fassung mit „es sei denn“ wäre ebenfalls möglich, aber nicht erforderlich.
  terminology: 'Die zentralen Begriffe sind konsistent und registergerecht: „Priestertum Gottes“, „irdisches Königtum“, „Sünden“, „Herr“ und „beherrscht wird“. Die Übersetzung bewahrt die Aussage, ohne den Genitiv „Gottes“ oder die Art des Abfalls konfessionell zu präzisieren.'
