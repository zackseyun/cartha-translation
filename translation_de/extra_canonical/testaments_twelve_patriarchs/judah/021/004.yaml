source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Οὕτως²⁰ γὰρ¹⁹ *ὑπερέχει ἡ ἱερατεία τοῦ Θεοῦ τῆς ἐπιγείου βασιλείας²¹, ἐὰν μὴ διὰ ἁμαρτιῶν ἐκπέσῃ²² ἀπὸ Κυρίου²³ καὶ διὰ τοῦ²⁴ τῆς ἐπιγείου βασιλείας *κυριευθῇ²⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/004.yaml
  text: For thus the priesthood of God surpasses the earthly kingdom, unless through sin it falls away from the Lord and is ruled by the earthly kingdom.
translation:
  language: de
  text: Denn so überragt das Priestertum Gottes das irdische Königtum, sofern es nicht durch Sünden vom Herrn abfällt und durch das irdische Königtum beherrscht wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπερέχει
  choice: überragt
  rationale: Gibt den Vorrang beziehungsweise die Überlegenheit des Priestertums gegenüber dem Königtum natürlich und prägnant wieder.
- source_word: ἡ ἱερατεία τοῦ Θεοῦ
  choice: das Priestertum Gottes
  rationale: Formale und im Deutschen verständliche Entsprechung; der Genitiv bleibt wie im Griechischen offen.
- source_word: τῆς ἐπιγείου βασιλείας
  choice: das irdische Königtum
  rationale: Im Vergleich mit dem Priestertum bezeichnet βασιλεία hier am ehesten die Institution oder Herrschaftssphäre des Königtums; „irdisch“ entspricht ἐπίγειος.
- source_word: ἐὰν μὴ
  choice: sofern … nicht
  rationale: Bewahrt die konditionale Einschränkung, ohne sie als bloße zeitliche Aussage wiederzugeben.
- source_word: διὰ ἁμαρτιῶν
  choice: durch Sünden
  rationale: Folgt dem griechischen Plural und lässt sowohl verursachenden als auch vermittelnden Sinn zu.
- source_word: ἐκπέσῃ ἀπὸ Κυρίου
  choice: vom Herrn abfällt
  rationale: Gibt die Trennung beziehungsweise den Verlust der Stellung bei dem Herrn idiomatisch wieder.
- source_word: κυριευθῇ
  choice: beherrscht wird
  rationale: Bewahrt das Passiv und den Sinn, unter die Herrschaft einer anderen Macht zu geraten.
theological_decisions:
- issue: Bedingtheit der Überlegenheit des Priestertums
  choice: „sofern es nicht“
  alternative: „es sei denn, es fällt … ab“
  rationale: Die Übersetzung erhält die im griechischen ἐὰν μή ausgedrückte Bedingung und macht die Überlegenheit nicht unterschiedslos absolut.
- issue: Bezug des ausgelassenen Subjekts bei ἐκπέσῃ und κυριευθῇ
  choice: Bezug auf „das Priestertum Gottes“
  alternative: Bezug auf die Träger des Priestertums
  rationale: Das grammatische Subjekt ist am unmittelbarsten ἡ ἱερατεία; eine personifizierende Rede vom Priestertum bleibt möglich und wird nicht erklärend umgedeutet.
- issue: Genitiv „Gottes“
  choice: unbestimmt als „Priestertum Gottes“ bewahrt
  alternative: „das von Gott eingesetzte Priestertum“
  rationale: Der Genitiv kann Zugehörigkeit, Ursprung oder Einsetzung anzeigen; eine ausdrückliche Festlegung würde die echte Offenheit des Ausgangstextes reduzieren.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzstruktur bleibt eng am griechischen Gedankengang, wird aber durch „sofern“ flüssig und verständlich gestaltet. Keine Fußnoten erforderlich.
