  text: Ἐμοὶ ἔδωκε τὰ¹⁶ ἐπὶ γῆς, ἐκείνῳ τὰ ἐν οὐρανοῖς¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/003.yaml
  text: To me he gave the things on earth; to him, the things in heaven.
translation:
  language: de
  text: Mir gab er, was auf der Erde ist; ihm, was im Himmel ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐμοὶ … ἐκείνῳ
  choice: Mir … ihm
  rationale: Die betont gegenübergestellten Dative werden knapp und parallel wiedergegeben.
- source_word: τὰ ἐπὶ γῆς
  choice: was auf der Erde ist
  rationale: Die substantivierte Wendung bezeichnet umfassend die irdischen Dinge bzw. den irdischen Bereich; die Formulierung bleibt natürlich und nahe am Griechischen.
- source_word: τὰ ἐν οὐρανοῖς
  choice: was im Himmel ist
  rationale: Der griechische Plural οὐρανοῖς kann im Deutschen idiomatisch mit dem kollektiven Singular „Himmel“ wiedergegeben werden, ohne den Sinn einzuengen.
theological_decisions:
- issue: Elliptischer zweiter Satzteil
  choice: 'Das im zweiten Glied ausgelassene Verb bleibt auch auf Deutsch unausgesprochen: „ihm, was …“'
  alternative: „ihm gab er, was im Himmel ist“
  rationale: Die Ellipse bewahrt die prägnante Parallelstruktur und lässt die im Griechischen hervorgehobene Gegenüberstellung bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; knappe Parallelkonstruktion. Keine Fußnoten erforderlich.
