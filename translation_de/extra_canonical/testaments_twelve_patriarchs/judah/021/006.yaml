source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Καὶ ἔσῃ³⁶ ἐν αὐτοῖς³⁷ ὡς³⁸ ἡ³⁹ θάλασσα. Καθάπερ⁴⁰ γὰρ⁴¹ ἐν αὐτῇ δίκαιοι καὶ ἄδικοι, οἱ μὲν αἰχμαλωτίζονται οἱ δὲ πλουτοῦσιν⁴⁴, οὕτως καὶ ἐν σοὶ πᾶν γένος ἀνθρώπων· οἱ μὲν †κωδυνεύσουσιν αἰχμαλωτιζόμενοι, οἱ δὲ πλουτοῦντες ἁρπάζοντες τὰ ἀλλότρια.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/006.yaml
  text: 'And you shall be among them like the sea. For just as in it the righteous are storm-tossed, some being taken captive and others growing rich, so also in you every race of men: some are endangered, being taken captive, and others grow rich by seizing what belongs to others.'
translation:
  language: de
  text: 'Und du wirst unter ihnen sein wie das Meer. Denn wie es darin Gerechte und Ungerechte gibt – die einen geraten in Gefangenschaft, die anderen werden reich –, so wird es auch in dir jede Art von Menschen geben: Die einen werden in Gefahr geraten[a], indem sie gefangen genommen werden; die anderen werden reich, indem sie an sich reißen, was anderen gehört.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das zugrunde liegende griechische Wort ist in der Handschrift beziehungsweise Textüberlieferung unsicher; wahrscheinlich ist gemeint: „werden in Gefahr geraten“.'
    reason: Die Ausgabe kennzeichnet †κωδυνεύσουσιν als verderbte oder unsichere Lesart; die Übersetzung folgt der wahrscheinlichen Deutung als κινδυνεύσουσιν.
lexical_decisions:
- source_word: θάλασσα
  choice: Meer
  rationale: Die direkte und im Bild natürliche Entsprechung.
- source_word: πᾶν γένος ἀνθρώπων
  choice: Menschen jeder Art
  rationale: γένος bezeichnet hier verschiedene Gruppen oder Arten von Menschen; „jedes Menschengeschlecht“ wäre im heutigen Deutsch missverständlich und unnötig steif.
- source_word: αἰχμαλωτίζονται / αἰχμαλωτιζόμενοι
  choice: geraten in Gefangenschaft / indem sie gefangen genommen werden
  rationale: Gibt sowohl den Zustand als auch den passivischen Vorgang des griechischen Verbs verständlich wieder.
- source_word: ἁρπάζοντες τὰ ἀλλότρια
  choice: indem sie sich fremdes Eigentum aneignen
  rationale: Bewahrt den Sinn des gewaltsamen oder unrechtmäßigen Ergreifens dessen, was anderen gehört, in natürlichem Deutsch.
theological_decisions:
- issue: Zuordnung von „Gerechten und Ungerechten“ zu den beiden folgenden Gruppen
  choice: „die einen … die anderen“
  alternative: „die Gerechten … die Ungerechten“
  rationale: Der griechische Satz legt eine Zuordnung nahe, benennt sie im zweiten Satzglied aber nicht nochmals ausdrücklich. Die gewählte Form bewahrt diese leichte Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Meeresmetapher und die parallele Satzstruktur bleiben erhalten; die unsichere Lesart wird nicht stillschweigend geglättet, sondern durch eine Fußnote offengelegt.
