source:
  edition: Charles 1908 Greek Versions (Judah source-fix v2 — T12P Pass A; α-column primary, apparatus stripped)
  text: Ὅτι οἱ βασιλεύσουσιν⁵⁰ ὡς κήτη ἔσονται, *καταπίνοντες ἀνθρώπους⁵¹ ὡς ἰχθύας· υἱοὺς καὶ θυγατέρας ἐλευθέρους⁵² καταδουλώσουσιν⁵³, *οἴκους, ἀγρούς⁵⁴, ποίμνια, χρήματα ἁρπάσουσιν⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021/007.yaml
  text: For the kings will be like sea monsters, swallowing people like fish; they will make sons and daughters of free people servants, and they will seize houses, fields, flocks, and wealth.
translation:
  language: de
  text: 'Denn die Könige werden wie Seeungeheuer sein: Sie verschlingen Menschen wie Fische; freie Söhne und Töchter werden sie versklaven, und Häuser, Felder, Herden und Vermögen werden sie rauben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ βασιλεύσουσιν
  choice: die Könige
  rationale: Die substantivisch gebrauchte Form bezeichnet diejenigen, die herrschen werden; im Zusammenhang ist die natürliche deutsche Wiedergabe „die Könige“.
- source_word: κήτη
  choice: Seeungeheuer
  rationale: κῆτος bezeichnet ein großes, bedrohliches Meerestier oder Seeungeheuer; die bildhafte und unheilvolle Wirkung bleibt so erhalten.
- source_word: ἀνθρώπους
  choice: Menschen
  rationale: Die geschlechtsübergreifende Bedeutung des griechischen Ausdrucks wird direkt und zeitgemäß wiedergegeben.
- source_word: υἱοὺς καὶ θυγατέρας ἐλευθέρους
  choice: freie Söhne und Töchter
  rationale: ἐλευθέρους wird grammatisch auf beide Personengruppen bezogen und als deren eigener gesellschaftlicher Status verstanden, ohne die im Englischen vorgenommene Ergänzung „von freien Menschen“.
- source_word: καταδουλώσουσιν
  choice: werden sie versklaven
  rationale: Das Verb bedeutet, jemanden in Knechtschaft beziehungsweise Sklaverei zu bringen; „versklaven“ ist präzise und natürlich.
- source_word: χρήματα
  choice: Vermögen
  rationale: Im Kontext geraubten Besitzes meint der Plural materielle Mittel beziehungsweise Besitz; „Vermögen“ passt zur Aufzählung und vermeidet die unnötige Verengung auf Bargeld.
theological_decisions: []
translation_notes:
  register: Dignifiziertes, modernes Standarddeutsch. Die kräftige Herrscherkritik und das Raubtierbild werden ohne Abschwächung bewahrt. Die Satzglieder folgen eng der griechischen Reihung, sind aber durch Doppelpunkt und Semikolon für heutige Leser klar gegliedert.
