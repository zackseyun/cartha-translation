  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/judah/021.yaml
  text: 'And now, my children, I command you: love Levi, so that you may remain, and do not exalt yourselves over him, lest you be utterly destroyed. For God gave me the kingship, and to him the priesthood, and he subjected the kingship to the priesthood. To me he gave the things on earth; to him, the things in the heavens. For thus the priesthood of God surpasses the earthly kingdom, unless through sin it falls away from the Lord and is ruled by the earthly kingdom.


    For the angel of the Lord told me that the Lord chose him above you, to draw near to him, and to eat at his table, and to offer him the firstfruits of the delights of the sons of Israel[c]. But you shall be king of Jacob. And you shall be among them like the sea. For just as in it the righteous are storm-tossed, some being taken captive and others growing rich, so also in you every race of men: some are endangered, being taken captive, and others grow rich by seizing what belongs to others.


    For the kings will be like sea-monsters, swallowing men like fish; they will enslave sons and daughters of free people, and they will seize houses, fields, flocks, and wealth. And they will unjustly fill ravens and ibises[b] with the flesh of many, and they will advance in evil, being lifted up in greed. And there will be false prophets like storms[a],'
translation:
  language: de
  text: '21 Und nun, meine Kinder, gebiete ich euch: Liebt Levi, damit ihr Bestand habt, und erhebt euch nicht über ihn, damit ihr nicht völlig vernichtet werdet. 2 Denn mir gab Gott das Königtum, ihm aber das Priestertum; und er unterstellte das Königtum dem Priestertum. 3 Mir gab er, was auf der Erde ist, ihm aber, was in den Himmeln ist. 4 Denn so überragt das Priestertum Gottes das irdische Königtum – es sei denn, es fällt durch Sünden vom Herrn ab und gerät unter die Herrschaft des irdischen Königtums.


    5 Denn der Engel des Herrn sagte zu mir: »Ihn hat der Herr dir vorgezogen und erwählt, sich ihm zu nahen, an seinem Tisch zu essen und ihm die Erstlingsgaben von den köstlichen Gaben der Söhne Israels darzubringen.[a] Du aber wirst König über Jakob sein.« 6 Und du wirst unter ihnen wie das Meer sein. Denn wie es im Meer Gerechte und Ungerechte gibt – die einen werden gefangen genommen, die anderen werden reich –, so wird es auch in dir jede Art von Menschen geben: Die einen werden in Gefahr geraten und gefangen genommen, die anderen werden reich, indem sie fremdes Eigentum rauben.[b]


    7 Denn die, die als Könige herrschen werden, werden wie Seeungeheuer sein: Sie verschlingen Menschen wie Fische. Söhne und Töchter freier Menschen werden sie versklaven; Häuser, Felder, Herden und Vermögen werden sie rauben. 8 Ungerechterweise werden sie Raben mit dem Fleisch vieler [füttern] und sich in böser Habgier erheben.[c] Sie werden in Bosheiten und Überheblichkeit fortschreiten, bis sie sich so hoch erheben. 9 Und falsche Propheten werden wie Unwetter sein und alle Gerechten verfolgen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die »Erstlingsgaben von den köstlichen Gaben der Söhne Israels« sind wahrscheinlich ausgewählte, wertvolle Erzeugnisse, die Israel als erste Gaben darbrachte.
    reason: cultural_note
  - marker: b
    text: Das griechische Wort hinter »werden in Gefahr geraten« ist in der überlieferten Form unsicher. Wahrscheinlich ist ein ähnlich geschriebenes Verb mit der Bedeutung »in Gefahr geraten« gemeint.
    reason: textual_variant
  - marker: c
    text: Der griechische Satz ist an dieser Stelle grammatisch beschädigt. Für das Bild der Raben fehlt ein finites Verb; »füttern« wurde daher sinngemäß in eckigen Klammern ergänzt. Das Partizip »sich erhebend« ist im Griechischen vorhanden, seine genaue syntaktische Verbindung bleibt jedoch unsicher. Sicher erkennbar ist das Bild, dass Raben das Fleisch vieler Getöteter fressen. Im hier vorgelegten griechischen Text werden nur Raben, keine weiteren Vögel, genannt.
    reason: textual_variant
lexical_decisions:
- source_word: παραγγέλλω
  choice: gebiete ich euch
  rationale: Bewahrt den verbindlichen, nachdrücklichen Charakter der väterlichen Weisung.
- source_word: ἀγαπᾶτε
  choice: Liebt
  rationale: Gibt den direkten ethischen Imperativ schlicht und unmittelbar wieder.
- source_word: ἐπαίρεσθε ἐπ᾽ αὐτόν
  choice: erhebt euch nicht über ihn
  rationale: Erhält das räumliche Bild der Selbsterhöhung gegenüber Levi.
- source_word: ἐξολοθρευθῆτε
  choice: völlig vernichtet werdet
  rationale: Bringt die verstärkende Bedeutung des griechischen Verbs und die Schwere der Warnung zum Ausdruck.
- source_word: βασιλεία
  choice: Königtum
  rationale: Bezeichnet hier vor allem das Juda verliehene königliche Amt, nicht lediglich ein Herrschaftsgebiet.
- source_word: ἱερατεία / ἱερωσύνη
  choice: Priestertum
  rationale: Ist die klare und übliche Bezeichnung für das Levi zugewiesene priesterliche Amt.
- source_word: ὑπέταξε
  choice: unterstellte
  rationale: Macht die im Ausgangstext ausdrücklich gesetzte Rangordnung deutlich.
- source_word: τὰ ἐπὶ γῆς / τὰ ἐν οὐρανοῖς
  choice: was auf der Erde ist / was in den Himmeln ist
  rationale: Bewahrt die parallele, weit gefasste Gegenüberstellung der beiden Bereiche.
- source_word: ἐκπέσῃ ἀπὸ Κυρίου
  choice: fällt ... vom Herrn ab
  rationale: Gibt sowohl das Fallen als auch den religiös-moralischen Abfall wieder.
- source_word: προσεγγίζειν
  choice: sich ihm zu nahen
  rationale: Bewahrt die kultische Sprache des priesterlichen Zugangs zu Gott.
- source_word: ἐντρυφημάτων
  choice: köstlichen Gaben
  rationale: Vermittelt den Sinn ausgewählter, kostbarer Erzeugnisse in verständlichem Deutsch, ohne die Wendung rein metaphorisch zu deuten.
- source_word: κωδυνεύσουσιν
  choice: werden in Gefahr geraten
  rationale: Der überlieferte Ausdruck ist textlich unsicher; die Wiedergabe folgt der naheliegenden Deutung als Form von κινδυνεύω.
- source_word: κήτη
  choice: Seeungeheuer
  rationale: Erhält das bedrohliche Meeresbild und ist weiter gefasst als eine Festlegung auf Wale.
- source_word: καταιγίδες
  choice: Unwetter
  rationale: Bezeichnet heftige Sturmereignisse und funktioniert im Deutschen natürlich als Bild für die falschen Propheten.
theological_decisions:
- issue: Verhältnis von Judas Königtum und Levis Priestertum
  choice: Das von Gott an Juda verliehene Königtum wird dem Priestertum Levis unterstellt.
  alternative: Beide Ämter lediglich als gleichrangige, einander ergänzende Aufgaben darzustellen.
  rationale: Das Verb ὑπέταξε bezeichnet eine wirkliche Unterordnung; diese Spannung wird nicht abgeschwächt.
- issue: Bedingtheit des Vorrangs des Priestertums
  choice: Das Priestertum überragt das irdische Königtum, kann diesen Vorrang aber durch Sünden und Abfall vom Herrn verlieren.
  alternative: Den Abfall auf das irdische Königtum zu beziehen oder die Bedingung auszulassen.
  rationale: Das Priestertum ist das nächstliegende grammatische Subjekt. Die Übersetzung bewahrt, dass sein Vorrang im Text nicht unabhängig von seiner Treue gilt.
- issue: Kultisches Vorrecht Levis
  choice: Levis Nahen zu Gott, Essen an seinem Tisch und Darbringen der Erstlingsgaben werden als priesterlich-kultische Aufgaben wiedergegeben.
  alternative: Die Tischgemeinschaft ausschließlich metaphorisch zu verstehen.
  rationale: Der Zusammenhang mit Priestertum und Erstlingsgaben spricht für einen kultischen Sinn, ohne jedes Einzelbild dogmatisch festzulegen.
- issue: Gericht und Ausbeutung unter der Königsherrschaft
  choice: Die königliche Linie Judas wird als ein Bereich dargestellt, in dem Menschen gefangen genommen und durch Raub bereichert werden.
  alternative: Das Bild ausschließlich allgemein auf fremde Völker zu beziehen.
  rationale: ἐν σοὶ richtet die Aussage ausdrücklich an Juda, während πᾶν γένος ἀνθρώπων ihren gesellschaftlichen Umfang erweitert.
- issue: Falsche Propheten und Verfolgung der Gerechten
  choice: Der in Vers 9 vorliegende griechische Schlusssatz wird vollständig übersetzt.
  alternative: Nach dem Vergleich mit Unwettern abzubrechen, wie es die englische Konsultationsfassung tut.
  rationale: Der bereitgestellte griechische Ausgangstext enthält zusätzlich καὶ πάντας τοὺς δικαίους διώξουσιν und trägt damit die Aussage über die Verfolgung aller Gerechten.
translation_notes:
  register: 'Modernes Standarddeutsch in würdigem, testamentarisch-mahnendem Ton. Die direkte Anrede und die Parallelismen bleiben erhalten. Sperrige oder beschädigte Stellen werden nicht stillschweigend geglättet: Eine notwendige Ergänzung steht in eckigen Klammern, textliche Unsicherheiten werden in Fußnoten ausgewiesen. Die Verszählung wurde zur Orientierung beibehalten.'
