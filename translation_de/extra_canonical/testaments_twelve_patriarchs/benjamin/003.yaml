  rationale: Die Revision verbessert quellennahe Präzision und modernes Deutsch, ohne den schwierigen bzw. beschädigten Wortlaut zu harmonisieren. Insbesondere werden in Vers 5 weder „wilde“ Tiere noch eine ausdrückliche Hilfe durch den Herrn in den Haupttext oder die Fußnote eingetragen. Die textkritische Kennzeichnung der eckig geklammerten Zusätze in Vers 8 und die bestehenden Fußnotenanker bleiben erhalten.
  reviewer_model: gpt-5.6-terra
