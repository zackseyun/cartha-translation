base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003.yaml
  text: 1[a]. Now therefore, my children, you also must love the Lord, the God of heaven and earth, and keep his commandments, imitating the good and holy man Joseph. 2. And let your mind be set on what is good, as you know mine is. For the one who has a right mind sees everything rightly. 3. Fear the Lord and love your neighbor; and if the spirits of Beliar should drive you into every wickedness of affliction, they will certainly not rule over you, just as they did not over Joseph my brother. 4. How many men wanted to kill him, yet God sheltered him[b]. For the one who fears God and loves his neighbor cannot be struck by the spirit of Beliar, being sheltered by the fear of God. 5. And he cannot be mastered by the plots of men or of beasts, since the Lord helps him through the love that he has toward his neighbor. 6. For Joseph also begged our father to pray for his brothers, so that the Lord would not reckon sin to them, because they had done evil against him. 7. And thus Jacob cried out,
    “O good child, you have stirred the inward affection of Jacob your father”; and embracing him, for two hours he kept kissing him, saying, 8. “The heavenly prophecy will be fulfilled upon you.”
translation:
  language: de
  text: '**Testament Benjamins 3**


    **1** Nun also, meine Kinder: Liebt auch ihr den Herrn, den Gott des Himmels und der Erde, und haltet seine Gebote. Nehmt euch dabei den guten und heiligen Josef zum Vorbild. **2** Richtet euren Sinn auf das Gute, wie ihr es auch von mir kennt. Denn wer einen aufrichtigen Sinn hat, sieht alles richtig. **3** Fürchtet den Herrn und liebt euren Nächsten. Selbst wenn die Geister Beliars euch in jede Bosheit der Bedrängnis hinreißen sollten, werden sie doch keinesfalls über euch herrschen – ebenso wenig, wie sie über meinen Bruder Josef herrschten. **4** Wie viele Menschen wollten ihn töten! Doch Gott beschützte ihn. Denn wer Gott fürchtet und seinen Nächsten liebt, kann vom Geist Beliars nicht niedergeschlagen werden, weil die Gottesfurcht ihn beschirmt. **5** Auch Nachstellungen von Menschen oder Tieren können ihn nicht überwältigen; denn durch die Liebe, die er seinem Nächsten entgegenbringt, wird ihm geholfen.[a]


    **6** Josef bat nämlich auch unseren Vater, für seine Brüder zu beten, damit der Herr ihnen die Sünde nicht anrechnen möge, weil sie ihm Böses angetan hatten. **7** Da rief Jakob aus: »Mein gutes Kind, du hast das Herz deines Vaters Jakob gewonnen!« Dann schloss er ihn in die Arme, küsste ihn zwei Stunden lang immer wieder und sagte: **8** »An dir wird sich eine himmlische Prophezeiung erfüllen:[b] [die Prophezeiung über das Lamm Gottes und den Retter der Welt.] Denn ein Makelloser wird von Gesetzlosen ausgeliefert werden, und der Sündlose wird für Gottlose sterben – [im Blut des Bundes zur Rettung der Völker und Israels sowie zur Vernichtung Beliars und seiner Diener].«[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text ist am Ende dieses Verses beschädigt und schwer verständlich. Er spricht von Hilfe „durch die Liebe“, die der Betreffende seinem Nächsten entgegenbringt; die genaue Verbindung der Worte ist unsicher. Einige Textzeugen bieten zudem abweichende Erweiterungen über Tiere oder einen „Luftgeist“.
    reason: textual_variant
  - marker: b
    text: 'Auch möglich: „Die himmlische Prophezeiung über dich wird sich erfüllen.“ Die Präposition ist in der Überlieferung leicht unterschiedlich gefasst.'
    reason: alternative_reading
  - marker: c
    text: Die in eckigen Klammern stehenden Teile von Vers 8 sind bereits in der zugrunde gelegten griechischen Edition als textgeschichtlich unsicher gekennzeichnet. Der nicht eingeklammerte Satz über den Makellosen und Sündlosen gehört dort jedoch zum fortlaufenden Text.
    reason: textual_variant
lexical_decisions:
- source_word: ἀγαπήσατε
  choice: Liebt
  rationale: Der Imperativ gibt die ethische und bundestheologische Kraft des Verbs unmittelbar und natürlich wieder.
- source_word: φυλάξατε ἐντολὰς αὐτοῦ
  choice: haltet seine Gebote
  rationale: „Gebote halten“ ist im Deutschen die geläufige und zugleich quellennahe biblische Wendung.
- source_word: μιμούμενοι
  choice: Nehmt euch … zum Vorbild
  rationale: Die idiomatische deutsche Form bewahrt den paränetischen Sinn moralischer Nachahmung, ohne steif zu wirken.
- source_word: διάνοια
  choice: Sinn
  rationale: Hier bezeichnet das Wort die moralisch-geistige Ausrichtung. „Sinn“ ermöglicht zugleich die Wiederholung in Vers 2.
- source_word: εἰς τὸ ἀγαθόν
  choice: auf das Gute
  rationale: Bewahrt die Ausrichtung auf das Gute und ergibt zusammen mit „Richtet euren Sinn“ natürliches Deutsch.
- source_word: ὀρθὴν … ὀρθῶς
  choice: aufrichtigen Sinn … alles richtig
  rationale: Die Wortverwandtschaft des Griechischen lässt sich nicht vollständig nachbilden; die Formulierung erhält jedoch den Zusammenhang zwischen innerer Ausrichtung und rechter Wahrnehmung.
- source_word: πλησίον
  choice: Nächsten
  rationale: Der etablierte ethische Begriff wahrt die schriftsprachliche und biblische Resonanz.
- source_word: τὰ πνεύματα τοῦ Βελίαρ
  choice: die Geister Beliars
  rationale: Die Namensform des griechischen Textes wird als „Beliar“ beibehalten und nicht zu „Belial“ harmonisiert.
- source_word: ἐκστήσωσι
  choice: hinreißen
  rationale: Gibt die gewaltsame Einwirkung feindlicher Geister wieder, ohne eine bestimmte psychologische Deutung festzulegen.
- source_word: κατακυριεύσωσιν
  choice: über euch herrschen
  rationale: Bewahrt das Bild feindlicher Herrschaft und die emphatische Verneinung οὐ μή durch „keinesfalls“.
- source_word: ἐσκέπασεν / σκεπαζόμενος
  choice: beschützte / beschirmt
  rationale: Beide Wörter halten das wiederkehrende Schutz- und Bedeckungsbild fest, vermeiden aber im Deutschen eine unnatürliche Wiederholung.
- source_word: πληγῆναι
  choice: niedergeschlagen werden
  rationale: Bewahrt den passiven Angriffssinn und passt zum Wirken einer feindlichen Macht; sowohl körperliche als auch übertragene Nuancen bleiben möglich.
- source_word: τὰ σπλάγχνα … ἐνίκησας
  choice: du hast das Innerste … bezwungen
  rationale: Die starke Körper- und Gefühlsmetapher sowie das Verb des Überwindens bleiben erhalten, statt sie zu „gerührt“ abzuschwächen.
- source_word: ἄμωμος / ἀναμάρτητος
  choice: ein Makelloser / der Sündlose
  rationale: Die unterschiedliche griechische Wortwahl wird im Deutschen sichtbar gehalten.
theological_decisions:
- issue: Schutzwirkung der Gottesfurcht in Vers 4
  choice: Die Gottesfurcht selbst wird als beschirmende Wirklichkeit formuliert.
  alternative: Die Stelle lediglich psychologisch als vorsichtiges oder moralisches Verhalten erklären.
  rationale: Der griechische Text sagt ausdrücklich, dass der Betreffende „durch die Furcht Gottes beschirmt“ wird. Diese theologische Ausdrucksweise wird nicht aufgelöst.
- issue: Fürbitte und Anrechnung der Sünde in Vers 6
  choice: Josef bittet den Vater um Gebet, damit der Herr den Brüdern ihre Sünde nicht anrechnet.
  alternative: Josef vergibt unmittelbar, ohne Bezug auf Gottes Anrechnung.
  rationale: Die überlieferte griechische Formulierung verbindet Josefs Barmherzigkeit ausdrücklich mit Fürbitte und göttlicher Nichtanrechnung.
- issue: Christologisch klingende Prophezeiung in Vers 8
  choice: Die Aussagen über das Lamm Gottes, den Retter der Welt und den Tod des Sündlosen werden übersetzt, aber die im Editionstext eingeklammerten Teile sichtbar gekennzeichnet.
  alternative: Die eingeklammerten Aussagen aus dem Haupttext vollständig auslassen oder ohne Kennzeichnung als einheitlichen ursprünglichen Text drucken.
  rationale: Die Quelle enthält diese Aussagen, kennzeichnet Teile davon jedoch als textgeschichtlich verdächtig. Übersetzung und Kennzeichnung bewahren sowohl den Inhalt als auch die Unsicherheit.
- issue: Singular und Plural bei den Mächten Beliars
  choice: Vers 3 spricht mit dem Text von „Geistern“, Vers 4 vom „Geist Beliars“.
  alternative: Beide Stellen zu Singular oder Plural harmonisieren.
  rationale: Die wechselnde Zahl im griechischen Text wird nicht systematisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher paränetischer Sprache. Biblisch geprägte Schlüsselbegriffe wie „Herr“, „Gebote“, „Nächster“, „Gottesfurcht“ und „Blut des Bundes“ bleiben erhalten. Ungewöhnliche Bilder und theologische Spannungen werden nicht konfessionell erklärt oder geglättet; textkritische Unsicherheiten werden durch Haupttextkennzeichnung und Fußnoten transparent gemacht.
