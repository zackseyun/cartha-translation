  text: For the good man does not have a dark eye, for he has mercy on all, even if they are sinners.
translation:
  language: de
  text: Denn ein guter Mensch hat keinen finsteren Blick; er hat mit allen Erbarmen, selbst wenn sie Sünder sind.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ἀγαθὸς ἄνθρωπος
  choice: ein guter Mensch
  rationale: Gibt die allgemeine, charakterbezogene Aussage im modernen Deutschen natürlich und ohne unnötige geschlechtliche Verengung wieder.
- source_word: σκοτεινὸν ὀφθαλμόν
  choice: finsteren Blick
  rationale: Bewahrt das Bild des dunklen beziehungsweise finsteren Auges, formuliert es aber als verständliche deutsche Wendung für eine missgünstige oder unbarmherzige Haltung.
- source_word: ἐλεεῖ
  choice: hat … Erbarmen
  rationale: Entspricht dem Verb für Erbarmen und wahrt den ethisch-theologischen Gehalt.
- source_word: πάντας
  choice: mit allen
  rationale: Bewahrt den uneingeschränkten Umfang der Aussage.
- source_word: κἂν ἁμαρτωλοὶ ὦσιν
  choice: selbst wenn sie Sünder sind
  rationale: Gibt die konzessive Konstruktion und die ausdrückliche Bezeichnung als Sünder direkt wieder.
theological_decisions:
- issue: Umfang des Erbarmens
  choice: mit allen … selbst wenn sie Sünder sind
  alternative: mit allen Sündern
  rationale: 'Die gewählte Form bewahrt die Spannung des griechischen Textes: Das Erbarmen gilt allen, wobei selbst ihr Sündersein keine Ausnahme begründet.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Finsterer Blick“ erhält die Bildsprache, klingt zugleich natürlicher als das wörtliche „finsteres Auge“.
