revisions:
- from: Wenn jemand Ansehen gewinnt, beneidet er ihn nicht; wenn jemand reich wird, ist er nicht eifersüchtig auf ihn; wenn jemand mutig ist, lobt er ihn. Den Besonnenen liebt er; mit dem Armen hat er Erbarmen; mit dem Schwachen leidet er mit; Gott fürchtet er.
  to: Wenn jemand geehrt wird, beneidet er ihn nicht; wenn jemand reich ist, missgönnt er es ihm nicht; wenn jemand mutig ist, lobt er ihn. Den Besonnenen liebt er; mit dem Armen hat er Erbarmen; mit dem Schwachen leidet er mit; Gott fürchtet er.
  rationale: Die Revision korrigiert die präsentische Aussage von πλουτεῖ und gibt das Passiv δοξάζηται unmittelbarer wieder. Sie bewahrt die knappe, parallele Satzstruktur, die generischen Singularformen und die unverkürzte Aussage der Gottesfurcht. Da keine Fußnoten im Entwurf vorhanden sind und keine strukturellen Fehler gemeldet wurden, sind keine Fußnoten anzulegen.
