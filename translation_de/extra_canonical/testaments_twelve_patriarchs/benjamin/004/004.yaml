base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/004.yaml
  text: If anyone is glorified, he does not envy him; if anyone becomes rich, he is not jealous; if anyone is brave, he praises him; he loves the self-controlled man; he has mercy on the poor; he suffers together with the weak; he fears God.
translation:
  language: de
  text: Wenn jemand geehrt wird, beneidet er ihn nicht; wenn jemand reich ist, missgönnt er es ihm nicht; wenn jemand mutig ist, lobt er ihn. Den Besonnenen liebt er; mit dem Armen hat er Erbarmen; mit dem Schwachen leidet er mit; Gott fürchtet er.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζηται
  choice: Ansehen gewinnt
  rationale: Das Passiv kann hier bedeuten, dass jemand geehrt oder angesehen wird. Die Formulierung gibt den sozialen Sinn natürlich wieder, ohne eine Verherrlichung im engeren theologischen Sinn einzutragen.
- source_word: φθονεῖ
  choice: beneidet
  rationale: Gibt den direkten Sinn des Verbs präzise und idiomatisch wieder.
- source_word: ζηλοῖ
  choice: ist ... eifersüchtig auf
  rationale: Bewahrt gegenüber φθονεῖ eine leichte lexikalische Unterscheidung; im Zusammenhang bezeichnet das Verb missgünstige Eifersucht auf den Reichtum eines anderen.
- source_word: ἀνδρεῖος
  choice: mutig
  rationale: Bezeichnet Tapferkeit oder Mut und muss nicht geschlechtsspezifisch mit „mannhaft“ wiedergegeben werden.
- source_word: σώφρονα
  choice: Besonnenen
  rationale: σώφρων umfasst Besonnenheit, Selbstbeherrschung und vernünftige Mäßigung. „Besonnen“ ist hier natürlich und hält das Bedeutungsspektrum offen.
- source_word: πένητα
  choice: Armen
  rationale: Bezeichnet einen mittellosen oder bedürftigen Menschen; „der Arme“ ist die klare kontextuelle Entsprechung.
- source_word: ἀσθενοῦντι
  choice: Schwachen
  rationale: Das Partizip kann körperliche Schwäche oder Krankheit bezeichnen. Ohne weiteren Kontext wahrt „der Schwache“ die allgemeinere Bedeutung.
- source_word: συμπάσχει
  choice: leidet ... mit
  rationale: Bildet die Bedeutung „gemeinsam mit jemandem leiden“ unmittelbar ab.
- source_word: τὸν Θεὸν φοβεῖται
  choice: Gott fürchtet er
  rationale: Entspricht dem klaren griechischen Wortlaut und vermeidet die sachlich falsche Variante „Gott preisen“.
theological_decisions:
- issue: Bedeutung von Gottesfurcht
  choice: Gott fürchtet er
  alternative: Er hat Ehrfurcht vor Gott
  rationale: Die direkte Wiedergabe bewahrt die theologische Spannung von φοβεῖται zwischen Furcht und ehrfürchtiger Haltung, statt sie einseitig auf Ehrfurcht zu begrenzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Satzstruktur des griechischen Textes bleibt erkennbar; das abschließende Voranstellen der Objekte („Den Besonnenen“, „Gott“) spiegelt die pointierte Struktur, ohne unnatürlich zu wirken.
