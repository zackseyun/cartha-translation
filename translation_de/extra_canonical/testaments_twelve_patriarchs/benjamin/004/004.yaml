review_pass:
  verdict: revise
  source_fidelity: 'Eine sichere Korrektur ist bei πλουτεῖ erforderlich: Das Präsens bezeichnet, dass jemand reich ist bzw. Wohlstand hat, nicht ausdrücklich den Erwerb von Reichtum. δοξάζηται ist als Passiv genauer mit „geehrt wird“ wiederzugeben als mit „Ansehen gewinnt“. Die übrigen Aussagen geben die griechische Reihenfolge und Bedeutung zutreffend wieder, insbesondere συμπάσχει und Θεὸν φοβεῖται.'
  naturalness: Der Text ist insgesamt würdevoll und gut verständlich. „nicht eifersüchtig auf ihn“ ist jedoch im heutigen Deutsch häufiger romantisch konnotiert; „beneidet ihn nicht“ ist hier idiomatischer. Die parallele Wiederholung von „beneidet“ bildet die zwei griechischen Verben nicht lexikalisch ab, ist aber im Deutschen natürlich; „missgönnt es ihm nicht“ hält bei ζηλοῖ eine Nuance der missgünstigen Reaktion auf Wohlstand fest.
  terminology: „Besonnenen“, „Armen“, „Schwachen“ und „Gott fürchtet er“ sind angemessene, quellennah offene Wiedergaben. „Gott fürchtet er“ soll nicht zu einer bloßen Ehrfurchtsformel abgeschwächt werden.
  issues:
  - severity: medium
    issue: πλουτεῖ wurde mit „reich wird“ übersetzt.
    rationale: πλουτεῖ steht im Präsens und besagt primär „reich ist/wohlhabend ist“. Die inchoative deutsche Formulierung fügt einen Bedeutungsaspekt hinzu.
  - severity: low
    issue: δοξάζηται wurde mit „Ansehen gewinnt“ übersetzt.
    rationale: Das passive δοξάζηται bezeichnet genauer, dass jemand geehrt oder gerühmt wird. „Ansehen gewinnt“ verlagert die Aussage auf sozialen Statuserwerb.
  - severity: low
    issue: „eifersüchtig auf ihn“ kann im modernen Deutsch missverständlich sein.
    rationale: Bei Wohlstand ist „missgönnt es ihm nicht“ idiomatisch und gibt ζηλοῖ als missgünstige Reaktion wieder, ohne eine romantische Lesart nahezulegen.
  revised_text: Wenn jemand geehrt wird, beneidet er ihn nicht; wenn jemand reich ist, missgönnt er es ihm nicht; wenn jemand mutig ist, lobt er ihn. Den Besonnenen liebt er; mit dem Armen hat er Erbarmen; mit dem Schwachen leidet er mit; Gott fürchtet er.
