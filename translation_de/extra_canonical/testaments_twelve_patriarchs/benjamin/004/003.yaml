base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/003.yaml
  text: And even if they do not intend good toward him, by doing good he overcomes evil, being sheltered by God. He loves those who wrong him as his own soul.
translation:
  language: de
  text: Und selbst wenn sie ihm gegenüber nichts Gutes beabsichtigen, überwindet er das Böse, indem er Gutes tut; dabei wird er von Gott beschützt. Diejenigen, die ihm Unrecht tun, liebt er wie sein eigenes Leben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κἂν μὴ βούλωνται περὶ αὐτοῦ εἰς καλά
  choice: Und selbst wenn sie ihm gegenüber nichts Gutes beabsichtigen
  rationale: Gibt die konzessive Bedingung und die auf ihn gerichtete Haltung idiomatisch wieder; εἰς καλά wird substantivisch als „Gutes“ verstanden.
- source_word: τὸ ἀγαθὸν ποιῶν νικᾷ τὸ κακόν
  choice: überwindet er das Böse, indem er Gutes tut
  rationale: Bewahrt den Gegensatz zwischen dem Guten und dem Bösen sowie den modalen Sinn des Partizips ποιῶν.
- source_word: σκεπόμενος ὑπὸ τοῦ Θεοῦ
  choice: denn Gott beschützt ihn
  rationale: Das mediale/passive Partizip bezeichnet Gottes schützendes Handeln; die kausale Wiedergabe passt zum Zusammenhang und ist im Deutschen natürlicher.
- source_word: τοὺς ἀδικοῦντας
  choice: Diejenigen, die ihm Unrecht tun
  rationale: Gibt das substantivierte Partizip gegenwartsnah und ohne unnötige Festlegung auf eine bestimmte Art des Unrechts wieder.
- source_word: ὡς τὴν ψυχὴν αὐτοῦ
  choice: wie sein eigenes Leben
  rationale: ψυχή kann hier die eigene Person beziehungsweise das eigene Leben bezeichnen; „Leben“ ist in diesem Vergleich natürlich und verständlich.
theological_decisions:
- issue: Verhältnis von Gutestun, Überwindung des Bösen und Gottes Schutz
  choice: Das Gutestun wird als Weise der Überwindung dargestellt, Gottes Schutz als begleitender Grund.
  alternative: „Als einer, der von Gott beschützt wird“ ohne ausdrücklich kausale Verknüpfung.
  rationale: Die Partizipien lassen das genaue logische Verhältnis offen. Die Fassung wahrt sowohl menschliches Gutestun als auch Gottes Schutz, ohne daraus eine Verdienstlehre oder eine Garantie leidensfreier Bewahrung abzuleiten.
- issue: Bedeutung von ψυχή im Liebesgebot
  choice: „sein eigenes Leben“
  alternative: „seine eigene Seele“ oder „sich selbst“
  rationale: „Seele“ könnte im modernen Deutschen eine engere anthropologische Aussage nahelegen, während der griechische Ausdruck die eigene Person beziehungsweise das eigene Leben umfassen kann.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satzbau bleibt nah am griechischen Gedankengang, wird aber für flüssiges Deutsch leicht gegliedert. Keine konfessionelle Zusatzdeutung.
