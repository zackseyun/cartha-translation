  text: See then, my children, the end of the good man. Imitate [in goodness] because of his compassion, so that you also may wear crowns of glory.
translation:
  language: de
  text: 4,1 Seht also, meine Kinder, das Ende des guten Mannes. Ahmt ihn [im Guten] wegen seines Mitgefühls nach, damit auch ihr Kronen der Herrlichkeit tragt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „im Guten“ stehen in der zugrunde gelegten griechischen Ausgabe in eckigen Klammern und sind textkritisch unsicher.
    reason: Bewahrt und erläutert die im Quelltext markierte textkritische Unsicherheit, ohne eine unnötige stilistische Modalparaphrase hinzuzufügen.
lexical_decisions:
- source_word: Ἴδετε
  choice: Seht … auf
  rationale: Gibt den Aufforderungscharakter wieder und verbindet sich im Deutschen natürlich mit dem betrachteten Gegenstand.
- source_word: τοῦ ἀγαθοῦ ἀνδρὸς
  choice: des guten Menschen
  rationale: ἀνήρ kann hier allgemein einen Mann bzw. Menschen bezeichnen; „Mensch“ formuliert den vorbildhaften Charakter natürlich, ohne den Sinn einzuengen.
- source_word: τὸ τέλος
  choice: das Ende
  rationale: Bewahrt die unmittelbare Bedeutung von τέλος und lässt offen, ob der Lebensausgang, das Lebensziel oder beides mitschwingt.
- source_word: μιμήσασθε
  choice: Ahmt ihn … nach
  rationale: Der im Kontext naheliegende Bezug auf den guten Menschen wird im Deutschen als notwendiges Objekt ausdrücklich gemacht.
- source_word: ἐν ἀγαθῇ
  choice: '[im Guten]'
  rationale: Die editorisch gekennzeichnete, textkritisch unsichere Wendung wird eng am Griechischen und ebenfalls in eckigen Klammern wiedergegeben.
- source_word: διὰ τὴν εὐσπλαγχνίαν αὐτοῦ
  choice: wegen seines Mitgefühls
  rationale: εὐσπλαγχνία bezeichnet herzliches Erbarmen bzw. Mitgefühl; „wegen“ entspricht der kausalen Lesart von διά mit Akkusativ.
- source_word: στεφάνους δόξης φορέσητε
  choice: Kronen der Herrlichkeit tragt
  rationale: Bewahrt das Bild des Tragens von Ehrenkränzen beziehungsweise Kronen und die Genitivverbindung.
theological_decisions:
- issue: Bedeutung von τέλος
  choice: Ende
  alternative: Ausgang / Ziel
  rationale: „Ende“ bewahrt die Mehrdeutigkeit des griechischen Ausdrucks und vermeidet eine vorschnelle Deutung auf Schicksal, Lebensresultat oder Ziel.
- issue: Textkritischer Status von ἐν ἀγαθῇ
  choice: '[im Guten] im Haupttext'
  alternative: Auslassung oder ungekennzeichnete Aufnahme
  rationale: Die Klammern der vorgelegten griechischen Quelle werden sichtbar bewahrt, sodass die textliche Unsicherheit nicht verschleiert wird.
- issue: Bezug von αὐτοῦ
  choice: „seines“ bezieht sich auf den guten Menschen
  alternative: Bezug auf eine andere vorausgesetzte Person
  rationale: Der gute Mensch ist der nächstliegende grammatische und kontextuelle Bezug; die Formulierung führt keine zusätzliche theologische Identifikation ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter väterlicher Anrede. Die Bildsprache von Ende, Nachahmung und Kronen der Herrlichkeit bleibt erhalten; textkritische Unsicherheit wird sichtbar markiert.
