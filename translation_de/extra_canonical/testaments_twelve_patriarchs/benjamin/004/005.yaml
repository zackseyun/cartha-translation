source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ τὸν ἔχοντα χάριν *ἀγαθοῦ πνεύματος³³ ἀγαπᾷ κατὰ τὴν ψυχὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004/005.yaml
  text: And he loves the one who has the grace of a good spirit as his own soul.
translation:
  language: de
  text: Und wer die Gnade eines guten Geistes besitzt, den liebt er wie seine eigene Seele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν ἔχοντα χάριν
  choice: wer die Gnade … besitzt
  rationale: Gibt die substantivierte Partizipialkonstruktion natürlich wieder und bewahrt χάρις als „Gnade“.
- source_word: ἀγαθοῦ πνεύματος
  choice: eines guten Geistes
  rationale: Entspricht dem griechischen Genitiv und lässt offen, ob Herkunft, Art oder Zugehörigkeit der Gnade gemeint ist.
- source_word: ἀγαπᾷ
  choice: liebt er
  rationale: Direkte und idiomatische Wiedergabe des Verbs ἀγαπάω.
- source_word: κατὰ τὴν ψυχὴν αὐτοῦ
  choice: wie seine eigene Seele
  rationale: Gibt den Vergleichssinn der Wendung im Kontext verständlich wieder; „eigene“ verdeutlicht die Rückbezüglichkeit von αὐτοῦ.
theological_decisions:
- issue: Bedeutung von „guter Geist“
  choice: eines guten Geistes
  alternative: des guten Geistes / eines guten Wesens
  rationale: Der unbestimmte griechische Ausdruck wird nicht vorschnell mit dem Heiligen Geist identifiziert und auch nicht anthropologisch umgedeutet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die griechische Satzstruktur; die mögliche Mehrdeutigkeit des Genitivs bleibt erhalten.
