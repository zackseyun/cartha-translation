base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005.yaml
  text: '1[a]. If, then, you also have a good mind, even wicked people will be at peace with you, and the lawless[b], being put to shame before you, will turn back to what is good; and those who are greedy will not only withdraw from their passion, but will also give to those in distress the things of greed that they had possessed.


    2. If you are doing good, even the unclean spirits will flee from you, and the wild beasts will fear you.


    3. For where there is the fear of good works and light in the mind, darkness flees away from it.


    4. For if anyone does violence to a holy man, he changes his mind; for the holy one has mercy on those who revile him and keeps silent.


    5. And if anyone betrays a righteous soul and insults a righteous soul, the righteous man prays; and even if for a little while he is brought low, before long he appears far more radiant[e][d][c], as Joseph my brother also became.'
translation:
  language: de
  text: '**Testament Benjamins 5**


    **1.** Wenn also auch ihr eine gute Gesinnung habt, werden selbst böse Menschen mit euch in Frieden leben. Die Zügellosen[a] werden sich vor euch schämen und zum Guten umkehren. Die Habgierigen werden nicht nur von ihrer Leidenschaft ablassen, sondern den Bedrängten auch das geben, was sie aus Habgier besaßen.[b]


    **2.** Wenn ihr Gutes tut, werden sogar die unreinen Geister vor euch fliehen, und die wilden Tiere werden euch fürchten.


    **3.** Denn wo Furcht vor guten Werken[c] und Licht im Denken ist, flieht die Finsternis von dort.


    **4.** Wenn nämlich jemand einen heiligen Mann beleidigt, ändert er seine Haltung.[d] Denn der Heilige erbarmt sich derer, die ihn beschimpfen, und schweigt.


    **5.** Und selbst wenn jemand einen Gerechten verrät, betet der Gerechte. Auch wenn er für kurze Zeit erniedrigt wird, erscheint er bald darauf umso strahlender, wie es auch meinem Bruder Josef erging.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch „die Ausschweifenden“, „die Rücksichtslosen“ oder „die Verschwenderischen“ bedeuten.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich etwa: „die Dinge der Habgier, die sie besaßen“. Gemeint sein kann der aus Habgier erworbene Gewinn oder Besitz, an dem sie habgierig festhielten.'
    reason: lexical_alternative
  - marker: c
    text: Die Wendung „Furcht vor guten Werken“ ist schwierig. Sie kann auch Ehrfurcht im Zusammenhang mit guten Taten oder Furcht bezeichnen, die ein gutes Leben bei anderen hervorruft.
    reason: alternative_reading
  - marker: d
    text: Das griechische μετανοεῖ kann auch mit „er bereut es“, „er kehrt um“ oder „er ändert seinen Sinn“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: e
    text: 'Josefs Geschichte dient als Beispiel: Eine Zeit lang wurde er erniedrigt, danach aber sichtbar erhöht und bestätigt. Siehe 1. Mose 37; 39–45.'
    reason: cross_reference
lexical_decisions:
- source_word: διάνοιαν
  choice: Gesinnung (V. 1); Denken (V. 3)
  rationale: In V. 1 bezeichnet das Wort die innere moralische Ausrichtung, wofür „Gesinnung“ im Deutschen natürlich ist. In V. 3 steht die Vorstellung von Licht im Inneren im Vordergrund; „Denken“ bewahrt dort den kognitiven Akzent.
- source_word: εἰρηνεύσουσιν μεθʼ ὑμῶν
  choice: werden mit euch in Frieden leben
  rationale: Die Formulierung gibt die durch μετά bezeichnete friedliche Beziehung idiomatisch wieder, ohne sie auf einen förmlichen Friedensschluss zu verengen.
- source_word: ἄσωτοι
  choice: die Zügellosen
  rationale: Das Wort kann verschwenderische, ausschweifende oder rücksichtslose Menschen bezeichnen. „Zügellose“ wahrt den Gedanken moralischer Unbeherrschtheit, ohne den Begriff fälschlich auf Gesetzlosigkeit oder Geldverschwendung festzulegen.
- source_word: αἰδεσθέντες ὑμᾶς
  choice: werden sich vor euch schämen
  rationale: Die Wiedergabe bewahrt sowohl die innere Beschämung als auch ihren sozialen Bezug auf die Angeredeten.
- source_word: ἐπιστρέψουσιν εἰς τὸ ἀγαθόν
  choice: werden zum Guten umkehren
  rationale: „Umkehren“ gibt die Richtungsänderung von ἐπιστρέφω wieder; „zum Guten“ wahrt das substantivierte τὸ ἀγαθόν.
- source_word: πλεονεκτοῦντες
  choice: die Habgierigen
  rationale: Der Ausdruck bezeichnet Menschen, die von raffender Gewinnsucht geprägt sind. „Habgierige“ ist verständlich und lässt offen, ob sich die Gier auch in konkreter Ausbeutung äußerte.
- source_word: τοῦ πάθους
  choice: von ihrer Leidenschaft
  rationale: πάθος bezeichnet hier den inneren Antrieb der Habgier. „Leidenschaft“ bewahrt die moralpsychologische Weite des Ausdrucks.
- source_word: τὰ τῆς πλεονεξίας ἃ εἶχον
  choice: das, was sie aus Habgier besaßen
  rationale: Die knappe griechische Wendung wird verständlich wiedergegeben, ohne abschließend festzulegen, ob das Gut durch Habgier erworben wurde oder als habgierig festgehaltener Besitz gilt.
- source_word: θλιβομένοις
  choice: den Bedrängten
  rationale: Der Ausdruck umfasst Menschen unter Druck, in Not oder Bedrängnis, ohne die Ursache ihrer Not unnötig einzuengen.
- source_word: ἀκάθαρτα πνεύματα
  choice: die unreinen Geister
  rationale: Dies ist die etablierte und sachlich genaue Wiedergabe für geistige Wesen, die als unrein bezeichnet werden.
- source_word: φόβος ἀγαθῶν ἔργων
  choice: Furcht vor guten Werken
  rationale: Die schwierige Genitivverbindung wird bewusst eng am Wortlaut wiedergegeben. Eine Fußnote hält alternative Bezüge offen.
- source_word: ὑβρίσει
  choice: misshandelt
  rationale: Das Verb kann Beschimpfung, frevelhafte Kränkung oder gewaltsame Misshandlung bezeichnen. „Misshandelt“ wahrt die mögliche Schwere des übergriffigen Verhaltens, ohne körperliche Gewalt ausdrücklich zu behaupten.
- source_word: μετανοεῖ
  choice: ändert er seine Haltung
  rationale: Im unmittelbaren Zusammenhang bezeichnet das Verb die innere Umkehr desjenigen, der dem schweigenden und barmherzigen Heiligen Unrecht tut. Die Wiedergabe hält den kognitiven und ethischen Aspekt zusammen.
- source_word: φαιδρότερος
  choice: umso strahlender
  rationale: Der Komparativ beschreibt nach vorübergehender Erniedrigung ein sichtbar helleres, erfreulicheres oder herrlicheres Erscheinen; „umso strahlender“ passt zum Bild und zu Josefs Rechtfertigung.
theological_decisions:
- issue: Bedeutung von μετανοεῖ in Vers 4
  choice: ändert er seine Haltung
  alternative: bereut es; kehrt um; ändert seinen Sinn
  rationale: Der Text beschreibt eine Änderung der inneren Einstellung des Beleidigers angesichts der barmherzigen Zurückhaltung des Heiligen. Die Übersetzung legt den Ausdruck nicht ausschließlich als technisch-religiösen Bußbegriff fest.
- issue: Deutung von φόβος ἀγαθῶν ἔργων in Vers 3
  choice: Furcht vor guten Werken
  alternative: Ehrfurcht, die mit guten Werken verbunden ist; Furcht, die durch gute Werke hervorgerufen wird
  rationale: Die griechische Konstruktion ist ungewöhnlich und mehrdeutig. Der Haupttext bewahrt diese Spannung, statt eine bestimmte theologische oder syntaktische Deutung einzusetzen.
- issue: Wirkung des guten Lebens auf Böse, Geister und Tiere
  choice: als Aussage des Textes ohne abschwächenden Zusatz wiedergegeben
  alternative: als bloße Möglichkeit oder sprichwörtliche Übertreibung paraphrasieren
  rationale: Die Futurformen formulieren die Folgen bestimmt. Eine erklärende Abschwächung würde dem Ausgangstext eine nicht ausgesprochene Deutung hinzufügen.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit kurzen, klaren Sätzen. Traditionell verständliche Begriffe wie „der Gerechte“, „der Heilige“ und „unreine Geister“ bleiben erhalten. Ungewöhnliche oder mehrdeutige griechische Wendungen werden im Haupttext nicht konfessionell geglättet, sondern durch knappe Fußnoten erläutert. Vers 5 folgt dem vorgelegten griechischen Text und fügt die im englischen Konsultationstext erscheinende, dort aber nicht belegte Wendung über das Beschimpfen einer gerechten Seele nicht ein.
