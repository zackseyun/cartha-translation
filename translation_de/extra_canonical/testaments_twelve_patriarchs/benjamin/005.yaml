  naturalness: Klares, modernes und würdiges Deutsch. Die kurzen Sätze in V. 1 lesen sich natürlich. „Beleidigt“ ist in V. 4 idiomatischer und registergerecht.
  terminology: „Gesinnung“, „Zügellosen“, „Habgierigen“, „unreinen Geister“, „der Heilige“ und „der Gerechte“ sind treffend. Die Fußnoten bewahren die lexikalischen und syntaktischen Spielräume, ohne sie dogmatisch aufzulösen.
