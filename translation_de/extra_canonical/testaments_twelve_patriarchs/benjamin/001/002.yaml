base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001/002.yaml
  text: 'And after kissing them, he said: “Just as Isaac was born to Abraham in his old age, so I also was born to Jacob.”'
translation:
  language: de
  text: 'Nachdem er sie geküsst hatte, sagte er: »Wie Abraham in seinem hohen Alter Isaak geboren wurde, so wurde auch ich Jakob geboren.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καταφιλήσας
  choice: Nachdem er sie geküsst hatte
  rationale: Das Partizip bezeichnet eine vorzeitige Handlung; die deutsche Nebensatzkonstruktion gibt die zeitliche Abfolge natürlich wieder. Das einfache »geküsst« wahrt den liebevollen Sinn, ohne ihn unnötig auszuschmücken.
- source_word: ἐτέχθη
  choice: geboren wurde
  rationale: Die passive Form des griechischen Verbs wird beibehalten.
- source_word: ἐν γήρει αὐτοῦ
  choice: in dessen hohem Alter
  rationale: »Hohes Alter« gibt γῆρας idiomatisch wieder; »dessen« macht eindeutig, dass sich das Pronomen auf Abraham bezieht.
- source_word: οὕτως κἀγὼ
  choice: so wurde auch ich
  rationale: Die enge Entsprechung der Vergleichskonstruktion sowie die Hervorhebung von »auch ich« bleiben erhalten.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die ungewöhnliche, aber verständliche Wendung »jemandem geboren werden« bewahrt die griechische Dativkonstruktion und die Parallelität zwischen Abraham/Isaak und Jakob/Benjamin.
