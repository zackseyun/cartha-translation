translation:
  language: de
  text: 'Das Testament Benjamins, des zwölften Sohnes Jakobs und Rahels


    1 Abschrift der Worte Benjamins, die er für seine Söhne festlegte, nachdem er hundertfünfundzwanzig Jahre gelebt hatte.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: Testament
  rationale: Bezeichnet hier die testamentarische Abschiedsrede und entspricht zugleich dem überlieferten Werktitel.
- source_word: Ἀντίγραφον λόγων
  choice: Abschrift der Worte
  rationale: Gibt den urkundlichen Charakter von ἀντίγραφον und den Plural λόγων direkt wieder.
- source_word: διέθετο
  choice: als Vermächtnis niederlegte
  rationale: Bewahrt den testamentarischen Sinn von διατίθημι im Medium und klingt im modernen Deutschen natürlicher als eine rein wörtliche Wiedergabe wie „anordnete“.
- source_word: ζήσας
  choice: nachdem er … gelebt hatte
  rationale: Gibt das vorzeitige aoristische Partizip in seinem zeitlichen Verhältnis zum Niederlegen der Worte wieder.
theological_decisions:
- issue: Charakter der Worte Benjamins
  choice: als Vermächtnis niederlegte
  alternative: für seine Söhne anordnete
  rationale: Die gewählte Fassung hält den Zusammenhang mit dem Titel „Testament“ fest, ohne den Inhalt auf rechtsverbindliche Gebote zu verengen.
translation_notes:
  register: Moderner, würdevoller deutscher Titel- und Erzählstil. „Rahel“ folgt der geläufigen deutschen Namensform; Zahlwort ausgeschrieben. Die Überschrift wird vom nummerierten Vers abgesetzt.
