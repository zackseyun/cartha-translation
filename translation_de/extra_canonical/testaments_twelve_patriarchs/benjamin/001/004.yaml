source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ἡ γὰρ²⁰ Ῥαχὴλ μετὰ τὸ τεκεῖν²¹ τὸν Ἰωσὴφ δώδεκα ἔτη ἐστείρευσεν· καὶ προσηύξατο *πρὸς Κύριον²² μετὰ νηστείας²³, καὶ συλλαβοῦσα τέτοκέ²⁴ με.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001/004.yaml
  text: For Rachel was barren for twelve years after she had borne Joseph; and she prayed to the Lord with fasting, and having conceived, she bore me.
translation:
  language: de
  text: Denn nachdem Rahel Josef geboren hatte, blieb sie zwölf Jahre lang unfruchtbar. Dann betete sie unter Fasten zum Herrn, und nachdem sie schwanger geworden war, gebar sie mich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐστείρευσεν
  choice: blieb sie … unfruchtbar
  rationale: Das Verb bezeichnet hier den Zustand der Unfruchtbarkeit über einen Zeitraum von zwölf Jahren; die idiomatische deutsche Wiedergabe bewahrt diesen zeitlichen Verlauf.
- source_word: μετὰ νηστείας
  choice: unter Fasten
  rationale: Die Präpositionalfügung beschreibt das Fasten als Begleitumstand des Gebets. Sie ist syntaktisch an προσηύξατο angeschlossen, nicht an συλλαβοῦσα.
- source_word: συλλαβοῦσα
  choice: nachdem sie schwanger geworden war
  rationale: Das Partizip von συλλαμβάνω bedeutet im geburtlichen Zusammenhang „empfangen/schwanger werden“ und markiert einen der Geburt vorausgehenden Umstand.
- source_word: τέτοκέ με
  choice: gebar sie mich
  rationale: Das Perfekt wird im erzählenden Zusammenhang natürlich mit deutschem Präteritum wiedergegeben; das Ich-Objekt bleibt ausdrücklich erhalten.
theological_decisions:
- issue: Bezug des Fastens
  choice: Das Fasten begleitet Rahels Gebet.
  alternative: Rahel wurde während des Fastens schwanger.
  rationale: Im griechischen Satz steht μετὰ νηστείας unmittelbar bei καὶ προσηύξατο πρὸς Κύριον; die folgende Partizipialfügung καὶ συλλαβοῦσα bildet einen neuen, anschließenden Handlungsschritt. Eine Zuordnung des Fastens zur Empfängnis wäre grammatisch weniger naheliegend.
- issue: Gottesbezeichnung Κύριον
  choice: zum Herrn
  alternative: zum HERRN
  rationale: Der griechische Text bietet Κύριον ohne explizite Wiedergabe des Gottesnamens; „Herr“ bewahrt diese Form und vermeidet eine nicht im Wortlaut markierte Präzisierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer zeitlicher Abfolge. „Rahel“ und „Josef“ folgen den geläufigen deutschen Namensformen. Der Satz wurde zur besseren Lesbarkeit in zwei Sätze gegliedert, ohne den Gedankengang zu verändern.
