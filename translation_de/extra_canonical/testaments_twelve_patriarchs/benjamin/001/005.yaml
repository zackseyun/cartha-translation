  text: For my father loved Rachel exceedingly, and he prayed to see two sons from her.
translation:
  language: de
  text: Denn mein Vater liebte Rahel überaus und betete darum, zwei Söhne von ihr zu sehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Σφόδρα
  choice: überaus
  rationale: Gibt die starke Intensivierung natürlich und in würdigem modernem Deutsch wieder.
- source_word: ἠγάπα
  choice: liebte
  rationale: Entspricht dem imperfektischen Verb und beschreibt die fortdauernde Liebe des Vaters zu Rahel.
- source_word: ηὔχετο
  choice: betete darum
  rationale: Bewahrt den religiösen Sinn von εὔχομαι und verbindet das Gebet idiomatisch mit seinem Inhalt.
- source_word: ἰδεῖν
  choice: zu sehen
  rationale: Gibt den Infinitiv formal wieder, ohne ihn deutend als bloßes 'bekommen' aufzulösen.
- source_word: ἐξ αὐτῆς
  choice: von ihr
  rationale: Bezeichnet Rahel als Mutter der erhofften Söhne in natürlichem Deutsch.
theological_decisions:
- issue: Bedeutung von ηὔχετο
  choice: betete darum
  alternative: wünschte sich
  rationale: Der mögliche Gebetsbezug wird erhalten; eine Abschwächung zu einem rein inneren Wunsch würde die religiöse Dimension des griechischen Verbs möglicherweise verlieren.
translation_notes:
  register: Natürliches, würdevolles Standarddeutsch. Die Formulierung „zwei Söhne von ihr zu sehen“ wahrt die Ausdrucksweise und leichte Eigenart des griechischen Textes.
