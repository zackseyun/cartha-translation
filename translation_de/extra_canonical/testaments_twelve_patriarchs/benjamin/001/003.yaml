source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Καὶ ἐπειδὴ¹⁶ Ῥαχὴλ *ἡ μήτηρ μου¹⁷ τέθνηκε¹⁸ γεννῶσά με, *γάλα οὐκ ἔσχον· Βαλλὰν οὖν τὴν παιδίσκην αὐτῆς ἐθήλασα¹⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001/003.yaml
  text: And since Rachel, my mother, died while giving birth to me, I had no milk; so I was nursed by Bilhah, her servant-girl.
translation:
  language: de
  text: Und weil Rahel, meine Mutter, bei meiner Geburt starb, hatte ich keine Milch; deshalb wurde ich von Bilha, ihrer Sklavin, gestillt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γεννῶσά με
  choice: bei meiner Geburt
  rationale: Die Partizipialkonstruktion bezeichnet, dass Rahel starb, als sie Benjamin gebar; die idiomatische deutsche Wendung gibt den zeitlichen Zusammenhang klar wieder.
- source_word: γάλα οὐκ ἔσχον
  choice: hatte ich keine Milch
  rationale: Die auffällige Ausdrucksweise des Griechischen wird bewusst bewahrt, statt sie erklärend als fehlende Möglichkeit des Stillens aufzulösen.
- source_word: Βαλλὰν
  choice: Bilha
  rationale: Verwendet die im modernen deutschen Bibelgebrauch geläufige Namensform.
- source_word: παιδίσκην
  choice: Sklavin
  rationale: Der Begriff bezeichnet hier eine weibliche Unfreie bzw. versklavte Dienerin; „Sklavin“ gibt den sozialen Status deutlicher wieder als das verharmlosende „Magd“.
- source_word: ἐθήλασα
  choice: wurde ich … gestillt
  rationale: Das griechische Verb steht formal aktiv, bedeutet in diesem Zusammenhang jedoch, dass Benjamin von Bilha gestillt wurde; die natürliche deutsche Passivform gibt den gemeinten Vorgang eindeutig wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem kausalen und folgernden Aufbau des griechischen Textes; das Semikolon bewahrt die enge Verbindung der beiden Aussagen.
