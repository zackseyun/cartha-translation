source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: VIII. *Ὑμεῖς δέ¹, *τέκνα μου², ἀπόδρατε³ τὴν κακίαν, Γ*τὸν φθόνον⁴ καὶ τὴν⁵ μισαδελφίαν⁶, καὶ προσκολλᾶσθε⁶ τῇ ἀγαθότητι Γκαὶ τῇ ἀγάπῃ⁷⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/008/001.yaml
  text: But you, my children, flee evil — envy and hatred of brothers — and cling to goodness and love.
translation:
  language: de
  text: Ihr aber, meine Kinder, flieht das Böse, den Neid und den Bruderhass und haltet an Güte und Liebe fest.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόδρατε
  choice: flieht
  rationale: Der Imperativ bezeichnet ein entschiedenes Sich-Entfernen; „flieht“ gibt Bild und Nachdruck knapp wieder.
- source_word: τὴν κακίαν
  choice: die Bosheit
  rationale: Der Singular wird bewahrt und durch die folgenden Begriffe näher entfaltet.
- source_word: τὸν φθόνον
  choice: den Neid
  rationale: Direkte und idiomatische Entsprechung für missgünstigen Neid.
- source_word: τὴν μισαδελφίαν
  choice: den Hass auf eure Geschwister
  rationale: Gibt das Kompositum aus „hassen“ und „Bruder/Geschwister“ natürlich und geschlechterübergreifend wieder, ohne den zwischenmenschlichen Bezug abzuschwächen.
- source_word: προσκολλᾶσθε
  choice: haltet ... fest
  rationale: Vermittelt dauerhaftes, enges Sich-Anschließen in natürlichem modernem Deutsch.
- source_word: τῇ ἀγαθότητι
  choice: Güte
  rationale: Bezeichnet sittliche Güte beziehungsweise Gutheit; „Güte“ ist hier verständlich und würdevoll.
- source_word: τῇ ἀγάπῃ
  choice: Liebe
  rationale: Bewahrt den umfassenden ethischen Sinn von ἀγάπη ohne konfessionelle Zusätze.
theological_decisions:
- issue: Verhältnis von Bosheit zu Neid und Geschwisterhass
  choice: Wiedergabe mit Gedankenstrichen als erläuternde Entfaltung
  alternative: Aufzählung dreier voneinander unabhängiger Laster
  rationale: Die griechische Apposition legt nahe, dass Neid und Geschwisterhass die zuvor genannte Bosheit konkretisieren; die Zeichensetzung wahrt dies, ohne die Syntax dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede. „Geschwister“ macht den gemeinschaftlichen Bezug von μισαδελφίαν für heutige Leser deutlich; der parallele Gegensatz zwischen Fliehen und Festhalten bleibt erhalten.
