- from: Ihr aber, meine Kinder, flieht die Bosheit – den Neid und den Hass auf eure Geschwister – und haltet an Güte und Liebe fest.
  to: Ihr aber, meine Kinder, flieht das Böse, den Neid und den Bruderhass und haltet an Güte und Liebe fest.
