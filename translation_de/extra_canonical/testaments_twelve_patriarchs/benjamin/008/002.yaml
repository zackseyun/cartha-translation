source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ὁ γὰρ καθαρὸς νοῦς οὐκ ἔχει μιασμὸν ἐπὶ¹⁷ κόπρου¹⁸ καὶ¹⁹ βόρβορον²⁰, Γ*ἀλλὰ μᾶλλον²¹ ἀμφότερα ψύγει²² καὶ ἀπελαύνει τὴν δυσωδίαν⁷, οὕτω καὶ ὁ καθαρὸς²³ νοῦς ἐν τοῖς μιασμοῖς²⁴ τῆς¹⁷ γῆς συνεχόμενος μᾶλλον †οἰκοδομεῖ²⁶, αὐτὸς δὲ οὐ μιαίνεται⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/008/002.yaml
  text: For the pure mind has no defilement from dung or filth, but rather repels both and drives away the stench; thus also the pure mind, when held among the defilements of the earth, rather †builds up†, and is itself not defiled.
translation:
  language: de
  text: Denn der reine Sinn wird weder durch Kot noch durch Unrat verunreinigt, sondern kühlt vielmehr beides ab und vertreibt den Gestank. Ebenso baut auch der reine Sinn, wenn er inmitten der Verunreinigungen der Erde festgehalten wird, vielmehr auf[a] und wird selbst nicht verunreinigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung ist hier unsicher; wörtlich steht: „baut auf“. Ein Objekt wird nicht genannt.'
    reason: Das Verb οἰκοδομεῖ ist in der Edition als problematisch gekennzeichnet und ergibt im Zusammenhang nur einen unsicheren Sinn.
lexical_decisions:
- source_word: καθαρὸς νοῦς
  choice: der reine Sinn
  rationale: νοῦς bezeichnet hier die innere Denk- und Urteilsfähigkeit; „Sinn“ ist im Deutschen würdig und weiter als das rein intellektuelle „Verstand“.
- source_word: κόπρου καὶ βόρβορον
  choice: Kot noch Schlamm
  rationale: Die konkreten und abstoßenden Bilder des griechischen Textes werden bewahrt; βόρβορος meint schmutzigen Schlamm oder Unrat.
- source_word: ἀμφότερα ψύγει
  choice: lässt vielmehr beides erkalten
  rationale: ψύγει bedeutet grundsätzlich „kühlt ab/lässt erkalten“. Obwohl das Bild im Zusammenhang ungewöhnlich ist, wird es nicht stillschweigend zur konsultativen Deutung „wehrt ab“ umgedeutet.
- source_word: συνεχόμενος
  choice: inmitten … festgehalten wird
  rationale: Das Partizip kann ein Umschlossensein oder Festgehaltenwerden ausdrücken; die Formulierung erhält den passiven Druck der verunreinigenden Umgebung.
- source_word: οἰκοδομεῖ
  choice: baut … auf
  rationale: Die naheliegende Bedeutung des überlieferten Verbs wird beibehalten, obwohl der Text an dieser Stelle unsicher und das fehlende Objekt auffällig ist.
theological_decisions:
- issue: Reinheit des Sinnes in einer verunreinigenden Umwelt
  choice: Der Sinn wird als nicht verunreinigt beschrieben, obwohl er inmitten irdischer Verunreinigungen festgehalten wird.
  alternative: Eine absolute Lehre von moralischer Unfehlbarkeit oder angeborener Sündlosigkeit daraus abzuleiten.
  rationale: Die Übersetzung bleibt beim Bild und seiner Aussage im Vers, ohne eine weitergehende konfessionelle Anthropologie einzutragen.
- issue: Wirkung des reinen Sinnes
  choice: „baut … auf“ bleibt ohne ergänztes Objekt stehen.
  alternative: „baut andere auf“, „reinigt seine Umgebung“ oder „widersteht dem Bösen“.
  rationale: Der griechische Text nennt kein Objekt; eine theologische oder ethische Präzisierung würde die vorhandene Unbestimmtheit beseitigen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die konkreten Schmutzbilder und die ungewöhnliche Aussage „lässt … erkalten“ bleiben aus Quellentreue erhalten; die textkritische Unsicherheit bei „baut auf“ wird durch eine Fußnote offengelegt.
