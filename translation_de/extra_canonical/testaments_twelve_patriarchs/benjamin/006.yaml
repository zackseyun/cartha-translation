revisions:
- from: '**Das Testament Benjamins 6**


    **1** Der Entschluss eines guten Menschen ist nicht in der Gewalt des irreführenden Geistes Beliars[a]; denn der Engel des Friedens leitet seine Seele. **2** Er blickt nicht begehrlich auf vergängliche Dinge und sammelt keinen Reichtum zur Genussliebe. **3** Er findet kein Gefallen am Genuss, betrübt seinen Nächsten nicht, schwelgt nicht im Überfluss und lässt sich nicht durch das Umherschweifen der Augen irreführen. Denn der Herr ist sein Anteil.


    **4** Der gute Entschluss richtet sich weder nach Ansehen noch nach Verachtung von Menschen[b] und kennt weder Arglist noch Lüge noch Streit noch Beschimpfung. Denn der Herr wohnt in ihm und erleuchtet seine Seele, und er freut sich allezeit über alle Menschen. **5** Die gute Gesinnung hat nicht zwei Zungen – eine für Segen und eine für Fluch, eine für Kränkung und eine für Ehre, eine für Ruhe und eine für Unruhe, eine für Heuchelei und eine für Wahrheit, eine für Armut und eine für Reichtum. Vielmehr hat sie allen gegenüber nur eine einzige aufrichtige und reine Haltung. **6** Sie sieht und hört nicht auf zweierlei Weise[c]; denn bei allem, was sie tut oder sagt oder sieht, weiß sie, dass der Herr ihre Seele prüfend ansieht[d].


    **7** Und sie reinigt ihre Gedanken, damit sie weder von den Menschen noch von Gott verurteilt wird. Ebenso sind auch die Werke Beliars zwiespältig und haben keine Lauterkeit in sich.'
  to: '**Das Testament Benjamins 6**


    **1** Der Entschluss eines guten Menschen ist nicht in der Gewalt des Geistes der Verführung Beliars[a]; denn der Engel des Friedens leitet seine Seele. **2** Er blickt nicht begehrlich auf vergängliche Dinge und sammelt keinen Reichtum, um sich dem Genuss hinzugeben. **3** Er findet kein Gefallen am Genuss, betrübt seinen Nächsten nicht, schwelgt nicht im Überfluss und lässt sich nicht durch das Umherschweifen der Augen irreführen. Denn der Herr ist sein Anteil.


    **4** Der gute Entschluss nimmt weder Ruhm noch Schande von Menschen an[b] und kennt weder Arglist noch Lüge noch Streit noch Beschimpfung. Denn der Herr wohnt in ihm und erleuchtet seine Seele, und er freut sich allezeit über alle Menschen. **5** Die gute Gesinnung hat nicht zwei Zungen für Segen und Fluch, für Kränkung und Ehre, für Ruhe und Unruhe, für Heuchelei und Wahrheit, für Armut und Reichtum. Vielmehr hat sie allen gegenüber nur eine einzige aufrichtige und reine Haltung. **6** Sie hat weder doppeltes Sehen noch doppeltes Hören[c]; denn bei allem, was sie tut, sagt oder sieht, weiß sie, dass der Herr auf ihre Seele sieht[d].


    **7** Und sie reinigt ihre Gesinnung, damit sie weder von Menschen noch von Gott verurteilt wird. Ebenso sind auch die Werke Beliars zwiespältig und haben keine Lauterkeit in sich.'
  rationale: Die Revision bewahrt den vorgelegten griechischen Umfang und die textkritische Vorsicht in V. 4. Sie stellt die Bedeutung von δέχεται mit „nimmt … an“ wieder her, erhält in V. 5–6 die Bilder der zwei Zungen sowie des doppelten Sehens und Hörens und vermeidet bei ἐπισκέπτει eine nicht zwingende Festlegung auf göttliches Prüfen. Zugleich wurden einzelne Ausdrücke für modernes Standarddeutsch geglättet, ohne den ethisch-paränetischen Registerton zu verlieren.
  reviewer_model: gpt-5.6-terra
