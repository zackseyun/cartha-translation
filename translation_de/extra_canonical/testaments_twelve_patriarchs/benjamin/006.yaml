base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006.yaml
  text: The purpose of a good man is not in the hand of the spirit of Beliar’s deceit[a], for the angel of peace guides his soul. He does not look with passion on perishable things, nor does he gather wealth for pleasure. He does not delight in pleasure, nor grieve his neighbor; he is not filled with luxury, nor led astray by the wanderings of the eyes. For the Lord is his portion. A good purpose does not accept the glory or the dishonor that comes from men, and it knows no deceit or falsehood or strife or reviling. For the Lord dwells in him and gives light to his soul, and he rejoices toward all people at all times. The good mind does not have two tongues, of blessing and cursing, of insult and honor, of quietness and disturbance, of hypocrisy and truth, of poverty and wealth; rather, it has one sincere and pure disposition toward all. It does not have double sight or hearing; for in everything that it does, or speaks, or sees, it knows that the Lord is looking on his soul. And it cleanses
    the mind, so as not to be condemned by men and by God. But the disposition of Beliar is twofold, and it has no singleness. Flee, therefore, evil-mindedness, my children, and love the good mind, which the law of God knows, so that you may rest in hope, because the good-minded man does not have a darkened eye. He shows mercy to all, even if they are sinners; even if they devise evil against him, by doing good he overcomes evil, being shielded by what is good. And he loves the righteous as his own soul. If anyone is glorified, he does not envy him; if anyone is enriched, he is not jealous; if anyone is valiant, he praises him; the virtuous man he commends; on the poor man he has mercy; with the weak he has compassion; to God he sings praise[d][c][b]. The one who has the grace of a good spirit he loves as his own soul.
translation:
  language: de
  text: '**Das Testament Benjamins 6**


    **1** Der Entschluss eines guten Menschen ist nicht in der Gewalt des Geistes der Verführung Beliars[a]; denn der Engel des Friedens leitet seine Seele. **2** Er blickt nicht begehrlich auf vergängliche Dinge und sammelt keinen Reichtum, um sich dem Genuss hinzugeben. **3** Er findet kein Gefallen am Genuss, betrübt seinen Nächsten nicht, schwelgt nicht im Überfluss und lässt sich nicht durch das Umherschweifen der Augen irreführen. Denn der Herr ist sein Anteil.


    **4** Der gute Entschluss nimmt weder Ruhm noch Schande von Menschen an[b] und kennt weder Arglist noch Lüge noch Streit noch Beschimpfung. Denn der Herr wohnt in ihm und erleuchtet seine Seele, und er freut sich allezeit über alle Menschen. **5** Die gute Gesinnung hat nicht zwei Zungen für Segen und Fluch, für Kränkung und Ehre, für Ruhe und Unruhe, für Heuchelei und Wahrheit, für Armut und Reichtum. Vielmehr hat sie allen gegenüber nur eine einzige aufrichtige und reine Haltung. **6** Sie hat weder doppeltes Sehen noch doppeltes Hören[c]; denn bei allem, was sie tut, sagt oder sieht, weiß sie, dass der Herr auf ihre Seele sieht[d].


    **7** Und sie reinigt ihre Gesinnung, damit sie weder von Menschen noch von Gott verurteilt wird. Ebenso sind auch die Werke Beliars zwiespältig und haben keine Lauterkeit in sich.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text bietet die Namensform „Beliar“; vielen ist die Gestalt unter der Form „Belial“ bekannt.
    reason: lexical_alternative
  - marker: b
    text: Die Überlieferung dieser Wendung ist textkritisch schwierig, besonders bei der Verneinung von „Schande“.
    reason: textual_ambiguity
  - marker: c
    text: 'Wörtlich: „Sie hat weder ein doppeltes Sehen noch ein doppeltes Hören.“ Das Bild führt den Gegensatz zwischen Zwiespältigkeit und ungeteilter Lauterkeit fort.'
    reason: lexical_alternative
  - marker: d
    text: Das griechische Verb kann auch „nach jemandem sehen“, „besuchen“ oder „prüfen“ bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: διαβούλιον
  choice: Entschluss
  rationale: Das Wort bezeichnet hier die gefestigte innere Willensausrichtung des guten Menschen. „Entschluss“ bewahrt den willentlichen Sinn; „Ratschluss“ wäre möglich, klingt im heutigen Deutsch jedoch stärker nach Planung oder göttlichem Beschluss.
- source_word: πλάνης πνεύματος Βελίαρ
  choice: des irreführenden Geistes Beliars
  rationale: πλάνη kann Irrtum, Verführung oder Irreführung bezeichnen. Die attributive Wiedergabe lässt offen, ob der Geist selbst irreführt oder durch Irreführung gekennzeichnet ist, ohne die Wendung auf bloße Täuschung zu verengen.
- source_word: ἐμπαθῶς
  choice: begehrlich
  rationale: Das Adverb bezeichnet ein von ungeordneter Leidenschaft bestimmtes Schauen. „Begehrlich“ ist natürlich und umfasst hier materielles Verlangen, ohne den Ausdruck auf sexuelles Begehren zu beschränken.
- source_word: εἰς φιληδονίαν
  choice: zur Genussliebe
  rationale: Die ungewöhnliche, aber verständliche Formulierung bildet die Ausrichtung des Reichtums auf φιληδονία, die Liebe zum Genuss, genauer ab als das neutrale „zum Vergnügen“.
- source_word: μετεωρισμοῖς ὀφθαλμῶν
  choice: durch das Umherschweifen der Augen
  rationale: Die bildhafte Rede von unstetem, begehrendem Sehen bleibt erhalten.
- source_word: μερὶς
  choice: Anteil
  rationale: „Anteil“ bewahrt die biblisch geprägte Vorstellung, dass der Herr das eigentliche Gut und Los des Menschen ist.
- source_word: διάνοια
  choice: Gesinnung / Gedanken
  rationale: In Vers 5 bezeichnet διάνοια die moralische innere Ausrichtung und wird daher mit „Gesinnung“ wiedergegeben. In Vers 7 verlangt das Reinigen derselben Größe im Deutschen eher „Gedanken“; die sachliche Verbindung bleibt erkennbar.
- source_word: ἐπισκέπτει
  choice: prüfend ansieht
  rationale: Das Verb kann besuchen, nach jemandem sehen oder untersuchen bedeuten. Im Zusammenhang göttlicher Rechenschaft verbindet „prüfend ansieht“ Wahrnehmung und Prüfung, ohne ein endgültiges Gericht vorwegzunehmen.
- source_word: ἀπλότητα
  choice: Lauterkeit
  rationale: Der Gegensatz zu den „zwiespältigen“ Werken Beliars meint Einfachheit, Ungeteiltheit und Aufrichtigkeit. „Lauterkeit“ gibt den moralischen Sinn im Deutschen am natürlichsten wieder.
theological_decisions:
- issue: Personifikation des guten Entschlusses und der guten Gesinnung
  choice: Die grammatische Personifikation wurde beibehalten.
  alternative: Alle Aussagen unmittelbar auf „der gute Mensch“ beziehen.
  rationale: Der griechische Text wechselt bewusst zwischen dem guten Menschen, seinem Entschluss und seiner Gesinnung. Eine Vereinheitlichung würde die innere moralische Ausrichtung stärker auslegen, als der Wortlaut erlaubt.
- issue: Göttliches ἐπισκέπτει in Vers 6
  choice: „prüfend ansieht“
  alternative: „besucht“ oder „beaufsichtigt“
  rationale: Die folgende Sorge, weder von Menschen noch von Gott verurteilt zu werden, legt eine prüfende Bedeutung nahe. Die Übersetzung vermeidet dennoch die stärkere Festlegung „richtet“.
- issue: Subjekt und Gegenstand in Vers 7
  choice: Die gute Gesinnung reinigt ihre Gedanken; Beliars Werke sind zwiespältig.
  alternative: Der Mensch reinigt seine Gesinnung; Beliars Gesinnung ist zwiespältig.
  rationale: 'Die gewählte Fassung folgt den grammatischen Bezügen des vorgelegten griechischen Textes: καθαίρει setzt die vorherige Personifikation fort, und τὰ ἔργα ist ausdrücklich das Subjekt des abschließenden Satzes.'
- issue: Umfang des übersetzten Kapitels
  choice: Übersetzt wurde ausschließlich der im griechischen Ausgangstext überlieferte Abschnitt 6,1–7.
  alternative: Die längere Fortsetzung der englischen Konsultationsfassung übernehmen.
  rationale: Die bereitgestellte griechische Quelle endet mit der Aussage über die Werke Beliars. Die darüber hinausgehende englische Fortsetzung besitzt in den vorgelegten Ausgangssprachendaten keine überprüfbare Grundlage und wurde daher nicht stillschweigend ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Satzstruktur. Die wiederkehrenden Bilder von zwei Zungen, doppeltem Sehen und Hören sowie ungeteilter Lauterkeit wurden nicht zu bloßer „Heuchelei“ verflacht. Die Verszählung wurde zur Orientierung sichtbar gemacht.
