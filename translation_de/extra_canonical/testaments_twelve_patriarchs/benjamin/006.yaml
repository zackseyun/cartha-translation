review_pass:
  verdict: revise
  source_fidelity: 'Eine Revision ist nötig. Die Fassung beschränkt sich zu Recht auf den tatsächlich vorgelegten griechischen Text (Vv. 1–7), doch einige Wendungen entfernen sich vermeidbar vom Wortlaut: insbesondere V. 4 („richtet sich nach“ statt „nimmt an“) und V. 6 („sieht und hört nicht auf zweierlei Weise“ statt des Bildes von doppeltem Sehen und Hören). Die Deutung von ἐπισκέπτει als ausdrücklich „prüfend“ ist möglich, aber stärker als der mehrdeutige griechische Ausdruck.'
  naturalness: Der Registerton ist überwiegend gelungen. „zur Genussliebe“ wirkt jedoch im modernen Standarddeutsch künstlich. Die Reihung in V. 5 wird mit „eine für … und eine für …“ semantisch missverständlich, weil sie den zwei Zungen jeweils gegensätzliche Funktionen zuschreibt.
  terminology: „Beliar“, „Anteil“, „Gesinnung“ und „Lauterkeit“ sind tragfähig. „Entschluss“ kann διαβούλιον wiedergeben, sollte aber in V. 4 die sachliche Personifikation mit dem Quellverb „annehmen“ verbinden. Die Lesart zu Ruhm/Schande ist textkritisch unsicher und soll knapp als solche gekennzeichnet bleiben.
  issues:
  - severity: medium
    issue: 'V. 4: „richtet sich weder nach Ansehen noch nach Verachtung“'
    rationale: δέχεται bedeutet „annehmen/akzeptieren/empfangen“, nicht „sich nach etwas richten“. Die vorliegende Formulierung ändert die Aussage von der Nichtannahme menschlicher Bewertung zur Unabhängigkeit von ihr.
  - severity: medium
    issue: 'V. 5: Erklärung der „zwei Zungen“ durch „eine für … und eine für …“'
    rationale: Das Griechische nennt gegensätzliche Wort- und Verhaltensweisen als Kennzeichen der doppelten Zunge; die deutsche Konstruktion kann suggerieren, jede der zwei Zungen sei jeweils für beide Gegensätze zuständig. Eine nähere, verständliche Bildwiedergabe ist möglich.
  - severity: medium
    issue: 'V. 6: Bild von doppeltem Sehen und Hören paraphrasiert'
    rationale: „Sie sieht und hört nicht auf zweierlei Weise“ glättet die bewusst bildhafte Nominalform ὅρασιν … ἀκοὴν διπλῆν. Die wörtlichere Fassung ist im Deutschen verständlich und bewahrt das Leitmotiv der Ungeteiltheit.
  - severity: low
    issue: 'V. 2: „zur Genussliebe“'
    rationale: Die Formulierung ist zwar etymologisch nachvollziehbar, aber im heutigen Deutsch unnötig schwerfällig. „um sich dem Genuss hinzugeben“ gibt die Zielrichtung von εἰς φιληδονίαν natürlich wieder.
  - severity: medium
    issue: 'V. 6: „prüfend ansieht“ legt ἐπισκέπτει zu stark fest'
    rationale: Das Verb kann unter anderem nach jemandem sehen, sich jemandes annehmen, besuchen oder prüfen. Der Kontext erlaubt eine prüfende Nuance, verlangt sie aber nicht; der deutsche Text sollte die Ambiguität nicht ohne Not auflösen.
