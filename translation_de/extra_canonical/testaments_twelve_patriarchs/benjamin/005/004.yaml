  source_fidelity: 'Die Übersetzung gibt die Satzglieder und den Gedankengang des Griechischen zuverlässig wieder: ὑβρίζειν als „beleidigen“, ἄνδρα ὅσιον als „einen frommen Mann“, μετανοεῖν als „bereut er es“, ἐλεεῖν als „hat Erbarmen“ und σιωπᾷ als „schweigt“. Die Ergänzung „es“ macht das im Deutschen naheliegende Bezugsobjekt deutlich, ohne den Sinn wesentlich einzuengen. Der aus dem Kontext erschlossene Bezug von „ihn“ bei „beschimpfen“ ist idiomatisch und sachlich plausibel.'
  naturalness: Modernes, gut verständliches Standarddeutsch. Die wiederholte Bezeichnung „frommen Mann / der Fromme“ bewahrt die griechische Wiederaufnahme und bleibt in diesem ethisch-religiösen Kontext angemessen. Der Satzfluss ist klar und würdig, ohne unnötig altertümlich zu wirken.
  terminology: „Fromm“ ist für ὅσιος hier eine vertretbare, natürliche Wiedergabe und vermeidet die im Deutschen mögliche Assoziation von „heilig“ mit einem formalen Heiligentitel. „Erbarmen“ für ἐλεεῖ und „beschimpfen“ für λοιδορεῖν sind treffend. Keine konfessionelle oder über die Vorlage hinausgehende Deutung wurde eingeführt.
