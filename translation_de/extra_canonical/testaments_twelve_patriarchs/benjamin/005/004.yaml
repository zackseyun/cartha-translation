id: T12P.BEN.5.4
reference: Testament of Benjamin 5:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Ἐὰν γὰρ˥²⁶ ὑβρίσει²⁷ *ἄνδρα ὅσιον²⁸ μετανοεῖ²⁹, ἐλεεῖ γὰρ ⌈ὁ ὅσιος⌉ τῶν λοιδορούν³⁰ καὶ σιωπᾷ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/004.yaml
  text: For if anyone insults a holy man, he repents; for the holy one has mercy on those who revile him and keeps silent.
translation:
  language: de
  text: Denn wenn jemand einen frommen Mann beleidigt, bereut er es; denn der Fromme hat Erbarmen mit denen, die ihn beschimpfen, und schweigt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑβρίσει
  choice: beleidigt
  rationale: Das Verb bezeichnet hier eine entehrende oder verletzende Behandlung; „beleidigt“ gibt den Zusammenhang mit λοιδορούν natürlich und präzise wieder, ohne körperliche Gewalt hineinzulesen.
- source_word: ἄνδρα ὅσιον
  choice: einen frommen Mann
  rationale: ὅσιος bezeichnet einen frommen, gottgefälligen Menschen. „Fromm“ ist im Deutschen verständlich und bewahrt den religiös-ethischen Sinn besser als das missverständliche „heilig“.
- source_word: μετανοεῖ
  choice: bereut er es
  rationale: μετανοεῖ kann Sinnesänderung, Reue oder Umkehr bezeichnen. Im unmittelbaren Satzfluss ist „bereut er es“ natürlich, lässt aber offen, wie umfassend die Umkehr ist.
- source_word: ἐλεεῖ
  choice: hat Erbarmen
  rationale: Die Wendung bildet den Sinn von Erbarmen bzw. barmherziger Zuwendung würdig und idiomatisch ab.
- source_word: τῶν λοιδορούν
  choice: mit denen, die ihn beschimpfen
  rationale: Das substantivierte Partizip bezeichnet Menschen, die schmähen oder beschimpfen. Das Objekt „ihn“ ist aus dem Zusammenhang erschlossen und im Deutschen für einen natürlichen Satz notwendig.
- source_word: σιωπᾷ
  choice: schweigt
  rationale: Die schlichte Wiedergabe erhält die pointierte Aussage des griechischen Präsens.
theological_decisions:
- issue: Bezug des Subjekts von μετανοεῖ
  choice: Der Beleidigende bereut seine Tat.
  alternative: Der fromme Mann ändert seine Haltung bzw. wendet sich um.
  rationale: Das unausgedrückte Subjekt wird am natürlichsten aus ἐὰν ... ὑβρίσει als derselbe Handelnde verstanden. Die Übersetzung folgt dieser syntaktischen Lesart, ohne einen theologischen Mechanismus seiner Reue zu ergänzen.
- issue: Wiedergabe von ὅσιος
  choice: fromm / der Fromme
  alternative: heilig / der Heilige
  rationale: „Der Heilige“ könnte im Deutschen wie ein Titel oder eine konfessionell geprägte Kategorie wirken. „Der Fromme“ bezeichnet hier klar den gottgefälligen Menschen und hält beide Vorkommen lexikalisch zusammen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Anschluss an die griechische Satzstruktur. Die Wiederholung „frommen Mann / der Fromme“ wurde bewusst erhalten; das semantisch nicht ganz ausgeschöpfte μετανοεῖ wird kontextgerecht mit „bereut er es“ wiedergegeben.
