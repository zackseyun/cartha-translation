source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Κἄν³¹ τις *δίκαιον προδώσει³², *ὁ δίκαιος προσεύχεται· εἰ καὶ πρὸς³³ ὀλίγον ταπεινωθῇ, *μετʼ οὐ³⁴ πολὺ φαιδρότερος³⁵ ἀναφαίνεται, οἷος γέγονεν³⁶ Ἰωσὴφ ὁ ἀδελφός μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/005.yaml
  text: And if anyone betrays a righteous man, the righteous man prays; and even if for a little while he is brought low, before long he reappears far more radiant, as Joseph my brother became.
translation:
  language: de
  text: Und selbst wenn jemand einen Gerechten verrät, betet der Gerechte. Auch wenn er für kurze Zeit erniedrigt wird, tritt er nicht lange danach umso strahlender hervor, wie mein Bruder Josef.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προδώσει
  choice: verrät
  rationale: Gibt die konkrete Bedeutung von προδίδωμι direkt und natürlich wieder.
- source_word: ταπεινωθῇ
  choice: erniedrigt wird
  rationale: Bewahrt das Passiv und den Gedanken einer zeitweiligen Demütigung beziehungsweise Herabsetzung.
- source_word: φαιδρότερος ἀναφαίνεται
  choice: tritt … umso strahlender hervor
  rationale: ἀναφαίνεται bezeichnet ein erneutes oder deutliches Hervortreten; der Komparativ φαιδρότερος wird mit „umso strahlender“ idiomatisch bewahrt.
- source_word: μετʼ οὐ πολύ
  choice: nicht lange danach
  rationale: Entspricht der zeitlichen Aussage wörtlich und in natürlichem Deutsch.
theological_decisions:
- issue: Bezug des Gerechten
  choice: „einen Gerechten“ und anschließend „der Gerechte“
  alternative: „eine gerechte Seele“
  rationale: δίκαιον und ὁ δίκαιος bezeichnen hier substantivisch eine gerechte Person; „Seele“ steht im vorliegenden griechischen Text nicht.
- issue: Vergleich mit Josef
  choice: „wie mein Bruder Josef“
  alternative: „wie es meinem Bruder Josef erging“
  rationale: Die knappe Vergleichsform des Griechischen bleibt erhalten, ohne zusätzliche Deutung darüber, worin Josefs späterer Zustand genau bestand.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die Wiederholung von „Gerechte“ wird als bewusstes Merkmal des Ausgangstextes beibehalten; der Vergleich mit Josef bleibt knapp und theologisch offen.
