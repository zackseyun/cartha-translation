  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/003.yaml
  text: For where there is fear of good works and light in the mind, darkness flees from it.
translation:
  language: de
  text: Denn wo Furcht vor guten Werken und Licht im Denken sind, flieht die Finsternis von ihm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φόβος ἀγαθῶν ἔργων
  choice: Furcht vor guten Werken
  rationale: Die ungewöhnliche Genitivverbindung wird eng am griechischen Wortlaut wiedergegeben, ohne sie deutend zu „Ehrfurcht“ oder „Gottesfurcht“ umzudeuten.
- source_word: φῶς εἰς διάνοιαν
  choice: Licht im Denken
  rationale: Das Griechische verwendet wörtlich eine Richtungsangabe („Licht in das Denken hinein“); im Deutschen bezeichnet „im Denken“ den daraus hervorgehenden inneren Bereich natürlich und verständlich.
- source_word: τὸ σκότος ἀποδιδράσκει
  choice: die Finsternis flieht
  rationale: „Finsternis“ wahrt den bildhaften und würdevollen Gegensatz zu „Licht“; „flieht“ gibt das verstärkte Verb knapp wieder.
theological_decisions:
- issue: Deutung der ungewöhnlichen Furcht vor guten Werken
  choice: Die befremdliche Formulierung bleibt als „Furcht vor guten Werken“ stehen.
  alternative: „Ehrfurcht vor guten Werken“ oder „Gottesfurcht, gute Werke und Licht“
  rationale: Der überlieferte griechische Text verbindet φόβος unmittelbar mit ἀγαθῶν ἔργων. Eine positivierende oder syntaktisch umgestaltende Wiedergabe würde eine mögliche Textspannung stillschweigend auflösen.
- issue: Bezug von ἀπ’ αὐτοῦ
  choice: Der räumliche Bezug wird idiomatisch durch das korrelative „wo … da“ ausgedrückt, ohne ein bestimmtes Bezugswort festzulegen.
  alternative: „flieht von ihm“ oder „flieht aus dem Denken“
  rationale: Das Pronomen hat im griechischen Satz keinen völlig eindeutigen Bezug. Die deutsche Formulierung bewahrt den allgemeinen Sinn, ohne es sicher auf eine Person, die Furcht, das Licht oder das Denken zu beziehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Konstruktion „wo … da“ hält den Satz trotz der ungewöhnlichen Gedankenverbindung verständlich; die echte inhaltliche Sperrigkeit des griechischen Textes wird nicht geglättet.
