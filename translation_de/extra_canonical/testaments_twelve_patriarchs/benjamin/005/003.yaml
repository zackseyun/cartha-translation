  source_fidelity: 'Der Entwurf gibt die drei Bestandteile des griechischen Satzes grundsätzlich wieder: φόβος ἀγαθῶν ἔργων, φῶς εἰς διάνοιαν und das Fliehen der Finsternis. Das hinzugefügte „auch“ hat jedoch keine Grundlage im griechischen Text. Zudem lässt die Auslassung von ἀπʼ αὐτοῦ den ausdrücklich vorhandenen, wenn auch in seinem Antezedens nicht völlig sicheren Bezug unberücksichtigt.'
  naturalness: „Furcht vor guten Werken“ ist absichtlich sperrig, aber als quellentreue Wiedergabe verständlich. Kongruent und idiomatisch ist bei zwei Subjekten „sind“. Die Formulierung „da flieht die Finsternis von ihm“ ist modernes Standarddeutsch und bewahrt die im Ausgangstext vorhandene pronominale Mehrdeutigkeit besser als die vollständige Tilgung.
  terminology: „Furcht“, „gute Werke“, „Licht“, „Denken“ und „Finsternis“ sind passend. „Finsternis“ wahrt die bildhafte, gehobene Sprache. Eine Umdeutung zu „Ehrfurcht“ oder „Gottesfurcht“ ist nicht gerechtfertigt.
  issues:
  - severity: low
    issue: Unbegründetes „auch“
    rationale: καί verbindet „Furcht vor guten Werken“ und „Licht im Denken“; es bedeutet nicht, dass die Finsternis zusätzlich flieht. „Auch“ sollte daher entfallen.
  - severity: medium
    issue: ἀπʼ αὐτοῦ nicht wiedergegeben
    rationale: Das griechische Verb wird ausdrücklich durch „von ihm/ihm weg“ ergänzt. Obwohl das Antezedens von αὐτοῦ strittig bzw. nicht eindeutig ist, kann das deutsche maskuline Pronomen „ihm“ diese Offenheit erhalten; eine Auslassung tilgt ein Textelement.
  revised_text: Denn wo Furcht vor guten Werken und Licht im Denken sind, flieht die Finsternis von ihm.
