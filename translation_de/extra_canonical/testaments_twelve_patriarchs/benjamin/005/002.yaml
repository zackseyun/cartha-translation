source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ἐὰν ἦτε ἀγαθοποιοῦντες καὶ *τὰ ἀκάθαρτα¹⁶ πνεύματα φεύξονται¹⁷ *ἀφʼ ὑμῶν¹⁸, καὶ¹⁹ τὰ θηρία²⁰ *φοβηθήσονται ὑμᾶς²¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/002.yaml
  text: If you are doing good, even the unclean spirits will flee from you, and the wild beasts will fear you.
translation:
  language: de
  text: Wenn ihr Gutes tut, werden sogar die unreinen Geister vor euch fliehen, und die wilden Tiere werden sich vor euch fürchten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοποιοῦντες
  choice: Gutes tut
  rationale: Gibt das fortdauernde Tun des Guten natürlich und verständlich wieder, ohne den Ausdruck auf einzelne gute Werke einzuengen.
- source_word: τὰ ἀκάθαρτα πνεύματα
  choice: die unreinen Geister
  rationale: Entspricht der religiös geprägten Bedeutung des griechischen Ausdrucks und bewahrt dessen personale Mehrdeutigkeit.
- source_word: φεύξονται ἀφʼ ὑμῶν
  choice: werden … vor euch fliehen
  rationale: Natürliches Deutsch für das Sich-Entfernen aus Furcht oder Abwehr; die Präposition ἀπό wird im Zusammenhang idiomatisch mit „vor“ wiedergegeben.
- source_word: τὰ θηρία
  choice: die wilden Tiere
  rationale: Bezeichnet hier Tiere außerhalb des menschlichen Lebensbereichs und gibt den bedrohlichen Beiklang von θηρία klar wieder.
- source_word: φοβηθήσονται ὑμᾶς
  choice: werden sich vor euch fürchten
  rationale: Idiomatiche Wiedergabe des passivischen griechischen Verbs mit Akkusativobjekt.
theological_decisions:
- issue: Verstärkende Funktion von καί vor „die unreinen Geister“
  choice: sogar
  alternative: auch
  rationale: 'Im Zusammenhang steigert καί die Aussage: Nicht nur allgemein nachteilige Mächte, sondern selbst unreine Geister fliehen vor Menschen, die Gutes tun. „Sogar“ macht diese naheliegende Akzentuierung im Deutschen sichtbar, ohne eine zusätzliche Aussage einzuführen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Der konditionale Zusammenhang und die parallele Satzstruktur des Griechischen bleiben erhalten.
