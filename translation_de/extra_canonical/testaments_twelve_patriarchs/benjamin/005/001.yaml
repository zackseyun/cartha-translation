source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: V. Ἐὰν ⸀οὖν καὶ ὑμεῖς¹· ἔχετε² ἀγαθὴν³ ⸀διάνοιαν⁴, καὶ⸃ οἱ πονηροὶ ἄνθρωποι⁵ *εἰρηνεύσουσιν μεθʼ ὑμῶν⁶, καὶ οἱ ἄσωτοι αἰδεσθέντες⁷ ὑμᾶς⁸ ⸀ἐπιστρέψουσιν⁹ εἰς *τὸ ἀγαθόν¹⁰, καὶ οἱ πλεονεκτοῦντες¹¹ οὐ μόνον ἀποστήσονται *τοῦ πάθους¹² ἀλλὰ καὶ *τὰ τῆς¹³ πλεονεξίας *ἃ εἶχον¹⁴ δώσουσιν¹⁵ τοῖς θλιβομένοις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/005/001.yaml
  text: If, then, you also have a good mind, even wicked people will be at peace with you, and the profligate, being put to shame by you, will turn to what is good; and those who are greedy will not only turn away from their passion, but will also give to those in distress the things of greed that they had.
translation:
  language: de
  text: Wenn also auch ihr eine gute Gesinnung habt, werden selbst böse Menschen mit euch in Frieden leben. Die Haltlosen werden sich vor euch schämen und sich dem Guten zuwenden. Und die Habgierigen werden sich nicht nur von ihrer Leidenschaft abwenden, sondern auch den Besitz ihrer Habgier, den sie hatten, den Bedrängten geben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὴν διάνοιαν
  choice: eine gute Gesinnung
  rationale: διάνοια bezeichnet hier nicht bloß den Verstand, sondern die innere Haltung; „Gesinnung“ gibt den ethischen Zusammenhang natürlich wieder.
- source_word: οἱ πονηροὶ ἄνθρωποι
  choice: böse Menschen
  rationale: Direkte und im modernen Deutschen klare Wiedergabe der moralischen Bezeichnung.
- source_word: εἰρηνεύσουσιν μεθʼ ὑμῶν
  choice: werden mit euch in Frieden leben
  rationale: Gibt den durativen Sinn von εἰρηνεύω idiomatisch wieder, ohne bloß einen einmaligen Friedensschluss anzunehmen.
- source_word: οἱ ἄσωτοι
  choice: die Haltlosen
  rationale: ἄσωτος kann verschwenderisches, zügelloses oder ausschweifendes Verhalten bezeichnen. „Haltlose“ bewahrt die moralische Breite besser als eine enge Festlegung auf Verschwendung.
- source_word: αἰδεσθέντες ὑμᾶς
  choice: werden sich vor euch schämen
  rationale: Das Akkusativobjekt bei αἰδέομαι bezeichnet die Personen, denen gegenüber Scham oder Scheu empfunden wird; die deutsche Formulierung bleibt bewusst offen, ob ihr Vorbild oder ihre Gegenwart die Scham auslöst.
- source_word: ἐπιστρέψουσιν εἰς τὸ ἀγαθόν
  choice: werden sich dem Guten zuwenden
  rationale: Bewahrt die Richtungsangabe εἰς und gibt τὸ ἀγαθόν substantivisch wieder.
- source_word: οἱ πλεονεκτοῦντες
  choice: die Habgierigen
  rationale: Bezeichnet Menschen, die nach immer mehr greifen oder andere übervorteilen; „Habgierige“ ist im Kontext prägnant und verständlich.
- source_word: τοῦ πάθους
  choice: von ihrer Leidenschaft
  rationale: πάθος meint hier einen beherrschenden, moralisch negativen Trieb. „Leidenschaft“ erhält die bildhafte und ethische Spannung des griechischen Ausdrucks.
- source_word: τὰ τῆς πλεονεξίας ἃ εἶχον
  choice: das, was sie durch ihre Habgier erworben haben
  rationale: Die elliptische Wendung bezeichnet plausibel den aus Habgier stammenden Besitz. „Erworben“ macht die Zugehörigkeitsbeziehung im Deutschen verständlich, ohne ausdrücklich eine bestimmte Form des Unrechts festzulegen.
- source_word: τοῖς θλιβομένοις
  choice: den Bedrängten
  rationale: Das Partizip bezeichnet Menschen unter Druck, Not oder Bedrängnis; „Bedrängte“ bewahrt diese Breite.
theological_decisions:
- issue: Wirkung einer guten Gesinnung auf böse und haltlose Menschen
  choice: Die Zukunftsaussagen werden als nachdrückliche ethische Verheißung wiedergegeben.
  alternative: Sie als ausnahmslos geltendes Ursache-Wirkungs-Gesetz abzuschwächen oder ausdrücklich zu qualifizieren.
  rationale: Der griechische Text formuliert ohne Einschränkung im Futur. Die Übersetzung bewahrt diese Spannung und fügt keine systematische Einschränkung hinzu.
- issue: Bedeutung von πάθος
  choice: „Leidenschaft“
  alternative: „Sünde“, „Laster“ oder „Begierde“
  rationale: Der Quelltext benennt keine bestimmte Sünde. Die allgemeinere Wiedergabe vermeidet eine konfessionelle oder psychologische Präzisierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Die Wiederholung „werden“ erhält den verheißenden Charakter der griechischen Futurformen. Keine Fußnoten erforderlich.
