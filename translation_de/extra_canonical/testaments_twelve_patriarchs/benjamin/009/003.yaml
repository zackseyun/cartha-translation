source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '[3. Καὶ εἰσελεύσεται εἰς τὸν πρῶτον ναόν, καὶ ἐκεῖ Κύριος ὑβρισθήσεται²² *καὶ ἐπὶ ξύλου ὑψωθήσεται²³.]'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/003.yaml
  text: And he will enter into the first temple, and there the Lord will be insulted and will be lifted up on wood.[a]
translation:
  language: de
  text: '[3] Und er wird in den ersten Tempel hineingehen; dort wird der Herr geschmäht und an einem Holz erhöht werden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Verse 3–5 sind in der Überlieferung textlich unsicher und werden häufig als spätere Erweiterung angesehen; sie werden hier übersetzt, weil sie im zugrunde gelegten griechischen Text stehen.
    reason: textual_variant
lexical_decisions:
- source_word: ὑβρισθήσεται
  choice: wird geschmäht werden
  rationale: Gibt die passive Form und den Sinn von öffentlicher Schmähung beziehungsweise entehrender Misshandlung prägnant und natürlich wieder, ohne den Ausdruck auf bloße Worte einzuengen.
- source_word: ἐπὶ ξύλου
  choice: an einem Holz
  rationale: Bewahrt das konkrete und zugleich offene Bild des griechischen ξύλον. „Holz“ vermeidet die nicht ausdrücklich genannte Präzisierung zu „Kreuz“, während „an“ im Deutschen die Erhöhung beziehungsweise Aufhängung an einem hölzernen Gegenstand idiomatisch ausdrückt.
- source_word: ὑψωθήσεται
  choice: wird erhöht werden
  rationale: Erhält das Passiv und die mögliche Spannung zwischen körperlichem Emporheben und weitergehender Erhöhung, ohne sie auslegend aufzulösen.
- source_word: τὸν πρῶτον ναόν
  choice: den ersten Tempel
  rationale: Übersetzt die Ordnungszahl und ναός direkt; die mögliche historische oder symbolische Referenz wird nicht näher bestimmt.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts in εἰσελεύσεται und Verhältnis zu „der Herr“
  choice: „er“ im ersten Satzteil; „der Herr“ als ausdrücklich genanntes Subjekt der folgenden Passivformen
  alternative: „der Herr wird in den ersten Tempel hineingehen und dort …“
  rationale: Das Griechische lässt beim ersten Verb das Subjekt unausgesprochen und nennt erst danach κύριος. Die Übersetzung wahrt diese syntaktische Staffelung und legt nicht zusätzlich fest, ob beide Bezeichnungen ausdrücklich identisch gesetzt werden sollen.
- issue: Christologische Deutung von „an einem Holz erhöht“
  choice: Die Bildsprache bleibt wörtlich und offen.
  alternative: „ans Kreuz gehängt“ oder „gekreuzigt“
  rationale: Der griechische Text nennt ξύλον, nicht ausdrücklich σταυρός, und verwendet ὑψόω. Eine explizite Kreuzigungsformulierung wäre verständlich, würde die sprachliche und theologische Mehrdeutigkeit jedoch stärker festlegen als die Quelle.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Syntax. Das Semikolon gliedert den langen Satz natürlich. „Geschmäht“ ist allgemein verständlich, aber gehoben genug für den literarisch-religiösen Zusammenhang; „an einem Holz erhöht“ bewahrt bewusst die markante Ausdrucksweise und ihre Ambiguität.
