source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἀνελθὼν ἐκ τοῦ ᾅδου²⁷ ἔσται²⁸ μεταβαίνων²⁹ ἀπὸ³⁰ τῆς³¹ γῆς πρὸς³² οὐρανόν³³. Ἔγνων³⁴ δὲ οἷος ἔσται³⁵ ταπεινὸς ἐπὶ³⁵ γῆς, καὶ οἷος ἔνδοξος *ἐν οὐρανῷ³⁶].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/005.yaml
  text: And having gone up from Hades, he will pass from earth to heaven. And I knew how lowly he would be on earth, and how glorious in heaven.
translation:
  language: de
  text: Und nachdem er aus dem Hades hinaufgestiegen ist, wird er von der Erde zum Himmel hinübergehen. Und ich erkannte, wie niedrig er auf Erden sein würde und wie herrlich im Himmel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ᾅδου
  choice: Hades
  rationale: Der Eigenbegriff bewahrt die Vorstellung des griechischen Totenreichs, ohne sie vorschnell mit »Hölle« gleichzusetzen.
- source_word: ἀνελθών
  choice: nachdem er … hinaufgestiegen ist
  rationale: Gibt das vorzeitige aoristische Partizip und seine Aufwärtsbewegung natürlich und genau wieder.
- source_word: μεταβαίνων
  choice: hinübergehen
  rationale: Bewahrt den Sinn eines Übergangs beziehungsweise Ortswechsels von der Erde zum Himmel.
- source_word: ἔγνων
  choice: ich erkannte
  rationale: Entspricht dem Aorist und vermeidet die präsentische Wiedergabe »ich weiß«.
- source_word: ταπεινός
  choice: demütig
  rationale: Gibt die Grundbedeutung wieder und lässt offen, ob vor allem Niedrigkeit, Bescheidenheit oder Erniedrigung gemeint ist.
- source_word: ἔνδοξος
  choice: herrlich
  rationale: Bildet den Gegensatz zu ταπεινός ab und bezeichnet den Zustand der Herrlichkeit im Himmel.
theological_decisions:
- issue: Bedeutung von ᾅδης
  choice: Hades
  alternative: Totenreich; Hölle
  rationale: »Hades« wahrt die antike Begrifflichkeit und vermeidet die theologisch stärker festgelegte Deutung »Hölle«.
- issue: Zeitlicher Bezug von ἔγνων und ἔσται
  choice: »ich erkannte … sein würde«
  alternative: »ich weiß … sein wird«
  rationale: Das Vergangenheitsverb ἔγνων wird ernst genommen; die Zukunft wird daher in der abhängigen Aussage als Zukunft aus vergangener Perspektive formuliert.
- issue: Nuance von ταπεινός
  choice: demütig
  alternative: niedrig; erniedrigt
  rationale: Die Übersetzung bewahrt die mögliche charakterliche und statusbezogene Bedeutung, ohne eine bestimmte christologische Deutung festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Syntax. Der erste Satz bleibt bewusst feierlich; »Hades« wird als verständlicher Fachbegriff beibehalten.
