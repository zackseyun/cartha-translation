revisions:
- from: Und die Verhüllung des Tempels wird zerreißen, und der Geist Gottes wird zu den Völkern hinübergehen wie ausgegossenes Feuer.
  to: Und der Vorhang des Tempels wird zerrissen werden, und der Geist Gottes wird zu den Völkern hinübergehen wie Feuer, das ausgegossen wird.
  rationale: Die Revision stellt den passiven Sinn von σχιζόμενον wieder her, ersetzt die im Deutschen unnatürliche Abstraktion „Verhüllung“ durch das im Tempelkontext sachgerechte „Vorhang“ und verdeutlicht die syntaktische Zuordnung des ausgegossenen Feuers. Die Bewegung des Geistes zu den Völkern bleibt als „hinübergehen“ erhalten und behauptet weder Ausschließlichkeit noch eine weitergehende theologische Folgerung.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T04:15:01Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Zukunftsaussagen und die Bewegungsrichtung von μεταβήσεται ἐπὶ τὰ ἔθνη sind im Entwurf grundsätzlich zutreffend wiedergegeben. Bei σχιζόμενον ist jedoch eine passive Wiedergabe vorzuziehen: Das griechische Partizip bezeichnet, dass das ἅπλωμα zerrissen wird, nicht primär ein selbsttätiges Zerreißen. Die Vergleichsphrase bezieht sich grammatisch auf πῦρ und wird mit einem Relativsatz klarer abgebildet.'
  naturalness: „Die Verhüllung des Tempels wird zerreißen“ ist im heutigen Standarddeutsch weniger idiomatisch und lässt die Konstruktion unnötig abstrakt wirken. „Der Vorhang des Tempels wird zerrissen werden“ ist klar, würdig und im Tempelkontext natürlich. „wie Feuer, das ausgegossen wird“ erhält das absichtlich ungewöhnliche Bild, ohne einen unklaren Anschluss zu erzeugen.
  terminology: ἅπλωμα ist ein ungewöhnlicher Ausdruck für etwas Ausgebreitetes bzw. einen Vorhang. Im vorliegenden Tempelbezug ist „Vorhang“ eine sichere, verständliche Wiedergabe, ohne die genaue kultische Funktion übermäßig festzulegen. „Geist Gottes“ und „Völker“ sind angemessen; „Völker“ wahrt die mögliche Breite von ἔθνη.
  issues:
  - severity: medium
    issue: Aktive bzw. intransitive Wiedergabe von σχιζόμενον
    rationale: „wird zerreißen“ kann im Deutschen ein selbsttätiges Zerreißen nahelegen. Das griechische σχιζόμενον ist passiv; „wird zerrissen werden“ bildet dies genauer ab.
  - severity: low
    issue: Unnatürliche und zu abstrakte Bezeichnung „Verhüllung“
    rationale: Obwohl ἅπλωμα nicht das gewöhnliche griechische Wort für Tempelvorhang ist, legt der Kontext einen Vorhang nahe. „Vorhang“ ist im Deutschen wesentlich idiomatischer und nicht unzulässig spezifisch.
  - severity: low
    issue: Unklarer Anschluss von „wie ausgegossenes Feuer“
    rationale: Ein Relativsatz macht deutlich, dass das Feuer ausgegossen wird, entsprechend dem zu πῦρ gehörenden Partizip ἐκχυνόμενον.
  revised_text: Und der Vorhang des Tempels wird zerrissen werden, und der Geist Gottes wird zu den Völkern hinübergehen wie Feuer, das ausgegossen wird.
  revised_footnotes: []
  revision_rationale: Die Revision stellt den passiven Sinn von σχιζόμενον wieder her, ersetzt die im Deutschen unnatürliche Abstraktion „Verhüllung“ durch das im Tempelkontext sachgerechte „Vorhang“ und verdeutlicht die syntaktische Zuordnung des ausgegossenen Feuers. Die Bewegung des Geistes zu den Völkern bleibt als „hinübergehen“ erhalten und behauptet weder Ausschließlichkeit noch eine weitergehende theologische Folgerung.
