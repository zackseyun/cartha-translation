source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἔσται τὸ ἅπλωμα τοῦ ναοῦ σχιζόμενον²⁴ καὶ μεταβήσεται²⁵ τὸ πνεῦμα τοῦ Θεοῦ ἐπὶ τὰ ἔθνη, ὥσπερ²⁶ πῦρ ἐκχυνόμενον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/004.yaml
  text: And the veil of the temple will be torn, and the Spirit of God will pass over to the nations, like fire being poured out.
translation:
  language: de
  text: Und der Vorhang des Tempels wird zerrissen werden, und der Geist Gottes wird zu den Völkern hinübergehen wie Feuer, das ausgegossen wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ἅπλωμα τοῦ ναοῦ
  choice: die Verhüllung des Tempels
  rationale: ἅπλωμα bezeichnet wörtlich etwas Ausgebreitetes bzw. eine Bedeckung. Im Tempelkontext ist offenbar ein verhüllender Vorhang gemeint; „Verhüllung“ bewahrt jedoch die ungewöhnliche und weniger eindeutige Ausdrucksweise des griechischen Textes besser als das festgelegtere „Vorhang“.
- source_word: σχιζόμενον
  choice: wird zerreißen
  rationale: Gibt das Zerreißen bzw. Gespaltenwerden natürlich wieder, ohne ausdrücklich einen Handelnden zu nennen.
- source_word: μεταβήσεται
  choice: wird … hinübergehen
  rationale: Bewahrt die räumliche Übergangsbewegung des Verbs und vermeidet eine stärkere Deutung wie „sich zuwenden“.
- source_word: τὰ ἔθνη
  choice: die Völker
  rationale: Entspricht dem üblichen Sinn von ἔθνη und lässt offen, ob allgemein Nationen oder speziell nichtjüdische Völker gemeint sind.
- source_word: ὥσπερ πῦρ ἐκχυνόμενον
  choice: wie ausgegossenes Feuer
  rationale: Erhält das ungewöhnliche Bild eines sich ergießenden Feuers knapp und anschaulich.
theological_decisions:
- issue: Übergang des Geistes Gottes zu den Völkern
  choice: zu den Völkern hinübergehen
  alternative: auf die Völker übergehen / sich den Völkern zuwenden
  rationale: Die gewählte Formulierung wahrt die Aussage einer Bewegung zu den Völkern, ohne zu behaupten, der Geist verlasse Israel endgültig oder werde ausschließlich den Völkern gegeben.
- issue: Tempelmotiv
  choice: Verhüllung des Tempels
  alternative: Vorhang des Tempels
  rationale: Der Kontext legt den Tempelvorhang nahe, doch das griechische ἅπλωμα ist ungewöhnlicher als die geläufigen Wörter für „Vorhang“. Daher wird die begriffliche Offenheit nicht vollständig eingeebnet.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satzbau folgt der feierlich-prophetischen Reihung des Griechischen; das ungewöhnliche Feuerbild bleibt bewusst erhalten.
