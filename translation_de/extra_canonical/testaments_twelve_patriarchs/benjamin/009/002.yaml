  source_fidelity: 'Der Entwurf gibt die wesentlichen Satzglieder zutreffend wieder: den zugeteilten Anteil, den Vergleich des späteren mit dem früheren Tempel, die Sammlung der zwölf Stämme und aller Völker sowie Gottes Heil. Die Wiedergabe von ἐν ἐπισκοπῇ mit „wenn … erscheint“ verschiebt jedoch die präpositionale Wendung zu einem bloß zeitlichen Nebensatz und lässt den im Griechischen ausgedrückten Begriff der Heimsuchung/Visitation entfallen.'
  naturalness: „Stammesgebiet“, „herrlicher“ und die Satzgliederung sind modernes, würdiges Standarddeutsch. „bei der Heimsuchung durch“ ist trotz der möglichen negativen Konnotation von „Heimsuchung“ hier als fachsprachlich-biblische Wiedergabe angemessen; die Fußnote erläutert die weitere Bedeutungsbreite.
  terminology: „Heil“ für τὸ σωτήριον und „Höchster“ für ὁ ὕψιστος sind passend. „einzigartig“ für μονογενής ist als vorsichtige Haupttextlösung vertretbar, sofern die Fußnote die Alternativen aufführt. „Der spätere … der frühere“ gibt den auf die Tempel bezogenen Vergleich sachgerecht wieder.
