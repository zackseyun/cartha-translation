  rationale: Die Revision ersetzt den temporalen Zusatz „wenn … erscheint“ durch eine präpositionale Wiedergabe von ἐν ἐπισκοπῇ. Damit bleibt erhalten, dass Gottes Heil mit einer als Visitation beziehungsweise Heimsuchung beschriebenen Handlung im Zusammenhang steht. Alle übrigen Entscheidungen des Entwurfs können bestehen bleiben.
