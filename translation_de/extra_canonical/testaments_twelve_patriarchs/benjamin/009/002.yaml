source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Πλὴν ἐν μερίδι ὑμῶν γενήσεται *ναὸς Θεοῦ¹⁴, καὶ *ἔσται ὁ ἔσχατος ἔνδοξος¹⁵ *ὑπὲρ τὸν πρῶτον¹⁶, καὶ *συναχθήσονται ἐκεῖ¹⁷ αἱ¹⁸ δώδεκα φυλαί, καὶ πάντα τὰ ἔθνη ἕως οὗ ὁ ὕψιστος ἀποστείλῃ¹⁹ τὸ σωτήριον αὐτοῦ²⁰ ἐν ἐπισκοπῇ μονογενοῦς προφήτου²¹. [3. Καὶ εἰσελεύσεται εἰς τὸν πρῶτον ναόν, καὶ ἐκεῖ Κύριος ὑβρισθήσεται²² *καὶ ἐπὶ ξύλου ὑψωθήσεται²³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/002.yaml
  text: Nevertheless, in your allotted portion there will be the temple of God, and the latter will be more glorious than the former; and there the twelve tribes and all the nations will be gathered, until the Most High sends his salvation in the visitation of an only-begotten prophet.
translation:
  language: de
  text: Doch in eurem Stammesgebiet wird der Tempel Gottes stehen, und der spätere wird herrlicher sein als der frühere. Dort werden die zwölf Stämme und alle Völker versammelt werden, bis der Höchste sein Heil bei der Heimsuchung durch einen einzigartigen Propheten[a] sendet.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „einen einziggezeugten Propheten“ oder „einen einzigen Propheten“.'
    reason: Die Bedeutungsbreite von μονογενής soll sichtbar bleiben, da „einzigartig“ mögliche Nuancen von Einzigkeit oder Herkunft nicht vollständig abbildet.
  - marker: b
    text: 'Das griechische Wort kann ein Aufsuchen, Erscheinen oder machtvolles Eingreifen bezeichnen; daher wäre auch möglich: „in der Heimsuchung eines einzigartigen Propheten“.'
    reason: ἐν ἐπισκοπῇ ist mehrdeutig und soll weder auf eine rein zeitliche Aussage noch auf einen technischen kirchlichen Begriff festgelegt werden.
lexical_decisions:
- source_word: ἐν μερίδι ὑμῶν
  choice: in eurem Stammesgebiet
  rationale: μερίς bezeichnet den zugeteilten Anteil; im Zusammenhang mit Benjamin ist das Stammesgebiet gemeint. Die Wiedergabe macht diesen Bezug im Deutschen verständlich, ohne einen engeren Ort festzulegen.
- source_word: ὁ ἔσχατος … τὸν πρῶτον
  choice: der spätere … der frühere
  rationale: Die substantivierten Adjektive beziehen sich auf ναός. Im paarigen Vergleich bezeichnet ἔσχατος hier den nachfolgenden Tempel, nicht zwingend den zeitlich allerletzten.
- source_word: τὸ σωτήριον αὐτοῦ
  choice: sein Heil
  rationale: Das substantivierte σωτήριον kann Gottes rettendes Handeln oder die von ihm kommende Rettung bezeichnen; „sein Heil“ bewahrt diese Weite.
- source_word: ἐν ἐπισκοπῇ
  choice: wenn … erscheint
  rationale: ἐπισκοπή bezeichnet ein Aufsuchen, Erscheinen oder Eingreifen. Die zeitliche Formulierung passt zu ἕως οὗ und ergibt natürliches modernes Deutsch, ohne das Geschehen als bloße Aufsicht zu deuten.
- source_word: μονογενοῦς προφήτου
  choice: ein einzigartiger Prophet
  rationale: μονογενής kann „einzig“, „einzigartig“ oder „einziggezeugt“ bedeuten. „Einzigartig“ ist im Deutschen verständlich und vermeidet, eine bestimmte metaphysische Deutung in den Ausdruck hineinzulesen.
theological_decisions:
- issue: Bezug von „der spätere“ und „der frühere“
  choice: Als Vergleich zweier Tempel wiedergegeben
  alternative: „der Letzte … der Erste“
  rationale: Das Genus verweist auf ναός, und der unmittelbare Vergleich verlangt im Deutschen eine klare Tempelreferenz. „Später/früher“ bewahrt den zeitlichen Kontrast, ohne eine Aussage über einen absolut letzten Tempel zu erzwingen.
- issue: Bedeutung von μονογενής beim Propheten
  choice: „einzigartig“ im Haupttext, Varianten in der Fußnote
  alternative: „einziggezeugt“ oder „einziger“
  rationale: Der griechische Ausdruck lässt sowohl Einzigkeit als auch die traditionelle Vorstellung des Einziggezeugten anklingen. Die Übersetzung legt keine christologische oder nichtchristologische Identifikation fest.
- issue: Abgrenzung von Vers 2 gegenüber dem überlieferten Beginn von Vers 3
  choice: Nur den Text von 9,2 in den Haupttext aufgenommen
  alternative: Den in der Quelle anschließenden, als Vers 3 gekennzeichneten Klammertext anfügen
  rationale: Die angeforderte Referenz ist Testament Benjamins 9,2; der Quelltext kennzeichnet den folgenden Satz ausdrücklich als Vers 3.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Stammesgebiet“ verdeutlicht den benjaminitischen Landanteil; „herrlicher“ bewahrt die religiöse und kultische Färbung von ἔνδοξος. Die Satzstruktur wurde gegenüber dem langen griechischen Satz leicht gegliedert, ohne die Abfolge der Aussagen zu verändern.
