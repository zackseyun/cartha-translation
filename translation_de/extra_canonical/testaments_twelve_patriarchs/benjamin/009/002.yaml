- from: Doch in eurem Stammesgebiet wird der Tempel Gottes stehen, und der spätere wird herrlicher sein als der frühere. Dort werden die zwölf Stämme und alle Völker versammelt werden, bis der Höchste sein Heil sendet, wenn ein einzigartiger Prophet[a] erscheint.[b]
