review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Hauptaussagen zutreffend wieder, lässt jedoch πράξεις („Taten/Geschehnisse“) in der auffällig schwierigen Eingangsfügung πράξεις ἀπὸ λογίων aus. „Aufgrund der Aussprüche“ gibt nur ἀπὸ λογίων wieder und glättet damit ein Element des griechischen Wortlauts weg. Die zeitliche Folge mit πάλιν und die offene Bedeutung von ἀπολεῖσθε sind ansonsten angemessen wiedergegeben.
  naturalness: Der Ton ist modernes, würdiges Standarddeutsch. Die behutsam quellennahe Wiedergabe der ungewöhnlichen Anfangsfügung benötigt eine Anmerkung, damit die deutsche Formulierung nicht als unnötige stilistische Härte missverstanden wird.
  terminology: „Unzucht“ und „zugrunde gehen“ sind angemessen und ohne unzulässige Konkretisierung. Für ἐν ὑμῖν bleibt „unter euch“ eine mögliche, natürliche gemeinschaftsbezogene Wiedergabe. Das adversative „doch“ sollte entfallen, da der griechische Text beide Zukunftsaussagen lediglich mit καί verbindet und keine ausdrückliche Gegenüberstellung markiert.
  issues:
  - severity: medium
    issue: πράξεις in der Eingangsfügung ist nicht übersetzt.
    rationale: Der Entwurf reduziert πράξεις ἀπὸ λογίων auf „aufgrund der Aussprüche“. Da der überlieferte griechische Text ausdrücklich von πράξεις spricht, sollte dieses schwierige und möglicherweise textkritisch problematische Element nicht ohne Kennzeichnung ausgelassen werden.
  - severity: low
    issue: „doch“ verstärkt die Beziehung der beiden Schlusssätze.
    rationale: πάλιν leitet die erneute Erneuerung ein; anschließend verbindet καί den Satz über das Reich des Herrn. Eine adversative Ausdeutung ist nicht erforderlich.
  revised_text: 'Ich sage euch auch Taten aus den Aussprüchen Henochs, des Gerechten: Ihr werdet die Unzucht Sodoms treiben und für kurze Zeit zugrunde gehen. Dann werdet ihr wieder erneuert werden, und das Reich des Herrn wird nicht unter euch sein.¹'
  revised_footnotes:
  - marker: ¹
    text: Die griechische Eingangsfügung lautet wörtlich etwa „Taten aus den Aussprüchen Henochs“. Ihr genauer syntaktischer Zusammenhang ist ungewöhnlich; die Übersetzung bewahrt daher sowohl „Taten“ als auch den Bezug auf Henochs Aussprüche, ohne näher festzulegen, wie diese zueinander stehen.
    reason: Kennzeichnet die sprachlich schwierige, in ihrer genauen Beziehung nicht eindeutig aufzulösende griechische Formulierung und verhindert, dass das im Ausgangstext vorhandene Wort πράξεις stillschweigend entfällt.
  revision_rationale: Die Revision stellt das ausgelassene πράξεις wieder her und erläutert die ungewöhnliche Konstruktion in einer Fußnote, statt sie durch eine eindeutige Auslegung zu ersetzen. Sie entfernt außerdem die nicht ausdrücklich markierte adversative Nuance von „doch“. Die übrigen Formulierungen werden beibehalten, da sie den griechischen Wortlaut und dessen theologische Zurückhaltung angemessen wiedergeben.
