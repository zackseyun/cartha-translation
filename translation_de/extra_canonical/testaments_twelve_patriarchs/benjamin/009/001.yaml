source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: IX. Λέγω δὲ ὑμῖν καὶ πράξεις ἀπὸ λογίων Ἐνὼχ τοῦ δικαίου, *ὅτι πορνεύ(σ)ετε¹ πορνείαν Σοδόμων καὶ ἀπολε(ῖ)σθε ἕως βραχύ. Καὶ πάλιν ἀνανεωθήσεσθε καὶ ἡ βασιλεία Κυρίου οὐκ ἔσται ἐν ὑμῖν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009/001.yaml
  text: And I tell you also, from the words of Enoch the righteous, that you will commit the fornication of Sodom, and you will perish for a little while. Then you will be renewed again, and the kingdom of the Lord will not be among you.
translation:
  language: de
  text: 'Ich sage euch auch Taten aus den Aussprüchen Henochs, des Gerechten: Ihr werdet die Unzucht Sodoms treiben und für kurze Zeit zugrunde gehen. Dann werdet ihr wieder erneuert werden, und das Reich des Herrn wird nicht unter euch sein.¹'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πράξεις ἀπὸ λογίων
  choice: aufgrund der Aussprüche
  rationale: Die griechische Wendung ist ungewöhnlich; gemeint sind offenbar Geschehnisse bzw. Taten, die aus Henochs überlieferten Aussprüchen angekündigt werden. Im Deutschen gibt „aufgrund der Aussprüche“ die Berufung auf diese Quelle natürlich wieder, ohne den Sinn unnötig festzulegen.
- source_word: πορνεύ(σ)ετε πορνείαν Σοδόμων
  choice: ihr werdet die Unzucht Sodoms treiben
  rationale: Die Verbindung aus Verb und gleichstämmigem Substantiv ist emphatisch. „Unzucht Sodoms“ wahrt die bewusst wertende, aber hinsichtlich der konkreten Handlungen nicht näher erklärte Formulierung.
- source_word: ἀπολε(ῖ)σθε
  choice: zugrunde gehen
  rationale: Die mediale Form bezeichnet Verderben bzw. Untergang. „Zugrunde gehen“ erhält die Aussage, ohne voreilig zwischen Tod, Vernichtung oder politischem Untergang zu entscheiden.
- source_word: ἕως βραχύ
  choice: für kurze Zeit
  rationale: Die knappe Zeitangabe wird idiomatisch wiedergegeben und im Zusammenhang auf den zeitweiligen Untergang bezogen.
- source_word: ἀνανεωθήσεσθε
  choice: ihr werdet wieder erneuert werden
  rationale: Das Passiv und der Gedanke einer erneuten Erneuerung bzw. Wiederherstellung bleiben erhalten; der Handelnde wird wie im Griechischen nicht ausdrücklich genannt.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Bei βασιλεία bezeichnet die Präposition hier am natürlichsten die Gegenwart oder Wirksamkeit inmitten der angesprochenen Gemeinschaft; „unter euch“ bewahrt zugleich eine gewisse räumlich-soziale Offenheit.
theological_decisions:
- issue: Bedeutung der „Unzucht Sodoms“
  choice: Die traditionelle, allgemein gehaltene Wendung bleibt stehen.
  alternative: Eine konkrete sexuelle Handlung oder umfassender soziale Verderbtheit ausdrücklich benennen.
  rationale: Der griechische Text erläutert die Wendung nicht. Eine Konkretisierung würde eine umstrittene Auslegung in die Übersetzung eintragen.
- issue: Verhältnis von Erneuerung und fehlendem Reich des Herrn
  choice: Beide Aussagen werden mit „doch“ spannungsvoll nebeneinandergestellt.
  alternative: Die Erneuerung als vollständige geistliche Wiederherstellung deuten oder den letzten Satz zeitlich anders zuordnen.
  rationale: Der Text kündigt Erneuerung an und verneint dennoch die Gegenwart des Reiches unter ihnen. Diese theologische Spannung soll nicht aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der prophetische Ton bleibt knapp und direkt. „Unzucht“ ist bewusst bibelsprachlich, aber weiterhin allgemein verständlich; „treiben“ bildet die emphatische griechische Konstruktion natürlich ab.
