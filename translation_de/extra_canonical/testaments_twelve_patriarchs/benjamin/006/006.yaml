  text: Οὐκ ἔχει *ὅρασιν οὔτε ἀκοὴν³⁶ διπλῆν· *πᾶν γὰρ ὃ³⁷ ποιεῖ, Γἢ³⁸ λαλεῖ, *ἢ ὁρᾷ³⁸, οἶδεν ὅτι³⁹ Κύριος ἐπισκέπτει⁴⁰ τὴν⁴¹ ψυχὴν αὐτοῦ. Καὶ καθαίρει τὴν διάνοιαν αὐτοῦ πρὸς⁴² τὸ μὴ καταγνωσθῆναι ὑπὸ *τῶν ἀνθρώπων, ὁμοίως καὶ ὑπὸ Θεοῦ. Ὁμοίως δὲ καὶ τοῦ Βελίαρ τὰ ἔργα διπλᾶ ἐστιν, καὶ ἀπλότητα ἐν αὐτοῖς οὐκ ἔχουσιν⁴³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/006.yaml
  text: It has neither double sight nor double hearing; for in everything it does, or speaks, or sees, it knows that the Lord watches over his soul. And he cleanses his mind so as not to be condemned by men, likewise also by God. And in the same way the works of Beliar are twofold, and they have no singleness in them.
translation:
  language: de
  text: Es hat weder einen doppelten Blick noch ein doppeltes Gehör. Denn bei allem, was es tut oder sagt oder sieht, weiß es, dass der Herr auf seine Seele achtet.[a] Und es reinigt sein Denken, damit es weder von den Menschen noch von Gott verurteilt wird. Ebenso sind auch die Werke Beliars zwiespältig, und es ist keine Lauterkeit in ihnen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann auch bedeuten, dass der Herr die Seele aufsucht oder prüfend auf sie sieht.
    reason: Bewahrt die Bedeutungsbreite von ἐπισκέπτει, ohne die Hauptübersetzung auf das forensische „prüft“ zu verengen.
  - marker: b
    text: 'Wörtlich: „keine Einfachheit“; gemeint ist das Gegenteil von Doppelheit oder Zwiespältigkeit, also ungeteilte Aufrichtigkeit.'
    reason: Erklärt die ethische Bedeutung von ἀπλότης und den Kontrast zu διπλᾶ.
lexical_decisions:
- source_word: ὅρασιν ... ἀκοὴν διπλῆν
  choice: einen doppelten Blick ... ein doppeltes Gehör
  rationale: Bewahrt das Bild des griechischen Textes und bezeichnet eine zwiespältige, unaufrichtige Wahrnehmung, ohne diese Deutung vollständig in den Haupttext einzutragen.
- source_word: ἐπισκέπτει
  choice: prüft
  rationale: Im Zusammenhang mit Reinigung und Verurteilung ist die Bedeutung des prüfenden Hinsehens besonders naheliegend; das Verb kann zugleich fürsorgliches Aufsuchen oder Achten bezeichnen.
- source_word: διάνοιαν
  choice: Denken
  rationale: Gibt das innere Denk- und Sinnesvermögen in natürlichem modernem Deutsch wieder.
- source_word: διπλᾶ
  choice: zwiespältig
  rationale: Vermittelt hier die moralische Doppelheit der Werke natürlicher als das wörtliche „doppelt“.
- source_word: ἀπλότητα
  choice: Lauterkeit
  rationale: Bringt im Gegensatz zur Doppelheit die gemeinte ungeteilte Aufrichtigkeit zum Ausdruck, ohne das heute missverständliche „Einfalt“ zu verwenden.
theological_decisions:
- issue: Art des göttlichen ἐπισκέπτεσθαι
  choice: Der Herr „prüft“ die Seele.
  alternative: Der Herr „wacht über“ oder „sucht“ die Seele auf.
  rationale: Der unmittelbare Zusammenhang spricht von innerer Reinigung und davon, nicht verurteilt zu werden. Die weitere Bedeutungsbreite wird in einer Fußnote offengehalten.
- issue: Verurteilung durch Menschen und Gott
  choice: Beide werden parallel und ohne Abschwächung wiedergegeben.
  alternative: Die menschliche Beurteilung als bloßen Ruf und Gottes Urteil als eigentliches Gericht unterscheiden.
  rationale: Der griechische Text stellt beides ausdrücklich nebeneinander; eine theologische Hierarchisierung wäre eine Auslegung über den Wortlaut hinaus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das wiederholte neutrale „es“ bewahrt das im vorgelegten Vers nicht ausdrücklich genannte Bezugswort, statt eigenmächtig „der Mensch“ oder eine bestimmte innere Haltung einzusetzen. Kurze Satzglieder halten den Gegensatz zwischen ungeteilter Lauterkeit und den zwiespältigen Werken Beliars klar.
