  to: Es hat weder einen doppelten Blick noch ein doppeltes Gehör. Denn bei allem, was es tut oder sagt oder sieht, weiß es, dass der Herr auf seine Seele achtet.[a] Und es reinigt sein Denken, damit es weder von den Menschen noch von Gott verurteilt wird. Ebenso sind auch die Werke Beliars zwiespältig, und es ist keine Lauterkeit in ihnen.[b]
