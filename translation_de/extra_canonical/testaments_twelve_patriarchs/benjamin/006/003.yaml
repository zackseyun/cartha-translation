base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/003.yaml
  text: He does not delight in pleasure, [does not grieve his neighbor, does not fill himself with luxury, does not go astray by the wanderings of the eyes]. For the Lord is his portion.
translation:
  language: de
  text: Er findet keinen Gefallen an Vergnügen; [er betrübt seinen Nächsten nicht, sättigt sich nicht an Luxus und lässt sich nicht durch das Umherschweifen der Augen in die Irre führen][a]. Denn der Herr ist sein Anteil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der in eckigen Klammern stehende Abschnitt ist textkritisch unsicher.
    reason: Die zugrunde liegende Edition kennzeichnet die gesamte Klauselfolge durch eckige Klammern als unsicheren beziehungsweise sekundär bezeugten Text.
lexical_decisions:
- source_word: τέρπεται ἐν ἡδονῇ
  choice: hat keine Freude am Vergnügen
  rationale: Gibt die Verbindung aus τέρπομαι („sich freuen, Gefallen haben“) und ἡδονή („Vergnügen, Lust“) natürlich wieder, ohne das Vergnügen an sich näher moralisch zu bestimmen.
- source_word: λυπεῖ τὸν πλησίον
  choice: betrübt seinen Nächsten
  rationale: Bewahrt sowohl die emotionale Bedeutung von λυπέω als auch den traditionellen, würdevollen Ausdruck „den Nächsten“.
- source_word: ἐμπίπλαται τρυφῇ
  choice: schwelgt im Luxus
  rationale: ἐμπίπλημι bezeichnet ein Sich-Anfüllen oder Sättigen; zusammen mit τρυφή ist „im Luxus schwelgen“ im Deutschen idiomatisch und vermittelt üppigen Genuss.
- source_word: πλανᾶται μετεωρισμοῖς ὀφθαλμῶν
  choice: lässt sich durch das Umherschweifen der Augen in die Irre führen
  rationale: Bewahrt das Passiv von πλανάω und die ungewöhnliche Bildsprache des griechischen Ausdrucks, ohne dessen möglichen Sinn vorschnell auf Begierde oder Ablenkung festzulegen.
- source_word: Κύριος ... ἡ μερὶς αὐτοῦ
  choice: der Herr ist sein Anteil
  rationale: „Anteil“ erhält die biblische Erbteil- und Zugehörigkeitsmetaphorik von μερίς.
theological_decisions:
- issue: Bedeutung des Umherschweifens der Augen
  choice: Bildhafte, offene Wiedergabe ohne ausdrückliche Gleichsetzung mit sexueller Begierde
  alternative: „lässt sich nicht von begehrlichen Blicken verführen“
  rationale: Der griechische Wortlaut bezeichnet Bewegungen beziehungsweise ein Schweifen der Augen, legt aber die genaue Art der Versuchung nicht eindeutig fest.
- issue: Der Herr als μερίς
  choice: „Anteil“
  alternative: „Erbteil“
  rationale: „Anteil“ gibt den Ausdruck direkt wieder und lässt offen, ob vor allem Versorgung, Erbe, Zugehörigkeit oder Lebensausrichtung gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Verneinungen wurden flüssig verbunden; die eckigen Klammern des Quelltextes bleiben sichtbar und werden durch eine textkritische Fußnote erläutert.
