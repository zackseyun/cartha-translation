id: T12P.BEN.6.5
reference: Testament of Benjamin 6:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ἡ ἀγαθὴ διάνοια²⁸ οὐκ ἔχει δύο γλώσσας²⁹ εὐλογίας καὶ κατάρας³⁰, ὕβρεως καὶ ⌈τιμῆς⌉³¹, ἡσυχίας καὶ ταραχῆς, ὑποκρίσεως καὶ ἀληθείας, [πενίας καὶ πλούτου]³², ἀλλὰ *μίαν ἔχει περὶ πάντας³³ εἰλικρινῆ³⁴ καὶ³⁵ καθαρὰν ⌈διάθεσιν⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/005.yaml
  text: The good mind does not have two tongues, of blessing and cursing, of insult and honor, of quietness and disturbance, of hypocrisy and truth, [of poverty and wealth], but rather has one sincere and pure disposition toward all.
translation:
  language: de
  text: 'Die gute Gesinnung spricht nicht mit zweierlei Zunge: mit Segen und Fluch, mit Schmähung und Ehre, mit Ruhe und Unruhe, mit Heuchelei und Wahrheit, [mit Armut und Reichtum]; vielmehr hat sie allen gegenüber eine aufrichtige und reine Haltung.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἀγαθὴ διάνοια
  choice: die gute Gesinnung
  rationale: διάνοια bezeichnet hier die innere Denk- und Willenshaltung; „Gesinnung“ passt zudem zur abschließenden διάθεσις, ohne den Ausdruck auf bloßen Verstand zu verengen.
- source_word: οὐκ ἔχει δύο γλώσσας
  choice: spricht nicht mit zweierlei Zunge
  rationale: Die wörtliche Metapher „hat nicht zwei Zungen“ wird in natürliches, zugleich bildhaftes Deutsch übertragen und bezeichnet widersprüchliches beziehungsweise doppelzüngiges Reden.
- source_word: ὕβρεως
  choice: Schmähung
  rationale: Im Gegensatz zu τιμή meint ὕβρις hier entehrende, verletzende Rede oder Behandlung; „Schmähung“ erhält diesen Kontrast.
- source_word: ἡσυχίας καὶ ταραχῆς
  choice: Ruhe und Unruhe
  rationale: Die Gegensatzpaarung wird knapp und ohne zusätzliche Deutung wiedergegeben.
- source_word: εἰλικρινῆ καὶ καθαρὰν διάθεσιν
  choice: eine aufrichtige und reine Haltung
  rationale: διάθεσις bezeichnet die innere Haltung oder Einstellung; εἰλικρινής und καθαρός werden mit ihren unterschiedlichen Nuancen bewahrt.
- source_word: περὶ πάντας
  choice: allen gegenüber
  rationale: Gibt die relationale Bedeutung der Präposition in idiomatischem Deutsch wieder.
theological_decisions:
- issue: Bezug der beiden Zungen und der folgenden Gegensatzpaare
  choice: Die Paare werden als Arten widersprüchlichen Redens an die Zungenmetapher angeschlossen.
  alternative: Die Paare könnten allgemein als gegensätzliche innere Zustände der Gesinnung verstanden werden.
  rationale: Die unmittelbare Verbindung mit γλώσσας legt den Redebezug nahe; die Schlussaussage über die eine Haltung erweitert den Gedanken dennoch auf die innere Disposition.
- issue: Textkritisch markiertes Gegensatzpaar πενίας καὶ πλούτου
  choice: '[mit Armut und Reichtum]'
  alternative: Auslassung des Paares ohne Kennzeichnung
  rationale: Die eckigen Klammern der Ausgangsedition werden beibehalten, damit die Unsicherheit des Textbestands sichtbar bleibt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Zungenmetapher bleibt erhalten, wird aber durch „spricht mit zweierlei Zunge“ idiomatisch formuliert. Die parallele Reihung der Gegensatzpaare und die textkritischen Klammern werden bewahrt.
