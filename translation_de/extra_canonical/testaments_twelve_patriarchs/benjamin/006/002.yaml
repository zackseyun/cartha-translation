  text: '[Καὶ]³ οὐχ ὁρᾷ⁴ ἐμπαθῶς]⁵ *τὰ φθαρτά⁶, οὐδὲ⁷ συνάγει⁸ πλοῦτον ⌈εἰς φιληδονίαν⌉⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/002.yaml
  text: He does not look upon perishable things with passion, nor does he gather wealth for pleasure.
translation:
  language: de
  text: Er betrachtet vergängliche Dinge nicht mit Begierde und sammelt auch keinen Reichtum zum Vergnügen an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμπαθῶς
  choice: leidenschaftlich begehrend
  rationale: Das Adverb bezeichnet hier keinen neutralen starken Affekt, sondern ein von Begierde bestimmtes Anschauen; die Formulierung macht diese negative Färbung im heutigen Deutsch deutlich.
- source_word: τὰ φθαρτά
  choice: vergängliche Dinge
  rationale: Die substantivierte Pluralform bezeichnet Dinge, die dem Verfall beziehungsweise der Vergänglichkeit unterliegen.
- source_word: συνάγει πλοῦτον
  choice: häuft Reichtum an
  rationale: συνάγει bezeichnet das Zusammentragen oder Ansammeln; „Reichtum anhäufen“ ist dafür eine natürliche und präzise deutsche Wendung.
- source_word: εἰς φιληδονίαν
  choice: zum Vergnügen
  rationale: Die Wendung nennt den Zweck des Ansammelns. „Zum Vergnügen“ bewahrt die knappe Aussage, ohne eine speziellere moraltheologische Deutung einzutragen.
theological_decisions:
- issue: Moralische Wertung von ἐμπαθῶς
  choice: „leidenschaftlich begehrend“ als negativ gefärbte Haltung
  alternative: „mit Leidenschaft“
  rationale: Im Kontext ethischer Unterweisung geht es um begehrliches Hängen an Vergänglichem; die Übersetzung vermeidet zugleich eine konfessionell spezifische Auslegung.
- issue: Bedeutungsumfang von φιληδονία
  choice: „Vergnügen“
  alternative: „Genusssucht“ oder „Lustliebe“
  rationale: Die schärferen Alternativen würden den Grad des Lasters stärker festlegen, als es die knappe griechische Zweckangabe zwingend verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Verneinung beider Aussagen bleibt erhalten; „auch keinen“ gibt οὐδέ idiomatisch wieder.
