  to: Er betrachtet vergängliche Dinge nicht mit Begierde und sammelt auch keinen Reichtum zum Vergnügen an.
  rationale: Die Revision glättet die deutsche Syntax und hält die knappe, parallele griechische Aussage bei. „Mit Begierde“ gibt ἐμπαθῶς in seinem negativen ethischen Kontext wieder, ohne dessen Nuance übermäßig zu spezifizieren. „Sammelt ... an“ entspricht συνάγει genauer als das etwas intensivere „häuft ... an“. Die im griechischen Editionsapparat angezeigten textkritischen Markierungen erfordern hier keine Übersetzungsfußnote, da die gewählte deutsche Formulierung keine dieser Varianten inhaltlich auswertet.
