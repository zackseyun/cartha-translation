source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: VI. Τὸ διαβούλιον τοῦ ἀγαθοῦ ἀνδρὸς οὐκ ἔστιν ἐν χειρὶ πλάνης¹ πνεύματος² Βελίαρ· ὁ γὰρ ἄγγελος τῆς εἰρήνης ὁδηγεῖ τὴν ψυχὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/001.yaml
  text: The purpose of a good man is not in the hand of the spirit of Beliar's error, for the angel of peace guides his soul.
translation:
  language: de
  text: 6 Der Entschluss eines guten Menschen ist nicht in der Hand des Geistes der Verirrung Beliars; denn der Engel des Friedens führt seine Seele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαβούλιον
  choice: Entschluss
  rationale: Bezeichnet hier die innere Absicht beziehungsweise den gefassten Vorsatz; „Entschluss“ ist im Deutschen natürlich und bewahrt den willensbezogenen Sinn.
- source_word: ἀγαθοῦ ἀνδρός
  choice: eines guten Menschen
  rationale: Das griechische ἀνήρ kann „Mann“ bedeuten, bezeichnet in allgemeinen ethischen Aussagen aber auch einen Menschen; die inklusive Wiedergabe passt zum sentenzartigen Zusammenhang.
- source_word: πλάνης πνεύματος Βελίαρ
  choice: des Irrgeistes Beliars
  rationale: Die kompakte Wiedergabe erhält sowohl πλάνη (Irrtum, Irreführung, Verirrung) als auch πνεῦμα und ordnet den Geist Beliar zu, ohne eine übermäßig schwerfällige Genitivkette zu bilden.
- source_word: ἄγγελος τῆς εἰρήνης
  choice: Engel des Friedens
  rationale: Formale und im Deutschen geläufige Wiedergabe der Genitivverbindung.
- source_word: ὁδηγεῖ
  choice: führt
  rationale: Gibt das fortdauernde Leiten der Seele schlicht und idiomatisch wieder.
theological_decisions:
- issue: Verhältnis Beliars zum „Geist der Verirrung“
  choice: „Irrgeist Beliars“ versteht Beliar als denjenigen, dem dieser Geist zugeordnet ist.
  alternative: „Geist der Verirrung, Beliar“ könnte Beliar selbst appositiv mit dem Geist identifizieren.
  rationale: Die griechische Genitivfolge lässt das genaue Verhältnis knapp; die gewählte Form bewahrt die Zuordnung, ohne eine ausdrückliche Identitätsaussage einzuführen.
- issue: Handlungsmacht über den Entschluss
  choice: Die Metapher „in der Hand“ bleibt erhalten.
  alternative: Eine dynamische Wiedergabe wie „steht nicht unter der Macht“ wäre verständlicher, aber weniger bildhaft.
  rationale: Die wörtliche Metapher ist auch im modernen Deutschen verständlich und bewahrt die Aussage über Macht beziehungsweise Verfügungsgewalt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. Das Semikolon bildet den begründenden Anschluss von γάρ ab und erhält den sentenzartigen Ton.
