  terminology: „Entschluss“, „Engel des Friedens“ und „führt seine Seele“ sind angemessen. „Geist der Verirrung Beliars“ wahrt sowohl πλάνη als auch πνεῦμα als eigenständige Begriffe und vermeidet die zusätzliche begriffliche Prägung von „Irrgeist“. Der Name Beliar ist korrekt wiedergegeben.
