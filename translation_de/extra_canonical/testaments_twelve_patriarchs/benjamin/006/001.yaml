  source_fidelity: 'Die Grundstruktur wird zutreffend wiedergegeben: διαβούλιον als innere Absicht/Entschluss, die Metapher „in der Hand“, der begründende Anschluss mit γάρ und das Führen der Seele durch den Engel des Friedens. „Irrgeist Beliars“ glättet jedoch die griechische Genitivfolge πλάνης πνεύματος Βελίαρ zu stark und legt die genaue Beziehung zwischen Verirrung, Geist und Beliar enger fest als der knappe, syntaktisch schwierige Wortlaut verlangt.'
