revisions:
- from: Ein guter Vorsatz nimmt weder Ruhm noch Verachtung von Menschen an und kennt weder Täuschung noch Lüge, weder Streit noch Beschimpfung. Denn der Herr wohnt in ihm und erleuchtet seine Seele, und er freut sich jederzeit über alle.[a]
  to: Ein guter Vorsatz nimmt weder Ehre noch Unehre von Menschen an und kennt weder Täuschung noch Lüge, weder Streit noch Beschimpfung. Denn der Herr wohnt in ihm, erleuchtet seine Seele und freut sich allen gegenüber zu jeder Zeit.
  rationale: Die unzutreffende Fußnote wird entfernt, weil sie eine grammatische Unentschiedenheit behauptet, die der griechische Satzbau nicht nahelegt. Die Schlusswendung wird mit „allen gegenüber“ richtungsgetreu wiedergegeben. Außerdem wird das Gegensatzpaar δόξα/ἀτιμία mit „Ehre/Unehre“ präzisiert, ohne den Sinn zu verändern.
