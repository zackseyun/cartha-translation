base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/006/004.yaml
  text: A good purpose does not accept glory or dishonor from people, and it knows no deceit or falsehood or strife or reviling. For the Lord dwells in him, and he lights up his soul, and he rejoices toward all at every time.
translation:
  language: de
  text: Ein guter Vorsatz nimmt weder Ehre noch Unehre von Menschen an und kennt weder Täuschung noch Lüge, weder Streit noch Beschimpfung. Denn der Herr wohnt in ihm, erleuchtet seine Seele und freut sich allen gegenüber zu jeder Zeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸ ἀγαθὸν διαβούλιον
  choice: Ein guter Vorsatz
  rationale: διαβούλιον bezeichnet hier eine innere Absicht oder einen festen Entschluss. „Vorsatz“ ist im Deutschen verständlich und bewahrt den ethischen Schwerpunkt des Ausdrucks.
- source_word: δόξης … ἀτιμίας
  choice: Ruhm … Verachtung
  rationale: Das Gegensatzpaar wird möglichst direkt wiedergegeben. „Verachtung“ erfasst ἀτιμία hier natürlicher als das im Deutschen stärker institutionell klingende „Unehre“.
- source_word: πάντα δόλον
  choice: Täuschung
  rationale: Im Zusammenhang mit Lüge, Streit und Beschimpfung bezeichnet δόλος arglistige Täuschung; die deutsche Reihung mit wiederholtem „weder … noch“ gibt die umfassende Verneinung idiomatisch wieder.
- source_word: φωτίζει
  choice: erleuchtet
  rationale: Das Verb wird aktiv und mit seinem geistig-seelischen Bildgehalt wiedergegeben, ohne es erklärend abzuschwächen.
- source_word: χαίρει πρὸς πάντας ἐν παντὶ καιρῷ
  choice: er freut sich jederzeit über alle
  rationale: Die Wiedergabe hält sowohl die Bedeutung von χαίρει als auch den Bezug auf alle Menschen und die uneingeschränkte Zeitangabe fest.
theological_decisions:
- issue: Bezugswort des letzten „er“
  choice: Die deutsche Übersetzung lässt „er“ ebenso wie der griechische Satz formal mehrdeutig.
  alternative: Ausdrücklich „der Mensch mit dem guten Vorsatz freut sich“ oder „der Herr freut sich“ schreiben.
  rationale: Nach „der Herr wohnt in ihm und erleuchtet seine Seele“ kann das Subjekt von χαίρει grammatisch als der Herr fortgeführt oder inhaltlich auf den Menschen bezogen werden. Eine ausdrückliche Festlegung würde die im Text vorhandene Spannung beseitigen.
- issue: Personaler Bezug trotz des sächlichen διαβούλιον
  choice: „in ihm“ und „seine Seele“ beziehen sich auf den Menschen, der den guten Vorsatz hat.
  alternative: Den Vorsatz selbst als unmittelbares Bezugswort behandeln.
  rationale: Eine Seele wird dem Menschen, nicht dem Vorsatz, zugeschrieben. Der griechische Text wechselt damit von der Eigenschaft zu ihrem Träger, ohne ihn eigens zu benennen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die paarweise Reihung „weder … noch“ macht die umfassende Verneinung natürlich lesbar; die abschließende Mehrdeutigkeit wird bewusst bewahrt und in einer knappen Fußnote kenntlich gemacht.
