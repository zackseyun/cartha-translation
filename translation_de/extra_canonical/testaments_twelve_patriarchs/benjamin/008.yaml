    issue: Aktiv/Passiv bei οἰκοδομεῖ
    rationale: 'Der Entwurf übersetzt „wird ... aufgebaut“, doch οἰκοδομεῖ ist aktiv: Der reine Sinn „baut auf/erbaut“. Auch bei einer möglicherweise verderbten Stelle darf die überlieferte Diathese nicht ohne Kennzeichnung umgekehrt werden.'
  - severity: low
    issue: „das Gute“ für ἀγαθότης
    rationale: Die Wiedergabe ist möglich, doch „Güte“ entspricht dem abstrakten Tugendbegriff genauer und bildet mit „Liebe“ ein natürlicheres Paar.
  - severity: low
    issue: „Hass auf die eigenen Brüder“
    rationale: Die Umschreibung ist verständlich, aber „Bruderhass“ ist die natürliche prägnante deutsche Entsprechung von μισαδελφία und meint im Kontext nicht zwingend ausschließlich leibliche Brüder.
