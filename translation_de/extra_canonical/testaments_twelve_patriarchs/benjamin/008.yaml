revisions:
- from: '**Testament Benjamins 8**


    **1** Ihr aber, meine Kinder, flieht die Bosheit, den Neid und den Hass auf die eigenen Brüder, und haltet euch fest an das Gute und an die Liebe.


    **2** Denn ein reiner Sinn nimmt durch Mist und Schlamm keine Befleckung an, sondern kühlt vielmehr beides[a] und vertreibt den Gestank. Ebenso wird auch ein reiner Sinn, wenn er von den Befleckungen der Erde umgeben ist, vielmehr aufgebaut[b]; er selbst aber wird nicht befleckt.'
  to: '**Testament Benjamins 8**


    **1** Ihr aber, meine Kinder, flieht die Bosheit, den Neid und den Bruderhass und haltet euch fest an die Güte und die Liebe.


    **2** Denn ein reiner Sinn wird durch Mist und Schlamm nicht befleckt, sondern kühlt vielmehr beides[a] und vertreibt den Gestank. Ebenso baut ein reiner Sinn, der von den Befleckungen der Erde umgeben ist, vielmehr auf[b]; er selbst aber wird nicht befleckt.'
  rationale: Die notwendige Korrektur stellt die aktive Form von οἰκοδομεῖ wieder her. Die übrigen Anpassungen verbessern Präzision und modernes deutsches Sprachgefühl, ohne den Sinn zu erweitern. Die beiden schwierigen Bilder bleiben transparent in Text und Anmerkungen erhalten. Der englische Audit-Text wurde nicht herangezogen, da er nicht mit dem vorliegenden griechischen Text von Testament Benjamins 8,1–2 übereinstimmt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T04:15:00Z'
review_pass:
  verdict: revise
  source_fidelity: Vers 2 gibt οἰκοδομεῖ als Passiv („wird ... aufgebaut“) wieder, obwohl der überlieferte griechische Text ein Aktiv („baut auf/erbaut“) hat. Diese Richtungsumkehr muss korrigiert werden. Im Übrigen folgt der Entwurf dem griechischen Zweivers-Text; der mitgelieferte englische Audit-Text betrifft offensichtlich einen anderen Kapitelbestand und ist hierfür nicht maßgeblich.
  naturalness: Die Sprache ist überwiegend klar und würdig. „Bruderhass“ ist im Deutschen knapper und präziser als „Hass auf die eigenen Brüder“. „Güte“ gibt ἀγαθότης idiomatischer als die abstraktere Formulierung „das Gute“ wieder. Die Bildsprache von Vers 2 bleibt absichtlich sperrig, weil die griechische Überlieferung dies verlangt.
  terminology: „Reiner Sinn“, „Befleckung“ und „Liebe“ sind für νοῦς, μιασμός/μιαίνω und ἀγάπη angemessen. „Mist und Schlamm“ bewahrt die konkreten Bilder von κόπρος und βόρβορος. Die problematische Lesart οἰκοδομεῖ wird aktiv und mit einer erläuternden Fußnote wiedergegeben, ohne sie interpretativ zu glätten.
  issues:
