base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/008.yaml
  text: '1[a]. Therefore, if you also walk in holiness according to the Lord’s commands, you will dwell with me in safety, and all Israel will be gathered to the Lord.


    2. And I will no longer be called a ravening wolf because of your ravaging, but a worker of the Lord, distributing food to those who do what is good.


    3. And there will arise in the latter times one beloved of the Lord, from the tribe of Judah and Levi, who will accomplish the good pleasure of God with a new understanding for all the nations.


    4. His presence is in the mouth of all, and he will be chosen forever by the Lord, and through him the knowledge of the Lord will be given on the earth in portions of joy; and through him Israel will be enlightened.


    5. Then he will enter into the first temple, and there the Lord will be abused, and he will be lifted up upon a tree.


    6[b]. And the veil of the temple will be torn, and the Spirit of God will pass on to the nations like fire poured out.


    7. And he will ascend from Hades and will pass from earth into heaven.


    8. And I know how lowly he will be on earth, and how glorious in heaven.


    9. Now when Joseph was in Egypt, I longed to see his figure and appearance; and through the prayers of Jacob my father I saw him, while awake, that a spotless and holy virgin was giving birth to a lamb,


    10. and on its left side there was as it were a lion; and all the beasts rushed against him, and the lamb overcame them and destroyed them, and trampled them underfoot.


    11. And because of him the angels and men rejoiced, and all the land.


    12. These things will happen in their proper times. Therefore, my children, when you see that all these things have happened in Israel, know that the kingdom of the Lord is near.


    13. Then flee from every lawless deed and from the works of Beliar, and cling to what is good and to the law of the Lord.


    14. And bury me near my fathers.


    15. And he finished his commands, and said, “I am going to sleep with my fathers.”


    16. And he stretched out his feet and died in a beautiful and good old age.


    17. And each of his sons did as he had commanded them, and they put him in a coffin and kept him in Egypt until the day of the exodus.


    18. And when the sons of Israel went up from Egypt, they carried up the bones of Benjamin also[c], and buried them in Hebron at the right side of Abraham and Isaac and Jacob.'
translation:
  language: de
  text: '**Testament Benjamins 8**


    **1** Ihr aber, meine Kinder, flieht die Bosheit, den Neid und den Bruderhass und haltet euch fest an die Güte und die Liebe.


    **2** Denn ein reiner Sinn wird durch Mist und Schlamm nicht befleckt, sondern kühlt vielmehr beides[a] und vertreibt den Gestank. Ebenso baut ein reiner Sinn, der von den Befleckungen der Erde umgeben ist, vielmehr auf[b]; er selbst aber wird nicht befleckt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text lautet wörtlich „kühlt vielmehr beides“. Das Bild ist an dieser Stelle ungewöhnlich; möglicherweise liegt eine beschädigte oder abweichend überlieferte Lesart vor.
    reason: textual_variant
  - marker: b
    text: Das überlieferte griechische Wort bedeutet aktiv „baut auf“ oder „erbaut“, ist im Zusammenhang jedoch unsicher und in der Ausgabe als verderbt gekennzeichnet. Andere sinngemäße Deutungen sind möglich.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπόδρατε
  choice: flieht
  rationale: Das Verb bezeichnet ein entschiedenes Entfliehen oder Sich-Entziehen und bewahrt so die Dringlichkeit der Mahnung.
- source_word: μισαδελφίαν
  choice: Hass auf die eigenen Brüder
  rationale: Die Umschreibung gibt die konkrete Bedeutung des Kompositums verständlich wieder, ohne sie zum allgemeineren „Menschenhass“ auszuweiten.
- source_word: προσκολλᾶσθε
  choice: haltet euch fest an
  rationale: Die Wendung bewahrt das Bild eines engen, beharrlichen Sich-Anschließens und klingt im Deutschen natürlicher als eine rein wörtliche Wiedergabe mit „ankleben“.
- source_word: ἀγαθότητι
  choice: das Gute
  rationale: Im Zusammenhang bezeichnet das Substantiv sittliche Güte beziehungsweise Gutsein; „das Gute“ ist klar und lässt den Gegensatz zur Bosheit hervortreten.
- source_word: καθαρὸς νοῦς
  choice: reiner Sinn
  rationale: „Sinn“ umfasst hier Denken und innere Haltung. Die Wiedergabe vermeidet die moderne Verengung von νοῦς auf bloßen Intellekt.
- source_word: μιασμός / μιαίνω
  choice: Befleckung / befleckt werden
  rationale: Die Wortfamilie wird im Deutschen erkennbar zusammengehalten und bewahrt sowohl die kultische als auch die sittliche Färbung.
- source_word: συνεχόμενος
  choice: umgeben ist
  rationale: Das Partizip kann ein Umschlossensein oder Bedrängtwerden ausdrücken; „umgeben“ passt zum Bild, ohne eine nicht ausdrücklich genannte Zwangslage zu überdeuten.
theological_decisions:
- issue: Reinheit des Sinnes inmitten irdischer Befleckung
  choice: Die Aussage wird als Bewahrung vor Befleckung wiedergegeben, nicht als Behauptung einer von Natur aus sündlosen Person.
  alternative: Den „reinen Sinn“ als absolute oder wesensmäßige Sündlosigkeit deuten.
  rationale: Der griechische Text formuliert eine ethische Bildrede über den reinen νοῦς und seine Umgebung; eine weitergehende anthropologische oder christologische Festlegung wäre nicht im Wortlaut begründet.
- issue: Verhältnis von Güte und Liebe zur Abkehr vom Bösen
  choice: 'Beide Seiten der Mahnung bleiben gleichrangig stehen: Flucht vor Bosheit sowie feste Bindung an das Gute und die Liebe.'
  alternative: Die Stelle vorrangig als kultische Reinheitsvorschrift oder als konfessionell bestimmte Heiligungslehre lesen.
  rationale: Der Text verbindet konkrete gemeinschaftsschädliche Laster mit positiven Tugenden und gibt keine Grundlage für eine engere dogmatische Festlegung.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer paränetischer Prägung. Die zwei im griechischen Ausgangstext erkennbar schwierigen Stellen werden nicht stillschweigend geglättet, sondern möglichst formal wiedergegeben und in Fußnoten transparent gemacht. Der bereitgestellte englische Beratungstext gehört offenbar zu einem anderen Kapitelbestand und wurde daher nicht als Übersetzungsgrundlage verwendet.
