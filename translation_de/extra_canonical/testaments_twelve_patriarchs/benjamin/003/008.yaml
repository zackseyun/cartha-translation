    issue: καταλύσει wird als „zur Vernichtung“ statt als finites Verb wiedergegeben.
    rationale: καταλύσει ist Futur Aktiv, dessen Subjekt weiterhin „der Sündlose“ ist. Die Nominalisierung macht aus der Aussage „und er wird Beliar und seine Diener vernichten“ eine bloße Zweckbestimmung und verändert damit Syntax und Aussageprofil.
