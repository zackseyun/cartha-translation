id: T12P.BEN.3.8
reference: Testament of Benjamin 3:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Πληρωθήσεται⁴⁵ *περὶ σοῦ⁴⁶ προφητεία οὐράνιος⁴⁷ [περὶ⁴⁸ τοῦ ἀμνοῦ τοῦ Θεοῦ καὶ σωτῆρος τοῦ κόσμου], ὅτι ἄμωμος ὑπὸ⁴⁹ ἀνόμων παραδοθήσεται καὶ ὁ⁵⁰ ἀναμάρτητος ὑπὲρ ἀσεβῶν ἀποθανεῖται [ἐν αἵματι διαθήκης ἐπὶ σωτηρίᾳ ἐθνῶν καὶ τοῦ⁵¹ Ἰσραὴλ καὶ καταλύσει⁵² *Βελίαρ καὶ τοὺς ὑπηρέτας αὐτοῦ⁵³].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/008.yaml
  text: “The heavenly prophecy concerning you will be fulfilled, [concerning the lamb of God and savior of the world,] for the blameless one will be handed over by lawless men, and the sinless one will die for the ungodly [in the blood of the covenant, for the salvation of the nations and of Israel, and for the destruction of Beliar and his servants].”
translation:
  language: de
  text: 'Die himmlische Prophezeiung über dich wird sich erfüllen – [über das Lamm Gottes und den Retter der Welt]: Der Schuldlose wird von Gesetzlosen ausgeliefert werden, und der Sündlose wird für Gottlose sterben, [im Blut des Bundes, zur Rettung der Völker und Israels, und er wird Beliar und seine Diener vernichten].'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πληρωθήσεται
  choice: wird sich erfüllen
  rationale: Gibt das zukünftige Passiv idiomatisch und im prophetischen Sinn wieder.
- source_word: οὐράνιος
  choice: himmlische
  rationale: Direkte Wiedergabe des Adjektivs ohne Deutung, ob Ursprung oder Charakter der Prophezeiung gemeint ist.
- source_word: ἀμνοῦ τοῦ Θεοῦ
  choice: Lamm Gottes
  rationale: Bewahrt die etablierte, wörtliche religiöse Wendung.
- source_word: σωτῆρος τοῦ κόσμου
  choice: Retter der Welt
  rationale: Modern und verständlich; bezeichnet die rettende Person, ohne zusätzliche dogmatische Präzisierung.
- source_word: ἄμωμος
  choice: der Schuldlose
  rationale: Vermittelt hier die Aussage persönlicher Unschuld und unterscheidet sie sprachlich von ἀναμάρτητος.
- source_word: ἀνόμων
  choice: Gesetzlosen
  rationale: Bewahrt den Bezug auf Gesetzlosigkeit statt das Wort allgemein mit „Bösen“ wiederzugeben.
- source_word: παραδοθήσεται
  choice: wird … ausgeliefert werden
  rationale: Erfasst das Passiv und die Bedeutung der Übergabe in feindliche Gewalt.
- source_word: ἀναμάρτητος
  choice: der Sündlose
  rationale: Gibt die ausdrückliche Abwesenheit von Sünde prägnant wieder.
- source_word: ὑπὲρ ἀσεβῶν
  choice: für Gottlose
  rationale: „Für“ lässt die mögliche stellvertretende bzw. zugunsten erfolgende Bedeutung bestehen, ohne sie weiter auszulegen.
- source_word: ἐν αἵματι διαθήκης
  choice: im Blut des Bundes
  rationale: Formale Wiedergabe der mehrdeutigen Präpositionalfügung und der biblisch geprägten Bundesformel.
- source_word: ἐπὶ σωτηρίᾳ
  choice: zur Rettung
  rationale: Drückt Ziel oder Ergebnis natürlich aus.
- source_word: ἐθνῶν
  choice: der Völker
  rationale: Im Gegenüber zu Israel ist die kollektive Bedeutung „Völker“ am transparentesten.
- source_word: καταλύσει
  choice: Vernichtung
  rationale: Passt zum Objekt Beliar und seinen Dienern und gibt die Aufhebung ihrer Macht kräftig wieder.
- source_word: Βελίαρ
  choice: Beliars
  rationale: Bewahrt die Namensform der griechischen Vorlage.
- source_word: ὑπηρέτας
  choice: Diener
  rationale: Natürliche und genaue Bezeichnung für Personen, die Beliar dienen.
theological_decisions:
- issue: Bezug von περὶ σοῦ und der eingeschobenen Lamm-Gottes-Formulierung
  choice: „über dich … [über das Lamm Gottes …]“
  alternative: „an dir wird sich … erfüllen“ oder beide Bezüge zu einer einzigen Identifikation verschmelzen
  rationale: Die Übersetzung bewahrt beide griechischen περὶ-Fügungen und lässt ihr genaues Verhältnis offen.
- issue: Bedeutung von ὑπὲρ beim Tod des Sündlosen
  choice: „für Gottlose sterben“
  alternative: „anstelle von Gottlosen sterben“
  rationale: „Für“ erhält die theologische Spannweite zwischen zugunsten erfolgendem und stellvertretendem Tod.
- issue: Funktion von ἐν αἵματι διαθήκης
  choice: „im Blut des Bundes“
  alternative: „durch das Blut des Bundes“
  rationale: Die formale Präposition wird beibehalten, damit Instrument, Sphäre oder Bundesbezug nicht vorschnell festgelegt werden.
- issue: Textkritisch markierte Passagen in eckigen Klammern
  choice: Eckige Klammern im Haupttext beibehalten
  alternative: Klammern entfernen oder den Text in eine Fußnote auslagern
  rationale: Die Vorlage kennzeichnet diese Abschnitte als textkritisch unsicher bzw. sekundär; die sichtbaren Klammern bewahren diesen Befund ohne unbelegte Detailerklärung.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer prophetischer Satzführung. Die eckigen Klammern der Quellenausgabe bleiben erhalten; da keine Fußnoten gesetzt werden, sind keine Fußnotenmarker erforderlich.
