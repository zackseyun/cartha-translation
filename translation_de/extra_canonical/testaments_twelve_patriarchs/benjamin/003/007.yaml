  text: Καὶ *οὕτως ἐβόα Ἰακώβ³⁷· *ὦ τέκνον χρηστόν³⁸, ἐνίκησας³⁹ τὰ σπλάγχνα⁴⁰ Ἰακὼβ τοῦ πατρός σου· καὶ περιλαβὼν⁴¹ αὐτὸν⁴² ἐπὶ⁴³ δύο⁴⁴ ὥρας κατεφίλει, λέγων·
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/007.yaml
  text: And thus Jacob cried out, “O good child, you have stirred the inward affection of Jacob your father”; and embracing him, he kept kissing him for two hours, saying,
translation:
  language: de
  text: 'Und so rief Jakob: „O du gutes Kind, du hast das Herz Jakobs, deines Vaters, gewonnen!“ Dann schloss er ihn in die Arme und küsste ihn zwei Stunden lang immer wieder, wobei er sagte:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὕτως ἐβόα
  choice: Und so rief
  rationale: Gibt die einleitende Artangabe und das laute, emotionale Rufen natürlich und prägnant wieder.
- source_word: τέκνον χρηστόν
  choice: du gutes Kind
  rationale: χρηστός bezeichnet hier Güte beziehungsweise Vortrefflichkeit; die Anrede mit „du“ klingt im modernen Deutschen emotional und natürlich.
- source_word: ἐνίκησας τὰ σπλάγχνα
  choice: du hast das Herz … überwunden
  rationale: Das wörtliche Bild der Eingeweide bezeichnet den Sitz tiefster Zuneigung. „Herz“ vermittelt dieses Bild verständlich, während „überwunden“ die ungewöhnliche und möglicherweise bewusst spannungsvolle Semantik von νικάω bewahrt.
- source_word: περιλαβών
  choice: schloss er ihn in die Arme
  rationale: Natürliche deutsche Wiedergabe des umschließenden Umarmens.
- source_word: κατεφίλει
  choice: küsste ihn … immer wieder
  rationale: Das Imperfekt und das intensivierende Verb drücken eine fortgesetzte beziehungsweise wiederholte Handlung aus.
- source_word: ἐπὶ δύο ὥρας
  choice: zwei Stunden lang
  rationale: Idiomatiche deutsche Dauerangabe ohne Abschwächung der konkreten Zeitspanne.
- source_word: λέγων
  choice: wobei er sagte
  rationale: Bewahrt den Anschluss an die folgende Rede und zeigt, dass das Sagen die fortdauernde Handlung begleitet.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das anthropologische Bild τὰ σπλάγχνα wird verständlich als „Herz“ wiedergegeben; die auffällige Aussage des Überwindens bleibt erhalten. Keine Fußnoten erforderlich.
