    issue: Missverständliche Wiedergabe von ἐνίκησας τὰ σπλάγχνα
    rationale: „Das Herz überwinden“ ist im modernen Deutschen keine natürliche Wendung für das Gewinnen von Zuneigung und kann eine feindliche Überwindung nahelegen. „Das Herz Jakobs, deines Vaters, gewonnen“ vermittelt die gemeinte Wirkung auf seine innerste Zuneigung klar und bleibt dem Bildfeld des Ausgangstextes nahe.
