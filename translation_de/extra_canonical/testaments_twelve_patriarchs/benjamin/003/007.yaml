  source_fidelity: 'Die Wiedergabe trifft den Handlungsablauf und die Dauerangabe gut. Bei ἐνίκησας τὰ σπλάγχνα ist jedoch „das Herz … überwunden“ im Deutschen missverständlich: Es kann nahelegen, Benjamin habe Jakobs Herz besiegt oder bezwungen. Das griechische Bild bezeichnet Jakobs innerste Regungen bzw. Zuneigung; die Aussage zielt darauf, dass Benjamin diese gewonnen hat.'
  naturalness: Der Satz ist überwiegend flüssig. „das Herz deines Vaters Jakob überwunden“ klingt jedoch sowohl syntaktisch als auch idiomatisch weniger klar als eine appositionelle Benennung Jakobs und „das Herz … gewonnen“.
  terminology: „Jakob“ und die übrigen Begriffe sind angemessen. „Herz“ ist als verständliche, idiomatische Entsprechung für τὰ σπλάγχνα vertretbar, sofern die deutsche Verbverbindung die dadurch ausgedrückte Zuneigung klar vermittelt.
  issues:
