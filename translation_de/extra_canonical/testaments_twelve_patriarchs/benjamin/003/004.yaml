source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Πόσοι¹⁸ τῶν ἀνθρώπων *ἤθελον αὐτὸν ἀνελεῖν¹⁹, καὶ ὁ Θεὸς ἐσκέπασεν αὐτόν²⁰· ὁ γὰρ φοβούμενος τὸν Θεὸν καὶ ἀγαπῶν τὸν πλησίον²¹ ὑπὸ *τοῦ πνεύματος²² τοῦ Βελίαρ οὐ δύναται πληγῆναι, σκεπαζόμενος²³ ὑπὸ τοῦ φόβου τοῦ Θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/004.yaml
  text: How many men wanted to kill him, and God sheltered him; for the one who fears God and loves his neighbor cannot be struck by the spirit of Beliar, being sheltered by the fear of God.
translation:
  language: de
  text: Wie viele Menschen wollten ihn töten, und Gott beschützte ihn; denn wer Gott fürchtet und seinen Nächsten liebt, kann vom Geist Beliars nicht getroffen werden, geschützt durch die Furcht Gottes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνελεῖν
  choice: töten
  rationale: Gibt hier die beabsichtigte gewaltsame Tötung klar und natürlich wieder.
- source_word: ἐσκέπασεν / σκεπαζόμενος
  choice: beschützte / beschützt
  rationale: Das griechische Bild des Bedeckens bezeichnet in diesem Zusammenhang Schutz; die wiederholte Wortwurzel bleibt durch dasselbe deutsche Verb erkennbar.
- source_word: τὸν πλησίον
  choice: seinen Nächsten
  rationale: Entspricht dem etablierten biblischen Sprachgebrauch und bleibt heutigen Lesern verständlich.
- source_word: πληγῆναι
  choice: getroffen werden
  rationale: Bewahrt die konkrete, passive Ausdrucksweise des Griechischen, ohne die Art des Angriffs näher festzulegen.
- source_word: Βελίαρ
  choice: Beliars
  rationale: Bewahrt die in der Quelle verwendete Namensform Belíar statt sie an die häufigere Form Belial anzugleichen.
theological_decisions:
- issue: Art der Unverletzlichkeit des Gottesfürchtigen
  choice: „kann … nicht getroffen werden“
  alternative: „kann … keinen Schaden erleiden“
  rationale: Die engere Formulierung erhält die Spannung der absoluten Aussage und deutet sie nicht vorschnell als bloß geistlichen oder endgültigen Schutz um.
- issue: Verhältnis von Gottes Schutz und Gottesfurcht
  choice: Gott beschützt ihn; die Furcht Gottes beschützt ihn
  alternative: Gott schützt ihn aufgrund seiner Gottesfurcht
  rationale: Die beiden Formulierungen der Quelle werden nebeneinandergestellt, ohne ihre Beziehung systematisch zu erklären.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange Satzbau und das Semikolon bewahren den argumentativen Zusammenhang des griechischen Textes; „Wie viele Menschen“ erhält die rhetorische, ausrufartige Eröffnung.
