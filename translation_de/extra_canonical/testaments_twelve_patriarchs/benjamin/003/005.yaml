base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/005.yaml
  text: And he cannot be mastered by the plots of men or of beasts, being helped †to live from it† by the love which he has toward his neighbor.
translation:
  language: de
  text: Und weder Nachstellungen von Menschen noch von Tieren können ihn bezwingen; dabei wird ihm durch die Liebe geholfen, die er zu seinem Nächsten hat, †von ihr zu leben†.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Wortlaut „von ihr zu leben“ ist an dieser Stelle unsicher beziehungsweise vermutlich verderbt; der genaue Sinn lässt sich nicht zuverlässig bestimmen.
    reason: Kennzeichnet eine im Ausgangstext mit kritischen Kreuzen markierte textliche Schwierigkeit.
lexical_decisions:
- source_word: ἐπιβουλῆς
  choice: Nachstellungen
  rationale: Das Wort bezeichnet einen feindseligen Anschlag oder eine heimtückische Bedrohung; der Plural klingt im Deutschen in Verbindung mit Menschen und Tieren natürlich.
- source_word: κυριευθῆναι
  choice: bezwungen werden
  rationale: Die passive Form meint, unter die Herrschaft oder Gewalt von etwas zu geraten. „Bezwungen werden“ bewahrt diesen Gedanken in verständlichem Deutsch.
- source_word: ἀγάπης
  choice: Liebe
  rationale: Die übliche und kontextgemäße Wiedergabe; sie bezeichnet hier die Liebe zum Nächsten.
- source_word: πλησίον
  choice: Nächsten
  rationale: Bewahrt den ethischen und zwischenmenschlichen Sinn des griechischen Ausdrucks.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt der Hilfe
  choice: Kein „Herr“ oder „Gott“ ergänzt; die Liebe wird entsprechend dem überlieferten griechischen Wortlaut als vermittelnde Hilfe wiedergegeben.
  alternative: „Der Herr hilft ihm durch die Liebe …“
  rationale: Im vorliegenden griechischen Text steht kein ausdrückliches θεός oder κύριος. Eine solche Ergänzung würde eine theologische Deutung in den Text eintragen, die der erhaltene Wortlaut nicht eindeutig trägt.
- issue: Verderbte oder unsichere Wendung ζῆν ἀπ᾽ αὐτῆς
  choice: Die wörtlich mögliche, aber unklare Wendung „von ihr zu leben“ wird mit kritischen Kreuzen bewahrt und erläutert.
  alternative: Die Wendung glätten, auslassen oder eindeutig auf Gott beziehungsweise die Liebe beziehen.
  rationale: Der griechische Text ist an dieser Stelle offenbar beschädigt oder unsicher. Die Übersetzung soll diese echte textliche Schwierigkeit nicht stillschweigend beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt dem Griechischen nahe, wird aber durch die Voranstellung von „weder … noch“ idiomatisch gestaltet. Die textkritisch unsichere Wendung bleibt sichtbar, statt durch eine nicht belegte Ergänzung geglättet zu werden.
