source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἔστω ἡ διάνοια ὑμῶν *εἰς τὸ ἀγαθόν⁶, ὡς κἀμὲ οἴδατε⁷. Ὅτι⁸ ὁ ἔχων τὴν⁹ διάνοιαν ὀρθὴν¹⁰ πάντα βλέπει ὀρθῶς¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/002.yaml
  text: And let your mind be set on what is good, as you know mine is. For the one who has a right mind sees everything rightly.
translation:
  language: de
  text: Eure Gesinnung soll auf das Gute gerichtet sein, wie ihr sie auch bei mir kennt. Denn wer eine rechte Gesinnung hat, sieht alles richtig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διάνοια
  choice: Gesinnung
  rationale: Der Begriff bezeichnet hier die innere Denk- und Willensausrichtung, nicht nur den Verstand. „Gesinnung“ passt deshalb in beiden Sätzen und bewahrt die Wiederholung des griechischen Ausdrucks.
- source_word: εἰς τὸ ἀγαθόν
  choice: auf das Gute gerichtet
  rationale: Gibt die Zielrichtung der Präposition εἰς natürlich und präzise wieder.
- source_word: ὀρθὴν / ὀρθῶς
  choice: rechte / richtig
  rationale: Bewahrt das griechische Wortspiel zwischen Adjektiv und Adverb, ohne die Aussage stärker als im Ausgangstext theologisch zu deuten.
- source_word: ὡς κἀμὲ οἴδατε
  choice: wie ihr es auch von mir kennt
  rationale: Die knappe griechische Formulierung verweist auf Benjamins den Adressaten bekannte Gesinnung. Die deutsche Wendung macht diesen Bezug idiomatisch deutlich, ohne ein im Griechischen nicht ausdrücklich vorhandenes Verb einzuführen.
theological_decisions:
- issue: Zusammenhang zwischen rechter Gesinnung und rechter Wahrnehmung
  choice: Die uneingeschränkte Aussage „sieht alles richtig“ bleibt erhalten.
  alternative: Eine Abschwächung wie „betrachtet alles aus der richtigen Sicht“ oder „sieht in allem das Richtige“.
  rationale: πάντα βλέπει ὀρθῶς formuliert einen starken, allgemeinen Zusammenhang. Dieser darf nicht erklärend abgeschwächt oder inhaltlich umgedeutet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „Gesinnung“ sowie die Entsprechung „rechte/richtig“ spiegeln die Struktur und das Wortspiel des griechischen Textes.
