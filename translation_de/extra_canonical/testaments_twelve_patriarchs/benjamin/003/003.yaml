source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Φοβεῖσθε¹² Κύριον καὶ ἀγαπᾶτε τὸν πλησίον¹³, καὶ ἐὰν τὰ πνεύματα τοῦ Βελίαρ εἰς πᾶσαν πονηρίαν θλίψεως ἐκστήσωσι¹⁴ ὑμᾶς, οὐ μὴ *κατακυριεύσωσιν ὑμῶν¹⁵, *ὡς οὔτε¹⁶ Ἰωσὴφ *τὸν ἀδελφόν¹⁷ μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/003.yaml
  text: Fear the Lord and love your neighbor; and if the spirits of Beliar should drive you into every evil affliction, they will certainly not rule over you, just as they did not over Joseph my brother.
translation:
  language: de
  text: Fürchtet den Herrn und liebt euren Nächsten. Und sollten die Geister Beliars euch in jede böse Bedrängnis treiben[a], werden sie gewiss nicht über euch herrschen – ebenso wenig, wie sie über meinen Bruder Josef herrschten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann auch bedeuten, jemanden aus seinem gewöhnlichen Zustand oder aus der Fassung zu bringen.
    reason: Die Wendung mit ἐκστήσωσι und εἰς lässt sowohl das Hineintreiben als auch das Aus-der-Fassung-Bringen anklingen.
lexical_decisions:
- source_word: Φοβεῖσθε
  choice: Fürchtet
  rationale: Gibt den Imperativ im Sinn ehrfürchtiger Gottesfurcht direkt und traditionsnah wieder.
- source_word: τὸν πλησίον
  choice: euren Nächsten
  rationale: Die übliche, verständliche Wiedergabe für den Mitmenschen, auf den sich die gebotene Liebe richtet.
- source_word: τὰ πνεύματα τοῦ Βελίαρ
  choice: die Geister Beliars
  rationale: Bewahrt den Eigennamen und die Pluralform des griechischen Textes.
- source_word: εἰς πᾶσαν πονηρίαν θλίψεως
  choice: in allerlei schlimme Bedrängnis
  rationale: Gibt die schwerfällige griechische Verbindung idiomatisch wieder, ohne ihren Zusammenhang von Übel und Bedrängnis aufzulösen.
- source_word: ἐκστήσωσι
  choice: treiben
  rationale: Passt zur Richtungskonstruktion mit εἰς und bewahrt zugleich den Gedanken eines gewaltsamen Herausbringens aus dem geordneten Zustand.
- source_word: οὐ μὴ κατακυριεύσωσιν ὑμῶν
  choice: werden sie gewiss nicht über euch herrschen
  rationale: Die verstärkte griechische Verneinung wird mit „gewiss nicht“ ausgedrückt; κατακυριεύω bezeichnet beherrschende Gewalt.
theological_decisions:
- issue: Bezeichnung „Beliar“
  choice: Beliar als Eigenname beibehalten
  alternative: den Teufel oder das Böse einsetzen
  rationale: Der Quelltext nennt Beliar ausdrücklich; eine Gleichsetzung würde eine interpretierende theologische Festlegung importieren.
- issue: Verheißung des Nichtbeherrschtwerdens
  choice: Die starke Verneinung beibehalten, obwohl zuvor eine Bedrängnis zugelassen wird
  alternative: die Bedrängnis als bloßen Versuch abschwächen
  rationale: 'Der Text hält die Spannung fest: Die Geister können in Bedrängnis treiben, aber nicht die Herrschaft gewinnen.'
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede bleibt im Plural. Der Gedankenstrich verdeutlicht den elliptischen Vergleich mit Josef, ohne den Sinn zu erweitern.
