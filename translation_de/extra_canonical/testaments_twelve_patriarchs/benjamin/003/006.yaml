  text: '*Καὶ γὰρ³¹ *ὁ Ἰωσὴφ ἐδεήθη τοῦ πατρὸς ἡμῶν³², ἵνα προσεύξηται *ὑπὲρ τῶν ἀδελφῶν αὐτοῦ³³· ἵνα μὴ³⁴ λογίσηται *⌈Κύριος⌉ αὐτοῖς³⁵ *ἁμαρτίαν, ὅτι ἐποίησαν πονηρὸν εἰς αὐτόν³⁶.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/006.yaml
  text: For Joseph also begged our father to pray for his brothers, so that the Lord would not reckon sin to them, because they had done evil against him.
translation:
  language: de
  text: Denn auch Josef bat unseren Vater, für seine Brüder zu beten, damit der Herr ihnen die Sünde nicht anrechne, weil sie ihm Böses angetan hatten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδεήθη
  choice: bat
  rationale: Gibt die nachdrückliche Bitte natürlich und würdig wieder.
- source_word: λογίσηται
  choice: anrechne
  rationale: Bewahrt den rechenhaften beziehungsweise zurechnenden Sinn des griechischen Verbs.
- source_word: ἁμαρτίαν
  choice: die Sünde
  rationale: Der griechische Singular wird beibehalten und bezeichnet hier die schuldhafte Tat gegen Josef.
- source_word: ἐποίησαν πονηρὸν εἰς αὐτόν
  choice: sie ihm Böses angetan hatten
  rationale: Natürliches modernes Deutsch, das die gegen Josef gerichtete böse Handlung klar wiedergibt.
theological_decisions:
- issue: Josefs Fürbitte und die Nichtanrechnung von Sünde
  choice: Die Bitte um Fürbitte sowie die mögliche Nichtanrechnung durch den Herrn bleiben ausdrücklich nebeneinander stehen.
  alternative: Die Aussage als bereits gewährte Vergebung wiederzugeben.
  rationale: Der griechische Finalsatz formuliert den erbetenen Zweck, nicht ausdrücklich dessen Erfüllung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton; die Satzstruktur folgt dem griechischen Gedankengang, ohne im Deutschen schwerfällig zu wirken.
