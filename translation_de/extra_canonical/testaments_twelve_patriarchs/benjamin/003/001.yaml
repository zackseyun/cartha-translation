source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: III. *Νῦν οὖν, τέκνα μου, καὶ ὑμεῖς ⸀ἀγαπήσατε¹ Κύριον τὸν Θεὸν τοῦ οὐρανοῦ *καὶ τῆς γῆς², καὶ³ φυλάξατε⁴ ἐντολὰς αὐτοῦ, *μιμούμενοι τὸν ἀγαθὸν καὶ ὅσιον ἄνδρα ⸀Ἰωσήφ⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/003/001.yaml
  text: Now therefore, my children, you also must love the Lord, the God of heaven and earth, and keep his commandments, imitating the good and holy man Joseph.
translation:
  language: de
  text: 'Nun denn, meine Kinder: Liebt auch ihr den Herrn, den Gott des Himmels und der Erde, und haltet seine Gebote, indem ihr Josef, den guten und heiligen Mann, nachahmt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπήσατε
  choice: Liebt
  rationale: Der Aorist-Imperativ fordert die Kinder unmittelbar und nachdrücklich zur Liebe auf; das schlichte „Liebt“ ist im Deutschen natürlich und bewahrt den imperativischen Charakter.
- source_word: φυλάξατε
  choice: haltet
  rationale: φυλάσσω bezeichnet hier das Beachten und Befolgen der Gebote. „Haltet seine Gebote“ ist idiomatisch und inhaltlich präzise.
- source_word: μιμούμενοι
  choice: indem ihr … nacheifert
  rationale: Das Partizip beschreibt, wie die Aufforderung gelebt werden soll. „Nacheifern“ gibt die bewusste Orientierung am Vorbild Josefs natürlich wieder.
- source_word: ἀγαθὸν καὶ ὅσιον
  choice: guten und heiligen
  rationale: ἀγαθός wird mit „gut“ wiedergegeben; ὅσιος bezeichnet religiös-sittliche Heiligkeit bzw. Frömmigkeit. „Heilig“ wahrt die traditionelle und theologisch offene Bedeutung.
- source_word: Ἰωσήφ
  choice: Josef
  rationale: Verwendet die im modernen deutschen Bibelgebrauch verbreitete Namensform.
theological_decisions:
- issue: Bezeichnung Gottes als Gott des Himmels und der Erde
  choice: den Herrn, den Gott des Himmels und der Erde
  alternative: den Herrn, den Gott des Himmels und der Erde liebt
  rationale: Die Apposition des griechischen Textes bleibt erhalten, ohne zusätzliche Auslegung oder Umstellung.
- issue: Vorbildfunktion Josefs
  choice: indem ihr dem guten und heiligen Mann Josef nacheifert
  alternative: und nehmt euch den guten und heiligen Josef zum Vorbild
  rationale: Die partizipiale Verknüpfung bleibt sichtbar und lässt offen, ob sich das Nacheifern besonders auf Liebe und Gebotstreue oder umfassender auf Josefs Lebensführung bezieht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede „meine Kinder“ und die koordinierte Mahnung bewahren den testamentarischen Lehrton; der Doppelpunkt sorgt für einen natürlichen deutschen Satzfluss, ohne Inhalt hinzuzufügen.
