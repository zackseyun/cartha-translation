  source_fidelity: 'Der Entwurf gibt die Satzstruktur und den Sinn des griechischen Textes insgesamt zuverlässig wieder: die beiden Imperative, die Gottesbezeichnung und die Aufforderung, Josef nachzuahmen, sind erhalten. „Nun also“ ist jedoch für Νῦν οὖν im modernen Deutschen weniger idiomatisch als „Nun denn“.'
  naturalness: „Nun denn“ ist ein natürlicher, würdevoller Anschluss in einer paränetischen Rede. Für μιμούμενοι ist „Josef … nachahmt“ im Deutschen unmittelbarer und semantisch genauer als „einem Mann nacheifert“; es vermeidet zudem die etwas steife Verbindung „dem guten und heiligen Mann Josef“.
  terminology: „Herr“, „Gott des Himmels und der Erde“, „Gebote“, „gut“, „heilig“ und „Josef“ sind angemessen. Die Bezeichnung „heilig“ wahrt die religiös-ethische Bedeutung von ὅσιος, ohne sie konfessionell einzuengen.
