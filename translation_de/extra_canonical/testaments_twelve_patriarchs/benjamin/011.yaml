base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011.yaml
  text: '1 No longer shall I be called a ravening wolf because of your ravaging[a], but a worker of the Lord, distributing food to those who do what is good.

    2 And in the last times there shall arise from my seed one beloved of the Lord, hearing his voice and doing the good pleasure of his will, enlightening all the nations with new knowledge, entering upon Israel in salvation, and snatching away from them as a wolf, and giving to the gathering of the nations.

    3 Until the consummation of the age he shall be in the assemblies of the nations and among their rulers, like a musical strain in the mouth of all.

    4 And in holy books he shall be recorded, both his work and his word; and he shall be God''s chosen one forever.

    5 And through him he shall pass through again as Jacob my father, saying[e][d][c][b], “He will fill up what is lacking in your tribe.”'
translation:
  language: de
  text: '**Testament Benjamins 11**


    **1** Ich werde wegen eurer Raubzüge nicht länger ein reißender Wolf genannt werden, sondern ein Arbeiter des Herrn, der denen Nahrung austeilt, die das Gute tun.


    **2** Und in späteren Zeiten wird ein Geliebter des Herrn aus der Nachkommenschaft Judas und Levis aufstehen,[a] der mit seinem Mund Wohlgefallen bewirkt, alle Völker mit neuer Erkenntnis erleuchtet – ein Licht der Erkenntnis –, an Israel mit Heil herantritt,[b] ihnen wie ein Wolf entreißt und der Versammlung der Völker gibt.[c]


    **3** Bis zur Vollendung des Zeitalters[d] wird er in den Versammlungen der Völker und unter ihren Herrschern sein wie eine Melodie im Mund aller.


    **4** In heiligen Büchern wird er verzeichnet sein, sein Werk ebenso wie sein Wort; und er wird Gottes Erwählter sein in Ewigkeit.


    **5** Und durch sie wird er wie mein Vater Jakob umherziehen und sagen: »Er wird ausfüllen, was deinem Stamm fehlt.«[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text dieses Kapitels ist schwer überliefert, besonders in Vers 2. Die vorgelegte Edition kennzeichnet dort mehrere Satzteile als textlich markiert beziehungsweise erweitert; die Übersetzung gibt dennoch ihren griechischen Wortlaut wieder und bewahrt dessen Unebenheiten.
    reason: textual_variant
  - marker: b
    text: Die griechische Wendung ist ungewöhnlich. Möglich sind auch Übersetzungen wie „Israel im Heil betreten“ oder „für Israel rettend eingreifen“.
    reason: lexical_alternative
  - marker: c
    text: Im Griechischen steht lediglich „und der Versammlung der Völker geben“; was gegeben wird, bleibt unausgesprochen.
    reason: ambiguity
  - marker: d
    text: 'Oder: „bis zum Ende des Zeitalters“.'
    reason: lexical_alternative
  - marker: e
    text: Der Schlusssatz ist dunkel. Das Pronomen in „durch sie“ steht im Griechischen im Plural und kann sich möglicherweise auf die zuvor genannten heiligen Bücher, das Werk und das Wort beziehen. Das Verb kann auch „kommen“, „verkehren“ oder „aufsuchen“ bedeuten.
    reason: textual_variant
lexical_decisions:
- source_word: λύκος ἅρπαξ
  choice: reißender Wolf
  rationale: Bewahrt das anschauliche Raubtierbild und die gewaltsame Bedeutung von ἅρπαξ in einer geläufigen, würdigen deutschen Wendung.
- source_word: ἁρπαγάς
  choice: Raubzüge
  rationale: Gibt die gewaltsamen Aneignungen konkret wieder und hält die Verbindung zum Bild des reißenden Wolfs aufrecht.
- source_word: ἐργάτης Κυρίου
  choice: Arbeiter des Herrn
  rationale: Übersetzt ἐργάτης konkret als einen Arbeitenden und vermeidet die Abschwächung zu „Diener“.
- source_word: ἐργαζομένοις τὸ ἀγαθόν
  choice: die das Gute tun
  rationale: Gibt die aktive Bedeutung natürlich wieder, ohne das griechische Verb unnötig mit „arbeiten“ zu verdoppeln.
- source_word: ἀγαπητὸς Κυρίου
  choice: ein Geliebter des Herrn
  rationale: Bewahrt die substantivische, prophetisch-feierliche Ausdrucksweise und lässt die genaue Identität der Gestalt offen.
- source_word: ἐκ σπέρματος Ἰούδα καὶ Λευί
  choice: aus der Nachkommenschaft Judas und Levis
  rationale: Übersetzt die im vorgelegten griechischen Text genannten Stammeslinien unmittelbar; „Nachkommenschaft“ ist im modernen Deutsch natürlicher als das wörtliche „Samen“.
- source_word: ποιῶν εὐδοκίαν ἐν στόματι αὐτοῦ
  choice: Er wird Wohlgefallen in seinem Mund bewirken
  rationale: Hält sich eng an die schwierige griechische Formulierung und glättet sie nicht zu einer nicht ausdrücklich belegten Aussage über Stimme oder Willen.
- source_word: γνῶσιν καινὴν φωτίζων πάντα τὰ ἔθνη · φῶς γνώσεως
  choice: alle Völker mit neuer Erkenntnis erleuchten – ein Licht der Erkenntnis
  rationale: Erhält sowohl das Motiv der Erleuchtung als auch die nachgestellte, syntaktisch lockere Wendung „Licht der Erkenntnis“.
- source_word: ἐπεμβαίνων τὸν Ἰσραὴλ ἐν σωτηρίᾳ
  choice: Israel mit Rettung entgegentreten
  rationale: Versucht, Bewegung beziehungsweise Eingreifen und das Rettungsmotiv zugleich auszudrücken, ohne die schwierige Konstruktion dogmatisch festzulegen.
- source_word: ἁρπάζων ὡς λύκος ἀπ᾽ αὐτῶν
  choice: ihnen wie ein Wolf etwas entreißen
  rationale: Das im Griechischen unausgesprochene Objekt bleibt durch „etwas“ unbestimmt; das wiederkehrende Wolfsbild wird bewahrt.
- source_word: συναγωγῇ τῶν ἐθνῶν
  choice: Versammlung der Völker
  rationale: Gibt den kollektiven Sinn wieder, ohne vorschnell eine institutionelle oder kirchliche Deutung einzutragen.
- source_word: συντελείας τοῦ αἰῶνος
  choice: Vollendung der Weltzeit
  rationale: Bewahrt sowohl den Gedanken des Abschlusses als auch den zeitlich-weltgeschichtlichen Sinn von αἰών.
- source_word: ὡς μουσικὸν μέλος ἐν στόματι πάντων
  choice: wie eine Melodie im Mund aller
  rationale: Überträgt das musikalische Bild klar und bildhaft in modernes Deutsch.
- source_word: δι᾽ αὐτῶν φοιτήσει
  choice: durch sie wird er ... umhergehen
  rationale: Bewahrt den Plural des Pronomens und die Bewegungsbedeutung von φοιτάω, obwohl Bezug und Sinn der Wendung unsicher bleiben.
theological_decisions:
- issue: Herkunft der zukünftigen Gestalt in Vers 2
  choice: „aus der Nachkommenschaft Judas und Levis“ gemäß dem vorgelegten griechischen Text
  alternative: „aus meiner Nachkommenschaft“ beziehungsweise eine ausschließlich benjaminitische Herkunft
  rationale: Die Übersetzung folgt vorrangig dem angegebenen griechischen Quellenwortlaut. Die Spannung zu anderen Fassungen wird nicht durch Harmonisierung beseitigt.
- issue: Identität des „Geliebten des Herrn“
  choice: Die Gestalt bleibt unbenannt und wird nur mit den Aussagen des griechischen Textes beschrieben.
  alternative: Ausdrückliche Identifikation als Messias, Christus oder bloßer Stammesführer
  rationale: Der Wortlaut ist stark erhöht und möglicherweise messianisch, nennt die Gestalt aber nicht eindeutig. Eine konfessionelle Festlegung wäre ein Zusatz.
- issue: Bedeutung von ἔθνη
  choice: Völker
  alternative: Heiden
  rationale: „Völker“ erhält den breiten kollektiven Sinn und vermeidet eine unnötige spätere religiöse Innen-Außen-Terminologie.
- issue: Unvollständige Gabe an die Versammlung der Völker
  choice: „und der Versammlung der Völker geben“ ohne ergänztes Objekt
  alternative: Ein bestimmtes Gut wie Erkenntnis, Rettung oder die Entrissenen als Objekt einsetzen
  rationale: Im griechischen Wortlaut fehlt ein ausdrückliches Objekt. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, testamentarisch-prophetischem Ton. Schwierige Syntax wurde nur so weit geglättet, wie es für Verständlichkeit nötig ist; fehlende Objekte, unklare Bezüge und die textkritische Spannung in Vers 2 wurden nicht durch theologische Ergänzungen aufgelöst.
