  to: '**Testament Benjamins 11**


    **1** Ich werde wegen eurer Raubzüge nicht länger ein reißender Wolf genannt werden, sondern ein Arbeiter des Herrn, der denen Nahrung austeilt, die das Gute tun.


    **2** Und in späteren Zeiten wird ein Geliebter des Herrn aus der Nachkommenschaft Judas und Levis aufstehen,[a] der mit seinem Mund Wohlgefallen bewirkt, alle Völker mit neuer Erkenntnis erleuchtet – ein Licht der Erkenntnis –, an Israel mit Heil herantritt,[b] ihnen wie ein Wolf entreißt und der Versammlung der Völker gibt.[c]


    **3** Bis zur Vollendung des Zeitalters[d] wird er in den Versammlungen der Völker und unter ihren Herrschern sein wie eine Melodie im Mund aller.


    **4** In heiligen Büchern wird er verzeichnet sein, sein Werk ebenso wie sein Wort; und er wird Gottes Erwählter sein in Ewigkeit.


    **5** Und durch sie wird er wie mein Vater Jakob umherziehen und sagen: »Er wird ausfüllen, was deinem Stamm fehlt.«[e]'
  rationale: Die Revision korrigiert zwei sprachlich beziehungsweise semantisch problematische Stellen in V. 2, ohne den schwierigen und möglicherweise erweiterten griechischen Wortlaut zu glätten. Sie erhält die unbestimmten Objekte, die pluralische Referenz in V. 5 und die offene Identität der zukünftigen Gestalt. Der textkritische Hinweis wird an die tatsächlich betroffene Stelle gesetzt.
