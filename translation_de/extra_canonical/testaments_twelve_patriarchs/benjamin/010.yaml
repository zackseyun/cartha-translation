review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den griechischen Text einschließlich der eckig markierten Zusätze grundsätzlich zuverlässig wieder. Korrekturbedarf besteht in V. 5, wo πάντα sich auf „all dies“ und nicht auf die Patriarchen bezieht, sowie in V. 8, wo „zu ihnen kam“ gegenüber dem nicht näher bestimmten griechischen Wortlaut vermeidbar ergänzt ist.
  naturalness: 'Der Ton ist überwiegend gutes modernes, würdiges Standarddeutsch. Einige Formulierungen werden gestrafft: Die doppelte Bekräftigung in V. 1 („genauso, wie ... wirklich war“) wirkt schwerfällig, und die Schlussformulierung von V. 10 wird idiomatischer, ohne die schwierige Bildsprache aufzulösen.'
  terminology: Die Wiedergabe von Gesetz, Geboten, Herrlichkeit, Schande, Auferstehung und den Eigennamen ist stimmig. Die Klammerkennzeichnung der textgeschichtlich umstrittenen Passagen ist beizubehalten. „König der Himmel“ bewahrt angemessen den griechischen Plural.
  issues:
  - severity: medium
    issue: 'V. 5: „Sie alle gaben uns dies als Erbe“'
    rationale: πάντα verweist auf „all diese Dinge“ (die Gebote/Weisungen), nicht darauf, dass alle drei Patriarchen Subjekt von „gaben“ wären. „Denn all dies gaben sie uns als Erbe“ bildet Syntax und Bezug klarer ab.
  - severity: low
    issue: 'V. 1: „genauso, wie seine ganze Erscheinung wirklich war“'
    rationale: „wirklich“ ist im Deutschen eine zusätzliche, stilistisch schwere Bekräftigung. Das griechische καθʼ ὃ ἦν verlangt die Übereinstimmung mit seinem wirklichen Aussehen, die durch „genau so, wie seine ganze Erscheinung war“ hinreichend wiedergegeben wird.
  - severity: low
    issue: 'V. 8: „als er im Fleisch zu ihnen kam“'
    rationale: Der griechische Zusatz lautet wörtlich „weil sie Gott, als er im Fleisch gekommen/erschienen war, nicht glaubten“. Ein Zielobjekt wie „zu ihnen“ wird nicht genannt; „als Gott im Fleisch erschien“ bewahrt diese Offenheit.
  - severity: low
    issue: 'V. 10: „deren Anteil unter denen ist“'
    rationale: Die Formulierung ist im Deutschen unidiomatisch. „die ihren Anteil bei denen haben“ gibt ἐν μερίδι wieder und lässt die im überlieferten Text auffällige Zuordnung weiterhin offen.
