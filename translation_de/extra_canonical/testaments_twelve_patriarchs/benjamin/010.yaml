base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010.yaml
  text: '1[a]. Now when Joseph was in Egypt, I longed to see his appearance and the form of his face; and through the prayers of Jacob my father I saw him, while awake by day, exactly as his whole appearance was.


    2. And after saying these things he said to them, “Know then, my children, that I am dying. 3[b]. Therefore do truth, each one toward his neighbor, and keep the law of the Lord and his commandments. 4. For these things I leave you instead of every inheritance. And you also give them to your children as an everlasting possession; for thus Abraham and Isaac and Jacob did. 5. For they gave all these things to us as an inheritance, saying, ‘Keep the commandments of God until the time when you will see Enoch and Seth and Abraham and Isaac and Jacob risen up at his right hand in rejoicing.’


    6. Then we also will rise, each with our scepter, and we will worship the King of the heavens. 7. [the one who appeared on earth in the form of a man in humility; and all who believe in him on the earth will rejoice with him.]


    8. And all will rise, some to glory and some to dishonor; and the Lord will judge Israel first for their unrighteousness [because when God came to them in flesh, they did not believe him]. 9. And then he will judge all the nations [which did not believe him when he appeared on earth]. 10. And through the chosen ones from among the nations he will convict Israel, just as he convicted Esau through the Midianites, who deceived their brothers into becoming, through sexual immorality and idolatry, estranged from God, and so they became children in the portion of those who fear the Lord.


    11. You therefore, my children, if you walk in holiness in the commandments of the Lord, you will dwell again with confidence in me[d][c], and all Israel will be gathered to the Lord.'
translation:
  language: de
  text: 'Das Testament Benjamins 10


    1 Als Josef in Ägypten war, sehnte ich mich danach, sein Aussehen und die Gestalt seines Gesichts zu sehen. Durch die Gebete meines Vaters Jakob sah ich ihn am hellen Tag, während ich wach war, genau so, wie seine ganze Erscheinung war.


    2 Nachdem er dies gesagt hatte, sagte er zu ihnen: »Erkennt nun, meine Kinder, dass ich sterbe. 3 Darum übt Wahrheit[a], jeder gegenüber seinem Nächsten, und haltet das Gesetz des Herrn und seine Gebote. 4 Denn dies hinterlasse ich euch anstelle jedes anderen Erbes. Gebt auch ihr es euren Kindern als ewigen Besitz weiter; denn so taten es Abraham, Isaak und Jakob. 5 Denn all dies gaben sie uns als Erbe und sagten: ›Haltet die Gebote Gottes, bis [der Herr sein Heil allen Völkern offenbart].‹[b]


    6 Dann werdet ihr Henoch und Set, Abraham, Isaak und Jakob sehen, wie sie voller Jubel zu seiner Rechten auferstanden sind. 7 Dann werden auch wir auferstehen, jeder mit unserem Zepter[c], und den König der Himmel anbeten, [der in Niedrigkeit in Menschengestalt auf der Erde erschien; und alle, die auf der Erde an ihn glauben, werden sich mit ihm freuen].


    8 Und alle werden auferstehen: die einen zur Herrlichkeit, die anderen zur Schande. Der Herr wird zuerst Israel wegen seiner Ungerechtigkeit richten, [weil sie nicht an Gott glaubten, als er im Fleisch erschien]. 9 Dann wird er alle Völker richten, [die nicht an ihn glaubten, als er auf der Erde erschien]. 10 Durch die Erwählten aus den Völkern wird er Israel überführen, wie er Esau durch die Midianiter überführte. Diese verführten ihre Brüder dazu, [durch sexuelle Unmoral und Götzendienst von Gott entfremdet zu werden]; und so wurden sie zu Kindern, die ihren Anteil bei denen haben, die den Herrn fürchten.


    11 Wenn ihr nun, meine Kinder, in Heiligkeit und in den Geboten des Herrn lebt, werdet ihr wieder voller Hoffnung bei mir wohnen[d], und ganz Israel wird zum Herrn versammelt werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »handelt wahrhaftig«. Die griechische Wendung bedeutet wörtlich »tut Wahrheit« und beschreibt konkretes, wahrhaftiges Handeln.'
    reason: lexical_alternative
  - marker: b
    text: Die eckig geklammerten Passagen werden entsprechend dem vorgelegten griechischen Editionstext wiedergegeben. Besonders die ausdrücklichen Aussagen in den Versen 7–9 über Gottes Erscheinen im Fleisch und den Glauben an ihn gelten weithin als spätere christliche Erweiterungen.
    reason: textual_variant
  - marker: c
    text: Wörtlich steht hier die schwierige Wendung »jeder bei/auf unserem Zepter«. Das Bild kann auf wiederhergestellte Würde oder Herrschaft der Stämme bei der Auferstehung hinweisen.
    reason: cultural_note
  - marker: d
    text: 'Die griechische Formulierung ist schwierig und lautet wörtlicher: »wieder auf Hoffnung in mir wohnen«. Möglich ist auch die Wiedergabe: »wieder voller Zuversicht in mir wohnen«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εἰδέα / μόρφωσις / ὄψις
  choice: Aussehen / Gestalt des Gesichts / Erscheinung
  rationale: Die Häufung verwandter Ausdrücke bleibt erhalten, ohne im Deutschen unnatürlich zu wirken; sie betont die lebhafte, vollständige Wahrnehmung Josefs.
- source_word: ἐν ἡμέρᾳ γρηγορῶν
  choice: am hellen Tag, während ich wach war
  rationale: Die Formulierung hebt das Wachsein gegenüber Schlaf oder Traum hervor, ohne daraus ausdrücklich eine technische Vision zu machen.
- source_word: ποιήσατε ... ἀλήθειαν
  choice: übt Wahrheit
  rationale: Die ungewöhnliche, konkrete ethische Wendung des Griechischen bleibt erkennbar. Die Fußnote nennt die idiomatischere Möglichkeit.
- source_word: ἀντὶ πάσης κληρονομίας
  choice: anstelle jedes anderen Erbes
  rationale: Die Übersetzung bewahrt die kontrastive Kraft von ἀντί und macht deutlich, dass die Weisung Benjamins eigentliches Vermächtnis ist.
- source_word: κατάσχεσιν αἰώνιον
  choice: ewigen Besitz
  rationale: Dies gibt etwas dauerhaft Festgehaltenes und über Generationen Weitergegebenes natürlich wieder.
- source_word: ἀνασταμένους ἐκ δεξιῶν αὐτοῦ
  choice: zu seiner Rechten auferstanden
  rationale: Der Auferstehungszusammenhang und die Ehrenstellung werden bewahrt; das nicht ausdrücklich bestimmte Bezugswort des Pronomens wird nicht ergänzt.
- source_word: ἐπὶ σκήπτρον ἡμῶν
  choice: jeder mit unserem Zepter
  rationale: Die schwierige Bildsprache bleibt relativ wörtlich und wird nicht unbelegt als Stamm, Thron oder Herrschaft erklärt.
- source_word: βασιλέα τῶν οὐρανῶν
  choice: König der Himmel
  rationale: Der Plural des Griechischen und der feierliche apokalyptische Ton bleiben erhalten.
- source_word: ἀτιμία
  choice: Schande
  rationale: Der Ausdruck bildet im Gerichtskontext einen klaren und würdigen Gegensatz zu Herrlichkeit.
- source_word: ἐπʼ ἐλπίδι ἐν ἐμοί
  choice: voller Hoffnung bei mir
  rationale: Die schwierige Wendung wird in natürlichem Deutsch relational wiedergegeben; die wörtlichere Form bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Eckig geklammerte Passagen, besonders die christologischen Aussagen in V. 7–9
  choice: Im Haupttext übersetzt und in eckigen Klammern belassen
  alternative: Die Passagen als spätere Zusätze auslassen oder ohne Kennzeichnung in den Text aufnehmen
  rationale: Der vorgelegte griechische Editionstext enthält diese Aussagen und kennzeichnet sie. Ihre Übersetzung mit sichtbaren Klammern gibt den Zeugen transparent wieder, ohne die textgeschichtliche Unsicherheit zu verdecken.
- issue: Bezugswort von αὐτοῦ in V. 6
  choice: seiner Rechten
  alternative: zur Rechten Gottes oder zur Rechten des Herrn
  rationale: Das Griechische nennt an dieser Stelle nur das Pronomen. Eine ausdrückliche Identifikation würde die vorhandene Mehrdeutigkeit auflösen.
- issue: Auferstehung und Gericht in V. 6–10
  choice: Als Auferstehung aller mit unterschiedlichen Ausgängen und anschließendem Gericht wiedergegeben
  alternative: Als bloß bildliche nationale Wiederherstellung oder ausschließlich auf Israel bezogen
  rationale: Die wiederholten Auferstehungsverben sowie der Gegensatz von Herrlichkeit und Schande und das Gericht über Israel und die Völker sprechen im unmittelbaren Zusammenhang für eine eschatologische, umfassende Aussage.
- issue: Bedeutung von ἐπὶ σκήπτρον ἡμῶν
  choice: jeder mit unserem Zepter
  alternative: jeder nach seinem Stamm oder jeder auf seinem Thron
  rationale: Der Text ist sprachlich und möglicherweise textkritisch schwierig. Eine Deutung als Stamm oder Thron wäre klarer, würde aber mehr festlegen, als der griechische Wortlaut sicher trägt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit testamentarisch-biblischem Ton. Ungewöhnliche griechische Bilder und echte Mehrdeutigkeiten werden nicht stillschweigend geglättet; textkritisch markierte Zusätze bleiben sichtbar.
