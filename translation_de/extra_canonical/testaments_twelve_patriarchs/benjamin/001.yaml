revisions:
- from: 'Das Testament Benjamins, des zwölften Sohnes Jakobs und Rahels


    1 Abschrift der Worte Benjamins, die er für seine Söhne als letztwillige Verfügung festlegte, nachdem er 125 Jahre gelebt hatte.


