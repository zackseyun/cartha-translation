base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/001.yaml
  text: 'The Copy of the Words of Benjamin[a], the twelfth son of Jacob, which he set in order for his sons, having lived one hundred and twenty-five years.


    And after kissing them, he said:


    Just as Isaac was born to Abraham in his old age, so I also was born to Jacob. And since Rachel my mother died while giving birth to me, I had no milk; so I was nursed by Bilhah, her maidservant. For Rachel was barren for twelve years after she had borne Joseph; and she prayed to the Lord with fasting, and after conceiving she bore me. For my father loved Rachel exceedingly, and he prayed to see two sons from her. Because of this I was called Benjamin[b], which means son of days.'
translation:
  language: de
  text: 'Das Testament Benjamins, des zwölften Sohnes Jakobs und Rahels


    1 Abschrift der Worte Benjamins, die er für seine Söhne anordnete, nachdem er 125 Jahre gelebt hatte.


    2 Nachdem er sie herzlich geküsst hatte, sagte er:


    »Wie Isaak dem Abraham in dessen hohem Alter geboren wurde, so wurde auch ich Jakob geboren. 3 Weil meine Mutter Rahel starb, als sie mich gebar, hatte ich keine Muttermilch; deshalb wurde ich von Bilha, ihrer Dienerin, gestillt. 4 Denn nachdem Rahel Josef geboren hatte, blieb sie zwölf Jahre lang unfruchtbar. Sie betete zum Herrn, während sie fastete, wurde schwanger und gebar mich. 5 Mein Vater liebte Rahel nämlich überaus und betete darum, von ihr zwei Söhne zu sehen. 6 Deshalb wurde ich Benjamin[a] genannt, das heißt ›Sohn der Tage‹.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text erklärt den Namen Benjamin hier mit »Sohn der Tage«. Die geläufige hebräische Deutung des Namens lautet »Sohn der rechten Hand«.
    reason: cross_reference
lexical_decisions:
- source_word: διέθετο
  choice: als letztwillige Verfügung festlegte
  rationale: Im testamentarischen Zusammenhang bezeichnet das Verb eine feierliche Anordnung für die Söhne; die Formulierung wahrt diesen Sinn, ohne einen modernen juristischen Fachakt zu unterstellen.
- source_word: Καταφιλήσας
  choice: nachdem er sie herzlich geküsst hatte
  rationale: Das Kompositum bezeichnet ein inniges, möglicherweise wiederholtes Küssen; »herzlich geküsst« klingt natürlich und bewahrt die Zuneigung der Szene.
- source_word: ἐν γήρει αὐτοῦ
  choice: in dessen hohem Alter
  rationale: Die Wendung wird idiomatisch wiedergegeben und der Bezug auf Abraham eindeutig gehalten.
- source_word: τέθνηκε γεννῶσά με
  choice: starb, als sie mich gebar
  rationale: Die griechische Konstruktion verbindet Rahels Tod unmittelbar mit Benjamins Geburt; die deutsche Fassung ist knapp und eindeutig.
- source_word: γάλα οὐκ ἔσχον
  choice: hatte ich keine Muttermilch
  rationale: »Milch hatte ich nicht« wäre im Deutschen missverständlich. »Muttermilch« macht den durch Rahels Tod bedingten Mangel deutlich, ohne die Aussage weiter auszubauen.
- source_word: ἐθήλασα
  choice: wurde ich … gestillt
  rationale: Die mediale Form wird dem Zusammenhang entsprechend als Empfangen des Stillens wiedergegeben; Bilha ist die stillende Person.
- source_word: ἐστείρευσεν
  choice: blieb sie zwölf Jahre lang unfruchtbar
  rationale: Der Aorist wird mit der genannten Zeitspanne im Deutschen natürlich als anhaltender Zustand ausgedrückt.
- source_word: πρὸς Κύριον μετὰ νηστείας
  choice: betete unter Fasten zum Herrn
  rationale: Die Zielrichtung des Gebets und die begleitende Fastenpraxis bleiben beide ausdrücklich erhalten.
- source_word: συλλαβοῦσα τέτοκέ με
  choice: wurde schwanger und gebar mich
  rationale: Die aufeinanderfolgenden Vorgänge werden in natürlichem Deutsch koordiniert, ohne ihren zeitlichen Zusammenhang zu verändern.
- source_word: Σφόδρα ἠγάπα
  choice: liebte … überaus
  rationale: »Überaus« bewahrt die starke Intensität und den würdigen testamentarischen Ton.
- source_word: υἱὸς ἡμερῶν
  choice: Sohn der Tage
  rationale: Die ungewöhnliche ausdrückliche Etymologie des griechischen Textes wird wörtlich bewahrt und nicht mit der geläufigeren Deutung des hebräischen Namens harmonisiert.
theological_decisions:
- issue: Bedeutung des Namens Benjamin im griechischen Textzeugen
  choice: Die ausdrückliche griechische Erklärung wird als »Sohn der Tage« übersetzt.
  alternative: »Sohn der rechten Hand« nach der üblichen hebräischen Namensdeutung oder deutend »Sohn des Alters«.
  rationale: Der vorliegende griechische Text bietet selbst die Erklärung υἱὸς ἡμερῶν. Die Übersetzung folgt diesem Textzeugen und lässt die Spannung zur Genesisüberlieferung bestehen.
- issue: Rahels Gebet und Fasten
  choice: Gebet zum Herrn und Fasten werden als zusammengehörige Handlungen wiedergegeben.
  alternative: Das Fasten bloß temporal als »während sie fastete« auszudrücken.
  rationale: Die knappe griechische Formulierung legt eine begleitende Fastenpraxis nahe, ohne deren theologische Bedeutung näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die Kapitelüberschrift folgt der im griechischen Ausgangstext überlieferten Titelformel; die eigentliche Erzählung ist nach den sechs Versen gegliedert. Altertümliche oder konfessionell geprägte Wendungen wurden vermieden, die testamentarische Feierlichkeit jedoch bewahrt.
