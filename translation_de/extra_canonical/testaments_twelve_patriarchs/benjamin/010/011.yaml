id: T12P.BEN.10.11
reference: Testament of Benjamin 10:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: ⌜Ὑμεῖς οὖν, τέκνα μου⁶⁷, ἐὰν⁶⁸ πορευθῆτε⁶⁹ ἐν ἁγιασμῷ ⌜*ἐν ταῖς ἐντολαῖς⁷⁰ Κυρίου⌝, πάλιν κατοικήσετε⁷¹ ⌜ἐπʼ ἐλπίδι⌝ *ἐν ἐμοί⁷², καὶ συναχθήσεται⁷³ *πρὸς Κύριον⁷⁴ πᾶς Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/011.yaml
  text: You therefore, my children, if you walk in holiness in the commandments of the Lord, you will again dwell in hope with me, and all Israel will be gathered to the Lord.
translation:
  language: de
  text: Ihr also, meine Kinder, wenn ihr in Heiligkeit in den Geboten des Herrn euren Weg geht, werdet ihr wieder in Hoffnung bei mir wohnen,[a] und ganz Israel wird zum Herrn versammelt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Wendung kann wörtlicher auch »in Hoffnung in mir wohnen« wiedergegeben werden; das Verhältnis von »Hoffnung« und »in/bei mir« ist sprachlich nicht völlig eindeutig.
    reason: Bewahrt die syntaktische und semantische Mehrdeutigkeit von ἐπʼ ἐλπίδι ἐν ἐμοί.
lexical_decisions:
- source_word: πορευθῆτε
  choice: euren Weg geht
  rationale: Gibt das bildhafte »gehen/wandeln« in natürlichem modernem Deutsch wieder.
- source_word: ἐν ἁγιασμῷ
  choice: in Heiligkeit
  rationale: Bewahrt die substantivische Form und bezeichnet eine geheiligte Lebensweise.
- source_word: ἐν ταῖς ἐντολαῖς Κυρίου
  choice: in den Geboten des Herrn
  rationale: Folgt bewusst der griechischen Präposition ἐν, ohne sie eindeutig als bloßes »gemäß« aufzulösen.
- source_word: ἐπʼ ἐλπίδι
  choice: in Hoffnung
  rationale: Bewahrt den ausdrücklichen Hoffnungsbegriff; »voller Zuversicht« wäre freier und könnte die Bedeutung verengen.
- source_word: κατοικήσετε
  choice: werdet … wohnen
  rationale: Entspricht dem dauerhaften Wohnen oder Sich-Niederlassen des Verbs.
- source_word: συναχθήσεται πρὸς Κύριον
  choice: wird zum Herrn versammelt werden
  rationale: Bewahrt sowohl das Passiv als auch die Zielrichtung zu dem Herrn hin.
theological_decisions:
- issue: Bezug und Bedeutung von ἐπʼ ἐλπίδι ἐν ἐμοί
  choice: in Hoffnung bei mir wohnen
  alternative: in Hoffnung in mir wohnen / auf Hoffnung hin bei mir wohnen
  rationale: Die gewählte Fassung ist im Deutschen verständlich und folgt der wahrscheinlich räumlich-gemeinschaftlichen Bedeutung von ἐν ἐμοί, ohne die sprachlich mögliche wörtliche Lesart »in mir« zu verschweigen; diese wird in der Fußnote erhalten.
- issue: Umfang der Sammlung Israels
  choice: ganz Israel
  alternative: jeder Israelit
  rationale: πᾶς Ἰσραήλ bezeichnet am natürlichsten Israel als Gesamtheit; die Formulierung lässt die genaue theologische Reichweite offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas markierte Wendung »in den Geboten … euren Weg geht« hält die Bildsprache und Präposition des Griechischen sichtbar; »bei mir wohnen« sorgt zugleich für natürliche Verständlichkeit.
