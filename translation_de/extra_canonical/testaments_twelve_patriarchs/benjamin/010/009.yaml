  source_fidelity: Die Zukunftsform von κρινεῖ und πάντα τὰ ἔθνη sind zutreffend mit „wird … richten“ und „alle Völker“ wiedergegeben. Die eckig überlieferte Ergänzung muss als textkritisch unsicher kenntlich bleiben. Für πιστεύω mit Dativ ist „ihm glauben“ die nähere und hier gegenüber der englischen Audit-Fassung („believe him“) vorzugswürdige Grundwiedergabe; „an ihn glauben“ ist als mögliche kontextuelle Deutung in einer Anmerkung zu bewahren.
  naturalness: „Und dann wird er alle Völker richten, [die ihm nicht glaubten, als er auf der Erde erschien].“ ist modernes, würdiges und syntaktisch klares Standarddeutsch. Das Komma statt des hinzugefügten Gedankenstrichs bildet die eingeschobene, textkritisch markierte Relativbestimmung unauffällig und natürlich ab.
  terminology: „Völker“ ist für ἔθνη angemessen. „Richten“ gibt den Gerichtskontext von κρινεῖ präzise wieder. „Ihm nicht glaubten“ wahrt die Dativkonstruktion; die Fußnote nennt „nicht an ihn glaubten“ als mögliche religiös-kontextuelle Auslegung, ohne sie zur einzigen Lesart zu machen.
