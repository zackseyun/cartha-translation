source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ τότε κρινεῖ πάντα τὰ ἔθνη [ὅσα οὐκ ἐπίστευσαν αὐτῷ ἐπὶ τῆς⁵⁰ γῆς φανέντι⁵⁷].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/009.yaml
  text: And then he will judge all the nations, [as many as did not believe him when he appeared on earth].
translation:
  language: de
  text: Und dann wird er alle Völker richten, [die ihm nicht glaubten, als er auf der Erde erschien].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die eingeklammerte Ergänzung ist textkritisch unsicher. Griechisch „ihm nicht glaubten“ kann im religiösen Kontext auch als „nicht an ihn glaubten“ verstanden werden.
    reason: Die eckigen Klammern der griechischen Vorlage kennzeichnen den Satzteil als unsicher. Die Anmerkung wahrt die mögliche weitergehende Deutung der Dativkonstruktion, ohne deren primäre Bedeutung im Haupttext zu verdrängen.
lexical_decisions:
- source_word: κρινεῖ
  choice: wird … richten
  rationale: Gibt das futurische Verb formal und im gegebenen Gerichtskontext natürlich wieder.
- source_word: πάντα τὰ ἔθνη
  choice: alle Völker
  rationale: Entspricht dem üblichen kollektiven Sinn von ἔθνη; »Nationen« wäre im Deutschen stärker politisch geprägt.
- source_word: οὐκ ἐπίστευσαν αὐτῷ
  choice: nicht an ihn glaubten
  rationale: Im Kontext des Erscheinens einer Person ist »an ihn glauben« idiomatisches Deutsch; das griechische Dativobjekt kann auch als »ihm nicht glaubten« verstanden werden.
- source_word: ἐπὶ τῆς γῆς φανέντι
  choice: als er auf der Erde erschien
  rationale: Löst das substantivierte Aoristpartizip verständlich als temporalen Nebensatz auf, ohne die zeitliche Vorzeitigkeit überzubetonen.
theological_decisions:
- issue: Umfang des Gerichts über die Völker
  choice: Die eckig überlieferte Ergänzung wird als Apposition zu »alle Völker« wiedergegeben.
  alternative: 'Die Ergänzung könnte als Einschränkung verstanden werden: »alle Völker, soweit sie nicht …«'
  rationale: ὅσα kann den vorausgehenden Gesamtausdruck näher bestimmen oder faktisch einschränken. Der Gedankenstrich hält die Spannung zwischen »alle Völker« und der folgenden Bestimmung sichtbar.
- issue: Bezug von αὐτῷ
  choice: »an ihn glaubten«
  alternative: »ihm glaubten«
  rationale: Beide Wiedergaben sind sprachlich möglich. Die gewählte Form passt zum religiösen Kontext, während die Fußnote die engere Bedeutung »ihm Glauben schenken« offenhält.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich macht die nähere Bestimmung der »Völker« lesbar; die eckigen Klammern der kritischen Vorlage bleiben erhalten. Der Fußnotenmarker steht im Haupttext.
