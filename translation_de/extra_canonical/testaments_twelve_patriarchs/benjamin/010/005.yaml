source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Ταῦτα γὰρ πάντα δέδωκαν ἡμῖν εἰς κληρονομίαν¹⁹ *εἰπόντες· Φυλάξατε τὰς ἐντολὰς τοῦ Θεοῦ²⁰ ἕως ὅτου²¹ ἀποκαλύψει [Κύριος τὸ σωτήριον αὐτοῦ πᾶσι τοῖς ἔθνεσι].'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/005.yaml
  text: For they gave us all these things as an inheritance, saying, ‘Keep the commandments of God until the time when [the Lord reveals his salvation to all the nations].’
translation:
  language: de
  text: 'Denn dies alles haben sie uns als Erbe hinterlassen und gesagt: »Haltet die Gebote Gottes, bis [der Herr allen Völkern sein Heil offenbart].«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέδωκαν ἡμῖν εἰς κληρονομίαν
  choice: haben sie uns als Erbe hinterlassen
  rationale: Gibt die vollendete Übergabe als bleibendes Erbe in natürlichem Deutsch wieder.
- source_word: Φυλάξατε
  choice: Haltet
  rationale: Der Imperativ bezeichnet das treue Befolgen beziehungsweise Bewahren der Gebote; »Haltet die Gebote« ist im Deutschen klar und idiomatisch.
- source_word: τὸ σωτήριον αὐτοῦ
  choice: sein Heil
  rationale: Bewahrt den umfassenden Sinn von Gottes Rettung beziehungsweise Heil, ohne ihn unnötig einzuengen.
- source_word: πᾶσι τοῖς ἔθνεσι
  choice: allen Völkern
  rationale: ἔθνη bezeichnet hier die Völker beziehungsweise Nationen; »allen Völkern« ist geläufig und kontextgerecht.
theological_decisions:
- issue: Subjekt der Offenbarung in der eingeklammerten Lesart
  choice: der Herr ... offenbart
  alternative: Gott ... offenbart
  rationale: Folgt ausdrücklich dem überlieferten Κύριος und lässt dessen genaue referenzielle beziehungsweise christologische Bestimmung offen.
- issue: Bedeutung von σωτήριον
  choice: Heil
  alternative: Rettung
  rationale: »Heil« erhält die mögliche personale, heilsgeschichtliche und umfassende Bedeutung, ohne die Aussage auf einen einzelnen Rettungsakt zu beschränken.
