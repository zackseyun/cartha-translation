source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Καὶ οἱ⁴³ πάντες ἀναστήσονται, οἱ μὲν εἰς δόξαν, οἱ δὲ εἰς ἀτιμίαν, καὶ κρινεῖ Κύριος⁴⁴ ἐν πρώτοις τὸν Ἰσραὴλ⁴⁵ περὶ τῆς *ἀδικίας αὐτῶν⁴⁶ [ὅτι παραγενόμενον⁴⁷ Θεὸν⁴⁴ ἐν σαρκί⁴⁸, οὐκ ἐπίστευσαν αὐτῷ⁴⁹].'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/008.yaml
  text: And all will rise, some to glory and some to dishonor; and the Lord will judge Israel first concerning their unrighteousness, [because when God came to them in flesh, they did not believe him].
translation:
  language: de
  text: Und alle werden auferstehen, die einen zur Herrlichkeit, die anderen zur Schande. Der Herr wird zuerst Israel wegen ihrer Ungerechtigkeit richten, [weil sie Gott nicht glaubten, als er im Fleisch kam].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der in eckige Klammern gesetzte Satz ist auch im zugrunde gelegten griechischen Editionstext als textlich unsicher beziehungsweise möglicherweise sekundär gekennzeichnet.
    reason: Die textkritische Markierung der Quelle muss für Leserinnen und Leser transparent bleiben.
lexical_decisions:
- source_word: ἀναστήσονται
  choice: werden auferstehen
  rationale: Gibt den eschatologischen Sinn des griechischen Verbs präzise und in geläufiger deutscher Bibelsprache wieder.
- source_word: δόξαν
  choice: Herrlichkeit
  rationale: Bewahrt den religiös-eschatologischen Gehalt von δόξα und entspricht zugleich würdigem modernem Deutsch.
- source_word: ἀτιμίαν
  choice: Schande
  rationale: Drückt den Gegensatz zu Herrlichkeit natürlicher und kräftiger aus als das im Deutschen schwächere „Unehre“.
- source_word: ἐν πρώτοις
  choice: zuerst
  rationale: Gibt die naheliegende zeitliche Bedeutung wieder, ohne eine Rangordnung oder eine nicht ausdrücklich genannte Vergleichsgruppe einzuführen.
- source_word: ἀδικίας
  choice: Ungerechtigkeit
  rationale: Bewahrt die moralische und rechtliche Bedeutungsbreite des griechischen Ausdrucks.
- source_word: ἐν σαρκί
  choice: im Fleisch
  rationale: Erhält die konkrete theologische Ausdrucksweise des griechischen Textes, statt sie deutend mit „als Mensch“ aufzulösen.
theological_decisions:
- issue: Identität Gottes in der eingeklammerten Aussage
  choice: „weil sie Gott nicht glaubten, als er im Fleisch kam“
  alternative: „weil sie ihm nicht glaubten, als Gott im Fleisch kam“
  rationale: Die gewählte Fassung bildet Θεόν als Bezugsgröße und αὐτῷ als auf Gott zurückweisendes Pronomen verständlich ab, ohne die Aussage über das Kommen Gottes im Fleisch abzuschwächen oder weiter dogmatisch auszudeuten.
- issue: Textstatus des letzten Begründungssatzes
  choice: Eckige Klammern im Haupttext beibehalten und mit [a] erläutern
  alternative: Den Satz ohne Kennzeichnung in den Fließtext aufnehmen oder auslassen
  rationale: Die Ausgangsedition kennzeichnet den Abschnitt durch eckige Klammern. Die Übersetzung bewahrt diese textkritische Unsicherheit sichtbar, statt sie stillschweigend zu entscheiden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzstruktur. Traditionelle theologische Schlüsselbegriffe wie „auferstehen“, „Herrlichkeit“, „Ungerechtigkeit“ und „im Fleisch“ bleiben erhalten; unnötige Archaismen werden vermieden.
