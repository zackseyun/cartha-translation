base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/003.yaml
  text: Therefore, each one should practice truth toward his neighbor, and keep the law of the Lord and his commandments.
translation:
  language: de
  text: Darum soll jeder seinem Nächsten gegenüber wahrhaftig handeln und das Gesetz des Herrn und seine Gebote befolgen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποιήσατε ... ἀλήθειαν
  choice: soll ... wahrhaftig handeln
  rationale: Die wörtliche Wendung „Wahrheit tun“ klingt im modernen Deutschen unnatürlich. „Wahrhaftig handeln“ bewahrt den praktischen Sinn des griechischen Ausdrucks.
- source_word: ἕκαστος πρὸς τὸν πλησίον αὐτοῦ
  choice: jeder seinem Nächsten gegenüber
  rationale: Gibt sowohl den individuellen Bezug von ἕκαστος als auch die relationale Bedeutung von πρός präzise und idiomatisch wieder.
- source_word: τὸν νόμον Κυρίου, καὶ τὰς ἐντολὰς αὐτοῦ φυλάξατε
  choice: das Gesetz des Herrn und seine Gebote befolgen
  rationale: „Befolgen“ ist eine natürliche Wiedergabe von φυλάσσω im Zusammenhang mit Gesetz und Geboten; beide koordinierten Objekte bleiben ausdrücklich erhalten.
theological_decisions:
- issue: Verhältnis von „Gesetz“ und „Geboten“
  choice: Beide Begriffe werden getrennt genannt.
  alternative: „Das Gesetz, nämlich die Gebote des Herrn“
  rationale: Der griechische Text verbindet νόμον und ἐντολάς mit καί und setzt sie nicht ausdrücklich gleich; die Übersetzung bewahrt diese offene Beziehung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung ist für heutige Leser geglättet, ohne Inhaltselemente auszulassen oder die paränetische Aufforderung abzuschwächen.
