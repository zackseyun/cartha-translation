source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: X. Ὅτε¹ δὲ *ἦν Ἰωσὴφ ἐν Αἰγύπτῳ², ἐπεθύμουν ἰδεῖν τὴν εἰδέαν³ αὐτοῦ Γκαὶ τὴν μόρφωσιν⁴ τῆς ὄψεως αὐτοῦ⁵. καὶ δι᾽ εὐχῶν Ἰακὼβ τοῦ πατρός μου⁶ εἶδον Γαὐτόν, ἐν ἡμέρᾳ γρηγορῶν, *καθ᾽ ὃ ἦν⁶ πᾶσα⁷ ἡ εἰδέα⁷ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/001.yaml
  text: When Joseph was in Egypt, I longed to see his appearance and the form of his face; and through the prayers of Jacob my father I saw him, while awake by day, just as his whole appearance was.
translation:
  language: de
  text: Als Josef in Ägypten war, sehnte ich mich danach, seine Gestalt und die Gestalt seines Gesichts zu sehen. Durch die Gebete meines Vaters Jakob sah ich ihn bei Tage, während ich wach war, so, wie seine ganze Gestalt war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδέαν
  choice: Gestalt
  rationale: Bezeichnet hier die sichtbare Erscheinung beziehungsweise das Aussehen Josefs; „Gestalt“ ist würdig und vermeidet die moderne abstrakte Bedeutung von „Erscheinung“.
- source_word: μόρφωσιν τῆς ὄψεως
  choice: die Form seines Gesichts
  rationale: Gibt die ungewöhnliche Verbindung eng am Griechischen wieder; ὄψις bezeichnet hier das Angesicht beziehungsweise Gesicht.
- source_word: δι᾽ εὐχῶν
  choice: durch die Gebete
  rationale: 'Bewahrt den instrumentalen Sinn: Die Schau geschah durch beziehungsweise aufgrund der Gebete Jakobs.'
- source_word: ἐν ἡμέρᾳ γρηγορῶν
  choice: am helllichten Tag, während ich wach war
  rationale: Gibt sowohl den Tagesbezug als auch den ausdrücklich genannten Wachzustand natürlich wieder und grenzt die Erfahrung von einem Traum ab.
- source_word: καθ᾽ ὃ ἦν πᾶσα ἡ εἰδέα αὐτοῦ
  choice: so, wie seine ganze Gestalt wirklich war
  rationale: Bewahrt den Vergleich mit Josefs tatsächlicher vollständiger Erscheinung; „wirklich“ macht das idiomatische deutsche Prädikat verständlich, ohne „genau“ in den Text einzutragen.
theological_decisions:
- issue: Art der übernatürlichen Schau
  choice: „sah ich ihn … während ich wach war“
  alternative: „erschien er mir in einer Vision“
  rationale: Der Text sagt lediglich, dass Benjamin Josef durch Jakobs Gebete im Wachzustand sah. Die Übersetzung benennt daher weder ausdrücklich eine Vision noch ihren theologischen Mechanismus.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der lange griechische Satz wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Die Wiederholung von „Gestalt“ spiegelt die Wiederaufnahme von εἰδέα im Ausgangstext.
