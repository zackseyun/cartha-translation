id: T12P.BEN.10.4
reference: Testament of Benjamin 10:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: '*Ταῦτα γὰρ ὑμῖν ἀντὶ πάσης κληρονομίας καταλειμπάνω¹⁴. καὶ ὑμεῖς Γοὖν δότε αὐτὰ¹⁵ τοῖς τέκνοις ὑμῶν *εἰς κατάσχεσιν¹⁶ αἰώνιον· οὕτω¹⁷ Γγὰρ˥ ἐποίησεν¹⁸ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/004.yaml
  text: For these things I leave to you instead of every inheritance. And you, therefore, give them to your children as an everlasting possession; for thus Abraham and Isaac and Jacob did.
translation:
  language: de
  text: Denn dies hinterlasse ich euch anstelle jeglichen Erbes. Gebt es daher auch ihr euren Kindern als ewigen Besitz weiter; denn so haben es Abraham, Isaak und Jakob getan.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα
  choice: dies
  rationale: Das neutrale Pluralpronomen verweist zusammenfassend auf die vorausgehenden Weisungen; im natürlichen Deutschen eignet sich dafür das kollektive Singularpronomen „dies“.
- source_word: ἀντὶ πάσης κληρονομίας
  choice: anstelle jeglichen Erbes
  rationale: Gibt den Ersatzgedanken von ἀντί und die umfassende Bedeutung von πάσης knapp und formal wieder.
- source_word: καταλειμπάνω
  choice: hinterlasse
  rationale: Bewahrt im Zusammenhang mit „Erbe“ den testamentarischen Klang des griechischen Verbs.
- source_word: Γοὖν
  choice: daher
  rationale: Gibt die folgernde Partikel οὖν wieder; die Stellung nach dem Pronomen wird zugunsten natürlichen deutschen Satzbaus angepasst.
- source_word: δότε
  choice: Gebt … weiter
  rationale: Der Aoristimperativ fordert zur Weitergabe der zuvor genannten Dinge an die Kinder auf; „weitergeben“ macht diese Zielrichtung idiomatisch deutlich.
- source_word: εἰς κατάσχεσιν αἰώνιον
  choice: als ewigen Besitz
  rationale: κατάσχεσις bezeichnet hier einen dauerhaften Besitz beziehungsweise ein bleibendes Gut; „als“ gibt die resultative Wendung mit εἰς natürlich wieder.
theological_decisions:
- issue: Art des hinterlassenen Erbes
  choice: Die vorausgehenden Weisungen werden bildlich als Ersatz für jedes materielle Erbe dargestellt.
  alternative: Die Aussage als rechtliche Aufhebung jedes sonstigen Erbteils zu verstehen.
  rationale: Der Kontext und die Gegenüberstellung mit κληρονομία sprechen für eine testamentarische Metapher, ohne eine konkrete erbrechtliche Regel festzulegen.
- issue: Bedeutung von αἰώνιον
  choice: „ewig“ wird unmittelbar beibehalten.
  alternative: „dauerhaft“ oder „für alle Zeiten“.
  rationale: Die formale Wiedergabe bewahrt die mögliche starke zeitliche und theologische Tragweite, ohne sie auf bloße Langfristigkeit zu reduzieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit testamentarischem Ton. Die Satzstruktur bleibt quellennah, wird aber für flüssiges Deutsch moderat umgestellt. Keine Fußnoten erforderlich.
