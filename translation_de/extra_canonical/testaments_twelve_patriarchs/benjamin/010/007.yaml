  to: Dann werden auch wir auferstehen, jeder auf unserem Zepter,[a] und den König der Himmel anbeten – [ihn, der auf der Erde in Menschengestalt und in Niedrigkeit erschien; und alle, die auf der Erde an ihn glauben,[b] werden sich mit ihm freuen].[c]
  rationale: Eine sichere Korrektur ist erforderlich, weil die Übersetzung von σκῆπτρον durch »Thron« und die Änderung von ἡμῶν (»unserem«) zu »seinem« den Wortlaut und dessen offene Schwierigkeit verdecken. Die Revision stellt die wörtliche Bildsprache im Haupttext wieder her und kennzeichnet ihre Unsicherheit in einer zurückhaltenden Fußnote. Der eingeklammerte Text bleibt vollständig in eckigen Klammern; die abweichende jüngste englische Revisionsnotiz wird nicht zugrunde gelegt, weil sie dem angegebenen griechischen Text nicht entspricht.
