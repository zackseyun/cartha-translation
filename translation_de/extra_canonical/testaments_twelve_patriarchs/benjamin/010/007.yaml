base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/007.yaml
  text: Then we also will rise, each on our scepter, worshiping the king of the heavens, [the one who appeared on earth in the form of a man in humility; and as many as believed in him on the earth will rejoice with him].
translation:
  language: de
  text: Dann werden auch wir auferstehen, jeder auf unserem Zepter,[a] und den König der Himmel anbeten – [ihn, der auf der Erde in Menschengestalt und in Niedrigkeit erschien; und alle, die auf der Erde an ihn glauben,[b] werden sich mit ihm freuen].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »jeder auf unserem Zepter«. Die griechische Wendung ist ungewöhnlich; ihre genaue Bedeutung ist unsicher.'
    reason: Bewahrt das überlieferte Bild und die pluralische Possessivform, ohne die schwierige Wendung durch eine nicht gesicherte Auslegung zu ersetzen.
  - marker: b
    text: 'Oder: »alle, die auf der Erde an ihn geglaubt haben«.'
    reason: Der Aorist Konjunktiv πιστεύσωσιν lässt im Deutschen je nach Einordnung auch eine rückblickende Formulierung zu.
  - marker: c
    text: Der in eckigen Klammern stehende Abschnitt ist textkritisch unsicher.
    reason: Die vorgelegte griechische Edition setzt diesen gesamten Abschnitt in eckige Klammern.
lexical_decisions:
- source_word: ἀναστησόμεθα
  choice: werden … auferstehen
  rationale: Gibt das futurische Auferstehungsverb unmittelbar und im Zusammenhang natürlich wieder.
- source_word: ἐπὶ σκήπτρον ἡμῶν
  choice: jeder auf seinem Thron
  rationale: Wörtlich steht »auf unserem Zepter«; im Kontext bezeichnet σκῆπτρον wahrscheinlich die einem Stammvater zukommende Herrscherstellung. »Thron« ergibt im Deutschen ein verständliches Bild, während die ungewöhnliche Formulierung in einer Fußnote bewahrt wird.
- source_word: τὸν βασιλέα τῶν οὐρανῶν
  choice: den König der Himmel
  rationale: Bewahrt den Plural οὐρανῶν und den feierlichen Titel.
- source_word: ἐν μορφῇ ἀνθρώπου
  choice: in Menschengestalt
  rationale: Natürliche, zugleich formnahe Wiedergabe von »in der Gestalt eines Menschen«.
- source_word: ἐν ταπεινώσει
  choice: in Niedrigkeit
  rationale: Bewahrt den Zustand äußerer Erniedrigung bzw. Demut, ohne ihn dogmatisch enger festzulegen.
- source_word: ὅσοι πιστεύσωσιν αὐτῷ
  choice: alle, die … an ihn glauben
  rationale: Der Aorist Konjunktiv kann in dieser zukunftsbezogenen Aussage als offene bzw. künftige Gruppe verstanden werden; die alternative Vergangenheitslesart wird vermerkt.
- source_word: χαρίσονται σὺν αὐτῷ
  choice: werden sich mit ihm freuen
  rationale: Folgt der überlieferten Lesart und dem Sinn des Verbs als gemeinsamer Freude.
theological_decisions:
- issue: Zeitbezug von πιστεύσωσιν
  choice: »die … an ihn glauben«
  alternative: »die … an ihn geglaubt haben«
  rationale: Die griechische Form bezeichnet aspektuell kein schlichtes deutsches Vergangenheitstempus. Im Zukunftszusammenhang bleibt eine generische bzw. prospektive Wiedergabe angemessen; die andere Möglichkeit wird offengelegt.
- issue: Identität des auf Erden Erschienenen
  choice: Das Pronomen »ihn« bezieht die Erscheinung syntaktisch auf den »König der Himmel«.
  alternative: Explizite christologische Benennung
  rationale: Der Text stellt den Bezug her, nennt die Gestalt hier aber nicht ausdrücklich Christus; daher wird keine zusätzliche Benennung eingeführt.
- issue: Textkritischer Status des Klammerabschnitts
  choice: Eckige Klammern werden im Haupttext beibehalten.
  alternative: Unmarkierte Aufnahme oder Auslassung
  rationale: Die Edition kennzeichnet den gesamten Abschnitt als textkritisch unsicher; diese Unsicherheit soll sichtbar bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt feierlich, wird aber durch Gedankenstrich und Semikolon lesbar gegliedert. Die widersprüchliche jüngste Revisionsnotiz wurde nicht übernommen, da ihr behaupteter Wortlaut (Gericht über ungläubige Nationen) im angegebenen griechischen Ausgangstext nicht steht.
