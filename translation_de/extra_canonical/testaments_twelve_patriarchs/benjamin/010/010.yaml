source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἐλέγξει ἐν τοῖς ἐκλεκτοῖς *τῶν ἐθνῶν⁵⁸ τὸν Ἰσραήλ, ὥσπερ ἤλεγξεν τὸν Ἡσαῦ ἐν τοῖς Μαδιωαίοις τοῖς †ἀπατήσασιν⁵⁹ *ἀδελφοὺς αὐτῶν⁶⁰ [γενέσθαι διὰ τῆς πορνείας καὶ τῆς εἰδωλολατρείας, καὶ⁶¹ ἀπηλλοτριώθησαν Θεοῦ]⁶², γενόμενοι⁶³ οὖν⁶⁴ τέκνα ἐν μερίδι φοβουμένων⁶⁵ Κύριον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/010.yaml
  text: And he will convict Israel among the chosen of the nations, just as he convicted Esau among the Midianites, who deceived their brothers [to become through fornication and idolatry, and they were alienated from God], thus becoming children in the portion of those who fear the Lord.
translation:
  language: de
  text: Und er wird Israel unter den Erwählten aus den Völkern überführen, wie er Esau unter den Midianitern überführte, die ihre Brüder dazu verführten, [durch Unzucht und Götzendienst so zu werden; und sie wurden Gott entfremdet][a], und so Kinder im Anteil derer wurden, die den Herrn fürchten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der eingeklammerte griechische Wortlaut ist textlich und syntaktisch unsicher. Wörtlich steht ungefähr: „zu werden durch Unzucht und Götzendienst, und sie wurden Gott entfremdet“; worauf „zu werden“ zielt und auf wen sich die folgenden Mehrzahlformen beziehen, bleibt unklar.'
    reason: Kennzeichnet die bereits in der Edition markierte unsichere Passage und bewahrt ihre echte grammatische und inhaltliche Mehrdeutigkeit.
lexical_decisions:
- source_word: ἐλέγξει / ἤλεγξεν
  choice: wird … überführen / überführte
  rationale: „Überführen“ bewahrt den gerichtlichen und zugleich zurechtweisenden Sinn von ἐλέγχω, ohne vorschnell zwischen bloßem Tadeln, Entlarven und Verurteilen zu entscheiden.
- source_word: ἐν τοῖς ἐκλεκτοῖς τῶν ἐθνῶν
  choice: unter den Erwählten aus den Völkern
  rationale: Gibt ἐν lokal bzw. relational mit „unter“ wieder und lässt die Erwählten als eine aus den Völkern stammende Gruppe erkennen; ein möglicherweise instrumentaler Sinn („durch“) wird nicht erzwungen.
- source_word: ἀπατήσασιν
  choice: die … dazu verführten
  rationale: Im Zusammenhang mit Unzucht und Götzendienst klingt „verführen“ im Deutschen natürlicher als „täuschen“ und kann sowohl Irreführung als auch moralische Verleitung ausdrücken.
- source_word: ἀπηλλοτριώθησαν Θεοῦ
  choice: sie wurden Gott entfremdet
  rationale: Bewahrt die passive Form und die Beziehungstrennung, die ἀπαλλοτριόω bezeichnet.
- source_word: ἐν μερίδι
  choice: im Anteil
  rationale: Eine formnahe Wiedergabe, die offenlässt, ob μερίς einen zugewiesenen Anteil, eine Zugehörigkeit oder ein Erbteil meint.
theological_decisions:
- issue: Die Rolle der Erwählten aus den Völkern beim Überführen Israels
  choice: „unter den Erwählten aus den Völkern“
  alternative: „durch die Erwählten aus den Völkern“
  rationale: Das griechische ἐν kann hier relational/lokal oder instrumental verstanden werden. Die Hauptübersetzung folgt der weniger deutenden Lesart und macht die Erwählten nicht ausdrücklich zu handelnden Richtern.
- issue: Spannung zwischen Gottentfremdung und der Zugehörigkeit zu den Gottesfürchtigen
  choice: Die Spannung bleibt im Satz stehen.
  alternative: Den letzten Satzteil auf eine andere Personengruppe beziehen oder erklärend umformulieren.
  rationale: Der überlieferte Wortlaut und seine Bezüge sind schwierig. Eine harmonisierende Zuordnung würde mehr festlegen, als der griechische Text sicher erkennen lässt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Wiederholung von „überführen“ bildet die griechische Wiederholung desselben Verbs ab. Die ungewöhnliche Wendung „im Anteil derer“ bleibt bewusst formnah, und die schwierige Satzfügung wird nicht theologisch geglättet.
