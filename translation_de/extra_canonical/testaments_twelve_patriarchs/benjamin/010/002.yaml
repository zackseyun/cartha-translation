- source_word: Γινώσκετε οὖν
  choice: So wisst nun
  rationale: Bewahrt sowohl den folgernden Charakter von οὖν als auch den imperativischen Sinn von Γινώσκετε in würdigem, verständlichem Deutsch.
- source_word: ἀποθνῄσκω
  choice: ich sterbe
  rationale: Entspricht dem griechischen Präsens unmittelbar und lässt offen, ob der gegenwärtig einsetzende Vorgang oder der unmittelbar bevorstehende Tod betont ist.
