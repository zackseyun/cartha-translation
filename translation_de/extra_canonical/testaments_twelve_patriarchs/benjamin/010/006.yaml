source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ τότε²⁶ ὄψεσθε²⁷ Ἐνὼχ *καὶ Σήθ²⁸, καὶ²⁹ ᾿Αβραάμ, καὶ²⁹ Ἰσαὰκ καὶ Ἰακὼβ ἀνασταμένους³⁰ ἐκ δεξιῶν Γαὐτοῦ˥³¹ *ἐν ἀγαλλιάσει³².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/010/006.yaml
  text: And then you will see Enoch and Seth and Abraham and Isaac and Jacob raised up at his right hand in rejoicing.
translation:
  language: de
  text: Und dann werdet ihr Henoch und Set und Abraham und Isaak und Jakob sehen, zu seiner Rechten auferstanden und in Freude.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄψεσθε
  choice: werdet ihr … sehen
  rationale: Gibt das Futur des Verbs unmittelbar und natürlich wieder.
- source_word: ἀνασταμένους
  choice: wie sie … auferstanden sind
  rationale: Das Partizip von ἀνίστημι bezeichnet hier im eschatologischen Zusammenhang am ehesten das Auferstehen; die deutsche Konstruktion ordnet es verständlich dem Sehen unter.
- source_word: ἐκ δεξιῶν αὐτοῦ
  choice: zu seiner Rechten
  rationale: Idiomatich-dignifizierende Wiedergabe der Ehrenstellung an seiner rechten Seite; das griechische ἐκ ist hier in der überlieferten Form ungewöhnlich.
- source_word: ἐν ἀγαλλιάσει
  choice: und jubeln
  rationale: Gibt den Zustand übersichtlich und in natürlichem modernem Deutsch wieder, ohne den Sinn über bloße große Freude hinaus auszudehnen.
theological_decisions:
- issue: Bedeutung von ἀνασταμένους
  choice: auferstanden
  alternative: aufgestanden
  rationale: Der Zukunfts- und Schaukontext sowie die Reihe verstorbener Glaubensgestalten sprechen für Auferstehung; das zugrunde liegende Verb kann für sich genommen auch allgemeiner „aufstehen“ bedeuten.
- issue: Bezug des Pronomens αὐτοῦ
  choice: seiner
  alternative: ausdrückliche Identifizierung der Bezugsperson
  rationale: Der vorgelegte Vers nennt den Bezugsträger nicht. Das Pronomen bleibt daher wie im Griechischen unaufgelöst, statt eine christologische oder andere Identifikation einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Namen folgen den geläufigen deutschen Formen. Die syntaktische Spannung des griechischen Partizips wird natürlich wiedergegeben, während der unbestimmte Bezug von „seiner“ erhalten bleibt.
