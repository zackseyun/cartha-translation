id: T12P.BEN.11.3
reference: Testament of Benjamin 11:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ἕως¹⁹ συντελείας *τοῦ αἰῶνος²⁰ ἔσται ἐν συναγωγαῖς²¹ ἐθνῶν καὶ ἐν τοῖς ἄρχουσιν αὐτῶν, ὡς μουσικὸν μέλος ἐν στόματι πάντων²².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/003.yaml
  text: Until the consummation of the age he shall be in the assemblies of the nations and among their rulers, like a musical strain in the mouth of all.
translation:
  language: de
  text: Bis zur Vollendung des Zeitalters wird er in den Versammlungen der Völker und unter ihren Herrschern sein, wie eine Melodie im Mund aller.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἕως συντελείας τοῦ αἰῶνος
  choice: Bis zur Vollendung des Zeitalters
  rationale: Gibt die zeitliche Wendung formal und verständlich wieder; »Zeitalter« bewahrt den möglichen endzeitlichen Sinn von αἰών, ohne ihn auf »Welt« festzulegen.
- source_word: ἐν συναγωγαῖς ἐθνῶν
  choice: in den Versammlungen der Völker
  rationale: συναγωγή bezeichnet hier allgemein eine Versammlung; »Völker« wahrt die Mehrdeutigkeit von ἔθνη gegenüber der engeren Wiedergabe »Heiden«.
- source_word: ἐν τοῖς ἄρχουσιν αὐτῶν
  choice: unter ihren Herrschern
  rationale: Natürliches Deutsch für die Zugehörigkeit beziehungsweise Gegenwart im Kreis ihrer führenden Amtsträger.
- source_word: ὡς μουσικὸν μέλος ἐν στόματι πάντων
  choice: wie eine Melodie im Mund aller
  rationale: »Melodie« trifft μουσικὸν μέλος idiomatisch; »im Mund aller« erhält das bildhafte Lob beziehungsweise Weitertragen durch alle.
theological_decisions:
- issue: Endzeitlicher Ausdruck συντέλεια τοῦ αἰῶνος
  choice: Vollendung des Zeitalters
  alternative: Ende der Welt
  rationale: Die gewählte Fassung bewahrt die eschatologische Spannung, ohne αἰών als physische Welt zu konkretisieren.
- issue: Bezug des unausgesprochenen Subjekts in ἔσται
  choice: er
  alternative: es
  rationale: Der Zusammenhang und die englische Konsultationsfassung weisen auf eine männliche Bezugsperson; der Vers selbst nennt sie jedoch nicht erneut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit relativ enger Bindung an die griechische Bildsprache. Keine Fußnoten erforderlich.
