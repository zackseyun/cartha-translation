  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die wesentlichen Begriffe des Griechischen zuverlässig wieder: die zeitliche Begrenzung (ἕως συντελείας τοῦ αἰῶνος), die Versammlungen der Völker, deren Herrscher sowie das Bild eines musikalischen μέλος „im Mund aller“. Das maskuline „er“ entspricht dem im Kontext vorausgesetzten Subjekt und der englischen Audit-Fassung.'
  naturalness: „Bis zur Vollendung des Zeitalters wird er in den Versammlungen der Völker und unter ihren Herrschern sein, wie eine Melodie im Mund aller“ ist verständliches, würdiges modernes Standarddeutsch. Die leicht formelhafte Wendung „Vollendung des Zeitalters“ ist angesichts des eschatologisch geprägten griechischen Ausdrucks angemessen.
  terminology: „Zeitalter“ bewahrt den Sinnspielraum von αἰών besser als eine Festlegung auf „Welt“. „Versammlungen der Völker“ vermeidet die unbegründete Einengung von συναγωγαί auf jüdische Synagogen oder von ἐθνῶν auf „Heiden“. „Melodie“ ist für μουσικὸν μέλος idiomatisch und hält das Bild bei.
