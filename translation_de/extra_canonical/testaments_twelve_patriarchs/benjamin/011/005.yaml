    rationale: Die Formulierung „… wie mein Vater Jakob und sagen“ ist keine tragfähige deutsche Konstruktion. Die syntaktische Unsicherheit von λέγων soll erläutert werden, ohne eine fehlerhafte Alternativübersetzung zu bieten.
