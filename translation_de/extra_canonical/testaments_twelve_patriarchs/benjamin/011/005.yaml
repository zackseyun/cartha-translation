  text: And through them he will visit as Jacob my father, saying, “He will fill up what is lacking in your tribe.”
translation:
  language: de
  text: 'Und durch sie wird er kommen, wie mein Vater Jakob sagte: »Er wird das Fehlende in deinem Stamm ergänzen.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich ist die Satzfügung knapp: „Und durch sie wird er kommen wie Jakob, mein Vater, sagend: …“ Das griechische λέγων („sagend“) kann sich entweder auf Jakob oder auf den nicht ausdrücklich genannten Handelnden von „wird er kommen“ beziehen.'
    reason: Bewahrt die mögliche syntaktische Zuordnung von λέγων und erläutert sie in idiomatischem Deutsch, ohne eine ungrammatische Alternativfassung zu erzeugen.
lexical_decisions:
- source_word: δι᾽ αὐτῶν
  choice: durch sie
  rationale: Gibt die Präposition διά mit dem pluralischen Pronomen αὐτῶν formal und ohne eine nicht belegte nähere Bestimmung wieder.
- source_word: φοιτήσει
  choice: wird er kommen
  rationale: φοιτάω kann ein Kommen, Aufsuchen oder wiederholtes Erscheinen bezeichnen. „Wird er kommen“ ist im Deutschen natürlich und vermeidet die Ergänzung eines im Griechischen nicht genannten Besuchsziels.
- source_word: ἀναπληρώσει
  choice: wird ausfüllen
  rationale: Bewahrt das Bild des vollständigen Auffüllens beziehungsweise Ergänzens.
- source_word: τὰ ὑστερήματα
  choice: was … fehlt
  rationale: Gibt die substantivierte Mehrzahl idiomatisch wieder, ohne die Aussage auf bestimmte Mängel einzuengen.
- source_word: φυλῆς
  choice: Stamm
  rationale: Ist im genealogisch-israelitischen Zusammenhang die übliche und sachlich passende Wiedergabe von φυλή.
theological_decisions:
- issue: Bezug von λέγων („sagend“)
  choice: 'Als Redeeinleitung zu „mein Vater Jakob“ verstanden: „wie mein Vater Jakob sagte“'
  alternative: 'Auf das Subjekt von „wird er kommen“ beziehen: „… und wird sagen“'
  rationale: Die unmittelbare Nähe zu Ἰακὼβ ὁ πατήρ μου und die Aussage über „ihn“ in der dritten Person innerhalb des Zitats sprechen dafür, Jakob als Sprecher zu verstehen. Da die griechische Form grammatisch auch zum unausgesprochenen männlichen Subjekt gehören kann, wird die Alternative in einer Fußnote offengehalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Wiederholung von „wird er“ folgt der prophetischen Redeform; unnötige archaische Wendungen und nicht im Ausgangstext genannte Ergänzungen wurden vermieden.
