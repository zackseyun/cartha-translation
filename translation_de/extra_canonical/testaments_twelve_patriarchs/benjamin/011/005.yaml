  source_fidelity: 'Die Grundstruktur wird zutreffend wiedergegeben: δι᾽ αὐτῶν ist pluralisch „durch sie“, φυλή ist hier angemessen „Stamm“, und die Rede in der dritten Person bleibt erhalten. Für φοιτήσει ist „wird er kommen“ möglich, wenn auch weniger spezifisch als „wird er aufsuchen“. Die Wiedergabe von ἀναπληρώσει mit „ausfüllen“ ist im Deutschen jedoch unnötig unidiomatisch und kann an Formulare denken lassen; „ergänzen“ gibt das Auffüllen eines Mangels treffender wieder.'
  naturalness: 'Der Haupttext ist klar und würdig. Die Fußnotenalternative ist syntaktisch nicht sauber: „wie mein Vater Jakob und sagen“ koordiniert im Deutschen einen Vergleichsausdruck mit einem Infinitiv und bildet die griechische Mehrdeutigkeit daher nicht verständlich ab.'
  terminology: „Stamm“ ist für φυλή im gegebenen Kontext die richtige etablierte Bezeichnung. „Das Fehlende“ bewahrt den offenen, kollektiven Charakter von τὰ ὑστερήματα ohne eine bestimmte Art von Mangel zu benennen.
