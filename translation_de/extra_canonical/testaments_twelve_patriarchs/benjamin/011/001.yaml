id: T12P.BEN.11.1
reference: Testament of Benjamin 11:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: XI. Καὶ οὐκέτι κληθήσομαι λύκος ἅρπαξ διὰ τὰς ἁρπαγὰς ὑμῶν ἀλλὰ [ἐργάτης Κυρίου διαδιδὼν τροφὴν τοῖς ἐργαζομένοις τὸ ἀγαθόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/001.yaml
  text: No longer shall I be called a ravening wolf because of your acts of plunder, but [a worker of the Lord, distributing food to those who do what is good].
translation:
  language: de
  text: 11 Und ich werde wegen eurer Plünderungen nicht länger ein reißender Wolf genannt werden, sondern [ein Arbeiter des Herrn, der denen Nahrung austeilt, die das Gute tun].
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λύκος ἅρπαξ
  choice: ein reißender Wolf
  rationale: Gibt das Bild eines raubgierigen bzw. Beute reißenden Wolfes idiomatisch und in Anlehnung an die geläufige biblische Ausdrucksweise wieder.
- source_word: διὰ τὰς ἁρπαγὰς ὑμῶν
  choice: wegen eurer Plünderungen
  rationale: ἁρπαγή bezeichnet gewaltsames Rauben oder Plündern; der Plural und das Possessivpronomen bleiben erhalten.
- source_word: ἐργάτης Κυρίου
  choice: ein Arbeiter des Herrn
  rationale: Bewahrt die konkrete Arbeitsmetapher von ἐργάτης und die formale Gottesbezeichnung Κυρίου.
- source_word: διαδιδὼν τροφήν
  choice: der … Nahrung austeilt
  rationale: Das Partizip wird als natürlicher deutscher Relativsatz wiedergegeben; διαδίδωμι bezeichnet das Verteilen bzw. Austeilen.
- source_word: τοῖς ἐργαζομένοις τὸ ἀγαθόν
  choice: denen …, die das Gute tun
  rationale: Gibt die substantivierte Partizipialkonstruktion verständlich wieder, ohne sie unnötig zu 'Arbeit am Guten' zu verengen.
theological_decisions:
- issue: Textkritischer Status des zweiten Satzteils
  choice: Der Abschnitt ab „ein Arbeiter des Herrn“ steht in eckigen Klammern.
  alternative: Den Abschnitt ohne Klammern als unangefochtenen Text drucken.
  rationale: Die angegebene griechische Edition kennzeichnet diesen Satzteil als eingeschobenen bzw. textkritisch fraglichen Bestandteil; diese Unsicherheit wird sichtbar bewahrt.
- issue: Bedeutung von „das Gute tun“
  choice: Die allgemeine ethische Formulierung bleibt bestehen.
  alternative: Sie ausdrücklich auf einen bestimmten religiösen Dienst oder eine bestimmte Gruppe beziehen.
  rationale: Der griechische Wortlaut nennt keine konfessionelle oder institutionelle Eingrenzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung wurde gegenüber dem Griechischen leicht geglättet; Bildsprache, Personenbezüge und die editorischen eckigen Klammern bleiben erhalten.
