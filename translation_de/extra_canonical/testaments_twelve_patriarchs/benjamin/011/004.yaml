source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἐν βίβλοις ἁγίαις ἔσται ἀναγραφόμενος, καὶ τὸ ἔργον καὶ ὁ λόγος αὐτοῦ· καὶ ἔσται ἐκλεκτὸς Θεοῦ²³ *ἕως τοῦ²⁴ αἰῶνος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/004.yaml
  text: And in holy books he shall be recorded, both his work and his word; and he shall be God's chosen one forever.
translation:
  language: de
  text: Und in heiligen Büchern wird er verzeichnet sein, sowohl sein Werk als auch sein Wort; und er wird Gottes Erwählter sein bis in Ewigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναγραφόμενος
  choice: verzeichnet
  rationale: Gibt den Sinn von schriftlich eintragen bzw. urkundlich festhalten präzise und in würdigem, verständlichem Deutsch wieder.
- source_word: τὸ ἔργον καὶ ὁ λόγος αὐτοῦ
  choice: sein Werk als auch sein Wort
  rationale: Bewahrt die sachliche Paarung von Tat/Werk und Rede/Wort sowie die Singularformen des Griechischen.
- source_word: ἐκλεκτὸς Θεοῦ
  choice: Gottes Erwählter
  rationale: Erhält die substantivische, theologisch offene Bezeichnung und vermeidet eine zusätzliche Deutung der Identität der Person.
- source_word: ἕως τοῦ αἰῶνος
  choice: bis in Ewigkeit
  rationale: Bildet die griechische Zeitformel formal nah und idiomatisch ab, ohne sie über das Gesagte hinaus zu präzisieren.
theological_decisions:
- issue: Identität und Rang des Erwählten
  choice: Gottes Erwählter
  alternative: der von Gott Erwählte
  rationale: Die knappe substantivische Form wahrt den titelartigen Klang und lässt die im Text nicht ausdrücklich erklärte Identität offen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register; die Satzparallelität und die theologische Offenheit des griechischen Textes bleiben erhalten.
