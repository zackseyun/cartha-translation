source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ ἀναστήσεται ἐν ὑστέροις] ἀγαπητὸς Κυρίου [ἐκ σπέρματος Ἰούδα καὶ Λευί]⁶ ποιῶν εὐδοκίαν *ἐν στόματι αὐτοῦ⁷, [γνῶσιν καινὴν φωτίζων πάντα τὰ ἔθνη]⁸ *φῶς γνώσεως¹⁴, ἐπεμβαίνων¹⁵ *τὸν Ἰσραὴλ¹⁶ ἐν σωτηρίᾳ, καὶ ἁρπάζων ὡς λύκος ἀπ᾽ αὐτῶν¹⁷, καὶ *διδοὺς τῇ συναγωγῇ τῶν ἐθνῶν¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/011/002.yaml
  text: And in the last times a beloved one of the Lord shall arise [from the seed of Judah and Levi], doing good pleasure with his mouth, [enlightening all the nations with new knowledge], a light of knowledge, coming upon Israel in salvation, and snatching from them like a wolf, and giving to the assembly of the nations.
translation:
  language: de
  text: Und in den letzten Zeiten wird ein Geliebter des Herrn [aus dem Samen Judas und Levis][a] auftreten. Mit seinem Mund bewirkt er Wohlgefallen,[b] [er erleuchtet alle Völker mit neuer Erkenntnis][a] – ein Licht der Erkenntnis. Er kommt mit Rettung über Israel, entreißt ihnen wie ein Wolf und gibt der Versammlung der Völker.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die in eckigen Klammern stehenden Wörter sind im zugrunde gelegten griechischen Text als textkritisch unsicher bzw. ergänzend gekennzeichnet.
    reason: Die Quellenedition und die geprüfte englische Konsultationsfassung bewahren diese Passagen in eckigen Klammern; die deutsche Fassung soll ihren unsicheren Textstatus sichtbar halten.
  - marker: b
    text: 'Wörtlich etwa: „Wohlgefallen in seinem Mund tuend“. Die griechische Formulierung ist ungewöhnlich und lässt offen, ob wohlgefälliges Reden oder das Bewirken von Wohlgefallen gemeint ist.'
    reason: Bewahrt eine echte lexikalisch-syntaktische Schwierigkeit, ohne sie stillschweigend aufzulösen.
lexical_decisions:
- source_word: ἀναστήσεται
  choice: wird … auftreten
  rationale: Gibt das Aufstehen bzw. Hervortreten einer endzeitlichen Gestalt in natürlichem Deutsch wieder, ohne notwendig eine Auferstehung zu behaupten.
- source_word: ἀγαπητὸς Κυρίου
  choice: ein Geliebter des Herrn
  rationale: Bewahrt die substantivische und relationale Formulierung des Griechischen; „der vom Herrn Geliebte“ wäre ebenfalls möglich, aber stärker ausdeutend.
- source_word: ποιῶν εὐδοκίαν ἐν στόματι αὐτοῦ
  choice: Mit seinem Mund bewirkt er Wohlgefallen
  rationale: Folgt der ungewöhnlichen griechischen Wendung eng und vermeidet, sie ohne Textgrund zu „wohlgefällige Worte sprechen“ umzudeuten.
- source_word: γνῶσιν καινὴν φωτίζων πάντα τὰ ἔθνη
  choice: er erleuchtet alle Völker mit neuer Erkenntnis
  rationale: Bewahrt „neue Erkenntnis“ als Mittel oder Inhalt der Erleuchtung und gibt πάντα τὰ ἔθνη umfassend wieder.
- source_word: φῶς γνώσεως
  choice: ein Licht der Erkenntnis
  rationale: Die knappe Nominalfügung wird als Apposition zur beschriebenen Gestalt erhalten.
- source_word: ἐπεμβαίνων τὸν Ἰσραὴλ ἐν σωτηρίᾳ
  choice: Er kommt mit Rettung über Israel
  rationale: Bewahrt die ungewöhnliche Bewegungs- bzw. Einwirkungsmetapher und den Bezug der Rettung, statt eindeutig „Israel Rettung bringen“ einzutragen.
- source_word: ἁρπάζων ὡς λύκος ἀπ᾽ αὐτῶν
  choice: entreißt ihnen etwas wie ein Wolf
  rationale: Gibt das gewaltsame Ergreifen und den Vergleich wieder; „etwas“ macht das im Griechischen fehlende ausdrückliche Objekt sichtbar, ohne es inhaltlich festzulegen.
- source_word: συναγωγῇ τῶν ἐθνῶν
  choice: Versammlung der Völker
  rationale: Übersetzt συναγωγή allgemein als Versammlung und vermeidet hier die konfessionell oder institutionell engere Wiedergabe „Synagoge“.
theological_decisions:
- issue: Identität des endzeitlichen „Geliebten“
  choice: Die Gestalt bleibt unbenannt.
  alternative: Ausdrückliche Identifizierung mit einer bestimmten messianischen oder historischen Person.
  rationale: Der vorliegende griechische Wortlaut nennt keinen Namen; eine Identifizierung würde die Auslegung in den Text eintragen.
- issue: Bedeutung von ἀναστήσεται
  choice: „wird … auftreten“
  alternative: „wird auferstehen“
  rationale: Im Kontext bezeichnet das Verb plausibel das Hervortreten einer Gestalt; die Übersetzung soll keine spezifische Auferstehungsaussage erzwingen.
- issue: Verhältnis von Israel und der Versammlung der Völker
  choice: Die syntaktische Spannung und der nicht genannte Gegenstand des Entreißens und Gebens bleiben bestehen.
  alternative: Das Entrissene ausdrücklich als Heil, Erkenntnis, Menschen oder Beute bestimmen.
  rationale: Der griechische Text lässt das Objekt unausgesprochen; eine Festlegung könnte eine bestimmte heilsgeschichtliche Deutung importieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst enger Bindung an die ungewöhnliche griechische Syntax. Textkritische Klammern bleiben erhalten. Kurze Hauptsätze verbessern die Verständlichkeit, während die Bilder „Licht der Erkenntnis“ und „wie ein Wolf“ sowie die inhaltlichen Leerstellen nicht geglättet werden.
