base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/004.yaml
  text: '1[a]. See then, my children, the outcome of the good man. Imitate the good, because of his compassion, so that you also may wear crowns of glory.


    2. For the good man does not have a darkened eye, for he shows mercy to all, even if they are sinners.


    3[b]. And even if they do not intend good toward him, by doing good he overcomes evil, being sheltered by God. He loves those who wrong him as his own soul.


    4. If anyone is glorified, he does not envy him; if anyone becomes rich, he is not jealous; if anyone is brave, he praises him; he loves the self-controlled man; he has mercy on the poor; he suffers together with the weak; he fears God.


    5. He defends the one who has the fear of the Lord; he helps the one who loves God; by admonishing, he turns back the one who rejects the Most High; and he loves, as his own soul[c], the one who has the grace of a good spirit.'
translation:
  language: de
  text: '**Testament Benjamins 4**


    **1.** Seht also, meine Kinder, wie es mit einem guten Menschen ausgeht.[a] Ahmt den Guten um seines Mitgefühls willen nach,[b] damit auch ihr Kronen der Herrlichkeit tragt.


    **2.** Denn ein guter Mensch hat kein finsteres Auge:[c] Er erbarmt sich über alle, selbst wenn sie Sünder sind.


    **3.** Auch wenn andere ihm nichts Gutes wünschen, überwindet er das Böse, indem er Gutes tut, von Gott beschützt. Diejenigen, die ihm Unrecht tun, liebt er wie sein eigenes Leben.


    **4.** Wird jemand geehrt, so beneidet er ihn nicht; wird jemand reich, so ist er nicht eifersüchtig auf ihn; ist jemand mutig, so lobt er ihn. Den Besonnenen liebt er, über den Armen erbarmt er sich, mit dem Schwachen leidet er, und Gott fürchtet er.


    **5.** Wer die Gnade eines guten Geistes besitzt, den liebt er wie sein eigenes Leben.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dem klaren Kapitelanfang gehen in der Überlieferung schwer einzuordnende Zeilen über das „Lamm Gottes“ und den Tod eines Schuldlosen für Gottlose voraus. Sie wurden hier nicht in den Haupttext aufgenommen.
    reason: textual_variant
  - marker: b
    text: 'Der griechische Wortlaut dieses Satzteils ist unsicher. Möglich ist auch: „Ahmt das Gute nach, wegen seines Mitgefühls.“'
    reason: textual_variant
  - marker: c
    text: „Ein finsteres Auge“ kann auch „ein böses Auge“ bedeuten und bezeichnet dann eine neidische oder missgünstige Haltung.
    reason: lexical_alternative
  - marker: d
    text: Einige Textzeugen bieten an dieser Stelle eine längere Aufzählung von Tugenden. Der hier übersetzte griechische Text enthält nur den kürzeren Satz.
    reason: textual_variant
lexical_decisions:
- source_word: τέλος
  choice: wie es … ausgeht
  rationale: Gibt den beobachtbaren Ausgang oder das Ergebnis eines guten Lebens wieder, ohne die mögliche Bedeutung „Ende“ ganz auszublenden.
- source_word: μιμήσασθε
  choice: ahmt … nach
  rationale: Bewahrt den direkten Imperativ zur sittlichen Nachahmung.
- source_word: εὐσπλαγχνία
  choice: Mitgefühl
  rationale: Bezeichnet tiefes, herzliches Erbarmen; „Mitgefühl“ ist gegenwärtig und verständlich.
- source_word: σκοτεινὸν ὀφθαλμόν
  choice: finsteres Auge
  rationale: Erhält das griechische Bild; eine Fußnote erläutert die mögliche Bedeutung als neidische oder missgünstige Gesinnung.
- source_word: ἐλεεῖ
  choice: erbarmt sich
  rationale: Bewahrt den aktiven Sinn barmherzigen Handelns und den würdevollen ethischen Ton.
- source_word: νικᾷ τὸ κακόν
  choice: überwindet das Böse
  rationale: Gibt den sittlichen Gegensatz knapp und idiomatisch wieder.
- source_word: σκεπόμενος ὑπὸ τοῦ Θεοῦ
  choice: denn Gott beschützt ihn
  rationale: Gibt das Bild göttlicher Deckung als natürliche deutsche Aussage des Schutzes wieder.
- source_word: ἀδικοῦντας
  choice: diejenigen, die ihm Unrecht tun
  rationale: Bezeichnet persönliches Unrecht, auf das der Gute mit Liebe reagiert.
- source_word: δοξάζηται
  choice: geehrt wird
  rationale: Im gesellschaftlichen Zusammenhang ist empfangene Ehre gemeint, nicht notwendig kultische Verherrlichung.
- source_word: σώφρονα
  choice: Besonnenen
  rationale: Vereint Selbstbeherrschung und vernünftige Mäßigung, ohne den Begriff auf nur eine dieser Nuancen festzulegen.
- source_word: συμπάσχει
  choice: leidet … mit
  rationale: Bewahrt die starke Vorstellung wirklicher Anteilnahme am Leiden.
- source_word: κατὰ τὴν ψυχὴν αὐτοῦ
  choice: wie sein eigenes Leben
  rationale: ψυχή kann hier die eigene Person beziehungsweise das eigene Leben bezeichnen; diese Formulierung ist im Deutschen natürlicher als „wie seine eigene Seele“.
theological_decisions:
- issue: Dem Kapitelanfang vorausgehendes christologisches Material
  choice: Nicht in den Haupttext aufgenommen, sondern in einer Fußnote dokumentiert.
  alternative: Die Zeilen über das „Lamm Gottes“ und den stellvertretenden Tod als Anfang von Kapitel 4 aufnehmen.
  rationale: Die vorgelegte griechische Kapiteleinheit beginnt kohärent mit Ἴδετε οὖν, τέκνα μου; die vorausgehenden Zeilen sind textlich versetzt oder anderweitig überlieferungsgeschichtlich problematisch.
- issue: Bedeutung des „finsteren Auges“
  choice: Das Bild bleibt im Haupttext erhalten.
  alternative: Direkt als „neidische Gesinnung“ oder „böses Auge“ übersetzen.
  rationale: Der griechische Ausdruck ist bildhaft und mehrdeutig; der Zusammenhang erläutert seine ethische Stoßrichtung, ohne dass die Übersetzung sie festlegen muss.
- issue: Umfang von Vers 5
  choice: Übersetzt wird ausschließlich der kurze Satz des vorgelegten griechischen Ausgangstextes.
  alternative: Die in anderen Zeugen und in der englischen Konsultationsschicht belegte längere Tugendfolge aufnehmen.
  rationale: Die längere Folge ist im bereitgestellten griechischen Text nicht vorhanden. Ihre Aufnahme in den Haupttext würde den gewählten Ausgangstext überschreiten; die Variante wird daher nur angemerkt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, paränetischem Ton. Kurze Parallelglieder erhalten die rhetorische Struktur des Tugendkatalogs. Archaismen werden vermieden; markante Bilder und echte textliche Mehrdeutigkeiten bleiben im Haupttext stehen und werden knapp erläutert.
