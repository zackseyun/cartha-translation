revisions:
- from: '**Testament Benjamins 4**


    **1.** Seht also, meine Kinder, wie es mit einem guten Menschen ausgeht.[a] Ahmt ihn in seiner Güte nach, die aus seinem Mitgefühl erwächst,[b] damit auch ihr Kronen der Herrlichkeit tragt.


    **2.** Denn ein guter Mensch hat kein finsteres Auge:[c] Er erbarmt sich über alle, selbst wenn sie Sünder sind.


    **3.** Auch wenn andere ihm nichts Gutes wünschen, überwindet er das Böse, indem er Gutes tut, denn Gott beschützt ihn. Diejenigen, die ihm Unrecht tun, liebt er wie sein eigenes Leben.


    **4.** Wird jemand geehrt, so beneidet er ihn nicht; wird jemand reich, so ist er nicht eifersüchtig auf ihn; ist jemand mutig, so lobt er ihn. Den Besonnenen liebt er, über den Armen erbarmt er sich, mit dem Schwachen leidet er, und Gott fürchtet er.


    **5.** Wer die Gnade eines guten Geistes besitzt, den liebt er wie sein eigenes Leben.[d]


    [a] Dem klaren Kapitelanfang gehen in der Überlieferung schwer einzuordnende Zeilen über das „Lamm Gottes“ und den Tod eines Schuldlosen für Gottlose voraus. Sie wurden hier nicht in den Haupttext aufgenommen.


    [b] Der griechische Wortlaut dieses Satzteils ist unsicher. Möglich ist auch: „Ahmt das Gute nach, wegen seines Mitgefühls.“


    [c] „Ein finsteres Auge“ kann auch „ein böses Auge“ bedeuten und bezeichnet dann eine neidische oder missgünstige Haltung.


    [d] Einige Textzeugen bieten an dieser Stelle eine längere Aufzählung von Tugenden. Der hier übersetzte griechische Text enthält nur den kürzeren Satz.'
