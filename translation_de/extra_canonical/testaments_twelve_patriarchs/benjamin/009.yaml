  terminology: Die Wiedergaben »Erbteil«, »Heil«, »einziggeborener Prophet«, »der Herr«, »an einem Holz erhöht« und »Hades« bewahren die Aussage und Offenheit des Ausgangstextes. Die Fußnote zu μονογενής sollte die echte lexikalische Alternative nennen, ohne die nicht vom Wort selbst geforderte Erklärung einer »besonderen Herkunft« einzutragen.
  issues:
  - severity: low
    issue: »ein Tempel Gottes entstehen«
    rationale: γενήσεται bedeutet hier zunächst »wird sein/sich befinden«. »Entstehen« fügt eine Aussage über die Errichtung hinzu, die der Text nicht ausdrücklich macht.
  - severity: low
    issue: »wie ausgegossenes Feuer«
    rationale: ἐκχυνόμενον ist ein präsentisches Partizip; »wie Feuer, das ausgegossen wird« bewahrt den Vorgangscharakter besser.
  - severity: low
    issue: 'Fußnote b: »besondere Herkunft«'
    rationale: Die Alternative »einzigartig« ist angemessen. Die zusätzliche Erklärung einer besonderen Herkunft ist jedoch stärker interpretierend, als die lexikalische Anmerkung erfordert.
