    reason: lexical_alternative
  - marker: e
    text: »Hades« bezeichnet die Totenwelt, nicht notwendigerweise den endgültigen Ort der Strafe.
    reason: cultural_note
lexical_decisions:
- source_word: πράξεις ἀπὸ λογίων Ἐνὼχ τοῦ δικαίου
  choice: aus den Aussprüchen Henochs, des Gerechten, eure Taten voraus
  rationale: Die ungewöhnliche Verbindung von »Taten« und »Aussprüchen« bleibt erkennbar, wird aber als prophetische Ankündigung in verständliches Deutsch gefasst.
- source_word: πορνεύσετε πορνείαν Σοδόμων
  choice: ihr werdet Unzucht treiben, die Unzucht Sodoms
  rationale: Die Wiederholung von Verb und Substantiv wird zur Wahrung des emphatischen griechischen Ausdrucks nachgebildet; der Genitiv »Sodoms« bleibt in seiner allusiven Offenheit erhalten.
- source_word: ἀπολεῖσθε ἕως βραχύ
  choice: für kurze Zeit zugrunde gehen
  rationale: Die zeitliche Begrenzung des Gerichts vor der anschließenden Erneuerung wird ausdrücklich bewahrt.
- source_word: ἀνανεωθήσεσθε
  choice: wieder erneuert werden
  rationale: Das Passiv und der Gedanke erneuter Erneuerung werden beibehalten, ohne eine spezifische Heilslehre einzutragen.
- source_word: ἐν μερίδι ὑμῶν
  choice: in eurem Erbteil
  rationale: Der Ausdruck verweist wahrscheinlich auf Benjamins zugeteiltes Stammesgebiet; »Erbteil« bewahrt den biblischen Zuteilungs- und Erbsinn.
- source_word: ὁ ἔσχατος ἔνδοξος ὑπὲρ τὸν πρῶτον
  choice: Der letzte wird herrlicher sein als der erste
  rationale: Die knappe Gegenüberstellung des letzten und ersten Tempels beziehungsweise Zustands wird nicht näher festgelegt.
- source_word: τὸ σωτήριον αὐτοῦ
  choice: sein Heil
  rationale: »Heil« wahrt die kompakte prophetische Sprache und kann sowohl Rettung als auch die von Gott gewirkte Heilsgabe bezeichnen.
- source_word: ἐν ἐπισκοπῇ μονογενοῦς προφήτου
  choice: in der Heimsuchung eines einziggeborenen Propheten
  rationale: »Heimsuchung« erhält den feierlichen Sinn eines entscheidenden göttlichen Kommens; »einziggeboren« wahrt die auffällige und theologisch spannungsreiche Wortwahl μονογενής, während »einzigartig« in der Fußnote genannt wird.
- source_word: Κύριος ὑβρισθήσεται
  choice: der Herr wird geschmäht
  rationale: Das ausdrücklich genannte Subjekt »der Herr« bleibt stehen; »geschmäht« gibt die entehrende Misshandlung wieder, ohne den Referenten umzudeuten.
- source_word: ἐπὶ ξύλου ὑψωθήσεται
  choice: an einem Holz erhöht werden
  rationale: Die konkrete, zugleich deutungsoffene Wendung wird wörtlich bewahrt und nicht stillschweigend zu »Kreuz« präzisiert.
- source_word: τὸ ἅπλωμα τοῦ ναοῦ
  choice: der Tempelbehang
  rationale: Das ungewöhnliche Wort ἅπλωμα wird nicht einfach mit dem üblichen Fachwort für den Tempelvorhang gleichgesetzt; »Behang« bleibt natürlich und bewahrt die lexikalische Besonderheit.
- source_word: ἐκ τοῦ ᾅδου
  choice: aus dem Hades
  rationale: Der traditionsgeschichtliche Begriff wird transliteriert, damit er nicht mit der endgültigen Hölle gleichgesetzt wird.
- source_word: ταπεινὸς
  choice: demütig
  rationale: Das Wort kann Niedrigkeit, Bescheidenheit oder Erniedrigung ausdrücken. »Demütig« bewahrt die personale Beschreibung, ohne sie ausdrücklich als erzwungene Erniedrigung festzulegen.
theological_decisions:
- issue: Aufnahme der textkritisch markierten Verse 3–5
  choice: Die Verse stehen im Haupttext und werden mit einer textkritischen Fußnote gekennzeichnet.
  alternative: Die Verse als spätere Erweiterung auslassen oder nur in einer Fußnote wiedergeben.
  rationale: Der gelieferte griechische Ausgangstext enthält die Verse, markiert sie aber durch Klammern als textlich besonders. Übersetzung und Fußnote bilden beides transparent ab.
- issue: Bedeutung von μονογενοῦς προφήτου
  choice: »eines einziggeborenen Propheten«
  alternative: »eines einzigartigen Propheten«
  rationale: Die ungewöhnliche, theologisch aufgeladene Formulierung wird nicht abgeschwächt. Die mögliche qualitative Bedeutung »einzigartig« wird in der Fußnote offengelegt.
- issue: Referent von »der Herr« in Vers 3
  choice: »der Herr wird geschmäht«
  alternative: »der Prophet« oder »der Gesalbte des Herrn wird geschmäht«
  rationale: Der griechische Text nennt ausdrücklich Κύριος. Eine identifizierende oder harmonisierende Ergänzung würde die Spannung des Textes vorzeitig auflösen.
- issue: Deutung von »an einem Holz erhöht«
  choice: Die wörtliche Wendung bleibt im Haupttext.
  alternative: »gekreuzigt werden«
  rationale: Der Wortlaut legt eine Hinrichtung an Holz nahe, nennt aber nicht ausdrücklich ein Kreuz. Die Übersetzung vermeidet eine über den griechischen Ausdruck hinausgehende Präzisierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetisch-testamentarischem Ton. Ungewöhnliche oder theologisch spannungsreiche Formulierungen des Griechischen werden soweit möglich bewahrt, aber durch knappe Fußnoten verständlich gemacht. Archaismen und konfessionell festgelegte Deutungen werden vermieden.
