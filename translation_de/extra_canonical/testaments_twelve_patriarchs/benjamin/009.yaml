base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/009.yaml
  text: '1. And I tell you also, from the words of Enoch the righteous, that you will commit the fornication of Sodom, and you will perish for a little while. Then you will be renewed again[b], and the kingdom of the Lord will not be among you. 2. Nevertheless, in your allotted portion there will be the temple of God, and the last will be more glorious than the first; and there the twelve tribes will be gathered, and all the nations, until the Most High sends his salvation in the visitation of an only-begotten prophet.


    3. And he will enter into the first temple, and there the Lord will be treated with outrage, and he will be lifted up on wood. 4. And the curtain-spread of the temple will be torn, and the Spirit of God will pass over to the nations, like fire being poured out. 5. And when he has gone up from Hades, he will pass from earth to heaven. And I know how lowly he will be on earth[e][d][c], and how glorious in heaven.'
translation:
  language: de
  text: '**Testament Benjamins 9**


    **1** Auch sage ich euch aus den Aussprüchen Henochs, des Gerechten, eure Taten voraus: Ihr werdet Unzucht treiben, die Unzucht Sodoms, und für kurze Zeit zugrunde gehen. Dann werdet ihr wieder erneuert werden; doch das Reich des Herrn wird nicht unter euch sein. **2** Dennoch wird in eurem Erbteil ein Tempel Gottes sein. Der letzte wird herrlicher sein als der erste. Dort werden die zwölf Stämme und alle Völker versammelt werden, bis der Höchste sein Heil in der Heimsuchung eines einziggeborenen Propheten sendet.[b]


    **3** Er wird in den ersten Tempel hineingehen, und dort wird der Herr geschmäht und an einem Holz erhöht werden.[a][c] **4** Der Tempelbehang wird zerrissen werden,[d] und der Geist Gottes wird zu den Völkern übergehen wie Feuer, das ausgegossen wird. **5** Nachdem er aus dem Hades hinaufgestiegen ist,[e] wird er von der Erde zum Himmel hinübergehen. Ich weiß, wie demütig er auf der Erde und wie herrlich er im Himmel sein wird.


    [a] Die Verse 3–5 sind in der handschriftlichen Überlieferung textlich unsicher und werden häufig als spätere Erweiterung angesehen. Sie werden hier übersetzt, weil sie im vorliegenden griechischen Text stehen.


    [b] Oder: »eines einzigartigen Propheten«.


    [c] »An einem Holz erhöht« gibt die griechische Wendung wörtlich wieder. Gemeint sein kann ein hölzerner Pfahl oder Baum.


    [d] Das ungewöhnliche griechische Wort bezeichnet etwas Ausgebreitetes oder einen Behang am Tempel; möglicherweise ist der Tempelvorhang gemeint.


    [e] »Hades« bezeichnet die Totenwelt, nicht notwendigerweise den endgültigen Ort der Strafe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Verse 3–5 sind in der handschriftlichen Überlieferung textlich unsicher und werden häufig als spätere Erweiterung angesehen. Sie werden hier übersetzt, weil sie im vorliegenden griechischen Text stehen.
    reason: textual_variant
