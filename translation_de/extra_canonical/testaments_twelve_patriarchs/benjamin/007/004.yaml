  naturalness: Die Revision verwendet modernes, würdiges Deutsch und beseitigt die unnatürliche Verbindung „durch jedes Unheil gerichtet“. „Bruderhass“ ist knapp, verständlich und dem griechischen Kompositum angemessen.
  terminology: „verwüstet“ bildet ἐρημοῦται direkt ab, ohne die konkrete Art des Untergangs festzulegen. „Zeitalter“ für αἰών ist neutraler als „Weltzeit“; die Fußnote markiert die mögliche weiterreichende Lesart, ohne sie in den Haupttext einzutragen. „Gericht“ für κρίσις bleibt erhalten.
