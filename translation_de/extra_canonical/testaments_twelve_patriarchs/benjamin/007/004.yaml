  text: Διακοσίων ἐτῶν πάσχει, καὶ ἐννακοσιοστῷ²⁶ ἔτει ἐρημοῦται²⁷· διὰ γὰρ Ἄβελ τὸν ἀδελφὸν αὐτοῦ * ἐν πᾶσι τοῖς κακοῖς ἐκρίνετο, ὁ δὲ Λαμὲχ ἐν ἑβδομηκοντάκις ἑπτά. Ὅτι³⁶ *ἕως τοῦ αἰῶνος³⁷ οἱ ὁμοιούμενοι *τῷ Καὶν³⁸ Γ*ἐπὶ φθόνῳ καὶ μισαδελφίᾳ τοιαύτῃ⁷ κολασθήσονται Γκρίσει⁷³⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/004.yaml
  text: For two hundred years he suffers, and in the nine-hundredth year he was made desolate; for because of Abel his brother he was judged in all evils, but Lamech in seventy times seven. Because to the end of the age, those who become like Cain in envy and hatred of brothers will be punished with similar judgment.
translation:
  language: de
  text: Zweihundert Jahre lang leidet er, und im neunhundertsten Jahr wird er verwüstet.[a] Denn wegen seines Bruders Abel wurde er mit allem Unheil bestraft, Lamech aber siebenundsiebzigfach.[b] Denn bis zum Ende des Zeitalters werden alle, die Kain in Neid und Bruderhass ähnlich werden, mit einem solchen Gericht bestraft.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann auch mit „wird öde gemacht“ oder „wird verlassen“ wiedergegeben werden.
    reason: Das Passiv ἐρημοῦται lässt bei einer Person die genaue Art des Untergangs bzw. der Verlassenheit offen.
  - marker: b
    text: 'Wörtlich: „Lamech aber in siebzigmal sieben“. Der griechische Satz lässt unausgesprochen, wie diese Zahl genau auf Lamechs Gericht zu beziehen ist.'
    reason: Die Vorlage ist elliptisch; die Fußnote bewahrt die daraus entstehende Deutungsoffenheit.
  - marker: c
    text: „Bis zum Ende des Zeitalters“ kann wegen der Bedeutungsbreite des griechischen Wortes auch weiterreichend verstanden werden.
    reason: αἰών kann ein Zeitalter, die Weltzeit oder in bestimmten Kontexten eine unbegrenzte Dauer bezeichnen; die knappe Wendung sollte nicht stärker festgelegt werden.
lexical_decisions:
- source_word: ἐρημοῦται
  choice: wird er zugrunde gerichtet
  rationale: Das Verb bedeutet wörtlich etwa „wird verwüstet/vereinsamt“. Bei einer Person gibt „zugrunde gerichtet“ den vernichtenden Sinn natürlich wieder, ohne die Art des Geschehens näher festzulegen.
- source_word: ἐν πᾶσι τοῖς κακοῖς
  choice: durch jedes Unheil
  rationale: Bewahrt die umfassende Aussage des Griechischen; „Unheil“ kann sowohl erlittenes Übel als auch Strafgeschehen bezeichnen.
- source_word: ἐν ἑβδομηκοντάκις ἑπτά
  choice: siebenundsiebzigfach
  rationale: Gibt die Multiplikativform knapp und verständlich wieder. Der elliptische Bezug auf Lamechs Gericht bleibt erhalten.
- source_word: ἕως τοῦ αἰῶνος
  choice: bis ans Ende der Weltzeit
  rationale: αἰών bezeichnet hier eine Weltzeit bzw. ein Zeitalter. Die Formulierung folgt dem zeitlichen Verständnis des Zusammenhangs, ohne „Ewigkeit“ festzuschreiben.
- source_word: μισαδελφίᾳ
  choice: Bruderhass
  rationale: Das seltene Substantiv bezeichnet Hass gegen den Bruder bzw. gegen Brüder; die kompakte deutsche Bildung bewahrt die Nähe zum griechischen Ausdruck.
- source_word: τοιαύτῃ κρίσει
  choice: mit einem solchen Gericht
  rationale: Bewahrt den ausdrücklichen Rückverweis auf das zuvor geschilderte Gericht, statt ihn allgemein als bloße Strafe wiederzugeben.
theological_decisions:
- issue: Bezug und Art des Gerichts über Kain und Lamech
  choice: Die knappe, teilweise elliptische Darstellung bleibt bestehen.
  alternative: Die Zahlen als genaue Lebensalter, Strafdauern oder Vergeltungsmaße ausdrücklich deuten.
  rationale: Der griechische Text nennt Leiden, Vernichtung und Gericht, erklärt aber die genaue Beziehung der Zahlen nicht eindeutig. Eine weitergehende Harmonisierung würde eine Auslegung in den Text eintragen.
- issue: Dauer der künftigen Bestrafung
  choice: „bis ans Ende der Weltzeit“
  alternative: „in Ewigkeit“
  rationale: ἕως τοῦ αἰῶνος kann unterschiedlich verstanden werden. Im gegebenen Satz ist die zeitliche Grenzformulierung naheliegend; eine ausdrückliche Lehre über endlose Strafdauer soll nicht stillschweigend festgelegt werden.
translation_notes:
  register: Moderne, würdige Standardsprache. Die ungewöhnlichen Zahlenangaben und die theologische Spannung des Gerichtsmotivs werden nicht harmonisiert. „Bruderhass“ ist bewusst prägnant und entspricht der markanten griechischen Wortbildung.
