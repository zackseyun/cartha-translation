source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Ἡ δὲ μάχαιρα⁶ ἑπτὰ κακῶν μήτηρ ἐστί. *πρῶτον συλλαμβάνει ἡ διάνοια διὰ τοῦ Βελίαρ⁷. †*Καὶ ἔστιν πρῶτον⁸ ὁ †φθόνος⁹, δεύτερον¹⁰ ἡ¹¹ †ἀπώλεια¹², τρίτον ἡ¹¹ θλῖψις, τέταρτον ἡ¹¹ θεηλασία¹³, πέμπτον ἡ¹¹ ἔνδεια, ἕκτον ἡ¹¹ ταραχή, ἕβδομον ἡ¹¹ ἐρήμωσις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/002.yaml
  text: 'And the sword is the mother of seven evils. First the mind conceives through Beliar, and these are its births: first envy, second destruction, third affliction, fourth captivity, fifth want, sixth turmoil, seventh desolation.'
translation:
  language: de
  text: Das Schwert aber ist die Mutter von sieben Übeln. Zuerst wird der Sinn durch Beliar schwanger. Das Erste ist Neid, das Zweite Verderben, das Dritte Bedrängnis, das Vierte göttliche Heimsuchung[a], das Fünfte Mangel, das Sechste Unruhe, das Siebte Verwüstung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das seltene griechische Wort θεηλασία ist in seiner genauen Bedeutung unsicher. Es scheint eine „göttliche Heimsuchung“ oder „von Gott ausgehende Strafheimsuchung“ zu bezeichnen; die oft gebotene Wiedergabe „Gefangenschaft“ entspricht nicht unmittelbar der hier vorliegenden griechischen Lesart.
    reason: θεηλασία ist ein seltenes und textlich schwieriges Wort. Die Anmerkung kennzeichnet die Unsicherheit, ohne die griechische Lesart durch die englische Glättung „captivity“ zu ersetzen.
lexical_decisions:
- source_word: μάχαιρα
  choice: Schwert
  rationale: Die konkrete Waffenbezeichnung wird entsprechend dem Zusammenhang direkt wiedergegeben.
- source_word: διάνοια
  choice: Sinn
  rationale: Bezeichnet hier das innere Denken und Wollen; „Sinn“ ist natürlich und lässt den genauen psychologischen Vorgang offen.
- source_word: συλλαμβάνει
  choice: empfängt
  rationale: Bewahrt das Bild des Empfangens beziehungsweise Schwangerwerdens, ohne die im schwierigen Text nicht ausdrücklich genannten „Geburten“ einzufügen.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Die traditionelle Namensform wird als Eigenname beibehalten.
- source_word: φθόνος
  choice: Neid
  rationale: Direkte und geläufige Entsprechung.
- source_word: ἀπώλεια
  choice: Verderben
  rationale: Deckt sowohl Untergang als auch Zerstörung ab und vermeidet eine unnötige Festlegung.
- source_word: θλῖψις
  choice: Bedrängnis
  rationale: Gibt äußeren Druck, Not und Leiden angemessen wieder.
- source_word: θεηλασία
  choice: Heimsuchung durch Gott
  rationale: Das seltene Wort bezeichnet wörtlich eine von Gott ausgehende beziehungsweise göttliche Heimsuchung; die Übersetzung bewahrt diesen Bezug.
- source_word: ἔνδεια
  choice: Mangel
  rationale: Umfasst Bedürftigkeit und Entbehrung in knapper Form.
- source_word: ταραχή
  choice: Unruhe
  rationale: Bewahrt die Bandbreite von innerer Beunruhigung bis äußerer Wirren.
- source_word: ἐρήμωσις
  choice: Verwüstung
  rationale: Gibt den Zustand des Verödet- oder Zerstörtseins wieder.
theological_decisions:
- issue: Die Wirksamkeit Beliars im Denk- und Willensvorgang
  choice: „der Sinn [empfängt] durch Beliar“
  alternative: „Beliar lässt den Sinn empfangen“ oder „der Gedanke wird von Beliar empfangen“
  rationale: Die griechische Konstruktion stellt διάνοια als Subjekt und Beliar mit διά als vermittelnde Macht dar; die Übersetzung wahrt diese Spannung, ohne ein vollständiges System dämonischer Verursachung zu formulieren.
- issue: Göttlicher Bezug von θεηλασία
  choice: „Heimsuchung durch Gott“
  alternative: „Gefangenschaft“
  rationale: Die griechische Lesart enthält ausdrücklich das Element θεη- und sollte nicht nach der glättenden englischen Wiedergabe konfessionell oder sachlich neutralisiert werden. Eine Fußnote macht die schwierige Bedeutung transparent.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Bildsprache des Empfangens und die spröde Aufzählung des griechischen Textes bleiben erhalten. Gegenüber der englischen Konsultationsfassung wird der nicht ausdrücklich im Griechischen stehende Zusatz „dies sind seine Geburten“ vermieden; die gestörte Überlieferung um „zuerst“ wird möglichst knapp und verständlich wiedergegeben.
