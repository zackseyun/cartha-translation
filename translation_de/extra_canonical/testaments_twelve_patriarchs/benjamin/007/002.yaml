revisions:
- from: 'Das Schwert aber ist die Mutter von sieben Übeln. Zuerst empfängt der Sinn durch Beliar. Und dies ist das Erste: Neid; das Zweite: Verderben; das Dritte: Bedrängnis; das Vierte: Heimsuchung durch Gott[a]; das Fünfte: Mangel; das Sechste: Unruhe; das Siebte: Verwüstung.'
  to: Das Schwert aber ist die Mutter von sieben Übeln. Zuerst wird der Sinn durch Beliar schwanger. Das Erste ist Neid, das Zweite Verderben, das Dritte Bedrängnis, das Vierte göttliche Heimsuchung[a], das Fünfte Mangel, das Sechste Unruhe, das Siebte Verwüstung.
  rationale: Die Revision korrigiert die Syntax der Aufzählung und verdeutlicht das im griechischen συλλαμβάνει enthaltene Empfängnisbild. Sie bewahrt zugleich die ungewöhnliche und nicht abschließend gesicherte Bedeutung von θεηλασία durch eine vorsichtige Haupttextwiedergabe mit erläuternder Fußnote.
