source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Διὰ τοῦτο καὶ¹⁸ ὁ Κάϊν ἑπτὰ ἐκδικίαις¹⁹ παρεδόθη²⁰ ὑπὸ τοῦ Θεοῦ²¹. *κατὰ γὰρ²² ἑκατοστὸν ἔτος²³ μίαν πληγὴν ἐπήγαγεν *ἐπʼ αὐτὸν²⁴ ⸀Κύριος²⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/003.yaml
  text: Because of this also, Cain was handed over by God to seven acts of vengeance. For every hundredth year the Lord brought one plague upon him.
translation:
  language: de
  text: Darum wurde auch Kain von Gott sieben Vergeltungen ausgeliefert. Denn alle hundert Jahre brachte der Herr eine Plage über ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο καὶ
  choice: Darum … auch
  rationale: Gibt sowohl die Folgerung als auch das ausdrücklich vorhandene καί wieder.
- source_word: ἑπτὰ ἐκδικίαις
  choice: sieben Vergeltungen
  rationale: Bewahrt den Plural und den Gedanken strafender Vergeltung, ohne ihn zu sieben einzelnen Racheakten zu verengen.
- source_word: παρεδόθη ὑπὸ τοῦ Θεοῦ
  choice: wurde … von Gott … übergeben
  rationale: Gibt das Passiv samt ausdrücklich genanntem Handelnden formal und verständlich wieder.
- source_word: κατὰ … ἑκατοστὸν ἔτος
  choice: in jedem hundertsten Jahr
  rationale: Entspricht der distributiven Bedeutung von κατά und dem Ordinalausdruck; vermeidet die unzutreffende Wiedergabe „innerhalb von hundert Jahren“.
- source_word: μίαν πληγὴν ἐπήγαγεν ἐπʼ αὐτὸν
  choice: brachte … eine Plage über ihn
  rationale: Natürliche deutsche Wiedergabe für das Zufügen beziehungsweise Heranbringen einer einzelnen Plage.
theological_decisions:
- issue: Verhältnis der sieben Vergeltungen zu den einzelnen Plagen
  choice: Keine ausdrückliche zeitliche Folge oder Gleichsetzung ergänzen
  alternative: „eine Plage nach der anderen“ oder ausdrückliche Identifikation jeder Plage mit einer Vergeltung
  rationale: Der griechische Text nennt sieben Vergeltungen und jeweils eine Plage im hundertsten Jahr, formuliert aber weder „nacheinander“ noch die genaue Beziehung ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht ungewöhnliche Wendung „Vergeltungen übergeben“ erhält die markante Bildsprache des griechischen Textes und vermeidet eine unbelegte Präzisierung.
