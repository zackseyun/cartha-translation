revisions:
- from: Darum wurde auch Kain von Gott sieben Vergeltungen übergeben. Denn in jedem hundertsten Jahr brachte der Herr eine Plage über ihn.
  to: Darum wurde auch Kain von Gott sieben Vergeltungen ausgeliefert. Denn alle hundert Jahre brachte der Herr eine Plage über ihn.
  rationale: 'Die Revision beschränkt sich auf zwei sprachlich sichere Anpassungen: eine idiomatische deutsche Entsprechung für das Passiv mit ἐκδικίαις und eine natürliche distributive Zeitformel. Weder die sieben Vergeltungen noch die einzelnen Plagen werden näher bestimmt oder miteinander gleichgesetzt.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T04:14:54Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die kausale Einleitung mit καί, das göttliche Agens, die sieben ἐκδικίαι sowie die wiederkehrende zeitliche Angabe und die einzelne πληγή grundsätzlich zutreffend wieder. „Alle hundert Jahre“ ist für κατὰ ἑκατοστὸν ἔτος idiomatischer und bewahrt die distributive Aussage ohne die unnatürliche Formulierung „in jedem hundertsten Jahr“.
  naturalness: „Jemandem Vergeltungen übergeben“ ist im modernen Standarddeutsch nicht idiomatisch und kann den Satz schwer verständlich machen. „Sieben Vergeltungen ausgeliefert“ gibt die bildhafte passive Konstruktion klar und natürlich wieder.
  terminology: „Vergeltungen“ wahrt den offenen Sinn von ἐκδικίαις (strafende Vergeltungen/Racheakte), ohne die Art oder zeitliche Zuordnung der sieben Maßnahmen zu den Plagen festzulegen. „Plage“ ist eine angemessene Wiedergabe von πληγή.
  issues:
  - severity: medium
    issue: Unidiomatische Wiedergabe von παρεδόθη ἐκδικίαις
    rationale: „sieben Vergeltungen übergeben“ ist im Deutschen keine geläufige Rektion und klingt, als würden die Vergeltungen übergeben. „sieben Vergeltungen ausgeliefert“ erhält die passive Auslieferungsmetapher und macht die Betroffenheit Kains eindeutig.
  - severity: low
    issue: Schwerfällige Zeitangabe
    rationale: „in jedem hundertsten Jahr“ ist zwar verständlich, aber deutlich weniger natürlich als „alle hundert Jahre“. Letzteres gibt die distributive Bedeutung von κατά mit ordinaler Jahresangabe passend wieder.
  revised_text: Darum wurde auch Kain von Gott sieben Vergeltungen ausgeliefert. Denn alle hundert Jahre brachte der Herr eine Plage über ihn.
  revised_footnotes: []
  revision_rationale: 'Die Revision beschränkt sich auf zwei sprachlich sichere Anpassungen: eine idiomatische deutsche Entsprechung für das Passiv mit ἐκδικίαις und eine natürliche distributive Zeitformel. Weder die sieben Vergeltungen noch die einzelnen Plagen werden näher bestimmt oder miteinander gleichgesetzt.'
