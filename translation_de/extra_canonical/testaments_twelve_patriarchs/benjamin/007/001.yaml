source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: VII. ΓΔιὰ τοῦτο¹, τέκνα μου, Γλέγω ὑμῖν¹¹, φεύγετε τὴν κακίαν² †Γτοῦ Βελίαρ³ ὅτι μάχαιραν³ δίδωσιν⁴ τοῖς πειθομένοις αὐτόν⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007/001.yaml
  text: Therefore, my children, I tell you, flee the evil of Beliar, because he gives a sword to those who obey him.
translation:
  language: de
  text: 'Darum, meine Kinder, sage ich euch: Flieht das Böse Beliars; denn er gibt denen, die ihm gehorchen, ein Schwert.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Darum
  rationale: Gibt die folgernde Verknüpfung knapp und natürlich wieder.
- source_word: τὴν κακίαν τοῦ Βελίαρ
  choice: das Böse Beliars
  rationale: Bewahrt den Genitiv und damit die mögliche Bedeutung des von Beliar ausgehenden beziehungsweise ihm zugehörigen Bösen, ohne ihn näher festzulegen.
- source_word: τοῖς πειθομένοις αὐτόν
  choice: denen, die ihm gehorchen
  rationale: πείθομαι mit Akkusativ bezeichnet hier das Sich-fügen beziehungsweise Gehorchen; die personale Rückbeziehung auf Beliar bleibt erhalten.
- source_word: μάχαιραν
  choice: ein Schwert
  rationale: Die übliche konkrete Wiedergabe lässt die mögliche bildhafte Bedeutung offen.
theological_decisions:
- issue: Art und Wirkung des Bösen Beliars
  choice: das Böse Beliars
  alternative: die Bosheit Beliars
  rationale: Die gewählte Formulierung bewahrt die Spannung zwischen Beliars eigener Bosheit und dem Bösen, das ihm zugeordnet ist beziehungsweise von ihm ausgeht.
- issue: Schwert als konkrete oder bildhafte Gabe
  choice: ein Schwert
  alternative: Gewalt/Tod
  rationale: Das Bild des griechischen Textes wird nicht deutend aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; die direkte väterliche Anrede und die warnende Imperativform bleiben erhalten.
