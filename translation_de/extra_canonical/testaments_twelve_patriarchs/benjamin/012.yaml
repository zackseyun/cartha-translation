lexical_decisions:
- source_word: ἐκοιμήθη ὕπνῳ καλῷ
  choice: entschlief in einem guten Schlaf
  rationale: Bewahrt sowohl den testamentarischen Todesschlaf-Euphemismus als auch die auffällige Wiederholung des griechischen Schlafwortfeldes, ohne sie zu »starb friedlich« auszudeuten.
- source_word: ἄραντες τὸ σῶμα αὐτοῦ
  choice: sie nahmen seinen Leib auf
  rationale: ἄραντες bezeichnet hier das Aufnehmen und Tragen des Leichnams. »Aufnehmen« bleibt konkret, ohne eine im Kontext nicht zwingende Aufwärtsrichtung zu behaupten.
- source_word: ἐντέλλομαι ὑμῖν
  choice: Ich gebiete euch
  rationale: Gibt die nachdrückliche, autoritative letztwillige Anweisung wieder und wahrt den würdigen biblischen Ton.
- source_word: ἀνενέγκατε τὰ ὀστᾶ μου ἐξ Αἰγύπτου
  choice: Bringt meine Gebeine aus Ägypten hinauf
  rationale: »Hinaufbringen« bildet die gerichtete Bewegung aus Ägypten nach Hebron ab; »Gebeine« ist im deutschen biblischen Register konkret und natürlich.
- source_word: ἐγγὺς τῶν πατέρων μου
  choice: nahe bei meinen Vätern
  rationale: Bewahrt sowohl die räumliche Nähe als auch die konkrete Verwandtschaftsbezeichnung, ohne die genaue Grabanordnung festzulegen.
- source_word: ἐν γήρει καλῷ
  choice: in gutem, hohem Alter
  rationale: Gibt das positive Attribut und das Greisenalter in natürlichem, würdigem Deutsch wieder.
- source_word: ἐν παραθήκῃ
  choice: in Verwahrung
  rationale: Das griechische Wort bezeichnet zunächst Verwahrung oder Hinterlegung. Die Übersetzung vermeidet es, den möglichen, aber nicht ausdrücklich genannten Sarg als sicher darzustellen; die Fußnote erläutert den Bestattungskontext.
- source_word: ἐν κρυφῇ
  choice: heimlich
  rationale: Gibt die adverbiale Bedeutung knapp und idiomatisch wieder.
- source_word: παρὰ τοὺς πόδας τῶν πατέρων αὐτῶν
  choice: an den Füßen ihrer Väter
  rationale: Bewahrt die ungewöhnlich konkrete Körper- und Lageangabe des griechischen Textes; eine Fußnote weist auf die mögliche Bedeutung als Grablage hin.
theological_decisions:
- issue: Sich überschneidende Berichte über Benjamins letzte Worte, Tod und Begräbnis
  choice: Die überlieferte Abfolge vollständig und ohne Harmonisierung wiedergeben.
  alternative: Die Berichte zu einem einzigen chronologisch geglätteten Schluss zusammenziehen oder vermeintlich sekundäre Sätze auslassen.
  rationale: Der vorliegende griechische Text erzählt Tod und Begräbnis, kehrt danach zu Benjamins letzten Worten zurück und berichtet anschließend erneut seinen Tod. Diese Überlieferungskomplexität soll sichtbar bleiben.
- issue: Chronologische Angabe des einundneunzigsten Jahres
  choice: Die konkrete Angabe als »im einundneunzigsten Jahr nach dem Auszug« wiedergeben.
  alternative: Die Zeitangabe emendieren, verallgemeinern oder wegen historischer Spannung auslassen.
  rationale: Der griechische Zeuge bietet eine bestimmte Chronologie. Die Übersetzung bewahrt diese Aussage, ohne die daraus entstehende Spannung stillschweigend aufzulösen.
- issue: Art der Aufbewahrung von Benjamins Leichnam
  choice: Das offene παραθήκη mit »Verwahrung« übersetzen und die mögliche Deutung als Sarg in der Fußnote nennen.
  alternative: Im Haupttext eindeutig »Sarg« setzen.
  rationale: Der Bestattungskontext legt eine körperliche Aufbewahrung nahe, doch das griechische Substantiv benennt nicht eindeutig ein bestimmtes Behältnis.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem biblischem Register. Konkrete Verwandtschafts- und Bestattungssprache bleibt erhalten. Ungewöhnliche Wiederholungen und chronologische Spannungen des griechischen Zeugen werden nicht harmonisiert; schwer verständliche Einzelheiten werden knapp in Fußnoten erläutert.
