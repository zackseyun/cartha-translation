  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/012.yaml
  text: '1. And after saying these things, he stretched out his feet and fell asleep in a good sleep[a].

    2. And his sons did as he had commanded them, and they carried up his body and buried him in Hebron with his fathers.


    2. The number of his life was one hundred and twenty-five years[b]. And when he had finished his words, he said, “I command you, my children, carry up my bones out of Egypt, and bury me in Hebron near my fathers.”

    2. And Benjamin died at one hundred and twenty-five years, in a good old age; and they placed him in a coffin.

    3. And in the ninety-first year after the departure of the sons of Israel from Egypt, they and their brothers brought up the bones of their fathers secretly during the war in Canaan, and buried them in Hebron beside the feet of their fathers[c].

    4. And they returned from the land of Canaan, and lived in Egypt until the day of their departure from the land of Egypt.'
translation:
  language: de
  text: '**Testament Benjamins 12**


    **1** Nachdem Benjamin dies gesagt hatte, streckte er seine Füße aus und entschlief in einem guten Schlaf.[a] Seine Söhne taten, was er ihnen geboten hatte; sie hoben seinen Leib auf und begruben ihn in Hebron bei seinen Vätern. Und als er seine Worte vollendet hatte, sagte er: »Ich gebiete euch, meine Kinder: Bringt meine Gebeine aus Ägypten hinauf und begrabt mich in Hebron nahe bei meinen Vätern.«[b]


    **2** Benjamin starb im Alter von hundertfünfundzwanzig Jahren, in gutem Alter; und sie legten ihn in Verwahrung.[c]


    **3** Im einundneunzigsten Jahr nach dem Auszug der Söhne Israels aus Ägypten brachten sie und ihre Brüder die Gebeine ihrer Väter während des Krieges in Kanaan heimlich hinauf. Sie begruben sie in Hebron neben den Füßen ihrer Väter.[d]


    **4** Dann kehrten sie aus dem Land Kanaan zurück und wohnten in Ägypten bis zu dem Tag, an dem sie aus dem Land Ägypten auszogen.


    **Fußnoten**


    [a] Einige griechische Textzeugen fügen nach »in einem guten Schlaf« noch »und guten« hinzu.


    [b] Der überlieferte griechische Text enthält sich überschneidende Schlussberichte: Zunächst werden Benjamins Tod und Begräbnis erzählt, danach folgen seine letzten Worte und anschließend erneut sein Tod. Diese Abfolge wird hier nicht geglättet.


    [c] Wörtlich: »sie legten ihn in Verwahrung«. Das griechische Wort bezeichnet eine Hinterlegung oder Verwahrung; im Bestattungskontext kann es sich auf die Aufbewahrung des Leichnams beziehen, ohne die Art der Verwahrung näher zu bestimmen.


    [d] Wörtlich: »neben den Füßen ihrer Väter«. Die Wendung kann die Lage der Grabstätte bei den Gräbern der Vorfahren bezeichnen.'
  philosophy: optimal-equivalence
