source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Οἱ δὲ υἱοὶ αὐτοῦ ἐποίησαν ὡς προσέταξεν αὐτοῖς, καὶ ἄραντες τὸ σῶμα αὐτοῦ ἔθαψαν αὐτὸ⁴ ἐν Χεβρὼν μετὰ τῶν πατέρων αὐτοῦ. Καὶ⁶ *ὡς ἐπλήρωσε τοὺς λόγους αὐτοῦ⁷ εἶπεν⁸. Ἐντέλλομαι ὑμῖν, *τέκνα μου⁹, ἀνενέγκατε¹⁰ τὰ ὀστᾶ μου ἐξ Αἰγύπτου, καὶ *θάψατέ με¹¹ εἰς¹² Χεβρὼν ἐγγὺς¹³ τῶν πατέρων μου. 2. Καὶ¹⁴ ἀπέθανε Βενιαμίν¹⁵ *ἑκατὸν εἴκοσι πέντε¹⁶ ἐτῶν ἐν γήρει καλῷ· καὶ ἔθηκαν αὐτὸν ἐν παραθήκῃ¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/012/002.yaml
  text: 'And his sons did as he had commanded them, and they carried his body and buried him in Hebron with his fathers.


    And when he had finished his words, he said, “I command you, my children, carry my bones up out of Egypt, and bury me in Hebron near my fathers.”

    And Benjamin died at one hundred and twenty-five years, in a good old age; and they placed him in a coffin.'
translation:
  language: de
  text: 'Und seine Söhne taten, wie er ihnen geboten hatte. Sie nahmen seinen Leichnam auf und begruben ihn in Hebron bei seinen Vätern.


    Und als er seine Worte beendet hatte, sagte er: »Ich gebiete euch, meine Kinder: Bringt meine Gebeine aus Ägypten hinauf und begrabt mich in Hebron nahe bei meinen Vätern.«


    Und Benjamin starb im Alter von hundertfünfundzwanzig Jahren, in gutem Alter; und sie legten ihn in einen Sarg.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄραντες τὸ σῶμα αὐτοῦ
  choice: sie nahmen seinen Leichnam auf
  rationale: Gibt das Partizip von αἴρω und σῶμα im Bestattungskontext natürlich und zugleich quellennah wieder.
- source_word: ἀνενέγκατε
  choice: Bringt … hinauf
  rationale: Bewahrt die gerichtete Bedeutung von ἀναφέρω und die traditionelle Perspektive des Hinaufbringens aus Ägypten.
- source_word: τὰ ὀστᾶ μου
  choice: meine Gebeine
  rationale: „Gebeine“ ist im deutschen Bestattungskontext würdevoll und bezeichnet passend die sterblichen Knochen.
- source_word: ἐν γήρει καλῷ
  choice: in hohem und erfülltem Alter
  rationale: Das wörtliche „in gutem Alter“ wäre unidiomatisch; die Formulierung wahrt die positive Wertung eines vollendeten hohen Alters.
- source_word: ἐν παραθήκῃ
  choice: in einen Sarg
  rationale: Im unmittelbaren Bestattungskontext bezeichnet παραθήκη hier wahrscheinlich einen Behälter zur vorläufigen Beisetzung; „Sarg“ ist die klare, traditionelle Wiedergabe.
theological_decisions:
- issue: Bezeichnung der Vorfahren als „Väter“
  choice: bei/nahe bei meinen Vätern
  alternative: bei/nahe bei meinen Vorfahren
  rationale: „Väter“ erhält das wiederholte πατέρες und die patriarchale Familienbeziehung, ohne den Text auslegend zu verallgemeinern.
- issue: Positive Charakterisierung von Benjamins Lebensende
  choice: in hohem und erfülltem Alter
  alternative: in gutem Alter
  rationale: Die positive Aussage von γῆρας καλόν bleibt bestehen, wird aber in natürlichem Deutsch formuliert; darüber hinaus wird keine besondere Segenslehre eingeführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischem Klang. Die Satzfolge und Wiederholung des griechischen Textes bleiben weitgehend erhalten; schwer verständliche Wörtlichkeit wird nur dort idiomatisch geglättet, wo sie im Deutschen unnatürlich wäre.
