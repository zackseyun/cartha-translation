source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: XII. ¹Καὶ ταῦτα εἰπὼν ἐκτείνας τοὺς πόδας αὐτοῦ ἐκοιμήθη †ὕπνῳ² καλῷ [καὶ ἀγαθῷ]³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/012/001.yaml
  text: And after saying these things, he stretched out his feet and fell asleep in a good [and good] sleep.
translation:
  language: de
  text: Und nachdem er dies gesagt hatte, streckte er seine Füße aus und entschlief in einem schönen [und guten][a] Schlaf.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wörter „und guten“ stehen in eckigen Klammern, weil ihre Zugehörigkeit zum ursprünglichen Text unsicher ist.
    reason: Die griechische Edition kennzeichnet καὶ ἀγαθῷ als unsicheren beziehungsweise möglicherweise sekundären Textbestandteil.
lexical_decisions:
- source_word: ἐκοιμήθη
  choice: entschlief
  rationale: Gibt das griechische Bild des Einschlafens würdevoll wieder und lässt im Sterbekontext zugleich die Bedeutung „sterben“ erkennen.
- source_word: ὕπνῳ καλῷ
  choice: in einem schönen Schlaf
  rationale: Bewahrt die ungewöhnliche Verbindung mit καλός möglichst direkt; „schön“ gibt hier einen friedlichen, guten Todesschlaf wieder, ohne die Formulierung zu glätten.
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: streckte er seine Füße aus
  rationale: Folgt der konkreten griechischen Ausdrucksweise; eine idiomatischere Wiedergabe wie „legte sich hin“ würde Bildgehalt verlieren.
theological_decisions:
- issue: „Einschlafen“ als Bezeichnung des Todes
  choice: entschlief
  alternative: schlief ein / starb
  rationale: „Entschlief“ wahrt die metaphorische Ausdrucksweise des Textes und macht den Tod im Zusammenhang erkennbar, ohne ihn interpretierend durch „starb“ zu ersetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das etwas feierliche „entschlief“ passt zum Sterbebericht; die auffällige, textkritisch unsichere Wiederholung „schönen [und guten] Schlaf“ bleibt sichtbar erhalten.
