  source_fidelity: 'Die Übersetzung folgt dem griechischen Satzbau und Bildgehalt zuverlässig: Das Partizip εἰπών wird angemessen durch „nachdem er dies gesagt hatte“ wiedergegeben, ἐκτείνας τοὺς πόδας αὐτοῦ durch „streckte er seine Füße aus“ und ἐκοιμήθη durch das im Sterbekontext passende „entschlief“. „schönen [und guten] Schlaf“ gibt καλῷ [καὶ ἀγαθῷ] hinreichend direkt wieder und erhält die textkritisch markierte, synonyme Erweiterung.'
