  terminology: Die Wortwahl wahrt die Todesmetapher des griechischen ἐκοιμήθη, ohne eine zusätzliche theologische Deutung einzutragen. Die Wiedergabe von καλός mit „schön“ und ἀγαθός mit „gut“ erhält die lexikalische Nuance der beiden Ausdrücke.
