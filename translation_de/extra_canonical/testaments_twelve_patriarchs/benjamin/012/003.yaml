  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/012/003.yaml
  text: And in the ninety-first year after the departure of the sons of Israel from Egypt, they and their brothers brought up the bones of their fathers secretly in the war in Canaan, and buried them in Hebron beside the feet of their fathers[c].
translation:
  language: de
  text: Und im einundneunzigsten Jahr nach dem Auszug der Söhne Israels aus Ägypten brachten sie und ihre Brüder im Krieg in Kanaan heimlich die Gebeine ihrer Väter hinauf und bestatteten sie in Hebron neben den Füßen ihrer Väter.[a]
