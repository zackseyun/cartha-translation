    reason: lexical_alternative
lexical_decisions:
- source_word: ἐνενηκοστῷ πρώτῳ ἔτει
  choice: im einundneunzigsten Jahr
  rationale: Gibt die griechische Ordinalzahl präzise und idiomatisch wieder.
- source_word: τῆς ἐξόδου τῶν υἱῶν Ἰσραὴλ ἐξ Αἰγύπτου
  choice: nach dem Auszug der Söhne Israels aus Ägypten
  rationale: Der Genitiv bezeichnet hier den zeitlichen Bezugspunkt; „Auszug“ entspricht ἔξοδος und bewahrt den biblischen Anklang.
- source_word: ἀνήγαγον τὰ ὀστᾶ
  choice: brachten … die Gebeine … hinauf
  rationale: „Hinaufbringen“ bewahrt die Bewegungsrichtung von ἀνάγω; „Gebeine“ ist im Bestattungskontext natürlich und würdig.
- source_word: ἐν κρυφῇ
  choice: heimlich
  rationale: Natürliche deutsche Wiedergabe der adverbialen Wendung.
- source_word: ἐν τῷ πολέμῳ Χαναάν
  choice: während des Krieges in Kanaan
  rationale: Die knappe, textkritisch auffällige griechische Form wird als zeitlich-situative Angabe verstanden, ohne zusätzliche Einzelheiten einzutragen.
- source_word: παρὰ τοὺς πόδας τῶν πατέρων αὐτῶν
  choice: zu Füßen ihrer Väter
  rationale: Bewahrt das konkrete Bild und die mögliche Angabe der Lage innerhalb oder bei den Ahnengräbern; die Unsicherheit wird in der Fußnote erläutert.
theological_decisions:
- issue: Bezug von „ihre Väter“
  choice: Die im Griechischen vorhandene wiederholte Bezeichnung bleibt unverändert stehen.
  alternative: Die zweite Nennung als „Vorfahren“ oder „Ahnengräber“ verdeutlichen.
  rationale: Der Wortlaut lässt offen, ob jeweils dieselben Generationen gemeint sind oder ob die Bestattung bei weiter zurückliegenden Ahnen beschrieben wird; diese Spannung soll nicht stillschweigend aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gebeine“ und „zu Füßen“ wahren den Bestattungston und das konkrete Bild des griechischen Textes; die ungewöhnliche Ortsangabe wird nicht paraphrastisch geglättet.
