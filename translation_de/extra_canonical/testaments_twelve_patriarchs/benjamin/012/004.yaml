  source_fidelity: 'Die Übersetzung gibt den griechischen Satz vollständig und in seiner Abfolge wieder: Καὶ αὐτοί ist mit „Und sie“ erfasst; ἐπέστρεψαν ἐκ γῆς Χαναάν mit „kehrten aus dem Land Kanaan zurück“; ᾤκησαν ἐν Αἰγύπτῳ mit „wohnten in Ägypten“; und ἕως ἡμέρας ἐξόδου αὐτῶν ἐκ γῆς Αἰγύπτου mit „bis zu dem Tag, an dem sie das Land Ägypten verließen“. Die Konjektur/Ergänzung γῆς vor Αἰγύπτου wird angemessen durch „Land Ägypten“ berücksichtigt.'
