source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: 4. *Καὶ αὐτοὶ ἐπέστρεψαν³⁰ ἐκ γῆς³¹ Χαναάν, καὶ³² ᾤκησαν ἐν Αἰγύπτῳ ἕως ἡμέρας ἐξόδου αὐτῶν ἐκ ⌜γῆς⌝ Αἰγύπτου³³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/012/004.yaml
  text: And they returned from the land of Canaan, and lived in Egypt until the day of their departure from the land of Egypt.
translation:
  language: de
  text: Und sie kehrten aus dem Land Kanaan zurück und wohnten in Ägypten bis zu dem Tag, an dem sie das Land Ägypten verließen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέστρεψαν
  choice: kehrten … zurück
  rationale: Gibt die natürliche Bedeutung des Aorists im Zusammenhang einer Rückkehr aus Kanaan wieder.
- source_word: ᾤκησαν
  choice: wohnten
  rationale: Entspricht dem schlichten Sinn von οἰκέω und klingt im modernen Standarddeutsch natürlich.
- source_word: ἕως ἡμέρας ἐξόδου αὐτῶν
  choice: bis zu dem Tag, an dem sie … verließen
  rationale: Überträgt die zeitliche Wendung idiomatisch, ohne den sachlichen Gehalt des Substantivs ἔξοδος zu verändern.
theological_decisions:
- issue: Mögliche Anspielung von ἐξόδου auf den Exodus
  choice: verließen
  alternative: auszogen / ihres Auszugs
  rationale: Der Kontext bezeichnet den Weggang aus Ägypten; „verließen“ bewahrt den unmittelbaren Sinn, ohne durch das Fachwort „Exodus“ eine stärkere intertextuelle Festlegung in den Text einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die Wiederholung von „Ägypten“ bleibt erhalten, da sie auch im griechischen Text steht.
