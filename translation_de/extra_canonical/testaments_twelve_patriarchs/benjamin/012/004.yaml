  terminology: „Land Kanaan“ und „Land Ägypten“ folgen dem griechischen γῆς und sind im biblisch-literarischen Register angemessen. „wohnten“ trifft ᾤκησαν direkt. „verließen“ gibt ἐξόδου sachlich wieder, ohne eine über den Kontext hinausgehende theologische oder intertextuelle Deutung festzuschreiben.
