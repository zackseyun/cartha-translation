source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ οὕτως οἱ μέτοχοι αὐτοῦ φοβηθέντες ἐν †ἀνέσει με κατέσχεν†.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/004.yaml
  text: And thus his companions, being afraid, †kept me at ease†.
translation:
  language: de
  text: Und so hielten mich seine Gefährten aus Angst †in Ruhe† fest.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Wortlaut ist an dieser Stelle offenbar beschädigt und seine genaue Bedeutung unsicher. Wörtlich lässt er sich ungefähr als „hielten mich in Ruhe fest“ verstehen; andere Textüberlieferungen bieten eine deutlich abweichende Handlung.
    reason: Die Fußnote weist auf eine echte textkritische Schwierigkeit hin und verhindert, dass die ungewöhnliche Übersetzung als sicherer Wortlaut missverstanden wird.
lexical_decisions:
- source_word: οἱ μέτοχοι αὐτοῦ
  choice: seine Gefährten
  rationale: „Gefährten“ gibt μέτοχοι in diesem erzählerischen Zusammenhang natürlich wieder, ohne die Art ihrer Verbindung genauer festzulegen.
- source_word: φοβηθέντες
  choice: aus Angst
  rationale: Die kausale deutsche Wendung gibt das vorzeitige Partizip idiomatisch wieder und lässt offen, wovor sie sich fürchteten.
- source_word: ἐν ἀνέσει με κατέσχεν
  choice: hielten mich †in Ruhe† fest
  rationale: Die Formulierung folgt den erkennbaren Wörtern des verderbten griechischen Textes möglichst eng. Die bewusst markierte, ungewöhnliche Wendung bewahrt die textliche Unsicherheit, statt eine nicht gesicherte Handlung einzusetzen.
theological_decisions: []
translation_notes:
  register: Modernes, schlichtes und würdevolles Erzählregister. Die Härte der markierten Wendung ist wegen des beschädigten Ausgangstextes beabsichtigt.
