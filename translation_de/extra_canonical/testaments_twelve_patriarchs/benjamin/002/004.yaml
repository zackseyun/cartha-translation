  source_fidelity: Die Übersetzung folgt dem vorgelegten, ausdrücklich durch Cruces als beschädigt markierten griechischen Wortlaut. „seine Gefährten“, „aus Angst“ und „hielten mich ... fest“ bilden die lesbaren Elemente angemessen ab. Die unsichere Verbindung ἐν †ἀνέσει με κατέσχεν† wird weder durch die abweichende englische Audit-Fassung noch durch eine spekulative Rekonstruktion ersetzt.
  naturalness: Der Satz ist modernes, verständliches Standarddeutsch. „in Ruhe festhalten“ ist leicht ungewöhnlich; durch die Cruces und die unmittelbar verankerte Fußnote ist diese Unebenheit jedoch sachgerecht als Folge des korrupten Ausgangstextes erkennbar.
  terminology: „Gefährten“ ist für μέτοχοι in diesem Kontext neutral und idiomatisch. Die Wiedergabe vermeidet ungesicherte Benennungen wie „Ismaeliten“, die im vorgelegten griechischen Text nicht stehen.
