review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die emphatische Pluralform αὐτοὶ („sie selbst“), die Verneinung und den anschließenden, im Griechischen nicht ausdrücklich benannten Singular („er“) sachgerecht wieder. Auch „vor mir verbergen“ und „die Taten unserer Brüder“ entsprechen dem griechischen Wortlaut. Die im Quelltext an τὰ ἔργα τῶν ἀδελφῶν ἡμῶν angebrachte Fußnotenverankerung fehlt jedoch in der deutschen Fassung.
  naturalness: Der Satz ist modernes, natürliches und angemessen würdiges Standarddeutsch. Das Semikolon bildet die begründende Beziehung von γάρ gut ab.
  terminology: „Taten“ ist für ἔργα hier treffend und neutral. Die wechselnden, nicht weiter identifizierten Subjekte werden korrekt nicht harmonisiert oder theologisch ausgelegt.
  issues:
  - severity: medium
    issue: Fußnotenanker des Ausgangstextes fehlt.
    rationale: Der griechische Quelltext enthält bei „τὰ ἔργα τῶν ἀδελφῶν ἡμῶν“ einen Anker (31). Dieser muss in der Übersetzung erhalten bleiben. Da der Wortlaut der zugehörigen textkritischen Anmerkung nicht bereitgestellt ist, darf er nicht rekonstruiert oder inhaltlich erfunden werden.
  revised_text: Und sie selbst logen nicht, als sie dies sagten; denn er wollte die Taten unserer Brüder vor mir verbergen.³¹
  revised_footnotes:
  - marker: '31'
    text: Textkritischer Fußnotenanker der zugrunde gelegten griechischen Ausgabe zu „die Taten unserer Brüder“; der Wortlaut der Anmerkung ist in den bereitgestellten Quelldaten nicht enthalten.
    reason: Erhält den im griechischen Ausgangstext vorhandenen Anker, ohne eine nicht überlieferte textkritische Anmerkung zu erfinden.
  revision_rationale: Die Übersetzung selbst bedarf keiner sprachlichen oder inhaltlichen Änderung. Die Revision ergänzt ausschließlich den fehlenden Fußnotenanker und kennzeichnet transparent, dass dessen eigentlicher editionskritischer Wortlaut nicht vorliegt.
