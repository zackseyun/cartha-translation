source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ οὐκ ἐψεύσαντο αὐτοὶ ταῦτα λέγοντες· ἤθελεν γὰρ κρύπτειν ἀπʼ ἐμοῦ *τὰ ἔργα τῶν ἀδελφῶν ἡμῶν³¹
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/005.yaml
  text: And they themselves did not lie in saying these things; for he wanted to hide from me the deeds of our brothers.
translation:
  language: de
  text: Und sie selbst logen nicht, als sie dies sagten; denn er wollte die Taten unserer Brüder vor mir verbergen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἐψεύσαντο
  choice: logen nicht
  rationale: Gibt den griechischen Aorist und die ausdrückliche Verneinung unmittelbar und natürlich wieder.
- source_word: αὐτοὶ
  choice: sie selbst
  rationale: Bewahrt die emphatische Pluralform des griechischen Textes und vermeidet, Josef als singularisches Subjekt einzusetzen.
- source_word: ταῦτα λέγοντες
  choice: als sie dies sagten
  rationale: Gibt das modale beziehungsweise begleitende Partizip idiomatisch wieder.
- source_word: ἤθελεν
  choice: er wollte
  rationale: Bewahrt den Wechsel zum singularischen Subjekt, ohne dessen nicht ausdrücklich genannten Referenten im Text festzulegen.
- source_word: κρύπτειν ἀπʼ ἐμοῦ
  choice: vor mir verbergen
  rationale: Entspricht der üblichen deutschen Fügung für das Vorenthalten beziehungsweise Verheimlichen gegenüber einer Person.
- source_word: τὰ ἔργα τῶν ἀδελφῶν ἡμῶν
  choice: die Taten unserer Brüder
  rationale: Übersetzt ἔργα kontextgerecht als konkrete Handlungen und bewahrt die inklusive Possessivform.
theological_decisions:
- issue: Identität der Subjekte im Plural und Singular
  choice: „sie selbst“ und anschließend „er“
  alternative: Josef ausdrücklich als Subjekt beider Aussagen nennen
  rationale: Der griechische Text setzt zunächst ein emphatisches pluralisches Subjekt und danach ein unausgedrücktes singularisches Subjekt. Die Übersetzung bewahrt diese grammatische Spannung, statt sie interpretierend aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die griechische Syntax; das Semikolon erhält die begründende Gedankenverbindung.
