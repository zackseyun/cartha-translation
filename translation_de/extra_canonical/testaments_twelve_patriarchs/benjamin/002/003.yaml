source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Εἰς δὲ ἐξ αὐτῶν ῥάβδῳ μαστίζων με, ὑπήντησεν αὐτῷ λέων καὶ ἀνεῖλεν αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/003.yaml
  text: And one of them, while he was striking me with a rod, was met by a lion, and the lion killed him.
translation:
  language: de
  text: Als mich einer von ihnen mit einem Stock schlug, trat ihm ein Löwe entgegen und tötete ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ῥάβδῳ
  choice: mit einem Stock
  rationale: ῥάβδος bezeichnet hier ein Schlagwerkzeug; „Stock“ ist natürliches, gegenwärtiges Deutsch und vermeidet die altertümliche Färbung von „Rute“.
- source_word: μαστίζων
  choice: schlug
  rationale: Das Partizip bezeichnet das Schlagen beziehungsweise Geißeln mit dem genannten Stock. „schlug“ gibt die Handlung im Zusammenhang klar und idiomatisch wieder.
- source_word: ὑπήντησεν αὐτῷ
  choice: trat ihm … entgegen
  rationale: Die Wendung bewahrt die Bedeutung des Begegnens beziehungsweise Entgegentretens und klingt im Deutschen bei einem plötzlich auftretenden Löwen natürlich.
- source_word: ἀνεῖλεν αὐτόν
  choice: tötete ihn
  rationale: ἀναιρέω bedeutet in diesem Zusammenhang eindeutig „töten“; das Pronomen bezieht sich auf den schlagenden Mann.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die griechische Satzgestalt wird in zwei Hauptsätze gegliedert, damit die gleichzeitige Nebenhandlung idiomatisch wiedergegeben wird. Der eingereichte griechische Quelltext spricht vom Schlagen mit einem Stock und nicht vom Fortgehen, um ein Gewand zu verstecken; daher folgt die Übersetzung dem griechischen Primärtext und der dazu passenden englischen POB-Fassung.
