base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/001.yaml
  text: And when I went into Egypt, my brother recognized me and said to me, “They smeared your tunic with blood,” they said. “See whether this is the tunic.”
translation:
  language: de
  text: 'Als ich aber nach Ägypten kam, erkannte mich mein Bruder und sagte zu mir: »Sie haben dein Gewand mit Blut beschmiert«, sagten sie. »Prüfe, ob dies das Gewand ist.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text wechselt hier unvermittelt von den Worten des Bruders zu „sie sagten“ und einer anschließenden Aufforderung. Wörtlich steht am Ende: „Prüfe, ob dies das Gewand ist.“'
    reason: Der abrupte Sprecher- und Zitatwechsel ist im Griechischen syntaktisch auffällig und soll nicht stillschweigend geglättet oder durch aus Genesis bekannte, im vorliegenden Text aber fehlende Wörter ergänzt werden.
lexical_decisions:
- source_word: ἐγνώρισέν με
  choice: erkannte mich
  rationale: Gibt die naheliegende Bedeutung des Verbs mit Personenobjekt wieder und folgt der im Kontext sinnvollen Deutung, dass der Bruder Benjamin erkannte.
- source_word: χιτών
  choice: Gewand
  rationale: Bezeichnet ein am Körper getragenes Kleidungsstück; „Gewand“ ist hier natürlich und vermeidet eine unnötig enge Festlegung auf „Untergewand“ oder „Tunika“.
- source_word: ἔφυραν … αἵματι
  choice: mit Blut beschmiert
  rationale: Gibt das absichtliche Verunreinigen beziehungsweise Bestreichen des Gewandes idiomatisch und anschaulich wieder.
- source_word: Ἐπίγνωθι
  choice: Prüfe
  rationale: Der Imperativ fordert dazu auf, die Identität des Gewandes festzustellen; „Prüfe“ bewahrt diesen Sinn in natürlichem Deutsch.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der auffällige Wechsel zwischen direkter Rede und eingeschobener Redeeinleitung bleibt erhalten; weder der Name Josef noch „deines Sohnes“ wird ergänzt, da beides im griechischen Ausgangstext fehlt.
