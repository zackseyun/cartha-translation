  source_fidelity: Die Grundhandlung und die unbestimmten pluralischen Handelnden sind korrekt wiedergegeben. Die abschließende griechische Partizipialkonstruktion φραγγελλώσαντες εἶπόν μοι verlangt jedoch, dass das Auspeitschen als dem Befehl vorausgehend beziehungsweise dessen Umstand kenntlich bleibt. Die bloße Reihung „peitschten mich aus und befahlen“ schwächt diese Beziehung ab.
  naturalness: Die Sprache ist insgesamt modern und würdevoll. „Nachdem sie mich ausgepeitscht hatten, befahlen sie mir zu laufen“ ist idiomatisch und bildet die Satzverknüpfung genauer ab. Die einfache Vergangenheitsform „auszogen“ vermeidet einen nicht erforderlichen Plusquamperfektton.
  terminology: „Untergewand“ ist für χιτών im Kontext angemessen; „Lendenschurz“ gibt περίζωμα konkret und verständlich wieder. „Ismaeliter“ und „auspeitschen“ sind ebenfalls passend. Keine theologisch lenkende Festlegung ist vorhanden.
