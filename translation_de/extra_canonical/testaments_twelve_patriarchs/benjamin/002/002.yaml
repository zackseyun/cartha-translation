source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ λέγει μοι· Ναί, ἀδελφέ¹⁶. καὶ ὅτε¹⁷ ἐξέδυσάν με τὸν χιτῶνά μου δέδωκάν με τοῖς Ἰσμαηλίταις· καὶ δέδωκάν μοι περίζωμα, καὶ φραγγελλώσαντες εἰπόν μοι τρέχειν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/002.yaml
  text: And he said to me, “Yes, brother. And when they stripped me of my tunic they gave me to the Ishmaelites; and they gave me a loincloth, and after flogging me they told me to run.”
translation:
  language: de
  text: 'Und er sagte zu mir: »Ja, Bruder. Und als sie mir mein Untergewand auszogen, übergaben sie mich den Ismaelitern; und sie gaben mir einen Lendenschurz, und nachdem sie mich ausgepeitscht hatten, befahlen sie mir zu laufen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιτών
  choice: Untergewand
  rationale: Bezeichnet hier das am Körper getragene Gewand; »Untergewand« ist im biblisch-antiken Zusammenhang verständlicher und genauer als das heute anders konnotierte »Tunika«.
- source_word: περίζωμα
  choice: Lendenschurz
  rationale: Gibt ein um die Hüften gelegtes, knappes Kleidungsstück natürlich und konkret wieder.
- source_word: φραγγελλώσαντες
  choice: peitschten mich aus
  rationale: Das Partizip bezeichnet eine Geißelung beziehungsweise Auspeitschung; die finite Reihung ist im Deutschen flüssig und wahrt die zeitliche Folge.
- source_word: τρέχειν
  choice: zu laufen
  rationale: Bewahrt die einfache, nicht näher bestimmte Bedeutung des griechischen Infinitivs.
- source_word: δέδωκάν με τοῖς Ἰσμαηλίταις
  choice: übergaben sie mich den Ismaelitern
  rationale: »Übergeben« gibt die Übergabe einer Person im Deutschen idiomatisch wieder und bewahrt die Ismaeliter als Empfänger, nicht als Handelnde.
theological_decisions:
- issue: Identität der nicht ausdrücklich genannten Handelnden
  choice: Das wiederholte »sie« bleibt ohne nähere Identifizierung stehen.
  alternative: Die Brüder oder die Ismaeliter ausdrücklich als Handelnde benennen.
  rationale: Der griechische Text hat lediglich die Verbformen der dritten Person Plural. Eine ausdrückliche Zuordnung würde eine im Vers bestehende Unbestimmtheit auflösen und könnte zudem die Rollen von Übergebenden und Empfängern verkehren.
translation_notes:
  register: Moderne, würdevolle Erzählsprache. Die direkte Rede bleibt knapp. Die wiederholten griechischen καί-Verknüpfungen werden teilweise durch »Dann« und eine natürliche deutsche Verbfolge wiedergegeben, ohne Handlungselemente oder ihre Reihenfolge zu verlieren.
