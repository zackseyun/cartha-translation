source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Μὴ λέγετε τῷ πατρί μου³⁴ ἃ ἐποιήσατέ μοι, ἀλλʼ οὕτως λέξατε καθὼς ἐξηγησάμην³⁵ τῷ Βενιαμίν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/007.yaml
  text: Do not tell my father what you did to me, but speak in this way, just as I explained to Benjamin.
translation:
  language: de
  text: Sagt meinem Vater nicht, was ihr mir angetan habt, sondern sagt es so, wie ich es Benjamin erklärt habe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἃ ἐποιήσατέ μοι
  choice: was ihr mir angetan habt
  rationale: Die Wendung bedeutet wörtlich „was ihr mir getan habt“; „angetan“ gibt im Deutschen den durch den Kontext nahegelegten schädigenden Charakter natürlich wieder.
- source_word: οὕτως λέξατε
  choice: sagt es so
  rationale: Das ergänzte „es“ ist im Deutschen idiomatisch und verweist auf die vorgesehene Darstellung; der griechische Ausdruck bedeutet „redet/sagt so“.
- source_word: καθὼς ἐξηγησάμην τῷ Βενιαμίν
  choice: wie ich es Benjamin erklärt habe
  rationale: ἐξηγησάμην bezeichnet ein Darlegen oder Erklären. Der Dativ wird natürlich mit „Benjamin“ ohne Präposition wiedergegeben; das deutsche Objekt „es“ erschließt sich aus dem vorherigen Satzteil.
theological_decisions: []
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Der Imperativ Plural bleibt erhalten. Der Name Βενιαμίν wird in der geläufigen deutschen Form „Benjamin“ wiedergegeben.
