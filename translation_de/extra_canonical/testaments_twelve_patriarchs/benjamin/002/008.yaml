source:
  edition: Charles 1908 Greek Versions (pages 288-308, Benjamin source-fix v2)
  text: Καὶ αἱ ἔννοιαι *γένωνται ἐν ὑμῖν³⁶ τοιαῦται³⁷ καὶ μὴ ἔλθωσιν οἱ λόγοι οὗτοι εἰς καρδίαν τοῦ πατρός μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002/008.yaml
  text: And let such thoughts be in you, and let not these words come into the heart of my father.’
translation:
  language: de
  text: Und solche Gedanken sollen in euch sein, und diese Worte sollen nicht in das Herz meines Vaters kommen.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔννοιαι
  choice: Gedanken
  rationale: Bezeichnet Gedanken, Absichten oder innere Erwägungen; „Gedanken“ ist hier natürlich und bewahrt die inhaltliche Weite.
- source_word: γένωνται ἐν ὑμῖν
  choice: sollen in euch sein
  rationale: Gibt den auffordernden Sinn des Aorist-Konjunktivs wieder, ohne das Werden gegenüber dem resultierenden inneren Zustand unnötig hervorzuheben.
- source_word: οἱ λόγοι οὗτοι
  choice: diese Worte
  rationale: Entspricht dem konkreten Bezug auf das Gesagte; „Worte“ ist gegenüber „Aussagen“ würdevoller und näher am Griechischen.
- source_word: εἰς καρδίαν
  choice: in das Herz
  rationale: Bewahrt das antike Bild des Herzens als Ort des inneren Wahrnehmens und Erwägens.
theological_decisions:
- issue: Bedeutung des Herzens
  choice: Das Bild „in das Herz kommen“ bleibt wörtlich erhalten.
  alternative: „meinem Vater zu Herzen gehen“ oder „meinem Vater bewusst werden“
  rationale: Die griechische Formulierung ist bildhaft und kann sowohl inneres Aufnehmen als auch emotionale Wirkung einschließen; eine erklärende Wiedergabe würde diese Offenheit einschränken.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die parallele Aufforderungsstruktur des griechischen Satzes wird bewahrt.
