  to: '**Das Testament Benjamins 2**


    **1** Als wir nach Ägypten kamen, erkannte mich mein Bruder und sagte zu mir: »Sie bestrichen dein Gewand mit Blut und sagten: ›Prüfe, ob dies dein Gewand ist.‹«[a]


    **2** Dann sagte er zu mir: »Ja, Bruder. Als sie mir mein Gewand auszogen, übergaben sie mich den Ismaelitern. Sie gaben mir einen Lendenschurz, peitschten mich aus und befahlen mir zu laufen.


    **3** Als einer von ihnen mich mit einem Stock schlug, begegnete ihm ein Löwe und tötete ihn.


    **4** Seine Gefährten bekamen Angst und hielten mich daraufhin unter erleichterten Bedingungen fest.«[b]


    **5** Sie logen nicht, als sie dies sagten; denn er wollte mir die Taten unserer Brüder verheimlichen.[c]


    **6** Dann rief er seine Brüder zu sich und sagte:


    **7** »Sagt meinem Vater nicht, was ihr mir angetan habt, sondern erzählt es so, wie ich es Benjamin erklärt habe.


    **8** Solche Gedanken sollen in euch sein, und diese Worte sollen nicht in das Herz meines Vaters gelangen.«'
  rationale: Die Revision berichtigt den Numerusfehler in Vers 1 und präzisiert dort die deutsche Redeform entsprechend dem griechischen σου. Sie übernimmt weder die englische, vom griechischen Haupttext abweichende Umstellung der Ereignisse noch dessen Satzabbruch in Vers 8. Die schwierige, mit Obelus gekennzeichnete Stelle in Vers 4 bleibt vorsichtig übersetzt und textkritisch erläutert. Der auffällige Wechsel von Plural zu Singular in Vers 5 wird nicht harmonisiert.
