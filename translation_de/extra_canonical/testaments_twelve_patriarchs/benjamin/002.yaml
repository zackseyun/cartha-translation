base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/002.yaml
  text: '1 And when we went down into Egypt[a], Joseph my brother recognized me and said to me, “They smeared your tunic with blood and said, ‘See whether this is your son’s tunic.’”

    2 And he said to me, “Yes, brother. For when the Ishmaelites took me, one of them stripped me of my tunic and gave me a loincloth; and after flogging me, he told me to run.

    3 And while he was going away to hide my garment, a lion met him and killed him.

    4 So his companions, being afraid, sold me to others of their company.

    5 Thus Joseph did not lie in saying these things; for he wanted to hide from me the deeds of our brothers.

    6 And he called his brothers to himself and said,

    7 ‘Do not tell my father what you did to me, but speak in this way, just as I explained it to Benjamin.

    8 And let such thoughts be in you[b][c][d], and let not the words come…’'
translation:
  language: de
  text: '**Das Testament Benjamins 2**


    **1** Als wir nach Ägypten kamen, erkannte mich mein Bruder und sagte zu mir: »Sie bestrichen dein Gewand mit Blut und sagten: ›Prüfe, ob dies dein Gewand ist.‹«[a]


    **2** Dann sagte er zu mir: »Ja, Bruder. Als sie mir mein Gewand auszogen, übergaben sie mich den Ismaelitern. Sie gaben mir einen Lendenschurz, peitschten mich aus und befahlen mir zu laufen.


    **3** Als einer von ihnen mich mit einem Stock schlug, begegnete ihm ein Löwe und tötete ihn.


    **4** Seine Gefährten bekamen Angst und hielten mich daraufhin unter erleichterten Bedingungen fest.«[b]


    **5** Sie logen nicht, als sie dies sagten; denn er wollte mir die Taten unserer Brüder verheimlichen.[c]


    **6** Dann rief er seine Brüder zu sich und sagte:


    **7** »Sagt meinem Vater nicht, was ihr mir angetan habt, sondern erzählt es so, wie ich es Benjamin erklärt habe.


    **8** Solche Gedanken sollen in euch sein, und diese Worte sollen nicht in das Herz meines Vaters gelangen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut dieses Satzes ist schwer verständlich und in den Textzeugen unterschiedlich überliefert. Einige Zeugen formulieren ausführlicher: »Sie schickten es hin und sagten: ›Prüfe, ob dies das Gewand deines Sohnes ist.‹«'
    reason: textual_variant; anchor 2:1
  - marker: b
    text: Der griechische Text ist hier beschädigt. Wörtlich verweist er ungefähr auf ein Festhalten »in Erleichterung« bzw. unter Lockerung der Bedingungen. Andere Textzeugen berichten stattdessen, dass die Männer Josef an andere Händler ihrer Gruppe oder an Ismaeliter verkauften.
    reason: textual_variant; anchor 2:4
  - marker: c
    text: Der griechische Satz wechselt unvermittelt vom Plural »sie logen nicht« zum Singular »er wollte«. Der Wechsel wurde beibehalten; im Zusammenhang ist mit »er« wahrscheinlich Josef gemeint.
    reason: textual_or_syntactic_ambiguity; anchor 2:5
lexical_decisions:
- source_word: ἐγνώρισέν με
  choice: erkannte mich
  rationale: Das Verb bezeichnet hier am natürlichsten das persönliche Erkennen Benjamins durch seinen Bruder; die mögliche Bedeutung »gab sich mir zu erkennen« wird vom überlieferten aktiven Wortlaut nicht ausdrücklich verlangt.
- source_word: ἔφυραν … αἵματι
  choice: bestrichen … mit Blut
  rationale: Das Verb bedeutet grundsätzlich mischen oder verkneten, bezeichnet bei einem Gewand und Blut aber anschaulich das Bestreichen oder Beschmieren.
- source_word: χιτών
  choice: Gewand
  rationale: »Gewand« ist im Deutschen klar, würdig und weniger missverständlich als das altertümliche »Leibrock«; es hält zugleich den Gegenstand allgemeiner, als es »Tunika« tun würde.
- source_word: περίζωμα
  choice: Lendenschurz
  rationale: Das Wort bezeichnet ein um die Hüften getragenes Tuch; »Lendenschurz« ist konkret und allgemein verständlich.
- source_word: φραγγελλώσαντες
  choice: peitschten mich aus
  rationale: Die Wendung gibt die körperliche Misshandlung kräftig und in heutigem Deutsch wieder.
- source_word: τρέχειν
  choice: zu laufen
  rationale: Der Infinitiv nach dem Verb des Befehlens wird unmittelbar und ohne zusätzliche Deutung wiedergegeben.
- source_word: ῥάβδῳ μαστίζων
  choice: schlug mich mit einem Stock
  rationale: Die Wiedergabe unterscheidet diese mit einem Stab ausgeführte Misshandlung sprachlich von der zuvor genannten Auspeitschung.
- source_word: ὑπήντησεν αὐτῷ λέων
  choice: da begegnete ihm ein Löwe
  rationale: Die schlichte, anschauliche Erzählweise des griechischen Satzes bleibt erhalten.
- source_word: ἀνεῖλεν
  choice: tötete
  rationale: »Tötete« ist direkt, sachlich und nicht unnötig altertümlich.
- source_word: μέτοχοι
  choice: Gefährten
  rationale: Gemeint sind die anderen Angehörigen derselben Gruppe; »Gefährten« passt zum erzählerischen und testamentarischen Register.
- source_word: τὰ ἔργα τῶν ἀδελφῶν ἡμῶν
  choice: die Taten unserer Brüder
  rationale: »Taten« bewahrt sowohl den konkreten Bezug als auch das moralische Gewicht der Aussage.
- source_word: ἐξηγησάμην
  choice: erklärt habe
  rationale: Das Verb kann ein ausführliches Darlegen oder Erzählen bezeichnen; hier passt »erklärt« zu Josefs Anweisung über die darzustellende Version des Geschehens.
- source_word: αἱ ἔννοιαι γένωνται ἐν ὑμῖν τοιαῦται
  choice: Solche Gedanken sollen auch in euch sein
  rationale: Die Formulierung bewahrt das innere, auf die Gesinnung gerichtete Moment von ἔννοιαι, ohne es konfessionell auszudeuten.
theological_decisions:
- issue: Josefs Verschweigen der Schuld seiner Brüder
  choice: Die ausdrückliche Absicht, Benjamin die Taten der Brüder zu verheimlichen, bleibt stehen.
  alternative: Die Aussage als bloße Wiederholung tatsächlicher Ereignisse ohne Betonung des Verheimlichens zu verstehen.
  rationale: Der griechische Wortlaut nennt mit ἤθελεν … κρύπτειν ausdrücklich den Willen zum Verbergen. Dadurch tritt Josefs schonender Umgang mit seinen Brüdern hervor, ohne dass seine Beweggründe über den Text hinaus dogmatisch erklärt werden.
- issue: Wechsel zwischen pluralischem und singularischem Subjekt in Vers 5
  choice: Der Wechsel wird mit »Sie …; denn er …« bewahrt.
  alternative: Das erste Subjekt ausdrücklich zu »Josef« zu ändern oder den ganzen Satz auf die Gefährten zu beziehen.
  rationale: Der überlieferte griechische Text hat zunächst den Plural οὐκ ἐψεύσαντο und danach den Singular ἤθελεν. Eine Glättung würde die textliche beziehungsweise syntaktische Spannung verdecken.
- issue: Unsicherer Wortlaut über die Reaktion der Gefährten
  choice: Den schwer verständlichen Ausdruck als weniger strenges Festhalten wiedergeben und die Unsicherheit in einer Fußnote offenlegen.
  alternative: Nach anderen Zeugen übersetzen, dass Josef an andere Händler oder erneut an Ismaeliter verkauft wurde.
  rationale: Der vorgelegte griechische Haupttext enthält ἐν ἀνέσει … κατέσχεν, dessen Grundgedanke auf Erleichterung oder Lockerung weist, ist aber grammatisch beschädigt. Die Hauptübersetzung folgt diesem Zeugen vorsichtig, ohne die abweichende Überlieferung zu verschweigen.
- issue: Abschluss des Kapitels in Vers 8
  choice: Den im gelieferten griechischen Text vollständigen Satz vollständig übersetzen.
  alternative: Wie die englische Konsultationsfassung mit einem Satzabbruch enden.
  rationale: Die vorgelegte griechische Quelle enthält den vollständigen Wunsch, dass die Worte nicht in das Herz des Vaters gelangen sollen. Originalsprachliche Evidenz hat hier Vorrang vor der unvollständigen englischen Konsultationsschicht.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Archaismen wie »Leibrock«, »Geißel« und »erschlug« wurden vermieden. Direkte Rede und Satzglieder bleiben nahe am griechischen Aufbau, während beschädigte oder mehrdeutige Stellen nicht stillschweigend geglättet, sondern knapp erläutert werden.
