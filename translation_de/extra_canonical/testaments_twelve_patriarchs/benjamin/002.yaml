  source_fidelity: 'Eine Korrektur ist nötig: Das griechische Ὅτε ... ἦλθον ist Plural („als wir ... kamen“), während der Entwurf in Vers 1 unbegründet zum Singular wechselt. Im Übrigen folgt die Fassung dem vorgelegten griechischen Haupttext angemessen, einschließlich des beschädigten Wortlauts in Vers 4, des Numeruswechsels in Vers 5 und des im Griechischen vollständig überlieferten Satzes in Vers 8.'
  naturalness: Die revidierte Fassung verwendet heutiges Standarddeutsch und bewahrt einen sachlich-erzählenden, leicht gehobenen Registerton. „Unter erleichterten Bedingungen fest“ ist eine bewusst zurückhaltende Wiedergabe der beschädigten Stelle und wird erläutert.
  terminology: „Gewand“, „Lendenschurz“, „auspeitschen“, „Stock“, „Gefährten“ und „Taten“ sind kontextgerecht. Die Formulierung „Prüfe, ob dies dein Gewand ist“ gibt den Imperativ ἐπίγνωθι und das possessive σου ohne die nur in abweichenden Zeugen enthaltene Ergänzung „deines Sohnes“ wieder.
  issues:
  - severity: medium
    issue: Vers 1 übersetzt das pluralische Subjekt als Singular.
    rationale: Der Ausgangstext lautet Ὅτε δὲ ἦλθον εἰς Αἴγυπτον („als wir nach Ägypten kamen“). „Als ich nach Ägypten kam“ verändert diese explizite grammatische Angabe.
  - severity: low
    issue: Die direkte Aufforderung in Vers 1 ist im Entwurf unvollständig bestimmt.
    rationale: „Erkenne, ob dies das Gewand ist“ lässt im Deutschen offen, wessen Gewand gemeint ist. Das griechische σου erlaubt und erfordert hier „dein Gewand“, ohne die textkritisch unsichere Ergänzung „deines Sohnes“ in den Haupttext zu übernehmen.
