base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/benjamin/007.yaml
  text: '7[a]. And he purifies his mind so as not to be condemned by men, and likewise by God. In the same way, the works of Beliar also are twofold, and they have no simplicity in them.


    Therefore, my children[b], I tell you: flee the evil of Beliar, because he gives a sword to those who obey him. And the sword is the mother of seven evils. First the mind conceives through Beliar, and these are its births: first envy, second destruction, third affliction, fourth captivity, fifth want, sixth turmoil, seventh desolation.


    Because of this, Cain was handed over to seven acts of vengeance. For in one hundred years the Lord brought one plague upon him after another[c], and in the nine-hundredth year he was made desolate.'
translation:
  language: de
  text: '**7**


    **1** Darum, meine Kinder, sage ich euch: Flieht das Böse Beliars[a], denn er gibt denen, die ihm gehorchen, ein Schwert.


    **2** Dieses Schwert aber ist die Mutter von sieben Übeln. Als Erstes empfängt der Verstand durch Beliar und bringt hervor: erstens Neid, zweitens Verderben, drittens Bedrängnis, viertens Gefangenschaft[b], fünftens Mangel, sechstens Aufruhr, siebtens Verwüstung.


    **3** Darum wurde auch Kain von Gott sieben Vergeltungen ausgeliefert. Denn alle hundert Jahre brachte der Herr eine Plage über ihn.


    **4** Zweihundert Jahre lang leidet er, und im neunhundertsten Jahr wird er verwüstet[c]. Denn wegen seines Bruders Abel wurde er durch alle Übel gerichtet, Lamech aber [durch] siebzigmal sieben.


    **5** Denn bis in Ewigkeit werden diejenigen, die Kain in solchem Neid und Bruderhass gleichen, durch Gericht bestraft werden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im griechischen Text steht die Namensform „Beliar“; vielen ist die Gestalt unter dem Namen „Belial“ bekannt.
    reason: lexical_alternative
  - marker: b
    text: Die Bezeichnung des vierten Übels ist textlich unsicher. Der gedruckte griechische Text bietet θεηλασία, eine in diesem Zusammenhang unpassende bzw. verderbte Lesart; andere Textzeugen bieten αἰχμαλωσία, „Gefangenschaft“. Diese wahrscheinlichere Lesart wird hier übersetzt.
    reason: textual_variant
  - marker: c
    text: 'Die Zeitangaben sind im überlieferten griechischen Text schwer miteinander zu vereinbaren: Genannt werden eine Plage je hundert Jahre, zweihundert Jahre des Leidens und die Verwüstung im neunhundertsten Jahr. Die Übersetzung glättet diese Angaben nicht.'
    reason: textual_difficulty
lexical_decisions:
- source_word: Βελίαρ
  choice: Beliar
  rationale: Die Namensform des griechischen Zeugen wird bewahrt und nicht zur bekannteren Form „Belial“ normalisiert.
- source_word: μάχαιρα
  choice: Schwert
  rationale: Die übliche und dem ernsten Bild angemessene Wiedergabe des als Waffe verstandenen Gegenstands.
- source_word: πειθομένοις
  choice: die ihm gehorchen
  rationale: Das Partizip kann „sich überzeugen lassen“ bedeuten; im ethischen Zusammenhang bezeichnet es die willige Gefolgschaft gegenüber Beliar.
- source_word: διάνοια
  choice: Verstand
  rationale: Bezeichnet hier das innere Denk- und Willensvermögen, in dem das Böse empfangen wird.
- source_word: συλλαμβάνει
  choice: empfängt
  rationale: Bewahrt zusammen mit „Mutter“ die Metapher von Empfängnis und Hervorbringung, ohne sie im Deutschen unnötig auszubauen.
- source_word: φθόνος
  choice: Neid
  rationale: Präzise und geläufige Bezeichnung des genannten Lasters.
- source_word: ἀπώλεια
  choice: Verderben
  rationale: Gibt den ruinösen Ausgang wieder, ohne einen späteren dogmatischen Fachsinn einzutragen.
- source_word: θλῖψις
  choice: Bedrängnis
  rationale: Bewahrt sowohl den Druck als auch das daraus folgende Leiden.
- source_word: θεηλασία
  choice: Heimsuchung
  rationale: Der gedruckte griechische Ausdruck bezeichnet am ehesten eine von Gott beziehungsweise einer Gottheit gesandte Plage oder Strafheimsuchung; die textliche Unsicherheit wird in einer Fußnote offengelegt.
- source_word: ἔνδεια
  choice: Mangel
  rationale: Schlichte, genaue Wiedergabe materieller oder allgemeiner Not.
- source_word: ταραχή
  choice: Aufruhr
  rationale: Vermittelt Unordnung und Erschütterung im Katalog der zerstörerischen Folgen.
- source_word: ἐρήμωσις / ἐρημοῦται
  choice: Verwüstung / wird verwüstet
  rationale: Die Wortverwandtschaft des griechischen Substantivs und Verbs bleibt im Deutschen sichtbar.
- source_word: ἐκδικίαις
  choice: Vergeltungsstrafen
  rationale: Verbindet den Gedanken strafender Vergeltung mit den mehrfachen göttlichen Strafakten.
- source_word: μισαδελφία
  choice: Bruderhass
  rationale: Das kompakte deutsche Wort bewahrt die konkrete Ausrichtung des Hasses gegen den Bruder.
theological_decisions:
- issue: Beliar als Urheber einer Kette von Übeln
  choice: Die Schwert-, Mutter- und Empfängnismetaphorik bleibt stehen.
  alternative: Die Bilder als bloße Aussage über die Folgen böser Gedanken zu umschreiben.
  rationale: Der Text verbindet persönliche Verführung, innere Empfängnis und hervorgebrachte Übel, ohne ihr Verhältnis systematisch aufzulösen.
- issue: Göttliche Vergeltung an Kain
  choice: Kain wird von Gott sieben Vergeltungsstrafen ausgeliefert.
  alternative: Die Aussage an die Chronologie oder Ausdrucksweise von Genesis 4 anzugleichen.
  rationale: Die eigenständige Straftradition des Testaments ist wiederzugeben und darf nicht stillschweigend mit dem Genesisbericht harmonisiert werden.
- issue: Raue Zahlen- und Zeitangaben zu Kains Strafe
  choice: Die Angaben von jeweils hundert Jahren, zweihundert Jahren und dem neunhundertsten Jahr werden unverändert wiedergegeben.
  alternative: Die Zahlen zu einer widerspruchsfreien Abfolge umzuformen oder einzelne Angaben auszulassen.
  rationale: Der überlieferte griechische Text ist an dieser Stelle schwierig; seine Spannung wird bewahrt und in einer Fußnote kenntlich gemacht.
- issue: Gericht über Kainähnliche
  choice: Das künftige beziehungsweise fortdauernde Gericht bleibt als Bestrafung „bis in Ewigkeit“ formuliert.
  alternative: Die Aussage ausschließlich auf zeitliche irdische Folgen von Neid und Bruderhass zu beziehen.
  rationale: Der griechische Wortlaut verbindet eine umfassende Zeitangabe mit Gericht und Strafe; eine engere dogmatische Festlegung wäre nicht textlich erzwungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die wiederholte Aufzählungsstruktur und die bildhafte Sprache des griechischen Textes bleiben erhalten. Archaisierende Formen wurden vermieden; „Heimsuchung“, „Verderben“ und „Vergeltungsstrafen“ dienen jedoch dem ernsten paränetischen Register.
