revisions:
- from: '**7**


    **1** Darum, meine Kinder, sage ich euch: Flieht das Böse Beliars[a], denn er gibt denen, die ihm gehorchen, ein Schwert.


    **2** Dieses Schwert aber ist die Mutter von sieben Übeln. Zuerst empfängt der Verstand durch Beliar; und dies sind die Übel: das erste Neid, das zweite Verderben, das dritte Bedrängnis, das vierte Heimsuchung[b], das fünfte Mangel, das sechste Aufruhr und das siebte Verwüstung.


    **3** Darum wurde auch Kain von Gott sieben Vergeltungsstrafen ausgeliefert. Denn alle hundert Jahre brachte der Herr eine Plage über ihn.


    **4** Zweihundert Jahre lang leidet er, und im neunhundertsten Jahr wird er verwüstet[c]. Denn wegen seines Bruders Abel wurde er mit all diesen Übeln gerichtet, Lamech aber mit siebzigmal sieben.


    **5** Denn bis in Ewigkeit werden alle, die Kain in solchem Neid und Bruderhass gleichen, durch ein entsprechendes Gericht bestraft werden.'
