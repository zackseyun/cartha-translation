source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Ἔλεγον γὰρ ⌜αὐτοῖς⌝¹⁷ οἱ ἐπαοιδοί¹⁸, ὅτι ἐν ἐξόδῳ τῶν¹⁹ ὀστῶν Ἰωσὴφ²⁰ ἔσται ἐν πάσῃ *τῇ γῇ²¹ σκότος καὶ γνόφος καὶ πληγὴ²² μεγάλη²³ τοῖς Αἰγυπτίοις, ὥστε μετὰ λύχνου²⁴ μὴ²⁵ ἐπιγινώσκειν ἕκαστος²⁶ *τὸν ἀδελφὸν²⁷ αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008/004.yaml
  text: For the enchanters were telling them that, when Joseph’s bones went out, there would be over all the land darkness and gloom and a great plague on the Egyptians, so that each man would not recognize his brother, even with a lamp.
translation:
  language: de
  text: Denn die Zauberer sagten ihnen, beim Auszug der Gebeine Josefs werde im ganzen Land Finsternis und Dunkel herrschen und eine große Plage über die Ägypter kommen, sodass keiner seinen Bruder selbst mit einer Lampe erkennen könne.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἱ ἐπαοιδοί
  choice: die Zauberer
  rationale: Bezeichnet Personen, die durch Zaubersprüche oder Beschwörungen wirken; „Zauberer“ ist im Deutschen natürlich und trifft den negativen magischen Zusammenhang.
- source_word: ἐν ἐξόδῳ τῶν ὀστῶν Ἰωσήφ
  choice: beim Auszug der Gebeine Josefs
  rationale: Bewahrt das Exodus-/Auszugsmotiv von ἔξοδος und gibt ὀστᾶ würdig als „Gebeine“ wieder.
- source_word: ἐν πάσῃ τῇ γῇ
  choice: im ganzen Land
  rationale: γῆ kann „Erde“ oder „Land“ bedeuten; im ägyptischen Kontext ist „Land“ die naheliegende, ohne unnötige Universalisierung.
- source_word: σκότος καὶ γνόφος
  choice: Finsternis und Dunkel
  rationale: Gibt die beiden sich verstärkenden Dunkelheitsbegriffe getrennt wieder, ohne ihre rhetorische Häufung einzuebnen.
- source_word: πληγὴ μεγάλη τοῖς Αἰγυπτίοις
  choice: eine schwere Plage über die Ägypter kommen
  rationale: πληγή kann Schlag oder Plage bedeuten; „Plage“ passt zum ägyptischen Motiv. Der Dativ bezeichnet hier die Betroffenen.
- source_word: μετὰ λύχνου
  choice: selbst mit einer Lampe
  rationale: 'Die konzessive Wirkung ergibt sich aus dem Zusammenhang: Auch künstliches Licht würde kein Erkennen ermöglichen.'
theological_decisions:
- issue: Reichweite der angekündigten Finsternis
  choice: „im ganzen Land“
  alternative: „auf der ganzen Erde“
  rationale: Die Mehrdeutigkeit von γῆ wird kontextuell zugunsten Ägyptens als Land verstanden; damit wird keine weltweite Plage in den Text hineingelesen.
- issue: Status der Aussage der Zauberer
  choice: als berichtete Behauptung wiedergegeben
  alternative: als ausdrückliche wahre Prophezeiung formuliert
  rationale: Der griechische Text berichtet lediglich, was die Zauberer sagten; die Übersetzung bestätigt deren Aussage nicht zusätzlich als göttliche Offenbarung.
translation_notes:
  register: Modernes, gut verständliches Hochdeutsch mit würdigem erzählerischem Ton. Der Satzbau bleibt nahe an der griechischen Folge, wird aber für natürliches Deutsch geglättet. „Gebeine“ erhält den feierlich-antiken Klang, während „Zauberer“, „Plage“ und „Lampe“ allgemein verständlich bleiben.
