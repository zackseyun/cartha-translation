review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die wesentlichen Elemente des griechischen Textes zutreffend wieder: die ἐπαοιδοί als magisch Tätige, den Auszug der Gebeine Josefs, die Doppelformel σκότος καὶ γνόφος, die große Plage für die Ägypter und die Unmöglichkeit, den Bruder selbst bei Lampenlicht zu erkennen. Allerdings ist ἔλεγον Imperfekt („sagten/erzählten“) und nicht Plusquamperfekt („hatten gesagt“). Außerdem entspricht „große Plage“ πληγὴ μεγάλη unmittelbarer als die interpretierende Verstärkung „schwere Plage“.'
  naturalness: Der Satz ist in modernem Standarddeutsch gut verständlich und angemessen erzählerisch. Die Folge „sodass keiner seinen Bruder erkennen könne, selbst mit einer Lampe“ ist verständlich; die Stellung von „selbst mit einer Lampe“ direkt beim Verb macht den konzessiven Sinn etwas klarer.
  terminology: „Zauberer“ ist für οἱ ἐπαοιδοί vertretbar und natürlich. „Gebeine Josefs“ wahrt den gehobenen, traditionsbezogenen Ton von ὀστᾶ. „Finsternis und Dunkel“ erhält die zweigliedrige Häufung. „Land“ ist im ägyptischen Kontext eine plausible kontextuelle Wiedergabe von γῆ.
  issues:
  - severity: medium
    issue: Unzutreffendes Tempus bei „hatten ihnen gesagt“
    rationale: 'Das griechische ἔλεγον steht im Imperfekt und schildert eine andauernde bzw. wiederholte Redehandlung: „die Zauberer sagten ihnen“ bzw. „erzählten ihnen“. Ein Plusquamperfekt ist im Ausgangstext nicht angezeigt.'
  - severity: low
    issue: „schwere Plage“ verstärkt μεγάλη interpretierend
    rationale: μεγάλη bedeutet primär „groß“. „Große Plage“ ist ebenso idiomatisch und hält sich enger an die Wortwahl des griechischen Textes.
  revised_text: Denn die Zauberer sagten ihnen, beim Auszug der Gebeine Josefs werde im ganzen Land Finsternis und Dunkel herrschen und eine große Plage über die Ägypter kommen, sodass keiner seinen Bruder selbst mit einer Lampe erkennen könne.
