revisions:
- from: Denn die Zauberer hatten ihnen gesagt, beim Auszug der Gebeine Josefs werde im ganzen Land Finsternis und Dunkel herrschen und eine schwere Plage über die Ägypter kommen, sodass keiner seinen Bruder erkennen könne, selbst mit einer Lampe.
  to: Denn die Zauberer sagten ihnen, beim Auszug der Gebeine Josefs werde im ganzen Land Finsternis und Dunkel herrschen und eine große Plage über die Ägypter kommen, sodass keiner seinen Bruder selbst mit einer Lampe erkennen könne.
  rationale: Die Revision korrigiert das Plusquamperfekt zum dem Imperfekt entsprechenden Präteritum und ersetzt die stärker deutende Formulierung „schwere Plage“ durch „große Plage“. Im Übrigen bleibt die Übersetzung unverändert, da sie Sinn, Register und berichteten Charakter der Aussage sachgerecht wiedergibt.
  reviewer_model: gpt-5.6-terra
