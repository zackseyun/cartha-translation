review_pass:
  verdict: revise
  source_fidelity: 'Die Satzabfolge des Entwurfs weicht vom Griechischen ab: μετὰ τῶν πατέρων αὐτοῦ gehört unmittelbar zu ἐκοιμήθη und ist nicht als nachfolgende passive Vereinigung ausgedrückt. Außerdem fügt „alle“ zu „Anweisungen“ eine im Ausgangstext nicht ausdrücklich vorhandene Quantifizierung hinzu. Die Altersangabe ist korrekt.'
  naturalness: „Entschlief mit seinen Vätern“ ist in modernem, würdigem Deutsch verständlich und bildet die knappe griechische Verbindung genauer ab. Die Wiedergabe „wurde mit seinen Vätern vereint“ klingt zwar natürlich, verändert jedoch die Verbstruktur und verstärkt den Vorgang gegenüber dem Quelltext.
  terminology: „entschlief“ bewahrt das Todesbild von ἐκοιμήθη. „seinen Vätern“ ist als traditionelle, quellentreue Bezeichnung für die Vorfahren beizubehalten; keine Fußnote ist erforderlich.
  issues:
  - severity: medium
    issue: „wurde mit seinen Vätern vereint“ ersetzt die griechische Präpositionalfügung bei „entschlief“ durch einen eigenständigen passiven Vorgang.
    rationale: Der Text sagt, dass Simeon „mit seinen Vätern entschlief“, nicht ausdrücklich, dass er anschließend mit ihnen vereint wurde. Die Umformung ist interpretierend und verändert die syntaktische Verknüpfung.
  - severity: low
    issue: „alle Anweisungen“ fügt „alle“ hinzu.
    rationale: συνετέλεσεν ἐντελλόμενος bezeichnet das Abschließen seines Anweisens; eine explizite Gesamtquantifizierung steht nicht im griechischen Text.
  - severity: low
    issue: Die Abfolge von Todesformel und Altersangabe wurde umgestellt.
    rationale: Eine Umstellung wäre nicht zwingend falsch, doch die quellennähere Reihenfolge lässt sich im Deutschen ohne Härte bewahren.
