  rationale: Die Revision entfernt die nicht im Text enthaltene Quantifizierung „alle“ und gibt μετὰ τῶν πατέρων αὐτοῦ unmittelbar bei „entschlief“ wieder. Damit bleiben Todesbild, Bezug auf die Vorfahren und Reihenfolge des griechischen Textes erhalten, bei natürlichem modernem Standarddeutsch.
