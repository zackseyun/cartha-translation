  text: Καὶ ὡς¹ συνετέλεσεν² Συμεὼν ἐντελλόμενος³ τοῖς υἱοῖς⁴ αὐτοῦ⁵, ἐκοιμήθη⁶ *μετὰ τῶν πατέρων αὐτοῦ⁷ *ὢν ἐτῶν ἑκατὸν εἴκοσι⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008/001.yaml
  text: And when Simeon had finished commanding his sons, he fell asleep with his fathers, being one hundred and twenty years old.
translation:
  language: de
  text: Und als Simeon seinen Söhnen seine Anweisungen gegeben hatte, entschlief er mit seinen Vätern im Alter von hundertzwanzig Jahren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνετέλεσεν ἐντελλόμενος
  choice: alle Anweisungen gegeben hatte
  rationale: Gibt den Abschluss des eindringlichen Anweisens natürlich und vollständig wieder, ohne das im Deutschen schwerfällige „zu gebieten beendet hatte“.
- source_word: ἐκοιμήθη
  choice: entschlief
  rationale: Bewahrt den verhüllenden Ausdruck für den Tod und den würdevollen Ton des griechischen Textes.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: wurde mit seinen Vätern vereint
  rationale: Gibt die traditionelle Vorstellung der Vereinigung mit den verstorbenen Vorfahren verständlich wieder; bloßes „mit seinen Vätern“ wäre nach „entschlief“ im heutigen Deutsch unvollständig.
- source_word: ὢν ἐτῶν ἑκατὸν εἴκοσι
  choice: im Alter von hundertzwanzig Jahren
  rationale: Natürliche deutsche Altersangabe bei unverändertem Zahlenwert.
theological_decisions:
- issue: Bedeutung des Schlafmotivs beim Tod
  choice: „entschlief“ beibehalten
  alternative: „starb“
  rationale: Das Bild des Schlafes steht ausdrücklich im griechischen Text; die Übersetzung bewahrt es, ohne daraus eine bestimmte Lehre über den Zustand der Toten abzuleiten.
- issue: Verhältnis zu den Vätern
  choice: „wurde mit seinen Vätern vereint“
  alternative: „entschlief mit seinen Vätern“
  rationale: Die Formulierung bewahrt den Bezug auf die Vorfahren und vermeidet zugleich eine im Deutschen missverständliche Aussage über gemeinsames Einschlafen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde gegenüber dem Griechischen leicht geglättet; das traditionelle Todesbild „entschlief“ bleibt erhalten.
