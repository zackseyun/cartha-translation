  rationale: Eine minimale stilistische Korrektur ersetzt die im Deutschen unnatürliche Präpositionalkonstruktion. Die Übersetzung legt weder fest, ob die Ägypter Krieg führten, in einen Krieg verwickelt waren oder die Gegner waren, noch verändert sie die wiederholte Aufwärtsbewegung des griechischen Verbs.
