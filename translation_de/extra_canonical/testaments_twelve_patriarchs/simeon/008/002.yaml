source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ ἔθηκαν αὐτὸν ἐν *θήκῃ ξυλίνῃ⁹, *τοῦ ἀναγαγεῖν τὰ ὀστᾶ αὐτοῦ¹⁰ ἐν Χεβρών. Καὶ ἀνήγαγον¹¹ *αὐτὰ ἐν πολέμῳ Αἰγυπτίων κρυφῇ¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008/002.yaml
  text: And they placed him in a wooden coffin, to bring up his bones to Hebron. And they brought them up secretly in a war of the Egyptians.
translation:
  language: de
  text: Und sie legten ihn in einen hölzernen Sarg, um seine Gebeine nach Hebron hinaufzubringen. Und sie brachten sie heimlich während eines Krieges der Ägypter hinauf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θήκῃ ξυλίνῃ
  choice: in einen hölzernen Sarg
  rationale: θήκη bezeichnet hier im Bestattungskontext einen Behälter für den Leichnam; „Sarg“ ist die natürliche und sachlich passende deutsche Wiedergabe, während ξυλίνη ausdrücklich das Material angibt.
- source_word: ὀστᾶ
  choice: Gebeine
  rationale: „Gebeine“ gibt die sterblichen Knochen in einem würdigen Bestattungskontext prägnant wieder.
- source_word: ἀναγαγεῖν / ἀνήγαγον
  choice: hinaufzubringen / brachten … hinauf
  rationale: Die wiederholte Richtungsangabe des griechischen Verbs wird in beiden Sätzen bewahrt.
- source_word: κρυφῇ
  choice: heimlich
  rationale: Das Adverb bezeichnet eine verborgene, nicht öffentlich ausgeführte Handlung.
- source_word: ἐν πολέμῳ Αἰγυπτίων
  choice: in einem Krieg der Ägypter
  rationale: Die formal mögliche und im Ausgangstext bewahrte Genitivverbindung wird nicht durch eine präzisierende Deutung wie „gegen die Ägypter“ oder „während eines ägyptischen Krieges“ aufgelöst.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas ungewöhnliche Wendung „in einem Krieg der Ägypter“ bleibt bewusst erhalten, weil der griechische Genitiv die genaue Beziehung der Ägypter zum Krieg nicht ausdrücklich festlegt.
