source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Τὰ γὰρ ὀστᾶ τοῦ Ἰωσὴφ ἐφύλαττον¹³ *οἱ Αἰγύπτιοι¹⁴ ἐν τοῖς μνήμασι¹⁵ τῶν βασιλέων¹⁶.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008/003.yaml
  text: For the Egyptians were keeping Joseph’s bones in the tombs of the kings, so as to bring him up.
translation:
  language: de
  text: Denn die Ägypter bewahrten Josefs Gebeine in den Gräbern der Könige auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφύλαττον
  choice: bewahrten … auf
  rationale: Das Imperfekt bezeichnet ein andauerndes Bewahren oder Hüten; „aufbewahren“ ist im Deutschen hier natürlich und wahrt den zeitlichen Verlauf.
- source_word: τὰ ὀστᾶ τοῦ Ἰωσήφ
  choice: Josefs Gebeine
  rationale: „Gebeine“ ist die geläufige würdevolle Bezeichnung für die sterblichen Knochen eines Verstorbenen.
- source_word: ἐν τοῖς μνήμασι τῶν βασιλέων
  choice: in den Gräbern der Könige
  rationale: Gibt die räumliche Zuordnung und den Genitiv formal und klar wieder.
theological_decisions:
- issue: Im englischen POB steht zusätzlich der Zwecksatz „so as to bring him up“.
  choice: Der Zwecksatz wird nicht aufgenommen.
  alternative: „um ihn hinaufzubringen“
  rationale: Im bereitgestellten griechischen Ausgangstext steht kein entsprechender Zwecksatz. Die Übersetzung folgt daher vorrangig dem originalsprachlichen Quellenbeleg und ergänzt keine dort unbezeugte Aussage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gebeine“ passt zum Bestattungskontext, ohne unnötig altertümlich zu wirken; der Satzbau bleibt nah am Griechischen und zugleich natürlich.
