  source_fidelity: 'Der deutsche Text gibt den griechischen Satz vollständig und genau wieder: γάρ als „Denn“, Imperfekt ἐφύλαττον als vergangenheitsbezogenes andauerndes „bewahrten ... auf“, τὰ ὀστᾶ τοῦ Ἰωσήφ als „Josefs Gebeine“ und ἐν τοῖς μνήμασι τῶν βασιλέων als „in den Gräbern der Könige“. Der im englischen Audit-Text vorhandene Zweckzusatz „so as to bring him up“ ist im vorgelegten griechischen Text nicht belegt und wird zu Recht nicht ergänzt.'
  naturalness: „Denn die Ägypter bewahrten Josefs Gebeine in den Gräbern der Könige auf“ ist natürliches, modernes und zugleich dem Bestattungskontext angemessen würdevolles Standarddeutsch. Die Verbklammer ist idiomatisch.
  terminology: „Gebeine“ ist hier eine treffende, verständliche und registergerechte Wiedergabe von ὀστᾶ. „Josefs“ und „Könige“ sind korrekt; es bestehen keine theologischen oder namensbezogenen Probleme.
