  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007/003.yaml
  text: Therefore I command these things to you, so that you also may command your children, that they may keep them for their generations.
translation:
  language: de
  text: Darum gebiete ich euch dies, damit auch ihr euren Kindern gebietet, damit sie dies für ihre Generationen bewahren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Darum
  rationale: Gibt die folgernde Verknüpfung knapp und natürlich wieder.
- source_word: ταῦτα
  choice: dies
  rationale: Das griechische Neutrum Plural bezeichnet die zuvor genannten Weisungen; im Deutschen ist das zusammenfassende Singularpronomen idiomatisch.
- source_word: ἐντέλλομαι
  choice: gebiete
  rationale: Bewahrt den verbindlichen Charakter des Auftrags und entspricht der Wiederholung von ἐντέλλεσθε.
- source_word: τοῖς τέκνοις ὑμῶν
  choice: euren Kindern
  rationale: Direkte, natürliche Wiedergabe ohne die nicht im Ausgangstext enthaltene Erweiterung auf das Volk Israel.
- source_word: φυλάξωσιν αὐτά
  choice: es … zu bewahren
  rationale: φυλάσσω meint hier das Beachten und Bewahren der erteilten Weisungen; „es“ nimmt das im Deutschen zusammenfassend als „dies“ bezeichnete Ganze auf.
- source_word: εἰς τὰς γενεὰς αὐτῶν
  choice: über ihre Generationen hin
  rationale: Drückt die Weitergeltung durch die nachfolgenden Generationen aus, ohne ein ausdrücklich nicht vorhandenes „alle“ einzufügen.
theological_decisions:
- issue: Reichweite von „Kinder“
  choice: Wörtlich „euren Kindern“ ohne erläuternde Erweiterung
  alternative: „euren Kindern, dem Geschlecht Israels“
  rationale: Der griechische Text enthält keine Apposition oder ausdrückliche Identifizierung mit Israel.
- issue: Zeitliche Bedeutung von εἰς τὰς γενεὰς αὐτῶν
  choice: „über ihre Generationen hin“
  alternative: „für ihre Generationen“
  rationale: Die Formulierung wahrt die mögliche Bedeutung fortdauernder Überlieferung, ohne eine Endlosigkeit dogmatisch festzuschreiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „gebieten“ spiegelt die bewusste lexikalische Wiederholung im Griechischen; die Satzstruktur bleibt klar und gut verständlich.
