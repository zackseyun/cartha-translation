review_pass:
  verdict: revise
  source_fidelity: 'Die Grundbedeutung wird getroffen: Διὰ τοῦτο ist angemessen mit „Darum“ wiedergegeben, und die wiederholte Verwendung von ἐντέλλομαι/ἐντέλλεσθε als „gebieten“ wahrt den verbindlichen Charakter und die rhetorische Wiederholung. Die vorliegende deutsche Satzfügung verschiebt jedoch die syntaktische Gliederung: Das abschließende „es … zu bewahren“ hängt unmittelbar an „euren Kindern gebietet“ und lässt den im Griechischen durch ὅπως ausgedrückten Zweck („damit sie … bewahren“) nicht deutlich erkennen. Zudem ist „es“ nach „euren Kindern“ potenziell mehrdeutig. Die Revision stellt die Zweckbeziehung und den Bezug von αὐτά zu ταῦτα klar wieder her. „für ihre Generationen“ bildet εἰς τὰς γενεὰς αὐτῶν zurückhaltend ab, ohne die Dauer über das im Text Gesagte hinaus auszubauen.'
  naturalness: „Über ihre Generationen hin“ ist im modernen Standarddeutsch markiert und weniger idiomatisch. Die zweifache Zweckkonstruktion mit „damit“ ist zwar bewusst strukturanalog zum Griechischen, bleibt aber klar und würdig. Die Wiederaufnahme mit „dies“ ist verständlicher als das neutrale „es“.
  terminology: „Gebieten“ ist für ἐντέλλομαι passend. „Kinder“ entspricht τέκνα ohne untextliche Eingrenzung. „Bewahren“ gibt φυλάσσω in diesem paraenetischen Zusammenhang angemessen wieder; es wird keine konfessionell festgelegte Terminologie eingeführt.
  issues:
  - severity: medium
    issue: Die zweite Zweckrelation des griechischen ὅπως wird im deutschen Entwurf syntaktisch eingeebnet.
    rationale: '„… euren Kindern gebietet, es … zu bewahren“ kann als bloße Ergänzung zu „gebietet“ gelesen werden. Das Griechische unterscheidet jedoch den Auftrag an die Kinder von dessen Ziel: Die Kinder sollen die Weisungen bewahren.'
  - severity: low
    issue: „es“ ist als Rückverweis auf die Weisungen nach dem Plural „euren Kindern“ nicht optimal klar.
    rationale: Die Wiederholung von „dies“ macht deutlich, dass αὐτά auf die zuvor gebotenen Dinge verweist.
  - severity: low
    issue: „über ihre Generationen hin“ ist stilistisch unidiomatisch.
    rationale: „für ihre Generationen“ ist natürlicher und bleibt nahe bei εἰς τὰς γενεὰς αὐτῶν.
  revised_text: Darum gebiete ich euch dies, damit auch ihr euren Kindern gebietet, damit sie dies für ihre Generationen bewahren.
