    reason: Kennzeichnet die in der griechischen Edition eingeklammerten Wörter Θεὸν καὶ ἄνθρωπον.
  - marker: b
    text: Die Wörter »alle Völker und« sind textkritisch unsicher und fehlen in einem Teil der Überlieferung.
    reason: Kennzeichnet die in der griechischen Edition eingeklammerten Wörter πάντα τὰ ἔθνη καὶ.
  revision_rationale: Keine sichere Korrektur erforderlich. Der deutsche Entwurf folgt dem griechischen Text und dem englischen POB-Audit-Trail, bewahrt die editorisch markierten Unsicherheiten sichtbar und setzt die Fußnotenanker an den jeweiligen unsicheren Zusätzen.
