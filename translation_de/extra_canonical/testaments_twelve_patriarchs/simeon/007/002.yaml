base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007/002.yaml
  text: For the Lord will raise up from Levi a high priest, and from Judah a king, [God and man]; he will save [all the nations and] the race of Israel.
translation:
  language: de
  text: Denn der Herr wird aus Levi einen Hohepriester erwecken und aus Juda einen König, [Gott und Mensch][a]. Er wird [alle Völker und][b] das Volk Israel retten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wörter »Gott und Mensch« sind textkritisch unsicher und fehlen in einem Teil der Überlieferung.
    reason: Kennzeichnet die in der griechischen Edition eingeklammerten Wörter Θεὸν καὶ ἄνθρωπον.
  - marker: b
    text: Die Wörter »alle Völker und« sind textkritisch unsicher und fehlen in einem Teil der Überlieferung.
    reason: Kennzeichnet die in der griechischen Edition eingeklammerten Wörter πάντα τὰ ἔθνη καὶ.
lexical_decisions:
- source_word: Ἀναστήσει
  choice: wird … erwecken
  rationale: Bewahrt den biblisch geprägten Sinn von »aufrichten/auftreten lassen«, ohne eine Auferstehung ausdrücklich festzulegen.
- source_word: ἐκ τοῦ Λευὶ … ἐκ τοῦ Ἰούδα
  choice: aus Levi … aus Juda
  rationale: Gibt Herkunft beziehungsweise stammesmäßige Zuordnung knapp und quellennah wieder.
- source_word: ὡς ἀρχιερέα … ὡς βασιλέα
  choice: einen Hohepriester … einen König
  rationale: Im Zusammenhang bezeichnet ὡς die Rolle, in der die jeweilige Gestalt erweckt wird; die natürliche deutsche Wiedergabe vermeidet das missverständliche »wie einen«.
- source_word: οὗτος
  choice: Er
  rationale: Bezieht sich auf die zuvor genannte Gestalt; die deutsche Pronomenform ist klarer und natürlicher als »dieser«.
- source_word: τὸ γένος τοῦ Ἰσραήλ
  choice: das Volk Israel
  rationale: γένος bezeichnet hier die Abstammungs- und Volksgemeinschaft Israels; »Volk Israel« ist im heutigen Deutsch verständlicher als »Geschlecht Israels«.
theological_decisions:
- issue: Textkritisch unsichere christologische Bezeichnung Θεὸν καὶ ἄνθρωπον
  choice: '[Gott und Mensch] im Haupttext mit Fußnote'
  alternative: Auslassung der Wörter oder unmarkierte Aufnahme in den Haupttext
  rationale: Die eckigen Klammern der Edition weisen die Worte als textkritisch unsicher aus. Ihre sichtbare Bewahrung erhält sowohl den überlieferten Wortlaut als auch dessen Unsicherheit, ohne die christologische Aussage stillschweigend festzuschreiben.
- issue: Textkritisch unsichere universale Heilsangabe πάντα τὰ ἔθνη καὶ
  choice: '[alle Völker und] im Haupttext mit Fußnote'
  alternative: Nur »das Volk Israel«
  rationale: Die universale Erweiterung ist in der Edition als unsicher markiert. Die geklammerte Wiedergabe bewahrt die Spannung zwischen universalem und auf Israel bezogenem Heilsumfang.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht biblischer Prägung. »Erwecken« wahrt den traditionellen Ton, während »Volk Israel« gegenwärtig und allgemein verständlich bleibt. Die textkritisch unsicheren Zusätze bleiben sichtbar geklammert und werden durch unmittelbar gesetzte Fußnotenmarker erläutert.
