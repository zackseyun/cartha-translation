  text: '*Ἀναστήσει γὰρ¹³ Κύριος¹⁴ ἐκ¹⁵ τοῦ Λευὶ ὡς¹⁶ ἀρχιερέα *καὶ ἐκ¹⁷ τοῦ Ἰούδα¹⁸ ὡς¹⁵ βασιλέα¹⁹ [Θεὸν καὶ ἄνθρωπον]²⁰, οὗτος²¹ σώσει *[πάντα τὰ ἔθνη καὶ] τὸ γένος τοῦ Ἰσραήλ²².'
