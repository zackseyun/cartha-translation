id: T12P.SIM.7.1
reference: Testament of Simeon 7:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ νῦν, τέκνα¹ μου, ἐπακούσατε² τοῦ³ Λευὶ καὶ τοῦ⁴ Ἰούδα⁵ καὶ⁷ μὴ ἐπαίρεσθε⁸ ἐπὶ τὰς δύο γενεὰς⁹ ταύτας, ὅτι ἐξ αὐτῶν¹⁰ ἀνατελεῖ ἡμῖν¹¹ τὸ σωτήριον ⌜τοῦ Θεοῦ⌝¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007/001.yaml
  text: And now, my children, listen to Levi and to Judah, and do not exalt yourselves over these two tribes, because from them the salvation of God will rise for us.
translation:
  language: de
  text: Und nun, meine Kinder, hört auf Levi und Juda und erhebt euch nicht über diese beiden Stämme; denn aus ihnen wird für uns das Heil [a]Gottes aufgehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte »Gottes« sind in der griechischen Textüberlieferung unsicher.
    reason: Die Quellenausgabe setzt τοῦ Θεοῦ in textkritische Klammern; diese Unsicherheit soll nicht stillschweigend beseitigt werden.
lexical_decisions:
- source_word: ἐπακούσατε
  choice: hört auf
  rationale: Gibt sowohl das Hören als auch den auffordernden Sinn von »Beachtung schenken/folgen« in natürlichem Deutsch wieder.
- source_word: γενεὰς
  choice: Stämme
  rationale: Im Zusammenhang mit Levi und Juda bezeichnet das Wort hier deren Stammeslinien, nicht lediglich zeitliche Generationen.
- source_word: ἀνατελεῖ
  choice: wird … aufgehen
  rationale: Bewahrt das Bild des Aufgehens oder Hervortretens, das im griechischen Verb liegt, ohne es auf eine einzige messianische Deutung festzulegen.
- source_word: τὸ σωτήριον
  choice: das Heil
  rationale: Das substantivierte Neutrum bezeichnet Gottes rettendes Heil beziehungsweise Rettung; »das Heil« ist würdig, verständlich und hält den Ausdruck offen.
theological_decisions:
- issue: Bezug und Gestalt des kommenden Heils
  choice: »aus ihnen wird für uns das Heil … aufgehen«
  alternative: »aus ihnen wird für uns der Retter … hervorgehen«
  rationale: Der griechische Text nennt ausdrücklich τὸ σωτήριον, »das Heil/die Rettung«, nicht direkt eine Person. Die bildhafte und theologisch offene Formulierung bleibt daher erhalten.
- issue: Textkritische Unsicherheit bei τοῦ Θεοῦ
  choice: »Gottes« im Haupttext mit Fußnote
  alternative: Die Worte »Gottes« auslassen
  rationale: Die Editionsklammern kennzeichnen eine textkritische Unsicherheit. Die Wörter werden wegen ihrer Bezeugung übersetzt, ihre Unsicherheit wird jedoch transparent vermerkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Meine Kinder« bewahrt die familiäre Anrede; »hört auf« und »erhebt euch nicht über« sind allgemein verständlich. Das Semikolon gliedert Mahnung und Begründung klar.
