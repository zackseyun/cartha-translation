  source_fidelity: 'Der Satzbau und die Grundbedeutungen sind zutreffend wiedergegeben: Ἰδού als feierlicher Aufmerksamkeitsruf, Perfekt εἴρηκα, πάντα sowie der Zwecksatz mit ὅπως und Aoristpassiv δικαιωθῶ. Die Verbindung δικαιωθῶ ἀπὸ τῆς ἁμαρτίας ὑμῶν ist im Griechischen ungewöhnlich und bezeichnet wahrscheinlich eine Rechtfertigung bzw. Entlastung des Sprechers im Blick auf die Sünde der Angeredeten. Die deutsche Fassung „von eurer Sünde gerechtfertigt“ bildet zwar ἀπό formal nach, erzeugt aber eine im Deutschen missverständliche Beziehung, als sei die Sünde das rechtfertigende Mittel oder der Grund.'
  naturalness: „Siehe“ passt zu dem bewusst feierlichen Register. „damit ich in Bezug auf eure Sünde gerechtfertigt werde“ ist modernes, verständliches Standarddeutsch und bewahrt zugleich den forensischen Ausdruck sowie die nicht weiter aufgelöste genaue Verantwortungsbeziehung.
  terminology: „gerechtfertigt“ ist für δικαιωθῶ beizubehalten. Die Ergänzung „in Bezug auf“ ist keine lehrmäßige Auslegung, sondern macht die im Deutschen sonst irreführende Zuordnung von δικαιόω und ἀπό idiomatisch nachvollziehbar. Die hochgestellten Ziffern der Edition sind offenbar textkritische Editionsverweise; ohne vorgelegte zugehörige Inhalte sind keine Zielsprachenfußnoten anzulegen.
  issues:
