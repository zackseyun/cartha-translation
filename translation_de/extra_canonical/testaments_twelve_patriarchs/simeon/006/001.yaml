    issue: Die Wendung „von eurer Sünde gerechtfertigt“ ist im Deutschen semantisch missverständlich.
    rationale: Anders als das griechische ἀπό kann deutsches „von“ bei „gerechtfertigt“ leicht die Sünde als Grund oder Mittel der Rechtfertigung verstehen lassen. Dadurch wird die intendierte Abgrenzung bzw. Entlastung des Sprechers in Bezug auf die Sünde der Angeredeten verdunkelt.
