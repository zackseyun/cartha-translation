  text: Behold, I have told you everything, so that I may be justified from your sin.
translation:
  language: de
  text: Siehe, ich habe euch alles gesagt, damit ich in Bezug auf eure Sünde gerechtfertigt werde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδοὺ
  choice: Siehe
  rationale: Bewahrt den feierlichen, aufmerksamkeitslenkenden Charakter der griechischen Partikel in einer würdigen und verständlichen Form.
- source_word: εἴρηκα
  choice: ich habe … gesagt
  rationale: Gibt das griechische Perfekt natürlich wieder und lässt die fortdauernde Geltung des Gesagten erkennen.
- source_word: πάντα
  choice: alles
  rationale: Direkte und im Kontext uneingeschränkte Wiedergabe.
- source_word: δικαιωθῶ
  choice: gerechtfertigt werde
  rationale: Entspricht dem forensisch gefärbten Verb δικαιόω genauer als eine abschwächende Wiedergabe wie „freigesprochen“ oder „entlastet“ und bewahrt die theologische Spannung.
- source_word: ἀπὸ τῆς ἁμαρτίας ὑμῶν
  choice: von eurer Sünde
  rationale: Formale Wiedergabe der Präposition ἀπό mit Genitiv; die ungewöhnliche Beziehung zwischen Sprecher und Sünde der Angeredeten wird nicht interpretierend aufgelöst.
theological_decisions:
- issue: Bedeutung von δικαιωθῶ ἀπὸ τῆς ἁμαρτίας ὑμῶν
  choice: damit ich von eurer Sünde gerechtfertigt werde
  alternative: damit ich hinsichtlich eurer Sünde als gerecht erwiesen werde
  rationale: Die gewählte Form bleibt eng am griechischen Wortlaut und an dessen möglicher forensischer Bedeutung. Eine explizite Deutung als Unschuldserweis würde die genuine Mehrdeutigkeit stärker festlegen.
translation_notes:
  register: Modernes Standarddeutsch mit bewusst feierlichem biblischem Ton. Die etwas ungewöhnliche Wendung „von eurer Sünde gerechtfertigt“ ist wegen der ebenso ungewöhnlichen griechischen Konstruktion beibehalten; sie soll nicht stillschweigend geglättet werden.
