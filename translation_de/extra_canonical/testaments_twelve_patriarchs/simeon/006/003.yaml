  text: Τότε ἀπολεῖται²⁰ τὸ²¹ σπέρμα Χαναάν *καὶ ἐγκατάλειμμα²² οὐκ ἔσται ἐν²³ τῷ ᾿Αμαλήκ, Γκαὶ ἀπολοῦνται πάντες οἱ Καππαδόκαι²⁴ *καὶ πάντες οἱ Χετταῖοι ἐξολοθρευθήσονται²⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/003.yaml
  text: Then the seed of Canaan will perish, and no remnant will remain in Amalek; all the Cappadocians will perish, and all the Hittites will be utterly destroyed.
translation:
  language: de
  text: Dann wird die Nachkommenschaft Kanaans zugrunde gehen, und in Amalek wird kein Überrest bleiben. Alle Kappadokier werden zugrunde gehen, und alle Hetiter werden vollständig vernichtet werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπέρμα Χαναάν
  choice: die Nachkommenschaft Kanaans
  rationale: σπέρμα bezeichnet hier im Zusammenhang mit einem Volk dessen Nachkommenschaft; diese Wiedergabe ist im modernen Deutschen natürlicher und eindeutiger als das wörtliche „Same Kanaans“.
- source_word: ἐγκατάλειμμα
  choice: Überrest
  rationale: „Überrest“ gibt die Vorstellung eines nach dem Gericht verbliebenen Restes prägnant und in angemessen würdigem Register wieder.
- source_word: ἐν τῷ Ἀμαλήκ
  choice: in Amalek
  rationale: Die räumlich beziehungsweise kollektiv deutbare Präposition ἐν wird eng am Griechischen wiedergegeben, ohne Amalek ausdrücklich nur als Land oder nur als Volk festzulegen.
- source_word: ἐξολοθρευθήσονται
  choice: werden vollständig vernichtet werden
  rationale: Die verstärkte Vernichtungsbedeutung des Verbs wird bewahrt und gegenüber dem vorherigen ἀπολοῦνται sprachlich hervorgehoben.
theological_decisions:
- issue: Reichweite der angekündigten Vernichtung
  choice: Die umfassenden Formulierungen des griechischen Textes werden unverändert wiedergegeben.
  alternative: Die Aussagen durch Formulierungen wie „weitgehend“ oder „als politische Macht“ abzuschwächen.
  rationale: Der Ausgangstext spricht von keinem verbleibenden Überrest, vom Zugrundegehen aller Kappadokier und von der vollständigen Vernichtung aller Hetiter; eine Abschwächung wäre interpretierend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „zugrunde gehen“ bildet die Wiederholung von ἀπόλλυμι ab; „vollständig vernichtet“ wahrt die Steigerung im letzten Satzglied.
