    issue: „für Israel“ gibt τῷ Ἰσραήλ zu einseitig als Vorteilsempfänger wieder.
    rationale: Beim Passiv von ἐνδοξάζω bezeichnet der Dativ in diesem Zusammenhang natürlicher den Bereich bzw. die Gemeinschaft, in der etwas verherrlicht wird. „in Israel“ bewahrt dies ohne zusätzliche Deutung.
