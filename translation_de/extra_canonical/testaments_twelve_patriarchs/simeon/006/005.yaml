  verdict: revise
  source_fidelity: Das griechische Futurpassiv ἐνδοξασθήσεται wird mit „wird verherrlicht werden“ zutreffend wiedergegeben. Der Dativ τῷ Ἰσραήλ ist hier jedoch am naheliegendsten lokal bzw. gemeinschaftsbezogen („in/unter Israel“), nicht primär dativisch-begünstigend („für Israel“). Die englische Auditfassung „for Israel“ ist möglich, sollte gegenüber der griechischen Konstruktion aber nicht maßgeblich sein.
  naturalness: Die Passivform ist zwar gehoben, in diesem prophetisch-feierlichen Kontext jedoch verständlich und angemessen. Die Stellung von „in Israel“ vor dem Subjekt ist im Deutschen klarer als „ein großes Zeichen für Israel“ und vermeidet, dass das Zeichen selbst wie ein für Israel bestimmtes Zeichen verstanden wird.
  terminology: „Zeichen“ und „verherrlicht werden“ sind sachgerecht. Es werden keine theologischen Aussagen über die knappe, im überlieferten Text zudem durch kritische Zeichen markierte Formulierung hinaus eingeführt.
  issues:
