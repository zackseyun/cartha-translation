  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/005.yaml
  text: Then a great sign will be glorified for Israel.
translation:
  language: de
  text: Dann wird in Israel ein großes Zeichen verherrlicht werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τότε
  choice: Dann
  rationale: Gibt die zeitliche Fortführung schlicht und unmittelbar wieder.
- source_word: σημεῖον … μέγα
  choice: ein großes Zeichen
  rationale: Das nachgestellte μέγα stimmt mit σημεῖον überein; die im Griechischen getrennten Wörter werden in natürlicher deutscher Wortstellung verbunden.
- source_word: ἐνδοξασθήσεται
  choice: wird … verherrlicht werden
  rationale: Bewahrt die Futur-Passiv-Form und vermeidet die deutende Umformung zu „wird herrlich erscheinen“.
- source_word: τῷ Ἰσραήλ
  choice: für Israel
  rationale: Gibt den Dativ als Bezug beziehungsweise Vorteil wieder, ohne genauer festzulegen, in welchem Sinn das Zeichen Israel gilt.
theological_decisions:
- issue: Bedeutung des passiven Verbs bei dem Zeichen
  choice: „wird … verherrlicht werden“
  alternative: „wird herrlich erscheinen“
  rationale: Die formal ungewöhnliche Aussage des griechischen Textes wird nicht stillschweigend als Erscheinungsgeschehen gedeutet; so bleibt die mögliche theologische Spannung erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe und im Deutschen ungewöhnliche Passivkonstruktion bleibt bewusst nahe am überlieferten griechischen Wortlaut.
