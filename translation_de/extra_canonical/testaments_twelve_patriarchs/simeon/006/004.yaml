base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/004.yaml
  text: Then the land of Ham will perish, and every people will perish. Then all the earth will cease from turmoil, and all that is under heaven from war.
translation:
  language: de
  text: Dann wird das Land Hams untergehen, und das ganze Volk wird zugrunde gehen. Dann wird die ganze Erde von Unruhe zur Ruhe kommen und alles unter dem Himmel vom Krieg.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκλείψει
  choice: wird untergehen
  rationale: Das Verb bezeichnet hier im Zusammenhang des Gerichts das Aufhören beziehungsweise den Untergang des Landes; „untergehen“ gibt dies im Deutschen natürlich wieder, ohne es mit ἀπολεῖται gleichzusetzen.
- source_word: ἀπολεῖται
  choice: wird zugrunde gehen
  rationale: Die futurische Form von ἀπόλλυμι bezeichnet Vernichtung oder Verderben; „zugrunde gehen“ bewahrt die Stärke des Ausdrucks.
- source_word: καταπαύσει … ἀπὸ ταραχῆς
  choice: wird … von Unruhen zur Ruhe kommen
  rationale: Die Konstruktion beschreibt das Aufhören eines Zustands. Diese Wiedergabe erhält sowohl das Motiv der Ruhe als auch die Trennung von den Unruhen.
- source_word: πᾶσα ἡ ὑπ᾿ οὐρανῶν
  choice: alles unter dem Himmel
  rationale: Die substantivierte Wendung ist umfassend und elliptisch; das Deutsche bewahrt diese Offenheit, statt eigenmächtig „Land“, „Menschheit“ oder „Schöpfung“ zu ergänzen.
theological_decisions:
- issue: Umfang von πᾶς ὁ λαός
  choice: jedes Volk
  alternative: das ganze Volk
  rationale: Ohne Artikel bei πᾶς kann die Wendung distributiv verstanden werden. „Jedes Volk“ folgt der vorliegenden griechischen Form und bewahrt den universalen Gerichtston, obwohl „das ganze Volk“ grammatisch als alternative Deutung denkbar bleibt.
- issue: Bezug des endzeitlichen Friedens
  choice: alles unter dem Himmel vom Krieg
  alternative: die ganze Welt wird keinen Krieg mehr führen
  rationale: Die elliptische Parallelstruktur des Griechischen wird beibehalten und nicht als weitergehende dogmatische Aussage ausformuliert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur des Griechischen bleibt erkennbar; zugleich werden unnötige Wiederholungen vermieden. „Land Hams“ wird als traditionelle geografisch-genealogische Bezeichnung unverändert wiedergegeben.
