review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von ἐκλείψει mit „untergehen“ und von ἀπολεῖται mit „zugrunde gehen“ ist im Gerichtskontext tragfähig. Allerdings ist πᾶς ὁ λαός aufgrund der artikulierten Form am naheliegendsten kollektiv als „das ganze Volk“ zu verstehen, nicht distributiv als „jedes Volk“. Die zweite Satzhälfte bewahrt die griechische Ellipse angemessen.
  naturalness: Der Entwurf ist überwiegend modernes Standarddeutsch. „von Unruhen zur Ruhe kommen“ ist verständlich, doch der Singular „Unruhe“ entspricht ταραχή genauer und wirkt in der parallelen Formulierung glatter.
  terminology: „Land Hams“ bewahrt die traditionelle genealogisch-geographische Bezeichnung. Es sind keine konfessionell geprägten theologischen Begriffe betroffen.
  issues:
  - severity: medium
    issue: πᾶς ὁ λαός ist als „jedes Volk“ übersetzt.
    rationale: Mit Artikel bezeichnet πᾶς ὁ λαός regulär die Gesamtheit eines bestimmten Volkes („das ganze Volk“). Die distributive Wiedergabe „jedes Volk“ ist zwar im englischen Audit Trail enthalten, wird aber von der griechischen Artikulation nicht am besten gestützt.
  - severity: low
    issue: ταραχή ist im Deutschen als Plural „Unruhen“ wiedergegeben.
    rationale: Der griechische Singular bezeichnet hier allgemein Unruhe bzw. Aufruhr. Der Singular erhält die Form des Ausgangstextes und verbessert die Parallelität zu „Krieg“.
  revised_text: Dann wird das Land Hams untergehen, und das ganze Volk wird zugrunde gehen. Dann wird die ganze Erde von Unruhe zur Ruhe kommen und alles unter dem Himmel vom Krieg.
