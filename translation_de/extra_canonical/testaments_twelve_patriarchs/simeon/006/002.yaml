source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἐὰν δὲ⁴ ἀφέλητε⁵ ἀφ᾽ ὑμῶν τὸν φθόνον καὶ πᾶσαν σκληροκαρδίαν⁶, Ὡς⁷ ῥόδον ἀνθήσει⁸ τὰ ὀστᾶ μου⁹ ἐν Ἰσραήλ, καὶ¹⁰ ὡς κρίνον *ἡ σάρξ μου¹⁰ ἐν Ἰακώβ, καὶ ἔσται¹¹ *ἡ ὀσμή μου ὡς¹² ὀσμὴ Λιβάνου,¹³ καὶ πληθυνθήσονται¹⁴ ἅγιοι¹⁵ *ἐξ ἐμοῦ¹⁶ *ἕως αἰῶνας¹⁷ αἰώνων¹⁷ καὶ *οἱ κλάδοι¹⁸ αὐτῶν¹⁹ εἰς μακρὰν ἔσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/002.yaml
  text: But if you remove from yourselves envy and every hardness of heart, my bones will blossom like a rose in Israel, and my flesh like a lily in Jacob; and my fragrance will be like the fragrance of Lebanon. Holy ones will be multiplied from me forever and ever, and their branches will extend far away.
translation:
  language: de
  text: Wenn ihr aber den Neid und jede Herzenshärte von euch entfernt, werden meine Gebeine wie eine Rose in Israel aufblühen und mein Fleisch wie eine Lilie in Jakob. Mein Duft wird wie der Duft des Libanon sein. Aus mir werden Heilige bis in alle Ewigkeit zahlreich hervorgehen, und ihre Zweige werden weit hinausreichen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φθόνον
  choice: Neid
  rationale: Die geläufige und kontextgemäße Wiedergabe des griechischen Begriffs.
- source_word: πᾶσαν σκληροκαρδίαν
  choice: jede Herzenshärte
  rationale: Bewahrt das Körperbild des Griechischen und klingt zugleich in modernem Deutsch verständlich und würdig.
- source_word: τὰ ὀστᾶ μου
  choice: meine Gebeine
  rationale: Das gehobene Wort passt zum testamentarisch-poetischen Register und bezeichnet Knochen beziehungsweise sterbliche Überreste, ohne die Bildsprache zu glätten.
- source_word: ῥόδον
  choice: Rose
  rationale: Direkte Wiedergabe; die mögliche weitere botanische Spannweite des antiken Wortes rechtfertigt hier keine Spezifizierung.
- source_word: ἅγιοι
  choice: Heilige
  rationale: Gibt das substantivierte Adjektiv formal wieder, ohne näher zu bestimmen, ob besonders geweihte oder allgemein zu Gott gehörende Menschen gemeint sind.
- source_word: εἰς μακράν
  choice: weit hinausreichen
  rationale: Natürliche deutsche Wiedergabe der räumlichen Ausdehnung im Zweigbild.
theological_decisions:
- issue: Identität der »Heiligen«
  choice: Unbestimmt als »Heilige« wiedergegeben
  alternative: »heilige Menschen« oder »Nachkommen, die heilig sind«
  rationale: Der griechische Text benennt ἅγιοι ohne nähere Bestimmung; eine genealogische oder konfessionelle Deutung wäre eine unnötige Festlegung.
- issue: Bedeutung von »aus mir«
  choice: Die Herkunftsangabe »aus mir« bleibt wörtlich erhalten
  alternative: »von mir abstammen«
  rationale: Die Formulierung kann leibliche Nachkommenschaft, eine weiter gefasste Herkunft oder eine symbolische Wirkung bezeichnen; die Übersetzung bewahrt diese Spannung.
- issue: Zeitformel εἰς αἰῶνας αἰώνων
  choice: »von Ewigkeit zu Ewigkeit«
  alternative: »für immer und ewig«
  rationale: Die gewählte traditionelle Formel bewahrt den gesteigerten, feierlichen Charakter, ohne eine besondere eschatologische Systematik einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter poetischer Parallelstruktur. Die Bilder von Gebeinen, Fleisch, Duft und Zweigen werden nicht erklärend aufgelöst; die Satzfolge wurde zur besseren deutschen Lesbarkeit behutsam gegliedert.
