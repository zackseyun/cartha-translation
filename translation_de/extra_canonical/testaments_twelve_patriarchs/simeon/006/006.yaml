source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Τότε δοθήσεται⁴⁸ πάντα τὰ πνεύματα τῆς πλάνης⁴⁹ εἰς καταπάτησιν⁵⁰ καὶ οἱ⁵¹ ἄνθρωποι⁵² βασιλεύσουσιν⁵³ τῶν⁵⁴ πονηρῶν πνευμάτων⁵⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/006.yaml
  text: Then all the spirits of deceit will be given over to trampling, and men will rule over the evil spirits.
translation:
  language: de
  text: Dann werden alle Geister der Täuschung zum Zertreten preisgegeben, und die Menschen werden über die bösen Geister herrschen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ πνεύματα τῆς πλάνης
  choice: die Geister der Verführung
  rationale: 'Der Genitiv bleibt bewusst offen: Gemeint sind Geister, die verführen beziehungsweise durch Verführung gekennzeichnet sind. „Verführung“ gibt πλάνη in diesem Zusammenhang natürlicher wieder als „Irrtum“.'
- source_word: εἰς καταπάτησιν
  choice: der Zertretung preisgegeben
  rationale: Die Wendung bewahrt das Bild des Niedertretens und gibt die Ziel- beziehungsweise Ergebnisaussage mit idiomatischem Deutsch wieder.
- source_word: βασιλεύσουσιν
  choice: werden … herrschen
  rationale: „Herrschen“ entspricht dem königlichen Herrschaftsverb, ohne im Deutschen unnatürlich „Könige sein“ zu formulieren.
- source_word: τῶν πονηρῶν πνευμάτων
  choice: über die bösen Geister
  rationale: Der von βασιλεύω abhängige Genitiv bezeichnet den Herrschaftsbereich; „über“ ist dafür die natürliche deutsche Konstruktion.
theological_decisions:
- issue: Wer die bösen Geister beherrschen wird
  choice: die Menschen
  alternative: Menschen / die Menschheit
  rationale: Der bestimmte griechische Plural οἱ ἄνθρωποι wird direkt wiedergegeben, ohne die Aussage auf eine besondere Gruppe einzuschränken.
- issue: Art der Unterwerfung der Geister
  choice: der Zertretung preisgegeben
  alternative: zum Zertreten hingegeben
  rationale: Die substantivische Form des Griechischen wird gewahrt; zugleich wird nicht festgelegt, wer das Zertreten ausführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelität der beiden Zukunftsaussagen bleibt erhalten; „Zertretung“ bewahrt die kräftige Bildsprache des griechischen Textes.
