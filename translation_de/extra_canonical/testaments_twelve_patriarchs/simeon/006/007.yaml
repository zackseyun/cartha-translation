source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Τότε ἀναστησόμαι⁵⁶ κἀγὼ⁵⁷ ἐν⁵⁸ εὐφροσύνῃ καὶ εὐλογήσω⁵⁹ τὸν ὕψιστον ἐπὶ⁶⁰ τοῖς θαυμασίοις αὐτοῦ [ὅτι ὁ⁶¹ Θεὸς σῶμα λαβών, καὶ⁶² συνεσθίων ἀνθρώποις *ἔσωσεν ἀνθρώπους⁶³].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006/007.yaml
  text: Then I also will arise in gladness, and I will bless the Most High for his wonders [because God, having taken a body and eaten with men, saved men].
translation:
  language: de
  text: Dann werde auch ich voller Freude auferstehen[a] und den Höchsten für seine Wundertaten preisen [denn Gott nahm einen Leib an, aß mit Menschen und rettete Menschen].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Dann werde auch ich mich voller Freude erheben.“'
    reason: ἀναστησόμαι kann allgemein „aufstehen/sich erheben“ oder im eschatologischen Zusammenhang „auferstehen“ bedeuten.
  - marker: b
    text: Die in eckigen Klammern stehenden Worte sind textkritisch unsicher und werden in der zugrunde gelegten griechischen Ausgabe entsprechend gekennzeichnet.
    reason: Die editorischen Klammern der Quelle sollen für Leserinnen und Leser erklärt werden.
lexical_decisions:
- source_word: ἀναστησόμαι
  choice: werde … auferstehen
  rationale: Gibt das Futur und den im Kontext naheliegenden Auferstehungssinn wieder, ohne ihn abzuschwächen.
- source_word: ἐν εὐφροσύνῃ
  choice: voller Freude
  rationale: Natürliches modernes Deutsch für die modale Wendung; bewahrt den feierlichen Ton.
- source_word: εὐλογήσω
  choice: preisen
  rationale: Im Gotteslob idiomatischer als das wörtliche „segnen“ und sachlich passend.
- source_word: τὸν ὕψιστον
  choice: den Höchsten
  rationale: Bewahrt den substantivierten Gottesnamen des griechischen Textes.
- source_word: τοῖς θαυμασίοις αὐτοῦ
  choice: seine Wundertaten
  rationale: Bezeichnet hier Gottes wunderbare Taten natürlicher und genauer als das abstraktere „Wunder“.
- source_word: σῶμα λαβών
  choice: nahm einen Leib an
  rationale: Gibt das Partizip idiomatisch wieder und bewahrt die Aussage der Leibannahme.
- source_word: συνεσθίων ἀνθρώποις
  choice: aß mit den Menschen
  rationale: Klare, unmittelbare Wiedergabe des gemeinsamen Essens mit Menschen.
- source_word: ἔσωσεν ἀνθρώπους
  choice: rettete die Menschen
  rationale: Bewahrt das Aoristtempus und die Wiederholung von ἀνθρώποις/ἀνθρώπους.
theological_decisions:
- issue: Auferstehungsbezug von ἀναστησόμαι
  choice: auferstehen
  alternative: aufstehen / mich erheben
  rationale: Das Futur kann sprachlich „aufstehen“ bedeuten; im testamentarisch-eschatologischen Zusammenhang ist „auferstehen“ jedoch naheliegend. Die Alternative wird in einer Fußnote genannt.
- issue: Textstatus der christologisch formulierten Schlussklausel
  choice: im Haupttext in eckigen Klammern beibehalten
  alternative: aus dem Haupttext auslassen oder nur als Fußnote bieten
  rationale: Die vorgelegte griechische Edition kennzeichnet die Klausel mit eckigen Klammern. Diese Unsicherheit wird sichtbar bewahrt, ohne die überlieferte Aussage zu verwerfen.
- issue: Verhältnis der Partizipien zum Hauptverb
  choice: 'als aufeinander bezogene Handlungen wiedergegeben: nahm … an, aß … und rettete'
  alternative: „nachdem Gott einen Leib angenommen und mit den Menschen gegessen hatte, rettete er …“
  rationale: Die koordinierte deutsche Form ist natürlicher und legt die genaue zeitliche oder kausale Beziehung der griechischen Partizipien nicht stärker fest als nötig.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Der Satz bleibt nahe an der griechischen Struktur, wird aber bei Partizipien und idiomatischen Wendungen natürlich formuliert. Die textkritischen eckigen Klammern bleiben erhalten; alle Fußnotenmarker stehen im Haupttext.
