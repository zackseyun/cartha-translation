  source_fidelity: Der Imperativ und die Begründung werden zutreffend wiedergegeben. Die Metapher „Mutter allen Übels“ gibt μήτηρ τῶν κακῶν idiomatisch wieder. Die bisherige Formulierung „bringt dem Beliar nahe“ bildet προσεγγίζουσα τῷ Βελίαρ jedoch nicht idiomatisch und kann im Deutschen fälschlich nahelegen, Beliar werde jemandem erklärt oder vertraut gemacht. Die revidierte Fassung gibt die Bewegungsrichtung zu Beliar hin wieder, ohne ein ausdrücklich benanntes Objekt zu ergänzen.
  naturalness: Die Revision ist modernes, würdiges Standarddeutsch. „von Gott weg und zu Beliar hin führen“ ist als elliptische Aussage über die Wirkung der sexuellen Unmoral klar und natürlich.
