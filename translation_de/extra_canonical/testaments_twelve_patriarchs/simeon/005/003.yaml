base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/003.yaml
  text: Guard yourselves, then, from sexual immorality, because sexual immorality is the mother of evils, separating from God and drawing near to Beliar.
translation:
  language: de
  text: 'Hütet euch also vor sexueller Unmoral; denn sexuelle Unmoral ist die Mutter allen Übels: Sie führt von Gott weg und zu Beliar hin.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: Hütet euch
  rationale: Der mediale Imperativ fordert zu wachsamer Selbstbewahrung auf; die geläufige deutsche Wendung bewahrt sowohl Warnung als auch Eigenverantwortung.
- source_word: πορνεία
  choice: sexuelle Unmoral
  rationale: Der Ausdruck bezeichnet hier allgemein unerlaubtes sexuelles Verhalten. Diese Wiedergabe ist im modernen Deutsch verständlich und enger am Bedeutungsumfang als das heute oft enger verstandene „Unzucht“.
- source_word: μήτηρ τῶν κακῶν
  choice: die Mutter allen Übels
  rationale: Die bildhafte Ursprungsmetapher bleibt erhalten; der deutsche Singular ist eine natürliche idiomatische Entsprechung des griechischen Plurals „der Übel“.
- source_word: χωρίζουσα ἀπὸ τοῦ θεοῦ
  choice: Sie trennt von Gott
  rationale: Das substantivisch bezogene Partizip wird zur klaren deutschen Aussage entfaltet, ohne ein im Griechischen nicht ausdrücklich genanntes Objekt wie „den Menschen“ einzufügen.
- source_word: προσεγγίζουσα τῷ Βελίαρ
  choice: bringt dem Beliar nahe
  rationale: Die kausative Wirkung des Partizips wird natürlich wiedergegeben. Die knappe Form wahrt die im Griechischen fehlende ausdrückliche Objektangabe.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Die griechische Namensform wird in ihrer üblichen deutschen Gestalt als Eigenname beibehalten.
theological_decisions:
- issue: Reichweite von πορνεία
  choice: sexuelle Unmoral
  alternative: Unzucht / Hurerei
  rationale: Die Übersetzung vermeidet eine unnötige Verengung auf Prostitution oder außerehelichen Geschlechtsverkehr und importiert keine konfessionell bestimmte Definition einzelner Sexualnormen.
- issue: Unausgesprochenes Objekt der Partizipien
  choice: Kein Objekt ergänzt
  alternative: „Sie trennt den Menschen von Gott und führt ihn zu Beliar“
  rationale: Der griechische Text lässt offen, wer genau getrennt beziehungsweise nahegebracht wird. Die deutsche Form bewahrt diese Knappheit und vermeidet eine interpretierende Ergänzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter paränetischer Anrede. Der Doppelpunkt macht die beiden folgenden Wirkungen als Erläuterung der Metapher kenntlich. Keine Fußnoten erforderlich.
