source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἀλλ' οὐ δυνήσονται πρὸς Λευὶ ἀντιστῆναι³², ὅτι *πόλεμον Κυρίου πολεμήσει³³ καὶ νικήσει ⌜πᾶσαν⌝³⁴ παρεμβολὴν³⁵ ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/005.yaml
  text: But they will not be able to stand against Levi, because he will wage the Lord’s war and will defeat your whole camp.
translation:
  language: de
  text: Aber sie werden Levi nicht standhalten können; denn er wird den Krieg des Herrn führen und euer ganzes Heerlager besiegen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντιστῆναι
  choice: standhalten
  rationale: Gibt den Widerstand gegen Levi natürlich und präzise wieder, ohne eine zusätzliche Bedeutung wie bloßes Gegenübertreten einzutragen.
- source_word: πόλεμον Κυρίου πολεμήσει
  choice: den Krieg des Herrn führen
  rationale: Bewahrt die emphatische griechische Verbindung von »Krieg« und »Krieg führen« in idiomatischem modernem Deutsch.
- source_word: παρεμβολήν
  choice: Heerlager
  rationale: Bezeichnet im militärischen Zusammenhang ein Lager beziehungsweise die dort versammelte Streitmacht; »Heerlager« hält beide Vorstellungen enger zusammen als nur »Heer« oder »Lager«.
- source_word: πᾶσαν
  choice: ganzes
  rationale: Das textkritisch markierte Wort wird übersetzt und auf das gesamte Heerlager bezogen.
theological_decisions:
- issue: Genitiv in πόλεμον Κυρίου
  choice: Krieg des Herrn
  alternative: Krieg für den Herrn
  rationale: Der griechische Genitiv bleibt bewusst unaufgelöst; die Übersetzung legt nicht fest, ob Herkunft, Zugehörigkeit oder Auftrag im Vordergrund steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am Griechischen, während »Krieg führen« und »standhalten« natürliches Deutsch bieten. »Heerlager« erhält die militärische Bildwelt und vermeidet die altertümliche Mehrdeutigkeit von »Heerschar«.
