  rationale: Die Revision klärt allein die stammesbezogene Referenz von Levi und Juda und stellt den prophetischen Charakter des Verbs genauer wieder. Sie wahrt die Zukunftsaussage, die plurale Bezugnahme auf die Segenssprüche und die absichtlich offene Bedeutung von ἡγεμονία.
