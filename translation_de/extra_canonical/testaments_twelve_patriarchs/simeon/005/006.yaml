    issue: Die Verteilung auf Levi und Juda ist nicht ausdrücklich als Verteilung auf die beiden Stämme kenntlich.
    rationale: ἐν τῷ Λευὶ καὶ ἐν τῷ Ἰούδᾳ bezieht sich in diesem genealogisch-stammesgeschichtlichen Kontext auf Levi und Juda als Stämme. Die Ergänzung „Stämme“ macht die im Griechischen kontextuell eindeutige Referenz im Deutschen klar.
  - severity: low
    issue: „vorausgesagt hat“ schwächt den prophetischen Wortlaut leicht ab.
    rationale: προεφήτευσεν ist ausdrücklich prophetisches Vorausverkünden. „Prophezeit hat“ ist im modernen Deutsch natürlich und näher am griechischen Verb.
  revised_text: Und sie werden nur wenige sein und auf die Stämme Levi und Juda verteilt sein; keiner von euch wird eine führende Stellung einnehmen, wie auch unser Vater in den Segenssprüchen prophezeit hat.
