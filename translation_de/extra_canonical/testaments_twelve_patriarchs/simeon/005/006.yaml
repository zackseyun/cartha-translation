id: T12P.SIM.5.6
reference: Testament of Simeon 5:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ ἔσονται ὀλιγοστοί³⁶ ἐπιμεριζόμενοι³⁷ *ἐν τῷ³⁸ Λευὶ καὶ *ἐν τῷ³⁹ Ἰούδᾳ⁴⁰ καὶ οὐκ⁴¹ ἔσται ἐξ ὑμῶν *τις εἰς ἡγεμονίαν⁴² καθὼς καὶ ὁ πατὴρ ἡμῶν⁴³ προεφήτευσεν⁴⁴ *ἐν ταῖς⁴⁵ εὐλογίαις⁴⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/006.yaml
  text: And they will be few in number, being divided among Levi and among Judah, and none from among you will be for leadership, just as our father also prophesied in the blessings.
translation:
  language: de
  text: Und sie werden nur wenige sein und auf die Stämme Levi und Juda verteilt sein; keiner von euch wird eine führende Stellung einnehmen, wie auch unser Vater in den Segenssprüchen prophezeit hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀλιγοστοί
  choice: nur wenige
  rationale: Gibt die geringe Anzahl idiomatisch und prägnant wieder.
- source_word: ἐπιμεριζόμενοι ἐν τῷ Λευὶ καὶ ἐν τῷ Ἰούδᾳ
  choice: verteilt auf Levi und Juda
  rationale: Bewahrt den Verteilungssinn des Partizips und formuliert die Zugehörigkeit zu den beiden Stämmen natürlich auf Deutsch.
- source_word: εἰς ἡγεμονίαν
  choice: eine Führungsstellung einnehmen
  rationale: Gibt den offenen Sinn von Leitung, Vorrang oder Herrschaft wieder, ohne ihn unnötig auf ein bestimmtes politisches oder religiöses Amt festzulegen.
- source_word: ἐν ταῖς εὐλογίαις
  choice: in den Segenssprüchen
  rationale: Der Plural bezeichnet die ausgesprochenen Segnungen; „Segenssprüche“ ist im Deutschen klarer als das abstraktere „Segnungen“.
- source_word: προεφήτευσεν
  choice: vorausgesagt hat
  rationale: Bringt den prophetischen Charakter der früheren Aussage in verständlichem modernem Deutsch zum Ausdruck.
theological_decisions:
- issue: Reichweite von ἡγεμονία
  choice: Führungsstellung
  alternative: Herrschaft
  rationale: Der griechische Ausdruck kann Leitung, Vorrang oder Herrschaft bezeichnen. „Führungsstellung“ wahrt diese Breite und vermeidet die unbelegte Festlegung auf Königtum oder ein bestimmtes Amt.
- issue: Bezug der Segenssprüche
  choice: Keine ausdrückliche Identifizierung im Haupttext
  alternative: Zusatz „Jakobs“ oder ausdrücklicher Verweis auf Genesis 49
  rationale: Der Text nennt lediglich „unseren Vater“ und „die Segenssprüche“. Die wahrscheinlich gemeinte Überlieferung wird nicht interpretierend in den Wortlaut eingefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Semikolon gliedert die eng verbundenen Zukunftsaussagen klar; die Formulierung bleibt nah am griechischen Satzbau, ohne unnatürlich zu wirken.
