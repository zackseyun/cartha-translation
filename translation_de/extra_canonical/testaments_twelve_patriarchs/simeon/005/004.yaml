- from: Denn ich habe in der Schrift Henochs gesehen, dass eure Söhne durch Unzucht zugrunde gehen und den Söhnen Levis mit dem Schwert Unrecht tun werden.
  to: Denn ich habe in der Schrift Henochs gesehen, dass eure Söhne in Unzucht zugrunde gehen und den Söhnen Levis mit dem Schwert Unrecht tun werden.
  rationale: Die einzige Änderung ersetzt die kausal deutende Präposition „durch“ durch „in“, um ἐν πορνείᾳ enger zu entsprechen und die semantische Offenheit des griechischen Passivs φθαρήσονται zu bewahren. Weitere Änderungen sind nicht erforderlich.
