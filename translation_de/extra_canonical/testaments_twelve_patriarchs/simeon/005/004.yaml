source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἑώρακα γὰρ ἐγὼ²⁵ ἐν χαρακτῆρι γραφῆς²⁶ Ἐνώχ, ὅτι οἱ²⁷ υἱοὶ ὑμῶν²⁸ *ἐν πορνείᾳ²⁹ φθαρήσονται, καὶ *τοῖς υἱοῖς Λευὶ³⁰ *ἀδικήσουσιν ἐν ῥομφαίᾳ³¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/004.yaml
  text: For I have seen in the writing of Enoch that your sons will be corrupted in sexual immorality, and they will wrong the sons of Levi with the sword.
translation:
  language: de
  text: Denn ich habe in der Schrift Henochs gesehen, dass eure Söhne in Unzucht zugrunde gehen und den Söhnen Levis mit dem Schwert Unrecht tun werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν χαρακτῆρι γραφῆς Ἐνώχ
  choice: in der Schrift Henochs
  rationale: Die Wendung bezeichnet hier das schriftlich festgehaltene Zeugnis Henochs; eine wörtliche Wiedergabe von χαρακτήρ wäre im Deutschen unklar und schwerfällig.
- source_word: ἐν πορνείᾳ φθαρήσονται
  choice: durch Unzucht zugrunde gehen
  rationale: φθείρω im Passiv kann Verderben oder Untergang bezeichnen. „Zugrunde gehen“ bewahrt die starke Aussage; „durch Unzucht“ gibt ἐν πορνείᾳ im Deutschen idiomatisch als den Zusammenhang beziehungsweise die Ursache des Verderbens wieder.
- source_word: ἀδικήσουσιν
  choice: Unrecht tun werden
  rationale: Die allgemeine Bedeutung „Unrecht tun/schädigen“ wird bewahrt, ohne die genaue Art des mit dem Schwert begangenen Unrechts enger festzulegen.
- source_word: ἐν ῥομφαίᾳ
  choice: mit dem Schwert
  rationale: Instrumentale Wiedergabe der Präposition ἐν; ῥομφαία bezeichnet hier eine große Klinge beziehungsweise ein Schwert.
theological_decisions:
- issue: Reichweite der Verderbensaussage
  choice: „zugrunde gehen“ ohne ausdrückliche moralische oder eschatologische Präzisierung
  alternative: „verdorben werden“ oder „sich verderben“
  rationale: Der griechische Passivsatz lässt offen, ob moralisches Verderben, Vernichtung oder beides im Blick ist. Die Übersetzung behält diese Spannung möglichst weitgehend bei.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Unzucht“ ist knapp und für πορνεία traditionsnah, ohne eine spezifischere sexuelle Verfehlung zu unterstellen. Keine Fußnoten erforderlich.
