review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung trifft die Satzstruktur und die zentralen Begriffe im Wesentlichen: Ἑώρακα ist angemessen mit „habe ... gesehen“ wiedergegeben, ἀδικήσουσιν mit „Unrecht tun“, und „mit dem Schwert“ bildet ἐν ῥομφαίᾳ sachgerecht ab. „Durch Unzucht“ legt jedoch eine eindeutige Kausalbeziehung fest, während ἐν πορνείᾳ wie im englischen Audit Trail den Bereich bzw. Zustand bezeichnet und die genaue Relation zum Verderben offenlässt.'
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch und gut verständlich. „In Unzucht zugrunde gehen“ ist etwas gehobener, aber in diesem prophetisch-testamentarischen Register natürlich genug und genauer als die kausale Formulierung.
  terminology: „Schrift Henochs“, „Unzucht“, „Söhne Levis“ und „Schwert“ sind terminologisch passend. „Unzucht“ wahrt die gegenüber πορνεία erforderliche Allgemeinheit und vermeidet eine unnötig spezifische Deutung.
  issues:
  - severity: medium
    issue: „durch Unzucht“ statt „in Unzucht“
    rationale: Die Präposition ἐν sollte nicht ohne Not kausal zugespitzt werden. Die Formulierung „in Unzucht“ bewahrt die im Griechischen mögliche Mehrdeutigkeit zwischen sündhaftem Bereich/Zustand und dem damit verbundenen Verderben.
  revised_text: Denn ich habe in der Schrift Henochs gesehen, dass eure Söhne in Unzucht zugrunde gehen und den Söhnen Levis mit dem Schwert Unrecht tun werden.
  revised_footnotes: []
