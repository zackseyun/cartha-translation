source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Διὰ τοῦτο Ἰωσὴφ ἦν¹ ὡραῖος *τῷ εἴδει², καὶ καλὸς *τῇ ὄψει, ὅτι³ οὐκ ἐνοίκησεν⁴ *ἐν αὐτῷ⁵ οὐδὲν⁶ πονηρόν· ἐκ γὰρ⁷ τῆς ταραχῆς τοῦ πνεύματος τὸ πρόσωπον δηλοῖ⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/001.yaml
  text: Therefore Joseph was handsome in form and beautiful in appearance, because nothing evil dwelt in him; for the face reveals the turmoil of the spirit.
translation:
  language: de
  text: Darum war Josef von schöner Gestalt und schön anzusehen, weil nichts Böses in ihm wohnte; denn das Gesicht lässt die Unruhe des Geistes erkennen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡραῖος τῷ εἴδει
  choice: von schöner Gestalt
  rationale: Gibt die körperliche Schönheit und die Hinsicht τῷ εἴδει idiomatisch und würdevoll wieder.
- source_word: καλὸς τῇ ὄψει
  choice: schön anzusehen
  rationale: Bewahrt die parallele Aussage über Josefs sichtbare Erscheinung, ohne im Deutschen schwerfällig zu klingen.
- source_word: ἐνοίκησεν ἐν αὐτῷ
  choice: in ihm wohnte
  rationale: Erhält das konkrete Bild des griechischen Verbs ἐνοικέω.
- source_word: ταραχῆς τοῦ πνεύματος
  choice: Unruhe des Geistes
  rationale: ταραχή bezeichnet innere Unruhe oder Aufgewühltheit; „Geist“ wahrt die Offenheit von πνεῦμα.
- source_word: τὸ πρόσωπον δηλοῖ
  choice: das Gesicht lässt … erkennen
  rationale: Natürliches Deutsch für das Anzeigen oder Offenbaren durch den Gesichtsausdruck; der im Griechischen knappe Zusammenhang mit der Unruhe wird beibehalten.
theological_decisions:
- issue: Zusammenhang zwischen innerem Bösen und äußerer Erscheinung
  choice: Die kausale Behauptung des Textes wird unverändert wiedergegeben.
  alternative: Die Aussage als bloße Möglichkeit oder allgemeine Beobachtung abschwächen.
  rationale: Das griechische ὅτι formuliert ausdrücklich einen Grund; eine Abschwächung würde die anthropologische Spannung des Textes auflösen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch in würdigem Ton. Der Parallelismus von Gestalt und Erscheinung sowie das Wohnbild für das Böse bleiben erhalten.
