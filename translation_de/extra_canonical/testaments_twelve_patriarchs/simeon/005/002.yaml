revisions:
- from: Und nun, meine Kinder, richtet eure Herzen vor dem Herrn auf das Gute aus und geht vor den Menschen gerade Wege; dann werdet ihr Gunst finden vor dem Herrn und den Menschen.
  to: Und nun, meine Kinder, macht eure Herzen vor dem Herrn gut und macht eure Wege vor den Menschen gerade; dann werdet ihr Gunst finden vor dem Herrn und den Menschen.
  rationale: Die Revision stellt die beiden transitiven Imperative des griechischen Textes ausdrücklich wieder her und erhält zugleich dessen parallele Satzstruktur, die dreifache Beziehung „vor“ sowie die offene Zusage, bei Herrn und Menschen Gunst zu finden. Es werden keine zusätzlichen theologischen Deutungen eingeführt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:04:03Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Aufforderung ἀγαθύνατε ist stärker als ein bloßes Ausrichten auf das Gute: Sie fordert dazu auf, die Herzen „gut“ zu machen. Ebenso ist εὐθύνατε transitiv und verlangt, die eigenen Wege gerade zu machen bzw. zu richten; „geht gerade Wege“ gibt das Ergebnis wieder, nicht die Handlung. Die übrigen Beziehungen und die Folgezusage sind zutreffend wiedergegeben.'
  naturalness: Der Entwurf ist insgesamt flüssig und würdevoll. Die revidierte Formulierung „Macht eure Herzen ... gut“ und „Macht eure Wege ... gerade“ ist leicht biblisch geprägt, aber im modernen Standarddeutsch verständlich und wegen der engen Bildsprache des Ausgangstextes angemessen.
  terminology: „Herr“, „Herzen“, „Wege“ und „Gunst“ sind passend. „Gunst finden“ gibt χάριν εὑρίσκειν idiomatisch wieder. Die Wiederholung von „vor“ bewahrt ἐνώπιον und die Parallelität des Satzes.
  issues:
  - severity: medium
    issue: „richtet eure Herzen ... auf das Gute aus“
    rationale: Die Formulierung deutet ἀγαθύνω als Orientierung auf ein außerhalb liegendes Gutes. Der griechische Imperativ fordert jedoch, die Herzen selbst gut zu machen.
  - severity: medium
    issue: „geht vor den Menschen gerade Wege“
    rationale: Damit wird das transitive εὐθύνατε („macht/richtet ... gerade“) zu einer Aufforderung, auf bestimmten Wegen zu gehen. Das Wegbild und die ethische Stoßrichtung bleiben ähnlich, doch die syntaktische und bildliche Aussage ist abgeschwächt.
  revised_text: Und nun, meine Kinder, macht eure Herzen vor dem Herrn gut und macht eure Wege vor den Menschen gerade; dann werdet ihr Gunst finden vor dem Herrn und den Menschen.
  revised_footnotes: []
