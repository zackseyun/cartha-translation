base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005/002.yaml
  text: And now, my children, make your hearts good before the Lord, and make your ways straight before men, and you will find favor before the Lord and men.
translation:
  language: de
  text: Und nun, meine Kinder, macht eure Herzen vor dem Herrn gut und macht eure Wege vor den Menschen gerade; dann werdet ihr Gunst finden vor dem Herrn und den Menschen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγαθύνατε τὰς καρδίας ὑμῶν
  choice: richtet eure Herzen … auf das Gute aus
  rationale: Das seltene Verb ἀγαθύνω bedeutet hier, etwas gut zu machen beziehungsweise auf das Gute auszurichten. Die Formulierung wahrt die ethische Aufforderung und klingt im modernen Deutschen natürlicher als das wörtliche „macht eure Herzen gut“.
- source_word: εὐθύνατε τὰς ὁδοὺς ὑμῶν
  choice: geht … gerade Wege
  rationale: Die Wendung bezeichnet ein geradliniges, rechtschaffenes Verhalten. „Geht gerade Wege“ bewahrt das Wegbild, ohne ein unnatürliches „macht eure Wege gerade“ zu erzwingen.
- source_word: χάριν
  choice: Gunst
  rationale: χάρις meint in dieser Verbindung das Wohlwollen beziehungsweise die Anerkennung, die jemand bei Gott und Menschen findet. „Gunst“ erhält die traditionelle und relationale Bedeutung.
- source_word: ἐνώπιον
  choice: vor
  rationale: „Vor“ gibt die wiederholte relationale Bedeutung „in den Augen / in der Gegenwart von“ knapp und würdig wieder.
theological_decisions:
- issue: Verhältnis von innerer Ausrichtung und äußerem Lebenswandel
  choice: Die parallelen Aufforderungen an Herz und Wege bleiben bestehen.
  alternative: Beide Aussagen zu einer allgemeinen Aufforderung zu rechtschaffenem Verhalten zusammenziehen.
  rationale: Der griechische Text unterscheidet bewusst die innere moralische Ausrichtung vor dem Herrn und den sichtbaren Lebenswandel vor den Menschen.
- issue: Auffinden von Gunst bei Gott und Menschen
  choice: „dann werdet ihr Gunst finden“ ohne nähere dogmatische Erklärung
  alternative: Als Verdienst, Heil oder bloße gesellschaftliche Anerkennung ausdeuten.
  rationale: Der Text benennt eine Folge, bestimmt aber nicht genauer deren soteriologischen oder sozialen Status; diese Offenheit bleibt erhalten.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Das biblisch geprägte Bild von Herz und Wegen bleibt erhalten; unnötige Archaismen werden vermieden.
