  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/001.yaml
  text: 'A copy[a] of the words of Simeon, which he spoke to his sons before he died, in the hundred and twentieth year of his life, at the time when Joseph his brother died. And when Simeon was sick, his sons came to visit him; and gathering his strength, he sat up and kissed them[b], and said:'
translation:
  language: de
  text: 'Das Testament Simeons, des zweiten Sohnes Jakobs und Leas


    1 Eine Abschrift[a] der Worte Simeons, die er zu seinen Söhnen sprach, bevor er im hundertzwanzigsten Jahr seines Lebens starb, zu der Zeit, als sein Bruder Josef starb. 2 Als Simeon krank war, kamen seine Söhne, um ihn zu besuchen. Da nahm er seine Kräfte zusammen, setzte sich auf, küsste sie[b] und sagte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Eine Aufzeichnung der Worte Simeons.“'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb ist verstärkt und kann wiederholtes oder besonders liebevolles Küssen bezeichnen.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: Eine Abschrift
  rationale: Das Wort bezeichnet eine schriftliche Wiedergabe oder Kopie. „Abschrift“ bewahrt den dokumentarischen Charakter der Überschrift, ohne genauer festzulegen, ob ein Protokoll oder eine wortgetreue Transkription gemeint ist.
- source_word: λόγων
  choice: der Worte
  rationale: „Worte“ gibt die formelhafte testamentarische Überschrift schlicht und unmittelbar wieder.
- source_word: πρὸ τοῦ ἀποθανεῖν
  choice: bevor er starb
  rationale: Die temporale Infinitivkonstruktion wird in natürlichem Deutsch wiedergegeben.
- source_word: ἐν ἑκατοστῷ εἰκοστῷ ἔτει
  choice: im hundertzwanzigsten Jahr
  rationale: Die formelle Altersangabe des Griechischen bleibt erhalten und wird nicht in „im Alter von 120 Jahren“ umgeformt.
- source_word: ἐν ᾧ χρόνῳ
  choice: zu der Zeit, als
  rationale: Die Formulierung erhält die ausdrückliche zeitliche Verknüpfung mit dem Tod Josefs.
- source_word: Ἀρρωστοῦντος
  choice: Als Simeon krank war
  rationale: Der Genitivus absolutus bezeichnet den Zustand Simeons zur Zeit des Besuchs; ein temporaler Nebensatz ist im Deutschen natürlich.
- source_word: ἐπισκέψασθαι
  choice: um ihn zu besuchen
  rationale: „Besuchen“ gibt die Handlung klar wieder; die fürsorgliche Anteilnahme ergibt sich aus dem Sterbebettkontext.
- source_word: ἐνισχύσας
  choice: nahm er seine Kräfte zusammen
  rationale: Die Wendung vermittelt die körperliche Anstrengung des Kranken vor dem Aufsetzen idiomatisch.
- source_word: ἐκάθισε
  choice: setzte sich auf
  rationale: Im Zusammenhang mit Krankheit und Besuch ist ein Aufsetzen am Lager wahrscheinlich; die Formulierung bleibt zugleich natürlich.
- source_word: κατεφίλησεν
  choice: küsste sie innig
  rationale: Das intensive Kompositum kann nachdrückliches, wiederholtes oder liebevolles Küssen bezeichnen. „Innig“ bewahrt diesen Ton, ohne eine bestimmte Zahl von Küssen festzulegen.
theological_decisions:
- issue: Chronologische Verbindung von Simeons Abschiedsworten mit dem Tod Josefs
  choice: Beide Zeitangaben als Bestandteil des Erzählrahmens unverändert wiedergeben
  alternative: Den Hinweis auf Josefs Tod als redaktionellen Zusatz behandeln oder die Chronologie paraphrasierend glätten
  rationale: Der griechische Text bietet beide Angaben als Teil der Überschrift und der einleitenden Erzählung. Die Übersetzung bewahrt diese Spannung, ohne sie auszulassen oder historisch zu harmonisieren.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem testamentarischem Ton. Die formelle Altersangabe und der dokumentarische Charakter der Überschrift bleiben erhalten; Satzbau und Erzählfluss sind behutsam an natürliches Deutsch angepasst.
