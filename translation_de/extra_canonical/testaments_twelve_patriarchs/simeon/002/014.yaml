review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe von Ἔγνων als „erkannte“ und die Darstellung der Handlung als bereits vor der Erkenntnis liegend sind grundsätzlich vertretbar. Allerdings geht „gegen meinen Bruder Josef“ über διὰ Ἰωσὴφ hinaus: διά mit Akkusativ bezeichnet hier zunächst Anlass/Bezug („wegen“, gegebenenfalls „im Blick auf“), nicht ausdrücklich die Zielrichtung eines Vorgehens gegen Josef. Auch „einen bösen Plan“ ist gegenüber πονηρὸν πρᾶγμα in Verbindung mit ἐνεθυμήθην stärker konkretisierend als der griechische Wortlaut.'
  naturalness: Der Satz ist flüssiges modernes Standarddeutsch. „Einen bösen Gedanken hegen“ ist ebenso idiomatisch und gibt das innere Erwägen präziser wieder. Die Formulierung „wegen meines Bruders Josef, den ich beneidete“ ist klar und bewahrt die knappe Begründungsstruktur.
  terminology: „Herr“, „Jakob“ und „Josef“ sind angemessen. Es besteht kein Anlass, eine theologische Deutung einzutragen. Die koordinierte Wendung ἐνώπιον κυρίου καὶ Ἰακὼβ τοῦ πατρός μου wird ohne die nicht belegte Ergänzung „gegen Jakob“ wiedergegeben.
  issues:
  - severity: medium
    issue: „gegen meinen Bruder Josef“ verengt bzw. erweitert διὰ Ἰωσὴφ.
    rationale: Der griechische Ausdruck markiert den Anlass oder Bezug der bösen Erwägung. Zwar legt der erzählerische Zusammenhang eine feindselige Haltung nahe, doch wird eine explizite Zielrichtung „gegen Josef“ hier nicht ausgedrückt und sollte nicht in die Übersetzung eingetragen werden.
  - severity: low
    issue: „einen bösen Plan ... gefasst“ konkretisiert πονηρὸν πρᾶγμα ἐνεθυμήθην.
    rationale: Der Text spricht zunächst von einer bösen Sache bzw. Erwägung, die Simeon in den Sinn nahm. „Plan“ kann einen weiter fortgeschrittenen Entschluss nahelegen. „Einen bösen Gedanken hegen“ bleibt näher am inneren Vorgang.
  revised_text: Denn ich erkannte, dass ich vor dem Herrn und meinem Vater Jakob einen bösen Gedanken gehegt hatte – wegen meines Bruders Josef, den ich beneidete.
