revisions:
- from: Denn ich erkannte, dass ich vor dem Herrn und vor meinem Vater Jakob einen bösen Plan gegen meinen Bruder Josef gefasst hatte, weil ich ihn beneidete.
  to: Denn ich erkannte, dass ich vor dem Herrn und meinem Vater Jakob einen bösen Gedanken gehegt hatte – wegen meines Bruders Josef, den ich beneidete.
  rationale: Die Revision ersetzt die nicht ausdrücklich im griechischen Text enthaltene Zielrichtung „gegen Josef“ durch „wegen meines Bruders Josef“ und gibt das innere Erwägen mit „einen bösen Gedanken hegen“ wieder. Dadurch bleibt der Text in seiner Aussage über Neid und böse Absicht verständlich, ohne die syntaktische und semantische Offenheit von διὰ Ἰωσὴφ unnötig aufzulösen.
