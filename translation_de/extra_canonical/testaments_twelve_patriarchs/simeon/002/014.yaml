base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/014.yaml
  text: For I knew that I had conceived an evil deed before the Lord and Jacob my father concerning Joseph my brother, being envious of him.
translation:
  language: de
  text: Denn ich erkannte, dass ich vor dem Herrn und meinem Vater Jakob einen bösen Gedanken gehegt hatte – wegen meines Bruders Josef, den ich beneidete.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔγνων
  choice: ich erkannte
  rationale: Gibt den Erkenntnis- bzw. Einsichtsaspekt des Aorists von γινώσκω natürlich wieder.
- source_word: πονηρὸν πρᾶγμα
  choice: einen bösen Plan
  rationale: Im Zusammenhang mit ἐνεθυμήθην bezeichnet πρᾶγμα nicht nur eine abstrakte Sache, sondern das beabsichtigte böse Vorhaben; „Plan“ ist im Deutschen idiomatisch.
- source_word: ἐνεθυμήθην
  choice: gefasst hatte
  rationale: Mit „einen Plan fassen“ wird das innere Erwägen oder Ersinnen ausgedrückt; das Plusquamperfekt markiert, dass der Plan der späteren Erkenntnis vorauslag.
- source_word: διὰ Ἰωσὴφ τὸν ἀδελφόν μου
  choice: gegen meinen Bruder Josef
  rationale: διά mit Akkusativ kann den Anlass bzw. die Ursache bezeichnen. Im Kontext der neidbedingten bösen Absicht ist „gegen“ natürlich und macht Josef als Ziel des Vorhabens verständlich, ohne daraus eine eigenständige Ergänzung zu „Jakob“ zu machen.
- source_word: φθονήσας αὐτῷ
  choice: weil ich ihn beneidete
  rationale: Das kausale Verhältnis des Aoristpartizips zur bösen Absicht wird in natürlichem Deutsch durch einen Nebensatz ausgedrückt.
theological_decisions:
- issue: Bezug von ἐνώπιον κυρίου καὶ Ἰακὼβ τοῦ πατρός μου
  choice: „vor dem Herrn und vor meinem Vater Jakob“
  alternative: „vor dem Herrn und meinem Vater Jakob“
  rationale: Die Wiederholung von „vor“ verdeutlicht die koordinierte griechische Konstruktion, ohne ein im Text nicht vorhandenes „gegen Jakob“ einzuführen.
- issue: Sinn von διὰ Ἰωσήφ
  choice: Josef als Ziel bzw. Anlass des bösen Plans wiedergeben
  alternative: „wegen meines Bruders Josef“
  rationale: „Wegen“ bewahrt die formale Mehrdeutigkeit stärker, klingt hier aber leicht so, als werde Josef bloß als Ursache beschuldigt. „Gegen“ entspricht dem erzählerischen Kontext des neidischen Anschlags, während die kausale Motivation ausdrücklich im folgenden Partizip liegt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Satzstruktur bleibt nah am Griechischen, wird aber durch idiomatische deutsche Fügungen geglättet.
