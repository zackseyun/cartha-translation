  text: And I set my liver against him so as to kill him, because the ruler of deceit and the spirit of jealousy blinded my mind, so that I did not regard him as a brother, nor even spare Jacob my father.
translation:
  language: de
  text: Und ich richtete mein Innerstes gegen ihn, um ihn zu töten; denn der Herrscher der Täuschung und der Geist der Eifersucht verblendeten meinen Verstand, sodass ich ihn nicht als Bruder achtete und auch meinen Vater Jakob nicht schonte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐστήριξα ἐπʼ αὐτὸν τὰ ἤπατά μου
  choice: ich richtete mein Innerstes gegen ihn
  rationale: Wörtlich ist von der »Leber« die Rede, die im antiken Sprachgebrauch als Sitz heftiger Regungen gelten kann. »Mein Innerstes« bewahrt das Körperbild in verständlicher Form; »gegen ihn richten« gibt die feindliche Entschlossenheit wieder.
- source_word: ὥστε ἀνελεῖν αὐτόν
  choice: um ihn zu töten
  rationale: ἀναιρέω bezeichnet hier eindeutig das Töten bzw. Beseitigen; der Infinitiv drückt die beabsichtigte Folge aus.
- source_word: ὁ ἄρχων τῆς πλάνης
  choice: der Herrscher der Täuschung
  rationale: ἄρχων wird formal als »Herrscher« und πλάνη als irreführende Täuschung wiedergegeben, ohne die Gestalt näher zu identifizieren.
- source_word: τὸ πνεῦμα τοῦ ζήλου
  choice: der Geist der Eifersucht
  rationale: ζῆλος bezeichnet im Zusammenhang die feindselige Eifersucht auf den Bruder, nicht positiven Eifer.
- source_word: ἐτύφλωσέ μου τὸν νοῦν
  choice: verblendeten meinen Verstand
  rationale: Die Singularform des griechischen Verbs steht bei einem zusammengesetzten Subjekt. Im natürlichen Deutschen verlangt dieses den Plural; das Bild geistiger Blindheit bleibt in »verblendeten« erhalten.
- source_word: μὴ προσέχειν αὐτῷ ὡς ἀδελφῷ
  choice: sodass ich ihn nicht als Bruder achtete
  rationale: προσέχειν mit Dativ meint hier, jemandem Beachtung bzw. Rücksicht zu schenken. »Als Bruder achten« trifft den ethischen Beziehungssinn natürlicher als ein rein kognitives »ansehen«.
- source_word: μηδὲ φείσασθαι τῷ πατρί μου Ἰακώβ
  choice: und auch meinen Vater Jakob nicht schonte
  rationale: φείδομαι mit Dativ bedeutet »schonen/Rücksicht nehmen auf«. Die Apposition »meinen Vater Jakob« wird im Deutschen natürlich wiedergegeben.
theological_decisions:
- issue: Wirksamkeit des Herrschers der Täuschung und des Geistes der Eifersucht
  choice: Beide werden als Subjekt der Verblendung beibehalten.
  alternative: Die Aussage psychologisieren oder beide Mächte ausdrücklich mit Satan gleichsetzen.
  rationale: Der griechische Text stellt beide Größen nebeneinander und schreibt ihnen die Verblendung zu, identifiziert sie aber nicht weiter. Diese Spannung bleibt erhalten.
- issue: Abweichende jüngste englische Revision
  choice: Übersetzung nach dem angegebenen griechischen Ausgangstext.
  alternative: Die Revisionsfassung mit »waren sein Gott« und der Rettung durch einen Engel übernehmen.
  rationale: Die Revisionsfassung entspricht nicht dem hier vorgelegten griechischen Wortlaut. Maßgeblich ist die originalsprachliche Quelle; der englische POB-Text dient nur als geprüfte Konsultationsschicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das fremdartige Leberbild wird nicht mechanisch als »Leber« wiedergegeben, sondern mit »Innerstes« so vermittelt, dass die antike Vorstellung vom Sitz heftiger Regungen erkennbar bleibt. Der Satzbau folgt der griechischen Begründungs- und Folgestruktur, ohne unnatürlich zu wirken.
