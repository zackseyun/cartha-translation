  source_fidelity: '„Herz“ und „Leber“ geben καρδία und τὰ ἤπατα sachgerecht wieder; „regungslos“ trifft ἀκίνητα gut. „mein Innerstes“ glättet jedoch τὰ σπλάγχνα zu stark: Das griechische Wort bezeichnet konkret die Eingeweide/inneren Organe und nur zugleich bildlich die tiefen Regungen. Die körperliche Dreierreihe sollte erhalten bleiben.'
  naturalness: Die überarbeitete Fassung bleibt modernes, würdiges Standarddeutsch. „Meine Eingeweide ohne Mitgefühl“ ist absichtlich markant, aber verständlich und entspricht der ungewöhnlichen Bildsprache der Vorlage.
  terminology: „Eingeweide“ bewahrt die anatomische Metapher von σπλάγχνα besser als das abstrahierende „Innerstes“. „Ohne Mitgefühl“ gibt ἀσυμπαθῆ neutral wieder, ohne die Aussage auf eine engere theologische Kategorie festzulegen. Die griechischen Pluralformen bei Leber und Eingeweiden müssen nicht durch unnatürliches deutsches „Lebern“ nachgebildet werden; die singuläre deutsche Organbezeichnung „Leber“ ist hier idiomatisch.
  issues:
