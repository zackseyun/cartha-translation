  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/004.yaml
  text: For my heart was hard, and my liver unmoved, and my inward parts without compassion.
translation:
  language: de
  text: Denn mein Herz war hart, meine Leber regungslos und meine Eingeweide ohne Mitgefühl.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καρδία
  choice: Herz
  rationale: Bewahrt das griechische Körperbild und bezeichnet zugleich das innere Zentrum des Menschen.
- source_word: τὰ ἤπατά
  choice: meine Leber
  rationale: Gibt das ungewöhnliche anatomische Bild des griechischen Textes bewusst wörtlich wieder, statt es mit einer Deutung zu ersetzen.
- source_word: ἀκίνητα
  choice: regungslos
  rationale: Entspricht dem Bild des Unbewegten und lässt offen, ob körperliche Erstarrung oder emotionale Unberührtheit gemeint ist.
- source_word: τὰ σπλάγχνα
  choice: mein Innerstes
  rationale: Das griechische Wort bezeichnet die inneren Organe und bildlich den Sitz tiefer Empfindungen; „Innerstes“ vermittelt beides im natürlichen Deutschen.
- source_word: ἀσυμπαθῆ
  choice: ohne Mitgefühl
  rationale: Drückt den Mangel an Mit-Leiden beziehungsweise Erbarmen klar und idiomatisch aus.
theological_decisions:
- issue: Körpermetaphern für innere Verhärtung
  choice: Die Abfolge Herz, Leber und Innerstes bleibt erhalten.
  alternative: Alle drei Begriffe verallgemeinernd als Gefühlsleben oder Inneres wiederzugeben.
  rationale: Die auffällige Bildsprache des Ausgangstextes soll nicht eingeebnet oder zu einer bestimmten Anthropologie systematisiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung „meine Leber regungslos“ ist wegen der markanten Körpermetaphorik des griechischen Textes bewusst beibehalten.
