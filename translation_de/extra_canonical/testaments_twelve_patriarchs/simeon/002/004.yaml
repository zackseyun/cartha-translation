    issue: τὰ σπλάγχνα wird mit „mein Innerstes“ wiedergegeben.
    rationale: „Innerstes“ überträgt zwar die bildliche Ebene, lässt aber die ausdrücklich körperliche Metaphorik der Eingeweide verschwinden. Die Quelle reiht Herz, Leber und Eingeweide auf; diese Reihung ist für die Aussageform relevant.
  revised_text: Denn mein Herz war hart, meine Leber regungslos und meine Eingeweide ohne Mitgefühl.
