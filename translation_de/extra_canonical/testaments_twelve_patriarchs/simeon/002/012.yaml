id: T12P.SIM.2.12
reference: Testament of Simeon 2:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καίγε συνετρίβει με *ὁ Κύριος⁷⁸ καὶ ἐκώλυσεν δράσιν⁷⁹ *ἀπʼ ἐμοῦ⁸⁰. *ὅτι ἡ χείρ μου ἡ δεξιὰ ἡμίξηρος γέγονεν ἐπὶ ἡμέρας ἑπτά⁸¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/012.yaml
  text: And the Lord crushed me and held back action from me, for my right hand became half-withered for seven days.
translation:
  language: de
  text: Ja, der Herr schlug mich nieder und hinderte mich am Handeln; denn meine rechte Hand war sieben Tage lang halb verdorrt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: Ja
  rationale: Die Partikelkombination bekräftigt die Aussage; „Ja“ gibt diese Hervorhebung im Deutschen natürlich wieder.
- source_word: συνετρίβει
  choice: schlug mich nieder
  rationale: Das Imperfekt bezeichnet ein wirksames Niederbrechen bzw. Demütigen; „schlug mich nieder“ bewahrt die starke Bildsprache, ohne zwingend eine Zerschmetterung im wörtlichen Sinn anzunehmen.
- source_word: ἐκώλυσεν δράσιν ἀπʼ ἐμοῦ
  choice: hinderte mich am Handeln
  rationale: Die Wendung besagt wörtlich, dass der Herr das Handeln von ihm fernhielt; die gewählte Formulierung ist idiomatisch und lässt die genaue Art der verhinderten Handlung offen.
- source_word: ἡμίξηρος
  choice: halb verdorrt
  rationale: Das Kompositum bedeutet „halb trocken/verdorrt“ und beschreibt eine teilweise Lähmung oder Funktionsminderung der Hand, ohne diese medizinisch genauer festzulegen.
- source_word: γέγονεν ἐπὶ ἡμέρας ἑπτά
  choice: war sieben Tage lang
  rationale: Das Perfekt von γίνομαι bezeichnet den eingetretenen und fortbestehenden Zustand; im natürlichen Deutschen wird dies mit „war … lang“ wiedergegeben.
theological_decisions:
- issue: Urheberschaft der Züchtigung und Verhinderung
  choice: Der Herr wird ausdrücklich als Handelnder genannt.
  alternative: Eine unpersönliche oder lediglich zugelassene Folge formulieren.
  rationale: Der griechische Text hat ὁ Κύριος als Subjekt sowohl des Niederbrechens als auch des Hinderns; diese unmittelbare Aussage darf nicht abgeschwächt werden.
- issue: Art des verhinderten Handelns
  choice: Allgemein „am Handeln“
  alternative: Simeons Gewalttat oder Handlungsfähigkeit ausdrücklich benennen.
  rationale: δράσιν bleibt im vorliegenden Text allgemein. Der Zusammenhang kann Gewalt nahelegen, doch die Übersetzung sollte diese Deutung nicht in den Wortlaut eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kräftige Aussage „schlug mich nieder“ bewahrt die Härte von συνετρίβει; „halb verdorrt“ hält die ungewöhnliche, körperlich-konkrete Formulierung des Griechischen fest.
