base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/006.yaml
  text: For in the time of my youth I was very jealous of Joseph, because my father loved him above all.
translation:
  language: de
  text: Denn in meiner Jugend war ich sehr eifersüchtig auf Josef, weil mein Vater ihn mehr liebte als alle anderen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν γὰρ τῷ καιρῷ τῆς νεότητός μου
  choice: Denn in meiner Jugend
  rationale: γάρ begründet die vorherige Aussage und wird mit „Denn“ wiedergegeben; die zeitliche Wendung lässt sich im modernen Deutschen natürlich zu „in meiner Jugend“ verdichten.
- source_word: πολλὰ ἐζήλωσα τὸν Ἰωσήφ
  choice: war ich sehr eifersüchtig auf Josef
  rationale: ζηλόω bezeichnet hier im Kontext eine starke, gegen Josef gerichtete Eifersucht; πολλὰ verstärkt sie mit „sehr“.
- source_word: ἠγάπα αὐτὸν ὁ πατήρ μου παρὰ πάντας
  choice: weil mein Vater ihn mehr liebte als alle anderen
  rationale: 'παρὰ πάντας drückt einen Vergleich aus: Der Vater liebte Josef mehr als alle übrigen. „Alle anderen“ bewahrt den im Kontext naheliegenden, aber im Griechischen nicht ausdrücklich benannten Bezug auf die Brüder.'
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kausale Verknüpfung durch γάρ bleibt ausdrücklich erhalten; die starke Eifersucht wird klar benannt, ohne den Satz konfessionell oder psychologisch auszudeuten.
