  source_fidelity: Der Entwurf gibt Ἐν γὰρ τῷ καιρῷ τῆς νεότητός μου idiomatisch und vollständig als „Denn in meiner Jugend“ wieder. πολλὰ ἐζήλωσα wird angemessen durch „war ich sehr eifersüchtig auf“ abgebildet; die deutsche Formulierung wahrt den im Verb liegenden Kontext von Eifersucht/Neid, ohne ihn weiter auszudeuten. Der Vergleich παρὰ πάντας ist mit „mehr liebte als alle anderen“ sachgerecht erfasst.
  naturalness: Modernes, gut lesbares Standarddeutsch in einem dem testamentarischen Erzählton angemessenen Register. Satzstellung, Kausalverknüpfung und die Bezugnahme auf Josef sind natürlich.
