  text: '*Ἐν γὰρ τῷ καιρῷ τῆς νεότητός μου πολλὰ²³ ἐζήλωσα²⁴ τὸν²⁵ Ἰωσήφ, ὅτι²⁶ *ἠγάπα αὐτὸν ὁ πατήρ μου²⁷ Γπαρὰ πάντας⁷²⁸'
