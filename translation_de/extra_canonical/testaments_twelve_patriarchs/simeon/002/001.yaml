  text: Ἀκούσατε¹, *τέκνα μου², Συμεὼν τοῦ πατρὸς ὑμῶν Γκαὶ ἀναγγελῶ ὑμῖν¹³ ὅσα ἔχω *ἐν τῇ καρδίᾳ μου⁴.
