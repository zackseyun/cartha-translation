  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/001.yaml
  text: Hear, my children, Simeon your father, and I will declare to you what I have in my heart.
translation:
  language: de
  text: Hört, meine Kinder, Simeon, euren Vater, und ich werde euch verkünden, was ich in meinem Herzen habe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσατε
  choice: Hört auf mich
  rationale: Das Verb fordert hier zum aufmerksamen Zuhören auf. Das im Deutschen ergänzte „mich“ macht den Bezug auf den unmittelbar folgenden Sprecher Simeon natürlich und eindeutig.
- source_word: τέκνα μου
  choice: meine Kinder
  rationale: Direkte und würdevolle Wiedergabe der familiären Anrede.
- source_word: Συμεὼν τοῦ πατρὸς ὑμῶν
  choice: auf Simeon, euren Vater
  rationale: Die griechische Apposition wird idiomatisch an die Aufforderung zum Hören angeschlossen; Simeon bezeichnet sich dabei als Vater der Angeredeten.
- source_word: ἀναγγελῶ ὑμῖν
  choice: ich will euch sagen
  rationale: Gibt die ankündigende Zukunftsform und den Mitteilungscharakter in natürlichem modernem Deutsch wieder.
- source_word: ὅσα ἔχω ἐν τῇ καρδίᾳ μου
  choice: was ich in meinem Herzen trage
  rationale: Die geläufige deutsche Wendung bewahrt das Bild des Herzens als Ort innerer Gedanken und Anliegen, ohne es auf bloße Gefühle zu verengen.
