  text: '*Ἐπειδὴ καὶ¹⁷ ἡ ἀνδρεία¹⁸ ἀπὸ¹⁹ ὑψίστου δίδοται²⁰ τοῖς²¹ ἀνθρώποις ἐν ψυχαῖς καὶ²² σώμασιν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/005.yaml
  text: For courage also is given by the Most High to men in soul and body.
translation:
  language: de
  text: Denn auch der Mut wird den Menschen vom Höchsten an Seele und Leib gegeben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνδρεία
  choice: Mut
  rationale: Bezeichnet hier Mut beziehungsweise Tapferkeit als verliehene Eigenschaft; „Mut“ ist im modernen Deutschen natürlich und umfasst den Sinn ohne unnötige militärische Einengung.
- source_word: ἀπὸ ὑψίστου
  choice: vom Höchsten
  rationale: Bewahrt die Gottesbezeichnung des griechischen Textes und gibt die Herkunft der Gabe knapp und würdig wieder.
- source_word: ἐν ψυχαῖς καὶ σώμασιν
  choice: an Seele und Leib
  rationale: Gibt die beiden Bereiche menschlichen Daseins idiomatisch wieder. Der Singular entspricht im Deutschen der distributiven Aussage über die Menschen, ohne den Sinn aufzulösen.
- source_word: δίδοται
  choice: wird … gegeben
  rationale: Das Passiv des Ausgangstextes bleibt erhalten; der Geber wird durch „vom Höchsten“ ausdrücklich bezeichnet.
theological_decisions:
- issue: Göttlicher Ursprung des Mutes
  choice: „wird … vom Höchsten … gegeben“
  alternative: „kommt … vom Höchsten“
  rationale: Die gewählte Fassung wahrt das ausdrückliche Verb „geben“ und stellt Mut als Gabe des Höchsten dar, ohne weitere theologische Folgerungen einzutragen.
- issue: Verhältnis von Seele und Leib
  choice: koordinierte Wendung „an Seele und Leib“
  alternative: „in den Seelen und Körpern“
  rationale: Der Text nennt beide Bereiche parallel, ohne ihr Verhältnis näher zu bestimmen. Die Übersetzung bewahrt diese Spannung und vermeidet eine dogmatische Anthropologie.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. „Denn auch“ bildet Ἐπειδὴ καὶ als begründenden Anschluss ab; der vorausgehende Kontext ist in diesem Einzelvers nicht ausgeschrieben.
