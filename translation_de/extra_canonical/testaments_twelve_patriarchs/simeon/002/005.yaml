  verdict: approve
  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des Griechischen zuverlässig wieder: ἐπειδὴ καί als begründend-anschließendes „Denn auch“, ἀνδρεία als „Mut“, δίδοται als Passiv „wird … gegeben“, ἀπὸ ὑψίστου als „vom Höchsten“ und τοῖς ἀνθρώποις als „den Menschen“. „An Seele und Leib“ ist eine idiomatische distributive Wiedergabe von ἐν ψυχαῖς καὶ σώμασιν und fügt keine anthropologische Deutung hinzu.'
  naturalness: „Denn auch der Mut wird den Menschen vom Höchsten an Seele und Leib gegeben“ ist verständliches, würdiges modernes Standarddeutsch. Die Stellung von „an Seele und Leib“ ist leicht gehoben, passt jedoch zum Register des Werks und bildet die umfassende Zuordnung zu beiden Bereichen natürlich ab.
  terminology: „Mut“ ist für ἀνδρεία sachgerecht und weniger unnötig verengt als „Tapferkeit“. „Der Höchste“ bewahrt die knappe Gottesbezeichnung des Ausgangstextes. „Seele und Leib“ ist im deutschen religiös-literarischen Register etabliert und wahrt die Zweigliedrigkeit des griechischen Ausdrucks.
