  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/011.yaml
  text: But when I heard this, I was very angry with Judah, because he had let him go alive; and for five months I remained angry with him.
translation:
  language: de
  text: Als ich das hörte, wurde ich sehr zornig auf Juda, weil er ihn lebend freigelassen hatte; und fünf Monate lang blieb ich zornig auf ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὠργίσθην ἐπὶ τὸν Ἰούδαν σφόδρα
  choice: wurde ich sehr zornig auf Juda
  rationale: Gibt sowohl die starke Intensivierung durch σφόδρα als auch die gegen Juda gerichtete Emotion natürlich und quellennah wieder.
- source_word: ζῶντα αὐτὸν ἀπέλυσεν
  choice: er ihn lebend hatte gehen lassen
  rationale: Bewahrt den Sinn, dass Juda den Betreffenden am Leben ließ und freigab; das Plusquamperfekt verdeutlicht das zeitliche Verhältnis zum Zorn.
- source_word: ἐποίησα μῆνας πέντε ὀργιζόμενος ἐπʼ αὐτῷ
  choice: fünf Monate lang blieb ich zornig auf ihn
  rationale: Die idiomatische deutsche Formulierung bildet die über fünf Monate andauernde Haltung ab, ohne den griechischen Ausdruck unnatürlich wörtlich wiederzugeben.
