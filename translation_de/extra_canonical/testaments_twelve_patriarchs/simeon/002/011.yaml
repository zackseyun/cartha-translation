  source_fidelity: 'Der Entwurf gibt den Sinn des griechischen Textes insgesamt zutreffend wieder: Simeon reagiert sehr zornig auf Juda, weil dieser den nicht näher benannten Betreffenden lebend freigelassen hat, und der Zorn dauert fünf Monate an. „hatte gehen lassen“ ist jedoch keine optimale Wiedergabe von ἀπέλυσεν und legt durch das Plusquamperfekt eine im Griechischen nicht eigens markierte Zeitstufe nahe.'
  naturalness: „Er ihn lebend hatte gehen lassen“ klingt im modernen Standarddeutsch schwerfällig. „Er ihn lebend freigelassen hatte“ ist idiomatischer, während die Satzfolge und der erzählerische Ton erhalten bleiben.
