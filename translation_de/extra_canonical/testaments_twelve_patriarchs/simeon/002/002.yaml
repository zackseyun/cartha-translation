base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/002.yaml
  text: I was born from Jacob, the second son to my father, and Leah my mother called me Simeon, because the Lord heard her petition.
translation:
  language: de
  text: Ich wurde meinem Vater Jakob als zweiter Sohn geboren, und meine Mutter Lea nannte mich Simeon, weil der Herr ihr Flehen erhörte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγεννήθην ἐξ Ἰακώβ
  choice: Ich wurde Jakob … geboren
  rationale: Gibt Herkunft und Abstammung natürlich wieder, ohne das im Deutschen missverständliche wörtliche „aus Jakob geboren“.
- source_word: υἱὸς δεύτερος τῷ πατρὶ μου
  choice: als zweiter Sohn meines Vaters
  rationale: Bewahrt die Rangfolge und gibt die Beziehung im natürlichen deutschen Ausdruck wieder.
- source_word: ἐκάλεσέ με Συμεώνα
  choice: nannte mich Simeon
  rationale: Entspricht dem Benennungsakt und verwendet die im Deutschen etablierte Namensform.
- source_word: ἤκουσε Κύριος τῆς δεήσεως αὐτῆς
  choice: weil der Herr ihr Flehen erhört hatte
  rationale: „Erhören“ gibt bei einem Gebet das griechische ἀκούω idiomatisch wieder; δέησις bezeichnet ein inständiges Gebet oder Flehen.
theological_decisions:
- issue: Bedeutung des göttlichen Hörens
  choice: erhört hatte
  alternative: gehört hatte
  rationale: Im Zusammenhang mit Leas Gebet bezeichnet das Hören eine gewährte Antwort; „erhören“ bewahrt diese im Griechischen kontextuell angelegte Bedeutung, ohne Weiteres hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Griechischen, wird aber durch „als zweiter Sohn meines Vaters“ und das idiomatische „erhört“ natürlich lesbar.
