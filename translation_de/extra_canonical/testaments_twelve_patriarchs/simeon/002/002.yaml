  rationale: Die Revision klärt Jakobs Rolle als Vater und verbessert die deutsche Satzfügung. Sie ersetzt außerdem das semantisch nicht notwendige Plusquamperfekt durch ein dem griechischen Aorist entsprechendes Präteritum; Bedeutung, Register und Namensformen bleiben erhalten.
