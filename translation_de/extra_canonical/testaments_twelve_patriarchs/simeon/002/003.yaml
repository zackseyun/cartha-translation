base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/003.yaml
  text: For I became very strong; I did not shrink from any deed, nor was I afraid of anything.
translation:
  language: de
  text: Denn ich wurde sehr stark; vor keiner Tat schreckte ich zurück, und ich fürchtete mich vor nichts.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δυνατὸς … ἐγενόμην
  choice: ich wurde … stark
  rationale: Gibt die inchoative Aussage mit ἐγενόμην unmittelbar wieder; δυνατός bezeichnet hier persönliche Stärke bzw. Tatkraft.
- source_word: σφόδρα
  choice: sehr
  rationale: Natürliche und genaue Wiedergabe der starken Gradangabe.
- source_word: οὐκ ἐδειλίασα πρᾶξιν
  choice: vor keiner Tat schreckte ich zurück
  rationale: δειλιάω bezeichnet verzagtes Zurückschrecken; der Akkusativ πρᾶξιν benennt das, wovor Simeon nicht zurückwich.
- source_word: οὐδὲ ἐφοβήθην ἀπὸ παντὸς πράγματος
  choice: und ich fürchtete mich vor nichts
  rationale: Idiomatiche deutsche Wiedergabe der umfassenden Negation; πρᾶγμα kann Sache, Angelegenheit oder Geschehen bezeichnen, sodass „nichts“ die Offenheit bewahrt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Verneinung wird natürlich formuliert, ohne Simeons Aussage abzuschwächen oder theologisch auszudeuten.
