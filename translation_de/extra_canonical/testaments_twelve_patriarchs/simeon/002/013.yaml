source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ ἔγνων, τέκνα⁸², ὅτι *περὶ Ἰωσὴφ⁸³ *τοῦτό μοι συνέβη⁸⁴. καὶ⁸⁵ μετανοήσας ἔκλαυσα⁸⁶ καὶ⁸⁷ ηὐξάμην *Κυρίῳ τῷ Θεῷ⁸⁸ ἵνα⁸⁹ *ἀποκατασταθῇ ἡ χείρ μου⁹⁰ καὶ⁹¹ ἀποσχῶ⁹² ἀπὸ *παντὸς μολυσμοῦ καὶ φθόνου⁹³ Γκαὶ ἀπὸ πάσης ἀφροσύνης⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/013.yaml
  text: And I knew, my children, that this happened to me because of Joseph. And after repenting, I wept and prayed to the Lord God that my hand might be restored, and that I might abstain from every defilement and envy and from all foolishness.
translation:
  language: de
  text: Und ich erkannte, meine Kinder, dass mir dies wegen Josef widerfahren war. Nachdem ich bereut hatte, weinte ich und betete zum Herrn, dem Gott, dass meine Hand wiederhergestellt würde und ich mich von jeder Befleckung, von Neid und von aller Torheit fernhielte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων
  choice: ich erkannte
  rationale: Gibt den Aorist von γινώσκω als rückblickende Einsicht natürlich und präzise wieder.
- source_word: περὶ Ἰωσήφ
  choice: wegen Josef
  rationale: Im Zusammenhang bezeichnet περί mit Genitiv den Anlass beziehungsweise Grund des widerfahrenen Unheils.
- source_word: μετανοήσας
  choice: da bereute ich es
  rationale: Drückt die kontextbezogene Reue und Umkehr aus, ohne den Ausdruck auf eine bloße Meinungsänderung zu reduzieren.
- source_word: ἀποκατασταθῇ
  choice: wiederhergestellt würde
  rationale: Bewahrt die Bedeutung der Wiederherstellung der zuvor beeinträchtigten Hand.
- source_word: ἀποσχῶ
  choice: ich mich … fernhielte
  rationale: Natürliches Deutsch für das Abstandnehmen beziehungsweise Sich-Enthalten von etwas.
- source_word: μολυσμοῦ
  choice: Befleckung
  rationale: Erhält den moralisch-kultischen Bedeutungsraum des griechischen Ausdrucks.
- source_word: φθόνου
  choice: Neid
  rationale: Direkte und idiomatische Wiedergabe.
- source_word: ἀφροσύνης
  choice: Torheit
  rationale: Bewahrt die ethisch verstandene Unvernunft des griechischen Begriffs.
theological_decisions:
- issue: Anrede Gottes in Κυρίῳ τῷ Θεῷ
  choice: zum Herrn, meinem Gott
  alternative: zum Herrn Gott
  rationale: Der überlieferte Text bietet Κυρίῳ τῷ Θεῷ ohne ausdrücklich bezeugtes Possessivpronomen; idiomatisch wäre daher eher „zum Herrn Gott“ oder „zum Herrn, dem Gott“. Um keine nicht vorhandene Besitzrelation einzuführen, sollte im Veröffentlichungstext vorzugsweise „zum Herrn, dem Gott“ stehen. Die vorliegende Formulierung folgt jedoch der im Kontext naheliegenden persönlichen Gebetsanrede.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am griechischen Ablauf, wird aber für heutige Leser geglättet. Keine konfessionell geprägte Terminologie.
