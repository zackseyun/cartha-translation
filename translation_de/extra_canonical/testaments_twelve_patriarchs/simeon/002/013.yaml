  to: Und ich erkannte, meine Kinder, dass mir dies wegen Josef widerfahren war. Nachdem ich bereut hatte, weinte ich und betete zum Herrn, dem Gott, dass meine Hand wiederhergestellt würde und ich mich von jeder Befleckung, von Neid und von aller Torheit fernhielte.
  rationale: Die Revision entfernt das unbezeugte „meinem“, ohne die Identifikation von „Herr“ und „Gott“ aufzulösen, und gestaltet die Wiedergabe des vorzeitigen Partizips μετανοήσας quellentreuer. Der übrige Wortlaut bleibt erhalten.
