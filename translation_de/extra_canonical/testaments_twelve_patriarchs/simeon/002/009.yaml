revisions:
- from: Denn als ich nach Sichem gegangen war, um Salbe für die Herden zu holen, und Ruben nach Dotan, wo sich unsere Vorräte und unser gesamter Lagerbestand befanden, verkaufte mein Bruder Juda ihn an die Ismaeliten, als diese vorbeikamen.
  to: Denn als ich nach Sichem ging, um Salbe für die Herden zu bringen, und Ruben nach Dotan, wo sich unsere Vorräte und unser gesamter Lagerbestand befanden, verkaufte Juda, mein Bruder, ihn an die Ismaeliten, als er zu ihnen kam.
  rationale: Die Revision korrigiert die Zuordnung des Partizips ἐλθών zu Juda und gibt ἐνέγκαι mit „zu bringen“ wieder. Die syntaktisch etwas auffällige Schlusswendung bleibt bewusst nah am griechischen, dessen überlieferte Konstruktion an dieser Stelle schwierig ist; sie wird nicht durch die unbelegte Vorstellung eines Vorbeiziehens der Ismaeliten ersetzt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:03:53Z'
review_pass:
  verdict: revise
  source_fidelity: Die Orts- und Vorratsangaben sowie die Wiedergabe von ἄλειμμα und τοῖς ποιμνίοις sind im Grundsatz zutreffend. Jedoch bezieht sich das maskuline Singularpartizip ἐλθών grammatisch auf Juda, nicht auf die Ismaeliten. Die Ergänzung „als diese vorbeikamen“ kehrt daher die im griechischen Wortlaut angelegte Handlungszuordnung um. Außerdem bedeutet ἐνέγκαι „bringen“, nicht „holen“.
  naturalness: Der Satz ist in modernem, würdigem Standarddeutsch gut lesbar. Eine leichte Umstellung macht die Partizipialhandlung eindeutig, ohne die knappe antike Satzführung unnötig auszubauen.
  terminology: „Sichem“, „Dotan“, „Ruben“, „Juda“ und „Ismaeliten“ sind geläufige deutsche Namensformen. „Salbe für die Herden“ wahrt die offene, ungewöhnliche Formulierung des Textes. „Vorräte und unser gesamter Lagerbestand“ gibt die beiden griechischen Ausdrücke angemessen differenziert wieder.
  issues:
  - severity: high
    issue: „als diese vorbeikamen“ ordnet ἐλθών den Ismaeliten zu.
    rationale: ἐλθών ist maskuliner Singular und stimmt mit Ἰούδας überein. Der Text beschreibt demnach Judas Kommen zu den Ismaeliten, nicht deren Vorbeikommen.
  - severity: medium
    issue: „Salbe ... zu holen“ statt „... zu bringen“.
    rationale: ἐνέγκαι bezeichnet das Herbeibringen/Bringen. „Holen“ verändert die Bewegungsrichtung und ist nicht vom griechischen Text gedeckt.
  revised_text: Denn als ich nach Sichem ging, um Salbe für die Herden zu bringen, und Ruben nach Dotan, wo sich unsere Vorräte und unser gesamter Lagerbestand befanden, verkaufte Juda, mein Bruder, ihn an die Ismaeliten, als er zu ihnen kam.
