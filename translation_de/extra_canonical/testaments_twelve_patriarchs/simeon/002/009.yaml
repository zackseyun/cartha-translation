base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/009.yaml
  text: For when I went to Shechem to bring ointment for our flocks, and Reuben to Dothan, where our supplies and all our stores were, Judah my brother sold him to the Ishmaelites.
translation:
  language: de
  text: Denn als ich nach Sichem ging, um Salbe für die Herden zu bringen, und Ruben nach Dotan, wo sich unsere Vorräte und unser gesamter Lagerbestand befanden, verkaufte Juda, mein Bruder, ihn an die Ismaeliten, als er zu ihnen kam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄλειμμα
  choice: Salbe
  rationale: Die Grundbedeutung ist ein Mittel zum Einreiben bzw. Salböl; „Salbe“ bewahrt die ungewöhnliche Ausdrucksweise des griechischen Textes, ohne eine nicht belegte konkrete Funktion festzulegen.
- source_word: τοῖς ποιμνίοις
  choice: für die Herden
  rationale: ποιμνίον bezeichnet eine Herde, besonders eine Schafherde; der Plural wird entsprechend wiedergegeben.
- source_word: τὰ ἐγχρῄζοντα ἡμῖν
  choice: unsere Vorräte
  rationale: Die substantivierte Wendung bezeichnet das, was benötigt oder gebraucht wird; „Vorräte“ passt zum Lagerkontext.
- source_word: πᾶσα ἡ ἀπόθεσις
  choice: unser gesamter Lagerbestand
  rationale: ἀπόθεσις bezeichnet hier das Gelagerte bzw. einen Vorrat; „Lagerbestand“ unterscheidet die Wendung von den unmittelbar zuvor genannten Bedarfsgütern.
- source_word: ἐλθὼν τοῖς Ἰσμαηλίταις
  choice: an die Ismaeliten, als diese vorbeikamen
  rationale: Der überlieferte griechische Wortlaut ist syntaktisch schwierig. Im Erzählzusammenhang wird das Partizip auf die Ankunft der Ismaeliten bezogen; „vorbeikamen“ gibt die Reisesituation natürlich wieder, ohne den Sinn der englischen Konsultationsfassung bloß zu übernehmen.
