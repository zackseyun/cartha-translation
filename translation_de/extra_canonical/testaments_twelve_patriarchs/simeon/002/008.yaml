base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/008.yaml
  text: But his God and the God of our fathers sent his angel and rescued him from my hands.
translation:
  language: de
  text: Aber sein Gott und der Gott unserer Väter sandte seinen Engel und rettete ihn aus meinen Händen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστειλε
  choice: sandte
  rationale: Gibt den Aorist von ἀποστέλλω knapp und natürlich wieder.
- source_word: ἄγγελον
  choice: Engel
  rationale: Im Zusammenhang bezeichnet ἄγγελος einen himmlischen Boten; „Engel“ ist die natürliche deutsche Entsprechung.
- source_word: ἐρρύσατο
  choice: rettete
  rationale: Bewahrt den Sinn einer wirksamen Befreiung aus unmittelbarer Gewalt, ohne die Aussage unnötig auszudeuten.
- source_word: ἐκ τῶν χειρῶν μου
  choice: aus meinen Händen
  rationale: Erhält das griechische Bild und bezeichnet zugleich die Befreiung aus der Gewalt des Sprechers.
theological_decisions:
- issue: Verhältnis zwischen „seinem Gott“ und „dem Gott unserer Väter“
  choice: Die doppelte Bezeichnung mit „und“ wird beibehalten.
  alternative: „Sein Gott, der Gott unserer Väter“
  rationale: Das griechische καί verbindet zwei Bezeichnungen; die Übersetzung bewahrt diese sprachliche Spannung, ohne ausdrücklich festzulegen, ob die zweite Bezeichnung appositionell zu verstehen ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; der knappe Satzbau und die Wiederholung von „Gott“ folgen bewusst dem griechischen Text.
