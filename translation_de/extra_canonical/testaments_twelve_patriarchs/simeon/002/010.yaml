source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ *ὁ Ῥουβὶμ ἀκούσας ταῦτα⁶⁴ ἐλυπήθη⁶⁵. ἤθελε⁶⁶ γὰρ αὐτὸν⁶⁷ ἀπαγαγεῖν⁶⁸ πρὸς τὸν πατέρα⁶⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002/010.yaml
  text: And Reuben, hearing these things, was grieved, for he wanted to bring him safely back to his father.
translation:
  language: de
  text: Als Ruben das hörte, wurde er traurig; denn er wollte ihn zu seinem Vater zurückbringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσας ταῦτα
  choice: als ... das hörte
  rationale: Das temporale Partizip wird in natürlichem modernem Deutsch als Nebensatz wiedergegeben; ταῦτα wird idiomatisch mit „das“ übersetzt.
- source_word: ἐλυπήθη
  choice: wurde er traurig
  rationale: Gibt die emotionale Bedeutung des passiven Aorists schlicht und verständlich wieder.
- source_word: ἀπαγαγεῖν πρὸς τὸν πατέρα
  choice: zu seinem Vater zurückbringen
  rationale: ἀπαγάγω bezeichnet hier das Weg- beziehungsweise Zurückführen zu einer Person. „Zurückbringen“ entspricht dem erzählerischen Zusammenhang; das Possessivpronomen gibt den Bezug des griechischen Artikels natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit natürlichem Satzbau. Das im englischen Konsultationstext enthaltene „safely“ wurde nicht ausdrücklich übernommen, da dafür im vorgelegten griechischen Wortlaut kein eigenes Äquivalent steht.
