id: T12P.SIM.9.1
reference: Testament of Simeon 9:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ ἔκλαυσαν¹ οἱ² *υἱοὶ Συμεὼν³ τὸν πατέρα αὐτῶν⁴. Καὶ ἦσαν *εἰς Αἴγυπτον⁵ ἕως ἡμέρας ἐξόδου αὐτῶν⁶ *ἐν χειρὶ Μωϋσῆ⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/009/001.yaml
  text: And the sons of Simeon wept for their father. And they were in Egypt until the day of their departure by the hand of Moses.
translation:
  language: de
  text: Und die Söhne Simeons beweinten ihren Vater. Sie waren in Ägypten bis zum Tag ihres Auszugs unter der Führung des Mose.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔκλαυσαν
  choice: beweinten
  rationale: Gibt das Trauern und Weinen um den verstorbenen Vater im Deutschen knapp und natürlich wieder.
- source_word: ἦσαν εἰς Αἴγυπτον
  choice: sie waren in Ägypten
  rationale: Folgt bewusst dem schlichten griechischen ἦσαν und fügt keine ausdrücklich nicht genannte Bedeutung wie „sie blieben“ hinzu.
- source_word: ἕως ἡμέρας ἐξόδου αὐτῶν
  choice: bis zum Tag ihres Auszugs
  rationale: Bewahrt die zeitliche Grenze sowie das Substantiv ἔξοδος, das hier den Auszug aus Ägypten bezeichnet.
- source_word: ἐν χειρὶ Μωϋσῆ
  choice: unter der Führung des Mose
  rationale: Gibt die semitisch geprägte Wendung „in/durch die Hand des Mose“ in verständlichem modernem Deutsch wieder, ohne Mose als eigentliche Ursache des Auszugs darzustellen.
theological_decisions:
- issue: Vermittelte Handlung beim Auszug
  choice: unter der Führung des Mose
  alternative: durch die Hand des Mose
  rationale: Die natürliche deutsche Formulierung wahrt Moses vermittelnde beziehungsweise leitende Rolle, ohne die ungewohnte Metapher überzubetonen oder eine weitergehende theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der zweite Satz hält sich eng an die einfache Aussage des griechischen ἦσαν; nur die idiomatische Wendung ἐν χειρὶ wird für heutige Leser natürlich wiedergegeben.
