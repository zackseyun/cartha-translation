  to: '**Testament Simeons 7**


    **1** Und nun, meine Kinder, hört auf Levi und Juda. Erhebt euch nicht über diese beiden Stämme; denn aus ihnen wird für uns die Rettung Gottes aufgehen. **2** Denn der Herr wird aus Levi einen als Hohepriester und aus Juda einen als König erwecken – [Gott und Mensch][a]. Dieser wird [alle Völker und][b] das Geschlecht Israels[c] retten. **3** Darum gebiete ich euch dies, damit auch ihr euren Kindern gebietet, diese Weisungen durch alle ihre Generationen hindurch zu bewahren.'
