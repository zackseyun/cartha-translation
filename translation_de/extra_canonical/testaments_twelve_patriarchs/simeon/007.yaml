base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/007.yaml
  text: And now[[God and man]], my children, listen to Levi and to Judah, and do not exalt yourselves over these two tribes, because from them the salvation of God will arise for us. For the Lord will raise up from Levi as a high priest, and from Judah as a king, [God and man]; he will save [all the nations and] the race of Israel[[all the nations and]]. Therefore I command these things to you, so that you also may command your children[the race of Israel], that they may keep them throughout their generations.
translation:
  language: de
  text: '**Testament Simeons 7**


    **1** Und nun, meine Kinder, hört auf Levi und Juda. Erhebt euch nicht über diese beiden Stämme; denn aus ihnen wird für uns die Rettung Gottes aufgehen. **2** Denn der Herr wird aus Levi einen als Hohepriester und aus Juda einen als König erwecken – [Gott und Mensch][a]. Dieser wird [alle Völker und][b] das Geschlecht Israels[c] retten. **3** Darum gebiete ich euch dies, damit auch ihr euren Kindern gebietet, diese Weisungen durch alle ihre Generationen hindurch zu bewahren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Vorlage kennzeichnet „Gott und Mensch“ als textlich unsicher; die Worte könnten eine spätere Erweiterung sein.
    reason: textual_variant
  - marker: b
    text: Die griechische Vorlage kennzeichnet „alle Völker und“ als textlich unsicher; die Worte könnten eine spätere Erweiterung sein.
    reason: textual_variant
  - marker: c
    text: 'Oder: „das Volk Israel“. Das griechische γένος betont gemeinsame Herkunft oder Abstammung.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἐπακούσατε
  choice: hört auf
  rationale: Die Wendung verbindet aufmerksames Hören mit der Bereitschaft, dem Gehörten zu folgen, ohne den Sinn so stark wie „gehorcht“ festzulegen.
- source_word: μὴ ἐπαίρεσθε ἐπὶ
  choice: erhebt euch nicht über
  rationale: Die Form bezeichnet Selbsterhöhung; mit „über“ bleibt die gegen Levi und Juda gerichtete vergleichende Überheblichkeit erhalten.
- source_word: γενεὰς
  choice: Stämme
  rationale: Im unmittelbaren Bezug auf Levi und Juda sind nicht zeitliche Generationen, sondern israelitische Abstammungsgruppen gemeint.
- source_word: ἀνατελεῖ
  choice: wird … aufgehen
  rationale: „Aufgehen“ bewahrt das bildhafte, prophetische Verb und lässt offen, ob Gottes Rettung als rettendes Handeln oder in einer Person erscheint.
- source_word: τὸ σωτήριον τοῦ Θεοῦ
  choice: die Rettung Gottes
  rationale: Die formelle Genitivverbindung bleibt erhalten und legt nicht fest, ob Gott der Urheber ist oder die Rettung näher bestimmt wird.
- source_word: ἀναστήσει
  choice: wird … erwecken
  rationale: „Erwecken“ entspricht dem prophetischen Sprachgebrauch für Gottes Hervorbringen einer beauftragten Gestalt und vermeidet eine bloß administrative Deutung wie „einsetzen“.
- source_word: ἀρχιερέα
  choice: Hohepriester
  rationale: Dies ist die geläufige und kultisch genaue Bezeichnung des Amtes.
- source_word: βασιλέα
  choice: König
  rationale: Der konkrete königliche Titel wird beibehalten und nicht zum allgemeineren „Herrscher“ abgeschwächt.
- source_word: σώσει
  choice: wird … retten
  rationale: Die Wortwahl hält die inhaltliche Verbindung zu „Rettung“ in Vers 1 sichtbar.
- source_word: τὸ γένος τοῦ Ἰσραήλ
  choice: das Geschlecht Israels
  rationale: „Geschlecht“ bewahrt den Gedanken gemeinsamer Herkunft und Abstammung; eine Fußnote nennt die im heutigen Deutsch oft leichter verständliche Alternative.
- source_word: φυλάξωσιν
  choice: daran … festhalten
  rationale: Im Zusammenhang mit weitergegebenen Geboten meint das Verb deren Bewahrung und Befolgung. Die Formulierung ist im modernen Deutsch natürlicher als eine wörtliche Wiederholung mehrerer Pronomen.
theological_decisions:
- issue: Eingeklammerte Wendung Θεὸν καὶ ἄνθρωπον
  choice: Als „[Gott und Mensch]“ im Haupttext beibehalten und durch Fußnote [a] als textlich unsicher gekennzeichnet.
  alternative: Die vermutlich sekundäre Wendung auslassen oder deutend mit „göttlich und menschlich“ wiedergeben.
  rationale: Die vorgelegte griechische Ausgabe setzt die Wendung in Klammern. Die wörtliche Wiedergabe zeigt die Überlieferung transparent, ohne ihre christologische Aussage zu glätten oder als sicher ursprünglichen Text auszugeben.
- issue: Eingeklammerte Wendung πάντα τὰ ἔθνη
  choice: Als „[alle Völker und]“ im Haupttext beibehalten und durch Fußnote [b] als textlich unsicher gekennzeichnet.
  alternative: Die Wendung als sekundären Zusatz auslassen oder ἔθνη mit „Heiden“ wiedergeben.
  rationale: Die eckigen Klammern spiegeln die Unsicherheit der Vorlage. „Völker“ wahrt den möglichen universalen Umfang, ohne vorschnell einen Gegensatz zwischen Israel und den Heiden festzulegen.
- issue: Zusammengedrängte priesterliche und königliche Aussage in Vers 2
  choice: Die auffällige Konstruktion mit Levi als Hohepriester, Juda als König und anschließendem Singular „Dieser“ möglichst eng beibehalten.
  alternative: Eindeutig zwei Gestalten formulieren oder beide Ämter ausdrücklich einer einzigen Gestalt zuschreiben.
  rationale: Der griechische Wortlaut ist syntaktisch gedrängt und theologisch spannungsvoll. Die Übersetzung entscheidet nicht stillschweigend, ob eine oder zwei Gestalten gemeint sind.
translation_notes:
  register: Moderne, würdige Standardsprache mit prophetischem Klang. „Aufgehen“, „erwecken“ und „Geschlecht Israels“ halten die Bildhaftigkeit und den Abstammungsbezug des Griechischen fest; Fußnoten erläutern textliche Unsicherheiten und eine zeitgemäßere lexikalische Alternative. Die Verszählung wurde zur Lesbarkeit sichtbar gemacht.
