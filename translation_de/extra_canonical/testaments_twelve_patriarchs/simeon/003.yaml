  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003.yaml
  text: And now[a], my children, hear me, and guard yourselves from the spirit of deceit and envy. For envy masters a man's whole mind, and does not allow him either to eat or to drink or to do anything good. But it is always urging him to kill the one envied; and while the one envied is always flourishing, the one who envies wastes away[b]. For two years, then, in the fear of the Lord I afflicted my soul with fasting, and I learned that release from envy comes through the fear of God. For if anyone flees for refuge to the Lord, the evil spirit runs away from him, and his mind becomes light. And from then on he has compassion on the one envied, and forgives those who love him[c], and so he ceases from envy.
translation:
  language: de
  text: '**Testament Simeons 3**


    **1** Und nun, meine Kinder, hört auf mich und hütet euch vor dem Geist der Täuschung[a] und des Neides. **2** Denn der Neid beherrscht das ganze Denken eines Menschen und lässt ihn weder essen noch trinken noch etwas Gutes tun. **3** Vielmehr treibt er ihn ständig dazu, den Beneideten zu töten. Während der Beneidete immer aufblüht, verwelkt der Neidende[b]. **4** Zwei Jahre lang kasteite ich daher in der Furcht des Herrn meine Seele durch Fasten. Dabei erkannte ich, dass die Befreiung vom Neid durch die Furcht Gottes kommt. **5** Denn wenn jemand beim Herrn Zuflucht sucht, flieht der böse Geist von ihm, und sein Denken wird unbeschwert. **6** Von da an empfindet er Mitgefühl mit dem Beneideten und vergibt denen, die ihn lieben[c]; so hört er auf zu neiden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder „Geist des Irrtums“ beziehungsweise „Geist der Verirrung“. Das griechische πλάνη kann sowohl Täuschung als auch das Abirren in einen Irrtum bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich stehen einander „der Beneidete“ und „der Neidende“ gegenüber. Das Griechische hebt den Gegensatz zwischen dem Ziel des Neides und dem neidischen Menschen scharf hervor.
    reason: lexical_alternative
  - marker: c
    text: „Die ihn lieben“ kann sich entweder auf den zuvor Beneideten oder auf den Menschen beziehen, der vom Neid geheilt wird. Das knappe griechische Pronomen lässt den Bezug offen.
    reason: alternative_reading
lexical_decisions:
- source_word: φυλάξασθε
  choice: hütet euch
  rationale: Der mediale Imperativ hat reflexive Bedeutung und ruft zu wachsamer Selbstbewahrung auf; „hütet euch“ ist im Deutschen natürlich und würdevoll.
- source_word: πνεῦμα τῆς πλάνης
  choice: Geist der Täuschung
  rationale: πλάνη kann Täuschung, Irrtum oder Verirrung bezeichnen. „Täuschung“ gibt hier die moralisch irreführende Macht wieder, ohne die anderen Bedeutungsnuancen zu verschweigen.
- source_word: φθόνος
  choice: Neid
  rationale: Das Wort bezeichnet den feindseligen Unwillen über das Gute eines anderen. „Neid“ trifft das durchgehende Lasterthema genauer als „Eifersucht“.
- source_word: κυριεύει πάσης τῆς διανοίας
  choice: beherrscht das ganze Denken eines Menschen
  rationale: κυριεύει drückt Herrschaft aus; διάνοια bezeichnet hier die Denk- und Sinneswelt. Die Formulierung bewahrt sowohl die Dominanz als auch die umfassende Wirkung.
- source_word: ὑποβάλλει
  choice: treibt ihn ständig dazu
  rationale: Das Verb bezeichnet ein Einflüstern, Anstiften oder inneres Antreiben. Die deutsche Wendung gibt den fortdauernden Zwang verständlich wieder.
- source_word: ἀνελεῖν
  choice: zu töten
  rationale: Der Infinitiv bezeichnet hier eine gewaltsame Beseitigung. „Töten“ bewahrt die Härte der Aussage.
- source_word: ἀνθεῖ / μαραίνεται
  choice: aufblüht / verwelkt
  rationale: Das zusammengehörige Pflanzenbild und der scharfe Gegensatz zwischen dem Beneideten und dem Neidenden bleiben erhalten.
- source_word: ἐκάκωσα τὴν ψυχήν μου ἐν νηστείᾳ
  choice: quälte ich ... meine Seele durch Fasten
  rationale: Die Wendung beschreibt eine strenge asketische Selbstkasteiung. „Quälte“ bewahrt die Schärfe von ἐκάκωσα; „durch Fasten“ gibt den instrumentalen Sinn wieder.
- source_word: λύσις τοῦ φθόνου
  choice: Befreiung vom Neid
  rationale: λύσις bezeichnet Lösung oder Freisetzung. „Befreiung“ lässt das Bild einer bindenden Macht erkennen und klingt zugleich natürlich.
- source_word: καταφύγῃ
  choice: Zuflucht sucht
  rationale: Das Verb bedeutet, schutzsuchend zu jemandem zu fliehen. Die gewählte Wendung erhält das Zufluchtsmotiv ohne unnötige Schwerfälligkeit.
- source_word: γίνεται ἡ διάνοια κούφη
  choice: sein Denken wird unbeschwert
  rationale: κούφη bedeutet wörtlich „leicht“. „Unbeschwert“ macht im Deutschen verständlich, dass das vom Neid belastete Denken erleichtert wird, und bewahrt zugleich das Gewichtsbild.
- source_word: συμπαθεῖ
  choice: empfindet ... Mitgefühl
  rationale: Das Verb bezeichnet ein Mitfühlen oder Anteilnehmen. „Mitgefühl empfinden“ ist gegenwärtiges, klares Deutsch.
- source_word: παύεται τοῦ φθόνου
  choice: hört er auf zu neiden
  rationale: Die Konstruktion bezeichnet das Aufhören mit dem Neid. Die verbale deutsche Form ist natürlich und hält die handelnde Person im Blick.
theological_decisions:
- issue: Wiedergabe von κύριος und θεός
  choice: der Herr / Gott
  alternative: der HERR / Gott
  rationale: Der griechische Text verwendet κύριος und θεός kurz nacheinander, ohne hier ausdrücklich ein hebräisches Tetragramm-Zitat wiederzugeben. Daher wird κύριος als „der Herr“ übersetzt.
- issue: Personale oder metaphorische Deutung von τὸ πονηρὸν πνεῦμα
  choice: der böse Geist
  alternative: ein böser Geist; der böse Antrieb
  rationale: Der Artikel legt eine bestimmte Bezeichnung nahe, und der Text stellt das Böse als handelnde geistige Macht dar. Die Übersetzung bewahrt diese theologische Spannung, statt sie auf reine Psychologie zu reduzieren.
- issue: Zusammenspiel von Gottesfurcht, Zuflucht und Befreiung vom Neid
  choice: kausale Aussagen des Textes unverändert bewahren
  alternative: die Aussagen als bloße moralische Selbstdisziplin erklären
  rationale: Der Abschnitt verbindet Fasten mit Erkenntnis, führt die Befreiung selbst aber auf Gottesfurcht und Zuflucht beim Herrn zurück. Diese Spannung zwischen asketischer Praxis und göttlicher Befreiung wird nicht eingeebnet.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Ermahnungsstil. Die wiederholten Schlüsselwörter „Neid“, „Beneideter“ und „Neidender“ halten die gedankliche Linie des griechischen Textes sichtbar. Bildhafte Gegensätze wie „aufblühen/verwelken“ und „belastet/unbeschwert“ werden bewahrt; ungebräuchliche Wörtlichkeit wird nur dort geglättet, wo sie im Deutschen den Sinn verdunkeln würde.
