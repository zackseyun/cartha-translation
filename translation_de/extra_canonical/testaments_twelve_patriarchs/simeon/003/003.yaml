base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/003.yaml
  text: But it always urges him to kill the one envied; and the one envied always flourishes, while the one who envies wastes away.
translation:
  language: de
  text: Doch stets stachelt er dazu an, den Beneideten zu töten; und der Beneidete blüht stets, während der Neidende verwelkt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποβάλλει
  choice: treibt er dazu
  rationale: Das Verb bezeichnet hier ein Einflüstern oder Antreiben zu einer Tat. Die Formulierung gibt den wirksamen inneren Anstoß in natürlichem Deutsch wieder; das grammatische Subjekt wird entsprechend dem vorausgehenden Kontext männlich aufgenommen.
- source_word: ἀνελεῖν
  choice: zu töten
  rationale: Im gegebenen Zusammenhang bedeutet der Aoristinfinitiv eindeutig, jemanden umzubringen bzw. zu töten.
- source_word: τὸν φθονούμενον
  choice: den Beneideten
  rationale: Die substantivierte Passivform bezeichnet den Menschen, der Gegenstand des Neides ist.
- source_word: ἀνθεῖ
  choice: blüht ... auf
  rationale: Bewahrt das anschauliche Bild des Blühens und bildet einen klaren Gegensatz zu μαραίνεται.
- source_word: ὁ φθονῶν
  choice: der Neidende
  rationale: Die substantivierte aktive Partizipialform wird knapp und parallel zu »der Beneidete« wiedergegeben.
- source_word: μαραίνεται
  choice: dahinschwindet
  rationale: Das Verb bedeutet wörtlich verwelken; auf eine Person bezogen vermittelt »dahinschwinden« den körperlich-seelischen Verfall natürlich und wahrt den Bildkontrast zum Aufblühen.
theological_decisions:
- issue: Unausgesprochenes Subjekt von ὑποβάλλει
  choice: »er« ohne erklärende Identifizierung
  alternative: »es« oder ausdrückliche Wiederholung von »der Geist des Neides«
  rationale: Das griechische Verb enthält ein singularisches Subjekt, dessen Bezug aus dem vorherigen Vers zu erschließen ist. Die Übersetzung bewahrt diesen Kontextbezug, ohne hier eine im Vers selbst nicht wiederholte Deutung einzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen substantivierten Bezeichnungen »der Beneidete« und »der Neidende« sowie der Gegensatz »blüht auf / schwindet dahin« erhalten Struktur und Bildlichkeit des griechischen Satzes.
