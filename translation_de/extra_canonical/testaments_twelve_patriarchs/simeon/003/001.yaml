source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Καὶ νῦν, τέκνα¹ μου² Γἀκούσατέ μου καὶ¹³ φυλάξασθε⁴ ἀπὸ *τοῦ πνεύματος⁵ τῆς πλάνης καὶ τοῦ φθόνου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/001.yaml
  text: And now, my children, hear me and guard yourselves against the spirit of deceit and envy.
translation:
  language: de
  text: Und nun, meine Kinder, hört auf mich und hütet euch vor dem Geist der Täuschung und des Neides.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκούσατέ μου
  choice: hört auf mich
  rationale: Die Verbindung aus ἀκούω und Genitiv bezeichnet hier nicht nur akustisches Hören, sondern aufmerksames bzw. gehorsames Anhören; „hört auf mich“ ist natürliches modernes Deutsch.
- source_word: φυλάξασθε ἀπό
  choice: hütet euch vor
  rationale: Die mediale Imperativform mit ἀπό fordert dazu auf, sich vor einer Gefahr zu schützen; „hütet euch vor“ bewahrt Aufforderung und Warncharakter.
- source_word: πνεύματος τῆς πλάνης
  choice: Geist der Täuschung
  rationale: Die formale Genitivverbindung bleibt erhalten. πλάνη kann Irrtum, Verführung oder Täuschung bezeichnen; im Zusammenhang mit einem schädlichen Geist gibt „Täuschung“ die aktive wie irreführende Dimension knapp wieder.
- source_word: φθόνου
  choice: Neides
  rationale: „Neid“ ist die direkte und im Deutschen natürliche Entsprechung von φθόνος.
theological_decisions:
- issue: Personalisierung des „Geistes“
  choice: Die Wendung „Geist der Täuschung und des Neides“ bleibt ohne nähere Bestimmung stehen.
  alternative: „eine Haltung der Täuschung und des Neides“ oder „der böse Geist der Täuschung und des Neides“
  rationale: Der griechische Text entscheidet nicht ausdrücklich, ob πνεῦμα ein personales Geistwesen oder eine wirksame innere Haltung bezeichnet. Weder Entpersonalisierung noch die Ergänzung „böse“ soll diese Spannung auflösen.
- issue: Zuordnung des Genitivs
  choice: „der Täuschung und des Neides“ wird als gemeinsame Bestimmung zu „Geist“ wiedergegeben.
  alternative: „vor dem Geist der Täuschung und vor dem Neid“
  rationale: Die griechische Koordination τοῦ πνεύματος τῆς πλάνης καὶ τοῦ φθόνου lässt syntaktisch eine gewisse Spannung erkennen. Die gewählte Fassung folgt der naheliegenden inhaltlichen Bündelung der beiden Laster, ohne zusätzliche Erklärung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte väterliche Anrede und der imperativische Warnstil bleiben erhalten; unnötig altertümliche Formulierungen werden vermieden.
