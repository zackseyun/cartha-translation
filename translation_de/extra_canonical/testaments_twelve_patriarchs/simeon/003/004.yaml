  source_fidelity: 'Die Übersetzung gibt die Satzglieder und den Sinn des griechischen Textes eng wieder: die zweijährige asketische Praxis, das Quälen der eigenen Seele durch Fasten sowie die Erkenntnis, dass λύσις des Neides durch Gottesfurcht geschieht. Die Unterscheidung zwischen »Furcht vor dem Herrn« und »Gottesfurcht« entspricht den beiden Formulierungen φόβῳ κυρίου und φόβου θεοῦ, ohne eine sachlich nicht erforderliche Bedeutungsdifferenz zu behaupten.'
  naturalness: Der Satz ist in modernem, würdigem Standarddeutsch verständlich. »In Furcht vor dem Herrn« und die sachliche Formulierung »die Befreiung vom Neid ... geschieht« sind leicht gehoben, aber für einen antiken testamentarischen Mahntext angemessen und nicht unnatürlich.
  terminology: »Meine Seele«, »Fasten«, »Befreiung vom Neid« und »Gottesfurcht« sind treffende, registergerechte Wiedergaben. »Quälte ich meine Seele« wahrt die bewusst starke Selbstkasteiungs-Sprache von ἐκάκωσα, ohne deren Bild abzuschwächen. Es sind keine Fußnotenanker oder textkritisch erforderlichen Erläuterungen vorhanden.
