id: T12P.SIM.3.4
reference: Testament of Simeon 3:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Δύο Γοὖν¹¹³ ἔτη¹⁴ *ἐν φόβῳ κυρίου¹⁵ ἐκάκωσα *τὴν ψυχήν μου ἐν νηστείᾳ¹⁶, καὶ ἔγνων ὅτι ἡ¹⁷ λύσις τοῦ φθόνου διὰ φόβου¹⁸ θεοῦ¹⁹ γίνεται²⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/004.yaml
  text: For two years, then, in fear of the Lord I afflicted my soul with fasting, and I learned that the release from envy comes through fear of God.
translation:
  language: de
  text: Zwei Jahre lang quälte ich also in Furcht vor dem Herrn meine Seele durch Fasten, und ich erkannte, dass die Befreiung vom Neid durch Gottesfurcht geschieht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάκωσα τὴν ψυχήν μου
  choice: quälte ich meine Seele
  rationale: Gibt die starke, wörtlich auf das Zufügen von Leid zielende Wendung wieder und bewahrt den traditionellen anthropologischen Ausdruck »meine Seele«.
- source_word: ἐν νηστείᾳ
  choice: durch Fasten
  rationale: Das griechische ἐν bezeichnet hier das Mittel der Selbstkasteiung; »durch Fasten« ist im Deutschen klar und natürlich.
- source_word: ἡ λύσις τοῦ φθόνου
  choice: die Befreiung vom Neid
  rationale: λύσις bezeichnet ein Lösen oder Freikommen; »Befreiung vom Neid« wahrt das Bild, ohne eine bloße Abschwächung des Neids auszudrücken.
- source_word: φόβος κυρίου / φόβος θεοῦ
  choice: Furcht vor dem Herrn / Gottesfurcht
  rationale: Bewahrt beide griechischen Bezeichnungen und gibt φόβος in seinem religiös-ethischen Sinn mit dem etablierten, würdevollen Ausdruck »Furcht« wieder.
- source_word: γίνεται
  choice: geschieht
  rationale: Entspricht dem offenen Vorgangscharakter des griechischen Verbs und vermeidet eine überdeutende kausale Formulierung.
theological_decisions:
- issue: Bedeutung der Gottesfurcht
  choice: Furcht vor dem Herrn / Gottesfurcht
  alternative: Ehrfurcht vor dem Herrn / Ehrfurcht vor Gott
  rationale: »Furcht« bewahrt die semantische Spannung von φόβος zwischen Scheu, Ehrfurcht und Furcht, statt sie einseitig abzumildern.
- issue: Verhältnis von Fasten und Befreiung vom Neid
  choice: Die Satzstruktur lässt Fasten als Simeons Praxis und Gottesfurcht als Weg der Befreiung stehen.
  alternative: Fasten ausdrücklich als Ursache der Befreiung darstellen
  rationale: Der griechische Text nennt die Gottesfurcht, nicht unmittelbar das Fasten, als das, wodurch die Befreiung vom Neid geschieht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Syntax und Bildwelt. »Quälte« ist bewusst kräftig gewählt; »Gottesfurcht« ist ein verständlicher, etablierter religiöser Begriff.
