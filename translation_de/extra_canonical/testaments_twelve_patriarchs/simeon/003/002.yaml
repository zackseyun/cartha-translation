  source_fidelity: Die Übersetzung gibt φθόνος zutreffend mit „Neid“ wieder und bewahrt die starke Herrschaftsmetapher von κυριεύει („beherrscht“). „das ganze Denken eines Menschen“ bildet πάσης τῆς διανοίας τοῦ ἀνθρώπου umfassend und ohne unzulässige Einengung ab. Die dreigliedrige Folge „weder essen noch trinken noch etwas Gutes tun“ folgt dem griechischen Wortlaut und Sinn. Die im Editionszitat sichtbaren hochgestellten Ziffern bzw. Zeichen sind apparatkritische Verweise; da keine zugehörigen Anmerkungstexte vorliegen, sind keine Fußnotenanker in den Zieltext zu übernehmen oder zu erfinden.
  naturalness: Der Satz ist idiomatisches modernes Standarddeutsch, klar und knapp. Die generische Formulierung „eines Menschen“ ist sachlich und natürlich; die Personifikation des Neids bleibt verständlich.
  terminology: „Neid“ ist für φθόνος im vorliegenden ethischen Kontext die naheliegende Entsprechung. „Beherrscht“ gibt die Intensität von κυριεύει angemessen wieder. „etwas Gutes tun“ entspricht ποιῆσαί τι ἀγαθόν und wahrt dessen allgemeine, nicht technisch-theologische Aussage.
