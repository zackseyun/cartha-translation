base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/002.yaml
  text: For envy masters the whole mind of a person, and does not allow him either to eat or to drink or to do anything good.
translation:
  language: de
  text: Denn der Neid beherrscht das ganze Denken eines Menschen und lässt ihn weder essen noch trinken noch etwas Gutes tun.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φθόνος
  choice: Neid
  rationale: Die direkte und im Kontext natürliche Entsprechung; bezeichnet die beherrschende neidische Haltung.
- source_word: κυριεύει
  choice: beherrscht
  rationale: Gibt das Bild des Herrschens bzw. der Machtausübung idiomatisch und mit der Stärke des griechischen Verbs wieder.
- source_word: πάσης τῆς διανοίας τοῦ ἀνθρώπου
  choice: das ganze Denken eines Menschen
  rationale: Bewahrt den umfassenden Sinn von πάσης und gibt διάνοια als inneres Denken bzw. geistige Ausrichtung wieder; der generische Mensch wird im modernen Deutsch natürlich mit „eines Menschen“ ausgedrückt.
- source_word: οὐκ ἀφίησιν αὐτόν
  choice: lässt ihn … nicht
  rationale: Entspricht der kausativen Bedeutung „erlaubt ihm nicht“ in natürlichem Deutsch.
- source_word: οὔτε φαγεῖν, οὔτε πιεῖν, οὔτε ποιῆσαί τι ἀγαθόν
  choice: weder essen noch trinken noch etwas Gutes tun
  rationale: Erhält die dreigliedrige Verneinung und die Reihenfolge des griechischen Textes.
