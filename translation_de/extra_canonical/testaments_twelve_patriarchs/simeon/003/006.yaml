base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/006.yaml
  text: And from then on he has compassion for the one envied, and forgives those who love him, and so he ceases from envy.
translation:
  language: de
  text: Und von da an hat er Mitgefühl mit dem, der beneidet wird, und verzeiht denen, die ihn lieben, und so hört er auf zu neiden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λοιπόν
  choice: von da an
  rationale: Bezeichnet hier den anschließenden Zustand beziehungsweise Verlauf und entspricht im Deutschen natürlich dem zeitlichen Übergang.
- source_word: συμπαθεῖ τῷ φθονουμένῳ
  choice: hat Mitgefühl mit dem, der beneidet wird
  rationale: Gibt das Verb mit Dativ sowie das substantivierte passive Partizip präzise und verständlich wieder.
- source_word: συγγινώσκει
  choice: verzeiht
  rationale: Das Verb kann je nach Kontext Verständnis beziehungsweise Nachsicht bezeichnen; hier passt aufgrund der betroffenen Personen und der Überwindung des Neids am besten die konkrete Wiedergabe „verzeiht“.
- source_word: παύεται τοῦ φθόνου
  choice: hört er auf zu neiden
  rationale: Überträgt die Genitivkonstruktion idiomatisch und bewahrt den Bezug auf die ausgeübte Haltung des Neidens.
theological_decisions:
- issue: Bezugswort von αὐτόν in τοῖς ἀγαπῶσιν αὐτόν
  choice: „ihn“ bleibt ohne erklärende Auflösung stehen
  alternative: Den Bezug ausdrücklich auf den Beneideten oder den Neidenden festlegen
  rationale: Das griechische Pronomen ist grammatisch mehrdeutig; die Übersetzung bewahrt diese echte Unbestimmtheit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton; die parallele Satzstruktur des Griechischen bleibt erhalten.
