id: T12P.SIM.3.5
reference: Testament of Simeon 3:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἐὰν γάρ²¹ τις ἐπὶ Κύριον καταφύγῃ, *ἀποτρέχει τὸ πονηρὸν πνεῦμα ἀπʼ αὐτοῦ²², καὶ γίνεται ἡ διάνοια²³ κούφη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/003/005.yaml
  text: For if anyone takes refuge in the Lord, the evil spirit runs away from him, and the mind becomes light.
translation:
  language: de
  text: Denn wenn jemand beim Herrn Zuflucht sucht, flieht der böse Geist von ihm, und das Denken wird unbeschwert.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ Κύριον καταφύγῃ
  choice: beim Herrn Zuflucht sucht
  rationale: Gibt die Schutzsuche bei dem Herrn natürlich und präzise wieder; der Konjunktiv in der allgemeinen Bedingung wird im Deutschen idiomatisch mit Präsens ausgedrückt.
- source_word: ἀποτρέχει
  choice: flieht … von ihm
  rationale: Bewahrt die kräftige Bewegungsmetapher des griechischen Verbs und gibt ἀπʼ αὐτοῦ als Entfernung von der Person wieder.
- source_word: τὸ πονηρὸν πνεῦμα
  choice: der böse Geist
  rationale: Direkte, theologisch offene Entsprechung, ohne die Wendung psychologisch oder dämonologisch weiter festzulegen.
- source_word: ἡ διάνοια
  choice: das Denken
  rationale: Bezeichnet hier das innere Denk- und Wahrnehmungsvermögen; „Denken“ ist im modernen Deutsch verständlich und vermeidet die mögliche Verengung von „Sinn“.
- source_word: κούφη
  choice: unbeschwert
  rationale: Gibt die Grundvorstellung von Leichtigkeit im übertragenen Sinn natürlich wieder, ohne sie als bloße geistige Mühelosigkeit misszuverstehen.
theological_decisions:
- issue: Bezug des bestimmten Ausdrucks ἡ διάνοια
  choice: „das Denken“ ohne hinzugefügtes Possessivpronomen
  alternative: „sein Denken“
  rationale: Der griechische Text hat kein ausdrückliches Possessivpronomen. Der Zusammenhang legt zwar das Denken der betreffenden Person nahe, doch die allgemein formulierte Aussage bleibt in der Übersetzung erhalten.
- issue: Deutung von κούφη
  choice: „unbeschwert“
  alternative: „leicht“
  rationale: „Leicht“ wäre formal näher, ist im Deutschen aber mehrdeutig und könnte „einfach“ oder „oberflächlich“ bedeuten. „Unbeschwert“ wahrt den positiven Gegensatz zur belastenden Wirkung des bösen Geistes.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Griechischen, während „beim Herrn Zuflucht suchen“ und „unbeschwert werden“ natürlich verständlich sind.
