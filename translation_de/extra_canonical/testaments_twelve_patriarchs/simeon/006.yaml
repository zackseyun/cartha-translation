base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/006.yaml
  text: '1 Behold, I have told you everything, so that I may be cleared from your sin. 2 But if you remove from yourselves envy and every hardness of heart, my bones will blossom like a rose in Israel, and my flesh like a lily in Jacob; and my fragrance will be like the fragrance of Lebanon. Holy ones will be multiplied from me forever and ever, and their branches will extend far away.


    3 Then the seed of Canaan will perish, and no remnant will remain for Amalek; all the Cappadocians will perish, and all the Hittites will be utterly destroyed. 4 Then the land of Ham will fail, and every people will perish. Then all the earth will cease from turmoil, and all that is under heaven from war.


    5 Then a great sign will be glorified for Israel, because the Lord God, appearing on the earth, will come and save Adam in him. 6 Then all the spirits of deceit will be given over to be trampled down, and men will rule over the evil spirits. 7 Then I also will arise in gladness, and I will bless the Most High for his wonders.'
translation:
  language: de
  text: '**Testament Simeons 6**


    **1** Seht, ich habe euch alles gesagt, damit ich von eurer Sünde freigesprochen werde. **2** Wenn ihr aber den Neid und jede Herzenshärte von euch entfernt, werden meine Gebeine wie eine Rose in Israel erblühen und mein Fleisch wie eine Lilie in Jakob. Mein Duft wird wie der Duft des Libanon sein. Aus mir werden Heilige für immer und ewig zahlreich werden, und ihre Zweige werden weit reichen.


    **3** Dann wird die Nachkommenschaft Kanaans untergehen, und in Amalek wird kein Rest mehr bleiben. Alle Kappadokier werden umkommen, und alle Hetiter werden völlig vernichtet werden. **4** Dann wird das Land Hams vergehen, und das ganze Volk wird umkommen. Dann wird die ganze Erde von Unruhe und alles unter dem Himmel vom Krieg zur Ruhe kommen.


    **5** Dann wird ein großes Zeichen für Israel verherrlicht werden.[a] **6** Dann werden alle Geister der Verführung zum Zertreten preisgegeben, und die Menschen werden über die bösen Geister herrschen. **7** Dann werde auch ich voller Freude auferstehen und den Höchsten wegen seiner Wundertaten preisen, denn Gott nahm einen Leib an, aß mit Menschen und rettete Menschen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Wortlaut dieses Satzes ist textkritisch unsicher; die Edition kennzeichnet insbesondere „Zeichen“. Der in manchen Fassungen folgende Satz über das Erscheinen des Herrn auf Erden und die Rettung Adams steht nicht im hier vorgelegten griechischen Text.
    reason: Kennzeichnet sowohl die Unsicherheit bei σημεῖον als auch die erhebliche Differenz zwischen der griechischen Ausgangsvorlage und der englischen Konsultationsfassung.
  - marker: b
    text: Der Satz „denn Gott nahm einen Leib an …“ steht in der griechischen Edition in eckigen Klammern und ist daher möglicherweise ein späterer Zusatz oder anderweitig textkritisch unsicher.
    reason: Macht den von der Edition signalisierten unsicheren Überlieferungsstatus transparent, ohne den Satz stillschweigend zu streichen.
lexical_decisions:
- source_word: δικαιωθῶ ἀπὸ τῆς ἁμαρτίας ὑμῶν
  choice: damit ich von eurer Sünde freigesprochen werde
  rationale: Bewahrt die forensische Bedeutung von δικαιόω und die ungewöhnliche Verbindung mit ἀπό, ohne die Aussage in eine bloße persönliche Rechtfertigung umzudeuten.
- source_word: φθόνον
  choice: Neid
  rationale: Entspricht der üblichen Bedeutung des griechischen Wortes und passt zur ethischen Mahnung.
- source_word: σκληροκαρδίαν
  choice: Herzenshärte
  rationale: Eine natürliche deutsche Wiedergabe, die das bildhafte Element des griechischen Kompositums erhält.
- source_word: ἅγιοι
  choice: Heilige
  rationale: Lässt offen, ob besonders geheiligte Nachkommen oder die Angehörigen einer endzeitlichen Gemeinschaft gemeint sind.
- source_word: σπέρμα Χαναάν
  choice: Nachkommenschaft Kanaans
  rationale: σπέρμα bezeichnet hier im genealogisch-völkischen Zusammenhang die Nachkommenschaft, nicht wörtlich Saatgut.
- source_word: πᾶς ὁ λαός
  choice: das ganze Volk
  rationale: Der Singular mit Artikel bezeichnet eher das gesamte betreffende Volk als distributiv jedes einzelne Volk.
- source_word: πνεύματα τῆς πλάνης
  choice: Geister der Verführung
  rationale: πλάνη kann Irrtum, Täuschung oder Verführung bezeichnen; im Zusammenhang handelnder böser Geister ist „Verführung“ idiomatisch und wahrt die aktive Dimension.
- source_word: εὐλογήσω
  choice: preisen
  rationale: Beim Lob Gottes ist „preisen“ im modernen Deutschen natürlicher als das missverständliche „segnen“, ohne den Sinn von εὐλογέω abzuschwächen.
- source_word: συνεσθίων ἀνθρώποις
  choice: aß mit Menschen
  rationale: Gibt das Partizip konkret wieder und vermeidet eine unnötig kirchensprachliche Formulierung.
theological_decisions:
- issue: Bezug der Freisprechung in Vers 1
  choice: „von eurer Sünde freigesprochen“
  alternative: „wegen eurer Sünde gerechtfertigt“ oder „von der Verantwortung für eure Sünde frei“
  rationale: Die Übersetzung erhält die forensische Spannung des griechischen Wortlauts, ohne ausdrücklich eine bestimmte Lehre von zugerechneter Schuld oder persönlicher Verantwortung einzutragen.
- issue: Das große Zeichen in Vers 5
  choice: Nur den im vorgelegten griechischen Text bezeugten Satz übersetzen
  alternative: Den Satz der englischen Konsultationsfassung über das Erscheinen des Herrn auf Erden und die Rettung Adams ergänzen
  rationale: Diese Ergänzung steht nicht im bereitgestellten griechischen Ausgangstext. Da die Übersetzung zuerst der originalsprachlichen Evidenz folgen soll, wird sie nicht aus der englischen Schicht importiert.
- issue: Christologisch klingender Schlusssatz in Vers 7
  choice: Im Text wiedergeben und textkritisch kennzeichnen
  alternative: Den eingeklammerten Satz aus dem Haupttext auslassen
  rationale: Der Satz gehört zur überlieferten griechischen Vorlage, ist in der Edition jedoch durch eckige Klammern als textkritisch auffällig gekennzeichnet. Inhalt und Spannung werden daher bewahrt, der Überlieferungsstatus aber offengelegt.
- issue: „Gott nahm einen Leib an“
  choice: Die explizite Aussage des griechischen Wortlauts direkt wiedergeben
  alternative: „Gott erschien leibhaftig“
  rationale: σῶμα λαβών bedeutet wörtlich, dass Gott einen Leib annahm. Eine abschwächende Umschreibung würde die christologische Aussage des vorhandenen Textes verdecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzstruktur. Archaisierende Formen wurden vermieden; „Seht“ erhält jedoch den markierenden und feierlichen Charakter von ἰδού. Die poetischen Pflanzen-, Duft- und Zweigbilder bleiben erhalten. Gewaltsame Gerichtsaussagen wurden weder beschönigt noch kommentierend verschärft.
