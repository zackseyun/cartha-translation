    issue: 'Vers 2: „Heilige werden aus mir hervorgehen und sich ... vermehren“'
    rationale: πληθυνθήσονται ἅγιοι ἐξ ἐμοῦ hat nur das Prädikat „werden zahlreich werden/sich vermehren“. „werden ... hervorgehen“ ist eine zusätzliche, wenn auch naheliegende Aussage und sollte nicht in den Text eingeführt werden.
  - severity: low
    issue: 'Vers 6: „der Zertretung preisgegeben“'
    rationale: Die Formulierung ist nicht falsch, aber „zum Zertreten preisgegeben“ ist im heutigen Deutsch transparenter und bildet εἰς καταπάτησιν direkter ab.
