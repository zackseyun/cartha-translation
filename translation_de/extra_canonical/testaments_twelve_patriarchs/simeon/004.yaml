base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004.yaml
  text: 1[a]. Now my father kept asking about me, because he had seen me gloomy, and I told him, “My liver is swollen.” 2. For I was grieving more than all the others, because I was responsible for the sale of Joseph. 3. And when we went down into Egypt and he bound me as a spy, I knew that I was suffering justly, and I was not distressed. 4. But Joseph was a good man[b], and having the Spirit of God in him, being compassionate and merciful, he did not hold a grudge against me, but loved me along with my brothers. 5. Therefore guard yourselves, my children, from every jealousy and envy, and walk in simplicity of heart, so that God may also give you favor and glory and blessing upon your heads, just as you saw in Joseph. 6. All his days he did not reproach us about this matter, but he loved us as his own soul, and honored us above his own sons, and granted us riches and livestock and produce. 7. And you also, my children, let each one love his brother with a good heart, and the spirit of
    envy will depart from you. 8. For this makes the soul savage, and destroys the body; it brings anger and war to one’s designs, and provokes to bloodshed, and leads the mind into frenzy, and gives the soul upheaval and the body trembling. 9. For even in sleep envy, presenting to him visions of wickedness, consumes him and troubles his soul with evil spirits, and makes the body start up in fear, and wakes the mind in turmoil; and like an evil and venomous spirit[c][d], so he appears to people.
translation:
  language: de
  text: '1. Mein Vater fragte immer wieder nach mir, weil er gesehen hatte, wie niedergeschlagen ich war. Ich sagte zu ihm: »Meine Leber ist geschwollen.«[a] 2. Denn ich trauerte mehr als alle anderen, weil ich für den Verkauf Josefs verantwortlich war. 3. Als wir nach Ägypten hinabzogen und er mich als Spion fesselte, erkannte ich, dass ich zu Recht litt, und war darüber nicht betrübt. 4. Josef aber war ein guter Mann. Gottes Geist war in ihm, und er war mitfühlend und barmherzig. Er trug mir das Böse nicht nach, sondern liebte mich zusammen mit meinen Brüdern. 5. Hütet euch daher, meine Kinder, vor jeder Eifersucht und jedem Neid[d], und lebt in Einfalt des Herzens[b], damit Gott auch euch Gunst, Ehre und Segen auf eure Häupter gebe, wie ihr es an Josef gesehen habt. 6. Sein ganzes Leben lang machte er uns wegen dieser Sache keine Vorwürfe. Vielmehr liebte er uns wie seine eigene Seele, erwies uns mehr Ehre als seinen eigenen Söhnen und schenkte uns Reichtum, Vieh und Ertrag. 7. Auch ihr,
    meine Kinder, sollt einander von gutem Herzen lieben; dann wird der Geist des Neides von euch weichen. 8. Denn der Neid macht die Seele wild und richtet den Körper zugrunde. Er bringt Zorn und Krieg in die Überlegungen, reizt zum Blutvergießen an, treibt den Verstand in Raserei, versetzt die Seele in Aufruhr und den Körper in Zittern. 9. Selbst im Schlaf verzehrt der Neid den Menschen, indem er ihm Bilder des Bösen vorgaukelt. Er verstört seine Seele durch böse Geister, lässt seinen Körper erschrocken auffahren und weckt seinen Verstand in Unruhe. So erscheint er den Menschen wie ein böser, giftiger Geist.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Meine Leber ist geschwollen« gibt eine antike körperbezogene Redeweise für inneren Kummer oder schwere Bedrängnis wieder. Simeon nennt seinem Vater eine körperliche Erklärung für sein bedrücktes Aussehen.
    reason: cultural_note
  - marker: b
    text: »Einfalt des Herzens« kann auch mit »ungeteiltem Herzen« oder »Aufrichtigkeit des Herzens« wiedergegeben werden.
    reason: lexical_alternative
  - marker: c
    text: Der letzte Satz kann entweder bedeuten, dass der neidische Mensch anderen wie ein böser, giftiger Geist erscheint, oder dass der personifiziert dargestellte Neid selbst so erscheint.
    reason: alternative_reading
  - marker: d
    text: »Eifersucht und Neid« gibt zwei verwandte griechische Begriffe wieder (ζῆλος und φθόνος), die hier beide negativ gemeint sind.
    reason: lexical_alternative
lexical_decisions:
- source_word: σκυθρωπόν
  choice: niedergeschlagen
  rationale: Bezeichnet eine sichtbar bedrückte, finstere Gemütslage und passt natürlich dazu, dass der Vater Simeons Zustand bemerkt.
- source_word: τὰ ἤπατά μου ὀγκοῦμαι
  choice: Meine Leber ist geschwollen
  rationale: Bewahrt das konkrete antike Körperbild, statt es stillschweigend als seelischen Kummer zu paraphrasieren; eine Fußnote erläutert die Wendung.
- source_word: τῆς πράσεως Ἰωσήφ
  choice: für den Verkauf Josefs
  rationale: πρᾶσις bezeichnet hier konkret den Verkauf Josefs, nicht nur allgemein einen Verrat.
- source_word: δικαίως πάσχω
  choice: dass ich zu Recht litt
  rationale: Erhält die moralische und rechtliche Wertung von δικαίως in natürlichem Deutsch.
- source_word: ἀγαθὸς ἀνήρ
  choice: ein guter Mann
  rationale: Eine schlichte, direkte Wiedergabe der sittlichen Charakterisierung Josefs.
- source_word: πνεῦμα θεοῦ ἐν αὐτῷ
  choice: Er hatte Gottes Geist in sich
  rationale: Gibt die inwendige Gegenwart beziehungsweise Wirksamkeit des göttlichen Geistes wieder, ohne die griechische Aussage kausal auszubauen.
- source_word: ἐμνησικάκησέν
  choice: trug er mir das Böse nicht nach
  rationale: Idiomatiche Wiedergabe des Nichtfesthaltens an erlittenem Unrecht oder Groll.
- source_word: ἁπλότητι καρδίας
  choice: in Einfalt des Herzens
  rationale: Bewahrt den ethischen Gedanken eines ungeteilten, arglosen und aufrichtigen Inneren; die Fußnote nennt verständlichere Alternativen.
- source_word: ζήλου καὶ φθόνου
  choice: Eifersucht und Neid
  rationale: Unterscheidet die beiden verwandten, in diesem Zusammenhang eindeutig negativen Begriffe.
- source_word: ψυχὴν αὐτοῦ
  choice: seine eigene Seele
  rationale: Erhält die anthropologische Begrifflichkeit des Textes, der Seele, Körper, Geist und Verstand unterscheidet.
- source_word: ἐδόξασεν
  choice: erwies ... Ehre
  rationale: Gibt das Verleihen von Ansehen wieder, ohne im Deutschen eine unangemessen kultische Bedeutung anzudeuten.
- source_word: διαβουλίῳ
  choice: in das Sinnen
  rationale: Lässt den umfassenden inneren Bereich von Überlegung, Absicht und Trachten anklingen, ohne ihn auf konkrete Pläne zu verengen.
- source_word: εἰς ἔκστασιν ἄγει τὴν διάνοιαν
  choice: treibt den Verstand in Raserei
  rationale: Gibt hier den negativen Zustand des Außer-sich-Seins wieder, nicht eine positive religiöse Ekstase.
- source_word: ἐκθροεῖσθαι τὸ σῶμα ποιεῖ
  choice: lässt seinen Körper erschrocken auffahren
  rationale: Bewahrt sowohl die körperliche Reaktion als auch den Schreck- und Schlafkontext.
- source_word: ἰοβόλον
  choice: giftig
  rationale: Gibt die Vorstellung von Gift tragend beziehungsweise Gift versprühend in knappem, natürlichem Deutsch wieder.
theological_decisions:
- issue: πνεῦμα θεοῦ bei Josef
  choice: Gottes Geist
  alternative: ein Geist Gottes
  rationale: Im erzählerisch-ethischen Zusammenhang liegt der göttliche Geist als Quelle von Josefs Haltung nahe. Die Formulierung bleibt jedoch eng am Griechischen und vermeidet eine weitergehende dogmatische Ausdeutung.
- issue: Anthropologische Sprache ψυχή
  choice: Seele
  alternative: Leben oder Selbst
  rationale: Da der Abschnitt Seele, Körper, Geist und Verstand nebeneinander nennt, erhält »Seele« die begriffliche Spannung des Textes besser als eine psychologisierende Vereinheitlichung.
- issue: Bezug des Subjekts im Schlusssatz von Vers 9
  choice: Das Pronomen »er« bleibt im Haupttext mehrdeutig
  alternative: ausdrückliche Festlegung auf den neidischen Menschen oder auf den Neid
  rationale: Die griechische Form kann im Zusammenhang sowohl auf den vom Neid beherrschten Menschen als auch auf den personifiziert dargestellten Neid zurückbezogen werden. Eine Fußnote wahrt beide Möglichkeiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit testamentarischem Mahnton. Konkrete antike Bilder und die differenzierte Rede von Seele, Körper, Geist und Verstand bleiben erhalten; ungewöhnliche oder mehrdeutige Stellen werden nicht geglättet, sondern knapp erläutert.
