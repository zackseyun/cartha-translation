  to: '1. Mein Vater fragte immer wieder nach mir, weil er gesehen hatte, wie niedergeschlagen ich war. Ich sagte zu ihm: »Meine Leber ist geschwollen.«[a] 2. Denn ich trauerte mehr als alle anderen, weil ich für den Verkauf Josefs verantwortlich war. 3. Als wir nach Ägypten hinabzogen und er mich als Spion fesselte, erkannte ich, dass ich zu Recht litt, und war darüber nicht betrübt. 4. Josef aber war ein guter Mann. Gottes Geist war in ihm, und er war mitfühlend und barmherzig. Er trug mir das Böse nicht nach, sondern liebte mich zusammen mit meinen Brüdern. 5. Hütet euch daher, meine Kinder, vor jeder Eifersucht und jedem Neid[d], und lebt in Einfalt des Herzens[b], damit Gott auch euch Gunst, Ehre und Segen auf eure Häupter gebe, wie ihr es an Josef gesehen habt. 6. Sein ganzes Leben lang machte er uns wegen dieser Sache keine Vorwürfe. Vielmehr liebte er uns wie seine eigene Seele, erwies uns mehr Ehre als seinen eigenen Söhnen und schenkte uns Reichtum, Vieh und Ertrag. 7. Auch ihr,
    meine Kinder, sollt einander von gutem Herzen lieben; dann wird der Geist des Neides von euch weichen. 8. Denn der Neid macht die Seele wild und richtet den Körper zugrunde. Er bringt Zorn und Krieg in die Überlegungen, reizt zum Blutvergießen an, treibt den Verstand in Raserei, versetzt die Seele in Aufruhr und den Körper in Zittern. 9. Selbst im Schlaf verzehrt der Neid den Menschen, indem er ihm Bilder des Bösen vorgaukelt. Er verstört seine Seele durch böse Geister, lässt seinen Körper erschrocken auffahren und weckt seinen Verstand in Unruhe. So erscheint er den Menschen wie ein böser, giftiger Geist.[c]'
