  source_fidelity: 'Eine sichere Korrektur ist in V. 3 nötig: ἔδησέ με bedeutet „er fesselte/band mich“, nicht „er ließ mich fesseln“. In V. 4 ist σύν τοῖς ἀδελφοῖς μου am genauesten mit „zusammen mit meinen Brüdern“ wiederzugeben, nicht komparativ als „ebenso wie“. Die übrigen zentralen Begriffe, einschließlich der konkreten Leber-Metapher, ψυχή als „Seele“ und der Mehrdeutigkeit am Ende von V. 9, sind sachgerecht wiedergegeben.'
  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. „in das Sinnen“ in V. 8 wirkt jedoch unidiomatisch; „in die Überlegungen“ ist natürlicher und bewahrt den Bezug auf Erwägen bzw. Absichten.
  terminology: „Gottes Geist“, „Seele“, „Körper“, „Verstand“, „Eifersucht und Neid“ sowie „Einfalt des Herzens“ sind im gegebenen Register tragfähig. Die vorhandenen Fußnoten erklären die antike Körperrede, die ethische Wendung und die Schlussmehrdeutigkeit angemessen.
  issues:
  - severity: medium
    issue: 'V. 3: „er mich als Spion fesseln ließ“ ist kausativ.'
    rationale: 'Das griechische ἔδησέ με bezeichnet unmittelbar Josefs Handlung: „er fesselte/band mich“. Ein Veranlassen durch Dritte steht nicht im Text.'
  - severity: low
    issue: 'V. 4: „liebte mich ebenso wie meine Brüder“ legt einen Vergleich nahe.'
    rationale: σὺν τοῖς ἀδελφοῖς μου bedeutet „zusammen mit meinen Brüdern“ und beschreibt die gemeinsame Zuwendung Josefs.
  - severity: low
    issue: 'V. 8: „bringt Zorn und Krieg in das Sinnen“ ist sprachlich sperrig.'
    rationale: „in die Überlegungen“ ist modernes Deutsch und gibt διαβούλιον als Bereich des Erwägens bzw. Planens verständlich wieder.
