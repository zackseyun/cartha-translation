review_pass:
  verdict: revise
  source_fidelity: 'Eine vorsichtige Überarbeitung ist nötig. In Vers 3 kehrt „bringt Beliar nahe“ die Bewegungsrichtung von προσεγγίζουσα τῷ Βελίαρ faktisch um: Die Unmoral führt dem Sinn nach zu Beliar hin. In Vers 6 fügt „übrig sein“ einen im griechischen Text nicht ausgedrückten Rest- bzw. Überlebensaspekt hinzu. Außerdem lässt sich ἐν πορνείᾳ in Vers 4 besser als Zustands-/Bereichsangabe erhalten.'
  naturalness: Der Text ist insgesamt klar, würdig und modernes Standarddeutsch. „Sorgt dafür, dass eure Herzen vor dem Herrn gut sind“ ist natürlicher als die zielgerichtete Umformung „richtet ... auf das Gute“ und gibt den Imperativ genauer wieder.
  terminology: Josef, Henoch, Levi, Juda, Beliar, Herr und sexuelle Unmoral sind konsistent und angemessen. „Krieg des Herrn“ wahrt die Offenheit des Genitivs. „Heerlager“ passt zum militärischen Kontext.
  issues:
  - severity: medium
    issue: 'Vers 3: „bringt Beliar nahe“'
    rationale: προσεγγίζουσα τῷ Βελίαρ bedeutet „sich Beliar nähern“ bzw. mit implizitem Betroffenen „zu Beliar hinführen“. Die vorhandene deutsche Formulierung kann bedeuten, Beliar werde jemandem nahegebracht, und verschiebt damit die Blickrichtung.
  - severity: medium
    issue: 'Vers 6: „werden übrig sein“'
    rationale: ὀλιγοστοί bezeichnet ausdrücklich geringe Zahl, nicht ein Übrigbleiben nach einer Auslese oder einem Untergang. Der Zusatz sollte entfallen.
  - severity: low
    issue: 'Vers 2: „richtet eure Herzen auf das Gute“'
    rationale: Ἀγαθύνατε fordert, die Herzen gut zu machen. Die vorliegende Formulierung ist verständlich, verändert aber die Aussage zu einer Ausrichtung auf ein Ziel.
  - severity: low
    issue: 'Vers 4: kausales „durch sexuelle Unmoral“'
    rationale: ἐν πορνείᾳ ist hier am besten offen als „in sexueller Unmoral“ wiederzugeben; eine ausschließlich kausale Deutung ist enger.
