base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/005.yaml
  text: 'Therefore Joseph was handsome in form and beautiful in appearance, because nothing evil dwelt in him; for the face reveals the turmoil of the spirit.


    And now, my children, make your hearts good before the Lord, and make your ways straight before men, and you will be finding favor before the Lord and men.


    Guard yourselves, then, from sexual immorality, because sexual immorality is the mother of evils, separating from God and drawing near to Beliar.


    For I have seen in the writing of Enoch that your sons will be corrupted in sexual immorality, and they will wrong the sons of Levi with the sword.


    But they will not be able to stand against Levi, because he will fight the Lord’s war and will defeat your whole host.


    And they will be few in number, being divided in Levi and in Judah, and none from among you will be for leadership, just as our father also prophesied in his blessings.'
translation:
  language: de
  text: '5 Deshalb war Josef von schöner Gestalt und ansehnlich, weil nichts Böses in ihm wohnte; denn das Gesicht lässt die Unruhe des Geistes erkennen.


    2 Und nun, meine Kinder, sorgt dafür, dass eure Herzen vor dem Herrn gut sind, und macht eure Wege gerade vor den Menschen; dann werdet ihr Gunst finden vor dem Herrn und den Menschen.


    3 Hütet euch also vor sexueller Unmoral, denn sexuelle Unmoral ist die Mutter allen Übels: Sie trennt von Gott und führt zu Beliar hin.


    4 Denn ich habe in der Schrift Henochs gesehen, dass eure Söhne in sexueller Unmoral zugrunde gehen und den Söhnen Levis mit dem Schwert Unrecht tun werden.


    5 Doch sie werden Levi nicht standhalten können, denn er wird den Krieg des Herrn führen und euer ganzes Heerlager besiegen.


    6 Und es werden nur wenige sein, die auf Levi und Juda verteilt sind; niemand aus eurer Mitte wird zur Herrschaft gelangen, wie auch unser Vater in seinen Segensworten vorausgesagt hat.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡραῖος τῷ εἴδει, καὶ καλὸς τῇ ὄψει
  choice: von schöner Gestalt und ansehnlich
  rationale: Gibt die zwei einander ergänzenden Aussagen über Gestalt und sichtbare Erscheinung natürlich und ohne unnötige Doppelung wieder.
- source_word: ταραχῆς τοῦ πνεύματος
  choice: Unruhe des Geistes
  rationale: Bewahrt die mögliche innere Aufgewühltheit, ohne πνεῦμα vorschnell psychologisch oder theologisch einzuengen.
- source_word: Ἀγαθύνατε τὰς καρδίας ὑμῶν
  choice: richtet eure Herzen auf das Gute
  rationale: Das ungewöhnliche Verb bedeutet wörtlich, die Herzen gut zu machen; die gewählte Formulierung ist im Deutschen verständlich und erhält den ethischen Imperativ.
- source_word: πορνεία
  choice: sexuelle Unmoral
  rationale: Bezeichnet hier umfassend unerlaubtes sexuelles Verhalten und ist weiter als das moderne deutsche Wort „Unzucht“ in seinem üblichen Verständnis.
- source_word: ἐν πορνείᾳ φθαρήσονται
  choice: durch sexuelle Unmoral zugrunde gehen
  rationale: φθείρω kann Verderben, Zerstörung oder moralische Korrumpierung ausdrücken; im Kontext ist „zugrunde gehen“ natürlich, während die kausale Beziehung im Deutschen klar wird.
- source_word: παρεμβολήν
  choice: Heerlager
  rationale: Das Wort kann Lager, Heerlager oder Streitmacht bezeichnen. „Heerlager“ wahrt das militärische Bild und passt zu πολεμήσει und νικήσει.
- source_word: εἰς ἡγεμονίαν
  choice: zur Herrschaft gelangen
  rationale: Gibt die idiomatisch schwierige Zielkonstruktion als Erlangung einer Führungs- oder Herrschaftsstellung wieder.
theological_decisions:
- issue: „Krieg des Herrn“ und Subjekt Levi
  choice: „er wird den Krieg des Herrn führen“
  alternative: „er wird für den Herrn Krieg führen“
  rationale: Der Genitiv Κυρίου bleibt bewusst offen zwischen einem dem Herrn gehörenden, von ihm beauftragten oder für ihn geführten Krieg; das grammatische Subjekt bleibt Levi.
- issue: Wirkung der sexuellen Unmoral in Vers 3
  choice: „Sie trennt von Gott und bringt Beliar nahe“
  alternative: „Sie trennt den Menschen von Gott und führt ihn zu Beliar“
  rationale: Im Griechischen fehlt ein ausdrückliches Objekt. Die knappe Form bewahrt diese Offenheit, statt einen bestimmten Betroffenen einzusetzen.
- issue: Aufteilung auf Levi und Juda
  choice: „auf Levi und Juda verteilt“
  alternative: „Levi und Juda zugeteilt“
  rationale: ἐπιμεριζόμενοι ist textlich und sachlich schwierig. Die Übersetzung hält die Verteilung fest, ohne eine genaue stammesgeschichtliche oder ekklesiologische Deutung einzutragen.
- issue: Henoch als Schriftquelle
  choice: „in der Schrift Henochs“
  alternative: „in einer schriftlichen Darstellung Henochs“
  rationale: Die Formulierung bezeichnet eine Henoch zugeschriebene schriftliche Quelle, ohne Aussagen über Kanonizität oder Verfasserschaft zu machen.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer paränetischer und prophetischer Diktion. Historische Eigennamen erscheinen als Josef, Henoch, Levi, Juda und Beliar. Die Verszählung wird beibehalten; Kapitel 5 ist am Beginn markiert.
