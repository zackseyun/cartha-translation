review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt den griechischen Text insgesamt sorgfältig wieder, insbesondere die antiken Körpermetaphern, die unbestimmte Personifizierung in Vers 7, die schwierige Salbenangabe in Vers 9 sowie die im griechischen Text bezeugte Abfolge von fünfmonatigem Zorn (V. 11) und Handleiden (V. 12). Einige Formulierungen entfernen sich jedoch unnötig vom Wortlaut oder sind semantisch ungenau: In Vers 5 bezeichnet ἐν ψυχαῖς καὶ σώμασιν den Bereich „in Seele und Leib“, nicht eine Zuweisung „an Seele und Leib“; in Vers 9 fügt „kam mein Bruder Juda“ eine nicht klar belegte Handlung hinzu; in Vers 14 paraphrasiert „hatte ich mich ... gewandt“ die Aussage über Simeons böses Vorhaben.'
  naturalness: Die Sprache ist überwiegend modernes, würdiges Standarddeutsch. „Ich wurde Jakob als zweiter Sohn geboren“ ist jedoch idiomatisch holprig; „aus Jakob geboren, als zweiter Sohn meines Vaters“ bleibt näher am ungewöhnlichen Ausgangstext und ist zugleich verständlicher. Die Anrede in Vers 1 wird mit „Hört mich an“ klar und natürlich.
  terminology: Die Entscheidungen „Leber“, „Innerstes“, „Herrscher der Verführung“, „Salbe“, „halb verdorrt“, „Befleckung“ und „Mut“ sind tragfähig. Für ζηλόω bzw. φθονέω ist „neidisch“ hier präziser und registergerecht; „Eifersucht“ bleibt für ζῆλος in der personifizierten Wendung von Vers 7 möglich. „Herrn, Gott“ gibt Κύριος τῷ Θεῷ ohne den nicht vorhandenen Possessivzusatz „meinem“ wieder.
  issues:
  - severity: medium
    issue: 'Vers 5: „an Seele und Leib“'
    rationale: ἐν ψυχαῖς καὶ σώμασιν bedeutet „in Seele und Leib“ bzw. „in ihren Seelen und Körpern“, nicht „an“.
  - severity: medium
    issue: 'Vers 9: hinzugefügtes „kam mein Bruder Juda“'
    rationale: Das Partizip ἐλθών bezieht sich auf Judas Verkauf an die Ismaeliten; die Fassung fügt eine eigenständige Ankunft Judas hinzu. Die revidierte Form gibt die Verbindung ohne diese Zusatzinformation wieder.
  - severity: medium
    issue: Vers 14 paraphrasiert das böse Vorhaben
    rationale: Der griechische Text sagt, Simeon habe wegen Josef, seines Bruders, aus Neid etwas Böses ersonnen. Die Wendung, er habe sich gegen Josef gewandt, ist interpretierend und wird durch eine nähere Wiedergabe ersetzt.
  - severity: low
    issue: 'Vers 13: „dem Herrn, meinem Gott“'
    rationale: Der Text lautet „zum Herrn, Gott“ (Κυρίῳ τῷ Θεῷ) und enthält kein possessives „meinem“.
