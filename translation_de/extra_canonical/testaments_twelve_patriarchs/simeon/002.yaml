  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/002.yaml
  text: '1. Hear, my children, Simeon your father, and I will declare to you what I have in my heart.

    2. I was born from Jacob as the second son to my father, and Leah my mother called me Simeon, because the Lord heard her petition.

    3. For I became very strong; I did not shrink from any deed, nor was I afraid in any matter.

    4. For my heart was hard, and my liver unmoved, and my inward parts without compassion.

    5. For courage also is given by the Most High to men in soul and in body.

    6. But in the time of my youth I was very jealous of Joseph, because my father loved him above all.

    7. And I set my liver against him so as to kill him, because the ruler of deceit and the spirit of jealousy blinded my mind, so that I did not regard him as a brother, nor even spare Jacob my father.

    8. But his God and the God of our fathers sent his angel and rescued him from my hands.

    9. For when I went to Shechem to bring ointment for our flocks, and Reuben to Dothan, where our supplies and all our stores were, Judah my brother sold him to the Ishmaelites.

    10. And when Reuben heard these things, he was grieved, for he wanted to bring him back safely to our father.

    11. But when I heard this, I was very angry with Judah, because he had let him go alive;

    12. and for five months I was sick in my liver. And the Lord struck me, and my hand was withered for seven days.

    13. And I knew, my children, that this happened to me because of Joseph. And after changing my mind I wept and prayed to the Lord God that my hand might be restored, and that I might abstain from every defilement and envy and from all foolishness.

    14. For I knew that I had devised an evil thing before the Lord and against Jacob my father concerning Joseph my brother, by envying him.'
translation:
  language: de
  text: '1. Hört mich an, meine Kinder, Simeon, euren Vater; ich will euch verkünden, was ich in meinem Herzen trage.


    2. Ich wurde aus Jakob geboren, als zweiter Sohn meines Vaters, und meine Mutter Lea nannte mich Simeon, weil der Herr ihr Flehen erhört hatte.


    3. Denn ich wurde sehr stark. Vor keiner Tat schreckte ich zurück, und vor keiner Sache fürchtete ich mich.


    4. Mein Herz war hart, meine Leber unbewegt[a] und mein Innerstes ohne Mitgefühl.


    5. Denn auch der Mut wird den Menschen vom Höchsten in Seele und Leib gegeben.


    6. In meiner Jugend war ich überaus neidisch auf Josef, weil mein Vater ihn mehr als alle anderen liebte.


    7. Ich richtete meine Leber gegen ihn[b], um ihn zu töten; denn der Herrscher der Verführung und der Geist der Eifersucht verblendeten meinen Verstand, sodass ich ihn nicht als Bruder achtete und auch meinen Vater Jakob nicht schonte.


    8. Doch sein Gott, der Gott unserer Väter, sandte seinen Engel und rettete ihn aus meinen Händen.


    9. Als ich nämlich nach Sichem ging, um Salbe[c] zu den Herden zu bringen, und Ruben nach Dotan, wo sich unsere Vorräte und unser gesamtes Lager befanden, verkaufte mein Bruder Juda Josef an die Ismaeliten.


    10. Als Ruben davon hörte, wurde er traurig; denn er wollte ihn zu unserem Vater zurückbringen.


    11. Als ich aber davon hörte, wurde ich sehr zornig auf Juda, weil er Josef lebend hatte fortkommen lassen. Fünf Monate lang blieb ich zornig auf ihn.


    12. Da zerschlug mich der Herr und hinderte mich am Handeln: Meine rechte Hand war sieben Tage lang halb verdorrt[d].


    13. Da erkannte ich, meine Kinder, dass mir dies wegen Josef widerfahren war. Ich änderte meinen Sinn, weinte und betete zum Herrn, Gott, meine Hand möge wiederhergestellt werden und ich möge mich von jeder Befleckung, von Neid und von aller Torheit fernhalten.


    14. Denn ich erkannte, dass ich vor dem Herrn und gegenüber meinem Vater Jakob wegen meines Bruders Josef etwas Böses ersonnen hatte, weil ich neidisch auf ihn gewesen war.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Leber galt in antiker Bildsprache als Sitz von Gefühlen und Leidenschaften. „Unbewegt“ beschreibt hier Simeons Unempfindlichkeit.
    reason: Die wörtliche Körpermetapher ist modernen Lesern fremd und bedarf einer knappen Erklärung.
  - marker: b
    text: 'Wörtlich: „Ich richtete meine Leber auf ihn.“ Gemeint ist, dass Simeon sein leidenschaftliches Inneres feindselig gegen Josef wandte.'
    reason: Die ungewöhnliche Metapher soll im Text erhalten, aber verständlich erläutert werden.
  - marker: c
    text: Der griechische Text hat „Salbe“ oder „Salbmittel“. Die Verwendung bei den Herden bleibt unklar.
    reason: Die überlieferte Lesart ist kontextuell schwierig; die Fußnote bewahrt diese echte Unsicherheit.
  - marker: d
    text: 'Wörtlich etwa: „Meine rechte Hand wurde halb verdorrt.“ Gemeint sein kann eine teilweise Lähmung; der genaue körperliche Zustand bleibt offen.'
    reason: Das seltene griechische Wort bezeichnet den Zustand nicht medizinisch eindeutig.
lexical_decisions:
- source_word: τὰ ἤπατά / τὰ σπλάγχνα
  choice: meine Leber / mein Innerstes
  rationale: 'Die antike Körpersprache wird bewahrt: Die Leber gilt hier als Sitz heftiger Regungen, während σπλάγχνα das innere Empfindungsvermögen bezeichnet.'
- source_word: ἀνδρεία
  choice: Mut
  rationale: Das Wort kann Tapferkeit oder Mannhaftigkeit bezeichnen; „Mut“ ist im modernen Deutsch natürlich und schließt seelische wie körperliche Stärke ein.
- source_word: ὁ ἄρχων τῆς πλάνης
  choice: der Herrscher der Verführung
  rationale: πλάνη kann Irrtum, Täuschung oder Verführung meinen. „Verführung“ erhält die personifizierte moralische Wirksamkeit, ohne die Gestalt näher zu bestimmen.
- source_word: ἄλειμμα
  choice: Salbe
  rationale: Die gewöhnliche Bedeutung ist Salbmittel oder Salbe. Obwohl der Zusammenhang mit Herden ungewöhnlich ist, wird die überlieferte Lesart nicht stillschweigend zu „Futter“ geändert.
- source_word: ἡμίξηρος
  choice: halb verdorrt
  rationale: Die seltene Zusammensetzung bedeutet wörtlich ungefähr „halb trocken/verdorrt“ und beschreibt eine teilweise Lähmung oder Austrocknung der Hand.
- source_word: μετανοήσας
  choice: ich änderte meinen Sinn
  rationale: Die Form bezeichnet eine innere Umkehr bzw. Sinnesänderung. Die Wiedergabe vermeidet eine konfessionell aufgeladene Engführung und bewahrt den Zusammenhang von Einsicht, Weinen und Gebet.
- source_word: μολυσμοῦ
  choice: Befleckung
  rationale: Der Ausdruck bezeichnet moralische oder kultische Verunreinigung; „Befleckung“ lässt diese Spannweite offen.
theological_decisions:
- issue: Ursache von Simeons Gewaltabsicht
  choice: „der Herrscher der Verführung und der Geist der Eifersucht“ verblenden seinen Verstand
  alternative: Die Wendung ausdrücklich mit Satan oder einem bestimmten Dämon identifizieren
  rationale: Der griechische Text personifiziert die Mächte, nennt aber keine eindeutige Identität. Diese Offenheit bleibt erhalten.
- issue: Göttliche Gabe menschlichen Mutes
  choice: Mut wird „vom Höchsten“ an Seele und Leib gegeben
  alternative: Den Satz als Rechtfertigung von Simeons Härte oder als ausschließlich positive Tugendaussage deuten
  rationale: Die Spannung zwischen göttlich gegebenem Mut und dessen sündhaftem Missbrauch wird nicht aufgelöst.
- issue: Das Leiden an Simeons Hand
  choice: Der Herr schlägt ihn nieder und hindert ihn am Handeln
  alternative: Die Aussage abschwächen oder nur als natürliche Krankheit darstellen
  rationale: Der Ausgangstext stellt das körperliche Leiden ausdrücklich als Handeln des Herrn und als Reaktion auf Simeons Absicht dar.
- issue: μετανοήσας in Vers 13
  choice: „ich änderte meinen Sinn“
  alternative: „ich tat Buße“ oder „ich bereute“
  rationale: Die gewählte Form wahrt die Grundbedeutung der inneren Umkehr, ohne eine spätere dogmatische Terminologie aufzudrängen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die testamentarische Anrede bleibt feierlich, ohne altertümliche Formen. Antike Körpermetaphern und personifizierte geistige Mächte werden nicht modernisierend beseitigt; schwierige Stellen werden knapp in Fußnoten erläutert. Die Verszählung folgt dem vorgelegten griechischen Text, insbesondere mit dem fünfmonatigen Zorn in Vers 11 und der verdorrten Hand in Vers 12.
