review_pass:
  verdict: revise
  source_fidelity: Die Aufforderung zur Bruderliebe, die distributive Aussage und das Bild vom »Geist des Neides« sind im Entwurf grundsätzlich zutreffend. »Dann« macht die mit καί koordinierte Zukunftsaussage jedoch zu einer ausdrücklich markierten Folge, die der griechische Wortlaut nicht selbst signalisiert. Zudem ist »von Herzen« idiomatisch, gibt ἐν ἀγαθῇ καρδίᾳ (mit gutem/wohlwollendem Herzen) aber weniger präzise wieder.
  naturalness: Die Revision bleibt modernes Standarddeutsch und bewahrt den mahnenden Ton. Die Satzstellung »Jeder soll seinen Bruder ... lieben« ist klarer und natürlicher als ein nachgestelltes distributives »ein jeder« bei einem Pluralimperativ.
  terminology: »Geist des Neides« gibt τὸ πνεῦμα τοῦ φθόνου formnah wieder und lässt offen, ob eine personale Macht oder eine innere Neigung gemeint ist. »Bruder« ist beizubehalten; eine Verallgemeinerung zu »Mitmenschen« wäre nicht quellennah.
  issues:
  - severity: medium
    issue: Die Folgepartikel »dann« ist hinzugefügt.
    rationale: Der Text verbindet Imperativ und Zukunft mit καί. Ein konditional-kausaler Zusammenhang kann kontextuell naheliegen, wird aber nicht durch eine ausdrückliche Partikel wie »dann« markiert.
  - severity: low
    issue: »von Herzen« nivelliert »mit gutem Herzen«.
    rationale: Die deutsche Wendung bezeichnet vor allem Aufrichtigkeit bzw. Intensität; ἀγαθῇ fügt die positive, wohlwollende Qualität des Herzens hinzu.
  revised_text: 'Auch ihr, meine Kinder: Jeder soll seinen Bruder mit gutem Herzen lieben, und der Geist des Neides wird von euch weichen.'
