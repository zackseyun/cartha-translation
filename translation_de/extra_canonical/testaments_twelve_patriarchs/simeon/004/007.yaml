source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Καὶ ὑμεῖς⁵², τέκνα μου⁵³, ἀγαπήσατε⁵⁴ ἕκαστος τὸν ἀδελφὸν⁵⁵ αὐτοῦ⁵⁶ ἐν ἀγαθῇ καρδίᾳ, καὶ *ἀποστήσεται ἀφ᾽ ὑμῶν τὸ πνεῦμα τοῦ φθόνου⁵⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/007.yaml
  text: And you also, my children, let each one love his brother with a good heart, and the spirit of envy will depart from you.
translation:
  language: de
  text: 'Auch ihr, meine Kinder: Jeder soll seinen Bruder mit gutem Herzen lieben, und der Geist des Neides wird von euch weichen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ὑμεῖς
  choice: Auch ihr
  rationale: 'Καί mit dem betonten ὑμεῖς hat hier am natürlichsten ergänzenden Sinn: »auch ihr«.'
- source_word: ἀγαπήσατε
  choice: sollt … lieben
  rationale: Der Aoristimperativ wird als eindringliche Aufforderung wiedergegeben; die deutsche Soll-Form passt zum väterlichen Mahnwort und bleibt würdevoll.
- source_word: ἕκαστος τὸν ἀδελφὸν αὐτοῦ
  choice: ein jeder seinen Bruder
  rationale: Bewahrt die distributive Einzahl und die konkrete Verwandtschaftsbezeichnung des griechischen Textes.
- source_word: ἐν ἀγαθῇ καρδίᾳ
  choice: von Herzen
  rationale: Natürliches modernes Deutsch für eine Liebe aus guter, aufrichtiger innerer Haltung; »mit gutem Herzen« wäre formaler, klingt aber weniger idiomatisch.
- source_word: ἀποστήσεται ἀφ᾽ ὑμῶν
  choice: wird … von euch weichen
  rationale: Gibt das Sich-Entfernen des Geistes idiomatisch wieder, ohne die Aussage abzuschwächen.
- source_word: τὸ πνεῦμα τοῦ φθόνου
  choice: der Geist des Neides
  rationale: Formnahe Wiedergabe, welche die mögliche personale oder dispositionale Bedeutung von πνεῦμα nicht vorschnell festlegt.
theological_decisions:
- issue: Bedeutung von »Geist des Neides«
  choice: Die konkrete Formulierung »der Geist des Neides« wird beibehalten.
  alternative: »neidische Gesinnung« oder »Neid«
  rationale: Der griechische Ausdruck lässt offen, ob eine geistige Macht oder eine innere Haltung gemeint ist; die Übersetzung bewahrt diese Spannung.
- issue: Verknüpfung von Aufforderung und Folge
  choice: Semikolon mit »dann«
  alternative: bloßes »und«
  rationale: Das futurische ἀποστήσεται beschreibt im Zusammenhang die Folge der Bruderliebe. »Dann« macht den Zusammenhang auf Deutsch klar, ohne eine weitergehende dogmatische Kausalität einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem paränetischem Ton. Die Anrede »meine Kinder« und das leicht gehobene »ein jeder« bewahren den testamentarischen Charakter; unnötige Archaismen werden vermieden.
