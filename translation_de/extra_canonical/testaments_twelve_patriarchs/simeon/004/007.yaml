- from: Auch ihr, meine Kinder, sollt ein jeder seinen Bruder von Herzen lieben; dann wird der Geist des Neides von euch weichen.
  to: 'Auch ihr, meine Kinder: Jeder soll seinen Bruder mit gutem Herzen lieben, und der Geist des Neides wird von euch weichen.'
  rationale: Die direkte Koordination des griechischen Textes wird ohne zusätzliches »dann« erhalten. »Mit gutem Herzen« bildet die positive Qualifizierung von ἐν ἀγαθῇ καρδίᾳ genauer ab. Die distributive Forderung wird in natürlichem modernem Deutsch formuliert, ohne den Sinn zu verändern.
  reviewer_model: gpt-5.6-terra
