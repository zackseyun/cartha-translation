source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Ὅτι καὶ⁷¹ ἐν ὕπνῳ *τις ζῆλος⁷² κακίας αὐτὸν⁷³ φαντάζουσα⁷⁴ κατεσθίει⁷⁵ καὶ⁷⁶ πνεύμασι πονηροῖς⁷⁷ διαταράσσει⁷⁸ τὴν ψυχὴν αὐτοῦ, καὶ ἐκθροεῖσθαι τὸ σῶμα ποιεῖ, καὶ ἐν ταραχῇ διυπνίζει⁷⁹ τὸν νοῦν, καὶ ὡς⁸⁰ πνεῦμα πονηρὸν *καὶ ἰοβόλον⁸¹, *οὕτως φαίνεται⁸² τοῖς ἀνθρώποις⁸³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/009.yaml
  text: For even in sleep envy, presenting to him visions of wickedness, consumes him and troubles his soul with evil spirits, and makes the body shudder, and wakes the mind in turmoil; and like an evil and venomous spirit, so he appears to people.
translation:
  language: de
  text: Denn selbst im Schlaf verzehrt ihn der Neid, indem er ihm Bilder des Bösen vor Augen stellt, und verstört seine Seele mit bösen Geistern; er lässt den Körper erschaudern und den Verstand in Unruhe erwachen. So erscheint er den Menschen wie ein böser, giftiger Geist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζῆλος κακίας
  choice: der Neid
  rationale: Im Zusammenhang des Testaments Simeons bezeichnet ζῆλος die zerstörerische Eifersucht beziehungsweise den Neid; κακίας kennzeichnet dessen bösartigen Charakter, der im Deutschen durch den Kontext hinreichend deutlich wird.
- source_word: φαντάζουσα
  choice: indem er ihm Bilder des Bösen vor Augen stellt
  rationale: Das Partizip beschreibt ein Hervorrufen beziehungsweise Vorführen innerer Bilder oder Erscheinungen; die Formulierung bewahrt den Bezug auf den Schlaf, ohne ausdrücklich Träume hinzuzufügen.
- source_word: κατεσθίει
  choice: verzehrt
  rationale: Gibt die starke Bildlichkeit von ‚auffressen, verschlingen‘ in natürlichem und würdigem Deutsch wieder.
- source_word: ἐκθροεῖσθαι τὸ σῶμα ποιεῖ
  choice: lässt den Körper erschaudern
  rationale: Die seltene Form bezeichnet wahrscheinlich ein körperliches Aufschrecken oder Erzittern; ‚erschaudern‘ vermeidet den im Griechischen nicht ausdrücklich genannten Zusatz von Furcht.
- source_word: διυπνίζει τὸν νοῦν
  choice: lässt den Verstand … erwachen
  rationale: Bewahrt sowohl das kausative Moment des Verbs als auch den Unterschied zwischen ψυχή (Seele) und νοῦς (Verstand).
- source_word: ἰοβόλον
  choice: giftiger
  rationale: Das Wort bedeutet wörtlich ‚Gift schleudernd/verspritzend‘ und wird idiomatisch als ‚giftig‘ wiedergegeben.
theological_decisions:
- issue: Verhältnis von Neid und bösen Geistern
  choice: Der Neid verstört die Seele ‚durch böse Geister‘.
  alternative: Der Neid beunruhigt die Seele zusammen mit bösen Geistern.
  rationale: Der Dativ πνεύμασι πονηροῖς lässt instrumentale oder assoziative Deutung zu. Die instrumentale Wiedergabe passt am besten zur Syntax, ohne die ontologische Beziehung näher festzulegen.
- issue: Subjekt des abschließenden Erscheinens
  choice: Das Pronomen ‚er‘ bezieht sich auf den vom Neid beherrschten Menschen.
  alternative: Es bezieht sich auf den Neid als personifizierten bösen Geist.
  rationale: Das maskuline αὐτόν/αὐτοῦ und der Vergleich ‚wie ein … Geist‘ sprechen dafür, dass der betroffene Mensch den anderen so erscheint; die personifizierende Wirkung des Neides bleibt dennoch erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die lange griechische Satzperiode wurde maßvoll gegliedert; zentrale Parallelismen und die starke Bildsprache bleiben erhalten.
