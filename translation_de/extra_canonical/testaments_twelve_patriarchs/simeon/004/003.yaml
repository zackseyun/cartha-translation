source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: '*Καὶ ὅτε¹⁰ κατέβημεν εἰς Αἴγυπτον, καὶ¹¹ ἔδησέ¹² με¹³ ὡς κατάσκοπον¹⁴, ἔγνων ὅτι δικαίως πάσχω¹⁵ καὶ οὐκ ἐλυπούμην¹⁶.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/003.yaml
  text: And when we went down into Egypt and he bound me as a spy, I knew that I was suffering justly, and I was not grieved.
translation:
  language: de
  text: Und als wir nach Ägypten hinabzogen und er mich als Spion fesselte, erkannte ich, dass ich zu Recht litt, und ich war nicht betrübt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατέβημεν
  choice: wir … hinabzogen
  rationale: Bewahrt die übliche antike Richtungsangabe für die Reise nach Ägypten und gibt den Aorist natürlich wieder.
- source_word: ἔδησέ με
  choice: er mich … fesselte
  rationale: Gibt das konkrete Binden bzw. Gefangennehmen knapp und quellennah wieder.
- source_word: ὡς κατάσκοπον
  choice: wie einen Spion
  rationale: Bewahrt die mit ὡς ausgedrückte Einstufung beziehungsweise Behandlung als Spion, ohne daraus ausdrücklich eine Tatsachenbehauptung zu machen.
- source_word: δικαίως πάσχω
  choice: dass ich zu Recht litt
  rationale: Gibt die moralische Bewertung δικαίως und das erlittene Leid direkt wieder; die deutsche Vergangenheitsform fügt sich natürlich in den Erzählzusammenhang ein.
- source_word: οὐκ ἐλυπούμην
  choice: ich war nicht betrübt
  rationale: „Betrübt“ deckt den emotionalen Sinn von λυπέομαι genauer ab als ein allgemeines „beunruhigt“ oder „bekümmert“.
theological_decisions:
- issue: Grund der als gerecht erkannten Leidenserfahrung
  choice: 'Die Aussage bleibt allgemein: Simeon erkennt, dass er zu Recht leidet.'
  alternative: Den gerechten Grund ausdrücklich mit einer bestimmten früheren Sünde oder Tat verbinden.
  rationale: Der Vers selbst benennt den Grund nicht; eine ausdrückliche Zuordnung würde den theologischen und erzählerischen Zusammenhang stärker festlegen als der griechische Wortlaut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Satzstruktur. „Hinabzogen“ erhält die antike Reiseformulierung; „Spion“ ist gegenwärtig und allgemein verständlich.
