revisions:
- from: Und als wir nach Ägypten hinabzogen und er mich wie einen Spion fesselte, erkannte ich, dass ich zu Recht litt, und ich war nicht betrübt.
  to: Und als wir nach Ägypten hinabzogen und er mich als Spion fesselte, erkannte ich, dass ich zu Recht litt, und ich war nicht betrübt.
  rationale: Die einzige notwendige Änderung ersetzt „wie einen Spion“ durch „als Spion“, damit die im Griechischen ausgedrückte Einordnung beziehungsweise Behandlung klar wiedergegeben wird. Der übrige Text ist quellennah, idiomatisch und bewahrt die Aussage ohne zusätzliche Deutung.
