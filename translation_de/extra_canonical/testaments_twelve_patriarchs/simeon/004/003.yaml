  timestamp: '2026-07-18T10:03:58Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung trifft den Satzbau und die zentralen Aussagen des Griechischen insgesamt: κατέβημεν („hinabzogen“), ἔδησέ με („fesselte“), δικαίως πάσχω („zu Recht litt“) und οὐκ ἐλυπούμην („war nicht betrübt“) sind angemessen wiedergegeben. Bei ὡς κατάσκοπον ist jedoch „wie einen Spion“ im Deutschen mehrdeutig und kann einen bloßen Vergleich der Art und Weise nahelegen, während das Griechische die Behandlung bzw. Einordnung als Spion ausdrückt.'
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch und gut lesbar. „Als Spion fesselte“ ist hier zugleich natürlicher und präziser als „wie einen Spion fesselte“.
  terminology: „Spion“ ist eine treffende, allgemeinverständliche Wiedergabe von κατάσκοπος. „Betrübt“ gibt λυπέομαι im gegebenen Kontext passend wieder, ohne die emotionale Aussage zu verstärken. Keine theologisch belasteten Begriffe erfordern eine Änderung.
  issues:
  - severity: medium
    issue: „wie einen Spion“ ist für ὡς κατάσκοπον nicht präzise genug.
    rationale: Die deutsche Vergleichsformulierung kann bedeuten, er sei lediglich auf eine einem Spion ähnliche Weise gefesselt worden. ὡς mit dem Prädikatsakkusativ bezeichnet hier vielmehr seine Behandlung als beziehungsweise unter der Anschuldigung, ein Spion zu sein. „als Spion“ wahrt diese Nuance, ohne über eine tatsächliche Spionagetätigkeit zu entscheiden.
  revised_text: Und als wir nach Ägypten hinabzogen und er mich als Spion fesselte, erkannte ich, dass ich zu Recht litt, und ich war nicht betrübt.
  revised_footnotes: []
  revision_rationale: Die einzige notwendige Änderung ersetzt „wie einen Spion“ durch „als Spion“, damit die im Griechischen ausgedrückte Einordnung beziehungsweise Behandlung klar wiedergegeben wird. Der übrige Text ist quellennah, idiomatisch und bewahrt die Aussage ohne zusätzliche Deutung.
