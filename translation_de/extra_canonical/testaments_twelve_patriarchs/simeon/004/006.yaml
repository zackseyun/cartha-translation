id: T12P.SIM.4.6
reference: Testament of Simeon 4:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Πάσας⁴⁰ τὰς ἡμέρας⁴¹ οὐκ⁴² ὠνείδισεν ἡμᾶς⁴³ *περὶ τοῦ πράγματος τούτου⁴⁴, ἀλλ᾿⁴⁵ ἠγάπησεν ἡμᾶς ὡς τὴν *ψυχὴν αὐτοῦ⁴⁶ καὶ ὑπὲρ τοὺς υἱοὺς αὐτοῦ⁴⁷ ἐδόξασεν⁴⁸ ἡμᾶς, καὶ⁴⁹ *πλοῦτον καὶ κτήνη καὶ καρπὸν⁵⁰ *ἐχαρίσατο ἡμῖν⁵¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/006.yaml
  text: All his days he did not reproach us about this matter, but he loved us as his own soul, and honored us above his own sons, and granted us wealth and livestock and produce.
translation:
  language: de
  text: Sein ganzes Leben lang machte er uns wegen dieser Sache keine Vorwürfe. Vielmehr liebte er uns wie sein eigenes Leben, ehrte uns mehr als seine eigenen Söhne und schenkte uns Reichtum, Vieh und Ernteertrag.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πάσας τὰς ἡμέρας
  choice: Sein ganzes Leben lang
  rationale: Die idiomatische Zeitangabe meint hier die Gesamtheit seiner Tage; diese Wiedergabe ist im Deutschen natürlich und bewahrt den Sinn.
- source_word: ὠνείδισεν
  choice: machte ... keine Vorwürfe
  rationale: Gibt das persönliche Vorhalten beziehungsweise Tadeln in diesem Zusammenhang idiomatisch wieder.
- source_word: ὡς τὴν ψυχὴν αὐτοῦ
  choice: wie sein eigenes Leben
  rationale: ψυχή kann »Seele« oder »Leben« bezeichnen. In der Liebesvergleichsformel ist »sein eigenes Leben« im modernen Deutschen verständlich, ohne eine besondere Seelenlehre einzutragen.
- source_word: ὑπὲρ τοὺς υἱοὺς αὐτοῦ ἐδόξασεν
  choice: ehrte uns mehr als seine eigenen Söhne
  rationale: ἐδόξασεν bezeichnet hier das Erweisen besonderer Ehre; ὑπέρ mit Akkusativ drückt den Vergleich beziehungsweise Vorrang aus.
- source_word: πλοῦτον
  choice: Reichtum
  rationale: Direkte und natürliche Wiedergabe des materiellen Wohlstands.
- source_word: καρπὸν
  choice: Ernteertrag
  rationale: Im Zusammenhang mit Reichtum und Vieh bezeichnet καρπός wahrscheinlich landwirtschaftlichen Ertrag; »Ernteertrag« ist konkreter als das mehrdeutige »Frucht«.
- source_word: ἐχαρίσατο
  choice: schenkte
  rationale: Bewahrt den Gedanken einer großzügigen, freiwilligen Gabe.
theological_decisions:
- issue: Bedeutung von ψυχή in der Vergleichsformel
  choice: Leben
  alternative: Seele
  rationale: Beide Bedeutungen sind lexikalisch möglich. »Leben« ergibt im Deutschen eine natürliche Aussage über intensive Liebe und vermeidet eine unnötige anthropologische Festlegung.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzstruktur wurde für gute deutsche Lesbarkeit leicht gegliedert; die Abfolge von Nichtvorwurf, Liebe, Ehrung und materieller Gabe bleibt erhalten.
