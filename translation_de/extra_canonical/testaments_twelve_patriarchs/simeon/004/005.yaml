  to: Darum hütet euch, meine Kinder, vor jeder Eifersucht und jedem Neid und lebt in Lauterkeit des Herzens, damit Gott auch euch Gnade, Herrlichkeit und Segen auf eure Häupter gebe, wie ihr es bei Josef gesehen habt.
  rationale: 'Die Revision beschränkt sich auf zwei sprachlich sichere Anpassungen: Die Herzenshaltung wird idiomatisch und quellentreu als „Lauterkeit des Herzens“ wiedergegeben; der Verweis auf Josef wird mit „bei Josef“ klarer formuliert. Aussage, Register und Ambiguitäten des griechischen Textes bleiben erhalten.'
