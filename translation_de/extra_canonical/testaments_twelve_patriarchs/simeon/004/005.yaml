review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt Imperativ, Schutz vor ζῆλος und φθόνος, die Aufforderung zu ἁπλότης καρδίας, den finalen ἵνα-Satz sowie die drei Gaben Gottes insgesamt zutreffend wieder. „auch euch“ entspricht dem im griechischen Text überlieferten καὶ ὑμῖν. Das konkrete Bild des Segens „auf eure Häupter“ bleibt erhalten.
  naturalness: „in aufrichtigem Herzen“ ist im modernen Standarddeutsch nicht idiomatisch. „in Lauterkeit des Herzens“ ist eine natürliche, würdige und verständliche Wiedergabe, die die ungeteilte bzw. lautere Haltung von ἁπλότης besser ausdrückt. „bei Josef“ ist im Schlussvergleich klarer als „an Josef“ und näher an ἐν Ἰωσήφ.
  terminology: „Gnade“, „Herrlichkeit“ und „Segen“ entsprechen χάρις, δόξα und εὐλογία angemessen. „Josef“ ist die übliche deutsche Namensform. Die Unterscheidung „Eifersucht“ und „Neid“ kann für ζῆλος und φθόνος beibehalten werden.
