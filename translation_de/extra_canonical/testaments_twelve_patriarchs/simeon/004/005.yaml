  - severity: low
    issue: Schlussformulierung „an Josef“
    rationale: „bei Josef“ ist im Deutschen die klarere Formulierung für das an Joseph beobachtete Beispiel und bildet ἐν Ἰωσήφ angemessen ab.
  revised_text: Darum hütet euch, meine Kinder, vor jeder Eifersucht und jedem Neid und lebt in Lauterkeit des Herzens, damit Gott auch euch Gnade, Herrlichkeit und Segen auf eure Häupter gebe, wie ihr es bei Josef gesehen habt.
