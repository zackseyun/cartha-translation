base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/005.yaml
  text: Therefore guard yourselves, my children, from every jealousy and envy, and walk in simplicity of heart, so that God may also give you grace and glory and blessing upon your heads, just as you saw in Joseph.
translation:
  language: de
  text: Darum hütet euch, meine Kinder, vor jeder Eifersucht und jedem Neid und lebt in Lauterkeit des Herzens, damit Gott auch euch Gnade, Herrlichkeit und Segen auf eure Häupter gebe, wie ihr es bei Josef gesehen habt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: hütet euch
  rationale: Gibt den reflexiven Imperativ natürlich und mit dem Gedanken wachsamer Selbstbewahrung wieder.
- source_word: παντὸς ζήλου καὶ φθόνου
  choice: vor jeder Eifersucht und jedem Neid
  rationale: Unterscheidet ζῆλος als Eifersucht von φθόνος als Neid und bewahrt die umfassende Aussage.
- source_word: πορεύεσθε
  choice: lebt
  rationale: Das wörtliche Bild des Gehens bezeichnet hier die Lebensführung; „lebt“ ist im modernen Deutsch natürlich.
- source_word: ἐν ἁπλότητι καρδίας
  choice: in aufrichtigem Herzen
  rationale: ἁπλότης bezeichnet hier eine ungeteilte, lautere Haltung; „aufrichtig“ vermeidet die moderne Nebenbedeutung mangelnder Klugheit bei „Einfalt“.
- source_word: χάριν
  choice: Gnade
  rationale: Entspricht dem religiösen Kontext und wahrt die Nähe zum griechischen Begriff.
- source_word: ἐπὶ τὰς κεφαλὰς ὑμῶν
  choice: auf eure Häupter
  rationale: Bewahrt das konkrete Segensbild des Ausgangstextes in würdigem Register.
- source_word: ἐν Ἰωσήφ
  choice: an Josef
  rationale: Idiomatiches Deutsch für das an Josefs Beispiel sichtbar gewordene Handeln Gottes.
theological_decisions:
- issue: Verhältnis menschlicher Lebensführung zur Gabe Gottes
  choice: „damit Gott auch euch … gebe“
  alternative: „sodass Gott auch euch … gibt“
  rationale: Der finale Sinn von ἵνα mit Konjunktiv wird bewahrt, ohne daraus einen mechanischen Verdienstzusammenhang abzuleiten.
- issue: Bedeutung von χάρις
  choice: „Gnade“
  alternative: „Gunst“
  rationale: „Gnade“ entspricht der theologischen Tragweite und der revidierten englischen Konsultationsfassung, ohne den Begriff weiter zu bestimmen.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die direkte Anrede und das biblische Segensbild „auf eure Häupter“ bleiben erhalten; unnötige Archaismen werden vermieden.
