source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ὅτι⁵⁸ ἀγριοῖ τοῦτο⁵⁹ τὴν ψυχήν⁶⁰, καὶ φθείρει *τὸ σῶμα⁶¹, *ὀργὴν καὶ πόλεμον παρέχει τῷ διαβουλίῳ⁶², καὶ εἰς⁶³ αἵματα⁶⁴ παροξύνει, καὶ εἰς ἔκστασιν ἄγει⁶⁵ *τὴν διάνοιαν⁶⁶, καὶ κλόνον⁶⁹ παρέχει τῇ ψυχῇ⁷⁰ καὶ τρόμον τῷ σώματι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/008.yaml
  text: For this makes the soul savage, and destroys the body; it brings anger and war into one’s plans, and provokes to bloodshed, and leads the mind into frenzy, and gives the soul upheaval and the body trembling.
translation:
  language: de
  text: Denn dies macht die Seele wild und richtet den Körper zugrunde; es bringt Zorn und Krieg in die Überlegungen, reizt zum Blutvergießen, führt den Verstand in Raserei und bringt der Seele Erschütterung und dem Körper Zittern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγριοῖ
  choice: macht … wild
  rationale: Gibt die kausative Bedeutung des Verbs unmittelbar und in natürlichem Deutsch wieder, ohne die seelische Verrohung abzuschwächen.
- source_word: φθείρει
  choice: richtet … zugrunde
  rationale: Bewahrt den starken Sinn von Verderben oder Zerstören und klingt im Zusammenhang mit dem Körper idiomatisch.
- source_word: τῷ διαβουλίῳ
  choice: im Denken
  rationale: Das seltene Wort bezeichnet den Bereich des Überlegens oder Planens. „Im Denken“ wahrt diesen inneren Bezug, ohne die unsichere Nuance zu eng auf konkrete Pläne festzulegen.
- source_word: εἰς αἵματα
  choice: zum Blutvergießen
  rationale: Der griechische Plural „Blut(taten)“ ist eine idiomatische Bezeichnung für gewaltsames Blutvergießen.
- source_word: ἔκστασιν
  choice: Raserei
  rationale: Im negativen Kontext bezeichnet das Wort einen Zustand, in dem der Verstand außer sich gerät; „Raserei“ trifft dies besser als das heute oft positiv verstandene „Ekstase“.
- source_word: κλόνον
  choice: Aufruhr
  rationale: Vermittelt die innere Erschütterung und Unruhe der Seele und erhält die Parallelität zum körperlichen Zittern.
- source_word: τρόμον
  choice: Zittern
  rationale: Natürliche und genaue Wiedergabe der körperlichen Reaktion.
theological_decisions:
- issue: Bezug von τῷ διαβουλίῳ
  choice: als innerer Bereich des Denkens verstanden
  alternative: „dem Planenden“ beziehungsweise „dem Ratgeber“ als personale Bezeichnung
  rationale: Der unmittelbare Zusammenhang beschreibt Auswirkungen auf Seele, Verstand und Körper. Daher liegt ein Bezug auf Überlegung beziehungsweise Denken näher; die seltene Wortform lässt jedoch eine gewisse lexikalische Unsicherheit bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer rhythmischer Reihung. Die drastische psychische und körperliche Wirkung des zuvor genannten Lasters wird ohne konfessionelle oder interpretative Zusätze wiedergegeben.
