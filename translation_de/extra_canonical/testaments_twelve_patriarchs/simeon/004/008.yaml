  to: Denn dies macht die Seele wild und richtet den Körper zugrunde; es bringt Zorn und Krieg in die Überlegungen, reizt zum Blutvergießen, führt den Verstand in Raserei und bringt der Seele Erschütterung und dem Körper Zittern.
  rationale: Die Revision ersetzt das zu schwache „Streit“ durch „Krieg“, präzisiert den Bezug von τῷ διαβουλίῳ als Bereich der Überlegungen und gibt κλόνος ohne die sozialpolitische Nebenbedeutung von „Aufruhr“ wieder. Die mögliche negative Bedeutung von ἔκστασις wird weiterhin idiomatisch durch „Raserei“ ausgedrückt.
