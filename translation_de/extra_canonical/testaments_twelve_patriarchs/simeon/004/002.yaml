id: T12P.SIM.4.2
reference: Testament of Simeon 4:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 80-92, Simeon pilot)
  text: Ἐπένθουν γὰρ *παρὰ πάντας⁷ ὅτι ἐγὼ ἤμην⁸ αἴτιος *τῆς πράσεως⁹ Ἰωσήφ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/002.yaml
  text: For I was grieving more than all the others, because I was responsible for the sale of Joseph.
translation:
  language: de
  text: Denn ich trauerte mehr als alle anderen, weil ich für den Verkauf Josefs verantwortlich war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπένθουν
  choice: ich trauerte
  rationale: Das Imperfekt bezeichnet einen andauernden Zustand des Trauerns; „trauerte“ ist natürlich und wahrt die emotionale Stärke des griechischen Verbs.
- source_word: παρὰ πάντας
  choice: mehr als alle anderen
  rationale: παρά mit Akkusativ drückt hier einen Vergleich aus. „Alle anderen“ macht im Deutschen deutlich, dass Simeon sich mit den übrigen Beteiligten vergleicht.
- source_word: αἴτιος
  choice: verantwortlich
  rationale: Das Wort bezeichnet hier denjenigen, der die Ursache beziehungsweise maßgebliche Verantwortung trägt, ohne den Grad der Alleinschuld über den Text hinaus festzulegen.
- source_word: τῆς πράσεως Ἰωσήφ
  choice: für den Verkauf Josefs
  rationale: πρᾶσις bedeutet in diesem Kontext „Verkauf“; der deutsche Genitiv „Josefs“ gibt das Objekt des Verkaufs idiomatisch wieder.
theological_decisions:
- issue: Ausmaß von Simeons Schuld
  choice: „verantwortlich“
  alternative: „der Urheber“ oder „schuld“
  rationale: Die Formulierung bewahrt Simeons ausdrückliches Eingeständnis ursächlicher Verantwortung, behauptet aber weder Alleinschuld noch eine genauer bestimmte Führungsrolle, die der Satz selbst nicht eindeutig festlegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kausale Verknüpfung mit „Denn“ und „weil“ sowie die vergleichende Aussage des griechischen Textes bleiben klar erhalten.
