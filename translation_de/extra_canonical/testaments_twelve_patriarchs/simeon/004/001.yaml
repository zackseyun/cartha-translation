base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/001.yaml
  text: My father kept asking about me, because he had seen me gloomy, and I said to him, “My liver is swollen.”
translation:
  language: de
  text: 'Mein Vater fragte immer wieder nach mir[a], weil er gesehen hatte, dass ich bedrückt war. Ich sagte ihm: »Meine Leber ist angeschwollen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „nach mir“ übersetzt die in der zugrunde gelegten griechischen Ausgabe eingeklammerte Lesart „περὶ ἐμοῦ“ („über mich / nach mir“).
    reason: Kennzeichnet die im Quelltext durch Klammern ausgewiesene textliche Unsicherheit, ohne sie inhaltlich aufzulösen.
lexical_decisions:
- source_word: ἐρωτῶν περὶ ἐμοῦ
  choice: fragte immer wieder nach mir
  rationale: Das durative Partizip Präsens wird im Zusammenhang mit dem fortlaufenden Geschehen idiomatisch wiedergegeben; περὶ ἐμοῦ bedeutet hier, dass der Vater sich nach Simeons Befinden erkundigte.
- source_word: σκυθρωπόν
  choice: bedrückt
  rationale: Das Wort bezeichnet ein düsteres, niedergeschlagenes Erscheinungsbild; »bedrückt« ist natürlich und lässt sowohl Gemütszustand als auch sichtbaren Ausdruck anklingen.
- source_word: ἔλεγον αὐτῷ
  choice: Ich sagte zu ihm
  rationale: Das Imperfekt wird hier als begleitende Erzählhandlung wiedergegeben. Ein wiederholtes Sagen ist möglich, wird vom Kontext aber nicht zwingend verlangt.
- source_word: τὰ ἤπατά μου ὀγκοῦμαι
  choice: Meine Leber ist angeschwollen
  rationale: Die griechische Formulierung ist grammatisch auffällig und spricht wörtlich von den Leberpartien beziehungsweise der Leber in einer Pluralform. Gemeint ist erkennbar eine Schwellung der Leber; die deutsche Einzahl ist die natürliche anatomische Ausdrucksweise.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Der einleitende Anschluss δέ wird nicht eigens mit »nun« wiedergegeben, da er hier vor allem den Erzählfluss markiert. Die direkte Rede bleibt knapp und körperlich konkret.
