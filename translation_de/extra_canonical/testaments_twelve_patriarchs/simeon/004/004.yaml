base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/004/004.yaml
  text: But Joseph was a good man, and having the Spirit of God in him, being compassionate and merciful, he did not hold a grudge against me, but loved me along with my brothers.
translation:
  language: de
  text: Josef aber war ein guter Mann. Er hatte den Geist Gottes in sich und war mitfühlend und barmherzig. Er trug mir nichts nach, sondern liebte mich zusammen mit meinen Brüdern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθὸς ἀνήρ
  choice: ein guter Mann
  rationale: Gibt die geläufige moralische Charakterisierung direkt und natürlich wieder.
- source_word: ἔχων πνεῦμα θεοῦ ἐν αὐτῷ
  choice: Er hatte den Geist Gottes in sich
  rationale: Bewahrt den possessiven Partizipialsinn und die räumliche Wendung, ohne die im Griechischen nicht ausdrücklich bezeichnete Kausalität hinzuzufügen.
- source_word: εὔσπλαγχνος καὶ ἐλεήμων
  choice: mitfühlend und barmherzig
  rationale: Unterscheidet herzliches Mitgefühl von tätiger Barmherzigkeit und klingt im modernen Standarddeutsch natürlich.
- source_word: οὐκ ἐμνησικάκησέν με
  choice: Er trug mir nichts nach
  rationale: Die idiomatische deutsche Wendung trifft den Sinn, erlittenes Unrecht nicht nachtragend festzuhalten.
- source_word: ἠγάπησέ με σὺν τοῖς ἀδελφοῖς μου
  choice: liebte mich ebenso wie meine Brüder
  rationale: Gibt die Einbeziehung Simeons zusammen mit seinen Brüdern klar wieder, ohne eine zusätzliche Aussage über Gegenseitigkeit oder Intensität einzutragen.
theological_decisions:
- issue: Verhältnis zwischen dem Geist Gottes und Josefs Mitgefühl
  choice: Die Aussagen werden nebeneinandergestellt, ohne ausdrückliche Kausalverknüpfung.
  alternative: „Weil der Geist Gottes in ihm war, war er mitfühlend …“
  rationale: Die griechischen Partizipien können sachlich zusammengehören, markieren aber keine ausdrückliche Kausalrelation. Diese Offenheit bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange griechische Satzperiode ist zur besseren Verständlichkeit in drei Sätze gegliedert; die logische Abfolge und alle inhaltlichen Aussagen bleiben erhalten.
