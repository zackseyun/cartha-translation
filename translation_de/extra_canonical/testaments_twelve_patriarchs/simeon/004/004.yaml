  source_fidelity: Die Wiedergabe von ἀγαθὸς ἀνήρ, πνεῦμα θεοῦ ἐν αὐτῷ, εὔσπλαγχνος καὶ ἐλεήμων und οὐκ ἐμνησικάκησέν με ist sachgerecht. Die Aufteilung der griechischen Partizipialkette in selbstständige deutsche Sätze ist ohne Sinnverlust möglich und fügt keine Kausalbeziehung hinzu.
  naturalness: Der Text ist modernes, würdevolles Standarddeutsch. „Er trug mir nichts nach“ ist idiomatisch. „Zusammen mit meinen Brüdern“ ist im vorliegenden Zusammenhang natürlich und klar.
