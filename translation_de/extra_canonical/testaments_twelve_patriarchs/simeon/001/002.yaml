lexical_decisions:
- source_word: Ἀρρωστοῦντος
  choice: Als … krank war
  rationale: Die Genitivus-absolute-Konstruktion wird als natürlicher deutscher Temporalsatz wiedergegeben.
- source_word: ἐπισκέψασθαι
  choice: um ihn zu besuchen
  rationale: Gibt den finalen Infinitiv und die Bedeutung des persönlichen Aufsuchens klar und idiomatisch wieder.
- source_word: ἐνισχύσας
  choice: nahm seine Kräfte zusammen
  rationale: Bewahrt den Gedanken, dass der kranke Simeon sich stärkte beziehungsweise seine verbliebene Kraft aufbot.
- source_word: ἐκάθισε
  choice: setzte sich auf
  rationale: Im Zusammenhang mit dem Krankenbesuch ist das Aufrichten zum Sitzen im Deutschen die natürliche, kontextgerechte Wiedergabe.
- source_word: κατεφίλησεν
  choice: küsste sie innig
  rationale: Das intensive Verb καταφιλέω bezeichnet herzliches oder wiederholtes Küssen; „innig“ vermittelt die Intensität, ohne eine konkrete Zahl von Küssen festzulegen.
