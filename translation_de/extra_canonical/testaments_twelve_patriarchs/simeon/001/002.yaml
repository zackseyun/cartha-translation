  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/001/002.yaml
  text: 'And when Simeon was sick, his sons came to visit him; and gathering his strength, he sat up, kissed them[b], and said:'
translation:
  language: de
  text: 'Als Simeon krank war, kamen seine Söhne, um ihn zu besuchen. Er nahm seine Kräfte zusammen, setzte sich auf, küsste sie innig[a] und sagte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann ein inniges oder wiederholtes Küssen bezeichnen.
