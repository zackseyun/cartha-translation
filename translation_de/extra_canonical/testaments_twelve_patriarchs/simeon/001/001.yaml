lexical_decisions:
- source_word: Ἀντίγραφον λόγων
  choice: Eine Abschrift der Worte
  rationale: Ἀντίγραφον bezeichnet eine Abschrift beziehungsweise schriftliche Wiedergabe; die formale Verbindung mit λόγων bleibt erhalten.
- source_word: πρὸ τοῦ ἀποθανεῖν αὐτόν
  choice: bevor er starb
  rationale: Natürliche moderne Wiedergabe des griechischen substantivierten Infinitivs ohne Bedeutungsverlust.
- source_word: ἐν ἑκατοστῷ εἰκοστῷ ἔτει τῆς ζωῆς αὐτοῦ
  choice: im hundertzwanzigsten Jahr seines Lebens
  rationale: Bewahrt die Altersangabe als Lebensjahr und vermeidet die leicht abweichende Formulierung „im Alter von 120 Jahren“.
- source_word: ἐν ᾧ χρόνῳ
  choice: zu der Zeit, als
  rationale: Idiومatische deutsche Wiedergabe der zeitlichen Verknüpfung.
