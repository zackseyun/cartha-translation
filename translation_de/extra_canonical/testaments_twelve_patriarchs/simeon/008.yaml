revisions:
- from: '8 Als Simeon seinen Söhnen seine letzten Weisungen gegeben hatte, entschlief er und wurde mit seinen Vätern vereint. Er war hundertzwanzig Jahre alt.


    2 Sie legten ihn in einen hölzernen Sarg, um seine Gebeine nach Hebron hinaufzubringen. Während eines Krieges der Ägypter brachten sie sie heimlich hinauf.[a]


    3 Denn die Ägypter verwahrten Josefs Gebeine in den Gräbern der Könige.[b] 4 Ihre Beschwörer sagten ihnen nämlich: Wenn Josefs Gebeine das Land verlassen, werden Finsternis, Dunkel und eine schwere Plage über das ganze Land der Ägypter kommen.[c] Dann wird niemand seinen Bruder erkennen können, selbst wenn er eine Lampe bei sich hat.'
  to: '8 Als Simeon seinen Söhnen Anweisungen gegeben hatte, entschlief er bei seinen Vätern. Er war hundertzwanzig Jahre alt.


    2 Sie legten ihn in einen hölzernen Sarg, um seine Gebeine nach Hebron hinaufzubringen. Während eines Krieges der Ägypter brachten sie sie heimlich hinauf.[a]


    3 Denn die Ägypter verwahrten Josefs Gebeine in den Gräbern der Könige.[b] 4 Ihre Beschwörer sagten ihnen nämlich: Bei der Herausführung von Josefs Gebeinen[c] werden Finsternis, Dunkel und eine schwere Plage über das ganze Land der Ägypter kommen. Dann wird niemand seinen Bruder erkennen können, selbst wenn er eine Lampe bei sich hat.'
  rationale: 'Die Revision beseitigt die einzige sachlich relevante Einengung: Die griechische „ἐξοδος“ der Gebeine wird als Herausführung wiedergegeben, nicht als ausdrücklich behauptetes Verlassen des Landes. Die Todesformel wird außerdem enger am Wortlaut und idiomatisch biblisch formuliert. Die Fußnoten bleiben vollständig erhalten; der Querverweis steht nun unmittelbar bei Josefs Gebeinen, auf die er sich bezieht.'
  reviewer_model: gpt-5.6-terra
