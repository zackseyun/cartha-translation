base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/008.yaml
  text: 'And when Simeon had finished commanding his sons[a], he fell asleep with his fathers, being one hundred and twenty years old.


    And they placed him in a wooden coffin, to bring up his bones to Hebron. And they brought them up secretly during a war of the Egyptians.


    For the Egyptians were keeping the bones of Joseph in the tombs of the kings, so as to bring him up. For the enchanters were telling them that, when Joseph’s bones went out, there would be over all the land darkness and gloom and a great plague for the Egyptians[c][b], so that even with a lamp each man would not recognize his brother.'
translation:
  language: de
  text: '8 Als Simeon seinen Söhnen Anweisungen gegeben hatte, entschlief er bei seinen Vätern. Er war hundertzwanzig Jahre alt.


    2 Sie legten ihn in einen hölzernen Sarg, um seine Gebeine nach Hebron hinaufzubringen. Während eines Krieges der Ägypter brachten sie sie heimlich hinauf.[a]


    3 Denn die Ägypter verwahrten Josefs Gebeine in den Gräbern der Könige.[b] 4 Ihre Beschwörer sagten ihnen nämlich: Bei der Herausführung von Josefs Gebeinen[c] werden Finsternis, Dunkel und eine schwere Plage über das ganze Land der Ägypter kommen. Dann wird niemand seinen Bruder erkennen können, selbst wenn er eine Lampe bei sich hat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Formulierung ist gedrängt. Sie kann auch bedeuten: „heimlich während eines ägyptischen Krieges“ oder „heimlich während eines Krieges unter den Ägyptern“.'
    reason: alternative_reading
  - marker: b
    text: 'Die Textüberlieferung ist hier schwierig. Einige Textzeugen lesen „Vorratskammern“ statt „Gräbern“; dann hieße es: „Die Ägypter verwahrten Josefs Gebeine in den Vorratskammern der Könige.“'
    reason: textual_variant
  - marker: c
    text: Vergleiche 1. Mose 50,25 und 2. Mose 13,19 zur Mitnahme von Josefs Gebeinen.
    reason: cross_reference
lexical_decisions:
- source_word: συνετέλεσεν … ἐντελλόμενος
  choice: seine letzten Weisungen gegeben hatte
  rationale: Gibt den Abschluss der väterlichen Anordnungen natürlich und mit ihrer autoritativen Färbung wieder; „letzten“ ergibt sich aus der testamentarischen Abschiedsszene.
- source_word: ἐκοιμήθη μετὰ τῶν πατέρων αὐτοῦ
  choice: entschlief er und wurde mit seinen Vätern vereint
  rationale: Bewahrt sowohl den traditionellen Todeseuphemismus als auch die biblisch geprägte Wendung, ohne sie schlicht zu „starb“ einzuebnen.
- source_word: θήκῃ ξυλίνῃ
  choice: hölzernen Sarg
  rationale: Im Bestattungskontext ist „Sarg“ die klare und natürliche deutsche Bezeichnung für das hölzerne Behältnis.
- source_word: τοῦ ἀναγαγεῖν τὰ ὀστᾶ αὐτοῦ
  choice: um seine Gebeine nach Hebron hinaufzubringen
  rationale: „Hinaufbringen“ erhält den Richtungssinn von ἀνάγω; „Gebeine“ wahrt den würdigen biblischen Ton.
- source_word: ἐν πολέμῳ Αἰγυπτίων κρυφῇ
  choice: Während eines Krieges der Ägypter brachten sie sie heimlich hinauf
  rationale: Bewahrt sowohl Kriegssituation als auch Heimlichkeit, ohne die syntaktisch gedrängte griechische Formulierung historisch zu vereindeutigen.
- source_word: ἐφύλαττον
  choice: verwahrten
  rationale: Drückt die fortdauernde, möglicherweise bewachte Aufbewahrung aus, ohne stärker als der Kontext „bewachen“ festzulegen.
- source_word: μνήμασι τῶν βασιλέων
  choice: in den Gräbern der Könige
  rationale: Folgt dem vorliegenden griechischen Text in seinem naheliegenden funerären Sinn; die textkritische Alternative wird in einer Fußnote festgehalten.
- source_word: ἐπαοιδοί
  choice: Beschwörer
  rationale: Bezeichnet treffend Personen, die Beschwörungsformeln oder Zaubersprüche verwenden, und passt in den antiken Kontext.
- source_word: σκότος καὶ γνόφος
  choice: Finsternis, Dunkel
  rationale: Erhält die emphatische Häufung zweier naher Begriffe und den gehobenen Ton, ohne sie zu einem einzigen Ausdruck zusammenzuziehen.
- source_word: πληγὴ μεγάλη
  choice: eine schwere Plage
  rationale: „Plage“ entspricht im ägyptischen Gerichtskontext der umfassenden Heimsuchung; „schwere“ klingt im modernen Deutschen natürlicher als „große“.
theological_decisions:
- issue: Todesformel ἐκοιμήθη
  choice: entschlief
  alternative: starb; wurde zur Ruhe gelegt
  rationale: Die konventionelle Umschreibung des Todes bleibt als literarisch und theologisch gewichtige Bildsprache erhalten, ohne daraus eine weitergehende Lehrentscheidung abzuleiten.
- issue: Formel μετὰ τῶν πατέρων αὐτοῦ
  choice: wurde mit seinen Vätern vereint
  alternative: bei seinen Vätern; bei seinen Vorfahren
  rationale: Die traditionelle Zugehörigkeits- und Todesformel wird verständlich wiedergegeben. „Väter“ wahrt den biblischen Klang, während das Verb im Deutschen einen vollständigen Satz ermöglicht.
- issue: Schwierige Überlieferung zu Josefs Gebeinen
  choice: Die Ägypter verwahrten die Gebeine in den Gräbern der Könige, weil die Beschwörer vor ihrem Weggang warnten
  alternative: Vorratskammern statt Gräber; abweichende Rekonstruktion des gedrängten Zusammenhangs
  rationale: Die Übersetzung folgt dem gelieferten griechischen Haupttext und wahrt dessen kausalen Zusammenhang, dokumentiert aber die echte textliche und syntaktische Unsicherheit in den Fußnoten.
- issue: Reichweite von ἐν πάσῃ τῇ γῇ
  choice: über das ganze Land der Ägypter
  alternative: über die ganze Erde
  rationale: Der unmittelbare Bezug auf die Ägypter und der Exodus-Kontext sprechen für Ägypten als gemeintes Land; die Formulierung vermeidet eine kosmische Ausweitung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst biblisch geprägten Schlüsselwörtern wie „entschlief“, „Väter“ und „Gebeine“. Die Sätze sind für heutige Leser klar gegliedert. Textkritische und syntaktische Unsicherheiten werden nicht in der Hauptübersetzung geglättet, sondern knapp in den Fußnoten offengelegt.
