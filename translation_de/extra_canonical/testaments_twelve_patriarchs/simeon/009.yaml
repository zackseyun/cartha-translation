  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/simeon/009.yaml
  text: And the sons of Simeon wept for their father[c][b][a]. And they were in Egypt until the day of their departure by the hand of Moses.
translation:
  language: de
  text: 9 Und die Söhne Simeons weinten um ihren Vater. Und sie waren in Ägypten bis zum Tag ihres Auszugs[a] durch die Hand des Mose[b].[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bis zum Tag ihres Fortgangs“. Das Wort kann hier zugleich auf den Auszug aus Ägypten anspielen.'
    reason: lexical_alternative
  - marker: b
    text: „Durch die Hand des Mose“ ist eine biblische Wendung und bedeutet „durch Mose“ beziehungsweise unter seiner Vermittlung oder Führung.
    reason: cultural_note
  - marker: c
    text: 'Im Quellentext schließt sich unmittelbar die Überschrift des nächsten Werkes an: „Das Testament Levis, des dritten Sohnes Jakobs und Leas.“ Sie gehört nicht zu Simeon 9.'
    reason: textual_variant
lexical_decisions:
- source_word: ἔκλαυσαν
  choice: beweinten
  rationale: Der Aorist von κλαίω bezeichnet Weinen oder Klagen. „Beweinten“ gibt im Deutschen natürlich wieder, dass ihr Weinen dem verstorbenen Vater galt, ohne förmliche Trauerriten vorauszusetzen.
- source_word: υἱοὶ
  choice: Söhne
  rationale: Im patriarchalischen und genealogischen Zusammenhang entspricht „Söhne“ dem konkreten Sinn genauer als das allgemeinere „Kinder“.
- source_word: εἰς Αἴγυπτον
  choice: in Ägypten
  rationale: Obwohl εἰς gewöhnlich eine Richtung ausdrückt, bezeichnet es hier mit ἦσαν idiomatisch den Ort ihres fortdauernden Aufenthalts.
- source_word: ἕως ἡμέρας ἐξόδου αὐτῶν
  choice: bis zum Tag ihres Auszugs
  rationale: ἔξοδος kann „Ausgang“, „Fortgang“ oder „Auszug“ bedeuten. „Auszug“ bewahrt sowohl den gewöhnlichen Ereignissinn als auch die erkennbare Anspielung auf den Auszug aus Ägypten, ohne daraus einen Buchtitel zu machen.
- source_word: ἐν χειρὶ Μωϋσῆ
  choice: durch die Hand des Mose
  rationale: Die Wendung ist ein biblischer Ausdruck für Vermittlung oder Handlungsvollmacht. Die weitgehend wörtliche Wiedergabe bewahrt den Schriftklang; ihre Bedeutung wird in einer Fußnote erläutert.
theological_decisions:
- issue: Ob ἐξόδου als Eigenname oder Buchtitel wiederzugeben ist
  choice: Als gewöhnliches Substantiv „Auszug“ in Kleinschreibung
  alternative: „Exodus“ oder „der Exodus“
  rationale: Der griechische Text verwendet ein gewöhnliches Substantiv und kennzeichnet keinen Buchtitel. Der Bezug auf das geschichtliche Ereignis bleibt durch Ägypten und Mose deutlich.
- issue: Wie wörtlich das Idiom ἐν χειρὶ Μωϋσῆ wiederzugeben ist
  choice: „durch die Hand des Mose“
  alternative: „durch Mose“ oder „unter der Führung des Mose“
  rationale: Die bildhafte biblische Ausdrucksweise wird erhalten, ohne sie auf eine einzelne Deutung wie bloße Leiterschaft festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht biblischem Klang. Die zweimalige Satzöffnung mit „Und“ bildet die parataktische Struktur des griechischen Textes ab. „Mose“ folgt der heute üblichen deutschen Namensform; „durch die Hand“ bewahrt bewusst das semitisch-biblische Idiom.
