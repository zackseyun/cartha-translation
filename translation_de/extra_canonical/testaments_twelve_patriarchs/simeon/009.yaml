    issue: „beweinten ihren Vater“ ist gegenüber κλαίω leicht interpretierend.
    rationale: Das deutsche Verb kann die Bedeutung auf Trauer bzw. Totenklage verdichten. „weinten um ihren Vater“ gibt die konkrete Handlung des Weinens wieder und lässt den Kontext offen, ohne etwas über förmliche Trauerformen festzulegen.
