source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 2. Ὅτι καίγε³ ἐπʼ ἐσχάτων τῶν⁴ ἡμερῶν ὁ Θεὸς ἀποστελεῖ⁵ *τὰ σπλάγχνα⁶ αὐτοῦ ἐπὶ τῆς⁷ γῆς, καὶ ὅπου εὕρῃ σπλάγχνα ἐλέους, ἐν αὐτῷ κατοικεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/002.yaml
  text: For indeed in the last days God will send his compassion upon the earth, and wherever he finds compassion of mercy, there he dwells.
translation:
  language: de
  text: Denn in den letzten Tagen wird Gott sein Erbarmen auf die Erde senden; und wo immer er einen Menschen voller Erbarmen findet, in ihm wohnt er.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ σπλάγχνα αὐτοῦ
  choice: sein Erbarmen
  rationale: Wörtlich bezeichnet σπλάγχνα die Eingeweide als Sitz tiefer Regungen; im Kontext ist Gottes inniges Mitgefühl beziehungsweise Erbarmen gemeint. „Sein Erbarmen“ gibt dies natürlich und würdig wieder.
- source_word: σπλάγχνα ἐλέους
  choice: ein von Barmherzigkeit erfülltes Herz
  rationale: Die wörtliche Verbindung „Eingeweide der Barmherzigkeit“ wäre im modernen Deutschen missverständlich. „Herz“ bewahrt die körperbezogene Metapher für den inneren Sitz des Mitgefühls, während „von Barmherzigkeit erfüllt“ den Genitiv ἐλέους ausdrückt.
- source_word: κατοικεῖ
  choice: wohnt er
  rationale: Das Präsens bezeichnet Gottes bleibende Gegenwart bei einem barmherzigen Menschen; „wohnt“ erhält die konkrete Wohnmetaphorik.
- source_word: ἐπʼ ἐσχάτων τῶν ἡμερῶν
  choice: in den letzten Tagen
  rationale: Entspricht der geläufigen eschatologischen Zeitangabe, ohne ihre genaue zeitliche Einordnung näher festzulegen.
theological_decisions:
- issue: Bezug von ἐν αὐτῷ
  choice: „dort wohnt er“, bezogen auf den Menschen mit einem barmherzigen Herzen
  alternative: „in ihm wohnt er“ oder ein Bezug auf das Erbarmen selbst
  rationale: Das maskuline αὐτῷ legt einen personalen Bezug nahe. „Dort“ ist im Deutschen idiomatisch und bewahrt zugleich einen gewissen Spielraum zwischen der Person und ihrem Inneren.
- issue: Art des göttlichen Wohnens
  choice: Die Aussage bleibt als „wohnt er“ uneingeschränkt stehen.
  alternative: Abschwächungen wie „ist er gegenwärtig“ oder dogmatische Präzisierungen
  rationale: Der griechische Text verwendet die starke Wohnmetaphorik und erklärt weder deren Modus noch deren dogmatische Voraussetzungen.
translation_notes:
  register: Modernes, allgemein verständliches und zugleich würdevolles Standarddeutsch. Die schwer übertragbare antike Eingeweidemetaphorik wird an der ersten Stelle semantisch mit „Erbarmen“ und an der zweiten bildhaft mit „Herz“ wiedergegeben; dadurch bleibt die Wiederaufnahme des Motivs inhaltlich erkennbar, ohne unnatürlich zu klingen.
