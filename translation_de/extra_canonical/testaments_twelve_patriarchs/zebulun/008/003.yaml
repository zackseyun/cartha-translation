  text: 3. Ὅσον γὰρ⁸ ἄνθρωπος σπλαγχνίζεται εἰς *τὸν πλησίον αὐτοῦ⁹, τοσοῦτον *καὶ ὁ⁴ Κύριος εἰς αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/003.yaml
  text: For as much as a man has compassion on his neighbor, so much also the Lord has compassion on him.
translation:
  language: de
  text: Denn in dem Maß, wie ein Mensch mit seinem Nächsten Erbarmen hat, hat auch der Herr Erbarmen mit ihm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπλαγχνίζεται
  choice: Erbarmen hat
  rationale: Das Verb bezeichnet tief empfundenes Mitgefühl beziehungsweise Erbarmen. „Erbarmen haben“ ist im Deutschen natürlich und bewahrt die ethische wie theologische Entsprechung beider Satzhälften.
- source_word: ὁ Κύριος
  choice: der Herr
  rationale: Die übliche und würdige Wiedergabe von κύριος in einer Aussage über Gottes Erbarmen.
- source_word: ὁ πλησίον αὐτοῦ
  choice: sein Nächster
  rationale: Bewahrt den traditionsreichen biblischen Beziehungsbegriff und gibt das Possessivpronomen ausdrücklich wieder.
- source_word: ὅσον … τοσοῦτον
  choice: in dem Maß, wie …
  rationale: Gibt die proportionale Wechselbeziehung der griechischen Korrelativkonstruktion klar und idiomatisch wieder.
theological_decisions:
- issue: Verhältnis zwischen menschlichem und göttlichem Erbarmen
  choice: Die proportionale Formulierung wird ohne Abschwächung beibehalten.
  alternative: 'Freier: „Wie ein Mensch … so …“, ohne den ausdrücklichen Maßgedanken.'
  rationale: Der griechische Text stellt eine direkte Entsprechung des Maßes heraus. Die Übersetzung bewahrt diese theologische Spannung, ohne zu erklären, ob damit Bedingung, Vergeltung oder Entsprechung gemeint ist.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Die Wiederholung von „Erbarmen hat“ bildet bewusst die Parallelität des griechischen Satzes ab.
