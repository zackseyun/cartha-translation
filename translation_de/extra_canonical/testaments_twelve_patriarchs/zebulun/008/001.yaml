source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: VIII. Καὶ ὑμεῖς οὖν, τέκνα μου, ἔχετε εὐσπλαγχνίαν *κατὰ παντὸς ἀνθρώπου¹ ἐν ἐλέει, ἵνα καὶ ὁ Κύριος *εἰς ὑμᾶς σπλαγχνισθεὶς² ἐλεήσῃ ὑμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/001.yaml
  text: And so, my children, have compassion toward every person in mercy, so that the Lord also, having compassion on you, may show you mercy.
translation:
  language: de
  text: Darum, meine Kinder, erweist jedem Menschen barmherziges Mitgefühl, damit auch der Herr, der sich euer erbarmt, euch Barmherzigkeit erweist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐσπλαγχνίαν
  choice: Erbarmen
  rationale: Gibt die innere, herzliche Anteilnahme in natürlichem und würdevollem Deutsch wieder.
- source_word: κατὰ παντὸς ἀνθρώπου
  choice: mit jedem Menschen
  rationale: Die Verbindung mit »Erbarmen haben« verlangt im Deutschen »mit«; παντός wird umfassend als »jedem« wiedergegeben.
- source_word: ἐν ἐλέει
  choice: und begegnet ihm barmherzig
  rationale: 'Vermeidet das unnatürliche »in Barmherzigkeit«, bewahrt aber den modalen Sinn: Das Erbarmen soll sich in barmherzigem Handeln gegenüber jedem Menschen zeigen.'
- source_word: σπλαγχνισθεὶς
  choice: sich euer erbarmt
  rationale: Gibt das mitfühlende Erbarmen des Herrn idiomatisch wieder; der vorzeitige beziehungsweise begleitende Partizipialsinn bleibt im Zusammenhang offen.
- source_word: ἐλεήσῃ
  choice: euch Barmherzigkeit erweist
  rationale: Unterscheidet das abschließende ἐλεέω sprachlich von σπλαγχνίζομαι und bringt die tätige Zuwendung zum Ausdruck.
theological_decisions:
- issue: Verhältnis zwischen menschlicher Barmherzigkeit und Gottes Erbarmen
  choice: mit »damit« als Ziel- oder Folgebeziehung wiedergegeben
  alternative: eine rein verdienstliche Bedingung formulieren
  rationale: ἵνα bezeichnet eine Ziel- oder Folgebeziehung. Der Text verbindet menschliches und göttliches Erbarmen eng, erklärt aber nicht ausdrücklich einen verdienstlichen Mechanismus; diese Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Ton. Die zweimalige Nennung von Erbarmen/Barmherzigkeit bewahrt die rhetorische und theologische Wortfeldverknüpfung des griechischen Textes, ohne eine unnatürliche wörtliche Formulierung zu erzwingen.
