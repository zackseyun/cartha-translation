source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 5. Εἰς¹⁴ ὃν *προσέχοντες καὶ ὑμεῖς, τέκνα μου ἀγαπᾶτε ἀλλήλους¹⁵, καὶ μὴ λογίζεσθε¹⁶ ἕκαστος *κακίαν πρὸς τὸν ἀδελφὸν¹⁷ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/005.yaml
  text: Paying attention to him, you also, my children, love one another, and let each one not reckon evil against his brother.
translation:
  language: de
  text: Indem ihr auf ihn achtet, liebt auch ihr, meine Kinder, einander, und keiner von euch soll Böses gegen seinen Bruder hegen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰς ὃν προσέχοντες
  choice: Richtet auch ihr euren Blick auf ihn
  rationale: προσέχειν mit εἰς bezeichnet hier aufmerksame Hinwendung zu einer Person. Die imperativische Wiedergabe bildet die syntaktische Verbindung zum folgenden Aufruf im natürlichen Deutschen ab, ohne den Bezug von ὃν näher zu bestimmen.
- source_word: ἀγαπᾶτε ἀλλήλους
  choice: liebt einander
  rationale: Direkte und idiomatische Entsprechung des gegenseitigen Liebesgebots.
- source_word: μὴ λογίζεσθε ἕκαστος κακίαν
  choice: denkt nicht jeder Böses
  rationale: λογίζεσθε kann ein inneres Erwägen, Anrechnen oder Planen bezeichnen. „Böses denken“ bewahrt die offene Bedeutung und klingt im Deutschen verständlich, ohne sie auf bloße Buchführung oder konkrete Anschlagsplanung zu verengen.
- source_word: πρὸς τὸν ἀδελφὸν αὐτοῦ
  choice: gegen seinen Bruder
  rationale: πρός bezeichnet die feindlich gerichtete Haltung; „gegen“ gibt diese Beziehung knapp und natürlich wieder.
theological_decisions:
- issue: Bezug des männlichen Relativpronomens ὃν
  choice: „ihn“ ohne ausdrückliche Identifizierung
  alternative: Den gemeinten Referenten namentlich einsetzen
  rationale: Der vorgelegte Vers nennt den Referenten nicht. Die Übersetzung bewahrt deshalb den textinternen Rückverweis und vermeidet eine aus dem Kontext oder einer Auslegung ergänzte Festlegung.
- issue: Bedeutungsumfang von κακίαν und λογίζεσθε
  choice: „Böses denken“
  alternative: „Bosheit anrechnen“ oder „Böses planen“
  rationale: Der griechische Ausdruck lässt sowohl feindseliges Sinnen als auch das Zurechnen von Bösem anklingen. Die gewählte Formulierung erhält diese ethische Weite möglichst offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede „meine Kinder“ und die koordinierte Mahnrede bleiben erhalten. Keine Fußnoten erforderlich.
