source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 6. Ὅτι τοῦτο⁷ χωρίζει ἑνότητα¹⁸, καὶ Γπᾶσαν συγγένειαν˥¹⁹ διασκορπίζει²⁰, Γκαὶ τὴν ψυχὴν ταράσσει˥²¹ καὶ τὸ πρόσωπον ἀφανίζει²².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008/006.yaml
  text: For this divides unity, and scatters every kinship, and troubles the soul, and disfigures the face.
translation:
  language: de
  text: Denn dies spaltet die Einheit, zerstreut jede Verwandtschaft, beunruhigt die Seele und entstellt das Gesicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χωρίζει ἑνότητα
  choice: spaltet die Einheit
  rationale: Gibt die trennende Wirkung des Verbs χωρίζει natürlich und prägnant wieder; der artikellose abstrakte Ausdruck ἑνότητα wird im Deutschen idiomatisch mit bestimmtem Artikel formuliert.
- source_word: πᾶσαν συγγένειαν διασκορπίζει
  choice: zerstreut jede Verwandtschaft
  rationale: Bewahrt sowohl die umfassende Aussage von πᾶσαν als auch das Bild des Zerstreuens in διασκορπίζει. „Verwandtschaft“ lässt offen, ob die verwandtschaftliche Gemeinschaft oder die Gesamtheit der Verwandten gemeint ist.
- source_word: τὴν ψυχὴν ταράσσει
  choice: beunruhigt die Seele
  rationale: „Beunruhigt“ vermittelt die innere Erschütterung von ταράσσει in verständlichem, würdigem Deutsch, ohne sie unnötig zu verstärken.
- source_word: τὸ πρόσωπον ἀφανίζει
  choice: entstellt das Gesicht
  rationale: Im Zusammenhang mit dem Gesicht bezeichnet ἀφανίζει eine sichtbare Beeinträchtigung oder Verunstaltung; „entstellt“ ist natürlicher als eine wörtliche Wiedergabe wie „lässt verschwinden“.
theological_decisions: []
