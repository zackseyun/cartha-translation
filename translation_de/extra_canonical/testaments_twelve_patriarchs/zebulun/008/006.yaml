  source_fidelity: Der Entwurf gibt die vier Prädikate und ihre Objekte vollständig und in der Reihenfolge des griechischen Textes wieder. „spaltet die Einheit“ entspricht χωρίζει ἑνότητα; „zerstreut jede Verwandtschaft“ wahrt die umfassende, ohne weitere Kontextvorgabe offene συγγένεια; „beunruhigt die Seele“ trifft ταράσσει; und „entstellt das Gesicht“ gibt ἀφανίζει im hier durch πρόσωπον bestimmten Sinn idiomatisch wieder. Die englische Audit-Fassung wird ebenfalls sachgerecht getroffen.
  naturalness: Modernes, klares Standarddeutsch mit passender knapper, parataktischer Satzführung. Die Wiederholung der Verbfolge bildet den griechischen Stil gut ab. „Denn dies“ ist als rückverweisender Anschluss natürlich.
  terminology: „Einheit“, „Verwandtschaft“, „Seele“ und „Gesicht“ sind sachlich, registergerecht und frei von konfessioneller Einengung. Insbesondere lässt „Verwandtschaft“ den Umfang von συγγένεια angemessen offen.
