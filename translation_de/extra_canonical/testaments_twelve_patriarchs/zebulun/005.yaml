  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005.yaml
  text: 'And they said to Jacob[a], “Recognize, then, whether this is your son’s tunic.” And they did so. For they stripped Joseph of the tunic when they were selling him, and clothed him in a servant’s garment. And Simeon took the tunic and did not want to give it. For he wanted to cut him down with the sword, being angry because he had not killed him. But we all rose up and said to him, “If you do not give the tunic, we will tell our father that you alone did this evil thing in Israel.” And so he gave it to them.


    And now, my children, I command you to guard your neighbor and to have compassion toward all, not only among people, but also toward unreasoning animals. For because of these things the Lord blessed me, and when all my brothers were sick, I passed through without illness. For the Lord knows each person’s purpose. Have mercy, therefore, in your hearts[b], because whatever a person does to his neighbor, so the Lord also will do with him. For the sons of my brothers were sick and were dying because of Joseph, because they had not shown mercy in their hearts; but my sons were kept free from sickness, as you know.


    And when I was in the land of Canaan, by the seashore, I used to catch fish[c] for Jacob my father, and when many were being choked in the sea, I came through unharmed[d].'
translation:
  language: de
  text: 'Und sie sagten zu Jakob: „Sieh genau hin: Ist das das Gewand deines Sohnes?“[a] Und sie taten es. Denn sie zogen Josef das Gewand aus, als sie ihn verkauften, und zogen ihm ein Sklavengewand an. Simeon aber nahm das Gewand und wollte es nicht hergeben; denn er wollte Josef mit dem Schwert niederhauen, weil er zornig darüber war, dass er ihn nicht getötet hatte. Da standen wir alle auf und sagten zu ihm: „Wenn du das Gewand nicht hergibst, werden wir unserem Vater sagen, dass du allein diese böse Tat in Israel begangen hast.“ So gab er es ihnen. Und sie taten, was Dan gesagt hatte.


    5 1 Und nun, meine Kinder, gebiete ich euch, die Gebote des Herrn zu halten, eurem Mitmenschen Barmherzigkeit zu erweisen und mit allen Mitgefühl zu haben – nicht nur mit den Menschen, sondern auch mit den vernunftlosen Tieren. 2 Dafür hat der Herr mich gesegnet: Als alle meine Brüder krank waren, blieb ich von Krankheit verschont. Denn der Herr kennt die Absicht eines jeden Menschen. 3 Seid deshalb von Herzen barmherzig,[b] denn was ein Mensch seinem Mitmenschen tut, das wird der Herr auch ihm tun. 4 Die Söhne meiner Brüder wurden krank und lagen im Sterben wegen Josef, weil sie in ihrem Innersten keine Barmherzigkeit hatten. Meine Söhne dagegen blieben von Krankheit verschont, wie ihr wisst.


    5 Als ich im Land Kanaan an der Meeresküste war, fing ich für meinen Vater Jakob Meerestiere,[c] und als viele im Meer erstickten, blieb ich unversehrt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische χιτών kann je nach Zusammenhang auch mit „Untergewand“ oder „Leibrock“ wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „Habt Barmherzigkeit in euren Eingeweiden.“ Im Griechischen gelten die inneren Organe als Sitz tiefen Mitgefühls.'
    reason: cultural_note
  - marker: c
    text: 'Wörtlich: „Ich jagte Beute.“ Der Zusammenhang an der Meeresküste deutet auf den Fang von Fischen oder anderen Meerestieren.'
    reason: lexical_alternative
lexical_decisions:
- source_word: χιτών
  choice: Gewand
  rationale: χιτών bezeichnet ein am Körper getragenes Kleidungsstück. „Gewand“ ist im Deutschen würdig und verständlich; eine Fußnote hält die genaueren Alternativen „Untergewand“ und „Leibrock“ sichtbar.
- source_word: ἱμάτιον δουλικόν
  choice: Sklavengewand
  rationale: δουλικός bezeichnet ausdrücklich, was zu einem Sklaven gehört; der rechtliche und soziale Status darf nicht zu „Diener“ abgeschwächt werden.
- source_word: φυλάσσειν τὰς ἐντολὰς Κυρίου
  choice: die Gebote des Herrn zu halten
  rationale: Der griechische Text fordert ausdrücklich das Halten beziehungsweise Bewahren der Gebote des Herrn. Diese im englischen Konsultationstext ausgefallene Aussage wird nach dem Original wiedergegeben.
- source_word: εὐσπλαγχνίαν
  choice: Mitgefühl
  rationale: Das Wort bezeichnet herzliches Erbarmen oder inniges Mitgefühl; „Mitgefühl“ ist gegenwärtiges, natürliches Deutsch.
- source_word: ἀλόγοις ζώοις
  choice: vernunftlosen Tieren
  rationale: Die wörtliche Gegenüberstellung von Menschen und nicht vernunftbegabten Lebewesen bleibt sichtbar, ohne das altertümlichere „unvernünftige Tiere“ zu wählen.
- source_word: προαίρεσιν
  choice: Absicht
  rationale: προαίρεσις kann den bewussten Entschluss, die sittliche Wahl oder innere Absicht bezeichnen. „Absicht“ bewahrt den Bezug zur inneren Haltung, ohne ihn dogmatisch festzulegen.
- source_word: ἔλεος ἐν σπλάγχνοις
  choice: von Herzen barmherzig / in ihrem Innersten Barmherzigkeit
  rationale: σπλάγχνα meint wörtlich die inneren Organe und idiomatisch den Sitz tiefen Mitgefühls. Die variierte deutsche Wiedergabe ist natürlich und erhält durch die Fußnote das konkrete griechische Bild.
- source_word: ἐθήρευον θήραν
  choice: fing ich Meerestiere
  rationale: Wörtlich steht „jagte ich Beute“. Der Küsten- und Meereskontext legt Fang von Meerestieren nahe; „Meerestiere“ vermeidet die unbelegte Verengung ausschließlich auf Fische.
- source_word: ἀβλαβὴς διέμενον
  choice: blieb ich unversehrt
  rationale: Die Wendung bezeichnet fortdauernde Unversehrtheit und wird knapp und idiomatisch wiedergegeben.
theological_decisions:
- issue: Vergeltender Grundsatz in 5,3
  choice: „was ein Mensch seinem Mitmenschen tut, das wird der Herr auch ihm tun“
  alternative: „so wird der Herr mit ihm verfahren“
  rationale: Die schroffe Gegenseitigkeit des griechischen Satzes wird nicht zu einem allgemeinen Sprichwort abgeschwächt oder theologisch erklärt.
- issue: Ethische Fürsorge für Tiere in 5,1
  choice: Mitgefühl ausdrücklich auch mit „vernunftlosen Tieren“
  alternative: allgemeine Aufforderung zu umfassendem Mitgefühl
  rationale: Der griechische Text erweitert den ethischen Horizont ausdrücklich über Menschen hinaus; diese auffällige Aussage bleibt erhalten.
- issue: Krankheit und Tod „wegen Josef“ in 5,4
  choice: kausale Formulierung ohne nähere Erklärung
  alternative: „wegen dessen, was ihre Väter Josef angetan hatten“
  rationale: διὰ Ἰωσήφ ist knapp und mehrdeutig. Die Übersetzung fügt keine ausdrückliche Deutung hinzu, die der Text selbst nicht ausspricht.
translation_notes:
  register: 'Modernes, würdevolles Standarddeutsch mit klarer erzählerischer Syntax. Die Übersetzung folgt dem griechischen Ausgangstext auch dort, wo die englische Konsultationsfassung abweicht: Besonders in 5,1 werden sowohl das Halten der Gebote des Herrn als auch die Barmherzigkeit gegenüber dem Mitmenschen wiedergegeben. „Mitmensch“ bietet für πλησίον eine natürliche, geschlechtsübergreifende Formulierung. Die Kapitel- und Verszahlen markieren den eigentlichen Beginn von Testament des Sebulon 5 innerhalb des mitgelieferten Kontextes.'
