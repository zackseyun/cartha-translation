    **1** Nachdem man ihn in die Grube geworfen hatte,[a] setzten sich meine Brüder hin, um zu essen und zu trinken. **2** Ich aber hatte Mitleid mit Josef und aß nicht, sondern hielt mich bei der Grube wachsam, denn Juda fürchtete, Simeon, Dan und Gad könnten aufspringen und ihn töten.[b] **3** Als sie sahen, dass ich nicht aß, bestimmten sie mich dazu, ihn zu bewachen, bis er an die Ismaeliten verkauft wurde. **4** Er verbrachte drei Tage und drei Nächte in der Grube; dann wurde er verkauft, ohne etwas gegessen zu haben.[c]


    **5** Als Ruben kam und hörte, dass Josef in seiner Abwesenheit verkauft worden war, zerriss er sein Gewand. Trauernd sagte er: »Wie soll ich meinem Vater Jakob noch unter die Augen treten?« **6** Er nahm das Silber und lief den Händlern nach. Doch er fand sie nicht und kehrte voller Schmerz zurück. Die Händler hatten nämlich die breite Straße verlassen und waren auf einem kürzeren Weg durch das Gebiet der Troglodyten gezogen.[d] **7** Ruben war tief betrübt und aß an jenem Tag kein Brot.


    Da trat Dan zu ihm und sagte: **8** »Weine nicht und sei nicht betrübt! Wir wissen, was wir unserem Vater sagen können. **9** Lasst uns einen Ziegenbock mit dem Messer schlachten, Josefs Gewand mit seinem Blut beflecken und es Jakob schicken. Dazu wollen wir sagen: ›Sieh genau hin: Ist das das Gewand deines Sohnes?‹« Und so taten sie es.'
