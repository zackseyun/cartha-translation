source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 9. Καὶ⁶⁴ πάλιν ⌈ἐν *τῇ πανουργίᾳ⁶⁵ *τῶν ἔργων⁶⁶ ὑμῶν⁶⁷⌉ παροργίσετε⁶⁸ αὐτόν, καὶ ἀπορριφήσεσθε⁶⁹ ⌈ἀπ᾽ αὐτοῦ⌉⁷⁰ ἕως καιροῦ συντελείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/004.yaml
  text: And again, in the craftiness of your works you will provoke him, and you will be cast away from him until the time of completion.
translation:
  language: de
  text: Und wieder werdet ihr ihn in der Arglist eurer Werke zum Zorn reizen, und ihr werdet von ihm verstoßen werden bis zur Zeit der Vollendung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πανουργίᾳ
  choice: Arglist
  rationale: Gibt die negative Bedeutung von List, Verschlagenheit oder skrupelloser Schlauheit in einem würdigen, heute verständlichen Ausdruck wieder.
- source_word: ἔργων
  choice: Taten
  rationale: Im Zusammenhang mit moralischem Handeln ist „Taten“ natürlicher als das formal mögliche „Werke“, ohne den Sinn abzuschwächen.
- source_word: παροργίσετε
  choice: werdet ... erzürnen
  rationale: Bewahrt den kausativen Sinn „zum Zorn reizen“ knapp und idiomatisch.
- source_word: ἀπορριφήσεσθε ἀπ᾽ αὐτοῦ
  choice: ihr werdet von ihm verstoßen werden
  rationale: Gibt sowohl das passive Wegwerfen beziehungsweise Verstoßen als auch die Trennung „von ihm“ wieder.
- source_word: καιροῦ συντελείας
  choice: Zeit der Vollendung
  rationale: Folgt der offenen eschatologischen Formulierung und legt nicht fest, ob ein allgemeiner Abschluss oder das Ende eines bestimmten Zeitabschnitts gemeint ist.
theological_decisions:
- issue: Bezug von αὐτόν / αὐτοῦ
  choice: Das männliche Pronomen bleibt als „ihn/von ihm“ unbestimmt.
  alternative: Den Referenten ausdrücklich als Gott benennen.
  rationale: Der vorgelegte Vers nennt den Referenten nicht; eine ausdrückliche Identifikation würde die im Ausschnitt vorhandene Anapher interpretierend auflösen.
- issue: Bedeutung von συντέλεια
  choice: „Vollendung“
  alternative: „Ende“ oder „Abschluss“
  rationale: „Vollendung“ wahrt sowohl den Gedanken eines Endpunkts als auch den eines zum Ziel kommenden Geschehens und vermeidet eine unnötig enge eschatologische Festlegung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am griechischen Ausgangstext, während „Taten“ und „Arglist“ für gewöhnliche Leser natürlich und klar sind.
