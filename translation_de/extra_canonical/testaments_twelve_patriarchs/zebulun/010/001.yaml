base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/001.yaml
  text: And you will return to your land, and you will see him in Jerusalem because of his holy name.
translation:
  language: de
  text: Und ihr werdet in euer Land zurückkehren und ihn in Jerusalem sehen um seines heiligen Namens willen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστρέψετε
  choice: ihr werdet … zurückkehren
  rationale: Das Futur bezeichnet die angekündigte Rückkehr; „zurückkehren“ gibt die räumliche Bedeutung im Zusammenhang natürlich wieder.
- source_word: ὄψεσθε αὐτόν
  choice: ihr werdet ihn … sehen
  rationale: Bewahrt das männliche Pronomen und die direkte Aussage des griechischen Textes, ohne den nicht ausdrücklich genannten Bezug zu ergänzen.
- source_word: διὰ τὸ ὄνομα αὐτοῦ τὸ ἅγιον
  choice: um seines heiligen Namens willen
  rationale: Die idiomatische, würdige deutsche Wendung erhält den kausalen Sinn von διά mit Akkusativ und lässt die im Ausgangstext bestehende Deutungsspannung bestehen.
theological_decisions:
- issue: Identität des mit αὐτόν bezeichneten „ihn“
  choice: Das Pronomen bleibt ohne erklärenden Zusatz stehen.
  alternative: Den Bezug ausdrücklich als Gott, den Herrn oder eine messianische Gestalt benennen.
  rationale: Der vorgelegte Vers nennt den Bezug nicht ausdrücklich; eine Identifizierung würde über den griechischen Wortlaut hinausgehen.
- issue: Bedeutung von „um seines heiligen Namens willen“
  choice: Die kausale Formulierung wird ohne Auslegung bewahrt.
  alternative: „wegen der Heiligkeit seines Namens“ oder eine Aussage über Verehrung beziehungsweise Offenbarung ergänzen.
  rationale: Der Text gibt lediglich den heiligen Namen als Grund an und lässt die genaue theologische Beziehung offen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Stil. Die leicht feierliche Wendung „um … willen“ entspricht dem religiösen Register und bildet die griechische Kausalphrase präzise ab.
