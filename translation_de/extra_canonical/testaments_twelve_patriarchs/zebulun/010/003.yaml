  terminology: „Völker“, „Eifersucht“, „Gott“, „Herr“ und „Menschengestalt“ sind sachgerecht. „Menschengestalt“ gibt σχῆμα angemessen wieder, ohne eine weitergehende christologische Deutung einzutragen.
