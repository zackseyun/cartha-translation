source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: '(bdg-text expansion: καὶ ἐπιστρέψει *πάντα τὰ⁶⁰ ἔθνη εἰς παραζήλωσιν αὐτοῦ⁶¹, καὶ ὄψεσθε *θεὸν ἐν σχήματι ἀνθρώπου⁶² *ὃν ἂν ἐκλέξηται Κύριος Ἱερουσαλὴμ ὄνομα αὐτῷ⁶³.)'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/003.yaml
  text: And he will turn all the nations to his jealousy, and you will see God in human form, whom the Lord will choose for him—Jerusalem is his name.
translation:
  language: de
  text: Und er wird alle Völker zur Eifersucht auf ihn bewegen,[a] und ihr werdet Gott in Menschengestalt sehen, den auch immer der Herr erwählen wird – Jerusalem ist sein Name.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zum Nacheifern um ihn“ beziehungsweise „zu seinem Eifer“. Das griechische παραζήλωσις kann Eifersucht, neidisches Nacheifern oder Eifer ausdrücken; auch die Beziehung von „sein/ihn“ bleibt mehrdeutig.'
    reason: Bewahrt die echte lexikalische und syntaktische Mehrdeutigkeit der Wendung εἰς παραζήλωσιν αὐτοῦ.
  - marker: b
    text: 'Der griechische Wortlaut ist hier ungewöhnlich und lautet wörtlich etwa: „den auch immer der Herr erwählen wird; Jerusalem – Name ihm“. Der gesamte hier wiedergegebene Wortlaut ist in der zugrunde gelegten Edition als Erweiterung bestimmter griechischer Textzeugen gekennzeichnet.'
    reason: Macht sowohl die schwierige Syntax der Namensangabe als auch den in der verwendeten Ausgabe vermerkten textkritischen Status transparent.
lexical_decisions:
- source_word: ἐπιστρέψει
  choice: wird … bewegen
  rationale: Das Verb bedeutet grundsätzlich „wenden/umkehren“. Mit εἰς und dem abstrakten Ziel παραζήλωσιν gibt „zu … bewegen“ die gerichtete Wirkung in natürlichem Deutsch wieder.
- source_word: πάντα τὰ ἔθνη
  choice: alle Völker
  rationale: ἔθνη bezeichnet hier die nicht näher unterschiedenen Völker; „Völker“ ist im Deutschen idiomatischer und traditionsgemäß passend.
- source_word: εἰς παραζήλωσιν αὐτοῦ
  choice: zur Eifersucht auf ihn
  rationale: παραζήλωσις kann Eifersucht, neidisches Nacheifern oder Eifer bezeichnen. Der Genitiv αὐτοῦ lässt sich objektiv auf die Person beziehen; die Fußnote bewahrt die semantische Mehrdeutigkeit.
- source_word: θεὸν ἐν σχήματι ἀνθρώπου
  choice: Gott in Menschengestalt
  rationale: σχῆμα bezeichnet die sichtbare Gestalt oder Erscheinungsform; „Menschengestalt“ ist knapp, würdig und vermeidet die unnötige Festlegung auf einen männlichen Erwachsenen.
- source_word: ἐκλέξηται
  choice: erwählen wird
  rationale: Der Aorist Konjunktiv mit ἄν steht in einem indefinit-relativen Zusammenhang; im deutschen Zukunftskontext ist „erwählen wird“ natürlich, ohne die Wahlhandlung weiter auszudeuten.
- source_word: Ἱερουσαλὴμ ὄνομα αὐτῷ
  choice: Jerusalem ist sein Name
  rationale: Die verblosen griechischen Worte werden als Nominalsatz wiedergegeben; αὐτῷ entspricht idiomatisch dem deutschen Besitzverhältnis „sein Name“.
theological_decisions:
- issue: Gott in menschlicher Gestalt
  choice: Die unmittelbare Aussage „ihr werdet Gott in Menschengestalt sehen“ wird beibehalten.
  alternative: Die Formulierung christologisch oder als bloße Repräsentation Gottes auszudeuten.
  rationale: Der griechische Text identifiziert oder erklärt die Gestalt nicht weiter. Die Übersetzung bewahrt daher die starke Aussage und ihre theologische Spannung.
- issue: Bezugswort des Relativpronomens ὃν
  choice: „den“ wird grammatisch auf „Gott in Menschengestalt“ bezogen.
  alternative: Einen unausgesprochenen menschlichen Erwählten als neues Bezugswort einzuführen.
  rationale: Das maskuline ὃν stimmt mit θεόν überein und folgt unmittelbar darauf; eine zusätzliche Person steht nicht ausdrücklich im Text.
- issue: „Jerusalem ist sein Name“
  choice: Die überraschende Namensangabe wird unverändert als Aussage über den Erwählten wiedergegeben.
  alternative: „Jerusalem“ als Subjekt der Erwählung, Ort oder nachträgliche Glosse umzudeuten.
  rationale: Der überlieferte Wortlaut ist syntaktisch ungewöhnlich, erlaubt aber am direktesten den Nominalsatz „Jerusalem ist sein Name“. Eine harmonisierende Deutung würde über den Text hinausgehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt bewusst nah am Griechischen, während „zu … bewegen“ und „Menschengestalt“ für natürliche Verständlichkeit sorgen. Ungewöhnliche Aussagen werden nicht konfessionell harmonisiert, sondern im Haupttext bewahrt und in den Fußnoten erläutert.
