  terminology: „Meine Kinder“, „traurig“, „sterbe“, „zusammenbrechen“ und „an mein Ende komme“ sind moderne standardsprachliche und registergerechte Entsprechungen. Es liegen keine theologischen Fachbegriffe oder problematischen Namen vor.
