  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/005.yaml
  text: And now, my children, do not be grieved that I am dying, nor fall down that I am coming to my end.
translation:
  language: de
  text: Und nun, meine Kinder, seid nicht traurig darüber, dass ich sterbe, und brecht nicht zusammen darüber, dass ich an mein Ende komme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: meine Kinder
  rationale: Gibt die familiäre Anrede natürlich und unmittelbar wieder.
- source_word: μὴ λυπεῖσθε
  choice: seid nicht traurig
  rationale: Entspricht dem Sinn von λυπέομαι in verständlichem, gegenwärtigem Deutsch, ohne die emotionale Aussage zu verstärken.
- source_word: μηδὲ συμπέσητε
  choice: und brecht nicht zusammen
  rationale: συμπίπτω bezeichnet hier bildhaft ein Zusammenbrechen oder Zusammenstürzen; die deutsche Wendung bewahrt sowohl die körperliche Bildlichkeit als auch den möglichen emotionalen Sinn.
- source_word: ἀπολήγω
  choice: an mein Ende komme
  rationale: Bewahrt die Umschreibung des griechischen Verbs und den Parallelismus zum Sterben, ohne beide Aussagen vollständig gleichzusetzen.
