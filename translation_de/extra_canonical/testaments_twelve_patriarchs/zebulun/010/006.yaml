source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 2. Ἀναστήσομαι γὰρ⁴ πάλιν *ἐν μέσῳ⁵ ὑμῶν, ⌈ὡς ἡγούμενος *ἐν μέσῳ⁶ υἱῶν δικαιοσύνης⌉, καὶ⁷ εὐφρανθήσομαι⁸ *ἐν μέσῳ⁹ τῆς φυλῆς μου, *οἵτινες φυλάξουσιν¹⁰ νόμον Κυρίου [καὶ ἐντολὰς¹¹ Ζαβουλὼν πατρὸς αὐτῶν].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/006.yaml
  text: For I will rise again in your midst, as a leader in the midst of the sons of righteousness; and I will rejoice in the midst of my tribe, those who keep the law of the Lord and the commandments of Zebulun their father.
translation:
  language: de
  text: Denn ich werde wieder auferstehen in eurer Mitte, als Anführer inmitten der Söhne der Gerechtigkeit, und ich werde mich freuen unter den Angehörigen meines Stammes, die das Gesetz des Herrn und die Gebote ihres Vaters Sebulon bewahren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „und die Gebote ihres Vaters Sebulon“ sind in der griechischen Textausgabe als textkritisch unsicher gekennzeichnet.
    reason: Kennzeichnet die eckig geklammerte Schlussphrase der vorgelegten griechischen Edition.
lexical_decisions:
- source_word: Ἀναστήσομαι … πάλιν
  choice: ich werde wieder auferstehen
  rationale: Gibt sowohl den Zukunftsbezug als auch πάλιν („wieder“) wieder; „auferstehen“ bewahrt den möglichen eschatologischen Klang von ἀνίστημι.
- source_word: ἡγούμενος
  choice: Anführer
  rationale: Bezeichnet hier eine leitende Person; „Anführer“ ist verständlich und bewahrt die personale Führungsrolle.
- source_word: υἱῶν δικαιοσύνης
  choice: Söhne der Gerechtigkeit
  rationale: Bewahrt die semitisch geprägte Genitivverbindung, ohne sie deutend zu „Gerechten“ zu glätten.
- source_word: εὐφρανθήσομαι
  choice: ich werde mich freuen
  rationale: Natürliche deutsche Wiedergabe der zukünftigen Freude.
- source_word: φυλάξουσιν
  choice: bewahren
  rationale: Trifft den Sinn von aufmerksam einhalten bzw. hüten und passt sowohl zu „Gesetz“ als auch zu „Geboten“.
theological_decisions:
- issue: Bedeutung von ἀναστήσομαι πάλιν
  choice: wieder auferstehen
  alternative: wieder auftreten / sich wieder erheben
  rationale: Die Formulierung lässt eine Auferstehungsaussage erkennen, ohne deren genaue Art oder Zeitpunkt näher festzulegen.
- issue: Identität der „Söhne der Gerechtigkeit“
  choice: wörtliche Bezeichnung beibehalten
  alternative: die Gerechten
  rationale: Die bildhafte Gruppenbezeichnung wird nicht konfessionell oder christologisch vereindeutigt.
- issue: Textkritisch markierter Schlusszusatz
  choice: im Haupttext aufgenommen und in einer Fußnote kenntlich gemacht
  alternative: aus dem Haupttext auslassen
  rationale: Die bereitgestellte griechische Textfassung enthält die Worte, markiert sie jedoch als textkritisch unsicher; beides soll sichtbar bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache Wendung ἐν μέσῳ wird sinngemäß variiert („in eurer Mitte“, „inmitten“, „unter“), um die Wiederholung erkennbar zu halten und zugleich natürliches Deutsch zu bieten. „Angehörige meines Stammes“ macht den pluralischen Bezug des folgenden Relativsatzes eindeutig.
