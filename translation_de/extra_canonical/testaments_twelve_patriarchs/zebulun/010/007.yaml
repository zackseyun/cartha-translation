  text: 3. Ἐπὶ δὲ τοὺς ἀσεβεῖς ἐπάξει¹² Κύριος πῦρ αἰώνιον, καὶ ἀπολεῖ¹³ αὐτοὺς *ἕως γενεὰς γενεῶν¹⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/007.yaml
  text: But upon the ungodly the Lord will bring eternal fire, and he will destroy them for generations of generations.
translation:
  language: de
  text: Über die Gottlosen aber wird der Herr ewiges Feuer bringen, und er wird sie bis in Generationen von Generationen hinein vernichten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσεβεῖς
  choice: die Gottlosen
  rationale: Gibt die religiös-ethische Bedeutung von ἀσεβής in natürlichem, würdigem Deutsch wieder.
- source_word: ἐπάξει
  choice: wird … bringen
  rationale: Entspricht dem futurischen Sinn von ἐπάγω; die Satzstellung wurde für natürliches Deutsch angepasst.
- source_word: πῦρ αἰώνιον
  choice: ewiges Feuer
  rationale: Formnahe und im Deutschen geläufige Wiedergabe ohne zusätzliche Auslegung der Dauer oder Wirkung.
- source_word: ἀπολεῖ
  choice: wird … vernichten
  rationale: Bewahrt die starke Bedeutung von ἀπόλλυμι im aktiven Futur und vermeidet eine Abschwächung zu bloßem Schaden.
- source_word: ἕως γενεὰς γενεῶν
  choice: von Generation zu Generation
  rationale: Gibt die idiomatische Folge unbestimmt vieler Generationen verständlich wieder; die ungewöhnliche griechische Formulierung wird nicht zu einer ausdrücklichen Ewigkeitsaussage harmonisiert.
theological_decisions:
- issue: Verhältnis von »ewigem Feuer« zur Dauer der Vernichtung
  choice: 'Beide Aussagen bleiben nebeneinander stehen: »ewiges Feuer« und »von Generation zu Generation«.'
  alternative: Die Vernichtung ausdrücklich als ewig oder als nur zeitweilig deuten.
  rationale: Der griechische Text verwendet unterschiedliche Formulierungen; die Übersetzung bewahrt diese Spannung, ohne sie systematisch aufzulösen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, klar verständlichem Register. Der einleitende Gegensatz δέ wird mit »Doch« markiert; die doppelte Zukunftsaussage des griechischen Textes bleibt erhalten.
