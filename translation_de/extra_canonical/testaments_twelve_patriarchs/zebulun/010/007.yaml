revisions:
- from: Doch über die Gottlosen wird der Herr ewiges Feuer bringen, und er wird sie vernichten von Generation zu Generation.
  to: Über die Gottlosen aber wird der Herr ewiges Feuer bringen, und er wird sie bis in Generationen von Generationen hinein vernichten.
  rationale: »Über … aber« bildet die Stellung und den Kontrast von Ἐπὶ δὲ ab. Die Wiedergabe »bis in Generationen von Generationen hinein« erhält sowohl ἕως als auch die auffällige Wiederholung des griechischen Ausdrucks. Sie legt weder eine bestimmte Dauer noch eine theologische Harmonisierung mit »ewigem Feuer« fest.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:05:04Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die zentralen Begriffe und beide Futurformen zutreffend wieder. »von Generation zu Generation« ist jedoch keine hinreichend genaue Wiedergabe von ἕως γενεὰς γενεῶν: Es lässt ἕως (»bis/ bis hinein in«) aus und ersetzt die auffällige Konstruktion »Generationen von Generationen« durch eine deutsche Formel mit anderer Nuance.'
  naturalness: Der Satz ist insgesamt modernes, würdiges Standarddeutsch. Die revidierte Schlussformulierung bleibt absichtlich leicht markiert, weil auch die griechische Zeitformel ungewöhnlich und semantisch nicht weiter aufzulösen ist.
  terminology: »die Gottlosen«, »der Herr«, »ewiges Feuer« und »vernichten« sind sachgerecht. »Vernichten« bewahrt die starke Aussage von ἀπολεῖ, ohne eine über den Wortlaut hinausgehende systematische Deutung festzulegen.
  issues:
  - severity: medium
    issue: Die Zeitangabe ἕως γενεὰς γενεῶν ist in »von Generation zu Generation« nicht vollständig abgebildet.
    rationale: Die Übersetzung gibt weder das begrenzende/erstreckende ἕως noch die genitivische, intensivierende Formulierung γενεὰς γενεῶν wieder. Eine Revision sollte die ungewöhnliche Formulierung sichtbar lassen, statt sie zu einer glatten, anders akzentuierten Redensart zu harmonisieren.
  revised_text: Über die Gottlosen aber wird der Herr ewiges Feuer bringen, und er wird sie bis in Generationen von Generationen hinein vernichten.
