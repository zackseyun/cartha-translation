source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 5. Ὑμεῖς δὲ φοβεῖσθε Κύριον¹⁹ [τὸν θεὸν ἡμῶν²⁰ ἐν πάσῃ ἰσχύι ὑμῶν²¹ πάσας τὰς²² ἡμέρας τῆς ζωῆς ὑμῶν]²³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/009.yaml
  text: But you, fear the Lord our God with all your strength all the days of your life.
translation:
  language: de
  text: Ihr aber sollt den Herrn fürchten,[a] [unseren Gott, mit all eurer Kraft, alle Tage eures Lebens].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Fürchtet aber ihr den Herrn.'
    reason: Verdeutlicht die imperative Form und die betonte Stellung von „ihr“, ohne im Haupttext unnatürliches Deutsch zu erzeugen.
  - marker: b
    text: Die Worte „unseren Gott, mit all eurer Kraft, alle Tage eures Lebens“ sind in der griechischen Ausgabe als textkritisch unsicher gekennzeichnet.
    reason: Dokumentiert die durch die eckigen Klammern der Quellenausgabe angezeigte Überlieferungsunsicherheit.
lexical_decisions:
- source_word: φοβεῖσθε
  choice: sollt ... fürchten
  rationale: Der griechische Imperativ bezeichnet hier ehrfürchtige Gottesfurcht und zugleich eine verbindliche Aufforderung; die deutsche Formulierung ist natürlich und wahrt beides.
- source_word: ἐν πάσῃ ἰσχύι ὑμῶν
  choice: mit all eurer Kraft
  rationale: Gibt die instrumentale Wendung eng am griechischen Wortlaut und in geläufigem Deutsch wieder.
- source_word: πάσας τὰς ἡμέρας τῆς ζωῆς ὑμῶν
  choice: alle Tage eures Lebens
  rationale: Bewahrt den umfassenden zeitlichen Sinn und die feierliche Ausdrucksweise des Ausgangstextes.
theological_decisions:
- issue: Bedeutung von Gottesfurcht
  choice: den Herrn fürchten
  alternative: Ehrfurcht vor dem Herrn haben
  rationale: Die direkte Wiedergabe erhält die biblisch-theologische Spannung von Ehrfurcht, Gehorsam und Furcht, statt sie auf einen einzelnen Aspekt festzulegen.
- issue: Textkritischer Status der Erweiterung
  choice: Die eingeklammerte Passage wird im Haupttext beibehalten und durch eine Fußnote gekennzeichnet.
  alternative: Nur „Ihr aber sollt den Herrn fürchten.“
  rationale: Die Edition markiert den gesamten Zusatz als textkritisch unsicher. Seine Aufnahme entspricht der konsultierten Fassung, während die Fußnote die echte Überlieferungsunsicherheit offenlegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Ihr aber“ bewahrt den Kontrast; „mit all eurer Kraft“ und „alle Tage eures Lebens“ bleiben bewusst nah an der feierlichen griechischen Formulierung.
