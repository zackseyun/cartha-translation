source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 6. Καὶ ταῦτα εἰπὼν ἐκοιμήθη [†ὕπνῳ²⁴ καλῷ], καὶ ἔθηκαν αὐτὸν *οἱ υἱοὶ αὐτοῦ²⁵ *εἰς θήκην ξυλίνην²⁶. 7. Ὕστερον δὲ *ἀναγαγόντες ἔθαψαν αὐτὸν ἐν Χεβρών²⁷ μετὰ τῶν πατέρων αὐτοῦ²⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/010.yaml
  text: And when he had said these things, he fell asleep, and his sons placed him in a wooden coffin. Later they carried him up and buried him in Hebron with his fathers.
translation:
  language: de
  text: Und nachdem er dies gesagt hatte, entschlief er, und seine Söhne legten ihn in einen hölzernen Sarg. Später brachten sie ihn hinauf und begruben ihn in Hebron bei seinen Vätern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκοιμήθη
  choice: entschlief
  rationale: Das griechische Verb bedeutet wörtlich »schlief ein«, bezeichnet hier aber würdevoll den Tod. »Entschlief« bewahrt sowohl das Bild als auch den klaren Zusammenhang.
- source_word: θήκην ξυλίνην
  choice: hölzernen Sarg
  rationale: θήκη bezeichnet hier den Behälter für den Leichnam; zusammen mit ξυλίνη ist »hölzerner Sarg« im Deutschen natürlich und sachlich genau.
- source_word: ἀναγαγόντες
  choice: brachten sie ihn hinauf
  rationale: Die Übersetzung erhält die im Verb enthaltene Aufwärtsbewegung, wahrscheinlich im Blick auf die Reise nach Hebron.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: bei seinen Vätern
  rationale: Die traditionelle Verwandtschafts- und Bestattungsformel wird knapp bewahrt; gemeint ist die Beisetzung am Ort der Vorfahren.
theological_decisions:
- issue: ἐκοιμήθη als Todesmetapher
  choice: entschlief er
  alternative: starb er
  rationale: Die Bildsprache des griechischen Textes bleibt erhalten, ohne eine weitergehende Lehre über den Zustand der Toten einzutragen.
- issue: μετὰ τῶν πατέρων αὐτοῦ
  choice: bei seinen Vätern
  alternative: zusammen mit seinen Vorfahren
  rationale: »Bei seinen Vätern« lässt offen, ob vor allem die gemeinsame Grabstätte oder umfassender die Zugehörigkeit zu den Ahnen betont wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht feierlichen Wendungen »entschlief« und »bei seinen Vätern« entsprechen dem testamentarischen Schluss- und Bestattungskontext, bleiben aber allgemein verständlich.
