source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: '(bdg-text expansion: καὶ ἴασις *καὶ εὐσπλαγχνία⁵⁷ ἐν⁵⁸ ταῖς πτέρυξιν αὐτοῦ. Αὐτὸς λυτρώσεται πᾶσαν αἰχμαλωσίαν υἱῶν ἀνθρώπων ἐκ τοῦ Βελίαρ καὶ πᾶν πνεῦμα πλάνης πατηθήσεται⁵⁹.)'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/002.yaml
  text: And healing and compassion will be in his wings. He himself will redeem every captivity of the sons of men from Beliar, and every spirit of deception will be trampled down.
translation:
  language: de
  text: Und Heilung und Erbarmen werden unter seinen Flügeln sein. Er selbst wird die Menschen aus jeder Gefangenschaft Beliars erlösen, und jeder Geist der Verführung wird zertreten werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἴασις
  choice: Heilung
  rationale: Gibt die Bedeutung des griechischen Substantivs unmittelbar und in würdigem, allgemein verständlichem Deutsch wieder.
- source_word: εὐσπλαγχνία
  choice: Erbarmen
  rationale: Bezeichnet herzliches Mitgefühl beziehungsweise Barmherzigkeit; „Erbarmen“ ist hier natürlich und bewahrt den religiös-ethischen Klang.
- source_word: ἐν ταῖς πτέρυξιν αὐτοῦ
  choice: unter seinen Flügeln
  rationale: Im Deutschen ist „unter seinen Flügeln“ die natürliche bildhafte Wendung für Schutz und heilbringende Gegenwart; das Bild der Flügel bleibt erhalten.
- source_word: λυτρώσεται
  choice: wird … erlösen
  rationale: Bewahrt den Gedanken der Befreiung durch Loskauf oder Rettung und passt zum theologischen sowie befreienden Kontext.
- source_word: πᾶσαν αἰχμαλωσίαν υἱῶν ἀνθρώπων
  choice: alle Gefangenen unter den Menschen
  rationale: Das abstrakte „jede Gefangenschaft“ wäre im Deutschen in Verbindung mit „erlösen“ schwer verständlich. Die Formulierung gibt den wahrscheinlichen kollektiven Sinn wieder, ohne die Wendung geschlechtsspezifisch auf Männer einzuengen.
- source_word: ἐκ τοῦ Βελίαρ
  choice: aus der Gewalt Beliars
  rationale: Das bloße „von Beliar“ wäre idiomatisch undeutlich. „Aus der Gewalt“ macht die im Zusammenhang vorausgesetzte Herrschaft oder Gefangenschaft ausdrücklich, ohne Beliar näher zu deuten.
- source_word: πνεῦμα πλάνης
  choice: Geist der Verführung
  rationale: πλάνη kann Irrtum, Täuschung oder Verführung bezeichnen. „Verführung“ wahrt hier die aktive und geistliche Dimension, ohne sie auf bloße Unwahrhaftigkeit zu reduzieren.
- source_word: πατηθήσεται
  choice: wird zertreten werden
  rationale: Entspricht dem starken passiven Bild des griechischen Verbs und bewahrt dessen eschatologischen Siegesklang.
theological_decisions:
- issue: Identität des Handelnden in αὐτός
  choice: Das Pronomen bleibt als „er selbst“ ohne ausdrückliche Identifizierung stehen.
  alternative: Den Handelnden ausdrücklich als Messias oder Gott benennen.
  rationale: Der vorgelegte Vers nennt den Bezugsgegenstand nicht ausdrücklich; eine nähere Identifizierung würde die im Text vorhandene Kontextabhängigkeit auflösen.
- issue: Beliar
  choice: Beliar wird als Eigenname unverändert wiedergegeben.
  alternative: Mit „Teufel“, „Satan“ oder „Verderben“ übersetzen.
  rationale: Die Namensform bewahrt die Eigenart des pseudepigraphischen Textes und vermeidet eine nicht ausdrücklich vorgenommene Gleichsetzung.
- issue: Agens des Zertretens
  choice: Die Passivform „wird zertreten werden“ bleibt erhalten.
  alternative: Gott oder der Erlöser wird jeden Geist der Verführung zertreten.
  rationale: Das griechische Passiv nennt keinen Handelnden; die Übersetzung ergänzt daher keinen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache und das starke eschatologische Passiv bleiben erhalten; schwer verständliche griechische Abstrakta werden behutsam idiomatisiert.
