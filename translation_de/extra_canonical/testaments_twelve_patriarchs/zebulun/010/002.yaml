revisions:
- from: Und Heilung und Erbarmen werden unter seinen Flügeln sein. Er selbst wird alle Gefangenen unter den Menschen aus der Gewalt Beliars erlösen, und jeder Geist der Verführung wird zertreten werden.
  to: Und Heilung und Erbarmen werden unter seinen Flügeln sein. Er selbst wird die Menschen aus jeder Gefangenschaft Beliars erlösen, und jeder Geist der Verführung wird zertreten werden.
  rationale: Die Revision korrigiert ausschließlich die Verschiebung von „Gefangenschaft“ zu „Gefangenen“. Die Formulierung „aus jeder Gefangenschaft Beliars“ stellt den Bezug auf Beliar idiomatisch her, ohne Beliar zusätzlich zu identifizieren oder den ungenannten Handelnden des Passivs zu ergänzen.
