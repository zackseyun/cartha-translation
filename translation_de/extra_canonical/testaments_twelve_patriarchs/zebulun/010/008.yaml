- from: Ich aber eile nun zu meiner Ruhe, wie auch meine Väter.
  to: Ich aber eile nun zu meiner Ruhe, wie es auch meine Väter taten.
  rationale: Die minimale Ergänzung »es ... taten« macht die im griechischen Vergleich mitverstandene Handlung idiomatisch explizit. Bedeutung, Kontrast, Zeitbezug und die offene Metapher der Ruhe bleiben erhalten.
