    issue: Die Vergleichsellipse ist im Deutschen unvollständig.
    rationale: 'Das Griechische kann nach ὡς καί ein Verb aus dem vorangehenden Satz mitverstehen lassen. Im modernen Deutschen sollte dieses Verb in der Vergleichsphrase ergänzt werden: »wie es auch meine Väter taten«.'
  revised_text: Ich aber eile nun zu meiner Ruhe, wie es auch meine Väter taten.
