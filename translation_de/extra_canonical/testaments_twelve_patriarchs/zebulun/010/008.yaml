  text: 4. *Ἐγὼ δὲ νῦν¹⁵ εἰς τὴν ἀνάπαυσίν μου¹⁶ ἀποτρέχω¹⁷, *ὡς καὶ¹⁸ οἱ πατέρες μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010/008.yaml
  text: But as for me, now I hasten to my rest, as also my fathers did.
translation:
  language: de
  text: Ich aber eile nun zu meiner Ruhe, wie es auch meine Väter taten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνάπαυσις
  choice: Ruhe
  rationale: Gibt den Ruhe- und Todesbezug des griechischen Ausdrucks knapp wieder, ohne ihn ausdrücklich als »Tod« auszudeuten.
- source_word: ἀποτρέχω
  choice: eile
  rationale: Bewahrt die im Verb ausgedrückte zielgerichtete, rasche Bewegung in natürlichem Deutsch.
- source_word: οἱ πατέρες μου
  choice: meine Väter
  rationale: Entspricht dem griechischen Verwandtschaftsausdruck und bewahrt den Bezug auf die Vorfahren.
theological_decisions:
- issue: Bedeutung von »Ruhe«
  choice: Die Metapher »zu meiner Ruhe« bleibt erhalten.
  alternative: »dem Tod entgegen« oder »zur ewigen Ruhe«
  rationale: Der Kontext legt den Tod nahe, doch der griechische Text nennt weder den Tod noch ausdrücklich eine ewige Ruhe; die offene Bildsprache soll deshalb nicht dogmatisch präzisiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung mit »Ich aber« wahrt den Kontrast, während »nun« unmittelbar bei »eile« natürlich klingt.
