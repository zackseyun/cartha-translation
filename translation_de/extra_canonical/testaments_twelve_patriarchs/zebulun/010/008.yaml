review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt ἐγὼ δὲ, νῦν, εἰς τὴν ἀνάπαυσίν μου und ἀποτρέχω zutreffend wieder. Die Metapher »meiner Ruhe« bewahrt den im Griechischen nicht weiter definierten, wohl todesbezogenen Sinn. Die elliptische Vergleichsphrase ὡς καὶ οἱ πατέρες μου wird jedoch im Deutschen klarer und vollständiger wiedergegeben, wenn das mitverstandene Verb ausdrücklich steht.
  naturalness: »Ich aber eile nun zu meiner Ruhe« ist würdiges, modernes Standarddeutsch. Der bloße Anschluss »wie auch meine Väter« wirkt dagegen unvollständig bzw. unnötig literarisch; »wie es auch meine Väter taten« ist natürlich und präzisiert keine über den griechischen Ellipsissinn hinausgehende Aussage.
  terminology: »Ruhe« für ἀνάπαυσις und »Väter« für οἱ πατέρες μου sind angemessen. Es besteht kein Anlass, die Ruhe zu »ewiger Ruhe« zu erweitern oder sie ausdrücklich als Tod zu deuten.
  issues:
