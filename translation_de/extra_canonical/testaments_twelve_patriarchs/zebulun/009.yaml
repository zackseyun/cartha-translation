revisions:
- from: '1 Achtet also auf die Wasser und erkennt: Wenn sie sich zum selben Ort hinbewegen, reißen sie Steine, Holz, Erde und mancherlei anderes mit sich fort. 2 Wenn sie aber in viele Läufe geteilt werden, verschluckt die Erde sie, und sie werden leicht verachtet. 3 So wird es auch euch ergehen, wenn ihr geteilt werdet. 4 Lasst euch also nicht unter zwei Häupter trennen. Denn alles, was der Herr geschaffen hat, hat einen Kopf, zwei Schultern, zwei Hände, zwei Füße und ebenso alle übrigen Glieder. 5 Ich habe nämlich aus der Schrift meiner Väter erfahren, dass ihr in Israel geteilt werdet, zwei Königreichen folgen und jede Abscheulichkeit begehen werdet. 6 Eure Feinde werden euch gefangen nehmen, und unter den Völkern werdet ihr von vielen Schwächen und Bedrängnissen heimgesucht werden. 7 Danach werdet ihr euch an den Herrn erinnern und umkehren,[a] und er wird sich über euch erbarmen. Denn er ist barmherzig und voller Mitgefühl und rechnet den Menschenkindern ihre Bosheit nicht an, weil
    sie Fleisch sind und sich in ihren bösen Taten verirren.[b] 8 Danach wird der Herr selbst für euch aufgehen,[c] das Licht der Gerechtigkeit.'
  to: '1 Achtet also auf die Wasser und erkennt: Wenn sie sich zum selben Ort hinbewegen, reißen sie Steine, Holz, Erde und mancherlei anderes mit sich fort. 2 Wenn sie aber in viele Wasserläufe geteilt werden, verschluckt die Erde sie, und sie werden leicht verachtet. 3 So wird es auch euch ergehen, wenn ihr geteilt werdet. 4 Lasst euch also nicht unter zwei Häuptern trennen. Denn alles, was der Herr geschaffen hat, hat einen Kopf, zwei Schultern, zwei Hände, zwei Füße und alle übrigen Glieder. 5 Ich habe nämlich aus der Schrift meiner Väter erfahren, dass ihr in Israel geteilt werdet, zwei Königreichen folgen und jede Abscheulichkeit begehen werdet. 6 Eure Feinde werden euch gefangen nehmen, und unter den Völkern werdet ihr viele Krankheiten und Bedrängnisse erleiden. 7 Danach werdet ihr euch an den Herrn erinnern und umkehren,[a] und er wird sich über euch erbarmen. Denn er ist barmherzig und voller Mitgefühl und rechnet den Menschenkindern ihre Bosheit nicht an, weil sie Fleisch sind
    und in ihren bösen Taten in die Irre gehen.[b] 8 Danach wird der Herr selbst für euch aufgehen,[c] das Licht der Gerechtigkeit.'
  rationale: Die Revision verbessert einzelne idiomatische und semantische Punkte, ohne den Grundtext zu interpretieren oder seine Mehrdeutigkeiten einzuengen. Insbesondere werden die auseinandergeteilten Wasser als „Wasserläufe“ bezeichnet, ἀσθένειαι als „Krankheiten“ wiedergegeben und die Formulierungen zu den zwei Häuptern und zum Irregehen sprachlich geglättet. Die textkritischen Varianten und ihre Anker bleiben vollständig erhalten.
