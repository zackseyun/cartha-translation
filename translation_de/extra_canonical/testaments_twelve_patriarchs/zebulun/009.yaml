  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009.yaml
  text: 1 Therefore pay attention to the waters[a], and understand that when they move to one place, they carry down stones, wood, earth, and various other things. 2 But if they are divided into many streams, the ground swallows them up, and they become easy to despise. 3 So also you, if you are divided, will become like this. 4 Therefore do not be split under two heads, for everything that the Lord made has one head, and two shoulders, two hands, two feet, and all the other members. 5 For I have learned from the writings of my fathers that you will be divided in Israel, and you will follow two kingdoms, and you will do every abomination. 6 And your enemies will take you captive, and you will be afflicted among the nations with many weaknesses and distresses. 7 And after these things, when you remember the Lord, you will return, and he will have mercy on you, because he is merciful and compassionate, and he does not reckon wickedness against the sons of men, because they are flesh and go
    astray in their evil deeds. 8 And after these things the Lord himself will rise for you[c][b], the light of righteousness.
translation:
  language: de
  text: '1 Achtet also auf die Wasser und erkennt: Wenn sie sich zum selben Ort hinbewegen, reißen sie Steine, Holz, Erde und mancherlei anderes mit sich fort. 2 Wenn sie aber in viele Wasserläufe geteilt werden, verschluckt die Erde sie, und sie werden leicht verachtet. 3 So wird es auch euch ergehen, wenn ihr geteilt werdet. 4 Lasst euch also nicht unter zwei Häuptern trennen. Denn alles, was der Herr geschaffen hat, hat einen Kopf, zwei Schultern, zwei Hände, zwei Füße und alle übrigen Glieder. 5 Ich habe nämlich aus der Schrift meiner Väter erfahren, dass ihr in Israel geteilt werdet, zwei Königreichen folgen und jede Abscheulichkeit begehen werdet. 6 Eure Feinde werden euch gefangen nehmen, und unter den Völkern werdet ihr viele Krankheiten und Bedrängnisse erleiden. 7 Danach werdet ihr euch an den Herrn erinnern und umkehren,[a] und er wird sich über euch erbarmen. Denn er ist barmherzig und voller Mitgefühl und rechnet den Menschenkindern ihre Bosheit nicht an, weil sie Fleisch sind
    und in ihren bösen Taten in die Irre gehen.[b] 8 Danach wird der Herr selbst für euch aufgehen,[c] das Licht der Gerechtigkeit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Einige Textzeugen lesen: „Ihr werdet euch an den Herrn erinnern und bereuen, und er wird euch zurückführen“, statt: „Ihr werdet euch an den Herrn erinnern und umkehren.“'
    reason: textual_variant
  - marker: b
    text: 'Einige Textzeugen erweitern die Begründung: „weil sie Fleisch sind und die Geister des Irrtums sie in all ihren Taten irreführen.“'
    reason: textual_variant
  - marker: c
    text: 'Oder: „wird für euch erscheinen“. Das griechische Wort zeichnet zugleich das Bild eines aufgehenden Lichtes.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Προσέχετε ἐπὶ τὰ ὕδατα
  choice: Achtet auf die Wasser
  rationale: Bewahrt die direkte Aufforderung und das konkrete Bild; „Wasser“ bleibt gegenüber einer Festlegung auf Flüsse oder Bäche offen.
- source_word: πορεύονται ἐπὶ τὸ αὐτό
  choice: sich zum selben Ort hinbewegen
  rationale: Gibt die Bewegung auf ein gemeinsames Ziel wieder, ohne ausdrücklich eine im Griechischen nicht genannte Einmündung einzuführen.
- source_word: κατασύρουσιν
  choice: reißen … mit sich fort
  rationale: Drückt die kräftige, abwärts beziehungsweise vorwärts mitführende Bewegung des Wassers in natürlichem Deutsch aus.
- source_word: ἀφανίζει
  choice: verschluckt
  rationale: Veranschaulicht, wie der Erdboden die verteilten Wassermengen aufnimmt und verschwinden lässt.
- source_word: εὐκαταφρόνητα
  choice: leicht verachtet
  rationale: Bewahrt den Gedanken der Geringschätzung und glättet ihn nicht zu bloßer Wirkungslosigkeit.
- source_word: χωρισθῆτε ἐν δυσὶ κεφαλαῖς
  choice: lasst euch nicht unter zwei Häupter trennen
  rationale: Unterscheidet χωρίζω von dem wiederholten διαιρέω und erhält zugleich die körperlich-politische Metapher der zwei Häupter.
- source_word: γραφῇ τῶν πατέρων μου
  choice: der Schrift meiner Väter
  rationale: Gibt den Singular γραφή und die überlieferte Autorität wieder, ohne ausdrücklich einen kanonischen Status festzulegen.
- source_word: ἐξακολουθήσετε
  choice: zwei Königreichen folgen
  rationale: Bleibt nah am Verb und bewahrt die offene Vorstellung politischer oder loyaler Gefolgschaft.
- source_word: βδέλυγμα
  choice: Abscheulichkeit
  rationale: Vermittelt die starke moralische und möglicherweise kultische Wertung in verständlichem Gegenwartsdeutsch.
- source_word: ἀνατελεῖ
  choice: wird … aufgehen
  rationale: Erhält das Bild vom Aufgehen eines Lichtes und lässt zugleich die Aussage vom Erscheinen des Herrn hörbar.
- source_word: φῶς δικαιοσύνης
  choice: Licht der Gerechtigkeit
  rationale: Bewahrt die theologisch vieldeutige Bildformulierung, ohne sie ausdrücklich messianisch oder nur allgemein-restaurativ auszulegen.
theological_decisions:
- issue: Textvariante zur Umkehr beziehungsweise Wiederherstellung in Vers 7
  choice: „werdet ihr euch an den Herrn erinnern und umkehren, und er wird sich über euch erbarmen“
  alternative: „werdet ihr euch an den Herrn erinnern und bereuen, und er wird euch zurückführen“
  rationale: Der Haupttext folgt der vorgelegten griechischen Grundlesart; die abweichende Rollenverteilung zwischen menschlicher Umkehr und göttlicher Rückführung bleibt in einer Fußnote sichtbar.
- issue: Ursache des menschlichen Irrens in Vers 7
  choice: „weil sie Fleisch sind und sich in ihren bösen Taten verirren“
  alternative: „weil sie Fleisch sind und die Geister des Irrtums sie in all ihren Taten irreführen“
  rationale: Die kürzere Lesart steht im Haupttext; die Erweiterung mit den Geistern des Irrtums wird wegen ihrer theologischen Bedeutung als Textvariante dokumentiert.
- issue: Aussage über den Herrn als Licht der Gerechtigkeit in Vers 8
  choice: Die Bildaussage wird unmittelbar auf den Herrn bezogen und unverengt wiedergegeben.
  alternative: Ausdrückliche Deutung als messianischer Titel oder als allgemeines Bild der Wiederherstellung
  rationale: Die griechische Formulierung erlaubt eine erhöhte theologische Resonanz, legt aber die spätere dogmatische Ausdeutung nicht ausdrücklich fest.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die wiederholte Teilungsmetaphorik und das Körperbild bleiben erhalten; zugleich werden die unterschiedlichen griechischen Verben für Teilen und Trennen nicht vollständig eingeebnet. Archaisierende Formen werden vermieden, außer „Häupter“, wo die gehobene Form die Leitungsmetapher deutlicher als das rein anatomische „Köpfe“ trägt.
