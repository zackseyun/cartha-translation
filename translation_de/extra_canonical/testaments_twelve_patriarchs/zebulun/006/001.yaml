  text: VI. Πρῶτος ⌈οὖν⌉¹ ἐγὼ ἐποίησα σκάφος² ἐπιπλέειν³ ἐν τῇ⁴ θαλάσσῃ, ὅτι Κύριος ἔδωκέ μοι ⌈*σύνεσιν καὶ σοφίαν⁵⌉ ἐν αὐτῷ⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/006/001.yaml
  text: First, then, I made a boat to sail on the sea, because the Lord gave me understanding and wisdom in it.
translation:
  language: de
  text: Als Erster[a] baute ich also ein Boot, um auf dem Meer zu fahren, denn der Herr gab mir darin[b] Einsicht und Weisheit.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische „also“ (οὖν) ist in der verwendeten Edition textlich unsicher überliefert.
    reason: Die Editionsklammern bei οὖν kennzeichnen eine unsichere Lesart; die Fußnote bewahrt diese textkritische Unsicherheit.
  - marker: b
    text: 'Wörtlich: „in ihm“ oder „darin“; das Bezugswort kann das Boot oder das gesamte Vorhaben sein.'
    reason: Das Bezugswort von ἐν αὐτῷ ist im Griechischen nicht völlig eindeutig.
lexical_decisions:
- source_word: Πρῶτος
  choice: Als Erster
  rationale: Das prädikative maskuline Singularwort bezieht sich auf das ausdrücklich genannte ἐγώ und bezeichnet Zebulun als den Ersten, nicht lediglich den ersten Schritt in einer Abfolge.
- source_word: σκάφος
  choice: Boot
  rationale: Bezeichnet hier ein Wasserfahrzeug; „Boot“ ist verständlich und entspricht dem Kontext, ohne unnötig die Größe oder Bauart festzulegen.
- source_word: ἐποίησα … ἐπιπλέειν
  choice: baute …, das … fahren konnte
  rationale: 'Gibt die Verbindung von ποιέω mit dem Infinitiv natürlich wieder: Zebulun fertigte ein seetüchtiges beziehungsweise auf dem Meer fahrendes Boot an. „Fahren“ ist im modernen Deutschen für ein Boot idiomatischer als „schwimmen“.'
- source_word: σύνεσιν καὶ σοφίαν
  choice: Einsicht und Weisheit
  rationale: Bewahrt die zwei verwandten, aber unterscheidbaren Begriffe des griechischen Textes.
- source_word: ἐν αὐτῷ
  choice: dafür
  rationale: Gibt den instrumentalen beziehungsweise sachbezogenen Sinn im Deutschen natürlich wieder, ohne das unklare griechische Pronomen auf eine einzige Deutung festzulegen.
theological_decisions:
- issue: Ursprung von Zebuluns Befähigung
  choice: Die Einsicht und Weisheit werden ausdrücklich als Gabe des Herrn dargestellt.
  alternative: Die Fähigkeit lediglich als eigene Erfindungsgabe Zebuluns wiederzugeben.
  rationale: Der Kausalsatz ὅτι Κύριος ἔδωκέ μοι schreibt die Befähigung unmittelbar dem Herrn zu; diese Aussage wird ohne zusätzliche dogmatische Auslegung bewahrt.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Standarddeutsch. „Als Erster … also“ bildet die griechische Hervorhebung und Folgerung natürlich ab; „fahren konnte“ vermeidet eine unidiomatische wörtliche Formulierung.
