lexical_decisions:
- source_word: καθῆκα
  choice: ließ … hinab
  rationale: Das Verb bezeichnet hier am unmittelbarsten das Herablassen oder Hinablassen; „befestigte“ wäre eine stärkere, im erhaltenen griechischen Wortlaut nicht ausdrücklich enthaltene Festlegung.
- source_word: ξύλον
  choice: ein Stück Holz
  rationale: ξύλον kann Holz als Material oder einen hölzernen Gegenstand bezeichnen. „Ein Stück Holz“ bleibt im fragmentarischen Satz verständlich, ohne die genaue Funktion des Gegenstands zu bestimmen.
- source_word: ὄπισθεν αὐτοῦ
  choice: hinter ihm
  rationale: Die Präposition bezeichnet die Position hinter dem Bezugswort; das maskuline Pronomen wird formal mit „ihm“ wiedergegeben, wobei sein Bezug aus diesem Versfragment allein nicht sicher hervorgeht.
