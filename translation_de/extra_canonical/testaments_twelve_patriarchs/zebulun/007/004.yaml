  source_fidelity: 'Der Text gibt alle Bestandteile des Griechischen zutreffend wieder: καί als „Und“, ἐκ τῆς θήρας μου als „von meinem Fang“, παντὶ ἀνθρώπῳ ξένῳ als „jedem Fremden“, σπλαγχνιζόμενος als „aus Mitgefühl“ und μετεδίδουν als Abgeben eines Anteils. „Fang“ ist für θήρα in diesem Kontext eine angemessene, nicht unnötig spezifizierende deutsche Wiedergabe.'
  naturalness: „Und von meinem Fang gab ich aus Mitgefühl jedem Fremden etwas ab“ ist modernes, verständliches und würdiges Standarddeutsch. Die Stellung von „aus Mitgefühl“ ist natürlich. Das Präteritum kann im erzählenden Kontext die im Imperfekt angelegte wiederholte beziehungsweise gewohnheitsmäßige Handlung hinreichend tragen.
  terminology: „Fremden“ wahrt den allgemeinen Sinn von ξένος, ohne ihn modernistisch auf eine bestimmte rechtliche Kategorie einzuengen. „Mitgefühl“ trifft die erbarmende Haltung von σπλαγχνιζόμενος idiomatisch und registergerecht.
