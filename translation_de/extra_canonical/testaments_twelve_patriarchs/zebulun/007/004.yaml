  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/004.yaml
  text: And from my catch, showing compassion, I shared with every stranger.
translation:
  language: de
  text: Und von meinem Fang gab ich aus Mitgefühl jedem Fremden etwas ab.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τῆς θήρας μου
  choice: von meinem Fang
  rationale: Gibt die Herkunft des Geteilten knapp und natürlich wieder; θήρα bezeichnet hier den Ertrag der Jagd bzw. den Fang.
- source_word: παντὶ ἀνθρώπῳ ξένῳ
  choice: jedem Fremden
  rationale: Bewahrt die umfassende Aussage von παντί und gibt ἀνθρώπῳ ξένῳ idiomatisch wieder, ohne den Ausdruck unnötig zu verengen.
- source_word: σπλαγχνιζόμενος
  choice: aus Mitgefühl
  rationale: Drückt die begleitende innere Haltung des Partizips in natürlichem Deutsch aus.
- source_word: μετεδίδουν
  choice: gab … etwas ab
  rationale: Das Imperfekt beschreibt das wiederholte bzw. gewohnheitsmäßige Teilen; die deutsche Wendung macht deutlich, dass Zebulun anderen einen Anteil von seinem Fang gab.
