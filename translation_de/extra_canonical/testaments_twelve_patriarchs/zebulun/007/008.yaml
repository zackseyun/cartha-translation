base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/008.yaml
  text: Half of it I would set aside in winter with my brothers. But if you do not have anything to give to the one in need, suffer with him in inward parts of mercy. I know that my own hand did not find anything to give to the one in need, and walking together with him for seven stadia I would weep; and my inward parts turned toward him in sympathy.
translation:
  language: de
  text: 'Die Hälfte davon legte ich im Winter zusammen mit meinen Brüdern zurück. Wenn ihr aber nichts habt, was ihr dem Bedürftigen geben könnt, dann leidet mit ihm aus tiefstem Erbarmen. Ich weiß: Meine Hand fand nichts, was sie dem Bedürftigen geben konnte; doch ich ging sieben Stadien[a] mit ihm und weinte. Mein Innerstes wandte sich ihm voller Mitgefühl zu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Sieben Stadien entsprechen ungefähr 1,3 Kilometern.
    reason: Das antike Längenmaß ist heutigen Leserinnen und Lesern meist nicht vertraut.
lexical_decisions:
- source_word: τὸ μὲν ἥμισυ
  choice: Die Hälfte davon
  rationale: Gibt den partitiven Rückbezug knapp wieder, ohne das im Ausschnitt nicht ausdrücklich genannte Bezugsobjekt zu ergänzen.
- source_word: ἐν τῷ χειμῶνι
  choice: im Winter
  rationale: Direkte und natürliche Wiedergabe der Zeitangabe.
- source_word: ἐτοιμαίμην
  choice: legte ich … zurück
  rationale: Der mediale Optativ bzw. die überlieferte Form bezeichnet hier im Kontext ein Bereitmachen oder Zurücklegen; die deutsche Form bewahrt den iterativ-gewohnheitsmäßigen Sinn des englischen Konsultationstextes, ohne ein bestimmtes Objekt einzuführen.
- source_word: τῷ χρήζοντι
  choice: dem Bedürftigen
  rationale: Bezeichnet allgemein den Menschen, der etwas nötig hat.
- source_word: συμπάσχετε αὐτῷ
  choice: leidet mit ihm
  rationale: Bewahrt die starke, wörtliche Bedeutung des Verbs und schwächt sie nicht zu bloßem Mitleid ab.
- source_word: ἐν σπλάγχνοις ἐλέους
  choice: aus tiefstem Erbarmen
  rationale: Die wörtlichen 'Eingeweide des Erbarmens' bezeichnen im antiken Sprachgebrauch das innerste Mitgefühl; idiomatisches Deutsch vermittelt das Körperbild funktional.
- source_word: ἡ χείρ μου οὐχ εὗρε ἐπιδοῦναι
  choice: meine Hand nichts fand, was sie … geben konnte
  rationale: Erhält die auffällige Metonymie der Hand und den Gedanken fehlender Mittel.
- source_word: ἑπτὰ σταδίους
  choice: sieben Stadien
  rationale: Bewahrt das antike Längenmaß; eine Fußnote erläutert die ungefähre Entfernung.
- source_word: τὰ σπλάγχνα μου ἐστρέφετο ἐπʼ αὐτῷ εἰς συμπάθειαν
  choice: mein Innerstes wandte sich ihm voller Mitgefühl zu
  rationale: Erhält sowohl die Bewegung 'wandte sich ihm zu' als auch die starke innere Anteilnahme in natürlichem Deutsch.
theological_decisions:
- issue: Art und Tiefe des Erbarmens
  choice: mit ihm leiden / tiefstes Erbarmen
  alternative: Mitleid mit ihm haben
  rationale: Der griechische Wortlaut fordert solidarisches Mitleiden und nicht lediglich ein inneres Gefühl; die stärkere Formulierung bewahrt die ethische Spannung.
- issue: Verhältnis von materieller Hilfe und Mitgefühl
  choice: Das Mitgefühl gilt ausdrücklich für den Fall, dass nichts zum Geben vorhanden ist.
  alternative: Mitgefühl als Ersatz für eine verweigerte Gabe
  rationale: Der Konditionalsatz spricht von tatsächlichem Nicht-Haben, nicht von mangelnder Bereitschaft; daher darf der Text keine Rechtfertigung für unterlassene Hilfe nahelegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die starken Körper- und Mitgefühlsbilder des Griechischen werden teils formal ('meine Hand', 'wandte sich ihm zu'), teils idiomatisch ('aus tiefstem Erbarmen', 'mein Innerstes') wiedergegeben. Der Übergang von der zweiten Person Plural zur autobiografischen ersten Person bleibt erhalten.
