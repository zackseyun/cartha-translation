  terminology: „Bedürftigen“, „mit ihm leiden“, „Erbarmen“, „Stadien“ und „Mitgefühl“ sind passend. „Aus tiefstem Erbarmen“ vermittelt ἐν σπλάγχνοις ἐλέους idiomatisch, ohne den nachdrücklichen Charakter des Mit-Leidens aufzugeben.
