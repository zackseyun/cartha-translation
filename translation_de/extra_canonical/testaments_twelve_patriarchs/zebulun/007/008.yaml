  to: 'Die Hälfte davon legte ich im Winter zusammen mit meinen Brüdern zurück. Wenn ihr aber nichts habt, was ihr dem Bedürftigen geben könnt, dann leidet mit ihm aus tiefstem Erbarmen. Ich weiß: Meine Hand fand nichts, was sie dem Bedürftigen geben konnte; doch ich ging sieben Stadien[a] mit ihm und weinte. Mein Innerstes wandte sich ihm voller Mitgefühl zu.'
  rationale: V. 9 wurde so umgestellt, dass Οἶδα als gegenwärtige Bekräftigung („Ich weiß“) und ὅτι als Inhaltssatz wiedergegeben werden. Das adversative „doch“ macht den Übergang von fehlenden Mitteln zum mitgehenden, weinenden Mitgefühl im Deutschen deutlich, ohne einen zusätzlichen Sachverhalt einzuführen. Die übrigen Formulierungen und die Fußnote können bestehen bleiben.
