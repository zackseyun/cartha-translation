source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 6. *Πέντε οὖν ἔτη²⁹ ἡλίευσα³⁰, [παντὶ ἀνθρώπῳ *ὃν ἑωράκειν³¹ μεταδιδούς, καὶ παντὶ τῷ οἴκῳ τοῦ πατρός μου ἐξαρκῶν].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/007.yaml
  text: For five years, then, I fished, sharing with everyone I had seen, and providing for all my father’s house.
translation:
  language: de
  text: Fünf Jahre lang fischte ich also. Dabei ließ ich jeden Menschen, den ich sah, daran teilhaben und versorgte das ganze Haus meines Vaters.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡλίευσα
  choice: fischte ich
  rationale: Gibt das aoristische Verb schlicht und idiomatisch wieder; die Zeitspanne wird durch „fünf Jahre lang“ deutlich.
- source_word: μεταδιδούς
  choice: ließ … daran teilhaben
  rationale: Das Partizip bezeichnet das Abgeben beziehungsweise Teilen von dem, was durch das Fischen gewonnen wurde. „Daran“ bewahrt den im Griechischen unausgesprochenen Bezug, ohne „Fang“ ausdrücklich in den Text einzufügen.
- source_word: ἐξαρκῶν
  choice: versorgte
  rationale: Drückt hier aus, dass Zebulun für den Bedarf des gesamten väterlichen Haushalts aufkam.
- source_word: οἴκῳ τοῦ πατρός μου
  choice: das ganze Haus meines Vaters
  rationale: Bewahrt die konkrete und zugleich haushaltsbezogene Ausdrucksweise des Griechischen.
theological_decisions: []
translation_notes:
  register: Natürliches, modernes Standarddeutsch in würdigem Erzählton. Die beiden griechischen Partizipialkonstruktionen werden als begleitende Handlungen mit „Dabei“ wiedergegeben; der beim Teilen nur implizite Gegenstand wird nicht dogmatisch oder sachlich überbestimmt.
