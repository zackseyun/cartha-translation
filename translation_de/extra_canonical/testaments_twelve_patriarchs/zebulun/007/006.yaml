source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 5. Διὰ τοῦτο καὶ ὁ Κύριος *πολλοὺς ἰχθύας ἐνέπλησέ με²⁵ ἐν τῇ ἄγρᾳ τῶν ἰχθύων²⁶. Ὁ γὰρ μεταδιδοὺς τῷ πλησίον²⁷, λαμβάνει πολλαπλασίονα²⁸ παρὰ Κυρίου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/006.yaml
  text: For this reason the Lord also filled me with many fish in the catch of fish. For the one who shares with his neighbor receives many times more from the Lord.
translation:
  language: de
  text: Darum erfüllte mich der Herr beim Fischfang auch mit vielen Fischen. Denn wer mit seinem Nächsten teilt, empfängt vom Herrn ein Vielfaches.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Darum
  rationale: Gibt die folgernde Verbindung knapp und natürlich wieder.
- source_word: ἐνέπλησέ με
  choice: erfüllte mich
  rationale: Bewahrt das ungewöhnliche Bild des griechischen Verbs mit direktem Personenobjekt, statt es stillschweigend zu »gab mir« oder »füllte mein Netz« umzudeuten.
- source_word: ἐν τῇ ἄγρᾳ τῶν ἰχθύων
  choice: beim Fischfang
  rationale: ἄγρα bezeichnet hier Fang beziehungsweise Fangvorgang; ein Netz wird im griechischen Text nicht ausdrücklich genannt.
- source_word: ὁ μεταδιδοὺς τῷ πλησίον
  choice: wer mit seinem Nächsten teilt
  rationale: Gibt die substantivierte Partizipialkonstruktion idiomatisch wieder und bewahrt den ethischen Begriff »Nächster«.
- source_word: πολλαπλασίονα
  choice: ein Vielfaches
  rationale: Entspricht dem komparativisch beziehungsweise vervielfachend gebrauchten Ausdruck, ohne eine bestimmte Größenordnung festzulegen.
- source_word: παρὰ Κυρίου
  choice: vom Herrn
  rationale: Bezeichnet den Herrn als Ursprung dessen, was der Teilende empfängt.
theological_decisions:
- issue: Verhältnis von Teilen und göttlichem Empfang
  choice: Die spruchhafte Folge bleibt uneingeschränkt stehen.
  alternative: Durch Zusätze wie »kann« oder eine rein geistliche Deutung abschwächen.
  rationale: Der griechische Text formuliert unmittelbar, dass der Teilende ein Vielfaches vom Herrn empfängt; Art und Zeitpunkt des Empfangs werden nicht erklärt.
- issue: Bezeichnung des Mitmenschen
  choice: »Nächster«
  alternative: »Mitmensch« oder »Nachbar«
  rationale: »Nächster« bewahrt die ethisch-religiöse Weite von πλησίον; »Nachbar« wäre im Deutschen zu räumlich eng.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Wendung »erfüllte mich ... mit vielen Fischen« wurde wegen ihrer Nähe zum griechischen Wortlaut bewusst beibehalten; »beim Fischfang« vermeidet die unbelegte Einfügung eines Netzes.
