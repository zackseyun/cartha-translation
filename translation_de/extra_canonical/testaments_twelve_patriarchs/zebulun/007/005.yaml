  text: 4. *Εἰ δὲ ἦν ξένος, ἢ νοσῶν, ἢ²¹ γηράσας, ἐψήσας²² τοὺς ἰχθύας, καὶ *ποιήσας αὐτὰ ἀγαθῶς²³ κατὰ τὴν ἑκάστου χρείαν προσέφερον πᾶσι, συναλγῶν²⁴ καὶ συμπάσχων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/005.yaml
  text: If anyone was a foreigner, or sick, or aged, after boiling the fish and preparing them well, I would offer them to each according to need, suffering with them and feeling their pain.
translation:
  language: de
  text: War aber jemand ein Fremder, krank oder alt, so kochte ich die Fische, bereitete sie gut nach dem Bedarf jedes Einzelnen zu und reichte sie allen; dabei fühlte ich mit ihnen und litt mit ihnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ξένος
  choice: ein Fremder
  rationale: Bezeichnet hier am natürlichsten einen auswärtigen oder nicht zur eigenen Gemeinschaft gehörenden Menschen; die substantivische Wiedergabe bewahrt diese Bedeutung.
- source_word: ποιήσας αὐτὰ ἀγαθῶς κατὰ τὴν ἑκάστου χρείαν
  choice: bereitete sie gut nach dem jeweiligen Bedarf zu
  rationale: Die Formulierung verbindet die gute Zubereitung der Fische mit dem individuellen Bedarf jedes Menschen, ohne die syntaktische Zuordnung unnötig zu verengen.
- source_word: προσέφερον πᾶσι
  choice: reichte sie allen
  rationale: Das Verb ist aufgrund der singularischen Partizipien als erste Person Singular zu verstehen; πᾶσι bedeutet „allen“.
- source_word: συναλγῶν καὶ συμπάσχων
  choice: empfand ich ihren Schmerz mit und teilte ihr Leiden
  rationale: Die beiden verwandten, aber nicht völlig identischen Ausdrücke für Mit-Schmerz und Mit-Leiden bleiben als parallele Aussagen erhalten.
theological_decisions:
- issue: Art und Reichweite des Mitgefühls
  choice: Konkretes Mitfühlen und Mitleiden mit Bedürftigen
  alternative: Allgemeine Freundlichkeit oder bloßes Bedauern
  rationale: Die griechischen Verben συναλγέω und συμπάσχω bezeichnen eine starke Anteilnahme am Schmerz und Leiden anderer; die Übersetzung schwächt dies nicht zu bloßer Höflichkeit ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt in der Ich-Perspektive des griechischen Textes; die Aufzählung „ein Fremder, krank oder alt“ wird natürlich wiedergegeben, und die beiden abschließenden Partizipien behalten ihre eindringliche Parallelität.
