revisions:
- from: War aber jemand ein Fremder, krank oder alt, kochte ich die Fische, bereitete sie gut nach dem jeweiligen Bedarf zu und reichte sie allen; dabei empfand ich ihren Schmerz mit und teilte ihr Leiden.
  to: War aber jemand ein Fremder, krank oder alt, so kochte ich die Fische, bereitete sie gut nach dem Bedarf jedes Einzelnen zu und reichte sie allen; dabei fühlte ich mit ihnen und litt mit ihnen.
  rationale: Die Revision präzisiert den individuellen Bedarf (ἑκάστου) und gibt die beiden griechischen Partizipien als klare deutsche Parallelformel wieder. Die Aussageweite von „allen“ (πᾶσι) und die schlichte, nicht weiter spezifizierte Bezeichnung „Fremder“ bleiben erhalten.
