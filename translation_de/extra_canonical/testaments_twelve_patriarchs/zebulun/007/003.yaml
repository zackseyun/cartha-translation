base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/003.yaml
  text: And I was walking along the shore, fishing for fish for my father's house until we came to Egypt.
translation:
  language: de
  text: Und darin war ich an den Küsten entlang unterwegs und fing Fische für das Haus meines Vaters, bis wir nach Ägypten kamen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αὐτῷ
  choice: darin
  rationale: Das Pronomen verweist auf ein zuvor genanntes Fahrzeug oder Boot. Die Wiedergabe bewahrt diesen Rückbezug, den die englische Konsultationsfassung auslässt.
- source_word: διαπορευόμενος τοὺς αἰγιαλούς
  choice: fuhr ich an den Küsten entlang
  rationale: Im Zusammenhang mit ἐν αὐτῷ bezeichnet das Partizip ein Unterwegssein in einem Fahrzeug; αἰγιαλοί sind Küsten- beziehungsweise Uferstreifen.
- source_word: ἁλιεύων ἰχθύας
  choice: fing Fische
  rationale: Die im Griechischen etymologisch verstärkte Wendung wird in natürlichem Deutsch knapp und eindeutig wiedergegeben.
- source_word: τῷ οἴκῳ τοῦ πατρός μου
  choice: für das Haus meines Vaters
  rationale: οἶκος kann Haus, Haushalt oder Hausgemeinschaft bedeuten. Die traditionelle, offene Formulierung bewahrt diese Bedeutungsbreite.
- source_word: ἕως ὅτου ἤλθομεν εἰς Αἴγυπτον
  choice: bis wir nach Ägypten kamen
  rationale: Der Wechsel von der ersten Person Singular zur ersten Person Plural wird wie im griechischen Text beibehalten.
