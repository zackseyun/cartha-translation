  source_fidelity: 'Die Grundstruktur ist zutreffend: Das eingeschobene ἐν αὐτῷ („darin“) und der Wechsel von „ich“ zu „wir“ sind bewahrt, ebenso das Fischen für den väterlichen οἶκος bis zur Ankunft in Ägypten. „fuhr“ legt jedoch stärker als das griechische διαπορευόμενος eine bestimmte Fortbewegungsart nahe. Das Partizip bezeichnet zunächst allgemeiner ein Unterwegssein bzw. Entlangziehen.'
