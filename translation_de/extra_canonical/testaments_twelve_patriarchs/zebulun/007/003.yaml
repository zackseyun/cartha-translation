  terminology: „Haus meines Vaters“ kann als offene, traditionsnahe Wiedergabe von οἶκος stehen bleiben; es kann sowohl das Haus als auch den Haushalt meinen. „Küsten“ ist für die pluralischen αἰγιαλούς vertretbar.
