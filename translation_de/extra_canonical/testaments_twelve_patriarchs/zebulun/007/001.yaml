  text: VII. ὀθόνην ἐξέτεινα ἐν *ἑτέρῳ ξύλῳ ὀρθῷ⁸ *ἐν μέσῳ⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007/001.yaml
  text: I stretched a sheet on another upright beam in the middle.
translation:
  language: de
  text: Ich spannte ein Tuch an einem anderen, aufrecht stehenden Holz in der Mitte aus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀθόνην
  choice: ein Tuch
  rationale: ὀθόνη bezeichnet hier ein ausspannbares Tuch oder eine Stoffbahn; „Tuch“ ist natürlich und wahrt die sachliche Offenheit.
- source_word: ἐξέτεινα
  choice: spannte … aus
  rationale: Das Verb bedeutet „ausstrecken, ausspannen“ und wird in Verbindung mit einem Tuch idiomatisch mit „ausspannen“ wiedergegeben.
- source_word: ἐν ἑτέρῳ ξύλῳ ὀρθῷ
  choice: an einem anderen, aufrecht stehenden Holz
  rationale: ξύλον kann Holz, Stange oder Balken bezeichnen. „Holz“ bewahrt die lexikalische Offenheit; ὀρθῷ beschreibt es als aufrecht stehend. Die Präposition ἐν wird aufgrund des Befestigungskontexts natürlich mit „an“ wiedergegeben.
- source_word: ἐν μέσῳ
  choice: in der Mitte
  rationale: Entspricht der räumlichen Wendung wörtlich, ohne einen im knappen Kontext nicht ausdrücklich genannten Bezugspunkt zu ergänzen.
theological_decisions: []
translation_notes:
  register: Knappes, sachliches und modernes Standarddeutsch. Die ungewöhnliche Gegenstandsbezeichnung „Holz“ bleibt erhalten, damit die im Griechischen mögliche Deutung als Stange oder Balken nicht vorschnell festgelegt wird.
