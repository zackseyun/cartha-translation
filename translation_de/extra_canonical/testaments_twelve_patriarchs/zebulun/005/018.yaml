base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/018.yaml
  text: And when I was in the land of Canaan, by the seashore, I used to catch prey[c] for Jacob my father, and when many were being choked in the sea, I came through unharmed[d].
translation:
  language: de
  text: Und als ich im Land Kanaan an der Meeresküste war, ging ich für meinen Vater Jakob auf Beutefang[a]. Und als viele im Meer erstickten, blieb ich unversehrt[b].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »jagte ich Beute«. Der Küstenkontext lässt an Fischfang oder das Fangen von Meerestieren denken, doch der griechische Ausdruck bleibt allgemein.'
    reason: lexical_alternative
  - marker: b
    text: Der Satz scheint über den hier überlieferten Quellenausschnitt hinaus weiterzugehen; die Übersetzung endet mit dem in diesem Abschnitt erhaltenen griechischen Text.
    reason: textual_variant
lexical_decisions:
- source_word: ἐθήρευον θήραν
  choice: ging ich … auf Beutefang
  rationale: Die griechische figura etymologica bedeutet wörtlich etwa »ich jagte Jagdbeute«. »Auf Beutefang gehen« bewahrt die allgemeine Bedeutung, klingt im Deutschen natürlich und legt trotz des Küstenkontexts nicht unbelegt »Fische« fest.
- source_word: πολλῶν ἀγχομένων
  choice: als viele … zu ersticken drohten
  rationale: ἀγχόμενοι bezeichnet ein Gewürgt- oder Ersticktwerden. Im Zusammenhang mit dem Meer gibt die Formulierung die naheliegende Lebensgefahr idiomatisch wieder, ohne ausdrücklich »ertrinken« einzusetzen.
- source_word: ἀβλαβὴς διέμενον
  choice: blieb ich unversehrt
  rationale: διέμενον bezeichnet fortdauerndes Verbleiben; ἀβλαβής bedeutet »unversehrt, unbeschädigt«. Die knappe Wiedergabe entspricht beiden Elementen.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Wiederholung »Jakob, mein Vater« wurde natürlich als »meinen Vater Jakob« wiedergegeben; die lexikalische Offenheit von θήρα wurde im Haupttext bewahrt.
