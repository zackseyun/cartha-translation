base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/017.yaml
  text: For the sons of my brothers were sick and were dying because of Joseph, because they had not shown mercy in their inward parts; but my sons were kept free from sickness, as you know.
translation:
  language: de
  text: Denn auch die Söhne meiner Brüder wurden krank und starben wegen Josef, weil sie in ihrem Innersten kein Erbarmen gezeigt hatten. Meine Söhne aber blieben, wie ihr wisst, vor Krankheit bewahrt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠσθένουν καὶ ἀπέθνησκον
  choice: wurden krank und starben
  rationale: Gibt die fortdauernden bzw. wiederholten Vorgänge der Imperfektformen in natürlichem Deutsch wieder.
- source_word: διὰ Ἰωσήφ
  choice: wegen Josef
  rationale: Bewahrt die knappe kausale Formulierung des griechischen Textes, ohne näher festzulegen, in welchem Sinn Josef der Anlass war.
- source_word: ἔλεος
  choice: Erbarmen
  rationale: Bezeichnet hier tätiges, mitfühlendes Erbarmen und passt zum folgenden Ausdruck der inneren Regung.
- source_word: ἐν σπλάγχνοις αὐτῶν
  choice: in ihrem Innersten
  rationale: Bewahrt den körperlich-innerlichen Bildgehalt von σπλάγχνα in verständlichem, würdigem Deutsch; das wörtliche „in ihren Eingeweiden“ wäre missverständlich und stilistisch störend.
- source_word: ἄνοσοι διεφυλάχθησαν
  choice: blieben … vor Krankheit bewahrt
  rationale: Gibt sowohl den Zustand der Krankheitsfreiheit als auch das bewahrende Passiv von διεφυλάχθησαν wieder.
theological_decisions:
- issue: Bedeutung von διὰ Ἰωσήφ für Krankheit und Tod
  choice: wegen Josef
  alternative: für das, was sie Josef angetan hatten
  rationale: Die Übersetzung wahrt die echte Kürze und mögliche Mehrdeutigkeit der Präpositionalfügung und ergänzt keine ausdrücklich genannte Vergeltungsdeutung.
- issue: Innerlichkeit des fehlenden Erbarmens
  choice: in ihrem Innersten kein Erbarmen gezeigt
  alternative: von Herzen kein Erbarmen gehabt
  rationale: Die gewählte Formulierung hält die Spannung zwischen innerer Haltung und dem Verb ποιεῖν („tun/zeigen“) aufrecht, ohne sie auf bloßes Empfinden oder ausschließlich äußeres Handeln zu verengen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Erzählton. Der Satzbau folgt dem Gegensatz zwischen den Söhnen der Brüder und den eigenen Söhnen, ohne die griechische Struktur unnötig steif nachzubilden.
