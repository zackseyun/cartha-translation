  source_fidelity: 'Die Übersetzung gibt die wesentlichen Aussagen präzise wieder: Krankheit und Tod der Söhne der Brüder, die knappe und nicht weiter erklärte Kausalfügung διὰ Ἰωσήφ, ihr fehlendes Erbarmen sowie die Bewahrung der eigenen Söhne vor Krankheit. Allerdings bleibt das einleitende καὶ γάρ in „Denn“ unberücksichtigt; „Denn auch“ bildet den zusätzlichen Bezug sicher ab. „Wurden krank und starben“ ist als idiomatische Wiedergabe der Imperfekte vertretbar.'
  naturalness: Der Stil ist modernes, würdiges Standarddeutsch. „In ihrem Innersten kein Erbarmen gezeigt“ ist verständlich und bewahrt die Verbindung von innerer Haltung und erwiesenem Erbarmen. Die Stellung von „wie ihr wisst“ ist natürlich.
  terminology: „Erbarmen“ ist für ἔλεος passend. „In ihrem Innersten“ vermittelt σπλάγχνα als Sitz tiefen Mitgefühls ohne das im Deutschen unpassend wörtliche „Eingeweide“. „Vor Krankheit bewahrt“ gibt ἄνοσοι διεφυλάχθησαν treffend wieder. „Josef“ entspricht der üblichen deutschen Namensform.
