  text: And so he gave it to them. And they did as Dan had said.
translation:
  language: de
  text: Und so übergab er ihn ihnen. Und sie taten, wie Dan gesagt hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δέδωκεν
  choice: übergab
  rationale: Das Perfekt bezeichnet hier im Erzählzusammenhang eine vollzogene Übergabe; das natürliche deutsche Präteritum gibt den Fortgang der Erzählung angemessen wieder.
- source_word: αὐτόν
  choice: ihn
  rationale: Das maskuline Akkusativpronomen ist mit „ihn“ wiederzugeben, nicht mit dem sächlichen „es“.
- source_word: καθὼς εἶπεν
  choice: was … gesagt hatte
  rationale: Im Deutschen gibt ein Inhaltssatz die Bedeutung im Kontext natürlicher wieder als das wörtlichere „wie … gesagt hatte“; das Plusquamperfekt markiert die vorausgehende Äußerung.
