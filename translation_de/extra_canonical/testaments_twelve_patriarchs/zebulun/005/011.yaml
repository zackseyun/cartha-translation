  source_fidelity: 'Die Übersetzung gibt die Abfolge und die syntaktischen Beziehungen des griechischen Textes zuverlässig wieder: Simeon nimmt das Gewand, verweigert dessen Herausgabe, will den Mann mit dem Schwert niederhauen und ist darüber zornig, dass er ihn nicht getötet hatte. „Niederhauen“ trifft κατακόψαι als gewaltsames Töten mit einer Klingenwaffe angemessen, ohne eine stärker spezifizierende Zerstückelung zu behaupten. Die im Griechischen nicht ausdrücklich benannten Referenten der männlichen Pronomen bleiben im Deutschen bestehen.'
