  terminology: „Gewand“ ist für χιτών eine zulässige, bewusst nicht überpräzise Wiedergabe. „Schwert“ für ῥομφαία ist verständlich und sachgerecht. Die Personenbezeichnung „Simeon“ folgt der etablierten deutschen Namensform.
