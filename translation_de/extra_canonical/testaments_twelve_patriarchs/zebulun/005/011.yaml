base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/011.yaml
  text: And Simeon took the tunic and did not want to give it up. For he wanted to cut him down with the sword, being angry because he had not killed him.
translation:
  language: de
  text: Und Simeon nahm das Gewand und wollte es nicht hergeben; denn er wollte ihn mit dem Schwert niederhauen. Er war zornig, weil er ihn nicht getötet hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιτών
  choice: Gewand
  rationale: „Gewand“ ist im Deutschen natürlich und bewahrt die allgemeine Bedeutung des griechischen Begriffs, ohne die genaue Form des Kleidungsstücks unnötig festzulegen.
- source_word: δοῦναι αὐτόν
  choice: es hergeben
  rationale: Im Zusammenhang bezeichnet die Wendung nicht bloß ein neutrales Geben, sondern Simeons Weigerung, das Gewand auszuhändigen.
- source_word: τῇ ῥομφαίᾳ
  choice: mit dem Schwert
  rationale: „Schwert“ gibt die hier gemeinte große Klingenwaffe idiomatisch und verständlich wieder.
- source_word: κατακόψαι
  choice: niederhauen
  rationale: Das kräftige Verb wahrt die gewaltsame Bildlichkeit des griechischen Ausdrucks, ohne durch „zerstückeln“ eine möglicherweise zu enge Bedeutung festzulegen.
theological_decisions:
- issue: Bezug der männlichen Pronomen
  choice: Die Pronomen bleiben als „ihn“ wiedergegeben.
  alternative: Den Namen des gemeinten Opfers ausdrücklich einsetzen.
  rationale: Der griechische Text verwendet Pronomen; die Übersetzung bewahrt diese Ausdrucksweise und vermeidet eine nicht im Vers selbst stehende Explizierung.
- issue: Subjekt von ἀνεῖλεν
  choice: „weil er ihn nicht getötet hatte“
  alternative: Das Subjekt ausdrücklich als Simeon benennen.
  rationale: Das Griechische lässt das Subjekt unausgesprochen. Die deutsche Form erhält diese grammatische Struktur und die daraus mögliche formale Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zwei griechischen Begründungs- beziehungsweise Begleitaussagen werden zur besseren Lesbarkeit auf zwei Sätze verteilt; die logische Verbindung durch „denn“ und „weil“ bleibt erhalten.
