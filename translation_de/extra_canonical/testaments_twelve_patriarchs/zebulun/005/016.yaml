source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 3. *Ἔχετε οὖν¹⁷ ἔλεος ἐν¹⁸ σπλάγχνοις ὑμῶν¹⁹, ὅτι *εἴ τι ἂν²⁰ ποιήσῃ²¹ τῷ πλησίον αὐτοῦ, *οὕτω Κύριος²² ποιήσει²³ *μετʼ αὐτοῦ²⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/016.yaml
  text: Have mercy, therefore, in your hearts[b], because whatever anyone does to his neighbor, so the Lord will do to him.
translation:
  language: de
  text: Habt also Erbarmen in eurem Innersten[a]; denn was jemand seinem Nächsten tut, das wird der Herr ebenso an ihm tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier „Erbarmen in euren inneren Organen“. Im griechischen Sprachgebrauch galten die inneren Organe als Sitz des Mitgefühls.
    reason: cultural_note
lexical_decisions:
- source_word: ἔλεος ἐν σπλάγχνοις ὑμῶν
  choice: Erbarmen in eurem Innersten
  rationale: Bewahrt das griechische Bild vom Inneren als Sitz des Mitgefühls, klingt aber im modernen Deutschen natürlich und würdevoll.
- source_word: τῷ πλησίον αὐτοῦ
  choice: seinem Nächsten
  rationale: Die geläufige deutsche Wiedergabe erhält sowohl den zwischenmenschlichen Bezug als auch den ethischen Klang von πλησίον.
- source_word: οὕτω
  choice: ebenso
  rationale: Kennzeichnet klar die Entsprechung zwischen dem Handeln am Nächsten und dem Handeln des Herrn.
- source_word: μετʼ αὐτοῦ
  choice: an ihm
  rationale: Im Zusammenhang bezeichnet die Präposition, wie der Herr mit dem Handelnden verfahren wird; „an ihm tun“ gibt dies im Deutschen idiomatisch wieder.
theological_decisions:
- issue: Entsprechung zwischen menschlichem Handeln und dem Handeln des Herrn
  choice: „was jemand seinem Nächsten tut, das wird der Herr ebenso an ihm tun“
  alternative: „wie jemand an seinem Nächsten handelt, so wird der Herr mit ihm handeln“
  rationale: Die gewählte Fassung bewahrt die konkrete Wiederholung des Verbs ποιέω und die zugespitzte Vergeltungs- beziehungsweise Entsprechungsaussage, ohne deren theologischen Mechanismus näher festzulegen.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, gut verständlichem Mahnton. Das körperbezogene griechische Bild wird im Haupttext als „Innerstes“ erhalten und in der Fußnote erläutert.
