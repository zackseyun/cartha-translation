  source_fidelity: Die Aufforderung »Sieh nach, ob ... ist« gibt Ἐπίγνωθι ... ἐστίν angemessen wieder; das ergänzte »ob« ist im Deutschen nötig und entspricht auch der im Kontext vorauszusetzenden Prüfaufforderung. »Und so taten sie es« wahrt die knappe und im überlieferten Kontext nicht näher erläuterte Aussage καὶ ἐποίησαν οὕτως.
  naturalness: Der Text ist flüssiges, würdevolles modernes Standarddeutsch. »Sieh nach« ist als knappe Aufforderung natürlich. Eine Änderung ist allein wegen der Wahl für χιτών angezeigt.
  terminology: »Untergewand« legt im heutigen Deutsch zu stark ein bloßes Unter- oder sogar Unterwäschekleidungsstück nahe. χιτών bezeichnet zwar gewöhnlich ein körpernah getragenes Kleidungsstück, ist aber nicht in jedem Kontext auf ein deutsches »Untergewand« einzuengen. »Tunika« ist als etablierte historische Bezeichnung präziser und neutraler.
  issues:
