source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: αὐτὸν τῷ Ἰακὼβ λέγοντες⁵⁵. Ἐπίγνωθι, ὁ⁵⁶ *χιτὼν τοῦ υἱοῦ σου ἐστίν⁵⁷; *καὶ ἐποίησαν οὕτως⁵⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/001.yaml
  text: And they said to Jacob, “Recognize, then, whether this is your son’s tunic[a].” And they did so.
translation:
  language: de
  text: 'Und sie sagten zu Jakob: »Sieh nach, ob dies die Tunika[a] deines Sohnes ist.« Und so taten sie es.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Oder »Gewand« beziehungsweise »Leibrock«; das griechische χιτών bezeichnet ein körpernah getragenes Kleidungsstück.
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἐπίγνωθι
  choice: Sieh nach
  rationale: Der Imperativ fordert Jakob auf, das Kleidungsstück zu prüfen und zu erkennen; »Sieh nach« ist im Deutschen natürlich und bewahrt den Aufforderungscharakter.
- source_word: χιτών
  choice: Untergewand
  rationale: χιτών bezeichnet ein unmittelbar am Körper getragenes Kleidungsstück; »Untergewand« ist genauer als das allgemeinere »Gewand«.
- source_word: καὶ ἐποίησαν οὕτως
  choice: Und so taten sie es
  rationale: Die knappe, im Kontext etwas spannungsreiche Aussage wird entsprechend dem griechischen Wortlaut beibehalten, ohne ihren Bezug erklärend festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt knapp; die mögliche syntaktische Spannung zwischen der vorangestellten Wendung »ihn zu Jakob« im überlieferten Ausschnitt und dem anschließenden Plural wird nicht durch zusätzliche, im Deutschen unverständliche Wörter nachgebildet.
