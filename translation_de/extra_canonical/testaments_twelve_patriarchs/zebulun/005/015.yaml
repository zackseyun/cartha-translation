source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 2. Διὰ γὰρ ταῦτα εὐλόγησέ με ὁ¹¹ Κύριος, *καὶ πάντων¹² τῶν ἀδελφῶν μου ἀσθενούντων ἐγὼ ἄνοσος παρῆλθον¹³. οἶδε¹⁴ γὰρ¹⁵ Κύριος ἑκάστου τὴν προαίρεσιν¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/015.yaml
  text: For because of these things the Lord blessed me, and when all my brothers were ill, I passed through unharmed. For the Lord knows each person’s intention.
translation:
  language: de
  text: Denn deshalb segnete mich der Herr, und als alle meine Brüder krank waren, kam ich ohne Krankheit hindurch. Denn der Herr kennt die Absicht eines jeden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ γὰρ ταῦτα
  choice: Denn deswegen
  rationale: Gibt den rückbezüglichen Grundzusammenhang knapp und natürlich wieder, ohne das im Deutschen schwerfällige „Denn wegen dieser Dinge“.
- source_word: ἀσθενούντων
  choice: krank waren
  rationale: Das Partizip bezeichnet hier den Zustand der erkrankten Brüder; die finite Wiedergabe passt natürlich zur deutschen Temporalkonstruktion.
- source_word: ἄνοσος παρῆλθον
  choice: blieb ich ohne Krankheit
  rationale: Bewahrt den ausdrücklichen Krankheitsbezug von ἄνοσος. παρῆλθον bezeichnet das unversehrte Durchkommen beziehungsweise Vorübergehen; im Kontext ist „blieb“ idiomatisch und vermeidet das zu weit gefasste „unversehrt“.
- source_word: προαίρεσιν
  choice: innere Entscheidung
  rationale: προαίρεσις kann Absicht, Willensausrichtung oder bewusst gewählte Haltung bezeichnen. „Innere Entscheidung“ wahrt den Willens- und Wahlaspekt besser als das allgemeinere „Absicht“.
theological_decisions:
- issue: Gottes Kenntnis der προαίρεσις jedes Menschen
  choice: „der Herr kennt die innere Entscheidung eines jeden“
  alternative: „der Herr kennt die Absicht eines jeden“
  rationale: Die Übersetzung hält fest, dass Gott die bewusste innere Willensausrichtung kennt, ohne daraus eine bestimmte Lehre über Vorherbestimmung, Verdienst oder freie Willensfähigkeit abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der zweimalige Satzanfang mit „Denn“ folgt der griechischen Begründungsstruktur. „Eines jeden“ ist leicht gehoben, aber verständlich und dem testamentarischen Register angemessen.
