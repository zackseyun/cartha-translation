  source_fidelity: Die Wiedergabe von ἀσθενούντων als „krank waren“ ist zutreffend. „blieb ich ohne Krankheit“ gibt ἄνοσος zwar wieder, lässt jedoch die Bewegungs- bzw. Durchgangsbedeutung von παρῆλθον aus. προαίρεσις bezeichnet hier am angemessensten die Absicht beziehungsweise bewusste Willensausrichtung; „innere Entscheidung“ ist enger und kann eine bereits vollzogene Einzelentscheidung nahelegen.
  naturalness: Der Text ist insgesamt verständlich und würdevoll. „kam ich ohne Krankheit hindurch“ ist für den Zusammenhang natürlicher und bildet die griechische Verbverbindung vollständiger ab als „blieb ich ohne Krankheit“.
  terminology: „Der Herr“ ist eine angemessene Wiedergabe von Κύριος. „Absicht“ ist für προαίρεσις im modernen Standarddeutsch idiomatisch und bewahrt die Aussage ohne unnötige psychologische oder dogmatische Zuspitzung.
