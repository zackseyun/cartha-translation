base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/012.yaml
  text: But we all rose up and said to him, “If you do not give the tunic, we will tell our father that you alone did this evil thing in Israel.”
translation:
  language: de
  text: 'Da standen wir alle auf und sagten ihm: »Wenn du das Untergewand nicht gibst, werden wir unserem Vater sagen, dass du allein diese böse Tat in Israel begangen hast.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστάντες
  choice: standen … auf
  rationale: Gibt das Partizip natürlich und zugleich nah am griechischen Bewegungsverb wieder.
- source_word: χιτῶνα
  choice: Gewand
  rationale: χίτων bezeichnet ein körpernah getragenes Kleidungsstück; »Gewand« ist hier verständlich und vermeidet die heute missverständliche Verengung von »Tunika«.
- source_word: τὸ πονηρὸν τοῦτο
  choice: diese böse Tat
  rationale: Das substantivierte Neutrum bezeichnet hier das begangene Böse; »böse Tat« ist im Deutschen idiomatischer als »dieses Böse«.
- source_word: ἐν Ἰσραήλ
  choice: in Israel
  rationale: Bewahrt die kollektive bzw. heilsgeschichtliche Orts- und Gemeinschaftsbezeichnung des griechischen Textes ohne zusätzliche Deutung.
theological_decisions:
- issue: Bedeutung von »Israel«
  choice: in Israel
  alternative: am Volk Israel / innerhalb Israels
  rationale: Die knappe Form des Ausgangstextes bleibt erhalten; ob »Israel« das Volk, die Gemeinschaft oder den patriarchalen Verband bezeichnet, wird nicht festgelegt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede bleibt klar und eindringlich; »herausgibst« macht die geforderte Übergabe des Gewandes im Kontext natürlich verständlich.
