  text: For they stripped Joseph of the tunic when they sold him, and clothed him in a servant’s garment.
translation:
  language: de
  text: Denn sie zogen Josef die Tunika aus, als sie ihn verkauften, und kleideten ihn in ein Sklavengewand.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χιτών
  choice: Untergewand
  rationale: Bezeichnet ein unmittelbar am Körper getragenes Kleidungsstück; „Untergewand“ ist im biblischen Sprachgebrauch verständlich und genauer als das moderne „Tunika“.
- source_word: ἐξέδυσαν
  choice: zogen … aus
  rationale: Gibt den transitiven Aorist natürlich und unmittelbar wieder.
- source_word: ἐν τῷ πιπράσκειν αὐτόν
  choice: als sie ihn verkauften
  rationale: Die temporale Konstruktion mit substantiviertem Präsensinfinitiv bezeichnet den Vorgang bzw. Zeitpunkt des Verkaufs; das deutsche Präteritum ist hier idiomatisch, ohne eine zusätzliche Verlaufsnuance aufzuzwingen.
- source_word: ἱμάτιον δουλικόν
  choice: Sklavengewand
  rationale: δουλικόν bedeutet hier „einem Sklaven zugehörig/entsprechend“. „Sklavengewand“ bewahrt den sozialen Status deutlicher als das weiter gefasste „Dienergewand“.
