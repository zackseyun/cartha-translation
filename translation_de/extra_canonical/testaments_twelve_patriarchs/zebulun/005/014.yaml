id: T12P.ZEB.5.14
reference: Testament of Zebulun 5:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: V. Καὶ νῦν¹, τέκνα μου, παραγγέλλω² ὑμῖν *τοῦ φυλάσσειν τὰς ἐντολὰς Κυρίου³, καὶ ποιεῖν⁴ ἔλεος ⌜πρὸς⌝⁵ τὸν⁶ πλησίον⁷, καὶ εὐσπλαγχνίαν *ἔχειν πρὸς πάντας⁸ οὐ μόνον *ἐν ἀνθρώποις⁹, ἀλλὰ *καὶ ἐν ἀλόγοις ζώοις¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/005/014.yaml
  text: And now, my children, I command you to keep the commandments of the Lord, and to show mercy to your neighbor, and to have compassion toward all, not only toward people but also toward unreasoning animals.
translation:
  language: de
  text: Und nun, meine Kinder, gebiete ich euch, die Gebote des Herrn zu halten, eurem Nächsten Barmherzigkeit zu erweisen und allen gegenüber Mitgefühl zu haben – nicht nur gegenüber Menschen, sondern auch gegenüber vernunftlosen Tieren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάσσειν
  choice: zu halten
  rationale: Im Zusammenhang mit Geboten bezeichnet das Verb deren Befolgung beziehungsweise Bewahrung; „die Gebote halten“ ist im Deutschen natürlich und sachlich genau.
- source_word: ποιεῖν ἔλεος πρὸς τὸν πλησίον
  choice: eurem Nächsten Barmherzigkeit zu erweisen
  rationale: Gibt die Handlungskonstruktion wörtlichkeitsnah und zugleich in idiomatischem Deutsch wieder; πλησίον bleibt als „Nächster“ in seiner ethisch-religiösen Weite erhalten.
- source_word: εὐσπλαγχνίαν ἔχειν πρὸς πάντας
  choice: allen gegenüber Mitgefühl zu haben
  rationale: Bewahrt die Ausrichtung auf alle und gibt εὐσπλαγχνία als inneres, tätiges Erbarmen verständlich mit „Mitgefühl“ wieder.
- source_word: ἄλογοις ζώοις
  choice: vernunftlosen Tieren
  rationale: Entspricht der antiken Bedeutung von ἄλογος als „ohne Vernunft“ und vermeidet die sachlich falsche Wiedergabe „unvernünftig“ im Sinn eines törichten Verhaltens.
theological_decisions:
- issue: Reichweite des gebotenen Mitgefühls
  choice: „allen gegenüber“, ausdrücklich Menschen und Tiere umfassend
  alternative: „unter allen“ beziehungsweise eine Beschränkung auf Menschen
  rationale: πρὸς πάντας wird durch die anschließende Gegenüberstellung ausdrücklich auf Menschen und vernunftlose Tiere bezogen; diese ungewöhnlich weite ethische Aussage bleibt unverkürzt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Infinitivstruktur der Mahnung bleibt erhalten; der Gedankenstrich macht die erläuternde Ausweitung auf Menschen und Tiere gut lesbar.
