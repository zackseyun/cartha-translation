base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/008.yaml
  text: “Have mercy on me, my brothers; have compassion, by the compassion of Jacob our father. Do not bring your hands upon me to shed innocent blood, for I have not sinned against you.”
translation:
  language: de
  text: „Habt Erbarmen mit mir, meine Brüder! Habt Mitleid mit dem Herzen Jakobs, unseres Vaters.[a] Legt nicht Hand an mich, um unschuldiges Blut zu vergießen; denn ich habe nicht gegen euch gesündigt, auch wenn ich unter euch geraten bin.[b]“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Erbarmt euch über die Eingeweide Jakobs“; „Eingeweide“ bezeichnet hier bildlich sein Innerstes und sein tiefes väterliches Mitgefühl.'
    reason: Erklärt das semitisch geprägte Körperbild von σπλάγχνα und macht die formale Gestalt der Vorlage sichtbar.
  - marker: b
    text: 'Oder: „und ich bin unter euch geraten“. Die knappe griechische Partizipialkonstruktion lässt das genaue Verhältnis zum vorhergehenden Satz offen.'
    reason: Bewahrt die echte syntaktische Mehrdeutigkeit von καὶ πεσὼν εἰς ὑμᾶς.
lexical_decisions:
- source_word: ἐλεήσατέ με
  choice: Habt Erbarmen mit mir
  rationale: Gibt den direkten, eindringlichen Imperativ natürlich und würdevoll wieder.
- source_word: οἰκτειρήσατε σπλάγχνα Ἰακώβ
  choice: Habt Mitleid mit dem Herzen Jakobs
  rationale: σπλάγχνα bezeichnet wörtlich die inneren Organe, idiomatisch jedoch das Innerste und den Sitz tiefen Mitgefühls. „Herz“ vermittelt dieses Bild im heutigen Deutschen, ohne die Bitte auf ein abstraktes Mitgefühl zu reduzieren.
- source_word: Μὴ ἐπαγάγετε τὰς χεῖρας ὑμῶν
  choice: Legt nicht Hand an mich
  rationale: Die feste deutsche Wendung entspricht dem gewaltsamen Handanlegen; das Objekt „mich“ ergibt sich aus dem vorhergehenden με und dem Zusammenhang.
- source_word: ἐκχέαι αἷμα ἀθῷον
  choice: um unschuldiges Blut zu vergießen
  rationale: Bewahrt Bild, Syntax und moralische Aussage des griechischen Ausdrucks.
- source_word: πεσὼν εἰς ὑμᾶς
  choice: auch wenn ich unter euch geraten bin
  rationale: Bewahrt das ungewöhnliche Bild des Hinein- bzw. Unter-sie-Geratens, ohne das im Griechischen nicht ausdrücklich vorhandene Wort „Hände“ einzufügen.
theological_decisions:
- issue: Bezug von σπλάγχνα Ἰακώβ
  choice: „das Herz Jakobs“ als Gegenstand des Mitleids
  alternative: „bei dem Mitgefühl Jakobs“
  rationale: Der griechische Akkusativ legt näher, dass Jakobs innerste Regungen geschont bzw. bemitleidet werden sollen. Eine instrumentale oder beschwörende Wiedergabe mit „bei“ wäre möglich, aber grammatisch weniger unmittelbar.
- issue: Verhältnis von καὶ πεσὼν εἰς ὑμᾶς zum vorhergehenden Satz
  choice: 'konzessiv: „auch wenn ich unter euch geraten bin“'
  alternative: 'additiv: „und ich bin unter euch geraten“'
  rationale: Die Partizipialkonstruktion ist knapp und mehrdeutig. Die konzessive Fassung ergibt im Zusammenhang einen verständlichen Sinn, ohne eine Schuld oder göttliche Fügung in den Text hineinzulesen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, eindringlichem Ton. Die direkte brüderliche Anrede und das traditionelle Bild vom Vergießen unschuldigen Blutes bleiben erhalten; ungewöhnliche oder mehrdeutige Formulierungen der griechischen Vorlage werden durch Fußnoten offengelegt.
