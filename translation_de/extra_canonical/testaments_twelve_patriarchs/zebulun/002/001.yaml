lexical_decisions:
- source_word: υἱοὶ Ζαβουλών
  choice: Ihr Söhne Sebulons
  rationale: Die direkte Anrede wird im Deutschen durch „Ihr“ natürlich und eindeutig wiedergegeben; der Name erscheint in der etablierten deutschen Form „Sebulon“ mit regulärem Genitiv.
- source_word: προσέχετε
  choice: achtet auf
  rationale: Der Imperativ bezeichnet aufmerksames Hören beziehungsweise Beachten; „achtet auf“ bewahrt diesen Sinn in natürlichem modernem Deutsch.
- source_word: ῥήμασιν
  choice: die Worte
  rationale: ῥήματα meint hier die gesprochenen Äußerungen beziehungsweise Weisungen des Vaters; „Worte“ ist kontextgerecht und wahrt die Mehrzahl.
- source_word: τοῦ πατρὸς ὑμῶν
  choice: eures Vaters
  rationale: Die Possessivkonstruktion wird knapp und idiomatisch wiedergegeben, ohne zusätzliche Deutung.
