source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 4. Οὐκ ἔγνων ⌜δὲ²⁶⌝ ὅτι ἥμαρτον ἐν ταῖς ἡμέραις μου ⌜παρεκτὸς ἐννοίας⌝.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/003.yaml
  text: And I did not know that I had sinned in my days, except in intention.
translation:
  language: de
  text: Und ich wusste nicht, dass ich in meinen Tagen gesündigt hatte, außer in Gedanken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: außer in der Absicht; das griechische Wort kann Gedanken, Gesinnung oder Absicht bezeichnen.'
    reason: Die Bedeutungsbreite von ἔννοια lässt sich im Haupttext nicht vollständig mit einem einzigen deutschen Ausdruck abbilden.
lexical_decisions:
- source_word: ἔγνων
  choice: ich wusste
  rationale: Der Aorist wird im erzählenden Rückblick als Vergangenheit wiedergegeben; „wusste“ ist im Deutschen natürlicher als das hier ebenfalls mögliche „erkannte“.
- source_word: ἐν ταῖς ἡμέραις μου
  choice: in meinen Tagen
  rationale: Die bildhafte Zeitangabe wird formal bewahrt und bezeichnet die Zeit seines Lebens beziehungsweise seines bisherigen Lebens.
- source_word: παρεκτὸς ἐννοίας
  choice: außer in Gedanken
  rationale: Die Wendung bezeichnet eine Ausnahme im inneren Bereich des Denkens oder Beabsichtigens. „In Gedanken“ ist natürliches Deutsch, ohne die mögliche Bedeutung „Absicht“ auszuschließen.
theological_decisions:
- issue: Umfang des Sündenbekenntnisses
  choice: Die Einschränkung „außer in Gedanken“ bleibt wörtlich erkennbar.
  alternative: Die Aussage als völlige Sündlosigkeit oder ausschließlich als nicht ausgeführte böse Absicht auszulegen.
  rationale: Der griechische Text beansprucht eine Ausnahme für ἔννοια, legt aber nicht eindeutig fest, ob damit Gedanken, Gesinnung oder Absicht gemeint sind; diese Spannung darf nicht dogmatisch aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Vergangenheitsfolge „wusste … gesündigt hatte“ gibt den rückblickenden Zusammenhang natürlich wieder; die knappe und spannungsreiche Selbstaussage des Ausgangstextes bleibt erhalten.
