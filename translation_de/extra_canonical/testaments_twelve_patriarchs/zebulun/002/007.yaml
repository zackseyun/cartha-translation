  text: II. Ἦλθον¹ γὰρ ὁ² Συμεὼν Γκαὶ ὁ Δὰν˥ καὶ ὁ² Γὰδ ἐπὶ τὸν Ἰωσὴφ τοῦ ἀνελεῖν αὐτόν, καὶ ἔλεγεν αὐτοῖς μετὰ δακρύων.
