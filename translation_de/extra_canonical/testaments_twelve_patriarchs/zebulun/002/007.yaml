base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/007.yaml
  text: For Simeon and Dan and Gad came against Joseph to kill him, and he spoke to them with tears.
translation:
  language: de
  text: Denn Simeon, Dan und Gad kamen gegen Josef, um ihn zu töten; und er redete unter Tränen zu ihnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἦλθον … ἐπὶ τὸν Ἰωσήφ
  choice: kamen gegen Josef
  rationale: Bewahrt die feindselige Zielrichtung der griechischen Konstruktion, ohne über den Wortlaut hinauszugehen.
- source_word: τοῦ ἀνελεῖν αὐτόν
  choice: um ihn zu töten
  rationale: Gibt den finalen Sinn des artikulierten Infinitivs und die hier klare Bedeutung von ἀναιρέω direkt wieder.
- source_word: ἔλεγεν αὐτοῖς μετὰ δακρύων
  choice: er aber redete unter Tränen auf sie ein
  rationale: Das Imperfekt bezeichnet fortgesetztes bzw. wiederholtes Reden; „auf sie einreden“ vermittelt dies natürlich und wahrt, anders als eine direkte Redeformel, dass kein Redeinhalt folgt. „Unter Tränen“ entspricht μετὰ δακρύων.
theological_decisions:
- issue: Bezug des unausgedrückten Subjekts von ἔλεγεν
  choice: „er“ bezieht sich im Erzählzusammenhang auf Josef
  alternative: Bezug auf einen der zuvor genannten Brüder
  rationale: Die maskuline Singularform wechselt von den pluralischen Angreifern zu einer einzelnen Person; Josef ist der unmittelbar zuvor genannte mögliche Referent und redet angesichts der Tötungsabsicht unter Tränen auf sie ein.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die adversative Partikel „aber“ macht den griechischen Subjektwechsel idiomatisch erkennbar. Keine Fußnoten erforderlich.
