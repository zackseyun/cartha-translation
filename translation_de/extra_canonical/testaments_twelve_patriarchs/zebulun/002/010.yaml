  terminology: Für ἐξεχύθησαν ist „ergoss sich“ die sachnähere deutsche Wiedergabe. „Die ganze Substanz meiner Eingeweide erschlaffte“ bildet ὑπόστασις, σπλάγχνα und ἐχαυνοῦτο transparent ab, ohne die anatomisch-emotionale Metapher zu einer bestimmten theologischen oder psychologischen Deutung umzuformen.
