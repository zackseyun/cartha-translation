  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/010.yaml
  text: And as he spoke these words in grief, while I could not bear his cries, I began to weep, and my liver was poured out, and all the substance of my inward parts grew faint.
translation:
  language: de
  text: Und als er diese Worte klagend sprach und ich sein Wehgeschrei nicht ertragen konnte, begann ich zu weinen; meine Leber ergoss sich, und die ganze Substanz meiner Eingeweide erschlaffte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γὀδυρόμενος˥
  choice: klagend
  rationale: Das Partizip bezeichnet ein von Schmerz und Trauer geprägtes Klagen; „klagend“ gibt dies knapp und natürlich wieder.
- source_word: οἰμωγῶν
  choice: Wehgeschrei
  rationale: Das Wort meint laute Klage- oder Schmerzensrufe; „Wehgeschrei“ bewahrt deren Intensität.
- source_word: τὰ ἤπατά μου ἐξεχύθησαν
  choice: meine Leber zerfloss
  rationale: Die körperlich-emotionale Bildsprache wird bewusst erhalten. Der Plural des griechischen Ausdrucks wird entsprechend natürlichem deutschen Sprachgebrauch als Singular wiedergegeben.
- source_word: πᾶσα ἡ ὑπόστασις τῶν σπλάγχνων μου
  choice: mein ganzes Inneres
  rationale: Die ungewöhnliche Wendung bezeichnet die gesamte innere Substanz beziehungsweise das Innere des Sprechers; die Übersetzung bleibt anschaulich, ohne eine unnatürliche anatomische Formulierung zu erzwingen.
- source_word: ἐχαυνοῦτο
  choice: wurde kraftlos
  rationale: Das Verb kann ein Erschlaffen, Schwachwerden oder Dahinschwinden ausdrücken; „wurde kraftlos“ passt zum körperlichen Bild und bewahrt dessen Offenheit.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die fremdartige antike Körpermetaphorik „meine Leber zerfloss“ bleibt erhalten, während die umständlichere Formulierung über die Substanz der Eingeweide idiomatisch als „mein ganzes Inneres“ wiedergegeben wird.
