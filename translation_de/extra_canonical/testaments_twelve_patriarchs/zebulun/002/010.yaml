  source_fidelity: Der Satzbau und die Abfolge der Vorgänge sind im Entwurf zutreffend. Jedoch gibt „zerfloss“ ἐξεχύθησαν („wurde/ward ausgegossen, ergoss sich“) nicht hinreichend genau wieder. Zudem ist „mein ganzes Inneres“ gegenüber πᾶσα ἡ ὑπόστασις τῶν σπλάγχνων μου zu stark verallgemeinernd und lässt sowohl die ungewöhnliche Rede von der inneren/anatomischen „Substanz“ als auch das Erschlaffen der Eingeweide verschwinden.
