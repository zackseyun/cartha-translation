source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 5. Οὐ²⁷ μνήσκομαι²⁸ ὅτι παρανομίαν ἐποίησα, πλὴν τὴν ἄγνοιαν ἣν ἐποίησα²⁹ ἐπὶ τοῦ³⁰ Ἰωσήφ, ὅτι ἐβεβαίωσα³¹ τοῖς ἀδελφοῖς μου³² *μὴ εἰπεῖν³³ *τῷ πατρί μου³⁴ τὸ γενόμενον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/004.yaml
  text: I do not remember that I committed lawlessness, except for the ignorance that I committed concerning Joseph, in that I assured my brothers not to tell my father what had happened.
translation:
  language: de
  text: Ich kann mich nicht erinnern, Gesetzlosigkeit begangen zu haben, außer der Verfehlung, die ich aus Unwissenheit in Bezug auf Josef beging, indem ich meinen Brüdern zusicherte, meinem Vater nicht zu sagen, was geschehen war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρανομίαν
  choice: Unrecht
  rationale: Bezeichnet eine Übertretung beziehungsweise gesetzeswidriges Handeln; „Unrecht“ ist im Deutschen natürlich und bewahrt den moralisch-rechtlichen Gehalt.
- source_word: τὴν ἄγνοιαν ἣν ἐποίησα
  choice: der Verfehlung aus Unwissenheit
  rationale: Die wörtliche Verbindung „Unwissenheit begehen“ wäre unidiomatisch. Die Formulierung bewahrt sowohl den Tatbezug von ἐποίησα als auch den Gedanken mangelnder Einsicht in ἄγνοια.
- source_word: ἐπὶ τοῦ Ἰωσήφ
  choice: in der Sache mit Josef
  rationale: Gibt die weit gefasste Bezugnahme natürlich wieder, ohne die genaue Art des Verhaltens gegenüber Josef enger festzulegen.
- source_word: ἐβεβαίωσα τοῖς ἀδελφοῖς μου
  choice: Ich bestärkte meine Brüder darin
  rationale: ἐβεβαίωσα kann „bekräftigen“, „bestätigen“ oder „bestärken“ bedeuten. Mit dem folgenden Infinitiv ist „darin bestärken“ verständlich und lässt offen, ob eine Zusicherung oder eine Einflussnahme gemeint ist.
- source_word: τὸ γενόμενον
  choice: was geschehen war
  rationale: Natürliche und genaue Wiedergabe des substantivierten Partizips mit dem zeitlichen Verhältnis der Vorvergangenheit.
theological_decisions:
- issue: Zebuluns Bewertung seiner Beteiligung an der Behandlung Josefs
  choice: „Verfehlung aus Unwissenheit“
  alternative: „Unwissenheit, die ich beging“
  rationale: Der griechische Ausdruck verbindet ἄγνοια mit dem Verb „tun/begehen“. Die deutsche Fassung wahrt seine Selbstentlastung durch Unwissenheit, bezeichnet das Verhalten aber weiterhin als schuldhafte Tat, ohne diese Spannung aufzulösen.
- issue: Art der Absprache mit den Brüdern
  choice: „bestärkte meine Brüder darin“
  alternative: „versicherte meinen Brüdern“ / „gab meinen Brüdern mein Wort“
  rationale: Der Infinitiv μὴ εἰπεῖν kann sich syntaktisch auf das von den Brüdern erwartete Schweigen beziehen. Die gewählte Fassung vermeidet die stärkere, im Kontext nicht zwingende Deutung eines persönlichen Schweigeversprechens.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die sperrige griechische Wiederholung von ἐποίησα wird nicht mechanisch nachgebildet, ihr Tat- und Schuldcharakter jedoch in „Verfehlung“ bewahrt. „Josef“ folgt der heute üblichen deutschen Namensform.
