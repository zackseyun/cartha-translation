  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/005.yaml
  text: But I wept in secret for many days because of Joseph. For I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be killed.
translation:
  language: de
  text: Doch ich weinte viele Tage lang im Verborgenen um Josef. Denn ich fürchtete mich vor meinen Brüdern, weil sie alle miteinander vereinbart hatten, dass jeder, der das Geheimnis verriete, getötet werden sollte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν κρυφῇ
  choice: im Verborgenen
  rationale: Gibt die adverbiale Wendung natürlich und würdevoll wieder und bewahrt den Sinn heimlichen Weinens.
- source_word: διὰ τὸν Ἰωσήφ
  choice: um Josef
  rationale: Im Zusammenhang des Weinens bezeichnet διά mit Akkusativ den Anlass; deutsches „um Josef weinen“ ist idiomatisch und präzise.
- source_word: συνέθεντο
  choice: miteinander vereinbart hatten
  rationale: Bewahrt den Sinn einer gemeinsamen Abmachung unter den Brüdern und macht πάντες angemessen deutlich.
- source_word: ὅστις ἐξείπῃ τὸ μυστήριον
  choice: jeder, der das Geheimnis verriete
  rationale: „Verraten“ gibt das Offenbaren eines bewusst gehüteten Geheimnisses im Deutschen treffend wieder; der Konjunktiv kennzeichnet den vereinbarten hypothetischen Fall.
- source_word: ἀναιρεθῆναι
  choice: getötet werden sollte
  rationale: Direkte Wiedergabe des passiven Infinitivs mit Tötungsbedeutung, ohne die Aussage abzuschwächen oder eine bestimmte Hinrichtungsform einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. „Doch“ bildet den adversativen Anschluss ab; die Wiederholung der Begründung durch „Denn … weil“ folgt der griechischen Gedankenführung, ohne unnötig schwerfällig zu wirken.
