base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/002.yaml
  text: I, Zebulun, became a good gift to my parents; for when I was born, my father increased greatly, and so did the sheep and the cattle, when he had his portion among the variegated rods.
translation:
  language: de
  text: Ich, Sebulon, bin meinen Eltern zu einer guten Gabe geworden; denn als ich geboren wurde, ging es meinem Vater sehr gut, und auch die Schafe und die Rinder nahmen stark zu, als sie bei den bunten Stäben ihren Anteil hatten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Formulierung spielt offenbar auf Jakobs bunte Stäbe und den ihm zugeteilten Anteil an den Herden an; siehe 1. Mose 30,37–43. Der griechische Wortlaut ist im Schlussglied ungewöhnlich: Er kann enger mit „unter den bunten Stäben“ wiedergegeben werden und hat hier ein Pluralverb („sie hatten“), dessen Bezug nicht völlig klar ist.'
    reason: Erläutert die intertextuelle Anspielung, bewahrt die räumliche Mehrdeutigkeit von ἐν und macht den unklaren pluralischen Bezug von εἶχον transparent.
lexical_decisions:
- source_word: δόσις ἀγαθή
  choice: eine gute Gabe
  rationale: Bewahrt die konkrete und positiv wertende Bedeutung der griechischen Wendung und klingt im Deutschen würdig und verständlich.
- source_word: ηὐξήνθη ὁ πατήρ μου
  choice: der Besitz meines Vaters … nahm stark zu
  rationale: Das wörtliche „mein Vater nahm zu“ wäre im Deutschen missverständlich. Im Kontext der anschließenden Herden bezeichnet die Aussage den Zuwachs seines Vermögens; die Ergänzung „Besitz“ macht den impliziten Sinn sichtbar.
- source_word: τὰ πρόβατα καὶ τὰ βουκόλια
  choice: die Schafe und die Rinder
  rationale: Gibt beide Herdengattungen natürlich und genau wieder; βουκόλια bezeichnet Rinderherden beziehungsweise Rinder.
- source_word: ἐν ταῖς ποικίλαις ῥάβδοις
  choice: bei den gesprenkelten Stäben
  rationale: „Gesprenkelt“ greift den Erzählzusammenhang von Genesis 30 auf, ohne die ungewöhnliche griechische Formulierung unnötig zu glätten.
- source_word: τὸν κλῆρον
  choice: seinen Anteil
  rationale: κλῆρος kann Los, Anteil oder zugeteilten Besitz bedeuten; „Anteil“ passt hier zum Erwerb aus den Herden und vermeidet eine ungesicherte Festlegung auf ein förmliches Erbe.
theological_decisions:
- issue: Art des Zuwachses des Vaters
  choice: Zuwachs seines Besitzes
  alternative: „mein Vater nahm stark zu“ oder „mein Vater gedieh sehr“
  rationale: Der Kontext nennt Schafe und Rinder und legt wirtschaftlichen beziehungsweise herdenbezogenen Zuwachs nahe. Die Übersetzung macht diese im Griechischen elliptische Beziehung verständlich, ohne einen besonderen theologischen Segensbegriff einzutragen.
- issue: Bezug der gesprenkelten Stäbe
  choice: Die Wendung bleibt eng am Motiv der Stäbe und wird durch eine Fußnote erläutert.
  alternative: Freie Wiedergabe als Hinweis auf Jakobs Herdengewinn
  rationale: Die griechische Konstruktion ist ungewöhnlich und spielt offenbar auf Genesis 30,37–43 an. Die Hauptfassung bewahrt diese Spannung, statt den Ausdruck stillschweigend auszudeuten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Der semitisch anmutende Ausdruck „zu einer guten Gabe geworden“ bleibt erhalten; die Ellipse beim Zuwachs des Vaters wird für natürliche deutsche Verständlichkeit behutsam expliziert.
