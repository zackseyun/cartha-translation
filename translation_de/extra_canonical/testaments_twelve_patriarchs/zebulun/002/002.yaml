    issue: Das Subjekt ηὐξήνθη ὁ πατήρ μου wird durch „der Besitz meines Vaters“ ersetzt.
    rationale: Der Kontext legt materiellen Zuwachs nahe, aber der griechische Text nennt ausdrücklich den Vater. Die Übersetzung soll diesen Bezug nicht in einen anderen Satzgegenstand umformen.
  - severity: medium
    issue: „seinen Anteil erhielt“ verschiebt εἶχον τὸν κλῆρον.
    rationale: εἶχον bedeutet „hatten“ bzw. „besaßen“, nicht ausdrücklich „erhielten“. Zudem steht im überlieferten griechischen Wortlaut ein Pluralverb, dessen Bezug unsicher ist.
