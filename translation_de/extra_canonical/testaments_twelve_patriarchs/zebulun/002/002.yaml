revisions:
- from: Ich, Sebulon, bin meinen Eltern zu einer guten Gabe geworden; denn als ich geboren wurde, nahmen der Besitz meines Vaters sowie die Schafe und die Rinder stark zu, als er bei den gesprenkelten Stäben seinen Anteil erhielt.[a]
  to: Ich, Sebulon, bin meinen Eltern zu einer guten Gabe geworden; denn als ich geboren wurde, ging es meinem Vater sehr gut, und auch die Schafe und die Rinder nahmen stark zu, als sie bei den bunten Stäben ihren Anteil hatten.[a]
  rationale: Die Revision stellt den im Griechischen genannten Vater wieder her, ohne die im Deutschen missverständliche Formulierung „mein Vater nahm zu“ wörtlich nachzubilden. Sie vermeidet zugleich die nicht im Ausgangstext ausgedrückte Aussage, dass ein Anteil erst „erhalten“ wurde. Der pluralische und syntaktisch auffällige Schluss wird in der Übersetzung nicht harmonisierend singularisiert; die Fußnote dokumentiert die verbleibende Unsicherheit.
