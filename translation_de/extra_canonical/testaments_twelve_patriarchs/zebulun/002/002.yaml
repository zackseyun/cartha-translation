  source_fidelity: Die Grundbedeutung wird überwiegend getroffen. Jedoch ersetzt „der Besitz meines Vaters“ unzulässig das ausdrückliche Subjekt „mein Vater“, und „erhielt“ verschiebt εἶχον („hatten“) zu einem Erwerbsvorgang. Die im griechischen Text stehende pluralische Verbform εἶχον bei unklarem Bezug sollte nicht ohne Hinweis zu einem eindeutigen Singular geglättet werden.
  naturalness: Die vorgeschlagene Fassung ist gut lesbar. „Meinem Vater ging es sehr gut“ ist im Deutschen eine natürliche kontextbezogene Wiedergabe von „mein Vater nahm sehr zu“, ohne den griechischen Bezug auf den Vater durch „Besitz“ zu ersetzen. Die Schlusswendung bleibt bewusst etwas knapp und wird in der Fußnote erklärt.
  terminology: „gute Gabe“, „Schafe“, „Rinder“ und „Anteil“ sind passend. „bunte Stäbe“ gibt ποικίλαις idiomatisch wieder und wahrt die konkrete Bildsprache; „gesprenkelt“ wäre als Anspielung auf Genesis möglich, ist für ποικίλος aber enger als nötig.
  issues:
