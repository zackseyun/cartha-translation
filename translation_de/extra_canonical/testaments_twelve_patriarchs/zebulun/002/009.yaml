base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002/009.yaml
  text: But even if I have sinned, discipline me with discipline, my brothers; but do not raise your hand in the murder of your brother, for the sake of Jacob your father.”
translation:
  language: de
  text: Doch selbst wenn ich gesündigt habe, weist mich zurecht, meine Brüder; aber erhebt eure Hand nicht zum Mord an eurem Bruder – um eures Vaters Jakob willen.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν παιδείᾳ παιδεύσατέ με
  choice: weist mich zurecht
  rationale: Die figura etymologica bezeichnet erziehende Zurechtweisung oder Disziplinierung. Eine wörtliche Verdoppelung wie »züchtigt mich mit Züchtigung« wäre im modernen Deutschen unnatürlich und könnte unnötig körperliche Strafe nahelegen.
- source_word: τὴν χεῖρα ὑμῶν μὴ ἐνέγκατε ἐν φόνῳ
  choice: erhebt eure Hand nicht, um … zu töten
  rationale: Gibt das Handlungsbild der erhobenen Hand natürlich wieder und bewahrt zugleich den ausdrücklichen Bezug auf die Tötung.
- source_word: ἀδελφοῦ ὑμῶν
  choice: euren Bruder
  rationale: Der Genitiv hängt sinngemäß von φόνῳ ab; im Deutschen wird die betroffene Person beim Verb »töten« idiomatisch als Akkusativ ausgedrückt.
- source_word: διὰ Ἰακὼβ τὸν πατέρα ὑμῶν
  choice: um eures Vaters Jakob willen
  rationale: Bewahrt den begründenden beziehungsweise motivierenden Sinn von διά mit Akkusativ und den feierlichen Ton.
theological_decisions:
- issue: Art und Maß der geforderten Bestrafung
  choice: »weist mich zurecht« als erziehende Disziplinierung
  alternative: »züchtigt mich« oder »bestraft mich«
  rationale: παιδεία kann Zucht, Erziehung und Korrektur umfassen. Die Übersetzung legt weder zwingend körperliche Züchtigung noch bloß verbale Ermahnung fest.
- issue: Verhältnis von Schuld und Brudermord
  choice: Die eigene Sünde wird eingeräumt, während tödliche Vergeltung ausdrücklich abgelehnt wird.
  alternative: Die Aussage als Bestreiten jeder Strafwürdigkeit wiederzugeben
  rationale: Der Konditionalsatz lässt die Möglichkeit eigener Schuld stehen; der folgende Imperativ begrenzt dennoch die Reaktion der Brüder.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede »meine Brüder« und die Schlusswendung »um … willen« erhalten den feierlichen testamentarischen Ton; die griechische Wortwiederholung bei παιδεία/παιδεύω wird zugunsten natürlicher Verständlichkeit nicht mechanisch nachgebildet.
