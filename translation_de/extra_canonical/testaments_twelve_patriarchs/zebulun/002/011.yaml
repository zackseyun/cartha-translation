- source_word: οἱ ἁρμοὶ τοῦ σώματός μου
  choice: die Gelenke meines Körpers
  rationale: Formale und im Deutschen verständliche Wiedergabe der körperlichen Erschütterung.
- source_word: οὐκ ἠδυνάμην στῆναι
  choice: ich konnte nicht stehen
  rationale: Bewahrt die konkrete Bedeutung von στῆναι und vermeidet die interpretierende Verallgemeinerung „ich hatte keine Kraft“.
