base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/006.yaml
  text: First[a], then, I made a boat to sail on the sea, because the Lord gave me understanding and wisdom in it. And I fastened a piece of wood behind it[b], and
translation:
  language: de
  text: 6 Als Erster baute ich also ein Boot für die Fahrt auf dem Meer; denn der Herr hatte mir dafür Verständnis und Weisheit[a] gegeben. Und ich brachte hinten daran ein Stück Holz an, und …[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Weisheit“ kann hier neben allgemeiner Weisheit auch praktische, handwerkliche Befähigung bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: Der hier verfügbare griechische Kapiteltext ist nur fragmentarisch erhalten und bricht mitten im Satz nach „und“ ab.
    reason: textual_variant
lexical_decisions:
- source_word: Πρῶτος ⌈οὖν⌉
  choice: Als Erster … also
  rationale: Πρῶτος wird prädikativ als Anspruch verstanden, der Erste gewesen zu sein; οὖν wird mit „also“ wiedergegeben. Die Formulierung bleibt nah am Griechischen und klingt zugleich natürlich.
- source_word: σκάφος
  choice: Boot
  rationale: Der allgemeine Ausdruck bezeichnet ein Wasserfahrzeug. „Boot“ ist verständlich und vermeidet die stärkere Festlegung auf ein großes Schiff.
- source_word: ἐπιπλέειν
  choice: auf dem Meer fahren konnte
  rationale: Das Verb kann wörtlich „darauf schwimmen“ bedeuten, bezeichnet hier aber die Bewegung beziehungsweise Fahrt eines gebauten Wasserfahrzeugs. Die deutsche Wendung gibt den Zweck wieder, ohne Segel als Antrieb vorauszusetzen.
- source_word: σύνεσιν καὶ σοφίαν
  choice: Verständnis und Weisheit
  rationale: Die beiden Begriffe werden unterschieden wiedergegeben. „Weisheit“ bewahrt den weiteren theologischen Klang, kann im Bauzusammenhang aber zugleich praktische Befähigung einschließen.
- source_word: ἐν αὐτῷ
  choice: dafür
  rationale: Das Pronomen verweist im Zusammenhang auf den Bootsbau beziehungsweise diese Tätigkeit. „Dafür“ ist im Deutschen idiomatischer als ein mehrdeutiges „darin“, ohne den Bezug unnötig auszudeuten.
- source_word: καθῆκα ξύλον ὄπισθεν αὐτοῦ
  choice: ich brachte hinten daran ein Stück Holz an
  rationale: Die genaue nautische Funktion des Holzteils bleibt im Fragment unklar. „Brachte … an“ gibt die bauliche Befestigung zurück, ohne das Teil etwa als Ruder oder Steuer festzulegen.
- source_word: Κύριος
  choice: der Herr
  rationale: Der Titel bezeichnet hier ausdrücklich Gott und wird entsprechend der üblichen deutschen Bibelsprache wiedergegeben.
theological_decisions:
- issue: Göttlicher Ursprung handwerklicher Befähigung
  choice: Der Herr gibt Zebulun „Verständnis und Weisheit“ für den Bootsbau.
  alternative: σοφία könnte enger ausschließlich als handwerkliches Können wiedergegeben werden.
  rationale: Die Verbindung von σύνεσις und σοφία erlaubt sowohl einen umfassenden theologischen Sinn als auch die konkrete praktische Befähigung. Die Übersetzung bewahrt beide Ebenen, statt den Ausdruck auf bloßes Handwerk zu verengen.
translation_notes:
  register: Moderne, würdige Standardsprache. „Als Erster baute ich also“ bildet den griechischen Anfang knapp und verständlich ab. „Fahren konnte“ vermeidet die unbelegte Annahme eines Segelantriebs; das Auslassungszeichen macht zusammen mit der Fußnote den fragmentarischen Abbruch sichtbar.
