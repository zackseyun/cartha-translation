lexical_decisions:
- source_word: τιμή / τίμημα
  choice: Erlös; Preis
  rationale: Im Zusammenhang bezeichnet das Wort den beim Verkauf Josefs erhaltenen Gegenwert. »Erlös« ist in der Erzählerrede idiomatisch; »Preis« bewahrt in der wörtlichen Rede die Verbindung zum Preis des Blutes.
- source_word: ὑποδήματα / ὑπόδημα
  choice: Sandalen / Sandale
  rationale: Die konkrete Bezeichnung erhält das biblisch-rechtliche Bild aus 5. Mose 25 und verbindet Kauf, Erniedrigung und Vergeltung.
- source_word: καταπατήσωμεν
  choice: mit Füßen treten
  rationale: Die Wendung gibt die verächtliche, zugleich auf die gekauften Sandalen bezogene Handlung natürlich wieder.
- source_word: ἀναστῆσαι σπέρμα
  choice: Nachkommen erwecken
  rationale: »Nachkommen« ist für heutige Leser verständlicher als »Samen«, während »erwecken« die feste biblisch-rechtliche Ausdrucksweise und ihre Wiederaufnahme im Folgevers bewahrt.
- source_word: ζωὴν ἀδελφοῦ αὐτῶν
  choice: das Leben ihres Bruders
  rationale: Der überlieferte griechische Wortlaut wird nicht zu »Nachkommen« normalisiert. So bleibt die auffällige moralische Umdeutung der Schwagerehe-Sprache sichtbar.
- source_word: ὑπέλυσεν
  choice: zog … die Sandale aus
  rationale: Die konkrete Formulierung setzt das Motiv des Sandalausziehens aus dem Gesetzeszitat unmittelbar fort.
- source_word: παῖδες
  choice: Diener
  rationale: Im ägyptischen Hofzusammenhang bezeichnet das Wort funktional Josefs Untergebene; »Diener« ist klar, ohne unnötig ein bestimmtes Alter anzunehmen.
- source_word: κατὰ τὸν τύπον βασιλέως Φαραώ
  choice: wie man es vor König Pharao tat
  rationale: Diese Wiedergabe wahrt den Vergleich mit dem königlichen Hofzeremoniell und vermeidet die missverständliche Aussage, Josef selbst sei Pharao.
- source_word: ἐνεπτύσθησαν
  choice: wurden … angespuckt
  rationale: Das Passiv und die ausdrückliche Erzählbehauptung werden beibehalten; die Handlung wird nicht zu einem bloßen Symbol abgeschwächt.
theological_decisions:
- issue: Anwendung des Schwagerehe-Gesetzes auf Josefs Brüder
  choice: Die ungewöhnliche Aussage »das Leben ihres Bruders … aufrichten« bleibt im Haupttext erhalten.
  alternative: Den Wortlaut an das vorherige Gesetzeszitat angleichen und »Nachkommen für ihren Bruder erwecken« schreiben.
  rationale: Der griechische Text überträgt die Rechtssprache offenbar bewusst und rhetorisch auf die verweigerte Bewahrung von Josefs Leben. Eine Harmonisierung würde diese Spannung beseitigen.
- issue: Der Herr als Handelnder beim Ausziehen der Sandale
  choice: Der Herr bleibt ausdrücklich das Subjekt der vergeltenden Handlung.
  alternative: Die Aussage unpersönlich als Folge oder symbolische Entsprechung formulieren.
  rationale: Der griechische Text schreibt die Umkehrung und Beschämung ausdrücklich dem Herrn zu; diese theologische Deutung darf nicht abgeschwächt werden.
- issue: Anspucken der Brüder in Ägypten
  choice: Das Anspucken wird als direkt erzähltes Geschehen übersetzt und seine mögliche symbolische Lesart nur in einer Fußnote erwähnt.
  alternative: Die Aussage im Haupttext als bloß bildliche Erfüllung des Gesetzeszitats kennzeichnen.
  rationale: Der Erzähltext formuliert die Handlung ausdrücklich, auch wenn ihr enger Bezug zum Gesetzeszitat eine symbolische Auslegung nahelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Rechtssprache. Der Haupttext folgt der im griechischen Quellenauszug ausdrücklich mit »III« markierten Kapitelgrenze; die davor überlieferten Verse gehören zum Ende des vorigen Kapitels und wurden daher nicht als Teil von Kapitel 3 aufgenommen. Auffällige griechische Formulierungen werden nicht stillschweigend harmonisiert, sondern im Text bewahrt und knapp erläutert.
