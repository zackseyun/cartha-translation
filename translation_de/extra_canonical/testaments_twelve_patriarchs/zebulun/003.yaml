  text: '1[a]. And when they had done this, they all sat down to eat and drink. But I, seeing that Joseph was grieving, did not eat with them, but I kept watch over the pit, praying for help for him.


    2. And in the meantime Reuben arose and said, “Come, my brothers, let us not kill him, but let us throw him into one of these dry pits which our fathers dug and found no water.”


    3. For this reason the Lord prevented water from springing up in them, so that Joseph might be preserved[b].


    4. And they did so until they sold him to the Ishmaelites.


    5. As for his price, my children, I had no share in it. But Simeon and Dan and Gad, and their sons, took his price and bought sandals for themselves and for their wives and their children,


    6. saying, “We will not eat from it, because it is the price of our brother’s blood; rather, we will trample it underfoot, because he said that he would reign over us, and then we shall see what his dreams are.”


    7. Therefore it is written in the record of the law of Moses: “The man who does not wish to raise up seed for his brother—his sandal shall be removed, and they shall spit in his face.”


    8. And the brothers of Joseph were not willing to raise up the life of their brother, and the Lord removed from them the sandal which they wore against Joseph their brother.


    9. For when they came into Egypt, they had their sandals removed by the attendants of Joseph outside the gate, and so they bowed down to Joseph in the manner of those before King Pharaoh.


    10. And not only did they bow down to him, but immediately, as they fell before him, they were also spat upon[c], and they were put to shame by the Egyptians.'
translation:
  language: de
  text: '**Testament Sebulons 3**


    **1** Denn an dem Erlös für ihn hatte ich keinen Anteil, meine Kinder.


    **2** Simeon aber, Dan und Gad samt ihren Kindern nahmen den Erlös für ihn und kauften davon Sandalen für sich, ihre Frauen und ihre Kinder. Sie sagten:


    **3** »Wir wollen nichts davon verzehren, denn es ist der Preis für das Blut unseres Bruders. Vielmehr wollen wir ihn mit Füßen treten, weil er gesagt hat, er werde als König über uns herrschen. Dann wollen wir sehen, was es mit seinen Träumen auf sich hat.«


    **4** Darum steht im Buch des Gesetzes des Mose geschrieben: »Wer seinem Bruder keine Nachkommen erwecken will, dem soll die Sandale ausgezogen und ins Gesicht gespuckt werden.«[a]


    **5** Die Brüder Josefs aber wollten das Leben ihres Bruders nicht aufrichten,[b] und der Herr zog ihnen die Sandale aus, die sie gegen Josef, ihren Bruder, getragen hatten.


    **6** Denn als sie nach Ägypten kamen, zogen Josefs Diener ihnen draußen vor dem Tor die Sandalen aus. So warfen sie sich vor Josef nieder, wie man es vor König Pharao tat.


    **7** Und sie warfen sich nicht nur vor ihm nieder; als sie vor ihm zu Boden fielen, wurden sie sogleich auch angespuckt[c] und von den Ägyptern beschämt.


    [a] Anspielung auf 5. Mose 25,5–10: Wer sich weigert, die Schwagerpflicht zu erfüllen, wird öffentlich beschämt, indem ihm die Sandale ausgezogen und ins Gesicht gespuckt wird.


    [b] Der griechische Wortlaut ist ungewöhnlich und lautet wörtlich: »das Leben ihres Bruders aufrichten«. Offenbar wird hier die Sprache des Schwagerehe-Gesetzes aus dem vorigen Vers als moralisches Bild auf Josefs Brüder übertragen.


    [c] Manche verstehen das Anspucken als sinnbildliche Fortführung des angeführten Gesetzes und nicht als historische Einzelheit. Der griechische Erzähltext stellt es jedoch ausdrücklich als Geschehen dar.'
  philosophy: optimal-equivalence
