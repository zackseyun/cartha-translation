  text: And in the meantime Reuben arose and said, “Come, my brothers, let us not kill him, but let us throw him into one of these dry pits, which our fathers dug and found no water.”
translation:
  language: de
  text: 'Inzwischen stand Ruben auf und sagte: »Kommt, meine Brüder! Lasst uns ihn nicht töten, sondern ihn in eine dieser trockenen Gruben werfen, die unsere Väter gegraben haben, ohne Wasser zu finden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐν δὲ τῷ μεταξὺ
  choice: Inzwischen
  rationale: Gibt die zeitliche Übergangsformel knapp und natürlich wieder; δέ markiert hier lediglich die Fortführung der Erzählung.
- source_word: ἀναστὰς
  choice: stand … auf
  rationale: Bewahrt die konkrete Bedeutung des Partizips und verbindet sie idiomatisch mit dem folgenden Sprechakt.
- source_word: Δεῦτε ἀδελφοί μου
  choice: Kommt, meine Brüder!
  rationale: Δεῦτε ist eine auffordernde Interjektion; die direkte Anrede wird in würdigem, allgemein verständlichem Deutsch beibehalten.
- source_word: μὴ ἀποκτείνωμεν
  choice: Lasst uns ihn nicht töten
  rationale: Gibt den prohibitiv-hortativen Konjunktiv direkt wieder.
- source_word: ῥίψωμεν
  choice: werfen
  rationale: Entspricht dem hortativen Aorist und bewahrt die körperlich-konkrete Handlung.
- source_word: ξηρῶν λάκκων
  choice: trockenen Gruben
  rationale: λάκκος bezeichnet eine Grube beziehungsweise Zisterne; »Gruben« bleibt im Kontext natürlich, während »trocken« das Fehlen von Wasser ausdrücklich erhält.
- source_word: ὧν ὤρυξαν οἱ πατέρες ἡμῶν, καὶ οὐχ εὗρον ὕδωρ
  choice: die unsere Väter gegraben haben, ohne Wasser zu finden
  rationale: Die deutsche Konstruktion gibt den sachlichen Zusammenhang beider griechischer Verben flüssig wieder, ohne eine zusätzliche Ursache oder Absicht einzutragen.
