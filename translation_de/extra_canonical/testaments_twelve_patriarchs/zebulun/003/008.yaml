base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/008.yaml
  text: And the brothers of Joseph were not willing to preserve the life of their brother, and the Lord took from them the sandal that they wore against Joseph their brother.
translation:
  language: de
  text: Und Josefs Brüder wollten das Leben ihres Bruders nicht bewahren,[a] und der Herr zog ihnen die Sandale aus, die sie gegen ihren Bruder Josef getragen hatten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text ist an dieser Stelle unsicher; wörtlich etwa: „wollten das Leben ihres Bruders nicht“.'
    reason: Kennzeichnet die notwendige sinngemäße Ergänzung eines offenbar gestörten Ausdrucks.
  - marker: b
    text: 'Oder: „die sie wegen ihres Bruders Josef getragen hatten“.'
    reason: κατά kann hier eine feindliche Ausrichtung oder einen weiter gefassten Bezug auf Josef ausdrücken; der Zusammenhang lässt die genaue Nuance offen.
lexical_decisions:
- source_word: οὐκ ἠθέλησαν †ζωὴν ἀδελφοῦ αὐτῶν
  choice: wollten das Leben ihres Bruders nicht bewahren
  rationale: Der überlieferte griechische Ausdruck ist offenbar gestört und enthält kein ausdrückliches Verb für „bewahren“. Die Ergänzung gibt im Zusammenhang den naheliegenden Sinn wieder, ohne den Lebensbezug abzuschwächen.
- source_word: ὑπέλυσεν αὐτοὺς τὸ ὑπόδημα
  choice: zog ihnen die Sandale aus
  rationale: ὑπολύω bezeichnet hier das Lösen oder Ausziehen von Schuhwerk. Die deutsche Wendung bildet zugleich den ungewöhnlichen griechischen Satzbau idiomatisch ab.
- source_word: ὃ ἐφόρεσαν κατὰ Ἰωσὴφ
  choice: die sie gegen … Josef getragen hatten
  rationale: κατά mit dem Akkusativ wird bewusst formal als „gegen“ wiedergegeben, da die genaue Beziehung der Sandale zu Josef im Satz mehrdeutig bleibt.
theological_decisions:
- issue: Handeln des Herrn als Antwort auf das Verhalten der Brüder
  choice: Der Herr zog ihnen die Sandale aus
  alternative: Der Herr nahm ihnen die Sandale weg
  rationale: „Ausziehen“ liegt näher an ὑπολύω und bewahrt das konkrete Bild, ohne die Handlung ausdrücklich als Enteignung, Gericht oder Symbolhandlung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Einzahl „die Sandale“ und das schwer deutbare Bild bleiben erhalten; textkritische und semantische Unsicherheiten werden in Fußnoten offengelegt.
