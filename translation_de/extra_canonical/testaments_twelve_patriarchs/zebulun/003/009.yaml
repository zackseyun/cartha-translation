  text: 6. Καὶ *γὰρ ἐλθόντες ἐν Αἰγύπτῳ³³ ὑπελύθησαν³⁴ *ὑπὸ τῶν παίδων³⁵ Ἰωσὴφ ἔξωθεν³⁶ τοῦ πυλῶνος, καὶ οὕτως³⁷ προσεκύνησαν³⁸ *τῷ Ἰωσὴφ³⁹ κατὰ τὸν τύπον βασιλέως⁴⁰ Φαραώ⁴¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/009.yaml
  text: For when they came into Egypt, they had their sandals removed by the attendants of Joseph outside the gate, and so they bowed down to Joseph in the manner before King Pharaoh.
translation:
  language: de
  text: Denn als sie nach Ägypten kamen, zogen Josefs Diener ihnen draußen vor dem Tor die Sandalen aus. So warfen sie sich vor Josef nieder, wie man es vor König Pharao tat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπελύθησαν
  choice: ließen ihnen … die Sandalen ausziehen
  rationale: Das passive Verb bezeichnet hier das Ausziehen der Sandalen; die deutsche Konstruktion bewahrt sowohl den Vorgang als auch die ausdrücklich genannte handelnde Personengruppe.
- source_word: παίδων Ἰωσήφ
  choice: Josefs Diener
  rationale: παῖδες bezeichnet im vorliegenden Hofkontext die Diener beziehungsweise Bediensteten Josefs; „Diener“ ist verständlich und dem sozialen Kontext angemessen.
- source_word: προσεκύνησαν
  choice: warfen sie sich vor Josef nieder
  rationale: Das Verb beschreibt eine körperliche Huldigung oder ehrerbietige Niederwerfung; diese Wiedergabe ist anschaulicher und genauer als das schwächere „verbeugten sich“.
- source_word: κατὰ τὸν τύπον
  choice: wie man es … tat
  rationale: τύπος bezeichnet hier die maßgebliche Form oder übliche Weise. Die idiomatische deutsche Formulierung gibt den Vergleich wieder, ohne eine technisch klingende Wendung zu erzwingen.
- source_word: βασιλέως Φαραώ
  choice: vor König Pharao
  rationale: Die Wendung wird als Bezug auf das am Hof des Pharaos übliche Niederwerfen verstanden; der Königstitel bleibt entsprechend dem griechischen Text ausdrücklich erhalten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge bleibt eng am griechischen Gedankengang, während idiomatische deutsche Formulierungen die Hofszene klar und natürlich wiedergeben.
