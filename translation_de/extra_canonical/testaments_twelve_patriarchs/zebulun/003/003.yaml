  verdict: revise
  source_fidelity: Der Entwurf gibt διὰ γὰρ τοῦτο, das Verhindern des Hervorquellens von Wasser und den offenen Rückverweis von ἐν αὐτοῖς im Wesentlichen zutreffend wieder. Die mit ἵνα eingeleitete Zweckbestimmung verlangt jedoch im Deutschen eine entsprechende Zweckform; „damit … gesorgt wurde“ macht daraus einen vergangenheitsbezogenen Indikativ. Der vorgelegte griechische Text nennt nur Josef und enthält keine Verwandtschaftsbezeichnung; die englische Ergänzung „his brother“ ist daher nicht zu übernehmen.
  naturalness: „Denn deshalb“ ist im modernen Standarddeutsch idiomatischer als „Denn darum“. „Wasser hervorquoll“ ist klar und bildhaft. „Damit für Josef gesorgt werde“ ist eine natürliche, würdige Wiedergabe der finalen Konstruktion und wahrt deren Offenheit.
  terminology: „Herr“ für Κύριος und „Josef“ für Ἰωσήφ sind angemessen. „Für Josef sorgen“ gibt περιποίησις im Kontext als Versorgung/Vorsorge wieder, ohne die mögliche Nuance von Erhaltung oder Bewahrung auszuschließen. Die Fußnote dokumentiert diese Nuance, ohne eine nicht belegte Lesart als Hauptsinn festzulegen.
  issues:
  - severity: medium
    issue: Der Finalsatz steht als Indikativ der Vergangenheit („damit für Josef gesorgt wurde“).
    rationale: ἵνα γένηται bildet einen Zweck ab. Die deutsche Fassung muss dies als finalen Modus ausdrücken, etwa „damit für Josef gesorgt werde“.
  - severity: low
    issue: Die Fußnote übernimmt ebenfalls eine vergangenheitsbezogene Formulierung („bewahrt wurde“).
    rationale: Auch die alternative Wiedergabe soll die finale Aussageform des griechischen Satzes bewahren.
  revised_text: Denn deshalb verhinderte der Herr, dass in ihnen Wasser hervorquoll, damit für Josef gesorgt werde.[a]
