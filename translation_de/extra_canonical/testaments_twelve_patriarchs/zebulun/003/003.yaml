source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 8. Διὰ γὰρ τοῦτο ἐκώλυσε ὁ⁴⁴ Κύριος *τοῦ μὴ ἀναβλῦσαι ὕδωρ⁴⁵ ἐν αὐτοῖς ἵνα *γένηται περιποίησις τῷ⁴⁶ Ἰωσήφ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/003.yaml
  text: For this reason the Lord prevented water from springing up in them, so that provision might be made for Joseph, his brother.
translation:
  language: de
  text: Denn deshalb verhinderte der Herr, dass in ihnen Wasser hervorquoll, damit für Josef gesorgt werde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit Josef bewahrt werde.“ Das griechische Wort kann sowohl Vorsorge als auch Bewahrung oder Erhaltung bezeichnen.'
    reason: περιποίησις hat eine Bedeutungsspanne, die im Haupttext nicht vollständig sichtbar wird; die Fußnote hält die mögliche Nuance von Bewahrung oder Erhaltung fest und bewahrt zugleich die finale Satzform.
lexical_decisions:
- source_word: ἀναβλῦσαι ὕδωρ
  choice: Wasser hervorquoll
  rationale: ἀναβλύω bezeichnet das Hervorquellen oder Aufsprudeln; die natürliche deutsche Wendung gibt das Bild präzise wieder.
- source_word: περιποίησις
  choice: für … gesorgt wurde
  rationale: Das Substantiv kann je nach Zusammenhang Vorsorge, Erhaltung oder Bewahrung bezeichnen. Die gewählte Formulierung bewahrt hier den Zweckgedanken, ohne ihn auf bloßes Überleben zu verengen.
- source_word: ἐν αὐτοῖς
  choice: in ihnen
  rationale: Das Pronomen bleibt wie im griechischen Satz rückverweisend; sein Bezug ergibt sich aus dem vorhergehenden Kontext und wird nicht erklärend in den Text eingesetzt.
theological_decisions:
- issue: Göttliches Eingreifen als Zweckursache
  choice: Der Herr verhinderte das Hervorquellen des Wassers, damit für Josef gesorgt wurde.
  alternative: Der Herr ließ kein Wasser hervorquellen, sodass Josef bewahrt wurde.
  rationale: Die Übersetzung erhält sowohl das ausdrückliche Handeln des Herrn als auch den mit ἵνα bezeichneten Zweck, ohne eine weitergehende Vorsehungslehre in den Satz hineinzulesen.
- issue: Nicht im vorgelegten griechischen Text belegte Verwandtschaftsangabe
  choice: Josef
  alternative: Josef, seinen Bruder
  rationale: Die vorgelegte griechische Quelle enthält lediglich τῷ Ἰωσήφ. Daher wird die im englischen Beratungstext ergänzte Angabe „his brother“ nicht in den deutschen Haupttext übernommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Denn darum“ bildet γὰρ und διὰ τοῦτο ab; die Satzstruktur bleibt klar und nah an der griechischen Zweckkonstruktion.
