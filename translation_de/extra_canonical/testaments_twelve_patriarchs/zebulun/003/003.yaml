- from: Denn darum verhinderte der Herr, dass in ihnen Wasser hervorquoll, damit für Josef gesorgt wurde.[a]
  to: Denn deshalb verhinderte der Herr, dass in ihnen Wasser hervorquoll, damit für Josef gesorgt werde.[a]
  rationale: Die Revision beschränkt sich auf die notwendige Korrektur der finalen ἵνα-Konstruktion und eine idiomatischere Einleitung. Sie lässt den nicht näher bestimmten Bezug von „in ihnen“ offen und ergänzt entgegen dem englischen Audit-Text keine im vorgelegten griechischen Text nicht vorhandene Verwandtschaftsangabe.
