  source_fidelity: 'Der Haupttext gibt Εἰς γὰρ τὸ τίμημα αὐτοῦ ἐγὼ οὐκ ἐκοινώνησα, τέκνα μου präzise wieder: γάρ als „Denn“, τίμημα im Verkaufskontext treffend als „Erlös“, ἐκοινώνησα als fehlende Teilhabe und die abschließende Anrede τέκνα μου als „meine Kinder“. Die Formulierung beschränkt Sebulons Aussage sachgerecht auf den Erlös bzw. Preis und erweitert sie nicht zu einer umfassenden Nichtbeteiligung am Verkauf.'
