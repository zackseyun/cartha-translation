  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/005.yaml
  text: For I had no share in his price, my children.
translation:
  language: de
  text: Denn an dem Erlös für ihn hatte ich keinen Anteil, meine Kinder.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „Denn an seinem Preis hatte ich keinen Anteil.“ Gemeint ist der Erlös aus dem Verkauf Josefs.'
    reason: Erläutert die wörtliche Bedeutung von τίμημα und den aus dem Zusammenhang erschlossenen Bezug, ohne diesen in den Haupttext zu überladen.
lexical_decisions:
- source_word: τίμημα
  choice: Erlös
  rationale: Bezeichnet hier den für Josef erzielten Verkaufspreis beziehungsweise das daraus erhaltene Geld; „Erlös“ klingt im Deutschen natürlich und passt zum Handelskontext.
- source_word: ἐκοινώνησα
  choice: hatte ich keinen Anteil
  rationale: Gibt die Beteiligung oder Teilhabe am Erlös wieder, ohne genauer festzulegen, ob eine Mitwirkung am Verkauf oder der Empfang eines Anteils im Vordergrund steht.
- source_word: τέκνα μου
  choice: meine Kinder
  rationale: Die direkte Anrede wird schlicht und würdig beibehalten.
theological_decisions:
- issue: Umfang von Sebulons Nichtbeteiligung
  choice: „an dem Erlös … keinen Anteil“
  alternative: „am Verkauf … nicht beteiligt“
  rationale: Der griechische Text nennt ausdrücklich das τίμημα, also den Preis beziehungsweise Erlös. Die Übersetzung beschränkt die Aussage daher auf seine Teilhabe daran und weitet sie nicht stillschweigend auf jede Beteiligung am Verkauf aus.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem erzählerischem Ton. Die Satzstellung folgt dem begründenden γάρ („Denn“) und bewahrt die abschließende direkte Anrede.
