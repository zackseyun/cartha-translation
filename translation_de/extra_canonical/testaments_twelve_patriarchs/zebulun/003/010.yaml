source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 7. Οὐ μόνον δὲ προσεκύνησαν αὐτῷ⁴² ἀλλὰ καὶ ἐνεπτύσθησαν⁴³ παραχρῆμα⁴⁴ πεσόντες ἔμπροσθεν αὐτοῦ, καὶ⁴⁵ ἠσχύνθησαν⁴⁶ παρὰ⁴⁷ τῶν⁴⁸ Αἰγυπτίων⁴⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/010.yaml
  text: And not only did they bow down to him, but they also immediately fell before him and spat, and they were put to shame by the Egyptians.
translation:
  language: de
  text: Und sie warfen sich nicht nur vor ihm nieder, sondern wurden, als sie vor ihm zu Boden fielen, auch sogleich angespuckt[a] und von den Ägyptern beschämt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wurden angespuckt“. Das griechische Verb steht im Passiv.'
    reason: Die englische Konsultationsfassung versteht die Form aktiv; der überlieferte griechische Wortlaut verlangt jedoch eine passive Wiedergabe.
lexical_decisions:
- source_word: προσεκύνησαν αὐτῷ
  choice: sie warfen sich vor ihm nieder
  rationale: Das Verb bezeichnet hier eine körperliche Huldigung beziehungsweise Prostration; die Formulierung gibt die sichtbare Handlung in natürlichem Deutsch wieder.
- source_word: ἐνεπτύσθησαν
  choice: wurden … angespuckt
  rationale: Die griechische Form ist Aorist Passiv und bezeichnet, dass die Betreffenden angespuckt wurden, nicht dass sie selbst spuckten.
- source_word: παραχρῆμα
  choice: sogleich
  rationale: Gibt die unmittelbare zeitliche Abfolge prägnant und in würdigem modernem Deutsch wieder.
- source_word: πεσόντες ἔμπροσθεν αὐτοῦ
  choice: als sie vor ihm zu Boden fielen
  rationale: Die temporale Wiedergabe des Partizips bewahrt den Zusammenhang mit dem Niederfallen und liest sich im Deutschen natürlich.
- source_word: ἠσχύνθησαν παρὰ τῶν Αἰγυπτίων
  choice: wurden von den Ägyptern beschämt
  rationale: Das Passiv mit παρά und Genitiv bezeichnet die Ägypter als Handelnde; „beschämt“ wahrt die Bedeutung, ohne die Art der Demütigung näher festzulegen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederaufnahme des Niederfallens bildet die griechische Satzstruktur verständlich ab; die Abfolge von Huldigung, Bespucken und öffentlicher Beschämung bleibt erhalten.
