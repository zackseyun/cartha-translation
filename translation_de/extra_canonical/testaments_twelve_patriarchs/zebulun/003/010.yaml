  verdict: approve
  source_fidelity: 'Der deutsche Text gibt die griechische Abfolge und die grammatischen Bezüge zuverlässig wieder: προσεκύνησαν αὐτῷ als Niederwerfen vor ihm, ἐνεπτύσθησαν als Aoristpassiv („wurden angespuckt“), παραχρῆμα als „sogleich“, das Partizip πεσόντες als begleitend/temporal verstandenes Niederfallen und ἠσχύνθησαν παρὰ τῶν Αἰγυπτίων als Beschämung durch die Ägypter. Insbesondere ist die passive Deutung von ἐνεπτύσθησαν gegenüber der aktiven englischen Konsultationsfassung grammatisch vorzuziehen.'
  naturalness: Die Formulierung ist modernes, würdiges Standarddeutsch. Die im Deutschen leicht wiederholend wirkende Verbindung von „sich vor ihm niederwerfen“ und anschließendem „vor ihm zu Boden fallen“ ist durch die entsprechende, vermutlich bewusst eindringliche Doppelung des griechischen Textes gedeckt.
  terminology: „Angespuckt“ ist die präzise und natürliche Wiedergabe des passiven Verbs. „Von den Ägyptern beschämt“ wahrt die offene Art der Beschämung und vermeidet unzulässige Konkretisierung. Die Fußnote ist sachlich richtig und ihr Anker steht unmittelbar bei dem erläuterten Wort.
