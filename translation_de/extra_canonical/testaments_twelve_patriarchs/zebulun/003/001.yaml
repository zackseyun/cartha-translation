  text: 6. *Ἰδὼν δὲ Ἰωσὴφ συνκλαίοντά³¹ μοι αὐτῷ³⁰ καὶ τοὺς ἀδελφοὺς ἐπερχομένους³² ἀνελεῖν αὐτὸν³³, κατέφυγον ὄπισθεν³⁴ μου, δεόμενος *τῆς πρὸς αὐτὸν βοηθείας³⁵.
