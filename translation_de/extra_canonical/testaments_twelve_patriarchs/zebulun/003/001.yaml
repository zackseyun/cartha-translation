  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/001.yaml
  text: And when Joseph saw me weeping with him, and the brothers coming on to kill him, he took refuge behind me, begging me for help on his behalf.
translation:
  language: de
  text: Als Josef mich mit ihm weinen sah und die Brüder herankommen, um ihn zu töten, suchte er hinter mir Zuflucht und bat mich um Hilfe für ihn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνκλαίοντά μοι αὐτῷ
  choice: dass ich mit ihm weinte
  rationale: Gibt das gemeinsame Weinen idiomatisch wieder; αὐτῷ bezieht sich im Zusammenhang auf Josef.
- source_word: ἐπερχομένους ἀνελεῖν αὐτόν
  choice: herankamen, um ihn zu töten
  rationale: Bewahrt sowohl die Bewegung auf Josef zu als auch die finale Bedeutung des Infinitivs.
- source_word: κατέφυγον ὄπισθέν μου
  choice: suchte er hinter mir Zuflucht
  rationale: Entspricht dem Bild, dass Josef sich schutzsuchend hinter Zebulun stellte.
- source_word: δεόμενος τῆς πρὸς αὐτὸν βοηθείας
  choice: flehte mich an, ihm zu helfen
  rationale: Natürliches modernes Deutsch für die dringende Bitte um Hilfe zugunsten Josefs.
