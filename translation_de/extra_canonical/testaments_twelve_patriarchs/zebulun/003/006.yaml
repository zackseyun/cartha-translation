  register: Moderne, würdige Standardsprache. Die harte Bildsprache vom Verzehren und Zertreten des Kaufpreises bleibt erhalten; die Schlusswendung ist idiomatisch formuliert und durch eine wörtlichere Fußnote abgesichert.
