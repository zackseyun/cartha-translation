  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/006.yaml
  text: saying, “We will not eat it, because it is the price of our brother’s blood; rather, let us trample it underfoot, because he said that he would reign over us, and then we shall see what his dreams are.”
translation:
  language: de
  text: 'und sagten: „Wir werden ihn nicht verzehren, denn er ist der Preis für das Blut unseres Bruders. Vielmehr lasst uns ihn mit Füßen treten, weil er gesagt hat, er werde über uns herrschen. Dann werden wir sehen, was es mit seinen Träumen auf sich hat.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher: „was seine Träume sind“.'
    reason: Die Fußnote weist auf die knappe, im Deutschen weniger idiomatische griechische Schlussfrage τί ἐστι τὰ ἐνύπνια αὐτοῦ hin, ohne deren Deutung festzulegen.
lexical_decisions:
- source_word: τιμή
  choice: Preis
  rationale: Das Wort bezeichnet hier den für Josef erhaltenen Kaufpreis beziehungsweise Erlös. „Preis“ bewahrt zugleich die enge Verbindung zur Wendung „Preis für das Blut unseres Bruders“.
- source_word: οὐ φαγόμεθα αὐτήν
  choice: wir werden ihn nicht verzehren
  rationale: 'Die auffällige Bildsprache des griechischen Textes wird bewahrt: Der Kaufpreis soll nicht „verzehrt“, also nicht zum eigenen Verbrauch verwendet werden.'
- source_word: καταπατήσωμεν αὐτήν
  choice: wollen wir ihn mit Füßen treten
  rationale: Der hortative Konjunktiv wird als Aufforderung in der ersten Person Plural wiedergegeben; „mit Füßen treten“ entspricht dem anschaulichen Verb.
- source_word: βασιλεῦσαι ἐφ’ ἡμᾶς
  choice: er werde über uns herrschen
  rationale: Die indirekte Rede und der Anspruch auf königliche Herrschaft werden natürlich und sachlich wiedergegeben.
- source_word: τί ἐστι τὰ ἐνύπνια αὐτοῦ
  choice: was es mit seinen Träumen auf sich hat
  rationale: Diese idiomatische Formulierung bewahrt den spöttisch-herausfordernden Sinn der griechischen Frage, ohne ihren Ausgang ausdrücklich festzulegen.
