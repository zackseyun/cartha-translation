  text: 4. Διὰ τοῦτο οὖν¹⁹ ἐν γραφῇ *νόμου Μωσέως γέγραπται²⁰· Τὸν μὴ θέλοντα *ἀναστῆσαι σπέρμα²¹ τῷ ἀδελφῷ αὐτοῦ ὑπολύεσθαι²² τὸ ὑπόδημα αὐτοῦ²³ καὶ ἐμπτύεσθαι εἰς τὸ πρόσωπον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/003/007.yaml
  text: 'Therefore it is written in the book of the law of Moses: “The one who does not want to raise up seed for his brother—his sandal shall be removed, and they shall spit in his face.”'
translation:
  language: de
  text: 'Darum steht im Buch des Gesetzes des Mose geschrieben: »Wer seinem Bruder keine Nachkommen erwecken will, dem soll man die Sandale ausziehen und ihm ins Gesicht spucken.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν γραφῇ νόμου Μωσέως
  choice: im Buch des Gesetzes des Mose
  rationale: γραφή bezeichnet hier im Zusammenhang mit dem mosaischen Gesetz eine schriftliche, autoritative Überlieferung; »Buch« ist im Deutschen natürlich und entspricht der angeführten Gesetzesstelle.
- source_word: ἀναστῆσαι σπέρμα
  choice: Nachkommen erwecken
  rationale: Die Wendung bezeichnet das Hervorbringen bzw. Sichern von Nachkommenschaft für den verstorbenen Bruder. »Nachkommen erwecken« bewahrt das bildhafte Verb und ist zugleich verständlicher als das wörtliche »Samen erwecken«.
- source_word: ὑπολύεσθαι τὸ ὑπόδημα αὐτοῦ
  choice: dem soll man den Schuh ausziehen
  rationale: Die passivische griechische Form wird mit dem unpersönlichen deutschen »man« natürlich wiedergegeben; ὑπόδημα ist hier der Schuh bzw. die Sandale des Verweigerers.
- source_word: ἐμπτύεσθαι εἰς τὸ πρόσωπον
  choice: ins Gesicht spucken
  rationale: Die knappe deutsche Form gibt die entehrende Handlung direkt wieder; das unbestimmte Handlungssubjekt bleibt wie im Griechischen unausgesprochen.
theological_decisions:
- issue: Leviratspflicht und »Nachkommen erwecken«
  choice: Die idiomatische und rechtliche Bedeutung wird als »seinem Bruder ... Nachkommen erwecken« wiedergegeben.
  alternative: »für seinen Bruder Samen erwecken«
  rationale: Die Übersetzung wahrt den Bezug auf die Fortführung der Linie des Bruders, ohne im Deutschen eine missverständliche biologische Formulierung zu verwenden.
translation_notes:
  register: Dignifizieller, klarer Standarddeutsch-Stil mit schriftsprachlichem »steht ... geschrieben«. Die direkte Rede bleibt knapp und gesetzesartig; »Wer« vermeidet eine unnötige Festlegung auf eine zusätzliche Personenbezeichnung, während der Kontext männlich bestimmt ist.
