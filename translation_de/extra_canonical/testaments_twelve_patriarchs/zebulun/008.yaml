base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/008.yaml
  text: 'And so, my children, have compassion toward every person with mercy, so that the Lord also, having had compassion on you, may show you mercy. For indeed in the last days God will send his compassion upon the earth, and wherever he finds merciful compassion, there he dwells. For as much as a man has compassion on his neighbor, so much also the Lord has compassion on him.


    And when we went down into Egypt, Joseph did not hold a grudge against us. Giving heed to him, then, you also, my children, love one another, and let each one not reckon evil against his brother. For this divides unity, and scatters every kinship, and troubles the soul, and disfigures the face.'
translation:
  language: de
  text: '8 Auch ihr nun, meine Kinder, habt mit jedem Menschen Erbarmen und seid barmherzig, damit auch der Herr sich euer erbarmt und euch Barmherzigkeit erweist. 2 Denn in den letzten Tagen wird Gott sein Erbarmen auf die Erde senden; und wo er Erbarmen und Barmherzigkeit findet, dort wohnt er. 3 Denn in dem Maß, wie ein Mensch sich seines Nächsten erbarmt, erbarmt sich auch der Herr seiner.


    4 Als wir nach Ägypten hinabzogen, trug Josef uns nichts nach. 5 Nehmt ihn zum Vorbild, meine Kinder: Liebt auch ihr einander, und keiner sinne auf Böses gegen seinen Bruder. 6 Denn das zerstört die Einheit, zerstreut jede Sippe, beunruhigt die Seele und entstellt das Gesicht.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐσπλαγχνίαν / σπλάγχνα / σπλαγχνίζεται
  choice: Erbarmen / sich erbarmen
  rationale: Die verwandten deutschen Ausdrücke bewahren die im Griechischen mehrfach wiederholte Wortfamilie und geben den Gedanken tief empfundenen Mitgefühls in natürlichem Deutsch wieder.
- source_word: ἐν ἐλέει / ἐλεήσῃ
  choice: barmherzig sein / Barmherzigkeit erweisen
  rationale: Diese Wiedergabe hält ἔλεος sprachlich von der σπλάγχνα-Wortfamilie unterscheidbar, ohne im Deutschen unnatürlich zu wirken.
- source_word: τὰ σπλάγχνα αὐτοῦ
  choice: sein Erbarmen
  rationale: Die wörtliche Körpermetapher „seine Eingeweide“ wäre im heutigen Deutsch missverständlich; „sein Erbarmen“ vermittelt die idiomatische Bedeutung, ohne den bemerkenswerten Gedanken zu glätten, dass Gott sein Erbarmen auf die Erde sendet.
- source_word: ἐμνησικάκησεν
  choice: trug … nichts nach
  rationale: Das Verb bezeichnet das Nachtragen beziehungsweise Festhalten an erlittenem Unrecht; die deutsche Wendung ist präzise und idiomatisch.
- source_word: προσέχοντες εἰς ὃν
  choice: Nehmt ihn zum Vorbild
  rationale: Gemeint ist, Josef aufmerksam zu beachten und sich an seinem Verhalten auszurichten. Die funktionale Wiedergabe stellt den Bezug klar und bleibt natürlich.
- source_word: μὴ λογίζεσθε … κακίαν
  choice: keiner sinne auf Böses
  rationale: λογίζομαι kann hier das Erwägen oder Planen von Bösem bezeichnen. „Auf Böses sinnen“ bewahrt die innere, absichtsbezogene Dimension.
- source_word: πᾶσαν συγγένειαν
  choice: jede verwandtschaftliche Gemeinschaft
  rationale: συγγένεια kann Verwandtschaft, Sippe oder verwandtschaftliche Verbundenheit meinen. Die Formulierung lässt die soziale Beziehung im Blick und vermeidet die sachlich unpassende Vorstellung, Abstammung selbst werde zerstreut.
- source_word: τὸ πρόσωπον ἀφανίζει
  choice: entstellt das Gesicht
  rationale: Die Wiedergabe folgt dem anschaulichen griechischen Ausdruck und vermeidet eine unbelegte psychologisierende Deutung.
theological_decisions:
- issue: Gottes Erbarmen in den letzten Tagen
  choice: „Gott wird sein Erbarmen auf die Erde senden“
  alternative: personalisierende oder messianische Identifikation des gesandten Erbarmens
  rationale: Der griechische Text spricht bildhaft von Gottes σπλάγχνα, identifiziert diese jedoch nicht ausdrücklich mit einer bestimmten Person. Die Übersetzung wahrt diese Offenheit.
- issue: Zusammenhang zwischen menschlichem und göttlichem Erbarmen
  choice: 'proportionale Aussage: „in dem Maß … erbarmt sich auch der Herr“'
  alternative: Abschwächung zu einer bloßen allgemeinen Ähnlichkeit oder Ausgestaltung als dogmatisches Verdienstschema
  rationale: ὅσον … τοσοῦτον formuliert eine deutliche Entsprechung. Diese wird bewahrt, ohne über den Text hinaus das Verhältnis von Gnade und menschlichem Handeln systematisch festzulegen.
- issue: „dort wohnt er“
  choice: Gottes Wohnen dort, wo barmherziges Erbarmen gefunden wird
  alternative: „in diesem Menschen wohnt er“
  rationale: ἐν αὐτῷ kann örtlich („dort“) oder personal („in ihm“) verstanden werden. Der unmittelbare Bezug auf ὅπου stützt „dort“, während die mögliche personale Dimension nicht dogmatisch ausgeschlossen wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlicher Mahnrede. Die Wiederholung von „Erbarmen“ und „erbarmen“ ist bewusst beibehalten, weil sie die markante griechische Wortverkettung trägt. Verszahlen strukturieren den Abschnitt; es sind keine Fußnoten erforderlich.
