    issue: „barmherziges Erbarmen“ in V. 2
    rationale: Die Verbindung ist im heutigen Standarddeutsch unidiomatisch und erschwert das Verständnis. Das Griechische verbindet σπλάγχνα mit ἐλέους; „Erbarmen und Barmherzigkeit“ erhält beide Begriffe ohne künstliche Doppelung.
  - severity: low
    issue: „jede verwandtschaftliche Gemeinschaft“ in V. 6
    rationale: Die Wendung ist verständlich, aber unnötig abstrakt. συγγένεια meint hier natürlich „Sippe“ bzw. Verwandtschaft; „jede Sippe“ ist knapper und näher am Ausgangstext.
