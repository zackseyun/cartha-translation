base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/004.yaml
  text: Therefore do not be divided into two heads, for everything that the Lord made has one head, and two shoulders, two hands, two feet, and all the other members.
translation:
  language: de
  text: Trennt euch daher nicht in zwei Häupter. Denn alles, was der Herr geschaffen hat, besitzt ein einziges Haupt, dazu zwei Schultern, zwei Hände, zwei Füße und alle übrigen Glieder.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χωρισθῆτε ἐν δυσὶ κεφαλαῖς
  choice: trennt euch … nicht in zwei Häupter
  rationale: Gibt die ungewöhnliche und bildhafte griechische Formulierung eng wieder, ohne sie durch eine Deutung wie „in zwei Lager“ zu vereindeutigen.
- source_word: κεφαλὴν μίαν κέκτηται
  choice: besitzt ein einziges Haupt
  rationale: Bewahrt das Körperbild und gibt κέκτηται als gegenwärtigen Besitz beziehungsweise Zustand wieder.
- source_word: μέλη
  choice: Glieder
  rationale: Im Zusammenhang mit Schultern, Händen und Füßen ist der anatomische Sinn gemeint; „Glieder“ ist zugleich würdig und allgemein verständlich.
theological_decisions:
- issue: Bedeutung der zwei Häupter
  choice: Das Bild bleibt wörtlich als „zwei Häupter“ stehen.
  alternative: Deutende Wiedergaben wie „zwei Lager“, „zwei Anführer“ oder „gespaltene Gesinnung“.
  rationale: Der griechische Text erklärt die Metapher anhand des menschlichen Körpers, legt aber ihre konkrete ethische oder gemeinschaftliche Anwendung hier nicht ausdrücklich fest. Die Übersetzung wahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Haupt“ statt „Kopf“ erhält den bildhaften und leicht feierlichen Ton sowie die mögliche übertragene Bedeutung von κεφαλή. Der zweite Satz ist mit „dazu“ natürlich verbunden, ohne ein zusätzliches logisches Verhältnis einzuführen.
