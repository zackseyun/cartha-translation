  source_fidelity: 'Die Übersetzung gibt die wesentlichen Elemente des griechischen Textes genau wieder: die negative Aufforderung mit οὖν („daher“), das bewusst bildhafte „in zwei Häupter“, das eine Haupt sowie die paarweise genannten Körperglieder. „Alles, was der Herr geschaffen hat“ entspricht πᾶν ὃ ἐποίησεν ὁ Κύριος, ohne die im Ausgangstext auffällige Verallgemeinerung interpretierend einzuengen.'
