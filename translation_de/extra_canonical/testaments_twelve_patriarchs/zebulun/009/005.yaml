  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 5. Ἔγνων *γὰρ ἐγὼ²⁰ ἐν γραφῇ τῶν²¹ πατέρων μου, ὅτι²² Διαιρεθήσεσθε ἐν Ἰσραήλ²³, καὶ δύο²⁴ βασιλείαις²⁵ ἐξακολουθήσετε²⁶, καὶ πᾶν βδέλυγμα ποιήσετε.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/005.yaml
  text: For I have learned from the writings of my fathers that you will be divided in Israel, and you will follow after two kingdoms, and you will commit every abomination.
translation:
  language: de
  text: Denn ich habe aus den Schriften meiner Väter erfahren, dass ihr in Israel entzweit werdet, zwei Königreichen folgen und jede abscheuliche Tat begehen werdet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔγνων
  choice: ich habe … erfahren
  rationale: Gibt das Erkennen bzw. Erlangen von Wissen aus einer schriftlichen Quelle natürlich und präzise wieder.
- source_word: ἐν γραφῇ τῶν πατέρων μου
  choice: aus den Schriften meiner Väter
  rationale: Der griechische Singular γραφῇ kann eine Schrift oder kollektiv Schriftgut bezeichnen; der idiomatische deutsche Plural wahrt hier den Bezug auf die überlieferte schriftliche Quelle, ohne eine kanonische Bedeutung von „Schrift“ vorauszusetzen.
- source_word: Διαιρεθήσεσθε
  choice: ihr … entzweit werdet
  rationale: Bewahrt das Passiv und drückt eine Spaltung innerhalb Israels aus; „entzweit“ ist im Deutschen für eine gesellschaftlich-politische Teilung natürlicher als „geteilt“.
- source_word: ἐξακολουθήσετε
  choice: folgen
  rationale: Bezeichnet das Sich-Anschließen bzw. Gefolgeleisten; „folgen“ ist in Verbindung mit den zwei Königreichen knapp und idiomatisch.
- source_word: πᾶν βδέλυγμα ποιήσετε
  choice: jede abscheuliche Tat begehen werdet
  rationale: βδέλυγμα bezeichnet etwas Abscheuliches bzw. einen Gräuel; zusammen mit ποιεῖν ist „abscheuliche Tat begehen“ natürliches modernes Deutsch und vermeidet die unidiomatische Wendung „jeden Gräuel tun“.
theological_decisions:
- issue: Bedeutung von γραφή
  choice: Schriften
  alternative: Schrift
  rationale: Die Formulierung wird nicht ausdrücklich als kanonische „Heilige Schrift“ festgelegt. Der Plural bezeichnet das väterliche Schriftgut natürlich, ohne dessen Status dogmatisch zu bestimmen.
- issue: Art der Spaltung Israels
  choice: entzweit werdet
  alternative: aufgeteilt werdet
  rationale: Der Text nennt eine Teilung und anschließend zwei Königreiche, erklärt aber weder den Handelnden noch die genaue politische oder theologische Ursache; das Passiv lässt diese Offenheit bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt eng am griechischen Gedankengang, während unnatürliche Wendungen vermieden werden. Keine Fußnoten erforderlich.
