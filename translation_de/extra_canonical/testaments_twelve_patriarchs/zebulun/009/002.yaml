  source_fidelity: Die Übersetzung trifft die Satzglieder und die bewusst unbestimmte Wiedergabe von εἰς πολλὰ als „in viele Teile“ gut. „Die Erde“ für ἡ γῆ und „lässt ... verschwinden“ für ἀφανίζει sind quellentreu und bewahren die Bildsprache, ohne eine nicht ausdrücklich vorliegende Deutung einzutragen.
  naturalness: 'Der Satz ist insgesamt modernes, gut verständliches Standarddeutsch. Die Formulierung „sie werden leicht verachtet“ klingt jedoch primär wie ein passivisches Geschehen („jemand verachtet sie leicht“), während εὐκαταφρόνητα eine Eigenschaft bezeichnet: „leicht zu verachten / geringzuschätzen“.'
  terminology: Es sind keine Eigennamen oder besonderen theologischen Fachbegriffe vorhanden. Die Änderung stellt bei εὐκαταφρόνητα die adjektivische Bedeutung genauer dar, ohne die im griechischen Bild möglicherweise mitschwingende Referenz näher festzulegen.
