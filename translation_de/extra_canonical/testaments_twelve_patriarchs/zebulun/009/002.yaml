source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 2. Ἐὰν⁸ δὲ εἰς πολλὰ διαιρεθῶσιν⁹, ἡ γῆ ἀφανίζει¹⁰ αὐτά, *καὶ γίνονται¹¹ εὐκαταφρόνητα¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/002.yaml
  text: But if they are divided into many parts, the earth destroys them, and they become easy to despise.
translation:
  language: de
  text: Wenn sie aber in viele Teile geteilt werden, lässt die Erde sie verschwinden, und man wird sie leicht gering schätzen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς πολλὰ διαιρεθῶσιν
  choice: in viele Teile geteilt werden
  rationale: Gibt die unbestimmte Mehrzahl πολλὰ formal und ohne die kontextuell mögliche, aber nicht ausdrücklich genannte Deutung „Ströme“ wieder.
- source_word: ἡ γῆ
  choice: die Erde
  rationale: Entspricht dem gewöhnlichen Sinn von γῆ und bewahrt die Bildsprache des griechischen Textes.
- source_word: ἀφανίζει
  choice: lässt … verschwinden
  rationale: Gibt das Bewirken des Verschwindens bzw. Beseitigens idiomatisch wieder, ohne den bildhafteren, im Griechischen nicht ausdrücklich stehenden Ausdruck „verschlingt“ einzuführen.
- source_word: εὐκαταφρόνητα
  choice: leicht verachtet
  rationale: Überträgt das verbale Adjektiv natürlich und wahrt den Sinn „leicht zu verachten / geringschätzig zu behandeln“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Syntax. Die mögliche Bildreferenz auf Wasserläufe wird nicht in den Text eingetragen, da πολλὰ lediglich „viele [Teile]“ ausdrückt.
