    issue: εὐκαταφρόνητα ist mit „sie werden leicht verachtet“ nicht präzise genug wiedergegeben.
    rationale: Das griechische prädikative Adjektiv bedeutet „leicht zu verachten, geringzuschätzen“ und nicht in erster Linie, dass sie tatsächlich leicht verachtet werden. „Man wird sie leicht gering schätzen“ gibt die generische Aussage idiomatisch wieder.
