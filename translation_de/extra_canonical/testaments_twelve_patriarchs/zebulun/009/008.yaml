source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 8. Καὶ μετὰ ταῦτα⁴⁵ ἀνατελεῖ⁴⁶ ⌜ὑμῖν⌝ *αὐτὸς ὁ⁴⁷ Κύριος, *φῶς δικαιοσύνης⁴⁸,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/008.yaml
  text: And after these things the Lord himself will rise for you, the light of righteousness.
translation:
  language: de
  text: Und danach wird der Herr selbst für euch aufgehen, das Licht der Gerechtigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: danach
  rationale: Gibt die zeitliche Abfolge knapp und natürlich wieder; wörtlich auch »nach diesen Dingen«.
- source_word: ἀνατελεῖ
  choice: wird … aufgehen
  rationale: Bewahrt das Bild des Aufgehens, das besonders zu »Licht« passt, statt es allgemeiner mit »erscheinen« wiederzugeben.
- source_word: ὑμῖν
  choice: für euch
  rationale: Entspricht dem Dativ und bringt die Zuwendung zu den Angeredeten idiomatisch zum Ausdruck.
- source_word: αὐτὸς ὁ Κύριος
  choice: der Herr selbst
  rationale: Erhält die emphatische Hervorhebung durch αὐτός.
- source_word: φῶς δικαιοσύνης
  choice: das Licht der Gerechtigkeit
  rationale: Formale und zugleich verständliche Wiedergabe; der Genitiv bleibt bewusst offen für die Beziehung zwischen Licht und Gerechtigkeit.
theological_decisions:
- issue: Beziehung zwischen »der Herr selbst« und »Licht der Gerechtigkeit«
  choice: 'Apposition: »der Herr selbst …, das Licht der Gerechtigkeit«'
  alternative: Prädikative oder begleitende Deutung, etwa »als Licht der Gerechtigkeit«
  rationale: Die griechische Wortstellung stellt φῶς δικαιοσύνης unverbunden nach Κύριος; die Apposition bewahrt diese knappe Identifizierung, ohne die syntaktische und theologische Beziehung weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Bildsprache des aufgehenden Lichts und die knappe appositionelle Struktur des Griechischen bleiben erhalten.
