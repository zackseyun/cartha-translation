  text: 7. Καὶ μετὰ ταῦτα μνησθέντες Κύριον †ἐπιστρέψετε³³ καὶ ἐλεήσει³⁴ ὑμᾶς, ὅτι ἐλεήμων ἐστὶ καὶ εὔσπλαγχνος, *καὶ οὐ λογίζεται³⁵ κακίαν τοῖς υἱοῖς τῶν ἀνθρώπων διότι σάρξ εἰσιν καὶ πλανῶνται ἐν ταῖς πονηραῖς αὐτῶν πράξεσιν³⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/007.yaml
  text: And after these things, when you remember the Lord, you will return, and he will have mercy on you, because he is merciful and compassionate, and he does not reckon wickedness against the sons of men, because they are flesh and go astray in their evil deeds.
translation:
  language: de
  text: Und danach, wenn ihr euch an den Herrn erinnert, werdet ihr umkehren,[a] und er wird sich über euch erbarmen. Denn er ist barmherzig und voller Mitgefühl; er rechnet den Menschen ihre Bosheit nicht an, weil sie Fleisch sind und sich in ihren bösen Taten verirren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Textüberlieferung ist bei »werdet ihr umkehren« unsicher; übersetzt ist hier der Wortlaut der zugrunde gelegten Ausgabe.
    reason: Die Edition kennzeichnet ἐπιστρέψετε als textkritisch unsicher. Die Fußnote macht diese Unsicherheit sichtbar, ohne eine nicht belegte Variante zu erfinden.
lexical_decisions:
- source_word: μνησθέντες Κύριον
  choice: wenn ihr euch an den Herrn erinnert
  rationale: Gibt das Aoristpartizip in natürlichem Deutsch als zeitlichen Nebensatz wieder und bewahrt den Gedanken des erneuten Gedenkens.
- source_word: ἐπιστρέψετε
  choice: werdet ihr umkehren
  rationale: Bewahrt die Zukunftsform und den offenen Sinn von ἐπιστρέφω als Umkehr beziehungsweise Rückkehr.
- source_word: ἐλεήσει ὑμᾶς
  choice: er wird sich über euch erbarmen
  rationale: Entspricht dem religiös und zugleich allgemein verständlichen deutschen Ausdruck für ἐλεέω.
- source_word: ἐλεήμων … καὶ εὔσπλαγχνος
  choice: barmherzig und voller Mitgefühl
  rationale: Unterscheidet die beiden verwandten Eigenschaften, ohne sie unnötig zu technisieren.
- source_word: οὐ λογίζεται κακίαν
  choice: er rechnet … ihre Bosheit nicht an
  rationale: Gibt λογίζομαι mit Dativ idiomatisch als »jemandem etwas anrechnen« wieder; das Possessivpronomen verdeutlicht im Deutschen lediglich die syntaktische Beziehung.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: den Menschenkindern
  rationale: Bewahrt die semitisch geprägte Wendung in einer würdigen, verständlichen deutschen Form, ohne das Geschlecht unnötig auf Männer zu beschränken.
- source_word: σάρξ εἰσιν
  choice: sie Fleisch sind
  rationale: Erhält die anthropologische Bildsprache und ihre theologische Spannung, statt sie als bloße Schwäche auszudeuten.
- source_word: πλανῶνται ἐν ταῖς πονηραῖς αὐτῶν πράξεσιν
  choice: sich in ihren bösen Taten verirren
  rationale: Bewahrt sowohl den Gedanken des Irrgehens als auch den Bezug auf das konkrete böse Handeln.
theological_decisions:
- issue: Göttliche Nichtanrechnung menschlicher Bosheit
  choice: 'Direkte Aussage beibehalten: »er rechnet … ihre Bosheit nicht an«'
  alternative: Abschwächend als bloße Nachsicht oder als bedingte Vergebung formulieren
  rationale: Der griechische Text stellt die Aussage ausdrücklich neben Gottes Erbarmen und begründet sie mit der Fleischlichkeit und dem Irrgehen der Menschen; diese Spannung darf nicht konfessionell eingeengt werden.
- issue: Bedeutung von »Fleisch«
  choice: Das Bild wörtlich als »Fleisch« erhalten
  alternative: Deutend mit »schwach«, »sterblich« oder »sündig« wiedergeben
  rationale: σάρξ kann mehrere anthropologische Nuancen tragen. Die wörtliche Wiedergabe bewahrt diese Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede im Plural bleibt erhalten. »Menschenkinder« wahrt den traditionellen Ausdruck, während »voller Mitgefühl« heute natürlicher klingt als seltene Bildungen wie »mitleidsvoll« oder »erbarmungsreich«.
