  source_fidelity: Die Wiedergabe bewahrt die Verbindung und Hervorhebung in Καὶ ὑμεῖς, die bedingte passive Aussage ἐὰν διαιρεθῆτε sowie das futurische ἔσεσθε. „So sein“ gibt οὕτως als rückverweisende Vergleichsaussage unmittelbarer wieder als „ebenso sein“.
  naturalness: Die Umstellung mit eingeschobenem Konditionalsatz ist verständlich, doch „so sein“ ist im modernen Standarddeutsch idiomatischer und näher an der knappen griechischen Formulierung als „ebenso sein“.
  terminology: „Gespalten“ bezeichnet die hier gemeinte innere bzw. gemeinschaftliche Teilung neutraler als „entzweit“, das stärker einen persönlichen Streit nahelegt. Es fügt keinen Verursacher hinzu und erhält den passiven Sinn.
