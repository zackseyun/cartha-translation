  rationale: 'Eine geringfügige stilistische und semantische Präzisierung: Die passive, bedingte Spaltung bleibt erhalten, während die mögliche Einschränkung auf bloße persönliche Entzweiung vermieden wird. Der Rückverweis von οὕτως wird mit „so“ unmittelbar wiedergegeben.'
