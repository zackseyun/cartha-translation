  text: Und auch ihr werdet, wenn ihr gespalten seid, so sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ ὑμεῖς
  choice: Und auch ihr
  rationale: Gibt die verbindende Konjunktion und die hervorgehobene Einbeziehung der Angesprochenen knapp und natürlich wieder.
- source_word: ἐὰν διαιρεθῆτε
  choice: wenn ihr entzweit seid
  rationale: Bewahrt die Bedingung und den passiven Sinn von διαιρεθῆτε; „entzweit“ bezeichnet hier eine Trennung beziehungsweise innere Spaltung, ohne ausdrücklich einen Verursacher festzulegen.
- source_word: ἔσεσθε οὕτως
  choice: werdet … ebenso sein
  rationale: Entspricht dem Futur von εἰμί und lässt den Rückbezug von οὕτως auf das zuvor Beschriebene bestehen, ohne ein Werden oder Ergehen hinzuzufügen.
