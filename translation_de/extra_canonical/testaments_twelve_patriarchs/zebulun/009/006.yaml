base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/006.yaml
  text: And your enemies will take you captive, and you will be afflicted among the nations with many weaknesses and distresses.
translation:
  language: de
  text: Und eure Feinde werden euch gefangen wegführen, und unter den Völkern werdet ihr viele Schwächen und Bedrängnisse erleiden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰχμαλωτεύσουσιν
  choice: gefangen wegführen
  rationale: Gibt das künftige Gefangennehmen bzw. Verschleppen natürlich und konkret wieder.
- source_word: κακωθήσεσθε
  choice: werdet ihr … leiden
  rationale: Das Passiv bezeichnet Misshandlung oder Leid; zusammen mit den folgenden Dativangaben ergibt „durch … leiden“ ein verständliches, quellennahes Deutsch.
- source_word: ἔθνεσιν
  choice: Völkern
  rationale: Entspricht dem allgemeinen Sinn von ἔθνη, ohne die Bedeutung unnötig auf „Heiden“ festzulegen.
- source_word: ἀσθενείαις
  choice: Schwächen
  rationale: Bewahrt die breite Bedeutung von körperlicher Schwäche, Krankheit oder Gebrechlichkeit, ohne sie enger festzulegen.
- source_word: θλίψεσιν
  choice: Bedrängnisse
  rationale: Gibt Druck, Not und Drangsal in einem würdigen, heute verständlichen Ausdruck wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die koordinierte Zukunftsankündigung und die unbestimmte Breite von ἀσθενείαις bleiben erhalten; die textkritischen hochgestellten Ziffern der Edition werden nicht als inhaltliche Fußnoten übernommen.
