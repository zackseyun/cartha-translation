source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 6. Καὶ αἰχμαλωτεύσουσιν²⁸ ὑμᾶς οἱ ἐχθροὶ ὑμῶν, καὶ κακωθήσεσθε²⁹ ἐν³⁰ ἔθνεσιν *ἐν πολλαῖς³¹ ἀσθενείαις *καὶ θλίψεσιν³².
