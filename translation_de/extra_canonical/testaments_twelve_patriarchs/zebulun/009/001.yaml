source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: IX. Προσέχετε Γοὖν˥¹ ἐπὶ² τὰ ὕδατα, *καί, γνῶτε, ὅταν³ *πορεύονται ἐπὶ τὸ αὐτό⁴, λίθους, ξύλα, γῆν⁵ *καὶ ἕτερά τινα⁶ κατασύρουσιν⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/009/001.yaml
  text: Therefore pay attention to the waters, and understand that when they flow together to the same place, they carry down stones, wood, earth, and various other things.
translation:
  language: de
  text: 'Achtet also auf das Wasser und erkennt: Wenn es an denselben Ort zusammenströmt, reißt es Steine, Holz, Erde und mancherlei anderes mit sich.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσέχετε
  choice: Achtet
  rationale: Gibt den auffordernden Sinn von προσέχω natürlich und unmittelbar wieder.
- source_word: τὰ ὕδατα
  choice: das Wasser
  rationale: Der griechische Plural bezeichnet hier Wasser als beobachtbares Strömungsgeschehen; im modernen Deutschen ist der Kollektivsingular idiomatischer.
- source_word: γνῶτε
  choice: erkennt
  rationale: Bewahrt gegenüber bloßem „versteht“ den Erkenntnisappell des griechischen Aoristimperativs.
- source_word: πορεύονται ἐπὶ τὸ αὐτό
  choice: an ein und demselben Ort zusammenströmt
  rationale: Überträgt die Bewegung des Wassers und seine Konvergenz; „an ein und demselben Ort“ wahrt den Bezug von ἐπὶ τὸ αὐτό.
- source_word: κατασύρουσιν
  choice: reißt ... mit sich
  rationale: Gibt die kräftige abwärts beziehungsweise fortziehende Bewegung idiomatisch wieder, ohne eine im Deutschen unnatürliche Richtungsangabe zu erzwingen.
- source_word: ἕτερά τινα
  choice: mancherlei anderes
  rationale: Bewahrt die unbestimmte Vielfalt weiterer mitgerissener Dinge.
theological_decisions: []
translation_notes:
  register: Moderne, würdige und allgemein verständliche Standardsprache. Der Wechsel vom griechischen Plural „Wasser“ zum deutschen Kollektivsingular ermöglicht natürliche Kongruenz, ohne den Sinn zu verändern.
