source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: '4. (α-text omits this verse; β-text reads: ἐποίησε δὲ ἐν τῷ λάκκῳ τρεῖς ἡμέρας καὶ τρεῖς νύκτας καὶ οὕτως ἐπράθη ἄσιτος.)'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/004.yaml
  text: He spent three days and three nights in the pit, and so he was sold while fasting.
translation:
  language: de
  text: '[a] Er verbrachte drei Tage und drei Nächte in der Grube, und so wurde er verkauft, ohne etwas gegessen zu haben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Vers fehlt im α-Text; der β-Text enthält ihn.
    reason: 'Die griechische Überlieferung weist eine bedeutende Textvariante auf: Die gesamte Aussage steht nur im β-Text.'
lexical_decisions:
- source_word: ἐποίησε … ἐν τῷ λάκκῳ
  choice: verbrachte … in der Grube
  rationale: Die Wendung bedeutet idiomatisch, dass er diese Zeit in der Grube zubrachte.
- source_word: καὶ οὕτως ἐπράθη
  choice: und wurde dann … verkauft
  rationale: οὕτως bezeichnet hier den anschließenden Zustand beziehungsweise die Umstände beim Verkauf; „dann“ gibt den natürlichen Erzählfluss wieder.
- source_word: ἄσιτος
  choice: ausgehungert
  rationale: Das Adjektiv bezeichnet jemanden, der ohne Nahrung ist. Nach drei Tagen und Nächten in der Grube vermittelt „ausgehungert“ den resultierenden Zustand natürlicher als das missverständliche „fastend“.
theological_decisions: []
translation_notes:
  register: Moderne, klare und zugleich würdige Erzählsprache. Die ungewöhnliche Überlieferungsaussage wird im Haupttext verständlich wiedergegeben; die vollständige Auslassung im α-Text wird transparent in der Fußnote dokumentiert.
