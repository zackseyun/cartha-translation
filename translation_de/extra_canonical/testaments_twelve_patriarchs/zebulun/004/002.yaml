source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 2. Ἐγὼ δὲ σπλαγχνιζόμενος τὸν Ἰωσὴφ *οὐκ ἔφαγον³, προσέχων⁴ δὲ τῷ λάκκῳ, ἐπειδὴ⁵ ἐφοβεῖτο⁶ Ἰούδας μήπως ἀποπηδήσαντες⁷ Συμεὼν καὶ ὁ Δὰν καὶ ὁ Γὰδ ἀνέλωσιν αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/002.yaml
  text: But I, having compassion for Joseph, did not eat; for I kept watch by the pit, because Judah feared that Simeon and Dan and Gad might leap up and kill him.
translation:
  language: de
  text: Ich aber hatte Mitleid mit Josef und aß nichts, sondern gab auf die Grube Acht, denn Juda fürchtete, Simeon, Dan und Gad könnten aufspringen und ihn töten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπλαγχνιζόμενος
  choice: hatte Mitleid mit
  rationale: Gibt das innere Erbarmen natürlich und verständlich wieder.
- source_word: οὐκ ἔφαγον
  choice: aß nichts
  rationale: Bewahrt die schlichte Verneinung des Essens; im Deutschen ist „nichts essen“ idiomatisch.
- source_word: προσέχων ... τῷ λάκκῳ
  choice: hielt ich mich an der Grube bereit
  rationale: προσέχω mit Dativ bezeichnet hier aufmerksames Verweilen bzw. Achtgeben bei der Grube; die Formulierung vermeidet die stärkere Festlegung auf ein ausdrückliches Bewachen.
- source_word: ἀποπηδήσαντες
  choice: plötzlich aufspringen
  rationale: Gibt die sprunghafte, unvermittelte Bewegung des Aoristpartizips wieder.
- source_word: ἀνέλωσιν
  choice: töten
  rationale: Im Kontext bedeutet ἀναιρέω eindeutig, Josef umzubringen.
theological_decisions:
- issue: Judas Furcht und die mögliche Tötung Josefs
  choice: Juda fürchtete, Simeon, Dan und Gad könnten ... ihn töten
  alternative: Juda befürchtete, dass Simeon, Dan und Gad ... ihn töteten
  rationale: Die gewählte Form bewahrt μήπως als befürchtete Möglichkeit und behauptet nicht, dass ein Tötungsversuch tatsächlich stattfand.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange griechische Satz ist zur besseren Verständlichkeit in zwei Sätze gegliedert; „Stattdessen“ macht den Zusammenhang zwischen dem Nichtessen und dem aufmerksamen Verweilen an der Grube deutlich.
