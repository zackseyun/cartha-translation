review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt den Satzinhalt insgesamt zutreffend wieder: Ruben erfährt während seiner Abwesenheit vom Verkauf Josefs, zerreißt sein Gewand und äußert seine Sorge vor Jakob. »Zurückkam« ist kontextuell naheliegend, doch ἐλθών besagt zunächst nur »kam«. Die Wendung »jemandem unter die Augen treten« verschiebt ὄψωμαι τὸ πρόσωπον (wörtlich: »das Gesicht sehen«) etwas stärker in Richtung eines konfrontativen Auftretens.'
  naturalness: Der Text ist flüssiges, würdiges modernes Standarddeutsch. »Meinem Vater Jakob ins Gesicht sehen« ist ebenso idiomatisch und hält die Bildsprache des griechischen Ausdrucks unmittelbarer fest.
  terminology: Die Namen Ruben, Josef und Jakob entsprechen dem im Deutschen üblichen biblischen Gebrauch. »Gewand« ist für χιτών als allgemeine Bezeichnung angemessen. Die explizite Nennung Josefs klärt das im Griechischen nur kontextuell erschließbare Subjekt, ohne den Sinn zu verändern.
  issues:
  - severity: low
    issue: »zurückkam« konkretisiert ἐλθών stärker als der griechische Wortlaut.
    rationale: Der Kontext der Abwesenheit Rubens erlaubt die Folgerung einer Rückkehr, aber das Verb selbst lautet lediglich »kam«.
  - severity: low
    issue: »meinem Vater Jakob unter die Augen treten« ist freier als die griechische Gesichtsmetapher.
    rationale: ὄψωμαι τὸ πρόσωπον τοῦ πατρός μου bedeutet unmittelbar »das Gesicht meines Vaters sehen«. »Ins Gesicht sehen« ist im modernen Deutschen natürlich und genauer.
  revised_text: 'Als Ruben kam und hörte, dass Josef während seiner Abwesenheit verkauft worden war, zerriss er sein Gewand und klagte: »Wie soll ich meinem Vater Jakob ins Gesicht sehen?«'
