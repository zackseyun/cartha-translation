base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/005.yaml
  text: When Reuben came and heard that he had been sold while he was away, he tore his garments and mourned, saying, “How shall I look upon the face of my father Jacob?”
translation:
  language: de
  text: 'Als Ruben kam und hörte, dass Josef während seiner Abwesenheit verkauft worden war, zerriss er sein Gewand und klagte: »Wie soll ich meinem Vater Jakob ins Gesicht sehen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐλθὼν
  choice: Als Ruben zurückkam
  rationale: Das Partizip bezeichnet hier Rubens Eintreffen nach seiner Abwesenheit; »zurückkam« gibt den erzählerischen Zusammenhang natürlich wieder.
- source_word: ἐπράθη
  choice: dass Josef … verkauft worden war
  rationale: Das Passiv bedeutet »wurde verkauft«. Das im Griechischen unausgesprochene Subjekt wird zur Klarheit als Josef benannt, da Ruben nicht selbst verkauft wurde.
- source_word: ἀπόντος αὐτοῦ
  choice: während seiner Abwesenheit
  rationale: Der Genitivus absolutus bezieht sich am natürlichsten auf Ruben und erklärt, dass der Verkauf stattfand, als er nicht anwesend war.
- source_word: περιεσχίσατο τὸν χιτῶνα αὐτοῦ
  choice: zerriss er sein Gewand
  rationale: Die Wendung beschreibt das Zerreißen des eigenen Kleidungsstücks als Trauerhandlung; »Gewand« ist im Deutschen würdig und allgemein verständlich.
- source_word: θρηνῶν ἔλεγεν
  choice: klagte
  rationale: Das Partizip und das Sprechverb werden idiomatisch zusammengezogen; »klagte« bewahrt sowohl Trauer als auch geäußerte Rede.
- source_word: Πῶς ὄψωμαι τὸ πρόσωπον
  choice: Wie soll ich … unter die Augen treten?
  rationale: Die deutsche Redewendung gibt die Scham und Furcht vor der Begegnung natürlicher wieder als eine wörtliche Formulierung mit »das Gesicht sehen«.
