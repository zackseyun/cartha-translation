  text: 5. Ἐλθὼν δὲ Ῥουβὶμ καὶ ἀκούσας ὅτι ἐπράθη⁹ ἀπόντος *αὐτοῦ περιεσχίσατο¹¹ τὸν χιτῶνα αὐτοῦ θρηνῶν ἔλεγεν¹². Πῶς ὄψωμαι²⁴ τὸ πρόσωπον τοῦ πατρός μου Ἰακώβ;
