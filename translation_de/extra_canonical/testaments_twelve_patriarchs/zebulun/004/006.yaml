  text: 6. Καὶ λαβὼν τὸ ἀργύριον κατέδραμεν ὀπίσω τοῖς ἐμπόροις· μὴ εὑρὼν δὲ αὐτοὺς ὑπέστρεψεν ὀδυρόμενος²⁵. καταλιπόντες²⁶ δὲ οἱ ἔμποροι τὴν πλατεῖαν ὁδὸν διόδευσαν²⁷ διὰ *Τρωγλοδιτῶν ἐν συντόμῳ²⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/006.yaml
  text: And taking the silver, he ran after the merchants, but found no one; for they had left the main road and gone by a shorter route through the Troglodytes.
translation:
  language: de
  text: Und er nahm das Silber und lief den Händlern hinterher. Als er sie nicht fand, kehrte er voller Schmerz zurück. Die Händler aber hatten die Hauptstraße verlassen und waren auf kürzerem Weg durch das Land der Troglodyten gezogen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ ἀργύριον
  choice: das Silber
  rationale: Gibt den konkreten griechischen Ausdruck wieder, ohne ihn allgemeiner als „Geld“ aufzulösen.
- source_word: κατέδραμεν ὀπίσω τοῖς ἐμπόροις
  choice: lief den Händlern hinterher
  rationale: Natürliches modernes Deutsch für die Bewegung in Richtung der bereits fortgezogenen Händler.
- source_word: ὑπέστρεψεν ὀδυρόμενος
  choice: kehrte er tief betrübt zurück
  rationale: Bewahrt sowohl die im griechischen Text ausdrücklich genannte Rückkehr als auch seinen schmerzlichen Gemütszustand, die in der englischen Konsultationsfassung fehlen.
- source_word: τὴν πλατεῖαν ὁδόν
  choice: die Hauptstraße
  rationale: Im Zusammenhang bezeichnet die breite Straße die gewöhnliche Hauptroute; „Hauptstraße“ ist idiomatisch und entspricht der englischen Konsultationsfassung.
- source_word: διὰ Τρωγλοδιτῶν
  choice: durch das Gebiet der Troglodyten
  rationale: Das bloße „durch die Troglodyten“ wäre im Deutschen missverständlich; die Formulierung macht den naheliegenden räumlichen Sinn deutlich, ohne eine genauere geografische Bestimmung zu behaupten.
- source_word: ἐν συντόμῳ
  choice: auf einem kürzeren Weg
  rationale: Gibt den adverbialen Sinn einer Abkürzung beziehungsweise kürzeren Route verständlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählfolge. Gegenüber der englischen Konsultationsfassung werden die im griechischen Ausgangstext vorhandene Rückkehr und die Trauer der handelnden Person wiedergegeben. Keine Fußnoten, da zwar editorische Ziffern im vorgelegten Text stehen, aber kein Variantenapparat mit belastbaren Angaben mitgeliefert wurde.
