  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/003.yaml
  text: And when they saw that I also was not eating, they set me to guard him until he was sold.
translation:
  language: de
  text: Als sie aber sahen, dass ich nicht aß, setzten sie mich dazu ein, ihn zu bewachen, bis er an die Ismaeliter verkauft wurde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρῶντές με δὲ μὴ ἐσθίοντα
  choice: Als sie aber sahen, dass ich nicht aß
  rationale: Die partizipiale Konstruktion wird in natürliches modernes Deutsch übertragen; δέ ist mit „aber“ wiedergegeben.
- source_word: ἔθετό με τηρεῖν αὐτόν
  choice: ließen sie mich ihn bewachen
  rationale: τίθημι mit Infinitiv bezeichnet hier die Zuweisung einer Aufgabe; „ließen … bewachen“ gibt dies idiomatisch und ohne unnötige Ausdeutung wieder.
- source_word: ἕως οὗ ἀπεδόθη τοῖς Ἰσμαηλίταις
  choice: bis er an die Ismaeliter verkauft wurde
  rationale: ἀποδίδωμι bezeichnet im gegebenen Zusammenhang die entgeltliche Übergabe; der ausdrücklich genannte Empfänger τοῖς Ἰσμαηλίταις bleibt erhalten.
