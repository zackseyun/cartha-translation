  text: “Do not weep or be distressed; for we have found what we shall say to our father.
translation:
  language: de
  text: Weine nicht und sei nicht betrübt; denn wir haben herausgefunden, was wir unserem Vater sagen sollen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ κλαῖε
  choice: Weine nicht
  rationale: Gibt den negierten Präsensimperativ direkt und natürlich wieder.
- source_word: μηδὲ λυποῦ
  choice: und sei nicht betrübt
  rationale: Bewahrt neben dem sichtbaren Weinen auch die innere Betrübnis; das verbindende „und“ entspricht hier natürlichem Deutsch.
- source_word: εὕρομεν
  choice: wir haben herausgefunden
  rationale: Drückt das Ergebnis des Aorists aus und lässt erkennen, dass eine passende Antwort beziehungsweise Erklärung gefunden wurde.
- source_word: τί εἴπωμεν
  choice: was wir … sagen sollen
  rationale: Gibt den deliberativen Konjunktiv idiomatisch wieder, ohne ihn als bloße Zukunft festzulegen.
- source_word: τῷ πατρὶ ἡμῶν
  choice: unserem Vater
  rationale: Direkte und natürliche Wiedergabe des Dativs mit eindeutigem Possessivbezug.
