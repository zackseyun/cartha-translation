source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: 8. *Ἤκουσαν γὰρ ὅσα ἐνεδείξαντο αὐτῷ κακά⁵⁰. IV. Μετὰ δὲ τὸ †πραθῆναι¹ αὐτὸν ἐκάθησαν οἱ ἀδελφοί μου² ἐσθίειν καὶ πίνειν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/001.yaml
  text: For they had heard how much evil had been done against him. And after he had been thrown into the pit, my brothers sat down to eat and drink.
translation:
  language: de
  text: Denn sie hatten gehört, was sie ihm alles Böses angetan hatten. Nachdem er aber verkauft worden war[a], setzten sich meine Brüder hin, um zu essen und zu trinken.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem vorliegenden griechischen Text: „verkauft worden war“. Der Erzählzusammenhang legt jedoch auch die Lesart „in die Grube geworfen worden war“ nahe.'
    reason: Dokumentiert die erkennbare textkritische beziehungsweise kontextuelle Spannung, ohne den griechischen Haupttext zu überschreiben.
lexical_decisions:
- source_word: ἐνεδείξαντο αὐτῷ κακά
  choice: was sie ihm alles Böses angetan hatten
  rationale: Gibt die gegen ihn gerichteten bösen Handlungen natürlich wieder und bewahrt das ausdrückliche pluralische Subjekt des griechischen Verbs.
- source_word: πραθῆναι
  choice: verkauft worden war
  rationale: Übersetzt den überlieferten griechischen Infinitiv wörtlich; die abweichende, kontextuell naheliegende Deutung wird in einer Fußnote genannt.
- source_word: ἐκάθησαν … ἐσθίειν καὶ πίνειν
  choice: setzten sich … hin, um zu essen und zu trinken
  rationale: Bildet sowohl das Sich-Niedersetzen als auch den Zweck beziehungsweise die anschließende Tätigkeit in natürlichem Deutsch ab.
theological_decisions:
- issue: Textkritische Spannung zwischen dem überlieferten Wortlaut und dem Erzählzusammenhang
  choice: Im Haupttext steht „verkauft worden war“.
  alternative: „in die Grube geworfen worden war“
  rationale: Der vorgelegte griechische Text hat πραθῆναι („verkauft werden“), obwohl der Zusammenhang und die englische Konsultationsfassung auf das Werfen in die Grube weisen. Die Spannung wird nicht stillschweigend aufgelöst.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Erzählstil. Das einleitende „Denn“ und das anschließende „aber“ spiegeln die griechischen Verknüpfungspartikeln.
