  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/004/007.yaml
  text: Reuben was grieved, and he did not eat bread on that day. Then Dan came near and said to him,
translation:
  language: de
  text: 'Ruben aber war bekümmert und aß an jenem Tag kein Brot. Da trat Dan zu ihm und sagte:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λυπούμενος
  choice: bekümmert
  rationale: Gibt den anhaltenden Zustand von Trauer oder innerem Schmerz natürlich wieder, ohne die Ursache näher festzulegen.
- source_word: ἄρτον
  choice: Brot
  rationale: Bewahrt das ausdrücklich genannte Nahrungsmittel und verallgemeinert es nicht zu „etwas“.
- source_word: προσελθών
  choice: trat … zu ihm
  rationale: Entspricht dem räumlichen Herantreten und klingt im Deutschen natürlicher als eine wörtliche Partizipialkonstruktion.
- source_word: εἶπεν αὐτῷ
  choice: sagte
  rationale: Das mit „zu ihm“ bereits bezeichnete Gegenüber bleibt eindeutig; der Doppelpunkt zeigt an, dass die Rede im Folgetext weitergeführt wird.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzverknüpfung mit „aber“ und „da“ bildet δέ und οὖν idiomatisch ab; die offene direkte Rede am Versende wird durch einen Doppelpunkt kenntlich gemacht.
