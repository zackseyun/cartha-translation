  text: 7. ⌈Ἦν δὲ ὁ Ῥουβὶμ λυπούμενος⌉⁴⁴, καὶ οὐκ ἔφαγεν⁴⁵ ⌈ἄρτον⌉ *ἐν ἐκείνῃ τῇ ἡμέρᾳ⁴⁶. *προσελθὼν οὖν ὁ Δὰν εἶπεν αὐτῷ⁴⁷.
