  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/007.yaml
  text: 1[a]. Therefore, my children, have compassion in mercy toward every person, so that the Lord also may have compassion in mercy toward you. 2. Because in the last days you also will send forth your compassion upon the earth, and wherever the Most High finds a heart of compassion, there he dwells. 3. For in the measure that a man has compassion on his neighbors, so also the Lord has compassion on him. 4. And when we came down into Egypt, Joseph my brother tested us, and he learned that I was compassionate. 5. For when I sat by him, I did not grieve him with envy, and I did not speak bitterly against him. 6. And after these things, my children, I urge you not to hold malice in your hearts against one another[b], and to love one another in deed and in word. 7. For in the presence of my father I spoke peaceably to Joseph; and when I had gone out, Dan told us that the prince of the eunuchs was seeking to destroy him, because he had become attached to him as a pure and good young man. 8.
    But I wept over Joseph, and I prayed for him, that the Lord would deliver him from every evil intention. 9. And afterward the Ishmaelites came and took him away, and they persuaded him to go with them, and they sold him to Potiphar in Egypt. 10. But because of the compassion that I had shown to my brother, the Lord did not let me fall into the same testing. 11. And when all my brothers were sick, and our father was grieving because of them, I had compassion on every poor man and every sick man, and I gave to all in simplicity of heart. 12. And if I had nothing to give to the needy, I walked with him for seven stadia, weeping with him in mercy. 13. Therefore, my children, have compassion in mercy toward every person with a good heart, so that God also may give you compassion and mercy. 14. For if a man does not have compassion on his neighbor, he provokes the Lord. 15. And if he hardens his heart, and does not have compassion on his neighbor, and does not help the poor, the Lord will
    judge him. 16. For throughout all my life I did not walk in crookedness, but in all simplicity. 17. I did not set my mind on silver or gold, or on any glory of men. 18. I did not wear a double face. 19. I did not devise evil against my neighbor. 20. I did not corrupt my speech with many-colored words. 21. I walked with all men in simplicity of heart. 22. Therefore, my children, do you also have these things, and every spirit of Beliar will flee from you, and no deed of wicked men will rule over you; and every wild beast you will master, since you have with you the God of heaven and earth and walk with men in simplicity of heart. 23. And after he had said these things, he commanded them to carry his body to Hebron and to bury it with his fathers. 24. And when he had fallen asleep at a good old age, his sons laid him in a coffin. 25[c][d]. And afterward they carried him up to Hebron and buried him with his fathers.
translation:
  language: de
  text: '**Testament Sebulons 7**


    1. Ich spannte ein Segeltuch an einem anderen, aufrecht stehenden Holz in der Mitte aus.[a] 2. Darin fuhr ich an den Küsten entlang und fing Fische für das Haus meines Vaters, bis wir nach Ägypten kamen.


    3. Aus Erbarmen gab ich von meinem Fang jedem Fremden etwas ab.[b] 4. War jemand fremd, krank oder alt, so kochte ich die Fische, bereitete sie gut zu, wie jeder es nötig hatte, und reichte allen davon; ich litt mit ihnen und nahm Anteil an ihrem Leid. 5. Darum beschenkte mich auch der Herr beim Fischfang mit vielen Fischen. Denn wer mit seinem Nächsten teilt, empfängt vom Herrn ein Vielfaches.


    6. So fischte ich fünf Jahre lang; ich gab jedem Menschen, den ich sah, davon ab und versorgte das ganze Haus meines Vaters.[b] 7. Die eine Hälfte bereitete ich im Winter zusammen mit meinen Brüdern vor.[c]


    8. Wenn ihr aber nichts habt, was ihr einem Bedürftigen geben könnt, dann nehmt aus tiefem Erbarmen Anteil an seinem Leid. 9. Ich weiß: Als meine Hand nichts fand, was sie einem Bedürftigen hätte geben können, ging ich sieben Stadien[d] mit ihm und weinte; und mein Innerstes wandte sich ihm voller Mitgefühl zu.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Wortlaut ist ungewöhnlich und textkritisch unsicher. Gemeint ist wahrscheinlich, dass ein Tuch als Segel an einem aufrechten Holz, also wohl einem Mast, ausgespannt wurde.
    reason: textual_uncertainty
  - marker: b
    text: Die Verse 3–5 sowie der zweite Teil von Vers 6 stehen in der angegebenen Ausgabe in eckigen Klammern und sind daher textkritisch unsicher.
    reason: textual_variant
  - marker: c
    text: Das Bezugsobjekt von „der einen Hälfte“ und das, was genau im Winter vorbereitet wurde, bleiben im griechischen Satz unausgesprochen.
    reason: textual_uncertainty
  - marker: d
    text: Sieben Stadien entsprechen ungefähr 1,3 Kilometern.
    reason: cultural_note
lexical_decisions:
- source_word: ὀθόνη
  choice: Segeltuch
  rationale: Im Zusammenhang mit dem aufrechten Holz und der anschließenden Fahrt bezeichnet das Wort am ehesten ein als Segel verwendetes Tuch.
- source_word: ξύλον ὀρθόν
  choice: aufrecht stehendes Holz
  rationale: Die konkrete Bildsprache des Griechischen bleibt erhalten; eine eindeutige Normalisierung zu „Mast“ würde die ungewöhnliche und möglicherweise textkritisch schwierige Formulierung glätten.
- source_word: σπλαγχνίζομαι / σπλάγχνα
  choice: Erbarmen haben / Innerstes
  rationale: Je nach Satzbau wird die ethische Bedeutung natürlich wiedergegeben oder das körperlich-affektive Bild des griechischen Ausdrucks bewahrt.
- source_word: μεταδίδωμι
  choice: abgeben / teilen
  rationale: Das Verb bezeichnet das konkrete Teilgeben aus dem eigenen Besitz oder Fang und nicht bloß eine innere Haltung.
- source_word: συναλγέω / συμπάσχω / συμπάθεια
  choice: mitleiden / Anteil am Leid nehmen / Mitgefühl
  rationale: Die verwandten Ausdrücke werden differenziert, ohne ihren gemeinsamen Gedanken tätiger Anteilnahme zu verlieren.
- source_word: πλησίον
  choice: Nächster
  rationale: „Nächster“ ist im biblisch-ethischen Zusammenhang die geläufige und inhaltlich präzise Wiedergabe.
- source_word: στάδιον
  choice: Stadion; im Plural Stadien
  rationale: Das antike Wegmaß bleibt im Text sichtbar; eine ungefähre moderne Entsprechung wird in der Fußnote genannt.
theological_decisions:
- issue: Göttliche Vergeltung für das Teilen mit dem Nächsten
  choice: Die Aussage wird ausdrücklich als vielfache Gabe „vom Herrn“ wiedergegeben.
  alternative: Die Aussage zu einem allgemeinen Grundsatz wie „Freigebigkeit zahlt sich aus“ abschwächen.
  rationale: Der griechische Text stellt einen direkten theologischen Zusammenhang zwischen menschlichem Teilen und dem Empfang vom Herrn her; diese Spannung darf nicht in bloße Lebensweisheit aufgelöst werden.
- issue: Erbarmen ohne materielle Hilfsmöglichkeit
  choice: Das Mitgehen, Weinen und innere Mitgefühl bleiben als wirkliche Form der Anteilnahme stehen.
  alternative: Den Vers so paraphrasieren, als sei ausschließlich materielle Hilfe von Wert.
  rationale: Der Text setzt tätiges Mitgefühl neben das Geben, ohne beide gleichzusetzen oder eines davon abzuwerten.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit leicht testamentarisch-weisheitlichem Klang. Die wiederholte Sprache des Erbarmens und Mitgefühls bleibt erkennbar. Ungewöhnliche oder beschädigte Stellen werden nicht stillschweigend nach der englischen Konsultationsfassung ergänzt; die erhebliche Abweichung zwischen dem gelieferten griechischen Abschnitt und dem englischen POB-Text wird zugunsten der originalsprachlichen Evidenz entschieden.
