    issue: V. 3 verbindet „jedem Fremden“ mit dem Singular „mit ihm“.
    rationale: σπλαγχνιζόμενος bezeichnet die Beweggrundlage des Gebens. Die Formulierung „Aus Erbarmen gab ich von meinem Fang jedem Fremden etwas ab“ gibt dies ohne einen im Deutschen stolpernden Pronomenbezug wieder.
  - severity: low
    issue: V. 5 „ließ mich ... viele Fische fangen“ paraphrasiert ἐνέπλησέ με.
    rationale: Das Verb besagt, dass der Herr den Sprecher beim Fischfang mit vielen Fischen füllte bzw. beschenkte. Die revidierte Formulierung bleibt näher am Bild und ist idiomatisch.
  - severity: medium
    issue: Fußnote c bezeichnet V. 7 zu stark als offenbar verderbt.
    rationale: Der Satz lässt das Bezugsobjekt zu „der einen Hälfte“ unausgesprochen; das ist eine echte Auslegungsunsicherheit, beweist aber keine Textverderbnis. Die Anmerkung soll die Ellipse benennen, ohne eine weitergehende textkritische Diagnose zu behaupten.
