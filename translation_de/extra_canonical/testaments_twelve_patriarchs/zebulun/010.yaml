base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/010.yaml
  text: 'And you will return to your land, and you will see him in Jerusalem because of his holy name; and healing and compassion will be in his wings. He himself will redeem every captivity of the sons of men from Beliar, and every spirit of deceit will be trampled down. And he will turn all the nations to zeal for him, and you will see God in the form of a man, whom the Lord will choose—Jerusalem is his name.


    9. And again, by the craftiness of your deeds you will provoke him to anger, and you will be cast away from him until the time of completion.


    10. And now, my children, do not be grieved because I am dying, nor fall down in sorrow because I am coming to my end. For I will rise again in your midst, as a ruler in the midst of the sons of righteousness; and I will rejoice in the midst of my tribe, all who keep the law of the Lord. But upon the ungodly the Lord will bring eternal fire, and he will destroy them for generations of generations. But as for me, I now hasten to my rest, as also my fathers did. But you, fear the Lord all the days of your life with all your strength.


    And when he had said these things, he fell asleep, and his sons placed him in a wooden coffin. Later they carried him up and buried him in Hebron with his fathers.'
translation:
  language: de
  text: 'Und ihr werdet in euer Land zurückkehren und ihn in Jerusalem um seines heiligen Namens willen sehen. Heilung und Erbarmen werden in seinen Flügeln sein. Er selbst wird jede Gefangenschaft der Menschen aus der Gewalt Beliars erlösen, und jeder Geist der Täuschung wird zertreten werden. Er wird alle Völker dazu bringen, um ihn zu eifern, und ihr werdet Gott in menschlicher Gestalt sehen, den der Herr erwählen wird – Jerusalem ist sein Name.[a]


    9 Und wieder werdet ihr ihn durch die Arglist eurer Taten zum Zorn reizen, und ihr werdet von ihm verstoßen werden bis zur Zeit der Vollendung.


    10

    1 Und nun, meine Kinder, seid nicht traurig darüber, dass ich sterbe, und brecht nicht zusammen, weil ich an mein Ende komme. 2 Denn ich werde wieder in eurer Mitte auferstehen, als Leiter unter den Söhnen der Gerechtigkeit, und ich werde mich inmitten meines Stammes freuen – unter denen, die das Gesetz des Herrn bewahren.[b] 3 Über die Gottlosen aber wird der Herr ewiges Feuer bringen, und er wird sie vernichten bis in alle Generationen. 4 Ich aber eile nun zu meiner Ruhe, wie auch meine Väter. 5 Ihr aber: Fürchtet den Herrn.[c]


    6 Nachdem er dies gesagt hatte, entschlief er, und seine Söhne legten ihn in einen hölzernen Sarg.[d] 7 Später brachten sie ihn hinauf und begruben ihn in Hebron bei seinen Vätern.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Abschnitt von „Heilung und Erbarmen“ bis „Jerusalem ist sein Name“ ist in einem Teil der griechischen Überlieferung als Erweiterung bezeugt. Der letzte Satz ist syntaktisch schwierig; der überlieferte Wortlaut lässt auch andere Gliederungen zu.
    reason: Kennzeichnet die bedeutende textkritische Erweiterung und bewahrt die Unsicherheit der ungewöhnlichen Aussage über Jerusalem.
  - marker: b
    text: 'Einige Handschriften fügen hinzu: „und die Gebote ihres Vaters Zebulun“.'
    reason: Dokumentiert einen in der Edition gekennzeichneten Zusatz, der nicht in den Haupttext aufgenommen wurde.
  - marker: c
    text: 'Einige Handschriften erweitern: „den Herrn, unseren Gott, mit all eurer Kraft, alle Tage eures Lebens“.'
    reason: Zeigt die längere Überlieferungsform von Vers 5, während der kürzere Haupttext bewahrt wird.
  - marker: d
    text: Einige Handschriften lesen zusätzlich, dass er „in einem guten Schlaf“ entschlief.
    reason: Dokumentiert den in der Edition als unsicher gekennzeichneten Zusatz zu Zebuluns Tod.
lexical_decisions:
- source_word: εὐσπλαγχνία
  choice: Erbarmen
  rationale: Gibt das innige Mitgefühl des griechischen Ausdrucks in natürlichem, würdigem Deutsch wieder.
- source_word: πᾶσαν αἰχμαλωσίαν υἱῶν ἀνθρώπων
  choice: alle Gefangenen unter den Menschen
  rationale: Das kollektive αἰχμαλωσία kann die Gefangenschaft oder die Gesamtheit der Gefangenen bezeichnen; im Zusammenhang mit λυτρώσεται ist die personale Wiedergabe im Deutschen verständlicher, ohne die universale Aussage abzuschwächen.
- source_word: παραζήλωσιν αὐτοῦ
  choice: um ihn zu eifern
  rationale: Bewahrt das Motiv des Eifers beziehungsweise der Eifersucht, statt es allgemein als Hinwendung zu glätten.
- source_word: συμπέσητε
  choice: brecht nicht vor Kummer zusammen
  rationale: Das Verb bezeichnet ein Zusammenbrechen; der aus dem Zusammenhang erschlossene Kummer wird ausdrücklich gemacht, ohne daraus bloß allgemeine Trauer zu machen.
- source_word: ἡγούμενος
  choice: Herrscher
  rationale: Der Ausdruck bezeichnet hier eine leitende oder regierende Person; „Herrscher“ bewahrt die stärkere Bedeutung des Ausgangstextes.
- source_word: ἀνάπαυσις
  choice: Ruhe
  rationale: Bewahrt die traditionelle Todes- und Ruhemetaphorik, ohne sie als endgültige Vernichtung oder als bestimmte Jenseitslehre auszulegen.
- source_word: ἐκοιμήθη
  choice: entschlief
  rationale: Erhält den griechischen Euphemismus des Einschlafens für den Tod in würdigem, verständlichem Deutsch.
- source_word: θήκη ξυλίνη
  choice: hölzerner Sarg
  rationale: „Sarg“ ist im Bestattungskontext die natürliche konkrete Wiedergabe von θήκη; ξυλίνη wird ausdrücklich als „hölzern“ erhalten.
theological_decisions:
- issue: Gott in menschlicher Gestalt
  choice: „ihr werdet Gott in menschlicher Gestalt sehen“
  alternative: „ihr werdet einen Gott in Menschengestalt sehen“ oder eine christologische Präzisierung
  rationale: Der anarthrische griechische Ausdruck θεὸν ἐν σχήματι ἀνθρώπου wird entsprechend dem Kontext wiedergegeben, ohne seine Identität konfessionell näher zu bestimmen.
- issue: Ewiges Feuer und Vernichtung über Generationen
  choice: Beide Zeitangaben bleiben nebeneinander stehen
  alternative: Beide Aussagen zu einer einzigen Lehre über Dauer oder Endgültigkeit harmonisieren
  rationale: Der Text verbindet πῦρ αἰώνιον mit einer Vernichtung ἕως γενεὰς γενεῶν. Diese Spannung wird nicht stillschweigend aufgelöst.
- issue: Auferstehung Zebuluns
  choice: „ich werde wieder in eurer Mitte auferstehen“
  alternative: metaphorische Wiedergabe als Fortleben im Andenken oder in Nachkommen
  rationale: ἀναστήσομαι wird in seinem unmittelbaren Sinn wiedergegeben; die Art oder der Zeitpunkt der Auferstehung wird nicht erklärt.
- issue: „Jerusalem ist sein Name“
  choice: Die schwierige Aussage bleibt im Haupttext wörtlich erkennbar und wird textkritisch erläutert
  alternative: Jerusalem als Ort, Subjekt oder Beiname umdeuten
  rationale: Die griechische Syntax ist unsicher; eine glättende Festlegung würde echte textliche und theologische Mehrdeutigkeit beseitigen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem testamentarischem Erzählton. Wiederholungen und semitisch geprägte Wendungen wie „Söhne der Gerechtigkeit“, „von Generation zu Generation“ und „bei seinen Vätern“ bleiben erhalten, wo sie inhaltlich tragen. Unnatürliche griechische Kollektiva werden behutsam idiomatisch wiedergegeben. Die Verszählung macht den Übergang vom Ende des vorigen Kapitels zu Kapitel 10 sichtbar.
