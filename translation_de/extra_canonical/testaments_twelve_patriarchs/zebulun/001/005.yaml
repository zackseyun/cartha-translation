base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/005.yaml
  text: I do not remember that I committed any lawlessness, except for the unwitting wrong I did concerning Joseph, in that I gave my brothers my pledge not to tell my father what had happened.
translation:
  language: de
  text: 'Ich kann mich nicht erinnern, je etwas Gesetzloses getan zu haben – außer dem Unrecht, das ich unwissentlich in der Sache Josefs beging: Ich hatte meinen Brüdern mein Wort gegeben, meinem Vater nicht zu erzählen, was geschehen war.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: lawlessness (verse-level Greek not aligned)
  choice: etwas Gesetzloses getan
  rationale: Bewahrt den rechtlich-theologischen Gehalt von „lawlessness“, klingt aber im modernen Deutschen natürlicher als das abstrakte „Gesetzlosigkeit begangen“.
- source_word: unwitting wrong (verse-level Greek not aligned)
  choice: Unrecht, das ich unwissentlich … beging
  rationale: Gibt sowohl die objektive Verfehlung als auch das fehlende volle Wissen wieder, ohne die Schuldfrage stärker festzulegen als die verfügbare Textgrundlage.
- source_word: gave my brothers my pledge
  choice: hatte meinen Brüdern mein Wort gegeben
  rationale: Eine natürliche und würdevolle Wiedergabe einer bindenden Zusage; „Schwur“ wäre ohne den ausgerichteten griechischen Vers zu spezifisch.
- source_word: concerning Joseph
  choice: in der Sache Josefs
  rationale: Bewahrt die offene Art des Bezugs, ohne Einzelheiten über Josefs Behandlung in den Vers hineinzutragen.
theological_decisions:
- issue: Verhältnis von Unwissenheit und Schuld
  choice: „Unrecht, das ich unwissentlich … beging“
  alternative: „Sünde aus Unwissenheit“
  rationale: Die Formulierung lässt die Spannung bestehen, dass die Tat als Unrecht bezeichnet wird, obwohl sie unwissentlich geschah; sie entschuldigt die Tat weder vollständig noch verschärft sie deren religiöse Einordnung.
- issue: Bindende Zusage gegenüber den Brüdern
  choice: „mein Wort gegeben“
  alternative: „mich eidlich verpflichtet“
  rationale: Da der griechische Wortlaut dieses Verses nicht ausgerichtet vorliegt, wird keine ausdrücklich eidliche Form der Verpflichtung behauptet.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Der vorgelegte griechische Ausschnitt ist nur auf Kapitelebene vorhanden und reicht nicht bis zum Wortlaut von Vers 1,5; deshalb stützt sich die Formulierung für diesen Vers auf die auditierte englische Konsultationsschicht und vermeidet unbelegte griechische Rückübersetzungen.
