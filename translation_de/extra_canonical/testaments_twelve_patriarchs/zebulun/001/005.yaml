  source_fidelity: 'Der griechische bereitgestellte Text ist nur bis 1,2 ausgerichtet und erlaubt daher keine unmittelbare Prüfung des Wortlauts von 1,5. Gegen die maßgebliche englische Audit-Fassung gibt die Übersetzung alle Sinnelemente wieder: fehlende Erinnerung an Gesetzlosigkeit, die Ausnahme des unwissentlich begangenen Unrechts im Zusammenhang mit Josef sowie das den Brüdern gegebene Versprechen, den Vater nicht zu informieren. Die Zeitform „hatte ... gegeben“ ist im erzählerischen Rückblick zulässig und verändert die Aussage nicht.'
  naturalness: Modernes, idiomatisches Standarddeutsch mit angemessen würdigem Ton. Der Gedankenstrich und der anschließende Doppelpunkt gliedern die komplexe Ausnahme verständlich.
  terminology: „etwas Gesetzloses getan“ bewahrt den rechtlich-theologischen Akzent von „lawlessness“, ohne unnatürlich abstrakt zu werden. „Unrecht“, „unwissentlich“ und „mein Wort gegeben“ sind sachgerecht; insbesondere behauptet „mein Wort gegeben“ keinen im Englischen nicht ausdrücklich belegten Eid.
