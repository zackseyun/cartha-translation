  source_fidelity: 'Der Entwurf gibt Überschrift, Sprecher, Altersangabe und Zeitbezug des griechischen Textes zutreffend wieder: Ζαβουλών ist Sebulon, und die Zahl bezeichnet das 114. Lebensjahr. Die abweichende englische Audit-Revision zu Dan und 120 Jahren steht im Widerspruch zum vorgelegten griechischen Ausgangstext und ist für diese Stelle nicht zu übernehmen. διέθετο hat hier testamentarisch-verfügende Nuance; die gewählte Verbindung „als Vermächtnis auftrug“ bildet diese Nuance jedoch nicht idiomatisch ab.'
  naturalness: '„Als Vermächtnis auftrug“ ist im modernen Deutschen semantisch und kollokational unerquicklich: Man trägt Weisungen auf, hinterlässt aber ein Vermächtnis. Die übrige Satzführung ist klar und dem würdigen Register angemessen.'
