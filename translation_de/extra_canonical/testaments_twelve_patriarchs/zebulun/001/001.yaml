source:
  edition: Charles 1908 Greek Versions (pages 187-201, Zebulun source-fix v2)
  text: Διαθήκη Ζαβουλὼν τοῦ ἕκτου υἱοῦ Ἰακὼβ καὶ Λείας¹. I. *Ἀντίγραφον λόγων² Ζαβουλών, ὧν³ διέθετο τοῖς υἱοῖς⁴ αὐτοῦ, ⁵πρὶν ἢ ἀποθανεῖν αὐτὸν⁵ *ἐν τῷ⁶ ἑκατοστῷ *τετάρτῳ καὶ δεκάτῳ⁷ ἔτει τῆς ζωῆς αὐτοῦ⁸, μετὰ *οὖν δύο ἔτη⁹ *τοῦ θανάτου¹⁰ Ἰωσήφ. 2. Εἶπεν¹¹ αὐτοῖς· Ἀκούσατέ μου¹²,
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/001.yaml
  text: A copy of the words of Zebulun, which he charged his sons before he died, in the one hundred and fourteenth year of his life, two years after the death of Joseph.
translation:
  language: de
  text: Eine Abschrift der Worte Sebulons, die er seinen Söhnen vor seinem Tod als Vermächtnis hinterließ, im 114. Jahr seines Lebens, zwei Jahre nach Josefs Tod.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον λόγων
  choice: Eine Abschrift der Worte
  rationale: Gibt den dokumentarischen Charakter von ἀντίγραφον und das schlichte λόγων eng am Griechischen wieder.
- source_word: Ζαβουλών
  choice: Sebulons
  rationale: Entspricht dem in deutschen Bibeln üblichen Namen Sebulon; der Genitiv ist durch die Konstruktion gefordert.
- source_word: διέθετο
  choice: als Vermächtnis auftrug
  rationale: Bewahrt den testamentarischen Sinn des Verbs im Kontext, ohne es auf bloßes Sprechen zu reduzieren.
- source_word: πρὶν ἢ ἀποθανεῖν αὐτόν
  choice: bevor er starb
  rationale: Natürliche und genaue deutsche Wiedergabe der temporalen Konstruktion.
- source_word: ἐν τῷ ἑκατοστῷ τετάρτῳ καὶ δεκάτῳ ἔτει
  choice: im 114. Jahr
  rationale: Die griechische Zahl bezeichnet eindeutig das hundertvierzehnte Jahr.
- source_word: μετὰ οὖν δύο ἔτη τοῦ θανάτου Ἰωσήφ
  choice: zwei Jahre nach Josefs Tod
  rationale: Idiomat13isch und inhaltlich eng am griechischen Zeitbezug; οὖν wird hier nicht eigens wiedergegeben, da es im deutschen Einzelsatz keinen natürlichen argumentativen Anschluss hat.
theological_decisions:
- issue: Identität des Sprechers
  choice: Sebulon
  alternative: Dan
  rationale: Überschrift und Vers nennen im griechischen Ausgangstext ausdrücklich Ζαβουλών. Die jüngste englische Revision zu Dan gehört offenbar zu einer anderen Überlieferungseinheit und widerspricht dem vorliegenden Quelltext.
- issue: Lebensalter
  choice: 114. Jahr
  alternative: 120. Jahr
  rationale: Der vorgelegte griechische Text liest ἑκατοστῷ τετάρτῳ καὶ δεκάτῳ, also 114.; die Alternative 120 ist hier nicht quellengestützt.
- issue: Kraft von διέθετο
  choice: als Vermächtnis auftrug
  alternative: sprach
  rationale: Die gewählte Formulierung erhält den Zusammenhang mit einer testamentarischen Verfügung, ohne eine spezifische konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung folgt dem griechischen Quelltext trotz der widersprüchlichen jüngsten englischen Revision. Keine Fußnote ist nötig, da die maßgeblichen Lesarten im bereitgestellten griechischen Text klar sind.
