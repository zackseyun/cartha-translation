base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/006.yaml
  text: But I wept in secret for many days because of Joseph; for I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be put to death.
translation:
  language: de
  text: Doch ich weinte viele Tage lang heimlich um Josef; denn ich fürchtete mich vor meinen Brüdern, weil sie alle vereinbart hatten, dass jeder, der das Geheimnis verriet, getötet werden sollte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: wept in secret
  choice: weinte … heimlich
  rationale: Da der bereitgestellte griechische Text auf Versebene nicht bis 1,6 ausgerichtet ist, folgt die Formulierung der geprüften englischen Konsultationsschicht und gibt sowohl das Weinen als auch dessen Verborgenheit klar und natürlich wieder.
- source_word: disclosed the secret
  choice: das Geheimnis verriet
  rationale: „Verriet“ bezeichnet idiomatisch die unerlaubte Offenlegung eines gemeinsam gehüteten Geheimnisses, ohne zusätzliche Motive einzutragen.
- source_word: should be put to death
  choice: getötet werden sollte
  rationale: Die passive Todesandrohung wird nüchtern und ohne Festlegung auf eine bestimmte Hinrichtungsart wiedergegeben.
