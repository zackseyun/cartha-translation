  register: Modernes, würdiges Standarddeutsch. Die kausale Struktur und die Spannung zwischen Josefs Schicksal, der brüderlichen Absprache und Sebulons Furcht bleiben erhalten. Da das gelieferte griechische Fragment nur den Kapitelanfang enthält und nicht mit Vers 1,6 ausgerichtet ist, stützt sich dieser Vers notwendigerweise auf die auditierte englische Konsultationsfassung.
