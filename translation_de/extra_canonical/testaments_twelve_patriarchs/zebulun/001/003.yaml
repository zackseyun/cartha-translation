base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/003.yaml
  text: I, Zebulun, became a good gift to my parents; for when I was born, my father increased very greatly, and so did the flocks and the herds, when by the speckled rods he gained his portion.
translation:
  language: de
  text: Meinen Eltern wurde ich, Sebulon, zu einer guten Gabe. Denn als ich geboren wurde, nahm mein Vater sehr stark zu, ebenso seine Herden an Kleinvieh und Rindern, als er durch die gesprenkelten Stäbe seinen Anteil gewann.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Vgl. 1. Mose 30,37–43: Jakob verwendete entrindete Stäbe im Zusammenhang mit der Vermehrung der gefleckten und gesprenkelten Tiere, die seinen Anteil an Labans Herden bildeten.'
    reason: Der Hinweis auf die Stäbe setzt die Erzählung aus Genesis voraus und ist ohne diesen Hintergrund schwer verständlich.
lexical_decisions:
- source_word: δῶρον ἀγαθόν (gemäß der überlieferten Versfassung; im bereitgestellten griechischen Kapitelfragment nicht enthalten)
  choice: eine gute Gabe
  rationale: Bewahrt die Gabe-Metaphorik und den möglichen Anklang an die Namensdeutung Sebulons, ohne ihn erklärend aufzulösen.
- source_word: πρόβατα
  choice: Schafe und Ziegen
  rationale: Das griechische Wort kann Kleinvieh insgesamt bezeichnen; die natürliche deutsche Sammelbezeichnung macht diesen Umfang verständlich.
- source_word: βόες / βουσίν
  choice: Rinder
  rationale: Sachlich passende moderne Wiedergabe für Großvieh.
- source_word: ῥάβδοις ... ῥανταῖς (gemäß der überlieferten Versfassung)
  choice: gesprenkelten Stäbe
  rationale: Erhält das konkrete, mit Genesis 30 verbundene Bild; „gesprenkelt“ gibt die fleckige Zeichnung wieder.
- source_word: κλῆρος
  choice: Anteil
  rationale: Bezeichnet hier Jakobs ihm zufallenden beziehungsweise vereinbarten Anteil an den Herden, nicht zwingend ein durch Los bestimmtes Erbteil.
theological_decisions:
- issue: Zusammenhang zwischen Sebulons Geburt und Jakobs wachsendem Besitz
  choice: Die zeitliche und erzählerische Verknüpfung bleibt bestehen, ohne eine ausdrückliche unmittelbare Verursachung zu behaupten.
  alternative: „Durch meine Geburt vermehrte sich der Besitz meines Vaters“
  rationale: 'Die Formulierung wahrt die Spannung des Textes: Sebulon ist eine „gute Gabe“, während der Zuwachs konkret mit Jakobs Herdenanteil und den Stäben verbunden wird.'
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. „Schafe und Ziegen“ verdeutlicht Kleinvieh, „Rinder“ Großvieh. Quellenhinweis: Das bereitgestellte griechische Fragment reicht nur bis zum Beginn von 1,2 und enthält 1,3 nicht; der Entwurf stützt sich daher für den Wortlaut dieses Verses auf die angegebene englische Konsultationsschicht und die bekannte griechische Versüberlieferung. Die Fußnotenmarke [a] steht im Haupttext.'
