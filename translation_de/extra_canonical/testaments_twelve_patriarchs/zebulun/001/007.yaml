base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/007.yaml
  text: Yet when they wanted to kill him, with tears I begged them not to commit this sin.
translation:
  language: de
  text: Doch als sie ihn töten wollten, bat ich sie unter Tränen, diese Sünde nicht zu begehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der bereitgestellte griechische Abschnitt enthält nur den Anfang des Testaments und ist diesem Vers noch nicht versgenau zugeordnet. Die Übersetzung dieses Satzes folgt daher vorsichtig der geprüften englischen Konsultationsfassung.
    reason: Die Quellenlage muss offengelegt werden, weil für diesen Vers kein ausgerichteter griechischer Wortlaut vorliegt.
lexical_decisions:
- source_word: wanted to kill him
  choice: als sie ihn töten wollten
  rationale: Der versgenaue griechische Wortlaut ist in dem bereitgestellten Fragment nicht enthalten; die Formulierung gibt die geprüfte englische Konsultationsfassung knapp und natürlich wieder.
- source_word: with tears I begged them
  choice: bat ich sie unter Tränen
  rationale: „Unter Tränen“ bewahrt sowohl die sichtbare Trauer als auch die Eindringlichkeit der Bitte, ohne den Ausdruck unnötig auszuschmücken.
- source_word: not to commit this sin
  choice: diese Sünde nicht zu begehen
  rationale: „Eine Sünde begehen“ ist im modernen Standarddeutsch idiomatisch und erhält die ausdrückliche moralisch-theologische Wertung der Tat.
theological_decisions:
- issue: Bezeichnung des geplanten Tötens als Sünde
  choice: diese Sünde
  alternative: dieses Unrecht
  rationale: Die Konsultationsfassung spricht ausdrücklich von „sin“. „Sünde“ bewahrt den religiös-moralischen Gehalt, ohne ihn abzuschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt schlicht und emotional direkt; „doch“ wahrt den Gegensatz zum vorausgehenden Zusammenhang. Wegen der fehlenden versgenauen griechischen Vorlage wurde keine über die englische Konsultationsfassung hinausgehende Präzisierung vorgenommen.
