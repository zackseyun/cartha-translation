  text: I do not know that I sinned in my days, except in thought.
translation:
  language: de
  text: Ich weiß nicht, dass ich in meinem Leben gesündigt hätte – außer in Gedanken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der mitgelieferte griechische Abschnitt enthält den Wortlaut von 1,4 nicht; diese Fassung folgt daher vorläufig dem geprüften englischen Beratungstext.
