lexical_decisions:
- source_word: in my days (griechischer Verswortlaut nicht mitgeliefert)
  choice: in meinem Leben
  rationale: Die idiomatische Zeitangabe bezeichnet die Lebenszeit des Sprechers; „in meinen Tagen“ wäre im heutigen Deutsch unnötig fremdartig.
- source_word: in thought (griechischer Verswortlaut nicht mitgeliefert)
  choice: in Gedanken
  rationale: Die knappe Formulierung bewahrt die offene Aussage des konsultierten englischen Textes, ohne sie auf eine bestimmte Art innerer Sünde festzulegen.
theological_decisions:
- issue: Reichweite der behaupteten Sündlosigkeit
  choice: „Ich weiß nicht, dass ich … gesündigt hätte“
  alternative: „Ich habe nicht gesündigt“
  rationale: Die erkenntnisbezogene Einschränkung „Ich weiß nicht“ bleibt erhalten; der Sprecher behauptet damit nicht uneingeschränkt objektive Sündlosigkeit.
- issue: Verhältnis von äußerer Tat und innerem Denken
  choice: „außer in Gedanken“
  alternative: „außer durch einen Gedanken“
  rationale: Die Formulierung lässt offen, ob ein einzelner Gedanke oder gedankliche Sünde allgemein gemeint ist, und vermeidet eine zusätzliche dogmatische Präzisierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich hebt die einzige genannte Ausnahme hervor, ohne die theologische Spannung zwischen äußerem Verhalten und innerem Denken aufzulösen.
