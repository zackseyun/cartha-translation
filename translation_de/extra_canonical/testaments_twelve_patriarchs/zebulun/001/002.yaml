  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001/002.yaml
  text: 'And he said to them: Listen to me, sons of Zebulun; pay attention to the words of your father.'
translation:
  language: de
  text: 'Und er sagte zu ihnen: »Hört mir zu, ihr Söhne Sebulons; achtet auf die Worte eures Vaters.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἶπεν αὐτοῖς
  choice: Und er sagte zu ihnen
  rationale: Gibt die griechische Erzählformel direkt und in natürlichem modernem Deutsch wieder.
- source_word: Ἀκούσατέ μου
  choice: Hört auf mich
  rationale: Das Verb mit Genitiv bezeichnet hier nicht nur akustisches Hören, sondern die auffordernde Hinwendung zum Sprecher.
- source_word: sons of Zebulun
  choice: ihr Söhne Sebulons
  rationale: Der im englischen Konsultationstext bezeugte Vokativ wird idiomatisch wiedergegeben; der Genitiv kennzeichnet ihre Abstammung.
- source_word: pay attention to the words of your father
  choice: achtet auf die Worte eures Vaters
  rationale: Bewahrt den parallelen Aufforderungscharakter des konsultierten Textes in würdigem, verständlichem Deutsch.
theological_decisions: []
