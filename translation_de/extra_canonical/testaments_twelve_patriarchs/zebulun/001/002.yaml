  register: Direkte, feierliche Vaterrede in modernem Standarddeutsch. Der sicher zugeordnete griechische Wortlaut reicht in dem bereitgestellten Fragment nur bis »Hört auf mich«; die anschließenden Anreden und Aufforderungen folgen der auditierten englischen Konsultationsschicht, da der griechische Text auf Versebene noch nicht vollständig ausgerichtet ist.
