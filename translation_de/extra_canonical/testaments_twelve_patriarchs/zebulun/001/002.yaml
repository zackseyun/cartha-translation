  source_fidelity: Der sicher ausgerichtete griechische Wortlaut Εἶπεν αὐτοῖς· Ἀκούσατέ μου wird mit der Einleitung und der Aufforderung zutreffend wiedergegeben. Die folgende Anrede und zweite Aufforderung sind im vorliegenden griechischen Fragment nicht versegenau ausgerichtet, stimmen jedoch mit der englischen POB-Auditspur überein und können daher beibehalten werden.
