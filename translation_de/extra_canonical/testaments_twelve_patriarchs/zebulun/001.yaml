  source_fidelity: 'Die Überschrift, die Alters- und Zeitangabe sowie der unvollständige Redebeginn entsprechen dem vorgelegten griechischen Text. Die Begrenzung auf den tatsächlich gelieferten griechischen Text ist sachgerecht. Für διέθετο ist „seine Söhne beauftragte“ jedoch im Deutschen weniger präzise: Es kann ein konkretes Beauftragen meinen, während hier eine testamentarische Unterweisung bzw. Verfügung gemeint ist.'
  naturalness: Modernes, würdiges Deutsch. „gab er seinen Söhnen Anweisungen“ ist idiomatischer und trifft die testamentarische Redehandlung klarer als „beauftragte er seine Söhne“. Der offen endende Imperativ in Vers 2 ist wegen des offen endenden Quellentextes beizubehalten.
  terminology: „Testament“, „Sebulon“, „Lea“, „Josef“ und „Abschrift der Worte“ sind angemessen. Die Fußnoten sind korrekt verankert und erläutern die genannten textkritischen Unsicherheiten ohne Überdeutung.
