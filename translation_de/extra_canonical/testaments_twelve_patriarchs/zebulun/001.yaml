base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/001.yaml
  text: '1 A copy of the words of Zebulun, which he charged his sons before he died, in the one hundred and fourteenth year of his life, two years after the death of Joseph.


    2 And he said to them: Listen to me, sons of Zebulun; pay attention to the words of your father.


    3 I, Zebulun, became a good gift to my parents; for when I was born, my father increased very greatly, and so did the flocks and the herds, when by the speckled rods he gained his portion.


    4 I do not know that I sinned in my days, except in thought.


    5 I do not remember that I committed any lawlessness, except for the unwitting wrong I did concerning Joseph, in that I gave my brothers my pledge not to tell my father what had happened.


    6 But I wept in secret for many days because of Joseph; for I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be put to death.


    7 Yet when they wanted to kill him, with tears I begged them not to commit this sin.'
translation:
  language: de
  text: '**Das Testament Sebulons, des sechsten Sohnes Jakobs und Leas[a]**


    **1** Abschrift der Worte Sebulons, mit denen er seinen Söhnen vor seinem Tod Anweisungen gab, im hundertvierzehnten Jahr seines Lebens[b], zwei Jahre nach Josefs Tod.


    **2** Er sagte zu ihnen: »Hört auf mich,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Bei der Namensangabe in der Überschrift weichen einige Textzeugen voneinander ab; der vorliegende Text nennt Sebulon und bezeichnet ihn als sechsten Sohn Jakobs und Leas.
    reason: textual_variant
  - marker: b
    text: Die Altersangabe ist in der Überlieferung nicht einheitlich; die Übersetzung folgt hier dem vorgelegten griechischen Text mit 114 Jahren.
    reason: textual_variant
lexical_decisions:
- source_word: Διαθήκη
  choice: Testament
  rationale: Bezeichnet hier die feierliche letztwillige Rede des Patriarchen und entspricht der etablierten Gattungsbezeichnung.
- source_word: Ἀντίγραφον λόγων
  choice: Abschrift der Worte
  rationale: Gibt den dokumentarischen Charakter von ἀντίγραφον und den konkreten Sinn von λόγων eng und zugleich natürlich wieder.
- source_word: διέθετο
  choice: mit denen er … beauftragte
  rationale: Das Verb bezeichnet hier eine feierliche Anordnung an die Söhne; die Wiedergabe wahrt diesen testamentarischen Ton, ohne ein modernes Rechtsinstrument zu unterstellen.
- source_word: πρὶν ἢ ἀποθανεῖν αὐτόν
  choice: vor seinem Tod
  rationale: Idiomatiche deutsche Wiedergabe der temporalen Infinitivkonstruktion.
- source_word: Ἀκούσατέ μου
  choice: Hört auf mich
  rationale: Bewahrt den imperativischen Appell und lässt das offene Satzende der gelieferten griechischen Vorlage sichtbar bestehen.
theological_decisions:
- issue: Gattungsbezeichnung διαθήκη
  choice: Testament
  alternative: Bund; letztwillige Verfügung
  rationale: Im Titel bezeichnet διαθήκη die testamentarische Abschiedsrede. „Bund“ würde hier eine spezifische heilsgeschichtliche Deutung eintragen, während „letztwillige Verfügung“ zu juristisch klingt.
- issue: Umfang der Übersetzung
  choice: Nur den tatsächlich vorgelegten griechischen Text bis Ἀκούσατέ μου übersetzt
  alternative: Die weiteren Verse aus der englischen Konsultationsfassung ergänzen
  rationale: Die Übersetzung folgt vorrangig der originalsprachlichen Quellenevidenz. Der abrupte Schluss bleibt erhalten, statt nicht mitgelieferten griechischen Text einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Überschrift wird als Werktitel gestaltet; Vers 1 behält den dokumentarisch-testamentarischen Ton. Der unvollständige Beginn der Rede in Vers 2 wird entsprechend dem Ende der gelieferten griechischen Vorlage nicht ergänzt.
