review_pass:
  verdict: revise
  source_fidelity: 'Eine sichere Korrektur ist in V. 8 nötig: Die Fassung „auch als ich euch in die Hände fiel“ gibt dem schwierigen καὶ πεσὼν εἰς ὑμᾶς eine zusätzliche, im Kontext nicht abgesicherte Aussage. Die naheliegende und auch vom englischen Audit gestützte Wiedergabe lautet „denn ich habe nicht gegen euch gesündigt“. In V. 2 ist „hatte seinen Anteil“ näher an εἶχον τὸν κλῆρον als „erhielt seinen Anteil“. In V. 11 sollte das nicht im Ausgangstext enthaltene „mehr“ entfallen.'
  naturalness: Der Text ist insgesamt gut verständliches modernes Standarddeutsch mit angemessen würdigem Register. „Habt Mitleid mit dem Innersten Jakobs“ ist in V. 8 natürlicher als „Erbarmt euch des Innersten Jakobs“, ohne das körperliche Bild zu glätten.
  terminology: Die Namensformen Sebulon, Simeon, Dan, Gad, Josef und Jakob sind im Deutschen etabliert. „Gabe“, „gesetzlos gehandelt“, „Sünde“ und die Körperbilder bewahren den Charakter des griechischen Textes. Die schwierige Wendung in V. 3 bleibt ausdrücklich als solche markiert.
  issues:
  - severity: high
    issue: 'V. 8: „auch als ich euch in die Hände fiel“'
    rationale: Diese Formulierung deutet das schwierige καὶ πεσὼν εἰς ὑμᾶς als zusätzliches Ereignis und fügt damit eine Aussage ein, die die unmittelbare Bitte Josefs nicht sicher trägt. Im Kontext und gemäß englischem Audit ist „gegen euch gesündigt“ die sichere Wiedergabe.
  - severity: low
    issue: 'V. 2: „seinen Anteil erhielt“'
    rationale: κλῆρον ἔχειν bedeutet hier wörtlicher „seinen Anteil haben“; „erhielt“ legt einen Vorgang des Empfangens nahe.
  - severity: low
    issue: 'V. 11: „nicht mehr stehen“'
    rationale: Das Adverb „mehr“ steht nicht im griechischen Text. „Ich konnte nicht stehen“ ist ebenso natürlich und genauer.
