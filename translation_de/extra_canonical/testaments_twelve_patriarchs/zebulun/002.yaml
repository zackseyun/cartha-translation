base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/zebulun/002.yaml
  text: '1 Sons of Zebulun[a], pay attention to the words of your father.

    2 I, Zebulun, became a good gift to my parents; for when I was born, my father prospered greatly, and the sheep and the cattle also, when with the variegated rods he had his share.

    3 And I do not know that I sinned in my days, except in intention.

    4 I do not remember that I committed lawlessness, except for the ignorance that I showed concerning Joseph, in that I gave my brothers my word not to tell my father what had happened.

    5 But I wept in secret for many days because of Joseph. For I was afraid of my brothers, because they had all agreed that whoever disclosed the secret should be put to death.

    6 Yet when they wanted to kill him, I pleaded with them with tears not to commit this sin[b].

    7 For Simeon and Dan and Gad came against Joseph to kill him, and he said to them with tears,

    8 “Have mercy on me, my brothers; pity the inward compassion of Jacob our father. Do not lay your hands on me to shed innocent blood, for I have not sinned against you.

    9 But even if I have sinned, discipline me with correction, my brothers; yet do not bring your hand to the murder of your brother, for the sake of Jacob your father.”

    10 And as he spoke these words in grief, while I could not bear his cries, I began to weep, and my liver was poured out, and all the substance of my inward parts grew faint.

    11 And I wept together with Joseph, and my heart thundered, and the joints of my body trembled[c][d], and I had no strength.'
translation:
  language: de
  text: '**Testament Sebulons 2**


    1 Ihr Söhne Sebulons, achtet auf die Worte eures Vaters.


    2 Ich, Sebulon, bin meinen Eltern zu einer guten Gabe geworden. Denn als ich geboren wurde, nahm der Wohlstand meines Vaters stark zu, ebenso seine Schafe und Rinder, als er mithilfe der verschiedenfarbigen Stäbe[a] seinen Anteil hatte.


    3 Ich weiß nicht, dass ich in meinen Lebenstagen gesündigt hätte, außer in Gedanken[b].


    4 Ich erinnere mich nicht, gesetzlos gehandelt zu haben, abgesehen von der Verfehlung aus Unwissenheit in der Sache Josefs: Ich verpflichtete mich gegenüber meinen Brüdern, meinem Vater nicht zu sagen, was geschehen war.


    5 Doch wegen Josef weinte ich viele Tage lang im Verborgenen. Denn ich fürchtete mich vor meinen Brüdern, weil sie alle miteinander vereinbart hatten, dass jeder, der das Geheimnis verriet, getötet werden sollte.


    6 Als sie ihn jedoch töten wollten, flehte ich sie unter Tränen an, diese Sünde nicht zu begehen.


    7 Denn Simeon, Dan und Gad gingen auf Josef los, um ihn zu töten. Da sagte er unter Tränen zu ihnen:


    8 »Habt Erbarmen mit mir, meine Brüder! Habt Mitleid mit dem Innersten Jakobs, unseres Vaters[c]. Legt nicht Hand an mich, um unschuldiges Blut zu vergießen; denn ich habe nicht gegen euch gesündigt.


    9 Doch selbst wenn ich gesündigt habe, dann weist mich durch Züchtigung zurecht, meine Brüder. Erhebt aber eure Hand nicht, um euren Bruder zu ermorden – um Jakobs willen, eures Vaters.«


    10 Während er diese Worte unter Klagen sprach, konnte ich seine Schmerzensrufe nicht ertragen. Ich begann zu weinen; meine Leber ergoss sich[d], und mein ganzes Inneres erschlaffte.


    11 Ich weinte zusammen mit Josef. Mein Herz dröhnte, die Gelenke meines Körpers zitterten, und ich konnte nicht stehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die verschiedenfarbigen Stäbe spielen auf Jakobs Herdenzucht in Genesis 30 an.
    reason: cross_reference
  - marker: b
    text: Die griechische Wendung ist schwierig. Sie kann auf eine Sünde im inneren Denken oder in der Absicht im Unterschied zu einer ausgeführten Tat hinweisen.
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlich: »Habt Mitleid mit den Eingeweiden Jakobs, unseres Vaters.« Körperorgane galten in der antiken Ausdrucksweise als Sitz tiefen Mitgefühls.'
    reason: cultural_note
  - marker: d
    text: 'Wörtlich: »Meine Leber ergoss sich.« Die Leber steht hier in einem eindringlichen antiken Körperbild für überwältigende Trauer.'
    reason: cultural_note
lexical_decisions:
- source_word: προσέχετε
  choice: achtet auf
  rationale: Der Imperativ fordert eindringliche Aufmerksamkeit und klingt im testamentarischen Rahmen würdig, ohne altertümlich zu sein.
- source_word: δόσις ἀγαθή
  choice: eine gute Gabe
  rationale: Bewahrt das konkrete Bild der Gabe und Sebulons Selbstbeschreibung im Verhältnis zu seinen Eltern.
- source_word: ηὐξήνθη
  choice: nahm der Wohlstand … stark zu
  rationale: Der Zusammenhang mit Schafen und Rindern bezeichnet die wirtschaftliche Mehrung von Jakobs Haus; die Formulierung gibt dies im Deutschen natürlich wieder.
- source_word: ποικίλαις ῥάβδοις
  choice: verschiedenfarbigen Stäbe
  rationale: Gibt die sichtbare Verschiedenartigkeit der Stäbe wieder und erhält die Anspielung auf die Herdenzucht in Genesis 30.
- source_word: παρεκτὸς ἐννοίας
  choice: außer in Gedanken
  rationale: Die schwierige Wendung wird bewusst knapp wiedergegeben, sodass die Spannung zwischen innerem Denken und äußerer Tat bestehen bleibt.
- source_word: παρανομίαν
  choice: gesetzlos gehandelt
  rationale: Bewahrt den moralisch-rechtlichen Gehalt des griechischen Ausdrucks, ohne ein unnatürliches deutsches Substantiv zu erzwingen.
- source_word: ἄγνοιαν
  choice: Verfehlung aus Unwissenheit
  rationale: Macht verständlich, dass Sebulon sein Verhalten als nicht voll erkannte Schuld bezeichnet, ohne ihn einfach für schuldlos zu erklären.
- source_word: ἐβεβαίωσα
  choice: Ich verpflichtete mich gegenüber meinen Brüdern
  rationale: Bezeichnet im Kontext eine feste Zustimmung zur gemeinsamen Schweigeabrede und nicht bloß eine sachliche Bestätigung.
- source_word: μυστήριον
  choice: Geheimnis
  rationale: Gemeint ist die geheim gehaltene Sache um Josef, nicht ein späterer theologischer Fachbegriff.
- source_word: σπλάγχνα
  choice: das Innerste
  rationale: Erhält das körperlich geprägte antike Bild für tiefes Mitgefühl, bleibt aber im Haupttext verständlich.
- source_word: ἐβόμβει
  choice: dröhnte
  rationale: Gibt die intensive, lautmalerische Körperempfindung stärker wieder als ein neutrales 'klopfte'.
theological_decisions:
- issue: Sebulons Unschuldsbehauptung trotz seines Eingeständnisses in der Sache Josefs
  choice: Die Aussage, er habe nur 'in Gedanken' gesündigt, steht unmittelbar neben seinem Bekenntnis einer aus Unwissenheit begangenen Verfehlung.
  alternative: Die Stelle zu einer widerspruchsfreien Behauptung weitgehender Schuldlosigkeit glätten.
  rationale: Der griechische Text bietet eine spannungsreiche moralische Selbsteinschätzung. Die Übersetzung lässt diese Spannung sichtbar, statt sie dogmatisch aufzulösen.
- issue: Josefs Aussage οὐχ ἥμαρτον καὶ πεσὼν εἰς ὑμᾶς
  choice: „Ich habe nicht gesündigt, auch als ich euch in die Hände fiel.“
  alternative: „Ich habe nicht gegen euch gesündigt.“
  rationale: Die gewählte Fassung bleibt näher an der überlieferten Formulierung mit dem Partizip 'gefallen' und kennzeichnet die schwierige Syntax durch eine Fußnote.
- issue: Körperbilder für Mitgefühl und Trauer
  choice: Bilder wie 'das Innerste', 'meine Leber ergoss sich' und das Dröhnen des Herzens bleiben erhalten.
  alternative: Alle Bilder durch abstrakte Gefühlsbeschreibungen wie 'tiefes Mitgefühl' oder 'große Trauer' ersetzen.
  rationale: Die körperbezogene Sprache prägt die emotionale und theologische Rhetorik des Textes; ihre Tilgung würde den griechischen Zeugen verflachen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzähl- und Redestil. Altertümliche Wendungen werden vermieden; auffällige Körperbilder und schwierige moralische Aussagen des griechischen Textes bleiben jedoch sichtbar und werden bei Bedarf in Fußnoten erläutert.
