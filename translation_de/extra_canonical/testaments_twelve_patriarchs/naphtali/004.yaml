  terminology: „Schrift Henochs“, „sich vom Herrn abwenden“, „Gesetzlosigkeit“, „Gefangenschaft“ und „Bedrängnis“ sind quellentreu und terminologisch konsistent. Die Anmerkung zu „Schrift Henochs“ verhindert zu Recht eine unzulässige kanonische Festlegung.
