base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/004.yaml
  text: These things I say to you[a], my children, because I learned from the writing of Enoch that you also will surely depart from the Lord, walking in every lawlessness of the nations and doing all the wickedness of Sodom. And the Lord will bring captivity upon you, and there you will serve your enemies and the land will be laid waste and your holy places will be desolate. And you will be scattered to the four corners of the earth, and you will be as something despised among the nations, a curse and a dispersion, until the Most High visits the earth. He himself will come, saving Israel and all the nations, God speaking in the person of man. And after he has entered, unrighteousness will again increase upon the earth, and all the nations will be gathered against him. But whoever believes in him shall not be condemned in his name. And you, my children, shall rise up from your tribes with Levi and Judah; and there shall be war among you. And the Lord will be seen among men, and he will save
    Israel and all the nations. Therefore do not be divided into two heads, because every division among brothers is evil in the sight of the Lord. For the Lord loves singleness of purpose. And if you also walk in singleness of purpose according to his law[b], my children, no evil spirit will have power over you. For he knows that the God of heaven is one, and he will not accept a divided mind. Love the Lord through all your life[c], and one another with a true heart.
translation:
  language: de
  text: '**Testament des Naftali 4**


    **1** Dies sage ich euch, meine Kinder, weil ich aus der Schrift Henochs[a] erfahren habe, dass auch ihr euch vom Herrn abwenden werdet. Ihr werdet jeder Gesetzlosigkeit der Völker folgen und alle Bosheit Sodoms verüben. **2** Dann wird der Herr Gefangenschaft über euch bringen. Dort[b] werdet ihr euren Feinden dienen und unter allerlei Misshandlung und Bedrängnis leben[c], bis der Herr euch alle vernichtet hat.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Schrift Henochs“ kann ein Henoch zugeschriebenes Buch oder eine entsprechende schriftliche Überlieferung bezeichnen; die Formulierung allein entscheidet nicht über ihren kanonischen Rang.
    reason: cultural_note
  - marker: b
    text: „Dort“ steht in der Ausgabe in Ergänzungszeichen und ist daher textkritisch unsicher.
    reason: textual_variant
  - marker: c
    text: Das griechische Verb ist in der Ausgabe als textkritisch problematisch gekennzeichnet. Wörtlicher ließe sich die Wendung etwa mit „ihr werdet mit allerlei Misshandlung und Bedrängnis zusammenleben“ wiedergeben.
    reason: textual_variant
lexical_decisions:
- source_word: ἔγνων ἐν τῇ γραφῇ Ἐνώχ
  choice: ich aus der Schrift Henochs erfahren habe
  rationale: ἔγνων bezeichnet hier im Zusammenhang mit einer Schrift erworbenes Wissen. „Erfahren habe“ ist im Deutschen natürlich. „Schrift“ bezeichnet ein schriftliches Werk, ohne durch Großschreibung oder die Bezeichnung „Heilige Schrift“ dessen kanonischen Rang festzulegen.
- source_word: ἀποστήσεσθε ἀπὸ Κυρίου
  choice: ihr euch vom Herrn abwenden werdet
  rationale: Die Wendung bezeichnet die Abkehr vom Herrn. „Sich abwenden“ bewahrt den Bundesbruch, ohne einen späteren kirchlichen Fachausdruck wie „apostatisieren“ einzuführen.
- source_word: πορευόμενοι κατὰ πᾶσαν ἀνομίαν ἐθνῶν
  choice: Ihr werdet jeder Gesetzlosigkeit der Völker folgen
  rationale: Das partizipiale „gehend gemäß“ wird idiomatisch mit „folgen“ wiedergegeben. „Gesetzlosigkeit“ bewahrt den Bezug auf die Missachtung göttlicher Ordnung.
- source_word: ποιήσετε πᾶσαν πονηρίαν Σοδόμων
  choice: alle Bosheit Sodoms verüben
  rationale: „Bosheit“ gibt πονηρία gewichtig, aber verständlich wieder; „verüben“ passt im Deutschen zu konkret begangenem Unrecht.
- source_word: αἰχμαλωσίαν
  choice: Gefangenschaft
  rationale: Der Ausdruck kann nationale Niederlage, Verschleppung und den daraus folgenden Zustand bezeichnen. „Gefangenschaft“ lässt diese Bedeutungsbreite bestehen.
- source_word: πάσῃ κακώσει καὶ θλίψει συναναστραφήσεσθε
  choice: unter allerlei Misshandlung und Bedrängnis leben
  rationale: Das textkritisch markierte Verb bedeutet wörtlich etwa „mit etwas verkehren/zusammenleben“. Die deutsche Fassung vermittelt den Sinn eines von Misshandlung und Bedrängnis geprägten Lebens, ohne eine zusätzliche Verwüstungsaussage einzutragen.
- source_word: ἕως ἀναλώσει Κύριος πάντας ὑμᾶς
  choice: bis der Herr euch alle vernichtet hat
  rationale: ἀναλίσκω bedeutet „aufzehren, verbrauchen, vernichten“. Die harte Gerichtsaussage wird nicht abgeschwächt.
theological_decisions:
- issue: Rang der Henochschrift
  choice: „Schrift Henochs“ ohne ausdrückliche Kanonbezeichnung
  alternative: „Heilige Schrift Henochs“ oder „Buch Henoch“
  rationale: γραφή kann allgemein eine Schrift oder in bestimmten Zusammenhängen eine heilige Schrift bezeichnen. Der Genitiv benennt eine Henoch zugeordnete Schrift, entscheidet aber für sich allein nicht über ihren kanonischen Rang.
- issue: Endgültigkeit der Gerichtsankündigung
  choice: „bis der Herr euch alle vernichtet hat“
  alternative: „bis der Herr euch alle aufgerieben hat“ oder eine abschwächende Deutung als bloße Zerstreuung
  rationale: Der vorgelegte griechische Text endet mit einer umfassenden Vernichtungsaussage. Diese Spannung wird bewahrt und nicht anhand des längeren englischen Konsultationstextes durch eine anschließende Heilsankündigung entschärft.
- issue: Umfang des übersetzten Abschnitts
  choice: Nur der tatsächlich vorgelegte griechische Wortlaut wird übersetzt
  alternative: Die im englischen POB enthaltene längere Fortsetzung übernehmen
  rationale: Die englische Konsultationsfassung reicht weit über den bereitgestellten griechischen Ausgangstext hinaus. Nach dem Grundsatz der Ausgangssprachenpriorität darf unbelegtes Material nicht in den Haupttext aufgenommen werden.
translation_notes:
  register: Moderne, würdige Standardsprache mit prophetisch-testamentarischem Ernst. Satzbau und Wortwahl bleiben für gewöhnliche Leser verständlich. Die vorgelegte griechische Quelle umfasst nur 4,1–2 bis zur Vernichtungsankündigung; die erheblich längere englische Konsultationsfassung wurde deshalb nicht als Ausgangstext behandelt.
