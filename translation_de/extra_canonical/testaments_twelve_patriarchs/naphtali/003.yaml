  - severity: low
    issue: 'Vers 4: „am Himmelsgewölbe“ gibt ἐν nicht treffend wieder.'
    rationale: Die Schöpfungsbereiche stehen im Griechischen mit ἐν; „im Himmelsgewölbe, auf der Erde, im Meer“ wahrt die Aufzählung und ist im Deutschen natürlicher.
  - severity: low
