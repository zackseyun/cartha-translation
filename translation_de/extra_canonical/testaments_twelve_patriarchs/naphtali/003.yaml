  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003.yaml
  text: '1. So then, do not be eager in greed to corrupt your deeds, or by empty words to deceive your souls. For if, in purity of heart, you keep silence, you will understand how to hold fast the will of God and to cast away the will of Beliar.


    2. The sun and the moon and the stars do not alter their appointed order; so you also must not alter the law of God through the disorder of your deeds.


    3. The nations, having gone astray and having forsaken the Lord, altered their order, and gave heed to wood and stone, to spirits of deceit.


    4. But you, my children, must not be so. Rather, know in the firmament, on the earth, and in the sea, and in all created things, the Lord who made all things, so that you may not become like Sodom, which changed the order of its nature.


    5. In the same way also the Watchers changed the order of their nature, and the Lord cursed them at the time of the flood; because of them he made the earth desolate and without fruit.'
translation:
  language: de
  text: '1 Bemüht euch also nicht, aus Habgier eure Taten zu verderben oder durch leere Worte eure Seelen zu täuschen. Denn wenn ihr in reinem Herzen schweigt, werdet ihr verstehen, am Willen Gottes festzuhalten und den Willen Beliars zu verwerfen.


    2 Die Sonne, der Mond und die Sterne weichen nicht von ihrer Ordnung ab[a]; ebenso sollt auch ihr das Gesetz Gottes nicht durch die Unordnung eurer Taten verändern.


    3 Die Völker gingen in die Irre, verließen den Herrn und veränderten ihre Ordnung; sie gehorchten Holz und Stein, den Geistern des Irrtums.


    4 Ihr aber sollt nicht so sein, meine Kinder. Erkennt vielmehr im Himmelsgewölbe, auf der Erde, im Meer und in allen Geschöpfen den Herrn, der alles geschaffen hat, damit ihr nicht wie Sodom werdet, das die Ordnung seiner Natur veränderte.


    5 Ebenso veränderten auch die Wächter[b] die Ordnung ihrer Natur. Der Herr verfluchte sie zur Zeit der Sintflut; ihretwegen machte er die Erde verwüstet und unfruchtbar.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Ausdruck an dieser Stelle ist textlich unsicher. Die Übersetzung folgt dem Zusammenhang, nach dem die Himmelskörper ihre festgelegte Ordnung nicht verlassen.
    reason: Kennzeichnet das im griechischen Editionstext durch ein Kreuz markierte textliche Problem, ohne eine nicht belegte Rekonstruktion als sicher auszugeben.
  - marker: b
    text: Mit den „Wächtern“ sind übernatürliche Wesen aus frühjüdischen Überlieferungen über die Zeit vor der Sintflut gemeint.
    reason: Der Ausdruck ist heutigen Leserinnen und Lesern ohne Hintergrundwissen möglicherweise unklar.
  - marker: c
    text: Der griechische Wortlaut am Ende des Verses ist unsicher und syntaktisch schwierig; wörtlich stehen Begriffe wie „unbewohnt“ beziehungsweise „verwüstet“ und „unfruchtbar“ nebeneinander.
    reason: Kennzeichnet eine echte textkritische und syntaktische Unsicherheit, die in einer glatten Übersetzung sonst verborgen bliebe.
lexical_decisions:
- source_word: πλεονεξίᾳ
  choice: Habgier
  rationale: Gibt das moralisch negative Streben nach Mehr angemessen und allgemein verständlich wieder.
- source_word: λόγοις κενοῖς
  choice: leere Worte
  rationale: Bewahrt die konkrete Bildsprache und die ethische Aussage des griechischen Ausdrucks.
- source_word: καθαρότητι καρδίας
  choice: reinem Herzen
  rationale: Natürliches, würdiges Deutsch; der semitisch geprägte Ausdruck bleibt erkennbar.
- source_word: κρατεῖν
  choice: festzuhalten
  rationale: Drückt hier das entschiedene Ergreifen und Bewahren des göttlichen Willens aus.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Bewahrt die Namensform des griechischen Textes, ohne sie durch eine theologische Deutung zu ersetzen.
- source_word: τάξιν
  choice: Ordnung
  rationale: Der wiederkehrende Leitbegriff des Abschnitts wird in allen Versen konsistent wiedergegeben.
- source_word: πνεύμασι πλάνης
  choice: Geistern des Irrtums
  rationale: Bewahrt die mögliche personale und geistliche Bedeutung von πνεύμασι sowie die Ambiguität von πλάνη.
- source_word: στερεώματι
  choice: Himmelsgewölbe
  rationale: Gibt das antike kosmologische Bild verständlich wieder, ohne es zu modernisieren.
- source_word: Ἐγρήγοροι
  choice: Wächter
  rationale: Etablierte deutsche Bezeichnung für die übernatürlichen Gestalten der frühjüdischen Überlieferung.
- source_word: ἄκαρπον
  choice: unfruchtbar
  rationale: Gibt den wörtlichen Sinn 'ohne Frucht' in idiomatischem Deutsch wieder.
theological_decisions:
- issue: Bedingung oder Mittel des Verstehens in Vers 1
  choice: wenn ihr in reinem Herzen schweigt
  alternative: indem ihr in reinem Herzen schweigt
  rationale: Das Partizip σιωπῶντες kann modal oder konditional verstanden werden. Die konditionale Wiedergabe bewahrt die im konsultierten Text hervorgehobene Lesart, ohne eine Heilslehre daraus abzuleiten.
- issue: Gegenstand der Erkenntnis in Vers 4
  choice: Erkennt ... den Herrn
  alternative: Erkennt den Herrn im Himmelsgewölbe ...
  rationale: Die Stellung von Κύριον als Objekt von γινώσκοντες wird bewahrt; die Schöpfungsbereiche werden als Orte beziehungsweise Medien der Erkenntnis verstanden.
- issue: Sodoms Veränderung der Naturordnung
  choice: die Ordnung seiner Natur veränderte
  alternative: die natürliche Ordnung veränderte
  rationale: Die genitivische Formulierung des Griechischen bleibt erhalten, ohne die Art der Verfehlung konfessionell oder exegetisch enger festzulegen.
- issue: Identität der Ἐγρήγοροι
  choice: Wächter
  alternative: Wachsame
  rationale: Die traditionelle Bezeichnung stellt den Bezug zur frühjüdischen Wächterüberlieferung her, ohne die Gestalten ausdrücklich als Engel zu identifizieren.
- issue: Textlich schwieriger Schluss von Vers 5
  choice: ihretwegen machte er die Erde verwüstet und unfruchtbar
  alternative: ihretwegen wurde die Erde unbewohnt und unfruchtbar
  rationale: Der überlieferte griechische Wortlaut ist syntaktisch gestört. Die Übersetzung folgt dem erkennbaren Sinn und der konsultierten Lesart, markiert die Schwierigkeit jedoch in einer Fußnote.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem paränetischem Ton. Der wiederkehrende Begriff „Ordnung“ verbindet Kosmos, menschliches Handeln und Natur. Archaismen werden vermieden; „Herr“, „Sintflut“ und „Himmelsgewölbe“ bleiben wegen ihres sachlichen und literarischen Gewichts erhalten.
