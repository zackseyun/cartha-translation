  verdict: revise
  source_fidelity: Der Entwurf gibt den paränetischen Gedankengang, den Leitbegriff τάξις als „Ordnung“, Βελίαρ, die „Wächter“ sowie die bewusst nicht weiter ausgelegte Aussage über Sodom insgesamt zuverlässig wieder. In Vers 4 ist ἐν jedoch mit „im“ statt dem im Deutschen semantisch verschobenen „am“ wiederzugeben. In Vers 2 ist der überlieferte Ausdruck textlich auffällig (†καλύψουσι); die sinngemäße Wiedergabe „von ihrer Ordnung abweichen“ ist möglich, soll aber als textlich unsicher markiert werden. Vers 5 bleibt wegen des gestörten Schlusses behutsam und mit Fußnote wiedergegeben.
  naturalness: Der Stil ist modernes, würdiges Standarddeutsch. Die Änderung von „am Himmelsgewölbe“ zu „im Himmelsgewölbe“ ist idiomatischer und entspricht der lokalen Präposition des Griechischen. Die Umstellung in Vers 5 („machte er die Erde ...“) verbessert den Satzfluss.
  terminology: „Habgier“, „reinem Herzen“, „Herr“, „Beliar“, „Ordnung“, „Geister des Irrtums“, „Himmelsgewölbe“ und „Wächter“ sind konsistent, verständlich und quellentreu. „Wächter“ wird sachlich erläutert, ohne die Figuren konfessionell festzulegen.
