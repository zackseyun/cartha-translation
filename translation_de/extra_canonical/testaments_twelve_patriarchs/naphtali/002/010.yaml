source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 10. *Ὅτι ἐὰν εἴπῃς τῷ ὀφθαλμῷ, Ἄκουε, οὐ δυνήσεται⁸²· οὕτως οὐδὲ *ἐν σκότει⁸³ *ὄντες δύνασθε ποιεῖν⁸⁴ ἔργα⁸⁵ φωτός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/010.yaml
  text: For if you say to the eye, “Hear,” it cannot; so neither, being in darkness, can you do the works of light.
translation:
  language: de
  text: 'Denn wenn du zum Auge sagst: »Höre!«, kann es das nicht. Ebenso könnt auch ihr, wenn ihr in der Finsternis seid, keine Werke des Lichts tun.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀφθαλμῷ
  choice: Auge
  rationale: Die konkrete Körpermetapher des griechischen Textes wird unmittelbar und natürlich wiedergegeben.
- source_word: Ἄκουε
  choice: Höre!
  rationale: Der Imperativ bleibt als direkte, bewusst widersinnige Aufforderung an das Auge erhalten.
- source_word: ἐν σκότει ὄντες
  choice: solange ihr in der Finsternis seid
  rationale: Gibt den partizipialen Umstand idiomatisch wieder, ohne die bildhafte Bedeutung von σκότος aufzulösen.
- source_word: ἔργα φωτός
  choice: Werke des Lichts
  rationale: Bewahrt die prägnante ethische Bildsprache und die formale Gegenüberstellung von Finsternis und Licht.
theological_decisions:
- issue: Verhältnis von Zustand und Handlungsfähigkeit
  choice: »solange ihr in der Finsternis seid, keine Werke des Lichts tun«
  alternative: »wenn ihr in der Finsternis seid, die Werke des Lichts nicht tun«
  rationale: Die Übersetzung erhält die Aussage des Textes über die Unvereinbarkeit von Finsternis und Lichtwerken, ohne genauer festzulegen, ob damit moralische Unfähigkeit, praktische Unmöglichkeit oder bildhafte Inkongruenz gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Argumentationsstruktur und der Kontrast zwischen Auge/Ohr sowie Finsternis/Licht bleiben klar erkennbar.
