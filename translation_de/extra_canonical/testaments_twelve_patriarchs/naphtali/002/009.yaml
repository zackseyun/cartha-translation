source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 9. Οὕτως⁷⁶ ⌜οὖν⌝ *ἔστωσαν, τέκνα μου, πάντα τὰ ἔργα ὑμῶν ἐν τάξει εἰς ἀγαθόν⁷⁷ ἐν φόβῳ Θεοῦ, καὶ μηδὲν ἄτακτον ποιήσητε⁷⁸ ἐν καταφρονήσει, μηδὲ⁷⁹ ἔξω⁸⁰ *καιροῦ αὐτοῦ⁸¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/009.yaml
  text: So then, my children, let all your works be in order for good in the fear of God, and do nothing disorderly in contempt, nor outside its proper time.
translation:
  language: de
  text: So sollen also, meine Kinder, alle eure Taten in der Furcht Gottes wohlgeordnet auf das Gute ausgerichtet sein. Tut nichts Ungeordnetes aus Verachtung und nichts außerhalb der dafür bestimmten Zeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὕτως οὖν
  choice: So also
  rationale: Gibt die folgernde Rückbindung an den vorausgehenden Gedankengang natürlich und knapp wieder.
- source_word: πάντα τὰ ἔργα ὑμῶν
  choice: alle eure Taten
  rationale: „Taten“ ist im modernen Deutsch natürlicher als „Werke“, ohne den umfassenden Sinn von ἔργα einzuengen.
- source_word: ἐν τάξει εἰς ἀγαθόν
  choice: wohlgeordnet auf das Gute ausgerichtet
  rationale: Bewahrt sowohl den Gedanken geordneter Ausführung als auch die Zielrichtung zum Guten; eine rein idiomatische Wiedergabe wie „in guter Ordnung“ würde εἰς ἀγαθόν abschwächen.
- source_word: ἐν φόβῳ Θεοῦ
  choice: in der Furcht Gottes
  rationale: Erhält die traditionelle und theologisch offene Formulierung; sie kann Ehrfurcht einschließen, ohne φόβος darauf zu reduzieren.
- source_word: ἐν καταφρονήσει
  choice: aus Verachtung
  rationale: Gibt die Haltung bewusster Missachtung wieder und lässt offen, worauf sich die Verachtung im Einzelnen richtet.
- source_word: ἔξω καιροῦ αὐτοῦ
  choice: außerhalb der dafür bestimmten Zeit
  rationale: καιρός bezeichnet den passenden oder bestimmten Zeitpunkt. Das Pronomen αὐτοῦ wird funktional auf das jeweilige Tun bezogen, ohne eine im Deutschen missverständliche Genusform zu erzwingen.
theological_decisions:
- issue: Bedeutung von φόβος Θεοῦ
  choice: Furcht Gottes
  alternative: Ehrfurcht vor Gott
  rationale: „Furcht Gottes“ bewahrt die volle semantische und theologische Spannung des griechischen Ausdrucks und legt ihn nicht ausschließlich als respektvolle Ehrfurcht aus.
- issue: Bezug von αὐτοῦ in καιροῦ αὐτοῦ
  choice: die dafür bestimmte Zeit
  alternative: seine Zeit
  rationale: Das griechische Pronomen kann sich auf das jeweilige Werk beziehungsweise Tun beziehen. Die funktionale Wiedergabe ist verständlich, ohne einen eindeutigen Bezug dogmatisch oder grammatisch zu überpräzisieren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde leicht gegliedert, um die Mahnung klar lesbar zu machen; die formale Parallelität der Verbote bleibt erhalten.
