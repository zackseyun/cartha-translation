  terminology: '„Hirschkuh“ ist für die hier feminin gebrauchte ἔλαφος eine angemessene Wiedergabe. Die vorhandene Anmerkung erzeugt jedoch eine sachlich nicht nötige Unsicherheit: Der Ausdruck kann zwar kontextuell eine Hirschart bezeichnen, steht hier aber ausdrücklich in femininer Form und legt gerade die weibliche Bezeichnung nahe.'
