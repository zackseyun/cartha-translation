base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/001.yaml
  text: My mother Bilhah was the daughter of Rotheus, the brother of Deborah, the nurse of Rebecca; she was born on the same day as Rachel. 10 And Rotheus was of the lineage of Abraham, a Chaldean, God-fearing, freeborn and noble. 11 And having been taken captive, he was bought by Laban; and Laban gave him his maidservant Eunan as a wife, and she bore a daughter, and he called her name Zelpha, after the name of the city in which he had been taken captive. 12 And after this she bore Bilhah, saying, ‘My daughter is one who renews.’ II. I was swift on my feet like a deer, and my father Jacob appointed me for every errand; and he indeed blessed me as a deer.
translation:
  language: de
  text: 2,1 Ich war leichtfüßig wie eine Hirschkuh, und mein Vater Jakob setzte mich für jeden Botengang ein. Und tatsächlich segnete er mich wie eine Hirschkuh.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κοῦφος τοῖς ποσίν
  choice: leichtfüßig
  rationale: Die Wendung bedeutet wörtlich »leicht an den Füßen« und bezeichnet hier flinke, mühelose Fortbewegung. »Leichtfüßig« bewahrt das Bild natürlicher als das stärker ausdeutende »schnell«.
- source_word: ἔλαφος
  choice: Hirschkuh
  rationale: Das griechische Substantiv bezeichnet ein Tier aus der Familie der Hirsche und steht hier in einer weiblichen Form; »Hirschkuh« gibt das Tierbild eindeutig wieder und passt zur traditionellen Naphtali-Metaphorik.
- source_word: ἔταξέ με … εἰς πᾶσαν ἀγγελίαν
  choice: setzte mich für jeden Botengang ein
  rationale: τάσσω bezeichnet eine Bestimmung oder Beauftragung; ἀγγελία kann Nachricht, Botschaft oder den damit verbundenen Auftrag meinen. Die deutsche Wendung macht verständlich, dass Naphtali als schneller Bote eingesetzt wurde, ohne einen einzelnen konkreten Auftrag zu unterstellen.
- source_word: καίγε ὡσεὶ
  choice: Ja, … wie
  rationale: καίγε verstärkt und bestätigt den anschließenden Vergleich. Das deutsche »Ja« gibt diese Hervorhebung knapp und natürlich wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe autobiografische Aussage und die zweimalige Tiermetapher bleiben erhalten; »Botengang« ist alltagssprachlich verständlich, ohne salopp zu wirken.
