source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 7. Καὶ ὡς⁵³ κεχώρισται ἀνάμεσον *τοῦ φωτὸς καὶ ἀνάμεσον τοῦ σκότους⁵⁴ *δράσεώς τε καὶ ἀκοῆς⁵⁵, οὕτως⁵⁶ κεχώρισται ἀνάμεσον ἀνδρὸς καὶ *ἀνδρός, καὶ ἀνάμεσον γυναικὸς καὶ⁵⁷ γυναικός⁵⁸, καὶ οὐκ ἔστιν εἰπεῖν ὅτι †*ἐν τῷ ἑνὶ τοῖς προσώποις ἡττόμενον ἦν †⁵⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/007.yaml
  text: And just as there is a division between light and darkness, and between sight and hearing, so there is also a division between man and man, and between woman and woman; and it is not possible to say that in appearance one is inferior to another.
translation:
  language: de
  text: Und wie zwischen Licht und Finsternis sowie zwischen Sehen und Hören ein Unterschied besteht, so besteht auch ein Unterschied zwischen Mann und Mann und zwischen Frau und Frau; und man kann nicht sagen, dass die eine Person ihrem Erscheinungsbild nach geringer sei als die andere.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut des letzten Satzteils ist unsicher. Möglich wäre sinngemäß auch: „dass die eine Gestalt der anderen unterlegen sei“.'
    reason: Die überlieferte Formulierung ἐν τῷ ἑνὶ τοῖς προσώποις ἡττόμενον ἦν ist grammatisch gestört und lässt das genaue Verhältnis von „einem“, „Personen/Gesichtern“ und „unterlegen“ offen.
lexical_decisions:
- source_word: κεχώρισται ἀνάμεσον
  choice: zwischen … besteht ein Unterschied
  rationale: Das Perfekt Passiv bezeichnet eine bestehende Trennung beziehungsweise Unterscheidung. Die deutsche Wendung gibt den resultativen Zustand natürlich wieder.
- source_word: δράσεώς τε καὶ ἀκοῆς
  choice: zwischen Sehen und Hören
  rationale: Die beiden Wahrnehmungsvermögen werden parallel und substantivisch wiedergegeben; δράσεως ist textlich auffällig, wird hier jedoch gemäß dem überlieferten Sinn der englischen Konsultationsschicht als Sehen verstanden.
- source_word: ἀνδρὸς καὶ ἀνδρός / γυναικὸς καὶ γυναικός
  choice: zwischen Mann und Mann / zwischen Frau und Frau
  rationale: Die markante Wiederholung des Griechischen bleibt erhalten und bezeichnet Unterschiede innerhalb derselben Gruppe.
- source_word: προσώποις
  choice: Person / Erscheinungsbild
  rationale: πρόσωπον kann Gesicht, äußere Erscheinung oder Person bedeuten. Der Satzbau ist verderbt; die Übersetzung wahrt beide naheliegenden Bedeutungsfelder, ohne eine dogmatische Aussage daraus abzuleiten.
- source_word: ἡττόμενον
  choice: geringer
  rationale: Das Wort bezeichnet Unterlegenheit oder Geringer-Sein. Die neutrale Wiedergabe vermeidet die stärkere Behauptung einer umfassenden Minderwertigkeit.
theological_decisions:
- issue: Aussage über Unterschiede und Unterlegenheit zwischen Menschen
  choice: Die Verschiedenheit wird bejaht, eine erkennbare Unterlegenheit im Erscheinungsbild jedoch verneint.
  alternative: Die Schlussklausel könnte aufgrund des verderbten Textes als Aussage verstanden werden, ein Gesicht sei dem anderen nicht in jeder Hinsicht gleich.
  rationale: Der erhaltene griechische Wortlaut der Schlussklausel ist syntaktisch unsicher. Die gewählte Fassung folgt den erkennbaren Wörtern für Person/Erscheinung und Unterlegenheit, ohne Gleichwertigkeit oder Hierarchie über den Text hinaus systematisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Finsternis“ erhält den feierlichen antiken Kontrast zu „Licht“; die übrige Syntax ist bewusst klar und gegenwärtig gehalten. Die schwer verständliche Schlussklausel wird im Haupttext lesbar formuliert und ihre echte textliche Unsicherheit in einer Fußnote kenntlich gemacht.
