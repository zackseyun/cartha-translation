  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/005.yaml
  text: For there is no creation and no thought that the Lord does not know; for he created all things, and he created man in his own image.
translation:
  language: de
  text: Denn es gibt weder ein Geschöpf noch irgendeinen Gedanken, die der Herr nicht kennt; denn alles hat er erschaffen, und den Menschen hat er nach seinem eigenen Bild erschaffen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte griechische Wortlaut ist im zweiten Satz grammatisch unregelmäßig; dem Sinn nach ist zu lesen: „denn alles hat er erschaffen, und den Menschen hat er nach seinem eigenen Bild erschaffen“.'
    reason: Die handschriftlich beziehungsweise editorisch markierte Textgestalt um πάντα und ἄνθρωπον ist syntaktisch schwierig. Die Fußnote macht transparent, dass die flüssige Haupttextfassung eine sinnbezogene Rekonstruktion wiedergibt.
lexical_decisions:
- source_word: πλάσμα
  choice: Geschöpf
  rationale: Bezeichnet hier etwas Geschaffenes beziehungsweise Geformtes; „Geschöpf“ ist im Zusammenhang natürlicher und konkreter als „Gebilde“ oder „Schöpfung“.
- source_word: πᾶσα ἔννοια
  choice: keinen Gedanken
  rationale: ἔννοια bezeichnet einen Gedanken, eine Vorstellung oder Absicht. Die Verneinung wird im Deutschen idiomatisch über „kein … und keinen …“ auf beide Satzglieder bezogen.
- source_word: ἔγνω
  choice: kennt
  rationale: Der griechische Aorist bedeutet wörtlich „erkannte/hat erkannt“. Im vorliegenden allgemeinen Aussagesatz gibt das deutsche Präsens „kennt“ den gemeinten fortdauernden Sachverhalt natürlich wieder.
- source_word: πάντα
  choice: alles
  rationale: Das substantivierte Neutrum Plural bezeichnet umfassend „alle Dinge“; „alles“ bewahrt diese Weite.
- source_word: ἄνθρωπον
  choice: den Menschen
  rationale: Der griechische Singular bezeichnet hier den Menschen als Menschheit beziehungsweise Gattung, nicht ausdrücklich jeden einzelnen Menschen.
- source_word: κατʼ εἰκόνα ἑαυτοῦ
  choice: nach seinem eigenen Bild
  rationale: Gibt die Bild-Terminologie und den rückbezüglichen Nachdruck von ἑαυτοῦ eng und zugleich idiomatisch wieder.
theological_decisions:
- issue: Umfang der göttlichen Kenntnis
  choice: „kein Geschöpf und keinen Gedanken, den der Herr nicht kennt“
  alternative: „nichts Geschaffenes und keine Absicht, von der der Herr nichts wusste“
  rationale: Die Formulierung bewahrt sowohl πλάσμα als auch ἔννοια als getrennte Größen und bringt die uneingeschränkte Kenntnis des Herrn zum Ausdruck, ohne näher festzulegen, wessen Gedanken gemeint sind.
- issue: Gottebenbildlichkeit des Menschen
  choice: „den Menschen … nach seinem eigenen Bild“
  alternative: „jeden Menschen … nach seinem eigenen Bild“
  rationale: Der Singular wird kollektiv wiedergegeben. Eine ausdrückliche Verteilung auf „jeden Menschen“ wäre zwar theologisch möglich, ist im griechischen Wortlaut aber nicht eindeutig ausgedrückt.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch. Die Wiederholung von „erschaffen“ erhöht trotz leichter stilistischer Redundanz die Klarheit und entspricht der im konsultierten Text bezeugten Zweiteilung: alles Geschaffene und besonders der Mensch.'
