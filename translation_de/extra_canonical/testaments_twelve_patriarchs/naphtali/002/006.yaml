id: T12P.NAP.2.6
reference: Testament of Naphtali 2:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 6. *Ὡς γὰρ ἡ ἰσχὺς αὐτοῦ, οὕτως⁴⁸ καὶ ὁ λόγος αὐτοῦ⁵⁰, ἢ ἐν νόμῳ Κυρίου, ἢ ἐν νόμῳ⁵¹ τοῦ⁵² Βελίαρ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/006.yaml
  text: As a person's strength is, so also is his word, whether in the law of the Lord or in the works of Beliar.
translation:
  language: de
  text: Denn wie seine Kraft ist, so ist auch sein Wort – sei es im Gesetz des Herrn oder im Gesetz Beliars.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die hier vorgelegte griechische Zeile lautet am Ende „im Gesetz Beliars“. Eine abweichend zugrunde gelegte Lesart gibt den Ausdruck als „in den Werken Beliars“ wieder.
    reason: Macht die Spannung zwischen dem angegebenen griechischen Editionstext (νόμῳ) und der dokumentierten englischen Revisionsentscheidung zugunsten einer Lesart mit „Werken“ transparent.
lexical_decisions:
- source_word: ἰσχύς
  choice: Kraft
  rationale: Gibt die körperliche oder persönliche Stärke des griechischen Ausdrucks natürlich und ohne unnötige Präzisierung wieder.
- source_word: λόγος
  choice: Wort
  rationale: Entspricht dem überlieferten griechischen Text und bewahrt den möglichen Sinnumfang von Wort, Rede oder Äußerung; „Werk“ wäre hier keine direkte Wiedergabe.
- source_word: νόμος
  choice: Gesetz
  rationale: Der in der vorgelegten griechischen Zeile zweimal stehende Begriff wird parallel wiedergegeben.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Bewahrt die griechische Namensform, ohne sie mit einer konfessionell geprägten Deutung zu erklären.
theological_decisions:
- issue: Parallele Herrschaftsbereiche des Herrn und Beliars
  choice: „im Gesetz des Herrn oder im Gesetz Beliars“
  alternative: „im Gesetz des Herrn oder in den Werken Beliars“
  rationale: Die vorgelegte griechische Hauptzeile hat in beiden Satzgliedern νόμῳ („Gesetz“). Die abweichende Fassung mit „Werken“ wird wegen der bezeugten Revisionsangabe in einer Fußnote offengelegt, aber nicht in den Haupttext eingesetzt.
- issue: Bezug von αὐτοῦ („sein“)
  choice: Pronomen ohne ausdrückliches Bezugswort beibehalten
  alternative: „wie die Kraft eines Menschen ist“
  rationale: Das Griechische nennt in diesem Vers lediglich „seine“; eine ausdrückliche Ergänzung „eines Menschen“ würde den aus dem Zusammenhang zu erschließenden Bezug festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Parallelstruktur des Griechischen bleibt erhalten; der Gedankenstrich macht die Alternative lesbar, ohne sie auszudeuten.
