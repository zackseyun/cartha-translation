source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 2. Καθὼς⁹ γὰρ *οἶδεν ὁ κεραμεὺς¹⁰ τὸ σκεῦος πόσον χωρεῖ, καὶ πρὸς αὐτὸ¹¹ φέρει τὸν¹² πηλόν, οὕτω¹³ καὶ ὁ Κύριος πρὸς ὁμοίωσιν τοῦ πνεύματος¹⁴ ποιεῖ¹⁵ τὸ σῶμα, καὶ πρὸς τὴν δύναμιν τοῦ σώματος¹⁶ *τὸ πνεῦμα ἐπιτίθησιν¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/002.yaml
  text: For just as the potter knows how much the vessel can hold, and according to that brings the clay for it, so also the Lord, according to the likeness of the spirit, makes the body, and according to the body's capacity places the spirit in it.
translation:
  language: de
  text: Denn wie der Töpfer weiß, wie viel ein Gefäß fasst, und dementsprechend den Ton herbeibringt, so macht auch der Herr den Leib nach der Ähnlichkeit des Geistes[a] und legt den Geist entsprechend der Kraft des Leibes[b] in ihn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „in Entsprechung zum Geist“. Der Ausdruck kann Ähnlichkeit oder Entsprechung bezeichnen und bleibt im Griechischen deutungsoffen.'
    reason: ὁμοίωσις kann Ähnlichkeit oder Entsprechung bezeichnen; die Anmerkung wahrt die Offenheit des Ausdrucks.
  - marker: b
    text: „Kraft“ kann hier auch das Vermögen oder die Aufnahmefähigkeit des Leibes meinen.
    reason: δύναμις hat ein breites Bedeutungsspektrum; der Vergleich mit dem Fassungsvermögen eines Gefäßes legt „Fassungsvermögen“ nahe, erzwingt diese Deutung aber nicht.
lexical_decisions:
- source_word: κεραμεύς
  choice: Töpfer
  rationale: Die geläufige und genaue deutsche Bezeichnung; sie bewahrt das Bild des Handwerkers.
- source_word: σκεῦος
  choice: Gefäß
  rationale: Im Zusammenhang mit Töpfer und Ton bezeichnet das allgemeinere Wort hier natürlich ein Gefäß.
- source_word: χωρεῖ
  choice: fasst
  rationale: Gibt in diesem Kontext das Fassungsvermögen des Gefäßes idiomatisch wieder.
- source_word: πρὸς αὐτό
  choice: ihm entsprechend
  rationale: Bezieht αὐτό auf das Gefäß beziehungsweise dessen zuvor genanntes Fassungsvermögen, ohne einen zusätzlichen Arbeitszweck einzutragen.
- source_word: ποιεῖ
  choice: formt
  rationale: Im Töpferbild ist „formt“ natürlicher als das allgemeinere „macht“ und bleibt sachlich bei der Herstellung des Leibes.
- source_word: σῶμα
  choice: Leib
  rationale: „Leib“ ist in anthropologischer Rede würdevoll und unterscheidet den lebendigen menschlichen Leib von einem bloßen Gegenstand.
- source_word: ὁμοίωσις
  choice: Abbild
  rationale: Bewahrt die Vorstellung einer Ähnlichkeit beziehungsweise Entsprechung, nach der der Leib geformt wird.
- source_word: δύναμις
  choice: Kraft
  rationale: Gibt den griechischen Ausdruck formal wieder und vermeidet, ihn stillschweigend ausschließlich als Fassungsvermögen zu deuten.
- source_word: ἐπιτίθησιν
  choice: legt … in ihn
  rationale: Vermittelt das Platzieren des Geistes in den Leib in natürlichem Deutsch; das Ziel wird aus dem parallelen Satzbau erschlossen.
theological_decisions:
- issue: Verhältnis von Geist und Leib bei ihrer Gestaltung
  choice: „den Leib nach dem Abbild des Geistes … den Geist entsprechend der Kraft des Leibes“
  alternative: „den Leib in Entsprechung zum Geist … den Geist entsprechend dem Fassungsvermögen des Leibes“
  rationale: Die Übersetzung erhält die wechselseitige, spannungsvolle Zuordnung des griechischen Textes und legt weder eine bestimmte Seelenlehre noch eine eindeutige Rangordnung von Geist und Leib fest.
- issue: Bedeutung von δύναμις τοῦ σώματος
  choice: „Kraft des Leibes“
  alternative: „Fassungsvermögen des Leibes“ oder „Fähigkeit des Leibes“
  rationale: „Kraft“ wahrt die lexikalische Breite von δύναμις; eine Fußnote nennt die im Töpfervergleich naheliegende kapazitive Lesart.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klar erkennbarer Parallelstruktur. Das Töpferbild bleibt anschaulich; ungewöhnliche anthropologische Aussagen werden nicht geglättet oder konfessionell ausgedeutet.
