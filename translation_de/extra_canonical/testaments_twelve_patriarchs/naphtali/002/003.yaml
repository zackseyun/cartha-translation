source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 3. Καὶ¹⁸ οὐκ *ἔστιν ἐνλεῖπον¹⁹ *ἐκ τοῦ ἑνὸς²⁰ *τρίτου τριχός²¹· *σταθμῷ γὰρ καὶ μέτρῳ²² καὶ κανόνι πᾶσα Γἡ¹²³ *κτίσις ἐγένετο²⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/003.yaml
  text: And there is no deficiency in it, not even by a third of a hair; for by weight and measure and rule every creation was made.
translation:
  language: de
  text: Und es gibt darin keinen Mangel, auch nicht um ein Drittel eines Haares; denn nach Gewicht, Maß und Richtschnur wurde die ganze Schöpfung geschaffen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνλεῖπον
  choice: es fehlt daran
  rationale: Gibt die Aussage eines Mangels natürlich wieder; das Bezugsobjekt bleibt wie im griechischen Text nur implizit.
- source_word: ἐκ τοῦ ἑνὸς τρίτου τριχός
  choice: nicht einmal ein Drittel eines Haares
  rationale: Bewahrt das ungewöhnliche, äußerst kleine Vergleichsmaß des griechischen Textes, ohne es zu glätten.
- source_word: σταθμῷ ... καὶ μέτρῳ ... καὶ κανόνι
  choice: nach Gewicht, Maß und Richtschnur
  rationale: Erhält die dreigliedrige Ordnungssprache; „Richtschnur“ gibt κανών hier als Maßstab beziehungsweise normierende Linie anschaulich wieder.
- source_word: πᾶσα ἡ κτίσις
  choice: die ganze Schöpfung
  rationale: Bezeichnet umfassend die geschaffene Welt und entspricht dem kollektiven Singular.
- source_word: ἐγένετο
  choice: wurde ... geschaffen
  rationale: Im Zusammenhang mit κτίσις ist die explizite Schöpfungsformulierung im Deutschen natürlicher als „entstand“, ohne einen zusätzlichen Akteur zu benennen.
theological_decisions:
- issue: Vollständigkeit und geordnete Beschaffenheit der Schöpfung
  choice: Die absolute Mangellosigkeit und die Ordnung nach Gewicht, Maß und Richtschnur werden ungeschmälert wiedergegeben.
  alternative: Die Aussage als bloße allgemeine Harmonie oder annähernde Genauigkeit paraphrasieren.
  rationale: Der griechische Text formuliert konkret und emphatisch; eine Abschwächung würde seine kosmologische Aussage verändern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige Wendung „ein Drittel eines Haares“ bleibt bewusst erhalten. „Richtschnur“ ist verständlich und bewahrt zugleich den bildhaften Charakter von κανών.
