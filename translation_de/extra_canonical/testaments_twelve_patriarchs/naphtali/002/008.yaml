source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 8. *Πάντα ⌜γὰρ⌝⁶⁰ ἐν τάξει ἐποίησεν ὁ Θεὸς καλά· τὰς πέντε αἰσθήσεις ἐν τῇ κεφαλῇ *καὶ τὸν τράχηλον συνάψας τῇ κεφαλῇ⁶¹, *προσθεὶς αὐτῇ καὶ τρίχας εἰς εὐπρέπειαν καὶ δόξαν⁶², εἶτα⁶³ καρδίαν *εἰς φρόνησιν⁶⁴, κοιλίαν εἰς †διάκρισιν⁶⁵, *στόμαχον εἰς †ἀλεσμόν⁶⁶, †κάλαμον⁶⁷ πρὸς †ὑγείαν⁶⁸, ἧπαρ⁶⁹ πρὸς θυμόν, χολὴν πρὸς πικρίαν, ⌜καὶ⌝⁷⁰ *σπλῆνα πρὸς γέλωτα⁷¹, νεφροὺς ⌜εἰς πανουργίαν⁷², ψύας⁷³⌝ εἰς δύναμιν, *†πλευρὰν εἰς τὸ καθεύδειν†⁷⁴, ὀσφὺν⁷⁵ εἰς ἰσχύν, καὶ τὰ ἑξῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/008.yaml
  text: 'For God made all things good in their order: the five senses in the head, and he joined the neck to the head; and he added hair for beauty, and the heart for understanding, the belly for excrement, the stomach for grinding, the windpipe for taking in air, the liver for anger, the gall for bitterness, the spleen for laughter, the kidneys for craftiness, the loins for strength, and the lungs for drawing in; and so the rest.'
translation:
  language: de
  text: 'Denn Gott hat alles gut und in geordneter Weise geschaffen: die fünf Sinne im Kopf; den Hals fügte er an den Kopf und gab dem Kopf auch Haare zur Schönheit und Ehre. Dann schuf er das Herz zum Verstehen, den Bauch zur Ausscheidung[a], den Magen zum Zermahlen, das Rohr zur Gesundheit[b], die Leber für den Zorn, die Galle für die Bitterkeit, die Milz für das Lachen, die Nieren für die Verschlagenheit, die Lendenmuskeln[c] für die Kraft, die Seite zum Schlafen[d], die Hüfte für die Stärke und ebenso alles Weitere.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem erhaltenen griechischen Text: „zur Trennung“ oder „zur Unterscheidung“; die Lesart ist unsicher.'
    reason: Der griechische Ausdruck διάκρισιν ist textkritisch markiert und im anatomischen Zusammenhang ungewöhnlich.
  - marker: b
    text: 'Der griechische Text lautet wörtlich: „das Rohr zur Gesundheit“. Sowohl die anatomische Bezeichnung als auch die Funktionsangabe sind unsicher; möglicherweise ist ein Atemweg gemeint.'
    reason: κάλαμον und ὑγείαν sind in der Edition als problematisch gekennzeichnet. Die Fußnote erläutert die mögliche Deutung, ohne sie im Lauftext festzulegen.
  - marker: c
    text: Gemeint sind vermutlich die tief liegenden Muskeln der Lendengegend, die sogenannten Psoasmuskeln.
    reason: Die seltene anatomische Bezeichnung ψύας ist heutigen Leserinnen und Lesern kaum verständlich.
  - marker: d
    text: 'Wörtlich: „die Seite zum Schlafen“; diese Stelle ist im griechischen Text unsicher.'
    reason: Die gesamte Wortgruppe ist in der Edition als verderbt beziehungsweise zweifelhaft markiert.
lexical_decisions:
- source_word: ἐν τάξει ... καλά
  choice: in guter Ordnung
  rationale: Gibt sowohl τάξις (Ordnung) als auch καλά (gut/schön) knapp und natürlich wieder, ohne die Aussage auf bloße ästhetische Schönheit zu verengen.
- source_word: εὐπρέπειαν καὶ δόξαν
  choice: Anmut und Zierde
  rationale: Bewahrt den Gedanken eines ansehnlichen, schmückenden Erscheinungsbildes; „Herrlichkeit“ wäre im anatomischen Zusammenhang unnötig feierlich und potenziell theologisch überladen.
- source_word: καρδίαν εἰς φρόνησιν
  choice: das Herz zum Verstehen
  rationale: φρόνησις bezeichnet Einsicht oder verständiges Denken; „Verstehen“ ist allgemeinverständlich und wahrt die antike Zuordnung des Denkens zum Herzen.
- source_word: κοιλίαν εἰς διάκρισιν
  choice: den Bauch zur Ausscheidung
  rationale: Das überlieferte, als unsicher markierte διάκρισιν bedeutet wörtlich Trennung/Unterscheidung; im anatomischen Kontext liegt die körperliche Absonderung beziehungsweise Ausscheidung nahe.
- source_word: στόμαχον εἰς ἀλεσμόν
  choice: den Magen zum Zermahlen
  rationale: Gibt das Bild des Mahlens in ἀλεσμός konkret wieder.
- source_word: κάλαμον πρὸς ὑγείαν
  choice: die Luftröhre für die Gesundheit
  rationale: κάλαμος ist wörtlich ein Rohr und kann anatomisch die Luftröhre bezeichnen; ὑγεία wird entsprechend dem erhaltenen griechischen Text als „Gesundheit“ wiedergegeben.
- source_word: νεφροὺς εἰς πανουργίαν
  choice: die Nieren für die Verschlagenheit
  rationale: πανουργία kann Klugheit, Gerissenheit oder Verschlagenheit meinen. „Verschlagenheit“ bewahrt die spannungsreiche, eher negative Bedeutung, ohne sie zu harmonisieren.
- source_word: ψύας εἰς δύναμιν
  choice: die Lendenmuskeln für die Kraft
  rationale: ψύαι bezeichnet die Psoasmuskeln beziehungsweise Muskeln der Lendengegend; die verständliche anatomische Wiedergabe vermeidet eine Verwechslung mit ὀσφύς.
- source_word: πλευρὰν εἰς τὸ καθεύδειν
  choice: die Seite zum Schlafen
  rationale: πλευρά kann Seite oder Rippe bedeuten. „Seite“ erklärt die Zuordnung zum Schlafen am natürlichsten, ohne den unsicheren Text zu emendieren.
- source_word: ὀσφὺν εἰς ἰσχύν
  choice: die Hüfte für die Stärke
  rationale: Unterscheidet ὀσφύς von den zuvor genannten Lendenmuskeln; „Hüfte“ ist hier eine natürliche anatomische Näherung.
- source_word: καὶ τὰ ἑξῆς
  choice: und ebenso alles Weitere
  rationale: Natürliche deutsche Wiedergabe der pauschalen Fortsetzung „und was folgt/und so weiter“.
theological_decisions:
- issue: Gottes Schöpfung als „gut“ beziehungsweise „schön“ und geordnet
  choice: „alles in guter Ordnung geschaffen“
  alternative: „alles schön und der Reihe nach geschaffen“
  rationale: Die Formulierung bewahrt die positive Wertung und den Ordnungsgedanken, ohne daraus eine spezifische Schöpfungslehre abzuleiten.
- issue: Antike Zuordnung seelischer Eigenschaften zu Organen
  choice: Die Organ-Eigenschaft-Zuordnungen werden unverändert als Aussagen des Textes wiedergegeben.
  alternative: Sie medizinisch erklären, korrigieren oder metaphorisch umdeuten.
  rationale: Die Übersetzung soll die antike Anthropologie des Ausgangstextes sichtbar lassen und weder modernisieren noch theologisch harmonisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer rhythmischer Aufzählung. Antike anatomische Vorstellungen und auffällige psychologische Zuordnungen bleiben stehen. Textkritisch unsichere Stellen werden nicht stillschweigend geglättet, sondern knapp in Fußnoten kenntlich gemacht.
