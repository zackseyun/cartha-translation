  terminology: „Töpfer“, „Herr“, „Körper“, „im Guten“ und „ins Böse“ sind passend. Die abstrakten Wendungen zu Gutem und Bösem bewahren die semantische Offenheit des Griechischen. Die Fußnote soll die unsichere Konstruktion erläutern, ohne ein nicht belegtes „Gefäß“ in den Übersetzungstext einzutragen.
