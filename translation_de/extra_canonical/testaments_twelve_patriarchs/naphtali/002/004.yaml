base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/002/004.yaml
  text: And just as the potter knows the use of each one, as it is fit, so also the Lord knows the body, how long it will endure in good, and when it comes into evil.
translation:
  language: de
  text: 'Und wie der Töpfer den Gebrauch eines jeden kennt, wie er angemessen ist,[a] so kennt auch der Herr den Körper: wie lange er im Guten bestehen wird und wann er ins Böse gerät.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut ist an dieser Stelle unsicher und schwer verständlich; wörtlich etwa: »den Gebrauch eines jeden, wie er angemessen ist«. Ein Bezugswort zu »eines jeden« wird im Griechischen nicht ausdrücklich genannt.'
    reason: Die crux-markierte Lesart †ὡς ἱκανή und die fehlende ausdrückliche Benennung des Bezugsworts erfordern eine transparente textkritische Erläuterung, ohne „Gefäß“ in den Übersetzungstext einzufügen.
lexical_decisions:
- source_word: ὁ κεραμεύς
  choice: der Töpfer
  rationale: Direkte und natürliche Entsprechung des griechischen Berufsnamens.
- source_word: ἑνὸς ἑκάστου τὴν χρῆσιν
  choice: wozu ein jedes [Gefäß] taugt
  rationale: χρῆσις bezeichnet hier Verwendung bzw. Gebrauchszweck. Das im Griechischen ausgelassene Bezugswort wird aus dem Bild des Töpfers als »Gefäß« ergänzt und durch eckige Klammern kenntlich gemacht.
- source_word: ὡς ἱκανή
  choice: taugt
  rationale: Der griechische Wortlaut ist textkritisch unsicher und grammatisch schwierig. »taugt« gibt die Grundidee von Eignung bzw. Tauglichkeit knapp und idiomatisch wieder, ohne ein bestimmtes Maß hineinzulesen.
- source_word: τὸ σῶμα
  choice: den Körper
  rationale: Wörtliche Wiedergabe; »Körper« ist im modernen Deutsch hier natürlicher als »Leib«, ohne die Aussage theologisch umzudeuten.
- source_word: ἕως τίνος διαρκέσει
  choice: wie lange er … bestehen wird
  rationale: Gibt Dauer und Zukunftsbezug des griechischen Ausdrucks natürlich wieder.
- source_word: ἐν τῷ ἀγαθῷ
  choice: im Guten
  rationale: Bewahrt die substantivierte, semantisch offene Formulierung; möglich sind ein guter Zustand oder moralisches Gutsein.
- source_word: ἔρχεται ἐν κακῷ
  choice: ins Böse gerät
  rationale: Idiomatiches Deutsch für das Eintreten in einen bösen bzw. schlechten Zustand; die Mehrdeutigkeit zwischen moralischem Bösen und Unheil bleibt erhalten.
theological_decisions:
- issue: Gottes Wissen um den Körper und dessen Verhältnis zu Gut und Böse
  choice: Die Aussage wird als Wissen des Herrn wiedergegeben, ohne die Ursache oder Vorherbestimmung des Geschehens zu behaupten.
  alternative: Eine deterministische Formulierung wie »der Herr bestimmt, wie lange …«
  rationale: οἶδε bedeutet »weiß/kennt«, nicht »bestimmt«. Die im Text bestehende Spannung zwischen göttlichem Wissen und menschlich-körperlichem Verlauf darf nicht aufgelöst werden.
- issue: Bedeutung von »im Guten« und »ins Böse«
  choice: Die abstrakten Formulierungen werden beibehalten.
  alternative: Vereindeutigung als moralische Rechtschaffenheit und Sünde oder als Gesundheit und Krankheit
  rationale: Der griechische Text lässt beide Deutungsrichtungen offen; eine konfessionelle oder anthropologische Festlegung wäre nicht quellengerecht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das Töpferbild bleibt anschaulich; die eckige Ergänzung und die Fußnote legen die schwierige griechische Konstruktion offen. »Im Guten« und »ins Böse« bewahren die echte semantische und theologische Offenheit des Ausgangstextes.
