  rationale: Die Revision korrigiert vor allem die semantische Verschiebung in V. 5 und bewahrt in V. 8–9 die im Griechischen vorhandenen Bezüge und Pluralformen. Weitere kleinere Änderungen erhöhen die begriffliche Genauigkeit, ohne den Registercharakter oder die bewusst offene theologische Aussage des Ausgangstextes zu verändern. Die vollständige Fußnotenfolge bleibt strukturell konsistent; jeder Marker steht an der einschlägigen Textstelle.
