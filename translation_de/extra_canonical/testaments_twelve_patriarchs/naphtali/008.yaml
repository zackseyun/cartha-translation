  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008.yaml
  text: '1[a]. And behold, my children, I have shown you the times, that all these things will happen in Israel.

    2. And now, behold, command your children that they be united with Levi and with Judah. For through Judah salvation will arise for Israel, and in him Jacob will be blessed.

    3. Through his scepter God will appear on the earth, dwelling among men[b], to save the race of Israel, and he will gather the righteous from among the nations.

    4. Therefore, if you also do what is good, men and angels will bless you, and God will be glorified among the nations through you, and the devil will flee from you, and the wild beasts will fear you, and the Lord will love you, and the angels will stand by you.

    5. As when someone has reared a child well, he has a good remembrance of him, so also for a good work there is a good remembrance before God.

    6. But the one who does not do what is good, angels and men will curse him, and God will be dishonored among the nations through him, and the devil claims him as his own vessel, and every wild beast will lord it over him, and the Lord will hate him.

    7. For the commandments of the law are twofold, and they are fulfilled with skill.

    8. For there is a time for a man''s coming together with a woman, and a time for restraint for his prayer.

    9. And both are from God, and if they do not take place in their proper order, they bring very great sin upon men. The same is true also of the rest of the commandments.

    10. Therefore become wise in God, my children, and prudent, perceiving the order of his commandments and the ordinances of every matter[d][c], so that the Lord may love you.'
translation:
  language: de
  text: '**Das Testament Naftalis 8**


    **1.** Und seht, meine Kinder, ich habe euch die letzten Zeiten gezeigt: All dies wird in Israel geschehen.[a]


    **2.** Darum gebietet auch ihr euren Kindern, sich mit Levi und Juda zu vereinen. Denn durch Juda wird für Israel das Heil aufgehen, und in ihm wird Jakob gesegnet werden.[b]


    **3.** Durch sein Zepter wird Gott auf der Erde erscheinen, unter den Menschen wohnend,[c] um das Geschlecht Israels zu retten; und er wird die Gerechten aus den Völkern sammeln.


    **4.** Wenn also auch ihr das Gute tut, werden euch die Menschen und die Engel segnen. Gott wird durch euch unter den Völkern verherrlicht werden, der Teufel wird vor euch fliehen, die wilden Tiere werden euch fürchten, der Herr wird euch lieben, und die Engel werden euch beistehen.[d]


    **5.** Wie jemand, der ein Kind gut großzieht, eine gute Erinnerung an es hat, so gibt es auch für eine gute Tat bei Gott eine gute Erinnerung.


    **6.** Wer aber das Gute nicht tut, den werden die Engel und die Menschen verfluchen. Gott wird durch ihn unter den Völkern entehrt werden, der Teufel wird ihn als sein eigenes Gefäß in Besitz nehmen, jedes wilde Tier wird über ihn herrschen, und der Herr wird ihn hassen.


    **7.** Denn die Gebote des Gesetzes sind zweifach und werden mit Einsicht erfüllt.


    **8.** Es gibt eine Zeit für die Vereinigung mit einer Frau und eine Zeit der Enthaltsamkeit für sein Gebet.[e]


    **9.** Beides kommt von Gott; wenn beide jedoch nicht in ihrer richtigen Ordnung stattfinden, bringen sie sehr große Sünde über die Menschen. Dasselbe gilt auch für die übrigen Gebote.


    **10.** Werdet also weise in Gott, meine Kinder, und verständig. Erkennt die Ordnung seiner Gebote und die Bestimmungen jeder Angelegenheit, damit der Herr euch liebt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Verknüpfung der Satzteile ist im griechischen Text unsicher. Sie kann auch als Begründung verstanden werden: „Ich habe euch die letzten Zeiten gezeigt, weil all dies in Israel geschehen wird.“'
    reason: textual_variant
  - marker: b
    text: Die Aussagen „durch Juda“ und „durch sein Zepter“ verbinden königliche Bildsprache mit der Hoffnung auf Heil. Sie können messianisch verstanden werden; die Übersetzung legt jedoch keine engere Deutung fest, als der griechische Wortlaut verlangt.
    reason: cross_reference
  - marker: c
    text: Die Worte „unter den Menschen wohnend“ sind in der zugrunde gelegten griechischen Ausgabe textkritisch markiert. Die Übersetzung folgt dem vollständigeren überlieferten Wortlaut. Wörtlich ist neben „unter den Menschen“ auch „in den Menschen“ möglich.
    reason: textual_variant
  - marker: d
    text: Der letzte Satzteil, „und die Engel werden euch beistehen“, ist in der griechischen Ausgabe textkritisch markiert.
    reason: textual_variant
  - marker: e
    text: „Vereinigung mit einer Frau“ bezeichnet hier in zurückhaltender Sprache die geschlechtliche Gemeinschaft. „Enthaltsamkeit“ meint das Sichenthalten zur dafür bestimmten Zeit des eigenen Gebets.
    reason: cultural_note
lexical_decisions:
- source_word: καιροὺς ἐσχάτους
  choice: die letzten Zeiten
  rationale: Gibt sowohl καιρούς als bedeutsame Zeitabschnitte als auch das im griechischen Text vorhandene ἐσχάτους wieder; die eschatologische Färbung wird nicht abgeschwächt.
- source_word: ἑνοῦνται
  choice: sich ... vereinen
  rationale: Bewahrt den Aufruf zur engen Verbundenheit mit Levi und Juda, ohne die Art dieser Einheit über den Text hinaus festzulegen.
- source_word: σωτηρία
  choice: das Heil
  rationale: Erhält das theologische Gewicht des Ausdrucks und lässt zugleich die Bedeutung konkreter Rettung oder Befreiung offen.
- source_word: ἀνατελεῖ
  choice: wird ... aufgehen
  rationale: Bewahrt das Bild des Aufgehens oder Hervorsprossens, statt es zum bloßen Erscheinen zu verflachen.
- source_word: σκήπτρου
  choice: Zepter
  rationale: Erhält die konkrete königliche und dynastische Bildsprache.
- source_word: ὀφθήσεται
  choice: wird ... erscheinen
  rationale: Gibt den Offenbarungscharakter natürlich wieder, ohne eine spezifischere christologische Terminologie einzutragen.
- source_word: κατοικῶν ἐν ἀνθρώποις
  choice: unter den Menschen wohnend
  rationale: Im Zusammenhang bezeichnet die Wendung am natürlichsten Gottes Gegenwart unter den Menschen; die alternative räumliche Deutung „in den Menschen“ wird nicht dogmatisch ausgeschlossen.
- source_word: τὸ καλόν
  choice: das Gute
  rationale: Bewahrt die substantivische griechische Form und bezeichnet moralisch gutes Handeln.
- source_word: ἀνθέξονται ὑμῶν
  choice: werden euch beistehen
  rationale: Vermittelt das Festhalten an, Unterstützen oder Beistehen im schützenden Parallelismus des Verses.
- source_word: ἴδιον σκεῦος
  choice: sein eigenes Werkzeug
  rationale: „Werkzeug“ gibt die bildliche Funktion von σκεῦος hier im Deutschen verständlich wieder, ohne unnötig wörtlich „Gefäß“ zu setzen.
- source_word: διπλαῖ
  choice: haben zwei Seiten
  rationale: Bewahrt die Zweifachheit der Gebote, klingt im Deutschen aber natürlicher als „sind doppelt“ und passt zum folgenden Beispiel zweier situationsgemäßer Handlungsweisen.
- source_word: μετὰ τέχνης
  choice: mit Einsicht
  rationale: Gibt die geforderte kundige, situationsgerechte Anwendung wieder; „mit Kunstfertigkeit“ wäre im Deutschen missverständlich.
- source_word: συνουσίας γυναικός
  choice: Vereinigung mit einer Frau
  rationale: Ist eine würdevolle und verständliche Wiedergabe des Bezugs auf geschlechtliche Gemeinschaft, ohne eine im Griechischen nicht ausdrücklich genannte eheliche Qualifikation hinzuzufügen.
- source_word: ἐγκρατείας
  choice: Enthaltsamkeit
  rationale: Bezeichnet im unmittelbaren Gegensatz zur geschlechtlichen Vereinigung das zeitweilige Sichenthalten um des Gebets willen.
- source_word: θεσμοὺς παντὸς πράγματος
  choice: die Bestimmungen für jede Angelegenheit
  rationale: Drückt die geordneten Regeln oder Festsetzungen aus, die zu jeder Sache gehören, in natürlichem Deutsch.
theological_decisions:
- issue: Königliche und mögliche messianische Sprache über Juda in den Versen 2–3
  choice: Die Aussagen über Juda, sein Zepter, das aufgehende Heil und Gottes Erscheinen werden unmittelbar wiedergegeben.
  alternative: Die Stelle ausschließlich dynastisch-politisch deuten oder ihre mögliche messianische Tragweite durch eine abschwächende Paraphrase begrenzen.
  rationale: Der griechische Text verbindet Juda und sein Zepter ausdrücklich mit Heil, Gottes Erscheinen und der Sammlung Gerechter aus den Völkern. Die Übersetzung bewahrt diese Spannung, ohne sie auf eine einzige dogmatische Auslegung festzulegen.
- issue: κατοικῶν ἐν ἀνθρώποις in Vers 3
  choice: „unter den Menschen wohnend“ bleibt im Haupttext erhalten.
  alternative: „in den Menschen wohnend“ oder Auslassung der möglicherweise sekundären Wendung.
  rationale: „Unter den Menschen“ ist im Zusammenhang die natürlichste deutsche Lesart. Da die Wendung textkritisch markiert ist, wird ihre Überlieferungslage in einer Fußnote offengelegt, statt sie stillschweigend zu beseitigen.
- issue: Verhältnis von geschlechtlicher Gemeinschaft, Enthaltsamkeit und Gebet in den Versen 7–9
  choice: Beide Verhaltensweisen werden als von Gott herkommend und jeweils zu ihrer rechten Zeit geordnet dargestellt.
  alternative: Die Aussage zu einem allgemeinen Aufruf zur Mäßigung verallgemeinern oder eine nicht ausdrücklich genannte rituelle beziehungsweise konfessionelle Regel eintragen.
  rationale: Das konkrete Beispiel des griechischen Textes lehrt situationsgemäße Ordnung. Die Übersetzung wahrt dies, ohne ein umfassenderes System ehelicher oder asketischer Lehre daraus abzuleiten.
- issue: Aussage, dass der Herr den Übeltäter „hassen“ wird
  choice: Das starke μισήσει wird mit „wird ihn hassen“ wiedergegeben.
  alternative: Abschwächend „wird ihn verwerfen“ oder „wird ihm nicht wohlgesinnt sein“.
  rationale: Die Härte und theologische Spannung der Ausgangsaussage soll nicht aus harmonisierenden Gründen gemildert werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzgliederung. Traditionell verständliche theologische Begriffe wie „Heil“, „Zepter“ und „Völker“ bleiben erhalten. Archaismen werden vermieden; zugleich werden starke oder fremdartige Aussagen des griechischen Textes nicht geglättet. Sämtliche Fußnotenmarker [a]–[e] stehen an der jeweils einschlägigen Stelle im Haupttext.
