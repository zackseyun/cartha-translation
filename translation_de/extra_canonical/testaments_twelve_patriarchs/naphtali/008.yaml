revisions:
- from: '**Das Testament Naftalis 8**


    **1.** Und seht, meine Kinder, ich habe euch die letzten Zeiten gezeigt, in denen all dies in Israel geschehen wird.[a]


    **2.** So gebietet auch ihr euren Kindern, sich mit Levi und Juda zu vereinen. Denn durch Juda wird für Israel das Heil aufgehen, und in ihm wird Jakob gesegnet werden.[b]


    **3.** Durch sein Zepter wird Gott auf der Erde erscheinen, unter den Menschen wohnend,[c] um das Geschlecht Israels zu retten; und er wird die Gerechten aus den Völkern sammeln.


    **4.** Wenn also auch ihr das Gute tut, werden euch die Menschen und die Engel segnen. Gott wird durch euch unter den Völkern verherrlicht werden, der Teufel wird vor euch fliehen, die wilden Tiere werden euch fürchten, der Herr wird euch lieben, und die Engel werden euch beistehen.[d]


    **5.** Wie jemand, der ein Kind gut großzieht, in guter Erinnerung bleibt, so wird auch eine gute Tat bei Gott in guter Erinnerung bleiben.


    **6.** Wer aber das Gute nicht tut, den werden die Engel und die Menschen verfluchen. Gott wird durch ihn unter den Völkern entehrt werden, der Teufel wird ihn als sein eigenes Werkzeug beanspruchen, jedes wilde Tier wird über ihn herrschen, und der Herr wird ihn hassen.


    **7.** Denn die Gebote des Gesetzes haben zwei Seiten und werden mit Einsicht erfüllt.


    **8.** Es gibt eine Zeit für die Vereinigung mit einer Frau und eine Zeit der Enthaltsamkeit zum Gebet.[e]


    **9.** Beides kommt von Gott; geschieht es aber nicht in der jeweils richtigen Ordnung, bringt es schwerste Sünde über die Menschen. Dasselbe gilt auch für die übrigen Gebote.


    **10.** Werdet also weise in Gott, meine Kinder, und verständig. Erkennt die Ordnung seiner Gebote und die Bestimmungen für jede Angelegenheit, damit der Herr euch liebt.'
