source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 3. Ἔθνη πλανηθέντα *καὶ ἀφέντα Κύριον²⁰ ἠλλοίωσαν²¹ τὴν²² τάξιν αὐτῶν, καὶ *ὑπήκουσαν ξύλοις καὶ λίθοις²³, πνεύμασι²⁴ πλάνης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/003.yaml
  text: The nations, having gone astray and having forsaken the Lord, altered their order, and gave heed to wood and stone, to spirits of deceit.
translation:
  language: de
  text: Die Völker waren in die Irre geführt worden und hatten den Herrn verlassen; sie veränderten ihre Ordnung und gehorchten Holz und Stein, den Geistern des Irrtums.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθνη
  choice: die Völker
  rationale: Gibt den Plural natürlich und sachlich wieder; im Kontext sind die nichtisraelitischen Völker gemeint, ohne dass dies im Deutschen ausdrücklich ergänzt werden muss.
- source_word: πλανηθέντα
  choice: gingen in die Irre
  rationale: Bewahrt die Vorstellung des Abirrens und lässt offen, ob Selbsttäuschung oder äußere Verführung im Vordergrund steht.
- source_word: ἀφέντα
  choice: verließen
  rationale: Eine klare, gegenwärtige Wiedergabe von ἀφίημι im Sinn des Abwendens beziehungsweise Verlassens.
- source_word: ἠλλοίωσαν τὴν τάξιν αὐτῶν
  choice: sie veränderten ihre Ordnung
  rationale: Gibt die ungewöhnliche und möglicherweise bewusst mehrdeutige Wendung formal genug wieder, ohne sie als Lebensweise, Bestimmung oder Schöpfungsordnung auszudeuten.
- source_word: ὑπήκουσαν
  choice: gehorchten
  rationale: Entspricht dem starken Sinn von ὑπακούω besser als das schwächere „schenkten Gehör“ und erhält den Vorwurf fehlgeleiteter Unterordnung.
- source_word: ξύλοις καὶ λίθοις
  choice: Holz und Stein
  rationale: Bewahrt die konkrete, metonymische Bezeichnung materieller Götzenbilder, ohne „Götzen“ erklärend in den Haupttext einzufügen.
- source_word: πνεύμασι πλάνης
  choice: den Geistern des Irrtums
  rationale: Eine formal genaue Wiedergabe des Genitivs, die sowohl irreführende Geister als auch Geister, die dem Irrtum zugehören, anklingen lässt.
theological_decisions:
- issue: Beziehung zwischen „Holz und Stein“ und „Geistern des Irrtums“
  choice: 'Beide Dativgruppen werden nebeneinandergestellt: „Holz und Stein, den Geistern des Irrtums“.'
  alternative: „Holz und Stein, nämlich Geistern der Täuschung“ oder „Holz und Stein sowie Geistern des Irrtums“.
  rationale: Der griechische Text lässt die syntaktische Beziehung ohne ausdrückliche Konjunktion offen. Die Übersetzung bewahrt diese Spannung und legt weder eine Gleichsetzung noch zwei völlig getrennte Objekte fest.
- issue: Deutung von τάξις
  choice: „Ordnung“
  alternative: „Lebensordnung“, „Bestimmung“ oder „Wesensart“
  rationale: „Ordnung“ hält das Bedeutungsspektrum offen und vermeidet eine konfessionell oder anthropologisch überbestimmte Auslegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Syntax. Das Semikolon gliedert die Partizipien und die anschließenden finiten Verben natürlich. Keine Fußnoten erforderlich.
