  source_fidelity: Die Wiedergabe trifft die zentralen Begriffe und die offene Bedeutung von „ihrer Ordnung“ (τὴν τάξιν αὐτῶν) gut. Das Partizip πλανηθέντα ist jedoch passiv und sollte nicht aktiv als „gingen in die Irre“ wiedergegeben werden, sondern als „waren in die Irre geführt worden“ bzw. „waren irregeführt worden“.
  naturalness: Der Satz ist in modernem, würdigem Standarddeutsch flüssig. „Holz und Stein“ ist als traditionssprachliche, zugleich verständliche Sammelbezeichnung natürlich.
  terminology: „Herr“, „Ordnung“, „Holz und Stein“ und „Geister des Irrtums“ sind sachgerecht. Die Reihung der beiden Dativgruppen nach „gehorchten“ bewahrt die im griechischen Text nicht näher erklärte Beziehung zwischen materiellen Kultobjekten und irreführenden Geistern.
  issues:
  - severity: medium
    issue: Das passive πλανηθέντα wird aktiv wiedergegeben.
