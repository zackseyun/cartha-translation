base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/005.yaml
  text: In the same way also the Watchers changed the order of their nature, whom the Lord cursed at the time of the flood, because of whom he made the earth uninhabited and fruitless.
translation:
  language: de
  text: Ebenso veränderten auch die Wächter die Ordnung ihrer Natur, die der Herr zur Zeit der Sintflut verfluchte und derentwegen er die Erde unbewohnt und unfruchtbar machte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut am Versende ist unsicher: Nach „derentwegen“ folgt eine syntaktisch schwierige Formulierung mit κατοικησία („Bewohnung, Besiedlung“); einige Ausgaben setzen zudem ἀοίκητον („unbewohnt“) in Klammern. Die Übersetzung gibt den wahrscheinlich gemeinten Sinn wieder.'
    reason: Kennzeichnet die textkritische und syntaktische Schwierigkeit präzise, ohne die gewählte Wiedergabe als bloße Paraphrase darzustellen.
lexical_decisions:
- source_word: οἱ Ἐγρήγοροι
  choice: die Wächter
  rationale: Die etablierte sachliche Wiedergabe der Bezeichnung für die übernatürlichen »Wächter«; sie bewahrt den Bezug zur jüdischen Wächtertradition.
- source_word: ἐνήλλαξαν τάξιν φύσεως αὐτῶν
  choice: veränderten die Ordnung ihrer Natur
  rationale: Nahe Wiedergabe der griechischen Wendung, ohne genauer festzulegen, worin die Veränderung bestand.
- source_word: ἐπὶ τοῦ κατακλυσμοῦ
  choice: zur Zeit der Sintflut
  rationale: κατακλυσμός bezeichnet hier aufgrund des traditionsgeschichtlichen Zusammenhangs die große Flut; »Sintflut« ist im Deutschen die klare und geläufige Bezeichnung.
- source_word: ἀπὸ κατοικησίας ... ἀοίκητον
  choice: unbewohnt
  rationale: Die Überlieferung ist an dieser Stelle textlich gestört. »Unbewohnt« folgt der verständlichen Lesart ἀοίκητον und dem Sinn des überlieferten Ausdrucks mit κατοικησία.
- source_word: ἄκαρπον
  choice: unfruchtbar
  rationale: Gibt die fehlende Ertrags- bzw. Fruchtfähigkeit der Erde natürlich und präzise wieder.
theological_decisions:
- issue: Identität und Vergehen der Wächter
  choice: Die Bezeichnung »Wächter« und die offene Formulierung »Ordnung ihrer Natur« werden beibehalten.
  alternative: Die Wächter ausdrücklich als Engel bezeichnen und ihr Vergehen näher erklären.
  rationale: Der griechische Text selbst liefert in diesem Vers weder die ausdrückliche Gleichsetzung noch eine nähere Erklärung; eine Ausdeutung würde zusätzliche Tradition in die Übersetzung eintragen.
- issue: Syntax der Fluchsaussage
  choice: Der Relativsatz wird zur besseren deutschen Lesbarkeit als selbstständiger Satz wiedergegeben.
  alternative: »… die Wächter …, die der Herr zur Zeit der Sintflut verfluchte und derentwegen …«
  rationale: Der inhaltliche Bezug bleibt unverändert, während die komplexe griechische Satzfügung in natürlichem modernem Deutsch klarer wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die traditionsgebundene Bezeichnung »Wächter« bleibt erhalten; die ungewöhnliche Wendung »Ordnung ihrer Natur« bewahrt bewusst die Offenheit des griechischen Textes.
