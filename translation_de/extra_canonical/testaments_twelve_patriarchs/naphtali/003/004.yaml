revisions:
- from: Ihr aber, meine Kinder, sollt nicht so sein. Erkennt vielmehr am Himmelsgewölbe, auf der Erde und im Meer und an allen Geschöpfen den Herrn, der alles geschaffen hat, damit ihr nicht wie Sodom werdet, das die Ordnung seiner Natur veränderte.
  to: Ihr aber, meine Kinder, sollt nicht so sein, sondern am Himmelsgewölbe, auf der Erde, im Meer und an allem Geschaffenen den Herrn erkennen, der alles geschaffen hat, damit ihr nicht wie Sodom werdet, das die Ordnung seiner Natur veränderte.
  rationale: Die Revision entfernt die geringfügige Zusatznuance von „vielmehr“, fasst δημιουργήματα weiter und erhält zugleich den partizipial-imperativischen Sinn in idiomatischem modernen Deutsch. Die schwierige Aussage über Sodom wird weder abgeschwächt noch dogmatisch oder ethisch über den Wortlaut hinaus gedeutet.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:21:01Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die wesentlichen Elemente zuverlässig wieder: die Anrede, die Warnung, das Erkennen des Schöpfers in der gesamten geschaffenen Welt und den Vergleich mit Sodom. Die imperativische Wiedergabe von γινώσκοντες ist als deutschsprachige Entfaltung des partizipialen Anschlusses vertretbar. „Vielmehr“ ist jedoch nicht ausdrücklich im griechischen Text vorhanden und sollte durch einen schlichten, aus μὴ οὕτως hervorgehenden Gegensatz ersetzt werden. Außerdem ist „an allem Geschaffenen“ umfassender als „an allen Geschöpfen“ und trifft δημιουργήμασι besser.'
  naturalness: Die überarbeitete Fassung bleibt würdig und modern. „Am Himmelsgewölbe ... an allem Geschaffenen“ bezeichnet im Deutschen natürlich das Erkennen des Schöpfers anhand bzw. in seiner Schöpfung. Der Satz wird nicht unnötig aufgespalten und bleibt gut verständlich.
  terminology: „Himmelsgewölbe“ gibt στερέωμα angemessen als antiken kosmologischen Ausdruck wieder. „Herr“ für Κύριος und „alles geschaffen“ für τὸν ποιήσαντα πάντα sind sachgerecht. „Die Ordnung seiner Natur“ bewahrt die bewusst nicht weiter ausgelegte, im griechischen Ausdruck liegende Spannung von τάξις φύσεως αὐτῆς. Das neutrale Relativpronomen bei „Sodom“ entspricht dem deutschen Städtenamen und legt den Bezug nicht zusätzlich aus.
  issues:
  - severity: low
    issue: „vielmehr“ ist eine nicht ausdrücklich markierte kontrastierende Ergänzung.
    rationale: Der Gegensatz ist in μὴ οὕτως bereits enthalten. „Sondern“ verbindet die negative Aufforderung und die anschließende positive Ermahnung im Deutschen unmittelbar, ohne einen zusätzlichen Diskursmarker einzutragen.
  - severity: low
    issue: „an allen Geschöpfen“ kann δημιουργήματα zu eng auf Lebewesen beziehen.
    rationale: Das griechische Wort umfasst geschaffene Dinge bzw. Werke allgemein. „An allem Geschaffenen“ erhält diesen umfassenden Bezug.
  revised_text: Ihr aber, meine Kinder, sollt nicht so sein, sondern am Himmelsgewölbe, auf der Erde, im Meer und an allem Geschaffenen den Herrn erkennen, der alles geschaffen hat, damit ihr nicht wie Sodom werdet, das die Ordnung seiner Natur veränderte.
