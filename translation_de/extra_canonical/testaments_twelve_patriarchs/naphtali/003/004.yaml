base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/004.yaml
  text: But you, my children, must not be so, knowing in the firmament, on the earth, and in the sea, and in all created things, the Lord who made all things, so that you may not become like Sodom, which changed the order of its nature.
translation:
  language: de
  text: Ihr aber, meine Kinder, sollt nicht so sein, sondern am Himmelsgewölbe, auf der Erde, im Meer und an allem Geschaffenen den Herrn erkennen, der alles geschaffen hat, damit ihr nicht wie Sodom werdet, das die Ordnung seiner Natur veränderte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: στερέωμα
  choice: Himmelsgewölbe
  rationale: Gibt den antiken kosmologischen Ausdruck konkreter und quellennäher wieder als das heute anders besetzte „Firmament“.
- source_word: δημιουργήματα
  choice: Geschöpfe
  rationale: Bezeichnet natürlich und prägnant alle geschaffenen Dinge und bewahrt den Bezug zum Schöpfer.
- source_word: τάξιν φύσεως αὐτῆς
  choice: die Ordnung seiner Natur
  rationale: Bewahrt die wörtliche Verbindung von τάξις und φύσις sowie die im Griechischen bestehende Deutungsspannung, ohne sie näher zu bestimmen.
theological_decisions:
- issue: Bezug und Sinn von Sodoms Veränderung der natürlichen Ordnung
  choice: das die Ordnung seiner Natur veränderte
  alternative: das seine natürliche Ordnung verkehrte
  rationale: Die gewählte Fassung bleibt nahe am griechischen Wortlaut und vermeidet eine konfessionelle oder sexualethische Ausdeutung, die der Vers selbst nicht ausdrücklich formuliert.
- issue: Syntax von γινώσκοντες
  choice: Erkennt vielmehr
  alternative: indem ihr ... erkennt / da ihr ... kennt
  rationale: Das griechische Partizip ist syntaktisch mehrdeutig. Für verständliches Deutsch wird es als Aufforderung wiedergegeben; „vielmehr“ markiert den Gegensatz, ohne zusätzliche Sachinformation einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange griechische Satzperiode wird zur Lesbarkeit in zwei Sätze gegliedert. „Sodom“ wird wegen des grammatischen Neutrums von „Sodom“ im Deutschen mit „das“ aufgenommen.
