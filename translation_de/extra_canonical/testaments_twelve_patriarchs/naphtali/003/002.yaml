review_pass:
  verdict: revise
  source_fidelity: Die Gegenüberstellung von der beständigen Himmelsordnung und der Mahnung, Gottes Gesetz nicht zu verändern, gibt den Sinn der unmittelbaren Parallele mit ἀλλοιώσητε und die englische POB-Auditfassung zutreffend wieder. Allerdings ist das Verb im ersten Satz in der vorgelegten griechischen Edition mit einem Dagger als textlich problematisch markiert; diese Unsicherheit muss an der betreffenden Stelle kenntlich gemacht werden.
  naturalness: Der Entwurf ist modernes, würdiges Deutsch. „Durch ungeordnete Taten“ ist verständlich, fasst ἐν ἀταξίᾳ τῶν πράξεων ὑμῶν jedoch etwas freier als Mittel auf. „In der Unordnung eures Handelns“ bewahrt die Präposition und das abstrakte Verhältnis genauer, bleibt dabei gut lesbar.
  terminology: „Ordnung“ für τάξις und „Gesetz Gottes“ für νόμος Θεοῦ sind passend. „Verändern“ bewahrt die auffällige, aber im Griechischen ausdrücklich vorhandene Verbindung von ἀλλοιόω mit dem Gesetz. Eine Fußnote zur verderbten bzw. unsicheren Lesung im ersten Satz verhindert, dass die kontextuelle Wiedergabe als unbestrittene Lesung erscheint.
  issues:
  - severity: medium
    issue: Die mit † markierte, textlich unsichere griechische Verbform im ersten Satz bleibt unkommentiert.
    rationale: Die Edition signalisiert an dieser Stelle eine Verderbnis oder erhebliche Textunsicherheit. Die Übersetzung „verändern ihre Ordnung nicht“ folgt sinnvoll der Parallelität und dem englischen Audit trail, sollte aber als kontextuelle Wiedergabe ausgewiesen werden.
  - severity: low
    issue: „durch ungeordnete Taten“ ist gegenüber ἐν ἀταξίᾳ τῶν πράξεων ὑμῶν leicht interpretierend.
    rationale: Die Formulierung macht die Unordnung primär zum Mittel. „In der Unordnung eures Handelns“ bildet die griechische Präpositionalphrase enger ab, ohne die schwierige Aussage über das Verändern des Gesetzes zu glätten.
  revised_text: Die Sonne, der Mond und die Sterne verändern ihre Ordnung nicht[a]. Ebenso sollt auch ihr das Gesetz Gottes nicht in der Unordnung eures Handelns verändern.
  revised_footnotes:
  - marker: a
    text: Die überlieferte griechische Verbform ist an dieser Stelle textlich unsicher (†). Die Wiedergabe „verändern ihre Ordnung nicht“ folgt dem Zusammenhang und der anschließenden Mahnung.
    reason: Kennzeichnet die von der kritischen Edition selbst signalisierte Textunsicherheit, ohne eine bestimmte Emendation als gesichert auszugeben.
  revision_rationale: Die Revision ergänzt die erforderliche Kennzeichnung der textkritisch unsicheren Stelle und fasst die abschließende Präpositionalphrase enger am Griechischen. Die zentrale, absichtlich ungeglättete Aussage, dass Gottes Gesetz nicht „verändert“ werden soll, bleibt erhalten.
