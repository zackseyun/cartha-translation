base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/002.yaml
  text: The sun and the moon and the stars do not alter their order; so you also must not alter the law of God through the disorder of your deeds.
translation:
  language: de
  text: Die Sonne, der Mond und die Sterne verändern ihre Ordnung nicht. Ebenso sollt auch ihr das Gesetz Gottes nicht durch ungeordnete Taten verändern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τάξιν
  choice: Ordnung
  rationale: Gibt die geordnete Stellung beziehungsweise Bahn der Himmelskörper wieder, ohne das im Griechischen nicht ausdrücklich enthaltene »bestimmt« oder »festgesetzt« hinzuzufügen.
- source_word: μὴ ἀλλοιώσητε
  choice: sollt … nicht verändern
  rationale: Bewahrt die direkte Ermahnung und die Grundbedeutung »verändern, anders machen«.
- source_word: ἐν ἀταξίᾳ τῶν πράξεων ὑμῶν
  choice: durch ungeordnete Taten
  rationale: Gibt ἀταξία als mangelnde Ordnung im Handeln idiomatisch wieder; »durch« bezeichnet hier das Mittel beziehungsweise die Art, in der das Gesetz verändert würde.
theological_decisions:
- issue: Verhältnis zwischen Gottes Gesetz und menschlichem Fehlverhalten
  choice: »das Gesetz Gottes nicht durch ungeordnete Taten verändern«
  alternative: »vom Gesetz Gottes nicht durch die Unordnung eurer Taten abweichen«
  rationale: Der griechische Text verbindet ἀλλοιόω unmittelbar mit νόμον Θεοῦ; daher bleibt das Gesetz grammatisch das Objekt des Veränderns. Eine Umdeutung zu einem bloßen Abweichen vom Gesetz würde die Aussage glätten und ihre Spannung beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelität zwischen der unveränderten Ordnung der Himmelskörper und dem geordneten menschlichen Handeln bleibt klar; die ungewöhnliche Formulierung vom »Verändern« des Gesetzes wird quellentreu bewahrt.
