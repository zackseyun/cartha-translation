review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung trifft den Sinn des griechischen Textes insgesamt gut, einschließlich der Gegenüberstellung von Gottes und Beliars Willen. Die Wiedergabe von σιωπῶντες als „wenn ihr … schweigt“ fügt jedoch eine ausdrückliche Bedingung ein, die das griechische Partizip in Verbindung mit ὅτι nicht zwingend enthält. Die modale/instrumentale Beziehung sollte ohne konditionale Zuspitzung wiedergegeben werden.
  naturalness: Mit „indem ihr in Reinheit des Herzens schweigt“ ist der Satz im modernen Standarddeutsch klar und gut lesbar. „Euer Handeln“ ist in diesem Zusammenhang etwas idiomatischer als „eure Taten“, ohne den Sinn von πράξεις einzuengen.
  terminology: „Habgier“, „leere Worte“, „Seelen“, „Reinheit des Herzens“, „Wille Gottes“ und „Beliar“ sind angemessen. Die griechische Namensform Beliar ist beizubehalten. Es sind keine Fußnoten erforderlich; die im Quellentext sichtbaren Ziffern sind ohne überlieferte Fußnoteninhalt nicht sinnvoll als Zieltextanker reproduzierbar.
  issues:
  - severity: medium
    issue: Konditionale Wiedergabe von σιωπῶντες
    rationale: „Denn wenn ihr … schweigt“ macht aus dem Partizip eine explizite Wenn-Bedingung. Der Text sagt vielmehr mit ὅτι und dem Partizip, dass das Schweigen in Herzensreinheit die begleitende beziehungsweise instrumentale Weise des Verstehens ist. „Indem“ bewahrt diese Offenheit besser.
  - severity: low
    issue: „eure Taten“ in Verbindung mit „verderben“
    rationale: Die Formulierung ist verständlich, aber „euer Handeln zu verderben“ klingt im Deutschen natürlicher und deckt πράξεις als Verhalten bzw. Handlungsweise passend ab.
  revised_text: Darum bemüht euch nicht darum, in Habgier euer Handeln zu verderben oder durch leere Worte eure Seelen zu täuschen; denn indem ihr in Reinheit des Herzens schweigt, werdet ihr verstehen, am Willen Gottes festzuhalten und den Willen Beliars zu verwerfen.
