source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: III. Μὴ οὖν σπουδάζετε¹ *ἐν πλεονεξίᾳ² *διαφθεῖραι τὰς πράξεις ὑμῶν³, ἢ ἐν *λόγοις κενοῖς ἀπατᾶν⁴ τὰς ψυχὰς ὑμῶν, ὅτι⁵ σιωπῶντες⁶ ἐν *καθαρότητι καρδίας⁷ συνήσετε⁸ τὸ θέλημα τοῦ Θεοῦ⁹ κρατεῖν¹⁰, καὶ ἀπορρίπτειν τὸ θέλημα τοῦ Βελίαρ¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/003/001.yaml
  text: Therefore, do not be eager in greed to corrupt your deeds, or by empty words to deceive your souls, because by keeping silent in purity of heart you will understand to hold fast the will of God and to cast away the will of Beliar.
translation:
  language: de
  text: Darum bemüht euch nicht darum, in Habgier euer Handeln zu verderben oder durch leere Worte eure Seelen zu täuschen; denn indem ihr in Reinheit des Herzens schweigt, werdet ihr verstehen, am Willen Gottes festzuhalten und den Willen Beliars zu verwerfen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπουδάζετε
  choice: bemüht euch
  rationale: Gibt den Imperativ mit dem Sinn von Eifer und zielgerichtetem Streben wieder, ohne im Deutschen unnatürlich zu klingen.
- source_word: ἐν πλεονεξίᾳ
  choice: aus Habgier
  rationale: πλεονεξία bezeichnet das gierige Verlangen nach mehr; die kausale deutsche Wendung passt hier natürlich zum Zusammenhang.
- source_word: διαφθεῖραι τὰς πράξεις ὑμῶν
  choice: eure Taten zu verderben
  rationale: Bewahrt das konkrete πράξεις als »Taten« und die starke Bedeutung von διαφθείρω als moralisches Verderben.
- source_word: λόγοις κενοῖς
  choice: durch leere Worte
  rationale: Eine direkte und idiomatische Wiedergabe des instrumentalen Dativs und der inhaltslosen oder nichtigen Rede.
- source_word: ἀπατᾶν τὰς ψυχὰς ὑμῶν
  choice: eure Seelen zu täuschen
  rationale: Folgt der anthropologischen Ausdrucksweise des griechischen Textes, statt sie auf »euch selbst« einzuebnen.
- source_word: σιωπῶντες
  choice: wenn ihr … schweigt
  rationale: Das adverbiale Präsenspartizip wird als begleitender beziehungsweise vorausgesetzter Umstand verständlich wiedergegeben; seine genaue logische Nuance bleibt kontextabhängig.
- source_word: ἐν καθαρότητι καρδίας
  choice: in Reinheit des Herzens
  rationale: Formnahe und würdige Wiedergabe, die den inneren, moralischen Bezug bewahrt.
- source_word: συνήσετε
  choice: werdet ihr verstehen
  rationale: Gibt den Futur von συνίημι unmittelbar wieder.
- source_word: κρατεῖν
  choice: festzuhalten
  rationale: Drückt das kraftvolle Ergreifen und Bewahren aus, das κρατέω hier nahelegt.
- source_word: ἀπορρίπτειν
  choice: zu verwerfen
  rationale: Gibt das entschiedene Wegwerfen oder Ablehnen des Willens Beliars prägnant wieder.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Bewahrt die griechische Namensform der gegnerischen Macht.
theological_decisions:
- issue: Verhältnis von Schweigen, Herzensreinheit und Erkenntnis des göttlichen Willens
  choice: »wenn ihr in Reinheit des Herzens schweigt, werdet ihr verstehen«
  alternative: »indem ihr in Reinheit des Herzens schweigt, werdet ihr verstehen«
  rationale: Das Partizip σιωπῶντες kann modal oder konditional verstanden werden. Die gewählte Form macht keine verdienstliche Kausalität geltend und lässt das Schweigen als vorausgesetzte Haltung erscheinen.
- issue: Die zwei einander entgegengesetzten Willen
  choice: »am Willen Gottes festzuhalten und den Willen Beliars zu verwerfen«
  alternative: »den Willen Gottes zu behaupten und den Willen Beliars abzulegen«
  rationale: Die Parallelität wird bewahrt, ohne die Aussage in ein ausgearbeitetes dualistisches Lehrsystem umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an Syntax und Bildwelt des griechischen Textes. Die etwas markante Wendung »eure Seelen täuschen« bleibt bewusst erhalten. Keine Fußnoten erforderlich.
