- from: Darum bemüht euch nicht, aus Habgier eure Taten zu verderben oder durch leere Worte eure Seelen zu täuschen. Denn wenn ihr in Reinheit des Herzens schweigt, werdet ihr verstehen, am Willen Gottes festzuhalten und den Willen Beliars zu verwerfen.
  to: Darum bemüht euch nicht darum, in Habgier euer Handeln zu verderben oder durch leere Worte eure Seelen zu täuschen; denn indem ihr in Reinheit des Herzens schweigt, werdet ihr verstehen, am Willen Gottes festzuhalten und den Willen Beliars zu verwerfen.
  rationale: Die Revision beseitigt die nicht im griechischen Text ausdrücklich angelegte Konditionalität und gibt das Partizip σιωπῶντες modal/instrumental wieder. Im Übrigen werden Satzführung, die anthropologische Rede von den „Seelen“ und die begriffliche Parallelität der beiden Willen beibehalten.
