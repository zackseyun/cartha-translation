  text: And in the morning, after he awoke, he said to them, “I am dying”; but they did not believe him.
translation:
  language: de
  text: 'Und am Morgen, nachdem er aufgewacht war, sagte er zu ihnen: »Ich sterbe.« Und sie glaubten ihm nicht.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πρωί
  choice: am Morgen
  rationale: Die natürliche deutsche Zeitangabe gibt den griechischen Ausdruck genau wieder.
- source_word: μετὰ τὸ ἐξυπνισθῆναι αὐτόν
  choice: nachdem er aufgewacht war
  rationale: Die temporale Konstruktion und das Subjekt des Infinitivs werden in idiomatischem Deutsch ausdrücklich wiedergegeben.
- source_word: Ἀποθνήσκω
  choice: Ich sterbe
  rationale: Das griechische Präsens wird unmittelbar und ohne erklärende Zusätze wiedergegeben.
- source_word: οὐκ ἐπίστευσαν αὐτῷ
  choice: sie glaubten ihm nicht
  rationale: πιστεύω mit Dativ bezeichnet hier, jemandes Aussage Glauben zu schenken.
