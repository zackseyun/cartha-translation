  text: 2. Συνελθόντων⁸ τῶν υἱῶν αὐτοῦ⁹ ἐν τῷ¹⁰ ἑβδόμῳ μηνί, μιᾷ¹¹ τοῦ μηνός¹², ἐποίησε δεῖπνον αὐτοῖς¹³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/002.yaml
  text: When his sons had gathered together in the seventh month, on the first day of the month, he made a feast for them.
translation:
  language: de
  text: Als seine Söhne im siebten Monat, am ersten Tag des Monats, zusammengekommen waren, richtete er für sie ein Mahl aus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Συνελθόντων
  choice: als … zusammengekommen waren
  rationale: Der Genitivus absolutus bezeichnet den zeitlichen Umstand; die deutsche Vorzeitigkeit gibt das Verhältnis zur Haupthandlung natürlich wieder.
- source_word: ἐν τῷ ἑβδόμῳ μηνί
  choice: im siebten Monat
  rationale: Formnahe und im Deutschen natürliche Wiedergabe der Zeitangabe.
- source_word: μιᾷ τοῦ μηνός
  choice: am ersten Tag des Monats
  rationale: Die griechische Datumsformel bedeutet den ersten Tag des betreffenden Monats.
- source_word: ἐποίησε δεῖπνον αὐτοῖς
  choice: bereitete er ihnen ein Festmahl
  rationale: ποιεῖν mit δεῖπνον meint hier das Ausrichten bzw. Bereiten eines Mahls; „Festmahl“ entspricht dem Anlass besser als das im heutigen Deutsch oft alltägliche „Abendessen“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die zeitliche Reihenfolge und beide Monatsangaben des griechischen Textes bleiben erhalten.
