source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 4. Καὶ²⁰ *δοξάζων τὸν²¹ Κύριον²² *ἐκραταιώθη καὶ εἶπεν²³, ὅτι Μετὰ τὸ δεῖπνον τὸ χθὲς *ἀπέθανεν ἡ σάρξ μου²⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/004.yaml
  text: And while blessing and glorifying the Lord, he grew strong and said, “After yesterday’s meal, my flesh died.”
translation:
  language: de
  text: 'Und während er den Herrn verherrlichte, gewann er Kraft und sagte: »Nach dem gestrigen Abendessen starb mein Fleisch.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοξάζων
  choice: während er … verherrlichte
  rationale: Gibt das durative Partizip natürlich wieder; der griechische Text nennt hier nur das Verherrlichen, nicht zusätzlich ein Segnen.
- source_word: ἐκραταιώθη
  choice: gewann er Kraft
  rationale: Drückt das Erstarken idiomatisch aus, ohne ausdrücklich festzulegen, ob körperliche oder innere Kraft gemeint ist.
- source_word: δεῖπνον
  choice: Abendessen
  rationale: Entspricht der gewöhnlichen Bedeutung von δεῖπνον und vermeidet das stärkere, hier nicht erforderliche »Festmahl«.
- source_word: ἡ σάρξ μου
  choice: mein Fleisch
  rationale: Bewahrt die konkrete und möglicherweise theologisch bedeutsame Ausdrucksweise des Originals, statt sie als »mein Körper« auszudeuten.
- source_word: ἀπέθανεν
  choice: starb
  rationale: Gibt das einfache Verb für Sterben direkt wieder, ohne Zusätze wie »versagte«.
theological_decisions:
- issue: Bedeutung von »mein Fleisch starb«
  choice: Die wörtliche Spannung bleibt stehen.
  alternative: »Mein Körper versagte« oder »ich war dem Tod nahe«
  rationale: Der griechische Wortlaut formuliert ungewöhnlich und unterscheidet möglicherweise zwischen Person und Fleisch; eine glättende Deutung würde diese Ambiguität beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt eng am griechischen Ablauf, klingt jedoch natürlich; die auffällige Wendung »mein Fleisch starb« wird bewusst nicht geglättet.
