id: T12P.NAP.1.8
reference: Testament of Naphtali 1:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 8. Ὅθεν καὶ ὅμοιός μου⁴⁶ ἦν Γκατὰ πάντα¹⁴⁷ Ἰωσὴφ⁴⁸ κατὰ τὰς †εὐλογίας⁴⁹ Ῥαχιήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/008.yaml
  text: Therefore Joseph also was like me in every way, according to the prayers of Rachel.
translation:
  language: de
  text: Daher war auch Josef mir in jeder Hinsicht ähnlich, entsprechend den Gebeten Rahels.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Andere Lesart: »entsprechend den Segnungen Rahels«.'
    reason: Dokumentiert die textkritische Spannung zwischen εὐχάς (Gebete) und εὐλογίας (Segnungen).
lexical_decisions:
- source_word: Ὅθεν
  choice: Daher
  rationale: Gibt die folgernde Bedeutung knapp und natürlich wieder.
- source_word: ὅμοιός μου ἦν
  choice: war mir … ähnlich
  rationale: Bewahrt den ausdrücklichen Vergleich mit dem Sprecher und entspricht der griechischen Konstruktion.
- source_word: κατὰ πάντα
  choice: in jeder Hinsicht
  rationale: Idiomatiche Wiedergabe von »in allem«, ohne unnötig eine völlige Identität auszudrücken.
- source_word: κατὰ τὰς †εὐλογίας / εὐχάς
  choice: entsprechend den Gebeten
  rationale: Folgt der im Apparat bezeugten Lesart εὐχάς und der revidierten Konsultationsfassung; der überlieferte Drucktext εὐλογίας bleibt in einer Fußnote sichtbar.
theological_decisions:
- issue: Textkritische Alternative zwischen »Segnungen« und »Gebeten«
  choice: Gebeten
  alternative: Segnungen
  rationale: Die apparatgestützte Lesart εὐχάς passt syntaktisch und sachlich zu Rahel als betender Person; wegen der im edierten Text sichtbaren Lesart εὐλογίας wird die Alternative nicht verschwiegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist nah am griechischen Satzbau, bleibt aber für heutige Leser natürlich verständlich.
