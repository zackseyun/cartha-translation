source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: Διαθήκη Νεφθαλεὶμ τοῦ ὀγδόου υἱοῦ Ἰακὼβ καὶ Βάλλας¹. I. Ἀντίγραφον διαθήκης Νεφθαλείμ ἧς² διέθετο³ ἐν καιρῷ ⸀τῆς ἐξόδου⁴ αὐτοῦ ἐν ἔτει *ἑκατοστῷ καὶ τριακοστῷ⁵ τῆς⁶ ζωῆς αὐτοῦ⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/001.yaml
  text: A copy of the testament of Naphtali, the eighth son of Jacob, which he ordained at the time of his departure, in the hundred and thirtieth year of his life.
translation:
  language: de
  text: Eine Abschrift des Testaments Naftalis, des achten Sohnes Jakobs und Bilhas, das er zur Zeit seines Weggangs im hundertdreißigsten Jahr seines Lebens errichtete.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀντίγραφον
  choice: Abschrift
  rationale: Gibt die Bedeutung einer angefertigten Kopie bzw. Niederschrift knapp und sachlich wieder.
- source_word: διαθήκης
  choice: Testaments
  rationale: Im literarischen und sachlichen Zusammenhang bezeichnet das Wort eine testamentarische Verfügung; „Testament“ wahrt zugleich den Werktitelcharakter.
- source_word: διέθετο
  choice: errichtete
  rationale: „Ein Testament errichten“ ist im Deutschen eine natürliche, würdige und sachlich genaue Verbindung, ohne dem Verb eine besondere kirchliche Bedeutung aufzuerlegen.
- source_word: ἐν καιρῷ τῆς ἐξόδου αὐτοῦ
  choice: zur Zeit seines Weggangs
  rationale: „Weggang“ bewahrt die mögliche Spannung zwischen gewöhnlichem Fortgehen und einem verhüllenden Hinweis auf den Tod, statt die Stelle eindeutig als Sterben auszulegen.
- source_word: ἐν ἔτει ἑκατοστῷ καὶ τριακοστῷ τῆς ζωῆς αὐτοῦ
  choice: im hundertdreißigsten Jahr seines Lebens
  rationale: Folgt der griechischen Altersangabe eng und klingt in modernem Standarddeutsch natürlich.
theological_decisions:
- issue: Bedeutung von ἔξοδος
  choice: Weggang
  alternative: Tod / Heimgang
  rationale: Der griechische Ausdruck kann im Kontext ein Euphemismus für den Tod sein, benennt ihn aber nicht ausdrücklich. Die Übersetzung lässt diese Mehrdeutigkeit bestehen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit klarer Satzführung. Die rechtssprachlich etablierte Wendung „ein Testament errichten“ vermeidet sowohl Archaismus als auch konfessionelle Färbung.
