  verdict: revise
  source_fidelity: Die Übersetzung gibt ἀντίγραφον, διαθήκη, διέθετο, ἔξοδος und die Altersangabe insgesamt treffend wieder. Im überlieferten griechischen Titel fehlt jedoch Βάλλας („Bilha“), obwohl Naphtali ausdrücklich als achter Sohn Jakobs und Bilhas bezeichnet wird. Die englische Audit-Fassung lässt diesen Bestandteil ebenfalls aus, darf aber gegenüber dem griechischen Ausgangstext nicht maßgeblich sein.
  naturalness: „Eine Abschrift des Testaments …, das er … errichtete“ ist klares, gehobenes modernes Standarddeutsch. „Zur Zeit seines Weggangs“ bewahrt den nicht ausdrücklich als Tod bezeichneten Wortlaut von ἔξοδος, auch wenn der Kontext einen Abschied vor dem Tod nahelegt.
  terminology: „Testament“ und „errichtete“ sind für διαθήκη bzw. διέθετο angemessen und weder unnötig konfessionell noch übermäßig archaisch. Die Namensformen Naftali und Bilha sind im modernen deutschen biblischen Gebrauch üblich.
  issues:
  - severity: medium
    issue: Bilha (Βάλλας) ist im Titel ausgelassen.
    rationale: Der griechische Ausgangstext bezeichnet Naphtali als „den achten Sohn Jakobs und Bilhas“. Diese genealogische Angabe gehört zum Titel und sollte nicht wegen ihrer Auslassung in der englischen Audit-Fassung entfallen.
  revised_text: Eine Abschrift des Testaments Naftalis, des achten Sohnes Jakobs und Bilhas, das er zur Zeit seines Weggangs im hundertdreißigsten Jahr seines Lebens errichtete.
  revised_footnotes: []
