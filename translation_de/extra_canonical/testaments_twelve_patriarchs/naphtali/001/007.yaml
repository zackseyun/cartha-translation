revisions:
- from: 'Denn Rahel liebte mich sehr, weil ich auf ihren Knien geboren wurde. Und als ich noch ganz zart war, küsste sie mich immer wieder und sagte: »Möge mir aus meinem eigenen Leib ein Bruder für dich geschenkt werden, der dir gleicht.«'
  to: 'Denn Rahel liebte mich sehr, weil ich auf ihren Knien geboren wurde. Und als ich noch ganz zart war, küsste sie mich immer wieder und sagte: »Möge mir aus meinem Leib dein Bruder geschenkt werden, der dir gleicht.«'
  rationale: Die Revision beschränkt sich auf die notwendige Korrektur von „für dich“ zu „dein Bruder“ und entfernt das nicht eigens markierte „eigenen“. Sie bewahrt die Wiederholung des liebkosenden Imperfekts, die Mehrdeutigkeit der Knie-Formel und den optativischen Wunsch. Kein zusätzlicher Satz über Rahels Gebären wird eingefügt, da er in der vorgelegten griechischen Quelle nicht steht.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:17:41Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe von ἐπὶ τῶν γονάτων αὐτῆς als „auf ihren Knien“ und von κατεφίλει als „küsste sie mich immer wieder“ ist quellentreu. Die englische Revisionsnotiz über eine zusätzliche Klausel „und Rachel bore me“ wird vom hier vorgelegten griechischen Text nicht gedeckt und darf nicht übernommen werden. Allerdings wird ἀδελφόν σου im Entwurf mit „ein Bruder für dich“ syntaktisch und semantisch verfehlt: σου bestimmt ἀδελφόν, also „dein Bruder“ bzw. idiomatisch „ein Bruder wie du ihn hast/bekommst“ im Sinn eines Bruders Naphtalis.'
  naturalness: Der Text ist insgesamt flüssiges, modernes und würdiges Standarddeutsch. „Möge mir aus meinem Leib ein Bruder geschenkt werden, der dir gleicht“ ist natürlich und erhält die feierliche Wunschform.
  terminology: „Rahel“, „Leib“, „Bruder“ und die Bildformel „auf ihren Knien“ sind angemessen. „aus meinem Leib“ gibt ἐκ τῆς κοιλίας μου direkt wieder; „eigenen“ ist nicht erforderlich. Der Bezug von „dein Bruder“ muss im Deutschen explizit bleiben, damit die possessive Beziehung von σου nicht zu einem Dativzweck („für dich“) umgedeutet wird.
  issues:
  - severity: medium
    issue: ἀδελφόν σου ist als „ein Bruder für dich“ wiedergegeben.
    rationale: Das Possessivpronomen σου gehört zu ἀδελφόν und bedeutet „dein Bruder“, nicht „ein Bruder für dich“. Die gegenwärtige Formulierung verändert die im griechischen Satz ausgedrückte Verwandtschaftsbeziehung.
  revised_text: 'Denn Rahel liebte mich sehr, weil ich auf ihren Knien geboren wurde. Und als ich noch ganz zart war, küsste sie mich immer wieder und sagte: »Möge mir aus meinem Leib dein Bruder geschenkt werden, der dir gleicht.«'
  revised_footnotes: []
