base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/007.yaml
  text: For Rachel loved me greatly, because I was born upon her knees; and while I was still tender she kept kissing me, saying, ‘May I be given from my own womb a brother like you.’
translation:
  language: de
  text: 'Denn Rahel liebte mich sehr, weil ich auf ihren Knien geboren wurde. Und als ich noch ganz zart war, küsste sie mich immer wieder und sagte: »Möge mir aus meinem Leib dein Bruder geschenkt werden, der dir gleicht.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ τῶν γονάτων αὐτῆς
  choice: auf ihren Knien
  rationale: Bewahrt das konkrete Bild und den möglichen Bezug auf den antiken Geburts- beziehungsweise Annahmebrauch, ohne ihn im Haupttext auszudeuten.
- source_word: ἁπαλὸν ὄντα με
  choice: als ich noch ganz zart war
  rationale: Gibt die körperliche Zartheit beziehungsweise das sehr junge Alter natürlich wieder, ohne das im Griechischen nicht ausdrücklich stehende Substantiv »Kind« einzufügen.
- source_word: κατεφίλει
  choice: küsste sie mich immer wieder
  rationale: Der Imperfekt zusammen mit dem intensivierenden Verb legt eine wiederholte, liebevolle Handlung nahe.
- source_word: Δοίη μοι
  choice: Möge mir … geschenkt werden
  rationale: Gibt den optativischen Wunsch und die passivische Form in würdigem, verständlichem Deutsch wieder.
- source_word: ἀδελφόν σου … κατά σε
  choice: ein Bruder für dich …, der dir gleicht
  rationale: »ἀδελφόν σου« bezeichnet Naphtalis Bruder; κατά σε drückt hier wahrscheinlich Entsprechung oder Ähnlichkeit aus.
- source_word: ἐκ τῆς κοιλίας μου
  choice: aus meinem eigenen Leib
  rationale: Bewahrt den leiblichen Ursprung und klingt im Deutschen natürlicher als das anatomisch engere »aus meinem Mutterleib«; »eigenen« verdeutlicht den im Kontext betonten Gegensatz.
theological_decisions:
- issue: Bedeutung der Geburt »auf ihren Knien«
  choice: Das Bild wird unkommentiert beibehalten.
  alternative: Als Annahme Naphtalis durch Rahel oder als konkrete Gebärhaltung erklären.
  rationale: Der Wortlaut erlaubt einen kulturellen beziehungsweise rechtlichen Hintergrund, legt dessen genaue Funktion hier aber nicht eindeutig fest.
- issue: Rahels Wunsch nach einem Bruder
  choice: Der Wunsch wird als Bitte um einen leiblichen Sohn formuliert, der Naphtali gleicht.
  alternative: »einen Bruder wie dich« oder »deinen Bruder nach deinem Bild«.
  rationale: Die Übersetzung wahrt sowohl die Verwandtschaftsbeziehung als auch den Vergleich, ohne weitergehende theologische Bedeutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Erzählung bleibt anschaulich und emotional, ohne altertümliche Formen. Der eingereichte griechische Text enthält entgegen der jüngsten englischen Revisionsnotiz keinen zusätzlichen Satz »und Rahel gebar mich«; deshalb wurde keine solche Klausel aufgenommen.
