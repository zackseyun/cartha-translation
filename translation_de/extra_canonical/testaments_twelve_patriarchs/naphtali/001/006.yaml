base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001/006.yaml
  text: I was born from Bilhah, because Rachel acted with cunning and gave Bilhah to Jacob in her place; and Bilhah conceived and bore me on Rachel’s knees, and for this reason she called my name Naphtali.
translation:
  language: de
  text: Ich wurde von Bilha geboren, denn Rahel handelte mit List und gab Bilha an ihrer Stelle Jakob. Bilha wurde schwanger und gebar mich auf Rahels Knien; deshalb gab Rahel mir den Namen Naftali.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπὸ Βάλλας
  choice: von Bilha
  rationale: Gibt Herkunft beziehungsweise Mutterschaft im Deutschen natürlich wieder; der etablierte deutsche Name ist „Bilha“.
- source_word: ἐν πανουργίᾳ ἐποίησε
  choice: handelte mit List
  rationale: Bewahrt den wertenden Sinn von πανουργία, ohne ihn unnötig zu verschärfen oder Rahels konkretes Vorgehen über den Text hinaus auszudeuten.
- source_word: ἀντʼ αὐτῆς
  choice: an ihrer Stelle
  rationale: Drückt die Stellvertretung Bilhas für Rahel präzise und idiomatisch aus.
- source_word: ἐπὶ τῶν γονάτων τῆς Ῥαχιήλ
  choice: auf Rahels Knien
  rationale: Folgt dem konkreten Bild des griechischen Textes und wahrt dessen kulturell-rechtliche Andeutung, ohne sie im Haupttext zu erklären.
- source_word: ἐκάλεσε τὸ ὄνομά μου
  choice: gab sie mir den Namen
  rationale: Natürliches modernes Deutsch für die semitisch geprägte griechische Namensformel.
theological_decisions:
- issue: Bewertung von Rahels Handeln
  choice: „handelte mit List“
  alternative: „handelte klug“ oder „griff zu einer List“
  rationale: πανουργία hat hier eine deutlich kritische Färbung. „Mit List“ erhält diese Spannung, ohne eine stärkere moralische Verurteilung einzutragen.
- issue: Geburt auf Rahels Knien
  choice: Bild wörtlich beibehalten
  alternative: als Adoption oder rechtliche Mutterschaft paraphrasieren
  rationale: Der Text nennt nur die Handlung beziehungsweise das Bild. Eine eindeutige institutionelle Deutung würde die genuine Offenheit des Ausdrucks auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzfolge wurde leicht gegliedert, um den langen griechischen Satz verständlich wiederzugeben. Die Eigennamen folgen den im Deutschen etablierten biblischen Formen Bilha, Rahel, Jakob und Naftali.
