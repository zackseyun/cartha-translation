- source_word: υἱοὶ Νεφθαλείμ
  choice: ihr Söhne Naftalis
  rationale: Gibt die Abstammungsbezeichnung idiomatisch als Genitiv wieder; das ergänzte »ihr« macht die Anrede im Deutschen klar.
- source_word: λόγους πατρὸς ὑμῶν
  choice: die Worte eures Vaters
  rationale: Nahe und zugleich natürlich; der griechische Plural λόγους bleibt erhalten.
