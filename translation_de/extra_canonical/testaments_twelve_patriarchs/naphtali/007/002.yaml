  verdict: revise
  source_fidelity: 'Die Wendung Πιστεύω τῷ θεῷ ὅτι verlangt, dass Gott als derjenige erhalten bleibt, dem der Vater hinsichtlich der Aussage über Josefs Leben glaubt. „Ich vertraue Gott, dass …“ ist im Deutschen weniger idiomatisch und verschiebt die Nuance leicht zu allgemeinem Vertrauen. „Ich glaube Gott, dass …“ bildet die griechische Dativkonstruktion unmittelbar ab. Die übrigen Elemente sind treffend wiedergegeben: τότε, ζῇ, πάντοτε sowie ἀριθμεῖ αὐτὸν μεθʼ ἡμῶν.'
  naturalness: „Ich glaube Gott, dass Josef lebt“ ist moderne, verständliche Standardsprache und in diesem Kontext natürlicher als „Ich vertraue Gott, dass Josef lebt“. „Da sagte mein Vater zu mir“ und „der Herr ihn zu uns zählt“ sind klar und angemessen würdig.
  terminology: „Josef“ entspricht der üblichen deutschen Namensform. „der Herr“ gibt Κύριος sachgerecht wieder. „ihn zu uns zählt“ bewahrt die metaphorische Aussage von ἀριθμεῖν, ohne sie zu einer bloß räumlichen Anwesenheit abzuschwächen.
  issues:
  - severity: medium
    issue: „Ich vertraue Gott, dass Josef lebt“ für Πιστεύω τῷ θεῷ ὅτι
    rationale: Die gewählte Form ist semantisch möglich, aber die deutsche Verbindung „jemandem vertrauen, dass …“ ist weniger idiomatisch und gibt die Aussage, Gott hinsichtlich dieses Sachverhalts zu glauben, nicht so präzise wieder wie „Ich glaube Gott, dass …“.
  revised_text: 'Da sagte mein Vater zu mir: „Ich glaube Gott, dass Josef lebt; denn ich sehe stets, dass der Herr ihn zu uns zählt.“'
  revised_footnotes: []
