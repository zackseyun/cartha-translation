source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 2. Τότε⁸ λέγει μοι ὁ πατήρ μου· Πιστεύω⁹ *τῷ θεῷ¹⁰ ὅτι ζῇ¹¹ Ἰωσήφ¹²· ὁρῶ γὰρ ⌜πάντοτε⌝¹³ ὅτι Κύριος ἀριθμεῖ¹⁴ αὐτὸν μεθʼ ἡμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007/002.yaml
  text: Then my father said to me, “I believe God that Joseph is alive; for I always see that the Lord counts him as being with us.”
translation:
  language: de
  text: 'Da sagte mein Vater zu mir: „Ich glaube Gott, dass Josef lebt; denn ich sehe stets, dass der Herr ihn zu uns zählt.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πιστεύω τῷ θεῷ
  choice: Ich vertraue Gott
  rationale: Das Verb πιστεύω mit Dativ bezeichnet hier das Vertrauen auf beziehungsweise den Glauben an Gottes Verlässlichkeit; „ich vertraue Gott“ ist im modernen Deutsch natürlich und wahrt die Konstruktion.
- source_word: ζῇ Ἰωσήφ
  choice: dass Josef lebt
  rationale: Gibt die abhängige Aussage direkt und schlicht wieder.
- source_word: πάντοτε
  choice: stets
  rationale: Bewahrt den zeitlichen Nachdruck und passt zum würdevollen Erzählregister.
- source_word: Κύριος ἀριθμεῖ αὐτὸν μεθʼ ἡμῶν
  choice: der Herr ihn zu uns zählt
  rationale: Folgt der Bildsprache von ἀριθμεῖν und gibt μεθʼ ἡμῶν idiomatisch wieder, ohne den Sinn weiter auszudeuten.
theological_decisions:
- issue: Grundlage der Überzeugung, dass Josef lebt
  choice: Gottes Verlässlichkeit wird durch „Ich vertraue Gott“ ausgedrückt, während die anschließende Schau als Begründung stehen bleibt.
  alternative: „Ich glaube an Gott, dass Josef lebt“ oder „Ich glaube Gott, dass Josef lebt“
  rationale: „An Gott glauben“ könnte eine allgemeinere Glaubensaussage nahelegen; „Gott glauben“ ist zwar näher an der griechischen Dativkonstruktion, klingt hier im Deutschen jedoch weniger natürlich. Die gewählte Form löst die Beziehung zwischen Vertrauen und Schau nicht weiter auf.
translation_notes:
  register: Moderne, klare und zugleich würdige Standardsprache. Die knappe direkte Rede und die wiederholte Wahrnehmung des Vaters bleiben erhalten; es werden keine erklärenden Zusätze eingeführt.
