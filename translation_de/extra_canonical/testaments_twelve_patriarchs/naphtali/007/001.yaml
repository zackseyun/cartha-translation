base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007/001.yaml
  text: I told these two dreams to my father, and he said to me, “These things must be fulfilled in their appointed times, after Israel has endured much.”
translation:
  language: de
  text: 'Diese beiden Träume erzählte ich meinem Vater, und er sagte zu mir: »Diese Dinge müssen jeweils zu ihrer Zeit erfüllt werden, nachdem Israel viel erduldet hat.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐνύπνια
  choice: Träume
  rationale: Die natürliche moderne deutsche Entsprechung für visionäre Träume; der Kontext verlangt hier keinen eigens markierten Fachbegriff.
- source_word: Δεῖ … πληρωθῆναι
  choice: muss … erfüllt werden
  rationale: Bewahrt sowohl die Notwendigkeit, die δεῖ ausdrückt, als auch die Erfüllungssprache des griechischen Passivs.
- source_word: κατὰ τοὺς καιροὺς αὐτῶν
  choice: zu seiner jeweiligen Zeit
  rationale: Gibt den Gedanken der den angekündigten Ereignissen entsprechenden bzw. bestimmten Zeiten idiomatisch wieder, ohne die Bestimmung ausdrücklich Gott zuzuschreiben.
- source_word: ὑπομείναντος
  choice: nachdem … erduldet hat
  rationale: Der Genitivus absolutus bezeichnet wahrscheinlich ein dem Erfüllungsgeschehen vorausgehendes Durchhalten unter Leiden; „erdulden“ wahrt sowohl Belastung als auch Standhaftigkeit.
theological_decisions:
- issue: Art der Notwendigkeit bei δεῖ
  choice: muss erfüllt werden
  alternative: wird sich erfüllen
  rationale: „Muss“ erhält die im griechischen Text ausgesagte Notwendigkeit, ohne deren Ursprung dogmatisch näher zu bestimmen.
- issue: Zeitverhältnis des Genitivus absolutus πολλὰ τοῦ Ἰσραὴλ ὑπομείναντος
  choice: nachdem Israel viel erduldet hat
  alternative: während Israel viel erduldet
  rationale: Das Aoristpartizip legt Vorzeitigkeit nahe. Die denkbare allgemeinere Begleitumstandslesart wird nicht in den Haupttext übernommen, da die syntaktische Evidenz die Vorzeitigkeit bevorzugt.
- issue: Referenz des pluralischen αὐτῶν
  choice: zu seiner jeweiligen Zeit
  alternative: zu ihren Zeiten
  rationale: Das Griechische spricht von „ihren Zeiten“ und kann mehrere Erfüllungsereignisse voraussetzen. Die distributive deutsche Formulierung bewahrt diese Mehrzahl semantisch und klingt zugleich natürlich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt knapp und feierlich; weder „bestimmte Zeiten“ noch eine ausdrücklich göttliche Festsetzung wird ergänzt, weil dies im griechischen Wortlaut nicht eigens gesagt wird.
