  text: 4. *Ἐποίησε οὖν καὶ ἐμὲ δακρῦσαι¹⁹ ἐν²⁰ τοῖς λόγοις τούτοις²¹. *Ἐγὼ δὲ²² *ἐκαιόμην τοῖς σπλάγχνοις²³ μου²⁴ ἀναγγεῖλαι²⁵ ὅτι πέπραται²⁶ ⌜Ἰωσήφ⌝²⁷· *ἀλλʼ ἐφοβούμην²⁸ τοὺς ἀδελφούς μου²⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007/004.yaml
  text: So by these words he made me weep also. But I was burning in my inward parts to tell him that Joseph had been sold, yet I was afraid of my brothers.
translation:
  language: de
  text: Da brachte er auch mich durch diese Worte zum Weinen. Ich aber brannte innerlich darauf, ihm zu sagen, dass Josef verkauft worden war; doch ich fürchtete mich vor meinen Brüdern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐποίησε ... με δακρῦσαι
  choice: brachte er ... mich zum Weinen
  rationale: Gibt die kausative Wendung natürlich und zugleich eng am griechischen Sinn wieder.
- source_word: ἐν τοῖς λόγοις τούτοις
  choice: mit diesen Worten
  rationale: Das instrumentale ἐν wird im Deutschen idiomatisch mit „mit“ ausgedrückt.
- source_word: ἐκαιόμην τοῖς σπλάγχνοις μου
  choice: ich brannte innerlich darauf
  rationale: Bewahrt das Bild des Brennens und vermittelt zugleich, dass die σπλάγχνα den innersten Gefühlsbereich bezeichnen.
- source_word: ἀναγγεῖλαι
  choice: ihm zu sagen
  rationale: Im Kontext bezeichnet das Verb das Mitteilen bzw. Berichten an den zuvor genannten Vater; „sagen“ klingt im modernen Deutsch natürlich.
- source_word: πέπραται Ἰωσήφ
  choice: dass Josef verkauft worden war
  rationale: Das Perfekt Passiv bezeichnet Josef als verkauft; das deutsche Plusquamperfekt ordnet den Verkauf zeitlich vor dem damaligen Mitteilungswunsch ein.
- source_word: ἐφοβούμην τοὺς ἀδελφούς μου
  choice: ich fürchtete mich vor meinen Brüdern
  rationale: Entspricht der griechischen Konstruktion und lässt offen, worin die befürchtete Gefahr genau bestand.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die körperlich-emotionale Metapher des inneren Brennens bleibt erhalten, ohne das ungebräuchliche wörtliche „in meinen Eingeweiden“ zu verwenden. Keine Fußnoten erforderlich.
