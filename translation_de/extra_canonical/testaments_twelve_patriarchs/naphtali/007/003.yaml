  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007/003.yaml
  text: And weeping, he said, “Alas, my child Joseph, you are alive, and I do not see you; and you do not see Jacob, who fathered you.”
translation:
  language: de
  text: 'Weinend sagte er: »Ach, mein Kind Josef, du lebst, und ich sehe dich nicht; und du siehst Jakob nicht, der dich gezeugt hat.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἴμοι
  choice: Ach
  rationale: Gibt den schmerzlichen Ausruf natürlich und würdevoll wieder, ohne die Klage unnötig zu verstärken.
- source_word: τέκνον μου
  choice: mein Kind
  rationale: Bewahrt die familiäre Anrede und den Ausdruck väterlicher Zuneigung.
- source_word: ζῇς
  choice: Du lebst
  rationale: Entspricht unmittelbar dem griechischen Präsens und erhält den überraschten, klagenden Ton.
- source_word: τὸν γεννήσαντά σε
  choice: der dich gezeugt hat
  rationale: Gibt die aktive, biologische Bedeutung von γεννάω präzise wieder und bewahrt den Bezug auf Jakob als Vater.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die parallele Gegenüberstellung »ich sehe dich nicht« / »du siehst Jakob nicht« bleibt bewusst erhalten.
