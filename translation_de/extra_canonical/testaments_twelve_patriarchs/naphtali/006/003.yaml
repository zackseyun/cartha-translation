  text: 'Und unser Vater sagt zu uns: »Kommt, lasst uns in unser Schiff steigen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δεῦτε
  choice: Kommt
  rationale: Gibt die auffordernde Partikel natürlich und unmittelbar wieder.
- source_word: ἀνέλθωμεν
  choice: lasst uns an Bord … gehen
  rationale: Im Zusammenhang mit πλοῖον bezeichnet das Verb das Besteigen beziehungsweise An-Bord-Gehen; die idiomatische deutsche Wendung vermeidet das missverständliche wörtliche »hinaufgehen«.
- source_word: πλοῖον
  choice: Schiff
  rationale: Entspricht der allgemeinen Bedeutung des griechischen Substantivs; Größe und genaue Art des Wasserfahrzeugs bleiben unbestimmt.
