id: T12P.NAP.6.6
reference: Testament of Naphtali 6:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 6. *Ὁ δὲ Ἰωσὴφ ἐπὶ ἀκατίῳ ἐπορεύθη³⁴· ἡμεῖς δὲ διεχωρίσθημεν ἐπὶ σανίδων ἐννέα³⁵. Λευὶ δὲ καὶ Ἰούδας ἦσαν *ἐπὶ τὸ αὐτό³⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/006.yaml
  text: But Joseph went away on a small boat, and we were separated on nine planks; and Levi and Judah were together.
translation:
  language: de
  text: Josef aber fuhr in einem kleinen Boot davon; wir wurden auf neun Planken voneinander getrennt. Levi und Juda aber waren zusammen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀκάτιον
  choice: kleines Boot
  rationale: Bezeichnet ein kleines Wasserfahrzeug oder Beiboot; „kleines Boot“ ist im modernen Deutsch klar und wahrt die Verkleinerungsbedeutung.
- source_word: ἐπορεύθη
  choice: fuhr … davon
  rationale: Im Zusammenhang mit einem Boot ist „fuhr“ idiomatischer als das allgemeinere „ging“; „davon“ gibt die Bewegung beziehungsweise Trennung wieder.
- source_word: διεχωρίσθημεν
  choice: wurden … voneinander getrennt
  rationale: Bewahrt die passive Form und den Gedanken der räumlichen Trennung.
- source_word: σανίδων ἐννέα
  choice: neun Planken
  rationale: Gibt das konkrete Bild des griechischen Ausdrucks direkt wieder, ohne die Planken als Flöße oder Boote umzudeuten.
- source_word: ἐπὶ τὸ αὐτό
  choice: zusammen
  rationale: Die idiomatische Wendung bezeichnet hier das Beisammensein am selben Ort; „zusammen“ ist natürlich und präzise.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Satzstruktur. Das wiederholte δέ wird differenziert mit „aber“ beziehungsweise durch Satzgliederung wiedergegeben, damit der Text natürlich bleibt.
