  source_fidelity: 'Der Entwurf gibt die griechischen Kernelemente vollständig und zutreffend wieder: Josephs Fahrt auf einem kleinen Boot (ἐπὶ ἀκατίῳ), die Trennung der Sprechergruppe auf neun Planken (ἐπὶ σανίδων ἐννέα) sowie das Zusammensein von Levi und Juda (ἐπὶ τὸ αὐτό). „Fuhr ... davon“ ist im nautischen Kontext eine natürliche Wiedergabe von ἐπορεύθη und steht auch mit dem englischen Audit-Trail („went away“) im Einklang.'
  naturalness: Der Text ist flüssiges modernes Standarddeutsch. Die Satzteilung unterstützt die Verständlichkeit, ohne Informationen hinzuzufügen. „Auf neun Planken“ bewahrt das konkrete, möglicherweise notfallartige Bild, ohne es zu einer ausdrücklichen Floßfahrt umzudeuten.
  terminology: „Kleines Boot“ gibt das Diminutiv ἀκάτιον angemessen wieder. Die Namensformen „Josef“, „Levi“ und „Juda“ sind im Deutschen üblich. „Zusammen“ ist eine idiomatische und präzise Wiedergabe von ἐπὶ τὸ αὐτό.
