source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: VI. *Καὶ πάλιν¹ μετὰ ἡμέρας² ἑπτὰ εἶδον *ὅτι ὁ πατὴρ μου Ἰακὼβ ἴστατο³ ἐν τῇ θαλάσσῃ Ἀμνείας⁴, καὶ ἡμεῖς⁵ σὺν αὐτῷ⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/001.yaml
  text: And again, after seven days, I saw that my father Jacob was standing by the sea of Amnia[a], and we were with him.
translation:
  language: de
  text: Und wieder, nach sieben Tagen, sah ich, dass mein Vater Jakob am Meer von Amnia[a] stand und wir bei ihm waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Lage des Ortes „Amnia“ ist nicht sicher bestimmt; die Übersetzung bewahrt die griechische Namensform, statt einen bestimmten Ort zu vermuten.
    reason: cultural_note
lexical_decisions:
- source_word: πάλιν
  choice: wieder
  rationale: Gibt die Wiederholung des Gesichts schlicht und idiomatisch wieder.
- source_word: μετὰ ἡμέρας ἑπτά
  choice: nach sieben Tagen
  rationale: Entspricht der zeitlichen Angabe des griechischen Textes in natürlichem Deutsch.
- source_word: ἐν τῇ θαλάσσῃ Ἀμνείας
  choice: am Meer von Amnia
  rationale: Das griechische ἐν kann bei einem Gewässer einen Standort am beziehungsweise beim Meer bezeichnen. Der unsicher identifizierte Name wird nicht durch eine Vermutung ersetzt.
- source_word: σὺν αὐτῷ
  choice: bei ihm
  rationale: Drückt die begleitende Anwesenheit der Söhne bei Jakob natürlich aus.
