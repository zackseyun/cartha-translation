  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/007.yaml
  text: And we were scattered, all of us, to the ends of the earth[c].
translation:
  language: de
  text: Und wir wurden alle bis an die Enden der Erde zerstreut.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Zerstreuung „bis an die Enden der Erde“ kann sinnbildlich für eine weitreichende Verteilung stehen; im Zusammenhang wird sie jedoch als Teil von Naftalis Traum geschildert.
    reason: cross_reference
lexical_decisions:
- source_word: διεσπάρημεν
  choice: wir wurden … zerstreut
  rationale: Der griechische Aorist Passiv wird formal und idiomatisch als abgeschlossene passive Handlung wiedergegeben.
- source_word: πάντες
  choice: alle
  rationale: Bewahrt die ausdrückliche Betonung, dass die gesamte Gruppe von der Zerstreuung betroffen war.
- source_word: εἰς τὰ πέρατα τῆς γῆς
  choice: bis an die Enden der Erde
  rationale: Gibt die räumliche Ziel- beziehungsweise Ausdehnungsangabe natürlich wieder und erhält zugleich die mögliche symbolische Bedeutung weltweiter Zerstreuung.
theological_decisions:
- issue: Reichweite und mögliche Symbolik der Zerstreuung
  choice: Die bildhafte Formulierung „bis an die Enden der Erde“ bleibt im Haupttext unverändert erhalten.
  alternative: Die Wendung ausdrücklich als weltweite Diaspora oder Verbannung deuten.
  rationale: Der griechische Text bezeichnet die Zerstreuung räumlich, legt aber ihre genaue historische oder theologische Bedeutung nicht fest; diese Offenheit wird gewahrt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wortstellung mit „alle“ nach dem finiten Verb klingt natürlich und bewahrt die Betonung von πάντες; „Enden der Erde“ erhält die traditionelle Bildsprache ohne zusätzliche Auslegung.
