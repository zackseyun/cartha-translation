  text: And behold, our father came, and we all rejoiced together with one accord.
translation:
  language: de
  text: Und siehe, unser Vater kam, und wir alle jubelten einmütig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: siehe
  rationale: Bewahrt das aufmerksamkeitslenkende und feierliche Signal des griechischen Textes in einer geläufigen biblischen Ausdrucksweise.
- source_word: ὁ πατήρ ἡμῶν
  choice: unser Vater
  rationale: Gibt Wortlaut und familiären Bezug direkt und natürlich wieder.
- source_word: ὁμοθυμαδόν
  choice: einmütig
  rationale: Drückt die gemeinsame, übereinstimmende Haltung aller aus, ohne die Aussage unnötig zu verdoppeln.
- source_word: ἠγαλλιασάμεθα
  choice: wir freuten uns
  rationale: Gibt die gemeinsame Freude idiomatisch wieder; ein stärkeres „jubelten“ wäre möglich, wirkt hier aber weniger neutral.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltenem „Und siehe“. Die in der Revisionsnotiz ergänzte Aussage „Er bat uns inständig“ wurde nicht aufgenommen, da sie im angegebenen griechischen Ausgangstext dieses Verses nicht steht.
