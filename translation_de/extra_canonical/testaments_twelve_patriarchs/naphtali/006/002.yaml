  source_fidelity: 'Der deutsche Text folgt dem griechischen Befund genau: ἤρχετο ἁρμενίζον wird idiomatisch als „kam herangesegelt“ wiedergegeben, und ἐκτὸς mit Genitiv korrekt als das Fehlen von Seeleuten und Steuermännern. Dies ist gegenüber der englischen Audit-Fassung besonders wichtig, da deren „with sailors and pilots“ dem vorliegenden griechischen Text widerspricht. Die Aufschrift πλοῖον Ἰακώβ bleibt knapp und ohne zusätzliche Deutung erhalten.'
