source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 2. Καὶ ἰδοὺ πλοῖον ἤρχετο⁷ ἁρμενίζον⁸ *ἐκτὸς ναυτῶν⁹ καὶ κυβερνητῶν¹⁰· ἐπεγέγραπτο *δὲ τῷ πλοίῳ¹¹ *ὅτι πλοῖον¹² Ἰακώβ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/002.yaml
  text: 'And behold, a ship was coming, sailing beside us, with sailors and pilots. And on the ship was written this: “Jacob’s ship.”'
translation:
  language: de
  text: 'Und siehe, ein Schiff kam herangesegelt, ohne Seeleute und Steuermänner. Auf dem Schiff aber stand geschrieben: »Schiff Jakobs.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤρχετο ἁρμενίζον
  choice: kam herangesegelt
  rationale: 'Gibt die Verlaufsform aus imperfektivem Verb und Partizip natürlich wieder: Das Schiff näherte sich unter Segeln.'
- source_word: ἐκτὸς ναυτῶν καὶ κυβερνητῶν
  choice: ohne Seeleute und Steuermänner
  rationale: ἐκτός mit Genitiv bezeichnet hier das Fehlen der genannten Personen. Damit folgt die Übersetzung dem vorgelegten griechischen Text, anders als die englische Konsultationsfassung mit „with“.
- source_word: πλοῖον Ἰακώβ
  choice: Schiff Jakobs
  rationale: Bewahrt die knappe, artikellose Form der Aufschrift; der Genitiv kann Zugehörigkeit ausdrücken, ohne sie weiter auszudeuten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das einleitende „Und siehe“ bewahrt den visionären Erzählton. „Steuermänner“ ist im Kontext eines Schiffes verständlicher und präziser als das moderne, potenziell mehrdeutige „Piloten“.
