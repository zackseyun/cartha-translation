source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 9. Ὡς δὲ ἐπαύσατο ὁ χειμών, *ἔφθασε τὸ σκάφος ἐπὶ τῆς γῆς⁴⁶, Γὥσπερ⁴⁷ ἐν εἰρήνῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/009.yaml
  text: And when the winter ceased, the ship came to the land, as it were in peace.
translation:
  language: de
  text: Und als der Winter vorüber war, gelangte das Schiff ans Land, gleichsam in Frieden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χειμών
  choice: Winter
  rationale: Die Grundbedeutung ist „Winter“; obwohl das Wort auch winterliches Unwetter bezeichnen kann, bewahrt „Winter“ hier die konkrete und im Ausgangstext nicht näher aufgelöste Zeitangabe.
- source_word: ἔφθασε … ἐπὶ τῆς γῆς
  choice: gelangte … ans Land
  rationale: Gibt das Erreichen des Landes natürlich und ohne die im Deutschen unübliche wörtliche Konstruktion „kam auf das Land“ wieder.
- source_word: τὸ σκάφος
  choice: das Schiff
  rationale: Bezeichnet hier das Wasserfahrzeug; „Schiff“ entspricht dem erzählerischen Zusammenhang und der konsultierten englischen Fassung.
- source_word: ὥσπερ ἐν εἰρήνῃ
  choice: gleichsam in Frieden
  rationale: Bewahrt die vergleichende, eigentümlich offene Formulierung des Griechischen, ohne zu erklären, worauf sich der Friede genau bezieht.
theological_decisions:
- issue: Bezug und Bedeutung von „in Frieden“
  choice: Die offene adverbiale Wendung „gleichsam in Frieden“ bleibt erhalten.
  alternative: „als wäre die Fahrt friedlich verlaufen“ oder „sicher und unversehrt“
  rationale: Der griechische Text benennt weder ausdrücklich die Fahrt noch Sicherheit oder Unversehrtheit; eine Präzisierung würde die bildhafte Mehrdeutigkeit unnötig auflösen.
translation_notes:
  register: Natürliches, modernes Standarddeutsch in würdigem Erzählton. „Als … vorüber war“ ist idiomatischer als „als … aufhörte“, während „gleichsam“ die ungewöhnliche Vergleichsform des Originals knapp bewahrt.
