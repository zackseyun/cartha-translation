  - severity: low
    issue: τρικυμίαις als „Stürme“
    rationale: Im Kontext des vom Wasser gefüllten Schiffes sind die aufgewühlten Wogen/Sturmwellen die nähere Wiedergabe. Die Änderung bewahrt das konkrete Bild des griechischen Ausdrucks.
