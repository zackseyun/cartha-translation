  text: 5. Καὶ²⁵ ἡμεῖς²⁶ χειμαζόμενοι ἐπὶ τὸ πέλαγος *ἐφερόμεθα, καὶ²⁷ ἐπληρώθη τὸ πλοῖον ὑδάτων²⁸, *ἐν τρικυμίαις²⁹ περιρησσόμενον³⁰, ὥστε³¹ *καὶ συντρίβεσθαι³² αὐτό³³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/005.yaml
  text: And we, being storm-tossed on the sea, were being driven over the waters, and the ship was filled and battered in the storms, so that it was in danger of breaking apart.
translation:
  language: de
  text: Und wir wurden, vom Sturm hin und her geworfen, auf dem Meer umhergetrieben, und das Schiff wurde mit Wasser gefüllt und in den Wogen ringsum geschlagen, sodass es zu zerbrechen drohte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χειμαζόμενοι
  choice: vom Sturm getrieben
  rationale: Das Partizip bezeichnet, dass die Personen einem Sturm ausgesetzt und von ihm umhergetrieben werden; die Formulierung ist im Deutschen natürlich und bewahrt das passive Moment.
- source_word: ἐπὶ τὸ πέλαγος ἐφερόμεθα
  choice: auf das offene Meer hinausgetragen
  rationale: πέλαγος meint das offene beziehungsweise tiefe Meer; die Richtungsangabe mit ἐπί und Akkusativ wird durch „hinaus“ wiedergegeben, während das Passiv von φέρω in „getragen“ erhalten bleibt.
- source_word: ἐπληρώθη τὸ πλοῖον ὑδάτων
  choice: Das Schiff füllte sich mit Wasser
  rationale: Gibt die Füllung des Schiffes mit Wasser idiomatisch und ohne sachliche Ergänzung wieder.
- source_word: ἐν τρικυμίαις περιρησσόμενον
  choice: wurde in den schweren Stürmen hin und her geschlagen
  rationale: τρικυμία bezeichnet heftiges Sturmgeschehen auf dem Meer; περιρήσσω vermittelt ein wiederholtes, ringsum erfolgendes Schlagen oder Stoßen.
- source_word: ὥστε καὶ συντρίβεσθαι αὐτό
  choice: sodass es auseinanderzubrechen drohte
  rationale: Der Infinitiv συντρίβεσθαι beschreibt das Zerbrechen beziehungsweise Zerschmettertwerden des Schiffes. „drohte“ bringt die konsekutive Gefährdung natürlich zum Ausdruck, ohne einen bereits vollendeten Schiffbruch zu behaupten.
