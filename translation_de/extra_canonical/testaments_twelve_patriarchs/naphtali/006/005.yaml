revisions:
- from: Und wir wurden, vom Sturm getrieben, auf das offene Meer hinausgetragen. Das Schiff füllte sich mit Wasser und wurde in den schweren Stürmen hin und her geschlagen, sodass es auseinanderzubrechen drohte.
  to: Und wir wurden, vom Sturm hin und her geworfen, auf dem Meer umhergetrieben, und das Schiff wurde mit Wasser gefüllt und in den Wogen ringsum geschlagen, sodass es zu zerbrechen drohte.
  rationale: Die Revision entfernt nicht ausdrücklich belegte Zusätze, wahrt die andauernde passive Bedrängnis von Personen und Schiff und gibt das Bild der ringsum schlagenden Wogen enger wieder. Die Gefahr des Zerbrechens wird weiterhin als drohender Ausgang formuliert, nicht als bereits eingetretener Schiffbruch.
