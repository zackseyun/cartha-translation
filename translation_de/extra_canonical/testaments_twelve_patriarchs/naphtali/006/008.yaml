base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/008.yaml
  text: But Levi, clothed in sackcloth, prayed to the Lord.
translation:
  language: de
  text: Levi aber, in Sacktuch gekleidet, flehte den Herrn an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ δὲ Λευὶ
  choice: Levi aber
  rationale: Die nachgestellte Wiedergabe von δέ bewahrt den leichten Gegensatz beziehungsweise Fortgang der Erzählung in natürlichem, würdigem Deutsch.
- source_word: περιβαλλόμενος σάκκον
  choice: in Sacktuch gekleidet
  rationale: Die Formulierung gibt das Partizip und das als Trauer- oder Bußgewand getragene Sacktuch knapp und anschaulich wieder.
- source_word: ἐδέετο τοῦ Κυρίου
  choice: betete zum Herrn
  rationale: δέομαι mit Genitiv bezeichnet hier das bittende Gebet an den Herrn; „betete zum Herrn“ ist idiomatisch und lässt den konkreten Inhalt der Bitte offen.
theological_decisions:
- issue: Charakter des Gebets
  choice: betete zum Herrn
  alternative: flehte den Herrn an
  rationale: Das griechische ἐδέετο kann ein inständiges Bitten ausdrücken. Da kein Gebetsinhalt genannt wird, vermeidet die allgemeinere Wiedergabe eine unnötige Verstärkung, ohne die Gebetsrichtung zu verwischen.
translation_notes:
  register: Modernes Standarddeutsch in knapper, würdiger Erzählprosa. „Sacktuch“ bewahrt das antike Trauer- und Bußmotiv, ohne es erklärend in den Haupttext aufzulösen.
