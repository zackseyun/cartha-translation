base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006/004.yaml
  text: And when we had entered, a violent storm arose, and a whirlwind of wind; and our father withdrew from us, holding the rudders[b].
translation:
  language: de
  text: Als wir aber hineingegangen waren, erhob sich ein heftiger Sturm und ein gewaltiger Windwirbel. Unser Vater entfernte sich von uns und hielt die Ruder[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die mit „Ruder“ wiedergegebene griechische Wendung ist textlich schwierig. Sie bedeutet im gewöhnlichen Gebrauch wörtlich „die Nacken“ oder „Hälse haltend“; der Zusammenhang scheint jedoch nautisch zu sein.
    reason: textual_variant
lexical_decisions:
- source_word: εἰσήλθομεν
  choice: hineingegangen waren
  rationale: Gibt den Aorist von εἰσέρχομαι in der vorzeitigen temporalen Konstruktion natürlich wieder; das Ziel bleibt wie im griechischen Text unausgesprochen.
- source_word: χειμὼν σφοδρός
  choice: ein heftiger Sturm
  rationale: χειμών bezeichnet hier im nautischen Zusammenhang stürmisches Unwetter; σφοδρός verstärkt dessen Heftigkeit.
- source_word: λαῖλαψ ἀνέμου μέγας
  choice: ein gewaltiger Wirbelwind
  rationale: Natürliche deutsche Wiedergabe der verstärkten Sturmwindformulierung, ohne die Bildsprache abzuschwächen.
- source_word: ἀφίσταται ἀφʼ ἡμῶν
  choice: entfernte sich von uns
  rationale: Bewahrt die aktive, räumliche Grundbedeutung von ἀφίστημι und vermeidet die stärkere Deutung einer bloß passiven Trennung.
- source_word: κρατῶν τοὺς αὐχένας
  choice: hielt die Ruder
  rationale: Der überlieferte Wortlaut bedeutet gewöhnlich wörtlich „die Nacken/Hälse haltend“, ist hier jedoch textlich schwierig; die nautische Kontextdeutung „Ruder“ wird im Haupttext verwendet und transparent angemerkt.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Erzählfolge wird mit „Als …, erhob sich … Da …“ flüssig wiedergegeben; die echte textliche Unsicherheit der Schlusswendung bleibt durch die Fußnote sichtbar.
