  - severity: low
    issue: „Da“ verstärkt die Verknüpfung der Ereignisse.
    rationale: Das griechische καί reiht die Aussage lediglich an; ohne „Da“ bleibt die Verknüpfung neutraler.
  - severity: low
    issue: Die Fußnote spricht vom „zugrunde liegenden Wort“ im Singular.
    rationale: Die schwierige Formulierung ist die griechische Wortgruppe κρατῶν τοὺς αὐχένας; αὐχένας steht zudem im Plural.
