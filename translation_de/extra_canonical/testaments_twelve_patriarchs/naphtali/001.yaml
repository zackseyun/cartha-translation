review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem griechischen Text insgesamt eng. In V. 1 fehlt jedoch im deutschen Haupttitel die im griechischen Titel vorhandene Zuordnung »des achten Sohnes Jakobs und Bilhas« nicht, sie ist vorhanden; die Überschrift ist daher stimmig. In V. 4 gibt »Nach dem gestrigen Festmahl ist mein Fleisch gestorben« ἀπέθανεν ἡ σάρξ μου angemessen wieder. In V. 6 stellt die Satzteilung den kausalen Zusammenhang etwas um, ohne den Sinn wesentlich zu verändern. In V. 7 ist »der dir gleicht« eine zusätzliche Auslegung: κατά σε bedeutet hier eher »wie dich / entsprechend dir« und bezieht sich auf den erbetenen Bruder; dies sollte unmittelbarer formuliert werden. V. 8 gibt εὐλογίας korrekt als »Segnungen« wieder; die textkritische Unsicherheit gehört in die Fußnote.'
  naturalness: Das Deutsch ist überwiegend natürlich und würdig. »von Bilha geboren« ist verständlich, aber »als Sohn Bilhas geboren« klingt idiomatischer und wahrt die genealogische Formel. »auf den Knien Rahels geboren« ist absichtlich wörtlich und mit dem Kontext verständlich. Der Satz in V. 7 wird mit »ein Bruder für dich, der dir gleicht« unnötig schwer; »ein Bruder wie du« ist natürlicher und näher am Griechischen.
  terminology: »Testament«, »Hinscheiden«, »Herr«, »Festmahl«, »List«, »Segnungen« und die Namensformen Naftali, Bilha, Rahel und Josef sind passend. Die Übersetzung soll die ungewöhnliche Aussage über das gestorbene Fleisch beibehalten und nicht durch eine Deutung ersetzen.
  issues:
  - severity: medium
    issue: 'V. 7: »ein Bruder für dich geschenkt werden, der dir gleicht«'
    rationale: Die deutsche Fassung fügt mit »für dich« und dem Relativsatz eine stärker ausgelegte Beziehung hinzu. Das griechische κατά σε lässt sich direkt und idiomatisch mit »ein Bruder wie du« wiedergeben; das bewahrt die knappe Wunschformulierung.
  - severity: low
    issue: 'V. 6: »Ich wurde von Bilha geboren.«'
    rationale: Die Formulierung ist möglich, aber »Ich wurde als Sohn Bilhas geboren« ist im Deutschen natürlicher und gibt ἀπὸ Βάλλας im genealogischen Kontext präziser wieder.
