base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/001.yaml
  text: 'A copy of the testament of Naphtali, the eighth son of Jacob, which he set in order at the time of his departure, in the hundred and thirtieth year of his life.


    2 When his sons had gathered together in the seventh month, on the first day of the month, he made a feast for them. 3 And in the morning, after he awoke, he said to them, “I am dying”; but they did not believe him. 4 And while blessing and glorifying the Lord, he grew strong and said, “After the feast yesterday, my flesh failed and died.”


    5 Then he began to speak: “Hear, my children, sons of Naphtali; hear the words of your father. 6 I was born from Bilhah, because Rachel acted with cunning and gave Bilhah to Jacob in her place; and Bilhah conceived and bore me upon Rachel’s knees, and for this reason she called my name Naphtali. 7 For Rachel loved me greatly, because I was born upon her knees; and when I was still a tender child she kissed me, saying, ‘May I be given a brother from my own womb, like you.’ 8 Therefore Joseph also was like me in every way, according to the prayers of Rachel.”'
translation:
  language: de
  text: '**Das Testament Naftalis, des achten Sohnes Jakobs und Bilhas**


    **1** Abschrift des Testaments Naftalis, das er zur Zeit seines Hinscheidens im hundertdreißigsten Jahr seines Lebens aufsetzte.


    **2** Als seine Söhne am ersten Tag des siebten Monats zusammengekommen waren, bereitete er ihnen ein Festmahl. **3** Am nächsten Morgen, nachdem er erwacht war, sagte er zu ihnen: »Ich sterbe.« Doch sie glaubten ihm nicht. **4** Während er den Herrn pries, kam er wieder zu Kräften und sagte: »Nach dem gestrigen Festmahl ist mein Fleisch gestorben.«[a]


    **5** Dann begann er zu sprechen: »Hört, meine Kinder, ihr Söhne Naftalis! Hört auf die Worte eures Vaters! **6** Ich wurde als Sohn Bilhas geboren. Rahel war nämlich mit List vorgegangen und hatte Jakob an ihrer Stelle Bilha gegeben. Bilha wurde schwanger und gebar mich auf den Knien Rahels; deshalb gab Rahel mir den Namen Naftali. **7** Rahel liebte mich sehr, weil ich auf ihren Knien geboren worden war. Als ich noch ein kleines, zartes Kind war, küsste sie mich immer wieder und sagte: ›Möge mir aus meinem eigenen Schoß ein Bruder wie du geschenkt werden!‹ **8** Daher glich auch Josef mir in jeder Hinsicht, entsprechend den Segnungen Rahels.[b]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ist mein Fleisch gestorben«. Gemeint sein könnte, dass seine körperliche Kraft erloschen war; der griechische Text lässt die ungewöhnliche Aussage jedoch unerklärt.'
    reason: Die wörtliche Formulierung ist semantisch auffällig und steht in Spannung dazu, dass Naftali anschließend spricht.
  - marker: b
    text: Der griechische Text lautet »Segnungen Rahels«; die Überlieferung ist an dieser Stelle als unsicher gekennzeichnet. Möglich ist auch ein Verständnis im Sinne ihrer Segenswünsche oder Gebete.
    reason: Das Editionszeichen † weist auf eine textlich problematische Stelle hin; die Fußnote bewahrt sowohl den überlieferten Wortlaut als auch die Unsicherheit.
lexical_decisions:
- source_word: διαθήκη
  choice: Testament
  rationale: Im literarischen Zusammenhang bezeichnet das Wort eine letztwillige väterliche Rede; „Testament“ wahrt zugleich den etablierten Werktitel.
- source_word: ἔξοδος
  choice: Hinscheiden
  rationale: Das griechische Wort bedeutet wörtlich „Ausgang/Fortgang“ und dient hier als würdevoller Ausdruck für den bevorstehenden Tod.
- source_word: ἐποίησε δεῖπνον
  choice: bereitete er ihnen ein Festmahl
  rationale: δεῖπνον bezeichnet eine Mahlzeit, hier erkennbar eine besondere Zusammenkunft; „Festmahl“ gibt den erzählerischen Rahmen natürlich wieder.
- source_word: δοξάζων
  choice: während er den Herrn pries
  rationale: Das Partizip bezeichnet das Verherrlichen oder Preisen Gottes; die Übersetzung vermeidet die zusätzliche, im griechischen Text nicht ausdrücklich vorhandene Bedeutung „segnen“.
- source_word: ἐκραταιώθη
  choice: kam er wieder zu Kräften
  rationale: Die passive Verbform bedeutet „wurde stark/gestärkt“; die gewählte Wendung ist im Zusammenhang eines Sterbenden natürlich, ohne ausdrücklich einen Handelnden zu ergänzen.
- source_word: ἡ σάρξ μου ἀπέθανεν
  choice: mein Fleisch ist gestorben
  rationale: Die auffällige Formulierung des griechischen Textes wird bewusst bewahrt und nicht zu „mein Körper versagte“ geglättet.
- source_word: ἐν πανουργίᾳ
  choice: mit List
  rationale: πανουργία kann Klugheit, Verschlagenheit oder List bezeichnen; der Kontext des Stellvertretungshandelns legt die wertungsoffene bis kritische Wiedergabe „List“ nahe.
- source_word: ἐπὶ τῶν γονάτων
  choice: auf den Knien
  rationale: Die konkrete antike Geburts- beziehungsweise Annahmeformel wird wörtlich erhalten.
- source_word: κατεφίλει
  choice: küsste sie mich immer wieder
  rationale: Das Imperfekt in Verbindung mit dem intensivierenden Verb wird als wiederholte liebevolle Handlung wiedergegeben.
- source_word: εὐλογίας
  choice: Segnungen
  rationale: Dies ist die direkte Bedeutung des überlieferten griechischen Wortes; die englische Konsultationsfassung „prayers“ wird nicht ohne griechische Grundlage übernommen.
theological_decisions:
- issue: Unausgesprochenes Subjekt in Rahels Wunsch (δοίη)
  choice: Passivische Formulierung „Möge mir … geschenkt werden“
  alternative: „Möge Gott mir … geben“
  rationale: Der Wunsch kann Gott als Handelnden voraussetzen, doch der griechische Satz nennt ihn nicht ausdrücklich. Die passive Wiedergabe bewahrt diese Offenheit.
- issue: Naftalis Aussage über sein sterbendes Fleisch
  choice: Die sachlich und theologisch auffällige Wendung „mein Fleisch ist gestorben“ bleibt stehen.
  alternative: „Mein Körper versagte und starb“ oder „Meine körperliche Kraft schwand“
  rationale: Der Ausgangstext enthält nur σάρξ und ἀπέθανεν. Eine Erklärung als bloßes körperliches Versagen würde die Spannung zwischen dieser Aussage und seinem anschließenden Reden eigenmächtig auflösen.
- issue: Rahels Handeln gegenüber Jakob
  choice: „mit List vorgegangen“
  alternative: „klug gehandelt“ oder „arglistig gehandelt“
  rationale: Die Übersetzung bewahrt die mögliche negative Färbung von πανουργία, ohne Rahels Motiv moralisch oder konfessionell weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählsyntax und direkter Rede. Traditionelle biblische Namen und Begriffe bleiben erkennbar, archaische Verbformen werden vermieden. Auffällige Aussagen des griechischen Textes werden nicht durch harmonisierende Paraphrasen beseitigt.
