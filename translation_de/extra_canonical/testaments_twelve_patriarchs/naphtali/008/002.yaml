source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 2. Καὶ ὑμεῖς Γοὖν⁵, ἐντείλασθε τοῖς τέκνοις ὑμῶν⁶ ἵνα ἑνοῦνται τῷ Λευὶ καὶ τῷ⁷ Ἰούδα. Διὰ γὰρ †τοῦ Ἰούδα†⁸ ἀνατελεῖ⁹ ἡ¹⁰ σωτηρία¹¹ τῷ Ἰσραὴλ¹², καὶ ἐν †αὐτῷ¹³ εὐλογηθήσεται¹⁴ Ἰακώβ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/002.yaml
  text: And now, behold, command your children that they be united with Levi and with Judah. For through Judah salvation will arise for Israel, and in him Jacob will be blessed.
translation:
  language: de
  text: Darum gebietet auch ihr euren Kindern, sich mit Levi und Juda zu vereinen. Denn durch Juda[a] wird für Israel das Heil aufgehen, und in ihm[b] wird Jakob gesegnet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text ist bei „durch Juda“ textkritisch unsicher.
    reason: Die Edition kennzeichnet τοῦ Ἰούδα in der Wendung διὰ τοῦ Ἰούδα mit Kreuzen als unsichere beziehungsweise verderbte Lesart.
  - marker: b
    text: Der griechische Text ist bei „in ihm“ textkritisch unsicher; wahrscheinlich bezieht sich die Wendung auf Juda.
    reason: Die Edition kennzeichnet αὐτῷ mit Kreuzen. Die Anmerkung weist auf die textkritische Unsicherheit hin, ohne den möglichen Bezug im Haupttext festzulegen.
lexical_decisions:
- source_word: ἐντείλασθε
  choice: gebietet
  rationale: Der Imperativ bezeichnet eine verbindliche Anweisung; „gebietet“ bewahrt diese Stärke in würdigem, verständlichem Deutsch.
- source_word: ἑνοῦνται
  choice: sich … zu verbinden
  rationale: Gibt das Einswerden beziehungsweise Sich-Zusammenschließen mit Levi und Juda natürlich wieder, ohne die Art der Einheit näher festzulegen.
- source_word: ἀνατελεῖ
  choice: wird … aufgehen
  rationale: Bewahrt das Bild des Aufgehens oder Hervortretens, das häufig vom Licht oder einem Gestirn gebraucht wird, statt es zum bloßen „kommen“ abzuschwächen.
- source_word: ἡ σωτηρία
  choice: das Heil
  rationale: Umfasst Rettung und heilbringendes Wohlergehen und entspricht dem feierlichen theologischen Zusammenhang.
- source_word: εὐλογηθήσεται
  choice: wird … gesegnet werden
  rationale: Gibt das griechische Passiv formal wieder und lässt den Segnenden, wie im Ausgangstext, ungenannt.
theological_decisions:
- issue: Vermittlung des Heils durch Juda
  choice: „durch Juda wird für Israel das Heil aufgehen“
  alternative: „von Juda her wird Israel Rettung erfahren“
  rationale: Die gewählte Fassung bewahrt sowohl die vermittelnde Wendung διά als auch das Bild von ἀνατέλλω und legt nicht fest, auf welche Person oder welches Ereignis sich das Heil bezieht.
- issue: Bezug von „in ihm“
  choice: Das männliche Pronomen bleibt als „in ihm“ stehen.
  alternative: Explizite Auflösung als „in Juda“ oder Bezug auf eine bestimmte kommende Person
  rationale: Der griechische Text verwendet ein Pronomen, dessen Bezug im unmittelbaren Zusammenhang zwar wahrscheinlich Juda ist, aber nicht ausdrücklich wiederholt wird. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, wird aber idiomatisch geglättet. Das bildhafte „aufgehen“ und das unbestimmte Passiv „gesegnet werden“ bewahren Sprachbild und theologische Offenheit des Ausgangstextes.
