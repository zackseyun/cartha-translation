  naturalness: Die Formulierung ist insgesamt verständlich und würdig. „Darum gebietet auch ihr“ bildet die folgernde Kraft von οὖν etwas natürlicher ab als „So gebietet auch ihr“. „Sich ... zu vereinen“ ist idiomatisch und wahrt die im griechischen ἑνοῦνται enthaltene allgemeine Aussage der Einheit.
  terminology: „Heil“, „aufgehen“, „gesegnet werden“, „Levi“, „Juda“ und „Jakob“ sind angemessen. Die Pronomenübersetzung „in ihm“ bewahrt die im überlieferten Text markierte Unsicherheit, ohne eine bestimmte messianische oder sonstige Auslegung festzulegen.
