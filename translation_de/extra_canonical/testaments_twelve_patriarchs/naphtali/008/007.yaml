source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 7. Καὶ γὰρ⁴⁷ αἱ ἐντολαὶ τοῦ νόμου⁴⁸ διπλαῖ εἰσιν Γκαὶ¹⁴⁹ μετὰ τέχνης πληροῦνται⁵⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/007.yaml
  text: For the commandments of the law are twofold, and they are fulfilled with skill.
translation:
  language: de
  text: Denn auch die Gebote des Gesetzes sind zweifach und werden mit Geschick erfüllt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Denn auch
  rationale: Gibt sowohl die begründende Funktion von γάρ als auch die hinzufügende beziehungsweise verstärkende Nuance von καί wieder.
- source_word: αἱ ἐντολαὶ τοῦ νόμου
  choice: die Gebote des Gesetzes
  rationale: Nahe, idiomatische Entsprechung der griechischen Genitivverbindung.
- source_word: διπλαῖ
  choice: zweifach
  rationale: Bewahrt die Aussage der Doppelheit, ohne näher festzulegen, worin diese besteht.
- source_word: μετὰ τέχνης
  choice: mit Geschick
  rationale: Gibt die Bedeutung von τέχνη als kundiges, gekonntes Handeln in natürlichem modernem Deutsch wieder, ohne den Ausdruck auf Kunst im heutigen engeren Sinn zu beschränken.
- source_word: πληροῦνται
  choice: werden … erfüllt
  rationale: Entspricht dem griechischen Passiv und bewahrt den üblichen Sprachgebrauch für das Erfüllen von Geboten.
theological_decisions:
- issue: Bedeutung der Zweifachheit der Gebote
  choice: Die unbestimmte Aussage „sind zweifach“ bleibt stehen.
  alternative: Die Zweifachheit durch eine konkrete Deutung, etwa äußerlich und innerlich, zu erklären.
  rationale: Der griechische Vers nennt die beiden Aspekte nicht; eine nähere Bestimmung würde eine Auslegung in den Text eintragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; knapp und nahe an der griechischen Satzstruktur. „Mit Geschick“ ist allgemeinverständlich und lässt den genauen Charakter der geforderten τέχνη offen.
