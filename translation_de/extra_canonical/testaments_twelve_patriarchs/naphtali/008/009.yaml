revisions:
- from: 9 Und beide sind von Gott[a]. Wenn sie nicht in der ihnen eigenen Ordnung geschehen, bewirken sie unter den Menschen sehr große Sünde. Ebenso verhält es sich auch mit den übrigen Geboten.
  to: 9 Und beide sind von Gott[a]. Wenn sie nicht in der ihnen eigenen Ordnung geschehen, haben sie für die Menschen eine äußerst große Sünde zur Folge. Ebenso verhält es sich auch mit den übrigen Geboten.
  rationale: Die Revision präzisiert den Bezug von τοῖς ἀνθρώποις durch „für die Menschen“ und verstärkt die Wiedergabe von μεγίστην. Sie bewahrt den konditionalen, allgemein gehaltenen Charakter der Aussage und legt weder die „Ordnung“ als ausdrücklich göttlich fest noch bestimmt sie die beiden zuvor genannten Größen näher.
