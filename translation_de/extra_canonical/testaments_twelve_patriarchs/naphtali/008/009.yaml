source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 9. Καὶ *αἱ δύο τοῦ Θεοῦ εἰσι⁵⁵, καὶ εἰ μὴ ἐγένοντο⁵⁶ ἐν τῇ⁵⁷ τάξει αὐτῶν ἁμαρτίαν *μεγίστην παρεῖχον τοῖς ἀνθρώποις· τὸ αὐτὸ⁵⁸ καὶ *ἐπὶ τῶν λοιπῶν ἐντολῶν⁵⁹ ἐστι⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/009.yaml
  text: And both are from God, and if they do not occur in their proper order, they bring very great sin upon men. The same is true also of the rest of the commandments.
translation:
  language: de
  text: 9 Und beide sind von Gott[a]. Wenn sie nicht in der ihnen eigenen Ordnung geschehen, haben sie für die Menschen eine äußerst große Sünde zur Folge. Ebenso verhält es sich auch mit den übrigen Geboten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: gehören Gott.'
    reason: Der griechische Genitiv τοῦ Θεοῦ kann hier Herkunft oder Zugehörigkeit bezeichnen.
lexical_decisions:
- source_word: αἱ δύο
  choice: beide
  rationale: Bewahrt den Rückbezug auf die zwei zuvor genannten Größen; das feminine Genus des Griechischen lässt sich im Deutschen ohne die Bezugswörter nicht eigens abbilden.
- source_word: τοῦ Θεοῦ εἰσι
  choice: sind von Gott
  rationale: Gibt den Genitiv knapp und offen wieder; je nach Kontext kann er Herkunft oder Zugehörigkeit ausdrücken.
- source_word: ἐν τῇ τάξει αὐτῶν
  choice: in der ihnen eigenen Ordnung
  rationale: Entspricht wörtlich ihrer Ordnung und vermeidet, über den griechischen Text hinaus eine bestimmte normative Deutung einzutragen.
- source_word: ἁμαρτίαν μεγίστην παρεῖχον τοῖς ἀνθρώποις
  choice: bewirken sie unter den Menschen sehr große Sünde
  rationale: Gibt die starke Steigerung μεγίστην wieder und formuliert die verursachende Bedeutung von παρέχω im Deutschen verständlich, ohne die Sünde bestimmten einzelnen Personen zuzuschreiben.
- source_word: τὸ αὐτὸ καὶ ἐπὶ τῶν λοιπῶν ἐντολῶν ἐστι
  choice: Ebenso verhält es sich auch mit den übrigen Geboten
  rationale: Natürliche deutsche Wiedergabe der idiomatischen Aussage, dass derselbe Grundsatz für die anderen Gebote gilt.
theological_decisions:
- issue: Bedeutung des Genitivs in τοῦ Θεοῦ εἰσι
  choice: sind von Gott
  alternative: gehören Gott
  rationale: Die Hauptfassung lässt sowohl göttliche Herkunft als auch Zugehörigkeit anklingen; die alternative grammatische Möglichkeit wird in einer Fußnote bewahrt.
- issue: Beziehung zwischen Ordnung und Sünde
  choice: 'Die Aussage bleibt konditional und allgemein: Außerhalb ihrer Ordnung bewirken beide sehr große Sünde.'
  alternative: Die Ordnung ausdrücklich als von Gott festgesetzt oder die beiden Dinge selbst als sündig bezeichnen.
  rationale: Der Vers nennt weder den Urheber der Ordnung ausdrücklich noch erklärt er die beiden Dinge an sich für sündig; diese Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah am griechischen Gedankengang, während idiomatisch schwerfällige Wendungen natürlich formuliert werden.
