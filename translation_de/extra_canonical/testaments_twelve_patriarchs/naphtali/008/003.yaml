  source_fidelity: 'Der Entwurf gibt alle Bestandteile des griechischen Satzes wieder: das instrumentale „durch sein Zepter“, Gottes Erscheinen auf der Erde, das Wohnen unter den Menschen, den Zweck der Rettung Israels sowie das Sammeln der Gerechten aus den Völkern. „Volk Israel“ ist für τὸ γένος τοῦ Ἰσραήλ idiomatisch und vermeidet die im heutigen Deutsch unangemessene und missverständliche Wiedergabe „Rasse“.'
