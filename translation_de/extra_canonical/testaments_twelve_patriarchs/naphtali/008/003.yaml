  terminology: „Zepter“, „Gott“, „Volk Israel“, „Gerechten“ und „Völker“ sind sachgerecht. Die offene Referenz von „sein“ und die nicht weiter festgelegte Bedeutung der Gerechten aus den Völkern bleiben erhalten. Die eckig gesetzte Passage der vorgelegten griechischen Edition wird entsprechend dem englischen Audit-Text übersetzt; ohne überlieferte Varianten- oder Ankerinformationen ist keine Fußnote erforderlich.
