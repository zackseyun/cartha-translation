id: T12P.NAP.8.3
reference: Testament of Naphtali 8:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 3. Διὰ¹⁵ †τοῦ σκήπτρου αὐτοῦ¹⁶ ὀφθήσεται ὁ¹⁷ Θεὸς [κατοικῶν ἐν ἀνθρώποις¹⁸] ἐπὶ τῆς γῆς, τοῦ¹⁹ σῶσαι *τὸ γένος τοῦ²⁰ Ἰσραήλ, *καὶ ἐπισυνάξει²¹ δικαίους ἐκ τῶν²² ἐθνῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/003.yaml
  text: Through his scepter God will appear on the earth, dwelling among men, to save the people of Israel, and he will gather the righteous from among the nations.
translation:
  language: de
  text: Durch sein Zepter wird Gott auf der Erde erscheinen und unter den Menschen wohnen, um das Volk Israel zu retten; und er wird die Gerechten aus den Völkern sammeln.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦ σκήπτρου αὐτοῦ
  choice: Durch sein Zepter
  rationale: Bewahrt das instrumentale διά und das königliche Bild des Zepters, ohne dessen Bezug über den griechischen Wortlaut hinaus festzulegen.
- source_word: ὀφθήσεται
  choice: wird … erscheinen
  rationale: Gibt die sichtbare Offenbarung Gottes natürlich und sachgerecht wieder.
- source_word: κατοικῶν ἐν ἀνθρώποις
  choice: und unter den Menschen wohnen
  rationale: Das Partizip wird als koordinierte Begleithandlung wiedergegeben; »unter« entspricht idiomatischem Deutsch für das Wohnen inmitten von Menschen.
- source_word: τὸ γένος τοῦ Ἰσραήλ
  choice: das Volk Israel
  rationale: γένος bezeichnet hier die durch Abstammung verbundene Gemeinschaft Israels; »Volk« ist im Deutschen natürlicher und vermeidet die irreführende moderne Konnotation von »Rasse«.
- source_word: ἐπισυνάξει δικαίους ἐκ τῶν ἐθνῶν
  choice: wird die Gerechten aus den Völkern sammeln
  rationale: Bewahrt sowohl die bestimmte Gruppe der Gerechten als auch die Mehrdeutigkeit von ἔθνη, das hier allgemein die Völker beziehungsweise nichtisraelitischen Nationen bezeichnet.
theological_decisions:
- issue: Bezug des Possessivpronomens in »sein Zepter«
  choice: Das Pronomen bleibt unbestimmt wie im vorliegenden Vers.
  alternative: Explizite Identifikation des Trägers des Zepters, etwa als Messias oder Juda.
  rationale: Der isolierte griechische Wortlaut nennt den Bezug nicht ausdrücklich; eine theologische Identifikation würde die genuine Kontextabhängigkeit auflösen.
- issue: Verhältnis von Gottes Erscheinen und Wohnen unter den Menschen
  choice: Beide Aussagen werden eng verbunden, ohne sie dogmatisch näher zu bestimmen.
  alternative: »Gott wird als einer erscheinen, der unter den Menschen wohnt« oder eine ausdrücklich inkarnatorische Formulierung.
  rationale: Das griechische Partizip erlaubt eine enge Verbindung, legt aber die genaue theologische Art dieser Gegenwart nicht fest.
- issue: Identität der Gerechten aus den Völkern
  choice: »die Gerechten aus den Völkern«
  alternative: »die gerechten Heiden« oder »die Gerechten unter den Nationen«.
  rationale: Die Übersetzung erhält die Spannung zwischen Israel und den Völkern, ohne »Gerechte« konfessionell oder ethnisch enger zu definieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, wird aber durch die koordinierte Wiedergabe des Partizips und ein Semikolon lesbar gestaltet. Keine textkritischen Zeichen aus der Edition werden als Fußnoten übernommen, da keine Variantenangaben mitgeliefert wurden.
