id: T12P.NAP.8.8
reference: Testament of Naphtali 8:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 8. Καιρὸς γὰρ συνουσίας⁵¹ γυναικός⁵², καὶ καιρὸς ἐγκρατείας⁵³ εἰς προσευχὴν αὐτοῦ⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/008.yaml
  text: For there is a time for a man to come together with a woman, and a time for self-control for his prayer.
translation:
  language: de
  text: Denn es gibt eine Zeit, mit einer Frau zusammenzukommen, und eine Zeit, sich für sein Gebet zu enthalten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνουσίας γυναικός
  choice: mit einer Frau zusammenzukommen
  rationale: Die natürliche deutsche Wendung wahrt den zurückhaltenden Ausdruck des Griechischen für die sexuelle Gemeinschaft, ohne ihn unnötig zu vergröbern oder abzuschwächen.
- source_word: ἐγκρατείας
  choice: sich … zu enthalten
  rationale: Im unmittelbaren Gegensatz zur ehelichen beziehungsweise sexuellen Gemeinschaft bezeichnet ἐγκράτεια hier konkret Enthaltsamkeit; die verbale Form klingt im Deutschen natürlicher als ein abstraktes Substantiv.
- source_word: εἰς προσευχὴν αὐτοῦ
  choice: für sein Gebet
  rationale: Die Formulierung erhält sowohl die Zweckbeziehung von εἰς als auch das Possessivpronomen αὐτοῦ, ohne näher festzulegen, auf welche konkrete Gebetspraxis es sich bezieht.
theological_decisions:
- issue: Verhältnis von sexueller Gemeinschaft, Enthaltsamkeit und Gebet
  choice: Beide haben ihre jeweilige Zeit; Enthaltsamkeit wird auf das Gebet bezogen.
  alternative: Sexuelle Gemeinschaft grundsätzlich als unvereinbar mit Gebet oder als minderwertig darzustellen.
  rationale: Der griechische Parallelismus spricht von unterschiedlichen Zeiten und begründet keine allgemeine Abwertung sexueller Gemeinschaft.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zurückhaltende Umschreibung „zusammenzukommen“ entspricht dem euphemistischen Charakter des Ausgangstextes; „sich … zu enthalten“ macht den situationsbezogenen Sinn von ἐγκράτεια klar.
