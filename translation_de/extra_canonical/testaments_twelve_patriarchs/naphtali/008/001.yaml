base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/001.yaml
  text: And behold, my children, I have shown you the times, that all will happen in Israel.
translation:
  language: de
  text: 'Und seht, meine Kinder: Ich habe euch die letzten Zeiten gezeigt[a]: Alles wird in Israel geschehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Satzverbindung mit „dass/weil“ (ὅτι) ist hier textkritisch unsicher; wörtlich etwa: „Ich habe euch die letzten Zeiten gezeigt, dass alles in Israel geschehen wird.“'
    reason: Das kritische Zeichen steht vor ὅτι. Der Doppelpunkt lässt die genaue logische Verbindung offen, ohne die beiden Satzteile inhaltlich zu verändern.
lexical_decisions:
- source_word: ἰδού
  choice: seht
  rationale: Gibt den aufmerksamkeitslenkenden Ausruf natürlich und würdig wieder.
- source_word: καιροὺς ἐσχάτους
  choice: die letzten Zeiten
  rationale: Bewahrt sowohl den Zeitbegriff von καιρούς als auch die endzeitliche Färbung von ἐσχάτους, die in der englischen Konsultationsfassung nicht wiedergegeben ist.
- source_word: ὑπέδειξα
  choice: vor Augen gestellt
  rationale: Vermittelt hier das offenbarende bzw. aufzeigende Moment natürlicher als das rein visuelle „gezeigt“.
- source_word: πάντα γενήσεται
  choice: Alles wird … geschehen
  rationale: Gibt πάντα ohne den nicht ausdrücklich vorhandenen Zusatz „dies“ und γενήσεται als zukünftiges Geschehen wieder.
theological_decisions:
- issue: Bezug der „letzten Zeiten“ auf Israel
  choice: Alles wird in Israel geschehen.
  alternative: Alles dies wird Israel widerfahren.
  rationale: ἐν Ἰσραήλ bezeichnet zunächst den Bereich, in dem das Geschehen stattfindet. Eine Deutung Israels ausschließlich als betroffenes Objekt oder eine nähere Bestimmung des endzeitlichen Geschehens wäre eine nicht ausdrücklich im Text enthaltene Festlegung.
translation_notes:
  register: Modernes, allgemein verständliches Hochdeutsch mit würdigem testamentarischem Ton. Die direkte Anrede „meine Kinder“ und der Ausruf „seht“ bleiben erhalten; die unsichere Syntax wird transparent durch eine Fußnote ausgewiesen.
