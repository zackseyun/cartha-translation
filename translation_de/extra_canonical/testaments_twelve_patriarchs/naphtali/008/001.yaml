  source_fidelity: 'Die Übersetzung gibt die wesentlichen Elemente wieder: die Anrede, die „letzten Zeiten“ (καιροὺς ἐσχάτους), das Zeigen und das zukünftige Geschehen „in Israel“. „Vor Augen gestellt“ ist jedoch eine stärkere, idiomatisch freiere Wiedergabe von ὑπέδειξα als das hier ausreichende „gezeigt“. Die textkritisch markierte Verbindung mit ὅτι soll durch die Anmerkung ausdrücklich bei der Satzverknüpfung verortet werden.'
  naturalness: „Und seht, meine Kinder“ ist verständliches modernes Hochdeutsch mit angemessen feierlichem Ton. „Ich habe euch die letzten Zeiten gezeigt“ ist natürlicher und unmittelbarer als „vor Augen gestellt“. Der Doppelpunkt wahrt die syntaktische Unsicherheit, ohne einen bestimmten logischen Zusammenhang zu behaupten.
  terminology: „Letzte Zeiten“ bewahrt den Plural und die eschatologische Färbung von καιροὺς ἐσχάτους. „Alles wird in Israel geschehen“ entspricht πάντα γενήσεται ἐν Ἰσραήλ und fügt weder ein Objekt wie „dies alles“ noch eine konfessionelle Deutung hinzu.
