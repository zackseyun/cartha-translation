    rationale: Ὑπέδειξα bedeutet hier schlicht „ich zeigte/habe gezeigt“ bzw. „ich wies vor“. „Gezeigt“ ist quellennäher und im Deutschen ebenso idiomatisch.
  - severity: medium
    issue: Die Fußnotenverankerung sollte die unsichere griechische Verbindung ὅτι markieren, nicht den Vorgang des Zeigens selbst.
    rationale: Das kritische Zeichen steht vor ὅτι. Eine Ankerposition nach „gezeigt“ und vor dem Doppelpunkt macht deutlich, dass die Satzverknüpfung, nicht das Verb ὑπέδειξα, textkritisch betroffen ist.
