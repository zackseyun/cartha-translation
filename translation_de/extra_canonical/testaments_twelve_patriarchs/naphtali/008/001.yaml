- from: 'Und seht, meine Kinder: Ich habe euch die letzten Zeiten vor Augen gestellt[a]: Alles wird in Israel geschehen.'
  to: 'Und seht, meine Kinder: Ich habe euch die letzten Zeiten gezeigt[a]: Alles wird in Israel geschehen.'
  rationale: „Gezeigt“ ersetzt die freiere Formulierung „vor Augen gestellt“. Die Fußnote wird unmittelbar nach „gezeigt“ verankert, um die im griechischen Text markierte, unsichere Verbindung mit ὅτι präzise auszuweisen. Der Doppelpunkt und die sonstige Satzstruktur bleiben erhalten, weil sie keine nicht abgesicherte Deutung der problematischen Verbindung erzwingen.
