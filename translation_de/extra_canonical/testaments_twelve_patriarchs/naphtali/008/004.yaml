base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/004.yaml
  text: Therefore, if you also do what is good, people and angels will bless you, and God will be glorified among the nations through you, and the devil will flee from you, and the wild beasts will fear you, and the Lord will love you, and the angels will stand by you.
translation:
  language: de
  text: Wenn also auch ihr das Gute tut, werden euch die Menschen und die Engel segnen. Gott wird durch euch unter den Völkern verherrlicht werden, der Teufel wird vor euch fliehen, und die wilden Tiere werden sich vor euch fürchten. Der Herr wird euch lieben, und die Engel werden euch beistehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „und die Engel werden euch beistehen“ fehlen in einem Teil der Textüberlieferung beziehungsweise gelten in der zugrunde gelegten Ausgabe als textkritisch unsicher.
    reason: Die griechische Edition setzt καὶ οἱ ἄγγελοι ἀνθέξονται ὑμῶν in eckige Klammern.
lexical_decisions:
- source_word: ἐργάσησθε τὸ καλόν
  choice: das Gute tut
  rationale: Gibt die konkrete ethische Wendung natürlich und zugleich eng am griechischen Wortlaut wieder.
- source_word: οἱ ἄνθρωποι
  choice: die Menschen
  rationale: Entspricht dem allgemeinen, geschlechtsübergreifenden Sinn von ἄνθρωποι.
- source_word: δοξασθήσεται
  choice: wird verherrlicht werden
  rationale: Bewahrt das Passiv und den theologischen Gehalt des Verbs δοξάζω.
- source_word: τὰ θηρία
  choice: die wilden Tiere
  rationale: Gibt θηρία im Kontext klarer wieder als das allgemeinere „Tiere“.
- source_word: ἀνθέξονται ὑμῶν
  choice: werden euch beistehen
  rationale: Die Konstruktion mit Genitiv bezeichnet hier ein Festhalten an jemandem beziehungsweise unterstützendes Beistehen; die deutsche Formulierung ist idiomatisch.
theological_decisions:
- issue: Verhältnis menschlichen guten Handelns zu Segen und Gottes Verherrlichung
  choice: Die konditionale Folge bleibt ohne dogmatische Abschwächung stehen.
  alternative: Die Aussage durch Zusätze wie „zum Zeichen dafür“ oder „als Lohn“ erklären.
  rationale: Der griechische Text nennt Folgen des guten Handelns, bestimmt aber ihr genaues soteriologisches Verhältnis nicht.
- issue: Handelnde beim Segnen
  choice: Menschen und Engel segnen die Angesprochenen.
  alternative: „über euch Gutes sagen“ oder eine Umschreibung mit Gott als eigentlichem Segnenden.
  rationale: Das Subjekt und das Verb εὐλογήσουσιν werden direkt wiedergegeben, ohne die Aussage theologisch umzudeuten.
- issue: Textkritisch unsicherer Schlusssatz
  choice: Der Satz wird aufgenommen und mit einer Fußnote als textkritisch unsicher gekennzeichnet.
  alternative: Den eingeklammerten Satz aus dem Haupttext auslassen.
  rationale: Die vorgelegte Edition führt ihn in eckigen Klammern; die englische Konsultationsfassung nimmt ihn auf. Die Fußnote bewahrt die Überlieferungsunsicherheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange griechische Satzkette wurde zur besseren Verständlichkeit in drei Sätze gegliedert, ohne die logische Abfolge zu verändern. „Wenn also auch ihr“ bewahrt sowohl die Folgerung als auch die Betonung von καὶ ὑμεῖς.
