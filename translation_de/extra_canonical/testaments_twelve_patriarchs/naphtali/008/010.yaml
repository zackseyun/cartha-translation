source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 10. Γίνεσθε οὖν *σοφοὶ ἐν θεῷ, τέκνα μου⁶¹, καὶ φρόνιμοι, ἰδόντες⁶² τάξιν ἐντολῶν⁶³ αὐτοῦ⁶⁴ καὶ θεσμοὺς παντὸς πράγματος⁶⁵, ὅπως *ἀγαπήσει ὑμᾶς ὁ Κύριος⁶⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/010.yaml
  text: Therefore become wise in God, my children, and prudent, perceiving the order of his commandments and the ordinances of every matter, so that the Lord may love you.
translation:
  language: de
  text: Darum werdet weise in Gott, meine Kinder, und verständig, indem ihr die Ordnung seiner Gebote und die Satzungen für jede Sache erkennt, damit der Herr euch liebt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σοφοὶ ἐν θεῷ
  choice: weise in Gott
  rationale: Die ungewöhnliche, theologisch offene Verbindung mit ἐν wird quellennah bewahrt, statt sie etwa zu „vor Gott“ oder „durch Gott“ zu vereindeutigen.
- source_word: φρόνιμοι
  choice: verständig
  rationale: Bezeichnet praktische Einsicht und Besonnenheit; „verständig“ ist im modernen Deutschen natürlich und vom vorausgehenden „weise“ unterscheidbar.
- source_word: ἰδόντες
  choice: indem ihr … erkennt
  rationale: Das Partizip bezeichnet ein wahrnehmendes Erfassen; „erkennt“ gibt dies idiomatisch wieder, ohne es auf bloßes Sehen zu beschränken.
- source_word: τάξιν ἐντολῶν αὐτοῦ
  choice: die Ordnung seiner Gebote
  rationale: Gibt τάξις formal als geordnete Struktur oder Ordnung wieder und wahrt den Genitiv.
- source_word: θεσμοὺς παντὸς πράγματος
  choice: die Satzungen für jede Sache
  rationale: θεσμός wird als verbindliche Festsetzung wiedergegeben. Der Genitiv παντὸς πράγματος lässt sich im Deutschen natürlich als Geltungsbezug „für jede Sache“ ausdrücken, ohne die Wendung inhaltlich enger festzulegen.
- source_word: ὅπως ἀγαπήσει ὑμᾶς ὁ Κύριος
  choice: damit der Herr euch liebt
  rationale: Bewahrt den finalen Sinn von ὅπως und die theologische Spannung, dass die Liebe des Herrn hier als Ziel gehorsamer Weisheit formuliert wird.
theological_decisions:
- issue: Bedeutung von ἐν θεῷ
  choice: in Gott
  alternative: vor Gott / durch Gott / in Bezug auf Gott
  rationale: Die griechische Präposition ist mehrdeutig. Die formnahe Wiedergabe verhindert eine unbelegte Festlegung auf Sphäre, Maßstab oder Urheber.
- issue: Liebe des Herrn als Zweck oder Folge
  choice: damit der Herr euch liebt
  alternative: sodass der Herr euch lieben wird
  rationale: ὅπως markiert hier am ehesten einen Zweck; die Übersetzung glättet die daraus entstehende theologische Spannung nicht.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit quellennaher Satzstruktur. „Satzungen“ ist bewusst gehobener als Alltagssprache, entspricht aber dem rechtlich-normativen Gehalt von θεσμοί. Keine Fußnoten erforderlich.
