base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/005.yaml
  text: As when someone has reared a child well, he has a good remembrance of him, so also for a good work there is a good remembrance before God.
translation:
  language: de
  text: Wie jemand, der ein Kind gut aufgezogen hat, eine gute Erinnerung an dieses Kind hat,[a] so gibt es auch bei Gott für ein gutes Werk eine gute Erinnerung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »hat ein gutes Gedenken«. Die griechische Formulierung ist knapp; in der zweiten Satzhälfte kann »bei Gott« sowohl die Sphäre als auch den Bezug des Gedenkens bezeichnen.'
    reason: Erläutert die idiomatische Wiedergabe von μνείαν ἔχει καλήν und bewahrt die Nuance von παρὰ Θεοῦ, ohne den Sinn über den griechischen Wortlaut hinaus festzulegen.
lexical_decisions:
- source_word: ἐκθρέψῃ καλῶς
  choice: gut aufgezogen hat
  rationale: Gibt die vollendete, fürsorgliche Erziehung eines Kindes in natürlichem modernem Deutsch wieder.
- source_word: μνείαν ἔχει καλήν / μνήμη … ἀγαθή
  choice: in guter Erinnerung bleibt
  rationale: Bewahrt die Wiederholung und den Vergleich beider Satzhälften, ohne das im Deutschen unnatürliche »hat ein gutes Gedenken« wörtlich nachzubilden.
- source_word: παρὰ Θεοῦ
  choice: bei Gott
  rationale: Entspricht der relationalen Bedeutung von παρά mit Genitiv und vermeidet eine unnötige Festlegung darauf, ob die Erinnerung ausdrücklich »von Gott« ausgeht oder »vor Gott« besteht.
theological_decisions:
- issue: Gottes Erinnern an ein gutes Werk
  choice: bei Gott in guter Erinnerung
  alternative: von Gott in guter Erinnerung behalten
  rationale: Die gewählte Formulierung bewahrt die Aussage, dass das gute Werk vor beziehungsweise bei Gott Bestand hat, ohne die knappe griechische Wendung stärker zu bestimmen als nötig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Formulierung »in guter Erinnerung bleibt« hält den rhetorischen Aufbau des griechischen Satzes sichtbar.
