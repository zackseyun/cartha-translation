source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 6. Τὸν δὲ μὴ *ποιοῦντα τὸ³⁸ καλόν, καταράσονται αὐτὸν³⁹ καὶ⁴⁰ *οἱ ἄγγελοι καὶ οἱ ἄνθρωποι⁴¹, *καὶ ὁ Θεὸς ἀδοξήσει ἐν τοῖς ἔθνεσιν διʼ αὐτοῦ⁴², *καὶ ὁ⁴³ διάβολος οἰκειοῦται *αὐτὸν ὡς ἴδιον σκεῦος⁴⁴, καὶ πᾶν θηρίον κατακυριεύσει αὐτῷ⁴⁵, καὶ⁴⁶ ὁ Κύριος μισήσει αὐτόν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/008/006.yaml
  text: But the one who does not do good, angels and men will curse him, and God will be dishonored among the nations through him, and the devil claims him as his own vessel, and every wild beast will lord it over him, and the Lord will hate him.
translation:
  language: de
  text: Wer aber nicht das Gute tut, den werden sowohl die Engel als auch die Menschen verfluchen. Durch ihn wird Gott unter den Völkern entehrt werden; der Teufel nimmt ihn als sein eigenes Gefäß in Besitz, jedes wilde Tier wird über ihn herrschen, und der Herr wird ihn hassen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ καλόν
  choice: das Gute
  rationale: Gibt den substantivierten griechischen Ausdruck knapp, natürlich und in seiner ethischen Bedeutung wieder.
- source_word: ἀδοξήσει
  choice: wird … entehrt werden
  rationale: Bewahrt den passivischen Sinn, dass Gott durch das Verhalten dieses Menschen unter den Völkern der Ehre beraubt wird.
- source_word: οἰκειοῦται
  choice: nimmt … in Besitz
  rationale: Drückt die Aneignung beziehungsweise Inanspruchnahme als Eigentum aus, ohne die Aussage abzuschwächen.
- source_word: σκεῦος
  choice: Werkzeug
  rationale: Im Kontext bezeichnet das Wort eine Person als Mittel im Dienst des Teufels; „Werkzeug“ ist im Deutschen natürlicher als das wörtliche „Gefäß“ und erhält den funktionalen Sinn.
- source_word: κατακυριεύσει
  choice: wird über … herrschen
  rationale: Gibt die starke Vorstellung von Herrschaft und Überwältigung direkt wieder.
- source_word: μισήσει
  choice: wird … hassen
  rationale: Bewahrt die Härte und theologische Spannung des griechischen Verbs, statt sie durch „verwerfen“ oder „missbilligen“ zu mildern.
theological_decisions:
- issue: Gottes Hass gegenüber dem Übeltäter
  choice: der Herr wird ihn hassen
  alternative: der Herr wird ihn verwerfen
  rationale: Das griechische μισήσει bedeutet ausdrücklich „wird hassen“. Die schwierige theologische Aussage wird nicht erklärend abgeschwächt.
- issue: Entehrung Gottes durch einen Menschen
  choice: Durch ihn wird Gott unter den Völkern entehrt werden
  alternative: Durch ihn verliert Gott unter den Völkern sein Ansehen
  rationale: Die gewählte Fassung hält den Bezug auf Gottes Ehre fest und bewahrt die Aussage, dass das Verhalten des Menschen Anlass zur Entehrung Gottes unter den Völkern gibt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange griechische Satzfolge wurde zur besseren Lesbarkeit in zwei Sätze gegliedert; die kumulative Steigerung und die harten Aussagen des Ausgangstextes bleiben erhalten.
