  footnotes:
  - marker: a
    text: Der griechische Text am Kapitelanfang ist in der Überlieferung gestört. Klar erkennbar ist der Vergleich Naftalis mit einer leichtfüßigen Hirschkuh und seine Eignung für Botengänge.
    reason: textual_variant
  - marker: b
    text: Der erhaltene griechische Text lautet hier wörtlich „sein Wort“. Andere Fassungen verstehen die Stelle im Sinn von „sein Werk“ oder „sein Tun“.
    reason: textual_variant
  - marker: c
    text: Beliar ist in jüdischen testamentarischen Schriften ein überlieferter Name für die Macht, die Gott und seinem Gesetz entgegensteht.
    reason: cultural_note
  - marker: d
    text: Die Lesart ist unsicher. „Sehen und Hören“ passt zum folgenden Gedankengang über die unterschiedlichen Aufgaben der Sinne und Körperteile.
    reason: textual_variant
  - marker: e
    text: Der letzte Satz des Verses ist textlich stark gestört. Gemeint ist offenbar, dass Menschen sich in ihrer jeweiligen Gestalt oder Ausprägung unterscheiden; der genaue Wortlaut bleibt unsicher.
    reason: textual_variant
  - marker: f
    text: Die Aufzählung der Körperteile ist an mehreren Stellen textlich gestört und spiegelt antike Vorstellungen über deren Aufgaben wider. Die Übersetzung folgt dem erkennbaren Sinn, ohne die Angaben als moderne Anatomie zu deuten.
    reason: textual_variant
lexical_decisions:
- source_word: κοῦφος τοῖς ποσίν ὡς ἡ ἔλαφος
  choice: leichtfüßig wie eine Hirschkuh
  rationale: κοῦφος bezeichnet hier Gewandtheit oder Leichtfüßigkeit; das feminine ἔλαφος wird als „Hirschkuh“ wiedergegeben, ohne die Bildaussage auf bloße Schnelligkeit zu verengen.
- source_word: ἀγγελία
  choice: Botengang
  rationale: Im Zusammenhang mit Jakobs Auftrag bezeichnet das Wort praktische Botendienste; „Botengang“ ist konkreter als „Botschaft“.
- source_word: πρὸς ὁμοίωσιν τοῦ πνεύματος
  choice: dem Wesen des Geistes entsprechend
  rationale: Die Formulierung bewahrt die ausgesagte Entsprechung zwischen Körper und Geist, ohne eine spätere systematische Anthropologie einzutragen.
- source_word: πρὸς τὴν δύναμιν τοῦ σώματος τὸ πνεῦμα ἐπιτίθησιν
  choice: gibt den Geist nach dem Fassungsvermögen des Körpers hinein
  rationale: δύναμις meint im Töpfervergleich das Vermögen oder die Kapazität; ἐπιτίθησιν bezeichnet das Zuweisen beziehungsweise Hineingeben.
- source_word: σταθμῷ καὶ μέτρῳ καὶ κανόνι
  choice: nach Gewicht, Maß und Richtschnur
  rationale: Die dreigliedrige Wendung betont die genaue Ordnung der Schöpfung; „Richtschnur“ gibt κανών als Maßstab anschaulich wieder.
- source_word: διαρκέσει ἐν τῷ ἀγαθῷ
  choice: im Guten bestehen wird
  rationale: Die moralische und existentielle Offenheit von ἀγαθόν bleibt erhalten; eine Verengung auf Wohlergehen oder Wohlstand wird vermieden.
- source_word: ἔννοια
  choice: Gedanke
  rationale: „Gedanke“ ist die unmittelbare Bedeutung und lässt offen, ob Absicht, Entwurf oder menschliches Denken gemeint ist.
- source_word: ὁ λόγος αὐτοῦ
  choice: sein Wort
  rationale: Der überlieferte griechische Text hat λόγος. Daher wird nicht ohne Kennzeichnung zur Lesart „Werk“ oder „Tun“ gewechselt.
- source_word: νόμῳ Κυρίου ... νόμῳ τοῦ Βελίαρ
  choice: Gesetz des Herrn ... Gesetz Beliars
  rationale: νόμος wird direkt als „Gesetz“ wiedergegeben; der Eigenname Beliar bleibt als personifizierte Gegenmacht erhalten.
- source_word: ἄτακτον ... ἔξω καιροῦ αὐτοῦ
  choice: ungeordnet ... außerhalb der dafür bestimmten Zeit
  rationale: Die Übersetzung bewahrt den Zusammenhang zwischen der geordneten Schöpfung und dem der rechten Zeit entsprechenden Handeln.
theological_decisions:
- issue: Verhältnis von Körper und Geist in 2,2–4
  choice: Die wechselseitige Entsprechung und Gottes ordnendes Handeln werden ausgesagt, ohne Körper und Geist nach einem späteren Lehrsystem zu definieren.
  alternative: Eine ausgeprägt dualistische Körper-Seele-Lehre oder eine rein physiologische Aussage
  rationale: Das Töpferbild spricht von Gestalt, Fassungsvermögen und göttlicher Zuordnung. Die Übersetzung erhält diese Spannung.
- issue: Gottes Vorherwissen und das Geraten ins Böse in 2,4–5
  choice: Der Text wird als Aussage über Gottes Kenntnis des Körpers, seiner Dauer im Guten und seines Geratens ins Böse wiedergegeben.
  alternative: Eine ausdrückliche Lehre göttlicher Vorherbestimmung zum Bösen
  rationale: Der griechische Text spricht von Wissen, nicht ausdrücklich von Verursachung oder Vorherbestimmung; diese Unterscheidung darf nicht eingeebnet werden.
- issue: Gesetz des Herrn und Gesetz Beliars
  choice: Die beiden Benennungen bleiben als gegensätzliche Bereiche moralischer Zugehörigkeit stehen.
  alternative: Beliar zu einem unpersönlichen Begriff wie „das Böse“ aufzulösen
  rationale: Im testamentarischen Schrifttum erscheint Beliar als benannte Gegenmacht. Die Übersetzung bewahrt diese literarisch-theologische Spannung.
- issue: Bild Gottes in 2,5
  choice: „jeden Menschen nach seinem eigenen Bild geschaffen“
  alternative: Die Aussage auf eine bestimmte Menschengruppe oder auf körperliche Ähnlichkeit festzulegen
  rationale: Die Formulierung hält den erkennbaren Genesisanklang fest, ohne die Art der Gottebenbildlichkeit näher zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer paränetischer Sprache. „Ehrfurcht vor Gott“ gibt den ethischen Gehalt von φόβος Θεοῦ verständlich wieder. Übersetzt wurde ausschließlich der vorgelegte griechische Abschnitt Naphtali 2,1–10; die im englischen Konsultationstext anschließenden Verse 11–18 sind in der bereitgestellten originalsprachlichen Evidenz nicht enthalten und wurden daher nicht ergänzt.
