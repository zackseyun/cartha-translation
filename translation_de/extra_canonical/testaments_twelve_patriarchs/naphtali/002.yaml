  rationale: 'Die Revision beschränkt sich auf zwei sichere Verbesserungen: V. 5 erhält eine grammatisch korrekte Wiedergabe, die sowohl „Geschöpf“ als auch „Gedanke“ umfasst; V. 2 gibt die Töpferhandlung und die Relation zwischen Körper und Geist quellennäher wieder. Der übrige Text einschließlich aller vorhandenen Fußnoten bleibt, da er die griechischen Unsicherheiten offenlegt und keine der im englischen Audit genannten interpretativen Zusätze unkritisch übernimmt.'
