  source_fidelity: 'Der Entwurf folgt dem bereitgestellten griechischen Text in Umfang und Grundgedanken zuverlässig und lässt die im englischen Audit überlieferten, aber im vorliegenden griechischen Abschnitt nicht belegten Folgeverse zu Recht aus. Eine kleine Korrektur ist in V. 5 nötig: Die koordinierte Verneinung muss im Deutschen grammatisch beide Bezugswörter erfassen. In V. 2 wird die Töpferanalogie mit „zuführt“ und die Entsprechung von Körper und Geist etwas quellennäher formuliert.'
  naturalness: Würdevolles modernes Standarddeutsch und insgesamt gut lesbar. Die Korrekturen beseitigen die grammatische Unebenheit in V. 5 und glätten V. 2, ohne den bewusst knappen, paränetischen Duktus zu verändern.
  terminology: „Herr“, „Gesetz“, „Beliar“, „Richtschnur“ und „Ehrfurcht vor Gott“ sind angemessen. „Hirschkuh“ gibt das grammatische Femininum von ἔλαφος wieder, ohne eine weitergehende Aussage zu erzwingen. Die textkritischen Hinweise zu den unsicheren Partien bleiben erforderlich.
  issues:
  - severity: medium
    issue: 'V. 5: Relativsatz nach „kein Gebilde und keinen Gedanken“'
    rationale: „den der Herr nicht kennt“ kann grammatisch nur „Gedanken“ beziehen. Der griechische Text nennt jedoch sowohl πλάσμα als auch ἔννοια. „weder ein Geschöpf noch einen Gedanken, die der Herr nicht kennt“ erfasst beide, bei weiterhin erkennbarer textlicher Rauheit der Vorlage.
  - severity: low
    issue: 'V. 2: Wiedergabe von φέρει τὸν πηλόν und πρὸς ὁμοίωσιν'
    rationale: „den Ton dafür nimmt“ ist weniger genau als die Bewegung bzw. Zufuhr des Tons zum Gefäß. „in Entsprechung zum Geist“ bewahrt die Vergleichsrelation von ὁμοίωσις natürlicher als „dem Wesen des Geistes entsprechend“, das „Wesen“ zusätzlich konkretisiert.
  revised_text: '## Das Testament Naftalis 2


    **1.** Ich war leichtfüßig wie eine Hirschkuh[a], und mein Vater Jakob bestimmte mich für jeden Botengang; ja, er segnete mich wie eine Hirschkuh.


    **2.** Denn wie der Töpfer weiß, wie viel ein Gefäß fassen kann, und ihm entsprechend den Ton zuführt, so gestaltet auch der Herr den Körper in Entsprechung zum Geist und gibt den Geist nach dem Fassungsvermögen des Körpers hinein.


    **3.** Dabei fehlt nicht einmal der dritte Teil eines Haares; denn nach Gewicht, Maß und Richtschnur wurde die ganze Schöpfung gemacht.


    **4.** Und wie der Töpfer weiß, wozu jedes einzelne Gefäß taugt, so kennt auch der Herr den Körper: wie lange er im Guten bestehen wird und wann er ins Böse gerät.


    **5.** Denn es gibt weder ein Geschöpf noch einen Gedanken, die der Herr nicht kennt; hat er doch jeden Menschen nach seinem eigenen Bild geschaffen.


    **6.** Wie die Kraft eines Menschen ist, so ist auch sein Wort[b] – sei es im Gesetz des Herrn oder im Gesetz Beliars.[c]


    **7.** Und wie Licht und Finsternis voneinander geschieden sind, ebenso Sehen und Hören,[d] so besteht auch ein Unterschied zwischen Mann und Mann und zwischen Frau und Frau. Man kann nicht sagen, dass die eine Gestalt der anderen in allem gleich sei.[e]


    **8.** Denn Gott machte alles gut und in geordneter Weise: die fünf Sinne im Kopf; den Hals verband er mit dem Kopf und fügte diesem das Haar zur Schönheit und Zierde hinzu. Dann gab er das Herz zum Verstehen, den Bauch zur Ausscheidung, den Magen zum Zerkleinern, die Luftröhre zum Atmen, die Leber zum Zorn, die Galle zur Bitterkeit, die Milz zum Lachen, die Nieren zur Verschlagenheit, die Lenden zur Kraft und die Seite zum Schlafen – und ebenso das Übrige.[f]


    **9.** So sollen nun auch alle eure Taten, meine Kinder, in guter Ordnung und in Ehrfurcht vor Gott geschehen. Tut nichts Ungeordnetes aus Verachtung und nichts außerhalb der dafür bestimmten Zeit.


    **10.** Denn wenn du zum Auge sagst: »Höre!«, kann es das nicht. Ebenso könnt ihr, solange ihr in der Finsternis seid, keine Werke des Lichts tun.'
  revised_footnotes:
  - marker: a
    text: Der griechische Text am Kapitelanfang ist in der Überlieferung gestört. Klar erkennbar ist der Vergleich Naftalis mit einer leichtfüßigen Hirschkuh und seine Eignung für Botengänge.
    reason: textual_variant
  - marker: b
    text: Der erhaltene griechische Text lautet hier wörtlich „sein Wort“. Andere Fassungen verstehen die Stelle im Sinn von „sein Werk“ oder „sein Tun“.
    reason: textual_variant
  - marker: c
    text: Beliar ist in jüdischen testamentarischen Schriften ein überlieferter Name für die Macht, die Gott und seinem Gesetz entgegensteht.
    reason: cultural_note
  - marker: d
    text: Die Lesart ist unsicher. „Sehen und Hören“ passt zum folgenden Gedankengang über die unterschiedlichen Aufgaben der Sinne und Körperteile.
    reason: textual_variant
  - marker: e
    text: Der letzte Satz des Verses ist textlich stark gestört. Gemeint ist offenbar, dass Menschen sich in ihrer jeweiligen Gestalt oder Ausprägung unterscheiden; der genaue Wortlaut bleibt unsicher.
    reason: textual_variant
  - marker: f
    text: Die Aufzählung der Körperteile ist an mehreren Stellen textlich gestört und spiegelt antike Vorstellungen über deren Aufgaben wider. Die Übersetzung folgt dem erkennbaren Sinn, ohne die Angaben als moderne Anatomie zu deuten.
    reason: textual_variant
  revision_rationale: 'Die Revision beschränkt sich auf zwei sichere Verbesserungen: V. 5 erhält eine grammatisch korrekte Wiedergabe, die sowohl „Geschöpf“ als auch „Gedanke“ umfasst; V. 2 gibt die Töpferhandlung und die Relation zwischen Körper und Geist quellennäher wieder. Der übrige Text einschließlich aller vorhandenen Fußnoten bleibt, da er die griechischen Unsicherheiten offenlegt und keine der im englischen Audit genannten interpretativen Zusätze unkritisch übernimmt.'
