  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/009.yaml
  text: 'And after commanding them many such things[[Here begins ...]], he urged them to carry his bones to Hebron and bury him with his fathers.


    2. And after eating and drinking with gladness of soul, he covered his face and died.


    3. And his sons did in every respect all that Naphtali their father had commanded them.


    [Here begins the Testament of Gad, the ninth son of Jacob and Zilpah.]'
translation:
  language: de
  text: '**9** Nachdem er ihnen vieles Derartiges aufgetragen hatte, drängte er sie, seine Gebeine nach Hebron zu bringen und ihn bei seinen Vätern zu begraben.


    **2** Nachdem er mit froher Seele gegessen und getrunken hatte, bedeckte er sein Gesicht und starb.


    **3** Seine Söhne taten in jeder Hinsicht alles, was ihr Vater Naftali ihnen aufgetragen hatte.


    [Hier beginnt das Testament Gads, des neunten Sohnes Jakobs und Silpas.][a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Überlieferungstext schließt das Kapitel mit dem Anfang des nächsten Werkes: „Testament Gads, des neunten Sohnes Jakobs und Silpas.“ Die Zeile wird hier als Übergangsnotiz und nicht als Teil von Naftalis letzten Worten wiedergegeben.'
    reason: textual_variant
lexical_decisions:
- source_word: πολλὰ τοιαῦτα
  choice: noch vieles Derartiges
  rationale: Die Wendung verweist zusammenfassend auf zahlreiche vorausgehende Weisungen. „Derartiges“ gibt τοιαῦτα natürlich wieder; „noch“ markiert im Deutschen den rückblickenden Abschluss, ohne einen neuen Inhalt hinzuzufügen.
- source_word: ἐντειλάμενος / ἐνετείλατο
  choice: aufgetragen hatte
  rationale: „Auftragen“ wahrt den verbindlichen Charakter der letztwilligen Weisungen, klingt im Deutschen jedoch weniger militärisch als „befehlen“ und passt zum testamentarischen Zusammenhang.
- source_word: παρεκάλεσεν
  choice: drängte er sie
  rationale: Das Verb bezeichnet hier ein eindringliches Bitten oder Zureden. „Drängte“ bewahrt die Nachdrücklichkeit, ohne die Handlung mit einem weiteren förmlichen Befehl gleichzusetzen.
- source_word: μετακομίσωσι τὰ ὀστᾶ αὐτοῦ
  choice: seine Gebeine ... zu bringen
  rationale: „Gebeine“ entspricht dem ausdrücklich genannten „Knochen“ in einer würdigen deutschen Bestattungssprache; „bringen“ gibt die Verbringung an einen anderen Ort idiomatisch wieder.
- source_word: ἐν Χεβρών
  choice: nach Hebron
  rationale: Obwohl ἐν gewöhnlich „in“ bedeutet, verlangt das Bewegungsverb hier eine Zielangabe. Im Deutschen ist daher „nach Hebron“ sachgerecht.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: bei seinen Vätern
  rationale: Die traditionelle Familien- und Bestattungsformel bleibt erhalten. „Bei“ bezeichnet im Deutschen natürlich die Beisetzung am Ort der Vorfahren.
- source_word: ἐν ἱλαρότητι ψυχῆς
  choice: mit froher Seele
  rationale: Die Wiedergabe erhält sowohl die innere Freude als auch das ausdrücklich genannte ψυχή und wahrt den feierlichen Ton der Sterbeszene.
- source_word: συνεκάλυψε τὸ πρόσωπον αὐτοῦ
  choice: bedeckte er sein Gesicht
  rationale: Die schlichte, konkrete Wiedergabe vermeidet eine nicht ausdrücklich genannte rituelle Deutung.
- source_word: κατὰ πάντα
  choice: in jeder Hinsicht
  rationale: Die Formulierung bringt die umfassende und genaue Erfüllung der Weisungen idiomatisch zum Ausdruck.
theological_decisions:
- issue: Status der Schlusszeile, die zum Testament Gads überleitet
  choice: Als eingeklammerte paratextuelle Übergangszeile mit Fußnote beibehalten
  alternative: Die Zeile auslassen oder als unmarkierten Bestandteil von Naftalis Testament drucken
  rationale: Die Überlieferung der Ausgabe führt am Kapitelende zum nächsten Werk über. Die Klammern und die Fußnote machen transparent, dass diese Zeile keine weitere Rede Naftalis ist.
- issue: Bedeutung von παρεκάλεσεν nach einer Reihe verbindlicher Weisungen
  choice: „drängte er sie“
  alternative: „befahl er ihnen“ oder „bat er sie“
  rationale: Die Übersetzung bewahrt die Spannung zwischen eindringlicher persönlicher Bitte und autoritativer letztwilliger Weisung, ohne den Ausdruck einseitig abzuschwächen oder zu verschärfen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht feierlichem testamentarischem Ton. Traditionelle Wendungen wie „Gebeine“ und „bei seinen Vätern“ bleiben erhalten, während Satzbau und Verben für heutige Leser natürlich formuliert sind.
