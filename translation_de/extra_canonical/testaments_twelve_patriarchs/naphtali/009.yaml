  source_fidelity: 'Die Übersetzung gibt die wesentlichen Aussagen des griechischen Textes zuverlässig wieder: die verbindlichen Weisungen, die Überführung der Gebeine nach Hebron, die Beisetzung bei den Vätern, Essen und Trinken in freudiger innerer Verfassung, das Bedecken des Gesichts sowie die vollständige Ausführung der Aufträge durch die Söhne. Die eingeklammerte Übergangszeile ist angemessen als Paratext markiert und durch die Fußnote erklärt. Allerdings fügt „noch“ in V. 1 eine zeitlich/additive Nuance hinzu, die πολλὰ τοιαῦτα nicht ausdrücklich enthält.'
  naturalness: Der Text ist überwiegend natürliches modernes Standarddeutsch mit angemessen würdigem Register. „Gebeine“ und „bei seinen Vätern“ sind bewusst leicht gehobene, aber verständliche Bestattungssprache. Die Streichung von „noch“ macht den Anfang enger am Ausgangstext, ohne den deutschen Satzfluss zu beeinträchtigen.
  terminology: „Auftragen“ gibt ἐντέλλομαι in diesem testamentarischen Zusammenhang angemessen wieder; „drängte“ bewahrt die Eindringlichkeit von παρεκάλεσεν. „Gebeine“, „nach Hebron“, „froher Seele“ und „in jeder Hinsicht“ sind jeweils sachlich vertretbare und registergerechte Wiedergaben. Die Namen Naftali, Gad und Silpa sind konsistent und im Deutschen üblich.
