  timestamp: '2026-07-18T09:18:00Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur und die zentralen Aussagen werden zutreffend wiedergegeben: Der Herr bringt Gefangenschaft, die Angesprochenen dienen ihren Feinden, erfahren Leid, und der Herr vernichtet sie schließlich. »Dort« entspricht dem im edierten Text zwar textkritisch markierten, aber vorhandenen ἐκεῖ. Bei πάσῃ κακώσει fügt »jede Art von« jedoch die Bedeutung einer Einteilung in Arten hinzu, die das Griechische nicht ausdrücklich hat. Für συναναστραφήσεσθε ist eine idiomatischere Wiedergabe als Leidensbetroffenheit vorzuziehen, ohne die umfassende Aussage abzuschwächen.'
  naturalness: Der Satz ist insgesamt verständlich und im passenden würdevollen Register gehalten. Die Verbindung »mit jeder Art von Misshandlung und Bedrängnis leben« wirkt im modernen Deutschen jedoch semantisch und idiomatisch sperrig. »Jede Misshandlung und Bedrängnis erleiden« ist klarer und bewahrt die Aussage des Kontextes.
  terminology: »Gefangenschaft«, »Feinden dienen«, »Bedrängnis« und »vernichten« sind sachgerecht. »Böse Behandlung« gibt κακωσις hier natürlicher und umfassender wieder als »Misshandlung«, das im heutigen Deutsch leicht zu eng an einzelne Übergriffe denken lässt. Die im griechischen Editionstext markierte Lesung ἐκεῖ wird weiterhin als »dort« übersetzt; ohne Variantenapparat ist keine erläuternde Fußnote erforderlich.
  issues:
  - severity: low
    issue: »jede Art von Misshandlung« ergänzt eine im Ausgangstext nicht ausgedrückte Kategorienbildung.
    rationale: πάσῃ bedeutet hier »jeder/aller«, während »jede Art von« ausdrücklich verschiedene Arten klassifiziert.
  - severity: medium
    issue: »mit jeder Art von Misshandlung und Bedrängnis leben« ist im Deutschen unnatürlich.
    rationale: Die wörtlichkeitsnahe Konstruktion verdeckt den Sinn, dass die Angesprochenen umfassende schlechte Behandlung und Bedrängnis erfahren beziehungsweise erleiden werden.
  revised_text: Und der Herr wird Gefangenschaft über euch bringen, und dort werdet ihr euren Feinden dienen und jede böse Behandlung und Bedrängnis erleiden, bis der Herr euch alle vernichtet.
