source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 2. Καὶ ἐπάξει Κύριος ὑμῖν αἰχμαλωσίαν, καὶ δουλεύσετε ⌈ἐκεῖ⌉¹³ *τοῖς ἐχθροῖς¹⁴ ὑμῶν, καὶ πάσῃ κακώσει¹⁵ καὶ θλίψει †συναναστραφήσεσθε¹⁶, ἕως ἀναλώσει¹⁷ Κύριος πάντας ὑμᾶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/004/002.yaml
  text: And the Lord will bring captivity upon you, and there you will serve your enemies, and you will be afflicted with every kind of evil and tribulation, until the Lord has consumed you all.
translation:
  language: de
  text: Und der Herr wird Gefangenschaft über euch bringen, und dort werdet ihr euren Feinden dienen und jede böse Behandlung und Bedrängnis erleiden, bis der Herr euch alle vernichtet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: αἰχμαλωσίαν
  choice: Gefangenschaft
  rationale: Gibt die erzwungene Verschleppung beziehungsweise den Zustand der Gefangenschaft knapp und quellennah wieder.
- source_word: δουλεύσετε
  choice: werdet … dienen
  rationale: Bewahrt die Grundbedeutung des Dienstens beziehungsweise der Unterwerfung; im Zusammenhang mit Feinden ist der Zwang deutlich.
- source_word: πάσῃ κακώσει
  choice: jede Art von Misshandlung
  rationale: κάκωσις bezeichnet hier leidvolle schlechte Behandlung oder Bedrückung; die Wendung ist im modernen Deutsch verständlich und vermeidet das unnatürliche »jedes Übel«.
- source_word: θλίψει
  choice: Bedrängnis
  rationale: Bewahrt den Sinn von Druck, Not und Drangsal in würdigem, noch geläufigem Deutsch.
- source_word: συναναστραφήσεσθε
  choice: leben
  rationale: Das textkritisch markierte Verb bedeutet wörtlich, sich zusammen mit etwas aufzuhalten beziehungsweise darin zu verkehren; »mit … leben« erhält diese ungewöhnliche Konstruktion, ohne sie zu einer bloßen Passivform umzudeuten.
- source_word: ἀναλώσει
  choice: vernichtet hat
  rationale: Gibt das starke Verb für Aufzehren oder vollständiges Vernichten wieder und schwächt die Aussage nicht ab.
theological_decisions:
- issue: Reichweite von πάντας ὑμᾶς
  choice: euch alle
  alternative: euch vollständig
  rationale: Die natürliche Verbindung bezeichnet alle Angesprochenen. Die harte Aussage bleibt bestehen und wird nicht durch eine theologische Harmonisierung abgeschwächt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit weitgehend formaler Satzstruktur. Das textkritisch unsichere ἐκεῖ wird als »dort« wiedergegeben; die Unsicherheit der Edition wird mangels mitgelieferter Varianten nicht durch eine spekulative Fußnote ausgeführt.
