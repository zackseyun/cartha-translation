revisions:
- from: Und der Herr wird Gefangenschaft über euch bringen, und dort werdet ihr euren Feinden dienen und mit jeder Art von Misshandlung und Bedrängnis leben, bis der Herr euch alle vernichtet hat.
  to: Und der Herr wird Gefangenschaft über euch bringen, und dort werdet ihr euren Feinden dienen und jede böse Behandlung und Bedrängnis erleiden, bis der Herr euch alle vernichtet.
  rationale: Die Revision entfernt die nicht im Griechischen angelegte Ergänzung »Art von« und ersetzt die im Deutschen sperrige Wendung mit »leben« durch eine natürliche, kontextgerechte Aussage des Erleidens. Die Abfolge, die Universalität von πάσῃ sowie die harte Schlussaussage über πάντας ὑμᾶς und ἀναλώσει bleiben erhalten. Es werden keine textkritischen oder theologischen Entscheidungen über die vorliegende Edition hinaus getroffen.
