  text: IV. Ταῦτα¹ λέγω ὑμῖν², τέκνα μου, ὅτι ἔγνων³ ἐν τῇ⁴ γραφῇ⁵ Ἐνώχ, ὅτι καίγε⁶ ὑμεῖς ἀποστήσεσθε ἀπὸ Κυρίου⁷, πορευόμενοι κατὰ πᾶσαν ἀνομίαν⁸ ἐθνῶν⁹, καὶ ποιήσετε¹⁰ πᾶσαν πονηρίαν¹¹ Σοδόμων¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/004/001.yaml
  text: These things I say to you, my children, because I have learned in the writing of Enoch that you too will depart from the Lord, walking in all the lawlessness of the nations and doing all the wickedness of Sodom.
translation:
  language: de
  text: Dies sage ich euch, meine Kinder, denn ich habe in der Schrift Henochs erkannt, dass auch ihr vom Herrn abfallen werdet, indem ihr jeder Gesetzlosigkeit der Völker nachgeht und jede Bosheit Sodoms begeht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων ἐν τῇ γραφῇ Ἐνώχ
  choice: ich habe in der Schrift Henochs erkannt
  rationale: Gibt die Erkenntnisform von ἔγνων und die lokale beziehungsweise textbezogene Wendung ἐν τῇ γραφῇ möglichst unmittelbar wieder, ohne sie zu einem bloßen Hörensagen abzuschwächen.
- source_word: ἀποστήσεσθε ἀπὸ Κυρίου
  choice: ihr werdet vom Herrn abfallen
  rationale: „Abfallen“ bewahrt den starken Sinn der Abkehr beziehungsweise des Abfalls in ἀφίστημι und die Zukunftsform, ohne einen zusätzlichen Gewissheitsgrad einzutragen.
- source_word: πορευόμενοι κατὰ πᾶσαν ἀνομίαν ἐθνῶν
  choice: indem ihr all der Gesetzlosigkeit der Völker folgt
  rationale: Die Formulierung gibt das begleitende Partizip und κατὰ als Ausrichtung nach einem Muster natürlich wieder; „Gesetzlosigkeit“ bewahrt den rechtlich-moralischen Gehalt von ἀνομία.
- source_word: ποιήσετε πᾶσαν πονηρίαν Σοδόμων
  choice: all die Bosheit Sodoms begeht
  rationale: „Bosheit begehen“ ist im Deutschen idiomatischer als „Bosheit tun“ und bewahrt zugleich den umfassenden Ausdruck πᾶσαν πονηρίαν sowie den Bezug auf Sodom.
theological_decisions:
- issue: Stärke der angekündigten Abkehr vom Herrn
  choice: vom Herrn abfallen
  alternative: sich vom Herrn abwenden
  rationale: Der stärkere Ausdruck entspricht ἀποστήσεσθε besser und hält die theologische Schärfe des angekündigten Abfalls fest, ohne über den griechischen Wortlaut hinauszugehen.
- issue: Verhältnis von Abfall und gesetzlosem Verhalten
  choice: indem ihr … folgt und … begeht
  alternative: und ihr werdet … folgen und … begehen
  rationale: Die partizipiale Unterordnung bleibt erhalten und stellt das Verhalten als Ausdruck beziehungsweise Begleitumstand des Abfalls dar, ohne eine streng kausale Deutung festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst schriftsprachlichem „Schrift Henochs“ und theologisch präzisem „abfallen“. Keine Fußnoten erforderlich; es erscheinen daher auch keine Fußnotenmarker im Haupttext.
