source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: IX. *Καὶ πολλὰ¹ τοιαῦτα ἐντειλάμενος² αὐτοῖς παρεκάλεσεν ἵνα μετακομίσωσι³ τὰ ὀστᾶ αὐτοῦ⁴ *ἐν Χεβρών, καὶ θάψωσι αὐτὸν⁵ μετὰ τῶν πατέρων αὐτοῦ⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/009/001.yaml
  text: And after instructing them in many such things, he urged them to carry his bones to Hebron and bury him with his fathers.
translation:
  language: de
  text: Nachdem er ihnen viele solche Anweisungen erteilt hatte, drängte er sie, seine Gebeine nach Hebron zu bringen und ihn mit seinen Vätern zu begraben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐντειλάμενος
  choice: Weisungen gegeben hatte
  rationale: Gibt das anordnende bzw. unterweisende Moment des Partizips natürlich und würdig wieder, ohne den Zusammenhang auf bloße Belehrung einzuengen.
- source_word: παρεκάλεσεν
  choice: bat er sie eindringlich
  rationale: Bewahrt sowohl den bittenden als auch den nachdrücklichen Charakter des Verbs.
- source_word: μετακομίσωσι τὰ ὀστᾶ αὐτοῦ
  choice: seine Gebeine nach Hebron zu bringen
  rationale: „Gebeine“ ist im Bestattungskontext idiomatisch und würdig; „bringen“ gibt den Transport an einen anderen Ort natürlich wieder.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: bei seinen Vätern
  rationale: Bewahrt die traditionelle verwandtschaftliche und sepulkrale Ausdrucksweise des Griechischen, ohne sie erklärend aufzulösen.
