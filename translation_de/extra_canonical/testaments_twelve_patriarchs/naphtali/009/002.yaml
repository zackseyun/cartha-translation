base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/009/002.yaml
  text: And having eaten and drunk with gladness of soul, he covered his face and died.
translation:
  language: de
  text: Und nachdem er mit frohem Herzen gegessen und getrunken hatte, bedeckte er sein Gesicht und starb.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ἱλαρότητι ψυχῆς
  choice: mit frohem Herzen
  rationale: Die griechische Wendung bezeichnet eine freudige innere Verfassung. „Mit froher Seele“ wäre formaler, klingt im heutigen Deutsch jedoch weniger natürlich; „mit frohem Herzen“ bewahrt Sinn und würdigen Ton.
- source_word: συνεκάλυψε τὸ πρόσωπον αὐτοῦ
  choice: bedeckte er sein Gesicht
  rationale: Gibt die konkrete Handlung schlicht und eng am Griechischen wieder, ohne zusätzliche Deutung.
- source_word: ἀπέθανε
  choice: starb
  rationale: Direkte und natürliche Entsprechung des griechischen Verbs.
theological_decisions: []
