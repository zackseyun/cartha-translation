  register: Modernes, würdevolles Standarddeutsch. Die vorzeitigen griechischen Partizipien φαγών und πιών werden durch einen temporalen Nebensatz wiedergegeben, da eine wörtliche Partizipialkonstruktion im Deutschen schwerfällig wäre.
