base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/006.yaml
  text: 'And again, after seven days, I saw that my father Jacob was standing by the sea of Amnia[a], and we were with him. And behold, a ship came sailing by us, with sailors and pilots. And written on the ship was this: “The Ship of Jacob.”


    And our father said to us, “Come, let us go up into our ship.” And when we had entered, a violent storm arose, and a whirlwind of wind; and our father was separated from us, holding the rudders[b]. And we, being storm-tossed upon the sea, were driven along over the waters, while the ship was filled and battered by the waves, so that it was about to be broken up.


    But Joseph went away on a small boat, and we were separated on nine planks; and Levi and Judah were together. And we were scattered, all of us, to the ends of the earth[c]. But Levi, clothed in sackcloth, prayed to the Lord. And when the storm ceased, the ship reached the land as though in peace. And behold, our father came, and we all rejoiced with one accord.'
translation:
  language: de
  text: '**Testament Naphtalis 6**


    **1** Und wieder, nach sieben Tagen, sah ich, dass mein Vater Jakob am Meer von Amnia[a] stand und wir bei ihm waren. **2** Da kam ein Schiff angesegelt, ohne Seeleute und Steuermänner. Auf dem Schiff stand geschrieben: »Schiff Jakobs.«


    **3** Unser Vater sagte zu uns: »Kommt, lasst uns an Bord unseres Schiffes gehen!« **4** Als wir eingestiegen waren, erhob sich ein heftiger Sturm mit einem gewaltigen Wirbelwind. Unser Vater wurde von uns getrennt, während er die Steuergriffe[b] festhielt. **5** Vom Sturm umhergetrieben wurden wir aufs offene Meer hinausgetragen. Das Schiff füllte sich mit Wasser und wurde von den hohen Wellen ringsum zerschlagen, sodass es zu zerbrechen drohte.


    **6** Josef aber fuhr in einem kleinen Boot davon. Wir wurden auf neun Planken verteilt; Levi und Juda waren zusammen. **7** Und wir wurden alle bis an die Enden der Erde[c] zerstreut. **8** Levi aber hüllte sich in Sacktuch und betete zum Herrn. **9** Als der Sturm aufgehört hatte, gelangte das Schiff ans Land, als wäre es in Frieden gefahren. **10** Da kam unser Vater, und wir alle freuten uns einmütig.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Lage des im Griechischen genannten »Amnia« ist nicht sicher bekannt; der Name wird daher unverändert wiedergegeben.
    reason: cultural_note
  - marker: b
    text: Der griechische Ausdruck ist textlich schwierig und bedeutet wörtlich »die Hälse«. Im nautischen Zusammenhang ist vermutlich ein Teil der Steuervorrichtung gemeint.
    reason: textual_variant
  - marker: c
    text: Die Zerstreuung »bis an die Enden der Erde« kann sinnbildlich auf eine weitreichende Zerstreuung weisen; im Text ist sie zunächst Teil von Naphtalis Traum.
    reason: cross_reference
lexical_decisions:
- source_word: θάλασσα Ἀμνείας
  choice: Meer von Amnia
  rationale: Der griechische Ortsname wird transliteriert, da seine Identifizierung unsicher ist. Bei ἐν τῇ θαλάσσῃ wird im Deutschen idiomatisch »am Meer« gewählt, ohne eine Lokalisierung zu mutmaßen.
- source_word: ἐκτὸς ναυτῶν καὶ κυβερνητῶν
  choice: ohne Seeleute und Steuermänner
  rationale: ἐκτός mit Genitiv bedeutet im vorliegenden Text »ohne«. Damit wird bewusst vom englischen Konsultationstext abgewichen, der hier »with« bietet. κυβερνήτης bezeichnet im nautischen Zusammenhang den Lenker beziehungsweise Steuermann.
- source_word: ἁρμενίζον
  choice: kam … angesegelt
  rationale: Die Formulierung gibt das anschauliche nautische Partizip in natürlichem modernem Deutsch wieder.
- source_word: ἐπεγέγραπτο … τῷ πλοίῳ
  choice: Auf dem Schiff stand geschrieben
  rationale: Die Wendung bewahrt den sichtbaren Inschriftscharakter des griechischen Verbs.
- source_word: χειμὼν σφοδρός
  choice: ein heftiger Sturm
  rationale: χειμών bezeichnet im Zusammenhang eine schwere Seesturmlage und nicht winterliches Wetter.
- source_word: λαῖλαψ ἀνέμου μέγας
  choice: ein gewaltiger Wirbelwind
  rationale: Die Übersetzung erhält die Intensität und die wirbelnde Bewegung, vermeidet aber die im Deutschen schwerfällige Doppelung »Wirbelwind des Windes«.
- source_word: ἀφίσταται … ἀφʼ ἡμῶν
  choice: wurde von uns getrennt
  rationale: Der Zusammenhang der Traumerzählung legt eine räumliche Trennung nahe, ohne sie als freiwilligen Weggang Jakobs festzulegen.
- source_word: τοὺς αὐχένας
  choice: die Steuergriffe
  rationale: Das überlieferte Wort bedeutet gewöhnlich »die Hälse«, ist hier jedoch textlich schwierig. Wegen des nautischen Zusammenhangs wird vorsichtig eine Bezeichnung der Steuervorrichtung gewählt und die Unsicherheit in einer Fußnote offengelegt.
- source_word: ἐπὶ τὸ πέλαγος ἐφερόμεθα
  choice: wurden wir aufs offene Meer hinausgetragen
  rationale: πέλαγος bezeichnet die offene See; der Passivcharakter des Getriebenwerdens bleibt erhalten.
- source_word: ἐν τρικυμίαις περιρησσόμενον
  choice: wurde von den hohen Wellen ringsum zerschlagen
  rationale: Die Formulierung verbindet die schwere Brandung mit der ringsum wirkenden zerstörerischen Gewalt des Verbs.
- source_word: συντρίβεσθαι
  choice: auseinanderbrach
  rationale: Der Infinitiv beschreibt das tatsächliche Zerbrechen des Schiffes, was durch die anschließenden Planken bestätigt wird.
- source_word: ἀκάτιον
  choice: kleines Boot
  rationale: Eine klare und genaue allgemeine Bezeichnung für das kleine Wasserfahrzeug, ohne anachronistisch einen bestimmten modernen Bootstyp festzulegen.
- source_word: ἐπὶ σανίδων ἐννέα
  choice: auf neun Planken
  rationale: σανίδες bezeichnet hier offenbar Bretter beziehungsweise Wrackteile; »Planken« erhält das nautische Bild.
- source_word: ἐπὶ τὸ αὐτό
  choice: auf derselben Planke
  rationale: Die substantivische Ergänzung wird aus dem unmittelbar vorangehenden σανίδων erschlossen; so bleibt deutlich, dass Levi und Juda zusammen waren.
- source_word: περιβαλλόμενος σάκκον
  choice: hüllte sich in Sacktuch
  rationale: Die Wendung gibt die traditionelle Trauer- und Bußhandlung verständlich wieder.
- source_word: ὁμοθυμαδόν
  choice: einmütig
  rationale: Das Wort bezeichnet die gemeinsame, gleichgerichtete Haltung der ganzen Gruppe und wird in würdigem biblischem Deutsch wiedergegeben.
theological_decisions:
- issue: Symbolische Zerstreuung in Naphtalis Traum
  choice: Die Zerstreuung bis an die Enden der Erde wird als Bestandteil der Traumerzählung direkt wiedergegeben.
  alternative: Die Szene ausdrücklich als spätere Zerstreuung oder Verbannung der Stämme deuten.
  rationale: Der griechische Text erzählt das Traumbild, erklärt seine geschichtliche oder theologische Erfüllung an dieser Stelle aber nicht. Die Übersetzung wahrt diese Offenheit.
- issue: κύριος im jüdischen Testament
  choice: Herr
  alternative: HERR oder Gebieter
  rationale: Der griechische Text hat Κυρίου. »Herr« folgt dieser Bezeichnung, ohne ausdrücklich das Tetragramm vorauszusetzen oder eine christologische Präzisierung einzutragen.
- issue: Levis Gebet während der Seenot
  choice: Die Handlung wird knapp als Gebet zum Herrn wiedergegeben.
  alternative: Das Gebet ausdrücklich als Buße, Fürbitte oder priesterliche Mittlerschaft charakterisieren.
  rationale: Sacktuch kann Buße oder Trauer nahelegen, doch der Text benennt weder Inhalt noch Funktion des Gebets; deshalb wird keine bestimmte theologische Deutung ergänzt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Kurze Hauptsätze erhalten die dramatische Folge des Traums. Nautische Begriffe werden anschaulich, aber nicht unnötig technisch formuliert. Die Verszählung wird sichtbar beibehalten; echte textliche und symbolische Unsicherheiten werden nicht im Haupttext dogmatisch aufgelöst.
