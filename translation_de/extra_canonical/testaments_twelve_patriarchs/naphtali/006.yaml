review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung folgt dem griechischen Text im Wesentlichen sorgfältig, insbesondere gegen die englische Audit-Fassung in V. 2 korrekt mit »ohne Seeleute und Steuermänner«. Zwei Aussagen gehen jedoch über den Wortlaut hinaus: V. 5 stellt das Zerbrechen des Schiffes als vollendetes Ereignis dar, obwohl der griechische Infinitiv im ὥστε-Satz hier besser die drohende bzw. eintretende Zerstörung beschreibt; V. 6 legt mit »auf derselben Planke« fest, was der Text mit »Levi und Juda waren zusammen« nicht ausdrücklich sagt.'
  naturalness: Modernes Standarddeutsch und der erzählerisch-biblische Registerton sind gelungen. »gingen an Bord« ist idiomatischer als »an Bord ... gehen«, und »auf neun Planken verteilt« ist verständlicher als die passive Formulierung mit »voneinander getrennt«, ohne den Sinn zu verändern.
  terminology: Namen, »Sacktuch«, »Herr« und die nautischen Begriffe sind angemessen. »Steuergriffe« bleibt angesichts des schwierigen αὐχένας als vorsichtige kontextuelle Wiedergabe vertretbar, sofern die Fußnote die wörtliche und textliche Schwierigkeit weiterhin offenlegt. Die Umschrift »Amnia« wahrt die Unsicherheit des Ortsnamens.
  issues:
  - severity: medium
    issue: 'V. 5: »sodass es schließlich auseinanderbrach«'
    rationale: συντρίβεσθαι steht als Infinitiv nach ὥστε und besagt nicht eindeutig, dass das Schiff in diesem Satz bereits vollständig zerbrochen ist. Die Formulierung »drohte zu zerbrechen« wahrt den Aspekt und vermeidet eine unnötige Festlegung.
  - severity: medium
    issue: 'V. 6: »Levi und Juda waren auf derselben Planke«'
    rationale: ἐπὶ τὸ αὐτό bedeutet »zusammen« bzw. »am selben Ort«, nennt aber keine konkrete einzelne Planke. Die Ergänzung sollte entfernt werden.
