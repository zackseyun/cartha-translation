  text: '1[a]. For in the fortieth year of my life I saw a vision on the Mount of Olives, east of Jerusalem, that the sun and the moon were standing still.


    2. And behold, Isaac, the father of my father, said to us, “Run up and let each of you seize them according to his strength; and the one who takes hold of them, his shall be the sun and the moon.”


    3. And we all ran together, and Levi seized the sun, and Judah, arriving first, took hold of the moon; and both of them were lifted up with them.


    4. And while Levi was like the sun, behold, a certain young man was giving him twelve palm branches[b]; and Judah became bright like the moon, and beneath their feet were twelve rays.


    5. And the two, Levi and Judah, ran up and held them fast.


    6. And behold, there was a bull on the earth, having two great horns and eagle’s wings on its back; and though we wanted to seize it, we were not able.


    7. But Joseph came and took hold of it, and went up with it to the height.


    8. And I saw that I was there, and behold, a holy writing appeared to us, saying: “Assyrians, Medes, Persians,”'
translation:
  language: de
  text: '**Testament Naftalis 5**


    **1** Denn im vierzigsten Jahr meines Lebens sah ich auf dem Ölberg, östlich von Jerusalem, eine Vision: Die Sonne und der Mond standen still.


    **2** Und siehe, Isaak, der Vater meines Vaters, sagte zu uns: »Lauft hin und ergreift sie, jeder nach seiner Kraft! Wer sie zu fassen bekommt, dem sollen die Sonne und der Mond gehören.«


    **3** Da liefen wir alle zugleich los. Levi ergriff die Sonne, und Juda kam zuerst an und fasste den Mond. Beide wurden zusammen mit ihnen emporgehoben.


    **4** Und als Levi wie die Sonne war, siehe, da reichte ihm ein junger Mann zwölf Palmzweige. Juda aber wurde hell wie der Mond, und unter ihren Füßen waren zwölf Strahlen.


    **5** Und die beiden, Levi und Juda, liefen hin und hielten sie fest.[a]


    **6** Und siehe, auf der Erde war ein Stier mit zwei großen Hörnern und Adlerflügeln auf seinem Rücken. Wir wollten ihn fassen, konnten es aber nicht.


    **7** Da kam Josef, nahm ihn fest und stieg mit ihm zur Höhe empor.


    **8** Und ich sah, dass ich dort war. Und siehe, eine heilige Schrift erschien uns und sagte: »Assyrer, Meder, Perser, Chaldäer und Syrer werden die zwölf Zepter Israels gefangen nehmen.«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vers 5 ist im überlieferten griechischen Text syntaktisch auffällig und steht in der benutzten Ausgabe in eckigen Klammern. Er könnte eine wiederaufnehmende oder später hinzugefügte Zeile sein, welche die hervorgehobene Stellung Levis und Judas nochmals nennt.
    reason: textual_variant
  - marker: b
    text: 'Die griechische Verbindung lautet wörtlicher etwa: »werden Gefangenschaft erben – die zwölf Zepter Israels«. Satzfügung und Bildsprache sind ungewöhnlich. Die Übersetzung gibt die zwölf Zepter als von Gefangenschaft betroffen wieder, ohne das Bild zu »Stämmen« aufzulösen.'
    reason: source_ambiguity
lexical_decisions:
- source_word: ὄραμα
  choice: Vision
  rationale: Bezeichnet hier eine offenbarende Schau; „Vision“ ist im modernen Deutschen klar und dem apokalyptischen Zusammenhang angemessen.
- source_word: ἕστηκαν
  choice: standen still
  rationale: Das Perfekt beschreibt den im Gesicht feststehenden Zustand von Sonne und Mond.
- source_word: κρατήσατε / πιάσαι
  choice: ergreift / fassen
  rationale: Die wechselnden deutschen Verben bilden das kräftige Zugreifen der griechischen Ausdrücke natürlich ab, ohne überall eine gewaltsame Nuance einzutragen.
- source_word: κατὰ δύναμιν
  choice: jeder nach seiner Kraft
  rationale: Bewahrt sowohl die Verteilung auf die Einzelnen als auch den Bezug auf ihre jeweilige Fähigkeit oder Stärke.
- source_word: φθάσας
  choice: kam zuerst an
  rationale: Gibt Judas zeitlichen Vorsprung wieder, ohne mehr über den Ablauf auszusagen, als der Text erkennen lässt.
- source_word: ὑψώθησαν
  choice: wurden … emporgehoben
  rationale: Bewahrt zunächst das räumliche Bild und lässt mögliche symbolische Bedeutungen offen.
- source_word: βαΐα φοινίκων
  choice: Palmzweige
  rationale: Konkrete und im Deutschen geläufige Bezeichnung des Bildmotivs.
- source_word: γραφὴ ἁγία
  choice: eine heilige Schrift
  rationale: Die unbestimmte Form bleibt erhalten; die Wiedergabe behauptet nicht, es handle sich um einen bestimmten kanonischen Schrifttext.
- source_word: τὰ δώδεκα σκῆπτρα τοῦ Ἰσραήλ
  choice: die zwölf Zepter Israels
  rationale: Erhält das ungewöhnliche Herrschafts- beziehungsweise Stammesbild des griechischen Textes, statt es erklärend durch „Stämme“ zu ersetzen.
- source_word: κληρονομήσουσιν αἰχμαλωσίαν
  choice: werden … als Gefangene in Besitz nehmen
  rationale: Gibt den Gedanken der Aneignung und Gefangenschaft verständlich wieder; die syntaktisch und semantisch schwierige Verbindung wird zusätzlich in einer Fußnote ausgewiesen.
theological_decisions:
- issue: Symbolische Stellung Levis und Judas
  choice: Die Sonnen-, Mond-, Zweig- und Strahlenbilder werden ohne Deutung übersetzt.
  alternative: Levi ausdrücklich mit dem Priestertum und Juda mit Königtum oder Messianität gleichsetzen.
  rationale: Der Abschnitt bietet an dieser Stelle Bilder, aber keine ausdrückliche Auslegung; eine konfessionelle oder heilsgeschichtliche Festlegung wäre ein Zusatz.
- issue: Bedeutung von γραφὴ ἁγία
  choice: „eine heilige Schrift“
  alternative: „die Heilige Schrift“ oder „ein heiliges Buch“
  rationale: Der griechische Ausdruck ist unbestimmt und bezeichnet eine im Gesicht erscheinende Schrift; die Übersetzung soll keinen späteren Kanonbegriff voraussetzen.
- issue: Die zwölf Zepter Israels
  choice: Das Bild „Zepter“ bleibt im Haupttext erhalten.
  alternative: Erklärend „die zwölf Stämme Israels“ schreiben.
  rationale: Auch wenn wahrscheinlich die zwölf Stämme gemeint sind, soll die konkrete Symbolsprache nicht stillschweigend aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltener visionärer Bildsprache. Wiederholtes „Und siehe“ erhält den erzählerisch-apokalyptischen Ton. Ungewöhnliche Bilder und textliche Spannungen werden nicht durch spätere theologische Deutungen geglättet.
