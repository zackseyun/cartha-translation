  - severity: medium
    issue: Plural und Bezug von ταῦτα ... κατὰ τοὺς καιροὺς αὐτῶν
    rationale: »Dies muss sich zu seiner bestimmten Zeit erfüllen« macht die pluralischen »diese Dinge« und »ihre Zeiten« singularisch. »Diese Dinge müssen sich zu ihren bestimmten Zeiten erfüllen« gibt die griechische Form und den möglichen Bezug auf die einzelnen Trauminhalte genauer wieder.
  - severity: medium
    issue: Deutsche Formulierung von ἐκαιόμην ... ἀναγγεῖλαι
    rationale: »In meinem Innersten brannte es, ihm zu sagen« hat keinen klaren grammatischen Bezug und klingt im Deutschen nicht natürlich. »Es brannte mir im Innersten danach, ihm zu sagen« erhält die starke innere Regung und die finale Infinitivverbindung.
