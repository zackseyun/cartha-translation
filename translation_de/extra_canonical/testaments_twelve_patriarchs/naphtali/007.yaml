base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/007.yaml
  text: '1[a]. I told these two dreams to my father, and he said to me, “These things must be fulfilled in their appointed times, after Israel has endured much.”


    2. Then my father said to me[b], “I believe God that Joseph is alive; for I always see that the Lord counts him as being with us.”


    3. And weeping he said, “Alas, my child Joseph, you are alive, and I do not see you; and you do not see Jacob, the one who fathered you.”


    4. So by these words he made me weep also. But I was burning in my inward parts to tell him that Joseph had been sold[c], yet I was afraid of my brothers.'
translation:
  language: de
  text: '**Testament Naftalis 7**


    **1.** Diese beiden Träume erzählte ich meinem Vater. Er sagte zu mir: »Diese Dinge müssen sich zu ihren bestimmten Zeiten[a] erfüllen, nachdem Israel viel erduldet hat.«


    **2.** Dann sagte mein Vater zu mir: »Ich glaube Gott, dass Josef lebt. Denn ich sehe stets, dass der Herr ihn zu uns zählt[b].«


    **3.** Weinend sagte er: »Weh mir, mein Sohn Josef! Du lebst, doch ich sehe dich nicht, und du siehst Jakob nicht, der dich gezeugt hat.«


    **4.** Mit diesen Worten brachte er auch mich zum Weinen. Doch es brannte mir im Innersten danach[c], ihm zu sagen, dass Josef verkauft worden war; doch ich fürchtete mich vor meinen Brüdern.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »zu ihren Zeiten«. Das griechische Wort kann passende oder festgesetzte Zeiten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: 'Auch möglich: »ihn unter uns mitzählt« oder »ihn als bei uns befindlich ansieht«. Der griechische Ausdruck bleibt bildhaft und etwas mehrdeutig.'
    reason: lexical_alternative
  - marker: c
    text: 'Wörtlichkeitsnah: »Ich brannte in meinen Eingeweiden.« Dies ist ein körperhaftes griechisches Bild für heftige innere Bedrängnis.'
    reason: cultural_note
lexical_decisions:
- source_word: ἐνύπνια
  choice: Träume
  rationale: Der gewöhnliche Sinn ist »Träume«; der Zusammenhang verlangt nicht die stärker deutende Wiedergabe »Visionen«.
- source_word: δεῖ ... πληρωθῆναι
  choice: muss sich ... erfüllen
  rationale: Bewahrt sowohl die Notwendigkeit von δεῖ als auch die Erfüllungssprache von πληρωθῆναι und passt zum prophetischen Ton.
- source_word: καιροὺς
  choice: bestimmte Zeit
  rationale: Bezeichnet hier nicht nur einen chronologischen Zeitpunkt, sondern die jeweils passende oder festgesetzte Zeit. Der griechische Plural wird im idiomatischen deutschen Ausdruck singularisch wiedergegeben.
- source_word: ὑπομείναντος
  choice: erduldet hat
  rationale: Gibt das standhafte Durchstehen von Leid knapp wieder, ohne das Partizip unnötig auszudeuten.
- source_word: πιστεύω τῷ θεῷ
  choice: Ich glaube Gott
  rationale: Der Dativ bezeichnet hier das Vertrauen in Gott beziehungsweise in seine Zusage, nicht lediglich den Glauben an Gottes Existenz.
- source_word: ζῇ
  choice: lebt
  rationale: Im Gegensatz zum vermuteten Tod ist »lebt« die natürliche und genaue deutsche Wiedergabe.
- source_word: ἀριθμεῖ
  choice: zählt
  rationale: Erhält das Bild des Zählens beziehungsweise Zurechnens, ohne es zu »betrachtet ihn als lebendig« auszudeuten.
- source_word: Οἴμοι
  choice: Weh mir
  rationale: Bewahrt den Klageruf in würdigem, verständlichem Deutsch.
- source_word: γεννήσαντά
  choice: der dich gezeugt hat
  rationale: Gibt die ausdrückliche väterliche Herkunft präzise wieder; »dein Vater« wäre glatter, aber weniger nah am Wortlaut.
- source_word: ἐκαιόμην τοῖς σπλάγχνοις
  choice: In meinem Innersten brannte es
  rationale: Bewahrt das körperlich-viszerale Bild für starke innere Bedrängnis in natürlichem Deutsch.
- source_word: πέπραται
  choice: verkauft worden war
  rationale: Bezieht sich im Zusammenhang auf Josefs Verkauf; das Plusquamperfekt ordnet das Ereignis vor dem erzählten Gespräch ein.
theological_decisions:
- issue: Prophetische Notwendigkeit in Jakobs Antwort
  choice: Dies muss sich zu seiner bestimmten Zeit erfüllen
  alternative: Dies muss zu seinen Zeiten geschehen
  rationale: Die Formulierung bewahrt den Gedanken notwendiger Erfüllung und den providenziellen Rahmen, ohne eine bestimmte Lehre über Vorherbestimmung einzutragen.
- issue: Bedeutung von ἀριθμεῖ αὐτὸν μεθ’ ἡμῶν
  choice: der Herr ihn zu uns zählt
  alternative: der Herr ihn als bei uns befindlich ansieht
  rationale: Die gewählte Fassung erhält die ungewöhnliche Zählmetapher und lässt offen, ob Zugehörigkeit, Gegenwart oder das Zählen unter den Lebenden im Vordergrund steht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit testamentarisch-prophetischem Ton. Die direkte Rede bleibt schlicht und emotional; ungewöhnliche Bilder des griechischen Textes werden im Haupttext bewahrt und in den Fußnoten knapp erläutert.
