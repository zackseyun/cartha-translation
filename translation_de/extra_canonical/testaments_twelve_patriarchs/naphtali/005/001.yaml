base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/001.yaml
  text: And being brought low, you will turn back and acknowledge the Lord your God, and he will bring you back into your land according to his great mercy. 4 And it shall come to pass, when they go out into the land of their fathers, again they will forget the Lord and act impiously. 5 And the Lord will scatter them upon the face of all the earth, until the compassion of the Lord shall come, a man working righteousness and showing mercy to all who are far off and to those who are near.
translation:
  language: de
  text: '3 Wenn ihr erniedrigt worden seid, werdet ihr umkehren und den Herrn, euren Gott, erkennen; und er wird euch nach seinem großen Erbarmen in euer Land zurückbringen. 4 Und es wird geschehen: Wenn sie in das Land ihrer Väter hinausgezogen sind, werden sie den Herrn wieder vergessen und gottlos handeln. 5 Dann wird der Herr sie über die ganze Erde zerstreuen, bis das Erbarmen des Herrn kommt: ein Mensch, der Gerechtigkeit übt und allen Barmherzigkeit erweist, den Fernen wie den Nahen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „bis das Innerste des Herrn kommt, ein Mensch, der Gerechtigkeit tut und Erbarmen tut“. „Innerstes“ bezeichnet hier den Sitz tiefen Mitgefühls. Die genaue Beziehung zwischen dem „Erbarmen des Herrn“ und dem folgenden „Menschen“ bleibt im Griechischen offen.'
    reason: Die ungewöhnliche Wendung τὸ σπλάγχνον Κυρίου und ihre appositionelle Verbindung mit ἄνθρωπος sind semantisch und theologisch mehrdeutig; die Fußnote dokumentiert die wörtliche Bildsprache und bewahrt die Spannung.
lexical_decisions:
- source_word: σμικρυνθέντες
  choice: erniedrigt worden seid
  rationale: Das Partizip bezeichnet hier wahrscheinlich ein Klein- oder Niedriggemachtwerden; die passive deutsche Fassung bewahrt diese Bedeutung besser als eine bloße Zustandsangabe.
- source_word: ἐπιστρέψετε
  choice: werdet ihr umkehren
  rationale: Das Verb bezeichnet eine Umkehr beziehungsweise Rückkehr und wird bewusst nicht nur kognitiv als Sinnesänderung wiedergegeben.
- source_word: ἐπιγνώσεσθε
  choice: erkennen
  rationale: Bewahrt den starken Sinn von ἐπιγινώσκω, ohne ihn auf ein bloßes Anerkennen zu verengen.
- source_word: κατὰ τὸ πολὺ αὐτοῦ ἔλεος
  choice: nach seinem großen Erbarmen
  rationale: Gibt Maßstab und Beweggrund der Rückführung wieder; Erbarmen ist in diesem Kontext natürlicher und würdevoller als Mitleid.
- source_word: ἀσεβήσουσιν
  choice: gottlos handeln
  rationale: Das Verb beschreibt aktives Verhalten gegen Gott, nicht lediglich eine innere Haltung.
- source_word: ἐπὶ πρόσωπον πάσης τῆς γῆς
  choice: über die ganze Erde
  rationale: Natürliche deutsche Wiedergabe des semitisch gefärbten Ausdrucks, ohne seinen universalen Umfang abzuschwächen.
- source_word: τὸ σπλάγχνον Κυρίου
  choice: das Erbarmen des Herrn
  rationale: Wörtlich bezeichnet σπλάγχνον das Innerste beziehungsweise die Eingeweide als Sitz tiefen Mitgefühls; idiomatisch ist hier Erbarmen gemeint.
- source_word: ποιῶν δικαιοσύνην
  choice: der Gerechtigkeit übt
  rationale: Bewahrt den tätigen Charakter der Wendung und vermeidet eine abstrakte Beschreibung bloßer Rechtschaffenheit.
- source_word: ποιῶν ἔλεος
  choice: Barmherzigkeit erweist
  rationale: Die aktive Zuwendung des Handelnden wird in natürlichem Deutsch ausgedrückt.
- source_word: τοὺς μακρὰν καὶ τοὺς ἐγγύς
  choice: den Fernen wie den Nahen
  rationale: Bewahrt die räumlich oder übertragen zu verstehende Gegenüberstellung und ihre biblische Prägnanz.
theological_decisions:
- issue: Verhältnis zwischen dem Erbarmen des Herrn und dem folgenden Menschen
  choice: 'Doppelpunkt: „das Erbarmen des Herrn kommt: ein Mensch …“'
  alternative: „bis ein Mensch kommt, der das Erbarmen des Herrn ist“ oder zwei voneinander unabhängige Satzglieder
  rationale: Die griechische Apposition legt eine Identifikation oder Auslegung nahe, lässt deren genaue Art aber offen. Der Doppelpunkt bewahrt diese Spannung, ohne eine ausdrückliche Inkarnationsaussage oder eine bloße Trennung einzutragen.
- issue: Reichweite von „den Fernen und den Nahen“
  choice: offene, substantivische Formulierung
  alternative: ausdrückliche Deutung als Juden und Nichtjuden oder als geografische Gruppen
  rationale: Der Ausgangstext benennt keine ethnischen Gruppen. Die Übersetzung bewahrt daher die mögliche räumliche, religiöse oder soziale Mehrdeutigkeit.
- issue: Subjektwechsel von „ihr“ zu „sie“
  choice: den Wechsel beibehalten
  alternative: alle Aussagen konsequent in der zweiten Person formulieren
  rationale: Der griechische Text wechselt ausdrücklich von der zweiten Person Plural in Vers 3 zur dritten Person Plural in Vers 4; dieser auffällige Perspektivwechsel darf nicht harmonisiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Archaische Wendungen wie „es begab sich“ wurden vermieden; die feierliche prophetische Struktur „Und es wird geschehen“ bleibt erhalten. Der Text folgt primär dem angegebenen griechischen Wortlaut und nutzt die englische Fassung nur als konsultative Vergleichsebene.
