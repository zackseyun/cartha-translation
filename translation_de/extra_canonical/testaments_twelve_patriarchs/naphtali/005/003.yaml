  text: 3. Καὶ¹³ *ἐδράμομεν πάντες ὁμοῦ¹⁴ Γκαὶ¹⁵ ὁ¹⁶ Λευὶ¹⁷ ἐκράτησε τὸν ἥλιον *καὶ ὁ Ἰούδας φθάσας ἔπιασε τὴν σελήνην¹⁸, καὶ ὑψώθησαν ἀμφότεροι σὺν αὐτοῖς¹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/003.yaml
  text: And we all ran together, and Levi seized the sun, and Judah, arriving first, took hold of the moon; and both of them were lifted up with them.
translation:
  language: de
  text: Und wir alle liefen gemeinsam. Levi ergriff die Sonne, und Juda, der zuerst ankam, fasste den Mond; da wurden beide zusammen mit ihnen emporgehoben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδράμομεν πάντες ὁμοῦ
  choice: wir liefen alle gemeinsam los
  rationale: Gibt sowohl die gemeinsame Bewegung als auch den Beginn des Laufens in natürlichem modernem Deutsch wieder.
- source_word: ἐκράτησε
  choice: ergriff
  rationale: Bewahrt den kräftigen Sinn von »ergreifen, festhalten« und passt zum visionären Bild.
- source_word: φθάσας
  choice: gelangte als Erster ans Ziel
  rationale: Das Partizip bezeichnet hier im Zusammenhang eines Wettlaufs ein Zuvorkommen beziehungsweise früheres Eintreffen; die Formulierung macht diesen relationalen Sinn im Deutschen verständlich.
- source_word: ἔπιασε
  choice: fasste
  rationale: Entspricht dem konkreten Zugreifen, ohne unnötig dieselbe Wortwahl wie bei ἐκράτησε zu verwenden.
- source_word: ὑψώθησαν
  choice: wurden … emporgehoben
  rationale: Bewahrt das Passiv und die räumliche Aufwärtsbewegung.
theological_decisions:
- issue: Unbestimmter Bezug von αὐτοῖς
  choice: mit ihnen
  alternative: mit Sonne und Mond
  rationale: Das Pronomen bleibt wie im griechischen Text formal mehrdeutig; eine ausdrückliche Identifizierung seiner Bezugswörter würde die Bildaussage stärker festlegen als die Vorlage.
translation_notes:
  register: Moderne, würdige Erzählprosa. Der visionäre Charakter und die knappe Abfolge der Handlungen bleiben erhalten; ein Semikolon verbindet Ergreifen und Emporhebung eng miteinander.
