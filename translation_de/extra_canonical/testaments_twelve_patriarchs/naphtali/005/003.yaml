  source_fidelity: Die Übersetzung gibt die Abfolge und die Bildsprache im Wesentlichen zutreffend wieder. »ans Ziel« fügt jedoch ein im griechischen Text nicht ausdrücklich genanntes Ziel hinzu; φθάσας bezeichnet hier vielmehr, dass Juda zuerst ankam bzw. voraus war. Auch »los« ist als Beginnnuance in ἐδράμομεν nicht ausdrücklich enthalten.
  naturalness: Die Sprache ist insgesamt modern und gut lesbar. Eine partizipiale bzw. Relativsatzlösung für Juda ist im Deutschen natürlicher und genauer als »gelangte als Erster ans Ziel«.
  terminology: Levi und Juda sind korrekt wiedergegeben. »ergriff«/»fasste« und »emporgehoben« passen zum knappen, visionären Erzählregister. Der mehrdeutige Bezug von »mit ihnen« soll erhalten bleiben.
