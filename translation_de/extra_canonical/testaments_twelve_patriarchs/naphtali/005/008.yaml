source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 8. Καὶ εἶδον *ὅτι ἤμην παρεκεῖ⁴¹, καὶ ἰδοὺ γραφὴ *ἁγία ὤφθη ἡμῖν⁴², λέγουσα⁴³· Ἀσσύριοι⁴⁴, Μῆδοι⁴⁵, Πέρσαι⁴⁶, Χαλδαῖοι⁴⁷, Σύροι⁴⁸, κληρονομήσουσιν αἰχμαλωσίαν⁴⁹ τὰ δώδεκα σκῆπτρα τοῦ Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/008.yaml
  text: And I saw that I was there, and behold, a holy writing appeared to us, saying, “Assyrians, Medes, Persians, Chaldeans, Syrians shall inherit in captivity the twelve sceptres of Israel.”
translation:
  language: de
  text: 'Und ich sah, dass ich dort war, und siehe: Eine heilige Schrift erschien uns; sie lautete: »Assyrer, Meder, Perser, Chaldäer und Syrer werden die zwölf Zepter Israels als Gefangenschaft erben.«¹'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρεκεῖ
  choice: dort
  rationale: Das seltene Adverb bezeichnet hier den Ort der geschauten Szene; »dort« gibt den Sinn natürlich wieder, ohne eine genauere räumliche Bestimmung zu erzwingen.
- source_word: γραφὴ ἁγία
  choice: eine heilige Schrift
  rationale: Die formale Wiedergabe bewahrt sowohl den schriftlichen Charakter als auch die Heiligkeitsbezeichnung; der unbestimmte Artikel entspricht dem prädikativen Auftreten in der Vision.
- source_word: ὤφθη ἡμῖν
  choice: erschien uns
  rationale: Die passive Erscheinungsformel wird im Deutschen idiomatisch mit »erschien uns« wiedergegeben.
- source_word: λέγουσα
  choice: sie lautete
  rationale: Da das Subjekt eine Schrift ist, klingt »sie lautete« im Deutschen natürlicher als »sie sagte«, ohne den Aussagegehalt zu verändern.
- source_word: κληρονομήσουσιν
  choice: werden … als Erbe erhalten
  rationale: Bewahrt die Erbterminologie des Verbs κληρονομέω, obwohl die Verbindung mit Gefangenschaft ungewöhnlich bleibt.
- source_word: αἰχμαλωσίαν
  choice: in Gefangenschaft
  rationale: Der Akkusativ steht in einer syntaktisch schwierigen Verbindung mit »erben« und den »zwölf Zeptern«; die Übersetzung erhält den Gefangenschaftsgedanken, ohne ihn stillschweigend eindeutig als bloßes Verbannen oder Gefangennehmen auszulegen.
- source_word: τὰ δώδεκα σκῆπτρα τοῦ Ἰσραήλ
  choice: die zwölf Zepter Israels
  rationale: Die Metapher wird formal bewahrt und nicht interpretierend durch »Stämme« ersetzt; sie bezeichnet offenbar die zwölf Herrschafts- beziehungsweise Stammesverbände Israels.
theological_decisions:
- issue: Bezug der zwölf Zepter
  choice: Metaphorisch als »die zwölf Zepter Israels« stehen lassen
  alternative: »die zwölf Stämme Israels«
  rationale: Der griechische Text nennt ausdrücklich σκῆπτρα. Eine Auflösung zu »Stämme« wäre verständlicher, würde aber das Bild und seine mögliche Herrschaftsbedeutung beseitigen.
- issue: Verhältnis von Erbe und Gefangenschaft
  choice: Die spannungsreiche Formulierung »in Gefangenschaft als Erbe erhalten« bewahren
  alternative: »die zwölf Stämme Israels gefangen wegführen«
  rationale: Die Alternative wäre idiomatischer, ersetzt jedoch κληρονομέω durch ein nicht im Text stehendes Verb und löst die schwierige Syntax zu stark auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener visionärer Einleitung »Und siehe«. Die ungewöhnliche Verbindung von Erben und Gefangenschaft sowie das Bild der zwölf Zepter werden nicht geglättet.
