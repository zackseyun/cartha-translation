review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von παρεκεῖ, γραφὴ ἁγία, ὤφθη ἡμῖν und σκῆπτρα ist treffend. Bei κληρονομήσουσιν αἰχμαλωσίαν ist die griechische Konstruktion jedoch auffällig und semantisch nicht sicher auflösbar. Die Fassung „in Gefangenschaft als Erbe erhalten“ macht αἰχμαλωσίαν zu einer Umstandsangabe und fügt mit „erhalten“ eine erklärende Umschreibung hinzu. Die Revision belässt „Gefangenschaft“ daher näher am Wortlaut als Teil der schwierigen Erbformulierung und erläutert die Unsicherheit in einer Anmerkung.
  naturalness: Die visionäre Einleitung und „Und siehe“ entsprechen einem würdigen modernen Standardregister. Die revidierte Schlussformulierung bleibt absichtlich ungewöhnlich, weil eine glättende idiomatische Lösung den problematischen griechischen Wortlaut entweder zu „gefangen wegführen“ oder zu einer zeitlichen Angabe umdeuten würde.
  terminology: „Heilige Schrift“ und „die zwölf Zepter Israels“ bewahren die Begriffe γραφὴ ἁγία und σκῆπτρα ohne konfessionelle oder interpretierende Auflösung. „Zepter“ ist hier als bewusst beibehaltenes Bild angemessen.
  issues:
  - severity: medium
    issue: αἰχμαλωσίαν wird in der deutschen Fassung als bloße Umstandsangabe gelesen.
    rationale: „in Gefangenschaft als Erbe erhalten“ legt nahe, die genannten Völker erhielten die Zepter während einer Gefangenschaft. Im Griechischen steht αἰχμαλωσίαν als Akkusativ unmittelbar bei κληρονομήσουσιν; die genaue syntaktische Beziehung zu den „zwölf Zeptern“ ist schwierig und sollte nicht ohne Hinweis festgelegt werden.
  - severity: low
    issue: „als Erbe erhalten“ ist eine erläuternde, doppelte Umschreibung von κληρονομέω.
    rationale: Das Verb bedeutet bereits „erben/als Erbe empfangen“. „Erben“ wahrt die markierte und schwierige Wortwahl knapper und genauer.
  revised_text: 'Und ich sah, dass ich dort war, und siehe: Eine heilige Schrift erschien uns; sie lautete: »Assyrer, Meder, Perser, Chaldäer und Syrer werden die zwölf Zepter Israels als Gefangenschaft erben.«¹'
  revised_footnotes:
  - marker: ¹
    text: Die Verbindung „als Gefangenschaft erben“ gibt die im Griechischen schwierige Wortfolge wieder. Sie kann nicht sicher entscheiden, wie „Gefangenschaft“ syntaktisch zu „erben“ und zu den „zwölf Zeptern Israels“ gehört.
    reason: Die Anmerkung markiert die textliche und syntaktische Unklarheit, ohne sie durch eine Deutung wie „gefangen wegführen“ oder „während der Gefangenschaft“ aufzulösen.
  revision_rationale: Die Änderung beseitigt die durch „in Gefangenschaft als Erbe erhalten“ nahegelegte syntaktische Festlegung und bewahrt sowohl die Erbmetaphorik als auch die schwierige Stellung von „Gefangenschaft“. Die Fußnotenmarkierung dokumentiert die verbleibende Ambiguität unmittelbar am betroffenen Ausdruck.
