  source_fidelity: Die Übersetzung gibt die Satzstruktur, die Bildsprache, das historische Präsens von ἐπιδίδωσιν, die zwölf Palmzweige und die pluralische Unbestimmtheit von αὐτῶν insgesamt zuverlässig wieder. „wurde hell“ ist für ἐγένετο λαμπρός möglich, aber „wurde strahlend“ trifft die im unmittelbaren Sonnen- und Mondvergleich hervorgehobene Leuchtkraft genauer.
  naturalness: „Während Levi wie die Sonne war“ ist verständlich, wirkt im modernen Standarddeutsch jedoch unnötig holprig. „Während Levi der Sonne glich“ ist idiomatischer und wahrt den Vergleich. Nach „siehe“ ist das zusätzliche „da“ nicht erforderlich und klingt leicht redundant.
  terminology: Levi, Juda, Sonne, Mond, Palmzweige und Strahlen sind angemessen. „Strahlend“ bewahrt bei λαμπρός die visuelle Bildsprache, ohne sie zu einer Aussage über Ruhm oder Rang umzudeuten.
