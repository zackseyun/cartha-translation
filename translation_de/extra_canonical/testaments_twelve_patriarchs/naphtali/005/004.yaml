base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/004.yaml
  text: And while Levi was like the sun, behold, a certain young man gives him twelve palm branches; and Judah became bright like the moon, and beneath their feet were twelve rays.
translation:
  language: de
  text: Und während Levi der Sonne glich, siehe, reicht ihm ein junger Mann zwölf Palmzweige; und Juda wurde strahlend wie der Mond, und unter ihren Füßen waren zwölf Strahlen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄντος τοῦ Λευὶ ὡς ὁ ἥλιος
  choice: während Levi wie die Sonne war
  rationale: Gibt die Genitivus-absolute-Konstruktion und den Vergleich eng am Griechischen wieder.
- source_word: ἰδοὺ
  choice: siehe, da
  rationale: Bewahrt das visionäre Aufmerksamkeitssignal und verbindet es zugleich natürlich mit dem folgenden Geschehen.
- source_word: νέος τις
  choice: ein junger Mann
  rationale: Das substantivisch gebrauchte νέος bezeichnet hier am natürlichsten einen nicht näher bestimmten jungen Mann.
- source_word: ἐπιδίδωσιν
  choice: reicht
  rationale: Das historische Präsens wird als lebendiges Präsens bewahrt; „reichen“ passt idiomatisch zur Übergabe der Zweige.
- source_word: βαΐα φοινίκων δώδεκα
  choice: zwölf Palmzweige
  rationale: Eine natürliche deutsche Wiedergabe für zwölf Zweige beziehungsweise Wedel von Palmen.
- source_word: λαμπρὸς
  choice: hell
  rationale: Passt zum Vergleich mit dem Mond und vermeidet eine unnötige Festlegung auf Glanz, Ruhm oder Pracht.
- source_word: ἀκτῖνες
  choice: Strahlen
  rationale: Bewahrt die naheliegende Lichtbildsprache im Zusammenhang mit Sonne und Mond.
theological_decisions:
- issue: Symbolische Bedeutung der zwölf Palmzweige und zwölf Strahlen
  choice: Die Bildsprache bleibt ohne Deutung stehen.
  alternative: Die Zwölf ausdrücklich mit den zwölf Stämmen oder einer anderen theologischen Größe identifizieren.
  rationale: Der Vers selbst erklärt die Symbole nicht; eine Deutung im Haupttext würde die genuine Offenheit des Visionsbildes einschränken.
- issue: Bezug von αὐτῶν in „unter ihren Füßen“
  choice: Pluralisch mit „ihren“ wiedergegeben, ohne den Bezug weiter zu präzisieren.
  alternative: Den Bezug ausdrücklich auf Levi und Juda oder auf andere Figuren festlegen.
  rationale: Das griechische Pronomen ist pluralisch, doch die genaue Zuordnung sollte nicht über den Wortlaut hinaus erläutert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrter visionärer Erzählweise. Das historische Präsens bei ἐπιδίδωσιν bleibt erhalten; die übrigen Vergangenheitsformen folgen dem Tempusprofil des griechischen Textes.
