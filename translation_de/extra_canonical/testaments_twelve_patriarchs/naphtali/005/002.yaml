source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: V. Ἐν γὰρ *τῷ τεσσαρακοστῷ ἔτει τῆς¹ ζωῆς μου, εἶδον² *⌈ὄραμα⌉³ ἐν τῷ ὄρει τοῦ Ἐλαιῶνος³ κατὰ ἀνατολὰς Ἱερουσαλήμ, ὅτι⁴ ὁ ἥλιος καὶ ἡ σελήνη ἕστηκαν⁵. 2. Καὶ ἰδοὺ Ἰσαὰκ⁶ ὁ πατὴρ *τοῦ πατρός⁷ μου⁸ ἔλεγεν⁹ ἡμῖν· Προσδραμόντες *κρατήσατε ἕκαστος¹⁰ κατὰ δύναμιν¹¹, Γκαὶ *τοῦ πιάσαντος¹² ἔσται ὁ ἥλιος καὶ ἡ σελήνη˥.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/002.yaml
  text: V. For in the fortieth year of my life, I saw a vision on the Mount of Olives, east of Jerusalem, that the sun and the moon were standing still. 2 And behold, Isaac, the father of my father, said to us, “Run up, and let each of you seize according to his strength; and the one who takes hold shall have the sun and the moon.”
translation:
  language: de
  text: 'V. Denn im vierzigsten Jahr meines Lebens sah ich auf dem Ölberg, östlich von Jerusalem, eine Vision: Die Sonne und der Mond standen still. 2 Und siehe, Isaak, der Vater meines Vaters, sagte zu uns: »Lauft herbei, und jeder ergreife nach seiner Kraft; wer zugreift, dem werden die Sonne und der Mond gehören.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὄραμα
  choice: Vision
  rationale: Gibt die visionäre Schau präzise und im Deutschen natürlich wieder.
- source_word: ἕστηκαν
  choice: standen still
  rationale: Das Perfekt von ἵστημι bezeichnet hier den erreichten Zustand des Stillstehens von Sonne und Mond.
- source_word: Προσδραμόντες
  choice: Lauft herbei
  rationale: Bewahrt die Aufforderung zu einer raschen Annäherung, ohne ein im Deutschen unpassendes Bewegungsziel hinzuzufügen.
- source_word: κρατήσατε ἕκαστος κατὰ δύναμιν
  choice: jeder ergreife nach seiner Kraft
  rationale: Erhält sowohl den nicht ausdrücklich genannten Gegenstand als auch die Verteilung auf jeden Einzelnen entsprechend seiner Kraft.
- source_word: τοῦ πιάσαντος
  choice: wer zugreift
  rationale: Gibt das substantivierte Partizip idiomatisch wieder und vermeidet wie der griechische Text ein ergänztes Objekt.
- source_word: ἔσται ὁ ἥλιος καὶ ἡ σελήνη
  choice: dem werden die Sonne und der Mond gehören
  rationale: Drückt die Zugehörigkeitskonstruktion mit ἔσται natürlich aus; der Dativ »dem« entspricht dem impliziten Bezug auf den Zugreifenden.
theological_decisions:
- issue: Unbestimmter Gegenstand des Ergreifens
  choice: 'Kein Objekt ergänzt: »ergreife« / »wer zugreift«'
  alternative: »ergreife sie« / »wer sie ergreift«
  rationale: Obwohl Sonne und Mond aus dem Kontext als Gegenstand naheliegen, lässt der griechische Wortlaut das Objekt unausgesprochen. Diese Offenheit bleibt erhalten.
- issue: Bedeutung des Besitzsatzes
  choice: »dem werden die Sonne und der Mond gehören«
  alternative: »der wird die Sonne und den Mond haben«
  rationale: Die gewählte Formulierung bewahrt den Besitzsinn, ohne näher festzulegen, worin dieses visionäre Gehören besteht.
translation_notes:
  register: Moderne, würdige Standardsprache. Das einleitende »Denn« und das visionäre »Und siehe« bewahren den antiken Erzählton. Die wörtliche Verwandtschaftsbezeichnung »Vater meines Vaters« bleibt gegenüber dem glatteren »Großvater« erhalten.
