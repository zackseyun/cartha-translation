  source_fidelity: 'Die Übersetzung bildet die Satzfolge und die wesentlichen Bedeutungen des Griechischen zuverlässig ab: ἐλθών δέ als adversativ angeschlossenes „Doch ... kam“, κατέλαβεν als „ergriff ihn“, συνανῆλθεν als gemeinsames Hinaufsteigen und εἰς τὸ ὕψος als offene Zielangabe „zur Höhe“. Die maskulinen Pronomina αὐτόν/αὐτῷ werden korrekt mit „ihn/ihm“ wiedergegeben.'
  naturalness: „Doch Josef kam, ergriff ihn und stieg mit ihm zur Höhe hinauf“ ist klares, modernes und zugleich würdiges Standarddeutsch. Die Verbindung „zur Höhe hinauf“ ist trotz der semantischen Nähe von Präposition und Verb idiomatisch und bewahrt sowohl Zielrichtung als auch Aufwärtsbewegung.
  terminology: „Josef“ entspricht dem etablierten deutschen Namen; „ergriff“ ist für κατέλαβεν treffend, ohne den Vorgang übermäßig zu dramatisieren. „Höhe“ bewahrt die im griechischen Ausdruck vorhandene Unbestimmtheit und legt weder Himmel noch einen bestimmten Ort aus.
