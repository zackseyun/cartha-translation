source:
  edition: Charles 1908 Greek Versions (pages 214-231, Naphtali pilot)
  text: 7. *ἐλθὼν δὲ Ἰωσὴφ κατέλαβεν³⁸ αὐτόν, καὶ συνανῆλθεν³⁹ αὐτῷ εἰς τὸ⁴⁰ ὕψος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/007.yaml
  text: But Joseph came and seized him, and went up with him to the height.
translation:
  language: de
  text: Doch Josef kam, ergriff ihn und stieg mit ihm zur Höhe hinauf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλθὼν
  choice: kam
  rationale: Das aoristische Partizip bezeichnet hier eine dem Ergreifen vorausgehende Bewegung; im Deutschen ist die finite Reihung natürlich.
- source_word: κατέλαβεν
  choice: ergriff
  rationale: „Ergriff“ gibt das entschlossene Fassen von καταλαμβάνω wieder, ohne die mögliche Gewaltnuance mit „packte“ oder „nahm gefangen“ unnötig festzulegen.
- source_word: συνανῆλθεν
  choice: stieg mit ihm … hinauf
  rationale: Die Verbindung aus συν- und ἀνά drückt gemeinsames Hinaufsteigen aus; die deutsche Verbklammer gibt beide Bestandteile idiomatisch wieder.
- source_word: εἰς τὸ ὕψος
  choice: zur Höhe
  rationale: Die Richtungsangabe wird wörtlich und zugleich natürlich wiedergegeben; die nicht näher bestimmte „Höhe“ bleibt erhalten.
theological_decisions:
- issue: Bezug des männlichen Pronomens αὐτόν/αὐτῷ
  choice: ihn / mit ihm
  alternative: es / mit ihm beziehungsweise mit diesem
  rationale: Die griechischen Formen sind eindeutig maskulin; daher wird kein sächlicher Bezug aus dem weiteren Kontext eingeführt.
- issue: Deutung von τὸ ὕψος
  choice: die Höhe
  alternative: der Himmel oder ein bestimmter erhöhter Ort
  rationale: Der griechische Ausdruck benennt nur „die Höhe“. Eine kosmologische oder räumlich konkretere Deutung wäre eine nicht ausdrücklich markierte Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe parataktische Bewegung des griechischen Satzes bleibt erhalten; „Doch“ markiert den adversativen Anschluss von δέ.
