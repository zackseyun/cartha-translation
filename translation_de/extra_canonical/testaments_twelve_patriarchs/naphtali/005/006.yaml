base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/naphtali/005/006.yaml
  text: And behold, a bull was on the earth, having two great horns and the wings of an eagle on its back; and though we wanted to seize it, we were not able.
translation:
  language: de
  text: 'Und siehe: Auf der Erde war ein Stier mit zwei großen Hörnern und den Flügeln eines Adlers auf seinem Rücken. Wir wollten ihn ergreifen, konnten es aber nicht.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: siehe
  rationale: Bewahrt das visionäre Aufmerksamkeitssignal des griechischen Textes in würdiger, geläufiger biblischer Sprache.
- source_word: ταῦρος
  choice: Stier
  rationale: Die direkte und im Deutschen natürliche Entsprechung für das männliche Rind.
- source_word: πτέρυγας ἀετοῦ
  choice: die Flügel eines Adlers
  rationale: Gibt die Genitivverbindung konkret und quellennah wieder, ohne sie zum bloßen Vergleich abzuschwächen.
- source_word: πιάσαι
  choice: ergreifen
  rationale: Drückt den Versuch aus, das Tier in die Gewalt zu bekommen; das gehobene, aber verständliche Wort passt zum visionären Kontext.
- source_word: οὐκ ἠδυνήθημεν
  choice: konnten es aber nicht
  rationale: Natürliche deutsche Wiedergabe der Unfähigkeit; „es“ nimmt den beabsichtigten Vorgang des Ergreifens auf.
