  text: 9. Καὶ νῦν, τέκνα μου⁶⁵, τὴν ἀλήθειαν ἀγαπᾶτε⁶⁶ be, A καὶ αὕτη⁶⁷ *φυλάξει ὑμᾶς⁶⁸. Ἀκούσατε ⌜λόγους⌝⁶⁹ Ῥουβὴμ διδάσκω τοῦ πατρὸς ὑμῶν⁷⁰. ὑμᾶς.
