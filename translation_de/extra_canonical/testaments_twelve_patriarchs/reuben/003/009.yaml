base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/009.yaml
  text: And now, my children, love the truth, and it will guard you. Hear the words of Reuben, your father, as I teach you.
translation:
  language: de
  text: Und nun, meine Kinder, liebt die Wahrheit, und sie wird euch bewahren. Hört die Worte, die ich, Ruben, euer Vater, euch lehre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν ἀλήθειαν ἀγαπᾶτε
  choice: liebt die Wahrheit
  rationale: Gibt den Imperativ und das direkte Objekt schlicht und quellennah wieder.
- source_word: φυλάξει ὑμᾶς
  choice: sie wird euch bewahren
  rationale: „Bewahren“ bildet die schützende Bedeutung von φυλάσσω ab, ohne die Aussage unnötig zu konkretisieren.
- source_word: λόγους
  choice: Worte
  rationale: Die gewöhnliche und im Zusammenhang natürliche Wiedergabe des Plurals λόγους.
- source_word: διδάσκω ... ὑμᾶς
  choice: mit denen ich euch unterweise
  rationale: Verbindet das syntaktisch schwierige Ende verständlich mit „Worte“, bewahrt aber die ausdrückliche Lehrtätigkeit und das Objekt „euch“.
theological_decisions:
- issue: Personifizierung beziehungsweise Wirksamkeit der Wahrheit
  choice: „sie wird euch bewahren“
  alternative: „das wird euch bewahren“
  rationale: Das feminine Pronomen αὕτη bezieht sich grammatisch auf ἀλήθεια; die deutsche Formulierung erhält diesen direkten Bezug, ohne Art oder Ursache des Schutzes dogmatisch auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede „meine Kinder“ und „eures Vaters“ bewahrt den familiären Lehrton. Wegen der offenbar gestörten beziehungsweise variantenreichen Wortstellung am Versende wurde eine natürliche deutsche Verknüpfung gewählt, ohne zusätzlichen Inhalt einzuführen.
