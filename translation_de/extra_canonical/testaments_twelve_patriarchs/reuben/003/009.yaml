- from: Und nun, meine Kinder, liebt die Wahrheit, und sie wird euch bewahren. Hört die Worte Rubens, eures Vaters, mit denen ich euch unterweise.
  to: Und nun, meine Kinder, liebt die Wahrheit, und sie wird euch bewahren. Hört die Worte, die ich, Ruben, euer Vater, euch lehre.
  rationale: Der erste Satz bleibt unverändert. Der zweite Satz wird so gefasst, dass der Sprecher als Ruben, der Vater der Angeredeten, ausdrücklich die Worte an sie lehrt. Damit wird die beabsichtigte Selbstbezeichnung verständlich wiedergegeben, ohne die unsichere griechische Wortstellung mit zusätzlichem Inhalt aufzulösen.
