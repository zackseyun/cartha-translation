base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/010.yaml
  text: Do not look at a woman's appearance, nor associate with a married woman, nor pry into the affairs of women.
translation:
  language: de
  text: Achtet nicht auf das Aussehen einer Frau, geht nicht mit einer verheirateten Frau[a] um und forscht nicht neugierig nach dem Tun von Frauen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „haltet euch nicht mit einer verheirateten Frau zusammen auf“. Der griechische Ausdruck bezeichnet Umgang oder Zusammensein, ohne die genaue Art der Verbindung festzulegen.'
    reason: Bewahrt die offene Bedeutung von συνδιάζετε und vermeidet die zusätzliche Intensivierung „vertraut“ sowie eine sexuelle Festlegung.
lexical_decisions:
- source_word: προσέχετε ὄψει γυναικείᾳ … ὄψιν
  choice: Achtet nicht auf das Aussehen einer Frau
  rationale: προσέχω bezeichnet das Richten der Aufmerksamkeit auf etwas; ὄψις kann Blick, äußere Erscheinung oder Aussehen bedeuten. „Aussehen“ gibt hier den Bezug auf die äußere Erscheinung natürlich wieder, ohne ein bestimmtes Motiv hinzuzufügen.
- source_word: συνδιάζετε
  choice: pflegt keinen vertrauten Umgang
  rationale: Das Verb bezeichnet ein Zusammensein beziehungsweise eine enge Verbindung. „Vertrauten Umgang pflegen“ wahrt die soziale Nähe des Ausdrucks, ohne ihn ausdrücklich als sexuelle Beziehung festzulegen.
- source_word: θηλείας ὑπάνδρου
  choice: mit einer verheirateten Frau
  rationale: ὕπανδρος bezeichnet wörtlich eine Frau, die unter beziehungsweise bei einem Mann ist, idiomatisch also eine verheiratete Frau.
- source_word: περιεργάζεσθε πρᾶξιν γυναικῶν
  choice: forscht nicht neugierig nach dem Tun von Frauen
  rationale: περιεργάζομαι kann ein unangebrachtes, neugieriges Erforschen oder Sich-Einmischen ausdrücken; πρᾶξις meint Tun, Handeln oder Verhalten.
theological_decisions:
- issue: Art der verbotenen Verbindung mit einer verheirateten Frau
  choice: vertrauter Umgang
  alternative: sexuelle Beziehung oder bloßes Zusammensein
  rationale: Der griechische Ausdruck lässt den genauen Grad der Nähe offen. Die Übersetzung konkretisiert ihn daher weder zu Ehebruch noch schwächt sie ihn zu beliebigem Kontakt ab.
translation_notes:
  register: Moderne, würdige Standardsprache in direkter pluralischer Mahnrede. Die drei parallelen Verbote bleiben syntaktisch klar verbunden; „Tun“ hält den letzten Ausdruck bewusst allgemein.
