base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/005.yaml
  text: Fifth, a spirit of pride, so that one boasts and thinks grand thoughts. Sixth, a spirit of falsehood, in destruction and jealousy, to forge words and hide words from his own family and household.
translation:
  language: de
  text: 'Fünftens: ein Geist des Hochmuts, damit man sich rühmt und sich für groß hält. Sechstens: ein Geist der Lüge, in Verderben und Eifersucht,[a] um Worte zu erfinden und seine eigenen Worte vor seiner Verwandtschaft und seinen Hausgenossen zu verbergen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Wendung „in Verderben und Eifersucht“ ist textkritisch unsicher und in ihrem genauen Zusammenhang schwer zu bestimmen.
    reason: Kennzeichnet die im Ausgangstext durch Kreuze markierte, syntaktisch schwierige Lesart, ohne eine unsichere Deutung in den Haupttext einzutragen.
lexical_decisions:
- source_word: ὑπερηφανείας
  choice: Hochmut
  rationale: Gibt die überhebliche Selbsterhöhung des griechischen Begriffs natürlich und würdig wieder.
- source_word: καυχᾶται
  choice: sich rühmen
  rationale: Bewahrt die Grundbedeutung des Sich-Brüstens beziehungsweise Rühmens.
- source_word: μεγαλοφρονῇ
  choice: sich für groß halten
  rationale: Gibt die auf die eigene Größe gerichtete Gesinnung idiomatisch wieder, ohne sie unnötig zu präzisieren.
- source_word: ψεύδους
  choice: Lüge
  rationale: Direkte und im Deutschen natürliche Entsprechung zu ψεῦδος.
- source_word: πλάττειν λόγους
  choice: Worte erfinden
  rationale: πλάσσειν bezeichnet hier das Formen oder Erdichten von Aussagen; „Worte erfinden“ vermittelt den Zusammenhang mit dem Geist der Lüge klarer als das missverständliche „Worte formen“.
- source_word: γένους καὶ οἰκείων
  choice: Familie und Hausgenossen
  rationale: 'Hält die beiden Bezugsgruppen auseinander: γένος bezeichnet die eigene Verwandtschaft beziehungsweise Familie, οἰκεῖοι die Angehörigen des Hauses oder engeren Haushalts.'
theological_decisions:
- issue: Bezug und Textsicherheit von ἐν ἀπωλείᾳ καὶ ζήλῳ
  choice: „in Verderben und Eifersucht“ im Haupttext bewahren und textkritisch markieren
  alternative: Sinngemäß als „das zu Verderben und Eifersucht führt“ auflösen oder den Ausdruck auslassen
  rationale: Die überlieferte Formulierung ist textkritisch unsicher und syntaktisch schwierig. Eine kausale oder resultative Deutung wäre möglich, ist aber nicht eindeutig; deshalb wird die Spannung nicht stillschweigend beseitigt.
- issue: Subjektwechsel beim Verbergen
  choice: „vor seiner eigenen Familie und seinen Hausgenossen“
  alternative: Geschlechtsneutral „vor der eigenen Familie und den eigenen Hausgenossen“
  rationale: Das griechische αὐτοῦ ist maskulin singular und bezieht sich wahrscheinlich auf den vom Geist beeinflussten Menschen. Die Übersetzung erhält diesen Bezug, ohne zusätzliche theologische Deutung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die wiederholte Gliederung „Als Fünftes … Als Sechstes“ macht die Aufzählung natürlich lesbar; die Wiederholung von „Worte“ folgt bewusst dem griechischen Ausdruck.
