lexical_decisions:
- source_word: συμμίγνυται
  choice: vermischen sich
  rationale: Gibt die wechselseitige Verbindung bzw. Beimischung natürlich wieder, ohne die im Griechischen nicht ausdrücklich genannten Handelnden festzulegen.
- source_word: τὰ πνεύματα τῆς πλάνης
  choice: die Geister der Verirrung
  rationale: Bewahrt die Genitivverbindung und das Bedeutungsfeld von πλάνη als Irregehen, Täuschung oder Irrtum; „Verirrung“ lässt diese Spannung eher bestehen als das engere „Irrtum“.
theological_decisions:
- issue: Personifizierung der πλάνη-Geister
  choice: Geister der Verirrung
  alternative: Geister des Irrtums / irreführende Geister
  rationale: Die formale Genitivkonstruktion bleibt erhalten; die Übersetzung entscheidet nicht, ob Ursprung, Eigenschaft oder Wirkung der Geister gemeint ist.
translation_notes:
  register: Kurzer, würdevoller Satz in modernem Standarddeutsch; die Wiederholung von „Geister“ entspricht der pointierten Struktur des griechischen Textes.
