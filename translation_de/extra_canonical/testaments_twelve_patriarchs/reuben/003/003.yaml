source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 3. Πρῶτον¹² *τὸ τῆς πορνείας πνεῦμα¹³ ἐν τῇ φύσει¹⁴ καὶ¹⁵ *ταῖς αἰσθήσεσιν¹⁶ ἔγκειται¹⁷. *Δεύτερον πνεῦμα¹⁸ ἀπλη- στείας¹⁹ γαστρός²⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/003.yaml
  text: First, the spirit of sexual immorality is lodged in the nature and in the senses. Second, a spirit of greediness of the belly.
translation:
  language: de
  text: 'Erstens: Der Geist der sexuellen Unmoral liegt in der Natur und in den Sinnen. Zweitens: ein Geist der Unersättlichkeit des Bauches.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνείας
  choice: Unzucht
  rationale: Bezeichnet sexuelle Unmoral in knapper, würdevoller Sprache und bewahrt den ethischen Gehalt des griechischen Ausdrucks.
- source_word: ἐν τῇ φύσει
  choice: in der menschlichen Natur
  rationale: „Menschlichen“ verdeutlicht im Deutschen den im Zusammenhang gemeinten Bezug, ohne φύσις auf eine bestimmte anthropologische Lehrposition festzulegen.
- source_word: ταῖς αἰσθήσεσιν
  choice: in den Sinnen
  rationale: Gibt die Wahrnehmungs- und Sinnesvermögen direkt wieder und bewahrt die mögliche anthropologische Breite.
- source_word: ἔγκειται
  choice: liegt
  rationale: Entspricht dem Bild des Innewohnens beziehungsweise Angelegtseins, ohne eine stärkere metaphysische Aussage einzutragen.
- source_word: ἀπληστείας γαστρός
  choice: Unersättlichkeit des Bauches
  rationale: Bewahrt die konkrete Körpermetapher γαστήρ und gibt ἀπληστία als maßloses, nicht zu sättigendes Verlangen wieder.
theological_decisions:
- issue: Verhältnis des Geistes der Unzucht zur menschlichen Natur und zu den Sinnen
  choice: Die räumlich-anthropologische Aussage wird wörtlich als „liegt in“ wiedergegeben.
  alternative: „ist der Natur und den Sinnen eingepflanzt“ oder „wohnt ... inne“
  rationale: Der Text lässt offen, ob eine bloße Verankerung, eine innewohnende Macht oder eine Anlage gemeint ist; „liegt in“ bewahrt diese Spannung.
- issue: Genitivverbindung ἀπληστείας γαστρός
  choice: „Unersättlichkeit des Bauches“
  alternative: „Gier des Bauches“ oder „Gefräßigkeit“
  rationale: Die gewählte Form lässt offen, ob besonders Essgier oder allgemeiner ein maßloses leibliches Verlangen bezeichnet wird, und erhält zugleich das Bild des Bauches.
translation_notes:
  register: Knappe, aufzählende Satzstruktur nach dem Griechischen. Modernes, würdiges Standarddeutsch; der zweite nominale Satz bleibt als bewusst elliptische Fortsetzung erhalten.
