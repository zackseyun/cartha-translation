id: T12P.REU.3.7
reference: Testament of Reuben 3:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '[7. Ἐπὶ⁴⁷ πᾶσι δὲ⁴⁸ τούτοις *τὸ νου, τὸ πνεῦμα⁴⁹ τοῦ ὕπνου⁵⁰ συνάπτεται⁵¹ *ὃ ἐστι⁵² *πλάνης καὶ ὄγδοον φαντασίας⁵³.]'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/007.yaml
  text: And over all these, the spirit of sleep is joined, which is error and the eighth of fantasy.
translation:
  language: de
  text: Zu all diesen kommt aber der Geist des Schlafes hinzu; er ist Irrtum und der achte der Einbildung.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut dieses Satzteils ist unsicher und elliptisch. Möglich ist auch ein Verständnis im Sinn von: „Er ist der achte Geist des Irrtums und der Einbildung.“'
    reason: Die handschriftlich beziehungsweise editorisch unsichere Konstruktion um πλάνης καὶ ὄγδοον φαντασίας lässt mehrere syntaktische Zuordnungen zu.
lexical_decisions:
- source_word: ἐπὶ πᾶσι δὲ τούτοις
  choice: Zu all diesen … aber
  rationale: Gibt den Bezug auf sämtliche zuvor genannten Geister und die weiterführende, leicht kontrastierende Partikel δέ natürlich wieder.
- source_word: τὸ πνεῦμα τοῦ ὕπνου
  choice: der Geist des Schlafes
  rationale: Bewahrt die formale und im Kontext zentrale Rede vom πνεῦμα als „Geist“.
- source_word: συνάπτεται
  choice: kommt … hinzu
  rationale: Das Medium bezeichnet hier ein Verbundensein beziehungsweise Hinzutreten; „kommt hinzu“ ist im Deutschen natürlich und wahrt den Aufzählungszusammenhang.
- source_word: πλάνης
  choice: Irrtum
  rationale: Bewahrt den Abstraktbegriff und vermeidet eine unnötige Festlegung auf moralische Verführung oder bloße Täuschung.
- source_word: φαντασίας
  choice: Einbildung
  rationale: Gibt φαντασία als innere Vorstellung beziehungsweise Trugvorstellung wieder, ohne den modernen engeren Sinn von „Fantasie“ aufzudrängen.
theological_decisions:
- issue: Beziehung von Schlaf, Irrtum und dem „Achten“
  choice: Die elliptische Reihung bleibt als „er ist Irrtum und der achte der Einbildung“ sichtbar.
  alternative: „Er ist der achte Geist des Irrtums und der Einbildung.“
  rationale: Der überlieferte griechische Wortlaut ist grammatisch schwierig und setzt πλάνης und ὄγδοον φαντασίας nicht eindeutig zu einer glatten Einheit zusammen. Die Übersetzung löst diese Spannung daher nicht stillschweigend auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Schlussformulierung ist bewusst nicht geglättet, weil bereits der griechische Text textlich und syntaktisch unsicher ist.
