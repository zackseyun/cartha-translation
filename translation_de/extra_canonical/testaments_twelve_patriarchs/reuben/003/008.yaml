source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 8. Καὶ οὕτως ἀπόλλυται πᾶς νεώτερος⁵⁴, πνεῦμα. σκοτίζων⁵⁵ τὸν νοῦν ⌜αὐτοῦ⌝⁵⁶ ἀπὸ τῆς ἀληθείας, καὶ μὴ α, αe, *συνιὼν ἐν⁵⁷ τῷ νόμῳ τοῦ θεοῦ⁵⁸, μήτε⁵⁹ ἀκούων⁶⁰ νουθεσίας⁶¹ πλάνη καὶ φαν- πατέρων αὐτοῦ⁶² ὡς⁶³ κἀγὼ ἔπαθον⁶⁴ ἐν τῷ νεωτερισμῷ τασία. μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/008.yaml
  text: And so every young man is destroyed, darkening his mind from the truth and not understanding the law of God, nor listening to the instruction of his fathers, just as I also suffered in my youth.
translation:
  language: de
  text: 'Und so geht jeder junge Mann zugrunde: Er verdunkelt seinen Sinn für die Wahrheit, versteht das Gesetz Gottes nicht und hört nicht auf die Ermahnung seiner Väter – so, wie auch ich in meiner Jugend darunter litt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόλλυται
  choice: geht … zugrunde
  rationale: Gibt den starken medial-passiven Sinn von Verderben bzw. Zugrundegehen natürlich wieder, ohne die Art des Verderbens näher festzulegen.
- source_word: πᾶς νεώτερος
  choice: jeder junge Mensch
  rationale: Bewahrt den allgemeinen Bezug auf einen jungen Menschen und vermeidet die unnötig geschlechtsspezifische Verengung von „jeder junge Mann“.
- source_word: σκοτίζων τὸν νοῦν αὐτοῦ ἀπὸ τῆς ἀληθείας
  choice: Er verdunkelt seinen Sinn für die Wahrheit
  rationale: „Sinn“ erfasst νοῦς als Denk- und Erkenntnisvermögen; die Wendung hält die ungewöhnliche Verbindung mit ἀπό sprachlich verständlich, ohne sie zu einer eindeutigen Abkehr umzudeuten.
- source_word: συνιὼν ἐν τῷ νόμῳ τοῦ θεοῦ
  choice: versteht das Gesetz Gottes
  rationale: Die griechische Formulierung ist syntaktisch auffällig; die Wiedergabe folgt dem naheliegenden Sinn und der konsultierten englischen Fassung.
- source_word: νουθεσίας πατέρων αὐτοῦ
  choice: die Ermahnung seiner Väter
  rationale: νουθεσία bezeichnet mahnende, zurechtweisende Unterweisung; der Singular ist im Deutschen als zusammenfassender Begriff natürlich.
- source_word: ἐν τῷ νεωτερισμῷ μου
  choice: in meiner Jugend
  rationale: Im Zusammenhang bezeichnet die Wendung die Zeit jugendlichen Verhaltens; „Jugend“ ist klar und idiomatisch.
theological_decisions:
- issue: Verhältnis des jungen Menschen zum Verderben
  choice: „geht … zugrunde“
  alternative: „wird … vernichtet“
  rationale: Die mediale Form lässt den Vorgang offen; die Übersetzung vermeidet sowohl einen ausdrücklich äußeren Vernichter als auch eine rein psychologische Selbstschädigung.
- issue: Gegenstand des Nichtverstehens
  choice: „versteht das Gesetz Gottes nicht“
  alternative: „gewinnt im Gesetz Gottes keine Einsicht“
  rationale: Die einfachere Formulierung bewahrt die Aussage, ohne eine besondere Lehre über Gesetzeserkenntnis einzutragen.
- issue: Reubens rückblickende Selbstaussage
  choice: „wie auch ich … darunter litt“
  alternative: „wie es auch mir … erging“
  rationale: ἔπαθον bezeichnet ein Erleiden oder eine leidvolle Erfahrung; „darunter litt“ wahrt diese Stärke und verbindet sie mit dem zuvor beschriebenen Verderben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt macht das folgende Partizip und die parallelen Verben als Entfaltung des Zugrundegehens lesbar. Keine konfessionell geprägte Terminologie; die Bildsprache von der Verdunkelung des νοῦς bleibt erhalten.
