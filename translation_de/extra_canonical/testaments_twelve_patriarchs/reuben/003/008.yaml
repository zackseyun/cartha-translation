  source_fidelity: 'Der Satzbau und die Abfolge der griechischen Aussage sind im Wesentlichen treffend wiedergegeben: Zugrundegehen, Verdunkelung des νοῦς im Verhältnis zur Wahrheit, fehlendes Verständnis des Gesetzes Gottes, Nichtbeachtung väterlicher Mahnung und Reubens Rückblick. πᾶς νεώτερος ist jedoch maskulinisch substantiviert und bezeichnet hier, im Einklang mit der englischen Audit-Fassung, einen jungen Mann; „jeder junge Mensch“ verallgemeinert dies über den Wortlaut hinaus.'
  naturalness: Die Übersetzung ist modernes, würdiges und gut lesbares Standarddeutsch. „Sinn für die Wahrheit“ ist eine natürliche Deutung des schwierigen Ausdrucks σκοτίζων τὸν νοῦν … ἀπὸ τῆς ἀληθείας und legt keine zusätzliche dogmatische Aussage fest.
  terminology: „Gesetz Gottes“, „Ermahnung seiner Väter“ und „Jugend“ sind angemessen. „Väter“ kann im Kontext sowohl die leiblichen Väter als auch die väterliche Überlieferung umfassen und sollte nicht ohne Anlass zu „Vorfahren“ eingeengt werden.
