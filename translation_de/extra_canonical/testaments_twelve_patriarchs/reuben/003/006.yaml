revisions:
- from: Das siebte ist ein Geist der Ungerechtigkeit, mit dem Diebstähle und Habgier einhergehen, damit er die Genusssucht des Herzens sättigt. Denn die Ungerechtigkeit wirkt durch Geben und Nehmen mit den übrigen Geistern zusammen.[a]
  to: 'Siebtens: ein Geist der Ungerechtigkeit; mit ihr gehen Diebstähle und Habgier einher, damit sie die Lust des Herzens erfüllt. Denn die Ungerechtigkeit wirkt durch Geben und Nehmen mit den übrigen Geistern zusammen.[a]'
  rationale: Die Revision korrigiert den grammatischen Bezug des Relativpronomens und gibt das Bild von ἐμπλήσει mit „erfüllt“ näher wieder. Der beschädigte griechische Zweck-/Folgesatz wird nur so weit geglättet, wie es für verständliches modernes Deutsch nötig ist; insbesondere wird keine im Text nicht gesicherte Person wie „sein Herz“ eingeführt. Die Fußnote bleibt am Ausdruck δοσοληψία verankert und hält dessen wirtschaftliche Lesart offen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:03:30Z'
review_pass:
  verdict: revise
  source_fidelity: Die Fassung gibt die Aufzählung, Diebstähle, Habgier und das Zusammenwirken der Ungerechtigkeit mit den anderen Geistern grundsätzlich zutreffend wieder. Jedoch bezieht sich das feminine Relativpronomen μεθ’ ἧς auf ἀδικία („Ungerechtigkeit“), nicht auf πνεῦμα („Geist“). Außerdem entspricht „sättigt“ ἐμπλήσει weniger genau als „erfüllt“. Der griechische Wortlaut im Zweck-/Folgesatz ist syntaktisch beschädigt; eine knappe, nicht weiter spezifizierende deutsche Glättung ist daher angemessen.
  naturalness: '„Siebtens: ein Geist der Ungerechtigkeit“ ist als Katalogeintrag natürlich und würdig. Die explizite Wiederaufnahme „mit ihr“ macht den im Griechischen gegebenen Bezug klar. „Geben und Nehmen“ ist idiomatisch, während die Fußnote die naheliegende wirtschaftliche Nuance knapp dokumentiert.'
  terminology: „Ungerechtigkeit“, „Diebstähle“, „Habgier“ und „die übrigen Geister“ sind angemessen. „Lust des Herzens“ bildet φιληδονίαν καρδίας näher ab als „Genusssucht des Herzens“, ohne den beschädigten Satz übermäßig auszudeuten. Für δοσοληψία bewahrt die Hauptfassung die Breite des Begriffs; „Kaufen und Verkaufen“ bleibt als mögliche kontextuelle Konkretisierung vermerkt.
