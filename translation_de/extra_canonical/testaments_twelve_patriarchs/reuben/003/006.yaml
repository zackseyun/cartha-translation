base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/006.yaml
  text: Seventh, a spirit of injustice, with thefts and acts of greed, so that it may fill the pleasures of the heart. For injustice works together with the other spirits through buying and selling.
translation:
  language: de
  text: 'Siebtens: ein Geist der Ungerechtigkeit; mit ihr gehen Diebstähle und Habgier einher, damit sie die Lust des Herzens erfüllt. Denn die Ungerechtigkeit wirkt durch Geben und Nehmen mit den übrigen Geistern zusammen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch Kaufen und Verkaufen“. Der griechische Ausdruck kann wechselseitigen Geschäftsverkehr bezeichnen.'
    reason: δοσοληψία kann allgemein Geben und Nehmen, im Kontext aber auch wirtschaftlichen Verkehr meinen.
lexical_decisions:
- source_word: ἀδικίας
  choice: Ungerechtigkeit
  rationale: Gibt den moralisch-rechtlichen Sinn des griechischen Begriffs unmittelbar und traditionsnah wieder.
- source_word: κλοπαὶ
  choice: Diebstähle
  rationale: Direkte und natürliche Wiedergabe des Plurals.
- source_word: γρηπίσματα
  choice: Habgier
  rationale: Der seltene bzw. textlich schwierige Ausdruck bezeichnet hier am ehesten habgierige Handlungen oder gewinnsüchtiges Verhalten; die kollektive Wiedergabe ist im Deutschen verständlich.
- source_word: φιληδονίαν καρδίας
  choice: Genusssucht des Herzens
  rationale: Bewahrt die negative Bedeutung von φιληδονία als Liebe zur Lust beziehungsweise Genusssucht und den ausdrücklichen Bezug auf das Herz.
- source_word: δοσοληψίας
  choice: Geben und Nehmen
  rationale: Gibt die Grundbestandteile des Ausdrucks wieder und wahrt seine mögliche Breite; im Kontext kann damit geschäftlicher Verkehr gemeint sein.
- source_word: τοῖς λοιποῖς πνεύμασιν
  choice: mit den übrigen Geistern
  rationale: Entspricht der inhaltlich plausiblen Lesart und bewahrt den Bezug zur Reihe der Geister.
theological_decisions:
- issue: Subjekt von ἐμπλήσει/ποιήσῃ und Bezug des Herzens
  choice: „damit er die Genusssucht des Herzens sättigt“
  alternative: „damit sie das Herz mit Genusssucht erfüllt“
  rationale: Der überlieferte Text ist an dieser Stelle syntaktisch gestört und weist Varianten auf. Die gewählte Fassung folgt dem erkennbaren Gedanken, ohne eine zusätzliche Person durch „sein Herz“ festzulegen.
- issue: Bedeutung von δοσοληψία
  choice: „durch Geben und Nehmen“
  alternative: „durch Kaufen und Verkaufen“
  rationale: „Geben und Nehmen“ ist die formal nähere und semantisch breitere Wiedergabe; die wirtschaftliche Bedeutung bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählungsform „Das siebte ist …“ knüpft natürlich an den vorausgehenden Katalog an. Wegen des gestörten griechischen Satzbaus wurde die Zielsyntax geglättet, ohne die moralische und anthropologische Spannung aufzulösen.
