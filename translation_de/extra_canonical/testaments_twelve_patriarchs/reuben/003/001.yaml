base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/001.yaml
  text: And besides all these, there is an eighth spirit, the spirit of sleep, with which trance and the image of death were created.
translation:
  language: de
  text: 'Zu all diesen kommt ein achter Geist hinzu: der Geist des Schlafes. Mit ihm wurden die Ekstase der Natur[a] und das Bild des Todes geschaffen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch ἔκστασις φύσεως; auch möglich: „Außer-sich-Sein der Natur“. Der Ausdruck kann einen Zustand des Heraustretens aus dem gewöhnlichen natürlichen Zustand bezeichnen, ohne dessen genaue Art näher festzulegen.'
    reason: Die Fußnote erläutert den ungewohnten und semantisch offenen Genitiv-Ausdruck, ohne „Ekstase“ als religiöse Entrückung oder als eine bestimmte Art von Trance festzulegen.
lexical_decisions:
- source_word: Ἐπὶ πᾶσιν δὲ τούτοις
  choice: Über all diese hinaus
  rationale: 'Gibt den ergänzenden Sinn wieder: Zu den zuvor genannten Geistern kommt ein weiterer hinzu.'
- source_word: ὄγδοον πνεῦμα τοῦ ὕπνου
  choice: einen achten Geist, den Geist des Schlafes
  rationale: Bewahrt sowohl die Zählung als auch die nähere Bestimmung des achten Geistes.
- source_word: μεθ’ οὗ
  choice: Zusammen mit ihm
  rationale: Bewahrt die primär begleitende Bedeutung von μετά mit Genitiv und legt nicht unnötig eine instrumentale Bedeutung wie „durch ihn“ fest.
- source_word: ἔκστασις φύσεως
  choice: die Entrückung der Natur
  rationale: Gibt die Grundvorstellung des Heraustretens aus dem gewöhnlichen Zustand wieder und erhält die im Griechischen ausdrücklich vorhandene Genitivverbindung mit „Natur“.
- source_word: εἰκὼν τοῦ θανάτου
  choice: das Abbild des Todes
  rationale: „Abbild“ entspricht εἰκών natürlich und würdevoll, ohne eine bloße Ähnlichkeit oder Metapher stärker auszudeuten.
theological_decisions:
- issue: Verhältnis des Geistes des Schlafes zu Entrückung und Todesbild
  choice: „Zusammen mit ihm wurden … geschaffen“
  alternative: „durch ihn wurden … geschaffen“
  rationale: Der griechische Ausdruck μεθ’ οὗ bezeichnet zunächst Begleitung oder Zusammengehörigkeit. Die Übersetzung vermeidet daher die nicht zwingende Aussage, der Geist des Schlafes sei das schöpferische Mittel.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Satzteilung verbessert die Lesbarkeit, ohne die gedankliche Verbindung zu lösen. Der im griechischen Text vorhandene Ausdruck „der Natur“ bleibt gegen die gekürzte englische Konsultationsfassung erhalten.
