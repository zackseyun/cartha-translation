source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 4. Τρίτον πνεῦμα²¹ μάχης ἐν τῷ ἥπατι καὶ ἐν²² τῇ χόλῃ. Τέταρτον²³ πνεῦμα ἀρεσκείας²⁴ καὶ μαγ- γανείας²⁵, ἵνα διὰ²⁶ περιεργείας²⁷ ὡραῖος²⁸ ὀφθῇ²⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003/004.yaml
  text: Third, a spirit of fighting in the liver and in the gall. Fourth, a spirit of self-display and sorcery, so that through excessive meddling one may appear attractive.
translation:
  language: de
  text: 'Drittens: ein Geist des Streites in der Leber und in der Galle. Viertens: ein Geist der Gefallsucht und der Zauberei, damit man durch übermäßige Einmischung schön erscheint.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάχης
  choice: des Streites
  rationale: Gibt den Sinn von Kampf, Streit und Konflikt natürlich wieder, ohne ihn auf körperliche Gewalt zu verengen.
- source_word: ἥπατι ... χόλῃ
  choice: in der Leber und in der Galle
  rationale: Bewahrt die konkrete antike Körpervorstellung des griechischen Textes.
- source_word: ἀρεσκείας
  choice: der Gefallsucht
  rationale: Bezeichnet das Bestreben, anderen zu gefallen oder sich wirkungsvoll darzustellen; »Gefallsucht« ist prägnant und im Deutschen verständlich.
- source_word: μαγγανείας
  choice: der Zauberei
  rationale: Der Ausdruck bezeichnet magische Praktiken oder Gaukelei; »Zauberei« erhält die negative und übernatürliche Konnotation.
- source_word: περιεργείας
  choice: durch aufdringliche Geschäftigkeit
  rationale: Das Wort kann neugierige Einmischung, übertriebene Geschäftigkeit oder magische Betätigung meinen. Die Formulierung bewahrt hier den Gedanken eines übermäßigen, auf Wirkung bedachten Tuns.
- source_word: ὡραῖος ὀφθῇ
  choice: anziehend erscheint
  rationale: Gibt den resultativen Sinn »als schön/attraktiv wahrgenommen werden« idiomatisch wieder.
theological_decisions:
- issue: Bedeutung von »Geist«
  choice: Geist
  alternative: Trieb / Haltung
  rationale: Der Text spricht ausdrücklich von πνεῦμα. Die Übersetzung lässt offen, ob ein personaler Geist, eine innere Kraft oder eine Disposition gemeint ist.
- issue: Zusammenhang von Gefallsucht und Zauberei
  choice: beide Begriffe gleichgeordnet wiedergeben
  alternative: Zauberei als Mittel der Gefallsucht deuten
  rationale: Das griechische καί verbindet beide Ausdrücke, ohne ihr genaues Verhältnis abschließend festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die aufzählende Satzstruktur und die antike physiologische Bildwelt bleiben erhalten; schwer verständliche Wörtlichkeit wird durch idiomatische, aber semantisch offene Formulierungen vermieden.
