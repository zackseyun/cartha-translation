  terminology: „Geist“, „Streit“, „Leber“, „Galle“, „Gefallsucht“ und „Zauberei“ sind registergerecht und terminologisch vertretbar. „Übermäßige Einmischung“ ist für περιεργεία semantisch offener und idiomatischer.
