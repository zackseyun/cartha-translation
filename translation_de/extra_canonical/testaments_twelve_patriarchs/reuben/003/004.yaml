  source_fidelity: Die Gliederung mit „Drittens/Viertens“, πνεῦμα als „Geist“ sowie die konkreten Körperbegriffe „Leber“ und „Galle“ sind zutreffend. „Gefallsucht“ und „Zauberei“ geben ἀρεσκείας und μαγγανείας angemessen und ohne dogmatische Festlegung wieder. Die Wiedergabe von περιεργείας als „aufdringliche Geschäftigkeit“ ist jedoch stärker ausdeutend und im Deutschen unnatürlich; der Begriff bezeichnet hier eher übermäßiges bzw. ungehöriges Sich-Einmischen. ὡραῖος meint primär „schön/attraktiv“; „schön“ hält den Wortlaut genauer fest.
