    rationale: Das deutsche Possessivpronomen bezieht sich primär auf das Subjekt „jene Frauen“ und kann daher ihre eigene Erscheinung meinen. Nach Kontext und anschließender Nennung der Ἐγρήγοροι ist die Erscheinung der Wächter gemeint; diese Referenz wird im Text klargestellt. Eine Fußnote weist darauf hin, dass das griechische αὐτῶν für sich genommen nicht den ausdrücklichen Nominalbezug enthält.
  - severity: low
