source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '* Κἀκεῖναι γὰρ⁷⁰ ἐπιθυμοῦσαι * τῇ διανοίᾳ τῆς φαντασίας⁷¹ αὐτῶν ἔτεκον⁷² γίγαντας. Ἐφαίνοντο γὰρ αὐταῖς⁷³ * οἱ Ἐγρήγοροι⁷⁴ * ἕως εἰ θέλετε τοῦ οὐρανοῦ φθάνοντες⁷⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/007.yaml
  text: And those women also, desiring in their minds their appearance, gave birth to giants. For the Watchers appeared to them as reaching to heaven.
translation:
  language: de
  text: Denn auch jene Frauen begehrten in ihrem Denken die Erscheinung der Wächter¹ und gebaren Riesen. Denn die Wächter erschienen ihnen, als reichten sie bis zum Himmel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κἀκεῖναι γὰρ
  choice: Auch jene Frauen
  rationale: Κἀκεῖναι bezeichnet rückverweisend „auch jene“; das im Kontext vorausgesetzte Femininum wird zur Verständlichkeit als „Frauen“ ausgedrückt. Das begründende γάρ wird im Deutschen nicht eigens wiedergegeben, da die Satzfolge den Zusammenhang natürlich vermittelt.
- source_word: ἐπιθυμοῦσαι
  choice: begehrten
  rationale: Das Partizip bezeichnet starkes Verlangen oder Begehren und wird als finites Verb natürlich wiedergegeben.
- source_word: τῇ διανοίᾳ
  choice: in ihren Gedanken
  rationale: Bezeichnet den inneren Sinn beziehungsweise das Denken; die Formulierung wahrt den geistigen, nicht körperlichen Vorgang.
- source_word: τῆς φαντασίας αὐτῶν
  choice: ihre Erscheinung
  rationale: φαντασία kann Erscheinung, Vorstellung oder sichtbares Bild bedeuten. „Ihre Erscheinung“ bewahrt den Bezug auf die Wächter und lässt offen, ob eine mentale Vorstellung oder visionäre Erscheinung gemeint ist.
- source_word: ἔτεκον γίγαντας
  choice: gebaren Riesen
  rationale: Direkte und idiomatische Wiedergabe von Geburt und Ergebnis.
- source_word: οἱ Ἐγρήγοροι
  choice: die Wächter
  rationale: Traditionelle und semantisch passende Bezeichnung für die übernatürlichen „Wachenden“.
- source_word: ἕως ... τοῦ οὐρανοῦ φθάνοντες
  choice: als reichten sie bis zum Himmel
  rationale: Gibt das scheinbare Hinaufreichen natürlich wieder und erhält durch den Konjunktiv den Eindruck einer Erscheinung.
theological_decisions:
- issue: Art der Wahrnehmung der Wächter
  choice: „erschienen ihnen, als reichten sie bis zum Himmel“
  alternative: „zeigten sich ihnen und reichten bis zum Himmel“
  rationale: Das Medium Ἐφαίνοντο und die Konstruktion lassen eine wahrgenommene Erscheinung erkennen; die Übersetzung behauptet daher nicht unnötig eine objektive Körpergröße.
- issue: Bedeutung von φαντασία
  choice: „Erscheinung“
  alternative: „Vorstellung“ oder „Gestalt“
  rationale: „Erscheinung“ erhält die Spannung zwischen innerem Bild und wahrgenommener Gestalt, ohne den Vorgang psychologisch oder ontologisch festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den griechischen Satzbau, soweit dies natürlich bleibt. Die ungewöhnliche Verbindung von innerem Begehren, Erscheinung und Geburt wird nicht harmonisiert oder erklärt.
