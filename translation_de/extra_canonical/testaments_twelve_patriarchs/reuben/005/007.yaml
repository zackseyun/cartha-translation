  source_fidelity: Die Wiedergabe von ἐπιθυμοῦσαι, ἔτεκον γίγαντας, οἱ Ἐγρήγοροι und der abschließenden Erscheinungsformel ist im Wesentlichen quellentreu. Allerdings kann „ihre Erscheinung“ im Deutschen ohne Weiteres als Erscheinung der Frauen verstanden werden. Im griechischen Kontext bezieht sich αὐτῶν auf die Wächter; diese Referenz sollte im deutschen Text verdeutlicht werden. Das ausgelassene γάρ am Satzanfang ist als „Denn“ sinnvoll wiederzugeben.
  naturalness: Der Entwurf ist insgesamt verständlich und im angemessen würdigen Register gehalten. „in ihren Gedanken ihre Erscheinung begehren“ ist jedoch wegen der unklaren Possessivreferenz und der Häufung von „ihren/ihre“ stilistisch und semantisch schwer zugänglich. Die Revision bleibt nah am griechischen Ausdruck, ist aber klarer.
  terminology: „Wächter“ ist für Ἐγρήγοροι passend und traditionsübergreifend. „Riesen“ gibt γίγαντας angemessen wieder. „bis zum Himmel“ ist eine natürliche Wiedergabe von τοῦ οὐρανοῦ φθάνοντες, ohne eine zusätzliche ontologische Aussage über die Gestalt der Wächter zu treffen.
  issues:
