revisions:
- from: Denn die Frauen sind böse, meine Kinder; und weil sie keine Vollmacht oder Macht über den Mann haben, versuchen sie listig, ihn durch ihre äußere Erscheinung an sich zu ziehen.
  to: Denn die Frauen sind böse, meine Kinder; und weil sie keine Vollmacht oder Macht über den Mann haben, gehen sie mit allerlei Aufmachungen listig vor, um ihn an sich zu ziehen.
  rationale: Die Revision korrigiert ausschließlich die zu enge Wiedergabe von ἐν σχήμασιν und macht die durch ὅπως markierte Zielrichtung klarer. Die harte antike Verallgemeinerung, der bestimmte Artikel bei „dem Mann“ und die doppelte Benennung von Autorität und Macht bleiben erhalten.
