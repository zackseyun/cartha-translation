review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die wesentlichen Begriffe zutreffend wieder: Πονηραί („böse“), ἐξουσίαν ἢ δύναμιν („Vollmacht oder Macht“), ἐπὶ τὸν ἄνδρα („über den Mann“) und die Bewegung πρὸς ἑαυτάς („zu sich/an sich“). Bei ἐν σχήμασιν ist jedoch „durch ihre äußere Erscheinung“ zu eng und verschiebt das Mittel von „in/mit ihren Erscheinungsformen, Aufmachungen oder Verhaltensweisen“ auf bloßes Aussehen. Außerdem bedeutet δολιεύονται selbst bereits „listig/ränkevoll vorgehen“; „versuchen sie listig, ... zu ziehen“ lässt das finale ὅπως mit Konjunktiv weniger unmittelbar hervortreten.'
  naturalness: Der deutsche Satz ist grundsätzlich verständlich und im angemessen nüchternen Register gehalten. „Vollmacht oder Macht“ ist als bewusste Begriffsunterscheidung möglich, klingt in dieser pauschalen Aussage aber leicht juristisch. Die Revision bewahrt sie wegen der griechischen Doppelung. „Mit allerlei Aufmachungen“ ist natürlich, ohne σχήμασιν auf körperliches Aussehen oder Kleidung festzulegen.
  terminology: „Böse“ bewahrt die schroffe moralische Aussage des Textes. „Vollmacht oder Macht“ erhält die Zweigliedrigkeit von ἐξουσία und δύναμις. „Aufmachungen“ ist hier ein weiter deutscher Ausdruck für σχήματα und kann äußere Gestalt, Inszenierung und Auftreten umfassen, ohne eine nicht im Text festgelegte Einzeldeutung zu wählen.
  issues:
  - severity: medium
    issue: ἐν σχήμασιν wird zu stark auf äußeres Aussehen eingeengt.
    rationale: σχήμασιν ist pluralisch und kann über bloße Erscheinung hinaus Gestaltungen, Aufmachungen bzw. Verhaltensformen meinen. Die Formulierung „durch ihre äußere Erscheinung“ legt eine spezifisch körperlich-visuelle Deutung nahe, die der griechische Ausdruck nicht zwingend verlangt.
  - severity: low
    issue: Die final ausgedrückte Absicht wird in der deutschen Satzfügung abgeschwächt.
    rationale: ὅπως ... ἐπισπάσωνται bezeichnet den Zweck des listigen Vorgehens. „gehen ... vor, um ihn an sich zu ziehen“ bildet diese Beziehung expliziter und idiomatisch ab.
  revised_text: Denn die Frauen sind böse, meine Kinder; und weil sie keine Vollmacht oder Macht über den Mann haben, gehen sie mit allerlei Aufmachungen listig vor, um ihn an sich zu ziehen.
  revised_footnotes: []
  revision_rationale: Die Revision korrigiert ausschließlich die zu enge Wiedergabe von ἐν σχήμασιν und macht die durch ὅπως markierte Zielrichtung klarer. Die harte antike Verallgemeinerung, der bestimmte Artikel bei „dem Mann“ und die doppelte Benennung von Autorität und Macht bleiben erhalten.
