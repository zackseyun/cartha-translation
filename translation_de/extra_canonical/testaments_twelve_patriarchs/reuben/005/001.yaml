base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/001.yaml
  text: For women are evil, my children; and because they have no authority or power over the man, they scheme by their appearance how they may draw him to themselves.
translation:
  language: de
  text: Denn die Frauen sind böse, meine Kinder; und weil sie keine Vollmacht oder Macht über den Mann haben, gehen sie mit allerlei Aufmachungen listig vor, um ihn an sich zu ziehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πονηραί
  choice: böse
  rationale: Gibt die moralische Wertung des griechischen Adjektivs unmittelbar wieder, ohne sie abzuschwächen.
- source_word: ἐξουσίαν ἢ δύναμιν
  choice: Vollmacht oder Macht
  rationale: Bewahrt die zwei griechischen Begriffe und unterscheidet rechtliche bzw. verfügende Autorität von tatsächlicher Kraft oder Macht.
- source_word: ἐπὶ τὸν ἄνδρα
  choice: über den Mann
  rationale: Entspricht der Präposition und bewahrt den bestimmten Artikel des griechischen Textes.
- source_word: δολιεύονται
  choice: versuchen sie listig
  rationale: Bringt den Gedanken arglistigen bzw. täuschenden Vorgehens natürlich ins Deutsche.
- source_word: ἐν σχήμασιν
  choice: durch ihre äußere Erscheinung
  rationale: σχήματα bezeichnet hier die sichtbare Gestalt bzw. Aufmachung; die Formulierung hält offen, ob Aussehen, Kleidung oder Auftreten gemeint ist.
- source_word: πρὸς ἑαυτὰς ἐπισπάσωνται
  choice: ihn … an sich zu ziehen
  rationale: Gibt sowohl die Richtung auf sie selbst als auch das kräftige Heranziehen idiomatisch wieder.
theological_decisions:
- issue: Pauschale negative Aussage über Frauen
  choice: Die schroffe Verallgemeinerung wird als Aussage des Quellentextes unverändert wiedergegeben.
  alternative: Die Aussage durch Zusätze wie „manche Frauen“ oder „solche Frauen“ einschränken.
  rationale: Eine Einschränkung wäre im griechischen Text nicht vorhanden und würde dessen ethische und theologische Spannung stillschweigend auflösen.
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Die harte, pauschale Aussage des antiken Textes wird weder geglättet noch kommentierend entschärft; die Syntax bleibt dennoch natürlich.
