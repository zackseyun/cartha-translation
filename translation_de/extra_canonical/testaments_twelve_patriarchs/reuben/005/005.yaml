  to: Darum flieht die Unzucht, meine Kinder, und gebietet euren Frauen und euren Töchtern, ihre Köpfe und Gesichter nicht zur Täuschung des Verstandes zu schmücken; denn jede Frau, die sich in diesen Dingen betrügerisch verhält, ist für die ewige Strafe aufbewahrt.
  rationale: Die Revision wahrt die scharfe Mahnrede und die syntaktischen Bezüge des griechischen Textes. Sie vermeidet bei δολιευομένη eine nicht erforderliche Festlegung auf ein aktiv getäuschtes Gegenüber und gibt die knappe, semantisch schwierige Fügung πρὸς ἀπάτην διανοίας in einer im Deutschen verständlichen, zurückhaltenden Form wieder.
