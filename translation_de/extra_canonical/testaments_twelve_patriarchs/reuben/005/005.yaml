    rationale: Die Formulierung macht die Schmuckmittel ausdrücklich zu Instrumenten einer aktiven Täuschung. Das griechische Partizip kann allgemeiner betrügerisches Verhalten in Bezug auf die genannten Dinge bezeichnen und benennt kein Objekt der Täuschung.
  - severity: low
    issue: „um den Sinn zu täuschen“ ist idiomatisch und referenziell unklar.
    rationale: Die Formulierung klingt im Deutschen ungewohnt und kann den Sinn der handelnden Frau als getäuscht erscheinen lassen. Eine nominale Zweckfügung bildet πρὸς ἀπάτην διανοίας klarer ab.
  revised_text: Darum flieht die Unzucht, meine Kinder, und gebietet euren Frauen und euren Töchtern, ihre Köpfe und Gesichter nicht zur Täuschung des Verstandes zu schmücken; denn jede Frau, die sich in diesen Dingen betrügerisch verhält, ist für die ewige Strafe aufbewahrt.
