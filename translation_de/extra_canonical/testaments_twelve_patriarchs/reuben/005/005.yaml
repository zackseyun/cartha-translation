  source_fidelity: 'Die Grundstruktur wird zutreffend wiedergegeben: Flucht vor πορνεία, die Aufforderung an Frauen und Töchter, Kopf und Gesicht nicht zu schmücken, sowie die eschatologische Strafandrohung. Bei δολιευομένη ἐν τούτοις legt „die durch solche Dinge täuscht“ jedoch eine aktive Täuschung durch die Schmuckmittel fest. Das griechische deponentische Partizip bezeichnet allgemeiner ein betrügerisches Verhalten „in/durch diesen Dingen“ und lässt das Ziel der Täuschung offen.'
  naturalness: „Um den Sinn zu täuschen“ ist im Deutschen weniger idiomatisch und kann zudem den Eindruck erwecken, der eigene Sinn der Frauen werde getäuscht. „Zur Täuschung des Verstandes“ gibt die knappe griechische Genitivfügung sachlicher wieder, ohne ein bestimmtes Objekt der Täuschung einzutragen. „Sich in diesen Dingen betrügerisch verhält“ ist natürlich und wahrt die Unbestimmtheit.
  terminology: „Unzucht“, „gebietet“, „schmücken“ und „ewige Strafe“ sind im würdigen Mahnregister angemessen. „Unzucht“ bleibt als traditionelle, weite Wiedergabe von πορνεία vertretbar. „Ewige Strafe“ gibt κόλασις αἰώνιος ohne zusätzliche dogmatische Präzisierung wieder.
