source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Λοιπὸν φεύγετε ἄνθρω- τέκνα μου τὴν πορνείαν⁴², *καὶ προστάσσετε⁴³ ταῖς γυναιξὶν που βιά- ὑμῶν⁴⁴ καὶ ταῖς θυγατράσιν Γὑμῶν˥⁴⁵, ἵνα μὴ κοσμῶσι⁴⁶ σασθαι. τὰς⁴⁷ κεφαλὰς αὐτῶν⁴⁸ καὶ τὰς ὄψεις⁴⁹ *πρὸς ἀπάτην διανοίας⁵⁰, ὅτι πᾶσα γυνὴ⁵¹ δολιευομένη ἐν τούτοις εἰς κόλασιν⁵² αἰώνιον⁵³ τετήρηται⁵⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/005.yaml
  text: Therefore flee sexual immorality, my children, and command your wives and your daughters not to adorn their heads and faces for the deception of the mind; for every woman who deceives by these things is reserved for eternal punishment.
translation:
  language: de
  text: Darum flieht die Unzucht, meine Kinder, und gebietet euren Frauen und euren Töchtern, ihre Köpfe und Gesichter nicht zur Täuschung des Verstandes zu schmücken; denn jede Frau, die sich in diesen Dingen betrügerisch verhält, ist für die ewige Strafe aufbewahrt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνείαν
  choice: Unzucht
  rationale: Der Ausdruck bezeichnet sexuelle Unmoral bzw. unerlaubtes sexuelles Verhalten. „Unzucht“ wahrt hier den würdevollen, mahnenden Registerton und bleibt relativ weit gefasst.
- source_word: προστάσσετε
  choice: gebietet
  rationale: Der Imperativ bedeutet, etwas anzuordnen oder zu befehlen. „Gebietet“ gibt die Stärke des griechischen Ausdrucks wieder, ohne sie abzuschwächen.
- source_word: κοσμῶσι
  choice: schmücken
  rationale: Das Verb bezeichnet das Schmücken oder Zurechtmachen; im Kontext sind ausdrücklich Kopf und Gesicht genannt.
- source_word: πρὸς ἀπάτην διανοίας
  choice: um den Sinn zu täuschen
  rationale: Die Zweckangabe wird formal bewahrt. διάνοια kann Denken, Sinn oder innere Gesinnung bezeichnen; „Sinn“ erhält diese gewisse Offenheit.
- source_word: δολιευομένη ἐν τούτοις
  choice: die durch solche Dinge täuscht
  rationale: Das Partizip beschreibt betrügerisches bzw. täuschendes Handeln; ἐν τούτοις verweist auf die genannten Formen des Schmückens. „Durch solche Dinge“ gibt diesen instrumentalen Zusammenhang natürlich wieder.
- source_word: εἰς κόλασιν αἰώνιον τετήρηται
  choice: ist für die ewige Strafe aufbewahrt
  rationale: Das Perfekt Passiv drückt einen bestehenden Zustand des Aufbewahrtseins bzw. Vorbehaltenseins aus. Die Zielangabe mit εἰς wird durch „für“ idiomatisch wiedergegeben.
theological_decisions:
- issue: Reichweite von πορνεία
  choice: Unzucht
  alternative: sexuelle Unmoral
  rationale: Die Übersetzung legt keine engere Definition bestimmter sexueller Vergehen fest, sondern bewahrt den umfassenden ethischen Begriff des Ausgangstextes.
- issue: Bedeutung von αἰώνιον
  choice: ewig
  alternative: äonisch / zum kommenden Zeitalter gehörend
  rationale: „Ewig“ ist die natürliche deutsche Wiedergabe im Strafkontext und entspricht der üblichen Bedeutung, ohne die im Text nicht erläuterte genaue Beschaffenheit der Strafe weiter auszudeuten.
- issue: Subjekt der Täuschung
  choice: jede Frau, die durch solche Dinge täuscht
  alternative: jede Frau, die sich in solchen Dingen betrügerisch verhält
  rationale: Die aktive Wirkung des medialen Partizips wird beibehalten, ohne ausdrücklich festzulegen, wer getäuscht wird; damit bleibt die Unbestimmtheit des griechischen Textes erhalten.
translation_notes:
  register: Moderne, würdige Mahnrede mit direkter Anrede. Die patriarchale Befehlsstruktur und die scharfe Strafandrohung werden als Merkmale des Quellentextes nicht geglättet. Keine Fußnoten erforderlich.
