source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Καὶ¹² ὃν¹³ διὰ *τοῦ σχήματος¹⁴ οὐκ ἰσχύουσιν¹⁵ καταγοητεῦσασθαι¹⁶, τοῦτον¹⁷ δι᾿¹⁸ ἀπάτης κατα- γωνίζονται¹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/002.yaml
  text: And the one whom they are not able to enchant by appearance, him they overcome through deceit.
translation:
  language: de
  text: Und wen sie nicht durch die äußere Erscheinung bezaubern können, den überwältigen sie durch Täuschung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τοῦ σχήματος
  choice: durch die äußere Erscheinung
  rationale: σχῆμα bezeichnet hier die sichtbare Gestalt bzw. das äußere Erscheinungsbild; „äußere Erscheinung“ gibt den gemeinten Gegensatz zur Täuschung natürlich und präzise wieder.
- source_word: οὐκ ἰσχύουσιν
  choice: nicht … können
  rationale: Die Wendung bezeichnet fehlendes Vermögen; im Deutschen ist die modale Wiedergabe mit „können“ natürlicher als eine wörtliche Formulierung mit „stark sein“.
- source_word: καταγοητεῦσασθαι
  choice: bezaubern
  rationale: Das Verb kann ein Behexen oder betörendes Verführen bezeichnen. „Bezaubern“ bewahrt diese Bildlichkeit, ohne eine ausschließlich magische Bedeutung festzulegen.
- source_word: δι᾿ ἀπάτης καταγωνίζονται
  choice: überwältigen sie durch Täuschung
  rationale: καταγωνίζομαι bezeichnet ein Niederkämpfen oder Überwinden; „überwältigen“ ist im Kontext idiomatisch. ἀπάτη wird sachgerecht mit „Täuschung“ wiedergegeben.
theological_decisions:
- issue: Mögliche magische oder metaphorische Bedeutung von καταγοητεύομαι
  choice: bezaubern
  alternative: betören / verhexen
  rationale: „Bezaubern“ lässt offen, ob konkrete magische Einwirkung oder bildhaft verführerische Wirkung gemeint ist, und bewahrt damit die Mehrdeutigkeit des griechischen Ausdrucks.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die vorangestellte Objektkonstruktion „wen …, den …“ erhält die rhetorische Hervorhebung des griechischen Satzes.
