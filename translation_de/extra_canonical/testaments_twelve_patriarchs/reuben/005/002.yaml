  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Kontrast des Griechischen treffend wieder: Das vorangestellte Objekt („wen …, den …“) entspricht ὃν … τοῦτον, οὐκ ἰσχύουσιν ist idiomatisch mit „nicht … können“ wiedergegeben, und διὰ τοῦ σχήματος bzw. δι’ ἀπάτης sind angemessen durch „durch die äußere Erscheinung“ bzw. „durch Täuschung“ abgebildet. „Bezaubern“ bewahrt die zwischen betörender und gegebenenfalls magischer Wirkung offene Bedeutung von καταγοητεῦσασθαι. „Überwältigen“ trifft καταγωνίζονται im Kontext als besiegen/überwinden gut.'
