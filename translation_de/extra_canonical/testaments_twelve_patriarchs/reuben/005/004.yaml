  text: For a woman is not able to force a man openly, but by a harlot's manner she acts craftily against him.
translation:
  language: de
  text: Denn eine Frau kann einen Mann nicht offen mit Gewalt zwingen, sondern geht mit dem Auftreten einer Prostituierten listig gegen ihn vor.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „in einer prostituiertenhaften Art/Gestalt“. Der griechische Wortlaut (ἐν σχήματι πορνικοῖς) ist grammatisch auffällig; die genaue Formulierung ist daher unsicher.'
    reason: Die Anmerkung dokumentiert sowohl die sexuelle Konnotation von πορνικοῖς als auch die grammatische Auffälligkeit der überlieferten Form, ohne eine strittige Rekonstruktion als sicher auszugeben.
lexical_decisions:
- source_word: εἰς πρόσωπον
  choice: offen
  rationale: Die Wendung bedeutet hier sinngemäß „ins Angesicht“ beziehungsweise „unmittelbar“ und bezeichnet ein offenes, direktes Vorgehen.
- source_word: ἐν σχήματι πορνικοῖς
  choice: durch verführerisches Auftreten
  rationale: Der überlieferte griechische Wortlaut ist grammatisch auffällig, bezeichnet aber offenbar eine sexuell verführerische Art oder äußere Haltung. Die Wiedergabe vermeidet die im heutigen Deutsch missverständliche Formulierung „nach Art einer Hure“.
- source_word: πανουργεύεται
  choice: überlistet sie ihn
  rationale: Das Verb bezeichnet ein listiges, verschlagenes Vorgehen; „überlisten“ gibt Handlung und Zielrichtung natürlich wieder.
theological_decisions:
- issue: Allgemeine Aussage über Frauen
  choice: Die pauschale Form des Ausgangstextes bleibt erhalten.
  alternative: Die Aussage durch Zusätze wie „eine solche Frau“ oder „manche Frauen“ einschränken.
  rationale: Eine Einschränkung wäre interpretierend und im vorliegenden griechischen Wortlaut nicht ausdrücklich markiert. Die problematische Spannung des Textes darf nicht stillschweigend beseitigt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satz bleibt knapp und sentenzartig; „verführerisches Auftreten“ ist verständlich, ohne unnötig derbe oder konfessionell geprägte Sprache.
