  terminology: „Wächter“, „Begierde“ und „Männergestalt“ sind treffend. Die explizite Wiederaufnahme „die Wächter“ im letzten Satz verhindert, dass das deutsche Pronomen den semantisch unzutreffenden Bezug auf die Frauen nahelegt. Die Fußnote soll die mögliche sexuelle Nuance von συνουσία benennen, ohne sie im Haupttext festzulegen.
