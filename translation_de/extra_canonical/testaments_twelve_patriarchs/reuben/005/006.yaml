  source_fidelity: 'Eine Revision ist nötig. Das implizite Subjekt von μετεσχηματίζοντο und συνεφαίνοντο sind im Satzverlauf die Wächter: Sie sehen die Frauen fortwährend, begehren sie, fassen den Entschluss zur Tat und nehmen Männergestalt an. Die Fassung schreibt die Verwandlung dagegen den Frauen zu. Außerdem hat das Griechische an der ersten Stelle kein ausdrücklich wiedergegebenes „auch“.'
