base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/006.yaml
  text: For in this way they also enticed the Watchers before the flood; for as they kept looking at them continually, they also came to be in desire for them, and they conceived the deed in their mind; for they were transforming themselves into the form of men and appearing to them while their husbands were with them.
translation:
  language: de
  text: Denn auf diese Weise verführten sie die Wächter vor der Sintflut. Denn als diese sie fortwährend ansahen, gerieten auch sie in Begierde nach ihnen und fassten in ihrem Sinn den Entschluss zu dieser Tat. Denn die Wächter verwandelten sich in Männergestalt und erschienen ihnen während des Zusammenseins mit ihren Männern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und erschienen ihnen während des Geschlechtsverkehrs mit ihren Männern“. Das griechische Wort für „Zusammensein“ kann sowohl allgemeines Zusammensein als auch geschlechtlichen Verkehr bezeichnen.'
    reason: συνουσία ist im Kontext möglicherweise, aber nicht eindeutig, sexuell zu verstehen. Die Fußnote erhält diese semantische Offenheit und erklärt die alternative Lesart.
lexical_decisions:
- source_word: ἔθελξαν
  choice: verführten
  rationale: Das Verb bezeichnet hier ein bezauberndes oder verlockendes Hinziehen; „verführten“ gibt im Kontext die sexuelle Anziehung natürlich wieder, ohne Magie ausdrücklich vorauszusetzen.
- source_word: τοὺς Ἐγρηγόρους
  choice: die Wächter
  rationale: Die traditionelle und semantisch direkte Wiedergabe der Bezeichnung für die übernatürlichen „Wachenden“.
- source_word: ἐν ἐπιθυμίᾳ
  choice: in Begierde
  rationale: Bewahrt die starke, kontextuell sexuelle Bedeutung von ἐπιθυμία.
- source_word: συνέλαβον τῇ διανοίᾳ τὴν πρᾶξιν
  choice: fassten die Tat in Gedanken
  rationale: Gibt die gedankliche Konzeption oder Planung der Tat eng am Griechischen und zugleich idiomatisch wieder.
- source_word: μετεσχηματίζοντο ... εἰς ἄνδρα
  choice: sie verwandelten sich in Männergestalt
  rationale: Drückt die angenommene männliche Erscheinungsform aus, ohne mehr über Wesen oder Mechanismus der Verwandlung festzulegen.
- source_word: ἐν τῇ συνουσίᾳ τῶν ἀνδρῶν αὐτῶν
  choice: beim Beisammensein mit ihren Männern
  rationale: συνουσία kann allgemein Zusammensein oder geschlechtlichen Verkehr meinen; die Übersetzung hält diese Mehrdeutigkeit im Haupttext offen.
theological_decisions:
- issue: Wer sich verwandelt und den Frauen erscheint
  choice: Das feminine Subjekt „sie“ wird entsprechend dem griechischen Zusammenhang als die Frauen verstanden.
  alternative: Die Wächter könnten als Subjekt verstanden werden.
  rationale: Die femininen Formen αὐταῖς und das vorausgehende αὐτάς stützen die Frauen als Bezugspunkt; der schwierige überlieferte Satz bleibt jedoch textlich und inhaltlich ungewöhnlich.
- issue: Bedeutung von συνουσία
  choice: „Beisammensein“ bewahrt die lexikalische Offenheit.
  alternative: „Geschlechtsverkehr“ oder „ehelicher Verkehr“.
  rationale: Im Kontext ist eine sexuelle Bedeutung möglich und wohl naheliegend, aber das Wort kann auch schlicht Gemeinschaft oder Zusammensein bezeichnen; die Übersetzung soll diese Spannung nicht stillschweigend auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge folgt dem argumentativen Aufbau des griechischen Textes; altertümliche oder konfessionell geprägte Formulierungen wurden vermieden.
