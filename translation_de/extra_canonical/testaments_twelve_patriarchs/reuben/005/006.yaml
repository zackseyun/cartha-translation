revisions:
- from: Denn auf diese Weise verführten sie auch die Wächter vor der Sintflut. Weil diese sie nämlich ständig ansahen, gerieten auch sie in Begierde nach ihnen und fassten die Tat in Gedanken. Denn sie verwandelten sich in Männergestalt und erschienen ihnen beim Beisammensein mit ihren Männern.[a]
  to: Denn auf diese Weise verführten sie die Wächter vor der Sintflut. Denn als diese sie fortwährend ansahen, gerieten auch sie in Begierde nach ihnen und fassten in ihrem Sinn den Entschluss zu dieser Tat. Denn die Wächter verwandelten sich in Männergestalt und erschienen ihnen während des Zusammenseins mit ihren Männern.[a]
  rationale: Die Revision stellt die im griechischen Satzverlauf naheliegende Handlungsträgerschaft der Wächter klar, ohne Aussagen über die Art der Verwandlung über den Text hinaus auszudeuten. Sie entfernt das nicht ausdrücklich belegte erste „auch“, glättet die deutsche Wiedergabe des gedanklichen Beschlusses und bewahrt die Mehrdeutigkeit von συνουσία im Haupttext samt Fußnote.
