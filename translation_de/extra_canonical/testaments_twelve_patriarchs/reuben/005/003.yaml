base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005/003.yaml
  text: For an angel of God also told me and taught me concerning them that women are overcome by the spirit of sexual immorality more than men, and in their hearts they devise things against men; and by adornment they lead their minds astray, and through a glance they sow the poison, and first in thought and then by the act they take captive.
translation:
  language: de
  text: 'Denn ein Engel Gottes sagte und lehrte mich auch über sie: Frauen erliegen dem Geist der Unzucht[a] stärker als Männer. In ihren Herzen schmieden sie Pläne gegen Männer; mit ihrem Schmuck führen sie deren Gedanken irre, und durch ihren Blick säen sie Gift. Zuerst und dann durch die Tat nehmen sie gefangen.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Geist“ kann hier eine geistige Macht oder eine beherrschende Neigung bezeichnen; der griechische Ausdruck lässt dies offen.
    reason: Bewahrt eine echte semantisch-theologische Mehrdeutigkeit von πνεῦμα.
  - marker: b
    text: 'Der griechische Satz lautet knapp: „zuerst und dann durch die Tat nehmen sie gefangen“. Worauf sich „zuerst“ genau bezieht, wird nicht ausdrücklich gesagt; der vorher genannte Blick kann als der erste Schritt verstanden werden.'
    reason: Kennzeichnet die syntaktische Ellipse, ohne „in Gedanken“ oder eine andere nicht ausdrücklich genannte Ergänzung in den Haupttext einzutragen.
lexical_decisions:
- source_word: ἡττῶνται
  choice: erliegen
  rationale: Das Verb bezeichnet ein Unterliegen oder Überwältigtwerden. „Erliegen“ gibt die passive Anfälligkeit idiomatisch wieder, ohne die Aussage abzuschwächen.
- source_word: τῷ πνεύματι τῆς πορνείας
  choice: dem Geist der Unzucht
  rationale: Die formnahe Wiedergabe bewahrt sowohl den religiös-moralischen Gehalt von πορνεία als auch die Offenheit, ob πνεῦμα persönlich, übernatürlich oder als wirksame Neigung verstanden wird.
- source_word: ὑπὲρ τὸν ἄνδρα
  choice: stärker als Männer
  rationale: Der griechische Singular ist hier generisch und wird im natürlichen modernen Deutsch pluralisch wiedergegeben.
- source_word: μηχανῶνται
  choice: schmieden sie Pläne
  rationale: Das Verb bezeichnet planendes, listiges Ausdenken; die deutsche Wendung ist verständlich und bewahrt den negativen Sinn.
- source_word: διὰ τῆς κοσμήσεως
  choice: mit ihrem Schmuck
  rationale: κόσμησις meint hier Schmuck beziehungsweise äußere Zierde; „mit“ gibt das Mittel im Deutschen natürlich wieder.
- source_word: τὰς διανοίας
  choice: die Gedanken
  rationale: Gemeint sind Denken oder Sinn der zuvor genannten Männer. „Gedanken“ ist im Kontext klar und allgemein verständlich.
- source_word: τὸν ἰὸν
  choice: das Gift
  rationale: ἰός bedeutet hier Gift; die Bildsprache des Aussäens bleibt erhalten.
- source_word: τῷ ἔργῳ
  choice: durch die Tat
  rationale: Die instrumentale Wendung wird direkt wiedergegeben und bildet den Gegensatz zum vorausgehenden Blick beziehungsweise zur vorherigen Einwirkung.
theological_decisions:
- issue: Wesen des „Geistes der Unzucht“
  choice: Die substantivische Formulierung „Geist der Unzucht“ bleibt stehen.
  alternative: Als bloße „Neigung zur Unzucht“ oder ausdrücklich als dämonisches Wesen deuten.
  rationale: Der griechische Text legt nicht eindeutig fest, ob eine Person, eine übernatürliche Macht oder eine beherrschende Haltung gemeint ist. Die Übersetzung bewahrt diese Spannung.
- issue: Pauschale vergleichende Aussage über Frauen und Männer
  choice: Die Aussage wird unverändert als Behauptung des Textes übersetzt.
  alternative: Die Aussage abschwächen, verallgemeinern oder erklärend relativieren.
  rationale: Die problematische Geschlechteraussage gehört zum Inhalt der Quelle und darf in der Übersetzung weder verschärft noch stillschweigend korrigiert werden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die harte und pauschale Aussage der Quelle wird weder euphemisiert noch kommentierend verstärkt. Kurze Hauptsätze entlasten die lange griechische Satzperiode; die Bildsprache von Gift, Aussäen und Gefangennahme bleibt erhalten.
