  verdict: revise
  source_fidelity: Die Übersetzung gibt die zentrale Aussage und die Bildsprache weitgehend zutreffend wieder. Der Schluss ordnet jedoch das griechische πρῶτον („zuerst“) ohne ausreichende Grundlage ausdrücklich dem Säen des Giftes zu („zunächst das Gift“). Die knappe griechische Konstruktion lässt den ersten Schritt elliptisch; die Übersetzung sollte diese Ellipse nicht stärker festlegen als der Text.
  naturalness: Der Entwurf ist überwiegend modernes, verständliches Standarddeutsch. „Auch über sie sprach ein Engel Gottes zu mir“ ist jedoch etwas sperrig; eine Umstellung ist natürlicher. Der Plural „Herzen“ passt besser zur pluralischen Aussage über Frauen.
  terminology: „Geist der Unzucht“, „erligen“, „Schmuck“, „Gift“ und „durch die Tat“ sind angemessene, quellennah verständliche Wiedergaben. Die Fußnote zu „Geist“ bewahrt zu Recht die semantische Offenheit von πνεῦμα.
