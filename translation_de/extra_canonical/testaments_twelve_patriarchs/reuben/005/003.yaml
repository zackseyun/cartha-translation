revisions:
- from: 'Denn auch über sie sprach ein Engel Gottes zu mir und lehrte mich: Frauen erliegen dem Geist der Unzucht[a] stärker als Männer. In ihrem Herzen schmieden sie Pläne gegen Männer; mit ihrem Schmuck führen sie deren Gedanken irre, und mit ihrem Blick säen sie zunächst das Gift aus. Dann nehmen sie sie durch die Tat gefangen.[b]'
  to: 'Denn ein Engel Gottes sagte und lehrte mich auch über sie: Frauen erliegen dem Geist der Unzucht[a] stärker als Männer. In ihren Herzen schmieden sie Pläne gegen Männer; mit ihrem Schmuck führen sie deren Gedanken irre, und durch ihren Blick säen sie Gift. Zuerst und dann durch die Tat nehmen sie gefangen.[b]'
