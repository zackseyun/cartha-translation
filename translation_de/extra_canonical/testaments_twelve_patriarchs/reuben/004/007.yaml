source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Καὶ γὰρ πολλοὺς ἀπώλεσεν ἡ πορνεία· ὅτι κἂν *γέρων ᾖ τις⁵⁸, κἂν⁵⁹ εὐγενής, Γκἂν πλούσιος, κἂν πένης⁶⁰, *ὀνειδισμὸν ἑαυτῷ φέρει παρὰ τοὺς υἱοὺς τῶν ἀνθρώπων καὶ †πρόσκομμα τῷ Βελίαρ⁶¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/007.yaml
  text: For sexual immorality has destroyed many; for whether a man is old, or noble, or rich, or poor, he brings reproach on himself before the sons of men and a stumbling block to Beliar.
translation:
  language: de
  text: 'Denn sexuelle Unmoral hat viele zugrunde gerichtet; denn ob jemand alt, von vornehmer Herkunft, reich oder arm ist: Er bringt Schande über sich vor den Menschen und wird Beliar zum Anstoß.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut am Satzende ist schwierig und textkritisch unsicher; wörtlich etwa: „und ein Anstoß für Beliar“.'
    reason: Die Konstruktion πρόσκομμα τῷ Βελίαρ ist semantisch ungewöhnlich und im Ausgangstext mit einem textkritischen Zeichen versehen.
lexical_decisions:
- source_word: πορνεία
  choice: Unzucht
  rationale: Der Ausdruck bezeichnet sexuelle Unmoral in umfassendem Sinn. „Unzucht“ ist knapp, würdig und lässt den genauen Umfang ebenso offen wie das Griechische.
- source_word: ἀπώλεσεν
  choice: hat … zugrunde gerichtet
  rationale: Gibt die starke Bedeutung von ἀπόλλυμι wieder, ohne zwingend nur körperliche Tötung auszudrücken.
- source_word: εὐγενής
  choice: von vornehmer Herkunft
  rationale: Bezeichnet hier am natürlichsten hohe oder angesehene Abstammung; die Formulierung ist im modernen Deutschen klarer als das mehrdeutige „edel“.
- source_word: ὀνειδισμὸν ἑαυτῷ φέρει
  choice: bringt Schande über sich
  rationale: Eine natürliche deutsche Wiedergabe der Wendung; „Schande“ erfasst den öffentlichen Vorwurf bzw. die Beschämung.
- source_word: παρὰ τοὺς υἱοὺς τῶν ἀνθρώπων
  choice: bei den Menschen
  rationale: „Söhne der Menschen“ ist eine semitisch geprägte Bezeichnung für Menschen allgemein. Die idiomatische Wiedergabe vermeidet im Deutschen eine unbeabsichtigte Einschränkung auf männliche Nachkommen.
- source_word: πρόσκομμα τῷ Βελίαρ
  choice: wird dem Beliar zum Anstoß
  rationale: Bewahrt die schwierige und möglicherweise textlich unsichere Relation des griechischen Dativs, statt sie durch eine eindeutige Deutung zu glätten.
theological_decisions:
- issue: Bedeutung der Wendung πρόσκομμα τῷ Βελίαρ
  choice: „wird dem Beliar zum Anstoß“ mit Fußnote zur Mehrdeutigkeit
  alternative: „gibt Beliar Anlass zum Fall“ / „wird durch Beliar zu Fall gebracht“
  rationale: Der überlieferte griechische Wortlaut ist schwierig und textkritisch markiert. Eine knappe formnahe Übersetzung bewahrt die Spannung; die Fußnote nennt die Unsicherheit, ohne eine bestimmte Dämonologie einzutragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem paränetischem Ton. Der doppelte Begründungsanschluss mit γάρ wird durch zweimaliges „denn“ bewahrt; der Doppelpunkt strukturiert die längere Aufzählung natürlich.
