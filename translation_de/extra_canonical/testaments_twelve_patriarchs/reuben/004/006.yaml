source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Βόθρος γάρ ἐστι ψυχῆς ἡ ἁμαρτία τῆς πορνείας⁵², χωρίζουσα ἀπὸ⁵³ θεοῦ καὶ προσεγγίζουσα *τοῖς εἰδώλοις⁵⁴, ὅτι αὕτη *ἐστὶν ἡ⁵⁵ πλανῶσα τὸν νοῦν *καὶ τὴν διάνοιαν⁵⁶, καὶ κατάγει⁵⁷ νεανί- σκους εἰς ᾅδην, οὐκ ἐν καιρῷ αὐτῶν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/006.yaml
  text: For the sin of sexual immorality is a pit for the soul, separating it from God and drawing it near to idols; for it is this that leads the mind and understanding astray, and brings young men down to Hades before their time.
translation:
  language: de
  text: 'Denn die Sünde der Unzucht ist eine Grube für die Seele: Sie trennt sie von Gott und zieht sie zu den Götzen hin. Denn sie ist es, die Verstand und Denken in die Irre führt und junge Männer vor ihrer Zeit ins Totenreich hinabführt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ ἁμαρτία τῆς πορνείας
  choice: die Sünde der Unzucht
  rationale: Gibt die sexuelle Bedeutung von πορνεία in knapper, würdiger Standardsprache wieder, ohne den Ausdruck unnötig auf eine einzelne Form sexuellen Fehlverhaltens einzuengen.
- source_word: βόθρος
  choice: Grube
  rationale: Bewahrt das konkrete Bild einer gefährlichen Vertiefung oder Grube; „Abgrund“ wäre stärker interpretierend.
- source_word: προσεγγίζουσα τοῖς εἰδώλοις
  choice: zieht sie zu den Götzen hin
  rationale: Gibt die Annäherungsbewegung des Partizips natürlich wieder; das ergänzte Objekt „sie“ bezieht sich entsprechend dem Satzbau auf die Seele.
- source_word: τὸν νοῦν καὶ τὴν διάνοιαν
  choice: Verstand und Denken
  rationale: Bewahrt die Doppelung zweier eng verwandter geistiger Größen, ohne sie zu einer einzigen deutschen Bezeichnung zu verschmelzen.
- source_word: εἰς ᾅδην
  choice: ins Totenreich
  rationale: Gibt ᾅδης als Bereich der Toten wieder und vermeidet die theologisch stärker festgelegte Wiedergabe „Hölle“.
- source_word: οὐκ ἐν καιρῷ αὐτῶν
  choice: vor ihrer Zeit
  rationale: 'Natürliche deutsche Wiedergabe des idiomatischen Sinnes: Sie sterben nicht zu dem für sie bestimmten Zeitpunkt, sondern vorzeitig.'
theological_decisions:
- issue: Verhältnis von Unzucht, Gott und Götzen
  choice: Die personifizierte Sünde trennt die Seele von Gott und zieht sie zu den Götzen hin.
  alternative: Die Sünde trennt den Sünder von Gott und bringt ihn dem Götzendienst nahe.
  rationale: Die Übersetzung folgt den grammatischen Bezügen und bewahrt die bildhafte Personifizierung, statt den Text als ausdrückliche Lehraussage über Götzendienst auszudeuten.
- issue: Bedeutung von ᾅδης
  choice: Totenreich
  alternative: Hades oder Hölle
  rationale: „Totenreich“ wahrt die antike Vorstellung vom Aufenthaltsbereich der Toten, ohne sie mit dem endgültigen Strafort gleichzusetzen; „Hades“ wäre weniger allgemein verständlich.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Satzgliederung. Die Wiederholung „Denn“ bildet die argumentative Struktur des griechischen γάρ … ὅτι ab, während der Doppelpunkt die Partizipialaussagen lesbar entfaltet. Keine Fußnoten erforderlich.
