    issue: Unnatürliche Verbverbindung „ins Totenreich hinabbringt“
    rationale: Das Präfix in „hinabbringt“ wirkt hier stilistisch sperrig. κατάγει bezeichnet ein Hinabführen beziehungsweise Hinabbringen; „hinabführt“ ist im Deutschen die natürliche und zugleich genaue Wiedergabe.
  revised_text: 'Denn die Sünde der Unzucht ist eine Grube für die Seele: Sie trennt sie von Gott und zieht sie zu den Götzen hin. Denn sie ist es, die Verstand und Denken in die Irre führt und junge Männer vor ihrer Zeit ins Totenreich hinabführt.'
