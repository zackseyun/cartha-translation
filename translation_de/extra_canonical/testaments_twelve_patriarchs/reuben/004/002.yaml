  text: For until my father's death I did not have the boldness to look my father in the face.
translation:
  language: de
  text: Denn bis zum Tod meines Vaters hatte ich nicht den Mut, ihm ins Gesicht[a] zu sehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text ist an dieser Stelle beschädigt beziehungsweise unvollständig überliefert; „Gesicht“ ist eine naheliegende Rekonstruktion aus dem Zusammenhang.
    reason: Die vorgelegte griechische Textgestalt bricht nach εἰς τὸ π… ab, während der Sinn eine Bezeichnung wie „Gesicht“ erwarten lässt.
lexical_decisions:
- source_word: ἄχρι τελευτῆς τοῦ πατρός μου
  choice: bis zum Tod meines Vaters
  rationale: Gibt die zeitliche Grenze des griechischen Ausdrucks direkt und natürlich wieder.
- source_word: οὐκ εἶχον παρρησίαν
  choice: hatte ich nicht den Mut
  rationale: παρρησία bezeichnet hier die innere Freiheit beziehungsweise Kühnheit, offen aufzutreten; „nicht den Mut haben“ ist im Deutschen idiomatisch und wahrt den Sinn.
- source_word: ἀτενίσαι
  choice: zu sehen
  rationale: Das Verb kann ein festes, unverwandtes Anschauen bezeichnen. In Verbindung mit „ins Gesicht“ genügt im Deutschen das natürliche „sehen“, ohne eine unpassend aggressive Nuance einzutragen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Das zweite „mein Vater“ wird durch das natürliche Pronomen „ihm“ aufgenommen; Scham und fehlender Freimut bleiben erkennbar, ohne den Satz unnötig zu erschweren.
