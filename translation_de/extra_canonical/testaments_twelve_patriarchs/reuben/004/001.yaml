source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Μὴ οὖν προσέχετε, Γτέκνα μου1, κάλλος2 γυναικῶν3, μηδὲ ἐννοεῖσθε4 τὰς πράξεις αὐτῶν· ἀλλὰ πορεύεσθε ἐν5 ἁπλότητι καρδίας, ἐν φόβῳ κυρίου6, καὶ μοχθοῦντες7 ἐν ἔργοις *καλοῖς, καὶ8 *ἐν γράμμασι, καὶ ἐν τοῖς ποιμνίοις9 ὑμῶν, ἕως οὗ10 *ὁ κύριος δώῃ ὑμῖν11 *σύζυγον, ἣν αὐτὸς θέλει12, ἵνα μὴ πάθητε13, ὡς κἀγώ14.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/001.yaml
  text: Therefore, my children, do not pay attention to the beauty of women, nor dwell on their deeds; but walk in simplicity of heart, in the fear of the Lord, laboring in good works, and in learning, and in your flocks, until the Lord gives you a wife whom he himself chooses, so that you may not suffer as I did.
translation:
  language: de
  text: Darum, meine Kinder, achtet nicht auf die Schönheit der Frauen und richtet eure Gedanken nicht auf ihr Tun; vielmehr geht euren Weg in Lauterkeit des Herzens, in der Furcht des Herrn, und müht euch in guten Werken, im Lernen und bei euren Herden ab, bis der Herr euch eine Frau gibt, die er selbst will, damit ihr nicht leidet wie ich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέχετε
  choice: achtet auf
  rationale: Gibt den Imperativ im Zusammenhang mit dem folgenden Gegenstand κάλλος natürlich und nah am griechischen Wortlaut wieder.
- source_word: ἐννοεῖσθε τὰς πράξεις αὐτῶν
  choice: beschäftigt euch nicht mit ihrem Tun
  rationale: ἐννοεῖσθε bezeichnet ein gedankliches Befassen; πράξεις ist hier allgemein das Tun beziehungsweise Handeln.
- source_word: ἁπλότητι καρδίας
  choice: mit ungeteiltem Herzen
  rationale: ἁπλότης kann Schlichtheit, Aufrichtigkeit oder innere Ungeteiltheit bezeichnen. Die gewählte Formulierung ist im Deutschen verständlich und bewahrt den ethischen Sinn.
- source_word: μοχθοῦντες
  choice: müht euch ... ab
  rationale: Bewahrt den kräftigen Sinn von anstrengender, mühevoller Arbeit.
- source_word: ἐν γράμμασι
  choice: mit dem Lernen
  rationale: γράμματα kann Buchstaben, Schriften oder Bildung/Lernen bedeuten; in dieser Aufzählung ist eine Tätigkeit oder Beschäftigung gemeint.
- source_word: σύζυγον
  choice: eine Frau
  rationale: Im Kontext bezeichnet das Wort die Ehefrau; die natürliche deutsche Wiedergabe lautet hier „eine Frau“.
- source_word: ἣν αὐτὸς θέλει
  choice: die er selbst für euch will
  rationale: Bewahrt θέλει als „will“ und vermeidet die stärkere, im Griechischen nicht ausdrücklich vorhandene Aussage „auswählt“.
theological_decisions:
- issue: φόβῳ κυρίου und die Schreibung von κύριος
  choice: in der Furcht des Herrn / der Herr
  alternative: in der Furcht des Herrn / der Herrgott
  rationale: κύριος wird konventionell als „Herr“ wiedergegeben. Der Text verlangt keine zusätzliche Präzisierung der göttlichen Bezeichnung.
- issue: Göttliches Wollen bei der Ehefrau
  choice: eine Frau gibt, die er selbst für euch will
  alternative: eine Frau gibt, die er selbst auswählt
  rationale: Die Formulierung bewahrt das göttliche Wollen, ohne aus θέλει ausdrücklich einen Auswahlakt zu machen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die lange griechische Satzperiode wurde zur besseren Lesbarkeit in zwei Sätze gegliedert. „Mit ungeteiltem Herzen“ vermittelt ἁπλότης natürlicher als das missverständliche „in Einfalt des Herzens“.
