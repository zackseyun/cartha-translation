revisions:
- from: Darum, meine Kinder, achtet nicht auf die Schönheit der Frauen und beschäftigt euch nicht mit ihrem Tun. Geht vielmehr mit ungeteiltem Herzen in der Furcht des Herrn euren Weg und müht euch mit guten Werken, mit dem Lernen und mit euren Herden ab, bis der Herr euch eine Frau gibt, die er selbst für euch will, damit ihr nicht leidet wie ich.
  to: Darum, meine Kinder, achtet nicht auf die Schönheit der Frauen und richtet eure Gedanken nicht auf ihr Tun; vielmehr geht euren Weg in Lauterkeit des Herzens, in der Furcht des Herrn, und müht euch in guten Werken, im Lernen und bei euren Herden ab, bis der Herr euch eine Frau gibt, die er selbst will, damit ihr nicht leidet wie ich.
  rationale: Die Revision bewahrt die Satzführung und ethische Mahnung des griechischen Textes, fasst ἁπλότης weiter und quellenäher als „Lauterkeit“ und entfernt den nicht ausdrücklich vorhandenen Zusatz „für euch“ aus dem Relativsatz. Die Aufzählung zu guten Werken, Lernen und Herden ist idiomatischer gestaltet, ohne ihren Umfang zu verändern.
