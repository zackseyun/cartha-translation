review_pass:
  verdict: revise
  source_fidelity: Die Grundbedeutung wird überwiegend getroffen. „Mit ungeteiltem Herzen“ ist für ἁπλότης καρδίας jedoch zu spezifisch und kann eine innere Ausschließlichkeit nahelegen, die der griechische Ausdruck nicht zwingend aussagt. Auch „für euch“ bei „die er selbst für euch will“ ist im griechischen Wortlaut nicht vorhanden.
  naturalness: Der Entwurf ist gut verständlich, aber „müht euch mit guten Werken, mit dem Lernen und mit euren Herden ab“ ist im Deutschen syntaktisch und idiomatisch etwas schwerfällig. Eine parallele Präpositionalfügung bildet die griechische Aufzählung klarer ab.
  terminology: „Furcht des Herrn“, „gute Werke“, „Lernen“ und „Herden“ sind sachgerecht. „Lauterkeit des Herzens“ gibt ἁπλότης καρδίας in würdigem, verständlichem Deutsch wieder, ohne die mögliche Bedeutung stärker einzuengen.
  issues:
  - severity: medium
    issue: „mit ungeteiltem Herzen“ für ἐν ἁπλότητι καρδίας
    rationale: ἁπλότης bezeichnet vor allem Schlichtheit, Aufrichtigkeit beziehungsweise Lauterkeit. „Ungeteilt“ ist als Deutung möglich, aber enger als der griechische Ausdruck.
  - severity: low
    issue: Zusatz „für euch“ in „die er selbst für euch will“
    rationale: Das Dativpronomen ὑμῖν gehört zu „gibt“; im Relativsatz steht lediglich „die er selbst will“. Der Zusatz ist zwar naheliegend, aber nicht erforderlich.
  - severity: low
    issue: Formulierung der Aufzählung mit „müht euch mit ... ab“
    rationale: Die Konstruktion klingt im Deutschen sperrig. „Müht euch in ... und bei ... ab“ erhält die Bedeutung von μοχθοῦντες und ordnet die Tätigkeitsbereiche klar.
