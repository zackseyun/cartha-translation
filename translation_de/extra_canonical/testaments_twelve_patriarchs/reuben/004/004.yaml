lexical_decisions:
- source_word: οὐχ οὕτως ἐγένετο
  choice: so etwas war … nicht geschehen
  rationale: Die Wendung bezeichnet, dass etwas Derartiges nicht vorgekommen war. Das Plusquamperfekt gibt im Deutschen den rückblickenden Bezug auf das zuvor geschilderte Geschehen natürlich wieder.
- source_word: ἐν τῷ Ἰσραήλ
  choice: in Israel
  rationale: Die knappe Formulierung bewahrt die mögliche Bezugnahme sowohl auf das Volk als auch auf dessen Gemeinschaftsbereich, ohne sie näher festzulegen.
theological_decisions:
- issue: Bedeutungsumfang von „Israel“
  choice: Israel
  alternative: das Volk Israel
  rationale: Der griechische Text nennt schlicht Israel; eine ausdrückliche Festlegung auf Volk, Land oder Gemeinschaft würde die genuine Offenheit unnötig einschränken.
translation_notes:
  register: Knappe, würdige Standardsprache. „So etwas“ ist gegenwärtig und verständlich; die Wortstellung setzt den verneinten Vorgang angemessen in den Vordergrund.
