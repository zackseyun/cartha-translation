source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Διὰ τοῦτο⁴⁵ *τέκνα μου⁴⁶, *Γλέγω ὑμῖν⁴⁷, φυλάξατε⁴⁸ Γπάντα⁴⁹ ὅσα ἐντέλλομαι⁵⁰ ὑμῖν, καὶ οὐ μὴ ἁμάρτητε⁵¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/005.yaml
  text: Therefore, my children, I tell you, keep all that I command you, and you will certainly not sin.
translation:
  language: de
  text: 'Darum, meine Kinder, sage ich euch: Haltet alles, was ich euch gebiete, und ihr werdet gewiss nicht sündigen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Darum
  rationale: Gibt die folgernde Verbindung knapp und natürlich wieder.
- source_word: φυλάξατε
  choice: Haltet
  rationale: Der Imperativ bezeichnet hier das Befolgen beziehungsweise Bewahren von Geboten; „Haltet“ ist im Deutschen idiomatisch und wahrt den formalen Bezug.
- source_word: πάντα ὅσα
  choice: alles, was
  rationale: Bildet die umfassende griechische Wendung präzise und in natürlichem Deutsch ab.
- source_word: οὐ μὴ ἁμάρτητε
  choice: ihr werdet gewiss nicht sündigen
  rationale: Die starke griechische Verneinung wird durch „gewiss nicht“ ausgedrückt, ohne sie zu einer bloßen Aufforderung umzudeuten.
theological_decisions:
- issue: Aussage über das Nicht-Sündigen
  choice: 'Als nachdrückliche Zukunftsaussage wiedergegeben: „ihr werdet gewiss nicht sündigen“'
  alternative: „damit ihr keinesfalls sündigt“
  rationale: οὐ μή mit dem Aorist-Konjunktiv trägt hier eine starke Verneinung; die Übersetzung bewahrt die Spannung der kategorischen Aussage und schwächt sie nicht zu einer Zweckangabe ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede „meine Kinder“ und der gebietende Ton des griechischen Textes bleiben erhalten; der Doppelpunkt macht die folgende Aufforderung klar kenntlich.
