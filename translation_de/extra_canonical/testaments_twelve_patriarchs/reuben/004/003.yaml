lexical_decisions:
- source_word: ἕως νῦν
  choice: bis heute
  rationale: Gibt die bis in die Gegenwart reichende Zeitangabe natürlich und präzise wieder.
- source_word: ἡ συνείδησίς μου
  choice: mein Gewissen
  rationale: Die direkte und im modernen Deutschen geläufige Entsprechung.
- source_word: τύπτει με
  choice: schlägt mich
  rationale: Bewahrt das konkrete, eindringliche Bild des griechischen Verbs τύπτω, ohne es deutend zu »quält mich« abzuschwächen oder auszuweiten.
- source_word: περὶ τῆς ἁμαρτίας μου
  choice: wegen meiner Sünde
  rationale: Drückt hier den Anlass des schlagenden Gewissens idiomatisch aus; »Sünde« bewahrt den religiös-moralischen Gehalt von ἁμαρτία.
