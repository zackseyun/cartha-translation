source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Καὶ γὰρ⁶⁷ πολλὰ ἐποίησεν αὐτῷ ἡ Αἰγυπτία, καὶ μάγους προσεκάλεσεν⁶⁸ καὶ *φάρμακα αὐτῷ προσήνεγκε⁶⁹, ἐπειδὴ γὰρ ἐφύλαξεν ἑαυτὸν Ἰωσὴφ ἀπὸ πάσης. β, Α, S¹ κυρίου. καὶ⁷⁰ οὐκ ἐδέξατο⁷¹ τὸ διαβούλιον τῆς ψυχῆς αὐτοῦ⁷² ἐπιθυμίαν πονηράν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/009.yaml
  text: For the Egyptian woman did many things to him, and called in magicians and brought him potions; for Joseph guarded himself from every evil desire and did not accept the counsel of his soul for wicked desire.
translation:
  language: de
  text: Denn die Ägypterin tat ihm vieles an, rief Zauberer herbei und brachte ihm Zaubermittel[a]; denn Josef hütete sich vor jeder bösen Begierde und nahm den Rat seiner Seele zu böser Begierde nicht an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Arzneien, Tränke oder Gifte. Das griechische Wort kann verschiedene heilende, schädliche oder magisch gebrauchte Mittel bezeichnen.'
    reason: Das Bedeutungsspektrum von φάρμακα ist breiter als jede einzelne deutsche Entsprechung; der Kontext legt magisch verwendete Mittel nahe, lässt ihre genaue Art aber offen.
lexical_decisions:
- source_word: ἡ Αἰγυπτία
  choice: die Ägypterin
  rationale: Die substantivierte Herkunftsbezeichnung wird knapp und entsprechend dem griechischen Text wiedergegeben.
- source_word: πολλὰ ἐποίησεν αὐτῷ
  choice: tat ihm vieles an
  rationale: Die Formulierung bewahrt die unbestimmte Vielzahl ihrer Handlungen und gibt den auf Josef gerichteten, im Kontext schädigenden Charakter idiomatisch wieder.
- source_word: μάγους προσεκάλεσεν
  choice: rief Zauberer herbei
  rationale: μάγοι bezeichnet hier Personen, die magische Praktiken ausüben; προσεκάλεσεν drückt ihr Herbeirufen aus.
- source_word: φάρμακα
  choice: Zaubermittel
  rationale: φάρμακα kann Arzneien, Drogen, Gifte oder magisch verwendete Mittel bezeichnen. Wegen der unmittelbar zuvor genannten Zauberer ist „Zaubermittel“ im Kontext am treffendsten, ohne eine bestimmte Darreichungsform festzulegen.
- source_word: ἐφύλαξεν ἑαυτόν
  choice: hütete sich
  rationale: Die reflexive Wendung bezeichnet Josefs wachsame Selbstbewahrung und wird im Deutschen natürlich mit „sich hüten“ ausgedrückt.
- source_word: τὸ διαβούλιον τῆς ψυχῆς αὐτοῦ
  choice: den Rat seiner Seele
  rationale: Die ungewöhnliche innere Bildsprache des griechischen Textes wird bewusst bewahrt und nicht psychologisch geglättet.
- source_word: ἐπιθυμίαν πονηράν
  choice: böse Begierde
  rationale: ἐπιθυμία bezeichnet ein starkes Verlangen oder Begehren; „Begierde“ wahrt hier die moralisch negative Färbung durch πονηράν.
theological_decisions:
- issue: Verhältnis Josefs zu den Regungen seiner Seele
  choice: nahm den Rat seiner Seele … nicht an
  alternative: gab dem Verlangen seines Inneren nicht nach
  rationale: Die Übersetzung erhält die Spannung, dass die Seele wie eine ratende Instanz erscheint, statt diese anthropologische Ausdrucksweise stillschweigend in eine moderne psychologische Deutung aufzulösen.
- issue: Verknüpfung der beiden Satzteile
  choice: den zweiten Begründungssatz mit „denn“ einleiten
  alternative: mit „aber“ einen Gegensatz markieren
  rationale: Das überlieferte γάρ stützt eine begründende Verbindung. Ein adversatives „aber“ wäre zwar stilistisch naheliegend, steht jedoch nicht ausdrücklich im griechischen Text.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „denn“ folgt der begründenden Verknüpfung des griechischen Textes. Die bewusst ungewöhnliche Wendung „Rat seiner Seele“ bewahrt das Bild und die theologische Spannung der Vorlage.
