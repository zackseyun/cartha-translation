  terminology: „Ägypterin“, „Zauberer“, „Zaubermittel“, „böse Begierde“ und „Josef“ sind angemessen. Die Fußnote zu φάρμακα erläutert das weite Bedeutungsspektrum sachlich und ohne die im Kontext plausible magische Nuance zu verabsolutieren.
