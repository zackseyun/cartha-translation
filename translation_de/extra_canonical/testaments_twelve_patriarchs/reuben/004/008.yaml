id: T12P.REU.4.8
reference: Testament of Reuben 4:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '*Ἠκούσατε γὰρ περὶ Ἰωσὴφ πῶς ἐφύλαξεν ἑαυ- τὸν ἀπὸ⁶² γυναικός, καὶ τὰς ἐννοίας ἐκαθάρισεν⁶³ ἀπὸ πάσης⁶⁴ πορνείας, Γκαὶ⁶⁵ εὗρεν χάριν ἐνώπιον θεοῦ⁶⁶ καὶ ἀνθρώ- πων.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/008.yaml
  text: For you have heard about Joseph, how he guarded himself from a woman and cleansed his thoughts from all sexual immorality, and found favor before God and men.
translation:
  language: de
  text: Denn ihr habt von Josef gehört, wie er sich vor einer Frau hütete, seine Gedanken von aller sexuellen Unmoral reinigte und Gunst bei Gott und den Menschen fand.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφύλαξεν ἑαυτόν ἀπὸ γυναικός
  choice: sich vor einer Frau hütete
  rationale: Gibt die bewusste Selbstbewahrung und die Distanzierung von der Frau knapp und quellennah wieder, ohne über den griechischen Wortlaut hinaus eine bestimmte Handlung zu ergänzen.
- source_word: τὰς ἐννοίας
  choice: seine Gedanken
  rationale: ἐννοίαι bezeichnet hier innere Gedanken bzw. Absichten; „Gedanken“ ist im modernen Deutsch natürlich und lässt die genaue Reichweite offen.
- source_word: ἀπὸ πάσης πορνείας
  choice: von aller sexuellen Unmoral
  rationale: Bewahrt die umfassende Aussage von πάσης und gibt πορνεία als breiten Begriff für sexuell unmoralisches Verhalten wieder, ohne ihn auf einen einzelnen Tatbestand einzuengen.
- source_word: εὗρεν χάριν ἐνώπιον
  choice: Gunst bei … fand
  rationale: Eine natürliche deutsche Entsprechung für die idiomatische Wendung; „bei“ gibt ἐνώπιον in diesem Zusammenhang verständlich wieder.
- source_word: θεοῦ καὶ ἀνθρώπων
  choice: Gott und den Menschen
  rationale: Folgt der allgemeinen, nicht näher eingeschränkten Bezeichnung des griechischen Textes.
theological_decisions:
- issue: Reichweite von πορνεία
  choice: sexuelle Unmoral
  alternative: Unzucht
  rationale: „Sexuelle Unmoral“ wahrt die semantische Breite und ist im heutigen Standarddeutsch verständlicher als das enger oder altertümlich wirkende „Unzucht“.
- issue: Art der göttlichen und menschlichen Anerkennung
  choice: Gunst bei Gott und den Menschen
  alternative: Gnade vor Gott und den Menschen
  rationale: χάρις bezeichnet hier im Zusammenhang mit „finden“ Anerkennung bzw. Wohlwollen; „Gunst“ vermeidet eine unnötige dogmatische Festlegung auf einen spezifischen Gnadenbegriff.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit mäßig formaler Satzführung. Die parallelen Handlungen Josefs bleiben erhalten; echte Bedeutungsbreiten bei ἐννοίαι und πορνεία werden nicht unnötig verengt.
