source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Διὰ τοῦτο⁷³ ὁ θεὸς τῶν πατέρων ὑμῶν⁷⁴ ἐρρύσατο αὐτὸν ἀπὸ παντὸς πονηροῦ⁷⁵ κεκρυμμένου θανάτου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004/010.yaml
  text: Therefore the God of your fathers delivered him from every hidden evil death.
translation:
  language: de
  text: Darum rettete ihn der Gott eurer Väter vor jedem bösen, verborgenen Tod.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Darum
  rationale: Gibt die folgernde Verknüpfung knapp und natürlich wieder.
- source_word: ἐρρύσατο
  choice: rettete
  rationale: Bezeichnet das Befreien oder Erretten aus einer Gefahr; „rettete“ ist hier idiomatisch und präzise.
- source_word: ἀπὸ παντὸς πονηροῦ κεκρυμμένου θανάτου
  choice: vor jedem bösen, verborgenen Tod
  rationale: Die Genitivgruppe wird als ein zusammengehöriger Ausdruck wiedergegeben. κεκρυμμένου stimmt mit θανάτου überein und bezeichnet den Tod als verborgen; πονηροῦ wird attributiv als „bösen“ verstanden. Die deutsche Präposition „vor“ entspricht dem bei „retten“ üblichen Anschluss.
theological_decisions:
- issue: Bezug der Adjektive in der abschließenden Genitivgruppe
  choice: „bösen, verborgenen Tod“ als ein einziges Objekt der Rettung
  alternative: „vor allem verborgenen Bösen und vor dem Tod“
  rationale: Die Alternative zerlegt die griechische Genitivgruppe ohne ausdrückliche zweite Präposition oder Konjunktion. Die gewählte Fassung wahrt die syntaktische Einheit und lässt die ungewöhnliche Vorstellung eines verborgenen Todes bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; die knappe Satzstruktur und die bildhafte, im Deutschen leicht ungewöhnliche Wendung „verborgener Tod“ bleiben erhalten.
