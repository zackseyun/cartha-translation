base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/007.yaml
  text: And Reuben died[a], after commanding these things to his sons. And they placed him in a coffin until he was brought up from Egypt and buried in Hebron[b], in the cave where his fathers were.
translation:
  language: de
  text: Und Ruben starb[a], nachdem er seinen Söhnen diese Weisungen geboten hatte. Und sie legten ihn in einen Sarg, bis er aus Ägypten hinaufgebracht und in Hebron[b] in der Höhle, in der seine Väter begraben lagen, bestattet wurde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der für dieses Kapitel vorliegende griechische Textzeuge ist sehr kurz und bricht nach „bis“ ab. Der restliche Bestattungsvermerk wurde mit einer möglichst knappen Ergänzung aus dem erzählerischen Zusammenhang des Testaments wiedergegeben, nicht aus einem vollständig rekonstruierten griechischen Text.
    reason: textual_variant
  - marker: b
    text: Hebron und die Höhle der Väter greifen die Überlieferung von der Grabstätte der Stammväter im Buch Genesis auf.
    reason: cross_reference
lexical_decisions:
- source_word: ἀπέθανε
  choice: starb
  rationale: Das gewöhnliche griechische Verb für den Tod wird schlicht und ohne beschönigenden Zusatz wiedergegeben.
- source_word: ἐντειλάμενος
  choice: nachdem er … geboten hatte
  rationale: Das Partizip bezeichnet eine dem Tod vorausgehende Handlung und bewahrt den verbindlichen Charakter der testamentarischen Weisung.
- source_word: υἱοῖς
  choice: Söhnen
  rationale: Der griechische Text bezeichnet ausdrücklich die Söhne und nicht allgemein die Kinder.
- source_word: ἔθεντο
  choice: sie legten
  rationale: Im Zusammenhang mit der Bestattung ist „legten“ eine natürliche und quellennah bleibende Wiedergabe.
- source_word: σορῷ
  choice: Sarg
  rationale: Das Wort bezeichnet hier einen Sarg beziehungsweise einen Behälter für den Leichnam; „Sarg“ ist im modernen Deutsch klar und präzise.
- source_word: ἕως
  choice: bis
  rationale: Die erhaltene griechische Vorlage bricht nach dem Wort ab. „Bis“ erhält dessen offene zeitliche Funktion und leitet die transparent gekennzeichnete minimale Ergänzung ein.
theological_decisions:
- issue: Umgang mit dem äußerst kurzen und nach ἕως abbrechenden griechischen Textzeugen
  choice: Der erhaltene Sterbe- und Bestattungsvermerk wird unmittelbar übersetzt; der Satz wird anhand des erzählerischen Zusammenhangs nur so weit ergänzt, dass die Überführung aus Ägypten und die Bestattung bei den Vätern verständlich werden.
  alternative: Nur die erhaltenen Wörter als Satzfragment wiedergeben oder einen vollständigen Schluss aus weiteren Textzeugen beziehungsweise Ausgaben rekonstruieren.
  rationale: Ein bloßes Fragment wäre als Kapiteltext wenig verständlich, während eine umfassende Rekonstruktion über die bereitgestellte griechische Evidenz hinausginge. Die Fußnote macht den Umfang und die Grundlage der Ergänzung ausdrücklich sichtbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Geboten“ wahrt den verbindlichen testamentarischen Ton; die Satzstellung bleibt gut verständlich. Die genuine Textlücke wird nicht verdeckt, sondern durch Fußnote [a] offengelegt.
