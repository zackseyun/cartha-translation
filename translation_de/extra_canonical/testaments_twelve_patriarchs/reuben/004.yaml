review_pass:
  verdict: revise
  source_fidelity: 'Überwiegend eng am griechischen Text und an der vorsichtigen englischen Audit-Fassung. In 4,1 gibt „müht euch mit guten Werken“ jedoch die Konstruktion μοχθοῦντες ἐν ἔργοις καλοῖς unklar wieder: Gemeint ist angestrengtes Arbeiten in guten Werken, im Lernen und bei den Herden, nicht ein Sich-Abmühen mithilfe guter Werke. Die übrigen schwierigen, durch die komprimierte Vorlage nur indirekt belegten Verse 2–4 sind angemessen markiert.'
  naturalness: Modernes Standarddeutsch, würdig und gut lesbar. Die überarbeitete Formulierung in 4,1 beseitigt eine unnatürliche und semantisch missverständliche Instrumentalverbindung. In 4,9 wird die griechische Wendung zum „Rat seiner Seele“ verständlich wiedergegeben, ohne ihre innere Beziehung zur bösen Begierde dogmatisch aufzulösen.
  terminology: „Furcht des Herrn“, „sexuelle Unmoral“, „Götzen“, „Hades“ und „Beliar“ sind angemessen. „Tränke“ für φάρμακα ist im Kontext der Zauberer und Verführung vertretbar und durch die Fußnote transparent gemacht. Die Fußnotenanker a–d stimmen mit den betreffenden Versen überein.
  issues:
  - severity: medium
    issue: '4,1: „müht euch mit guten Werken, mit dem Lernen und mit euren Herden ab“'
    rationale: Das Deutsche legt nahe, gute Werke, Lernen und Herden seien Mittel, mit denen man sich abmüht. Das Griechische nennt Bereiche, in denen die Adressaten arbeiten sollen (ἐν ἔργοις καλοῖς, ἐν γράμμασι, ἐν τοῖς ποιμνίοις). „Arbeitet hart in guten Werken, beim Lernen und mit euren Herden“ gibt dies klarer wieder.
