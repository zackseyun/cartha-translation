  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/004.yaml
  text: '1[a]. Therefore, my children, do not pay attention to the beauty of women, nor dwell on their deeds; but walk in simplicity of heart, in the fear of the Lord, laboring in good works, and in learning, and in your flocks, until the Lord gives you a wife whom he himself chooses, so that you may not suffer as I did.


    2[b]. For until my father''s death I did not have the boldness to look my father in the face.


    3. And because of the reproach of my sin, my mind was continually consumed within me.


    4. For seven months I was sick unto death, and after I had repented with purpose of soul before the Lord, the spirit of jealousy departed from me. Until now I have kept myself on guard, and I have not sinned.


    5. Therefore, my children, I tell you: keep everything that I command you, and you will certainly not sin.


    6. For the sin of sexual immorality is a pit for the soul, separating it from God and bringing it near to idols; for it is this that leads the mind and understanding astray, and brings young men down to Hades before their time.


    7. For sexual immorality has destroyed many. Whether a man is old, or noble, or rich, or poor, he brings reproach on himself before the sons of men and a stumbling block to Beliar.


    8. For you have heard about Joseph, how he guarded himself from a woman and cleansed his thoughts from every kind of sexual immorality, and found favor before God and men.


    9. For the Egyptian woman did many things against him, and called in magicians and brought him potions; but Joseph guarded himself from every evil desire and did not accept the counsel of his soul toward wicked lust.


    10[c][d]. Therefore the God of your fathers delivered him from every hidden evil and from death.'
translation:
  language: de
  text: '**Das Testament Rubens 4**


    **1.** Darum, meine Kinder, achtet nicht auf die Schönheit von Frauen und beschäftigt euch nicht in Gedanken mit ihrem Tun. Wandelt vielmehr in Schlichtheit des Herzens und in der Furcht des Herrn; arbeitet hart in guten Werken, beim Lernen und mit euren Herden, bis der Herr euch eine Frau gibt, die er selbst für euch will, damit ihr nicht leiden müsst wie ich.


    **2.** Denn bis zum Tod meines Vaters hatte ich nicht den Mut, meinem Vater ins Gesicht zu sehen.[a]


    **3.** Wegen der Schande meiner Sünde verzehrte sich mein Sinn unablässig in mir.


    **4.** Sieben Monate lang war ich todkrank. Nachdem ich vor dem Herrn mit festem Entschluss meiner Seele umgekehrt war, wich der Geist der Eifersucht von mir. Bis heute habe ich mich in Acht genommen und nicht gesündigt.[b]


    **5.** Darum, meine Kinder, sage ich euch: Haltet alles, was ich euch gebiete, dann werdet ihr gewiss nicht sündigen.


    **6.** Denn die sexuelle Unmoral ist eine Grube für die Seele: Sie trennt sie von Gott und bringt sie den Götzen nahe. Sie ist es, die Sinn und Denken in die Irre führt und junge Männer vor ihrer Zeit in den Hades hinabzieht.


    **7.** Denn die sexuelle Unmoral hat viele zugrunde gerichtet. Ob jemand alt oder vornehm, reich oder arm ist – er bringt Schande über sich bei den Menschen und wird zu einem Stolperstein für Beliar.[d]


    **8.** Ihr habt ja von Josef gehört: wie er sich vor einer Frau hütete, seine Gedanken von jeder sexuellen Unmoral reinigte und Gunst bei Gott und den Menschen fand.


    **9.** Denn die Ägypterin tat ihm vieles an, rief Zauberer herbei und brachte ihm Tränke.[c] Josef aber hütete sich vor jedem bösen Verlangen und nahm den Rat seiner Seele zu übler Begierde nicht an.


    **10.** Darum rettete ihn der Gott eurer Väter vor allem verborgenen Bösen und vor dem Tod.


    **Fußnoten**


    [a] Der griechische Text ist an dieser Stelle in der vorliegenden Überlieferungs- beziehungsweise OCR-Schicht beschädigt oder stark zusammengedrängt. Gemeint ist offenbar, dass Ruben wegen seiner Sünde bis zum Tod seines Vaters nicht den Mut hatte, ihm ins Gesicht zu sehen.


    [b] Die Aussage über die siebenmonatige Krankheit und das Weichen des Geistes der Eifersucht entspricht der überlieferten Abfolge dieses Abschnitts. Da die vorgelegte Textschicht hier zusammengedrängt ist, gibt die Übersetzung den erhaltenen griechischen Sinn mit entsprechender Vorsicht wieder.


    [c] Das griechische Wort φάρμακα kann „Drogen“, „Tränke“ oder magische Zubereitungen bezeichnen. Der Zusammenhang mit Verführung und Zauberern spricht hier für „Tränke“.


    [d] „Ein Stolperstein für Beliar“ ist eine schwierige Wendung. Die ungewöhnliche Formulierung des Griechischen wurde möglichst eng bewahrt und nicht durch eine eindeutige Deutung ersetzt.'
