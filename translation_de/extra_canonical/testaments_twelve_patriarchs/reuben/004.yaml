lexical_decisions:
- source_word: προσέχετε
  choice: achtet auf
  rationale: Die Wendung bezeichnet das bewusste Richten der Aufmerksamkeit; im verneinten Imperativ ist „achtet nicht auf“ natürlich und wahrt die Warnung.
- source_word: ἐννοεῖσθε
  choice: beschäftigt euch in Gedanken mit
  rationale: Das Verb meint hier mehr als bloßes Wahrnehmen und warnt vor innerer gedanklicher Beschäftigung.
- source_word: ἁπλότης καρδίας
  choice: Schlichtheit des Herzens
  rationale: Die relativ formale Wendung bewahrt das Bild eines ungekünstelten, nicht geteilten Herzens, ohne es vollständig als „Aufrichtigkeit“ auszudeuten.
- source_word: φόβῳ κυρίου
  choice: in der Furcht des Herrn
  rationale: Die geläufige biblische Ausdrucksweise wahrt den Ernst des griechischen φόβος und schwächt ihn nicht zu bloßer Achtung ab.
- source_word: γράμμασι
  choice: mit dem Lernen
  rationale: Wörtlich bezeichnet das Wort „Buchstaben“ oder „Schriften“; im Zusammenhang ist Bildung beziehungsweise Lernen gemeint.
- source_word: σύζυγον
  choice: eine Frau
  rationale: In der väterlichen Mahnung an die Söhne bezeichnet das Wort die Ehefrau; „eine Frau“ ist im modernen Deutschen idiomatisch.
- source_word: παρρησίαν
  choice: den Mut
  rationale: Hier bezeichnet das Wort die freie Zuversicht, dem Vater offen gegenüberzutreten; „Mut“ gibt dies im deutschen Satz natürlich wieder.
- source_word: πορνεία
  choice: sexuelle Unmoral
  rationale: Die Wiedergabe lässt den Umfang des allgemeinen sexuellen Lasterbegriffs offen und verengt ihn nicht auf einen einzelnen Tatbestand.
- source_word: βόθρος
  choice: Grube
  rationale: Das konkrete Gefahrenbild bleibt erhalten; „Grube“ passt im Deutschen besser zur Seele als das technischere „Graben“.
- source_word: φάρμακα
  choice: Tränke
  rationale: Das Wort kann Heilmittel, Drogen, Gift oder magische Mittel bezeichnen; Zauberer und Verführung legen hier zubereitete Tränke nahe.
- source_word: ᾅδην
  choice: Hades
  rationale: Die Transliteration bewahrt die antike Totenreichsvorstellung und vermeidet die dogmatisch engere Wiedergabe „Hölle“.
theological_decisions:
- issue: Verhältnis von sexueller Unmoral und Götzendienst
  choice: bringt sie den Götzen nahe
  alternative: führt sie in den Götzendienst
  rationale: Das griechische Verb drückt Annäherung aus. Die Übersetzung bewahrt den theologischen Zusammenhang, ohne eine vollständige Gleichsetzung zu behaupten.
- issue: Wiedergabe von ᾅδης
  choice: Hades
  alternative: Totenreich oder Hölle
  rationale: „Hades“ hält die Bildwelt des Ausgangstextes offen; „Hölle“ wäre stärker lehrhaft festgelegt, während „Totenreich“ das griechische Wort erklärend ersetzt.
- issue: Schwierige Wendung πρόσκομμα τῷ Βελίαρ
  choice: ein Stolperstein für Beliar
  alternative: ein durch Beliar verursachter Anstoß
  rationale: Kasusbezug und Sinn der Wendung bleiben schwierig. Die enge Wiedergabe wahrt diese Unklarheit, statt Beliars Rolle stillschweigend festzulegen.
- issue: Geist der Eifersucht
  choice: Geist der Eifersucht
  alternative: eifersüchtige Gesinnung
  rationale: Die personale beziehungsweise geistige Ausdrucksweise wird nicht psychologisierend auf eine bloße innere Haltung reduziert.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, bibelnah erkennbarem Ton. Veraltete Wörter wie „Einfalt“ und konfessionell stärker besetzte Deutungen wurden vermieden. Ungewöhnliche Bilder und echte Unsicherheiten des beschädigten griechischen Textes bleiben sichtbar und werden in Fußnoten erläutert.
