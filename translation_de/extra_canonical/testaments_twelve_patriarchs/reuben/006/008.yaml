base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/008.yaml
  text: until the completion of the times [of the high priest Messiah, of whom the Lord spoke].
translation:
  language: de
  text: bis zur Vollendung der Zeiten [des Hohenpriesters, des Messias, über den der Herr gesprochen hat].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „des Hohenpriesters, des Messias, über den der Herr gesprochen hat“ stehen in der griechischen Ausgabe in Klammern und sind textkritisch unsicher.
    reason: Die Editionsklammern markieren einen unsicheren beziehungsweise sekundär verdächtigen Textbestand; Leserinnen und Leser sollen darüber informiert werden.
lexical_decisions:
- source_word: ἕως τελειώσεως χρόνων
  choice: bis zur Vollendung der Zeiten
  rationale: Gibt die zeitliche Grenze sowie τελείωσις als „Vollendung“ und den Plural χρόνων als „Zeiten“ eng und zugleich idiomatisch wieder.
- source_word: ἀρχιερέως
  choice: des Hohen Priesters
  rationale: Entspricht dem Genitiv und bewahrt den kultischen Titel.
- source_word: χριστοῦ
  choice: des Messias
  rationale: Gibt den titular verstandenen Ausdruck im jüdischen Kontext als „Messias“ wieder, ohne ihn lediglich als Adjektiv „gesalbt“ aufzulösen.
- source_word: ὃν εἶπε Κύριος
  choice: von dem der Herr gesprochen hat
  rationale: Natürliches Deutsch für die relativische Wendung; Κύριος bleibt als „der Herr“ erhalten.
theological_decisions:
- issue: Verhältnis von ἀρχιερέως und χριστοῦ
  choice: „des Hohen Priesters, des Messias“ als zwei auf dieselbe Person bezogene Titel
  alternative: „des gesalbten Hohen Priesters“
  rationale: Die Genitivform χριστοῦ kann als Titel beziehungsweise Apposition verstanden werden. Die gewählte Fassung folgt der konsultierten Wiedergabe „high priest Messiah“, lässt aber durch die Zeichensetzung die enge Verbindung beider Bezeichnungen erkennen.
- issue: Textkritischer Status der Schlussphrase
  choice: Die in der Edition geklammerte Passage bleibt in eckigen Klammern
  alternative: Die Passage ohne Kennzeichnung in den Haupttext aufnehmen oder auslassen
  rationale: So wird die Unsicherheit der Überlieferung sichtbar bewahrt und nicht stillschweigend entschieden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Vollendung der Zeiten“ bewahrt die feierliche, eschatologische Ausdrucksweise; die textkritische Unsicherheit wird transparent durch eckige Klammern und eine Fußnote angezeigt.
