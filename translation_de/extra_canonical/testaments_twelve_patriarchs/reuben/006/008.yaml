  verdict: revise
  source_fidelity: Die Hauptwendung ἕως τελειώσεως χρόνων ist mit „bis zur Vollendung der Zeiten“ treffend wiedergegeben. Die eingeklammerte griechische Ergänzung wird richtigerweise als unsicher markiert. Für ἀρχιερέως ist im Deutschen jedoch die übliche Zusammenschreibung „Hohenpriesters“ vorzuziehen. Die Relativwendung ὃν εἶπε Κύριος wird idiomatischer und im Sinn der englischen Auditspur genauer mit „über den der Herr gesprochen hat“ wiedergegeben.
  naturalness: „Hohen Priesters“ wirkt als getrennte Schreibung eines etablierten religiösen Titels weniger natürlich. „Hohenpriesters, des Messias“ ist modernes, klares Standarddeutsch. „über den ... gesprochen hat“ ist gegenüber „von dem ... gesprochen hat“ die geläufigere deutsche Konstruktion.
  terminology: „Vollendung der Zeiten“, „Hoherpriester“ und „Messias“ bewahren den gehobenen religiösen Registerwert und legen keine konfessionelle Deutung über die appositionelle Verbindung von Hoherpriester und Messias hinaus.
