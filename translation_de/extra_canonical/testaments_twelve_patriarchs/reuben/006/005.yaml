base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/005.yaml
  text: 'Therefore I say to you: you will envy the sons of Levi and seek to be exalted above them, but because of this you will not prevail.'
translation:
  language: de
  text: 'Darum sage ich euch: Ihr werdet die Söhne Levis beneiden und danach streben, über sie erhöht zu werden; doch gerade deshalb werdet ihr euch nicht durchsetzen können.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ζηλώσετε
  choice: ihr werdet … beneiden
  rationale: Das Verb bezeichnet hier im Zusammenhang mit dem Streben nach einem höheren Rang Neid beziehungsweise eifersüchtiges Nacheifern. „Beneiden“ ist im modernen Deutsch präzise und natürlich.
- source_word: ζητήσετε
  choice: danach streben
  rationale: Gibt das zielgerichtete Suchen beziehungsweise Bemühen idiomatisch wieder.
- source_word: ὑψωθῆναι ὑπὲρ αὐτούς
  choice: über sie erhöht zu werden
  rationale: Bewahrt die Passivform des griechischen Infinitivs und den Rangvergleich mit ὑπέρ.
- source_word: οὐ ἰσχύσετε
  choice: ihr werdet euch nicht durchsetzen können
  rationale: ἰσχύω kann Stärke, Fähigkeit oder Erfolg bezeichnen. Im Konflikt um Vorrang gibt „sich durchsetzen können“ den Sinn natürlicher wieder als das missverständliche „nicht stark sein“.
theological_decisions:
- issue: Wer die angestrebte Erhöhung bewirken würde
  choice: 'Passivisch: „erhöht zu werden“'
  alternative: „euch über sie zu erheben“
  rationale: Der griechische Text nennt den Handelnden nicht. Die passive Form erhält diese Offenheit, statt eine Selbsterhöhung oder ein göttliches Handeln ausdrücklich festzulegen.
- issue: Ursächlicher Bezug von διὰ τοῦτο
  choice: „gerade deshalb“ bezieht das Scheitern auf Neid und Rangstreben
  alternative: Schlichteres „deshalb“ ohne Hervorhebung
  rationale: Die Wiederaufnahme von διὰ τοῦτο markiert den genannten Neid und das Streben nach Erhöhung als Grund dafür, dass sie sich nicht durchsetzen werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Die Satzstruktur folgt dem argumentativen Gang des Griechischen, ohne dessen durch Variantenzeichen gestörte Editionsdarstellung nachzuahmen.
