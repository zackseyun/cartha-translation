- source_word: Λευ[ί]
  choice: Levi
  rationale: Der im beschädigt überlieferten griechischen Text erkennbare Name wird in seiner üblichen deutschen Form wiedergegeben.
theological_decisions:
- issue: Verhältnis von Priestertum und Königsherrschaft
  choice: Die beiden Ämter werden Levi beziehungsweise Juda zugeordnet, ohne ihr Verhältnis näher zu deuten.
  alternative: Die Aussage christologisch, institutionell oder hierarchisch auszulegen.
  rationale: Die Übersetzung bewahrt die knappe Zuordnung der konsultierten Textfassung und fügt keine konfessionelle Deutung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Königsherrschaft“ gibt das gemeinte Königsamt beziehungsweise die Herrschaft präziser wieder als das mehrdeutige „Königreich“; „zusammen mit ihm“ bewahrt die mögliche Spannung der Zuordnung.
