source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Καὶ πρὸς τὸν⁶⁵ Λευὶ ἐγγίσατε⁶⁶ ἐν ταπεινώσει καρδίας Γὑμῶν⌉⁶⁷, ἵνα * δέξησθε εὐλογίαν⁶⁸ ἐκ τοῦ⁶⁹ στόματος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/010.yaml
  text: And draw near to Levi in humility of your heart, so that you may receive a blessing from his mouth.
translation:
  language: de
  text: Und naht euch Levi mit demütigem Herzen, damit ihr aus seinem Mund einen Segen empfangt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγγίσατε
  choice: naht euch
  rationale: Der Imperativ bezeichnet eine bewusste Annäherung; „naht euch“ bewahrt den würdevollen Ton und ist im modernen religiösen Deutsch verständlich.
- source_word: ἐν ταπεινώσει καρδίας ὑμῶν
  choice: mit demütigem Herzen
  rationale: Die griechische Wendung bezeichnet die innere Haltung der Adressaten. Die idiomatische deutsche Form gibt sowohl ταπείνωσις als auch das ausdrücklich auf die Adressaten bezogene καρδίας ὑμῶν wieder.
- source_word: δέξησθε
  choice: empfangt
  rationale: Gibt das Aufnehmen beziehungsweise Erhalten des Segens natürlich wieder und lässt die im Konjunktiv mit ἵνα ausgedrückte Zielsetzung bestehen.
- source_word: εὐλογίαν ἐκ τοῦ στόματος αὐτοῦ
  choice: aus seinem Mund Segen
  rationale: Bewahrt das Bild, dass der Segen von Levi ausgesprochen wird, ohne es erklärend aufzulösen.
theological_decisions:
- issue: Levis Rolle bei der Vermittlung des Segens
  choice: „aus seinem Mund Segen empfangt“
  alternative: „von ihm gesegnet werdet“
  rationale: Die konkrete Redeweise des Griechischen wird beibehalten; so wird weder eine bestimmte priesterliche Heilslehre hinzugefügt noch Levis ausgesprochener Segen abgeschwächt.
translation_notes:
  register: Natürliches, würdiges Standarddeutsch. „Naht euch“ ist leicht gehoben, entspricht aber dem testamentarisch-religiösen Register; „mit demütigem Herzen“ vermeidet die im Deutschen schwerfällige wörtliche Fassung „in der Demut eures Herzens“.
