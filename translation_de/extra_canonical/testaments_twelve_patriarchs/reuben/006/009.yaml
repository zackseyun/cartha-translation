  - severity: low
    issue: »Liebe erweisen« ist gegenüber ἀγάπην ἔχειν leicht interpretierend.
    rationale: ἔχειν bedeutet »haben«; »Liebe zu seinem Bruder haben« bewahrt den Zustand bzw. die Haltung der Liebe, ohne daraus ausdrücklich eine Handlung der Bekundung zu machen.
