base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/009.yaml
  text: I adjure you by the God of heaven, that each of you do truth toward his neighbor and that each have love toward his brother.
translation:
  language: de
  text: 'Ich beschwöre euch bei dem Gott des Himmels: Jeder von euch soll seinem Nächsten gegenüber wahrhaftig handeln, und jeder soll Liebe zu seinem Bruder haben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρκῶ ὑμᾶς
  choice: Ich beschwöre euch
  rationale: Gibt die feierliche, eidartige Verpflichtungsformel direkt und in würdigem modernem Deutsch wieder.
- source_word: ποιεῖν ἀλήθειαν
  choice: wahrhaftig handeln
  rationale: Die wörtliche Wendung „Wahrheit tun“ wäre im heutigen Deutsch ungewöhnlich; „wahrhaftig handeln“ bewahrt den handlungsbezogenen Sinn von ποιεῖν und den ethischen Gehalt von ἀλήθεια.
- source_word: πρὸς τὸν πλησίον αὐτοῦ
  choice: seinem Nächsten gegenüber
  rationale: Entspricht der relationalen Bedeutung von πρός und bewahrt den traditionellen, weiterhin verständlichen Begriff „Nächster“.
- source_word: ἀγάπην ἔχειν
  choice: Liebe erweisen
  rationale: Natürliches Deutsch, das Liebe als gelebte Haltung ausdrückt; das bloße „Liebe haben“ wäre weniger idiomatisch.
- source_word: πρὸς τὸν ἀδελφὸν αὐτοῦ
  choice: seinem Bruder
  rationale: Bewahrt die konkrete Verwandtschafts- beziehungsweise Gemeinschaftsbezeichnung des griechischen Textes, ohne sie interpretierend auszuweiten.
theological_decisions:
- issue: Bedeutungsumfang von ἀδελφός
  choice: Bruder
  alternative: Mitmensch / Bruder oder Schwester
  rationale: Der Ausgangstext verwendet ausdrücklich den maskulinen Singular „Bruder“. Eine inklusive Erweiterung könnte den möglichen familiären oder gemeinschaftlichen Bezug vorschnell festlegen.
- issue: Ethischer Sinn von ποιεῖν ἀλήθειαν
  choice: wahrhaftig handeln
  alternative: Wahrheit tun
  rationale: Die Formulierung bezeichnet Wahrheit als gelebtes Handeln. Die gewählte Wiedergabe erhält diesen ethischen Akzent, ohne eine im modernen Deutsch befremdliche Lehnwendung zu erzwingen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die feierliche Einleitung bleibt erhalten; der anschließende Parallelismus wird in einer klaren deutschen Soll-Konstruktion wiedergegeben.
