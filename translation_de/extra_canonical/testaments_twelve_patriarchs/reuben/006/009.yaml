  source_fidelity: Die Übersetzung gibt die feierliche Aufforderung, »Gott des Himmels«, das wahrhaftige Handeln gegenüber dem Nächsten und die Liebe gegenüber dem Bruder grundsätzlich treffend wieder. Der griechische Parallelismus hat jedoch zweimal ausdrücklich ἕκαστος (»jeder«); die zweite Nennung sollte nicht in der gemeinsamen deutschen Satzstruktur aufgehen. Zudem bedeutet ἀγάπην ἔχειν primär »Liebe haben«, während »Liebe erweisen« den Ausdruck stärker in eine konkrete Bekundung verschiebt.
  naturalness: Der Satz ist modernes, würdevolles Standarddeutsch. Eine Wiederholung von »jeder« bewahrt den Quelltext, ohne die Lesbarkeit wesentlich zu beeinträchtigen. »Liebe zu seinem Bruder haben« ist idiomatisch und semantisch näher am griechischen ἀγάπην ἔχειν.
  terminology: »Gott des Himmels«, »Nächster« und »Bruder« sind angemessen. »wahrhaftig handeln« vermittelt den ethisch-handlungsbezogenen Sinn von ποιεῖν ἀλήθειαν natürlich; eine unidiomatische wörtliche Formel wie »Wahrheit tun« ist nicht erforderlich.
