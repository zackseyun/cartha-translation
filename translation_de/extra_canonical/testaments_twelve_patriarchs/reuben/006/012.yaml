  source_fidelity: Der erste Satz gibt προσκυνήσατε, τὸ σπέρμα αὐτοῦ, ὑπὲρ ὑμῶν und die ungewöhnliche Gegenüberstellung sichtbarer und unsichtbarer Kriege treffend wieder. Im zweiten Satz steht im Griechischen jedoch kein Pronomen, das den »ewigen König« ausdrücklich mit dem zuvor genannten Nachkommen identifiziert. Die Einfügung von »er« beseitigt diese syntaktische Offenheit.
  naturalness: Die Formulierung ist modernes, würdiges Standarddeutsch. »Werft euch ... nieder« ist für die körperliche Geste klar und idiomatisch; »um euretwillen« ist leicht gehoben, aber passend.
  terminology: »Nachkomme« ist als singularische Wiedergabe von σπέρμα im Kontext vertretbar, ohne die Person zu benennen. »Ewiger König« gibt βασιλεὺς αἰώνιος direkt wieder. Die Wiedergabe von προσκυνέω vermeidet zu Recht die enger festgelegte Übersetzung »anbeten«.
