source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Καὶ προσκυνήσατε⁷⁶ * τὸ σπέρμα⁷⁷ αὐτοῦ, ὅτι⁷⁸ ὑπὲρ ὑμῶν⁷⁹ ἀποθανεῖται⁸⁰ ἐν πολέμοις ὁρατοῖς καὶ⁸¹ ἀοράτοις. καὶ * ἐν ὑμῖν ἔσται⁸² * βασιλεὺς αἰώνιος⁸³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/012.yaml
  text: And bow down to his offspring, because for your sake it will die in visible and invisible wars, and among you there will be an eternal king.
translation:
  language: de
  text: Und werft euch vor seinem Nachkommen nieder; denn um euretwillen wird er in sichtbaren und unsichtbaren Kriegen sterben. Und unter euch wird ein ewiger König sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσκυνήσατε
  choice: werft euch … nieder
  rationale: Gibt die körperliche Huldigung bzw. Verehrung des Verbs anschaulich und würdig wieder, ohne die Art der Verehrung über den Kontext hinaus festzulegen.
- source_word: τὸ σπέρμα αὐτοῦ
  choice: sein Nachkomme
  rationale: σπέρμα kann kollektiv »Nachkommenschaft« oder singularisch einen Nachkommen bezeichnen. Das anschließende ἀποθανεῖται und βασιλεὺς begünstigt hier die auf eine Person bezogene Wiedergabe.
- source_word: ὑπὲρ ὑμῶν
  choice: um euretwillen
  rationale: Bewahrt den Gedanken eines Todes zugunsten der Angesprochenen, ohne eine bestimmte Sühnetheorie einzutragen.
- source_word: ἐν πολέμοις ὁρατοῖς καὶ ἀοράτοις
  choice: in sichtbaren und unsichtbaren Kriegen
  rationale: Nahe Wiedergabe der ungewöhnlichen Formulierung; die Art der sichtbaren und unsichtbaren Kämpfe wird nicht erklärend eingeengt.
- source_word: βασιλεὺς αἰώνιος
  choice: ein ewiger König
  rationale: Direkte, idiomatische Wiedergabe von αἰώνιος im Deutschen.
theological_decisions:
- issue: Bezug des grammatisch neutralen σπέρμα und des unausgedrückten Subjekts von ἀποθανεῖται
  choice: 'Personaler Singular: »Nachkomme … er«'
  alternative: 'Kollektiv bzw. formal genusgetreu: »Nachkommenschaft … sie«'
  rationale: Obwohl σπέρμα grammatisch Neutrum ist und auch kollektiv sein kann, weist die Fortführung mit »König« auf einen einzelnen männlichen Nachkommen. Die Übersetzung macht diesen syntaktischen Bezug natürlich sichtbar, ohne ihn namentlich zu identifizieren.
- issue: Bedeutung von προσκυνέω
  choice: »sich vor jemandem niederwerfen«
  alternative: »anbeten« oder »huldigen«
  rationale: Die gewählte Formulierung erhält die mögliche Spannweite zwischen Huldigung und kultischer Verehrung und legt keine konfessionelle Deutung fest.
- issue: Verhältnis der beiden Aussagen über Nachkomme und ewigen König
  choice: Dasselbe männliche Pronomen in beiden Sätzen
  alternative: Zwei unverbundene Referenten
  rationale: Der griechische Text nennt im zweiten Satz nicht ausdrücklich ein Pronomen, doch der unmittelbare Zusammenhang legt denselben Referenten nahe. Die deutsche Form vermeidet die unnatürliche und missverständliche Wiederholung von »ein König« ohne Bezug.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Rede von sichtbaren und unsichtbaren Kriegen bleibt bewusst unverändert und wird nicht spiritualisierend erklärt.
