  to: Und werft euch vor seinem Nachkommen nieder; denn um euretwillen wird er in sichtbaren und unsichtbaren Kriegen sterben. Und unter euch wird ein ewiger König sein.
  rationale: Die explizite Rückverweisung »er« im zweiten Satz wird entfernt, damit die deutsche Fassung nicht stärker als der griechische Wortlaut festlegt, dass der Nachkomme und der ewige König ausdrücklich derselbe Referent sind. Im Übrigen ist der Entwurf quellennah und natürlich.
