source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Κἀκείνας⁸ δὲ⁹ ἐντέλλεσθε¹⁰ μὴ συνδιάζειν¹¹ τοῖς ἀνδράσιν¹², ἵνα καὶ αὐταὶ καθαρεύωσι¹³ τῇ διανοίᾳ¹⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/002.yaml
  text: And command those women likewise not to associate with men, so that they too may be pure in mind.
translation:
  language: de
  text: Und weist auch jene Frauen an, keinen Umgang mit Männern zu haben, damit auch sie in ihrem Denken rein bleiben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Κἀκείνας
  choice: auch jene Frauen
  rationale: κἀκείνας verbindet καί mit dem femininen Akkusativ Plural von ἐκεῖνος; „auch jene Frauen“ bewahrt den rückverweisenden und einschließenden Sinn.
- source_word: ἐντέλλεσθε
  choice: weist … an
  rationale: Der Imperativ bezeichnet eine verbindliche Weisung; „weist an“ ist im modernen Deutschen natürlich und wahrt den autoritativen Ton.
- source_word: μὴ συνδιάζειν τοῖς ἀνδράσιν
  choice: keinen Umgang mit Männern zu haben
  rationale: Die seltene Bildung συνδιάζειν bezeichnet hier das Zusammensein beziehungsweise den Umgang mit Männern. Die Wiedergabe vermeidet die unbelegte Verstärkung „engen“ und legt die Art des Umgangs nicht vorschnell fest.
- source_word: καθαρεύωσι τῇ διανοίᾳ
  choice: in ihrem Denken rein bleiben
  rationale: καθαρεύω bedeutet „rein sein/bleiben“, während der Dativ τῇ διανοίᾳ den Bereich der Reinheit angibt. „Denken“ gibt διάνοια verständlich wieder, ohne es auf bloßen Intellekt zu verengen.
theological_decisions:
- issue: Art des untersagten Umgangs zwischen Frauen und Männern
  choice: allgemein als „keinen Umgang … haben“ wiedergegeben
  alternative: „nicht mit Männern zusammen sein“ oder „keinen engen Umgang mit Männern haben“
  rationale: Der Kontext mag eine besondere Nähe oder Verbindung meinen, doch der Vers selbst spezifiziert diese nicht eindeutig. Daher wird weder sexuelle noch eheliche noch bloß gesellschaftliche Gemeinschaft ausdrücklich eingesetzt.
- issue: Reinheit der διάνοια
  choice: „in ihrem Denken rein bleiben“
  alternative: „reinen Sinnes sein“ oder „im Geist rein sein“
  rationale: Die Formulierung hält den ethisch-inneren Bezug offen und vermeidet, „Geist“ als technische anthropologische oder theologische Kategorie einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Satzführung. „Jene Frauen“ wahrt den griechischen Rückverweis; „Umgang“ bleibt bewusst allgemein. Keine Fußnoten erforderlich.
