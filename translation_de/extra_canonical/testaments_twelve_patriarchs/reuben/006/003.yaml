source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: '* Αἱ γὰρ συνεχεῖς συντυχίαι¹⁵, κἂν μὴ πραχθῇ¹⁶ τὸ ἀσέβημα, ὅμως αὐταῖς¹⁷ μὲν ἐστι νόσος ἀνίατος¹⁸, ἡμῖν¹⁹ δὲ * εἰς ὄλεθρον ὄνειδος Βελίαρ καὶ ὄνειδος αἰώνιον²⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/003.yaml
  text: For constant encounters, even if the ungodly act is not carried out, are nevertheless for them an incurable disease, and for us a destructive disgrace of Beliar and an everlasting reproach.
translation:
  language: de
  text: Denn die ständigen Begegnungen sind, auch wenn die gottlose Tat nicht begangen wird, für sie dennoch eine unheilbare Krankheit, für uns aber zum Verderben, zur Schande Beliars und zu ewiger Schande.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεχεῖς συντυχίαι
  choice: die ständigen Begegnungen
  rationale: Gibt sowohl die fortdauernde beziehungsweise wiederholte Art (συνεχεῖς) als auch den neutralen Sinn von συντυχίαι als Begegnungen oder Zusammentreffen wieder, ohne die Art dieser Kontakte näher festzulegen.
- source_word: τὸ ἀσέβημα
  choice: die gottlose Tat
  rationale: Bewahrt den religiös-moralischen Gehalt von ἀσέβημα und bezeichnet eine konkrete Verfehlung, ohne sie über den griechischen Wortlaut hinaus zu bestimmen.
- source_word: νόσος ἀνίατος
  choice: eine unheilbare Krankheit
  rationale: Entspricht der Krankheitsmetapher und der starken Aussage ἀνίατος, »unheilbar«.
- source_word: εἰς ὄλεθρον
  choice: ins Verderben führende
  rationale: Gibt die Ziel- oder Folgerichtung der Präpositionalfügung wieder; »Verderben« wahrt, dass ὄλεθρος sowohl Untergang als auch Vernichtung bezeichnen kann.
- source_word: ὄνειδος
  choice: Schande / Schmach
  rationale: Beide deutschen Wörter decken den Sinn von öffentlicher Beschämung und entehrendem Vorwurf ab; die Variation vermeidet eine schwerfällige unmittelbare Wiederholung, ohne den Sinnunterschied zu vergrößern.
- source_word: Βελίαρ
  choice: Beliars
  rationale: Behält die Namensform der griechischen Vorlage bei und gibt die formal genitivische Zuordnung der englischen Konsultationsschicht natürlich wieder.
theological_decisions:
- issue: Beziehung von »Beliar« zu »Schande«
  choice: Schande Beliars
  alternative: Schande für Beliar / Beliar als eigenständiges Satzglied
  rationale: Die überlieferte griechische Wortfolge ist syntaktisch schwierig. Die knappe Genitivform bewahrt die mögliche Zugehörigkeits- oder Ursprungsbeziehung, ohne Beliars Rolle dogmatisch festzulegen.
- issue: Moralische Wirkung auch ohne vollzogene Tat
  choice: Die Begegnungen bleiben selbst dann schädlich, wenn die gottlose Tat nicht begangen wird.
  alternative: Die Aussage auf eine bereits vollzogene Verfehlung beziehen.
  rationale: κἂν μὴ πραχθῇ setzt ausdrücklich den Fall voraus, dass die Tat nicht ausgeführt wird; die Spannung zwischen Absicht, Gelegenheit und Vollzug bleibt daher erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt der argumentativen Struktur des Griechischen, wird aber durch die Stellung von »selbst wenn« und »dennoch« für heutige Leser klar gegliedert. Keine geschlechtliche oder situative Präzisierung wurde ergänzt, obwohl αὐταῖς grammatisch feminin ist; »für sie« wahrt den im Vers selbst nicht ausdrücklich benannten Bezug.
