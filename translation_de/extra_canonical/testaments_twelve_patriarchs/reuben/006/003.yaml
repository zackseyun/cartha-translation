- from: Denn die ständigen Begegnungen sind, selbst wenn die gottlose Tat nicht begangen wird, für sie dennoch eine unheilbare Krankheit, für uns aber eine ins Verderben führende Schande Beliars und eine ewige Schmach.
  to: Denn die ständigen Begegnungen sind, auch wenn die gottlose Tat nicht begangen wird, für sie dennoch eine unheilbare Krankheit, für uns aber zum Verderben, zur Schande Beliars und zu ewiger Schande.
  rationale: Die Revision löst „zum Verderben“ aus der attributiven Verbindung mit „Schande“ und gibt die schwierige abschließende griechische Reihung zurückhaltender wieder. Die Wiederholung von ὄνειδος wird mit „Schande“ beibehalten. Dadurch wird keine weitergehende Aussage über die Rolle Beliars oder die genaue syntaktische Verknüpfung des problematischen griechischen Wortlauts getroffen.
