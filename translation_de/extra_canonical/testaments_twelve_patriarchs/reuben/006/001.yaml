id: T12P.REU.6.1
reference: Testament of Reuben 6:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Φυλάξατε¹ οὖν² ἀπὸ τῆς³ πορνείας, καὶ * ἔστε καθαρεύοντες⁴ τῇ διανοίᾳ. * φυλάξατε καὶ⁵ * τὰς αἰσθήσεις ὑμῶν⁶ ἀπὸ πάσης γυναικῶν⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/001.yaml
  text: Guard yourselves, therefore, from sexual immorality, and keep your mind pure. Guard also your senses from every woman.
translation:
  language: de
  text: Hütet euch also vor sexueller Unmoral und haltet euer Denken rein. Hütet auch eure Sinne vor jeder Frau.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut ist hier grammatisch unregelmäßig; möglich ist auch: „vor allen Frauen“.'
    reason: Kennzeichnet eine echte textliche beziehungsweise grammatische Unsicherheit bei πάσης γυναικῶν, statt sie stillschweigend zu beseitigen.
lexical_decisions:
- source_word: πορνείας
  choice: sexueller Unmoral
  rationale: Gibt den weiten Bedeutungsbereich von πορνεία in verständlichem, modernem Deutsch wieder, ohne ihn auf eine einzelne sexuelle Verfehlung einzuengen.
- source_word: καθαρεύοντες τῇ διανοίᾳ
  choice: haltet euer Denken rein
  rationale: Die Konstruktion mit ἔστε und Partizip fordert einen fortdauernden Zustand der Reinheit; „Denken“ gibt διανοίᾳ hier natürlich und konkret wieder.
- source_word: τὰς αἰσθήσεις ὑμῶν
  choice: eure Sinne
  rationale: Bewahrt die körperlich-wahrnehmungsbezogene Bedeutung von αἰσθήσεις und entspricht dem unmittelbaren Wortlaut.
- source_word: Φυλάξατε
  choice: Hütet euch
  rationale: Gibt den auffordernden Aoristimperativ idiomatisch wieder und passt zur anschließenden Präposition ἀπό.
theological_decisions:
- issue: Reichweite der Warnung vor Frauen
  choice: vor jeder Frau
  alternative: vor allen Frauen
  rationale: Der überlieferte griechische Ausdruck πάσης γυναικῶν ist grammatisch unregelmäßig. Die Hauptfassung folgt der im Konsultationstext vertretenen distributiven Lesart, ohne die anstößige Spannung des Wortlauts durch eine erklärende Einschränkung auf bestimmte Frauen aufzulösen.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. Die zweimalige Aufforderung „Hütet“ bildet die Wiederholung von φυλάξατε ab. Die problematische Allgemeinheit der letzten Wendung bleibt erhalten und wird lediglich textkritisch erläutert.
