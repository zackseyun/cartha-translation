base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/004.yaml
  text: For sexual immorality has within itself neither understanding nor godliness, and every jealousy dwells in its desire.
translation:
  language: de
  text: Denn die Unzucht hat weder Einsicht noch Frömmigkeit in sich, und jede Eifersucht wohnt in ihrem Verlangen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορνεία
  choice: Unzucht
  rationale: Bezeichnet hier sexuelle Unmoral als personifizierte Macht; „Unzucht“ ist knapp, würdevoll und im testamentarischen Kontext passend.
- source_word: σύνεσιν
  choice: Einsicht
  rationale: Gibt die Fähigkeit zu verständigem Urteilen natürlicher wieder als das allgemeinere „Verständnis“.
- source_word: εὐσέβειαν
  choice: Gottesfurcht
  rationale: Bezeichnet eine auf Gott ausgerichtete ehrfürchtige Frömmigkeit; „Gottesfurcht“ ist im religiös-ethischen Kontext idiomatisch, ohne eine konfessionelle Sonderlehre einzutragen.
- source_word: ζῆλος
  choice: Eifersucht
  rationale: Im Zusammenhang mit πορνεία und ἐπιθυμία liegt die negative Bedeutung „Eifersucht“ näher als „Eifer“, obwohl das griechische Wort beide Bedeutungsfelder haben kann.
- source_word: ἐπιθυμίᾳ
  choice: Verlangen
  rationale: Bewahrt den Sinn eines starken Begehrens, ohne durch „Begierde“ die Aussage unnötig stärker oder ausschließlich sexuell festzulegen.
theological_decisions:
- issue: Wiedergabe von εὐσέβεια
  choice: Gottesfurcht
  alternative: Frömmigkeit / Gottesverehrung
  rationale: Der Ausdruck bezeichnet hier eine religiös-ethische Haltung. „Gottesfurcht“ ist verständlich und konkret, ohne den Satz auf eine bestimmte konfessionelle Frömmigkeitsform festzulegen.
- issue: Personifizierung der Unzucht
  choice: Die bildhafte Rede wird mit „hat … in sich“ und „wohnt“ bewahrt.
  alternative: Abstrakte Umschreibung, etwa dass Unzucht zu Unvernunft und Eifersucht führe
  rationale: Der griechische Text stellt πορνεία und ihr Verlangen personifiziert dar; eine kausale Umschreibung würde die Aussage interpretierend glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter Personifizierung und knapper Satzstruktur. Das Semikolon verdeutlicht die enge Verbindung der beiden Aussagen.
