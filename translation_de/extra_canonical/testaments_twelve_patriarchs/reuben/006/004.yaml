  source_fidelity: Die Satzstruktur und die personifizierende Bildsprache geben ἐν ἑαυτῇ sowie κατοικεῖ ἐν τῇ ἐπιθυμίᾳ αὐτῆς sachgerecht wieder. „Einsicht“ ist eine treffende Wiedergabe von σύνεσις; „Eifersucht“ ist im gegebenen Zusammenhang eine vertretbare Wiedergabe des bedeutungsoffenen ζῆλος. „Gottesfurcht“ verschiebt εὐσέβεια jedoch hin zu Gottesfurcht bzw. Gottesangst, während εὐσέβεια primär Frömmigkeit/Gottesverehrung bezeichnet.
  naturalness: Der Satz ist in modernem, würdigem Standarddeutsch verständlich. Das Komma vor „und“ verbindet die eng aufeinander bezogenen Hauptsätze etwas natürlicher als das Semikolon, ohne die knappe Struktur zu verändern.
  terminology: „Frömmigkeit“ gibt εὐσέβεια unmittelbar und ohne zusätzliche Bedeutungsnuance wieder. „Unzucht“ ist als knapper ethisch-religiöser Terminus hier vertretbar; „Verlangen“ wahrt die nicht ausschließlich sexuelle Weite von ἐπιθυμία.
  issues:
