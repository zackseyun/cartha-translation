    issue: εὐσέβειαν ist als „Gottesfurcht“ wiedergegeben.
    rationale: „Gottesfurcht“ ist zwar religiös passend, entspricht aber semantisch eher Formulierungen mit φόβος θεοῦ. εὐσέβεια bezeichnet hier Frömmigkeit bzw. gottgefällige Haltung. „Frömmigkeit“ ist die genauere, nicht konfessionell einengende Wiedergabe.
  revised_text: Denn die Unzucht hat weder Einsicht noch Frömmigkeit in sich, und jede Eifersucht wohnt in ihrem Verlangen.
