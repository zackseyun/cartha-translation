  text: For God will execute vengeance on them, but you will die an evil death.
translation:
  language: de
  text: Denn Gott wird an ihnen Vergeltung üben; ihr aber werdet einen schlimmen Tod sterben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποιήσει τὴν ἐκδίκησιν αὐτῶν
  choice: wird an ihnen Vergeltung üben
  rationale: Die Wendung gibt den Sinn idiomatisch wieder, dass Gott die Vergeltung an ihnen vollzieht. Das Pronomen wird entsprechend der revidierten Lesart objektiv auf die Betroffenen bezogen.
- source_word: ἀποθανεῖτε θανάτῳ πονηρῷ
  choice: werdet einen schlimmen Tod sterben
  rationale: Bewahrt die semitisch gefärbte, im Griechischen ausdrücklich wiedergegebene Verbindung von Verb und verwandtem Substantiv. „Schlimm“ ist hier natürlich und lässt offen, ob vor allem ein qualvoller, verhängnisvoller oder moralisch beschämender Tod gemeint ist.
theological_decisions:
- issue: Art und Träger der Vergeltung
  choice: Gott wird an ihnen Vergeltung üben
  alternative: Gott wird ihre Rache vollziehen
  rationale: Der Kontext und die revidierte Textauffassung sprechen dafür, αὐτῶν als Ziel der göttlichen Vergeltung zu verstehen. Die Formulierung vermeidet zugleich, Gott als bloßen Vollstrecker menschlicher Rache darzustellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der adversative Gegensatz wird mit „ihr aber“ deutlich markiert; das Semikolon bildet die knappe Zweiteiligkeit des griechischen Satzes ab.
