source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Αὐτὸς γὰρ⁷⁰ εὐλογήσει τὸν Ἰσραὴλ καὶ τὸν Ἰούδαν· * ὅτι ἐν αὐτῷ⁷¹ ἐξελέξατο Κύριος⁷² βασιλεύειν⁷³ ἐνώπιον⁷⁴ * παντὸς τοῦ λαοῦ⁷⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006/011.yaml
  text: For he will bless Israel and Judah, because in him the Lord chose to reign before all the people.
translation:
  language: de
  text: Denn er wird Israel und Juda segnen; denn in ihm hat der Herr erwählt, vor dem ganzen Volk zu herrschen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Αὐτὸς
  choice: er
  rationale: Das betonte Personalpronomen wird schlicht mit „er“ wiedergegeben; der Bezug ergibt sich aus dem vorausgehenden Kontext.
- source_word: εὐλογήσει
  choice: wird … segnen
  rationale: Das Futur wird formal und idiomatisch wiedergegeben.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Die Präpositionalwendung bleibt bewusst wörtlich und in ihrer möglichen instrumentalen, lokalen oder repräsentativen Nuance offen.
- source_word: ἐξελέξατο
  choice: hat … erwählt
  rationale: Das Medium des Aorists bezeichnet die eigene Wahlentscheidung des Herrn; „erwählt“ bewahrt den feierlichen biblischen Sprachgebrauch.
- source_word: βασιλεύειν
  choice: zu herrschen
  rationale: Der Infinitiv bezeichnet königliche Herrschaft; „herrschen“ klingt im Deutschen natürlicher als „König zu sein“, ohne das Königtum abzuschwächen.
- source_word: ἐνώπιον παντὸς τοῦ λαοῦ
  choice: vor dem ganzen Volk
  rationale: Die räumlich-öffentliche Bedeutung von ἐνώπιον wird knapp und natürlich wiedergegeben.
theological_decisions:
- issue: Subjekt des Herrschens in der Verbindung ἐν αὐτῷ … βασιλεύειν
  choice: Der Herr ist grammatisch das Subjekt von „zu herrschen“, während „in ihm“ unverändert stehen bleibt.
  alternative: „Denn ihn hat der Herr erwählt, vor dem ganzen Volk zu herrschen.“
  rationale: Der griechische Wortlaut sagt wörtlich, dass der Herr „in ihm erwählte, zu herrschen“. Eine Umdeutung des Erwählten zum ausdrücklichen Subjekt des Herrschens würde die syntaktische und theologische Spannung glätten.
translation_notes:
  register: Moderne, würdige Standardsprache mit enger Bindung an die griechische Syntax. Die auffällige Formulierung „in ihm hat der Herr erwählt, … zu herrschen“ wird trotz ihrer leichten Fremdheit bewahrt, damit die genuine Mehrdeutigkeit nicht stillschweigend aufgelöst wird.
