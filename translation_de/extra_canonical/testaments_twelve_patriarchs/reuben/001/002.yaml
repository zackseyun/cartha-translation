  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/002.yaml
  text: Two years after the death of Joseph his brother, when Reuben had fallen sick, his sons and the sons of his sons gathered to visit him.
translation:
  language: de
  text: Zwei Jahre nach dem Tod Josefs, seines Bruders, erkrankte Ruben. Seine Söhne und die Söhne seiner Söhne versammelten sich, um ihn zu besuchen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ ἔτη δύο τῆς τελευτῆς
  choice: Zwei Jahre nach dem Tod
  rationale: Gibt die zeitliche Konstruktion natürlich und genau wieder; τελευτή bezeichnet hier den Tod.
- source_word: ἀρρωστήσαντος Ῥουβήμ
  choice: wurde Ruben krank
  rationale: Die genitivische Umstandsangabe wird im Deutschen zur besseren Lesbarkeit als eigener Hauptsatz wiedergegeben.
- source_word: συνήχθησαν
  choice: versammelten sich
  rationale: Bewahrt die Bedeutung des gemeinsamen Zusammenkommens, ohne unnötig eine passivische Form anzunehmen.
- source_word: υἱοὶ αὐτοῦ καὶ υἱοὶ τῶν υἱῶν αὐτοῦ
  choice: seine Söhne und seine Enkel
  rationale: Das natürliche deutsche Wort „Enkel“ entspricht der wörtlichen Wendung „Söhne seiner Söhne“ und vermeidet Schwerfälligkeit.
- source_word: ἐπισκέψασθαι αὐτόν
  choice: um ihn zu besuchen
  rationale: Gibt den Zweck des Zusammenkommens idiomatisch wieder.
