review_pass:
  verdict: approve
  source_fidelity: 'Die Übersetzung gibt alle Sinnelemente des griechischen Titels genau wieder: Ἀντίγραφον als „Abschrift“, διαθήκη im werkspezifischen Sinn als „Testament“, ὅσα als zusammenfassendes „was“, ἐνετείλατο als verbindliches „auftrug“, die Vorzeitigkeit des Todes sowie die Altersangabe im 125. Lebensjahr. Die Formulierung vermeidet eine unbegründete Umdeutung der Jahreszahl in ein bereits vollendetes Alter.'
  naturalness: '„Abschrift des Testaments Rubens: was er seinen Söhnen auftrug, bevor er starb, im einhundertfünfundzwanzigsten Jahr seines Lebens“ ist im Deutschen klar, würdig und für eine Überschrift beziehungsweise ein Incipit angemessen. Der Doppelpunkt gliedert die nominale Titelkonstruktion natürlich.'
  terminology: „Testament“ ist sowohl als etablierte Werksbezeichnung als auch für διαθήκη in diesem literarischen Kontext passend. „Rubens“ und „seinen Söhnen“ sind idiomatisch und korrekt. Es bestehen keine theologischen oder namensbezogenen Probleme.
