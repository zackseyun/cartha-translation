  text: A copy of the testament of Reuben, what he commanded his sons before he died, in the one hundred and twenty-fifth year of his life.
translation:
  language: de
  text: 'Abschrift des Testaments Rubens: was er seinen Söhnen auftrug, bevor er starb, im einhundertfünfundzwanzigsten Jahr seines Lebens.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: Abschrift
  rationale: Bezeichnet eine Kopie beziehungsweise schriftliche Wiedergabe und wird im Deutschen präzise und natürlich mit „Abschrift“ wiedergegeben.
- source_word: διαθήκης
  choice: Testaments
  rationale: Im Titelzusammenhang bezeichnet das Wort die letztwillige Unterweisung Rubens; „Testament“ bewahrt zugleich die etablierte Bezeichnung der Schrift.
- source_word: ἐνετείλατο
  choice: auftrug
  rationale: Gibt den verbindlichen Charakter der Anweisungen wieder, ohne das im heutigen Deutsch leicht rechtlich verengte „befahl“ zu wählen.
- source_word: πρὶν ἢ ἀποθανεῖν αὐτόν
  choice: bevor er starb
  rationale: Eine natürliche deutsche Wiedergabe der zeitlichen Infinitivkonstruktion.
- source_word: ἐν ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: im einhundertfünfundzwanzigsten Jahr seines Lebens
  rationale: Bewahrt die antike Altersangabe als Lebensjahr, statt sie interpretierend in ein vollendetes Alter umzuwandeln.
theological_decisions: []
