  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/006.yaml
  text: And behold, today I call the God of heaven to witness against you, that you not walk in the ignorance of youth and in sexual immorality, in which I was swept away and defiled the bed of my father Jacob.
translation:
  language: de
  text: Und seht, heute rufe ich den Gott des Himmels als Zeugen gegen euch an, damit ihr nicht in jugendlicher Unwissenheit und sexueller Unmoral lebt. In diese wurde ich hineingerissen und befleckte das Bett meines Vaters Jakob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιμαρτύρομαι ὑμῖν τὸν Θεὸν
  choice: ich rufe den Gott … als Zeugen gegen euch an
  rationale: Gibt die feierliche Bekräftigungs- und Warnformel wieder; der Dativ ὑμῖν wird im Kontext als gegen die Angeredeten gerichtetes Zeugnis verstanden.
- source_word: πορευθῆτε
  choice: lebt
  rationale: Das wörtliche Bild des Gehens bezeichnet hier die Lebensführung; „lebt“ ist im modernen Deutsch natürlich und sachlich genau.
- source_word: ἀγνοίᾳ νεότητος
  choice: jugendlicher Unwissenheit
  rationale: Bewahrt die Verbindung von mangelnder Einsicht und Jugend, ohne sie entschuldigend als bloße Unerfahrenheit abzuschwächen.
- source_word: πορνείᾳ
  choice: sexueller Unmoral
  rationale: Bezeichnet unerlaubtes sexuelles Verhalten allgemein; „sexuelle Unmoral“ wahrt den breiten Bedeutungsumfang.
- source_word: ἐξεχύθην
  choice: ließ ich mich hinreißen
  rationale: Die wörtliche Bedeutung „wurde ich ausgegossen/strömte ich aus“ ergibt hier ein Bild ungehemmten Sich-Ergehens; die idiomatische Wiedergabe vermittelt den Kontrollverlust, ohne eine unklare deutsche Metapher zu erzeugen.
- source_word: ἐμίανα κοίτην
  choice: befleckte das Bett
  rationale: Bewahrt sowohl das kultisch-moralische Gewicht von μιαίνω als auch das konkrete sexuelle Bild von κοίτη.
theological_decisions:
- issue: Reubens Verantwortlichkeit trotz passiver Verbform ἐξεχύθην
  choice: ließ ich mich hinreißen
  alternative: wurde ich fortgerissen
  rationale: Die reflexive Form wahrt das Moment des Überwältigtwerdens, lässt Reuben aber als handelndes und verantwortliches Subjekt der anschließenden Befleckung erkennen.
- issue: Reichweite von πορνεία
  choice: sexuelle Unmoral
  alternative: Unzucht
  rationale: Die gewählte Formulierung ist gegenwärtig verständlich und legt den Begriff nicht unnötig auf eine engere konfessionelle oder rechtliche Kategorie fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Aufmerksamkeitspartikel ἰδού wird mit „seht“ wiedergegeben; die feierliche Zeugnisformel bleibt erhalten. Der lange griechische Satz ist zur besseren Verständlichkeit in zwei Sätze gegliedert.
