  text: And I tell you that he struck me with a severe blow on my loins for seven months; and if my father Jacob had not prayed to the Lord for me, the Lord would have destroyed me.
translation:
  language: de
  text: 'Und ich sage euch: Er fügte mir an den Lenden eine schwere Verletzung zu, die sieben Monate anhielt. Und wenn mein Vater Jakob nicht für mich zum Herrn gebetet hätte, hätte der Herr mich vernichtet.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπληξέ με πληγῇ μεγάλῃ
  choice: Er schlug mich mit einer schweren Plage
  rationale: Die Verbindung aus dem Verb πλήσσω und dem verwandten Substantiv πληγή bezeichnet eine schwere Heimsuchung oder körperliche Plage; die Wiedergabe bewahrt das Bild des Schlagens, ohne im Deutschen unnatürlich zu verdoppeln.
- source_word: ἐπὶ τῆς λαγόνος μου
  choice: an meinen Lenden
  rationale: λαγών kann Flanke, Seite oder Lendengegend bezeichnen. „Lenden“ entspricht hier dem körperlichen Bereich und bewahrt die gewisse anatomische Unschärfe des Griechischen.
- source_word: ἕως μῆνας ἑπτά
  choice: die sieben Monate anhielt
  rationale: Die knappe griechische Zeitangabe wird idiomatisch auf die Plage bezogen; gemeint ist ihre Dauer von sieben Monaten.
- source_word: ἀνελεῖν με
  choice: mich vernichtet
  rationale: ἀναιρέω bezeichnet hier das Beseitigen beziehungsweise Töten; „vernichten“ gibt die ernste, endgültige Bedrohung würdig wieder.
theological_decisions:
- issue: Subjekt von ἔπληξέ und Verhältnis zur späteren Nennung des Herrn
  choice: Das ungenannte männliche Subjekt bleibt mit „Er“ erhalten; der Herr wird erst im folgenden Satz ausdrücklich genannt.
  alternative: „Der Herr schlug mich …“
  rationale: Der griechische Satz nennt beim ersten Verb kein ausdrückliches Subjekt. Obwohl der Kontext wahrscheinlich auf den Herrn weist, soll diese grammatische Implizitheit nicht stillschweigend aufgelöst werden.
- issue: Irreales Konditional mit ἤθελε … ἀνελεῖν
  choice: „hätte der Herr mich vernichtet“
  alternative: „hätte der Herr mich vernichten wollen“
  rationale: ἤθελε mit Infinitiv kann idiomatisch eine eingetretene beziehungsweise unmittelbar bevorstehende Folge ausdrücken. Die gewählte Form gibt den kontrafaktischen Sinn natürlich wieder, ohne einen gesonderten theologischen Akzent auf einen bloßen Willensentschluss zu legen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht feierliche Wendung „Und ich sage euch“ passt zur testamentarischen Rede; Satzbau und Zeitverhältnisse bleiben zugleich für heutige Leser klar.
