id: T12P.REU.1.8
reference: Testament of Reuben 1:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 8. Ἤμην γὰρ⁵⁸ ἐτῶν τριάκοντα ὅτε ἔπραξα τὸ πονηρὸν ἐνώπιον Κυρίου⁵⁹. καὶ ἐμαλακίσθην *μῆνας ἑπτὰ⁶⁰ ἕως θανάτου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/008.yaml
  text: For I was thirty years old when I did evil before the Lord, and for seven months I was weakened to the point of death.
translation:
  language: de
  text: Denn ich war dreißig Jahre alt, als ich vor dem Herrn Böses tat; und sieben Monate lang war ich bis an den Tod geschwächt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πονηρόν
  choice: Böses
  rationale: Die substantivierte Form bezeichnet hier das Böse beziehungsweise eine böse Tat. „Böses tat“ gibt die Wendung im Deutschen natürlich wieder, ohne sie unnötig zu konkretisieren.
- source_word: ἐνώπιον Κυρίου
  choice: vor dem Herrn
  rationale: 'Entspricht der räumlich-bildhaften und zugleich wertenden Bedeutung: Die Tat geschah in den Augen beziehungsweise in der Gegenwart des Herrn.'
- source_word: ἐμαλακίσθην
  choice: war ich … geschwächt
  rationale: Die passive Form bezeichnet körperliche Entkräftung oder Schwächung; die Übersetzung wahrt das Passiv und vermeidet eine spezifischere Diagnose.
- source_word: μῆνας ἑπτά
  choice: sieben Monate lang
  rationale: Die Akkusativform gibt die Zeitdauer an; „lang“ macht diese Funktion im Deutschen eindeutig.
- source_word: ἕως θανάτου
  choice: bis an den Tod
  rationale: Die feste deutsche Wendung bewahrt die starke Grenzaussage des Griechischen, ohne ausdrücklich festzulegen, ob der Tod tatsächlich eintrat.
theological_decisions:
- issue: Charakterisierung der Sünde
  choice: Böses tat
  alternative: das Böse tat / eine böse Tat beging
  rationale: Die Formulierung bewahrt die allgemeine moralische Wertung von τὸ πονηρόν und legt weder eine metaphysische Bedeutung noch eine im Vers selbst nicht genannte konkrete Tat fest.
- issue: Reichweite von ἕως θανάτου
  choice: bis an den Tod
  alternative: dem Tod nahe / bis zum Tod
  rationale: „Bis an den Tod“ erhält die mögliche Bedeutung einer lebensbedrohlichen Schwächung und vermeidet die widersinnige Festlegung, Reuben sei tatsächlich gestorben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt der griechischen Begründungsstruktur, klingt aber natürlich; das Semikolon trennt Tat und Folge klar.
