  source_fidelity: Die Übersetzung gibt die griechische Begründung γάρ, das Alter, τὸ πονηρόν als allgemein gehaltene böse Tat, ἐνώπιον Κυρίου sowie die siebenmonatige lebensbedrohliche Schwächung zuverlässig wieder. „Bis an den Tod“ bewahrt die Grenzaussage von ἕως θανάτου, ohne fälschlich den tatsächlichen Tod Reubens zu behaupten.
