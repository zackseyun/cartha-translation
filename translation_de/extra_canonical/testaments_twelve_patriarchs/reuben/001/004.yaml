  text: Then, seeing Judah and Gad and Asher there, his brothers, he said to them, “Raise me up, so that I may tell my brothers and my children the things hidden in my heart; for behold, even now I am passing away.”
translation:
  language: de
  text: 'Als er dort seine Brüder Juda, Gad und Ascher sah, sagte er zu ihnen: »Richtet mich auf, damit ich meinen Brüdern und meinen Kindern sagen kann, was in meinem Herzen verborgen ist; denn siehe, jetzt vergehe ich.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰδὼν
  choice: Als er … sah
  rationale: Das aoristische Partizip wird als natürlicher deutscher Temporalsatz wiedergegeben.
- source_word: Ἀναστήσατέ με
  choice: Richtet mich auf
  rationale: Bewahrt die konkrete Aufforderung im Sterbelager; gemeint ist, ihn körperlich aufzurichten.
- source_word: ὅσα ἔχω ἐν τῇ καρδίᾳ μου κρυπτά
  choice: was in meinem Herzen verborgen ist
  rationale: Gibt die idiomatische Bedeutung natürlich wieder, ohne den Inhalt näher zu bestimmen.
- source_word: ἐκλείπω
  choice: scheide ich dahin
  rationale: Im Sterbekontext bezeichnet das Verb das Erlöschen beziehungsweise Hinscheiden; die Formulierung ist würdevoll und verständlich.
