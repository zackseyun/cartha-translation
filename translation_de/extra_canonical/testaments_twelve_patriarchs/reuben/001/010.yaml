  - severity: medium
    issue: Der Schlusssatz legt den Bezug von οἷα zu stark auf die Sünde fest
    rationale: Die Formulierung „wie es eine solche in Israel noch nicht gegeben hatte“ ergänzt ausdrücklich „Sünde“ und bestimmt damit einen im griechischen Vergleich nicht völlig eindeutig ausgedrückten Bezug. Eine unpersönliche Formulierung bewahrt die Ambiguität.
