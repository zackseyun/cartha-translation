source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: 10. Καὶ⁶⁴ οἶνον καὶ σίκερα οὐκ ἔπιον, καὶ κρέας⁶⁵ οὐκ εἰσῆλθεν *ἐν τῷ στόματί⁶⁶ μου· καὶ πᾶν⁶⁷ ἄρτον ἐπι- θυμίας⁶⁸ οὐκ ἔφαγον⁶⁹ *ἀλλ᾽ ἤμην⁷⁰ πενθῶν ἐπὶ τῇ ἁμαρτίᾳ μου⁷¹, μεγάλη γὰρ ἦν, *οἷα οὐ γέγονεν ἐν Ἰσραὴλ οὕτως⁷².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/010.yaml
  text: And I drank no wine or strong drink, and no meat entered my mouth, and I ate no bread of desire; but I was mourning over my sin, for it was great, such as had not happened in Israel.
translation:
  language: de
  text: 10 Ich trank weder Wein noch Rauschtrank[a], kein Fleisch kam in meinen Mund, und ich aß kein begehrenswertes Brot[b]. Vielmehr trauerte ich über meine Sünde; denn sie war groß – so etwas hatte es in Israel noch nie gegeben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: starkes Getränk; gemeint ist ein berauschendes Getränk neben Wein.'
    reason: σίκερα bezeichnet allgemein ein berauschendes Getränk und nicht zwingend eine bestimmte Sorte.
  - marker: b
    text: 'Wörtlich: kein Brot des Verlangens.'
    reason: Der ungewöhnliche griechische Ausdruck kann begehrenswertes oder begehrtes Brot beziehungsweise Speise bezeichnen; die Hauptfassung gibt ihn verständlich wieder.
lexical_decisions:
- source_word: σίκερα
  choice: Rauschtrank
  rationale: Bezeichnet ein berauschendes Getränk neben Wein; „Rauschtrank“ wahrt diese Unterscheidung, ohne eine bestimmte Getränkeart vorauszusetzen.
- source_word: κρέας
  choice: Fleisch
  rationale: Die übliche und kontextuell klare Entsprechung für Fleisch als Speise.
- source_word: πᾶν ἄρτον ἐπιθυμίας
  choice: keinerlei Brot, nach dem mich verlangte
  rationale: Gibt den semitisch wirkenden Ausdruck „Brot des Verlangens“ in natürlichem Deutsch wieder und bewahrt den Gedanken des freiwilligen Verzichts auf begehrte Speise.
- source_word: πενθῶν
  choice: trauerte
  rationale: Drückt anhaltende Trauer beziehungsweise Buße über die eigene Sünde aus, ohne eine zusätzliche religiöse Praxis in den Text einzutragen.
theological_decisions:
- issue: Bezug des Vergleichs οἷα οὐ γέγονεν ἐν Ἰσραήλ
  choice: „wie es eine solche in Israel noch nicht gegeben hatte“ bezieht sich auf die Sünde.
  alternative: 'Unpersönlich: „wie es in Israel noch nie geschehen war“'
  rationale: Das feminine οἷα kann auf die feminine ἁμαρτία zurückweisen. Die Formulierung macht diesen naheliegenden Bezug sichtbar, ohne Art oder genaue Tragweite der Sünde näher zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Verzichtsaussagen bleiben erhalten; die semitisch anmutende Wendung beim Brot wird im Haupttext verständlich formuliert und in der Fußnote wörtlich dokumentiert.
