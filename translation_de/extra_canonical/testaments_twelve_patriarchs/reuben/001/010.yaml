  verdict: revise
  source_fidelity: 'Die Verzichtsaussagen geben οἶνον καὶ σίκερα, κρέας und die Trauer über die eigene Sünde sachgerecht wieder. Die Wendung πᾶν ἄρτον ἐπιθυμίας wird im Entwurf jedoch grammatisch fehlerhaft und etwas zu frei wiedergegeben. Der abschließende Vergleich οἷα οὐ γέγονεν ἐν Ἰσραήλ sollte nicht ausdrücklich auf „eine solche [Sünde]“ festgelegt werden: Die griechische Formulierung lässt den genauen Bezug offener.'
  naturalness: „nach dem mich verlangte“ ist im modernen Standarddeutsch nicht idiomatisch; erforderlich wäre etwa „wonach es mich verlangte“. Eine Formulierung mit „begehrenswertem Brot“ ist zugleich natürlich und nahe am ungewöhnlichen griechischen Ausdruck. Der Schlusssatz ist mit „so etwas hatte es in Israel noch nie gegeben“ flüssig und wahrt die Offenheit des Ausgangstextes.
  terminology: „Rauschtrank“ ist als Wiedergabe von σίκερα tragfähig und wird durch die Fußnote angemessen erläutert. „Fleisch“ und „Sünde“ sind korrekt. Die Fußnote zu ἄρτος ἐπιθυμίας sollte den wörtlichen Ausdruck nennen, ohne dessen Sinn auf eine einzige Deutung einzuengen.
