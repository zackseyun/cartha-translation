base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/003.yaml
  text: And he said to them, “My children, behold, I am dying and going the way of my fathers.”
translation:
  language: de
  text: 'Und er sagte zu ihnen: „Meine Kinder, seht, ich sterbe und gehe den Weg meiner Väter.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέκνα μου
  choice: Meine Kinder
  rationale: Gibt die direkte, familiäre Anrede natürlich und inhaltlich genau wieder.
- source_word: ἰδοὺ
  choice: seht
  rationale: Bewahrt den aufmerksamkeitslenkenden Imperativ des griechischen Ausdrucks in verständlichem, würdevollem Deutsch.
- source_word: ἀποθνήσκω
  choice: ich sterbe
  rationale: Das Präsens bezeichnet hier den unmittelbar bevorstehenden beziehungsweise bereits einsetzenden Tod.
- source_word: πορεύομαι ὁδὸν τῶν πατέρων μου
  choice: gehe den Weg meiner Väter
  rationale: Erhält das griechische Weg-Bild und dessen idiomatische Bedeutung für das Sterben, ohne es erklärend aufzulösen.
theological_decisions:
- issue: Bildhafte Rede vom Tod als Weg der Väter
  choice: Das Bild wird wörtlich als „den Weg meiner Väter gehen“ bewahrt.
  alternative: „Ich folge meinen Vätern in den Tod“ oder „ich gehe zu meinen Vätern“.
  rationale: Der griechische Text spricht vom Weg der Väter; die gewählte Fassung wahrt diese Bildsprache und vermeidet zusätzliche Aussagen über Ziel oder Jenseitsvorstellungen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem, leicht feierlichem Ton. Die knappe Parallelstruktur des Griechischen bleibt erhalten.
