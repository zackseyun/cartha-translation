    issue: Die Wendung „aus dem festen Entschluss meiner Seele“ verschiebt die Funktion von ἐν.
    rationale: ἐν προαιρέσει ψυχῆς μου beschreibt die Haltung bzw. Entschlossenheit, in der die Umkehr geschieht. „Aus“ kann im Deutschen stärker einen Beweggrund oder Ursprung ausdrücken. „Mit“ wahrt die modale Beziehung direkter.
  revised_text: Und danach tat ich sieben Jahre lang mit dem festen Entschluss meiner Seele vor dem Herrn Buße.
