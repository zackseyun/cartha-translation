  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001/009.yaml
  text: And after this, with the resolve of my soul, I repented before the Lord for seven years.
translation:
  language: de
  text: Und danach tat ich sieben Jahre lang mit dem festen Entschluss meiner Seele vor dem Herrn Buße.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετὰ τοῦτο
  choice: danach
  rationale: Gibt die zeitliche Folge knapp und natürlich wieder.
- source_word: ἐν προαιρέσει ψυχῆς μου
  choice: aus dem festen Entschluss meiner Seele
  rationale: προαίρεσις bezeichnet hier eine bewusste innere Willensentscheidung; die Formulierung bewahrt zugleich das ausdrückliche ψυχῆς μου.
- source_word: ἑπτὰ ἔτη
  choice: sieben Jahre lang
  rationale: Die Dauerangabe wird im Deutschen idiomatisch mit „lang“ ausgedrückt.
- source_word: μετενόησα
  choice: tat ich … Buße
  rationale: Das Verb bezeichnet eine tiefgreifende Umkehr beziehungsweise Reue; „Buße tun“ passt zum würdigen religiösen Register, ohne eine konkrete Bußleistung zu unterstellen.
- source_word: ἐνώπιον Κυρίου
  choice: vor dem Herrn
  rationale: Entspricht der räumlich-relationalen Wendung und bewahrt die traditionelle Gottesbezeichnung ohne einen im Griechischen fehlenden Artikel einzuführen.
theological_decisions:
- issue: Bedeutungsumfang von μετενόησα
  choice: tat ich … Buße
  alternative: bereute ich / kehrte ich um
  rationale: „Buße tun“ hält Reue und Umkehr zusammen. Die Zeitangabe beschreibt den anhaltenden Vollzug über sieben Jahre, nicht zwingend eine kirchlich geregelte Bußpraxis.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung verbindet die siebenjährige Dauer eindeutig mit der Buße; „fester Entschluss“ verdeutlicht die willentliche Entschiedenheit des griechischen Ausdrucks.
