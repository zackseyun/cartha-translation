  source_fidelity: 'Die Grundbedeutung ist zutreffend wiedergegeben: μετὰ τοῦτο („danach“), die siebenjährige Dauer, μετενόησα im Bereich von Umkehr/Buße und ἐνώπιον Κυρίου („vor dem Herrn“). Die Präposition ἐν bezeichnet bei προαιρέσει jedoch am ehesten die begleitende innere Haltung bzw. bewusste Entschlossenheit, nicht den Grund oder Ursprung der Buße.'
  naturalness: Der Satz ist verständlich und im würdigen modernen Standarddeutsch gut lesbar. „Mit dem festen Entschluss meiner Seele“ bildet die modale Funktion von ἐν unmittelbarer ab als „aus dem festen Entschluss meiner Seele“ und bleibt dabei sprachlich vertretbar.
  terminology: „Buße tun“ ist als traditionsbewusste, nicht konfessionell festgelegte Wiedergabe von μετενόησα geeignet. „Herr“ gibt Κύριος angemessen wieder. „Festen“ ist eine leichte explizierende Verstärkung von προαίρεσις, aber im Zusammenhang einer willentlichen inneren Entscheidung vertretbar.
  issues:
