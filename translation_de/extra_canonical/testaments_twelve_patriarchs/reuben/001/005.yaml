  text: And rising up, he kissed them and said to them, “Hear, my brothers and my sons; listen to Reuben your father in what I command you.”
translation:
  language: de
  text: 'Und er stand auf, küsste sie und sagte zu ihnen: »Hört, meine Brüder und meine Söhne! Hört auf Ruben, euren Vater, bei allem, was ich euch gebiete.«'
