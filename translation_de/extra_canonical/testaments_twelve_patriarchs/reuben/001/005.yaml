lexical_decisions:
- source_word: ἀναστάς
  choice: er stand auf
  rationale: Gibt das temporale Partizip natürlich und nah am griechischen Wortlaut wieder.
- source_word: κατεφίλησεν
  choice: küsste sie
  rationale: Im Kontext bezeichnet das Verb ein herzliches Küssen; im Deutschen genügt das unmarkierte »küsste«, ohne eine nicht ausdrücklich genannte Intensität hinzuzufügen.
- source_word: Ἀκούσατε
  choice: Hört
  rationale: Bewahrt den direkten Imperativ des griechischen Verbs.
- source_word: ἐνωτίσασθε
  choice: Hört auf
  rationale: Gibt den zweiten, verstärkenden Hörappell idiomatisch wieder und bezeichnet aufmerksames, befolgendes Zuhören.
- source_word: ὅσα ἐντέλλομαι ὑμῖν
  choice: bei allem, was ich euch gebiete
  rationale: Bewahrt Umfang und Verbindlichkeit von ὅσα und ἐντέλλομαι in natürlichem Deutsch.
