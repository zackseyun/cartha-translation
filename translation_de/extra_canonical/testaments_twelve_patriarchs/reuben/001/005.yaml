  source_fidelity: 'Der Entwurf gibt die Abfolge und den Sinn des griechischen Textes zuverlässig wieder: Das temporale Partizip ἀναστάς ist angemessen als „Und er stand auf“ erfasst, κατεφίλησεν als „küsste sie“, und die beiden Hörappelle (Ἀκούσατε; ἐνωτίσασθε) bleiben als rhetorische Wiederholung erhalten. „bei allem, was ich euch gebiete“ gibt ὅσα ἐντέλλομαι ὑμῖν sachgerecht wieder, ohne den Umfang der Aufforderung einzuschränken.'
