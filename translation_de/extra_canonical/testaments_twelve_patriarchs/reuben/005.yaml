base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/005.yaml
  text: 1[a]. For women are evil, my children; and because they do not have authority or power over a man, they scheme by their appearance how they may draw him to themselves. 2. And the one whom they are not able to enchant by appearance, him they overcome through deceit. 3[b]. For an angel of God also told me concerning them and taught me that women are overcome by the spirit of sexual immorality more than a man, and in their heart they devise things against men; and by adornment they lead their minds astray, and through a glance they sow the poison, and first in thought and then by the act they take captive. 4. For a woman is not able to force a man openly, but by a harlot's manner she acts craftily against him. 5. Therefore flee sexual immorality, my children, and command your wives and your daughters not to adorn their heads and their faces for the deception of the mind; for every woman who uses deceit in these things is reserved for eternal punishment. 6. For in this way they also
    charmed the Watchers before the flood; for as they kept looking at them continually, they also came to be in desire for them, and they conceived the deed in their mind; for they were changing themselves into the form of men and appearing to them while they were with their husbands. 7. And they also, desiring in their minds their appearance, gave birth to giants[d][c]. For the Watchers appeared to them as reaching up to heaven.
translation:
  language: de
  text: '1[a] Denn die Frauen sind böse, meine Kinder. Weil sie keine Vollmacht oder Macht über den Mann haben, greifen sie durch ihr Äußeres zu Täuschung, um ihn an sich zu ziehen. 2 Wen sie durch ihr Äußeres nicht zu betören vermögen, den überwältigen sie durch Täuschung. 3 Denn auch ein Engel Gottes sprach zu mir über sie und lehrte mich, dass Frauen dem Geist der sexuellen Unmoral stärker unterliegen als der Mann. In ihrem Herzen ersinnen sie Dinge gegen die Männer; durch Schmuck führen sie deren Gedanken in die Irre, und durch den Blick säen sie das Gift ein. Zuerst tun sie dies im Denken, dann nehmen sie sie durch die Tat gefangen. 4 Denn eine Frau kann einen Mann nicht offen zwingen, sondern überlistet ihn durch hurenhaftes Auftreten. 5 Darum flieht die sexuelle Unmoral, meine Kinder, und gebietet euren Frauen und euren Töchtern, ihre Köpfe und Gesichter nicht zur Täuschung des Sinnes zu schmücken. Denn jede Frau, die sich dabei der Täuschung bedient, wird für die ewige Strafe verwahrt.

    6 Auf diese Weise betörten sie nämlich auch die Wächter[b] vor der Sintflut. Denn die Wächter sahen sie unablässig an, gerieten dadurch in Verlangen nach ihnen und fassten die Tat in Gedanken. Sie verwandelten sich nämlich in die Gestalt eines Mannes und erschienen den Frauen, während diese mit ihren Männern verkehrten. 7 Und die Frauen begehrten in Gedanken ihre Erscheinung und gebaren Riesen.[c] Denn die Wächter erschienen ihnen, als reichten sie bis an den Himmel.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „durch ihre äußere Gestalt“. Das griechische Wort in den Versen 1–2 kann das Aussehen, die Gestalt oder das Auftreten bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: „Wächter“ bezeichnet himmlische Wesen aus jüdischen Überlieferungen über die Zeit vor der Sintflut; vgl. die spätere Auslegung von 1. Mose 6, besonders im 1. Henochbuch.
    reason: cross_reference
  - marker: c
    text: Die Darstellung in den Versen 6–7 folgt einer ausgeprägten Auslegungstradition über die Wächter, ihr Begehren und die Geburt der Riesen.
    reason: cultural_note
  - marker: d
    text: 'Die Schlusswendung kann übertreibend gemeint sein: Die Wächter erschienen den Frauen, als ragten sie bis zum Himmel empor.'
    reason: lexical_alternative
lexical_decisions:
- source_word: πονηραί
  choice: böse
  rationale: Bewahrt die schroffe moralische Aussage des griechischen Textes, ohne sie abzuschwächen.
- source_word: σχήμασιν / τοῦ σχήματος
  choice: durch ihr Äußeres
  rationale: Gibt im Zusammenhang die sichtbare Erscheinung beziehungsweise Selbstdarstellung wieder; die weitere Bedeutungsbreite wird in Fußnote [a] kenntlich gemacht.
- source_word: δολιεύονται
  choice: greifen sie zu Täuschung
  rationale: Drückt das fortgesetzte listige Vorgehen natürlich aus, ohne es mit μηχανῶνται gleichzusetzen.
- source_word: καταγοητεῦσασθαι
  choice: betören
  rationale: Bewahrt den starken Sinn eines bezaubernden oder verführerischen Einflusses in idiomatischem Deutsch.
- source_word: ἡττῶνται τῷ πνεύματι τῆς πορνείας
  choice: dem Geist der sexuellen Unmoral stärker unterliegen
  rationale: Erhält sowohl das Unterliegen unter eine Macht als auch die ausdrücklich geistliche beziehungsweise personifizierende Ausdrucksweise.
- source_word: ἐν καρδίᾳ μηχανῶνται
  choice: in ihrem Herzen ersinnen sie Dinge
  rationale: Bewahrt den inneren Vorgang des Planens und die Rede vom Herzen, ohne eine im Objekt nicht ausdrücklich genannte Präzisierung einzutragen.
- source_word: διὰ τῆς κοσμήσεως
  choice: durch Schmuck
  rationale: Gibt das konkrete Mittel knapp und verständlich wieder.
- source_word: διὰ τοῦ βλέμματος τὸν ἰὸν ἐνσπείρουσι
  choice: durch den Blick säen sie das Gift ein
  rationale: Erhält das eindringliche Bild des eingesäten Gifts.
- source_word: Ἐγρήγοροι
  choice: Wächter
  rationale: Behält die traditionelle Bezeichnung der himmlischen Wesen aus der frühjüdischen Überlieferung bei.
- source_word: συνεφαίνοντο αὐταῖς
  choice: erschienen ihnen
  rationale: Folgt dem Erscheinungsmotiv des griechischen Verbs und lässt die ungewöhnliche Vorstellung des Abschnitts stehen.
- source_word: ἕως ... τοῦ οὐρανοῦ φθάνοντες
  choice: als reichten sie bis an den Himmel
  rationale: Gibt die anschauliche, möglicherweise hyperbolische Größenangabe wieder, ohne sie wörtlich zu verflachen.
theological_decisions:
- issue: Pauschale negative Aussagen über Frauen
  choice: Die Aussagen werden als Rede Rubens direkt und ungemildert übersetzt.
  alternative: Die Aussagen ausdrücklich auf unmoralische Frauen beschränken oder abschwächen.
  rationale: Der griechische Text formuliert allgemein. Eine stillschweigende Korrektur würde seine schwierige geschlechtsspezifische Rhetorik verdecken.
- issue: πνεῦμα τῆς πορνείας
  choice: „Geist der sexuellen Unmoral“
  alternative: „Trieb zur Unzucht“ oder eine rein psychologische Umschreibung
  rationale: „Geist“ erhält die theologische Spannung zwischen personifizierter Macht und geistlichem Wesen.
- issue: Wächter- und Riesentradition
  choice: „Wächter“ und „Riesen“ bleiben im Haupttext stehen.
  alternative: Deutung als bloß mächtige Menschen oder entmythologisierende Umschreibung
  rationale: Die Begriffe gehören zur frühjüdischen Auslegungstradition, die der Text ausdrücklich voraussetzt.
- issue: Mehrdeutige Pronomen in Vers 7
  choice: Die griechischen Pronomen werden möglichst formal als „auch sie“ und „ihre Erscheinung“ bewahrt.
  alternative: Die Bezugswörter ausdrücklich als „die Frauen“ beziehungsweise „die Wächter“ einsetzen.
  rationale: Die Referenten sind aus dem Zusammenhang erschließbar, doch der griechische Wortlaut bleibt grammatisch weniger explizit; diese Offenheit soll nicht unnötig beseitigt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Warnrede. Die Härte und Fremdheit der antiken geschlechtsspezifischen Rhetorik sowie die ungewöhnliche Wächterüberlieferung werden nicht geglättet. „Sexuelle Unmoral“ ist verständlicher als das veraltete „Unzucht“, während „hurenhaft“ in Vers 4 die scharfe Wertung von πορνικοῖς wahrt.
