lexical_decisions:
- source_word: φυλάξατε
  choice: Hütet euch / Hütet
  rationale: Der kräftige Imperativ verbindet Wachsamkeit mit persönlicher Verantwortung und passt zum mahnenden Ton.
- source_word: πορνεία
  choice: sexuelle Unmoral
  rationale: Die Formulierung bezeichnet unerlaubtes sexuelles Verhalten breit genug, ohne den Begriff unnötig auf einen einzelnen Tatbestand zu verengen.
- source_word: καθαρεύοντες τῇ διανοίᾳ
  choice: haltet euer Denken rein
  rationale: διάνοια bezeichnet hier das innere Denken beziehungsweise Sinnen; die Formulierung ist im Deutschen natürlich und bewahrt den Gedanken innerer Reinheit.
- source_word: αἰσθήσεις
  choice: Sinne
  rationale: Der Begriff bezeichnet die sinnlichen Wahrnehmungsfähigkeiten als mögliche Zugänge zur Begierde.
- source_word: συνδιάζειν
  choice: engen Umgang pflegen
  rationale: Die Wiedergabe bezeichnet vertrauten oder engen sozialen Kontakt, ohne bereits einen sexuellen Vollzug zu unterstellen.
- source_word: συνεχεῖς συντυχίαι
  choice: ständige Begegnungen
  rationale: Die Wendung betont wiederholten Kontakt und dessen im Text behauptete kumulative Gefahr.
- source_word: ἀσέβημα
  choice: gottlose Tat
  rationale: Damit bleibt die religiös-moralische Wertung des griechischen Ausdrucks erhalten.
- source_word: νόσος ἀνίατος
  choice: unheilbare Krankheit
  rationale: Die drastische Krankheitsmetapher wird unmittelbar bewahrt.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Die Transliteration folgt der Namensform des griechischen Zeugen, statt sie an die bekanntere Form Belial anzugleichen.
- source_word: σύνεσιν
  choice: Einsicht
  rationale: Der Begriff umfasst verständiges Urteilsvermögen und gibt die moralisch-intellektuelle Dimension prägnant wieder.
- source_word: εὐσέβειαν
  choice: Gottesfurcht
  rationale: Im Kontext bezeichnet das Wort eine auf Gott bezogene ehrfürchtige Haltung; „Gottesfurcht“ ist würdig und allgemein verständlich.
- source_word: ζῆλος / ζηλώσετε
  choice: Eifersucht / eifersüchtig sein
  rationale: Der Zusammenhang beschreibt rivalisierenden Neid gegenüber den Söhnen Levis, nicht lobenswerten Eifer.
- source_word: ποιεῖν ἀλήθειαν
  choice: Wahrheit üben
  rationale: Die leicht idiomatische Form bewahrt den Handlungscharakter des griechischen Ausdrucks; eine Fußnote erläutert, dass wahrhaftiges und treues Handeln gemeint ist.
- source_word: προσκυνήσατε
  choice: werft euch nieder
  rationale: Die körperliche Huldigungsgeste bleibt sichtbar, ohne durch „anbeten“ vorschnell ausschließlich göttliche Verehrung auszudrücken.
- source_word: σπέρμα
  choice: Nachkommenschaft
  rationale: Der kollektive Begriff lässt offen, ob eine Linie oder ein bestimmter Nachkomme im Blick steht.
theological_decisions:
- issue: Textkritisch schwierige Verse 7–8
  choice: Levi erhält das Priestertum und Juda zusammen mit ihm das Königtum; vor einer Erhebung gegen beide wird gewarnt.
  alternative: Die beschädigte Syntax fragmentarisch und weitgehend unübersetzt stehen lassen.
  rationale: Der vorgelegte griechische Text ist in diesem Abschnitt verstümmelt. Die erhaltenen Hinweise und der geprüfte Konsultationstext stützen den traditionellen Grundsinn, während die Fußnote die Unsicherheit ausdrücklich kenntlich macht.
- issue: Subjekt und Mittlerschaft in Vers 11
  choice: „Der Herr hat erwählt, in ihm ... zu herrschen“ mit erläuternder Ambiguitätsfußnote.
  alternative: Eindeutig formulieren, dass entweder der Herr durch Levi herrscht oder Levi selbst zum Herrscher erwählt wird.
  rationale: Die griechische Konstruktion ἐν αὐτῷ ... βασιλεύειν ist theologisch und syntaktisch spannungsvoll. Die Übersetzung vermeidet eine konfessionelle oder messianische Vorentscheidung.
- issue: Huldigung der Nachkommenschaft in Vers 12
  choice: „Werft euch vor seiner Nachkommenschaft nieder“ statt „betet sie an“.
  alternative: Die Geste ausdrücklich als göttliche Anbetung oder ausschließlich als politische Huldigung deuten.
  rationale: προσκυνέω kann sowohl Niederwerfung und Huldigung als auch kultische Anbetung bezeichnen. Der Kontext allein erzwingt hier keine eindeutige Festlegung.
- issue: Königliche und messianische Erwartung in Vers 12
  choice: „Unter euch wird ein ewiger König sein“, ohne dessen Abstammung ausdrücklich festzulegen.
  alternative: Den ewigen König ausdrücklich Levi oder Juda beziehungsweise einer späteren christologischen Identifikation zuordnen.
  rationale: Der Abschnitt stellt Levi und Juda nebeneinander und weist möglicherweise mehrere Traditionsschichten auf. Die Übersetzung bewahrt die im Text verbleibende Zuordnungsfrage.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, paränetischem Ton. Die Anrede im Plural und die Imperative bleiben deutlich. Archaismen wurden vermieden, während bildkräftige Ausdrücke wie „unheilbare Krankheit“, „Wahrheit üben“ und „sich niederwerfen“ erhalten bleiben. Textkritische Schäden und theologisch relevante Mehrdeutigkeiten werden nicht stillschweigend geglättet, sondern knapp erläutert.
