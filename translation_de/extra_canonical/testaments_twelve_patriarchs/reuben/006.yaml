  - severity: medium
    issue: Vers 8 deutet die unsichere Präposition stärker als instrumentales „durch sie“.
    rationale: Der Konsultationstext gibt die wahrscheinliche Relation mit „from whom“ wieder. „Aus denen ... hervorgehen lassen wird“ bewahrt die Herkunftsrelation besser; die textkritische Fußnote kennzeichnet die Unsicherheit.
  - severity: low
    issue: „Schande von Beliar“ ist im Deutschen schwerfällig.
    rationale: „Schande Beliars“ ist idiomatischer und bewahrt den im griechischen Genitiv angelegten, nicht weiter präzisierten Bezug.
