  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/006.yaml
  text: '1. Guard yourselves, therefore, from sexual immorality, and be keeping your mind pure. Guard also your senses from every woman. 2. And command the women likewise not to associate closely with men, so that they too may keep their minds pure. 3. For constant encounters, even if the ungodly act is not carried out, are nevertheless for them an incurable disease, and for us a ruinous disgrace of Beliar and an everlasting reproach. 4. For sexual immorality has within itself neither understanding nor reverence for God, and every jealousy dwells in its desire. 5. Therefore I say to you: you will be jealous of the sons of Levi, and you will seek to exalt yourselves above them, but you will not prevail because of this. 6. For God will execute their vengeance, but you will die an evil death. 7. For to Levi God gave the priesthood, and to Judah with him the kingdom. 8. And do not be lifted up against these two, from whom the Lord will bring to completion what is to be spoken. 9. I adjure you
    by the God of heaven, that each of you practice truth toward his neighbor and that each have love toward his brother. 10. And draw near to Levi in humility of heart, so that you may receive a blessing from his mouth. 11. For he will bless Israel and Judah, because in him the Lord chose to reign before all the people. 12. And bow down to his seed, because for your sake it will die in visible and invisible wars, and among you there will be an everlasting king.'
translation:
  language: de
  text: '**Das Testament Rubens 6**


    1. Hütet euch also vor sexueller Unmoral und haltet euer Denken rein. Hütet auch eure Sinne vor jeder Frau. 2. Weist ebenso die Frauen an, keinen engen Umgang mit Männern zu pflegen, damit auch sie ihr Denken rein halten. 3. Denn ständige Begegnungen sind für sie, selbst wenn die gottlose Tat nicht begangen wird, dennoch eine unheilbare Krankheit, für uns aber eine Schande von Beliar[b], die ins Verderben führt, und eine ewige Schmach. 4. Denn sexuelle Unmoral hat weder Einsicht noch Gottesfurcht in sich, und in ihrer Begierde wohnt jede Eifersucht.


    5. Darum sage ich euch: Ihr werdet auf die Söhne Levis eifersüchtig sein und danach streben, euch über sie zu erheben; doch deshalb werdet ihr keinen Erfolg haben. 6. Denn Gott wird für sie Vergeltung üben, ihr aber werdet eines schlimmen Todes sterben. 7. Denn Levi gab Gott das Priestertum und Juda zusammen mit ihm das Königtum.[a] 8. Erhebt euch nicht gegen diese beiden; denn durch sie wird der Herr vollenden, was verkündet werden soll.[a]


    9. Ich beschwöre euch bei dem Gott des Himmels: Jeder soll seinem Nächsten gegenüber Wahrheit üben[c] und seinen Bruder lieben. 10. Nähert euch Levi mit demütigem Herzen, damit ihr aus seinem Mund Segen empfangt. 11. Denn er wird Israel und Juda segnen; denn der Herr hat erwählt, in ihm vor dem ganzen Volk zu herrschen.[e] 12. Werft euch vor seiner Nachkommenschaft nieder[d]; denn sie wird um euretwillen in sichtbaren und unsichtbaren Kriegen sterben, und unter euch wird ein ewiger König sein.


    **Fußnoten**


    [a] Die Verse 7–8 sind im vorliegenden griechischen Text schwer beschädigt und textkritisch unsicher. Die Übersetzung gibt als wahrscheinlichen Sinn wieder, dass Levi das Priestertum und Juda das Königtum erhält, verbunden mit der Warnung, sich keiner der beiden Linien zu widersetzen.


    [b] „Beliar“ folgt hier der griechischen Namensform; geläufig ist auch die Form „Belial“.


    [c] Wörtlich: „Wahrheit tun“. Gemeint ist, dem Nächsten gegenüber wahrhaftig und treu zu handeln, nicht nur Wahres zu sagen.


    [d] „Sich vor seiner Nachkommenschaft niederwerfen“ kann die Huldigung gegenüber einer Nachkommenlinie bezeichnen und muss nicht göttliche Anbetung bedeuten.


    [e] Der griechische Satz lässt offen, ob der Herr selbst „in ihm“ herrscht oder ob er ihn beziehungsweise seine Linie zum Herrschen erwählt. Die Übersetzung bewahrt diese Spannung.'
