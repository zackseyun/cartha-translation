  terminology: „Sexuelle Unmoral“, „Gottesfurcht“, „Beliar“, „Priestertum“, „Königtum“ und „Nachkommenschaft“ sind angemessen. „Wahrheit üben“ bewahrt das idiomatische ποιεῖν ἀλήθειαν und wird zutreffend erläutert. Die Fußnotenanker stehen an den einschlägigen Aussagen.
  issues:
  - severity: high
