  rationale: Die Revision reduziert interpretierende Zusätze, bildet die Verbformen und Verknüpfungen des Griechischen genauer ab und wahrt bei ἔκστασις φύσεως sowie der beschädigten Wortgruppe in V. 5 die Überlieferungsunsicherheit. Der mahnende Registerton und die moderne Standardsprache bleiben erhalten.
  reviewer_model: gpt-5.6-terra
