revisions:
- from: '**Testament Rubens 3**


    **1** Über all diesen gibt es noch einen achten Geist: den Geist des Schlafes. Mit ihm entstehen die Entrückung der natürlichen Wahrnehmung[a] und das Abbild des Todes.


    **2** Mit diesen Geistern vermischen sich die Geister des Irrtums. **3** Der erste ist der Geist der sexuellen Unmoral; er sitzt in der menschlichen Natur und in den Sinnen. Der zweite ist der Geist der Unersättlichkeit des Bauches. **4** Der dritte ist der Geist des Streites; er sitzt in der Leber und in der Galle. Der vierte ist der Geist der Gefallsucht und der Zauberkunst, der bewirken will, dass man durch aufwendige Künste schön erscheint. **5** Der fünfte ist der Geist des Hochmuts, der einen dazu bringt, sich zu rühmen und sich für groß zu halten. Der sechste ist der Geist der Lüge – in Verderben und Eifersucht[b] –, der Worte erfindet und die eigenen Worte vor Verwandten und Hausgenossen verbirgt. **6** Der siebte ist der Geist der Ungerechtigkeit. Mit ihm kommen Diebstähle und habgieriges Raffen, damit er die Vergnügungssucht seines Herzens befriedigt. Denn die Ungerechtigkeit wirkt durch Geben und Nehmen mit den übrigen Geistern zusammen.


    **7** Über all diesen steht der Geist des Schlafes, der sich mit ihnen verbindet; er ist der achte Geist des Irrtums und der Trugbilder. **8** So geht jeder junge Mensch zugrunde: Er verfinstert seinen Verstand gegenüber der Wahrheit, versteht Gottes Gesetz nicht und hört nicht auf die Ermahnung seiner Väter – so, wie auch ich in meiner Jugend darunter litt.


    **9** Und nun, meine Kinder: Liebt die Wahrheit, dann wird sie euch bewahren. Hört auf die Worte eures Vaters Ruben, mit denen ich euch unterweise. **10** Achtet nicht auf die äußere Erscheinung einer Frau, pflegt keinen vertrauten Umgang mit einer verheirateten Frau und beschäftigt euch nicht neugierig mit den Angelegenheiten der Frauen.'
