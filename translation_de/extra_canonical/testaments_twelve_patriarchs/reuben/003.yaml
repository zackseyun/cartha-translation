review_pass:
  verdict: revise
  source_fidelity: 'Eine vorsichtige Überarbeitung ist nötig. Der Entwurf gibt Aufbau, die acht Geister, die problematische Überlieferung in V. 5–6 und die Schlussmahnung im Wesentlichen zutreffend wieder. Mehrere Formulierungen gehen jedoch über den griechischen Wortlaut hinaus: In V. 1 wird die bildhafte, schwierige ἔκστασις φύσεως zu eng als Aussetzen der Wahrnehmung erklärt; in V. 3 wird „menschlich“ ergänzt; in V. 4 macht „aufwendige Künste“ aus περιεργεία eine spezifisch künstlerische Praxis; und in V. 6 wird φιληδονία als „Vergnügungssucht“ stärker psychologisiert als erforderlich.'
  naturalness: Die Sprache ist überwiegend klar und modern. „Mit ihm entstehen“ passt zeitlich und syntaktisch weniger gut zum passiven ἐκτίσθη; „zu all diesen kommt“ und „wurde ... geschaffen“ sind näher am Text und idiomatisch. „Über all diesen steht“ kann eine Hierarchie nahelegen, die συνάπτεται nicht ausdrückt; „schließt sich ... an“ ist präziser.
  terminology: „Geist“, „sexuelle Unmoral“, „Hochmut“, „Ungerechtigkeit“, „verheiratete Frau“ und „Trugbilder“ sind tragfähige Wiedergaben. Die Übersetzung von ἔκστασις wird im Text zurückhaltender gehalten und die Deutung in die Fußnote verlagert. Für φιληδονία ist „Lust seines Herzens“ ausreichend offen. Die textkritisch unsichere Wortgruppe „in Verderben und Eifersucht“ bleibt ausdrücklich markiert.
  issues:
  - severity: medium
    issue: 'V. 1: „Entrückung der natürlichen Wahrnehmung“ ist interpretierend erweitert.'
    rationale: ἔκστασις φύσεως lautet wörtlich etwa „Außersichsein/Entrückung der Natur“. Der Bezug auf bewusste Wahrnehmung ist plausibel, aber nicht ausdrücklich im griechischen Text enthalten und gehört daher in die Anmerkung.
  - severity: low
    issue: 'V. 1: „Mit ihm entstehen“ glättet die Vergangenheit und das Passiv von ἐκτίσθη.'
    rationale: „Mit dem ... geschaffen wurde“ bildet die Form des Grundtexts näher ab.
  - severity: medium
    issue: 'V. 3: „menschlichen Natur“ fügt „menschlich“ hinzu.'
    rationale: Der Text sagt φύσις, ohne diese nähere Bestimmung. Die Ergänzung ist naheliegend, aber unnötig.
  - severity: medium
    issue: 'V. 4: „durch aufwendige Künste“ verengt περιεργεία.'
    rationale: περιεργεία bezeichnet übermäßige/neugierige Einmischung oder umtriebiges Tun; weder „Künste“ noch deren Aufwendigkeit stehen ausdrücklich im Wort.
  - severity: medium
    issue: 'V. 6: „Vergnügungssucht seines Herzens“ ist stärker und enger als φιληδονία.'
    rationale: φιληδονία bezeichnet Liebe zur Lust bzw. Lustsucht. „Lust seines Herzens“ wahrt die knappe, personifizierende Ausdrucksweise und den unsicheren Bezug besser.
  - severity: low
    issue: 'V. 7: „steht“ kann eine nicht ausdrücklich ausgesagte Überordnung vermitteln.'
    rationale: συνάπτεται bedeutet „sich anschließen/verbunden werden“; die örtliche Formel ἐπὶ πᾶσιν wird ohne hierarchische Auslegung wiedergegeben.
