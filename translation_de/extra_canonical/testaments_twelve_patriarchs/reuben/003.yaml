base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/003.yaml
  text: 'And besides all these, there is an eighth spirit, the spirit of sleep, with which are created the trance of nature and the image of death.


    With these spirits are mixed the spirits of error. First, the spirit of sexual immorality is lodged in the nature and in the senses. Second, a spirit of insatiableness of the belly. Third, a spirit of fighting in the liver and in the gall. Fourth, a spirit of self-display and sorcery, so that through excessive meddling one may appear attractive. Fifth, a spirit of pride, so that one boasts and thinks grand thoughts. Sixth, a spirit of falsehood in destruction and jealousy, for shaping words and hiding one’s words from one’s own kin and household. Seventh, a spirit of injustice, with which come thefts and acts of greed, so that it may satisfy the pleasures of his heart. For injustice works together with the other spirits through taking and giving.


    And over all these the spirit of sleep is joined, which is the eighth spirit of error and fantasy. And so every young man is destroyed, darkening his mind from the truth and not understanding the law of God, nor listening to the instruction of his fathers, just as I also suffered in my youth.


    And now, my children, love the truth, and it will keep you safe. Hear the words of Reuben your father, as I teach you. Do not pay attention to a woman’s appearance, nor keep company with a married woman, nor pry into the affairs of women.'
translation:
  language: de
  text: '**Testament Rubens 3**


    **1** Zu all diesen kommt ein achter Geist hinzu: der Geist des Schlafes. Mit ihm wurden das Außersichsein der Natur[a] und das Abbild des Todes geschaffen.


    **2** Mit diesen Geistern vermischen sich die Geister des Irrtums. **3** Der erste ist der Geist der sexuellen Unmoral; er wohnt in der Natur und in den Sinnen. Der zweite ist der Geist der Unersättlichkeit des Bauches. **4** Der dritte ist der Geist des Streites in der Leber und in der Galle. Der vierte ist der Geist der Gefallsucht und der Zauberkunst, damit man durch übermäßiges Tun schön erscheine. **5** Der fünfte ist der Geist des Hochmuts, damit man sich rühme und sich für groß halte. Der sechste ist der Geist der Lüge – in Verderben und Eifersucht[b] –, um Worte zu erfinden und die eigenen Worte vor Verwandten und Hausgenossen zu verbergen. **6** Der siebte ist der Geist der Ungerechtigkeit; mit ihm kommen Diebstähle und habgieriges Raffen, damit er die Lust seines Herzens befriedige. Denn die Ungerechtigkeit wirkt durch Geben und Nehmen mit den übrigen Geistern zusammen.


    **7** Zu all diesen schließt sich der Geist des Schlafes an; er ist der achte Geist des Irrtums und der Trugbilder. **8** So geht jeder junge Mensch zugrunde: Er verfinstert seinen Verstand gegenüber der Wahrheit, versteht Gottes Gesetz nicht und hört nicht auf die Ermahnung seiner Väter – so, wie auch ich in meiner Jugend darunter litt.


    **9** Und nun, meine Kinder: Liebt die Wahrheit, dann wird sie euch bewahren. Hört die Worte eures Vaters Ruben, der euch unterweist. **10** Achtet nicht auf die äußere Erscheinung einer Frau, pflegt keinen vertrauten Umgang mit einer verheirateten Frau und beschäftigt euch nicht neugierig mit den Angelegenheiten der Frauen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „das Außersichsein der Natur“. Die bildhafte Wendung ist schwer zu deuten; im Zusammenhang mit dem Schlaf kann sie einen tranceähnlichen Zustand, Erstarrung oder Bewusstlosigkeit bezeichnen.'
    reason: Die Bedeutung von ἔκστασις φύσεως ist im Kontext nicht eindeutig. Die Fußnote erläutert mögliche Nuancen, ohne eine von ihnen im Übersetzungstext festzulegen.
  - marker: b
    text: Die Worte „in Verderben und Eifersucht“ sind im griechischen Text wahrscheinlich beschädigt; ihr genauer Zusammenhang mit dem Geist der Lüge ist unsicher.
    reason: Die Edition kennzeichnet ἐν ἀπωλείᾳ καὶ ζήλῳ als textkritisch problematische Lesart.
lexical_decisions:
- source_word: ἔκστασις φύσεως
  choice: Entrückung der natürlichen Wahrnehmung
  rationale: ἔκστασις bezeichnet hier den im Schlaf eintretenden Zustand des Außer-sich-Seins beziehungsweise das Aussetzen bewusster Wahrnehmung. Die Formulierung bleibt bildhaft, ist aber im Deutschen verständlicher als eine wörtliche „Ekstase der Natur“.
- source_word: πνεῦμα τῆς πορνείας
  choice: Geist der sexuellen Unmoral
  rationale: πορνεία ist ein weiter Begriff für unerlaubtes sexuelles Verhalten; „Unzucht“ wäre enger und sprachlich veraltet.
- source_word: ἀρεσκείας
  choice: Gefallsucht
  rationale: Das Wort bezeichnet das Bestreben, anderen zu gefallen oder sich vorteilhaft darzustellen; „Gefallsucht“ bildet diesen negativen Akzent knapp ab.
- source_word: μαγγανείας
  choice: Zauberkunst
  rationale: Der Ausdruck kann magische Praktiken, Gaukelei oder betrügerische Künste bezeichnen. „Zauberkunst“ bewahrt die magische Konnotation, ohne eine bestimmte Praxis festzulegen.
- source_word: περιεργείας
  choice: aufwendige Künste
  rationale: Im Zusammenhang mit schönem Erscheinen bezeichnet der Ausdruck eher kunstvolle, übertriebene oder fragwürdige Praktiken als bloße Neugier oder Einmischung.
- source_word: μεγαλοφρονῇ
  choice: sich für groß halten
  rationale: Gibt das hochmütige Denken idiomatisch wieder, ohne die Bedeutung durch „große Gedanken“ missverständlich positiv klingen zu lassen.
- source_word: γρηπίσματα
  choice: habgieriges Raffen
  rationale: Der seltene beziehungsweise textlich unsichere Ausdruck steht parallel zu Diebstählen und bezeichnet wahrscheinlich habgierige Zugriffe oder Raffhandlungen.
- source_word: δοσοληψίας
  choice: Geben und Nehmen
  rationale: Die feste Wortverbindung bezeichnet wechselseitige Transaktionen oder Geschäfte. Die wörtliche Wiedergabe wahrt die offene Frage, wie diese mit der Ungerechtigkeit zusammenwirken.
- source_word: φαντασίας
  choice: Trugbilder
  rationale: Im Kontext des Irrtums meint φαντασία täuschende Vorstellungen oder Erscheinungen; „Trugbilder“ ist natürlicher und konkreter als „Fantasie“.
- source_word: θηλείας ὑπάνδρου
  choice: verheiratete Frau
  rationale: ὕπανδρος bedeutet wörtlich „unter einem Mann stehend“ und bezeichnet idiomatisch eine Frau, die einen Ehemann hat.
- source_word: συνδιάζετε
  choice: pflegt keinen vertrauten Umgang
  rationale: Das Verb bezeichnet ein Zusammensein oder engen Umgang. Die Übersetzung vermeidet, ohne ausreichenden Grund ausschließlich Geschlechtsverkehr oder bloß zufällige Gesellschaft zu meinen.
- source_word: περιεργάζεσθε πρᾶξιν γυναικῶν
  choice: beschäftigt euch nicht neugierig mit den Angelegenheiten der Frauen
  rationale: περιεργάζομαι bezeichnet neugieriges, ungebührliches oder übermäßiges Sich-Einmischen; „Angelegenheiten“ gibt πρᾶξις hier offen wieder.
theological_decisions:
- issue: Ontologischer Status der genannten „Geister“
  choice: „Geist“ durchgehend beibehalten
  alternative: Als „Trieb“, „Neigung“ oder rein psychologische Eigenschaft wiedergeben
  rationale: Der griechische Text personifiziert und lokalisiert die πνεύματα, entscheidet aber nicht eindeutig, ob eigenständige Geistwesen, innere Kräfte oder beides gemeint sind. Die Übersetzung bewahrt diese Spannung.
- issue: „Natur“ und „Sinne“ als Sitz sexueller Unmoral
  choice: Die Aussage ohne erklärende Abschwächung wiedergeben
  alternative: Auf den „Körper“ oder bestimmte Begierden eingrenzen
  rationale: Der Text nennt ausdrücklich φύσις und αἰσθήσεις. Eine dogmatische Deutung des Menschenbildes wird nicht in die Übersetzung eingetragen.
- issue: Bewahrende Wirkung der Wahrheit
  choice: „dann wird sie euch bewahren“
  alternative: „sie wird euch retten“
  rationale: φυλάσσω bedeutet schützen, bewahren oder behüten. „Bewahren“ hält die Aussage stark, ohne sie unnötig als technische Heilslehre zu bestimmen.
- issue: Singularischer Bezug in Vers 6
  choice: „damit er die Vergnügungssucht seines Herzens befriedigt“
  alternative: „damit sie die Vergnügungssucht seines Herzens befriedigt“
  rationale: Das grammatische Subjekt beziehungsweise der Bezug ist im überlieferten Text nicht völlig glatt. Der maskuline Ausdruck wird auf den „Geist der Ungerechtigkeit“ bezogen, ohne den inhaltlichen Zusammenhang umzudeuten.
translation_notes:
  register: Moderne, würdevolle Standardsprache mit klarer Versgliederung. Wiederholte Listenformeln wurden maßvoll geglättet, die Körperlokalisierungen und die personifizierende Rede von „Geistern“ jedoch bewahrt. Archaismen wie „Unzucht“ und unnötig technische Fremdwörter wurden vermieden. Die Mahnungen in Vers 10 bleiben deutlich, ohne über den griechischen Wortlaut hinaus sexualethische Einzelheiten festzulegen.
