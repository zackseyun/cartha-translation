lexical_decisions:
- source_word: ἀπέθανε
  choice: starb
  rationale: Die schlichte deutsche Vergangenheitsform gibt den griechischen Aorist natürlich und präzise wieder.
- source_word: ἐντειλάμενος
  choice: nachdem er … aufgetragen hatte
  rationale: Die temporale Wiedergabe des Aoristpartizips macht deutlich, dass Ruben den Auftrag vor seinem Tod erteilte, ohne über den griechischen Text hinauszugehen.
- source_word: ταῦτα
  choice: dies
  rationale: Das Demonstrativpronomen verweist zusammenfassend auf die vorausgehenden Weisungen; „dies“ ist im Deutschen idiomatisch.
- source_word: τοῖς υἱοῖς αὐτοῦ
  choice: seinen Söhnen
  rationale: Die possessive deutsche Form entspricht dem griechischen Ausdruck natürlich und eindeutig.
