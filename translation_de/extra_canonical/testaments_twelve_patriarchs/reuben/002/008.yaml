source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Ἕβδομον πνεῦμα σπορᾶς καὶ συνουσίας²⁷, μεθ’ ἧς συνέρχονται²⁸ διὰ τῆς φιληδονίας²⁹ ἁμαρτίαι³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/008.yaml
  text: The seventh is the spirit of procreation and union, through which sins come together through love of pleasure.
translation:
  language: de
  text: Das siebte ist der Geist der Zeugung und der geschlechtlichen Vereinigung; mit der sich durch die Liebe zur Lust Sünden verbinden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπορᾶς
  choice: Fortpflanzung
  rationale: Gibt hier die Bedeutung von Zeugung bzw. Hervorbringung natürlich und allgemein verständlich wieder.
- source_word: συνουσίας
  choice: geschlechtliche Vereinigung
  rationale: Der Kontext legt die sexuelle Bedeutung von συνουσία nahe; die Formulierung ist eindeutig, würdig und weniger technisch als „Geschlechtsverkehr“.
- source_word: μεθ’ ἧς συνέρχονται
  choice: mit ihm verbinden sich
  rationale: Das feminine Relativpronomen bezieht sich grammatisch wahrscheinlich auf συνουσία; im Deutschen wird der Bezug sinngemäß auf den gesamten zuvor genannten Geist gefasst. „sich verbinden“ bewahrt das Wortspiel bzw. die Wiederaufnahme von συνουσία und συνέρχονται, ohne die ungewöhnliche Aussage zu glätten.
- source_word: φιληδονίας
  choice: Lustliebe
  rationale: Bewahrt die konkrete Neigung oder Liebe zur Lust stärker als bloßes „Vergnügen“ und vermeidet eine vorschnelle moraltheologische Ausdeutung.
- source_word: ἁμαρτίαι
  choice: Sünden
  rationale: Direkte und kontextgemäße Wiedergabe des Plurals.
theological_decisions:
- issue: Verhältnis von geschlechtlicher Vereinigung, Lustliebe und Sünden
  choice: Die ungewöhnliche Aussage, dass sich Sünden durch Lustliebe mit diesem Geist verbinden, bleibt erhalten.
  alternative: 'Freier: „durch ihn entstehen aus Lustliebe Sünden“'
  rationale: Der griechische Text sagt nicht schlicht, dass Fortpflanzung oder Vereinigung selbst Sünde sei oder Sünden verursache. Die relationale Formulierung mit συνέρχονται wird daher nicht kausal vereindeutigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe am knappen griechischen Ausgangstext; „Lustliebe“ ist bewusst markant, aber verständlich und bildet φιληδονία präziser ab als eine bloße Freude am Vergnügen.
