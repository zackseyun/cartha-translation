id: T12P.REU.2.7
reference: Testament of Reuben 2:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Ἕκτον πνεῦμα γεύσεως μεθ’ ἧς *γίνεται βρῶσις²³ *βρωμάτων τε καὶ πομάτων²⁴, καὶ ἰσχὺς ἐν αὐτῷ²⁵ κτίζεται *ὅτι ἐν βρώμασίν ἐστιν ἡ ὑπό- στασις τῆς ἰσχύος²⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/007.yaml
  text: The sixth is the spirit of taste, by which eating of foods and drinks comes to be, and strength is built up in it, because in foods is the basis of strength.
translation:
  language: de
  text: Das sechste ist der Geist des Geschmackssinns, durch den Speisen und Getränke aufgenommen werden; und in ihm wird Kraft aufgebaut, denn in der Nahrung liegt die Grundlage der Kraft.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα γεύσεως
  choice: Geist des Geschmackssinns
  rationale: „Geist“ wahrt die anthropologische Begrifflichkeit des Abschnitts; „Geschmackssinn“ gibt γεύσις im modernen Deutschen klar und natürlich wieder.
- source_word: γίνεται βρῶσις βρωμάτων τε καὶ πομάτων
  choice: durch den Speisen und Getränke aufgenommen werden
  rationale: Die wörtliche Wendung „das Essen von Speisen und Getränken geschieht“ wäre im Deutschen schwerfällig und ließe Getränke unnatürlich als gegessen erscheinen. „aufgenommen werden“ bewahrt den übergeordneten Vorgang der Nahrungsaufnahme.
- source_word: ἰσχὺς ... κτίζεται
  choice: Kraft wird aufgebaut
  rationale: κτίζεται bezeichnet hier das Entstehen beziehungsweise Aufbauen von Kraft; die Formulierung bleibt nahe am griechischen Bild und ist verständlich.
- source_word: ἐν αὐτῷ
  choice: in ihm
  rationale: Das maskuline Pronomen wird formal auf den genannten „Geist des Geschmackssinns“ bezogen; die mögliche gedankliche Beziehung auf den Vorgang der Nahrungsaufnahme wird nicht durch eine erklärende Umformung festgelegt.
- source_word: ὑπόστασις τῆς ἰσχύος
  choice: Grundlage der Kraft
  rationale: ὑπόστασις bezeichnet hier am plausibelsten das, was der Kraft zugrunde liegt beziehungsweise sie trägt; „Grundlage“ ist kontextgemäßer als das missverständliche „Substanz“.
- source_word: ἐν βρώμασίν
  choice: in der Nahrung
  rationale: Der griechische Plural bezeichnet Nahrungsmittel allgemein. Der deutsche Kollektivbegriff „Nahrung“ klingt natürlich und umfasst den ernährungsbezogenen Sinn.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem argumentativen Zusammenhang des Griechischen, vermeidet jedoch die im Deutschen unnatürliche Rede vom „Essen von Getränken“. Keine konfessionelle oder über den Wortlaut hinausgehende anthropologische Deutung wurde eingeführt.
