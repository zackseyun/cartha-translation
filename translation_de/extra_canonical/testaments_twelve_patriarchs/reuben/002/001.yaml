base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/001.yaml
  text: And now, my children, hear me concerning what I saw about the seven spirits of deceit[a] in my repentance.
translation:
  language: de
  text: Und nun hört mich an, meine Kinder, was ich in meiner Umkehr über die sieben Geister der Täuschung[a] sah.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geister des Irrtums“, „Geister der Verblendung“ oder „Geister der Verirrung“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀκούσατέ μου
  choice: hört mir zu
  rationale: Die Genitivkonstruktion mit ἀκούω bezeichnet hier das Hören auf den Sprecher; die natürliche deutsche Wiedergabe ist „hört mir zu“.
- source_word: τέκνα μου
  choice: meine Kinder
  rationale: Bewahrt die direkte, familiäre Anrede in natürlichem modernem Deutsch.
- source_word: ἃ εἶδον περὶ
  choice: bei dem, was ich … über … sah
  rationale: Gibt sowohl das Relativpronomen als auch den Bezug von περὶ wieder, ohne den Satz unnötig zu glätten.
- source_word: τῶν ἑπτὰ πνευμάτων τῆς πλάνης
  choice: die sieben Geister der Verirrung
  rationale: „Verirrung“ bewahrt die Bedeutungsbreite von πλάνη zwischen Irrtum, Täuschung und Verführung und lässt den Genitiv bewusst offen.
- source_word: ἐν τῇ μετανοίᾳ μου
  choice: während meiner Umkehr
  rationale: ἐν kann hier zeitlich bzw. umstandsbezogen verstanden werden. „Umkehr“ gibt μετάνοια als innere und praktische Abkehr vom bisherigen Weg wieder.
theological_decisions:
- issue: Bedeutung und Zuordnung des Genitivs τῆς πλάνης
  choice: Geister der Verirrung
  alternative: Geister der Täuschung / Geister des Irrtums
  rationale: Der griechische Genitiv kann die Geister charakterisieren, ohne eindeutig festzulegen, ob sie selbst irren, täuschen oder zur Verirrung führen. Die Hauptfassung wahrt diese Spannung; Alternativen stehen in der Fußnote.
- issue: Zeitlicher oder situativer Sinn von ἐν τῇ μετανοίᾳ μου
  choice: während meiner Umkehr
  alternative: in meiner Reue
  rationale: Die zeitliche Wiedergabe passt zur Schau Reubens im Zusammenhang seines Umkehrprozesses, ohne μετάνοια auf ein bloßes Gefühl des Bedauerns zu reduzieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter familiärer Anrede. Die Wortstellung wurde für gute Verständlichkeit leicht geglättet; die Mehrdeutigkeit von πλάνη bleibt durch Haupttext und Fußnote erhalten.
