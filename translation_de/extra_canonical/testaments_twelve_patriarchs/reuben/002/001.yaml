    rationale: πλάνη kann Irrtum, Verblendung oder Täuschung bezeichnen. Im Ausdruck von „Geistern“ und im englischen Audit Trail („deceit“) liegt die aktive bzw. charakterisierende Nuance von Täuschung näher; weitere mögliche Nuancen bleiben in der Fußnote erhalten.
