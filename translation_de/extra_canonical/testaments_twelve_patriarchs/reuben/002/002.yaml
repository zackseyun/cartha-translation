  text: Then seven spirits were given against man, and these are the heads of the works of youthfulness[b].
translation:
  language: de
  text: So wurden sieben Geister gegen den Menschen gegeben, und diese sind die Häupter der Werke des Neuerungsdrangs.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich in der Bildsprache: „die Häupter der Werke des Neuerungsdrangs“. Das griechische Wort kann Neuerung oder Veränderung, je nach Zusammenhang auch Umsturz, Aufruhr oder Auflehnung bezeichnen. „Häupter“ kann Hauptquellen, leitende Anfänge oder bestimmende Kräfte meinen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: οὖν
  choice: So
  rationale: Kennzeichnet die Folgerung beziehungsweise Fortführung im Zusammenhang, ohne das griechische Bindewort zu überladen.
- source_word: κατὰ τοῦ ἀνθρώπου
  choice: gegen den Menschen
  rationale: Bewahrt die adversative Bedeutung der Präposition und die allgemeine, kollektiv verstandene Bezeichnung ἄνθρωπος.
- source_word: αἱ κεφαλαὶ
  choice: die Häupter
  rationale: Gibt das bildhafte κεφαλαί formal wieder und bewahrt die mögliche Bedeutung von Hauptquellen, leitenden Anfängen oder obersten Prinzipien.
- source_word: τῶν ἔργων τοῦ νεωτερισμοῦ
  choice: der Werke jugendlichen Übermuts
  rationale: νεωτερισμός kann Neuerung beziehungsweise Umsturzdrang bezeichnen und meint im Kontext wohl die für die Jugend typische Auflehnung oder Unbesonnenheit; „jugendlicher Übermut“ ist im Deutschen verständlich, ohne den Ausdruck ausdrücklich auf einzelne Sünden festzulegen.
theological_decisions:
- issue: Art und Herkunft der sieben Geister
  choice: Die passive Formulierung „wurden ... gegeben“ bleibt ohne Nennung des Gebers erhalten.
  alternative: „Gott gab sieben Geister“ oder eine ausdrückliche Benennung als böse Geister.
  rationale: Der griechische Text nennt weder den Handelnden noch bestimmt er an dieser Stelle ausdrücklich das Wesen der Geister; eine theologische Präzisierung wäre ein Zusatz.
- issue: Funktion der „Häupter“
  choice: Die Metapher bleibt im Haupttext stehen und wird in der Fußnote erläutert.
  alternative: „Hauptursachen“, „Ursprünge“ oder „Anführer“.
  rationale: Die genaue Beziehung zwischen den Geistern und den Werken bleibt im Griechischen bildhaft und mehrdeutig.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Metapher „Häupter“ wurde wegen ihrer inhaltlichen Mehrdeutigkeit beibehalten; eine Fußnote erschließt sie. „Jugendlicher Übermut“ vermeidet das im Deutschen missverständliche „Werke der Jugendlichkeit“ und bildet den negativen Sinn von νεωτερισμός im Kontext ab.
