- from: Darum ist dieser Geist der letzte in der Schöpfung und der erste in der Jugend, denn er ist voller Unwissenheit. Er führt den Jüngeren wie einen Blinden zu einer Grube und wie ein Tier an einen Abgrund.
  to: Darum ist dieser Geist der Letzte in der Schöpfung und der Erste in der Jugend, denn er ist voller Unwissenheit; und diese führt den Jüngeren wie einen Blinden zu einer Grube und wie ein Tier an einen Abgrund.
  rationale: Die Revision korrigiert ausschließlich den eindeutigen grammatischen Bezug von αὕτη auf „Unwissenheit“. Die knappe, in ihrer genauen Rang- oder Zeitbedeutung offene Gegenüberstellung „Letzter in der Schöpfung / Erster in der Jugend“ sowie die zurückhaltend gerichteten Bildangaben bleiben erhalten.
