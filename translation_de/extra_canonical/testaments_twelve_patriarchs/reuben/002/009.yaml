base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/009.yaml
  text: Therefore this spirit is last in creation and first in youth, because it is filled with ignorance, and it leads the younger man like a blind man into a pit and like an animal over a cliff.
translation:
  language: de
  text: Darum ist dieser Geist der Letzte in der Schöpfung und der Erste in der Jugend, denn er ist voller Unwissenheit; und diese führt den Jüngeren wie einen Blinden zu einer Grube und wie ein Tier an einen Abgrund.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔσχατόν ἐστι τῆς κτίσεως
  choice: ist ... der letzte in der Schöpfung
  rationale: Bewahrt die Reihenfolge- bzw. Rangangabe des griechischen Ausdrucks, ohne sie spekulativ zu erklären.
- source_word: πρῶτον τῆς νεότητος
  choice: der erste in der Jugend
  rationale: Gibt die knappe Parallelkonstruktion zum vorangehenden Glied wieder und erhält ihre mögliche zeitliche bzw. rangbezogene Offenheit.
- source_word: ἀγνοίας πεπλήρωται
  choice: ist voller Unwissenheit
  rationale: Natürliches modernes Deutsch für das griechische Perfekt Passiv mit fortbestehendem Zustand.
- source_word: τὸν νεώτερον
  choice: den Jüngeren
  rationale: Erhält den Komparativ νεώτερον, statt ihn zu einem bloß jungen Mann einzuebnen.
- source_word: ἐπὶ βόθρον
  choice: zu einer Grube
  rationale: Gibt die gerichtete Bewegung auf eine Grube bzw. Fallgrube zu idiomatisch wieder.
- source_word: ἐπὶ κρημνόν
  choice: an einen Abgrund
  rationale: Entspricht der Bewegung bis an einen steilen Abhang; vermeidet das im Griechischen nicht zwingend ausgedrückte Hinabstürzen.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts
  choice: dieser Geist
  alternative: es / dieses
  rationale: Der Kontext und die englische Konsultationsfassung weisen auf einen zuvor genannten Geist; die Ergänzung macht den deutschen Satz verständlich, ohne eine zusätzliche Lehraussage einzuführen.
- issue: Bedeutung der Gegenüberstellung „letzter in der Schöpfung / erster in der Jugend“
  choice: formal offen wiedergegeben
  alternative: als zuletzt erschaffen und in der Jugend zuerst wirksam paraphrasieren
  rationale: Der griechische Wortlaut lässt die genaue Art von Reihenfolge oder Vorrang offen; eine ausdeutende Paraphrase würde diese Spannung vorschnell auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhafte Parallelität wurde bewahrt; der Komparativ „der Jüngere“ bleibt ausdrücklich erhalten.
