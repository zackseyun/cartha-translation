source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Πέμπτον πνεῦμα²² λαλιᾶς, μεθ’ ἧς γίνεται γνῶσις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/006.yaml
  text: The fifth is the spirit of speech, by which knowledge comes to be.
translation:
  language: de
  text: Das fünfte ist der Geist des Sprechens, durch den Erkenntnis entsteht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πέμπτον πνεῦμα
  choice: Das fünfte ist der Geist
  rationale: Die elliptische griechische Form wird im Deutschen durch »ist« ergänzt; »Geist« bewahrt die wiederkehrende anthropologische Begrifflichkeit.
- source_word: λαλιᾶς
  choice: der Sprache
  rationale: Bezeichnet hier das Vermögen beziehungsweise den Bereich des Sprechens; »Sprache« ist natürlich und weniger missverständlich als »Rede«.
- source_word: μεθ’ ἧς
  choice: durch die
  rationale: Gibt den instrumentalen Sinn der Verbindung wieder. Das feminine Relativpronomen bezieht sich grammatisch auf »Sprache«.
- source_word: γίνεται γνῶσις
  choice: Erkenntnis entsteht
  rationale: Bewahrt den Vorgangscharakter von γίνεται und gibt γνῶσις als »Erkenntnis« wieder, ohne den Satz zu einer bloßen Wissensvermittlung umzudeuten.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Aufzählungsform und die Aussage, dass Erkenntnis durch Sprache entsteht, bleiben erhalten.
