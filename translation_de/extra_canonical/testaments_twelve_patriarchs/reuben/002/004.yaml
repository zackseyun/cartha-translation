revisions:
- from: Das erste ist der Geist des Lebens, mit dem die leibliche Verfassung gebildet wird. Das zweite ist der Geist des Sehens, mit dem Begierde entsteht.
  to: Das erste ist der Geist des Lebens; mit diesem wird die Beschaffenheit geschaffen. Das zweite ist der Geist des Sehens; mit diesem entsteht Begierde.
  rationale: Die Revision entfernt die nicht ausdrücklich belegte körperliche Einengung von σύστασις und korrigiert den Bezugshinweis zu ἧς. Die demonstrative Wiederaufnahme „mit diesem“ lässt im Deutschen erkennen, dass jeweils „Leben“ bzw. „Sehen“ als nächstliegender femininer Bezug des griechischen Relativpronomens gemeint ist, während die parallele Formulierung erhalten bleibt.
