id: T12P.REU.2.4
reference: Testament of Reuben 2:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 66-79, Reuben pilot)
  text: Πρῶτον πνεῦμα ζωῆς, μεθ’ ἧς ἡ σύστασις¹⁶ κτίζεται. Δεύτερον πνεῦμα ὁράσεως, μεθ’ ἧς γίνεται ἐπιθυμία.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/004.yaml
  text: The first is the spirit of life, with which the constitution is formed. The second is the spirit of sight, with which desire arises.
translation:
  language: de
  text: Das erste ist der Geist des Lebens; mit diesem wird die Beschaffenheit geschaffen. Das zweite ist der Geist des Sehens; mit diesem entsteht Begierde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα ζωῆς
  choice: Geist des Lebens
  rationale: Gibt die Genitivverbindung formal und im Kontext der aufgezählten Geister verständlich wieder.
- source_word: σύστασις
  choice: leibliche Verfassung
  rationale: σύστασις bezeichnet hier die Zusammensetzung beziehungsweise Beschaffenheit des Menschen. „Leibliche“ verdeutlicht den anthropologischen Kontext, ohne die Bedeutung auf ein einzelnes Organ zu verengen.
- source_word: πνεῦμα ὁράσεως
  choice: Geist des Sehens
  rationale: Bewahrt die konkrete Sinnesbezeichnung und die parallele Form zu „Geist des Lebens“.
- source_word: ἐπιθυμία
  choice: Begierde
  rationale: Bewahrt die im Kontext wahrscheinliche Bedeutung eines sinnlich ausgelösten Verlangens; „Verlangen“ wäre neutraler, könnte aber die negative Spannung abschwächen.
- source_word: μεθ’ ἧς
  choice: mit dem
  rationale: Folgt der instrumentalen beziehungsweise begleitenden Formulierung des Griechischen, ohne sie stärker kausal als „durch den“ festzulegen.
theological_decisions:
- issue: Anthropologische Bedeutung von σύστασις
  choice: leibliche Verfassung
  alternative: Beschaffenheit / Zusammensetzung
  rationale: Die Übersetzung hält die Aussage auf die Bildung der menschlichen Konstitution bezogen und vermeidet eine dogmatische Festlegung über das Verhältnis von Leib, Seele und Geist.
- issue: Wertigkeit von ἐπιθυμία
  choice: Begierde
  alternative: Verlangen
  rationale: „Begierde“ entspricht dem wahrscheinlich problematischen Begehren im Zusammenhang mit dem Sehen, ohne ausdrücklich zu behaupten, jedes Verlangen sei sündhaft.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus der beiden Sätze und die wiederholte Wendung „mit dem“ spiegeln die griechische Struktur. Das grammatische Geschlecht des deutschen „Geist“ erfordert „dem“, während das griechische Relativpronomen sich formal auf das feminine πνεῦμα bezieht.
