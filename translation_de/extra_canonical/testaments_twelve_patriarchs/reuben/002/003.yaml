  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/003.yaml
  text: And seven other spirits were given to him at creation, so that every work of man might be in them.
translation:
  language: de
  text: Und sieben weitere Geister wurden ihm bei der Schöpfung gegeben, damit jedes Werk des Menschen in ihnen sei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἕτερα ἑπτὰ πνεύματα
  choice: sieben weitere Geister
  rationale: Gibt die Ergänzung zu zuvor genannten Geistern natürlich wieder; ἕτερα bezeichnet weitere, andersartige Glieder derselben Gruppe.
- source_word: ἐδόθη αὐτῷ
  choice: wurden ihm … gegeben
  rationale: Bewahrt den passiven Ausdruck und den singularischen Empfänger, der im Zusammenhang der Mensch ist.
- source_word: ἐπὶ τῆς κτίσεως
  choice: bei der Schöpfung
  rationale: Die Wendung wird temporal verstanden; dies entspricht dem Zusammenhang der Ausstattung des Menschen bei seiner Erschaffung.
- source_word: τοῦ εἶναι ἐν αὐτοῖς πᾶν ἔργον ἀνθρώπου
  choice: damit in ihnen jedes Werk des Menschen seinen Ort habe
  rationale: Der artikulierte Infinitiv bezeichnet hier Zweck bzw. Bestimmung. Die Ergänzung „seinen Ort“ macht das im Deutschen sonst harte „in ihnen sei“ verständlich, ohne festzulegen, ob die Geister Ursprung, Bereich oder Träger menschlichen Handelns sind.
theological_decisions:
- issue: Beziehung der sieben Geister zum menschlichen Handeln
  choice: „damit in ihnen jedes Werk des Menschen seinen Ort habe“
  alternative: „damit durch sie jedes Werk des Menschen geschehe“
  rationale: Das griechische ἐν bedeutet wörtlich „in“ und sollte nicht ohne Not kausal-instrumental als „durch“ aufgelöst werden. Die Formulierung bewahrt die ungewöhnliche räumlich-konzeptionelle Aussage und ihre theologische Offenheit.
- issue: Bedeutung von κτίσις
  choice: „Schöpfung“
  alternative: „Erschaffung“
  rationale: „Bei der Schöpfung“ kann sowohl den Schöpfungsvorgang als auch den Zeitpunkt der Erschaffung des Menschen bezeichnen und wahrt damit die Breite des griechischen Ausdrucks.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Stil. Die Satzstruktur bleibt eng am Griechischen, während „seinen Ort habe“ die Zielaussage idiomatisch verständlich macht. Keine Fußnoten erforderlich.
