base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002/005.yaml
  text: The third is the spirit of hearing, by which instruction comes to be. The fourth is the spirit of smell, by which tastes are given for the drawing in of air and breath[c].
translation:
  language: de
  text: Das Dritte ist der Geist des Hörens, durch den Unterweisung zustande kommt. Das Vierte ist der Geist des Riechens, durch den Geschmacksempfindungen zum Einziehen von Luft und Atem gegeben werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Verbindung von Riechen, Geschmacksempfindungen und dem Einziehen von Luft und Atem ist im griechischen Text schwer verständlich und könnte auf eine verkürzte oder textlich unsichere Formulierung zurückgehen.
    reason: textual_variant
lexical_decisions:
- source_word: πνεῦμα ἀκοῆς
  choice: Geist des Hörens
  rationale: Gibt die wiederkehrende anthropologische Formulierung formal wieder und bewahrt πνεῦμα als »Geist«.
- source_word: διδασκαλία
  choice: Unterweisung
  rationale: Bezeichnet hier das durch Hören vermittelte Lehren beziehungsweise Unterwiesenwerden; »Unterweisung« lässt diese Spannweite erkennen.
- source_word: πνεῦμα ὀσφρήσεως
  choice: Geist des Riechens
  rationale: Entspricht der parallelen Konstruktion des griechischen Textes und bezeichnet den Geruchssinn.
- source_word: γεύσεις δεδομέναι
  choice: Geschmacksempfindungen … gegeben sind
  rationale: Bewahrt den Wortsinn von γεύσεις und das passive δεδομέναι, ohne es glättend als »hervorgebracht« wiederzugeben.
- source_word: εἰς ὁλκὴν ἀέρος καὶ ἀναπνοῆς
  choice: zum Einziehen von Luft und Atem
  rationale: Gibt ὁλκή als Einziehen beziehungsweise Einsaugen wieder; die schwierige Verbindung von Luft und Atem bleibt erhalten.
