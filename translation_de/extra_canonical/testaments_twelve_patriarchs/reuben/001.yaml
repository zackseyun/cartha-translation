base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/001.yaml
  text: 'A copy of the testament of Reuben, what he commanded his sons before he died, in the one hundred and twenty-fifth year of his life.


    2 Two years after the death of Joseph his brother, when Reuben had fallen sick, the sons of Joseph and the sons of his sons were gathered to visit him. 3 And he said to them, “My children, behold, I am dying, and I am going the way of my fathers.” 4 Then, seeing there Judah and Gad and Asher, his brothers, he said to them, “Raise me up, so that I may tell my brothers and my children the things hidden in my heart; for behold, even now I am failing.” 5 And rising up, he kissed them and said to them, “Hear, my brothers and my sons; pay attention to Reuben your father in the things that I command you.


    6 “And behold, today I call the God of heaven to witness against you, that you not walk in the ignorance of youth and in sexual immorality, in which I was poured out and defiled the bed of my father Jacob. 7 And I tell you that he struck me with a severe blow in my loins for seven months; and if my father Jacob had not prayed for me to the Lord, the Lord would have been willing to destroy me. 8 For I was thirty years old when I did the evil thing before the Lord, and for seven months I was weakened to the point of death. 9 And after this, with the resolve of my soul, I repented before the Lord for seven years. 10 And I drank no wine or strong drink, and meat did not enter my mouth, and I ate no bread of desire; but I was mourning over my sin, for it was great—such a thing had not happened in Israel.”'
translation:
  language: de
  text: 'Eine Abschrift des Testaments Rubens: was er seinen Söhnen auftrug, bevor er starb, im hundertfünfundzwanzigsten Jahr seines Lebens.


    2 Zwei Jahre nach dem Tod seines Bruders Josef versammelten sich, als Ruben erkrankt war, die Söhne Josefs und die Söhne seiner Söhne, um ihn zu besuchen. 3 Er sagte zu ihnen: „Meine Kinder, seht, ich sterbe und gehe den Weg meiner Väter.“ 4 Als er dort Juda, Gad und Ascher, seine Brüder, sah, sagte er zu ihnen: „Richtet mich auf, damit ich meinen Brüdern und meinen Kindern sagen kann, was in meinem Herzen verborgen ist; denn seht, nun schwinden meine Kräfte.“ 5 Da richtete er sich auf, küsste sie innig und sagte zu ihnen: „Hört auf Ruben, euren Vater, und auf das, was ich euch auftrage.


    6 Seht, heute rufe ich den Gott des Himmels gegen euch zum Zeugen an: Lebt nicht in jugendlicher Unwissenheit und sexueller Unmoral, in die ich mich ergoss[a] und das Lager meines Vaters Jakob befleckte. 7 Ich sage euch: Er schlug mich sieben Monate lang mit einem schweren Schlag an der Hüfte[b]. Und wenn mein Vater Jakob nicht für mich zum Herrn gebetet hätte, hätte der Herr mich vernichten wollen. 8 Denn ich war dreißig Jahre alt, als ich vor dem Herrn das Böse tat, und sieben Monate lang war ich bis zum Tod entkräftet. 9 Danach kehrte ich aus festem Entschluss meiner Seele sieben Jahre lang vor dem Herrn um. 10 Ich trank weder Wein noch starkes Getränk, kein Fleisch kam in meinen Mund, und ich aß keinerlei Brot, nach dem mich verlangte[c]. Vielmehr trauerte ich über meine Sünde; denn sie war groß – etwas Derartiges war in Israel noch nicht geschehen.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in der ich ausgegossen wurde“. Das griechische Bild kann ein hemmungsloses Sich-Hingeben ausdrücken, bleibt aber ungewöhnlich.'
    reason: Das auffällige Bild von ἐξεχύθην soll sichtbar bleiben, zugleich benötigt die natürliche deutsche Formulierung eine Erläuterung.
  - marker: b
    text: 'Oder: „an der Flanke“ beziehungsweise „in der Lendengegend“.'
    reason: λαγών bezeichnet einen nicht ganz scharf abgegrenzten Bereich zwischen Flanke, Hüfte und Lende.
  - marker: c
    text: 'Wörtlich: „Brot des Verlangens“; möglicherweise ist besonders begehrte oder wohlschmeckende Nahrung gemeint.'
    reason: Die griechische Genitivverbindung ἄρτον ἐπιθυμίας ist mehrdeutig und sollte nicht auf eine einzige konkrete Speise festgelegt werden.
lexical_decisions:
- source_word: ἀντίγραφον διαθήκης
  choice: Eine Abschrift des Testaments
  rationale: Gibt sowohl den dokumentarischen Charakter von ἀντίγραφον als auch die Abschiedsverfügung von διαθήκη klar und würdig wieder.
- source_word: ἐπισκέψασθαι
  choice: um ihn zu besuchen
  rationale: Im Zusammenhang mit dem erkrankten Ruben ist „besuchen“ die natürliche deutsche Entsprechung; der fürsorgliche Beiklang bleibt erhalten.
- source_word: ἐξεχύθην
  choice: in die ich mich ergoss
  rationale: Bewahrt das ungewöhnliche, bildhafte Passiv des griechischen Textes, statt es vorschnell als bloßes „sich hinreißen lassen“ aufzulösen.
- source_word: λαγών
  choice: Hüfte
  rationale: Das Wort bezeichnet die Flanken-, Hüft- oder Lendengegend; „Hüfte“ ist verständlich, während eine Fußnote die körperliche Unschärfe wahrt.
- source_word: μετενόησα
  choice: kehrte ich … um
  rationale: Drückt Sinnesänderung und tätige Abkehr aus, ohne die Aussage auf bloßes Bedauern zu verengen.
- source_word: σίκερα
  choice: starkes Getränk
  rationale: Traditionelle und verständliche Wiedergabe für ein berauschendes Getränk neben Wein, ohne eine bestimmte Getränkesorte zu behaupten.
- source_word: ἄρτον ἐπιθυμίας
  choice: Brot, nach dem mich verlangte
  rationale: Erhält das konkrete „Brot“ und gibt den schwer bestimmbaren Genitiv als begehrte oder genussvolle Nahrung wieder.
theological_decisions:
- issue: Wer Ruben schlug (Vers 7)
  choice: „Er schlug mich“
  alternative: „Der Herr schlug mich“ oder „Gott schlug mich“
  rationale: Der griechische Text nennt beim Verb kein ausdrückliches Subjekt. Der folgende Satz nennt den Herrn, doch die Identifikation wird nicht stillschweigend in den ersten Satz eingetragen.
- issue: Art von Rubens Umkehr
  choice: „kehrte ich … vor dem Herrn um“
  alternative: „tat ich Buße“ oder „bereute ich“
  rationale: Die Formulierung bewahrt die religiöse Ausrichtung und die Dauer, ohne eine spätere konfessionelle Bußlehre einzutragen.
- issue: Rubens sexuelle Verfehlung
  choice: „sexuelle Unmoral … das Bett meines Vaters Jakob befleckte“
  alternative: eine ausdrückliche Nennung Bilhas oder eine genauere Beschreibung des Geschehens
  rationale: Der vorliegende Abschnitt selbst nennt die Frau nicht. Die Übersetzung belässt es bei der ausdrücklichen Aussage des Textes.
translation_notes:
  register: 'Modernes Standarddeutsch in würdigem, gut verständlichem Erzähl- und Mahnregister. „Seht“ bewahrt den wiederholten Aufmerksamkeitsruf ἰδού, ohne durchgehend altertümliches Deutsch zu verwenden. Die Verwandtschaftsangabe in Vers 2 folgt dem zusammenhängenden griechischen Satz: Rubens Söhne und seine Enkel versammeln sich; das isolierte „Ἰωσήφ.“ in der vorgelegten Editionsdarstellung ist als apparatbedingter Einschub behandelt, nicht als Satzglied.'
