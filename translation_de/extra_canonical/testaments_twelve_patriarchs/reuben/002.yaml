  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/reuben/002.yaml
  text: 'And now, my children, hear me concerning what I saw about the seven spirits of deceit[a] in my repentance. There were given, then, seven spirits set against man, and these are the heads of the works of youthfulness[b].


    And seven other spirits were given to him at creation, so that every work of man might be in them. The first is the spirit of life, by which a person’s constitution is formed. The second is the spirit of sight, by which desire comes to be. The third is the spirit of hearing, by which instruction comes to be. The fourth is the spirit of smell, by which tastes are produced for the drawing in of air and breath[c]. The fifth is the spirit of speech, by which knowledge comes to be. The sixth is the spirit of taste, by which the eating of foods and drinks comes to be, and strength is formed by it, because in foods is the basis of strength. The seventh is the spirit of procreation and intercourse, by which sins come together through the love of pleasure. Therefore this spirit is last in creation and first in youth, because it is filled with ignorance, and it leads the young man like a blind man into a pit, and like an animal over a cliff.'
translation:
  language: de
  text: 'Und nun, meine Kinder, hört, was ich bei meiner Umkehr über die sieben Geister der Irreführung[a] gesehen habe. Es wurden also sieben Geister gegen den Menschen gegeben; sie sind die Häupter der Werke jugendlichen Leichtsinns[b].


    Und sieben weitere Geister wurden ihm bei der Schöpfung gegeben, damit jedes Werk des Menschen in ihnen sei. Der erste ist der Geist des Lebens, durch den die Beschaffenheit des Menschen gebildet wird. Der zweite ist der Geist des Sehens, durch den Verlangen entsteht. Der dritte ist der Geist des Hörens, durch den Unterweisung entsteht. Der vierte ist der Geist des Riechens, durch den Geschmacksempfindungen zum Einziehen von Luft und Atem gegeben werden[c]. Der fünfte ist der Geist des Sprechens, durch den Erkenntnis entsteht. Der sechste ist der Geist des Schmeckens, durch den das Essen von Speisen und das Trinken von Getränken geschieht; durch ihn wird Kraft gebildet, denn in den Speisen liegt die Grundlage der Kraft. Der siebte ist der Geist der Zeugung und des Geschlechtsverkehrs, durch den durch die Liebe zur Lust Sünden zusammenkommen. Darum ist dieser Geist der letzte in der Schöpfung und der erste in der Jugend; denn er ist mit Unwissenheit erfüllt. Er führt den jungen Menschen
    wie einen Blinden in eine Grube und wie ein Tier über einen Abgrund.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Geister des Irrtums“, „Geister der Täuschung“ oder „Geister der Verblendung“.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: „die Häupter der Werke des jugendlichen Leichtsinns“. Gemeint sein können die führenden Ursprünge oder bestimmenden Kräfte jugendlicher Verfehlungen.'
    reason: lexical_alternative
  - marker: c
    text: Die griechische Formulierung über Riechen, Geschmack und das Einziehen von Luft und Atem ist schwer verständlich und möglicherweise verkürzt oder textlich unsicher überliefert.
    reason: textual_variant
lexical_decisions:
- source_word: πνευμάτων τῆς πλάνης
  choice: Geister der Verirrung
  rationale: πλάνη umfasst Irrtum, Irreführung und Verblendung. „Verirrung“ bewahrt die Mehrdeutigkeit zwischen einem Zustand des Irrens und einer Macht, die vom rechten Weg abbringt.
- source_word: ἐν τῇ μετανοίᾳ μου
  choice: während meiner Umkehr
  rationale: Im bekenntnishaften Zusammenhang bezeichnet μετανοία eine sittlich-religiöse Umkehr. Die temporale deutsche Wendung gibt zugleich den griechischen Rahmen wieder, ohne den Vorgang auf einen bloßen Gedankenwechsel zu reduzieren.
- source_word: κατὰ τοῦ ἀνθρώπου
  choice: gegen den Menschen eingesetzt
  rationale: κατά mit Genitiv bezeichnet hier Gegnerschaft; „eingesetzt“ verdeutlicht zusammen mit ἐδόθη die feindliche Ausrichtung, ohne ihren Urheber ausdrücklich zu bestimmen.
- source_word: αἱ κεφαλαὶ τῶν ἔργων τοῦ νεωτερισμοῦ
  choice: die Häupter der Werke jugendlichen Ungestüms
  rationale: „Häupter“ erhält die Metapher von leitenden Ursprüngen. νεωτερισμός kann Neuerung, jugendliche Unbesonnenheit oder Aufbegehren meinen; im Kontext passt „jugendliches Ungestüm“, während die ungewöhnliche Konstruktion in einer Fußnote erläutert wird.
- source_word: σύστασις
  choice: menschliche Gestalt
  rationale: σύστασις meint hier die Zusammensetzung beziehungsweise leibliche Bildung des Menschen. „Gestalt“ ist verständlich und vermeidet das im Deutschen stärker abstrakte „Konstitution“.
- source_word: ἐπιθυμία
  choice: Verlangen
  rationale: Der Ausdruck kann neutrales Begehren ebenso wie sündhafte Begierde bezeichnen. „Verlangen“ erhält diese Offenheit und legt ihn nicht vorschnell ausschließlich sexuell aus.
- source_word: διδασκαλία
  choice: Unterweisung
  rationale: Im Zusammenhang mit dem Hören steht der Empfang von Lehre im Vordergrund; „Unterweisung“ gibt dies würdig und verständlich wieder.
- source_word: γίνονται γεύσεις δεδομέναι εἰς ὁλκὴν ἀέρος καὶ ἀναπνοῆς
  choice: Geschmacksempfindungen zum Einziehen von Luft und Atem entstehen
  rationale: Die griechische Formulierung verbindet Riechen, Geschmack und Atmung auf schwer verständliche Weise. Die Übersetzung bleibt nahe an den überlieferten Begriffen und glättet die sachliche Schwierigkeit nicht.
- source_word: βρῶσις βρωμάτων τε καὶ πομάτων
  choice: Speisen und Getränke aufgenommen werden
  rationale: Die wörtliche figura etymologica „Essen von Speisen“ klingt im Deutschen unnötig schwerfällig. „aufgenommen werden“ gibt den Vorgang natürlich wieder und schließt Getränke ein.
- source_word: ἡ ὑπόστασις τῆς ἰσχύος
  choice: die Grundlage der Kraft
  rationale: ὑπόστασις bezeichnet hier den tragenden Grund oder die Grundlage körperlicher Kraft. „Substanz“ würde in diesem nichtlehrhaften Kontext unnötig spätere theologische Fachsprache anklingen lassen.
- source_word: σπορᾶς καὶ συνουσίας
  choice: Zeugung und Geschlechtsverkehr
  rationale: σπορά bezeichnet Fortpflanzung beziehungsweise Zeugung, συνουσία hier den geschlechtlichen Umgang. Die Übersetzung ist direkt, sachlich und nicht euphemistisch.
- source_word: διὰ τῆς φιληδονίας
  choice: infolge der Lustliebe
  rationale: φιληδονία ist die Liebe oder Hingabe an Lust und Vergnügen. „Lustliebe“ erhält die personprägende Neigung stärker als das bloße Wort „Lust“.
theological_decisions:
- issue: Bedeutung von μετανοία im testamentarischen Sündenbekenntnis
  choice: Umkehr
  alternative: Sinnesänderung; Reue
  rationale: Der Zusammenhang beschreibt Reubens moralische Abkehr von seiner Sünde. „Umkehr“ wahrt sowohl die innere Neuausrichtung als auch ihren ethischen Ernst, ohne eine konfessionell bestimmte Bußlehre einzutragen.
- issue: Status der sieben weiteren, bei der Schöpfung gegebenen Geister
  choice: Als Bestandteil des Haupttextes übersetzt
  alternative: Als sekundären Zusatz aussondern oder auslassen
  rationale: Der bereitgestellte griechische Text enthält den Abschnitt. Seine Überlieferungs- und Ausdrucksschwierigkeiten rechtfertigen keine stille Auslassung.
- issue: Mögliche schöpfungstheologische Aussage von ἐδόθη αὐτῷ
  choice: Passiv ohne ausdrücklich genannten Geber
  alternative: „Gott gab ihm“
  rationale: Der griechische Text nennt das handelnde Subjekt nicht. Die deutsche Passivform bewahrt diese Zurückhaltung und importiert keine ausdrückliche Zuschreibung.
- issue: Moralische Wertung der geschaffenen menschlichen Fähigkeiten
  choice: Die ersten sechs Fähigkeiten werden zunächst beschreibend, die siebte in ihrer Verbindung mit Lust und Sünde spannungsvoll wiedergegeben
  alternative: Alle sieben als an sich böse oder dämonisch bezeichnen
  rationale: Der Text unterscheidet die gegen den Menschen gerichteten Geister von den bei der Schöpfung gegebenen Fähigkeiten. Die Übersetzung bewahrt diese Spannung, statt die geschaffenen Fähigkeiten pauschal zu dämonisieren.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, testamentarisch-mahnendem Ton. Wiederholungen und die schematische Aufzählung wurden weitgehend erhalten; unnatürliche Nominalketten wurden nur dort gelöst, wo die deutsche Verständlichkeit es erforderte. Generisches ἄνθρωπος wird je nach Satz als „der Mensch“, „menschlich“ oder „junger Mensch“ wiedergegeben.
