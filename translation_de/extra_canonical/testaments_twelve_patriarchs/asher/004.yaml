revisions:
- from: '1 Denn gute Menschen sind aufrichtig und ohne Doppelgesicht[a]. Auch wenn die Doppelgesichtigen meinen, sie sündigten, sind sie vor Gott gerecht. 2 Viele, die die Bösen beseitigen, vollbringen zweierlei Werke, ein gutes und ein böses; doch das Ganze ist gut, weil man das Böse mit der Wurzel ausgerissen und vernichtet hat. 3 Da ist einer, der sowohl den Barmherzigen und Ungerechten hasst als auch den Ehebrecher und Fastenden. Auch dies hat zwei Gesichter; doch das ganze Werk ist gut, weil er den Herrn nachahmt und nicht das scheinbar Gute zusammen mit dem wahrhaft Guten gelten lässt[b]. 4 Ein anderer will mit den Ausschweifenden keine guten Tage erleben, damit er seinen Körper nicht entehrt und seine Seele nicht befleckt. Auch dies hat zwei Gesichter, ist aber als Ganzes gut. 5 Denn solche Menschen gleichen Gazellen und Hirschen: Ihrem Auftreten nach scheinen sie wie wilde Tiere unrein zu sein[c], doch als Ganze sind sie rein, weil sie in ihrem Eifer für den Herrn leben. Sie halten
    sich von dem fern, was auch Gott hasst und durch die Gebote verbietet, und halten so das Böse vom Guten fern[d].'
  to: '1 Denn gute Menschen sind aufrichtig, nicht doppelgesichtig[a]. Auch wenn sie von den Doppelgesichtigen für Menschen gehalten werden, die sündigen, sind sie vor Gott gerecht. 2 Viele, die die Bösen beseitigen, vollbringen zwei Werke, ein gutes und ein böses; doch das Ganze ist gut, weil sie das Böse mit der Wurzel ausgerissen und vernichtet haben. 3 Es gibt jemanden, der den Barmherzigen ebenso hasst wie den Ungerechten, den Ehebrecher ebenso wie den Fastenden. Auch das ist doppelgesichtig; doch das ganze Werk ist gut, weil er den Herrn nachahmt, ohne das scheinbar Gute zusammen mit dem wahrhaft Guten zu erwarten[b]. 4 Ein anderer will keine guten Tage mit den Ausschweifenden erleben, damit er seinen Körper nicht entehrt und seine Seele nicht befleckt. Auch das ist doppelgesichtig, aber ganz und gar gut. 5 Denn solche Menschen gleichen Gazellen und Hirschen: In ihrem Verhalten scheinen sie wie wilde Tiere unrein zu sein[c], doch sie sind durchaus rein, weil sie in Eifer für den Herrn
    leben. Sie halten sich von dem fern, was auch Gott hasst und durch die Gebote verbietet, und halten so das Böse vom Guten fern[d].'
  rationale: Die Korrektur folgt vorrangig dem griechischen Wortlaut. Sie bewahrt die Leitmetapher von Ein- und Doppelgesichtigkeit, vermeidet in Vers 3 eine nicht gedeckte inhaltliche Auslegung und gibt die totale Reinheit in Vers 5 idiomatisch wieder. Die Fußnoten bleiben an den passenden Stellen verankert und kennzeichnen die tatsächliche textliche und syntaktische Unsicherheit.
