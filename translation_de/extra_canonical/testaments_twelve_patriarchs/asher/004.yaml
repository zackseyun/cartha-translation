base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004.yaml
  text: '1 For good men[a], being single-faced, even if they are thought by the double-faced to be sinning, are righteous before God. 2 And many, in doing away with the wicked, perform two works, one good and one evil; yet the whole is good, because he has uprooted and destroyed the evil. 3 There is one who hates the merciful man and the unjust man, and the adulterer and the one who fasts; this too is double-faced, but the whole work is good, because he imitates the Lord, not expecting what only seems good together with what is truly good[b]. 4 Another does not wish to see good days with the wasteful, lest he defile his body and pollute his soul. Even though this is double-faced, yet it is wholly good. 5 For such men are like gazelles and deer: in the bearing of wild animals they seem to be unclean, but in every respect they are clean, because they walk in zeal for the Lord, keeping away from those things which God also hates and forbids through the commandments[d][c], thus holding back
    evil from good.'
translation:
  language: de
  text: '1 Denn gute Menschen sind aufrichtig, nicht doppelgesichtig[a]. Auch wenn sie von den Doppelgesichtigen für Menschen gehalten werden, die sündigen, sind sie vor Gott gerecht. 2 Viele, die die Bösen beseitigen, vollbringen zwei Werke, ein gutes und ein böses; doch das Ganze ist gut, weil sie das Böse mit der Wurzel ausgerissen und vernichtet haben. 3 Es gibt jemanden, der den Barmherzigen ebenso hasst wie den Ungerechten, den Ehebrecher ebenso wie den Fastenden. Auch das ist doppelgesichtig; doch das ganze Werk ist gut, weil er den Herrn nachahmt, ohne das scheinbar Gute zusammen mit dem wahrhaft Guten zu erwarten[b]. 4 Ein anderer will keine guten Tage mit den Ausschweifenden erleben, damit er seinen Körper nicht entehrt und seine Seele nicht befleckt. Auch das ist doppelgesichtig, aber ganz und gar gut. 5 Denn solche Menschen gleichen Gazellen und Hirschen: In ihrem Verhalten scheinen sie wie wilde Tiere unrein zu sein[c], doch sie sind durchaus rein, weil sie in Eifer für den
    Herrn leben. Sie halten sich von dem fern, was auch Gott hasst und durch die Gebote verbietet, und halten so das Böse vom Guten fern[d].'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „eingesichtig“ beziehungsweise „von einem Gesicht“; im Gegensatz zu den „Doppelgesichtigen“. Gemeint sind Menschen ohne innere Doppelheit.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Wortlaut ist hier textlich und syntaktisch unsicher. Wörtlicher lautet die schwierige Wendung etwa: „ohne das scheinbar Gute zusammen mit dem wahrhaft Guten zu erwarten“. Sie betont jedenfalls den Gegensatz zwischen scheinbarem und wirklichem Gut.'
    reason: textual_and_syntactical_uncertainty
  - marker: c
    text: Der Tiervergleich zielt wahrscheinlich auf den Gegensatz zwischen einem wild oder verdächtig wirkenden Äußeren und tatsächlicher Reinheit.
    reason: cultural_note
  - marker: d
    text: 'Der griechische Schlusssatz ist stark verdichtet und kann auch heißen: „wobei er das Böse vom Guten fernhält“.'
    reason: alternative_reading
lexical_decisions:
- source_word: μονοπρόσωποι
  choice: aufrichtig und ohne Doppelgesicht
  rationale: Bewahrt die leitende Gesichtsmetapher im Kontrast zu διπρόσωποι, ergänzt aber „aufrichtig“, damit die ungewöhnliche Wendung im modernen Deutschen verständlich bleibt.
- source_word: διπρόσωποι / διπρόσωπον
  choice: Doppelgesichtige / hat zwei Gesichter
  rationale: Die wiederkehrende Gesichtsmetapher bleibt sichtbar. Je nach Satzbau wird substantivisch oder prädikativ formuliert, ohne vorschnell auf „heuchlerisch“ zu verengen.
- source_word: ἀναιροῦντες
  choice: beseitigen
  rationale: Das Verb kann Töten, Vernichten oder Entfernen bezeichnen. „Beseitigen“ wahrt hier die Bedeutungsbreite.
- source_word: τὸ δὲ ὅλον καλόν
  choice: doch das Ganze ist gut
  rationale: Gibt die wiederkehrende Gesamtbewertung knapp und unmittelbar wieder.
- source_word: μιμεῖται Κύριον
  choice: er ahmt den Herrn nach
  rationale: Bewahrt den ausdrücklichen Gedanken der Nachahmung und übersetzt Κύριον als Titel.
- source_word: τὸ δοκοῦν καλὸν ... τοῦ ἀληθινοῦ καλοῦ
  choice: das scheinbar Gute ... das wahrhaft Gute
  rationale: Erhält den für die Argumentation entscheidenden Gegensatz zwischen äußerem Anschein und wirklicher Güte.
- source_word: ἀσώτων
  choice: Ausschweifende
  rationale: Bezeichnet sittlich zügellose oder verschwenderisch lebende Menschen; „Ausschweifende“ trägt die breitere moralische Bedeutung besser als nur „Verschwender“.
- source_word: αἰσχράνει ... μολυνεῖ
  choice: entehrt ... befleckt
  rationale: Die beiden unterschiedlichen Verben und der Parallelismus von Körper und Seele bleiben erhalten.
- source_word: δορκάσι καὶ ἐλάφοις
  choice: Gazellen und Hirsche
  rationale: Natürliche deutsche Tierbezeichnungen, die die Unterscheidung im Griechischen wahren.
- source_word: ἐν ἤθει ἀγρίων
  choice: ihrem Auftreten nach ... wie wilde Tiere
  rationale: Gibt die äußere Erscheinungs- oder Verhaltensweise wieder, aufgrund deren ein falsches Urteil entsteht.
- source_word: ἐν ζήλῳ Κυρίου
  choice: in ihrem Eifer für den Herrn
  rationale: Versteht den Genitiv als Zielrichtung menschlichen Eifers und formuliert dies im Deutschen eindeutig.
- source_word: ἀπείργων τὸ κακὸν τοῦ ἀγαθοῦ
  choice: das Böse vom Guten fernhalten
  rationale: Bewahrt die komprimierte räumliche Metapher, ohne sie zu einer stärkeren Aussage über absolute Trennung auszubauen.
theological_decisions:
- issue: Moralische Bewertung von Handlungen, die gemischt oder „zweigesichtig“ erscheinen
  choice: Der Text unterscheidet zwischen äußerlich zweideutig oder hart erscheinenden Handlungen und echter Doppelzüngigkeit; eine Handlung kann in ihrer Gesamtausrichtung gut sein, wenn sie das Böse beseitigt.
  alternative: Jede Form von Zweiheit wird ausnahmslos verurteilt; oder der Text billigt pauschal böse Mittel für gute Zwecke.
  rationale: Die wiederholte Aussage, etwas habe zwei Gesichter und sei dennoch als Ganzes gut, muss in ihrer Spannung stehen bleiben. Die Übersetzung verschärft sie weder zu einem allgemeinen Zweck-heiligt-die-Mittel-Satz noch glättet sie zu einer Verurteilung aller scheinbaren Zweiheit.
- issue: Bezug von Κύριον im jüdischen Testamentkontext
  choice: der Herr
  alternative: Gott; der HERR
  rationale: Der griechische Zeuge bietet Κύριον. Die Titelübersetzung „der Herr“ bleibt quellennah und trägt keine spätere christologische Spezifizierung ein.
- issue: Schwieriger Sinn von Vers 3
  choice: Der Betreffende lehnt jeweils auch das scheinbar Gute ab, wenn es mit wirklichem Unrecht verbunden ist, und lässt das scheinbar Gute nicht neben dem wahrhaft Guten gelten.
  alternative: Er erwartet das scheinbar Gute nicht zusammen mit dem wahrhaft Guten; oder er verwechselt beide Arten des Guten nicht.
  rationale: Der griechische Wortlaut ist textlich und syntaktisch unsicher. Die Hauptfassung folgt dem Kontrast von scheinbarem und wahrem Gut, ohne die zugrunde liegende Schwierigkeit zu verbergen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltener Gesichtsmetapher. Ungewöhnliche oder textlich unsichere Formulierungen werden im Haupttext lesbar wiedergegeben und in den Fußnoten offengelegt. Die Verszählung und sämtliche Fußnotenmarker sind im Text enthalten.
