review_pass:
  verdict: revise
  source_fidelity: Eine sichere Überarbeitung ist nötig, vor allem in Vers 3. „nicht ... gelten lässt“ gibt προσδοκώμενος („erwartend“) nicht wieder und legt einen zusätzlichen Sinn fest. In Vers 5 ist τὸ δὲ πᾶν als „doch sie sind durchaus rein“ besser getroffen als „doch als Ganze sind sie rein“. Die übrigen schwierigen Aussagen, insbesondere die moralische Spannung und die unsichere Syntax in Vers 3, bleiben bewusst unaufgelöst.
  naturalness: Die Revision verwendet einheitlich „doppelgesichtig“, erhält damit die Metapher, und glättet unnatürliche Bezüge wie „Auch dies hat zwei Gesichter“. „Für Menschen gehalten werden, die sündigen“ bildet die griechische Infinitivkonstruktion klar ab.
  terminology: „Herr“, „Barmherziger“, „Ehebrecher“, „Fastender“, „Ausschweifende“, „Gazellen und Hirsche“ und die Reinheitssprache sind angemessen. „Doppelgesichtig“ ist im Deutschen markiert, wird aber absichtlich als wiederkehrende Leitmetapher beibehalten und erläutert.
  issues:
  - severity: medium
    issue: 'Vers 3: „und nicht das scheinbar Gute zusammen mit dem wahrhaft Guten gelten lässt“'
    rationale: Der griechische, zudem textlich unsichere Ausdruck enthält προσδοκώμενος, „erwartend“, nicht die Aussage, etwas „gelten zu lassen“. Die Fassung deutet den schwierigen Satz zu stark aus.
  - severity: medium
    issue: 'Vers 5: „doch als Ganze sind sie rein“'
    rationale: τὸ δὲ πᾶν bezeichnet hier die umfassende bzw. völlige Reinheit der genannten Menschen, nicht eine abstrakte Gesamtheit. „Durchaus rein“ gibt dies idiomatisch wieder.
  - severity: low
    issue: 'Vers 2: Wechsel von pluralischem Subjekt zu „weil man ... hat“'
    rationale: Der unpersönliche Singular verwischt den Bezug zu „Viele“. Ein pluralischer Bezug ist im Deutschen klarer, ohne die Aussage zu ändern.
  - severity: low
    issue: Uneinheitliche Wiedergabe der Gesichtsmetapher
    rationale: „ohne Doppelgesicht“, „Doppelgesichtige“ und „hat zwei Gesichter“ sind verständlich, aber die bewusst wiederholte griechische Terminologie wird mit „aufrichtig/eingesichtig“ und „doppelgesichtig“ klarer als Kontrast geführt.
