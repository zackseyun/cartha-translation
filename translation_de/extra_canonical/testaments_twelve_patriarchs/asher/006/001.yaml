source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: VI. Προσέχετε οὖν *καὶ ὑμεῖς, τέκνα μου¹, *τὰς ἐντολὰς² Κυρίου³ μονοπροσώπως *ἀκολουθοῦντες τῇ ἀληθείᾳ⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/001.yaml
  text: Therefore take heed, you also, my children, following the commandments of the Lord with singleness of purpose, in truth.
translation:
  language: de
  text: Darum achtet auch ihr, meine Kinder, auf die Gebote des Herrn und folgt der Wahrheit mit ungeteiltem Herzen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Προσέχετε
  choice: achtet ... auf
  rationale: Gibt den imperativischen Aufruf zu wachsamer Beachtung in natürlichem, modernem Deutsch wieder.
- source_word: τὰς ἐντολὰς Κυρίου
  choice: die Gebote des Herrn
  rationale: Entspricht der üblichen und sachlich genauen Wiedergabe der griechischen Wendung.
- source_word: μονοπροσώπως
  choice: mit ungeteiltem Herzen
  rationale: Das seltene Adverb bezeichnet eine ungeteilte, auf eine einzige Ausrichtung konzentrierte Haltung; die idiomatische deutsche Formulierung bewahrt diesen Sinn, ohne bloß äußerlich ein 'Gesicht' einzutragen.
- source_word: ἀκολουθοῦντες τῇ ἀληθείᾳ
  choice: und folgt der Wahrheit
  rationale: 'Der Dativ τῇ ἀληθείᾳ hängt am Partizip ἀκολουθοῦντες: Die Angesprochenen sollen der Wahrheit folgen. Die finite Koordination ist im Deutschen klar und natürlich.'
theological_decisions:
- issue: Bezug von μονοπροσώπως
  choice: Das Adverb beschreibt die innere Haltung beim Folgen der Wahrheit.
  alternative: Es könnte im Deutschen enger auf das Beachten beziehungsweise Befolgen der Gebote bezogen werden.
  rationale: Die griechische Wortstellung stellt μονοπροσώπως unmittelbar zum Partizip ἀκολουθοῦντες; zugleich prägt die ungeteilte Ausrichtung den gesamten Aufruf. Die Übersetzung wahrt diese Verbindung, ohne eine zusätzliche dogmatische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede „meine Kinder“ und der Gottesname-Titel „der Herr“ bleiben traditionsnah; „mit ungeteiltem Herzen“ macht die seltene griechische Ausdrucksweise für heutige Leser verständlich.
