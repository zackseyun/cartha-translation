source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: ⌈Ὑμεῖς οὖν, τέκνα μου⁷ᵃ, τὸν νόμον Κυρίου⁹ φυλάξατε· καὶ¹⁰ μὴ προσέχετε *τῷ κακῷ ὡς καλῷ¹¹, ἀλλὰ κατὰ¹² τὸ ὄντως⁹ καλὸν¹³ ἀποβλέπετε, καὶ διατηρεῖτε αὐτὸ ἐν πάσαις ταῖς¹⁴ ἐντολαῖς Κυρίου, εἰς αὐτὸ¹⁵ ἀναστρεφόμενοι, καὶ ἐν αὐτῷ καταπαύοντες¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/003.yaml
  text: You therefore, my children, keep the law of the Lord, and do not look upon evil as good; but look instead to what is truly good, and keep it in all the commandments of the Lord, turning toward it and resting in it.
translation:
  language: de
  text: Darum, meine Kinder, haltet das Gesetz des Herrn und achtet nicht auf das Böse, als wäre es gut; vielmehr blickt auf das, was wirklich gut ist, und bewahrt es in allen Geboten des Herrn, indem ihr euch ihm zuwendet und in ihm ruht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξατε
  choice: haltet
  rationale: Im Zusammenhang mit dem Gesetz bezeichnet das Verb dessen treue Befolgung und Bewahrung; „haltet das Gesetz“ ist dafür im Deutschen natürlich und präzise.
- source_word: μὴ προσέχετε τῷ κακῷ ὡς καλῷ
  choice: Achtet nicht auf das Böse, als wäre es gut
  rationale: Bewahrt die Aufmerksamkeitsbedeutung von προσέχειν und gibt ὡς καλῷ als nichtwirkliche Einstufung verständlich wieder.
- source_word: τὸ ὄντως καλόν
  choice: das, was wirklich gut ist
  rationale: Gibt ὄντως ausdrücklich wieder und lässt καλόν allgemein-substantivisch stehen, ohne es auf eine bestimmte Lehre oder Handlung einzuengen.
- source_word: διατηρεῖτε αὐτό
  choice: Haltet daran fest
  rationale: διατηρεῖν bezeichnet anhaltendes Bewahren; die idiomatische Formulierung vermeidet das missverständliche sachliche „bewahrt es“.
- source_word: εἰς αὐτὸ ἀναστρεφόμενοι
  choice: richtet euer Leben danach aus
  rationale: ἀναστρέφεσθαι kann die Lebensführung bezeichnen; mit εἰς αὐτό ist eine auf das wahrhaft Gute ausgerichtete Lebensweise gemeint. Die Wiedergabe ist natürlicher und inhaltlich tragfähiger als ein rein räumliches „wendet euch ihm zu“.
- source_word: ἐν αὐτῷ καταπαύοντες
  choice: findet darin Ruhe
  rationale: Bewahrt das Bild des Ruhens und gibt die fortdauernde Orientierung am wahrhaft Guten in verständlichem Deutsch wieder.
theological_decisions:
- issue: Bezug der Pronomen αὐτό / αὐτῷ
  choice: Bezug auf „das, was wirklich gut ist“
  alternative: Bezug auf das Gesetz oder auf die Gesamtheit der Gebote
  rationale: Das unmittelbar vorausgehende substantivierte τὸ ὄντως καλόν ist grammatisch und gedanklich der naheliegendste Bezug; die Formulierung lässt zugleich den engen Zusammenhang mit Gesetz und Geboten bestehen.
- issue: Bedeutung von ἀναστρεφόμενοι
  choice: ethisch verstandene Lebensausrichtung
  alternative: „wendet euch ihm zu“ als Bewegungs- oder Hinwendungsbild
  rationale: Der häufige Gebrauch von ἀναστρέφεσθαι für Lebensführung und Verhalten spricht hier für eine ethische Nuance. Die Zielangabe εἰς αὐτό bleibt durch „danach aus“ erkennbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter väterlicher Anrede. Die Satzfolge wurde leicht gegliedert, damit die dichte griechische Mahnrede für heutige Leser klar bleibt, ohne ihre inhaltlichen Verknüpfungen aufzulösen.
