source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἐὰν δὲ *ἔστω ἥσυχος²⁸ *ἐν χαρᾷ²⁹ †γνωρίζει³⁰ τὸν ἄγγελον τῆς εἰρήνης, *καὶ εἰσφέρει αὐτὸν εἰς ζωὴν αἰώνιον³¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/006.yaml
  text: But if it is at rest in joy, it recognizes the angel of peace, and he brings it into eternal life.
translation:
  language: de
  text: Wenn der Sinn aber in Freude ruhig ist, erkennt er den Engel des Friedens, und dieser führt ihn in das ewige Leben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔστω ἥσυχος
  choice: zur Ruhe gekommen ist
  rationale: Gibt den Zustand der Ruhe natürlich wieder. Die überlieferte Formulierung ist textkritisch auffällig; das im Zusammenhang vorausgesetzte Subjekt ist die Seele.
- source_word: ἐν χαρᾷ
  choice: in Freude
  rationale: Bewahrt die knappe modale beziehungsweise zuständliche Wendung des Griechischen, ohne sie enger auszudeuten.
- source_word: γνωρίζει
  choice: erkennt
  rationale: Entspricht hier dem Erkennen beziehungsweise Wiedererkennen des Engels und ist im Deutschen natürlicher als „kennt“.
- source_word: ὁ ἄγγελος τῆς εἰρήνης
  choice: der Engel des Friedens
  rationale: Formale und idiomatische Wiedergabe der griechischen Genitivverbindung.
- source_word: εἰς ζωὴν αἰώνιον
  choice: in das ewige Leben hinein
  rationale: Das Richtungsgefüge εἰς wird ausdrücklich bewahrt.
theological_decisions:
- issue: Subjekt und Objekt von εἰσφέρει αὐτόν
  choice: '„sie … führt ihn“: Die Seele bleibt Subjekt, der Engel ist Objekt.'
  alternative: '„er führt sie“: Der Engel führt die Seele in das ewige Leben.'
  rationale: Die unmittelbar vorliegende griechische Syntax setzt das unausgesprochene Subjekt fort und bezeichnet das Objekt mit dem maskulinen αὐτόν, das zu „Engel“ passt. Die kontextuell naheliegende Umkehrung wird nicht stillschweigend in den Haupttext übernommen, sondern in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das vorausgesetzte feminine Subjekt „die Seele“ wird durch „sie“ aufgenommen. Die textkritisch schwierige Syntax wird im Haupttext quellennah wiedergegeben und in der Fußnote transparent erläutert.
