revisions:
- from: Denn das Lebensende der Menschen offenbart ihre Gerechtigkeit und wird den Engeln des Herrn und denen Beliars bekannt.
  to: Denn die Lebensenden der Menschen zeigen ihre Gerechtigkeit und werden den Engeln des Herrn und den Engeln Beliars bekannt.
  rationale: Die Revision stellt die im griechischen Ausgangstext durchgehend vorhandene Pluralstruktur wieder her und behält die sachlich richtige Zuordnung zweier Engelgruppen bei. Sie folgt damit auch der englischen Audit-Fassung, ohne deren unidiomatischen Ausdruck „ends“ mechanisch zu übernehmen. Für die im Editionszitat sichtbaren textkritischen Siglen liegen keine zugehörigen Anmerkungstexte vor; daher werden keine Fußnoten rekonstruiert oder inhaltlich ergänzt.
