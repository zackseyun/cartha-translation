base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/004.yaml
  text: For the ends of men reveal their righteousness, and they are made known to the angels of the Lord and to Beliar.
translation:
  language: de
  text: Denn die Lebensenden der Menschen zeigen ihre Gerechtigkeit und werden den Engeln des Herrn und den Engeln Beliars bekannt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ τέλη τῶν ἀνθρώπων
  choice: das Lebensende der Menschen
  rationale: τὰ τέλη bezeichnet hier die Enden beziehungsweise letzten Ausgänge menschlichen Lebens. Der kollektive Singular ist im Deutschen natürlicher als das ungebräuchliche „die Lebensenden“, ohne den Sinn auf bloße Folgen einzuengen.
- source_word: δεικνύουσι
  choice: offenbart
  rationale: Das Verb bedeutet „zeigen, sichtbar machen“. „Offenbart“ gibt den feststellenden Charakter in einem würdigen, natürlichen Register wieder.
- source_word: τὴν δικαιοσύνην αὐτῶν
  choice: ihre Gerechtigkeit
  rationale: δικαιοσύνη wird bewusst mit „Gerechtigkeit“ wiedergegeben; die Formulierung lässt offen, ob das Ende eine vorhandene Gerechtigkeit erweist oder ihren wahren Charakter sichtbar macht.
- source_word: γνωρίζονται
  choice: wird … bekannt
  rationale: Die passive Form wird beibehalten. Als grammatisches Subjekt wird weiterhin das Lebensende verstanden, nicht stillschweigend die Menschen oder ihre Gerechtigkeit.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Die griechische Namensform wird als „Beliar“ übernommen und nicht an die geläufigere Nebenform „Belial“ angeglichen.
theological_decisions:
- issue: Zuordnung der Engel in τοῖς ἀγγέλοις Κυρίου, καὶ τοῦ Βελίαρ
  choice: den Engeln des Herrn und denen Beliars
  alternative: den Engeln des Herrn und Beliar
  rationale: Die beiden Genitive Κυρίου und τοῦ Βελίαρ hängen am Dativ „den Engeln“. Die elliptische Wiederaufnahme durch „denen“ macht im Deutschen deutlich, dass sowohl der Herr als auch Beliar jeweils Engeln zugeordnet sind; Beliar selbst ist nicht der zweite Dativempfänger.
- issue: Aussage über die Gerechtigkeit
  choice: offenbart ihre Gerechtigkeit
  alternative: zeigt, ob sie gerecht sind
  rationale: Die substantivische Aussage des Griechischen wird erhalten. Die Alternative würde die positive Formulierung in eine offene Prüfung umdeuten und damit die theologische Spannung auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der schwerfällige griechische Plural „die Enden der Menschen“ wird als kollektiver Singular „das Lebensende der Menschen“ wiedergegeben. Die Parallelität der Engelgruppen wird ausdrücklich, aber knapp markiert.
