    issue: „So ahmen sie“ fügt eine konsekutive Beziehung ein.
    rationale: Die Partizipien μιμούμενοι und συναγωνιζόμενοι sind im griechischen Satz in die mit ὅτι eingeleitete Begründung eingebunden; „So“ kann den Eindruck erwecken, das Nachahmen sei erst eine Folge des zuvor genannten Tuns und Zustimmens.
  revised_text: Denn die Doppelgesichtigen werden doppelt bestraft[a], weil sie Böses tun und denen zustimmen, die es tun, indem sie die Geister der Verirrung nachahmen und gegen die Menschen kämpfen.
