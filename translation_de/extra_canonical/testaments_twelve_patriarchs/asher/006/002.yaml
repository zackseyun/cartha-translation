  verdict: revise
  source_fidelity: 'Die zentrale Aussage wird zutreffend wiedergegeben: διπρόσωποι, δισσῶς κολάζονται, das Tun des Bösen, die zustimmende Billigung anderer und die Geister der πλάνη sind sachgerecht erfasst. Die textkritische Unsicherheit bei κολάζονται ist korrekt durch eine Anmerkung markiert. Allerdings macht „So ahmen sie“ die beiden griechischen Partizipien unnötig zu einer Folgerung aus dem vorangehenden Verhalten. Im Griechischen stehen sie innerhalb der Begründung und beschreiben das Verhalten der Doppelgesichtigen weiter.'
  naturalness: „Doppelgesichtigen“ ist als bewusst bildhafte, würdige Bezeichnung verständlich, wenn auch ungewöhnlich, und kann zur Wahrung des griechischen Bildes stehen bleiben. Die überarbeitete Satzfügung ist im modernen Standarddeutsch flüssig und bildet die logische Einbindung der Partizipien genauer ab.
  terminology: „Böses“, „zustimmen“, „Geister der Verirrung“ und „gegen die Menschen kämpfen“ geben die griechischen Ausdrücke angemessen und ohne konfessionelle Festlegung wieder. „Verirrung“ bewahrt die Offenheit von πλάνη.
  issues:
