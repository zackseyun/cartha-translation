source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ὅτι οἱ διπρόσωποι δισσῶς †κολάζονται⁵, ⌜Ὅτι καὶ πράσσουσι τὸ κακόν, καὶ συνευδοκοῦσι τοῖς πράσσουσιν⁶, *μιμούμενοι τὰ πνεύματα τῆς πλάνης καὶ κατὰ τῶν ἀνθρώπων συναγωνιζόμενοι⁷.⌝
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/002.yaml
  text: For the double-faced are punished doubly, because they both do evil and approve those who do it, imitating the spirits of deceit and contending against men.
translation:
  language: de
  text: Denn die Doppelgesichtigen werden doppelt bestraft[a], weil sie Böses tun und denen zustimmen, die es tun, indem sie die Geister der Verirrung nachahmen und gegen die Menschen kämpfen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb »werden bestraft« ist in der überlieferten Textgestalt unsicher.
    reason: Die Edition kennzeichnet κολάζονται mit einem textkritischen Kreuz; die Fußnote macht die Unsicherheit transparent, ohne eine unbelegte Lesart einzusetzen.
lexical_decisions:
- source_word: διπρόσωποι
  choice: die Doppelgesichtigen
  rationale: Bewahrt das konkrete Bild von Menschen mit »zwei Gesichtern« und damit den Vorwurf der Zwiespältigkeit, ohne ihn auf eine einzelne moderne Deutung wie »Heuchler« zu verengen.
- source_word: δισσῶς κολάζονται
  choice: werden doppelt bestraft
  rationale: Gibt Wortspiel und Parallelität zwischen διπρόσωποι und δισσῶς klar wieder; die textkritische Unsicherheit beim Verb wird in der Fußnote angezeigt.
- source_word: συνευδοκοῦσι
  choice: stimmen … zu
  rationale: Bezeichnet die billigende Zustimmung zum Tun anderer, nicht bloß neutrales Gefallen oder passives Beobachten.
- source_word: τὰ πνεύματα τῆς πλάνης
  choice: die Geister der Verirrung
  rationale: »Verirrung« bewahrt die Spannweite von πλάνη zwischen Irreführung, Irrtum und Abweichen; »Täuschung« wäre enger.
- source_word: συναγωνιζόμενοι
  choice: kämpfen gemeinsam
  rationale: Erhält das Präfix συν- und beschreibt ein gemeinsames Vorgehen beziehungsweise Mitkämpfen gegen Menschen.
theological_decisions:
- issue: Art und Zeitpunkt der Strafe
  choice: »werden doppelt bestraft« ohne nähere Bestimmung
  alternative: eine ausdrückliche endzeitliche oder gegenwärtige Strafe
  rationale: Der griechische Satz bestimmt weder Zeitpunkt noch genaue Art der Strafe; die Übersetzung lässt diese Offenheit bestehen.
- issue: Identität der »Geister der Verirrung«
  choice: die Bezeichnung wörtlich und unbestimmt belassen
  alternative: sie ausdrücklich als Dämonen oder böse Geister identifizieren
  rationale: Der Text nennt sie πνεύματα, legt ihre genaue ontologische Einordnung hier jedoch nicht weiter aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das ungewöhnliche, aber verständliche »Doppelgesichtigen« bewahrt das Leitbild und das Wortspiel des griechischen Textes; die übrige Syntax ist für heutige Leser leicht gegliedert.
