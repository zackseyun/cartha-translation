base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006/005.yaml
  text: For when a wicked soul departs, it is tormented by the evil spirit, which also enslaved it in lusts and wicked deeds.
translation:
  language: de
  text: Denn wenn eine böse Seele aus dem Leben scheidet, wird sie von dem bösen Geist gequält, dem sie auch durch Begierden und böse Taten gedient hat.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut ist an dieser Stelle unsicher. Wörtlich steht ein sächliches Relativpronomen, das formal auf »Geist« bezogen werden kann, während »dienen« normalerweise die Seele als handelndes Subjekt und den Geist als denjenigen voraussetzt, dem sie dient. Daher ist auch eine Wiedergabe erwogen worden wie: »… von dem bösen Geist gequält, der ebenfalls in Begierden und bösen Taten Knechtsdienst tat.«'
    reason: Die überlieferte Konstruktion ὃ καὶ ἐδούλευεν ist grammatisch und inhaltlich mehrdeutig bzw. möglicherweise verderbt; die Fußnote bewahrt diese echte textliche Spannung.
lexical_decisions:
- source_word: πονηρὰ ἡ ψυχή
  choice: eine böse Seele
  rationale: Gibt die moralische Wertung von πονηρά direkt und in natürlichem Deutsch wieder.
- source_word: ἀπέρχεται
  choice: aus dem Leben scheidet
  rationale: Im Zusammenhang mit dem Ergehen der Seele bezeichnet das schlichte »weggeht« den Tod; die gewählte Formulierung macht den gemeinten Vorgang verständlich, ohne eine zusätzliche Jenseitslehre einzutragen.
- source_word: βασανίζεται
  choice: wird … gequält
  rationale: Bewahrt das Passiv und den starken Sinn von βασανίζω.
- source_word: ὑπὸ τοῦ πονηροῦ πνεύματος
  choice: von dem bösen Geist
  rationale: Entspricht der persönlichen Urheberschaft der ὑπό-Konstruktion; »Geist« bleibt gegenüber möglichen Deutungen offen.
- source_word: ἐδούλευεν
  choice: gedient hat
  rationale: δουλεύω bedeutet gewöhnlich »als Sklave dienen, dienen« und ist nicht das kausative »versklaven«. Das deutsche »dienen« bewahrt hier das Verhältnis der Unterordnung, ohne die Verbform in ein transitives »versklaven« umzudeuten.
- source_word: ἐν ἐπιθυμίαις καὶ ἔργοις πονηροῖς
  choice: durch Begierden und böse Taten
  rationale: »Durch« gibt die Weise bzw. den Lebensbereich des Dienens idiomatisch wieder. ἐπιθυμίαις wird neutral genug mit »Begierden« wiedergegeben; πονηροῖς bestimmt ausdrücklich nur die Taten als böse.
theological_decisions:
- issue: Verhältnis der Seele zum bösen Geist
  choice: Die Seele hat dem bösen Geist gedient und wird nach ihrem Tod von ihm gequält.
  alternative: Der böse Geist hat die Seele in Begierden und bösen Taten versklavt.
  rationale: Die Alternative folgt der englischen Revisionsfassung, verlangt aber für ἐδούλευεν einen kausativ-transitiven Sinn, den das griechische Verb normalerweise nicht trägt. Wegen der auffälligen Form des Relativpronomens wird die Unsicherheit in einer Fußnote offengelegt.
- issue: Bedeutung von ἀπέρχεται
  choice: Tod als kontextuell gemeintes Scheiden aus dem Leben
  alternative: bloßes Fortgehen der Seele
  rationale: Der Satz spricht von der anschließenden Qual der Seele; »aus dem Leben scheidet« macht diesen Zusammenhang deutlich, ohne Ort, Zeitpunkt oder Art des Gerichts näher festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt knapp und mahnend. »Aus dem Leben scheidet« ist allgemein verständlicher als ein bloßes »weggeht«; »gedient hat« vermeidet sowohl altertümliche Sprache als auch die nicht hinreichend belegte kausative Wiedergabe »versklavte«.
