review_pass:
  verdict: revise
  source_fidelity: Die Hauptfassung deutet das auffällige sächliche Relativpronomen als korrigiertes Dativobjekt („dem sie ... gedient hat“). Im vorliegenden griechischen Text bezieht sich ὃ jedoch formal auf πνεῦμα und ist Subjekt von ἐδούλευεν. Da die Stelle ausdrücklich als unsicher markiert ist, soll die Übersetzung diese Lesart nicht stillschweigend emendieren. Die englische Audit-Fassung „which also enslaved it“ ist ebenfalls keine unmittelbare Wiedergabe von ἐδούλευεν, das hier nicht transitiv-kausativ belegt ist.
  naturalness: Die revidierte Formulierung bleibt modernes, würdiges Standarddeutsch. „In Begierden und bösen Taten diente“ bildet ἐν genauer ab als „durch“ und ist trotz der inhaltlich schwierigen Aussage verständlich. „Aus dem Leben scheidet“ ist im Kontext des Ergehens der Seele eine angemessene, nicht übermäßig spezifizierende Wiedergabe von ἀπέρχεται.
  terminology: „Böse Seele“, „böser Geist“ und „gequält“ geben πονηρά ψυχή, πονηρόν πνεῦμα und βασανίζεται angemessen wieder. „Diente“ gibt δουλεύω als Unterordnungs-/Sklavendienst wieder, ohne den nicht gesicherten kausativen Sinn „versklavte“ einzutragen.
  issues:
  - severity: medium
    issue: Die Hauptübersetzung macht aus dem formal auf „Geist“ bezogenen Relativpronomen ein Dativobjekt der Seele.
    rationale: ὃ ist Neutrum Singular und stimmt mit πνεῦμα überein; die Fassung „dem sie ... gedient hat“ setzt faktisch ᾧ voraus. Die textkritische Schwierigkeit darf erläutert, aber nicht in der Hauptfassung ohne Kennzeichnung aufgelöst werden.
  - severity: medium
    issue: Die englische Audit-Entscheidung „enslaved it“ wird indirekt bevorzugt behandelt, obwohl sie vom überlieferten griechischen Verb abweicht.
    rationale: ἐδούλευεν bedeutet gewöhnlich „diente/leistete Sklavendienst“ und ist hier nicht als transitives „versklavte [sie]“ belegt. Die deutsche Übersetzung soll dem griechischen Text vor dem englischen Audit-Trail folgen.
  - severity: low
    issue: „Durch Begierden und böse Taten“ glättet ἐν zu stark.
    rationale: „In Begierden und bösen Taten“ erhält die lokale bzw. sphärische Formulierung des Griechischen und vermeidet eine zusätzliche instrumentale Nuance.
  revised_text: Denn wenn eine böse Seele aus dem Leben scheidet, wird sie von dem bösen Geist gequält, der auch in Begierden und bösen Taten diente.[a]
  revised_footnotes:
  - marker: a
    text: 'Der griechische Wortlaut ist an dieser Stelle unsicher. Das sächliche Relativpronomen bezieht sich formal auf »Geist«; danach wäre der böse Geist derjenige, der »in Begierden und bösen Taten diente«. Inhaltlich liegt jedoch möglicherweise eine Textverderbnis vor. Eine vermutete Lesart würde ergeben: »… von dem bösen Geist gequält, dem sie in Begierden und bösen Taten diente.«'
    reason: Die überlieferte Konstruktion ὃ καὶ ἐδούλευεν ist grammatisch auffällig und inhaltlich schwierig. Die Fußnote dokumentiert die naheliegende alternative Emendation, ohne sie als Textbestand auszugeben.
  revision_rationale: Die Revision folgt in der Hauptfassung der formalen Syntax des überlieferten griechischen Textes und verlagert die plausible, aber nicht gesicherte Umdeutung zur Seele als dienendem Subjekt in die Fußnote. Dadurch bleibt die genuine textkritische Mehrdeutigkeit erhalten. Zugleich wird die englische, kausative Wiedergabe „enslaved“ nicht gegen die griechische Verbsemantik übernommen.
