source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἄλλος²⁶ οὐ θέλει *ἰδεῖν ⌈ἡμέρας⌉ ἀγαθὰς²⁷ μετὰ ἀσώτων, ἵνα μὴ αἰσχράνει²⁸ τὸ σῶμα²⁹ καὶ τὴν ψυχὴν μολυνεῖ³⁰. *καίγε τοῦτο διπρόσωπον³¹, ὅλον³² δὲ καλόν³³ ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/004.yaml
  text: Another does not wish to see good days with the wasteful, lest he disgrace the body and defile the soul. Even though this is double-faced, yet it is wholly good.
translation:
  language: de
  text: Ein anderer will keine guten Tage mit zügellosen Menschen erleben, damit er nicht den Körper in Schande bringt und die Seele befleckt. Auch dies hat zwei Gesichter, ist aber ganz und gar gut.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσώτων
  choice: zügellosen Menschen
  rationale: ἀσώτος bezeichnet Menschen mit ausschweifender, haltloser oder verschwenderischer Lebensführung. „Zügellos“ ist im Zusammenhang mit der Gefährdung von Körper und Seele natürlich und hinreichend weit.
- source_word: αἰσχράνει
  choice: in Schande bringt
  rationale: Bewahrt gegenüber μολυνεῖ die eigene Bedeutung des Beschämens beziehungsweise Entehrens und vermeidet, beide Verben unterschiedslos mit „beflecken“ wiederzugeben.
- source_word: μολυνεῖ
  choice: befleckt
  rationale: Gibt die Verunreinigung der Seele prägnant und in würdigem modernem Deutsch wieder.
- source_word: διπρόσωπον
  choice: zwei Gesichter hat
  rationale: Bildnahe Wiedergabe von „zweigesichtig/doppelgesichtig“, die die im Kontext behauptete Doppelheit offenhält, ohne sie als Heuchelei auszudeuten.
- source_word: ὅλον … καλόν
  choice: ganz und gar gut
  rationale: Gibt die umfassende positiven Wertung idiomatisch wieder und erhält den Kontrast zur Zweigesichtigkeit.
theological_decisions:
- issue: Bewertung des διπρόσωπον
  choice: „Obwohl auch dies zwei Gesichter hat, ist es doch ganz und gar gut.“
  alternative: „Auch dies ist doppelgesichtig, aber insgesamt gut.“
  rationale: Die bildhafte und theologisch spannungsreiche Aussage bleibt erhalten; sie wird weder als moralische Doppelzüngigkeit verurteilt noch harmonisierend erklärt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem griechischen Gedankengang, wird aber idiomatisch geglättet. „Zwei Gesichter hat“ bewahrt die ungewöhnliche Metapher des Ausgangstextes.
