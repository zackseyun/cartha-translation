source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Οἱ γὰρ τοιοῦτοι³⁴ δορκάσι³⁵ καὶ ἐλάφοις³⁶ *εἰσὶν ὅμοιοι³⁷, ὅτι ἐν ἤθει ἀγρίων³⁸ δοκοῦσιν ἀκάθαρτοι εἶναι, *τὸ δὲ πᾶν³⁹ καθαροί εἰσιν³⁹, ὅτι ἐν ζήλῳ Κυρίου⁴⁰ ⌈πορεύονται⌉, ἀπεχόμενοι *ὧν καὶ ὁ Θεὸς διὰ τῶν ἐντολῶν μισῶν ἀπαγορεύει⁴¹, *ἀπείργων τὸ κακὸν τοῦ ἀγαθοῦ⁴².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/005.yaml
  text: 'For such men are like gazelles and deer: though in the manner of wild animals they seem to be unclean, yet in every way they are clean, because they walk in zeal for the Lord, abstaining from what God also hates and forbids through the commandments, keeping evil away from good.'
translation:
  language: de
  text: 'Denn solche Menschen gleichen Gazellen und Hirschen: In der Art wilder Tiere scheinen sie unrein zu sein, doch sind sie durchaus rein; denn sie wandeln im Eifer für den Herrn und enthalten sich dessen, was auch Gott hasst und durch die Gebote verbietet, indem er das Böse vom Guten fernhält.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δορκάσι καὶ ἐλάφοις
  choice: Gazellen und Hirschen
  rationale: Gibt die beiden Tierbezeichnungen direkt und in natürlichem modernem Deutsch wieder.
- source_word: ἐν ἤθει ἀγρίων
  choice: Nach der Art wilder Tiere
  rationale: ἦθος bezeichnet hier Art beziehungsweise Verhalten; die Formulierung bewahrt den Vergleich, ohne ihn unnötig zu präzisieren.
- source_word: τὸ δὲ πᾶν καθαροί εἰσιν
  choice: doch im Ganzen sind sie rein
  rationale: Bewahrt die ungewöhnliche umfassende Aussage des Griechischen und den Gegensatz zum bloßen Anschein der Unreinheit.
- source_word: ἐν ζήλῳ Κυρίου πορεύονται
  choice: sie gehen im Eifer für den Herrn ihren Weg
  rationale: Gibt das Weg-Motiv von πορεύονται und den Eifer als Ausrichtung auf den Herrn wieder.
- source_word: ἀπεχόμενοι
  choice: Sie enthalten sich
  rationale: Entspricht dem Sinn des bewussten Abstandnehmens oder Sich-Enthaltens.
- source_word: ἀπείργων τὸ κακὸν τοῦ ἀγαθοῦ
  choice: halten so das Böse vom Guten fern
  rationale: Gibt die Trennung des Bösen vom Guten möglichst unmittelbar wieder und vermeidet eine theologische Auflösung der knappen Formulierung.
theological_decisions:
- issue: Bezug von Κυρίου
  choice: für den Herrn
  alternative: des Herrn
  rationale: Der Genitiv kann die Ausrichtung des Eifers bezeichnen; im Deutschen macht „für den Herrn“ diesen natürlichen Sinn deutlich, ohne den Herrn näher zu bestimmen.
- issue: Verhältnis von Gottes Hass und Verbot
  choice: was auch Gott hasst und durch die Gebote verbietet
  alternative: was Gott, weil er es hasst, durch die Gebote verbietet
  rationale: Die koordinierte Form wahrt die syntaktische Offenheit und legt keine ausdrückliche Kausalbeziehung fest.
- issue: Schlussaussage über Böses und Gutes
  choice: das Böse vom Guten fernhalten
  alternative: das Böse vom Guten absondern
  rationale: Die räumlich-trennende Bildsprache wird bewahrt; eine ethische Systematisierung, etwa „zwischen Gut und Böse unterscheiden“, würde mehr aussagen als der Text.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am argumentativen Verlauf des Griechischen, wird aber durch einen Punkt vor dem Partizipialgefüge lesbarer gestaltet. Keine Fußnoten erforderlich.
