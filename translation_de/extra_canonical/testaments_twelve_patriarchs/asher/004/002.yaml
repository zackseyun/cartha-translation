  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/002.yaml
  text: And many, in doing away with the wicked, do two things, good and evil; yet the whole is good, because he has uprooted and destroyed the evil.
translation:
  language: de
  text: 'Und viele tun, indem sie die Bösen beseitigen, zweierlei: Gutes und Böses. Doch das Ganze ist gut, weil er das Böse mit der Wurzel ausgerissen und vernichtet hat.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναιροῦντες τοὺς πονηρούς
  choice: indem sie die Bösen beseitigen
  rationale: ἀναιρέω bezeichnet hier das Beseitigen bzw. Töten; „beseitigen“ bewahrt im Deutschen die im Zusammenhang vorhandene Härte, ohne die mögliche Bedeutungsbreite unnötig einzuengen.
- source_word: δύο ποιοῦσιν ἔργα καλοῦ τε καὶ κακοῦ
  choice: 'tun ... zweierlei: Gutes und Böses'
  rationale: Die natürliche deutsche Wendung gibt sowohl die Zweizahl als auch den Gegensatz von Gutem und Bösem wieder, ohne das semantisch breite ἔργα übermäßig technisch mit „Werke“ zu übersetzen.
- source_word: τὸ δὲ ὅλον καλόν
  choice: Doch das Ganze ist gut
  rationale: Die knappe Gesamtbewertung des Griechischen wird formal und in ihrer ethischen Spannung bewahrt.
- source_word: ἐκριζώσας ἀπώλεσεν
  choice: mit der Wurzel ausgerissen und vernichtet hat
  rationale: „Mit der Wurzel ausreißen“ bildet ἐκριζόω anschaulich ab; „vernichten“ gibt ἀπόλλυμι wieder und erhält die Doppelung der Verben.
theological_decisions:
- issue: Ethische Bewertung einer Handlung mit guten und bösen Anteilen
  choice: Die Aussage bleibt bestehen, dass das Ganze trotz Gutem und Bösem als gut beurteilt wird.
  alternative: Die böse Komponente abschwächen oder die Gesamtbewertung als bloße Absichtsethik erklären.
  rationale: Der griechische Text formuliert die Spannung ausdrücklich; die Übersetzung darf sie weder harmonisieren noch durch eine konfessionelle oder systematische Deutung auflösen.
- issue: Wechsel vom pluralischen Handlungsträger zum Singular in ἐκριζώσας ἀπώλεσεν
  choice: unpersönlich mit „man ... hat“ wiedergegeben
  alternative: „weil er das Böse ... hat“ oder Angleichung an den Plural „weil sie ... haben“
  rationale: Der griechische Numeruswechsel ist textlich auffällig. Das unpersönliche „man“ vermeidet einen im Deutschen unvermittelten männlichen Singular, ohne den Text ausdrücklich an den vorherigen Plural anzugleichen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt knapp und bewahrt die ethische Spannung des Ausgangstextes. Keine Fußnoten erforderlich.
