base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/003.yaml
  text: There is one who hates the merciful and the unjust, and the adulterer and the one who fasts; this too is double-faced, but the whole work is good, because he imitates the Lord, not expecting what seems good along with what is truly good.
translation:
  language: de
  text: Es gibt jemanden, der den Barmherzigen und den Ungerechten, den Ehebrecher und den Fastenden hasst. Auch dies ist doppelgesichtig[a]; doch das gesamte Tun ist gut, denn er ahmt den Herrn nach und erwartet nicht das scheinbar Gute zusammen mit dem wahrhaft Guten.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zwiespältig“; wörtlich bezeichnet das griechische Wort etwas „Doppelgesichtiges“.'
    reason: Das Bild ist verständlich, aber im Deutschen ungewöhnlich; die Fußnote nennt die idiomatische Bedeutung.
  - marker: b
    text: Der griechische Wortlaut des letzten Satzteils ist unsicher und möglicherweise verderbt. Seine genaue Bedeutung lässt sich daher nicht mit Sicherheit bestimmen.
    reason: Die Edition kennzeichnet in dieser Wendung mehrere textkritisch problematische Wörter; die Unsicherheit ist für die Auslegung wesentlich.
lexical_decisions:
- source_word: ἐλεήμονα
  choice: den Barmherzigen
  rationale: Gibt die substantivisch gebrauchte Personenbezeichnung natürlich wieder, ohne das im Griechischen nicht ausdrücklich stehende Wort „Mann“ einzufügen.
- source_word: διπρόσωπον
  choice: doppelgesichtig
  rationale: Bewahrt das anschauliche Bild des griechischen Ausdrucks und seinen Bezug auf ein zwiespältiges Verhalten.
- source_word: τὸ πᾶν ἔργον
  choice: das gesamte Tun
  rationale: „Tun“ bezeichnet hier natürlicher als „Werk“ die beschriebene Handlungsweise; „gesamte“ bewahrt den Gedanken der Gesamtbeurteilung.
- source_word: μιμεῖται Κύριον
  choice: er ahmt den Herrn nach
  rationale: Entspricht unmittelbar dem griechischen Verb und lässt den theologischen Bezug von „Herr“ unbestimmt, wie es der Ausgangstext tut.
- source_word: τὸ δοκοῦν καλὸν … τοῦ ἀληθινοῦ καλοῦ
  choice: das scheinbar Gute … dem wahrhaft Guten
  rationale: Erhält den Gegensatz zwischen bloßem Anschein und wahrer Güte.
theological_decisions:
- issue: Der Satz bewertet ein „doppelgesichtiges“ Verhalten dennoch insgesamt als gut.
  choice: Die Spannung wird unverändert stehen gelassen.
  alternative: Den Satz erklärend so umformulieren, dass nur das Hassen des Ungerechten und Ehebrechers als gut gilt.
  rationale: Der überlieferte griechische Wortlaut enthält diese irritierende Gesamtbewertung ausdrücklich; eine harmonisierende Deutung würde mehr festlegen, als der Text erlaubt.
- issue: Identität von „Herr“
  choice: „der Herr“ ohne nähere Bestimmung
  alternative: „Gott“ oder „Christus“
  rationale: Κύριον nennt den Herrn, bestimmt aber in diesem Satz nicht ausdrücklich, wer gemeint ist.
- issue: Sinn der beschädigten Schlusswendung
  choice: 'Eine möglichst formnahe Wiedergabe: „erwartet nicht das scheinbar Gute zusammen mit dem wahrhaft Guten“'
  alternative: Konjektural erklären, etwa „nimmt nicht das scheinbar Gute für das wahrhaft Gute an“
  rationale: Die griechische Überlieferung ist an προσδοκώμενος und μετά als unsicher beziehungsweise verderbt markiert. Daher wird keine stillschweigende Konjektur in den Haupttext aufgenommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Gegensatzpaare wurden durch „ebenso … wie“ verdeutlicht, ohne die auffällige inhaltliche Spannung des griechischen Textes aufzulösen. Textkritische Unsicherheit wird transparent in einer Fußnote ausgewiesen.
