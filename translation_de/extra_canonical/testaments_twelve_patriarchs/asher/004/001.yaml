source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: IV. Οἱ γὰρ ἀγαθοὶ ἄνθρωποι¹ *⌜καὶ⌝ μονοπρόσωποι κἂν² νομισθῶσι παρὰ τῶν³ διπροσώπων⁴ ἁμαρτάνειν⁵, δίκαιοί εἰσι παρὰ τῷ⁶ Θεῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/004/001.yaml
  text: For good men, being single-faced, even if they are thought by the double-faced to be sinning, are righteous before God.
translation:
  language: de
  text: Denn gute Menschen sind aufrichtig; selbst wenn die Doppelzüngigen meinen, sie sündigten, sind sie vor Gott gerecht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαθοὶ ἄνθρωποι
  choice: gute Menschen
  rationale: Gibt die schlichte ethische Bezeichnung des Griechischen natürlich und ohne zusätzliche Deutung wieder.
- source_word: μονοπρόσωποι
  choice: aufrichtig
  rationale: Wörtlich etwa »eingesichtig«; im Gegensatz zu διπρόσωποι bezeichnet das Wort Menschen ohne Falschheit oder gespaltene Haltung. »Aufrichtig« ist im heutigen Deutsch verständlich und wahrt den ethischen Sinn.
- source_word: διπροσώπων
  choice: Doppelzüngigen
  rationale: Das griechische Bild meint wörtlich »Doppelgesichtige«. »Doppelzüngige« ist eine natürliche deutsche Bezeichnung für falsche, unaufrichtige Menschen und erhält den Kontrast zu »aufrichtig«.
- source_word: νομισθῶσι … ἁμαρτάνειν
  choice: meinen, sie sündigten
  rationale: 'Bewahrt die indirekte Zuschreibung: Nicht Gott, sondern die Doppelzüngigen halten das Verhalten der Guten für Sünde.'
- source_word: δίκαιοί εἰσι παρὰ τῷ Θεῷ
  choice: sind sie vor Gott gerecht
  rationale: Die traditionelle und präzise Wiedergabe erhält sowohl den forensisch-theologischen Klang von δίκαιος als auch Gottes maßgebliches Urteil.
theological_decisions:
- issue: Spannung zwischen menschlichem Sündenurteil und Gottes Urteil
  choice: Die Doppelzüngigen halten die Guten für sündigend, während diese vor Gott gerecht sind.
  alternative: Die Guten können tatsächlich sündigen und dennoch vor Gott gerecht sein.
  rationale: Die Syntax bindet das vermeintliche Sündigen an das Urteil der Doppelzüngigen (νομισθῶσι … ἁμαρτάνειν), nicht an eine Tatsachenfeststellung. Die Übersetzung lässt Gottes abweichendes Urteil klar stehen, ohne eine Rechtfertigungslehre einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der schwer verständliche wörtliche Gegensatz »eingesichtig/doppelgesichtig« wird idiomatisch als »aufrichtig/doppelzüngig« wiedergegeben; der ethische Kontrast bleibt erhalten.
