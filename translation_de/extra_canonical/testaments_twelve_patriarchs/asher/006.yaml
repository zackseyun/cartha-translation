  rationale: Die Überarbeitung beseitigt die unbelegte Ergänzung „mit ihnen“ in V. 2, formuliert V. 3 und V. 4 näher am griechischen Satzbau und Sinn und präzisiert die Anmerkung zur grammatisch unsicheren Stelle in V. 6. Der Umfang bleibt auf den tatsächlich bereitgestellten griechischen Text 6,1–6 beschränkt; die weiterreichende englische Fassung ist hierfür keine ausreichende Grundlage.
