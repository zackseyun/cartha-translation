base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/006.yaml
  text: 'Therefore take heed, you also, my children, following the commandments of the Lord with a single face, in truth. For the double-faced are punished doubly, because they both do evil and approve those who do it, imitating the spirits of deceit and contending against mankind. You therefore, my children, keep the law of the Lord, and do not attend to evil as though it were good; but look instead to what is truly good, and preserve it in all the commandments of the Lord, conducting yourselves in it and resting in it. For the ends of men reveal their righteousness, and they are made known to the angels of the Lord and of Beliar. For when a wicked soul departs, it is tormented by the evil spirit, which it also served in lusts and wicked deeds. But if it is peaceful in joy, it knows the angel of peace, and rejoices in him; and at its death he leads it into eternal life. And it does not come into the destruction of Beliar, as do the souls of sinners. You see, therefore, that in the last
    times the sons of truth will escape the spirits of deceit and Beliar, but the sons of lawlessness will be destroyed. For the latter will hand over their souls to Beliar in confusion, but the former will be found in joy. For every one of those who are double-faced, though he says, ''I am for the Lord,'' serves Beliar, and his works go to the evil one. Be persuaded, therefore, my children, that there are two ways of all things, one of good and one of evil; and in these are the two dispositions in our breasts that discern them. Therefore if the soul takes pleasure in the good, all its deeds are in righteousness; and if it sins, it immediately repents. For, having its mind set on righteousness and hating wickedness, it casts away the evil and roots out the sin. But if it inclines to evil, all its deeds are in wickedness, and it drives away the good and clings to the evil, and is ruled by Beliar. For even if it does what is good, it twists it toward evil. For when it begins to do good, it
    brings the end of the action over to evil, since the treasure of its inclination is filled with an evil spirit. Another may steal, deal unjustly, plunder, defraud, and yet show compassion to the poor: this too has a double face, but the whole is evil. He who defrauds his neighbor provokes God, and swears falsely by the Most High, and yet has pity on the poor. The Lord who gave the law he sets at naught and provokes, yet he refreshes the poor. He defiles the soul and makes the body glad; he kills many and has mercy on a few: this too has a double face. Another does not commit adultery, nor fornication, and abstains from foods, but when he fasts he does evil, and by his power and his wealth he overthrows many; and despite his excessive goodness, he practices lawlessness: this too has a double face. Such men are hares, clean like those that divide the hoof, but in fact they are unclean. For God said in the tablets of the commandments. But do not become, my children, like Sodom, which did
    not recognize the angels of the Lord and perished forever. For I know that you will sin, and be handed over into the hands of your enemies; and your land will be made desolate, and your holy places destroyed, and you will be scattered to the four corners of the earth. And you will be counted in the dispersion as water that vanishes, until the Most High visits the earth, himself coming as a man, with men eating and drinking, and breaking the head of the dragon in the water. He will save Israel and all the nations, God speaking in the person of man. Therefore tell these things to your children also, that they may disobey him. For I know that they will surely be lawless and will not heed the law of God, but the commandments of men; and they will be scattered as leaves are scattered by the wind, and as water is dispersed. But you, my children, if you walk in holiness according to the commandments of the Lord, you will dwell again in safety, and all Israel will be gathered to the Lord.'
translation:
  language: de
  text: '**Testament Aschers 6**


    **1** Darum gebt auch ihr acht, meine Kinder: Folgt den Geboten des Herrn mit ungeteiltem Herzen[a] und der Wahrheit. **2** Denn die Doppelgesichtigen werden doppelt bestraft, weil sie sowohl das Böse tun als auch denen zustimmen, die es tun. Sie ahmen die Geister des Irrtums nach und kämpfen gegen die Menschen.


    **3** Ihr nun, meine Kinder, haltet das Gesetz des Herrn. Achtet nicht auf das Böse, als wäre es gut, sondern richtet euren Blick auf das, was wirklich gut ist. Haltet daran in allen Geboten des Herrn fest, führt darin euer Leben und findet darin Ruhe. **4** Denn die Lebensenden der Menschen machen ihre Gerechtigkeit sichtbar, und sie werden den Engeln des Herrn und Beliars bekannt.[b]


    **5** Wenn nämlich eine böse Seele fortgeht, wird sie von dem bösen Geist gequält, dem sie auch durch Begierden und böse Taten gedient hat. **6** Ist sie dagegen in Freude ruhig, erkennt sie den Engel des Friedens, und er führt sie in das ewige Leben.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „mit nur einem Gesicht“. Gemeint ist eine ungeteilte, aufrichtige Ausrichtung; das Bild steht im Gegensatz zu den „Doppelgesichtigen“ in Vers 2.'
    reason: Das griechische Wortspiel lässt sich im Deutschen nicht zugleich wörtlich und natürlich vollständig erhalten.
  - marker: b
    text: 'Der griechische Satz ist grammatisch uneben. Möglich ist auch: „Denn die Lebensenden der Menschen zeigen ihre Gerechtigkeit und werden den Engeln des Herrn und Beliars bekannt.“'
    reason: Bewahrt die Unsicherheit über das Subjekt von „werden bekannt“ und die auffällige Konstruktion bei den Engeln.
  - marker: c
    text: 'Der griechische Text ist an dieser Stelle sprachlich uneben und verwendet beim Objekt von „führt“ ein maskulines Pronomen, obwohl im Zusammenhang die Seele gemeint ist. Die Übersetzung folgt dem Zusammenhang: Der Engel des Friedens führt die Seele in das ewige Leben.'
    reason: Die überlieferte Form bietet einen Pronomenwechsel; die kontextuelle Auflösung wird offengelegt, ohne eine scheinpräzise wörtliche Rekonstruktion zu behaupten.
lexical_decisions:
- source_word: μονοπροσώπως
  choice: mit ungeteiltem Herzen
  rationale: Das seltene Adverb bedeutet wörtlich etwa „mit nur einem Gesicht“ und steht im Gegensatz zu διπρόσωποι. Die deutsche Wiedergabe vermittelt natürliche, aufrichtige Ungeteiltheit; eine Fußnote bewahrt das Bild des Ausgangstextes.
- source_word: διπρόσωποι
  choice: die Doppelgesichtigen
  rationale: Die bewusste Gegenüberstellung zu μονοπροσώπως wird durch das ungewöhnliche, aber verständliche Bild erhalten; gemeint sind Menschen mit widersprüchlicher, doppelter Ausrichtung.
- source_word: συνευδοκοῦσιν
  choice: zustimmen
  rationale: Das Verb bezeichnet zustimmendes Gutheißen beziehungsweise Billigen der Taten anderer, nicht bloß passives Wissen.
- source_word: τὰ τέλη τῶν ἀνθρώπων
  choice: wie das Leben der Menschen endet
  rationale: τέλη bezeichnet hier die Ausgänge oder Lebensenden der Menschen. Die verbale deutsche Fassung ist natürlich und lässt den Bezug auf das abschließende Ergehen erkennen.
- source_word: ἀναστρεφόμενοι
  choice: führt darin euer Leben
  rationale: Im ethischen Zusammenhang bedeutet das Partizip „sich verhalten, seinen Lebenswandel führen“, nicht lediglich räumliches Umhergehen.
- source_word: καταπαύοντες
  choice: findet darin Ruhe
  rationale: Bewahrt das Bild des Ruhens und vermeidet eine unnötige dogmatische Festlegung.
- source_word: ἀπέρχεται
  choice: fortgeht
  rationale: Der Text spricht verhüllend vom Fortgehen der Seele. Die Übersetzung deutet dies nicht ausdrücklich als „sterben“ aus und erhält damit die Ausdrucksweise des Griechischen.
- source_word: ζωὴν αἰώνιον
  choice: das ewige Leben
  rationale: Konventionelle und sachlich genaue Wiedergabe der eschatologischen Wendung.
theological_decisions:
- issue: Verhältnis von menschlicher Gerechtigkeit und Lebensende in Vers 4
  choice: Das Lebensende macht die Gerechtigkeit sichtbar.
  alternative: Das Lebensende beweist oder bewirkt die Gerechtigkeit.
  rationale: δεικνύουσιν bedeutet „zeigen, sichtbar machen“. Der Text sagt nicht ausdrücklich, dass das Ende Gerechtigkeit hervorbringt oder Menschen rechtfertigt.
- issue: Engel des Herrn und Beliars in Vers 4
  choice: Beide Gruppen werden als im Text genannte übermenschliche Zeugen beibehalten.
  alternative: Beliar als Satan identifizieren oder die Engel Beliars als Dämonen bezeichnen.
  rationale: Die Übersetzung bewahrt die eigene Begrifflichkeit des Werkes und importiert keine weitergehende Identifikation.
- issue: Handelndes Subjekt am Ende von Vers 6
  choice: Der Engel des Friedens führt die Seele in das ewige Leben.
  alternative: Die Seele führt den Engel hinein oder ein unbestimmtes Subjekt führt die Seele.
  rationale: Der nächstliegende maskuline Bezug von εἰσφέρει ist „der Engel“, während αὐτόν formal maskulin ist, obwohl im Zusammenhang die Seele gemeint sein dürfte. Die textliche Unebenheit wird in einer Fußnote offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter paränetischer Ansprache. Satzbau und Wortwahl bleiben für heutige Leser zugänglich. Das Leitbild von Ein- und Doppelgesichtigkeit wird teilweise idiomatisch, teilweise bildhaft wiedergegeben. Übersetzt wurde ausschließlich der bereitgestellte griechische Abschnitt 6,1–6; die darüber hinausgehende englische Konsultationsfassung wurde nicht ergänzt, da dafür hier kein originalsprachlicher Quelltext vorliegt.
