review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt den griechischen Abschnitt 6,1–6 insgesamt zuverlässig und ohne Ergänzung des im englischen Audit Trails darüber hinausgehenden Materials wieder. In V. 2 ist jedoch „kämpfen gemeinsam mit ihnen“ nicht vom Text gedeckt: συναγωνιζόμενοι steht ohne ausdrückliches Bezugsobjekt „mit ihnen“ und bedeutet hier „gegen die Menschen kämpfen/streiten“. In V. 4 sollte die unnötige Vergleichskonstruktion „wie das Leben ... endet“ durch eine näher am Plural τέλη bleibende Formulierung ersetzt werden. V. 6 hat im überlieferten Griechisch eine echte textliche bzw. grammatische Unebenheit (feminines Subjekt/masculines Objektpronomen); die kontextuelle Wiedergabe ist vertretbar, muss aber nicht durch eine irreführend genaue angeblich wörtliche Fußnote verschärft werden.'
  naturalness: Die Sprache ist modernes, würdiges Standarddeutsch und überwiegend sehr gut lesbar. „Doppelgesichtigen“ ist als bewusstes Leitbild verständlich. „Mit ungeteiltem Herzen“ ist idiomatisch, verliert aber das Gesichtsbild; die vorhandene Anmerkung kompensiert dies angemessen. Die Reihung in V. 3 wird mit „an ihm festhalten“ natürlicher und genauer als „Bewahrt es in allen Geboten“.
  terminology: „Herr“, „Gesetz“, „Beliar“, „Engel des Friedens“, „Begierden“ und „ewiges Leben“ sind konsistent und sachlich. Beliar wird zutreffend nicht mit einer späteren oder konfessionell festgelegten Gestalt gleichgesetzt. „Gerechtigkeit“ für δικαιοσύνη ist angemessen.
  issues:
  - severity: medium
    issue: 'V. 2: „kämpfen gemeinsam mit ihnen gegen die Menschen“'
    rationale: Das „mit ihnen“ hat keinen ausdrücklichen Anhalt im griechischen Text. Die Partizipialkonstruktion verbindet die Nachahmung der Geister des Irrtums mit dem Kampf gegen Menschen, nicht notwendigerweise mit einem Kampf zusammen mit diesen Geistern.
  - severity: low
    issue: 'V. 3: „Bewahrt es in allen Geboten des Herrn“'
    rationale: αὐτὸ ... ἐν πάσαις ταῖς ἐντολαῖς bedeutet eher, das wahrhaft Gute in allen Geboten festzuhalten bzw. zu bewahren. „Bewahrt es in“ ist im Deutschen weniger natürlich und kann nahelegen, die Gebote seien ein Aufbewahrungsort.
  - severity: low
    issue: 'V. 4: „Denn wie das Leben der Menschen endet“'
    rationale: τὰ τέλη τῶν ἀνθρώπων ist pluralisch („die Enden/der Ausgang der Menschen“). Die Fassung ist zwar sinngemäß, aber die Vergleichsform „wie“ ist unnötig und verdeckt die direkte Subjektfunktion.
  - severity: low
    issue: 'Fußnote c: angeblich wörtliche Wiedergabe'
    rationale: Die Fußnote erklärt die textliche Unebenheit zu Recht, aber „Wenn sie aber in Freude ruhig sei“ ist keine präzise wörtliche Reproduktion der vorliegenden Form Ἐὰν δὲ ἔστω ἥσυχος ἐν χαρᾷ. Eine nüchterne Beschreibung der Überlieferungsunsicherheit ist besser.
