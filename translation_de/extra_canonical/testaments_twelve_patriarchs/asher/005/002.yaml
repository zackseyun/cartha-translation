base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/002.yaml
  text: 'Death follows life, dishonor follows glory, night follows day, darkness follows light. But all things are under day: the righteous under life, and the unrighteous under death. Therefore eternal life also awaits death.'
translation:
  language: de
  text: 'Auf das Leben folgt der Tod, auf die Ehre die Unehre, auf den Tag die Nacht, auf das Licht die Finsternis. Doch alles steht unter dem Tag[a]: das Gerechte unter dem Leben, das Ungerechte unter dem Tod. Darum erwartet auch das ewige Leben den Tod.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch wörtlich: „unter Tag“ (ohne Artikel). Die knappe, ungewöhnliche Wendung kann eine Zuordnung zum Bereich oder zur Herrschaft des Tages ausdrücken.'
    reason: Kennzeichnet die artikellose griechische Form und bewahrt zugleich die semantische Offenheit der Bildsprache.
lexical_decisions:
- source_word: διαδέχεται
  choice: folgt auf
  rationale: Gibt die Abfolge beziehungsweise Ablösung natürlich wieder und lässt offen, ob nur zeitliche Folge oder ein Gegensatz gemeint ist.
- source_word: ἀτιμία
  choice: Schande
  rationale: Bezeichnet den Verlust von Ehre beziehungsweise Unehre; „Schande“ bildet den prägnanten Gegensatz zu „Herrlichkeit“.
- source_word: τὰ δίκαια / τὰ ἄδικα
  choice: das Gerechte / das Ungerechte
  rationale: Bewahrt den substantivierten sachlichen Sinn der griechischen Neutra und vermeidet die nicht zwingende Festlegung auf Personengruppen.
- source_word: ἀναμένει
  choice: erwartet
  rationale: Entspricht der Grundbedeutung des Verbs und erhält die auffällige Aussage, dass das ewige Leben den Tod erwartet.
theological_decisions:
- issue: Verhältnis von ewigem Leben und Tod im Schlusssatz
  choice: „das ewige Leben [erwartet] den Tod“
  alternative: „nach dem Tod wartet das ewige Leben“ oder „das ewige Leben überwindet den Tod“
  rationale: Subjekt und Objekt des griechischen Satzes werden nicht vertauscht oder deutend aufgelöst; seine paradoxe und theologisch spannungsreiche Form bleibt erhalten.
- issue: Bezug von τὰ δίκαια und τὰ ἄδικα
  choice: 'unpersönlich: „das Gerechte“ und „das Ungerechte“'
  alternative: 'persönlich: „die Gerechten“ und „die Ungerechten“'
  rationale: Die griechischen Formen sind Neutrum Plural und bezeichnen am unmittelbarsten gerechte beziehungsweise ungerechte Dinge oder das Gerechte und Ungerechte; eine personale Deutung ist möglich, aber nicht grammatisch erzwungen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die vier parallelen Gegensatzpaare werden rhythmisch gleich gebaut. Die ungewöhnlichen Aussagen „unter dem Tag“ und „das ewige Leben erwartet den Tod“ werden nicht geglättet oder konfessionell ausgelegt.
