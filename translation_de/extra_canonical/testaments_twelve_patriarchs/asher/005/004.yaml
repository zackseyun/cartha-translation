id: T12P.ASH.5.4
reference: Testament of Asher 5:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ταῦτα οὖν²⁰ πάντα ⌜ἐγὼ⌝²¹ ἐδοκίμασα ἐν τῇ ζωῇ μου, καὶ οὐκ ἐπλανήθην ἀπὸ τῆς ἀληθείας Κυρίου, καὶ²² τὰς ἐντολὰς τοῦ ὑψίστου²³ ἐξεζήτησα²⁴ κατὰ πᾶσαν ἰσχύν μου πορευόμενος²⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/004.yaml
  text: So then I tested all these things in my life, and I did not go astray from the truth of the Lord, and I sought the commandments of the Most High with all my strength as I walked.
translation:
  language: de
  text: So habe ich all dies in meinem Leben geprüft. Ich bin nicht von der Wahrheit des Herrn abgeirrt, und während ich meinen Weg ging, suchte ich mit all meiner Kraft nach den Geboten des Höchsten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „… und suchte nach den Geboten des Höchsten, wobei ich mit all meiner Kraft meinen Weg ging.“ Der griechische Satz lässt offen, ob „mit all meiner Kraft“ vor allem das Suchen oder das Gehen näher bestimmt.'
    reason: Bewahrt die echte syntaktische Mehrdeutigkeit der abschließenden Wortgruppe.
lexical_decisions:
- source_word: ἐδοκίμασα
  choice: habe ich … geprüft
  rationale: Das Verb bezeichnet ein prüfendes Erproben; „geprüft“ bewahrt diesen Sinn knapp und natürlich.
- source_word: ἐπλανήθην ἀπὸ
  choice: bin nicht … abgeirrt
  rationale: Gibt das Bild des Abweichens oder Sich-Verirrens von einem Weg beziehungsweise Maßstab wieder.
- source_word: ἐξεζήτησα
  choice: suchte ich … nach
  rationale: Drückt die nachdrückliche, bewusste Suche aus, ohne eine erfolgreiche Auffindung vorauszusetzen.
- source_word: πορευόμενος
  choice: während ich meinen Weg ging
  rationale: Bewahrt das Bewegungsbild des Partizips und lässt zugleich den übertragenen Sinn der Lebensführung anklingen.
theological_decisions:
- issue: Genitiv in ἀπὸ τῆς ἀληθείας Κυρίου
  choice: von der Wahrheit des Herrn
  alternative: von der Wahrheit über den Herrn
  rationale: Der unmarkierte Genitiv wird bewahrt, ohne näher festzulegen, ob Herkunft, Zugehörigkeit oder Inhalt gemeint ist.
- issue: Bezug von κατὰ πᾶσαν ἰσχύν μου
  choice: mit all meiner Kraft auf das Suchen nach den Geboten bezogen
  alternative: mit all meiner Kraft auf das Gehen beziehungsweise die Lebensführung bezogen
  rationale: Wortstellung und Sinnzusammenhang stützen vorrangig den Bezug auf ἐξεζήτησα; die syntaktisch mögliche andere Zuordnung wird in der Fußnote offengehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die kurzen Hauptsätze vermeiden einen schwerfälligen Periodenbau; „meinen Weg ging“ erhält das griechische Bild, ohne eine bestimmte theologische Deutung der Lebensführung einzutragen.
