source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: V. Ὁρᾶτε¹, τέκνα², πῶς δύο³ εἰσὶν ⌜ἐν πᾶσιν⌝, ἓν⁴ κατέναντι τοῦ ἑνός, *καὶ ἓν ὑπὸ τοῦ ἑνὸς⁵ κέκρυπται· ⌜ἐν τῇ κτίσει ἡ πλεονεξία, ἐν τῇ εὐφροσύνῃ ἡ μέθη, ἐν τῷ γέλωτι τὸ πένθος, ἐν τῷ γάμῳ ἡ ἀσωτία⌝⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/001.yaml
  text: 'See, my children, how there are two in all things, one opposite the other, and one is hidden under the other: in creation, greed; in merriment, drunkenness; in laughter, grief; in marriage, debauchery.'
translation:
  language: de
  text: 'Seht, meine Kinder, dass es in allen Dingen zweierlei gibt: Das eine ist dem anderen entgegengesetzt, und das eine ist unter dem anderen verborgen: in der Schöpfung die Habgier, in der Fröhlichkeit die Trunkenheit, im Lachen die Trauer, in der Ehe die Ausschweifung.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Seht
  rationale: Bewahrt den direkten, mahnenden Imperativ und klingt in einer würdevollen Anrede natürlich.
- source_word: τέκνα
  choice: meine Kinder
  rationale: Das Possessivpronomen ist im Deutschen bei dieser väterlichen Anrede idiomatisch aus dem Kontext zu ergänzen.
- source_word: δύο
  choice: zweierlei
  rationale: Gemeint sind jeweils zwei gegensätzliche Erscheinungen oder Seiten; „zweierlei“ gibt dies im Deutschen natürlicher wieder als das substantivlose „zwei“.
- source_word: ἐν πᾶσιν
  choice: in allen Dingen
  rationale: Formnahe und zugleich verständliche Wiedergabe, ohne die Aussage auf ausnahmslos „alles“ zu verschärfen.
- source_word: ἓν κατέναντι τοῦ ἑνός
  choice: das eine dem anderen entgegengesetzt
  rationale: Bildet die wechselseitige Gegenüberstellung der beiden Seiten klar ab.
- source_word: ἓν ὑπὸ τοῦ ἑνὸς κέκρυπται
  choice: das eine unter dem anderen verborgen ist
  rationale: Erhält das räumliche Bild von ὑπό und die im Griechischen bestehende Unbestimmtheit darüber, welche Seite jeweils verborgen ist.
- source_word: κτίσει
  choice: Schöpfung
  rationale: Die überlieferte griechische Lesart bezeichnet hier wörtlich „Schöpfung“; eine konjekturale Bedeutung wie „Erwerb“ wird nicht in den Haupttext eingetragen.
- source_word: πλεονεξία
  choice: Habgier
  rationale: Bezeichnet begehrliches Mehrhabenwollen und passt als knappe Lasterbezeichnung.
- source_word: εὐφροσύνῃ
  choice: Fröhlichkeit
  rationale: Gibt freudige Ausgelassenheit wieder, ohne bereits Trunkenheit vorwegzunehmen.
- source_word: μέθη
  choice: Trunkenheit
  rationale: Direkte und registergerechte Bezeichnung des Rausches durch Alkohol.
- source_word: πένθος
  choice: Trauer
  rationale: Bewahrt den Gegensatz zum Lachen; das Wort kann Trauer oder Kummer bezeichnen.
- source_word: ἀσωτία
  choice: Ausschweifung
  rationale: Erfasst zügelloses, moralisch haltloses Verhalten breit, ohne es unnötig auf einen einzelnen sexuellen Tatbestand festzulegen.
theological_decisions:
- issue: Verhältnis der gegensätzlichen Seiten
  choice: Die paradoxen Paarungen bleiben unkommentiert und werden nicht als geschlossene Lehre über die Schöpfung erklärt.
  alternative: Die Aussagen als Behauptung auslegen, jedem geschaffenen Gut wohne notwendig ein bestimmtes Laster inne.
  rationale: Der Vers formuliert zugespitzte moralische Gegenüberstellungen; eine systematische metaphysische Deutung würde über den Wortlaut hinausgehen.
- issue: Mehrdeutigkeit von „das eine“
  choice: Die referenzielle Unbestimmtheit beibehalten.
  alternative: Explizit festlegen, dass stets das Laster unter dem Guten verborgen sei.
  rationale: Obwohl die Beispiele diese Deutung nahelegen, benennt die griechische Formulierung nicht ausdrücklich, welches der beiden jeweils verborgen ist.
translation_notes:
  register: Moderne, würdige Standardsprache mit mahnendem, weisheitlichem Ton. Die parallele Reihung und die knappen Gegensatzpaare des Griechischen bleiben erhalten; keine Fußnote ist für das Verständnis des Haupttextes zwingend erforderlich.
