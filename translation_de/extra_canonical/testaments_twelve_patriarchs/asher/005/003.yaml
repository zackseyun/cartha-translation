revisions:
- from: Und man kann die Wahrheit nicht Lüge nennen und das Gerechte nicht ungerecht; denn alle Wahrheit steht unter dem Licht, so wie alles unter Gott steht.
  to: Und man kann weder die Wahrheit Lüge nennen noch das Gerechte ungerecht; denn alle Wahrheit untersteht dem Licht, so wie alles Gott untersteht.
  rationale: Die Revision klärt die negative Paarformel durch „weder … noch“ und ersetzt die unidiomatische Stellungskonstruktion durch die parallele, moderne Formulierung „untersteht“. Sie wahrt dabei die offene Relation von Wahrheit zum Licht und von allem zu Gott.
