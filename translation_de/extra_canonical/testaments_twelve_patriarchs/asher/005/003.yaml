  source_fidelity: Der Entwurf trifft die prädikativen Gegenüberstellungen τὴν ἀλήθειαν ψεῦδος und τὸ δίκαιον ἄδικον sowie die parallele Konstruktion mit ὑπό zuverlässig. „Unterstehen“ gibt ὑπὸ mit εἰμί in idiomatischem Deutsch als Unterordnung wieder, ohne das Verhältnis von Licht und Gott weiter zu bestimmen.
  naturalness: „Weder … noch“ bildet die griechische Negationskoordination οὐκ … οὐδέ eindeutig ab. „Unter dem Licht stehen“ bzw. „unter Gott stehen“ wirkt im modernen Standarddeutsch unnötig holprig; „dem Licht/Gott unterstehen“ ist natürlich und erhält die Parallelität.
  terminology: „Wahrheit“, „Lüge“, „das Gerechte“, „ungerecht“, „Licht“ und „Gott“ sind angemessen. Die bestimmte Form bei „dem Licht“ bleibt erhalten. Keine konfessionell einengende Deutung wird eingeführt.
  issues:
