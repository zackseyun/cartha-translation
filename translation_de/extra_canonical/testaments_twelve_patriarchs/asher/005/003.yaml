source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Καὶ οὐκ¹⁵ ἔστιν εἰπεῖν τὴν ἀλήθειαν ψεῦδος, οὐδὲ *τὸ δίκαιον ἄδικον¹⁶, ὅτι πᾶσα ἀλήθεια ὑπὸ *τοῦ φωτός¹⁷ ἐστιν, ⌜καθὼς τὰ πάντα¹⁸ ὑπὸ *τοῦ Θεοῦ¹⁹⌝.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005/003.yaml
  text: And one cannot call truth falsehood, nor what is righteous unrighteous, because all truth is under the light, just as all things are under God.
translation:
  language: de
  text: Und man kann weder die Wahrheit Lüge nennen noch das Gerechte ungerecht; denn alle Wahrheit untersteht dem Licht, so wie alles Gott untersteht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰπεῖν
  choice: nennen
  rationale: Im Zusammenhang mit zwei prädikativen Akkusativen gibt „nennen“ die Aussageabsicht natürlicher und prägnanter wieder als „sagen, dass“.
- source_word: τὴν ἀλήθειαν ψεῦδος
  choice: die Wahrheit … Lüge nennen
  rationale: Bewahrt den scharfen Gegensatz zwischen Wahrheit und Lüge ohne zusätzliche Deutung.
- source_word: τὸ δίκαιον ἄδικον
  choice: das Gerechte … ungerecht [nennen]
  rationale: Die substantivische Form „das Gerechte“ entspricht dem griechischen Neutrum; „ungerecht“ bildet im Deutschen ein natürliches prädikatives Gegenstück.
- source_word: ὑπὸ τοῦ φωτός
  choice: unter dem Licht
  rationale: Die räumliche Metapher und die bestimmte Form des griechischen Ausdrucks werden bewusst erhalten.
- source_word: ὑπὸ τοῦ Θεοῦ
  choice: unter Gott
  rationale: Gibt die Parallele zu „unter dem Licht“ formal wieder, ohne die Beziehung durch Zusätze wie „Herrschaft“ enger auszulegen.
theological_decisions:
- issue: Verhältnis von Licht, Wahrheit und Gott
  choice: Die parallelen Aussagen „unter dem Licht“ und „unter Gott“ bleiben unverändert nebeneinander stehen.
  alternative: „Alle Wahrheit gehört zum Licht, wie alles Gott untersteht.“
  rationale: Der griechische Text lässt die genaue Bedeutung von ὑπό und das Verhältnis zwischen Licht und Gott offen; eine explizite Gleichsetzung oder Herrschaftsdeutung würde diese Spannung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, paralleler Satzstruktur. Das elliptische zweite „nennen“ ist im Deutschen eindeutig und vermeidet unnötige Wiederholung.
