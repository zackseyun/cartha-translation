    issue: Die Koordination „man kann die Wahrheit nicht Lüge nennen und das Gerechte nicht ungerecht“ ist gegenüber οὐκ … οὐδέ weniger eindeutig.
    rationale: Ohne „weder … noch“ kann das deutsche „und“ formal so gelesen werden, als sei nur die gemeinsame Benennung beider Dinge ausgeschlossen. Die griechische Konstruktion verneint ausdrücklich beide Benennungen.
  - severity: low
    issue: „unter dem Licht stehen“ und besonders „unter Gott stehen“ sind im modernen Standarddeutsch stilistisch unnatürlich.
    rationale: „Unterstehen“ ist die übliche deutsche Entsprechung für ein Verhältnis des Untergeordnetseins und bewahrt die im Griechischen parallel gesetzte, nicht weiter erklärte Beziehung.
