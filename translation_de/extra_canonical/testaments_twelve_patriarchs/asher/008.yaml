base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/008.yaml
  text: And after saying these things to them[a], he commanded them, saying, “Bury me in Hebron.” And he died, having fallen asleep in a good sleep. And his sons did as he had commanded them, and they carried him away to Hebron and buried him with his fathers.
translation:
  language: de
  text: '8 Nachdem er dies zu ihnen gesagt hatte, gebot er ihnen: »Begrabt mich in Hebron.« Dann starb er, nachdem er in gutem Schlaf eingeschlafen war.[a] Seine Söhne taten, was er ihnen geboten hatte. Sie brachten ihn nach Hebron und begruben ihn bei seinen Vätern.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich verbindet der griechische Text die ausdrückliche Aussage, dass er starb, mit dem Bild des Schlafes: »nachdem er in gutem Schlaf eingeschlafen war«.'
    reason: Die ungewöhnliche Doppelung und das Nebeneinander von Todesaussage und Schlafbild sollen für heutige Leser erkennbar bleiben.
lexical_decisions:
- source_word: ἐνετείλατο
  choice: gebot er ihnen
  rationale: Das Verb bezeichnet hier eine verbindliche letzte Anweisung. »Gebot« bewahrt deren Gewicht und entspricht auch der späteren erzählenden Wiederaufnahme.
- source_word: Θάψατέ
  choice: Begrabt
  rationale: Der direkte Imperativ wird schlicht und bestimmt wiedergegeben, ohne die Bestattungsweise näher auszudeuten.
- source_word: Χεβρών
  choice: Hebron
  rationale: Verwendet die im Deutschen etablierte Form des Ortsnamens.
- source_word: ἀπέθανεν
  choice: starb er
  rationale: Die ausdrückliche Aussage über den Tod bleibt unverhüllt erhalten; die folgende Schlafmetapher wird daneben eigenständig wiedergegeben.
- source_word: ὕπνῳ καλῷ κοιμηθείς
  choice: nachdem er in einen guten Schlaf gefallen war
  rationale: Die Formulierung bewahrt sowohl das Schlafbild als auch die auffällige Verbindung des Verbs mit »Schlaf«, ohne sie deutend zu »friedlich« zu glätten.
- source_word: ἀπήγαγον
  choice: brachten ihn nach Hebron
  rationale: Im Zusammenhang bezeichnet das Verb die Überführung des Leichnams. »Brachten« ist im Deutschen natürlich und gibt die gerichtete Bewegung nach Hebron klar wieder.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: bei seinen Vätern
  rationale: »Bei« ist im Deutschen für die gemeinsame Begräbnisstätte idiomatischer als »mit«; »seinen Vätern« erhält die traditionelle Verwandtschafts- und Bestattungsformel.
theological_decisions:
- issue: Beschreibung des Todes durch ein Schlafbild
  choice: Sowohl »starb er« als auch »in einen guten Schlaf gefallen war« werden beibehalten.
  alternative: Nur »er starb friedlich« oder nur »er entschlief« wiedergeben.
  rationale: Der griechische Text verbindet die direkte Todesfeststellung mit einer bildhaften Schlafwendung. Beide Aussagen bleiben stehen, damit die literarische und mögliche theologische Spannung nicht aufgelöst wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper testamentarischer Erzählweise. Die direkte Rede bleibt schlicht und bestimmt. Die traditionelle Wendung »bei seinen Vätern« wird beibehalten, während Satzbau und Zeichensetzung heutigen deutschen Lesegewohnheiten folgen.
