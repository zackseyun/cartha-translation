  to: Ihr aber, meine Kinder, werdet nicht wie sie doppelgesichtig[a], was Güte und Bosheit betrifft, sondern haltet euch allein an die Güte; denn in ihr ruht Gott, der Herr, und die Menschen sehnen sich nach ihr. Flieht aber die Bosheit, indem ihr ihren Plan durch eure guten Taten zunichtemacht. Denn die Doppelgesichtigen gehören nicht zu Gott, sondern dienen ihren eigenen Begierden, um Beliar[b] und den Menschen zu gefallen, die ihnen gleichen.
  rationale: 'Die Revision beschränkt sich auf zwei sichere stilistisch-lexikalische Korrekturen: Die Beschreibung der Doppelgesichtigkeit wird im Deutschen flüssiger gefasst, und der neutrale „Plan“ ersetzt „Anschlag“. Der vollständige griechische Schluss über Menschen, die den Doppelgesichtigen gleichen, bleibt im Text; die englische Audit-Fassung ist an dieser Stelle verkürzt.'
