base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/003.yaml
  text: But you, my children, do not become double-faced like them, with both goodness and wickedness; rather cling to goodness alone, because the Lord God rests in it, and people long for it. But flee wickedness, destroying its scheme by your good deeds; for the double-faced are not of God, but serve their own desires, so that they may please Beliar.
translation:
  language: de
  text: Ihr aber, meine Kinder, werdet nicht wie sie doppelgesichtig[a], was Güte und Bosheit betrifft, sondern haltet euch allein an die Güte; denn in ihr ruht Gott, der Herr, und die Menschen sehnen sich nach ihr. Flieht aber die Bosheit, indem ihr ihren Plan durch eure guten Taten zunichtemacht. Denn die Doppelgesichtigen gehören nicht zu Gott, sondern dienen ihren eigenen Begierden, um Beliar[b] und den Menschen zu gefallen, die ihnen gleichen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zweigesichtig“; gemeint sind Menschen, die sich zugleich der Güte und der Bosheit zuwenden.'
    reason: Erläutert die bewusst bewahrte griechische Metapher.
  - marker: b
    text: Beliar ist in frühjüdischen Schriften eine Bezeichnung für die Macht oder den Anführer des Bösen.
    reason: Erklärt den vermutlich nicht allgemein bekannten Namen, ohne ihn im Haupttext interpretierend zu ersetzen.
lexical_decisions:
- source_word: διπρόσωποι
  choice: doppelgesichtig / die Doppelgesichtigen
  rationale: Bewahrt das anschauliche Bild des griechischen Ausdrucks und bezeichnet Menschen, die Güte und Bosheit zugleich vertreten, ohne die Metapher vorschnell als bloße Heuchelei oder Unentschlossenheit festzulegen.
- source_word: κολλήθητε
  choice: haltet euch ... an
  rationale: Gibt das nachdrückliche Sich-Anschließen bzw. Festhalten idiomatisch und verständlich wieder.
- source_word: ἀναπαύεται ἐν αὐτῇ
  choice: in ihr ruht
  rationale: Folgt dem griechischen Bild und lässt dessen theologische Aussage über Gottes Beziehung zur Güte stehen.
- source_word: τὸ διαβούλιον
  choice: ihren Anschlag
  rationale: Der seltene Ausdruck bezeichnet einen Plan oder ein Vorhaben; „Anschlag“ bringt hier die gegen die Güte gerichtete böse Absicht zum Ausdruck.
- source_word: ἀναιροῦντες
  choice: macht ... zunichte
  rationale: Vermittelt die starke Bedeutung des Aufhebens oder Vernichtens natürlich im Zusammenhang mit einem bösen Anschlag.
- source_word: τοῖς ὁμοίοις αὐτῶν ἀνθρώποις
  choice: den Menschen ..., die ihnen gleichen
  rationale: Nimmt den im griechischen Text vorhandenen, in der englischen Konsultationsfassung jedoch ausgelassenen Schlussteil ausdrücklich auf.
theological_decisions:
- issue: Zugehörigkeit der Doppelgesichtigen zu Gott
  choice: gehören nicht zu Gott
  alternative: sind nicht von Gott
  rationale: τοῦ Θεοῦ ist als Zugehörigkeit zu verstehen; die gewählte Formulierung ist im Deutschen klar, ohne eine weitergehende dogmatische Aussage über Ursprung oder Erwählung einzutragen.
- issue: Bezeichnung Beliar
  choice: Beliar
  alternative: der Teufel / Satan
  rationale: Der Eigenname des griechischen Textes bleibt erhalten, statt ihn mit einer theologischen Identifikation gleichzusetzen.
- issue: Bezugswort in „die ihnen gleichen“
  choice: Bezug auf die doppelgesichtigen Menschen
  alternative: Bezug auf ihre Begierden oder auf Beliar
  rationale: Das maskuline αὐτῶν verweist am natürlichsten auf die zuvor genannten Doppelgesichtigen; die Formulierung wahrt den grammatischen Bezug.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Mahnrede. Die Bildsprache des Ausgangstextes bleibt erhalten; Satzbau und Zeichensetzung sind für heutige Leser behutsam geglättet. Der im griechischen Text belegte Schlusssatzteil über gleichartige Menschen wurde gegenüber der englischen Konsultationsfassung wiedergegeben.
