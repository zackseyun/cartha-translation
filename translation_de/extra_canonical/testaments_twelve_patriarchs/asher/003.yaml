  naturalness: „doppelgesichtig in Güte und Bosheit“ wirkt im heutigen Deutsch syntaktisch holprig. „doppelgesichtig, was Güte und Bosheit betrifft“ ist klar, modern und lässt die griechische Metapher bestehen. Die partizipiale Beziehung in Vers 2 wird mit „indem“ idiomatisch und eng am Ausgangstext ausgedrückt.
  terminology: „doppelgesichtig“, „Güte“, „Bosheit“, „Beliar“ und „Begierden“ sind angemessen. Der Eigenname Beliar sollte nicht durch eine dogmatisch festgelegte Bezeichnung ersetzt werden.
