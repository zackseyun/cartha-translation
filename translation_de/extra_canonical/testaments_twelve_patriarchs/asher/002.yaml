  text: '1 There is, then, a soul that in its words turns away the good for the sake of evil, and leads the outcome of the matter into wickedness.


    2 There is a man who does not pity his own servants; and though this is double-faced, the whole of it is evil.


    3 And there is a man who loves one who acts wickedly, because he himself also chooses to die in evil on that man''s account; and concerning this it is plain that he is double-faced, but the whole of it is an evil deed.


    4 Even if they are in love, they are in wickedness when they hide evil under a good name; but the end of the deed comes to evil.


    5 Another steals, acts unjustly, plunders, is greedy, and yet shows mercy to the poor. This too is double-faced, but the whole of it is evil.


    6 The one who defrauds his neighbor provokes God, swears falsely by the Most High, and has no regard for the Lord, the giver of the law, yet gives rest to the poor.


    7 He stains the soul and makes the body bright; he kills many and shows mercy to a few. This too is double-faced, but the whole of it is evil.


    8 Another commits adultery and practices sexual immorality, and abstains from foods. And while fasting he does evil, and by the force of his wealth he drags many down, and out of his excessive wickedness performs the commandments. This is double-faced, but the whole of it is evil.


    9 Such people are like hares, because they are half clean, but in truth they are unclean.


    10 For God also, in the tablets of the commandments, has declared it so.'
translation:
  language: de
  text: '**Das Testament Aschers 2**


    **1** Es gibt also eine Seele, die mit ihren Worten das Gute um des Bösen willen abweist und den Ausgang der Sache ins Böse führt.


    **2** Es gibt einen Menschen, der mit seinen eigenen Dienern kein Erbarmen hat. Auch dies ist doppelgesichtig, doch als Ganzes ist es böse.


    **3** Es gibt einen Menschen, der einen Übeltäter liebt – und das ist Bosheit –, denn er entscheidet sich sogar dafür, im Bösen zu sterben. Daran wird deutlich: Es ist doppelgesichtig, doch als Ganzes ist es eine böse Tat.[a]


    **4** Auch wenn es Liebe ist: Wer das Böse unter einem guten Namen verbirgt, ist in Bosheit; das Ende der Tat aber führt ins Böse.[b]


    **5** Ein anderer stiehlt, tut Unrecht, raubt, ist habgierig und erweist den Armen doch Erbarmen. Auch dies ist doppelgesichtig, doch als Ganzes ist es böse.


    **6** Wer seinen Nächsten übervorteilt, reizt Gott zum Zorn, schwört beim Höchsten falsch und erweist dem Armen Erbarmen. Den Herrn, der das Gesetz angeordnet hat, missachtet und reizt er, während er dem Bedürftigen Erleichterung verschafft.


    **7** Er befleckt die Seele und bringt den Körper zum Glänzen; er tötet viele und erweist wenigen Erbarmen. Auch dies ist doppelgesichtig, doch als Ganzes ist es böse.


    **8** Ein anderer begeht Ehebruch und sexuelle Unmoral, enthält sich aber von Speisen. Während er fastet, tut er Böses; mit der Macht seines Reichtums reißt er viele ins Verderben, und aus maßloser Bosheit erfüllt er die Gebote. Dies ist doppelgesichtig, doch als Ganzes ist es böse.


    **9** Solche Menschen gleichen Hasen:[c] Sie sind zur Hälfte rein, in Wahrheit aber unrein.


    **10** Denn so hat es auch Gott auf den Tafeln der Gebote gesagt.


    [a] Der griechische Text von Vers 3 ist stellenweise beschädigt und lässt insbesondere den genauen Zusammenhang zwischen der Liebe zum Übeltäter und der Entscheidung, „im Bösen zu sterben“, offen.


    [b] Der griechische Wortlaut zu Beginn von Vers 4 ist unsicher. Die Übersetzung gibt vorsichtig die mögliche Aussage wieder, dass jemand, auch wenn sein Handeln als Liebe erscheint, durch das Verbergen des Bösen unter einer guten Bezeichnung in Bosheit steht.


    [c] Das griechische Wort bedeutet wörtlich „Rauhaarfüßer“ und ist eine Bezeichnung für Hasen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text von Vers 3 ist stellenweise beschädigt und lässt insbesondere den genauen Zusammenhang zwischen der Liebe zum Übeltäter und der Entscheidung, „im Bösen zu sterben“, offen.
    reason: Die beschädigte Satzüberlieferung erlaubt keine sichere Bestimmung des genauen Beziehungs- oder Motivzusammenhangs.
