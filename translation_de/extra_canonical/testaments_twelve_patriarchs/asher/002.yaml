    reason: Die verständliche Tierbezeichnung im Haupttext wird durch die Erklärung der ungewöhnlichen griechischen Wortbildung ergänzt.
lexical_decisions:
- source_word: διπρόσωπον
  choice: doppelgesichtig
  rationale: 'Die wörtlich-bildhafte Wiedergabe bewahrt das Leitmotiv des Abschnitts: eine Handlung zeigt ein gutes und ein böses Gesicht, wird als Ganzes jedoch moralisch beurteilt.'
- source_word: πλεονεκτεῖ / ὁ πλεονεκτῶν
  choice: ist habgierig / wer seinen Nächsten übervorteilt
  rationale: Das Verb kann sowohl Habgier als auch das Ausnutzen oder Übervorteilen eines anderen bezeichnen. Der jeweilige Kontext bestimmt die natürliche deutsche Formulierung.
- source_word: ἐλεεῖ
  choice: erweist Erbarmen
  rationale: Die Formulierung gibt den ethisch gewichtigen Sinn von Barmherzigkeit beziehungsweise tätigem Mitleid wieder und erhält den Kontrast zu den bösen Taten.
- source_word: κατασύρει
  choice: reißt … ins Verderben
  rationale: Das Verb bezeichnet ein gewaltsames Herab- oder Fortreißen. Die kontextuelle Ergänzung „ins Verderben“ macht die schädigende Wirkung verständlich, ohne eine konkrete Art der Unterdrückung festzulegen.
- source_word: δασύποδες
  choice: Hasen
  rationale: Das wörtlich „Rauhaarfüßer“ bedeutende Wort dient als griechische Tierbezeichnung für Hasen; die Fußnote erhält die Bildlichkeit des Ausdrucks.
- source_word: ἐντολέα τοῦ νόμου
  choice: der das Gesetz angeordnet hat
  rationale: Die aktive Rolle des Herrn als Urheber beziehungsweise Anordnender des Gesetzes wird ausgedrückt, ohne einen späteren theologischen Fachbegriff einzuführen.
theological_decisions:
- issue: Unklare Subjekt- und Beziehungsangaben in Vers 3
  choice: Die Entscheidung, im Bösen zu sterben, wird grammatisch dem beschriebenen Menschen zugeordnet; ein nicht ausdrücklich belegtes „für ihn“ wird nicht ergänzt.
  alternative: Er entscheidet sich, um des geliebten Übeltäters willen im Bösen zu sterben.
  rationale: Der griechische Text ist beschädigt und nennt keinen eindeutigen Zweck oder Stellvertretungsbezug. Die zurückhaltende Fassung vermeidet eine nicht gesicherte Motivdeutung; die Unsicherheit wird in einer Fußnote offengelegt.
- issue: Verhältnis von Liebe und Bosheit in Vers 4
  choice: Liebe kann in den Dienst der Bosheit treten, wenn sie Böses unter einem guten Namen verbirgt.
  alternative: Die Liebenden selbst befinden sich in Bosheit.
  rationale: Der verderbte griechische Satz erlaubt mehrere syntaktische Zuordnungen. Die gewählte Fassung bewahrt die ethische Spannung, dass etwas als Liebe Bezeichnetes böse wirken kann, ohne Liebe an sich als Bosheit zu definieren.
- issue: Erfüllung der Gebote aus Bosheit in Vers 8
  choice: Die paradoxe Aussage wird unverändert stehen gelassen.
  alternative: Die Gebotserfüllung als bloße Heuchelei oder vorgetäuschte Frömmigkeit erklären.
  rationale: Der Ausgangstext formuliert bewusst zugespitzt, dass jemand „aus maßloser Bosheit“ Gebote erfüllt. Eine ausdrückliche Deutung als Heuchelei würde die theologische und moralische Spannung vorzeitig auflösen.
- issue: Rein und unrein in Vers 9
  choice: Die kultische Sprache „zur Hälfte rein … in Wahrheit aber unrein“ wird beibehalten.
  alternative: Die Aussage rein moralisch als „teilweise gut, tatsächlich aber böse“ paraphrasieren.
  rationale: Der folgende Hinweis auf die Gebotstafeln und das Tierbild greifen die Sprache des Gesetzes auf. Die kultische Metaphorik soll nicht durch eine rein moralische Erklärung ersetzt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klaren Parallelstrukturen. Wiederkehrende Schlüsselbegriffe wie „doppelgesichtig“, „als Ganzes“, „böse“ und „Erbarmen“ werden bewusst konsistent wiedergegeben. Archaische Satzstellung und konfessionell geprägte Fachsprache wurden vermieden; die rhetorischen Gegensätze und die Härte der moralischen Urteile bleiben erhalten.
