source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: II. *Ἔστιν οὖν¹ ἡ² ψυχὴ *ἐν λόγοις †ἀφιστῶσα³ τὸ καλὸν ὑπὲρ *τοῦ κακοῦ⁴, καὶ *τὸ τέλος⁵ *τοῦ πράγματος⁶ εἰς κακίαν †ἄγων⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/001.yaml
  text: There is, then, a soul that in words turns away from the good for the sake of evil, and leads the outcome of the matter into wickedness.
translation:
  language: de
  text: Es gibt also eine Seele, die sich in Worten vom Guten zugunsten des Bösen abwendet und den Ausgang der Sache ins Böse führt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text ist an dieser Stelle grammatisch unregelmäßig: Das erste Partizip ist feminin und bezieht sich auf „Seele“, das zweite steht dagegen im Maskulinum. Die Übersetzung versteht weiterhin die Seele als handelndes Subjekt.'
    reason: Die in der Edition gekennzeichnete textliche beziehungsweise syntaktische Schwierigkeit soll sichtbar bleiben, ohne den Haupttext unnötig zu verunklaren.
lexical_decisions:
- source_word: ψυχὴ
  choice: Seele
  rationale: Die direkte und im Kontext angemessene Wiedergabe des griechischen Begriffs.
- source_word: ἐν λόγοις
  choice: in Worten
  rationale: Bewahrt die knappe Formulierung und beschränkt die Aussage nicht unnötig auf die eigenen Worte der Seele.
- source_word: ἀφιστῶσα τὸ καλὸν
  choice: sich … vom Guten … abwendet
  rationale: ἀφίστημι wird hier medial beziehungsweise intransitiv verstanden; modernes Deutsch verlangt dabei „sich von etwas abwenden“.
- source_word: ὑπὲρ τοῦ κακοῦ
  choice: zugunsten des Bösen
  rationale: Gibt die hier naheliegende Bedeutung von ὑπέρ als Parteinahme oder Begünstigung wieder, ohne eine weitergehende Motivation einzutragen.
- source_word: τὸ τέλος τοῦ πράγματος
  choice: den Ausgang der Sache
  rationale: τέλος bezeichnet hier das Ende beziehungsweise Ergebnis; „Ausgang“ ist im Deutschen natürlich und bewahrt beide Aspekte.
- source_word: εἰς κακίαν
  choice: ins Böse
  rationale: Eine natürliche deutsche Wiedergabe der Zielrichtung; sie lässt offen, ob κακία moralische Bosheit, Schlechtigkeit oder Verderbtheit bezeichnet.
theological_decisions:
- issue: Bezug des zweiten Partizips ἄγων
  choice: Die Seele bleibt sinngemäß das Subjekt von „führt“.
  alternative: Ein unausgesprochenes maskulines Bezugswort oder eine textkritische Korrektur annehmen.
  rationale: Der überlieferte griechische Wortlaut wechselt zwar unerwartet vom femininen ἀφιστῶσα zum maskulinen ἄγων, doch der Satz bietet kein eindeutiges anderes Subjekt. Die Übersetzung folgt daher dem nächstliegenden Sinn und weist in der Fußnote auf die Unregelmäßigkeit hin.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Formulierung bleibt nahe an der knappen griechischen Satzstruktur, wird aber idiomatisch gestaltet.
