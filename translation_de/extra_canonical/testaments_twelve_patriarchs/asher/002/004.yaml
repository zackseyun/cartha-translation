translation:
  language: de
  text: Auch wenn jemand Liebe hat,[a] ist derjenige, der das Böse unter einem guten Namen verbirgt, in Bosheit; das Ende der Tat aber führt zum Bösen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut ist an dieser Stelle unsicher und grammatisch schwierig. Die Verbindung von „Liebe“ mit dem folgenden maskulinen Ausdruck kann auch sinngemäß verstanden werden: „Selbst Liebe ist Bosheit, wenn sie das Böse unter einem guten Namen verbirgt.“'
    reason: Die Fußnote macht die textkritische und syntaktische Unsicherheit transparent, ohne eine der möglichen Deutungen im Haupttext als sicher auszugeben.
lexical_decisions:
- source_word: ἀγάπη οὖσα
  choice: selbst wenn Liebe vorhanden ist
  rationale: Die ungewöhnliche Partizipialfügung wird als einräumende Aussage wiedergegeben, ohne die Liebe selbst mit der nachfolgenden männlichen Personenbezeichnung gleichzusetzen.
- source_word: ἐν πονηρίᾳ ἐστίν
  choice: befindet sich in Bosheit
  rationale: Bewahrt die bildhafte griechische Wendung und vermeidet eine Abschwächung zu bloßem Fehlverhalten.
- source_word: ὁ συγκρύπτων τὸ κακόν
  choice: wer das Böse … verbirgt
  rationale: Die substantivierte männliche Partizipialform wird im Deutschen allgemein und natürlich mit „wer“ wiedergegeben.
- source_word: ὑπὲρ τὸ ὄνομα τὸ καλόν
  choice: unter der guten Bezeichnung
  rationale: Gibt den im Zusammenhang naheliegenden Gedanken wieder, dass Böses mit einer positiv klingenden Benennung verdeckt wird; die sprachliche und textkritische Unsicherheit wird in der Fußnote offengelegt.
- source_word: τὸ τέλος τῆς πράξεως ἔρχεται εἰς κακόν
  choice: das Ende der Tat aber führt zum Bösen
  rationale: Bildet Zielrichtung und Ergebnis der Handlung verständlich ab und wahrt die Wiederholung von „Böses/Bösen“.
theological_decisions:
- issue: Verhältnis von Liebe und Bosheit
  choice: 'Die einräumende Spannung bleibt bestehen: Vorhandene oder beanspruchte Liebe hebt die Bosheit des Verbergens nicht auf.'
  alternative: „Liebe, die das Böse verbirgt, ist Bosheit“
  rationale: Die Alternative glättet die grammatisch schwierige Überlieferung und identifiziert „Liebe“ unmittelbar mit dem Verbergenden; diese Deutung ist im griechischen Wortlaut wegen des Genuswechsels nicht eindeutig.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die antithetische Wiederholung von „Böse/Bösen“ und der moralische Ernst des Satzes bleiben erhalten; die beschädigte Syntax wird im Haupttext lesbar gefasst und in der Fußnote transparent gemacht.
