base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/006.yaml
  text: The one who defrauds his neighbor provokes God, swears falsely by the Most High, sets aside and provokes the Lord, the giver of the law, and gives rest to the poor.
translation:
  language: de
  text: Wer seinen Nächsten übervorteilt, reizt Gott zum Zorn, schwört beim Höchsten falsch und erbarmt sich des Armen. Den Herrn, den Geber des Gesetzes, verwirft und reizt er, und dem Bedürftigen verschafft er Ruhe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte griechische Wortlaut ist am Anfang dieser Aussage textlich schwierig; insbesondere steht dort zusätzlich das isolierte Wort „Arme“ im Plural. Die Übersetzung folgt dem grammatisch zusammenhängenden Satz. Wörtlich lautet der Schluss: „und den Bedürftigen lässt er ruhen“.'
    reason: Die Vorlage enthält nach „seinen Nächsten“ ein syntaktisch unverbundenes πτωχούς; zudem soll die konkrete Bedeutung von ἀναπαύει transparent bleiben.
lexical_decisions:
- source_word: πλεονεκτῶν
  choice: übervorteilt
  rationale: Das Verb bezeichnet hier, sich auf Kosten eines anderen einen Vorteil zu verschaffen bzw. ihn auszubeuten; „übervorteilt“ gibt dies im Deutschen prägnant wieder.
- source_word: παροργίζει
  choice: reizt … zum Zorn
  rationale: Die Wendung bildet die Bedeutung des Verbs genauer und natürlicher ab als das bloße „provoziert“.
- source_word: ἐπιορκεῖ
  choice: schwört … falsch
  rationale: Das Verb bedeutet, einen falschen Eid zu leisten bzw. einen Eid zu brechen; mit τὸν ὕψιστον ist der Höchste die beim Schwur angerufene Instanz.
- source_word: ἐλεεῖ
  choice: erbarmt sich
  rationale: Bewahrt den konkreten Sinn von Barmherzigkeit gegenüber dem Armen und den würdigen Ton.
- source_word: ἐντολέα τοῦ νόμου
  choice: der das Gesetz geboten hat
  rationale: Gibt den Herrn als denjenigen wieder, der das Gesetz anordnet; dies ist im Deutschen natürlicher als „Geber des Gesetzes“, ohne den Sinn einzuengen.
- source_word: ἀθετεῖ
  choice: verwirft
  rationale: Das Verb kann „zurückweisen“, „außer Kraft setzen“ oder „missachten“ bedeuten; „verwirft“ bewahrt hier die starke persönliche Zurückweisung des Herrn.
- source_word: παροξύνει
  choice: reizt
  rationale: Das Verb bezeichnet ein scharfes Reizen oder Erbittern; die knappe Wiedergabe wahrt die Parallelität.
- source_word: ἀναπαύει
  choice: verschafft … Ruhe
  rationale: Gibt den kausativen Sinn „ausruhen lassen, erquicken“ direkt wieder, ohne die konkrete Metapher aufzulösen.
- source_word: πένητα
  choice: Bedürftigen
  rationale: Unterscheidet den mittellosen oder bedürftigen Menschen sprachlich vom zuvor genannten πτωχός („Armen“), soweit dies im Deutschen möglich ist.
theological_decisions:
- issue: Nebeneinander widersprüchlicher Handlungen
  choice: Die positiven Handlungen gegenüber Armen bleiben neben den Vergehen unaufgelöst stehen.
  alternative: Durch „doch“ oder „obwohl“ ausdrücklich eine heuchlerische oder kompensatorische Absicht markieren.
  rationale: Der Abschnitt stellt gegensätzliche Taten nebeneinander. Der griechische Wortlaut enthält hier jedoch nur καί; die Übersetzung importiert daher keine ausdrücklich benannte Motivation.
- issue: Bezug von τὸν ὕψιστον bei ἐπιορκεῖ
  choice: „schwört beim Höchsten falsch“
  alternative: „handelt treulos gegen den Höchsten“ oder „schwört dem Höchsten falsch“
  rationale: ἐπιορκέω bezeichnet gewöhnlich falsches Schwören; der Akkusativ kann die beim Eid angerufene Instanz bezeichnen. Die gewählte Fassung bewahrt den Eidesbezug.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die auffällige moralische Spannung des griechischen Textes wird nicht durch erklärende Konnektoren aufgelöst. „Übervorteilt“, „verwirft“ und „verschafft Ruhe“ sind verständlich, zugleich aber ausreichend präzise für den testamentarischen Mahnredenstil.
