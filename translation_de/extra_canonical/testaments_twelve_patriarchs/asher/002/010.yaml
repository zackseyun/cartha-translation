  language: de
  text: Denn auch Gott hat es auf den Tafeln der Gebote so gesagt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Denn auch
  rationale: Gibt die begründende Partikel γάρ und das additive καί knapp und natürlich wieder.
- source_word: ἐν ταῖς πλαξὶ τῶν ἐντολῶν
  choice: auf den Tafeln der Gebote
  rationale: Das Deutsche verwendet bei einer schriftlichen Aussage idiomatisch „auf“; der Genitiv „der Gebote“ bleibt bewusst erhalten.
- source_word: οὕτως εἶπεν
  choice: hat es so gesagt
  rationale: Bewahrt das schlichte Verb „sagen“ und gibt οὕτως mit „so“ wieder; das ergänzte „es“ sorgt für einen natürlichen deutschen Satzanschluss.
theological_decisions:
- issue: Bezug auf die Gesetzestafeln
  choice: Tafeln der Gebote
  alternative: Gebotstafeln
  rationale: Die gewählte Form wahrt die genitivische Struktur des Griechischen und legt nicht näher fest, welche konkrete Bezeichnung oder Sammlung gemeint ist.
translation_notes:
  register: Knappes, würdiges modernes Standarddeutsch; die begründende Funktion des Satzes und sein Rückbezug auf die vorausgehende Aussage bleiben erhalten.
