source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἔστιν ἄνθρωπος ἀγαπῶν πονηρευόμενον †ὃ ἐστι πονηρία†¹³, ὅτι καὶ ἀποθανεῖν αἱρεῖται ἐν κακῷ· καὶ περὶ τούτου φανερόν ἐστι †τὸ ὅλον†¹⁴ διπρόσωπόν ἐστι τὸ δὲ πᾶν κακὴ πρᾶξις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/003.yaml
  text: And there is a man who loves one who acts wickedly, because he himself also chooses to die in evil on that man's account; and concerning this it is plain that he is double-faced, but the whole of it is an evil deed.
translation:
  language: de
  text: Es gibt einen Menschen, der jemanden liebt, der Böses tut – und das ist Bosheit[a] –, denn auch er entscheidet sich, im Bösen zu sterben. Daran wird deutlich, dass das Ganze[b] doppelgesichtig ist; doch alles ist böses Tun.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte »und das ist Bosheit« sind im griechischen Text unsicher überliefert.
    reason: Die Edition kennzeichnet ὃ ἐστι πονηρία mit Cruces als wahrscheinlich verderbte oder zweifelhafte Textstelle.
  - marker: b
    text: Die Worte »das Ganze« sind im griechischen Text unsicher überliefert; möglicherweise ist stattdessen die betreffende Person als »doppelgesichtig« gemeint.
    reason: Die Edition kennzeichnet τὸ ὅλον mit Cruces. Die grammatische Form stützt den Haupttext, doch wegen der Textunsicherheit ist die personenbezogene Deutung als Alternative anzuführen.
lexical_decisions:
- source_word: πονηρευόμενον
  choice: einen, der Böses tut
  rationale: Das substantivisch gebrauchte Partizip bezeichnet eine Person, die böse handelt; die Wiedergabe bleibt handlungsbezogen und macht daraus nicht pauschal einen »bösen Menschen«.
- source_word: ἀποθανεῖν αἱρεῖται ἐν κακῷ
  choice: entscheidet sich sogar dafür, im Bösen zu sterben
  rationale: Gibt die bewusste Wahl (αἱρεῖται), die Steigerung durch καί und die knappe Wendung ἐν κακῷ möglichst direkt wieder.
- source_word: διπρόσωπον
  choice: doppelgesichtig
  rationale: Bewahrt das Bild von zwei Gesichtern und damit die im Kontext zentrale moralische Zwiespältigkeit, ohne es auf bloße Unaufrichtigkeit einzuengen.
- source_word: κακὴ πρᾶξις
  choice: eine böse Tat
  rationale: πρᾶξις bezeichnet hier ein Tun beziehungsweise eine Handlung; »Tat« ist natürlich und prägnant.
theological_decisions:
- issue: Bezug und Subjekt von διπρόσωπον
  choice: Das Ganze ist doppelgesichtig
  alternative: Er ist doppelgesichtig
  rationale: Das überlieferte neutrale τὸ ὅλον passt grammatisch zu διπρόσωπον. Obwohl der Text an dieser Stelle unsicher ist und die englische Konsultationsfassung auf den Menschen bezieht, wird die griechische Lesart im Haupttext bewahrt.
- issue: Kausaler Anschluss mit ὅτι
  choice: denn er entscheidet sich sogar dafür
  alternative: sodass er sich sogar dafür entscheidet
  rationale: ὅτι kann kausal oder inhaltlich verstanden werden. »Denn« entspricht der naheliegenden Begründung, ohne einen im Griechischen nicht ausdrücklich genannten Bezug wie »um jenes Menschen willen« einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Bildsprache »doppelgesichtig« bleibt erhalten. Die beiden textkritisch unsicheren Stellen werden im Text lesbar wiedergegeben und durch Fußnoten transparent gemacht; nicht ausdrücklich im Griechischen enthaltene Ergänzungen der englischen Konsultationsfassung werden vermieden.
