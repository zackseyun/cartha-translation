id: T12P.ASH.2.5
reference: Testament of Asher 2:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἄλλος²⁷ κλέπτει, ἀδικεῖ²⁸, ἁρπάζει, πλεονεκτεῖ²⁸, καὶ ἐλεεῖ²⁹ πτωχούς· διπρόσωπον μὲν ⌈καὶ⌉³⁰ τοῦτο, *τὸ δὲ ὅλον³¹ πονηρόν³² ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/005.yaml
  text: Another steals, acts unjustly, plunders, is greedy, and shows mercy to the poor. This too is double-faced, but the whole of it is evil.
translation:
  language: de
  text: Ein anderer stiehlt, tut Unrecht, raubt, ist habgierig und erbarmt sich der Armen. Auch dies ist doppelgesichtig, doch das Ganze ist böse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄλλος
  choice: Ein anderer
  rationale: Gibt den Wechsel zu einem weiteren Beispiel unmittelbar und natürlich wieder.
- source_word: ἀδικεῖ
  choice: tut Unrecht
  rationale: Bewahrt die allgemeine Bedeutung des Verbs, ohne sie auf ein bestimmtes Vergehen einzuengen.
- source_word: ἁρπάζει
  choice: raubt
  rationale: Gibt das gewaltsame oder widerrechtliche Ansichnehmen knapp wieder und unterscheidet es von κλέπτει.
- source_word: πλεονεκτεῖ
  choice: ist habgierig
  rationale: Bezeichnet hier das eigennützige Streben nach mehr; die Personenbeschreibung fügt sich natürlich in die Aufzählung ein.
- source_word: ἐλεεῖ πτωχούς
  choice: erbarmt sich der Armen
  rationale: Entspricht dem aktiven Erweisen von Erbarmen gegenüber armen Menschen und wahrt den ethischen Ton.
- source_word: διπρόσωπον
  choice: doppelgesichtig
  rationale: Bewahrt das anschauliche Bild zweier Gesichter und die Aussage über den widersprüchlichen Charakter des Verhaltens.
- source_word: τὸ δὲ ὅλον πονηρόν ἐστιν
  choice: doch das Ganze ist böse
  rationale: Gibt den Gegensatz und das abschließende Gesamturteil eng am Griechischen wieder.
theological_decisions:
- issue: Verhältnis der Barmherzigkeit zu den vorausgehenden Vergehen
  choice: Die Handlungen werden ohne zusätzliches »dennoch« oder »aber« aufgezählt.
  alternative: »und erbarmt sich dennoch der Armen«
  rationale: Das Griechische verbindet ἐλεεῖ lediglich mit καί. Die Spannung wird durch den folgenden Satz ausdrücklich bewertet und soll nicht vorzeitig verstärkt oder aufgelöst werden.
- issue: Bezug von »das Ganze«
  choice: Die umfassende Formulierung bleibt bestehen.
  alternative: »sein gesamtes Verhalten ist böse«
  rationale: τὸ ὅλον ist bewusst knapp und kann die gesamte beschriebene Verbindung von Handlungen meinen; eine explizitere Deutung würde den Wortlaut verengen.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Reihung der Verben. »Doppelgesichtig« ist weniger alltäglich als »zwiespältig«, erhält aber das konkrete Bild von διπρόσωπον und passt zum literarisch-weisheitlichen Register.
