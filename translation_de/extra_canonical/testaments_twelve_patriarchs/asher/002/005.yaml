  revision_rationale: Keine sichere Korrektur erforderlich. Der deutsche Text entspricht dem griechischen Wortlaut und der englischen POB-Prüfspur, insbesondere indem er vor „erbarmt sich“ kein zusätzliches „dennoch“ oder „aber“ einfügt. Für die im Quellentext als kritischer Apparat markierten hochgestellten Ziffern wurden keine zugehörigen Fußnotentexte geliefert; daher sind keine Fußnotenanker anzulegen oder zu ändern.
