source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: ⌈Τὴν⁴³ ψυχὴν σπιλοῖ, καὶ⌉ τὸ σῶμα λαμπρύνει⁴⁴, πολλοὺς ἀναιρεῖ καὶ ὀλίγους ἐλεεῖ, καὶ τοῦτο⁴⁵ διπρόσωπόν⁴⁶ ἐστι, *τὸ δὲ ὅλον πονηρόν ἐστιν⁴⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/007.yaml
  text: It stains the soul and makes the body bright; it kills many and shows mercy to a few. This too is double-faced, but the whole of it is evil.
translation:
  language: de
  text: Es befleckt die Seele und lässt den Körper glänzen; es tötet viele und hat mit wenigen Erbarmen. Auch dies ist doppelgesichtig, doch es ist ganz und gar böse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπιλοῖ
  choice: befleckt
  rationale: Gibt die konkrete Bildsprache des Verunreinigens wieder und passt natürlich zum Objekt „die Seele“.
- source_word: λαμπρύνει
  choice: lässt … glänzen
  rationale: Bewahrt den Gegensatz zwischen der befleckten Seele und dem äußerlich glänzenden Körper, ohne die Art des Glanzes näher festzulegen.
- source_word: ἀναιρεῖ
  choice: tötet
  rationale: Im Zusammenhang mit Personen ist dies die direkte und naheliegende Wiedergabe.
- source_word: ἐλεεῖ
  choice: erbarmt sich
  rationale: Entspricht dem griechischen Verb und erhält dessen moralisch-emotionale Aussage.
- source_word: διπρόσωπον
  choice: doppelgesichtig
  rationale: Bewahrt die anschauliche Metapher des griechischen Ausdrucks und den Bezug auf die zwei gegensätzlichen Wirkungen.
- source_word: τὸ δὲ ὅλον
  choice: doch als Ganzes
  rationale: Gibt die Gesamtbewertung idiomatisch wieder, ohne sie als Aussage über jedes einzelne Element umzudeuten.
theological_decisions:
- issue: Bezug des grammatisch sächlichen Subjekts
  choice: „Es“ beziehungsweise „dies“
  alternative: „Er“
  rationale: Das Griechische verwendet sächliche Formen; die Übersetzung wahrt diesen Rückbezug, statt ohne Grundlage ein männliches Subjekt einzuführen.
- issue: Spannung zwischen äußerem Glanz und innerer Befleckung
  choice: Beide Aussagen unvermittelt nebeneinander beibehalten
  alternative: Den körperlichen Glanz ausdrücklich als nur scheinbar oder äußerlich deuten
  rationale: Der Ausgangstext formuliert den Gegensatz, erklärt ihn aber nicht; die Übersetzung soll diese Spannung nicht auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der bildhafte Ausdruck „doppelgesichtig“ bleibt bewusst erhalten; „nur weniger“ hebt die starke Gegenüberstellung von vielen und wenigen natürlich hervor.
