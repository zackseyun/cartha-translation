revisions:
- from: Ein anderer begeht Ehebruch und Unzucht und enthält sich bestimmter Speisen. Während er fastet, tut er Böses; durch die Macht des Reichtums reißt er viele mit ins Verderben, und aus maßloser Bosheit hält er die Gebote. Das ist doppelgesichtig, als Ganzes aber ist es böse.
  to: Ein anderer begeht Ehebruch und Unzucht und enthält sich von Speisen. Während er fastet, tut er Böses; durch die Macht des Reichtums reißt er viele mit sich hinab, und aus maßloser Bosheit hält er die Gebote. Das ist doppelgesichtig, als Ganzes aber ist es böse.
  rationale: 'Die Revision entfernt zwei nicht ausdrücklich im griechischen Wortlaut enthaltene Präzisierungen: die Beschränkung auf »bestimmte« Speisen und das Ziel »ins Verderben«. Zugleich bleibt die bildhafte und negative Bewegung von κατασύρει erhalten. Die paradoxe Aussage, dass der Betreffende aus maßloser Bosheit die Gebote hält, wird nicht harmonisierend umgedeutet. Eine knappe Fußnote dokumentiert die textkritisch ergänzte Artikelform.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T04:14:11Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt die Satzfolge, die Gegenüberstellung von Fasten und bösem Handeln, die soziale Macht des Reichtums sowie das paradoxe »Halten der Gebote« insgesamt zutreffend wieder. »bestimmter« hat jedoch keine ausdrückliche Grundlage in ἐδεσμάτων, und »ins Verderben« legt das Ziel von κατασύρει stärker aus, als der griechische Text es hier benennt.
  naturalness: Die Sprache ist klar und modernes Standarddeutsch. »Viele mit sich hinabreißen« ist idiomatisch und bewahrt das Bild von κατασύρει besser als die ergänzende Deutung »ins Verderben«. »Doppelgesichtig« ist verständlich und angemessen für διπρόσωπον.
  terminology: »Ehebruch«, »Unzucht«, »fasten«, »Gebote halten«, »Macht des Reichtums« und »maßlose Bosheit« sind sachgerecht. Die Textkonjektur bzw. Ergänzung des Artikels τὰ vor ἐντολάς sollte knapp dokumentiert werden, da sie im edierten griechischen Text in eckigen Klammern steht.
  issues:
  - severity: medium
    issue: »bestimmter Speisen« fügt eine Einschränkung hinzu.
    rationale: ἀπέχεται ἐδεσμάτων bedeutet schlicht »sich von Speisen enthalten«. Der Kontext kann einen selektiven Speiseverzicht nahelegen, doch der griechische Wortlaut spezifiziert dies nicht.
  - severity: medium
    issue: »reißt er viele mit ins Verderben« ergänzt ein Ziel.
    rationale: κατασύρει bezeichnet ein Hinab-, Mit- oder Niederreißen. Die negative Wertung ist im Kontext klar, aber ein ausdrücklich genanntes »Verderben« steht nicht im Text.
  - severity: low
    issue: Die ergänzte Lesung τὰ vor »Gebote« bleibt unmarkiert.
    rationale: Charles druckt τὰ in eckigen Klammern. Dies beeinflusst den Sinn nicht, sollte aber in einer textkritisch sensiblen Ausgabe als Ergänzung kenntlich sein.
  revised_text: Ein anderer begeht Ehebruch und Unzucht und enthält sich von Speisen. Während er fastet, tut er Böses; durch die Macht des Reichtums reißt er viele mit sich hinab, und aus maßloser Bosheit hält er die Gebote. Das ist doppelgesichtig, als Ganzes aber ist es böse.
  revised_footnotes:
