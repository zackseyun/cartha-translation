id: T12P.ASH.2.8
reference: Testament of Asher 2:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἄλλος⁴⁸ μοιχεύει *καὶ πορνεύει⁴⁹ καὶ ἀπέχεται ἐδεσμάτων⁵⁰. καὶ⁵¹ νηστεύων κακοποιεῖ, καὶ τῇ³⁵ δυναστείᾳ *τοῦ πλούτου⁵² πολλοὺς κατασύρει⁵³, καὶ ἐκ⁵⁴ τῆς ὑπερόγκου⁵⁵ κακίας ποιεῖ⁵⁶ ⌈τὰς⌉⁵⁷ ἐντολάς⁵⁸. τοῦτο διπρόσωπόν ἐστιν⁵⁹, *τὸ δὲ ὅλον⁶⁰ κακόν ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/008.yaml
  text: Another commits adultery and practices sexual immorality, and abstains from foods. And while fasting he does evil, and by the power of wealth he drags many down, and out of excessive wickedness keeps the commandments. This is double-faced, but it is altogether evil.
translation:
  language: de
  text: Ein anderer begeht Ehebruch und Unzucht und enthält sich von Speisen. Während er fastet, tut er Böses; durch die Macht des Reichtums reißt er viele mit sich hinab, und aus maßloser Bosheit hält er die Gebote. Das ist doppelgesichtig, als Ganzes aber ist es böse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μοιχεύει καὶ πορνεύει
  choice: begeht Ehebruch und Unzucht
  rationale: Gibt die beiden unterschiedlichen Ausdrücke für Ehebruch und sonstige sexuelle Unmoral knapp und würdig wieder.
- source_word: ἀπέχεται ἐδεσμάτων
  choice: enthält sich bestimmter Speisen
  rationale: Natürliches Deutsch für kultisch oder asketisch motivierten Speiseverzicht; „bestimmter“ verdeutlicht, dass nicht völliger Nahrungsverzicht gemeint ist, ohne konkrete Speisen festzulegen.
- source_word: τῇ δυναστείᾳ τοῦ πλούτου
  choice: durch die Macht des Reichtums
  rationale: Bewahrt die Vorstellung, dass Reichtum gesellschaftliche Macht und Einfluss verleiht.
- source_word: πολλοὺς κατασύρει
  choice: reißt er viele mit ins Verderben
  rationale: κατασύρει bezeichnet ein gewaltsames Herab- oder Mitreißen; die Ergänzung „ins Verderben“ macht die negative Zielrichtung im Deutschen verständlich.
- source_word: ποιεῖ τὰς ἐντολάς
  choice: hält er die Gebote
  rationale: Idiomtische deutsche Wiedergabe von „die Gebote tun/befolgen“; die paradoxe Verbindung mit Bosheit bleibt unverändert stehen.
- source_word: διπρόσωπόν
  choice: doppelgesichtig
  rationale: Bewahrt das anschauliche Bild des griechischen Wortes und bezeichnet die widersprüchliche Verbindung äußerer Frömmigkeit mit bösem Handeln.
- source_word: τὸ δὲ ὅλον κακόν ἐστιν
  choice: als Ganzes aber ist es böse
  rationale: Gibt die Gesamtbewertung wieder, ohne die vorher beschriebene Spannung sprachlich aufzulösen.
theological_decisions:
- issue: Gebotserfüllung aus Bosheit
  choice: „aus maßloser Bosheit hält er die Gebote“ unverändert paradox wiedergeben
  alternative: Die Aussage als bloßen Schein der Gebotserfüllung erklären, etwa „gibt vor, die Gebote zu halten“
  rationale: Der griechische Text sagt ausdrücklich, dass er die Gebote tut, und erläutert nicht, ob dies Heuchelei, schädliche Absicht oder eine andere Form widersprüchlichen Handelns meint. Die Übersetzung darf diese theologische und ethische Spannung nicht stillschweigend auflösen.
- issue: Gesamturteil über gemischtes Handeln
  choice: „als Ganzes aber ist es böse“
  alternative: „doch alles daran ist böse“
  rationale: Die gewählte Fassung lässt offen, ob τὸ ὅλον die gesamte Verhaltensweise oder das doppelgesichtige Phänomen bezeichnet, und betont zugleich das eindeutige negative Gesamturteil.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem ethischem Ton. Die Reihung und die scharfen Gegensätze des griechischen Textes bleiben erhalten. Keine konfessionellen Deutungen wurden ergänzt.
