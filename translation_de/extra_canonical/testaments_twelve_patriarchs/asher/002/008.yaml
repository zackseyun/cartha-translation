    text: Der Artikel »die« vor »Gebote« beruht auf einer im griechischen Text ergänzten Lesung (τὰ).
    reason: Der Artikel τὰ ist in der zugrunde gelegten Ausgabe in eckigen Klammern ergänzt; die Ergänzung ändert die Aussage nicht.
