source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἔστιν⁸ ἄνθρωπος ὃς⁹ οὐκ οἰκτείρει¹⁰ *λειτουργοὺς αὐτοῦ¹¹. καίγε τοῦτο διπρόσωπον¹², ἀλλὰ τὸ ὅλον πονηρόν ἐστιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/002.yaml
  text: There is a man who does not pity his servants; and though this is double-faced, the whole of it is evil.
translation:
  language: de
  text: Es gibt einen Menschen, der mit seinen Dienern kein Erbarmen hat. Und doch ist dies doppelgesichtig, aber im Ganzen ist es böse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ οἰκτείρει
  choice: kein Erbarmen hat
  rationale: Gibt die verneinte Aussage des Verbs οἰκτείρω in natürlichem, würdevollem Deutsch wieder.
- source_word: λειτουργοὺς αὐτοῦ
  choice: seinen Dienern
  rationale: λειτουργούς kann hier allgemein Personen bezeichnen, die jemandem dienen; αὐτοῦ wird ohne zusätzliche Verstärkung als Possessiv wiedergegeben.
- source_word: διπρόσωπον
  choice: doppelgesichtig
  rationale: Bewahrt das Bild des griechischen Ausdrucks und die im Zusammenhang beabsichtigte moralische Zweideutigkeit, ohne sie vorschnell als bloße Heuchelei auszulegen.
- source_word: τὸ ὅλον πονηρόν ἐστιν
  choice: als Ganzes ist es böse
  rationale: Gibt die Gesamtbewertung knapp und nahe an der griechischen Satzstruktur wieder.
theological_decisions:
- issue: Bewertung der doppelgesichtigen Handlung
  choice: Die Spannung zwischen einer möglicherweise gemischten Erscheinung und der abschließenden Gesamtbewertung bleibt erhalten.
  alternative: διπρόσωπον ausdrücklich als „heuchlerisch“ oder „zwiespältig“ deuten.
  rationale: Der griechische Text nennt die Sache doppelgesichtig, erklärt sie jedoch insgesamt für böse; die Übersetzung sollte diese Spannung nicht durch eine engere theologische oder moralpsychologische Deutung auflösen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Der erste Satz bleibt allgemein und beispielhaft; der zweite bewahrt die markante Bildsprache des Originals.
