source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Οἱ τοιοῦτοί εἰσι⁶¹ δασύποδες, ὅτι⁶² ἐξ ἡμισείας εἰσὶ καθαροί, τὸ δ᾽ ἀληθὲς⁶³ ἀκάθαρτοί εἰσι.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/002/009.yaml
  text: Such people are like hares, because they are half clean, but in truth they are unclean.
translation:
  language: de
  text: Solche Menschen gleichen Hasen, denn sie sind nur zur Hälfte rein, in Wahrheit aber sind sie unrein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ τοιοῦτοι
  choice: Solche Menschen
  rationale: Gibt die substantivische Wendung natürlich und allgemein verständlich wieder.
- source_word: δασύποδες
  choice: Hasen
  rationale: Das wörtlich »Raufüße« bedeutende Wort bezeichnet hier Hasen; der Tiername macht den Vergleich im Deutschen verständlich.
- source_word: ἐξ ἡμισείας
  choice: nur zur Hälfte
  rationale: Bewahrt den Gedanken einer bloß teilweisen Reinheit; »nur« verdeutlicht den Gegensatz zur tatsächlichen Unreinheit, ohne den Sinn zu verändern.
- source_word: τὸ δ᾽ ἀληθὲς
  choice: in Wahrheit aber
  rationale: Gibt die idiomatische Kontrastformel knapp und würdig wieder.
- source_word: ἀκάθαρτοι
  choice: unrein
  rationale: Bewahrt die kultisch-moralische Begrifflichkeit und den Gegensatz zu »rein«.
theological_decisions:
- issue: Spannung zwischen teilweiser Reinheit und wirklicher Unreinheit
  choice: 'Die Aussage bleibt paradox zugespitzt: »nur zur Hälfte rein, in Wahrheit aber ... unrein«.'
  alternative: Den ersten Halbsatz als bloßen äußeren Anschein auszulegen.
  rationale: Der griechische Text behauptet zunächst eine hälftige Reinheit und stellt ihr dann die wahre Unreinheit gegenüber; diese Spannung wird nicht harmonisiert.
translation_notes:
  register: Modernes, klares Standarddeutsch mit würdigem spruchhaftem Ton. Die knappe Parallelstruktur und der Gegensatz zwischen »rein« und »unrein« bleiben erhalten.
