  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001.yaml
  text: '1[1]. The copy of the testament of Asher.


    2. In the one hundred and twenty-fifth year of his life, while still healthy, he said to them, “Hear, children of Asher, your father, and I will show you everything upright before God.


    3. God has given two ways to the sons of men, and two purposes, and two actions, and two modes, and two outcomes.


    4. Therefore all things are twofold[2], set one over against the other.


    5. For there are two ways, of good and of evil; and in them are the two purposes in our breasts, distinguishing them.


    6. If, then, the soul desires to walk well, it does all its deeds in righteousness; and even if it sins, it immediately repents.


    7. For by thinking righteous thoughts and casting away wickedness, it at once overturns evil and uproots sin.


    8. But if its purpose inclines to evil, all its deeds are in wickedness, driving away the good and clinging to the evil, and it is ruled by Beliar; and even if it does something good, it turns it into evil.


    9. For whenever it begins to do good in an evil way, it drives the end of the action for him into evil, because the treasure of its purpose is filled with an evil spirit.


    10. My children, obey your father, and bury me near my fathers.”


    11. And after he had drawn up his feet, he fell asleep in peace.


    12. And after five years they carried him up to Hebron[3], and placed him with his fathers.'
translation:
  language: de
  text: 'Das Testament Aschers, des zehnten Sohnes Jakobs und Silpas[a]


    1 Dies ist eine Abschrift des Testaments Aschers. Im 125. Jahr seines Lebens, als er noch gesund war, sagte er zu seinen Söhnen:


    »Hört auf euren Vater, ihr Kinder Aschers! Ich will euch alles zeigen, was vor Gott recht ist.


    2 Gott hat den Menschen zwei Wege gegeben, zwei Absichten, zwei Arten des Handelns, zwei Verhaltensweisen und zwei Ausgänge.


    3 Darum ist alles zweifach: Das eine steht dem anderen gegenüber.


    4 Denn es gibt zwei Wege, den Weg des Guten und den des Bösen. Ihnen entsprechen die beiden Absichten in unserer Brust, die sie voneinander unterscheiden.[b]


    5 Will die Seele nun den guten Weg gehen,[c] vollbringt sie alle ihre Taten in Gerechtigkeit; und selbst wenn sie sündigt, kehrt sie sofort um.


    6 Denn indem sie auf das Rechte bedacht ist und die Bosheit von sich weist, überwindet sie das Böse sogleich und rottet die Sünde aus.


    7 Neigt sich ihre Absicht aber zum Bösen, so steht jede ihrer Taten im Zeichen der Bosheit: Sie stößt das Gute von sich, hängt dem Bösen an und gerät unter die Herrschaft Beliars. Selbst wenn sie etwas Gutes tut, verkehrt sie es ins Böse.[d]


    8 Denn sobald sie beginnt, Gutes zu tun, treibt sie das Ende der Tat ins Böse; der Schatz ihrer Absicht ist nämlich von einem bösen Geist erfüllt.[e]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Überschrift nennt Ascher den zehnten Sohn Jakobs und Silpas. Danach beginnt der eigentliche Abschnitt mit einer weiteren Selbstbezeichnung als „Abschrift des Testaments Aschers“.
    reason: textual_structure
  - marker: b
    text: Wörtlich steht hier „in unserer Brust“. Gemeint ist die Brust als Sitz der inneren Überlegung; „in unseren Herzen“ wäre eine glattere, aber deutendere Wiedergabe.
    reason: lexical_alternative
  - marker: c
    text: Der griechische Wortlaut ist an dieser Stelle textkritisch unsicher; sinngemäß lautet er „gut/recht zu gehen“.
    reason: textual_uncertainty
  - marker: d
    text: Die grammatische Fügung des griechischen Textes wechselt in diesem Satz zwischen der Seele beziehungsweise Absicht und einer männlichen Form. Die Übersetzung folgt dem Zusammenhang und bezieht die Aussagen weiterhin auf die Seele.
    reason: textual_uncertainty
  - marker: e
    text: 'Der griechische Satzbau ist schwierig. Möglich ist auch: „Das Ende der Tat treibt ihn ins Böse.“ Die Übersetzung bewahrt dagegen die Seele als handelndes Subjekt, wie es der nähere Zusammenhang nahelegt.'
    reason: translation_ambiguity
lexical_decisions:
- source_word: Ζέλφας
  choice: Silpas
  rationale: Der griechische Name bezeichnet Jakobs Frau beziehungsweise Nebenfrau Silpa; die im Deutschen etablierte biblische Namensform ist verständlicher als eine unmittelbare Umschrift „Zelfa“.
- source_word: εὐθές
  choice: was vor Gott recht ist
  rationale: Im ethischen Zusammenhang bezeichnet das Wort das moralisch Gerade beziehungsweise Rechte; die Formulierung klingt im Deutschen natürlich und bewahrt den Gottesbezug.
- source_word: διαβούλια
  choice: Absichten
  rationale: Gemeint sind innere, überlegte Ausrichtungen des Willens. „Absichten“ ist weniger äußerlich als „Pläne“ und weniger altertümlich als „Ratschlüsse“.
- source_word: πράξεις
  choice: Arten des Handelns
  rationale: In der aufzählenden Gegenüberstellung geht es um Handlungen beziehungsweise Vollzugsweisen; die Formulierung wahrt die Unterscheidung zu den unmittelbar folgenden τρόπους.
- source_word: τρόπους
  choice: Verhaltensweisen
  rationale: So bleibt die Kategorie von den bereits genannten „Wegen“ und „Arten des Handelns“ unterschieden.
- source_word: τέλεα
  choice: Ausgänge
  rationale: Das Wort bezeichnet hier die jeweiligen Endpunkte oder Ergebnisse der beiden moralischen Wege; „Ausgänge“ bewahrt sowohl Ziel- als auch Ergebnisbezug.
- source_word: ἐν κατέναντι τοῦ ἑνός
  choice: Das eine steht dem anderen gegenüber
  rationale: Die deutsche Wendung erhält die scharfe antithetische Struktur, ohne sie zu einem metaphysischen System auszubauen.
- source_word: στέρνοις
  choice: Brust
  rationale: Der konkrete Körperbegriff wird als Sitz der inneren Überlegung bewahrt; „Herz“ wäre geläufiger, aber stärker deutend.
- source_word: μετανοεῖ
  choice: kehrt ... um
  rationale: Im Zusammenhang einer konkreten Sünde bezeichnet das Verb unmittelbare Reue und Richtungsänderung. „Umkehren“ macht die Bewegung innerhalb der Zwei-Wege-Metaphorik sichtbar.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Der griechische Text verwendet den Namen einer personal dargestellten bösen Macht. Die Transliteration wahrt die Form des Zeugen, statt sie als bloße „Bosheit“ aufzulösen.
theological_decisions:
- issue: Die wiederholte Rede von zwei Wegen und zwei inneren Absichten
  choice: Als scharfen ethischen Gegensatz wiedergeben
  alternative: Als absoluten metaphysischen Dualismus oder lediglich als allgemeine psychologische Zwiespältigkeit deuten
  rationale: Der Text stellt menschliches Handeln und innere Ausrichtung konsequent paarweise gegenüber, erklärt aber nicht ausdrücklich zwei gleichrangige kosmische Urprinzipien.
- issue: Das Verhältnis von Sünde und Umkehr in Vers 5
  choice: Die Möglichkeit der Sünde trotz grundsätzlich guter Ausrichtung unverändert stehen lassen
  alternative: Die gute Seele als sündlos darstellen oder die Sünde als bloß hypothetisch abschwächen
  rationale: Der griechische Text verbindet gerechtes Handeln ausdrücklich mit der Möglichkeit, dennoch zu sündigen und sofort umzukehren; diese Spannung darf nicht geglättet werden.
- issue: Beliar als handelnde böse Macht
  choice: Den Eigennamen und die Herrschaftssprache bewahren
  alternative: Beliar unpersönlich als Wertlosigkeit oder allgemeines Böses wiedergeben
  rationale: Βελίαρ erscheint im Satz als beherrschende Macht. Eine rein abstrakte Wiedergabe würde diese personale Darstellung reduzieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Zwei-Wege-Bildsprache. Die konkreten Bilder „Weg“, „Brust“, „Schatz“ und „ausrotten“ bleiben erhalten. Die Verszählung folgt dem inhaltlichen Abschnitt des vorgelegten griechischen Textes; nicht im griechischen Ausgangstext enthaltene spätere Todes- und Bestattungsverse wurden nicht ergänzt.
