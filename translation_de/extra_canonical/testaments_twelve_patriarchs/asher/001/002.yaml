source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ὑγιαίνων ⌜γὰρ⌝⁶ *εἶπε πρὸς αὐτούς⁷. Ἀκούσατε, τέκνα⁸ Ἀσήρ, τοῦ πατρὸς ὑμῶν, καὶ⁹ πᾶν τὸ εὐθὲς¹⁰ ἐνώπιον *τοῦ Θεοῦ¹¹ ὑποδείξω¹² ὑμῖν¹³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/002.yaml
  text: While still healthy, he said to them, “Hear, children of Asher, your father, and I will show you everything that is upright before God.”
translation:
  language: de
  text: 'Als er noch gesund war, sagte er zu ihnen: „Hört, ihr Kinder Aschers, auf euren Vater, und ich werde euch alles zeigen, was vor Gott recht ist.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑγιαίνων
  choice: Als er noch gesund war
  rationale: Das Partizip bezeichnet Aschers Zustand beim Sprechen. Die zeitliche Wiedergabe ist im Deutschen natürlich und bewahrt den Sinn, dass er noch bei guter Gesundheit war.
- source_word: Ἀκούσατε ... τοῦ πατρὸς ὑμῶν
  choice: Hört ... auf euren Vater
  rationale: Der Genitiv nach ἀκούω bezeichnet hier die Person, auf die gehört werden soll; „auf euren Vater hören“ gibt dies idiomatisch und mit dem gebotenen Nachdruck wieder.
- source_word: πᾶν τὸ εὐθὲς
  choice: alles ..., was ... recht ist
  rationale: εὐθύς bezeichnet moralisch Gerades beziehungsweise Rechtes. Die Formulierung ist verständlich, würdevoll und vermeidet eine unnötig räumliche Wiedergabe.
- source_word: ἐνώπιον τοῦ Θεοῦ
  choice: vor Gott
  rationale: Die geläufige deutsche Wendung bewahrt die Perspektive göttlicher Beurteilung oder Gegenwart, ohne sie näher festzulegen.
- source_word: ὑποδείξω
  choice: ich werde ... zeigen
  rationale: Die einfache Zukunft entspricht dem griechischen Verb und lässt offen, ob das Zeigen durch Unterweisung, Beispiele oder Darlegung geschieht.
theological_decisions:
- issue: Maßstab dessen, was recht ist
  choice: „vor Gott recht“
  alternative: „in den Augen Gottes richtig“
  rationale: „Vor Gott“ folgt ἐνώπιον eng und bewahrt die mögliche Spannung zwischen Gottes Gegenwart und Gottes Urteil, ohne eine bestimmte theologische Auslegung festzuschreiben.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem testamentarischem Ton. Die direkte Anrede „ihr Kinder Aschers“ macht die Zuordnung des Genitivs eindeutig und klingt natürlicher als „Kinder von Ascher“.
