  source_fidelity: Die Übersetzung gibt ὑγιαίνων treffend als fortdauernden Gesundheitszustand beim Sprechen wieder. Die Anrede und der Genitiv τοῦ πατρὸς ὑμῶν sind idiomatisch korrekt als Aufforderung verstanden, auf den Vater zu hören. πᾶν τὸ εὐθές wird angemessen als „alles ..., was ... recht ist“ wiedergegeben; „vor Gott“ entspricht ἐνώπιον τοῦ Θεοῦ, ohne dessen Nuance unzulässig einzuengen. Die Zukunft von ὑποδείξω ist erhalten.
