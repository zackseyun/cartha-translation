  naturalness: Die Revision verwendet modernes, klares Standarddeutsch und wahrt zugleich den knappen, parallelen Satzbau der Vorlage.
  terminology: »Entschlüsse« gibt διαβούλια als gefasste Überlegungen bzw. Vorhaben wieder; »Handlungen« entspricht πράξεις. »Arten« lässt τρόπους offen, ohne es mit den bereits genannten »Wegen« gleichzusetzen. »Enden« bewahrt die prägnante und im Kontext nicht weiter bestimmte Aussage von τέλεα.
