  - severity: low
    issue: Fußnote b fasst drei verschiedene griechische Wörter ohne eindeutige Zuordnung zusammen.
    rationale: Die Sammelnotiz ist zwar nicht sachlich falsch, erschwert aber die Nachvollziehbarkeit der einzelnen Begriffe; eine gezielte Anmerkung zu τρόπους ist klarer.
