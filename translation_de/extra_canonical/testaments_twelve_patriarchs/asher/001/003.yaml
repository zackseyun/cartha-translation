  text: Δύο ὁδοὺς *ἔδωκεν ὁ Θεὸς τοῖς υἱοῖς τῶν ἀνθρώπων¹⁴, καὶ δύο διαβούλια, ⌜καὶ δύο πράξεις, *καὶ δύο τρόπους¹⁵⌝, *καὶ ⌜δύο⌝ τέλεα¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/003.yaml
  text: God has given two ways to the sons of men, and two purposes, and two actions, and two modes, and two ends.
translation:
  language: de
  text: Gott hat den Menschen zwei Wege gegeben, zwei Entschlüsse, zwei Handlungen, zwei Arten und zwei Enden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »den Söhnen der Menschen«. »Arten« kann auch »Weisen« oder »Lebensformen« bedeuten; »Enden« auch »Ziele« oder »Ausgänge«.'
    reason: Erläutert die inklusive Bedeutung der Personenbezeichnung und erhält die lexikalische Offenheit der beiden im Deutschen besonders knappen Begriffe, ohne den Text auszudeuten.
lexical_decisions:
- source_word: ὁδοὺς
  choice: Wege
  rationale: Gibt das konkrete Bild der zwei Lebenswege unmittelbar und idiomatisch wieder.
- source_word: τοῖς υἱοῖς τῶν ἀνθρώπων
  choice: den Menschenkindern
  rationale: Bewahrt den semitisch geprägten Ausdruck, bezeichnet dabei aber verständlich die Menschen allgemein.
- source_word: διαβούλια
  choice: Absichten
  rationale: Das Wort bezeichnet Überlegungen, Entschlüsse oder innere Vorhaben; »Absichten« ist im Zusammenhang natürlich, ohne die Bedeutung auf bloße Gedanken zu verengen.
- source_word: πράξεις
  choice: Taten
  rationale: Bezeichnet ausgeführte Handlungen; »Taten« ist prägnant und bildet einen verständlichen Gegensatz zu den inneren Absichten.
- source_word: τρόπους
  choice: Verhaltensweisen
  rationale: Unterscheidet die gemeinten Weisen oder Arten des Handelns von den bereits genannten »Wegen«.
- source_word: τέλεα
  choice: Enden
  rationale: Folgt der überlieferten Deutung als jeweilige Endpunkte oder Ausgänge der beiden Wege, lässt aber die knappe Aussage des Griechischen stehen.
theological_decisions:
- issue: Die durchgängige Zweiteilung des menschlichen Lebens
  choice: Alle fünf Glieder werden parallel als jeweils »zwei« wiedergegeben.
  alternative: Die Reihe als ausdrücklichen Gegensatz von Gut und Böse ausformulieren.
  rationale: Der Vers nennt zwei Wege, Absichten, Taten, Verhaltensweisen und Enden, bestimmt ihre moralische Zuordnung hier jedoch noch nicht ausdrücklich. Diese Spannung wird nicht vorwegnehmend aufgelöst.
- issue: Empfänger der von Gott gegebenen Wege
  choice: »Menschenkinder«
  alternative: »Söhne der Menschen« oder schlicht »Menschen«
  rationale: Die Formulierung wahrt die Bildsprache des Ausgangstextes und ist zugleich inklusiv als Bezeichnung der gesamten Menschheit verständlich.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst rhythmischer Parallelstruktur. »Dazu« und »sowie« machen die lange Aufzählung im Deutschen gut lesbar, ohne ihre fünfteilige Form oder die wiederholte Zweizahl abzuschwächen.
