    issue: „auf gutem Weg gehen“ ist semantisch leicht verschoben.
    rationale: Die Formulierung kann im Deutschen einen bereits erreichten positiven Entwicklungsstand nahelegen. καλῶς πορευθῆναι beschreibt hier allgemeiner, gut bzw. recht zu leben.
  revised_text: Wenn also die Seele gut leben will,[a] tut sie all ihre Taten in Gerechtigkeit; und selbst wenn sie sündigt, kehrt sie sofort um.
