source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἐὰν οὖν²⁶ ἡ ψυχὴ θέλει²⁷ *†καλῶς πορευθῆναι†, πάσας τὰς πράξεις αὐτῆς ποιεῖ²⁸ ἐν δικαιοσύνῃ, *κἂν ἁμάρτῃ²⁹ εὐθὺς³⁰ μετανοεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/006.yaml
  text: If, then, the soul wants to walk well, it does all its actions in righteousness; and even if it sins, it immediately repents.
translation:
  language: de
  text: Wenn also die Seele gut leben will,[a] tut sie all ihre Taten in Gerechtigkeit; und selbst wenn sie sündigt, kehrt sie sofort um.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Wortgruppe hinter „gut leben“ ist textlich unsicher.
    reason: Die Edition kennzeichnet καλῶς πορευθῆναι mit kritischen Zeichen; die Fußnote wahrt diesen Befund, ohne die Bedeutung über die übersetzte Lesart hinaus festzulegen.
lexical_decisions:
- source_word: ψυχὴ
  choice: Seele
  rationale: Die direkte und im Kontext natürliche Entsprechung bewahrt die personifizierte innere Instanz des griechischen Textes.
- source_word: θέλει
  choice: will
  rationale: Gibt das schlichte θέλει unmittelbar und in modernem Deutsch wieder.
- source_word: καλῶς πορευθῆναι
  choice: auf gutem Weg gehen
  rationale: Bewahrt das Bild des Gehens und gibt καλῶς idiomatisch wieder, ohne es vorschnell als spezifisch moralischen Fachausdruck festzulegen.
- source_word: πράξεις
  choice: Taten
  rationale: Bezeichnet konkrete Handlungen und klingt in einem ethischen Weisheitstext natürlich und würdig.
- source_word: ἐν δικαιοσύνῃ
  choice: in Gerechtigkeit
  rationale: Die formnahe Wiedergabe erhält den ethisch-theologischen Gehalt von δικαιοσύνη.
- source_word: μετανοεῖ
  choice: kehrt … um
  rationale: Drückt die Sinnes- und Richtungsänderung von μετανοεῖ verständlich aus und nimmt zugleich das Wegmotiv des Satzes auf.
theological_decisions:
- issue: Verhältnis von sündigem Handeln und Umkehr
  choice: „selbst wenn sie sündigt, kehrt sie sofort um“
  alternative: „obwohl sie sündigt, bereut sie es sofort“
  rationale: κἂν wird als einräumende Möglichkeit bewahrt. Die Übersetzung löst die Spannung nicht auf, dass eine in Gerechtigkeit handelnde Seele dennoch sündigen kann.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem weisheitlichem Ton. Das Wegbild und die ethische Spannung des griechischen Textes bleiben erhalten.
