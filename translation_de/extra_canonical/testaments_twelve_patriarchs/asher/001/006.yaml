review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt Satzbau und Sinn im Wesentlichen zutreffend wieder: θέλει, πράξεις, ἐν δικαιοσύνῃ sowie die einräumende Bedingung κἂν ἁμάρτῃ sind erhalten. „Kehrt sie sofort um“ ist eine angemessene Wiedergabe von εὐθὺς μετανοεῖ. Für καλῶς πορευθῆναι ist „auf gutem Weg gehen“ jedoch im modernen Deutsch weniger treffend: Es bezeichnet oft, dass jemand bereits Fortschritte macht, während das Griechische das rechte bzw. gute Führen des Lebens meint.'
  naturalness: „Gut leben“ ist im modernen Standarddeutsch idiomatisch und bildet im ethischen Kontext die Bedeutung von καλῶς πορεύεσθαι klar ab. „Tut“ entspricht πράξεις ποιεῖ unmittelbar und klingt weniger künstlich als „vollbringt“; „Taten“ kann dabei bleiben.
  terminology: „Seele“, „Gerechtigkeit“, „sündigt“ und „umkehren“ sind sachgerecht und registerangemessen. Die textkritische Unsicherheit der markierten griechischen Wortgruppe soll weiterhin per Fußnote angezeigt werden, ohne eine bestimmte Rekonstruktion zu behaupten.
  issues:
