- from: Wenn nun die Seele auf gutem Weg gehen will,[a] vollbringt sie alle ihre Taten in Gerechtigkeit; und selbst wenn sie sündigt, kehrt sie sofort um.
  to: Wenn also die Seele gut leben will,[a] tut sie all ihre Taten in Gerechtigkeit; und selbst wenn sie sündigt, kehrt sie sofort um.
  rationale: Die Änderung ersetzt die im heutigen Deutsch potenziell missverständliche Wegformulierung durch die natürliche ethische Entsprechung „gut leben“. Die Aussage, die einräumende Bedingung und die textkritische Kennzeichnung bleiben erhalten.
