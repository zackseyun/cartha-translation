  text: The testament of Asher, the tenth son of Jacob and Zilpah. The copy of the testament of Asher, which he spoke to his sons in the one hundred and twenty-fifth year of his life.
translation:
  language: de
  text: 'Das Testament Aschers, des zehnten Sohnes Jakobs und Silpas.[a]


    1 Abschrift des Testaments Aschers, das er im hundertfünfundzwanzigsten Jahr seines Lebens zu seinen Söhnen sprach.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige griechische Textzeugen lassen „und Silpas“ aus.
    reason: Die mit ¹ markierte Stelle im Ausgangstext weist auf eine textkritische Variante hin; die Formulierung wird im Haupttext beibehalten und die Auslassung dokumentiert.
lexical_decisions:
- source_word: Διαθήκη
  choice: Testament
  rationale: Im Titel bezeichnet διαθήκη die feierliche letztwillige Unterweisung des Stammvaters; „Testament“ bewahrt zugleich die etablierte Gattungsbezeichnung.
- source_word: Ἀντίγραφον
  choice: Abschrift
  rationale: Das Wort bezeichnet eine schriftliche Kopie beziehungsweise Wiedergabe eines Dokuments.
- source_word: ἐλάλησε
  choice: sagte
  rationale: Natürliches modernes Deutsch für das Sprechen zu seinen Söhnen, ohne einen besonderen Offenbarungscharakter einzutragen.
- source_word: Ζέλφας
  choice: Silpas
  rationale: Verwendet die im Deutschen geläufige Namensform der biblischen Silpa.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger deutscher Erzählstil. Die Überschrift bleibt knapp; Vers 1 gibt die griechische Konstruktion mit einem Doppelpunkt natürlich wieder. Die Altersangabe wird als Ordinalzahl formuliert, entsprechend ἐν … ἔτει τῆς ζωῆς αὐτοῦ.
