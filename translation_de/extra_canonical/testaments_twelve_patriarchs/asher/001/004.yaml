lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Darum
  rationale: Gibt die folgernde Verknüpfung knapp und natürlich wieder.
- source_word: πάντα δύο εἰσίν
  choice: ist alles zweifach
  rationale: Bewahrt die Aussage, dass die Gesamtheit der Dinge in einer Zweiheit beziehungsweise paarweisen Gegenüberstellung erscheint.
- source_word: ἐν κατέναντι τοῦ ἑνός
  choice: das eine steht dem anderen gegenüber
  rationale: Das überlieferte Griechisch ist syntaktisch auffällig; die Formulierung wahrt den Gedanken wechselseitiger Gegenüberstellung, ohne ihn weiter zu systematisieren.
theological_decisions:
- issue: Reichweite der behaupteten Zweiheit
  choice: „alles zweifach“
  alternative: „alle Dinge sind zweierlei“
  rationale: Die knappe universale Aussage des Griechischen bleibt erhalten; weder metaphysischer Dualismus noch eine bestimmte ethische Deutung wird ausdrücklich hinzugefügt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe sentenzartige Struktur und die Spannung der universalen Aussage bleiben gewahrt. Die sachlich unpassende jüngste Revision wurde nicht übernommen, da sie dem angegebenen griechischen Quelltext widerspricht.
