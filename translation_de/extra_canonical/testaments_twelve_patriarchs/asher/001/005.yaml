base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/005.yaml
  text: For there are two ways, of good and of evil; and in them are the two purposes in our breasts, distinguishing them.
translation:
  language: de
  text: Denn es gibt zwei Wege, den des Guten und den des Bösen; in ihnen befinden sich die beiden Absichten in unserer Brust, die sie unterscheiden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁδοὶ … δύο, καλοῦ καὶ κακοῦ
  choice: zwei Wege, den des Guten und den des Bösen
  rationale: Die Genitive bezeichnen die beiden Wege näher. Die substantivierten Formen „des Guten“ und „des Bösen“ bewahren den allgemeinen ethischen Sinn.
- source_word: διαβούλια
  choice: Absichten
  rationale: Das Wort bezeichnet innere Überlegungen, Entschlüsse oder Zielrichtungen. „Absichten“ ist im Zusammenhang mit der Brust als Sitz des Inneren natürlich und lässt die genaue psychologische Nuance offen.
- source_word: ἐν στέρνοις ἡμῶν
  choice: in unserer Brust
  rationale: Der griechische Plural wird idiomatisch kollektiv im Singular wiedergegeben. „Brust“ wahrt das antike Bild für das menschliche Innere, ohne es vorschnell mit „Herz“ gleichzusetzen.
- source_word: διακρίνοντα αὐτά
  choice: unterscheiden sie voneinander
  rationale: Das Partizip drückt ein Unterscheiden beziehungsweise Auseinanderhalten aus. Das ergänzte „voneinander“ macht den Bezug auf die beiden Wege im Deutschen verständlich, ohne eine Wertung hinzuzufügen.
theological_decisions:
- issue: Verhältnis der beiden inneren Absichten zu den beiden Wegen
  choice: Die Formulierung lässt beide Absichten auf den beiden Wegen wirksam sein und diese unterscheiden.
  alternative: „In ihnen liegen die beiden Absichten …, die zwischen ihnen unterscheiden“ oder „unter denen unsere beiden Absichten unterscheiden“.
  rationale: Die Syntax und die Bezüge von ἐν οἷς und αὐτά sind nicht völlig eindeutig. Die Übersetzung hält den engen Zusammenhang zwischen Wegen und inneren Absichten fest, ohne daraus eine ausgearbeitete Lehre von zwei Geistern oder Naturen zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das konkrete anthropologische Bild „in unserer Brust“ bleibt erhalten; die Satzstruktur wurde nur so weit geglättet, dass der Gedankengang verständlich ist.
