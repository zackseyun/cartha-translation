  naturalness: Der Satz ist grundsätzlich verständlich und im angemessenen Register gehalten. Eine Formulierung mit „befinden sich“ ist zwar etwas näher am griechischen Bild und weniger dynamisch als „wirken“, bleibt aber modernes Standarddeutsch.
  terminology: „Absichten“ ist für διαβούλια vertretbar. „in unserer Brust“ bewahrt zutreffend das körperlich-anthropologische Bild von ἐν στέρνοις ἡμῶν. Die substantivierten Ausdrücke „das Gute“ und „das Böse“ sind passend.
