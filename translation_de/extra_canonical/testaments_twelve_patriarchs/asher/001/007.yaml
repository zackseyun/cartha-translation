source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Δίκαια *γὰρ λογιζομένη³¹ καὶ ἀπορρίπτουσα³² τὴν πονηρίαν ἀνατρέπει εὐθὺς τὸ κακόν³³, καὶ³⁴ ἐκριζοῖ³⁵ τὴν ἁμαρτίαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/007.yaml
  text: For by considering what is righteous and casting away wickedness, it at once overturns evil and uproots sin.
translation:
  language: de
  text: Denn indem sie das Gerechte bedenkt und die Bosheit von sich weist, stürzt sie sogleich das Böse um und reißt die Sünde mit der Wurzel aus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δίκαια … λογιζομένη
  choice: indem sie bedenkt, was gerecht ist
  rationale: Das substantivierte Neutrum Plural Δίκαια bezeichnet »das Gerechte« beziehungsweise »was gerecht ist«; λογιζομένη wird natürlich und quellennah mit »bedenkt« wiedergegeben.
- source_word: ἀπορρίπτουσα τὴν πονηρίαν
  choice: die Bosheit von sich weist
  rationale: ἀπορρίπτω bedeutet wörtlich »wegwerfen, abweisen«; »von sich weisen« bewahrt das entschiedene Ablegen der πονηρία in idiomatischem Deutsch.
- source_word: ἀνατρέπει … τὸ κακόν
  choice: überwindet … das Böse
  rationale: ἀνατρέπω kann »umstürzen, zunichtemachen, überwinden« bedeuten. »Überwindet« klingt im Deutschen natürlich und erhält die Vorstellung, dass das Böse seiner Macht beraubt wird.
- source_word: ἐκριζοῖ τὴν ἁμαρτίαν
  choice: rottet die Sünde aus
  rationale: ἐκριζόω bedeutet »mit der Wurzel ausreißen«; »ausrotten« gibt das Bild und die vollständige Beseitigung knapp wieder.
theological_decisions:
- issue: Bezug des femininen Subjekts in λογιζομένη, ἀπορρίπτουσα, ἀνατρέπει und ἐκριζοῖ
  choice: Das Pronomen »sie« bleibt ohne erklärenden Zusatz stehen.
  alternative: Das vorausgehende feminine Bezugswort ausdrücklich wiederholen oder als eine bestimmte Tugend deuten.
  rationale: Der vorgelegte Vers setzt ein feminines Subjekt aus dem Kontext voraus. Eine explizite Identifizierung allein aus diesem Satz würde die kontextuelle Offenheit unnötig auflösen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die parallele Struktur und der unmittelbare Folgezusammenhang werden bewahrt; auf altertümliche oder konfessionell geprägte Formulierungen wird verzichtet.
