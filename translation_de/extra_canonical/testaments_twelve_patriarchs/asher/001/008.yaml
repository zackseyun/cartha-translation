  text: Ἐὰν δὲ *ἐν †πονηρᾷ³⁶ κλίνῃ³⁷ †τὸ διαβούλιον†³⁸, *πᾶσα πρᾶξις αὐτῆς ἐστιν³⁹ ἐν πονηρίᾳ, καὶ⁴⁰ ἀπωθουμένη⁴¹ τὸ ἀγαθόν, *καὶ προσκολλώμενος⁴² τὸ κακόν, καὶ κυριευθεὶς⁴³ ὑπὸ⁴⁴ τοῦ Βελίαρ· κἂν⁴⁵ ἀγαθὸν⁴⁶ πράξει⁴⁷, Γἐν πονηρίᾳ⁴⁸ αὐτὸ⁴⁹ μεταστρέφει⁵⁰˥.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/008.yaml
  text: But if the intent inclines to evil, all its actions are in wickedness, driving away the good and clinging to the evil, and ruled by Beliar; and even if it does something good, it turns it into evil.
translation:
  language: de
  text: 'Wenn aber die Absicht zum Bösen geneigt ist, ist jede ihrer Handlungen in Bosheit: Das Gute wird abgestoßen, dem Bösen hängt man an, und man wird von Beliar beherrscht. Und selbst wenn man etwas Gutes tut, verkehrt man es zum Bösen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ διαβούλιον
  choice: die Absicht
  rationale: Gibt den inneren Entschluss bzw. die Willensausrichtung im Zusammenhang natürlich und präzise wieder, ohne ihn als bloßen Gedanken oder als fest ausgearbeiteten Plan einzuengen.
- source_word: ἐν πονηρᾷ / ἐν πονηρίᾳ
  choice: zum Bösen / in Bosheit
  rationale: Bewahrt die wiederkehrende Wortwurzel, formuliert die jeweilige griechische Wendung aber idiomatisch im Deutschen.
- source_word: ἀπωθουμένη τὸ ἀγαθόν
  choice: Sie stößt das Gute von sich
  rationale: Entspricht dem kräftigen Sinn von ἀπωθέομαι und erhält die aktive Zurückweisung des Guten.
- source_word: προσκολλώμενος τὸ κακόν
  choice: hängt dem Bösen an
  rationale: Gibt das enge Sich-Anschließen oder Festhalten in einer natürlichen, würdigen deutschen Wendung wieder.
- source_word: κυριευθεὶς ὑπὸ τοῦ Βελίαρ
  choice: wird von Beliar beherrscht
  rationale: Bildet das Passiv und den Herrschaftsaspekt von κυριεύω klar ab.
- source_word: μεταστρέφει
  choice: verkehrt
  rationale: Bringt die Umwendung bzw. Verwandlung des Guten zum Bösen prägnant zum Ausdruck.
theological_decisions:
- issue: Personifizierung bzw. Bezug der femininen Formen
  choice: Die Absicht bleibt grammatisches Bezugswort und wird im Folgesatz mit „sie“ aufgenommen.
  alternative: Die Konstruktion unpersönlich oder auf den Menschen beziehen.
  rationale: Die griechischen femininen Formen verweisen am naheliegendsten auf die Absicht; die Übersetzung bewahrt diesen Textzug, statt stillschweigend ein anderes Subjekt einzusetzen.
- issue: Beliar als personale Macht
  choice: Der Eigenname „Beliar“ und das passive Beherrschtwerden bleiben ausdrücklich stehen.
  alternative: Beliar als abstraktes Böses paraphrasieren.
  rationale: Der Ausgangstext nennt Beliar als handelnde Herrschaftsmacht; eine Verallgemeinerung würde die theologische Bildwelt abschwächen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die parallele Bewegung – Abweisung des Guten, Anhängen an das Böse, Beherrschung durch Beliar und Verkehrung selbst guter Taten – bleibt deutlich erhalten. Wegen der textkritischen Zeichen und auffälligen Kongruenz im griechischen Drucktext wurde der Sinnzusammenhang gewahrt, ohne unsichere Einzelheiten durch eine Fußnote zu überfrachten.
