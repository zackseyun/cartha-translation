  source_fidelity: 'Die Übersetzung gibt die Grundbewegung des griechischen Textes zutreffend wieder: eine zum Bösen geneigte innere Ausrichtung, die Abweisung des Guten, das Anhangen am Bösen, die Herrschaft Beliars und die Verkehrung selbst einer guten Tat. Die im überlieferten griechischen Text auffälligen Kongruenzen bei den Partizipien (feminin bei ἀπωθουμένη, maskulin bei προσκολλώμενος und κυριευθείς) lassen den genauen Bezug jedoch unsicher. Die Fassung des Entwurfs legt diese Partizipien durchgehend und ohne Vorbehalt auf „die Absicht“ fest.'
  naturalness: „Jede ihrer Taten“ und insbesondere „selbst wenn sie etwas Gutes tut“ personifizieren „die Absicht“ im Deutschen stärker, als es der griechische, textlich auffällige Satz sicher verlangt. Eine unpersönlichere Formulierung ist modernes Standarddeutsch und bewahrt die syntaktische Unsicherheit besser.
  terminology: „Absicht“, „das Gute“, „das Böse“, „Bosheit“ und „Beliar“ sind angemessen. „In Bosheit“ erhält die Wiederaufnahme von πονηρία. Der Eigenname Beliar ist beizubehalten.
