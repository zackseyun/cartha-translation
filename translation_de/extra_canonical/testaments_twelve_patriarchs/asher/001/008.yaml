  - severity: low
    issue: „Wenn aber die Absicht sich zum Bösen neigt“ ist etwas stärker dynamisch als der knappe Ausdruck ἐν πονηρᾷ κλίνῃ.
    rationale: „Zum Bösen geneigt ist“ ist idiomatisch und hält die prädikative Aussage enger zusammen.
