source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ὅτε γὰρ⁵¹ ἄρξεται⁵² *τὸ ἀγαθὸν ποιεῖν⁵³, τὸ τέλος τῆς πράξεως *εἰς πονηρὸν αὐτῷ ἐλαύνει⁵⁴. ἐπειδὴ ὁ⁵⁵ θησαυρὸς⁵⁶ τοῦ διαβουλίου⁵⁷ πονηροῦ⁵⁸ πνεύματος πεπλήρωται⁵⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/001/009.yaml
  text: For whenever it begins to do good, the end of the action drives him into evil, because the treasure of its purpose is filled with an evil spirit.
translation:
  language: de
  text: Denn wenn er[a] anfängt, das Gute zu tun, treibt ihn der Ausgang der Handlung zum Bösen; denn der Schatz des Vorhabens[b] ist mit einem bösen Geist erfüllt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Subjekt von „anfängt“ wird in diesem Satzteil im Griechischen nicht ausdrücklich genannt. Dem Zusammenhang nach ist wahrscheinlich ein Mensch gemeint.
    reason: Hält die im Satz vorhandene Auslassung fest, ohne eine nicht ausdrücklich belegte konkrete Referenz einzutragen.
  - marker: b
    text: 'Oder: »der Überlegung«, »der Absicht« oder »des Plans«. Das Adjektiv »bösen« kann im Griechischen formal auch dieses Wort näher bestimmen; dann wäre zu verstehen: »des bösen Vorhabens«.'
    reason: Zeigt das Bedeutungsspektrum von διαβούλιον und dokumentiert die syntaktisch mögliche Zuordnung von πονηροῦ, während der Haupttext der naheliegenden Verbindung mit πνεύματος folgt.
lexical_decisions:
- source_word: τὸ ἀγαθὸν ποιεῖν
  choice: das Gute zu tun
  rationale: Die Wendung bezeichnet ausdrücklich das Tun des Guten; die abweichende Revision »Böses gegen das Gute tun« wird vom vorliegenden griechischen Text nicht gestützt.
- source_word: τὸ τέλος τῆς πράξεως
  choice: der Ausgang der Handlung
  rationale: τέλος meint hier wahrscheinlich den Ausgang beziehungsweise das Ergebnis der Handlung; »Ausgang« bewahrt zugleich den möglichen zeitlichen Sinn des Endes.
- source_word: εἰς πονηρὸν … ἐλαύνει
  choice: treibt ihn … zum Bösen
  rationale: Die gerichtete Bewegung des Verbs ἐλαύνει und der Präposition εἰς wird in natürlichem Deutsch wiedergegeben. Das Böse bleibt substantiviert wie im Griechischen.
- source_word: θησαυρὸς
  choice: Schatz
  rationale: Die Bildsprache eines inneren Vorrats oder Speichers wird formal bewahrt.
- source_word: διαβουλίου
  choice: Vorhaben
  rationale: Das seltene Wort kann Überlegung, Absicht, Plan oder Vorhaben bezeichnen. »Vorhaben« ist verständlich und legt die Stelle nicht unnötig auf einen bereits ausdrücklich bösen Plan fest.
- source_word: πονηροῦ πνεύματος
  choice: mit einem bösen Geist
  rationale: Der Genitiv bei πεπλήρωται bezeichnet hier den Inhalt, mit dem etwas erfüllt ist; πνεῦμα wird konkret als »Geist« und nicht abschwächend als bloße Gesinnung wiedergegeben.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts von ἄρξεται
  choice: er
  alternative: es / die böse Neigung
  rationale: Das griechische Verb nennt sein Subjekt nicht ausdrücklich; »er« lässt sich im Zusammenhang auf den zuvor behandelten Menschen beziehen. Eine Fußnote wahrt die grammatische und kontextuelle Mehrdeutigkeit.
- issue: Bedeutung von »böser Geist«
  choice: wörtlich als Geist wiedergegeben
  alternative: böse Gesinnung oder böser Einfluss
  rationale: Der Text spricht ausdrücklich von πνεῦμα. Ob ein personales Geistwesen, eine beherrschende geistige Macht oder eine innere Disposition gemeint ist, wird nicht dogmatisch entschieden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die markante Schatz-Metapher bleibt erhalten; die Satzführung wurde nur so weit geglättet, dass der Gedankengang für heutige Leser verständlich ist.
