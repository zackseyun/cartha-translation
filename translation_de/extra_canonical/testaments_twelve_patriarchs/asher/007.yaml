  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007.yaml
  text: '...crushing the head of the dragon upon the water[a]. He will save Israel and all the nations [God appearing as a man].


    4 Therefore, my children, you also tell these things to your children, so that they may not disobey him. 5 For I know that, by disobeying, you will disobey, and by acting ungodly, you will act ungodly, paying no attention to the law of God, but being corrupted by wickedness through the commandments of men. 6 And because of this you will be scattered, like Gad and Dan my brothers, and you will not know their land, tribe, and language. 7 But the Lord will gather you in faith through his compassion[c][b], and through Abraham and Isaac and Jacob.'
translation:
  language: de
  text: '**Das Testament Aschers 7**


    **1** Werdet nicht wie Sodom, das die Engel des Herrn nicht erkannte und für immer zugrunde ging. **2** Denn ich weiß, dass ihr sündigen und in die Hände eurer Feinde ausgeliefert werden werdet. Euer Land wird verwüstet werden, eure Heiligtümer werden völlig zerstört werden, und ihr werdet in die vier Himmelsrichtungen zerstreut werden. Ihr werdet zur Zerstreuung werden und wie unbrauchbares Wasser verachtet sein. **3** So wird es sein, bis der Höchste sich der Erde annimmt. Er selbst wird kommen, indem er als Mensch mit Menschen isst und trinkt und den Kopf des Drachen auf dem Wasser zerschmettert. Dieser wird Israel und alle Völker retten — [Gott, der als Mensch auftritt].[a]


    **4** Darum, meine Kinder, erzählt auch ihr dies euren Kindern, damit sie ihm nicht ungehorsam werden. **5** Denn ich weiß, dass ihr euch in eurem Ungehorsam ungehorsam erweisen und euch in eurer Gottlosigkeit gottlos verhalten werdet. Ihr werdet dem Gesetz Gottes keine Beachtung schenken, sondern euch durch Bosheit verderben lassen, indem ihr menschlichen Geboten folgt. **6** Deshalb werdet ihr zerstreut werden wie meine Brüder Gad und Dan, und ihr werdet ihre Länder, ihren Stamm und ihre Sprache nicht mehr kennen. **7** Doch er wird euch im Glauben durch sein Erbarmen sammeln[c][b] und durch Abraham, Isaak und Jakob.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die eingeklammerten Worte „Gott, der als Mensch auftritt“ stehen auch in der vorgelegten griechischen Edition in eckigen Klammern. Das weist darauf hin, dass ihre Zugehörigkeit zum ursprünglichen Text unsicher ist; sie werden hier dennoch übersetzt, weil sie im bereitgestellten Zeugen enthalten sind.
    reason: textual_variant
  - marker: b
    text: „Im Glauben“ kann auch „in Treue“ oder „in Glaubenstreue“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: Die Zerstreuung und die spätere Sammlung greifen das in Israels Schriften häufige Muster von Bundesgericht und Wiederherstellung auf.
    reason: cross_reference
lexical_decisions:
- source_word: ἠγνόησε
  choice: nicht erkannte
  rationale: Bewahrt die Grundbedeutung von fehlendem Erkennen beziehungsweise Anerkennen, ohne genauer festzulegen, worin Sodoms Verfehlung gegenüber den Engeln bestand.
- source_word: τὰ ἅγια
  choice: eure Heiligtümer
  rationale: Der substantivierte Plural bezeichnet hier am natürlichsten heilige Stätten oder Einrichtungen; „Heiligtümer“ wahrt den konkreten kultischen Bezug.
- source_word: ἐξουδενωμένοι ὡς ὕδωρ ἄχρηστον
  choice: man wird euch verachten wie unbrauchbares Wasser
  rationale: Gibt das passive Partizip und das ungewöhnliche Vergleichsbild verständlich wieder, ohne das Bild durch eine geläufigere Metapher zu ersetzen.
- source_word: ἐπισκέψηται
  choice: sich … annimmt
  rationale: Das Verb kann ein prüfendes oder helfendes Aufsuchen bezeichnen. „Sich der Erde annehmen“ lässt den Charakter dieses Eingreifens offen und klingt im prophetischen Zusammenhang natürlich.
- source_word: συντρίβων τὴν κάραν τοῦ δράκοντος
  choice: den Kopf des Drachen … zerschmettern
  rationale: „Zerschmettern“ erhält die gewaltsame Siegesbildlichkeit von συντρίβω; δράκων wird ausdrücklich als „Drache“ und nicht abschwächend als „Schlange“ wiedergegeben.
- source_word: ὑποκρινόμενος
  choice: als Mensch auftritt
  rationale: Das Verb kann das Spielen oder Annehmen einer Rolle bezeichnen. „Auftritt“ bewahrt diese Nuance, ohne zwingend eine Täuschungsabsicht zu unterstellen.
- source_word: ἀπειθοῦντες ἀπειθήσετε
  choice: euch in eurem Ungehorsam ungehorsam erweisen
  rationale: Die auffällige Wiederholung desselben griechischen Wortstamms bleibt erkennbar, wird aber in verständliches modernes Deutsch gefasst.
- source_word: ἀσεβοῦντες ἀσεβήσετε
  choice: euch in eurer Gottlosigkeit gottlos verhalten
  rationale: Bewahrt ebenso die rhetorische Wiederholung und den religiös-moralischen Gehalt des griechischen Verbs.
- source_word: νόμῳ θεοῦ
  choice: Gesetz Gottes
  rationale: Im jüdischen testamentarischen Zusammenhang ist „Gesetz Gottes“ die klare und erwartbare Wiedergabe; „Weisung“ wäre ebenfalls möglich, aber weniger formal.
- source_word: ἐντολαῖς ἀνθρώπων
  choice: menschlichen Geboten
  rationale: Erhält den Gegensatz zwischen Gottes Gesetz und von Menschen gesetzten Geboten in natürlichem Deutsch.
- source_word: ἐν πίστει
  choice: im Glauben
  rationale: Die knappe präpositionale Wendung bleibt bewusst offen; πίστις kann hier auch Treue oder Vertrauensverbundenheit bezeichnen.
- source_word: δι᾽ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: um Abrahams, Isaaks und Jakobs willen
  rationale: Im Zusammenhang der Sammlung Israels drückt diese deutsche Wendung die vermittelnde beziehungsweise bundesbezogene Bedeutung von διά mit Akkusativ idiomatisch aus, ohne einen genauen Mechanismus zu definieren.
theological_decisions:
- issue: Textkritisch auffällige Wendung θεὸς εἰς ἄνδρα ὑποκρινόμενος
  choice: In eckigen Klammern als „Gott, der als Mensch auftritt“ wiedergegeben
  alternative: Die Wendung als spätere Erweiterung auslassen oder stärker wörtlich „Gott, der einen Menschen spielt“ übersetzen
  rationale: Die bereitgestellte griechische Edition enthält die Wendung in eckigen Klammern und signalisiert damit Unsicherheit. Die Übersetzung behält sowohl den Wortlaut als auch dessen textkritischen Status sichtbar bei, ohne ihn in eine spätere dogmatische Formel umzuschreiben.
- issue: Bezug der rettenden Gestalt in Vers 3
  choice: Mit „Er“ wiedergegeben, ohne einen zusätzlichen Titel einzusetzen
  alternative: „Der Herr“, „der Höchste“ oder „der kommende Retter“ ausdrücklich ergänzen
  rationale: Der griechische Text verwendet an dieser Stelle ein Demonstrativpronomen und nennt keinen neuen Titel. Die Übersetzung lässt die syntaktisch nahe, theologisch jedoch spannungsreiche Identifikation bewusst bestehen.
- issue: Bedeutung von ἐν πίστει in Vers 7
  choice: „im Glauben“
  alternative: „in Treue“, „durch Glauben“ oder „in Glaubenstreue“
  rationale: „Im Glauben“ bewahrt die Mehrdeutigkeit zwischen Vertrauen, Glauben und Treue besser als eine eindeutig instrumentale oder ethische Festlegung.
- issue: Handelndes Subjekt in Vers 7
  choice: Das im Griechischen unausgesprochene Subjekt mit „er“ wiedergegeben
  alternative: „der Herr“ ausdrücklich ergänzen
  rationale: Der Zusammenhang legt ein göttliches beziehungsweise rettendes Subjekt nahe, doch der Vers nennt keinen Titel. Eine ausdrückliche Ergänzung würde die Referenz stärker festlegen als der griechische Wortlaut.
- issue: Sammlung „durch Abraham und Isaak und Jakob“
  choice: Als „um Abrahams, Isaaks und Jakobs willen“ formuliert
  alternative: „durch Abraham, Isaak und Jakob“
  rationale: Die idiomatische deutsche Fassung deutet den Satz bundesbezogen, legt aber weder eine unmittelbare Mittlerschaft der Patriarchen noch ein bestimmtes Lehrsystem fest.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem testamentarisch-prophetischem Ton. Ungewöhnliche Bilder wie das „unbrauchbare Wasser“ und die rhetorischen Wortwiederholungen in Vers 5 wurden bewusst erhalten. Eckige Klammern markieren die bereits in der griechischen Edition angezeigte textliche Unsicherheit; Gedankenstriche dienen nur der deutschen Leseführung.
