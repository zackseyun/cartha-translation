review_pass:
  verdict: revise
  source_fidelity: 'Eine Korrektur ist nötig: δι᾽ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ steht mit Genitiv und bedeutet „durch Abraham, Isaak und Jakob“, nicht „um ... willen“. Auch die Konstruktion in Vers 3 sollte das gleichzeitige Kommen, Essen/Trinken und Zerschmettern klarer abbilden.'
  naturalness: Der Entwurf ist insgesamt idiomatisches modernes Standarddeutsch. Die Überarbeitung glättet insbesondere Vers 3 und fasst das passive Prädikat in Vers 2 näher am griechischen Satzbau.
  terminology: „Heiligtümer“, „Gesetz Gottes“, „Drache“, „Gottlosigkeit“ und „im Glauben“ sind angemessen. Die eckig geklammerte, textkritisch unsichere Wendung bleibt sichtbar und wird nicht dogmatisch aufgelöst.
  issues:
  - severity: high
    issue: 'Vers 7: „um Abrahams, Isaaks und Jakobs willen“'
    rationale: Das griechische διά regiert hier den Genitiv (Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ) und ist daher als „durch“ wiederzugeben. Die vorliegende Fassung ersetzt die vermittelnde Bedeutung durch eine kausale bzw. bundesbezogene Deutung.
  - severity: medium
    issue: 'Vers 3: Abbildung von „als Mensch mit Menschen essend und trinkend“'
    rationale: „Er selbst wird kommen, als Mensch unter Menschen essen und trinken“ ist im Deutschen syntaktisch etwas holprig und gibt μετά ἀνθρώπων eher als bloßes „unter Menschen“ wieder. Eine Partizipial- bzw. indem-Konstruktion macht die Abfolge und Gleichzeitigkeit klar.
  - severity: low
    issue: 'Vers 2: „In der Zerstreuung wird man euch verachten“'
    rationale: Der griechische Text sagt, dass die Angeredeten „zur Zerstreuung“ werden und als unbrauchbares Wasser verachtet sein werden. Eine passive Formulierung bewahrt dies genauer, ohne das ungewöhnliche Bild aufzugeben.
