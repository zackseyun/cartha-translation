base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/008/001.yaml
  text: And after saying these things to them, he commanded them, saying, “Bury me in Hebron.” And he died, having fallen asleep in a good sleep.
translation:
  language: de
  text: 'Und nachdem er ihnen dies gesagt hatte, befahl er ihnen: »Begrabt mich in Hebron.« Und er starb, nachdem er in einen guten Schlaf gefallen war.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Formulierung ist textkritisch unsicher; wörtlich etwa: »nachdem er einen guten Schlaf geschlafen hatte«.'
    reason: Das Kreuzzeichen der Edition kennzeichnet die Wendung als problematisch bzw. unsicher. Die Fußnote macht dies transparent und nennt die ungewöhnliche wörtliche Struktur.
lexical_decisions:
- source_word: ἐνετείλατο λέγων
  choice: gab er ihnen die Anweisung
  rationale: Gibt den befehlenden Sinn idiomatisch wieder, ohne die im Deutschen schwerfällige Doppelung »befahl ... und sagte« nachzuahmen.
- source_word: Θάψατέ με
  choice: Begrabt mich
  rationale: Direkte und natürliche Wiedergabe des griechischen Imperativs.
- source_word: ὕπνῳ καλῷ κοιμηθείς
  choice: nachdem er in einen guten Schlaf gefallen war
  rationale: Bewahrt das auffällige Schlafbild und die positive Bestimmung καλῷ, statt es lediglich als Umschreibung für den Tod aufzulösen.
theological_decisions:
- issue: Verhältnis von Tod und Schlafmetapher
  choice: 'Beide Aussagen werden nebeneinandergestellt: »er starb« und »in einen guten Schlaf gefallen«.'
  alternative: Die Wendung nur idiomatisch als »er entschlief friedlich« wiederzugeben.
  rationale: Der griechische Text nennt den Tod ausdrücklich und fügt zugleich das Schlafbild hinzu. Die Übersetzung bewahrt diese Spannung, ohne eine bestimmte Lehre über den Zustand nach dem Tod einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die umständliche griechische Redeeinleitung wurde natürlich verdichtet; die markante und textkritisch unsichere Schlafwendung blieb dagegen sichtbar erhalten.
