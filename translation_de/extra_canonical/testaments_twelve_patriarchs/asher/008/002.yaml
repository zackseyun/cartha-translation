  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/008/002.yaml
  text: And his sons did as he had commanded them, and they carried him away to Hebron and buried him with his fathers.
translation:
  language: de
  text: Und seine Söhne taten, was er ihnen geboten hatte. Sie brachten ihn nach Hebron und begruben ihn mit seinen Vätern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίησαν ... ὅσα ἐνετείλατο αὐτοῖς
  choice: taten, was er ihnen geboten hatte
  rationale: Gibt die Befolgung des zuvor erteilten Gebots natürlich und zugleich eng am griechischen Wortlaut wieder.
- source_word: ἀπήγαγον αὐτὸν ἐν Χεβρών
  choice: brachten ihn nach Hebron
  rationale: Im Zusammenhang mit Tod und Bestattung bezeichnet ἀπάγω das Überführen des Verstorbenen; das griechische ἐν steht hier bei einem Bewegungsziel und wird idiomatisch mit „nach“ wiedergegeben.
- source_word: ἔθαψαν αὐτὸν μετὰ τῶν πατέρων αὐτοῦ
  choice: begruben ihn bei seinen Vätern
  rationale: „Bei seinen Vätern“ bewahrt das biblisch-antike Bild der Beisetzung im Kreis der Vorfahren und vermeidet eine unnötige Ausdeutung.
theological_decisions:
- issue: Bedeutung von „mit/bei seinen Vätern“
  choice: bei seinen Vätern
  alternative: zusammen mit seinen Vorfahren
  rationale: Die gewählte Fassung erhält die traditionelle Verwandtschaftsbezeichnung und lässt offen, ob primär die gemeinsame Grabstätte oder allgemeiner die Zugehörigkeit zu den verstorbenen Ahnen gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzgliederung. Das wiederholte Pronomen des Griechischen wird nur dort beibehalten, wo es im Deutschen natürlich ist; die beiden Bestattungshandlungen stehen in einem eigenen Satz.
