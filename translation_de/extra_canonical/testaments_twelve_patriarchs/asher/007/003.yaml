revisions:
- from: Bis der Höchste die Erde heimsucht und selbst kommt wie ein Mensch, mit Menschen isst und trinkt und den Kopf des Drachen über dem Wasser zerschmettert. Dieser wird Israel und alle Völker retten – [Gott, der sich als Mensch ausgibt].[a]
