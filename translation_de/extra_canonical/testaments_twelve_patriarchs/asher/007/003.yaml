reference: Testament of Asher 7:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: Ἕως οὗ²⁰ ὁ ὕψιστος ἐπισκέψηται τὴν γῆν, καὶ αὐτὸς ἐλθὼν ⌜ὡς ἄνθρωπος²¹ μετὰ ἀνθρώπων *ἐσθίων καὶ πίνων²²⌝ καὶ²³ συντρίβων²⁴ τὴν κάραν²⁵ τοῦ δράκοντος *ἐπὶ τοῦ²⁶ ὕδατος, *οὗτος σώσει²⁷ τὸν Ἰσραὴλ καὶ πάντα τὰ ἔθνη [θεὸς²⁸ εἰς ἄνδρα ὑποκρινόμενος²⁹].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/003.yaml
  text: Until the Most High visits the earth, himself coming as a man, eating and drinking with men, and crushing the head of the dragon upon the water; this one will save Israel and all the nations [God appearing as a man].
translation:
  language: de
  text: Bis der Höchste die Erde aufsucht und selbst wie ein Mensch kommt, mit Menschen isst und trinkt und den Kopf des Drachen auf dem Wasser zerschmettert. Dieser wird Israel und alle Völker retten – [Gott, der sich als Mensch ausgibt][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „Gott, der sich als Mensch ausgibt“ stehen in der griechischen Ausgabe in eckigen Klammern und gelten daher als textkritisch unsicher.
    reason: Der Haupttext muss sichtbar machen, dass θεὸς εἰς ἄνδρα ὑποκρινόμενος in der vorgelegten Edition geklammert ist; die Fußnote erklärt die Bedeutung dieser Kennzeichnung.
lexical_decisions:
- source_word: ἐπισκέψηται
  choice: heimsucht
  rationale: Das Verb bezeichnet hier ein machtvolles göttliches Aufsuchen bzw. Eingreifen. „Heimsuchen“ bewahrt diesen feierlichen, im Kontext positiven Sinn, ohne ihn auf bloßes Besuchen zu verengen.
- source_word: ὡς ἄνθρωπος
  choice: wie ein Mensch
  rationale: Gibt den Vergleichspartikel ὡς unmittelbar wieder und legt nicht fest, ob damit Erscheinungsweise, Rolle oder Wesen ausgesagt wird.
- source_word: μετὰ ἀνθρώπων ἐσθίων καὶ πίνων
  choice: mit Menschen isst und trinkt
  rationale: Natürliche deutsche Wiedergabe der Partizipialkonstruktion bei weitgehend erhaltener Form und Aussage.
- source_word: τὴν κάραν τοῦ δράκοντος
  choice: den Kopf des Drachen
  rationale: κάρα bedeutet „Kopf/Haupt“; „Kopf“ ist in modernem Deutsch natürlich und bewahrt das Bild.
- source_word: ἐπὶ τοῦ ὕδατος
  choice: über dem Wasser
  rationale: ἐπί mit Genitiv kann eine Lage auf oder über etwas bezeichnen. „Über dem Wasser“ ist idiomatisch, ohne die schwer bestimmbare Bildszene unnötig auszudeuten.
- source_word: οὗτος
  choice: Dieser
  rationale: Bewahrt den betonten demonstrativen Rückverweis des griechischen Textes.
- source_word: ὑποκρινόμενος
  choice: der sich … ausgibt
  rationale: Das Partizip kann das Annehmen oder Vorspielen einer Rolle bezeichnen. „Sich als Mensch ausgeben“ bildet diese auffällige Formulierung präziser ab als das neutralere „erscheinen“.
theological_decisions:
- issue: Identität des Kommenden und Verhältnis von Gott und Mensch
  choice: „selbst kommt wie ein Mensch“; die eckig geklammerte Lesart bleibt separat erhalten
  alternative: „selbst als Mensch kommt“ oder „Gott erscheint als Mensch“
  rationale: Die Übersetzung hält am expliziten ὡς („wie/als ob“) fest und verschmilzt den wahrscheinlich textkritisch unsicheren Klammerzusatz nicht mit dem Haupttext. So wird die christologische Spannung nicht dogmatisch geglättet.
- issue: Wert und Sinn von ὑποκρινόμενος
  choice: „Gott, der sich als Mensch ausgibt“
  alternative: „Gott, der als Mensch erscheint“
  rationale: Die gewählte Fassung bewahrt den stärkeren Rollen- bzw. Verkleidungssinn des griechischen Ausdrucks, auch wenn dieser theologisch ungewöhnlich wirkt. Eine glättende Wiedergabe mit „erscheint“ würde diese Spannung abschwächen.
- issue: Umfang der Rettung
  choice: „Israel und alle Völker“
  alternative: „Israel und alle Nationen“
  rationale: „Völker“ ist die natürliche biblische Wiedergabe von ἔθνη und erhält den universalen Umfang der Aussage.
translation_notes:
  register: Feierliches, aber gegenwärtiges Standarddeutsch. Der Satzbau folgt dem griechischen Gedankengang, wird jedoch durch einen Punkt vor dem betonten „Dieser“ lesbarer. „Heimsuchen“ ist bewusst gehoben und bibelsprachlich, hier aber im Sinn eines rettenden göttlichen Eingreifens gebraucht.
