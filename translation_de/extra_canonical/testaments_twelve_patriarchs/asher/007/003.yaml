  rationale: Die Revision verbessert zwei deutsche Bedeutungsnuancen, ohne die syntaktische und theologische Spannung des griechischen Textes aufzulösen. Insbesondere wird die räumliche Aussage zu ἐπὶ τοῦ ὕδατος nicht durch die Vorstellung eines Schwebens „über“ dem Wasser präzisiert. Die unsichere Klammerlesart bleibt vollständig erhalten; die Fußnotenmarke steht unmittelbar nach der Klammerphrase und vor dem Satzpunkt.
