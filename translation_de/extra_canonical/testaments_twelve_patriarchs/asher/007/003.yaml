    issue: „über dem Wasser“ für ἐπὶ τοῦ ὕδατος
    rationale: Die Formulierung kann eine Position oberhalb des Wassers suggerieren. „auf dem Wasser“ gibt die gewöhnliche lokative Bedeutung von ἐπί mit Genitiv wieder und belässt die Bildszene offen.
  - severity: low
    issue: „heimsucht“ für ἐπισκέψηται
    rationale: Im gegenwärtigen Standarddeutsch ist „heimsuchen“ stark negativ konnotiert. „aufsuchen“ vermeidet eine nicht ausdrücklich vom griechischen Verb geforderte Deutung.
