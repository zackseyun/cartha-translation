  text: Ἀλλ᾽ ἐπισυνάξει ὑμᾶς⁴⁵ ἐν πίστει διὰ τῆς⁴⁶ εὐσπλαγχνίας αὐτοῦ, καὶ⁴⁷ δι᾽ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/007.yaml
  text: But the Lord will gather you in faith through his compassion, and through Abraham and Isaac and Jacob.
translation:
  language: de
  text: Doch wird er[a] euch im Glauben durch sein Erbarmen und durch Abraham, Isaak und Jakob sammeln.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht im Griechischen nur „er“; das Subjekt ist aus dem Zusammenhang zu erschließen.
    reason: Macht transparent, dass „der Herr“ aus der englischen Konsultationsfassung nicht ausdrücklich im vorliegenden griechischen Satz steht.
lexical_decisions:
- source_word: ἐπισυνάξει
  choice: wird … sammeln
  rationale: Gibt das zukünftige Zusammenführen der Angesprochenen direkt und natürlich wieder.
- source_word: ἐν πίστει
  choice: im Glauben
  rationale: Bewahrt die knappe und mehrdeutige Präpositionalwendung; sie kann den Bereich, die Haltung oder das Mittel des Sammelns bezeichnen.
- source_word: εὐσπλαγχνίας
  choice: Erbarmen
  rationale: Drückt das innige, mitfühlende Erbarmen in würdigem, allgemein verständlichem Deutsch aus.
- source_word: δι᾽ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: durch Abraham, Isaak und Jakob
  rationale: Erhält die ausdrücklich wiederholte instrumentale bzw. vermittelnde Aussage des griechischen διά, ohne ihre theologische Bedeutung näher festzulegen.
theological_decisions:
- issue: Unausgesprochenes Subjekt von ἐπισυνάξει
  choice: er
  alternative: der Herr
  rationale: Im griechischen Satz steht kein ausdrückliches Substantiv für das Subjekt. Das Pronomen bewahrt den Verweis auf den Kontext, ohne eine Bezeichnung in den Haupttext einzufügen.
- issue: Bedeutung von „durch“ bei den Erzvätern
  choice: Wörtliche Vermittlungsformulierung beibehalten
  alternative: „um Abrahams, Isaaks und Jakobs willen“
  rationale: Die alternative Deutung würde eine Begründung oder Verdienstvorstellung festlegen, die διά mit Genitiv hier nicht eindeutig erzwingt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „durch“ erhält die Struktur und Spannung des griechischen Satzes; „im Glauben“ bleibt bewusst unausgelegt.
