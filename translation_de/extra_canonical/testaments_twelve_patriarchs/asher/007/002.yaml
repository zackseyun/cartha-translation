source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ἐγὼ γὰρ οἶδα⁵ ὅτι ἁμαρτήσετε⁶ καὶ παραδοθήσεσθε εἰς χεῖρας ἐχθρῶν ὑμῶν, ⌜καὶ¹⁸ ἡ γῆ ὑμῶν⁹ ἐρημωθήσεται¹⁰, καὶ τὰ ἅγια ὑμῶν καταφθαρήσονται¹¹, καὶ ὑμεῖς¹² διασκορπισθήσεσθε¹³ εἰς τὰς τέσσαρας¹⁴ γωνίας *τῆς γῆς¹⁵, καὶ ἔσεσθε *εἰς διασπορὰν¹⁶ ἐξουδενωμένοι ὡς¹⁷ ὕδωρ¹⁸ ἄχρηστον¹⁹.⌝'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/002.yaml
  text: For I know that you will sin and be handed over into the hands of your enemies, and your land will be made desolate, and your holy things destroyed, and you will be scattered to the four corners of the earth, and you will be in the dispersion, despised like useless water.
translation:
  language: de
  text: Denn ich weiß, dass ihr sündigen und in die Hände eurer Feinde ausgeliefert werden werdet. Euer Land wird verwüstet werden, eure Heiligtümer werden zerstört werden, und ihr werdet in die vier Ecken der Erde zerstreut werden. In der Zerstreuung werdet ihr wie unbrauchbares Wasser verachtet sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἅγια ὑμῶν
  choice: eure Heiligtümer
  rationale: Das substantivierte Neutrum Plural bezeichnet hier im Zusammenhang mit Landverwüstung und Zerstörung am natürlichsten die heiligen Stätten beziehungsweise Heiligtümer des Volkes, nicht bloß abstrakt »heilige Dinge«.
- source_word: εἰς τὰς τέσσαρας γωνίας τῆς γῆς
  choice: in die vier Enden der Erde
  rationale: Bewahrt das antike Bild einer Zerstreuung in alle Weltgegenden, klingt im modernen Deutschen jedoch natürlicher als das wörtliche »vier Ecken der Erde«.
- source_word: εἰς διασποράν
  choice: in der Zerstreuung
  rationale: Gibt den Zustand des verstreuten Lebens wieder, ohne den griechischen Ausdruck vorschnell als späteren Fachbegriff »Diaspora« festzulegen.
- source_word: ἐξουδενωμένοι
  choice: verachtet
  rationale: Das Partizip bezeichnet Geringschätzung beziehungsweise Verachtung und bezieht sich auf die Angesprochenen.
- source_word: ὕδωρ ἄχρηστον
  choice: unbrauchbares Wasser
  rationale: Formale und verständliche Wiedergabe des ungewöhnlichen Vergleichs; seine Härte und mögliche Mehrdeutigkeit werden nicht geglättet.
theological_decisions:
- issue: Bezug von τὰ ἅγια ὑμῶν
  choice: konkret als »eure Heiligtümer«
  alternative: »eure heiligen Dinge«
  rationale: Der nationale Gerichtskontext legt zerstörbare heilige Stätten nahe; die Formulierung bleibt im Plural und führt keinen bestimmten Tempel ein.
- issue: Bedeutung von διασπορά
  choice: »Zerstreuung«
  alternative: »Diaspora«
  rationale: Die Übersetzung erhält das Exilmotiv, ohne durch einen eingedeutschten Fachbegriff zusätzliche historische oder theologische Festlegungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die prophetische Gerichtsrede bleibt direkt und rhythmisch; Passivformen bewahren die im Griechischen nicht ausdrücklich genannten Handelnden. Der ungewöhnliche Vergleich mit unbrauchbarem Wasser bleibt bewusst stehen.
