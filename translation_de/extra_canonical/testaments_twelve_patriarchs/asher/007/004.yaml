  verdict: approve
  source_fidelity: Der Entwurf gibt εἴπατε οὖν als folgernden Imperativ („Darum … sagt“) zutreffend wieder. Die Anrede τέκνα μου, die emphatische Einbeziehung καὶ ὑμεῖς, der Bezug von ταῦτα sowie der negative Finalsatz μὴ ἀπειθήσωσιν αὐτῷ sind vollständig und ohne sachliche Ergänzung übertragen. „Ihm“ bewahrt die im griechischen Einzelvers vorausgesetzte, aber hier nicht explizit aufgelöste Referenz von αὐτῷ.
  naturalness: Die Formulierung ist modernes, gut verständliches Standarddeutsch und wahrt einen angemessen würdigen Ermahnungsregister. Die Stellung „sagt auch ihr“ bildet die griechische Hervorhebung natürlich ab. „Dies“ ist als zusammenfassender Verweis idiomatisch.
  terminology: „Ungehorsam werden“ vermittelt die beabsichtigte Verneinung des Gehorsams gegenüber dem maskulinen Dativpronomen, ohne dessen Referenten konfessionell oder interpretativ festzulegen. Die wiederholte Anrede „Kinder“ ist angemessen und quellennah.
