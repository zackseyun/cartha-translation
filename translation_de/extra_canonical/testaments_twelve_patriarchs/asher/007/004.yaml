  text: Therefore, my children, you also tell these things to your children, so that they may not disobey him.
translation:
  language: de
  text: Darum, meine Kinder, sagt auch ihr dies euren Kindern, damit sie ihm nicht ungehorsam werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἴπατε οὖν
  choice: Darum … sagt
  rationale: Der Folgerungszusammenhang von οὖν und der Imperativ Aorist werden klar und natürlich wiedergegeben.
- source_word: τέκνα μου
  choice: meine Kinder
  rationale: Direkte, würdevolle Entsprechung der väterlichen Anrede.
- source_word: ταῦτα
  choice: dies
  rationale: Verweist zusammenfassend auf die zuvor vermittelten Aussagen; im Deutschen ist der Singular natürlich.
- source_word: μὴ ἀπειθήσωσιν
  choice: damit sie … nicht ungehorsam werden
  rationale: Gibt den verneinten Finalsatz und die Bedeutung von ἀπειθέω als Ungehorsam beziehungsweise Nichtbefolgen wieder.
- source_word: αὐτῷ
  choice: ihm
  rationale: Bewahrt den maskulinen Singularbezug des griechischen Pronomens, ohne den im Vers selbst nicht ausdrücklich genannten Referenten zu ergänzen.
theological_decisions:
- issue: Referent von αὐτῷ
  choice: „ihm“ ohne erläuternde Identifizierung
  alternative: Den Referenten ausdrücklich benennen oder neutralisieren
  rationale: Der griechische Vers setzt den Bezug aus dem Kontext voraus. Eine ausdrückliche Identifizierung würde die im Einzelvers vorhandene Bezugsabhängigkeit unnötig auflösen.
translation_notes:
  register: Modernes Standarddeutsch in natürlichem, würdigem Ermahnungsstil. Die Wiederholung von „Kinder“ folgt bewusst dem griechischen Text; die Syntax bleibt gut verständlich.
