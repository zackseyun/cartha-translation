  source_fidelity: Die Übersetzung gibt den griechischen Mahnimperativ Μὴ γίνεσθε treffend als „Werdet nicht“ wieder. „nicht erkannte“ wahrt bei ἠγνόησε die offene Bedeutung zwischen Nichterkennen und Verkennen. „die Engel des Herrn“ entspricht τοὺς ἀγγέλους Κυρίου, und „für immer zugrunde ging“ gibt den endgültigen Untergang in ἀπώλετο ἕως αἰῶνος angemessen wieder.
  naturalness: Der Satz ist klares, modernes Standarddeutsch mit einem würdigen, zur Mahnrede passenden Register. Die neutrale Relativform „das“ ist bei dem im Deutschen gewöhnlich sächlichen Ortsnamen „Sodom“ natürlich.
  terminology: „Engel des Herrn“ ist die etablierte und quellennahe Wiedergabe. Die Formulierung vermeidet es, aus dem Nichterkennen der Engel eine spezifische theologische oder erzählerische Deutung abzuleiten.
