source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: VII. Μὴ γίνεσθε¹ ὡς Σόδομα², ἥτις ἠγνόησε³ *τοὺς ἀγγέλους⁴ Κυρίου, καὶ ἀπώλετο ἕως αἰῶνος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/001.yaml
  text: Do not be like Sodom, which did not recognize the angels of the Lord, and perished forever.
translation:
  language: de
  text: Werdet nicht wie Sodom, das die Engel des Herrn nicht erkannte und für immer zugrunde ging.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μὴ γίνεσθε
  choice: Werdet nicht
  rationale: Gibt den durativen beziehungsweise entwicklungsbezogenen Imperativ natürlicher und genauer wieder als ein bloßes »Seid nicht«.
- source_word: ὡς Σόδομα
  choice: wie Sodom
  rationale: Direkte, idiomatische Wiedergabe des Vergleichs.
- source_word: ἠγνόησε
  choice: nicht erkannte
  rationale: Bewahrt die mögliche Bedeutung von fehlendem Erkennen beziehungsweise Verkennen, ohne sie enger als »nicht anerkannte« oder »missachtete« festzulegen.
- source_word: τοὺς ἀγγέλους Κυρίου
  choice: die Engel des Herrn
  rationale: Formale und im Deutschen geläufige Wiedergabe der bestimmten Nominalgruppe.
- source_word: ἀπώλετο ἕως αἰῶνος
  choice: für immer zugrunde ging
  rationale: »Zugrunde ging« gibt den Untergang durch ἀπόλλυμι idiomatisch wieder; »für immer« entspricht der zeitlichen Endgültigkeit von ἕως αἰῶνος.
theological_decisions:
- issue: Bedeutung von ἠγνόησε im Zusammenhang mit den Engeln
  choice: nicht erkannte
  alternative: nicht anerkannte / nichts wusste von
  rationale: Die Übersetzung lässt die Spannung zwischen Nichterkennen, Verkennen und Nichtanerkennen bestehen und legt den Text nicht auf eine bestimmte Auslegung der Sodom-Erzählung fest.
- issue: Reichweite von ἕως αἰῶνος
  choice: für immer
  alternative: auf ewig / bis in Ewigkeit
  rationale: Die Formulierung drückt endgültigen Untergang aus, ohne zusätzliche Aussagen über individuelle Eschatologie einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Mahnrede. Die Satzstruktur bleibt nahe am Griechischen, klingt aber natürlich; keine Fußnoten erforderlich.
