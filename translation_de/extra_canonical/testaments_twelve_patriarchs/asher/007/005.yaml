source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Ἐγὼ γὰρ ἔγνων³³ ὅτι ⸀ἀπειθοῦντες⸀³⁴ *ἀπειθήσετε, καὶ ἀσεβοῦντες ἀσεβήσετε³⁵, μὴ προσέχοντες³⁶ *τῷ νόμῳ³⁷ θεοῦ, ἀλλ᾽ ἐντολαῖς ἀνθρώπων *κακίᾳ διαφθειρόμενοι³⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/005.yaml
  text: For I know that, by disobeying, you will disobey, and by acting ungodly, you will act ungodly, paying no attention to the law of God, but being corrupted by wickedness through the commandments of men.
translation:
  language: de
  text: Denn ich erkannte, dass ihr, indem ihr ungehorsam seid, ungehorsam handeln werdet und, indem ihr gottlos handelt, gottlos handeln werdet, ohne auf das Gesetz Gottes zu achten, sondern durch die Gebote von Menschen durch Bosheit[a] verdorben werdet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Stellung von „durch Bosheit“ (griechisch: κακίᾳ) ist syntaktisch nicht völlig eindeutig. Es kann das Mittel bzw. die Ursache von „verdorben werden“ bezeichnen; eine engere Zuordnung zu „den Geboten von Menschen“ ist ebenfalls möglich.'
    reason: Der Dativ κακίᾳ kann sich auf διαφθειρόμενοι beziehen; angesichts der Wortstellung bleibt eine nähere Verbindung mit ἐντολαῖς ἀνθρώπων als syntaktische Nuance offen.
lexical_decisions:
- source_word: ἀπειθοῦντες … ἀπειθήσετε
  choice: euch im Ungehorsam widersetzen
  rationale: Gibt die figura etymologica des griechischen Partizips und Verbs in natürlichem Deutsch wieder; ἀπειθέω bezeichnet hier ungehorsames Nichtfolgen beziehungsweise Widersetzen.
- source_word: ἀσεβοῦντες ἀσεβήσετε
  choice: in Gottlosigkeit gottlos handeln
  rationale: Bewahrt die auffällige Wiederholung desselben griechischen Wortstamms und dessen religiös-moralische Bedeutung.
- source_word: μὴ προσέχοντες
  choice: Ihr achtet nicht auf
  rationale: Drückt die mangelnde Beachtung klar und gegenwärtig aus; der neue Satz vermeidet eine schwerfällige Partizipienkette.
- source_word: τῷ νόμῳ θεοῦ
  choice: das Gesetz Gottes
  rationale: Direkte und idiomatische Wiedergabe ohne konfessionelle Präzisierung.
- source_word: ἐντολαῖς ἀνθρώπων
  choice: die Gebote von Menschen
  rationale: Bewahrt den Kontrast zwischen Gottes Gesetz und menschlichen Geboten; »von Menschen« ist in modernem Deutsch klarer als »der Menschen«.
- source_word: κακίᾳ διαφθειρόμενοι
  choice: zum Bösen verderben
  rationale: Gibt διαφθείρω als moralisches Verderben wieder und lässt die syntaktisch-semantische Zuordnung von κακίᾳ durch eine Fußnote transparent werden.
theological_decisions:
- issue: Verhältnis von Gottes Gesetz und menschlichen Geboten
  choice: Der Gegensatz bleibt unkommentiert stehen.
  alternative: Die menschlichen Gebote ausdrücklich als religiöse Traditionen oder Irrlehren deuten.
  rationale: Der griechische Text nennt nur »Gebote von Menschen«; eine nähere konfessionelle oder institutionelle Bestimmung wäre ein unzulässiger Zusatz.
- issue: Nachdruck durch wiederholte Wortstämme
  choice: Die Wiederholungen bei Ungehorsam und Gottlosigkeit werden soweit möglich erhalten.
  alternative: Glätten zu »ihr werdet ungehorsam und gottlos handeln«.
  rationale: Die emphatische figura etymologica gehört zur Aussageform des Ausgangstextes und unterstreicht die sichere Voraussage.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die griechischen Stammwiederholungen werden bewusst hörbar gehalten, ohne die gesamte Satzstruktur unnatürlich nachzubilden. Der lange Partizipialsatz wird zur besseren Verständlichkeit in zwei Sätze gegliedert.
