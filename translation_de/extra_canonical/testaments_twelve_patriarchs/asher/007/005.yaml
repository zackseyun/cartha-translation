revisions:
- from: Denn ich weiß, dass ihr euch im Ungehorsam widersetzen und in Gottlosigkeit gottlos handeln werdet. Ihr achtet nicht auf das Gesetz Gottes, sondern lasst euch durch die Gebote von Menschen zum Bösen[a] verderben.
  to: Denn ich erkannte, dass ihr, indem ihr ungehorsam seid, ungehorsam handeln werdet und, indem ihr gottlos handelt, gottlos handeln werdet, ohne auf das Gesetz Gottes zu achten, sondern durch die Gebote von Menschen durch Bosheit[a] verdorben werdet.
  rationale: Die vollständige Revision stellt den künftigen Aussagezusammenhang wieder her und gibt das passive moralische Verderben ohne die Zusätze von Selbstverursachung oder Zielrichtung wieder. Die Fußnotenmarkierung bleibt unmittelbar bei „durch Bosheit“ und dokumentiert die überlieferte syntaktische Mehrdeutigkeit.
