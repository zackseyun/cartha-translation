  verdict: revise
  source_fidelity: Der Entwurf trifft den Gegensatz zwischen Gottes Gesetz und menschlichen Geboten sowie die Stammwiederholungen im Wesentlichen. Er verschiebt jedoch die im griechischen Zukunftszusammenhang stehenden Partizipien μὴ προσέχοντες und διαφθειρόμενοι in eine gegenwärtige Feststellung. Außerdem ist „lasst euch ... verderben“ reflexiv-voluntativ und „zum Bösen“ zielgerichtet; beides ist für „durch Bosheit verdorben werden“ nicht quellentreu.
  naturalness: Die Revision bewahrt einen würdigen, modernen Satzbau. Die Wiederholungen „ungehorsam ... ungehorsam handeln“ und „gottlos ... gottlos handeln“ sind absichtlich markiert, weil sie die griechische figura etymologica abbilden.
  terminology: „Gesetz Gottes“, „Gebote von Menschen“, „Bosheit“ und „verdorben werden“ geben τῷ νόμῳ θεοῦ, ἐντολαῖς ἀνθρώπων, κακίᾳ und διαφθειρόμενοι ohne konfessionelle Zusätze wieder. Die Fußnote kennzeichnet die nicht eindeutig entscheidbare syntaktische Beziehung der beiden Dative.
  issues:
