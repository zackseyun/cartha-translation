    issue: Zeitbezug der abschließenden Partizipien verändert
    rationale: „Ihr achtet nicht“ steht in der Gegenwart, während μὴ προσέχοντες und διαφθειρόμενοι zum vorherigen Futur ἀπειθήσετε gehören und den vorausgesagten künftigen Zustand bzw. die begleitenden Umstände ausdrücken.
