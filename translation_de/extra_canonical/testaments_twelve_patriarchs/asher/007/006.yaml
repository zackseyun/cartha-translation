source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Καὶ διὰ τοῦτο³⁹ διασκορπισθήσεσθε⁴⁰ ὡς Γὰδ καὶ⁴¹ Δάν, οἱ ἀδελφοί μου⁴², *καὶ ἀγνοήσετε χώρας αὐτῶν⁴³ καὶ φυλὴν καὶ γλῶσσαν⁴⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/007/006.yaml
  text: And because of this you will be scattered, like Gad and Dan, my brothers, and you will not know their land, tribe, and language.
translation:
  language: de
  text: Und deshalb werdet ihr zerstreut werden wie Gad und Dan, meine Brüder, und ihr werdet ihre Länder, ihren Stamm und ihre Sprache nicht kennen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διασκορπισθήσεσθε
  choice: ihr werdet zerstreut werden
  rationale: Das griechische Futur Passiv wird formal und natürlich wiedergegeben; „zerstreut“ bewahrt den Gedanken einer räumlichen Zerstreuung.
- source_word: ἀγνοήσετε
  choice: ihr werdet … nicht kennen
  rationale: Gibt das zukünftige Nichtwissen beziehungsweise Nichtkennen wieder, ohne die Aussage durch „vergessen“ oder „nicht wiedererkennen“ näher festzulegen.
- source_word: χώρας αὐτῶν
  choice: ihr Land
  rationale: Das Pronomen wird im Deutschen possessiv auf Gad und Dan bezogen; der griechische Plural kann kollektiv die Gebiete der beiden bezeichnen, während der überlieferte Singular „Land“ die knappe Ausdrucksweise der Vorlage bewahrt.
- source_word: φυλὴν καὶ γλῶσσαν
  choice: ihren Stamm und ihre Sprache
  rationale: Bewahrt die singularischen Sammelbegriffe der griechischen Fassung und gibt die koordinierte Aufzählung direkt wieder.
theological_decisions:
- issue: Bezug von „meine Brüder“
  choice: Als eingeschobene Anrede an die Zuhörer verstanden und durch Kommas markiert.
  alternative: 'Als nähere Bezeichnung zu „Gad und Dan“ lesen: „wie meine Brüder Gad und Dan“.'
  rationale: Die Stellung von οἱ ἀδελφοί μου nach Gad und Dan lässt eine Apposition zu, doch der Nominativ kann ebenso als vokativische Anrede stehen. Die Zeichensetzung der konsultierten englischen Fassung unterstützt die Anrede; die griechische Mehrdeutigkeit bleibt grundsätzlich bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an Satzbau und Bildsprache des Griechischen. Keine konfessionell geprägte Terminologie.
