base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/005.yaml
  text: '1[a]. See, my children, how there are two in all things, one opposite the other, and one is hidden under the other: in wealth, greed; in merriment, drunkenness; in laughter, grief[b]; in marriage, debauchery. 2. Death follows life, dishonor glory, night day, darkness light; but all things are under the day: righteous things under life, and unrighteous things under death. Therefore eternal life also awaits death. 3. And one cannot say that truth is falsehood, nor that what is righteous is unrighteous, because all truth is under the light, just as all things are under God. 4. Therefore I tested all these things in my life, and I did not go astray from the truth of the Lord, and I sought out the commandments of the Most High[c], walking according to all my strength.'
translation:
  language: de
  text: '1. Seht, meine Kinder, wie in allen Dingen zweierlei ist, das eine dem anderen gegenüber, und wie das eine unter dem anderen verborgen ist: in der Schöpfung die Habgier[a], in der Fröhlichkeit die Trunkenheit, im Lachen die Trauer, in der Ehe die Ausschweifung. 2. Auf das Leben folgt der Tod, auf die Ehre die Schande, auf den Tag die Nacht, auf das Licht die Finsternis. Alles aber steht unter dem Tag: das Gerechte unter dem Leben, das Ungerechte unter dem Tod.[b] Deshalb erwartet auch das ewige Leben den Tod.[c] 3. Man kann die Wahrheit nicht Lüge nennen und das Gerechte nicht ungerecht; denn alle Wahrheit steht unter dem Licht, wie alles unter Gott steht.[b] 4. Dies alles nun habe ich in meinem Leben geprüft. Ich bin nicht von der Wahrheit des Herrn abgeirrt, sondern habe nach den Geboten des Höchsten geforscht und bin dabei mit all meiner Kraft meinen Weg gegangen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorgelegte griechische Text hat κτίσει, wörtlich „in der Schöpfung“ oder „im Geschaffenen“. Dem Zusammenhang nach wird auch eine Lesart im Sinn von „im Besitz“ oder „beim Erwerb“ erwogen.
    reason: textual_variant
  - marker: b
    text: Das wiederholte „unter“ kann einen moralischen oder kosmischen Bereich, eine Zugehörigkeit oder eine Herrschaftsordnung bezeichnen. Der griechische Text legt die genaue Beziehung nicht eindeutig fest.
    reason: cultural_note
  - marker: c
    text: Die Aussage ist sprachlich und gedanklich schwierig. Nach der griechischen Satzform ist „das ewige Leben“ das Subjekt und „den Tod“ das Objekt; diese paradoxe Formulierung bleibt daher erhalten.
    reason: textual_variant
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Seht
  rationale: Der Imperativ eröffnet die väterliche Mahnrede knapp und eindringlich, ohne altertümlich zu wirken.
- source_word: δύο ... ἓν κατέναντι τοῦ ἑνός
  choice: in allen Dingen zweierlei ... das eine dem anderen gegenüber
  rationale: „Zweierlei“ gibt die paarweise Gegenüberstellung im Deutschen natürlich wieder, ohne sie als bloße „zwei Seiten“ interpretierend abzuschwächen.
- source_word: κτίσει
  choice: Schöpfung
  rationale: Die vorgelegte griechische Form κτίσει gehört zu κτίσις und bedeutet zunächst „Schöpfung“ beziehungsweise „Geschaffenes“. Die kontextuell naheliegende Lesart „Besitz/Erwerb“ würde eher eine andere griechische Form voraussetzen und wird deshalb nur in der Fußnote genannt.
- source_word: πλεονεξία
  choice: Habgier
  rationale: Das Wort bezeichnet ein Mehr-haben-Wollen und wird mit dem klaren modernen Lasterbegriff „Habgier“ wiedergegeben.
- source_word: εὐφροσύνη
  choice: Fröhlichkeit
  rationale: Bezeichnet eine freudige oder festliche Stimmung und bildet einen verständlichen Kontrast zur darin verborgenen Trunkenheit.
- source_word: ἀσωτία
  choice: Ausschweifung
  rationale: Bewahrt die Bedeutung zügelloser Lebensführung, ohne den Ausdruck unnötig auf einen einzelnen sexuellen Tatbestand festzulegen.
- source_word: διαδέχεται
  choice: folgt auf
  rationale: Gibt das zeitliche Nachfolgen klar wieder und trägt die rhythmische Reihe der Gegensatzpaare.
- source_word: τὰ δίκαια / τὰ ἄδικα
  choice: das Gerechte / das Ungerechte
  rationale: Die substantivierten Neutra bezeichnen moralische Bereiche, Dinge oder Handlungen und werden nicht auf Personengruppen verengt.
- source_word: ὑπό
  choice: unter / steht unter
  rationale: Die wiederholte räumlich-hierarchische Bildsprache bleibt sichtbar; „steht unter“ ist im Deutschen lesbar, ohne die genaue Beziehung als Zugehörigkeit oder Herrschaft festzulegen.
- source_word: ἐξεζήτησα
  choice: habe nach ... geforscht
  rationale: Die intensivierte Verbform bezeichnet ein ernsthaftes, gründliches Suchen und wird stärker als bloßes „suchen“ formuliert.
- source_word: κατὰ πᾶσαν ἰσχύν μου πορευόμενος
  choice: bin dabei mit all meiner Kraft meinen Weg gegangen
  rationale: Bewahrt sowohl das Motiv des Gehens als auch den Einsatz der ganzen Kraft in natürlichem Deutsch.
theological_decisions:
- issue: Subjekt und Objekt in διὸ καὶ τὸν θάνατον ἡ αἰώνιος ζωὴ ἀναμένει
  choice: Deshalb erwartet auch das ewige Leben den Tod.
  alternative: Deshalb wartet jenseits des Todes das ewige Leben.
  rationale: Die griechischen Kasus weisen „das ewige Leben“ als Subjekt und „den Tod“ als Objekt aus. Die paradoxe Aussage wird nicht zu einer geläufigeren Jenseitsaussage umgedeutet.
- issue: Bedeutung der wiederholten ὑπό-Verbindungen
  choice: Die Formulierung mit „unter“ wird durchgehend beibehalten.
  alternative: Die Ausdrücke als „gehört zum Bereich von“ oder „steht auf der Seite von“ erklären.
  rationale: Der Text lässt offen, ob es um moralische Zugehörigkeit, kosmische Ordnung oder Herrschaft geht. Die Übersetzung bewahrt diese Spannung und das wiederkehrende Sprachmuster.
- issue: Verhältnis der verborgenen Gegensätze
  choice: das eine unter dem anderen verborgen
  alternative: in jedem Guten steckt ein entsprechendes Böses
  rationale: Eine ausdrückliche Gleichsetzung der Gegensatzpaare mit Gut und Böse würde die Aussage systematisieren. Die Übersetzung hält sich an das Bild des Verborgenseins.
translation_notes:
  register: Moderne, würdige Standardsprache mit knappem testamentarischem Mahnton. Die rhythmischen Gegensatzpaare und die wiederholte „unter“-Bildsprache werden bewahrt. Ungewohnte oder textlich schwierige Formulierungen werden nicht stillschweigend harmonisiert, sondern im Haupttext erhalten und knapp erläutert.
