source:
  edition: Charles 1908 Greek Versions (pages 244-255, Asher pilot)
  text: '*Τὴν ⌜δὲ⌝ κακίαν ἀποδράσατε¹⁰, ἀναιροῦντες *τὸ διαβούλιον¹¹ ἐν ταῖς ἀγαθαῖς ὑμῶν πράξεσι, ὅτι οἱ διπρόσωποι *οὐκ εἰσὶ τοῦ Θεοῦ¹², ἀλλὰ ταῖς ἐπιθυμίαις αὐτῶν δουλεύουσιν, ἵνα τῷ Βελίαρ ἀρέσωσιν, καὶ τοῖς ὁμοίοις¹³ αὐτῶν ἀνθρώποις.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/asher/003/002.yaml
  text: But flee wickedness, destroying its plan by your good deeds; for the double-faced are not of God, but are enslaved to their own desires, so that they may please Beliar[b].
translation:
  language: de
  text: Flieht aber die Bosheit, indem ihr den Anschlag durch eure guten Taten zunichtemacht. Denn die Doppelgesichtigen gehören nicht zu Gott, sondern dienen ihren eigenen Begierden wie Sklaven, um Beliar[a] und Menschen ihresgleichen zu gefallen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beliar ist die griechische Form des Namens, der häufig als Belial wiedergegeben wird.
    reason: lexical_alternative
lexical_decisions:
- source_word: κακίαν
  choice: die Bosheit
  rationale: Gibt die moralische Bedeutung des griechischen Begriffs natürlich und prägnant wieder.
- source_word: ἀποδράσατε
  choice: Flieht
  rationale: Bewahrt den nachdrücklichen Imperativ und das Bild aktiver Abkehr.
- source_word: ἀναιροῦντες τὸ διαβούλιον
  choice: und vereitelt ihren Plan
  rationale: ἀναιρέω bezeichnet hier das Beseitigen oder Zunichtemachen; διαβούλιον meint einen Plan oder Anschlag. Das Possessivpronomen bezieht den Plan im Kontext auf die Bosheit.
- source_word: διπρόσωποι
  choice: die Doppelgesichtigen
  rationale: Bewahrt das auffällige Bild des griechischen Ausdrucks für Menschen mit widersprüchlicher beziehungsweise heuchlerischer Ausrichtung, ohne es auf eine einzige Deutung zu verengen.
- source_word: οὐκ εἰσὶ τοῦ Θεοῦ
  choice: gehören nicht zu Gott
  rationale: Gibt den Zugehörigkeit ausdrückenden Genitiv idiomatisch wieder.
- source_word: ταῖς ἐπιθυμίαις αὐτῶν δουλεύουσιν
  choice: dienen ihren eigenen Begierden wie Sklaven
  rationale: Macht die in δουλεύουσιν enthaltene Vorstellung versklavten Dienens deutlich, ohne im Deutschen unnatürlich zu klingen.
- source_word: τοῖς ὁμοίοις αὐτῶν ἀνθρώποις
  choice: Menschen ihresgleichen
  rationale: Nimmt die im griechischen Ausgangstext vorhandene zweite Dativgruppe auf, die in der englischen Konsultationsfassung fehlt.
theological_decisions:
- issue: Bedeutung von οὐκ εἰσὶ τοῦ Θεοῦ
  choice: gehören nicht zu Gott
  alternative: sind nicht aus Gott
  rationale: Die gewählte Formulierung bewahrt die Aussage über Zugehörigkeit, ohne eine spezifische metaphysische oder konfessionelle Deutung einzutragen.
- issue: Personen, denen die Doppelgesichtigen gefallen wollen
  choice: Beliar und Menschen ihresgleichen
  alternative: nur Beliar
  rationale: Der griechische Text nennt ausdrücklich sowohl Beliar als auch τοῖς ὁμοίοις αὐτῶν ἀνθρώποις; daher wird die zweite Gruppe trotz ihrer Auslassung in der englischen Konsultationsfassung beibehalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direktem Mahnton. Die ungewöhnliche Bezeichnung „Doppelgesichtigen“ bleibt als bewusstes Bild des Ausgangstextes erhalten; „wie Sklaven dienen“ verdeutlicht die starke Semantik von δουλεύω.
