  text: But you, my children, do not become double-faced[a] like them, in goodness and wickedness, but cling to goodness alone, because the Lord God rests in it, and people long for it.
translation:
  language: de
  text: Ihr aber, meine Kinder, seid nicht wie sie zwiespältig[a] zwischen Gutem und Bösem, sondern haltet allein am Guten fest; denn Gott, der Herr, ruht darin, und die Menschen sehnen sich danach.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „zweigesichtig“ oder „doppelgesichtig“. Gemeint ist ein innerlich geteilter moralischer Charakter, nicht nur Unaufrichtigkeit im Umgang mit anderen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: διπρόσωποι
  choice: doppelgesichtig
  rationale: Bewahrt das griechische Bild eines in zwei moralische Richtungen geteilten Charakters; „doppelzüngig“ wäre enger und auf Sprache bezogen, „heuchlerisch“ würde die Bedeutung vorschnell festlegen.
- source_word: κολλήθητε
  choice: haltet … fest
  rationale: Gibt die nachdrückliche Aufforderung wieder, sich eng und beständig an das Gute zu binden, in natürlichem modernem Deutsch.
- source_word: ἀναπαύεται ἐν αὐτῇ
  choice: ruht darin
  rationale: Erhält die konkrete Metapher und den Rückbezug auf die Güte beziehungsweise das Gute, ohne sie theologisch auszudeuten.
- source_word: ποθοῦσιν
  choice: sehnen sich danach
  rationale: Drückt das starke Verlangen des griechischen Verbs natürlicher und genauer aus als ein schwächeres „wünschen“.
theological_decisions:
- issue: Bezug des weiblichen Pronomens αὐτῇ/αὐτήν auf ἀγαθότης
  choice: Deutsch mit „darin“ und „danach“, bezogen auf „das Gute“
  alternative: „in ihr“ und „nach ihr“, bezogen auf „die Güte“
  rationale: Der griechische Rückbezug gilt der ἀγαθότης; im Deutschen ermöglicht „das Gute“ eine natürliche Formulierung, ohne den Aussagegehalt zu verändern.
- issue: Textkritische Markierung bei Κύριος
  choice: „der Herr, Gott“
  alternative: „Gott, der Herr“ oder nur „Gott“
  rationale: Gibt Κύριος ὁ Θεός formal wieder und bewahrt die in der Vorlage markierte Lesart, ohne eine konfessionell geprägte Standardformel aufzudrängen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Anrede und der mahnende Ton bleiben erhalten; die Bildsprache des griechischen Textes wird soweit möglich bewahrt.
