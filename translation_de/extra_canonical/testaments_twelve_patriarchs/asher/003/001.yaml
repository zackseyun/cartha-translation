  naturalness: Die Revision beseitigt die im Deutschen unübliche und syntaktisch holprige Verbindung „werdet nicht ... doppelgesichtig im Guten und im Bösen“ sowie die unnatürliche Apposition „der Herr, Gott“. Der mahnende, würdige Ton bleibt erhalten.
  terminology: „Das Gute“ und „das Böse“ sind für ἀγαθότης und κακία in diesem ethischen Kontext idiomatisch. Die Fußnote erläutert die wörtliche Bildsprache von διπρόσωποι und wahrt zugleich die weiter gefasste Bedeutung eines geteilten moralischen Charakters.
