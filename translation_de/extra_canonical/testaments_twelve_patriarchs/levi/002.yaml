base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002.yaml
  text: 1[a]. I, Levi, was born in Haran, and I came with my father to Shechem. 2. And I was still young, about twenty years old, and then I carried out vengeance with Simeon for our sister Dinah against Hamor. 3[b]. And as I was shepherding in Abelmaul, a spirit of understanding from the Lord came upon me, and I saw all people destroying their way, and sin was being built upon a wall, and injustice sat upon towers. 4. And I was grieved over the race of the sons of men, and I prayed to the Lord that I might be saved. 5. Then sleep fell upon me, and I saw a high mountain, and I was on it. 6. And behold, the heavens were opened, and an angel of the Lord said to me, “Levi, Levi[c], enter.”
translation:
  language: de
  text: '**Testament Levis 2**


    **1** Ich, Levi, wurde in Haran geboren und kam mit meinem Vater nach Sichem. **2** Ich war noch jung, etwa zwanzig Jahre alt, als ich zusammen mit Simeon die Rache für unsere Schwester Dina an Hamor vollzog. **3** Als ich in Abel-Maul die Herden hütete, kam ein Geist der Einsicht vom Herrn über mich. Ich sah, wie alle Menschen ihren Weg zugrunde richteten[a]; auf einer Mauer wurde die Sünde aufgebaut, und auf Türmen saß das Unrecht. **4** Da trauerte ich über das Geschlecht der Menschensöhne[b] und betete zum Herrn, dass ich gerettet würde. **5** Dann fiel Schlaf auf mich, und ich sah einen hohen Berg, und ich befand mich auf ihm. **6** Und siehe, die Himmel öffneten sich[c], und ein Engel des Herrn sagte zu mir: »Levi, Levi, tritt ein!«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich geht es darum, dass die Menschen ihren eigenen »Weg« vernichten oder zugrunde richten; der Weg steht dabei für ihre Lebensführung.
    reason: lexical_alternative
  - marker: b
    text: »Das Geschlecht der Menschensöhne« ist eine feierliche, semitisch geprägte Bezeichnung für die Menschheit.
    reason: cultural_note
  - marker: c
    text: Das Öffnen der Himmel gehört zur typischen Sprache apokalyptischer Visionen und begegnet auch in anderen biblischen und frühjüdischen Visionsberichten.
    reason: cross_reference
lexical_decisions:
- source_word: ἐποίησα τὴν ἐκδίκησιν
  choice: die Rache … vollzog
  rationale: Die Wendung bewahrt den aktiven, gewichtigen Charakter von Levis Beteiligung an der vergeltenden Gewalttat, ohne sie zu einem bloßen Gefühl abzuschwächen.
- source_word: νεώτερος
  choice: noch jung
  rationale: Im autobiografischen Zusammenhang mit der Altersangabe »etwa zwanzig Jahre« ist dies natürliches modernes Deutsch und erhält den relativen Sinn.
- source_word: πνεῦμα συνέσεως Κυρίου
  choice: ein Geist der Einsicht vom Herrn
  rationale: Der unbestimmte Ausdruck wird nicht vorschnell als feststehender Titel oder ausdrücklich als Heiliger Geist gedeutet; zugleich bleibt der göttliche Ursprung klar.
- source_word: ἀφανίσαντας τὴν ὁδὸν αὐτῶν
  choice: ihren Weg zugrunde richteten
  rationale: Die Übersetzung bleibt nahe bei der starken Bedeutung »vernichten/zugrunde richten« und bewahrt zugleich die biblisch geprägte Weg-Metapher für Lebensführung.
- source_word: ἁμαρτία ... οἰκοδομεῖτο
  choice: die Sünde wurde aufgebaut
  rationale: Die auffällige passive Architekturmetapher des Griechischen bleibt erhalten und wird nicht erklärend geglättet.
- source_word: ἀδικία ἐκάθητο
  choice: das Unrecht saß
  rationale: Die Personifikation und das statische Bild werden wörtlich und verständlich wiedergegeben.
- source_word: γένος τῶν υἱῶν τῶν ἀνθρώπων
  choice: das Geschlecht der Menschensöhne
  rationale: Diese feierliche, semitisch geprägte Formulierung wahrt das Register und die Breite des Ausdrucks besser als eine bloße Glättung zu »Menschheit«.
- source_word: ὅπως σωθῶ
  choice: dass ich gerettet würde
  rationale: »Gerettet« erhält sowohl den allgemeinen Sinn von Bewahrung und Befreiung als auch die mögliche theologische Tiefe.
- source_word: ἐπέπεσέ με ὕπνος
  choice: Schlaf fiel auf mich
  rationale: Das anschauliche Idiom und sein visionärer Ton werden gegenüber dem schlichteren »ich schlief ein« bewahrt.
- source_word: ἀνεῴχθησαν οἱ οὐρανοί
  choice: die Himmel öffneten sich
  rationale: Der griechische Plural und die apokalyptische Bildsprache bleiben erhalten; die deutsche aktivisch-reflexive Form klingt dabei natürlicher.
- source_word: εἴσελθε
  choice: tritt ein
  rationale: Der knappe Imperativ wird würdevoll und ohne eine im Text nicht ausdrücklich genannte Zielangabe wiedergegeben.
theological_decisions:
- issue: Wesen von πνεῦμα συνέσεως
  choice: ein vom Herrn kommender Geist der Einsicht, ohne ausdrückliche Gleichsetzung mit dem Heiligen Geist als Titel
  alternative: der Geist der Einsicht beziehungsweise der Heilige Geist der Einsicht
  rationale: Der griechische Wortlaut bezeichnet klar göttlich vermittelte Einsicht, enthält aber keine sprachlichen Merkmale, die eine spätere dogmatische Identifizierung erzwingen.
- issue: Bedeutungsumfang von σωθῶ
  choice: gerettet
  alternative: bewahrt oder befreit
  rationale: Im Zusammenhang mit der verderbten menschlichen Lebensführung kann die Bitte mehr als körperliche Bewahrung umfassen. »Gerettet« hält diese Spannung offen.
- issue: Bild von Sünde und Unrecht in Vers 3
  choice: die ungewöhnlichen Architektur- und Thronbilder bleiben unaufgelöst stehen
  alternative: paraphrasierende Deutung als gesellschaftliche Verfestigung von Sünde und Herrschaft des Unrechts
  rationale: Der visionäre Text bietet ein mehrdeutiges Bild. Eine erklärende Paraphrase würde seine apokalyptische Offenheit und Spannung einschränken.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, visionstauglichem Register. Bewusst erhalten sind die anaphorische Erzählweise, die Weg-Metapher, der Plural »die Himmel« sowie die fremdartigen Bilder von Sünde und Unrecht. Eigennamen folgen geläufigen deutschen Formen; Abelmaul wird zur besseren Lesbarkeit als »Abel-Maul« gesetzt.
