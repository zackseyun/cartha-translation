id: T12P.LEV.6.3
reference: Testament of Levi 6:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Μετὰ δὲ τοῦτο συνεβούλευσα⁵ *τῷ πατρί μου καὶ⁶ τῷ⁷ Ῥουβὴμ⁸ ἵνα εἴπῃ⁹ *τοῖς υἱοῖς¹⁰ Ἐμμώρ¹¹ τοῦ¹² μὴ¹³ *περιτμηθῆναι αὐτούς¹⁴, ὅτι¹⁵ ἐζήλωσα *διὰ τὸ βδέλυγμα¹⁶, *ὃ ἐποίησαν¹⁷ *ἐπὶ τῇ ἀδελφῇ μου¹⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/003.yaml
  text: After this I took counsel with my father and with Reuben, that he should tell the sons of Emmor not to circumcise themselves, because I was zealous because of the abomination which they had committed against my sister.
translation:
  language: de
  text: Danach beriet ich mich mit meinem Vater und mit Ruben, damit er den Söhnen Hemors sage, sie sollten sich nicht beschneiden lassen; denn wegen der abscheulichen Tat, die sie an meiner Schwester begangen hatten, war ich von Eifer erfüllt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεβούλευσα
  choice: beriet ich mich mit
  rationale: Gibt das gemeinsame Beraten mit den durch μετά bzw. σύν bezeichneten Personen natürlich und sachlich wieder.
- source_word: τοῖς υἱοῖς Ἐμμώρ
  choice: den Söhnen Hemors
  rationale: Bewahrt die wörtliche Bezeichnung des griechischen Textes; „Hemor“ entspricht der im Deutschen geläufigen biblischen Namensform.
- source_word: τοῦ μὴ περιτμηθῆναι αὐτούς
  choice: sie sollten sich nicht beschneiden lassen
  rationale: Gibt die verneinte Aorist-Passivkonstruktion idiomatisch wieder, ohne sie als bloß reflexive Eigenhandlung darzustellen.
- source_word: ἐζήλωσα
  choice: war ich von Eifer erfüllt
  rationale: Bewahrt die Bedeutung von starkem Eifer beziehungsweise Entrüstung, ohne den Ausdruck vorschnell als bloße Wut oder Eifersucht festzulegen.
- source_word: διὰ τὸ βδέλυγμα
  choice: wegen der abscheulichen Tat
  rationale: βδέλυγμα bezeichnet etwas Abscheuliches oder einen Gräuel; im Zusammenhang ist eine begangene Tat gemeint, weshalb diese Wiedergabe im Deutschen klar und natürlich ist.
- source_word: ἐπὶ τῇ ἀδελφῇ μου
  choice: an meiner Schwester
  rationale: Entspricht der deutschen Wendung für ein an einer Person begangenes Vergehen und lässt die genaue Art der Tat im Vers selbst unausgeführt.
theological_decisions:
- issue: Bedeutung von ἐζήλωσα
  choice: „war ich von Eifer erfüllt“
  alternative: „ereiferte ich mich“ / „war ich empört“
  rationale: Die gewählte Formulierung erhält die mögliche religiös-moralische Färbung des Eifers und vermeidet eine psychologische Verengung.
- issue: Bezug des Singulars εἴπῃ („er sage“)
  choice: 'Singular beibehalten: „damit er … sage“'
  alternative: 'Pluralisierend: „damit sie … sagten“'
  rationale: Der griechische Text hat ausdrücklich den Singular. Obwohl Vater und Ruben zuvor gemeinsam genannt werden und der Bezug nicht völlig eindeutig ist, soll diese Spannung nicht stillschweigend aufgelöst werden.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satzbau bleibt nahe am griechischen Gedankengang, wird aber durch Semikolon und idiomatische deutsche Formulierungen lesbar gestaltet. Keine Fußnoten erforderlich.
