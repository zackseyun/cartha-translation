id: T12P.LEV.6.1
reference: Testament of Levi 6:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ¹ ὡς ἠρχόμην πρὸς τὸν πατέρα μου εὗρον ἀσπίδα χαλκῆν *διὸ καὶ τὸ ὄνομα τοῦ ὄρους Ἄσπις² *ὅ ἐστιν³ ἐγγὺς Γεβάλ, ἐκ δεξιῶν Ἀβιμά⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/001.yaml
  text: And as I was going to my father, I found a bronze shield; therefore the name of the mountain is Aspis, which is near Gebal, to the right of Abim.
translation:
  language: de
  text: Und als ich zu meinem Vater ging, fand ich einen bronzenen Schild. Daher heißt der Berg Aspis[a]; er liegt nahe bei Gebal, rechts von Abim.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Aspis ist das griechische Wort für „Schild“; der Name des Berges wird hier mit dem gefundenen Schild in Verbindung gebracht.
    reason: Das Wortspiel zwischen ἀσπίδα („Schild“) und dem Bergnamen Ἄσπις ist in einer bloßen Transliteration für deutschsprachige Leser nicht erkennbar.
lexical_decisions:
- source_word: ἠρχόμην πρὸς τὸν πατέρα μου
  choice: als ich zu meinem Vater ging
  rationale: Gibt den durativen Bewegungsvorgang des Imperfekts natürlich wieder, ohne ein im Griechischen nicht ausdrücklich genanntes Zielverb hinzuzufügen.
- source_word: ἀσπίδα χαλκῆν
  choice: einen bronzenen Schild
  rationale: ἀσπίς bezeichnet hier einen Schild; χαλκοῦς/χαλκῆ gibt das Material Bronze beziehungsweise Kupferlegierung an. „Bronzen“ ist im Deutschen präzise und idiomatisch.
- source_word: διὸ καὶ τὸ ὄνομα τοῦ ὄρους Ἄσπις
  choice: Daher heißt der Berg Aspis
  rationale: Natürliche deutsche Wiedergabe der wörtlichen Aussage „daher [ist] auch der Name des Berges Aspis“; der Zusammenhang zwischen Fund und Bergnamen bleibt erkennbar.
- source_word: ἐγγὺς Γεβάλ
  choice: nahe bei Gebal
  rationale: Bewahrt den Ortsnamen als Transliteration und gibt ἐγγύς räumlich wieder.
- source_word: ἐκ δεξιῶν Ἀβιμά
  choice: rechts von Abim
  rationale: Gibt die relative Lageangabe knapp und natürlich wieder; die genaue Blick- oder Bewegungsrichtung bleibt, wie im Ausgangstext, unbestimmt.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzglieder wurden zur besseren Lesbarkeit auf zwei Sätze verteilt. Ortsnamen bleiben in der überlieferten Form; die unbestimmte räumliche Perspektive von „rechts von Abim“ wird nicht präzisiert.
