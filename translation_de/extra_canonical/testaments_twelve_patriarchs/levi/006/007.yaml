  source_fidelity: Die Wiedergabe von παρὰ γνώμην αὐτοῦ als „gegen seinen Willen“ ist treffend. Das griechische ἐμαλακίσθη ist jedoch Aorist und bezeichnet, ohne eine weiter zurückliegende Zeitstufe zu markieren, dass er an jenem Tag schwach wurde bzw. geschwächt wurde. Das deutsche Plusquamperfekt „schwach geworden war“ verschiebt dieses Ereignis unnötig weiter in die Vergangenheit.
  naturalness: Der Satz ist in modernem Standarddeutsch klar und würdig. „Wurde schwach“ ist hier knapper und idiomatischer als „schwach geworden war“ und bewahrt den berichtenden Charakter des griechischen Aorists.
  terminology: „Sünde“ und „gegen seinen Willen“ sind angemessen und nicht konfessionell überbestimmt. „Schwach wurde“ lässt offen, ob eine körperliche, seelische oder sonstige Schwächung gemeint ist, und wahrt damit die Mehrdeutigkeit der passiven griechischen Form.
