  text: '*Διότι ἡμάρτομεν ἐπειδὴ³⁵ παρὰ γνώμην αὐτοῦ τοῦτο πεποιήκαμεν³⁶, καίγε ἐμαλακίσθη³⁷ ἐν τῇ ἡμέρᾳ ἐκείνῃ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/007.yaml
  text: For we sinned, because we had done this contrary to his will, although he became weak on that day.
translation:
  language: de
  text: Denn wir haben gesündigt, weil wir dies gegen seinen Willen getan hatten, obwohl er an jenem Tag schwach wurde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρὰ γνώμην αὐτοῦ
  choice: gegen seinen Willen
  rationale: γνώμη bezeichnet hier im Zusammenhang eher Absicht oder Willen als ein Urteil; die Wendung gibt den bewussten Gegensatz zu seinem Willen natürlich wieder.
- source_word: ἐμαλακίσθη
  choice: schwach geworden war
  rationale: Die passive Form bezeichnet ein Schwachwerden oder Entkräftetwerden. Die Formulierung wahrt die Unbestimmtheit hinsichtlich Art und Ursache der Schwäche.
theological_decisions:
- issue: Zeitliches Verhältnis der Handlungen
  choice: 'Plusquamperfekt: „hatten gesündigt … getan hatten … geworden war“'
  alternative: 'Perfekt/Präteritum: „sündigten … taten … wurde“'
  rationale: Der griechische Satz blickt berichtend auf bereits vollzogene Ereignisse zurück; im Deutschen macht das Plusquamperfekt dieses Verhältnis klar, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kausale Struktur mit „Denn … weil“ und die konzessive Spannung von καίγε („obwohl“) bleiben erhalten.
