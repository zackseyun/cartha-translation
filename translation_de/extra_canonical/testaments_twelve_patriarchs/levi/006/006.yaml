base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/006.yaml
  text: And my father heard these things, and being angry, he was grieved because they had accepted circumcision and died, and in his blessings he passed over us.
translation:
  language: de
  text: Und mein Vater hörte dies alles. Er wurde zornig und war betrübt, weil sie die Beschneidung angenommen hatten und gestorben waren; und in seinen Segenssprüchen überging er uns.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατεδέξαντο τὴν περιτομήν
  choice: die Beschneidung angenommen hatten
  rationale: Gibt die bewusste Annahme der Beschneidung wieder; das Präfix in κατεδέξαντο verstärkt hier die Bedeutung des Akzeptierens, ohne im Deutschen eine zusätzliche Deutung zu erfordern.
- source_word: ἐν ταῖς εὐλογίαις
  choice: in seinen Segenssprüchen
  rationale: „Segenssprüche“ bezeichnet hier natürlicher als das abstrakte „Segen“ die ausgesprochenen väterlichen Segnungen.
- source_word: παρεῖδεν ἡμῖν
  choice: überging er uns
  rationale: Bewahrt den naheliegenden Sinn, dass der Vater Levi und die mit ihm Verbundenen bei seinen Segenssprüchen ausließ, ohne einen Grund hinzuzufügen.
theological_decisions:
- issue: Bezug und Wertung von Beschneidung und Tod
  choice: Der Satz stellt lediglich fest, dass die Betroffenen die Beschneidung angenommen hatten und danach gestorben waren.
  alternative: Die Beschneidung ausdrücklich als Ursache ihres Todes oder als unaufrichtige Handlung darstellen.
  rationale: Der griechische Text verbindet beide Ereignisse mit καί, legt aber weder ausdrücklich Kausalität noch eine innere Haltung der Betroffenen fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung nach dem ersten Satzglied verbessert die Lesbarkeit, ohne den Gedankengang zu verändern; das Semikolon hält Betrübnis und das Übergehen in den Segenssprüchen eng zusammen.
