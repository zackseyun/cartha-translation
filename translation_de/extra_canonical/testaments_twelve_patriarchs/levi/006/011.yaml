  text: But the wrath of God came upon them fully.
translation:
  language: de
  text: Doch Gottes Zorn kam in vollem Maß über sie.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „endgültig“ oder „bis zum Ende“.'
    reason: εἰς τέλος kann vollständiges Eintreffen ausdrücken, aber je nach Kontext auch eine endgültige oder bis zum Ende reichende Nuance haben.
lexical_decisions:
- source_word: Ἔφθασε … αὐτούς
  choice: traf sie
  rationale: Das Verb φθάνω mit Akkusativ bezeichnet hier, dass Gottes Zorn sie erreichte beziehungsweise über sie kam; „traf sie“ ist natürliches, würdevolles Deutsch.
- source_word: ἡ ὀργὴ τοῦ θεοῦ
  choice: der Zorn Gottes
  rationale: Die genitivische Fügung wird formal und theologisch offen wiedergegeben.
- source_word: εἰς τέλος
  choice: bis zum Äußersten
  rationale: Die Wendung bezeichnet hier das volle, endgültige Ausmaß; die Übersetzung bewahrt sowohl den Intensitäts- als auch den Endgültigkeitsaspekt.
theological_decisions:
- issue: Bedeutung von εἰς τέλος für das göttliche Gericht
  choice: bis zum Äußersten
  alternative: voll und ganz; endgültig
  rationale: Der griechische Ausdruck kann vollständiges Ausmaß oder ein endgültiges Ende hervorheben. Die gewählte Formulierung lässt diese Spannung bestehen, ohne eine bestimmte Lehre über Dauer oder Unwiderruflichkeit festzuschreiben.
translation_notes:
  register: Modernes, knappes und würdevolles Standarddeutsch. „Doch“ gibt δέ als fortführenden Gegensatz wieder; die Satzstellung bleibt natürlich und nahe am Griechischen.
