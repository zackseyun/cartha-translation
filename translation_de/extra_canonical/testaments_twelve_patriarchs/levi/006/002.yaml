- source_word: τοὺς λόγους τούτους
  choice: diese Worte
  rationale: Die direkte und idiomatische Entsprechung wahrt den Bezug auf das zuvor Gesagte.
- source_word: ἐν τῇ καρδίᾳ μου
  choice: in meinem Herzen
  rationale: Die bildhafte Rede vom Herzen als Ort des Erinnerns und Nachdenkens wird im Deutschen beibehalten.
