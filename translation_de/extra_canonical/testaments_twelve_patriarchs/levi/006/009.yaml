id: T12P.LEV.6.9
reference: Testament of Levi 6:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ⁴⁴ ἐδίωξαν Ἀβραὰμ τὸν πατέρα ἡμῶν ξένον ὄντα⁴⁵ καὶ κατεπόνησαν⁴⁶ τὰ ποίμνια⁴⁷ ὀγκούμενα⁴⁸ ὄντα⁴⁹, καὶ Ἐβλαὴν⁵⁰ τὸν οἰκογενῆ⁵¹ αὐτοῦ⁵² σφόδρα⁵³ ἠκίσαντο⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/009.yaml
  text: And they pursued Abraham our father while he was a stranger, and they oppressed his flocks while they were increasing, and they cruelly mistreated Eblan, his home-born servant.
translation:
  language: de
  text: Und sie verfolgten Abraham, unseren Vater, als er ein Fremder war, bedrängten seine Herden, als sie sich vermehrten, und misshandelten Eblan, seinen im Haus geborenen Diener, aufs Äußerste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδίωξαν
  choice: verfolgten
  rationale: Gibt die feindselige Bedeutung von διώκω unmittelbar und natürlich wieder.
- source_word: ξένον ὄντα
  choice: als er ein Fremder war
  rationale: Bewahrt Abrahams Stellung als Fremder, ohne sie als bloß vorübergehenden Besuch abzuschwächen.
- source_word: κατεπόνησαν
  choice: bedrängten
  rationale: Drückt schwere Bedrückung bzw. Schädigung aus und passt idiomatisch zu Herden.
- source_word: τὰ ποίμνια ὀγκούμενα ὄντα
  choice: seine Herden, als sie sich vermehrten
  rationale: ὀγκόω bezeichnet hier wahrscheinlich das Anwachsen; die Formulierung bewahrt den begleitenden zeitlichen Umstand ohne das im Deutschen missverständliche Bild des Anschwellens.
- source_word: Ἐβλαὴν
  choice: Eblan
  rationale: Der Eigenname wird entsprechend der griechischen Textform transliteriert.
- source_word: τὸν οἰκογενῆ αὐτοῦ
  choice: seinen im Haus geborenen Diener
  rationale: οἰκογενής bedeutet wörtlich „im Haus geboren“; „Diener“ macht die hier vorausgesetzte Hauszugehörigkeit verständlich, ohne modernere Rechtskategorien aufzudrängen.
- source_word: σφόδρα ἠκίσαντο
  choice: misshandelten … aufs Äußerste
  rationale: ἀικίζομαι bezeichnet schändliche bzw. grausame Misshandlung; σφόδρα verstärkt diese Aussage deutlich.
theological_decisions: []
