source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καίγε οὕτως⁵⁵ ἐποίουν *πᾶσι τοῖς ξένοις⁵⁶, *ἐν δυναστείᾳ ἁρπάζοντες⁵⁷ *τὰς ξένας⁵⁸ καὶ †ἐξενηλάτουν⁵⁹ αὐτάς⁶⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/010.yaml
  text: And indeed in this way they used to act toward all strangers, seizing the foreign women by force and driving them away.
translation:
  language: de
  text: 'Und tatsächlich verfuhren sie mit allen Fremden so: Mit Gewalt ergriffen sie die fremden Frauen und trieben sie fort.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Lesart hinter „trieben sie fort“ ist textkritisch unsicher.
    reason: Das Kreuzzeichen in der Edition kennzeichnet ἐξενηλάτουν als problematische beziehungsweise unsichere Lesart; dies sollte transparent gemacht werden, ohne den Haupttext unnötig zu belasten.
lexical_decisions:
- source_word: Καίγε οὕτως
  choice: Und tatsächlich … so
  rationale: Gibt die bekräftigende Verbindung καίγε und das rückverweisende οὕτως in natürlichem modernem Deutsch wieder.
- source_word: ἐποίουν πᾶσι τοῖς ξένοις
  choice: verfuhren sie mit allen Fremden
  rationale: Das imperfektive ἐποίουν bezeichnet ein wiederholtes Vorgehen; „mit allen Fremden verfahren“ ist idiomatisch und bewahrt den umfassenden Bezug.
- source_word: ἐν δυναστείᾳ ἁρπάζοντες
  choice: Mit Gewalt ergriffen sie
  rationale: ἐν δυναστείᾳ bezeichnet gewaltsame Machtausübung; ἁρπάζω wird hier als gewaltsames Ergreifen wiedergegeben, ohne über den griechischen Wortlaut hinaus eine spezifische Form der Verschleppung festzulegen.
- source_word: τὰς ξένας
  choice: die fremden Frauen
  rationale: Die feminine Form bezeichnet ausdrücklich weibliche Fremde beziehungsweise auswärtige Frauen; die Wiedergabe vermeidet das besitzanzeigende und im Griechischen nicht ausgedrückte „ihre Frauen“.
- source_word: ἐξενηλάτουν αὐτάς
  choice: trieben sie fort
  rationale: Gibt das Vertreiben oder Fortjagen und den femininen Rückbezug von αὐτάς auf die Frauen wieder.
theological_decisions: []
