  text: And I killed Shechem first, and Simeon killed Emmor.
translation:
  language: de
  text: Und ich tötete als Ersten Sichem, und Simeon tötete Hamor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεῖλον
  choice: tötete
  rationale: Das Verb bezeichnet hier ein gewaltsames Töten; „tötete“ gibt den Sinn klar und ohne unnötige Ausschmückung wieder.
- source_word: τὸν Συχὲμ
  choice: Sichem
  rationale: Der Personenname wird in seiner gebräuchlichen deutschen biblischen Form wiedergegeben.
- source_word: ἐν πρώτοις
  choice: als Ersten
  rationale: 'Im Zusammenhang der beiden getöteten Personen liegt eine zeitliche beziehungsweise rangfolgende Aussage nahe: Sichem wurde zuerst getötet. Die Formulierung bewahrt den Bezug auf Sichem als Person.'
- source_word: Συμεὼν
  choice: Simeon
  rationale: Gebräuchliche deutsche Form des biblischen Personennamens.
- source_word: τὸν Ἐμμώρ
  choice: Hamor
  rationale: Für den Vater Sichems wird die im deutschen Alten Testament übliche Namensform „Hamor“ verwendet; das griechische Ἐμμώρ entspricht dieser Gestalt.
theological_decisions: []
translation_notes:
  register: Kurzer, direkter Erzählsatz in modernem, würdigem Standarddeutsch. Die parallele Satzstruktur des Griechischen bleibt erhalten; zur natürlichen deutschen Verständlichkeit wird das im zweiten Teilsatz elliptische Verb wiederholt.
