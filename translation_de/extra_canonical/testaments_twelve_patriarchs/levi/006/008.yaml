id: T12P.LEV.6.8
reference: Testament of Levi 6:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Ἀλλ᾿ ἐγὼ εἶδον ὅτι ἀπόφασις θεοῦ ἦν εἰς κακὰ³⁸ διότι ἤθελον ἐποίησεν *καὶ τὴν Σαρρὰ³⁹ ⌈καὶ τὴν Ῥεβέκκα⌉⁴⁰ ποιῆσαι ⌈ὃν τρόπον ἐποίησαν *τὴν Δείναν⁴¹ *τὴν ἀδελφὴν ἡμῶν⁴²⌉, καὶ ὁ⁴³ Κύριος ἐκώλυσεν αὐτούς.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006/008.yaml
  text: But I saw that it was a decree of God for evil against them, because they intended to do to Sarah and Rebekah as they had done to Dinah our sister; and the Lord restrained them.
translation:
  language: de
  text: Doch ich erkannte, dass Gottes Urteil zu ihrem Unheil bestimmt war, weil sie Sara und Rebekka antun wollten, was sie unserer Schwester Dina angetan hatten; der Herr aber hinderte sie daran.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπόφασις θεοῦ
  choice: Gottes Urteil
  rationale: ἀπόφασις bezeichnet hier einen göttlichen Entscheid oder Urteilsspruch; „Urteil“ ist natürlich und bewahrt den gerichtlichen Sinn.
- source_word: εἰς κακά
  choice: zu ihrem Unheil
  rationale: Die Wendung bezeichnet die schlimme Folge für die zuvor gemeinten Täter. Das Pronomen macht den im Griechischen kontextuell erschlossenen Bezug im Deutschen verständlich.
- source_word: ἤθελον
  choice: sie … wollten
  rationale: Gibt die Absicht der Täter wieder, ohne zu behaupten, dass sie diese Absicht tatsächlich ausführten.
- source_word: ἐκώλυσεν αὐτούς
  choice: hinderte sie daran
  rationale: Bewahrt die Aussage, dass der Herr die beabsichtigte Tat verhinderte.
theological_decisions:
- issue: Verhältnis von göttlichem Urteil und menschlicher Absicht
  choice: Gottes Urteil wird als auf ihr Unheil gerichtet wiedergegeben, während die böse Tat als ihre eigene Absicht erscheint.
  alternative: „Es war ein Beschluss Gottes zum Bösen“
  rationale: Die gewählte Fassung vermeidet die missverständliche Aussage, Gott habe das beabsichtigte Böse verursacht, ohne die Spannung zwischen göttlichem Gericht und menschlichem Vorhaben aufzulösen.
- issue: Zeitliche Einordnung des göttlichen Urteils
  choice: „bestimmt war“
  alternative: „ergangen war“
  rationale: Das Imperfekt ἦν beschreibt einen bestehenden Sachverhalt. „Bestimmt war“ wahrt dies, ohne einen im Text nicht ausdrücklich bezeichneten Zeitpunkt des Urteilsspruchs einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau folgt dem griechischen Gedankengang, wird aber für heutige Leser geglättet; „Doch“ und „aber“ bewahren den doppelten Gegensatz des Ausgangstextes.
