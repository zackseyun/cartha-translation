  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/003.yaml
  text: 'Listen, then, concerning the heavens that were shown to you. The lowest is dark for this reason: because it sees all the unrighteous deeds of men. And it has fire, snow, and ice prepared for the day determined by God, as a righteous judgment of God upon men. In it are all the spirits of the punishments for vengeance on the lawless. Above this is the holy place, and in it are the hosts of the armies appointed for the day of judgment, to carry out vengeance on the spirits of deceit and of Beliar[b]. Above them are the holy ones. In the highest of all dwells the Great Glory, far above all holiness. In the heaven next to it are the archangels, who minister and make propitiation[a] to the Lord for all the sins committed in ignorance by the righteous, offering to the Lord a sweet-smelling fragrance, a reasonable and bloodless offering[c]. And in the heaven below this are the angels who bear answers to the angels of the presence of the Lord. But in the heaven next below are thrones and
    dominions, in which hymns are continually offered to God. Therefore, when the Lord looks upon us through the degree of his holiness, the heavens are shaken. And the earth also is moved from its foundations, and, trembling, it is shaken to its depths. But the sons of men, having no understanding of these things, go astray and provoke him to anger.'
translation:
  language: de
  text: 'Testament Levis 3


    1 Höre nun, was die Himmel betrifft, die dir gezeigt wurden: Der unterste erscheint dir deshalb düster, weil er alle Ungerechtigkeiten der Menschen sieht. 2 Er enthält Feuer, Schnee und Kristall[a], die für den Tag des Gerichts, wenn Gott gerecht richtet, bereitgehalten werden. Denn in ihm befinden sich alle Geister der Heimsuchungen[b], die zur Vergeltung an den Menschen dienen. 3 Im zweiten Himmel befinden sich die Heeresmächte, die für den Tag des Gerichts dazu bestimmt sind, Vergeltung an den Geistern der Verführung und an Beliar[c] zu üben. Über ihnen aber sind die Heiligen.


    4 In der höchsten Wohnstätte von allen ist die große Herrlichkeit, erhaben über alle Heiligkeit. 5 In dem Himmel, der sich daran anschließt[d], befinden sich die Erzengel. Sie verrichten heiligen Dienst und erwirken beim Herrn Sühne[e] für alle aus Unwissenheit begangenen Sünden der Gerechten. 6 Sie bringen dem Herrn einen wohlriechenden Duft dar, ein vernünftiges[f] und unblutiges Opfer. 7 In dem Himmel darunter befinden sich Engel, die den Engeln vor dem Angesicht des Herrn die Antworten überbringen. 8 In dem Himmel, der sich an sie anschließt[g], befinden sich Throne und Gewalten; dort werden Gott unablässig Loblieder dargebracht.


    9 Wenn nun der Herr auf uns blickt, erzittern wir alle; auch der Himmel, die Erde und der Abgrund werden vor seiner Majestät erschüttert. 10 Doch die Menschen nehmen dies alles nicht wahr, sündigen und reizen den Höchsten zum Zorn.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Eis«. Das griechische Wort bezeichnet Kristall und kann wegen dessen eisartiger Erscheinung auch Eis meinen.'
    reason: lexical_alternative
  - marker: b
    text: 'Gemeint sind wohl auferlegte Plagen oder Strafgerichte; möglich ist daher auch: »Geister der Strafgerichte«.'
    reason: lexical_alternative
  - marker: c
    text: »Beliar« entspricht der griechischen Namensform; in anderen Überlieferungen ist auch »Belial« gebräuchlich.
    reason: lexical_alternative
  - marker: d
    text: 'Der griechische Wortlaut ist an dieser Stelle textlich unsicher. Wörtlich steht etwa: »in dem nach ihnen«. Gemeint ist offenbar eine weitere Stufe der Himmel, doch ihre genaue Zuordnung bleibt unklar.'
    reason: textual_uncertainty
  - marker: e
    text: 'Oder: »leisten beim Herrn Sühne«. Das griechische Verb bezeichnet im kultischen Zusammenhang Sühne beziehungsweise Versöhnung; die genaue deutsche Konstruktion ist nicht eindeutig.'
    reason: lexical_alternative
  - marker: f
    text: Das griechische Wort kann auch »geistig« oder »geistlich« verstanden werden. Die wörtlichere Wiedergabe »vernünftig« lässt diese Deutung offen.
    reason: lexical_alternative
  - marker: g
    text: Auch hier ist der griechische Wortlaut textlich unsicher und die genaue Stellung dieses Himmels innerhalb der beschriebenen Folge nicht eindeutig.
    reason: textual_uncertainty
lexical_decisions:
- source_word: στυγνός
  choice: düster
  rationale: Gibt die unheilvolle Erscheinung des untersten Himmels wieder, ohne das Wort als emotionale Feindseligkeit zu deuten.
- source_word: ἀδικίας
  choice: Ungerechtigkeiten
  rationale: Bewahrt sowohl den moralischen als auch den konkreten Charakter der menschlichen Verfehlungen.
- source_word: κρύσταλλον
  choice: Kristall
  rationale: Entspricht der unmittelbaren lexikalischen Bedeutung; im Zusammenhang mit Schnee und Gerichtsmitteln ist auch Eis denkbar und wird in der Fußnote genannt.
- source_word: πνεύματα τῶν ἐπαγωγῶν
  choice: Geister der Heimsuchungen
  rationale: ἐπαγωγή kann hier auferlegte Plagen oder Strafgerichte bezeichnen; »Heimsuchungen« erhält die apokalyptische und gerichtliche Weite.
- source_word: ἐκδίκησις
  choice: Vergeltung
  rationale: Bewahrt den starken gerichtlichen Sinn, klingt im Deutschen jedoch weniger nach privater Rache als »Rache«.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Gibt die Namensform des griechischen Zeugen wieder, statt sie an die geläufigere Form »Belial« anzugleichen.
- source_word: ἡ μεγάλη δόξα
  choice: die große Herrlichkeit
  rationale: Erhält die ehrfürchtige Umschreibung der göttlichen Gegenwart als Titel, ohne sie ausdrücklich durch »Gott« zu ersetzen.
- source_word: λειτουργοῦντες
  choice: heiligen Dienst verrichten
  rationale: Macht den kultischen Dienstcharakter deutlich und bleibt zugleich in modernem Deutsch verständlich.
- source_word: ἐξιλασκόμενοι πρὸς Κύριον
  choice: beim Herrn Sühne erwirken
  rationale: Bewahrt die kultisch-sühnende Aussage und vermeidet die unnatürliche Vorstellung, der Herr selbst sei das Objekt einer entsühnenden Handlung.
- source_word: ἀγνοίαις
  choice: aus Unwissenheit begangene Sünden
  rationale: Der Kontext ist kultisch; die Wiedergabe macht deutlich, dass unbeabsichtigte oder unwissentlich begangene Verfehlungen gemeint sind.
- source_word: ὀσμὴν εὐωδίας
  choice: einen wohlriechenden Duft
  rationale: Bewahrt die aus der Opfersprache bekannte Wendung in natürlichem, gehobenem Deutsch.
- source_word: λογικὴν
  choice: vernünftiges
  rationale: Gibt die Grundbedeutung formal wieder und lässt die mögliche Deutung als geistiges beziehungsweise geistliches Opfer offen.
- source_word: ἄγγελοι τοῦ προσώπου κυρίου
  choice: Engel vor dem Angesicht des Herrn
  rationale: Erhält die wörtliche und traditionsreiche Gegenwartsformel, ohne sie zu einer bloßen Amtsbezeichnung zu verflachen.
- source_word: ἀναισθητοῦντες
  choice: nehmen ... nicht wahr
  rationale: Drückt den Mangel an Wahrnehmung oder Einsicht idiomatisch aus, ohne zusätzlich vorsätzliche Verstockung einzutragen.
theological_decisions:
- issue: Himmlischer Sühnedienst der Erzengel
  choice: Die Erzengel »verrichten heiligen Dienst und erwirken beim Herrn Sühne« für unwissentlich begangene Sünden der Gerechten.
  alternative: »leisten beim Herrn Abbitte« oder eine Abschwächung zu allgemeiner Fürbitte
  rationale: Die Verbindung von ἐξιλάσκομαι mit Opfer, Wohlgeruch und unblutiger Darbringung ist ausdrücklich kultisch. Diese Spannung wird nicht zu bloßer Fürbitte abgeschwächt.
- issue: Die große Herrlichkeit als göttliche Umschreibung
  choice: »die große Herrlichkeit«
  alternative: »Gott« oder »die majestätische Herrlichkeit«
  rationale: Die titulare Umschreibung wird bewahrt; so bleibt offen, wie unmittelbar sie mit Gott selbst beziehungsweise seiner Gegenwart gleichzusetzen ist.
- issue: Gericht über die Geister der Verführung und Beliar
  choice: Die himmlischen Mächte üben Vergeltung an den Geistern der Verführung und an Beliar.
  alternative: Beliar als Oberbegriff zu den Geistern zu ziehen oder »Belial« zu schreiben
  rationale: Die grammatische Reihung und die griechische Namensform werden transparent wiedergegeben, ohne die dämonologische Aussage weiter zu systematisieren.
- issue: Erschütterung der kosmischen Bereiche vor Gottes Gegenwart
  choice: Himmel, Erde und Abgrund werden vor seiner majestätischen Gegenwart erschüttert.
  alternative: Eine längere Fassung, nach der nur die Himmel erschüttert und die Erde aus ihren Grundfesten bewegt wird
  rationale: Die vorgelegte griechische Fassung nennt alle drei Bereiche gemeinsam und verbindet sie mit ἀπὸ προσώπου τῆς μεγαλωσύνης αὐτοῦ. Die Übersetzung folgt diesem Wortlaut statt der erweiterten englischen Konsultationsfassung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer apokalyptischer und kultischer Begrifflichkeit. Elliptische griechische Sätze wurden behutsam ergänzt. Die mehrfach gestörte Beschreibung der Himmel wurde nicht nach der englischen Konsultationsfassung harmonisiert; Unsicherheiten der räumlichen Abfolge sind in den Fußnoten kenntlich gemacht.
