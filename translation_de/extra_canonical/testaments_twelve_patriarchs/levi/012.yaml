  text: 1. And Gersam took a wife, and by her he fathered Lomne and Semee. 2. And the sons of Kaath were Ambram, Isachar, Chebron, and Ozeel. 3. And the sons of Merari were Mooli and Mouses. 4. And in the sixty-fourth year of my life, Ambram took Jochebed my daughter as a wife for himself, because he and my daughter were born on one and the same day. 5. I was eight years old when I entered the land of Canaan, and eighteen years old when I killed Shechem, and nineteen years old when I served as priest, and twenty-eight years old when I took a wife, and forty-eight years old when I entered Egypt. 6. And behold, my children, you are the third generation. 7. Joseph died in the one hundred eighteenth year of my life.
translation:
  language: de
  text: '**Testament Levis 12**


    1 Gersam nahm sich eine Frau und zeugte mit ihr Lomne und Semee. 2 Die Söhne Kaaths waren Abraham, Isachar, Chebron und Ozeel.[a] 3 Die Söhne Merareis waren Mooli und Moses.[b] 4 In meinem vierundneunzigsten Lebensjahr nahm Abraham meine Tochter Jochebed für sich zur Frau, denn er und meine Tochter waren am selben Tag geboren worden.[c] 5 Ich war acht Jahre alt, als ich in das Land Kanaan einzog, achtzehn, als ich Sichem tötete, neunzehn, als ich priesterlichen Dienst versah,[d] achtundzwanzig, als ich mir eine Frau nahm, und achtundvierzig, als ich nach Ägypten einzog. 6 Seht, meine Kinder, ihr seid die dritte Generation. 7 Josef starb in meinem hundertachtzehnten Lebensjahr.


    **Fußnoten**


    [a] Die Namen werden in den vom griechischen Text überlieferten Formen wiedergegeben und nicht stillschweigend an vertrautere biblische Schreibweisen angeglichen. Der griechische Text nennt hier ausdrücklich „Abraham“; andere Überlieferungen dieser Genealogie nennen Amram.


    [b] Die griechischen Namensformen entsprechen möglicherweise der aus biblischen Genealogien bekannten Linie Meraris, weichen aber von deren vertrauten Namensformen ab.


    [c] Der griechische Text hat „vierundneunzigsten“ und bezeichnet Jochebed ausdrücklich als Levis Tochter. Beides erzeugt Spannungen zu anderen chronologischen und genealogischen Überlieferungen; die Übersetzung gibt den vorliegenden griechischen Wortlaut wieder.


    [d] Wörtlich: „als ich priesterlich diente“. Das griechische Verb bezeichnet die Ausübung priesterlichen Dienstes.'
