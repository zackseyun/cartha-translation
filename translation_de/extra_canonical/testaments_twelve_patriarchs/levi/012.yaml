lexical_decisions:
- source_word: ἔλαβεν ... γυναῖκα
  choice: nahm sich eine Frau
  rationale: Die übliche Heiratsformel bleibt in ihrer genealogisch-feierlichen Färbung erkennbar und ist zugleich in modernem Deutsch verständlich.
- source_word: ἔτεκεν ... ἐξ αὐτῆς
  choice: zeugte mit ihr
  rationale: Obwohl ἔτεκεν gewöhnlich das Gebären bezeichnet, legt der männliche Satzgegenstand zusammen mit ἐξ αὐτῆς hier eine Zeugungsaussage nahe. Die Übersetzung bewahrt diese grammatische Perspektive, ohne das Geschlecht des Subjekts zu verändern.
- source_word: υἱοί
  choice: Söhne
  rationale: Der Ausdruck bezeichnet in der genealogischen Aufzählung ausdrücklich männliche Nachkommen.
- source_word: θυγατέρα μου
  choice: meine Tochter
  rationale: Die direkte Verwandtschaftsbezeichnung wird nicht zu „Nachfahrin“ abgeschwächt und damit nicht harmonisiert.
- source_word: ἐν μιᾷ ἡμέρᾳ ἐγεννήθησαν
  choice: waren am selben Tag geboren worden
  rationale: Die Wendung bezeichnet denselben Geburtstag; die deutsche Formulierung gibt dies klar und idiomatisch wieder.
- source_word: ἱεράτευσα
  choice: tat ich Priesterdienst
  rationale: Das Verb bezeichnet die aktive Ausübung priesterlicher Aufgaben. Die Formulierung ist würdig und vermeidet die stärkere Aussage einer dauerhaften Amtsbezeichnung.
- source_word: ἰδού
  choice: Seht
  rationale: Der feierliche Aufmerksamkeitsruf wird in verständlichem, gehobenem Gegenwartsdeutsch wiedergegeben.
- source_word: τέκνα μου
  choice: meine Kinder
  rationale: Das griechische Wort ist weiter gefasst als „Söhne“ und wird deshalb nicht unnötig verengt.
- source_word: τρίτη γενεά
  choice: die dritte Generation
  rationale: Die bestimmte Form bezeichnet die Stellung der Angeredeten in der Generationenfolge.
theological_decisions:
- issue: Von vertrauten biblischen Genealogien abweichende Namen
  choice: Die griechischen Namensformen werden weitgehend beibehalten; Ἀβραάμ wird als „Abraham“ und Μωυσής als „Moses“ wiedergegeben.
  alternative: Die gesamte Liste an bekannte hebräische beziehungsweise bibeldeutsche Formen wie Gerschon, Kehat, Amram, Jizhar, Hebron, Usïel, Machli und Muschi angleichen.
  rationale: Die Übersetzung folgt dem tatsächlich vorliegenden griechischen Zeugen und harmonisiert genealogische Unterschiede nicht. Wo der griechische Text selbst die gewöhnliche griechische Form eines bekannten Namens bietet, wird dessen etablierte deutsche Form verwendet.
- issue: Jochebed als Levis Tochter
  choice: Die Aussage „meine Tochter Jochebed“ wird direkt übersetzt und in einer Fußnote als genealogische Spannung kenntlich gemacht.
  alternative: „Tochter“ als „Nachfahrin“ paraphrasieren oder den Satz nach Exodus-Genealogien emendieren.
  rationale: Der Wortlaut θυγατέρα μου ist eindeutig. Eine Harmonisierung würde eine im Text vorhandene Spannung verdecken.
- issue: Levis Alter bei Abrahams Heirat
  choice: ἐνενηκοστῷ τετάρτῳ wird als „im vierundneunzigsten Lebensjahr“ übersetzt.
  alternative: Nach der englischen Konsultationsschicht „im vierundsechzigsten Lebensjahr“ schreiben.
  rationale: Der bereitgestellte griechische Ausgangstext lautet ausdrücklich „vierundneunzigsten“. Die Originalsprachengrundlage hat Vorrang vor der englischen Konsultationsfassung.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, testamentarisch-genealogischem Ton. Kurze parataktische Sätze und wiederholte Altersangaben spiegeln die Struktur des griechischen Textes. Archaismen wie „siehe“ wurden zugunsten des feierlichen, aber heutigen „Seht“ vermieden.
