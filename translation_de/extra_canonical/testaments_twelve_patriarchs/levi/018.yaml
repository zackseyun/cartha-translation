- from: '**Das Testament Levis 18**


    **1** Nachdem die Vergeltung des Herrn über sie gekommen ist, wird das Priestertum aufhören. **2** Dann wird der Herr einen neuen Priester erwecken. Ihm werden alle Worte des Herrn offenbart werden, und er wird viele Tage lang auf der Erde ein Urteil der Wahrheit vollstrecken. **3** Sein Stern wird am Himmel aufgehen wie der Stern eines Königs. Er wird das Licht der Erkenntnis leuchten lassen wie die Sonne am Tag,[a] und auf der bewohnten Erde wird er groß sein. **4** Er wird auf der Erde hervorstrahlen wie die Sonne, alle Finsternis unter dem Himmel vertreiben, und auf der ganzen Erde wird Frieden sein.


    **5** In seinen Tagen werden die Himmel jubeln, die Erde wird sich freuen und die Wolken werden frohlocken.[b] Auch die Engel der Herrlichkeit des Angesichts des Herrn werden sich über ihn freuen. **6** Die Himmel werden sich öffnen, und aus dem Tempel der Herrlichkeit wird Heiligung auf ihn herabkommen, begleitet von einer väterlichen Stimme, wie von Abraham an Isaak. **7** Die Herrlichkeit des Höchsten wird über ihm ausgerufen werden, und ein Geist der Einsicht und der Heiligung wird auf ihm ruhen.[c]


    **8** Denn er wird seinen Söhnen die Hoheit des Herrn in Wahrheit geben, für immer. Es wird keinen Nachfolger für ihn geben, von Generation zu Generation und bis in Ewigkeit. **9** Unter seinem Priestertum werden die Völker auf der Erde an Erkenntnis zunehmen und durch die Gnade des Herrn erleuchtet werden.[d] Unter seinem Priestertum wird die Sünde aufhören, und die Gesetzlosen werden vom Bösen ablassen.[e]


    **10** Ja, er wird die Tore des Paradieses öffnen und das Schwert entfernen, das Adam bedroht.[f] **11** Er wird den Heiligen vom Baum des Lebens zu essen geben, und ein Geist der Heiligkeit wird auf ihnen sein. **12** Beliar wird von ihm gebunden werden, und er wird seinen Kindern Vollmacht geben, die bösen Geister niederzutreten. **13** Der Herr wird sich über seine Kinder freuen und für immer Gefallen an seinen Geliebten haben. **14** Dann werden Abraham, Isaak und Jakob jubeln; auch ich werde mich freuen, und alle Heiligen werden sich mit Gerechtigkeit bekleiden.


    **Fußnoten**


    [a] Der griechische Wortlaut am Ende des Satzes ist unsicher; wörtlich steht dort ungefähr: »in der Sonne, Tag«. Die Übersetzung gibt den wahrscheinlichen Sinn wieder.


    [b] Einige Textzeugen fügen hier hinzu: »Und die Erkenntnis des Herrn wird über die Erde ausgegossen werden wie das Wasser der Meere.«


    [c] Einige Textzeugen fügen hinzu: »im Wasser«.


    [d] Einige Textzeugen fügen hinzu: »Israel aber wird durch Unwissenheit abnehmen und in Trauer verfinstert werden.«


    [e] Einige Textzeugen fügen hinzu: »Die Gerechten aber werden in ihm Ruhe finden.«


    [f] Gemeint ist das Schwert, das nach Adams Vertreibung aus Eden den Weg zum Baum des Lebens bewachte; siehe 1. Mose 3,24.'
