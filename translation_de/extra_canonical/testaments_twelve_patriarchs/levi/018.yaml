  text: 1 And after their vengeance has come from the Lord[5], the priesthood will fail. 2 Then the Lord will raise up a new priest, to whom all the words of the Lord will be revealed; and he will execute a judgment of truth upon the earth for many days. 3 And his star will rise in heaven like a king, giving light with the light of knowledge like the sun by day, and he will be magnified in the inhabited world. 4 He will shine forth like the sun upon the earth, and he will remove all darkness from under heaven, and there will be peace in all the earth. 5 The heavens will rejoice in his days, and the earth will be glad, and the clouds will rejoice; and the angels of the glory of the Lord's presence will be glad in him. 6 The heavens will be opened, and from the temple of glory sanctification will come upon him with a fatherly voice, as from Abraham to Isaac. 7 And the glory of the Most High will be spoken over him, and a spirit of understanding and sanctification will rest upon him. 8 For
    he will give the majesty of the Lord to his sons in truth forever, and there will be no successor to him for generation upon generation, forever. 9 And during his priesthood the nations will be multiplied in knowledge upon the earth, and they will be enlightened by the grace of the Lord. During his priesthood sin will fail, and the lawless will cease from evil. 10 And indeed he will open the gates of paradise, and he will remove the threatening sword against Adam. 11 And he will give the holy ones to eat from the tree of life, and the spirit of holiness will be upon them. 12 And Beliar will be bound by him, and he will give authority to his children to trample on evil spirits. 13 And the Lord will rejoice over his children, and he will take pleasure in his beloved ones forever. 14 Then Abraham and Isaac and Jacob will exult, and I will be glad[10][9b][9a][7], and all the holy ones will put on righteousness.
translation:
  language: de
  text: '**Das Testament Levis 18**


    **1** Nachdem ihre Vergeltung vom Herrn gekommen ist, wird das Priestertum aufhören. **2** Dann wird der Herr einen neuen Priester erwecken. Ihm werden alle Worte des Herrn offenbart werden, und er wird viele Tage lang auf der Erde ein Urteil der Wahrheit vollstrecken. **3** Sein Stern wird am Himmel aufgehen wie ein König. Er wird ein Licht der Erkenntnis leuchten lassen wie die Sonne am Tag,[a] und auf der bewohnten Erde wird er groß sein. **4** Er wird auf der Erde hervorstrahlen wie die Sonne, alle Finsternis unter dem Himmel vertreiben, und auf der ganzen Erde wird Frieden sein.


    **5** In seinen Tagen werden die Himmel jubeln, die Erde wird sich freuen und die Wolken werden frohlocken.[b] Auch die Engel der Herrlichkeit des Angesichts des Herrn werden sich über ihn freuen. **6** Die Himmel werden sich öffnen, und aus dem Tempel der Herrlichkeit wird Heiligung mit einer väterlichen Stimme auf ihn kommen, wie von Abraham zu Isaak. **7** Die Herrlichkeit des Höchsten wird über ihm verkündet werden, und ein Geist der Einsicht und der Heiligung wird auf ihm ruhen.[c]


    **8** Denn er wird seinen Söhnen die Hoheit des Herrn in Wahrheit geben, für immer. Es wird keinen Nachfolger für ihn geben, von Generation zu Generation und bis in Ewigkeit. **9** Während seines Priestertums werden die Völker auf der Erde an Erkenntnis zunehmen und durch die Gnade des Herrn erleuchtet werden.[d] Während seines Priestertums wird die Sünde aufhören, und die Gesetzlosen werden vom Bösen ablassen.[e]


    **10** Ja, er wird die Tore des Paradieses öffnen und das drohende Schwert gegen Adam entfernen.[f] **11** Er wird den Heiligen vom Baum des Lebens zu essen geben, und ein Geist der Heiligkeit wird auf ihnen sein. **12** Beliar wird von ihm gebunden werden, und er wird seinen Kindern Vollmacht geben, die bösen Geister niederzutreten. **13** Der Herr wird sich über seine Kinder freuen und für immer Gefallen an seinen Geliebten haben. **14** Dann werden Abraham, Isaak und Jakob jubeln; auch ich werde mich freuen, und alle Heiligen werden sich mit Gerechtigkeit bekleiden.


    **Fußnoten**


    [a] Der griechische Wortlaut am Ende des Satzes ist unsicher; wörtlich steht dort ungefähr: »in der Sonne, Tag«. Die Übersetzung gibt den wahrscheinlichen Sinn wieder.


    [b] Einige Textzeugen fügen hier hinzu: »Und die Erkenntnis des Herrn wird über die Erde ausgegossen werden wie das Wasser der Meere.«


    [c] Einige Textzeugen fügen hinzu: »im Wasser«.


    [d] Einige Textzeugen fügen hinzu: »Israel aber wird durch Unwissenheit abnehmen und in Trauer verfinstert werden.«


    [e] Einige Textzeugen fügen hinzu: »Die Gerechten aber werden in ihm Ruhe finden.«


    [f] Gemeint ist das Schwert, das nach Adams Vertreibung aus Eden den Weg zum Baum des Lebens bewachte; siehe 1. Mose 3,24.'
