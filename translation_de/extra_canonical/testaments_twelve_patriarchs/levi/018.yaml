lexical_decisions:
- source_word: ἱερωσύνη
  choice: Priestertum
  rationale: Bezeichnet hier sowohl die priesterliche Ordnung als auch das Amt des angekündigten Priesters; »Priestertum« bewahrt das Leitmotiv des Kapitels.
- source_word: ἱερέα καινόν
  choice: einen neuen Priester
  rationale: Gibt die epochale Neuheit wieder, ohne die umstrittene Identität der Gestalt festzulegen.
- source_word: κρίσιν ἀληθείας
  choice: ein Urteil der Wahrheit
  rationale: Bewahrt die auffällige Genitivverbindung und ihren feierlich-prophetischen Klang.
- source_word: οἰκουμένη
  choice: bewohnte Erde
  rationale: Gibt die bewohnte Welt beziehungsweise Erde wieder und vermeidet eine kosmologische Überdehnung.
- source_word: ἀναλάμψει
  choice: hervorstrahlen
  rationale: Nimmt die durchgehende Stern-, Sonnen- und Lichtmetaphorik auf.
- source_word: ἁγίασμα
  choice: Heiligung
  rationale: Lässt offen, ob eine Weihehandlung, ein heiliger Zustand oder eine heilige Gabe gemeint ist.
- source_word: φωνῆς πατρικῆς
  choice: väterliche Stimme
  rationale: Bewahrt den familiären Charakter der Stimme und den anschließenden Vergleich mit Abraham und Isaak.
- source_word: πνεῦμα συνέσεως καὶ ἁγιασμοῦ
  choice: ein Geist der Einsicht und der Heiligung
  rationale: »Einsicht« gibt συνέσις idiomatisch wieder; die parallelen Genitive und die theologische Offenheit bleiben erhalten.
- source_word: μεγαλωσύνην
  choice: Hoheit
  rationale: Bezeichnet die erhabene Größe des Herrn in natürlichem, würdigem Deutsch.
- source_word: διαδοχή
  choice: Nachfolger
  rationale: Gibt im Kontext die ausbleibende Amtsnachfolge verständlich wieder, ohne die Gestalt ausdrücklich zu identifizieren.
- source_word: τὰ ἔθνη
  choice: die Völker
  rationale: Ist im jüdischen testamentarischen Kontext neutraler als »Heiden« und vermeidet eine spätere konfessionelle Festlegung.
- source_word: φωτισθήσονται
  choice: erleuchtet werden
  rationale: Bewahrt sowohl die Erkenntnisdimension als auch das beherrschende Lichtmotiv.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Der Eigenname der widergöttlichen Gestalt wird transliteriert und nicht interpretierend durch »Teufel« ersetzt.
theological_decisions:
- issue: Identität des neuen Priesters
  choice: Die Gestalt bleibt schlicht »ein neuer Priester«.
  alternative: Ausdrückliche Bezeichnung als Messias, Christus oder bestimmter Hohepriester
  rationale: Der Text zeichnet eine einzigartige eschatologische Priestergestalt, nennt ihre Identität aber nicht ausdrücklich. Die Übersetzung wahrt diese Spannung.
- issue: Textlich unsichere Erweiterungen in den Versen 5, 7 und 9
  choice: Aus dem Haupttext ausgelassen und in Fußnoten dokumentiert
  alternative: Aufnahme sämtlicher Erweiterungen in den Haupttext
  rationale: Die geklammerte Überlieferung ist unsicher; die Fußnoten machen sie sichtbar, ohne sie dem laufenden Text gleichzustellen.
- issue: πνεῦμα ἁγιωσύνης in Vers 11
  choice: ein Geist der Heiligkeit
  alternative: der Heilige Geist
  rationale: Der griechische Ausdruck kann theologisch gewichtig sein, ist aber nicht die eindeutige feste Titelform. Die unbestimmte Wiedergabe vermeidet eine nachträgliche dogmatische Präzisierung.
- issue: Aussage über fehlende Nachfolge in Vers 8
  choice: »Es wird keinen Nachfolger für ihn geben«
  alternative: »Seine Nachfolge wird nicht bestehen« oder eine erbliche Priesterdynastie
  rationale: Die singuläre Aussage bleibt erhalten, ohne zu erklären, wie sie sich zur Rede von Generationen und Ewigkeit verhält.
- issue: Pronomen »seine Söhne/Kinder«
  choice: Die Pronomen werden ohne erklärenden Bezugszusatz wiedergegeben.
  alternative: Explizite Zuordnung zu Gott, dem Priester oder Israel
  rationale: Der jeweilige Bezug ist im griechischen Text nicht überall zweifelsfrei; eine erklärende Festlegung würde die vorhandene Mehrdeutigkeit beseitigen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, prophetischem Ton. Kurze bis mittellange Sätze erleichtern die Verständlichkeit, während zentrale testamentarische Formulierungen wie »Urteil der Wahrheit«, »Tempel der Herrlichkeit« und »Geist der Heiligkeit« bewusst erhalten bleiben. Umstrittene Identifikationen und textlich unsichere Zusätze werden nicht stillschweigend harmonisiert.
