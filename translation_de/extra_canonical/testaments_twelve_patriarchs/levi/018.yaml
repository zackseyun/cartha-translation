  rationale: Die Revision korrigiert eine semantische Erweiterung in Vers 3, strafft Vers 6 auf die griechische Konstruktion und verbessert die idiomatische Wiedergabe der Zeitangabe in Vers 9. Die schwierige und in der Edition obelisierte Schlusswendung von Vers 3 bleibt als vorsichtige Sinnwiedergabe mit Fußnote markiert. Die umstrittenen Zusätze in Versen 5, 7 und 9 bleiben ausschließlich in den Fußnoten; weder die Identität des neuen Priesters noch der Bezug der Pronomen wird dogmatisch festgelegt.
