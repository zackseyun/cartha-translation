review_pass:
  verdict: revise
  source_fidelity: 'Eine sichere Korrektur ist in Vers 1 nötig: Die deutsche Hauptfassung „zur Strafe“ gibt die in der englischen Auditspur als „greater punishment“ verstandene Steigerung nicht wieder. Die Fußnote weist zwar auf diese Lesart hin, kann den Verlust im Haupttext aber nicht ausgleichen. Die übrigen textkritisch eingeklammerten Partien werden angemessen als unsicher markiert und nicht dogmatisch bestimmt.'
  naturalness: Der Text ist insgesamt würdig und gut verständlich. „Dienstbeauftragten vor seinem Angesicht“ klingt jedoch im modernen Deutschen verwaltungssprachlich und bildet die kultisch-dienstliche Funktion von λειτουργός weniger natürlich ab. „Amtsträger vor seinem Angesicht“ ist knapper und registergerechter.
  terminology: „Totenreich“, „Erkenntnis“, „Nachkommen“, „heimsucht“ und „ihn“ bewahren wesentliche Bedeutungs- bzw. Bezugsoffenheiten. Die eingeklammerte Lesung „Sohnes“ und der vollständig eingeklammerte Zusatz bleiben transparent als textkritisch unsicher ausgewiesen.
  issues:
  - severity: medium
    issue: Vers 1 lässt die Steigerung der Strafe im Haupttext aus.
    rationale: Die englische Auditfassung übersetzt „with a greater punishment“; auch die vorhandene Fußnote nennt diese Auslegung. „zur Strafe“ ist nicht äquivalent und sollte zu „mit schwererer Strafe“ korrigiert werden.
  - severity: low
    issue: „Dienstbeauftragten“ ist für λειτουργόν stilistisch zu administrativ.
    rationale: Die Wendung kann im heutigen Deutsch eine moderne behördliche Beauftragung nahelegen. „Amtsträger vor seinem Angesicht“ bewahrt die besondere Dienstfunktion ohne diesen Beiklang.
