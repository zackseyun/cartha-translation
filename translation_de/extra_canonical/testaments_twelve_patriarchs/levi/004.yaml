base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004.yaml
  text: '1. Now therefore know that the Lord will execute judgment upon the sons of men. For when rocks are being split, and the sun is being extinguished, and waters are drying up, and fire is cowering, and all creation is being shaken, and the invisible spirits are melting away, and Hades is being plundered at the suffering of the Most High, men will persist in disobedience and remain in their injustices. Therefore they will be judged with a greater punishment.


    2. Therefore the Most High has heard your prayer, to separate you from unrighteousness and for you to become to him a son and a servant and a minister of his presence.


    3. You shall shine forth the light of knowledge in Jacob, and you shall be like the sun to all the seed of Israel.


    4. And a blessing shall be given to you and to all your seed, until the Lord visits all the nations in the tender mercies of his son forever.


    5. And for this reason counsel and understanding have been given to you, so that you may instruct your sons concerning this.


    6. For those who bless him will be blessed, and those who curse him will perish.'
translation:
  language: de
  text: '**Testament Levis 4**


    **1** Darum erkenne nun: Der Herr wird Gericht halten über die Menschenkinder. Denn während Felsen gespalten werden, die Sonne erlischt, Wasser vertrocknen, das Feuer zurückschreckt, die ganze Schöpfung erschüttert wird, die unsichtbaren Geister zerschmelzen und das Totenreich beim Leiden des Höchsten geplündert wird,[a] verharren die Menschen im Ungehorsam und bleiben bei ihren Ungerechtigkeiten. Darum werden sie mit schwererer Strafe gerichtet werden.[b]


    **2** Der Höchste hat also dein Gebet erhört: Er will dich von der Ungerechtigkeit absondern, damit du ihm zum Sohn, zum Diener und zum Amtsträger vor seinem Angesicht wirst.


    **3** Du wirst in Jakob das Licht der Erkenntnis aufleuchten lassen und für alle Nachkommen Israels wie die Sonne sein.


    **4** Dir und allen deinen Nachkommen wird Segen gegeben werden, bis der Herr alle Völker im tiefen Erbarmen seines Sohnes heimsucht — bis in Ewigkeit.[c]


    **5** Deshalb sind dir Rat und Einsicht gegeben worden, damit du deine Söhne darüber verständig machst.


    **6** Denn die, die ihn segnen, werden gesegnet sein; die aber, die ihn verfluchen, werden zugrunde gehen.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „beim Leiden des Höchsten“ stehen in der griechischen Edition in eckigen Klammern und sind textlich unsicher.
    reason: Textkritische Unsicherheit einer theologisch gewichtigen Wendung.
  - marker: b
    text: 'Wörtlicher: „Darum werden sie in/unter schwererer Strafe gerichtet werden.“ Die genaue Textgestalt dieser Wendung ist unsicher; die hier gewählte Wiedergabe folgt der als „größere/schwerere Strafe“ verstandenen Lesart.'
    reason: Kennzeichnet die schwierige und textlich unsichere griechische Konstruktion, ohne die Steigerung im Haupttext auszulassen.
  - marker: c
    text: '„Sohnes“ ist textlich unsicher. Einige Überlieferungsformen fügen danach hinzu: „Doch deine Söhne werden Hand an ihn legen, um ihn an den Pfahl zu bringen.“ Das verwendete Verb kann je nach Zusammenhang auch auf eine Kreuzigung bezogen werden.'
    reason: Kennzeichnet sowohl das eingeklammerte υἱοῦ als auch den vollständig eingeklammerten Zusatz der Edition, ohne ihn als gesicherten Text auszugeben.
  - marker: d
    text: Worauf sich „ihn“ bezieht, wird im griechischen Text nicht ausdrücklich gesagt.
    reason: Erhält die pronominale und theologische Mehrdeutigkeit.
lexical_decisions:
- source_word: τοὺς υἱοὺς τῶν ἀνθρώπων
  choice: die Menschenkinder
  rationale: Bewahrt die semitisch geprägte Formulierung und bleibt im Deutschen verständlich.
- source_word: τοῦ πυρὸς καταπτήσσοντος
  choice: das Feuer zurückschreckt
  rationale: καταπτήσσω bezeichnet ein erschrecktes Zusammenkauern oder Zurückweichen; „zurückschreckt“ erhält das ungewöhnliche Bild, ohne es zu glätten.
- source_word: τοῦ ᾅδου σκυλευομένου
  choice: das Totenreich … geplündert wird
  rationale: ᾅδης bezeichnet hier den Bereich der Toten; σκυλεύω bedeutet plündern oder als Beute nehmen.
- source_word: θεράποντα
  choice: Diener
  rationale: Gibt den persönlichen Dienst für Gott wieder, ohne eine spätere kirchliche Amtsbezeichnung einzutragen.
- source_word: λειτουργὸν τοῦ προσώπου αὐτοῦ
  choice: Dienstbeauftragten vor seinem Angesicht
  rationale: λειτουργός bezeichnet einen zum Dienst Bestellten; „vor seinem Angesicht“ bildet προσώπου formal ab und lässt den himmlisch-kultischen Bezug offen.
- source_word: ἐν σπλάγχνοις
  choice: im tiefen Erbarmen
  rationale: Das wörtliche Bild der Eingeweide bezeichnet inniges, tief empfundenes Erbarmen; die deutsche Wendung vermittelt den idiomatischen Sinn würdig.
- source_word: ἐπισκέψεται
  choice: heimsucht
  rationale: „Heimsuchen“ bewahrt die Mehrdeutigkeit von ἐπισκέπτομαι zwischen gnädigem Aufsuchen, Eingreifen und prüfender Visitation.
- source_word: σπέρματι
  choice: Nachkommen
  rationale: Im genealogischen Zusammenhang ist dies im modernen Deutsch natürlicher als das formalere „Same“, ohne den kollektiven Sinn aufzugeben.
theological_decisions:
- issue: „Leiden des Höchsten“ und mögliche christologische Deutung
  choice: Die überlieferte Wendung wird im Text beibehalten und textkritisch markiert.
  alternative: Die Wendung aus dem Haupttext entfernen oder ausdrücklich auf Christus beziehen.
  rationale: Die griechische Wendung steht in eckigen Klammern und ist textlich unsicher. Ihre theologische Spannung darf weder beseitigt noch konfessionell festgelegt werden.
- issue: „Sohn“ in Vers 4
  choice: „seines Sohnes“ wird übersetzt und als textlich unsicher gekennzeichnet.
  alternative: „seines Erbarmens“ beziehungsweise Auslassung von „Sohnes“.
  rationale: υἱοῦ ist in der vorgelegten Edition eingeklammert. Die Übersetzung folgt dem vorhandenen Wortlaut, weist aber offen auf dessen Unsicherheit hin.
- issue: Zusatz über die Söhne Levis und das Pfählen/Kreuzigen
  choice: Nicht in den laufenden Text aufgenommen, sondern in der Fußnote als Überlieferungszusatz wiedergegeben.
  alternative: Als regulären zweiten Satz von Vers 4 drucken.
  rationale: Der gesamte Satz ist in der Quelle eingeklammert und fehlt auch in der auditierten Konsultationsschicht; seine erhebliche christologische Tragweite verlangt transparente textkritische Kennzeichnung.
- issue: Bezugswort von αὐτόν in Vers 6
  choice: Das unbestimmte Pronomen „ihn“ bleibt stehen.
  alternative: „den Herrn“, „den Sohn“ oder „Levi“ ausdrücklich einsetzen.
  rationale: Der griechische Text nennt den Bezug nicht eindeutig. Eine explizite Identifikation würde die genuine Mehrdeutigkeit auflösen.
- issue: Zeitliche Wendung ἕως … ἕως αἰῶνος in Vers 4
  choice: „bis … — bis in Ewigkeit“
  alternative: „wenn … für immer“ oder eindeutige Zuordnung der Ewigkeit zum Segen beziehungsweise zum Erbarmen.
  rationale: Die schwerfällige doppelte ἕως-Konstruktion bleibt erkennbar, ohne ihre syntaktische Reichweite dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit leicht schriftsprachlichem Klang. Apokalyptische Bilder und semitisch-griechische Formulierungen werden nicht banalisiert; zugleich werden unnötige Archaismen vermieden. Die Anrede bleibt im Singular. Textkritisch unsichere, theologisch bedeutsame Stellen werden im Haupttext markiert und in Fußnoten erläutert.
