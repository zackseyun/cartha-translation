base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005.yaml
  text: 'And in this[a], the angel opened to me the gates of heaven, and I saw the holy Most High seated on a throne.


    2 And he said to me, “Levi, to you I have given the blessings of the priesthood until, having come, I dwell in the midst of Israel.”


    3 Then the angel brought me down to the earth and gave me a weapon and a sword, and said to me, “Carry out vengeance in Shechem for Dinah your sister, and I will be with you, because the Lord has sent me.”


    4 And in that time I destroyed the sons of Hamor, as it is written on the tablets of the fathers[b].


    5 And I said to him, “I beg you, Lord, teach me your name, so that I may call on you in a day of affliction.”


    6 And he said, “I am the angel who intercedes for the race of Israel, so that they may not be struck down utterly; for every evil spirit attacks it.”


    7 And after this, when I awoke, I blessed the Most High.'
translation:
  language: de
  text: '**Testament Levis 5**


    **1** Und dabei[a] öffnete mir der Engel die Tore des Himmels, und ich sah den heiligen Höchsten auf einem Thron sitzen.


    **2** Und er sagte zu mir: »Levi, dir habe ich die Segnungen des Priestertums gegeben, bis ich komme und mitten unter Israel wohne.«


    **3** Dann führte mich der Engel zur Erde hinab und gab mir eine Waffe und ein Schwert. Er sagte zu mir: »Übe in Sichem Vergeltung für deine Schwester Dina. Ich werde mit dir sein, denn der Herr hat mich gesandt.«


    **4** Und zu jener Zeit vernichtete ich die Söhne Hamors, wie es auf den Tafeln der Väter geschrieben steht.[b]


    **5** Da sagte ich zu ihm: »Ich bitte dich, Herr, lehre mich deinen Namen, damit ich dich am Tag der Bedrängnis anrufen kann.«


    **6** Und er sagte: »Ich bin der Engel, der für das Geschlecht Israel eintritt, um sie nicht zu schlagen.«[c]


    **7** Danach erwachte ich und pries den Höchsten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »in diesem«. Worauf sich die Wendung bezieht, bleibt im griechischen Text unklar.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »auf den Tafeln der Väter«. Im apokalyptischen Zusammenhang könnten himmlische Tafeln gemeint sein; »himmlisch« steht jedoch nicht ausdrücklich im erhaltenen griechischen Text.'
    reason: interpretive_ambiguity
  - marker: c
    text: Der griechische Wortlaut ist schwierig. Er kann ein bittendes oder abwehrendes Eintreten des Engels für Israel bezeichnen. Grammatisch ist der Engel auch als Handelnder von »sie nicht zu schlagen« zu verstehen; die Aussage bleibt daher spannungsvoll. Erweiterte Textformen erläutern den Gedanken mit vollständiger Vernichtung und dem Angriff böser Geister; diese Zusätze stehen nicht im hier zugrunde gelegten griechischen Text.
    reason: textual_variant
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: dabei
  rationale: Gibt die schwer bestimmbare anknüpfende Wendung in natürlichem Deutsch wieder, ohne einen nicht genannten Bezug zu ergänzen; die wörtliche Form und ihre Unklarheit werden in Fußnote [a] vermerkt.
- source_word: τὸν ἅγιον ὕψιστον
  choice: den heiligen Höchsten
  rationale: Bewahrt beide ehrenden Bezeichnungen und lässt ὕψιστος als substantivischen Hoheitstitel stehen.
- source_word: τὰς εὐλογίας τῆς ἱερατείας
  choice: die Segnungen des Priestertums
  rationale: Erhält die Genitivverbindung und bezeichnet Segnungen, die zum priesterlichen Amt gehören.
- source_word: ἕως ἐλθὼν κατοικήσω ἐν μέσῳ τοῦ Ἰσραήλ
  choice: bis ich komme und mitten unter Israel wohne
  rationale: Gibt das Partizip mit anschließendem finiten Verb idiomatisch wieder und bewahrt die erste Person sowie den zeitlichen Sinn von ἕως.
- source_word: ὅπλον καὶ ῥομφαίαν
  choice: eine Waffe und ein Schwert
  rationale: ὅπλον ist allgemein ‚Waffe/Rüstung‘ und bezeichnet nicht sicher einen Schild; ῥομφαία wird als Schwert verständlich wiedergegeben.
- source_word: Ποίησον ἐκδίκησιν
  choice: Übe … Vergeltung
  rationale: Bewahrt den imperativischen und vergeltenden Sinn, ohne ihn zu bloßer Rechtsprechung abzuschwächen.
- source_word: συνετέλεσα
  choice: vernichtete ich
  rationale: Im gewaltsamen Zusammenhang bedeutet das Verb, die Betroffenen zu Ende zu bringen beziehungsweise zu töten.
- source_word: ἐν πλαξὶ τῶν πατέρων
  choice: auf den Tafeln der Väter
  rationale: Folgt dem vorhandenen griechischen Text, ohne das dort nicht ausdrücklich stehende Adjektiv ‚himmlisch‘ in den Haupttext einzutragen.
- source_word: ἐν ἡμέρᾳ θλίψεως
  choice: am Tag der Bedrängnis
  rationale: Bewahrt das gehobene Einzahl-Idiom und den Sinn einer Zeit schwerer Not.
- source_word: ὁ ἄγγελος ὁ παραιτούμενος τὸ γένος Ἰσραήλ
  choice: der Engel, der für das Geschlecht Israel eintritt
  rationale: παραιτέομαι kann hier ein bittendes Abwenden oder Eintreten bezeichnen. Die Wiedergabe passt zum anschließenden Schutzgedanken, während die textliche Schwierigkeit offengelegt wird.
- source_word: τοῦ μὴ πατάξαι αὐτούς
  choice: damit sie nicht geschlagen werden
  rationale: Die passive deutsche Form bewahrt den Zweckgedanken, ohne den im griechischen Infinitivsatz nicht ausdrücklich bezeichneten Handelnden festzulegen.
- source_word: ἔξυπνος γενόμενος
  choice: erwachte ich
  rationale: Natürliche deutsche Wiedergabe des partizipialen Ausdrucks für das Erwachen nach der Vision.
theological_decisions:
- issue: Wer in Vers 2 spricht
  choice: Die Rede bleibt in der ersten Person stehen, ohne den Sprecher ausdrücklich als Gott oder Engel zu identifizieren.
  alternative: Die Aussage könnte ausdrücklich dem thronenden Höchsten oder dem als Gottes Sprecher auftretenden Engel zugeordnet werden.
  rationale: Nach der Schau des Höchsten folgt lediglich ‚er sagte‘. Die Übersetzung bewahrt den Sprecherwechsel beziehungsweise seine mögliche Unschärfe und löst die theologische Spannung nicht durch eine Ergänzung.
- issue: Die Tafeln der Väter in Vers 4
  choice: ‚Tafeln der Väter‘ ohne das ergänzende Adjektiv ‚himmlisch‘
  alternative: Im apokalyptischen Zusammenhang können himmlische, im Voraus beschriebene Tafeln gemeint sein.
  rationale: Der apokalyptische Bezug ist plausibel, doch das erhaltene Griechisch nennt die Tafeln nicht ausdrücklich himmlisch. Die mögliche Deutung steht daher nur in der Fußnote.
- issue: Aufgabe des Engels in Vers 6
  choice: Schützendes Eintreten für Israel, bei offenbleibendem Urheber des Schlagens
  alternative: παραιτούμενος könnte auch stärker als Abbitten, Abwehren oder Sich-Weigern verstanden werden; spätere beziehungsweise abweichende Textformen erläutern die Rolle ausführlicher.
  rationale: Der Zweckzusatz weist auf die Abwendung eines Schlages. Wegen des schwierigen Wortlauts wird weder ein vollständiges Vernichtungsmotiv noch ein Angriff böser Geister aus nicht im vorgelegten Haupttext enthaltenen Lesarten aufgenommen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung und leicht gehobenem visionär-testamentarischem Ton. Archaismen wurden vermieden. Unklare Bezüge und textkritisch schwierige Aussagen wurden nicht stillschweigend harmonisiert; erläuternde Zusätze aus erweiterten Lesarten erscheinen nicht im Haupttext.
