- from: Ich war acht Jahre alt, als ich in das Land Kanaan kam, achtzehn Jahre, als ich Sichem tötete, neunzehn Jahre, als ich Priester wurde, und achtundzwanzig Jahre, als ich eine Frau nahm. Mit achtundvierzig Jahren kam ich nach Ägypten.
  to: Ich war acht Jahre alt, als ich in das Land Kanaan kam, achtzehn Jahre alt, als ich Sichem tötete, neunzehn Jahre alt, als ich als Priester diente, achtundzwanzig Jahre alt, als ich heiratete, und achtundvierzig Jahre alt, als ich nach Ägypten kam.
