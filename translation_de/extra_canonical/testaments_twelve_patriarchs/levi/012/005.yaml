base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/012/005.yaml
  text: I was eight years old when I entered the land of Canaan, and eighteen years old when I killed Shechem, and nineteen years old when I served as priest, and twenty-eight years old when I took a wife, and forty-eight years old when I entered Egypt.
translation:
  language: de
  text: Ich war acht Jahre alt, als ich in das Land Kanaan kam, achtzehn Jahre alt, als ich Sichem tötete, neunzehn Jahre alt, als ich als Priester diente, achtundzwanzig Jahre alt, als ich heiratete, und achtundvierzig Jahre alt, als ich nach Ägypten kam.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσῆλθον εἰς γῆν Χανάαν
  choice: in das Land Kanaan kam
  rationale: Gibt die Bewegung in das Land natürlich und genau wieder; „kam“ ist im Deutschen idiomatischer als das hier schwerfällige „trat ein“.
- source_word: ἀπέκτεινα τὸν Συχέμ
  choice: Sichem tötete
  rationale: Bewahrt die direkte Aussage des griechischen Textes und die mögliche Mehrdeutigkeit von Συχέμ als Personenname, ohne eine zusätzliche Deutung einzuführen.
- source_word: ἱεράτευσα
  choice: Priester wurde
  rationale: Das Verb bezeichnet hier nach dem chronologischen Zusammenhang den Beginn von Levis Priestertum. Die Wiedergabe vermeidet das missverständliche „als Priester diente“, das eher eine Dauer als einen Zeitpunkt nahelegt.
- source_word: ἔλαβον γυναῖκα
  choice: eine Frau nahm
  rationale: Bewahrt die semitisch geprägte Ausdrucksweise des griechischen Textes in verständlichem, würdevollem Deutsch; gemeint ist die Eheschließung.
- source_word: εἰσῆλθον εἰς Αἴγυπτον
  choice: kam ich nach Ägypten
  rationale: Natürliche deutsche Wiedergabe der gerichteten Bewegung nach Ägypten.
theological_decisions: []
