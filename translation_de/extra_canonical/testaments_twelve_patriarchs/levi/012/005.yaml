  register: Modernes, klares Standarddeutsch mit würdigem erzählerischem Ton. Die wiederholten Altersangaben bleiben erhalten, werden jedoch für einen natürlichen deutschen Satzbau leicht variiert. Die textkritisch markierte Lesart „achtundvierzig“ wird im Haupttext übernommen, da sie dem bereitgestellten griechischen Text und der konsultierten englischen Fassung entspricht.
