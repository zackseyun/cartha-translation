lexical_decisions:
- source_word: ἔλαβεν … γυναῖκα
  choice: nahm eine Frau
  rationale: Gibt die übliche griechische Wendung für die Eheschließung knapp und natürlich wieder.
- source_word: ἔτεκεν … ἐξ αὐτῆς
  choice: sie gebar ihm
  rationale: Das Verb bezeichnet das Gebären; im Zusammenhang ist die zuvor genannte Frau als Subjekt zu verstehen. „Ihm“ drückt die familiäre Zuordnung idiomatisch aus, ohne das im Griechischen ungewöhnlich wirkende ἐξ αὐτῆς mechanisch nachzubilden.
- source_word: Λομνὴ καὶ Σεμεῆ
  choice: Lomne und Semee
  rationale: Die Eigennamen werden in einer dem griechischen Text nahen, im Deutschen gut lesbaren Form wiedergegeben.
