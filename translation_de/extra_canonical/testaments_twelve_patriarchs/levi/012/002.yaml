  text: '*Οἱ δὲ⁸ υἱοὶ Καὰθ⁹ Ἀβραάμ¹⁰, Ἰσαχάρ¹¹, Χεβρών¹² καὶ¹³ Ὀζηήλ¹⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/012/002.yaml
  text: And the sons of Kohath were Amram, Issachar, Hebron, and Uzziel.
translation:
  language: de
  text: Die Söhne Kehats aber waren Abraham[a], Issachar, Hebron und Usiël.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach dem griechischen Text: Abraham. In 2. Mose 6,18 und 4. Mose 3,19 steht an dieser Stelle Amram.'
    reason: Kennzeichnet eine echte Abweichung zwischen dem vorgelegten griechischen Text und der bekannten biblischen Genealogie.
lexical_decisions:
- source_word: Καὰθ
  choice: Kehat
  rationale: Verwendet die im modernen deutschen Bibelgebrauch übliche Namensform für Kohath.
- source_word: Ἀβραάμ
  choice: Abraham
  rationale: Gibt den tatsächlich überlieferten griechischen Namen wieder, statt ihn stillschweigend an die parallele biblische Genealogie anzupassen.
- source_word: Ἰσαχάρ
  choice: Issachar
  rationale: Entspricht der geläufigen deutschen Namensform.
- source_word: Χεβρών
  choice: Hebron
  rationale: Entspricht der geläufigen deutschen Namensform.
- source_word: Ὀζηήλ
  choice: Usiël
  rationale: Verwendet eine etablierte deutsche Form des Namens Uzziel; das Trema verdeutlicht die getrennte Aussprache der Vokale.
theological_decisions:
- issue: Abweichung der Genealogie von 2. Mose 6,18
  choice: Abraham wird gemäß dem vorgelegten griechischen Text beibehalten.
  alternative: Amram, entsprechend der biblischen Parallele und der englischen Konsultationsfassung.
  rationale: Die Übersetzung folgt vorrangig dem angegebenen Originaltext und macht die auffällige Abweichung in einer Fußnote transparent, statt sie durch Konjektur zu beseitigen.
translation_notes:
  register: Natürliche, knappe genealogische Prosa in modernem Standarddeutsch. Das vorangestellte »aber« gibt δέ wieder. Die Kopula »waren« ist im griechischen Nominalsatz sinngemäß ergänzt. Die in einer Revisionsnotiz erwähnte Aussage »Er starb« wurde nicht aufgenommen, da sie weder im vorgelegten griechischen Quelltext noch in der angegebenen englischen POB-Fassung enthalten ist.
