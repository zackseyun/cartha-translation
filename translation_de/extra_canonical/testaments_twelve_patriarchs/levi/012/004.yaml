  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/012/004.yaml
  text: And in the ninety-fourth year of my life, Abraham took Jochebed my daughter as a wife for himself, because he and my daughter were born on one and the same day.
translation:
  language: de
  text: Und in meinem vierundneunzigsten Lebensjahr nahm Abraham meine Tochter Jochebed sich zur Frau, weil er und meine Tochter am selben Tag geboren wurden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῷ ἐνενηκοστῷ τετάρτῳ μου ἔτει
  choice: in meinem vierundneunzigsten Lebensjahr
  rationale: Gibt die griechische Ordinalzahl präzise und in natürlichem modernem Deutsch wieder.
- source_word: Ἀβραὰμ
  choice: Abraham
  rationale: Entspricht der Namensform des vorliegenden griechischen Textes, auch wenn der erzählerische Zusammenhang möglicherweise eine abweichende Überlieferung erkennen lässt.
- source_word: Ἰωχαβὲδ
  choice: Jochebed
  rationale: Verwendet die im Deutschen geläufige biblische Namensform.
- source_word: ἑαυτῷ εἰς γυναῖκα
  choice: für sich zur Frau
  rationale: Bewahrt die reflexive Wendung und gibt die Heiratsformel idiomatisch wieder.
- source_word: ἐν μιᾷ ἡμέρᾳ
  choice: an ein und demselben Tag
  rationale: Bringt die betonte Identität des Geburtstags im Deutschen klar zum Ausdruck.
- source_word: ἐγεννήθησαν
  choice: geboren worden waren
  rationale: Das Plusquamperfekt verdeutlicht, dass die gemeinsame Geburt zeitlich vor der Eheschließung lag.
