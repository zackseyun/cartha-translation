revisions:
- from: Doch der dritte Priester wird vom Kummer überwältigt werden.
  to: Doch der dritte Priester wird in Trauer weggenommen werden.
  rationale: Die Revision stellt die Grundbedeutung von παραληφθήσεται als passives „weggenommen werden“ wieder her und gibt λύπῃ als begleitenden Dativ mit „in Trauer“ wieder. Damit bleibt offen, worin dieses Weggenommenwerden konkret besteht, wie es auch der griechische Text offenlässt. Die englische Audit-Fassung („will be taken away with grief“) wird in ihrer semantischen Richtung berücksichtigt, ohne sie mechanisch nachzuahmen.
