  text: But the third priest will be taken away with grief.
translation:
  language: de
  text: Doch der dritte Priester wird in Trauer weggenommen werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ δὲ τρίτος ἱερεύς
  choice: Doch der dritte Priester
  rationale: δὲ markiert hier einen fortführenden Gegensatz und wird natürlich mit „doch“ wiedergegeben; die bestimmte Nominalgruppe bleibt erhalten.
- source_word: λύπῃ
  choice: vom Kummer
  rationale: Der Dativ bezeichnet hier wahrscheinlich das, wodurch der Priester ergriffen beziehungsweise überwältigt wird. „Kummer“ gibt λύπη in diesem Zusammenhang würdig und idiomatisch wieder.
- source_word: παραληφθήσεται
  choice: wird … überwältigt werden
  rationale: Das Futur Passiv von παραλαμβάνω bedeutet wörtlich „wird genommen/ergriffen werden“. Zusammen mit λύπῃ drückt „vom Kummer überwältigt werden“ den griechischen Ausdruck in natürlichem Deutsch aus, ohne das unbestimmte „Weggenommenwerden“ als Tod oder Entrückung festzulegen.
theological_decisions:
- issue: Bedeutung von παραληφθήσεται in Verbindung mit λύπῃ
  choice: emotionales Ergriffen- oder Überwältigtwerden
  alternative: „wird in Kummer weggenommen werden“
  rationale: Der griechische Ausdruck lässt grundsätzlich ein Genommenwerden zu, doch der instrumentale Dativ λύπῃ legt nahe, dass Kummer die ergreifende Macht ist. Die Übersetzung vermeidet zugleich eine unbelegte Festlegung auf Tod, Absetzung oder Entrückung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur des Griechischen bleibt bewahrt; eine Fußnote ist nicht erforderlich.
