  to: Denn in jedem Jubeljahr wird es ein Priestertum geben. Und im ersten Jubeljahr wird derjenige, der als Erster zum Priestertum gesalbt wird, groß sein; er wird zu Gott wie zu einem Vater reden, und sein Priestertum wird voll mit dem Herrn sein. [Und in den Tagen seiner Freude wird er zur Rettung der Welt aufstehen.][a]
