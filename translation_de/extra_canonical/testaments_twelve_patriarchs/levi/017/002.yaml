source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καθ’ ἕκαστον γὰρ ἰωβηλαῖον⁶ ἔσται ἱερωσύνη⁷. Καὶ⁸ ἐν τῷ⁹ πρώτῳ ἰωβηλαίῳ ὁ *χριόμενος πρῶτος¹⁰ εἰς ἱερωσύνην *ἔσται μέγας¹¹, καὶ λαλήσει¹² Θεῷ ὡς πατρί· καὶ ἡ ἱερωσύνη αὐτοῦ πλήρης μετὰ¹³ κυρίου· [καὶ ἐν ἡμέραις¹⁴ χαρᾶς αὐτοῦ¹⁵ *ἐπὶ σωτηρίᾳ¹⁶ κόσμου *αὐτὸς ἀναστήσεται]¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/002.yaml
  text: For in each jubilee there will be a priesthood. And in the first jubilee, the one first anointed for the priesthood will be great, and he will speak to God as to a father; and his priesthood will be full with the Lord. [And in the days of his joy, he will arise for the salvation of the world.]
translation:
  language: de
  text: Denn in jedem Jubeljahr wird es ein Priestertum geben. Und im ersten Jubeljahr wird derjenige, der als Erster zum Priestertum gesalbt wird, groß sein; er wird zu Gott wie zu einem Vater reden, und sein Priestertum wird voll mit dem Herrn sein. [Und in den Tagen seiner Freude wird er zur Rettung der Welt aufstehen.][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der eingeklammerte Satz ist textkritisch unsicher.
    reason: Die griechische Quellenausgabe setzt den gesamten Schlusssatz in eckige Klammern.
lexical_decisions:
- source_word: Καθ’ ἕκαστον ... ἰωβηλαῖον
  choice: in jedem Jubiläum
  rationale: Gibt die distributive Wendung natürlich und nah am griechischen Wortlaut wieder.
- source_word: ἱερωσύνη
  choice: Priestertum
  rationale: Bezeichnet hier das priesterliche Amt beziehungsweise die priesterliche Ordnung, nicht lediglich einen einzelnen Priester.
- source_word: ὁ χριόμενος πρῶτος εἰς ἱερωσύνην
  choice: derjenige, der als Erster zum Priestertum gesalbt wird
  rationale: Bewahrt sowohl das passive Partizip als auch die Stellung von πρῶτος, ohne die Person ausdrücklich messianisch zu identifizieren.
- source_word: λαλήσει Θεῷ ὡς πατρί
  choice: wird zu Gott wie zu einem Vater reden
  rationale: Bewahrt den Vergleich ὡς πατρί; „zu Gott reden“ ist im Deutschen natürlicher als eine streng wörtliche Konstruktion.
- source_word: πλήρης μετὰ κυρίου
  choice: vom Herrn erfüllt
  rationale: Die griechische Formulierung ist ungewöhnlich. Diese Wiedergabe vermittelt Fülle in Verbindung mit dem Herrn, ohne „vollständig“ einzutragen.
- source_word: ἐπὶ σωτηρίᾳ κόσμου
  choice: zur Rettung der Welt
  rationale: Gibt den Ziel- beziehungsweise Zweckbezug der Präpositionalwendung idiomatisch wieder.
- source_word: ἀναστήσεται
  choice: wird ... aufstehen
  rationale: Bewahrt die mögliche Spannung zwischen gewöhnlichem Auftreten/Aufstehen und einer Auferstehungsanklang, statt eindeutig „auferstehen“ zu setzen.
theological_decisions:
- issue: Identität des zuerst Gesalbten
  choice: keine ausdrückliche Bezeichnung als Messias oder Christus
  alternative: „der erste Messias“ oder „Christus“
  rationale: Der griechische Text verwendet ein Partizip von χρίω und benennt keinen Titel; eine explizite messianische Identifikation würde die Aussage stärker festlegen als die Quelle.
- issue: Bedeutung von ἀναστήσεται
  choice: „wird ... aufstehen“
  alternative: „wird auferstehen“ oder „wird auftreten“
  rationale: Das Verb kann je nach Kontext mehrere Nuancen tragen. Die gewählte Form lässt die im Text vorhandene Mehrdeutigkeit bestehen.
- issue: Textkritischer Status des Schlusssatzes
  choice: in eckigen Klammern beibehalten und mit Fußnote kennzeichnen
  alternative: unkommentiert in den Haupttext aufnehmen oder auslassen
  rationale: Die Quellenausgabe markiert den gesamten Satz als textkritisch unsicher; diese Unsicherheit soll sichtbar bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt der feierlichen Abfolge des Griechischen nahe, wird aber durch Semikolon und idiomatische Präpositionen lesbar gehalten. „Jubiläum“ wird als Epochenbezeichnung verstanden; „Jubeljahr“ wäre möglich, könnte hier jedoch zu eng an die einzelne alttestamentliche Institution denken lassen.
