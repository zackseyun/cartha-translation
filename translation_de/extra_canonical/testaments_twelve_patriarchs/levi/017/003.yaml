revisions:
- from: Im zweiten Jubiläum wird der Gesalbte in Trauer um einen geliebten Menschen gefangen genommen werden; und sein Priestertum wird in Ehren stehen, und er wird von allen verherrlicht werden.
  to: Im zweiten Jubeljahr wird der Gesalbte in Trauer um einen Geliebten gefangen genommen werden, und sein Priestertum wird in Ehren stehen, und er wird von allen verherrlicht werden.
  rationale: Die Revision verbessert die idiomatische Zeitbezeichnung und bewahrt bei ἀγαπητοῦ die im griechischen Text markierte maskuline Personenform. Sie lässt sowohl die nicht näher bestimmte Identität des Geliebten als auch die nicht weiter ausgeführte Beziehung zur Trauer offen und erhält die lexikalische Unterscheidung zwischen der Ehre des Priestertums und der Verherrlichung der Person.
