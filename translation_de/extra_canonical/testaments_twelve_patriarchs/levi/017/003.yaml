base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/003.yaml
  text: In the second jubilee, the anointed one will be seized in mourning for a beloved one, and his priesthood will be honored, and he will be glorified by all.
translation:
  language: de
  text: Im zweiten Jubeljahr wird der Gesalbte in Trauer um einen Geliebten gefangen genommen werden, und sein Priestertum wird in Ehren stehen, und er wird von allen verherrlicht werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰωβηλαίῳ
  choice: Jubiläum
  rationale: Bewahrt den sachsprachlichen Ausdruck für einen Jubiläums- beziehungsweise Erlassjahr-Zeitraum und folgt der Gliederung des Kontextes.
- source_word: ὁ χριόμενος
  choice: der Gesalbte
  rationale: Gibt das substantivierte Präsenspartizip natürlich und würdig wieder, ohne es ausdrücklich als Titel oder bestimmte messianische Identifikation auszulegen.
- source_word: συλληφθήσεται
  choice: wird ... gefangen genommen werden
  rationale: Entspricht hier dem passiven Futur von συλλαμβάνω im Sinn von ergreifen oder festnehmen; die mögliche Grundbedeutung 'empfangen werden' passt syntaktisch und kontextuell weniger gut.
- source_word: ἐν πένθει ἀγαπητοῦ
  choice: in Trauer um einen geliebten Menschen
  rationale: Gibt πένθος idiomatisch als Trauer wieder und lässt ἀγαπητοῦ als nicht näher bestimmte geliebte Person stehen.
- source_word: τιμία
  choice: in Ehren stehen
  rationale: Vermittelt den prädikativen Sinn 'geehrt, angesehen, kostbar' in natürlichem Deutsch.
- source_word: δοξασθήσεται
  choice: wird ... verherrlicht werden
  rationale: Bewahrt gegenüber τιμία die stärkere Ruhmes- und Ehrensprache des Verbs δοξάζω.
- source_word: παρὰ πάντων
  choice: von allen
  rationale: Gibt beim Passiv den Urheber idiomatisch wieder und wahrt den umfassenden Ausdruck.
theological_decisions:
- issue: Identität des Gesalbten
  choice: Die Bezeichnung bleibt ohne zusätzliche Identifikation als „der Gesalbte“ stehen.
  alternative: Explizite Wiedergabe als „Messias“ oder Zuordnung zu einer bestimmten Gestalt.
  rationale: Der griechische Wortlaut enthält ein substantiviertes Partizip, aber keine ausdrückliche Identifikation; die Übersetzung soll diese Offenheit bewahren.
- issue: Bezug des Genitivs ἀγαπητοῦ
  choice: Als Trauer um eine nicht näher bestimmte geliebte Person wiedergegeben.
  alternative: „in der Trauer des Geliebten“ oder „in geliebter Trauer“.
  rationale: Der Genitiv kann knapp und kontextuell mehrdeutig wirken. Die gewählte Fassung ist im Deutschen verständlich, ohne Geschlecht oder Identität der Person festzulegen.
- issue: Art der Ehrung
  choice: 'Priestertum und Person werden sprachlich unterschieden: Das Priestertum steht in Ehren, die Person wird verherrlicht.'
  alternative: Beide Aussagen einheitlich mit „geehrt“ wiedergeben.
  rationale: So bleibt die lexikalische Spannung zwischen τιμία und δοξασθήσεται erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wahrt die dreigliedrige Abfolge des Griechischen, wird jedoch durch ein Semikolon lesbarer gemacht. „Geliebter Mensch“ vermeidet eine im Griechischen nicht festgelegte Geschlechtszuweisung.
