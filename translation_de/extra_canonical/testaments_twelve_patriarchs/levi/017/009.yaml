id: T12P.LEV.17.9
reference: Testament of Levi 17:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Διὰ τοῦτο ἐν αἰχμαλωσίᾳ καὶ ἐν προνομῇ ἔσονται· καὶ ἡ γῆ αὐτῶν⁴⁴ καὶ *ἡ ὕπαρξις⁴⁵ ἀφανισθήσεται⁴⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/009.yaml
  text: Therefore they will be in captivity and in plunder, and their land and their possessions will be destroyed.
translation:
  language: de
  text: Darum werden sie in Gefangenschaft geraten und ausgeplündert werden; ihr Land und ihr Besitz werden vernichtet werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν αἰχμαλωσίᾳ
  choice: in Gefangenschaft geraten
  rationale: Die griechische Wendung bezeichnet den Zustand beziehungsweise das Geschick der Gefangenschaft; im Deutschen gibt die verbale Form die zukünftige Entwicklung natürlich wieder.
- source_word: ἐν προνομῇ
  choice: ausgeplündert werden
  rationale: προνομή bezeichnet Plünderung oder Beutezug. Die passive deutsche Form passt zur parallelen Aussage über das Erleiden von Gefangenschaft und klingt natürlicher als „in Plünderung sein“.
- source_word: ἡ ὕπαρξις
  choice: ihr Besitz
  rationale: ὕπαρξις bezeichnet hier vorhandenes Eigentum beziehungsweise Habe; „Besitz“ ist im Kontext prägnant und idiomatisch.
- source_word: ἀφανισθήσεται
  choice: werden vernichtet werden
  rationale: Das Verb kann das Verschwindenlassen, Zerstören oder Vernichten ausdrücken. „Vernichtet“ bewahrt die Stärke der Aussage und lässt sich auf Land und Besitz beziehen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die parallele Gerichtsankündigung bleibt erhalten; das doppelte Futurpassiv im zweiten Satzteil entspricht der griechischen Einzelform, deren zusammengesetztes Subjekt „Land und Besitz“ im Deutschen den Plural verlangt.
