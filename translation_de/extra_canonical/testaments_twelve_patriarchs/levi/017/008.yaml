source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Ἐν δὲ τῷ ἑβδόμῳ²⁷ ἔσται μιασμός⁴¹, ὃν οὐ δύναμαι⁴² εἰπεῖν ἐνώπιον⁴³ ἀνθρώπων· ὅτι αὐτοὶ γνώσονται οἱ ποιοῦντες αὐτά.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/008.yaml
  text: But in the seventh there will be defilement, which I cannot speak of before men, because those who do these things will know them.
translation:
  language: de
  text: Doch im siebten wird es Verunreinigung geben, über die ich vor Menschen nicht sprechen kann; denn diejenigen, die diese Dinge tun, werden sie selbst kennen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν δὲ τῷ ἑβδόμῳ
  choice: Doch im siebten
  rationale: Die substantivierte Ordnungszahl bleibt wie im Griechischen ohne ergänztes Bezugswort stehen, da der unmittelbare Kontext hier nicht vorliegt und die Mehrdeutigkeit nicht aufgelöst werden soll.
- source_word: μιασμός
  choice: Verunreinigung
  rationale: Bezeichnet Befleckung oder Verunreinigung, häufig auch in kultisch-sittlichem Sinn; die gewählte Formulierung bewahrt diese Bedeutungsbreite.
- source_word: ὃν οὐ δύναμαι εἰπεῖν
  choice: über die ich … nicht sprechen kann
  rationale: Im Deutschen verlangt das Sprechen über eine Verunreinigung eine idiomatische Präpositionalfügung; der relative Bezug auf μιασμός bleibt erhalten.
- source_word: ἐνώπιον ἀνθρώπων
  choice: vor Menschen
  rationale: Gibt die räumlich-soziale Wendung formal und zugleich natürlich wieder.
- source_word: ὅτι αὐτοὶ γνώσονται οἱ ποιοῦντες αὐτά
  choice: denn diejenigen, die dies tun, werden selbst davon wissen
  rationale: αὐτοί wird mit „selbst“ hervorgehoben; αὐτά verweist auf die nicht näher ausgesprochenen Handlungen. „davon wissen“ macht den im Deutschen nötigen Bezug deutlich, ohne den Inhalt zu konkretisieren.
theological_decisions:
- issue: Art und Inhalt der Verunreinigung
  choice: Nicht näher bestimmen
  alternative: Die Verunreinigung ausdrücklich als bestimmte kultische oder sexuelle Sünden auslegen
  rationale: Der griechische Text verschweigt die Einzelheiten ausdrücklich; eine Konkretisierung würde eine nicht im Vers selbst gegebene Deutung eintragen.
- issue: Bezugswort von „im siebten“
  choice: Die Ellipse bewahren
  alternative: „im siebten Priestergeschlecht“, „im siebten Zeitraum“ oder eine andere Ergänzung einsetzen
  rationale: Ohne den hier bereitgestellten Kontext ist das ausgelassene Substantiv nicht sicher festzulegen; die Übersetzung bewahrt daher die genuine Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt quellennah, wird aber durch „über die … sprechen“ und „davon wissen“ idiomatisch gestaltet. Keine konfessionelle oder interpretative Präzisierung wurde ergänzt.
