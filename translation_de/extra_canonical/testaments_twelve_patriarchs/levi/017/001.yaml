source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καὶ ὅτι ἠκούσατε¹ περὶ τῶν ἑβδομήκοντα² ἑβδομάδων³, ἀκούσατε καὶ⁴ περὶ τῆς ἱερωσύνης⁵.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/001.yaml
  text: And since you have heard about the seventy weeks, hear also about the priesthood.
translation:
  language: de
  text: Und da ihr von den siebzig Wochen gehört habt, hört auch vom Priestertum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑβδομήκοντα ἑβδομάδων
  choice: siebzig Wochen
  rationale: Die wörtliche Wiedergabe bewahrt den erkennbaren Anklang an die prophetische Zeitangabe und entspricht dem natürlichen deutschen Ausdruck.
- source_word: ἱερωσύνης
  choice: Priesterschaft
  rationale: Das Substantiv bezeichnet hier das Priesteramt beziehungsweise die Institution des Priestertums; „Priesterschaft“ ist im Satz idiomatisch und lässt den folgenden Ausführungen ihre inhaltliche Offenheit.
- source_word: ἀκούσατε καὶ
  choice: hört nun auch
  rationale: Der Imperativ und das additive καί werden direkt wiedergegeben; „nun“ macht den Übergang im Deutschen flüssig, ohne einen neuen inhaltlichen Gegensatz einzuführen.
theological_decisions:
- issue: Bezug der „siebzig Wochen“
  choice: Die Formulierung bleibt ohne erklärende Identifikation stehen.
  alternative: Eine ausdrückliche Zuordnung zu Daniels Siebzig-Wochen-Prophetie.
  rationale: Der griechische Text setzt den Bezug voraus, benennt ihn aber nicht ausdrücklich; die Übersetzung soll diese intertextuelle Offenheit nicht durch eine Ergänzung auflösen.
- issue: Bedeutungsumfang von ἱερωσύνη
  choice: Priesterschaft
  alternative: Priesteramt / Priestertum
  rationale: „Priesterschaft“ kann sowohl den Stand als auch die institutionelle Ordnung bezeichnen und legt die spätere theologische Ausgestaltung nicht vorzeitig fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzstruktur. Die Anrede im Plural und die Wiederholung von „hören“ bleiben erhalten.
