lexical_decisions:
- source_word: Ὁ πέμπτος
  choice: Der fünfte
  rationale: Die substantivierte Ordinalzahl wird formal und entsprechend dem Zusammenhang als Bezeichnung des fünften Priesters beziehungsweise Amtsinhabers wiedergegeben, ohne diese Ergänzung ausdrücklich in den Text einzutragen.
- source_word: ἐν σκότει
  choice: in Finsternis
  rationale: Bewahrt die knappe räumlich beziehungsweise umständlich deutbare Formulierung und ihre mögliche bildliche Bedeutung.
- source_word: παραληφθήσεται
  choice: wird hinweggenommen werden
  rationale: Das Futur Passiv von παραλαμβάνω kann ein Zu-sich-Nehmen, Mitnehmen oder Fortnehmen bezeichnen. »Hinweggenommen« wahrt die ungenannte handelnde Instanz und legt den Vorgang nicht näher fest.
theological_decisions:
- issue: Art und Bewertung des Hinwegnehmens
  choice: wird … hinweggenommen werden
  alternative: wird … aufgenommen / entrückt werden
  rationale: Der griechische Satz nennt weder den Handelnden noch Ziel oder theologische Bedeutung des Vorgangs. Die Übersetzung vermeidet daher eine positive, negative oder eschatologisch spezifische Festlegung.
translation_notes:
  register: Knappes, würdiges modernes Standarddeutsch; die im Griechischen vorhandene Dunkelheit und Mehrdeutigkeit der Aussage bleiben erhalten.
