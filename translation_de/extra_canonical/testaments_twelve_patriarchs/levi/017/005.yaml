base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/005.yaml
  text: And the fourth will be in pains, because lawlessness will increase upon him to abundance, and all Israel will hate each one his neighbor.
translation:
  language: de
  text: Und der Vierte wird in Schmerzen sein; denn das Unrecht wird über ihm in großer Menge zunehmen,[a] und in ganz Israel wird jeder seinen Nächsten hassen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei ihm“. Das griechische ἐπ’ αὐτῷ lässt offen, ob der Bezug die Person selbst, ihre Zeit oder eine auf ihr liegende Belastung betrifft.'
    reason: Bewahrt die Mehrdeutigkeit der Präpositionalfügung, ohne den Haupttext auf eine Herrschafts- oder Zeitangabe festzulegen.
lexical_decisions:
- source_word: ἐν ὀδύναις
  choice: in Schmerzen
  rationale: Gibt die körperliche oder seelische Not des griechischen Ausdrucks knapp wieder, ohne sie näher festzulegen.
- source_word: ἡ ἀδικία
  choice: das Unrecht
  rationale: ἀδικία bezeichnet Unrecht, Ungerechtigkeit oder schuldhaftes Handeln. „Unrecht“ wahrt diese Breite besser als das speziellere „Gesetzlosigkeit“.
- source_word: εἰς πλῆθος
  choice: bis ins Übermaß
  rationale: Bringt die Vorstellung einer sehr großen, überreichen Menge in natürlichem Deutsch zum Ausdruck.
- source_word: ἕκαστος τὸν πλησίον αὐτοῦ
  choice: jeder den anderen
  rationale: Verdeutlicht die wechselseitige Feindschaft und steht als erklärende Aufnahme nach dem formal näheren „seinen Nächsten“.
theological_decisions:
- issue: Bezug von ἐπ’ αὐτῷ
  choice: unter ihm
  alternative: über ihn / bei ihm
  rationale: Der Ausdruck bezieht das Anwachsen des Unrechts auf die Zeit oder Herrschaft des „vierten“, ohne ihn ausdrücklich als dessen Urheber darzustellen. Wegen der sprachlichen Mehrdeutigkeit wird eine Fußnote gesetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der auffällig knappe Ausdruck „der vierte“ bleibt entsprechend dem griechischen Text ohne ergänzendes Bezugswort stehen. Der Gedankenstrich macht die distributive Aussage „jeder den anderen“ lesbar, ohne die Spannung des Satzes aufzulösen.
