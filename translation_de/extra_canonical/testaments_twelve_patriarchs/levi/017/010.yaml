source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καὶ ἐν τῇ πέμπτῃ⁴⁷ ἑβδομάδι⁴⁸ ἐπιστρέψουσιν εἰς γῆν ἐρημώσεως αὐτῶν, καὶ⁴⁹ ἀνακαινοποιήσουσιν οἶκον κυρίου⁵⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017/010.yaml
  text: And in the fifth week they will return to the land of their desolation, and they will renew the house of the Lord.
translation:
  language: de
  text: Und in der fünften Woche werden sie in das Land ihrer Verwüstung zurückkehren und das Haus des Herrn erneuern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑβδομάδι
  choice: Woche
  rationale: Die gewöhnliche Bedeutung ist „Woche“; der möglicherweise symbolische Zeitraum bleibt wie im Griechischen unausgelegt.
- source_word: γῆν ἐρημώσεως αὐτῶν
  choice: Land ihrer Verwüstung
  rationale: Die enge Genitivkonstruktion bewahrt die Mehrdeutigkeit, ob es um das verwüstete Land oder um die mit ihnen verbundene Verwüstung geht.
- source_word: ἀνακαινοποιήσουσιν
  choice: erneuern
  rationale: Gibt den Gedanken des Wieder-neu-Machens natürlich wieder, ohne die Handlung enger als Wiederaufbau oder religiöse Wiederherstellung festzulegen.
- source_word: οἶκον κυρίου
  choice: das Haus des Herrn
  rationale: Bewahrt die traditionelle und kontextuell offene Bezeichnung, die wahrscheinlich den Tempel meint, ohne dies ausdrücklich einzutragen.
theological_decisions:
- issue: Deutung der fünften Woche
  choice: „in der fünften Woche“ ohne Erklärung
  alternative: „im fünften Siebenjahreszeitraum“ oder eine andere chronologische Auslegung
  rationale: Der griechische Text nennt eine „Woche“, deren symbolische oder chronologische Bedeutung hier nicht ausdrücklich bestimmt wird.
- issue: Identität des Hauses des Herrn
  choice: „das Haus des Herrn“
  alternative: „den Tempel des Herrn“
  rationale: Die wörtlichere Form wahrt die Ausdrucksweise und lässt die kontextuelle Identifikation offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit naher Orientierung an der griechischen Satzstruktur. Keine Fußnoten erforderlich; daher enthält der Haupttext keine Marker.
