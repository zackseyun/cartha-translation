  text: Καὶ *τρίτον υἱὸν²³ ἔτεκέν μοι τὸν Μεραρεῖ²⁴ τῷ²⁵ τεσσαρακοστῷ²⁶ ἔτει²⁷ *τῆς ζωῆς μου²⁸, καὶ ἐπειδὴ²⁹ ἐδυστόκησεν ἡ μήτηρ αὐτοῦ ἐκάλεσα³⁰ αὐτὸν³¹ Μεραρεῖ³² ὅ ἐστι³³ *πικριασμός³⁴.
