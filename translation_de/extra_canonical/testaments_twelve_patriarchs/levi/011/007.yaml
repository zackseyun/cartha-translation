  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/007.yaml
  text: And a third son, Merari, was born to me in the fortieth year of my life; and because his mother had difficulty in childbirth, I called him Merari, which means bitterness.
translation:
  language: de
  text: Und im vierzigsten Jahr meines Lebens gebar mir seine Mutter einen dritten Sohn, Merari. Weil sie bei der Geburt Schwierigkeiten hatte, nannte ich ihn Merari; das heißt »Bitterkeit«.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδυστόκησεν
  choice: hatte eine schwere Geburt
  rationale: Gibt das schwierige Gebären natürlich und präzise wieder, ohne zusätzliche medizinische Einzelheiten einzutragen.
- source_word: πικριασμός
  choice: Verbitterung
  rationale: Das Substantiv bezeichnet einen Vorgang oder Zustand des Bitterwerdens bzw. der Verbitterung; »Verbitterung« wahrt diese Wortbildungsnuance besser als das allgemeinere »Bitterkeit«.
- source_word: ὅ ἐστι
  choice: das heißt
  rationale: Leitet hier die erklärende Deutung des Namens idiomatisch ein.
