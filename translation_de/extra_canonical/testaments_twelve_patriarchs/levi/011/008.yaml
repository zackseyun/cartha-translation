source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ἡ δὲ Ἰωχαβέδ³⁵ *ἐγεννήθη ἐν Αἰγύπτῳ τῷ ἑξηκοστῷ τετάρτῳ μου ἔτει³⁶, *ἔνδοξος γὰρ ἦν τότε ἐν μέσῳ τῶν ἀδελφῶν μου³⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/008.yaml
  text: And Jochebed was born in Egypt, in the sixty-fourth year of my life, for at that time I was illustrious among my brothers.
translation:
  language: de
  text: Jochebed aber wurde in Ägypten geboren, in meinem vierundsechzigsten Lebensjahr; denn damals war ich unter meinen Brüdern angesehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἰωχαβέδ
  choice: Jochebed
  rationale: Die im Deutschen gebräuchliche biblische Namensform wird verwendet.
- source_word: τῷ ἑξηκοστῷ τετάρτῳ μου ἔτει
  choice: in meinem vierundsechzigsten Lebensjahr
  rationale: Gibt die Altersangabe idiomatisch und genau wieder.
- source_word: ἔνδοξος
  choice: angesehen
  rationale: Bezeichnet hier hohes Ansehen beziehungsweise Ehre innerhalb der Brüder; „angesehen“ ist natürlich und vermeidet die im heutigen Deutsch stärker auf Ruhm zielende Konnotation von „berühmt“ oder „ruhmreich“.
- source_word: ἐν μέσῳ τῶν ἀδελφῶν μου
  choice: unter meinen Brüdern
  rationale: Natürliche deutsche Wiedergabe der sozialen Stellung innerhalb der Gruppe.
theological_decisions:
- issue: Begründender Zusammenhang von γάρ
  choice: „denn“ beibehalten
  alternative: Als lockeren erzählerischen Anschluss wiedergeben oder auslassen
  rationale: Der griechische Text stellt ausdrücklich einen begründenden Zusammenhang her, auch wenn dessen genaue Logik im Kontext spannungsvoll erscheint; diese Spannung wird nicht geglättet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den griechischen Satzbau, soweit dies natürlich bleibt. Die adversativ beziehungsweise fortführend wirkende Partikel δέ wird durch die Nachstellung „aber“ abgebildet.
