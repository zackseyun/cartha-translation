  source_fidelity: 'Die Übersetzung gibt alle Satzelemente des Griechischen sachgerecht wieder: δέ mit „aber“, ἐγεννήθη mit „wurde geboren“, die Orts- und Altersangabe sowie γάρ mit „denn“. „Angesehen“ ist eine idiomatische und kontextangemessene Wiedergabe von ἔνδοξος; die soziale Einordnung ἐν μέσῳ τῶν ἀδελφῶν μου wird treffend durch „unter meinen Brüdern“ ausgedrückt. Die im Ausgangstext erkennbare, kontextuell möglicherweise spannungsvolle Begründung bleibt erhalten.'
