  text: '*Καὶ εἶδον⁹ περὶ αὐτόν¹⁰, ὅτι οὐκ ἔστιν¹¹ ἐν τῇ¹² πρώτῃ τάξει.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/003.yaml
  text: And I saw concerning him that he was not in the first rank.
translation:
  language: de
  text: Und ich sah in Bezug auf ihn, dass er nicht zum ersten Rang gehörte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἶδον
  choice: ich sah
  rationale: Gibt den Aorist von ὁράω schlicht und unmittelbar wieder.
- source_word: περὶ αὐτόν
  choice: in Bezug auf ihn
  rationale: Bewahrt die relationale Bedeutung von περί mit Akkusativ, ohne sie stärker als nötig zu konkretisieren.
- source_word: οὐκ ἔστιν
  choice: er nicht … war
  rationale: Im Deutschen wird das griechische historische Präsens im Rahmen der Vergangenheitsvision natürlich als Präteritum wiedergegeben.
- source_word: ἐν τῇ πρώτῃ τάξει
  choice: in der ersten Rangordnung
  rationale: τάξις kann Rang, Ordnung oder geordnete Abteilung bezeichnen; „Rangordnung“ hält sowohl den hierarchischen als auch den strukturellen Aspekt offen.
theological_decisions:
- issue: Bedeutung der „ersten τάξις“
  choice: erste Rangordnung
  alternative: erster Rang / erste Abteilung
  rationale: Der knappe Kontext bestimmt nicht eindeutig, ob eine Rangstufe, eine geordnete Klasse oder eine Abteilung gemeint ist. Die Übersetzung vermeidet eine spezifische angelologische oder priesterliche Deutung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; der etwas formelle Ausdruck „in Bezug auf ihn“ bewahrt die syntaktische und semantische Zurückhaltung des griechischen Textes.
