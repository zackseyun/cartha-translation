  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/002.yaml
  text: And she conceived and bore a son, and I called his name Gersam, because we were in a land of sojourning.
translation:
  language: de
  text: Und sie wurde schwanger und gebar einen Sohn. Ich gab ihm den Namen Gersam, denn wir lebten in einem Land der Fremde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συλλαβοῦσα
  choice: sie wurde schwanger
  rationale: Gibt das griechische Partizip idiomatisch und in natürlicher zeitlicher Abfolge wieder.
- source_word: ἐκάλεσα τὸ ὄνομα αὐτοῦ
  choice: ich gab ihm den Namen
  rationale: Natürliches modernes Deutsch für die semitisch geprägte griechische Namensformel.
- source_word: Γηρσάμ
  choice: Gersam
  rationale: Folgt der Namensform des vorgelegten griechischen Textes und der konsultierten englischen Fassung.
- source_word: ἐν γῇ παροικίας
  choice: in einem fremden Land
  rationale: Gibt den Sinn des Aufenthalts außerhalb der Heimat verständlich wieder; die zusätzliche Vorstellung des Fremdseins wird durch „als Fremde“ ausgedrückt.
- source_word: ἦμεν
  choice: wir lebten
  rationale: Im Zusammenhang eines Aufenthaltsortes ist dies natürlicher als das wörtliche „wir waren“.
