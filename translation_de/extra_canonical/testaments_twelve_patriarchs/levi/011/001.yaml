  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/001.yaml
  text: When I took a wife, I was twenty-eight years old, and her name was Melcha.
translation:
  language: de
  text: Als ich nun eine Frau heiratete, war ich achtundzwanzig Jahre alt; ihr Name war Melcha.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαβον γυναῖκα
  choice: eine Frau heiratete
  rationale: Die wörtliche Wendung „eine Frau nahm“ bezeichnet idiomatisch die Eheschließung; „heiratete“ gibt dies im modernen Deutschen natürlich und präzise wieder.
- source_word: ὑπῆρχον
  choice: war ich
  rationale: Das Verb bezeichnet hier schlicht Levis damaliges Alter; „war ich“ ist die natürliche deutsche Wiedergabe.
- source_word: Μελχά
  choice: Melcha
  rationale: Der griechische Eigenname wird entsprechend der konsultierten englischen Fassung und in gut erkennbarer Form als „Melcha“ wiedergegeben.
