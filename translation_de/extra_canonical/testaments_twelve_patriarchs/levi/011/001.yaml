  text: Ὅτε οὖν *ἔλαβον γυναῖκα, ἐγὼ εἴκοσι καὶ ὀκτὼ ἐτῶν ὑπῆρχον², *ἦν δὲ αὐτῇ ὄνομα Μελχά³.
