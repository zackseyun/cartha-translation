lexical_decisions:
- source_word: ὁ Καάθ
  choice: Kehat
  rationale: Die im modernen deutschen Bibelgebrauch übliche Namensform für den Sohn Levis.
- source_word: ἐν τῷ τριακοστῷ πέμπτῳ ἔτει τῆς ζωῆς μου
  choice: im fünfunddreißigsten Jahr meines Lebens
  rationale: Gibt die Altersangabe eng am griechischen Wortlaut und zugleich natürlich auf Deutsch wieder.
- source_word: πρὸς ἀνατολὰς ἡλίου
  choice: gegen Sonnenaufgang
  rationale: Bewahrt die Bildsprache und die mögliche zeitliche beziehungsweise räumliche Lesart der griechischen Wendung, ohne sie vorschnell aufzulösen.
