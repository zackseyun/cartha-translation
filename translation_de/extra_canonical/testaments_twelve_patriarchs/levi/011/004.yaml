  naturalness: „Gegen Sonnenaufgang“ ist verständlich, wirkt im modernen Standarddeutsch aber ungewohnt und kann leicht temporal verstanden werden. „Nach Osten hin“ ist klarer und bewahrt die im griechischen Satz auffällige Richtungsangabe.
  terminology: „Kehat“ entspricht der üblichen deutschen biblischen Namensform für Καάθ. Die Formulierung „im fünfunddreißigsten Jahr meines Lebens“ ist angemessen und genau.
