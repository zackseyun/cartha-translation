source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Διὰ τοῦτο ἐκάλεσα τὸ ὄνομα αὐτοῦ Καάθ²¹, [ὅ ἐστιν ἀρχὴ μεγαλείου καὶ συμβιβασμός]²².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/006.yaml
  text: Therefore I called his name Kohath, [which is, the beginning of majesty and uniting].
translation:
  language: de
  text: 'Darum gab ich ihm den Namen Kehat[a], [das heißt: Anfang der Hoheit und Verbindung].[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: Kaath; gemeint ist Kehat.'
    reason: Dokumentiert die Namensform des griechischen Ausgangstextes und erklärt die übliche deutsche Form.
  - marker: b
    text: Der in eckigen Klammern stehende Satzteil ist in der zugrunde gelegten Edition textkritisch gekennzeichnet. „Verbindung“ kann auch „Vereinigung“, „Zusammenfügung“ oder „Verständigung“ bedeuten.
    reason: Macht die editorische Kennzeichnung sowie den Bedeutungsraum von συμβιβασμός transparent.
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Darum
  rationale: Gibt die folgernde Bedeutung knapp und natürlich wieder.
- source_word: ἐκάλεσα τὸ ὄνομα αὐτοῦ
  choice: gab ich ihm den Namen
  rationale: Natürliche deutsche Wiedergabe der semitisch geprägten griechischen Namengebungsformel.
- source_word: Καάθ
  choice: Kehat
  rationale: Verwendet die im Deutschen geläufige biblische Namensform.
- source_word: ἀρχὴ μεγαλείου
  choice: Anfang der Hoheit
  rationale: Bewahrt die substantivische Form und den weiten Bedeutungsraum von μεγαλείον, ohne ihn als Herrschaft oder Majestät enger festzulegen.
- source_word: συμβιβασμός
  choice: Verbindung
  rationale: Das Wort kann Verbindung, Vereinigung, Zusammenfügung oder Verständigung bezeichnen. „Verbindung“ wahrt hier die Mehrdeutigkeit und ergänzt kein im vorgelegten griechischen Text stehendes „aller“.
theological_decisions:
- issue: Deutung der Namensetymologie
  choice: Die überlieferte Erklärung wird wörtlich als „Anfang der Hoheit und Verbindung“ wiedergegeben.
  alternative: Eine ausdrückliche Deutung als „Vereinigung aller“ oder „Versöhnung“
  rationale: Der vorgelegte griechische Text enthält weder πάσης noch πάντων. Eine umfassende oder heilsgeschichtliche Deutung wäre daher textlich nicht hinreichend abgesichert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Namengebungsformel ist idiomatisch formuliert; die ungewöhnliche Etymologie bleibt bewusst knapp und mehrdeutig.
