review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt alle lexikalischen Bestandteile wieder: die Vision (ἐν ὁράματι), das Stehen, die ganze Versammlung und die räumlich offene Wendung ἐν ὑψηλοῖς. Die Stellung von „in den Höhen“ vor „mitten in der ganzen Versammlung“ legt jedoch im Deutschen stärker eine zusammenhängende Ortsangabe nahe, während die knappe und syntaktisch nicht völlig eindeutige griechische Wortfolge die beiden Angaben eher nebeneinanderstellt. Die Revision bewahrt diese Offenheit.'
  naturalness: '„Und ich sah in einer Vision: Er stand inmitten der ganzen Versammlung, in den Höhen.“ ist modernes, würdiges Standarddeutsch und bildet die knappe visionäre Aussage natürlich ab.'
  terminology: „Versammlung“ ist für συναγωγή angemessen und vermeidet eine institutionelle Engführung. „In den Höhen“ erhält die bewusst nicht näher bestimmte Pluralform ἐν ὑψηλοῖς; weder „im Himmel“ noch eine Rangdeutung wird eingeführt.
  issues:
  - severity: low
    issue: Stellung der Ortsangaben
    rationale: Die gegenwärtige Reihenfolge „in den Höhen mitten in der ganzen Versammlung“ kann die beiden Ortsangaben im Deutschen enger verknüpfen als der griechische Text verlangt. Eine nachgestellte Apposition bewahrt die offene Zuordnung besser.
  - severity: low
    issue: Quellenanker 20
    rationale: Der griechische Editionsauszug trägt einen Anker 20 bei συναγωγῆς, aber der Inhalt dieser Editionsanmerkung wurde nicht bereitgestellt. Daher kann keine inhaltlich verantwortbare deutsche Fußnote erstellt werden; die Übersetzung selbst darf nicht mit einer erfundenen Anmerkung ergänzt werden.
  revised_text: 'Und ich sah in einer Vision: Er stand inmitten der ganzen Versammlung, in den Höhen.'
  revised_footnotes: []
  revision_rationale: Die Satzstellung wird an die offene Reihung des griechischen Textes und den englischen Audit-Trail angenähert. Die Übersetzung bleibt bei „Versammlung“ und „in den Höhen“ und fügt keine Auslegung hinzu. Der bloße Editionsanker kann ohne seinen überlieferten Anmerkungstext nicht sinnvoll oder sicher als Fußnote reproduziert werden.
