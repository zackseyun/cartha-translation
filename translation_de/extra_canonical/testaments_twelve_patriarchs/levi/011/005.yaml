source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καὶ εἶδον ἐν ὁράματι· μέσος ἐν ὑψηλοῖς ἵστατο πάσης τῆς συναγωγῆς²⁰.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011/005.yaml
  text: And I saw in the vision that he stood in the midst of the congregation, in the heights.
translation:
  language: de
  text: Und ich sah in einer Vision, dass er in den Höhen mitten in der ganzen Versammlung stand.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ὁράματι
  choice: in einer Vision
  rationale: Die artikellose griechische Wendung bezeichnet die visionäre Wahrnehmung; die unbestimmte Form ist im modernen Deutsch natürlich.
- source_word: ἐν ὑψηλοῖς
  choice: in den Höhen
  rationale: Die räumliche Formulierung wird ausdrücklich wiedergegeben, ohne sie deutend auf Himmel, erhöhte Plätze oder Rang zu verengen.
- source_word: πάσης τῆς συναγωγῆς
  choice: der ganzen Versammlung
  rationale: συναγωγή bezeichnet hier allgemein eine versammelte Gemeinschaft; „Versammlung“ vermeidet eine unbegründete Festlegung auf eine spätere institutionelle Bedeutung.
- source_word: μέσος … ἵστατο
  choice: mitten … stand
  rationale: Gibt die Stellung in der Mitte idiomatisch und zugleich eng am griechischen Ausdruck wieder.
theological_decisions:
- issue: Deutung von „in den Höhen“
  choice: Die räumlich offene Wendung „in den Höhen“ bleibt erhalten.
  alternative: „im Himmel“ oder „an einem erhöhten Ort“
  rationale: Der griechische Plural ὑψηλοῖς legt keine dieser präziseren Deutungen eindeutig fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung hält sowohl die Versammlung als auch die nicht näher bestimmten „Höhen“ sichtbar, ohne die knappe Vision sprachlich auszuschmücken.
