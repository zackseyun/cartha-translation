  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/011.yaml
  text: 1[a]. When I took a wife, I was twenty-eight years old, and her name was Melcha. 2. And she conceived and bore a son, and I called his name Gersam, because we were in a land of sojourning. 3. And I saw concerning him that he was not in the first rank. 4. And Kohath was born in the thirty-fifth year of my life, and I saw in a vision, toward the sunrise, 5. that he stood in the midst of the congregation[b], in the heights. 6. Therefore I called his name Kohath, which is, beginning of majesty and assembly. 7. And a third son, Merari, was born to me in the fortieth year of my life; and because his mother bore him with difficulty, I called him Merari, which is bitterness. 8. And Jochebed was born in Egypt, in the sixty-fourth year of my life, for at that time I was illustrious among my brothers.
translation:
  language: de
  text: '1 Als ich eine Frau nahm, war ich achtundzwanzig Jahre alt; sie hieß Melcha. 2 Sie wurde schwanger und gebar einen Sohn, und ich gab ihm den Namen Gerscham, weil wir in einem Land als Fremde lebten. 3 Über ihn erkannte ich, dass er nicht zum ersten Rang gehörte.


    4 Kehat wurde im fünfunddreißigsten Jahr meines Lebens gegen Sonnenaufgang geboren. 5 In einer Vision sah ich, dass er in den Höhen inmitten der ganzen Versammlung stand. 6 Darum gab ich ihm den Namen Kehat, das heißt: »Anfang der Hoheit und Zusammenfügung«.[a]


    7 Als dritten Sohn gebar sie mir im vierzigsten Jahr meines Lebens Merari. Weil seine Mutter bei der Geburt große Mühe hatte, gab ich ihm den Namen Merari, das heißt: »Bitterkeit«.


    8 Jochebed wurde im vierundsechzigsten Jahr meines Lebens in Ägypten geboren; denn damals war ich unter meinen Brüdern hoch angesehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Erklärung des Namens Kehat ist im griechischen Text schwer verständlich und möglicherweise textlich gestört. Die Übersetzung folgt dem erhaltenen Wortlaut, ohne ihn zu einer eindeutigeren Aussage umzuformen.
    reason: textual_variant
lexical_decisions:
- source_word: ἔλαβον γυναῖκα
  choice: nahm ich eine Frau
  rationale: Die semitisch geprägte griechische Wendung bezeichnet die Eheschließung. Die etwas feierlichere Formulierung bewahrt den testamentarisch-biblischen Ton, ohne unverständlich zu sein.
- source_word: ἐν γῇ παροικίας
  choice: in einem fremden Land lebten
  rationale: παροικία bezeichnet das Leben als Fremder beziehungsweise ansässiger Nichtbürger. Die Übersetzung gibt den Sinn in natürlichem heutigem Deutsch wieder, ohne ausdrücklich Exil vorauszusetzen.
- source_word: πρώτῃ τάξει
  choice: zum ersten Rang gehörte
  rationale: τάξις kann Rang, Ordnung oder Stellung bedeuten. Die Formulierung bewahrt die Aussage über Vorrang, ohne sie auf eine bestimmte spätere priesterliche Hierarchie festzulegen.
- source_word: πρὸς ἀνατολὰς ἡλίου
  choice: gegen Sonnenaufgang
  rationale: Die Wendung lautet wörtlich etwa »gegen die Aufgänge der Sonne«. »Gegen Sonnenaufgang« erhält die mögliche zeitliche und räumliche Färbung und folgt der griechischen Stellung beim Bericht von Kehats Geburt.
- source_word: ἐν ὑψηλοῖς
  choice: in den Höhen
  rationale: Der substantivierte Plural bezeichnet erhöhte oder himmlische Bereiche. »In den Höhen« bewahrt die visionäre Offenheit, ohne eine genauere Kosmologie einzutragen.
- source_word: συναγωγῆς
  choice: Versammlung
  rationale: Das Wort bezeichnet eine versammelte Gemeinschaft. »Versammlung« ist im Deutschen verständlich und lässt offen, ob eine irdische Gemeinde oder eine himmlische Versammlung gemeint ist.
- source_word: ἀρχὴ μεγαλείου καὶ συμβιβασμός
  choice: Anfang der Hoheit und Zusammenfügung
  rationale: Die Namenserklärung ist textlich und semantisch schwierig. Die Wiedergabe bleibt eng beim erhaltenen Wortlaut; συμβιβασμός kann ein Zusammenbringen, Verbinden oder Zusammenfügen bezeichnen.
- source_word: πικριασμός
  choice: Bitterkeit
  rationale: Dies ist die naheliegende Bedeutung des seltenen Ausdrucks und erhält die im Text ausdrücklich gebotene Namenserklärung.
- source_word: ἔνδοξος
  choice: hoch angesehen
  rationale: Das Adjektiv bezeichnet Ansehen, Ehre oder Auszeichnung. »Hoch angesehen« klingt im modernen Deutsch natürlicher als »ruhmreich« und vermeidet eine unnötig theologische Färbung.
theological_decisions:
- issue: Levis visionäre Beurteilung von Gerscham und Kehat
  choice: Die Aussagen werden als knappe visionäre Hinweise auf Rang und Erhöhung wiedergegeben.
  alternative: Sie ausdrücklich als Vorhersage einer späteren levitischen oder priesterlichen Rangordnung zu deuten.
  rationale: Der griechische Text deutet Vorrang und eine erhöhte Stellung an, benennt aber keine ausgearbeitete spätere Hierarchie. Diese Spannung bleibt offen.
- issue: Ort und Art der Versammlung in Kehats Vision
  choice: »in den Höhen inmitten der ganzen Versammlung«
  alternative: Die Versammlung ausdrücklich als himmlischen Rat oder als irdische Kultgemeinde zu bestimmen.
  rationale: Der Text verbindet die Höhen mit der Versammlung, legt deren genaue Identität jedoch nicht eindeutig fest.
translation_notes:
  register: 'Modernes, würdiges Standarddeutsch mit leicht biblischem Erzählton. Die Verszählung und der Übergang von Vers 4 zu Vers 5 folgen vorrangig dem griechischen Wortlaut: Die Angabe »gegen Sonnenaufgang« bleibt bei Kehats Geburt, während die Vision erst in Vers 5 eingeführt wird. Ungewöhnliche Namenserklärungen werden nicht geglättet.'
