source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *ἀπεκρίθησαν αὐτῷ οἱ υἱοὶ αὐτοῦ λέγοντες⁸. Ἐνώπιον κυρίου πορευσόμεθα⁹ ⌜καὶ⌝¹⁰ κατὰ τὸν νόμον αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/019/002.yaml
  text: And his sons answered him, saying, “Before the Lord we will walk according to his law.”
translation:
  language: de
  text: 'Und seine Söhne antworteten ihm: »Vor dem Herrn werden wir nach seinem Gesetz leben.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im griechischen Text ist ein zusätzliches »und« vor »nach seinem Gesetz« textlich unsicher.
    reason: Die Edition kennzeichnet καί an dieser Stelle als unsicheren Textbestandteil.
lexical_decisions:
- source_word: πορευσόμεθα
  choice: werden wir … leben
  rationale: Das Verb bedeutet wörtlich »wir werden gehen«, bezeichnet hier aber die Lebensführung. »Leben« gibt diesen Sinn in natürlichem modernem Deutsch wieder.
- source_word: Ἐνώπιον κυρίου
  choice: vor dem Herrn
  rationale: Bewahrt die räumlich formulierte Vorstellung eines Lebens in der Gegenwart und unter den Augen des Herrn.
- source_word: κατὰ τὸν νόμον αὐτοῦ
  choice: nach seinem Gesetz
  rationale: Gibt die Norm oder Richtschnur der Lebensführung knapp und idiomatisch wieder.
theological_decisions:
- issue: Verhältnis von Gottes Gegenwart und Gesetzestreue
  choice: Beide Bestimmungen werden gemeinsam auf die Lebensführung bezogen.
  alternative: 'Die textlich unsichere Konjunktion könnte die beiden Aussagen stärker voneinander absetzen: »vor dem Herrn leben und nach seinem Gesetz«.'
  rationale: Die Übersetzung wahrt beide Aspekte, ohne über den knappen griechischen Wortlaut hinaus eine besondere theologische Beziehung zwischen ihnen festzulegen.
translation_notes:
  register: Modernes, gut verständliches und zugleich würdevolles Standarddeutsch. Die idiomatische Wendung »nach seinem Gesetz leben« vermeidet das heute altertümlich wirkende »wandeln«, ohne den ethischen Sinn von πορεύομαι abzuschwächen.
