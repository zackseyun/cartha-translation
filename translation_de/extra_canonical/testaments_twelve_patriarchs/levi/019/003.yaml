  to: 'Und ihr Vater sagte zu ihnen: »Der Herr ist Zeuge, und seine Engel sind Zeugen; auch ihr seid Zeugen, und ich bin Zeuge über das Wort aus eurem Mund.« Und seine Söhne sagten zu ihm: »Wir sind Zeugen.«'
  rationale: Ausschließlich die deutsche Wiedergabe von περὶ wird von „für“ zu „über“ geändert, damit die bezeugte Aussage als Gegenstand des Zeugnisses erkennbar bleibt. Die Singularform „Wort“, die Wiederholung von „Zeuge/Zeugen“ sowie die natürliche Auflösung der griechischen Ellipse bleiben erhalten.
