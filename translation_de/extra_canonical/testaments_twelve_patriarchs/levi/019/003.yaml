base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/019/003.yaml
  text: And their father said to them, “The Lord is witness, and his angels are witnesses, and you are witnesses, and I am a witness concerning the word of your mouth.” And his sons said to him, “We are witnesses.”
translation:
  language: de
  text: 'Und ihr Vater sagte zu ihnen: »Der Herr ist Zeuge, und seine Engel sind Zeugen; auch ihr seid Zeugen, und ich bin Zeuge über das Wort aus eurem Mund.« Und seine Söhne sagten zu ihm: »Wir sind Zeugen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μάρτυς / μάρτυρες
  choice: Zeuge / Zeugen
  rationale: Die unmittelbare forensische Bedeutung wird durchgehend beibehalten; die Wiederholung ist im Griechischen rhetorisch prägend und wird nicht geglättet.
- source_word: περὶ τοῦ λόγου τοῦ στόματος ὑμῶν
  choice: für das Wort aus eurem Mund
  rationale: Gibt die semitisch gefärbte griechische Wendung verständlich und zugleich relativ formnah wieder; »Wort« bleibt im Singular erhalten.
- source_word: Μάρτυρες
  choice: Wir sind Zeugen
  rationale: Der griechische Einwortsatz ist elliptisch. Die Ergänzung von Subjekt und Kopula ergibt im Deutschen eine natürliche, eindeutige Antwort, ohne den Sinn auszuweiten.
theological_decisions:
- issue: Der Herr, die Engel und die Anwesenden als Zeugen
  choice: Die mehrfache Zeugenschaft wird ohne Abschwächung oder erklärende Ergänzung wiedergegeben.
  alternative: Die Engel nur als feierliche Begleiter oder Bürgen umschreiben.
  rationale: Der griechische Text bezeichnet alle ausdrücklich als Zeugen; eine nähere Bestimmung ihrer jeweiligen Rolle wäre interpretierend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die wiederholte Zeugenformel und die parallele Satzstruktur des Ausgangstextes bleiben bewusst hörbar.
