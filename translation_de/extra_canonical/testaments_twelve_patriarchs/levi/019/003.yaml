  source_fidelity: Die Übersetzung gibt die Zeugenformel, ihre rhetorische Wiederholung und die elliptische Schlussantwort sachgerecht wieder. Die Präposition περὶ bedeutet jedoch hier „über/in Bezug auf“; „Zeuge für“ kann im Deutschen missverständlich im Sinn von „Fürsprecher für“ verstanden werden.
  naturalness: Modernes, würdiges Standarddeutsch. Die Ergänzung „Wir sind“ in der abschließenden Antwort ist natürlich und entspricht der elliptischen griechischen Prädikation.
  terminology: „Herr“, „Engel“ und „Zeuge/Zeugen“ sind treffend und konsistent. Für περὶ τοῦ λόγου τοῦ στόματος ὑμῶν ist „über das Wort aus eurem Mund“ semantisch genauer als „für das Wort aus eurem Mund“.
