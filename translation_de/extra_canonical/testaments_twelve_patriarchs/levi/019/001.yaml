id: T12P.LEV.19.1
reference: Testament of Levi 19:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ νῦν, τέκνα μου¹, πάντα ἠκούσατε². Ἐκλέξασθε³ ἑαυτοῖς *ἢ τὸ φῶς ἢ τὸ σκότος⁴, ἢ τὸν⁵ νόμον⁶ κυρίου, ἢ *τὰ ἔργα τοῦ Βελίαρ⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/019/001.yaml
  text: And now, my children, you have heard everything. Choose for yourselves either the light or the darkness, either the law of the Lord or the works of Beliar.
translation:
  language: de
  text: Und nun, meine Kinder, habt ihr alles gehört. Wählt für euch entweder das Licht oder die Finsternis, entweder das Gesetz des Herrn oder die Werke Beliars.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τέκνα μου
  choice: meine Kinder
  rationale: Gibt die familiäre Anrede natürlich und würdevoll wieder.
- source_word: πάντα ἠκούσατε
  choice: habt ihr alles gehört
  rationale: Bewahrt Zeitform, Wortlaut und umfassenden Bezug des griechischen Ausdrucks.
- source_word: Ἐκλέξασθε ἑαυτοῖς
  choice: Wählt für euch
  rationale: Erhält den imperativischen Aufruf und den reflexiven Dativ, ohne ihn deutend zu erweitern.
- source_word: τὸ φῶς … τὸ σκότος
  choice: das Licht … die Finsternis
  rationale: Bewahrt den symbolischen Gegensatz; „Finsternis“ entspricht dem feierlichen Register besser als „Dunkelheit“.
- source_word: νόμον κυρίου
  choice: das Gesetz des Herrn
  rationale: Formale und theologisch offene Wiedergabe des Genitivs ohne zusätzliche Bestimmung.
- source_word: τὰ ἔργα τοῦ Βελίαρ
  choice: die Werke Beliars
  rationale: Gibt den Genitiv knapp wieder und behandelt Beliar entsprechend dem Kontext als Eigennamen.
theological_decisions:
- issue: Gegenüberstellung von Gesetz und Werken
  choice: „das Gesetz des Herrn“ gegenüber „den Werken Beliars“
  alternative: deutende Ergänzungen wie „Gehorsam gegenüber dem Gesetz“ oder „böse Taten“
  rationale: Die asymmetrische Formulierung des griechischen Textes wird bewahrt, ohne ihre theologische Aussage zu harmonisieren.
- issue: Name Βελίαρ
  choice: Beliar
  alternative: Belial
  rationale: Die griechische Namensform Βελίαρ wird direkt wiedergegeben; eine Angleichung an die geläufigere hebräisch geprägte Form „Belial“ würde die konkrete Textgestalt verändern.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Ton. Die parallele Entweder-oder-Struktur und die knappe eindringliche Aufforderung des griechischen Textes bleiben erhalten.
