lexical_decisions:
- source_word: ἔξυπνος γενόμενος
  choice: als ich erwachte
  rationale: Die griechische Wendung bezeichnet das Erwachen bzw. Wachwerden; die temporale Wiedergabe ist im Deutschen natürlich und entspricht dem Zusammenhang.
- source_word: εὐλόγησα
  choice: pries ich
  rationale: Im Blick auf Gott bedeutet εὐλογέω hier »preisen/loben«. »Pries« ist idiomatischer als das missverständliche »segnete«.
- source_word: τὸν ὕψιστον
  choice: den Höchsten
  rationale: Bewahrt den substantivierten Gottesbegriff des griechischen Textes in geläufiger, würdiger Form.
