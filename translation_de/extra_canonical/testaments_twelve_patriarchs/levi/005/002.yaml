  text: And he said to me, “Levi, to you I have given the blessings of the priesthood until I come and dwell in the midst of Israel.”
translation:
  language: de
  text: 'Und er sagte zu mir: „Levi, dir habe ich die Segnungen des Priestertums gegeben, bis ich komme und mitten unter Israel wohne.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰς εὐλογίας τῆς ἱερατείας
  choice: die Segnungen des Priestertums
  rationale: Gibt den bestimmten Plural εὐλογίας und den Genitiv ἱερατείας formal wie natürlich wieder, ohne den Ausdruck auf ein einzelnes Vorrecht einzuengen.
- source_word: ἕως ἐλθὼν κατοικήσω
  choice: bis ich komme und … wohne
  rationale: Bewahrt die zeitliche Begrenzung durch ἕως und gibt das Partizip ἐλθών im Deutschen idiomatisch als koordinierte Handlung wieder.
- source_word: ἐν μέσῳ τοῦ Ἰσραήλ
  choice: mitten unter Israel
  rationale: Natürliches modernes Deutsch für die räumlich-gemeinschaftliche Wendung; lässt offen, ob Israel als Volk oder Gemeinschaft im Blick ist.
theological_decisions:
- issue: Bezug des göttlichen Wohnens auf Israel
  choice: mitten unter Israel wohne
  alternative: in der Mitte Israels Wohnung nehme
  rationale: Die gewählte Fassung bewahrt die Aussage des Textes, ohne Identität, Zeitpunkt oder Art des Kommens und Wohnens näher zu bestimmen.
translation_notes:
  register: Moderne, würdige Standardsprache; der direkte Zuspruch und die feierliche priesterliche Terminologie bleiben erhalten.
