source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Εἶπον δὲ αὐτῷ³⁰· Δέομαί σου³¹, Κύριε³², *δίδαξόν με³³ τὸ ὄνομά σου ἵνα³⁴ ἐπικαλέσομαί³⁵ σε³⁶ ἐν ἡμέρᾳ θλίψεως³⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/005.yaml
  text: And I said to him, “I beg you, Lord, teach me your name, so that I may call on you in the day of affliction.”
translation:
  language: de
  text: 'Und ich sagte zu ihm: »Ich bitte dich, Herr, lehre mich deinen Namen, damit ich dich am Tag der Bedrängnis anrufen kann.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Δέομαί σου
  choice: ich bitte dich
  rationale: Gibt die dringliche, ehrerbietige Bitte natürlich und quellennah wieder; „ich flehe dich an“ wäre stärker als im Kontext zwingend erforderlich.
- source_word: δίδαξόν με τὸ ὄνομά σου
  choice: lehre mich deinen Namen
  rationale: Bewahrt die konkrete Ausdrucksweise des Griechischen und ihre mögliche Bedeutung, den Namen mitgeteilt bzw. erkennen gelehrt zu bekommen.
- source_word: ἐπικαλέσομαί σε
  choice: ich dich … anrufen kann
  rationale: „Anrufen“ ist die natürliche religiöse Wiedergabe von ἐπικαλέομαι mit einer angerufenen Person als Objekt.
- source_word: ἐν ἡμέρᾳ θλίψεως
  choice: am Tag der Bedrängnis
  rationale: Folgt dem singularischen Ausdruck mit bestimmter, zugespitzter Bedeutung; „Bedrängnis“ wahrt den Sinn von äußerer oder innerer Not.
theological_decisions:
- issue: Anrede Κύριε
  choice: Herr
  alternative: mein Herr
  rationale: Das Griechische hat keinen Possessivartikel; „Herr“ lässt offen, ob die Anrede göttliche Verehrung oder ehrerbietige Anrede eines himmlischen Wesens ausdrückt.
- issue: Bedeutung des Namens
  choice: wörtlich „deinen Namen“
  alternative: wer du bist
  rationale: Die wörtliche Fassung bewahrt die mögliche theologische Tragweite des Namens, ohne sie auf bloße Identität oder Wesenskenntnis festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die direkte Rede bleibt feierlich, aber für heutige Leser verständlich; echte Deutungsspielräume des griechischen Textes werden nicht konfessionell aufgelöst.
