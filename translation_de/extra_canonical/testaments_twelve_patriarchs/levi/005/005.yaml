  source_fidelity: 'Die Übersetzung gibt den griechischen Wortlaut vollständig und zutreffend wieder: εἶπον („ich sagte“), δέομαί σου („ich bitte dich“), Κύριε („Herr“), δίδαξόν με τὸ ὄνομά σου („lehre mich deinen Namen“) sowie den Finalsatz mit ἐπικαλέσομαί σε („damit ich dich anrufen kann“). „Am Tag der Bedrängnis“ ist eine angemessene, idiomatische Wiedergabe von ἐν ἡμέρᾳ θλίψεως und steht im Einklang mit dem englischen Audit-Text.'
