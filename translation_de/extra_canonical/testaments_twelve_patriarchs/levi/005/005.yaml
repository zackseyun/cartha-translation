  terminology: „Herr“ bewahrt die offenere Anrede Κύριε ohne den nicht im Griechischen stehenden Possessivzusatz. „Deinen Namen“ erhält die wörtliche und möglicherweise theologisch gewichtige Formulierung. „Bedrängnis“ ist ein passender gehobener, aber verständlicher Ausdruck für θλίψις.
