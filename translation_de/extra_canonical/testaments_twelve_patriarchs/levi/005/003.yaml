base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/003.yaml
  text: Then the angel brought me down to the earth and gave me a weapon and a sword, and said to me, “Execute vengeance in Shechem for Dinah your sister, and I will be with you, because the Lord has sent me.”
translation:
  language: de
  text: 'Da brachte mich der Engel auf die Erde hinab und gab mir eine Waffe und ein Schwert. Er sagte zu mir: »Übe in Sichem Vergeltung für deine Schwester Dina. Ich werde mit dir sein, denn der Herr hat mich gesandt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατήγαγέν με ἐπὶ τὴν γῆν
  choice: brachte mich … zur Erde hinab
  rationale: Gibt die Abwärtsbewegung von κατάγω und das Ziel ἐπὶ τὴν γῆν natürlich und genau wieder.
- source_word: ὅπλον
  choice: Waffe
  rationale: ὅπλον bezeichnet allgemein eine Waffe beziehungsweise Kriegsausrüstung; »Schild« wäre hier unnötig eng und textlich nicht gesichert.
- source_word: ῥομφαίαν
  choice: Schwert
  rationale: ῥομφαία kann eine große Klinge oder ein Schwert bezeichnen; »Schwert« ist im Deutschen verständlich und wahrt die Unterscheidung von der allgemeinen »Waffe«.
- source_word: Ποίησον ἐκδίκησιν
  choice: Übe … Vergeltung
  rationale: Die feste deutsche Wendung gibt den ausdrücklichen Auftrag zur ἐκδίκησις wieder, ohne ihn abzuschwächen oder durch moderne Rechtssprache zu überdeuten.
- source_word: ἐν Συχὲμ
  choice: in Sichem
  rationale: Bewahrt die Ortsangabe des griechischen Textes.
- source_word: ὑπὲρ Δείνας τῆς ἀδελφῆς σου
  choice: für deine Schwester Dina
  rationale: Natürliches Deutsch, das sowohl die Bezugnahme zugunsten Dinas als auch das Verwandtschaftsverhältnis vollständig erhält.
theological_decisions:
- issue: Begründung der Begleitung durch den Engel
  choice: »Ich werde mit dir sein, denn der Herr hat mich gesandt.«
  alternative: »Ich werde mit dir sein, weil der Herr mich gesandt hat.«
  rationale: Die Übersetzung bewahrt die Aussage des Textes, dass Sendung und Beistand des Engels auf den Herrn zurückgehen, ohne das genaue logische Verhältnis weiter auszudeuten.
- issue: Gewalt- und Vergeltungssprache
  choice: Direkte Wiedergabe als göttlich autorisierter Auftrag innerhalb der Erzählung
  alternative: Abschwächung zu »verschaffe Dina Recht«
  rationale: Der griechische Imperativ Ποίησον ἐκδίκησιν verlangt eine deutliche Vergeltungsaussage; eine ethische Harmonisierung oder Abschwächung wäre nicht quellengerecht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Sätze erhöhen die Klarheit der direkten Rede. Die Eigennamen folgen den geläufigen deutschen biblischen Formen »Sichem« und »Dina«.
