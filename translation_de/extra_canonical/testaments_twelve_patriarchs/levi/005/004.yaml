source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ συνετέλεσα†²⁵ τῷ καιρῷ ἐκείνῳ *τοὺς υἱοὺς²⁶ Ἐμμώρ²⁷, καθὼς γέγραπται ἐν πλαξὶ²⁸ τῶν πατέρων²⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/004.yaml
  text: And in that time I destroyed the sons of Hamor, as it is written on the tablets of the fathers.
translation:
  language: de
  text: Und zu jener Zeit vernichtete ich die Söhne Hamors, wie es auf den Tafeln der Väter geschrieben steht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνετέλεσα
  choice: vernichtete ich
  rationale: Das Verb kann „vollenden, zu Ende bringen“ und im feindlichen Zusammenhang „vernichten“ bedeuten. Der Kontext und die überlieferte englische Fassung stützen hier die konkrete Bedeutung „vernichten“.
- source_word: τῷ καιρῷ ἐκείνῳ
  choice: zu jener Zeit
  rationale: Natürliche und zugleich genaue Wiedergabe der griechischen Zeitangabe.
- source_word: τοὺς υἱοὺς Ἐμμώρ
  choice: die Söhne Hamors
  rationale: υἱούς wird wörtlich mit „Söhne“ wiedergegeben; der Name wird in der im Deutschen biblisch geläufigen Form „Hamor“ transliteriert.
- source_word: ἐν πλαξὶ τῶν πατέρων
  choice: auf den Tafeln der Väter
  rationale: Bewahrt die konkrete Bildsprache des Griechischen. „Himmlisch“ wird nicht ergänzt, da dafür im vorliegenden Text kein entsprechendes Wort steht.
theological_decisions:
- issue: Ort beziehungsweise Art der Tafeln
  choice: „Tafeln der Väter“ ohne Zusatz
  alternative: „himmlische Tafeln der Väter“
  rationale: Der Zusatz „himmlisch“ wäre eine theologische Präzisierung, die der griechische Wortlaut dieses Verses nicht enthält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den griechischen Wortlaut. Die Formulierung „wie es … geschrieben steht“ erhält den schriftbezogenen, feierlichen Ton.
