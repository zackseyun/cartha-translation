source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ εἶπεν³⁸· Ἐγώ εἰμι ὁ ἄγγελος ὁ *παραιτούμενος τὸ γένος³⁹ Ἰσραήλ, τοῦ μὴ πατάξαι⁴⁰ αὐτούς⁴¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/006.yaml
  text: And he said, “I am the angel who intercedes for the race of Israel, so that they may not be struck down.”
translation:
  language: de
  text: 'Und er sagte: »Ich bin der Engel, der für das Volk Israel Fürsprache einlegt, damit sie nicht geschlagen werden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραιτούμενος
  choice: Fürsprache einlegt
  rationale: Das Partizip bezeichnet hier ein bittendes Eintreten zugunsten Israels. »Fürsprache einlegen« gibt diese vermittelnde Tätigkeit natürlich und würdevoll wieder, ohne ihre genaue Ausgestaltung näher festzulegen.
- source_word: τὸ γένος Ἰσραήλ
  choice: das Volk Israel
  rationale: γένος kann Geschlecht, Abstammungsgemeinschaft oder Volk bezeichnen. »Das Volk Israel« ist im heutigen Deutsch verständlich und erfasst hier die gemeinschaftliche Bedeutung besser als das missverständliche »Rasse« oder das altertümliche »Geschlecht«.
- source_word: πατάξαι
  choice: geschlagen werden
  rationale: Das Verb bedeutet wörtlich »schlagen« und kann je nach Zusammenhang auch ein vernichtendes Schlagen meinen. Die Wiedergabe bewahrt den knappen Ausdruck und legt nicht zusätzlich fest, dass Israel vollständig vernichtet oder getötet würde.
theological_decisions:
- issue: Nicht genanntes handelndes Subjekt bei τοῦ μὴ πατάξαι αὐτούς
  choice: Passivform »damit sie nicht geschlagen werden«
  alternative: »damit Gott sie nicht schlägt«
  rationale: Der griechische Text nennt das Subjekt des Schlagens nicht ausdrücklich. Die Passivform bewahrt diese Offenheit und vermeidet es, Gott oder eine andere Macht ausdrücklich als Handelnden einzusetzen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die direkte Rede und die theologisch bedeutsame Unbestimmtheit des griechischen Satzes bleiben erhalten.
