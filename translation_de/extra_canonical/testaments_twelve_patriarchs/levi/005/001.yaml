  source_fidelity: 'Die Übersetzung gibt die griechische Satzstruktur und die zentralen Ausdrücke zuverlässig wieder: καὶ ἐν τούτῳ bleibt mit „Und dabei“ bewusst situativ bzw. zeitlich offen; μοι ist in „öffnete mir“ erhalten; der Plural τὰς πύλας wird durch „die Tore“ abgebildet. „den heiligen Höchsten“ bewahrt die substantivierte Gottesbezeichnung τὸν ἅγιον ὕψιστον, und „auf einem Thron sitzen“ gibt ἐπὶ θρόνου καθήμενον idiomatisch als von „ich sah“ abhängigen Infinitiv wieder.'
