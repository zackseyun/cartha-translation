  terminology: „Engel“, „Tore des Himmels“, „heilige Höchste“ und „Thron“ sind sachgerecht und konsistent mit dem religiös-visionären Register. Die Übersetzung macht aus dem Ausdruck weder ungebührlich einen festen dogmatischen Titel noch schwächt sie dessen Gottesbezug ab.
