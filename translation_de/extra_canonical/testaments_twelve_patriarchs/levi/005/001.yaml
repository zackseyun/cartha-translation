id: T12P.LEV.5.1
reference: Testament of Levi 5:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ †ἐν τούτῳ¹ ἤνοιξέ μοι² *ὁ ἄγγελος³ τὰς πύλας τοῦ οὐρανοῦ· καὶ εἶδον τὸν *ἅγιον ὕψιστον ἐπὶ θρόνου καθήμενον⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/005/001.yaml
  text: And in this, the angel opened to me the gates of heaven, and I saw the Holy Most High seated on a throne.
translation:
  language: de
  text: Und dabei öffnete mir der Engel die Tore des Himmels, und ich sah den heiligen Höchsten auf einem Thron sitzen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τούτῳ
  choice: dabei
  rationale: Die Wendung ist im Zusammenhang mehrdeutig und kann zeitlich oder situativ verstanden werden. „Dabei“ bewahrt diese Offenheit in natürlichem Deutsch besser als das unklare wörtliche „in diesem“.
- source_word: ἤνοιξέ μοι
  choice: öffnete mir
  rationale: Gibt den Dativ μοι knapp und unmittelbar wieder.
- source_word: τὰς πύλας τοῦ οὐρανοῦ
  choice: die Tore des Himmels
  rationale: „Tore“ entspricht dem Plural πύλας und klingt für einen feierlichen visionären Bericht natürlich.
- source_word: τὸν ἅγιον ὕψιστον
  choice: den heiligen Höchsten
  rationale: Bewahrt sowohl das substantivierte „Höchsten“ als auch die Bezeichnung „heilig“, ohne beide zu einem einzelnen Titel zu verschmelzen.
- source_word: ἐπὶ θρόνου καθήμενον
  choice: auf einem Thron sitzen
  rationale: Die Konstruktion hängt von „ich sah“ ab; der deutsche Infinitiv gibt das Partizip idiomatisch wieder. Der artikellose griechische Ausdruck wird mit „einem Thron“ natürlich übersetzt.
theological_decisions:
- issue: Bezug und Titelfunktion von ἅγιον ὕψιστον
  choice: „den heiligen Höchsten“ als Gottesbezeichnung
  alternative: „den Heiligen, den Höchsten“ oder „den heiligen Allerhöchsten“
  rationale: Die gewählte Form hält die beiden griechischen Kennzeichnungen eng zusammen, ohne durch Apposition zwei Titel zu behaupten oder durch „Allerhöchsten“ die Ausdrucksform unnötig zu verstärken.
