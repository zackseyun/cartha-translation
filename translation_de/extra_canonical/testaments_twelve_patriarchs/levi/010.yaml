base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010.yaml
  text: 1[v2]. And now, children, keep what I command you, since I have declared to you all that I heard from my fathers. 2[v2]. And behold, I am innocent of your ungodliness and transgression, which you will commit at the consummation of the ages [against the Savior of the world, the Messiah], misleading Israel and stirring up great evils from the Lord against him. 3. And you will act lawlessly in Israel, so that Jerusalem will not be able to bear it because of your wickedness; but the veil of the temple will be torn, so as no longer to cover your shame. 4. And you will be scattered as captives among the nations, and there you will be for reproach and for a curse. 5. For the house which the Lord will choose shall be called Jerusalem[v5][v3], as the book of Enoch the righteous contains.
translation:
  language: de
  text: '**Testament Levis 10**


    1 Und nun, Kinder, haltet euch an alles, was ich euch gebiete; denn ich habe euch alles verkündet, was ich von meinen Vätern gehört habe.


    2 Seht, ich bin unschuldig an eurer Gottlosigkeit und Übertretung, die ihr bei der Vollendung der Zeitalter [gegen den Retter der Welt, den Messias][a] begehen werdet, indem ihr Israel irreführt und großes Unheil vom Herrn gegen ihn heraufbeschwört.[b]


    3 Ihr werdet in Israel gesetzlos handeln, sodass Jerusalem es wegen eurer Bosheit nicht mehr ertragen kann. Aber der Vorhang[c] des Tempels wird zerrissen werden, sodass er eure Schande nicht länger verhüllt.


    4 Ihr werdet als Gefangene unter die Völker zerstreut werden und dort zum Gegenstand von Schmach und Fluch werden.


    5 Denn das Haus, das der Herr erwählen wird, soll Jerusalem heißen, wie das Buch des gerechten Henoch enthält.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte »gegen den Retter der Welt, den Messias« stehen in dem hier verwendeten griechischen Textzeugen, gelten in der Forschung jedoch häufig als spätere christliche Erweiterung. Deshalb stehen sie in eckigen Klammern.
    reason: textual_variant
  - marker: b
    text: Der griechische Satz ist syntaktisch schwierig. Insbesondere ist nicht eindeutig, auf wen sich »gegen ihn« bezieht; möglich sind unter anderem Israel oder der zuvor genannte Messias.
    reason: alternative_reading
  - marker: c
    text: 'Wörtlich auch: »Schleier«. Gemeint ist der innere Vorhang des Tempels.'
    reason: lexical_alternative
  - marker: d
    text: Die Berufung auf Henoch gehört zur breiteren jüdischen Literaturwelt der Zeit des Zweiten Tempels, in der auch überlieferte Bücher außerhalb des später festgelegten biblischen Kanons als maßgeblich angeführt werden konnten.
    reason: cultural_note
lexical_decisions:
- source_word: φυλάξατε
  choice: haltet euch an
  rationale: Gibt im Deutschen die gehorsame Befolgung eines Gebots natürlich wieder, ohne den Sinn auf bloßes Bewahren einzuengen.
- source_word: ἐντέλλομαι
  choice: ich euch gebiete
  rationale: Bewahrt die autoritative Kraft der testamentarischen Weisung.
- source_word: ἀθῷός εἰμι
  choice: ich bin unschuldig
  rationale: Bezeichnet Levis Freiheit von Verantwortung für die vorausgesagten Vergehen.
- source_word: ἀσεβείας
  choice: Gottlosigkeit
  rationale: Erhält die ausdrücklich religiöse Dimension des Fehlverhaltens.
- source_word: παραβάσεως
  choice: Übertretung
  rationale: Bewahrt den Gedanken der Verletzung einer gegebenen Grenze oder Weisung.
- source_word: συντελείᾳ τῶν αἰώνων
  choice: bei der Vollendung der Zeitalter
  rationale: Erhält den apokalyptischen Ton und den Plural des griechischen Ausdrucks.
- source_word: σωτῆρα
  choice: Retter
  rationale: Direkte und allgemein verständliche Wiedergabe des gewichtigen Titels.
- source_word: χριστόν
  choice: Messias
  rationale: Gibt den Titel in seinem jüdisch-apokalyptischen Bedeutungsrahmen wieder, statt ihn wie einen Eigennamen erscheinen zu lassen.
- source_word: πλανῶντες
  choice: Ihr werdet Israel irreführen
  rationale: Gibt das Partizip als begleitende bzw. näher erläuternde Handlung flüssig wieder.
- source_word: ἐπεγείροντες
  choice: dadurch ... heraufbeschwören
  rationale: Bringt die verursachende Bedeutung zum Ausdruck, ohne den schwierigen Bezug des folgenden Pronomens aufzulösen.
- source_word: κακὰ μεγάλα
  choice: großes Unheil
  rationale: Im Deutschen bezeichnet der Kollektivsingular natürlich schwere, als Gericht verstandene Widerfahrnisse; er vermeidet zugleich die missverständliche Vorstellung moralisch böser Taten Gottes.
- source_word: ἀνομήσετε
  choice: Ihr werdet ... gesetzlos handeln
  rationale: Bewahrt die verbale und fortdauernde Art des angekündigten Handelns.
- source_word: καταπέτασμα
  choice: Vorhang
  rationale: Bezeichnet verständlich den inneren Tempelvorhang; die traditionelle Alternative »Schleier« wird in einer Fußnote genannt.
- source_word: περιέχει ἡ βίβλος
  choice: wie es im Buch ... steht
  rationale: Natürliches modernes Deutsch für eine in einem Buch enthaltene Aussage.
theological_decisions:
- issue: Klammerzusatz über den Retter der Welt, den Messias
  choice: Im Haupttext in eckigen Klammern beibehalten
  alternative: Als wahrscheinlich spätere christliche Erweiterung auslassen oder ohne Kennzeichnung integrieren
  rationale: Der vorgelegte griechische Zeuge enthält die Worte, doch ihre sekundäre Entstehung wird häufig angenommen. Die Klammern bewahren sowohl den Befund als auch die textkritische Unsicherheit.
- issue: Bezug von ἐπ᾿ αὐτόν in Vers 2
  choice: Mit »gegen ihn« formal bewahrt und in einer Fußnote als mehrdeutig gekennzeichnet
  alternative: Das Pronomen ausdrücklich auf Israel, den Messias oder die Handelnden beziehen
  rationale: Syntax und Bezug sind schwierig; eine eindeutige Zuordnung würde die echte Mehrdeutigkeit des griechischen Textes auflösen.
- issue: Zerreißen des Tempelvorhangs
  choice: Als prophetisches Gerichtsbild ohne ausdrückliche neutestamentliche Identifizierung übersetzt
  alternative: Als direkten Hinweis auf die Passion Jesu auslegen
  rationale: Der Text verbindet das Zerreißen unmittelbar mit der aufgedeckten Schande. Eine weitergehende kanonische Deutung gehört nicht in die Übersetzung.
- issue: Vom Herrn kommendes großes Unheil
  choice: Die anstößige und schwierige Aussage bleibt erhalten
  alternative: Zu einer eindeutigeren Aussage über göttliches Gericht gegen die Täter glätten
  rationale: Die Übersetzung soll die theologische Spannung nicht beseitigen; »Unheil« macht jedoch deutlich, dass κακά hier katastrophale Widerfahrnisse bezeichnen kann.
- issue: Berufung auf das Buch Henochs
  choice: Als positive literarische Berufung Levis unverändert wiedergegeben
  alternative: Die Autorität der Schrift durch kanonische Einordnung relativieren
  rationale: Die Übersetzung bildet die Vorstellungswelt des Textes ab, ohne eine spätere Kanonlehre hineinzulesen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede »meine Kinder« erhält den testamentarischen Ton. Apokalyptische Formulierungen wie »Vollendung der Zeitalter« bleiben bewusst gehoben; schwer verständliche Textbefunde werden nicht geglättet, sondern knapp erläutert.
