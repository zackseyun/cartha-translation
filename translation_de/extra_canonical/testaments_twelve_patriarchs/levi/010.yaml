    3 Ihr werdet in Israel gesetzlos handeln, sodass Jerusalem es wegen eurer Bosheit nicht mehr ertragen kann. Vielmehr wird der Vorhang[c] des Tempels zerreißen, sodass er eure Schande nicht länger verhüllt.


