id: T12P.LEV.18.2
reference: Testament of Levi 18:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ³ τότε ἐγερεῖ⁴ κύριος ἱερέα καινόν⁵, ᾧ⁶ πάντες οἱ λόγοι κυρίου⁷ ἀποκαλυφθήσονται⁸, καὶ αὐτὸς ποιήσει κρίσιν⁹ ἀληθείας¹⁰ ἐπὶ τῆς γῆς¹¹ *ἐν πλήθει¹² ἡμερῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/002.yaml
  text: Then the Lord will raise up a new priest, to whom all the words of the Lord will be revealed; and he will execute true judgment upon the earth for many days.
translation:
  language: de
  text: Dann wird der Herr einen neuen Priester erwecken, dem alle Worte des Herrn offenbart werden; und er wird viele Tage lang auf der Erde wahres Gericht üben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐγερεῖ
  choice: wird … erwecken
  rationale: Gibt das futurische ἐγείρω in seinem Sinn von Einsetzung bzw. Hervorbringung einer Person wieder und bewahrt zugleich den feierlich-prophetischen Ton.
- source_word: ἱερέα καινόν
  choice: einen neuen Priester
  rationale: Direkte und natürliche Wiedergabe; καινός bezeichnet hier einen neuen Priester, ohne dass der Text ausdrücklich erklärt, in welchem Sinn er neu ist.
- source_word: πάντες οἱ λόγοι κυρίου
  choice: alle Worte des Herrn
  rationale: Bewahrt den Plural λόγοι und vermeidet eine unnötige Festlegung auf Gebote, Aussprüche oder Offenbarungen.
- source_word: ποιήσει κρίσιν ἀληθείας
  choice: wird … ein gerechtes Urteil vollstrecken
  rationale: Das semitisch gefärbte κρίσιν ἀληθείας bezeichnet ein der Wahrheit entsprechendes, rechtes Gericht. „Vollstrecken“ gibt ποιεῖν κρίσιν im Deutschen idiomatisch wieder.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Entspricht der räumlichen Bedeutung der griechischen Wendung, ohne sie auf ein bestimmtes Land einzuengen.
- source_word: ἐν πλήθει ἡμερῶν
  choice: viele Tage lang
  rationale: Natürliche deutsche Wiedergabe der Zeitangabe „in einer Fülle/Vielzahl von Tagen“.
theological_decisions:
- issue: Identität des neuen Priesters
  choice: Die Figur bleibt unbestimmt als „ein neuer Priester“.
  alternative: Explizite Identifizierung als Messias oder als konkrete historische Gestalt.
  rationale: Der Vers selbst nennt keine Identität; eine ausdrückliche Zuordnung würde mehr festlegen, als der griechische Text sagt.
- issue: Bedeutung von κρίσιν ἀληθείας
  choice: „ein gerechtes Urteil“
  alternative: „ein Urteil der Wahrheit“ oder „wahres Gericht“
  rationale: Die gewählte Formulierung ist idiomatisches Deutsch und wahrt den Sinn eines wahrheitsgemäßen, rechten Gerichts, ohne die Wendung dogmatisch auszubauen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetischem Klang. Der Satzbau bleibt nahe am Griechischen, wird aber durch „viele Tage lang“ und „ein gerechtes Urteil vollstrecken“ idiomatisch gestaltet.
