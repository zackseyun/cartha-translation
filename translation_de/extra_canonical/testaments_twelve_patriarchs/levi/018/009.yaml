source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἐπὶ *τῆς ἱερωσύνης⁵² αὐτοῦ⁵³ *τὰ ἔθνη⁵⁴ πληθυνθήσονται⁵⁵ ἐν γνώσει ἐπὶ τῆς γῆς, καὶ φωτισθήσονται διὰ χάριτος κυρίου. [ὁ δὲ Ἰσραὴλ ἐλαττωθήσεται ἐν ἀγνωσίᾳ καὶ σκοτισθήσεται ἐν πένθει]⁵⁶. ἐπὶ τῆς ἱερωσύνης αὐτοῦ ἐκλείψει⁵⁷ ἡ⁵⁸ ἁμαρτία καὶ οἱ ἄνομοι *καταπαύσουσιν εἰς κακά⁵⁹, [οἱ δὲ δίκαιοι καταπαύσουσιν ἐν αὐτῷ]⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/009.yaml
  text: And during his priesthood the nations will be multiplied in knowledge upon the earth, and they will be enlightened by the grace of the Lord. [But Israel will be diminished in ignorance and darkened in mourning.] During his priesthood sin will cease, and the lawless will cease from evil; [and the righteous will rest in him].
translation:
  language: de
  text: Und während seines Priestertums werden die Völker auf der Erde an Erkenntnis zunehmen, und durch die Gnade des Herrn werden sie erleuchtet werden. [Israel aber wird in Unwissenheit vermindert werden und in Trauer verfinstert werden.][a] Während seines Priestertums wird die Sünde aufhören, und die Gesetzlosen werden vom Bösen ablassen; [die Gerechten aber werden in ihm Ruhe finden.][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Satz ist textkritisch unsicher und steht deshalb in eckigen Klammern.
    reason: Die Ausgangsedition kennzeichnet die gesamte Israel-Klausel als unsicheren bzw. sekundären Textbestand.
  - marker: b
    text: Dieser Satzteil ist textkritisch unsicher und steht deshalb in eckigen Klammern.
    reason: Die Ausgangsedition kennzeichnet die Aussage über die Gerechten als unsicheren bzw. sekundären Textbestand.
lexical_decisions:
- source_word: ἐπὶ τῆς ἱερωσύνης αὐτοῦ
  choice: während seines Priestertums
  rationale: Die Präposition ἐπί mit Genitiv wird hier zeitlich verstanden. „Priestertum“ bewahrt den Bezug sowohl auf das priesterliche Amt als auch auf dessen Dauer.
- source_word: τὰ ἔθνη πληθυνθήσονται ἐν γνώσει
  choice: die Völker werden … an Erkenntnis zunehmen
  rationale: Das Passiv von πληθύνω bezeichnet ein Mehrwerden oder Zunehmen. Die deutsche Fassung gibt die ungewöhnliche Verbindung mit ἐν γνώσει natürlich wieder, ohne sie auf bloßes zahlenmäßiges Wachstum festzulegen.
- source_word: φωτισθήσονται διὰ χάριτος κυρίου
  choice: durch die Gnade des Herrn werden sie erleuchtet werden
  rationale: Das Passiv und die instrumentale Wendung werden bewahrt; „erleuchtet“ lässt die geistige und religiöse Bildsprache offen.
- source_word: ἐκλείψει ἡ ἁμαρτία
  choice: die Sünde wird aufhören
  rationale: ἐκλείπω kann „ausbleiben, versiegen, aufhören“ bedeuten. „Aufhören“ ist im Zusammenhang klar und idiomatisch.
- source_word: οἱ ἄνομοι καταπαύσουσιν εἰς κακά
  choice: die Gesetzlosen werden vom Bösen ablassen
  rationale: Die griechische Wendung ist auffällig. Im antithetischen Zusammenhang ist das Ende bösen Handelns gemeint; „vom Bösen ablassen“ gibt dies verständlich wieder, ohne die Personen selbst verschwinden zu lassen.
- source_word: οἱ δίκαιοι καταπαύσουσιν ἐν αὐτῷ
  choice: die Gerechten aber werden in ihm Ruhe finden
  rationale: καταπαύω wird hier im Sinn des Ruhens verstanden. „In ihm“ wahrt den möglichen personalen Bezug des Pronomens.
theological_decisions:
- issue: Bezug von „in ihm“
  choice: Das personale Pronomen bleibt unaufgelöst stehen.
  alternative: „unter seinem Priestertum“ oder „in seinem Priestertum“
  rationale: Der griechische Text lautet ἐν αὐτῷ und kann sich auf die zuvor genannte Person beziehen. Eine ausdrückliche Gleichsetzung mit dem Priestertum würde die theologische Deutung unnötig festlegen.
- issue: Erleuchtung durch Gnade
  choice: „durch die Gnade des Herrn“ wird als Mittel bzw. Ursache der Erleuchtung wiedergegeben.
  alternative: „wegen der Gnade des Herrn“
  rationale: διά mit Genitiv bezeichnet regulär Vermittlung oder Mittel. Die Formulierung wahrt den theologischen Zusammenhang, ohne die Art der Erleuchtung näher zu definieren.
- issue: Kontrast zwischen den Völkern und Israel
  choice: Der schwierige, textkritisch markierte Kontrast wird übersetzt und in eckigen Klammern belassen.
  alternative: Auslassung des gesamten Satzes
  rationale: Die vorgelegte Edition führt den Satz als unsicheren Textbestand an. Die Übersetzung bewahrt ihn sichtbar, ohne seine Ursprünglichkeit zu behaupten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die parallele Struktur der Aussagen wurde bewahrt. Ungewöhnliche griechische Wendungen wurden behutsam idiomatisiert; textkritisch eingeklammerte Passagen bleiben sichtbar eingeklammert und werden durch Fußnoten erläutert.
