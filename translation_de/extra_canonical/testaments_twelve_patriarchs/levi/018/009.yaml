  to: Und während seines Priestertums werden die Völker auf der Erde an Erkenntnis zunehmen, und durch die Gnade des Herrn werden sie erleuchtet werden. [Israel aber wird in Unwissenheit vermindert werden und in Trauer verfinstert werden.][a] Während seines Priestertums wird die Sünde aufhören, und die Gesetzlosen werden vom Bösen ablassen; [die Gerechten aber werden in ihm Ruhe finden.][b]
