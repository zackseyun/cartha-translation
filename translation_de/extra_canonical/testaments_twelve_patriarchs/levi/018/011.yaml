id: T12P.LEV.18.11
reference: Testament of Levi 18:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ δώσει τοῖς ἁγίοις φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς, καὶ *πνεῦμα ἁγιωσύνης ἔσται⁶⁷ ἐπ᾿ αὐτοῖς⁶⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/011.yaml
  text: And he will give the holy ones to eat from the tree of life, and the spirit of holiness will be upon them.
translation:
  language: de
  text: Und er wird den Heiligen vom Baum des Lebens zu essen geben, und der Geist der Heiligkeit wird auf ihnen sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοῖς ἁγίοις
  choice: den Heiligen
  rationale: Die substantivische Wiedergabe bewahrt die Bezeichnung der Menschen als die Heiligen und entspricht dem Dativ des griechischen Textes.
- source_word: φαγεῖν ἐκ τοῦ ξύλου τῆς ζωῆς
  choice: vom Baum des Lebens zu essen
  rationale: Die geläufige deutsche Wendung gibt den Infinitiv sowie ἐκ natürlich wieder; ξύλον bezeichnet hier im Kontext den Lebensbaum.
- source_word: πνεῦμα ἁγιωσύνης
  choice: der Geist der Heiligkeit
  rationale: Die formnahe Wiedergabe erhält die Genitivverbindung und legt nicht fest, ob ausdrücklich der Heilige Geist oder eine andere Nuance gemeint ist.
- source_word: ἐπ᾿ αὐτοῖς
  choice: auf ihnen
  rationale: Die örtlich-bildhafte Formulierung des Griechischen bleibt erhalten und wird nicht deutend zu „in ihnen“ oder „bei ihnen“ umgeformt.
theological_decisions:
- issue: Identität von πνεῦμα ἁγιωσύνης
  choice: der Geist der Heiligkeit
  alternative: der Heilige Geist
  rationale: Der griechische Ausdruck ist eine Genitivverbindung und nicht die übliche adjektivische Form für „Heiliger Geist“. Die Übersetzung bewahrt diese mögliche begriffliche Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die griechische Satzstruktur. Keine Fußnoten erforderlich.
