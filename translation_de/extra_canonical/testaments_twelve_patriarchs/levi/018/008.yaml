review_pass:
  verdict: revise
  source_fidelity: Eine begrenzte Revision ist erforderlich. μεγαλωσύνη wird mit „Majestät“ präziser wiedergegeben als mit „Hoheit“. Vor allem gibt „keine Nachfolge für ihn“ den Genitiv αὐτοῦ nicht angemessen wieder und ist im Deutschen semantisch unklar. „keine Nachfolge nach ihm“ gibt διαδοχή weiterhin abstrakt wieder, formuliert aber die durch den Genitiv bezeichnete Beziehung idiomatisch.
  naturalness: Der Satzbau ist insgesamt verständlich und dem würdigen Register angemessen. „Er selbst“ bildet die Betonung von Αὐτός ab. Die Wiederholung „Generationen und Generationen“ darf wegen des griechischen Nachdrucks stehen bleiben. „Nachfolge für ihn“ ist jedoch keine natürliche deutsche Verbindung.
  terminology: „Majestät des Herrn“ entspricht μεγαλωσύνη κυρίου gut. „Söhne“, „in Wahrheit“, „für immer“ und „bis in Ewigkeit“ sind als offene bzw. formnahe Wiedergaben vertretbar. „Nachfolge“ wahrt gegenüber „Nachfolger“ den abstrakten Charakter von διαδοχή.
  issues:
  - severity: medium
    issue: „keine Nachfolge für ihn“
    rationale: Das Deutsche „für ihn“ gibt den griechischen Genitiv αὐτοῦ nicht sachgerecht wieder und bleibt unklar, ob eine Vertretung, Begünstigung oder Sukzession gemeint ist. „keine Nachfolge nach ihm“ ist idiomatisch und bewahrt διαδοχή als abstrakten Begriff.
  - severity: low
    issue: „Hoheit“ für μεγαλωσύνη
    rationale: „Hoheit“ kann im Deutschen stärker Herrschaftsgewalt oder einen Anredetitel bezeichnen. „Majestät“ trifft die hier gemeinte Erhabenheit bzw. Größe unmittelbarer.
  revised_text: Denn er selbst wird seinen Söhnen die Majestät des Herrn in Wahrheit für immer geben, und es wird für Generationen und Generationen bis in Ewigkeit keine Nachfolge nach ihm geben.
