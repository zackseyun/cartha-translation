id: T12P.LEV.18.8
reference: Testament of Levi 18:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Αὐτὸς γὰρ⁴⁵ δώσει τὴν μεγαλωσύνην⁴⁶ κυρίου⁴⁷ τοῖς υἱοῖς αὐτοῦ⁴⁸ ἐν ἀληθείᾳ εἰς τὸν αἰῶνα, καὶ οὐκ ἔσται διαδοχὴ⁴⁹ αὐτοῦ⁵⁰ εἰς γενεὰς *καὶ γενεὰς⁵¹ ἕως τοῦ αἰῶνος.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/008.yaml
  text: For he will give the majesty of the Lord to his sons in truth forever, and there will be no succession to him for generations and generations, until eternity.
translation:
  language: de
  text: Denn er selbst wird seinen Söhnen die Majestät des Herrn in Wahrheit für immer geben, und es wird für Generationen und Generationen bis in Ewigkeit keine Nachfolge nach ihm geben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μεγαλωσύνην κυρίου
  choice: die Hoheit des Herrn
  rationale: „Hoheit“ gibt μεγαλωσύνη als erhabene Würde bzw. Majestät natürlich und würdevoll wieder; der Genitiv „des Herrn“ bleibt unverändert erhalten.
- source_word: τοῖς υἱοῖς αὐτοῦ
  choice: seinen Söhnen
  rationale: Direkte und idiomatische Wiedergabe des Dativs und des Possessivbezugs.
- source_word: ἐν ἀληθείᾳ
  choice: in Wahrheit
  rationale: Bewahrt die formale Offenheit der Wendung, die Wahrhaftigkeit, Verlässlichkeit oder Wirklichkeit bezeichnen kann.
- source_word: εἰς τὸν αἰῶνα
  choice: für immer
  rationale: Im Deutschen die natürliche temporale Wiedergabe der idiomatischen griechischen Wendung.
- source_word: διαδοχὴ αὐτοῦ
  choice: Nachfolge für ihn
  rationale: διαδοχή bezeichnet Nachfolge bzw. Sukzession als Vorgang oder Ordnung, nicht zwingend eine einzelne Nachfolgerperson; „für ihn“ bewahrt den Bezug von αὐτοῦ, ohne ihn enger auszulegen.
- source_word: εἰς γενεὰς καὶ γενεὰς
  choice: für Generationen und Generationen
  rationale: Spiegelt die betonte Wiederholung des griechischen Ausdrucks, auch wenn sie im Deutschen ungewöhnlich klingt.
- source_word: ἕως τοῦ αἰῶνος
  choice: bis in Ewigkeit
  rationale: Gibt die Grenzformel mit ἕως wieder und unterscheidet sie sprachlich vom vorausgehenden εἰς τὸν αἰῶνα.
theological_decisions:
- issue: Bezug und Art der „Nachfolge“
  choice: keine Nachfolge für ihn
  alternative: keinen Nachfolger nach ihm
  rationale: Der abstrakte Ausdruck διαδοχή bleibt erhalten. Dadurch wird nicht entschieden, ob eine einzelne Person, eine Amtsfolge oder dynastische Sukzession gemeint ist.
- issue: Bedeutung von ἐν ἀληθείᾳ
  choice: in Wahrheit
  alternative: in Treue / wahrhaftig
  rationale: Die wörtlich offene Formulierung vermeidet eine Festlegung auf ontologische Wahrheit oder moralische Treue.
translation_notes:
  register: Moderne, würdige Standardsprache mit relativ enger Bindung an die griechische Syntax. Die auffällige Wiederholung „Generationen und Generationen“ wurde bewusst bewahrt; „bis in Ewigkeit“ hält die Spannung zwischen den beiden Ewigkeitsformeln aufrecht.
