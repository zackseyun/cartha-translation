source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Οὗτος¹⁹ ἀναλάμψει²⁰ *ὡς ὁ²¹ ἥλιος ἐν τῇ γῇ²², καὶ ἐξαρεῖ πᾶν σκότος *ἐκ τῆς ὑπ᾽ οὐρανὸν²³ καὶ ἔσται εἰρήνη ἐν πάσῃ τῇ γῇ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/004.yaml
  text: He will shine forth like the sun upon the earth, and he will remove all darkness from under heaven, and there will be peace in all the earth.
translation:
  language: de
  text: Er wird wie die Sonne auf der Erde aufstrahlen, alle Finsternis unter dem Himmel beseitigen, und auf der ganzen Erde wird Frieden sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναλάμψει
  choice: wird … aufstrahlen
  rationale: Gibt das zukünftige, machtvolle Hervorleuchten natürlich und bildhaft wieder.
- source_word: ἐν τῇ γῇ
  choice: über der Erde
  rationale: Im Zusammenhang mit dem Leuchten der Sonne ist diese räumliche Wiedergabe im Deutschen natürlicher als „in der Erde“; die griechische Präposition ἐν kann hier lokal verstanden werden.
- source_word: ἐξαρεῖ
  choice: wird … beseitigen
  rationale: Bewahrt den Sinn des vollständigen Entfernens, ohne eine im Deutschen schwerfällige Formulierung zu verwenden.
- source_word: ἐκ τῆς ὑπ᾽ οὐρανὸν
  choice: unter dem Himmel
  rationale: Gibt die elliptische griechische Wendung idiomatisch wieder und bezeichnet den gesamten irdischen Bereich.
- source_word: εἰρήνη
  choice: Frieden
  rationale: Entspricht unmittelbar dem griechischen Begriff und bewahrt seine umfassende Bedeutung.
theological_decisions:
- issue: Identität des angekündigten Handelnden
  choice: Das männliche Pronomen „Er“ bleibt ohne erläuternde Identifikation stehen.
  alternative: Den Handelnden ausdrücklich als Messias oder Priester benennen.
  rationale: Οὗτος verweist auf den vorausgehenden Kontext; der Vers selbst nennt keinen Titel. Eine ausdrückliche Identifikation würde mehr festlegen als der griechische Wortlaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer prophetischer Zukunftsform und bewahrter Licht-Finsternis-Bildsprache.
