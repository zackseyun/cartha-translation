  source_fidelity: Die Wiedergabe von ἀναλάμψει, ἐξαρεῖ, πᾶν σκότος und εἰρήνη ist im Wesentlichen zutreffend. Jedoch bedeutet ἐν τῇ γῇ hier, entsprechend dem Sonnenvergleich, „auf der Erde“ bzw. „auf Erden“, nicht „über der Erde“. Die Wendung ἐκ τῆς ὑπ᾽ οὐρανὸν bezeichnet den Bereich unter dem Himmel; „unter dem Himmel“ kann als Attribut zu „Finsternis“ stehen, gibt den Bereich aber ausreichend wieder.
