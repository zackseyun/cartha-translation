id: T12P.LEV.18.14
reference: Testament of Levi 18:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Τοτὲ ἀγαλλιάσεται Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ, κἀγὼ χαρήσομαι⁷⁴, καὶ πάντες οἱ ἅγιοι ἐνδύσονται⁷⁵ δικαιοσύνην⁷⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/014.yaml
  text: Then Abraham and Isaac and Jacob will exult, and I will rejoice, and all the holy ones will put on righteousness.
translation:
  language: de
  text: Dann werden Abraham, Isaak und Jakob jubeln, und auch ich werde mich freuen, und alle Heiligen werden Gerechtigkeit anziehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαλλιάσεται
  choice: werden … jubeln
  rationale: Das Verb bezeichnet überschwängliche Freude; „jubeln“ gibt seine stärkere Intensität gegenüber χαρήσομαι natürlich wieder.
- source_word: κἀγὼ χαρήσομαι
  choice: und auch ich werde mich freuen
  rationale: κἀγώ bedeutet „und auch ich“; „mich freuen“ entspricht dem weniger intensiven χαίρω und bewahrt den Unterschied zu ἀγαλλιάσεται.
- source_word: οἱ ἅγιοι
  choice: die Heiligen
  rationale: Die substantivierte Personenbezeichnung wird im Deutschen idiomatisch und traditionsgemäß mit „die Heiligen“ wiedergegeben, ohne ihre genaue Identität näher festzulegen.
- source_word: ἐνδύσονται δικαιοσύνην
  choice: werden Gerechtigkeit anziehen
  rationale: Die konkrete Bekleidungsmetapher des Griechischen bleibt erhalten; „Gerechtigkeit“ wahrt die mögliche ethische und heilsgeschichtliche Bedeutungsbreite von δικαιοσύνη.
theological_decisions:
- issue: Identität von πάντες οἱ ἅγιοι
  choice: alle Heiligen
  alternative: alle heiligen Menschen / alle Engel
  rationale: Der griechische Ausdruck legt hier nicht eindeutig fest, ob Menschen, Engel oder die Gesamtheit der Gott Zugehörenden gemeint sind; die Übersetzung bewahrt diese Offenheit.
- issue: Bedeutung der angezogenen Gerechtigkeit
  choice: Gerechtigkeit anziehen
  alternative: gerecht werden / mit Gerechtigkeit bekleidet werden
  rationale: Die aktive Zukunftsform und die Metapher werden nicht dogmatisch als zugerechnete, verliehene oder praktizierte Gerechtigkeit präzisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Parallelstruktur und die bildhafte Sprache des griechischen Satzes bleiben erhalten; „jubeln“ und „sich freuen“ bilden den lexikalischen Intensitätsunterschied natürlich ab.
