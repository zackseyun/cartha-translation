  source_fidelity: 'Die Übersetzung gibt die futurischen Aussagen, die Reihung der drei Erzväter sowie den abgestuften Ausdruck der Freude zutreffend wieder: ἀγαλλιάσεται wird angemessen mit „jubeln“, χαρήσομαι mit „mich freuen“ wiedergegeben. „auch ich“ bildet κἀγώ sachgerecht ab. Die Bekleidungsmetapher von ἐνδύσονται δικαιοσύνην bleibt in „Gerechtigkeit anziehen“ erhalten.'
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch und trotz der bewusst beibehaltenen parataktischen Reihung gut lesbar. „Gerechtigkeit anziehen“ ist als biblisch geprägte Metapher verständlich und natürlich genug.
  terminology: Die Eigennamen sind in den im Deutschen üblichen Formen wiedergegeben. „die Heiligen“ wahrt die im griechischen πάντες οἱ ἅγιοι angelegte, im Kontext nicht näher festgelegte Referenz. „Gerechtigkeit“ ist für δικαιοσύνη die passende offene Wiedergabe und trifft keine zusätzliche theologische Festlegung.
