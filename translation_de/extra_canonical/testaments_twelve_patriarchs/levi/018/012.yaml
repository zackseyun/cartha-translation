  source_fidelity: Die Übersetzung gibt die Satzstruktur, das Passiv in δεθήσεται, die pronominale Offenheit von αὐτοῦ, ἐξουσία als „Vollmacht“ und den bestimmten Ausdruck τὰ πονηρὰ πνεύματα zutreffend wieder. „Niederzutreten“ verschiebt jedoch das räumliche Bild von πατεῖν ἐπί („auf/über etwas treten“) leicht zu einem stärker resultativen Zertreten.
  naturalness: „Auf die bösen Geister zu treten“ ist im Deutschen sowohl verständlich als auch näher am griechischen Bild. Das Futurpassiv „wird von ihm gebunden werden“ ist etwas schwerfällig, aber angesichts des quellengetreuen, würdevollen Registers vertretbar.
