    rationale: πατεῖν ἐπί bezeichnet wörtlich das Treten auf/über etwas. „Niedertreten“ kann darüber hinaus das Niederwerfen oder Zertreten nahelegen; „auf ... zu treten“ bewahrt Bild und Präposition genauer.
