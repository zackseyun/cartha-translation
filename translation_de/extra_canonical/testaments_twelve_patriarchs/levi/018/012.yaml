id: T12P.LEV.18.12
reference: Testament of Levi 18:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ὁ Βελίαρ δεθήσεται ὑπ᾿ αὐτοῦ, καὶ δώσει ἐξουσίαν τοῖς τέκνοις αὐτοῦ⁶⁹ πατεῖν ἐπὶ τὰ πονηρὰ πνεύματα.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/012.yaml
  text: And Beliar will be bound by him, and he will give authority to his children to trample on the evil spirits.
translation:
  language: de
  text: Und Beliar wird von ihm gebunden werden, und er wird seinen Kindern Vollmacht geben, auf die bösen Geister zu treten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Βελίαρ
  choice: Beliar
  rationale: Der griechische Eigenname wird in seiner geläufigen deutschen Form wiedergegeben.
- source_word: δεθήσεται ὑπ᾿ αὐτοῦ
  choice: wird von ihm gebunden werden
  rationale: Bewahrt das Passiv sowie den männlichen, im Kontext zu bestimmenden Handelnden, ohne ihn ausdrücklich zu identifizieren.
- source_word: ἐξουσίαν
  choice: Vollmacht
  rationale: Bezeichnet übertragene Befugnis und wirksame Autorität in einem geistlichen Zusammenhang.
- source_word: τοῖς τέκνοις αὐτοῦ
  choice: seinen Kindern
  rationale: Gibt die Verwandtschafts- bzw. Zugehörigkeitsbezeichnung natürlich wieder und lässt den Bezug des Pronomens wie im Griechischen kontextabhängig.
- source_word: πατεῖν ἐπὶ
  choice: niederzutreten
  rationale: Erhält das konkrete Bild des Tretens und den Gedanken der Überwindung.
- source_word: τὰ πονηρὰ πνεύματα
  choice: die bösen Geister
  rationale: Gibt den bestimmten Artikel und die moralische Charakterisierung der Geister präzise wieder.
theological_decisions:
- issue: Bezug der männlichen Pronomen in ὑπ᾿ αὐτοῦ und τοῖς τέκνοις αὐτοῦ
  choice: Die Pronomen bleiben als „ihm“ und „seinen“ stehen.
  alternative: Den Bezug durch eine namentliche oder titulare Identifikation ausdrücklich festlegen.
  rationale: Der Vers selbst nennt den Bezug nicht erneut; eine explizite Identifikation würde die kontextuelle Mehrdeutigkeit stärker auflösen als der griechische Wortlaut.
- issue: Art der Gewalt über die bösen Geister
  choice: „Vollmacht“ und „niedertreten“
  alternative: „Macht“ und „überwinden“
  rationale: Die gewählte Formulierung wahrt sowohl die übertragene Autorität von ἐξουσία als auch das anschauliche Bild von πατεῖν ἐπὶ.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an Satzbau und Bildsprache des griechischen Textes; keine konfessionelle Ausdeutung der Pronomen.
source_grounding:
