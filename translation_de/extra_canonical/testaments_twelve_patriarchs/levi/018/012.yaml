- from: Und Beliar wird von ihm gebunden werden, und er wird seinen Kindern Vollmacht geben, die bösen Geister niederzutreten.
  to: Und Beliar wird von ihm gebunden werden, und er wird seinen Kindern Vollmacht geben, auf die bösen Geister zu treten.
  rationale: Die einzige Änderung ersetzt die leicht verstärkende Wiedergabe „niederzutreten“ durch die quellennahe und natürliche Formulierung „auf die bösen Geister zu treten“. Alle pronominalen Bezüge und die theologisch nicht weiter bestimmte Aussage bleiben unverändert offen.
  reviewer_model: gpt-5.6-terra
