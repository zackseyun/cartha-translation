  source_fidelity: 'Die Übersetzung gibt die zentralen Elemente zutreffend wieder: die ausdrückliche Betonung von αὐτός („er selbst“), den Plural „Tore“, das Öffnen des Paradieszugangs sowie das Entfernen des gegen Adam gerichteten, drohenden Schwertes. Die einleitende Partikel Καίγε ist jedoch zugleich verbindend und bekräftigend; „Ja“ bildet den Anschluss an den vorangehenden Zusammenhang weniger genau ab.'
