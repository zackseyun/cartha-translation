source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καίγε⁶¹ αὐτὸς⁶² ἀνοίξει τὰς θύρας⁶³ τοῦ παραδείσου, *καὶ ἀποστήσει⁶⁴ τὴν ἀπειλοῦσαν ῥομφαίαν⁶⁵ κατὰ τοῦ⁶⁶ Ἀδάμ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/010.yaml
  text: And indeed he will open the gates of paradise, and he will remove the threatening sword against Adam.
translation:
  language: de
  text: Und tatsächlich wird er selbst die Tore des Paradieses öffnen und das Adam drohende Schwert entfernen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: Ja
  rationale: Die verstärkende Partikel wird natürlich und würdevoll wiedergegeben; sie bekräftigt die Aussage, ohne ein unnötig schwerfälliges „und tatsächlich“ zu erzeugen.
- source_word: αὐτός
  choice: er selbst
  rationale: Bewahrt die ausdrückliche Hervorhebung des handelnden Subjekts.
- source_word: τὰς θύρας τοῦ παραδείσου
  choice: die Tore des Paradieses
  rationale: „Tore“ entspricht im Deutschen dem monumentalen Bild eines verschlossenen Zugangs besser als „Türen“ und wahrt den Plural.
- source_word: ἀποστήσει
  choice: entfernen
  rationale: Gibt das Wegstellen beziehungsweise Beseitigen des Hindernisses klar wieder, ohne eine über den griechischen Text hinausgehende Deutung.
- source_word: τὴν ἀπειλοῦσαν ῥομφαίαν κατὰ τοῦ Ἀδάμ
  choice: das gegen Adam drohende Schwert
  rationale: Bewahrt die attributive Konstruktion und die Ausrichtung der Bedrohung gegen Adam; „Schwert“ ist die natürliche deutsche Entsprechung von ῥομφαία im gegebenen Bildzusammenhang.
theological_decisions:
- issue: Bezug der gegen Adam gerichteten Bedrohung
  choice: „das gegen Adam drohende Schwert“
  alternative: „das Schwert, das Adam bedroht“
  rationale: Die gewählte Form bleibt eng an der griechischen Syntax und lässt offen, ob Adam hier individuell oder repräsentativ verstanden wird.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die emphatische Aussage und die Bildsprache des Paradieszugangs bleiben erhalten.
