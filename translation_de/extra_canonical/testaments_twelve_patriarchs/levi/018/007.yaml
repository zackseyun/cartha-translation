id: T12P.LEV.18.7
reference: Testament of Levi 18:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *δόξα ὑψίστου ἐπ’ αὐτὸν ῥηθήσεται⁴², καὶ πνεῦμα συνέσεως καὶ ἁγιασμοῦ⁴³ καταπαύσει *ἐπ’ αὐτόν⁴⁴ [ἐν τῷ ὕδατι].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/007.yaml
  text: And the glory of the Most High will be spoken over him, and a spirit of understanding and sanctification will rest upon him [in the water].
translation:
  language: de
  text: Und die Herrlichkeit des Höchsten wird über ihm verkündet werden, und ein Geist der Einsicht und der Heiligung wird auf ihm ruhen [im Wasser].[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „im Wasser“ stehen in der griechischen Vorlage in eckigen Klammern und sind textkritisch unsicher.
    reason: Die Unsicherheit des eingeklammerten griechischen Ausdrucks soll für Leserinnen und Leser transparent bleiben.
lexical_decisions:
- source_word: δόξα ὑψίστου
  choice: die Herrlichkeit des Höchsten
  rationale: Bewahrt die geläufige und würdevolle theologische Wendung des Griechischen.
- source_word: ἐπ’ αὐτὸν ῥηθήσεται
  choice: wird über ihm verkündet werden
  rationale: Gibt das Passiv von λέγω sowie die räumlich-bezügliche Formulierung wieder, ohne den nicht genannten Sprecher zu ergänzen.
- source_word: πνεῦμα συνέσεως
  choice: ein Geist der Einsicht
  rationale: συνέσεως bezeichnet verständige Einsicht; die Formulierung bleibt bewusst offen, ob ein Geistwesen oder eine verliehene Befähigung gemeint ist.
- source_word: ἁγιασμοῦ
  choice: der Heiligung
  rationale: Bildet den Vorgang bzw. Zustand des Heiligmachens genauer ab als das abstraktere „Heiligkeit“.
- source_word: καταπαύσει ἐπ’ αὐτόν
  choice: wird auf ihm ruhen
  rationale: Natürliches Deutsch, das das Bild dauerhaften Niederlassens und Ruhens wahrt.
theological_decisions:
- issue: Deutung von πνεῦμα
  choice: Geist
  alternative: Geistkraft
  rationale: „Geist“ erhält die genuine Mehrdeutigkeit zwischen göttlichem Geist, Geistwesen und geistlicher Befähigung.
- issue: Textstatus von ἐν τῷ ὕδατι
  choice: '[im Wasser]'
  alternative: ohne den eingeklammerten Ausdruck
  rationale: Die eckigen Klammern der vorgelegten griechischen Edition werden beibehalten und signalisieren die textkritische Unsicherheit, ohne den Ausdruck aus dem Haupttext zu entfernen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit moderat formaler Satzstruktur. Die Wiederholung von „wird“ wahrt den parallelen Aufbau des griechischen Satzes; nicht ausdrücklich genannte Handelnde werden nicht ergänzt.
