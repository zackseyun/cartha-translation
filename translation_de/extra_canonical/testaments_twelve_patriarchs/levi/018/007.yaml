  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die wesentlichen Begriffe der griechischen Vorlage zuverlässig wieder: δόξα ὑψίστου als „Herrlichkeit des Höchsten“, das unpersönliche Passiv ῥηθήσεται ohne Ergänzung eines Sprechers sowie πνεῦμα συνέσεως καὶ ἁγιασμοῦ als „ein Geist der Einsicht und der Heiligung“. „wird auf ihm ruhen“ trifft καταπαύσει ἐπ’ αὐτόν idiomatisch und inhaltlich. Der eingeklammerte, textkritisch unsichere Zusatz [ἐν τῷ ὕδατι] bleibt sichtbar erhalten.'
  naturalness: Das Deutsch ist modernes, würdevolles Standarddeutsch. Die etwas formelle Wendung „über ihm verkündet werden“ ist angesichts der gehobenen prophetischen Sprache angemessen und verständlich. Der parallele Zukunftsaufbau ist gut lesbar.
  terminology: „Herrlichkeit“, „der Höchste“, „Geist“, „Einsicht“ und „Heiligung“ sind terminologisch tragfähig. Insbesondere wahrt „Geist“ die im griechischen πνεῦμα angelegte Offenheit, ohne eine konfessionelle Deutung festzulegen. „Heiligung“ ist für ἁγιασμός eine mögliche und hier passende Wiedergabe.
