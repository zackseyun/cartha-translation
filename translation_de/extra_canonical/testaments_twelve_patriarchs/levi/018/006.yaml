source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Οἱ οὐρανοὶ³⁵ ἀνοιγήσονται³⁶, καὶ³⁷ ἐκ τοῦ ναοῦ τῆς δόξης³⁸ ἥξει³⁹ ἐπ᾽⁴⁰ αὐτὸν ἁγίασμα μετὰ φωνῆς πατρικῆς ὡς ἀπὸ *Ἀβραὰμ πρὸς Ἰσαάκ⁴¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/006.yaml
  text: The heavens will be opened, and from the temple of glory holiness will come upon him with a fatherly voice, as from Abraham to Isaac.
translation:
  language: de
  text: Die Himmel werden sich öffnen, und aus dem Tempel der Herrlichkeit wird Heiligkeit auf ihn kommen, begleitet von einer väterlichen Stimme, wie von Abraham zu Isaak.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οἱ οὐρανοί
  choice: Die Himmel
  rationale: Der griechische Plural wird bewahrt; „Himmel“ ist im Deutschen auch als Plural verständlich und entspricht der antiken kosmologischen Ausdrucksweise.
- source_word: ἀνοιγήσονται
  choice: werden sich öffnen
  rationale: Natürliche deutsche Wiedergabe des passiven Futurs, ohne den nicht genannten Handelnden festzulegen.
- source_word: ναοῦ τῆς δόξης
  choice: Tempel der Herrlichkeit
  rationale: Formnahe und verständliche Wiedergabe der Genitivverbindung.
- source_word: ἁγίασμα
  choice: Heiligkeit
  rationale: Bezeichnet hier am ehesten eine heilige Qualität oder heiligende Gabe, die auf die Person kommt. „Heiligkeit“ wahrt die substantivische Bildsprache, ohne den Vorgang als ausdrücklich definierte sakramentale „Heiligung“ festzulegen.
- source_word: μετὰ φωνῆς πατρικῆς
  choice: begleitet von einer väterlichen Stimme
  rationale: „Begleitet von“ gibt μετά idiomatisch wieder und macht deutlich, dass die Stimme zusammen mit der Heiligkeit erscheint; „väterlich“ bewahrt die qualitative Formulierung des Griechischen.
- source_word: ὡς ἀπὸ Ἀβραὰμ πρὸς Ἰσαάκ
  choice: wie von Abraham an Isaak
  rationale: Die ungewöhnliche Vergleichsformulierung und die Richtung von Abraham zu Isaak bleiben erhalten, ohne den nicht ausdrücklich genannten Inhalt der Stimme zu ergänzen.
theological_decisions:
- issue: Bedeutung von ἁγίασμα
  choice: Heiligkeit
  alternative: Heiligung / Weihe
  rationale: Der Kontext lässt offen, ob eine heilige Gabe, ein Zustand oder ein heiligender Vollzug gemeint ist. „Heiligkeit“ hält diese Spannung eher offen als die stärker prozesshafte „Heiligung“ oder die kultisch engere „Weihe“.
- issue: Identität der väterlichen Stimme
  choice: keine ausdrückliche Identifizierung mit Gott
  alternative: die Stimme des Vaters
  rationale: Der Text hat das Adjektiv πατρικῆς („väterlich“) und nicht ausdrücklich „des Vaters“. Daher wird keine trinitarische oder anderweitig dogmatische Identifizierung in den Wortlaut eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend formnaher Satzführung. Die markante Bildsprache („die Himmel“, „Tempel der Herrlichkeit“) und die offene theologische Aussage werden bewahrt; nur „begleitet von“ dient der natürlichen deutschen Verknüpfung.
