revisions:
- from: Und nachdem die Vergeltung an ihnen vom Herrn vollzogen worden ist, wird das Priestertum aufhören.
  to: Und nachdem ihre Vergeltung vom Herrn erfolgt ist, wird das Priestertum aufhören.
  rationale: Die Revision bewahrt die syntaktische und semantische Offenheit des Genitivs αὐτῶν, ohne den Herrn als Ursprung der Vergeltung abzuschwächen. Sie gibt zugleich die aoristische Vorzeitigkeit von μετὰ τὸ γενέσθαι mit einer natürlichen deutschen Perfektkonstruktion wieder. Für die im Quellenauszug gesetzten textkritischen Ziffern liegt kein Fußnotentext vor; deshalb werden keine spekulativen Fußnoten ergänzt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:17:33Z'
review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von παρὰ κυρίου als „vom Herrn“ und von ἐκλείψει als „wird ... aufhören“ ist treffend. Jedoch legt „die Vergeltung an ihnen“ den mehrdeutigen Genitiv αὐτῶν einseitig als objektiven Genitiv fest. Der griechische Wortlaut erlaubt auch die weniger festgelegte Formulierung „ihre Vergeltung“, wie sie auch die englische Audit-Fassung beibehält.
  naturalness: „Nachdem ihre Vergeltung vom Herrn erfolgt ist“ ist modernes, würdiges Standarddeutsch und bildet die abgeschlossene Vorzeitigkeit von μετὰ τὸ γενέσθαι angemessen ab. Es vermeidet zugleich die gegenüber dem griechischen γενέσθαι stärkere, explizit passive Umschreibung „vollzogen worden ist“.
  terminology: „Herr“ und „Priestertum“ sind angemessene, registergerechte Wiedergaben von κύριος und ἱερωσύνη. „Vergeltung“ ist für ἐκδίκησις möglich; die possessive Formulierung darf nicht durch „an ihnen“ interpretativ eingeengt werden.
  issues:
  - severity: medium
    issue: Der Genitiv αὐτῶν wird als objektiver Genitiv festgelegt.
    rationale: „Vergeltung an ihnen“ entscheidet eine im griechischen Text nicht ausdrücklich entschiedene Bezugsfrage. Die Herkunftsangabe „vom Herrn“ bestimmt zwar den Ursprung der Vergeltung, zwingt aber nicht dazu, αὐτῶν als Objekt zu verstehen. Die Übersetzung soll diese Ambiguität bewahren.
  - severity: low
    issue: „vollzogen worden ist“ expliziert eine passive Vollzugshandlung.
    rationale: γενέσθαι bedeutet zunächst „geschehen/erfolgen/eintreten“ und trägt nicht selbst die spezifische Vollzugsformulierung. „erfolgt ist“ bleibt näher am Ausdruck und ist idiomatisch.
  revised_text: Und nachdem ihre Vergeltung vom Herrn erfolgt ist, wird das Priestertum aufhören.
  revised_footnotes: []
  revision_rationale: Die Revision bewahrt die syntaktische und semantische Offenheit des Genitivs αὐτῶν, ohne den Herrn als Ursprung der Vergeltung abzuschwächen. Sie gibt zugleich die aoristische Vorzeitigkeit von μετὰ τὸ γενέσθαι mit einer natürlichen deutschen Perfektkonstruktion wieder. Für die im Quellenauszug gesetzten textkritischen Ziffern liegt kein Fußnotentext vor; deshalb werden keine spekulativen Fußnoten ergänzt.
