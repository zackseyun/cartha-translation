source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ¹ μετὰ τὸ γενέσθαι τὴν ἐκδίκησιν αὐτῶν παρὰ κυρίου, *ἐκλείψει ἡ ἱερωσύνη².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/001.yaml
  text: And after their vengeance has come from the Lord, the priesthood will fail.
translation:
  language: de
  text: Und nachdem ihre Vergeltung vom Herrn erfolgt ist, wird das Priestertum aufhören.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκδίκησιν αὐτῶν
  choice: die Vergeltung an ihnen
  rationale: 'ἐκδίκησις bezeichnet hier eine von Gott ausgehende Ahndung bzw. Vergeltung. Das Genitivpronomen ist im Zusammenhang am natürlichsten objektiv wiedergegeben: Vergeltung an ihnen.'
- source_word: παρὰ κυρίου
  choice: vom Herrn
  rationale: Die Präposition παρά mit Genitiv bezeichnet den Ursprung bzw. Urheber der Vergeltung.
- source_word: ἐκλείψει
  choice: wird … aufhören
  rationale: ἐκλείπω kann ein Versiegen, Erlöschen oder Aufhören bezeichnen. „Aufhören“ ist im Deutschen natürlich und bewahrt die Aussage, dass das Priestertum nicht weiterbesteht.
- source_word: ἡ ἱερωσύνη
  choice: das Priestertum
  rationale: Die abstrakte bzw. institutionelle Bedeutung des griechischen Substantivs wird direkt wiedergegeben.
theological_decisions:
- issue: Bezug von αὐτῶν bei ἐκδίκησιν αὐτῶν
  choice: 'objektiver Genitiv: Vergeltung an ihnen'
  alternative: 'subjektiver oder possessiver Genitiv: ihre Vergeltung/Rache'
  rationale: Die Verbindung mit „vom Herrn“ weist darauf hin, dass der Herr die Vergeltung vollzieht; deshalb bezeichnet αὐτῶν am ehesten diejenigen, an denen sie geschieht. Eine dogmatische Präzisierung ihrer Identität wird vermieden.
- issue: Reichweite des Aufhörens des Priestertums
  choice: neutral als „wird das Priestertum aufhören“
  alternative: „wird ihr Priestertum aufhören“ oder „wird das Priestertum verschwinden“
  rationale: Der griechische Text hat bei ἱερωσύνη kein Possessivpronomen. Die Übersetzung fügt daher weder eine bestimmte Zugehörigkeit noch eine weitergehende theologische Deutung hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die passive Umschreibung „vollzogen worden ist“ macht den Herrn als Ursprung bzw. Urheber der Vergeltung deutlich und liest sich natürlicher als eine wörtliche Konstruktion mit „geworden“.
