source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἀνατελεῖ¹³ ἄστρον αὐτοῦ¹⁴ ἐν οὐρανῷ ὡς βασιλέως¹⁵ φωτίζων¹⁶ φῶς γνώσεως †ἐν ἡλίῳ ἡμέρα†¹⁷, καὶ μεγαλυνθήσεται ἐν τῇ οἰκουμένῃ¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/003.yaml
  text: And his star will rise in heaven like a king, giving the light of knowledge like the sun by day, and he will be magnified in the inhabited world.
translation:
  language: de
  text: Und sein Stern wird am Himmel aufgehen wie der eines Königs und das Licht der Erkenntnis ausstrahlen wie die Sonne am Tag; und er wird in der bewohnten Welt hoch erhoben werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Wortlaut hinter „wie die Sonne am Tag“ ist verderbt und lässt sich nicht sicher rekonstruieren; wiedergegeben ist der wahrscheinlich gemeinte Sinn.
    reason: Die Crux-Zeichen der Edition markieren die textliche Unsicherheit von †ἐν ἡλίῳ ἡμέρα†.
lexical_decisions:
- source_word: ἀνατελεῖ
  choice: wird … aufgehen
  rationale: Gibt das Aufgehen eines Gestirns natürlich und quellennah wieder.
- source_word: ἄστρον αὐτοῦ … ὡς βασιλέως
  choice: sein Stern … wie der eines Königs
  rationale: Bewahrt die naheliegende Zuordnung des Vergleichs zum Stern und vermeidet die missverständliche Aussage, der Stern selbst gehe als König auf.
- source_word: φωτίζων φῶς γνώσεως
  choice: das Licht der Erkenntnis leuchten lassen
  rationale: Gibt die figura etymologica von φωτίζων und φῶς in verständlichem Deutsch wieder, ohne den Erkenntnisbezug abzuschwächen.
- source_word: ἐν τῇ οἰκουμένῃ
  choice: auf der ganzen bewohnten Erde
  rationale: Bewahrt den räumlichen Sinn von οἰκουμένη; „ganzen“ entspricht dem im Ausdruck liegenden weltweiten Umfang und ergibt idiomatisches Deutsch.
- source_word: μεγαλυνθήσεται
  choice: wird … hoch erhoben werden
  rationale: Vermittelt die passive Verherrlichung beziehungsweise Erhöhung natürlicher als das im Deutschen unübliche „wird groß gemacht werden“.
theological_decisions:
- issue: Bezug von ὡς βασιλέως
  choice: „wie der eines Königs“ auf „Stern“ bezogen
  alternative: „wird wie ein König aufgehen“
  rationale: Der Genitiv βασιλέως passt unmittelbar zu einem ergänzten „Stern“; die alternative prädikative Deutung bleibt grammatisch denkbar, ist aber weniger naheliegend.
- issue: Textlich unsichere Wendung †ἐν ἡλίῳ ἡμέρα†
  choice: sinngemäß „wie die Sonne am Tag“ mit Fußnote
  alternative: wörtlicher „in der Sonne, Tag“ beziehungsweise eine Konjektur
  rationale: Die überlieferte Wendung ist offenbar verderbt. Die Übersetzung folgt dem wahrscheinlichen Sinn, kennzeichnet die Unsicherheit aber ausdrücklich, statt eine Rekonstruktion als sicher auszugeben.
- issue: Bedeutung von μεγαλυνθήσεται
  choice: „hoch erhoben werden“
  alternative: „groß gemacht/verherrlicht werden“
  rationale: Die passive Form und ihre offene semantische Spannung zwischen Ansehen, Erhöhung und Verherrlichung werden nicht auf eine engere dogmatische Deutung festgelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt dem feierlichen prophetischen Ton verpflichtet, wird aber durch eine klare Koordination lesbar gehalten. Die Fußnote macht die einzige erhebliche textkritische Unsicherheit transparent.
