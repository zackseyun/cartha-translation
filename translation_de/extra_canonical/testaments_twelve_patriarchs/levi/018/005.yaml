revisions:
- from: Die Himmel werden sich in seinen Tagen freuen, und die Erde wird jubeln, und die Wolken werden sich freuen. [Und die Erkenntnis des Herrn wird über die Erde ausgegossen werden wie das Wasser der Meere.][a] Und die Engel der Herrlichkeit vor dem Angesicht des Herrn werden sich über ihn freuen.[b]
  to: Die Himmel werden in seinen Tagen jubeln, die Erde wird sich freuen, und die Wolken werden jubeln; [und die Erkenntnis des Herrn wird über die Erde ausgegossen werden wie Wasser der Meere;][a] und die Engel der Herrlichkeit des Angesichts des Herrn werden sich an ihm freuen.[b]
  rationale: 'Die Revision korrigiert zwei nicht erforderliche Umdeutungen: die Auflösung der Genitivkette in eine Ortsangabe und die Wiedergabe von ἐν αὐτῷ als „über ihn“. Die textkritische Kennzeichnung des eingeklammerten Satzes, die Offenheit des männlichen Pronomens und der feierlich-poetische Stil bleiben erhalten.'
