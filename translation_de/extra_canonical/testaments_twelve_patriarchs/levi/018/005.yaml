  source_fidelity: 'Die poetische Abfolge und die eckige Klammerung des textkritisch unsicheren Satzes sind im Wesentlichen angemessen wiedergegeben. Zwei Stellen sollten jedoch enger am Griechischen bleiben: Das genitivische τοῦ προσώπου κυρίου wird durch „vor dem Angesicht des Herrn“ in eine nicht ausgedrückte lokale Beziehung umgeformt, und ἐν αὐτῷ sollte nicht als „über ihn“ (eher ἐπί) wiedergegeben werden.'
  naturalness: Die revidierte Fassung bleibt modernes, würdiges Standarddeutsch und erhält den Parallelismus. „sich an ihm freuen“ ist idiomatisch und gibt die mit ἐν ausgedrückte Bezugsbeziehung ohne zusätzliche Aussage wieder.
  terminology: „Erkenntnis des Herrn“ gibt ἡ γνῶσις κυρίου sachgerecht wieder. „Herrlichkeit des Angesichts des Herrn“ bewahrt die dichte, im Griechischen genitivisch gefügte Wendung; die Fußnote erläutert die mögliche Bedeutung von „Angesicht“ als Gegenwart, ohne die Syntax in der Übersetzung umzudeuten.
  issues:
