reference: Testament of Levi 18:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Οἱ οὐρανοὶ ἀγαλλιάσονται²⁴ ἐν ταῖς ἡμέραις αὐτοῦ²⁵, καὶ ἡ γῆ χαρήσεται²⁶, καὶ αἱ²⁷ †νεφέλαι²⁸ εὐφρανθήσονται²⁹. [καὶ ἡ γνῶσις κυρίου³⁰ ἐκχυθήσεται³¹ ἐπὶ τῆς γῆς ὡς³² ὕδωρ θαλασσῶν³³] *καὶ οἱ ἄγγελοι τῆς δόξης τοῦ προσώπου κυρίου εὐφρανθήσονται ἐν αὐτῷ³⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/005.yaml
  text: The heavens will rejoice in his days, and the earth will be glad, and the clouds will rejoice; [and the knowledge of the Lord will be poured out upon the earth like the water of the seas;] and the angels of the glory of the Lord's presence will be glad in him.
translation:
  language: de
  text: Die Himmel werden in seinen Tagen jubeln, die Erde wird sich freuen, und die Wolken werden jubeln; [und die Erkenntnis des Herrn wird über die Erde ausgegossen werden wie Wasser der Meere;][a] und die Engel der Herrlichkeit des Angesichts des Herrn werden sich an ihm freuen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der eingeklammerte Satz ist in der griechischen Textüberlieferung unsicher.
    reason: Die Ausgangsausgabe setzt den ganzen Satz in eckige Klammern.
  - marker: b
    text: Die griechische Genitivfolge lautet wörtlich „die Engel der Herrlichkeit des Angesichts des Herrn“. „Angesicht“ kann dabei auch die Gegenwart des Herrn bezeichnen; die genaue Beziehung innerhalb der Genitivfolge bleibt offen.
    reason: Die Fußnote erläutert die semantische Möglichkeit von πρόσωπον, ohne die genitivische Struktur des Ausgangstextes in eine lokale Wendung umzudeuten.
lexical_decisions:
- source_word: ἀγαλλιάσονται / χαρήσεται / εὐφρανθήσονται
  choice: werden sich freuen / wird jubeln / werden sich freuen
  rationale: Die abgestufte Wiedergabe bewahrt den poetischen Wechsel der griechischen Freudenverben, ohne im Deutschen gekünstelt zu wirken.
- source_word: ἐν ταῖς ἡμέραις αὐτοῦ
  choice: in seinen Tagen
  rationale: Die formnahe Wendung ist im Deutschen verständlich und lässt den Bezug des männlichen Pronomens unverändert offen.
- source_word: ἡ γνῶσις κυρίου
  choice: die Erkenntnis des Herrn
  rationale: „Erkenntnis“ gibt γνῶσις angemessen wieder und kann sowohl Wissen als auch erkennende Gottesbeziehung bezeichnen.
- source_word: ἐκχυθήσεται
  choice: wird … ausgegossen werden
  rationale: Das Passiv und das Bild des reichlichen Ausgießens werden bewahrt.
- source_word: οἱ ἄγγελοι τῆς δόξης τοῦ προσώπου κυρίου
  choice: die Engel der Herrlichkeit vor dem Angesicht des Herrn
  rationale: Die dicht gefügte Genitivkette bleibt weitgehend erhalten; „vor dem Angesicht“ gibt die Gegenwarts- bzw. Präsenzvorstellung von προσώπου natürlich wieder.
- source_word: ἐν αὐτῷ
  choice: über ihn
  rationale: Beim Verb εὐφραίνεσθαι kann ἐν die Person bezeichnen, an der man Freude hat; „über ihn“ ist idiomatischer als das missverständliche „in ihm“.
theological_decisions:
- issue: Bezug der männlichen Pronomen αὐτοῦ und αὐτῷ
  choice: „seinen“ und „über ihn“
  alternative: Eine ausdrückliche Identifikation als Priester, Messias oder Herr
  rationale: Der Vers selbst nennt den Bezugsträger nicht; die Übersetzung bewahrt diese kontextabhängige Offenheit und fügt keine konfessionelle Deutung ein.
- issue: Textkritischer Status des Satzes über die Erkenntnis des Herrn
  choice: Satz in eckigen Klammern beibehalten
  alternative: Satz unmarkiert in den Haupttext aufnehmen oder auslassen
  rationale: Die Quellenausgabe kennzeichnet den Abschnitt durch eckige Klammern als textkritisch unsicher; dies soll für Leser sichtbar bleiben.
- issue: Deutung der Engel-Genitivkette
  choice: „Engel der Herrlichkeit vor dem Angesicht des Herrn“
  alternative: „herrliche Engel vor dem Herrn“ oder „Engel der Herrlichkeit des Angesichts des Herrn“
  rationale: Die gewählte Fassung vermeidet, „Herrlichkeit“ lediglich als Eigenschaft der Engel festzulegen, und bewahrt zugleich den Bezug zur Gegenwart des Herrn.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischem Satzrhythmus. Die Wiederholung von „werden sich freuen“ folgt bewusst dem Parallelismus; „jubeln“ sorgt beim mittleren Glied für natürliche Variation. Textkritische Unsicherheit und syntaktische Mehrdeutigkeit werden sichtbar gemacht, nicht geglättet.
