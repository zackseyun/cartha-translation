    rationale: „Über ihn“ legt eine andere, im Griechischen gewöhnlich mit ἐπί ausgedrückte Relation nahe. „sich an ihm freuen“ gibt die Freude in beziehungsweise an der bezeichneten Person natürlicher und quellennäher wieder.
