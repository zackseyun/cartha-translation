base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/018/013.yaml
  text: And the Lord will rejoice over his children, and he will take pleasure in his beloved ones forever.
translation:
  language: de
  text: Und der Herr wird sich über seine Kinder freuen, und an seinen Geliebten wird er für immer Gefallen haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐφρανθήσεται
  choice: wird sich freuen
  rationale: Gibt die zukünftige Freude des Herrn natürlich und unmittelbar wieder.
- source_word: τέκνοις
  choice: Kinder
  rationale: Entspricht der gewöhnlichen Bedeutung von τέκνα und bewahrt das familiäre Bild.
- source_word: εὐδοκήσει
  choice: wird Gefallen haben
  rationale: Bewahrt den Sinn von Wohlgefallen bzw. Freude an jemandem, ohne ihn unnötig auszudeuten.
- source_word: τοῖς ἀγαπητοῖς
  choice: seinen Geliebten
  rationale: Gibt die substantivierte Bezeichnung für die Geliebten bzw. geliebten Menschen knapp und würdevoll wieder.
- source_word: ἕως αἰῶνος
  choice: für immer
  rationale: Ist eine natürliche moderne Wiedergabe der zeitlich unbegrenzten Aussage.
theological_decisions:
- issue: Beziehung zwischen „seinen Kindern“ und „seinen Geliebten“
  choice: Beide Bezeichnungen werden parallel und ohne erklärende Gleichsetzung wiedergegeben.
  alternative: „seinen geliebten Kindern“ als eine einzige Personengruppe
  rationale: Die griechische Satzstruktur enthält zwei parallele Aussagen; eine Zusammenziehung würde die mögliche rhetorische oder inhaltliche Unterscheidung aufheben.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Parallelismus und die Zukunftsformen des griechischen Textes bleiben erhalten.
