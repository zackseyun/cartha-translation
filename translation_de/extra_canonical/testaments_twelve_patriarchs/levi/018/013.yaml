  text: Καὶ εὐφρανθήσεται κύριος ἐπὶ τοῖς τέκνοις αὐτοῦ⁷⁰, καὶ εὐδοκήσει⁷¹ ἐπὶ *τοῖς ἀγαπητοῖς⁷² αὐτοῦ *ἕως αἰῶνος⁷³.
