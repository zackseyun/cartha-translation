id: T12P.LEV.8.14
reference: Testament of Levi 8:14
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Ὁ δὲ⁷⁵ τρίτος *ἐπικληθήσεται αὐτῷ ὄνομα καινόν⁷⁶, ὅτι βασιλεὺς †ἐκ τοῦ†⁷⁷ Ἰούδα ἀναστήσεται καὶ ποιήσει *ἱερατείαν νέαν, κατὰ τὸν τύπον τῶν ἐθνῶν εἰς πάντα τὰ ἔθνη⁷⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/014.yaml
  text: And the third will be called by a new name, because a king will arise from Judah and will establish a new priesthood, according to the pattern of the nations, for all the nations.
translation:
  language: de
  text: Und der Dritte wird einen neuen Namen erhalten,[a] denn ein König wird aus Juda erstehen und ein neues Priestertum einrichten, nach dem Vorbild der Völker, für alle Völker.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische passivische Namensformel bedeutet: Ihm wird ein neuer Name beigelegt.'
    reason: Erläutert die syntaktisch auffällige Konstruktion mit αὐτῷ, ohne eine unzutreffend als wörtlich bezeichnete Paraphrase zu bieten.
  - marker: b
    text: „Nach dem Vorbild der Völker, für alle Völker“ ist im überlieferten griechischen Text eine auffällige, schwer erklärbare Formulierung.
    reason: Kennzeichnet die reale syntaktische beziehungsweise textgeschichtliche Schwierigkeit, ohne den Text durch eine unbelegte Deutung zu harmonisieren.
lexical_decisions:
- source_word: ἐπικληθήσεται αὐτῷ ὄνομα καινόν
  choice: wird mit einem neuen Namen genannt werden
  rationale: Gibt die passive Benennung natürlich wieder, ohne das im Griechischen etwas sperrige αὐτῷ überzubestimmen.
- source_word: ἀναστήσεται
  choice: wird erstehen
  rationale: Bewahrt den gehobenen, zukunftsgerichteten Ton und lässt offen, ob lediglich das Auftreten oder ein stärker theologischer Sinn mitschwingt.
- source_word: ποιήσει ἱερατείαν νέαν
  choice: wird ein neues Priestertum schaffen
  rationale: ποιεῖν bezeichnet hier das Hervorbringen bzw. Einrichten; „schaffen“ ist idiomatisch und hält den Gegenstand ἱερατεία als „Priestertum“ fest.
- source_word: κατὰ τὸν τύπον τῶν ἐθνῶν
  choice: nach dem Vorbild der Völker
  rationale: τύπος bezeichnet Muster oder Vorbild. Die Wiedergabe erhält den auffälligen Bezug auf die Völker, ohne ihn interpretierend abzuschwächen.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: für alle Völker
  rationale: Gibt die Ziel- bzw. Bezugsrichtung von εἰς wieder und unterscheidet πάντα τὰ ἔθνη von dem unmittelbar vorausgehenden τῶν ἐθνῶν nicht künstlich.
theological_decisions:
- issue: Bezug von „der Dritte“
  choice: Der Ausdruck bleibt ohne erklärende Ergänzung stehen.
  alternative: „der dritte Priester“ oder eine andere aus dem Kontext ergänzte Identifikation
  rationale: Der vorgelegte Vers nennt nur ὁ τρίτος; eine nähere Bestimmung würde die im Ausschnitt bestehende Offenheit auflösen.
- issue: Deutung des neuen Priestertums
  choice: „ein neues Priestertum“ ohne konfessionelle oder messianische Auslegung
  alternative: eine ausdrücklich christologische, kultische oder institutionelle Präzisierung
  rationale: Der Text verbindet das Priestertum mit einem König aus Juda, erklärt aber hier weder dessen genaue Gestalt noch seine institutionelle Bedeutung.
- issue: Spannung zwischen „nach dem Vorbild der Völker“ und „für alle Völker“
  choice: Beide Formulierungen werden wörtlich erkennbar nebeneinandergestellt.
  alternative: τύπος als „Zeichen“ oder „Vorbild für die Völker“ umzudeuten
  rationale: Die überlieferte Syntax ist auffällig und möglicherweise textkritisch belastet; ihre Spannung soll nicht stillschweigend beseitigt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „erstehen“ trägt den feierlich-prophetischen Ton, während Satzbau und Wortwahl für heutige Leser verständlich bleiben. Die Wiederholung von „Völker“ spiegelt bewusst die Wiederholung von ἔθνη im Griechischen.
