source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ⁶⁸ ὁ πρῶτος κλῆρος ἔσται μέγας· καὶ ὑπὲρ αὐτὸν οὐ γενήσεται ἕτερος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/012.yaml
  text: And the first lot will be great, and no other will arise above it.
translation:
  language: de
  text: Und das erste Los wird groß sein, und kein anderes wird über ihm stehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κλῆρος
  choice: Los
  rationale: Bewahrt die konkrete und zugleich rang- bzw. anteilsbezogene Bedeutung des griechischen Ausdrucks, ohne eine bestimmte Deutung wie „Priesteramt“ einzutragen.
- source_word: μέγας
  choice: groß
  rationale: Entspricht der offenen Bedeutung von μέγας und vermeidet die interpretierende Steigerung „das größte“.
- source_word: ὑπὲρ αὐτόν
  choice: über ihm
  rationale: Gibt die Vergleichs- und Rangvorstellung des griechischen Ausdrucks möglichst direkt wieder.
- source_word: οὐ γενήσεται ἕτερος
  choice: kein anderes wird … aufkommen
  rationale: ἕτερος bezieht sich grammatisch auf das sächliche κλῆρος; „aufkommen“ vermittelt hier das Entstehen bzw. Hervortreten eines weiteren Loses natürlichen deutschen Sprachgebrauch.
theological_decisions:
- issue: Identität und Bedeutung des „ersten Loses“
  choice: Die bildhafte Bezeichnung „erstes Los“ bleibt erhalten.
  alternative: Deutende Wiedergaben wie „erstes Priestertum“, „erster Anteil“ oder „erster Rang“.
  rationale: Der griechische Text benennt κλῆρος, legt dessen konkrete institutionelle oder theologische Referenz in diesem Satz jedoch nicht ausdrücklich fest.
- issue: Überlegenheit des ersten Loses
  choice: „kein anderes wird über ihm aufkommen“
  alternative: „keines wird größer sein als es“
  rationale: Die gewählte Fassung bewahrt sowohl γενήσεται als auch die räumlich-rangbezogene Formulierung ὑπὲρ αὐτόν, ohne die Aussage stärker als nötig zu glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Satzstruktur. Die zweimalige Verbindung mit „und“ bewahrt das explizite καί; die ungewöhnliche, aber verständliche Wendung „über ihm aufkommen“ erhält die Bildlichkeit und Rangspannung des Ausgangstextes.
