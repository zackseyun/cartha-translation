revisions:
- from: Und das erste Los wird groß sein, und kein anderes wird über ihm aufkommen.
  to: Und das erste Los wird groß sein, und kein anderes wird über ihm stehen.
  rationale: Die Revision ersetzt allein die unidiomatische Verbindung „über ihm aufkommen“ durch die im modernen Deutsch übliche Rangformulierung „über ihm stehen“. Sie erhält die offene Referenz von κλῆρος, die Größe des ersten Loses und die Negation eines anderen, ihm übergeordneten Loses. Die Zukunftsform bleibt erhalten; die Aussage wird nicht zu einer institutionellen oder theologischen Deutung erweitert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:16:43Z'
review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt κλῆρος angemessen offen als „Los“ wieder und bewahrt die zweigliedrige Aussage mit καί. „groß“ entspricht μέγας ohne unzulässige Superlativierung. Die Aussage, dass kein anderes Los dem ersten übergeordnet sein wird, ist sachlich getroffen.
  naturalness: '„über ihm aufkommen“ ist im modernen Standarddeutsch keine natürliche Verbindung: „aufkommen“ kann zwar das Entstehen eines Phänomens bezeichnen, wirkt mit der Rangbestimmung „über ihm“ jedoch syntaktisch und idiomatisch unerquicklich. „über ihm stehen“ ist die natürliche deutsche Rangmetapher.'
  terminology: „Los“ ist hier als bewusst nicht festgelegter Begriff beizubehalten. Es besteht kein Anlass, den Ausdruck institutionell als Priestertum, Amt oder Anteil zu interpretieren. Die maskuline Rückverweisung „ihm“ ist bei „das Los“ korrekt, da der Kern „Los“ Neutrum ist; „über ihm stehen“ bleibt dennoch klar verständlich.
  issues:
  - severity: medium
    issue: Unnatürliche Wendung „über ihm aufkommen“
    rationale: Die Formulierung versucht γενήσεται eng mit „aufkommen“ abzubilden, ist im Deutschen in Verbindung mit „über ihm“ aber nicht idiomatisch. Sie beeinträchtigt die Lesbarkeit, ohne einen erforderlichen Bedeutungsunterschied zu bewahren.
  revised_text: Und das erste Los wird groß sein, und kein anderes wird über ihm stehen.
