  text: And the fifth gave me a branch of a rich olive tree.
translation:
  language: de
  text: Und der fünfte gab mir einen Zweig von einem üppigen Ölbaum.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ πέμπτος
  choice: der fünfte
  rationale: Bewahrt die substantivierte Ordnungszahl des griechischen Textes; der Bezug ergibt sich aus dem Zusammenhang.
- source_word: κλάδον
  choice: einen Zweig
  rationale: Direkte und natürliche Wiedergabe des griechischen Akkusativs.
- source_word: ἐλαίας
  choice: von einem Ölbaum
  rationale: ἐλαία kann den Olivenbaum bezeichnen. Im Deutschen ist bei einem Zweig die Herkunftsangabe „von einem Ölbaum“ natürlicher und eindeutiger als „Olivenzweig“.
- source_word: πιότητος
  choice: kräftigen
  rationale: Der Genitiv bezeichnet hier die üppige, fette beziehungsweise gedeihliche Beschaffenheit des Ölbaums. „Kräftig“ gibt dies in natürlichem Deutsch wieder, ohne das sachlich missverständliche „fett“ zu verwenden.
