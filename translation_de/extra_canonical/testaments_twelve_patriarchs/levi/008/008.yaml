translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzstruktur des Griechischen bleibt erhalten; die etwas ungewöhnliche Qualitätsangabe πιότητος wird idiomatisch auf den Ölbaum bezogen.
