  text: Der Zweite aber⁷³ wird dem Priesterstand⁷⁴ angehören.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ δὲ δεύτερος
  choice: Der zweite aber
  rationale: Gibt die substantivierte Ordinalzahl und den leicht kontrastierenden beziehungsweise fortführenden Wert von δέ knapp und quellennah wieder.
- source_word: ἔσται ἐν ἱερωσύνῃ
  choice: wird im Priesteramt stehen
  rationale: ἱερωσύνη bezeichnet hier den priesterlichen Stand beziehungsweise Dienst. Die idiomatische Wendung „im Priesteramt stehen“ bewahrt die Konstruktion mit ἐν und vermeidet das im Deutschen unnatürliche „im Priestertum sein“.
theological_decisions:
- issue: Bedeutungsumfang von ἱερωσύνη
  choice: Priesteramt
  alternative: Priestertum
  rationale: „Priesteramt“ bezeichnet natürlich den Stand oder Dienst, in dem der Zweite sein wird, ohne eine bestimmte spätere Amtslehre einzutragen. „Priestertum“ wäre ebenfalls möglich, klingt mit „sein“ hier jedoch abstrakter und weniger idiomatisch.
translation_notes:
  register: Knappes, würdiges modernes Standarddeutsch; die Satzstellung erhält durch „aber“ den griechischen Anschluss und Kontrast.
