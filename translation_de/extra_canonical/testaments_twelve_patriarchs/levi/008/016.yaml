id: T12P.LEV.8.16
reference: Testament of Levi 8:16
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Πᾶν οὖν ἐπιθυμητὸν⁸⁶ ἐν Ἰσραὴλ⁸⁷ σοὶ⁸⁸ ἔσται καὶ τῷ σπέρματί σου⁸⁹, καὶ ἔδεσθε⁹⁰ πᾶν ὡραῖον ἐν⁹¹ ὁράσει, καὶ τὴν τράπεζαν Κυρίου διανεμεῖται⁹² τὸ σπέρμα σου⁹³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/016.yaml
  text: Therefore every desirable thing in Israel will be for you and for your seed, and you will eat every beautiful thing for the eye, and your seed will apportion the table of the Lord.
translation:
  language: de
  text: Darum wird alles Begehrenswerte in Israel dir und deinen Nachkommen gehören; ihr werdet alles essen, was schön anzusehen ist, und deine Nachkommen werden den Tisch des Herrn austeilen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιθυμητόν
  choice: das Begehrenswerte
  rationale: Gibt den substantivierten Sinn „alles, was begehrenswert ist“ knapp und würdig wieder.
- source_word: σπέρμα
  choice: Nachkommen
  rationale: Im genealogischen Zusammenhang bezeichnet das griechische Kollektiv die Nachkommenschaft; „Nachkommen“ ist im modernen Deutsch natürlicher als das wörtliche „Same“.
- source_word: ἔδεσθε
  choice: ihr werdet … essen
  rationale: Die Form ist zweite Person Plural Futur und bezieht Levi und seine Nachkommen gemeinsam ein; dies wird nicht zu „deine Nachkommen werden essen“ umgedeutet.
- source_word: πᾶν ὡραῖον ἐν ὁράσει
  choice: alles, was schön anzusehen ist
  rationale: Bewahrt den Bezug auf den Anblick und ergibt zugleich natürliches modernes Deutsch. Das in einer Revisionsnotiz erwähnte ἐν δράσει steht nicht im vorgelegten griechischen Quelltext.
- source_word: τὴν τράπεζαν Κυρίου διανεμεῖται
  choice: den Tisch des Herrn austeilen
  rationale: Hält das konkrete Bild und die Bedeutung des Verteilens offen, statt den Ausdruck vorschnell als bestimmte kultische Handlung auszulegen.
theological_decisions:
- issue: Bedeutung des „Tisches des Herrn“
  choice: Das Bild bleibt wörtlich als „Tisch des Herrn“ stehen.
  alternative: Den Ausdruck ausdrücklich auf Opfergaben, Priesteranteile oder den Tempeldienst beziehen.
  rationale: Der griechische Text legt keine einzelne kultische Deutung eindeutig fest; die theologische Spannung und Bildhaftigkeit sollen erhalten bleiben.
- issue: Subjektwechsel zwischen Essen und Austeilen
  choice: „ihr werdet“ gibt die zweite Person Plural von ἔδεσθε wieder; „deine Nachkommen“ bleibt Subjekt des folgenden Singularverbs.
  alternative: In beiden Satzteilen „deine Nachkommen“ als Subjekt setzen.
  rationale: Die Übersetzung folgt den ausdrücklich unterschiedlichen grammatischen Subjekten des überlieferten griechischen Textes.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem testamentarischem Ton. Die Satzstruktur bleibt eng am Griechischen, wird aber durch Semikolon und idiomatische Relativkonstruktion lesbar gestaltet.
