  source_fidelity: 'Der deutsche Text gibt die Gliederung und die grammatischen Bezüge des griechischen Textes zuverlässig wieder: πᾶν ἐπιθυμητόν als „alles Begehrenswerte“, σοί ... τῷ σπέρματί σου als „dir und deinen Nachkommen“, das Pluralverb ἔδεσθε als „ihr werdet ... essen“ und das anschließende Kollektivsubjekt τὸ σπέρμα σου als „deine Nachkommen“. „was schön anzusehen ist“ trifft πᾶν ὡραῖον ἐν ὁράσει angemessen. Der vorliegende griechische Text enthält kein ἐν δράσει; die davon abweichende englische Revisionsnotiz ist daher für diese Übersetzung nicht maßgeblich.'
  naturalness: Die Formulierung ist modernes, verständliches Standarddeutsch und bewahrt einen passend würdevollen Ton. Das Semikolon macht den Wechsel vom Pluralsubjekt zum Kollektivsubjekt der Nachkommen klar.
  terminology: „Nachkommen“ ist für σπέρμα im genealogischen Zusammenhang idiomatisch. „Tisch des Herrn“ bewahrt das kultisch geprägte, aber im Kontext nicht eindeutig weiter zu spezifizierende Bild. „Austeilen“ gibt διανεμεῖται ausreichend konkret wieder, ohne eine bestimmte institutionelle oder theologische Auslegung einzutragen.
