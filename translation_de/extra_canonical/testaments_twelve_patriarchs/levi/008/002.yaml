id: T12P.LEV.8.2
reference: Testament of Levi 8:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ εἶδον⁵ ἑπτὰ ἄνδρας⁶ ἐν ἐσθῆτι⁷ λευκῇ⁸ *λέγοντάς μοι⁹· Ἀναστὰς ἔνδυσαι τὴν στολὴν τῆς ἱερατείας, καὶ¹⁰ τὸν στέφανον τῆς δικαιοσύνης¹¹, *καὶ τὸ λόγιον¹² τῆς συνέσεως καὶ τὸν ποδήρη¹³ τῆς ἀληθείας καὶ τὸ πέταλον¹⁴ τῆς πίστεως καὶ τὴν μίτραν¹⁵ †τῆς κεφαλῆς†¹⁶ καὶ τὸ ἐφοὺδ τῆς προφητείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/002.yaml
  text: And I saw seven men in white clothing, saying to me, “Rise, put on the robe of the priesthood, and the crown of righteousness, and the breastpiece of understanding, and the full-length robe of truth, and the plate of faith, and the turban for the head, and the ephod of prophecy.”
translation:
  language: de
  text: 'Und ich sah sieben Männer in weißer Kleidung, die zu mir sagten: „Steh auf und leg das Gewand des Priestertums an, die Krone der Gerechtigkeit, das Brustschild der Einsicht, das fußlange Gewand der Wahrheit, das Stirnblatt des Glaubens, den Kopfbund[a] und das Efod der Prophetie.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nach „Kopfbund“ folgt im Griechischen der textkritisch unsicher überlieferte Zusatz „des Kopfes“.
    reason: Die Kreuzzeichen der Edition kennzeichnen τῆς κεφαλῆς als unsicheren beziehungsweise möglicherweise verderbten Text; die Hauptübersetzung vermeidet eine unnatürliche und vermutlich sekundäre Wiederholung.
lexical_decisions:
- source_word: στολή
  choice: Gewand
  rationale: Bezeichnet hier ein feierliches Kleidungsstück; „Gewand“ ist natürlich, würdig und lässt den priesterlichen Zusammenhang erkennen.
- source_word: λόγιον
  choice: Brustschild
  rationale: Im Zusammenhang der priesterlichen Kleidung bezeichnet das Wort das priesterliche Brustschild, nicht abstrakt einen „Orakelspruch“.
- source_word: ποδήρης
  choice: fußlanges Gewand
  rationale: Das Wort bezeichnet ein bis zu den Füßen reichendes Kleidungsstück; die Wiedergabe macht diese konkrete Bedeutung verständlich.
- source_word: πέταλον
  choice: Stirnblatt
  rationale: Gemeint ist die am priesterlichen Kopfschmuck angebrachte Platte; „Stirnblatt“ gibt den kultischen Gegenstand präziser wieder als das allgemeine „Platte“.
- source_word: μίτρα
  choice: Kopfbund
  rationale: Bezeichnet eine priesterliche Kopfbedeckung beziehungsweise einen gewundenen Bund; „Kopfbund“ ist im biblisch-kultischen Register passend.
- source_word: ἐφοὺδ
  choice: Efod
  rationale: Der etablierte biblische Fachbegriff wird als Lehnwort beibehalten.
- source_word: συνέσεως
  choice: Einsicht
  rationale: Gibt die Fähigkeit des verstehenden Erfassens knapp und idiomatisch wieder, ohne sie auf bloßes Wissen zu verengen.
theological_decisions:
- issue: Bedeutung der Genitivverbindungen bei den priesterlichen Kleidungsstücken
  choice: Die bildhaften Zuordnungen („der Gerechtigkeit“, „der Einsicht“, „der Wahrheit“, „des Glaubens“, „der Prophetie“) werden formal bewahrt.
  alternative: Die Genitive als Eigenschaften oder Wirkungen der einzelnen Kleidungsstücke ausdeuten und paraphrasieren.
  rationale: Der griechische Text lässt die genaue Beziehung bewusst offen; eine erklärende Paraphrase würde die symbolische und theologische Spannung unnötig festlegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die Aufzählung und die symbolischen Genitivverbindungen des griechischen Textes bleiben erhalten; kultische Fachbegriffe werden dort verwendet, wo allgemeinere Wörter an Präzision verlieren würden.
