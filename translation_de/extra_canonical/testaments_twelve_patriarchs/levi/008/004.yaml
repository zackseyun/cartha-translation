lexical_decisions:
- source_word: ὁ πρῶτος
  choice: der Erste
  rationale: Die substantivierte Ordnungszahl wird direkt und unter Wahrung des maskulinen Bezugs wiedergegeben.
- source_word: ἤλειψέ με ἐλαίῳ ἁγίῳ
