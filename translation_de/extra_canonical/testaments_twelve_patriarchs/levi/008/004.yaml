  source_fidelity: 'Der Entwurf gibt den griechischen Satz vollständig und ohne sinnverändernde Ergänzung wieder: ὁ πρῶτος als „der Erste“, ἤλειψέ με ἐλαίῳ ἁγίῳ als „salbte mich mit heiligem Öl“ und ἔδωκέ μοι ῥάβδον als „gab mir einen Stab“. Insbesondere bleibt ῥάβδον zutreffend unbestimmt; die im englischen Audit-Text ergänzte Qualifikation „priestly“ ist im griechischen Wortlaut nicht ausgedrückt und wird im deutschen Entwurf mit Recht nicht übernommen.'
  naturalness: „Und der Erste salbte mich mit heiligem Öl und gab mir einen Stab“ ist idiomatisches, modernes und zugleich würdiges Standarddeutsch. Die Großschreibung von „Erste“ ist bei der substantivierten Ordnungszahl korrekt.
  terminology: „heiligem Öl“ ist die naheliegende und registergerechte Wiedergabe von ἐλαίῳ ἁγίῳ. „Stab“ bildet ῥάβδον neutral ab und vermeidet eine nicht im Ausgangstext stehende kultisch-priesterliche Spezifizierung.
