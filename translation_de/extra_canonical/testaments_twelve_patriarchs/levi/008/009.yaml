  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/009.yaml
  text: And the sixth placed a crown on my head.
translation:
  language: de
  text: Und der sechste setzte mir eine Krone auf den Kopf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁ ἕκτος
  choice: der sechste
  rationale: Die substantivierte Ordnungszahl bezeichnet den sechsten der zuvor genannten Handelnden; Kleinschreibung entspricht der modernen deutschen Standardsprache.
- source_word: στέφανον
  choice: eine Krone
  rationale: στέφανος bezeichnet hier einen aufgesetzten Ehren- oder Siegeskranz. »Krone« bewahrt den würdevollen Bildgehalt und entspricht dem unmittelbaren Kontext; der unbestimmte Artikel ist im Deutschen natürlich.
- source_word: μοι … τῇ κεφαλῇ
  choice: mir … auf den Kopf
  rationale: Der Dativ μοι markiert die betroffene Person, während τῇ κεφαλῇ idiomatisch als Ort des Aufsetzens wiedergegeben wird.
- source_word: περιέθηκεν
  choice: setzte … auf
  rationale: Das Verb bezeichnet das Anlegen beziehungsweise Aufsetzen eines Gegenstands um oder auf etwas; bei einer Krone ist »aufsetzen« die natürliche deutsche Entsprechung.
theological_decisions: []
translation_notes:
  register: Kurzer, würdevoller Erzählstil in modernem Standarddeutsch; die nummerische Identifikation »der sechste« und die Bildsprache des griechischen Textes bleiben unverändert erhalten.
