source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ὁ⁵⁵ ἕβδομος *διάδημά μοι ἱερατείας περιέθηκεν καὶ⁵⁶ ἐπλήρωσε⁵⁷ τὰς χεῖράς μου θυμιάματος⁵⁸, ὥστε ἱερατεύειν με⁵⁹ Κυρίῳ, *τῷ θεῷ⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/010.yaml
  text: And the seventh put on me a diadem of priesthood and filled my hands with incense, so that I might serve as priest before the Lord God.
translation:
  language: de
  text: Und der siebte setzte mir das Diadem des Priestertums auf und füllte meine Hände mit Weihrauch, sodass ich dem Herrn Gott als Priester dienen konnte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διάδημα ἱερατείας
  choice: das Diadem des Priestertums
  rationale: Gibt das königliche beziehungsweise rangbezeichnende διάδημα präzise wieder und bewahrt die genitivische Verbindung mit dem Priestertum.
- source_word: ἐπλήρωσε τὰς χεῖράς μου θυμιάματος
  choice: füllte meine Hände mit Weihrauch
  rationale: Bewahrt das konkrete kultische Bild des griechischen Textes, ohne es durch eine bloße Deutung wie „weihte mich“ zu ersetzen.
- source_word: ἱερατεύειν
  choice: als Priester diene
  rationale: Natürliches modernes Deutsch, das sowohl die priesterliche Funktion als auch ihren Dienstcharakter ausdrückt.
theological_decisions:
- issue: Bezug von Κυρίῳ, τῷ θεῷ
  choice: dem Herrn, Gott
  alternative: dem Herrn Gott
  rationale: Die appositionale Formulierung hält die durch Artikel und Apposition angezeigte Struktur des Griechischen sichtbar; sie vermeidet zugleich, „Herr Gott“ unnötig als feste zusammengesetzte Bezeichnung zu glätten.
- issue: Zweck beziehungsweise Folge von ὥστε mit Infinitiv
  choice: damit ich … diene
  alternative: sodass ich … dienen konnte
  rationale: Im kultischen Handlungsgang liegt eine beabsichtigte Beauftragung nahe; die deutsche Zweckform bleibt idiomatisch, ohne weitergehende Aussagen über Vollmacht oder Ordination einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenen kultischen Bildern. „Diadem“ ist gegenüber „Krone“ lexikalisch genauer; „Weihrauch“ ist allgemein verständlich und im kultischen Zusammenhang eindeutig.
