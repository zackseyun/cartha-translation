source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ὁ δὲ⁴⁷ τέταρτος ζώνην *μοι περιέβαλεν⁴⁸, ὁμοίαν πορφύρας⁴⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/007.yaml
  text: And the fourth wrapped around me a belt, like purple.
translation:
  language: de
  text: Der vierte aber legte mir einen Gürtel um, der Purpur glich[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »der wie Purpur war«. »Purpur« kann hier die Purpurfarbe, den Farbstoff oder purpurfarbenen Stoff bezeichnen.'
    reason: Bewahrt die lexikalische Offenheit von πορφύρας, ohne ein bestimmtes Purpurgewand zu behaupten.
lexical_decisions:
- source_word: ζώνην
  choice: einen Gürtel
  rationale: Die natürliche moderne Entsprechung für einen um den Leib gelegten Gürtel; sie vermeidet das veraltete »Gürtelband«.
- source_word: μοι περιέβαλεν
  choice: legte mir … um
  rationale: Gibt die Handlung des Umlegens idiomatisch und nah am griechischen περιβάλλω wieder.
- source_word: ὁμοίαν πορφύρας
  choice: der einem Purpurgewand glich
  rationale: πορφύρα kann die Purpurfarbe oder ein purpurfarbenes Gewebe beziehungsweise Gewand bezeichnen. Wegen des femininen Genitivs und der Vergleichsformulierung wird hier ein purpurnes Gewebe/Gewand als wahrscheinlicher Bezug ausgedrückt, ohne die Textunsicherheit zu verschweigen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das einleitende δέ wird mit »aber« wiedergegeben; die Nummerierung »der vierte« bleibt entsprechend dem Kontext substantivisch.
