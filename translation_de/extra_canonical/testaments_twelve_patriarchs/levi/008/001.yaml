  text: And there again I saw a vision like the former one, after we had spent seventy days there.
translation:
  language: de
  text: Und dort sah ich wieder eine Vision wie die vorherige, nachdem wir siebzig Tage dort verbracht hatten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅραμα
  choice: Vision
  rationale: „Vision“ gibt die übernatürliche Schau in natürlichem, modernem Deutsch treffend wieder.
- source_word: ὡς τὸ πρότερον
  choice: wie die erste
  rationale: Der substantivierte Komparativ verweist auf die zuvor erwähnte Vision; „die erste“ ist im Deutschen klar und knapp.
- source_word: μετὰ τὸ ποιῆσαι ἡμᾶς ἐκεῖ ἡμέρας ἑβδομήκοντα
  choice: nachdem wir siebzig Tage dort verbracht hatten
  rationale: Die idiomatische Wendung mit ποιεῖν und einer Zeitangabe bedeutet, eine bestimmte Zeit zu verbringen; der deutsche Nebensatz bewahrt Vorzeitigkeit und natürlichen Satzfluss.
