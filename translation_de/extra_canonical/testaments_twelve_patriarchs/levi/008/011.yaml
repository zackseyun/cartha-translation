id: T12P.LEV.8.11
reference: Testament of Levi 8:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Καὶ λέγουσι⁶¹ πρός με· Λευί⁶², εἰς τρεῖς ἀρχὰς διαιρεθήσεται⁶³ τὸ σπέρμα σου⁶⁴, εἰς⁶⁵ σημεῖον⁶⁶ *δόξης Κυρίου ἐπερχομένου⁶⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/011.yaml
  text: And they say to me, “Levi, your seed will be divided into three divisions, as a sign of the glory of the Lord who is coming.”
translation:
  language: de
  text: 'Und sie sagen zu mir: „Levi, deine Nachkommenschaft wird in drei Gruppen[a] geteilt werden, als Zeichen der Herrlichkeit des kommenden Herrn.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort kann je nach Zusammenhang auch „Ordnungen“, „Ränge“, „Ämter“ oder „Bereiche“ bedeuten.
    reason: Die Bedeutungsbreite von ἀρχάς lässt sich im Haupttext nicht vollständig abbilden; die Anmerkung bewahrt die echte lexikalische Mehrdeutigkeit.
lexical_decisions:
- source_word: σπέρμα
  choice: Nachkommenschaft
  rationale: Bezeichnet hier nicht wörtlich Samen, sondern Levis künftige Nachkommen; „Nachkommenschaft“ ist im Deutschen natürlich und würdig.
- source_word: εἰς τρεῖς ἀρχὰς διαιρεθήσεται
  choice: wird in drei Gruppen geteilt werden
  rationale: Das Verb bezeichnet eine Aufteilung. ἀρχάς ist mehrdeutig und kann unter anderem Ordnungen, Rang- oder Zuständigkeitsbereiche bezeichnen; „Gruppen“ gibt die Dreiteilung wieder, ohne vorschnell bestimmte Ämter anzunehmen.
- source_word: εἰς σημεῖον
  choice: als Zeichen
  rationale: Gibt die resultative beziehungsweise funktionale Bedeutung der Präposition in idiomatischem Deutsch wieder.
- source_word: δόξης Κυρίου ἐπερχομένου
  choice: der Herrlichkeit des kommenden Herrn
  rationale: ἐπερχομένου stimmt grammatisch mit Κυρίου überein und beschreibt daher den Herrn als den Kommenden.
theological_decisions:
- issue: Art der dreifachen Gliederung von Levis Nachkommenschaft
  choice: drei Gruppen
  alternative: drei Ämter / drei Ordnungen
  rationale: Der griechische Ausdruck legt eine Dreiteilung nahe, bestimmt aber nicht eindeutig drei kirchliche oder priesterliche Ämter. Die Übersetzung vermeidet daher eine konfessionell geprägte Festlegung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem prophetischem Ton. Die direkte Rede und das historische Präsens des griechischen Textes bleiben erhalten.
