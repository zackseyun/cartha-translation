id: T12P.LEV.8.17
reference: Testament of Levi 8:17
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἐξ αὐτῶν⁹⁴ ἔσονται ἱερεῖς⁹⁵ καὶ⁹⁶ κριταὶ καὶ⁹⁶ γραμματεῖς· καὶ⁹⁷ ἐπὶ στόματος αὐτῶν †ληφθήσεται⁹⁸ τὸ ἅγιον⁹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/017.yaml
  text: And from among them there will be priests and judges and scribes, and by their mouth the holy thing will be received.”
translation:
  language: de
  text: Und aus ihrer Mitte werden Priester, Richter und Schriftgelehrte hervorgehen; und durch ihren Mund wird das Heilige empfangen werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut ist an dieser Stelle unsicher; wörtlich etwa: »durch ihren Mund wird das Heilige empfangen werden«.'
    reason: Das Verb ληφθήσεται ist in der Edition als verderbt oder zweifelhaft gekennzeichnet, und die gesamte Wendung ist semantisch ungewöhnlich.
lexical_decisions:
- source_word: ἐξ αὐτῶν
  choice: aus ihrer Mitte
  rationale: Gibt die Herkunft aus der genannten Gruppe natürlich wieder, ohne über das Geschlecht oder die genaue Abgrenzung hinauszugehen.
- source_word: ἱερεῖς καὶ κριταὶ καὶ γραμματεῖς
  choice: Priester, Richter und Schriftgelehrte
  rationale: Entspricht den üblichen Funktionsbezeichnungen; »Schriftgelehrte« trifft γραμματεῖς in diesem religiös-gemeinschaftlichen Zusammenhang besser als das moderne »Schreiber«.
- source_word: ἐπὶ στόματος αὐτῶν
  choice: durch ihren Mund
  rationale: Bewahrt das griechische Bild und lässt offen, ob autoritative Verkündigung, Unterweisung oder Ausspruch gemeint ist.
- source_word: τὸ ἅγιον
  choice: das Heilige
  rationale: Erhält die substantivierte, sachlich oder begrifflich offene Formulierung und legt nicht unbegründet »Heiligtum«, »heilige Gabe« oder »heiliges Wort« fest.
theological_decisions:
- issue: Bedeutung des textkritisch unsicheren †ληφθήσεται und seines Zusammenhangs mit τὸ ἅγιον
  choice: wird das Heilige empfangen werden
  alternative: wird das Heilige angenommen / erlangt werden
  rationale: Die überlieferte passive Verbform wird möglichst formal wiedergegeben. Wegen der textkritischen Kennzeichnung und der ungewöhnlichen Wendung wird keine bestimmte sakrale Handlung oder Lehrvollmacht hineinübersetzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufzählung bleibt knapp und feierlich; das ungewöhnliche Bild »durch ihren Mund« sowie die Mehrdeutigkeit von »das Heilige« werden bewusst bewahrt.
