  source_fidelity: 'Die Übersetzung gibt die Struktur und die zentralen Begriffe des griechischen Textes zuverlässig wieder: ἐξ αὐτῶν als Herkunft aus der genannten Gruppe, die Dreierreihe ἱερεῖς, κριταὶ, γραμματεῖς sowie das unbestimmte substantivierte τὸ ἅγιον. »Durch ihren Mund« bewahrt die auffällige, im Kontext nicht weiter aufzulösende Wendung ἐπὶ στόματος αὐτῶν, ohne eine bestimmte kultische oder lehramtliche Deutung einzutragen. Die Fußnote weist angemessen auf die mit † markierte Schwierigkeit bei ληφθήσεται hin.'
  naturalness: Das Deutsch ist modernes Standarddeutsch mit einem passenden gehobenen, knappen Register. »Aus ihrer Mitte« und »hervorgehen« sind leicht interpretierend, bleiben aber im Bedeutungsrahmen von ἐξ αὐτῶν ἔσονται und lesen sich natürlicher als eine strikt mechanische Wiedergabe. Die bewusst ungewohnte Formulierung im zweiten Teilsatz ist wegen des problematischen griechischen Wortlauts gerechtfertigt.
  terminology: »Priester«, »Richter« und »Schriftgelehrte« sind angemessene Bezeichnungen für ἱερεῖς, κριταὶ und γραμματεῖς. »Das Heilige« erhält die grammatische und semantische Offenheit von τὸ ἅγιον. Es werden keine konfessionell bestimmten Fachbedeutungen eingeführt.
