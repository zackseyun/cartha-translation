- from: 'Und jeder von ihnen trug etwas; sie legten es mir an und sagten zu mir: »Von nun an sei ein Priester, du und alle deine Nachkommen.«'
  to: 'Und jeder von ihnen trug etwas; sie legten mir etwas auf und sagten zu mir: »Von nun an sei ein Priester, du und alle deine Nachkommen.«'
  rationale: Die Revision ersetzt die zu konkrete und objektbezogen verengende Formulierung »legten es mir an« durch »legten mir etwas auf«. Dadurch bleibt die im griechischen Text bestehende Unbestimmtheit hinsichtlich der getragenen und aufgelegten Gegenstände gewahrt, ohne den Satz im Deutschen unverständlich zu machen. Die übrigen Formulierungen können bleiben.
