review_pass:
  verdict: revise
  source_fidelity: 'Der Grundsinn wird weitgehend getroffen: Jeder trug etwas, die Gegenstände wurden Levi auferlegt, und Levi samt seiner Nachkommenschaft wird zum Priestertum bestimmt. Allerdings macht das Pronomen »es« aus dem im Griechischen nicht ausgedrückten Objekt eine einzelne, zuvor eindeutig benannte Sache. Zudem ist »anlegen« für ἐπέθηκαν μοι hier zu spezifisch, da der Text nicht festlegt, ob die Gegenstände als Kleidung angelegt oder auf ihn gelegt wurden.'
  naturalness: Der Satz ist verständlich und im würdigen modernen Standarddeutsch gut lesbar. »Sie legten es mir an« wirkt jedoch wegen des unbestimmten »etwas« im ersten Teilsatz und wegen der spezifischen Bedeutung von »anlegen« etwas unnatürlich bzw. zu eng.
  terminology: »Priester« und »Nachkommen« sind angemessene moderne Wiedergaben von ἱερεύς bzw. πᾶν τὸ σπέρμα σου. Die direkte Anrede und der inklusive Umfang von »du und alle deine Nachkommen« bleiben erhalten.
  issues:
  - severity: medium
    issue: »sie legten es mir an« legt Art und Zahl des nicht ausdrücklich genannten Gegenstands fest
    rationale: Das griechische βαστάζοντες und ἐπέθηκαν stehen ohne ausgedrücktes Objekt. Das singuläre »es« bindet die zweite Handlung unnötig an ein einzelnes zuvor nur als »etwas« eingeführtes Objekt; »sie legten mir etwas auf« bewahrt die Unbestimmtheit besser.
  - severity: medium
    issue: »anlegen« ist für ἐπέθηκαν zu konkret
    rationale: »Anlegen« suggeriert insbesondere Kleidung oder Schmuck am Körper. ἐπιτίθημι mit Dativ bedeutet allgemein »auf/auferlegen«; der überlieferte Satz selbst benennt die Gegenstände nicht.
  revised_text: 'Und jeder von ihnen trug etwas; sie legten mir etwas auf und sagten zu mir: »Von nun an sei ein Priester, du und alle deine Nachkommen.«'
