base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/003.yaml
  text: And each one of them was carrying something, and they placed it on me and said to me, “From now on, become a priest—you and all your seed.”
translation:
  language: de
  text: 'Und jeder von ihnen trug etwas; sie legten mir etwas auf und sagten zu mir: »Von nun an sei ein Priester, du und alle deine Nachkommen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βαστάζοντες ἦσαν
  choice: trug etwas
  rationale: Die Umschreibung gibt die fortdauernde Handlung wieder; da im Griechischen kein ausdrückliches Objekt steht, ergänzt »etwas« den deutschen Satz, ohne einen bestimmten Gegenstand einzuführen.
- source_word: ἐπέθηκαν μοι
  choice: sie legten es mir an
  rationale: Bei Gegenständen, die zur Priesterweihe am Körper angebracht oder als Kleidung angelegt werden, ist »mir anlegen« im Deutschen natürlich und bewahrt den Bezug auf die vorausgesetzten Gegenstände.
- source_word: γενοῦ εἰς ἱερέα
  choice: sei ein Priester
  rationale: Die idiomatische deutsche Aufforderung gibt das griechische »werde/sei zum Priester« würdig und verständlich wieder.
- source_word: πᾶν τὸ σπέρμα σου
  choice: alle deine Nachkommen
  rationale: σπέρμα bezeichnet hier kollektiv die leibliche Nachkommenschaft; »Nachkommen« vermittelt diesen Sinn im modernen Deutsch natürlicher als das wörtliche »Same«.
theological_decisions:
- issue: Umfang der priesterlichen Berufung
  choice: »du und alle deine Nachkommen« wird unmittelbar auf die Aufforderung »sei ein Priester« bezogen.
  alternative: Nur Levi wird ausdrücklich zum Priester bestimmt, während seine Nachkommen allgemeiner mitgemeint sind.
  rationale: Die griechische Koordination σὺ καὶ πᾶν τὸ σπέρμα σου stellt Levi und seine gesamte Nachkommenschaft gemeinsam unter die vorausgehende Aussage, ohne weitere Einschränkung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der fehlende griechische Gegenstand zu »tragen« wird behutsam mit »etwas« ergänzt; »Nachkommen« vermeidet im heutigen Deutsch die missverständliche Körperlichkeit von »Same«.
