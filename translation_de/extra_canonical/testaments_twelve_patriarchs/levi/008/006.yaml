  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/006.yaml
  text: And the third put on me a linen garment, like an ephod.
translation:
  language: de
  text: Und der dritte legte mir ein Leinengewand an, das einem Efod glich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βυσσίνην
  choice: Leinengewand
  rationale: Das substantivierte feminine Adjektiv bezeichnet hier im Zusammenhang mit περιέθηκεν ein Kleidungsstück aus feinem Leinen; „Leinengewand“ ist natürlich und wahrt den priesterlichen Kontext.
- source_word: περιέθηκεν
  choice: legte mir … an
  rationale: Das Verb bedeutet hier, jemanden mit einem Kleidungsstück zu bekleiden; die deutsche Wendung gibt Handlung und Dativ μοι idiomatisch wieder.
- source_word: ὁμοίαν ἐφούδ
  choice: das einem Efod glich
  rationale: ὁμοίαν stimmt mit dem ergänzten femininen Kleidungsstück überein und bezeichnet eine Ähnlichkeit, keine sichere Identität; ἐφούδ wird als kultischer Fachbegriff „Efod“ transliteriert.
theological_decisions:
- issue: Verhältnis des Leinengewands zum Efod
  choice: Ähnlichkeit („glich“)
  alternative: Identifikation als Efod
  rationale: Der griechische Ausdruck ὁμοίαν bezeichnet ausdrücklich eine Ähnlichkeit. Die Übersetzung vermeidet daher, das Gewand mit einem Efod gleichzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Reihung des griechischen Textes bleibt erhalten; „Efod“ wird als etablierter biblischer Kultbegriff verwendet.
