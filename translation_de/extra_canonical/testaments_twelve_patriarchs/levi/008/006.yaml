  source_fidelity: Der Entwurf gibt Ὁ δὲ τρίτος angemessen mit „Und der dritte“ wieder. βυσσίνην bezeichnet ein Gewand aus (feinem) Leinen; „Leinengewand“ ist sachgerecht. περιέθηκεν mit μοι wird idiomatisch und semantisch zutreffend durch „legte mir … an“ wiedergegeben. Das feminine ὁμοίαν bezieht sich auf das Gewand und wahrt mit „das einem Efod glich“ ausdrücklich die im Griechischen ausgedrückte Ähnlichkeit, statt eine Identität zu behaupten.
