source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ἡ δὲ παρουσία⁷⁹ αὐτοῦ ἀγαπητή⁸⁰ ἐστιν⁸¹ ὡς προφήτης⁸² ὑψίστου⁸³ ἐκ σπέρματος Ἀβραὰμ τοῦ⁸⁴ πατρὸς ἡμῶν⁸⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/015.yaml
  text: And his appearance is beloved, like a prophet of the Most High, from the seed of Abraham our father.
translation:
  language: de
  text: Und sein Erscheinen ist liebenswert, wie das eines Propheten des Höchsten aus dem Samen Abrahams, unseres Vaters.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Satz ist an dieser Stelle knapp und mehrdeutig; wörtlicher ohne die im Deutschen ergänzte Vergleichsbeziehung: „Und sein Erscheinen ist liebenswert wie ein Prophet des Höchsten aus dem Samen Abrahams, unseres Vaters.“'
    reason: Die Vergleichsfügung ὡς προφήτης steht im Nominativ. Das Deutsche ergänzt „das eines“, um den Vergleich mit „Erscheinen“ lesbar zu machen; die genaue syntaktische Anbindung bleibt im Griechischen offen.
lexical_decisions:
- source_word: παρουσία
  choice: Erscheinen
  rationale: Bezeichnet hier am ehesten das In-Erscheinung-Treten beziehungsweise Auftreten der Person. „Anwesenheit“ wäre zwar lexikalisch möglich, passt in diesem Zusammenhang aber weniger natürlich.
- source_word: ἀγαπητή
  choice: willkommen
  rationale: Das Adjektiv bedeutet wörtlich „geliebt/lieb“. Bezogen auf ein Erscheinen gibt „willkommen“ den positiven, liebevollen Empfang in natürlichem Deutsch wieder, ohne die Aussage zu übersteigern.
- source_word: ὕψιστος
  choice: der Höchste
  rationale: Die substantivierte Gottesbezeichnung wird traditionsgemäß und quellennah als „der Höchste“ wiedergegeben.
- source_word: σπέρμα
  choice: Samen
  rationale: „Samen“ bewahrt das konkrete Abstammungsbild des griechischen Ausdrucks; „Nachkommenschaft“ wäre eine mögliche dynamischere Wiedergabe.
theological_decisions:
- issue: Bezug von „wie ein Prophet“
  choice: Die knappe Vergleichsform des Griechischen bleibt im Haupttext erhalten.
  alternative: „wie das eines Propheten“ oder „da er ein Prophet ist“
  rationale: Der griechische Nominativ προφήτης lässt sich nicht ohne Weiteres als Genitivattribut zu „Erscheinen“ auffassen. Eine Ergänzung wie „das eines“ oder „da er … ist“ würde die syntaktische Mehrdeutigkeit stärker auflösen, als der Ausgangstext erlaubt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gedankenstrich macht die abrupte griechische Vergleichsfügung lesbar, ohne sie durch einen erklärenden Nebensatz dogmatisch oder syntaktisch festzulegen.
