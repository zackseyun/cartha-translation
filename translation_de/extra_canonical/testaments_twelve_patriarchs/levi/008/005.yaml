base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008/005.yaml
  text: And the second washed me with the Lord's pure water, and fed me holy bread and wine, and put around me a holy and glorious robe.
translation:
  language: de
  text: Und der Zweite wusch mich mit dem reinen Wasser des Herrn, gab mir heiliges Brot und heiligen Wein zu essen und legte mir ein heiliges, herrliches Gewand an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ δεύτερος
  choice: der Zweite
  rationale: Bewahrt die substantivierte Ordnungszahl und ihren Rückbezug auf die zuvor genannten Gestalten.
- source_word: ὕδατι κυρίου καθαρῷ
  choice: mit dem reinen Wasser des Herrn
  rationale: Gibt den Genitiv κυρίου unverengt wieder; die attributive Zuordnung von καθαρῷ zu ὕδατι bleibt klar und klingt im Deutschen natürlich.
- source_word: ἐψώμισέν με
  choice: gab mir … zu essen
  rationale: Gibt die Bedeutung des Speisens idiomatisch wieder, ohne eine besondere kultische Handlung in das Verb hineinzulesen.
- source_word: ἄρτον καὶ οἶνον ἅγιον
  choice: heiliges Brot und heiligen Wein
  rationale: Die adjektivische Heiligkeitsbezeichnung wird auf beide koordinierten Gaben bezogen, wie es Sinn und englische Konsultationsfassung nahelegen.
- source_word: περιέθηκε μοι στολὴν
  choice: legte mir … ein Gewand an
  rationale: Natürliches Deutsch für das Umlegen beziehungsweise Anlegen eines Gewandes; στολή wird würdig und neutral als „Gewand“ wiedergegeben.
- source_word: ἁγίαν καὶ ἔνδοξον
  choice: heiliges, herrliches
  rationale: Bewahrt beide gleichgeordneten Eigenschaften des Gewandes; „herrlich“ gibt ἔνδοξος im erhöhten, aber verständlichen Register wieder.
theological_decisions:
- issue: Mögliche sakramentale Anklänge von Wasser, Brot und Wein
  choice: Die kultisch-religiöse Bildsprache wird wörtlich bewahrt, aber nicht ausdrücklich als bestimmtes Sakrament bezeichnet.
  alternative: Begriffe wie „Taufe“ oder „Abendmahl“ ergänzen.
  rationale: Der griechische Text nennt Wasser, Brot und Wein, deutet sie jedoch hier nicht ausdrücklich konfessionell oder sakramental aus.
- issue: Zugehörigkeit des Wassers zum Herrn
  choice: „das reine Wasser des Herrn“
  alternative: „reines Wasser vom Herrn“ oder „Wasser, das der Herr gereinigt hat“
  rationale: Der Genitiv bleibt in seiner möglichen Zugehörigkeits- oder Herkunftsbeziehung offen; eine kausale Deutung wird vermieden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die wiederholte Heiligkeitsbezeichnung bleibt erhalten, ohne künstlich archaische Formulierungen.
