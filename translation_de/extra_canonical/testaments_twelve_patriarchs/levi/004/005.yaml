  text: And for this reason counsel and understanding have been given to you, so that you may instruct your sons concerning this.
translation:
  language: de
  text: Und deshalb sind dir Rat und Einsicht gegeben worden, damit du deine Söhne darüber unterweist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βουλὴ
  choice: Rat
  rationale: Gibt die Bedeutung von Überlegung bzw. beratender Weisheit knapp und natürlich wieder.
- source_word: σύνεσις
  choice: Einsicht
  rationale: Bezeichnet Verständnis und Urteilsvermögen; „Einsicht“ passt zum würdevollen modernen Register.
- source_word: τοῦ συνετίσαι
  choice: damit du … unterweist
  rationale: Der artikulierte Infinitiv bezeichnet hier den Zweck. Das Verb meint, verständig zu machen bzw. Einsicht zu vermitteln; „unterweisen“ gibt dies im Kontext der Söhne natürlich wieder.
- source_word: περὶ τούτου
  choice: darüber
  rationale: Bewahrt den rückverweisenden, im Satz selbst nicht näher bestimmten Bezug des Griechischen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache; die passivische Form „sind … gegeben worden“ bleibt erhalten, ohne den Geber ausdrücklich zu benennen.
