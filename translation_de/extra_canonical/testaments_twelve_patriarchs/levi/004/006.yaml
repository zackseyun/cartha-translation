base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/006.yaml
  text: For those who bless him will be blessed, and those who curse him will perish.
translation:
  language: de
  text: Denn die, die ihn segnen, werden gesegnet sein, und die, die ihn verfluchen, werden zugrunde gehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐλογοῦντες / εὐλογημένοι
  choice: segnen / gesegnet
  rationale: Die Wiederholung desselben griechischen Wortstamms wird bewahrt; die Formulierung ist im Deutschen verständlich und würdevoll.
- source_word: καταρώμενοι
  choice: verfluchen
  rationale: Gibt den deutlichen Gegensatz zu »segnen« direkt wieder.
- source_word: ἀπολοῦνται
  choice: werden zugrunde gehen
  rationale: Bewahrt die starke, zugleich hinsichtlich Art und Zeitpunkt des Verderbens offene Aussage des griechischen Verbs.
theological_decisions:
- issue: Bezug des Pronomens αὐτόν
  choice: ihn
  alternative: eine ausdrücklich benannte Bezugsperson
  rationale: Der Vers selbst nennt den Bezug nicht; das männliche Pronomen bleibt daher ohne interpretierende Ergänzung stehen.
- issue: Bedeutungsumfang von ἀπολοῦνται
  choice: werden zugrunde gehen
  alternative: werden vernichtet werden
  rationale: »Zugrunde gehen« lässt die im Griechischen bestehende Spannung zwischen Untergang, Verderben und Vernichtung bestehen, ohne sie dogmatisch einzuengen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, leicht verständlichem Stil. Die parallele Satzstruktur und der Gegensatz zwischen Segnen und Verfluchen werden eng am griechischen Ausgangstext bewahrt.
