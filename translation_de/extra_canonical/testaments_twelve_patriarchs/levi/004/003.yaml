source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Φῶς²⁶ γνώσεως²⁷ φωτιεῖς²⁸ *ἐν τῷ Ἰακώβ²⁹, καὶ³⁰ ὡς³¹ ἥλιος *ἔσῃ³² παντὶ³³ σπέρματι³⁴ Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/003.yaml
  text: You shall shine the light of knowledge in Jacob, and you shall be like the sun to all the seed of Israel.
translation:
  language: de
  text: Du wirst das Licht der Erkenntnis in Jakob leuchten lassen und für alle Nachkommen Israels wie die Sonne sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φῶς γνώσεως
  choice: das Licht der Erkenntnis
  rationale: Gibt die Genitivverbindung formal und zugleich idiomatisch wieder; „Erkenntnis“ bewahrt den gehobenen, religiös geprägten Sinn von γνῶσις.
- source_word: φωτιεῖς
  choice: wirst … leuchten lassen
  rationale: Das transitive Verb verlangt hier, dass das „Licht“ zum Leuchten gebracht bzw. ausgestrahlt wird. Die deutsche Fügung ist natürlicher als „du wirst das Licht erleuchten“.
- source_word: ἐν τῷ Ἰακώβ
  choice: in Jakob
  rationale: Bewahrt die räumlich-korporative Ausdrucksweise des Griechischen, ohne sie deutend in „unter den Nachkommen Jakobs“ aufzulösen.
- source_word: ὡς ἥλιος ἔσῃ
  choice: wirst … wie die Sonne sein
  rationale: Entspricht unmittelbar dem Vergleich und der futurischen Aussage.
- source_word: παντὶ σπέρματι Ἰσραήλ
  choice: für alle Nachkommen Israels
  rationale: σπέρμα bezeichnet kollektiv die Nachkommenschaft. „Nachkommen“ ist im modernen Deutschen verständlich und vermeidet das missverständliche wörtliche „Samen“; παντί wird distributiv-kollektiv mit „alle“ wiedergegeben.
theological_decisions:
- issue: Bezug von „Jakob“ und „Israel“
  choice: Die beiden Bezeichnungen bleiben unverändert nebeneinander stehen.
  alternative: Beide ausdrücklich als Volk beziehungsweise Nachkommenschaft deuten.
  rationale: Der Text setzt „Jakob“ und „Israel“ in paralleler, aber nicht völlig identischer Ausdrucksweise ein; eine explizite Gleichsetzung würde die poetische Spannung unnötig auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache mit prophetischem Futur. Die Satzstruktur bleibt eng am griechischen Parallelismus, während „Nachkommen“ gegenüber dem wörtlichen „Samen“ natürliche Verständlichkeit sichert.
