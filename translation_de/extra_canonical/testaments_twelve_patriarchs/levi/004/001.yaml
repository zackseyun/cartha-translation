source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Νῦν οὖν γίνωσκε¹ ὅτι ποιήσει Κύριος κρίσιν ἐπὶ τοὺς υἱοὺς τῶν ἀνθρώπων. Ὅτι² πετρῶν³ σχιζομένων, καὶ τοῦ ἡλίου σβεννυμένου⁴ καὶ ὑδάτων⁵ ξηραινομένων καὶ τοῦ⁶ πυρὸς καταπτήσσοντος⁷ καὶ πάσης [τῆς]⁸ κτίσεως κλονουμένης⁹ καὶ τῶν ἀοράτων πνευμάτων¹⁰ τηκομένων¹¹ καὶ¹² τοῦ ᾅδου σκυλευομένου¹³ [ἐπὶ τῷ πάθει τοῦ ὑψίστου]¹⁴ *οἱ ἄνθρωποι ἀπειθοῦντες ἐπιμενοῦσι ταῖς ἀδικίαις¹⁵, διὰ τοῦτο ἐν Γτῇ¹⁶ κολάσει κριθήσονται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/001.yaml
  text: Now therefore know that the Lord will execute judgment upon the sons of men. For when rocks are split, and the sun is extinguished, and waters dry up, and fire cowers, and all creation is shaken, and the invisible spirits melt away, and Hades is plundered at the suffering of the Most High[a], disobedient men will persist in their injustices; therefore they will be judged in punishment.
translation:
  language: de
  text: Nun erkenne also, dass der Herr Gericht über die Menschensöhne halten wird. Denn wenn Felsen gespalten werden, die Sonne erlischt, Wasser vertrocknen, das Feuer zurückschreckt, die ganze Schöpfung erschüttert wird, die unsichtbaren Geister zerschmelzen und der Hades beim Leiden des Höchsten[a] geplündert wird, verharren die ungehorsamen Menschen in ihren Ungerechtigkeiten. Darum werden sie zur Strafe verurteilt werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte »beim Leiden des Höchsten« sind in der griechischen Überlieferung textlich unsicher und könnten eine spätere Erweiterung sein. Sie werden hier übersetzt, weil sie im zugrunde gelegten Textzeugen stehen.
    reason: textual_variant
lexical_decisions:
- source_word: γίνωσκε
  choice: erkenne
  rationale: Der Imperativ fordert nicht bloß faktisches Wissen, sondern bewusstes Erfassen; „erkenne“ bewahrt den feierlichen, mahnenden Ton.
- source_word: ποιήσει Κύριος κρίσιν
  choice: der Herr wird Gericht … halten
  rationale: Gibt die idiomatische Verbindung „Gericht vollziehen/halten“ natürlich und würdevoll wieder, ohne das angekündigte richterliche Handeln abzuschwächen.
- source_word: υἱοὺς τῶν ἀνθρώπων
  choice: Menschensöhne
  rationale: Bewahrt die semitisch geprägte Formulierung der Vorlage statt sie vollständig zu „Menschen“ einzuebnen.
- source_word: καταπτήσσοντος
  choice: zurückschreckt
  rationale: Das Verb bezeichnet ein erschrecktes Sichducken oder Zurückweichen; „zurückschreckt“ ist im Deutschen anschaulich und nicht übermäßig konkret.
- source_word: τῶν ἀοράτων πνευμάτων τηκομένων
  choice: die unsichtbaren Geister zerschmelzen
  rationale: Bewahrt sowohl die ausdrückliche Unsichtbarkeit als auch das starke Bild des Schmelzens beziehungsweise Sich-Auflösens.
- source_word: τοῦ ᾅδου σκυλευομένου
  choice: der Hades … geplündert wird
  rationale: „Hades“ wahrt die Bezeichnung des Totenreichs; „geplündert“ entspricht dem Passiv von σκυλεύω und vermeidet eine dogmatische Ausdeutung.
- source_word: οἱ ἄνθρωποι ἀπειθοῦντες ἐπιμενοῦσι ταῖς ἀδικίαις
  choice: die ungehorsamen Menschen verharren in ihren Ungerechtigkeiten
  rationale: ἀπειθοῦντες beschreibt die Menschen als ungehorsam beziehungsweise widerspenstig; ἐπιμενοῦσι verlangt das Fortdauern in den Ungerechtigkeiten.
- source_word: ἐν … κολάσει κριθήσονται
  choice: werden … zur Strafe verurteilt werden
  rationale: Die überlieferte Formulierung verbindet Gericht und Strafe. „Zur Strafe verurteilt“ ist natürliches Deutsch und vermeidet die nicht sicher belegte Steigerung „größere Strafe“.
theological_decisions:
- issue: Syntaktisches Verhältnis der kosmischen Erschütterungen zum fortgesetzten Ungehorsam
  choice: konzessiv mit „obwohl“ wiedergegeben
  alternative: kausal/temporal mit „denn wenn“ oder rein aufzählend
  rationale: Der Gedankengang kontrastiert die gewaltigen Zeichen mit dem dennoch fortgesetzten Unrecht der Menschen. „Obwohl“ macht diese im griechischen Partizipialgefüge angelegte Spannung verständlich, ohne die Ereignisse zeitlich genauer festzulegen.
- issue: Leiden des Höchsten
  choice: im Haupttext übersetzt und textkritisch markiert
  alternative: als spätere Erweiterung auslassen
  rationale: Die Klausel steht im gelieferten griechischen Zeugen, ist aber durch eckige Klammern als textlich unsicher ausgewiesen. Ihre Übersetzung wahrt den Zeugen; die Fußnote verhindert, dass ihre Ursprünglichkeit stillschweigend behauptet wird.
- issue: Bedeutung von Hades
  choice: uninterpretiert als „Hades“ belassen
  alternative: „Hölle“, „Unterwelt“ oder „Totenreich“
  rationale: „Hölle“ würde spätere Strafvorstellungen eintragen; „Hades“ erhält die begriffliche Offenheit des griechischen Ausdrucks.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst apokalyptischem Bildgehalt. Die lange griechische Satzperiode bleibt erkennbar, wird aber durch klare deutsche Gliederung lesbar gemacht. Archaisierende Formen und konfessionell festgelegte Terminologie wurden vermieden.
