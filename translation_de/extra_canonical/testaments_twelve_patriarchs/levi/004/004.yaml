    text: 'Das Wort »sohnes« steht im bereitgestellten griechischen Text in eckigen Klammern und ist daher textlich unsicher. Eine ebenfalls eingeklammerte Erweiterung lautet: »Doch deine Söhne werden Hand an ihn legen, um ihn zu pfählen.«'
    reason: textual_variant
  revision_rationale: Die Revision wahrt bei »heimsucht« die semantische Offenheit von ἐπισκέψεται, ersetzt die schwerfällige Wendung für σπλάγχνοις durch eine natürliche und quellennahe Formulierung und beschränkt die Fußnote strikt auf die im vorgelegten griechischen Text markierten Unsicherheiten und die tatsächlich überlieferte Erweiterung. Die Kleinschreibung von »sohnes« vermeidet eine über den Text hinausgehende christologische Markierung.
