revisions:
- from: Und dir und allen deinen Nachkommen wird Segen zuteilwerden, bis der Herr sich in der herzlichen Barmherzigkeit seines Sohnes[a] aller Völker annimmt – für immer.
  to: Und dir und allen deinen Nachkommen wird Segen zuteilwerden, bis der Herr alle Völker im tiefen Erbarmen seines sohnes[a] heimsucht – für immer.
  rationale: Die Revision wahrt bei »heimsucht« die semantische Offenheit von ἐπισκέψεται, ersetzt die schwerfällige Wendung für σπλάγχνοις durch eine natürliche und quellennahe Formulierung und beschränkt die Fußnote strikt auf die im vorgelegten griechischen Text markierten Unsicherheiten und die tatsächlich überlieferte Erweiterung. Die Kleinschreibung von »sohnes« vermeidet eine über den Text hinausgehende christologische Markierung.
  reviewer_model: gpt-5.6-terra
