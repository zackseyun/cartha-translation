source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ δοθήσεταί σοι εὐλογία *καὶ παντὶ τῷ σπέρματί σου³⁵ ἕως³⁶ ἐπισκέψεται³⁷ Κύριος πάντα τὰ ἔθνη³⁸ ἐν σπλάγχνοις [υἱοῦ]³⁹ αὐτοῦ *ἕως αἰῶνος⁴⁰. [Πλὴν⁴¹ οἱ υἱοί σου ἐπιβαλοῦσι χεῖρας *ἐπ᾿ αὐτὸν⁴² *τοῦ ἀνασκολοπίσαι⁴³ αὐτόν.]
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/004.yaml
  text: And a blessing shall be given to you and to all your seed, until the Lord visits all the nations in the tender mercies of his son[a] forever.
translation:
  language: de
  text: Und dir und allen deinen Nachkommen wird Segen zuteilwerden, bis der Herr alle Völker im tiefen Erbarmen seines sohnes[a] heimsucht – für immer.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das Wort »sohnes« steht im bereitgestellten griechischen Text in eckigen Klammern und ist daher textlich unsicher. Eine ebenfalls eingeklammerte Erweiterung lautet: »Doch deine Söhne werden Hand an ihn legen, um ihn zu pfählen.«'
    reason: textual_variant
lexical_decisions:
- source_word: σπέρματί
  choice: Nachkommen
  rationale: Das kollektive »Nachkommenschaft« gibt den Sinn von σπέρμα im heutigen Deutsch natürlicher wieder als das wörtliche »Samen«.
- source_word: ἐπισκέψεται
  choice: sich … annimmt
  rationale: Das Verb bezeichnet hier nicht nur einen Besuch, sondern eine gnädige Hinwendung und Fürsorge.
- source_word: ἐν σπλάγχνοις
  choice: in der herzlichen Barmherzigkeit
  rationale: Die Wendung bezeichnet tief empfundenes Erbarmen; eine körperlich-wörtliche Wiedergabe wäre im Deutschen missverständlich.
- source_word: ἕως αἰῶνος
  choice: für immer
  rationale: Diese natürliche Wiedergabe bewahrt den Gedanken bleibender Dauer, ohne ein im Deutschen missverständliches »bis in Ewigkeit«.
theological_decisions:
- issue: Textkritisch unsicheres υἱοῦ (»Sohn«)
  choice: seines Sohnes[a]
  alternative: seiner Barmherzigkeit / in seinem Erbarmen
  rationale: Das eingeklammerte Wort der vorgelegten griechischen Hauptzeile wird beibehalten, aber durch die Fußnote ausdrücklich als textlich unsicher gekennzeichnet; die Großschreibung ist im Deutschen grammatisch erforderlich und keine zusätzliche christologische Festlegung.
- issue: Erweiterte Aussage über das Handanlegen und Pfählen
  choice: nicht in den Haupttext aufgenommen
  alternative: »Doch deine Söhne werden Hand an ihn legen, um ihn zu pfählen.«
  rationale: Der Satz steht in der Quelle vollständig in eckigen Klammern und gehört zu einer längeren, textkritisch unsicheren Lesart; die Fußnote dokumentiert ihn, ohne ihn stillschweigend zum gesicherten Haupttext zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Herzliche Barmherzigkeit« bewahrt das Bild tief empfundenen Erbarmens, während »sich … annimmt« den fürsorglichen Sinn von ἐπισκέπτομαι verständlich ausdrückt. Der Gedankenstrich trennt die Dauerangabe und vermeidet, dass sie im Deutschen fälschlich direkt auf »bis« bezogen wird.
