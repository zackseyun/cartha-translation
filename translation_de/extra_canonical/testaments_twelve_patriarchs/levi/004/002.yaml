base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/004/002.yaml
  text: Therefore the Most High has heard your prayer, to separate you from unrighteousness and for you to become to him a son and a servant and a minister before him.
translation:
  language: de
  text: Darum hat der Höchste dein Gebet erhört, dich von der Ungerechtigkeit zu trennen und ihm zum Sohn, Diener und Diensttuenden vor ihm zu werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εἰσήκουσεν
  choice: hat … erhört
  rationale: Das Verb bezeichnet hier nicht nur das Hören, sondern das gnädige Erhören eines Gebets.
- source_word: διελεῖν … ἀπὸ ἀδικίας
  choice: von der Ungerechtigkeit absondern
  rationale: Bewahrt den Gedanken einer bewirkten Trennung von Unrecht; „absondern“ entspricht dem feierlichen Kontext, ohne die Aussage konfessionell zu verengen.
- source_word: υἱὸν
  choice: Sohn
  rationale: Gibt die ausdrücklich relationale Bezeichnung wörtlich wieder; der fehlende Artikel im Griechischen verlangt im Deutschen hier keinen unbestimmten Artikel.
- source_word: θεράποντα
  choice: Diener
  rationale: Bezeichnet einen persönlichen Diener und steht unterscheidbar neben dem kultisch-öffentlichen λειτουργός.
- source_word: λειτουργὸν τοῦ προσώπου αὐτοῦ
  choice: ein vor ihm dienender Priester
  rationale: λειτουργός trägt in diesem levitisch-kultischen Zusammenhang priesterliche Bedeutung; τοῦ προσώπου αὐτοῦ wird idiomatisch-räumlich als „vor ihm“ ausgedrückt.
theological_decisions:
- issue: Verhältnis des erhörten Gebets zu Absonderung und Berufung
  choice: „Er will … absondern, damit …“
  alternative: „dein Gebet erhört, dich … abzusondern und … zu werden“
  rationale: Der griechische Infinitivanschluss ist syntaktisch knapp und kann Zweck beziehungsweise Inhalt des Erhörens ausdrücken. Die deutsche Fassung macht den Sinn verständlich, ohne die Absonderung als menschliche Eigenleistung darzustellen.
- issue: Bedeutung von λειτουργός
  choice: „Priester“ mit verbaler Ergänzung „vor ihm dienender“
  alternative: „Amtsträger“, „Diener“ oder „Kultdiener“
  rationale: Im Testament Levis und in der Reihe „Sohn, Diener, λειτουργός“ ist die kultisch-priesterliche Funktion naheliegend. Die Ergänzung bewahrt zugleich den Dienstcharakter und die Beziehung „vor ihm“.
translation_notes:
  register: Moderne, würdige Standardsprache. Die dreigliedrige Berufungsformel bleibt erhalten; die Wiederholung von „Diener“ wird durch die präzisere kultische Wiedergabe von λειτουργός vermieden.
