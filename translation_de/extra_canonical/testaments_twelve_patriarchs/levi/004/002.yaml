revisions:
- from: 'Darum hat der Höchste dein Gebet erhört: Er will dich von der Ungerechtigkeit absondern, damit du ihm Sohn, Diener und ein vor ihm dienender Priester wirst.'
  to: Darum hat der Höchste dein Gebet erhört, dich von der Ungerechtigkeit zu trennen und ihm zum Sohn, Diener und Diensttuenden vor ihm zu werden.
  rationale: Die Revision entfernt die zusätzliche Aussage „Er will“ und bewahrt die offene Infinitivverknüpfung des griechischen Satzes. Sie ersetzt die zu enge Wiedergabe „Priester“ durch „Diensttuender“, sodass die Unterscheidung zwischen θεράπων und λειτουργός sowie der Bezug „vor ihm“ erhalten bleiben, ohne eine priesterliche Amtsbezeichnung in den Text einzutragen.
