  verdict: revise
  source_fidelity: 'Die Fassung trifft das Erhören des Gebets und die Trennung von ἀδικία grundsätzlich. Sie ergänzt jedoch mit „Er will“ eine im Aorist/Infinitivanschluss nicht ausgedrückte Willens- bzw. Zukunftsaussage. Vor allem ist „Priester“ für λειτουργός zu spezifisch: Der griechische Ausdruck bezeichnet einen Diensttuenden/öffentlichen Diener, ohne hier ausdrücklich das priesterliche Substantiv zu verwenden.'
  naturalness: Die vorgeschlagene Revision ist moderne, würdige Standardsprache. „zum Sohn ... werden“ gibt die prädikative Konstruktion mit γίνεσθαι idiomatisch wieder; die Reihung bleibt bewusst knapp und formelhaft.
  terminology: „Ungerechtigkeit“ gibt ἀδικία angemessen wieder. θεράπων wird als „Diener“ belassen. λειτουργός wird als „Diensttuender“ wiedergegeben, um ihn von θεράπων zu unterscheiden und keine nicht ausdrücklich genannte Priesterbezeichnung einzutragen. „vor ihm“ gibt die Wendung τοῦ προσώπου αὐτοῦ idiomatisch wieder.
  issues:
  - severity: medium
    issue: „Er will“ ergänzt Modalität und zeitliche Ausrichtung.
    rationale: Εἰσήκουσεν steht als abgeschlossene Handlung; die folgenden Infinitive formulieren den Inhalt bzw. Zweck des Erhörens, ohne ein separates „will“ auszudrücken.
  - severity: medium
    issue: „Priester“ ist eine unzulässige Spezifizierung von λειτουργός.
    rationale: Der levitische Kontext kann kultische Konnotationen nahelegen, doch der griechische Text verwendet nicht ἱερεύς. Die Übersetzung soll diese mögliche Einordnung nicht als explizite Amtsbezeichnung festschreiben.
  revised_text: Darum hat der Höchste dein Gebet erhört, dich von der Ungerechtigkeit zu trennen und ihm zum Sohn, Diener und Diensttuenden vor ihm zu werden.
