base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/017.yaml
  text: 'And since you have heard about the seventy weeks[1], hear also about the priesthood. For in each jubilee there will be a priesthood. In the first jubilee, the one first anointed for the priesthood will be great, and he will speak to God as to a father; and his priesthood will be complete with the Lord. [And in the days of his joy he will arise for the salvation of the world.]


    In the second jubilee, the one anointed will be conceived in the sorrow of a beloved one, and his priesthood will be honored, and he will be glorified by all.


    But the third priest will be taken in grief. And the fourth will be in pains, because unrighteousness will increase upon him in abundance, and all Israel will hate, each one, his neighbor. The fifth will be taken in darkness. Likewise also the sixth and the seventh.


    But in the seventh there will be a defilement which I cannot speak of before men, for those who do these things will know them. Therefore they will be in captivity and in plundering, and their land and their possessions will be destroyed.


    And in the fifth week they will return to the land of their desolation[4][3][2], and they will renew the house of the Lord.'
translation:
  language: de
  text: '17 Weil ihr von den siebzig Wochen[a] gehört habt, sollt ihr nun auch von der Priesterschaft hören. 2 Denn in jedem Jubeljahr wird es eine Priesterschaft geben. Im ersten Jubeljahr wird derjenige, der als Erster zum Priester gesalbt wird, groß sein. Er wird zu Gott wie zu einem Vater sprechen, und seine Priesterschaft wird vollkommen mit dem Herrn sein. [Und in den Tagen seiner Freude wird er zur Rettung der Welt aufstehen.][b]


    3 Im zweiten Jubeljahr wird der Gesalbte in der Trauer eines geliebten Menschen empfangen werden. Seine Priesterschaft wird hoch geachtet sein, und alle werden ihn verherrlichen.


    4 Der dritte Priester aber wird in Trauer hinweggenommen werden. 5 Der vierte wird Schmerzen erleiden; denn das Unrecht gegen ihn wird überhandnehmen, und alle in Israel werden, jeder seinen Nächsten, hassen. 6 Der fünfte wird in Finsternis hinweggenommen werden, 7 ebenso auch der sechste und der siebte.


    8 Im siebten aber wird es eine Verunreinigung[c] geben, von der ich vor den Menschen nicht sprechen kann; denn diejenigen, die dies tun, werden darum wissen. 9 Deshalb werden sie in Gefangenschaft geraten und der Plünderung ausgeliefert sein, und ihr Land und ihr Besitz werden vernichtet werden.


    10 In der fünften Woche werden sie in das Land ihrer Verwüstung zurückkehren und das Haus des Herrn wiederherstellen.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Siebzig Wochen“ greift apokalyptische Zeitsprache auf, wie sie aus dem Danielbuch bekannt ist. Der Text setzt voraus, dass die Angesprochenen die frühere Erklärung bereits gehört haben.
    reason: cross_reference
  - marker: b
    text: Der Satz „Und in den Tagen seiner Freude wird er zur Rettung der Welt aufstehen“ ist in der hier zugrunde gelegten Überlieferung textkritisch unsicher und könnte eine spätere Erweiterung sein. Deshalb steht er in eckigen Klammern.
    reason: textual_variant
  - marker: c
    text: „Verunreinigung“ kann hier sowohl kultische Befleckung als auch moralische Verderbnis bezeichnen, besonders im Zusammenhang mit dem Verfall der Priesterschaft.
    reason: lexical_alternative
  - marker: d
    text: Die Wiederherstellung des „Hauses des Herrn“ kann die Erneuerung oder den Wiederaufbau des Tempels nach der Verwüstung meinen.
    reason: lexical_alternative
lexical_decisions:
- source_word: ἑβδομήκοντα ἑβδομάδων
  choice: siebzig Wochen
  rationale: Bewahrt die aus apokalyptischer Zeitsprache bekannte Formulierung und gibt ἑβδομάδες unmittelbar wieder, ohne sie als „Jahrwochen“ auszulegen.
- source_word: ἱερωσύνη
  choice: Priesterschaft
  rationale: Bezeichnet hier sowohl das priesterliche Amt als auch dessen geschichtliche Ausprägung und trägt die wiederholte Struktur des Abschnitts.
- source_word: ἰωβηλαῖον
  choice: Jubeljahr
  rationale: Die im Deutschen geläufige biblische Bezeichnung erhält das kalendarische Schema des Textes; eine genaue Dauer wird nicht zusätzlich festgelegt.
- source_word: ὁ χριόμενος πρῶτος εἰς ἱερωσύνην
  choice: derjenige, der als Erster zum Priester gesalbt wird
  rationale: Gibt den Vorrang des πρῶτος und die priesterliche Salbung deutlich wieder, ohne vorschnell einen messianischen Titel daraus zu machen.
- source_word: λαλήσει Θεῷ ὡς πατρί
  choice: Er wird zu Gott wie zu einem Vater sprechen
  rationale: Erhält den auffälligen Vergleich und die Richtung des griechischen Dativs in natürlichem Deutsch.
- source_word: πλήρης μετὰ κυρίου
  choice: vollkommen mit dem Herrn
  rationale: Die knappe und ungewöhnliche griechische Verbindung bleibt in ihrer relationalen Mehrdeutigkeit erhalten; „vor dem Herrn“ oder „vom Herrn erfüllt“ wäre stärker deutend.
- source_word: ἐπὶ σωτηρίᾳ κόσμου
  choice: zur Rettung der Welt
  rationale: Gibt Zweck beziehungsweise Ziel der Handlung natürlich wieder; die textkritische Unsicherheit des gesamten Satzes wird durch Klammern und Fußnote kenntlich gemacht.
- source_word: συλληφθήσεται
  choice: wird … empfangen werden
  rationale: Die mögliche Bedeutung von Empfängnis passt zur Abfolge der Priester, bleibt jedoch weniger medizinisch verengt als „gezeugt werden“.
- source_word: ἐν πένθει ἀγαπητοῦ
  choice: in der Trauer eines geliebten Menschen
  rationale: Bewahrt die Unsicherheit darüber, ob der Genitiv die trauernde geliebte Person oder die Trauer um einen Geliebten bezeichnet.
- source_word: παραληφθήσεται
  choice: wird … hinweggenommen werden
  rationale: Eine zurückhaltende Wiedergabe, die weder Tod noch Amtsübernahme ausdrücklich festlegt und die düstere Folge von Trauer und Finsternis wahrt.
- source_word: μιασμός
  choice: Verunreinigung
  rationale: Der Ausdruck kann in diesem priesterlichen Zusammenhang kultische Befleckung und moralische Verderbnis zugleich bezeichnen.
- source_word: ἀνακαινοποιήσουσιν οἶκον κυρίου
  choice: das Haus des Herrn wiederherstellen
  rationale: Drückt Erneuerung nach Verwüstung aus, ohne zwingend zwischen baulichem Wiederaufbau und umfassender Wiederherstellung zu entscheiden.
theological_decisions:
- issue: Textkritisch unsicherer Satz in Vers 2
  choice: Der Satz über das Aufstehen zur Rettung der Welt bleibt in eckigen Klammern im Haupttext und erhält eine Fußnote.
  alternative: Den Satz als spätere Erweiterung auslassen oder ohne Kennzeichnung als sicheren Text drucken.
  rationale: Die vorgelegte griechische Edition markiert den Satz als unsicher. Seine mögliche theologische Tragweite darf weder durch Tilgung verdeckt noch durch unmarkierte Aufnahme überbewertet werden.
- issue: Deutung der gesalbten priesterlichen Gestalten
  choice: Die Gestalten werden als aufeinanderfolgende Priester innerhalb des prophetischen Schemas wiedergegeben, ohne historische oder messianische Identifizierung.
  alternative: Einzelne Priester ausdrücklich mit historischen Hohenpriestern oder einer messianischen Gestalt gleichsetzen.
  rationale: Der Text selbst bietet keine Namen. Die Übersetzung wahrt daher das Schema und lässt seine historische oder eschatologische Zuordnung offen.
- issue: Bedeutung von πλήρης μετὰ κυρίου
  choice: „seine Priesterschaft wird vollkommen mit dem Herrn sein“
  alternative: „seine Priesterschaft wird vom Herrn erfüllt/vor dem Herrn vollkommen sein“
  rationale: Die griechische Fügung ist ungewöhnlich. Eine glättende Präposition würde eine bestimmte theologische Beziehung festlegen, die im Wortlaut nicht eindeutig ist.
- issue: Art der Verunreinigung im siebten Zeitraum
  choice: „Verunreinigung“ mit Hinweis auf kultische und moralische Bedeutungsanteile
  alternative: Ausschließlich „Entweihung“ oder ausschließlich „sittliche Verderbnis“
  rationale: Im Zusammenhang korrumpierter Priesterschaft greifen kultische und ethische Kategorien ineinander; die Übersetzung soll diese Spannung erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die prophetische Zeitstruktur und die bewussten Mehrdeutigkeiten des Griechischen bleiben erhalten. Ungebräuchliche oder konfessionell aufgeladene Festlegungen werden vermieden; „Jubeljahr“, „Priesterschaft“ und „Haus des Herrn“ bewahren zugleich den biblisch-antiken Ton.
