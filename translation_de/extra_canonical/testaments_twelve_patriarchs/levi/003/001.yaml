source:
  edition: Charles 1908 Greek Versions (pages 92-133, Levi pilot full)
  text: ῎Ακουσον οὖν¹ περὶ τῶν δει- χθέντων σοι οὐρα- νῶν· ὁ κατώτερος *διὰ τοῦτό σοί ἐστι στυγνός, ἐπειδὴ² ὁρᾷ πάσας³ τὰς ἀδικίας τῶν ἀνθρώπων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/003/001.yaml
  text: 'Listen, then, concerning the heavens that were shown to you. The lowest is gloomy for this reason: because it sees all the injustices of people.'
translation:
  language: de
  text: 'Höre nun von den Himmeln, die dir gezeigt wurden: Der unterste ist deshalb düster, weil er all die Ungerechtigkeiten der Menschen sieht.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἄκουσον οὖν
  choice: Höre nun
  rationale: Bewahrt den Imperativ und die folgernde beziehungsweise überleitende Partikel knapp und natürlich.
- source_word: περὶ τῶν δειχθέντων σοι οὐρανῶν
  choice: von den Himmeln, die dir gezeigt wurden
  rationale: Gibt die Mehrzahl οὐρανῶν und das passive Partizip sachgerecht wieder; „von“ klingt im Deutschen nach „hören“ natürlicher als „über“.
- source_word: ὁ κατώτερος
  choice: der unterste
  rationale: Bezieht sich elliptisch auf den zuvor genannten Himmel und bezeichnet die niedrigste der mehreren Himmelssphären.
- source_word: στυγνός
  choice: düster
  rationale: Erfasst die finstere, bedrückende Färbung des Wortes, ohne es auf bloße Dunkelheit zu verengen.
- source_word: πάσας τὰς ἀδικίας
  choice: all die Ungerechtigkeiten
  rationale: Bewahrt die umfassende Aussage und den pluralischen, moralisch wie sozial offenen Sinn von ἀδικία.
- source_word: τῶν ἀνθρώπων
  choice: der Menschen
  rationale: Geschlechtsübergreifende und lexikalisch unmittelbare Wiedergabe.
theological_decisions:
- issue: Personifizierende Aussage über den untersten Himmel
  choice: „weil er … sieht“
  alternative: Eine entpersonalisierte Formulierung wie „weil dort … zu sehen sind“
  rationale: Der griechische Text schreibt dem untersten Himmel ausdrücklich das Sehen zu; diese bildhafte Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur folgt dem griechischen Gedankengang, während Doppelpunkt und Nebensatz im Deutschen flüssig lesbar bleiben.
