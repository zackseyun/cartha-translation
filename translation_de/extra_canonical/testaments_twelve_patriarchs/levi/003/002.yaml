base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/003/002.yaml
  text: And it has fire, snow, and ice prepared for the day determined by God, as a righteous judgment of God upon men. In it are all the spirits of the punishments for vengeance on the lawless. Above this is the holy place, and in it are the hosts of the armies appointed for the day of judgment, to carry out vengeance on the spirits of deceit and of Beliar[b]. Above them are the holy ones. In the highest of all dwells the Great Glory, far above all holiness. In the heaven next to it are the archangels, who minister and make propitiation[a] to the Lord for all the sins committed in ignorance by the righteous, offering to the Lord a sweet-smelling fragrance, a reasonable and bloodless offering[c]. And in the heaven below this are the angels who bear answers to the angels of the presence of the Lord. But in the heaven next below are thrones and dominions, in which hymns are continually offered to God. Therefore, when the Lord looks upon us through the degree of his holiness, the heavens are
    shaken. And the earth also is moved from its foundations, and, trembling, it is shaken to its depths. But the sons of men, having no understanding of these things, go astray and provoke him to anger.
translation:
  language: de
  text: Und es hält Feuer, Schnee und Eis bereit für den von Gott bestimmten Tag, als gerechtes Gericht Gottes über die Menschen. Darin sind alle Geister der Strafen, die an den Gesetzlosen Vergeltung üben sollen. Darüber befindet sich der heilige Ort; in ihm sind die Heerscharen der Heere, die für den Tag des Gerichts dazu bestimmt sind, an den Geistern des Trugs und an Beliar[b] Vergeltung zu üben. Über ihnen sind die Heiligen. Im höchsten Himmel von allen wohnt die große Herrlichkeit, weit über aller Heiligkeit. In dem ihm unmittelbar benachbarten Himmel sind die Erzengel, die dem Herrn dienen und für alle Sünden, welche die Gerechten aus Unwissenheit begangen haben, bei ihm Sühne erwirken[a]. Sie bringen dem Herrn einen wohlriechenden Duft dar, eine vernunftgemäße und unblutige Opfergabe[c]. In dem Himmel darunter sind die Engel, die den Engeln vor dem Angesicht des Herrn Antworten überbringen. In dem nächsttieferen Himmel aber sind Throne und Herrschaften; dort werden Gott unablässig
    Lobgesänge dargebracht. Wenn der Herr daher entsprechend dem Maß seiner Heiligkeit auf uns blickt, werden die Himmel erschüttert. Auch die Erde wird von ihren Grundfesten bewegt; zitternd wird sie bis in ihre Tiefen erschüttert. Doch die Menschensöhne verstehen nichts davon, gehen in die Irre und reizen ihn zum Zorn.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „dem Herrn Sühne leisten“. Das griechische Verb kann in kultischen Zusammenhängen auf beide Weisen wiedergegeben werden.'
    reason: lexical_alternative
  - marker: b
    text: „Beliar“ entspricht der griechischen Namensform; in anderen Überlieferungen wird der Name häufig als „Belial“ wiedergegeben.
    reason: lexical_alternative
  - marker: c
    text: „Eine vernunftgemäße und unblutige Opfergabe“ kann auch als „eine rationale“ oder, stärker deutend, als „eine geistliche und unblutige Opfergabe“ verstanden werden.
    reason: lexical_alternative
lexical_decisions:
- source_word: πῦρ
  choice: Feuer
  rationale: Direkte und kontextuell passende Wiedergabe.
- source_word: χιόνα
  choice: Schnee
  rationale: Bewahrt die konkrete Naturerscheinung der griechischen Aufzählung.
- source_word: κρύσταλλον
  choice: Eis
  rationale: κρύσταλλος kann Kristall oder Eis bezeichnen; im Zusammenhang mit Feuer und Schnee ist „Eis“ im modernen Deutschen am klarsten.
- source_word: ἡτοιμασμένον
  choice: hält … bereit
  rationale: Gibt den Zustand des Vorbereitetseins idiomatisch wieder, ohne die göttliche Bestimmung vorwegzunehmen.
- source_word: Beliar
  choice: Beliar
  rationale: Bewahrt die im griechischen Überlieferungszweig bezeugte Namensform; die verbreitete Alternative wird in der Fußnote genannt.
- source_word: reasonable offering
  choice: vernunftgemäße Opfergabe
  rationale: Bewahrt die Spannung zwischen rationaler, geistiger und kultischer Bedeutung, ohne sie einseitig zu spiritualisieren.
theological_decisions:
- issue: Fürbitte beziehungsweise Sühnehandlung der Erzengel
  choice: bei ihm Sühne erwirken
  alternative: dem Herrn Sühne leisten / den Herrn versöhnen
  rationale: Die Formulierung erhält den kultischen Sinn, vermeidet aber die missverständliche Vorstellung, die Engel würden Gott selbst verändern oder besänftigen.
- issue: Status der unwissentlich sündigenden Gerechten
  choice: Sünden, welche die Gerechten aus Unwissenheit begangen haben
  alternative: unbeabsichtigte Sünden der Gerechten
  rationale: Die ausdrückliche Spannung zwischen Gerechtigkeit und tatsächlicher Sünde bleibt erhalten.
- issue: Kosmische Erschütterung durch Gottes Heiligkeit
  choice: durch die Stufe seiner Heiligkeit
  alternative: entsprechend dem Maß seiner Heiligkeit
  rationale: Die ungewöhnliche abgestufte Himmels- und Heiligkeitssprache wird nicht durch eine glättende dogmatische Deutung ersetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit verständlicher Satzführung. Traditionelle kosmologische und kultische Begriffe wie „Heerscharen“, „Sühne“, „Throne und Herrschaften“ sowie „Menschensöhne“ bleiben erhalten, weil sie die Bildwelt und theologischen Spannungen des Textes tragen. Die unmittelbar vorgelegte griechische Zeile deckt nur den Versanfang ab; der weitere Wortlaut folgt daher vorsichtig der auditierten englischen Konsultationsschicht, ohne deren mögliche Deutungen zusätzlich zu verschärfen.
