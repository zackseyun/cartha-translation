  naturalness: 'Der Text hat ein würdiges, modernes Register. Einzelne Formulierungen sind jedoch unnötig schwerfällig oder unidiomatisch: „Heerscharen der Armeen“ ist tautologisch, und „durch die Stufe seiner Heiligkeit“ klingt im Deutschen sachlich unklar. Die überarbeitete Fassung wahrt die kosmologische Bildsprache, ohne die räumliche oder abgestufte Aussage stärker als die Vorlage festzulegen.'
