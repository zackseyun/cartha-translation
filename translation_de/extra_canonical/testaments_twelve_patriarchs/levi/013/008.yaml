source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: ⸀Ἐὰν γάρ τις φυλάξῃ αὐτὸν ἐκ τῶν πονηρῶν τούτων ἔργων⸀⁵¹ τότε⁵² γενήσεται⁵³ αὐτῷ σοφία⁵⁴ καὶ *παρὰ τοῖς πολεμίοις λαμπρὰ⁵⁵ καὶ ἐπὶ⁵⁶ γῆς ἀλλοτρίας⁵⁷ πατρίς, καὶ ἐν μέσῳ⁵⁸ ἐχθρῶν εὑρηθήσεται⁵⁹ φίλος.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/008.yaml
  text: For if anyone keeps himself from these evil works, then wisdom will become for him splendid even among enemies, and in a foreign land a homeland, and in the midst of foes he will be found a friend.
translation:
  language: de
  text: 'Denn wenn jemand sich vor diesen bösen Taten hütet, dann wird ihm Weisheit zuteilwerden: Sie wird selbst unter Feinden strahlend sein und in einem fremden Land Heimat; und inmitten von Feinden wird er als Freund erkannt werden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξῃ αὐτὸν ἐκ
  choice: sich vor … hütet
  rationale: Gibt die bewahrende, fernhaltende Bedeutung der griechischen Wendung natürlich und präzise wieder.
- source_word: σοφία
  choice: Weisheit
  rationale: Direkte und im Kontext klare Entsprechung.
- source_word: λαμπρά
  choice: strahlend
  rationale: Bewahrt das Bild von Glanz und Hervortreten, ohne es auf bloßen Ruhm oder Ansehen einzuengen.
- source_word: πατρίς
  choice: Heimat
  rationale: Gibt den Gegensatz zu γῆς ἀλλοτρίας idiomatisch und würdevoll wieder.
- source_word: φίλος
  choice: Freundin
  rationale: Das Prädikatsnomen bezieht sich sinngemäß auf die feminine σοφία; die deutsche feminine Form macht diesen fortlaufenden Bezug sichtbar.
theological_decisions:
- issue: Subjekt der drei prädikativen Aussagen
  choice: Die Weisheit bleibt als Subjekt von „strahlend“, „Heimat“ und „Freundin“ erhalten.
  alternative: 'Die Aussagen auf den Menschen beziehen: Er werde unter Feinden berühmt, finde in der Fremde eine Heimat und werde als Freund erfunden.'
  rationale: Die griechische Syntax setzt σοφία als ausdrückliches Subjekt ein; die folgenden femininen Prädikate λαμπρά und φίλος stützen den fortlaufenden Bezug auf die Weisheit. Die ungewöhnliche Bildfolge wird daher nicht geglättet.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem Weisheitsstil. Der Doppelpunkt verdeutlicht, dass die drei folgenden Bilder entfalten, was dem Menschen mit der Weisheit zuteilwird; die genuine metaphorische Spannung bleibt erhalten.
