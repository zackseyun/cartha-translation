  to: 'Denn wenn jemand sich vor diesen bösen Taten hütet, dann wird ihm Weisheit zuteilwerden: Sie wird selbst unter Feinden strahlend sein und in einem fremden Land Heimat; und inmitten von Feinden wird er als Freund erkannt werden.'
  rationale: 'Die Revision bewahrt die ungewöhnliche Bildfolge der Quelle: Weisheit ist unter Feinden „strahlend“ und im fremden Land „Heimat“. Der durch das maskuline φίλος markierte Schluss wird davon getrennt und auf die zuvor genannte Person bezogen. „Als Freund erkannt werden“ gibt εὑρηθήσεται φίλος in natürlichem Deutsch wieder, ohne die passive Wendung oder ihre Aussage abzuschwächen.'
