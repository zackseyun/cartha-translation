  text: Therefore do righteousness, my children, on the earth, so that you may be found in the heavens.
translation:
  language: de
  text: Tut also, meine Kinder, Gerechtigkeit auf der Erde, damit ihr in den Himmeln gefunden werdet.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder, bei aktiver Auffassung des kritisch unsicheren griechischen Wortlauts: „damit ihr sie in den Himmeln findet“, wobei „sie“ sich auf die Gerechtigkeit bezieht.'
    reason: Die Kreuzmarkierung der Edition zeigt eine Text- oder Deutungsunsicherheit bei εὕρητε an; die Form kann aktiv gelesen werden, während die kontextuelle Auslegung eine passive Bedeutung nahelegt.
lexical_decisions:
- source_word: Ποιήσατε … δικαιοσύνην
  choice: Tut … Gerechtigkeit
  rationale: Die Verbindung wird bewusst nah am griechischen Ausdruck wiedergegeben. „Gerecht handeln“ wäre idiomatischer, würde δικαιοσύνη jedoch enger auf Handlungen festlegen.
- source_word: τέκνα μου
  choice: meine Kinder
  rationale: Direkte und natürliche Entsprechung der väterlichen Anrede.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Gibt den räumlichen Gegensatz zu „in den Himmeln“ natürlich wieder.
- source_word: ἐν τοῖς οὐρανοῖς
  choice: in den Himmeln
  rationale: Der Plural des griechischen Textes bleibt erhalten, ohne ihn zum im Deutschen geläufigeren Singular zu glätten.
theological_decisions:
- issue: Deutung von εὕρητε
  choice: damit ihr … gefunden werdet
  alternative: damit ihr [sie] … findet
  rationale: Die überlieferte Form εὕρητε ist formal aktiv und kann „ihr findet“ bedeuten; der vorliegende Text ist jedoch kritisch markiert und wird im Kontext plausibel im Sinn von „ihr werdet gefunden“ verstanden. Die alternative Lesart mit einem ergänzten Objekt bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Mahnrede bleibt knapp und eindringlich; der ungewöhnliche Ausdruck „Gerechtigkeit tun“ sowie der Plural „Himmel“ werden aus Gründen der Quellennähe bewahrt.
