review_pass:
  verdict: revise
  source_fidelity: 'Die passive Wiedergabe „damit ihr ... gefunden werdet“ ist durch die vorliegende griechische Form εὕρητε nicht gedeckt: Diese ist formal ein aktiver Aoristkonjunktiv der 2. Person Plural („ihr findet“). Die Kreuzmarkierung weist zwar auf eine textkritische oder interpretative Schwierigkeit hin, rechtfertigt aber nicht, die aktiv überlieferte Form ohne ausgewiesene Textgrundlage als Passiv zu übersetzen. Das nicht ausgedrückte Objekt kann kontextuell auf „Gerechtigkeit“ bezogen werden und sollte als Ergänzung kenntlich bleiben.'
  naturalness: „Übt Gerechtigkeit“ ist im modernen würdigen Deutsch wesentlich idiomatischer als „Tut ... Gerechtigkeit“ und bewahrt zugleich das Substantiv des griechischen Ausdrucks. „In den Himmeln“ bildet den griechischen Plural quellentreu ab und ist in diesem Register verständlich.
  terminology: „Gerechtigkeit“ ist als zentrale Entsprechung von δικαιοσύνη passend. „Meine Kinder“ und der Plural „Himmeln“ sind beizubehalten. Die Fußnote muss die textkritische Markierung erläutern, darf jedoch eine passive Hauptübersetzung nicht als kontextuelle Bedeutung der aktiv überlieferten Form darstellen.
  issues:
  - severity: high
    issue: Unbegründete passive Übersetzung von εὕρητε
    rationale: εὕρητε ist im gegebenen Text aktiv, nicht passiv. Für „ihr werdet gefunden“ wäre eine passive Form wie εὑρεθῆτε zu erwarten. Die Hauptübersetzung muss daher die aktive Lesart wiedergeben oder eine emendierte passive Lesart ausdrücklich als solche ausweisen.
  - severity: medium
    issue: Die Fußnote stellt die aktive, überlieferte Form nur als Alternative zur passiven Deutung dar
    rationale: Die Fußnote sollte klar sagen, dass der griechische Wortlaut formal aktiv ist und dass das Objekt im Text unausgedrückt bleibt. Die Editionsmarkierung kann knapp dokumentiert werden.
  - severity: low
    issue: „Tut ... Gerechtigkeit“ klingt im modernen Standarddeutsch unnötig unidiomatisch
    rationale: „Übt Gerechtigkeit“ ist eine natürliche, zugleich quellennahe Wiedergabe von ποιήσατε δικαιοσύνην.
  revised_text: Übt also, meine Kinder, Gerechtigkeit auf der Erde, damit ihr [sie] in den Himmeln findet.[a]
  revised_footnotes:
  - marker: a
    text: 'Das griechische Wort εὕρητε ist in der Edition als textkritisch oder deutungsbedürftig markiert. Es lautet formal aktiv: „damit ihr [sie] findet“. Das im Deutschen ergänzte „sie“ ist im griechischen Text nicht ausgedrückt und bezieht sich wahrscheinlich auf die Gerechtigkeit.'
    reason: Die Anmerkung dokumentiert die Editionsmarkierung und die nicht ausgedrückte Objektbeziehung, ohne die aktive griechische Form in eine unbelegte passive Übersetzung umzudeuten.
  revision_rationale: Die Übersetzung wird an die aktiv überlieferte Form εὕρητε angepasst. Die Ergänzung „[sie]“ macht transparent, dass das Objekt im Griechischen fehlt, aber aus dem unmittelbaren Zusammenhang erschlossen wird. „Übt Gerechtigkeit“ verbessert die moderne deutsche Idiomatik, ohne den Begriff δικαιοσύνη zu verengen. Die Fußnote bewahrt die textkritische Unsicherheit, ohne eine grammatisch nicht belegte passive Lesung zu bevorzugen.
