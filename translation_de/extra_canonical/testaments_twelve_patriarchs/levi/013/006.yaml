  verdict: revise
  source_fidelity: 'Eine sichere Korrektur ist nötig: Bei der lokalen Wendung ἐν ταῖς ψυχαῖς ὑμῶν verlangt das Deutsche den Dativ Plural („in euren Seelen“), nicht den Akkusativ („in eure Seelen“). Außerdem gibt „und“ die griechische Satzverbindung καί unmittelbarer wieder als das ergänzende „dann“.'
  naturalness: „Sät Gutes in euren Seelen“ ist als bewusst bewahrtes Bild in würdigem modernen Standarddeutsch verständlich. „Jede Unruhe und Bedrängnis“ gibt die umfassende Aussage natürlicher und genauer wieder als „lauter Unruhe und Bedrängnis“.
  terminology: „Gutes/Böses“, „Seelen“, „Leben“, „Unruhe“, „Bedrängnis“ sowie das Bildfeld „säen/ernten“ sind angemessen. Die Übersetzung legt keinen bestimmten Mechanismus der Folgen nahe.
  issues:
  - severity: medium
    issue: Falscher Kasus in „in eure Seelen“
    rationale: ἐν mit statischer, lokaler Bedeutung entspricht hier im Deutschen „in euren Seelen“ (Dativ Plural). Der Akkusativ würde eine Bewegung in die Seelen hinein ausdrücken und ist in dieser Konstruktion nicht idiomatisch.
  - severity: low
    issue: „dann“ ergänzt eine explizitere Folgeverknüpfung
    rationale: Das griechische καί verbindet schlicht die Aufforderung mit der Zukunftsaussage. „Und“ bewahrt diese Verknüpfung enger.
  - severity: low
    issue: „lauter Unruhe und Bedrängnis“ ist weniger präzise für πᾶσαν
    rationale: πᾶσαν bezeichnet die umfassende Reichweite der zu erntenden Unruhe und Bedrängnis. „Jede Unruhe und Bedrängnis“ bildet dies klarer ab.
  revised_text: Und sät Gutes in euren Seelen, und ihr werdet es in eurem Leben finden. Wenn ihr aber Böses sät, werdet ihr jede Unruhe und Bedrängnis ernten.
