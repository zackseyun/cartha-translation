source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ σπείρατε²⁷ ἐν *ταῖς ψυχαῖς²⁸ ὑμῶν²⁹ ἀγαθὰ *καὶ εὑρήσετε³⁰ αὐτὰ³¹ *ἐν τῇ ζωῇ ὑμῶν³². *Ἐὰν δὲ σπείρητε πονηρὰ³³ *πᾶσαν ταραχὴν καὶ θλίψιν θερίσετε³⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/006.yaml
  text: And sow good things in your souls, and you will find them in your life. But if you sow evil things, you will reap every turmoil and affliction.
translation:
  language: de
  text: Und sät Gutes in euren Seelen, und ihr werdet es in eurem Leben finden. Wenn ihr aber Böses sät, werdet ihr jede Unruhe und Bedrängnis ernten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σπείρατε / σπείρητε
  choice: sät
  rationale: Bewahrt das landwirtschaftliche Bild des Säens und den Gegensatz zum Ernten.
- source_word: ἐν ταῖς ψυχαῖς ὑμῶν
  choice: in eure Seelen
  rationale: Gibt die griechische Wendung formal und verständlich wieder, ohne ψυχή auf »Herz« oder »Inneres« einzuengen.
- source_word: ἀγαθὰ / πονηρὰ
  choice: Gutes / Böses
  rationale: Die substantivierten Adjektive erhalten den umfassenden ethischen Gegensatz des Ausgangstextes.
- source_word: ἐν τῇ ζωῇ ὑμῶν
  choice: in eurem Leben
  rationale: Entspricht unmittelbar dem griechischen Ausdruck und lässt offen, in welchem Lebensbereich das Gesäte gefunden wird.
- source_word: πᾶσαν ταραχὴν καὶ θλίψιν
  choice: lauter Unruhe und Bedrängnis
  rationale: »Lauter« gibt πᾶσαν bei zwei abstrakten Singularbegriffen idiomatisch als umfassende Folge wieder; »Bedrängnis« bewahrt den starken Sinn von θλῖψις.
- source_word: θερίσετε
  choice: werdet ihr … ernten
  rationale: Erhält die Zukunftsaussage und vollendet die Metapher von Saat und Ernte.
theological_decisions:
- issue: Verhältnis von Tun und Folgen
  choice: Die Aussage bleibt als unkommentierter Zusammenhang zwischen Saat und Ernte stehen.
  alternative: Den Satz ausdrücklich als göttliche Vergeltung oder als rein natürliche Folge erklären.
  rationale: Der griechische Text nennt weder ausdrücklich Gott als Handelnden noch erläutert er den Mechanismus; diese Offenheit bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe paränetische Form und die Saat-Ernte-Metapher werden bewahrt; »dann« stellt den Folgezusammenhang natürlich dar, ohne ihn stärker zu bestimmen.
