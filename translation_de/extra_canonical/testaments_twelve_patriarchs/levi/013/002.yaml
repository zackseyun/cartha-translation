id: T12P.LEV.13.2
reference: Testament of Levi 13:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Διδάξατε δὲ καὶ ὑμεῖς⁷ τὰ τέκνα ὑμῶν γράμματα⁸ ἵνα ἔχωσι⁹ σύνεσιν ἐν *πάσῃ τῇ ζωῇ αὐτῶν¹⁰, ἀναγινώσκοντες¹¹ ἀδιαλείπτως¹² τὸν νόμον τοῦ Θεοῦ¹³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/002.yaml
  text: And you also, teach your children letters, so that they may have understanding throughout all their life, reading the law of God without ceasing.
translation:
  language: de
  text: Lehrt auch ihr eure Kinder lesen und schreiben, damit sie ihr ganzes Leben lang Einsicht haben, indem sie unablässig das Gesetz Gottes lesen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γράμματα
  choice: lesen und schreiben
  rationale: Wörtlich »Buchstaben«; im Zusammenhang bezeichnet das Wort die grundlegende Schriftbildung. Die natürliche deutsche Wendung gibt den pädagogischen Sinn klar wieder.
- source_word: σύνεσιν
  choice: Einsicht
  rationale: Bewahrt den Sinn von Verständnis und Urteilsfähigkeit, ohne ihn auf bloßes Wissen zu verengen.
- source_word: ἐν πάσῃ τῇ ζωῇ αὐτῶν
  choice: ihr ganzes Leben lang
  rationale: 'Idiomatiche Wiedergabe der zeitlichen Bedeutung: während ihres gesamten Lebens.'
- source_word: ἀναγινώσκοντες ἀδιαλείπτως
  choice: indem sie unablässig … lesen
  rationale: Das Partizip wird modal beziehungsweise begleitend wiedergegeben; »unablässig« bewahrt die nachdrückliche Kontinuität des griechischen Ausdrucks.
- source_word: τὸν νόμον τοῦ Θεοῦ
  choice: das Gesetz Gottes
  rationale: Formale und theologisch offene Entsprechung des griechischen Ausdrucks.
theological_decisions:
- issue: Verhältnis zwischen lebenslanger Einsicht und fortwährender Gesetzeslektüre
  choice: Die Partizipialkonstruktion wird mit »indem« wiedergegeben.
  alternative: »und sie sollen unablässig … lesen«
  rationale: Das Griechische verbindet das Lesen grammatisch mit dem Erlangen beziehungsweise Besitzen von Einsicht. »Indem« wahrt diese Verbindung, ohne genauer festzulegen, ob Mittel, Begleitumstand oder Lebensweise gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Imperativ bleibt direkt; »lesen und schreiben« vermeidet das heute missverständliche wörtliche »Buchstaben lehren«.
