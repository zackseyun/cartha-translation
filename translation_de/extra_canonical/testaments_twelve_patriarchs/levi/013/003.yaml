source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ὅτι¹⁴ πᾶς, *ὃς γνώσεται¹⁵ *νόμον Κυρίου¹⁶, τιμηθήσεται, καὶ οὐκ ἔσται¹⁷ ξένος, ὅπου ὑπάγει¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/003.yaml
  text: For everyone who comes to know the law of the Lord will be honored, and he will not be a stranger wherever he goes.
translation:
  language: de
  text: Denn jeder, der das Gesetz des Herrn kennenlernt, wird geehrt werden und wird kein Fremder sein, wohin er auch geht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γνώσεται
  choice: kennenlernt
  rationale: Das Futur von γινώσκω bezeichnet hier das Erlangen von Kenntnis; im deutschen Relativsatz gibt das Präsens eine allgemeingültige Aussage natürlich wieder.
- source_word: νόμον Κυρίου
  choice: das Gesetz des Herrn
  rationale: Entspricht der bestimmten griechischen Wendung und bewahrt ihren religiös-ethischen Gehalt ohne zusätzliche Deutung.
- source_word: τιμηθήσεται
  choice: wird geehrt werden
  rationale: Gibt das passive Futur formal und inhaltlich wieder, ohne einen Handelnden hinzuzufügen.
- source_word: ξένος
  choice: Fremder
  rationale: Bewahrt die mögliche soziale Bedeutung einer ortsfremden oder nicht zugehörigen Person.
- source_word: ὅπου ὑπάγει
  choice: wohin er auch geht
  rationale: Natürliches modernes Deutsch für die verallgemeinernde Ortsangabe; ὑπάγει wird als ‚geht‘ wiedergegeben.
theological_decisions:
- issue: Zusammenhang zwischen Gesetzeskenntnis, Ehre und Zugehörigkeit
  choice: Die Aussage bleibt als Verheißung formuliert.
  alternative: Die Ehre oder Aufnahme ausdrücklich als göttliche Belohnung beziehungsweise gesellschaftliche Anerkennung erklären.
  rationale: Der griechische Text nennt weder den Ehrenden noch den Mechanismus der Nicht-Fremdheit; diese Offenheit wird bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt dem griechischen Gedankengang, bleibt aber idiomatisch; keine konfessionell geprägte Terminologie wurde ergänzt.
