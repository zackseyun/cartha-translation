review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung trifft den Mahncharakter, φοβεῖσθε („Fürchtet“), πορεύεσθε im Sinn der Lebensführung („lebt“) sowie die umfassende Ausrichtung am Gesetz gut. Jedoch lässt „von ganzem Herzen“ das im griechischen Text ausdrücklich vorhandene Possessivum ὑμῶν („eurem“) unmarkiert. „mit eurem ganzen Herzen“ gibt ἐξ ὅλης τῆς καρδίας ὑμῶν idiomatisch und vollständig wieder.
  naturalness: Die Sprache ist würdig, klar und modernes Standarddeutsch. „Lebt in Aufrichtigkeit nach seinem ganzen Gesetz“ ist natürlich genug und bewahrt die paränetische Satzführung.
  terminology: „Herr, euer Gott“ entspricht Κύριον τὸν Θεὸν ὑμῶν. „Fürchtet“ bewahrt den gewichtigen religiös-ethischen Gehalt von φοβεῖσθε. „Aufrichtigkeit“ ist eine sachgerechte, moderne Wiedergabe von ἐν ἁπλότητι und vermeidet eine einseitige Deutung. „Seinem ganzen Gesetz“ gibt πάντα τὸν νόμον αὐτοῦ angemessen wieder.
  issues:
