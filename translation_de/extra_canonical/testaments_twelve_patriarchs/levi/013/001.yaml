source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *νῦν, τέκνα μου¹, ἐντέλλομαι ὑμῖν, φοβεῖσθε² *Κύριον τὸν Θεὸν ὑμῶν³ Γἐξ ὅλης τῆς καρδίας ὑμῶν⁴⁾, καὶ πορεύεσθε ἐν ἁπλότητι⁵ *κατὰ πάντα τὸν νόμον αὐτοῦ⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/001.yaml
  text: 'And now, my children, I command you: fear the Lord your God with all your heart, and walk in simplicity in accordance with all his law.'
translation:
  language: de
  text: 'Und nun, meine Kinder, gebiete ich euch: Fürchtet den Herrn, euren Gott, mit eurem ganzen Herzen und lebt in Aufrichtigkeit nach seinem ganzen Gesetz.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβεῖσθε
  choice: Fürchtet
  rationale: Gibt den religiös-ethischen Imperativ direkt wieder und bewahrt sowohl Ehrfurcht als auch den Ernst des griechischen Ausdrucks.
- source_word: πορεύεσθε
  choice: lebt
  rationale: Das wörtliche „geht“ bezeichnet hier idiomatisch die Lebensführung; „lebt“ ist im modernen Deutschen natürlich und sinngenau.
- source_word: ἐν ἁπλότητι
  choice: in Aufrichtigkeit
  rationale: ἁπλότης bezeichnet hier eine ungeteilte, lautere Haltung. „Aufrichtigkeit“ ist verständlich und vermeidet die moderne Nebenbedeutung mangelnder Klugheit bei „Einfalt“.
- source_word: κατὰ πάντα τὸν νόμον αὐτοῦ
  choice: nach seinem ganzen Gesetz
  rationale: Bewahrt den umfassenden Bezug von πάντα auf das Gesetz und gibt κατά idiomatisch als Übereinstimmung mit dessen Maßstab wieder.
theological_decisions:
- issue: Bedeutungsumfang von φόβος in der Gottesbeziehung
  choice: Fürchtet den Herrn
  alternative: Habt Ehrfurcht vor dem Herrn
  rationale: „Fürchtet“ wahrt die sprachliche und theologische Spannung zwischen Ehrfurcht, Gehorsam und ernstem Gottesbewusstsein, ohne sie auf bloßen Respekt einzuengen.
- issue: Wiedergabe von ἁπλότης als sittlich-geistliche Haltung
  choice: Aufrichtigkeit
  alternative: Lauterkeit
  rationale: „Aufrichtigkeit“ vermittelt die ungeteilte und redliche Lebenshaltung in allgemein verständlicher Sprache; „Lauterkeit“ wäre formeller und weniger alltagssprachlich.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Anrede. Der Satzbau folgt dem griechischen Mahnwort, wird jedoch idiomatisch geglättet. Keine Fußnoten erforderlich.
