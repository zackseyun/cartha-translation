base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/004.yaml
  text: Indeed, he will gain many friends beyond his parents, and many among men will desire to serve him and to hear the law from his mouth.
translation:
  language: de
  text: Ja, er wird neben seinen Eltern viele Freunde gewinnen, und viele Menschen werden danach verlangen, ihm zu dienen und das Gesetz aus seinem Mund zu hören.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Καίγε
  choice: Ja
  rationale: Gibt die bekräftigende Funktion der Partikelkombination natürlich und würdevoll wieder.
- source_word: πολλοὺς φίλους ὑπὲρ γονεῖς
  choice: mehr Freunde als Eltern
  rationale: Bewahrt die knappe Vergleichskonstruktion des Griechischen, ohne die mögliche gedankliche Spannung durch eine erklärende Umschreibung aufzulösen.
- source_word: κτήσεται
  choice: wird … gewinnen
  rationale: Drückt den Erwerb beziehungsweise das Gewinnen von Freunden im Deutschen idiomatisch aus.
- source_word: πολλοὶ τῶν ἀνθρώπων
  choice: viele Menschen
  rationale: Natürliche moderne Wiedergabe der partitiven griechischen Formulierung.
- source_word: ἐπιθυμήσουσι
  choice: werden danach verlangen
  rationale: Bewahrt die starke Bedeutung von ἐπιθυμέω besser als ein bloßes »wünschen«.
- source_word: δουλεῦσαι αὐτῷ
  choice: ihm zu dienen
  rationale: Entspricht dem Dativobjekt und lässt den Grad der Dienst- oder Unterordnungsbeziehung offen.
- source_word: ἀκοῦσαι νόμου ἐκ τοῦ στόματος αὐτοῦ
  choice: das Gesetz aus seinem Mund zu hören
  rationale: Folgt dem Quellenausdruck ἐκ τοῦ στόματος und gibt νόμος im erkennbaren jüdischen Weisungszusammenhang idiomatisch bestimmt wieder.
theological_decisions:
- issue: Bedeutung von νόμος ohne Artikel
  choice: das Gesetz
  alternative: Gesetz / Weisung
  rationale: Der fehlende griechische Artikel verlangt keine unbestimmte deutsche Wiedergabe. »Das Gesetz« ist im Kontext idiomatisch, ohne näher festzulegen, ob die Tora als Ganzes oder autoritative Weisung gemeint ist.
- issue: Vergleich von Freunden und Eltern
  choice: mehr Freunde als Eltern
  alternative: Freunde über seine Eltern hinaus
  rationale: Die vergleichende Lesart von ὑπέρ wird unmittelbar bewahrt; die ungewöhnliche Aussage wird nicht harmonisierend umgedeutet.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Stil. Die ungewöhnliche Vergleichsformulierung bleibt bewusst knapp und spannungsvoll; der parallele Infinitivbau wird natürlich wiedergegeben.
