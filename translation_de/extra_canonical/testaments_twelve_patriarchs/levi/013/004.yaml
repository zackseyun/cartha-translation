- from: Ja, er wird mehr Freunde als Eltern gewinnen, und viele Menschen werden danach verlangen, ihm zu dienen und das Gesetz aus seinem Mund zu hören.
  to: Ja, er wird neben seinen Eltern viele Freunde gewinnen, und viele Menschen werden danach verlangen, ihm zu dienen und das Gesetz aus seinem Mund zu hören.
  rationale: Die Revision beschränkt sich auf die griechische ὑπέρ-Konstruktion. Sie beseitigt eine deutsche Mehrdeutigkeit, erhält aber die knappe, potenziell ungewöhnliche Aussage, dass er Freunde über die Elternbeziehung hinaus gewinnen wird. Weitere Änderungen sind nicht erforderlich. Die in der Quelledition gesetzten Ziffern 19–23 sind hier nicht mit Anmerkungstext überliefert und verlangen daher keine deutschen Fußnotenanker.
