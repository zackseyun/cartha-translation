revisions:
- from: Erwerbt Weisheit in der Furcht Gottes; denn selbst wenn Gefangenschaft kommt, Städte und Landstriche zerstört werden und Gold, Silber und jeder Besitz verloren gehen, kann niemand dem Weisen seine Weisheit nehmen – außer der Blindheit der Gottlosigkeit und der Verhärtung durch die Sünde.[a]
  to: Erwerbt Weisheit in der Furcht Gottes; denn wenn Gefangenschaft kommt, Städte und Landstriche zerstört werden und Gold, Silber und jeder Besitz verloren gehen, kann niemand dem Weisen seine Weisheit nehmen – außer der Blindheit der Gottlosigkeit und der Verhärtung der Sünde.[a]
  rationale: Die Revision entfernt die nicht im griechischen Text enthaltene Verstärkung „selbst“ und ersetzt die kausal interpretierende Wiedergabe „durch die Sünde“ durch eine parallele Genitivfügung. Dadurch bleiben Bedingtheit, rhetorische Zuspitzung und die semantische Offenheit der beiden Schlussgenitive erhalten.
