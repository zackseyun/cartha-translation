source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Σοφίαν κτήσασθε³⁵ *ἐν φόβῳ³⁶ Θεοῦ³⁷, ὅτι³⁸ ἐὰν *γένηται αἰχμαλωσία, καὶ ὀλοθρευθῶσι πόλεις καὶ χῶραι³⁹ *καὶ χρυσὸς καὶ ἄργυρος καὶ πᾶσα⁴⁰ κτῆσις⁴¹ ἀπολεῖται⁴², *τοῦ σοφοῦ τὴν σοφίαν⁴³ †οὐδεὶς⁴⁴ δύναται⁴⁵ ἀφελέσθαι⁴⁶ εἰ μὴ τύφλωσις⁴⁷ ἀσεβείας⁴⁸ καὶ πώρωσις⁴⁹ ἁμαρτίας⁵⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/007.yaml
  text: Acquire wisdom in the fear of God, because if captivity comes, and cities and lands are destroyed, and gold and silver and every possession perish, no one can take away the wise man's wisdom, except the blindness of ungodliness and the hardening of sin.
translation:
  language: de
  text: Erwerbt Weisheit in der Furcht Gottes; denn wenn Gefangenschaft kommt, Städte und Landstriche zerstört werden und Gold, Silber und jeder Besitz verloren gehen, kann niemand dem Weisen seine Weisheit nehmen – außer der Blindheit der Gottlosigkeit und der Verhärtung der Sünde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechischen Genitivverbindungen können das genaue Verhältnis von Blindheit zu Gottlosigkeit und von Verhärtung zu Sünde jeweils unterschiedlich näher bestimmen; der Text lässt dies offen.
    reason: Erläutert die bewusste Beibehaltung der grammatischen Mehrdeutigkeit beider parallelen Genitivverbindungen.
lexical_decisions:
- source_word: Σοφίαν κτήσασθε
  choice: Erwerbt Weisheit
  rationale: Der Imperativ κτήσασθε bezeichnet das Erlangen oder Erwerben; die knappe deutsche Wendung bewahrt Bild und Aufforderungscharakter.
- source_word: ἐν φόβῳ Θεοῦ
  choice: in der Furcht Gottes
  rationale: Die formnahe Wiedergabe erhält den religiös-ethischen Sinn von ehrfürchtiger Gottesfurcht, ohne ihn auf bloße Angst oder Ehrfurcht einzuengen.
- source_word: αἰχμαλωσία
  choice: Gefangenschaft
  rationale: Das Wort kann Gefangennahme beziehungsweise einen Zustand der Gefangenschaft bezeichnen; der weitere Kontext von zerstörten Städten und Gebieten legt kollektive Gefangenschaft nahe.
- source_word: πόλεις καὶ χῶραι
  choice: Städte und Landstriche
  rationale: χῶραι meint hier Gebiete oder Landstriche; diese Wiedergabe ist natürlicher und konkreter als das mehrdeutige „Länder“.
- source_word: πᾶσα κτῆσις
  choice: jeder Besitz
  rationale: κτῆσις bezeichnet Erworbenes beziehungsweise Besitz und setzt so das Motiv vergänglicher materieller Güter fort.
- source_word: τοῦ σοφοῦ τὴν σοφίαν
  choice: dem Weisen seine Weisheit
  rationale: Die deutsche Konstruktion gibt den Genitiv τοῦ σοφοῦ verständlich wieder und bewahrt die pointierte Wiederholung von „weise/Weisheit“.
- source_word: τύφλωσις ἀσεβείας
  choice: Blindheit der Gottlosigkeit
  rationale: 'Der Genitiv bleibt bewusst offen: Er kann Herkunft, Kennzeichnung oder Wirkung ausdrücken.'
- source_word: πώρωσις ἁμαρτίας
  choice: Verhärtung durch die Sünde
  rationale: πώρωσις bezeichnet Verstockung oder Verhärtung. „durch“ verdeutlicht im Deutschen die Sünde als mögliche verursachende Macht, ohne die Aussage unnötig zu konfessionalisieren.
theological_decisions:
- issue: Kann Weisheit überhaupt genommen werden?
  choice: 'Die zugespitzte Ausnahme bleibt stehen: Nur Gottlosigkeit und Sünde können die Weisheit des Weisen zunichtemachen.'
  alternative: Die Ausnahmeklausel als Aussage über Selbstverlust oder innere Verderbnis ausdrücklich erläutern.
  rationale: Der griechische Text verbindet οὐδεὶς δύναται ἀφελέσθαι direkt mit εἰ μὴ. Die Spannung zwischen äußerer Unverlierbarkeit und innerer Gefährdung soll nicht durch eine erklärende Paraphrase aufgelöst werden.
- issue: Bedeutung der Genitive bei Gottlosigkeit und Sünde
  choice: „Blindheit der Gottlosigkeit“ bleibt formal mehrdeutig; bei „Verhärtung durch die Sünde“ wird eine natürliche deutsche Kausalbeziehung gewählt.
  alternative: Beide Wendungen streng parallel als „Blindheit der Gottlosigkeit und Verhärtung der Sünde“ wiedergeben.
  rationale: Ein rein formaler Parallelismus wäre im Deutschen bei „Verhärtung der Sünde“ missverständlich, als ob die Sünde selbst verhärtet würde. Die Fußnote weist auf die grammatische Offenheit hin.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Mahnrede. Der Satzbau folgt der Steigerung des griechischen Textes; der Gedankenstrich hebt die paradoxe Ausnahmeklausel hervor. „Selbst wenn“ gibt ἐὰν im argumentativen Zusammenhang idiomatisch wieder, ohne die Bedingtheit zu beseitigen.
