base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013/009.yaml
  text: Everyone who teaches good things and does them will be enthroned with kings, just as Joseph my brother also was.
translation:
  language: de
  text: Jeder, der Gutes lehrt und tut, wird mit Königen den Thron teilen, wie auch mein Bruder Josef.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καλὰ
  choice: Gutes
  rationale: Das substantivierte Adjektiv bezeichnet hier gute oder edle Dinge beziehungsweise Lehren; „Gutes“ ist im Deutschen natürlich und bewahrt die inhaltliche Weite.
- source_word: πράττει
  choice: danach handelt
  rationale: Der alleinstehende Ausdruck bedeutet wörtlich „tut/handelt“. „Danach handelt“ macht den Rückbezug auf das gelehrte Gute idiomatisch deutlich, ohne einen zusätzlichen theologischen Inhalt einzuführen.
- source_word: σύνθρονος
  choice: mit Königen auf dem Thron sitzen
  rationale: Das Prädikatsadjektiv bedeutet „den Thron mit jemandem teilend“ beziehungsweise „mitthronend“. Die Formulierung gibt das Bild verständlich wieder, ohne das im Deutschen stärker nach einer Einsetzung klingende „inthronisiert“ zu verwenden.
- source_word: ὥσπερ καὶ
  choice: so wie auch
  rationale: Bewahrt sowohl den Vergleich als auch die hervorhebende Partikel καί.
theological_decisions:
- issue: Verhältnis zwischen Lehre und Handeln
  choice: „Gutes lehrt und danach handelt“ bewahrt die Verbindung beider Tätigkeiten als Kennzeichen derselben Person.
  alternative: „Gutes lehrt und tut“
  rationale: Die Übersetzung macht den grammatischen Rückbezug verständlich, ohne eine Aussage über Verdienst, Ursache oder Heilsordnung hinzuzufügen.
- issue: Josef als Vergleichsfigur
  choice: 'Der abschließende Vergleich bleibt elliptisch: „so wie auch mein Bruder Josef“.'
  alternative: „so wie es auch bei meinem Bruder Josef der Fall war“
  rationale: Das Griechische lässt das Prädikat im Vergleich aus. Die knappe deutsche Ellipse bewahrt diese Form und ist dennoch verständlich.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Satz ist knapp und sprichwortartig gehalten; die Bildsprache des gemeinsamen Thronens bleibt erhalten.
