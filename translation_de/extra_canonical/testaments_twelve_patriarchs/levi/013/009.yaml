  source_fidelity: Die Aussage καλὰ διδάσκει καὶ πράττει wird mit „Gutes lehrt und tut“ unmittelbar und ohne zusätzliche Nuance wiedergegeben. σύνθρονος ... βασιλέων bezeichnet das Teilhaben am Thron bzw. das gemeinsame Thronen mit Königen; „mit Königen den Thron teilen“ trifft dieses Bild präziser als die im Entwurf mögliche Lesart eines bloßen Sitzens auf einem Thron.
  naturalness: „Jeder, der Gutes lehrt und tut, wird mit Königen den Thron teilen“ ist idiomatisches modernes Standarddeutsch und bewahrt den knappen, sentenzhaften Registerton. Die abschließende Ellipse ist im Deutschen verständlich und entspricht der griechischen Auslassung des Prädikats.
  terminology: „Gutes“ ist für καλά passend. „Josef“ ist die im Deutschen übliche Namensform. Die Formulierung „den Thron teilen“ vermittelt σύνθρονος ohne die stärker institutionelle oder einseitig passive Konnotation von „inthronisiert werden“.
