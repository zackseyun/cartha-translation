lexical_decisions:
- source_word: Ἀπάραντες
  choice: brachen wir auf
  rationale: Das Partizip von ἀπαίρω bezeichnet hier im Zusammenhang einer Reise am natürlichsten das Aufbrechen beziehungsweise Fortziehen; ein nicht genanntes Objekt muss daher nicht ergänzt werden.
- source_word: δὲ
  choice: Dann … und
  rationale: Die fortführende Erzählungsverknüpfung wird im Deutschen idiomatisch durch „Dann“ und die anschließende Koordination wiedergegeben.
- source_word: ἤλθομεν εἰς
  choice: kamen nach
  rationale: Bei einem Ortsziel entspricht die Verbindung im modernen Deutschen natürlich „nach … kommen“.
- source_word: Δίναν Βεθήλ
  choice: Dinan-Bethel
  rationale: Beide im griechischen Text überlieferten Namensbestandteile bleiben erhalten; der Bindestrich macht sie im Deutschen als zusammengehörige Ortsbezeichnung lesbar, ohne ihre genaue Beziehung weiter auszudeuten.
