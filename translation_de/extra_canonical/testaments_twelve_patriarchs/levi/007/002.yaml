source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ἔσται γὰρ ἀπὸ τῆς⁹ σήμερον *ἡ Σύκημα¹⁰ λεγομένη πόλις ἀσυνέτων¹¹, ὅτι¹² ὡσεί¹³ τις *χλευάσει μωρὸν¹⁴ οὕτως ἐχλευάσαμεν αὐτούς¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/007/002.yaml
  text: For from this day the city called Sychem shall be a city of senseless people. For just as someone mocks a fool, so we mocked them,
translation:
  language: de
  text: Denn von heute an wird die Stadt Sichem eine Stadt der Unverständigen sein; denn wie man einen Narren verspottet, so haben wir sie verspottet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔσται … ἡ Σύκημα λεγομένη πόλις ἀσυνέτων
  choice: wird die Stadt, die Sichem genannt wird, »Stadt der Unverständigen« heißen
  rationale: Die prädikative Genitivverbindung πόλις ἀσυνέτων wird natürlich als Bezeichnung der Stadt wiedergegeben. »Unverständige« bildet ἀσύνετοι genauer ab als das stärkere »Narren« und erhält den Kontrast zu μωρόν.
- source_word: Σύκημα
  choice: Sichem
  rationale: Gebräuchliche deutsche Namensform des Ortsnamens.
- source_word: ὡσεί τις χλευάσει μωρόν
  choice: wie man einen Narren verspottet
  rationale: Das unbestimmte τις wird im Deutschen idiomatisch mit »man« wiedergegeben; μωρόν bezeichnet ausdrücklich einen Narren oder Toren.
- source_word: ἐχλευάσαμεν αὐτούς
  choice: haben wir sie verspottet
  rationale: Bewahrt Person, Tempus und den pluralischen Rückbezug des griechischen Textes.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wahrt die begründende Wiederholung von γάρ, vermeidet aber unnötig archaische Formen. Die Differenz zwischen ἀσυνέτων (»Unverständige«) und μωρόν (»Narr«) bleibt erkennbar.
