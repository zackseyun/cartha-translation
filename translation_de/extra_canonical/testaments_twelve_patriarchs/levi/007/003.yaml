  text: Ὅτι καίγε¹⁶ ἀφροσύνην ἔπραξαν ἐν Ἰσραὴλ μιάναντες¹⁷ τὴν ἀδελφήν μου¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/007/003.yaml
  text: because they indeed committed folly in Israel, defiling my sister.
translation:
  language: de
  text: Denn sie begingen in Israel tatsächlich eine Schandtat, indem sie meine Schwester befleckten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὅτι
  choice: Denn
  rationale: Gibt die begründende Funktion der Konjunktion im Zusammenhang natürlich wieder.
- source_word: καίγε
  choice: wirklich
  rationale: Bewahrt die verstärkende Bedeutung der Partikel, ohne im Deutschen unnötig schwerfällig zu klingen.
- source_word: ἀφροσύνην ἔπραξαν
  choice: eine Schandtat begangen
  rationale: Die feste Wendung bezeichnet hier nicht bloß mangelnde Klugheit, sondern ein verwerfliches, schändliches Handeln; „Schandtat“ vermittelt diese kontextuelle Wertung idiomatisch.
- source_word: ἐν Ἰσραήλ
  choice: in Israel
  rationale: Formale und natürliche Wiedergabe des gesellschaftlich-bundesbezogenen Bezugsrahmens.
- source_word: μιάναντες
  choice: indem sie … entehrten
  rationale: Das aoristische Partizip erläutert die konkrete Tat; „indem“ erhält diesen sachlichen Bezug, ohne eine darüber hinausgehende zeitliche Aussage festzulegen.
- source_word: τὴν ἀδελφήν μου
  choice: meine Schwester
  rationale: Direkte und eindeutige Wiedergabe.
theological_decisions:
- issue: Bedeutungsumfang von μιαίνω im Zusammenhang sexueller Gewalt
  choice: entehrten
  alternative: befleckten / verunreinigten
  rationale: „Entehrten“ ist im heutigen Deutsch verständlicher und bezeichnet die schwere Verletzung der Schwester, ohne eine spezifische kultische Unreinheitslehre in den Text einzutragen.
- issue: Verhältnis des Partizips μιάναντες zur Schandtat
  choice: 'instrumental-erklärend: „indem sie“'
  alternative: 'begleitend: „wobei sie“ oder appositionell mit Komma'
  rationale: Das Partizip benennt, worin die Schandtat bestand. „Indem“ macht diesen Bezug natürlich deutlich, ohne ihn dogmatisch weiter auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Schandtat“ trägt die starke moralische Wertung der griechischen Wendung; „wirklich“ bildet die Verstärkung durch καίγε zurückhaltend ab.
