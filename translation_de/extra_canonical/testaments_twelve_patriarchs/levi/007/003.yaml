  source_fidelity: Die Wendung ἀφροσύνην ἔπραξαν greift im vorliegenden Kontext die Formel für eine schwere „Schandtat“ auf; diese Wiedergabe ist treffend. μιάναντες bezeichnet jedoch ausdrücklich ein Beflecken/Verunreinigen. „Entehrten“ gibt die kontextuelle sexuelle Verletzung zwar verständlich wieder, schwächt aber dieses Bild und verschiebt es zur Kategorie sozialer Ehre. Außerdem markiert das Plusquamperfekt „hatten ... begangen“ einen Vorzeitigkeitsbezug, den der griechische Aorist allein nicht vorgibt.
  naturalness: „Denn sie begingen in Israel tatsächlich eine Schandtat, indem sie meine Schwester befleckten“ ist modernes, würdiges Standarddeutsch. „Befleckten“ ist hier als literarisch-biblische, kontextgerecht sexuelle Ausdrucksweise verständlich; es sollte nicht als Wertung der betroffenen Schwester verstanden werden, sondern bildet das Prädikat der Täter ab.
  terminology: „Schandtat“ bewahrt die traditionelle und kontextuell angemessene Stärke von ἀφροσύνη in dieser Formel. „Tatsächlich“ gibt καίγε etwas neutraler als „wirklich“ wieder. „Befleckten“ stellt die Bildsprache von μιαίνω wieder her, ohne eine besondere kultische oder konfessionelle Deutung zu ergänzen.
