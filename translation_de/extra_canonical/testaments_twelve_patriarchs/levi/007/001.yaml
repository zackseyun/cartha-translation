  naturalness: Der Entwurf ist insgesamt flüssiges, würdiges modernes Standarddeutsch. »In dir wird der Herr die Kanaaniter zunichtemachen« ist bewusst leicht traditionssprachlich, aber verständlich und der direkten Rede angemessen.
