  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/007/001.yaml
  text: And I said to my father Jacob, “In you the Lord will bring the Canaanites to nothing, and he will give their land to you and to your seed after you.”
translation:
  language: de
  text: 'Und ich sagte zu meinem Vater Jakob: »In dir wird der Herr die Kanaaniter zunichtemachen, und er wird ihr Land dir und deinen Nachkommen nach dir geben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν σοὶ
  choice: durch dich
  rationale: Die instrumentale Wiedergabe bildet die naheliegende Bedeutung der Präposition ἐν mit Dativ in diesem Zusammenhang natürlich ab, ohne Jakob ausdrücklich selbst zum Handelnden zu machen.
- source_word: ἐξουδενώσει
  choice: wird … zunichtemachen
  rationale: Bewahrt die starke Aussage des Verbs, das hier Erniedrigung, Verachtung oder Vernichtung bezeichnen kann, und entspricht dem gerichtlichen Kontext.
- source_word: σπέρματί σου
  choice: deinen Nachkommen
  rationale: Das kollektive σπέρμα bezeichnet hier die Nachkommenschaft; die moderne deutsche Wiedergabe ist klarer als das wörtliche »Samen«.
- source_word: μετὰ σε
  choice: nach dir
  rationale: Gibt die zeitliche beziehungsweise generationelle Folge knapp und quellennah wieder.
theological_decisions:
- issue: Rolle Jakobs in der Vernichtung der Kanaaniter
  choice: »Durch dich wird der Herr … zunichtemachen«
  alternative: »An dir wird der Herr … als nichts erweisen« / »In dir wird der Herr … zunichtemachen«
  rationale: Die Formulierung lässt den Herrn ausdrücklich als Handelnden stehen und versteht ἐν σοὶ instrumental, ohne eine weitergehende heilsgeschichtliche Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Direkte Rede mit deutschen Anführungszeichen; klare Satzführung ohne archaische Formen.
