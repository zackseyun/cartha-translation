base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016.yaml
  text: 'And now I know that for seventy weeks you will go astray[a], and you will profane the priesthood and defile the altars. And you will set aside the law and treat the words of the prophets with contempt in evil perversity. You will persecute righteous men, and you will hate the godly; you will loathe the words of the truthful.


    And a man who renews the law in the power of the Most High you will call a deceiver, and at last you will rush to kill him, not knowing his stature, taking innocent blood upon your heads in wickedness.


    But I tell you that because of him your holy places will be laid waste to the ground. And no clean place will remain for you, but you will be among the nations of the earth for a curse and for scattering[b][a][a], until he himself visits again and shows compassion and receives you.'
translation:
  language: de
  text: 'XVI. Und nun weiß ich: Siebzig Wochen lang werdet ihr in die Irre gehen, das Priestertum entweihen und die Altäre verunreinigen. 2 Ihr werdet das Gesetz verwerfen und in böser Verkehrtheit die Worte der Propheten verachten. Gerechte Männer werdet ihr verfolgen und die Gottesfürchtigen hassen; die Worte der Wahrhaftigen werdet ihr verabscheuen.


    3 Einen Mann, der das Gesetz in der Kraft des Höchsten erneuert,[a] werdet ihr einen Verführer nennen. Schließlich werdet ihr darauf drängen, ihn zu töten. Ohne seine Größe zu kennen,[b] ladet ihr in eurer Bosheit unschuldiges Blut auf eure Häupter.[c]


    4 Doch ich sage euch: Seinetwegen werden eure Heiligtümer bis auf den Grund verwüstet werden. 5 Kein reiner Ort wird euch bleiben. Vielmehr werdet ihr unter den Völkern zum Fluch und zur Zerstreuung werden, bis er selbst wieder nach euch sieht, sich erbarmt und euch annimmt.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „der das Gesetz neu macht“. Die Formulierung kann auch als feindselige Bezeichnung für eine erneuernde Gestalt verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: Wörtlich kann das Wort „Statur“ oder „Wuchs“ bedeuten; hier sind auch „wahre Bedeutung“, „Würde“ oder „Größe“ möglich.
    reason: lexical_alternative
  - marker: c
    text: Der griechische Text dieses Verses ist schwierig und weist Anzeichen einer gestörten Überlieferung auf. Der Abschnitt wird nach dem vorliegenden Textzeugen wiedergegeben, könnte jedoch eine Erweiterung oder spätere Einfügung sein.
    reason: textual_variant
  - marker: d
    text: Das Subjekt von „er selbst wieder nach euch sieht“ kann Gott sein, möglicherweise aber auch die zuvor erwähnte Gestalt. Der griechische Wortlaut legt den Bezug nicht eindeutig fest.
    reason: alternative_reading
lexical_decisions:
- source_word: ἑβδομήκοντα ἑβδομάδας
  choice: siebzig Wochen lang
  rationale: Gibt den griechischen Zeitausdruck wörtlich und verständlich wieder, ohne ihn deutend zu „siebzig Siebenern“ oder Jahren auszuweiten.
- source_word: πλανηθήσεσθε
  choice: werdet ihr in die Irre gehen
  rationale: Bewahrt sowohl die passive Form als auch den Gedanken moralischer Verirrung, ohne eindeutig äußere Verführung als Ursache festzulegen.
- source_word: ἱερωσύνην βεβηλώσετε
  choice: das Priestertum entweihen
  rationale: Entspricht der kultischen Sprache und bezieht die Verletzung ausdrücklich auf das Priestertum.
- source_word: θυσιαστήρια μιανεῖτε
  choice: die Altäre verunreinigen
  rationale: Gibt die kultische Befleckung natürlich und deutlich wieder; der Plural bleibt erhalten.
- source_word: τὸν νόμον ἀθετήσετε
  choice: das Gesetz verwerfen
  rationale: Drückt die Zurückweisung beziehungsweise Missachtung des Gesetzes klar aus, ohne spätere dogmatische Fachsprache einzutragen.
- source_word: ἐν διαστροφῇ κακῇ
  choice: in böser Verkehrtheit
  rationale: Erhält die moralische Vorstellung von Verdrehung und Verderbtheit statt sie zu einem bloßen Adverb abzuschwächen.
- source_word: εὐσεβεῖς
  choice: die Gottesfürchtigen
  rationale: Eine geläufige, würdige Wiedergabe für fromme beziehungsweise ehrfürchtig auf Gott ausgerichtete Menschen.
- source_word: ἀληθινῶν λόγους
  choice: die Worte der Wahrhaftigen
  rationale: Folgt der wahrscheinlich personalen substantivischen Lesart des Adjektivs und bewahrt zugleich die knappe Konstruktion.
- source_word: ἄνδρα καινοποιοῦντα ... νόμον
  choice: einen Mann, der das Gesetz ... erneuert
  rationale: Bewahrt den Gedanken des Neu- beziehungsweise Erneuermachens, ohne die Gestalt anachronistisch als bestimmten religiösen Reformator festzulegen.
- source_word: ἀνάστημα
  choice: Größe
  rationale: Das Wort bezeichnet wörtlich Wuchs oder Statur, kann hier aber auch Rang, Würde oder wahre Bedeutung meinen; „Größe“ hält körperliche und übertragene Nuancen offen.
- source_word: ἐπισκέψηται
  choice: nach euch sieht
  rationale: Gibt den Gedanken fürsorglicher Heimsuchung beziehungsweise Zuwendung idiomatisch wieder und vermeidet die im Deutschen oft strafende Konnotation von „heimsuchen“.
- source_word: προσδέξηται
  choice: euch annimmt
  rationale: Vermittelt das gnädige Aufnehmen oder Willkommenheißen im Zusammenhang mit Erbarmen.
theological_decisions:
- issue: Textkritisch schwieriger Abschnitt über den Mann, der das Gesetz erneuert, und seine Tötung
  choice: Der überlieferte Abschnitt wird im Haupttext wiedergegeben und mit einer textkritischen Fußnote versehen.
  alternative: Den Abschnitt als spätere Erweiterung auslassen oder ausdrücklich messianisch deuten.
  rationale: Die vorgelegte griechische Textgestalt enthält den Abschnitt. Seine Unsicherheit wird transparent kenntlich gemacht, ohne ihn stillschweigend zu entfernen oder christologisch festzulegen.
- issue: Bedeutung von ἀνάστημα
  choice: „seine Größe“ im Haupttext, mit den Möglichkeiten „Statur“, „wahre Bedeutung“ und „Würde“ in der Fußnote
  alternative: „seine Statur“ streng wörtlich oder „seine Majestät“ stärker deutend
  rationale: Die Übersetzung wahrt den möglichen wörtlichen Hintergrund und die übertragene Bedeutung, ohne die Identität oder Hoheit der Gestalt dogmatisch festzuschreiben.
- issue: Bezug von δι᾽ αὐτόν in Vers 4
  choice: „Seinetwegen“ ohne nähere Erklärung des kausalen Zusammenhangs
  alternative: „Wegen seiner Tötung“ oder „um seinetwillen“
  rationale: Der griechische Text verweist auf die zuvor erwähnte Gestalt, benennt jedoch nicht ausdrücklich, welcher Aspekt das Gericht begründet.
- issue: Bezug von αὐτός im Schluss von Vers 5
  choice: „bis er selbst wieder nach euch sieht“; der Bezug bleibt im Haupttext offen
  alternative: „bis Gott selbst ...“ oder Bezug auf den zuvor genannten Mann
  rationale: Das griechische Pronomen nennt seinen Bezug nicht ausdrücklich. Eine Fußnote bewahrt die theologische Spannung zwischen göttlichem Subjekt und zuvor erwähnter Gestalt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Ton. Kultische Schlüsselbegriffe wie „Priestertum“, „Altäre“ und „Heiligtümer“ bleiben erhalten. Die direkte Zukunftsanklage wird mit wiederholtem „werdet ihr“ nachgebildet; schwierige und theologisch offene Stellen werden nicht harmonisiert, sondern im Haupttext offen formuliert und in Fußnoten erläutert.
