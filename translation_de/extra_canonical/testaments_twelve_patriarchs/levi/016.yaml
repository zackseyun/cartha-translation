  rationale: 'Die Revision beschränkt sich auf zwei sichere sprachlich-sachliche Verbesserungen: Das Vorgehen zur Tötung des Mannes wird gemäß dem griechischen Infinitiv als darauf gerichtetes Drängen ausgedrückt, und die Ankündigung von Fluch und Zerstreuung wird als künftiger Zustand bzw. Bestimmung formuliert. Die textkritische Unsicherheit von Vers 3, die Bedeutungsspanne von ἀνάστημα und die offene Referenz des Schlusspronomens bleiben unverändert sichtbar.'
