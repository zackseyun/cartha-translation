- from: 'XVI. Und nun weiß ich: Siebzig Wochen lang werdet ihr in die Irre gehen, das Priestertum entweihen und die Altäre verunreinigen. 2 Ihr werdet das Gesetz verwerfen und in böser Verkehrtheit die Worte der Propheten verachten. Gerechte Männer werdet ihr verfolgen und die Gottesfürchtigen hassen; die Worte der Wahrhaftigen werdet ihr verabscheuen.


    3 Einen Mann, der das Gesetz in der Kraft des Höchsten erneuert,[a] werdet ihr einen Verführer nennen. Schließlich werdet ihr darauf losstürmen, ihn zu töten. Dabei erkennt ihr seine Größe nicht[b] und ladet in eurer Bosheit unschuldiges Blut auf eure Häupter.[c]


    4 Doch ich sage euch: Seinetwegen werden eure Heiligtümer bis auf den Grund verwüstet werden. 5 Kein reiner Ort wird euch bleiben. Vielmehr werdet ihr unter den Völkern zum Fluch und in die Zerstreuung geraten, bis er selbst wieder nach euch sieht, sich erbarmt und euch annimmt.[d]'
  to: 'XVI. Und nun weiß ich: Siebzig Wochen lang werdet ihr in die Irre gehen, das Priestertum entweihen und die Altäre verunreinigen. 2 Ihr werdet das Gesetz verwerfen und in böser Verkehrtheit die Worte der Propheten verachten. Gerechte Männer werdet ihr verfolgen und die Gottesfürchtigen hassen; die Worte der Wahrhaftigen werdet ihr verabscheuen.


