  to: 'Das Vermächtnis Levis, des dritten Sohnes Jakobs und Leas


    1 Abschrift der Worte Levis, die er für seine Söhne festlegte: über alles, was sie tun würden, und über das, was ihnen bis zum Tag des Gerichts begegnen würde[a].


    2 Denn er war bei guter Gesundheit, als er sie zu sich rief; doch ihm wurde offenbart, dass er bald sterben werde. Als sie zusammengekommen waren, sagte er zu ihnen:'
  rationale: Die Revision reduziert bei διέθετο eine über das Griechische hinausgehende Ausdeutung, gibt die bevorstehende Todesnähe von μέλλει ἀποθνήσκειν wieder und glättet die Tempusfolge. Die Ambiguität von συναντήσει αὐτοῖς bleibt durch die Fußnote dokumentiert.
