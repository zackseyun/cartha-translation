base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/001.yaml
  text: 'A copy of the words of Levi, which he ordained for his sons concerning all that they would do, and what would happen to them[a] until the day of judgment.


    For he was in sound health when he called them to himself; but it was revealed to him that he was about to die. And when they had gathered together, he said to them:'
translation:
  language: de
  text: 'Das Vermächtnis Levis, des dritten Sohnes Jakobs und Leas


    1 Abschrift der Worte Levis, die er für seine Söhne festlegte: über alles, was sie tun würden, und über das, was ihnen bis zum Tag des Gerichts begegnen würde[a].


    2 Denn er war bei guter Gesundheit, als er sie zu sich rief; doch ihm wurde offenbart, dass er bald sterben werde. Als sie zusammengekommen waren, sagte er zu ihnen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „was ihnen begegnen würde“; auch möglich: „was ihnen widerfahren würde“.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Διαθήκη
  choice: Vermächtnis
  rationale: Die Überschrift bezeichnet Levis testamentarische Abschiedsrede. „Vermächtnis“ bewahrt den Gattungscharakter, ohne den Ausdruck ausschließlich auf ein juristisches Testament festzulegen.
- source_word: Ἀντίγραφον
  choice: Abschrift
  rationale: Das Wort bezeichnet eine schriftliche Kopie beziehungsweise Wiedergabe. „Abschrift“ gibt den dokumentarischen Charakter der Einleitung präzise und natürlich wieder.
- source_word: λόγων
  choice: der Worte
  rationale: „Worte“ ist in dieser Überschriftenformel umfassend, würdig und weniger eng als „Aussprüche“ oder „Reden“.
- source_word: διέθετο
  choice: als Vermächtnis hinterließ
  rationale: Das Verb kann anordnen, verfügen oder testamentarisch festlegen bedeuten. Die Formulierung macht den testamentarischen Zusammenhang verständlich, ohne die Aussage auf einen bloßen Befehl zu verengen.
- source_word: κατὰ πάντα ἃ ποιήσουσιν
  choice: über alles, was sie tun würden
  rationale: Die Wiedergabe erhält den zukunftsbezogenen Charakter und bleibt nahe an der griechischen Satzstruktur.
- source_word: συναντήσει αὐτοῖς
  choice: was ihnen begegnen würde
  rationale: Die Formulierung wahrt das Bild dessen, was ihnen künftig „entgegenkommt“, und ist zugleich im modernen Deutschen idiomatisch.
- source_word: ἕως ἡμέρας κρίσεως
  choice: bis zum Tag des Gerichts
  rationale: Die formelle eschatologische Wendung wird unmittelbar wiedergegeben, ohne spätere dogmatische Einzelheiten einzutragen.
- source_word: Ὑγιαίνων
  choice: bei guter Gesundheit
  rationale: Dies verdeutlicht, dass Levi bei der Einberufung seiner Söhne nicht erkennbar todkrank war.
- source_word: ἀπεκαλύφθη
  choice: ihm war offenbart worden
  rationale: Das Passiv bewahrt den Offenbarungscharakter und lässt den im Text nicht ausdrücklich genannten Offenbarenden unbestimmt.
- source_word: μέλλει ἀποθνήσκειν
  choice: dass er sterben sollte
  rationale: Die Wendung bezeichnet seinen bevorstehenden Tod. „Sterben sollte“ erhält den feierlichen Erzählton, ohne die genaue Zeitspanne näher festzulegen.
- source_word: συνήχθησαν
  choice: sie zusammengekommen waren
  rationale: Die Formulierung gibt das Zusammenkommen der Söhne als der anschließenden Rede vorausgehendes Ereignis natürlich wieder.
theological_decisions:
- issue: Eschatologische Wendung ἕως ἡμέρας κρίσεως
  choice: bis zum Tag des Gerichts
  alternative: bis zum Gerichtstag
  rationale: Die gewählte Form bewahrt die formelle Genitivkonstruktion und den apokalyptischen Horizont, ohne Art, Ablauf oder Träger des Gerichts näher zu bestimmen.
- issue: Nicht genannter Urheber der Offenbarung in ἀπεκαλύφθη
  choice: 'Passivform ohne ergänztes Subjekt: „ihm war offenbart worden“'
  alternative: Gott hatte ihm offenbart
  rationale: Der griechische Text legt eine Offenbarung nahe, nennt deren Urheber jedoch nicht ausdrücklich. Die Übersetzung ergänzt deshalb keine ausdrückliche Gottesbezeichnung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem testamentarischem Ton. Die Titelzeile des griechischen Ausgangstextes ist aufgenommen. Die Verszählung folgt der Quelle; Satzbau und Tempusfolge wurden für natürliches Deutsch behutsam geglättet.
