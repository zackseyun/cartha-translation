revisions:
- from: 'Das Vermächtnis Levis, des dritten Sohnes Jakobs und Leas


    1 Abschrift der Worte Levis, die er seinen Söhnen als Vermächtnis hinterließ über alles, was sie tun würden, und über das, was ihnen begegnen würde[a] bis zum Tag des Gerichts.


