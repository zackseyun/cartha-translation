review_pass:
  verdict: revise
  source_fidelity: Die Überschrift und der Grundsinn sind zutreffend wiedergegeben. In V. 1 legt „als Vermächtnis hinterließ“ für διέθετο jedoch den testamentarischen Sinn stärker fest und verdoppelt zugleich den Titel. In V. 2 schwächt „dass er sterben sollte“ die durch μέλλει ἀποθνήσκειν ausgedrückte Nähe des bevorstehenden Todes ab; das Plusquamperfekt „war offenbart worden“ ist ebenfalls nicht erforderlich.
  naturalness: Der Text ist insgesamt klares, würdiges modernes Standarddeutsch. „für seine Söhne festlegte“ ist in der Überschriftenformel natürlicher und weniger interpretierend als „seinen Söhnen als Vermächtnis hinterließ“.
  terminology: „Vermächtnis“, „Abschrift“, „Tag des Gerichts“ und die unpersönliche Offenbarungsform sind angemessen. Die Formulierung zum bevorstehenden Tod sollte dessen zeitliche Unmittelbarkeit deutlicher wiedergeben, ohne den Offenbarer zu benennen.
  issues:
  - severity: medium
    issue: διέθετο wird mit „als Vermächtnis hinterließ“ wiedergegeben.
    rationale: Die griechische Formulierung kann zwar testamentarisches Verfügen meinen, sagt hier aber nicht ausdrücklich „hinterließ“ und enthält kein zusätzliches „als Vermächtnis“. „Für seine Söhne festlegte“ wahrt die Bedeutung und vermeidet die doppelte, stärker ausdeutende Benennung.
  - severity: medium
    issue: μέλλει ἀποθνήσκειν wird mit „dass er sterben sollte“ wiedergegeben.
    rationale: Die μέλλει-Konstruktion bezeichnet einen bevorstehenden Tod. „Sterben sollte“ kann im Deutschen eher Bestimmung oder Verpflichtung andeuten und gibt die zeitliche Nähe nicht klar wieder.
  - severity: low
    issue: „ihm war offenbart worden“ verwendet ein nicht nötiges Plusquamperfekt.
    rationale: Das griechische Aoristpassiv berichtet die Offenbarung als Ereignis in der Erzählung. „Ihm wurde offenbart“ ist näher am Tempuswert und im Deutschen flüssiger.
