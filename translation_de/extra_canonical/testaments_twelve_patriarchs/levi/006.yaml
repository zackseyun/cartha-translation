  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/006.yaml
  text: 1 And as I was going to my father[a], I found a bronze shield; therefore the name of the mountain is Aspis, which is near Gebal, on the right of Abim. 2 And I kept these words in my heart. 3 After this I took counsel with my father and with Reuben, that he should tell the sons of Emmor not to circumcise themselves, because I was zealous on account of the abomination which they had committed against my sister. 4 And I killed Shechem first, and Simeon killed Emmor. 5 And after this my brothers came and struck that city with the edge of the sword. 6 And my father heard these things, and being angry he was grieved because they had accepted circumcision and died, and in his blessings he passed over us. 7 For we sinned, because we had done this contrary to his judgment, though he became weak on that day. 8 But I saw that it was a decree of God for evil against them, because they intended to do to Sarah and Rebekah as they had done to Dinah our sister; and the Lord restrained them. 9 And
    they pursued Abraham our father when he was a stranger, and they oppressed his flocks when they were swollen with increase, and they cruelly mistreated Eblan his home-born servant. 10 And indeed in this way they used to act toward all strangers, seizing foreign women by force and driving them away[b][c][d][e]. 11 But the wrath of God came upon them completely.
translation:
  language: de
  text: '**Testament Levis 6**


    **1** Als ich zu meinem Vater unterwegs war, fand ich einen bronzenen Schild. Daher heißt der Berg Aspis; er liegt nahe bei Gebal, rechts von Abim. **2** Diese Worte bewahrte ich in meinem Herzen.


    **3** Danach beriet ich mich mit meinem Vater und mit Ruben, damit er den Söhnen Emmors sage, sie sollten sich nicht beschneiden lassen; denn aus Eifer über die abscheuliche Tat, die sie an meiner Schwester begangen hatten, tat ich dies. **4** Ich tötete als Ersten Sichem, und Simeon tötete Emmor. **5** Danach kamen meine Brüder und schlugen jene Stadt mit der Schneide des Schwertes.


    **6** Als mein Vater davon hörte, wurde er zornig und war tief betrübt, weil sie die Beschneidung angenommen hatten und dann gestorben waren. Und bei seinen Segenssprüchen ging er an uns vorüber.[a] **7** Denn wir hatten gesündigt, weil wir dies gegen sein Urteil getan hatten, obwohl er an jenem Tag schwach wurde.[b]


    **8** Ich aber erkannte, dass dies ein Beschluss Gottes zu ihrem Unheil war; denn sie hatten vor, mit Sara und Rebekka ebenso zu verfahren, wie sie mit unserer Schwester Dina verfahren waren.[c] Doch der Herr hinderte sie daran. **9** Auch hatten sie Abraham, unseren Vater, verfolgt, als er ein Fremder war. Sie hatten seine Herden bedrängt, als diese sich vermehrten, und Eblan, seinen im Haus geborenen Diener, grausam misshandelt.[d] **10** So pflegten sie mit allen Fremden umzugehen: Mit Gewalt raubten sie fremde Frauen und vertrieben sie. **11** Doch Gottes Zorn kam endgültig über sie.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Bei seinen Segenssprüchen übersah er uns.“ Gemeint ist offenbar, dass Jakob Levi und Simeon bei seinen Segensworten nicht begünstigte.'
    reason: lexical_alternative
  - marker: b
    text: Das griechische Verb ist schwierig. Es kann bedeuten, dass Jakob an jenem Tag schwach wurde, nachgab oder innerlich erweicht wurde.
    reason: textual_variant
  - marker: c
    text: Der Wortlaut dieses Verses ist textlich und syntaktisch schwierig. Der griechische Text scheint zu sagen, die Männer von Sichem hätten mit Sara und Rebekka ebenso verfahren wollen wie mit Dina.
    reason: textual_variant
  - marker: d
    text: Der Name „Eblan“ ist in der Überlieferung unsicher. Gemeint ist jedenfalls ein im Haushalt Abrahams geborener Diener, der schwer misshandelt wurde.
    reason: textual_variant
  - marker: e
    text: Wörtlich steht hier die Wendung „der Zorn Gottes erreichte sie bis zum Ende“, die ein vollständiges oder endgültiges Gericht bezeichnet.
    reason: cross_reference
lexical_decisions:
- source_word: ἀσπίδα χαλκῆν
  choice: einen bronzenen Schild
  rationale: Gibt Gegenstand und Material klar wieder und erhält den Zusammenhang mit dem Ortsnamen Aspis.
- source_word: συνετήρουν ... ἐν τῇ καρδίᾳ μου
  choice: bewahrte ... in meinem Herzen
  rationale: Natürliches, würdevolles Deutsch für das innere Festhalten und Bedenken von Worten.
- source_word: συνεβούλευσα
  choice: beriet ich mich
  rationale: Drückt die beratende Verständigung mit dem Vater und Ruben aus, ohne eine bloß private Überlegung daraus zu machen.
- source_word: μὴ περιτμηθῆναι αὐτούς
  choice: sie sollten sich nicht beschneiden lassen
  rationale: Gibt den passivischen Sinn im Deutschen idiomatisch wieder.
- source_word: ἐζήλωσα
  choice: mich erfüllte Eifer
  rationale: Bezeichnet hier leidenschaftliche sittliche Entrüstung, nicht Neid oder eifersüchtigen Besitzanspruch.
- source_word: βδέλυγμα
  choice: abscheuliche Tat
  rationale: Bewahrt die starke moralische Wertung und ist im modernen Deutsch verständlicher als das substantivische „Gräuel“.
- source_word: ἐν στόματι μαχαίρας
  choice: mit der Schärfe des Schwertes
  rationale: Entspricht dem semitisch geprägten Idiom, ohne das im Deutschen unnatürliche Bild vom „Mund des Schwertes“ zu übernehmen.
- source_word: παρεῖδεν ἡμῖν
  choice: ging er an uns vorüber
  rationale: Bewahrt die mögliche Bedeutung, dass Jakob Levi und Simeon bei den Segenssprüchen nicht begünstigte; die unsichere Formulierung wird in einer Fußnote erläutert.
- source_word: παρὰ γνώμην αὐτοῦ
  choice: gegen sein Urteil
  rationale: γνώμη meint hier die überlegte Auffassung beziehungsweise Entscheidung des Vaters, nicht nur eine beiläufige Meinung.
- source_word: ἐμαλακίσθη
  choice: wurde ... schwach
  rationale: Eine zurückhaltende Wiedergabe des schwierigen Verbs, die weder körperliche Schwäche noch ein Nachgeben endgültig festlegt.
- source_word: ἀπόφασις θεοῦ ... εἰς κακά
  choice: Gottes Beschluss zu ihrem Unheil
  rationale: Erhält den Gedanken eines göttlichen Entscheids und macht zugleich deutlich, dass das Unheil die Männer von Sichem trifft.
- source_word: τὰ ποίμνια ὀγκούμενα
  choice: seine Herden ... als diese sich vermehrten
  rationale: Gibt den Zusammenhang von Anschwellen und Zuwachs verständlich wieder, ohne eine genaue biologische Einzelbedeutung zu erzwingen.
- source_word: τὰς ξένας
  choice: fremde Frauen
  rationale: Bewahrt den ausdrücklichen Bezug auf weibliche Fremde beziehungsweise auswärtige Frauen.
- source_word: εἰς τέλος
  choice: endgültig
  rationale: Vermittelt beim göttlichen Zorn den Sinn vollständigen beziehungsweise abschließenden Gerichts.
theological_decisions:
- issue: Das Verhältnis zwischen menschlicher Schuld und göttlichem Beschluss beim Massaker von Sichem
  choice: Levi bekennt ausdrücklich die eigene Sünde und deutet das Unheil über Sichem zugleich als Gottes Beschluss.
  alternative: Die Tat entweder vollständig zu rechtfertigen oder jede providenzielle Deutung aus dem Text zu entfernen.
  rationale: Die Verse 7–11 stellen beide Aussagen nebeneinander. Die Übersetzung bewahrt diese Spannung, statt eine Seite zugunsten der anderen aufzulösen.
- issue: Sara und Rebekka in Vers 8
  choice: Die überlieferten Namen werden im Haupttext wiedergegeben und die textliche Schwierigkeit wird angemerkt.
  alternative: Die Namen wegen der historischen und syntaktischen Schwierigkeit auszulassen oder allgemein von den Ahnfrauen zu sprechen.
  rationale: Der griechische Zeuge nennt Sara und Rebekka ausdrücklich; Transparenz verlangt Übersetzung und Anmerkung statt stiller Glättung.
translation_notes:
  register: Modernes Standarddeutsch in würdevollem testamentarischem Erzählton. Kurze, klare Sätze tragen die Handlung; traditionelle biblische Wendungen wie „im Herzen“, „Schärfe des Schwertes“ und „Gottes Zorn“ bleiben erhalten, wo sie verständlich sind. Unsichere oder beschädigte Stellen werden nicht dogmatisch geglättet, sondern knapp im Fußnotenapparat kenntlich gemacht.
