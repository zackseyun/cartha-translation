    rationale: „dass dies ein Beschluss Gottes zu ihrem Unheil war“ macht klar, dass sich der Beschluss auf das vorausgehende bzw. folgende Geschehen gegen die genannten Täter bezieht, ohne die schwierige Logik des griechischen Satzes aufzulösen.
