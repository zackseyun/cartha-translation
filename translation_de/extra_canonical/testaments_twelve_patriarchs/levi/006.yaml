  source_fidelity: Der Entwurf folgt dem griechischen Text insgesamt eng und bewahrt insbesondere die Spannung zwischen dem Schuldbekenntnis in V. 7 und dem göttlichen Beschluss in V. 8. Namen, die schwierige Aussage über Sara und Rebekka sowie die unsichere Überlieferung zu Eblan sind sachgerecht behandelt. In V. 5 ist „mit der Schärfe des Schwertes“ jedoch keine natürliche deutsche Entsprechung für ἐν στόματι μαχαίρας; „mit der Schneide des Schwertes“ ist näher am Bild und idiomatischer. V. 8 lässt sich zudem ohne Bedeutungsänderung syntaktisch klarer formulieren.
  naturalness: Der testamentarische Registerton ist gelungen. Die gezielten Änderungen glätten zwei leicht sperrige Formulierungen, ohne den gehobenen Stil oder die Quellennähe zu vermindern.
