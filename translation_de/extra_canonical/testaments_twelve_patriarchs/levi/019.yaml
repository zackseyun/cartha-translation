base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/019.yaml
  text: '1[a]. And now, my children, you have heard everything. Choose for yourselves either the light or the darkness, either the law of the Lord or the works of Beliar[b].

    2. And his sons answered him, saying, “Before the Lord we will walk, and according to his law.”

    3. And their father said to them, “The Lord is witness, and his angels are witnesses, and you are witnesses, and I am a witness concerning the word of your mouth.” And his sons said to him[c], “Witnesses.”'
translation:
  language: de
  text: '1 Und nun, meine Kinder, habt ihr alles gehört. Wählt für euch entweder das Licht oder die Finsternis, entweder das Gesetz des Herrn oder die Werke Beliars[a].


    2 Seine Söhne antworteten ihm: »Vor dem Herrn werden wir wandeln und nach seinem Gesetz.«[b]


    3 Da sagte ihr Vater zu ihnen: »Der Herr ist Zeuge, und seine Engel sind Zeugen; auch ihr seid Zeugen, und ich bin Zeuge hinsichtlich dessen, was ihr gesagt habt.« Seine Söhne sagten zu ihm: »Wir sind Zeugen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Beliar ist die hier im Griechischen belegte Namensform; andernorts begegnet auch die Form Belial.
    reason: alternative_reading
  - marker: b
    text: »Vor dem Herrn wandeln« ist eine biblische Ausdrucksweise dafür, das eigene Leben in verantwortlichem Gehorsam vor Gott zu führen.
    reason: cultural_note
lexical_decisions:
- source_word: Ἐκλέξασθε ἑαυτοῖς
  choice: Wählt für euch
  rationale: Der mediale Imperativ und das ausdrückliche ἑαυτοῖς werden bewahrt; die Formulierung unterstreicht die persönliche Entscheidung.
- source_word: φῶς / σκότος
  choice: Licht / Finsternis
  rationale: Die unmittelbare moralisch-symbolische Gegenüberstellung bleibt ohne deutende Erweiterung erhalten.
- source_word: νόμον κυρίου
  choice: das Gesetz des Herrn
  rationale: Bewahrt die feierliche, bundestheologische Ausdrucksweise und gibt κύριος mit »Herr« wieder.
- source_word: ἔργα τοῦ Βελίαρ
  choice: die Werke Beliars
  rationale: ἔργα wird im religiös-ethischen Zusammenhang passend mit »Werke« wiedergegeben; Βελίαρ bleibt als bezeugte Namensform erhalten.
- source_word: Ἐνώπιον κυρίου πορευσόμεθα
  choice: Vor dem Herrn wollen wir wandeln
  rationale: Bewahrt die biblische Redeweise und die Voranstellung von »Vor dem Herrn«; das deutsche »wollen« gibt hier die entschlossene Selbstverpflichtung natürlich wieder.
- source_word: κατὰ τὸν νόμον αὐτοῦ
  choice: nach seinem Gesetz
  rationale: Natürliche deutsche Wiedergabe von κατά mit Akkusativ, die den normgebenden Sinn erhält.
- source_word: Μάρτυς / μάρτυρες
  choice: Zeuge / Zeugen
  rationale: Die konsequente Wiederholung wahrt den rechtlich-bundeshaften Charakter der Szene.
- source_word: περὶ τοῦ λόγου τοῦ στόματος ὑμῶν
  choice: für das Wort aus eurem Mund
  rationale: Die konkrete Bezugnahme auf das ausgesprochene Versprechen bleibt erhalten, ohne die griechische Wendung unnötig zu paraphrasieren.
- source_word: Μάρτυρες
  choice: Wir sind Zeugen
  rationale: Das elliptische griechische Schlusswort wird im Deutschen zu einem verständlichen vollständigen Satz ergänzt, ohne seinen Aussagegehalt zu verändern.
theological_decisions:
- issue: 'Ethischer Dualismus: Licht und Finsternis; Gesetz des Herrn und Werke Beliars'
  choice: Die beiden Gegensatzpaare werden unmittelbar und bildhaft übersetzt.
  alternative: Gut und Böse; Gerechtigkeit und Bosheit
  rationale: Der griechische Text stellt eine scharfe testamentarische Wahl in parallelen Gliedern vor Augen. Die Bilder sollen nicht in abstrakte moralische Begriffe aufgelöst werden.
- issue: Wiedergabe von Βελίαρ
  choice: Beliar
  alternative: Belial
  rationale: Die griechische Vorlage bietet Βελίαρ. Die Transliteration »Beliar« wahrt diese Textgestalt, statt sie an die bekanntere Form »Belial« anzugleichen.
- issue: Zeugenschaft der Söhne in Vers 3
  choice: »Wir sind Zeugen.«
  alternative: »Zeugen.«
  rationale: Das griechische Μάρτυρες ist elliptisch. Die Ergänzung des Kopulaverbs und des Subjekts macht die bestätigende Selbstverpflichtung im modernen Deutsch klar, ohne die theologische Spannung der Zeugenszene aufzulösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht feierlichem testamentarischem Ton. Biblische Schlüsselbilder und die Rechts- beziehungsweise Bundesrede von der Zeugenschaft bleiben erkennbar. Die Syntax wurde dort geglättet, wo eine wörtliche Nachbildung im Deutschen schwerfällig wäre.
