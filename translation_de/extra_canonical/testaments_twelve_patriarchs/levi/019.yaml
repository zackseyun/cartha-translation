  terminology: »Licht«, »Finsternis«, »Gesetz des Herrn«, »Werke Beliars« und »Zeuge/Zeugen« sind konsistent und quellennah. Die griechisch bezeugte Namensform »Beliar« wird zutreffend beibehalten.
