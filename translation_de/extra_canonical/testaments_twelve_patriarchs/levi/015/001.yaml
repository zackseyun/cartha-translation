review_pass:
  verdict: revise
  source_fidelity: Die Kausalübersetzung „wegen eurer Unreinheit“ legt die Bedeutung von ἐν τῇ ἀκαθαρσίᾳ ὑμῶν einseitig fest. Das Griechische verwendet ἐν und lässt zumindest die umständliche Lesart „in/bei eurer Unreinheit“ offen. Diese Ambiguität sollte im Deutschen erhalten bleiben. „Wüst liegen“ gibt ἔρημος ἔσται als Zustand der Verödung treffend wieder.
  naturalness: Der Satzbau ist klar und dem würdevollen modernen Standarddeutsch angemessen. „Wüst liegen“ ist für einen Tempel idiomatisch und präziser als „verwüstet sein“.
  terminology: „Tempel“, „Herr“, „Unreinheit“, „Gefangene“ und „Völker“ sind sachgerecht. „Zu allen Völkern verschleppt“ bewahrt die durch εἰς angezeigte Zielrichtung und ist im Kontext natürlicher als eine bloße Statusbeschreibung.
  issues:
  - severity: medium
    issue: „wegen eurer Unreinheit“ macht die Präpositionalphrase eindeutig kausal.
    rationale: ἐν bedeutet zunächst „in/bei“; auch wenn ein ursächlicher Zusammenhang naheliegt, ist er nicht ausdrücklich als solcher markiert. Die Übersetzung soll die mögliche Mehrdeutigkeit nicht auflösen.
  - severity: low
    issue: „verwüstet sein“ ist weniger genau als eine Zustandsformulierung.
    rationale: ἔρημος ἔσται bezeichnet, dass der Tempel öde bzw. verlassen daliegen wird; „wüst liegen“ trifft dies unmittelbar, ohne den Vorgang einer Verwüstung in den Vordergrund zu rücken.
  revised_text: Darum wird der Tempel, den der Herr erwählen wird, in eurer Unreinheit wüst liegen, und ihr werdet als Gefangene zu allen Völkern verschleppt werden.
