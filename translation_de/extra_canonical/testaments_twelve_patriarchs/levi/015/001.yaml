id: T12P.LEV.15.1
reference: Testament of Levi 15:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Διὰ¹ τοῦτο² *ὁ ναός³, ὃν⁴ ἐκλέξεται⁵ κύριος⁶, *ἔρημος ἔσται⁷ *ἐν τῇ ἀκαθαρσίᾳ ὑμῶν⁸, καὶ ὑμεῖς αἰχμάλωτοι ἔσεσθε εἰς πάντα τὰ ἔθνη.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015/001.yaml
  text: Therefore the temple which the Lord will choose will become desolate in your uncleanness, and you will be taken captive to all the nations.
translation:
  language: de
  text: Darum wird der Tempel, den der Herr erwählen wird, in eurer Unreinheit wüst liegen, und ihr werdet als Gefangene zu allen Völkern verschleppt werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Darum
  rationale: Gibt die folgernde Verknüpfung knapp und natürlich wieder.
- source_word: ὁ ναός
  choice: der Tempel
  rationale: Bezeichnet hier das Heiligtum als Tempel.
- source_word: ἐκλέξεται
  choice: erwählen wird
  rationale: Bewahrt Futur und Wahlmotiv des griechischen Verbs.
- source_word: ἔρημος ἔσται
  choice: verwüstet sein
  rationale: Drückt den Zustand der Verödung bzw. Verwüstung idiomatisch aus.
- source_word: ἐν τῇ ἀκαθαρσίᾳ ὑμῶν
  choice: wegen eurer Unreinheit
  rationale: Das griechische ἐν kann hier den Umstand bzw. ursächlichen Zusammenhang bezeichnen; im Deutschen macht „wegen“ die gemeinte Folgebeziehung verständlich.
- source_word: αἰχμάλωτοι ἔσεσθε
  choice: ihr werdet als Gefangene … verschleppt werden
  rationale: Gibt den prädikativen Ausdruck sinngemäß und in natürlichem Deutsch als Gefangenschaft bzw. Deportation wieder.
- source_word: εἰς πάντα τὰ ἔθνη
  choice: zu allen Völkern
  rationale: Bewahrt die Zielrichtung von εἰς und übersetzt ἔθνη kontextgerecht mit „Völker“.
theological_decisions:
- issue: Beziehung zwischen der Unreinheit der Angesprochenen und der Verwüstung des Tempels
  choice: wegen eurer Unreinheit
  alternative: in eurer Unreinheit
  rationale: Die Formulierung stellt den naheliegenden ursächlichen Zusammenhang heraus, ohne eine weitergehende dogmatische Deutung einzuführen.
- issue: Identität des Tempels
  choice: Keine nähere Bestimmung
  alternative: Deutung als bestimmter historischer oder endzeitlicher Tempel
  rationale: Der Vers selbst benennt nur den Tempel, den der Herr erwählen wird; diese Offenheit bleibt erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Zukunftsaussagen bleiben erhalten; „verschleppt werden“ verdeutlicht den im Gefangenenstatus liegenden Deportationsgedanken.
