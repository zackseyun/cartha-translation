  rationale: Die Revision erhält die offene Bedeutung der griechischen Präposition ἐν bei und ersetzt die weniger präzise Formulierung „verwüstet sein“ durch „wüst liegen“. Die Zukunftsformen, die unbestimmte Identität des Tempels sowie die Deportation zu allen Völkern bleiben erhalten.
