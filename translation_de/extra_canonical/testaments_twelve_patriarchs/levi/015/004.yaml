base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015/004.yaml
  text: And if it were not for Abraham and Isaac and Jacob, our fathers, you would receive no mercy; not one of your seed would be left on the earth.
translation:
  language: de
  text: Und wäre es nicht wegen Abraham, Isaak und Jakob, unserer Väter, würdet ihr kein Erbarmen empfangen; kein Einziger von euren Nachkommen würde auf der Erde übrig bleiben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι᾽ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακὼβ
  choice: um Abrahams, Isaaks und Jakobs willen
  rationale: Die Präposition διά mit Akkusativ bezeichnet hier den Grund beziehungsweise die vermittelnde Ursache; die Wendung gibt dies in natürlichem, würdigem Deutsch wieder.
- source_word: ἔλεος λήψεσθε
  choice: Erbarmen empfangen würdet
  rationale: ἔλεος wird mit „Erbarmen“ wiedergegeben; der deutsche Konjunktiv bildet das irreale Bedingungsgefüge ab.
- source_word: εἷς ἐκ τοῦ σπέρματος ὑμῶν
  choice: kein Einziger von euren Nachkommen
  rationale: σπέρμα meint in diesem Zusammenhang die Nachkommenschaft. „Kein Einziger“ bewahrt die nachdrückliche Einzelbezeichnung εἷς innerhalb der starken Verneinung.
- source_word: οὐ μὴ καταλειφθῇ
  choice: bliebe … übrig
  rationale: Die verstärkte Verneinung οὐ μή wird im Deutschen durch „kein Einziger“ ausgedrückt; καταλείπω bezeichnet das Zurück- beziehungsweise Übrigbleiben.
- source_word: ἐπὶ τῆς γῆς
  choice: auf der Erde
  rationale: Eine direkte und im Kontext natürliche Wiedergabe der Ortsangabe.
theological_decisions:
- issue: Erbarmen um der Erzväter willen
  choice: Die vermittelnde beziehungsweise begründende Formulierung des griechischen Textes bleibt ausdrücklich stehen.
  alternative: Das Erbarmen allgemeiner mit Gottes Bundestreue oder mit dem Gedenken an die Erzväter zu erklären.
  rationale: Der Ausgangstext nennt Abraham, Isaak und Jakob unmittelbar als Grund mit διά plus Akkusativ. Eine genauere dogmatische Erklärung wäre eine nicht im Vers ausgesprochene Auslegung.
- issue: Konditionale Aussage
  choice: 'Das gesamte Satzgefüge wird als irreale Bedingung formuliert: „wenn … nicht … würdet, bliebe …“.'
  alternative: 'Eine faktische Aussage: „Wenn es nicht … gäbe, empfangt ihr kein Erbarmen“.'
  rationale: Die Aussage setzt voraus, dass Erbarmen wegen der Väter gewährt wird, und beschreibt kontrafaktisch die Folge, falls dies nicht so wäre.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Gedankenstriche markieren die Apposition „unserer Väter“ klar, ohne den Satzfluss unnötig zu erschweren.
