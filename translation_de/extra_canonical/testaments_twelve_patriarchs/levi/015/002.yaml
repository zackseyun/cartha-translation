source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *ἔσεσθε βδέλυγμα⁹ αὐτοῖς¹⁰, καὶ λήψεσθε¹¹ ὄνειδος¹² καὶ αἰσχύνην αἰώνιον παρὰ *τῆς δικαιοκρισίας¹³ τοῦ Θεοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015/002.yaml
  text: And you will be an abomination to them, and you will receive reproach and everlasting shame from the righteous judgment of God.
translation:
  language: de
  text: Und ihr werdet ihnen ein Gräuel sein, und vom gerechten Gericht Gottes werdet ihr Schmach und ewige Schande empfangen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βδέλυγμα
  choice: Gräuel
  rationale: Bewahrt die starke moralisch-religiöse Abscheu des griechischen Ausdrucks und entspricht dem würdevollen biblischen Register.
- source_word: ὄνειδος
  choice: Schmach
  rationale: Gibt öffentliche Entehrung und Beschimpfung prägnant wieder.
- source_word: αἰσχύνην αἰώνιον
  choice: ewige Schande
  rationale: Übersetzt die dauerhafte Entehrung direkt und erhält die Stellung des Adjektivs beim Substantiv.
- source_word: παρὰ τῆς δικαιοκρισίας τοῦ Θεοῦ
  choice: durch das gerechte Gericht Gottes
  rationale: Das seltene δικαιοκρισία bezeichnet ein rechtmäßiges beziehungsweise gerechtes Richten; „durch“ gibt hier die ausgehende Ursache im natürlichen Deutschen wieder.
theological_decisions:
- issue: Bezug von αὐτοῖς („ihnen“)
  choice: Das Pronomen bleibt ohne erklärende Ergänzung stehen.
  alternative: Den Bezug aus dem weiteren Kontext ausdrücklich benennen.
  rationale: Der Vers selbst identifiziert die Bezugsgruppe nicht; die Übersetzung bewahrt diese kontextabhängige Offenheit.
- issue: Bedeutung von αἰώνιον
  choice: „ewige“
  alternative: „immerwährende“ oder „zeitalterlange“
  rationale: Im vorliegenden Gerichtskontext ist „ewig“ die natürliche und semantisch tragfähige Wiedergabe, ohne die Aussage weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst kräftiger biblischer Begrifflichkeit. Die Satzstruktur wurde leicht geglättet, ohne die beiden Zukunftsaussagen oder die theologische Spannung des Gerichtsmotivs abzuschwächen.
