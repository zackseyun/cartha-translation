id: T12P.LEV.14.1
reference: Testament of Levi 14:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ἐγὼ¹ οὖν, τέκνα μου², ἔγνων³ ὅτι ἐπὶ τὰ τέλη τῶν αἰώνων ἀσεβήσετε⁴ *ἐπὶ Κυρίου, χεῖρας ἐπιβάλλοντες⁵ ἐν⁶ κακίᾳ [ἐπ᾿ αὐτὸν]⁷ καὶ ἐν⁸ πᾶσι τοῖς ἔθνεσιν γενήσεσθε⁹ χλευασμός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/014/001.yaml
  text: Therefore I, my children, have known that at the end of the ages you will act ungodly against the Lord, laying hands in wickedness [upon him], and among all the nations you will become a mockery.
translation:
  language: de
  text: Ich habe also, meine Kinder, erkannt, dass ihr euch am Ende der Zeitalter gegen den Herrn gottlos verhalten und in Bosheit Hand an ihn legen[a] werdet; bei allen Völkern werdet ihr zum Gespött werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wörter „an ihn“ sind im griechischen Text textkritisch unsicher.
    reason: Die Edition setzt ἐπ᾿ αὐτόν in eckige Klammern; diese Unsicherheit darf nicht stillschweigend beseitigt werden.
lexical_decisions:
- source_word: ἔγνων
  choice: habe erkannt
  rationale: Die Vergangenheitsform des griechischen Verbs bezeichnet eine bereits gewonnene Einsicht; das deutsche Perfekt gibt dies natürlich wieder, ohne sie bloß als gegenwärtiges Wissen darzustellen.
- source_word: ἐπὶ τὰ τέλη τῶν αἰώνων
  choice: am Ende der Zeitalter
  rationale: Bewahrt den Plural αἰώνων und die eschatologische Ausdrucksweise des Ausgangstextes.
- source_word: ἀσεβήσετε ἐπὶ Κυρίου
  choice: euch gegen den Herrn gottlos verhalten
  rationale: Gibt sowohl die Gottlosigkeit von ἀσεβέω als auch die gegen den Herrn gerichtete Bedeutung von ἐπί mit dem Genitiv wieder.
- source_word: χεῖρας ἐπιβάλλοντες
  choice: Hand an ihn legen
  rationale: Die geläufige deutsche Wendung entspricht dem gewaltsamen Sinn von ‚die Hände auf jemanden legen‘; der griechische Plural wird im Deutschen idiomatisch mit dem Singular wiedergegeben.
- source_word: χλευασμός
  choice: Gespött
  rationale: Bezeichnet direkt das Ziel von Spott und passt natürlich zur Konstruktion ‚zum Gespött werden‘.
theological_decisions:
- issue: Bezug von αὐτόν in der textkritisch unsicheren Wendung ἐπ᾿ αὐτόν
  choice: „ihn“ wird im Haupttext beibehalten und bezieht sich grammatisch auf den Herrn.
  alternative: 'Die eingeklammerte Wendung auslassen: „in Bosheit Hand anlegen“.'
  rationale: Der überlieferte Wortlaut macht den Herrn zum Ziel des gewaltsamen Handelns, doch die eckige Klammer der Edition signalisiert Unsicherheit; deshalb wird die Lesart übersetzt und zugleich in einer Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung am Semikolon vermeidet eine schwerfällige Häufung von Zukunftsformen. „Zeitalter“ bewahrt die apokalyptische Mehrzahl, und „zum Gespött werden“ ist zugleich verständlich und quellennah.
