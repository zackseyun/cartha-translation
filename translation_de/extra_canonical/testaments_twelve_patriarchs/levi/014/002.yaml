source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ γὰρ ὁ πατὴρ ἡμῶν Ἰσραὴλ καθαρός ἐστιν¹⁸ ἀπὸ τῆς¹⁹ ἀσεβείας²⁰ τῶν ἀρχιερέων [οἵτινες ἐπιβαλοῦσι²¹ τὰς χεῖρας αὐτῶν ἐπὶ τὸν σωτῆρα τοῦ κόσμου]²².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/014/002.yaml
  text: For our father Israel is pure from the ungodliness of the chief priests [who will lay their hands on the Savior of the world].
translation:
  language: de
  text: Denn auch unser Vater Israel ist rein[a] von der Gottlosigkeit der Hohepriester [die ihre Hände auf den Retter der Welt legen werden].[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »rein von der Gottlosigkeit«; gemeint sein kann auch, dass Israel daran keinen Anteil hat beziehungsweise dafür nicht verantwortlich ist.'
    reason: Die griechische Reinheitsformulierung kann im Deutschen ungewohnt wirken und lässt eine moralische beziehungsweise verantwortungsbezogene Nuance offen.
  - marker: b
    text: Der eingeklammerte Satzteil ist bereits in der zugrunde gelegten griechischen Edition durch eckige Klammern textlich markiert.
    reason: Macht den textkritisch-editorischen Status der eckigen Klammern transparent.
lexical_decisions:
- source_word: Καὶ γὰρ
  choice: Denn auch
  rationale: Gibt sowohl die begründende Funktion von γάρ als auch das additive καί knapp und natürlich wieder.
- source_word: καθαρός ἐστιν ἀπὸ
  choice: ist rein von
  rationale: Bewahrt das Reinheitsvokabular und die Aussage der Absonderung beziehungsweise Freiheit von etwas, ohne sie stärker als »unschuldig« auszudeuten.
- source_word: ἀσεβείας
  choice: Gottlosigkeit
  rationale: Entspricht dem religiös-moralischen Gehalt von ἀσέβεια in würdigem, allgemein verständlichem Deutsch.
- source_word: ἀρχιερέων
  choice: Hohepriester
  rationale: Direkte und etablierte Wiedergabe des pluralischen ἀρχιερέων.
- source_word: ἐπιβαλοῦσι τὰς χεῖρας αὐτῶν ἐπὶ
  choice: ihre Hände an … legen werden
  rationale: Erhält das körperliche und feindselige Bild der griechischen Wendung sowie deren Zukunftsform.
- source_word: σωτῆρα τοῦ κόσμου
  choice: Retter der Welt
  rationale: Gibt σωτήρ verständlich und ohne zusätzliche konfessionelle Festlegung wieder; κόσμος wird direkt mit »Welt« übersetzt.
theological_decisions:
- issue: Verhältnis Israels zur Gottlosigkeit der Hohepriester
  choice: »Israel ist rein von der Gottlosigkeit der Hohepriester«
  alternative: »Israel ist unschuldig an der Gottlosigkeit der Hohepriester«
  rationale: Die gewählte Form bewahrt die Reinheitssprache des griechischen καθαρός und vermeidet eine ausschließlich juristische Festlegung.
- issue: Textkritischer Status des Relativsatzes
  choice: Der Satzteil bleibt in eckigen Klammern.
  alternative: Unmarkierte Aufnahme in den Haupttext oder Auslassung
  rationale: Die Quellenedition markiert den gesamten Relativsatz mit eckigen Klammern; diese Unsicherheit beziehungsweise editorische Abgrenzung wird sichtbar bewahrt.
- issue: Referenz von »Retter der Welt«
  choice: Keine explizite Identifizierung im Text
  alternative: Ersetzung durch »Messias« oder ausdrückliche Nennung Jesu
  rationale: Der griechische Text sagt nur σωτὴρ τοῦ κόσμου; eine weitergehende Identifizierung würde die Quelle interpretierend erweitern.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht feierliche Wendung »unser Vater Israel« und das biblische Bild »die Hände an jemanden legen« bleiben erhalten. Die eckigen Klammern der Edition werden bewahrt; die Fußnotenmarker stehen außerhalb der jeweiligen Klammergrenze, damit Satzzeichen und Textstatus klar erkennbar bleiben.
