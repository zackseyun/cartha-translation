  rationale: Allein die Präposition in der Handlung der Hohepriester wird von »an« zu »auf« korrigiert, um ἐπὶ mit Akkusativ genauer und in modernem Deutsch natürlicher wiederzugeben. Der Klammerstatus des Relativsatzes und die Offenheit der Referenz von »Retter der Welt« bleiben unverändert erhalten. Der Anker der ersten Anmerkung steht nun unmittelbar bei »rein«, der von ihr erläuterten Reinheitsaussage.
