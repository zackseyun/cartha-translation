  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/014/003.yaml
  text: For just as the sun is pure before the Lord upon the earth, so also you are, the lights of Israel, beyond all the nations.
translation:
  language: de
  text: Denn wie die Sonne vor dem Herrn rein über der Erde ist,[a] so seid auch ihr, die Lichter Israels, über allen Völkern.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich ist der überlieferte griechische Text schwer verständlich: „wie die Sonne vor dem Herrn rein auf/über die Erde ist“; möglicherweise liegt eine Textstörung vor.'
    reason: Die Ausgabe kennzeichnet sowohl „Sonne“ als auch die Wendung „auf/über die Erde“ als textkritisch unsicher. Die Übersetzung bewahrt die prädikative Form des erhaltenen Wortlauts, ohne ein Verb wie „scheinen“ zu ergänzen.
  - marker: b
    text: 'Oder, vergleichend: „mehr als alle Völker“ bzw. „allen Völkern voraus“.'
    reason: παρά mit Akkusativ wird hier wahrscheinlich vergleichend gebraucht. Die knappe Formulierung lässt die genaue Nuance – Überordnung, Vorrang oder Vergleich – offen.
lexical_decisions:
- source_word: καθαρός
  choice: rein
  rationale: Gibt die grundlegende Bedeutung des griechischen Adjektivs direkt und würdig wieder.
- source_word: φωστῆρες
  choice: Lichter
  rationale: Bewahrt das Bild von Himmelslichtern beziehungsweise Lichtträgern, ohne es unnötig auf »Leuchten« oder »Sterne« festzulegen.
- source_word: παρὰ πάντα τὰ ἔθνη
  choice: erhabener als alle Völker
  rationale: Gibt den wahrscheinlich komparativen Sinn von παρά wieder; die ungewöhnliche Wendung kann jedoch auch räumlich oder relational verstanden werden und wird deshalb in einer Fußnote offengehalten.
theological_decisions:
- issue: Vergleichende Hervorhebung Israels gegenüber den Völkern
  choice: erhabener als alle Völker
  alternative: unter allen Völkern / vor allen Völkern
  rationale: Der griechische Wortlaut stellt die angesprochenen »Lichter Israels« mit παρά und Akkusativ in eine hervorgehobene Beziehung zu allen Völkern. Die Übersetzung wahrt diese Spannung, ohne daraus eine weitergehende Lehre über Heil oder Wert der Völker abzuleiten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ergänzte Verbform »scheint« macht den beschädigt oder ungewöhnlich überlieferten Vergleich verständlich; die Fußnote legt diese interpretierende Glättung offen. Das Bild »Lichter Israels« bleibt bewusst erhalten.
