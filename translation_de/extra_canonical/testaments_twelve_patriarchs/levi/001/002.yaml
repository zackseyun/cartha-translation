base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/001/002.yaml
  text: 'For he was in sound health when he called them to himself; but it was revealed to him that he was about to die. And when they had gathered together, he said to them:'
translation:
  language: de
  text: 'Denn er war bei guter Gesundheit, als er sie zu sich rief; doch ihm wurde offenbart, dass er bald sterben würde. Und als sie sich versammelt hatten, sagte er zu ihnen:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑγιαίνων
  choice: bei guter Gesundheit
  rationale: Gibt den körperlichen Zustand natürlich und präzise wieder; der Zusammenhang stellt heraus, dass Levi nicht wegen einer bereits sichtbaren Erkrankung mit seinem Tod rechnete.
- source_word: ἀπεκαλύφθη
  choice: wurde offenbart
  rationale: Bewahrt das Offenbarungsvokabular und lässt entsprechend dem griechischen Passiv offen, wer die Offenbarung gab.
- source_word: μέλλει ἀποθνήσκειν
  choice: bald sterben würde
  rationale: Drückt den bevorstehenden Tod idiomatisch aus. Das Imperfekt μέλλει steht innerhalb der indirekten Rede zu einem vergangenen Bezugspunkt.
- source_word: συνήχθησαν
  choice: sie sich versammelt hatten
  rationale: Das Plusquamperfekt bildet im Deutschen klar ab, dass die Versammlung dem anschließenden Reden vorausging.
theological_decisions:
- issue: Urheber der Offenbarung
  choice: Das Passiv „ihm wurde offenbart“ ohne ausdrücklich genanntes Subjekt
  alternative: „Gott offenbarte ihm“
  rationale: Der griechische Text nennt den Offenbarenden nicht ausdrücklich; eine Ergänzung Gottes würde eine plausible Deutung in den Haupttext eintragen.
- issue: Bedeutung von μέλλει vor dem Infinitiv
  choice: 'unmittelbar bevorstehendes Geschehen: „bald sterben würde“'
  alternative: 'schicksalhafte oder göttlich festgelegte Notwendigkeit: „sterben sollte“'
  rationale: μέλλω bezeichnet hier zunächst das Bevorstehen des Todes; „sollte“ könnte zusätzlich eine Bestimmung oder Verpflichtung nahelegen, die nicht ausdrücklich formuliert ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählfolge. Der Doppelpunkt am Ende bleibt erhalten, da der folgende Vers die Rede einleitet.
