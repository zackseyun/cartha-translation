  naturalness: 'Die Formulierung „die er seinen Söhnen über alles auftrug“ ist im modernen Standarddeutsch holprig: „auftragen“ verbindet sich natürlicher mit einer Person und einer Aufgabe als mit „Worten“ und Themenbereichen. „anordnete“ ist klarer und bewahrt den würdevollen, überschriftartigen Registerton.'
  terminology: '„Abschrift“, „Worte Levis“, „Tag des Gerichts“ und „widerfahren“ sind angemessen. Die Fußnote sollte die im deutschen Haupttext verwendete Zukunftsform spiegeln: „würde“ statt „wird“.'
