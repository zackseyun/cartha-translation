  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/001/001.yaml
  text: A copy of the words of Levi, which he ordained for his sons about all that they would do, and all that would happen to them[a] until the day of judgment.
translation:
  language: de
  text: Abschrift der Worte Levis, die er seinen Söhnen über alles anordnete, was sie tun würden, und über alles, was ihnen bis zum Tag des Gerichts widerfahren würde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „begegnen würde“. Die griechische Wendung bezeichnet wörtlich das, was ihnen künftig „begegnen“ würde.'
    reason: lexical_alternative
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: Abschrift
  rationale: Bezeichnet eine schriftliche Kopie bzw. Wiedergabe und passt als überschriftartige Einleitung.
- source_word: λόγων
  choice: der Worte
  rationale: Gibt den Genitiv natürlich und nah am griechischen Wortlaut wieder.
- source_word: διέθετο
  choice: auftrug
  rationale: Das Medium von διατίθημι kann hier ein feierliches Anordnen oder Verfügen bezeichnen; „auftrug“ ist verständlich, ohne einen spezifisch rechtlichen oder bundestheologischen Sinn festzulegen.
- source_word: κατὰ πάντα ἃ ποιήσουσιν
  choice: über alles, was sie tun würden
  rationale: Bewahrt den umfassenden Bezug von πάντα und gibt das futurische Geschehen im Rahmen der berichteten Rede idiomatisch wieder.
- source_word: ὅσα συναντήσει αὐτοῖς
  choice: über alles, was ihnen … widerfahren würde
  rationale: συναντάω bedeutet wörtlich „begegnen“; mit Dativ bezeichnet die Wendung idiomatisch das, was jemandem begegnet bzw. widerfährt.
- source_word: ἕως ἡμέρας κρίσεως
  choice: bis zum Tag des Gerichts
  rationale: Formnahe und im Deutschen geläufige Wiedergabe der eschatologischen Zeitangabe.
theological_decisions:
- issue: Bedeutung von διέθετο
  choice: auftrug
  alternative: anordnete / verfügte
  rationale: Die Übersetzung wahrt den feierlichen Charakter, vermeidet aber, ohne weiteren Kontext eine rechtliche Verfügung oder einen Bund anzunehmen.
- issue: Eschatologischer Ausdruck ἡμέρα κρίσεως
  choice: Tag des Gerichts
  alternative: Gerichtstag
  rationale: „Tag des Gerichts“ ist transparent, würdevoll und lässt Art und Umfang des Gerichts unbestimmt.
translation_notes:
  register: Moderner, würdevoller Standarddeutsch-Stil. Die überschriftartige Nominalform des Anfangs bleibt erhalten; die Satzstruktur wurde nur so weit geglättet, wie es für natürliches Deutsch nötig ist.
