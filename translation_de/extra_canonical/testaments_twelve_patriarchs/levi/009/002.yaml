source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ εὐλόγησέν με *⁵ὁ πατὴρ τοῦ πατρός μου⁵ κατὰ⁶ *τῶν ὁραμάτων ὧν⁷ εἶδον· *καὶ οὐκ ἠθέλησε πορευθῆναι μεθ’ ἡμῶν εἰς Βεθήλ⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/002.yaml
  text: And my grandfather blessed me because of the visions that I had seen, and he was not willing to go with us to Bethel.
translation:
  language: de
  text: Und mein Großvater segnete mich entsprechend den Visionen, die ich gesehen hatte,[a] und er wollte nicht mit uns nach Bethel gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „aufgrund der Visionen, die ich gesehen hatte“.'
    reason: κατά kann hier auch den Anlass des Segens bezeichnen; der Haupttext bewahrt jedoch die weniger festgelegte, am griechischen Ausdruck orientierte Beziehung.
lexical_decisions:
- source_word: ὁ πατὴρ τοῦ πατρός μου
  choice: mein Großvater
  rationale: Die wörtliche Wendung „der Vater meines Vaters“ bezeichnet im Deutschen natürlich und eindeutig den Großvater.
- source_word: κατὰ τῶν ὁραμάτων ὧν εἶδον
  choice: aufgrund der Visionen, die ich gesehen hatte
  rationale: „Aufgrund“ gibt den hier naheliegenden Bezug beziehungsweise Anlass des Segens idiomatisch wieder; die ungewöhnliche griechische Fügung lässt jedoch auch eine stärker entsprechende Bedeutung zu, die in der Fußnote erhalten bleibt.
- source_word: οὐκ ἠθέλησε πορευθῆναι
  choice: er wollte nicht … gehen
  rationale: Gibt sowohl den Willensaspekt von ἠθέλησε als auch die Bewegungsbedeutung von πορευθῆναι schlicht und natürlich wieder.
- source_word: Βεθήλ
  choice: Bethel
  rationale: Die geläufige deutsche Form des Ortsnamens wird beibehalten.
theological_decisions:
- issue: Verhältnis zwischen dem Segen und den Visionen
  choice: aufgrund der Visionen
  alternative: entsprechend den Visionen
  rationale: Der Kontext legt nahe, dass die Visionen Anlass des Segens sind. Da κατά hier formal ungewöhnlich mit dem Genitiv steht und auch einen Maßstab oder eine Entsprechung ausdrücken kann, wird die Alternative nicht ausgeschlossen, sondern in einer Fußnote genannt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Großvater“ ersetzt die im Deutschen schwerfällige wörtliche Verwandtschaftsformel; der Satzbau bleibt nah am griechischen Ausgangstext, ohne unnatürlich zu wirken.
