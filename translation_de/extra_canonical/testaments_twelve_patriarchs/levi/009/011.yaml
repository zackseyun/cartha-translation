id: T12P.LEV.9.11
reference: Testament of Levi 9:11
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ πρὸ⁴⁶ τοῦ εἰσελθεῖν σε⁴⁷ εἰς τὰ ἅγια, λούου· καὶ ἐν τῷ θύειν σε⁴⁸, νίπτου⁴⁹· καὶ ἀπαρτίζων πάλιν⁵⁰ τὴν θυσίαν, νίπτου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/011.yaml
  text: And before you enter into the holy things, wash; and when you sacrifice, wash; and again, when you finish the sacrifice, wash.
translation:
  language: de
  text: Und bevor du das Heiligtum betrittst, wasche dich; und wenn du opferst, wasche dich; und wenn du das Opfer vollendet hast, wasche dich nochmals.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἅγια
  choice: das Heiligtum
  rationale: Der substantivierte Plural bezeichnet hier im Zusammenhang mit dem Betreten am natürlichsten den heiligen Bereich beziehungsweise das Heiligtum, nicht allgemein „heilige Dinge“.
- source_word: λούου / νίπτου
  choice: wasche dich
  rationale: Beide griechischen Verben werden als rituelle Waschungsgebote wiedergegeben. Obwohl λούω eher ein umfassendes Waschen und νίπτω auch das Waschen einzelner Körperteile bezeichnen kann, nennt der Text kein Körperteil; die einheitliche Wiedergabe wahrt daher die dreifache Anweisung, ohne eine unbelegte Präzisierung einzuführen.
- source_word: ἐν τῷ θύειν σε
  choice: wenn du opferst
  rationale: Die temporale Konstruktion bezeichnet den Zeitpunkt beziehungsweise Vorgang des Opferns.
- source_word: ἀπαρτίζων ... τὴν θυσίαν
  choice: wenn du das Opfer vollendet hast
  rationale: ἀπαρτίζω bezeichnet hier das Zu-Ende-Bringen oder Vollenden des Opfers; im Deutschen macht das Perfekt deutlich, dass die abschließende Waschung nach dessen Vollendung erfolgt.
- source_word: πάλιν
  choice: nochmals
  rationale: Das Adverb markiert die erneute Waschung beim Abschluss des Opfers.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Imperativstil mit klarer dreigliedriger Wiederholung. Keine Zusätze wie „vor dem Herrn“, „vor ihm“ oder „die Hände“, da sie im vorgelegten griechischen Text nicht stehen.
