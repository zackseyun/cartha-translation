id: T12P.LEV.9.4
reference: Testament of Levi 9:4
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἀναστὰς¹⁴ *τῷ πρωὶ¹⁵ *ἀπεδεκάτωσε πάντα¹⁶ δι’ ἐμοῦ ῾τῷ Κυρίῳ’¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/004.yaml
  text: And rising early in the morning, he tithed everything through me to the Lord.
translation:
  language: de
  text: Und als er früh am Morgen aufstand, gab er durch mich dem Herrn von allem den Zehnten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναστὰς τῷ πρωί
  choice: als er am Morgen aufgestanden war
  rationale: Gibt das temporale Partizip und die morgendliche Zeitangabe in natürlichem modernem Deutsch wieder, ohne das im Griechischen nicht ausdrücklich enthaltene »früh« hinzuzufügen.
- source_word: ἀπεδεκάτωσε πάντα
  choice: gab … den Zehnten von allem
  rationale: Drückt die Zehntgabe idiomatisch und zugleich präzise aus; »verzehntete alles« wäre im heutigen Deutsch ungebräuchlich.
- source_word: δι’ ἐμοῦ
  choice: durch mich
  rationale: Bewahrt die instrumentale beziehungsweise vermittelnde Formulierung des griechischen Textes und legt ihre genaue Funktion nicht näher fest.
- source_word: τῷ Κυρίῳ
  choice: dem Herrn
  rationale: Die übliche würdevolle Wiedergabe des Titels im religiösen Kontext.
theological_decisions:
- issue: Rolle des Erzählers bei der Zehntgabe
  choice: durch mich
  alternative: mithilfe von mir / übergab mir den Zehnten für den Herrn
  rationale: Das griechische δι’ ἐμοῦ lässt die genaue Art der Vermittlung offen. Die Übersetzung bewahrt diese Mehrdeutigkeit und vermeidet eine zusätzliche kultische oder priesterliche Deutung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung stellt den Empfänger »dem Herrn« klar heraus und bewahrt zugleich den knappen erzählerischen Charakter des griechischen Textes.
