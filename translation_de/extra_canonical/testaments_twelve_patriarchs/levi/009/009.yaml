base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/009.yaml
  text: Take heed to yourself from the spirit of sexual immorality, for this is persistent and is about to defile the holy things through your offspring.
translation:
  language: de
  text: Hüte dich vor dem Geist der Unzucht; denn er ist beharrlich[a] und wird durch deine Nachkommen die heiligen Dinge verunreinigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung dieser Wendung ist unsicher; wahrscheinlich ist gemeint: „andauernd“ oder „beharrlich“.'
    reason: Das †…† der Edition kennzeichnet eine textkritisch problematische Lesart, deren wahrscheinlicher Sinn im Haupttext wiedergegeben wird.
lexical_decisions:
- source_word: Πρόσεχε σεαυτῷ ἀπό
  choice: Hüte dich vor
  rationale: Gibt die griechische Warnformel natürlich und eindringlich im modernen Deutschen wieder.
- source_word: πνεύματος τῆς πορνείας
  choice: Geist der Unzucht
  rationale: Bewahrt die personale beziehungsweise geistliche Ausdrucksweise von πνεῦμα und gibt πορνεία mit dem würdigen, breit verständlichen Begriff „Unzucht“ wieder.
- source_word: ἐνδελεχῆ
  choice: hartnäckig
  rationale: Gibt den wahrscheinlichen Sinn „andauernd, beharrlich“ idiomatisch wieder; die Textüberlieferung der Wendung ist jedoch unsicher.
- source_word: μέλλει μιαίνειν
  choice: wird … verunreinigen
  rationale: Drückt die bevorstehende beziehungsweise zu erwartende Verunreinigung aus, ohne die Konstruktion unnötig schwerfällig wiederzugeben.
- source_word: διὰ τοῦ σπέρματός σου
  choice: durch deine Nachkommen
  rationale: σπέρμα bezeichnet hier im Zusammenhang die Nachkommenschaft; „Nachkommen“ ist im Deutschen klarer als das wörtliche „Samen“.
- source_word: τὰ ἅγια
  choice: das Heilige
  rationale: Bewahrt die substantivische Offenheit des griechischen Plurals, der heilige Dinge oder den heiligen Bereich bezeichnen kann.
theological_decisions:
- issue: Bezug von „Geist der Unzucht“
  choice: Die geistliche Ausdrucksweise wird ohne nähere Identifikation beibehalten.
  alternative: Als bloßen inneren Trieb oder ausdrücklich als Dämon deuten.
  rationale: Der griechische Text legt keine eindeutige ontologische Bestimmung fest; eine Präzisierung würde die vorhandene Spannung auflösen.
- issue: Bedeutung von τὰ ἅγια
  choice: „das Heilige“
  alternative: „die heiligen Dinge“ oder „das Heiligtum“
  rationale: Die allgemeinere Form vermeidet eine unbelegte Festlegung darauf, ob Kultgegenstände, das Heiligtum oder der gesamte heilige Bereich gemeint sind.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Warnung bleibt knapp und eindringlich; „Unzucht“ wahrt den religiös-ethischen Ton, während die textkritische Unsicherheit offen ausgewiesen wird.
