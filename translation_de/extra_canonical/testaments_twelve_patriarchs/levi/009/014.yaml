    rationale: „für den Herrn, Gott“ ist keine reguläre deutsche Apposition in dieser Satzfunktion. Die griechische Folge bezeichnet Gott näher, enthält aber kein „deinen“. „den Herrn, den Gott“ wahrt beides.
