source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *παντὸς πρωτογεννήματός σου⁶⁰ καὶ οἴνου⁶¹ πρόσφερε *ἀπαρχὰς εἰς θυσίαν Κυρίῳ⁶² Γτῷ θεῷ⁶³⁾. *Καὶ πᾶσαν θυσίαν ἅλατι ἁλιεῖς⁶⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/014.yaml
  text: And of all your first produce and of wine offer firstfruits as a sacrifice to the Lord God. And every sacrifice you shall salt with salt.
translation:
  language: de
  text: Und von all deinem Erstertrag und vom Wein bringe dem Herrn, dem Gott, Erstlingsgaben als Opfer dar. Und jedes Opfer sollst du mit Salz salzen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παντὸς πρωτογεννήματός σου
  choice: all deinem Erstertrag
  rationale: Das substantivierte πρωτογέννημα bezeichnet hier im kultischen Zusammenhang den ersten Ertrag. „Erstertrag“ ist verständlich und wahrt den Unterschied zu den anschließend genannten „Erstlingsgaben“.
- source_word: ἀπαρχὰς
  choice: Erstlingsgaben
  rationale: ἀπαρχή bezeichnet die als erster Anteil Gott dargebrachte Gabe; „Erstlingsgaben“ gibt den kultischen Sinn präzise wieder.
- source_word: εἰς θυσίαν
  choice: als Opfer
  rationale: Die Wendung bezeichnet Zweck beziehungsweise Funktion der Darbringung und wird im Deutschen natürlich mit „als Opfer“ ausgedrückt.
- source_word: ἅλατι ἁλιεῖς
  choice: mit Salz salzen
  rationale: Die figura etymologica des Griechischen wird bewusst erhalten; „salzen“ ist genauer als das allgemeinere „würzen“.
theological_decisions:
- issue: Syntax von Κυρίῳ τῷ θεῷ
  choice: für den Herrn, Gott
  alternative: für den Herrn, deinen Gott / für den Herrn Gott
  rationale: Die überlieferte Form τῷ θεῷ steht in der dritten Person und lässt sich appositionell verstehen. „deinen Gott“ würde eine nicht im Text stehende Lesart einführen; das Komma wahrt die enge Titelfolge, ohne ein unidiomatisches deutsches Kompositum zu erzwingen.
- issue: Verbindlichkeit des zweiten Satzes
  choice: sollst du
  alternative: salze jedes Opfer
  rationale: Der griechische Futur ἁλιεῖς kann in gesetzesartiger Rede verpflichtend wirken. „sollst du“ bildet diesen normativen Ton natürlich ab.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kultischer Fachsprache. Die Wiederholung „mit Salz salzen“ ist absichtlich quellennah; die Imperativfolge wird durch „bringe … dar“ und das verpflichtende „sollst du“ klar wiedergegeben.
