  text: And Isaac kept calling me continually to remind me of the law of the Lord, just as the angel had shown me.
translation:
  language: de
  text: Und Isaak rief mich immer wieder, um mich an das Gesetz des Herrn zu erinnern, so wie der Engel es mir gezeigt hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκάλει με συνεχῶς
  choice: rief mich immer wieder zu sich
  rationale: Gibt den wiederholten bzw. fortdauernden Charakter von συνεχῶς in natürlichem Deutsch wieder; »zu sich« verdeutlicht den hier naheliegenden Sinn von καλεῖν, ohne den Inhalt zu erweitern.
- source_word: τοῦ ὑπομνῆσαί με
  choice: um mich … zu erinnern
  rationale: Bewahrt die finale Konstruktion und den kausativen Sinn von ὑπομιμνῄσκω.
- source_word: νόμον Κυρίου
  choice: das Gesetz des Herrn
  rationale: Entspricht der üblichen und würdigen deutschen Wiedergabe der bestimmten theologischen Wendung.
- source_word: καθὼς ἔδειξέ μοι ὁ ἄγγελος
  choice: so wie der Engel es mir gezeigt hatte
  rationale: Das Pronomen »es« nimmt natürlich auf das Gesetz bzw. dessen Inhalt Bezug; das Plusquamperfekt bildet die zeitliche Vorordnung der Engelsoffenbarung gegenüber Isaaks wiederholtem Rufen ab.
theological_decisions:
- issue: Bezug dessen, was der Engel gezeigt hatte
  choice: »es« mit naheliegendem Bezug auf das Gesetz bzw. dessen Inhalt
  alternative: 'Explizit: »so wie mir der Engel das Gesetz gezeigt hatte«'
  rationale: Der griechische Satz lässt das Objekt bei ἔδειξέ aus. Die pronominale Wiedergabe erhält diese knappe Struktur und vermeidet eine unnötige Präzisierung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Die iterative Aussage von συνεχῶς wird idiomatisch mit »immer wieder« ausgedrückt.
