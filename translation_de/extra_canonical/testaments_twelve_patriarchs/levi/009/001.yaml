- source_word: μετὰ τοῦ πατρὸς ἡμῶν Ἰακώβ
  choice: mit … unserem Vater Jakob
  rationale: Gibt die Begleitung und die gemeinsame familiäre Zuordnung direkt wieder.
- source_word: πρὸς Ἰσαὰκ τὸν προπάτορα ἡμῶν
  choice: zu unserem Großvater Isaak
  rationale: πρός bezeichnet hier das Ziel; προπάτωρ meint in diesem unmittelbaren Familienzusammenhang den Großvater.
