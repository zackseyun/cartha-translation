source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἐδίδασκέ *με²⁷ νόμον ἱερωσύνης²⁸, *θυσιῶν, ὁλοκαυτωμάτων²⁹, *ἀπαρχῶν ἑκουσίου, σωτηρίου³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/007.yaml
  text: And he taught me the law of the priesthood, of sacrifices, of whole burnt offerings, of freewill offerings, and of peace offerings.
translation:
  language: de
  text: Und er lehrte mich das Gesetz des Priestertums und der Schlachtopfer, der Ganzbrandopfer, der Erstlingsgaben, der freiwilligen Gaben und der Heilsopfer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Aufzählung ist am Ende grammatisch stark verkürzt. Wörtlich stehen dort Begriffe für „Erstlingsgaben“, „Freiwilliges“ und „Heilsopfer“; ihre genaue syntaktische Verknüpfung bleibt unsicher.
    reason: Die knappe und uneinheitliche Genitivkonstruktion ἀπαρχῶν ἑκουσίου, σωτηρίου lässt mehrere syntaktische Gliederungen zu; die Fußnote bewahrt diese echte Unklarheit.
lexical_decisions:
- source_word: νόμον ἱερωσύνης
  choice: das Gesetz über das Priestertum
  rationale: Die genitivische Verbindung bezeichnet die für das Priestertum geltenden gesetzlichen Bestimmungen; „über“ gibt dies im Deutschen natürlich wieder.
- source_word: θυσιῶν
  choice: Schlachtopfer
  rationale: Der Ausdruck bezeichnet hier Opfer im Unterschied zu den anschließend eigens genannten Ganzbrandopfern; „Schlachtopfer“ wahrt diese kultische Unterscheidung.
- source_word: ὁλοκαυτωμάτων
  choice: Ganzbrandopfer
  rationale: Das Wort bezeichnet Opfer, die vollständig verbrannt werden; der etablierte deutsche Fachausdruck ist präzise und verständlich.
- source_word: ἀπαρχῶν
  choice: Erstlingsgaben
  rationale: Das im griechischen Ausgangstext ausdrücklich vorhandene Wort bezeichnet die ersten Erträge, die als Gabe dargebracht werden. Es wird trotz seiner Auslassung in der englischen Konsultationsfassung übersetzt.
- source_word: ἑκουσίου
  choice: freiwillige Gaben
  rationale: Das substantivierte Adjektiv bezeichnet freiwillig Dargebrachtes. „Gaben“ ergänzt im Deutschen den im Griechischen elliptischen Ausdruck, ohne eine bestimmte Opferart enger festzulegen.
- source_word: σωτηρίου
  choice: Heilsopfer
  rationale: Der kultische Ausdruck kann ein Gemeinschafts- beziehungsweise Friedensopfer bezeichnen. „Heilsopfer“ bewahrt die traditionelle Bedeutungsbreite des griechischen Begriffs.
theological_decisions:
- issue: Wiedergabe von σωτηρίου
  choice: Heilsopfer
  alternative: Friedensopfer / Gemeinschaftsopfer
  rationale: Keine der deutschen Benennungen deckt das antike Opferkonzept vollständig ab. „Heilsopfer“ bleibt nahe an der griechischen Wortbildung und vermeidet eine vorschnelle Verengung auf Frieden oder Gemeinschaft.
- issue: Aufnahme der Erstlingsgaben
  choice: ἀπαρχῶν wird als „Erstlingsgaben“ übersetzt
  alternative: Auslassung entsprechend der revidierten englischen POB-Fassung
  rationale: Die vorgelegte griechische Quelle enthält ἀπαρχῶν ausdrücklich. Da die Übersetzung vorrangig der originalsprachlichen Evidenz folgt, darf der Begriff nicht stillschweigend entfallen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Kultische Fachbegriffe werden beibehalten, wo sie für die Unterscheidung der Opferarten erforderlich sind; die Satzstruktur bleibt zugleich für heutige Leser klar.
