id: T12P.LEV.9.13
reference: Testament of Levi 9:13
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἐκ⁵⁶ παντὸς ζώου καθαροῦ⁵⁷ Γκαὶ πετεινοῦ⁵⁸⁾ πρόσφερε θυσίαν *τῷ Κυρίῳ⁵⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/013.yaml
  text: And from every clean animal and bird offer a sacrifice to the Lord.
translation:
  language: de
  text: Und von jedem reinen Tier und jedem Vogel bring dem Herrn ein Opfer dar.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ παντὸς ζώου καθαροῦ
  choice: von jedem reinen Tier
  rationale: Gibt die griechische Präpositionalfügung und die kultische Kategorie »rein« unmittelbar und natürlich wieder.
- source_word: πετεινοῦ
  choice: jedem reinen Vogel
  rationale: Bezeichnet ein geflügeltes Tier beziehungsweise einen Vogel. Das aus dem koordinierten Ausdruck erschlossene Adjektiv »rein« wird im Deutschen wiederholt, damit der Satz eindeutig und flüssig ist.
- source_word: πρόσφερε θυσίαν
  choice: bring … ein Opfer dar
  rationale: Die feste deutsche Wendung »ein Opfer darbringen« entspricht dem kultischen Sinn von προσφέρειν θυσίαν und bewahrt den Imperativ.
- source_word: τῷ Κυρίῳ
  choice: dem Herrn
  rationale: Konventionelle und sachgerechte Wiedergabe des Dativs als Empfänger des Opfers.
theological_decisions:
- issue: Reichweite des Merkmals »rein«
  choice: »rein« wird bei »Vogel« wiederholt
  alternative: »von jedem reinen Tier und Vogel«
  rationale: Die griechische Koordination kann das vorangehende Adjektiv sinngemäß auf beide Tiergruppen beziehen. Die Wiederholung macht diese natürliche Lesart im Deutschen deutlich, ohne eine zusätzliche theologische Bestimmung einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; kultische Terminologie bleibt erhalten. Keine Fußnote erforderlich.
