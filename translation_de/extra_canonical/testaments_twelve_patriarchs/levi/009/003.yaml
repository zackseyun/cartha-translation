  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/003.yaml
  text: And when we came to Bethel, my father Jacob saw a vision about me, that I would be a priest to them.
translation:
  language: de
  text: Als wir nach Bethel kamen, sah mein Vater Jakob eine Vision über mich, dass ich ihnen ein Priester sein würde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὅραμα
  choice: in einer Vision
  rationale: Die idiomatische Verbindung „in einer Vision sehen“ gibt das griechische „ὅραμα sehen“ in natürlichem, würdigem Deutsch wieder.
- source_word: περὶ ἐμοῦ
  choice: über mich
  rationale: Bewahrt den unmittelbaren Bezug der Vision auf Levi, ohne den Inhalt stärker auszudeuten.
- source_word: εἰς ἱερέα
  choice: als Priester dienen
  rationale: Gibt die Bestimmung zur Priesterfunktion natürlich wieder; „dienen“ macht die relationale Aufgabe verständlich, ohne eine bestimmte spätere Amtsordnung einzutragen.
- source_word: αὐτοῖς
  choice: ihnen
  rationale: Das im Kontext nicht ausdrücklich aufgelöste Pronomen bleibt als „ihnen“ erhalten.
theological_decisions:
- issue: Bezug von αὐτοῖς („ihnen“)
  choice: Das Pronomen wird unaufgelöst mit „ihnen“ wiedergegeben.
  alternative: Eine konkrete Bezugsgruppe wie „meinen Brüdern“ oder „dem Volk“ benennen.
  rationale: Der griechische Vers nennt die Bezugsgruppe nicht ausdrücklich; eine Konkretisierung würde die genuine Unbestimmtheit beseitigen.
- issue: Bedeutung der priesterlichen Bestimmung
  choice: „dass ich ihnen als Priester dienen würde“
  alternative: „dass ich ihr Priester sein würde“
  rationale: Die gewählte Fassung bildet die Ziel- beziehungsweise Funktionskonstruktion εἰς ἱερέα ab und vermeidet zugleich einen Besitzklang.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch in würdigem erzählerischem Ton. Die Satzstellung wurde gegenüber dem Griechischen leicht geglättet; die Unbestimmtheit von „ihnen“ bleibt erhalten.
