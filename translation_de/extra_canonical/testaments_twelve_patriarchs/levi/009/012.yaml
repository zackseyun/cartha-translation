source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '*Δώδεκα οὖν δένδρων ἐχόντων φύλλα⁵¹ ἀνάγαγε⁵² τῷ⁵³ Κυρίῳ⁵⁴ *ὡς κἀμὲ⁵⁵ Ἀβραὰμ ἐδίδαξε.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/012.yaml
  text: From twelve trees having leaves, then offer to the Lord, as Abraham taught me.
translation:
  language: de
  text: Von zwölf Bäumen, die Blätter tragen, bringe dann dem Herrn dar, wie Abraham auch mich gelehrt hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δώδεκα ... δένδρων ἐχόντων φύλλα
  choice: von zwölf Bäumen, die Blätter tragen
  rationale: Gibt die partitive Herkunftsangabe und das Partizip natürlich wieder; der Gegenstand, der von den Bäumen genommen wird, bleibt wie im griechischen Text unausgesprochen.
- source_word: ἀνάγαγε
  choice: bringe ... eine Gabe dar
  rationale: Der Imperativ bezeichnet hier ein Hinaufbringen beziehungsweise Darbringen für den Herrn. „Eine Gabe“ macht den Opferkontext im Deutschen verständlich, ohne die im Ausgangstext nicht näher bezeichnete Sache festzulegen.
- source_word: οὖν
  choice: dann
  rationale: Bewahrt den folgernden beziehungsweise fortführenden Charakter der Partikel, ohne ein im Deutschen schwerfälliges „also“ zu erzwingen.
- source_word: τῷ Κυρίῳ
  choice: dem Herrn
  rationale: Entspricht dem Dativ und der üblichen würdevollen Gottesbezeichnung.
- source_word: ὡς κἀμὲ Ἀβραὰμ ἐδίδαξε
  choice: wie Abraham mich gelehrt hat
  rationale: Gibt die Vergleichs- beziehungsweise Begründungsklausel knapp und idiomatisch wieder; καί in κἀμέ hebt „auch mich“ möglicherweise hervor, wirkt hier aber textlich und syntaktisch unsicher.
theological_decisions:
- issue: Art der Darbringung
  choice: allgemein „eine Gabe darbringen“
  alternative: „opfere“ oder „bringe es hinauf“
  rationale: Der Text nennt weder das genaue Material noch ausdrücklich eine bestimmte Opferart. Die Übersetzung wahrt diese Offenheit und macht dennoch die kultische Richtung zum Herrn verständlich.
translation_notes:
  register: Moderne, würdige Standardsprache. Die ungewöhnliche Bild- und Handlungsfolge des griechischen Textes wird nicht harmonisiert; insbesondere bleibt offen, was genau von den zwölf belaubten Bäumen dargebracht werden soll.
