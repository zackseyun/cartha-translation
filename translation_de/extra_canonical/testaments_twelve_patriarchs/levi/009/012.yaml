  naturalness: Die elliptische Formulierung „bringe dem Herrn dar“ ist im kultisch-weisenden Register verständlich und bewahrt die auffällige, im Ausgangstext vorhandene Auslassung besser als eine konkretisierende Ergänzung.
  terminology: „dem Herrn“ gibt τῷ Κυρίῳ angemessen wieder; „darbringen“ entspricht hier ἀνάγαγε, ohne eine bestimmte Opfergabe oder Opferart festzulegen.
