base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/009/010.yaml
  text: Therefore take for yourself a wife while you are still young, one who has no blemish or defilement, and not from the stock of foreign nations.
translation:
  language: de
  text: 'Darum nimm dir eine Frau, solange du noch jung bist: eine, die keinen Makel hat, nicht verunreinigt ist und nicht aus dem Geschlecht fremder Völker stammt.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λαβὲ οὖν σεαυτῷ γυναῖκα
  choice: Darum nimm dir eine Frau
  rationale: Gibt den Imperativ und das reflexive σεαυτῷ unmittelbar und in natürlichem modernem Deutsch wieder.
- source_word: ἔτι νέος ὤν
  choice: solange du noch jung bist
  rationale: Bewahrt den zeitlichen Sinn der Partizipialkonstruktion in idiomatischer Form.
- source_word: μὴ ἔχουσαν μῶμον
  choice: die keinen Makel hat
  rationale: μῶμος bezeichnet einen Makel oder Tadel; „Makel“ erhält die offene körperliche, sittliche oder gesellschaftliche Reichweite.
- source_word: μήτε βεβηλωμένην
  choice: und nicht entweiht ist
  rationale: Das Perfektpartizip von βεβηλόω bezeichnet einen durch Entweihung entstandenen Zustand; „entweiht“ wahrt den kultisch-sittlichen Klang, ohne ihn näher festzulegen.
- source_word: μήτε ἀπὸ γένους ἀλλοφύλων ἐθνῶν
  choice: und nicht aus dem Geschlecht fremder Völker stammt
  rationale: „Geschlecht“ entspricht γένος, während „fremde Völker“ sowohl ἀλλόφυλος als auch ἔθνη abbildet.
theological_decisions:
- issue: Reichweite von μῶμος und βεβηλωμένη
  choice: „keinen Makel hat und nicht entweiht ist“ als zwei getrennte Merkmale
  alternative: „ohne Makel oder Verunreinigung“
  rationale: Der griechische Text nennt zwei koordinierte Beschreibungen. Die Übersetzung verschmilzt sie nicht und legt weder ausschließlich körperliche Fehlerlosigkeit noch ausschließlich kultische Reinheit fest.
- issue: Identität der „fremden Völker“
  choice: allgemein als „fremde Völker“ wiedergegeben
  alternative: „Nichtjuden“ oder „Heiden“
  rationale: Der Ausgangstext benennt keine konkrete Gruppe und lässt die Perspektive des Fremdseins im Kontext stehen; eine konfessionell oder ethnisch präzisierende Deutung wäre enger als der Wortlaut.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt macht die nachgestellten Anforderungen an die Frau klar, ohne zusätzliche Deutung einzuführen. Keine Fußnoten erforderlich.
