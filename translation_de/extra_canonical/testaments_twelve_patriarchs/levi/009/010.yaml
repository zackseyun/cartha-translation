review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe folgt der dreigliedrigen Anweisung des griechischen Textes: Ehefrau nehmen, solange der Angeredete jung ist; ohne Makel; nicht βεβηλωμένη; und nicht aus einer Abstammung fremder Völker. „Makel“ gibt μῶμος offen wieder. Für βεβηλωμένη ist „verunreinigt“ im Deutschen bei einer Person idiomatischer und wahrt den kultisch-sittlichen, nicht weiter bestimmten Zustand besser als „entweiht“.'
  naturalness: Der Entwurf ist insgesamt klar und würdevoll. „Eine Frau ist entweiht“ klingt im modernen Standarddeutsch jedoch ungewöhnlich, da „entweihen“ meist heilige Orte oder Gegenstände als Objekt hat. „Nicht verunreinigt ist“ ist hier natürlicher.
  terminology: „Makel“ ist passend für μῶμος. „Verunreinigt“ erhält die nicht spezifizierte Reichweite von βεβηλωμένη, ohne eine bestimmte Art der Verunreinigung festzulegen. „aus dem Geschlecht fremder Völker stammt“ bildet γένος sowie ἀλλοφύλων ἐθνῶν angemessen ab und vermeidet die stärker auslegenden Bezeichnungen „Heiden“ oder „Nichtjuden“.
  issues:
  - severity: low
    issue: „entweiht“ für βεβηλωμένη
    rationale: Die Formulierung ist zwar semantisch möglich, aber bezogen auf eine Frau im modernen Deutschen wenig idiomatisch und legt wegen der üblichen Verwendung von „entweihen“ für Sakralobjekte einen engeren Klang nahe. „Verunreinigt“ ist sprachlich natürlicher und bewahrt die offene kultisch-sittliche Bedeutung.
  revised_text: 'Darum nimm dir eine Frau, solange du noch jung bist: eine, die keinen Makel hat, nicht verunreinigt ist und nicht aus dem Geschlecht fremder Völker stammt.'
