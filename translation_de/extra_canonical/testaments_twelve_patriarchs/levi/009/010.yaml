  rationale: Eine minimale sprachliche Anpassung ersetzt das bei Personen ungebräuchlichere „entweiht“ durch „verunreinigt“. Die drei im griechischen Text nebeneinandergestellten Anforderungen und ihre bewusst offene Bedeutung bleiben erhalten.
