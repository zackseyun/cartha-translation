  text: 'And every day he was instructing me, and being occupied with me, he said to me:'
translation:
  language: de
  text: 'Und jeden Tag unterwies er mich; er widmete sich mir und sagte zu mir:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καθ᾽ ἑκάστην ἡμέραν
  choice: jeden Tag
  rationale: Natürliche und genaue Wiedergabe der distributiven Zeitangabe.
- source_word: συνετίζων με
  choice: unterwies er mich
  rationale: συνετίζω bezeichnet hier das Vermitteln von Einsicht oder verständiger Unterweisung; das durative Imperfekt mit Partizip wird idiomatisch als fortlaufende Handlung wiedergegeben.
- source_word: ἀσχολούμενος εἰς ἐμέ
  choice: er widmete sich mir
  rationale: Die ungewöhnliche Konstruktion beschreibt, dass er sich mit Levi beschäftigte beziehungsweise ihm seine Aufmerksamkeit zuwandte. „Sich widmen“ klingt im Deutschen natürlich, ohne den Sinn unnötig festzulegen.
- source_word: ἔλεγέ μοι
  choice: sagte zu mir
  rationale: Entspricht der fortlaufenden beziehungsweise einleitenden Redeformel und bewahrt den Doppelpunkt als Übergang zur folgenden direkten Rede.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die fortlaufenden griechischen Verbformen werden flüssig wiedergegeben; der etwas sperrige Ausdruck ἀσχολούμενος εἰς ἐμέ wird als persönliche Zuwendung verstanden, ohne einen nicht im vorliegenden griechischen Text belegten Bezug auf freiwillige Opfergaben einzuführen.
