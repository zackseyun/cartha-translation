  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/008.yaml
  text: '1 And there again I saw a vision like the former one, after we had remained there seventy days. 2 And I saw seven men in white clothing, saying to me, “Rise, put on the robe of the priesthood, and the crown of righteousness, and the oracle of understanding, and the full-length robe of truth, and the plate of faith, and the turban of the head, and the ephod of prophecy.” 3 And each one of them was carrying these things, and they put them on me and said to me, “From now on, become a priest—you and all your seed.”


    4 And the first anointed me with holy oil and gave me a priestly staff. 5 And the second washed me with pure water of the Lord, and fed me holy bread and wine, and put around me a holy and glorious robe. 6 And the third put on me a linen garment, like an ephod. 7 And the fourth wrapped around me a girdle, like purple. 8 And the fifth gave me a branch of rich olive. 9 And the sixth placed a crown on my head. 10 And the seventh put on me a diadem of priesthood and filled my hands with incense, so that I might serve as priest before the Lord God.


    11 And they say to me, “Levi, your seed will be divided into three offices, for a sign of the glory of the Lord who is coming. 12 And the first lot will be great; none will arise greater than it. 13 And the second will be in priesthood. 14 And the third will be called by a new name, because a king will arise from Judah and will establish a new priesthood, after the pattern of the nations, for all the nations. 15 And his presence is beloved, like a prophet of the Most High, from the seed of Abraham our father. 16 Therefore every desirable thing in Israel will be for you and for your seed, and your seed will eat every beautiful thing, and will apportion the table of the Lord. 17 And from among them there will be priests and judges and scribes, and by their mouth the holy thing will be received.”


    18 So when I awoke, I understood that this was like the first vision.'
translation:
  language: de
  text: '**Testament Levis 8**


    **1** Dort sah ich wieder eine Vision wie die frühere, nachdem wir siebzig Tage dort geblieben waren. **2** Ich sah sieben Männer in weißen Gewändern. Sie sagten zu mir: »Steh auf und lege das Gewand des Priestertums an, die Krone der Gerechtigkeit, das Brustschild der Einsicht, das lange Gewand der Wahrheit, das Stirnblatt des Glaubens, den Kopfbund[a] und den Efod der Prophetie.« **3** Jeder von ihnen trug eines dieser Stücke. Sie legten sie mir an und sagten zu mir: »Von jetzt an sei ein Priester – du und alle deine Nachkommen.«


    **4** Der Erste salbte mich mit heiligem Öl und gab mir einen Stab. **5** Der Zweite wusch mich mit reinem Wasser des Herrn, gab mir heiliges Brot und heiligen Wein zu essen und zu trinken und legte mir ein heiliges, herrliches Gewand um. **6** Der Dritte legte mir ein Leinengewand an, das einem Efod glich. **7** Der Vierte legte mir einen Gürtel um, der Purpur glich. **8** Der Fünfte gab mir einen Zweig von einem üppigen Ölbaum. **9** Der Sechste setzte mir eine Krone auf den Kopf. **10** Der Siebte legte mir das Diadem des Priestertums an und füllte meine Hände mit Räucherwerk, damit ich dem Herrn Gott als Priester diente.


    **11** Dann sagten sie zu mir: »Levi, deine Nachkommen werden in drei Ordnungen[b] aufgeteilt werden, als Zeichen der Herrlichkeit des kommenden Herrn. **12** Das erste Los wird groß sein; kein anderes wird aufstehen, das größer wäre. **13** Das zweite wird im Priestertum stehen. **14** Der dritte wird mit einem neuen Namen genannt werden, denn ein König wird aus Juda[c] aufstehen und ein neues Priestertum schaffen – nach dem Vorbild der Völker, für alle Völker. **15** Sein Erscheinen wird lieblich sein wie das eines Propheten des Höchsten aus dem Geschlecht Abrahams, unseres Vaters. **16** Darum wird alles Begehrenswerte in Israel dir und deinen Nachkommen gehören. Ihr werdet alles Schöne essen, das ihr seht, und deine Nachkommen werden den Tisch des Herrn austeilen. **17** Aus ihnen werden Priester, Richter und Schriftgelehrte hervorgehen, und nach ihrem Ausspruch wird das Heilige entgegengenommen werden.[d]«


    **18** Als ich erwachte, erkannte ich, dass dies der ersten Vision glich.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier „den Kopfbund des Kopfes“. Der griechische Wortlaut ist vermutlich beschädigt oder durch eine erklärende Ergänzung erweitert worden.
    reason: Die Edition kennzeichnet τῆς κεφαλῆς als textkritisch unsicher; die Hauptübersetzung vermeidet die unnatürliche Wiederholung.
  - marker: b
    text: Das griechische Wort kann auch „Herrschaftsbereiche“, „Ränge“, „Ämter“ oder „Anfänge“ bedeuten.
    reason: Die Art der angekündigten Dreiteilung bleibt lexikalisch mehrdeutig.
  - marker: c
    text: Der griechische Wortlaut bei „aus Juda“ ist textkritisch unsicher; vermutlich ist „aus dem Stamm Juda“ gemeint.
    reason: Die Edition markiert ἐκ τοῦ als verdächtig, und vor Ἰούδα scheint ein Bezugswort ausgefallen zu sein.
  - marker: d
    text: 'Wörtlich etwa: „Aufgrund ihres Mundes wird das Heilige empfangen werden.“ Sowohl „das Heilige“ als auch die genaue Bedeutung der Wendung sind unsicher.'
    reason: Die Edition kennzeichnet den Wortlaut als textkritisch schwierig; die Übersetzung gibt eine mögliche autoritative oder kultische Bedeutung wieder, ohne den Gegenstand näher festzulegen.
lexical_decisions:
- source_word: λόγιον
  choice: Brustschild
  rationale: Im priesterlichen Gewand bezeichnet das Wort das Orakel- beziehungsweise Brustschild; „Brustschild“ ist für moderne Leser konkret, während „der Einsicht“ die symbolische Deutung des Textes bewahrt.
- source_word: ποδήρης
  choice: langes Gewand
  rationale: Das Adjektiv bezeichnet ein bis zu den Füßen reichendes Kleidungsstück. Die verständliche deutsche Wiedergabe vermeidet ein unnötiges Fachwort.
- source_word: πέταλον
  choice: Stirnblatt
  rationale: Gemeint ist die priesterliche Metallplatte am Kopfschmuck, nicht allgemein eine Tafel.
- source_word: ἐφοὺδ / ἐφούδ
  choice: Efod
  rationale: Der etablierte biblische Fachbegriff wahrt den Bezug zur priesterlichen Kleidung und vermeidet eine spekulative Identifizierung.
- source_word: κλάδον ... ἐλαίας πιότητος
  choice: einen Zweig von einem üppigen Ölbaum
  rationale: πιότης bezeichnet Fülle, Fettigkeit oder reichen Ertrag. „Üppig“ gibt das Bild natürlich wieder, ohne lediglich einen „fetten“ Zweig zu behaupten.
- source_word: ἀρχάς
  choice: Ordnungen
  rationale: Das Wort kann Herrschaftsbereiche, Ränge, Ämter oder Anfänge bezeichnen. „Ordnungen“ passt zur folgenden Dreiteilung und lässt deren genaue institutionelle Gestalt offen.
- source_word: παρουσία
  choice: Ankunft
  rationale: Das Wort kann Gegenwart, Erscheinen oder Ankunft bedeuten. Im Zusammenhang mit dem kommenden Herrn und dem aufstehenden König ist „Ankunft“ naheliegend, ohne eine bestimmte endzeitliche Lehre einzutragen.
- source_word: σπέρμα
  choice: Nachkommen / Geschlecht
  rationale: Bei Levis fortdauernder Linie ist „Nachkommen“ idiomatisches Deutsch; bei der Herkunft aus Abraham klingt „Geschlecht“ natürlicher. Beide geben die genealogische Bedeutung wieder.
theological_decisions:
- issue: Die drei Teile von Levis Nachkommenschaft
  choice: „drei Ordnungen“ und anschließend „erstes/zweites/drittes Los“
  alternative: „drei Ämter“
  rationale: Der griechische Text bezeichnet die genaue Art der Dreiteilung nicht eindeutig. Die Übersetzung vermeidet es, daraus ohne Textgrundlage drei fest umrissene kirchliche Ämter zu machen.
- issue: Das neue Priestertum und die Völker
  choice: „nach dem Vorbild der Völker, für alle Völker“
  alternative: „nach dem Vorbild des Priestertums der Völker“ oder eine christologisch konkretisierte Fassung
  rationale: Die ungewöhnliche Spannung des griechischen Wortlauts wird erhalten. Der Text nennt weder ausdrücklich ein heidnisches Priestertum noch identifiziert er den König namentlich.
- issue: Der Prophet des Höchsten in Vers 15
  choice: „Seine Ankunft ist willkommen wie die eines Propheten des Höchsten“
  alternative: „Er ist der geliebte Prophet des Höchsten“
  rationale: Der Vergleich mit ὡς wird beibehalten. So wird die Person nicht stillschweigend mit dem Propheten gleichgesetzt, obwohl der Satz diese Nähe nahelegt.
- issue: „das Heilige“ in Vers 17
  choice: Der substantivierte Ausdruck bleibt unbestimmt
  alternative: „die Heiligkeit“, „das Heiligtum“, „die heilige Gabe“ oder „das heilige Gesetz“
  rationale: Der griechische Text erklärt τὸ ἅγιον nicht näher. Eine konfessionelle oder kultische Festlegung wäre nicht quellenbasiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen, klaren Sätzen. Kultische Fachbegriffe wie „Efod“ und „Stirnblatt“ bleiben erhalten, wo allgemeinere Wörter die Gegenstände verwischen würden. „Nachkommen“ ersetzt das heute missverständliche genealogische „Same“. Die Redeform bleibt feierlich, aber nicht altertümlich; textkritische Unsicherheiten und theologische Spannungen werden in Fußnoten offengelegt.
