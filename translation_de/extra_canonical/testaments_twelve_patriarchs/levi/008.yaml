  rationale: Die Revision erhält die gewählte Terminologie und die ausgewiesenen Textunsicherheiten. Sie stellt die ausgelassene Angabe ἐν ὁράσει in Vers 16 wieder her, vermeidet in Vers 15 eine rezeptive Deutung von ἀγαπητή und glättet zwei deutsche Formulierungen, ohne den Sinn oder die vorhandenen Fußnotenanker zu verändern.
  reviewer_model: gpt-5.6-terra
