  text: 'And after two days[a], I and Judah went up with our father Jacob to Isaac our grandfather. And the father of my father blessed me according to the visions that I had seen, and he was not willing to go with us to Bethel.


    And when we came to Bethel, my father Jacob saw a vision concerning me, that I would be a priest for them. And rising early in the morning, he gave a tenth of everything through me to the Lord.


    And so we came to Hebron to remain there. And Isaac kept calling me continually to remind me of the law of the Lord, just as the angel had shown me. And he taught me the law of the priesthood, of sacrifices, of whole burnt offerings, of firstfruits, of freewill offerings, and of peace offerings. And every day he kept instructing me in freewill offerings, and giving his attention to me he said:


    “Take heed to yourself from the spirit of sexual immorality[b], for this persists and is about to defile the holy things through your offspring. Therefore take for yourself a wife while you are still young, one having no blemish and not defiled, and not from the stock of foreign nations.


    And before you enter into the holy things, wash; and when you sacrifice in the presence of the Lord, wash your hands. And when you complete the sacrifice again, wash.


    And from twelve trees having leaves offer to the Lord, as Abraham taught me. And from every clean animal and bird offer a sacrifice to the Lord. And from all your first produce and wine offer firstfruits as a sacrifice to the Lord God[c][d]. And season every sacrifice with salt.”'
translation:
  language: de
  text: '**Testament Levis 9**


    1 Zwei Tage später zog ich zusammen mit Juda und unserem Vater Jakob zu Isaak, unserem Großvater, hinauf. 2 Der Vater meines Vaters segnete mich im Einklang mit den Visionen, die ich gesehen hatte. Doch er wollte nicht mit uns nach Bethel gehen.


    3 Als wir nach Bethel kamen, sah mein Vater Jakob eine Vision über mich: Ich sollte ihnen als Priester dienen. 4 Früh am Morgen stand er auf und gab durch mich dem Herrn den Zehnten von allem.


    5 Danach kamen wir nach Hebron, um dort zu bleiben. 6 Isaak rief mich immer wieder zu sich, um mich an das Gesetz des Herrn zu erinnern, wie der Engel es mir gezeigt hatte. 7 Er unterwies mich im Gesetz des Priestertums, der Schlachtopfer, der Ganzbrandopfer, der Erstlingsgaben, der freiwilligen Gaben und der Heilsopfer.[a] 8 Tag für Tag gab er mir Einsicht, nahm sich meiner an und sagte zu mir:


    9 »Hüte dich vor dem Geist der sexuellen Unmoral! Denn er wirkt unablässig[b] und wird durch deine Nachkommen das Heilige verunreinigen. 10 Nimm dir deshalb eine Frau, solange du noch jung bist. Sie soll keinen Makel haben, nicht befleckt sein und nicht aus dem Geschlecht fremder Völker stammen.


    11 Bevor du das Heilige betrittst, wasche dich. Wenn du opferst, wasche dir die Hände; und wenn du das Opfer vollendet hast, wasche sie erneut.[c]


    12 Bringe also von zwölf Bäumen, die Blätter tragen, dem Herrn dar, wie Abraham es auch mich gelehrt hat.[d] 13 Bringe dem Herrn von jedem reinen Tier und jedem reinen Vogel ein Opfer dar. 14 Bringe von allem Erstgeborenen, das dir gehört, und von Wein Erstlingsgaben als Opfer für den Herrn dar.[e] Salze jedes Opfer mit Salz.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Heilsopfer« kann hier auch mit »Friedensopfer« oder allgemeiner mit »Opfer für Wohlergehen und Rettung« wiedergegeben werden.
    reason: lexical_alternative
  - marker: b
    text: Der griechische Wortlaut ist an dieser Stelle textlich schwierig. Wahrscheinlich ist gemeint, dass der Geist der sexuellen Unmoral beständig oder beharrlich wirkt.
    reason: textual_variant
  - marker: c
    text: Beim ersten Gebot steht ein Verb für umfassendes Waschen oder Baden; bei den beiden folgenden ein Verb, das im Opferzusammenhang wahrscheinlich das Waschen der Hände meint.
    reason: cultural_note
  - marker: d
    text: Die Anweisung über »zwölf Bäume, die Blätter tragen« ist dunkel. Im Griechischen wird nicht ausdrücklich gesagt, was von diesen Bäumen dargebracht werden soll; die Übersetzung bleibt daher nahe am Wortlaut.
    reason: lexical_alternative
  - marker: e
    text: Ein griechischer Textzeuge ergänzt nach »dem Herrn« die Bezeichnung »Gott«.
    reason: textual_variant
lexical_decisions:
- source_word: ἀπεδεκάτωσε πάντα
  choice: gab ... den Zehnten von allem
  rationale: Gibt die kultische Bedeutung des Verbs verständlich wieder und bewahrt mit »durch mich« Levis vermittelnde Rolle.
- source_word: ἱερέα
  choice: Priester
  rationale: Die übliche und sachlich genaue Bezeichnung für das hier vorausgesagte Amt.
- source_word: νόμον ἱερωσύνης
  choice: Gesetz des Priestertums
  rationale: Bewahrt die Genitivkonstruktion und den lehrhaften Ton.
- source_word: ὁλοκαυτωμάτων
  choice: Ganzbrandopfer
  rationale: Macht kenntlich, dass das Opfer vollständig verbrannt wird.
- source_word: ἀπαρχῶν
  choice: Erstlingsgaben
  rationale: Etablierter kultischer Ausdruck für Gaben vom ersten Ertrag.
- source_word: ἑκουσίου
  choice: freiwillige Gaben
  rationale: Bewahrt den Aspekt der Freiwilligkeit, ohne eine nicht ausdrücklich genannte Opferform zu verengen.
- source_word: σωτηρίου
  choice: Heilsopfer
  rationale: Gibt den kultischen Fachbegriff wieder, lässt aber dessen Bedeutungsfeld von Frieden, Wohlergehen und Rettung offen; eine Alternative wird in der Fußnote genannt.
- source_word: πρόσεχε σεαυτῷ
  choice: Hüte dich
  rationale: Natürliche, eindringliche deutsche Warnformel im würdigen Register.
- source_word: πνεύματος τῆς πορνείας
  choice: Geist der sexuellen Unmoral
  rationale: Bewahrt sowohl die geistige Personifizierung als auch den breiten sexuellen Bedeutungsumfang von πορνεία.
- source_word: †ἐνδελεχῆ ἐστιν†
  choice: er wirkt unablässig
  rationale: Der überlieferte Wortlaut ist schwierig; die Übersetzung gibt den wahrscheinlichen Sinn von Beständigkeit wieder, ohne die Unsicherheit zu verschweigen.
- source_word: μιαίνειν τὰ ἅγια
  choice: das Heilige verunreinigen
  rationale: Bewahrt die kultische Sprache der Verunreinigung und lässt offen, ob heilige Dinge, Bereiche oder Handlungen gemeint sind.
- source_word: μὴ ἔχουσαν μῶμον
  choice: keinen Makel haben
  rationale: Erhält die auffällige Reinheits- und Opfersprache, die hier auf die Wahl einer Ehefrau übertragen wird.
- source_word: λούου ... νίπτου
  choice: wasche dich ... wasche dir die Hände
  rationale: Unterscheidet das umfassendere Waschen im ersten Verb von dem im Opferkontext wahrscheinlich gemeinten Waschen der Hände bei νίπτω.
- source_word: παντὸς πρωτογεννήματός σου
  choice: von all deinem Erstertrag
  rationale: Im Zusammenhang mit Wein und Erstlingsgaben bezeichnet der Ausdruck wahrscheinlich den ersten Ertrag; die Formulierung bleibt dennoch allgemein.
- source_word: ἅλατι ἁλιεῖς
  choice: Salze jedes Opfer mit Salz
  rationale: Bewahrt die ausdrückliche Wiederholung des griechischen Wortstamms in klarem Deutsch.
theological_decisions:
- issue: Reinheitswarnung und priesterliche Nachkommen
  choice: Die Warnung wird ausdrücklich auf die Verunreinigung des Heiligen durch Levis Nachkommen bezogen.
  alternative: Eine allgemeine moralische Warnung ohne besonderen Bezug zum erblichen Priestertum.
  rationale: Der griechische Text verbindet »deine Nachkommen« unmittelbar mit »dem Heiligen« und stellt die Aussage in einen priesterlichen Zusammenhang.
- issue: Bedeutung von σωτηρίου
  choice: Heilsopfer
  alternative: Friedensopfer oder Gemeinschaftsopfer
  rationale: Der Ausdruck bezeichnet eine kultische Opferklasse, deren Bedeutungsfeld Heil, Wohlergehen und Frieden umfasst. »Heilsopfer« bewahrt diese Breite; die geläufige Alternative wird vermerkt.
- issue: Waschungen beim Opfer
  choice: Das erste Gebot wird als Ganzkörperwaschung, die folgenden als Händewaschungen verstanden.
  alternative: Alle drei Gebote allgemein mit »wasche dich« wiederzugeben.
  rationale: λούω bezeichnet gewöhnlich ein umfassenderes Baden oder Waschen, νίπτω dagegen häufig das Waschen einzelner Körperteile; der Opferkontext legt die Hände nahe.
- issue: Gottesbezeichnung in Vers 14
  choice: Im Haupttext steht »dem Herrn«.
  alternative: »dem Herrn, Gott« oder »dem Herrn Gott« nach einem erweiterten griechischen Textzeugen.
  rationale: Κυρίῳ gehört zum Grundtext der vorgelegten Edition; τῷ θεῷ ist als zusätzliche Lesart gekennzeichnet und wird deshalb in einer Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählprosa und feierlicher direkter Rede. Kultische Fachbegriffe werden beibehalten, wo sie für den Sinn wesentlich sind, aber durch verständliche Zusammensetzungen oder Fußnoten erschlossen. Nicht im griechischen Text belegte Zusätze der englischen Konsultationsfassung wurden vermieden.
