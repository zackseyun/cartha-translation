translation:
  language: de
  text: '**Testament Levis 14**


    **1** Darum habe ich erkannt, meine Kinder, dass ihr am Ende der Zeitalter gegen den Herrn gottlos handeln und in Bosheit Hand an ihn legen werdet[a]. Unter allen Völkern werdet ihr zum Gespött werden. **2** Denn unser Vater Israel ist frei von der Gottlosigkeit der obersten Priester, die Hand an den Retter der Welt legen werden[b]. **3** Denn wie die Sonne vor dem Herrn über der Erde rein ist[c], so seid auch ihr, die Leuchten Israels, reiner als alle Völker.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Ergänzung, die hier mit „an ihn“ wiedergegeben ist, steht in der griechischen Vorlage in eckigen Klammern und ist daher textkritisch unsicher. Auch ohne sie kann die Wendung „Hand anlegen“ feindseliges Zugreifen ausdrücken.
    reason: textual_variant
  - marker: b
    text: Der ganze Relativsatz „die Hand an den Retter der Welt legen werden“ steht in der griechischen Vorlage in eckigen Klammern. Er könnte eine spätere, möglicherweise christliche Erweiterung der Überlieferung sein.
    reason: textual_variant
  - marker: c
    text: Die Wortgruppe „die Sonne ... über der Erde“ ist in der Edition mit textkritischen Zeichen als unsicher beziehungsweise möglicherweise verderbt markiert. Die Übersetzung folgt dem gedruckten griechischen Wortlaut.
    reason: textual_variant
lexical_decisions:
- source_word: ἔγνων
  choice: weiß ich
  rationale: Das griechische Aoristverb bezeichnet hier eine erlangte und nun bestehende Erkenntnis. Das natürliche deutsche Präsens gibt diesen gegenwärtigen Erkenntnisstand wieder, ohne das schwerfällige „habe erkannt“ zu erzwingen.
- source_word: ἐπὶ τὰ τέλη τῶν αἰώνων
  choice: am Ende der Zeitalter
  rationale: Bewahrt den Plural αἰώνων und den apokalyptischen Zeithorizont des griechischen Ausdrucks.
- source_word: ἀσεβήσετε ἐπὶ Κυρίου
  choice: gegen den Herrn gottlos handeln
  rationale: Der feindselige Zusammenhang stützt die adversative Wiedergabe von ἐπί; die verbale Form von ἀσεβέω bleibt als Handlung erhalten.
- source_word: χεῖρας ἐπιβάλλοντες
  choice: Hand an ihn legen
  rationale: Die geläufige deutsche Wendung bewahrt die Mehrdeutigkeit zwischen Ergreifen, Festnehmen und gewaltsamem Vorgehen.
- source_word: χλευασμός
  choice: zum Gespött
  rationale: Eine natürliche und prägnante Wiedergabe öffentlicher Verhöhnung.
- source_word: καθαρός ἐστιν ἀπό
  choice: ist frei von
  rationale: Mit ἀπό bezeichnet καθαρός hier das Freisein von beziehungsweise die Nichtbeteiligung an der genannten Gottlosigkeit; „rein von“ wäre im modernen Deutsch unnatürlich.
- source_word: ἀρχιερέων
  choice: führenden Priester
  rationale: Der griechische Plural kann die priesterliche Führungsschicht bezeichnen. Diese Wiedergabe vermeidet die im Deutschen leicht missverständliche Vorstellung mehrerer gleichzeitig amtierender Hohepriester.
- source_word: σωτῆρα τοῦ κόσμου
  choice: Retter der Welt
  rationale: Direkte Wiedergabe der theologisch gewichtigen Bezeichnung, ohne ihren Bezug über den Wortlaut hinaus festzulegen.
- source_word: φωστῆρες τοῦ Ἰσραήλ
  choice: die Leuchten Israels
  rationale: „Leuchten“ wahrt das Bild lichtspendender Himmelskörper und ist zugleich als ehrende Bezeichnung für Personen verständlich.
- source_word: παρὰ πάντα τὰ ἔθνη
  choice: reiner als alle Völker
  rationale: παρά mit Akkusativ trägt hier vergleichenden Sinn. Das im vorangehenden Vergleich vorausgesetzte „rein“ wird im Deutschen wiederholt, damit der Satz verständlich bleibt.
theological_decisions:
- issue: Bezug von „dem Herrn“ und „ihn“ in Vers 1
  choice: 'Die direkte, anklagende Formulierung bleibt erhalten: Gegen den Herrn handeln und Hand an ihn legen.'
  alternative: Die Aussage allgemein als Auflehnung gegen die Herrschaft des Herrn umschreiben oder „ihn“ ausdrücklich mit dem später genannten Retter der Welt gleichsetzen.
  rationale: Der griechische Text formuliert die Aussage bewusst zugespitzt. Eine Harmonisierung würde die Spannung und die mögliche Mehrdeutigkeit des Bezugs beseitigen.
- issue: Eingeklammerter Satz über den Retter der Welt in Vers 2
  choice: Der Satz wird im Haupttext übersetzt und durch eine textkritische Fußnote gekennzeichnet.
  alternative: Den Satz als sekundären christlichen Zusatz aus dem Haupttext entfernen.
  rationale: Die gelieferte griechische Textgestalt enthält den Satz, markiert ihn aber als unsicher. Übersetzung und Fußnote bilden beides transparent ab.
- issue: Aussage über die Reinheit Israels und seiner Leuchten
  choice: Der überraschende Vergleich wird ohne theologische Glättung beibehalten.
  alternative: Die Aussage abschwächen oder an die vorausgehende Anklage angleichen.
  rationale: Die Spannung zwischen der angekündigten Gottlosigkeit und der Reinheitsaussage gehört zur überlieferten Textgestalt und darf nicht stillschweigend aufgelöst werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit prophetisch-testamentarischem Ton. Ungebräuchliche Fremdwörter wie „Impie­tät“ werden vermieden; die markanten Bilder und die textlichen Spannungen bleiben erhalten.
