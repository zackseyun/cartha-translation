    rationale: Das griechische Aorist bezeichnet hier die erfolgte Erkenntnis. „Habe erkannt“ gibt diesen Aspekt wieder, ohne im Deutschen unnatürlich zu sein.
  - severity: medium
    issue: ἀρχιερέων ist als „führenden Priester“ zu allgemein übersetzt.
    rationale: Die griechische Bezeichnung meint eine hervorgehobene priesterliche Gruppe beziehungsweise deren Angehörige. „Die obersten Priester“ ist genauer und weiterhin neutral.
  - severity: low
    issue: Fußnote c ordnet die textkritische Markierung zu stark einzelnen Wörtern zu.
    rationale: Die Dagger-Zeichen markieren die problematische Formulierung um „die Sonne ... über der Erde“. Die Anmerkung sollte daher von der Wortgruppe sprechen.
