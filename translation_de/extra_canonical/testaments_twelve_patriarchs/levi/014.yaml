  to: '**Testament Levis 14**


    **1** Darum habe ich erkannt, meine Kinder, dass ihr am Ende der Zeitalter gegen den Herrn gottlos handeln und in Bosheit Hand an ihn legen werdet[a]. Unter allen Völkern werdet ihr zum Gespött werden. **2** Denn unser Vater Israel ist frei von der Gottlosigkeit der obersten Priester, die Hand an den Retter der Welt legen werden[b]. **3** Denn wie die Sonne vor dem Herrn über der Erde rein ist[c], so seid auch ihr, die Leuchten Israels, reiner als alle Völker.'
  rationale: Die Korrekturen verbessern die unmittelbare Bindung an den griechischen Wortlaut, ohne dessen Spannungen oder textkritische Unsicherheiten aufzulösen. Der eingeklammerte Bezug auf „ihn“ in V. 1 und der eingeklammerte Relativsatz in V. 2 bleiben im Haupttext und werden transparent erläutert. V. 3 wird, anders als die unvollständige englische Audit-Fassung, nach dem tatsächlich bereitgestellten griechischen Wortlaut vollständig übersetzt; die problematische Textgestalt wird in der Fußnote kenntlich gemacht.
