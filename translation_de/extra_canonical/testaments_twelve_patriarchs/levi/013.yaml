  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/013.yaml
  text: '1[a]. And now, my children, I command you: fear the Lord your God with all your heart, and walk in simplicity according to all his law. 2. And you also, teach your children letters, so that they may have understanding throughout all their life, reading the law of God without ceasing. 3. For everyone who comes to know the law of the Lord will be honored, and he will not be a stranger wherever he goes. 4[b]. Indeed, he will gain many friends more than parents, and many among men will desire to serve him and to hear the law from his mouth. 5. Therefore do righteousness, my children, upon the earth, so that you may find it in the heavens. 6. And sow good things in your souls, and you will find them in your life. But if you sow evil things, you will reap every turmoil and affliction. 7. Acquire wisdom in the fear of God, because if captivity comes, and cities and lands are destroyed, and gold and silver and every possession perishes, no one can take away the wise man''s wisdom, except
    the blindness of ungodliness and the hardening of sin. 8. For if anyone keeps himself from these evil works, then wisdom will become for him splendid even among enemies, and in a foreign land a homeland, and in the midst of foes he will be found a friend. 9. Everyone who teaches good things and does them will share the throne of kings[c], just as Joseph my brother also did.'
translation:
  language: de
  text: '1. Und nun, meine Kinder, gebiete ich euch: Fürchtet den Herrn, euren Gott, von ganzem Herzen, und lebt in Lauterkeit gemäß seinem ganzen Gesetz. 2. Lehrt auch ihr eure Kinder die Buchstaben, damit sie ihr ganzes Leben hindurch Einsicht haben und unablässig das Gesetz Gottes lesen. 3. Denn jeder, der das Gesetz des Herrn kennenlernt, wird geehrt werden und nirgends, wohin er geht, ein Fremder sein. 4. Ja, er wird mehr Freunde als Eltern gewinnen[a], und viele Menschen werden ihm dienen und das Gesetz aus seinem Mund hören wollen. 5. Übt also Gerechtigkeit, meine Kinder, auf der Erde, damit ihr sie in den Himmeln findet[b]. 6. Sät Gutes in eure Seelen, und ihr werdet es in eurem Leben finden. Wenn ihr aber Böses sät, werdet ihr jede Unruhe und Bedrängnis ernten. 7. Erlangt Weisheit in der Furcht Gottes. Denn wenn Gefangenschaft hereinbricht, Städte und Länder zerstört werden und Gold, Silber und aller Besitz verloren gehen, kann niemand dem Weisen seine Weisheit nehmen – außer Blindheit
    der Gottlosigkeit und Verhärtung der Sünde. 8. Denn wenn jemand sich vor diesen bösen Taten bewahrt, dann wird ihm Weisheit selbst unter Gegnern glänzend sein und ihm in fremdem Land zur Heimat werden; und mitten unter Feinden wird er als Freund gelten[c]. 9. Jeder, der Gutes lehrt und tut, wird mit Königen auf dem Thron sitzen, so wie auch mein Bruder Josef.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Wendung »mehr Freunde als Eltern« ist schwierig. Gemeint sein kann, dass ein kundiger Mensch über den Familienkreis hinaus viele Freunde gewinnt oder mehr Freunde, als ihm allein seine familiäre Stellung verschaffen könnte.
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »Übt Gerechtigkeit … damit ihr [sie] in den Himmeln findet.« Das Objekt von »findet« bleibt im Griechischen unausgesprochen.'
    reason: alternative_reading
  - marker: c
    text: 'Das Griechische ist stark verdichtet: Weisheit wird »unter Gegnern glänzend« und wird dem Menschen in fremdem Land zur »Heimat«.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἁπλότης
  choice: Lauterkeit
  rationale: Bezeichnet hier ungeteiltes, geradliniges und aufrichtiges Verhalten. „Lauterkeit“ bewahrt den ethischen Gehalt, ohne den Ausdruck auf bloße intellektuelle Einfachheit zu verengen.
- source_word: γράμματα
  choice: die Buchstaben
  rationale: Gibt den konkreten Bezug auf elementare Schriftkenntnis wieder; der folgende Zweckzusatz verbindet diese unmittelbar mit dem fortwährenden Lesen des Gesetzes.
- source_word: σύνεσις
  choice: Verständnis
  rationale: Der Ausdruck umfasst intellektuelles und sittliches Verstehen und passt zum Zusammenhang von Bildung und Gesetzeslektüre.
- source_word: ξένος
  choice: ein Fremder
  rationale: 'Bewahrt den sozialen Sinn fehlender Zugehörigkeit: Wer das Gesetz kennt, findet überall Ehre und Aufnahme.'
- source_word: δουλεῦσαι
  choice: dienen
  rationale: Das Verb kann Sklavendienst bezeichnen, meint hier im Kontext der Verehrung eines weisen Lehrers am ehesten freiwilliges Dienen oder Aufwarten.
- source_word: δικαιοσύνη
  choice: was gerecht ist
  rationale: Gibt den handlungsbezogenen Sinn idiomatisch wieder und bewahrt zugleich die religiös-ethische Bedeutung von Gerechtigkeit.
- source_word: ψυχαῖς
  choice: Seelen
  rationale: Erhält die anthropologische Bildsprache des Säens im Inneren des Menschen.
- source_word: ταραχή
  choice: Unruhe
  rationale: Deckt innere wie äußere Erschütterung ab und bildet zusammen mit „Bedrängnis“ ein natürliches deutsches Wortpaar.
- source_word: κτήσασθε
  choice: Erlangt
  rationale: Der Imperativ fordert dazu auf, Weisheit als wertvollen Besitz zu erwerben; „erlangen“ klingt im Deutschen natürlich und würdig.
- source_word: φόβῳ Θεοῦ
  choice: in der Furcht Gottes
  rationale: Bewahrt die biblische Ausdrucksweise und lässt deren Spannweite zwischen Ehrfurcht und Gottesfurcht offen.
- source_word: πώρωσις
  choice: Verhärtung
  rationale: Bewahrt das biblisch geprägte Bild sittlich-geistlicher Unempfindlichkeit und entspricht der Parallelität mit „Blindheit“.
- source_word: παρὰ τοῖς πολεμίοις λαμπρά
  choice: selbst unter Gegnern strahlen
  rationale: 'Formuliert die stark verdichtete griechische Wendung natürlich: Weisheit behält auch in feindlicher Umgebung ihren sichtbaren Glanz und ihre Anerkennung.'
- source_word: σύνθρονος ἔσται βασιλέων
  choice: wird mit Königen auf dem Thron sitzen
  rationale: Gibt das Bild des gemeinsamen Thronens wieder, ohne daraus mehrere Throne oder eine bestimmte politische oder endzeitliche Lehre abzuleiten.
theological_decisions:
- issue: Irdisches gerechtes Handeln und das Finden „in den Himmeln“ in Vers 5
  choice: Das im Deutschen durch „es“ vertretene gerechte Tun wird in den Himmeln wiedergefunden.
  alternative: „damit ihr einen Schatz im Himmel findet“ oder „damit ihr in den Himmeln gefunden werdet“
  rationale: Nach εὕρητε fehlt im Griechischen ein ausdrückliches Objekt. Der Rückbezug auf das gerechte Tun ist am naheliegendsten, wird aber nicht als genauer bestimmter himmlischer Lohn ausgedeutet.
- issue: 'Die Ausnahme in Vers 7: Blindheit der Gottlosigkeit und Verhärtung der Sünde'
  choice: Äußere Verluste können Weisheit nicht rauben; sittlich-geistliche Verderbnis bildet die einzige genannte Ausnahme.
  alternative: Die Laster werden als personifizierte äußere Mächte verstanden oder die Wendung als späterer erklärender Zusatz betrachtet.
  rationale: Die Syntax stellt Blindheit und Verhärtung unmittelbar als Ausnahme dar. Die Übersetzung lässt die ungewöhnliche Spannung stehen und entwickelt daraus keine weitergehende Lehre.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, paränetischem Ton. Die Imperative bleiben direkt, die Satzstruktur ist jedoch für heutige Leser geglättet. Traditionelle biblische Wendungen wie „Furcht Gottes“ und „aus seinem Mund“ bleiben erhalten; schwer auflösbare Bilder und syntaktische Spannungen werden nicht konfessionell vereindeutigt.
