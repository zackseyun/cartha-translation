  to: '1. Und nun, meine Kinder, gebiete ich euch: Fürchtet den Herrn, euren Gott, von ganzem Herzen, und lebt in Lauterkeit gemäß seinem ganzen Gesetz. 2. Lehrt auch ihr eure Kinder die Buchstaben, damit sie ihr ganzes Leben hindurch Einsicht haben und unablässig das Gesetz Gottes lesen. 3. Denn jeder, der das Gesetz des Herrn kennenlernt, wird geehrt werden und nirgends, wohin er geht, ein Fremder sein. 4. Ja, er wird mehr Freunde als Eltern gewinnen[a], und viele Menschen werden ihm dienen und das Gesetz aus seinem Mund hören wollen. 5. Übt also Gerechtigkeit, meine Kinder, auf der Erde, damit ihr sie in den Himmeln findet[b]. 6. Sät Gutes in eure Seelen, und ihr werdet es in eurem Leben finden. Wenn ihr aber Böses sät, werdet ihr jede Unruhe und Bedrängnis ernten. 7. Erlangt Weisheit in der Furcht Gottes. Denn wenn Gefangenschaft hereinbricht, Städte und Länder zerstört werden und Gold, Silber und aller Besitz verloren gehen, kann niemand dem Weisen seine Weisheit nehmen – außer Blindheit
