  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002/004.yaml
  text: And I was grieved over the race of the sons of men, and I prayed to the Lord that I might be saved.
translation:
  language: de
  text: Und ich war um das Geschlecht der Menschen betrübt und betete zum Herrn, dass ich gerettet werde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἤμην λυπούμενος
  choice: ich war betrübt
  rationale: Gibt die andauernde innere Betrübnis der periphrastischen Form natürlich und nah am Griechischen wieder.
- source_word: ὑπὲρ γένους τῶν υἱῶν τῶν ἀνθρώπων
  choice: über das Geschlecht der Menschensöhne
  rationale: Bewahrt die ungewöhnliche, semitisch gefärbte Ausdrucksweise und den kollektiven Sinn von γένος, ohne sie vorschnell zu 'Menschheit' zu glätten.
- source_word: ηὐξάμην τῷ Κυρίῳ
  choice: betete zum Herrn
  rationale: Entspricht dem üblichen Sinn von εὔχομαι mit dem Dativ des Adressaten und klingt im modernen Deutsch natürlich.
- source_word: ὅπως σωθῶ
  choice: dass ich gerettet würde
  rationale: Bewahrt den passiven, zielbezogenen Sinn; wer oder woraus rettet, bleibt wie im Ausgangstext unausgesprochen.
theological_decisions:
- issue: Bedeutung und Urheber der Rettung
  choice: 'Passivisch: „dass ich gerettet würde“'
  alternative: „dass der Herr mich rette“
  rationale: Das griechische σωθῶ ist passiv und nennt den Handelnden nicht ausdrücklich; die Übersetzung vermeidet eine ergänzende Festlegung.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusster Beibehaltung der quellennahen Wendung „Geschlecht der Menschensöhne“. Keine Fußnoten erforderlich.
