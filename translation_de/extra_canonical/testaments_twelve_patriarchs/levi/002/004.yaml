revisions:
- from: Und ich war betrübt über das Geschlecht der Menschensöhne und betete zum Herrn, dass ich gerettet würde.
  to: Und ich war um das Geschlecht der Menschen betrübt und betete zum Herrn, dass ich gerettet werde.
  rationale: Die Revision verbessert idiomatisches modernes Deutsch und bildet zugleich die durch ὑπέρ ausgedrückte Betroffenheit sowie den finalen passivischen Sinn von ὅπως σωθῶ präziser ab. Es werden keine theologischen oder sonstigen Ergänzungen vorgenommen.
