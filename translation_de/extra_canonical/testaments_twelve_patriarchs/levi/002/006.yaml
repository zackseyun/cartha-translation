  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002/006.yaml
  text: And behold, the heavens were opened, and an angel of the Lord said to me, “Levi, Levi, enter.”
translation:
  language: de
  text: 'Und siehe, die Himmel wurden geöffnet, und ein Engel des Herrn sagte zu mir: »Levi, Levi, tritt ein!«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: sieh
  rationale: Bewahrt den aufmerksamkeitslenkenden, visionären Charakter des griechischen Ausdrucks in natürlichem, würdigem Deutsch.
- source_word: οἱ οὐρανοί
  choice: die Himmel
  rationale: Gibt den griechischen Plural wieder und wahrt die antike kosmologische Vorstellung, ohne sie zu vereinheitlichen.
- source_word: ἄγγελος Κυρίου
  choice: ein Engel des Herrn
  rationale: Entspricht der unbestimmten griechischen Nominalphrase und vermeidet eine nicht ausgewiesene Identifizierung mit einer bestimmten Engelsgestalt.
- source_word: εἴσελθε
  choice: tritt ein
  rationale: Gibt den singularischen Imperativ idiomatisch und unmittelbar wieder.
theological_decisions:
- issue: Pluralität der Himmel
  choice: die Himmel
  alternative: der Himmel
  rationale: Der Quelltext verwendet ausdrücklich den Plural οἱ οὐρανοί; dieser wird bewahrt, damit die kosmologische und theologische Offenheit des Textes nicht eingeebnet wird.
- issue: Identität des Engels
  choice: ein Engel des Herrn
  alternative: der Engel des Herrn
  rationale: Im Griechischen fehlt der Artikel bei ἄγγελος; die Übersetzung lässt daher offen, ob eine bestimmte, bekannte Gestalt gemeint ist.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, visionärem Ton. Die doppelte Anrede »Levi, Levi« und der Plural »die Himmel« bleiben quellentreu erhalten.
