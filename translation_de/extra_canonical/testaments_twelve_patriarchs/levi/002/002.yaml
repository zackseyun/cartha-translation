base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002/002.yaml
  text: And I was still young, about twenty years old, and then I carried out vengeance with Simeon for our sister Dinah against Hamor.
translation:
  language: de
  text: Ich war noch jung, etwa zwanzig Jahre alt. Damals übte ich gemeinsam mit Simeon Vergeltung für unsere Schwester Dina an Hamor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νεώτερος
  choice: noch jung
  rationale: Gibt die vergleichende Form in diesem erzählenden Zusammenhang natürlich wieder, ohne einen ausdrücklich genannten Vergleich einzuführen.
- source_word: ἐποίησα τὴν ἐκδίκησιν
  choice: übte ich … Vergeltung
  rationale: Bewahrt den Gedanken einer vergeltenden Handlung und klingt im modernen Standarddeutsch würdig und verständlich.
- source_word: μετὰ Συμεών
  choice: gemeinsam mit Simeon
  rationale: Drückt die Beteiligung Simeons idiomatisch und eindeutig aus.
- source_word: ἀπὸ Ἐμμώρ
  choice: an Hamor
  rationale: Das griechische ἀπό bezeichnet hier die Person, an der Vergeltung genommen wird; die deutsche Fügung „Vergeltung an jemandem üben“ gibt dies natürlich wieder.
theological_decisions:
- issue: Moralische Bewertung der Vergeltung
  choice: Die Handlung wird als „Vergeltung“ bezeichnet, ohne sie ausdrücklich zu billigen oder zu verurteilen.
  alternative: „Rache“ oder eine wertende Umschreibung wie „rächte das Unrecht“
  rationale: Der griechische Text berichtet die Handlung mit ἐκδίκησις, enthält in diesem Vers aber keine ausdrückliche moralische Einordnung; diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Namensformen „Simeon“, „Dina“ und „Hamor“ folgen den im Deutschen geläufigen biblischen Formen.
