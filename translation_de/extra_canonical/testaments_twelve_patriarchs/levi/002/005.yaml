  source_fidelity: 'Die Übersetzung gibt die Satzglieder und den parataktischen Ablauf des Griechischen zuverlässig wieder: τότε („Da/dann“), ἐπέπεσέ με ὕπνος („mich überkam Schlaf“), ἐθεασάμην („ich sah“), ὄρος ὑψηλόν („einen hohen Berg“) und ἤμην ἐν αὐτῷ („ich war auf ihm“). Die bei einem Berg natürliche deutsche Wiedergabe von ἐν mit „auf“ ist sachgerecht.'
