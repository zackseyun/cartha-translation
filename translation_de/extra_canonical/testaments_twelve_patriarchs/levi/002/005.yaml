  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002/005.yaml
  text: Then sleep fell upon me, and I saw a high mountain, and I was on it.
translation:
  language: de
  text: Da überkam mich Schlaf, und ich sah einen hohen Berg, und ich war auf ihm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπέπεσέ με ὕπνος
  choice: mich überkam Schlaf
  rationale: Gibt die bildhafte Wendung ‚Schlaf fiel auf mich‘ in natürlichem, würdevollem Deutsch wieder, ohne den plötzlichen Eintritt des Schlafes abzuschwächen.
- source_word: ἐθεασάμην
  choice: ich sah
  rationale: Schlichte und kontextgerechte Wiedergabe des Sehens in einer Vision; ein ausdrücklich visionstechnischer Zusatz steht nicht im griechischen Text.
- source_word: ὄρος ὑψηλόν
  choice: einen hohen Berg
  rationale: Direkte und natürliche Entsprechung der griechischen Wortgruppe.
- source_word: ἤμην ἐν αὐτῷ
  choice: ich war auf ihm
  rationale: Bei einem Berg bezeichnet ἐν idiomatisch den Aufenthalt auf dem Berg; das Pronomen bewahrt den knappen Anschluss des Ausgangstextes.
theological_decisions:
- issue: Art des Erlebnisses
  choice: Keine ausdrückliche Kennzeichnung als Traum oder Vision
  alternative: „ich hatte eine Vision“ oder „im Traum sah ich“
  rationale: Der Text nennt Schlaf und Sehen, bestimmt das Erlebnis aber nicht ausdrücklich mit einem entsprechenden Substantiv; die offene Darstellung bleibt erhalten.
translation_notes:
  register: Modernes Standarddeutsch in schlichtem, würdigem Erzählstil. Die wiederholte Verbindung mit „und“ folgt dem parataktischen Aufbau des griechischen Textes.
