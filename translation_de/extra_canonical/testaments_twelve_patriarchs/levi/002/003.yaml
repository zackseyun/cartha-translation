id: T12P.LEV.2.3
reference: Testament of Levi 2:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ὡς δὲ ἐποίμαινον¹⁸ ἐν Ἀβελμαούλ¹⁹, πνεῦμα συνέσεως Κυρίου ἦλθεν ἐπʼ ἐμέ²⁰, καὶ *ἐθεώρουν πάντας ἀνθρώπους²¹ *ἀφανίσαντας τὴν ὁδὸν αὐτῶν²², καὶ *ἐπὶ τείχους οἰκοδομεῖτο ἡ ἁμαρτία καὶ ἐπὶ πύργους ἡ ἀδικία ἐκάθητο²³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/002/003.yaml
  text: And as I was shepherding in Abelmaul, a spirit of understanding from the Lord came upon me, and I saw all people destroying their way, and sin was being built upon a wall, and injustice sat upon towers.
translation:
  language: de
  text: Als ich in Abelmaul die Herde hütete, kam ein Geist der Einsicht vom Herrn über mich. Da sah ich, wie alle Menschen ihren Weg zugrunde richteten; die Sünde wurde auf einer Mauer aufgebaut, und das Unrecht saß auf Türmen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίμαινον
  choice: die Herde hütete
  rationale: Gibt das konkrete Hüten als Hirte natürlich wieder; der im Deutschen nötige Bezug auf die Herde ist aus dem Verb erschlossen.
- source_word: πνεῦμα συνέσεως Κυρίου
  choice: ein Geist der Einsicht vom Herrn
  rationale: Bewahrt die unbestimmte Form von πνεῦμα, den Sinn von σύνεσις als Einsicht beziehungsweise Verständnis und die Herkunftsbeziehung des Genitivs Κυρίου.
- source_word: ἐθεώρουν
  choice: sah ich
  rationale: Gibt das visionäre Wahrnehmen klar und ohne unnötige Deutung wieder.
- source_word: ἀφανίσαντας τὴν ὁδὸν αὐτῶν
  choice: ihren Weg zugrunde richteten
  rationale: ἀφανίζω bezeichnet hier stärker als bloßes Verderben ein Zerstören oder Zugrunderichten; die bildhafte Rede vom eigenen Weg bleibt erhalten.
- source_word: ἐπὶ τείχους οἰκοδομεῖτο ἡ ἁμαρτία
  choice: die Sünde wurde auf einer Mauer aufgebaut
  rationale: Bewahrt das ungewöhnliche Passiv und das Bild der auf einer Mauer errichteten Sünde, ohne es allegorisch aufzulösen.
- source_word: ἐπὶ πύργους ἡ ἀδικία ἐκάθητο
  choice: das Unrecht saß auf Türmen
  rationale: Gibt die Personifikation und den Wechsel zum Plural πύργους formal nah wieder.
theological_decisions:
- issue: Identität des Geistes
  choice: ein Geist der Einsicht vom Herrn
  alternative: der Geist der Einsicht des Herrn
  rationale: Der griechische Ausdruck ist ohne Artikel und kann Herkunft oder Zugehörigkeit ausdrücken. Die Übersetzung vermeidet eine vorschnelle Gleichsetzung mit einer fest umrissenen pneumatologischen Bezeichnung.
- issue: Deutung der visionären Bau- und Herrschaftsbilder
  choice: wörtliche Beibehaltung von Mauer und Türmen
  alternative: erklärende Wiedergabe als gesellschaftliche Verfestigung von Sünde und Unrecht
  rationale: Der Text erklärt die Bilder nicht; ihre theologische und symbolische Spannung soll erhalten bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnlichen Bilder und Personifikationen des griechischen Textes bleiben bewusst erhalten; die Syntax wurde nur so weit geglättet, wie es für natürliche deutsche Lesbarkeit nötig ist.
