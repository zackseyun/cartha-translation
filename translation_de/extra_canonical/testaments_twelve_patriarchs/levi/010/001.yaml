  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/001.yaml
  text: And now, children, keep what I command you, since I have declared to you all that I heard from my fathers.
translation:
  language: de
  text: Und nun, meine Kinder, haltet euch an alles, was ich euch gebiete; denn alles, was ich von meinen Vätern gehört habe, habe ich euch verkündet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξατε
  choice: haltet euch an
  rationale: Gibt den Imperativ im Sinn von »beachten/befolgen« in natürlichem modernem Deutsch wieder.
- source_word: ὅσα
  choice: alles, was
  rationale: Bewahrt in beiden Vorkommen den umfassenden Bezug des griechischen Relativpronomens.
- source_word: παρὰ τῶν πατέρων μου
  choice: von meinen Vätern
  rationale: Gibt die Herkunft der überlieferten Weisung formal und ohne zusätzliche Deutung wieder.
- source_word: ἀνήγγειλα
  choice: habe ich euch verkündet
  rationale: Entspricht dem feierlichen Mitteilungscharakter des Verbs und dem würdigen testamentarischen Register.
