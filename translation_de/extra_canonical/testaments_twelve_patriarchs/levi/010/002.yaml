reference: Testament of Levi 10:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: ΓΚαὶ ἰδοὺ⁴⁾ ἀθῷός εἰμι⁵ τῆς⁶ ἀσεβείας⁷ ὑμῶν⁸ *καὶ παραβάσεως⁹ ἣν ποιήσετε ἐπὶ *τῇ συντελείᾳ¹⁰ *τῶν αἰώνων¹¹ [εἰς τὸν σωτῆρα τοῦ κόσμου χριστόν]¹² *πλανῶντες τὸν Ἰσραήλ¹³, καὶ ἐπεγείροντες¹⁴ *ἐπ᾿ αὐτὸν¹⁵ κακὰ μεγάλα¹⁶ *παρὰ Κυρίου¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/002.yaml
  text: And behold, I am innocent of your ungodliness and transgression, which you will commit at the consummation of the ages [against the Savior of the world, the Messiah], misleading Israel and stirring up great evils against him from the Lord.
translation:
  language: de
  text: Und siehe, ich bin unschuldig an eurer Gottlosigkeit und Übertretung, die ihr bei der Vollendung der Zeitalter [gegen den Retter der Welt, den Messias][a] begehen werdet, indem ihr Israel irreführt und große Übel vom Herrn gegen ihn heraufbeschwört.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „gegen den Retter der Welt, den Messias“ sind in der griechischen Textvorlage als textkritisch unsicher gekennzeichnet.
    reason: Die eckigen Klammern der Quelle sollen für Leserinnen und Leser erklärt werden.
  - marker: b
    text: „Gegen ihn“ kann sich grammatisch auf den Retter beziehungsweise Messias oder auf Israel beziehen.
    reason: Die griechische Pronomenreferenz ist mehrdeutig und darf nicht stillschweigend festgelegt werden.
lexical_decisions:
- source_word: ἀθῷός εἰμι
  choice: ich bin unschuldig
  rationale: Gibt die Erklärung persönlicher Schuldlosigkeit direkt und idiomatisch wieder.
- source_word: ἀσεβείας
  choice: Gottlosigkeit
  rationale: Bewahrt den religiös-moralischen Sinn von ἀσέβεια, ohne ihn auf bloße Gesetzlosigkeit zu verengen.
- source_word: παραβάσεως
  choice: Übertretung
  rationale: Entspricht dem Gedanken des Überschreitens einer gesetzten Grenze oder eines Gebots.
- source_word: ἐπὶ τῇ συντελείᾳ τῶν αἰώνων
  choice: bei der Vollendung der Zeitalter
  rationale: Bewahrt die apokalyptische Mehrzahl αἰώνων und die Vorstellung eines abschließenden Zielpunkts.
- source_word: σωτῆρα τοῦ κόσμου χριστόν
  choice: Retter der Welt, den Messias
  rationale: σωτήρ wird natürlich mit „Retter“ wiedergegeben; χριστός bezeichnet hier den messianischen Titel und wird daher als „Messias“ übersetzt.
- source_word: πλανῶντες τὸν Ἰσραήλ
  choice: indem ihr Israel irreführt
  rationale: Gibt das aktive Verleiten oder Fehlleiten Israels wieder und bindet das Partizip verständlich an die angekündigte Übertretung.
- source_word: ἐπεγείροντες … κακὰ μεγάλα
  choice: großes Unheil … heraufbeschwört
  rationale: Eine natürliche deutsche Wiedergabe des Hervorrufens beziehungsweise Aufstachelens schwerer Übel; der kollektive Singular „Unheil“ vermeidet das unidiomatische „große Übel“.
- source_word: παρὰ Κυρίου
  choice: vom Herrn
  rationale: Bewahrt die im Griechischen ausdrücklich genannte Herkunft, ohne die theologische Spannung abzuschwächen.
theological_decisions:
- issue: Textstatus der Wendung εἰς τὸν σωτῆρα τοῦ κόσμου χριστόν
  choice: Die Wendung bleibt in eckigen Klammern im Haupttext.
  alternative: Ohne Klammern in den fortlaufenden Text aufnehmen oder ganz auslassen.
  rationale: Die vorgelegte griechische Quelle kennzeichnet die Worte als textkritisch unsicher; die Übersetzung bewahrt diese Unsicherheit sichtbar.
- issue: Bezug von ἐπ᾿ αὐτόν („gegen ihn“)
  choice: Das Pronomen bleibt unaufgelöst als „gegen ihn“ stehen.
  alternative: Explizit „gegen den Messias“ oder „gegen Israel“ schreiben.
  rationale: Der maskuline Singular kann im gegebenen Satzgefüge auf den Retter/Messias oder auf Israel bezogen werden. Eine ausdrückliche Festlegung würde die echte syntaktische Mehrdeutigkeit beseitigen.
- issue: Das vom Herrn kommende Unheil
  choice: „großes Unheil vom Herrn“ wird ohne erklärende Abschwächung wiedergegeben.
  alternative: Den Herrn nur als Zulassenden darstellen oder die Herkunftsangabe umdeuten.
  rationale: παρὰ Κυρίου bezeichnet die Herkunft vom Herrn; die theologische Spannung soll nicht durch eine interpretierende Ergänzung aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst formeller apokalyptischer Wendung „Vollendung der Zeitalter“. Die Anrede bleibt im Plural. Satzbau und Partizipialbezüge wurden für heutige Lesbarkeit leicht geglättet, während Klammerung, Pronomenmehrdeutigkeit und die Aussage über das vom Herrn kommende Unheil erhalten bleiben.
