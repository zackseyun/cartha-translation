reference: Testament of Levi 10:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ ἀνομήσετε¹⁸ *ἐν τῷ¹⁹ Ἰσραήλ²⁰, ὥστε μὴ βαστάζειν²¹ τὴν²² Ἱερουσαλήμ²³ ἀπὸ προσώπου τῆς²⁴ πονηρίας ὑμῶν, ἀλλὰ σχισθήσεται²⁵ τὸ καταπέτασμα²⁶ τοῦ ναοῦ, ὥστε μὴ καλύψαι²⁷ τὴν²⁸ ἀσχημοσύνην ὑμῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/003.yaml
  text: And you will act lawlessly in Israel, so that Jerusalem will not be able to bear your wickedness; but the veil of the temple will be torn, so as no longer to cover your shame.
translation:
  language: de
  text: Und ihr werdet in Israel gesetzlos handeln, sodass Jerusalem eure Bosheit nicht wird ertragen können. Aber der Vorhang des Tempels wird zerreißen, sodass er eure Schande nicht mehr bedeckt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνομήσετε
  choice: ihr werdet … gesetzlos handeln
  rationale: Gibt das zukünftige, aktive Handeln gegen das Gesetz unmittelbar wieder, ohne es auf eine bestimmte Art von Vergehen einzuengen.
- source_word: βαστάζειν
  choice: ertragen
  rationale: Bewahrt den Sinn von tragen bzw. aushalten und ergibt mit Jerusalem als Subjekt natürliches modernes Deutsch.
- source_word: ἀπὸ προσώπου τῆς πονηρίας ὑμῶν
  choice: eure Bosheit
  rationale: Die Wendung bezeichnet hier den belastenden Anlass; im Deutschen ist die direkte Verbindung mit »ertragen« knapp und sachgerecht.
- source_word: σχισθήσεται
  choice: wird … zerreißen
  rationale: Das griechische Futur Passiv kann beim Vorhang im Deutschen idiomatisch als intransitives »zerreißen« wiedergegeben werden, ohne einen Handelnden zu benennen.
- source_word: καταπέτασμα τοῦ ναοῦ
  choice: Vorhang des Tempels
  rationale: Bezeichnet den kultischen Tempelvorhang; »Vorhang« ist allgemein verständlich und weniger deutend als eine genauere räumliche Festlegung.
- source_word: ἀσχημοσύνην
  choice: Schande
  rationale: Erfasst die beschämende, entehrende Bedeutung im Zusammenhang; eine körperlich-sexuelle Verengung wäre hier nicht zwingend.
theological_decisions:
- issue: Bezug des zerreißenden Tempelvorhangs
  choice: Der Text bleibt als prophetische Aussage ohne ausdrückliche christologische Identifizierung stehen.
  alternative: Explizite Verknüpfung mit dem Zerreißen des Tempelvorhangs beim Tod Jesu.
  rationale: Der griechische Text nennt diese Identifizierung nicht; mögliche intertextuelle Bezüge sollen nicht in die Übersetzung eingetragen werden.
- issue: Handelnder beim Zerreißen
  choice: Kein Handelnder wird benannt.
  alternative: Gott wird als derjenige genannt, der den Vorhang zerreißt.
  rationale: Das Passiv lässt den Handelnden unausgesprochen; diese Offenheit wird bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Orientierung an der griechischen Syntax. Der erste Folgesatz wird mit »sodass« wiedergegeben; »vielmehr« bildet den starken Gegensatz von ἀλλά ab. Keine Fußnoten erforderlich.
