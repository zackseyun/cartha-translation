source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ²⁹ διασπαρήσεσθε³⁰ αἰχμάλωτοι³¹ ἐν³² τοῖς ἔθνεσιν, καὶ ἔσεσθε *εἰς ὄνειδος καὶ εἰς κατάραν ἐκεῖ³³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/004.yaml
  text: And you will be scattered as captives among the nations, and there you will be for a reproach and a curse.
translation:
  language: de
  text: Und ihr werdet als Gefangene unter die Völker zerstreut werden; dort werdet ihr zum Schimpf und zum Fluch werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διασπαρήσεσθε
  choice: ihr werdet … zerstreut werden
  rationale: Gibt das Futur Passiv und das Bild der Zerstreuung unmittelbar wieder.
- source_word: αἰχμάλωτοι
  choice: als Gefangene
  rationale: Bewahrt die prädikative Bedeutung und den Zusammenhang von Verschleppung und Zerstreuung.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: unter die Völker
  rationale: Im Deutschen verbindet sich „zerstreuen“ idiomatisch mit „unter“ plus Akkusativ; „Völker“ lässt die ethnisch-politische Weite von ἔθνη bestehen.
- source_word: εἰς ὄνειδος
  choice: zum Gegenstand des Spottes
  rationale: Drückt aus, dass die Angeredeten anderen zum Anlass des Schmähens und Verachtens werden; bloßes „zur Schande“ könnte stärker ihre eigene Scham bezeichnen.
- source_word: εἰς κατάραν
  choice: zum Fluch
  rationale: Entspricht der Ziel- beziehungsweise Ergebnisformulierung mit εἰς und bewahrt die knappe, harte Aussage.
- source_word: ἐκεῖ
  choice: dort
  rationale: Bezieht die folgende Erniedrigung ausdrücklich auf das Leben unter den Völkern.
theological_decisions:
- issue: Bedeutung von κατάρα
  choice: zum Fluch
  alternative: zum Gegenstand von Verfluchungen
  rationale: Die wörtlichere und bewusst offene Formulierung bewahrt sowohl die Möglichkeit, dass sie verflucht werden, als auch, dass ihr Schicksal sprichwörtlich als Fluch gilt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Zukunftsform und die doppelte Wendung „zum … und zum …“ erhalten Rhythmus und Gerichtston des griechischen Satzes.
