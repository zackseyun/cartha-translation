id: T12P.LEV.10.5
reference: Testament of Levi 10:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Ὁ γὰρ οἶκος, ὃν ἂν³⁴ ἐκλέξεται³⁵ Κύριος³⁶, *Ἱερουσαλὴμ κληθήσεται³⁷, καθὼς *περιέχει ἡ βίβλος³⁸ Ἐνὼχ τοῦ δικαίου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/010/005.yaml
  text: For the house that the Lord will choose shall be called Jerusalem, as the book of Enoch the righteous contains.
translation:
  language: de
  text: Denn das Haus, das der Herr erwählen wird, wird Jerusalem genannt werden, wie es im Buch Henochs, des Gerechten, geschrieben steht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οἶκος
  choice: Haus
  rationale: Gibt die räumliche beziehungsweise kultische Bedeutung des griechischen Ausdrucks wieder, ohne ihn enger als „Tempel“ festzulegen.
- source_word: ἐκλέξεται
  choice: erwählen wird
  rationale: Bewahrt die Zukunftsform und die Vorstellung einer bewussten göttlichen Wahl.
- source_word: κληθήσεται
  choice: wird … genannt werden
  rationale: Entspricht dem griechischen Futur Passiv und bleibt gegenüber einer möglichen Namens- oder Wesensaussage offen.
- source_word: περιέχει
  choice: geschrieben steht
  rationale: Gibt idiomatisch wieder, dass das Buch diese Aussage enthält; ein wörtliches „enthält“ wäre im Deutschen an dieser Stelle schwerfälliger.
- source_word: Ἐνὼχ τοῦ δικαίου
  choice: Henochs, des Gerechten
  rationale: Bewahrt den Genitivbezug zum Buch sowie den ehrenden Beiname im Griechischen.
theological_decisions:
- issue: Bedeutung von οἶκος
  choice: Haus
  alternative: Tempel
  rationale: Der griechische Text sagt allgemein „Haus“. Die Übersetzung vermeidet es, die mögliche kultische Bedeutung ausdrücklich auf den Tempel einzuengen.
- issue: Beziehung von Haus und Jerusalem
  choice: wird Jerusalem genannt werden
  alternative: soll Jerusalem heißen
  rationale: Die gewählte Form gibt das Futur Passiv formal wieder und lässt die im Ausgangstext bestehende Spannung zwischen Bauwerk, Heiligtum und Stadtname bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den griechischen Wortlaut. Die in der Revisionsnotiz erwähnte Wendung „und zum Fluch“ wurde nicht aufgenommen, da καὶ εἰς κατάραν im bereitgestellten griechischen Quelltext dieses Verses nicht enthalten ist.
