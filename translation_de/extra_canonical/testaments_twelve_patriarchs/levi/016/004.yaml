base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/004.yaml
  text: But I tell you that because of him, your holy places will be laid waste to the ground.
translation:
  language: de
  text: 'Doch ich sage euch: Seinetwegen werden eure Heiligtümer bis auf den Grund verwüstet werden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δι᾽ αὐτόν
  choice: seinetwegen
  rationale: Gibt die kausale Bedeutung „wegen ihm“ natürlich und prägnant wieder, ohne die nicht näher bestimmte Bezugsperson zu erklären.
- source_word: τὰ ἅγια ὑμῶν
  choice: eure Heiligtümer
  rationale: Der substantivierte Plural bezeichnet hier am ehesten heilige Stätten bzw. Heiligtümer; „Heiligtümer“ wahrt den Plural und den sakralen Bezug.
- source_word: ἔρημα
  choice: verwüstet
  rationale: Im Zusammenhang mit heiligen Stätten bezeichnet das Prädikatsadjektiv deren Verödung bzw. Verwüstung.
- source_word: ἕως ἐδάφους
  choice: bis auf den Grund
  rationale: Bewahrt das Bild vollständiger Zerstörung bis zum Boden bzw. Grund in idiomatischem Deutsch.
theological_decisions:
- issue: Bezug von αὐτόν („ihm“)
  choice: Das Pronomen bleibt als „ihm“ unaufgelöst.
  alternative: Die im Kontext gemeinte Person ausdrücklich benennen.
  rationale: Der vorgelegte Vers bestimmt den Bezug nicht selbst; eine ausdrückliche Identifizierung würde die genuine Kontextabhängigkeit beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt nach der einleitenden Redeformel sorgt für einen natürlichen Satzfluss; die eindringliche prophetische Aussage bleibt erhalten.
