id: T12P.LEV.16.5
reference: Testament of Levi 16:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ *τόπος ὑμῖν καθαρὸς οὐκ ἔσται³², ἀλλ᾽ ἔσεσθε³³ ἐν τοῖς ἔθνεσιν εἰς κατάραν καὶ *εἰς διασκορπισμόν³⁴, ἕως³⁵ *αὐτὸς πάλιν³⁶ ἐπισκέψηται³⁷ καὶ *οἰκτειρήσῃ καὶ³⁸ προσδέξηται³⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/005.yaml
  text: And no clean place will be for you, but you will be among the nations of the earth for a curse and for scattering, until he himself visits again and shows compassion and receives you.
translation:
  language: de
  text: Und es wird für euch keinen reinen Ort geben; vielmehr werdet ihr unter den Völkern zum Fluch und zur Zerstreuung sein, bis er selbst wieder nach euch sieht, sich erbarmt und euch annimmt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τόπος ὑμῖν καθαρὸς οὐκ ἔσται
  choice: es wird für euch keinen reinen Ort geben
  rationale: Gibt die griechische Existenzkonstruktion eng wieder, ohne das im Ausgangstext nicht ausdrücklich enthaltene „bleiben“ einzuführen.
- source_word: ἐν τοῖς ἔθνεσιν
  choice: unter den Völkern
  rationale: Natürliche und sachlich genaue Wiedergabe; „der Erde“ steht im vorliegenden griechischen Text nicht.
- source_word: εἰς κατάραν καὶ εἰς διασκορπισμόν
  choice: zum Fluch und zur Zerstreuung
  rationale: Bewahrt die parallele Konstruktion und den nominalen, prophetischen Ausdruck des Griechischen.
- source_word: ἐπισκέψηται
  choice: nach euch sieht
  rationale: Drückt hier das fürsorgliche Aufsuchen bzw. Sich-Zuwenden aus und vermeidet das im Deutschen leicht rein förmlich klingende „besucht“.
- source_word: οἰκτειρήσῃ
  choice: sich erbarmt
  rationale: Entspricht dem Sinn von Mitleid und barmherziger Zuwendung.
- source_word: προσδέξηται
  choice: euch annimmt
  rationale: Gibt das wohlwollende Aufnehmen oder Annehmen idiomatisch wieder; das im Verb mitgedachte Objekt wird aus dem Zusammenhang als „euch“ ausgedrückt.
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt der abschließenden Verben
  choice: „er selbst“ kleingeschrieben und ohne ergänzende Identifizierung
  alternative: „Gott selbst“ oder ehrfürchtiges „Er selbst“
  rationale: Das griechische αὐτός betont das Subjekt, nennt es an dieser Stelle jedoch nicht ausdrücklich. Die Übersetzung bewahrt diese Offenheit und vermeidet eine interpretierende Ergänzung.
- issue: Sinn von ἐπισκέψηται
  choice: fürsorgliche Zuwendung durch „nach euch sieht“
  alternative: „euch besucht“ oder „sich euer annimmt“
  rationale: Der Zusammenhang legt heilvolle Zuwendung nahe; zugleich bleibt das folgende Erbarmen und Annehmen als eigene Handlung erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Anschluss an die griechische Syntax. Das semikolonartige Gefälle zwischen Gericht und späterer Zuwendung bleibt erhalten; echte Mehrdeutigkeiten werden nicht durch konfessionelle Zusätze aufgelöst.
