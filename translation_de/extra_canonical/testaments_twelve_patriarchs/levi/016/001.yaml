id: T12P.LEV.16.1
reference: Testament of Levi 16:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ νῦν *ἐγὼ ἔγνωκα¹ ὅτι ἑβδομήκοντα ἑβδομάδας² πλανηθήσεσθε³, καὶ τὴν ἱερωσύνην βεβηλώσετε⁴ καὶ *τὰ θυσιαστήρια⁵ μιανεῖτε⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/001.yaml
  text: And now I know that for seventy weeks you will go astray, and you will profane the priesthood and defile the altars.
translation:
  language: de
  text: Und nun weiß ich, dass ihr siebzig Wochen lang in die Irre geführt werden, das Priestertum entweihen und die Altäre verunreinigen werdet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνωκα
  choice: weiß ich
  rationale: Das griechische Perfekt bezeichnet einen erlangten Erkenntniszustand; im natürlichen modernen Deutsch gibt „weiß ich“ diesen gegenwärtigen Zustand treffend wieder.
- source_word: ἑβδομήκοντα ἑβδομάδας
  choice: siebzig Wochen lang
  rationale: Bewahrt die wörtliche und möglicherweise symbolische Zeitangabe, ohne sie als Jahrwochen auszulegen; „lang“ macht den Akkusativ der Zeitdauer im Deutschen deutlich.
- source_word: πλανηθήσεσθε
  choice: werdet ihr in die Irre gehen
  rationale: Gibt das zukünftige Abirren wieder, ohne unnötig festzulegen, ob eigenes Fehlgehen oder Verführtwerden im Vordergrund steht.
- source_word: βεβηλώσετε
  choice: entweihen
  rationale: Bezeichnet die Profanierung von etwas Heiligem und passt sachlich zum Priestertum.
- source_word: ἱερωσύνην
  choice: Priestertum
  rationale: Kann Amt, Stand oder priesterliche Institution bezeichnen; „Priestertum“ bewahrt diese Breite.
- source_word: θυσιαστήρια
  choice: Altäre
  rationale: Die kultischen Opferstätten werden im Deutschen idiomatisch als „Altäre“ bezeichnet.
- source_word: μιανεῖτε
  choice: verunreinigen
  rationale: Bewahrt den kultisch-religiösen Sinn von Befleckung beziehungsweise Unreinheit.
theological_decisions:
- issue: Deutung der siebzig Wochen
  choice: „siebzig Wochen“ ohne nähere Erklärung
  alternative: „siebzig Jahrwochen“
  rationale: Der griechische Text sagt lediglich ἑβδομάδας. Eine Festlegung auf Jahrwochen würde eine mögliche apokalyptische Deutung in den Haupttext eintragen.
- issue: Stimme von πλανηθήσεσθε
  choice: „in die Irre gehen“
  alternative: „irregeführt werden“
  rationale: Die Form kann passiv oder medial verstanden werden. Die gewählte Formulierung lässt Ursache und Verantwortlichkeit weitgehend offen und folgt dem Zusammenhang des angekündigten eigenen Fehlverhaltens.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drei Zukunftsaussagen sind parallel und klar gebaut; kultische Fachbegriffe bleiben erhalten, ohne konfessionelle Zusätze.
