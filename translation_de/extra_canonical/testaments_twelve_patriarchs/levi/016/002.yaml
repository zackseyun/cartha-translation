  to: Und ihr werdet das Gesetz verwerfen und die Worte der Propheten in böser Verkehrtheit verachten. Ihr werdet gerechte Männer verfolgen und die Gottesfürchtigen hassen; die Worte der Wahrhaftigen werdet ihr verabscheuen.
