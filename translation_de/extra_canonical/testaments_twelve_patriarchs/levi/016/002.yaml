review_pass:
  verdict: revise
  source_fidelity: Die wesentlichen Prädikate und Personengruppen sind zutreffend wiedergegeben. βδελύξεσθε ist jedoch ein aktives Verb („verabscheuen/ekeln vor“); die Formulierung „werden euch ein Gräuel sein“ macht die Worte zum grammatischen Subjekt und schwächt den direkten Vollzug der Abscheu ab. „Verkehrtheit“ entspricht διαστροφή genauer als „Verirrung“.
  naturalness: Der Text ist insgesamt gut verständlich und dem prophetischen Register angemessen. „Die Worte der Wahrhaftigen werden euch ein Gräuel sein“ klingt zudem unnötig umständlich; mit dem aktiven Verb wird der Satz zugleich idiomatischer.
  terminology: „Gesetz“, „Propheten“, „gerechte Männer“ und „Gottesfürchtige“ sind sachgerecht. Der Genitiv ἀληθινῶν bleibt in „Worte der Wahrhaftigen“ als Personenbezug erhalten, entsprechend dem englischen Audit-Trail und ohne weitergehende Deutung.
  issues:
  - severity: medium
    issue: βδελύξεσθε ist nicht als aktives Verb wiedergegeben.
    rationale: Das griechische Prädikat bezeichnet, dass die Angesprochenen die genannten Worte verabscheuen. Die stative deutsche Konstruktion verschiebt die Satzrollen und ist daher weniger quellennah.
  - severity: low
    issue: „Verirrung“ gibt διαστροφή nur angenähert wieder.
    rationale: διαστροφή bezeichnet eher Verkehrtheit beziehungsweise Verdrehung als bloßes Abirren. „Böse Verkehrtheit“ bewahrt die negative, ethische Färbung genauer.
  revised_text: Und ihr werdet das Gesetz verwerfen und die Worte der Propheten in böser Verkehrtheit verachten. Ihr werdet gerechte Männer verfolgen und die Gottesfürchtigen hassen; die Worte der Wahrhaftigen werdet ihr verabscheuen.
