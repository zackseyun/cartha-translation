source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: Καὶ τὸν νόμον ἀθετήσετε⁷ καὶ λόγους προφητῶν ἐξουδενώσετε⁸ *ἐν διαστροφῇ κακῇ⁹. *διώξετε δὲ¹⁰ ἄνδρας¹¹ δικαίους, καὶ εὐσεβεῖς μισήσετε¹², ἀληθινῶν¹³ λόγους βδελύξεσθε¹⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/002.yaml
  text: And you will set aside the law and treat the words of the prophets with contempt in evil perversity. You will persecute righteous men, and you will hate the godly; you will loathe the words of the truthful.
translation:
  language: de
  text: Und ihr werdet das Gesetz verwerfen und die Worte der Propheten in böser Verkehrtheit verachten. Ihr werdet gerechte Männer verfolgen und die Gottesfürchtigen hassen; die Worte der Wahrhaftigen werdet ihr verabscheuen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀθετήσετε
  choice: werdet … verwerfen
  rationale: Gibt das bewusste Außerkraftsetzen beziehungsweise Missachten des Gesetzes kräftig und natürlich wieder.
- source_word: ἐξουδενώσετε
  choice: werdet … verachten
  rationale: Entspricht dem Herabsetzen und Geringschätzen der prophetischen Worte.
- source_word: ἐν διαστροφῇ κακῇ
  choice: in böser Verirrung
  rationale: Bewahrt die moralische Wertung von κακῇ und die Vorstellung einer verdrehten, vom rechten Weg abweichenden Haltung.
- source_word: διώξετε
  choice: werdet … verfolgen
  rationale: Die geläufige und kontextgerechte Wiedergabe feindseliger Verfolgung.
- source_word: εὐσεβεῖς
  choice: die Gottesfürchtigen
  rationale: Bezeichnet Menschen, deren Haltung von Ehrfurcht und Frömmigkeit gegenüber Gott geprägt ist.
- source_word: ἀληθινῶν
  choice: der Wahrhaftigen
  rationale: Bewahrt den substantivisch verstandenen Personenbezug des Genitivs und damit die Aussage über die Worte wahrhaftiger Menschen.
- source_word: βδελύξεσθε
  choice: werden euch ein Gräuel sein
  rationale: Gibt die starke Abscheu des griechischen Verbs in würdigem, verständlichem Deutsch wieder.
theological_decisions:
- issue: Bezug von ἀληθινῶν
  choice: 'als substantivisches Personenattribut: „der Wahrhaftigen“'
  alternative: 'adjektivischer Bezug auf λόγους: „wahre Worte“'
  rationale: Die Wortstellung und Genitivform lassen am ehesten an die Worte wahrhaftiger Menschen denken; die mögliche syntaktische Spannung wird nicht durch eine theologische Präzisierung erweitert.
- issue: Bedeutung von εὐσεβεῖς
  choice: „die Gottesfürchtigen“
  alternative: „die Frommen“
  rationale: „Gottesfürchtig“ macht den Gottesbezug des Ausdrucks deutlich, ohne eine konfessionell bestimmte Frömmigkeitsform einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit prophetischem Zukunftston. Die parallelen Anklagen bleiben klar erkennbar; das starke βδελύξεσθε wird idiomatisch, aber nicht abgeschwächt wiedergegeben.
