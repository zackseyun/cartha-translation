source:
  edition: Charles 1908 Greek Versions (Levi source-fix v2)
  text: '[Καὶ ἄνδρα καινοποιοῦντα¹⁵ νόμον *ἐν δυνάμει ὑψίστου¹⁶ πλάνου¹⁷ προσαγορεύσετε, καὶ τέλος †ὁρμήσετε τοῦ ἀποκτεῖναι¹⁸ αὐτόν, οὐκ εἰδότες¹⁹ αὐτοῦ τὸ ἀνάστημα†²⁰, τὸ²¹ ἀθῷον αἷμα²² *ἐν κακίᾳ²³ ἐπὶ τῆς²⁴ κεφαλῆς²⁵ ὑμῶν ἀναδεχόμενοι²⁶.]'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/016/003.yaml
  text: '[And a man who renews the law in the power of the Most High you will call a deceiver, and at last you will rush to kill him, not knowing his rising, taking innocent blood in wickedness upon your heads.]'
translation:
  language: de
  text: '[Und einen Mann, der das Gesetz erneuert und in der Kraft des Höchsten wirkt, werdet ihr einen Verführer nennen; und schließlich werdet ihr losstürmen, um ihn zu töten, ohne seine Größe[a] zu erkennen, und so in Bosheit unschuldiges Blut auf eure Häupter laden.]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: seine Gestalt, seinen Rang oder seine Bedeutung. Das griechische Wort bezeichnet wörtlich unter anderem Größe bzw. Körpergröße und kann übertragen verstanden werden.'
    reason: Die Bedeutung von ἀνάστημα ist im Kontext umstritten und darf nicht stillschweigend christologisch oder rein körperlich festgelegt werden.
lexical_decisions:
- source_word: καινοποιοῦντα νόμον
  choice: der das Gesetz neu macht
  rationale: Gibt das Partizip καινοποιοῦντα formal und ohne vorschnelle Deutung wieder; sowohl Erneuerung als auch Neuerung bleibt anklingend.
- source_word: ἐν δυνάμει ὑψίστου
  choice: der in der Kraft des Höchsten wirkt
  rationale: Bezieht die Präpositionalphrase natürlich auf den Mann bzw. sein Handeln; die griechische Stellung ist schwierig, daher wird keine ungewöhnliche Verbindung mit »Verführer« erzwungen.
- source_word: πλάνου
  choice: Verführer
  rationale: Bezeichnet hier jemanden, der andere irreführt; »Betrüger« wäre stärker auf bewusste Täuschung festgelegt.
- source_word: τέλος ὁρμήσετε τοῦ ἀποκτεῖναι αὐτόν
  choice: schließlich werdet ihr darauf losstürmen, ihn zu töten
  rationale: Bewahrt sowohl den zeitlich/resultativen Sinn von τέλος als auch die heftige Bewegung von ὁρμάω.
- source_word: ἀνάστημα
  choice: Größe
  rationale: Das Wort kann Körpergröße, Gestalt oder übertragen Rang/Bedeutung bezeichnen; »Größe« erhält diese Mehrdeutigkeit besser als eine eindeutige Auslegung.
- source_word: τὸ ἀθῷον αἷμα ... ἐπὶ τῆς κεφαλῆς ὑμῶν ἀναδεχόμενοι
  choice: unschuldiges Blut auf eure Häupter laden
  rationale: Bewahrt die Verantwortungsmetapher und den feierlich-biblischen Plural »Häupter«.
theological_decisions:
- issue: Bezug von ἐν δυνάμει ὑψίστου
  choice: auf den Mann und sein Wirken bezogen
  alternative: »einen Verführer in der Kraft des Höchsten«
  rationale: Die alternative unmittelbare Zuordnung zu πλάνου wäre syntaktisch möglich, semantisch aber sehr sperrig. Die gewählte Fassung folgt dem wahrscheinlichsten Sinn, ohne eine bestimmte christologische Identifikation einzuführen.
- issue: Bedeutung von ἀνάστημα
  choice: »Größe« mit Fußnote
  alternative: »Auferstehung«, »Gestalt«, »Rang« oder »Körpergröße«
  rationale: Eine Deutung als Auferstehung wäre theologisch stark, ist aber lexikalisch nicht die gewöhnliche Bedeutung. Die offene Wiedergabe erhält die Spannung des Textes.
- issue: Wertung des neuen Gesetzeshandelns
  choice: neutral »das Gesetz neu macht«
  alternative: »das Gesetz erneuert« oder »ein neues Gesetz schafft«
  rationale: Die Übersetzung entscheidet nicht, ob das Handeln Wiederherstellung oder Neuerung bedeutet.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst biblischem Klang in »auf eure Häupter laden«. Die eckigen Klammern des überlieferten griechischen Abschnitts wurden beibehalten. Der Satzbau wurde leicht gegliedert, damit die schwierige griechische Folge verständlich bleibt, ohne ihre Mehrdeutigkeiten unnötig einzuebnen.
