base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/015.yaml
  text: Therefore the temple which the Lord will choose will become desolate in your uncleanness[a], and you will be taken captive among all the nations. And you will be an abomination to them, and you will receive reproach and everlasting shame from the righteous judgment of God. And all who hate you will rejoice over your destruction. And if it were not for Abraham and Isaac and Jacob our fathers, you would receive no mercy[b][c]; not one from your seed would be left upon the earth.
translation:
  language: de
  text: '**Testament Levis 15**


    **1** Darum wird der Tempel[a], den der Herr erwählen wird, in eurer Unreinheit verödet sein[b], und ihr werdet unter alle Völker in Gefangenschaft geführt werden. **2** Ihr werdet ihnen ein Gräuel sein und durch Gottes gerechtes Urteil[c] Schmach und ewige Schande erfahren. **3** Alle, die euch hassen, werden sich über euren Untergang freuen. **4** Und wenn ihr nicht um Abrahams, Isaaks und Jakobs, unserer Väter, willen Erbarmen empfangt, wird kein Einziger von euren Nachkommen[d] auf der Erde übrig bleiben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Heiligtum“. Das griechische ναός bezeichnet besonders den heiligen Tempel beziehungsweise dessen inneres Heiligtum.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Präposition kann auch einen ursächlichen Zusammenhang nahelegen: „infolge eurer Unreinheit“.'
    reason: source_ambiguity
  - marker: c
    text: 'Oder: „Gottes gerechtes Gericht“. Das griechische Wort betont, dass Gottes Richten gerecht ist.'
    reason: lexical_alternative
  - marker: d
    text: 'Wörtlich: „von eurem Samen“. „Same“ ist im Griechischen ein Abstammungs- und Bundesbegriff für die Nachkommenschaft.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ναός
  choice: Tempel
  rationale: Ναός bezeichnet hier den von Gott erwählten heiligen Tempel. „Tempel“ ist im Deutschen natürlich und wahrt den Bezug auf das zentrale Heiligtum.
- source_word: ἐκλέξεται
  choice: erwählen wird
  rationale: „Erwählen“ bewahrt den feierlichen und bundestheologischen Klang des göttlichen Wählens, ohne unverständlich zu wirken.
- source_word: ἔρημος ἔσται
  choice: verödet sein
  rationale: Die Wendung bezeichnet einen Zustand der Verwüstung und Verlassenheit. „Verödet sein“ gibt diesen prophetischen Gerichtston prägnant wieder.
- source_word: ἐν τῇ ἀκαθαρσίᾳ ὑμῶν
  choice: infolge eurer Unreinheit
  rationale: Ἐν kann hier den begleitenden Zustand oder den ursächlichen Zusammenhang anzeigen. Im Kontext der Tempelentweihung macht „infolge“ den naheliegenden Zusammenhang in natürlichem Deutsch deutlich; die mögliche wörtlichere Fassung wird in einer Fußnote offengehalten.
- source_word: αἰχμάλωτοι ἔσεσθε εἰς πάντα τὰ ἔθνη
  choice: ihr werdet unter alle Völker in Gefangenschaft geführt werden
  rationale: Die Formulierung wahrt das passive Erleiden der Gefangenschaft sowie die Zerstreuung unter sämtliche Völker.
- source_word: βδέλυγμα
  choice: Gräuel
  rationale: „Gräuel“ erhält die starke kultische und moralische Wertung des griechischen Ausdrucks und passt zum biblisch-prophetischen Register.
- source_word: ὄνειδος
  choice: Schmach
  rationale: „Schmach“ ist eine natürliche, feierliche Entsprechung für öffentliche Entehrung und verbindet sich idiomatisch mit „ewiger Schande“.
- source_word: αἰσχύνην αἰώνιον
  choice: ewige Schande
  rationale: Die Wiedergabe bewahrt die ausdrückliche Dauer und den schweren Gerichtston, ohne eine über den Text hinausgehende eschatologische Systematik einzutragen.
- source_word: δικαιοκρισίας
  choice: gerechtes Urteil
  rationale: Das Kompositum bezeichnet ein von Gerechtigkeit bestimmtes Richten. „Gerechtes Urteil“ ist klarer als „Gerechtigkeitsgericht“ und bewahrt die Aussage des Wortes.
- source_word: ἀπωλείᾳ
  choice: Untergang
  rationale: Im Zusammenhang bezeichnet das Wort den vernichtenden Zusammenbruch des angesprochenen Volkes. „Untergang“ ist stark, aber legt nicht ohne Weiteres eine spätere Lehre von Verdammnis in den Text hinein.
- source_word: δι᾽ Ἀβραὰμ καὶ Ἰσαὰκ καὶ Ἰακώβ
  choice: um Abrahams, Isaaks und Jakobs willen
  rationale: Διά mit Akkusativ bezeichnet hier den Grund, dessentwegen Erbarmen gewährt wird. Die deutsche Wendung bewahrt diese patriarchale beziehungsweise bundestheologische Begründung, ohne eine bestimmte Theorie der Fürsprache festzulegen.
- source_word: ἔλεος λήψεσθε
  choice: Erbarmen empfangt
  rationale: Die Übersetzung erhält Erbarmen als empfangene Gabe. Die griechische Zukunftsform steht in einem real formulierten Bedingungssatz und wird daher nicht unnötig in einen irrealen Konjunktiv umgedeutet.
- source_word: σπέρματος
  choice: Nachkommen
  rationale: Wörtlich bedeutet das Wort „Same“, bezeichnet hier aber die leibliche Abstammungslinie. „Nachkommen“ ist modernes, verständliches Deutsch; die wörtliche Bundes- und Abstammungsmetapher wird in der Fußnote genannt.
- source_word: οὐ μὴ καταλειφθῇ
  choice: wird kein Einziger ... übrig bleiben
  rationale: „Kein Einziger“ bringt die nachdrückliche griechische Verneinung οὐ μή idiomatisch und unmissverständlich zum Ausdruck.
theological_decisions:
- issue: Die Patriarchen als Grund des Erbarmens
  choice: Das Erbarmen wird ausdrücklich „um Abrahams, Isaaks und Jakobs willen“ in Aussicht gestellt.
  alternative: Die Patriarchen lediglich als Vorbilder des Glaubens zu verstehen oder ihren Zusammenhang mit dem Erbarmen abzuschwächen.
  rationale: Der griechische Text verbindet das mögliche Erbarmen unmittelbar durch διά mit den drei Vätern. Die Übersetzung wahrt diese bundestheologische Spannung, ohne näher festzulegen, ob Fürsprache, Verheißung oder ein anderer Aspekt im Vordergrund steht.
- issue: Logische Form des Bedingungssatzes in Vers 4
  choice: „Wenn ihr nicht ... Erbarmen empfangt, wird kein Einziger ... übrig bleiben.“
  alternative: „Wenn es nicht um ... willen wäre, würdet ihr kein Erbarmen empfangen“ als ausdrücklich irrealer Bedingungssatz.
  rationale: Der erhaltene griechische Wortlaut verwendet die Zukunft λήψεσθε und verbindet das Ausbleiben des Erbarmens mit dem völligen Aussterben. Die gewählte Fassung folgt dieser Form, statt die Aussage stillschweigend als kontrafaktische Zusicherung zu formulieren.
- issue: Reichweite der „ewigen Schande“
  choice: Die zeitlich starke Wendung „ewige Schande“ bleibt ohne weitere dogmatische Ausdeutung stehen.
  alternative: Die Aussage entweder auf bloß vorübergehende historische Schande zu begrenzen oder ausdrücklich als voll entwickelte Lehre ewiger Verdammnis auszulegen.
  rationale: Αἰώνιον bezeichnet eine dauerhafte beziehungsweise ewige Schande; der unmittelbare Text bestimmt jedoch keine weitergehende eschatologische Systematik.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, prophetischem Ton. Begriffe wie „Gräuel“, „Schmach“ und „Erbarmen“ erhalten die biblische Klangfarbe, bleiben aber allgemein verständlich. Die Satzstruktur wurde für heutige Leser geglättet, ohne die scharfe Gerichtsaussage, die Bedingungslogik oder die patriarchale Begründung des Erbarmens abzuschwächen.
