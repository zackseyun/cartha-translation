  source_fidelity: 'Eine sichere Korrektur ist in Vers 2 nötig: ἔσται bedeutet „wird/shall be“ und nicht „wird ... genannt werden“. Der Beiname der Stadt ist bereits durch ἡ Σύκημα λεγομένη πόλις („die Stadt namens Sychema“) ausgedrückt. In Vers 3 gibt „befleckten“ μιάναντες genauer wieder als „entehrten“, da die moralisch-religiöse Verunreinigung gewahrt bleibt.'
  naturalness: Der Text ist insgesamt verständlich und hat einen angemessen würdevollen, modernen biblischen Ton. „Eine Stadt von Unverständigen“ ist möglich, aber „eine Stadt der Unverständigen“ klingt in diesem prädikativen Zusammenhang etwas natürlicher. Die vorsichtige Auflösung des elliptischen ἀπάραντες mit Dina als Referentin bleibt durch die Fußnote transparent.
  terminology: „Herr“, „Kanaaniter“, „Nachkommen“, „Torheit“, „Sichem“ und „Bethel“ sind passend. Die Fußnote zu Sichem soll die griechische Form als Namensform des Textzeugen bezeichnen, nicht als abweichende Ortsidentifikation.
  issues:
