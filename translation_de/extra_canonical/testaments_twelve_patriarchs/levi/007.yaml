- from: '7 Und ich sagte zu meinem Vater Jakob: „Durch dich wird der Herr die Kanaaniter zunichtemachen, und er wird ihr Land dir und deinen Nachkommen nach dir geben. 2 Denn von heute an soll die Stadt, die Sichem[a] heißt, eine Stadt von Unverständigen genannt werden; denn wie man einen Toren verspottet, so haben wir sie verspottet. 3 Sie haben ja auch eine Torheit in Israel begangen, indem sie meine Schwester entehrten. 4 Dann nahmen wir sie mit uns[b] und kamen nach Bethel.“'
  to: '7 Und ich sagte zu meinem Vater Jakob: „Durch dich wird der Herr die Kanaaniter zunichtemachen, und er wird ihr Land dir und deinen Nachkommen nach dir geben. 2 Denn von heute an wird die Stadt, die Sichem[a] heißt, eine Stadt der Unverständigen sein; denn wie man einen Toren verspottet, so haben wir sie verspottet. 3 Denn sie haben in Israel eine Torheit begangen, indem sie meine Schwester befleckten. 4 Dann nahmen wir sie mit uns[b] und kamen nach Bethel.“'
  rationale: Die Revision trennt die im Griechischen unterschiedliche Aussage „die Stadt namens Sychema“ von der Vorhersage, dass sie „eine Stadt der Unverständigen sein wird“. Außerdem wird die religiös-moralische Nuance von μιάναντες mit „befleckten“ wiedergegeben. Die textlich nicht völlig eindeutige Bewegungsformulierung in Vers 4 bleibt als vorsichtige Lesart mit erläuternder Fußnote erhalten.
