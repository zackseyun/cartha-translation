    issue: Vers 2 übersetzt ἔσται als „soll ... genannt werden“.
    rationale: Das Prädikat besagt, dass die Stadt eine Stadt der Unverständigen sein wird. „Genannt“ ist im griechischen Text schon auf die Ortsbezeichnung Σύκημα bezogen (λεγομένη), nicht auf die Charakterisierung πόλις ἀσυνέτων.
  - severity: medium
    issue: „entehrten“ schwächt μιάναντες ab.
    rationale: μιάναντες bezeichnet Befleckung bzw. Verunreinigung. „Befleckten“ bewahrt den moralisch-religiösen Charakter, ohne die knappe Aussage weiter auszumalen.
