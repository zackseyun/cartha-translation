  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/levi/007.yaml
  text: And I said to my father Jacob[a], “In you the Lord will bring the Canaanites to nothing, and he will give their land to you and to your seed after you. For from this day the city called Sychem shall be a city of fools. For just as one mocks a fool, so we mocked them, because they indeed committed folly in Israel by defiling my sister. Then, after taking her up[b], we came to Bethel.”
translation:
  language: de
  text: '7 Und ich sagte zu meinem Vater Jakob: „Durch dich wird der Herr die Kanaaniter zunichtemachen, und er wird ihr Land dir und deinen Nachkommen nach dir geben. 2 Denn von heute an wird die Stadt, die Sichem[a] heißt, eine Stadt der Unverständigen sein; denn wie man einen Toren verspottet, so haben wir sie verspottet. 3 Denn sie haben in Israel eine Torheit begangen, indem sie meine Schwester befleckten. 4 Dann nahmen wir sie mit uns[b] und kamen nach Bethel.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Namensform lautet Sychema; gemeint ist der Ort, der in deutschen Bibeln gewöhnlich Sichem heißt.
    reason: lexical_alternative
  - marker: b
    text: 'Oder: „Dann nahmen wir sie von dort weg“. Das griechische Partizip kann Aufbruch oder Wegnahme ausdrücken; vermutlich ist gemeint, dass sie Dina mitnahmen, bevor sie nach Bethel zogen.'
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: ἐξουδενώσει
  choice: wird … zunichtemachen
  rationale: Gibt im Eroberungszusammenhang die entschiedene Erniedrigung beziehungsweise das Zunichtemachen wieder, ohne den Sinn auf bloße Verachtung zu verengen.
- source_word: σπέρματί
  choice: Nachkommen
  rationale: Im heutigen Deutsch natürlich und eindeutig; die patriarchale Verheißung von Land und Nachkommenschaft bleibt erhalten, ohne das missverständliche wörtliche „Samen“ zu verwenden.
- source_word: ἀσυνέτων
  choice: von Unverständigen
  rationale: Bewahrt den Bezug auf fehlende Einsicht und unterscheidet den Ausdruck vom folgenden μωρόν („Toren“), sodass die Variation des Griechischen sichtbar bleibt.
- source_word: χλευάσει / ἐχλευάσαμεν
  choice: verspottet / haben wir … verspottet
  rationale: Bewahrt die bewusste lexikalische Wiederholung in Vergleich und Hauptaussage.
- source_word: ἀφροσύνην
  choice: eine Torheit
  rationale: Trifft die moralische Wertung des griechischen Ausdrucks und passt zur biblisch geprägten Wendung „Torheit in Israel“.
- source_word: μιάναντες
  choice: indem sie … entehrten
  rationale: Drückt die moralische Befleckung der Schwester in natürlichem Deutsch aus. „Schändeten“ wäre sexuell expliziter und stärker interpretierend; „verunreinigten“ klänge bei einer Person unnatürlich ritualistisch.
- source_word: Ἀπάραντες
  choice: Dann nahmen wir sie mit uns
  rationale: Der absolute Gebrauch verlangt eine aus dem Zusammenhang erschlossene Ergänzung. Dina ist die nächstliegende Referentin; die Fußnote hält die Bewegungsnuance und Unsicherheit fest.
- source_word: Σύκημα
  choice: Sichem
  rationale: Verwendet die im Deutschen vertraute biblische Namensform; die griechische Form des Textzeugen wird in der Fußnote angegeben.
- source_word: Βεθήλ
  choice: Bethel
  rationale: Entspricht der etablierten deutschen Form des Ortsnamens.
theological_decisions:
- issue: Verheißung von Land und Nachkommenschaft
  choice: Die Aussage bleibt als ausdrückliches Handeln des Herrn und als Gabe des Landes an Jakob und seine Nachkommen formuliert.
  alternative: Die Stelle als allgemeinere Vorhersage eines Sieges wiederzugeben oder σπέρμα wörtlich mit „Samen“ zu übersetzen.
  rationale: So bleibt die patriarchale Verheißungsstruktur erhalten, während die Sprache für heutige Leser natürlich bleibt.
- issue: Moralische Bezeichnung der Tat an Dina
  choice: ἀφροσύνη wird mit „Torheit“ und μιάναντες mit „entehrten“ wiedergegeben.
  alternative: „Frevel/Schandtat“ und „schändeten“ oder ritualsprachlich „verunreinigten“.
  rationale: Die Übersetzung wahrt die moralisch-religiöse Wertung, ohne den knappen griechischen Wortlaut sexuell weiter auszudeuten oder ausschließlich ritualistisch festzulegen.
- issue: Levis positive Deutung der Gewalttat gegen Sichem
  choice: Die harte Selbstaussage „so haben wir sie verspottet“ und die angekündigte Vernichtung der Kanaaniter bleiben ungemildert stehen.
  alternative: Die Aussagen moralisch zu distanzieren oder als bloße Niederlage der Stadt abzuschwächen.
  rationale: Der Text legt Levi diese Deutung in den Mund. Eine Übersetzung soll die daraus entstehende theologische und ethische Spannung nicht stillschweigend auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit moderat biblischem Klang. Die Verszählung ist sichtbar gemacht. „Nachkommen“ dient der Verständlichkeit, während „Torheit in Israel“ die prägnante ethisch-biblische Ausdrucksweise wahrt.
