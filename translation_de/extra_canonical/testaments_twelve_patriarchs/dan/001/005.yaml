  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/005.yaml
  text: And I rejoiced over his being sold, because his father loved him more than us.
translation:
  language: de
  text: Und wir freuten uns über seinen Verkauf, weil der Vater ihn mehr liebte als uns.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔχαιρον ἐπὶ τῇ πράσει αὐτοῦ
  choice: ich freute mich darüber, dass er verkauft wurde
  rationale: Gibt die Freude über den Verkauf idiomatisch und zugleich eng am griechischen Sinn wieder; πράσις bezeichnet hier den Verkauf.
- source_word: ὁ πατήρ
  choice: der Vater
  rationale: Bewahrt den bestimmten Artikel des griechischen Textes. Im Zusammenhang ist der gemeinsame Vater gemeint.
- source_word: ὑπὲρ ἡμᾶς ... ἠγάπα
  choice: ihn mehr liebte als uns
  rationale: ὑπέρ mit Akkusativ drückt hier den Vergleich aus; die deutsche Formulierung bildet ihn natürlich ab.
theological_decisions:
- issue: Grund für Dans Freude über Josefs Verkauf
  choice: Die Aussage bleibt als unverhülltes Eingeständnis von Eifersucht und Schadenfreude stehen.
  alternative: Die Motivation abzumildern oder erklärend als bloße Reaktion auf Bevorzugung darzustellen.
  rationale: Der griechische Text formuliert den kausalen Zusammenhang unmittelbar und ohne moralische Entschuldigung.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem, schlichtem Erzählton. Das imperfektische ἔχαιρον und ἠγάπα wird im Deutschen natürlich mit Präteritum wiedergegeben.
