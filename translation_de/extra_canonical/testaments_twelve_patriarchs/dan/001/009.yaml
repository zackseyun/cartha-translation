source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: ᾿Αλλ᾿ ὁ Θεὸς *τῶν πατέρων⁵³ μου οὐκ εἴασεν αὐτὸν ἐμπεσεῖν εἰς τὰς χεῖράς μου, ἵνα κατὰ μόνας εὑρὼν αὐτὸν ἀνελῶ, καὶ ποιήσω⁶¹ λυθῆναι σκῆπτρον δεύτερον τῷ Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/009.yaml
  text: But the God of my fathers did not allow him to fall into my hands, so that I might find him alone and kill him, and bring about the loosing of a second tribe from Israel.”
translation:
  language: de
  text: Aber der Gott meiner Väter ließ nicht zu, dass er mir in die Hände fiel und ich ihn allein antraf, tötete und bewirkte, dass für Israel ein zweites Zepter aufgelöst würde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „dass für Israel ein zweites Zepter aufgelöst würde“. „Zepter“ kann hier metonymisch für einen Stamm oder dessen Herrschaft stehen; die genaue Bedeutung der Wendung ist unsicher.'
    reason: Bewahrt die Bildsprache von σκῆπτρον und die Offenheit von λυθῆναι, ohne die mögliche Bezugnahme auf einen Stamm zu verschweigen.
lexical_decisions:
- source_word: ὁ Θεὸς τῶν πατέρων μου
  choice: der Gott meiner Väter
  rationale: Nahe, natürliche Wiedergabe der griechischen Wendung; der überlieferungsgeschichtliche Bezug auf die Vorfahren bleibt erhalten.
- source_word: οὐκ εἴασεν αὐτὸν ἐμπεσεῖν εἰς τὰς χεῖράς μου
  choice: ließ nicht zu, dass er mir in die Hände fiel
  rationale: Gibt sowohl das verwehrende οὐκ εἴασεν als auch das Bild des Fallens in Dans Gewalt wieder.
- source_word: κατὰ μόνας εὑρὼν αὐτόν
  choice: ich ihn allein antraf
  rationale: κατὰ μόνας bezeichnet eine Situation ohne andere Anwesende; „allein antreffen“ ist im Deutschen idiomatisch.
- source_word: ἀνελῶ
  choice: tötete
  rationale: Das Verb bedeutet in diesem Zusammenhang „töten/umbringen“; die schlichte Form bewahrt den ernsten, würdevollen Ton.
- source_word: ποιήσω λυθῆναι
  choice: dadurch bewirkte, dass … ausgelöscht wurde
  rationale: Bildet die kausative Konstruktion „bewirken, dass etwas aufgelöst/vernichtet wird“ verständlich ab.
- source_word: σκῆπτρον δεύτερον τῷ Ἰσραήλ
  choice: ein zweiter Stamm Israels
  rationale: σκῆπτρον heißt wörtlich „Zepter“, kann aber metonymisch einen durch sein Zepter bezeichneten Stamm meinen. Der Kontext verlangt hier die verständliche Wiedergabe „Stamm“.
theological_decisions:
- issue: Verhinderung der Tötung und ihrer gemeinschaftlichen Folge
  choice: Die gesamte Folge — Auslieferung, Begegnung ohne Zeugen, Tötung und Auslöschung eines weiteren Stammes — steht unter Gottes verhinderndem Handeln.
  alternative: Den ἵνα-Satz als eigenständige göttliche Absicht oder nur auf die Tötung bezogen wiederzugeben.
  rationale: Die griechische Syntax verbindet die möglichen Folgewirkungen mit οὐκ εἴασεν. Die deutsche Koordination mit wiederholtem „und“ hält diese Verbindung offen, ohne ein zusätzliches Motiv Gottes einzutragen.
- issue: Bedeutung von λυθῆναι
  choice: ausgelöscht wurde
  alternative: aufgelöst bzw. losgelöst wurde
  rationale: Im Zusammenhang mit der Tötung eines Stammvaters bezeichnet das Passiv wahrscheinlich den Untergang eines Stammes. Eine Fußnote hält die wörtlichere und semantisch offenere Lesart sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die lange Satzfolge spiegelt den engen griechischen Gedankengang, wird aber durch klare deutsche Koordination lesbar gehalten.
