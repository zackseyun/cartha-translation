base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/006.yaml
  text: For the spirit of jealousy and arrogance kept saying to me, ‘You yourself also are his son.’
translation:
  language: de
  text: 'Denn der Geist der Eifersucht und des Hochmuts sagte immer wieder zu mir: »Du selbst bist doch auch sein Sohn.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πνεῦμα
  choice: Geist
  rationale: Bewahrt die mögliche Bedeutung eines wirkenden Geistes ebenso wie die personifizierte innere Haltung, ohne die Mehrdeutigkeit aufzulösen.
- source_word: ζήλου
  choice: Eifersucht
  rationale: Im Zusammenhang bezeichnet ζῆλος feindselige Eifersucht beziehungsweise Rivalität; „Eifer“ wäre hier missverständlich positiv.
- source_word: ἀλαζονείας
  choice: Hochmut
  rationale: Gibt die überhebliche, anmaßende Haltung des griechischen Begriffs in würdigem und geläufigem Deutsch wieder.
- source_word: ἔλεγέ μοι
  choice: sagte immer wieder zu mir
  rationale: Das Imperfekt bezeichnet ein fortdauerndes oder wiederholtes Einreden.
- source_word: Καίγε σὺ αὐτός
  choice: Du selbst bist doch auch
  rationale: „selbst“ bildet αὐτός ab, „auch“ gibt καί wieder und „doch“ vermittelt die verstärkende beziehungsweise nachdrückliche Funktion von γε.
theological_decisions:
- issue: Wesen des „Geistes“
  choice: Die Formulierung „Geist der Eifersucht und des Hochmuts“ wird wörtlich beibehalten.
  alternative: „Eifersucht und Hochmut redeten mir ein“ oder ausdrücklich „ein böser Geist“
  rationale: Der griechische Text lässt offen, ob ein personaler Geist oder eine personifizierte innere Macht gemeint ist; die Übersetzung soll diese Spannung nicht entscheiden.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung im Imperfekt wird idiomatisch durch „immer wieder“ ausgedrückt; die direkte Rede bleibt nachdrücklich, ohne altertümlich zu wirken.
