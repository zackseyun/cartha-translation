id: T12P.DAN.1.8
reference: Testament of Dan 1:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Τοῦτο δὲ ἦν τὸ πνεῦμα τοῦ θυμοῦ τὸ πεῖθόν με⁴⁹· ὥσπερ⁵⁰ πάρδαλις †ἐκμύζουσα⁵¹ ἔριφον, ἵνα οὕτως *⌜ἐμοὶ ἐνέβαλεν⌝ †ἐκμυζῆσαι⁵² τὸν Ἰωσήφ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/008.yaml
  text: This was the spirit of anger persuading me, that just as a leopard sucks out a young goat, so it put into me to suck out Joseph.
translation:
  language: de
  text: 'Das war der Geist des Zorns, der mich überredete: Wie ein Leopard ein Ziegenjunges aussaugt, so gab er mir ein, Josef auszusaugen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Wortlaut ist an dieser Stelle textkritisch unsicher; wörtlich steht zweimal „aussaugen“. Gemeint ist im Bild offenbar ein tödlicher Angriff, doch die ungewöhnliche Formulierung bleibt bewusst erhalten.
    reason: Die Editionszeichen weisen auf unsichere beziehungsweise verderbte Lesarten bei der Vergleichs- und Folgekonstruktion hin; die Fußnote macht dies transparent, ohne die Metapher stillschweigend umzudeuten.
lexical_decisions:
- source_word: τὸ πνεῦμα τοῦ θυμοῦ
  choice: der Geist des Zorns
  rationale: Bewahrt die personifizierende beziehungsweise geistwesenhafte Ausdrucksweise des griechischen Textes, ohne sie näher zu bestimmen.
- source_word: τὸ πεῖθόν με
  choice: der mich überredete
  rationale: Gibt das durative Partizip von πείθω direkt und in natürlichem Deutsch wieder.
- source_word: πάρδαλις
  choice: Leopard
  rationale: Die übliche moderne Entsprechung für das bezeichnete Raubtier.
- source_word: ἔριφον
  choice: Ziegenjunges
  rationale: Bezeichnet ein junges Tier der Ziege; die Formulierung ist verständlich und vermeidet die mögliche Verwechslung von „Böckchen“ mit einer ausschließlich männlichen Bedeutung.
- source_word: ἐκμύζουσα / ἐκμυζῆσαι
  choice: aussaugt / auszusaugen
  rationale: Erhält die auffällige, im überlieferten griechischen Wortlaut zweimal verwendete Saug-Metaphorik statt sie zu „vernichten“ oder „zerfleischen“ zu glätten.
- source_word: ἐμοὶ ἐνέβαλεν
  choice: gab er mir ein
  rationale: Natürliches deutsches Idiom für das Hineinlegen eines Gedankens oder Antriebs; lässt den Geist des Zorns als naheliegendes Subjekt bestehen.
- source_word: τὸν Ἰωσήφ
  choice: Josef
  rationale: Verwendet die etablierte moderne deutsche Namensform.
theological_decisions:
- issue: Wesen und Wirken des „Geistes des Zorns“
  choice: 'Die personale Handlungsweise bleibt erhalten: Er überredet und gibt etwas ein.'
  alternative: „Mein Zorn brachte mich auf den Gedanken“ als rein psychologische Deutung.
  rationale: Der griechische Text spricht ausdrücklich vom „Geist des Zorns“ und setzt ihn als handelnde Größe ein; ob dies ontologisch oder personifizierend gemeint ist, wird nicht entschieden.
- issue: Gewaltsame Bildsprache des Aussaugens
  choice: Das konkrete Bild wird auch auf Josef übertragen.
  alternative: Sinngemäß „Josef zu vernichten“.
  rationale: Die Wiederholung desselben Verbs ist textlich und rhetorisch bedeutsam und darf trotz ihrer ungewöhnlichen Wirkung nicht harmonisiert werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die ungewöhnliche Raubtiermetapher bleibt bewusst fremdartig. „Gab er mir ein“ ist idiomatisch, aber nicht umgangssprachlich, und wahrt die im Griechischen angelegte personale Agentivität.
