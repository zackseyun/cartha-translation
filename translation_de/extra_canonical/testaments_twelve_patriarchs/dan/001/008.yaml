  source_fidelity: 'Die Übersetzung gibt die zentralen Ausdrücke und die Satzbewegung des griechischen Textes zuverlässig wieder: „Geist des Zorns“, das fortgesetzte Überreden, das Bild vom Leoparden und Ziegenjungen sowie die zweimalige, bewusst befremdliche Saug-Metaphorik. „Gab er mir ein“ bildet ἐμοὶ ἐνέβαλεν idiomatisch ab, ohne die personale beziehungsweise personifizierte Handlung des Geistes festzulegen.'
