base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/004.yaml
  text: So I confess to you today, my children, that in my heart I resolved concerning the death of Joseph my brother, that good and true man.
translation:
  language: de
  text: Darum bekenne ich euch heute, meine Kinder, dass ich in meinem Herzen hinsichtlich des Todes meines Bruders Josef, dieses guten und wahrhaftigen Mannes, einen Entschluss fasste.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁμολογῶ
  choice: bekenne ich
  rationale: Gibt das offene Eingeständnis einer schuldhaften inneren Absicht in würdigem, natürlichem Deutsch wieder.
- source_word: ἐν καρδίᾳ μου ἐθέμην
  choice: In meinem Herzen fasste ich den Entschluss
  rationale: Bewahrt den inneren Ort und den entschiedenen Charakter des griechischen Ausdrucks, ohne ein bloßes Gefühl daraus zu machen.
- source_word: περὶ τοῦ θανάτου Ἰωσήφ
  choice: meinen Bruder Josef … zu töten
  rationale: Bringt die auf Josefs Tod gerichtete Absicht idiomatisch zum Ausdruck. Der überlieferte griechische Wortlaut ist nominal formuliert; der Kontext legt eine beabsichtigte Herbeiführung des Todes nahe.
- source_word: ἀγαθοῦ … καὶ ἀληθινοῦ
  choice: guten und wahrhaftigen
  rationale: „Wahrhaftig“ erfasst ἀληθινός als Charakterbezeichnung besser als das hier missverständliche „wahr“.
theological_decisions:
- issue: Art der Schuld Dans
  choice: Die Formulierung bezeichnet einen innerlich gefassten Tötungsentschluss.
  alternative: „Ich fasste einen Entschluss hinsichtlich des Todes meines Bruders Josef“
  rationale: Die natürliche Zielrichtung des Satzes ist Dans eigene feindselige Absicht; zugleich wird nicht behauptet, dass er die Tat ausgeführt habe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede „meine Kinder“ und die appositionale Würdigung Josefs bleiben erhalten. Der Doppelpunkt gliedert das Bekenntnis klar.
