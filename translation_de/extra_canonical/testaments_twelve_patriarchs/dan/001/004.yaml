  naturalness: Die revidierte Fassung bleibt modernes, würdiges Standarddeutsch. „einen Entschluss hinsichtlich des Todes … fassen“ ist bewusst leicht formal, entspricht aber der feierlich-bekenntnishaften Rede und bewahrt die Vorlage genauer.
  terminology: „bekennen“, „in meinem Herzen“, „meine Kinder“ sowie „gut und wahrhaftig“ geben die zentralen Ausdrücke angemessen wieder. „Wahrhaftig“ ist für ἀληθινός als ethische Charakterisierung gut geeignet.
