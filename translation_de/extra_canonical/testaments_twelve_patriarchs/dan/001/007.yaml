base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/007.yaml
  text: And one of the spirits of Beliar was working with me, saying, ‘Take this sword and kill Joseph, and your father will love you after he dies.’
translation:
  language: de
  text: 'Und einer der Geister Beliars wirkte mit mir zusammen und sagte: »Nimm dieses Schwert und töte Josef damit; dann wird dein Vater dich lieben, nachdem Josef gestorben ist.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ τῶν πνευμάτων τοῦ Βελίαρ
  choice: einer von den Geistern Beliars
  rationale: Gibt die partitive Wendung wörtlich und natürlich wieder; Βελίαρ wird als Eigenname im Genitiv beibehalten.
- source_word: συνήργει μοι
  choice: wirkte mit mir zusammen
  rationale: Bewahrt die Bedeutung des Zusammenwirkens beziehungsweise Unterstützens, ohne die moralische Mitwirkung abzuschwächen.
- source_word: ἐν τούτῳ ἄνελε
  choice: töte damit
  rationale: Bezieht das Demonstrativpronomen natürlich auf das zuvor genannte Schwert.
- source_word: ἀγαπήσει σε
  choice: wird dich lieben
  rationale: Entspricht dem Futur und dem üblichen Sinn von ἀγαπάω.
- source_word: ἀποθανόντος αὐτοῦ
  choice: wenn er tot ist
  rationale: Gibt den Genitivus absolutus wieder, lässt aber die grammatisch echte Unklarheit des männlichen Pronomens hinsichtlich seines Bezugs bestehen.
theological_decisions:
- issue: Identität und Rolle der Geister Beliars
  choice: einer von den Geistern Beliars
  alternative: ein Geist Beliars
  rationale: Die partitive Konstruktion bezeichnet einen aus einer Mehrzahl; sie wird nicht zu einer dogmatischen Aussage über Beliar oder Dämonologie erweitert.
- issue: Bezug von αὐτοῦ in ἀποθανόντος αὐτοῦ
  choice: Die Mehrdeutigkeit wird im Text bewahrt und in einer Fußnote erläutert.
  alternative: nach Josefs Tod / nach dem Tod deines Vaters
  rationale: Das griechische männliche Pronomen kann grammatisch auf Josef oder den Vater bezogen werden. Eine eindeutige Festlegung würde die Überlieferung stärker bestimmen, als der Wortlaut erlaubt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede ist knapp und bedrohlich gehalten. »Josef« folgt der üblichen deutschen Namensform; »Beliar« bleibt als Eigenname erhalten.
