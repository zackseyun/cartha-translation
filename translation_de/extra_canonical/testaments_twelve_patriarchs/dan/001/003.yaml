  to: Ich habe in meinem Herzen und mein ganzes Leben hindurch erprobt, dass Wahrheit, verbunden mit rechtem Handeln, gut und Gott wohlgefällig ist und dass Lüge und Zorn böse sind und den Menschen jede Art von Bosheit lehren.
