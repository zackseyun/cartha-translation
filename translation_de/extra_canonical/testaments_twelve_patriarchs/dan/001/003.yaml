base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001/003.yaml
  text: I have tested in my heart and in all my life that truth with righteous conduct is good and pleasing to God, and that falsehood and anger are evil, teaching a person every wickedness.
translation:
  language: de
  text: Ich habe in meinem Herzen und mein ganzes Leben hindurch erprobt, dass Wahrheit, verbunden mit rechtem Handeln, gut und Gott wohlgefällig ist und dass Lüge und Zorn böse sind und den Menschen jede Art von Bosheit lehren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπείρασα
  choice: habe … erfahren
  rationale: Das Verb bezeichnet ein Erproben bzw. eine durch Prüfung gewonnene Erfahrung. Im Deutschen gibt „erfahren“ den lebenspraktischen Charakter natürlicher wieder als „getestet“.
- source_word: ἐν καρδίᾳ μου καὶ ἐν πάσῃ ζωῇ μου
  choice: in meinem Herzen und während meines ganzen Lebens
  rationale: „Herz“ bewahrt die biblische Ausdrucksweise; bei ζωή macht „während“ deutlich, dass die gesamte Lebenserfahrung gemeint ist.
- source_word: ἡ ἀλήθεια μετὰ δικαιοπραγίας
  choice: die Wahrheit, verbunden mit rechtem Handeln
  rationale: μετά bezeichnet hier die Verbindung von Wahrheit und rechtschaffenem Tun. „Rechtes Handeln“ ist verständlich und gibt δικαιοπραγία präzise wieder.
- source_word: θεῷ εὐάρεστον
  choice: Gott wohlgefällig
  rationale: Bewahrt den würdevollen theologischen Ausdruck und bedeutet, dass etwas Gottes Zustimmung bzw. Wohlgefallen findet.
- source_word: τὸ ψεῦδος καὶ ὁ θυμός
  choice: Lüge und Zorn
  rationale: Die beiden substantivischen Begriffe werden direkt und ohne interpretierende Abschwächung wiedergegeben.
- source_word: πᾶσαν κακίαν
  choice: jede Art von Bosheit
  rationale: πᾶσαν kann umfassend-distributiv verstanden werden; die Formulierung ist im modernen Deutsch natürlicher als „jede Bosheit“.
- source_word: ἐκδιδάσκοντα τὸν ἄνθρωπον
  choice: den Menschen … lehren
  rationale: Das Partizip wird als koordinierter Relativsinn wiedergegeben. Der griechische Pluralbezug auf Lüge und Zorn bleibt erhalten.
theological_decisions:
- issue: Verhältnis von Wahrheit und rechtem Handeln
  choice: als zusammengehörige Verbindung formuliert
  alternative: „Wahrheit mit Gerechtigkeit“
  rationale: Der Text lobt nicht abstrakte Wahrheit allein, sondern Wahrheit in Verbindung mit gerechtem Tun; die Übersetzung bewahrt diese ethische Spannung.
- issue: Wirkung von Lüge und Zorn
  choice: Beide lehren den Menschen jede Art von Bosheit
  alternative: Nur der Zorn lehrt Bosheit
  rationale: Das griechische Partizip ἐκδιδάσκοντα steht im Akkusativ Plural und bezieht sich daher grammatisch auf beide Subjekte, Lüge und Zorn.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem argumentativen Aufbau des Griechischen, wird aber für flüssige Lesbarkeit leicht geglättet. Keine Fußnoten erforderlich.
