  source_fidelity: 'Die Übersetzung gibt den einleitenden, im griechischen Text vorhandenen Erzählzusammenhang wieder: Dan ruft seine πατριά zusammen und spricht anschließend. „Familie“ ist für πατριά eine tragfähige moderne Wiedergabe; „zusammenrufen“ macht die Versammlung ausdrücklich. Die Imperative Ἀκούσατε und προσέχετε sowie die parallelen Ausdrücke λόγων/ῥήμασι werden zuverlässig wiedergegeben.'
