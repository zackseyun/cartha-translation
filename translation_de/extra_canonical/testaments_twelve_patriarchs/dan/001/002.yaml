  terminology: „Söhne Dans“ bewahrt die im griechischen Text genannte Gruppenbezeichnung. Die einheitliche Wiedergabe von λόγοι und ῥήματα als „Worte“ ist hier sachgerecht und erzeugt keinen unbegründeten Bedeutungsunterschied. Es sind keine theologischen Fachbegriffe oder problematischen Namenformen betroffen.
