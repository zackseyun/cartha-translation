  text: Hear my words, sons of Dan, and pay attention to the words of your father.
translation:
  language: de
  text: 'Denn er rief seine Familie zusammen und sagte: »Hört meine Worte, ihr Söhne Dans, und achtet auf die Worte eures Vaters.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὴν πατρίαν αὐτοῦ
  choice: seine Familie
  rationale: πατριά bezeichnet hier den Familien- beziehungsweise Sippenverband. „Familie“ ist im modernen Deutsch natürlich und lässt den Umfang des versammelten Verbandes hinreichend offen.
- source_word: Ἀκούσατε
  choice: Hört
  rationale: Der Imperativ wird direkt und würdig wiedergegeben.
- source_word: υἱοὶ Δάν
  choice: ihr Söhne Dans
  rationale: Die Anrede wird ausdrücklich bewahrt; der vorangestellte Artikel „ihr“ kennzeichnet sie im Deutschen natürlich als Vokativ.
- source_word: προσέχετε
  choice: achtet auf
  rationale: Gibt die Aufforderung zu aufmerksamer Beachtung idiomatisch wieder.
- source_word: λόγων μου / ῥήμασι τοῦ πατρὸς ὑμῶν
  choice: meine Worte / die Worte eures Vaters
  rationale: Die parallelen Ausdrücke werden entsprechend ihrem nahen Bedeutungsfeld einheitlich mit „Worte“ übersetzt, ohne einen künstlichen Bedeutungsunterschied einzuführen.
