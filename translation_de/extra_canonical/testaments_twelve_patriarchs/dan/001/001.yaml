  text: Διαθήκη Δὰν τοῦ ἑβδόμου υἱοῦ Ἰακὼβ καὶ Βάλλας¹. I. Ἀντίγραφον λόγων Δάν², *ὧν εἶπεν³ τοῖς υἱοῖς αὐτοῦ⁴ ἐπʼ ἐσχάτων⁵ τῶν⁶ ἡμερῶν αὐτοῦ⁷ *ἐν τῷ ἑκατοστῷ εἰκοστῷ πέμπτῳ⁸ ἔτει⁹ τῆς¹⁰ ζωῆς αὐτοῦ.
