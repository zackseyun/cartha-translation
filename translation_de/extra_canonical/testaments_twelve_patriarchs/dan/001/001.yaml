  text: Testament of Dan, the seventh son of Jacob and Bilhah. A copy of the words of Dan, which he spoke to his sons in the last days of his life, in the 125th year of his life.
translation:
  language: de
  text: 'Testament Dans, des siebten Sohnes Jakobs und Bilhas.


    1 Abschrift der Worte Dans, die er zu seinen Söhnen in den letzten Tagen seines Lebens, im 125. Jahr seines Lebens sprach.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: Testament
  rationale: Im Titel bezeichnet das Wort die testamentarische Abschiedsrede Dans; „Testament“ ist im Deutschen für diese Literaturgattung präzise und etabliert.
- source_word: Ἀντίγραφον
  choice: Abschrift
  rationale: Gibt die Bedeutung einer schriftlichen Kopie oder Wiedergabe der Worte unmittelbar wieder.
- source_word: ἐπʼ ἐσχάτων τῶν ἡμερῶν αὐτοῦ
  choice: in den letzten Tagen seines Lebens
  rationale: Die Ergänzung „seines Lebens“ macht den natürlichen deutschen Bezug deutlich und entspricht dem Kontext der Abschiedsrede.
- source_word: ἐν τῷ ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: im 125. Jahr seines Lebens
  rationale: Bewahrt die antike inklusive Altersangabe wörtlich, ohne sie stillschweigend zu „im Alter von 125 Jahren“ umzudeuten.
