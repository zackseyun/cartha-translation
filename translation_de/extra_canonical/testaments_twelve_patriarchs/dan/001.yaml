  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/001.yaml
  text: 'In the fifth year of his life[a], Dan called together his family and said:


    2. “Hear my words, sons of Dan, and pay attention to the words of your father.

    3. I have tested in my heart, and in all my life, that truth with righteous conduct is good and pleasing to God, and that falsehood and anger are evil, teaching a person every wickedness.

    4. So I confess to you today, my children, that in my heart I resolved concerning the death of Joseph my brother, that good and true man.

    5. And I rejoiced over his being sold, because his father loved him more than us.

    6. For the spirit of jealousy and of arrogance kept saying to me, ‘You yourself also are his son.’

    7. And one of the spirits of Beliar was working with me, saying, ‘Take this sword and kill Joseph, and your father will love you when he is dead.’

    8. Now this was the spirit of anger persuading me, that just as a leopard devours a young goat, so I too should destroy Joseph.

    9. But the God of my fathers did not give him into my hands[b], so that I might find him alone and kill him and commit this lawless deed[c], lest two tribes be destroyed from Israel.”'
translation:
  language: de
  text: '**Das Testament Dans, des siebten Sohnes Jakobs und Bilhas**


    **1** Abschrift der Worte Dans, die er am Ende seiner Tage zu seinen Söhnen sprach, im hundertfünfundzwanzigsten Jahr seines Lebens.[a] **2** Er rief seine Familie zusammen und sagte:


    „Hört meine Worte, ihr Söhne Dans, und achtet auf die Worte eures Vaters. **3** Ich habe in meinem Herzen und während meines ganzen Lebens erfahren, dass Wahrheit, verbunden mit gerechtem Handeln, gut und Gott wohlgefällig ist, dass aber Lüge und Zorn böse sind und den Menschen jede Art von Bosheit lehren.


    **4** Darum bekenne ich euch heute, meine Kinder: In meinem Herzen fasste ich den Entschluss, meinen Bruder Josef zu töten, diesen guten und wahrhaftigen Mann. **5** Ich freute mich darüber, dass er verkauft wurde, weil unser Vater ihn mehr liebte als uns. **6** Denn der Geist der Eifersucht und des Hochmuts sagte zu mir: ‚Auch du selbst bist doch sein Sohn!‘


    **7** Und einer von Beliars Geistern wirkte mit mir und sagte: ‚Nimm das Schwert und töte damit Josef; wenn er tot ist, wird dein Vater dich lieben.‘ **8** Es war der Geist des Zorns, der mich überredete, Josef zu verschlingen, wie ein Leopard ein Ziegenböckchen verschlingt.[b]


    **9** Doch der Gott meiner Väter ließ ihn nicht in meine Hände fallen, damit ich ihn nicht allein antreffen und töten und bewirken könnte, dass für Israel ein zweites Zepter zerbrochen würde.[c]“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die vorgelegte griechische Fassung nennt ausdrücklich das hundertfünfundzwanzigste Lebensjahr. Die Lesart „im fünften Jahr“ beruht nicht auf dem hier abgedruckten griechischen Wortlaut.
    reason: textual_variant
  - marker: b
    text: Der griechische Wortlaut dieses Vergleichs ist verderbt und verwendet ein ungewöhnliches Verb, das wörtlich etwa „aussaugen“ bedeuten kann. Die Übersetzung gibt das erkennbare Bild eines Raubtiers wieder, das ein junges Tier verschlingt.
    reason: textual_difficulty
  - marker: c
    text: 'Wörtlich etwa: „und bewirken, dass ein zweites Zepter für Israel aufgelöst beziehungsweise zerbrochen würde“. Der Sinn dieser schwierigen Schlusswendung ist unsicher; andere Textformen deuten sie auf die Vernichtung zweier Stämme Israels.'
    reason: textual_variant
lexical_decisions:
- source_word: Διαθήκη
  choice: Testament
  rationale: Im Titel bezeichnet das Wort die testamentarische Abschiedsrede Dans; „Testament“ ist im Deutschen für diese Literaturgattung präzise und geläufig.
- source_word: ἐν τῷ ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει
  choice: im hundertfünfundzwanzigsten Jahr
  rationale: Die vorgelegte griechische Quelle nennt eindeutig das 125. Jahr. Die abweichende Angabe „fünftes Jahr“ der englischen Konsultationsschicht wird daher nicht übernommen.
- source_word: προσέχετε
  choice: achtet auf
  rationale: Der Imperativ fordert eindringliche Aufmerksamkeit und klingt in einer väterlichen Abschiedsrede natürlich und würdig.
- source_word: ἡ ἀλήθεια μετὰ δικαιοπραγίας
  choice: Wahrheit, verbunden mit gerechtem Handeln
  rationale: Die Formulierung bewahrt sowohl den umfassenden ethischen Sinn von ἀλήθεια als auch den Praxisbezug von δικαιοπραγία.
- source_word: ψεῦδος
  choice: Lüge
  rationale: Das abstrakte moralische Gegenstück zur Wahrheit wird im Deutschen knapp und verständlich wiedergegeben.
- source_word: θυμός
  choice: Zorn
  rationale: „Zorn“ trägt die intensive und im Kapitel personifiziert-dämonologische Bedeutung stärker als das neutralere „Ärger“.
- source_word: ζῆλος
  choice: Eifersucht
  rationale: Dans Missgunst richtet sich auf die bevorzugte Liebe des Vaters zu Josef; „Eifersucht“ gibt diesen Beziehungsbezug wieder.
- source_word: ἀλαζονεία
  choice: Hochmut
  rationale: Das Wort bezeichnet selbstüberhebliches Denken; „Hochmut“ passt zum würdigen ethischen Register.
- source_word: τῶν πνευμάτων τοῦ Βελίαρ
  choice: einer von Beliars Geistern
  rationale: Die Benennung Beliars und die Mehrzahl der ihm zugeordneten Geister bleiben ausdrücklich erhalten.
- source_word: ἄνελε
  choice: töte
  rationale: Der Mordbefehl ist direkt und unverhüllt; „töte“ wahrt diese Schärfe.
- source_word: πάρδαλις
  choice: Leopard
  rationale: Dies ist die gewöhnliche Tierbezeichnung und bewahrt das räuberische Bild.
- source_word: ἔριφον
  choice: Ziegenböckchen
  rationale: Die Bezeichnung ist für heutige Leser eindeutig und wahrt das Bild eines jungen Beutetiers.
- source_word: λυθῆναι σκῆπτρον δεύτερον τῷ Ἰσραήλ
  choice: dass für Israel ein zweites Zepter zerbrochen worden wäre
  rationale: Die schwierige griechische Schlusswendung wird möglichst formnah wiedergegeben, ohne ihre unklare geschichtliche oder stammesbezogene Bedeutung durch eine Deutung zu ersetzen.
theological_decisions:
- issue: Beliar als benannte persönliche Macht des Bösen
  choice: „einer von Beliars Geistern“
  alternative: „ein böser Geist“
  rationale: Der griechische Text nennt Beliar ausdrücklich und beschreibt ihm zugehörige Geister. Diese dämonologische Konkretheit darf nicht zu einem bloßen inneren Impuls verallgemeinert werden.
- issue: Göttliche Verhinderung von Dans Mordplan
  choice: „der Gott meiner Väter ließ ihn nicht in meine Hände fallen“
  alternative: „der Gott meiner Väter gab ihn nicht in meine Hände“
  rationale: Die Wiedergabe folgt dem griechischen οὐκ εἴασεν ... ἐμπεσεῖν und hält Gottes Eingreifen und Dans fortbestehende Schuldabsicht zugleich fest.
- issue: Folge von Josefs möglicher Ermordung
  choice: das Bild vom Zerbrechen eines zweiten Zepters bewahren
  alternative: „damit nicht zwei Stämme aus Israel vernichtet würden“
  rationale: Die vorgelegte griechische Quelle spricht von einem „zweiten Zepter“ und bietet nicht ausdrücklich die alternative Deutung von zwei Stämmen. Die theologisch und geschichtlich offene Bildsprache bleibt deshalb stehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die testamentarische Mahnrede bleibt feierlich, ohne archaische Verbformen. Unklare oder verderbte Stellen werden nicht stillschweigend harmonisiert; besonders die Altersangabe und das Bild vom „zweiten Zepter“ folgen der vorgelegten griechischen Quelle statt der englischen Konsultationsfassung.
