review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt den griechischen Text insgesamt zuverlässig und ohne dogmatische Harmonisierung wieder. Besonders gelungen sind die Beibehaltung von „Beliar“, die militärische Bildsprache in V. 4, die offene Wiedergabe von τὸ σωτήριον Κυρίου als „das Heil des Herrn“ und die Markierung der textkritisch unsicheren Zusätze. Zwei kleine Korrekturen sind angezeigt: In V. 7 bedeutet συνεγγίζοντες zunächst „sich nähern“, nicht notwendigerweise „sich anschließen“; Anm. h gibt den Inhalt der Erweiterung hinsichtlich des Subjekts von „in Niedrigkeit und Armut herrschen“ ungenau wieder.'
  naturalness: Die Sprache ist modernes, würdiges Standarddeutsch und für einen testamentarischen Mahntext sehr gut lesbar. „Beliar die Gefangenschaft nehmen“ in V. 11 ist bewusst nahe am ambigen griechischen Ausdruck und wird durch die textkritische Anmerkung verständlich.
  terminology: 'Die zentralen Begriffe sind konsistent und sachgerecht: Herr, Gesetz, Heil, Heiligtum, Heilige, Gerechte, Satan und Beliar. „Grimm und Unruhen“ bildet μῆνιν καὶ ταραχάς treffend ab. Die textkritischen Hinweise zu „mit ihnen“, „Judas und“, den Seelen der Heiligen und den Schlusszusätzen sind sinnvoll verankert.'
  issues:
  - severity: low
    issue: 'V. 7: „werden sich Levi anschließen“ ist stärker als συνεγγίζοντες.'
    rationale: Das Partizip bezeichnet primär ein Sich-Nähern. „Sich Levi nähern“ wahrt die Bedeutung, ohne bereits eine formelle oder dauerhafte Verbindung zu behaupten.
  - severity: medium
    issue: Anm. h schreibt das Herrschen „in Niedrigkeit und Armut“ dem Herrn zu.
    rationale: In der erweiterten griechischen Formulierung gehört die Aussage syntaktisch zum „Heiligen Israels“, der über Jerusalem herrscht; danach folgt ein eigener Satz über denjenigen, der an ihn glaubt. Die Fußnote soll diese umstrittene Erweiterung präzise und neutral beschreiben.
  revised_text: '**Testament Dans 5**


    **1** Darum, meine Kinder, bewahrt das Gebot des Herrn und haltet sein Gesetz. Wendet euch vom Zorn ab und hasst die Lüge, damit der Herr in euch wohnt und Beliar vor euch flieht.


    **2** Sagt einander die Wahrheit. Dann werdet ihr gewiss nicht in Grimm und Unruhen geraten, sondern in Frieden leben, weil ihr den Gott des Friedens habt; und Krieg wird euch gewiss nicht überwältigen.


    **3** Liebt den Herrn euer ganzes Leben lang und liebt einander mit aufrichtigem Herzen.


    **4** Ich weiß, dass ihr euch in den letzten Tagen vom Herrn abwenden, Levi reizen und euch gegen Juda zum Kampf aufstellen werdet. Doch ihr werdet sie nicht überwältigen können. Denn ein Engel des Herrn führt sie beide, weil Israel durch sie Bestand haben wird.


    **5** Sooft ihr euch vom Herrn abwendet und in jeder Art von Bosheit lebt, werdet ihr die abscheulichen Taten der Völker begehen: Ihr werdet mit gesetzlosen Frauen Unzucht treiben, während die Geister der Bosheit in jeder Art von Schlechtigkeit in euch wirken.


    **6** Denn ich habe im Buch Henochs, des Gerechten, gelesen[a] und erkannt, dass Satan euer Herrscher ist. Auch die Geister der Bosheit und des Hochmuts werden den Söhnen Levis zur Seite stehen[b], um sie dazu zu bringen, vor dem Herrn zu sündigen.


    **7** Auch meine Söhne werden sich Levi nähern und gemeinsam mit ihnen in allem sündigen. Die Söhne Judas aber werden aus Habgier fremdes Gut rauben wie Löwen.


    **8** Deshalb werdet ihr mit ihnen[c] in die Gefangenschaft weggeführt werden. Dort werden euch alle Plagen Ägyptens und alle Übel der Völker treffen.


    **9** Wenn ihr dann zum Herrn umkehrt, wird er sich eurer erbarmen. Er wird euch in sein Heiligtum führen und euch Frieden geben.


    **10** Für euch wird aus dem Stamm Judas und Levis[d] das Heil des Herrn aufgehen. Denn er selbst wird gegen Beliar Krieg führen und euren Vätern die Vergeltung des Sieges gewähren[e].


    **11** Er wird Beliar die Gefangenschaft nehmen – die Seelen der Heiligen[f] – und ungehorsame Herzen zum Herrn zurückführen. Allen, die ihn anrufen, wird er ewigen Frieden geben.


    **12** Die Heiligen werden in Eden Ruhe finden, und die Gerechten werden sich über das neue Jerusalem freuen[g], das Gottes ewige Herrlichkeit ist.


    **13** Jerusalem wird keine Verwüstung mehr erdulden müssen, und Israel wird nicht mehr in Gefangenschaft geführt werden. Denn der Herr wird in ihrer Mitte sein, und der Heilige Israels wird über sie herrschen.[h]'
  revised_footnotes:
  - marker: a
    text: Der griechische Text nennt ausdrücklich das „Buch Henochs, des Gerechten“ und verweist damit wahrscheinlich auf Henoch-Traditionen des antiken Judentums.
    reason: cross_reference
  - marker: b
    text: Die griechische Formulierung über die Geister und ihr Verhältnis zu den Söhnen Levis ist textlich beziehungsweise syntaktisch unsicher; sinngemäß geht es darum, dass sie ihnen zur Seite stehen und sie zum Sündigen verleiten.
    reason: textual_variant
  - marker: c
    text: „Mit ihnen“ steht nicht in allen Textzeugen; wo die Worte vorhanden sind, beziehen sie die Wegführung ausdrücklich auf die zuvor genannten Gruppen.
    reason: textual_variant
  - marker: d
    text: Die Worte „Judas und“ sind textlich umstritten. Die gemeinsame Nennung von Juda und Levi ist jedoch in der Überlieferung gut bezeugt.
    reason: textual_variant
  - marker: e
    text: Das griechische Wort für „Vätern“ ist in der Edition als unsicher gekennzeichnet. Die ungewöhnliche Wendung „Vergeltung des Sieges“ wurde deshalb nicht glättend umgedeutet.
    reason: textual_variant
  - marker: f
    text: Die Erklärung „die Seelen der Heiligen“ ist textlich unsicher. Sie versteht die Beliar abgenommene „Gefangenschaft“ als die von ihm gefangen gehaltenen Menschen.
    reason: textual_variant
  - marker: g
    text: Das „neue Jerusalem“ ist hier ein endzeitliches Bild des wiederhergestellten und verherrlichten Zion, nicht lediglich eine Bezeichnung der damaligen historischen Stadt.
    reason: cultural_note
  - marker: h
    text: Einige Textzeugen enthalten zusätzliche Aussagen darüber, dass der Herr mit den Menschen zusammenlebt, dass der Heilige Israels über Jerusalem in Niedrigkeit und Armut herrscht und dass derjenige, der an ihn glaubt, unter den Menschen in Wahrheit herrschen wird. Diese vermutlich erweiterten Formulierungen wurden nicht in den Haupttext aufgenommen.
    reason: textual_variant
  revision_rationale: Die Revision beschränkt sich auf zwei sichere Verbesserungen. V. 7 wird enger an συνεγγίζοντες ausgerichtet („sich Levi nähern“). Anm. h beschreibt die ausgesparte, textkritisch umstrittene Erweiterung nun syntaktisch korrekt und ohne deren Aussage dem falschen Subjekt zuzuschreiben. Alle Fußnotenanker bleiben vorhanden und eindeutig zugeordnet.
