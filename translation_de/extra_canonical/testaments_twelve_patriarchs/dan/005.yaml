  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005.yaml
  text: '1 Therefore[v6], my children, keep the commandment of the Lord, and keep his law. Depart from anger, and hate falsehood, so that the Lord may dwell in you and Beliar may flee from you.


    2 Speak truth, each one to his neighbor, and you will certainly not fall into wrath and tumults; rather, you will be in peace, having the God of peace[v8], and war will certainly not prevail against you.


    3 Love the Lord throughout all your life, and one another with a true heart.


    4 I know that in the last days you will depart from the Lord, and you will provoke Levi, and you will set yourselves in battle array against Judah, but you will not prevail against them. For an angel of the Lord guides them both, because by them Israel will stand.


    5 And whenever you depart from the Lord, walking in every wickedness, you will do the abominations of the nations, prostituting yourselves with lawless women, and the spirits of wickedness working among you in every evil.


    6 For I have read in the book of Enoch the righteous, and I learned that your ruler is Satan, and that the spirits of wickedness and of pride will attend on the sons of Levi, to make them sin before the Lord.


    7 And my sons will draw near to Levi and will sin together with them in all things. But the sons of Judah will be greedy, snatching what belongs to others like lions.


    8 Therefore you will be led away with them into captivity, and there you will receive all the plagues of Egypt and all the evils of the nations.


    9 And so, when you return to the Lord, you will receive mercy, and he will bring you into his sanctuary, and he will give you peace.


    10 And for you the salvation of the Lord will arise from the tribe of Judah and of Levi. For he himself will make war against Beliar, and he will grant the vengeance of victory to your fathers.


    11 And he will take the captivity from Beliar, even the souls of the holy ones, and he will turn disobedient hearts to the Lord, and he will give eternal peace to those who call on him.


    12 And the holy ones will rest in Eden, and the righteous will rejoice over the new Jerusalem, which is the eternal glory of God.


    13 And Jerusalem will no longer endure desolation, nor will Israel be taken captive, because the Lord will be in her midst[v13][v12][v11][v10], and the Holy One of Israel will reign over her.'
translation:
  language: de
  text: '**Testament Dans 5**


    **1** Darum, meine Kinder, bewahrt das Gebot des Herrn und haltet sein Gesetz. Wendet euch vom Zorn ab und hasst die Lüge, damit der Herr in euch wohnt und Beliar vor euch flieht.


    **2** Sagt einander die Wahrheit. Dann werdet ihr gewiss nicht in Grimm und Unruhen geraten, sondern in Frieden leben, weil ihr den Gott des Friedens habt; und Krieg wird euch gewiss nicht überwältigen.


    **3** Liebt den Herrn euer ganzes Leben lang und liebt einander mit aufrichtigem Herzen.


    **4** Ich weiß, dass ihr euch in den letzten Tagen vom Herrn abwenden, Levi reizen und euch gegen Juda zum Kampf aufstellen werdet. Doch ihr werdet sie nicht überwältigen können. Denn ein Engel des Herrn führt sie beide, weil Israel durch sie Bestand haben wird.


    **5** Sooft ihr euch vom Herrn abwendet und in jeder Art von Bosheit lebt, werdet ihr die abscheulichen Taten der Völker begehen: Ihr werdet mit gesetzlosen Frauen Unzucht treiben, während die Geister der Bosheit in jeder Art von Schlechtigkeit in euch wirken.


    **6** Denn ich habe im Buch Henochs, des Gerechten, gelesen[a] und erkannt, dass Satan euer Herrscher ist. Auch die Geister der Bosheit und des Hochmuts werden den Söhnen Levis zur Seite stehen[b], um sie dazu zu bringen, vor dem Herrn zu sündigen.


    **7** Auch meine Söhne werden sich Levi nähern und gemeinsam mit ihnen in allem sündigen. Die Söhne Judas aber werden aus Habgier fremdes Gut rauben wie Löwen.


    **8** Deshalb werdet ihr mit ihnen[c] in die Gefangenschaft weggeführt werden. Dort werden euch alle Plagen Ägyptens und alle Übel der Völker treffen.


    **9** Wenn ihr dann zum Herrn umkehrt, wird er sich eurer erbarmen. Er wird euch in sein Heiligtum führen und euch Frieden geben.


    **10** Für euch wird aus dem Stamm Judas und Levis[d] das Heil des Herrn aufgehen. Denn er selbst wird gegen Beliar Krieg führen und euren Vätern die Vergeltung des Sieges gewähren[e].


    **11** Er wird Beliar die Gefangenschaft nehmen – die Seelen der Heiligen[f] – und ungehorsame Herzen zum Herrn zurückführen. Allen, die ihn anrufen, wird er ewigen Frieden geben.


    **12** Die Heiligen werden in Eden Ruhe finden, und die Gerechten werden sich über das neue Jerusalem freuen[g], das Gottes ewige Herrlichkeit ist.


    **13** Jerusalem wird keine Verwüstung mehr erdulden müssen, und Israel wird nicht mehr in Gefangenschaft geführt werden. Denn der Herr wird in ihrer Mitte sein, und der Heilige Israels wird über sie herrschen.[h]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text nennt ausdrücklich das „Buch Henochs, des Gerechten“ und verweist damit wahrscheinlich auf Henoch-Traditionen des antiken Judentums.
    reason: cross_reference
  - marker: b
    text: Die griechische Formulierung über die Geister und ihr Verhältnis zu den Söhnen Levis ist textlich beziehungsweise syntaktisch unsicher; sinngemäß geht es darum, dass sie ihnen zur Seite stehen und sie zum Sündigen verleiten.
    reason: textual_variant
  - marker: c
    text: „Mit ihnen“ steht nicht in allen Textzeugen; wo die Worte vorhanden sind, beziehen sie die Wegführung ausdrücklich auf die zuvor genannten Gruppen.
    reason: textual_variant
  - marker: d
    text: Die Worte „Judas und“ sind textlich umstritten. Die gemeinsame Nennung von Juda und Levi ist jedoch in der Überlieferung gut bezeugt.
    reason: textual_variant
  - marker: e
    text: Das griechische Wort für „Vätern“ ist in der Edition als unsicher gekennzeichnet. Die ungewöhnliche Wendung „Vergeltung des Sieges“ wurde deshalb nicht glättend umgedeutet.
    reason: textual_variant
  - marker: f
    text: Die Erklärung „die Seelen der Heiligen“ ist textlich unsicher. Sie versteht die Beliar abgenommene „Gefangenschaft“ als die von ihm gefangen gehaltenen Menschen.
    reason: textual_variant
  - marker: g
    text: Das „neue Jerusalem“ ist hier ein endzeitliches Bild des wiederhergestellten und verherrlichten Zion, nicht lediglich eine Bezeichnung der damaligen historischen Stadt.
    reason: cultural_note
  - marker: h
    text: Einige Textzeugen enthalten zusätzliche Aussagen darüber, dass der Herr mit den Menschen zusammenlebt, dass der Heilige Israels über Jerusalem in Niedrigkeit und Armut herrscht und dass derjenige, der an ihn glaubt, unter den Menschen in Wahrheit herrschen wird. Diese vermutlich erweiterten Formulierungen wurden nicht in den Haupttext aufgenommen.
    reason: textual_variant
lexical_decisions:
- source_word: φυλάξατε / τηρήσατε
  choice: bewahrt / haltet
  rationale: Die zwei deutschen Verben erhalten den Parallelismus, ohne mechanisch dasselbe Verb zu wiederholen.
- source_word: θυμός
  choice: Zorn
  rationale: Im mahnenden Zusammenhang bezeichnet das Wort eine sittlich gefährliche, heftige Gemütsbewegung.
- source_word: ψεῦδος
  choice: Lüge
  rationale: „Lüge“ ist im heutigen Deutsch natürlicher als „Falschheit“ und kann hier sowohl unwahre Rede als auch die entsprechende Haltung bezeichnen.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Die Namensform des griechischen Zeugen wird beibehalten und nicht zur bekannteren hebräisch geprägten Form „Belial“ normalisiert.
- source_word: ἀλήθειαν φθέγγεσθε ἕκαστος πρὸς τὸν πλησίον αὐτοῦ
  choice: Sagt einander die Wahrheit
  rationale: Die natürliche deutsche Wendung gibt den gegenseitigen Bezug und den direkten Mahnton wieder.
- source_word: μῆνιν καὶ ταραχάς
  choice: Grimm und Unruhen
  rationale: „Grimm“ ist stärker als der Zorn in Vers 1; „Unruhen“ lässt neben persönlichem Streit auch soziale Erschütterungen erkennen.
- source_word: παρατάξεσθε
  choice: euch gegen Juda zum Kampf aufstellen
  rationale: Die ausdrückliche militärische Bildsprache des griechischen Verbs bleibt erhalten.
- source_word: τὸ σωτήριον Κυρίου
  choice: das Heil des Herrn
  rationale: Die offene griechische Formulierung wird nicht vorschnell zu „der Retter“ personalisiert.
- source_word: ἅγιοι / δίκαιοι
  choice: die Heiligen / die Gerechten
  rationale: Die unterschiedlichen Gruppenbezeichnungen des Ausgangstextes bleiben sichtbar.
theological_decisions:
- issue: Satan und die Geister der Bosheit in den Versen 5–7
  choice: Die übernatürliche Sprache wird unmittelbar wiedergegeben.
  alternative: Die Gestalten lediglich als Bilder für böse Neigungen deuten.
  rationale: Der griechische Text verbindet die ethische Warnung ausdrücklich mit personal dargestellten übernatürlichen Mächten; die Übersetzung sollte diese Spannung nicht auflösen.
- issue: Das aus Juda und Levi aufgehende Heil in Vers 10
  choice: „das Heil des Herrn“ wird beibehalten, gefolgt vom männlichen Rückbezug „er selbst“.
  alternative: Durchgehend personalisieren als „der Retter des Herrn“ oder unpersönlich umformulieren.
  rationale: Der Wechsel vom sächlichen τὸ σωτήριον zum männlichen αὐτός ist im griechischen Text auffällig und möglicherweise theologisch bedeutsam. Die deutsche Fassung bewahrt diese Spannung.
- issue: Textgeschichtlich unsichere eschatologische Erweiterungen in den Versen 10–13
  choice: Gut bezeugte Bestandteile werden übersetzt; deutlich eingeklammerte Erweiterungen werden in Fußnoten ausgewiesen oder nicht in den Haupttext aufgenommen.
  alternative: Alle Erweiterungen unterschiedslos in den Haupttext aufnehmen oder den ganzen Abschnitt ausscheiden.
  rationale: So bleibt sowohl der überlieferte Gehalt als auch seine textliche Instabilität transparent.
- issue: „neues Jerusalem“ in Vers 12
  choice: Als eschatologisches Jerusalem unverändert wiedergeben.
  alternative: Mit der historischen Stadt oder einer bestimmten späteren Lehrvorstellung gleichsetzen.
  rationale: Der Text selbst bezeichnet es als Gottes ewige Herrlichkeit, legt aber keine vollständig ausgearbeitete Systematik vor.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direktem testamentarischem Mahnton. Kurze Hauptsätze dienen der Verständlichkeit; militärische, dämonologische und endzeitliche Bilder werden nicht abgeschwächt. Archaismen werden vermieden, während Schlüsselwörter wie „Heil“, „Heiligtum“, „Heilige“ und „der Heilige Israels“ wegen ihres sachlichen und intertextuellen Gewichts erhalten bleiben.
