source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: II. Καὶ νῦν, τέκνα μου, ἰδοὺ¹ ἐγὼ ἀποθνῄσκω, καὶ ἐν ἀληθείᾳ λέγω ὑμῖν, ὅτι² ἐὰν³ μὴ φυλάξητε⁴ ἑαυτοὺς ἀπὸ *τοῦ πνεύματος⁵ *τοῦ ψεύδους καὶ τοῦ θυμοῦ⁶, καὶ ἀγαπήσητε⁷ τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν, ἀπολεῖσθε⁸.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/002.yaml
  text: 'Anger is an evil thing, my children[b], because it troubles even the soul itself. And the body of the angry man it makes its own, and over his soul it gains mastery, and it bestows power on the body, so that it works every lawless deed. And when the body does all these things, the soul justifies what is done, because it does not see rightly. Therefore he who is wrathful, if he is a mighty man, has a threefold power in his anger: one from the help of his servants, and a second from his wealth, by which he persuades and overcomes unjustly, and a third, because he has his own natural power, and by it he works evil. And if the wrathful man is also poor, he has a twofold power of anger; for it always helps him toward wrongdoing.'
translation:
  language: de
  text: 'Und nun, meine Kinder: Seht, ich sterbe. Wahrhaftig sage ich euch: Wenn ihr euch nicht vor dem Geist der Lüge und des Zorns hütet und die Wahrheit und die Langmut[a] liebt, werdet ihr zugrunde gehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Geduld« beziehungsweise »Nachsicht«.'
    reason: Erläutert den Bedeutungsumfang von μακροθυμία für heutige Leser, ohne die syntaktische Struktur des griechischen Textes zu verändern.
lexical_decisions:
- source_word: ἰδού
  choice: Seht
  rationale: Bewahrt den eindringlichen Hinweischarakter der Partikel in natürlichem modernem Deutsch.
- source_word: ἐν ἀληθείᾳ λέγω ὑμῖν
  choice: Wahrhaftig sage ich euch
  rationale: Gibt die feierliche Wahrheitsbekräftigung knapp und würdig wieder, ohne sie zu einer späteren feststehenden Evangelienformel umzuprägen.
- source_word: φυλάξητε ἑαυτοὺς ἀπό
  choice: euch … vor … hütet
  rationale: Entspricht dem reflexiven Gedanken des Sich-Bewahrens und ist idiomatisches Deutsch.
- source_word: τοῦ πνεύματος τοῦ ψεύδους καὶ τοῦ θυμοῦ
  choice: dem Geist der Lüge und des Zorns
  rationale: Folgt eng der Genitivkonstruktion und bewahrt den möglichen Gedanken eines von Lüge und Zorn gekennzeichneten Geistes.
- source_word: μακροθυμίαν
  choice: Langmut
  rationale: Bezeichnet geduldige Selbstbeherrschung und Nachsicht, besonders angesichts von Kränkung oder Provokation; dies bildet den treffenden Gegenpol zu θυμός.
- source_word: ἀπολεῖσθε
  choice: werdet ihr zugrunde gehen
  rationale: Bewahrt die starke Warnung des Verbs, ohne die genaue Art des Verderbens näher festzulegen.
theological_decisions:
- issue: Beziehung von »Geist«, »Lüge« und »Zorn«
  choice: »Geist der Lüge und des Zorns«
  alternative: »Geist der Lüge und vor dem Zorn«
  rationale: Die griechische Genitivreihe kann beide Begriffe als Kennzeichen des Geistes verbinden; die Fußnote hält die mögliche Lesart zweier gesonderter Gefahren offen.
- issue: Art des angekündigten Verderbens
  choice: »zugrunde gehen« ohne nähere Bestimmung
  alternative: »verloren gehen« oder eine ausdrückliche Deutung als ewige Verdammnis
  rationale: Der griechische Text formuliert eine ernste, aber nicht näher bestimmte Folge; eine spezifische eschatologische Auslegung wäre ein Zusatz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter väterlicher Anrede und feierlicher Warnung. »Langmut« ist bewusst leicht gehoben, aber in diesem ethischen Zusammenhang präzise; die Fußnote bietet geläufigere Entsprechungen.
