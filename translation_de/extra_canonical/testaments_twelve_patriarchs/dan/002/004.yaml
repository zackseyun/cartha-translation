source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: II. Καὶ νῦν, τέκνα μου, ἰδοὺ¹ ἐγὼ ἀποθνῄσκω, καὶ ἐν ἀληθείᾳ λέγω ὑμῖν, ὅτι² ἐὰν³ μὴ φυλάξητε⁴ ἑαυτοὺς ἀπὸ *τοῦ πνεύματος⁵ *τοῦ ψεύδους καὶ τοῦ θυμοῦ⁶, καὶ ἀγαπήσητε⁷ τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν, ἀπολεῖσθε⁸.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/004.yaml
  text: Therefore, when anyone speaks against you, do not be moved to anger; and if anyone praises you as holy men, do not be exalted, either to delight or to disgust. For first it is pleasing to the hearing, and so the mind is stirred to perceive the grounds for provocation; and then, becoming angry, he thinks that he is justly angry.
translation:
  language: de
  text: 'Und nun, meine Kinder, seht: Ich sterbe. Wahrhaftig sage ich euch: Wenn ihr euch nicht vor dem Geist der Lüge und des Zorns hütet und die Wahrheit und die Langmut liebt, werdet ihr zugrunde gehen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδοὺ
  choice: seht
  rationale: Bewahrt den eindringlichen Hinweischarakter der griechischen Aufforderung in natürlichem Deutsch.
- source_word: φυλάξητε ἑαυτούς ἀπό
  choice: euch vor … hütet
  rationale: Gibt die reflexive Aufforderung wieder, sich wachsam von den genannten verderblichen Einflüssen fernzuhalten.
- source_word: τοῦ πνεύματος τοῦ ψεύδους
  choice: dem Geist der Lüge
  rationale: Folgt der konkreten griechischen Formulierung und lässt offen, ob „Geist“ personal, übernatürlich oder als prägende Haltung verstanden ist.
- source_word: τοῦ θυμοῦ
  choice: des Zorns
  rationale: Entspricht dem starken Affekt von θυμός und verbindet ihn grammatisch mit „Geist“, ohne den Ausdruck unnötig zu glätten.
- source_word: μακροθυμίαν
  choice: Langmut
  rationale: Bezeichnet geduldige Selbstbeherrschung und Nachsicht, besonders angesichts von Kränkung oder Provokation; „Langmut“ ist präzise und würdevoll.
- source_word: ἀπολεῖσθε
  choice: werdet ihr zugrunde gehen
  rationale: Bewahrt die ernste, umfassende Warnung des Verbs, ohne sie auf körperlichen Tod oder endgültige Verdammnis festzulegen.
theological_decisions:
- issue: Bedeutung von „Geist der Lüge“
  choice: Die Formulierung bleibt wörtlich und theologisch offen.
  alternative: „lügnerische Gesinnung“ oder „Geistwesen der Lüge“
  rationale: Der griechische Ausdruck legt nicht eindeutig fest, ob ein persönlicher Geist oder eine innere Haltung gemeint ist; die Übersetzung soll diese Spannung nicht auflösen.
- issue: Reichweite von ἀπολεῖσθε
  choice: „werdet ihr zugrunde gehen“
  alternative: „werdet ihr vernichtet werden“ oder „werdet ihr verloren gehen“
  rationale: Die gewählte Fassung wahrt die Schärfe der Warnung, ohne eine bestimmte Lehre über zeitliches oder endgültiges Verderben einzutragen.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter väterlicher Anrede und eindringlichem Warncharakter. Die Satzglieder wurden für gute deutsche Lesbarkeit leicht gegliedert, während Bedingung, Gegensatz und theologische Mehrdeutigkeit des griechischen Textes erhalten bleiben.
