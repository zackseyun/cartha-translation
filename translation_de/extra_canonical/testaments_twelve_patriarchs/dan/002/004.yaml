  source_fidelity: 'Die deutsche Fassung gibt den griechischen Fragmenttext vollständig und genau wieder: die einleitende Wendung, die Anrede, den Hinweisruf, die Todesankündigung, die Wahrheitsbeteuerung sowie die Bedingung mit ihren beiden positiven bzw. negativen Anforderungen und der Folge. „Geist der Lüge und des Zorns“ wahrt die syntaktische und begriffliche Offenheit des Genitivs. „Werden ... zugrunde gehen“ gibt ἀπολεῖσθε ernst wieder, ohne die Art des Verderbens dogmatisch festzulegen.'
  naturalness: 'Die Formulierung ist modernes, würdiges Standarddeutsch. „Seht: Ich sterbe“ ist als eindringlicher mündlicher Hinweis natürlich; „Langmut“ passt zum gehobenen paränetischen Register und bleibt verständlich.'
  terminology: „Geist der Lüge“, „Zorn“, „Wahrheit“ und „Langmut“ sind präzise und konsistent. Die Wahl vermeidet sowohl eine unzulässige Personalisierung von πνεῦμα als auch eine Abschwächung von θυμός oder ἀπολεῖσθε.
