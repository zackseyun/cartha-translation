base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/005.yaml
  text: If you fall into any loss or ruin, my children, do not be distressed; for this very spirit makes a man desire what is perishable, in order that he may be angered through the distress. And if the loss comes willingly or unwillingly, do not be vexed; for from vexation false anger is born. Moreover, a twofold mischief is anger with falsehood; and they help one another to destroy the heart. And when the soul is continually disturbed, the Lord departs from it[c], and Beliar rules over it.
translation:
  language: de
  text: 'Und nun, meine Kinder: Seht, ich sterbe. Ich sage euch in Wahrheit: Wenn ihr euch nicht vor dem Geist der Lüge und des Zorns hütet und die Wahrheit und die Langmut nicht liebt, werdet ihr zugrunde gehen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξητε ἑαυτούς
  choice: euch … hütet
  rationale: Gibt die reflexive Aufforderung wieder, sich wachsam vor einem schädlichen Einfluss zu bewahren.
- source_word: τὸ πνεῦμα τοῦ ψεύδους καὶ τοῦ θυμοῦ
  choice: der Geist der Lüge und des Zorns
  rationale: Bewahrt die im Griechischen naheliegende Verbindung beider Wesenszüge mit dem einen genannten Geist, ohne sie psychologisch umzudeuten.
- source_word: μακροθυμία
  choice: Langmut
  rationale: Bezeichnet geduldige Selbstbeherrschung und anhaltende Nachsicht; „Langmut“ wahrt diesen Bedeutungsumfang prägnant und würdevoll.
- source_word: ἀπολεῖσθε
  choice: werdet ihr zugrunde gehen
  rationale: Gibt die starke Warnung vor Verderben oder Untergang wieder, ohne die genaue Art des Untergangs festzulegen.
theological_decisions:
- issue: Einheit oder Trennung von Geist, Lüge und Zorn
  choice: „Geist der Lüge und des Zorns“
  alternative: „Geist der Lüge und vor dem Zorn“
  rationale: Die gewählte Fassung folgt der zusammengehörigen Genitivkonstruktion und bewahrt zugleich die personifizierende Sprache des Ausgangstextes.
- issue: Art des angekündigten Untergangs
  choice: nicht näher bestimmtes „zugrunde gehen“
  alternative: „verloren gehen“ oder „vernichtet werden“
  rationale: Der griechische Ausdruck legt nicht ausdrücklich fest, ob leiblicher, sittlicher oder endgültiger Untergang gemeint ist; die Übersetzung hält diese Spannung offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter väterlicher Anrede. Der emphatische Wahrheitsanspruch und die scharfe Warnung des griechischen Fragments bleiben erhalten.
