  source_fidelity: 'Die Vorlage folgt dem griechischen Fragment eng: Anrede, Todesankündigung, Wahrheitsbeteuerung, Warnung vor dem Geist der Lüge und des Zorns sowie die Liebe zu Wahrheit und Langmut sind vorhanden. Allerdings ist die Verneinung im deutschen Bedingungssatz syntaktisch missverständlich: In „wenn ihr euch nicht ... hütet und die Wahrheit ... liebt“ wird das Lieben naheliegend als positiv geforderter Teil der Untergangsbedingung gelesen. Im Griechischen umfasst μή die verbundenen Verbhandlungen: Nicht-Hüten und Nicht-Lieben führen zum Untergang.'
  naturalness: Die Sprache ist insgesamt modernes, würdevolles Standarddeutsch. „Seht“ und „Langmut“ passen zum testamentarischen Register. Die Wiederholung von „nicht“ macht den Satz eindeutig und bleibt idiomatisch.
  terminology: „Geist der Lüge und des Zorns“, „Langmut“ und „zugrunde gehen“ sind quellentreu und bewahren die semantische Offenheit. Keine konfessionell einengende Deutung wird eingeführt.
