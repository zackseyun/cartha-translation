  verdict: revise
  source_fidelity: 'Die Anrede, Todesankündigung, feierliche Bekräftigung und die zentralen Begriffe sind zutreffend wiedergegeben. Die Konstruktion „weder … noch“ ist jedoch zu eng: Sie macht das Verderben nur vom gemeinsamen Ausbleiben beider geforderten Haltungen abhängig. Das Griechische formuliert vielmehr zwei positiv koordinierte Voraussetzungen unter μή; die Warnung gilt, wenn eine dieser Haltungen fehlt.'
  naturalness: Der Text ist insgesamt klares, modernes und würdiges Standarddeutsch. „Seht“ und „Wahrhaftig“ passen zum testamentarischen Register. Die revidierte Konditionalkonstruktion ist idiomatisch und gibt die logische Reichweite ohne eine missverständliche Fußnote wieder.
  terminology: „Geist der Lüge“, „Zorn“, „Wahrheit“, „Langmut“ und „zugrunde gehen“ sind angemessen. „Langmut“ bewahrt den ethischen Gehalt von μακροθυμία, ohne eine konfessionell festgelegte Deutung einzutragen.
