base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/003.yaml
  text: This spirit goes always with falsehood at the right hand of Satan, so that with cruelty and falsehood his works may be accomplished. Understand, therefore, the power of anger, that it is empty. For first it gives provocation by word; then by deeds it strengthens the one who is angry, and with sharp losses it disturbs his mind, and so it stirs up his soul with great wrath.
translation:
  language: de
  text: 'Und nun, meine Kinder: Seht, ich sterbe. Wahrhaftig sage ich euch: Wenn ihr euch nicht sowohl vor dem Geist der Lüge und des Zorns hütet als auch die Wahrheit und die Langmut liebt, werdet ihr zugrunde gehen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξητε ἑαυτούς ἀπό
  choice: euch vor … hütet
  rationale: Gibt die reflexive Schutz- und Wachsamkeitsformulierung natürlich und präzise wieder.
- source_word: τὸ πνεῦμα τοῦ ψεύδους καὶ τοῦ θυμοῦ
  choice: der Geist der Lüge und des Zorns
  rationale: Bewahrt die gemeinsame Zuordnung beider Genitive zu »Geist« und vermeidet eine psychologisierende Umdeutung.
- source_word: μακροθυμία
  choice: Langmut
  rationale: Bezeichnet geduldige Selbstbeherrschung und Nachsicht; »Langmut« wahrt den ethischen und würdevollen Ton des griechischen Begriffs.
- source_word: ἀπολεῖσθε
  choice: werdet ihr zugrunde gehen
  rationale: Gibt die starke Zukunftsaussage wieder, ohne sie unnötig auf körperlichen Tod oder endgültige Verdammnis festzulegen.
theological_decisions:
- issue: Reichweite der Verneinung μή über die verbundenen Verben φυλάξητε und ἀγαπήσητε
  choice: »weder … hütet noch … liebt«
  alternative: »wenn ihr euch nicht … hütet und die Wahrheit und die Langmut liebt«
  rationale: Im Griechischen steht die Verneinung ausdrücklich nur vor dem ersten Verb, doch die Warnlogik und die Koordination sprechen dafür, dass sie beide geforderten Handlungen umfasst. Eine Fußnote macht die formale Mehrdeutigkeit sichtbar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede und die feierliche Todesankündigung bleiben erhalten; »Seht« und »Wahrhaftig« tragen den testamentarischen Ton, ohne altertümliche Satzformen zu verwenden.
