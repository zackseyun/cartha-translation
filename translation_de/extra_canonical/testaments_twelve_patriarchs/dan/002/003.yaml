  - severity: low
    issue: Die Fußnote behauptet eine nicht hinreichend begründete sinngemäße Negationsausweitung
    rationale: Die Anmerkung erklärt die deutsche Verengung nicht neutral, sondern stützt sie. Eine klare deutsche Wiedergabe der Konditionslogik macht die Fußnote entbehrlich.
