review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf trifft den Wortlaut insgesamt gut: ἀποθνῄσκω ist angemessen mit „Ich sterbe“ wiedergegeben; „Geist der Lüge und des Zorns“, „Langmut“ und „zugrunde gehen“ bewahren wesentliche semantische und theologische Offenheit. Die deutsche Negationsverknüpfung muss jedoch den Skopus von ἐὰν μὴ über beide verbundenen Handlungen klar ausdrücken.'
  naturalness: Die Sprache ist modern und würdig. „Seht“ ist als Anrede möglich, doch ein Doppelpunkt nach dem Aufmerksamkeitsruf ist weniger nah am fließenden griechischen Satz als ein Komma. Die vorhandene Fußnote ist zudem sachlich unzutreffend, da ἰδού kein Singular ist.
  terminology: „Langmut“ ist für μακροθυμία präzise und im gegebenen Mahnregister passend. „Zugrunde gehen“ ist eine gute nicht-dogmatisierende Wiedergabe von ἀπολεῖσθε. Die Genitivverbindung bei „Geist der Lüge und des Zorns“ sollte beibehalten werden.
  issues:
  - severity: medium
    issue: Unklarer Skopus der Verneinung in „Wenn ihr euch nicht ... hütet und ... liebt“.
    rationale: 'Das Griechische stellt φυλάξητε und ἀγαπήσητε gemeinsam unter ἐὰν μή: Die geforderte Verbindung lautet, sich zu hüten und Wahrheit sowie Langmut zu lieben. Im Deutschen kann die vorliegende Fassung bedeuten, dass allein das Sich-Hüten verneint, das Lieben aber bejaht wird. „… oder … nicht liebt“ gibt die Konsequenz bei Fehlen einer der beiden Forderungen klar wieder.'
  - severity: low
    issue: Die Fußnote bezeichnet ἰδού fälschlich als Singularform.
    rationale: ἰδού ist ein formelhafter, indeklinabler Aufmerksamkeitsruf und keine Singularform. Da die Übersetzung ohne Anmerkung verständlich und quellentreu ist, wird Anker und Fußnote entfernt.
  revised_text: 'Und nun, meine Kinder, seht, ich sterbe. In Wahrheit sage ich euch: Wenn ihr euch nicht vor dem Geist der Lüge und des Zorns hütet oder die Wahrheit und die Langmut nicht liebt, werdet ihr zugrunde gehen.'
