- from: 'Und nun, meine Kinder, seht[a]: Ich sterbe. In Wahrheit sage ich euch: Wenn ihr euch nicht vor dem Geist der Lüge und des Zorns hütet und die Wahrheit und die Langmut liebt, werdet ihr zugrunde gehen.'
  to: 'Und nun, meine Kinder, seht, ich sterbe. In Wahrheit sage ich euch: Wenn ihr euch nicht vor dem Geist der Lüge und des Zorns hütet oder die Wahrheit und die Langmut nicht liebt, werdet ihr zugrunde gehen.'
