base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002/001.yaml
  text: 'And now[a], my children, behold, I am dying, and I tell you in truth: unless you guard yourselves from the spirit of falsehood and of anger, and love truth and long-suffering, you will perish. For anger is blindness, and it does not allow one to see the face of any man with truth. Even if it is a father or a mother, he behaves toward them as toward enemies; even if it is a brother, he does not recognize him; even if it is a prophet of the Lord, he disobeys him; even if it is a righteous man, he does not regard him; even if it is a friend, he does not acknowledge him. For the spirit of anger surrounds him with the nets of deceit, and blinds his eyes, and through falsehood darkens his mind, and gives him its own peculiar vision. And with what does it surround his eyes? With hatred of heart, so as to be envious of his brother.'
translation:
  language: de
  text: 'Und nun, meine Kinder, seht, ich sterbe. In Wahrheit sage ich euch: Wenn ihr euch nicht vor dem Geist der Lüge und des Zorns hütet oder die Wahrheit und die Langmut nicht liebt, werdet ihr zugrunde gehen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἰδού
  choice: seht
  rationale: Gibt den griechischen Aufmerksamkeitsruf natürlich wieder und bewahrt seinen feierlichen Nachdruck.
- source_word: τὸ πνεῦμα τοῦ ψεύδους καὶ τοῦ θυμοῦ
  choice: der Geist der Lüge und des Zorns
  rationale: Bewahrt die genitivische Formulierung und lässt offen, wie genau Lüge und Zorn diesem Geist zugeordnet sind.
- source_word: μακροθυμία
  choice: Langmut
  rationale: Bezeichnet geduldige Selbstbeherrschung und Nachsicht und bildet den im Griechischen angelegten Gegensatz zu θυμός („Zorn“) deutlicher ab als das allgemeinere „Geduld“.
- source_word: ἀπολεῖσθε
  choice: werdet ihr zugrunde gehen
  rationale: Gibt die ernste Folgeaussage wieder, ohne sie unnötig auf körperlichen Tod oder endgültige Verdammnis festzulegen.
theological_decisions:
- issue: Bezug von „Geist“ auf Lüge und Zorn
  choice: „der Geist der Lüge und des Zorns“
  alternative: „der Geist der Lüge und der Zorn“
  rationale: Die gewählte Fassung folgt der naheliegenden syntaktischen Verbindung und der konsultierten englischen Fassung, ohne den Geist als eigenständige dämonische Person zu bestimmen.
- issue: Bedeutungsumfang von ἀπολεῖσθε
  choice: „werdet ihr zugrunde gehen“
  alternative: „werdet ihr verloren gehen“
  rationale: „Zugrunde gehen“ wahrt die Mehrdeutigkeit zwischen Verderben, Untergang und Tod und vermeidet eine vorschnelle dogmatische Festlegung.
translation_notes:
  register: Moderne, würdige Standardsprache. Kurze Sätze geben die eindringliche Sterberede wieder. Übersetzt wurde der vorgelegte griechische Vers; der darüber hinausgehende Text der englischen Konsultationsfassung ist in der angegebenen griechischen Versquelle nicht enthalten.
