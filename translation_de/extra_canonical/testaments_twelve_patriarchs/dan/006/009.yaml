source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ ἃ ἠκούσατε³⁸ παρὰ τοῦ πατρὸς ὑμῶν, μεταδοτε³⁹ ⌈καὶ⁴⁰ ὑμεῖς⁴¹⌉ τοῖς τέκνοις ὑμῶν⁴², [ἵνα δέξηται⁴³ ὑμᾶς ὁ Σωτὴρ⁴⁴ τῶν ἐθνῶν· *ἐστὶ γὰρ ἀληθὴς καὶ μακρόθυμος, πρᾷος καὶ ταπεινός⁴⁵, καὶ⁴⁶ ἐκδιδάσκων⁴⁷ διὰ τῶν ἔργων *τὸν νόμον Κυρίου⁴⁸].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/009.yaml
  text: And what you have heard from your father, pass on also to your children, so that the Savior of the nations may receive you; for he is true and patient, gentle and humble, and by his works he teaches the law of the Lord[a].
translation:
  language: de
  text: Und was ihr von eurem Vater gehört habt, gebt auch ihr euren Kindern weiter, [damit der Retter der Völker euch annimmt; denn er ist wahrhaftig und geduldig, sanftmütig und demütig, und durch seine Taten lehrt er das Gesetz des Herrn][a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der eingeklammerte Satzteil wird häufig als spätere Erweiterung oder Einfügung angesehen; er ist hier übersetzt, weil er in dem zugrunde gelegten griechischen Textzeugen steht.
    reason: textual_variant
lexical_decisions:
- source_word: μεταδοτε
  choice: gebt … weiter
  rationale: Gibt den Aufforderungscharakter und den Sinn des Übermittelns an die nächste Generation in natürlichem modernem Deutsch wieder.
- source_word: ὁ Σωτὴρ τῶν ἐθνῶν
  choice: der Retter der Völker
  rationale: Bewahrt die mögliche kollektive Bedeutung von ἔθνη, ohne sie enger als „Heiden“ konfessionell oder ethnisch festzulegen.
- source_word: δέξηται
  choice: annimmt
  rationale: Entspricht dem semantischen Bereich von „aufnehmen/annehmen“ und klingt im gegebenen persönlichen Zusammenhang natürlich.
- source_word: μακρόθυμος
  choice: geduldig
  rationale: Vermittelt die hier gemeinte Langmut in allgemein verständlicher Sprache.
- source_word: ἐκδιδάσκων διὰ τῶν ἔργων
  choice: durch seine Taten lehrt er
  rationale: Bewahrt sowohl das Lehren als auch dessen Vermittlung durch praktisches Handeln.
theological_decisions:
- issue: Bezeichnung σωτήρ in Verbindung mit den Völkern
  choice: „Retter der Völker“ ohne nähere Identifizierung
  alternative: „Heiland der Heiden“ oder ausdrückliche Identifizierung mit Christus
  rationale: Der griechische Text nennt die Gestalt nicht ausdrücklich beim Namen; die Übersetzung wahrt diese Offenheit.
- issue: Textkritischer Status des abschließenden Satzteils
  choice: Im Haupttext übersetzt und mit einer Fußnote gekennzeichnet
  alternative: Auslassung oder sichtbare eckige Klammern im Bibeltext
  rationale: Der Satzteil steht im bereitgestellten griechischen Zeugen, gilt jedoch häufig als spätere Erweiterung; die Fußnote macht beides transparent.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gebt … weiter“ ist idiomatisch und klar; „wahrhaftig“, „sanftmütig“ und „demütig“ bewahren den feierlichen ethischen Ton. Die griechische Satzverknüpfung bleibt erhalten, indem der umstrittene Teil als Zwecksatz an den vorausgehenden Auftrag angeschlossen wird.
