source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Αὐτὸς γὰρ¹⁵ ὁ ἄγγελος *τῆς εἰρήνης¹⁶ *ἐνισχύσει τὸν Ἰσραὴλ¹⁷ μὴ ἐμπεσεῖν¹⁸ αὐτὸν εἰς τέλος¹⁹ κακῶν²⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/005.yaml
  text: For he himself, the angel of peace, will strengthen Israel so that it will not fall into uttermost evils.
translation:
  language: de
  text: Denn er selbst, der Engel des Friedens, wird Israel stärken, damit es nicht in die äußersten Übel fällt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »damit es nicht völlig in Übel fällt«. Die Wendung εἰς τέλος κακῶν kann entweder die Übel als äußerste Steigerung bezeichnen oder das Hineinfallen als vollständig verstärken.'
    reason: Die Fußnote erhält die semantische Mehrdeutigkeit von εἰς τέλος, während der Haupttext die im englischen Audit gewählte, pluralische Lesart von κακῶν abbildet.
lexical_decisions:
- source_word: Αὐτὸς γὰρ ὁ ἄγγελος τῆς εἰρήνης
  choice: Denn er selbst, der Engel des Friedens
  rationale: Αὐτός wird durch »er selbst« emphatisch wiedergegeben; der Genitiv τῆς εἰρήνης entspricht natürlich und genau »des Friedens«.
- source_word: ἐνισχύσει
  choice: wird … stärken
  rationale: Das Futur bezeichnet die zugesagte künftige Stärkung.
- source_word: τὸν Ἰσραήλ … αὐτόν
  choice: Israel … es
  rationale: Das Pronomen nimmt Israel auf. Im heutigen Deutschen ist bei der Bezeichnung des Volkes das sächliche Pronomen natürlich, während das griechische Maskulinum grammatisch mit Ἰσραήλ übereinstimmt.
- source_word: μὴ ἐμπεσεῖν … εἰς τέλος κακῶν
  choice: damit es nicht völlig dem Bösen verfällt
  rationale: ἐμπίπτειν εἰς kann ein Hineingeraten oder Verfallen ausdrücken. εἰς τέλος verstärkt dies im Sinn von »völlig/letztlich«; der substantivierte Plural κακῶν wird idiomatisch kollektiv als »dem Bösen« wiedergegeben.
theological_decisions:
- issue: Identität des »Engels des Friedens«
  choice: Die Bezeichnung bleibt ohne nähere Identifizierung stehen.
  alternative: Den Engel ausdrücklich mit einer bestimmten himmlischen oder messianischen Gestalt identifizieren.
  rationale: Der griechische Text liefert in diesem Vers keine solche nähere Identifizierung.
- issue: Reichweite von εἰς τέλος κακῶν
  choice: »völlig dem Bösen verfällt«
  alternative: »in die äußersten Übel fällt«
  rationale: Die gewählte Fassung wahrt den Gedanken eines vollständigen Hineingeratens, vermeidet aber eine im Deutschen unnatürliche räumliche Formulierung. Die mögliche stärker wörtliche Deutung wird in der Fußnote erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, während »dem Bösen verfallen« die schwerfällige wörtliche Konstruktion idiomatisch wiedergibt.
