source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἀπόστητε οὖν ἀπὸ πάσης ἀδικίας καὶ κολλήθητε⁴⁹ τῇ δικαιοσύνῃ τοῦ⁵⁰ Θεοῦ⁵¹, καὶ ἔσται τὸ γένος ὑμῶν⁵² εἰς σωτηρίαν *ἕως τοῦ αἰῶνος⁵³. 11. *Καὶ θάψατέ με⁵⁴ ἐγγὺς τῶν πατέρων μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/010.yaml
  text: Therefore depart from all unrighteousness and cling to the righteousness of God, and your offspring will be for salvation forever. And bury me near my fathers.
translation:
  language: de
  text: Darum wendet euch von aller Ungerechtigkeit ab und haltet an der Gerechtigkeit Gottes fest; und euer Geschlecht wird für immer zum Heil sein. Und begrabt mich nahe bei meinen Vätern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀπόστητε
  choice: wendet euch … ab
  rationale: Gibt den imperativischen Aufruf zur entschiedenen Abkehr in natürlichem, modernem Deutsch wieder.
- source_word: κολλήθητε
  choice: haltet … fest
  rationale: Bewahrt das Bild einer engen, beständigen Bindung, ohne im Deutschen unnatürlich wörtlich „klebt“ zu sagen.
- source_word: δικαιοσύνῃ τοῦ Θεοῦ
  choice: Gerechtigkeit Gottes
  rationale: Formale und theologisch offene Wiedergabe des Genitivs; dessen genaue Beziehung wird nicht näher festgelegt.
- source_word: τὸ γένος ὑμῶν
  choice: euer Geschlecht
  rationale: Erfasst die kollektive Abstammungslinie; „Geschlecht“ passt zum patriarchalischen Kontext besser als das enger biologische „Nachkommen“.
- source_word: εἰς σωτηρίαν
  choice: zum Heil
  rationale: Bewahrt die ungewöhnliche Ziel- beziehungsweise Ergebnisformulierung des Griechischen, statt sie zu „gerettet werden“ zu glätten.
- source_word: ἕως τοῦ αἰῶνος
  choice: für immer
  rationale: Natürliche deutsche Wiedergabe der temporalen Wendung mit dauerhaftem Sinn.
- source_word: πατέρων μου
  choice: meinen Vätern
  rationale: Behält die patriarchalische Familienbezeichnung und den Bezug auf die Vorfahren bei.
theological_decisions:
- issue: Bedeutung von „Gerechtigkeit Gottes“
  choice: Gerechtigkeit Gottes
  alternative: die von Gott geforderte Gerechtigkeit / Gottes gerechter Ordnung
  rationale: Der griechische Genitiv bleibt mehrdeutig und kann Ursprung, Zugehörigkeit oder Maßstab bezeichnen; die Übersetzung entscheidet dies nicht.
- issue: Aussage über das Geschlecht und das Heil
  choice: euer Geschlecht wird … zum Heil sein
  alternative: euer Geschlecht wird … gerettet werden
  rationale: Die Konstruktion εἰς σωτηρίαν bezeichnet nicht ausdrücklich den passiven Empfang von Rettung. Die gewählte Fassung wahrt die mögliche Bedeutung, dass das Geschlecht heilbringend beziehungsweise dem Heil dienend sein wird.
- issue: Dauerangabe ἕως τοῦ αἰῶνος
  choice: für immer
  alternative: bis in Ewigkeit
  rationale: „Für immer“ ist modern und verständlich, ohne eine detaillierte Lehre über Ewigkeit oder Weltzeitalter in die Wendung hineinzulesen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, direkt ermahnendem Ton. Der Satzbau bleibt nahe am griechischen Gedankengang, wird aber durch Semikolon und natürliche deutsche Wendungen gut lesbar gestaltet. Verszahlen und textkritische Editionszeichen werden nicht in den Lesetext übernommen.
