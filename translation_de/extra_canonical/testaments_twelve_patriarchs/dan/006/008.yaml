id: T12P.DAN.6.8
reference: Testament of Dan 6:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Διατηρήσατε οὖν³³ ἑαυτούς³⁵, τέκνα μου, ἀπὸ παντὸς *ἔργου πονηροῦ³⁶, καὶ ἀπορρίψατε *ἀφ᾽ ὑμῶν τὸν θυμὸν καὶ τὸ ψεῦδος³⁷, ⌜καὶ ἀγαπήσατε τὴν ἀλήθειαν καὶ τὴν μακροθυμίαν⌝.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/008.yaml
  text: Keep yourselves, then, my children, from every evil work, and cast away from yourselves anger and falsehood, and love truth and patience.
translation:
  language: de
  text: Hütet euch also, meine Kinder, vor jedem bösen Tun, und legt Zorn und Lüge ab. Liebt die Wahrheit und die Geduld.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διατηρήσατε ἑαυτούς
  choice: Hütet euch
  rationale: Gibt den reflexiven Imperativ im heutigen Deutsch natürlich wieder und bewahrt den Sinn eines wachsamen Sich-Fernhaltens.
- source_word: παντὸς ἔργου πονηροῦ
  choice: vor jedem bösen Tun
  rationale: „Tun“ ist natürlich und umfasst einzelne Handlungen wie auch böse Betätigung; „jedem“ bewahrt den umfassenden Sinn von παντός.
- source_word: ἀπορρίψατε ἀφ᾽ ὑμῶν
  choice: legt ... ab
  rationale: Die idiomatische Wendung vermittelt das entschiedene Entfernen von sich selbst, ohne unnötig körperlich zu klingen.
- source_word: θυμὸν
  choice: Zorn
  rationale: Bezeichnet hier heftigen Zorn beziehungsweise Erregung; „Zorn“ passt zum ethischen Mahnwort und ist würdevoll sowie verständlich.
- source_word: ψεῦδος
  choice: Lüge
  rationale: Bewahrt den direkten Gegensatz zur nachfolgenden „Wahrheit“.
- source_word: μακροθυμίαν
  choice: Geduld
  rationale: Bezeichnet Langmut beziehungsweise geduldige Selbstbeherrschung; „Geduld“ ist im modernen Standarddeutsch am unmittelbarsten verständlich.
theological_decisions:
- issue: Bedeutungsumfang von μακροθυμία
  choice: Geduld
  alternative: Langmut
  rationale: „Langmut“ bildet die innere Wortstruktur traditioneller ab, wirkt heute jedoch gehoben und weniger unmittelbar. „Geduld“ lässt die Tugend offen, ohne sie konfessionell oder dogmatisch einzuengen.
translation_notes:
  register: Moderne, würdige und direkt verständliche Mahnrede. Die Anrede „meine Kinder“ und die imperativische Struktur bleiben erhalten; der lange griechische Satz wird zur besseren deutschen Lesbarkeit in zwei Sätze gegliedert.
