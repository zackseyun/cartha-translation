  source_fidelity: 'Die Übersetzung gibt die Abfolge und die Imperative des griechischen Textes zuverlässig wieder: Selbstbewahrung vor jedem bösen Tun, entschlossenes Ablegen von Zorn und Lüge sowie Liebe zu Wahrheit und μακροθυμία. „Hütet euch“ ist für Διατηρήσατε ἑαυτούς in dieser Mahnrede idiomatisch und sinnentsprechend. Die Auslassung einer wörtlichen Wiedergabe von ἀφ᾽ ὑμῶν in „legt ... ab“ ist im Deutschen ohne Bedeutungsverlust idiomatisch gedeckt.'
