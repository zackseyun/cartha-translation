id: T12P.DAN.6.3
reference: Testament of Dan 6:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Διὰ¹⁰ τοῦτο σπουδάζει ὁ ἐχθρὸς ὑποσκελίζειν¹¹ πάντας τοὺς ἐπικαλουμένους *τὸν Κύριον¹².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/003.yaml
  text: Because of this the enemy is eager to trip up all who call on the Lord.
translation:
  language: de
  text: Deshalb ist der Feind eifrig darauf aus, allen ein Bein zu stellen, die den Herrn anrufen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διὰ τοῦτο
  choice: Deshalb
  rationale: Gibt die kausale Rückverweisung knapp und natürlich wieder.
- source_word: σπουδάζει
  choice: ist eifrig darauf aus
  rationale: Bewahrt den Gedanken zielstrebigen, intensiven Bemühens, ohne bloß eine momentane Absicht auszudrücken.
- source_word: ὁ ἐχθρός
  choice: der Feind
  rationale: Entspricht der bestimmten Bezeichnung im Griechischen und lässt die Identität des Feindes wie im Ausgangstext unausgeführt.
- source_word: ὑποσκελίζειν
  choice: ein Bein zu stellen
  rationale: Das Verb bezeichnet wörtlich beziehungsweise bildlich das Zu-Fall-Bringen durch Beinstellen; die deutsche Wendung bewahrt das anschauliche Bild.
- source_word: πάντας τοὺς ἐπικαλουμένους τὸν Κύριον
  choice: allen …, die den Herrn anrufen
  rationale: Gibt die umfassende Aussage und die religiöse Bedeutung von ἐπικαλεῖσθαι natürlich und präzise wieder.
theological_decisions:
- issue: Identität des »Feindes«
  choice: Keine nähere Identifizierung im Text
  alternative: Ausdrückliche Gleichsetzung mit Satan oder dem Teufel
  rationale: Der griechische Vers sagt lediglich »der Feind«; eine genauere Bestimmung würde eine Auslegung in die Übersetzung eintragen.
- issue: Bedeutung von »den Herrn anrufen«
  choice: Die offene Formulierung »den Herrn anrufen« beibehalten
  alternative: Zu »zum Herrn beten« oder »sich zum Herrn bekennen« präzisieren
  rationale: ἐπικαλουμένους kann Gebet, Anrufung und Bekenntnis einschließen; die Übersetzung bewahrt diese Bedeutungsbreite.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die idiomatische Wendung »ein Bein stellen« erhält das konkrete Bild des griechischen Verbs und passt zum bildhaften Sinn des Vereitelns beziehungsweise Zu-Fall-Bringens.
