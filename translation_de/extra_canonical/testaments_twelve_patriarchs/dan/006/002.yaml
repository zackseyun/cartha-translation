source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἐγγίσατε⁴ τῷ θεῷ καὶ τῷ ἀγγέλῳ *τῷ παραιτουμένῳ ὑμᾶς⁵· ὅτι οὗτός ἐστι μεσίτης θεοῦ καὶ ἀνθρώπων καὶ⁶ ἐπὶ τῆς εἰρήνης τοῦ⁷ Ἰσραὴλ κατέναντι⁸ *τῆς βασιλείας τοῦ †θεοῦ στήσεται⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/002.yaml
  text: Draw near to God and to the angel who intercedes for you, for he is a mediator between God and men[a], and for the peace of Israel he will stand against the kingdom of the enemy.
translation:
  language: de
  text: Naht euch Gott und dem Engel, der euch eindringlich bittet. Denn er ist Mittler zwischen Gott und Menschen[a], und um des Friedens Israels willen wird er dem Reich Gottes[b] gegenübertreten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung »Mittler zwischen Gott und Menschen« folgt unmittelbar dem griechischen Text. Da die Stelle weiterhin von einem »Engel« spricht, wird diese Spannung nicht durch die Gleichsetzung mit einer späteren theologischen Gestalt aufgelöst.
    reason: lexical_alternative
  - marker: b
    text: Wörtlich steht im überlieferten griechischen Text »dem Reich Gottes gegenüber«. Die Lesart »Gottes« ist in der Ausgabe als vermutlich verderbt gekennzeichnet; »des Feindes« ist eine sinngemäße Konjektur, steht aber nicht im vorliegenden griechischen Wortlaut. Auch »gegenübertreten« kann je nach Zusammenhang bloßes Gegenüberstehen oder Widerstand ausdrücken.
    reason: textual_ambiguity
lexical_decisions:
- source_word: Ἐγγίσατε
  choice: Kommt … nahe
  rationale: Gibt den Aoristimperativ von ἐγγίζω als unmittelbare Aufforderung in natürlichem Deutsch wieder.
- source_word: τῷ ἀγγέλῳ τῷ παραιτουμένῳ ὑμᾶς
  choice: dem Engel, der euch eindringlich ermahnt
  rationale: παραιτουμένῳ kann ein inständiges Bitten oder Mahnen bezeichnen; ὑμᾶς ist das direkte Objekt. Daher ist »euch ermahnt« quellennäher als »für euch eintritt«.
- source_word: μεσίτης θεοῦ καὶ ἀνθρώπων
  choice: Mittler zwischen Gott und Menschen
  rationale: Bewahrt die auffällige, direkte Aussage des griechischen Textes, ohne den genannten Engel mit einer späteren Lehrfigur gleichzusetzen.
- source_word: κατέναντι … στήσεται
  choice: wird … gegenübertreten
  rationale: κατέναντι kann räumlich »gegenüber/vor« und kontextabhängig auch gegensätzlich »entgegen« bedeuten. »Gegenübertreten« erhält diese Spannung besser als das eindeutig feindliche »sich entgegenstellen«.
- source_word: τῆς βασιλείας τοῦ θεοῦ
  choice: dem Reich Gottes
  rationale: Übersetzt den überlieferten Wortlaut, obwohl θεοῦ im Ausgangstext als textkritisch problematisch gekennzeichnet ist; die nicht belegte Ersetzung durch »des Feindes« wird nicht in den Haupttext aufgenommen.
theological_decisions:
- issue: Bezeichnung des Engels als Mittler zwischen Gott und Menschen
  choice: Die Formulierung wird wörtlich beibehalten und in einer Fußnote als ungelöste Spannung erläutert.
  alternative: Den Engel ausdrücklich mit einer späteren theologischen Gestalt identifizieren.
  rationale: Der Text nennt einen Engel; eine weitergehende Identifizierung wäre nicht durch den vorliegenden griechischen Wortlaut gedeckt.
- issue: Der Engel und das Reich Gottes
  choice: Der überlieferte Ausdruck »dem Reich Gottes gegenübertreten« bleibt erhalten.
  alternative: Nach der englischen Konsultationsfassung »gegen das Reich des Feindes« übersetzen.
  rationale: Im bereitgestellten griechischen Text steht θεοῦ, wenn auch mit einem textkritischen Kreuz als vermutlich verderbte Lesart. Die Übersetzung darf eine nicht überlieferte Konjektur nicht stillschweigend zum Haupttext machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Aufforderung bleibt direkt, die ungewöhnlichen Aussagen über den Engel und das Reich Gottes werden weder geglättet noch konfessionell erklärt. »Eindringlich ermahnt« bildet den bittend-mahnenden Sinn von παραιτεῖσθαι verständlich ab.
