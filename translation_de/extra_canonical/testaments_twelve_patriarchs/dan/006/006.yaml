source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἔσται δὲ ἐν καιρῷ τῆς²¹ ἀνομίας²² *τοῦ Ἰσραὴλ²³ (οὐκ ἔσται)²⁴ ἀφιστάμενος²⁵ *ἀπ᾽ αὐτῶν²⁶ *ὁ Κύριος²⁷, καὶ²⁸ *μετελεύσεται ἐπ᾽ ἔθνει ζητοῦντι τὸ θέλημα αὐτοῦ²⁹, ὅτι *οὐδεὶς τῶν ἀγγέλων ἔσται ἴσος αὐτῷ³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/006.yaml
  text: But in the time of Israel’s lawlessness, the Lord will not depart from them, but will pass over to a nation that seeks his will, for none of the angels will be equal to him[a].
translation:
  language: de
  text: Doch in der Zeit der Gesetzlosigkeit Israels wird der Herr nicht von ihnen weichen, sondern zu einem Volk hinübergehen, das seinen Willen sucht; denn keiner der Engel wird ihm gleich sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Textzeile ist schwierig: In der vorliegenden Fassung heißt es, der Herr werde „nicht von ihnen weichen“ und dennoch „zu einem Volk hinübergehen, das seinen Willen sucht“. Die Übersetzung bewahrt diese Spannung, statt sie auszugleichen.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἀνομίας
  choice: Gesetzlosigkeit
  rationale: Gibt den bewussten Verstoß gegen Gottes Ordnung präziser wieder als das allgemeinere „Bosheit“.
- source_word: ἀφιστάμενος ἀπ᾽ αὐτῶν
  choice: von ihnen weichen
  rationale: Bewahrt die räumlich-relational gefasste Aussage des griechischen Verbs und die Verneinung des überlieferten Textes.
- source_word: μετελεύσεται ἐπ᾽ ἔθνει
  choice: zu einem Volk hinübergehen
  rationale: Erhält die Bewegungsmetaphorik und den auffälligen Gegensatz zum vorherigen Nicht-Weichen.
- source_word: ζητοῦντι τὸ θέλημα αὐτοῦ
  choice: das seinen Willen sucht
  rationale: Folgt eng dem griechischen Ausdruck und lässt offen, ob das Suchen Erkenntnis oder gehorsame Ausrichtung betont.
- source_word: ἴσος αὐτῷ
  choice: ihm gleich
  rationale: Entspricht unmittelbar dem Vergleichsausdruck, ohne die Art der Gleichheit näher festzulegen.
theological_decisions:
- issue: Spannung zwischen dem Nicht-Weichen des Herrn von Israel und seinem Hinübergehen zu einem anderen Volk
  choice: Beide Aussagen werden ohne Harmonisierung nebeneinandergestellt.
  alternative: Die erste Aussage textkritisch umkehren („wird von ihnen weichen“) oder das Hinübergehen abschwächen.
  rationale: Der vorgelegte griechische Text enthält ausdrücklich οὐκ ἔσται und erzeugt damit eine echte Spannung, die nicht stillschweigend aufgelöst werden soll.
- issue: Bezug von αὐτῷ im Schlussglied
  choice: „ihm“ bezieht sich grammatisch auf den Herrn.
  alternative: Den Bezug durch eine auslegende Umschreibung näher bestimmen.
  rationale: Der natürliche Rückbezug gilt dem Herrn; die Übersetzung vermeidet darüber hinausgehende christologische oder ontologische Präzisierungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gesetzlosigkeit“ und „hinübergehen“ halten sich bewusst eng an die griechische Ausdrucksweise; der Satz bleibt trotz der textlichen Spannung verständlich.
