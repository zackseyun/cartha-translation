  source_fidelity: 'Die Übersetzung gibt alle Elemente des griechischen Textes angemessen wieder: δέ als leicht kontrastierendes „aber“, das possessive „sein Name“, ἐν παντὶ τόπῳ Ἰσραήλ als „an jedem Ort Israels“ und ἐν τοῖς ἔθνεσιν als „unter den Völkern“. Das im Griechischen elliptische Prädikat wird in idiomatischem Deutsch zurückhaltend mit „wird … sein“ ergänzt, ohne die Aussage zu „bekannt“ oder „berühmt“ auszudeuten. Dies entspricht auch dem englischen Audit-Trail.'
