  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/007.yaml
  text: And his name will be in every place in Israel and among the nations.
translation:
  language: de
  text: Sein Name aber wird an jedem Ort Israels und unter den Völkern sein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Im Griechischen steht kein ausdrückliches Verb; wörtlich: „Sein Name aber an jedem Ort Israels und unter den Völkern.“'
    reason: Kennzeichnet die für einen vollständigen deutschen Satz notwendige, aber im Ausgangstext nicht ausdrücklich vorhandene Ergänzung.
lexical_decisions:
- source_word: Τὸ δὲ ὄνομα αὐτοῦ
  choice: Sein Name aber
  rationale: Gibt die Genitivverbindung und das leicht kontrastierende δέ knapp und formnah wieder.
- source_word: ἐν παντὶ τόπῳ Ἰσραήλ
  choice: an jedem Ort Israels
  rationale: Bewahrt die distributive Bedeutung von παντί und versteht Ἰσραήλ als nähere Bestimmung zu „Ort“, ohne „überall“ verallgemeinernd einzusetzen.
- source_word: καὶ ἐν τοῖς ἔθνεσιν
  choice: und unter den Völkern
  rationale: „Unter den Völkern“ ist im Deutschen natürlich und erhält den pluralischen, nicht auf ein einzelnes Volk begrenzten Sinn von ἔθνεσιν.
theological_decisions:
- issue: Im griechischen Satz fehlt ein ausdrückliches Verb.
  choice: „wird … sein“ wird entsprechend dem unmittelbaren Sinn ergänzt und durch eine Fußnote kenntlich gemacht.
  alternative: Nominalsatz ohne Verb oder eine inhaltlich bestimmtere Ergänzung wie „wird bekannt sein“.
  rationale: Ein deutscher Hauptsatz benötigt hier ein Prädikat. „Sein“ fügt möglichst wenig Deutung hinzu; „bekannt sein“ würde eine mögliche Bedeutung festlegen, die der griechische Wortlaut nicht ausdrücklich nennt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knapper, formnaher Satzstruktur. Die ungewöhnliche Aussage, der Name werde dort „sein“, bleibt erhalten, statt sie als „bekannt“ oder „berühmt“ auszudeuten.
