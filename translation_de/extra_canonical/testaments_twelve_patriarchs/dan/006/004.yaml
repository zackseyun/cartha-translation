source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Οἶδε γὰρ ὅτι *ἐν ᾗ ἡμέρᾳ¹³ ἐπιστρέψει¹⁴ Ἰσραήλ, συντελεσθήσεται ἡ βασιλεία τοῦ ἐχθροῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/004.yaml
  text: For he knows that on the day when Israel turns back, the kingdom of the enemy will be brought to an end.
translation:
  language: de
  text: 'Denn er weiß: An dem Tag, an dem Israel umkehrt, wird die Herrschaft des Feindes zu Ende gehen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστρέψει
  choice: umkehrt
  rationale: Das Verb bezeichnet hier Israels Rückkehr beziehungsweise Umkehr; „umkehrt“ bewahrt im Deutschen sowohl die Richtungsänderung als auch den möglichen geistlichen Sinn.
- source_word: συντελεσθήσεται
  choice: wird … zu Ende gehen
  rationale: Die passive Form drückt aus, dass die Herrschaft ihren Abschluss beziehungsweise ihr Ende erreicht. Die Formulierung ist natürlich und lässt den Handelnden wie im Griechischen ungenannt.
- source_word: ἡ βασιλεία τοῦ ἐχθροῦ
  choice: die Herrschaft des Feindes
  rationale: βασιλεία kann sowohl „Königreich“ als auch „Herrschaft“ bedeuten. Im Zusammenhang mit dem Ende feindlicher Macht ist „Herrschaft“ idiomatisch und vermeidet die unnötige Festlegung auf ein räumliches Reich.
theological_decisions:
- issue: Art der Umkehr Israels
  choice: „Israel umkehrt“ ohne nähere Bestimmung
  alternative: „Israel zurückkehrt“
  rationale: Der griechische Ausdruck kann eine Rückkehr oder eine religiös-moralische Umkehr bezeichnen. „Umkehrt“ erhält diese theologische Offenheit, ohne ein Ziel oder einen Vorgang hinzuzufügen.
- issue: Urheber des Endes der feindlichen Herrschaft
  choice: 'unpersönlich: „wird … zu Ende gehen“'
  alternative: „wird [Gott] die Herrschaft des Feindes beenden“
  rationale: Der griechische Passivsatz nennt keinen Handelnden. Die Übersetzung ergänzt daher Gott nicht ausdrücklich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt nach „weiß“ führt den gewussten Sachverhalt natürlich ein; die Satzstruktur bleibt eng am griechischen Gedankengang.
