source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: VI. Καὶ νῦν *φοβήθητε τὸν Κύριον¹, τέκνα μου, καὶ προσέχετε ἑαυτοῖς² ἀπὸ τοῦ Σατανᾶ καὶ *τῶν πνευμάτων³ αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006/001.yaml
  text: And now, my children, fear the Lord, and watch yourselves against Satan and his spirits.
translation:
  language: de
  text: Und nun, meine Kinder, fürchtet den Herrn und hütet euch vor dem Satan und seinen Geistern.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φοβήθητε
  choice: fürchtet
  rationale: Bewahrt die direkte Aufforderung und den religiösen Ernst des griechischen Verbs; „fürchtet“ ist im Deutschen verständlich und würdevoll.
- source_word: προσέχετε ἑαυτοῖς ἀπό
  choice: hütet euch vor
  rationale: Gibt die reflexive Warnform natürlich und idiomatisch wieder, ohne die Aussage abzuschwächen.
- source_word: τοῦ Σατανᾶ
  choice: dem Satan
  rationale: Der bestimmte Artikel wird in der deutschen Fügung „vor dem Satan“ formal sichtbar gehalten.
- source_word: τῶν πνευμάτων αὐτοῦ
  choice: seinen Geistern
  rationale: Entspricht knapp dem Plural πνευμάτων und dem possessiven αὐτοῦ, ohne die Art dieser Geister näher zu bestimmen.
theological_decisions:
- issue: Bedeutungsumfang von φοβήθητε gegenüber Gott
  choice: fürchtet den Herrn
  alternative: habt Ehrfurcht vor dem Herrn
  rationale: „Fürchtet“ bewahrt die mögliche Spannung zwischen Furcht und Ehrfurcht und legt den Ausdruck nicht einseitig aus.
- issue: Identität der πνεύματα Satans
  choice: Geister
  alternative: böse Geister
  rationale: Das Adjektiv „böse“ steht nicht ausdrücklich im griechischen Text; die Zugehörigkeit zu Satan bleibt als einzige nähere Bestimmung erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede „meine Kinder“ und die parallelen Imperative bleiben erhalten; die idiomatische Wendung „hütet euch vor“ gibt die griechische Warnung natürlich wieder.
