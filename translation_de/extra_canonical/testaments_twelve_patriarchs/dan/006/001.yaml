  source_fidelity: Der Entwurf gibt beide Imperative sowie ihre Adressaten und Objekte vollständig wieder. „Fürchtet den Herrn“ entspricht φοβήθητε τὸν Κύριον ohne die Gottesfurcht zu einer bloßen Ehrfurchtsformel einzuengen. „Hütet euch vor“ ist eine natürliche und treffende Wiedergabe von προσέχετε ἑαυτοῖς ἀπό. Der Plural „seinen Geistern“ bildet τῶν πνευμάτων αὐτοῦ genau ab und fügt keine Charakterisierung hinzu.
  naturalness: Flüssiges modernes Standarddeutsch in angemessen würdigem paränetischem Register. Die Stellung von „meine Kinder“ ist im Deutschen natürlich; die parallele Imperativstruktur bleibt klar.
  terminology: „Herr“, „Satan“ und „Geister“ sind etablierte, quellennah verwendete Begriffe. Die Formulierung vermeidet die unbelegte Ergänzung „böse“ bei den Geistern. Es sind keine Fußnotenanker im Ausgangstext vorhanden, die in der Übersetzung abzubilden wären.
