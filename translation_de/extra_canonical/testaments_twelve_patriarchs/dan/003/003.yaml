base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/003.yaml
  text: Even if it is a father or a mother, it regards them as enemies. If it is a brother, it does not know him. If it is a prophet of the Lord, it disobeys him; if a righteous man, it does not see him; if a friend, it does not recognize him.
translation:
  language: de
  text: Denn selbst wenn es der Vater oder die Mutter ist, betrachtet er sie als Feinde. Ist es ein Bruder, kennt er ihn nicht. Ist es ein Prophet des Herrn, gehorcht er ihm nicht; ist es ein Gerechter, sieht er ihn nicht; ist es ein Freund, erkennt er ihn nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς πολεμίοις προσέχει αὐτοῖς
  choice: sieht er in ihnen Feinde
  rationale: Gibt die feindselige Haltung der Wendung mit προσέχω und Dativ natürlich wieder, ohne über das Bild hinaus ein konkretes Handeln einzutragen.
- source_word: παρακούει
  choice: hört er nicht auf ihn
  rationale: Bewahrt den Sinn des Nicht-Hörens beziehungsweise Nicht-Gehorchens und klingt im Deutschen natürlich.
- source_word: οὐ βλέπει
  choice: sieht er ihn nicht
  rationale: Entspricht dem einfachen βλέπει enger als eine deutende Wiedergabe wie „beachtet ihn nicht“.
- source_word: οὐ γνωρίζει
  choice: erkennt er ihn nicht
  rationale: Unterscheidet γνωρίζει angemessen vom vorherigen οἶδεν („kennt“).
theological_decisions:
- issue: Nicht ausdrücklich genanntes Subjekt der Verben
  choice: Wiedergabe mit „er“
  alternative: Unpersönliche Formulierungen oder „es“
  rationale: Das Griechische nennt das handelnde Subjekt in diesem Vers nicht erneut; die maskuline deutsche Form lässt es aus dem Zusammenhang ergänzen, ohne eine zusätzliche theologische Identifikation in den Text einzuführen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzfolge des Griechischen bleibt erhalten; „sieht er ihn nicht“ wahrt die bewusst schlichte und möglicherweise bildhafte Aussage.
