base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/005.yaml
  text: And with what does it cover his eyes? With hatred of heart against his brother, unto envy.
translation:
  language: de
  text: Und womit bedeckt er seine Augen? Mit Hass im Herzen gegen seinen Bruder, zum Neid.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περιβάλλει
  choice: umhüllt
  rationale: Gibt das Bild des Umgebens oder Bedeckens der Augen direkt und in natürlichem Deutsch wieder.
- source_word: μίσει καρδίας
  choice: Hass im Herzen
  rationale: Bewahrt sowohl den Hass als auch das Herz als dessen inneren Sitz, ohne die im Deutschen schwerfällige Formulierung „Hass des Herzens“.
- source_word: κατὰ τοῦ ἀδελφοῦ αὐτοῦ
  choice: gegen seinen Bruder
  rationale: Direkte und idiomatische Wiedergabe der feindlichen Ausrichtung von κατά mit Genitiv.
- source_word: εἰς φθόνον
  choice: bis hin zum Neid
  rationale: Erhält die Ziel- oder Resultatsrichtung von εἰς, ohne eindeutig festzulegen, ob Neid als Zweck, Entwicklung oder Folge gemeint ist.
theological_decisions:
- issue: Verhältnis von Hass und Neid
  choice: bis hin zum Neid
  alternative: zum Neid / sodass Neid entsteht
  rationale: Die knappe griechische Wendung εἰς φθόνον bleibt mehrdeutig; die Übersetzung wahrt die gerichtete Beziehung, ohne sie als eindeutige Kausalfolge auszulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und das körperlich-moralische Bild der verhüllten Augen bleiben erhalten; die knappe, spannungsreiche Aussage wird nicht erläuternd erweitert.
