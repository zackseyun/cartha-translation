  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/001.yaml
  text: '...truth and long-suffering, you will perish.'
translation:
  language: de
  text: … die Wahrheit und die Langmut, werdet ihr zugrunde gehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Textausschnitt beginnt mitten im Satz; die Wörter „die Wahrheit und die Langmut“ hängen grammatisch vom vorausgehenden Kontext ab.
    reason: Das Fragment enthält zwei Akkusative ohne das zugehörige vorangehende Verb. Die Auslassungspunkte und die Fußnote machen diese textliche Unvollständigkeit transparent.
lexical_decisions:
- source_word: τὴν ἀλήθειαν
  choice: die Wahrheit
  rationale: Direkte und im Deutschen natürliche Wiedergabe des Akkusativobjekts; der vorliegende Ausschnitt setzt offenbar ein Verb oder eine Konstruktion aus dem vorhergehenden Kontext fort.
- source_word: τὴν μακροθυμίαν
  choice: die Langmut
  rationale: Bewahrt den Sinn geduldiger, zurückhaltender Ausdauer und den würdevollen ethischen Ton des griechischen Begriffs.
- source_word: ἀπολεῖσθε
  choice: werdet ihr zugrunde gehen
  rationale: Gibt die zweite Person Plural Futur Medium von ἀπόλλυμι idiomatisch wieder, ohne vorschnell zwischen Vernichtung, Verderben und endgültigem Untergang zu entscheiden.
theological_decisions:
- issue: Art und Tragweite des angekündigten Untergangs
  choice: zugrunde gehen
  alternative: verloren gehen / vernichtet werden
  rationale: Der griechische Ausdruck bezeichnet Untergang oder Verderben, legt in diesem Fragment aber weder dessen genaue Form noch eine bestimmte eschatologische Deutung eindeutig fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Langmut“ ist leicht gehoben, aber als präziser ethischer Begriff verständlich und näher am griechischen Ausdruck als bloßes „Geduld“.
