source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Διὰ τοῦτο¹¹ ὁ θυμούμενος¹², *ἐὰν μὲν ᾖ¹³ *δυνατὸς ⌈τῷ σώματι⌉¹⁴, *τριπλῆν ἐν τῷ θυμῷ τὴν δύναμιν κέκτηται¹⁵· μίαν¹⁶ μὲν ἀπὸ¹⁷ τῆς βοηθείας *τῶν ὑπουργούντων¹⁸. *δεύτερον δὲ¹⁹ διὰ τοῦ πλούτου *πείθων καὶ νικῶν [αὐτὸν] ἀδίκως²⁰. *τρίτον τὴν²¹ φυσικὴν ἔχων *δύναμιν δι'' αὐτῆς δρᾷ²² τὸ κακόν²³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/009.yaml
  text: 'Therefore the one who is angry, if he is strong in body, has acquired threefold power in his anger: one from the help of attendants; a second through wealth, persuading and prevailing unjustly; and a third, having natural strength, by it he does evil.'
translation:
  language: de
  text: 'Darum besitzt ein zorniger Mensch, wenn er körperlich stark ist, in seinem Zorn dreifache Macht: erstens durch die Hilfe seiner Gefolgsleute; zweitens durch seinen Reichtum, indem er auf ungerechte Weise überredet und sich durchsetzt; und drittens dadurch, dass er natürliche Kraft besitzt. Durch sie tut er Böses.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ θυμούμενος
  choice: ein zorniger Mensch
  rationale: Gibt das substantivierte Partizip natürlich wieder, ohne den Zorn als bloß vorübergehenden Gefühlszustand umzudeuten.
- source_word: δυνατὸς τῷ σώματι
  choice: körperlich stark
  rationale: Natürliche und genaue Wiedergabe der körperlichen Stärke.
- source_word: τριπλῆν ἐν τῷ θυμῷ τὴν δύναμιν κέκτηται
  choice: besitzt ... in seinem Zorn dreifache Macht
  rationale: Bewahrt den Bezug der δύναμις auf den Zorn und gibt κέκτηται idiomatisch als gegenwärtigen Besitz wieder.
- source_word: τῶν ὑπουργούντων
  choice: seiner Gefolgsleute
  rationale: Bezeichnet Personen, die ihm zuarbeiten oder dienen; „Gefolgsleute“ passt zum sozialen Machtkontext besser als das moderne „Angestellte“.
- source_word: πείθων καὶ νικῶν ... ἀδίκως
  choice: indem er andere überredet und sich auf ungerechte Weise durchsetzt
  rationale: Gibt die beiden Partizipien als Mittel bzw. Ausübung der durch Reichtum gewonnenen Macht wieder; das textkritisch unsichere αὐτόν wird nicht ausdrücklich übersetzt.
- source_word: δι’ αὐτῆς δρᾷ τὸ κακόν
  choice: tut durch sie Böses
  rationale: Folgt dem schlichten Ausdruck des Griechischen und erhält den Rückbezug auf die natürliche Kraft.
theological_decisions:
- issue: Art und Ursprung der dreifachen Macht des Zorns
  choice: Die drei Machtquellen werden als Gefolgsleute, Reichtum und natürliche Körperkraft wiedergegeben.
  alternative: Die Formulierung könnte als eine dreifache seelische Zorneskraft verstanden und ausdrücklich auf die Seele bezogen werden.
  rationale: Im vorgelegten griechischen Text steht kein Ausdruck für „Seele“. Die Übersetzung wahrt daher die konkrete Aufzählung, ohne eine zusätzliche anthropologische Aussage einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die nummerierte Dreigliederung wurde zur besseren Verständlichkeit explizit mit „erstens, zweitens, drittens“ gestaltet; sie entspricht μίαν, δεύτερον und τρίτον im Ausgangstext.
