revisions:
- from: 'Darum besitzt ein zorniger Mensch, wenn er körperlich stark ist, in seinem Zorn dreifache Macht: erstens durch die Hilfe seiner Gefolgsleute; zweitens durch seinen Reichtum, indem er andere überredet und sich auf ungerechte Weise durchsetzt; und drittens hat er seine natürliche Kraft und tut durch sie Böses.'
  to: 'Darum besitzt ein zorniger Mensch, wenn er körperlich stark ist, in seinem Zorn dreifache Macht: erstens durch die Hilfe seiner Gefolgsleute; zweitens durch seinen Reichtum, indem er auf ungerechte Weise überredet und sich durchsetzt; und drittens dadurch, dass er natürliche Kraft besitzt. Durch sie tut er Böses.'
  rationale: Die Revision beseitigt die nicht abgesicherte Ergänzung „andere“ und gestaltet den dritten Teil als dritte Machtquelle. Der abschließende Satz bewahrt ausdrücklich den Bezug von „durch sie“ auf die natürliche Kraft. Die textkritisch unsichere Objektlesart bleibt unentschieden und wird nicht durch eine Fußnote überinterpretiert.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T04:15:30Z'
review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Satzstruktur und die drei im griechischen Text genannten Machtmittel im Wesentlichen zutreffend wieder. Sie ergänzt keine im Quelltext nicht vorhandene Aussage über die Seele, anders als eine frühere englische Fassung im Audit-Verlauf. Das eingeklammerte, textkritisch unsichere αὐτόν wird zu Recht nicht als bestimmtes Objekt wiedergegeben. Allerdings legt „andere“ als Objekt von „überredet“ eine Pluralreferenz fest, die der Text nicht bietet; außerdem bildet der dritte Gliedsatz die Konstruktion „natürliche Kraft habend, durch sie tut er Böses“ nicht sauber ab.
  naturalness: Modernes Standarddeutsch und der würdige Registerton sind insgesamt gelungen. Die Abfolge „und drittens hat er seine natürliche Kraft“ ist jedoch syntaktisch weniger klar und nicht parallel zu den beiden vorangehenden Machtquellen. Eine Formulierung mit „dadurch, dass“ und einem anschließenden selbstständigen Satz ist natürlicher und verdeutlicht den Rückbezug von δι’ αὐτῆς.
  terminology: „zorniger Mensch“, „körperlich stark“, „Gefolgsleute“, „Reichtum“ und „Böses“ sind angemessene Wiedergaben. „Macht“ ist für δύναμις im Kontext sozialer und körperlicher Durchsetzungsfähigkeit vertretbar. „Gefolgsleute“ gibt ὑπουργούντων als zuarbeitende bzw. dienende Personen idiomatisch wieder, ohne die moderne Arbeitsbeziehung von „Angestellten“ nahezulegen.
  issues:
  - severity: low
    issue: „andere“ ergänzt ein pluralisches Objekt zu „überredet“.
    rationale: Das Objekt αὐτόν ist in der griechischen Edition eingeklammert und zudem Singular; der überlieferte Sinn lässt sich ohne Festlegung auf ein Objekt wiedergeben.
  - severity: medium
    issue: Der dritte Teil der Dreierreihe ist im Deutschen nicht klar parallel konstruiert.
    rationale: '„drittens hat er seine natürliche Kraft“ lässt die natürliche Kraft eher als zusätzlichen Besitz denn als dritte Quelle der Macht erscheinen. Das griechische ἔχων ... δι’ αὐτῆς δρᾷ verlangt zudem einen klaren Rückbezug: Er besitzt natürliche Kraft und handelt durch sie böse.'
  revised_text: 'Darum besitzt ein zorniger Mensch, wenn er körperlich stark ist, in seinem Zorn dreifache Macht: erstens durch die Hilfe seiner Gefolgsleute; zweitens durch seinen Reichtum, indem er auf ungerechte Weise überredet und sich durchsetzt; und drittens dadurch, dass er natürliche Kraft besitzt. Durch sie tut er Böses.'
