  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/006.yaml
  text: For anger is evil, my children, because it throws even the soul itself into turmoil.
translation:
  language: de
  text: Denn der Zorn ist böse, meine Kinder, weil er sogar die Seele selbst in Aufruhr versetzt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πονηρός
  choice: böse
  rationale: Gibt die moralisch negative Wertung des Zorns unmittelbar und quellennah wieder.
- source_word: θυμός
  choice: Zorn
  rationale: Bezeichnet hier heftigen, erregten Zorn; „Zorn“ ist im Kontext natürlicher und würdevoller als „Wut“.
- source_word: ἐκταράσσει
  choice: in Aufruhr versetzt
  rationale: 'Bewahrt die starke Bedeutung des Verbs: gründlich erschüttern, verwirren oder innerlich aufwühlen.'
- source_word: αὐτὴν τὴν ψυχήν
  choice: die Seele selbst
  rationale: Erhält die emphatische Hervorhebung des griechischen Ausdrucks.
theological_decisions:
- issue: Moralische Bewertung des Zorns
  choice: „der Zorn ist böse“
  alternative: „der Zorn ist schädlich“
  rationale: πονηρός bezeichnet hier ausdrücklich etwas moralisch Böses oder Schlechtes; eine bloß therapeutische Deutung als „schädlich“ wäre zu schwach.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, leicht verständlichem Lehrton; die direkte Anrede „meine Kinder“ und die emphatische Aussage über die Seele bleiben erhalten.
