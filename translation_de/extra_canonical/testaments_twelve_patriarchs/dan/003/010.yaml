source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἐὰν δὲ ἀσθενὴς ᾖ ὁ²⁴ θυμούμενος²⁵, *διπλοῦν τὸ τῆς ὀργῆς πάθος ἐν αὐτῷ ἀναφύει²⁶· βοηθεῖ *γὰρ αὐτῷ ὁ θυμὸς²⁷ πάντοτε ἐν παρανομίᾳ²⁸. 6. Τοῦτο τὸ πνεῦμα ἀεὶ μετὰ τοῦ ψεύδους *ἐκ δεξιῶν τοῦ Σατανᾶ πορεύεται, ἵνα ἐν ὠμότητι καὶ ψεύδει³⁰ γίνωνται³¹ αἱ πράξεις αὐτοῦ³².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/010.yaml
  text: But if the one who is angry is weak, the passion of wrath grows in him twofold, for anger always helps him in wrongdoing. This spirit always proceeds with falsehood at the right hand of Satan, so that his deeds may be done in cruelty and falsehood.
translation:
  language: de
  text: Wenn aber jemand, der zornig ist, schwach ist, wächst die Leidenschaft des Zorns in ihm zu doppelter Stärke heran; denn der Zorn steht ihm im Unrecht stets bei. Dieser Geist geht immer zusammen mit der Lüge zur Rechten Satans, damit seine Taten in Grausamkeit und Lüge vollbracht werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀσθενὴς
  choice: schwach
  rationale: Gibt die körperlich oder charakterlich verstandene Schwäche offen wieder, ohne die Mehrdeutigkeit näher festzulegen.
- source_word: θυμούμενος
  choice: derjenige, der zornig ist
  rationale: Bewahrt den substantivierten, auf eine Person bezogenen Sinn des Partizips in natürlichem Deutsch.
- source_word: διπλοῦν ... ἀναφύει
  choice: wächst ... doppelt ... auf
  rationale: ἀναφύει bezeichnet ein Aufwachsen oder Hervorsprießen; die Formulierung erhält dieses dynamische Bild und den Gedanken der Verdoppelung.
- source_word: τὸ τῆς ὀργῆς πάθος
  choice: die Leidenschaft des Zorns
  rationale: πάθος wird als beherrschende Gemütsregung wiedergegeben; die Genitivverbindung bleibt eng am Griechischen.
- source_word: βοηθεῖ ... ἐν παρανομίᾳ
  choice: steht ihm im Unrecht ... bei
  rationale: Gibt sowohl den Beistandsaspekt von βοηθεῖ als auch die Konstruktion mit ἐν wieder; »Unrecht« ist hier idiomatischer als »Gesetzlosigkeit«, ohne den moralischen Sinn abzuschwächen.
- source_word: ἐκ δεξιῶν τοῦ Σατανᾶ
  choice: zur Rechten Satans
  rationale: Bewahrt die räumliche und möglicherweise symbolische Aussage des griechischen Ausdrucks, ohne sie auszudeuten.
- source_word: ὠμότητι
  choice: Grausamkeit
  rationale: Entspricht dem Sinn von Härte, Rohheit oder Grausamkeit im gegebenen moralischen Zusammenhang.
theological_decisions:
- issue: Bezug von »dieser Geist«
  choice: Die Wendung bleibt ohne erklärenden Zusatz stehen.
  alternative: Ausdrückliche Identifikation als »Geist des Zorns«.
  rationale: Τοῦτο τὸ πνεῦμα verweist im Zusammenhang vermutlich auf den Zorn, doch der vorliegende griechische Text benennt den Bezug nicht ausdrücklich; die Übersetzung bewahrt diese Offenheit.
- issue: Bezug des Possessivpronomens in »seine Taten«
  choice: Das maskuline Possessivpronomen »seine« bleibt erhalten.
  alternative: Explizite Auflösung als Taten Satans oder Taten des zornigen Menschen.
  rationale: αἱ πράξεις αὐτοῦ lässt grammatisch mehrere Bezugsgrößen im Kontext zu. Eine ausdrückliche Festlegung würde die genuine Bezugsunschärfe beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an Syntax und Bildsprache des griechischen Textes. Die etwas markierte Formulierung »wächst ... doppelt ... auf« wurde gewählt, um ἀναφύει nicht zum bloßen Vorhandensein oder Verstärken abzuschwächen.
