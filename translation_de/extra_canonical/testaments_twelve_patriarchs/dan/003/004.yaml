  text: '*Περιβάλλεται γὰρ ⌈αὐτὸν⌉⁷ τὸ πνεῦμα τοῦ θυμοῦ τὸ δίκτυον τῆς πλάνης²¹ καὶ τυφλοῖ τοὺς²² ὀφθαλμοὺς αὐτοῦ, καὶ¹ διὰ τοῦ ψεύδους σκοτοῖ²³ τὴν διάνοιαν ⌈αὐτοῦ⌉⁷²⁴, καὶ τὴν ἰδίαν ὅρασιν παρέχει αὐτῷ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/004.yaml
  text: For the spirit of anger wraps him in the net of deceit and blinds his eyes, and through falsehood it darkens his mind and gives him his own vision.
translation:
  language: de
  text: Denn der Geist des Zorns umgibt ihn mit dem Netz der Täuschung, blendet ihm die Augen, verfinstert durch die Lüge seinen Verstand und gibt ihm seine eigene Sicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τοῦ θυμοῦ
  choice: der Geist des Zorns
  rationale: Die formale Wiedergabe bewahrt die personifizierende und geistlich-anthropologische Ausdrucksweise des griechischen Textes.
- source_word: περιβάλλεται … τὸ δίκτυον τῆς πλάνης
  choice: umgarnt ihn mit dem Netz der Täuschung
  rationale: Das ungewöhnliche griechische Bild wird in natürlichem Deutsch als Einfangen mit einem Netz wiedergegeben; „Täuschung“ lässt sowohl Irreführung als auch Verblendung anklingen.
- source_word: σκοτοῖ τὴν διάνοιαν
  choice: verfinstert er seinen Verstand
  rationale: „Verfinstern“ erhält die Licht-Finsternis-Metaphorik, während „Verstand“ διάνοια als Denk- und Erkenntnisvermögen verständlich ausdrückt.
- source_word: τὴν ἰδίαν ὅρασιν
  choice: seine eigene Sichtweise
  rationale: „Sichtweise“ bewahrt die Mehrdeutigkeit zwischen Wahrnehmung und innerer Perspektive; das reflexive „seine“ bezieht sich grammatisch auf den Geist des Zorns.
theological_decisions:
- issue: Bezug von τὴν ἰδίαν ὅρασιν
  choice: Die Sichtweise wird dem Geist des Zorns zugerechnet.
  alternative: Die Wendung könnte als die eigene, nun verzerrte Sicht des betroffenen Menschen verstanden werden.
  rationale: Das Subjekt der koordinierten Verben bleibt τὸ πνεῦμα τοῦ θυμοῦ; daher liegt als nächster grammatischer Bezug des reflexiven ἰδίαν der Geist nahe, ohne die Bildsprache dogmatisch weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dichte Personifikation und die Abfolge von Netz-, Blindheits- und Finsternisbildern bleiben erhalten; das Semikolon macht den langen griechischen Satz lesbar, ohne seinen Gedankengang aufzubrechen.
