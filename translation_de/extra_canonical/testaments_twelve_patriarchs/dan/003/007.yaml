source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ τὸ μὲν σῶμα *ἴδιον ποιεῖται³ τοῦ θυμουμένου⁴, *τῆς δὲ ψυχῆς⁵ κατακυριεύει, καὶ παρέχει σώματι⁶· ⌈δύναμιν⌉⁷, ἵνα ποιήσῃ⁸ πᾶσαν⁹ ἀνομίαν⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/007.yaml
  text: And it makes the body of the angry man its own, and gains mastery over the soul, and gives the body strength so that it may commit every lawless deed.
translation:
  language: de
  text: Und er macht sich den Körper des zornigen Menschen zu eigen, bemächtigt sich seiner Seele und verleiht dem Körper Kraft, damit der Körper jede Gesetzlosigkeit begeht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ σῶμα ἴδιον ποιεῖται τοῦ θυμουμένου
  choice: er macht sich den Körper des zornigen Menschen zu eigen
  rationale: Gibt die Besitzergreifung des Körpers durch den im Zusammenhang vorausgesetzten Zorn eng und zugleich natürlich wieder.
- source_word: τῆς ψυχῆς κατακυριεύει
  choice: bemächtigt sich seiner Seele
  rationale: Bewahrt die starke Bedeutung von κατακυριεύει als Herrschaftsgewinn; das Possessivpronomen stellt den natürlichen deutschen Bezug zum zornigen Menschen her.
- source_word: παρέχει σώματι δύναμιν
  choice: verleiht dem Körper Kraft
  rationale: Eine idiomatische und gehobene Wiedergabe der körperlichen Befähigung.
- source_word: πᾶσαν ἀνομίαν
  choice: jede gesetzlose Tat
  rationale: ἀνομία bezeichnet Gesetzlosigkeit; mit „Tat“ wird der durch ποιήσῃ verlangte Handlungssinn im Deutschen natürlich ausgedrückt, ohne den Umfang von πᾶσαν abzuschwächen.
theological_decisions:
- issue: Unausgesprochenes Subjekt der Verben
  choice: „er“, bezogen auf den im Kontext personifiziert auftretenden Zorn
  alternative: „es“ oder die ausdrückliche Wiederholung „der Zorn“
  rationale: Das griechische Subjekt ist in diesem Vers nur in den Verbformen enthalten und muss aus dem Kontext erschlossen werden. „Er“ wahrt die Personifizierung und vermeidet eine nicht im Vers stehende Wiederholung.
- issue: Bedeutung von ἀνομία
  choice: „gesetzlose Tat“
  alternative: „Unrecht“ oder „Sünde“
  rationale: Die gewählte Formulierung hält den Bezug auf Gesetzlosigkeit fest, ohne den Begriff konfessionell oder systematisch als „Sünde“ zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Syntax. Die dreifache Steigerung — Aneignung des Körpers, Herrschaft über die Seele, Kraft zur Gesetzlosigkeit — bleibt erhalten.
