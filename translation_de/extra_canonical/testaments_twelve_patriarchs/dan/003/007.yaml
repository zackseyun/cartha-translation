  source_fidelity: 'Die dreigliedrige Aussage wird im Wesentlichen treffend wiedergegeben: Der Zorn nimmt den Körper des Zornigen in Besitz, herrscht über die Seele und befähigt den Körper zum Tun von ἀνομία. Die Formulierung „jede gesetzlose Tat“ verschiebt jedoch das abstrakte Kollektivum πᾶσαν ἀνομίαν zu einzelnen, als gesetzlos qualifizierten Taten. „jede Gesetzlosigkeit“ bildet den griechischen Ausdruck unmittelbarer ab.'
  naturalness: Der Satz ist modernes, verständliches Standarddeutsch. Die Wiederaufnahme „damit er“ kann nach „dem Körper“ zwar sinnvoll auf den Körper bezogen werden, bleibt aber neben dem eingangs verwendeten „er“ unnötig mehrdeutig. Die Wiederholung von „der Körper“ im Zwecksatz beseitigt dies ohne inhaltliche Ergänzung.
  terminology: „sich ... zu eigen machen“, „sich ... bemächtigen“ und „Kraft verleihen“ geben die starken Verben ἴδιον ποιεῖσθαι, κατακυριεύειν und παρέχειν δύναμιν angemessen wieder. „Gesetzlosigkeit“ wahrt den für ἀνομία maßgeblichen Gesetzesbezug besser als eine Umschreibung über „gesetzlose Tat“.
  issues:
  - severity: low
    issue: πᾶσαν ἀνομίαν ist als „jede gesetzlose Tat“ wiedergegeben.
    rationale: ἀνομία bezeichnet hier Gesetzlosigkeit beziehungsweise gesetzloses Handeln als Ganzes, nicht ausdrücklich eine einzelne „Tat“. Die direkte abstrakte Wiedergabe erhält den Wortlaut und Umfang besser.
  - severity: low
    issue: Das Pronomen „er“ im Zwecksatz ist potenziell mehrdeutig.
    rationale: Nach „verleiht dem Körper Kraft“ kann „damit er ...“ zwar den Körper meinen, konkurriert aber mit dem personifizierten, im ersten Satzglied als „er“ geführten Subjekt. Die explizite Nennung des Körpers macht die syntaktische Funktion deutlich.
  revised_text: Und er macht sich den Körper des zornigen Menschen zu eigen, bemächtigt sich seiner Seele und verleiht dem Körper Kraft, damit der Körper jede Gesetzlosigkeit begeht.
