id: T12P.DAN.3.2
reference: Testament of Dan 3:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Τύφλωσις *γάρ ἐστιν ὁ θυμὸς καὶ οὐκ ἐᾷ ὁρᾶν πρόσωπόν τινος ἐν ἀληθείᾳ⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/002.yaml
  text: For anger is blindness, and it does not allow one to see anyone’s face in truth.
translation:
  language: de
  text: Denn der Zorn ist Blindheit und lässt einen das Gesicht eines Menschen nicht in Wahrheit sehen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Denn Zorn macht blind und lässt einen einen Menschen nicht so sehen, wie er wirklich ist.“'
    reason: Die alternative Wiedergabe macht den Sinn idiomatischer, löst jedoch die bildhafte Gleichsetzung und die Offenheit von „in Wahrheit“ stärker auf.
lexical_decisions:
- source_word: θυμός
  choice: Zorn
  rationale: Bezeichnet hier heftigen Zorn bzw. aufflammenden Ärger; „Zorn“ bewahrt den gewichtigen, moralisch mahnenden Ton.
- source_word: Τύφλωσις
  choice: Blindheit
  rationale: Gibt die bildhafte Gleichsetzung unmittelbar und natürlich wieder.
- source_word: πρόσωπόν τινος
  choice: das Gesicht eines Menschen
  rationale: Das indefinite τινος wird allgemein wiedergegeben; „Gesicht“ bewahrt das konkrete Bild des griechischen πρόσωπον.
- source_word: ἐν ἀληθείᾳ
  choice: in Wahrheit
  rationale: Die wörtliche, bewusst offene Formulierung lässt sowohl wahrheitsgemäßes Sehen als auch das Erkennen des Menschen in seiner Wirklichkeit anklingen.
theological_decisions:
- issue: Art der Aussage über den Zorn
  choice: „der Zorn ist Blindheit“ als direkte Gleichsetzung
  alternative: „Zorn macht blind“
  rationale: Die direkte Gleichsetzung entspricht dem griechischen Nominalsatz und bewahrt seine zugespitzte ethische Aussage.
- issue: Bedeutung von ἐν ἀληθείᾳ
  choice: „in Wahrheit“
  alternative: „so, wie er wirklich ist“
  rationale: Die weniger deutende Fassung erhält die genuine semantische Offenheit des Ausdrucks.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bildet γάρ und καί mit „Denn … und“ ab; die ungewöhnliche Wendung „in Wahrheit sehen“ bleibt wegen ihrer inhaltlichen Offenheit erhalten.
