review_pass:
  verdict: revise
  source_fidelity: 'Der Satzbau und die Rollenverteilung sind im Entwurf grundsätzlich zutreffend wiedergegeben: Die Seele ist Subjekt von δικαιοῖ und rechtfertigt das vom Körper Getane. Für die generische ὅταν-Konstruktion ist im Deutschen das Präsens („tut“) näherliegend als ein vorzeitig klingendes Perfekt („getan hat“). „Das Getane“ gibt τὰ πραχθέντα präziser wieder als „das Geschehene“, das auch bloße Ereignisse bezeichnen kann.'
  naturalness: Die revidierte Fassung ist knapp, idiomatisch und bewahrt die bewusst bildhafte Aussage „nicht richtig sieht“.
  terminology: „Körper“, „Seele“ und „rechtfertigt“ sind sachlich angemessen. „Rechtfertigt“ ist hier nicht als technische dogmatische Formel erläutert, sondern behält den Sinn bei, die Taten als berechtigt darzustellen.
  issues:
  - severity: low
    issue: Tempus und Aktionsart von „wenn der Körper all dies getan hat“
    rationale: Ὅταν mit Aoristkonjunktiv beschreibt hier eine allgemeine bzw. wiederholbare Konstellation. Das deutsche Präsens „wenn ... tut“ bildet dies unmittelbarer ab.
  - severity: low
    issue: „das Geschehene“ für τὰ πραχθέντα
    rationale: Das griechische Partizip bezeichnet das Getane bzw. die begangenen Handlungen. „Das Geschehene“ kann weiter gefasst sein und Ereignisse einschließen, die niemand aktiv getan hat.
  revised_text: Und wenn der Körper all dies tut, rechtfertigt auch die Seele[a] das Getane, weil sie nicht richtig sieht.
