  revision_rationale: 'Die Revision beschränkt sich auf zwei sichere sprachlich-semantische Anpassungen: Die generische griechische Konstruktion wird mit deutschem Präsens wiedergegeben, und τὰ πραχθέντα wird als „das Getane“ enger an seinen Handlungsbezug gebunden. Die textkritische Fußnotenverankerung sowie die im griechischen Text offene Bildsprache bleiben erhalten.'
