source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Καὶ ὅταν ταῦτα πάντα πράξῃ τὸ σῶμα, δικαιοῖ τὰ πραχθέντα καὶ ἡ ψυχή¹⁰, ἐπειδὴ οὐ βλέπει ὀρθῶς.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003/008.yaml
  text: And when the body has done all these things, the soul justifies what has been done, because it does not see rightly.
translation:
  language: de
  text: Und wenn der Körper all dies tut, rechtfertigt auch die Seele[a] das Getane, weil sie nicht richtig sieht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Einige Textzeugen lassen »auch die Seele« aus.
    reason: Die hochgestellte Editionsnote bei ἡ ψυχή wird am entsprechenden deutschen Ausdruck verankert und macht die im Ausgangstext markierte textkritische Variante transparent.
lexical_decisions:
- source_word: τὸ σῶμα
  choice: der Körper
  rationale: Gibt den konkreten Gegensatz zur Seele natürlich und sachlich wieder.
- source_word: δικαιοῖ
  choice: rechtfertigt
  rationale: Bewahrt die Bedeutung, das bereits Getane als richtig oder berechtigt hinzustellen, ohne sie durch eine erklärende Umschreibung einzuengen.
- source_word: τὰ πραχθέντα
  choice: das Geschehene
  rationale: Eine natürliche substantivierte Wiedergabe für »die vollbrachten Dinge/Taten«; der Rückbezug auf »all dies« bleibt erhalten.
- source_word: οὐ βλέπει ὀρθῶς
  choice: nicht richtig sieht
  rationale: Folgt der Bildsprache des griechischen Textes und lässt offen, ob Wahrnehmung, Einsicht oder moralisches Urteil gemeint ist.
theological_decisions:
- issue: Verhältnis von Körper und Seele bei der Rechtfertigung des Handelns
  choice: Die Seele wird als nachträglich rechtfertigende Instanz dargestellt.
  alternative: Die Aussage als technische Lehre über die Rechtfertigung der Seele zu verstehen.
  rationale: 'Der unmittelbare Satzbau bezieht δικαιοῖ auf τὰ πραχθέντα: Die Seele rechtfertigt das Getane. Eine dogmatische Ausdeutung wäre sachlich nicht begründet.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe anthropologische Bildsprache und die mögliche Spannung zwischen Körper, Seele und getrübter Einsicht bleiben erhalten.
