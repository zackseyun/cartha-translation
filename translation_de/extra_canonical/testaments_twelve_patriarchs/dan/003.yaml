  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/003.yaml
  text: 'If you lose truth and patience[a], you will perish.


    2 Anger is blindness, for it does not allow one to see anyone’s face truly. 3 Even if it is a father or a mother, it regards them as enemies. If it is a brother, it does not know him. If it is a prophet of the Lord, it disobeys him; if a righteous man, it does not see him; if a friend, it does not recognize him. 4 For the spirit of anger wraps him in the net of deceit and blinds his eyes, and through falsehood it darkens his mind and gives him his own vision. 5 And with what does it veil his eyes? With hatred of heart against his brother, leading to envy.


    6 For anger is evil, my children, because it throws even the soul itself into turmoil. 7 And it gives strength to the body, so that it may commit every lawless deed. 8 And when the body has done all these things, the soul justifies what has been done, because it does not see rightly. 9 Therefore the one who is angry, if he is physically strong, has his soul’s power for anger threefold: one from the help of attendants, by which he justifies the deed; a second through wealth, persuading and overpowering unjustly[b]; and a third, because he has natural strength, by it he does evil. 10 But if the one who is angry is weak, he has the passion of wrath in him twofold[d][c], for anger always helps him toward wrongdoing.'
translation:
  language: de
  text: '## Testament Dans 3


    1 Denn der Zorn ist böse, meine Kinder: Er versetzt sogar die Seele selbst in Aufruhr. 2 Er nimmt den Leib des Zornigen für sich in Besitz, bemächtigt sich der Seele und verleiht dem Leib Kraft, sodass er jede gesetzlose Tat begeht. 3 Und wenn der Leib dies alles getan hat, erklärt auch die Seele das Geschehene für richtig, weil sie nicht mehr richtig sieht.


    4 Darum besitzt der Zornige, wenn er körperlich stark ist, im Zorn dreifache Macht: die erste durch die Hilfe seiner Gehilfen; die zweite durch seinen Reichtum, mit dem er andere überredet und zu Unrecht überwältigt[a]; die dritte, weil er von Natur aus Kraft besitzt und durch sie das Böse tut. 5 Ist der Zornige aber schwach, wächst die Leidenschaft des Grimms[b] in ihm doppelt heran; denn der Zorn hilft ihm stets bei gesetzlosem Handeln.


    6 Dieser Geist geht immer zusammen mit der Lüge zur Rechten Satans, damit seine Taten[c] in Grausamkeit und Lüge geschehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut kann auch enger heißen: „mit dem er ihn überredet und zu Unrecht überwältigt“. Worauf sich „ihn“ bezieht, bleibt unklar.'
    reason: textual_or_syntactic_ambiguity
  - marker: b
    text: Im Griechischen steht hier ὀργή („Grimm“), während sonst in diesem Kapitel θυμός („Zorn“) verwendet wird. Beide Wörter überschneiden sich in ihrer Bedeutung.
    reason: lexical_alternative
  - marker: c
    text: Das griechische Pronomen „seine“ hat keinen völlig eindeutigen Bezug; gemeint sein können die Taten des Geistes, Satans oder des vom Zorn beherrschten Menschen.
    reason: referential_ambiguity
lexical_decisions:
- source_word: θυμός
  choice: Zorn
  rationale: „Zorn“ ist ein geläufiger, würdiger Ausdruck für die beherrschende und zerstörerische Gemütsbewegung des Abschnitts und lässt die teilweise Personifikation bestehen.
- source_word: ἐκταράσσει
  choice: versetzt … in Aufruhr
  rationale: Gibt die intensive Erschütterung der Seele anschaulich und in natürlichem Deutsch wieder.
- source_word: ἴδιον ποιεῖται
  choice: nimmt … für sich in Besitz
  rationale: Bewahrt die Aussage, dass der Zorn den Leib des Zornigen gleichsam zu seinem Eigentum macht; diese im griechischen Text vorhandene Aussage wird nicht ausgelassen.
- source_word: κατακυριεύει
  choice: bemächtigt sich
  rationale: Drückt die gewaltsame Herrschaft des Zorns über die Seele aus, ohne daraus eine über den Text hinausgehende Dämonologie zu entwickeln.
- source_word: ἀνομία / παρανομία
  choice: gesetzlose Tat / gesetzloses Handeln
  rationale: Erhält den Bezug auf die Verletzung sittlicher Ordnung deutlicher als das allgemeinere „Unrecht“.
- source_word: δικαιοῖ
  choice: erklärt … für richtig
  rationale: Im Kontext rechtfertigt die getrübte Seele die bereits vollbrachten Taten; die Formulierung ist verständlich, ohne den Ausdruck technisch-theologisch aufzuladen.
- source_word: τῶν ὑπουργούντων
  choice: seiner Gehilfen
  rationale: Bezeichnet diejenigen, die dem Zornigen dienen oder ihn bei seinem Handeln unterstützen.
- source_word: ὀργή
  choice: Grimm
  rationale: Unterscheidet den einmal verwendeten Begriff ὀργή von θυμός („Zorn“), ohne einen künstlich scharfen Bedeutungsunterschied zu behaupten.
- source_word: ἐκ δεξιῶν τοῦ Σατανᾶ
  choice: zur Rechten Satans
  rationale: Bewahrt das konkrete und theologisch spannungsreiche Bild der griechischen Vorlage.
- source_word: ὠμότης
  choice: Grausamkeit
  rationale: Gibt die Härte und brutale Unmenschlichkeit des Ausdrucks direkt wieder.
theological_decisions:
- issue: Personifikation des Zorns als wirksamer Geist
  choice: Die Aussagen über den Zorn und „diesen Geist“ werden in ihrer personalisierenden Sprache beibehalten.
  alternative: Alles ausschließlich als psychologische Metapher wiedergeben oder ausdrücklich als eigenständiges dämonisches Wesen bestimmen.
  rationale: Der griechische Text beschreibt den Zorn als eine handelnde und beherrschende Macht und nennt am Ende „diesen Geist“, legt aber keine ausgearbeitete Lehre über dessen ontologischen Status vor.
- issue: Beziehung des Geistes zu Satan
  choice: Das Bild „zusammen mit der Lüge zur Rechten Satans“ wird ohne erklärende Auflösung übersetzt.
  alternative: Die Wendung als bloße Zugehörigkeit zum Bösen paraphrasieren.
  rationale: Die konkrete räumliche Metapher gehört zur Aussage des Textes und soll in ihrer theologischen Spannung erhalten bleiben.
- issue: Rechtfertigung böser Taten durch die Seele
  choice: δικαιοῖ wird moralpsychologisch mit „erklärt … für richtig“ wiedergegeben.
  alternative: Mit dem stärker forensisch-theologischen Ausdruck „rechtfertigt“ übersetzen.
  rationale: Hier geht es darum, dass die verblendete Seele das Handeln nachträglich gutheißt, nicht um eine Lehraussage über göttliche Rechtfertigung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdig-mahnendem Ton. Die dichte Personifikation des Zorns, die Körper-Seele-Sprache und die konkreten Bilder der Vorlage bleiben erhalten. Die Verse folgen der griechischen Kapitelzählung von Testament Dans 3,1–6; Material aus dem vorangehenden Kapitel wurde nicht in Kapitel 3 übernommen.
