base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/006.yaml
  text: And now, my children, fear the Lord, and watch yourselves against Satan and his spirits. Draw near to God and to the angel who intercedes for you, for he is a mediator between God and men[a], and for the peace of Israel he will stand against the kingdom of the enemy. Because of this the enemy is eager to trip up all who call on the Lord. For he knows that on the day when Israel turns back, the kingdom of the enemy will be brought to an end. For the very angel of peace will strengthen Israel, so that he may not fall into the uttermost evil. But in the time of the lawlessness of Israel, the Lord will not depart from them, but will pass over to a nation that seeks his will, for none of the angels will be equal to him[b]. And his name will be in every place in Israel and among the nations. Keep yourselves, then, my children, from every evil work, and cast away from yourselves anger and falsehood, and love truth and patience. And what you have heard from your father, pass on also to your
    children, so that the Savior of the nations may receive you; for he is true and patient, gentle and humble, and by his works he teaches the law of the Lord.[c] Therefore depart from all unrighteousness and cling to the righteousness of God, and your offspring will be for salvation forever.
translation:
  language: de
  text: '**Testament Dans 6**


    **1** Und nun, meine Kinder, fürchtet den Herrn und nehmt euch vor dem Satan und seinen Geistern in Acht. **2** Naht euch Gott und dem Engel, der für euch eintritt; denn er ist Mittler zwischen Gott und Menschen.[a] Für den Frieden Israels wird er sich dem Reich des Feindes entgegenstellen. **3** Deshalb bemüht sich der Feind, alle zu Fall zu bringen, die den Herrn anrufen. **4** Denn er weiß: An dem Tag, an dem Israel umkehrt, wird das Reich des Feindes sein Ende finden. **5** Der Engel des Friedens selbst wird Israel stärken, damit Israel nicht bis zum Äußersten ins Böse fällt. **6** Doch in der Zeit der Gesetzlosigkeit Israels wird der Herr sich nicht von ihnen abwenden, sondern zu einem Volk hinübergehen, das nach seinem Willen sucht; denn keiner der Engel wird ihm gleich sein.[b] **7** Und sein Name wird überall in Israel und unter den Völkern sein.


    **8** Hütet euch also, meine Kinder, vor jedem bösen Werk. Werft Zorn und Lüge von euch ab und liebt die Wahrheit und die Geduld. **9** Was ihr von eurem Vater gehört habt, das gebt auch an eure Kinder weiter, [damit der Retter der Völker euch annimmt; denn er ist wahrhaftig und geduldig, sanftmütig und demütig und lehrt durch seine Werke das Gesetz des Herrn].[c] **10** Darum wendet euch von aller Ungerechtigkeit ab und haltet an der Gerechtigkeit Gottes fest; dann wird eure Nachkommenschaft für immer zur Rettung sein. **11** Und begrabt mich nahe bei meinen Vätern.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Mittler zwischen Gott und Menschen“ ist unmittelbar aus dem Griechischen übersetzt. Da der Abschnitt weiterhin von einem „Engel“ spricht, wird die Formulierung nicht mit einer späteren dogmatischen Gestalt gleichgesetzt.
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Satz ist schwierig: In der vorliegenden Textgestalt heißt es, der Herr werde sich „nicht von ihnen abwenden“ und dennoch „zu einem Volk hinübergehen, das nach seinem Willen sucht“. Diese Spannung bleibt in der Übersetzung erhalten.'
    reason: alternative_reading
  - marker: c
    text: Der in eckige Klammern gesetzte Satz gilt häufig als spätere Erweiterung oder Einfügung. Er wird hier übersetzt, weil er in dem vorgelegten griechischen Textzeugen steht.
    reason: textual_variant
lexical_decisions:
- source_word: φοβήθητε τὸν Κύριον
  choice: fürchtet den Herrn
  rationale: Bewahrt die eindringliche Mahnung und den starken religiös-ethischen Sinn des Imperativs; „ehrt“ oder „verehrt“ wäre schwächer.
- source_word: προσέχετε ἑαυτοῖς ἀπὸ τοῦ Σατανᾶ
  choice: nehmt euch vor dem Satan … in Acht
  rationale: Natürliches modernes Deutsch für wachsame Selbsthütung, ohne den reflexiven Charakter des Griechischen aufzugeben.
- source_word: τῶν πνευμάτων αὐτοῦ
  choice: seinen Geistern
  rationale: Gibt die Zugehörigkeitsbeziehung knapp wieder, ohne die genaue Funktion dieser Geister näher zu bestimmen.
- source_word: Ἐγγίσατε τῷ θεῷ
  choice: Naht euch Gott
  rationale: Bewahrt den gehobenen biblischen Annäherungsruf und bleibt dennoch verständlich.
- source_word: τῷ ἀγγέλῳ τῷ παραιτουμένῳ ὑμᾶς
  choice: dem Engel, der für euch eintritt
  rationale: Der folgende Mittlersatz legt ein Eintreten zugunsten der Angeredeten nahe; die Formulierung vermeidet eine weitergehende dogmatische Identifizierung.
- source_word: μεσίτης θεοῦ καὶ ἀνθρώπων
  choice: Mittler zwischen Gott und Menschen
  rationale: Entspricht dem griechischen Beziehungsausdruck und verwendet die im Deutschen natürliche, theologisch nicht weiter festlegende Bezeichnung.
- source_word: κατέναντι τῆς βασιλείας … στήσεται
  choice: wird er sich dem Reich … entgegenstellen
  rationale: Erhält das Bild einer entschiedenen Gegenstellung und macht den feindlichen Sinn im Deutschen idiomatisch deutlich.
- source_word: ὑποσκελίζειν
  choice: zu Fall zu bringen
  rationale: Bewahrt die Metaphorik des Beinstellens beziehungsweise Stürzens, klingt aber in der ernsten Rede angemessen.
- source_word: ἐπιστρέψει Ἰσραήλ
  choice: Israel umkehrt
  rationale: „Umkehren“ erhält sowohl die Bewegung des Zurückkehrens als auch den religiös-ethischen Sinn, ohne ausdrücklich „Buße tun“ einzutragen.
- source_word: συντελεσθήσεται ἡ βασιλεία τοῦ ἐχθροῦ
  choice: wird das Reich des Feindes sein Ende finden
  rationale: Im Zusammenhang bezeichnet das Verb die Beendigung des feindlichen Reiches, nicht dessen positive Vollendung.
- source_word: εἰς τέλος κακῶν
  choice: bis zum Äußersten ins Böse
  rationale: Erhält die schwer deutbare Vorstellung von einem Fall in das äußerste beziehungsweise vollendete Böse, ohne sie zu verharmlosen.
- source_word: ζητοῦντι τὸ θέλημα αὐτοῦ
  choice: das nach seinem Willen sucht
  rationale: Gibt ζητεῖν präzise als Suchen wieder und ersetzt es nicht durch das interpretierende „seinen Willen tut“.
- source_word: κολλήθητε τῇ δικαιοσύνῃ
  choice: haltet an der Gerechtigkeit … fest
  rationale: Überträgt das kräftige Bild des Sich-Anheftens in gut verständliches, verbindliches Deutsch.
- source_word: ἔσται τὸ γένος ὑμῶν εἰς σωτηρίαν
  choice: wird eure Nachkommenschaft … Rettung finden
  rationale: Gibt die schwerfällige griechische Zielkonstruktion sinnvoll wieder, ohne die Art der Rettung näher zu definieren.
theological_decisions:
- issue: Identität des fürbittenden Engels und Mittlers
  choice: Der Text bezeichnet ihn zugleich als „Engel“ und als „Mittler zwischen Gott und Menschen“, ohne weitere Identifizierung.
  alternative: Deutung als Schutzengel Israels, messianische Gestalt oder ausdrücklicher Verweis auf eine spätere christologische Lehre.
  rationale: Beide Aussagen des griechischen Textes werden nebeneinandergestellt; die Spannung wird weder harmonisiert noch durch eine konfessionelle Auslegung aufgelöst.
- issue: Der Herr bleibt bei Israel und geht zugleich zu einem anderen Volk hinüber
  choice: Beide Aussagen werden entsprechend dem vorgelegten griechischen Wortlaut beibehalten.
  alternative: Die Verneinung streichen und übersetzen, der Herr werde Israel verlassen; oder für „wird hinübergehen“ ein anderes, nur erschlossenes Subjekt annehmen.
  rationale: Die Überlieferung ist syntaktisch und inhaltlich schwierig. Eine Fußnote macht darauf aufmerksam, statt den Text stillschweigend zu glätten.
- issue: Klammerabschnitt über den Retter der Völker
  choice: Der Abschnitt wird übersetzt und in eckigen Klammern gedruckt.
  alternative: Den Abschnitt als sekundär auslassen oder ohne Kennzeichnung als vollständig gesicherten Bestandteil drucken.
  rationale: Er steht im bereitgestellten griechischen Zeugen, ist dort jedoch als abgegrenzter Abschnitt markiert und wird häufig als spätere Erweiterung beurteilt.
- issue: Rettung der Nachkommenschaft in Vers 10
  choice: „wird … Rettung finden“
  alternative: „wird zur Rettung sein“ oder eine ausdrückliche heilsgeschichtliche Identifikation der Nachkommenschaft.
  rationale: Die griechische Wendung εἰς σωτηρίαν ist knapp und mehrdeutig; die Übersetzung vermeidet eine bestimmte dogmatische Ausdeutung.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, testamentarisch-mahnendem Ton. Biblisch geläufige Wendungen wie „fürchtet den Herrn“, „naht euch Gott“ und „Gerechtigkeit Gottes“ bleiben erhalten, während unnötige Archaismen vermieden werden. Die Verszählung folgt dem griechischen Ausgangstext; Vers 11 wird gegen die unvollständige englische Konsultationsfassung aus dem griechischen Text aufgenommen.
