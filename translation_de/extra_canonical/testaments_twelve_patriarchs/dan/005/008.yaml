  source_fidelity: Die Grundstruktur des griechischen Zukunftsausspruchs ist zutreffend wiedergegeben. Das in eckigen Klammern überlieferte σὺν αὐτοῖς („mit ihnen“) ist korrekt im Text kenntlich gemacht und erläutert. Das ebenfalls unsicher überlieferte einleitende Καὶ wird im Entwurf jedoch durch „Und“ wiedergegeben, ohne dass dies kenntlich gemacht wird. Da es nur eine koordinierende Partikel ist, wird es besser nicht übersetzt. Für πάσας τὰς πονηρίας wahrt „alle Übel“ zudem den Plural und die offene Bedeutung besser als das kollektiv-singulare „alles Unheil“.
  naturalness: Die Satzfügung ist modernes, würdiges Standarddeutsch. „In die Gefangenschaft geführt werden“ und „Plagen Ägyptens“ sind idiomatisch und dem Register angemessen. „Alle Übel der Völker“ ist natürlich genug und bildet die wiederholte griechische Allquantifizierung sowie den Plural klarer ab.
  terminology: „Gefangenschaft“ gibt αἰχμαλωσία treffend wieder; „Plagen“ ist für πληγαί im Bezug auf Ägypten etabliert. „Völker“ ist für ἐθνῶν neutral und angemessen. „Übel“ lässt bei πονηρίαι offen, ob Bosheiten, schlimme Verhältnisse oder erfahrenes Unheil im Blick sind.
  issues:
  - severity: low
    issue: Das textkritisch unsichere einleitende Καὶ wird als „Und“ übersetzt, aber nicht markiert.
    rationale: Die Vorlage setzt Καὶ in eckige Klammern. Da die Partikel für den deutschen Sinn entbehrlich ist, vermeidet ihre Auslassung eine unmarkierte Wiedergabe unsicherer Textsubstanz.
  - severity: low
    issue: „alles Unheil“ nivelliert den Plural πάσας τὰς πονηρίας.
    rationale: „Alle Übel“ erhält die Pluralform und die parallele Wiederholung von „alle“ im griechischen Text, ohne die Bedeutung auf Katastrophen oder moralische Bosheit einzuengen.
  revised_text: Deshalb werdet ihr [mit ihnen][a] in die Gefangenschaft geführt werden; dort werdet ihr alle Plagen Ägyptens und alle Übel der Völker empfangen.
