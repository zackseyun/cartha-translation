source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: ⌈Καὶ⌉⁶⁹ διὰ τοῦτο ἀπαχθήσεσθε⁷⁰ [σὺν αὐτοῖς]⁷¹ *εἰς αἰχμαλωσίαν⁷², κἀκεῖ ἀπολήψεσθε⁷³ *πάσας τὰς πληγὰς Αἰγύπτου⁷⁴ καὶ πάσας τὰς⁷⁵ πονηρίας⁷⁶ τῶν ἐθνῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/008.yaml
  text: Therefore you will be led away with them into captivity, and there you will receive all the plagues of Egypt and all the evils of the nations.
translation:
  language: de
  text: Deshalb werdet ihr [mit ihnen][a] in die Gefangenschaft geführt werden; dort werdet ihr alle Plagen Ägyptens und alle Übel der Völker empfangen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „mit ihnen“ sind in der griechischen Überlieferung textkritisch unsicher.
    reason: Das griechische σὺν αὐτοῖς steht in der Vorlage in eckigen Klammern.
lexical_decisions:
- source_word: ἀπαχθήσεσθε
  choice: werdet … in die Gefangenschaft geführt werden
  rationale: Das Futur Passiv bezeichnet ein gewaltsames Wegführen; zusammen mit εἰς αἰχμαλωσίαν ist diese Wendung im Deutschen natürlich und präzise.
- source_word: ἀπολήψεσθε
  choice: werdet … empfangen
  rationale: Gibt das zukünftige Erlangen bzw. Erfahren wieder, ohne die Art der Vergeltung über den griechischen Wortlaut hinaus festzulegen.
- source_word: πληγὰς
  choice: Plagen
  rationale: Im Zusammenhang mit Ägypten ist „Plagen“ die geläufige und sachlich passende Wiedergabe.
- source_word: πονηρίας
  choice: Unheil
  rationale: Der Plural kann Übel, Bosheiten oder schlimme Zustände bezeichnen. Das kollektive „alles Unheil“ wahrt die Weite des Ausdrucks und klingt im Deutschen natürlich.
- source_word: τῶν ἐθνῶν
  choice: der Völker
  rationale: „Völker“ gibt ἔθνη neutral wieder, ohne die mögliche Bedeutung „Heiden“ konfessionell oder religiös zu verengen.
theological_decisions:
- issue: Beziehung der Plagen Ägyptens zum angekündigten Exil
  choice: Die Bildsprache wird direkt als „alle Plagen Ägyptens“ bewahrt.
  alternative: Eine erklärende Übertragung wie „Plagen wie einst in Ägypten“.
  rationale: Der griechische Text formuliert eine unmittelbare Genitivverbindung und lässt offen, ob Identität, Wiederholung oder typologische Entsprechung gemeint ist.
- issue: Textkritisch unsicheres σὺν αὐτοῖς
  choice: „mit ihnen“ wird im Text beibehalten und mit einer Fußnote als textkritisch unsicher gekennzeichnet.
  alternative: 'Die Wendung auslassen: „werdet ihr in die Gefangenschaft geführt werden“.'
  rationale: Die Edition setzt die Worte in eckige Klammern. Ihre Aufnahme bewahrt die konsultierte Lesart, während die Fußnote die Überlieferungsunsicherheit transparent macht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das passivische Zukunftsurteil und die dichte Gerichtsbildsprache bleiben erhalten; das Semikolon sorgt für einen natürlichen Satzfluss, ohne die beiden Aussagen voneinander zu lösen.
