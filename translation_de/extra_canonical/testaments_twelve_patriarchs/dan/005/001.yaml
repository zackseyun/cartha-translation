id: T12P.DAN.5.1
reference: Testament of Dan 5:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: V. Φυλάξατε¹ οὖν, *τέκνα μου², *τὴν ἐντολὴν³ τοῦ⁴ Κυρίου καὶ τὸν νόμον αὐτοῦ τηρήσατε⁵· ἀπόστητε⁶ ἀπὸ τοῦ⁷ θυμοῦ⁸, καὶ μισήσατε⁹ τὸ ψεῦδος, ἵνα¹⁰ *Κύριος κατοικήσει ἐν ὑμῖν¹¹ καὶ φεύξεται¹² *ἀφ᾽ ὑμῶν¹³ ὁ Βελίαρ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/001.yaml
  text: Therefore, my children, keep the commandment of the Lord, and keep his law. Depart from anger, and hate falsehood, so that the Lord may dwell in you and Beliar may flee from you.
translation:
  language: de
  text: Darum, meine Kinder, haltet das Gebot des Herrn und bewahrt sein Gesetz. Haltet euch vom Zorn fern und hasst die Lüge, damit der Herr in euch wohnt und Beliar von euch flieht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξατε
  choice: haltet
  rationale: Gibt den Imperativ im Zusammenhang mit »Gebot« natürlich und traditionsnah wieder.
- source_word: τηρήσατε
  choice: bewahrt
  rationale: Unterscheidet das zweite Verb stilistisch vom ersten und bewahrt zugleich den Sinn des treuen Einhaltens.
- source_word: ἀπόστητε ἀπὸ τοῦ θυμοῦ
  choice: Haltet euch vom Zorn fern
  rationale: Natürliches modernes Deutsch für die Aufforderung, sich vom Zorn abzuwenden beziehungsweise Abstand von ihm zu halten.
- source_word: τὸ ψεῦδος
  choice: die Lüge
  rationale: Bezeichnet hier die Lüge beziehungsweise Falschheit als sittlich zu hassendes Übel; »die Lüge« ist im Deutschen knapp und idiomatisch.
- source_word: κατοικήσει ἐν ὑμῖν
  choice: in euch wohnt
  rationale: Gibt ἐν ὑμῖν unmittelbar wieder und lässt offen, ob die angesprochene Gemeinschaft oder ihre einzelnen Angehörigen im Vordergrund stehen.
- source_word: ὁ Βελίαρ
  choice: Beliar
  rationale: Bewahrt den Eigennamen der widergöttlichen Gestalt statt ihn deutend zu übersetzen.
theological_decisions:
- issue: Bedeutung von ἐν ὑμῖν
  choice: in euch
  alternative: unter euch
  rationale: Die wörtlich naheliegende Wiedergabe bewahrt sowohl eine innere als auch eine gemeinschaftliche Lesart, ohne die Aussage auf eine davon festzulegen.
- issue: Finalsatz mit ἵνα und futurischen Verbformen
  choice: damit der Herr in euch wohnt und Beliar vor euch flieht
  alternative: sodass der Herr in euch wohnen und Beliar vor euch fliehen wird
  rationale: »damit« gibt den Zweck- beziehungsweise Folgebezug natürlich wieder, ohne die theologische Beziehung zwischen Mahnung und göttlicher Gegenwart weiter zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Imperative bleiben klar hörbar; »Beliar« wird als Eigenname beibehalten. Keine Fußnoten erforderlich.
