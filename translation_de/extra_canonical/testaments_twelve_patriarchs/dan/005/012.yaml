id: T12P.DAN.5.12
reference: Testament of Dan 5:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *ἀναπαύσονται ἐν Ἐδὲμ ἅγιοι⁹⁵, καὶ ἐπὶ *τῆς νέας⁹⁶ Ἱερουσαλὴμ εὐφρανθήσονται δίκαιοι, *ἥτις ἐστι δόξα θεοῦ αἰώνιος⁹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/012.yaml
  text: And the holy ones will rest in Eden, and the righteous will rejoice over the new Jerusalem, which is the eternal glory of God.
translation:
  language: de
  text: Und die Heiligen werden in Eden Ruhe finden, und die Gerechten werden sich über das neue Jerusalem freuen, das Gottes ewige Herrlichkeit ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναπαύσονται
  choice: werden Ruhe finden
  rationale: Gibt das zukünftige Ruhen bzw. Ausruhen natürlich und würdevoll wieder, ohne über den griechischen Ausdruck hinauszugehen.
- source_word: ἅγιοι
  choice: die Heiligen
  rationale: Entspricht der substantivisch gebrauchten Bezeichnung für die heiligen Menschen.
- source_word: ἐπὶ τῆς νέας Ἱερουσαλήμ
  choice: über das neue Jerusalem
  rationale: Bewahrt mit „über“ die durch ἐπί ausgedrückte Ausrichtung der Freude auf Jerusalem, statt den Text zu „im neuen Jerusalem“ zu glätten.
- source_word: εὐφρανθήσονται
  choice: werden sich freuen
  rationale: Eine natürliche deutsche Wiedergabe der zukünftigen Freude; ein stärkeres „jubeln“ wäre möglich, aber spezifischer.
- source_word: δόξα θεοῦ αἰώνιος
  choice: Gottes ewige Herrlichkeit
  rationale: Bewahrt die Genitivbeziehung und die zeitliche Qualität von αἰώνιος knapp und idiomatisch.
theological_decisions:
- issue: Bezug und Aussagewert von ἥτις
  choice: „das Gottes ewige Herrlichkeit ist“ als Relativsatz zu „das neue Jerusalem“
  alternative: „denn es ist Gottes ewige Herrlichkeit“
  rationale: Der Relativsatz folgt der grammatischen Form von ἥτις enger und vermeidet, die Beziehung ausdrücklich kausal zu deuten.
- issue: Bedeutung von ἐπί bei der Freude über Jerusalem
  choice: „sich über das neue Jerusalem freuen“
  alternative: „sich im neuen Jerusalem freuen“
  rationale: „Über“ wahrt den naheliegenden Gegenstandsbezug von ἐπί mit Dativ; „im“ würde eine lokale Lesart festlegen, die der Ausdruck nicht zwingend verlangt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Register. Der parallele Satzbau des Griechischen bleibt erkennbar; „Ruhe finden“ klingt natürlicher als das mögliche „ruhen“ und erhält zugleich den eschatologischen Ton.
