  text: Liebt den Herrn euer ganzes Leben lang und einander mit aufrichtigem Herzen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀγαπήσατε
  choice: Liebt
  rationale: Der Aorist-Imperativ fordert nachdrücklich zu einer umfassenden Haltung und Handlung der Liebe auf; im Deutschen ist der Präsensimperativ „Liebt“ natürlich und angemessen.
- source_word: τὸν Κύριον
  choice: den Herrn
  rationale: Die übliche und kontextgerechte Wiedergabe des griechischen Titels Κύριος.
- source_word: ἐν πάσῃ τῇ ζωῇ ὑμῶν
  choice: euer ganzes Leben lang
  rationale: Gibt die zeitliche Gesamtheit idiomatisch wieder, ohne die griechische Präposition mechanisch abzubilden.
- source_word: ἀλλήλους
  choice: einander
  rationale: Bewahrt den wechselseitigen Sinn des griechischen Reziprokpronomens.
- source_word: ἐν ἀληθινῇ καρδίᾳ
  choice: mit aufrichtigem Herzen
  rationale: ἀληθινός bezeichnet hier ein wahrhaftiges, unverstelltes Herz; „aufrichtig“ ist im modernen Deutschen natürlicher als „wahr“ und bewahrt den ethischen Sinn.
theological_decisions:
- issue: Bezug und Art der gebotenen Liebe
  choice: Die Liebe zum Herrn und zueinander wird parallel als Aufforderung wiedergegeben.
  alternative: Den zweiten Teil als bloße Folge oder nähere Erklärung der Gottesliebe formulieren.
  rationale: Das griechische καὶ verbindet zwei direkte Objekte derselben Aufforderung, ohne ihr Verhältnis weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung ist knapp und unmittelbar; „euer ganzes Leben lang“ klingt natürlicher als eine formale Nachbildung mit „in eurem ganzen Leben“.
