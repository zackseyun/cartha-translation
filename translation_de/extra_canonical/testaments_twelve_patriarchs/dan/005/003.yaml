review_pass:
  verdict: approve
  source_fidelity: Die Übersetzung gibt den Aoristimperativ Ἀγαπήσατε angemessen durch „Liebt“ wieder. „den Herrn“ entspricht τὸν Κύριον; „euer ganzes Leben lang“ überträgt ἐν πάσῃ τῇ ζωῇ ὑμῶν idiomatisch und vollständig. „einander“ bewahrt den reziproken Sinn von ἀλλήλους, und „mit aufrichtigem Herzen“ trifft ἐν ἀληθινῇ καρδίᾳ im Deutschen natürlich, ohne den Ausdruck theologisch zu verengen.
  naturalness: Knapper, würdiger und in modernem Standarddeutsch sehr natürlicher Imperativsatz. Die parallele Verbindung der beiden Liebesgebote bleibt klar. Das singularische „Herzen“ ist in dieser festen deutschen Wendung idiomatisch und kann wie das griechische Singularwort kollektiv verstanden werden.
  terminology: „Herr“ ist die etablierte und kontextgerechte Wiedergabe von Κύριος. „Aufrichtig“ gibt den hier ethisch gemeinten Sinn von ἀληθινῇ treffend wieder. Gegenüber der englischen Audit-Fassung bestehen keine inhaltlichen Abweichungen; die deutsche Fassung bewahrt deren knappe Ausdrucksweise.
  issues: []
  revised_text: Liebt den Herrn euer ganzes Leben lang und einander mit aufrichtigem Herzen.
