revisions:
- from: Denn ich habe im Buch Henochs, des Gerechten, gelesen und erkannt, dass euer Herrscher der Satan ist und dass die Geister der Bosheit und des Hochmuts gehorchen werden, indem sie den Söhnen Levis zur Seite stehen,[a] um sie dazu zu bringen, vor dem Herrn zu sündigen.
  to: Denn ich habe im Buch Henochs, des Gerechten, gelesen und erkannt, dass euer Herrscher der Satan ist und dass die Geister der Bosheit und des Hochmuts sich dazu fügen werden, den Söhnen Levis beizustehen,[a] um sie dazu zu bringen, vor dem Herrn zu sündigen.
  rationale: Die Revision ersetzt eine im Deutschen kaum nachvollziehbare wörtliche Verknüpfung durch eine natürliche Formulierung, die die im griechischen ὑπακούσονται liegende Unterordnungsnuance weiterhin erkennen lässt. Zugleich stellt die Fußnote klar, dass das griechische Bezugsobjekt nicht explizit genannt und der gesamte Ausdruck textkritisch belastet ist. Die Aussage über die Verführung der Söhne Levis bleibt unverändert.
