source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '[᾿Ανέγνων γὰρ⁵⁰ ἐν βίβλῳ Ἐνὼχ⁵¹ τοῦ δικαίου ⌈καὶ ἔγνων⌉¹⁵² ὅτι ὁ⁵³ ἄρχων ὑμῶν⁵⁴ ὁ Σατανᾶς ἐστιν⁵⁵ *καὶ ὅτι⁵⁶ τὰ πνεύματα τῆς πονηρίας⁵⁷ καὶ τῆς ὑπερηφανίας †ὑπακούσονται⁵⁸ *τοῦ παρεδρεύειν⁵⁹ τοῖς υἱοῖς Λευί, τοῦ ποιεῖν⁶⁰ αὐτοὺς ἐξαμαρτάνειν ἐνώπιον Κυρίου.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/006.yaml
  text: For I have read in the book of Enoch the righteous, and I learned that your ruler is Satan, and that the spirits of wickedness and pride will obey in attending the sons of Levi, to make them sin before the Lord.
translation:
  language: de
  text: Denn ich habe im Buch Henochs, des Gerechten, gelesen und erkannt, dass euer Herrscher der Satan ist und dass die Geister der Bosheit und des Hochmuts sich dazu fügen werden, den Söhnen Levis beizustehen,[a] um sie dazu zu bringen, vor dem Herrn zu sündigen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut ist hier unsicher und syntaktisch schwierig. Er enthält ein Wort für „gehorchen“, ohne ausdrücklich zu sagen, wem gehorcht wird, verbunden mit „den Söhnen Levis beizustehen“. Möglicherweise ist einfacher gemeint: „dass die Geister der Bosheit und des Hochmuts den Söhnen Levis beistehen werden“.'
    reason: Die Edition kennzeichnet ὑπακούσονται und den anschließenden Ausdruck textkritisch. Die Anmerkung bewahrt die Unsicherheit des überlieferten Satzbaus und erläutert die deutsche Wiedergabe.
lexical_decisions:
- source_word: ἄρχων
  choice: Herrscher
  rationale: Gibt die Bedeutung einer herrschenden oder führenden Macht wieder, ohne sie unnötig auf »Fürst« oder »Anführer« einzuengen.
- source_word: ὁ Σατανᾶς
  choice: der Satan
  rationale: Der Artikel wird beibehalten; »Satan« bezeichnet hier den gegnerischen Herrscher.
- source_word: τὰ πνεύματα τῆς πονηρίας καὶ τῆς ὑπερηφανίας
  choice: die Geister der Bosheit und des Hochmuts
  rationale: Die beiden Genitivbestimmungen werden parallel und in würdigem, verständlichem Deutsch wiedergegeben.
- source_word: παρεδρεύειν
  choice: zur Seite stehen
  rationale: Das Verb bezeichnet ein Dabeisitzen beziehungsweise Beistehen oder Aufwarten; »zur Seite stehen« bewahrt diese räumlich-dienstende Vorstellung.
- source_word: ἐξαμαρτάνειν ἐνώπιον Κυρίου
  choice: vor dem Herrn zu sündigen
  rationale: Folgt eng der griechischen Wendung und bewahrt ihren religiös-gerichtlichen Ernst.
theological_decisions:
- issue: Verhältnis der bösen Geister zu den Söhnen Levis
  choice: »gehorchen werden, indem sie den Söhnen Levis zur Seite stehen«
  alternative: »den Söhnen Levis zur Seite stehen werden«
  rationale: Das überlieferte ὑπακούσονται wird ausdrücklich wiedergegeben, obwohl seine syntaktische Verbindung mit τοῦ παρεδρεύειν schwierig und textkritisch unsicher ist. So wird die Spannung des griechischen Textes nicht stillschweigend beseitigt.
- issue: Bezeichnung Satans als Herrscher der Angeredeten
  choice: »euer Herrscher ist der Satan«
  alternative: »euer Anführer ist Satan«
  rationale: Die direkte und herausfordernde Aussage des Ausgangstextes bleibt erhalten, ohne sie konfessionell auszudeuten oder abzuschwächen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählton. Die ungewöhnliche Aussage des textkritisch schwierigen griechischen Satzes wird im Haupttext bewahrt und durch eine knappe Fußnote erläutert.
