  text: Ἀλήθειαν φθέγγεσθε¹⁴ ἕκαστος πρὸς τὸν πλησίον αὐτοῦ καὶ οὐ μὴ ἐμπέσητε εἰς μῆνιν¹⁵ *καὶ ταραχάς¹⁶, ἀλλ᾽ ἔσεσθε¹⁷ ἐν εἰρήνῃ ἔχοντες τὸν θεὸν *τῆς εἰρήνης¹⁸ καὶ *οὐ μὴ κατισχύσει¹⁹ ὑμῶν²⁰ πόλεμος.
