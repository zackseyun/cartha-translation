revisions:
- from: Sagt jeder seinem Nächsten die Wahrheit. Dann werdet ihr gewiss nicht in Zorn und Unruhen geraten, sondern in Frieden leben, den Gott des Friedens bei euch haben, und kein Krieg wird euch überwältigen.
  to: Jeder sage seinem Nächsten die Wahrheit, und ihr werdet gewiss nicht in Zorn und Unruhen geraten, sondern in Frieden sein, den Gott des Friedens bei euch haben, und kein Krieg wird euch überwältigen.
