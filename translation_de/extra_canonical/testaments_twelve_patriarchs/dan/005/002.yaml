base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/002.yaml
  text: Speak truth, each one to his neighbor, and you will certainly not fall into wrath and tumults; rather, you will be in peace, having the God of peace, and no war will prevail against you.
translation:
  language: de
  text: Jeder sage seinem Nächsten die Wahrheit, und ihr werdet gewiss nicht in Zorn und Unruhen geraten, sondern in Frieden sein, den Gott des Friedens bei euch haben, und kein Krieg wird euch überwältigen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλήθειαν φθέγγεσθε
  choice: Sagt … die Wahrheit
  rationale: Gibt die Aufforderung idiomatisch und zugleich eng am griechischen Ausdruck wieder.
- source_word: ἕκαστος πρὸς τὸν πλησίον αὐτοῦ
  choice: jeder seinem Nächsten
  rationale: Bewahrt sowohl den distributiven Sinn von ἕκαστος als auch die traditionelle, im Deutschen verständliche Wiedergabe von πλησίον.
- source_word: μῆνιν καὶ ταραχάς
  choice: Zorn und Unruhen
  rationale: μῆνις bezeichnet heftigen Zorn; der Plural ταραχαί kann Aufruhr, Wirren oder Unruhen meinen. „Unruhen“ erhält die offene soziale und persönliche Reichweite.
- source_word: ἔσεσθε ἐν εἰρήνῃ
  choice: in Frieden leben
  rationale: Natürliches modernes Deutsch für das wörtliche „ihr werdet in Frieden sein“.
- source_word: ἔχοντες τὸν θεὸν τῆς εἰρήνης
  choice: den Gott des Friedens bei euch haben
  rationale: Bewahrt das Partizip „habend“, ohne eine bestimmte Art göttlicher Gegenwart näher festzulegen.
- source_word: οὐ μὴ κατισχύσει ὑμῶν πόλεμος
  choice: kein Krieg wird euch überwältigen
  rationale: Die verstärkte Verneinung wird durch „kein … wird“ klar wiedergegeben; κατισχύω bezeichnet das Überwältigen oder die Oberhand gewinnen.
theological_decisions:
- issue: Zusammenhang zwischen Wahrhaftigkeit, Frieden und Gottes Gegenwart
  choice: Die Aussagen werden als Folge bzw. zusammengehörige Verheißung wiedergegeben, ohne einen streng mechanischen Ursache-Wirkungs-Zusammenhang zu behaupten.
  alternative: „Weil ihr den Gott des Friedens habt“ oder „wenn ihr den Gott des Friedens habt“.
  rationale: Das griechische Partizip ἔχοντες lässt das genaue logische Verhältnis offen; die Übersetzung soll diese Spannung nicht dogmatisch festlegen.
- issue: Bedeutung von πόλεμος
  choice: „Krieg“
  alternative: „Streit“ oder „Kampf“.
  rationale: Die Grundbedeutung ist Krieg. Eine rein innerpersönliche oder metaphorische Deutung wäre eine unnötige Einschränkung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Aufforderung bleibt klar; verstärkte Verneinung und Verheißungscharakter werden hörbar gemacht. Keine Fußnoten sind erforderlich, da die vorgelegten textkritischen Zeichen ohne zugehörige Varianten keine belastbare Anmerkung erlauben.
