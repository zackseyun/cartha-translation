review_pass:
  verdict: revise
  source_fidelity: Die Vorlage gibt den griechischen Imperativ Plural φθέγγεσθε, den distributiven Zusatz ἕκαστος, die verstärkte Verneinung οὐ μή sowie die partizipiale Fügung ἔχοντες insgesamt treffend wieder. „Dann“ fügt jedoch einen expliziten zeitlich-logischen Anschluss hinzu, den das bloße καί nicht verlangt; die Satzgliederung kann näher am fortlaufenden griechischen Satz bleiben.
  naturalness: Der Entwurf ist gut verständliches, würdevolles modernes Standarddeutsch. „Sagt jeder seinem Nächsten die Wahrheit“ ist jedoch als Wortstellung leicht weniger flüssig als „Jeder sage seinem Nächsten die Wahrheit“; außerdem klingt „in Frieden leben“ gegenüber „in Frieden sein“ etwas stärker dauerhaft-lebensführend.
  terminology: „Nächster“, „Zorn“, „Unruhen“, „Gott des Friedens“ und „Krieg“ sind sachgerecht. „Euch überwältigen“ gibt κατισχύσει angemessen wieder. Die Wiedergabe von οὐ μή als „werdet ihr gewiss nicht“ erhält die Nachdrücklichkeit besser als ein unbetontes Futur.
  issues:
  - severity: low
    issue: „Dann“ als Satzanschluss
    rationale: Das griechische καί verbindet die Aussagen, ohne ausdrücklich eine zeitliche Abfolge („dann“) zu markieren. Eine koordinierende Fortführung wahrt die offene Beziehung besser.
  - severity: low
    issue: Wortstellung und Satzgliederung
    rationale: Die distributive Aufforderung lässt sich im Deutschen natürlicher als „Jeder sage seinem Nächsten die Wahrheit“ formulieren. Die fortlaufende Konstruktion mit „und“ bildet die griechische Verknüpfung genauer nach.
  revised_text: Jeder sage seinem Nächsten die Wahrheit, und ihr werdet gewiss nicht in Zorn und Unruhen geraten, sondern in Frieden sein, den Gott des Friedens bei euch haben, und kein Krieg wird euch überwältigen.
