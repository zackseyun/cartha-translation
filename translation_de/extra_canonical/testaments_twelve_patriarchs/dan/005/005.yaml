source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *ὡς ἂν ἀποστήσεσθε⁴⁰ ἀπὸ⁴¹ Κυρίου⁴², *ἐν πάσῃ κακίᾳ⁴³ *πορευόμενοι ποιήσετε τὰ βδελύγματα τῶν ἐθνῶν ἐκπορνεύοντες ἐν⁴⁴ γυναιξὶν ἀνόμων⁴⁵ καὶ ἐν πάσῃ πονηρίᾳ⁴⁶ ἐνεργούντων⁴⁷ ⌈ἐν ὑμῖν⌉¹ *τῶν πνευμάτων⁴⁸ τῆς πονηρίας⁴⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/005.yaml
  text: And whenever you depart from the Lord, walking in every wickedness, you will do the abominations of the nations, prostituting yourselves with lawless women, and every evil will be at work among you through the spirits of wickedness.
translation:
  language: de
  text: 'Und sooft ihr euch vom Herrn abwendet und in jeder Bosheit lebt, werdet ihr die Gräueltaten der Völker begehen: Ihr werdet mit gesetzlosen Frauen Unzucht treiben, während die Geister der Bosheit in euch[a] in jeder Art von Schlechtigkeit wirken.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „in euch“ fehlen in einem Teil der Textüberlieferung.
    reason: Die Vorlage kennzeichnet ἐν ὑμῖν durch kritische Klammern als textlich unsicher; der Marker bewahrt diese Unsicherheit sichtbar.
lexical_decisions:
- source_word: ὡς ἂν ἀποστήσεσθε ἀπὸ Κυρίου
  choice: sooft ihr euch vom Herrn abwendet
  rationale: Gibt den wiederholungsfähigen bzw. unbestimmt-konditionalen Sinn von ὡς ἄν wieder; ἀφίστημι bezeichnet hier die Abkehr vom Herrn, ohne eine weitergehende dogmatische Deutung einzutragen.
- source_word: ἐν πάσῃ κακίᾳ πορευόμενοι
  choice: und in jeder Bosheit lebt
  rationale: Das semitisch geprägte Bild des Gehens bezeichnet die Lebensführung. „Lebt“ ist im modernen Deutsch natürlich und wahrt den umfassenden Charakter von πάσῃ.
- source_word: τὰ βδελύγματα τῶν ἐθνῶν
  choice: die Gräueltaten der Völker
  rationale: βδέλυγμα bezeichnet verabscheuungswürdige, häufig auch kultisch oder sittlich anstößige Taten; „Gräueltaten“ bleibt kräftig, ohne den Ausdruck auf eine einzige Kategorie zu verengen.
- source_word: ἐκπορνεύοντες ἐν γυναιξὶν ἀνόμων
  choice: mit den Frauen gesetzloser Männer Unzucht treiben
  rationale: ἐκπορνεύω wird als sexuelle Unzucht wiedergegeben. Der Genitiv ἀνόμων ist nicht kongruent mit dem Dativ γυναιξίν und wird daher am ehesten substantivisch auf gesetzlose Männer bzw. Leute bezogen.
- source_word: τῶν πνευμάτων τῆς πονηρίας
  choice: die Geister der Bosheit
  rationale: Die Genitivverbindung bleibt bewusst eng am Griechischen und wird nicht als „böse Geister“ vereinfacht, damit ihre charakterisierende Aussage erhalten bleibt.
- source_word: ἐν πάσῃ πονηρίᾳ ἐνεργούντων
  choice: in jeder Art von Schlechtigkeit wirken
  rationale: Bewahrt die genitivisch-partizipiale Begleitaussage und lässt die Geister als Handelnde erscheinen. „Jede Art von“ ergibt im Deutschen eine natürliche umfassende Aussage.
theological_decisions:
- issue: Handelnde Kraft des Bösen
  choice: Die Geister der Bosheit werden als die Wirkenden bezeichnet.
  alternative: „Jedes Böse wird durch die Geister der Bosheit unter euch wirksam sein.“
  rationale: Die griechische Form ἐνεργούντων stimmt mit τῶν πνευμάτων überein und stellt daher die Geister grammatisch als Subjekt ihres Wirkens dar. Die Übersetzung wahrt diese Konstruktion, ohne Aussagen über Art oder Grad ihres Einflusses hinzuzufügen.
- issue: Bezeichnung der sexuellen Partnerinnen
  choice: „Frauen gesetzloser Männer“
  alternative: „gesetzlose Frauen“ oder „Frauen von Gesetzlosen“
  rationale: Der Genitiv ἀνόμων legt einen substantivischen Bezug nahe. „Männer“ macht den im Deutschen nötigen Bezug verständlich, behauptet aber nicht ausdrücklich, dass es sich um Ehefrauen handelt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem zeitlich-konditionalen Auftakt und der anschließenden Zukunftsaussage; der Doppelpunkt gliedert die konkreten Folgen lesefreundlich. „Unzucht treiben“ ist bewusst ernst und schriftsprachlich, ohne altertümlich zu wirken.
