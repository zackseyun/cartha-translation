  verdict: revise
  source_fidelity: 'Eine sichere Korrektur ist nötig: ἀνόμων stimmt als Genitiv Plural mit γυναιξίν überein (das Adjektiv hat hier für Maskulinum und Femininum dieselbe Form) und bezeichnet daher am naheliegendsten „gesetzlose Frauen“, nicht „Frauen gesetzloser Männer“. Die Geister der Bosheit sind grammatisch die Handelnden von ἐνεργούντων; dies sollte beibehalten werden. Die textkritisch unsichere Wendung ἐν ὑμῖν ist korrekt mit Fußnote markiert.'
  naturalness: Die Sprache ist überwiegend modernes, würdiges Standarddeutsch. Die revidierte Fassung vermeidet die unzutreffende und im Deutschen unnötig spezifizierende Umschreibung „Frauen gesetzloser Männer“.
  terminology: „Herr“, „Unzucht“, „Geister der Bosheit“ und die Kennzeichnung der textlich unsicheren Worte sind angemessen. „Gräueltaten der Völker“ gibt τὰ βδελύγματα τῶν ἐθνῶν verständlich und ausreichend weit wieder.
