  to: 'Und sooft ihr euch vom Herrn abwendet und in jeder Bosheit lebt, werdet ihr die Gräueltaten der Völker begehen: Ihr werdet mit gesetzlosen Frauen Unzucht treiben, während die Geister der Bosheit in euch[a] in jeder Art von Schlechtigkeit wirken.'
  rationale: Es wird ausschließlich die sachlich nicht tragfähige Deutung von ἐν γυναιξὶν ἀνόμων korrigiert. Die revidierte Formulierung „mit gesetzlosen Frauen“ wahrt die griechische Kongruenz und vermeidet eine zusätzliche, nicht abgesicherte Aussage über gesetzlose Männer. Die übrige Satzführung und die Fußnotenbehandlung können bestehen bleiben.
