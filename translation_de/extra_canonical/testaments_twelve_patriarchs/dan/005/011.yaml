source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ τὴν αἰχμαλωσίαν λήψεται⁸⁹ ἀπὸ τοῦ Βελίαρ, [τὰς ψυχὰς τῶν ἁγίων]⁹⁰, *καὶ ἐπιστρέψει⁹¹ καρδίας⁹² ἀπειθεῖς⁹³ πρὸς Κύριον. καὶ δώσει *τοῖς ἐπικαλουμένοις αὐτὸν⁹⁴ εἰρήνην αἰώνιον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/011.yaml
  text: And he will take the captivity from Beliar, even the souls of the holy ones, and he will turn disobedient hearts to the Lord, and he will give eternal peace to those who call on him.
translation:
  language: de
  text: Und er wird Beliar die Gefangenen entreißen [nämlich die Seelen der Heiligen][a] und ungehorsame Herzen zum Herrn hinwenden. Und denen, die ihn anrufen, wird er ewigen Frieden geben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „nämlich die Seelen der Heiligen“ sind textkritisch unsicher und fehlen möglicherweise in einem Teil der Überlieferung.
    reason: Die eckigen Klammern in der griechischen Edition kennzeichnen einen unsicheren beziehungsweise möglicherweise sekundären Textbestand.
lexical_decisions:
- source_word: λήψεται ἀπὸ τοῦ Βελίαρ
  choice: wird Beliar die Gefangenschaft entreißen
  rationale: Die Konstruktion bezeichnet ein Wegnehmen aus Beliars Gewalt. „Entreißen“ gibt den Befreiungscharakter natürlich wieder, ohne den im Griechischen ungewöhnlichen Ausdruck „die Gefangenschaft nehmen“ wörtlich nachzubilden.
- source_word: τὰς ψυχὰς τῶν ἁγίων
  choice: nämlich die Seelen der Heiligen
  rationale: Die Apposition erläutert wahrscheinlich „die Gefangenschaft“. „Nämlich“ macht diese Beziehung verständlich; die textkritische Unsicherheit wird in einer Fußnote bewahrt.
- source_word: ἐπιστρέψει
  choice: wird … zurückführen
  rationale: Das Verb kann „umkehren“, „zurückbringen“ oder „zurückführen“ bedeuten. Mit „Herzen“ als Objekt ist „zurückführen“ im Deutschen natürlich und wahrt die Ausrichtung zum Herrn.
- source_word: καρδίας ἀπειθεῖς
  choice: ungehorsame Herzen
  rationale: ἀπειθής kann „ungehorsam“ oder „ungläubig“ heißen. „Ungehorsam“ bewahrt hier die ethische und relationale Weite, ohne die Aussage ausschließlich auf intellektuellen Unglauben zu verengen.
- source_word: τοῖς ἐπικαλουμένοις αὐτόν
  choice: denen, die ihn anrufen
  rationale: Die traditionelle und klare Wiedergabe bezeichnet das vertrauensvolle oder gottesdienstliche Anrufen einer Person.
- source_word: εἰρήνην αἰώνιον
  choice: ewigen Frieden
  rationale: Direkte, idiomatische Wiedergabe der zeitlich uneingeschränkten Friedenszusage.
theological_decisions:
- issue: Bezug des Pronomens αὐτόν („ihn“)
  choice: Das Pronomen bleibt als „ihn“ unaufgelöst.
  alternative: „den Herrn“ oder die zuvor handelnde messianische Gestalt ausdrücklich einsetzen
  rationale: Der unmittelbare Kontext des Verses lässt grammatisch beziehungsweise kontextuell mehr als einen Bezug denkbar erscheinen. Die Übersetzung soll diese christologisch relevante Mehrdeutigkeit nicht stillschweigend entscheiden.
- issue: Status der „Seelen der Heiligen“
  choice: Als erläuternde Apposition zu „Gefangenschaft“ wiedergegeben, aber textkritisch markiert.
  alternative: Den eingeklammerten Ausdruck auslassen oder als selbstständiges Objekt behandeln
  rationale: Die überlieferte Form legt eine erläuternde Gleichsetzung nahe; die Klammerung der Edition zeigt jedoch Unsicherheit, die transparent gemacht werden muss.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem feierlichen Zukunftston des griechischen Textes, vermeidet jedoch unnatürliche Wörtlichkeit. „Beliar“ bleibt als Eigenname erhalten.
