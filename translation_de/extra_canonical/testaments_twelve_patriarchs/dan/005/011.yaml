revisions:
- from: Und er wird Beliar die Gefangenschaft entreißen, [nämlich die Seelen der Heiligen],[a] und er wird ungehorsame Herzen zum Herrn zurückführen. Und denen, die ihn anrufen, wird er ewigen Frieden geben.
  to: Und er wird Beliar die Gefangenen entreißen [nämlich die Seelen der Heiligen][a] und ungehorsame Herzen zum Herrn hinwenden. Und denen, die ihn anrufen, wird er ewigen Frieden geben.
  rationale: Die Revision beseitigt die im Deutschen problematische Verbindung eines abstrakten „Gefangenschaft“ mit „entreißen“, ohne den durch αἰχμαλωσία und die unsichere Apposition ausgedrückten Befreiungsgedanken zu verändern. Sie gibt ἐπιστρέψει weniger interpretierend wieder und ordnet den textkritischen Anker eindeutig dem eingeklammerten Text zu.
