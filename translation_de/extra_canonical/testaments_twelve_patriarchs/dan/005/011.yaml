    rationale: Das griechische αἰχμαλωσία kann hier angesichts der folgenden Apposition kollektiv für die Gefangenen stehen. „die Gefangenen entreißen“ stellt den im Deutschen erforderlichen personalen Bezug her und bewahrt den Befreiungssinn.
  - severity: low
    issue: „zurückführen“ kann eine nicht ausdrücklich markierte Rückkehr voraussetzen.
    rationale: ἐπιστρέφειν bezeichnet allgemein ein Wenden bzw. Umwenden. „zum Herrn hinwenden“ bleibt näher an dieser offenen Aussage.
  - severity: low
    issue: Der Fußnotenanker ist nach einem Komma außerhalb der schließenden eckigen Klammer platziert.
    rationale: Der Anker soll unmittelbar den textkritisch unsicheren, eingeklammerten Wortlaut kennzeichnen; die Satzinterpunktion folgt danach.
