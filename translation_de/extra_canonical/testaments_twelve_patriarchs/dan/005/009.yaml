source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ οὕτως⁷⁷ ἐπιστρέψαντες⁷⁸ πρὸς Κύριον ἐλεηθήσεσθε⁷⁹ καὶ ἄξει ὑμᾶς⁸⁰ εἰς τὸ ἁγίασμα αὐτοῦ *καὶ δώσει⁸¹ ὑμῖν εἰρήνην⁸².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/009.yaml
  text: And so, having returned to the Lord, you will receive mercy, and he will bring you into his sanctuary and give you peace.
translation:
  language: de
  text: Und so wird euch, wenn ihr zum Herrn umgekehrt seid, Erbarmen zuteilwerden; er wird euch in sein Heiligtum führen und euch Frieden geben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπιστρέψαντες πρὸς Κύριον
  choice: wenn ihr zum Herrn umgekehrt seid
  rationale: Gibt das vorzeitige Partizip als natürlichen deutschen Temporalsatz wieder und bewahrt die Bewegung der Umkehr hin zum Herrn.
- source_word: ἐλεηθήσεσθε
  choice: werdet ihr Erbarmen finden
  rationale: Die passive Zukunftsform wird idiomatisch wiedergegeben, ohne den Gedanken göttlichen Erbarmens abzuschwächen.
- source_word: ἁγίασμα
  choice: Heiligtum
  rationale: Bezeichnet hier am ehesten einen geheiligten Ort beziehungsweise das Heiligtum Gottes.
- source_word: δώσει ὑμῖν εἰρήνην
  choice: euch Frieden schenken
  rationale: Natürliches Deutsch für das Geben von Frieden; „schenken“ bringt die unverdiente Gabe zum Ausdruck, ohne zusätzliche dogmatische Festlegung.
theological_decisions:
- issue: Verhältnis von Umkehr und Erbarmen
  choice: Die Umkehr wird zeitlich vor dem Empfang des Erbarmens ausgedrückt.
  alternative: „Indem ihr zum Herrn umkehrt, wird er sich eurer erbarmen.“
  rationale: Das aoristische Partizip ἐπιστρέψαντες legt eine der finiten Zukunftsform vorausgehende Handlung nahe; der Text wird wiedergegeben, ohne daraus ein umfassendes Lehrsystem über Verdienst oder Heilsordnung abzuleiten.
- issue: Referent des handelnden Subjekts in „er wird euch führen“
  choice: Das unausgesprochene Subjekt wird als der Herr verstanden.
  alternative: Ein unbestimmtes oder anderes göttliches Subjekt.
  rationale: Der unmittelbar zuvor genannte κύριος ist der natürliche Referent der Verben ἄξει und δώσει.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah an der griechischen Abfolge, wird aber durch einen deutschen Temporalsatz und idiomatische Verbverbindungen flüssig gestaltet.
