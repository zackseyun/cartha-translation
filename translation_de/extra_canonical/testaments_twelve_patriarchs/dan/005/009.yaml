revisions:
- from: Und so werdet ihr, wenn ihr zum Herrn umgekehrt seid, Erbarmen finden; und er wird euch in sein Heiligtum führen und euch Frieden schenken.
  to: Und so wird euch, wenn ihr zum Herrn umgekehrt seid, Erbarmen zuteilwerden; er wird euch in sein Heiligtum führen und euch Frieden geben.
  rationale: Die Revision glättet den Satzbau, bildet das griechische Futurpassiv bei ἐλεηθήσεσθε genauer ab und verwendet bei δώσει die unmittelbare Entsprechung „geben“. Die zeitliche Vorordnung des aoristischen Partizips bleibt durch „wenn ihr … umgekehrt seid“ erhalten; der Herr bleibt aufgrund des Kontextes der natürliche Referent von „er wird führen“ und „[er wird] geben“.
