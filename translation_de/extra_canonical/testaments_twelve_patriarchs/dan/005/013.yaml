    issue: βασιλεύων wird als Zukunftsverb übersetzt
    rationale: „wird über sie herrschen“ löst das griechische Partizip in eine explizite Zukunftsaussage auf. „herrscht über sie“ bewahrt die partizipiale/proklamative Offenheit näher und folgt dem englischen Audit-Trail.
  - severity: low
    issue: ταπεινώσει als „Demut“
    rationale: „Demut“ kann die Bedeutung auf eine freiwillige innere Haltung verengen. „Niedrigkeit“ erhält die mögliche soziale bzw. zuständliche Dimension neben „Armut“.
