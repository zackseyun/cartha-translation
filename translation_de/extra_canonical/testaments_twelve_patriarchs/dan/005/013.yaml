revisions:
- from: Und Jerusalem wird keine Verwüstung mehr erdulden, und Israel wird nicht mehr in Gefangenschaft geführt werden; denn der Herr wird in ihrer Mitte sein und unter den Menschen leben[a], und der Heilige Israels wird über sie herrschen – in Demut und Armut; und wer an ihn glaubt, wird unter den Menschen in Wahrheit herrschen.[b]
  to: Und Jerusalem wird keine Verwüstung mehr erdulden, und Israel wird nicht mehr in Gefangenschaft geführt werden; denn der Herr wird in ihrer Mitte sein und unter den Menschen leben[a], und der Heilige Israels herrscht über sie – in Niedrigkeit und Armut; und wer an ihn glaubt, wird unter den Menschen in Wahrheit herrschen.[b]
  rationale: Die Revision bewahrt die überlieferte Satzfolge und alle textkritischen Markierungen. Das Herrschen des Heiligen Israels wird nicht mehr unnötig als finite Zukunft formuliert, sondern als prophetisches Präsens, das dem griechischen Partizip näherkommt. „Niedrigkeit“ vermeidet eine einengende Deutung von ταπείνωσις als bloßer Tugend der Demut.
