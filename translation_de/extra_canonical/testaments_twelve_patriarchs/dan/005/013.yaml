source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ οὐκέτι ὑπομενεῖ⁹⁸ Ἱερουσαλὴμ ἐρήμωσιν *οὐδὲ αἰχμαλωτισθήσεται Ἰσραήλ⁹⁹, ὅτι¹⁰⁰ Κύριος ἔσται¹⁰¹ *ἐν μέσῳ¹⁰² αὐτῆς¹⁰³ [τοῖς ἀνθρώποις συναναστρεφόμενος]¹⁰⁴ καὶ §¹⁰⁵ Ἅγιος Ἰσραὴλ βασιλεύων¹⁰⁶ ἐπ᾽ αὐτῆς¹⁰⁷ [ἐν *ταπεινώσει καὶ πτωχείᾳ¹⁰⁸, καὶ ὁ πιστεύων *ἐπ᾽ αὐτῷ¹⁰⁹ *βασιλεύσει ἐν τοῖς ἀνθρώποις ἐν ἀληθείᾳ¹¹⁰].
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/013.yaml
  text: And Jerusalem will no longer endure desolation, nor will Israel be taken captive, because the Lord will be in her midst [dwelling among men], and the Holy One of Israel reigning over her [in humility and poverty; and the one who believes in him will reign among men in truth].
translation:
  language: de
  text: Und Jerusalem wird keine Verwüstung mehr erdulden, und Israel wird nicht mehr in Gefangenschaft geführt werden; denn der Herr wird in ihrer Mitte sein und unter den Menschen leben[a], und der Heilige Israels herrscht über sie – in Niedrigkeit und Armut; und wer an ihn glaubt, wird unter den Menschen in Wahrheit herrschen.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „und unter den Menschen leben“ stehen in der zugrunde gelegten griechischen Ausgabe in eckigen Klammern und sind textkritisch unsicher.
    reason: Kennzeichnet die editorisch markierte Unsicherheit des Zusatzes τοῖς ἀνθρώποις συναναστρεφόμενος.
  - marker: b
    text: Der Abschnitt „in Niedrigkeit und Armut … in Wahrheit herrschen“ steht in der zugrunde gelegten griechischen Ausgabe in eckigen Klammern und ist textkritisch unsicher.
    reason: Kennzeichnet die editorisch markierte Unsicherheit des längeren Schlussabschnitts.
lexical_decisions:
- source_word: ὑπομενεῖ
  choice: wird … erdulden
  rationale: Gibt das Aushalten bzw. Ertragen eines Zustands wieder und bewahrt die Aussage, dass Jerusalem künftig keine Verwüstung mehr erfahren muss.
- source_word: αἰχμαλωτισθήσεται
  choice: wird … in Gefangenschaft geführt werden
  rationale: Entspricht dem Passiv und bezeichnet die Wegführung als Gefangene, ohne den Sinn auf eine bestimmte historische Deportation einzuengen.
- source_word: ἐν μέσῳ αὐτῆς
  choice: in ihrer Mitte
  rationale: Bewahrt die räumliche und gemeinschaftliche Bildsprache; das feminine Pronomen bezieht sich am natürlichsten auf Jerusalem.
- source_word: συναναστρεφόμενος
  choice: unter den Menschen leben
  rationale: Das Partizip bezeichnet den Umgang bzw. das Zusammenleben mit anderen; die Formulierung ist idiomatisches modernes Deutsch.
- source_word: βασιλεύων ἐπ᾽ αὐτῆς
  choice: wird über sie herrschen
  rationale: Gibt βασιλεύω als königliches Herrschen und ἐπί mit Genitiv als Herrschaft über Jerusalem wieder. Für einen vollständigen deutschen Satz wird das griechische Partizip verbal entfaltet.
- source_word: ταπεινώσει καὶ πτωχείᾳ
  choice: Demut und Armut
  rationale: Bewahrt sowohl die Haltung bzw. Niedrigkeit als auch die materielle Armut, ohne eine der beiden Größen umzudeuten.
- source_word: ἐν ἀληθείᾳ
  choice: in Wahrheit
  rationale: Die formal nahe Wiedergabe erhält die mögliche Bedeutungsspanne zwischen Wahrhaftigkeit und Übereinstimmung mit der Wahrheit.
theological_decisions:
- issue: Beziehung zwischen „der Herr“ und „der Heilige Israels“
  choice: Die beiden Gottesbezeichnungen bleiben in der koordinierten Satzstruktur stehen, ohne ausdrücklich festzulegen, ob sie als identische Appositionen oder als zwei grammatisch unterschiedene Benennungen zu lesen sind.
  alternative: „Denn der Herr, der Heilige Israels, wird in ihrer Mitte sein und über sie herrschen.“
  rationale: Die Alternative würde die Identifikation syntaktisch stärker festschreiben, als es die überlieferte Formulierung mit καί und dem Partizip βασιλεύων verlangt.
- issue: Bezug von „wer an ihn glaubt“
  choice: Das Pronomen „ihn“ bleibt erhalten.
  alternative: Explizite Ersetzung durch „den Herrn“ oder „den Heiligen Israels“.
  rationale: Der griechische Text verwendet ein Pronomen; eine ausdrückliche Zuordnung würde eine im Satz bereits theologisch enge, aber grammatisch nicht eigens aufgelöste Referenz unnötig festlegen.
- issue: Herrschen des Glaubenden
  choice: „wird unter den Menschen in Wahrheit herrschen“
  alternative: Spirituell abschwächende Wiedergaben wie „wird ein wahrhaft königliches Leben führen“.
  rationale: Die Wiederholung von βασιλεύω wird bewahrt; Art und Reichweite dieses Herrschens werden nicht konfessionell oder allegorisch vorentschieden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt dem prophetischen Duktus nahe, wird aber durch ein Semikolon und einen Gedankenstrich lesbar gegliedert. „In Gefangenschaft geführt“ ist allgemeinverständlich und genauer als das heute leicht missverständliche „gefangen werden“.
