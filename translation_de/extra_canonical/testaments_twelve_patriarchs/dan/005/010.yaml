id: T12P.DAN.5.10
reference: Testament of Dan 5:10
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ ἀνατελεῖ ὑμῖν *ἐκ τῆς φυλῆς [Ἰούδα καὶ] τοῦ Λευὶ τὸ σωτήριον Κυρίου⁸³, *αὐτὸς γὰρ⁸⁴ ποιήσει πρὸς τὸν Βελίαρ πόλεμον⁸⁵, καὶ τὴν ἐκδίκησιν τοῦ νίκους δώσει τοῖς⁸⁶ †πατράσιν⁸⁷ ὑμῶν⁸⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/010.yaml
  text: And for you the salvation of the Lord will arise from the tribe of Judah and Levi. For he himself will make war against Beliar, and he will grant the vengeance of victory to your fathers.
translation:
  language: de
  text: Und für euch wird aus dem Stamm Judas und Levis[a] das Heil des Herrn aufgehen. Denn er selbst wird gegen Beliar Krieg führen und euren Vätern[b] die Vergeltung des Sieges gewähren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Wörter „Judas und“ sind in der griechischen Textausgabe als textlich unsicher gekennzeichnet; ohne sie hieße es: „aus dem Stamm Levis“.'
    reason: Bewahrt eine bedeutende überlieferungsgeschichtliche Unsicherheit, die Herkunft und mögliche messianische Deutung betrifft.
  - marker: b
    text: Die Lesart „Vätern“ ist in der griechischen Textausgabe als unsicher gekennzeichnet.
    reason: Macht die vom Herausgeber markierte textliche Schwierigkeit transparent, ohne eine nicht belegte Ersatzlesart einzusetzen.
lexical_decisions:
- source_word: ἀνατελεῖ
  choice: wird … aufgehen
  rationale: Bewahrt das Bild des Aufgehens bzw. Hervortretens und klingt im Deutschen zugleich natürlich und würdevoll.
- source_word: τὸ σωτήριον Κυρίου
  choice: das Heil des Herrn
  rationale: Gibt die substantivierte Heilsbezeichnung knapp wieder, ohne sie vorschnell als eine ausdrücklich benannte Person oder ausschließlich als abstrakte Rettung festzulegen.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Übernimmt die in dieser Literatur gebräuchliche Namensform, statt sie deutend zu übersetzen.
- source_word: τὴν ἐκδίκησιν τοῦ νίκους
  choice: die Vergeltung des Sieges
  rationale: Folgt der ungewöhnlichen griechischen Genitivverbindung eng und bewahrt ihre Deutungsoffenheit zwischen siegreicher Vergeltung und Vergeltung als Folge des Sieges.
- source_word: δώσει
  choice: gewähren
  rationale: Gibt das wörtliche „geben“ in dieser abstrakten Verbindung idiomatisch wieder, ohne den Inhalt zu erweitern.
theological_decisions:
- issue: Verhältnis des „Heils des Herrn“ zu dem anschließend mit „er selbst“ bezeichneten Handelnden
  choice: Die grammatische Spannung bleibt durch „das Heil … Denn er selbst“ erhalten.
  alternative: Explizit „der Retter des Herrn“ oder „dieses Heil“ schreiben.
  rationale: Der griechische Text nennt zunächst τὸ σωτήριον, verwendet danach jedoch das maskuline αὐτός. Eine eindeutige Personalisierung oder Entpersonalisierung würde diese Spannung auflösen.
- issue: Abstammung aus Juda und Levi
  choice: Beide Herkunftsbezeichnungen werden im Haupttext beibehalten und die textliche Unsicherheit zu „Judas und“ in einer Fußnote kenntlich gemacht.
  alternative: Nur Levi lesen oder die beiden Stämme syntaktisch harmonisieren.
  rationale: Die Edition kennzeichnet [Ἰούδα καὶ] als unsicher; die Überlieferungsspannung soll sichtbar bleiben, ohne den gebotenen Text stillschweigend zu glätten.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzstruktur bleibt nahe am Griechischen, wird aber deutsch lesbar gestaltet. Die ungewöhnliche Formulierung „Vergeltung des Sieges“ und der Wechsel von „das Heil“ zu „er selbst“ bleiben bewusst erhalten, damit echte sprachliche und theologische Spannungen nicht eingeebnet werden.
