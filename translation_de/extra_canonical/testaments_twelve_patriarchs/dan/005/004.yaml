review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung trifft Abfall vom Herrn, die feindselige Provokation Levis, die militärische Aufstellung gegen Juda, das Nichtbestehen gegen beide sowie die Führung durch einen Engel des Herrn im Wesentlichen. In der letzten Begründung wird ἐν αὐτοῖς jedoch als instrumentales „durch sie“ festgelegt. Die naheliegende Grundbedeutung ist lokal bzw. bezogen: „in ihnen“; eine instrumentale Deutung sollte nicht ohne Not in den Text eingehen.'
  naturalness: Der Entwurf ist insgesamt modernes, würdiges Deutsch. „sich gegen Juda zum Kampf aufstellen“ ist verständlich, aber „sich gegen Juda in Schlachtordnung aufstellen“ gibt die militärische Bildlichkeit von παρατάσσεσθαι idiomatischer wieder.
  terminology: „Herr“, „Levi“, „Juda“ und „Engel des Herrn“ sind angemessen. „Bestand haben“ ist für στήσεται möglich; mit „in ihnen“ statt „durch sie“ bleibt der griechische Bezug offen und näher am Wortlaut.
  issues:
  - severity: medium
    issue: ἐν αὐτοῖς wird mit „durch sie“ wiedergegeben.
    rationale: „Durch“ legt eine instrumentale Vermittlung fest. Das griechische ἐν bezeichnet zunächst „in/bei/unter ihnen“ und lässt die genaue Beziehung Israels zu Levi und Juda offen. Eine Wiedergabe mit „in ihnen“ wahrt diese Ambiguität.
  - severity: low
    issue: Die militärische Nuance von παρατάξεσθε kann präziser ausgedrückt werden.
    rationale: „In Schlachtordnung“ vermittelt die im Verb enthaltene Vorstellung des Aufstellens zum Kampf, ohne den Text zu überdeuten.
