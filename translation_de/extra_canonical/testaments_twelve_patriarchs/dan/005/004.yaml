revisions:
- from: Ich weiß, dass ihr in den letzten Tagen vom Herrn abfallen, Levi zum Zorn reizen und euch gegen Juda zum Kampf aufstellen werdet. Doch ihr werdet sie nicht überwältigen können. Denn ein Engel des Herrn führt beide, weil Israel durch sie Bestand haben wird.
  to: Ich weiß, dass ihr in den letzten Tagen vom Herrn abfallen, Levi zum Zorn reizen und euch gegen Juda in Schlachtordnung aufstellen werdet; doch ihr werdet sie nicht überwältigen können. Denn ein Engel des Herrn leitet beide, weil Israel in ihnen Bestand haben wird.
  rationale: Die Revision ersetzt allein die interpretierende instrumentale Wiedergabe „durch sie“ durch das quellennähere und bewusst mehrdeutige „in ihnen“ und schärft die militärische Nuance von παρατάσσεσθαι. Die pronominalen Bezüge bleiben wie im Griechischen auf Levi und Juda beziehungsweise die durch diese Namen vertretenen Gruppen bezogen, ohne dies weiter auszuformulieren.
