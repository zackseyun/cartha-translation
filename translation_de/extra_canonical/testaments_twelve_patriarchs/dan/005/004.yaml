source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Ἐγὼ οἶδα²⁷ ὅτι ἐν ταῖς²⁸ ἐσχάταις ἡμέραις ἀποστήσεσθε²⁹ τοῦ Κυρίου, καὶ προσοχθιεῖτε³⁰ τῷ³¹ Λευί, καὶ πρὸς τῷ³² Ἰουδὰ³³ παρατάξεσθε³⁴, ἀλλ᾽ οὐ δυνήσεσθε³⁵ πρὸς αὐτούς³⁶. *ἄγγελος γὰρ Κυρίου ὁδηγεῖ ἑκατέρους³⁷, ὅτι ἐν αὐτοῖς³⁸ στήσεται ὁ³⁹ Ἰσραήλ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/004.yaml
  text: I know that in the last days you will depart from the Lord, and you will provoke Levi to anger, and you will array yourselves against Judah, but you will not prevail against them. For an angel of the Lord guides them both, because by them Israel will stand.
translation:
  language: de
  text: Ich weiß, dass ihr in den letzten Tagen vom Herrn abfallen, Levi zum Zorn reizen und euch gegen Juda in Schlachtordnung aufstellen werdet; doch ihr werdet sie nicht überwältigen können. Denn ein Engel des Herrn leitet beide, weil Israel in ihnen Bestand haben wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστήσεσθε τοῦ Κυρίου
  choice: ihr werdet vom Herrn abfallen
  rationale: ἀφίστημι mit ἀπό bezeichnet hier die Abkehr bzw. den Abfall vom Herrn; „abfallen“ bewahrt den ernsten religiösen Sinn.
- source_word: προσοχθιεῖτε τῷ Λευί
  choice: ihr werdet Levi zum Zorn reizen
  rationale: Das seltene Verb bezeichnet feindseliges Reizen oder Erbittern; die kausative deutsche Wendung gibt den Zusammenhang natürlich wieder.
- source_word: πρὸς τῷ Ἰουδὰ παρατάξεσθε
  choice: ihr werdet euch gegen Juda zum Kampf aufstellen
  rationale: παρατάσσομαι ist militärisch geprägt und bedeutet, sich in Schlachtordnung gegen jemanden aufzustellen; die Formulierung wahrt diese Bildlichkeit.
- source_word: οὐ δυνήσεσθε πρὸς αὐτούς
  choice: ihr werdet sie nicht überwältigen können
  rationale: Die elliptische Verbindung δύνασθαι πρός τινα meint, jemandem nicht gewachsen zu sein bzw. sich gegen ihn nicht durchsetzen zu können.
- source_word: ἄγγελος Κυρίου
  choice: ein Engel des Herrn
  rationale: Der artikellose griechische Ausdruck wird unbestimmt wiedergegeben, ohne eine Identifikation mit einer besonderen Gestalt vorauszusetzen.
- source_word: ὁδηγεῖ ἑκατέρους
  choice: führt beide
  rationale: ἑκάτερος verweist auf Levi und Juda zusammen; „beide“ ist im Deutschen eindeutig und natürlich.
- source_word: ἐν αὐτοῖς στήσεται ὁ Ἰσραήλ
  choice: Israel wird durch sie Bestand haben
  rationale: ἐν kann hier instrumentale bzw. vermittelnde Bedeutung haben; στήσεται bezeichnet das Stehen, Fortbestehen oder Gefestigtwerden Israels. „Bestand haben“ bewahrt diese Bedeutungsbreite besser als ein rein räumliches „stehen“.
theological_decisions:
- issue: Bezug von αὐτούς und ἑκατέρους
  choice: Beide Ausdrücke beziehen sich auf Levi und Juda.
  alternative: Bezug auf deren Stämme, Führer oder Anhänger.
  rationale: Die nächstliegenden ausdrücklichen Bezugswörter sind Levi und Juda; die Übersetzung lässt offen, ob damit zugleich ihre Stämme gemeint sind.
- issue: Identität des Engels des Herrn
  choice: Unbestimmt als „ein Engel des Herrn“ wiedergegeben.
  alternative: „der Engel des Herrn“ als bestimmte oder theologisch identifizierte Gestalt.
  rationale: Im Griechischen fehlt hier der Artikel; eine weitergehende dogmatische Identifikation wäre nicht durch den Wortlaut erzwungen.
- issue: Sinn von ἐν αὐτοῖς στήσεται ὁ Ἰσραήλ
  choice: „Israel wird durch sie Bestand haben“
  alternative: „In ihnen wird Israel aufgerichtet werden“ oder „bei ihnen wird Israel stehen“.
  rationale: Die Aussage verbindet Israels Bestand mit Levi und Juda. Die gewählte Fassung wahrt den vermittelnden Sinn von ἐν und den Fortbestandsaspekt von ἵστημι, ohne die genaue heilsgeschichtliche Beziehung auszudeuten.
translation_notes:
  register: Moderne, würdige Standardsprache. Der militärische Gehalt von παρατάσσομαι bleibt ausdrücklich erkennbar; zugleich werden schwerfällige oder altertümliche Wendungen vermieden.
