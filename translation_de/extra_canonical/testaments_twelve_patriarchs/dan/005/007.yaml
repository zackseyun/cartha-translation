source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ *οἱ ἐμοὶ υἱοὶ⁶¹ συνεγγίζοντές⁶² εἰσι τοῦ⁶³ Λευὶ καὶ συναμαρτάνοντες⁶⁴ αὐτοῖς⁶⁵ ἐν πᾶσιν. *οἱ δὲ υἱοὶ τοῦ⁶⁶ Ἰούδα ἔσονται ἐν πλεονεξίᾳ ἁρπάζοντες⁶⁷ ἀλλότρια ὡς⁶⁸ λέοντες.]
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/005/007.yaml
  text: And my sons are drawing near to Levi and sinning together with them in all things. But the sons of Judah will be in greed, snatching what belongs to others like lions.
translation:
  language: de
  text: Und meine Söhne nähern sich Levi und sündigen in allem gemeinsam mit ihnen. Die Söhne Judas aber werden aus Habgier fremdes Gut an sich reißen wie Löwen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνεγγίζοντες
  choice: nähern sich
  rationale: Gibt das präsentische Partizip natürlich und unmittelbar wieder; die Annäherung an Levi bleibt bewusst allgemein.
- source_word: συναμαρτάνοντες αὐτοῖς
  choice: sündigen gemeinsam mit ihnen
  rationale: Bewahrt sowohl den Mitvollzug im Präfix συν- als auch den pluralischen Rückbezug von αὐτοῖς, dessen Bezugsgröße im überlieferten Wortlaut nicht völlig glatt ist.
- source_word: ἐν πᾶσιν
  choice: in allem
  rationale: Formale und idiomatische Entsprechung, ohne den Umfang der Aussage einzuschränken.
- source_word: ἐν πλεονεξίᾳ
  choice: aus Habgier
  rationale: Drückt den motivierenden bzw. beherrschenden Charakter der πλεονεξία im Deutschen natürlicher aus als das unidiomatische »in Habgier«.
- source_word: ἁρπάζοντες ἀλλότρια
  choice: fremdes Gut an sich reißen
  rationale: ἀλλότρια bezeichnet Dinge, die anderen gehören; »fremdes Gut« ist prägnant, und »an sich reißen« erhält die gewaltsame Färbung von ἁρπάζω.
- source_word: ὡς λέοντες
  choice: wie Löwen
  rationale: Bewahrt den direkten Raubtiervergleich.
theological_decisions:
- issue: Zeitbezug der ersten Satzhälfte
  choice: 'Präsens: »nähern sich … und sündigen«'
  alternative: 'Futur: »werden sich nähern … und mitsündigen«'
  rationale: Der griechische Text verwendet präsentische Partizipien mit εἰσι; daher wird die gegenwärtige bzw. im Gang befindliche Handlung beibehalten.
- issue: Numerus beim Rückbezug αὐτοῖς nach Λευί
  choice: 'Pluralisch: »mit ihnen«'
  alternative: 'Sinngemäß singularisch: »mit ihm« bzw. kollektiv verdeutlichend: »mit den Leviten«'
  rationale: Der überlieferte griechische Text hat ausdrücklich den Plural αὐτοῖς. Die Übersetzung wahrt diese Spannung, statt den möglichen kollektiven Bezug auf Levi stillschweigend zu glätten.
- issue: Aussage über die Söhne Judas
  choice: Futurische Beschreibung einer von Habgier bestimmten Handlung
  alternative: 'Prädikativ: »werden habgierig sein«'
  rationale: ἔσονται trägt den Zukunftsbezug; ἐν πλεονεξίᾳ wird als Beweggrund der durch das Partizip bezeichneten Handlung wiedergegeben, ohne eine zusätzliche lehrmäßige Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt quellennah, vermeidet jedoch unnatürliche Gräzismen. Der Numeruswechsel zwischen »Levi« und »ihnen« wird als echte Textspannung bewahrt.
