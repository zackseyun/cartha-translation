  to: '7 Nachdem er dies gesagt hatte, küsste er sie innig und entschlief in gutem Schlaf.


    2 Seine Söhne begruben ihn. Danach brachten sie seine Gebeine hinauf an den Ort, wo Abraham, Isaak und Jakob waren.


    3 Dennoch hatte Dan ihnen vorausgesagt, dass sie ihren Gott vergessen und dem Land ihres Erbes, dem Geschlecht Israels und der Familie ihrer Nachkommen entfremdet würden.[a]'
  rationale: Eine sichere grammatische Korrektur in Vers 1 ersetzt den unpassenden Akkusativ „in einen guten Schlaf“ durch den Dativ „in gutem Schlaf“. Die auffällige Schlafmetapher, die Passivform in Vers 3, die Eigennamen sowie die Transparenzfußnote bleiben unverändert erhalten.
