base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/007.yaml
  text: 'And when he had said these things, he kissed them affectionately and fell asleep in a good sleep.

    2 And his sons buried him. And after this they carried up his bones to the place where Abraham and Isaac and Jacob were.

    3 Nevertheless, Dan prophesied to them that they would forget their God and would be estranged from the land of their inheritance and from the race of Israel and from the family of their offspring.'
translation:
  language: de
  text: '7 Nachdem er dies gesagt hatte, küsste er sie innig und entschlief in gutem Schlaf.


    2 Seine Söhne begruben ihn. Danach brachten sie seine Gebeine hinauf an den Ort, wo Abraham, Isaak und Jakob waren.


    3 Dennoch hatte Dan ihnen vorausgesagt, dass sie ihren Gott vergessen und dem Land ihres Erbes, dem Geschlecht Israels und der Familie ihrer Nachkommen entfremdet würden.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der hier vorgelegte griechische Quellenausschnitt bricht in Vers 3 nach dem Anfang der Weissagung ab; der weitere Wortlaut dieses Verses folgt der überlieferten vollständigen Fassung, wie sie in der englischen Konsultationsschicht wiedergegeben ist.
    reason: Die deutsche Übersetzung soll den über den bereitgestellten griechischen Ausschnitt hinausgehenden Wortlaut nicht als unmittelbar aus diesem Ausschnitt verifiziert erscheinen lassen.
lexical_decisions:
- source_word: καταφιλήσας αὐτούς
  choice: küsste er sie innig
  rationale: Das Kompositum καταφιλέω bezeichnet ein herzliches oder inniges Küssen; die Wiedergabe bewahrt die gegenüber einfachem „küssen“ verstärkte Aussage.
- source_word: ὕπνωσεν ὕπνῳ καλῷ
  choice: entschlief in einen guten Schlaf
  rationale: Die ungewöhnliche griechische Wendung wird bewusst nicht geglättet. „Entschlief“ gibt im Zusammenhang den Tod würdevoll wieder, während „in einen guten Schlaf“ das Bild des Ausgangstextes erhält.
- source_word: ἀπήνεγκαν
  choice: brachten sie … hinauf
  rationale: „Hinaufbringen“ bewahrt die im Verbzusammenhang bzw. in der Überlieferung erkennbare Richtungsangabe und passt zur Überführung der Gebeine nach Kanaan.
- source_word: τὰ ὀστᾶ αὐτοῦ
  choice: seine Gebeine
  rationale: „Gebeine“ ist im Bestattungszusammenhang natürlich und würdevoll und entspricht dem Plural „Knochen“.
- source_word: προεφήτευσεν αὐτοῖς
  choice: hatte ihnen vorausgesagt
  rationale: Das Plusquamperfekt verdeutlicht im deutschen Zusammenhang, dass die Weissagung vor Dans Tod erfolgt war; „vorausgesagt“ gibt προφητεύω hier verständlich wieder.
- source_word: ἀλλοτριωθήσεσθε / zugrunde liegende Fortsetzung
  choice: entfremdet würden
  rationale: Die passive Aussage der nur im Englischen vollständig bezeugten Fortsetzung wird beibehalten, ohne die Ursache oder den Handelnden festzulegen.
theological_decisions:
- issue: Tod als Schlaf
  choice: „entschlief in einen guten Schlaf“
  alternative: „fiel in einen guten Schlaf“
  rationale: Der Kontext berichtet unmittelbar von der Bestattung. „Entschlief“ lässt das Todesbild erkennen, ohne darüber hinaus eine Lehre über den Zustand der Toten festzulegen.
- issue: Art der angekündigten Entfremdung
  choice: Passivform „entfremdet würden“
  alternative: „sich entfremden würden“
  rationale: Die Passivform wahrt die Spannung darüber, ob die Entfremdung als Folge eigenen Handelns, fremder Einwirkung oder göttlichen Gerichts gedacht ist.
- issue: Textstatus von Vers 3
  choice: Vers im Haupttext mit textkritischer Fußnote
  alternative: Auslassung wegen des abgebrochenen griechischen Ausschnitts
  rationale: Der übermittelte englische Konsultationstext bietet den vollständigen Satz, doch der bereitgestellte griechische Wortlaut bricht nach dem Beginn ab. Deshalb wird die Unsicherheit transparent gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht feierlichen Wörter „entschlief“ und „Gebeine“ passen zum Sterbe- und Bestattungskontext; ansonsten bleibt die Syntax klar und allgemein verständlich. Die Kapitelziffer wurde zur eindeutigen Kennzeichnung des angeforderten Abschnitts aufgenommen.
