  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004.yaml
  text: '1[a]. For anger is blindness. It does not allow one to see the face of any man with truth.


    2. For first it is stirred up by a word; then by deeds it strengthens the one who is becoming angry; and by bitter losses it provokes him. It throws his purpose into confusion, and so it rouses his soul in great fury.


    3[b]. Therefore, when anyone speaks against you, do not be moved to anger; and if anyone praises you as holy, do not be exalted. Be changed neither to delight nor to disgust.


    4. For first it pleases the hearing, and so it sharpens the mind to perceive the provocation; and when he has become wrathful, he thinks that he is justly angry.


    5. But if you fall into any loss or ruin, children, do not be distressed. For this very spirit makes one desire to be angry over what is perishing, so that he may fall into anger through affliction.


    6. And if you suffer loss willingly or unwillingly, do not be grieved; for from grief anger also arises with falsehood.


    7. And anger with falsehood is a two-faced evil, and they join with one another in order to trouble the heart; and when the soul is continually troubled, the Lord departs from it[c][d], and Beliar rules over it.'
translation:
  language: de
  text: '**Testament Dans 4**


    **1.** Erkennt also die Macht des Zorns und begreift, dass sie vergeblich ist.


    **2.** Denn zunächst wird er durch ein Wort gereizt; dann stärkt er durch Taten den, der zornig wird. Durch bittere Verluste bringt er dessen Überlegungen durcheinander, und so versetzt er seine Seele in heftigen Zorn.


    **3.** Wenn also jemand gegen euch redet, lasst euch nicht zum Zorn hinreißen. Und wenn euch jemand als heilig lobt, überhebt euch nicht. Schlagt weder in Freude noch in Widerwillen um.


    **4.** Denn zunächst erfreut es das Gehör, und so schärft es den Verstand, das Hervorgerufene wahrzunehmen.[a] Ist jemand erst zornig geworden, meint er, mit Recht zornig zu sein.


    **5.** Wenn ihr aber irgendeinen Verlust oder Untergang erleidet, Kinder, geratet nicht in Bestürzung. Denn eben dieser Geist weckt das Verlangen nach dem, was verloren geht, damit man durch das Leiden dem Zorn verfällt.[b]


    **6.** Und wenn ihr freiwillig oder unfreiwillig Verlust erleidet, betrübt euch nicht; denn aus der Betrübnis entsteht auch Zorn, begleitet von Lüge.[c]


    **7.** Der Zorn zusammen mit der Lüge ist ein doppelgesichtiges Übel. Beide unterstützen einander, um das Herz zu verwirren. Wird aber die Seele fortwährend verwirrt, weicht der Herr von ihr, und Beliar herrscht über sie.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Wortlaut ist hier schwierig. Statt „das Hervorgerufene“ sind auch „die Reizung“ oder „das, was gereizt worden ist“ möglich.
    reason: alternative_reading
  - marker: b
    text: Das mit „Leiden“ wiedergegebene Wort kann auch „Bedrängnis“, „Leidenschaft“ oder „Erregung“ bedeuten. Der Satz beschreibt jedenfalls, wie das Verlangen nach dem Verlorengehenden in Zorn münden kann.
    reason: alternative_reading
  - marker: c
    text: „Begleitet von Lüge“ kann bedeuten, dass der Zorn zusammen mit Täuschung entsteht oder anschließend durch Lügen verstärkt wird.
    reason: alternative_reading
  - marker: d
    text: Beliar ist in der antiken jüdischen Literatur eine traditionelle Bezeichnung für die böse Macht oder den Widersacher; der Name wird auch als „Belial“ wiedergegeben.
    reason: cultural_note
lexical_decisions:
- source_word: ματαία
  choice: nichtig
  rationale: Gibt die Aussage des überlieferten griechischen Textes wieder und bewahrt die Spannung zwischen der „Macht“ des Zorns und ihrer letztlichen Nichtigkeit.
- source_word: παροξύνεται
  choice: wird gereizt
  rationale: 'Bewahrt die passive beziehungsweise einsetzende Bedeutung: Ein Wort setzt den Zorn in Bewegung.'
- source_word: δυναμοῖ
  choice: stärkt
  rationale: Gibt das Bild wieder, dass der Zorn den bereits zornig werdenden Menschen kräftigt beziehungsweise in seinem Zorn bestärkt.
- source_word: ζημίαις πικραῖς
  choice: durch bittere Verluste
  rationale: Lässt offen, ob materielle Schäden oder schmerzliche Einbußen allgemeiner Art gemeint sind.
- source_word: διαβούλιον
  choice: Überlegungen
  rationale: Bezeichnet das abwägende Denken oder den gefassten Entschluss, den der Zorn in Verwirrung bringt.
- source_word: κινεῖσθε εἰς ὀργήν
  choice: lasst euch nicht zum Zorn hinreißen
  rationale: Bewahrt die Bewegungsmetapher und formuliert die Mahnung in natürlichem modernem Deutsch.
- source_word: ἐπαίρεσθε
  choice: überhebt euch nicht
  rationale: Drückt die Selbstüberhöhung infolge schmeichelnden Lobes prägnant aus.
- source_word: μεταβάλλεσθε
  choice: schlagt … um
  rationale: Gibt den Wechsel in entgegengesetzte Gemütslagen idiomatisch wieder.
- source_word: ἀηδίαν
  choice: Widerwillen
  rationale: Passt als Gegenpol zur Freude und ist weniger körperlich verengt als „Ekel“.
- source_word: ὀξύνει τὸν νοῦν
  choice: schärft den Verstand
  rationale: Bewahrt die Metapher des griechischen Ausdrucks.
- source_word: τὸ ἐρεθισθέν
  choice: das Hervorgerufene
  rationale: Bleibt nahe an der schwierigen passiven Form und legt nicht eindeutig fest, ob eine Provokation, Reizung oder innere Erregung gemeint ist.
- source_word: ἐκθροεῖσθε
  choice: geratet nicht in Bestürzung
  rationale: Erfasst starke innere Beunruhigung, ohne sie ausschließlich als Angst zu deuten.
- source_word: πάθος
  choice: Erregung
  rationale: Passt zum psychologischen Ablauf, während die Fußnote die ebenfalls mögliche Bedeutung „Leiden“ offenhält.
- source_word: διπρόσωπον κακόν
  choice: doppelgesichtiges Übel
  rationale: Erhält das auffällige Bild des griechischen Textes und die enge Verbindung von Zorn und Lüge.
theological_decisions:
- issue: Personifizierte Wirksamkeit des Geistes und Herrschaft Beliars
  choice: Die Rede von „diesem Geist“ und davon, dass Beliar über die Seele herrscht, bleibt als geistlich-moralische Wirklichkeit erhalten.
  alternative: „Geist“ als bloßen Impuls wiedergeben und Beliar ausschließlich als Metapher für das Böse verstehen.
  rationale: Der Text verbindet psychologische Beobachtung mit der Sprache geistlicher Mächte; keine dieser Ebenen soll auf die andere reduziert werden.
- issue: κύριος im jüdischen Mahntext
  choice: der Herr
  alternative: der HERR; der Gebieter
  rationale: „Der Herr“ bewahrt den religiösen Gehalt und entspricht natürlichem deutschem Bibelregister, ohne den griechischen Text auf eine bestimmte hebräische Vorlage festzulegen.
- issue: Das Weichen des Herrn von der fortwährend verwirrten Seele
  choice: weicht der Herr von ihr
  alternative: verlässt der Herr sie
  rationale: „Weicht … von ihr“ folgt ἀφίσταται eng und bewahrt die harte theologische Aussage, ohne ihre Ursache oder Dauer näher zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Mahnrede. Auffällige Bilder wie „doppelgesichtiges Übel“ und die geistliche Konfliktsprache bleiben erhalten. Der gelieferte griechische Source-fix wurde gegenüber der abweichenden englischen Konsultationsfassung in 4,1 bevorzugt.
