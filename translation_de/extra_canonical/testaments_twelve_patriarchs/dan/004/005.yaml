base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/005.yaml
  text: But if you fall into any loss or destruction, children, do not be thrown into confusion. For that very spirit causes one to desire to be angry over what is perishing, so that he may fall into anger through passion.
translation:
  language: de
  text: Wenn ihr aber irgendeinen Verlust oder Untergang erleidet, Kinder, lasst euch nicht in Unruhe versetzen. Denn eben dieser Geist weckt das Verlangen nach dem, was verloren geht,[a] damit man durch die Leidenschaft dem Zorn verfällt.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „nach dem, was verloren ist“. Der griechische Ausdruck kann einen gegenwärtigen Vorgang oder dessen Ergebnis bezeichnen.'
    reason: Bewahrt die aspektuelle Mehrdeutigkeit des Partizips τοῦ ἀπολλυμένου.
  - marker: b
    text: '„Leidenschaft“ kann hier auch „Leiden“, „Erregung“ oder „Affekt“ bedeuten; wörtlich etwa: „damit man durch den Affekt in Zorn fällt“.'
    reason: Dokumentiert die Bedeutungsbreite von πάθος und die knappe Dativkonstruktion θυμῷ πέσῃ.
lexical_decisions:
- source_word: ζημίᾳ ἢ ἀπωλείᾳ
  choice: Verlust oder Untergang
  rationale: 'Die beiden Begriffe werden unterschieden: ζημία bezeichnet Verlust oder Schaden, ἀπώλεια einen weitergehenden Untergang beziehungsweise Verderben.'
- source_word: περιπέσητε
  choice: erleidet
  rationale: Das griechische Verb bedeutet wörtlich, in etwas hineinzufallen beziehungsweise einer Lage zu begegnen; im Deutschen ist bei Verlust und Untergang „erleiden“ natürlich und sachgerecht.
- source_word: μὴ ἐκθροεῖσθε
  choice: lasst euch nicht in Unruhe versetzen
  rationale: Die Form bezeichnet ein Erschreckt-, Aufgewühlt- oder Verwirrtwerden. Die gewählte Wendung bewahrt den passiven Gedanken und vermeidet eine Verengung auf bloße Angst.
- source_word: ποιεῖ ἐπιθυμῆσαι τοῦ ἀπολλυμένου
  choice: weckt das Verlangen nach dem, was verloren geht
  rationale: ἐπιθυμεῖν mit Genitiv bezeichnet das Begehren oder Verlangen nach etwas. Der griechische Text nennt hier nicht ausdrücklich ein Verlangen, „zornig zu sein“; diese Deutung wird daher nicht in den Haupttext eingefügt.
- source_word: θυμῷ πέσῃ
  choice: dem Zorn verfällt
  rationale: Die Dativkonstruktion lässt sich idiomatisch als Verfallen an den Zorn wiedergeben und bewahrt die Bewegung des Verbs πίπτειν.
- source_word: διὰ τοῦ πάθους
  choice: durch die Leidenschaft
  rationale: πάθος kann Leiden, Erregung, Affekt oder Leidenschaft bezeichnen. Im Zusammenhang mit dem Geist des Zorns trifft „Leidenschaft“ den zerstörerischen Affekt, ohne die mögliche Leidensnuance völlig auszuschließen.
theological_decisions:
- issue: Unausgesprochenes Subjekt bei ποιεῖ ἐπιθυμῆσαι und πέσῃ
  choice: unpersönliche Wiedergabe mit „man“ im Zielsatz
  alternative: „damit er … verfällt“ oder eine ausdrückliche Ergänzung wie „damit der Mensch … verfällt“
  rationale: Im Griechischen ist die betroffene Person nicht ausdrücklich genannt. „Man“ erhält diese Offenheit und vermeidet, eine bestimmte anthropologische oder dämonologische Zuordnung einzutragen.
- issue: Beziehung zwischen Verlangen, Verlust und Zorn
  choice: Das Verlangen gilt grammatisch dem Verlorengehenden; der Zorn erscheint als beabsichtigte Folge.
  alternative: „bewirkt, dass man über das Verlorengehende zornig sein will“
  rationale: Die alternative Deutung folgt der englischen Konsultationsfassung, ist aber grammatisch stärker interpretierend. Der Haupttext hält sich an die naheliegende Rektion von ἐπιθυμεῖν mit Genitiv und bewahrt so die gedankliche Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Anrede „Kinder“ folgt dem griechischen τέκνα ohne das nicht belegte Possessivpronomen „meine“. Der Satz bleibt bewusst knapp und bewahrt die psychologische und theologische Spannung des Ausgangstextes.
