  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/003.yaml
  text: Therefore, when anyone speaks against you, do not be moved to anger; and if anyone praises you as holy, do not be exalted. Be changed neither to delight nor to disgust.
translation:
  language: de
  text: Wenn also jemand gegen euch redet, lasst euch nicht zum Zorn hinreißen; und wenn jemand euch als heilig lobt, überhebt euch nicht. Verändert euch weder zur Freude noch zum Widerwillen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λαλεῖ ... καθ᾽ ὑμῶν
  choice: gegen euch redet
  rationale: Gibt die feindliche oder abwertende Ausrichtung von κατά mit Genitiv klar und natürlich wieder, ohne den Inhalt der Rede näher festzulegen.
- source_word: κινεῖσθε εἰς ὀργήν
  choice: lasst euch nicht zum Zorn hinreißen
  rationale: Bewahrt das Bewegungsbild und drückt im Deutschen idiomatisch den Übergang zum Zorn aus.
- source_word: ἐπαινέσῃ ... ὡς ἁγίους
  choice: euch als heilig lobt
  rationale: Entspricht der prädikativen Bedeutung von ὡς ἁγίους, ohne daraus eine verbindliche Feststellung ihrer Heiligkeit zu machen.
- source_word: μὴ ἐπαίρεσθε
  choice: überhebt euch nicht
  rationale: Erfasst die übertragene Bedeutung des Sich-Erhebens im Sinn von Hochmut oder Selbstüberhöhung, ohne eine körperliche Erhöhung nahezulegen.
- source_word: μεταβάλλεσθε
  choice: lasst euch ... umstimmen
  rationale: Gibt die geforderte innere Unveränderlichkeit gegenüber Lob und Tadel in natürlichem Deutsch wieder.
- source_word: τέρψιν ... ἀηδίαν
  choice: Freude ... Widerwillen
  rationale: Bewahrt den Gegensatz zwischen angenehmer innerer Regung und Abneigung; „Widerwillen“ ist hier idiomatischer und semantisch angemessener als das moderne, stärker körperlich gefärbte „Ekel“.
theological_decisions:
- issue: Bedeutung von ἅγιος in der schmeichelnden Anrede
  choice: heilig
  alternative: Heilige
  rationale: Das Adjektiv bleibt prädikativ auf die Angesprochenen bezogen. Die Formulierung wahrt zugleich, dass dies die Einschätzung des Lobenden ist und keine Aussage des Erzählers.
- issue: Innere Beständigkeit gegenüber gegensätzlichen Reaktionen
  choice: weder zu Freude noch zu Widerwillen umstimmen
  alternative: weder in Entzücken noch in Abscheu verwandeln
  rationale: Die Übersetzung bewahrt die ethische Spannung des Textes, ohne stoische Leidenschaftslosigkeit oder eine bestimmte Lehre von Gefühlen hineinzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter pluralischer Anrede. Die Imperative sind klar und idiomatisch; die Parallelität der griechischen Mahnungen bleibt erhalten. Das im überlieferten griechischen Text dieser Fassung nicht belegte „meine Kinder“ wurde nicht ergänzt.
