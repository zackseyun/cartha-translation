  source_fidelity: Der Entwurf gibt ζημιωθῆτε, ἑκουσίως ἢ ἀκουσίως, μὴ λυπεῖσθε und die begründende Folge aus λύπη zutreffend wieder. Die durch die Klammern markierte, textkritisch unsichere Lesart μετὰ ψεύδους wird angemessen durch eine Fußnote angezeigt. Allerdings ist »Zorn mit Lüge« im Deutschen keine tragfähige Satzfügung und verdunkelt die griechische Aussage unnötig.
  naturalness: »Seid nicht betrübt« und »aus Betrübnis entsteht auch Zorn« sind verständlich und im würdigen modernen Register möglich. Die Stellung des Fußnotenankers unmittelbar vor »mit« sowie die Formulierung »Zorn mit Lüge« wirken jedoch typografisch und idiomatisch störend. »Zorn zusammen mit Lüge« ist natürliches Standarddeutsch und erhält die offene Zuordnung der Präpositionalphrase.
  terminology: Die Wortverbindung »betrübt/Betrübnis« bildet λυπεῖσθε/λύπη sinnvoll ab. »Zorn« ist für θυμός passend. »Lüge« ist als enge Wiedergabe von ψεῦδος vertretbar; die textkritische Unsicherheit muss am gesamten unsicheren Ausdruck verankert werden.
