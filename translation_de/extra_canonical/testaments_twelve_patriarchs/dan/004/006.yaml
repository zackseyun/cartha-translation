source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Καὶ⁴¹ ἐὰν ζημιωθῆτε ἑκουσίως *ἢ ἀκουσίως⁴² *μὴ λυπεῖσθε⁴³· ἀπὸ γὰρ λύπης⁴⁴ ἐγείρεται⁴⁵ καὶ⁴⁶ θυμός⁴⁷ ⌈μετὰ ψεύδους⁷⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/006.yaml
  text: And if you suffer loss willingly or unwillingly, do not be grieved; for from grief anger also arises with falsehood.
translation:
  language: de
  text: Und wenn ihr freiwillig oder unfreiwillig einen Verlust erleidet, seid nicht betrübt; denn aus Betrübnis entsteht auch Zorn zusammen mit Lüge[a].
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte »mit Lüge« stehen in der griechischen Textüberlieferung an dieser Stelle nicht einheitlich.
    reason: Die kritische Kennzeichnung durch ⌈ ⌉ im vorgelegten Quelltext weist auf textkritische Unsicherheit hin; diese soll für die Veröffentlichung sichtbar bleiben.
lexical_decisions:
- source_word: ζημιωθῆτε
  choice: einen Verlust erleidet
  rationale: Gibt das passive Verb natürlich wieder und lässt offen, ob materieller Schaden, Benachteiligung oder allgemeiner Verlust gemeint ist.
- source_word: ἑκουσίως ἢ ἀκουσίως
  choice: freiwillig oder unfreiwillig
  rationale: Bewahrt den ausdrücklichen Gegensatz der griechischen Adverbien, ohne die schwer bestimmbare Art der Beteiligung näher festzulegen.
- source_word: μὴ λυπεῖσθε
  choice: seid nicht betrübt
  rationale: Entspricht dem emotionalen Sinn von λυπέομαι und passt zur anschließenden Begründung mit λύπη.
- source_word: λύπης
  choice: Betrübnis
  rationale: Wahrt die lexikalische Verbindung zu »betrübt« und bezeichnet inneren Kummer beziehungsweise Schmerz.
- source_word: θυμός
  choice: Zorn
  rationale: Gibt die heftige Gemütsbewegung im Kontext klar und idiomatisch wieder.
- source_word: μετὰ ψεύδους
  choice: mit Lüge
  rationale: Übersetzt die Präpositionalfügung eng am Wortlaut und lässt das genaue Verhältnis zwischen Zorn und Lüge offen.
theological_decisions:
- issue: Verhältnis von Zorn und Lüge
  choice: »Zorn mit Lüge«
  alternative: »Zorn, verbunden mit Falschheit« / »Zorn und Lüge«
  rationale: Die Formulierung bewahrt die syntaktische und sachliche Spannung von μετὰ ψεύδους, statt daraus zwei unabhängig entstehende Folgen oder eine bestimmte dogmatische Beziehung zu machen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung »betrübt/Betrübnis« bildet die griechische Wortverbindung nach. Die etwas ungewohnte Wendung »Zorn mit Lüge« ist bewusst beibehalten, um die Mehrdeutigkeit des Ausgangstextes nicht aufzulösen.
