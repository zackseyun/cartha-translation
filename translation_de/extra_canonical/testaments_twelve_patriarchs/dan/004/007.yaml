review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die Satzstruktur und die wesentlichen Aussagen des Griechischen zuverlässig wieder: Zorn und Lüge wirken gemeinsam auf das Herz ein; bei fortdauernder Beunruhigung der Seele tritt der Herr zurück, und Beliar gewinnt Herrschaft über sie. „Beliar“ entspricht der griechischen Namensform. Die Bildsprache von διπρόσωπον sollte jedoch im Deutschen natürlicher und zugleich ohne Einengung wiedergegeben werden.'
  naturalness: „Doppelgesichtiges Übel“ ist verständlich, aber im modernen Standarddeutsch deutlich künstlicher als die übrige Übersetzung. „Ein Übel mit zwei Gesichtern“ bewahrt das Bild und liest sich idiomatischer. Die Wiederholung von „aufwühlen“ ist möglich, doch „in Unruhe versetzen / in Unruhe sein“ gibt die wiederholte Störung hier flüssiger wieder.
  terminology: „Zorn“, „Lüge“, „Herz“, „Seele“, „Herr“ und „Beliar“ sind angemessen. Die Formulierung „weicht der Herr von ihr“ bewahrt die vorsichtige Bewegungsbedeutung von ἀφίσταται und sollte beibehalten werden.
  issues:
