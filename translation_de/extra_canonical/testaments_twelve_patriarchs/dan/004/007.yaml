    issue: „doppelgesichtiges Übel“ ist stilistisch unnatürlich.
    rationale: Die wörtlich bildhafte Übertragung von διπρόσωπον ist zwar verständlich, wirkt im heutigen Deutsch jedoch ungebräuchlich. „Ein Übel mit zwei Gesichtern“ erhält die offene Bildlichkeit, ohne die Bedeutung etwa auf „doppelzüngig“ zu verengen.
  - severity: low
    issue: Die Wiedergabe der wiederholten Unruhe kann idiomatischer sein.
    rationale: „Das Herz in Unruhe zu versetzen“ und „die Seele fortwährend in Unruhe ist“ bilden die Wiederholung von ταράσσω erkennbar ab und sind im Deutschen natürlicher als die wiederholte Passivform „aufgewühlt“.
