source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '*Ἔστι δὲ διπρόσωπον κακὸν ὁ θυμὸς μετὰ ψεύδους⁴⁸, καὶ συναίρονται⁴⁹ ἀλλήλοις ἵνα ταράξωσι⁵⁰ *τὴν καρδίαν⁵¹· ταρασσομένης δὲ τῆς ψυχῆς συνεχῶς, ἀφίσταται ὁ⁵² Κύριος ἀπ᾽ αὐτῆς καὶ κυριεύει αὐτῆς ὁ Βελίαρ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/007.yaml
  text: And anger with falsehood is a two-faced evil, and they join with one another in order to trouble the heart; and when the soul is continually troubled, the Lord departs from it, and Beliar rules over it.
translation:
  language: de
  text: Der Zorn ist zusammen mit der Lüge ein Übel mit zwei Gesichtern. Sie tun sich zusammen, um das Herz in Unruhe zu versetzen. Und wenn die Seele fortwährend in Unruhe ist, weicht der Herr von ihr, und Beliar herrscht über sie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ θυμὸς
  choice: der Zorn
  rationale: Bezeichnet hier heftigen Zorn bzw. eine zornige Gemütsbewegung; „Zorn“ ist natürlich und bewahrt den moralischen Ernst.
- source_word: μετὰ ψεύδους
  choice: zusammen mit der Lüge
  rationale: Gibt die Verbindung von Zorn und Falschheit eng am Griechischen wieder; der bestimmte Ausdruck „die Lüge“ passt zur anschließenden Personifizierung beider Kräfte.
- source_word: διπρόσωπον κακόν
  choice: ein doppelgesichtiges Übel
  rationale: Bewahrt das anschauliche Bild des griechischen Ausdrucks und lässt offen, ob vor allem Doppelzüngigkeit oder die zweifache Gestalt des Übels gemeint ist.
- source_word: συναίρονται ἀλλήλοις
  choice: Beide verbünden sich miteinander
  rationale: Der Kontext beschreibt Zorn und Lüge als zusammenwirkende Mächte; „verbünden sich“ bringt dieses aktive Zusammenwirken idiomatisch zum Ausdruck.
- source_word: ταράξωσι τὴν καρδίαν / ταρασσομένης ... τῆς ψυχῆς
  choice: das Herz aufzuwühlen / die Seele ... aufgewühlt wird
  rationale: Die wiederholte griechische Wortwurzel wird durch „aufwühlen“ bewahrt; zugleich bleiben „Herz“ und „Seele“ entsprechend dem Ausgangstext unterschieden.
- source_word: ἀφίσταται
  choice: weicht ... von ihr
  rationale: Gibt ein Sich-Entfernen oder Zurücktreten wieder, ohne eine weitergehende dogmatische Erklärung einzutragen.
- source_word: κυριεύει
  choice: herrscht über
  rationale: Entspricht der Aussage von Herrschaft bzw. Gewalt über die Seele.
- source_word: ὁ Βελίαρ
  choice: Beliar
  rationale: Der Eigenname wird in seiner im deutschen bibelnahen Sprachgebrauch geläufigen Form transliteriert.
theological_decisions:
- issue: Das Weichen des Herrn von der fortwährend aufgewühlten Seele
  choice: „weicht der Herr von ihr“
  alternative: „verlässt der Herr sie“
  rationale: „Weicht ... von ihr“ bleibt näher an ἀφίσταται und vermeidet, Art, Dauer oder Endgültigkeit dieses Abstandnehmens dogmatisch festzulegen.
- issue: Personifizierung von Zorn und Lüge
  choice: „Beide verbünden sich miteinander“
  alternative: „sie wirken zusammen“
  rationale: Die personifizierende Darstellung des Textes wird erhalten, ohne die beiden ausdrücklich als dämonische Wesen zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Kurze Sätze erhöhen die Verständlichkeit; das markante Bild „doppelgesichtiges Übel“ sowie die Parallelität von Herz und Seele bleiben erhalten.
