  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/004.yaml
  text: For first it pleases the hearing, and so it sharpens the mind to perceive the provocation; and when he has become wrathful, he thinks that he is justly angry.
translation:
  language: de
  text: Denn zuerst erfreut es das Ohr, und so schärft es den Verstand, die Provokation[a] wahrzunehmen. Und ist er zornig geworden, meint er, mit Recht zornig zu sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Wortlaut ist an dieser Stelle unsicher. Wörtlich kann der Ausdruck auch „das Gereizte“ oder „das Aufgestachelte“ bedeuten.
    reason: Das in der Edition als problematisch markierte τὸ ἐρεθισθέν lässt mehrere Deutungen zu; die Fußnote bewahrt diese echte textliche und semantische Unsicherheit.
lexical_decisions:
- source_word: τέρπει τὴν ἀκοήν
  choice: erfreut es das Ohr
  rationale: Gibt das sinnliche Bild des griechischen Ausdrucks natürlich und würdevoll wieder; τέρπει bezeichnet Freude oder Wohlgefallen, ἀκοή hier das Hören beziehungsweise das Ohr.
- source_word: ὀξύνει τὸν νοῦν
  choice: schärft es den Verstand
  rationale: Bewahrt die Bildsprache von ὀξύνει und gibt νοῦς in diesem Zusammenhang als Wahrnehmungs- und Urteilsvermögen wieder.
- source_word: τὸ ἐρεθισθέν
  choice: die Provokation
  rationale: Folgt der kontextuell naheliegenden Bedeutung eines Reizes oder Anlasses, der den Zorn entfacht, ohne die textliche Unsicherheit zu verschweigen.
- source_word: θυμωθείς
  choice: wenn ein Mensch in Zorn geraten ist
  rationale: Löst den Subjektwechsel des knappen griechischen Partizips für modernes Deutsch verständlich auf, ohne eine bestimmte Person einzuführen.
- source_word: δικαίως ὀργίζεσθαι
  choice: mit Recht zornig zu sein
  rationale: Gibt die behauptete Rechtmäßigkeit des Zorns direkt wieder; der Satz beschreibt die Selbstrechtfertigung, bestätigt sie aber nicht.
theological_decisions:
- issue: Bewertung des Zorns
  choice: 'Die Aussage wird als subjektive Selbstrechtfertigung formuliert: „meint er“'
  alternative: Den Zorn ausdrücklich als tatsächlich gerecht bezeichnen
  rationale: νομίζει kennzeichnet dies als Urteil des erzürnten Menschen. Die Übersetzung darf seine Einschätzung nicht zur Aussage des Autors über rechtmäßigen Zorn machen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die Wiederholung von „Zorn/zornig“ bewahrt die gedankliche Zuspitzung des Originals; das zweimalige „es“ lässt den aus dem Kontext übernommenen Bezug bewusst offen.
