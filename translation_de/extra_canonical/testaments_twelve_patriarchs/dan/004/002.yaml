  to: Denn zuerst wird er durch ein Wort gereizt; dann stärkt es durch Taten den, der zornig wird, und durch bittere Verluste bringt es sein Vorhaben durcheinander. So erregt es seine Seele zu großem Zorn.
  rationale: Nur der Schluss wird idiomatisch und semantisch genauer gefasst. Das absichtlich nicht näher bestimmte „es“ bleibt erhalten, damit das im griechischen Satz nicht ausdrücklich genannte Subjekt weder ergänzt noch doktrinär gedeutet wird.
