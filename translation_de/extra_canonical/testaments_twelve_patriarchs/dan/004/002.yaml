source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: Ἐν γὰρ λόγῳ παροξύνεται⁵ πρῶτον εἶτα⁶ *ἐν ἔργοις⁷ †δυναμοῖ⁸ τὸν ὀργιζόμενον⁹, καὶ¹⁰ ἐν *ζημίαις πικραῖς διαταράσσει τὸ διαβούλιον αὐτοῦ¹¹, καὶ οὕτως διεγείρει ἐν θυμῷ μεγάλῳ τὴν ψυχὴν αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/002.yaml
  text: For first he is provoked by a word; then by deeds it strengthens the one who is becoming angry; and by bitter losses it throws his purpose into confusion, and so it stirs up his soul in great wrath.
translation:
  language: de
  text: Denn zuerst wird er durch ein Wort gereizt; dann stärkt es durch Taten den, der zornig wird, und durch bittere Verluste bringt es sein Vorhaben durcheinander. So erregt es seine Seele zu großem Zorn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παροξύνεται
  choice: wird … gereizt
  rationale: Gibt die passive Bedeutung des Verbs natürlich wieder, ohne die Art der Provokation näher festzulegen.
- source_word: δυναμοῖ τὸν ὀργιζόμενον
  choice: stärkt … den, der zornig wird
  rationale: Bewahrt die auffällige und möglicherweise textlich schwierige Aussage des griechischen Textes, statt sie interpretierend zu glätten.
- source_word: ζημίαις πικραῖς
  choice: durch bittere Verluste
  rationale: ζημία bezeichnet hier am ehesten schmerzliche Einbußen oder Verluste; „bitter“ wahrt die emotionale Färbung.
- source_word: διαταράσσει τὸ διαβούλιον αὐτοῦ
  choice: bringt … sein Vorhaben durcheinander
  rationale: διαβούλιον kann Plan, Absicht oder Überlegung bezeichnen; „Vorhaben“ ist im Zusammenhang natürlich und lässt den inneren Entschluss erkennen.
- source_word: ἐν θυμῷ μεγάλῳ
  choice: in großen Grimm
  rationale: „Grimm“ gibt die intensive, aufwallende Bedeutung von θυμός würdig und verständlich wieder.
theological_decisions:
- issue: Unausgesprochenes Subjekt der Verben nach dem ersten Satzglied
  choice: Wiedergabe mit „es“
  alternative: Ein ausdrücklich benanntes Subjekt wie „der Geist des Zorns“ oder „der Zorn“
  rationale: Der vorgelegte Vers nennt das handelnde Subjekt nicht ausdrücklich. Das neutrale Pronomen bewahrt den Zusammenhang und vermeidet, aus dem weiteren Kontext eine Bezeichnung in den Vers einzutragen.
- issue: Spannung zwischen passivem Gereiztwerden und anschließendem handelnden Subjekt
  choice: Die grammatische Spannung bleibt sichtbar
  alternative: Vollständige Glättung auf ein einheitliches Subjekt
  rationale: Der griechische Wortlaut wechselt auffällig von „er wird gereizt“ zu einem unausgesprochenen Agens; diese Spannung soll nicht stillschweigend aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Syntax wurde für deutsche Lesbarkeit leicht gegliedert, während die ungewöhnliche Aussage „stärkt den, der zornig wird“ bewusst erhalten bleibt.
