source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: IV. Οὐκοῦν σύνετε¹ τὴν δύναμιν τοῦ θυμοῦ² ὅτι³ *ματαία ἐστίν⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/004/001.yaml
  text: Therefore understand the power of anger, that it is futile.
translation:
  language: de
  text: '4,1 Begreift also die Macht des Zorns: Sie ist vergeblich.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σύνετε
  choice: Begreift
  rationale: Der Aorist-Imperativ fordert zu verständiger Einsicht auf; „Begreift“ ist im Deutschen natürlich und kräftig.
- source_word: τὴν δύναμιν τοῦ θυμοῦ
  choice: welche Macht der Zorn hat
  rationale: Die Genitivverbindung „die Macht des Zorns“ wird idiomatisch entfaltet, ohne den Gedanken einer wirksamen Kraft des Zorns abzuschwächen.
- source_word: ματαία
  choice: vergeblich
  rationale: Das Adjektiv bezeichnet etwas Nichtiges, Zweckloses oder Wirkungsloses. „Vergeblich“ bewahrt diese Spannweite besser als das stärker wertende „sinnlos“.
theological_decisions:
- issue: Bezug des mit ὅτι eingeleiteten Satzes
  choice: Der Satz bezieht „er“ auf den Zorn.
  alternative: „… dass sie vergeblich ist“, mit Bezug auf die Macht.
  rationale: Das feminine ματαία stimmt grammatisch mit δύναμις überein, doch der überlieferte Satz ist wegen des prädikativen Zusammenhangs semantisch mehrdeutig. Die gewählte natürliche deutsche Fassung folgt der naheliegenden Aussage über den Zorn, ohne eine besondere Lehrdeutung einzutragen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der kurze Mahnsatz bleibt knapp und eindringlich; der Doppelpunkt gibt die erklärende Funktion von ὅτι wieder.
