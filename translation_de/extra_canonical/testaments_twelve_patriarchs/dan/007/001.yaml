source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: VII. Καὶ ταῦτα εἰπὼν *καταφιλήσας αὐτοὺς¹ *ὕπνωσεν †ὕπνῳ καλῷ².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/007/001.yaml
  text: And having said these things, he kissed them affectionately and fell asleep a good sleep.
translation:
  language: de
  text: Nachdem er dies gesagt hatte, küsste er sie innig und entschlief in einem guten Schlaf.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „entschlief mit einem guten Schlaf“; wahrscheinlich ist damit zugleich sein Tod gemeint.'
    reason: Die Fußnote erklärt den ungewöhnlichen verwandten Dativ ὕπνῳ καλῷ und bewahrt zugleich die Mehrdeutigkeit zwischen Schlaf und Tod.
lexical_decisions:
- source_word: καταφιλήσας αὐτούς
  choice: küsste er sie innig
  rationale: Das verstärkte Verb καταφιλέω bezeichnet herzliches oder inniges Küssen; die deutsche Formulierung gibt sowohl die Handlung als auch ihre Intensität natürlich wieder.
- source_word: ὕπνωσεν
  choice: entschlief
  rationale: Das Verb bezeichnet das Einschlafen; im Zusammenhang eines testamentarischen Abschieds kann es zugleich den Tod andeuten. „Entschlief“ bewahrt diese mögliche Doppelbedeutung.
- source_word: ὕπνῳ καλῷ
  choice: in einem guten Schlaf
  rationale: Die ungewöhnliche Verbindung von Verb und verwandtem Dativ wird bewusst erkennbar gehalten. „Gut“ entspricht καλῷ, ohne die Aussage als „friedlich“ oder ausdrücklich als Tod auszudeuten.
theological_decisions:
- issue: Ob das Einschlafen ausdrücklich Dans Tod bezeichnet
  choice: Die mögliche Todesbedeutung wird durch „entschlief“ angedeutet, aber nicht ausdrücklich festgelegt.
  alternative: „schlief friedlich ein“ oder „starb einen guten Tod“
  rationale: Der griechische Wortlaut spricht vom Schlaf und lässt im Abschiedskontext eine euphemistische Todeslesart zu. Eine eindeutige Festlegung würde die vorhandene Spannung auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Nachdem … gesagt hatte“ gibt das vorzeitige Partizip idiomatisch wieder; „innig“ ist verständlich und nicht sentimental. Die leicht feierliche Form „entschlief“ passt zur testamentarischen Abschiedsszene.
