  source_fidelity: 'Die Übersetzung gibt die Abfolge des griechischen Aoristpartizips und Hauptverbs angemessen wieder: Nach dem Sagen küsst Dan die Anwesenden herzlich und „entschläft“. „Innig“ trifft die verstärkende Nuance von καταφιλήσας gut. „Entschlief“ bewahrt im Deutschen die vom Kontext nahegelegte, aber nicht im Verb selbst erzwungene Todesandeutung. „In einem guten Schlaf“ bildet ὕπνῳ καλῷ transparent ab, ohne καλός unzulässig zu „friedlich“ oder „selig“ zu präzisieren.'
  naturalness: Der Satz ist verständlich, würdig und für einen testamentarischen Abschied in modernem Standarddeutsch gut lesbar. Die Formulierung „in einem guten Schlaf“ ist leicht ungewohnt, aber dies ist hier eine vertretbare, bewusst quellennah gehaltene Wiedergabe der ungewöhnlichen griechischen Verbindung.
  terminology: Die Wortwahl ist registergerecht. Weder „innig“ noch „entschlief“ trägt eine konfessionell spezifizierende Deutung ein. Die Fußnote erläutert die idiomatisch auffällige Form und markiert die mögliche Todesbedeutung, ohne sie zur zwingenden Lesart zu machen.
