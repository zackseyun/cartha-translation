  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/007/002.yaml
  text: And his sons buried him. And after this they carried up his bones to the place where Abraham and Isaac and Jacob were.
translation:
  language: de
  text: Und seine Söhne begruben ihn. Danach brachten sie seine Gebeine hinauf an den Ort, wo Abraham, Isaak und Jakob waren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔθαψαν
  choice: begruben
  rationale: Gibt das griechische Verb direkt und in natürlichem, würdigem Deutsch wieder.
- source_word: ἀπήνεγκαν
  choice: brachten … hinauf
  rationale: Bewahrt die im Verb enthaltene Aufwärtsbewegung, die im Zusammenhang wahrscheinlich das Hinaufbringen in das verheißene Land bezeichnet.
- source_word: τὰ ὀστᾶ αὐτοῦ
  choice: seine Gebeine
  rationale: „Gebeine“ ist die im Bestattungskontext natürliche und würdevolle Entsprechung für die sterblichen Knochenreste.
- source_word: ἔνθα
  choice: an den Ort, wo
  rationale: Gibt die lokale Beziehung verständlich wieder, ohne den im erhaltenen griechischen Text nur knapp bezeichneten Ort näher zu bestimmen.
theological_decisions:
- issue: Bedeutung von „wo Abraham, Isaak und Jakob waren“
  choice: Die räumliche Formulierung bleibt unverändert offen.
  alternative: „wo Abraham, Isaak und Jakob begraben waren“
  rationale: Der griechische Text sagt lediglich ἔνθα ἦν und nennt kein Begraben-Sein; die ausdrückliche Ergänzung würde eine plausible Deutung in den Haupttext eintragen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Wiederholung von „Und“ wird am Satzanfang teilweise geglättet; Inhalt und zeitliche Abfolge bleiben gewahrt.
