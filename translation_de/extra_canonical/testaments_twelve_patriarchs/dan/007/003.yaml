id: T12P.DAN.7.3
reference: Testament of Dan 7:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 201-213, Dan source-fix v2)
  text: '[3. Πλὴν οὖν¹⁰ προεφήτευσεν αὐτοῖς¹¹ ⌈Δὰν⌉¹² ὅτι ἐπιλά...]'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/007/003.yaml
  text: Nevertheless Dan prophesied to them that they would forget [their God and would be estranged from the land of their inheritance and from the race of Israel and from the family of their offspring].
translation:
  language: de
  text: Dennoch prophezeite Dan ihnen, dass sie [ihren Gott vergessen und dem Land ihres Erbes, dem Volk Israel und der Verwandtschaft ihrer Nachkommen entfremdet werden] würden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die vorgelegte griechische Quellenangabe bricht nach ἐπιλά… ab. Der eingeklammerte Satzteil folgt der dazu überlieferten beziehungsweise erschlossenen Fortsetzung; der erhaltene Wortanfang stützt „vergessen“.
    reason: Kennzeichnet transparent, dass der größte Teil des Verses in dem bereitgestellten griechischen Ausschnitt nicht vollständig sichtbar ist.
lexical_decisions:
- source_word: Πλὴν οὖν
  choice: Dennoch
  rationale: Gibt den adversativen Übergang knapp und würdig wieder; je nach Zusammenhang wären auch „Doch“ oder „Allerdings“ möglich.
- source_word: προεφήτευσεν αὐτοῖς
  choice: prophezeite ihnen
  rationale: Entspricht direkt dem griechischen Verb und seinem Dativobjekt.
- source_word: ἐπιλά...
  choice: vergessen
  rationale: Der erhaltene Wortanfang weist auf ein Verb der Wortfamilie ἐπιλανθάνομαι („vergessen“) hin und stützt damit die überlieferte Fortsetzung, nicht die Deutung „nach diesem“.
- source_word: γῆς κληρονομίας αὐτῶν
  choice: dem Land ihres Erbes
  rationale: Bewahrt die biblisch geprägte Verbindung von Land und Erbe, ohne sie konfessionell auszudeuten.
- source_word: γένους Ἰσραήλ
  choice: dem Volk Israel
  rationale: „Volk“ gibt γένος in diesem genealogisch-ethnischen Zusammenhang natürlicher wieder als das im heutigen Deutsch missverständliche „Rasse“.
- source_word: συγγενείας σπέρματος αὐτῶν
  choice: der Verwandtschaft ihrer Nachkommen
  rationale: Bewahrt sowohl den Verwandtschaftsbezug als auch den Gedanken der leiblichen Nachkommenschaft.
theological_decisions:
- issue: Gegenstand des angekündigten Vergessens
  choice: „ihren Gott vergessen“
  alternative: „nach diesem trugen sie seine Gebeine hinauf“
  rationale: Der sichtbare griechische Wortanfang ἐπιλά... passt zu „vergessen“. Die alternative Lesart setzt eine nicht im vorgelegten Text erkennbare Segmentierung beziehungsweise einen anderen Text voraus und würde den theologischen Inhalt grundlegend verändern.
- issue: Entfremdung von Israel und dem Erbland
  choice: Als prophetische Folge des Vergessens Gottes beibehalten
  alternative: Die Aussage glätten oder als bloße Ortsveränderung verstehen
  rationale: Die Spannung zwischen Bundeszugehörigkeit, Land, Israel und Nachkommenschaft gehört zum überlieferten Aussagegehalt und wird nicht aufgelöst.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. „Volk Israel“ vermeidet die heute problematische und sachlich unnötige Wiedergabe „Rasse Israels“. Die eckigen Klammern markieren den nicht vollständig im vorgelegten griechischen Ausschnitt erhaltenen Textteil.
