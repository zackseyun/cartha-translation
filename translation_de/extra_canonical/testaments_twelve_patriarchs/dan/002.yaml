  terminology: „Geist“, „Lüge“, „Zorn“, „Wahrheit“, „Langmut“, „Herr“, „Satan“ und „Beliar“ werden konsistent beibehalten. Die Fußnotenanker stehen bei den jeweils erläuterten Ausdrücken.
