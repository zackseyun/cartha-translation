base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/dan/002.yaml
  text: 'And now[a], my children, behold, I am dying, and I tell you in truth: unless you guard yourselves from the spirit of falsehood and of anger, and love truth and long-suffering, you will perish. For anger is blindness, and it does not allow one to see the face of any man with truth. Even if it is a father or a mother, he behaves toward them as toward enemies; even if it is a brother, he does not recognize him; even if it is a prophet of the Lord, he disobeys him; even if it is a righteous man, he does not regard him; even if it is a friend, he does not acknowledge him. For the spirit of anger surrounds him with the nets of deceit, and blinds his eyes, and through falsehood darkens his mind, and gives him its own peculiar vision. And with what does it surround his eyes? With hatred of heart, so as to be envious of his brother. Anger is an evil thing, my children[b], because it troubles even the soul itself. And the body of the angry man it makes its own, and over his soul it gains
    mastery, and it bestows power on the body, so that it works every lawless deed. And when the body does all these things, the soul justifies what is done, because it does not see rightly. Therefore he who is wrathful, if he is a mighty man, has a threefold power in his anger: one from the help of his servants, and a second from his wealth, by which he persuades and overcomes unjustly, and a third, because he has his own natural power, and by it he works evil. And if the wrathful man is also poor, he has a twofold power of anger; for it always helps him toward wrongdoing. This spirit goes always with falsehood at the right hand of Satan, so that with cruelty and falsehood his works may be accomplished. Understand, therefore, the power of anger, that it is empty. For first it gives provocation by word; then by deeds it strengthens the one who is angry, and with sharp losses it disturbs his mind, and so it stirs up his soul with great wrath. Therefore, when anyone speaks against you, do
    not be moved to anger; and if anyone praises you as holy men, do not be exalted, either to delight or to disgust. For first it is pleasing to the hearing, and so the mind is stirred to perceive the grounds for provocation; and then, becoming angry, he thinks that he is justly angry. If you fall into any loss or ruin, my children, do not be distressed; for this very spirit makes a man desire what is perishable, in order that he may be angered through the distress. And if the loss comes willingly or unwillingly, do not be vexed; for from vexation false anger is born. Moreover, a twofold mischief is anger with falsehood; and they help one another to destroy the heart. And when the soul is continually disturbed, the Lord departs from it[c], and Beliar rules over it.'
translation:
  language: de
  text: '## Das Testament Dans 2


    Und nun, meine Kinder: Seht, ich sterbe. Wahrhaftig sage ich euch: Wenn ihr euch nicht vor dem Geist der Lüge[a] und des Zorns hütet und die Wahrheit und die Langmut[b] liebt, werdet ihr zugrunde gehen.


    Denn Zorn macht blind und lässt einen Menschen keinen anderen so sehen, wie er wirklich ist. Selbst wenn es sein Vater oder seine Mutter ist, behandelt er sie wie Feinde; selbst wenn es sein Bruder ist, erkennt er ihn nicht; selbst wenn es ein Prophet des Herrn ist, gehorcht er ihm nicht; selbst wenn es ein Gerechter ist, achtet er ihn nicht; selbst wenn es ein Freund ist, erkennt er ihn nicht an.


    Denn der Geist des Zorns umstrickt ihn mit den Netzen der Täuschung, macht seine Augen blind, verfinstert durch Lüge seinen Verstand und zwingt ihm seine eigene Sichtweise auf. Und womit umhüllt er seine Augen? Mit Hass im Herzen, sodass er seinen Bruder beneidet.


    Der Zorn ist etwas Böses, meine Kinder, denn er bringt sogar die Seele selbst in Verwirrung. Vom Körper des zornigen Menschen ergreift er Besitz, über dessen Seele gewinnt er die Herrschaft, und dem Körper verleiht er Macht, jede gesetzlose Tat zu vollbringen. Wenn aber der Körper all dies tut, rechtfertigt die Seele das Geschehene, weil sie nicht richtig sieht.


    Darum besitzt ein zorniger Mensch, wenn er mächtig ist, in seinem Zorn dreifache Macht: die erste durch die Hilfe seiner Diener, die zweite durch seinen Reichtum, mit dem er andere überredet und auf ungerechte Weise überwindet, und die dritte, weil er über eigene, natürliche Kraft verfügt und mit ihr Böses tut. Ist der zornige Mensch jedoch arm, besitzt er eine zweifache Macht des Zorns; denn dieser hilft ihm stets dabei, Unrecht zu tun.


    Dieser Geist geht immer zusammen mit der Lüge zur Rechten Satans, damit dessen Werke durch Grausamkeit und Lüge vollbracht werden. Erkennt daher, dass die Macht des Zorns leer ist. Zuerst nämlich reizt er durch ein Wort; dann stärkt er den Zornigen durch Taten, bringt dessen Verstand durch schwere Verluste in Verwirrung und erregt so seine Seele zu heftigem Zorn.


    Wenn daher jemand gegen euch redet, lasst euch nicht zum Zorn hinreißen. Und wenn jemand euch als heilige Männer lobt, überhebt euch nicht – weder aus Wohlgefallen noch aus Missfallen. Denn zunächst gefällt es dem Gehör; so wird der Verstand angeregt, Gründe für eine Provokation wahrzunehmen. Wenn der Mensch dann zornig geworden ist, meint er, sein Zorn sei berechtigt.


    Wenn euch irgendein Verlust oder Verderben trifft, meine Kinder, seid nicht betrübt. Denn eben dieser Geist bringt einen Menschen dazu, Vergängliches zu begehren, damit er durch die Bedrängnis in Zorn gerät. Und ob der Verlust willentlich oder unwillentlich eintritt: Lasst euch nicht verdrießen; denn aus Verdruss entsteht falscher Zorn.


    Zorn zusammen mit Lüge ist überdies ein doppeltes Übel; beide helfen einander, das Herz zu verderben. Und wenn die Seele fortwährend in Aufruhr ist, weicht der Herr von ihr, und Beliar[c] herrscht über sie.


    [a] Oder: „Geist der Täuschung“. Das griechische Wort kann sowohl die Lüge als auch eine umfassendere betrügerische Haltung bezeichnen.


    [b] „Langmut“ bezeichnet geduldiges Ausharren und Selbstbeherrschung angesichts von Provokation; möglich wären auch „Geduld“ oder „Nachsicht“.


    [c] Beliar ist eine überlieferte Form des Namens Belial in jüdischen und frühchristlichen Schriften.'
