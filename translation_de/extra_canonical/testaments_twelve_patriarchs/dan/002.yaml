lexical_decisions:
- source_word: πνεῦμα
  choice: Geist
  rationale: Der Zusammenhang beschreibt eine aktive moralisch-geistliche Macht und nicht bloß eine Stimmung; die spätere Verbindung mit Satan und Beliar stützt die konkrete Wiedergabe „Geist“.
- source_word: ψεύδους
  choice: Lüge
  rationale: Der Genitiv bezeichnet die der Wahrheit entgegengesetzte Macht oder Eigenschaft. „Lüge“ ist im Deutschen idiomatisch und umfasst hier mehr als eine einzelne unwahre Aussage; „Täuschung“ bleibt als Fußnotenalternative erhalten.
- source_word: θυμός
  choice: Zorn
  rationale: „Zorn“ bewahrt die Intensität und die durchgehende Personifizierung des Lasters besser als das neutralere „Ärger“, ohne überall bis zu „Wut“ zu steigern.
- source_word: ἀλήθεια
  choice: Wahrheit
  rationale: Der Begriff umfasst sowohl Wahrheit als Gegenpol zur Lüge als auch Wahrhaftigkeit im zwischenmenschlichen Sehen und Handeln.
- source_word: μακροθυμία
  choice: Langmut
  rationale: „Langmut“ bewahrt das ethische Gewicht geduldiger Selbstbeherrschung unter Provokation; „Geduld“ und „Nachsicht“ sind mögliche, aber jeweils engere Alternativen.
- source_word: δίκτυα
  choice: Netze
  rationale: Das konkrete Bild des Verstrickens wird erhalten.
- source_word: ἴδιον ὅρασιν
  choice: seine eigene Sichtweise
  rationale: Die Formulierung bewahrt das Motiv des Sehens und macht zugleich verständlich, dass der Zorn eine verzerrte Wahrnehmung aufzwingt.
- source_word: ἀνομία
  choice: gesetzlose Tat
  rationale: Die Wiedergabe erhält die moralisch-rechtliche Nuance einer Handlung, die der göttlichen Ordnung widerspricht.
- source_word: κρατεῖ
  choice: gewinnt die Herrschaft
  rationale: Die Wendung drückt die beherrschende, invasive Macht des Zorns über die Seele aus.
- source_word: κενόν
  choice: leer
  rationale: „Leer“ erhält die Aussage, dass die scheinbare Macht des Zorns letztlich gehaltlos und trügerisch ist.
- source_word: παροξυσμός / παροξύνειν
  choice: Reizung / provoziert werden
  rationale: Je nach Satzbau geben diese Ausdrücke sowohl den auslösenden Reiz als auch den Vorgang des Aufstachelns natürlich wieder.
theological_decisions:
- issue: Moralisch-geistliche Wirksamkeit von Zorn und Lüge
  choice: Die Sprache vom „Geist“ und die Personifizierung der Laster werden beibehalten.
  alternative: Die Aussagen rein psychologisch als Haltung, Stimmung oder Temperament paraphrasieren.
  rationale: Der Text verbindet diese Kräfte ausdrücklich mit Satan und Beliar und beschreibt sie als herrschende Mächte. Diese frühjüdische moralisch-apokalyptische Vorstellungswelt darf nicht auf moderne Psychologie reduziert werden.
- issue: Das Weichen des Herrn aus der Seele
  choice: „Der Herr weicht von ihr“ wird als schroffe theologische Warnung bewahrt.
  alternative: Die Aussage als Verlust von Frieden, Einsicht oder moralischer Klarheit abschwächen.
  rationale: Die überlieferte Aussage spricht von göttlichem Rückzug; eine psychologisierende Umschreibung würde ihre theologische Spannung beseitigen.
- issue: Satan und Beliar
  choice: Beide Bezeichnungen bleiben unterscheidbar stehen.
  alternative: Beliar mit Satan gleichsetzen oder einen Namen durch den anderen ersetzen.
  rationale: Der Text verwendet beide Gestalten innerhalb seines moralisch-apokalyptischen Rahmens. Die Übersetzung harmonisiert sie nicht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit paränetischem Rhythmus. Wiederholungen wie „selbst wenn“ und die Personifizierung des Zorns wurden als rhetorische Merkmale bewahrt. Archaisierende Formen wurden vermieden; etablierte ethische Begriffe wie „Langmut“ und „Beliar“ bleiben erhalten und werden erläutert. Der ausdrücklich vorgelegte griechische Wortlaut deckt den Eröffnungssatz ab; für den weiteren Kapiteltext wurde die auditierte englische Konsultationsschicht vorsichtig und ohne zusätzliche Harmonisierung herangezogen.
