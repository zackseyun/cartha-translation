    Wenn daher jemand gegen euch redet, lasst euch nicht zum Zorn hinreißen. Und wenn jemand euch als heilige Männer lobt, überhebt euch nicht – weder aus Wohlgefallen noch aus Missfallen. Denn zunächst gefällt es dem Gehör; so wird der Verstand angeregt, Gründe für eine Provokation wahrzunehmen. Wenn der Mensch dann zornig geworden ist, meint er, sein Zorn sei berechtigt.


    Wenn euch irgendein Verlust oder Verderben trifft, meine Kinder, seid nicht betrübt. Denn eben dieser Geist bringt einen Menschen dazu, Vergängliches zu begehren, damit er durch die Bedrängnis in Zorn gerät. Und ob der Verlust willentlich oder unwillentlich eintritt: Lasst euch nicht verdrießen; denn aus Verdruss entsteht falscher Zorn.


    Zorn zusammen mit Lüge ist überdies ein doppeltes Übel; beide helfen einander, das Herz zu verderben. Und wenn die Seele fortwährend in Aufruhr ist, weicht der Herr von ihr, und Beliar[c] herrscht über sie.


    [a] Oder: „Geist der Täuschung“. Das griechische Wort kann sowohl die Lüge als auch eine umfassendere betrügerische Haltung bezeichnen.


    [b] „Langmut“ bezeichnet geduldiges Ausharren und Selbstbeherrschung angesichts von Provokation; möglich wären auch „Geduld“ oder „Nachsicht“.


    [c] Beliar ist eine überlieferte Form des Namens Belial in jüdischen und frühchristlichen Schriften.'
