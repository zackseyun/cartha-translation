    Wenn euch irgendein Verlust oder Verderben trifft, meine Kinder, geratet nicht in Verzweiflung. Denn eben dieser Geist bringt einen Menschen dazu, Vergängliches zu begehren, damit er sich über den schmerzlichen Verlust erzürnt. Und ob der Verlust willentlich oder unwillentlich eintritt: Lasst euch nicht verdrießen; denn aus Verdruss entsteht trügerischer Zorn.


    Zorn zusammen mit Lüge ist überdies ein doppeltes Übel; beide helfen einander, das Herz zu verderben. Und wenn die Seele fortwährend in Aufruhr ist, weicht der Herr von ihr, und Beliar[c] herrscht über sie.


