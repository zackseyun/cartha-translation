source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Οἶδα ⌜γὰρ⌉¹ ὅτι μετὰ *τὴν τελευτήν μου² οἱ Αἰγύπτιοι θλίψουσιν³ ὑμᾶς⁴, ἀλλ᾽ ὁ Θεὸς⁵ ποιήσει τὴν ἐκδίκησιν ὑμῶν⁶ καὶ ἐπάξει⁷ ὑμᾶς εἰς *τὰς ἐπαγγελίας⁸ τῶν πατέρων ὑμῶν⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/001.yaml
  text: For I know that after my death the Egyptians will oppress you, but God will execute your vengeance and bring you into the promises of your fathers.
translation:
  language: de
  text: Denn ich weiß, dass die Ägypter euch nach meinem Tod unterdrücken werden. Doch Gott wird euch Recht verschaffen und euch an den Verheißungen eurer Väter teilhaben lassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „und euch in die Verheißungen eurer Väter hineinführen“.'
    reason: Dokumentiert die konkrete Bewegungsmetapher des griechischen ἐπάξει εἰς sowie die pluralische und hinsichtlich der Genitivbeziehung offene Formulierung „Verheißungen eurer Väter“.
lexical_decisions:
- source_word: θλίψουσιν
  choice: unterdrücken werden
  rationale: Das Verb bezeichnet hier Bedrängung beziehungsweise schwere Unterdrückung und passt zum angekündigten Vorgehen der Ägypter gegen die Nachkommen Israels.
- source_word: ποιήσει τὴν ἐκδίκησιν ὑμῶν
  choice: wird euch Recht verschaffen
  rationale: Die natürliche deutsche Wendung gibt den Gedanken göttlicher Vergeltung beziehungsweise Rechtsdurchsetzung wieder, ohne den missverständlichen Eindruck zu erwecken, Gott vollziehe einen von ihnen selbst geplanten Racheakt.
- source_word: ἐπάξει
  choice: wird euch ... hineinführen
  rationale: Bewahrt die konkrete Bewegungsmetaphorik des griechischen Verbs und fügt kein im Ausgangstext nicht vorhandenes „zurück“ ein.
- source_word: τὰς ἐπαγγελίας
  choice: das ..., was er ... verheißen hat
  rationale: Im Deutschen führt man Menschen nicht idiomatisch „in Verheißungen“ hinein. Die substantivierte Umschreibung bewahrt den pluralischen Gehalt als Gesamtheit der Verheißungen und macht verständlich, dass ihre Erfüllung beziehungsweise ihr verheißener Inhalt gemeint ist.
- source_word: τῶν πατέρων ὑμῶν
  choice: euren Vätern
  rationale: „Väter“ bewahrt die familiär-bundestheologische Bezeichnung des Ausgangstextes und ist im biblischen Register geläufig.
theological_decisions:
- issue: Bedeutung von ἐκδίκησις als Vergeltung oder Rechtsdurchsetzung
  choice: euch Recht verschaffen
  alternative: eure Vergeltung vollziehen
  rationale: Die gewählte Formulierung erhält Gottes aktives Eingreifen gegen die Unterdrückung, legt aber nicht unnötig fest, dass die Angesprochenen Träger oder Urheber einer persönlichen Rache seien.
- issue: Ziel von ἐπάξει in Verbindung mit „Verheißungen“
  choice: in das hineinführen, was er euren Vätern verheißen hat
  alternative: in die Verheißungen eurer Väter hineinführen
  rationale: Die idiomatische Fassung versteht die Verheißungen nicht bloß als Worte, sondern als den verheißenen Wirklichkeitsbereich, ohne diesen ausdrücklich auf das Land allein zu verengen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit biblischem Klang. Der Satz wurde zur besseren Lesbarkeit geteilt; der Gegensatz mit ἀλλά bleibt durch „Doch“ deutlich. Keine Rückkehrvorstellung wurde ergänzt, da das Griechische kein „zurück“ enthält.
