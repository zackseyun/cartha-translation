  revision_rationale: Die Revision ersetzt nur die interpretierend explizierende Umschreibung des letzten Satzteils. Sie bewahrt die idiomatische Verständlichkeit, erhält „Verheißungen eurer Väter“ im Haupttext und vermerkt die im Deutschen ungewöhnliche räumliche Metapher präzise in der Fußnote.
