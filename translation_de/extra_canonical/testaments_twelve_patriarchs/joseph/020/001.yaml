revisions:
- from: Denn ich weiß, dass die Ägypter euch nach meinem Tod unterdrücken werden. Doch Gott wird euch Recht verschaffen und euch in das hineinführen, was er euren Vätern verheißen hat.[a]
  to: Denn ich weiß, dass die Ägypter euch nach meinem Tod unterdrücken werden. Doch Gott wird euch Recht verschaffen und euch an den Verheißungen eurer Väter teilhaben lassen.[a]
  rationale: Die Revision ersetzt nur die interpretierend explizierende Umschreibung des letzten Satzteils. Sie bewahrt die idiomatische Verständlichkeit, erhält „Verheißungen eurer Väter“ im Haupttext und vermerkt die im Deutschen ungewöhnliche räumliche Metapher präzise in der Fußnote.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:12:54Z'
review_pass:
  verdict: revise
  source_fidelity: Der erste Satz gibt γάρ, die Zukunft von θλίβω und die zeitliche Bestimmung μετὰ τὴν τελευτήν μου zutreffend wieder. „Euch Recht verschaffen“ ist für ποιήσει τὴν ἐκδίκησιν ὑμῶν eine angemessene, nicht unnötig rachetheologisch zugespitzte Wiedergabe. Im Schlussteil legt „was er euren Vätern verheißen hat“ jedoch die Genitivverbindung τὰς ἐπαγγελίας τῶν πατέρων ὑμῶν als von Gott an die Väter gerichtete Verheißungen aus und ergänzt damit explizit den Geber. Der griechische Genitiv sollte im Haupttext möglichst offen bleiben.
  naturalness: Der Entwurf ist insgesamt flüssiges modernes Standarddeutsch. „An den Verheißungen eurer Väter teilhaben lassen“ ist idiomatisch und gibt die intendierte Teilhabe an dem durch die Verheißungen zugesagten Heilsgut wieder; die ungewöhnliche räumliche Formulierung von εἰς ... ἐπάξει wird in der Fußnote transparent dokumentiert.
  terminology: „Ägypter“, „unterdrücken“, „Recht verschaffen“, „Verheißungen“ und „Väter“ entsprechen Register und Terminologie des griechischen Textes. Die Beibehaltung von „Verheißungen eurer Väter“ wahrt die genitivische Formulierung des Ausgangstextes und vermeidet eine unnötige Festlegung ihrer genauen Relation.
  issues:
  - severity: medium
    issue: Der Haupttext bestimmt die Genitivverbindung „Verheißungen eurer Väter“ einseitig als das, „was er euren Vätern verheißen hat“.
    rationale: τῶν πατέρων ὑμῶν benennt im griechischen Text lediglich die Relation der Verheißungen zu den Vätern; die explizite Aussage, Gott habe sie den Vätern verheißen, ist zwar kontextuell naheliegend, aber nicht unmittelbar ausgedrückt. Eine offenere Formulierung wahrt die Quelltextstruktur besser.
  revised_text: Denn ich weiß, dass die Ägypter euch nach meinem Tod unterdrücken werden. Doch Gott wird euch Recht verschaffen und euch an den Verheißungen eurer Väter teilhaben lassen.[a]
