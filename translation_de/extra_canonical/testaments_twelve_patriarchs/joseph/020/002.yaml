  source_fidelity: Die Übersetzung gibt die Zukunfts-/Anweisungsnuance von συνανοίσετε angemessen mit „sollt … hinaufbringen“ wieder und bewahrt sowohl die Mitnahmeformulierung μεθ᾽ ὑμῶν als auch die Aufwärtsbewegung. „Wenn meine Gebeine dorthin hinaufgebracht werden“ entspricht dem Genitivus absolutus ἀναγομένων τῶν ὀστέων ἐκεῖ. Die parallelen Aussagen über den Herrn „im Licht“ mit den Angeredeten und Beliar „in der Finsternis“ mit den Ägyptern sind ohne zusätzliche Auslegung zutreffend wiedergegeben.
