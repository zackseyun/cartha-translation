base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/002.yaml
  text: And you shall carry up my bones with you. For when my bones are taken up there, the Lord will be with you in light, and Beliar will be with the Egyptians in darkness.
translation:
  language: de
  text: Ihr aber sollt meine Gebeine mit euch hinaufbringen. Denn wenn meine Gebeine dorthin hinaufgebracht werden, wird der Herr im Licht mit euch sein, und Beliar wird in der Finsternis bei den Ägyptern sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνανοίσετε
  choice: sollt … mit euch hinaufbringen
  rationale: Das Verb bezeichnet das gemeinsame Hinauftragen; die deutsche Wendung gibt sowohl die Bewegung nach oben als auch die Begleitung durch die Angeredeten wieder.
- source_word: τὰ ὀστᾶ μου
  choice: meine Gebeine
  rationale: „Gebeine“ ist im Deutschen die natürliche, würdige Bezeichnung für die sterblichen Knochen eines Verstorbenen.
- source_word: ἐν φωτί
  choice: im Licht
  rationale: Die räumlich-symbolische Formulierung bleibt bewusst erhalten und wird nicht zu Schutz, Segen oder Führung ausgedeutet.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Der Eigenname wird in seiner im griechischen Text belegten Form transliteriert.
- source_word: ἐν σκότει
  choice: in der Finsternis
  rationale: Bewahrt den direkten Gegensatz zu „im Licht“ und dessen theologische Bildsprache.
theological_decisions:
- issue: Beziehung des Herrn zum Licht und Beliars zur Finsternis
  choice: „der Herr [wird] im Licht mit euch sein … Beliar … in der Finsternis bei den Ägyptern“
  alternative: „der Herr wird euch Licht geben … Beliar wird die Ägypter verfinstern“
  rationale: Der griechische Text formuliert jeweils ein Sein in einer Sphäre und mit einer Gruppe. Die Übersetzung bewahrt diese Parallelität, ohne die Bilder kausal auszulegen.
- issue: Modalität von συνανοίσετε
  choice: „sollt … hinaufbringen“
  alternative: „werdet … hinaufbringen“
  rationale: Die Zukunftsform kann im testamentarischen Kontext zugleich Anweisung und Vorhersage ausdrücken. „Sollt“ gibt den auffordernden Charakter natürlich wieder, ohne einen bloßen Imperativ zu setzen.
translation_notes:
  register: Moderne, würdige Standardsprache mit leicht feierlichem Klang. Die Parallelität „im Licht … in der Finsternis“ sowie „mit euch … bei den Ägyptern“ wird erhalten; keine Fußnoten sind für diesen Vers erforderlich.
