  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/004.yaml
  text: And after saying these things, he stretched out his feet and fell asleep in a good sleep.
translation:
  language: de
  text: Und nachdem er dies gesagt hatte, streckte er seine Füße aus und entschlief in gutem Schlaf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα εἰπών
  choice: nachdem er dies gesagt hatte
  rationale: Gibt das temporale Partizip idiomatisch und in natürlicher deutscher Vorzeitigkeit wieder.
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: streckte er seine Füße aus
  rationale: Bewahrt die konkrete Körperbewegung des griechischen Textes ohne zusätzliche Deutung.
- source_word: ἐκοιμήθη
  choice: entschlief
  rationale: Das Verb bedeutet wörtlich „schlief ein“, kann im Kontext des Lebensendes aber als verhüllende Bezeichnung für den Tod dienen. „Entschlief“ erhält im Deutschen beide Ebenen.
- source_word: ὕπνῳ καλῷ
  choice: in einem guten Schlaf
  rationale: Folgt der überlieferten griechischen Formulierung und vermeidet die sachlich nicht belegte Wiedergabe „in hohem Alter“.
theological_decisions:
- issue: Schlaf als Bild für den Tod
  choice: entschlief in einem guten Schlaf
  alternative: schlief in einen guten Schlaf ein
  rationale: „Entschlief“ lässt den Todeskontext erkennen, ohne das Schlafbild durch das ausdrücklichere „starb“ aufzulösen; die ergänzende Wendung bewahrt zugleich das ungewöhnliche ὕπνῳ καλῷ.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht feierliche Form „entschlief“ passt zu einer Sterbeszene; die ungewöhnliche Wiederaufnahme von Schlaf in „in einem guten Schlaf“ bleibt wegen der markanten griechischen Ausdrucksweise erhalten.
