lexical_decisions:
- source_word: ἐπένθησεν … πένθος μέγα
  choice: hielten … große Trauer
  rationale: Die im Griechischen betonte Verbindung von Verb und stammverwandtem Substantiv wird in natürlichem, würdigem Deutsch wiedergegeben, ohne die schwerfällige Formulierung „trauerten eine große Trauer“.
- source_word: αὐτόν
  choice: um ihn
  rationale: Beim deutschen Verbgefüge „Trauer halten“ wird die betrauerte Person idiomatisch mit „um“ bezeichnet.
- source_word: πᾶς Ἰσραὴλ καὶ πᾶσα Αἴγυπτος
  choice: ganz Israel und ganz Ägypten
  rationale: Bewahrt die zweimalige umfassende Aussage πᾶς/πᾶσα sowie die parallele Struktur des griechischen Textes.
