  text: And bring Aseneth your mother [to the Hippodrome], and bury her near Rachel my mother.
translation:
  language: de
  text: Bringt Aseneth, eure Mutter, [zum Hippodrom][a] und begrabt sie nahe bei meiner Mutter Rahel.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte »zum Hippodrom« stehen im griechischen Text in eckigen Klammern und gelten daher als textkritisch unsicher.
    reason: Die Vorlage kennzeichnet παρὰ τὸν Ἱππόδρομον als möglicherweise sekundären oder unsicher überlieferten Zusatz; diese Unsicherheit soll sichtbar bleiben.
lexical_decisions:
- source_word: ἀγάγετε
  choice: Bringt
  rationale: Der Imperativ wird direkt und natürlich wiedergegeben; im Zusammenhang ist gemeint, Aseneth zur Bestattung an den bezeichneten Ort zu bringen.
- source_word: παρὰ τὸν Ἱππόδρομον
  choice: zum Hippodrom
  rationale: παρά mit Akkusativ bezeichnet hier die Bewegung zu einem Ort beziehungsweise in dessen Nähe; die knappe Wiedergabe bewahrt den Ortsbezug.
- source_word: πλησίον Ῥαχιὴλ τῆς μητέρος μου
  choice: nahe bei meiner Mutter Rahel
  rationale: Gibt die räumliche Nähe und die Apposition in natürlichem modernem Deutsch wieder.
- source_word: θάψατε αὐτήν
  choice: begrabt sie
  rationale: Entspricht dem ausdrücklichen Bestattungsbefehl und bewahrt den Pluralimperativ.
