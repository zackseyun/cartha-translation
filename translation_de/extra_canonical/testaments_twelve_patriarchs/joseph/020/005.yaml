base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/005.yaml
  text: And you shall carry up my bones with you. For when my bones are taken up there, the Lord will be with you in light, and Beliar will be with the Egyptians in darkness.
translation:
  language: de
  text: Ihr aber sollt meine Gebeine mit euch hinaufbringen. Denn wenn die Gebeine dorthin hinaufgebracht werden, wird der Herr im Licht mit euch sein, Beliar aber wird in der Finsternis bei den Ägyptern sein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: συνανοίσετε
  choice: sollt … mit euch hinaufbringen
  rationale: Gibt die gemeinsame Aufwärtsbewegung samt Mitnahme wieder; im Zusammenhang sind die Gebeine das mitgeführte Objekt.
- source_word: τὰ ὀστᾶ μου / τῶν ὀστέων
  choice: meine Gebeine / die Gebeine
  rationale: „Gebeine“ ist im Deutschen die natürliche, würdige Bezeichnung für die sterblichen Knochen eines Verstorbenen und bewahrt den Wechsel vom Possessiv zur bloßen Nominalform.
- source_word: ἐν φωτί
  choice: im Licht
  rationale: Bewahrt das räumlich-metaphorische Bild des griechischen Ausdrucks, ohne es als Schutz, Offenbarung oder Heil auszudeuten.
- source_word: ἐν σκότει
  choice: in der Finsternis
  rationale: Erhält den bewussten Gegensatz zu „im Licht“ und den feierlichen Registerton.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Übernimmt den Eigennamen in der im Deutschen etablierten Form und vermeidet eine interpretierende Ersetzung wie „der Teufel“.
theological_decisions:
- issue: Gegenüberstellung der Gegenwart des Herrn und Beliars
  choice: „der Herr … mit euch“, „Beliar aber … bei den Ägyptern“
  alternative: Beliar als handelnden Gegner oder Herrscher der Ägypter auslegen
  rationale: Die Übersetzung hält sich an die parallelen Präpositionalangaben und fügt keine Aussage über Herrschaft, Ursache oder endgültiges Gericht hinzu.
- issue: Bedeutung von Licht und Finsternis
  choice: Bildsprache wörtlich bewahren
  alternative: Licht als Heil und Finsternis als Verdammnis ausdrücklich deuten
  rationale: Der griechische Text lässt die theologische Reichweite der Bilder unausgeführt; diese Spannung soll erhalten bleiben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wahrt den feierlichen Parallelismus des Griechischen, bleibt aber für heutige Leser klar. „Ihr aber“ erhält den kontrastiven Einsatz von Ὑμεῖς δέ; „sollt“ gibt den futurischen Auftrag im Kontext natürlich wieder.
