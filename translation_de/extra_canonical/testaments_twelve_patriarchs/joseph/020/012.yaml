  source_fidelity: Die Übersetzung gibt die Gegenüberstellung von αὐτοῦ und ἐμή, das Zukunftsverb ἔσται beim bleibenden Reich sowie das präsentische Passiv ἐπιτελεῖται angemessen wieder. „wird vollendet“ ist im Deutschen als Präsenspassiv möglich und bewahrt die im griechischen Ausdruck liegende Offenheit zwischen Vollendung und Abschluss. „nicht vergehen“ entspricht οὐ παρελεύσεται; „verschwindet“ trifft ἐξαφανίζεται gut.
  naturalness: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die etwas formelhafte Wiederholung von „Reich“ ist quellentreu und stilistisch tragfähig. „Wächterhütte in einem Obstgarten“ ist ein natürlicher, anschaulicher Ausdruck.
  terminology: „Reich“, „ewig“, „vollendet“, „Wächterhütte“ und „Obstgarten“ sind sachgerecht. Die Übersetzung vermeidet eine dogmatisch festlegende Ausdeutung des Kontrasts zwischen dem bleibenden und dem vergänglichen Reich.
