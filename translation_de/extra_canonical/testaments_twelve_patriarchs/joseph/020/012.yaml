id: T12P.JOS.20.12
reference: Testament of Joseph 20:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἡ γὰρ βασιλεία αὐτοῦ βασιλεία *ἔσται αἰώνιος⁴⁹ ἥτις οὐ παρελεύσεται⁵⁰. ἡ δὲ ἐμὴ βασιλεία⁵¹ ἐν ὑμῖν ἐπιτελεῖται, ὡς ὀπωροφυλάκιον⁵² ⌜γος⌉⁵³ μετὰ τὸ θέρος ἐξαφανίζεται⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/012.yaml
  text: For his kingdom will be an everlasting kingdom that will not pass away. But my kingdom among you is brought to completion, like a watchman’s hut in an orchard, which disappears after the summer.”
translation:
  language: de
  text: Denn sein Reich wird ein ewiges Reich sein, das nicht vergehen wird. Mein Reich unter euch aber wird vollendet, wie eine Wächterhütte in einem Obstgarten[a], die nach dem Sommer verschwindet.“
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nach „Obstgarten“ steht im griechischen Text ein unverständliches Wortfragment; der Sinn des Vergleichs bleibt dennoch erkennbar.
    reason: Textkritischer Hinweis auf das überlieferte Fragment „γος“, das sich nicht sicher übersetzen lässt.
lexical_decisions:
- source_word: βασιλεία
  choice: Reich
  rationale: „Reich“ gibt sowohl Herrschaft als auch Herrschaftsbereich wieder und bewahrt die bewusste Gegenüberstellung zwischen seinem bleibenden und Josefs vergänglichem Reich.
- source_word: αἰώνιος
  choice: ewig
  rationale: Entspricht hier dem zeitlich unbegrenzten Charakter, der durch „nicht vergehen“ ausdrücklich bekräftigt wird.
- source_word: ἐπιτελεῖται
  choice: wird vollendet
  rationale: Bewahrt die passive Form und die mögliche Spannung zwischen Vollendung und Abschluss, ohne den Ausdruck einseitig als bloßes Ende auszulegen.
- source_word: ὀπωροφυλάκιον
  choice: Wächterhütte in einem Obstgarten
  rationale: Bezeichnet eine einfache Hütte zur Bewachung einer Obstanlage beziehungsweise eines Fruchtgartens; die gewählte Formulierung ist anschaulich und im modernen Deutsch verständlich.
- source_word: θέρος
  choice: Sommer
  rationale: Das Wort kann Sommer oder Erntezeit bezeichnen. „Sommer“ folgt dem unmittelbaren zeitlichen Sinn und lässt den jahreszeitlichen Bildgehalt bestehen.
- source_word: ἐξαφανίζεται
  choice: verschwindet
  rationale: Gibt das Verschwinden beziehungsweise Nicht-mehr-Sichtbarsein unmittelbar wieder.
theological_decisions:
- issue: Gegenüberstellung von „seinem Reich“ und „meinem Reich“
  choice: Die wechselnden Possessivpronomen werden unverändert beibehalten.
  alternative: Beide Aussagen auf dieselbe Person oder dasselbe Reich beziehen.
  rationale: Der griechische Text stellt αὐτοῦ und ἐμή ausdrücklich einander gegenüber. Diese theologische Spannung darf nicht harmonisiert werden.
- issue: Bedeutung der Vollendung von Josefs Reich
  choice: „wird vollendet“
  alternative: „geht zu Ende“
  rationale: Der Kontext legt Vergänglichkeit nahe, doch ἐπιτελεῖται kann sowohl Vollendung als auch Abschluss bezeichnen. Die Übersetzung bewahrt diese Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die Wiederholung von „Reich“ und die formelhafte Wendung „ewiges Reich“ wurden wegen ihrer rhetorischen und theologischen Funktion erhalten.
