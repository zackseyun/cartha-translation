source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ²⁶ *ταῦτα εἰπὼν²⁷ ἐκτείνας²⁸ τοὺς πόδας αὐτοῦ²⁹ *ἐκοιμήθη ὕπνῳ καλῷ³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/006.yaml
  text: And after saying these things, he stretched out his feet and fell asleep in a beautiful sleep.
translation:
  language: de
  text: Und nachdem er dies gesagt hatte, streckte er seine Füße aus und entschlief in einem sanften Schlaf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα εἰπών
  choice: nachdem er dies gesagt hatte
  rationale: Gibt das temporale Partizip natürlich und präzise wieder; „dies“ verweist auf die unmittelbar vorausgehenden Worte.
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: streckte er seine Füße aus
  rationale: Bewahrt das konkrete Bild des griechischen Textes und den Bezug auf Joseph.
- source_word: ἐκοιμήθη
  choice: entschlief
  rationale: Das Verb bedeutet wörtlich „schlief ein“, kann hier im Bericht von Josephs Tod jedoch zugleich ein ehrfürchtiger Ausdruck für das Sterben sein. „Entschlief“ erhält diese Doppelbödigkeit.
- source_word: ὕπνῳ καλῷ
  choice: in einem sanften Schlaf
  rationale: καλός bezeichnet hier einen guten, friedlichen oder schönen Schlaf. „Sanft“ klingt im modernen Deutschen natürlich und wahrt den friedvollen Charakter, ohne die Wendung unidiomatisch als „schöner Schlaf“ wiederzugeben.
theological_decisions:
- issue: Schlaf als Bezeichnung für den Tod
  choice: entschlief
  alternative: schlief ein
  rationale: Der Kontext legt Josephs Tod nahe, während das Griechische ausdrücklich die Bildsprache des Schlafes verwendet. „Entschlief“ bewahrt beides, ohne eine weitergehende Lehre über den Todeszustand einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung bleibt nah am griechischen Satzbau, ist jedoch idiomatisch und bewahrt die feierliche Todesschilderung.
