id: T12P.JOS.20.8
reference: Testament of Joseph 20:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: ⌜Καὶ ἐν τῇ ἐξόδῳ τῶν υἱῶν Ἰσραὴλ ἐξ Αἰγύπτου συνήγαγον τὰ ὀστᾶ Ἰωσήφ, καὶ ἔθαψαν αὐτὸν ἐν Χεβρὼν μετὰ τῶν πατέρων αὐτοῦ· ἐγένοντο δὲ τὰ ἔτη τῆς ζωῆς αὐτοῦ ἔτη ἑκατὸν δέκα⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/008.yaml
  text: And in the exodus of the sons of Israel from Egypt they gathered up the bones of Joseph, and buried him in Hebron with his fathers; and the years of his life were one hundred and ten years.
translation:
  language: de
  text: Beim Auszug der Söhne Israels aus Ägypten sammelten sie Josefs Gebeine ein und begruben ihn in Hebron bei seinen Vätern; die Jahre seines Lebens betrugen hundertzehn Jahre.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τῇ ἐξόδῳ
  choice: als … auszogen
  rationale: Gibt die zeitliche Bedeutung der Präpositionalfügung im natürlichen modernen Deutsch wieder; der Zusammenhang bezeichnet den Auszug aus Ägypten.
- source_word: τῶν υἱῶν Ἰσραήλ
  choice: die Söhne Israels
  rationale: Bewahrt die konkrete Formulierung des griechischen Textes, statt sie zu „Israeliten“ zu verallgemeinern.
- source_word: συνήγαγον τὰ ὀστᾶ Ἰωσήφ
  choice: nahmen sie Josefs Gebeine mit
  rationale: Im Bestattungskontext bezeichnet „Gebeine“ die sterblichen Knochenreste; „mitnehmen“ gibt hier das Einsammeln und Mitführen beim Auszug idiomatisch wieder.
- source_word: μετὰ τῶν πατέρων αὐτοῦ
  choice: bei seinen Vätern
  rationale: „Bei“ drückt die gemeinsame Grablege natürlich aus, während „Väter“ die patriarchale Familienbezeichnung des Ausgangstextes erhält.
- source_word: ἐγένοντο δὲ τὰ ἔτη τῆς ζωῆς αὐτοῦ ἔτη ἑκατὸν δέκα
  choice: Seine Lebenszeit betrug hundertzehn Jahre
  rationale: Eine würdevolle und verständliche deutsche Wiedergabe der formelhaften Altersangabe ohne unnötige Wiederholung von „Jahre“.
theological_decisions:
- issue: Ort der Bestattung Josefs
  choice: Hebron
  alternative: Sichem entsprechend Josua 24,32
  rationale: Die Übersetzung folgt ohne Harmonisierung ausdrücklich der Lesart Χεβρών im vorliegenden griechischen Quellentext und bewahrt damit die Spannung zu anderen Überlieferungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde leicht geglättet, während zentrale quellensprachliche Ausdrücke wie „Söhne Israels“, „Gebeine“ und „Väter“ erhalten bleiben.
