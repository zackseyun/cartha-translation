source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ²⁶ *ταῦτα εἰπὼν²⁷ ἐκτείνας²⁸ τοὺς πόδας αὐτοῦ²⁹ *ἐκοιμήθη ὕπνῳ καλῷ³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/009.yaml
  text: And after saying these things, he stretched out his feet and fell asleep in a beautiful sleep.
translation:
  language: de
  text: Und nachdem er dies gesagt hatte, streckte er seine Füße aus und entschlief in einem sanften Schlaf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκοιμήθη
  choice: entschlief
  rationale: Das Verb bedeutet wörtlich „schlief ein“, kann hier im Bericht von Josephs Tod jedoch zugleich als verhüllende Bezeichnung für das Sterben verstanden werden. „Entschlief“ bewahrt diese Spannung.
- source_word: ὕπνῳ καλῷ
  choice: in einem sanften Schlaf
  rationale: καλός bezeichnet hier einen guten, friedlichen oder angenehmen Schlaf. „Sanft“ klingt im Deutschen natürlich und gibt die positive Wertung wieder, ohne „ewig“ in den Text einzutragen.
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: streckte er seine Füße aus
  rationale: Die konkrete Körperhaltung wird entsprechend dem griechischen Wortlaut direkt wiedergegeben.
theological_decisions:
- issue: Ob Josephs Tod ausdrücklich als „ewiger Schlaf“ bezeichnet wird
  choice: entschlief in einem sanften Schlaf
  alternative: schlief den ewigen Schlaf
  rationale: Im griechischen Text steht καλῷ („gut/schön“) und nicht „ewig“. Die Todesbedeutung wird durch „entschlief“ im Kontext erkennbar, ohne eine nicht belegte Ewigkeitsterminologie einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Partizipialkonstruktionen werden als flüssiger temporaler Hauptsatz wiedergegeben; die ruhige, euphemistische Todessprache des Griechischen bleibt erhalten.
