source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἡ γὰρ βασιλεία αὐτοῦ βασιλεία *ἔσται αἰώνιος⁴⁹ ἥτις οὐ παρελεύσεται⁵⁰. ἡ δὲ ἐμὴ βασιλεία⁵¹ ἐν ὑμῖν ἐπιτελεῖται, ὡς ὀπωροφυλάκιον⁵² ⌜γος⌉⁵³ μετὰ τὸ θέρος ἐξαφανίζεται⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020/011.yaml
  text: For his kingdom will be an everlasting kingdom, which will not pass away. But my kingdom among you will be brought to completion, like a watchman’s hut in an orchard, which vanishes after the summer.
translation:
  language: de
  text: Denn sein Reich wird ein ewiges Reich sein, das nicht vergehen wird. Mein Reich aber findet in eurer Mitte[a] sein Ende, wie eine Wächterhütte in einem Obstgarten[b], die nach dem Sommer verschwindet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: »in euch«; gemeint sein kann ebenso »unter euch«.'
    reason: Bewahrt die echte Bedeutungsbreite von ἐν ὑμῖν.
  - marker: b
    text: Der griechische Text ist unmittelbar nach »Obstgarten« beschädigt beziehungsweise unklar.
    reason: Kennzeichnet die textkritische Unsicherheit des überlieferten Fragments ⌜γος⌉, ohne es spekulativ zu ergänzen.
lexical_decisions:
- source_word: βασιλεία
  choice: Reich
  rationale: Gibt sowohl die Herrschaft als auch den von ihr bestimmten Bereich wieder und bewahrt die Wiederholung des griechischen Textes.
- source_word: αἰώνιος
  choice: ewig
  rationale: Die übliche und kontextgemäße Wiedergabe für eine bleibende, nicht endende Herrschaft; der folgende Relativsatz erläutert sie als ein Reich, das nicht vergeht.
- source_word: ἐν ὑμῖν
  choice: in eurer Mitte
  rationale: Das griechische ἐν ὑμῖν kann sowohl »in euch« als auch »unter euch/in eurer Mitte« bedeuten. Bei einem Reich innerhalb einer Gemeinschaft ist die räumlich-korporative Bedeutung im Deutschen natürlicher, ohne die Mehrdeutigkeit zu verschweigen.
- source_word: ἐπιτελεῖται
  choice: wird … zu Ende kommen
  rationale: Das Verb kann Vollendung oder Abschluss bezeichnen. Der Vergleich mit der nach der Ernte verschwindenden Hütte legt hier das Ende von Josefs zeitlich begrenztem Reich nahe.
- source_word: ὀπωροφυλάκιον
  choice: Wächterhütte in einem Obstgarten
  rationale: Bezeichnet eine provisorische Hütte oder Unterkunft zur Bewachung eines Obstgartens; die explizite Wiedergabe ist für heutige Leser verständlich.
- source_word: θέρος
  choice: Ernte
  rationale: θέρος kann »Sommer« oder »Ernte(zeit)« bedeuten. Im Bild einer saisonal genutzten Wächterhütte ist »nach der Ernte« idiomatisch und sachlich besonders passend.
- source_word: ἐξαφανίζεται
  choice: verschwindet
  rationale: Bewahrt die Bildhaftigkeit und den deutlichen Gegensatz zum Reich, das nicht vergeht.
theological_decisions:
- issue: Gegensatz zwischen »seinem Reich« und »meinem Reich«
  choice: Die unterschiedlichen Pronomen und der Gegensatz zwischen ewigem und endendem Reich bleiben unverändert stehen.
  alternative: »Sein Reich« ausdrücklich messianisch deuten und »mein Reich« als Herrschaft von Josefs Stamm erklären.
  rationale: Der Vers selbst benennt den Träger des ewigen Reiches nicht ausdrücklich. Eine identifizierende Auslegung würde mehr festlegen, als der vorliegende griechische Wortlaut sagt.
- issue: Bedeutung von ἐπιτελεῖται
  choice: Als zeitliches Zu-Ende-Kommen wiedergegeben.
  alternative: »wird vollendet« oder »wird zur Vollendung gebracht«.
  rationale: Obwohl eine positive Vollendungsbedeutung grammatisch möglich ist, erklärt das Gleichnis vom Verschwinden der saisonalen Hütte den Ausdruck hier als Abschluss beziehungsweise Ende.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die Wiederholung von »Reich« und der scharfe Kontrast zwischen bleibender und vergänglicher Herrschaft werden beibehalten; das ländliche Bild wird verständlich, aber nicht modernisierend umformuliert.
