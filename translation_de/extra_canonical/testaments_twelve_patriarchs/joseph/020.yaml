  text: XX. Οἶδα ⌜γὰρ⌉¹ ὅτι μετὰ *τὴν τελευτήν μου² οἱ Αἰγύπτιοι θλίψουσιν³ ὑμᾶς⁴, ἀλλ᾽ ὁ Θεὸς⁵ ποιήσει τὴν ἐκδίκησιν ὑμῶν⁶ καὶ ἐπάξει⁷ ὑμᾶς εἰς *τὰς ἐπαγγελίας⁸ τῶν πατέρων ὑμῶν⁹. 2. *Ὑμεῖς δὲ¹⁰ συνανοίσετε¹¹ τὰ ὀστᾶ μου¹² μεθ᾽ ὑμῶν¹³, ⌜ὅτι, ἀναγομένων¹⁴ τῶν ὀστέων ἐκεῖ¹⁵, Κύριος ἐν φωτὶ ἔσται μεθ᾽ ὑμῶν¹⁶, καὶ ὁ¹⁷ Βελίαρ *ἐν σκότει ἔσται¹⁸ μετὰ τῶν Αἰγυπτίων⌉. 3. *᾿Ασυνὲθ δὲ¹⁹ τὴν μητέρα ὑμῶν ἀγάγετε²⁰ [παρὰ τὸν Ἱππόδρομον]²¹ καὶ πλησίον Ῥαχιὴλ τῆς μητέρος μου *θάψατε αὐτήν²². 4. Καὶ²⁶ *ταῦτα εἰπὼν²⁷ ἐκτείνας²⁸ τοὺς πόδας αὐτοῦ²⁹ *ἐκοιμήθη ὕπνῳ καλῷ³⁰. 5. Καὶ ἐπένθησεν³¹ αὐτὸν πᾶς Ἰσραὴλ καὶ πᾶσα Αἴγυπτος πένθος μέγα. 6. ⌜Καὶ ἐν τῇ ἐξόδῳ τῶν υἱῶν Ἰσραὴλ ἐξ Αἰγύπτου συνήγαγον τὰ ὀστᾶ Ἰωσήφ, καὶ ἔθαψαν αὐτὸν ἐν Χεβρὼν μετὰ τῶν πατέρων αὐτοῦ· ἐγένοντο δὲ τὰ ἔτη τῆς ζωῆς αὐτοῦ ἔτη ἑκατὸν δέκα⌉. (XIX:12 echo.) Ἡ γὰρ βασιλεία αὐτοῦ βασιλεία *ἔσται αἰώνιος⁴⁹ ἥτις οὐ παρελεύσεται⁵⁰. ἡ δὲ ἐμὴ βασιλεία⁵¹ ἐν ὑμῖν ἐπιτελεῖται, ὡς ὀπωροφυλάκιον⁵² ⌜γος⌉⁵³ μετὰ τὸ θέρος ἐξαφανίζεται⁵⁴.
