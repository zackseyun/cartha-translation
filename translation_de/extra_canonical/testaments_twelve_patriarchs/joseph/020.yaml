base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/020.yaml
  text: '1[[to the Hippodrome]]. For I know that after my death the Egyptians will oppress you, but God will execute your vengeance and bring you into the promises of your fathers.


    2. But you shall carry up my bones with you[3a], for when my bones are taken up there, the Lord will be with you in light, and Beliar will be with the Egyptians in darkness.


    3. And bring Aseneth your mother [to the Hippodrome], and bury her near Rachel my mother.


    3a. But another reading says: “And bring up Zelpha your mother, and place her near Bilhah [by the Hippodrome], close to Rachel.”


    12. For my kingdom among you will be brought to completion like a watchman’s hut in an orchard[12b][12], which does not appear after the summer.”'
translation:
  language: de
  text: '**Testament Josefs 20**


    **1** Denn ich weiß: Nach meinem Tod werden die Ägypter euch bedrängen. Doch Gott wird euch rächen und euch zu den Verheißungen eurer Väter führen.


    **2** Ihr aber sollt meine Gebeine mit euch hinaufbringen. Denn wenn meine Gebeine dorthin gebracht werden, wird der Herr im Licht mit euch sein, Beliar aber wird in der Finsternis bei den Ägyptern sein.


    **3** Bringt auch Aseneth, eure Mutter, [zur Rennbahn][a] und begrabt sie nahe bei Rahel, meiner Mutter.


    **4** Nachdem er dies gesagt hatte, streckte er seine Beine aus und entschlief in einem friedlichen Schlaf.


    **5** Ganz Israel und ganz Ägypten hielten große Trauer um ihn.


    **6** Als die Söhne Israels aus Ägypten auszogen, nahmen sie Josefs Gebeine mit und begruben ihn in Hebron zusammen mit seinen Vätern. Seine Lebenszeit betrug hundertzehn Jahre.


    Denn sein Reich wird ein ewiges Reich sein, das nicht vergehen wird. Mein Reich unter euch aber wird vollendet: Es ist wie eine Wächterhütte in einem Obstgarten, die nach dem Sommer verschwindet.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „zur Rennbahn“ stehen im griechischen Text in eckigen Klammern und sind textkritisch unsicher. Andere Überlieferungen bieten an dieser Stelle eine abweichende Bestattungsanweisung mit Silpa und Bilha.
    reason: textual_variant
  - marker: b
    text: Die abschließenden Sätze erscheinen in der gelieferten Textgrundlage nach Vers 6, werden dort jedoch zugleich als Wiederaufnahme aus 19,12 gekennzeichnet. Das überlieferte Hüttenbild ist an einer Stelle beschädigt; es erinnert an eine nur saisonal genutzte Wächterhütte (vgl. Jesaja 1,8).
    reason: textual_variant
lexical_decisions:
- source_word: τελευτή
  choice: Tod
  rationale: Im testamentarischen Zusammenhang bezeichnet das Wort klar Josefs Lebensende; „Tod“ ist direkt und natürlich.
- source_word: θλίψουσιν
  choice: werden … bedrängen
  rationale: Gibt die anhaltende Bedrückung durch die Ägypter wieder, ohne den Ausdruck unnötig auszuschmücken.
- source_word: ἐκδίκησιν … ποιήσει
  choice: wird euch rächen
  rationale: Bewahrt den aktiven vergeltenden beziehungsweise rechtverschaffenden Sinn der Wendung in natürlichem Deutsch.
- source_word: ἐπάξει … εἰς τὰς ἐπαγγελίας
  choice: wird … zu den Verheißungen … führen
  rationale: Gibt die Bewegung auf das den Vätern Verheißene hin wieder, ohne ein im Verb nicht ausdrücklich enthaltenes „zurück“ einzufügen.
- source_word: συνανοίσετε
  choice: sollt … mit euch hinaufbringen
  rationale: Bewahrt sowohl das gemeinsame Mitnehmen als auch die im Exoduskontext bezeichnete Aufwärtsbewegung.
- source_word: ἐν φωτί / ἐν σκότει
  choice: im Licht / in der Finsternis
  rationale: Erhält den knappen, parallelen apokalyptisch-moralischen Gegensatz.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Folgt der Namensform des griechischen Textes, statt sie zu „Belial“ oder „Satan“ zu harmonisieren.
- source_word: ἐκοιμήθη ὕπνῳ καλῷ
  choice: entschlief in einem friedlichen Schlaf
  rationale: Bewahrt das Sterbebild des Einschlafens; „friedlich“ gibt die positive Wertung von καλός hier idiomatisch wieder.
- source_word: ὀπωροφυλάκιον
  choice: Wächterhütte in einem Obstgarten
  rationale: Bezeichnet eine vorübergehend genutzte Schutzhütte im Fruchtgarten und erhält das Bild saisonaler Vergänglichkeit.
- source_word: ἐπιτελεῖται
  choice: findet sein Ende
  rationale: Im Gegensatz zum ewigen Reich bezeichnet die Form hier das Vollendetwerden beziehungsweise Zu-Ende-Kommen von Josefs Reich.
theological_decisions:
- issue: Gottes ἐκδίκησις an den Bedrängern Israels
  choice: „Gott wird euch rächen“
  alternative: „Gott wird euch Recht verschaffen“
  rationale: Das griechische Substantiv kann Rechtverschaffung und Vergeltung umfassen. Die Hauptfassung bewahrt die schärfere Aussage, ohne sie zu bloßer Fürsorge abzuschwächen.
- issue: Personifizierung Beliars
  choice: Beliar bleibt als personale Gestalt im Text stehen.
  alternative: Wiedergabe als „das Böse“ oder Harmonisierung mit Satan
  rationale: Der griechische Text stellt Beliar dem Herrn ausdrücklich gegenüber; diese apokalyptische Spannung darf nicht entmythologisiert werden.
- issue: Gegensatz zwischen ewigem Reich und Josefs vergänglichem Reich
  choice: Der Gegensatz wird ohne christologische oder dynastische Identifizierung übersetzt.
  alternative: Das ewige Reich ausdrücklich einer bestimmten messianischen Person zuordnen
  rationale: Das Pronomen „sein“ besitzt im isoliert überlieferten Fragment keinen eindeutigen Bezug. Die Übersetzung bewahrt diese Unbestimmtheit.
- issue: Bestattungsort Hebron
  choice: „Hebron“ wird unverändert wiedergegeben.
  alternative: Harmonisierung mit der biblischen Angabe Sichem
  rationale: Die vorliegende griechische Quelle nennt Hebron; eine stillschweigende Korrektur würde ihre eigenständige Überlieferung verdecken.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Semitisch-griechische Wiederholungen wurden dort maßvoll geglättet, wo ihre wörtliche Wiedergabe im Deutschen schwerfällig wäre; zentrale Bilder, Gegensätze und textliche Unsicherheiten bleiben sichtbar.
