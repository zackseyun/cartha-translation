  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008.yaml
  text: '6[a]. And she said to me, “See then, you love me. Let this be enough for me: only take thought for my life and for my children, and I have hope that I shall also obtain my desire.” 7. But she did not know that I spoke thus because of my Lord, and not because of her. 8. For if anyone falls under the passion of desire and is enslaved to it, as she also was, even if he hears something good, he interprets it in terms of that passion, toward his evil desire[b].


    1. So I say, my children, that it was about the sixth hour when she left me. And bending my knee to the Lord all that day and all that night, toward dawn I rose, weeping and asking for deliverance from her. 2. At last, with evil intent, she seized my garments by force, dragging me violently toward intercourse. 3. Therefore, when I saw that in her frenzy she had hold of my tunic, I left it behind and fled naked. 4. But she, taking hold of it, slandered me; and when her husband came, he cast me into prison in his house, and on the next day, after scourging me, he sent me into Pharaoh’s dungeon. 5. And while I was in chains[c], the Egyptian woman was constrained by grief.'
translation:
  language: de
  text: '**7,6** Da sagte sie zu mir: »Sieh, du liebst mich also. Das soll mir genügen: Kümmere dich nur um mein Leben und um das meiner Kinder; und ich hoffe, auch zu erlangen, wonach ich verlange.« **7** Sie wusste jedoch nicht, dass ich wegen meines Herrn[a] so gesprochen hatte und nicht ihretwegen. **8** Denn wenn jemand der Leidenschaft des Verlangens verfällt und ihr versklavt wird, wie auch sie es war, dann deutet er selbst etwas Gutes, das er hört, im Sinne dieser Leidenschaft, auf sein böses Verlangen hin.


    **8,1** Ich sage also, meine Kinder: Es war etwa um die sechste Stunde[b], als sie von mir wegging. Ich kniete vor dem Herrn den ganzen Tag und die ganze Nacht. Gegen Morgen stand ich auf; ich weinte und bat darum, von ihr befreit zu werden. **2** Schließlich ergriff sie gewaltsam meine Kleider und zerrte mich mit Gewalt zum Geschlechtsverkehr. **3** Als ich nun sah, dass sie rasend mein Untergewand festhielt, ließ ich es zurück und floh nackt davon.[c] **4** Sie aber behielt es, beschuldigte mich fälschlich, und als ihr Mann kam, ließ er mich in das Gefängnis in seinem Haus werfen. Am folgenden Tag ließ er mich auspeitschen und in den Kerker des Pharaos bringen. **5** Als ich in Fesseln lag, wurde die Ägypterin von Kummer überwältigt. Sie kam und lauschte mir zu: Im Haus der Finsternis dankte ich dem Herrn und sang ihm Loblieder; mit froher Stimme pries ich meinen Gott, weil ich durch ihren Vorwand[d] von der Ägypterin befreit worden war.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische κύριος kann sowohl Gott als auch einen menschlichen Herrn oder Gebieter bezeichnen. Der unmittelbare Zusammenhang nennt anschließend Josefs Gebet zum Herrn und sein Lob Gottes, legt den Bezug aber nicht ausdrücklich fest.
    reason: lexical_ambiguity
  - marker: b
    text: Die sechste Stunde entspricht ungefähr der Mittagszeit.
    reason: historical_context
  - marker: c
    text: Die vorliegende griechische Ausgabe setzt hier den Zusatz sinngemäß »und nachdem ich mich losgerissen hatte« in eckige Klammern. Vgl. 1. Mose 39,12.
    reason: textual_variant_and_cross_reference
  - marker: d
    text: 'Oder: »durch diesen Anlass«. Das griechische πρόφασις kann einen Vorwand, vorgeschobenen Grund oder Anlass bezeichnen.'
    reason: lexical_alternative
lexical_decisions:
- source_word: ἀντιποιῆσαι τῆς ζωῆς μου καὶ τῶν τέκνων μου
  choice: Kümmere dich nur um mein Leben und um das meiner Kinder
  rationale: Das Verb bezeichnet hier, etwas als eigene Angelegenheit aufzugreifen beziehungsweise sich darum zu kümmern. Die Formulierung bewahrt den manipulativen Appell, ohne eine rechtliche Verantwortungsübernahme hineinzulesen.
- source_word: προσδοκίαν ἀπολαῦσαι καὶ τῆς ἐπιθυμίας μου
  choice: dann kann ich hoffen, auch zu erlangen, wonach ich verlange
  rationale: ἀπολαύω kann »genießen« oder »erlangen« bedeuten. Die gewählte Fassung gibt das erhoffte Erreichen ihres begehrten Ziels klar wieder, ohne unnötig auszudeuten.
- source_word: ὑποπέσῃ πάθει ἐπιθυμίας καὶ δουλωθῇ αὐτῷ
  choice: der Leidenschaft des Verlangens verfällt und ihr versklavt wird
  rationale: Die Unterwerfungsbilder beider Verben bleiben erhalten; »Leidenschaft des Verlangens« lässt den Ausdruck breiter stehen als eine ausschließlich sexuelle Wiedergabe, während der Kontext seine konkrete Richtung erkennen lässt.
- source_word: ἐκλαμβάνει αὐτὸ πρὸς τὴν πονηρὰν ἐπιθυμίαν
  choice: deutet er ... im Sinne dieser Leidenschaft und im Dienst seines bösen Verlangens
  rationale: ἐκλαμβάνω beschreibt hier ein verstehendes Aufnehmen beziehungsweise Deuten. Die Übersetzung macht sichtbar, dass versklavtes Begehren selbst gute Worte verzerrt.
- source_word: κλίνας γόνυ πρὸς Κύριον
  choice: Ich beugte vor dem Herrn die Knie
  rationale: Die konkrete Gebetsgebärde des griechischen Textes wird in einem natürlichen, würdigen deutschen Ausdruck bewahrt.
- source_word: μετὰ βίας ἐφελκομένη με εἰς συνουσίαν
  choice: versuchte mit aller Kraft, mich zum Geschlechtsverkehr zu zerren
  rationale: συνουσία bezeichnet in diesem Zusammenhang eindeutig sexuelle Gemeinschaft. Die direkte Wiedergabe vermeidet eine beschönigende Umschreibung; die imperfektische Handlung wird als gewaltsamer Versuch dargestellt.
- source_word: μαινομένη
  choice: rasend
  rationale: Das Partizip bezeichnet einen Zustand wahnhaft-heftiger Erregung. »Rasend« ist knapp, verständlich und wahrt die Intensität.
- source_word: ἐσυκοφάντησέ με
  choice: beschuldigte mich fälschlich
  rationale: Das Verb umfasst verleumderische, falsche Beschuldigung. Im narrativen Zusammenhang ist »beschuldigte mich fälschlich« präziser als das allgemeinere »verleumdete mich«.
- source_word: ἐν οἴκῳ τοῦ σκότους
  choice: im Haus der Finsternis
  rationale: Die bildhafte Bezeichnung des Gefängnisses wird formal bewahrt und nicht zum bloßen Wort »Kerker« verflacht.
- source_word: διὰ προφάσεως ἀπηλλάγην
  choice: weil ich durch ihren Vorwand ... befreit worden war
  rationale: πρόφασις kann Vorwand oder vorgeschobenen Grund bezeichnen. Gemeint ist paradox, dass ihre falsche Beschuldigung zum Mittel wurde, durch das Josef ihrem Zugriff entkam.
theological_decisions:
- issue: Bezug von διὰ τὸν Κύριόν μου in 7,7
  choice: »wegen meines Herrn« mit großgeschriebenem »Herrn« und erläuternder Fußnote
  alternative: »wegen meines Herrn/Gebieters« als Bezug auf den menschlichen Herrn Josefs
  rationale: Der folgende Bericht über das Gebet zum Herrn und das Lob Gottes stützt den Gottesbezug. Da κύριος sprachlich auch einen menschlichen Herrn bezeichnen kann, wird die mögliche Mehrdeutigkeit in der Fußnote nicht verschwiegen.
- issue: Moralpsychologische Aussage in 7,8
  choice: Das böse Verlangen versklavt und verzerrt die Deutung selbst guter Worte
  alternative: Der Satz beschreibt ausschließlich das einmalige Missverständnis der Ägypterin
  rationale: Die allgemeine Formulierung »wenn jemand« macht aus ihrem Verhalten ein grundsätzliches Mahnwort, während »wie auch sie« den konkreten Erzählzusammenhang erhält.
- issue: Josefs Freude über seine Befreiung in 8,5
  choice: Die falsche Anschuldigung wird paradoxerweise als Anlass seiner Befreiung vom Zugriff der Frau verstanden
  alternative: πρόφασις neutral als bloßer »Anlass« ohne Hinweis auf den vorgeschobenen Grund wiederzugeben
  rationale: »Vorwand« entspricht der verleumderischen Handlung im unmittelbaren Kontext und erhält die Spannung, dass Josef Gott auch in der Haft für die dadurch bewirkte Befreiung preist.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem testamentarischem Erzählton. Direkte sexuelle und gewaltsame Handlungen werden klar, aber nicht sensationsheischend benannt. Bildhafte Wendungen wie »Haus der Finsternis« sowie die Gebetsgebärde bleiben erhalten. Die Verszählung kennzeichnet den Übergang von Kapitel 7 zu Kapitel 8 ausdrücklich.
