  text: Ποσάκις²² καίπερ ἀσθενοῦσα κατῄει ⌜πρός με⌝ ἐν ἀωρίᾳ²³, καὶ ἤκουσε²⁴ τῆς φωνῆς μου προσευχομένου²⁵, *καὶ ἐγὼ συνίων²⁶ *τοὺς στεναγμούς²⁷ ἐσιώπων²⁸.
