base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/004.yaml
  text: How often, though she was sick, she came down to me at an untimely hour, and heard my voice as I prayed; and I, understanding her groanings, kept silent.
translation:
  language: de
  text: Wie oft kam sie, obwohl sie krank war, zu ungelegener Stunde zu mir hinab und hörte meine Stimme, während ich betete; und ich verstand ihre Seufzer und schwieg.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ποσάκις
  choice: Wie oft
  rationale: Bewahrt den ausrufenden beziehungsweise rückblickend betonten Sinn des griechischen Adverbs.
- source_word: καίπερ ἀσθενοῦσα
  choice: obwohl sie krank war
  rationale: Gibt das konzessive Partizip natürlich und genau wieder.
- source_word: κατῄει πρὸς με
  choice: kam sie zu mir hinab
  rationale: κατῄει bezeichnet eine Bewegung nach unten; die räumliche Angabe bleibt erhalten, ohne den Schauplatz näher festzulegen.
- source_word: ἐν ἀωρίᾳ
  choice: zu ungelegener Stunde
  rationale: Drückt eine unpassende oder ungewöhnliche Zeit aus, ohne zwingend auf eine bestimmte Tageszeit einzuengen.
- source_word: τῆς φωνῆς μου προσευχομένου
  choice: meine Stimme, während ich betete
  rationale: Löst die Genitivkonstruktion idiomatisch auf und wahrt, dass sie Josephs Stimme beim Gebet hörte.
- source_word: συνίων τοὺς στεναγμούς
  choice: der ihre Seufzer verstand
  rationale: συνίων bezeichnet ein begreifendes Wahrnehmen; das im Kontext naheliegende feminine Possessivpronomen wird im Deutschen zur Klarheit ergänzt.
- source_word: ἐσιώπων
  choice: schwieg
  rationale: Schlichte Wiedergabe des imperfektischen Verbs; im erzählenden Deutsch kann das Präteritum sowohl den Zustand als auch das wiederholte Verhalten tragen.
theological_decisions:
- issue: Motiv oder Inhalt der Seufzer
  choice: ihre Seufzer verstand
  alternative: ihre Absichten aus den Seufzern erkannte
  rationale: Der griechische Text nennt nur das Verstehen der Seufzer. Eine nähere moralische oder psychologische Deutung wird nicht in den Haupttext eingetragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an die griechische Satzstruktur. Die etwas markierte Wendung „zu mir hinab“ bewahrt die Bewegungsrichtung des Originals; „zu ungelegener Stunde“ erhält die zeitliche Unbestimmtheit von ἀωρία.
