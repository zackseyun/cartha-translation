revisions:
- from: Denn wenn ich in ihrem Haus war, entblößte sie ihre Arme und Beine, damit ich mich auf sie einließe.[a] Sie war nämlich sehr schön, besonders wenn sie sich schmückte, um mich zu verführen. Doch der Herr bewahrte mich vor ihren Anschlägen.
  to: Denn wenn ich in ihrem Haus war, entblößte sie ihre Arme und Beine, damit ich mich auf sie einließe.[a] Sie war nämlich sehr schön, besonders geschmückt, um mich zu verführen. Doch der Herr bewahrte mich vor ihren Nachstellungen.
  rationale: Die Revision beseitigt die für ἐγχειρήματα zu starke Wiedergabe „Anschläge“, gibt das griechische Partizip κοσμουμένη ohne zusätzliche temporale Ausdeutung wieder und formuliert die erläuternde Fußnote zur bildhaften Wendung vorsichtiger. Bedeutung, Register und Ambiguität des Ausgangstextes bleiben gewahrt.
