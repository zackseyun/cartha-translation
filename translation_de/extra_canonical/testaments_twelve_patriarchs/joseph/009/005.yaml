base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/005.yaml
  text: For when I was in her house, she would uncover her arms and her legs, so that I might fall into her. For she was very beautiful, especially adorned to deceive me. But the Lord guarded me from her schemes.
translation:
  language: de
  text: Denn wenn ich in ihrem Haus war, entblößte sie ihre Arme und Beine, damit ich mich auf sie einließe.[a] Sie war nämlich sehr schön, besonders geschmückt, um mich zu verführen. Doch der Herr bewahrte mich vor ihren Nachstellungen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „damit ich auf sie fiele“; im Kontext ist wohl gemeint, dass er sich auf ihre sexuelle Annäherung einlassen sollte.'
    reason: Die griechische Wendung συμπέσω εἰς αὐτήν ist bildhaft und wörtlich im Deutschen missverständlich. Die Anmerkung dokumentiert die Formulierung und erläutert vorsichtig den kontextuellen Sinn.
lexical_decisions:
- source_word: ἐγύμνου
  choice: entblößte sie
  rationale: Das Imperfekt bezeichnet ein wiederholtes oder andauerndes Verhalten; „entblößen“ gibt das gezielte Freilegen der Arme und Beine würdig und präzise wieder.
- source_word: τοὺς βραχίονας … καὶ τὰς κνήμας
  choice: ihre Arme und Beine
  rationale: βραχίων bezeichnet den Arm, κνήμη genauer den Unterschenkel bzw. das Schienbein; im natürlichen Deutschen fasst „Beine“ den gemeinten Körperbereich verständlich zusammen.
- source_word: συμπέσω εἰς αὐτήν
  choice: mich auf sie einließe
  rationale: Die ungewöhnliche Wendung drückt hier im Kontext das Eingehen auf ihre sexuelle Annäherung aus. Die Übersetzung wahrt die Zielrichtung, ohne im Deutschen eine irreführend wörtliche räumliche Formulierung zu erzeugen.
- source_word: ὡραία πάνυ
  choice: sehr schön
  rationale: Gibt die starke Hervorhebung ihrer Schönheit schlicht und natürlich wieder.
- source_word: μάλιστα κοσμουμένη
  choice: besonders wenn sie sich schmückte
  rationale: Das Partizip bezeichnet ihr Sich-Schmücken bzw. Sich-Zurechtmachen; die temporale Wiedergabe ist im Deutschen natürlich und erhält den Bezug auf ihre besonders wirkungsvolle Erscheinung.
- source_word: πρὸς ἀπάτην μου
  choice: um mich zu verführen
  rationale: ἀπάτη bedeutet Täuschung oder Verführung. Im eindeutig erotischen Zusammenhang trifft „verführen“ die beabsichtigte Wirkung, während „mich“ den objektiven Genitiv idiomatisch wiedergibt.
- source_word: ἐγχειρημάτων
  choice: Anschlägen
  rationale: Das Wort bezeichnet Unternehmungen oder Versuche gegen jemanden; „Anschläge“ vermittelt ihre gezielten Nachstellungen, ohne sie auf einen einzelnen Versuch zu beschränken.
theological_decisions:
- issue: Göttliche Bewahrung und menschliche Versuchung
  choice: „der Herr bewahrte mich“
  alternative: „der Herr schützte mich“
  rationale: „Bewahrte“ entspricht ἐφύλαξέ näher und lässt offen, auf welche Weise Gottes Schutz mit Josephs eigenem Widerstand zusammenwirkte.
- issue: Art des beabsichtigten Fallens
  choice: „damit ich mich auf sie einließe“ mit Fußnote zur wörtlichen Form
  alternative: „damit ich auf sie fiele“
  rationale: Der Kontext spricht von sexueller Verführung. Die Hauptübersetzung vermittelt diesen Sinn natürlich; die Fußnote bewahrt die auffällige Bildlichkeit und mögliche Mehrdeutigkeit des griechischen Ausdrucks.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau folgt dem argumentativen Zusammenhang des Griechischen, wird aber idiomatisch geglättet. Das wiederholte Verhalten wird durch „wenn … war“ und das Imperfekt „entblößte“ ausgedrückt. Die erotische Aussage bleibt deutlich, jedoch nicht unnötig explizit.
