reference: Testament of Joseph 9:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ ὡς²³ ἤμην ἐν τοῖς δεσμοῖς²⁴, ἡ Αἰγυπτία συνείχετο²⁵ ἀπὸ τῆς λύπης· ἐλθοῦσα δὲ ἐπηκροᾶτό μου πῶς ηὐχαρίστουν τῷ Κυρίῳ καὶ ὕμνουν ἐν οἴκῳ *τοῦ σκότους²⁶, καὶ ἔχαιρον ἐν *ἱλαρᾷ φωνῇ²⁷ δοξάζων τὸν Θεόν μου, ὅτι διὰ προφάσεως ἀπηλλάγην²⁸ τῆς Αἰγυπτίας.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/001.yaml
  text: And while I was in chains, the Egyptian woman was held together by grief; and when she came, she would listen in on me, how I gave thanks to the Lord and sang hymns in the house of darkness, and rejoiced with a cheerful voice, glorifying my God, because by a pretext I had been delivered from the Egyptian woman.
translation:
  language: de
  text: Und als ich in Fesseln lag, wurde die Ägypterin von Kummer überwältigt. Sie kam und lauschte mir, wie ich dem Herrn dankte und im Haus der Finsternis Loblieder sang; und mit fröhlicher Stimme pries ich voller Freude meinen Gott, weil ich durch einen Vorwand von der Ägypterin befreit worden war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν τοῖς δεσμοῖς
  choice: in Fesseln
  rationale: Gibt die konkrete Gefangenschaft natürlich und würdig wieder; gegenüber dem allgemeineren „im Gefängnis“ bleibt das Bild des Gebundenseins erhalten.
- source_word: συνείχετο ἀπὸ τῆς λύπης
  choice: wurde von Kummer überwältigt
  rationale: συνέχω bezeichnet hier ein starkes Ergriffen- oder Bedrängtsein; die idiomatische deutsche Formulierung vermeidet das unnatürliche wörtliche „wurde zusammengehalten“.
- source_word: ἐπηκροᾶτό μου
  choice: lauschte mir
  rationale: Bewahrt den Sinn aufmerksamen Hörens und lässt offen, ob es heimlich geschah; „belauschte mich“ wäre stärker und eindeutiger als das Griechische.
- source_word: ὕμνουν
  choice: Loblieder sang
  rationale: Bringt den hymnischen Gotteslobcharakter des Verbs in verständlichem modernem Deutsch zum Ausdruck.
- source_word: ἐν οἴκῳ τοῦ σκότους
  choice: im Haus der Finsternis
  rationale: Erhält die bildhafte, möglicherweise traditionelle Bezeichnung wörtlich, statt sie auf „Gefängnis“ zu reduzieren.
- source_word: ἐν ἱλαρᾷ φωνῇ
  choice: mit fröhlicher Stimme
  rationale: Entspricht dem positiven, heiteren Klang von ἱλαρός und bleibt nahe an der griechischen Ausdrucksweise.
- source_word: διὰ προφάσεως
  choice: durch einen Vorwand
  rationale: 'Bewahrt die auffällige und mehrdeutige Kausalformulierung: Die Anschuldigung beziehungsweise der vorgeschobene Anlass führte paradoxerweise zur Trennung von der Frau.'
- source_word: ἀπηλλάγην
  choice: befreit worden war
  rationale: Das Passiv gibt die erfahrene Befreiung wieder, ohne einen ausdrücklich nicht genannten Handelnden einzusetzen.
theological_decisions:
- issue: Ursprung und Mittel der Befreiung
  choice: „weil ich durch einen Vorwand von der Ägypterin befreit worden war“
  alternative: „weil Gott mich durch einen Vorwand von der Ägypterin befreit hatte“
  rationale: Das Griechische nennt Gott als Gegenstand des Lobpreises, bezeichnet ihn aber in diesem Teilsatz nicht ausdrücklich als handelndes Subjekt. Die Übersetzung ergänzt daher keine theologische Kausalzuweisung.
- issue: Bedeutung des „Hauses der Finsternis“
  choice: Bildhafte Wendung beibehalten
  alternative: „im Gefängnis“
  rationale: Die Metapher kann mehr als den bloßen Haftort anklingen lassen. Ihre Beibehaltung wahrt die sprachliche und mögliche theologische Spannung.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Satzstruktur wurde behutsam gegliedert, während Wiederholung, Kontrast und paradoxe Befreiungsaussage des griechischen Textes erhalten bleiben.
