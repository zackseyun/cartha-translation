  terminology: „Herr“, „Loblieder“, „Haus der Finsternis“ und „mein Gott“ sind treffend und registergerecht. „Ägypterin“ folgt der im Text verwendeten Bezeichnung; „Vorwand“ bewahrt die auffällige Ambiguität von προφάσει.
