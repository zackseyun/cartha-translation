  source_fidelity: 'Die Übersetzung gibt den griechischen Text vollständig und sachgerecht wieder: die Haft („in Fesseln“), das Bedrängtsein der Ägypterin durch Kummer, ihr aufmerksames Zuhören, Danksagung und Hymnengesang im „Haus der Finsternis“, die fröhliche Stimme sowie die Befreiung „durch einen Vorwand“. Insbesondere wird bei διὰ προφάσεως keine im Griechischen nicht explizit genannte göttliche Handlung ergänzt.'
