base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/003.yaml
  text: But if one lives in self-control and also desires glory, and the Most High knows that it is beneficial, he grants these things also to him, as also to me.
translation:
  language: de
  text: Wenn aber jemand in Selbstbeherrschung lebt und auch nach Ehre verlangt und der Höchste weiß, dass es zuträglich ist, gewährt er auch ihm diese Dinge, ebenso wie mir.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνῃ
  choice: Selbstbeherrschung
  rationale: Der Ausdruck bezeichnet hier ein sittlich besonnenes, besonders von Selbstkontrolle geprägtes Leben; „Selbstbeherrschung“ ist im Deutschen klar und kontextgerecht.
- source_word: δόξαν
  choice: Ehre
  rationale: δόξα meint in diesem Zusammenhang eher verliehenes Ansehen bzw. Ehre als göttliche „Herrlichkeit“.
- source_word: συμφέρει
  choice: zum Guten dient
  rationale: Gibt den Gedanken des Förderlichen oder Zuträglichen natürlich wieder, ohne einen bloßen praktischen Nutzen zu unterstellen.
- source_word: παρέχει
  choice: gewährt
  rationale: Entspricht dem Sinn eines von Gott verliehenen Gutes und bewahrt den gehobenen Ton.
- source_word: ταῦτα
  choice: dies
  rationale: Das griechische Demonstrativ steht formal im Plural, verweist im Satz aber zusammenfassend auf das zuvor genannte Gut; idiomatisches Deutsch verwendet hier den Singular „dies“.
theological_decisions:
- issue: Bezug von συμφέρει
  choice: „dass sie ihm zum Guten dient“ bezieht sich auf die begehrte Ehre
  alternative: 'Unpersönlich: „dass es gut ist“ oder weiter gefasst auf mehrere Dinge bezogen'
  rationale: Der nächstliegende inhaltliche Bezug ist δόξαν; die feminine Form „sie“ macht diesen Bezug im Deutschen verständlich, ohne eine zusätzliche theologische Aussage einzutragen.
- issue: Art der göttlichen Gabe
  choice: Der Höchste gewährt Ehre nur, wenn sie dem Menschen zum Guten dient
  alternative: Ehre wird als grundsätzliches Zeichen göttlicher Zustimmung verstanden
  rationale: Die Bedingung συμφέρει wird ausdrücklich bewahrt; der Text setzt Ehre nicht uneingeschränkt mit göttlicher Anerkennung gleich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, wird aber durch einen klaren pronominalen Bezug idiomatisch gestaltet.
