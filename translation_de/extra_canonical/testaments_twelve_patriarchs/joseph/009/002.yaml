source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Πολλάκις δὲ¹ ἔπεμψε πρός με λέγουσα². Εὐδόκησον³ ⸀πληρῶσαι τὴν ἐπιθυμίαν⸀ μου, καὶ λύω⁴ σε ἐκ⁵ τῶν δεσμῶν, ⸀καὶ ἀπαλλάξω σε ἐκ⁶ τοῦ σκότους⸀. *Ἐγὼ δὲ οὐδὲ⁷ ἕως⁸ ἐννοίας⁹ ἐξέκλινα¹⁰ πρὸς αὐτήν· *ὁ γὰρ θεὸς ἀγαπᾷ¹¹ μᾶλλον τὸν¹² ἐν¹³ λάκκῳ σκότους †πιστὸν¹⁴ ἐν σωφροσύνῃ¹⁵, ἢ τὸν ἐν ταμείοις †βασιλέα¹⁶ τρυφῶντα μετ’ ἀκολασίας.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009/002.yaml
  text: Many times she sent to me, saying, “Consent to fulfill my desire, and I will release you from your chains, and I will free you from the darkness.” But I did not turn even in thought toward her; for God loves more the one who is faithful in self-control in a pit of darkness than the one who, as a king in storerooms, lives in luxury with lawlessness.
translation:
  language: de
  text: 'Oft ließ sie mir sagen: „Willige ein, mein Verlangen zu erfüllen, dann löse ich dich von deinen Fesseln und befreie dich aus der Finsternis.“ Ich aber wandte mich ihr nicht einmal in Gedanken zu. Denn Gott liebt den, der in einer finsteren Grube in Selbstbeherrschung treu bleibt, mehr als den, der als König in Vorratskammern in Zügellosigkeit schwelgt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die Wörter „treu“ und „König“ sind im griechischen Editionstext als textkritisch unsicher gekennzeichnet. Wörtlicher lautet der Vergleich etwa: „den in einer Grube der Finsternis in Selbstbeherrschung Treuen“ und „den in Vorratskammern als König in Zügellosigkeit Schwelgenden“.'
    reason: Macht die Unsicherheit der mit Kreuzen markierten griechischen Lesarten sowie die ungewöhnliche Bildsprache transparent.
lexical_decisions:
- source_word: Εὐδόκησον
  choice: Willige ein
  rationale: Gibt die Aufforderung zur Zustimmung natürlich wieder, ohne bereits die Handlung selbst auszudrücken.
- source_word: ἐπιθυμίαν
  choice: Verlangen
  rationale: Bewahrt die im Kontext sexuelle, im Wort selbst jedoch allgemeinere Bedeutung von Begehren bzw. Verlangen.
- source_word: σωφροσύνῃ
  choice: besonnen bleibt
  rationale: Der Begriff umfasst Selbstbeherrschung, Besonnenheit und hier besonders sexuelle Enthaltsamkeit; die Formulierung verbindet ihn natürlich mit πιστόν.
- source_word: τρυφῶντα
  choice: schwelgt
  rationale: Drückt ein luxuriöses, genussorientiertes Leben knapp und idiomatisch aus.
- source_word: ἀκολασίας
  choice: zügellos lebt
  rationale: Gibt den Gegensatz zu σωφροσύνη als fehlende Selbstbeherrschung und sittliche Zügellosigkeit wieder.
theological_decisions:
- issue: Aussage, dass Gott den einen „mehr liebt“ als den anderen
  choice: Gott liebt ... mehr als ...
  alternative: Gott schätzt ... höher als ...
  rationale: Die zugespitzte Aussage des griechischen ἀγαπᾷ μᾶλλον wird bewahrt und nicht zugunsten einer theologischen Harmonisierung abgeschwächt.
- issue: Textkritisch markierte Wörter πιστόν und βασιλέα
  choice: treu ... als König
  alternative: ohne ausdrückliche Wiedergabe von „treu“ oder „König“
  rationale: Beide im Editionstext überlieferten Lesarten werden im Haupttext übersetzt; ihre textkritische Unsicherheit wird in der Fußnote offengelegt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede bleibt klar und eindringlich; die sprichwortartig zugespitzte Begründung wird natürlich formuliert, ohne die theologische Spannung von „mehr lieben“ einzuebnen.
