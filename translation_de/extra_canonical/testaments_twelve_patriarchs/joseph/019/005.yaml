source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ¹⁸ μετὰ ταῦτα ἑώρων *καὶ ἰδοὺ¹⁵ δώδεκα βόες θηλάζοντες¹⁹ μίαν δάμαλιν, ἢ ἐκ²⁰ . . . γάλακτος θάλασσαν ἐποίει καὶ ἔπινον ἐξ αὐτοῦ²¹ αἱ δώδεκα ποίμναι καὶ ἀνηρίθμητα ποίμνια.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/005.yaml
  text: And after these things I saw, and behold, twelve bulls suckling one heifer, and it made a sea of milk, and the twelve flocks and innumerable flocks drank from it.
translation:
  language: de
  text: 'Danach sah ich, und siehe: Zwölf Rinder saugten an einer Färse; [sie] machte aus [ihrer] Milch ein Meer, und die zwölf Herden und unzählige Herden tranken daraus.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text ist zwischen ἐκ („aus“) und γάλακτος („Milch“) lückenhaft. Die in eckigen Klammern ergänzten Bezüge auf die Färse und ihre Milch sind eine naheliegende Rekonstruktion, aber nicht sicher überliefert.
    reason: Die Fußnote verankert die textkritische Unsicherheit genau an der betroffenen Klausel und verhindert, dass die Ergänzungen als gesicherter Wortlaut gelesen werden.
lexical_decisions:
- source_word: μετὰ ταῦτα
  choice: danach
  rationale: Gibt die zeitliche Abfolge natürlich und präzise wieder.
- source_word: δώδεκα βόες
  choice: zwölf Stiere
  rationale: Im Kontext des Saugens an einer weiblichen δάμαλις bezeichnet βόες hier männliche Rinder; „Stiere“ bewahrt den bildhaften Kontrast.
- source_word: θηλάζοντες
  choice: saugten an
  rationale: Das Partizip beschreibt das Trinken von Milch unmittelbar am Muttertier.
- source_word: μίαν δάμαλιν
  choice: einer einzigen jungen Kuh
  rationale: δάμαλις bezeichnet eine junge weibliche Kuh; „einzigen“ hebt μίαν gegenüber den zwölf Stieren hervor.
- source_word: γάλακτος θάλασσαν ἐποίει
  choice: Sie ließ ein Meer aus Milch entstehen
  rationale: Gibt die ungewöhnliche, wahrscheinlich auf die junge Kuh bezogene Hervorbringung idiomatisch wieder, ohne die Metapher abzuschwächen.
- source_word: ποίμναι / ποίμνια
  choice: Herden / weitere Herden
  rationale: Die beiden verwandten griechischen Wörter bezeichnen Tierherden; „weitere“ macht kenntlich, dass die unzähligen Herden zu den zwölf hinzukommen.
- source_word: ἔπινον ἐξ αὐτοῦ
  choice: tranken daraus
  rationale: Das Pronomen bezieht sich grammatisch auf das neutrale Bild vom Milchmeer beziehungsweise dessen Inhalt; „daraus“ bleibt im Deutschen natürlich.
theological_decisions:
- issue: Identität derjenigen, die das Milchmeer hervorbringt
  choice: „Sie“ bezieht den Vorgang auf die junge Kuh.
  alternative: 'Unpersönlich: „Es entstand ein Meer aus Milch“ oder „es machte ein Meer aus Milch“.'
  rationale: Das überlieferte ἐποίει verlangt ein Subjekt, während der textkritisch beschädigte Abschnitt vor γάλακτος die Konstruktion unsicher macht. Die junge Kuh ist im unmittelbaren Bild die naheliegendste Handelnde; die Formulierung „ließ … entstehen“ vermeidet eine unnötig mechanische Deutung.
translation_notes:
  register: Moderne, würdige Erzählsprache. Der präsentierende Ausruf „und siehe“ bleibt als charakteristisches Visionselement erhalten; der Gedankenstrich unterstützt die natürliche deutsche Lesbarkeit.
