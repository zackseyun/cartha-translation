lexical_decisions:
- source_word: ἔχαιρον
  choice: freuten sich
  rationale: Gibt den durativen bzw. fortlaufenden Sinn des Imperfekts in natürlichem Deutsch wieder, ohne unnötige Zusatzdeutung.
- source_word: ἐπ᾽ αὐτῷ
  choice: über ihn
  rationale: Die Verbindung ἐπί mit Dativ bezeichnet hier den Anlass bzw. Gegenstand der Freude; „über ihn“ bewahrt den Personenbezug.
- source_word: οἱ ἄγγελοι καὶ οἱ ἄνθρωποι
  choice: die Engel und die Menschen
  rationale: Formale und zugleich idiomatische Wiedergabe der beiden ausdrücklich genannten Gruppen.
- source_word: πᾶσα ἡ γῆ
  choice: die ganze Erde
  rationale: Bewahrt die umfassende, personifizierende Aussage des griechischen Textes.
theological_decisions:
- issue: Personifizierung der Erde
  choice: „die ganze Erde freute sich“
  alternative: „alle auf der Erde freuten sich“
  rationale: Der Ausgangstext nennt ausdrücklich die ganze Erde und nicht deren Bewohner; die poetisch-kosmische Spannung bleibt daher erhalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; die wiederholte Konjunktion „und“ bildet die additive Struktur des griechischen Satzes ab.
