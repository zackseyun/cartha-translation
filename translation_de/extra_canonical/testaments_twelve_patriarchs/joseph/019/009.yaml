  source_fidelity: Die Übersetzung gibt den griechischen Satz vollständig und in der ursprünglichen Reihenfolge wieder. Das Imperfekt ἔχαιρον ist mit „freuten sich“ angemessen als vergangene, andauernde Freude wiedergegeben; ἐπ᾽ αὐτῷ bedeutet hier treffend „über ihn“. Die kosmisch-personifizierende Aussage von πᾶσα ἡ γῆ bleibt erhalten.
  naturalness: „Und die Engel und die Menschen und die ganze Erde freuten sich über ihn“ ist verständliches, würdevolles modernes Standarddeutsch. Die wiederholten „und“ sind leicht feierlich, aber als bewusste Entsprechung der griechischen Reihung natürlich und passend.
  terminology: „Engel“, „Menschen“ und „ganze Erde“ sind präzise und theologisch nicht überdeutet. Insbesondere wird γῆ nicht unzulässig auf deren Bewohner eingeschränkt.
