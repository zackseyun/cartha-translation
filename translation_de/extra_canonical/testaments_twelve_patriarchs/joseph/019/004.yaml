  rationale: Die Revision glättet ausschließlich die deutsche Syntax und stellt die Reihung des griechischen Satzes enger wieder her. Sie erhält die vorsichtige textkritische Fußnote, den Vergleichscharakter von ὡς und alle bildhaften Zahlenangaben.
