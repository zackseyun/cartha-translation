source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἐκεῖ ἐβόησαν πρὸς Κύριον μέχρι οὐ συνήχθησαν *πρὸς αὐτοὺς¹⁷ οἱ ἐννέα ἔλαφοι καὶ ἐγίνοντο αὐτοὶ ὡς δώδεκα πρόβατα, καὶ μετ’ ὀλίγον χρόνον ηὐξάνοντο καὶ ἐγίνοντο ποίμνια πολλά.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/004.yaml
  text: And there they cried out to the Lord until the nine deer were gathered to them, and they themselves became like twelve sheep; and after a little time they increased and became many flocks.
translation:
  language: de
  text: Und dort schrien sie zum Herrn, bis die neun Hirsche zu ihnen zusammengeführt worden waren[a], und sie selbst wurden wie zwölf Schafe; nach kurzer Zeit vermehrten sie sich und wurden zu vielen Herden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Überlieferung ist an dieser Stelle unsicher; der edierte Text liest sinngemäß: „bis die neun Hirsche zu ihnen zusammengeführt worden waren“.'
    reason: Der textkritische Verweis bei πρὸς αὐτούς wird kenntlich gemacht, ohne eine nicht näher spezifizierte Variante in den Haupttext einzutragen.
lexical_decisions:
- source_word: ἐβόησαν πρὸς Κύριον
  choice: schrien sie zum Herrn
  rationale: Gibt den eindringlichen Hilferuf des Verbs βοάω natürlich und kräftig wieder; der artikellose Gottesname Κύριον wird im Kontext als „der Herr“ verstanden.
- source_word: οἱ ἐννέα ἔλαφοι
  choice: die neun Hirsche
  rationale: ἔλαφοι bezeichnet Hirsche beziehungsweise Rotwild; „Hirsche“ bewahrt das Bild und entspricht dem grammatischen Maskulinum.
- source_word: ἐγίνοντο αὐτοὶ ὡς δώδεκα πρόβατα
  choice: Da wurden sie selbst wie zwölf Schafe
  rationale: Bewahrt sowohl das betonte αὐτοί („sie selbst“) als auch den ausdrücklich vergleichenden Charakter von ὡς („wie“), ohne eine vollständige Verwandlung festzulegen.
- source_word: ποίμνια πολλά
  choice: viele Herden
  rationale: ποίμνιον meint eine Herde, besonders eine Schafherde; der Plural wird knapp und bildgetreu wiedergegeben.
theological_decisions:
- issue: Art des Werdens der zwölf Schafe
  choice: „wurden sie selbst wie zwölf Schafe“
  alternative: „wurden sie selbst zu zwölf Schafen“
  rationale: Das griechische ὡς markiert einen Vergleich. Die Übersetzung lässt offen, ob die Vision eine symbolische Gleichsetzung, eine Erscheinungsweise oder eine Verwandlung beschreibt.
- issue: Bezug der neun Hirsche
  choice: „zu ihnen versammelt“
  alternative: „gegen sie zusammengerufen“
  rationale: Die im edierten Text gebotene Lesart πρὸς αὐτούς wird als räumlich-soziale Hinzufügung verstanden und stimmt mit dem Übergang zu insgesamt zwölf Schafen überein; die textliche Unsicherheit wird in der Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Bildsprache. Die Satzfolge wurde leicht gegliedert, um die Entwicklung der Vision verständlich zu machen, während Wiederholungen und symbolische Spannung erhalten bleiben.
