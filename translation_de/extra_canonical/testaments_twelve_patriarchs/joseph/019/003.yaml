source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἑώρων ὅτι τρεῖς¹⁴ ἔλαφοι τρεῖς ἀμνοὶ ἐγίνοντο καὶ ἐβόησαν πρὸς Κύριον καὶ ἐξήγαγε αὐτοὺς Κύριος¹⁵ εἰς τόπον εὐθαλῆ καὶ ἔνυδρον, καὶ ἤγαγε¹⁶ αὐτοὺς ἐκ σκότους εἰς φῶς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/003.yaml
  text: And I saw that the three deer became three lambs, and they cried out to the Lord, and the Lord brought them out to a flourishing and well-watered place, and brought them from darkness into light.
translation:
  language: de
  text: Und ich sah, dass die drei Hirsche zu drei Lämmern wurden. Sie schrien zum Herrn, und der Herr führte sie hinaus an einen üppigen und wasserreichen Ort und führte sie aus der Finsternis ins Licht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαφοι
  choice: Hirsche
  rationale: Die direkte und im Kontext natürliche Wiedergabe des griechischen Plurals; das Geschlecht der Tiere wird im Deutschen nicht eigens präzisiert.
- source_word: ἀμνοὶ
  choice: Lämmer
  rationale: Entspricht dem griechischen Ausdruck für junge Schafe und bewahrt die Bildsprache.
- source_word: ἐβόησαν πρὸς Κύριον
  choice: sie schrien zum Herrn
  rationale: Gibt den nachdrücklichen Hilferuf von ἐβόησαν sowie die Ausrichtung πρὸς Κύριον knapp und natürlich wieder.
- source_word: ἐξήγαγε
  choice: führte sie hinaus
  rationale: Bewahrt die Herausführungsbewegung des Verbs; im Zielausdruck wird im Deutschen idiomatisch „an einen Ort“ verwendet.
- source_word: εὐθαλῆ καὶ ἔνυδρον
  choice: üppigen und wasserreichen
  rationale: εὐθαλής bezeichnet üppiges Gedeihen, ἔνυδρος einen wasserreichen Ort; beide Merkmale bleiben unterschieden.
- source_word: ἐκ σκότους εἰς φῶς
  choice: aus der Finsternis ins Licht
  rationale: Formnahe und im Deutschen geläufige Wiedergabe der kontrastierenden Bewegungsrichtung.
theological_decisions:
- issue: Deutung der Verwandlung und der Bewegung aus der Finsternis ins Licht
  choice: Die Bildsprache bleibt ohne erklärende theologische Auslegung stehen.
  alternative: Die Bilder ausdrücklich als Bekehrung, Rettung oder Wiederherstellung deuten.
  rationale: Der griechische Text benennt die symbolische Bedeutung in diesem Vers nicht; eine Festlegung würde die vorhandene Offenheit unzulässig auflösen.
- issue: Wiedergabe von Κύριος ohne Artikel
  choice: „der Herr“
  alternative: „Herr“ oder eine ausdrückliche Gottesbezeichnung
  rationale: Im Deutschen ist „der Herr“ die natürliche Gottesbezeichnung in diesem Gebets- und Rettungskontext, ohne über den griechischen Wortlaut hinaus eine spezifischere Identifikation einzuführen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzteilung erhöht die Verständlichkeit, ohne die Abfolge der Vision zu verändern. Die Wiederholung von „führte“ spiegelt die beiden griechischen Führungs- bzw. Herausführungsverben und verbindet den konkreten Ortswechsel mit dem Bild von Finsternis und Licht.
