source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἑώρων *μόσχον ὃς δωδεκάκις περιέβαλλε αὐτούς²⁴, καὶ ἐγένετο²⁵ τοῖς βουσὶ ὁλοκλήρως (?) εἰς βοήθειαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/007.yaml
  text: And I saw a calf that encircled them twelve times, and it became wholly a help to the bulls.
translation:
  language: de
  text: Und ich sah ein Kalb, das sie zwölfmal umkreiste; und es wurde den Stieren in jeder Hinsicht zur Hilfe.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Lesart bei „in jeder Hinsicht“ ist im griechischen Text unsicher.
    reason: Die Edition kennzeichnet ὁλοκλήρως mit einem Fragezeichen; diese textkritische Unsicherheit sollte sichtbar bleiben.
lexical_decisions:
- source_word: μόσχον
  choice: Kalb
  rationale: Die übliche und im Bildzusammenhang natürliche Wiedergabe des jungen Rindes.
- source_word: δωδεκάκις
  choice: zwölfmal
  rationale: Gibt die ausdrücklich genannte Zahl der Umkreisungen direkt wieder.
- source_word: περιέβαλλε
  choice: umkreiste
  rationale: Passt zur räumlichen Bewegung um die zuvor genannten Gestalten und bewahrt den fortdauernden Aspekt der griechischen Imperfektform.
- source_word: τοῖς βουσὶ
  choice: den Stieren
  rationale: Bewahrt die Tiermetaphorik; im Kontext bezeichnet βοῦς die männlichen Rinder.
- source_word: ὁλοκλήρως
  choice: in jeder Hinsicht
  rationale: Gibt die Vorstellung vollständiger beziehungsweise uneingeschränkter Hilfe idiomatisch wieder, ohne die unsichere Textgestalt zu verdecken.
- source_word: εἰς βοήθειαν
  choice: zur Hilfe
  rationale: Entspricht der griechischen Ziel- oder Ergebniswendung und klingt im Deutschen natürlich.
theological_decisions:
- issue: Identität und symbolische Bedeutung des Kalbes und der Stiere
  choice: Die Tierbilder bleiben ungedeutet.
  alternative: Die Figuren ausdrücklich mit bestimmten Personen, Stämmen oder messianischen Gestalten identifizieren.
  rationale: Der Vers selbst liefert keine explizite Deutung; eine Festlegung würde eine Auslegung in den Text eintragen.
- issue: Art der vollständigen Hilfe
  choice: „in jeder Hinsicht zur Hilfe“
  alternative: „vollkommen zu einer Hilfe“ oder „ganz und gar zur Hilfe“
  rationale: Die gewählte Fassung wahrt die umfassende Aussage, ohne Art oder Wirkung der Hilfe näher zu bestimmen.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Die visionäre Tierbildsprache und die syntaktische Abfolge des Griechischen bleiben erhalten; ein Semikolon trennt die beiden eng verbundenen Aussagen.
