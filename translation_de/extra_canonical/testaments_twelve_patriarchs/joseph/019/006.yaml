base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/006.yaml
  text: And from the fourth bull its horns went up as far as heaven and became like a wall of the flocks, and in the midst of the two horns another horn sprouted.
translation:
  language: de
  text: Und die Hörner des vierten Stiers stiegen bis zum Himmel empor und wurden wie eine Mauer der Herden; und in der Mitte der beiden Hörner spross ein weiteres Horn hervor.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνέβησαν
  choice: ragten … empor
  rationale: Gibt die aufwärtsgerichtete Bewegung der Hörner natürlich und bildhaft wieder, ohne das griechische Bild abzuschwächen.
- source_word: μέχρι τοῦ οὐρανοῦ
  choice: bis zum Himmel
  rationale: Entspricht unmittelbar der räumlichen Grenzangabe des griechischen Textes.
- source_word: ὡς τεῖχος τῶν ποιμνῶν
  choice: wie eine Mauer für die Herden
  rationale: Der Genitiv lässt sich im Deutschen sinnvoll als schützende bzw. zu den Herden gehörende Mauer ausdrücken; „für die Herden“ ist idiomatisch, ohne die Bildaussage näher festzulegen.
- source_word: ἐν μέσῳ τῶν δύο κεράτων
  choice: mitten zwischen den beiden Hörnern
  rationale: Bewahrt sowohl die zentrale Lage als auch die ausdrückliche Zweizahl.
- source_word: ἐξεβλάστησε
  choice: spross … hervor
  rationale: Erhält die botanische Metapher des Verbs und klingt im Deutschen natürlich.
- source_word: ἄλλο κέρας
  choice: ein weiteres Horn
  rationale: „Weiteres“ bezeichnet ein zusätzlich hervorkommendes Horn, ohne unnötig Andersartigkeit zu behaupten.
