base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/001.yaml
  text: Indeed he gave me beauty beyond the handsome men of Israel, and preserved me until old age in strength and in beauty; for I was like Jacob in all things. Now listen, my children, also concerning the dreams that I know about.
translation:
  language: de
  text: Ja, er machte mich schöner als die schönen Männer Israels und bewahrte mich bis ins hohe Alter in Kraft und Schönheit; denn ich war Jakob in allem ähnlich. Hört nun, meine Kinder, auch von den Träumen, von denen ich weiß.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut des letzten Satzteils ist ungewöhnlich und möglicherweise verderbt; wörtlich etwa: „über die Träume, von denen ich weiß“.'
    reason: Macht die sprachlich-textkritische Unsicherheit transparent, ohne sie im Haupttext stillschweigend aufzulösen.
lexical_decisions:
- source_word: ὡραιότητα
  choice: Schönheit
  rationale: Gibt die körperliche Schönheit bzw. anmutige Erscheinung im Kontext natürlich und würdig wieder.
- source_word: ὑπὲρ ὡραίους Ἰσραήλ
  choice: die die schönen Männer Israels übertraf
  rationale: Bewahrt den komparativen Sinn von ὑπέρ und versteht das substantivierte Maskulinum als die schönen bzw. ansehnlichen Männer Israels.
- source_word: ἕως γήρους
  choice: bis ins hohe Alter
  rationale: Idiomatiche deutsche Wiedergabe des zeitlichen Ausdrucks.
- source_word: ὅμοιος ... ἐν πᾶσι τῷ Ἰακώβ
  choice: Jakob in allem ähnlich
  rationale: Folgt eng dem griechischen Vergleich, ohne näher zu bestimmen, worin die Ähnlichkeit bestand.
- source_word: περὶ ὧν ... ἐνυπνίων
  choice: von den Träumen, von denen ich weiß
  rationale: Bewahrt den Plural ἐνυπνίων und gibt die schwierige Konstruktion möglichst quellennah wieder.
theological_decisions:
- issue: Umfang der Ähnlichkeit mit Jakob
  choice: „Jakob in allem ähnlich“ bleibt unqualifiziert stehen.
  alternative: Die Ähnlichkeit ausdrücklich auf Schönheit, Kraft oder Lebensumstände beschränken.
  rationale: Der griechische Text sagt ἐν πᾶσι und erläutert die Reichweite nicht; eine Einschränkung wäre interpretierend.
- issue: Art der Kenntnis der Träume
  choice: „von denen ich weiß“
  alternative: „die ich gesehen habe“ oder „die ich kenne“
  rationale: οἶδα bezeichnet Wissen bzw. Kenntnis, nicht ausdrücklich das Sehen; die ungewöhnliche und möglicherweise textkritisch schwierige Aussage soll nicht harmonisiert werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Anrede „Hört nun, meine Kinder“ bewahrt den testamentarischen Charakter. Der Haupttext bleibt nahe am griechischen Wortlaut, während die Fußnote die Unsicherheit der Schlussklausel offenlegt.
