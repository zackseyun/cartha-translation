source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ὑμεῖς οὖν, τέκνα μου, φυλάξατε τὰς ἐντολὰς Κυρίου, καὶ τιμᾶτε³⁸ τὸν *Λευὶ καὶ τὸν Ἰούδαν³⁹. ὅτι *ἐκ τοῦ σπέρματος⁴⁰ αὐτῶν ἀνατελεῖ ὑμῖν⁴¹ [ὁ ἀμνὸς τοῦ Θεοῦ, ὁ αἴρων τὴν ἁμαρτίαν τοῦ κόσμου]⁴², σώζων [πάντα τὰ ἔθνη καὶ]⁴⁸ τὸν Ἰσραήλ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/011.yaml
  text: Therefore you, my children, keep the commandments of the Lord, and honor Levi and Judah; for from their seed there will arise for you [the lamb of God, who takes away the sin of the world,] saving [all the nations and] Israel.
translation:
  language: de
  text: Darum, meine Kinder, haltet die Gebote des Herrn und ehrt Levi und Juda. Denn aus ihrer Nachkommenschaft wird für euch [das Lamm Gottes aufgehen, das die Sünde der Welt wegnimmt und] [alle Völker und] Israel rettet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: φυλάξατε
  choice: haltet
  rationale: Im Zusammenhang mit Geboten bedeutet das Verb, sie zu bewahren und zu befolgen; „haltet die Gebote“ ist natürliches, würdevolles Deutsch.
- source_word: τιμᾶτε
  choice: ehrt
  rationale: Gibt die Aufforderung zur Anerkennung und Achtung von Levi und Juda unmittelbar wieder.
- source_word: σπέρματος
  choice: Nachkommenschaft
  rationale: Bewahrt den kollektiven genealogischen Sinn von „Samen“, klingt im modernen Deutschen jedoch natürlicher.
- source_word: ἀνατελεῖ
  choice: aufgehen
  rationale: Erhält das Bild des Hervorgehens beziehungsweise Aufgehens, das auch für ein Gestirn oder einen kommenden Herrscher verwendet werden kann.
- source_word: αἴρων
  choice: wegnimmt
  rationale: Gibt die primäre Bedeutung wieder, ohne die mögliche Nuance des Tragens ausdrücklich festzulegen.
- source_word: σώζων
  choice: retten
  rationale: Der griechische Partizipialsatz beschreibt das rettende Wirken des aufgehenden Lammes; die koordinierte deutsche Form vermeidet einen schwerfälligen Anschluss.
theological_decisions:
- issue: Bezug des pluralischen „ihrer Nachkommenschaft“ auf Levi und Juda
  choice: Pluralbezug bewahrt
  alternative: Auflösung in eine einzelne Stammeslinie
  rationale: Das Griechische αὐτῶν bezieht sich grammatisch auf beide Genannten; eine harmonisierende Beschränkung auf Levi oder Juda wäre interpretierend.
- issue: Textkritisch gekennzeichnete christologische und universale Formulierungen
  choice: Eckige Klammern im Haupttext bewahrt
  alternative: Klammern entfernen oder den Text auslassen
  rationale: Die Vorlage kennzeichnet diese Teile als textkritisch unsicher. Die Übersetzung erhält sowohl den überlieferten Wortlaut als auch die Unsicherheit sichtbar.
- issue: Singular „die Sünde der Welt“
  choice: Singular beibehalten
  alternative: „die Sünden der Welt“
  rationale: ἁμαρτίαν steht im Singular und bezeichnet die Sünde als umfassende Wirklichkeit.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die Satzstruktur bleibt quellennah, wird aber für einen natürlichen deutschen Lesefluss leicht geglättet. Die eckigen Klammern der kritischen Vorlage werden unverändert als Kennzeichnung unsicherer Textteile übernommen.
