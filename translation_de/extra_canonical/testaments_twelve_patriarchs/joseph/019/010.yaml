  source_fidelity: 'Der deutsche Text gibt sämtliche Bestandteile des vorgelegten griechischen Textes wieder: Ταῦτα als zusammenfassendes „Dies“, δέ als „aber“, γενήσεται als Futur „wird ... geschehen“, ἐν καιρῷ αὐτῶν als „zu ihrer Zeit“ und ἐν ἐσχάταις ἡμέραις als „in den letzten Tagen“. Der pluralische und im Kontext nicht weiter bestimmte Bezug von αὐτῶν bleibt angemessen offen.'
  naturalness: „Dies aber wird zu ihrer Zeit geschehen, in den letzten Tagen“ ist verständliches, würdevolles modernes Standarddeutsch. Die Stellung von „aber“ ist leicht gehoben, aber für den literarisch-prophetischen Register passend.
  terminology: „Letzte Tage“ ist die etablierte und unmittelbare Wiedergabe von ἐσχάταις ἡμέραις. „Zu ihrer Zeit“ bewahrt die Mehrdeutigkeit von αὐτῶν, ohne eine referentielle Deutung einzutragen. Die Fassung stimmt zudem mit dem aktuellen englischen POB-Audittext überein.
