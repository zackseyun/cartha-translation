base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/010.yaml
  text: But these things will happen in their time, in the last days.
translation:
  language: de
  text: Dies aber wird zu ihrer Zeit geschehen, in den letzten Tagen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα
  choice: Dies
  rationale: Das zusammenfassende deutsche „Dies“ gibt den Rückverweis auf die zuvor genannten Ereignisse natürlich und prägnant wieder.
- source_word: δὲ
  choice: aber
  rationale: Die leicht kontrastierende beziehungsweise weiterführende Funktion der Partikel wird mit „aber“ bewahrt.
- source_word: γενήσεται
  choice: wird … geschehen
  rationale: Das Futur wird ohne zusätzliche modale Bedeutung wiedergegeben; der griechische Text sagt nicht „muss geschehen“.
- source_word: ἐν καιρῷ αὐτῶν
  choice: zu ihrer Zeit
  rationale: „Zeit“ gibt καιρός kontextgerecht wieder, während „ihrer“ den mehrdeutigen Bezug von αὐτῶν erhält.
- source_word: ἐν ἐσχάταις ἡμέραις
  choice: in den letzten Tagen
  rationale: Die geläufige eschatologische Wendung entspricht dem griechischen Ausdruck unmittelbar.
theological_decisions:
- issue: Zeitliche Einordnung der angekündigten Ereignisse
  choice: Sowohl „zu ihrer Zeit“ als auch „in den letzten Tagen“ werden beibehalten.
  alternative: Die Wendung „in den letzten Tagen“ aufgrund einer abweichenden Textüberlieferung auszulassen.
  rationale: Der angegebene griechische Ausgangstext enthält beide Zeitangaben; die Übersetzung folgt dieser vorgelegten Textgestalt, ohne ihr Verhältnis zueinander näher auszudeuten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzstruktur und die mögliche Spannung zwischen „zu ihrer Zeit“ und „in den letzten Tagen“ bleiben erhalten.
