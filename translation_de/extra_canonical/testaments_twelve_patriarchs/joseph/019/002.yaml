  text: Δώδεκα³ ἔλαφοι ἐνέμοντο⁴ *ἐν τόπῳ⁵ καὶ οἱ ἐννέα⁶ διεσπάρησαν *εἰς πᾶσαν τὴν γῆν⁷· ὁμοίως δὲ⁸ καὶ οἱ τρεῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/002.yaml
  text: Twelve deer were feeding in one place, and the nine were scattered over all the earth; and likewise the three also.
translation:
  language: de
  text: Zwölf Hirsche weideten an einem Ort. Die neun wurden über die ganze Erde zerstreut, ebenso auch die drei.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλαφοι
  choice: Hirsche
  rationale: Die übliche und bildkräftige Wiedergabe des griechischen Plurals; das Geschlecht der Tiere wird im Kontext nicht näher bestimmt.
- source_word: ἐνέμοντο
  choice: weideten
  rationale: Gibt das mediale Imperfekt natürlich wieder und bewahrt den fortdauernden Charakter der Szene.
- source_word: ἐν τόπῳ
  choice: an einem Ort
  rationale: Das artikellose τόπῳ bezeichnet hier einen gemeinsamen, nicht näher bestimmten Ort.
- source_word: διεσπάρησαν
  choice: wurden … zerstreut
  rationale: Bewahrt die passive Form und lässt den Handelnden wie im Griechischen ungenannt.
- source_word: εἰς πᾶσαν τὴν γῆν
  choice: über die ganze Erde
  rationale: Eine natürliche deutsche Wiedergabe der räumlichen Ausbreitung über die gesamte Erde beziehungsweise das ganze Land; die mögliche Bedeutungsbreite von γῆ bleibt kontextuell bestehen.
- source_word: ὁμοίως δὲ καὶ οἱ τρεῖς
  choice: ebenso auch die drei
  rationale: Folgt der knappen elliptischen Form des Griechischen; das Verb „wurden zerstreut“ ist aus dem vorigen Satz mitzudenken.
theological_decisions:
- issue: Deutung der Zwölf, der Neun und der Drei
  choice: Die Zahlen und Tierbilder bleiben ohne erklärende Identifizierung stehen.
  alternative: Die Gruppen ausdrücklich mit Stämmen, Personen oder geschichtlichen Ereignissen gleichsetzen.
  rationale: Der Vers selbst liefert keine ausdrückliche Identifizierung; eine Deutung im Haupttext würde die bildhafte Offenheit unzulässig festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, bildhafter Syntax. Die Ellipse im Schlussteil wurde bewahrt; zur besseren Lesbarkeit wurde der griechische Satz in zwei deutsche Sätze gegliedert.
