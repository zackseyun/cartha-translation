base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/008.yaml
  text: And I saw that [from Judah was born] a virgin, [wearing a robe of fine linen, and from her] a [blameless] lamb was born; and on his left there was, as it were, a lion; and all the beasts were rushing against him, and the lamb overcame them and destroyed them for trampling.
translation:
  language: de
  text: Und ich sah, dass [aus Juda] eine Jungfrau geboren wurde, [die ein Gewand aus feinem Leinen trug, und aus ihr] wurde ein [makelloses] Lamm geboren.[a] Zu seiner Linken war gleichsam ein Löwe;[b] und alle wilden Tiere stürmten gegen das Lamm an. Und das Lamm besiegte sie und vernichtete sie, sodass sie zertreten wurden.[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die in eckigen Klammern stehenden Wörter sind in der zugrunde gelegten Edition als textlich unsicher beziehungsweise nur in einem Teil der Überlieferung bezeugt gekennzeichnet.
    reason: Die textkritische Unsicherheit der Zusätze muss für Leser sichtbar bleiben.
  - marker: b
    text: 'Wörtlich etwa: »Und zu seiner Linken war es/er wie ein Löwe.« Wegen der knappen griechischen Formulierung bleibt die genaue Beziehung des Löwen zum Lamm unsicher.'
    reason: Das ausgelassene Subjekt und der Bezug des Pronomens lassen im Griechischen eine gewisse syntaktische Mehrdeutigkeit bestehen.
  - marker: c
    text: 'Oder: »und gab sie der Zertretung preis«.'
    reason: εἰς καταπάτημα kann als Ergebnis oder als Bestimmung/Zweck der Vernichtung verstanden werden.
lexical_decisions:
- source_word: παρθένος
  choice: Jungfrau
  rationale: Die übliche und kontextuell klare Wiedergabe des griechischen Ausdrucks.
- source_word: στολὴν βυσσίνην
  choice: ein Gewand aus feinem Leinen
  rationale: Gibt sowohl στολή als Gewand als auch βύσσινος als hochwertiges feines Leinen natürlich wieder.
- source_word: ἀμνὸς ἄμωμος
  choice: makelloses Lamm
  rationale: Bewahrt die kultisch und moralisch offene Bedeutung von ἄμωμος, ohne sie auf »unschuldig« einzuengen.
- source_word: ἐξ ἀριστερῶν αὐτοῦ ὡς λέων
  choice: Zu seiner Linken war gleichsam ein Löwe
  rationale: Folgt der vorliegenden griechischen Satzgestalt und wahrt den visionären Vergleich; das Possessivpronomen bezieht sich am ehesten auf das Lamm.
- source_word: ὥρμων κατ᾽ αὐτοῦ
  choice: stürmten gegen das Lamm an
  rationale: Drückt die andauernde, aggressive Bewegung des Imperfekts aus; das ausgeschriebene Bezugswort vermeidet im Deutschen eine unnötige Pronomenmehrdeutigkeit.
- source_word: ἀπώλεσεν αὐτὰ εἰς καταπάτημα
  choice: vernichtete sie, sodass sie zertreten wurden
  rationale: Bewahrt Vernichtung und Zertretung als unterscheidbare Vorstellungen und gibt εἰς mit resultativem Sinn idiomatisch wieder.
theological_decisions:
- issue: Mögliche messianische Deutung des Lammes und des Löwen
  choice: Die Bildsprache bleibt unkommentiert und wird nicht ausdrücklich christologisch identifiziert.
  alternative: Das Lamm oder den Löwen ausdrücklich als Messias beziehungsweise Christus bezeichnen.
  rationale: Der Vers selbst nennt keine solche Identität; die Übersetzung soll die symbolische Spannung bewahren, statt sie konfessionell aufzulösen.
- issue: Textkritisch gekennzeichnete Zusätze
  choice: Die in der Edition eingeklammerten Wörter bleiben in eckigen Klammern und werden in einer Fußnote erläutert.
  alternative: Die Zusätze ohne Kennzeichnung in den Haupttext aufnehmen oder ganz auslassen.
  rationale: So bleibt die überlieferungsgeschichtliche Unsicherheit sichtbar, während der für die konsultierte Textgestalt relevante Wortlaut zugänglich bleibt.
- issue: Identität und Funktion des Löwen
  choice: Der Löwe bleibt eine eigenständige, nur räumlich und vergleichend beschriebene Gestalt.
  alternative: Den Löwen mit dem Lamm gleichsetzen oder ihn als den Angreifer darstellen.
  rationale: Die vorliegende griechische Fassung sagt, dass die wilden Tiere gegen das Lamm anstürmen; sie weist dem Löwen nicht ausdrücklich diese Handlung zu.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer visionärer Bildsprache. Die wiederholte Satzverknüpfung des Griechischen wird teilweise geglättet, ohne den Ablauf oder die Spannung zu verändern. Eckige Klammern werden als textkritische Signale beibehalten.
