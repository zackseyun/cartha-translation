id: T12P.JOS.19.12
reference: Testament of Joseph 19:12
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἡ γὰρ βασιλεία αὐτοῦ βασιλεία *ἔσται αἰώνιος⁴⁹ ἥτις οὐ παρελεύσεται⁵⁰. ἡ δὲ ἐμὴ βασιλεία⁵¹ ἐν ὑμῖν ἐπιτελεῖται, ὡς ὀπωροφυλάκιον⁵² ⌜γος⌉⁵³ μετὰ τὸ θέρος ἐξαφανίζεται⁵⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019/012.yaml
  text: For his kingdom will be an everlasting kingdom, which will not pass away. But my kingdom among you will be brought to completion, like a watchman's hut after the summer, vanishing away.
translation:
  language: de
  text: Denn sein Königreich wird ein ewiges Königreich sein, das nicht vergehen wird. Mein Königreich unter euch aber wird vollendet, wie eine Wächterhütte nach dem Sommer verschwindet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: βασιλεία
  choice: Königreich
  rationale: Bezeichnet hier die Herrschaft beziehungsweise das Reich einer Person; „Königreich“ bewahrt den konkreten Kontrast zwischen seinem und Josefs Reich.
- source_word: αἰώνιος
  choice: ewig
  rationale: Gibt die zeitlich unbegrenzte Dauer im Gegensatz zu Josefs vergänglichem Königreich prägnant wieder.
- source_word: οὐ παρελεύσεται
  choice: nicht vergehen wird
  rationale: Entspricht der Zukunftsform und bewahrt den Gegensatz zum anschließenden Verschwinden.
- source_word: ἐν ὑμῖν
  choice: unter euch
  rationale: Ist im Zusammenhang einer Herrschaft innerhalb der angesprochenen Gemeinschaft idiomatischer als das stärker innerliche „in euch“.
- source_word: ἐπιτελεῖται
  choice: wird vollendet
  rationale: Bewahrt den Grundgedanken des Zu-Ende-Führens beziehungsweise Vollendens, ohne ihn einseitig als bloßen Abbruch wiederzugeben.
- source_word: ὀπωροφυλάκιον
  choice: Wächterhütte
  rationale: Bezeichnet eine provisorische Hütte zur Bewachung saisonaler Feld- oder Obsternte; die knappe Wiedergabe ist verständlich und passt zum Bild der Vergänglichkeit.
- source_word: μετὰ τὸ θέρος ἐξαφανίζεται
  choice: nach dem Sommer verschwindet
  rationale: Gibt die zeitliche Angabe und das Präsens des bildhaften Vergleichs natürlich wieder.
theological_decisions:
- issue: Kontrast zwischen „seinem“ und Josefs Königreich
  choice: Die ewige Dauer des ersten und die Vollendung samt Verschwinden des zweiten werden ohne nähere Identifikation wiedergegeben.
  alternative: Das erste Königreich ausdrücklich messianisch deuten oder Josefs Königreich lediglich als politische Dynastie erklären.
  rationale: Der griechische Wortlaut stellt den Kontrast deutlich her, benennt an dieser Stelle aber weder den Herrscher ausdrücklich noch legt er eine konfessionelle Auslegung fest.
- issue: Bedeutung von ἐπιτελεῖται
  choice: „wird vollendet“
  alternative: „geht zu Ende“ oder „wird vernichtet“
  rationale: „Vollendet“ erhält die mögliche Spannung zwischen Erfüllung und Beendigung; das nachfolgende Bild des Verschwindens macht die Vergänglichkeit dennoch klar.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Parallelstruktur. Die Metapher bleibt konkret; auf erklärende Zusätze im Haupttext wird verzichtet.
