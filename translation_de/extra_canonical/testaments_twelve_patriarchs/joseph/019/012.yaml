  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die zentralen Begriffe des Griechischen zuverlässig wieder: αἰώνιος und οὐ παρελεύσεται als ewige, nicht vergehende Dauer; ἐν ὑμῖν als „unter euch“; ἐπιτελεῖται bewusst als „wird vollendet“, ohne es einseitig zu „wird vernichtet“ oder „geht zu Ende“ zu verschärfen. Das anschließende Bild einer nach dem Sommer verschwindenden Wachhütte ist erhalten.'
  naturalness: Der Text ist modernes, würdiges Standarddeutsch und liest sich flüssig. Die Konstruktion „wird vollendet, wie eine Wächterhütte nach dem Sommer verschwindet“ bildet die griechische Vergleichsstruktur nachvollziehbar nach.
  terminology: „Königreich“ bewahrt den wiederholten Kontrast von βασιλεία; „ewig“, „nicht vergehen“, „vollendet“ und „Wächterhütte“ sind im Kontext angemessene Wiedergaben. Eine genauere Umschreibung der ὀπωροφυλάκιον als Wachhütte bei der Obsternte wäre möglich, aber für den Haupttext nicht erforderlich und würde ihn unnötig belasten.
