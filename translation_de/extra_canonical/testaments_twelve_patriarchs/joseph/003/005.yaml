  text: 5 Und wenn mein Herr verreist war, trank ich keinen Wein; und alle drei Tage nahm ich meine Essensration entgegen und gab sie den Armen und Kranken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπεδήμει
  choice: verreist war
  rationale: Gibt das Fernsein aufgrund einer Reise natürlich und präzise wieder.
- source_word: ὁ κύριός μου
  choice: mein Herr
  rationale: Bewahrt die soziale Bezeichnung des griechischen Textes; im Zusammenhang ist Josephs menschlicher Herr gemeint.
- source_word: τριημερίζων
  choice: drei Tage lang
  rationale: Gibt die zeitliche Dauer idiomatisch wieder, ohne die seltene griechische Form unnötig nachzuahmen.
- source_word: τὴν τροφήν
  choice: meine Nahrung
  rationale: Entspricht der durch μου bezeichneten Zuordnung und bleibt allgemein wie das griechische τροφή.
- source_word: πένησιν καὶ ἀσθενοῦσιν
  choice: den Armen und Kranken
  rationale: Natürliche deutsche Wiedergabe der bedürftigen Armen und der körperlich Schwachen beziehungsweise Kranken.
