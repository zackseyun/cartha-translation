- from: 5 Wenn aber mein Herr verreist war, trank ich keinen Wein; und drei Tage lang nahm ich meine Nahrung und gab sie den Armen und Kranken.
  to: 5 Und wenn mein Herr verreist war, trank ich keinen Wein; und alle drei Tage nahm ich meine Essensration entgegen und gab sie den Armen und Kranken.
  rationale: Die Revision korrigiert die zeitliche Nuance von τριημερίζων zu „alle drei Tage“ und formuliert τροφή im unmittelbaren Kontext als empfangene Essensration. Sie folgt damit dem griechischen Text, auch wo die englische POB-Auditfassung die Zeitangabe als Dauer formuliert.
