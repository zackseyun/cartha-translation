source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἐνήστευον ἐν τοῖς ἑπτὰ ἔτεσιν²¹ ἐκείνοις, καὶ ἐφαινόμην *τῷ Αἰγυπτίῳ²² ὡς ἐν τρυφῇ διάγων· ὅτι²³ οἱ νηστεύοντες *διὰ τὸν θεὸν²⁴ τοῦ προσώπου τὴν χάριν²⁵ λαμβάνουσιν²⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/004.yaml
  text: And I fasted during those seven years, and I appeared to the Egyptian as one living in luxury; because those who fast for God receive favor in their appearance.
translation:
  language: de
  text: 4 Und ich fastete während jener sieben Jahre und erschien dem Ägypter, als lebte ich im Überfluss. Denn wer für Gott fastet, erhält Anmut im Gesicht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die Anmut des Gesichts“. Gemeint sein kann ein anmutiges oder wohlgefälliges Aussehen.'
    reason: Die griechische Wendung τοῦ προσώπου τὴν χάριν ist im Deutschen erklärungsbedürftig und lässt die genaue Nuance von χάρις offen.
lexical_decisions:
- source_word: ἐνήστευον
  choice: fastete ich
  rationale: Das Imperfekt bezeichnet das fortdauernde beziehungsweise wiederholte Fasten während des genannten Zeitraums.
- source_word: ἐν τοῖς ἑπτὰ ἔτεσιν ἐκείνοις
  choice: während jener sieben Jahre
  rationale: Gibt Zeitspanne und rückverweisendes ἐκείνοις natürlich und genau wieder.
- source_word: τῷ Αἰγυπτίῳ
  choice: dem Ägypter
  rationale: Bewahrt den bestimmten singularischen Bezug des griechischen Textes.
- source_word: ὡς ἐν τρυφῇ διάγων
  choice: wie einer, der im Überfluss lebte
  rationale: τρυφή bezeichnet hier ein üppiges, angenehmes Leben; die Formulierung bewahrt den Anschein, ohne tatsächlichen Luxus zu behaupten.
- source_word: διὰ τὸν θεόν
  choice: für Gott
  rationale: Gibt die Ausrichtung beziehungsweise den Beweggrund des Fastens knapp wieder, ohne eine zusätzliche konfessionelle Deutung einzutragen.
- source_word: τοῦ προσώπου τὴν χάριν λαμβάνουσιν
  choice: dessen Gesicht erhält Anmut
  rationale: Bewahrt den ausdrücklichen Bezug auf das Gesicht und gibt χάρις hier als sichtbare Anmut oder Wohlgefälligkeit wieder.
theological_decisions:
- issue: Wirkung des Fastens für Gott
  choice: Die Aussage wird als allgemeiner Zusammenhang zwischen gottbezogenem Fasten und sichtbarer Anmut wiedergegeben.
  alternative: Die Wendung als göttliche Gunst im abstrakten Sinn oder als menschliche Anerkennung deuten.
  rationale: Der Genitiv τοῦ προσώπου bindet χάρις ausdrücklich an das Gesicht beziehungsweise Erscheinungsbild; der Text benennt jedoch nicht genauer, durch wen oder auf welche Weise diese Anmut verliehen wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Dennoch“ macht den im Satz angelegten Gegensatz zwischen Fasten und dem Anschein eines Lebens im Überfluss idiomatisch sichtbar. Der Wechsel zum verallgemeinernden Singular („wer …, dessen …“) klingt im Deutschen natürlicher als ein substantiviertes Pluralpartizip und bewahrt die allgemeine Aussage.
