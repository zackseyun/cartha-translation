revisions:
- from: 4 Und während jener sieben Jahre fastete ich; dennoch erschien ich dem Ägypter wie einer, der im Überfluss lebte. Denn wer für Gott fastet, dessen Gesicht erhält Anmut.[a]
  to: 4 Und ich fastete während jener sieben Jahre und erschien dem Ägypter, als lebte ich im Überfluss. Denn wer für Gott fastet, erhält Anmut im Gesicht.[a]
  rationale: 'Die Revision entfernt die nicht ausdrücklich im griechischen Text markierte adversative Zuspitzung und stellt die syntaktische Zuordnung von λαμβάνουσιν wieder her: Die Fastenden erhalten die auf das Gesicht bezogene χάρις. Die erklärende Fußnote bewahrt die semantische Offenheit der Wendung.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T04:17:09Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Zeitangabe, das fortgesetzte Fasten, der bestimmte Bezug „dem Ägypter“ und der bloße Anschein eines luxuriösen Lebens werden im Wesentlichen zutreffend wiedergegeben. „Dennoch“ fügt jedoch einen im griechischen Wortlaut nicht ausdrücklich markierten adversativen Zusammenhang ein. Die Formulierung „dessen Gesicht erhält Anmut“ verschiebt zudem die Aussage: Im Griechischen erhalten die Fastenden „die Anmut/Gunst des Gesichts“, nicht ihr Gesicht als eigenständiges Subjekt.'
  naturalness: Die Übersetzung ist insgesamt gut verständlich und würdig. „Anmut im Gesicht erhalten“ ist im Deutschen idiomatischer als „dessen Gesicht erhält Anmut“ und hält zugleich den Bezug auf das Gesicht sichtbar.
  terminology: „Für Gott fasten“ ist als knappe Wiedergabe von διὰ τὸν θεόν möglich und wahrt die offene Motivnuance. „Anmut im Gesicht“ gibt χάρις zurück, ohne es dogmatisch als „Gnade“ festzulegen; die Fußnote erhält die mögliche Nuance von Wohlgefälligkeit/Gunst.
  issues:
  - severity: medium
    issue: „dennoch“ ist hinzugefügt.
    rationale: Καὶ … καὶ verknüpft die beiden Aussagen, enthält aber keine explizite adversative Partikel. Der Kontrast kann sich aus dem Kontext ergeben, sollte aber nicht durch „dennoch“ als ausdrücklich markierte Folgerung verstärkt werden.
  - severity: medium
    issue: „dessen Gesicht erhält Anmut“ verschiebt Konstruktion und Sinnbezug.
    rationale: τοῦ προσώπου τὴν χάριν λαμβάνουσιν hat die Fastenden als Subjekt von „empfangen/erhalten“ und „Anmut/Gunst des Gesichts“ als Objekt. Die deutsche Fassung macht dagegen das Gesicht zum Empfänger.
  revised_text: 4 Und ich fastete während jener sieben Jahre und erschien dem Ägypter, als lebte ich im Überfluss. Denn wer für Gott fastet, erhält Anmut im Gesicht.[a]
  revised_footnotes:
  - marker: a
    text: 'Wörtlich: „die Anmut des Gesichts“. Gemeint sein kann ein anmutiges oder wohlgefälliges Aussehen.'
    reason: Die griechische Wendung τοῦ προσώπου τὴν χάριν ist im Deutschen erklärungsbedürftig und lässt die genaue Nuance von χάρις offen.
  revision_rationale: 'Die Revision entfernt die nicht ausdrücklich im griechischen Text markierte adversative Zuspitzung und stellt die syntaktische Zuordnung von λαμβάνουσιν wieder her: Die Fastenden erhalten die auf das Gesicht bezogene χάρις. Die erklärende Fußnote bewahrt die semantische Offenheit der Wendung.'
