source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ποσάκις ἡ Αἰγυπτία¹ ἠπείλησέ² μοι³ θάνατον; ποσάκις⁴ τιμωρίαις⁵ ⸀με⸀⁶ παραδοῦσα⁷ ἀνεκαλέσατο⁸ [καὶ ἠπείλησέ μοι⁹] *καὶ μὴ θέλοντός μου¹⁰ συνελθεῖν αὐτῇ ἔλεγέ¹¹ μοι· Κυριεύσεις¹² *κἀμοὶ καὶ πάντων τῶν ἐν τῷ οἴκῳ μου¹³, *ἐὰν ἐπιδῷς ἑαυτὸν¹⁴ εἰς ἐμέ, καὶ ἔσῃ ὡς δεσπότης ἡμῶν¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/002.yaml
  text: How many times the Egyptian woman threatened me with death! How many times, after handing me over to punishments, she called me back, and threatened me; and when I was unwilling to come together with her, she said to me, “You shall have authority over me also, and over all who are in my house, if you give yourself to me, and you shall be as our master.”
translation:
  language: de
  text: 'Wie oft drohte mir die Ägypterin mit dem Tod! Wie oft lieferte sie mich Strafmaßnahmen aus, rief mich zurück und drohte mir erneut? Und weil ich nicht bereit war, mit ihr zu schlafen, sagte sie zu mir: »Du wirst auch über mich und über alle in meinem Haus Herrschaft haben, wenn du dich mir hingibst, und du wirst wie unser Herr sein.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡ Αἰγυπτία
  choice: die Ägypterin
  rationale: Gibt die substantivierte Herkunftsbezeichnung knapp und natürlich wieder; der bestimmte Artikel bleibt erhalten.
- source_word: τιμωρίαις με παραδοῦσα
  choice: lieferte sie mich der Bestrafung aus
  rationale: Bewahrt das Motiv des Auslieferns; der griechische Plural kann mehrere Strafmaßnahmen bezeichnen, wird im Deutschen aber idiomatisch kollektiv als »Bestrafung« formuliert.
- source_word: ἀνεκαλέσατο
  choice: rief mich dann zurück
  rationale: Gibt das Zurückrufen nach der Auslieferung wieder; »dann« macht lediglich die im Partizipialgefüge enthaltene zeitliche Folge deutlich.
- source_word: συνελθεῖν αὐτῇ
  choice: mit ihr schlafen
  rationale: Der Ausdruck bedeutet im Kontext sexuellen Verkehr. Die idiomatische deutsche Wiedergabe ist klar, ohne unnötig derb zu sein.
- source_word: Κυριεύσεις
  choice: Du wirst … Macht haben
  rationale: Erfasst die zugesagte Herrschaft beziehungsweise Verfügungsgewalt in natürlichem Deutsch.
- source_word: ἐὰν ἐπιδῷς ἑαυτὸν εἰς ἐμέ
  choice: wenn du dich mir hingibst
  rationale: Bewahrt die reflexive Bewegung und den sexuellen Kontext, ohne mehr zu spezifizieren als der griechische Wortlaut.
- source_word: ὡς δεσπότης ἡμῶν
  choice: wie unser Herr
  rationale: »Herr« gibt δεσπότης als Hausherrn oder Gebieter würdig und verständlich wieder; »wie« wahrt den Vergleich.
theological_decisions:
- issue: Art der von der Ägypterin angebotenen Herrschaft
  choice: »über mich und über alle in meinem Haus Macht haben«
  alternative: »über mich und alle Angehörigen meines Hauses herrschen«
  rationale: Die gewählte Formulierung bewahrt den weiten Sinn von κυριεύω, ohne eine institutionelle oder theologische Herrschaftsstellung hineinzulesen.
- issue: Bedeutung von δεσπότης
  choice: »Herr«
  alternative: »Gebieter« oder »Hausherr«
  rationale: »Herr« wahrt die Würde und semantische Offenheit des Titels; der Zusammenhang begrenzt ihn auf die zugesagte Stellung im Haus.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die rhetorische Wiederholung »Wie oft« und die emotionale Steigerung bleiben erhalten. Die im griechischen Editionsapparat markierten Varianten beziehungsweise unsicheren Zusätze werden nicht durch Fußnoten überfrachtet; der fortlaufende Text folgt der gebotenen Lesefassung.
