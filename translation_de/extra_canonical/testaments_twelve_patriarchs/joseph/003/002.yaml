revisions:
- from: 'Wie oft drohte mir die Ägypterin mit dem Tod! Wie oft lieferte sie mich der Bestrafung aus, rief mich dann zurück und drohte mir erneut! Und als ich nicht mit ihr schlafen wollte, sagte sie zu mir: »Du wirst über mich und über alle in meinem Haus Macht haben, wenn du dich mir hingibst, und du wirst wie unser Herr sein.«'
  to: 'Wie oft drohte mir die Ägypterin mit dem Tod! Wie oft lieferte sie mich Strafmaßnahmen aus, rief mich zurück und drohte mir erneut? Und weil ich nicht bereit war, mit ihr zu schlafen, sagte sie zu mir: »Du wirst auch über mich und über alle in meinem Haus Herrschaft haben, wenn du dich mir hingibst, und du wirst wie unser Herr sein.«'
  rationale: 'Die Revision ist gezielt und ohne Bedeutungsverschiebung: Sie stellt die Frageform der zweiten Wiederholung wieder her, gibt den Plural von τιμωρίαις wieder, bewahrt die Hervorhebung in κἀμοί durch »auch über mich« und fasst κυριεύσεις mit »Herrschaft haben« näher am griechischen Sinn. Die sexuelle Bedeutung von συνελθεῖν bleibt mit der natürlichen, nicht unnötig expliziten Wendung »mit ihr schlafen« gewahrt. Textkritisch unsichere oder als Zusatz markierte Elemente der vorgelegten Edition werden nicht als gesicherter Text eingeführt; die Übersetzung folgt der präsentierten Grundlesart.'
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T04:17:05Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt den griechischen Text insgesamt zuverlässig wieder: die wiederholten Drohungen, das Ausliefern an Strafen und Zurückrufen sowie die bedingte Zusage von Herrschaft bleiben erhalten. Die Auslassung von »auch« bei κἀμοί schwächt jedoch die hervorgehobene Einbeziehung der Sprecherin leicht ab. Außerdem ist die deutsche Satzfügung bei »als ich nicht ... wollte« weniger eng an μὴ θέλοντός μου als eine Konstruktion mit »weil/da ich nicht bereit war«; der Sinn bleibt zwar im Wesentlichen erhalten, kann aber präziser und flüssiger gefasst werden.'
  naturalness: Modernes Standarddeutsch und ein angemessen erzählerisch-würdiger Register sind weitgehend erreicht. »Mit ihr schlafen« ist idiomatisch und kontextgerecht. »Der Bestrafung« ist verständlich, doch der griechische Plural τιμωρίαις wird mit »Strafmaßnahmen« genauer und weiterhin natürlich wiedergegeben. Die zweite rhetorische Frage sollte als Fragezeichen erscheinen, entsprechend ποσάκις.
  terminology: »Ägypterin«, »sich hingeben« und »Herr« sind tragfähige Wiedergaben. Für κυριεύσεις ist »Macht haben« möglich, aber »Herrschaft haben« bzw. »herrschen« ist näher am Verb und vermeidet eine etwas unbestimmte Formulierung. »Herr« für δεσπότης wahrt den Vergleich und den hausherrlichen Kontext. Keine theologischen Fachbegriffe sind problematisch.
  issues:
  - severity: low
    issue: κἀμοί (»auch über mich«) ist nicht ausdrücklich wiedergegeben.
    rationale: Das καί hebt die Sprecherin neben allen Personen ihres Hauses hervor. »Auch über mich« erhält diese Nuance.
  - severity: low
    issue: Die zweite rhetorische Frage endet im Entwurf mit einem Ausrufezeichen.
    rationale: ποσάκις leitet auch hier eine Frage ein; ein Fragezeichen bildet die griechische Interpunktion und die parallele Rhetorik genauer ab.
  - severity: low
    issue: τιμωρίαις steht im Plural.
    rationale: »Strafmaßnahmen« bildet den Plural ohne stilistische Härte ab und lässt offen, welcher Art die Strafen waren.
