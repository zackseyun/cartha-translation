  text: And because she had no male child, she pretended.
translation:
  language: de
  text: Und weil sie keinen Sohn hatte, gab sie vor, …[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der vorgelegte griechische Text endet nach „gab sie vor“ (προσεποιεῖτο); was sie vorgab, wird nicht genannt.
    reason: Die Fußnote erklärt die absichtlich unvollständige deutsche Konstruktion präzise und macht deutlich, dass kein Inhalt ergänzt wurde.
lexical_decisions:
- source_word: τέκνον ἄρρεν
  choice: Sohn
  rationale: Die wörtliche Verbindung „männliches Kind“ bezeichnet hier idiomatisch einen Sohn; „Sohn“ ist im modernen Deutsch natürlich und inhaltlich genau.
- source_word: προσεποιεῖτο
  choice: tat sie so, als ob …
  rationale: Das Imperfekt bezeichnet ein fortdauerndes oder wiederholtes Vortäuschen. Da der überlieferte Satz nach dem Verb abbricht, lässt die deutsche Wendung mit Auslassungspunkten die inhaltliche Ergänzung ausdrücklich offen.
theological_decisions:
- issue: Unvollständig überlieferter Inhalt des Vortäuschens
  choice: Keine Ergänzung; der Abbruch wird sichtbar bewahrt.
  alternative: „… als sollte ich ihr als Sohn dienen“ oder eine ähnliche aus dem Zusammenhang erschlossene Ergänzung.
  rationale: Der vorgelegte griechische Text enthält kein Objekt und keinen Inhalt zu προσεποιεῖτο. Eine Ergänzung würde nicht belegten Inhalt in den Haupttext eintragen.
translation_notes:
  register: Modernes, verständliches und würdiges Standarddeutsch. „Sohn“ vermeidet das unnatürliche „männliches Kind“. Die Konstruktion „tat sie so, als ob …“ bildet den semantisch ergänzungsbedürftigen Abbruch des griechischen Textes natürlicher ab als das isolierte „täuschte sie etwas vor“.
