  text: But I remembered the words of my father, and going into my chamber weeping, I prayed to the Lord.
translation:
  language: de
  text: Ich aber erinnerte mich an die Worte meines Vaters und betete zum Herrn, als ich weinend in die Kammer ging.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγὼ δὲ
  choice: Ich aber
  rationale: Gibt den ausdrücklich gesetzten Gegensatz und die Betonung des Pronomens wieder.
- source_word: ἐμνημόνευον
  choice: erinnerte mich
  rationale: Natürliches modernes Deutsch für das Erinnern beziehungsweise Sich-vergegenwärtigen.
- source_word: λόγους πατρός μου
  choice: die Worte meines Vaters
  rationale: Bewahrt die konkrete und im Kontext persönliche Ausdrucksweise des Griechischen.
- source_word: ταμεῖον
  choice: Kammer
  rationale: Bezeichnet einen abgeschlossenen, privaten Innenraum; „Kammer“ wahrt diese Bedeutung, ohne den Raum genauer festzulegen als die Vorlage.
- source_word: κλαίων
  choice: weinend
  rationale: Gibt das begleitende Partizip knapp und unmittelbar wieder.
- source_word: προσηυχόμην Κυρίῳ
  choice: betete zum Herrn
  rationale: Entspricht der Gebetsrichtung im Dativ und verwendet die geläufige biblische Gottesbezeichnung.
