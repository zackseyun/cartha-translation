revisions:
- from: Und ich stand früh auf, um zum Herrn zu beten, und weinte wegen Memphis, der Ägypterin, denn sie bedrängte mich heftig und unablässig. Sogar nachts kam sie unter dem Vorwand eines Besuchs zu mir herein.
  to: Und immer wieder wandte ich mich früh an den Herrn und weinte wegen Memphis, der Ägypterin, denn sie bedrängte mich sehr und unablässig. Denn auch nachts trat sie unter dem Vorwand eines Besuchs zu mir herein.
  rationale: Die Revision entfernt die über das Griechische hinausgehende Explikation „beten“ und gibt den imperfektischen, habituellen Charakter der Verben durch „immer wieder“ wieder. Die Bedeutung von λόγῳ ἐπισκέψεως als vorgeblicher Besuch bleibt erhalten.
