  text: '*Ὤρθριζον δὲ³⁵ πρὸς Κύριον καὶ ἔκλαιον περὶ Μεμφίας³⁶ τῆς Αἰγυπτίας, ὅτι σφόδρα³⁷ ἀδιαλείπτως ἠνόχλει³⁸ μοι³⁹. *καὶ γὰρ⁴⁰ ἐν νυκτὶ εἰσήιει⁴¹ *πρός με⁴² λόγῳ ἐπισκέψεως.'
