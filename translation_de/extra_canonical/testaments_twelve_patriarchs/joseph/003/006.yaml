  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/006.yaml
  text: And I would rise early to the Lord and weep concerning Memphis the Egyptian woman, because she troubled me greatly without ceasing; for even at night she would come in to me under a pretext of visiting.
translation:
  language: de
  text: Und immer wieder wandte ich mich früh an den Herrn und weinte wegen Memphis, der Ägypterin, denn sie bedrängte mich sehr und unablässig. Denn auch nachts trat sie unter dem Vorwand eines Besuchs zu mir herein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὤρθριζον πρὸς Κύριον
  choice: ich stand früh auf, um zum Herrn zu beten
  rationale: ὀρθρίζω bezeichnet das frühe Aufstehen; πρὸς Κύριον gibt hier die Hinwendung zum Herrn wieder. „um … zu beten“ macht den im Kontext naheliegenden Zweck idiomatisch deutlich, ohne das folgende Weinen davon zu lösen.
- source_word: ἔκλαιον περὶ Μεμφίας τῆς Αἰγυπτίας
  choice: weinte wegen Memphis, der Ägypterin
  rationale: περί mit Genitiv bezeichnet hier den Anlass seines Weinens. Der Eigenname wird als „Memphis“ beibehalten, und die Apposition gibt τῆς Αἰγυπτίας unmittelbar wieder.
- source_word: σφόδρα ἀδιαλείπτως ἠνόχλει μοι
  choice: sie bedrängte mich heftig und unablässig
  rationale: ἐνοχλέω meint belästigen, bedrängen oder zusetzen. „bedrängte“ passt zum ernsten Kontext; beide Adverbien bleiben ausdrücklich erhalten.
- source_word: λόγῳ ἐπισκέψεως
  choice: unter dem Vorwand eines Besuchs
  rationale: λόγῳ kann einen angegebenen Grund oder Vorwand bezeichnen; angesichts ihres wiederholten Bedrängens ist „Vorwand“ kontextgemäß, während ἐπίσκεψις als „Besuch“ wiedergegeben wird.
theological_decisions:
- issue: Art der morgendlichen Hinwendung zum Herrn
  choice: „um zum Herrn zu beten“
  alternative: „ich suchte früh den Herrn auf“ / „ich stand früh vor dem Herrn auf“
  rationale: Der griechische Ausdruck nennt das frühe Aufstehen und die Ausrichtung auf den Herrn, aber kein ausdrückliches Verb für „beten“. Die Wiedergabe macht die fromme Handlung verständlich, ohne eine besondere kultische Praxis festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt eng am griechischen Ablauf, wird jedoch für natürliche Lesbarkeit geglättet. Keine Fußnoten erforderlich.
