base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003/001.yaml
  text: In ten temptations he proved me approved, and in them all I was patient; for patience is a great remedy, and endurance gives many good things.
translation:
  language: de
  text: In zehn Prüfungen erwies er mich als bewährt, und in allen blieb ich geduldig. Denn Geduld ist ein großes Heilmittel, und Ausdauer bringt viel Gutes.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πειρασμοῖς
  choice: Prüfungen
  rationale: Das Wort kann sowohl Versuchungen als auch Erprobungen bezeichnen. Hier steht das Bewährtwerden im Vordergrund; „Prüfungen“ erhält zugleich die belastende Dimension.
- source_word: δόκιμον ἀπέδειξέ με
  choice: erwies er mich als bewährt
  rationale: Die Formulierung bewahrt den Gedanken, dass sich Joseph unter Erprobung als echt und bewährt zeigte, ohne das Ergebnis lediglich mit „prüfte“ wiederzugeben.
- source_word: ἐμακροθύμησα / ἡ μακροθυμία
  choice: war ich langmütig / die Langmut
  rationale: Die verwandten deutschen Ausdrücke spiegeln die Wiederaufnahme desselben griechischen Wortstamms und bezeichnen geduldiges, beherrschtes Ausharren.
- source_word: φάρμακον
  choice: Heilmittel
  rationale: „Heilmittel“ gibt die metaphorische Bedeutung natürlich wieder; „wirksam“ verdeutlicht idiomatisch μέγα, ohne eine räumliche Vorstellung von „groß“ nahezulegen.
- source_word: ἡ ὑπομονή
  choice: das standhafte Ausharren
  rationale: Der Ausdruck betont das Bleiben unter Belastung und unterscheidet sich so angemessen von μακροθυμία.
- source_word: πολλὰ ἀγαθὰ δίδωσιν
  choice: bringt viel Gutes hervor
  rationale: Dies ist im Deutschen natürlicher als „gibt viele gute Dinge“ und bewahrt den produktiven Sinn der Aussage.
theological_decisions:
- issue: Nicht genanntes Subjekt von ἀπέδειξέ
  choice: „er“ beibehalten
  alternative: „sie“ oder eine ausdrückliche Benennung des Handelnden
  rationale: Die vorgelegte Einzelsatzquelle bestimmt den Bezug des maskulinen Subjekts nicht näher. Die Übersetzung bewahrt diese Referenz, statt sie interpretierend aufzulösen.
- issue: Verhältnis von göttlicher Prüfung und menschlicher Bewährung
  choice: „erwies er mich als bewährt“
  alternative: „machte er mich bewährt“
  rationale: Die gewählte Fassung lässt offen, ob die Prüfungen Josephs Bewährung offenbarten oder zu ihr beitrugen, und vermeidet eine unnötige dogmatische Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Weisheitsspruch-Struktur bleibt erhalten; „Langmut“ ist leicht gehoben, aber geläufig und entspricht dem ethisch-religiösen Register.
