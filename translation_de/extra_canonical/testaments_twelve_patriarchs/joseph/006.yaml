  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006.yaml
  text: 1 And after this she sent me food mixed with sorcery[a]. 2 But when the eunuch who was bringing it came, I looked up and saw a terrifying man handing me, together with the dish, a sword; and I understood that it was a scheme to lead me astray. 3 So after he had gone out, I ate neither that food nor any of her other foods, but wept without tasting them. 4 Then after one day she came to me, and when she recognized the food, she said to me, “Why is it that you did not eat the food?” 5 And I said to her, “Because you filled it with deadly sorcery. And how did you say, ‘I do not draw near to idols, but to the Lord alone’? 6 Know now, then, that the God of my father, through his angel, revealed your wickedness to me; and for this reason I kept it as evidence against you, to expose you, in hope that perhaps, when you saw it[b][a], you might repent.”
translation:
  language: de
  text: '## Testament Josefs 6


    **1** Danach schickte sie mir Speise, die mit Zauberei vermischt war. **2** Als aber der Eunuch kam, der sie brachte, blickte ich auf und sah einen furchterregenden Mann, der mir zusammen mit der Schüssel ein Schwert reichte.[a] Da erkannte ich, dass dies ein Machwerk war, das mich verführen sollte.[b] **3** Nachdem er hinausgegangen war, weinte ich und kostete weder davon noch von irgendeiner anderen ihrer Speisen. **4** Einen Tag später kam sie zu mir. Als sie die Speise wiedererkannte, fragte sie mich: »Warum hast du nichts von der Speise gegessen?«


    **5** Ich antwortete ihr: »Weil du sie mit todbringender Zauberei erfüllt hast. Wie konntest du da sagen: ›Ich nähere mich nicht den Götzen, sondern allein dem Herrn‹? **6** So erkenne nun: Der Gott meines Vaters hat mir durch seinen Engel deine Bosheit offenbart. Deshalb habe ich sie zu deiner Überführung aufbewahrt,[c] damit du vielleicht, wenn du sie siehst, umkehrst.


    **7** Damit du aber erkennst, dass die Bosheit der Gottlosen diejenigen nicht überwältigen wird, die Gott in Selbstbeherrschung verehren: Sieh, ich nehme davon und esse vor deinen Augen.« Nachdem ich dies gesagt hatte, sprach ich: »Der Gott meiner Väter und der Engel Abrahams werden mit mir sein.« Dann aß ich davon. **8** Als sie das sah, fiel sie weinend zu meinen Füßen auf ihr Gesicht nieder. Ich richtete sie auf und wies sie zurecht. **9** Darauf vereinbarte sie mit mir, diese Gottlosigkeit nicht mehr zu begehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text erklärt nicht, wer der »furchterregende Mann« ist. Es kann sich um eine visionäre, symbolische oder mit der versuchten Zauberei verbundene Erscheinung handeln.
    reason: Bewahrung einer im Ausgangstext offenen Identität
  - marker: b
    text: Das mit »Machwerk« wiedergegebene Wort kann hier auch »Trick«, »kunstvoller Anschlag« oder »magisches Treiben« bedeuten.
    reason: Lexikalische Alternative bei περιέργεια
  - marker: c
    text: 'Wörtlich: »zu deiner Überführung«; auch möglich: »zu deiner Zurechtweisung« oder »als Beweis gegen dich«.'
    reason: Lexikalische Spannweite von εἰς ἔλεγχόν σου
lexical_decisions:
- source_word: βρῶμα
  choice: Speise
  rationale: Der allgemeine Ausdruck bezeichnet Nahrung beziehungsweise eine Speise; das leicht gehobene »Speise« passt zum würdigen Erzählton und bleibt über die Wiederholungen hinweg konsistent.
- source_word: ἐν γοητείᾳ πεφυρμένον
  choice: mit Zauberei vermischt
  rationale: γοητεία bezeichnet Zauberei oder magische Praktiken, während πεφυρμένον das Vermischen ausdrückt. Die Wiedergabe lässt offen, auf welche Weise die Zauberei mit der Speise verbunden gedacht ist.
- source_word: φοβερὸν ἄνδρα
  choice: einen furchterregenden Mann
  rationale: φοβερός beschreibt hier eine Furcht erregende Erscheinung. »Mann« bewahrt die fehlende Identifikation der Gestalt.
- source_word: τρύβλιον
  choice: Schüssel
  rationale: Das Wort bezeichnet ein Gefäß für Speisen; »Schüssel« ist konkret und natürlich, ohne die genaue Form unnötig festzulegen.
- source_word: μάχαιρα
  choice: Schwert
  rationale: μάχαιρα kann Schwert, Dolch oder großes Messer bezeichnen. »Schwert« gibt die bedrohliche Bildwirkung wieder, ohne die Gestalt theologisch zu bestimmen.
- source_word: περιέργεια
  choice: Machwerk
  rationale: Im Zusammenhang bezeichnet das Wort eine manipulative beziehungsweise magische Unternehmung. »Machwerk« erhält den absichtsvoll hergestellten und unheilvollen Charakter; eine alternative Nuance wird in der Fußnote genannt.
- source_word: εἰς ἀποπλάνησίν μου
  choice: das mich verführen sollte
  rationale: ἀποπλάνησις bezeichnet ein Abbringen oder Irreführen. »Verführen« passt sowohl zur moralischen als auch zur erzählerischen Dimension, ohne sie auf sexuelle Verführung zu verengen.
- source_word: μὴ γευσάμενος
  choice: kostete ... weder
  rationale: Die Form bezeichnet ausdrücklich das Kosten. Die deutsche Formulierung bewahrt Josefs vollständige Enthaltung.
- source_word: ἐπιγνοῦσα τὸ βρῶμα
  choice: als sie die Speise wiedererkannte
  rationale: ἐπιγινώσκω kann erkennen oder wiedererkennen bedeuten. Im Kontext erkennt sie die unberührt gebliebene, von ihr gesandte Speise.
- source_word: γοητείας θανάτου
  choice: todbringender Zauberei
  rationale: Der Genitiv θανάτου beschreibt wahrscheinlich Wirkung oder Eigenschaft. »Todbringend« wahrt die tödliche Stoßrichtung und klingt im Deutschen natürlicher als »Zauberei des Todes«.
- source_word: οὐ προσεγγίζω τοῖς εἰδώλοις
  choice: Ich nähere mich nicht den Götzen
  rationale: Die räumlich-religiöse Bildsprache des Verbs προσεγγίζω wird bewusst bewahrt.
- source_word: σωφροσύνη
  choice: Selbstbeherrschung
  rationale: σωφροσύνη umfasst Besonnenheit, Sittsamkeit und sexuelle Enthaltsamkeit. »Selbstbeherrschung« ist im Kontext verständlich und lässt die Tugend breiter als bloße Keuschheit erscheinen.
- source_word: ἐνουθέτησα
  choice: wies sie zurecht
  rationale: νουθετέω bedeutet ermahnen oder zurechtweisen. Im Anschluss an die Entlarvung ist »zurechtweisen« präzise, ohne unnötige Härte einzutragen.
- source_word: συνεθέτό μου
  choice: versprach sie mir
  rationale: Wörtlich geht es um ein Sich-Verständigen beziehungsweise eine Vereinbarung mit Josef. Im Deutschen gibt »versprach sie mir« den Verpflichtungscharakter der folgenden Infinitivkonstruktion natürlich wieder.
theological_decisions:
- issue: Identität des furchterregenden Mannes mit dem Schwert
  choice: Die Gestalt bleibt als »Mann« unbestimmt.
  alternative: Engel, dämonische Erscheinung oder symbolische Vision
  rationale: Der griechische Text identifiziert die Gestalt nicht. Deshalb wird weder ihre Herkunft noch ihr Wesen ergänzt.
- issue: Bedeutung der Enthüllung durch den Engel in Vers 6
  choice: »durch seinen Engel ... offenbart«
  alternative: Die Erscheinung aus Vers 2 ausdrücklich mit diesem Engel gleichsetzen
  rationale: Der Text stellt keine eindeutige Gleichsetzung her. Die Übersetzung wahrt den möglichen Zusammenhang, behauptet ihn aber nicht.
- issue: μετανοήσεις in der konkreten Konfrontation
  choice: »umkehrst«
  alternative: »bereust« oder »deine Gesinnung änderst«
  rationale: Es geht um die Abkehr von einer bestimmten gottlosen Tat. »Umkehren« trägt die moralisch-religiöse Bedeutung, ohne eine konfessionelle Deutung hinzuzufügen.
- issue: »der Engel Abrahams« in Vers 7
  choice: Die ungewöhnliche Bezeichnung wird wörtlich bewahrt.
  alternative: »der Engel, der Abraham beschützte« oder »Abrahams Engel«
  rationale: Der Genitiv lässt die genaue Beziehung offen. Eine ausdeutende Umschreibung würde mehr festlegen als der griechische Text.
- issue: Wirkung der Bosheit der Gottlosen in Vers 7
  choice: 'Zukunftsform: »wird ... nicht überwältigen«'
  alternative: 'Allgemeine Gegenwartsform: »kann ... nicht überwältigen«'
  rationale: Die griechische Zukunft κατισχύσει wird erhalten. Damit bleibt der Satz zugleich Bekenntnis und Verheißung und wird nicht zu einer abstrakten Lehraussage umgeformt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählton. Die direkte Rede ist natürlich gestaltet, ohne die Wiederholungen und den semitisch geprägten Duktus vollständig einzuebnen. Ungewöhnliche theologische Formulierungen wie »der Engel Abrahams« sowie die nicht identifizierte Erscheinung bleiben bewusst unausgedeutet.
