  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/005.yaml
  text: 'And again, at another time, she said to me, “If you do not want to commit adultery, I will kill my husband with poison and take you as my husband.”


    2 So when I heard this, I tore my garments and said to her, “Woman, be ashamed before God, and do not do this lawless and evil deed, lest you be destroyed. For know this also: I will report your scheme to everyone.”


    3 Then she, being afraid, begged me not to report this scheme.


    4 And she went away, trying to win me over with gifts and every kind of pleasure.'
translation:
  language: de
  text: '5 Ein anderes Mal sagte sie wieder zu mir: »Wenn du nicht Ehebruch begehen willst, werde ich meinen Mann mit Gift töten und dich zu meinem Mann nehmen.«


    2 Als ich das hörte, zerriss ich meine Gewänder und sagte zu ihr: »Frau, schäme dich vor Gott und begehe nicht diese böse Tat, damit du nicht vernichtet wirst. Denn du sollst auch wissen: Ich werde allen von diesem Plan erzählen.«


    3 Da bekam sie Angst und bat mich inständig, diesen Plan nicht bekannt zu machen.


    4 Dann ging sie fort, bemüht, mich mit Geschenken und allerlei Genüssen für sich zu gewinnen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μοιχεῦσαι
  choice: Ehebruch begehen
  rationale: Gibt den ausdrücklichen sexuellen und ehebrecherischen Sinn des griechischen Verbs direkt und verständlich wieder.
- source_word: ἀνελῶ … φαρμάκῳ
  choice: mit Gift töten
  rationale: Bewahrt sowohl die Tötungsabsicht als auch das genannte Mittel; eine stärker idiomatische Wiedergabe wie »vergiften« wäre ebenfalls möglich, aber etwas weniger formal.
- source_word: αἰδέσθητι τὸν Θεόν
  choice: schäme dich vor Gott
  rationale: αἰδέομαι bezeichnet hier Scham beziehungsweise ehrfürchtige Scheu angesichts Gottes; »fürchte Gott« würde die konkrete lexikalische Nuance stärker in Richtung φόβος verschieben.
- source_word: πρᾶξιν … πονηράν
  choice: böse Tat
  rationale: Entspricht dem griechischen Text, der die Tat als πονηράν bezeichnet; »gesetzlos und böse« würde ein im vorliegenden griechischen Wortlaut nicht ausdrücklich vorhandenes zusätzliches Adjektiv einführen.
- source_word: ἐπίνοια
  choice: Plan
  rationale: Bezeichnet hier ihren ausgedachten Anschlag beziehungsweise Vorsatz. »Plan« ist im Kontext natürlich und lässt offen, ob eher Absicht oder Intrige betont wird.
- source_word: ἐξαγγελῶ
  choice: allen … erzählen / bekannt machen
  rationale: Das Verb meint öffentlich verkünden oder melden. Die kontextgerechte Variation vermeidet schwerfällige Wiederholung, ohne den Sinn zu verändern.
- source_word: ἐπιθάλπουσά με
  choice: bemüht, mich … für sich zu gewinnen
  rationale: Das Partizip beschreibt ihr fortgesetztes schmeichelndes beziehungsweise umwerbendes Einwirken auf Josef; die Zielrichtung wird im Deutschen idiomatisch ausgedrückt.
- source_word: ἀπολαύσεσι πάσαις
  choice: allen möglichen Genüssen
  rationale: Bewahrt die Breite von πᾶσαι und den Sinn angenehmer Genüsse, ohne diese unnötig auf sexuelle Lust zu verengen.
theological_decisions:
- issue: Bedeutung von αἰδέσθητι τὸν Θεόν
  choice: schäme dich vor Gott
  alternative: fürchte Gott / habe Ehrfurcht vor Gott
  rationale: Die gewählte Fassung folgt der spezifischen Bedeutung von αἰδέομαι und bewahrt die moralische Beschämung vor Gottes Angesicht, ohne sie stillschweigend mit dem geläufigeren Ausdruck »Gott fürchten« gleichzusetzen.
- issue: Folgeformel ἵνα μὴ ἐξολοθρευθῇς
  choice: damit du nicht vernichtet wirst
  alternative: sonst wirst du vernichtet / damit du nicht zugrunde gehst
  rationale: Die Formulierung lässt Ursache und Handelnden der drohenden Vernichtung offen, wie es auch das griechische Passiv tut, und macht keine zusätzliche Aussage über ein unmittelbares göttliches Gericht.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer direkter Rede. Die Verszählung bleibt erhalten. »Gewänder« bewahrt das antike Milieu, während »Kleider« ebenfalls möglich wäre. Es wurden keine textkritischen Fußnoten gesetzt, da die markierten Varianten des Apparats für diese Passage keine notwendige inhaltliche Erläuterung im Lesetext verlangen.
