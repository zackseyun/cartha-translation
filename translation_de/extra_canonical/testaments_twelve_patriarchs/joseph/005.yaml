  terminology: „Ehebruch begehen“, „mit Gift töten“, „schäme dich vor Gott“, „böse Tat“, „Plan“ und „Gewänder“ sind sachgerecht. „allerlei Genüssen“ gibt πάσαις ἀπολαύσεσι idiomatisch als Vielfalt bzw. Gesamtheit angenehmer Anreize wieder, ohne sie zu spezifizieren.
