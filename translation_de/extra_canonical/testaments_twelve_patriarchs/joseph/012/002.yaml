base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/002.yaml
  text: And the chief of them said to me, “You are not a servant, for your appearance also makes it plain.” But I told them plainly that I was their servant.
translation:
  language: de
  text: 'Da sagte der Ranghöchste unter ihnen zu mir: „Du bist kein Sklave, denn auch dein Aussehen zeigt es.“ Ich aber sagte ihnen, dass ich ihr Sklave sei.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μείζων αὐτῶν
  choice: der Älteste von ihnen
  rationale: μείζων bezeichnet hier wahrscheinlich den ranghöchsten oder führenden Mann; „der Älteste“ bewahrt die mögliche Verbindung von Alter und Rang, ohne ausdrücklich einen Amtstitel einzuführen.
- source_word: δοῦλος
  choice: Sklave
  rationale: Das griechische Wort bezeichnet hier einen Menschen in einem Besitz- und Abhängigkeitsverhältnis; „Sklave“ gibt dies genauer wieder als das mildere „Diener“.
- source_word: ἡ ὄψις σου
  choice: dein Aussehen
  rationale: ὄψις meint die sichtbare Erscheinung beziehungsweise das Äußere einer Person.
- source_word: δηλοῖ
  choice: zeigt
  rationale: Die schlichte deutsche Form gibt die Bedeutung „macht deutlich/erkennbar“ natürlich wieder.
- source_word: ὑπάρχω
  choice: sei
  rationale: Im abhängigen Aussagesatz ist „sei“ idiomatisches Deutsch für das griechische „ich bin/befinde mich als“.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Gegenüberstellung von behaupteter Freiheit und Josephs Festhalten an seiner Sklavenstellung bleibt erhalten. Das im englischen Beratungstext ergänzte „plainly“ wurde nicht übernommen, da der vorgelegte griechische Text an dieser Stelle lediglich λέγω („ich sage“) bietet.
