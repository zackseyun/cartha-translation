  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/007.yaml
  text: And God blessed him in my hand, and increased him on my account in gold and silver and goods.
translation:
  language: de
  text: Und Gott segnete ihn unter meiner Obhut und vermehrte seinen Besitz an Gold, Silber und Gütern.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der in der griechischen Edition in Winkelklammern gesetzte Zusatz „und Gütern“ ist textlich unsicher. Das griechische Wort kann je nach Zusammenhang auch „Werk“ oder „Arbeit“ bedeuten.
    reason: Kennzeichnet sowohl die textkritische Unsicherheit des Zusatzes καὶ ἔργῳ als auch die semantische Spannweite von ἔργον.
lexical_decisions:
- source_word: ἐν χειρί μου
  choice: durch meine Hand
  rationale: 'Bewahrt das Bild der Hand und gibt zugleich den instrumentalen Sinn natürlich wieder: Gottes Segen wurde durch Josephs Verwaltung vermittelt.'
- source_word: ἐπλήθυνεν αὐτόν
  choice: ließ seinen Besitz … wachsen
  rationale: Das wörtliche „vermehrte ihn“ wäre im Deutschen missverständlich; im Zusammenhang mit Gold, Silber und Gütern bezeichnet das Pronomen die Zunahme seines Vermögens.
- source_word: ἐν χρυσίῳ καὶ ἀργυρίῳ
  choice: an Gold, Silber
  rationale: Die Wendung bezeichnet die Bereiche, in denen sein Besitz zunahm.
- source_word: ἔργῳ
  choice: Gütern
  rationale: Im Kontext materieller Vermehrung ist „Güter“ idiomatischer als das isolierte „Werk/Arbeit“; die textliche und semantische Unsicherheit wird in der Fußnote sichtbar gemacht.
theological_decisions:
- issue: Verhältnis zwischen Gottes Segen und Josephs Mitwirkung
  choice: Gott bleibt der Handelnde; „durch meine Hand“ bezeichnet Joseph als vermittelndes Werkzeug.
  alternative: „in meiner Hand“ oder „unter meiner Obhut“
  rationale: Die Formulierung wahrt sowohl Gottes Initiative als auch die instrumentale beziehungsweise verwaltende Rolle Josephs, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht bildhafte Wendung „durch meine Hand“ hält sich eng an den griechischen Ausdruck, während „seinen Besitz wachsen“ die im Deutschen unnatürliche wörtliche Aussage „ihn vermehren“ kontextgerecht verdeutlicht.
