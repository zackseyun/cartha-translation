base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/011.yaml
  text: Now therefore render judgment concerning him, and take the young man into our house, and the God of the Hebrews will bless you, because grace from heaven is upon him.
translation:
  language: de
  text: Fälle nun also ein Urteil über ihn und nimm den jungen Mann in unser Haus auf; und der Gott der Hebräer wird dich segnen, denn Gnade aus dem Himmel ruht auf ihm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ποίησον μετ᾿ αὐτοῦ κρίσιν
  choice: sprich … ein Urteil über ihn
  rationale: Gibt die gerichtliche Wendung natürlich und sachlich wieder; μετ᾿ αὐτοῦ bezeichnet hier die Person, über die entschieden werden soll, ohne das Urteil als Verurteilung festzulegen.
- source_word: ἀφελοῦ τὸν νεανίαν εἰς τὸν οἶκον ἡμῶν
  choice: nimm den jungen Mann in unser Haus auf
  rationale: ἀφελοῦ hat im Kontext den Sinn des An-sich-Nehmens bzw. Wegnehmens; „aufnehmen“ ergibt mit dem Ziel „in unser Haus“ idiomatisches modernes Deutsch.
- source_word: εὐλογῆσαί σε ἔχει
  choice: wird … dich segnen
  rationale: Die periphrastische Zukunftskonstruktion wird im Deutschen mit dem Futur wiedergegeben.
- source_word: χάρις ἐκ τοῦ οὐρανοῦ ἐστι πρὸς αὐτόν
  choice: Gnade aus dem Himmel ruht auf ihm
  rationale: Bewahrt χάρις als „Gnade“ und gibt die relationale Aussage πρὸς αὐτόν in natürlichem, würdigem Deutsch wieder.
theological_decisions:
- issue: Ursprung und Bezug der Gnade
  choice: „Gnade aus dem Himmel ruht auf ihm“
  alternative: „ihm wird Gnade aus dem Himmel zuteil“
  rationale: Die gewählte Fassung bewahrt sowohl den himmlischen Ursprung als auch die auf den jungen Mann bezogene Gnade, ohne ihre genaue Wirkungsweise näher zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde für gute Lesbarkeit in zwei Sätze gegliedert; „Dann“ macht die folgernde Verbindung des griechischen καί nach dem Imperativ deutlich.
