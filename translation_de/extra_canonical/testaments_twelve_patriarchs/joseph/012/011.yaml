revisions:
- from: Nun sprich also ein Urteil über ihn und nimm den jungen Mann in unser Haus auf. Dann wird der Gott der Hebräer dich segnen, denn Gnade aus dem Himmel ruht auf ihm.
  to: Fälle nun also ein Urteil über ihn und nimm den jungen Mann in unser Haus auf; und der Gott der Hebräer wird dich segnen, denn Gnade aus dem Himmel ruht auf ihm.
  rationale: Die Revision beseitigt die nicht ausdrücklich im Griechischen markierte Folgerung „Dann“ und verwendet die natürliche juristische Wendung „ein Urteil fällen“. Alle semantischen Elemente, einschließlich der nicht näher bestimmten himmlischen Gnade, bleiben erhalten.
