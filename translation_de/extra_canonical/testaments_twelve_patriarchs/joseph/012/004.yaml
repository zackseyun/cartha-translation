source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ὡς δὲ *εἰς Αἴγυπτον ἐφθάσαμεν ἐμάχοντο περὶ ἐμοῦ τὸ²² *τίς προδοὺς χρυσίον λάβῃ με²³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/004.yaml
  text: And when we had come into Egypt, they disputed concerning me, as to who, after betraying me, would receive the gold.
translation:
  language: de
  text: Als wir nach Ägypten gekommen waren, stritten sie sich meinetwegen darüber, wer mich verraten und dafür das Gold erhalten sollte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφθάσαμεν
  choice: wir … gekommen waren
  rationale: Gibt das Erreichen des Ziels in natürlichem modernem Deutsch wieder; der temporale Nebensatz verlangt hier idiomatisch das Plusquamperfekt.
- source_word: ἐμάχοντο περὶ ἐμοῦ
  choice: stritten sie sich meinetwegen darüber
  rationale: Bewahrt den Streit um Joseph und leitet zugleich natürlich zur indirekten Frage über.
- source_word: προδούς
  choice: verraten
  rationale: Entspricht dem Partizip von προδίδωμι und vermeidet die unbelegte Ergänzung eines Händlers als Objekt der Täuschung.
- source_word: χρυσίον
  choice: das Gold
  rationale: Gibt den konkreten Ausdruck für Gold wieder, nicht lediglich allgemeines Geld.
- source_word: λάβῃ με
  choice: dafür das Gold erhalten sollte
  rationale: Der überlieferte Wortlaut ist syntaktisch auffällig, da με nach λάβῃ steht. Im Kontext wird die Lesart der englischen Prüfschicht wiedergegeben, ohne ein im Griechischen ungenanntes Objekt wie „Händler“ einzuführen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur ist gegenüber dem Griechischen leicht geglättet, ohne die Aussage über Verrat, Streit und Gold inhaltlich aufzulösen oder konfessionell zu deuten.
