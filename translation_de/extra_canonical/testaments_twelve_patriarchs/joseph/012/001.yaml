base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/001.yaml
  text: And when I was coming with the Ishmaelites, they kept asking me, saying, “Are you a servant?” And I said that I was a household servant, so that I might not put my brothers to shame.
translation:
  language: de
  text: 'Als ich mit den Ismaelitern unterwegs war, fragten sie mich immer wieder: »Bist du ein Sklave?« Ich antwortete, ich sei ein Sklave aus einem Haushalt[a], damit ich meine Brüder nicht beschäme.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »ein Sklave aus einem Haus«. Die knappe Wendung kann einen einem Haushalt zugehörigen Sklaven meinen; auch die Deutung als im Haushalt geborener Sklave wird vertreten.'
    reason: ἐξ οἴκου ist elliptisch. Die Fußnote erläutert mögliche Nuancen, ohne im Haupttext einen vornehmen Haushalt oder eine bestimmte Herkunft festzulegen.
lexical_decisions:
- source_word: Ἐρχόμενος ... μετὰ τῶν Ἰσμαϊλιτῶν
  choice: Als ich mit den Ismaelitern unterwegs war
  rationale: Gibt die begleitende Bewegung idiomatisch wieder, ohne das Partizip unnötig wörtlich abzubilden.
- source_word: ἐπηρώτων
  choice: fragten sie mich immer wieder
  rationale: Das Imperfekt bezeichnet hier eine wiederholte oder fortgesetzte Befragung.
- source_word: δοῦλος
  choice: Sklave
  rationale: Bewahrt den konkreten unfreien Status deutlicher als das heute oft allgemeinere Wort »Diener«.
- source_word: δοῦλος ... ἐξ οἴκου
  choice: ein Sklave aus einem vornehmen Haus
  rationale: Die elliptische Wendung ἐξ οἴκου lässt sich als Herkunft aus einem angesehenen Haushalt verstehen; die Unsicherheit wird in der Fußnote ausgewiesen.
- source_word: αἰσχύνω
  choice: beschämte
  rationale: Entspricht dem sozialen Sinn des Verbs und hält den Bezug auf die Brüder offen, ohne zusätzliche Motive einzutragen.
theological_decisions:
- issue: Josephs Selbstbezeichnung und Schutz seiner Brüder
  choice: Die Aussage wird als bewusste, aber zurückhaltende Herkunftsangabe wiedergegeben, die seine Brüder vor Beschämung schützt.
  alternative: »Ich sei ein Haussklave« oder »ich sei von Geburt an Sklave«
  rationale: Der griechische Ausdruck ἐξ οἴκου ist knapp und textlich nicht völlig eindeutig. Die Übersetzung vermeidet es, Joseph ausdrücklich als im Haus geborenen Sklaven darzustellen, was der Zusammenhang nicht sicher verlangt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Direkte Rede wird natürlich gestaltet; »Sklave« bewahrt die soziale Härte von δοῦλος. Die Wiederholung des griechischen λέγοντες wird im Deutschen nicht eigens wiedergegeben, da sie nach »fragten« schwerfällig wäre.
