  - severity: low
    issue: Vergangenheitsform „damit ich meine Brüder nicht beschämte“
    rationale: Das griechische ἵνα mit präsentischem Konjunktiv bezeichnet den beabsichtigten Zweck. Deutsch „damit ich meine Brüder nicht beschäme“ gibt dies klarer wieder.
