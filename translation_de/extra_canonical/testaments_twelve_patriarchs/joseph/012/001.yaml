  naturalness: Der Satz ist in modernem Standarddeutsch flüssig. „Aus einem Haushalt“ ist als bewusst knappe, quellennahe Wiedergabe verständlich; die Fußnote erläutert die ungeklärte genauere Nuance.
  terminology: „Sklave“ ist für δοῦλος angemessen. Die Ismaeliter sind korrekt benannt. Für ἐξ οἴκου darf weder „vornehm“ noch eine bestimmte Deutung wie „im Haus geboren“ ohne Kennzeichnung in den Haupttext eingetragen werden.
