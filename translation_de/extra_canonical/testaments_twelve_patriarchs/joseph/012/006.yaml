source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ὁ δὲ Κύριος ἔδωκέ μοι³⁰ χάριν ἐν ὀφθαλμοῖς τοῦ μεταβόλου καὶ ἐπίστευσέ³¹ μοι τὸν οἶκον αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/006.yaml
  text: But the Lord gave me favor in the eyes of the merchant, and he entrusted his house to me.
translation:
  language: de
  text: Doch der Herr schenkte mir Gunst in den Augen des Händlers, und dieser vertraute mir sein Haus an.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χάριν ἐν ὀφθαλμοῖς
  choice: Gunst in den Augen
  rationale: Bewahrt die semitisch geprägte griechische Wendung und bleibt im Deutschen verständlich und würdevoll.
- source_word: τοῦ μεταβόλου
  choice: des Händlers
  rationale: Im Kontext bezeichnet μεταβόλος einen Händler beziehungsweise Kaufmann; „Händler“ ist natürlich und entspricht der englischen Konsultationsfassung.
- source_word: ἐπίστευσέ μοι τὸν οἶκον αὐτοῦ
  choice: vertraute mir sein Haus an
  rationale: Gibt die Konstruktion mit πιστεύω und Akkusativ als anvertraute Verantwortung wieder; „Haus“ lässt offen, ob Gebäude, Haushalt oder Hausstand gemeint ist.
theological_decisions:
- issue: Göttliche Gewährung menschlicher Gunst
  choice: „der Herr schenkte mir Gunst“
  alternative: „der Herr gab mir Gunst“
  rationale: „Schenkte“ drückt natürlich aus, dass die Gunst vom Herrn gewährt wurde, ohne die Aussage weitergehend theologisch auszudeuten.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Das demonstrative „dieser“ macht den Subjektwechsel vom Herrn zum Händler eindeutig, ohne zusätzliche inhaltliche Deutung.
