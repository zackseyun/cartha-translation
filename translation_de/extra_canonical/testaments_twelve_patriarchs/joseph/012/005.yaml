source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Διὰ πᾶσιν ἔδοξεν *τοῦ εἶναι²⁴ με εἰς Αἴγυπτον πρὸς *τὸν μετάβολον τῆς ἐμπορίας²⁵ αὐτῶν, ἕως ὅτου²⁶ ἐπιστρέψουσιν²⁷ φέροντες²⁸ ἐμπορίαν²⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/005.yaml
  text: So it seemed good to all of them for me to remain in Egypt with the merchant of their trade until they should return bringing merchandise.
translation:
  language: de
  text: Darum hielten es alle für gut, dass ich in Ägypten bei dem Händler ihres Handelsgeschäfts bleiben sollte, bis sie mit Waren zurückkehrten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔδοξεν πᾶσιν
  choice: alle hielten es für gut
  rationale: Gibt die unpersönliche Wendung idiomatisch und zugleich würdig wieder.
- source_word: τοῦ εἶναί με εἰς Αἴγυπτον
  choice: dass ich in Ägypten blieb
  rationale: Der artikulierte Infinitiv bezeichnet hier den als gut erachteten Verbleib; „blieb“ vermeidet die nicht ausdrücklich ausgedrückte Kausativbedeutung „sie ließen mich zurück“.
- source_word: τὸν μετάβολον τῆς ἐμπορίας αὐτῶν
  choice: den Händler ihrer Handelsgesellschaft
  rationale: μετάβολος bezeichnet einen Händler; ἐμπορία kann neben Handel beziehungsweise Handelsgeschäft im Kontext auch die gemeinschaftliche Handelsunternehmung meinen. Die Formulierung bewahrt die Zugehörigkeitsangabe αὐτῶν.
- source_word: ἐπιστρέψουσιν φέροντες ἐμπορίαν
  choice: mit Handelswaren zurückkehrten
  rationale: Die modale Partizipialkonstruktion wird natürlich ins Deutsche übertragen; ἐμπορία bezeichnet hier wahrscheinlich Handelsgut beziehungsweise Waren.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die syntaktische Aussage des Verbleibens wird bewahrt, ohne ein nicht ausdrücklich genanntes Zurücklassen einzutragen.
