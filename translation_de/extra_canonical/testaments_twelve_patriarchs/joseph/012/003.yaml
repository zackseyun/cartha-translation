    rationale: Ὁ μείζων bedeutet „der Größere“ bzw. „Ranghöchste“ unter ihnen. „Anführer“ kann eine formale oder funktionale Leitung implizieren, die der Text nicht ausdrücklich behauptet; außerdem ist die Formulierung mit „von ihnen“ stilistisch schwächer.
