base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/003.yaml
  text: And the chief of them said to me, “You are not a servant, for your appearance also makes it plain.” But I told them plainly that I was their servant.
translation:
  language: de
  text: 'Da sagte der Ranghöchste unter ihnen zu mir: „Du bist kein Sklave; denn auch dein Aussehen zeigt das deutlich.“ Ich aber sagte ihnen, dass ich ihr Sklave sei.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μείζων αὐτῶν
  choice: der Anführer von ihnen
  rationale: Wörtlich bezeichnet der Ausdruck den Größeren beziehungsweise Ranghöchsten unter ihnen. „Anführer“ gibt die Stellung in natürlichem Deutsch wieder, ohne eine konkrete Amtsbezeichnung einzuführen.
- source_word: δοῦλος
  choice: Sklave
  rationale: δοῦλος bezeichnet hier einen Menschen in persönlicher Unfreiheit; „Sklave“ bewahrt die soziale Schärfe des griechischen Ausdrucks besser als „Diener“.
- source_word: ἡ ὄψις σου
  choice: dein Aussehen
  rationale: ὄψις meint die sichtbare Erscheinung beziehungsweise das Äußere einer Person; „Aussehen“ ist die natürliche moderne Entsprechung.
- source_word: δηλοῖ
  choice: zeigt das deutlich
  rationale: Das Verb bedeutet „offenbaren, kenntlich machen, deutlich zeigen“. Die Formulierung wahrt dessen ausdrücklichen Evidenzcharakter.
- source_word: ὑπάρχω
  choice: sei
  rationale: In der Konstruktion δοῦλος ὑπάρχω bezeichnet das Verb den bestehenden Status. Im deutschen abhängigen Aussagesatz ist „sei“ idiomatisch und inhaltlich ausreichend.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der historische Statusbegriff wird mit „Sklave“ klar wiedergegeben. Das im griechischen Text nur einmal stehende δηλοῖ wird ausschließlich in der ersten Aussage als „zeigt das deutlich“ übersetzt; die zweite Aussage erhält keine zusätzliche Betonung, die der überlieferte griechische Wortlaut nicht ausdrücklich trägt.
