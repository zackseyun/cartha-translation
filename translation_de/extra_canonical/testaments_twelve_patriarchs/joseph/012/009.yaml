source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Κατ᾽ ἐκεῖνον δὲ¹ τὸν καιρὸν κατῆει² Μεμφίς³ †ἐν λαμπήνῃ†⁴ *ἡ γυνὴ⁵ τοῦ Πεντεφρὶ⁶ ⌜μετὰ δόξης πολλῆς, ὅτι ἤκουσε περὶ ἐμοῦ παρὰ τῶν εὐνούχων αὐτῆς⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/009.yaml
  text: At that time the wife of Pentephri came down to Memphis in a litter, with great splendor, because she had heard about me from her eunuchs.
translation:
  language: de
  text: Zu jener Zeit kam die Frau des Pentephri in einer Sänfte[a] mit großer Pracht nach Memphis hinab, weil sie durch ihre Eunuchen von mir gehört hatte.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Bezeichnung für das Fahrzeug ist im zugrunde gelegten Text textkritisch unsicher überliefert; sie wird gewöhnlich als „Sänfte“ oder ähnliches Reisefahrzeug verstanden.
    reason: Kennzeichnet die durch Dolche markierte Unsicherheit von ἐν λαμπήνῃ, ohne eine bestimmte Rekonstruktion oder Fahrzeugart über das Überlieferte hinaus festzulegen.
lexical_decisions:
- source_word: Κατ᾽ ἐκεῖνον ... τὸν καιρόν
  choice: Zu jener Zeit
  rationale: Natürliche und genaue zeitliche Einleitung; das griechische δέ wird im Deutschen nicht eigens wiedergegeben, da es hier vor allem den Erzählfluss fortführt.
- source_word: κατῆει Μεμφίς
  choice: kam ... nach Memphis hinab
  rationale: Bewahrt die Richtungsangabe des Verbs κατέρχομαι und gibt das Ziel idiomatisch mit „nach Memphis“ wieder.
- source_word: ἐν λαμπήνῃ
  choice: in einer Sänfte
  rationale: λαμπήνη bezeichnet ein überdachtes Trage- oder Reisefahrzeug; „Sänfte“ ist im Kontext eine verständliche, knappe Entsprechung. Die textkritische Unsicherheit der überlieferten Wendung wird in einer Fußnote nicht zwingend benötigt, da der Sinn ausreichend klar ist.
- source_word: μετὰ δόξης πολλῆς
  choice: mit großer Pracht
  rationale: Gibt die öffentliche Herrlichkeit bzw. den prächtigen Auftritt natürlich wieder, ohne δόξα hier theologisch aufzuladen.
- source_word: παρὰ τῶν εὐνούχων αὐτῆς
  choice: durch ihre Eunuchen
  rationale: παρά mit Genitiv bezeichnet hier die Herkunft der Nachricht; „durch“ ist im Deutschen idiomatischer als „vonseiten“.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Erzählsprache. Der Satz folgt der griechischen Informationsstruktur weitgehend, vermeidet jedoch ein schwerfälliges zusätzliches „aber“. Der Eigenname Πεντεφρί wird entsprechend der vorgegebenen Namensform als „Pentephri“ wiedergegeben.
