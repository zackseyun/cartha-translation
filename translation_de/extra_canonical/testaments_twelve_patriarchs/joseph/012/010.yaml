revisions:
- from: 'Und sie sagte zu ihrem Mann: „Der Händler ist durch die Hände eines jungen Hebräers reich geworden; und man sagt, dass auch er aus dem Land Kanaan geraubt worden sei.“'
  to: 'Und sie sagte zu ihrem Mann: „Der Händler ist durch die Hände eines jungen Hebräers reich geworden; und sie sagen, dass auch er durch Diebstahl aus dem Land Kanaan gestohlen worden sei.“'
  rationale: „Sie sagen“ stellt die pluralische, unbestimmte Berichterstattung von λέγουσι wieder her. „Durch Diebstahl … gestohlen“ erhält die absichtlich nachdrückliche griechische Formulierung, ohne eine bestimmte Art von gewaltsamer Verschleppung oder eine weitergehende Deutung einzutragen. Der Konjunktiv I bleibt als indirekte Rede nach dem gegenwärtigen Bericht erhalten.
