base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012/010.yaml
  text: And she said to her husband, “The merchant has grown rich through the hands of a certain young Hebrew; and they say that he also was stolen by theft from the land of Canaan.”
translation:
  language: de
  text: 'Und sie sagte zu ihrem Mann: „Der Händler ist durch die Hände eines jungen Hebräers reich geworden; und sie sagen, dass auch er durch Diebstahl aus dem Land Kanaan gestohlen worden sei.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μετάβολος
  choice: der Händler
  rationale: Das Substantiv bezeichnet hier einen Händler bzw. Kaufmann; „Händler“ ist im heutigen Deutsch natürlich und kontextgerecht.
- source_word: ἐπλούτησεν … ἐν χερσίν τινος νέου Ἑβραίου
  choice: ist durch die Hände eines jungen Hebräers reich geworden
  rationale: Die Wendung bewahrt das griechische Bild und gibt die vermittelnde Bedeutung von ἐν χερσίν verständlich wieder.
- source_word: κλοπῇ ἔκλεψαν αὐτόν
  choice: er … geraubt worden sei
  rationale: Der griechische cognate Ausdruck ist emphatisch („durch Diebstahl stehlen“). Eine wörtliche Doppelung wäre im Deutschen unnatürlich; „geraubt“ erhält Nachdruck und Sinn.
- source_word: ἐκ γῆς Χαναάν
  choice: aus dem Land Kanaan
  rationale: Direkte und im Deutschen geläufige Wiedergabe der Herkunftsangabe.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der indirekte Bericht nach „man sagt“ steht im Konjunktiv I. Das καὶ vor κλοπῇ wird mit „auch“ wiedergegeben, ohne seinen möglichen Bezug übermäßig festzulegen.
