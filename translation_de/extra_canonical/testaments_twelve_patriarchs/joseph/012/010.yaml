review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von μετάβολος als „Händler“ und von ἐπλούτησεν ἐν χερσίν als „ist durch die Hände … reich geworden“ ist sachgerecht. Der finale Bezug von καὶ wird mit „auch er“ angemessen erhalten. Allerdings gibt „man sagt“ das griechische Pluralverb λέγουσι („sie sagen“) nicht vollständig wieder, und „geraubt“ schwächt die betonte Doppelung κλοπῇ ἔκλεψαν („durch Diebstahl gestohlen“) ab.
  naturalness: Der Satz ist insgesamt natürliches modernes Standarddeutsch. „Durch Diebstahl … gestohlen worden sei“ ist bewusst leicht markiert, aber als formnahe Wiedergabe der emphatischen griechischen Ausdrucksweise verständlich und im würdevollen Register tragfähig.
  terminology: „Händler“, „junger Hebräer“ und „Land Kanaan“ sind treffend. Keine theologischen Fachbegriffe oder Namensfragen erfordern eine Änderung.
  issues:
  - severity: medium
    issue: λέγουσι wird mit dem unpersönlichen Singular „man sagt“ wiedergegeben.
    rationale: 'Das griechische Präsens Plural bezeichnet ausdrücklich eine ungenannte Mehrzahl: „sie sagen“.'
  - severity: low
    issue: Die Emphase von κλοπῇ ἔκλεψαν ist in „geraubt worden“ nicht sichtbar.
    rationale: Die griechische Verbindung von Dativ und verwandtem Verb hebt den Diebstahl ausdrücklich hervor. Eine behutsame formnahe deutsche Doppelung bewahrt dies besser.
  revised_text: 'Und sie sagte zu ihrem Mann: „Der Händler ist durch die Hände eines jungen Hebräers reich geworden; und sie sagen, dass auch er durch Diebstahl aus dem Land Kanaan gestohlen worden sei.“'
