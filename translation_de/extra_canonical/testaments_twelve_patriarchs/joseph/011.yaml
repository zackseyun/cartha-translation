base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/011.yaml
  text: 'And so[a], my children, in every deed of yours keep the fear of God before your eyes, and honor your brothers; for everyone who does the law of the Lord will be loved by him.


    And when I was coming with the Ishmaelites, they kept asking me, saying[b], “Are you a servant?” And I said that I was a household servant, so that I might not put my brothers to shame.'
translation:
  language: de
  text: '**Testament Josefs 11**


    **1** So habt auch ihr nun, meine Kinder, bei allem, was ihr tut, die Furcht Gottes vor Augen und ehrt eure Brüder; denn jeder, der nach dem Gesetz des Herrn handelt, wird von ihm geliebt werden.


    **2** Als ich mit den Ismaelitern unterwegs war, fragten sie mich immer wieder: »Bist du ein Sklave?« Ich antwortete: »Ich bin ein Haussklave[a]«, damit ich meine Brüder nicht der Schande preisgäbe.


    **3** Ihr Ältester sagte zu mir: »Du bist kein Sklave; das zeigt schon dein Aussehen.« Ich aber sagte ihnen, ich sei ihr Sklave.[b]


    **4** Als wir nach Ägypten kamen, stritten sie darüber, wer Gold geben und mich dafür bekommen sollte.


    **5** Da beschlossen sie alle, mich in Ägypten bei dem Zwischenhändler zu lassen, über den sie ihre Geschäfte abwickelten,[c] bis sie mit Handelswaren zurückkehrten.


    **6** Der Herr aber schenkte mir Gunst in den Augen des Zwischenhändlers, und dieser vertraute mir sein Haus an.


    **7** Gott segnete ihn durch meine Hand und ließ ihn an Gold und Silber und in seinem Gewerbe[d] großen Zuwachs erfahren.


    **8** Drei Monate blieb ich bei ihm.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische ἐξ οἴκου kann einen zum Haushalt gehörenden oder möglicherweise einen im Haus geborenen Sklaven bezeichnen.
    reason: lexical_alternative
  - marker: b
    text: 'Die Lesart »ihr Sklave« beruht auf dem textkritisch unsicheren Wort αὐτῶν. Ohne dieses Wort lautet der Satz lediglich: »Ich aber sagte ihnen, ich sei ein Sklave.«'
    reason: textual_variant
  - marker: c
    text: 'Oder: »bei dem Händler ihrer Handelsgesellschaft«. Die genaue Funktion des μετάβολος in ihrem Geschäft ist nicht sicher.'
    reason: lexical_alternative
  - marker: d
    text: Die Worte »und in seinem Gewerbe« sind textkritisch unsicher. Das griechische ἔργῳ kann allgemeiner auch »Arbeit« oder »Werk« bedeuten.
    reason: textual_variant
lexical_decisions:
- source_word: φόβον τοῦ θεοῦ
  choice: die Furcht Gottes
  rationale: Die traditionelle Wendung bewahrt den ethisch-religiösen Ernst von φόβος, ohne ihn auf bloße Angst oder auf das mildere »Ehrfurcht« festzulegen.
- source_word: πρὸ ὀφθαλμῶν ὑμῶν
  choice: vor Augen
  rationale: Die geläufige deutsche Wendung erhält das konkrete Bild beständiger moralischer Wachsamkeit.
- source_word: ποιῶν νόμον Κυρίου
  choice: nach dem Gesetz des Herrn handelt
  rationale: Das griechische »das Gesetz tun« wird in natürliches modernes Deutsch übertragen, während der praktische Gehorsam des Partizips erhalten bleibt.
- source_word: ἐπηρώτων
  choice: fragten ... immer wieder
  rationale: Der Imperfekt bezeichnet hier fortgesetztes oder wiederholtes Fragen.
- source_word: δοῦλος
  choice: Sklave
  rationale: Im Zusammenhang von Verkauf, Besitzanspruch und sozialem Status bezeichnet δοῦλος eindeutig einen versklavten Menschen, nicht nur einen Diener.
- source_word: ἐξ οἴκου
  choice: Haussklave
  rationale: Die knappe Wiedergabe bezeichnet wahrscheinlich einen zum Haushalt gehörenden beziehungsweise dort geborenen Sklaven; die genaue Nuance bleibt in einer Fußnote offen.
- source_word: ἡ ὄψις σου
  choice: dein Aussehen
  rationale: ὄψις kann Gesicht oder äußere Erscheinung meinen; »Aussehen« wahrt diese Spannweite.
- source_word: τὸν μετάβολον τῆς ἐμπορίας αὐτῶν
  choice: der Zwischenhändler, über den sie ihre Geschäfte abwickelten
  rationale: μετάβολος bezeichnet hier am ehesten einen Händler oder Vermittler, der in ihren Handelsverkehr eingebunden war.
- source_word: ἐπίστευσέ μοι τὸν οἶκον αὐτοῦ
  choice: vertraute mir sein Haus an
  rationale: Die Formulierung bewahrt sowohl das Vertrauensmotiv als auch die mögliche Bedeutung des gesamten Haushalts beziehungsweise Besitzes.
- source_word: ἐν χειρί μου
  choice: durch meine Hand
  rationale: Die bildhafte und möglicherweise an die Josefüberlieferung angelehnte Wendung bleibt bewusst erhalten.
- source_word: ἐπλήθυνεν αὐτὸν ἐν χρυσίῳ καὶ ἀργυρίῳ καὶ ἔργῳ
  choice: ließ ihn an Gold und Silber und in seinem Gewerbe großen Zuwachs erfahren
  rationale: Die Wiedergabe macht verständlich, dass der Händler beziehungsweise sein Vermögen zunahm, ohne αὐτόν stillschweigend durch »Besitz« zu ersetzen; das textkritisch unsichere ἔργῳ wird als geschäftliche Tätigkeit verstanden.
theological_decisions:
- issue: Gottesfurcht als ethische Grundhaltung
  choice: Furcht Gottes
  alternative: Ehrfurcht vor Gott
  rationale: »Furcht Gottes« bewahrt die biblisch-jüdische Spannung zwischen Scheu, Gehorsam und Verehrung und schwächt sie nicht auf respektvolle Hochachtung ab.
- issue: Göttliche Reaktion auf das Tun des Gesetzes
  choice: wird von ihm geliebt werden
  alternative: ist ihm lieb / wird seine Liebe erfahren
  rationale: Das Futur Passiv ἀγαπηθήσεται wird unmittelbar wiedergegeben; die Aussage über Gottes Liebe wird weder als Verdienstschema erklärt noch theologisch abgeschwächt.
- issue: Josefs Selbstbezeichnung
  choice: Sklave / Haussklave
  alternative: Diener / Hausdiener
  rationale: Der Erzählzusammenhang betrifft Josefs Verkauf und rechtlichen Status. »Diener« würde die Zwangs- und Besitzdimension von δοῦλος verdecken.
- issue: Josefs Absicht gegenüber seinen Brüdern
  choice: damit ich meine Brüder nicht der Schande preisgäbe
  alternative: damit ich mein Vaterhaus nicht beschämte
  rationale: Das direkte Objekt sind ausdrücklich Josefs Brüder. Seine Aussage verschweigt ihre Tat und schützt sie damit vor öffentlicher Schande, ohne ihre Schuld zu leugnen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer testamentarischer Mahnrede und gut lesbarer Erzählprosa. Konkrete biblische Bilder wie »vor Augen« und »durch meine Hand« bleiben erhalten; sozialgeschichtlich belastete Begriffe werden nicht beschönigt. Die Verszählung wurde zur Orientierung beibehalten.
