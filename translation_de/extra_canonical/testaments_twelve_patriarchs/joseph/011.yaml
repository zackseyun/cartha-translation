  - severity: low
    issue: 'V. 5: »Schließlich beschlossen sie alle«'
    rationale: διὰ πᾶσιν/der überlieferte Ausdruck besagt, dass alle zu diesem Beschluss kamen; eine zeitliche Zuspitzung durch »Schließlich« ist nicht erforderlich.
