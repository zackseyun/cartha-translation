  naturalness: Modernes, würdiges Standarddeutsch. Die vorgeschlagenen Änderungen machen V. 4 idiomatischer und V. 5 enger am Ausgangstext, ohne den erzählerischen Fluss zu beeinträchtigen.
  terminology: »Furcht Gottes«, »Gesetz des Herrn«, »Sklave« und »Haussklave« sind sachgerecht. Die Fußnoten sichern die unsicheren bzw. mehrdeutigen Stellen αὐτῶν, μετάβολος und ἔργῳ angemessen ab.
