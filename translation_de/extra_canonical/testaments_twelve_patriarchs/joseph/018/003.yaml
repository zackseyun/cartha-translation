id: T12P.JOS.18.3
reference: Testament of Joseph 18:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἰδοὺ¹⁰ ⌜γὰρ⌉¹¹ ὁρᾶτε ὅτι ⌜διὰ τὴν *ταπείνωσιν καὶ τὴν μακροθυμίαν μου¹²⌉ θυγατέρα *ἱερέως ἡλιουπόλεως¹³ ἔλαβον ἐμαυτῷ¹⁴ εἰς γυναῖκα¹⁵, καὶ ἑκατὸν τάλαντα *χρυσίου δέδονταί μοι¹⁶ *σὺν αὐτῇ¹⁷, *καὶ ὁ¹⁸ Κύριός μου¹⁹ αὐτοὺς²⁰ κατεδούλωσεν²¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/003.yaml
  text: For see, you know that through my humility and my long-suffering I took for myself as wife the daughter of the priest of Heliopolis, and a hundred talents of gold were given to me with her, and my Lord made them subject to me.
translation:
  language: de
  text: Denn seht, ihr wisst, dass ich wegen meiner Demut und meiner Langmut die Tochter des Priesters von Heliopolis zur Frau nahm. Mit ihr wurden mir hundert Talente Gold gegeben, und mein Herr unterwarf sie mir.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Worauf sich „sie“ bezieht, ist im griechischen Wortlaut dieses Satzes nicht eindeutig.
    reason: Das maskuline Pluralpronomen αὐτούς hat im unmittelbar vorliegenden Wortlaut kein grammatisch eindeutiges Bezugswort; die Fußnote bewahrt diese Ambiguität.
lexical_decisions:
- source_word: Ἰδοὺ γὰρ
  choice: Denn seht
  rationale: Gibt sowohl die begründende Partikel γάρ als auch den aufmerksamkeitslenkenden Imperativ ἰδού knapp und würdig wieder.
- source_word: διὰ τὴν ταπείνωσιν καὶ τὴν μακροθυμίαν μου
  choice: wegen meiner Demut und meiner Langmut
  rationale: διά mit Akkusativ bezeichnet hier den Grund. „Langmut“ bewahrt die ethisch-theologische Färbung von μακροθυμία besser als bloße „Geduld“.
- source_word: ἔλαβον ἐμαυτῷ εἰς γυναῖκα
  choice: nahm … zur Frau
  rationale: Natürliche deutsche Wiedergabe der semitisch gefärbten griechischen Wendung; der reflexive Sinn von ἐμαυτῷ ist in „sich jemanden zur Frau nehmen“ enthalten und muss nicht schwerfällig eigens ausgedrückt werden.
- source_word: ἱερέως ἡλιουπόλεως
  choice: des Priesters von Heliopolis
  rationale: Bewahrt Amt und Ortsbezug ohne unbelegte nähere Bestimmung.
- source_word: ἑκατὸν τάλαντα χρυσίου
  choice: hundert Talente Gold
  rationale: Behält die antike Gewichtseinheit bei, da eine moderne Umrechnung wegen regional und zeitlich wechselnder Talentgewichte irreführend wäre.
- source_word: κατεδούλωσεν
  choice: unterwarf
  rationale: Gibt den starken Sinn „dienstbar machen/unterwerfen“ idiomatisch wieder, ohne unnötig mit „versklaven“ zu verschärfen.
theological_decisions:
- issue: Bezugswort des Pluralpronomens αὐτούς
  choice: „sie“ im Haupttext beibehalten und die Mehrdeutigkeit in einer Fußnote erklären
  alternative: Das Pronomen ausdrücklich auf die Ägypter, die Angehörigen der Frau oder die hundert Talente beziehen
  rationale: Im vorliegenden Satz fehlt ein eindeutiges maskulines Plural-Bezugswort. Eine konkrete Identifikation würde die echte textliche beziehungsweise kontextuelle Spannung unzulässig auflösen.
- issue: „mein Herr“ (Κύριός μου)
  choice: mein Herr
  alternative: der Herr
  rationale: Das Possessivpronomen μου ist ausdrücklich bezeugt und wird bewahrt; die Übersetzung entscheidet nicht zusätzlich, ob die Bezeichnung hier ausschließlich auf Gott zielt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählton. Antike Eigennamen und Maßeinheiten bleiben erhalten. Der erste Satz wurde zur besseren deutschen Lesbarkeit nach „zur Frau nahm“ abgeschlossen, ohne die logischen Beziehungen zu verändern.
