source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: ⌜Καὶ *ἐάν τις θέλει⁷ κακοποιῆσαι ὑμᾶς, ὑμεῖς τῇ ἀγαθοεργείᾳ⁸ εὔχεσθε ὑπὲρ αὐτοῦ, καὶ ἀπὸ παντὸς κακοῦ λυτρωθήσεσθε ὑπὸ⁹ Κυρίου¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/002.yaml
  text: And if anyone wants to do evil to you, you, by doing good, pray for him, and you will be delivered from every evil by the Lord.
translation:
  language: de
  text: Und wenn jemand euch Böses antun will, betet für ihn, indem ihr Gutes tut; dann werdet ihr vom Herrn von allem Bösen errettet werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κακοποιῆσαι
  choice: Böses tun
  rationale: Gibt das Verb natürlich und in seinem moralischen Sinn wieder; der Bezug auf die Adressaten bleibt durch „euch“ erhalten.
- source_word: τῇ ἀγαθοεργείᾳ
  choice: indem ihr Gutes tut
  rationale: Bewahrt den instrumentalen Sinn des Dativs und klingt im modernen Deutsch natürlicher als das abstrakte „durch Wohltätigkeit“.
- source_word: εὔχεσθε ὑπὲρ αὐτοῦ
  choice: betet für ihn
  rationale: Direkte und idiomatische Wiedergabe des Gebets zugunsten des Übeltäters.
- source_word: ἀπὸ παντὸς κακοῦ
  choice: aus allem Bösen
  rationale: Bewahrt die mögliche Spannung zwischen konkretem Übel und moralischem Bösen, ohne sie auf „Gefahr“ oder „Unglück“ einzuengen.
- source_word: λυτρωθήσεσθε ὑπὸ Κυρίου
  choice: ihr werdet vom Herrn … errettet werden
  rationale: Das Passiv mit ὑπό bezeichnet den Herrn ausdrücklich als Handelnden; „errettet“ entspricht dem starken Befreiungssinn von λυτρόομαι.
theological_decisions:
- issue: Verhältnis von Gutestun und Gebet
  choice: „betet für ihn, indem ihr Gutes tut“
  alternative: „tut Gutes und betet für ihn“
  rationale: Der griechische instrumentale Dativ τῇ ἀγαθοεργείᾳ wird nicht in zwei unabhängige Gebote aufgelöst; die syntaktische Verbindung und ihre mögliche Spannung bleiben erhalten.
- issue: Urheber der Errettung
  choice: „vom Herrn“
  alternative: „durch den Herrn“
  rationale: „Vom Herrn“ bildet den persönlichen Urheber beim Passiv klar und ohne zusätzliche Deutung ab.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, wird aber durch „dann“ und die natürliche Wortstellung gut verständlich gemacht.
