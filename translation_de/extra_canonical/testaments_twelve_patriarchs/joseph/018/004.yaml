base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/004.yaml
  text: Indeed he gave me beauty beyond the handsome men of Israel, and preserved me until old age in strength and in beauty; for I was like Jacob in all things.
translation:
  language: de
  text: Ja, er gab mir sogar eine Schönheit, die die der schönen Männer Israels übertraf, und bewahrte mich bis ins hohe Alter in Kraft und Schönheit; denn ich glich Jakob in allem.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡραιότητα
  choice: Anmut
  rationale: Das Wort bezeichnet ansprechende Schönheit bzw. Wohlgestalt; „Anmut“ gibt dies im Deutschen natürlich und würdevoll wieder.
- source_word: ὑπὲρ ὡραίους Ἰσραήλ
  choice: mehr Anmut als den anmutigen Männern Israels
  rationale: ὑπέρ drückt hier einen Vergleich aus. Die substantivisch gebrauchte maskuline Pluralform ὡραίους wird als Bezug auf die anmutigen bzw. schönen Männer Israels verstanden.
- source_word: ἕως γήρους
  choice: bis ins hohe Alter
  rationale: Natürliche deutsche Wiedergabe der zeitlichen Grenze bis zum Greisenalter.
- source_word: ἐν δυνάμει καὶ ἐν κάλλει
  choice: in Kraft und Schönheit
  rationale: Bewahrt die parallele Ausdrucksweise und unterscheidet δύναμις („Kraft“) von κάλλος („Schönheit“).
- source_word: ὅμοιος ἤμην ἐν πᾶσι τῷ Ἰακώβ
  choice: ich glich Jakob in allem
  rationale: Idiomatiche und zugleich eng am griechischen Vergleich orientierte Formulierung.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Hochdeutsch mit würdigem Ton. Das verstärkende Καίγε καὶ wird durch „Ja, ... sogar“ wiedergegeben; die Satzverknüpfung und die Aussage über Josephs Ähnlichkeit mit Jakob bleiben ohne zusätzliche Deutung erhalten.
