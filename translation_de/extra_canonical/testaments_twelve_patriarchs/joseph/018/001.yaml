base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018/001.yaml
  text: If, then, you also walk in the commandments of the Lord, God will exalt you with good things forever.
translation:
  language: de
  text: Wenn also auch ihr nach den Geboten des Herrn lebt, wird Gott euch für immer mit Gutem erhöhen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: πορευθῆτε ἐν ταῖς ἐντολαῖς
  choice: nach den Geboten … lebt
  rationale: Die wörtliche Wegmetapher „in den Geboten wandeln“ klingt im heutigen Deutsch ungewohnt; „nach den Geboten leben“ gibt den Sinn natürlich und verständlich wieder.
- source_word: ὑψώσει
  choice: wird … erhöhen
  rationale: „Erhöhen“ bewahrt die Bedeutung des griechischen Verbs und seine mögliche Aussage von Erhebung, Ehre oder erhöhtem Rang, ohne sie enger festzulegen.
- source_word: ἐν ἀγαθοῖς
  choice: mit Gutem
  rationale: Die instrumentale beziehungsweise begleitende Wiedergabe ist im Deutschen natürlich und bewahrt die offene Bedeutung von ἀγαθά als gute Gaben, Wohltaten oder Güter.
- source_word: εἰς αἰῶνας
  choice: für immer
  rationale: Dies ist eine natürliche moderne Wiedergabe der idiomatischen Wendung und drückt ihre unbegrenzte zeitliche Perspektive aus.
theological_decisions:
- issue: Verhältnis von Gehorsam und göttlicher Erhöhung
  choice: Die konditionale Aussage wird unverändert als Verheißung formuliert.
  alternative: Den Satz durch Begriffe wie „Lohn“, „Verdienst“ oder „Gnade“ theologisch näher bestimmen.
  rationale: Der griechische Text nennt keine solche systematische Einordnung; seine Spannung zwischen menschlichem Handeln und Gottes Erhöhung bleibt daher bestehen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung ist verständlich, ohne die Aussage konfessionell oder dogmatisch zu erweitern.
