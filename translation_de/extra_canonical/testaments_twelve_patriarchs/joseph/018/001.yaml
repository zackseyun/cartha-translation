  source_fidelity: Die Übersetzung gibt die Kondition („Wenn“), das hervorgehobene „auch ihr“, das Leben gemäß den Geboten des Herrn, Gottes zukünftiges Erhöhen, die mit ἐν ἀγαθοῖς ausgedrückte positive Begleitung bzw. Ausstattung und die unbegrenzte Zeitangabe εἰς αἰῶνας zuverlässig wieder. „Mit Gutem“ bewahrt die Offenheit von ἀγαθοῖς besser als eine Einengung auf materielle Güter oder bloßen Segen.
