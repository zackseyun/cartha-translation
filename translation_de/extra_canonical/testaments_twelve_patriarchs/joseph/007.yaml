review_pass:
  verdict: revise
  source_fidelity: 'Eine sichere Korrektur ist nötig: Das griechische Prädikat ἔσται steht trotz der mit καί verbundenen Ausdrücke im Singular. Die deutsche Fassung sollte diesen Singular bewahren, statt die beiden Ausdrücke durch ein pluralisches Verb eindeutig als getrennte Subjekte zu behandeln. Außerdem gibt „von der Erde tilgen“ ἀπὸ τῆς γῆς genauer wieder als „auf der Erde verlieren“.'
  naturalness: Die Sprache ist insgesamt modernes, würdiges Standarddeutsch. „zu mir herein“ legt jedoch einen Innenraum nahe, den der griechische Text nicht ausdrücklich nennt; „auf mich zu“ ist gleichermaßen lebendig und quellennäher. Die behutsame Umstellung in Vers 8 folgt der Bildfolge des Griechischen.
  terminology: „Selbstbeherrschung“, „Gottlose“, „Geist Beliars“, „Nebenfrau“ und die verhüllende Formulierung „dich mit mir vereinigst“ sind angemessen. Der Eigenname wird als „Astetho“ beibehalten; die Fußnote weist sachlich auf abweichende Überlieferungsformen hin.
  issues:
  - severity: medium
    issue: Pluralisches Verb bei „Der Gott meiner Väter und der Engel Abrahams“
    rationale: ἔσται ist Singular. Ein deutscher Plural („werden“) legt eine Aufspaltung in zwei grammatische Subjekte fest, während der Singular der Vorlage deren syntaktische bzw. traditionsgeschichtliche Mehrdeutigkeit stehen lässt.
  - severity: low
    issue: „zu mir herein“ in Vers 11
    rationale: εἰσεπήδησε πρός με bezeichnet ein plötzliches Zugehen bzw. -springen auf Joseph zu; ein Hineingehen in einen Raum ist nicht ausdrücklich gegeben.
  - severity: low
    issue: „auf der Erde verlieren“ in Vers 13
    rationale: ἀπολέσεις τὸ μνημόσυνόν σου ἀπὸ τῆς γῆς hat die Richtung „von der Erde“ und ein aktives Verb. „von der Erde tilgen“ bildet dies genauer ab.
