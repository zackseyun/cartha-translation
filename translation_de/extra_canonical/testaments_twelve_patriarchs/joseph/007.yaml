    10 Als ihr Mann sie sah, fragte er sie: »Was ist mit deinem Gesicht geschehen?« Sie antwortete ihm: »Ich leide an Herzensqual, und die Seufzer meines Geistes bedrängen mich.« Da versuchte er, sie mit Worten zu heilen.


    11 Dann fand sie eine günstige Gelegenheit, stürzte auf mich zu, während ihr Mann noch draußen war, und sagte zu mir: »Ich ersticke! Wenn du dich nicht mit mir vereinigst, stürze ich mich eine Klippe hinab.«


