    13 »Warum bist du, du Unglückliche, so aufgewühlt und außer dir und verblendest dich durch Sünden? Denk daran: Wenn du dich selbst tötest, wird Astetho[a], die Nebenfrau deines Mannes und deine Rivalin, deine Kinder schlagen; und du wirst dein Andenken von der Erde tilgen.«'
  rationale: Die Revision bewahrt den auffälligen Singular der griechischen Vorlage bei Gott und dem Engel Abrahams und vermeidet damit eine interpretierende grammatische Festlegung. Kleinere Anpassungen stellen die Bewegungsrichtung in Vers 11, das wiederholte Ausschauhalten in Vers 9 und das Tilgen des Andenkens „von der Erde“ quellengetreuer dar, ohne den erzählerischen Register zu verändern.
