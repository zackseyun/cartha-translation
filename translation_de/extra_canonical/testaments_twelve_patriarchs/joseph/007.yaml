base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007.yaml
  text: '7. So that you may learn that the wickedness of the ungodly will not prevail over those who fear God in self-control, look: taking some of it before him, I ate it in your presence. And after saying this, I tasted it and said, “The God of my fathers and the angel of Abraham will be with me.” And I ate.


    8. But when she saw this, she fell on her face at my feet, weeping; and raising her up, I admonished her.


    9. And she agreed with me not to commit this impiety any longer. Yet her heart was still set on evil, and she kept looking around for a way to ensnare me; and groaning, she would collapse suddenly, though she was not sick.


    10. And when her husband saw her, he said to her, “What has happened to your face?” She said to him, “I am in pain with anguish of heart, and the groanings of my spirit hold me fast.” And he tried to heal her with words.


    11. Then, when she found an opportunity, she rushed in to me while her husband was still outside, and said to me, “I am choking; or I will throw myself down a cliff, if you do not join yourself with me.”


    12. But I, understanding that the spirit of Beliar was troubling her, prayed to the Lord and said to her,


    13. “Why, miserable woman, are you disturbed and thrown into turmoil, blinding yourself in sins? Remember that if you kill yourself, Astho, your husband''s concubine, your rival, will beat your children and wipe out your memory from the earth.”'
translation:
  language: de
  text: '7 Damit du erkennst, dass die Bosheit der Gottlosen nicht über diejenigen siegen wird, die Gott in Selbstbeherrschung verehren: Sieh, ich nahm vor deinen Augen etwas davon und aß es. Nachdem ich dies gesagt hatte, sprach ich: »Der Gott meiner Väter und der Engel Abrahams wird mit mir sein.« Dann aß ich.


    8 Als sie das sah, fiel sie weinend auf ihr Angesicht zu meinen Füßen. Ich richtete sie auf und wies sie zurecht.


    9 Sie versprach mir, diese Gottlosigkeit nicht mehr zu begehen. Doch ihr Herz war weiterhin auf das Böse gerichtet, und sie hielt Ausschau, wie sie mich in eine Falle locken könnte. Dabei seufzte sie und brach unvermittelt zusammen, obwohl sie nicht krank war.


    10 Als ihr Mann sie sah, fragte er sie: »Was ist mit deinem Gesicht geschehen?« Sie antwortete ihm: »Ich leide an Herzensqual, und die Seufzer meines Geistes bedrängen mich.« Da versuchte er, sie mit Worten zu heilen.


    11 Dann fand sie eine günstige Gelegenheit, stürzte auf mich zu, während ihr Mann noch draußen war, und sagte zu mir: »Ich ersticke! Wenn du dich nicht mit mir vereinigst, stürze ich mich eine Klippe hinab.«


    12 Ich aber erkannte, dass der Geist Beliars sie bedrängte, betete zum Herrn und sagte zu ihr:


    13 »Warum bist du, du Unglückliche, so aufgewühlt und außer dir und verblendest dich durch Sünden? Denk daran: Wenn du dich selbst tötest, wird Astetho[a], die Nebenfrau deines Mannes und deine Rivalin, deine Kinder schlagen; und du wirst dein Andenken von der Erde tilgen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Griechisch: Astetho; der Name erscheint in der Überlieferung auch in abweichenden Formen.'
    reason: Der Eigenname Ἀστηθώ ist in der Überlieferung bzw. Umschrift nicht einheitlich; die Anmerkung macht dies transparent.
lexical_decisions:
- source_word: σωφροσύνῃ
  choice: Selbstbeherrschung
  rationale: Bezeichnet hier sittliche Besonnenheit und insbesondere sexuelle Enthaltsamkeit; „Selbstbeherrschung“ ist im Zusammenhang klar und modern.
- source_word: θεοσεβούντων
  choice: die Gott … verehren
  rationale: Gibt die aktive Gottesverehrung des Partizips wieder, ohne es auf bloße Furcht zu verengen.
- source_word: συγγενῇ μετ᾿ ἐμοῦ
  choice: dich … mit mir vereinigst
  rationale: Bewahrt die verhüllende, aber im Kontext sexuelle Ausdrucksweise des griechischen Verbs.
- source_word: τὸ πνεῦμα τοῦ Βελίαρ
  choice: der Geist Beliars
  rationale: Übernimmt die personale bzw. geistliche Redeweise des Textes, ohne sie psychologisch umzudeuten.
- source_word: παλλακὴ
  choice: Nebenfrau
  rationale: Bezeichnet eine Frau in einer eheähnlichen, aber rangniedrigeren Verbindung; „Nebenfrau“ ist würdevoller und historisch passender als „Konkubine“.
- source_word: κονδυλίσει
  choice: wird … schlagen
  rationale: Das Verb kann das Schlagen mit der Faust bzw. Misshandeln bezeichnen; die allgemeinere Wiedergabe vermeidet unbelegte Präzisierung.
- source_word: ἀπολέσεις τὸ μνημόσυνόν σου
  choice: du wirst dein Andenken … verlieren
  rationale: Bewahrt die direkte Aussage über den Verlust ihres fortbestehenden Andenkens, statt einen Handelnden hinzuzufügen.
theological_decisions:
- issue: Gottesverehrung und Selbstbeherrschung
  choice: „die Gott in Selbstbeherrschung verehren“
  alternative: „die in Keuschheit gottesfürchtig leben“
  rationale: Die gewählte Formulierung bewahrt sowohl den kultisch-ethischen Sinn von θεοσεβέω als auch den weiteren Bedeutungsumfang von σωφροσύνη, ohne den Satz ausschließlich auf sexuelle Reinheit festzulegen.
- issue: „der Engel Abrahams“ zusammen mit Gott als Beistand
  choice: „Der Gott meiner Väter und der Engel Abrahams werden mit mir sein“
  alternative: 'Singular: „wird mit mir sein“'
  rationale: Der griechische Text hat das Verb im Singular, obwohl zwei Bezeichnungen mit καί verbunden sind. Der deutsche Plural behandelt sie grammatisch als zwei Subjekte, ohne ihre mögliche Beziehung oder Identität dogmatisch zu bestimmen.
- issue: Geist Beliars
  choice: als Geistwesen bzw. geistlichen Einfluss stehen lassen
  alternative: als bloße innere Bosheit oder Krankheit erklären
  rationale: Die ausdrücklich geistliche Ursachenzuschreibung des Erzählers wird weder naturalisiert noch zu einer ausgearbeiteten Dämonologie erweitert.
translation_notes:
  register: Moderne, würdige Erzählsprache mit klarer direkter Rede. Die Verszählung folgt der bereitgestellten POB-Einteilung 7–13, obwohl die griechische Editionszählung hier den Übergang von VI 7–9 zu VII 1–5 enthält. Der schwer verständliche Satz in Vers 9 (VII 1) wird möglichst nah als plötzliches Zusammenbrechen ohne Krankheit wiedergegeben.
