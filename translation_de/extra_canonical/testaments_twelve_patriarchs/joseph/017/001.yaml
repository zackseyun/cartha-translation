  text: See then, my children, how much I endured so that I might not put my brothers to shame.
translation:
  language: de
  text: Seht also, meine Kinder, wie viel ich ertragen habe, um meine Brüder nicht zu beschämen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρᾶτε οὖν
  choice: Seht also
  rationale: Bewahrt den auffordernden Plural von ὁρᾶτε und gibt οὖν als folgerndes „also“ natürlich wieder.
- source_word: τέκνα μου
  choice: meine Kinder
  rationale: Direkte, würdevolle Entsprechung der familiären Anrede.
- source_word: πόσα ὑπέμεινα
  choice: wie viel ich ertragen habe
  rationale: πόσα bezeichnet hier das Ausmaß des Erlittenen; ὑπέμεινα betont standhaftes Erdulden.
- source_word: ἵνα μὴ αἰσχύνω τοὺς ἀδελφούς μου
  choice: um meine Brüder nicht zu beschämen
  rationale: Die finale Bedeutung von ἵνα μή wird mit „um … nicht“ wiedergegeben; αἰσχύνω bedeutet, jemanden der Schande oder Beschämung auszusetzen.
