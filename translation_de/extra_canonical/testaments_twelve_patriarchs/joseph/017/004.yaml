source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ὅτε ⌜δὲ⌉¹³ ἦλθον οἱ ἀδελφοί μου εἰς Αἴγυπτον, αὐτοὶ¹⁴ γινώσκουσιν¹⁵ ὅτι *ἀπέστρεψα τὸ ἀργύριον αὐτοῖς¹⁶, καὶ οὐκ ὠνείδισα *αὐτούς, καὶ¹⁷ παρεκάλεσα¹⁸ ⌜αὐτούς⌉¹⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/004.yaml
  text: And when my brothers came to Egypt, they themselves know that I returned their money to them, and did not reproach them, but encouraged them.
translation:
  language: de
  text: Und als meine Brüder nach Ägypten kamen, wissen sie selbst, dass ich ihnen das Geld zurückgab, ihnen keine Vorwürfe machte, sondern ihnen Mut zusprach.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀπέστρεψα τὸ ἀργύριον αὐτοῖς
  choice: ich ihnen das Geld zurückgab
  rationale: ἀποστρέφω bezeichnet hier das Zurückgeben; ἀργύριον meint im erzählerischen Zusammenhang das Geld der Brüder, nicht bloß den Stoff Silber.
- source_word: οὐκ ὠνείδισα αὐτούς
  choice: ihnen keine Vorwürfe machte
  rationale: ὀνειδίζω bedeutet vorwerfen, schmähen oder beschimpfen. Die idiomatische deutsche Wendung bewahrt den Sinn, ohne unnötig zu verschärfen.
- source_word: παρεκάλεσα αὐτούς
  choice: ihnen Mut zusprach
  rationale: παρακαλέω hat ein breites Bedeutungsspektrum von ermahnen und bitten bis trösten oder ermutigen. Im Kontext von Josefs versöhnlichem Verhalten passt 'Mut zusprechen', während die positive Zuwendung gewahrt bleibt.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nah am griechischen Text; das betonte αὐτοί wird mit „sie selbst“ wiedergegeben. Das griechische καί vor παρεκάλεσα wird entsprechend der adversativen Sinnbeziehung natürlich mit „sondern“ übersetzt.
