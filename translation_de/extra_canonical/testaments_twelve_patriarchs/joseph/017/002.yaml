source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ὑμεῖς ⌜οὖν⌉ ἀγαπᾶτε ἀλλήλους, ⌜καὶ ἐν μακροθυμίᾳ⁴ *συγκρύπτετε ἀλλήλων⁵ τὰ ἐλαττώματα⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/002.yaml
  text: You also, therefore, love one another, and with patience conceal one another’s shortcomings.
translation:
  language: de
  text: Darum liebt auch ihr einander und deckt in Geduld die Fehler des anderen zu.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀγαπᾶτε ἀλλήλους
  choice: liebt … einander
  rationale: Gibt das gegenseitige Lieben direkt und in natürlichem modernem Deutsch wieder.
- source_word: ἐν μακροθυμίᾳ
  choice: in Geduld
  rationale: Bewahrt die instrumentale beziehungsweise begleitende Bedeutung der Wendung; μακροθυμία bezeichnet hier geduldige Nachsicht.
- source_word: συγκρύπτετε
  choice: deckt … zu
  rationale: Gibt das Verbergen oder Zudecken wieder, ohne daraus ein Gutheißen oder Leugnen der Fehler zu machen.
- source_word: ἀλλήλων τὰ ἐλαττώματα
  choice: die Fehler des anderen
  rationale: ἐλαττώματα bezeichnet Mängel, Schwächen oder Fehler; die Formulierung wahrt den wechselseitigen Sinn von ἀλλήλων und ist idiomatisch.
theological_decisions:
- issue: Reichweite des Zudeckens von Fehlern
  choice: Die Aufforderung wird ohne Zusatz als geduldiges Zudecken der Fehler des anderen wiedergegeben.
  alternative: Die Fehler einander vergeben oder über sie hinwegsehen.
  rationale: Der griechische Text spricht vom Zudecken beziehungsweise Verbergen, nicht ausdrücklich vom Vergeben. Eine entsprechende theologische Präzisierung wäre interpretierend.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp und ermahnend; „deckt … zu“ bewahrt das konkrete Bild des griechischen Verbs.
