source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ οὐχ ὕψωσα ἐμαυτὸν³⁹ ἐν αὐτοῖς ⌜ἐν ἀλαζονείᾳ⌉, διὰ τὴν ⌜κοσμικήν⌉ μου δόξαν⁴⁰, ⌜ἀλλ᾿⁴¹ ἤμην ἐν αὐτοῖς ὡς εἷς τῶν ἐλαχίστων⁴².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/008.yaml
  text: And I did not exalt myself among them in arrogance because of my worldly glory, but I was among them as one of the least.
translation:
  language: de
  text: Und ich erhob mich unter ihnen nicht in Überheblichkeit wegen meines weltlichen Ruhmes, sondern ich war unter ihnen wie einer der Geringsten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὕψωσα ἐμαυτόν
  choice: erhob mich
  rationale: Bewahrt das bildhafte und reflexive griechische Ausdrucksgefüge für Selbsterhöhung.
- source_word: ἐν ἀλαζονείᾳ
  choice: in Überheblichkeit
  rationale: Gibt die negative Bedeutung von anmaßendem Hochmut in natürlichem, würdigem Deutsch wieder.
- source_word: κοσμικήν μου δόξαν
  choice: meines weltlichen Ansehens
  rationale: κοσμικός wird mit „weltlich“ erhalten; „Ansehen“ bezeichnet hier verständlich den gesellschaftlichen Ruhm oder Status, ohne religiöse Herrlichkeit nahezulegen.
- source_word: ὡς εἷς τῶν ἐλαχίστων
  choice: wie einer der Geringsten
  rationale: Folgt dem Vergleich und bewahrt den Superlativ sowie die mögliche soziale Rangbedeutung.
theological_decisions:
- issue: Charakter der Demut Josefs
  choice: Die Aussage bleibt eine Beschreibung seines Verhaltens und seiner Stellung unter den anderen.
  alternative: Sie ausdrücklich als geistliche Selbsterniedrigung oder als Lehrsatz über Demut formulieren.
  rationale: Der griechische Text stellt Selbsterhöhung und das Sein wie einer der Geringsten gegenüber, ohne die Aussage weiter theologisch auszudeuten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die parallele Struktur „nicht … sondern“ und die genuine Spannung zwischen weltlichem Ansehen und geringer Stellung wurden bewahrt.
