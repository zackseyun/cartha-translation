base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/006.yaml
  text: And I did not allow them to be distressed even in the smallest matter; indeed, everything that was in my hand I gave to them.
translation:
  language: de
  text: Und ich ließ nicht zu, dass sie auch nur in der kleinsten Angelegenheit bedrängt wurden; ja, alles, was in meiner Hand war, gab ich ihnen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἀφῆκα αὐτοὺς θλιβῆναι
  choice: ich ließ nicht zu, dass sie … bedrängt wurden
  rationale: Gibt die Konstruktion mit ἀφίημι und passivem Infinitiv eng und zugleich natürlich wieder; θλίβω bezeichnet Bedrängnis oder Belastung.
- source_word: ἕως μικροῦ πράγματος
  choice: auch nur in der kleinsten Angelegenheit
  rationale: Die ungewöhnliche Wendung bezeichnet hier dem Kontext nach selbst eine noch so geringe Sache; die deutsche Fassung bewahrt den emphatischen Sinn, ohne eine unnatürliche Präpositionalkonstruktion nachzuahmen.
- source_word: καίγε
  choice: ja
  rationale: Gibt die emphatisch-bekräftigende und additive Kraft der Partikel wieder, ohne einen im Griechischen nicht vorhandenen Gegensatz einzuführen.
- source_word: πᾶν ὃ ἦν ἐν τῇ χειρί μου
  choice: alles, was in meiner Hand war
  rationale: Bewahrt das konkrete griechische Bild und seine mögliche Bedeutung von Besitz oder verfügbarer Verfügungsgewalt.
- source_word: αὐτοῖς δέδωκα
  choice: gab ich ihnen
  rationale: Natürliches deutsches Erzähltempus; das griechische Perfekt betont die vollzogene Gabe, ohne dass im Deutschen zwingend ein Perfekt erforderlich ist.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Formulierung „in meiner Hand“ bleibt als anschauliches und möglicherweise idiomatisches Bild erhalten; „ja“ verbindet die zweite Aussage bekräftigend mit der ersten.
