base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017/007.yaml
  text: And their sons were my sons, and my sons were as servants to them, and their souls were my soul, and every pain of theirs was my pain, and every weakness of theirs was my sickness, and their purpose was my purpose.
translation:
  language: de
  text: Und ihre Söhne waren meine Söhne, und meine Söhne waren wie ihre Sklaven. Ihre Seele war meine Seele, jeder Schmerz, den sie erlitten, war mein Schmerz, jede ihrer Schwächen war meine Krankheit, und ihr Vorhaben war mein Vorhaben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Vorhaben“ kann hier auch mit „Plan“, „Absicht“ oder „Entschluss“ wiedergegeben werden.
    reason: Das griechische βουλή besitzt eine Bedeutungsbreite, die sich nicht vollständig in einem einzelnen deutschen Wort abbilden lässt.
lexical_decisions:
- source_word: δοῦλοι
  choice: Sklaven
  rationale: Die direkte Bedeutung von δοῦλος ist „Sklave“; die Formulierung „wie ihre Sklaven“ bewahrt zugleich den Vergleich ὡς.
- source_word: ἡ ψυχὴ αὐτῶν
  choice: ihre Seele
  rationale: Der griechische Text verwendet trotz des pluralischen Bezugs das Substantiv ψυχή im Singular; der deutsche Singular bewahrt diese kollektive Ausdrucksweise.
- source_word: πᾶν ἄλγημα αὐτῶν
  choice: jeder Schmerz, den sie erlitten
  rationale: Diese natürliche deutsche Wendung gibt den ihnen zugehörigen beziehungsweise von ihnen erlittenen Schmerz wieder, ohne eine unidiomatische Genitivkonstruktion zu erzwingen.
- source_word: πᾶσα μαλακία αὐτῶν ἀσθένειά μου
  choice: jede ihrer Schwächen war meine Krankheit
  rationale: μαλακία bezeichnet hier Schwäche oder Gebrechlichkeit, ἀσθένεια Krankheit beziehungsweise Schwäche. Die unterschiedliche Wortwahl im Deutschen erhält die Abstufung des griechischen Textes.
- source_word: ἡ βουλὴ αὐτῶν βουλή μου
  choice: ihr Vorhaben war mein Vorhaben
  rationale: βουλή kann Rat, Entschluss, Plan oder Absicht bedeuten. „Vorhaben“ ist im Zusammenhang natürlich und lässt sowohl Absicht als auch Plan anklingen.
theological_decisions:
- issue: Kollektiver Singular bei ψυχή
  choice: „Ihre Seele war meine Seele“
  alternative: „Ihre Seelen waren meine Seele“
  rationale: Der Singular des griechischen Hauptworts wird nicht nach dem pluralischen Bezug geglättet; so bleibt die Aussage ihrer gemeinsamen inneren Verbundenheit in ihrer sprachlichen Spannung erhalten.
- issue: Sozialer Status in δοῦλοι
  choice: „Sklaven“
  alternative: „Diener“
  rationale: Die stärkere, historisch konkrete Bedeutung wird bewahrt, ohne die Aussage konfessionell oder metaphorisch umzudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur des griechischen Textes bleibt erkennbar; leicht idiomatische Umstellungen vermeiden zugleich schwerfällige Genitivketten.
