review_pass:
  verdict: revise
  source_fidelity: 'Die Wiedergabe von ὁμονοίᾳ ἀδελφῶν ist zutreffend. Bei προαιρέσει καρδίας ἀγαθῆς sollte jedoch ἀγαθῆς unmittelbar als Bestimmung von καρδίας erkennbar bleiben: „Absicht eines guten Herzens“, nicht „gute Absicht des Herzens“. Der überlieferte Schlussteil εὐδοκοῦσιν εἰς ἀγαθόν enthält ein plurales aktives Verb und ist syntaktisch schwierig; „beides ist ... wohlgefällig“ gibt weder Numerus noch Diathese gut wieder.'
  naturalness: „Zum Guten hin wohlgefällig“ ist im modernen Standarddeutsch unidiomatisch und lässt zudem offen, wem etwas wohlgefällig sein soll. „Sie sind dem Guten zugeneigt“ ist natürlich, bildet den pluralischen Bezug ab und legt die problematische Konstruktion nicht übermäßig aus.
  terminology: „Eintracht unter Brüdern“ und „Absicht“ sind angemessen. „Gutes Herz“ ist hier keine konfessionell festgelegte Kategorie, sondern eine unmittelbare Wiedergabe von καρδίας ἀγαθῆς.
  issues:
  - severity: medium
    issue: Der Bezug von „gut“ wird verschoben.
    rationale: Im Griechischen bestimmt ἀγαθῆς grammatisch καρδίας („eines guten Herzens“). Die Fassung „gute Absicht des Herzens“ macht stattdessen die Absicht gut.
  - severity: medium
    issue: Der schwierige Schlussteil wird grammatisch ungenau und unnatürlich wiedergegeben.
    rationale: εὐδοκοῦσιν ist Plural und aktiv. „Beides ist ... wohlgefällig“ ist Singular/Neutrum und passivisch geprägt; „zum Guten hin wohlgefällig“ ist zudem kein geläufiges Deutsch.
  revised_text: Denn Gott freut sich über die Eintracht unter Brüdern und über die Absicht eines guten Herzens; sie sind dem Guten zugeneigt.[a]
