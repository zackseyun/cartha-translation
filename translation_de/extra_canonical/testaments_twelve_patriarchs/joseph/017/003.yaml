translation:
  language: de
  text: Denn Gott freut sich über die Eintracht unter Brüdern und über die Absicht eines guten Herzens; sie sind dem Guten zugeneigt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der überlieferte griechische Schlussteil ist grammatisch schwierig: εὐδοκοῦσιν steht im Plural und bedeutet etwa „sie sind wohlgesinnt/zugeneigt“, während εἰς ἀγαθόν wörtlich „zum Guten hin“ lautet. Der Bezug von „sie“ und die genaue Satzfügung bleiben unsicher.'
    reason: Die Fußnote erläutert die textliche und syntaktische Unsicherheit, ohne den unsicheren Bezug oder die genaue Bedeutung von εἰς ἀγαθόν dogmatisch festzulegen.
lexical_decisions:
- source_word: ὁμονοίᾳ ἀδελφῶν
  choice: Eintracht unter Brüdern
  rationale: ὁμόνοια bezeichnet Übereinstimmung und einträchtiges Zusammenleben; „unter Brüdern“ gibt den Genitiv ἀδελφῶν im unmittelbaren Zusammenhang präzise und natürlich wieder.
- source_word: προαιρέσει καρδίας ἀγαθῆς
  choice: gute Absicht des Herzens
  rationale: προαίρεσις meint eine bewusste Absicht oder Willensentscheidung. Die Formulierung folgt der naheliegenden Zuordnung von ἀγαθῆς zur gesamten Wendung, ohne sie unnötig auszudeuten.
- source_word: εὐδοκοῦσιν εἰς ἀγαθόν
  choice: beides ist zum Guten hin wohlgefällig
  rationale: Die Wiedergabe bewahrt sowohl den Gedanken des Wohlgefallens als auch die Zielrichtung εἰς ἀγαθόν. „Beides“ nimmt die beiden zuvor genannten Größen auf, während die Fußnote auf die sprachliche Unsicherheit hinweist.
theological_decisions:
- issue: Bezug des Wohlgefallens im letzten Satzteil
  choice: Der Satz lässt offen, wem die Eintracht und die gute Absicht wohlgefällig sind, wobei der vorausgehende Gottesbezug bestehen bleibt.
  alternative: 'Ausdrücklich ergänzen: „beides gefällt Gott und dient dem Guten“.'
  rationale: Eine ausdrückliche Wiederholung Gottes und die Deutung als „dient/führt zum Guten“ würden den schwierigen griechischen Wortlaut stärker festlegen, als es die Textgrundlage erlaubt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nah am griechischen Satzbau, vermeidet aber unnatürliche Wörtlichkeit; die textkritische Schwierigkeit des Schlusses wird nicht stillschweigend aufgelöst.
