    text: 'Der überlieferte griechische Schlussteil ist grammatisch schwierig: εὐδοκοῦσιν steht im Plural und bedeutet etwa „sie sind wohlgesinnt/zugeneigt“, während εἰς ἀγαθόν wörtlich „zum Guten hin“ lautet. Der Bezug von „sie“ und die genaue Satzfügung bleiben unsicher.'
