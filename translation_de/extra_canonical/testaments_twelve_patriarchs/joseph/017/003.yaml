revisions:
- from: Denn Gott freut sich über die Eintracht unter Brüdern und über die gute Absicht des Herzens; beides ist zum Guten hin wohlgefällig.[a]
  to: Denn Gott freut sich über die Eintracht unter Brüdern und über die Absicht eines guten Herzens; sie sind dem Guten zugeneigt.[a]
  rationale: Die Revision stellt die grammatische Zuordnung von ἀγαθῆς zu καρδίας wieder her und ersetzt die unidiomatische, grammatisch ungenaue Wiedergabe des überlieferten Schlusses durch eine natürliche deutsche Formulierung. Die verbleibende syntaktische Unsicherheit wird ausdrücklich in der Fußnote dokumentiert.
