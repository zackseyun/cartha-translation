lexical_decisions:
- source_word: Τότε οὖν
  choice: Da … also
  rationale: Gibt die zeitliche Folge von τότε und den folgernden beziehungsweise zusammenfassenden Ton von οὖν natürlich wieder.
- source_word: ἐβουλεύσαντο
  choice: beschlossen sie
  rationale: Das Medium bezeichnet hier eine gemeinsam gefasste Beratung beziehungsweise Entscheidung; „beschlossen“ ist präzise und idiomatisch.
- source_word: πωλῆσαί με
  choice: mich zu verkaufen
  rationale: Direkte Wiedergabe des Aoristinfinitivs als Inhalt ihres Beschlusses.
- source_word: ἵνα μὴ εὑρεθῶ
  choice: damit ich nicht … gefunden würde
  rationale: Bewahrt die finale Konstruktion und das Passiv des griechischen Textes.
- source_word: ἐν ταῖς χερσὶν αὐτῶν
  choice: in ihren Händen
  rationale: Erhält das konkrete Bild und seine mögliche Bedeutung von Besitz, Gewalt oder Verantwortlichkeit, ohne es einengend auszulegen.
theological_decisions:
- issue: Bedeutung der Wendung „in ihren Händen gefunden werden“
  choice: Bildhafte Formulierung wörtlich bewahrt
  alternative: „damit sich nicht herausstellte, dass sie mich in ihrer Gewalt hatten“
  rationale: Der griechische Ausdruck lässt mehrere Nuancen zu. Die wörtlich-nahe deutsche Wiedergabe bewahrt diese Mehrdeutigkeit und vermeidet eine interpretierende Festlegung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung ist natürlich, während die knappe Erzählweise und das Hand-Bild des griechischen Ausgangstextes erhalten bleiben.
