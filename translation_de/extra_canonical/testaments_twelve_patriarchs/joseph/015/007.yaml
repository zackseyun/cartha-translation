  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/007.yaml
  text: And they came near and asked me, saying, “Say that you were bought by us with silver, and he will release us.”
translation:
  language: de
  text: 'Da traten sie zu mir und baten mich: »Sag, dass wir dich mit Silber gekauft haben; dann wird er uns freilassen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσελθόντες
  choice: traten sie zu mir
  rationale: Gibt das Herantreten in natürlichem, zugleich würdigem Deutsch wieder.
- source_word: ᾔτουν με
  choice: baten mich
  rationale: Das Imperfekt bezeichnet die an Joseph gerichtete Bitte; eine ausdrücklich fortdauernde Wiedergabe ist im Deutschen hier nicht nötig.
- source_word: ἐν ἀργυρίῳ
  choice: für Silber
  rationale: Bezeichnet idiomatisch das als Kaufpreis verwendete Silber und wahrt gegenüber dem allgemeineren »Geld« den konkreten Wortlaut.
- source_word: ἠγοράσθης ἡμῖν
  choice: wir dich … gekauft haben
  rationale: Die aktive deutsche Form gibt den Sinn der griechischen Passivkonstruktion mit dem beteiligten Dativ natürlich wieder.
- source_word: κἀκεῖνος ἀπολῦσαι ἡμᾶς ἔχει
  choice: dann wird er uns freilassen
  rationale: Die Konstruktion ἔχει mit Infinitiv trägt hier futurischen Sinn; »dann« macht den aus der Aufforderung folgenden Zusammenhang idiomatisch deutlich.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in natürlicher, würdiger Erzählsprache. Die direkte Rede bleibt knapp und verständlich; es sind keine Fußnoten erforderlich.
