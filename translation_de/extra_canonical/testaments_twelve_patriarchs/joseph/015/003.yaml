    rationale: Das griechische Verb bezeichnet Auflösung bzw. Zergehen, nicht primär Zerreißen. Die Bildsprache sollte daher ohne diesen Bedeutungswechsel wiedergegeben werden.
  - severity: low
    issue: „bitterlich“ für πάνυ
    rationale: „Bitterlich“ kann eine zusätzliche qualitative Nuance eintragen; πάνυ verstärkt hier lediglich den Wunsch zu weinen.
  - severity: low
    issue: „damit ich ... nicht beschämte“
    rationale: Der Imperfekt-/Konjunktiv-II-Form ist verständlich, aber „damit ich ... nicht beschäme“ bildet den finalen Konjunktiv des griechischen ἵνα-Satzes im heutigen Standarddeutsch klarer ab.
