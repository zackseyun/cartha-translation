  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/003.yaml
  text: When I heard these things, my inward parts were torn apart, and my heart melted, and I wanted very much to weep. But I restrained myself, so that I might not put my brothers to shame. And I said to them, “I do not know; I am a servant.”
translation:
  language: de
  text: 'Als ich das hörte, löste sich mir das Innerste auf, und mein Herz schmolz dahin. Ich wollte sehr weinen, hielt mich aber zurück, damit ich meine Brüder nicht beschäme. Und ich sagte ihnen: „Ich weiß es nicht; ich bin ein Sklave.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διελύθη τὰ σπλάγχνα μου
  choice: es zerriss mir das Innerste
  rationale: Gibt die starke körperlich-emotionale Bildsprache natürlich wieder, ohne sie auf ein bestimmtes Gefühl zu verengen.
- source_word: ἡ καρδία μου ἐτάκη
  choice: mein Herz schmolz dahin
  rationale: Bewahrt die Metapher des griechischen Textes und ihren Ausdruck innerer Erschütterung.
- source_word: ἤθελον δακρῦσαι πάνυ
  choice: ich wollte bitterlich weinen
  rationale: Vermittelt die Intensität von πάνυ in idiomatischem, würdigem Deutsch.
- source_word: ἐπέσχον ἐμαυτόν
  choice: hielt mich aber zurück
  rationale: Natürliche und genaue Wiedergabe bewusster Selbstbeherrschung.
- source_word: αἰσχύνω τοὺς ἀδελφούς μου
  choice: meine Brüder nicht beschämte
  rationale: Bewahrt den möglichen sozialen Sinn von αἰσχύνω, ohne ihn als bloßes Verlegenmachen abzuschwächen.
- source_word: δοῦλός εἰμι
  choice: ich bin ein Sklave
  rationale: δοῦλος bezeichnet hier angesichts von Josephs Lage einen Sklaven; „Diener“ würde den sozialen Status abschwächen.
