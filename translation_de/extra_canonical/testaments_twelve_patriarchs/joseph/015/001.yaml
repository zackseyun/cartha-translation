source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἤθελε γὰρ ὁρᾶν με²⁴ ἐν πόθῳ ⌈ἁμαρτίας⌉²⁵. *ἐγὼ δὲ²⁶ ἠγνόουν ἐν²⁷ πᾶσι τούτοις²⁸. *Εἶπε δὲ πρὸς αὐτήν²⁹· Οὐκ ἐστὶ *τοῦτο τοῖς³⁰ Αἰγυπτίοις πρὸ ἀποδείξεως ἀφαιρεῖσθαι τὰ ἀλλότρια. Ταῦτα ⌜οὖν⌉³¹ εἶπε *περὶ τοῦ μεταβόλου³². *Ὁ δὲ παῖς³³ *ὀφείλει ἐγκατάκλειστος εἶναι³⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/001.yaml
  text: For she wanted to see me in sinful desire, but I was unaware of all these things. And he said to her, “This is not the custom among the Egyptians, to take what belongs to others before proof is given.” So he said this concerning the merchant. But the boy ought to be kept confined.
translation:
  language: de
  text: 'Denn sie wollte mich in sündigem Verlangen sehen,[a] doch ich wusste von all dem nichts. Er aber sagte zu ihr: „Bei den Ägyptern ist es nicht üblich, fremdes Eigentum an sich zu nehmen, bevor ein Beweis erbracht ist.“ Das sagte er nun in Bezug auf den Händler.[b] Der Junge aber soll eingesperrt bleiben.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „im Verlangen der Sünde“. Das Wort „Sünde“ ist in der vorgelegten griechischen Edition eingeklammert und daher textkritisch unsicher.'
    reason: Die Anmerkung bewahrt sowohl die Genitivkonstruktion als auch die im Editionswortlaut markierte Unsicherheit.
  - marker: b
    text: Das griechische Wort kann einen Händler oder Zwischenhändler bezeichnen; in abweichender Überlieferung bzw. Deutung wird der Satz auf einen Tausch bezogen.
    reason: Die Stelle ist textlich und lexikalisch unsicher; die Fußnote macht die ernsthafte Alternative sichtbar.
lexical_decisions:
- source_word: ἐν πόθῳ ἁμαρτίας
  choice: in sündigem Verlangen
  rationale: Gibt die wörtliche Konstruktion „im Verlangen der Sünde“ in natürlichem Deutsch wieder, ohne die sexuelle oder moralische Spannung des Zusammenhangs abzuschwächen.
- source_word: ἠγνόουν
  choice: ich wusste … nichts
  rationale: Bezeichnet hier Unwissen bzw. fehlende Kenntnis; die idiomatische deutsche Wendung passt zu πᾶσι τούτοις.
- source_word: τὰ ἀλλότρια
  choice: fremdes Eigentum
  rationale: Das substantivierte Neutrum Plural meint Dinge, die anderen gehören; die Kollektivform ist im Deutschen prägnant und wahrt diesen Sinn.
- source_word: πρὸ ἀποδείξεως
  choice: bevor ein Beweis erbracht ist
  rationale: Bewahrt den juristisch anmutenden Sinn von ἀπόδειξις als Nachweis oder Beweis, ohne genauer festzulegen, worin dieser besteht.
- source_word: μεταβόλου
  choice: Händler
  rationale: Der Genitiv bezeichnet am wahrscheinlichsten einen Händler bzw. Zwischenhändler; „Tausch“ wäre eine weniger wahrscheinliche sachliche Deutung.
- source_word: ἐγκατάκλειστος
  choice: eingesperrt
  rationale: Gibt das Gefangen- bzw. Eingeschlossensein klar und in heutigem Deutsch wieder.
theological_decisions:
- issue: Art des Verlangens
  choice: sündiges Verlangen
  alternative: Verlangen nach Sünde
  rationale: Die Genitivverbindung bleibt semantisch offen, wird aber idiomatisch wiedergegeben; keine bestimmte Sündenlehre oder nähere sexuelle Handlung wird in den Text eingetragen.
- issue: Wechsel der Sprecherreferenz
  choice: Er aber sagte … Das sagte er
  alternative: Ich aber sagte … Das sagte ich
  rationale: Der überlieferte griechische Haupttext hat die dritte Person εἶπε und αὐτήν. Der dadurch entstehende Spannungs- bzw. Überlieferungsbefund wird nicht nach dem englischen Konsultationstext stillschweigend zur ersten Person geändert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah am Griechischen, wird aber für gewöhnliche Leser geglättet. Der auffällige Wechsel zur dritten Person wird als Quellenbefund bewahrt; die Schlusswendung mit „soll“ hält den normativen Charakter von ὀφείλει fest.
