  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/005.yaml
  text: For they feared my father, lest he come among them and take vengeance for the danger; for they had heard that he was great before God and men.
translation:
  language: de
  text: Denn sie fürchteten meinen Vater, er könnte in ihre Mitte kommen und Vergeltung für die Gefahr üben.[a] Denn sie hatten gehört, dass er bei Gott und Menschen groß sei.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Vergeltung der Gefahr«. Der Genitiv kann die Vergeltung für eine Gefahr bezeichnen; im Zusammenhang könnte eine ihm drohende Gefahr oder ein gegen ihn gerichteter Anschlag gemeint sein.'
    reason: κινδύνου bestimmt ἐκδίκησιν in einer knappen, semantisch nicht eindeutig festgelegten Genitivverbindung.
lexical_decisions:
- source_word: ἐλθὼν ἐν αὐτοῖς
  choice: zu ihnen kommen
  rationale: Gibt die Bewegung in ihre Mitte natürlich wieder, ohne das im Deutschen schwerfällige »unter sie kommen« zu erzwingen.
- source_word: ποιήσῃ ἐκδίκησιν
  choice: Vergeltung … üben
  rationale: Bewahrt den forensisch-vergeltenden Sinn der Wendung, ohne ausdrücklich festzulegen, ob eine persönliche Rache oder eine gerechte Ahndung gemeint ist.
- source_word: κινδύνου
  choice: für die Gefahr
  rationale: Entspricht dem Genitiv eng und erhält dessen knappe, im Kontext nicht völlig eindeutige Beziehung.
- source_word: μέγας ἐστὶ παρὰ Θεῷ καὶ ἀνθρώποις
  choice: bei Gott und bei den Menschen großes Ansehen genoss
  rationale: Natürliches modernes Deutsch für die relationale Aussage, dass der Vater vor Gott und Menschen als groß beziehungsweise hoch angesehen galt.
theological_decisions:
- issue: Bedeutung von μέγας bei Gott und Menschen
  choice: großes Ansehen genoss
  alternative: groß war
  rationale: Die Formulierung bezeichnet hier wahrscheinlich Rang oder Geltung. Die Übersetzung vermeidet dennoch eine konfessionelle oder dogmatische Ausdeutung.
- issue: Charakter der ἐκδίκησις
  choice: Vergeltung
  alternative: Rache
  rationale: »Vergeltung« lässt offen, ob das Handeln als persönliche Rache oder als Ahndung eines Unrechts verstanden wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt bildet die Befürchtung klar ab; »nämlich« erhält den begründenden Zusammenhang des zweiten γάρ. Die ungewöhnliche Wendung ἐκδίκησιν κινδύνου wird im Text eng wiedergegeben und in der Fußnote als mehrdeutig kenntlich gemacht.
