    issue: Räumliche Nuance von ἐν αὐτοῖς
    rationale: »zu ihnen kommen« bezeichnet die Bewegung zu einer Gruppe, während ἐν αὐτοῖς zusätzlich die Anwesenheit in ihrer Mitte ausdrückt. »in ihre Mitte kommen« erhält diese Nuance.
  - severity: medium
    issue: Interpretierende und zeitlich verschobene Wiedergabe von μέγας ἐστὶ
    rationale: »großes Ansehen genoss« macht aus dem prädikativen »groß ist« eine Aussage über genossenes Ansehen und verwendet Präteritum. »bei Gott und Menschen groß sei« ist näher am griechischen Wortlaut und weniger einengend.
