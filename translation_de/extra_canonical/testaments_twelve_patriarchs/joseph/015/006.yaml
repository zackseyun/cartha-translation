  text: Then the trader said to them, “Free me from the judgment of Potiphar.”
translation:
  language: de
  text: 'Da sagte der Händler zu ihnen: »Befreit mich von dem Urteil Potifars.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετάβολος
  choice: Händler
  rationale: Das Substantiv bezeichnet hier im Erzählzusammenhang den Händler beziehungsweise Zwischenhändler; »Händler« ist natürliches, allgemein verständliches Deutsch.
- source_word: Λύσατέ με
  choice: Befreit mich
  rationale: Die Wendung gibt die Bitte um Loslösung beziehungsweise Befreiung unmittelbar wieder.
- source_word: κρίσεως
  choice: Urteil
  rationale: »Urteil« bewahrt den gerichtlichen Sinn von κρίσις im Zusammenhang mit Potifar, ohne genauer festzulegen, ob Urteilsspruch, Gerichtsverfahren oder Verurteilung gemeint ist.
- source_word: Πεντεφρί
  choice: Potifar
  rationale: Verwendet die im Deutschen geläufige biblische Namensform für die griechische Namensform Πεντεφρί.
