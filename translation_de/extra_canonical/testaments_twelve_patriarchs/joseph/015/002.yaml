  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/015/002.yaml
  text: “Why did you say that you were a servant? For behold, we have learned that you are the son of a great man in the land of Canaan, and that your father is still mourning for you in sackcloth and ashes.”
translation:
  language: de
  text: „Warum hast du gesagt, du seist ein Sklave? Sieh doch, wir haben erfahren, dass du der Sohn eines bedeutenden Mannes im Land Kanaan bist und dass dein Vater noch immer in Sack und Asche um dich trauert.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλον
  choice: Sklave
  rationale: Das griechische Wort bezeichnet hier einen unfreien Menschen; „Diener“ würde den sozialen Status abschwächen.
- source_word: ἀνδρὸς μεγάλου
  choice: eines bedeutenden Mannes
  rationale: „Bedeutend“ gibt μέγας in Bezug auf gesellschaftliches Ansehen natürlich wieder, ohne zwingend körperliche Größe oder moralische Wertung anzunehmen.
- source_word: πενθεῖ
  choice: trauert
  rationale: Das Verb bezeichnet anhaltende Trauer um einen vermeintlich Verstorbenen oder Verlorenen.
- source_word: ἐν σάκκῳ καὶ σποδῷ
  choice: in Sack und Asche
  rationale: Die geläufige deutsche Wendung bewahrt das antike Trauerritual und die Bildsprache des griechischen Textes.
theological_decisions:
- issue: Status Josephs als δοῦλος
  choice: Sklave
  alternative: Diener
  rationale: Die stärkere soziale Bedeutung des Ausgangswortes wird bewahrt; eine theologische Umdeutung ist nicht erforderlich.
translation_notes:
  register: Moderne, würdige Standardsprache. „Sieh doch“ vermittelt ἰδού als nachdrücklichen Aufmerksamkeitshinweis; der Satzbau bleibt klar und mündlich plausibel.
