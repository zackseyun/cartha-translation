  source_fidelity: 'Die Übersetzung gibt die griechische Ermahnung vollständig und in ihrer Satzlogik wieder: οὖν als folgerndes „Darum“, die Anrede „meine Kinder“, die umfassende Wendung ἐν πάσῃ πράξει ὑμῶν, das Bild des Vor-Augen-Habens, den Imperativ zur Ehrung der Brüder sowie die begründende Zukunftsaussage über denjenigen, der das Gesetz des Herrn tut. „wird von ihm geliebt werden“ bewahrt korrekt das griechische Futurpassiv; das Pronomen ist im Kontext auf den Herrn bezogen.'
