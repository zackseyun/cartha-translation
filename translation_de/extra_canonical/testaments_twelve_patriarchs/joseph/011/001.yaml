base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/011/001.yaml
  text: And so, my children, in every deed of yours keep the fear of God before your eyes, and honor your brothers; for everyone who does the law of the Lord will be loved by him.
translation:
  language: de
  text: Darum, meine Kinder, habt bei allem, was ihr tut, die Ehrfurcht vor Gott vor Augen und ehrt eure Brüder; denn jeder, der das Gesetz des Herrn befolgt, wird von ihm geliebt werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸν τοῦ θεοῦ φόβον
  choice: die Ehrfurcht vor Gott
  rationale: Das griechische φόβος kann Furcht wie auch ehrfürchtige Gottesachtung bezeichnen. Im ethischen Mahnkontext gibt „Ehrfurcht“ den Sinn natürlich wieder, ohne bloße Angst nahezulegen.
- source_word: ἐν πάσῃ πράξει ὑμῶν
  choice: bei allem, was ihr tut
  rationale: Eine natürliche moderne Wiedergabe von „in jeder eurer Handlungen“, die den umfassenden Anspruch bewahrt.
- source_word: τιμᾶτε
  choice: ehrt
  rationale: Entspricht dem Imperativ „erweist Ehre“ und erhält den würdigen ethischen Ton.
- source_word: ποιῶν νόμον Κυρίου
  choice: der das Gesetz des Herrn befolgt
  rationale: Wörtlich „das Gesetz des Herrn tut“. „Befolgt“ ist im Deutschen idiomatisch und bewahrt den Gedanken tätigen Gehorsams.
- source_word: ἀγαπηθήσεται ὑπʼ αὐτοῦ
  choice: wird von ihm geliebt werden
  rationale: Bewahrt das Passiv und den Zukunftsbezug des griechischen Textes; „ihm“ bezieht sich am naheliegendsten auf den Herrn.
theological_decisions:
- issue: Bedeutung von Gottesfurcht
  choice: Ehrfurcht vor Gott
  alternative: Furcht vor Gott
  rationale: „Ehrfurcht“ vermeidet im modernen Deutsch das mögliche Missverständnis lähmender Angst, während die Haltung respektvollen Gehorsams erhalten bleibt.
- issue: Aussage über Gesetzesgehorsam und Gottes Liebe
  choice: Die kausale Verknüpfung und das Futur bleiben unverändert stehen.
  alternative: Eine abschwächende oder erklärende Umschreibung, wonach Gehorsam lediglich Gottes bereits bestehende Liebe sichtbar mache
  rationale: Der Ausgangstext verbindet das Tun des Gesetzes ausdrücklich mit dem zukünftigen Geliebtwerden. Diese theologische Spannung darf nicht stillschweigend aufgelöst werden.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem paränetischem Ton. Die Anrede „meine Kinder“ und die koordinierte Satzstruktur des Griechischen bleiben erhalten.
