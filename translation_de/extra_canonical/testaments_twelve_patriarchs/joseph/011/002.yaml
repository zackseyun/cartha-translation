base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/011/002.yaml
  text: And when I was coming with the Ishmaelites, they kept asking me, saying, “Are you a servant?” And I said that I was a household servant, so that I might not put my brothers to shame.
translation:
  language: de
  text: 'Als ich mit den Ismaelitern unterwegs war, fragten sie mich immer wieder: »Bist du ein Sklave?« Ich antwortete: »Ich bin ein Haussklave«, damit ich meine Brüder nicht beschäme.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐρχόμενος
  choice: als ich … unterwegs war
  rationale: Das Partizip bezeichnet hier im Zusammenhang die Reise mit den Ismaelitern; die natürliche deutsche Wiedergabe wahrt den begleitenden Vorgang.
- source_word: ἐπηρώτων
  choice: fragten sie mich immer wieder
  rationale: Das Imperfekt legt eine wiederholte oder anhaltende Befragung nahe.
- source_word: Δοῦλος / δοῦλος
  choice: Sklave
  rationale: δοῦλος bezeichnet in diesem Kontext nicht bloß einen freiwilligen Diener, sondern einen Menschen in Unfreiheit; »Sklave« gibt dies präziser wieder.
- source_word: ἐξ οἴκου
  choice: im Haus geboren
  rationale: Wörtlich etwa »aus dem Haus«; im Zusammenhang dient die Wendung wahrscheinlich dazu, Joseph als zum Haushalt gehörenden, dort geborenen Sklaven darzustellen. Die Formulierung bleibt knapp und verständlich.
- source_word: αἰσχύνω
  choice: beschämte
  rationale: Das Verb bezeichnet das Zufügen von Schande oder Beschämung und bewahrt Josephs Motiv, seine Brüder nicht öffentlich bloßzustellen.
theological_decisions:
- issue: Josephs Schutz seiner Brüder trotz ihres Handelns
  choice: damit ich meine Brüder nicht beschämte
  alternative: damit ich keine Schande über meine Brüder brachte
  rationale: Die direkte Wiedergabe wahrt die ethische Spannung des Textes, ohne Josephs Motiv weiter auszudeuten oder zu harmonisieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist natürlich formuliert; der wiederholte Charakter der Befragung wird ausdrücklich wiedergegeben. »Sklave« vermeidet die verharmlosende Mehrdeutigkeit von »Diener«.
