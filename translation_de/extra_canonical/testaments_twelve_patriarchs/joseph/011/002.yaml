review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von ἐπηρώτων als wiederholtes Fragen und von δοῦλος als „Sklave“ ist zutreffend. Die Zweckkonstruktion ἵνα μὴ αἰσχύνω verlangt jedoch im Deutschen eine präsentische Zweckform („damit ich ... nicht beschäme“). Zudem besagt ἐξ οἴκου wörtlich „aus einem Haushalt/Haus“ und nicht ausdrücklich, dass Joseph dort geboren wurde; „im Haus geboren“ fügt eine nicht im griechischen Wortlaut ausgedrückte Information hinzu.
  naturalness: Die Überarbeitung bleibt modernes, würdiges Standarddeutsch. Direkte Rede macht Josephs Antwort klar; „Haussklave“ ist eine natürliche knappe Bezeichnung für einen einem Haushalt zugeordneten Sklaven.
  terminology: „Ismaeliter“ und „Sklave“ sind angemessen. „Haussklave“ gibt ἐξ οἴκου ohne die zusätzliche Behauptung einer Geburt im Haus wieder. „Beschäme“ entspricht αἰσχύνω im Zweckzusammenhang.
  issues:
  - severity: medium
    issue: „im Haus geborener Sklave“ ergänzt eine Geburtsangabe.
    rationale: ἐξ οἴκου bedeutet „aus einem Haus/Haushalt“; eine Geburt wird im griechischen Text nicht ausdrücklich genannt.
  - severity: medium
    issue: „damit ich meine Brüder nicht beschämte“ bildet den Zweck des griechischen ἵνα-Satzes nicht korrekt ab.
    rationale: Der griechische Konjunktiv αἰσχύνω steht nach ἵνα und bezeichnet Josephs beabsichtigtes Ziel, nicht eine vergangene indikativische Handlung.
  revised_text: 'Als ich mit den Ismaelitern unterwegs war, fragten sie mich immer wieder: »Bist du ein Sklave?« Ich antwortete: »Ich bin ein Haussklave«, damit ich meine Brüder nicht beschäme.'
