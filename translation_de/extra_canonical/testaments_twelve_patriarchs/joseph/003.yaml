lexical_decisions:
- source_word: δόκιμον ἀπέδειξέ με
  choice: erwies er mich als bewährt
  rationale: Die Formulierung bewahrt sowohl den nicht ausdrücklich genannten Handelnden als auch das Motiv, sich in Prüfungen als bewährt zu erweisen.
- source_word: μακροθυμία / ἐμακροθύμησα
  choice: Langmut / hielt ich geduldig stand
  rationale: „Langmut“ trägt im Lehrsatz die Tugendbezeichnung; die verbale Wendung wird im Deutschen natürlicher als standhaftes, geduldiges Ertragen wiedergegeben.
- source_word: ὑπομονή
  choice: beharrliches Ausharren
  rationale: Damit bleibt der Ausdruck von μακροθυμία unterschieden und bezeichnet ausdauerndes Standhalten.
- source_word: φάρμακον
  choice: wirksames Heilmittel
  rationale: Die medizinische Metapher bleibt sichtbar; „wirksam“ verdeutlicht idiomatisch die positive Wertung μέγα, ohne eine vollständige Heilung zu behaupten.
- source_word: συνελθεῖν αὐτῇ
  choice: mit ihr schlafen
  rationale: Der griechische Euphemismus bezeichnet hier eindeutig den von der Frau verlangten Geschlechtsverkehr. Die moderne deutsche Wendung ist klar, würdig und nicht derb.
- source_word: κυριεύσεις
  choice: du wirst … herrschen
  rationale: Die angebotene Machtstellung wird direkt wiedergegeben und mit „Gebieter“ im folgenden Satz semantisch verbunden.
- source_word: ἐπιδῷς ἑαυτὸν εἰς ἐμέ
  choice: wenn du dich mir hingibst
  rationale: Die Formulierung wahrt sowohl die sexuelle als auch die manipulative Dimension des Angebots.
- source_word: ταμεῖον
  choice: Kammer
  rationale: Gemeint ist ein abgeschlossener innerer Raum, in den Joseph sich zum Gebet zurückzieht.
- source_word: ἐν τρυφῇ διάγων
  choice: wie jemand, der im Überfluss lebt
  rationale: Die Übersetzung bringt den ironischen Gegensatz zwischen Fasten und einem äußerlich üppigen, wohlausgestatteten Leben natürlich zum Ausdruck.
- source_word: τοῦ προσώπου τὴν χάριν
  choice: Anmut des Angesichts
  rationale: Die konkrete Aussage über eine sichtbar anmutige Erscheinung bleibt erhalten, ohne sie zu bloßer Schönheit oder göttlicher Gunst umzudeuten.
- source_word: τριημερίζων
  choice: nur jeden dritten Tag
  rationale: Im asketischen Zusammenhang ist eine dreitägige Fastenordnung gemeint; die genaue zeitliche Zählung bleibt in einer Fußnote offen.
- source_word: λόγῳ ἐπισκέψεως
  choice: unter dem Vorwand, nach mir zu sehen
  rationale: Die Wendung bezeichnet einen Besuch beziehungsweise eine Nachschau als vorgeschobenen Grund ihres nächtlichen Kommens.
- source_word: προσεποιεῖτο
  choice: tat sie so, als ob …
  rationale: Da der überlieferte Ausschnitt an dieser Stelle syntaktisch unvollständig endet, wird die Unabgeschlossenheit sichtbar bewahrt und nicht ergänzt.
theological_decisions:
- issue: Nicht genannter Handelnder bei Josephs Bewährung
  choice: „er erwies mich als bewährt“ mit kleingeschriebenem Pronomen
  alternative: „Gott erwies mich als bewährt“
  rationale: Das griechische Verb hat in diesem Ausschnitt kein ausdrücklich genanntes Subjekt. Eine Identifizierung mit Gott wäre möglich, würde die vorliegende sprachliche Offenheit aber auflösen.
- issue: κύριος im Gebet und für Josephs irdischen Herrn
  choice: im Gebet „der Herr“, in Vers 5 „mein Herr“
  alternative: „Gott“ beziehungsweise „mein Gebieter“
  rationale: Der Kontext unterscheidet den göttlichen Herrn, an den Joseph sich im Gebet wendet, von seinem menschlichen Hausherrn. Das gleiche deutsche Grundwort erhält die bewusste lexikalische Verbindung des Griechischen.
- issue: Wirkung des Fastens auf das Angesicht
  choice: „wer um Gottes willen fastet, empfängt Anmut des Angesichts“
  alternative: „erlangt ein schönes Aussehen“
  rationale: Die theologische Logik des Textes, wonach gottbezogenes Fasten äußerlich sichtbare Anmut verleiht, bleibt ohne Rationalisierung oder konfessionelle Ausdeutung stehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem testamentarischem Ton. Kurze Ausrufe und direkte Rede bewahren die Dringlichkeit. Archaisierende Wörter werden weitgehend vermieden; „Langmut“, „Ausharren“, „Kammer“, „Gebieter“ und „Angesicht“ bleiben dort stehen, wo sie die begriffliche Unterscheidung oder den gehobenen Ton tragen. Der am Ende unvollständige griechische Satz wird ausdrücklich als Fragment wiedergegeben.
