  rationale: Die Revision korrigiert das in Vers 1 unzulässig maskulin festgelegte Subjekt anhand des unmittelbaren Kontextes und der englischen Auditspur, gibt μέγα ohne interpretierende Einengung als »groß« wieder und beseitigt in Vers 5 die deutsche Aussage, Joseph habe die Nahrung gegessen, bevor er sie verschenkte. Das nicht eindeutige Zeitmuster von τριημερίζων bleibt durch die Fußnote offen. Die Satzfragmentierung in Vers 7 wird beibehalten.
