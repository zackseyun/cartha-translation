review_pass:
  verdict: revise
  source_fidelity: 'Eine Korrektur ist nötig: Das nicht ausgedrückte Subjekt von ἀπέδειξέ mit dem unmittelbaren narrativen Kontext und der englischen Auditspur als »sie« wiederzugeben, ist gegenüber dem männlichen »er« geboten. Außerdem gibt μέγα »groß«, nicht spezifisch »wirksam«, wieder. In Vers 5 darf »nahm ich meine Nahrung zu mir« nicht stehen, weil es im Deutschen den Verzehr ausdrückt, obwohl Joseph die Nahrung anschließend den Bedürftigen gibt.'
  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. »Nahm ... zu mir und gab sie« ist jedoch semantisch widersprüchlich. »Nahm ich meine Nahrung entgegen und gab sie ...« ist klar und bewahrt die Abfolge des Griechischen. Die Fußnote d benötigt die grammatische Form »Textzeugen« bzw. »Überlieferung«.
  terminology: »Langmut« und »beharrliches Ausharren« unterscheiden μακροθυμία und ὑπομονή sinnvoll. »Anmut des Angesichts« wahrt die konkrete, leicht ungewöhnliche Bildsprache. »Herr« für κύριος im Gebet und den menschlichen Herrn ist kontextuell verständlich. Die sexuellen und sozialen Aussagen sind direkt, aber sachlich wiedergegeben.
  issues:
  - severity: high
    issue: 'Vers 1: »erwies er mich als bewährt«'
    rationale: ἀπέδειξέ hat kein maskulines Subjekt. Im narrativen Kontext ist die Ägypterin die Handelnde; die englische Auditspur übersetzt ausdrücklich »she proved me approved«. Das eingefügte männliche Pronomen ist daher nicht quellentreu.
  - severity: medium
    issue: 'Vers 1: »wirksames Heilmittel«'
    rationale: μέγα bedeutet »groß«; »wirksam« verschiebt die Aussage zu einer behaupteten Effektivität. Die Metapher soll ohne diese Präzisierung stehen bleiben.
  - severity: high
    issue: 'Vers 5: »nahm ich meine Nahrung zu mir und gab sie ...«'
    rationale: »Nahrung zu sich nehmen« bedeutet essen und widerspricht dem anschließenden Weitergeben. ἐλάμβανον bezeichnet hier das Entgegennehmen/Erhalten der Nahrung.
  - severity: low
    issue: 'Vers 5: »Nur jeden dritten Tag«'
    rationale: »Nur« ist im griechischen Text nicht ausgedrückt und sollte nicht hinzugefügt werden.
  - severity: low
    issue: 'Fußnote d: »in diesem griechischen Textzeuge«'
    rationale: Grammatisch korrekt ist »in diesem griechischen Textzeugen« oder idiomatischer »in dieser griechischen Überlieferung«.
