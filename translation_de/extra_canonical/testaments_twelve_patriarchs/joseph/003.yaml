base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/003.yaml
  text: '1[a]. In a short time she would withdraw, to test the purpose of my soul. In ten temptations she proved me approved, and in them all I was patient; for patience is a great remedy.


    2. How many times the Egyptian woman threatened me with death! How many times, after handing me over to punishments[b], she called me back, and when I was unwilling to come together with her, she said to me, “You shall have authority over me also, and over all who are in my house, if you give yourself to me, and you shall be as our master.”


    3. But I remembered the words of my father, and going into my chamber weeping, I prayed to the Lord.


    4. And I fasted during those seven years, and I appeared to the Egyptian as one living in luxury; for those who fast for God''s sake receive grace of face.


    5. And if my master was away, I drank no wine; and every third day I would take my food, and I would give it to the poor and the sick.


    6. And I would rise early to the Lord and weep concerning Memphis the Egyptian woman, because she troubled me greatly without ceasing; for even at night she would come in to me under a pretext of visiting.


    7. And because she had no male child[d][c], she pretended'
translation:
  language: de
  text: '1. In zehn Versuchungen erwies sie mich als bewährt, und in allen hielt ich geduldig stand. Denn Langmut ist ein großes Heilmittel, und beharrliches Ausharren bringt viel Gutes hervor.


    2. Wie oft drohte mir die Ägypterin mit dem Tod! Wie oft lieferte sie mich zur Bestrafung aus, rief mich dann wieder zurück[a] und sagte zu mir, als ich nicht mit ihr schlafen wollte: »Du wirst über mich und über alle in meinem Haus herrschen, wenn du dich mir hingibst; du wirst unser Gebieter sein.«


    3. Ich aber erinnerte mich an die Worte meines Vaters. Weinend ging ich in die Kammer und betete zum Herrn.


    4. Während jener sieben Jahre fastete ich; dennoch erschien ich dem Ägypter[b] wie jemand, der im Überfluss lebt. Denn wer um Gottes willen fastet, empfängt Anmut des Angesichts.


    5. Wenn mein Herr außer Haus war, trank ich keinen Wein. Alle drei Tage nahm ich meine Nahrung entgegen[c] und gab sie den Armen und Kranken.


    6. Früh am Morgen wandte ich mich an den Herrn und weinte wegen Memphis, der Ägypterin[d], denn sie bedrängte mich heftig und ohne Unterlass. Sogar nachts kam sie unter dem Vorwand, nach mir zu sehen, zu mir herein.


    7. Weil sie keinen Sohn hatte, tat sie so, als ob …


    [a] Einige Textzeugen fügen hier eine erneute Drohung hinzu: »und drohte mir«.


    [b] Gemeint ist wahrscheinlich Josephs ägyptischer Herr; der griechische Ausdruck lautet jedoch nur »dem Ägypter«.


    [c] Der griechische Ausdruck bezeichnet eine dreitägige Fastenordnung und kann auch bedeuten: »nach jeweils drei Tagen«.


    [d] Memphis ist in diesem griechischen Textzeugen der Name der Ägypterin.'
  philosophy: optimal-equivalence
