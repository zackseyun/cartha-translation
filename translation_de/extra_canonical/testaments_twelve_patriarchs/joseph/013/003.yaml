source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Καὶ λέγει αὐτῷ ὁ Πεντεφρής¹⁸· Πόθεν ⌜οὖν⌉ *ἐστιν ὁ παῖς¹⁹ ὁ Ἑβραῖος²⁰; καὶ²¹ εἶπεν²²· Οἱ²³ Ἰσμαηλῖται παρέθεντό²⁴ μοι αὐτόν, ἕως ὅτου²⁵ ἐπιστρέψωσιν²⁶.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/003.yaml
  text: And Pentephris said to him, “From where, then, is this Hebrew boy?” And he said, “The Ishmaelites entrusted him to me until they return.”
translation:
  language: de
  text: 'Und Pentephres sagte zu ihm: „Woher also stammt der hebräische Junge?“ Er antwortete: „Die Ismaeliten haben ihn mir anvertraut, bis sie zurückkehren.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Πεντεφρής
  choice: Pentephres
  rationale: Der griechische Eigenname wird in einer eng an der Vorlage orientierten deutschen Form wiedergegeben.
- source_word: πόθεν … ἐστιν
  choice: woher … stammt
  rationale: Die natürliche deutsche Herkunftsfrage gibt die griechische Wendung präzise wieder.
- source_word: παῖς
  choice: Junge
  rationale: παῖς kann je nach Zusammenhang „Kind“, „Junge“ oder „Diener/Sklave“ bedeuten. Hier bezeichnet der Ausdruck den jungen Hebräer; der unmittelbare Wortlaut erzwingt keine soziale Statusangabe.
- source_word: παρέθεντό μοι
  choice: haben ihn mir anvertraut
  rationale: Die Form von παρατίθημι bezeichnet hier die Übergabe in die Obhut des Sprechers.
- source_word: ἕως ὅτου ἐπιστρέψωσιν
  choice: bis sie zurückkehren
  rationale: Gibt die zeitliche Grenze und den erwarteten, noch ausstehenden Vorgang idiomatisch wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher direkter Rede. Die genuine Bedeutungsbreite von παῖς wurde nicht durch die kontextuell mögliche, aber hier nicht zwingende Wiedergabe „Sklave“ verengt.
