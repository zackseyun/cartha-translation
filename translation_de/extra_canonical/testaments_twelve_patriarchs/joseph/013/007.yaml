  text: 'Und er fragte: »Wem gehören sie?« Ich antwortete: »Den Ismaelitern.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τίνος;
  choice: Wem gehören sie?
  rationale: Das isolierte Genitiv-Interrogativ bedeutet wörtlich »Wessen?«. Im Deutschen macht die elliptische Frage »Wem gehören sie?« den aus dem Kontext ergänzten Besitzbezug natürlich verständlich.
- source_word: Τῶν Ἰσμαηλιτῶν.
  choice: Den Ismaelitern.
  rationale: Der griechische Genitiv bezeichnet die Zugehörigkeit; nach der im Deutschen explizierten Frage steht die Antwort idiomatisch im Dativ.
- source_word: λέγει / λέγω
  choice: fragte / antwortete
  rationale: 'Die kontextuellen Sprechfunktionen werden im Deutschen natürlich wiedergegeben: Die erste Äußerung ist eine Frage, die zweite deren Antwort.'
