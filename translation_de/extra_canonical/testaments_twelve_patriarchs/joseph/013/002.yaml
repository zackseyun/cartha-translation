  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/002.yaml
  text: But the broker fell at his feet and begged, saying, “I beg you, lord, I do not know what you are saying.”
translation:
  language: de
  text: 'Doch der Vermittler fiel ihm zu Füßen und flehte: „Ich bitte dich, Herr, ich weiß nicht, was du sagst.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μετάβολος
  choice: Vermittler
  rationale: Das Wort bezeichnet hier einen Mittelsmann beziehungsweise Vermittler; „Makler“ wäre möglich, klingt im modernen Deutschen jedoch stärker nach einem bestimmten Berufsbild.
- source_word: πεσὼν εἰς τοὺς πόδας αὐτοῦ
  choice: fiel ihm zu Füßen
  rationale: Natürliche und zugleich formnahe Wiedergabe der griechischen Wendung.
- source_word: ἐδέετο λέγων / Δέομαί σου
  choice: 'flehte: „Ich bitte dich“'
  rationale: Gibt die wiederholte Bittsprache wieder, ohne das im Deutschen schwerfällige „flehte und sagte“.
- source_word: κύριε
  choice: Herr
  rationale: Bewahrt die respektvolle Anrede, ohne eine darüber hinausgehende theologische Bedeutung festzulegen.
- source_word: οὐκ οἶδα ὃ λέγεις
  choice: ich weiß nicht, wovon du sprichst
  rationale: Idiomatiche deutsche Wiedergabe von „ich weiß nicht, was du sagst“, mit demselben Sinn.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt eindringlich; ein nicht ausdrücklich genanntes Objekt zu „flehte“ wurde nicht ergänzt.
