  verdict: revise
  source_fidelity: Die Satzstruktur, die nicht näher bestimmten Pronomen und der imperativische Passivbefehl Ἐναχθήτω sind grundsätzlich zutreffend wiedergegeben. »Auspeitschen« engt τύπτεσθαι jedoch unzulässig auf eine spezifische Strafmethode ein; das griechische Verb bezeichnet allgemein geschlagen bzw. geprügelt werden.
  naturalness: »Als er aber bei diesen Worten blieb« ist im modernen Standarddeutsch wenig idiomatisch. »Als er aber an diesen Worten festhielt« ist natürlich und gibt ἐπιμένοντος ... τούτοις τοῖς λόγοις genauer wieder.
  terminology: Die Transliteration »Pentephres« entspricht der vorgelegten griechischen Form Πεντεφρής. »Der junge Mann« gibt ὁ νεανίσκος angemessen wieder. Für τύπτεσθαι ist die unspezifische Formulierung »nackt zu schlagen« vorzuziehen.
