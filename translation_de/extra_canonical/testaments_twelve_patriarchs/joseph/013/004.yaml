  text: '*Ὁ δὲ οὐκ²⁷ ἐπίστευσεν αὐτῷ²⁸, ἀλλ’ ἐκέλευσεν γυμνὸν τύπτεσθαι²⁹. Ἐπιμένοντος δὲ αὐτοῦ *τούτοις τοῖς λόγοις³⁰, λέγει³¹ *ὁ Πεντεφρής³²· Ἐναχθήτω³³ οὖν³⁴ ὁ νεανίσκος.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/004.yaml
  text: But he did not believe him; rather, he ordered him to be beaten naked. And when he persisted in these words, Pentephris said, “Then let the young man be brought.”
translation:
  language: de
  text: 'Doch er glaubte ihm nicht, sondern befahl, ihn nackt zu schlagen. Als er aber an diesen Worten festhielt, sagte Pentephres: »Dann soll der junge Mann vorgeführt werden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἐπίστευσεν αὐτῷ
  choice: er glaubte ihm nicht
  rationale: Gibt das persönliche Objekt αὐτῷ und die schlichte Aussage des griechischen Textes unmittelbar wieder.
- source_word: γυμνὸν τύπτεσθαι
  choice: ihn nackt auszupeitschen
  rationale: γυμνόν bezeichnet den unbekleideten Zustand während der Strafe; τύπτεσθαι meint hier eine angeordnete körperliche Züchtigung. »Auspeitschen« ist im Deutschen anschaulich und dem gerichtlichen Kontext angemessen.
- source_word: ἐπιμένοντος ... αὐτοῦ τούτοις τοῖς λόγοις
  choice: als er aber bei diesen Worten blieb
  rationale: Bewahrt den möglichen Sinn, dass der Betreffende an seiner Aussage festhielt, ohne die nicht ausdrücklich bezeichnete Person näher zu bestimmen.
- source_word: Ἐναχθήτω
  choice: soll ... vorgeführt werden
  rationale: Das Passiv von ἐνάγω bezeichnet hier das Herbeibringen beziehungsweise Vorführen einer Person; die deutsche Form wahrt den befehlenden Charakter.
- source_word: ὁ νεανίσκος
  choice: der junge Mann
  rationale: Natürliche moderne Wiedergabe von νεανίσκος ohne unnötige Verkleinerungsnuance.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit knapper erzählerischer Syntax. Der Name Πεντεφρής wird als »Pentephres« transliteriert. Die nicht ausdrücklich genannten Bezugsgrößen der Pronomen werden nicht interpretierend ergänzt.
