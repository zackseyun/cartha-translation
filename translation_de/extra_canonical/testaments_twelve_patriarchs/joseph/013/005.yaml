  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/005.yaml
  text: And when I was brought in, I bowed down to Pentephris, for he was third in rank among Pharaoh’s rulers.
translation:
  language: de
  text: Als ich hineingeführt worden war, verbeugte ich mich vor Pentephres; denn unter den Beamten des Pharao stand er im Rang an dritter Stelle.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰσαχθείς
  choice: als ich hineingeführt worden war
  rationale: Das passive Partizip wird als vorzeitiger Temporalsatz wiedergegeben und bewahrt, dass Josef von anderen vorgeführt wurde.
- source_word: προσεκύνησα
  choice: ich verbeugte mich vor
  rationale: Im höfischen Kontext bezeichnet das Verb eine ehrerbietige Niederwerfung oder Verbeugung; die Formulierung vermeidet hier eine unnötig kultische Festlegung.
- source_word: Πεντεφρῇ
  choice: Pentephres
  rationale: Der griechische Eigenname wird transliteriert und nicht mit einer möglicherweise identifizierenden biblischen Namensform vereinheitlicht.
- source_word: τρίτος … ἐν ἀξιώματι
  choice: stand … im Rang an dritter Stelle
  rationale: Die deutsche Wendung gibt sowohl die Ordinalzahl als auch die amtliche Rangstellung idiomatisch wieder.
- source_word: παρὰ τῶν Φαραὼ ἀρχόντων
  choice: unter den Herrschern des Pharaos
  rationale: 'Die Formulierung folgt der überlieferten Lesart und versteht die Präpositionalgruppe vergleichend beziehungsweise einordnend: Er war Dritter innerhalb der führenden Amtsträger des Pharaos.'
