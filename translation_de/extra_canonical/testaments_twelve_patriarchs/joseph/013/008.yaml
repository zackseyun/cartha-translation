base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/008.yaml
  text: But he said, “How did you become their servant?” And I said, “They bought me from the land of Canaan.”
translation:
  language: de
  text: 'Doch er fragte: „Wie bist du ihr Sklave geworden?“ Ich antwortete: „Sie haben mich aus dem Land Kanaan gekauft.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δοῦλος
  choice: Sklave
  rationale: Das griechische Wort bezeichnet hier einen Menschen in einem rechtlichen und sozialen Abhängigkeitsverhältnis; „Sklave“ gibt dies präziser wieder als das allgemeinere „Diener“.
- source_word: ἐκ γῆς Χαναὰν
  choice: aus dem Land Kanaan
  rationale: Die Präposition ἐκ bezeichnet die Herkunft; die natürliche deutsche Wiedergabe bewahrt diesen Sinn.
- source_word: ἐπριάσαντό με
  choice: Sie haben mich … gekauft
  rationale: Die mediale Form von πρίαμαι bedeutet „kaufen/erwerben“ und wird im Deutschen idiomatisch aktiv wiedergegeben.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Der Wechsel von „sagte“ zu „fragte“ in der ersten Redeeinleitung ergibt sich eindeutig aus dem folgenden Fragesatz; „antwortete“ gibt die zweite Redeeinleitung im natürlichen deutschen Erzählstil wieder.
