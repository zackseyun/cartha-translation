base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/001.yaml
  text: But Pentephris, persuaded by her words, ordered the broker to come, and said to him, “What is this that I hear concerning you, that you steal souls from the land of Canaan and sell them as servants?”
translation:
  language: de
  text: 'Doch Pentephris ließ sich von ihren Worten überzeugen, befahl dem Händler, zu kommen, und sagte zu ihm: »Was ist das, was ich über dich höre: dass du Menschen[a] aus dem Land Kanaan stiehlst und sie als Sklaven[b] weiterverkaufst?«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: Seelen.'
    reason: Bewahrt die auffällige Formulierung ψυχὰς, während der Haupttext ihren gemeinten Personenbezug verständlich wiedergibt.
  - marker: b
    text: 'Oder: Diener.'
    reason: Das griechische παῖδας kann sowohl Diener als auch Sklaven bezeichnen; der Kontext des Menschenverkaufs legt „Sklaven“ nahe, ohne die lexikalische Alternative auszuschließen.
lexical_decisions:
- source_word: Πεντεφρὶς
  choice: Pentephris
  rationale: Der griechische Eigenname wird in einer dem Ausgangstext nahen Form wiedergegeben, ohne ihn stillschweigend mit einer anderen Namensform gleichzusetzen.
- source_word: μετάβολον
  choice: Händler
  rationale: Das Wort bezeichnet hier einen Mittelsmann beziehungsweise Händler im Menschenhandel; „Händler“ ist im Deutschen natürlich und aus dem Kontext eindeutig.
- source_word: ψυχὰς
  choice: Menschen
  rationale: Wörtlich steht „Seelen“, doch gemeint sind Personen, die entführt und verkauft werden. „Menschen“ gibt den Sinn im modernen Deutschen klar wieder; die formale Bildsprache bleibt in einer Fußnote sichtbar.
- source_word: μεταπωλεῖς
  choice: weiterverkaufst
  rationale: Das Verb bezeichnet den Weiterverkauf und passt zum Händlerkontext; anders als ein freies „wieder“ bildet „weiter-“ die Transaktionskette idiomatisch ab.
- source_word: παῖδας
  choice: als Sklaven
  rationale: παῖς kann je nach Zusammenhang Kind, Diener oder Sklave bedeuten. Beim Verkauf entführter Menschen bezeichnet es hier am wahrscheinlichsten einen unfreien Dienststatus.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wahrt die anklagende Frage des Griechischen; „ließ sich … überzeugen“ gibt das Partizip πεισθείς natürlich wieder. Die Formulierung „befahl dem Händler zu kommen“ folgt dem überlieferten ἐλθεῖν, ohne ein passives Herbeibringen einzutragen.
