  register: Modernes, klares Standarddeutsch mit würdigem Erzählton. Der Statusgegensatz zwischen Sklave und Freiem wird ausdrücklich erhalten; die wechselnden griechischen Erzähltempora werden idiomatisch als Vergangenheit wiedergegeben.
