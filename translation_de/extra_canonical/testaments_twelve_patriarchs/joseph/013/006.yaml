  text: Καὶ διαχωρίσας³⁸ με³⁹ ἀπ᾿ αὐτοῦ⁴⁰ λέγει⁴¹ μοι⁴²· Δοῦλος εἶ ἢ ἐλεύθερος; *ἐγὼ δὲ⁴³ εἶπον⁴⁴· Δοῦλος⁴⁵.
