  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013/006.yaml
  text: And after separating me from him, he said to me, “Are you a servant or free?” And I said, “A servant.”
translation:
  language: de
  text: 'Und nachdem er mich von ihm getrennt hatte, fragte er mich: »Bist du ein Sklave oder ein freier Mann?« Ich antwortete: »Ein Sklave.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαχωρίσας
  choice: nachdem er … getrennt hatte
  rationale: Gibt das vorzeitige Partizip natürlich wieder und bewahrt den sachlichen Sinn des Absonderns.
- source_word: Δοῦλος
  choice: Sklave
  rationale: Im Gegensatz zu ἐλεύθερος bezeichnet δοῦλος hier den rechtlichen Status eines Unfreien; „Diener“ wäre zu schwach.
- source_word: ἐλεύθερος
  choice: freier Mann
  rationale: Bezeichnet im unmittelbaren Gegensatz zu „Sklave“ den persönlichen Rechtsstatus; die maskuline Anrede ist durch Joseph als Sprecherreferent bestimmt.
- source_word: λέγει
  choice: fragte
  rationale: Das historische Präsens führt hier eine direkte Frage ein; im Deutschen ist „fragte“ idiomatischer als das wörtliche „sagt“.
theological_decisions: []
