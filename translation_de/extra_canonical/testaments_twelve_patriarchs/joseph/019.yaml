base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/019.yaml
  text: 'And he gave me beauty beyond the handsome men of Israel[a], and preserved me until old age in strength and in beauty; for I was like Jacob in all things.


    Now listen, my children, also concerning the dream that I saw.


    2. Twelve deer were feeding in one place, and the nine were scattered over all the earth; and likewise the three also. So hear the dream that I saw. 3. And I saw that the three deer became three lambs, and they cried out to the Lord, and the Lord led them out into a flourishing and well-watered place, and brought them from darkness into light. 4. And there they cried out to the Lord until the nine deer were gathered to them, and they themselves became like twelve sheep; and after a little time they increased and became many flocks. 5. And after these things I saw, and behold, twelve bulls suckling one heifer, and from her there came a sea of milk, and the twelve flocks and innumerable flocks drank from it. 6. And from the fourth bull the horns went up as far as heaven and became like a wall for the flocks, and between the two horns another horn sprang up. 7. And I saw a calf that encircled them twelve times, and it became for the bulls wholly a help.


    8. And I saw that a virgin was born, and from her was born a lamb, and on his left there rushed forth something like a lion; and all the beasts rushed against him, but the lamb overcame them and destroyed them and trampled them down. 9. And the angels and men and all the earth rejoiced over him. 10. And these things will happen in their season in the last days.


    11. Therefore you, my children, keep the commandments of the Lord, and honor Levi and Judah; for from their seed there will arise for you the salvation of Israel. 12. For his kingdom will be an everlasting kingdom, which will not pass away. But my kingdom among you will come to an end, like a watchman''s hut after the summer[d][c][b], vanishing away.'
translation:
  language: de
  text: '**18,4 (Fortsetzung)** Ja, er machte mich sogar schöner als die schönen Männer Israels und bewahrte mich bis ins hohe Alter in Kraft und Schönheit; denn ich glich Jakob in allem.


    **19** Hört nun, meine Kinder, auch von den Träumen, die ich kenne.


    **2** Zwölf Hirsche weideten an einem Ort, und die neun wurden über die ganze Erde zerstreut, ebenso auch die drei. **3** Dann sah ich, wie die drei Hirsche zu drei Lämmern wurden. Sie riefen zum Herrn, und der Herr führte sie hinaus an einen üppigen, wasserreichen Ort und brachte sie aus der Finsternis ins Licht. **4** Dort riefen sie so lange zum Herrn, bis die neun Hirsche zu ihnen versammelt wurden; und sie wurden wie zwölf Schafe. Nach kurzer Zeit vermehrten sie sich und wurden zu vielen Herden.


    **5** Danach sah ich: Zwölf Stiere saugten an einer jungen Kuh. Aus ihrer Milch wurde ein Meer,[a] und die zwölf Herden und unzählige Herden tranken daraus. **6** Die Hörner des vierten Stieres ragten bis zum Himmel empor und wurden wie eine Mauer für die Herden. Zwischen den beiden Hörnern spross ein weiteres Horn hervor. **7** Dann sah ich ein Kalb, das sie zwölfmal umkreiste; es wurde den Stieren völlig zur Hilfe.


    **8** Und ich sah, dass eine Jungfrau geboren wurde, und aus ihr wurde ein Lamm geboren.[b] Zu seiner Linken war etwas wie ein Löwe.[c] Alle wilden Tiere stürmten gegen es an; doch das Lamm besiegte sie, vernichtete sie und zertrat sie. **9** Die Engel, die Menschen und die ganze Erde freuten sich über ihn. **10** Dies wird zu ihrer Zeit, in den letzten Tagen, geschehen.


    **11** Darum, meine Kinder, haltet die Gebote des Herrn und ehrt Levi und Juda. Denn aus ihrer Nachkommenschaft wird euch einer aufgehen, der Israel rettet.[d] **12** Seine Königsherrschaft wird eine ewige Königsherrschaft sein, die nicht vergeht. Meine Königsherrschaft unter euch dagegen geht zu Ende; sie verschwindet wie die Hütte eines Obstgartenwächters nach dem Sommer.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text ist an dieser Stelle lückenhaft. Sinngemäß wird aus der Milch der jungen Kuh ein Meer.
    reason: textual_difficulty
  - marker: b
    text: 'Die Überlieferung schwankt. Einige griechische Zeugen lesen ausführlicher: „Aus Juda wurde eine Jungfrau geboren, die ein Gewand aus feinem Leinen trug; aus ihr wurde ein makelloses Lamm geboren.“ Eine andere Textform spricht davon, dass zwischen den Hörnern eine Jungfrau erschien.'
    reason: textual_variant
  - marker: c
    text: Der Satz über die linke Seite und den Löwen ist textlich schwierig. Eine andere Überlieferungsform gestaltet die Szene anders, schildert aber ebenfalls den Angriff wilder Tiere auf das Lamm.
    reason: alternative_reading
  - marker: d
    text: Einige Zeugen erweitern die Aussage um „das Lamm Gottes, das die Sünde der Welt wegnimmt“ und darum, dass es „alle Völker und Israel“ rettet. Der Haupttext folgt hier der kürzeren Lesart.
    reason: textual_variant
  - marker: e
    text: Gemeint ist eine einfache, nur vorübergehend genutzte Wachhütte in einem Obstgarten. Nach der Sommer- oder Erntezeit blieb sie verlassen zurück und verfiel.
    reason: cultural_note
lexical_decisions:
- source_word: ὡραιότητα
  choice: Schönheit
  rationale: Bezeichnet körperliche Schönheit oder ansprechendes Aussehen; „Schönheit“ ist im Deutschen natürlich und würdevoll.
- source_word: ἐφύλαξέ
  choice: bewahrte
  rationale: Drückt Gottes anhaltenden Schutz bis ins hohe Alter aus und ist hier präziser als das allgemeinere „behielt“.
- source_word: ἐνυπνίων
  choice: Träume
  rationale: Der Abschnitt schildert symbolische nächtliche Visionen; „Träume“ ist die klare und gewöhnliche deutsche Entsprechung.
- source_word: ἔλαφοι
  choice: Hirsche
  rationale: Die Bezeichnung ist geschlechtlich nicht in jeder Einzelheit festgelegt; „Hirsche“ gibt das Bild im Deutschen anschaulich wieder, ohne die Symbolik auszudeuten.
- source_word: ἀμνοί / ἀμνός
  choice: Lämmer / Lamm
  rationale: Bewahrt den Wechsel von Wildtieren zur Hirten- und Opferbildwelt des Traumes.
- source_word: τόπον εὐθαλῆ καὶ ἔνυδρον
  choice: einen üppigen, wasserreichen Ort
  rationale: 'Gibt beide Aspekte wieder: kräftiges Gedeihen und reichlich vorhandenes Wasser.'
- source_word: ἐκ σκότους εἰς φῶς
  choice: aus der Finsternis ins Licht
  rationale: Die wörtliche Form ist im Deutschen verständlich und bewahrt die offene Bildsprache von Befreiung und Erneuerung.
- source_word: πρόβατα / ποίμνια
  choice: Schafe / Herden
  rationale: Erhält die Unterscheidung zwischen einzelnen Tieren und den später zahlreich gewordenen Verbänden.
- source_word: βόες
  choice: Stiere
  rationale: Das grammatisch männliche Tierbild und die hervorgehobenen Hörner sprechen hier für „Stiere“ statt des allgemeineren „Rinder“.
- source_word: θηλάζοντες μίαν δάμαλιν
  choice: saugten an einer jungen Kuh
  rationale: Gibt das ungewöhnliche Traumbild unmittelbar und verständlich wieder; „junge Kuh“ ist geläufiger als das fachsprachliche „Färse“.
- source_word: ἀνατελεῖ
  choice: wird ... aufgehen
  rationale: Bewahrt das bildhafte Verb des Hervorgehens oder Aufgehens und lässt den prophetischen Klang bestehen.
- source_word: βασιλεία
  choice: Königsherrschaft
  rationale: Bezeichnet hier eher das Herrschen beziehungsweise die Herrschaft als lediglich ein geografisches Reich.
- source_word: ὀπωροφυλάκιον
  choice: Hütte eines Feldwächters
  rationale: Gemeint ist eine vorübergehend genutzte Schutzhütte in einem bewachten Feld oder Garten; die Formulierung bleibt verständlich, ohne das Bild aufzulösen.
theological_decisions:
- issue: Stark christologisch erweiterte Lesarten in 19,8 und 19,11
  choice: Der Haupttext folgt der kürzeren Lesart und behält die Jungfrau-Lamm-Symbolik bei, ohne die später bezeugten ausführlicheren Formeln einzusetzen.
  alternative: „Aus Juda wurde eine Jungfrau geboren“, „ein makelloses Lamm“ sowie „das Lamm Gottes, das die Sünde der Welt wegnimmt“ und die Rettung aller Völker.
  rationale: Die gekennzeichneten Zusätze sind textlich umstritten und wirken teilweise wie spätere christliche Präzisierungen. Sie werden transparent in den Fußnoten genannt, statt den weniger eindeutigen Haupttext konfessionell festzulegen.
- issue: Identität der rettenden Gestalt aus Levi und Juda
  choice: „Aus ihrer Nachkommenschaft wird euch einer aufgehen, der Israel rettet.“
  alternative: „Aus ihrer Nachkommenschaft wird euch das Heil Israels aufgehen“ oder eine ausdrückliche Identifizierung mit einem späteren messianischen Titel.
  rationale: Das Partizip σώζων und das anschließende „seine Königsherrschaft“ legen eine persönliche Gestalt nahe, während deren genaue Identität im kürzeren Text offenbleibt.
- issue: Das Lamm und der Löwe in 19,8
  choice: Beide Bilder werden nebeneinandergestellt, ohne den Löwen ausdrücklich mit Juda, dem Lamm oder einem Gegner gleichzusetzen.
  alternative: Den Löwen als Eigenschaft des Lammes, als eigenständigen Helfer oder als feindliche Macht bestimmen.
  rationale: Der griechische Satz ist textlich und syntaktisch schwierig. Eine eindeutige theologische Zuordnung würde mehr behaupten, als die überlieferte Form sicher trägt.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerisch-prophetischem Ton. Die wiederkehrenden Formeln des Traumberichts und seine Tierbilder bleiben sichtbar; unklare oder umstrittene Stellen werden nicht stillschweigend dogmatisch vereindeutigt.
