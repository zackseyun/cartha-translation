review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt den Traumablauf und die meisten Tierbilder im Wesentlichen zutreffend wieder. Mehrere Formulierungen gehen jedoch über den griechischen Wortlaut hinaus oder verschieben ihn: 19,4 hat „wie zwölf Schafe“, nicht einfach „zwölf Schafe“; 19,6 sagt nicht ausdrücklich „zum Schutz“; 19,9 lautet „über ihn“; und 19,12 steht im Präsens („geht ... zu Ende“), nicht im Futur. Die schwer verständliche Einleitung zu den „Träumen“ und die lückenhafte Milchmeer-Stelle müssen als solche transparent bleiben.'
  naturalness: Die Sprache ist überwiegend klares modernes Standarddeutsch. „größere Schönheit als den schönen Männern“ ist jedoch grammatisch bzw. idiomatisch unglücklich. Die Revision glättet dies und bewahrt zugleich den würdig-prophetischen Ton.
  terminology: „Herr“, „Lamm“, „Levi“, „Juda“ und „Königsherrschaft“ sind angemessen. „Junge Kuh“ ist für δάμαλις verständlich. Die Deutung der Hörner als Schutzmauer wird zurückgenommen, damit das Symbol nicht übererklärt wird.
  issues:
  - severity: medium
    issue: '19,4: Vergleichsform und Bildsprache abgeschwächt'
    rationale: ἐγίνοντο ... ὡς δώδεκα πρόβατα bedeutet „sie wurden wie zwölf Schafe“. „sodass es zwölf waren“ macht aus dem Vergleich eine bloße Zählung.
  - severity: medium
    issue: '19,6: „zum Schutz der Herden“ ist interpretierende Ergänzung'
    rationale: Der griechische Text sagt, die Hörner seien „wie eine Mauer für/der Herden“ geworden. Eine ausdrückliche Schutzfunktion ist plausibel, aber nicht gesagt.
  - severity: medium
    issue: '19,12: Zeitform verändert'
    rationale: ἐπιτελεῖται ist Präsens. „wird zu Ende gehen“ verschiebt die Aussage in die Zukunft; „geht ... zu Ende“ erhält die Form des überlieferten Textes.
  - severity: low
    issue: '19,9: Bezugswort dogmatisch bzw. interpretierend präzisiert'
    rationale: Der Text sagt „über ihn“. Obwohl das Lamm der naheliegende Bezug ist, sollte die pronominale Form bei der textlich schwierigen Szene erhalten bleiben.
  - severity: low
    issue: '18,4: Unnatürlicher Vergleich'
    rationale: „größere Schönheit als den schönen Männern“ ist im Deutschen keine saubere Vergleichskonstruktion. „schöner als die schönen Männer Israels“ ist idiomatisch und sinnentsprechend.
