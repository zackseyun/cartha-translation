revisions:
- from: '**18,4 (Fortsetzung)** Ja, er schenkte mir sogar größere Schönheit als den schönen Männern Israels und bewahrte mich bis ins hohe Alter in Kraft und Schönheit; denn ich glich Jakob in allem.


    **19** Hört nun auch, meine Kinder, von den Träumen, die ich hatte.


    **2** Zwölf Hirsche weideten an einem Ort. Die neun wurden über die ganze Erde zerstreut, ebenso auch die drei. **3** Dann sah ich, wie die drei Hirsche zu drei Lämmern wurden. Sie riefen zum Herrn, und der Herr führte sie hinaus an einen üppigen, wasserreichen Ort und brachte sie aus der Finsternis ins Licht. **4** Dort riefen sie so lange zum Herrn, bis die neun Hirsche zu ihnen versammelt wurden. Auch sie wurden zu Schafen, sodass es zwölf waren. Nach kurzer Zeit vermehrten sie sich und wurden zu vielen Herden.


    **5** Danach sah ich: Zwölf Stiere saugten an einer jungen Kuh. Aus ihrer Milch entstand ein ganzes Meer,[a] und die zwölf Herden und unzählige weitere Herden tranken daraus. **6** Die Hörner des vierten Stieres ragten bis zum Himmel empor und wurden wie eine Mauer zum Schutz der Herden. Zwischen den beiden Hörnern spross ein weiteres Horn hervor. **7** Dann sah ich ein Kalb, das sie zwölfmal umkreiste; es wurde den Stieren in jeder Hinsicht zur Hilfe.


    **8** Und ich sah eine Jungfrau, und aus ihr wurde ein Lamm geboren.[b] Zu seiner Linken war etwas wie ein Löwe.[c] Alle wilden Tiere stürmten gegen das Lamm an; doch das Lamm besiegte sie, vernichtete sie und zertrat sie. **9** Die Engel, die Menschen und die ganze Erde freuten sich über das Lamm. **10** Dies wird zu der dafür bestimmten Zeit, in den letzten Tagen, geschehen.


    **11** Darum, meine Kinder, haltet die Gebote des Herrn und ehrt Levi und Juda. Denn aus ihrer Nachkommenschaft wird euch einer aufgehen, der Israel rettet.[d] **12** Seine Königsherrschaft wird ewig bestehen und nicht vergehen. Meine Königsherrschaft unter euch dagegen wird zu Ende gehen; sie verschwindet wie die Hütte eines Feldwächters nach dem Sommer.[e]'
  to: '**18,4 (Fortsetzung)** Ja, er machte mich sogar schöner als die schönen Männer Israels und bewahrte mich bis ins hohe Alter in Kraft und Schönheit; denn ich glich Jakob in allem.


