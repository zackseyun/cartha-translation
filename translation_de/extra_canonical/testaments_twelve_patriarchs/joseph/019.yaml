    **8** Und ich sah, dass eine Jungfrau geboren wurde, und aus ihr wurde ein Lamm geboren.[b] Zu seiner Linken war etwas wie ein Löwe.[c] Alle wilden Tiere stürmten gegen es an; doch das Lamm besiegte sie, vernichtete sie und zertrat sie. **9** Die Engel, die Menschen und die ganze Erde freuten sich über ihn. **10** Dies wird zu ihrer Zeit, in den letzten Tagen, geschehen.


    **11** Darum, meine Kinder, haltet die Gebote des Herrn und ehrt Levi und Juda. Denn aus ihrer Nachkommenschaft wird euch einer aufgehen, der Israel rettet.[d] **12** Seine Königsherrschaft wird eine ewige Königsherrschaft sein, die nicht vergeht. Meine Königsherrschaft unter euch dagegen geht zu Ende; sie verschwindet wie die Hütte eines Obstgartenwächters nach dem Sommer.[e]'
