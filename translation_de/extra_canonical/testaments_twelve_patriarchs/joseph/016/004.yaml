  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/016/004.yaml
  text: Then she sent another eunuch, saying, “Even if they ask two minas, pay them. Do not spare the gold. Only buy the boy and bring him to me.”
translation:
  language: de
  text: 'Da schickte sie einen anderen Eunuchen und sagte: »Auch wenn sie zwei Minen verlangen, gebt sie ihnen. Spart nicht am Gold. Kauf nur den Jungen und bring ihn zu mir.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐνοῦχον ἕτερον
  choice: einen anderen Eunuchen
  rationale: Gibt die griechische Wortgruppe direkt und in natürlichem Deutsch wieder.
- source_word: δύο μνᾶς
  choice: zwei Minen
  rationale: Bewahrt die antike Gewichts- und Geldeinheit, ohne einen spekulativen modernen Gegenwert einzusetzen.
- source_word: παρέχετε
  choice: gebt sie ihnen
  rationale: Der Pluralimperativ bezeichnet die Zahlung beziehungsweise Aushändigung der verlangten zwei Minen; das indirekte Objekt ist aus dem Zusammenhang ergänzt.
- source_word: μὴ φείσασθε χρυσίου
  choice: Spart nicht mit dem Gold
  rationale: Entspricht dem Sinn von φείδομαι mit Genitiv und klingt im Deutschen natürlich.
- source_word: μόνον πριασάμενος
  choice: Kauf ... um jeden Preis
  rationale: 'μόνον hebt hier das eine entscheidende Ziel hervor: Der Kauf soll ungeachtet des Preises zustande kommen. Die idiomatische Wiedergabe verbindet dies mit der vorausgehenden Aufforderung, beim Gold nicht zu sparen.'
- source_word: τὸν παῖδα
  choice: den jungen Mann
  rationale: παῖς kann je nach Kontext Junge, junger Mann oder Diener bedeuten; hier bezeichnet es Joseph als zum Verkauf stehende junge Person, ohne ihn unnötig als Kind festzulegen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede bleibt energisch und dringlich; die antike Einheit »Mine« wird beibehalten.
