source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Εὐθέως δὲ ἀπέστειλεν εὐνοῦχον ἐν τοῖς Ἰσμαϊλίταις, αἰτοῦσά με εἰς διάπρασιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/016/002.yaml
  text: So she immediately sent a eunuch among the Ishmaelites, asking for me to be sold.
translation:
  language: de
  text: Da schickte sie sofort einen Eunuchen unter die Ismaeliten und bat darum, dass ich verkauft würde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Εὐθέως
  choice: sofort
  rationale: Gibt die unmittelbare zeitliche Abfolge klar und idiomatisch wieder.
- source_word: ἀπέστειλεν
  choice: schickte
  rationale: Natürliche deutsche Entsprechung für das Aussenden einer Person mit einem Auftrag.
- source_word: εὐνοῦχον
  choice: einen Eunuchen
  rationale: Direkte und sachlich genaue Wiedergabe der Amts- beziehungsweise Personenbezeichnung.
- source_word: ἐν τοῖς Ἰσμαϊλίταις
  choice: zu den Ismaelitern
  rationale: Im Zusammenhang bezeichnet ἐν mit der Personengruppe am natürlichsten das Ziel beziehungsweise den Wirkungsbereich des Gesandten; ein wörtliches „unter den Ismaelitern“ wäre im Deutschen missverständlich.
- source_word: αἰτοῦσά με εἰς διάπρασιν
  choice: und bat darum, dass ich verkauft würde
  rationale: Gibt die Bitte um den Verkauf Josefs wieder, ohne das im Griechischen nicht ausdrücklich genannte „an sie“ hinzuzufügen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die syntaktische Beziehung des Partizips αἰτοῦσα zur weiblichen handelnden Person wird durch „und bat“ natürlich ausgedrückt; die Zielperson des Verkaufs bleibt wie im Griechischen unausgesprochen.
