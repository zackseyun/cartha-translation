source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ὁ δὲ εὐνοῦχος *μὴ θελήσας ἀγοράσαι με⁴ ἀνεχώρησεν πειράσας αὐτούς, καὶ δηλοῖ τῇ δεσποίνῃ αὐτοῦ, ὅτι πολλὴν τιμὴν αἰτοῦσιν τοῦ παιδός.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/016/003.yaml
  text: But the eunuch, not wishing to buy me, withdrew after testing them, and reported to his mistress that they were asking a high price for the boy.
translation:
  language: de
  text: Der Eunuch aber wollte mich nicht kaufen. Nachdem er sie auf die Probe gestellt hatte, zog er sich zurück und berichtete seiner Herrin, dass sie einen hohen Preis für den Jungen verlangten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐνοῦχος
  choice: Eunuch
  rationale: Die direkte und im Deutschen geläufige Entsprechung bewahrt die konkrete Amts- beziehungsweise Personenbezeichnung des griechischen Textes.
- source_word: μὴ θελήσας ἀγοράσαι με
  choice: wollte mich nicht kaufen
  rationale: Gibt das verneinte Partizip mit Infinitiv natürlich und ohne zusätzliche Deutung wieder.
- source_word: πειράσας αὐτούς
  choice: nachdem er sie auf die Probe gestellt hatte
  rationale: πειράζω kann je nach Zusammenhang prüfen, erproben oder versuchen bedeuten. „Auf die Probe stellen“ bewahrt hier die sachliche Offenheit besser als ein negativ gefärbtes „versuchen“.
- source_word: δεσποίνῃ
  choice: Herrin
  rationale: Bezeichnet die weibliche Gebieterin beziehungsweise Hausherrin; „Herrin“ ist präzise und dem historischen Verhältnis angemessen.
- source_word: πολλὴν τιμήν
  choice: einen hohen Preis
  rationale: τιμή bezeichnet im Kaufzusammenhang den verlangten Preis; „hoch“ gibt πολλή idiomatisch wieder.
- source_word: τοῦ παιδός
  choice: für den Jungen
  rationale: Der Genitiv bezeichnet hier den Gegenstand der Preisforderung. „Junge“ wahrt die altersbezogene Bedeutung von παῖς.
theological_decisions: []
