  text: But I, knowing this, kept silent, so that the eunuch might not be put to shame.
translation:
  language: de
  text: Ich aber wusste davon und schwieg, damit der Eunuch nicht beschämt würde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰδὼς
  choice: wusste davon
  rationale: Das Partizip bezeichnet ein Wissen um den aus dem Zusammenhang bekannten Sachverhalt; „davon“ stellt den Rückbezug im Deutschen natürlich her.
- source_word: ἐσιώπησα
  choice: schwieg
  rationale: Die knappe Vergangenheitsform gibt das bewusste Stillschweigen direkt und würdig wieder.
- source_word: αἰσχυνθῇ
  choice: beschämt würde
  rationale: Der passive Konjunktiv wird als Finalsatz wiedergegeben und lässt offen, wodurch oder vor wem die Beschämung erfolgt wäre.
- source_word: ὁ εὐνοῦχος
  choice: der Eunuch
  rationale: Dies ist die direkte und im Deutschen verständliche Entsprechung der Personenbezeichnung.
