source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἡ δὲ Μεμφὶς εἶπε τῷ ἀνδρὶ αὐτῆς¹· *Ἀγόρασον τὸν νεανίαν², ἀκούω γάρ, φησίν³, ὅτι πωλοῦσιν αὐτόν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/016/001.yaml
  text: But Memphis said to her husband, “Buy the young man, for I hear,” she says, “that they are selling him.”
translation:
  language: de
  text: 'Memphis aber sagte zu ihrem Mann: „Kauf den jungen Mann, denn ich höre“, sagt sie, „dass sie ihn verkaufen.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μεμφὶς
  choice: Memphis
  rationale: Der Eigenname wird in seiner etablierten gräzisierten Form beibehalten.
- source_word: Ἀγόρασον
  choice: Kauf
  rationale: Der Aoristimperativ bezeichnet hier die konkrete Aufforderung, den jungen Mann zu erwerben.
- source_word: νεανίαν
  choice: jungen Mann
  rationale: Die Bezeichnung meint einen männlichen Jugendlichen beziehungsweise jungen Erwachsenen; „junger Mann“ ist im Deutschen natürlich und präzise.
- source_word: πωλοῦσιν
  choice: sie verkaufen
  rationale: Die unbestimmte dritte Person Plural wird entsprechend der griechischen Form bewahrt, ohne die Verkäufer näher zu bestimmen.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Erzählton. Das eingeschobene φησίν („sagt sie“) bleibt sichtbar, obwohl die Wiederaufnahme im Deutschen markiert wirkt; so wird die auffällige Form des griechischen Textes nicht stillschweigend geglättet.
