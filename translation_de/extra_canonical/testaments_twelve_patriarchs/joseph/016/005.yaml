  source_fidelity: 'Die Übersetzung folgt dem griechischen Text genau: Der Eunuch gibt „ihnen“ achtzig Goldstücke, nimmt Joseph mit und nennt der ägyptischen Frau gegenüber die höhere Summe von hundert. Der durch δέ markierte Gegensatz ist mit „aber“ gewahrt. Die direkte Rede gibt εἶπεν ὅτι δέδωκα idiomatisch wieder, ohne die Aussage abzuschwächen oder zusätzliche Motive einzutragen.'
