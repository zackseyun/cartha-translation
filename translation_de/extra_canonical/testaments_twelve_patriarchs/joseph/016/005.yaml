base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/016/005.yaml
  text: So the eunuch came and gave them eighty pieces of gold and took me; but to the Egyptian woman he said, “I have given a hundred.”
translation:
  language: de
  text: 'Da kam der Eunuch, gab ihnen achtzig Goldstücke und nahm mich mit. Der Ägypterin aber sagte er: »Ich habe hundert gegeben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐνοῦχος
  choice: Eunuch
  rationale: Die direkte, im Deutschen geläufige Entsprechung bewahrt die konkrete Amts- beziehungsweise Personenbezeichnung des griechischen Textes.
- source_word: ὀγδοήκοντα χρυσοῦς
  choice: achtzig Goldstücke
  rationale: χρυσοῦς bezeichnet hier Goldmünzen beziehungsweise Goldstücke; »Goldstücke« ist verständlich, ohne eine nicht genannte Münzeinheit festzulegen.
- source_word: ἀνελάβετό με
  choice: nahm mich mit
  rationale: Im erzählerischen Zusammenhang bezeichnet das Verb die Übernahme und Mitnahme Josephs; die Formulierung klingt im modernen Deutsch natürlich.
- source_word: τῇ δὲ Αἰγυπτίᾳ
  choice: Der Ägypterin aber
  rationale: Die substantivierte feminine Bezeichnung wird knapp und geschlechtsgenau wiedergegeben; »aber« erhält den Kontrast zwischen tatsächlichem Kaufpreis und berichteter Summe.
theological_decisions: []
