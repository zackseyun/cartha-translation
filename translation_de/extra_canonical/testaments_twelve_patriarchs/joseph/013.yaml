  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/013.yaml
  text: '1. But Pentephris, persuaded by her words, ordered the broker to be brought, and said to him, “What is this that I hear concerning you—that you steal souls from the land of Canaan and sell them again as servants?”


    2. But the broker fell at his feet and begged him, saying, “I beg you, lord, I do not know what you are saying.”


    3. And Pentephris fell upon him and said to him, “From where, then, is this Hebrew servant before me?” And he said, “The Ishmaelites entrusted him to me until they return.”


    4. But he did not believe him; rather, he ordered him to be beaten naked. And when he persisted in these words, Pentephris said, “Then let the young man be brought.”


    5. And when I was brought in, I bowed down to Pentephris, for he was, he said, third in rank among Pharaoh’s rulers.


    6. And after separating me from him, he said to me, “Are you a servant or free?” And I said, “A servant.”


    7. And he said, “Whose?” And I said, “The Ishmaelites’.”


    8. But he said, “How did you become their servant?” And I said, “They bought me from the land of Canaan.”


    9. But he said to me, “You are truly lying.” And immediately he ordered me also to be stripped naked...'
translation:
  language: de
  text: '**Testament Josefs 13**


    1 Potifar aber schenkte ihren Worten Glauben, ließ den Zwischenhändler holen und sagte zu ihm: »Was muss ich da über dich hören? Du stiehlst Menschen aus dem Land Kanaan und verkaufst sie als Sklaven weiter!«


    2 Da fiel der Zwischenhändler ihm zu Füßen und flehte ihn an: »Ich bitte dich, Herr, ich weiß nicht, wovon du sprichst.«


    3 Potifar sagte zu ihm: »Woher kommt dann dieser hebräische Sklave?« Er antwortete: »Die Ismaeliter haben ihn mir anvertraut, bis sie zurückkehren.«


    4 Potifar glaubte ihm jedoch nicht, sondern befahl, ihn nackt schlagen zu lassen. Als er bei diesen Aussagen beharrte, sagte Potifar: »Dann soll der junge Mann hereingebracht werden.«


    5 Als ich hereingebracht worden war, warf ich mich vor Potifar nieder; denn er stand unter den Amtsträgern des Pharaos an dritter Stelle.


    6 Er trennte mich von dem Zwischenhändler und fragte mich: »Bist du ein Sklave oder ein freier Mann?« Ich antwortete: »Ein Sklave.«


    7 Er fragte: »Wem gehörst du?« Ich antwortete: »Den Ismaelitern.«


    8 Darauf fragte er: »Wie bist du ihr Sklave geworden?« Ich antwortete: »Sie haben mich aus dem Land Kanaan gekauft.«


    9 Da sagte er zu mir: »Du lügst ganz gewiss.« Und sofort befahl er, auch mich nackt schlagen zu lassen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψυχὰς
  choice: Menschen
  rationale: Wörtlich »Seelen«; im Zusammenhang bezeichnet das Wort menschliche Personen, die geraubt und verkauft werden. »Menschen« ist im modernen Deutschen natürlich und bewahrt den Vorwurf des Menschenraubs.
- source_word: μετάβολος
  choice: Zwischenhändler
  rationale: Bezeichnet hier den Händler beziehungsweise Vermittler, der Josef weiterverkauft; »Zwischenhändler« gibt seine Rolle genauer wieder als das allgemeinere »Händler«.
- source_word: παῖδας / παῖς
  choice: Sklaven / Sklave
  rationale: παῖς kann Kind, Diener oder Sklave bedeuten. Der Kauf, Besitzanspruch und Gegensatz zu ἐλεύθερος zeigen hier den rechtlichen Status eines Sklaven an. In Vers 4 wird νεανίσκος dagegen mit »junger Mann« wiedergegeben.
- source_word: μεταπωλεῖς
  choice: verkaufst … weiter
  rationale: Das Präfix μετα- bezeichnet den Weiter- beziehungsweise Wiederverkauf und wird ausdrücklich wiedergegeben.
- source_word: γυμνὸν τύπτεσθαι
  choice: nackt auszupeitschen
  rationale: γυμνός bedeutet »nackt«, τύπτω »schlagen«. Im Strafkontext vermittelt »auspeitschen« die angeordnete körperliche Züchtigung idiomatisch, ohne den Umstand der Entkleidung auszulassen.
- source_word: προσεκύνησα
  choice: warf ich mich … nieder
  rationale: Das Verb bezeichnet hier eine ehrerbietige Niederwerfung vor einem hochrangigen Amtsträger, nicht notwendig religiöse Anbetung.
theological_decisions:
- issue: Wiedergabe von ψυχή im Vorwurf des Menschenraubs
  choice: Menschen
  alternative: Seelen
  rationale: Der Kontext handelt vom Raub und Weiterverkauf konkreter Personen. Die idiomatische Bedeutung wird wiedergegeben, ohne eine Aussage über eine vom Körper getrennte Seele einzutragen.
- issue: προσκυνέω vor Potifar
  choice: sich niederwerfen
  alternative: anbeten
  rationale: Da die Handlung einem ägyptischen Amtsträger gilt, bezeichnet sie hier soziale Ehrerbietung. »Anbeten« würde eine nicht geforderte theologische Deutung importieren.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer direkter Rede. Der historische Zwangsstatus wird konsequent als »Sklave« bezeichnet. Die Namensform »Potifar« folgt der im Deutschen vertrauten biblischen Form für griechisch Πεντεφρής. Vers 3 folgt dem griechischen λέγει (»sagte«), nicht der sachlich abweichenden englischen Konsultationsfassung »fell upon him«. Vers 5 enthält im griechischen Text kein »wie er sagte«; der Rang wird als Erzähleraussage wiedergegeben. Vers 9 wird nach dem vorhandenen griechischen Satz vollständig mit dem angeordneten Schlagen abgeschlossen.
