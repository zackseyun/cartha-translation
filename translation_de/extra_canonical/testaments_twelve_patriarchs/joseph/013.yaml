review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung folgt dem griechischen Text insgesamt eng und sachgerecht. Insbesondere sind ψυχάς kontextgerecht als »Menschen«, μετάβολος als »Zwischenhändler«, der Statuskontrast δοῦλος/ἐλεύθερος als »Sklave oder freier Mann« und προσκυνέω als ehrerbietige Niederwerfung wiedergegeben. Vers 3 folgt zutreffend dem griechischen »sagte« statt der abweichenden englischen Audit-Fassung. Eine sichere Präzisierung ist bei γυμνὸν τύπτεσθαι nötig: Das griechische Verb bedeutet allgemein »schlagen/prügeln«; »auspeitschen« legt ein nicht genanntes Schlagwerkzeug fest.'
  naturalness: Modernes Standarddeutsch, klar und im angemessen würdigen Erzählregister. Die direkte Rede ist idiomatisch. In Vers 4 ist »Als er trotzdem bei dieser Aussage blieb« etwas weniger quellennah, weil der griechische Genitivus absolutus lediglich das Beharren des Zwischenhändlers während des Vorgangs ausdrückt; »Als er bei diesen Aussagen beharrte« ist klarer und neutraler.
  terminology: Die Namensform »Potifar« ist im deutschen Bibelgebrauch etabliert und für Πεντεφρής vertretbar. Die konsequente Wiedergabe von παῖς/δοῦλος als »Sklave« entspricht dem Kontext. »nackt schlagen zu lassen« wahrt die harte historische Aussage, ohne die nicht ausdrücklich genannte Auspeitschung einzutragen.
  issues:
  - severity: medium
    issue: γυμνὸν τύπτεσθαι wird mit »nackt auszupeitschen« übersetzt.
    rationale: τύπτω bezeichnet hier Schlagen bzw. Prügeln, nicht spezifisch Auspeitschen. Die Übersetzung sollte keine Peitsche als Instrument ergänzen.
  - severity: low
    issue: 'Vers 4: »trotzdem bei dieser Aussage blieb«.'
    rationale: Der griechische Text sagt, dass der Zwischenhändler bei »diesen Worten/Aussagen« beharrte. »Trotzdem« und der Singular sind unnötige Einengungen.
