base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/018.yaml
  text: '1. If, then, you also walk in the commandments of the Lord, God will exalt you in good things forever.

    2. And if anyone wants to do evil to you, you, by doing good, pray for him, and you will be delivered from every evil by the Lord.

    3. For see, you yourselves know that through my humility and my long-suffering I took as my wife the daughter of the priest of Heliopolis, and a hundred talents of gold were given to me with her, and my Lord made them subject to me.

    4. Even so'
translation:
  language: de
  text: '**Das Testament Josefs 18**


    1 Wenn also auch ihr nach den Geboten des Herrn lebt, wird Gott euch für immer im Guten erhöhen.[a]


    2 Und wenn jemand euch Böses tun will, dann tut ihm Gutes und betet für ihn; so wird der Herr euch von allem Bösen erlösen.


    3 Denn seht: Ihr wisst selbst, dass ich durch meine Demut und meine Geduld die Tochter des Priesters von Heliopolis zur Frau nahm. Mit ihr wurden mir hundert Talente Gold gegeben, und mein Herr unterwarf sie mir.[b]


    4 Auch verlieh er mir Schönheit über die Schönen Israels und bewahrte mich bis ins hohe Alter in Kraft und Schönheit; denn in allem glich ich Jakob.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Wendung kann auch „mit guten Dingen“ verstanden werden. Sie lässt offen, ob gute Gaben, günstige Umstände oder das Gute allgemein gemeint sind.
    reason: Erläutert die Bedeutungsbreite von ἐν ἀγαθοῖς, ohne eine einzelne Deutung festzulegen.
  - marker: b
    text: Worauf „sie“ sich bezieht, ist im griechischen Text nicht eindeutig. Das Pronomen steht im männlichen Plural, während unmittelbar zuvor die Talente und die Frau erwähnt werden.
    reason: Bewahrt die unklare pronominale Referenz von αὐτούς im Ausgangstext.
lexical_decisions:
- source_word: πορευθῆτε ἐν ταῖς ἐντολαῖς
  choice: nach den Geboten … lebt
  rationale: Die wörtliche Wegmetapher „in den Geboten wandeln“ ist im heutigen Deutsch weniger natürlich; die gewählte Form gibt die Lebensführung nach den Geboten wieder.
- source_word: ὑψώσει
  choice: wird … erhöhen
  rationale: Bewahrt das Bild der Erhöhung und lässt offen, ob Ansehen, Stellung oder göttliche Segnung im Vordergrund steht.
- source_word: ἐν ἀγαθοῖς
  choice: im Guten
  rationale: Gibt die knappe und mehrdeutige griechische Wendung wieder, ohne sie ausschließlich als Wohlstand, gute Taten oder Segnungen festzulegen.
- source_word: τῇ ἀγαθοεργείᾳ
  choice: dann tut ihm Gutes
  rationale: Gibt den Gedanken tätiger Güte idiomatisch wieder und erhält den Kontrast zum beabsichtigten Bösen.
- source_word: ταπείνωσιν
  choice: Demut
  rationale: Im Zusammenhang mit Josefs vorbildlicher Haltung ist „Demut“ naheliegend; das griechische Wort kann zugleich Erniedrigung oder Niedrigkeit bezeichnen.
- source_word: μακροθυμίαν
  choice: Geduld
  rationale: Natürliches modernes Deutsch für standhaftes, langmütiges Ertragen.
- source_word: κατεδούλωσεν
  choice: unterwarf
  rationale: Bewahrt die starke Aussage des griechischen Verbs, ohne im Deutschen eine unnötig konkrete Versklavungsszene zu erzeugen.
- source_word: ὑπὲρ ὡραίους Ἰσραήλ
  choice: größere Schönheit als den Schönen Israels
  rationale: Folgt dem ungewöhnlichen Vergleich des griechischen Textes und glättet ihn nicht zu einer allgemeineren Aussage.
- source_word: ἕως γήρους
  choice: bis ins hohe Alter
  rationale: Idiomatish und sinngenau für die Bewahrung bis zum Alter.
theological_decisions:
- issue: Verhältnis von gehorsamem Leben und göttlicher Erhöhung
  choice: Die konditionale Aussage bleibt unverändert stehen.
  alternative: Die Erhöhung ausdrücklich als Lohn, Gnade oder Heilszusage deuten.
  rationale: Der griechische Text verbindet das Leben nach den Geboten mit Gottes Erhöhung, erklärt aber das theologische Verhältnis nicht näher.
- issue: Erlösung „von allem Bösen“
  choice: Die umfassende Formulierung wird beibehalten.
  alternative: Sie auf bestimmte Gefahren, Sünde oder endgültiges Heil eingrenzen.
  rationale: παντὸς κακοῦ ist weit gefasst; eine dogmatische Präzisierung wäre ein Zusatz.
- issue: Referent von αὐτούς in Vers 3
  choice: Das mehrdeutige Pronomen wird als „sie“ wiedergegeben.
  alternative: Explizit „die Ägypter“, „die Talente“ oder andere Personen einsetzen.
  rationale: Der unmittelbare Text lässt den maskulinen Plural ohne eindeutiges Bezugswort; die Spannung soll nicht stillschweigend aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Traditionelle, heute aber schwer verständliche Wendungen wie „in den Geboten wandeln“ und „Langmut“ wurden behutsam modernisiert. Die ungewöhnlichen Aussagen über Erhöhung, Schönheit und Unterwerfung wurden nicht theologisch oder erzählerisch harmonisiert.
