  to: '**Das Testament Josefs 18**


    1 Wenn also auch ihr nach den Geboten des Herrn lebt, wird Gott euch für immer im Guten erhöhen.[a]


    2 Und wenn jemand euch Böses tun will, dann tut ihm Gutes und betet für ihn; so wird der Herr euch von allem Bösen erlösen.


    3 Denn seht: Ihr wisst selbst, dass ich durch meine Demut und meine Geduld die Tochter des Priesters von Heliopolis zur Frau nahm. Mit ihr wurden mir hundert Talente Gold gegeben, und mein Herr unterwarf sie mir.[b]


    4 Auch verlieh er mir Schönheit über die Schönen Israels und bewahrte mich bis ins hohe Alter in Kraft und Schönheit; denn in allem glich ich Jakob.'
  rationale: Die Änderungen sind auf sichere sprachliche und semantische Korrekturen beschränkt. Insbesondere wird die Eheschließungsformulierung quellentreu wiedergegeben und der ungewöhnliche Schönheitsvergleich grammatisch richtig ins Deutsche übertragen. Die Mehrdeutigkeit von αὐτούς sowie die semantische Offenheit von ἐν ἀγαθοῖς bleiben erhalten und sind angemessen vermerkt.
  reviewer_model: gpt-5.6-terra
