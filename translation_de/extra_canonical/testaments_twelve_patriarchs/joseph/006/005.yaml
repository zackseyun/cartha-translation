base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/005.yaml
  text: And I said to her, “You have filled it with the sorcery of death. And how could you say, ‘I do not draw near to idols, but to the Lord alone’?”
translation:
  language: de
  text: 'Und ich sagte zu ihr: »Du hast es mit Todeszauber erfüllt. Wie konntest du da sagen: ›Ich nähere mich nicht den Götzen, sondern allein dem Herrn‹?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: γοητείας θανάτου
  choice: Todeszauber
  rationale: Gibt die Genitivverbindung knapp und natürlich wieder; die bedrohliche Verbindung von Zauberei und Tod bleibt erhalten.
- source_word: πῶς εἶπας
  choice: Wie konntest du da sagen
  rationale: Bringt den vorwurfsvollen Sinn der rhetorischen Frage im Deutschen idiomatisch zum Ausdruck.
- source_word: προσεγγίζω
  choice: ich nähere mich
  rationale: Bewahrt die konkrete kultische Annäherungssprache des griechischen Verbs, ohne sie als »verehren« auszudeuten.
- source_word: εἰδώλοις
  choice: den Götzen
  rationale: Entspricht dem religiös-polemischen Sinn von εἴδωλον im Kontext.
- source_word: τῷ Κυρίῳ μόνῳ
  choice: allein dem Herrn
  rationale: Bewahrt sowohl den bestimmten Gottesbezug als auch die Exklusivität von μόνῳ.
theological_decisions:
- issue: Kultische Bedeutung von προσεγγίζω
  choice: wörtlich als »sich nähern« wiedergegeben
  alternative: »verehren« oder »dienen«
  rationale: Der Ausgangstext benennt Annäherung und lässt deren genaue kultische Ausprägung offen; eine stärker deutende Wiedergabe würde diese Offenheit einschränken.
- issue: Genitiv θανάτου bei γοητείας
  choice: als zusammengesetztes »Todeszauber« wiedergegeben
  alternative: »Zauberei des Todes« oder »tödliche Zauberei«
  rationale: Die kompakte Form wahrt die enge Verbindung beider Begriffe, ohne eindeutig zwischen Herkunft, Wirkung oder Qualität des Todes zu entscheiden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede ist klar gegliedert; »da« verdeutlicht idiomatisch den Zusammenhang des Vorwurfs, ohne einen zusätzlichen Kausalgrund einzuführen.
