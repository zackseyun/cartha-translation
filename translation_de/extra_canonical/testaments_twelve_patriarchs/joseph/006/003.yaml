  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/003.yaml
  text: And after he had gone out, I ate neither that food nor any of her other foods, but wept, not having tasted them.
translation:
  language: de
  text: Und nachdem er hinausgegangen war, weinte ich, ohne von jener Speise oder irgendeiner anderen ihrer Speisen gekostet zu haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξελθόντος αὐτοῦ
  choice: nachdem er hinausgegangen war
  rationale: Der absolute Genitiv bezeichnet eine zeitlich vorausgehende Handlung; die Wiedergabe mit einem Nebensatz ist im Deutschen natürlich und bewahrt den männlichen Bezug von αὐτοῦ.
- source_word: ἔκλαιον
  choice: weinte ich
  rationale: Das Imperfekt bezeichnet hier die andauernde Reaktion des Sprechers.
- source_word: μὴ γευσάμενος
  choice: ohne … gekostet zu haben
  rationale: Die verneinte Partizipialkonstruktion wird als vorzeitige Begleitumstandsangabe wiedergegeben, ohne sie als eigenständige Haupthandlung umzuformen.
- source_word: μήτε ἐκείνου μήτε ἄλλου τῶν ἐδεσμάτων αὐτῆς
  choice: weder von jener Speise noch von irgendeiner anderen ihrer Speisen
  rationale: Die doppelte Verknüpfung μήτε … μήτε bleibt erhalten. Das substantivisch gebrauchte ἐκείνου wird aus dem Zusammenhang als einzelne Speise verstanden; ἄλλου mit dem partitiven Ausdruck τῶν ἐδεσμάτων αὐτῆς bezeichnet irgendeine weitere Speise aus ihrem Angebot.
