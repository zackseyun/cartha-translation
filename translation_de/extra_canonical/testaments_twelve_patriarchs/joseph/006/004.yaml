base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/004.yaml
  text: Then after one day she came to me, and when she noticed the food, she said to me, “Why is it that you did not eat the food?”
translation:
  language: de
  text: 'Einen Tag später kam sie zu mir, und als sie das Essen bemerkte, sagte sie zu mir: »Warum hast du das Essen nicht gegessen?«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Μετὰ δὲ μίαν ἡμέραν
  choice: Nach einem Tag
  rationale: Gibt die zeitliche Abfolge natürlich und inhaltlich genau wieder; δέ markiert hier schlicht den Fortgang der Erzählung.
- source_word: ἐλθοῦσα πρός με
  choice: kam sie wieder zu mir
  rationale: »Kam ... zu mir« entspricht der griechischen Wendung. »Wieder« ist im Deutschen aus dem Erzählzusammenhang idiomatisch, auch wenn es nicht durch ein eigenes griechisches Wort ausgedrückt wird.
- source_word: ἐπιγνοῦσα τὸ βρῶμα
  choice: als sie das Essen bemerkte
  rationale: ἐπιγινώσκω kann erkennen, wahrnehmen oder bemerken bedeuten; im Kontext geht es darum, dass sie wahrnimmt, dass das Essen noch da ist. »Bemerkte« vermeidet das unnatürliche »erkannte das Essen«.
- source_word: Τί τοῦτο ὅτι οὐκ ἔφαγες τοῦ βρώματος;
  choice: Warum hast du das Essen nicht gegessen?
  rationale: Die idiomatische Fragekonstruktion wird im modernen Deutsch mit »Warum« wiedergegeben. Der griechische Genitiv nach ἐσθίω bezeichnet hier die Speise, von der Joseph nicht gegessen hat; die natürliche deutsche Form verwendet den Akkusativ.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Wiederholung von »Essen« bleibt erhalten, da sie auch im griechischen Text steht und die Frage auf die unberührte Speise zurückverweist.
