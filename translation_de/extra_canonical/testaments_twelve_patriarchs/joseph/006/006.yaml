  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/006.yaml
  text: Know now, then, that the God of my father, through his angel, revealed your wickedness to me; and by this I preserved it as evidence against you, in hope that perhaps, seeing it, you might repent.”
translation:
  language: de
  text: 'Erkenne nun: Der Gott meines Vaters hat mir durch seinen Engel deine Bosheit offenbart. Dadurch habe ich es für deine Überführung bewahrt[a] – vielleicht kehrst du um, wenn du es siehst.“'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Das griechische αὐτό kann hier grammatisch „es“ oder „ihn“ bedeuten. Der Zusammenhang des vorliegenden Ausschnitts bezeichnet den Bezug nicht eindeutig. Bei einer männlichen Lesart wäre auch am Schluss zu übersetzen: „wenn du ihn siehst“. Möglich ist daher auch: „Dadurch habe ich ihn für deine Überführung bewahrt.“'
    reason: Die Fußnote bewahrt die im griechischen Akkusativ Singular mögliche maskuline oder neutrale Lesart und weist aus, dass die Ellipse beim abschließenden Partizip ἰδοῦσα denselben Bezug betrifft.
lexical_decisions:
- source_word: γνῶθι
  choice: Erkenne
  rationale: Der Aoristimperativ fordert nachdrücklich dazu auf, die nun ausgesprochene Wahrheit zu erkennen; „Erkenne“ bewahrt diesen Ton besser als das umgangssprachlichere „Wisse“.
- source_word: κακίαν
  choice: Bosheit
  rationale: Die breite moralische Bedeutung von κακία bleibt erhalten, ohne sie auf ein bestimmtes Vorhaben oder eine einzelne Tat einzuengen.
- source_word: δι’ ἀγγέλου αὐτοῦ
  choice: durch seinen Engel
  rationale: Gibt Mittel und Zugehörigkeit knapp und unmittelbar wieder.
- source_word: ἐν τούτῳ
  choice: Dadurch
  rationale: Bezieht sich am natürlichsten auf die unmittelbar zuvor genannte Offenbarung durch Gott, ohne den Zusammenhang unnötig auszudeuten.
- source_word: ἐφύλαξα
  choice: habe ich … bewahrt
  rationale: Bewahrt den Grundsinn von φυλάσσω als schützen, behüten oder unversehrt erhalten.
- source_word: εἰς ἔλεγχόν σου
  choice: damit du überführt wirst
  rationale: ἔλεγχος bezeichnet hier ein Überführen beziehungsweise eine zurechtweisende Offenlegung; die Formulierung gibt Zielrichtung und persönlichen Bezug wieder.
- source_word: εἴπως ἄρα … μετανοήσεις
  choice: vielleicht kehrst du ja um
  rationale: Gibt die vorsichtige Hoffnung und Unsicherheit der griechischen Wendung wieder; „umkehren“ erfasst die Sinnes- und Verhaltensänderung von μετανοέω.
theological_decisions:
- issue: Bezug von αὐτό in ἐφύλαξα αὐτό
  choice: „ihn“ als männlicher Personenbezug
  alternative: „es“ als Bezug auf eine Sache oder ein Beweisstück
  rationale: Die Form αὐτό kann morphologisch maskulin oder neutrum sein. Der erzählerische Zusammenhang und die revidierte Konsultationsschicht sprechen für eine geschützte männliche Person; die echte grammatische Mehrdeutigkeit wird in der Fußnote ausgewiesen.
- issue: Zweck des Bewahrens
  choice: „damit du überführt wirst“
  alternative: „als Beweis gegen dich“
  rationale: Die personale Wiedergabe lässt offen, ob das Überführen zugleich Zurechtweisung, Bloßstellung oder Beweisführung bedeutet, und vermeidet eine vorschnelle juristische Verengung.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Anrede. Die Satzfolge folgt dem argumentativen Aufbau des Griechischen; der Gedankenstrich macht den hoffnungsvollen, aber unsicheren Schlusssatz gut verständlich. Das Schlusszeichen übernimmt die im überlieferten Ausschnitt erkennbare Beendigung direkter Rede.
