revisions:
- from: 'Erkenne nun also: Der Gott meines Vaters hat mir durch seinen Engel deine Bosheit offenbart. Dadurch habe ich ihn bewahrt, damit du überführt wirst[a] – vielleicht kehrst du ja um, wenn du es siehst.“'
  to: 'Erkenne nun: Der Gott meines Vaters hat mir durch seinen Engel deine Bosheit offenbart. Dadurch habe ich es für deine Überführung bewahrt[a] – vielleicht kehrst du um, wenn du es siehst.“'
  rationale: Die Revision verbessert die moderne deutsche Idiomatik und bildet die Zweckbestimmung εἰς ἔλεγχόν σου enger ab. Sie bevorzugt im lesbaren Haupttext die sachliche Neutrumlesart, dokumentiert aber ohne kontextfremde Festlegung die mögliche maskuline Lesart einschließlich ihrer Auswirkung auf den Schlusssatz. Damit wird die grammatische Ambiguität des griechischen Textes nicht dogmatisch oder erzählerisch aufgelöst.
  reviewer_model: gpt-5.6-terra
