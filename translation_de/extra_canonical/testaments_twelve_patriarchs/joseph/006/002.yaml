source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ὡς δὲ⁴ ἦλθεν ὁ⁵ εὐνοῦχος ὁ κομίζων αὐτό⁶, *ἀνέβλεψα καὶ⁷ εἶδον *φοβερὸν ἄνδρα⁸ ἐπιδιδόντα μοι *μετὰ τοῦ τρυβλίου⁹ μάχαιραν· καὶ συνῆκα ὅτι¹⁰ *περιέργεια ἐστὶν εἰς ἀποπλάνησίν μου¹¹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/002.yaml
  text: But when the eunuch who was bringing it came, I looked up and saw a terrifying man handing me a sword with the dish; and I understood that it was a scheme to lead me astray.
translation:
  language: de
  text: Als aber der Eunuch kam, der es brachte, blickte ich auf und sah einen furchterregenden Mann, der mir zusammen mit der Schale ein Schwert reichte. Da erkannte ich, dass dies eine List war, um mich irrezuführen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐνοῦχος
  choice: Eunuch
  rationale: Die direkte und im Deutschen verständliche Entsprechung bewahrt die konkrete Bezeichnung der Person.
- source_word: κομίζων
  choice: brachte
  rationale: Das Partizip bezeichnet hier das Herbeibringen des zuvor erwähnten Gegenstands; die schlichte Vergangenheitsform klingt im Deutschen natürlich.
- source_word: ἀνέβλεψα
  choice: blickte ich auf
  rationale: Gibt die räumliche Blickbewegung präziser wieder als das mehrdeutige „sah wieder“.
- source_word: φοβερόν
  choice: furchterregenden
  rationale: 'Bewahrt die aktive Bedeutung: Der Mann erweckt Furcht bzw. erscheint schrecklich.'
- source_word: ἐπιδιδόντα
  choice: reichte
  rationale: Im Zusammenhang mit Schale und Schwert ist „reichen“ idiomatisch und entspricht dem Übergeben bzw. Darreichen.
- source_word: μετὰ τοῦ τρυβλίου
  choice: zusammen mit der Schale
  rationale: Gibt die Begleitung beziehungsweise gleichzeitige Darreichung wieder, ohne eine genauere räumliche Anordnung festzulegen.
- source_word: περιέργεια
  choice: List
  rationale: Im Kontext bezeichnet das Wort ein arglistiges Vorgehen oder Ränkespiel; „List“ ist verständlich und passt zur beabsichtigten Verführung.
- source_word: εἰς ἀποπλάνησίν μου
  choice: um mich irrezuführen
  rationale: Gibt Zielrichtung und personalen Bezug klar wieder; „irreführen“ bewahrt den Sinn des Abbringens oder Verleitens.
theological_decisions:
- issue: Identität des furchterregenden Mannes
  choice: Die unbestimmte Bezeichnung „einen furchterregenden Mann“ bleibt erhalten.
  alternative: Den Mann ausdrücklich als übernatürliche oder dämonische Gestalt kennzeichnen.
  rationale: Der griechische Text nennt lediglich einen Mann und lässt dessen genaue Identität offen; diese Ambiguität darf nicht dogmatisch aufgelöst werden.
- issue: Art der versuchten Verführung
  choice: Allgemein „um mich irrezuführen“.
  alternative: Konkret „um mich zur Sünde zu verführen“ oder „vom Glauben abzubringen“.
  rationale: ἀποπλάνησις bezeichnet ein Irreführen oder Abbringen, ohne an dieser Stelle die genaue theologische Art des Fehlwegs ausdrücklich zu benennen.
translation_notes:
  register: Moderne, würdige Standardsprache mit klarer Erzählfolge. Der Satzbau folgt dem griechischen Ablauf, wird aber für natürliches Deutsch gegliedert. Das demonstrative „dies“ bezieht die ganze wahrgenommene Szene auf die erkannte List.
