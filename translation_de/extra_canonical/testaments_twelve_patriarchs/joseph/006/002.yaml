  source_fidelity: 'Der Entwurf gibt die Abfolge und die wesentlichen Aussagen des griechischen Textes präzise wieder: das Kommen des Eunuchen, das Aufblicken, den furchterregenden Mann, das Darreichen eines Schwertes zusammen mit der Schale sowie Josephs Erkenntnis einer auf seine Irreführung zielenden List. „Es“ bewahrt den im Auszug kontextabhängigen Bezug von αὐτό, ohne einen nicht ausdrücklich genannten Gegenstand festzulegen.'
