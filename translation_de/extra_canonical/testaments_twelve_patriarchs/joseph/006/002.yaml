  terminology: „Eunuch“ ist die unmittelbare, sachlich richtige Entsprechung zu εὐνοῦχος. „Schale“ ist für τρυβλίον angemessen. „List“ und „um mich irrezuführen“ geben περιέργεια und εἰς ἀποπλάνησίν μου ohne unzulässige dogmatische oder psychologische Konkretisierung wieder. Die unbestimmte Benennung des Mannes bleibt erhalten.
