source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: ¹Καὶ μετὰ τοῦτο¹¹ ἀποστέλλει² μοι βρῶμα ἐν γοητείᾳ πεφυρμένον³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/006/001.yaml
  text: And after this she sent me food mixed with sorcery.
translation:
  language: de
  text: Und danach schickte sie mir Speise, die mit Zauberei vermischt war.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀποστέλλει
  choice: schickte
  rationale: Das griechische historische Präsens wird im Deutschen natürlich als Vergangenheit wiedergegeben.
- source_word: βρῶμα
  choice: Speise
  rationale: Bezeichnet Nahrung bzw. Essen; „Speise“ bewahrt hier einen würdigen erzählerischen Ton.
- source_word: ἐν γοητείᾳ πεφυρμένον
  choice: mit Zauberei vermischt
  rationale: πεφυρμένον bezeichnet etwas Vermischtes oder Vermengtes; ἐν γοητείᾳ benennt das Mittel beziehungsweise den Bereich magischer Praktiken. Die Formulierung bewahrt die Aussage, ohne genauer festzulegen, worin die Zauberei bestand.
theological_decisions:
- issue: Art und Wirkung der Zauberei
  choice: Die Speise wird als „mit Zauberei vermischt“ beschrieben.
  alternative: „mit einem Zaubermittel versetzt“ oder „durch Zauberei zubereitet“
  rationale: Der griechische Text benennt weder eine konkrete Substanz noch ausdrücklich die beabsichtigte Wirkung. Die Übersetzung lässt diese Unbestimmtheit bestehen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton; die Satzstruktur bleibt nahe am knappen griechischen Wortlaut.
