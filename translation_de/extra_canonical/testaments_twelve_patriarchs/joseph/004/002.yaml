  source_fidelity: Die Übersetzung gibt die überlieferte 3. Person Plural im Imperfekt (ἔλεγον) ohne unbelegte Harmonisierung zum erzählenden Ich wieder. „Worte des Höchsten“ entspricht ῥήματα ὑψίστου; „ob … vielleicht“ bewahrt die unsichere, als indirekte Frage formulierte Erwartung von εἰ ἄρα. „Sich von … abwenden“ gibt ἐπιστρέψει ἀπό angemessen wieder.
  naturalness: Das Deutsch ist modernes, verständliches Standarddeutsch mit bewusst leicht gehobenem biblischem Ton. Die Verbindung „zu ihr Worte sagen“ ist weniger alltäglich als „ihr Worte sagen“, aber idiomatisch vertretbar und bildet πρός αὐτήν angemessen ab.
  terminology: „Der Höchste“ ist ein etablierter deutscher Gottes­titel und wahrt die Formulierung des griechischen Textes. „Böse Begierde“ ist neutral und quellentreu; ein Possessivpronomen sollte nicht ergänzt werden.
