source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἔλεγον *πρὸς αὐτὴν⁶¹ ῥήματα ὑψίστου, εἰ ἄρα ἐπιστρέψει⁶² ἀπὸ τῆς ἐπιθυμίας⁶³ τῆς πονηρᾶς⁶⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/002.yaml
  text: And I would speak to her words of the Most High, whether perhaps she might turn back from the evil desire.
translation:
  language: de
  text: Und sie sagten zu ihr Worte des Höchsten, ob sie sich vielleicht von der bösen Begierde abwenden würde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγον
  choice: sie sagten
  rationale: Die überlieferte Form ist 3. Person Plural Imperfekt; die Übersetzung bewahrt Subjekt und durativen beziehungsweise wiederholten Aspekt ohne eine nicht belegte Sprecheränderung.
- source_word: ῥήματα ὑψίστου
  choice: Worte des Höchsten
  rationale: Die formale und würdige Wendung gibt sowohl den Plural ῥήματα als auch den Gottes­titel ὑψίστου unmittelbar wieder.
- source_word: ἐπιστρέψει
  choice: sich … abwenden würde
  rationale: Im Zusammenhang mit ἀπό bezeichnet ἐπιστρέφω die Abkehr von etwas; der deutsche Konjunktiv gibt die im indirekten Fragesatz enthaltene Möglichkeit wieder.
- source_word: ἐπιθυμίας τῆς πονηρᾶς
  choice: der bösen Begierde
  rationale: Die attributive Fügung wird eng am Griechischen wiedergegeben; der bestimmte Artikel bleibt erhalten, ohne durch ein unbelegtes Possessivpronomen ergänzt zu werden.
theological_decisions:
- issue: Subjekt von ἔλεγον
  choice: '3. Person Plural: „sie sagten“'
  alternative: '1. Person Singular: „ich sagte“'
  rationale: Obwohl der Erzählzusammenhang möglicherweise Joseph als Sprecher erwarten lässt, lautet die vorgelegte griechische Form eindeutig ἔλεγον. Die Übersetzung korrigiert den Text nicht stillschweigend.
- issue: Zweck oder indirekte Frage bei εἰ ἄρα
  choice: „ob … vielleicht“
  alternative: „damit sie sich vielleicht … abwenden würde“ / „um zu sehen, ob …“
  rationale: εἰ ἄρα formuliert eine unsichere Erwartung beziehungsweise indirekte Frage. Eine ausdrückliche Zweckangabe wäre interpretierend hinzugefügt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die leicht ungewöhnliche Verbindung „jemandem Worte sagen“ bleibt zugunsten der Nähe zur griechischen Ausdrucksweise erhalten; die genuine Unsicherheit von εἰ ἄρα wird mit „ob … vielleicht“ bewahrt.
