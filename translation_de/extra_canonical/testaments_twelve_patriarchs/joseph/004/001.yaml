source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ νοήσας ἐγὼ⁵⁵ ἐλυπήθην ἕως θανάτου⁵⁶· *ἐξελθούσης δὲ⁵⁷ αὐτῆς ἦλθον εἰς ἐμαυτόν, καὶ ἐπένθησα⁵⁸ περὶ αὐτῆς⁵⁹ ἡμέρας πολλάς, *ὅτι ἔγνων τὸν δόλον αὐτῆς καὶ τὴν πλάνην⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/001.yaml
  text: And when I understood, I was grieved unto death. But after she had gone out, I came to myself and mourned over her for many days, because I knew her deceit and her delusion.
translation:
  language: de
  text: Als ich das begriff, war ich zu Tode betrübt. Nachdem sie aber hinausgegangen war, kam ich wieder zu mir und trauerte viele Tage lang um sie, denn ich hatte ihre Hinterlist und ihre Verblendung erkannt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νοήσας
  choice: als ich das begriff
  rationale: Gibt das verstehende Erfassen des zuvor Geschehenen natürlich und präzise wieder.
- source_word: ἐλυπήθην ἕως θανάτου
  choice: war ich zu Tode betrübt
  rationale: Bewahrt die starke, idiomatische Aussage des Griechischen, ohne sie abzuschwächen.
- source_word: ἦλθον εἰς ἐμαυτόν
  choice: kam ich wieder zu mir
  rationale: Entspricht der griechischen Wendung und ist im modernen Deutschen unmittelbar verständlich.
- source_word: ἐπένθησα περὶ αὐτῆς
  choice: trauerte ... um sie
  rationale: Gibt die persönliche Trauer über sie idiomatisch wieder; der Kontext verlangt nicht, dass sie gestorben war.
- source_word: τὸν δόλον αὐτῆς
  choice: ihre Hinterlist
  rationale: Bezeichnet einen bewusst angelegten Täuschungsplan und unterscheidet sich so von der folgenden πλάνη.
- source_word: τὴν πλάνην
  choice: ihre Verblendung
  rationale: Bewahrt neben der aktiven Hinterlist den Gedanken des Irrens beziehungsweise inneren Getäuschtseins; die Wendung bleibt personbezogen wie im Griechischen.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur folgt dem griechischen Gedankengang, wurde aber für einen natürlichen deutschen Lesefluss leicht geglättet. Die Spannung zwischen bewusster Hinterlist und eigener Verblendung bleibt erhalten.
