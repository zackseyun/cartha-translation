  source_fidelity: 'Die Übersetzung gibt den Gedankengang und die zentralen Ausdrücke zuverlässig wieder: νοήσας mit „als ich das begriff“, ἐλυπήθην ἕως θανάτου mit der starken idiomatischen Wendung „zu Tode betrübt“, ἦλθον εἰς ἐμαυτόν mit „kam ich wieder zu mir“ sowie ἐπένθησα περὶ αὐτῆς mit „trauerte ... um sie“. „Hinterlist“ für δόλος und „Verblendung“ für πλάνη bewahren die im Text angelegte Unterscheidung zwischen täuschender Absicht und Verirrung bzw. Getäuschtsein. „Hatte ... erkannt“ ist als deutscher kausaler Rückbezug sachlich vertretbar und wahrt den Sinn von ἔγνων.'
