reference: Testament of Joseph 4:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἐγὼ δὲ πρὸς αὐτὴν ἔλεγον³⁸ *ὅτι οὐχ³⁹ ἐν ἀκαθαρσίᾳ θέλει⁴⁰ Κύριος τοὺς σεβομένους αὐτόν, οὔτε⁴¹ *τοῖς μοιχεύουσιν εὐδοκεῖ⁴², ⌈ἀλλὰ τοῖς ἐν καθαρᾷ καρδίᾳ καὶ στόμασιν ἀμίαντοις αὐτῷ προσερχομένοις⁴³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/008.yaml
  text: But I said to her, “The Lord does not will that those who revere him should be in uncleanness, nor does he delight in adulterers, but in those who draw near to him with a pure heart and undefiled lips.”
translation:
  language: de
  text: 'Ich aber sagte zu ihr: »Der Herr will nicht, dass die, die ihn ehren, in Unreinheit leben. Auch hat er kein Gefallen an denen, die Ehebruch begehen, sondern an denen, die sich ihm mit reinem Herzen und unbefleckten Lippen nahen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τοὺς σεβομένους αὐτόν
  choice: die, die ihn ehren
  rationale: Gibt die fortdauernde ehrfürchtige Haltung gegenüber dem Herrn in natürlichem modernem Deutsch wieder; „verehren“ wäre ebenfalls möglich, kann aber kultischer klingen.
- source_word: ἐν ἀκαθαρσίᾳ
  choice: in Unreinheit leben
  rationale: Das im Griechischen elliptische „in Unreinheit“ wird durch „leben“ idiomatisch ergänzt, ohne die moralisch-sexuelle Bedeutung im Kontext einzuengen.
- source_word: τοῖς μοιχεύουσιν
  choice: denen, die Ehebruch begehen
  rationale: Bewahrt die konkrete Bedeutung des Partizips und vermeidet eine pauschale Identitätsbezeichnung wie „Ehebrecher“.
- source_word: εὐδοκεῖ
  choice: hat er kein Gefallen an
  rationale: Entspricht der Bedeutung von Wohlgefallen bzw. Billigung und wahrt den gehobenen, biblischen Ton.
- source_word: ἐν καθαρᾷ καρδίᾳ
  choice: mit reinem Herzen
  rationale: Die Präposition wird im Deutschen instrumental bzw. modal natürlich mit „mit“ wiedergegeben.
- source_word: στόμασιν ἀμίαντοις
  choice: mit unbefleckten Lippen
  rationale: Das griechische „Mündern“ wird nach deutscher biblischer Ausdrucksweise mit „Lippen“ wiedergegeben; „unbefleckt“ bewahrt das Reinheitsmotiv.
- source_word: προσερχομένοις
  choice: die sich ihm … nahen
  rationale: Bewahrt die kultisch-religiöse Konnotation des Sich-Gott-Näherns, ohne sie auf einen bestimmten Ritus festzulegen.
theological_decisions:
- issue: Gegenstand des göttlichen Wohlgefallens
  choice: „sondern an denen“ ergänzt gedanklich „hat er Gefallen“
  alternative: „sondern er hat Gefallen an denen“ ausdrücklich wiederholen
  rationale: Die knappe griechische Gegenüberstellung bleibt erhalten und ist im Deutschen eindeutig.
- issue: Bedeutungsumfang von ἀκαθαρσία
  choice: „Unreinheit“ ohne nähere Bestimmung
  alternative: „sexuelle Unmoral“ oder „Unkeuschheit“
  rationale: Der Kontext ist sexuell geprägt, doch der griechische Ausdruck kann weiter reichen; die Übersetzung bewahrt diese Bedeutungsbreite.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Die direkte Rede und die dreiteilige Gegenüberstellung des griechischen Satzes bleiben erhalten; unnötige konfessionelle oder dogmatische Präzisierungen wurden vermieden.
