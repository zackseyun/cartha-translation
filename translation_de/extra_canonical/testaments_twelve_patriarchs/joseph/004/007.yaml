  text: καὶ λέγει³⁰ μοι³¹· Εἰ θέλῃς³² ἵνα καταλείψω³³ τὰ εἴδωλα, συγγενοῦς³⁴ μου, *κἀγὼ πείθω τὸν ἄνδρα μου³⁵ ἀποστῆναι ἀπὸ³⁶ τῶν εἰδώλων, *καὶ πορευσόμεθα †ἐνώπιον Κυρίου σου³⁷.
