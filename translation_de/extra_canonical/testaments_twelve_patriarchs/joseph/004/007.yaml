revisions:
- from: 'Und sie sagt zu mir: „Wenn du willst, dass ich die Götzen aufgebe, mein Verwandter, werde auch ich meinen Mann dazu bewegen, sich von den Götzen abzuwenden; dann werden wir vor deinem Herrn gehen.“'
  to: 'Und sie sagt zu mir: „Wenn du willst, dass ich die Götzen aufgebe, mein Verwandter, will ich meinen Mann überzeugen, sich von den Götzen abzuwenden; und wir werden vor deinem Herrn wandeln.“'
  rationale: Die Revision entfernt die nicht ausdrücklich markierte Verstärkung „auch“ und ersetzt die im Deutschen missverständliche Formulierung „vor deinem Herrn gehen“ durch „vor deinem Herrn wandeln“. Sie fügt weder Gesetz noch eine sonstige Deutung des Wandels hinzu und erhält die ungewöhnliche Anrede sowie die Satzstruktur des griechischen Textes.
