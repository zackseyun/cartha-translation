  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/007.yaml
  text: And she says to me, “If you want me to leave the idols, my kinsman, I will persuade my husband to withdraw from the idols, and we will walk before your Lord.”
translation:
  language: de
  text: 'Und sie sagt zu mir: „Wenn du willst, dass ich die Götzen aufgebe, mein Verwandter, will ich meinen Mann überzeugen, sich von den Götzen abzuwenden; und wir werden vor deinem Herrn wandeln.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλείψω τὰ εἴδωλα
  choice: die Götzen aufgebe
  rationale: Gibt das Zurücklassen bzw. Aufgeben des Götzendienstes natürlich wieder, ohne zusätzliche Deutung einzuführen.
- source_word: συγγενοῦς μου
  choice: mein Verwandter
  rationale: Folgt trotz der auffälligen griechischen Form der im Zusammenhang naheliegenden Anrede und bewahrt die bezeichnete verwandtschaftliche Beziehung.
- source_word: πείθω τὸν ἄνδρα μου ἀποστῆναι
  choice: werde auch ich meinen Mann dazu bewegen, sich … abzuwenden
  rationale: Das Präsens πείθω erhält im Bedingungssatz natürlichen Zukunftsbezug; ἀποστῆναι bezeichnet ein Sich-Entfernen oder Abwenden.
- source_word: πορευσόμεθα ἐνώπιον Κυρίου σου
  choice: dann werden wir vor deinem Herrn gehen
  rationale: Bewahrt die konkrete Bewegungsmetapher und die offene Bedeutung von ‚vor dem Herrn gehen‘, statt sie ausdrücklich als Gesetzesgehorsam oder Lebenswandel auszulegen.
theological_decisions:
- issue: Bedeutung des Gehens vor dem Herrn
  choice: vor deinem Herrn gehen
  alternative: nach dem Gesetz deines Herrn leben
  rationale: Der überlieferte griechische Text nennt an dieser Stelle kein Gesetz. Die knappe Formulierung erhält deshalb die mögliche religiös-ethische Bedeutung, ohne sie durch nicht belegte Wörter festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Rede bleibt eng an der griechischen Satzfolge, wird aber durch „werde“ und „dann“ im Deutschen idiomatisch als Folge der Bedingung kenntlich gemacht.
