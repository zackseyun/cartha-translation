review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt die wesentlichen Aussagen des griechischen Textes zutreffend wieder: das Verlassen der Götzen, die Einflussnahme auf den Ehemann, dessen Abkehr von den Götzen sowie das Gehen vor dem Herrn des Angeredeten. „Auch“ hat jedoch keine ausdrückliche Entsprechung im griechischen Text und sollte nicht hinzugefügt werden. „Dann“ ist als Folgerung zwar verständlich, aber gegenüber der einfachen Verbindung καί leicht explizierend.'
  naturalness: „Vor deinem Herrn gehen“ ist im heutigen Deutsch weniger idiomatisch und kann räumlich missverstanden werden. „Vor deinem Herrn wandeln“ ist würdig, gut verständlich und bewahrt die im religiösen Sprachgebrauch offene Metapher von πορεύομαι ἐνώπιον.
  terminology: „Götzen“ ist für εἴδωλα angemessen. „Mein Verwandter“ bewahrt die auffällige verwandtschaftliche Anrede συγγενοῦς μου, ohne eine nähere Verwandtschaftsbezeichnung zu behaupten. „Herr“ gibt Κύριος korrekt wieder.
  issues:
  - severity: low
    issue: Nicht belegtes „auch“
    rationale: Das griechische καὶ ἐγώ verbindet die Aussage, setzt aber kein deutsches hervorhebendes „auch ich“ zwingend voraus. Das Zusatzwort kann einen nicht klar markierten Kontrast oder eine Gegenseitigkeit nahelegen.
  - severity: low
    issue: Unidiomatische Wiedergabe von πορευσόμεθα ἐνώπιον Κυρίου σου
    rationale: „Vor deinem Herrn gehen“ wirkt im modernen Deutsch vorwiegend räumlich. „Vor deinem Herrn wandeln“ gibt die traditionelle, semantisch offene religiöse Bewegungsmetapher natürlicher wieder, ohne „nach dem Gesetz“ hinzuzufügen.
  revised_text: 'Und sie sagt zu mir: „Wenn du willst, dass ich die Götzen aufgebe, mein Verwandter, will ich meinen Mann überzeugen, sich von den Götzen abzuwenden; und wir werden vor deinem Herrn wandeln.“'
