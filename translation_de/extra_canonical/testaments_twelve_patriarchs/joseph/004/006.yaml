  - severity: low
    issue: „mit belehrenden Worten“ steht im Plural, obwohl λόγῳ κατηχήσεως singularisch ist.
    rationale: Der Plural ist idiomatisch, entfernt sich aber unnötig von der Formulierung der Quelle. „Mit einem Wort der Unterweisung“ bewahrt den Singular und ist verständlich.
