  source_fidelity: 'Die Grundbedeutung ist gut getroffen: οὐδὲν ἴσχυσεν ἐν τούτῳ wird idiomatisch als erfolgloses Bemühen wiedergegeben, und der inchoative, wiederholte Vorgang von πάλιν ἔτι ... ἤρχετο bleibt erhalten. Allerdings ist λόγῳ κατηχήσεως im Singular formuliert; außerdem gibt „weil“ den finalen Infinitiv τοῦ μαθεῖν weniger genau wieder als eine Zweckangabe.'
  naturalness: Der Satz ist modernes, gut lesbares Standarddeutsch. „Mit Worten der Belehrung“ ist trotz der näheren Anbindung an den griechischen Singular natürlich genug und vermeidet die etwas technische, anachronistisch mögliche Bezeichnung „Katechese“.
  terminology: „Wort Gottes“ ist für λόγος Θεοῦ angemessen. „Unterweisung“ gibt κατήχησις sachlich und ohne spätere konfessionell-technische Engführung wieder. „Kennenlernen“ ist im Deutschen als Ziel des Lernens natürlich, während die Zweckkonstruktion keine unbelegte Bewertung ihrer Aufrichtigkeit hinzufügt.
