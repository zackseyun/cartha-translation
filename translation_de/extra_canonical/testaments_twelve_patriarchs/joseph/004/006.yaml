source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ὡς δὲ οὐδὲν ἴσχυσεν²³ *ἐν τούτῳ²⁴, πάλιν ἔτι²⁵ λόγῳ κατηχήσεως ἤρχετο²⁶ πρὸς με τοῦ²⁷ μαθεῖν²⁸ λόγον Θεοῦ²⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/006.yaml
  text: Since she accomplished nothing in this, she again began to come to me with words of instruction, wanting to learn the word of God.
translation:
  language: de
  text: Da sie damit nichts erreichte, begann sie wieder, mit einem Wort der Unterweisung zu mir zu kommen, um das Wort Gottes kennenzulernen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐδὲν ἴσχυσεν ἐν τούτῳ
  choice: sie damit nichts erreichte
  rationale: Gibt das erfolglose Bemühen idiomatisch wieder und bewahrt den Rückbezug von ἐν τούτῳ, ohne ein zusätzliches Mittel oder Vorgehen einzutragen.
- source_word: πάλιν ἔτι ... ἤρχετο πρὸς με
  choice: begann sie wieder, ... zu mir zu kommen
  rationale: Bewahrt den inchoativen und wiederholenden Sinn; πάλιν und ἔτι werden zusammen natürlich durch „wieder“ ausgedrückt.
- source_word: λόγῳ κατηχήσεως
  choice: mit belehrenden Worten
  rationale: κατήχησις bezeichnet hier Unterweisung oder Belehrung; die pluralische deutsche Wendung entspricht natürlichem Sprachgebrauch, ohne eine spätere technische Bedeutung von „Katechese“ aufzudrängen.
- source_word: τοῦ μαθεῖν λόγον Θεοῦ
  choice: weil sie das Wort Gottes kennenlernen wollte
  rationale: Gibt den finalen Infinitiv und ihr vorgebliches Lernanliegen verständlich wieder; „kennenlernen“ passt zur Aneignung einer Lehre besser als bloßes Faktenlernen.
theological_decisions:
- issue: Ernsthaftigkeit ihres Wunsches, Gottes Wort kennenzulernen
  choice: Die Aussage wird ohne ausdrückliche Bewertung ihrer Aufrichtigkeit wiedergegeben.
  alternative: „unter dem Vorwand, das Wort Gottes kennenlernen zu wollen“
  rationale: Der griechische Satz nennt den Zweck beziehungsweise das erklärte Anliegen, markiert es hier aber nicht ausdrücklich als Vorwand. Der Kontext mag Täuschung nahelegen, doch diese Deutung soll nicht in den Wortlaut eingetragen werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Formulierung bleibt nah an der griechischen Satzbewegung, vermeidet jedoch das im Deutschen sperrige „mit einem Wort der Unterweisung“.
