    issue: βουλομένη wird mit „weil“ wiedergegeben.
    rationale: Das griechische Partizip beschreibt ihre Absicht bzw. ihr Wollen, nicht primär einen Kausalgrund. Eine Zweck-/Absichtsformulierung ist genauer.
  - severity: low
    issue: Die Vergleichsformel „wie einem heiligen Mann“ ist im Deutschen syntaktisch und semantisch leicht holprig.
    rationale: ὡς ἁγίῳ ἀνδρί bedeutet, dass sie ihn wie einen heiligen Mann behandelte bzw. schmeichelte, als sei er ein heiliger Mann. Eine explizitere Vergleichsform bewahrt dies natürlicher.
  revised_text: Oft schmeichelte sie mir mit Worten, als wäre ich ein heiliger Mann; und mit betrügerischen Worten lobte sie meine Selbstbeherrschung vor ihrem Mann, in der Absicht, mich zu Fall zu bringen, wenn wir allein waren.
