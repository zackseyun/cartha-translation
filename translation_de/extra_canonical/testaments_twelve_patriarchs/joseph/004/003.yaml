base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/003.yaml
  text: So then, many times, as to a holy man, she flattered me with words; and with deceit she praised my self-control before her husband, wishing to trip me up when we were alone.
translation:
  language: de
  text: Oft schmeichelte sie mir mit Worten, als wäre ich ein heiliger Mann; und mit betrügerischen Worten lobte sie meine Selbstbeherrschung vor ihrem Mann, in der Absicht, mich zu Fall zu bringen, wenn wir allein waren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὡς ἁγίῳ ἀνδρί
  choice: wie einem heiligen Mann
  rationale: Gibt den Vergleich und die respektvolle religiöse Bezeichnung unmittelbar wieder, ohne eine weitergehende Deutung einzutragen.
- source_word: ἐκολάκευέ με
  choice: schmeichelte sie mir
  rationale: Entspricht der negativen Bedeutung von κολακεύω und klingt im modernen Deutschen natürlich.
- source_word: μετὰ δόλου
  choice: in betrügerischer Absicht
  rationale: Macht den intentionalen Charakter des griechischen Ausdrucks deutlich; bloßes „mit Täuschung“ wäre weniger idiomatisch.
- source_word: τὴν σωφροσύνην μου
  choice: meine Selbstbeherrschung
  rationale: Im Kontext bezeichnet σωφροσύνη besonders sexuelle Besonnenheit und Keuschheit; „Selbstbeherrschung“ bewahrt jedoch die größere Bedeutungsbreite des Wortes.
- source_word: κατὰ μόνας
  choice: unter vier Augen
  rationale: Natürliche deutsche Wiedergabe für eine Situation ohne weitere Anwesende; die relationale Formulierung lässt offen, ob ausdrücklich nur die beiden gemeint sind.
- source_word: ὑποσκελίσαι με
  choice: mich zu Fall bringen
  rationale: Bewahrt das bildhafte „ein Bein stellen/stürzen“ und zugleich den übertragenen Sinn, Joseph moralisch zu Fall zu bringen.
theological_decisions:
- issue: Bedeutung von σωφροσύνη
  choice: Selbstbeherrschung
  alternative: Keuschheit
  rationale: Der sexuelle Kontext legt „Keuschheit“ nahe, doch der griechische Begriff ist weiter. „Selbstbeherrschung“ erhält diese Spannung, ohne den Kontext zu verdecken.
- issue: Charakterisierung Josephs als ἅγιος
  choice: wie einem heiligen Mann
  alternative: als wäre ich ein heiliger Mann
  rationale: Die knappe Vergleichsform des Griechischen bleibt erhalten; der Text entscheidet nicht ausdrücklich, ob sie Joseph aufrichtig so bezeichnete oder diese Anrede nur als Schmeichelei einsetzte.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau wurde leicht geglättet, während Abfolge, Täuschungsabsicht und das Bild des moralischen Zu-Fall-Bringens erhalten bleiben.
