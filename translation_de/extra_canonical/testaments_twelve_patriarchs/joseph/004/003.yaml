revisions:
- from: Oft schmeichelte sie mir also mit Worten wie einem heiligen Mann; und in betrügerischer Absicht lobte sie meine Selbstbeherrschung vor ihrem Mann, weil sie mich unter vier Augen zu Fall bringen wollte.
  to: Oft schmeichelte sie mir mit Worten, als wäre ich ein heiliger Mann; und mit betrügerischen Worten lobte sie meine Selbstbeherrschung vor ihrem Mann, in der Absicht, mich zu Fall zu bringen, wenn wir allein waren.
  rationale: Die Revision erhält die Reihenfolge und den Sinn des griechischen Textes, macht die absichtliche Nuance von βουλομένη präzise und glättet die deutsche Wiedergabe von ὡς ἁγίῳ ἀνδρί. „Mit betrügerischen Worten“ bündelt μετὰ δόλου διὰ ῥημάτων natürlich, ohne die Täuschung abzuschwächen.
