source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἐγὼ δὲ⁴⁵ προσετιθέμην *νηστείαν καὶ⁴⁶ προσευχήν, ὅπως ῥύσεταί⁴⁷ με ὁ⁴⁸ Κύριος ἀπ᾽ αὐτῆς⁴⁹.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/010.yaml
  text: And I added fasting and prayer, so that the Lord might rescue me from her.
translation:
  language: de
  text: Ich aber fügte Fasten und Gebet hinzu, damit der Herr mich von ihr errette.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσετιθέμην
  choice: fügte … hinzu
  rationale: Gibt das imperfektische Medium von προστίθημι sachlich und natürlich wieder; der fortdauernde bzw. wiederholte Aspekt bleibt im Kontext offen.
- source_word: νηστείαν καὶ προσευχήν
  choice: Fasten und Gebet
  rationale: Direkte und im Deutschen geläufige Wiedergabe der beiden religiösen Praktiken.
- source_word: ῥύσεταί με
  choice: mich … errette
  rationale: ῥύομαι bezeichnet Befreiung oder Rettung aus einer Bedrängnis; „errette“ bewahrt den würdigen, gebetsbezogenen Ton.
- source_word: ἀπ᾽ αὐτῆς
  choice: von ihr
  rationale: Das feminine Pronomen verweist auf die zuvor genannte Frau; die knappe griechische Formulierung wird ohne interpretierende Ergänzung bewahrt.
theological_decisions:
- issue: Verhältnis menschlicher Askese zu göttlicher Rettung
  choice: „fügte Fasten und Gebet hinzu, damit der Herr mich … errette“
  alternative: „fastete und betete noch mehr, sodass der Herr mich rettete“
  rationale: Die Zweckkonstruktion ὅπως mit Futur wird als erhoffte bzw. erbetene Rettung wiedergegeben, nicht als bereits eingetretene Folge oder als Verdienst der asketischen Handlungen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit leicht gehobenem, würdigem Ton. Die Satzstruktur bleibt nahe am Griechischen, ohne unnatürlich zu wirken.
