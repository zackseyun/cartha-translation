source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*᾿Εδόξαζε ⌜γάρ⌝¹¹ με ὡς σώφρονα *φανερῶς, καὶ ἐν κρυφῇ¹² ἔλεγέ μοι· Μὴ φοβηθῇς τὸν ἄνδρα μου· καὶ γὰρ πέπεισται¹⁴ περὶ τῆς σωφροσύνης σου¹⁵· ὅτι κἂν *τις αὐτῷ εἴπῃ¹⁶ περὶ ἡμῶν, *οὐ πιστεύσει¹⁷.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/004.yaml
  text: For she openly extolled me as self-controlled, but in secret she said to me, “Do not be afraid of my husband; for he is persuaded about your purity, and even if someone should tell him about us, he will not believe it.”
translation:
  language: de
  text: 'Denn öffentlich pries sie mich als selbstbeherrscht, insgeheim aber sagte sie zu mir: »Fürchte dich nicht vor meinem Mann; denn er ist von deiner Selbstbeherrschung überzeugt. Selbst wenn ihm jemand von uns beiden erzählen sollte, wird er es nicht glauben.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνη / σώφρονα
  choice: Selbstbeherrschung / wegen meiner Selbstbeherrschung
  rationale: Das Wortfeld bezeichnet hier sittliche Besonnenheit und sexuelle Enthaltsamkeit. »Selbstbeherrschung« gibt den Zusammenhang natürlich wieder, ohne die Bedeutung unnötig auf körperliche Keuschheit zu verengen.
- source_word: ἐν κρυφῇ
  choice: insgeheim
  rationale: Gibt den Gegensatz zu φανερῶς (»öffentlich«) knapp und idiomatisch wieder.
- source_word: πέπεισται
  choice: ist … überzeugt
  rationale: Das Perfekt bezeichnet eine bestehende feste Überzeugung des Mannes.
- source_word: περὶ ἡμῶν
  choice: von uns beiden
  rationale: Im Kontext meint »uns« die Frau und Josef als vermeintliches Paar; »von uns beiden erzählen« bewahrt zugleich die bewusst anzügliche Unbestimmtheit ihrer Aussage.
- source_word: οὐ πιστεύσει
  choice: wird er es nicht glauben
  rationale: Entspricht dem Futur und lässt den Inhalt dessen, was nicht geglaubt wird, ebenso kontextabhängig wie im Griechischen.
theological_decisions:
- issue: Bedeutungsumfang von σωφροσύνη
  choice: Selbstbeherrschung
  alternative: Keuschheit / sexuelle Reinheit
  rationale: Der sexuelle Kontext ist deutlich, doch das griechische Wort kann umfassender sittliche Besonnenheit und Beherrschung bezeichnen. Die Übersetzung bewahrt diesen weiteren Bedeutungsraum.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Gegensatz zwischen öffentlichem Lob und heimlicher Verführung wird klar herausgestellt; die zweideutige Formulierung »von uns beiden« bleibt erhalten.
