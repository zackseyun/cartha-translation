base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/005.yaml
  text: In all these things I, lying on the ground, kept begging God that he would rescue me from her deceit.
translation:
  language: de
  text: Bei all dem lag ich auf dem Boden und flehte Gott immer wieder an, er möge mich aus ihrer Hinterlist retten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: χαμοκοιτῶν
  choice: lag ich auf dem Boden
  rationale: Das Partizip bezeichnet wörtlich das Liegen beziehungsweise Schlafen auf dem Boden. Die Formulierung gibt die körperliche Haltung natürlich wieder, ohne eine nicht ausdrücklich genannte asketische Praxis hinzuzufügen.
- source_word: ἐδεόμην
  choice: flehte … immer wieder an
  rationale: Der Imperfekt beschreibt ein fortgesetztes oder wiederholtes inständiges Bitten; „immer wieder“ macht diesen Aspekt im Deutschen hörbar.
- source_word: ῥύσεταί με
  choice: er möge mich … retten
  rationale: Die Konstruktion mit ὅπως gibt den Inhalt beziehungsweise das Ziel der Bitte an. Der deutsche Konjunktiv wahrt den Charakter einer Bitte.
- source_word: τῆς δολιότητος αὐτῆς
  choice: aus ihrer Hinterlist
  rationale: δολιότης bezeichnet betrügerische Verschlagenheit oder Arglist. „Hinterlist“ ist natürlich, prägnant und bewahrt die negative moralische Wertung.
theological_decisions:
- issue: Gottes Rolle bei der Befreiung
  choice: Gott wird unmittelbar als derjenige angerufen, der retten soll.
  alternative: Die Bitte allgemeiner als Wunsch nach einem Entkommen wiederzugeben.
  rationale: Der griechische Text richtet die Bitte ausdrücklich an Gott und verwendet das starke Rettungsverb ῥύομαι; diese Aussage darf nicht abgeschwächt werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der fortdauernde Charakter des Gebets wird idiomatisch wiedergegeben; die knappe Erzählweise und die unmittelbare Gottesbeziehung bleiben erhalten.
