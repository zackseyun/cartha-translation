  text: '*Κἀκείνη ἀντεφιλονείκει πληρῶσαι θέλουσα τὴν ἐπιθυμίαν αὐτῆς⁴⁴.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004/009.yaml
  text: But she kept contending, wanting to fulfill her desire.
translation:
  language: de
  text: Doch sie stritt weiter[a] und wollte ihr Verlangen erfüllen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Verb kann fortgesetztes Streiten oder Widerstandleisten bezeichnen.
    reason: Die Anmerkung bewahrt die Bedeutungsweite von ἀντεφιλονείκει, ohne ein nicht ausdrücklich genanntes Gegenüber zu ergänzen.
lexical_decisions:
- source_word: ἀντεφιλονείκει
  choice: sie ließ nicht locker
  rationale: Das Imperfekt bezeichnet ihr fortgesetztes hartnäckiges Drängen beziehungsweise Streiten. Die idiomatische Wendung gibt diese Beharrlichkeit in natürlichem modernem Deutsch wieder.
- source_word: πληρῶσαι
  choice: stillen
  rationale: In Verbindung mit ἐπιθυμία bezeichnet das Verb die beabsichtigte Erfüllung oder Befriedigung des Verlangens; „stillen“ ist im Deutschen idiomatisch und wahrt die Zielrichtung.
- source_word: τὴν ἐπιθυμίαν αὐτῆς
  choice: ihr Verlangen
  rationale: „Verlangen“ bewahrt den starken, kontextuell begehrlichen Sinn, ohne über den griechischen Wortlaut hinaus eine ausdrückliche sexuelle Bezeichnung einzuführen.
theological_decisions: []
translation_notes:
  register: Modernes, verständliches und zugleich würdevolles Standarddeutsch. Das fortgesetzte Drängen des griechischen Imperfekts wird idiomatisch mit „ließ nicht locker“ ausgedrückt; die Absichtskonstruktion bleibt klar erhalten.
