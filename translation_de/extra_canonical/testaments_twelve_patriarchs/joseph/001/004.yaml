base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/004.yaml
  text: My brothers hated me, but the Lord loved me. They wanted to kill me, but the God of my fathers preserved me. They lowered me into a pit, and the Most High brought me up.
translation:
  language: de
  text: Meine Brüder hassten mich, doch der Herr liebte mich. Sie wollten mich töten, doch der Gott meiner Väter bewahrte mich. Sie ließen mich in eine Grube hinab, und der Höchste führte mich herauf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμίσησάν με
  choice: hassten mich
  rationale: Direkte und natürliche Wiedergabe des Aorists von μισέω.
- source_word: ἠγάπησέ με
  choice: liebte mich
  rationale: Entspricht schlicht und unmittelbar dem Gegensatz zum Hass der Brüder.
- source_word: ἀνελεῖν
  choice: töten
  rationale: Im Kontext bezeichnet ἀναιρέω die beabsichtigte Tötung; „töten“ ist im modernen Deutsch klar und würdig.
- source_word: ἐφύλαξέν με
  choice: bewahrte mich
  rationale: „Bewahren“ gibt den Schutz- und Erhaltungsaspekt von φυλάσσω wieder und entspricht dem gehobenen, aber verständlichen Register.
- source_word: ἐχάλασάν
  choice: ließen ... hinab
  rationale: χαλάω bezeichnet hier das Hinablassen in die Grube; die Formulierung bleibt nahe am griechischen Bild, ohne ein nicht ausdrücklich genanntes Hilfsmittel vorauszusetzen.
- source_word: ἀνήγαγέν με
  choice: führte mich herauf
  rationale: Gibt die gerichtete Bewegung von ἀνάγω wieder und wahrt die Parallelität zum Hinablassen.
- source_word: ὁ ὕψιστος
  choice: der Höchste
  rationale: Traditionelle und weiterhin klare substantivische Wiedergabe des Gottesprädikats.
theological_decisions:
- issue: Wechsel der Gottesbezeichnungen
  choice: „der Herr“, „der Gott meiner Väter“ und „der Höchste“ jeweils beibehalten
  alternative: Die Bezeichnungen unter einem einheitlichen Gottesnamen zusammenfassen
  rationale: Der griechische Text verwendet bewusst drei verschiedene Bezeichnungen; ihre Beibehaltung bewahrt die rhetorische und theologische Vielfalt.
- issue: Art des göttlichen Handelns in ἐφύλαξέν με
  choice: „bewahrte mich“
  alternative: „brachte mich in Sicherheit“
  rationale: Die gewählte Formulierung lässt offen, auf welche konkrete Weise Gott Joseph schützte und erhält damit die Aussagebreite des Verbs.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer antithetischer Satzstruktur. „Doch“ bildet die wiederholten Gegensätze prägnant ab; die abschließende Verbindung mit „und“ folgt dem griechischen Text.
