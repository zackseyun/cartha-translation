  text: '*Ἀδελφοί μου καὶ τέκνα μου⁵, Ἀκούσατε Ἰωσὴφ⁶ τοῦ ἠγαπημένου ὑπὸ⁷ Ἰσραήλ⁸, Ἐνωτίσασθε *ῥήματα τοῦ στόματός μου.⁹'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/002.yaml
  text: My brothers and children, listen to Joseph, the beloved of Israel. Pay attention, my children, to your father.
translation:
  language: de
  text: Meine Brüder und meine Kinder, hört Joseph zu, den von Israel Geliebten. Nehmt die Worte meines Mundes zu Ohren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀδελφοί μου καὶ τέκνα μου
  choice: Meine Brüder und meine Kinder
  rationale: Gibt die doppelte Anrede unmittelbar und in natürlichem modernem Deutsch wieder.
- source_word: Ἀκούσατε
  choice: hört auf
  rationale: Der Imperativ fordert zum Zuhören und Beachten auf; „hört auf Joseph“ ist hier idiomatisch und wahrt den Personenbezug.
- source_word: τοῦ ἠγαπημένου ὑπὸ Ἰσραήλ
  choice: den Israel geliebt hat
  rationale: Gibt den Agens der passiven Konstruktion eindeutig wieder, ohne „Israel“ fälschlich als Bezeichnung für das Volk statt als Josephs Vater festzulegen.
- source_word: Ἐνωτίσασθε
  choice: Hört aufmerksam auf
  rationale: Das Verb bezeichnet ein bewusstes, aufmerksames Hinhören und wird daher stärker als ein bloßes „hört“ formuliert.
- source_word: ῥήματα τοῦ στόματός μου
  choice: die Worte aus meinem Mund
  rationale: Bewahrt das konkrete semitisch geprägte Bild der griechischen Formulierung.
theological_decisions:
- issue: Bezug von „Israel“
  choice: Israel bleibt als Eigenname ohne erklärenden Zusatz stehen.
  alternative: „seinen Vater Israel“ oder „vom Volk Israel geliebt“
  rationale: Der griechische Wortlaut nennt lediglich Israel als den Liebenden. Eine nähere Identifikation wäre zwar aus dem Erzählzusammenhang plausibel, würde aber über den Wortlaut hinausgehen.
translation_notes:
  register: Moderne, würdige und gut verständliche Anrede. Die im englischen Konsultationstext stehende zweite Anrede „meine Kinder“ sowie „euer Vater“ wurde nicht übernommen, da der angegebene griechische Text stattdessen ausdrücklich „die Worte aus meinem Mund“ bietet.
