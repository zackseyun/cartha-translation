  verdict: revise
  source_fidelity: 'Der Entwurf gibt die griechische Anrede, den Imperativ an Joseph, das Partizip „der von Israel Geliebte“ und die abschließende Aufforderung grundsätzlich zutreffend wieder. Gegenüber dem englischen POB-Audit ist er an dieser Stelle quellennäher: Der griechische Text enthält weder die erneute Anrede „meine Kinder“ noch „zu eurem Vater“.'
  naturalness: „Hört auf Joseph“ ist im heutigen Standarddeutsch weniger idiomatisch und kann auch im Sinn von „gehorcht Joseph“ verstanden werden. „Hört Joseph zu“ bezeichnet das geforderte Zuhören eindeutig. Für ἐνωτίσασθε ist die feste, würdige und verständliche Wendung „Nehmt die Worte meines Mundes zu Ohren“ passend.
  terminology: „Israel“ bleibt zu Recht ohne identifizierenden Zusatz als Eigenname stehen. „der von Israel Geliebte“ bewahrt die knappe partizipiale Charakterisierung und vermeidet eine unnötige Umschreibung.
