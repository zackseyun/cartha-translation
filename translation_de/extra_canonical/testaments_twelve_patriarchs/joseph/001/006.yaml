  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/006.yaml
  text: I was alone, and God comforted me. I was weak, and the Lord visited me. I was in prison, and the Savior showed me favor. [I was in chains, and he loosed me.]
translation:
  language: de
  text: Ich war allein, und Gott tröstete mich. Ich war schwach, und der Herr nahm sich meiner an. Ich war im Gefängnis, und der Retter schenkte mir Gnade. [Ich war in Fesseln, und er befreite mich.][a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der eingeklammerte Satz ist textkritisch unsicher und möglicherweise ein späterer Zusatz.
    reason: Die Edition kennzeichnet den gesamten Satz durch eckige Klammern; diese Unsicherheit soll im deutschen Text sichtbar bleiben.
lexical_decisions:
- source_word: παρεκάλεσέ
  choice: tröstete
  rationale: Im Zusammenhang von Einsamkeit bezeichnet παρακαλέω am natürlichsten tröstenden Beistand.
- source_word: ἐν ἀσθενείᾳ
  choice: ich war schwach
  rationale: Gibt den Zustand allgemein und verständlich wieder, ohne ihn unnötig auf Krankheit oder moralische Schwäche einzuengen.
- source_word: ἐπεσκέψατό
  choice: nahm sich meiner an
  rationale: 'ἐπισκέπτομαι meint hier mehr als einen bloßen Besuch: fürsorgliche Zuwendung und Hilfe.'
- source_word: ἐν φυλακῇ
  choice: im Gefängnis
  rationale: Im Kontext Josephs ist die konkrete Bedeutung ‚Gefängnis‘ gegenüber dem allgemeineren ‚Gewahrsam‘ vorzuziehen.
- source_word: σωτήρ
  choice: Retter
  rationale: Bewahrt den ausdrücklichen griechischen Titel, ohne seine Referenz über den unmittelbaren Text hinaus festzulegen.
- source_word: ἐχαρίτωσέ
  choice: schenkte mir Gnade
  rationale: Bewahrt die Wortverbindung zu χάρις und gibt die gnädige Zuwendung wieder; ‚begnadete‘ wäre im Gefängniskontext missverständlich juristisch.
- source_word: ἔλυσέ
  choice: befreite mich davon
  rationale: Das Verb bedeutet wörtlich ‚löste‘; mit Bezug auf Fesseln ist die idiomatische deutsche Wiedergabe ‚befreite mich davon‘.
theological_decisions:
- issue: Bezeichnung Gottes als σωτήρ
  choice: der Retter
  alternative: mein Retter
  rationale: Der griechische Text hat den bestimmten Artikel, aber kein Possessivpronomen. Daher wird kein ‚mein‘ ergänzt.
- issue: Subjekt im letzten Satzglied
  choice: er
  alternative: Gott / der Herr / der Retter
  rationale: Das griechische Verb enthält nur ein unausgesprochenes männliches Subjekt. Die Übersetzung erhält diese Unbestimmtheit, statt eine der zuvor genannten Gottesbezeichnungen festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kurzem, parallelem Satzbau. Die dreifache Abfolge ‚Ich war …, und …‘ bleibt als prägendes rhetorisches Muster erhalten. Die textkritischen Klammern werden bewahrt und durch eine Fußnote erläutert.
