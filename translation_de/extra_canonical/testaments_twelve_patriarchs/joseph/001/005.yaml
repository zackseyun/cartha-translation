id: T12P.JOS.1.5
reference: Testament of Joseph 1:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἐπράθην *εἰς δουλείαν¹⁹, *Καὶ ὁ πάντων δεσπότης²⁰ ἠλευθέρωσέν με· Εἰς αἰχμαλωσίαν ἐλήφθην²¹, Καὶ ἡ κραταιὰ αὐτοῦ χεὶρ ἐβοήθησέ μοι· Ἐν λιμῷ συνεσχέθην, Καὶ αὐτὸς ὁ Κύριος διέθρεψέ με²².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/005.yaml
  text: I was sold into slavery, and the Master of all set me free. I was taken into captivity, and his mighty hand helped me. I was confined by famine, and the Lord himself nourished me.
translation:
  language: de
  text: Ich wurde in die Sklaverei verkauft, doch der Herr über alles befreite mich. Ich wurde gefangen genommen, doch seine mächtige Hand half mir. Vom Hunger wurde ich bedrängt, doch der Herr selbst ernährte mich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπράθην εἰς δουλείαν
  choice: Ich wurde in die Sklaverei verkauft
  rationale: Gibt die Verkaufshandlung und den Zielzustand der δουλεία präzise und idiomatisch wieder.
- source_word: ὁ πάντων δεσπότης
  choice: der Herr über alles
  rationale: Bewahrt den umfassenden Herrschaftsanspruch von πάντων und gibt δεσπότης würdig wieder, ohne im Deutschen das missverständliche „Gebieter aller“ zu erzwingen.
- source_word: εἰς αἰχμαλωσίαν ἐλήφθην
  choice: Ich wurde gefangen genommen
  rationale: Natürliche deutsche Wiedergabe der passiven Wendung; der Gedanke von Gefangenschaft bleibt erhalten.
- source_word: ἡ κραταιὰ αὐτοῦ χείρ
  choice: seine mächtige Hand
  rationale: Bewahrt das biblisch geprägte Bild und die Stärke von κραταιά.
- source_word: ἐν λιμῷ συνεσχέθην
  choice: Vom Hunger wurde ich bedrängt
  rationale: συνέχω bezeichnet hier ein Bedrängen oder Festhalten; „bedrängt“ bewahrt die Bildlichkeit und klingt im Deutschen natürlicher als „eingeschlossen“ oder „festgehalten“.
- source_word: διέθρεψέ με
  choice: ernährte mich
  rationale: Gibt die fortdauernde Versorgung beziehungsweise Ernährung sachlich und würdig wieder.
theological_decisions:
- issue: Bezeichnung Gottes mit δεσπότης und Κύριος
  choice: „Herr über alles“ und „der Herr selbst“
  alternative: „Gebieter über alles“ und „der Herr selbst“
  rationale: 'Die unterschiedlichen griechischen Titel werden nicht vollständig eingeebnet: Der erste erhält durch „über alles“ seinen umfassenden Herrschaftsakzent, während Κύριος konventionell als „Herr“ erscheint. „Gebieter“ wäre formaler, wirkt im heutigen Deutsch jedoch härter und weniger natürlich.'
- issue: Kontrast zwischen menschlicher Not und göttlichem Eingreifen
  choice: Die drei Parallelglieder jeweils mit „doch“ verbunden
  alternative: Verbindung mit „und“ entsprechend καί
  rationale: 'Das adversative Verhältnis ist im Kontext deutlich: Verkauf versus Befreiung, Gefangenschaft versus Hilfe, Hunger versus Ernährung. „Doch“ macht diese im Griechischen pragmatisch vorhandene Spannung im Deutschen natürlich sichtbar, ohne zusätzliche Lehre einzutragen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer dreigliedriger Parallelstruktur. Die wiederholte Ich-Perspektive und die körperlich-konkreten Bilder der göttlichen Rettung bleiben erhalten.
