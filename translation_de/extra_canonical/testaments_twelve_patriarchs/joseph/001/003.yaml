  text: Ἐγὼ εἶδον ἐν τῇ ζωῇ μου τὸν φθόνον καὶ τὸν θάνατον Καὶ¹⁰ οὐκ ἐπλανήθην ⸀ἀλλʼ ἔμενα¹¹ ἐν τῇ ἀληθείᾳ Κυρίου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/003.yaml
  text: In my life I saw envy and death, and I was not led astray, but remained in the truth of the Lord.
translation:
  language: de
  text: In meinem Leben sah ich Neid und Tod, und ich wurde nicht in die Irre geführt, sondern blieb in der Wahrheit des Herrn.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐγὼ εἶδον ἐν τῇ ζωῇ μου
  choice: In meinem Leben begegneten mir
  rationale: Das wörtliche „ich sah in meinem Leben“ bezeichnet hier erfahrene beziehungsweise erlebte Bedrohungen. „Begegneten mir“ gibt dies in natürlichem modernem Deutsch wieder, ohne den Sinn weiter festzulegen.
- source_word: τὸν φθόνον
  choice: Neid
  rationale: φθόνος bedeutet Neid oder Missgunst; „Neid“ ist die direkte und allgemein verständliche Entsprechung.
- source_word: τὸν θάνατον
  choice: Tod
  rationale: Die konkrete und zugleich personifizierbar wirkende Formulierung des Griechischen bleibt erhalten.
- source_word: οὐκ ἐπλανήθην
  choice: ich ließ mich nicht irreführen
  rationale: Die passive Form kann ein Irregeführtwerden ausdrücken. Die gewählte Wendung ist idiomatisch und bewahrt gegenüber „ich irrte nicht“ die Einwirkung von außen.
- source_word: ἔμενα
  choice: blieb
  rationale: Gibt das fortdauernde Festhalten beziehungsweise Verharren knapp und formal nah wieder.
- source_word: ἐν τῇ ἀληθείᾳ Κυρίου
  choice: in der Wahrheit des Herrn
  rationale: 'Die Genitivverbindung bleibt bewusst offen: Gemeint sein kann die Wahrheit, die vom Herrn stammt, ihm gehört oder ihn betrifft.'
theological_decisions:
- issue: Bedeutung von „Wahrheit des Herrn“
  choice: Die Genitivkonstruktion wird unverändert als „Wahrheit des Herrn“ wiedergegeben.
  alternative: „in der Treue zum Herrn“ oder „in der vom Herrn offenbarten Wahrheit“
  rationale: Der griechische Ausdruck ἀληθείᾳ Κυρίου legt diese Deutungen nicht eindeutig fest; eine explizitere Fassung würde die theologische Mehrdeutigkeit unnötig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Kontrast wird mit „doch“ klar markiert. Die Formulierung bleibt knapp und bewahrt die theologische Offenheit des griechischen Genitivs.
