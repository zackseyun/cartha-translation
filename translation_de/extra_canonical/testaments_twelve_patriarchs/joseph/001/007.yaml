  source_fidelity: Die ersten beiden Sätze geben διαβολαῖς, καὶ συνηγόρησέ μοι sowie den instrumentalen Dativ ἐν λόγοις ἐνυπνίων πικροῖς καὶ ἐρρύσατό με insgesamt treffend wieder. „Durch die bitteren Worte der Träume“ bewahrt die auffällige und nicht weiter aufzulösende Genitivverbindung. Im Schlusssatz bezeichnet Δοῦλος elliptisch Josephs eigenen Stand; die vorgeschlagene deutsche Akkusativkonstruktion verschiebt jedoch die Zuordnung.
  naturalness: „Als Sklaven erhöhte er mich“ ist zwar formal möglich, klingt aber im heutigen Deutsch unidiomatisch und lässt eher eine Erhöhung zu einem Sklaven als Josephs Stand als Sklave erkennen. Eine vollständige Satzform macht den elliptischen griechischen Bezug verständlich, ohne zusätzlichen Sachgehalt einzutragen.
  terminology: „Verleumdungen“, „für mich eintreten“, „rettete“ und „erhöhte“ sind für Register und Sinn angemessen. „Sklave“ ist für δοῦλος im erzählten sozialen Kontext korrekt.
