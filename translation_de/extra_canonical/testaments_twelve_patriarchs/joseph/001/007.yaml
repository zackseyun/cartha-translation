  text: Amid slanders he also spoke in my defense. By the bitter words of dreams he rescued me. A servant, he exalted me.
translation:
  language: de
  text: Inmitten von Verleumdungen trat er auch für mich ein. Durch die bitteren Worte der Träume rettete er mich. Ich war ein Sklave, und er erhöhte mich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διαβολαῖς
  choice: Verleumdungen
  rationale: Der Plural bezeichnet hier verleumderische Anschuldigungen; „Verleumdungen“ gibt dies im Deutschen klar und natürlich wieder.
- source_word: συνηγόρησέ μοι
  choice: trat er für mich ein
  rationale: Das Verb hat den Sinn, als Fürsprecher aufzutreten oder jemandem beizustehen; die Wendung bewahrt den forensischen Beiklang, ohne unnötig technisch zu wirken.
- source_word: λόγοις ἐνυπνίων πικροῖς
  choice: durch die bitteren Worte der Träume
  rationale: Der Dativ wird instrumental verstanden. Die enge Zuordnung von „bitter“ bleibt wie im Griechischen leicht offen, während „Worte der Träume“ die ungewöhnliche Bildsprache bewahrt.
- source_word: ἐρρύσατό με
  choice: rettete er mich
  rationale: „Retten“ gibt das Befreien aus Gefahr idiomatisch und inhaltlich angemessen wieder.
- source_word: Δοῦλος
  choice: Als Sklaven
  rationale: δοῦλος bezeichnet in diesem Zusammenhang Josephs tatsächlichen Stand als Sklave, nicht lediglich einen allgemeinen Diener.
- source_word: ὕψωσέ με
  choice: erhöhte er mich
  rationale: „Erhöhen“ bewahrt sowohl den sozialen Aufstieg Josephs als auch den möglichen theologischen Nachklang des griechischen Verbs.
theological_decisions:
- issue: Unausgesprochenes Subjekt der göttlichen Hilfe
  choice: Das Pronomen „er“ bleibt ohne ergänzende Benennung.
  alternative: „Gott“ ausdrücklich einsetzen.
  rationale: Das griechische Fragment nennt das Subjekt nicht ausdrücklich. Eine Ergänzung würde zwar den Kontext erklären, aber mehr festlegen als der vorliegende Wortlaut.
- issue: Beziehung zwischen Sklavenstand und Erhöhung
  choice: „Als Sklaven erhöhte er mich.“
  alternative: „Ich war ein Sklave, und er erhöhte mich.“
  rationale: Die knappe, elliptische Gestalt des griechischen Satzes wird bewahrt; zugleich macht der Akkusativ im Deutschen deutlich, dass Joseph in seinem Sklavenstand erhöht wurde.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst knapper Satzfolge. Die auffällige Formulierung „Worte der Träume“ wird nicht geglättet, da sie die Bildsprache und mögliche Mehrdeutigkeit des griechischen Textes trägt.
