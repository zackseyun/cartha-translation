source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Διαθήκη Ἰωσὴφ τοῦ ἑνδεκάτου υἱοῦ Ἰακὼβ καὶ Ῥαχήλ¹. Ἀντίγραφον διαθήκης Ἰωσήφ². Ἐν τῷ μέλλειν αὐτὸν ἀποθνήσκειν³, καλέσας⁴ τοὺς υἱοὺς αὐτοῦ καὶ τοὺς ἀδελφοὺς αὐτοῦ⁷ εἶπεν αὐτοῖς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001/001.yaml
  text: 'The testament of Joseph, the eleventh son of Jacob and Rachel. A copy of the testament of Joseph. When he was about to die, he called his sons and his brothers and said to them:'
translation:
  language: de
  text: 'Das Testament Josefs, des elften Sohnes Jakobs und Rahels. Abschrift des Testaments Josefs. Als er im Begriff war zu sterben, rief er seine Söhne und seine Brüder zu sich und sagte zu ihnen:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Διαθήκη
  choice: Testament
  rationale: Im Titel bezeichnet das Wort die letztwillige Vermächtnisrede; „Testament“ entspricht zudem der etablierten Gattungsbezeichnung.
- source_word: τοῦ ἑνδεκάτου υἱοῦ
  choice: des elften Sohnes
  rationale: Gibt die Ordnungszahl und die Genitivfügung formal und natürlich wieder.
- source_word: Ἀντίγραφον
  choice: Abschrift
  rationale: Bezeichnet eine kopierte Wiedergabe bzw. Kopie eines Schriftstücks; „Abschrift“ ist im Deutschen präzise und idiomatisch.
- source_word: Ἐν τῷ μέλλειν αὐτὸν ἀποθνήσκειν
  choice: Als er im Begriff war zu sterben
  rationale: Bildet die bevorstehende Handlung der griechischen Konstruktion ab, ohne sie als bloße zeitliche Nähe abzuschwächen.
- source_word: καλέσας
  choice: rief … zu sich
  rationale: Das deutsche trennbare Verb gibt in diesem Zusammenhang das Herbeirufen der Angehörigen natürlich wieder.
- source_word: εἶπεν αὐτοῖς
  choice: sagte zu ihnen
  rationale: Schlichte, genaue Wiedergabe der Redeeinleitung.
theological_decisions: []
