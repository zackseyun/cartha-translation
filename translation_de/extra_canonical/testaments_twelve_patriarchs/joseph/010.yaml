    **3.** Wo aber der Höchste wohnt, da gilt: Selbst wenn jemanden Neid, Sklaverei oder Verleumdung[a] treffen, wird der Herr, der wegen seiner Selbstbeherrschung in ihm wohnt, ihn nicht nur aus dem Unglück retten, sondern ihn auch erhöhen und verherrlichen, wie er es bei mir getan hat.


    **4.** Denn bei jedem Menschen kommt es zusammen – im Handeln, im Reden oder im Denken.[b]


    **5.** Meine Brüder wissen, wie sehr mein Vater mich liebte. Dennoch überhob ich mich nicht in meinen Gedanken. Obwohl ich noch ein Kind war, trug ich die Gottesfurcht in meinem Herzen; denn ich wusste, dass alles vergehen würde.


    **6.** Ich überhob mich auch nicht zum Bösen, sondern achtete meine Brüder. Aus Furcht vor ihnen schwieg ich, als ich verkauft wurde, und sagte den Ismaelitern nicht, dass ich ein Sohn Jakobs war, eines großen und gerechten Mannes.[c]'
