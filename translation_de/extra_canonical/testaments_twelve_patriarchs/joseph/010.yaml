base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010.yaml
  text: '1[a]. See, then, my children, how much endurance accomplishes, and prayer with fasting.


    2. So you also, if you pursue self-control and purity with endurance, and prayer with fasting, in humility of heart, the Lord will dwell in you, because he loves self-control.


    3[b]. And where the Most High dwells, even if envy should befall someone, or slavery, or slander, the Lord dwelling in him, because of his self-control, not only rescues him from evils, but also exalts and glorifies him, as he did me.


    4. For every person, whether in deed or in word or in thought, comes together.


    5. My brothers knew how my father loved me, yet I was not exalted in my mind; but though I was a child, I had the fear of God in my heart, for I knew that all things will surely pass away.


    6. And I was not puffed up in evil; rather, I honored my brothers, and because of fear of them I kept silent, when I was being sold, so as not to tell the Ishmaelites that I was a son of Jacob[c], a great and mighty man.'
translation:
  language: de
  text: '**Testament Josefs 10**


    **1.** Seht also, meine Kinder, wie viel Standhaftigkeit und Gebet mit Fasten bewirken.


    **2.** So sollt auch ihr nach Selbstbeherrschung und Reinheit streben, mit Standhaftigkeit und Gebet samt Fasten, in Demut des Herzens. Dann wird der Herr in euch wohnen, denn er liebt die Selbstbeherrschung.


    **3.** Wo aber der Höchste wohnt, da gilt: Selbst wenn jemanden Neid, Sklaverei oder Verleumdung[a] treffen, wird der Herr, der wegen seiner Selbstbeherrschung bei ihm wohnt, ihn nicht nur aus den Übeln retten, sondern ihn auch erhöhen und verherrlichen, wie er es bei mir getan hat.


    **4.** Denn jeder Mensch tritt hervor – im Handeln, im Reden oder im Denken.[b]


    **5.** Meine Brüder wissen, wie sehr mein Vater mich liebte. Dennoch war ich in meinen Gedanken nicht hochmütig. Obwohl ich noch ein Kind war, trug ich die Gottesfurcht in meinem Herzen; denn ich wusste, dass alles vergehen würde.


    **6.** Auch wurde ich nicht in böser Weise hochmütig, sondern achtete meine Brüder. Aus Furcht vor ihnen schwieg ich, als ich verkauft wurde, und sagte den Ismaelitern nicht, dass ich ein Sohn Jakobs war, eines großen und gerechten Mannes.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „falsche Beschuldigung“. Das griechische Wort kann eine böswillige oder erfundene Anklage bezeichnen, wie sie Josef in Ägypten traf.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Text ist hier schwer verständlich und möglicherweise verderbt. Wörtlich steht ungefähr: „Denn jeder Mensch kommt zusammen, sei es im Werk, im Wort oder im Denken.“ Die Übersetzung „tritt hervor“ gibt einen möglichen Sinn wieder; der genaue Bezug des griechischen Verbs bleibt unklar.'
    reason: textual_variant
  - marker: c
    text: Die Textüberlieferung dieses Verses ist stellenweise unsicher. Der erkennbare Sinn ist, dass Josef während seines Verkaufs aus Furcht vor seinen Brüdern seine familiäre Herkunft verschwieg.
    reason: textual_variant
lexical_decisions:
- source_word: ὑπομονή
  choice: Standhaftigkeit
  rationale: Das Wort bezeichnet beharrliches Ausharren unter Belastungen. „Standhaftigkeit“ ist im Deutschen natürlich, würdevoll und stärker als bloße Geduld.
- source_word: προσευχή μετὰ νηστείας
  choice: Gebet mit Fasten / Gebet samt Fasten
  rationale: μετά bezeichnet hier die Begleitung des Gebets durch Fasten; die Formulierung bewahrt die Verbindung beider Übungen.
- source_word: σωφροσύνη
  choice: Selbstbeherrschung
  rationale: Der Ausdruck umfasst besonnene Selbstkontrolle und hat im Kontext besonders eine sexuellethische Bedeutung, ohne darauf beschränkt zu sein.
- source_word: ἁγνεία
  choice: Reinheit
  rationale: „Reinheit“ wahrt sowohl die sittliche als auch die im Kontext hervortretende sexuelle Bedeutung.
- source_word: ταπείνωσις καρδίας
  choice: Demut des Herzens
  rationale: Die Wendung erhält den innerlichen, ethischen Akzent und den würdevollen testamentarischen Ton.
- source_word: κατοικέω
  choice: wohnen
  rationale: Die direkte Wiedergabe bewahrt die starke Aussage von Gottes Gegenwart, ohne sie dogmatisch näher festzulegen.
- source_word: ὁ ὕψιστος
  choice: der Höchste
  rationale: Dies ist die geläufige deutsche Wiedergabe des jüdischen Gottestitels.
- source_word: δουλεία
  choice: Sklaverei
  rationale: In Josefs Geschichte ist tatsächliche Versklavung gemeint; der Ausdruck wird daher nicht zu „Knechtschaft“ abgeschwächt.
- source_word: συκοφαντία
  choice: Verleumdung
  rationale: Das Wort bezeichnet verleumderische oder falsche Anschuldigungen; „Verleumdung“ ist knapp und verständlich, die Alternative steht in der Fußnote.
- source_word: ῥύεται
  choice: retten
  rationale: Das Verb bezeichnet konkrete Befreiung aus Gefahr oder Not; „retten“ ist klar und idiomatisch.
- source_word: ὑψοῖ καὶ δοξάζει
  choice: erhöhen und verherrlichen
  rationale: Die beiden Verben bleiben als rhetorisch und theologisch gewichtige Wortfolge voneinander unterschieden.
- source_word: δίκαιος
  choice: gerecht
  rationale: Anders als die englische Konsultationsfassung („mighty“) bezeichnet der vorgelegte griechische Text Jakob ausdrücklich als gerecht.
theological_decisions:
- issue: Göttliches Wohnen im Menschen
  choice: „Der Herr wird in euch wohnen“ und „der Herr … in ihm wohnt“
  alternative: Die Aussage lediglich als Bild für göttliche Gunst wiederzugeben
  rationale: Der griechische Text formuliert Gottes Gegenwart stark und unmittelbar. Die Übersetzung bewahrt diese Aussage, ohne sie nach Maßgabe einer späteren Lehrtradition zu präzisieren.
- issue: Bedeutungsumfang von σωφροσύνη
  choice: Selbstbeherrschung
  alternative: Keuschheit
  rationale: Der Zusammenhang betont sexuelle Reinheit, doch σωφροσύνη bezeichnet umfassender die besonnene Herrschaft über sich selbst. Die Verbindung mit „Reinheit“ hält beide Aspekte offen.
- issue: Zusammenhang zwischen Tugend, Rettung und Erhöhung
  choice: Die begründende Verbindung „wegen seiner Selbstbeherrschung“ bleibt ausdrücklich stehen
  alternative: Die Rettung ausschließlich als voraussetzungslose Aussage ohne Bezug auf Josefs Lebensführung zu formulieren
  rationale: Der Text selbst verknüpft Selbstbeherrschung, Gottes Gegenwart, Rettung und Erhöhung. Diese Spannung wird weder abgeschwächt noch systematisch aufgelöst.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, allgemein verständlichem Ton. Wiederkehrende Leitbegriffe werden möglichst einheitlich wiedergegeben. In Vers 4 bleibt die echte Unsicherheit des griechischen Textes sichtbar, wird aber durch eine Fußnote erläutert. Archaische Formen und konfessionell festgelegte Deutungen wurden vermieden.
