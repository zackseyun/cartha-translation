reference: Testament of Joseph 5:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἐγὼ οὖν, ὡς ἤκουσα τοῦτο, διέρρηξα *τὰ ἱμάτιά⁷ μου, καὶ εἶπον ⌜αὐτῇ⌝⁸· Γύναι, αἰδέσθητι τὸν Θεόν⁹, καὶ¹⁰ μὴ ποιήσῃς τὴν *πρᾶξιν ταύτην τὴν πονηράν¹¹, ἵνα μὴ¹² ἐξολοθρευθῇς· *ἐπεὶ καίγε γίνωσκε ὅτι ἐγὼ¹³ ἐξαγγελῶ¹⁴ *πᾶσιν τὴν ἐπίνοιάν σου ταύτην¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/005/002.yaml
  text: 'So when I heard this, I tore my garments and said to her, “Woman, have reverence for God, and do not do this evil deed, lest you be destroyed. For know this also: I will tell everyone of this scheme of yours.”'
translation:
  language: de
  text: 'Als ich das hörte, zerriss ich meine Gewänder und sagte zu ihr: »Frau, habe Ehrfurcht vor Gott und begehe diese böse Tat nicht, damit du nicht vernichtet wirst. Denn wisse auch dies: Ich werde allen von diesem deinem Plan erzählen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διέρρηξα τὰ ἱμάτιά μου
  choice: ich zerriss meine Gewänder
  rationale: Gibt die traditionelle Trauer- und Erschütterungsgeste wörtlich und im Deutschen verständlich wieder.
- source_word: αἰδέσθητι τὸν Θεόν
  choice: habe Ehrfurcht vor Gott
  rationale: αἰδέομαι kann Scheu, Achtung oder ehrfürchtige Zurückhaltung ausdrücken. »Habe Ehrfurcht« bewahrt diesen Sinn besser als eine Verengung auf bloße Angst oder Scham.
- source_word: τὴν πρᾶξιν ταύτην τὴν πονηράν
  choice: diese böse Tat
  rationale: Gibt πρᾶξις und πονηράν direkt wieder; ein zusätzlicher Begriff wie »gesetzlos« steht im vorliegenden griechischen Text nicht.
- source_word: ἐξολοθρευθῇς
  choice: vernichtet wirst
  rationale: Bewahrt die starke, passive Warnung des griechischen Verbs, ohne den Handelnden festzulegen.
- source_word: ἐξαγγελῶ πᾶσιν
  choice: ich werde allen … erzählen
  rationale: Drückt das öffentliche Bekanntmachen natürlich aus; πᾶσιν wird ausdrücklich mit »allen« wiedergegeben.
- source_word: τὴν ἐπίνοιάν σου ταύτην
  choice: diesem deinem Plan
  rationale: ἐπίνοια bezeichnet hier einen ersonnenen Plan oder ein Vorhaben. Die demonstrative und possessive Bestimmung wird in »diesem deinem« bewahrt.
theological_decisions:
- issue: Bedeutung von αἰδέσθητι τὸν Θεόν
  choice: habe Ehrfurcht vor Gott
  alternative: fürchte Gott / schäme dich vor Gott
  rationale: Die Formulierung wahrt das Spektrum von ehrfürchtiger Scheu und sittlicher Zurückhaltung, ohne den Ausdruck ausschließlich als Angst oder Scham auszulegen.
- issue: Urheber der angedrohten Vernichtung
  choice: Passivform ohne genannten Handelnden
  alternative: damit Gott dich nicht vernichtet
  rationale: Der griechische Text nennt den Handelnden nicht. Die Übersetzung vermeidet daher, Gott ausdrücklich als Urheber einzusetzen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die direkte Rede bleibt eindringlich; »diesem deinem Plan« ist bewusst leicht feierlich, um die doppelte griechische Bestimmung ταύτην … σου sichtbar zu halten.
