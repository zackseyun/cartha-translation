  source_fidelity: 'Die Übersetzung gibt den griechischen Satzbau und die zentralen Aussagen zuverlässig wieder: das Zerreißen der Gewänder, die Anrede an die Frau, die Mahnung zu ehrfürchtiger Scheu gegenüber Gott, die Warnung vor der bösen Tat, das unbestimmte Passiv der Vernichtung sowie die Ankündigung öffentlicher Mitteilung ihres Plans. Insbesondere ergänzt sie weder »gesetzlos« noch einen ausdrücklich handelnden Vernichter, die im vorliegenden griechischen Text nicht genannt sind.'
  naturalness: Modernes, verständliches Standarddeutsch mit einem dem Mahnwort angemessen würdigen Register. »Diesem deinem Plan« ist leicht gehoben, aber grammatisch korrekt und passend, da es die demonstrative und possessive Nachdrücklichkeit von ταύτην … σου sichtbar erhält.
  terminology: »Gewänder«, »Ehrfurcht vor Gott«, »böse Tat«, »vernichtet wirst« und »Plan« sind kontextuell treffend. »Habe Ehrfurcht vor Gott« bewahrt die semantische Offenheit von αἰδέσθητι besser als eine Festlegung auf bloße Angst oder Scham. Es bestehen keine problematischen theologischen Zusätze.
