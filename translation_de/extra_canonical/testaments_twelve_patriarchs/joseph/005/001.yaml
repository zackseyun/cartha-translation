base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/005/001.yaml
  text: And again, at another time, she said to me, “If you do not want to commit adultery, I will kill my husband with poison and take you as a husband.”
translation:
  language: de
  text: 'Und ein anderes Mal sagte sie zu mir: »Wenn du keinen Ehebruch begehen willst, werde ich meinen Mann mit Gift töten und dich zum Mann nehmen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει μοι
  choice: sagte sie zu mir
  rationale: Das griechische historische Präsens wird im natürlichen deutschen Erzählstil als Präteritum wiedergegeben.
- source_word: μοιχεῦσαι
  choice: Ehebruch begehen
  rationale: Die Wendung gibt die konkrete sexuelle Untreue des griechischen Verbs klar und würdig wieder.
- source_word: ἀνελῶ
  choice: werde … töten
  rationale: Im Zusammenhang mit φαρμάκῳ bezeichnet das Verb eindeutig die beabsichtigte Tötung.
- source_word: φαρμάκῳ
  choice: mit Gift
  rationale: Der instrumentale Dativ benennt Gift als Mittel der geplanten Tötung.
- source_word: λήψομαί σε εἰς ἄνδρα
  choice: dich zum Mann nehmen
  rationale: Diese idiomatische deutsche Formulierung bewahrt die Bedeutung »als Ehemann nehmen«, ohne ein im Griechischen nicht ausgedrücktes Possessivpronomen hinzuzufügen.
theological_decisions: []
translation_notes:
  register: Moderner, klarer und würdiger Erzählstil. Die direkte Rede bleibt knapp und bildet die Härte der Drohung ohne Abschwächung ab.
