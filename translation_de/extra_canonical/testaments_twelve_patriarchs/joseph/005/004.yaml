  text: And she went away, enticing me with gifts and every kind of pleasure.
translation:
  language: de
  text: Und sie ging fort, während sie mich mit Geschenken und Genüssen aller Art umgarnte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀνεχώρησεν
  choice: ging fort
  rationale: Gibt die Grundbedeutung „weggehen, sich entfernen“ natürlich wieder, ohne das stärkere „fliehen“ oder einen bestimmten Rückzugsgrund einzutragen.
- source_word: ἐπιθάλπουσά
  choice: umgarnte
  rationale: Das Verb kann fürsorgliches oder schmeichelndes Umsorgen bezeichnen; im Verführungskontext drückt „umgarnte“ die werbende, lockende Absicht aus, ohne sie übermäßig explizit zu machen.
- source_word: δώροις
  choice: mit Geschenken
  rationale: Direkte und idiomatische Entsprechung des griechischen Dativs des Mittels.
- source_word: ἀπολαύσεσι πάσαις
  choice: mit Genüssen aller Art
  rationale: Bewahrt den umfassenden Sinn von πᾶσαι und gibt ἀπόλαυσις als Genuss beziehungsweise angenehme Befriedigung wieder.
