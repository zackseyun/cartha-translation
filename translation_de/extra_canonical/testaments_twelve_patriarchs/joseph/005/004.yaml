  source_fidelity: 'Die Grundbedeutungen sind weitgehend getroffen: ἀνεχώρησεν bezeichnet ein Weggehen bzw. Sich-zurückziehen, δώροις „mit Geschenken“ und ἀπολαύσεσι πάσαις „mit Genüssen aller Art“. ἐπιθάλπουσα hat hier eine schmeichelnd-werbende Nuance, die „umgarnen“ im Kontext angemessen vermittelt. Die präsentische Partizipialkonstruktion sollte jedoch als begleitende Handlung wiedergegeben werden, nicht als gleichrangig koordinierter zweiter Vorgang.'
  naturalness: „Und sie ging fort und umgarnte mich“ ist verständlich, glättet aber die griechische Partizipialbeziehung und kann eine zeitliche Abfolge nahelegen. „Während sie mich ... umgarnte“ ist modernes, idiomatisches Standarddeutsch und bildet die Gleichzeitigkeit klar ab.
  terminology: „Geschenke“ und „Genüsse aller Art“ sind sachgerecht. „Umgarnte“ ist in diesem Verführungskontext natürlich, ohne den Sinn in eine spezifische sexuelle oder theologische Deutung einzuengen.
