  text: Φοβηθεῖσα¹⁶ οὖν ἐκείνη ἠξίου με¹⁷ ἵνα μὴ¹⁸ ἐξαγγελῶ¹⁹ τὴν *ἐπίνοιαν ταύτην²⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/005/003.yaml
  text: Then she, being afraid, begged me not to report this scheme.
translation:
  language: de
  text: Da bekam sie Angst und flehte mich an, diesen Plan nicht bekannt zu machen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φοβηθεῖσα
  choice: Da bekam sie Angst
  rationale: Das aoristische Partizip bezeichnet ihre vorausgehende beziehungsweise begleitende Reaktion; die finite Form klingt im modernen Deutsch natürlich.
- source_word: ἠξίου με
  choice: flehte mich an
  rationale: Im Kontext gibt ἀξιόω mit folgendem Inhaltssatz ein dringendes Bitten wieder; „flehte“ bewahrt die durch ihre Angst bedingte Eindringlichkeit.
- source_word: ἐξαγγελῶ
  choice: bekannt zu machen
  rationale: Das Verb bedeutet hier, etwas nach außen zu melden oder öffentlich mitzuteilen. Die Formulierung lässt offen, wem Joseph es hätte sagen können.
- source_word: ἐπίνοιαν ταύτην
  choice: diesen Plan
  rationale: ἐπίνοια bezeichnet hier einen ausgedachten Vorsatz oder Anschlag. „Plan“ ist verständlich und wahrt gegenüber „Intrige“ oder „böser Absicht“ die im Ausdruck selbst verbleibende Wertungsoffenheit.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit natürlicher Satzfolge. Der kausale beziehungsweise zeitliche Zusammenhang von οὖν und dem Partizip wird knapp durch „Da“ wiedergegeben; es sind keine Fußnoten erforderlich.
