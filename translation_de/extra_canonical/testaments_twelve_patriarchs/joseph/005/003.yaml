  terminology: „Plan“ gibt ἐπίνοια angemessen wieder und vermeidet eine nicht ausdrücklich lexikalisch erzwungene Verschärfung zu „Intrige“ oder „Anschlag“. Es sind keine theologischen Fachbegriffe oder Eigennamen betroffen.
