  source_fidelity: 'Die Übersetzung gibt die Abfolge und den Sinn des griechischen Satzes zuverlässig wieder: Das Partizip Φοβηθεῖσα ist natürlich als „bekam sie Angst“ umgesetzt; ἠξίου με wird mit „flehte mich an“ dem im Kontext dringlichen Bitten entsprechend wiedergegeben. Der Infinitiv „nicht bekannt zu machen“ trifft ἐξαγγελῶ als Weitergabe nach außen, ohne einen bestimmten Empfängerkreis einzutragen. „Diesen Plan“ ist für ἐπίνοιαν ταύτην eine angemessen wertungsoffene und verständliche Wiedergabe.'
