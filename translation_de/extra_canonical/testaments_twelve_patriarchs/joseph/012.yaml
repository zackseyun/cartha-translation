review_pass:
  verdict: revise
  source_fidelity: Eine sichere Revision ist erforderlich. In 11,4 legt der Entwurf die stark beschädigte bzw. komprimierte griechische Formulierung zu sehr als Übernahme Josephs gegen Gold aus; das Griechische bewahrt vielmehr die Elemente Verrat/Auslieferung, Gold und Joseph, ohne den genauen Handelsvorgang eindeutig zu machen. Außerdem ist der Name Πεντεφρί als „Pentephri“, nicht „Pentephris“, wiederzugeben. Die Aussage zu ἔργῳ sollte im Haupttext weniger eng auf materiellen „Ertrag“ festgelegt werden.
  naturalness: Der Erzählton ist überwiegend natürlich und angemessen. „Lass die Sache mit ihm gerichtlich untersuchen“ gibt die schwierige Wendung in 12,3 idiomatischer wieder als „gehe seinetwegen gerichtlich vor“, ohne die Referenz des Pronomens aufzulösen. Die Kapitelangabe wird nach deutschem Standard als „12,1.“ gesetzt.
  terminology: „Sklave“, „Händler“, „der Herr“/„Gott“, „Eunuchen“ und „himmlische Gunst“ sind sachgerecht. „Pentephri“ folgt dem griechischen Namen. Für ἔργῳ wird „Arbeit“ als bewusst weiter, quellennäherer Ausdruck gewählt; die Fußnote dokumentiert die möglichen engeren Deutungen.
  issues:
  - severity: high
    issue: '11,4: Der Haupttext und Fußnote a bestimmen den unklaren Vorgang als Übernahme Josephs gegen Gold.'
    rationale: τίς προδοὺς χρυσίον λάβῃ με ist in der überlieferten Form syntaktisch schwierig. προδιδόναι bezeichnet primär ausliefern, preisgeben oder verraten; ein bestimmter Käufer bzw. eine Übernahme Josephs ist nicht ausdrücklich formuliert. Die Übersetzung muss die Unklarheit offenhalten.
  - severity: medium
    issue: '12,1: „Pentephris“ weicht von Πεντεφρί ab.'
    rationale: Die griechische Namensform ist Pentephri; ein zusätzliches -s ist nicht belegt.
  - severity: medium
    issue: '11,7: „Ertrag“ legt ἔργῳ zu eng fest.'
    rationale: Das Wort kann Arbeit, Tätigkeit, Geschäft bzw. produktive Unternehmung meinen. Die vorhandene Fußnote erkennt dies an; der Haupttext sollte nicht eine einzelne Deutung bevorzugen.
  - severity: low
    issue: '12,3: „Geh nun seinetwegen gerichtlich vor“ ist im Deutschen weniger präzise und natürlicher als nötig.'
    rationale: Die griechische Konstruktion mit μετ᾽ αὐτοῦ lässt die Referenz offen. Eine Formulierung mit „mit ihm“ bewahrt diese Offenheit und klingt idiomatisch.
