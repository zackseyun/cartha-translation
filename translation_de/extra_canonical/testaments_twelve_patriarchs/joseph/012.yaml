revisions:
- from: '3. Da sagte der Anführer von ihnen zu mir: »Du bist kein Sklave; das sieht man schon an deinem Äußeren.« Ich aber versicherte ihnen, dass ich ihr Sklave sei. 4. Als wir nach Ägypten gekommen waren, stritten sie sich meinetwegen darüber, wer mich gegen Gold an sich nehmen sollte.[a] 5. Schließlich beschlossen sie alle, mich in Ägypten bei dem Händler zu lassen, mit dem sie Geschäfte machten, bis sie mit Handelswaren zurückkämen. 6. Der Herr aber schenkte mir Gunst in den Augen des Händlers, und dieser vertraute mir sein Haus an. 7. Gott segnete ihn durch meine Hand und ließ seinen Besitz an Gold, Silber und Ertrag wachsen.[b] 8. Drei Monate blieb ich bei ihm.


    12 1. Zu jener Zeit kam die Frau Pentephris[c] in einem Wagen[d] mit großem Prunk nach Memphis hinab, denn ihre Eunuchen hatten ihr von mir erzählt. 2. Sie sagte zu ihrem Mann: »Der Händler ist durch die Hand eines jungen Hebräers reich geworden. Man sagt aber, dieser sei aus dem Land Kanaan gestohlen worden. 3. Geh nun seinetwegen gerichtlich vor[e] und nimm den jungen Mann in unser Haus. Dann wird der Gott der Hebräer dich segnen, denn himmlische Gunst ruht auf ihm.«'
  to: '3. Da sagte ihr Anführer zu mir: »Du bist kein Sklave; das sieht man schon an deinem Äußeren.« Ich aber versicherte ihnen, dass ich ihr Sklave sei. 4. Als wir nach Ägypten gekommen waren, stritten sie sich meinetwegen darüber, wer mich verraten und dafür Gold bekommen sollte.[a] 5. Schließlich kamen sie alle überein, mich in Ägypten bei dem Händler ihres Handelsgeschäfts zu lassen, bis sie mit Handelswaren zurückkehren würden. 6. Der Herr aber schenkte mir Gunst in den Augen des Händlers, und dieser vertraute mir sein Haus an. 7. Gott segnete ihn durch meine Hand und mehrte ihn an Gold, Silber und Arbeit.[b] 8. Drei Monate blieb ich bei ihm.


    12,1. Zu jener Zeit kam die Frau Pentephri[c] in einem Wagen[d] mit großem Prunk nach Memphis hinab, denn sie hatte von ihren Eunuchen von mir gehört. 2. Sie sagte zu ihrem Mann: »Der Händler ist durch die Hand eines gewissen jungen Hebräers reich geworden. Man sagt aber, man habe ihn durch Diebstahl aus dem Land Kanaan entführt. 3. Lass nun die Sache mit ihm gerichtlich untersuchen[e] und nimm den jungen Mann in unser Haus. Der Gott der Hebräer wird dich segnen, denn himmlische Gunst ruht auf ihm.«'
  rationale: Die Revision korrigiert die Namensform, bewahrt in 11,4 die textkritisch bedingte Mehrdeutigkeit des überlieferten Griechisch und vermeidet bei ἔργῳ eine zu enge sachliche Festlegung. Die Fußnoten bleiben exakt an ihren betreffenden Aussagen verankert und erläutern die jeweiligen Unsicherheiten, ohne den Text aus Genesis zu ergänzen.
