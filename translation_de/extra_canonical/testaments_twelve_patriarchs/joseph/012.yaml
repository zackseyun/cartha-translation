  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/012.yaml
  text: '3[a]. And the chief of them said to me, “You are not a servant, for your appearance also makes it plain.” But I told them plainly that I was their servant. 4. And when we had come into Egypt, they disputed concerning me, as to who would deceive the merchant and receive money for me. 5. So it seemed good to all of them to leave me in Egypt with the merchant of their trade until they should return bringing merchandise[b]. 6. But the Lord gave me favor in the eyes of the merchant, and he entrusted his house to me. 7. And God blessed him in my hands, and increased him on my account in gold and silver and work. 8. And I was with him three months.


    1. Now at that time the wife of Pentephri came down to Memphis with great display, because she had heard about me from her eunuchs. 2. And she said to her husband, “The merchant has grown rich by the hands of a certain young Hebrew; and they say that he was stolen away by theft from the land of Canaan. 3. Now therefore execute judgment concerning him, and take the young man into our house, and the God of the Hebrews will bless you[c], because grace from heaven is upon him.”'
translation:
  language: de
  text: '3. Da sagte ihr Anführer zu mir: »Du bist kein Sklave; das sieht man schon an deinem Äußeren.« Ich aber versicherte ihnen, dass ich ihr Sklave sei. 4. Als wir nach Ägypten gekommen waren, stritten sie sich meinetwegen darüber, wer mich verraten und dafür Gold bekommen sollte.[a] 5. Schließlich kamen sie alle überein, mich in Ägypten bei dem Händler ihres Handelsgeschäfts zu lassen, bis sie mit Handelswaren zurückkehren würden. 6. Der Herr aber schenkte mir Gunst in den Augen des Händlers, und dieser vertraute mir sein Haus an. 7. Gott segnete ihn durch meine Hand und mehrte ihn an Gold, Silber und Arbeit.[b] 8. Drei Monate blieb ich bei ihm.


    12,1. Zu jener Zeit kam die Frau Pentephri[c] in einem Wagen[d] mit großem Prunk nach Memphis hinab, denn sie hatte von ihren Eunuchen von mir gehört. 2. Sie sagte zu ihrem Mann: »Der Händler ist durch die Hand eines gewissen jungen Hebräers reich geworden. Man sagt aber, man habe ihn durch Diebstahl aus dem Land Kanaan entführt. 3. Lass nun die Sache mit ihm gerichtlich untersuchen[e] und nimm den jungen Mann in unser Haus. Der Gott der Hebräer wird dich segnen, denn himmlische Gunst ruht auf ihm.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Text ist hier syntaktisch schwierig und möglicherweise beschädigt. Wörtlich stehen Begriffe für „verraten/ausliefern“, „Gold“ und „mich“ nebeneinander; der genaue Gegenstand des Streits und der Ablauf des Geschäfts bleiben unklar.
    reason: textual_variant
  - marker: b
    text: Das letzte griechische Wort kann hier auch „Ertrag“, „Geschäft“ oder „Unternehmen“ bedeuten.
    reason: lexical_alternative
  - marker: c
    text: Pentephri ist die griechische Form eines ägyptischen Namens, der in den Überlieferungen zu Genesis mit Potifar beziehungsweise dessen Haus verbunden wird.
    reason: cross_reference
  - marker: d
    text: Das griechische Wort für den Wagen ist an dieser Stelle textkritisch unsicher; andere Wiedergaben lassen die Angabe aus.
    reason: textual_variant
  - marker: e
    text: 'Die griechische Wendung kann auch heißen: „Halte über ihn Gericht“ oder „Geh gegen ihn gerichtlich vor.“ Es ist nicht völlig eindeutig, ob sich „ihm“ auf den Händler oder auf Joseph bezieht.'
    reason: textual_ambiguity
lexical_decisions:
- source_word: δοῦλος
  choice: Sklave
  rationale: Josefs verkaufter und rechtlich abhängiger Status ist gemeint; „Diener“ würde die soziale Wirklichkeit abschwächen.
- source_word: ἡ ὄψις σου δηλοῖ
  choice: das sieht man schon an deinem Äußeren
  rationale: Die Formulierung gibt die aus Josefs Erscheinung gezogene Schlussfolgerung in natürlichem modernem Deutsch wieder.
- source_word: μετάβολος
  choice: Händler
  rationale: Im Erzählzusammenhang bezeichnet das Wort einen gewerblichen Händler beziehungsweise Zwischenhändler.
- source_word: ἐπίστευσέ μοι τὸν οἶκον αὐτοῦ
  choice: vertraute mir sein Haus an
  rationale: Bewahrt das biblisch geprägte Bild und bezeichnet zugleich die übertragene Verantwortung für den Haushalt.
- source_word: ἐν χειρί μου
  choice: durch meine Hand
  rationale: Bewahrt die Hand-Metapher des Griechischen und macht ihre Bedeutung als vermittelnde Wirksamkeit verständlich.
- source_word: ἔργῳ
  choice: Ertrag
  rationale: Im Zusammenhang mit Gold und Silber ist produktiver Ertrag plausibel; da die genaue Bedeutung unsicher bleibt, wird die Alternative in einer Fußnote offengelegt.
- source_word: μετὰ δόξης πολλῆς
  choice: mit großem Prunk
  rationale: δόξα bezeichnet hier sichtbare Pracht oder gesellschaftliche Repräsentation, nicht abstrakte Herrlichkeit.
- source_word: εὐνοῦχοι
  choice: Eunuchen
  rationale: Die konkrete griechische Bezeichnung bleibt erhalten, obwohl das Wort auch Hof- oder Kammerbeamte bezeichnen kann.
- source_word: κρίσιν
  choice: gerichtlich vorgehen
  rationale: Die Wendung bezeichnet ein förmliches rechtliches Einschreiten; die genaue Beziehung des Pronomens bleibt durch eine Fußnote offen.
- source_word: χάρις ἐκ τοῦ οὐρανοῦ ἐστι πρὸς αὐτόν
  choice: himmlische Gunst ruht auf ihm
  rationale: χάρις bezeichnet hier göttliche Gunst; die deutsche Wendung gibt deren auf Joseph gerichtete, bleibende Wirkung natürlich wieder.
theological_decisions:
- issue: Wechsel zwischen κύριος und θεός in 11,6–7
  choice: „der Herr“ in Vers 6 und „Gott“ in Vers 7
  alternative: Beide Bezeichnungen zu „Gott“ oder „der Herr, Gott“ vereinheitlichen
  rationale: Der griechische Text verwendet unmittelbar nacheinander unterschiedliche Gottesbezeichnungen; diese Variation wird nicht harmonisiert.
- issue: Die Segenszusage in 12,3
  choice: „Dann wird der Gott der Hebräer dich segnen“
  alternative: „Der Gott der Hebräer muss/wird dich gewiss segnen“
  rationale: Die Aussage bleibt eine erwartete Folge der Aufnahme Josephs, ohne daraus eine mechanische oder konfessionell bestimmte Segenslehre abzuleiten.
- issue: Abrupter Szenenwechsel nach 11,8
  choice: Neuer Kapitelabschnitt ohne ergänzte Überleitung
  alternative: Eine Verbindung nach Genesis 39 rekonstruieren
  rationale: Die erhaltene griechische Fassung wechselt unvermittelt die Szene; fehlende Einzelheiten werden nicht aus anderen Überlieferungen ergänzt.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem, erzählerischem Ton. Biblische Schlüsselbilder wie „durch meine Hand“ und der Wechsel der Gottesbezeichnungen bleiben sichtbar; schwer verständliche griechische Stellen werden im Haupttext behutsam lesbar gemacht und in Fußnoten transparent offengelegt.
