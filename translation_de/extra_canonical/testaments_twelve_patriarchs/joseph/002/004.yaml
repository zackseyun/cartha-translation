  rationale: Bewahrt die biblisch-theologische Ausdrucksweise und lässt deren Bedeutungsspanne von Ehrfurcht bis Furcht offen.
- source_word: θλίψεσιν
  choice: Bedrängnissen
  rationale: Bezeichnet belastende, bedrückende Umstände und wahrt die sachliche Nähe zum griechischen Ausdruck.
- source_word: ἀνάγκαις
  choice: Nöten
  rationale: Gibt Zwangslagen und schwere Notlagen in idiomatischem Deutsch wieder.
theological_decisions:
- issue: Reichweite der Verneinung in der Aufzählung
  choice: „weder … noch …“ als Fortführung von „verlässt … nicht“
  alternative: Die Aufzählung als eigenständigen elliptischen Satz oder als Orte und Umstände ohne ausdrücklich wiederholte Verneinung wiedergeben.
  rationale: Der griechische Text ist syntaktisch knapp und teilweise elliptisch; die deutsche Fassung macht den naheliegenden Bezug auf das Nicht-Verlassen deutlich, ohne eine zusätzliche Verheißung der Befreiung aus diesen Umständen einzutragen.
translation_notes:
