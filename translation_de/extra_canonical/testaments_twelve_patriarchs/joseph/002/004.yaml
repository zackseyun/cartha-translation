  source_fidelity: 'Die Übersetzung gibt den Hauptsatz und die elliptische Aufzählung sachgerecht wieder: ἐγκαταλείπει entspricht „verlässt“, τοὺς φοβουμένους αὐτόν bleibt mit „die ihn fürchten“ bewusst in seiner religiös-biblischen Bedeutung offen, und die Umstände σκότος, δεσμοί, θλίψεις und ἀνάγκαι werden angemessen als Finsternis, Fesseln, Bedrängnisse und Nöte wiedergegeben. Die Konstruktion mit „weder … noch“ legt den naheliegenden Skopus der Verneinung offen, ohne eine Befreiung aus den genannten Umständen zu behaupten.'
