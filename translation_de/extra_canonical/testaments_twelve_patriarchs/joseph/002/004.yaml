lexical_decisions:
- source_word: ἐγκαταλείπει
  choice: verlässt
  rationale: Gibt die Bedeutung von im Stich lassen bzw. verlassen natürlich und prägnant wieder.
- source_word: τοὺς φοβουμένους αὐτόν
