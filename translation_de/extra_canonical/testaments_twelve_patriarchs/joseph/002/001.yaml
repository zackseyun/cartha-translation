  text: '*Καὶ οὗτος [¹ὁ ἀρχιμάγειρος Φαραὼ]¹ ἐπίστευσέ μοι τὸν οἶκον αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/001.yaml
  text: And this man, the captain of Pharaoh's guard, entrusted his house to me.
translation:
  language: de
  text: Und dieser Mann, der Oberste der Leibwache des Pharaos,[1] vertraute mir sein Haus an.
  philosophy: optimal-equivalence
  footnotes:
  - marker: '1'
    text: Der Ausdruck „der Oberste der Leibwache des Pharaos“ steht in der griechischen Quellenausgabe in eckigen Klammern.
    reason: Bewahrt den in der Vorlage vorhandenen textkritischen Anker, ohne eine nicht vorgelegte nähere Apparaterklärung zu ergänzen.
lexical_decisions:
- source_word: ὁ ἀρχιμάγειρος Φαραώ
  choice: der Oberste der Leibwache des Pharaos
  rationale: ἀρχιμάγειρος bezeichnet im hier vorausgesetzten ägyptischen Hofkontext nicht bloß einen Oberkoch, sondern den Befehlshaber der königlichen Leibwache; die Formulierung entspricht der Rolle Potifars in der Josephüberlieferung.
- source_word: ἐπίστευσέ μοι
  choice: vertraute mir … an
  rationale: Die Konstruktion mit Dativ und Akkusativ bezeichnet das vertrauensvolle Übertragen von Verantwortung.
- source_word: τὸν οἶκον αὐτοῦ
  choice: sein Haus
  rationale: οἶκος kann sowohl das Haus als Gebäude als auch den gesamten Haushalt bezeichnen. „Haus“ bewahrt diese Bedeutungsweite im Deutschen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am Griechischen, klingt aber natürlich. Der eingeklammerte beziehungsweise textkritisch markierte griechische Ausdruck wird im Haupttext wiedergegeben, da er den Mann identifiziert und mit der überlieferten Josephgeschichte übereinstimmt.
