  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/006.yaml
  text: But in all these things he takes the lead, and in various ways he encourages. For a short time he withdraws, in order to test the inner intent of the soul.
translation:
  language: de
  text: Doch bei all diesen Dingen geht er voran und spricht auf verschiedene Weise Mut zu. Für kurze Zeit zieht er sich zurück, um die innere Absicht der Seele zu prüfen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προΐσταται
  choice: geht er voran
  rationale: Bewahrt den Grundgedanken des Vorangehens beziehungsweise der führenden Initiative, ohne die nicht ausdrücklich genannte Art der Leitung näher festzulegen.
- source_word: παρακαλεῖ
  choice: spricht … Mut zu
  rationale: Gibt hier die ermutigende Bedeutung des Verbs natürlich und verständlich wieder; das weitere Bedeutungsspektrum von Ermahnen, Bitten und Trösten wird durch den Kontext nicht eindeutig gefordert.
- source_word: ἐν βραχεῖ
  choice: Für kurze Zeit
  rationale: Versteht die Wendung zeitlich, passend zum anschließenden Sich-Zurückziehen.
- source_word: ἀφίσταται
  choice: zieht er sich zurück
  rationale: Drückt ein vorübergehendes Abstandnehmen in idiomatischem Deutsch aus.
- source_word: τῆς ψυχῆς τὸ διαβούλιον
  choice: die innere Absicht der Seele
  rationale: διαβούλιον bezeichnet den inneren Entschluss, Plan oder Beweggrund; „innere Absicht“ wahrt diesen Sinn, ohne ihn psychologisch zu verengen.
theological_decisions:
- issue: Bezug des nicht ausdrücklich genannten Subjekts
  choice: Das männliche Pronomen „er“ bleibt ohne ergänzende Identifizierung stehen.
  alternative: Das Subjekt durch eine aus dem weiteren Kontext erschlossene Gestalt ausdrücklich benennen.
  rationale: Der griechische Satz nennt das Subjekt nicht neu; eine Identifizierung innerhalb dieses Einzelverses würde mehr festlegen als der vorgelegte Wortlaut.
- issue: Zweck des vorübergehenden Rückzugs
  choice: „um die innere Absicht der Seele zu prüfen“
  alternative: „damit der Entschluss der Seele erprobt werde“
  rationale: Der aktive Infinitiv δοκιμάσαι legt „prüfen/erproben“ nahe; die Formulierung lässt offen, ob Erkenntnis, Bewährung oder beides im Vordergrund steht.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Satzfolge und die theologische Spannung des nur zeitweiligen Rückzugs bleiben erhalten; nicht ausdrücklich genannte Bezüge werden nicht ergänzt.
