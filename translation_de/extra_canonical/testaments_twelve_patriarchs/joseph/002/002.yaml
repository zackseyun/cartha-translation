source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Καὶ ἠγωνισάμην πρὸς γυναῖκα ἀναιδῆ ἐπείγουσάν² με παρανομεῖν μετʼ αὐτῆς, ἀλλʼ ὁ Θεὸς *τοῦ πατρός μου³ ἐρρύσατό⁴ με ἐκ⁵ φλογὸς καιομένης.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/002.yaml
  text: And I struggled against a shameless woman who kept pressing me to transgress with her, but the God of my father rescued me from a burning flame.
translation:
  language: de
  text: Und ich kämpfte gegen eine schamlose Frau, die mich dazu drängte, mit ihr das Gesetz zu übertreten; doch der Gott meines Vaters rettete mich aus einer brennenden Flamme.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἠγωνισάμην
  choice: kämpfte
  rationale: Gibt den aktiven, angestrengten Widerstand des Verbs natürlich und quellennah wieder.
- source_word: γυναῖκα ἀναιδῆ
  choice: eine schamlose Frau
  rationale: Bewahrt die deutliche moralische Wertung von ἀναιδής, ohne sie weiter auszudeuten.
- source_word: ἐπείγουσάν με
  choice: die mich dazu drängte
  rationale: Drückt den anhaltenden beziehungsweise nachdrücklichen Druck aus; der griechische Wortlaut legt nicht zwingend eine iterative Formulierung fest.
- source_word: παρανομεῖν μετʼ αὐτῆς
  choice: mit ihr das Gesetz zu übertreten
  rationale: παρανομεῖν bezeichnet ein gesetzeswidriges Handeln; die sachliche Umschreibung bewahrt die im Kontext mitschwingende, aber nicht ausdrücklich benannte sexuelle Verfehlung.
- source_word: ὁ Θεὸς τοῦ πατρός μου
  choice: der Gott meines Vaters
  rationale: Entspricht der griechischen Artikelfügung und ist im Deutschen idiomatisch.
- source_word: ἐρρύσατό με
  choice: rettete mich
  rationale: Gibt das Herausreißen beziehungsweise Erretten aus Gefahr in natürlichem Deutsch wieder.
- source_word: ἐκ φλογὸς καιομένης
  choice: aus einer lodernden Flamme
  rationale: Bewahrt das anschauliche Feuerbild; „lodernd“ vermeidet die im Deutschen schwerfällige Wendung „brennende Flamme“.
theological_decisions:
- issue: Art der Übertretung
  choice: mit ihr das Gesetz zu übertreten
  alternative: mit ihr zu sündigen / Ehebruch mit ihr zu begehen
  rationale: Der griechische Text nennt die konkrete Tat nicht ausdrücklich. Die Übersetzung erhält diese Zurückhaltung und vermeidet eine konfessionelle oder kontextuelle Präzisierung im Haupttext.
- issue: Deutung der Flamme
  choice: wörtlich-bildhafte Wiedergabe als „lodernde Flamme“
  alternative: aus der Glut der Versuchung / aus ihrer brennenden Leidenschaft
  rationale: Ob die Flamme für Versuchung, Begierde, Gefahr oder Gericht steht, bleibt offen; die Metapher wird deshalb nicht aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt eng am griechischen Gegensatz zwischen Josephs Widerstand und Gottes Rettung, klingt aber flüssig und verständlich.
