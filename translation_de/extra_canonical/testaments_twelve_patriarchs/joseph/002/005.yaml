revisions:
- from: Denn Gott schämt sich nicht wie ein Mensch; er wird auch nicht mutlos wie ein Menschensohn, und wie ein aus Erde Geborener [wird er weder schwach noch] gerät er in Schrecken.[a]
  to: Denn Gott schämt sich nicht wie ein Mensch; er ist auch nicht mutlos wie ein Menschensohn und nicht wie ein Erdgeborener [schwach oder] verängstigt.[a]
  rationale: Die Revision ersetzt die ungrammatische und quellentextlich unzutreffende Klammerkonstruktion durch eine prädikative Reihung. Sie bewahrt sowohl das griechische »oder« als auch die textkritische Markierung und hält die drei menschlichen Vergleichsbilder ohne zusätzliche Auslegung bei.
