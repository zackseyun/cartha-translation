source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Οὐ γὰρ ὡς ἄνθρωπος ἐπαισχύνεται ὁ Θεός, Οὔτε¹⁶ ὡς υἱὸς ἀνθρώπου δειλιᾷ, Οὔτε¹⁷ ὡς γηγενὴς [ἀσθενεῖ ἢ]¹⁸ πτοεῖται¹⁹,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/005.yaml
  text: For God is not ashamed like a man, nor does he grow fearful like a son of man, nor, like one born of earth, [does he become weak or] is he terrified.
translation:
  language: de
  text: Denn Gott schämt sich nicht wie ein Mensch; er ist auch nicht mutlos wie ein Menschensohn und nicht wie ein Erdgeborener [schwach oder] verängstigt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte »schwach oder« stehen im griechischen Text in eckigen Klammern und sind textkritisch unsicher.
    reason: Die deutsche Klammer bewahrt Umfang und Unsicherheit der griechisch eingeklammerten Wörter [ἀσθενεῖ ἢ].
lexical_decisions:
- source_word: ἐπαισχύνεται
  choice: schämt sich
  rationale: Gibt die gewöhnliche Bedeutung des Verbs unmittelbar und in natürlichem Deutsch wieder.
- source_word: δειλιᾷ
  choice: wird mutlos
  rationale: Bewahrt den Sinn von Furchtsamkeit oder Verzagen, ohne ihn mit dem stärkeren πτοεῖται gleichzusetzen.
- source_word: γηγενής
  choice: ein aus Erde Geborener
  rationale: Gibt die bildhafte Herkunftsbezeichnung wörtlich genug wieder und vermeidet die Einengung auf bloß »irdisch«.
- source_word: ἀσθενεῖ
  choice: wird schwach
  rationale: Entspricht der Grundbedeutung und bleibt wegen der textkritischen Unsicherheit in eckigen Klammern.
- source_word: πτοεῖται
  choice: gerät in Schrecken
  rationale: Unterscheidet das starke Erschrecken von δειλιᾷ und klingt im Deutschen würdig und natürlich.
theological_decisions:
- issue: Anthropomorphe Gegenüberstellung Gottes mit sterblichen Menschen
  choice: Die dreifache Verneinung und die menschlichen Vergleichsbilder bleiben erhalten.
  alternative: Die Aussage abstrakt als Gottes Unwandelbarkeit oder Allmacht wiederzugeben.
  rationale: Der griechische Text formuliert konkrete menschliche Reaktionen und lässt deren theologischen Zusammenhang unausgelegt.
- issue: Textkritisch unsichere Wörter [ἀσθενεῖ ἢ]
  choice: Die entsprechende deutsche Wendung wird in eckige Klammern gesetzt.
  alternative: Die Wörter ohne Kennzeichnung aufzunehmen oder ganz auszulassen.
  rationale: So wird die im Quellenapparat erkennbare Unsicherheit transparent bewahrt, ohne die bezeugte Lesart zu verschweigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele dreigliedrige Struktur des Griechischen bleibt erkennbar; »Menschensohn« wird hier als allgemeine Bezeichnung eines Menschen verstanden, ohne eine christologische Deutung in den Text einzutragen.
