base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002/003.yaml
  text: I was imprisoned, I was beaten, I was mocked, and the Lord gave me compassion in the sight of the jailer.
translation:
  language: de
  text: Ich wurde ins Gefängnis geworfen, ich wurde geschlagen, ich wurde verspottet, und der Herr ließ mich beim Gefängniswärter Erbarmen finden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐφυλακίσθην
  choice: Ich wurde ins Gefängnis geworfen
  rationale: Gibt das passive Verb natürlich und präzise wieder; gemeint ist die Inhaftierung.
- source_word: ἐτύφθην
  choice: geschlagen
  rationale: Direkte Wiedergabe des passiven Aorists von τύπτω.
- source_word: ἐξεμυκτηρίσθην
  choice: verspottet
  rationale: Trifft den Sinn von höhnischer Verachtung in verständlichem modernem Deutsch.
- source_word: ἔδωκέ με ... εἰς οἰκτιρμοὺς ἐνώπιον τοῦ δεσμοφύλακος
  choice: ließ mich vor dem Gefängniswärter Erbarmen finden
  rationale: Eine natürliche deutsche Wiedergabe der semitisch geprägten Konstruktion; οἰκτιρμοί wird dabei als Erbarmen bewahrt, ohne es zu bloßer Gunst abzuschwächen.
- source_word: Κύριος
  choice: der Herr
  rationale: Entspricht der üblichen und kontextgerechten Gottesbezeichnung.
- source_word: δεσμοφύλακος
  choice: Gefängniswärter
  rationale: Bezeichnet den für die Gefangenen zuständigen Aufseher und ist allgemein verständlich.
theological_decisions:
- issue: Art des göttlichen Handelns in ἔδωκέ με ... εἰς οἰκτιρμούς
  choice: Der Herr ließ Josef Erbarmen finden
  alternative: Der Herr gab Josef Erbarmen
  rationale: Die gewählte Formulierung macht verständlich, dass Gott die erbarmende Haltung des Gefängniswärters gegenüber Josef bewirkte, ohne eine weitergehende theologische Erklärung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drei Leidenserfahrungen sind knapp parallel angeordnet; der abschließende Satzteil bleibt eng am griechischen Sinn und klingt zugleich idiomatisch.
