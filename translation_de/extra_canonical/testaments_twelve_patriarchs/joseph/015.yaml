review_pass:
  verdict: revise
  source_fidelity: 'Mehrere Formulierungen geben den griechischen Text grundsätzlich treffend wieder, einschließlich der textkritisch auffälligen dritten Person in 14,5 und der schwierigen Wendung ἐκδίκησιν κινδύνου. Sichere Korrekturen sind jedoch nötig: μετάβολος ist innerhalb des Abschnitts konsistent als Händler zu verstehen, ὀφείλει verlangt in 14,6 eine Notwendigkeit, und ἀπολῦσαι ... ἔχει in 15,7 ist modal („kann ... freilassen“), nicht futurisch. In 15,3 muss die deutsche Zweckkonstruktion zudem grammatisch berichtigt werden.'
  naturalness: Das Register ist überwiegend modernes, würdiges Standarddeutsch. Die bisherige Formulierung „damit ich meine Brüder nicht der Schande preisgab“ ist in dieser Konstruktion jedoch grammatisch nicht stimmig. „Ich wollte sehr weinen“ bildet die Intensivierung bei ἤθελον ... πάνυ unmittelbarer ab als „bitterlich weinen“.
  terminology: „Sklave“ für δοῦλος, „Sack und Asche“, „Händler“ für μετάβολος und „bei Gott und den Menschen hohes Ansehen genoss“ sind sachgerecht. Die Übersetzung von μετάβολος muss in 14,6 und 15,6 einheitlich bleiben. Die Fußnoten bewahren die relevanten textlichen beziehungsweise semantischen Unsicherheiten, ohne sie dogmatisch aufzulösen.
  issues:
  - severity: medium
    issue: 14,6 übersetzt μεταβόλου als „Tausch“, während derselbe Ausdruck in 15,6 zutreffend als „Händler“ erscheint.
    rationale: Der bestimmte maskuline Ausdruck ὁ μετάβολος in 15,6 bezeichnet eindeutig die sprechende Person. Die Bezugnahme in 14,6 sollte daher ebenfalls den Händler nennen; „Tausch“ ist mit der im Kontext verwendeten Personenbezeichnung nicht konsistent.
  - severity: medium
    issue: 14,6 gibt ὀφείλει mit „sollte“ wieder.
    rationale: ὀφείλει bezeichnet gegenwärtige Verpflichtung beziehungsweise Notwendigkeit. „Muss eingeschlossen bleiben“ bildet dies genauer ab.
  - severity: medium
    issue: '15,3 enthält eine fehlerhafte beziehungsweise unnatürliche Zweckkonstruktion: „damit ich ... preisgab“.'
    rationale: Nach „damit“ ist hier eine finale Form erforderlich. „Um meine Brüder nicht zu beschämen“ ist grammatisch und semantisch präzise.
  - severity: medium
    issue: 15,7 macht die modale Wendung ἀπολῦσαι ἡμᾶς ἔχει zu einem Futur.
    rationale: Die Wendung besagt, dass Potifar die Möglichkeit oder Befugnis hat, sie freizulassen. „Dann kann er uns freilassen“ erhält diese Modalität.
