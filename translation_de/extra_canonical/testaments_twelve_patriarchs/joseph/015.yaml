  - marker: d
    text: 'Oder: »Befreit mich aus dem Urteil Potifars.« Der griechische Ausdruck kann sowohl das Gerichtsverfahren als auch den richterlichen Entscheid bezeichnen.'
    reason: κρίσις kann hier ein Gerichtsverfahren, eine Gerichtsbarkeit oder ein Urteil bezeichnen.
lexical_decisions:
- source_word: ἐν πόθῳ ἁμαρτίας
  choice: mit sündigem Verlangen
  rationale: Bewahrt den Zusammenhang von Verlangen und Sünde, ohne das Verhältnis durch eine ausführlichere Deutung festzulegen.
- source_word: ἠγνόουν
  choice: war ich arglos
  rationale: Im Zusammenhang bezeichnet das Verb eher Unkenntnis oder Unerfahrenheit in sexueller Verfehlung als bloßes Nichtwissen.
- source_word: τὰ ἀλλότρια
  choice: fremdes Eigentum
  rationale: Gibt das substantivierte Adjektiv als das wieder, was einem anderen gehört.
- source_word: μεταβόλου
  choice: Händler
  rationale: Bezeichnet hier den am Verkauf beziehungsweise Besitzerwechsel beteiligten Händler; dieselbe Rollenbezeichnung wird in 15,6 beibehalten.
- source_word: δοῦλος
  choice: Sklave
  rationale: Die rechtliche und soziale Unfreiheit ist deutlicher als beim modernen deutschen Wort „Diener“ oder „Knecht“.
- source_word: διελύθη τὰ σπλάγχνα μου
  choice: zerriss es mir das Innerste
  rationale: Überträgt die antike Körpermetapher kraftvoll und verständlich, ohne sie auf ein einzelnes modernes Gefühl zu reduzieren.
- source_word: αἰσχύνω
  choice: der Schande preisgab
  rationale: Bewahrt den sozialen Sinn von beschämen beziehungsweise in Schande bringen.
- source_word: παρὰ Θεῷ καὶ ἀνθρώποις
  choice: bei Gott und den Menschen hohes Ansehen genoss
  rationale: Natürliches Deutsch für Größe oder Geltung im Urteil Gottes und der Menschen.
- source_word: κρίσεως
  choice: Gerichtsverfahren
  rationale: Passt zum rechtlichen Kontext, während die mögliche Bedeutung „Urteil“ in einer Fußnote erhalten bleibt.
- source_word: ἐν ἀργυρίῳ
  choice: für Silber
  rationale: Formnahe Wiedergabe des Kaufpreises, ohne eine bestimmte Münzform einzutragen.
theological_decisions:
- issue: Josefs Schutz seiner Brüder trotz ihres Verrats
  choice: „damit ich meine Brüder nicht der Schande preisgab“
  alternative: „damit ich meine Brüder nicht beschämte“
  rationale: Die stärkere soziale Tragweite des griechischen Verbs bleibt sichtbar, ohne Josefs Motiv zusätzlich zu theologisieren.
- issue: Jakobs Größe vor Gott und Menschen
  choice: „bei Gott und den Menschen hohes Ansehen genoss“
  alternative: „groß bei Gott und Menschen war“
  rationale: Die idiomatische Übersetzung beschreibt seine anerkannte Stellung, ohne geistliche Macht oder besondere Heiligkeit hineinzulesen.
- issue: Ungewöhnliche Wendung zur Vergeltung
  choice: „schwere Vergeltung“ mit Fußnote
  alternative: „gefährliche Vergeltung“
  rationale: Der schwer verständliche Genitiv wird im Lesetext vorsichtig idiomatisiert und in der Fußnote als textliche Spannung offengelegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Bildhafte Körperrede bleibt erhalten, wird aber idiomatisch formuliert. Rechtliche und soziale Begriffe werden konkret wiedergegeben; textliche und semantische Unsicherheiten stehen in knappen Fußnoten.
