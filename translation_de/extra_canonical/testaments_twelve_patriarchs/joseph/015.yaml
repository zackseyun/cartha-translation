  text: '4. For she wanted to see me in the desire of sin, but I was ignorant in all these things.


    5. And I said to her, “This is not the custom among the Egyptians, to take what belongs to another before proof is given.”


    6. So I said this concerning the exchange. But the boy ought to be kept shut up.


    1. And after twenty-four days the Ishmaelites came, for they had heard that Jacob my father was mourning greatly for me. And when they came they said to me,


    2. “Why did you say that you were a servant? For look, we have learned that you are the son of a great man in the land of Canaan, and that your father is still mourning for you in sackcloth and ashes.”


    3. When I heard these things, my inward parts were torn apart, and my heart melted, and I wanted very much to weep. But I restrained myself, so that I might not put my brothers to shame. And I said to them, “I do not know; I am a servant.”


    4. Then they took counsel to sell me, so that I might not be found in their hands.


    5. For they feared my father, lest he come against them and execute dangerous vengeance on them; for they had heard that he was great before God and men.


    6. Then the trader said to them, “Release me from the judgment of Potiphar.”


    7. So they came near and asked me, saying, “Say that you were bought by us for silver, and he will release us.”'
translation:
  language: de
  text: '**14,4** Denn sie wollte mich in sündigem Verlangen sehen; doch in all diesen Dingen war ich arglos.



    **5** Und ich sagte zu ihr:[a] »Bei den Ägyptern ist es nicht üblich, fremdes Eigentum an sich zu nehmen, bevor ein Nachweis erbracht ist.«



    **6** Das sagte ich also über den Händler.[b] Der Junge aber muss eingeschlossen bleiben.



    **15,1** Nach vierundzwanzig Tagen kamen die Ismaeliten. Sie hatten nämlich gehört, dass mein Vater Jakob sehr um mich trauerte. Als sie zu mir kamen, sagten sie:



    **2** »Warum hast du gesagt, du seist ein Sklave? Sieh doch, wir haben erfahren, dass du der Sohn eines bedeutenden Mannes im Land Kanaan bist und dass dein Vater noch immer in Sack und Asche um dich trauert.«



    **3** Als ich das hörte, zerriss es mir das Innerste, und mein Herz schmolz dahin. Ich wollte sehr weinen, hielt mich aber zurück, um meine Brüder nicht zu beschämen. So sagte ich zu ihnen: »Ich weiß von nichts; ich bin ein Sklave.«



    **4** Daraufhin berieten sie, mich zu verkaufen, damit man mich nicht in ihrer Gewalt fände.



    **5** Denn sie fürchteten meinen Vater: Er könnte gegen sie ziehen und gefährliche Vergeltung an ihnen üben.[c] Sie hatten nämlich gehört, dass er bei Gott und den Menschen hohes Ansehen genoss.



    **6** Da sagte der Händler zu ihnen: »Befreit mich aus dem Gerichtsverfahren Potifars.«[d]



    **7** Sie traten an mich heran und baten mich: »Sag, dass wir dich für Silber gekauft haben; dann kann er uns freilassen.«



    [a] Wörtlich lautet der überlieferte griechische Text: »Und er sagte zu ihr«. Der Zusammenhang verlangt wahrscheinlich die erste Person.


    [b] Der griechische Ausdruck μετάβολος wird hier ebenso wie in 15,6 vermutlich für einen Händler gebraucht.


    [c] Der griechische Ausdruck ist ungewöhnlich und lautet wörtlich etwa »Vergeltung der Gefahr«.


    [d] Oder: »Befreit mich aus dem Urteil Potifars.« Der griechische Ausdruck kann sowohl das Gerichtsverfahren als auch den richterlichen Entscheid bezeichnen.'
  philosophy: optimal-equivalence
  footnotes:
