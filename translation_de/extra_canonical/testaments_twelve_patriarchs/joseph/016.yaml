  rationale: Die Überarbeitung beschränkt sich auf sichere, quellensprachlich begründete Korrekturen. Sie gibt in V. 5 Bewegung und Übernahme im Kaufvorgang genauer wieder und beseitigt in V. 6 die nicht im Griechischen ausgedrückte Konzessivbeziehung. Der auffällige Numeruswechsel in V. 4 wird nicht doktrinär oder textkritisch aufgelöst, sondern im Deutschen beibehalten.
