  text: 'But Memphis said to her husband[a], “I hear that they are selling the young man.”


    2 So she immediately sent a eunuch to the Ishmaelites, asking that I be sold to her.

    3 But the eunuch, not wishing to buy me, withdrew after testing them, and reported to his mistress that they were asking a high price for the boy.

    4 Then she sent another eunuch, saying, “Even if they ask two minas, pay it. Do not spare the gold. Only buy the boy and bring him to me.”

    5 So the eunuch came and gave them eighty pieces of gold and took me; but to the Egyptian woman he said, “I have given a hundred.”

    6 But I, knowing it, kept silent[b][c], so that'
translation:
  language: de
  text: '**Testament Josefs 16**


    1 Memphis aber sagte zu ihrem Mann: »Kauf den jungen Mann! Denn ich höre, dass sie ihn verkaufen.«


    2 Sogleich sandte sie einen Eunuchen zu den Ismaelitern und ließ darum bitten, mich an sie zu verkaufen.


    3 Der Eunuch jedoch wollte mich nicht kaufen. Nachdem er ihre Bedingungen erkundet hatte, kehrte er zurück und berichtete seiner Herrin, dass sie einen hohen Preis für den Jungen verlangten.


    4 Da sandte sie einen anderen Eunuchen und sagte: »Selbst wenn sie zwei Minen[a] verlangen, bezahlt sie. Spart nicht am Gold! Kauf nur den Jungen und bring ihn zu mir.«


    5 Da kam der Eunuch, gab ihnen achtzig Goldstücke[b] und nahm mich an sich. Der Ägypterin aber sagte er: »Ich habe hundert gegeben.«


    6 Ich aber wusste es und schwieg, damit der Eunuch nicht beschämt würde.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eine Mine war eine antike Gewichts- und Geldeinheit. Der griechische Begriff wird beibehalten, da eine Umrechnung in einen modernen Geldbetrag ungenau wäre.
    reason: cultural_note
  - marker: b
    text: Im Griechischen steht wörtlich »achtzig Goldene« und danach »hundert«. Eine bestimmte Münzsorte wird nicht genannt; deshalb steht hier allgemein »Goldstücke«.
    reason: lexical_alternative
lexical_decisions:
- source_word: Μεμφὶς
  choice: Memphis
  rationale: Der griechische Text behandelt Μεμφίς als Eigennamen der Frau. Die Transliteration bewahrt diese Deutung, ohne den Namen mit der Stadt gleichzusetzen.
- source_word: νεανίαν / παιδός / παῖδα
  choice: junger Mann / Junge
  rationale: 'Die wechselnde Ausdrucksweise des Griechischen wird nachvollzogen: νεανίας bezeichnet den jungen Mann, während παῖς hier seine Jugend und abhängige Stellung hervorhebt.'
- source_word: εὐνοῦχος
  choice: Eunuch
  rationale: Die konkrete Bezeichnung des griechischen Textes wird beibehalten und nicht zum allgemeineren »Hofbeamten« abgeschwächt.
- source_word: αἰτοῦσά με εἰς διάπρασιν
  choice: ließ darum bitten, mich an sie zu verkaufen
  rationale: Die Formulierung bezeichnet die Anbahnung eines Verkaufs. Die deutsche Wiedergabe macht den Empfänger des Verkaufs deutlich, ohne den Sklavenhandel sprachlich zu beschönigen.
- source_word: πειράσας αὐτούς
  choice: nachdem er ihre Bedingungen erkundet hatte
  rationale: πειράζω bezeichnet hier ein prüfendes Ausloten der Verkäufer und ihrer Forderungen, nicht eine moralische Versuchung.
- source_word: δεσποίνῃ
  choice: Herrin
  rationale: »Herrin« gibt die Autoritäts- und Haushaltsbeziehung im Kontext natürlich und präzise wieder.
- source_word: πολλὴν τιμήν
  choice: einen hohen Preis
  rationale: Im Kaufkontext bezeichnet τιμή den verlangten Preis; die Wendung ist im Deutschen idiomatisch.
- source_word: μνᾶς
  choice: Minen
  rationale: Die antike Gewichts- und Geldeinheit wird transliteriert, statt durch einen irreführenden modernen Geldwert ersetzt zu werden.
- source_word: μὴ φείσασθε χρυσίου
  choice: Spart nicht am Gold
  rationale: Die Wiedergabe bewahrt den Imperativ und den Nachdruck, dass der Preis kein Hindernis sein soll.
- source_word: χρυσοῦς
  choice: Goldstücke
  rationale: Das substantivierte Adjektiv bezeichnet goldene Geldstücke, ohne im vorliegenden Wortlaut eine genaue Münzsorte festzulegen.
- source_word: ἀνελάβετό με
  choice: nahm mich mit
  rationale: Im Zusammenhang des vollzogenen Kaufs bezeichnet die Wendung, dass der Eunuch Joseph übernahm und fortführte.
- source_word: ἐσιώπησα
  choice: schwieg ich
  rationale: Die knappe Formulierung gibt Josefs bewusstes Stillschweigen in würdigem, natürlichem Deutsch wieder.
theological_decisions:
- issue: Statussprache beim Verkauf Josefs
  choice: Die ausdrückliche Kauf-, Verkaufs- und Preissprache bleibt erhalten.
  alternative: Den Vorgang als Aufnahme in einen Haushalt oder als Anstellung abschwächen.
  rationale: Der griechische Text schildert eindeutig einen Menschenverkauf. Eine mildere Dienstsprache würde die soziale und moralische Spannung des Textes verdecken.
- issue: Josefs Schweigen gegenüber der Täuschung des Eunuchen
  choice: 'Der Zweck wird ohne moralische Rechtfertigung wiedergegeben: »damit der Eunuch nicht beschämt würde«.'
  alternative: Josefs Schweigen als Billigung, Barmherzigkeit oder Beteiligung an der Täuschung ausdeuten.
  rationale: Der Text nennt nur den beabsichtigten Schutz vor Beschämung. Er bewertet weder die Falschangabe des Eunuchen noch Josefs Schweigen ausdrücklich.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Direkte Rede bleibt lebendig, während die Sprache des Menschenverkaufs weder modernisiert noch beschönigt wird. Die in der englischen Konsultationsschicht fehlenden Worte aus Vers 1 und der vollständige Schluss von Vers 6 wurden gemäß dem vorgelegten griechischen Text übersetzt.
