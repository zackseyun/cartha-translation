base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/002.yaml
  text: And this man[a], Pharaoh’s chief cook, entrusted his house to me. And I struggled against a shameless woman who kept pressing me to transgress with her, but the God of my father rescued me from a burning flame. I was imprisoned, I was beaten, I was mocked; and the Lord gave me compassion in the sight of the jailer. For the Lord does not abandon those who fear him, not in darkness, or chains, or afflictions, or distress[b]. For God is not ashamed like a man, nor does he grow fearful like a son of man, nor, like one born of earth, does he become weak or terrified. But in all these things he takes the lead[c], and in various ways he gives comfort.
translation:
  language: de
  text: '**Testament Josefs 2**


    1 Und dieser Mann, der Oberkoch des Pharaos,[a] vertraute mir sein Haus an. 2 Ich rang mit einer schamlosen Frau, die mich fortwährend dazu drängte, mit ihr das Gesetz zu übertreten. Doch der Gott meines Vaters rettete mich aus einer brennenden Flamme.[b] 3 Ich wurde ins Gefängnis geworfen, geschlagen und verspottet; doch der Herr ließ mich vor dem Gefängniswärter Erbarmen finden. 4 Denn der Herr verlässt die nicht, die ihn fürchten – weder in der Finsternis noch in Fesseln, Bedrängnissen oder Nöten. 5 Denn Gott schämt sich nicht wie ein Mensch, er verliert nicht den Mut wie ein Menschensohn, und er wird nicht wie ein aus Erde Geborener schwach oder[c] von Schrecken ergriffen. 6 Doch in all dem steht er voran[d] und tröstet auf unterschiedliche Weise. Nur für kurze Zeit zieht er sich zurück, um den Entschluss der Seele zu prüfen. 7 In zehn Prüfungen erwies er mich als bewährt, und in ihnen allen war ich langmütig. Denn Langmut ist ein wirksames Heilmittel, und standhaftes Ausharren bringt
    viel Gutes hervor.


    [a] Das griechische Wort *archimágeiros* bezeichnet wörtlich einen Oberkoch. Es kann hier jedoch auch als Amtstitel eines hohen Hofbeamten verstanden werden; im Hintergrund steht die Erzählung von Josef und Potifar.


    [b] Die „brennende Flamme“ ist in diesem Zusammenhang wahrscheinlich ein Bild für die verzehrende Gefahr der sexuellen Versuchung. Der griechische Text erklärt das Bild jedoch nicht ausdrücklich.


    [c] Die Wörter „schwach oder“ sind in der griechischen Textüberlieferung unsicher.


    [d] Das griechische Verb kann „voranstehen“, „leiten“, „Aufsicht führen“ oder, in weiterem Sinn, „beistehen“ bedeuten. Die Übersetzung bewahrt den Grundgedanken des Voranstehens, ohne die weiteren möglichen Nuancen auszuschließen.'
  philosophy: optimal-equivalence
