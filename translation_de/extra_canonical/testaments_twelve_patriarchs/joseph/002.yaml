lexical_decisions:
- source_word: ἀρχιμάγειρος
  choice: Oberkoch
  rationale: Das Kompositum bezeichnet seinem Wortsinn nach einen leitenden Koch. Die Übersetzung wahrt diese Transparenz; eine amtliche Hofbedeutung wird in der Fußnote genannt.
- source_word: ἠγωνισάμην
  choice: ich rang
  rationale: Das Verb schildert einen aktiven Kampf und gibt Josefs entschlossenen moralischen Widerstand knapp und würdig wieder.
- source_word: γυναῖκα ἀναιδῆ
  choice: eine schamlose Frau
  rationale: ἀναιδής bezeichnet fehlende Scham oder Hemmung; „schamlos“ bewahrt die ausdrückliche moralische Wertung.
- source_word: ἐπείγουσάν με παρανομεῖν μετʼ αὐτῆς
  choice: die mich fortwährend dazu drängte, mit ihr das Gesetz zu übertreten
  rationale: Das Partizip bezeichnet anhaltenden Druck; παρανομεῖν wird in seinem rechtlich-moralischen Sinn wiedergegeben, ohne es vorschnell auf einen einzelnen Tatbestand einzuengen.
- source_word: ἐρρύσατό με ἐκ φλογὸς καιομένης
  choice: rettete mich aus einer brennenden Flamme
  rationale: Die konkrete Metapher des griechischen Textes bleibt erhalten und wird nicht im Haupttext als Begierde ausgedeutet.
- source_word: ἔδωκέ με εἰς οἰκτιρμοὺς ἐνώπιον τοῦ δεσμοφύλακος
  choice: ließ mich vor dem Gefängniswärter Erbarmen finden
  rationale: Die natürliche deutsche Wendung vermittelt, dass Gott Josef beim Gefängniswärter mitfühlende Behandlung verschaffte, und bleibt näher an οἰκτιρμοί als das allgemeinere „Gunst“.
- source_word: προΐσταται
  choice: steht er … fürsorglich bei
  rationale: Das Verb umfasst je nach Zusammenhang Vorangehen, Leitung, Aufsicht und fürsorgliches Eintreten. Die Formulierung ist natürlich und lässt diese Bedeutungsbreite durch eine Fußnote sichtbar bleiben.
- source_word: τῆς ψυχῆς τὸ διαβούλιον
  choice: den Entschluss der Seele
  rationale: διαβούλιον bezeichnet Überlegung, Absicht oder inneren Entschluss. „Entschluss der Seele“ bewahrt die innere und moralische Dimension.
- source_word: δόκιμον ἀπέδειξέ με
  choice: erwies er mich als bewährt
  rationale: Die Formulierung erhält sowohl den Vorgang des Prüfens als auch das bestätigte Ergebnis der Bewährung.
- source_word: μακροθυμία / ὑπομονή
  choice: Langmut / standhaftes Ausharren
  rationale: Zwei unterschiedliche deutsche Ausdrücke erhalten die Unterscheidung zwischen lang anhaltender Geduld und beharrlichem Durchhalten.
- source_word: μέγα φάρμακον
  choice: ein wirksames Heilmittel
  rationale: φάρμακον bedeutet Heilmittel oder Arznei. „Wirksam“ gibt die wertende Kraft von μέγα idiomatisch wieder, ohne das Bild aufzugeben.
theological_decisions:
- issue: Bezeichnung Gottes als „Gott meines Vaters“
  choice: Singular „meines Vaters“ beibehalten
  alternative: „Gott meiner Väter“
  rationale: Der griechische Text hat den Singular und stellt damit Josefs persönliche Beziehung zu seinem Vater Jakob heraus.
- issue: Bedeutung der brennenden Flamme
  choice: Bildsprache im Haupttext unverändert bewahrt
  alternative: Ausdeutung als Feuer der Begierde oder sexueller Versuchung
  rationale: Der Zusammenhang legt die metaphorische Bedeutung nahe, doch der griechische Text lässt das Bild selbst unausgelegt.
- issue: Handeln Gottes in προΐσταται
  choice: fürsorgliches Beistehen mit offengehaltener Bedeutungsbreite
  alternative: „er geht voran“, „er führt“ oder „er wacht darüber“
  rationale: Das Verb lässt Leitung, Aufsicht und Fürsorge anklingen. Haupttext und Fußnote vermeiden eine einseitige dogmatische Festlegung.
- issue: Gottes zeitweiliges Zurücktreten
  choice: „Nur für kurze Zeit zieht er sich zurück“
  alternative: Abschwächung zu „scheint er sich zurückzuziehen“
  rationale: Der griechische Text sagt tatsächlich, dass er sich kurz entfernt oder zurückzieht, um den inneren Entschluss zu prüfen. Die theologische Spannung wird nicht durch ein zusätzliches „scheint“ beseitigt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer testamentarischer Rede. Die Satzstruktur wurde für heutige Leser behutsam geglättet; zentrale Bilder, Wiederholungen und theologische Spannungen des Griechischen bleiben erhalten. „Menschensohn“ wird hier als semitisch gefärbte Bezeichnung eines Menschen verstanden und nicht christologisch erweitert.
