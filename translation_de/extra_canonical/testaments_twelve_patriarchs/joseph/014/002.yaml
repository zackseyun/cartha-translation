id: T12P.JOS.14.2
reference: Testament of Joseph 14:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ὡς δὲ ⌜ἐγὼ⌉¹¹ οὐκ ἤλλαξα *τὸν λόγον μου¹² ⌜τυπτόμενος⌉, ἐκέλευσε *φυλαχθῆναί με¹³, ἕως οὗ ἔλθωσιν¹⁴ οἱ κύριοι *τοῦ παιδός¹⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/014/002.yaml
  text: But since I did not alter my statement even while I was being beaten, he ordered that I be kept under guard until the masters of the boy should come.
translation:
  language: de
  text: Da ich aber selbst unter Schlägen meine Aussage nicht änderte, befahl er, mich unter Bewachung zu halten, bis die Herren des Jungen kämen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: οὐκ ἤλλαξα τὸν λόγον μου
  choice: meine Aussage nicht änderte
  rationale: λόγος bezeichnet hier im Zusammenhang die zuvor gemachte Aussage; „Aussage“ gibt den forensisch-erzählerischen Sinn natürlicher wieder als das wörtliche „Wort“.
- source_word: τυπτόμενος
  choice: selbst unter Schlägen
  rationale: Das Partizip Präsens Passiv bezeichnet das fortdauernde Geschlagenwerden; die konzessive Einbindung entspricht dem Zusammenhang.
- source_word: φυλαχθῆναί με
  choice: mich unter Bewachung zu halten
  rationale: Das passive φυλάσσω meint hier Gewahrsam beziehungsweise bewachtes Festhalten, nicht bloß allgemeinen Schutz.
- source_word: οἱ κύριοι τοῦ παιδός
  choice: die Herren des Jungen
  rationale: Die formal nahe Wiedergabe bewahrt sowohl den Plural κύριοι als auch die soziale Abhängigkeit, die mit παῖς hier wahrscheinlich bezeichnet wird.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den griechischen Satzbau, wo dieser natürlich bleibt. Der Konjunktiv „kämen“ steht nach dem vergangenen Hauptverb in indirekt-zukunftsbezogener Darstellung.
