source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἡ δὲ γυνὴ¹⁶ ἔλεγε¹⁷ πρὸς *τὸν ἄνδρα αὐτῆς¹⁸· ⌜Τί⌉¹⁹ συνέχεις²⁰ τὸν αἰχμάλωτον καὶ εὐγενῆ παῖδα *ἐν δεσμοῖς²¹, *ὃν ἔδει μᾶλλον ἄνετον εἶναι²² καὶ ὑπηρετεῖσθαι²³.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/014/003.yaml
  text: And the woman kept saying to her husband, “Why do you keep this captive and noble boy in chains, when he ought rather to be set free and waited upon?”
translation:
  language: de
  text: 'Die Frau aber sagte immer wieder zu ihrem Mann: „Warum hältst du diesen gefangenen und vornehmen jungen Mann in Fesseln? Er sollte vielmehr frei sein und bedient werden.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔλεγε
  choice: sagte immer wieder
  rationale: Das Imperfekt bezeichnet hier eine wiederholte oder andauernde Äußerung.
- source_word: αἰχμάλωτον καὶ εὐγενῆ παῖδα
  choice: diesen gefangenen und vornehmen jungen Mann
  rationale: αἰχμάλωτος bezeichnet einen Gefangenen; εὐγενής meint vornehm beziehungsweise von guter Herkunft. παῖς ist altersmäßig offen, doch im Kontext ist eine natürliche Wiedergabe als „junger Mann“ angemessener als das im heutigen Deutsch leicht kindlich wirkende „Junge“.
- source_word: συνέχεις
  choice: hältst ... in Fesseln
  rationale: Das Verb kann „festhalten“ oder „gefangen halten“ bedeuten und wird durch ἐν δεσμοῖς konkretisiert.
- source_word: ἄνετον εἶναι
  choice: frei sein
  rationale: ἄνετος bezeichnet hier den Zustand, losgelassen beziehungsweise nicht gefesselt zu sein.
- source_word: ὑπηρετεῖσθαι
  choice: bedient werden
  rationale: Der passive Infinitiv bedeutet, dass andere ihm dienen oder aufwarten sollen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Redeform des griechischen Imperfekts bleibt erhalten; die rhetorische Gegenüberstellung zwischen Gefangenschaft und einer seinem vornehmen Stand entsprechenden Behandlung wird nicht abgeschwächt.
