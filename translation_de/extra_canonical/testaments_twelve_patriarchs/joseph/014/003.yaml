  source_fidelity: 'Die Übersetzung gibt die zentralen Elemente des griechischen Textes präzise wieder: das iterative Imperfekt ἔλεγε („sagte immer wieder“), die Anrede an den Ehemann, αἰχμάλωτον καὶ εὐγενῆ παῖδα („gefangenen und vornehmen jungen Mann“), das Festhalten in δεσμοί („in Fesseln“) sowie die Gegenüberstellung von Freilassung und Bedienung. Die Aufteilung in zwei deutsche Sätze verändert die Aussage nicht.'
