review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt den Satzbau und die zentralen Aussagen des Griechischen zuverlässig wieder: Memphis sieht Joseph durch die Fenster, ihr Haus liegt nahe, sie lässt Potifar eine Botschaft übermitteln, und sie beanstandet dessen Urteil. „Entführt“ ist für τὸν κλαπέντα bei einer Person idiomatisch und sachgerecht. Die deutsche Wiedergabe von ὡς ἀδικήσαντα als „als hätte er Unrecht getan“ verschiebt jedoch leicht zu einer hypothetischen bzw. kontrafaktischen Aussage; gemeint ist, dass er als jemand bestraft wird, der Unrecht getan hat.'
  naturalness: Modernes Standarddeutsch und Register sind insgesamt gelungen. „Wie ich gerade geschlagen wurde“ bildet den andauernden Charakter des Partizips etwas deutlicher ab. „Wie einen, der Unrecht getan hat“ ist idiomatisch und unmittelbarer als der Konjunktiv-II-Vergleich.
  terminology: „Urteil“, „freier Mann“ und „entführt“ sind angemessen. Keine konfessionell oder theologisch belasteten Begriffe sind betroffen. Die in der griechischen Edition markierte Textlage bei ἐλεύθερον wird nicht durch eine Fußnote im Ausgangsmaterial dokumentiert; da der vorgelegte englische Audit-Text und der Entwurf das Wort im Haupttext führen und keine Fußnotenanker vorgegeben sind, ist keine neue Fußnote erforderlich.
  issues:
