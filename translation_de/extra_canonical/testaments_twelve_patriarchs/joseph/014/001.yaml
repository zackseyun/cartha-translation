    issue: Der Konjunktiv-II-Ausdruck „als hätte er Unrecht getan“ für ὡς ἀδικήσαντα
    rationale: Er kann eine irreal-hypothetische Nuance nahelegen. Das griechische ὡς mit Partizip bezeichnet hier die Behandlung bzw. Einordnung Josephs als eines Schuldigen. Eine indikativische Relativkonstruktion gibt dies präziser wieder.
  revised_text: 'Memphis aber sah durch die Fenster, wie ich gerade geschlagen wurde – denn ihr Haus war ganz in der Nähe –, und sie ließ ihm sagen: „Dein Urteil ist ungerecht, denn du bestrafst einen freien Mann, der entführt worden ist, wie einen, der Unrecht getan hat.“'
