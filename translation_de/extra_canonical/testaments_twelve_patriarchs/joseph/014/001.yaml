source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἡ δὲ Μεμφὶς¹ ἑώρα² διὰ *τῶν θυρίδων³ ⌜*τυπτόμενόν με⁴, *πλησίον γὰρ ἦν ὁ οἶκος αὐτῆς⁵, καὶ *ἀπέστειλε πρὸς αὐτόν⁶, λέγουσα⁷· *Ἄδικος⁸ ἡ κρίσις σου⁹, ὅτι τὸν *κλαπέντα ⌜ἐλεύθερον⌉ *τιμωρεῖς, ὡς ἀδικήσαντα¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/014/001.yaml
  text: And Memphis saw me being beaten through the windows—for her house was nearby—and she sent word to him, saying, “Your judgment is unjust, because you punish as a wrongdoer a free man who has been kidnapped.”
translation:
  language: de
  text: 'Memphis aber sah durch die Fenster, wie ich gerade geschlagen wurde – denn ihr Haus war ganz in der Nähe –, und sie ließ ihm sagen: „Dein Urteil ist ungerecht, denn du bestrafst einen freien Mann, der entführt worden ist, wie einen, der Unrecht getan hat.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἑώρα διὰ τῶν θυρίδων
  choice: sah durch die Fenster
  rationale: Gibt die räumliche Perspektive des griechischen Ausdrucks natürlich und genau wieder.
- source_word: τυπτόμενόν με
  choice: wie ich geschlagen wurde
  rationale: Bewahrt den durativen passiven Sinn des Partizips in idiomatischem Deutsch.
- source_word: ἀπέστειλε πρὸς αὐτόν
  choice: sie ließ ihm sagen
  rationale: Der elliptische Ausdruck bezeichnet hier das Übermitteln einer Botschaft; die deutsche Form vermeidet die unbelegte Ergänzung eines bestimmten Boten.
- source_word: τὸν κλαπέντα ἐλεύθερον
  choice: einen freien Mann, der entführt worden ist
  rationale: κλέπτω bedeutet wörtlich „stehlen“; auf eine Person bezogen bezeichnet das Passiv hier natürlich ein gewaltsames oder heimliches Verschleppen. „Entführt“ ist im Deutschen idiomatisch und wahrt den Sinn.
- source_word: ὡς ἀδικήσαντα
  choice: als hätte er Unrecht getan
  rationale: Gibt ὡς mit dem Partizip als zugeschriebene, nicht vom Erzähler bestätigte Schuld wieder.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nahe am griechischen Gedankengang, wird jedoch für flüssige Verständlichkeit moderat gegliedert. „Ganz in der Nähe“ gibt πλησίον idiomatisch wieder; die Anrede bleibt direkt und eindringlich.
