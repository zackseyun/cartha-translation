- from: 'Memphis aber sah durch die Fenster, wie ich geschlagen wurde – denn ihr Haus war ganz in der Nähe –, und sie ließ ihm sagen: „Dein Urteil ist ungerecht, denn du bestrafst einen freien Mann, der entführt worden ist, als hätte er Unrecht getan.“'
  to: 'Memphis aber sah durch die Fenster, wie ich gerade geschlagen wurde – denn ihr Haus war ganz in der Nähe –, und sie ließ ihm sagen: „Dein Urteil ist ungerecht, denn du bestrafst einen freien Mann, der entführt worden ist, wie einen, der Unrecht getan hat.“'
  rationale: Die Revision beschränkt sich auf eine genauere Wiedergabe des durativen Partizips τυπτόμενόν und insbesondere auf die idiomatische, quellentreuere Wiedergabe von ὡς ἀδικήσαντα ohne zusätzliche kontrafaktische Nuance. Bedeutung, Register und die bestehende Entscheidung für „entführt“ bleiben erhalten.
