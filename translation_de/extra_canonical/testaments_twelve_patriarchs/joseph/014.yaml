base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/014.yaml
  text: 1[a]. And Memphis saw me being beaten through the windows—for her house was nearby—and she sent word to him, saying, “Your judgment is unjust[b], because you punish as a wrongdoer a free man who has been kidnapped.” 2. But since I did not alter my statement even while I was being beaten, he ordered that I be kept under guard until the masters of the boy should come. 3. And the woman kept saying to her husband[c],
translation:
  language: de
  text: '**Testament Josefs 14**


    1 Memphis sah durch die Fenster[a], wie ich geschlagen wurde – ihr Haus lag nämlich ganz in der Nähe. Da ließ sie ihm sagen: »Dein Urteil ist ungerecht, denn du bestrafst einen freien Mann, der geraubt worden ist[b], als hätte er Unrecht getan.« 2 Da ich meine Aussage auch unter Schlägen nicht änderte, ordnete er an, mich unter Bewachung zu halten, bis die Herren des jungen Mannes kämen. 3 Die Frau sagte immer wieder zu ihrem Mann: »Warum hältst du diesen gefangenen jungen Mann von edler Herkunft in Fesseln? Er sollte vielmehr frei sein und bedient werden.« 4 Sie wollte mich nämlich in sündigem Verlangen sehen; ich aber wusste von alledem nichts. 5 Er erwiderte ihr: »Bei den Ägyptern ist es nicht üblich, fremdes Eigentum an sich zu nehmen, bevor ein Beweis erbracht ist.« 6 Das sagte er also in Bezug auf den Händler[c]. Der junge Mann aber muss eingeschlossen bleiben.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »durch die Fensteröffnungen« beziehungsweise »durch die Gitter«. Gemeint sind nicht unbedingt verglaste Fenster im heutigen Sinn.'
    reason: cultural_note
  - marker: b
    text: 'Wörtlich steht hier ein »gestohlener« freier Mann: ein freier Mensch, der widerrechtlich ergriffen und wie ein Sklave behandelt wurde.'
    reason: lexical_alternative
  - marker: c
    text: Das griechische Wort ist selten und an dieser Stelle unsicher. Im Zusammenhang bezeichnet es wahrscheinlich den Händler oder Zwischenhändler, über dessen Anspruch erst ein Beweis erbracht werden sollte.
    reason: textual_difficulty
lexical_decisions:
- source_word: Μεμφίς
  choice: Memphis
  rationale: Der Eigenname wird entsprechend der griechischen Form transliteriert.
- source_word: τυπτόμενόν με
  choice: wie ich geschlagen wurde
  rationale: Die Form bezeichnet fortgesetzte körperliche Schläge, ohne ein bestimmtes Schlaginstrument vorauszusetzen.
- source_word: διὰ τῶν θυρίδων
  choice: durch die Fenster
  rationale: Die verständliche deutsche Wiedergabe bezeichnet die Fensteröffnungen; die mögliche antike Bauform wird in einer Fußnote erläutert.
- source_word: Ἄδικος ἡ κρίσις σου
  choice: Dein Urteil ist ungerecht
  rationale: κρίσις hat hier angesichts von Strafe und Gewahrsam einen rechtlichen Sinn.
- source_word: τὸν κλαπέντα ἐλεύθερον
  choice: einen freien Mann, der geraubt worden ist
  rationale: Die ungewöhnliche Rede von einem 'gestohlenen' Menschen wird im Deutschen mit 'geraubt' natürlich ausgedrückt, während sein rechtlicher Status als Freier ausdrücklich erhalten bleibt.
- source_word: οὐκ ἤλλαξα τὸν λόγον μου
  choice: bei meiner Aussage blieb
  rationale: Gemeint ist, dass Josef seine Darstellung trotz der Schläge nicht änderte; die idiomatische Formulierung bewahrt diesen Sinn.
- source_word: οἱ κύριοι τοῦ παιδός
  choice: die Herren des jungen Mannes
  rationale: κύριοι bezeichnet Personen mit Herrschafts- oder Besitzanspruch. παῖς kann einen Jungen, jungen Mann oder Diener bezeichnen; der Zusammenhang spricht hier für einen jungen Mann.
- source_word: αἰχμάλωτον καὶ εὐγενῆ παῖδα
  choice: diesen gefangenen jungen Mann von edler Herkunft
  rationale: Die Wiedergabe erhält sowohl die Gefangenschaft als auch die Aussage über vornehme beziehungsweise freie Herkunft.
- source_word: ἐν πόθῳ ἁμαρτίας
  choice: aus sündigem Verlangen
  rationale: Die Formulierung hält die moralische Bewertung des Begehrens fest, ohne dessen genaue Art über den Kontext hinaus auszumalen.
- source_word: ἀφαιρεῖσθαι τὰ ἀλλότρια
  choice: fremdes Eigentum an sich zu nehmen
  rationale: Die sachlich-rechtliche Besitzsprache des griechischen Textes bleibt erhalten, auch wenn sie im Zusammenhang mit Josefs Behandlung bewusst anstößig wirkt.
- source_word: περὶ τοῦ μεταβόλου
  choice: in Bezug auf den Händler
  rationale: Das seltene und kontextuell schwierige Substantiv wird aufgrund der Erzählsituation als Bezeichnung des Händlers beziehungsweise Zwischenhändlers verstanden; die Unsicherheit wird angemerkt.
- source_word: ἐγκατάκλειστος εἶναι
  choice: weiterhin eingeschlossen bleiben
  rationale: Der Ausdruck bezeichnet strikten Einschluss oder Gewahrsam; 'weiterhin' gibt im Deutschen den Gegensatz zur vorher geforderten Freilassung wieder.
theological_decisions:
- issue: Josefs rechtlicher und sozialer Status
  choice: Die Gegenüberstellung von 'freier Mann' und 'Herren' wird ausdrücklich bewahrt.
  alternative: ἐλεύθερον als 'unschuldig' und κύριοι allgemeiner als 'Verantwortliche' wiederzugeben.
  rationale: Der Text unterscheidet zwischen Josefs tatsächlichem Status als freiem Menschen und dem über ihn erhobenen Besitzanspruch. Eine moralische Paraphrase als 'unschuldig' würde diese soziale und rechtliche Spannung abschwächen.
- issue: Besitzsprache für einen Menschen
  choice: Die Aussage über 'fremdes Eigentum' bleibt im Haupttext stehen.
  alternative: Die Formulierung auf einen bloßen Zuständigkeits- oder Rechtsanspruch abzuschwächen.
  rationale: Der griechische Text verwendet ausdrücklich Besitzsprache. Ihre Spannung zur unmittelbar vorherigen Bezeichnung Josefs als freiem Mann soll nicht harmonisiert werden.
- issue: Das Begehren der Frau
  choice: πόθος ἁμαρτίας wird als 'sündiges Verlangen' wiedergegeben.
  alternative: Das Verlangen ausdrücklich als Ehebruch oder sexuelle Begierde zu bestimmen.
  rationale: Der Zusammenhang legt sexuelles Begehren nahe, doch die Formulierung selbst nennt allgemein ein auf Sünde gerichtetes Verlangen. Die Übersetzung wahrt diese begrenzte Offenheit.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die direkte Rede bleibt klar und knapp; rechtliche und soziale Begriffe werden nicht beschönigt. Archaismen wie »Jüngling«, »Knecht« oder »auf dass« wurden vermieden.
