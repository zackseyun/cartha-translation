revisions:
- from: '**Testament Josefs 14**


    1 Memphis sah durch die Fenster[a], wie ich geschlagen wurde – ihr Haus lag nämlich ganz in der Nähe. Da ließ sie ihm sagen: »Dein Urteil ist ungerecht, denn du bestrafst einen freien Mann, der geraubt worden ist[b], als hätte er Unrecht getan.« 2 Doch obwohl ich selbst unter den Schlägen bei meiner Aussage blieb, ordnete er an, mich unter Bewachung zu halten, bis die Herren des jungen Mannes kämen. 3 Die Frau sagte zu ihrem Mann: »Warum hältst du diesen gefangenen jungen Mann von edler Herkunft in Fesseln? Er sollte vielmehr frei sein und bedient werden.« 4 Denn aus sündigem Verlangen wollte sie mich sehen; ich aber wusste von all dem nichts. 5 Er erwiderte ihr: »Bei den Ägyptern ist es nicht üblich, fremdes Eigentum an sich zu nehmen, bevor ein Beweis erbracht ist.« 6 Das sagte er also in Bezug auf den Händler[c]. Der junge Mann aber müsse weiterhin eingeschlossen bleiben.'
  to: '**Testament Josefs 14**


    1 Memphis sah durch die Fenster[a], wie ich geschlagen wurde – ihr Haus lag nämlich ganz in der Nähe. Da ließ sie ihm sagen: »Dein Urteil ist ungerecht, denn du bestrafst einen freien Mann, der geraubt worden ist[b], als hätte er Unrecht getan.« 2 Da ich meine Aussage auch unter Schlägen nicht änderte, ordnete er an, mich unter Bewachung zu halten, bis die Herren des jungen Mannes kämen. 3 Die Frau sagte immer wieder zu ihrem Mann: »Warum hältst du diesen gefangenen jungen Mann von edler Herkunft in Fesseln? Er sollte vielmehr frei sein und bedient werden.« 4 Sie wollte mich nämlich in sündigem Verlangen sehen; ich aber wusste von alledem nichts. 5 Er erwiderte ihr: »Bei den Ägyptern ist es nicht üblich, fremdes Eigentum an sich zu nehmen, bevor ein Beweis erbracht ist.« 6 Das sagte er also in Bezug auf den Händler[c]. Der junge Mann aber muss eingeschlossen bleiben.«'
  rationale: Die Revision verbessert die unmittelbare Anbindung an die griechische Syntax und hält die direkte Rede bis zum Schluss des Abschnitts aufrecht. Sie entfernt die nicht ausdrücklich markierte Fortsetzungsnuance in V. 6, vereinheitlicht die kontextuelle Wiedergabe von παῖς und bewahrt alle Fußnotenanker sowie die sachlich gebotene Unsicherheit bei μεταβολος.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T09:12:42Z'
review_pass:
  verdict: revise
  source_fidelity: Mehrere Kernentscheidungen sind zutreffend, insbesondere »Dein Urteil ist ungerecht«, die rechtlich-soziale Gegenüberstellung von freiem Mann und Herren sowie die vorsichtige Behandlung von μεταβολος. Korrigiert werden sollte jedoch die Wiedergabe von ὡς δέ in V. 2, die fortlaufende direkte Rede in V. 6 und die nicht im Griechischen ausgedrückte Nuance »weiterhin«. Außerdem sollte παῖς innerhalb des Abschnitts einheitlich als »junger Mann« wiedergegeben werden, soweit diese altersbezogene Deutung gewählt wird.
  naturalness: Der Text ist insgesamt modernes, gut lesbares Standarddeutsch. »Da ließ sie ihm sagen« ist idiomatisch. In direkter Rede wirkt jedoch »Der junge Mann aber müsse« unnötig indirekt; »muss eingeschlossen bleiben« ist klarer und entspricht der fortgesetzten Rede. »Bei meiner Aussage blieb« ist verständlich, aber »meine Aussage nicht änderte« bildet den griechischen Ausdruck unmittelbarer ab.
  terminology: »Freier Mann«, »Herren«, »in Fesseln«, »edler Herkunft« und »sündiges Verlangen« bewahren die sozialen beziehungsweise moralischen Kategorien des Textes ohne zusätzliche dogmatische Festlegung. »Junger Mann« ist für παῖς kontextuell möglich, muss dann aber auch in V. 2 und V. 6 stehen. Die unsichere Deutung von μεταβολος als Händler bleibt ausdrücklich als wahrscheinlich gekennzeichnet.
  issues:
  - severity: medium
    issue: 'V. 2: »obwohl ... bei meiner Aussage blieb«'
    rationale: Ὡς δέ leitet hier den Umstand beziehungsweise Zeitpunkt ein, auf den die Anordnung folgt; ein ausdrückliches adversatives »obwohl« ist nicht erforderlich. Οὐκ ἤλλαξα τὸν λόγον μου bedeutet unmittelbar, dass Josef seine Aussage nicht änderte.
  - severity: medium
    issue: 'V. 6: Konjunktiv und »weiterhin«'
    rationale: Die wörtliche Rede des Mannes läuft bis zum Ende von V. 6 weiter. Daher ist »muss eingeschlossen bleiben« statt des berichtenden Konjunktivs angemessen. »Weiterhin« hat im griechischen ἐγκατάκλειστος εἶναι keine ausdrückliche Entsprechung.
  - severity: low
    issue: Uneinheitliche Wiedergabe von παῖς
    rationale: V. 2 spricht vom »Jungen«, V. 3 und V. 6 vom »jungen Mann«, obwohl jeweils παῖς steht. Eine einheitliche kontextuelle Wiedergabe verbessert die Kohärenz.
  - severity: low
    issue: 'V. 4: Stellung der Motivangabe'
    rationale: »Aus sündigem Verlangen wollte sie mich sehen« ist verständlich, aber »Sie wollte mich nämlich in sündigem Verlangen sehen« bildet ἐν πόθῳ ἁμαρτίας enger ab und lässt die Art des Verlangens weiterhin offen.
