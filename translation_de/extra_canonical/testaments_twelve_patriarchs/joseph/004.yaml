  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/004.yaml
  text: '9[a]. And when I understood, I was grieved unto death. But after she had gone out, I came to myself and mourned over her for many days, because I recognized her deceit and her delusion.

    10. And I spoke to her words of the Most High, to see whether perhaps she might turn back from her evil desire.

    11. So then, many times[b], as to a holy man, she flattered me with words; and with deceit she praised my self-control before her husband, wishing to trip me up when we were alone.

    12. For she openly extolled me as chaste with respect to the bed, but in secret she said to me, “Do not be afraid of my husband; for he is persuaded concerning your purity, and even if someone should tell him about us, he will not believe it.”

    13. In all these things I, lying low on the ground, kept begging the God of my fathers that he would rescue me from her deceit.

    14. Since she accomplished nothing in this way, again she began to come to me with words of instruction, wanting to learn the word of God.

    15. And she says to me, “If you want me to leave behind the idols, I will persuade my husband to withdraw from them, and we will go before your Lord, walking in the law of your Lord.”

    16. But I said to her, “The Lord does not will that those who revere him should be in uncleanness, nor does he delight in adulterers, but in those who draw near to him with a pure heart and undefiled lips.”

    17. But she kept contending, wanting to fulfill her desire.

    18. And I added fasting and prayer[d][c], so that the Lord might rescue me from her.'
translation:
  language: de
  text: '9. Als ich das begriff, war ich zu Tode betrübt. Nachdem sie aber hinausgegangen war, kam ich wieder zu mir und trauerte viele Tage um sie, denn ich hatte ihre Arglist und ihre Verblendung erkannt.


    10. Ich sprach zu ihr Worte des Höchsten, um zu sehen, ob sie sich vielleicht von ihrem bösen Verlangen abwenden würde.


    11. So schmeichelte sie mir oft mit Worten, als wäre ich ein heiliger Mann. Hinterlistig lobte sie meine Selbstbeherrschung vor ihrem Mann, weil sie mich unter vier Augen zu Fall bringen wollte.


    12. Denn öffentlich rühmte sie mich als keusch im Bett, insgeheim aber sagte sie zu mir: »Fürchte dich nicht vor meinem Mann! Er ist nämlich von deiner Selbstbeherrschung überzeugt. Selbst wenn ihm jemand etwas über uns erzählt, wird er es nicht glauben.«


    13. Während all dessen lag ich auf dem Boden und flehte Gott an, mich aus ihrer Hinterlist zu erretten.


    14. Als sie damit nichts erreichte, begann sie wiederum, mit Worten der Unterweisung zu mir zu kommen, weil sie das Wort Gottes kennenlernen wollte.


    15. Sie sagte zu mir: »Wenn du willst, dass ich die Götzen aufgebe, dann schlafe mit mir. Auch ich werde meinen Mann dazu bewegen, sich von den Götzen abzuwenden, und wir werden vor deinem Herrn leben.«


    16. Ich aber sagte zu ihr: »Der Herr will nicht, dass diejenigen, die ihn verehren, in Unreinheit leben. Auch hat er kein Gefallen an denen, die Ehebruch begehen, sondern an denen, die sich ihm mit reinem Herzen und unbefleckten Lippen nahen.«


    17. Sie aber widersprach mir weiterhin, weil sie ihr Verlangen stillen wollte.


    18. Ich aber fügte Fasten und Gebet hinzu, damit der Herr mich von ihr errette.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐλυπήθην ἕως θανάτου
  choice: war ich zu Tode betrübt
  rationale: Bewahrt die starke, feierliche Wendung des Griechischen und klingt im Deutschen natürlich.
- source_word: ἦλθον εἰς ἐμαυτόν
  choice: kam ich wieder zu mir
  rationale: Gibt die griechische Redewendung transparent wieder, ohne sie unnötig psychologisch festzulegen.
- source_word: δόλος / πλάνη
  choice: Arglist / Verblendung
  rationale: 'Hält die beiden Begriffe auseinander: δόλος bezeichnet absichtliche Hinterlist, πλάνη eine irregeleitete oder verblendete Haltung.'
- source_word: ῥήματα ὑψίστου
  choice: Worte des Höchsten
  rationale: Der Genitiv wird am natürlichsten als Zugehörigkeit oder Herkunft verstanden; die erhabene Gottesbezeichnung bleibt erhalten.
- source_word: σωφροσύνη / σώφρονα
  choice: Selbstbeherrschung / selbstbeherrscht
  rationale: Der Tugendbegriff schließt hier sexuelle Enthaltsamkeit ein, ist aber weiter als bloße Keuschheit.
- source_word: ὑποσκελίσαι
  choice: zu Fall bringen
  rationale: Bewahrt das Bild des Strauchelns beziehungsweise Stürzens in einer idiomatischen deutschen Form.
- source_word: χαμοκοιτῶν
  choice: lag ich auf dem Boden
  rationale: Die seltene Bildung bezeichnet eine niedrige Liegehaltung; eine genauere Körperhaltung wie das Liegen auf dem Gesicht wird nicht behauptet.
- source_word: λόγῳ κατηχήσεως
  choice: mit Worten der Unterweisung
  rationale: Gibt den Sinn wieder, ohne den späteren kirchlichen Fachbegriff »Katechese« aufzudrängen.
- source_word: συγγενοῦς μου
  choice: schlafe mit mir
  rationale: Das Verb συγγίνομαι ist in diesem eindeutig sexuellen Zusammenhang als Aufforderung zum Geschlechtsverkehr zu verstehen; eine wörtlichere Wiedergabe wäre im modernen Deutsch missverständlich.
- source_word: προσετιθέμην νηστείαν καὶ προσευχήν
  choice: fastete und betete noch mehr
  rationale: Drückt das verstärkte beziehungsweise fortgesetzte Hinzufügen von Fasten und Gebet natürlich aus, ohne das Verhältnis beider Übungen künstlich festzulegen.
theological_decisions:
- issue: Gottesbezeichnung in Josephs Gebet (Vers 13)
  choice: Gott
  alternative: der Gott meiner Väter
  rationale: Der vorgelegte griechische Text bietet τοῦ Θεοῦ ohne den Zusatz »meiner Väter«. Der patriarchalisch passende Zusatz wird daher nicht aus der englischen Konsultationsschicht in den Haupttext übernommen.
- issue: Zweitpersoniger Bezug in Κυρίου σου (Vers 15)
  choice: deinen Herrn
  alternative: den Herrn / deinen Gott
  rationale: Das Possessivpronomen der griechischen Vorlage wird bewahrt und nicht an eine vertrautere religiöse Formel angeglichen.
- issue: Verheißene Abkehr vom Götzendienst als Mittel der Verführung
  choice: Die bedingte Verknüpfung bleibt ausdrücklich stehen
  alternative: Die Aussage abschwächen oder als aufrichtige Bekehrungsabsicht darstellen
  rationale: Der Text stellt ihr religiöses Angebot als Teil ihrer Verführung dar; diese moralische und theologische Spannung wird nicht geglättet.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem testamentarischem Ton. Wiederholungen und Kontraste des griechischen Erzählstils bleiben sichtbar. Die fortlaufende Verszählung 9–18 folgt der bereitgestellten Ausgabe, obwohl mit Vers 11 der Abschnitt IV beginnt.
