review_pass:
  verdict: revise
  source_fidelity: 'Eine notwendige Korrektur betrifft Vers 12: σώφρονα/σωφροσύνη ist im Kontext durch κοίτη ausdrücklich auf sexuelle Keuschheit bezogen; das bloße „selbstbeherrscht“ verwischt diese Spezifizierung. In Vers 18 bezeichnet προσετιθέμην das Hinzufügen bzw. Verstärken von Fasten und Gebet, nicht einfach „fastete und betete noch mehr“. Vers 15 enthält tatsächlich die sexuelle Aufforderung συγγενοῦς μου, doch das anschließende πορευσόμεθα ἐνώπιον Κυρίου σου bedeutet nicht „vor ... treten“ und bietet in der vorgelegten griechischen Fassung keinen Zusatz über ein Gesetz.'
  naturalness: Die revidierte Fassung bleibt modernes, würdiges Standarddeutsch. „keusch im Bett“ ist klar und idiomatisch; „vor deinem Herrn leben“ gibt die religiös-ethische Bedeutung von πορεύεσθαι ἐνώπιον wieder, ohne einen räumlichen Vorgang nahezulegen.
  terminology: „Arglist / Verblendung“, „Worte des Höchsten“, „Selbstbeherrschung“ in Vers 11 und „Unreinheit“ bewahren die wesentlichen Unterscheidungen. Für Vers 12 wird die sexuelle Präzisierung des griechischen Ausdrucks ausdrücklich sichtbar gemacht. „Gott“ in Vers 13 folgt dem tatsächlich gebotenen τοῦ Θεοῦ ohne Ergänzung „meiner Väter“.
  issues:
  - severity: medium
    issue: Vers 12 gibt die sexuelle Spezifizierung von σώφρονα nicht wieder.
    rationale: Die Formulierung κοίτων σώφρονα bezieht die Tugend konkret auf das Bett bzw. sexuelle Keuschheit. „als selbstbeherrscht“ ist dafür zu allgemein.
  - severity: high
    issue: Vers 15 und Fußnote a führen einen nicht im vorgelegten griechischen Text enthaltenen Zusatz über das Gesetz des Herrn ein bzw. setzen ihn als längere Überlieferungsfassung voraus.
    rationale: Der angegebene Wortlaut endet mit καὶ πορευσόμεθα ἐνώπιον Κυρίου σου. Eine Ergänzung „nach dem Gesetz deines Herrn leben“ ist auf Basis dieser Vorlage nicht zu übersetzen oder zu behaupten.
  - severity: medium
    issue: „vor deinen Herrn treten“ in Vers 15 ist für πορευσόμεθα ἐνώπιον Κυρίου σου zu eng und räumlich.
    rationale: Die Wendung bezeichnet ein Leben bzw. Wandeln vor dem Herrn; „leben vor“ bewahrt den fortdauernden ethisch-religiösen Sinn.
  - severity: low
    issue: „fastete und betete noch mehr“ in Vers 18 interpretiert προσετιθέμην zu frei.
    rationale: Das Verb bezeichnet das Hinzufügen/Steigern; ein explizites „noch mehr“ steht nicht im Text.
