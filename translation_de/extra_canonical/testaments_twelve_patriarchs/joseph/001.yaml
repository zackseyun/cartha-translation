base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/001.yaml
  text: '3. In my life I saw envy and death, and I was not led astray, but remained in the truth of the Lord.

    4. My brothers hated me, but the Lord loved me. They wanted to kill me, but the God of my fathers kept me safe. They lowered me into a pit, and the Most High brought me up.

    5. I was sold into slavery, and the Master of all set me free. I was taken into captivity, and his mighty hand helped me. I was gripped by famine, and the Lord himself nourished me.

    6. I was alone, and God comforted me. I was weak, and the Lord visited me. I was in prison, and the Savior showed me favor. [I was in chains, and he loosed me.]

    7. Amid slanders he spoke in my defense. In the bitter talk of dreams he rescued me.'
translation:
  language: de
  text: 'Das Testament Josefs, des elften Sohnes Jakobs und Rahels


    1. Abschrift des Testaments Josefs. Als er im Begriff war zu sterben, rief er seine Söhne und seine Brüder zu sich und sagte zu ihnen:


    2. »Meine Brüder und meine Kinder, hört auf Josef, den Israel liebte; schenkt den Worten meines Mundes Gehör.


    3. In meinem Leben begegnete ich Neid und Tod; doch ich ließ mich nicht in die Irre führen, sondern blieb in der Wahrheit des Herrn.


    4. Meine Brüder hassten mich, doch der Herr liebte mich. Sie wollten mich töten, doch der Gott meiner Väter bewahrte mich. Sie ließen mich in eine Grube hinab, doch der Höchste holte mich herauf.


    5. Ich wurde in die Sklaverei verkauft, doch der Herrscher über alle befreite mich. Ich wurde gefangen weggeführt, doch seine mächtige Hand half mir. Der Hunger hielt mich fest, doch der Herr selbst ernährte mich.


    6. Ich war allein, doch Gott tröstete mich. Ich war schwach, doch der Herr suchte mich auf. Ich war im Gefängnis, doch der Retter erwies mir Gnade. [Ich lag in Fesseln, doch er löste mich.][a]


    7. Als man mich verleumdete, trat er für mich ein. Bei bitteren Worten über Träume rettete er mich.[b] Ich war ein Sklave, doch er erhöhte mich.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Zeile »Ich lag in Fesseln, doch er löste mich« steht in der zugrunde gelegten Ausgabe in eckigen Klammern und ist textlich unsicher.
    reason: Die editorische Kennzeichnung des griechischen Ausgangstextes muss für Leser sichtbar bleiben.
  - marker: b
    text: Die griechische Wendung kann auch als »bei bitteren Traumworten« oder als »bei bitterem Reden über Träume« verstanden werden.
    reason: Die syntaktische Zuordnung von „bitter“ sowie das Verhältnis zwischen „Worten“ und „Träumen“ sind mehrdeutig.
lexical_decisions:
- source_word: φθόνον καὶ τὸν θάνατον
  choice: Neid und Tod
  rationale: Bewahrt die konkrete, spannungsreiche Paarung des griechischen Textes, ohne sie psychologisch oder metaphorisch aufzulösen.
- source_word: ἐν τῇ ἀληθείᾳ Κυρίου
  choice: in der Wahrheit des Herrn
  rationale: Formnahe Wiedergabe, welche die theologische Offenheit von ἀλήθεια bewahrt.
- source_word: ἐφύλαξέν με
  choice: bewahrte mich
  rationale: Gibt den Schutzgedanken wieder, ohne das Ergebnis stärker als im Griechischen auszudeuten.
- source_word: ὁ πάντων δεσπότης
  choice: der Herrscher über alle
  rationale: δεσπότης bezeichnet hier den souveränen Gebieter; „Herrscher“ ist im Deutschen verständlich und vermeidet eine Verwechslung mit dem gewöhnlichen Herr-Titel.
- source_word: ἐν λιμῷ συνεσχέθην
  choice: Der Hunger hielt mich fest
  rationale: Bildhafte und relativ formnahe Wiedergabe des Passivs von συνέχω; sie erhält die bedrängende Kraft des Ausdrucks.
- source_word: ἐπεσκέψατό με
  choice: suchte mich auf
  rationale: Entspricht dem Grundsinn von ἐπισκέπτομαι und lässt offen, ob Trost, Fürsorge oder Eingreifen im Vordergrund steht.
- source_word: ἐχαρίτωσέ με
  choice: erwies mir Gnade
  rationale: Erhält den Gnaden- bzw. Gunstaspekt des Verbs, ohne eine spezifische Heilslehre einzutragen.
- source_word: συνηγόρησέ μοι
  choice: trat er für mich ein
  rationale: Gibt die forensische Bedeutung des Verbs natürlich wieder.
- source_word: ἐν λόγοις ἐνυπνίων πικροῖς
  choice: aus den bitteren Worten der Träume
  rationale: Bewahrt die ungewöhnliche und mehrdeutige Verbindung von Worten, Träumen und Bitterkeit, statt sie durch eine eindeutige Deutung zu glätten.
- source_word: Δοῦλος καὶ ὕψωσέν με
  choice: Ich war ein Sklave, doch er erhöhte mich
  rationale: Ergänzt nur die im elliptischen Parallelstil vorausgesetzte Kopula und stellt den Kontrast entsprechend den vorangehenden Zeilen natürlich dar.
theological_decisions:
- issue: Wechselnde Gottesbezeichnungen
  choice: Herr, Gott meiner Väter, Höchster, Herrscher über alle, Gott und Retter jeweils unterschieden wiedergeben
  alternative: Die Bezeichnungen unter einem einheitlichen Gottesnamen zusammenfassen
  rationale: Der griechische Text verwendet bewusst mehrere Titel; ihre Vielfalt und theologischen Nuancen sollen erhalten bleiben.
- issue: ὁ σωτήρ in Vers 6
  choice: der Retter
  alternative: der Heiland
  rationale: „Retter“ ist modernes Standarddeutsch und wahrt die Aussage des Titels, ohne eine später konfessionell geprägte Ausdrucksweise aufzudrängen.
- issue: Erhöhung des versklavten Josef
  choice: „er erhöhte mich“ ohne nähere Bestimmung des Handelnden oder der Art der Erhöhung
  alternative: „Gott erhöhte mich zum Herrscher“
  rationale: Das Subjekt ergibt sich nur aus dem fortlaufenden Zusammenhang, und der griechische Text benennt weder ein Amt noch das konkrete Ergebnis.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit rhythmischen Parallelismen. Die wiederholte Kontraststruktur wird überwiegend mit „doch“ wiedergegeben. Archaismen wurden vermieden; ungewöhnliche Bilder und textliche Spannungen blieben erhalten.
