  terminology: „Sklaven“ gibt δοῦλοι angemessen stark wieder. „Eintracht“, „Vorwürfe machen“, „Mut zusprechen“ und „im Übermaß“ passen zum Register und Sinn. Die Fußnotenmarker sind nun an den sachlich passenden Stellen (Vv. 2, 3 und 7) verankert.
