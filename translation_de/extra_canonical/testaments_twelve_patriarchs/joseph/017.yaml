base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/017.yaml
  text: 1[a]. See then, my children, how much I endured so that I might not put my brothers to shame. 2. You also, therefore, love one another, and with patience conceal one another’s shortcomings. 3. For God delights in the harmony of brothers and in the purpose of a good heart that intends what is good. 4[b]. And when my brothers came to Egypt, they themselves know that I returned their money to them, and did not reproach them, but encouraged them. 5. And after the death of Jacob my father, I loved them even more, and whatever they wanted I did for them beyond measure. 6. And I did not allow them to be distressed even in the smallest matter; rather, everything that was in my hand I gave to them. 7. And their sons were my sons, and my sons were as servants to them, and their soul was my soul, and every pain of theirs was my pain, and every weakness of theirs was my sickness, and their purpose was my purpose. 8. And I did not exalt myself among them in arrogance because of my worldly glory[c],
    but I was among them as one of the least.
translation:
  language: de
  text: '**Testament Josefs 17**


    **1** Seht also, meine Kinder, wie viel ich ertragen habe, damit ich meine Brüder nicht beschäme. **2** So liebt auch ihr einander und bedeckt in Geduld die Verfehlungen des anderen.[a] **3** Denn Gott freut sich über die Eintracht unter Brüdern und über den Entschluss eines guten Herzens, das auf das Gute bedacht ist.[b]


    **4** Als meine Brüder nach Ägypten kamen, wissen sie selbst, dass ich ihnen ihr Geld zurückgegeben hatte. Ich machte ihnen keine Vorwürfe, sondern sprach ihnen Mut zu. **5** Und nach dem Tod meines Vaters Jakob liebte ich sie noch mehr; alles, was sie wollten, tat ich im Übermaß für sie. **6** Ich ließ nicht zu, dass sie auch nur in der geringsten Sache bedrängt wurden, sondern gab ihnen alles, was in meiner Hand war.


    **7** Ihre Söhne waren meine Söhne, und meine Söhne waren wie ihre Sklaven.[c] Ihre Seele war meine Seele, jeder ihrer Schmerzen war mein Schmerz, jede ihrer Schwächen war meine Krankheit, und ihr Vorhaben war mein Vorhaben. **8** Wegen meines weltlichen Ruhmes erhob ich mich nicht hochmütig unter ihnen, sondern lebte unter ihnen wie einer der Geringsten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „verbergt die Verfehlungen des anderen“. Das griechische Verb legt nahe, die Fehler eines Bruders nicht lieblos bloßzustellen.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Wortlaut des Satzteils über den „Entschluss eines guten Herzens“ ist textlich und grammatisch schwierig. Die Übersetzung folgt dem erkennbaren ethischen Sinn: einer Herzenshaltung, die auf das Gute ausgerichtet ist.'
    reason: textual_variant
  - marker: c
    text: „Sklaven“ gibt das griechische Wort *douloi* wieder. Die bewusst starke Formulierung beschreibt Josefs Demut und die Unterordnung seines eigenen Hauses gegenüber seinen Brüdern.
    reason: lexical_alternative
lexical_decisions:
- source_word: αἰσχύνω
  choice: beschämen
  rationale: Das Verb bezeichnet das Zufügen von Schande oder öffentlicher Beschämung. „Beschämen“ bewahrt Josefs bewusste Zurückhaltung gegenüber seinen Brüdern.
- source_word: μακροθυμία
  choice: Geduld
  rationale: Im ermahnenden Zusammenhang bezeichnet das Wort ausdauernde, beherrschte Nachsicht gegenüber anderen. „Geduld“ ist im modernen Deutsch klar und natürlich.
- source_word: συγκρύπτετε
  choice: bedeckt
  rationale: Das zusammengesetzte Verb bezeichnet ein Verbergen oder Bedecken füreinander. „Bedeckt“ hält das Bild des griechischen Ausdrucks fest und meint, Verfehlungen nicht lieblos bloßzustellen.
- source_word: ἐλαττώματα
  choice: Verfehlungen
  rationale: Der Ausdruck bezeichnet Mängel oder Fehler. „Verfehlungen“ passt zum ethischen Zusammenhang, ohne den Sinn unnötig abzuschwächen.
- source_word: ὁμονοία
  choice: Eintracht
  rationale: Das Wort bezeichnet einträchtige Gesinnung und Übereinstimmung. „Eintracht unter Brüdern“ ist würdig, verständlich und wahrt den familiären Bezug.
- source_word: προαίρεσις καρδίας
  choice: Entschluss eines guten Herzens
  rationale: Die Wendung hebt die bewusste innere Ausrichtung hervor. „Entschluss“ lässt sowohl Willensentscheidung als auch sittliche Absicht anklingen.
- source_word: εὐδοκοῦσιν εἰς ἀγαθόν
  choice: das auf das Gute bedacht ist
  rationale: Der überlieferte griechische Wortlaut ist schwierig. Die Wiedergabe bewahrt vorsichtig den erkennbaren Sinn einer inneren Ausrichtung auf das Gute, ohne eine sichere Textrekonstruktion vorzutäuschen.
- source_word: ὠνείδισα
  choice: machte ihnen keine Vorwürfe
  rationale: Das Verb bezeichnet vorwurfsvolles Beschämen oder Schmähen. Die idiomatische deutsche Wendung passt zum Versöhnungszusammenhang.
- source_word: παρεκάλεσα
  choice: sprach ihnen Mut zu
  rationale: Das Verb kann ermutigen, trösten oder ermahnen bedeuten. Hier steht Josefs beruhigender und versöhnlicher Umgang mit seinen Brüdern im Vordergrund.
- source_word: ὑπερεκπερισσοῦ
  choice: im Übermaß
  rationale: Das stark steigernde Adverb betont Josefs außergewöhnlich großzügiges Handeln. „Im Übermaß“ wahrt diese Intensität knapp und verständlich.
- source_word: θλιβῆναι
  choice: bedrängt wurden
  rationale: Das Verb umfasst Druck, Bedrängnis und Not. Die Wiedergabe bleibt breit genug für Josefs umfassende praktische Fürsorge.
- source_word: ἕως μικροῦ πράγματος
  choice: auch nur in der geringsten Sache
  rationale: Die Wendung weitet Josefs Fürsorge bis auf die kleinsten Angelegenheiten aus. Die deutsche Formulierung gibt diese umfassende Aussage idiomatisch wieder.
- source_word: δοῦλοι
  choice: Sklaven
  rationale: Das Wort bezeichnet hier eine deutlich untergeordnete Stellung. „Sklaven“ bewahrt die bewusst starke Aussage über die Demut Josefs und die Unterordnung seines Hauses.
- source_word: κοσμικήν μου δόξαν
  choice: meines weltlichen Ruhmes
  rationale: Die Wendung bezeichnet Josefs diesseitiges Ansehen und seine hohe gesellschaftliche Stellung. „Weltlicher Ruhm“ erhält den Kontrast zu seiner Demut.
theological_decisions:
- issue: Die Aufforderung, die Verfehlungen der Brüder zu bedecken
  choice: „bedeckt in Geduld gegenseitig eure Verfehlungen“
  alternative: „verbergt gegenseitig eure Fehler“ oder „seht über die Verfehlungen der anderen hinweg“
  rationale: Die Übersetzung bewahrt das Bild des Bedeckens und die Ethik geduldiger, brüderlicher Nichtbloßstellung. Sie behauptet weder, Sünde müsse geleugnet werden, noch führt sie eine spätere konfessionelle Formel ein.
- issue: Der textlich schwierige Satz über das gute Herz in Vers 3
  choice: „über den Entschluss eines guten Herzens, das auf das Gute bedacht ist“
  alternative: „über die Entscheidung eines guten Herzens, die am Guten Gefallen findet“
  rationale: Der griechische Wortlaut ist grammatisch rau und möglicherweise gestört. Die Übersetzung gibt den wahrscheinlichen ethischen Sinn wieder, kennzeichnet die Unsicherheit aber in einer Fußnote, statt eine bestimmte Rekonstruktion als sicher auszugeben.
- issue: Die Bezeichnung der Söhne Josefs als δοῦλοι
  choice: „Sklaven“
  alternative: „Diener“ oder „Knechte“
  rationale: Die bewusst starke soziale Unterordnung ist für die Demutsaussage des Abschnitts wesentlich. „Sklaven“ gibt diesen Status deutlicher wieder als das allgemeinere „Diener“, ohne daraus eine zusätzliche Lehrthese abzuleiten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, testamentarisch-ermahnendem Ton. Die kurzen Parallelreihen in Vers 7 wurden weitgehend erhalten. Ungewöhnliche Bilder wie „Ihre Seele war meine Seele“ bleiben stehen, weil sie die enge solidarische Identifikation des griechischen Textes ausdrücken. Die Fußnotenmarker wurden an die jeweils sachlich zugehörige Textstelle gesetzt.
