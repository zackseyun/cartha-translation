  source_fidelity: 'Der Entwurf gibt die zentralen Begriffe und die Bedingungsstruktur zutreffend wieder: σωφροσύνη/ἁγνεία, die Ausdauer, das Gebet mit Fasten, die Demut des Herzens sowie κατοικήσει ἐν ὑμῖν. Die Umstellung an den Satzanfang („So wird der Herr auch ...“) schwächt jedoch die ausdrückliche Vergleichs- und Anredewendung οὕτως καὶ ὑμεῖς („ebenso auch ihr“) etwas ab.'
