source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Οὕτως καὶ ὑμεῖς⁴, ⌜ἐὰν τὴν σωφροσύνην καὶ τὴν ἁγνείαν μεταδιώκητε⁵ ἐν ὑπομονῇ καὶ *προσευχῇ μετὰ νηστείας ἐν ταπεινώσει⁶ καρδίας, ὁ⁷ Κύριος κατοικήσει⁸ ἐν ὑμῖν, ὅτι ἀγαπᾷ⁹ τὴν σωφροσύνην.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/002.yaml
  text: So you also, if you pursue self-control and purity with endurance and prayer with fasting, in humility of heart, the Lord will dwell in you, because he loves self-control.
translation:
  language: de
  text: Ebenso wird der Herr in euch wohnen, wenn ihr mit Ausdauer und Gebet mit Fasten in Demut des Herzens nach Selbstbeherrschung und Reinheit strebt; denn er liebt die Selbstbeherrschung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: σωφροσύνη
  choice: Selbstbeherrschung
  rationale: Gibt hier die sittliche Selbstdisziplin wieder und bewahrt zugleich die Verbindung zwischen der Aufforderung und der abschließenden Begründung.
- source_word: ἁγνεία
  choice: Reinheit
  rationale: Entspricht dem ethisch-sexuellen Reinheitsbegriff des Kontexts, ohne ihn unnötig einzuengen.
- source_word: μεταδιώκητε
  choice: nach … strebt
  rationale: Drückt das beharrliche, zielgerichtete Verfolgen einer Tugend natürlich im Deutschen aus.
- source_word: ὑπομονή
  choice: Ausdauer
  rationale: Bezeichnet standhaftes Durchhalten und passt idiomatisch zur Aufforderung.
- source_word: ταπείνωσις καρδίας
  choice: Demut des Herzens
  rationale: Bewahrt die bildhafte und religiöse Ausdrucksweise der griechischen Wendung.
- source_word: κατοικήσει ἐν ὑμῖν
  choice: wird … in euch wohnen
  rationale: Gibt die räumliche Metapher und die Mehrzahl von ὑμῖν unmittelbar wieder.
theological_decisions:
- issue: Bedeutung von ἐν ὑμῖν
  choice: in euch
  alternative: unter euch
  rationale: Die Präposition kann je nach Kontext gemeinschaftliche oder innere Gegenwart bezeichnen. „In euch“ folgt der naheliegenden Formulierung des griechischen Textes und lässt den Plural als gemeinschaftlich oder individuell offen.
- issue: Bedingungssatz und göttliches Wohnen
  choice: Die Wenn-dann-Beziehung bleibt ausdrücklich erhalten.
  alternative: Eine abgeschwächte kausale oder rein ermahnende Formulierung
  rationale: Der Text verknüpft das Streben nach den Tugenden grammatisch mit der Verheißung; diese theologische Spannung wird nicht geglättet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstellung stellt die Verheißung klar heraus, ohne die inhaltliche Bedingungsstruktur zu verändern. Die Wiederholung von „Selbstbeherrschung“ wurde bewusst beibehalten, da sie dem griechischen Text entspricht.
