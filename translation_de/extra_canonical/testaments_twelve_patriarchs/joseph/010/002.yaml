  rationale: Die Revision stellt die einleitende Vergleichsrelation von οὕτως καὶ ὑμεῖς klarer heraus. Sie belässt die bedingte Verheißung, die Reihenfolge der Tugenden, die Gebets- und Fastenangabe sowie die Formulierung „in euch“ unverändert in ihrer sachlichen Bedeutung. Da im Entwurf keine Fußnotenanker oder Fußnoten vorhanden sind und keine Validierungsfehler gemeldet wurden, werden keine Fußnoten ergänzt.
