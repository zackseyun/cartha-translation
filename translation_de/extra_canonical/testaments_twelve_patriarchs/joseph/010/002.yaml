  terminology: „Selbstbeherrschung“, „Reinheit“, „Ausdauer“, „Demut des Herzens“ und „in euch wohnen“ sind passend. Die Wiederholung von „Selbstbeherrschung“ entspricht dem griechischen Wortlaut. „In euch“ wahrt gegenüber „unter euch“ die unmittelbare Präpositionsmetapher und deren mögliche gemeinschaftliche wie individuelle Lesart.
  issues:
