id: T12P.JOS.10.5
reference: Testament of Joseph 10:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Γινώσκουσιν¹⁹ οἱ ἀδελφοί μου²⁰ πῶς ἠγάπησέ με ὁ πατήρ μου²¹, καὶ οὐχὶ²² ὑψούμην²³ ⸀ἐν τῇ διανοίᾳ²⁴ μου⸃, καίπερ νήπιος ὑπάρχων²⁵, ⸀εἶχον τὸν *φόβον τοῦ θεοῦ²⁶ ἐν τῇ καρδίᾳ²⁷ μου⸃· ᾔδειν²⁸ γὰρ ὅτι πάντα²⁹ παρελεύσεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/005.yaml
  text: My brothers knew how my father loved me, yet I was not exalted in my mind; though I was a child, I had the fear of God in my heart, for I knew that surely all things will pass away.
translation:
  language: de
  text: Meine Brüder wissen, wie sehr mein Vater mich liebte. Doch ich überhob mich nicht in meinem Denken. Obwohl ich noch ein Kind war, trug ich die Furcht Gottes in meinem Herzen; denn ich wusste, dass alles vergehen wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Γινώσκουσιν
  choice: wissen
  rationale: Das griechische Präsens wird als gegenwärtige Berufung auf das Wissen der Brüder wiedergegeben; ein deutsches Präteritum wäre hier nicht erforderlich.
- source_word: πῶς ἠγάπησέ με
  choice: wie sehr … mich liebte
  rationale: πῶς bezeichnet hier die Art beziehungsweise das Ausmaß der väterlichen Liebe; „wie sehr“ klingt im Deutschen natürlich und trifft den Zusammenhang.
- source_word: οὐχὶ ὑψούμην ἐν τῇ διανοίᾳ μου
  choice: ich überhob mich nicht in meinem Denken
  rationale: Die Formulierung bewahrt das Bild innerer Selbsterhöhung, ohne es auf bloßen Stolz oder Hochmut zu verengen.
- source_word: καίπερ νήπιος ὑπάρχων
  choice: Obwohl ich noch ein Kind war
  rationale: νήπιος kann ein kleines oder unmündiges Kind bezeichnen; „noch ein Kind“ gibt den Alterskontrast idiomatisch wieder.
- source_word: εἶχον τὸν φόβον τοῦ θεοῦ ἐν τῇ καρδίᾳ μου
  choice: trug ich die Furcht Gottes in meinem Herzen
  rationale: „Trug … im Herzen“ ist natürliches, würdevolles Deutsch und bewahrt Herz und Gottesfurcht als zentrale Begriffe.
- source_word: πάντα παρελεύσεται
  choice: alles vergehen wird
  rationale: πάντα wird kollektiv mit „alles“ wiedergegeben; παρέρχομαι bezeichnet hier das Vorübergehen beziehungsweise Vergehen aller Dinge.
theological_decisions:
- issue: Bedeutung von „Furcht Gottes“
  choice: Furcht Gottes
  alternative: Ehrfurcht vor Gott
  rationale: Die traditionelle und quellennähere Formulierung bewahrt die mögliche Spannung zwischen Furcht und ehrfürchtiger Gottesbeziehung, statt sie interpretierend auf Ehrfurcht zu beschränken.
- issue: Umfang von πάντα
  choice: alles
  alternative: alle Dinge
  rationale: „Alles“ lässt den umfassenden Bezug des griechischen Neutrums bestehen, ohne genauer festzulegen, ob Besitz, irdische Umstände oder die gesamte vergängliche Welt gemeint sind.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem Ton. Die Satzfolge wurde leicht gegliedert, um die inneren Kontraste klar wiederzugeben; es wurden keine konfessionellen Deutungen ergänzt.
