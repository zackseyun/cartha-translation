  text: Ὁρᾶτε οὖν, τέκνα μου, πόσα κατεργάζεται¹ ἡ² ὑπομονὴ καὶ ἡ³ προσευχὴ μετὰ νηστείας.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/001.yaml
  text: See, then, my children, how much endurance and prayer with fasting accomplish.
translation:
  language: de
  text: Seht also, meine Kinder, wie viel Ausdauer und Gebet mit Fasten bewirken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁρᾶτε
  choice: Seht
  rationale: Der Imperativ fordert die Angeredeten auf, die folgende Lehre wahrzunehmen bzw. zu bedenken; „Seht“ bewahrt Bild und Aufforderungscharakter.
- source_word: τέκνα μου
  choice: meine Kinder
  rationale: Entspricht der väterlichen Anrede natürlich und unmittelbar.
- source_word: πόσα κατεργάζεται
  choice: wie viel … bewirken
  rationale: πόσα bezeichnet hier das große Ausmaß dessen, was zustande gebracht wird. Das griechische Verb steht trotz der verbundenen Größen im Singular; im Deutschen ist der Plural „bewirken“ grammatisch erforderlich.
- source_word: ἡ ὑπομονὴ
  choice: Ausdauer
  rationale: ὑπομονή meint standhaftes Ausharren unter Belastung; „Ausdauer“ ist verständlich und wahrt den aktiven Charakter besser als bloße Geduld.
- source_word: ἡ προσευχὴ μετὰ νηστείας
  choice: Gebet in Verbindung mit Fasten
  rationale: μετά kennzeichnet das Fasten als Begleitung des Gebets. Die Formulierung macht diese Zuordnung deutlich, ohne Fasten als eigenständiges drittes Subjekt auszugeben.
theological_decisions:
- issue: Zuordnung von „mit Fasten“ und gemeinsame Wirkung
  choice: „Ausdauer und Gebet in Verbindung mit Fasten“ bilden gemeinsam das Subjekt von „bewirken“.
  alternative: „wie viel Ausdauer bewirkt und Gebet mit Fasten“ oder Fasten als drittes selbstständiges Subjekt
  rationale: Die beiden Artikel koordinieren ὑπομονή und προσευχή; μετὰ νηστείας gehört unmittelbar zum Gebet. So bleibt sowohl die syntaktische Zuordnung als auch die gemeinsame Wirksamkeit beider Größen erhalten.
translation_notes:
  register: Moderne, würdige und leicht verständliche Standardsprache. Die väterliche Anrede und der mahnende Ton des griechischen Satzes bleiben erhalten.
