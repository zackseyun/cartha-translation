  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/004.yaml
  text: For it comes upon all people either in deed or in word or in mind.
translation:
  language: de
  text: Denn es kommt über alle Menschen, sei es in Tat, Wort oder Gedanken.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische Wortlaut ist an dieser Stelle unsicher; das mit „kommt über“ wiedergegebene Verb kann wörtlich auch „kommt zusammen“ bedeuten.
    reason: Das Kreuzzeichen der Edition kennzeichnet συνέρχεται als textlich oder sprachlich problematisch. Die Fußnote macht die echte Unsicherheit sichtbar, ohne den Haupttext unverständlich zu formulieren.
lexical_decisions:
- source_word: Πάντας … ἀνθρώπους
  choice: alle Menschen
  rationale: Der griechische Akkusativ bezeichnet die Gesamtheit der Betroffenen; die natürliche deutsche Entsprechung ist „alle Menschen“.
- source_word: ἐν ἔργῳ … ἐν λόγῳ … ἐν διανοίᾳ
  choice: in einer Tat, in einem Wort oder in einem Gedanken
  rationale: Die dreigliedrige Reihe wird parallel und konkret wiedergegeben. διανοίᾳ bezeichnet hier das Denken beziehungsweise den inneren Gedanken, ohne den im Englischen zeitweise ergänzten Begriff „Vorstellung“.
- source_word: συνέρχεται
  choice: es kommt über
  rationale: Bei einem unausgesprochenen Subjekt und πάντας ἀνθρώπους als Akkusativ ergibt sich kontextuell die Bedeutung, dass etwas alle Menschen trifft oder über sie kommt. Eine rein wörtliche Wiedergabe als „kommt zusammen“ wäre im Deutschen unverständlich und würde die syntaktische Beziehung verfehlen.
theological_decisions:
- issue: Unausgesprochenes Subjekt von συνέρχεται
  choice: Das neutrale Pronomen „es“ bleibt ohne ausdrückliche Identifizierung stehen.
  alternative: Das Subjekt aus dem weiteren Zusammenhang ausdrücklich benennen.
  rationale: Der vorgelegte griechische Satz nennt das Subjekt nicht. Die Übersetzung bewahrt diese Offenheit und vermeidet eine theologische oder ethische Festlegung, die allein aus diesem Vers nicht sicher begründet werden kann.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Präposition erhält den rhythmischen Dreiklang von Tat, Wort und Gedanke; „sei es“ gibt die alternative Aufzählung idiomatisch wieder.
