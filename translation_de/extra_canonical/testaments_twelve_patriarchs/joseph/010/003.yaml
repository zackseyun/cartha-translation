revisions:
- from: 'Wo aber der Höchste wohnt, da gilt: Selbst wenn jemanden Neid, Sklaverei oder Verleumdung trifft, rettet ihn der Herr, der wegen seiner Selbstbeherrschung bei ihm wohnt, nicht nur aus dem Unheil, sondern erhöht und verherrlicht ihn auch – so wie mich.'
  to: 'Wo aber der Höchste wohnt, da gilt: Selbst wenn jemanden Neid, Sklaverei oder Verleumdung trifft, rettet ihn der Herr, der wegen der Selbstbeherrschung dieses Menschen auf ihm wohnt, nicht nur aus den Übeln, sondern erhöht und verherrlicht ihn auch – wie auch mich.'
