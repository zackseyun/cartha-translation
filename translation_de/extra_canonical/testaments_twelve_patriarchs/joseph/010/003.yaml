id: T12P.JOS.10.3
reference: Testament of Joseph 10:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ὅπου δὲ κατοικεῖ ὁ ὕψιστος¹⁰, κἂν *φθόνος τις περιπέσῃ, κἂν δουλία, κἂν συκοφαντία¹¹, *ὁ Κύριος κατοικῶν ἐπ᾽ αὐτὸν¹² διὰ τὴν σωφροσύνην οὐ μόνον⁷ ἐκ τῶν κακῶν ῥύεται¹³ αὐτόν¹⁴, ⸀ἀλλὰ καὶ ὑψοῖ¹⁵ καὶ δοξάζει αὐτὸν ὡς κἀμέ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/003.yaml
  text: But where the Most High dwells, even if envy should fall upon someone, or slavery, or slander, the Lord who dwells with him, because of his self-control, not only rescues him from evils, but also exalts and glorifies him, as he did me.
translation:
  language: de
  text: 'Wo aber der Höchste wohnt, da gilt: Selbst wenn jemanden Neid, Sklaverei oder Verleumdung trifft, rettet ihn der Herr, der wegen der Selbstbeherrschung dieses Menschen auf ihm wohnt, nicht nur aus den Übeln, sondern erhöht und verherrlicht ihn auch – wie auch mich.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ ὕψιστος
  choice: der Höchste
  rationale: Die geläufige und würdevolle Wiedergabe des göttlichen Titels.
- source_word: φθόνος ... περιπέσῃ
  choice: Neid ... trifft
  rationale: περιπίπτω bezeichnet hier das Widerfahren beziehungsweise Befallenwerden; natürliches Deutsch verlangt eine Umformung.
- source_word: δουλία
  choice: Sklaverei
  rationale: Gibt den konkreten Zustand der Unfreiheit präziser wieder als das mehrdeutige „Knechtschaft“.
- source_word: συκοφαντία
  choice: Verleumdung
  rationale: Bezeichnet hier eine falsche oder böswillige Beschuldigung.
- source_word: σωφροσύνη
  choice: Selbstbeherrschung
  rationale: Im Kontext von Josephs Widerstand gegen sexuelle Versuchung bezeichnet das Wort besonnene sittliche Selbstkontrolle; die Wiedergabe vermeidet zugleich das heute enger verstandene „Keuschheit“.
- source_word: ἐκ τῶν κακῶν ῥύεται
  choice: rettet ... aus dem Unheil
  rationale: Bewahrt die Rettungsvorstellung und fasst den substantivierten Plural τὰ κακά idiomatisch als widerfahrenes Unheil.
- source_word: ὑψοῖ ... δοξάζει
  choice: erhöht und verherrlicht
  rationale: Erhält die beiden parallelen Verben und ihre theologische Aussage.
theological_decisions:
- issue: Bezug von διὰ τὴν σωφροσύνην
  choice: „der wegen seiner Selbstbeherrschung bei ihm wohnt“; die Selbstbeherrschung gehört dem Menschen, bei dem der Herr wohnt
  alternative: „wegen seiner Selbstbeherrschung rettet ihn der Herr, der bei ihm wohnt“
  rationale: Die Stellung des Ausdrucks lässt syntaktische Spielräume. Der unmittelbare Kontext und die englische Konsultationsfassung verbinden die Selbstbeherrschung mit dem Grund der göttlichen Gegenwart; die deutsche Formulierung bildet dies ab, ohne sie dem Herrn zuzuschreiben.
- issue: Bezug von ἐπ᾽ αὐτόν
  choice: „bei ihm“
  alternative: „auf ihm“ oder „über ihm“
  rationale: Das Griechische ist ungewöhnlich; „bei ihm wohnt“ gibt die beabsichtigte bleibende göttliche Gegenwart in natürlichem Deutsch wieder.
- issue: Vergleich ὡς κἀμέ
  choice: „so wie mich“
  alternative: „wie auch mich“
  rationale: Der knappe griechische Vergleich bezieht beide Verben auf Josephs eigene Erfahrung; im Deutschen ergänzt der Satz das implizite Objekt verständlich.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anfangskonstruktion „Wo aber …, da gilt“ macht den allgemeinen Grundsatz verständlich und hält den Gegensatz von δέ fest. Die Reihung „Neid, Sklaverei oder Verleumdung“ bleibt nahe am griechischen Text; der Gedankenstrich markiert den abschließenden autobiografischen Vergleich.
