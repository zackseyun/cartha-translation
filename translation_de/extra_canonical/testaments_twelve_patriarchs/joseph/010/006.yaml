    rationale: Die Präposition „zum“ erweckt im Deutschen den Eindruck einer Richtung oder Absicht („zum Zweck des Bösen“). Das griechische ἐν bezeichnet hier, soweit der verderbte bzw. unsichere Wortlaut überhaupt sicher beurteilt werden kann, keine solche Zielrichtung. Eine neutralere Formulierung ist erforderlich.
