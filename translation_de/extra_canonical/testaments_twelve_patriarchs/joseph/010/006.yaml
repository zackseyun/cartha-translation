base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/010/006.yaml
  text: And I was not puffed up in evil; rather, I honored my brothers, and because of fear of them I kept silent when I was being sold, not telling the Ishmaelites that I was a son of Jacob, a great and righteous man.
translation:
  language: de
  text: Und ich wurde nicht überheblich im Bösen[a], sondern ehrte meine Brüder. Aus Furcht vor ihnen[b] schwieg ich, als ich verkauft wurde, und sagte den Ismaelitern nicht, dass ich ein Sohn Jakobs sei, eines großen und gerechten Mannes.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut dieses Satzteils ist textkritisch unsicher und kann auch etwa bedeuten: „Ich wurde im Bösen nicht überheblich.“'
    reason: Die Edition kennzeichnet οὐκ ἐπήρθην ἐν κακῷ als verderbten oder unsicheren Text; die ungewöhnliche Wendung erlaubt mehrere Nuancierungen.
  - marker: b
    text: 'Oder: „wegen ihrer Furcht“. Der griechische Ausdruck lässt formal beide Bezüge zu.'
    reason: Der Genitiv αὐτῶν bei φόβος ist grammatisch mehrdeutig, auch wenn „Furcht vor ihnen“ im Kontext wahrscheinlicher ist.
lexical_decisions:
- source_word: οὐκ ἐπήρθην ἐν κακῷ
  choice: ich überhob mich nicht zum Bösen
  rationale: ἐπαίρω kann hier ein Sich-Erheben bzw. Sich-Überheben bezeichnen. Die etwas ungewöhnliche Verbindung mit ἐν κακῷ bleibt im Deutschen erkennbar, ohne sie vorschnell als bloßen Stolz oder als konkretes böses Handeln festzulegen.
- source_word: ἐτίμουν
  choice: ehrte
  rationale: Gibt den fortdauernden bzw. charakteristischen Sinn des Imperfekts und die Grundbedeutung von τιμάω knapp wieder.
- source_word: διὰ τὸν φόβον αὐτῶν
  choice: aus Furcht vor ihnen
  rationale: Der Genitiv kann formal unterschiedlich bezogen werden; im Zusammenhang ist die Furcht Josefs vor seinen Brüdern die naheliegende Lesart.
- source_word: ἐσιώπουν πιπρασκόμενος
  choice: schwieg ich, als ich verkauft wurde
  rationale: Bewahrt den passiven, gleichzeitig ablaufenden Sinn des Partizips πιπρασκόμενος in natürlichem Deutsch.
- source_word: εἰπεῖν τοῖς Ἰσμαϊλίταις
  choice: sagte den Ismaelitern nicht
  rationale: Der Infinitiv hängt sinngemäß vom Schweigen ab. Eine finite deutsche Formulierung macht den Zusammenhang verständlich, ohne eine zusätzliche Zweckbeziehung einzutragen.
- source_word: ἀνδρὸς μεγάλου καὶ δικαίου
  choice: eines großen und gerechten Mannes
  rationale: μέγας bezeichnet Größe bzw. Bedeutung; δίκαιος bedeutet hier eindeutig „gerecht“, nicht „mächtig“.
theological_decisions:
- issue: Bedeutung von οὐκ ἐπήρθην ἐν κακῷ
  choice: „ich überhob mich nicht zum Bösen“
  alternative: „ich wurde im Bösen nicht überheblich“ / „ich ließ mich nicht zum Bösen hinreißen“
  rationale: Die gewählte Fassung hält sowohl das Motiv des Sich-Erhebens als auch die Beziehung zum Bösen offen und vermeidet eine dogmatische oder psychologische Präzisierung, die der schwierige griechische Wortlaut nicht erzwingt.
- issue: Bezug von αὐτῶν bei φόβος
  choice: Josefs Furcht vor seinen Brüdern
  alternative: die Furcht seiner Brüder
  rationale: Der unmittelbare Handlungszusammenhang – Josef verschweigt aus Angst seine Herkunft – stützt den objektiven Genitiv. Wegen der formalen Mehrdeutigkeit wird die Alternative in einer Fußnote genannt.
translation_notes:
  register: Moderne, würdige Standardsprache. „Überhob mich“ bewahrt den gehobenen ethischen Ton und die Bildlichkeit des griechischen Verbs; Satzbau und Zeichensetzung wurden für heutige Leser geglättet. Die im überlieferten Text auffällige Wiederholung von ἐσιώπουν wird nicht mechanisch verdoppelt, sondern als ein zusammenhängendes Schweigen wiedergegeben.
