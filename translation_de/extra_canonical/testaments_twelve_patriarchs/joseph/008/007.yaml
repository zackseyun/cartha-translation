  text: '*Οὐκ ἔγνω δὲ αὐτὴ⁴⁵ ὅτι διὰ τὸν⁴⁶ Κύριόν⁴⁷ μου εἶπον οὕτως ἐγώ⁴⁸, καὶ οὐχὶ⁴⁹ δι᾽ αὐτήν.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/007.yaml
  text: But she did not know that I spoke thus because of my Lord, and not because of her.
translation:
  language: de
  text: Doch sie wusste nicht, dass ich so um meines Herrn willen sprach und nicht ihretwegen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: διὰ τὸν Κύριόν μου
  choice: um meines Herrn willen
  rationale: Gibt den kausalen Beweggrund idiomatisch wieder und bewahrt den persönlichen Bezug durch „meines Herrn“.
- source_word: εἶπον οὕτως
  choice: so sprach
  rationale: Entspricht dem rückblickenden griechischen Aorist und klingt im erzählenden Zusammenhang natürlich.
- source_word: οὐχὶ δι᾽ αὐτήν
  choice: nicht ihretwegen
  rationale: Bewahrt die parallele Gegenüberstellung der beiden mit διά bezeichneten Beweggründe.
theological_decisions:
- issue: Bezug von Κύριόν μου
  choice: „meines Herrn“ mit großgeschriebenem „Herrn“
  alternative: „meines Herrn“ als rein menschliche Anrede oder „des Herrn“
  rationale: Das Possessivpronomen μου wird ausdrücklich bewahrt; die Großschreibung folgt dem im Ausgangstext markierten Gottesbezug, ohne ihn durch eine präzisere Benennung weiter auszudeuten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe adversative Struktur und die Gegenüberstellung der Beweggründe bleiben erhalten.
