revisions:
- from: 5 Als ich in Fesseln lag, wurde die Ägypterin von Kummer verzehrt. Sie kam und lauschte mir zu, wie ich dem Herrn dankte und im Haus der Finsternis Loblieder sang. Mit froher Stimme pries ich voller Freude meinen Gott, weil ich durch einen Vorwand von der Ägypterin befreit worden war.[a]
  to: 5 Als ich in Ketten war, wurde die Ägypterin vom Kummer bedrängt. Als sie kam, hörte sie mir zu, wie ich dem Herrn dankte, im Haus der Finsternis Loblieder sang und mit froher Stimme jubelte, indem ich meinen Gott pries, weil ich durch einen Vorwand von der Ägypterin befreit worden war.[a]
