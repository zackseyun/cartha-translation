base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/005.yaml
  text: And while I was in chains, the Egyptian woman was held together by grief; and when she came, she would listen in on me, how I gave thanks to the Lord and sang hymns in the house of darkness, and rejoiced with a cheerful voice, glorifying my God, because by a pretext I had been delivered from the Egyptian woman.
translation:
  language: de
  text: 5 Als ich in Ketten war, wurde die Ägypterin vom Kummer bedrängt. Als sie kam, hörte sie mir zu, wie ich dem Herrn dankte, im Haus der Finsternis Loblieder sang und mit froher Stimme jubelte, indem ich meinen Gott pries, weil ich durch einen Vorwand von der Ägypterin befreit worden war.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „weil ich aufgrund eines Vorwands von der Ägypterin losgekommen war“.'
    reason: Die Wendung διὰ προφάσεως und das Verb ἀπαλλάσσω lassen im Deutschen mehrere eng verwandte Wiedergaben zu; die Fußnote bewahrt die kausale und lexikalische Mehrdeutigkeit.
lexical_decisions:
- source_word: συνείχετο ἀπὸ τῆς λύπης
  choice: wurde von Kummer verzehrt
  rationale: συνέχω bezeichnet hier ein starkes Ergriffen- oder Bedrängtsein; die natürliche deutsche Wendung gibt die Intensität wieder, ohne das im Deutschen missverständliche Bild „zusammengehalten“ zu übernehmen.
- source_word: ἐπηκροᾶτό μου
  choice: lauschte mir zu
  rationale: Das Verb bezeichnet aufmerksames, möglicherweise heimliches Zuhören. „Lauschte mir zu“ bewahrt diese Nuance, ohne Heimlichkeit zwingend festzulegen.
- source_word: ἐν οἴκῳ τοῦ σκότους
  choice: im Haus der Finsternis
  rationale: Die bildhafte Bezeichnung wird formal bewahrt; aus dem Zusammenhang ist das Gefängnis gemeint, doch der griechische Ausdruck wird nicht eingeebnet.
- source_word: ἐν ἱλαρᾷ φωνῇ
  choice: mit froher Stimme
  rationale: ἱλαρός bezeichnet eine heitere, freudige Haltung; „froh“ ist im modernen Deutsch natürlich und würdig.
- source_word: διὰ προφάσεως
  choice: durch einen Vorwand
  rationale: 'Die kausale Wendung bleibt bewusst mehrdeutig: Der Vorwand beziehungsweise vorgeschobene Grund führte paradoxerweise zu Josephs Befreiung von der Frau.'
- source_word: ἀπηλλάγην
  choice: befreit worden war
  rationale: Das Passiv bezeichnet Loskommen oder Befreiung von jemandem; „befreit“ passt zum dankbaren theologischen Zusammenhang, ohne den Handelnden ausdrücklich zu benennen.
theological_decisions:
- issue: Nicht genannter Urheber der Befreiung
  choice: Passivform „befreit worden war“ beibehalten
  alternative: „weil Gott mich … befreit hatte“
  rationale: Der Zusammenhang legt Gottes Wirken nahe, doch der griechische Satz nennt Gott an dieser Stelle nicht ausdrücklich als Handelnden.
- issue: Paradoxe Rolle des Vorwands
  choice: „durch einen Vorwand“
  alternative: „unter einem Vorwand“ oder „aufgrund einer falschen Anschuldigung“
  rationale: Die Formulierung bewahrt die Spannung des Ausgangstextes und legt weder eindeutig den Urheber noch den genauen Inhalt des Vorwands fest.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die poetischen Bilder „Haus der Finsternis“ und „mit froher Stimme“ bleiben erhalten; unnötige konfessionelle oder auslegende Zusätze werden vermieden.
