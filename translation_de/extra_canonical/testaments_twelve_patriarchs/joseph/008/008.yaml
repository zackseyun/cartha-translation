id: T12P.JOS.8.8
reference: Testament of Joseph 8:8
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἐὰν γάρ τις *ὑποπέσῃ πάθει⁵⁰ ἐπιθυμίας⁵¹ καὶ *δουλωθῇ αὐτῷ⁵² ὡς κἀκείνη, κἂν ἀγαθόν⁵³ τι ἀκούσῃ⁵⁴ εἰς *ἐκεῖνο τὸ⁵⁵ πάθος⁵⁶ *ἐκλαμβάνει αὐτὸ⁵⁷ πρὸς *τὴν πονηρὰν ἐπιθυμίαν⁵⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/008.yaml
  text: For if anyone falls under the passion of desire and is enslaved to it, as she also was, even if he hears something good, he takes it in relation to that passion, toward his evil desire.
translation:
  language: de
  text: Denn wenn jemand der Leidenschaft der Begierde verfällt und ihr versklavt wird, wie auch sie, dann bezieht er sogar etwas Gutes, das er hört, auf jene Leidenschaft und deutet es im Sinne seiner bösen Begierde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑποπέσῃ πάθει ἐπιθυμίας
  choice: der Leidenschaft der Begierde verfällt
  rationale: Gibt das Bild des Unterliegens gegenüber einem beherrschenden Verlangen natürlich und zugleich eng am Griechischen wieder.
- source_word: δουλωθῇ αὐτῷ
  choice: ihr versklavt wird
  rationale: Bewahrt die starke Sklavereimetaphorik des Verbs δουλόω und bezieht das Pronomen sinngemäß auf die Leidenschaft beziehungsweise Begierde.
- source_word: ἀγαθόν τι ἀκούσῃ
  choice: etwas Gutes, das er hört
  rationale: Folgt der offenen Formulierung des Originals, ohne festzulegen, ob eine gute Aussage, Nachricht oder Ermahnung gemeint ist.
- source_word: εἰς ἐκεῖνο τὸ πάθος ἐκλαμβάνει αὐτό
  choice: bezieht er ... auf jene Leidenschaft
  rationale: ἐκλαμβάνει kann hier das Auffassen oder Auslegen in einer bestimmten Beziehung bezeichnen; „bezieht ... auf“ erhält diese semantische Offenheit.
- source_word: πρὸς τὴν πονηρὰν ἐπιθυμίαν
  choice: deutet es im Sinne seiner bösen Begierde
  rationale: Macht die Zielrichtung der verdorbenen Auslegung im Deutschen verständlich; das Possessivpronomen entspricht dem sachlichen Bezug im Kontext.
theological_decisions:
- issue: Verhältnis von πάθος und ἐπιθυμία
  choice: „Leidenschaft der Begierde“ und anschließend „jene Leidenschaft“ beziehungsweise „böse Begierde“
  alternative: Beide Ausdrücke einheitlich als „Lust“ oder „Verlangen“ wiederzugeben
  rationale: Das Griechische unterscheidet zwischen dem beherrschenden Affekt πάθος und der begehrenden Regung ἐπιθυμία. Die Übersetzung bewahrt diese Spannung, ohne daraus eine spezielle Lehre über Sünde oder Sexualität abzuleiten.
- issue: Art des Guten, das gehört wird
  choice: „etwas Gutes“ bleibt unbestimmt
  alternative: „ein gutes Wort“ oder „eine gute Ermahnung“
  rationale: Der Ausgangstext lässt den Gegenstand bewusst offen; eine Präzisierung wäre interpretierend.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die starke Versklavungsmetapher bleibt erhalten; der etwas dichte Gedankengang des Originals wird durch „deutet es im Sinne“ verständlich entfaltet, ohne seine moralisch-psychologische Aussage konfessionell zuzuspitzen.
