  source_fidelity: 'Die Wiedergabe von κρατήσασα τοῦτον als „ergriff diesen“ bewahrt die im griechischen Text bestehende, im Einzelvers nicht auflösbare maskuline Referenz. φυλακή und εἱρκτή sind angemessen als „Gefängnis“ bzw. „Kerker“ unterschieden. Die deutsche Fassung muss jedoch bei μαστιγώσας das aktive Handeln des Ehemanns ausdrücken: Das griechische Aktivpartizip besagt, dass er Joseph auspeitschte, nicht lediglich veranlasste, dass dies geschah.'
  naturalness: Der Erzählstil ist klares modernes Standarddeutsch. „Ergriff diesen“ ist ohne Kontext ungewohnt, aber als absichtlich wörtliche Bewahrung einer echten Referenzmehrdeutigkeit mit Fußnote vertretbar. Die überarbeitete Satzfügung stellt die zeitliche Abfolge natürlich dar.
  terminology: „Verleumdete“, „Gefängnis“, „auspeitschte“ und „Kerker des Pharaos“ sind registergerecht und quellennah. „Auspeitschte“ entspricht μαστιγώσας genauer als die kausative Formulierung „ließ ... auspeitschen“.
