base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/004.yaml
  text: But she, having seized this while I was naked, slandered me; and when her husband came, he threw me into prison in his house, and on the next day, after flogging me, he sent me into Pharaoh’s dungeon.
translation:
  language: de
  text: Sie aber ergriff diesen[a] und verleumdete mich; als ihr Mann kam, warf er mich in das Gefängnis in seinem Haus, und am nächsten Tag peitschte er mich aus und schickte mich in den Kerker des Pharaos.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „diesen“. Worauf sich das männliche Pronomen bezieht, ist im erhaltenen griechischen Wortlaut dieses Verses nicht eindeutig.'
    reason: Die echte referenzielle Mehrdeutigkeit von τοῦτον soll nicht durch eine unbelegte Ergänzung aufgelöst werden.
lexical_decisions:
- source_word: κρατήσασα τοῦτον
  choice: ergriff diesen
  rationale: Das maskuline Demonstrativpronomen τοῦτον wird formal bewahrt. Sein Bezug ist im vorliegenden Vers ohne weiteren Kontext nicht eindeutig; deshalb wird kein Gegenstand ergänzt.
- source_word: ἐσυκοφάντησέ με
  choice: verleumdete mich
  rationale: Gibt die falsche Beschuldigung natürlich und präzise wieder.
- source_word: ἔβαλέ με εἰς φυλακήν
  choice: warf er mich in das Gefängnis
  rationale: Bewahrt die energische Ausdrucksweise von ἔβαλε und den allgemeinen Haftbegriff φυλακή.
- source_word: μαστιγώσας
  choice: ließ er mich auspeitschen
  rationale: Das Partizip bezeichnet eine körperliche Züchtigung durch Schläge; die kausative Formulierung ist im Deutschen natürlich und lässt offen, ob der Mann selbst schlug oder schlagen ließ.
- source_word: τὴν τοῦ Φαραὼ εἱρκτήν
  choice: den Kerker des Pharaos
  rationale: εἱρκτή bezeichnet einen Haftort; „Kerker“ unterscheidet ihn stilistisch von der zuvor genannten φυλακή und entspricht dem strengeren Klang.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe Erzählweise und die Abfolge der Handlungen bleiben erhalten; die im Englischen ergänzte Wendung „während ich nackt war“ steht nicht ausdrücklich im hier vorgelegten griechischen Text und wurde daher nicht in den Haupttext aufgenommen.
