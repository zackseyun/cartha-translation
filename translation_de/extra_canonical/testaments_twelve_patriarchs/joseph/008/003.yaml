id: T12P.JOS.8.3
reference: Testament of Joseph 8:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ὡς ⌜οὖν⌉¹⁴ εἶδον¹⁵ ὅτι μαινομένη¹⁶ κρατεῖ μου τὸν χιτῶνα, καταλείψας αὐτὸν [καὶ ἐκτιναξάμενος] ἔφυγον γυμνός¹⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/003.yaml
  text: Therefore, when I saw that she, in her frenzy, was seizing my tunic, leaving it [and shaking it off], I fled naked.
translation:
  language: de
  text: Als ich nun sah, dass sie in ihrer Raserei mein Untergewand festhielt, ließ ich es zurück [und schüttelte es ab] und floh nackt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὡς οὖν
  choice: Als … nun
  rationale: Gibt den zeitlich-folgernden Anschluss im Deutschen natürlich wieder, ohne ein stärkeres Kausalverhältnis festzulegen.
- source_word: μαινομένη
  choice: in ihrem Wahn
  rationale: Bewahrt die starke Aussage über ihren rasenden bzw. außer sich geratenen Zustand und vermeidet eine bloß emotionale Abschwächung.
- source_word: κρατεῖ
  choice: festhielt
  rationale: Bezeichnet hier das feste Ergreifen und Halten des Kleidungsstücks; der erzählerische Kontext legt im Deutschen das Präteritum nahe.
- source_word: χιτῶνα
  choice: Untergewand
  rationale: Ein χιτών ist das unmittelbar am Körper getragene Gewand; „Untergewand“ ist verständlicher und sachlich genauer als das moderne „Tunika“.
- source_word: καταλείψας αὐτόν
  choice: ließ ich es zurück
  rationale: Gibt das Zurücklassen des von ihr festgehaltenen Gewands idiomatisch und deutlich wieder.
- source_word: '[καὶ ἐκτιναξάμενος]'
  choice: '[und schüttelte es ab]'
  rationale: Die editorisch unsichere, eingeklammerte Wendung bleibt sichtbar gekennzeichnet; „abschütteln“ bildet die mögliche reflexive Loslösungsbewegung knapp ab.
- source_word: ἔφυγον γυμνός
  choice: floh nackt
  rationale: Entspricht der schlichten und pointierten Aussage des Griechischen, ohne „nackt“ zu „halb bekleidet“ abzuschwächen.
theological_decisions:
- issue: Grad der Nacktheit bei γυμνός
  choice: nackt
  alternative: nur leicht bekleidet / ohne Obergewand
  rationale: Der griechische Text sagt ausdrücklich γυμνός. Eine kontextuelle Abschwächung würde eine nicht im Wortlaut ausgedrückte Deutung festschreiben.
- issue: Textkritisch markierte Wendung καὶ ἐκτιναξάμενος
  choice: im Haupttext in eckigen Klammern beibehalten
  alternative: auslassen oder nur in einer Fußnote nennen
  rationale: Die Vorlage kennzeichnet die Worte als unsicher, enthält sie aber. Eckige Klammern bewahren sowohl ihren Wortlaut als auch ihren textkritischen Status.
translation_notes:
  register: Moderne, würdige Erzählsprache. Die Satzstellung folgt natürlichem Standarddeutsch und wahrt zugleich den knappen, dramatischen Ablauf des griechischen Textes. Eckige Klammern sind Teil der textkritischen Darstellung und keine Fußnotenmarker.
