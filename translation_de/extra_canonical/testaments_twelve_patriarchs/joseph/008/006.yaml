base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/006.yaml
  text: 'And she said to me, “See then, you love me. Let this be enough for me: only take thought for my life and for my children, and I have hope that I shall also obtain my desire.”'
translation:
  language: de
  text: 'Und sie sagt zu mir: »Sieh, nun liebst du mich. Das soll mir genügen. Sorge nur für mein Leben und für meine Kinder; dann hoffe ich, auch die Erfüllung meines Verlangens zu erlangen.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λέγει
  choice: sie sagt
  rationale: Das griechische Verb steht im historischen Präsens und bezeichnet das Geschlecht des Subjekts nicht; die Sprecherin ergibt sich aus dem Erzählzusammenhang.
- source_word: Ἰδοὺ οὖν
  choice: Sieh, nun
  rationale: Gibt sowohl den auffordernden Charakter von ἰδού als auch die folgernde beziehungsweise fortführende Nuance von οὖν knapp wieder.
- source_word: ἀγαπᾷς με
  choice: liebst du mich
  rationale: Direkte und natürliche Wiedergabe ohne Abschwächung des Liebesanspruchs.
- source_word: τοῦτό μοι ἀρκεῖτω
  choice: Das soll mir genügen
  rationale: Der deutsche Jussiv entspricht dem Imperativ der dritten Person ἀρκεῖτω.
- source_word: ἀντιποιῆσαι τῆς ζωῆς μου καὶ τῶν τέκνων μου
  choice: Kümmere dich nur um mein Leben und um das meiner Kinder
  rationale: ἀντιποιεῖσθαι mit Genitiv bezeichnet hier das tätige Eintreten für beziehungsweise die Sorge um Leben und Kinder; die Formulierung bleibt im Deutschen natürlich und vermeidet die stärkere Festlegung auf bloßen Schutz.
- source_word: ἔχω προσδοκίαν
  choice: ich hoffe
  rationale: Idiomatiche deutsche Wiedergabe von »ich habe Hoffnung/Erwartung«.
- source_word: ἀπολαῦσαι καὶ τῆς ἐπιθυμίας μου
  choice: dass auch mein Verlangen erfüllt wird
  rationale: ἀπολαύειν mit Genitiv meint, in den Genuss einer Sache zu gelangen; bei ἐπιθυμία ist die passive deutsche Wendung verständlich und bewahrt, dass die Sprecherin die Erfüllung ihres Begehrens erwartet.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter, gut verständlicher Rede. Das historische Präsens des griechischen Textes wurde beibehalten. Die manipulative Spannung zwischen vorgeblicher Genügsamkeit und fortbestehender Erwartung bleibt durch das abschließende »und ich hoffe« sichtbar.
