  text: Τέλος¹¹ βίᾳ ἐπελαμβάνετό¹² μου τῶν ἱματίων, μετὰ βίας ἐφελκομένη με εἰς συνουσίαν¹³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/002.yaml
  text: At last, by force, she seized my garments, violently dragging me toward intercourse.
translation:
  language: de
  text: Schließlich packte sie mit Gewalt meine Kleider und zerrte mich gewaltsam zum Geschlechtsverkehr.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τέλος
  choice: Schließlich
  rationale: Gibt den abschließenden Höhepunkt der geschilderten Handlung natürlich und präzise wieder.
- source_word: βίᾳ / μετὰ βίας
  choice: mit Gewalt / gewaltsam
  rationale: Bewahrt die im Griechischen wiederholte Betonung des körperlichen Zwangs, ohne sie stilistisch einzuebnen.
- source_word: ἐπελαμβάνετό μου τῶν ἱματίων
  choice: packte sie … meine Kleider
  rationale: Gibt den gewaltsamen Zugriff auf Josephs Kleidung idiomatisch wieder; der durative Aspekt des Imperfekts ist im Deutschen aus dem Handlungszusammenhang ersichtlich.
- source_word: ἐφελκομένη με
  choice: zerrte mich
  rationale: Drückt das kräftige Ziehen gegen den Willen Josephs treffend aus.
- source_word: εἰς συνουσίαν
  choice: zum Geschlechtsverkehr
  rationale: Benannt wird das Ziel der erzwungenen Handlung sachlich, eindeutig und ohne beschönigende Umschreibung.
theological_decisions:
- issue: Darstellung des sexuellen Zwangs
  choice: Die Gewalt wird ausdrücklich und ohne Abschwächung wiedergegeben.
  alternative: Eine verhüllende Formulierung wie „zum Beischlaf“ oder „mit ihr zu schlafen“.
  rationale: Die doppelte Gewaltterminologie des griechischen Textes stellt den körperlichen Zwang in den Vordergrund; eine beschönigende Wiedergabe würde diesen Akzent abschwächen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „mit Gewalt … gewaltsam“ ist bewusst beibehalten, weil auch der griechische Text den Zwang zweimal ausdrücklich hervorhebt.
