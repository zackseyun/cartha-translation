id: T12P.JOS.8.1
reference: Testament of Joseph 8:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Λέγω οὖν¹, τέκνα μου², ὅτι ὥρα *ἦν ὡσεὶ³ ἕκτη ὅτε³ ἐξῆλθεν ἀπ᾽ ἐμοῦ⁴. *Καὶ κλίνας γόνυ⁵ πρὸς Κύριον ὅλην τὴν ἡμέραν καὶ ὅλην τὴν νύκτα⁶, πρὸς⁷ ὄρθρον ἀνέστην, δακρύων⁸ καὶ αἰτῶν⁹ λύτρωσιν *ἐξ αὐτῆς¹⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/008/001.yaml
  text: So I say to you, my children, that it was about the sixth hour when she left me. And after bending my knee to the Lord all day and all night, toward dawn I rose, weeping and asking for deliverance from her.
translation:
  language: de
  text: '1 Darum sage ich euch, meine Kinder: Es war etwa um die sechste Stunde, als sie mich verließ. Nachdem ich den ganzen Tag und die ganze Nacht vor dem Herrn die Knie gebeugt hatte, stand ich gegen Morgen auf, weinte und bat darum, von ihr befreit zu werden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Λέγω οὖν
  choice: Darum sage ich euch
  rationale: οὖν wird folgernd mit „darum“ wiedergegeben; das im Deutschen für die Anrede erforderliche Objekt „euch“ ist aus „meine Kinder“ eindeutig erschließbar.
- source_word: ὥρα ἦν ὡσεὶ ἕκτη
  choice: Es war etwa um die sechste Stunde
  rationale: Bewahrt die antike Stundenangabe, ohne sie spekulativ in eine moderne Uhrzeit umzurechnen; ὡσεὶ wird mit „etwa“ ausgedrückt.
- source_word: ἐξῆλθεν ἀπ᾽ ἐμοῦ
  choice: sie mich verließ
  rationale: Natürliches Deutsch für das wörtliche „sie ging von mir fort“ im erzählerischen Zusammenhang.
- source_word: κλίνας γόνυ πρὸς Κύριον
  choice: vor dem Herrn die Knie gebeugt hatte
  rationale: Die singularische Wendung „das Knie beugen“ bezeichnet Gebetshaltung; der deutsche Plural klingt idiomatischer. πρὸς wird relational als „vor“ wiedergegeben.
- source_word: πρὸς ὄρθρον
  choice: gegen Morgen
  rationale: Gibt die zeitliche Annäherung an die Morgendämmerung natürlich und präzise wieder.
- source_word: αἰτῶν λύτρωσιν ἐξ αὐτῆς
  choice: bat darum, von ihr befreit zu werden
  rationale: Drückt die erbetene λύτρωσις idiomatisch aus und erhält mit „von ihr“ den weiblichen Bezug des griechischen Pronomens.
theological_decisions:
- issue: Adressat des Gebets
  choice: vor dem Herrn
  alternative: zum Herrn hin
  rationale: „Vor dem Herrn“ vermittelt Gebet und Niederknien, ohne über die Identität oder einen besonderen theologischen Titel des Herrn hinauszugehen.
- issue: Bedeutung von λύτρωσις
  choice: befreit zu werden
  alternative: Erlösung
  rationale: „Befreiung“ passt zum unmittelbaren persönlichen Bedrängniszusammenhang und vermeidet, dem Wort hier ungefragt eine umfassende soteriologische Bedeutung aufzuerlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der antike Ausdruck „sechste Stunde“ bleibt zur Wahrung des historischen Horizonts erhalten. Die lange Partizipialkonstruktion wird als temporaler Nebensatz wiedergegeben, damit die zeitliche Abfolge im Deutschen klar und flüssig ist.
