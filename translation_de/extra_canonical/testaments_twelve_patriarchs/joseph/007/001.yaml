revisions:
- from: 'Damit du aber erkennst, dass die Bosheit der Gottlosen diejenigen nicht überwältigen wird, die Gott in Selbstbeherrschung verehren: Sieh, ich nehme etwas davon und esse es vor deinen Augen.[a] Nachdem ich dies gesagt hatte, sprach ich: »Der Gott meiner Väter und der Engel Abrahams werden bei mir sein.« Und ich aß.'
  to: 'Damit du aber erkennst, dass die Bosheit der Gottlosen diejenigen nicht überwältigen wird, die Gott in Selbstbeherrschung verehren: Sieh, indem ich etwas davon nehme und vor deinen Augen esse.[a] Nachdem ich dies gesagt hatte, sprach ich: »Der Gott meiner Väter und der Engel Abrahams werden bei mir sein.« Und ich aß.'
  rationale: Die Revision beschränkt sich auf die schwierige Partizipialkonstruktion. Sie gibt die beiden griechischen Partizipien als gleichgeordnete Umstandsangaben wieder, statt eine futurische Handlung und das Objekt „es“ festzuschreiben. Alle übrigen Formulierungen, einschließlich der theologischen Nebeneinanderstellung von Gott und dem Engel Abrahams, bleiben erhalten.
