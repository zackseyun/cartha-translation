source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*Ἵνα δὲ⁴⁵ μάθῃς⁴⁶, ὅτι⁴⁷ τῶν⁴⁸ ἐν σωφροσύνῃ θεοσεβούντων⁴⁹ οὐ κατισχύσει⁵⁰ κακία⁵¹ *τῶν ἀσεβούντων⁵². ⌈Ἰδοὺ⌉⁵³ λαβὼν⁵⁴ *ἐξ αὐτοῦ ἐνώπιόν σου ἐσθίων. Καὶ τοῦτο εἰπὼν εἶπον οὕτως⁵⁵. Ὁ Θεὸς τῶν πατέρων μου καὶ ὁ ἄγγελος Ἀβραὰμ⁵⁶ *ἔσται μετ᾽ ἐμοῦ⁵⁷. ⌈Ἔφαγον⌉⁵⁸.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/001.yaml
  text: 'So that you may learn that the wickedness of the ungodly will not prevail over those who fear God with self-control, look: taking some of it in your presence, I will eat. And after saying this, I said thus, “The God of my fathers and the angel of Abraham will be with me.” And I ate.'
translation:
  language: de
  text: 'Damit du aber erkennst, dass die Bosheit der Gottlosen diejenigen nicht überwältigen wird, die Gott in Selbstbeherrschung verehren: Sieh, indem ich etwas davon nehme und vor deinen Augen esse.[a] Nachdem ich dies gesagt hatte, sprach ich: »Der Gott meiner Väter und der Engel Abrahams werden bei mir sein.« Und ich aß.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut ist knapp und syntaktisch ungewöhnlich: „Sieh, nehmend etwas davon, vor dir essend.“ Das genaue Zeit- und Aspektverhältnis der Partizipien bleibt unsicher.'
    reason: Die Fußnote kennzeichnet die elliptische, textlich schwierige Partizipialkonstruktion, ohne eine bestimmte zeitliche Abfolge oder ein nicht ausdrücklich genanntes Objekt festzulegen.
lexical_decisions:
- source_word: σωφροσύνῃ
  choice: in Selbstbeherrschung
  rationale: Der Ausdruck bezeichnet besonnenes, sittlich beherrschtes Verhalten und kann im Kontext besonders sexuelle Enthaltsamkeit beziehungsweise Keuschheit einschließen. „Selbstbeherrschung“ wahrt den weiteren Bedeutungsumfang.
- source_word: θεοσεβούντων
  choice: die Gott … verehren
  rationale: Das Partizip bezeichnet Menschen, die Gott ehrfürchtig verehren; die verbale Wiedergabe bleibt nah am griechischen Ausdruck.
- source_word: οὐ κατισχύσει
  choice: wird … nicht überwältigen
  rationale: κατισχύω bezeichnet das Erlangen der Oberhand beziehungsweise ein siegreiches Überwältigen.
- source_word: ἐνώπιόν σου
  choice: vor deinen Augen
  rationale: Natürliche deutsche Wiedergabe der ausdrücklichen Gegenwart der angesprochenen Person.
- source_word: ἔσται μετ᾽ ἐμοῦ
  choice: werden bei mir sein
  rationale: Das griechische Prädikat steht im Singular, obwohl ein zusammengesetztes Subjekt vorausgeht; idiomatisches Deutsch verlangt hier den Plural.
theological_decisions:
- issue: Bezeichnung „der Engel Abrahams“ neben „der Gott meiner Väter“
  choice: Die beiden Bezeichnungen werden unverändert nebeneinandergestellt.
  alternative: Den Engel als Engel des Gottes Abrahams erklären oder beide Bezeichnungen miteinander identifizieren.
  rationale: Der griechische Text nennt ausdrücklich sowohl Gott als auch den Engel und erläutert ihr Verhältnis nicht; die Übersetzung bewahrt diese theologische Spannung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anrede bleibt entsprechend dem griechischen Singular bei „du“. „Selbstbeherrschung“ ist bewusst weiter als „Keuschheit“, ohne die im Joseph-Kontext naheliegende sexuelle Bedeutung auszuschließen.
