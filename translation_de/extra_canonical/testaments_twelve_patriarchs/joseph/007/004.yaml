source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἰδὼν δὲ αὐτὴν ὁ *ἀνὴρ αὐτῆς⁴ λέγει⁶ πρὸς αὐτήν⁷· Τί συνέπεσε τὸ πρόσωπόν σου; ⌜πρὸς αὐτὸν⌝⁷ εἶπεν, ⌜ὅτι⌝⁷ *πόνον καρδίας ἐγὼ ἀλγῶ, καὶ οἱ τοῦ πνεύματος στεναγμοὶ συνέχουσί με⁸. *Ὁ δὲ⁹ ἐθεράπευσεν¹⁰ αὐτὴν *ἐν λόγοις¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/004.yaml
  text: And when her husband saw her, he said to her, “What has happened to your face?” She said to him, “I am in pain with anguish of heart, and the groanings of my spirit hold me fast.” And he healed her with words.
translation:
  language: de
  text: 'Als ihr Mann sie sah, sagte er zu ihr: »Was ist mit deinem Gesicht geschehen?« Sie antwortete ihm: »Ich leide Qualen im Herzen, und die Seufzer meines Geistes halten mich gefangen.« Da heilte er sie mit Worten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τί συνέπεσε τὸ πρόσωπόν σου;
  choice: Was ist mit deinem Gesicht geschehen?
  rationale: Die natürliche deutsche Frage gibt die ungewöhnliche griechische Wendung wieder, ohne vorschnell eine bestimmte körperliche Veränderung wie ein eingefallenes oder niedergeschlagenes Gesicht festzulegen.
- source_word: πόνον καρδίας ἐγὼ ἀλγῶ
  choice: Ich leide Qualen im Herzen
  rationale: Die Formulierung bewahrt sowohl den Schmerzbegriff als auch den inneren, emotionalen Sitz des Leidens und klingt im heutigen Deutsch würdig und verständlich.
- source_word: οἱ τοῦ πνεύματος στεναγμοὶ συνέχουσί με
  choice: die Seufzer meines Geistes halten mich gefangen
  rationale: „Seufzer“ entspricht στεναγμοί, während „halten mich gefangen“ die bedrängende, festhaltende Kraft von συνέχω ausdrückt. Das Possessivpronomen ergibt sich aus der Ich-Rede und vermeidet hier eine unbeabsichtigte Festlegung auf den Heiligen Geist.
- source_word: ἐθεράπευσεν αὐτὴν ἐν λόγοις
  choice: heilte er sie mit Worten
  rationale: Die Übersetzung wahrt die direkte Aussage des Aorists und fügt kein bloßes Bemühen hinzu. „Mit Worten“ entspricht der instrumentalen Wendung ἐν λόγοις.
theological_decisions:
- issue: Bezug von πνεύματος
  choice: meines Geistes
  alternative: des Geistes
  rationale: Im unmittelbaren Zusammenhang spricht die Frau von ihrem eigenen inneren Leiden. Die Übersetzung kennzeichnet diesen naheliegenden Bezug, ohne eine besondere Lehre über den Heiligen Geist in den Text einzutragen.
- issue: Erfolg des Heilens im Schlusssatz
  choice: heilte er sie
  alternative: versuchte er, sie zu heilen
  rationale: Das griechische ἐθεράπευσεν bezeichnet die vollzogene Handlung; ein bloßer Versuch wäre ein nicht ausgewiesener Zusatz.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Der historische Präsenswechsel des Griechischen wird für einen flüssigen deutschen Bericht einheitlich im Präteritum wiedergegeben.
