    issue: Die räumliche Wendung „vor mir“ ist weniger bestimmt als εἰς τοὺς πόδας μου.
    rationale: Das Griechische lokalisiert ihr Niederfallen ausdrücklich bei bzw. zu Josephs Füßen, nicht nur allgemein vor ihm.
  - severity: medium
    issue: „mit dem Gesicht zu meinen Füßen“ ist unnatürlich formuliert.
    rationale: Die Wendung lässt die konkrete Körperhaltung etwas nachgetragen erscheinen. Eine integrierte Formulierung gibt den griechischen Ausdruck flüssiger wieder.
  revised_text: Als sie das sah, fiel sie weinend auf ihr Gesicht vor meine Füße. Ich richtete sie auf und ermahnte sie.
