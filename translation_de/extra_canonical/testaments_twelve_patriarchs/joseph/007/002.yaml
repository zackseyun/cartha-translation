  verdict: revise
  source_fidelity: 'Der Entwurf gibt den Handlungsablauf und die Verben zutreffend wieder: Sie sieht dies, fällt nieder und weint; Joseph richtet sie auf und ermahnt sie. Die konkrete Lokalangabe εἰς τοὺς πόδας μου („zu/an meine[n] Füße[n]“) wird jedoch durch „vor mir“ weniger präzise wiedergegeben. Die vorgeschlagene Fassung bewahrt sowohl das Fallen „auf ihr Gesicht“ als auch die Lage bei Josephs Füßen.'
  naturalness: „Mit dem Gesicht zu meinen Füßen“ ist im modernen Deutschen zwar verständlich, wirkt aber syntaktisch und idiomatisch steif. „Auf ihr Gesicht vor meine Füße“ ist eine natürliche, zugleich bildhafte Wiedergabe der griechischen Haltung.
  terminology: „Ermahnte sie“ ist für ἐνουθέτησα passend; es fügt weder den Inhalt noch den Ton der Ermahnung auslegend hinzu. „Richtete sie auf“ gibt ἀναστήσας αὐτήν angemessen wieder.
  issues:
