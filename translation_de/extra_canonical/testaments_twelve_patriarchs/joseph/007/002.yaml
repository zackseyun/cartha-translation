  text: Ἡ δὲ ⌈Ἰδοῦσα τοῦτο⌉⁵⁸ *ἔπεσεν⁵⁹ *ἐπὶ πρόσωπον αὐτῆς⁶⁰ *εἰς τοὺς πόδας μου⁶¹ κλαίουσα⁶², καὶ ἀναστήσας⁶³ αὐτὴν ἐνουθέτησα.
