  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/002.yaml
  text: But when she saw this, she fell on her face at my feet, weeping; and I raised her up and admonished her.
translation:
  language: de
  text: Als sie das sah, fiel sie weinend auf ihr Gesicht vor meine Füße. Ich richtete sie auf und ermahnte sie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔπεσεν ἐπὶ πρόσωπον αὐτῆς εἰς τοὺς πόδας μου
  choice: fiel sie vor mir nieder, mit dem Gesicht zu meinen Füßen
  rationale: Die Formulierung bewahrt sowohl das Niederfallen als auch die ungewöhnliche, konkrete Angabe, dass ihr Gesicht zu Josephs Füßen lag, ohne im Deutschen unnatürlich zu klingen.
- source_word: κλαίουσα
  choice: weinend
  rationale: Das begleitende Partizip bezeichnet die gleichzeitig stattfindende Handlung knapp und natürlich.
- source_word: ἀναστήσας αὐτήν
  choice: Ich richtete sie auf
  rationale: 'Gibt die kausative Bedeutung wieder: Joseph hilft ihr aus der niedergefallenen Haltung aufzustehen.'
- source_word: ἐνουθέτησα
  choice: ermahnte sie
  rationale: „Ermahnen“ bildet den Sinn von νουθετέω als zurechtweisendes oder warnendes Zureden angemessen und ohne zusätzliche Deutung ab.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die körperliche Haltung wird anschaulich wiedergegeben; die abschließende Ermahnung bleibt inhaltlich offen, wie im griechischen Text.
