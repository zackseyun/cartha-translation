base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/006.yaml
  text: But I, understanding that the spirit of Beliar was troubling her, prayed to the Lord and said to her,
translation:
  language: de
  text: 'Ich aber erkannte, dass der Geist Beliars sie bedrängte. Da betete ich zum Herrn und sagte zu ihr:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: νοήσας
  choice: erkannte
  rationale: Das Partizip bezeichnet ein geistiges Erfassen oder Erkennen; „erkannte“ ist natürlich und bewahrt den kognitiven Sinn.
- source_word: τὸ πνεῦμα τοῦ Βελίαρ
  choice: der Geist Beliars
  rationale: Die formale Genitivverbindung bleibt erhalten, ohne näher festzulegen, ob Beliar selbst oder ein ihm zugehöriger böser Geist gemeint ist.
- source_word: ἐνοχλεῖ αὐτήν
  choice: sie bedrängte
  rationale: ἐνοχλέω kann belästigen, bedrängen oder zusetzen bedeuten. „bedrängte“ gibt hier die feindliche geistige Einwirkung idiomatisch wieder.
- source_word: προσευξάμενος τῷ Κυρίῳ
  choice: Da betete ich zum Herrn
  rationale: Das aoristische Partizip wird als dem Sprechen vorausgehende Handlung natürlich aufgelöst.
- source_word: εἶπον πρὸς αὐτήν
  choice: sagte zu ihr
  rationale: Schlichte, genaue Wiedergabe der Redeformel; der Doppelpunkt führt in die nachfolgende direkte Rede.
theological_decisions:
- issue: Identität des „Geistes Beliars“
  choice: der Geist Beliars
  alternative: Beliars Geist / ein Geist Beliars
  rationale: Die Übersetzung bewahrt die bestimmte griechische Formulierung und entscheidet nicht, ob eine personale Gleichsetzung oder ein Beliar zugeordneter Geist vorliegt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die griechische Partizipienfolge wurde zur besseren Lesbarkeit in zwei Hauptsätze gegliedert; die zeitliche Abfolge bleibt erhalten.
