  naturalness: Die Fassung ist insgesamt modernes, verständliches Deutsch. „während du in Sünden blind bist“ klingt jedoch etwas statisch und schwächer als das griechische Partizip. Eine verbale Wiedergabe ist idiomatischer und quellennäher.
  terminology: „Nebenfrau“ ist für παλλακή historisch verständlich. „Astetho“ gibt Ἀστηθώ als quellennahen Namen wieder. „Andenken auf Erden“ ist eine natürliche Entsprechung von τὸ μνημόσυνόν σου ἀπὸ τῆς γῆς.
