source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: Ἵνα τί, ⌜ἄθλια⌉²², τάρασσον²³ καὶ θορυβῇ²⁴ ἐν ἁμαρτίαις τυφλώττουσα²⁵; μνήσθητι²⁶ ὅτι ἐὰν ἀνέλῃς σεαυτήν²⁷, *ἡ Ἀστηθώ²⁸, ἡ παλλακὴ²⁹ τοῦ ἀνδρός σου, ἡ³⁰ ἀντίζηλός³¹ σου³² κονδυλίσει³³ *τὰ τέκνα σου³⁴, καὶ³⁵ ἀπολέσεις³⁶ τὸ μνημόσυνόν σου ἀπὸ τῆς γῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/007.yaml
  text: “Why, miserable woman, are you disturbed and thrown into turmoil, blinding yourself in sins? Remember that if you kill yourself, Astho, your husband’s concubine, your rival, will beat your children and wipe out your memory from the earth.”
translation:
  language: de
  text: '„Warum, du Unglückliche, bist du aufgewühlt und gerätst in Unruhe, während du dich in Sünden verblendest? Denk daran: Wenn du dich selbst tötest, wird Astetho, die Nebenfrau deines Mannes und deine Rivalin, deine Kinder schlagen, und du wirst dein Andenken auf Erden verlieren.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἄθλια
  choice: du Unglückliche
  rationale: Gibt die direkte, abwertend-mitleidige Anrede natürlich wieder, ohne die Frau mit einer unnötig groben Beschimpfung zu bezeichnen.
- source_word: τάρασσον καὶ θορυβῇ
  choice: bist du aufgewühlt und gerätst in Unruhe
  rationale: Bewahrt die zwei eng verwandten Ausdrücke für innere Erschütterung und Unruhe in verständlichem Deutsch.
- source_word: ἐν ἁμαρτίαις τυφλώττουσα
  choice: während du in Sünden blind bist
  rationale: Folgt dem griechischen Partizip und erhält das Bild geistlich-moralischer Blindheit, ohne den reflexiven Sinn der englischen Konsultationsfassung vorauszusetzen.
- source_word: ἀνέλῃς σεαυτήν
  choice: dich selbst tötest
  rationale: Der Kontext verlangt die Bedeutung der Selbsttötung; diese Formulierung ist direkt und im modernen Deutsch eindeutig.
- source_word: ἡ παλλακὴ τοῦ ἀνδρός σου
  choice: die Nebenfrau deines Mannes
  rationale: Nebenfrau bezeichnet eine παλλακή verständlich und historisch angemessen; „Konkubine“ wäre weniger alltagssprachlich.
- source_word: κονδυλίσει
  choice: wird … schlagen
  rationale: Das Verb bezeichnet einen körperlichen Schlag, ursprünglich besonders mit Faust oder Knöcheln; „schlagen“ wahrt den Sinn ohne unbelegte Präzisierung.
- source_word: ἀπολέσεις τὸ μνημόσυνόν σου ἀπὸ τῆς γῆς
  choice: du wirst dein Andenken auf der Erde verlieren
  rationale: 'Bewahrt das Subjekt der zweiten Person Singular: Nicht Astetho löscht aktiv das Andenken aus, sondern die Angeredete verliert es.'
theological_decisions:
- issue: Folge der angekündigten Selbsttötung
  choice: Die Angeredete wird ihr Andenken auf der Erde verlieren.
  alternative: Astetho wird ihr Andenken von der Erde auslöschen.
  rationale: ἀπολέσεις steht in der zweiten Person Singular und bezieht sich grammatisch auf die Angeredete. Die Übersetzung lässt die genaue Art dieses Verlustes offen.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter Rede. Die beiden Ausdrücke für Erregung und Unruhe sowie das Motiv der Blindheit in Sünden bleiben erhalten. Der Eigenname Ἀστηθώ wird quellennah als „Astetho“ wiedergegeben.
