source:
  edition: Charles 1908 Greek Versions (pages 256-287, Joseph pilot)
  text: '*ἡ δὲ⁶⁴ συνεθέτό μου⁶⁵ τοῦ⁶⁶ *μηκέτι ποιῆσαι⁶⁷ τὴν ἀσέβειαν ταύτην⁶⁸. **Ἔτι δὲ¹ ἡ καρδία αὐτῆς *ἔκειτο εἰς τὸ κακὸν καὶ περιεβλέπετο ποίῳ τρόπῳ με παγιδεύσῃ· στενάζουσα δὲ †συντόμως συνεπίπτε μὴ ἀσθενοῦσα².'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/003.yaml
  text: And she agreed with me no longer to commit this impiety. Yet her heart was still set on evil, and she kept looking around for a way to ensnare me; and groaning, she would suddenly collapse, though she was not actually sick.
translation:
  language: de
  text: Und sie kam mit mir überein, diese Gottlosigkeit nicht mehr zu begehen. Doch ihr Herz war weiterhin auf das Böse gerichtet, und sie suchte nach einer Möglichkeit, mir eine Falle zu stellen. Seufzend brach sie plötzlich[a] zusammen, obwohl sie nicht schwach war.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das griechische Wort für „plötzlich“ (συντόμως) ist in der verwendeten Ausgabe textkritisch als unsicher markiert.
    reason: Die Ausgabe setzt bei συντόμως ein textkritisches Unsicherheitszeichen; ohne mitgelieferte alternative Lesart wird die überlieferte Lesung übersetzt und ihre Unsicherheit angezeigt.
  - marker: b
    text: 'Oder: obwohl sie nicht krank war.'
    reason: ἀσθενοῦσα kann sowohl körperliche Schwäche als auch Krankheit bezeichnen; der Kontext lässt beide Nuancen zu.
lexical_decisions:
- source_word: συνέθετό μου
  choice: sie sagte mir zu
  rationale: Das Medium von συντίθημι mit Genitiv bezeichnet hier eine Vereinbarung beziehungsweise Zusage gegenüber Joseph; die natürliche deutsche Wendung wahrt diesen Sinn.
- source_word: ἀσέβειαν
  choice: Gottlosigkeit
  rationale: Der Ausdruck bezeichnet ein Verhalten, das gegen Gott und die religiös-sittliche Ordnung verstößt; „Gottlosigkeit“ bewahrt diesen stärkeren Gehalt gegenüber dem allgemeineren „Unrecht“.
- source_word: ἔκειτο εἰς τὸ κακόν
  choice: war weiterhin auf das Böse gerichtet
  rationale: Die bildhafte Ausrichtung des Herzens wird bewahrt, ohne eine über den Text hinausgehende psychologische Deutung einzutragen.
- source_word: περιεβλέπετο
  choice: sie hielt Ausschau
  rationale: Das Imperfekt beschreibt ein fortgesetztes Suchen oder Umschauen nach einer Gelegenheit.
- source_word: παγιδεύσῃ
  choice: sie mir eine Falle stellen könnte
  rationale: Die Fallenmetaphorik des Verbs wird im Deutschen direkt und idiomatisch wiedergegeben.
- source_word: ἀσθενοῦσα
  choice: schwach war
  rationale: ἀσθενέω kann „schwach sein“ oder „krank sein“ bedeuten. „Schwach“ folgt der näheren lexikalischen Form, während eine Fußnote die mögliche Bedeutung „krank“ dokumentiert.
theological_decisions:
- issue: Wiedergabe von ἀσέβεια
  choice: Gottlosigkeit
  alternative: Frevel; Unrecht
  rationale: „Gottlosigkeit“ erhält die religiöse Dimension des griechischen Begriffs, ohne die konkrete Tat konfessionell oder dogmatisch näher zu bestimmen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die fortgesetzte böse Absicht wird durch „weiterhin“ und „hielt Ausschau“ ausgedrückt; die Schlusswendung bewahrt die Mehrdeutigkeit von ἀσθενέω durch eine Fußnote.
