  terminology: „Gottlosigkeit“ ist für ἀσέβεια angemessen und bewahrt die religiös-ethische Dimension ohne zusätzliche dogmatische Festlegung. „Eine Falle stellen“ gibt παγιδεύσῃ treffend wieder. „Schwach“ wahrt die Grundbedeutung von ἀσθενοῦσα; die mögliche Bedeutung „krank“ bleibt in der Fußnote ausgewiesen.
