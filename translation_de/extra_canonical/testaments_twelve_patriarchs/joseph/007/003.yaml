  to: Und sie kam mit mir überein, diese Gottlosigkeit nicht mehr zu begehen. Doch ihr Herz war weiterhin auf das Böse gerichtet, und sie suchte nach einer Möglichkeit, mir eine Falle zu stellen. Seufzend brach sie plötzlich[a] zusammen, obwohl sie nicht schwach war.[b]
  rationale: Die Revision präzisiert die gegenseitige Vereinbarung in συνέθετό μου, glättet die Wiedergabe des fortgesetzten Suchens und ergänzt eine notwendige Fußnote zur in der Quellenausgabe markierten textkritischen Unsicherheit bei συντόμως. Die semantische Ambiguität von ἀσθενοῦσα bleibt erhalten.
