  text: '*Τότε οὖν εὐκαιρίαν λαβοῦσα¹² εἰσεπήδησε πρός με, *ἔτι ἔξω ὄντος¹³ τοῦ ἀνδρὸς αὐτῆς, καὶ λέγει¹⁴ μοι· *Ἄγχομαι, ἢ εἰς κρημνὸν ῥίπτω ἐμαυτήν¹⁵, ἐὰν μὴ *συγγενῇ μετ᾿ ἐμοῦ¹⁶.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/007/005.yaml
  text: Then, when she found an opportunity, she rushed in to me while her husband was still outside, and said to me, “I am choking, or I will throw myself down a cliff, if you do not lie with me.”
translation:
  language: de
  text: 'Da ergriff sie eine günstige Gelegenheit, stürzte zu mir herein, während ihr Mann noch draußen war, und sagte zu mir: »Ich ersticke – oder ich stürze mich von einer Klippe, wenn du nicht mit mir schläfst.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐκαιρίαν λαβοῦσα
  choice: eine günstige Gelegenheit ergriff
  rationale: Gibt die idiomatische Bedeutung von »eine passende Gelegenheit wahrnehmen/ergreifen« natürlich und zugleich quellennah wieder.
- source_word: εἰσεπήδησε πρός με
  choice: stürzte zu mir herein
  rationale: Bewahrt sowohl die heftige, plötzliche Bewegung von εἰσεπήδησε als auch die durch εἰς ausgedrückte Bewegung hinein.
- source_word: Ἄγχομαι
  choice: Ich ersticke
  rationale: Entspricht dem Präsens und der Grundbedeutung »gewürgt werden/ersticken«; die möglicherweise dramatische oder bildliche Verwendung wird nicht aufgelöst.
- source_word: εἰς κρημνὸν ῥίπτω ἐμαυτήν
  choice: ich stürze mich einen Abhang hinunter
  rationale: Gibt die angedrohte Selbsttötung anschaulich wieder, ohne κρημνός unnötig auf »Klippe« oder »Schlucht« festzulegen.
- source_word: συγγενῇ μετ᾿ ἐμοῦ
  choice: mit mir schläfst
  rationale: Eine direkte, allgemein verständliche deutsche Wendung für den sexuellen Verkehr; weniger verhüllend als »Beziehungen mit mir hast« und im Kontext eindeutig.
