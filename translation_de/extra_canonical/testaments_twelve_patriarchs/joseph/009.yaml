lexical_decisions:
- source_word: ἐπηκροᾶτό μου
  choice: lauschte mir zu
  rationale: Das Verb bezeichnet aufmerksames, möglicherweise heimliches Zuhören. »Lauschte« wahrt diese Nuance und passt zum würdigen deutschen Erzählstil.
- source_word: ἐν οἴκῳ τοῦ σκότους / ἐκ τοῦ σκότους
  choice: im Haus der Finsternis / aus der Finsternis
  rationale: Der griechische Text nennt nicht unmittelbar ein Gefängnis, sondern bewahrt das konkrete Bild der Finsternis.
- source_word: ἐν ἱλαρᾷ φωνῇ
  choice: mit froher Stimme
  rationale: ἱλαρός bezeichnet eine heitere, freudige Haltung; »froh« wirkt im Deutschen natürlich und erhält den Kontrast zur Gefangenschaft.
- source_word: διὰ προφάσεως ἀπηλλάγην
  choice: durch einen Vorwand … losgekommen war
  rationale: πρόφασις bedeutet Vorwand oder vorgeschobener Grund. Die Formulierung lässt offen, auf welche Weise die falsche Beschuldigung Josef zugleich von der Frau trennte.
- source_word: Εὐδόκησον πληρῶσαι τὴν ἐπιθυμίαν μου
  choice: Erkläre dich bereit, mein Verlangen zu erfüllen
  rationale: Der Imperativ fordert willige Zustimmung. Diese Wendung ist klarer und natürlicher als ein bloßes »Erlaube«.
- source_word: οὐδὲ ἕως ἐννοίας ἐξέκλινα πρὸς αὐτήν
  choice: ich wandte mich ihr nicht einmal in Gedanken zu
  rationale: Die Wendung betont, dass Josefs Ablehnung nicht nur sein Verhalten, sondern bereits sein Denken umfasste.
- source_word: σωφροσύνη
  choice: Selbstbeherrschung / selbstbeherrscht
  rationale: Der Begriff umfasst besonnene Selbstkontrolle und bezeichnet hier besonders sexuelle Enthaltsamkeit, ohne auf diesen Aspekt beschränkt zu sein.
- source_word: ἐν λάκκῳ σκότους
  choice: in einer finsteren Grube
  rationale: λάκκος ist konkret eine Grube. Die bildhafte Sprache wird nicht zum interpretierenden »Kerker« verflacht.
- source_word: ἐν ταμείοις … τρυφῶντα μετ’ ἀκολασίας
  choice: in Schatzkammern schwelgt und zügellos lebt
  rationale: Die schwierige Formulierung stellt privilegierten Überfluss und moralische Zügellosigkeit der Treue in dunkler Gefangenschaft gegenüber.
- source_word: δόξαν
  choice: Ansehen
  rationale: δόξα bezeichnet hier die von Gott gewährte ehrenvolle Stellung Josefs; »Ansehen« ist im Kontext natürlicher als das stärker religiös konnotierte »Herrlichkeit«.
- source_word: συμφέρει
  choice: ihm zum Guten dient
  rationale: Das Verb bezeichnet das, was nützt oder zuträglich ist. Diese Wiedergabe erhält den providenziellen Gedanken besser als lediglich »angemessen«.
- source_word: ἐν ἀωρίᾳ
  choice: zu ungelegener Stunde
  rationale: Die Wendung bezeichnet eine unpassende oder ungewöhnliche Zeit und unterstreicht das heimliche Vorgehen.
- source_word: τοὺς στεναγμούς
  choice: ihr Stöhnen
  rationale: στεναγμός ist stärker als ein bloßer Seufzer und kann hier sowohl körperliches Leiden als auch begehrendes Stöhnen anklingen lassen.
- source_word: τὰς κνήμας
  choice: Unterschenkel
  rationale: κνήμη bezeichnet spezifisch den unteren Teil des Beines beziehungsweise das Schienbein, nicht allgemein das ganze Bein.
- source_word: ἵνα συμπέσω εἰς αὐτήν
  choice: damit ich mich ihr hingäbe
  rationale: Die wörtliche Bewegung »in/auf sie fallen« ist im Deutschen missverständlich. Im Verführungskontext gibt die gewählte Formulierung den sexuellen Sinn wieder, ohne unnötige Explizitheit.
- source_word: πρὸς ἀπάτην μου
  choice: um mich zu verführen
  rationale: ἀπάτη bezeichnet Täuschung oder Verleitung. Im unmittelbaren Kontext ist »verführen« idiomatisch und wahrt das beabsichtigte moralische Irreführen.
theological_decisions:
- issue: Göttliches Handeln bei Josefs Bewahrung
  choice: Die Aussagen »Gott liebt …« und »der Herr bewahrte mich« bleiben als ausdrückliches göttliches Handeln erhalten.
  alternative: Josefs Widerstand ausschließlich als persönliche Selbstdisziplin darstellen.
  rationale: Der griechische Text verbindet Josefs Selbstbeherrschung ausdrücklich mit Gottes Wertschätzung und Schutz; beide Seiten der Spannung sind zu bewahren.
- issue: Bedeutungsumfang von σωφροσύνη
  choice: Wiedergabe mit »Selbstbeherrschung«, wobei sexuelle Reinheit aus dem Zusammenhang hervorgeht.
  alternative: »Keuschheit« oder »Besonnenheit«.
  rationale: »Keuschheit« wäre im konkreten Kontext zutreffend, verengt jedoch das weitere Bedeutungsspektrum des griechischen Tugendbegriffs.
- issue: Bedingung für die Gewährung von δόξα in Vers 3
  choice: Josefs Wunsch nach Ansehen und Gottes Wissen um dessen Nutzen werden beide ausdrücklich wiedergegeben.
  alternative: Den Wunsch auslassen und nur sagen, Gott wisse, dass Ansehen angemessen sei.
  rationale: Der griechische Text enthält sowohl θέλει καὶ δόξαν als auch οἶδεν … ὅτι συμφέρει. Die Übersetzung bewahrt damit die Spannung zwischen menschlichem Wunsch und göttlicher Beurteilung.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die Bildsprache von Finsternis und Grube bleibt erhalten; schwer verständliche griechische Konstruktionen werden behutsam geglättet und bei textlicher Unsicherheit durch Fußnoten offengelegt. Der im gelieferten griechischen Ausschnitt als Fortsetzung von VIII 5 gekennzeichnete Eingangssatz wurde aufgenommen, weil er in der Quellenevidenz unmittelbar vor IX steht und für den Zusammenhang der vorgelegten Passage wesentlich ist.
