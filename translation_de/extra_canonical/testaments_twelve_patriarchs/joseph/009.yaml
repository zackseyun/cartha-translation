revisions:
- from: '**Das Testament Josefs 9**


    **1[a]** Als ich in Fesseln lag, wurde die Ägypterin von Kummer überwältigt. Sie kam und lauschte mir zu, wie ich dem Herrn dankte und im Haus der Finsternis Loblieder sang. Mit froher Stimme pries ich voller Freude meinen Gott, weil ich durch einen Vorwand von der Ägypterin losgekommen war. Oft ließ sie mir sagen: »Erkläre dich bereit, mein Verlangen zu erfüllen; dann löse ich deine Fesseln und befreie dich aus der Finsternis.«


    **2[b]** Doch ich wandte mich ihr nicht einmal in Gedanken zu. Denn Gott liebt den Menschen, der in einer finsteren Grube treu und selbstbeherrscht bleibt, mehr als einen König, der in Schatzkammern schwelgt und zügellos lebt.


    **3** Wenn aber jemand selbstbeherrscht lebt und sich auch Ansehen wünscht und der Höchste weiß, dass es ihm zum Guten dient, dann gewährt er ihm auch dies – so wie mir.


    **4** Wie oft kam sie, obwohl sie krank war, zu ungelegener Stunde zu mir hinab und hörte meine Stimme, während ich betete! Ich verstand ihr Stöhnen, schwieg aber.


    **5** Denn als ich in ihrem Haus war, entblößte sie ihre Arme und Unterschenkel, damit ich mich ihr hingäbe. Sie war nämlich sehr schön und schmückte sich besonders, um mich zu verführen[c]. Doch der Herr bewahrte mich vor ihren Anschlägen.


    **Fußnoten**


    [a] Der Ausdruck »Haus der Finsternis« bezeichnet wahrscheinlich den Ort, an dem Josef gefangen gehalten wurde. Der griechische Text bewahrt jedoch das Bild der Finsternis, statt ausdrücklich von einem Gefängnis zu sprechen.


    [b] Der griechische Wortlaut des Gegensatzes ist schwierig und textkritisch unsicher. Wörtlich steht ungefähr: »der in einer Grube der Finsternis in Selbstbeherrschung Treue« gegenüber »dem in Schatzkammern schwelgenden König mit Zügellosigkeit«.


    [c] Das mit »Unterschenkel« wiedergegebene Wort bezeichnet genauer die Schienbeine beziehungsweise den unteren Teil der Beine.'
