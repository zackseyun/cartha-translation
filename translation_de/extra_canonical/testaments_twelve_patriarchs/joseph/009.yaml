base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/joseph/009.yaml
  text: '1[a]. But when she came, she would listen in on me, how I gave thanks to the Lord and sang hymns in the house of darkness, and with a cheerful voice, rejoicing, I glorified my God because by a pretext I had been delivered from the Egyptian woman. Many times she sent to me, saying, “Consent to fulfill my desire, and I will release you from your chains, and I will free you from the darkness.”


    2[b]. But I did not turn even in thought toward her; for God loves more the one who is faithful in self-control in a pit of darkness than the one who, as a king in storerooms, lives in luxury with lawlessness.


    3. But if one lives in self-control, and the Most High knows that glory also is fitting for him, he grants that too to him, as also to me.


    4. How often, though she was sick, she came down to me at an untimely hour, and heard my voice as I prayed; and I, understanding her groanings, kept silent.


    5. For when I was in her house, she would uncover her arms and her legs, so that I might fall into her. For she was very beautiful, especially adorned for my deception[c]. But the Lord guarded me from her schemes.'
translation:
  language: de
  text: '**Das Testament Josefs 9**


    **1[a]** Als ich in Fesseln lag, wurde die Ägypterin von Kummer überwältigt. Sie kam und lauschte mir zu, wie ich dem Herrn dankte und im Haus der Finsternis Loblieder sang. Mit froher Stimme pries ich voller Freude meinen Gott, weil ich durch einen Vorwand von der Ägypterin befreit worden war. Oft ließ sie mir sagen: »Erkläre dich bereit, mein Verlangen zu erfüllen; dann löse ich deine Fesseln und befreie dich aus der Finsternis.«


    **2[b]** Doch ich wandte mich ihr nicht einmal in Gedanken zu. Denn Gott liebt den Menschen, der in einer Grube der Finsternis treu und selbstbeherrscht bleibt, mehr als einen König, der in Schatzkammern schwelgt und zügellos lebt.


    **3** Wenn aber jemand selbstbeherrscht lebt und sich auch Ansehen wünscht und der Höchste weiß, dass es ihm zum Guten dient, dann gewährt er ihm auch dies – wie auch mir.


    **4** Wie oft kam sie, obwohl sie krank war, zu ungelegener Stunde zu mir hinab und hörte meine Stimme, während ich betete! Ich verstand ihr Stöhnen, schwieg aber.


    **5** Denn als ich in ihrem Haus war, entblößte sie ihre Arme und Unterschenkel, damit ich mich ihr hingäbe. Sie war nämlich sehr schön und schmückte sich besonders, um mich zu täuschen[c]. Doch der Herr bewahrte mich vor ihren Nachstellungen.


    **Fußnoten**


    [a] Der Ausdruck »Haus der Finsternis« bezeichnet wahrscheinlich den Ort, an dem Josef gefangen gehalten wurde. Der griechische Text bewahrt jedoch das Bild der Finsternis, statt ausdrücklich von einem Gefängnis zu sprechen.


    [b] Der griechische Wortlaut des Gegensatzes ist schwierig und textkritisch unsicher. Wörtlich steht ungefähr: »den in einer Grube der Finsternis in Selbstbeherrschung Treuen« gegenüber »dem in Schatzkammern schwelgenden König mit Zügellosigkeit«.


    [c] Das mit »Unterschenkel« wiedergegebene Wort bezeichnet genauer die Schienbeine beziehungsweise den unteren Teil der Beine.'
  philosophy: optimal-equivalence
