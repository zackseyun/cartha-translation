  text: '1[a]. Hatred, then, is evil, because it keeps company with falsehood continually, speaking against the truth; it makes small things great, presents light as darkness, and calls the sweet bitter. It teaches slander, stirs up wrath and war, and fills the heart with insolence and every greed, with evils and a devilish poison.


    2. Therefore I say these things to you from experience, my children, so that you may drive out the devilish hatred and cling to the love of God. 3. Righteousness casts out hatred, and humility removes jealousy[b]. For the righteous man, being humble, is ashamed to do what is unjust, not because he is condemned by another, but by his own heart, because the Lord watches over his soul. 4. He does not speak against a holy man, because the fear of God dwells in him. 5. For, fearing lest he offend the Lord, he does not wish at all, not even in thought, to wrong a man.


    6. These things I learned at last after I repented concerning Joseph. 7. For true repentance according to God [removes ignorance and] puts darkness to flight, enlightens the eyes, gives knowledge to the soul, and guides the purpose toward salvation. 8. And he did not learn this from men, but through repentance he knows how to receive those who turn back.


    9. For God brought upon me a disease of the liver, and if the prayers of my father had not helped me, my spirit would almost have failed. 10. For by the very things through which a man transgresses, through those he is punished. 11. Since, then, my liver lay pitilessly set against Joseph, I too, suffering in my liver[c], was judged pitilessly for ten years.'
translation:
  language: de
  text: '1. Der Hass ist also etwas Böses, denn er ist ständig mit der Lüge verbunden und redet gegen die Wahrheit. Er macht Kleines groß, stellt das Licht als Finsternis hin und nennt das Süße bitter. Er lehrt Verleumdung, schürt Zorn und Krieg und erfüllt das Herz mit Überheblichkeit und jeder Habgier, mit Übeln und teuflischem Gift.


    2. Darum sage ich euch dies aus Erfahrung, meine Kinder, damit ihr den teuflischen Hass vertreibt und euch fest an die Liebe Gottes haltet. 3. Gerechtigkeit vertreibt den Hass, und Demut beseitigt die Eifersucht[a]. Denn der Gerechte, der demütig ist, scheut sich, Unrecht zu tun – nicht weil ein anderer ihn verurteilt, sondern weil sein eigenes Herz ihn verurteilt; denn der Herr wacht über seine Seele. 4. Er redet nicht schlecht über einen heiligen Menschen, weil die Furcht Gottes in ihm wohnt. 5. Denn aus Furcht, beim Herrn Anstoß zu erregen, will er einem Menschen überhaupt kein Unrecht tun, nicht einmal in Gedanken.


    6. Dies erkannte ich schließlich, nachdem ich in Bezug auf Josef umgekehrt war. 7. Denn die wahre, an Gott ausgerichtete Umkehr [beseitigt die Unwissenheit und][b] vertreibt die Finsternis; sie erleuchtet die Augen, gibt der Seele Erkenntnis und führt den Entschluss zum Heil. 8. Und dies hat er nicht von Menschen gelernt; vielmehr weiß er durch die Umkehr diejenigen anzunehmen, die umkehren.[c]


    9. Denn Gott ließ eine Leberkrankheit über mich kommen. Hätten mir die Gebete meines Vaters nicht geholfen, wäre mein Geist beinahe erloschen. 10. Denn durch eben das, womit ein Mensch das Gesetz übertritt, wird er bestraft. 11. Weil also meine Leber erbarmungslos gegen Josef gerichtet gewesen war, wurde auch ich, an der Leber leidend, zehn Zeitabschnitte lang[d] erbarmungslos gerichtet.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Neid“. Das griechische Wort kann sowohl Eifersucht als auch neidvolle Rivalität bezeichnen.'
    reason: lexical_alternative
  - marker: b
    text: Die Worte „beseitigt die Unwissenheit und“ sind im griechischen Textzeugen unsicher und stehen deshalb in eckigen Klammern.
    reason: textual_variant
  - marker: c
    text: Wer mit „er“ gemeint ist, bleibt im griechischen Satz unklar. Möglich ist ein Bezug auf Gott; auch ein Bezug auf den Umkehrenden wurde vertreten.
    reason: referential_ambiguity
  - marker: d
    text: 'Wörtlich: „zehn Zeiten/Perioden“. Der griechische Ausdruck legt nicht fest, ob Jahre, Monate oder andere Zeitabschnitte gemeint sind.'
    reason: lexical_ambiguity
lexical_decisions:
- source_word: μῖσος
  choice: Hass
  rationale: Das abstrakte Substantiv bewahrt das durchgehende Lastermotiv und die Personifikation.
- source_word: ἐνδελεχεῖ συνεχῶς τῷ ψεύδει
  choice: hält sich ständig zur Lüge
  rationale: Die Formulierung gibt die dauernde Verbindung des personifizierten Hasses mit der Lüge wieder, ohne sie auf einzelne Falschaussagen zu verengen.
- source_word: τὰ μικρὰ μεγάλα ποιεῖ
  choice: macht Kleines groß
  rationale: Die knappe antithetische Bildsprache des Griechischen bleibt erhalten.
- source_word: τὸ φῶς σκότος παρέχει
  choice: stellt das Licht als Finsternis hin
  rationale: Natürliches Deutsch, das die moralische Verkehrung deutlich wiedergibt.
- source_word: συκοφαντίαν
  choice: Verleumdung
  rationale: Prägnante moderne Wiedergabe einer böswilligen falschen Beschuldigung.
- source_word: ὕβριν
  choice: Übermut
  rationale: Erfasst hier die moralisch-soziale Bedeutung anmaßender Haltung besser als das allgemeinere „Stolz“.
- source_word: πλεονεξίαν
  choice: Habgier
  rationale: Gibt das maßlose Habenwollen als ethisches Laster klar wieder.
- source_word: ζῆλος
  choice: Eifersucht
  rationale: Passt zum feindseligen Konkurrenzdenken; die ebenfalls mögliche Bedeutung „Neid“ wird in einer Fußnote bewahrt.
- source_word: μετάνοια
  choice: Umkehr
  rationale: Bezeichnet hier eine moralisch-religiöse Neuausrichtung und eignet sich zugleich für die Wortverbindung mit den Umkehrenden in Vers 8.
- source_word: τὸ διαβούλιον
  choice: den Entschluss
  rationale: Gibt den inneren Vorsatz beziehungsweise die Willensausrichtung wieder, ohne diese psychologisch zu verengen.
- source_word: χρόνους δέκα
  choice: zehn Zeitabschnitte
  rationale: Die griechische Formulierung nennt zehn Zeiten beziehungsweise Perioden, ohne deren Länge ausdrücklich festzulegen.
theological_decisions:
- issue: μετανοέω / μετάνοια in Vers 6–8
  choice: „umgekehrt war“ / „Umkehr“
  alternative: „bereut hatte“ / „Buße“
  rationale: „Umkehr“ umfasst Gads Sinnes- und Haltungsänderung gegenüber Josef und bewahrt zugleich die religiöse Tragweite, ohne sie konfessionell festzulegen.
- issue: Textlich unsichere Wendung in Vers 7
  choice: In eckigen Klammern beibehalten
  alternative: Auslassen oder ohne Kennzeichnung integrieren
  rationale: Die Klammern machen die Unsicherheit des griechischen Textzeugen transparent.
- issue: Subjekt in Vers 8
  choice: Das maskuline Singularsubjekt „er“ wird beibehalten und nicht namentlich identifiziert
  alternative: Ausdrücklich „Gott“ oder „der Umkehrende“ einsetzen
  rationale: Der griechische Text lässt den Bezug des Subjekts schwierig und mehrdeutig erscheinen; die Übersetzung vermeidet eine stillschweigende theologische Festlegung.
- issue: Vergeltungsaussage in Vers 10
  choice: „durch eben das, womit ... wird er bestraft“
  alternative: Allgemeinere Umschreibung ohne Entsprechung zwischen Tat und Strafe
  rationale: Die ausdrückliche Entsprechung von Verfehlung und Strafe im griechischen Text wird bewahrt.
- issue: Zeitangabe in Vers 11
  choice: „zehn Zeitabschnitte lang“
  alternative: „zehn Jahre lang“ oder „zehn Monate lang“
  rationale: χρόνους δέκα bestimmt die Einheit nicht eindeutig; die formale Wiedergabe erhält diese echte Unsicherheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer ethischer Mahnrede. Die rhetorischen Gegensätze und Personifikationen werden möglichst knapp bewahrt. Archaismen und konfessionell geprägte Fachsprache werden vermieden; echte textliche, zeitliche und syntaktische Mehrdeutigkeiten werden sichtbar gehalten.
