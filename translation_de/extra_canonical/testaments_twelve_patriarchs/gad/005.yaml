    9. Denn Gott ließ eine Leberkrankheit über mich kommen. Hätten mir die Gebete meines Vaters nicht geholfen, wäre mein Geist beinahe erloschen. 10. Denn durch eben das, womit ein Mensch das Gesetz übertritt, wird er bestraft. 11. Weil also meine Leber Josef gegenüber erbarmungslos eingestellt gewesen war, wurde auch ich, an der Leber leidend, zehn Zeitabschnitte lang[d] erbarmungslos gerichtet.'
