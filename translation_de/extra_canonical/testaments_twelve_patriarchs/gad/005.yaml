revisions:
- from: '1. Der Hass ist also etwas Böses, denn er hält sich ständig zur Lüge und redet gegen die Wahrheit. Er macht Kleines groß, stellt das Licht als Finsternis hin und nennt das Süße bitter. Er lehrt Verleumdung, schürt Zorn und Krieg und erfüllt das Herz mit Übermut und jeder Habgier, mit Bösem und teuflischem Gift.


