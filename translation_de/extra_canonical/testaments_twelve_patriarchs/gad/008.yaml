  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/008.yaml
  text: 'Say these things[a], you also, to your children:


    that they honor Levi and Judah; for from them the Lord will raise up salvation for Israel.

    And tell them concerning Joseph, that they should love him, because in every affliction he was innocent,

    and he kept the commandment of God, not returning evil for evil.

    For he suffered much from his brothers, yet he loved them,

    and though they plotted against him, he spoke peaceably to them.


    And now, my children, I command you: love one another from the heart,

    and if anyone sins against you, speak peaceably to him, and in your soul hold no deceit;

    and if he confesses and repents, forgive him.

    But if he denies it, do not become heated in argument with him,

    lest, after taking in poison[b], he begin to swear and so commit a double sin.

    If anyone prospers beyond you, do not be grieved;

    but pray also for him, that he may be made complete in every good thing.


    If anyone is glorified, do not envy him;

    if anyone is enriched, do not be jealous.

    Bless the Lord who gives good things to all,

    because the poor man, if he is free from envy, is rich before the Lord.

    Do not hate a beautiful woman because of her appearance,

    and do not hate a man because of the abundance of his glory.

    For God gives the good things of the earth to whom he wills.


    Seek uprightness in your own works,

    and pray for your neighbor, so that if he prospers in every good thing, you may not be jealous.

    For the one who is jealous is always in turmoil,

    and the one who hates is always darkened.

    Love one another in deed and in word and in the intention of the soul.

    For I also spoke peaceably with Joseph, but in my heart I intended to kill him.

    The spirit of hatred is evil, because it is never at peace with men;

    it always desires their downfall.

    It weakens the body and disturbs the soul,

    and it puts wrath upon the mind.


    Therefore, if anyone does evil to you, do good to him,

    and pray for him; and you will be redeemed by the Lord from every evil.

    For if anyone prospers, and if he is shameless or lawless, do not be jealous;

    but wait for the end from the Lord.

    For either he receives his reward in this life,

    or, if he is kept for punishment, he will be repaid in the judgment.

    And if a poor man prospers and is without envy, even if he is not rich,

    he is blessed beyond all men, because he has the treasure that does not perish.

    Therefore cast away hatred[c], and love one another in uprightness of heart.'
translation:
  language: de
  text: '**Testament Gads 8**


    **1** Sagt auch ihr euren Kindern dies: Sie sollen Juda und Levi ehren, denn aus ihnen wird der Herr euch Rettung für Israel aufgehen lassen.[a]


    **2** Denn ich weiß, dass eure Kinder von ihm[b] abfallen werden; sie werden in aller Bosheit, Bedrängnis und Verderbnis leben, fern vom Herrn.


    **3** Nachdem er eine Weile geschwiegen hatte, sagte er erneut: »Meine Kinder, hört auf euren Vater und begrabt mich nahe bei meinen Vätern.«


    **4** Dann hob er seine Füße an und entschlief in Frieden.


    **5** Nach fünf Jahren brachten sie ihn nach Hebron hinauf und bestatteten ihn bei seinen Vätern.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die griechische Formulierung ist syntaktisch schwierig. Sie lässt offen, wie Juda und Levi mit der Rettung für Israel verbunden sind.
    reason: textual_ambiguity
  - marker: b
    text: Worauf sich „ihm“ bezieht, ist im griechischen Wortlaut nicht eindeutig.
    reason: referential_ambiguity
lexical_decisions:
- source_word: τιμήσωσιν
  choice: ehren
  rationale: Gibt respektvolle Anerkennung wieder, ohne eine kultische Verehrung auszudrücken.
- source_word: ἀνατελεῖ … σωτηρίαν
  choice: Rettung … hervorgehen lassen
  rationale: Bewahrt das Bild des Aufgehens beziehungsweise Hervorbringens und zugleich das aktive Handeln des Herrn; „Rettung“ kann konkrete Befreiung und theologisches Heil umfassen.
- source_word: ἀποστήσονται
  choice: abfallen werden
  rationale: Gibt die religiös-bundestheologische Bedeutung des Sich-Abwendens in diesem Zusammenhang natürlich wieder.
- source_word: κακώσει
  choice: Schlechtigkeit
  rationale: Passt als moralischer Begriff in die Reihung mit Bosheit und Verderbnis, ohne den Ausdruck mit „Misshandlung“ zu verengen.
- source_word: ἡσυχάσας
  choice: nachdem er … geschwiegen hatte
  rationale: Im Redekontext bezeichnet das Verb eine kurze Pause beziehungsweise ein Verstummen.
- source_word: ὑπακούσατε
  choice: hört auf
  rationale: Natürliches modernes Deutsch für gehorsames Hören auf den Vater.
- source_word: ἐκοιμήθη
  choice: entschlief
  rationale: Erhält den würdevollen Sterbeeuphemismus des griechischen Textes.
- source_word: ἀνήγαγον
  choice: brachten … hinauf
  rationale: Bewahrt die räumliche Vorstellung des Hinaufbringens nach Hebron.
theological_decisions:
- issue: Rettung aus Juda und Levi
  choice: „aus ihnen wird der Herr für euch Rettung für Israel hervorgehen lassen“
  alternative: „aus ihnen wird euch der Herr als Rettung für Israel aufgehen“
  rationale: Die gewählte Fassung lässt offen, ob allgemein priesterliche und königliche Führung oder eine spezifischere Heilserwartung gemeint ist, und macht zugleich die schwierige griechische Syntax verständlich.
- issue: Bezug von αὐτοῦ in Vers 2
  choice: „von ihm“
  alternative: „davon“ oder eine ausdrückliche Identifizierung des Bezugs
  rationale: Das maskuline Pronomen hat im unmittelbaren Wortlaut keinen völlig eindeutigen Bezug. Die Übersetzung bewahrt diese Unbestimmtheit, statt eine bestimmte heilsgeschichtliche Deutung einzutragen.
- issue: Tod Gads als Schlaf
  choice: „entschlief“
  alternative: „starb“
  rationale: Der im Griechischen verwendete Sterbeeuphemismus bleibt erhalten, ohne daraus eine weitergehende Aussage über den Zustand nach dem Tod abzuleiten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper testamentarischer Rede. Die fünf Verse folgen ausschließlich dem vorgelegten griechischen Text; das umfangreichere Material der englischen Konsultationsfassung wurde nicht übernommen, da es in dieser griechischen Vorlage nicht steht.
