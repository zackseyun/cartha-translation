  text: 1[a]. But if someone prospers more than you, do not be grieved; rather, pray for him, that he may be brought to completion. For in this way it is to your advantage. 2. And if he is exalted still more[b], do not envy him, remembering that all flesh will die. But offer hymns to the Lord, who gives good and profitable things to all people. 3. Examine the judgments of the Lord, and your purpose will be illumined and be at rest. 4. But if someone grows rich through evil, like Esau my father's brother, do not be jealous; rather, wait for the appointed limit of the Lord. 5. For if what was taken away in evil is taken from him, or if he repents, he is forgiven; but if he remains unrepentant, he is kept for eternal punishment. 6. For the poor man, if being free from envy in all things he is pleasing to the Lord, is richer than all, because he does not have the distraction of vain people. 7. Therefore cast out hatred from your souls[d][c], and love one another in deed and in word and in the
    disposition of your soul.
translation:
  language: de
  text: '1. Wenn aber jemand mehr Erfolg hat als ihr, dann seid nicht betrübt, sondern betet für ihn, damit er zur Vollendung gelangt.[a] Denn so ist es für euch von Nutzen.


    2. Und wenn er noch höher aufsteigt, beneidet ihn nicht. Denkt daran, dass alles Fleisch sterben wird. Bringt vielmehr dem Herrn Loblieder dar, der allen Menschen das gibt, was gut und nützlich ist.


    3. Prüfe die Urteile des Herrn; dann wird deine Überlegung erhellt werden und zur Ruhe kommen.[b]


    4. Wenn aber jemand durch Böses reich wird, wie Esau, der Bruder meines Vaters, dann beneidet ihn nicht. Wartet vielmehr auf die vom Herrn gesetzte Grenze.[c]


    5. Wird ihm das durch Böses Gewonnene genommen, oder kehrt er um, so wird ihm vergeben; bleibt er aber ohne Umkehr, wird er für ewige Strafe aufbewahrt.[d]


    6. Denn der Arme, der in allem frei von Neid ist und dem Herrn gefällt, ist reicher als alle anderen; denn er kennt nicht die Ablenkung durch nichtige Menschen.[e]


    7. Entfernt daher den Hass aus euren Seelen und liebt einander mit aufrichtigem Herzen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „damit er vollendet werde“.'
    reason: lexical_alternative
  - marker: b
    text: 'Der griechische Wortlaut dieses Satzes ist schwierig; statt „deine Überlegung wird erhellt werden“ lässt sich auch verstehen: „es wird aufleuchten, und deine Überlegung wird zur Ruhe kommen“.'
    reason: textual_variant
  - marker: c
    text: „Die vom Herrn gesetzte Grenze“ kann auch den von ihm festgesetzten Zeitpunkt oder seinen Beschluss bezeichnen.
    reason: lexical_alternative
  - marker: d
    text: „Ewige Strafe“ kann auch mit „äonenlange Strafe“ beziehungsweise „Strafe des kommenden Zeitalters“ wiedergegeben werden.
    reason: alternative_reading
  - marker: e
    text: 'Oder: „die ablenkenden Sorgen eitler Menschen“. Der griechische Ausdruck kann die Ablenkung selbst oder das bezeichnen, wodurch nichtige Menschen abgelenkt werden.'
    reason: lexical_alternative
lexical_decisions:
- source_word: εὐοδοῦται
  choice: Erfolg hat
  rationale: Im ethischen Zusammenhang bezeichnet das Verb gutes Fortkommen oder Gedeihen, nicht eine wörtlich erfolgreiche Reise. Die Formulierung ist im modernen Deutsch natürlich und bewahrt den sozialen Vergleich.
- source_word: τελειωθῇ
  choice: zur Vollendung gelangt
  rationale: Die Wendung hält offen, ob die Vollendung Erfolg, Reife oder sittliche Vervollkommnung meint, und verengt das Verb nicht auf bloßen Wohlstand.
- source_word: ὑψοῦται
  choice: höher aufsteigt
  rationale: Das Verb kann gesellschaftliche Erhöhung oder zunehmendes Ansehen bezeichnen. „Aufsteigen“ gibt diesen Zusammenhang idiomatisch wieder.
- source_word: πᾶσα σὰρξ
  choice: alles Fleisch
  rationale: Die feierliche Sterblichkeitsformel und ihre anthropologische Bildsprache bleiben erhalten.
- source_word: ὕμνους προσφέρετε
  choice: Loblieder darbringen
  rationale: „Darbringen“ bewahrt die kultisch-opferhafte Färbung von προσφέρετε, während „Loblieder“ im Deutschen verständlicher als „Hymnen“ ist.
- source_word: κρίματα Κυρίου
  choice: Urteile des Herrn
  rationale: Die Formulierung kann Gottes richterliche Entscheidungen oder sein ordnendes Handeln meinen; „Urteile“ wahrt diese Breite.
- source_word: διαβούλιον
  choice: Entschluss
  rationale: Das Wort bezeichnet innere Überlegung, Beratung oder einen daraus hervorgehenden Vorsatz. „Entschluss“ passt zur Aussage, dass dieser Klarheit und Ruhe gewinnt.
- source_word: ὅρον Κυρίου
  choice: die vom Herrn gesetzte Grenze
  rationale: ὅρος kann Grenze, festgesetztes Maß oder bestimmten Zeitpunkt bezeichnen. Die Übersetzung lässt diese Bedeutungsbreite bestehen.
- source_word: ἄφθονος
  choice: frei von Neid
  rationale: Im Kontext des Kapitels steht der Verzicht auf Neid im Mittelpunkt; die mögliche Bedeutung „freigebig“ tritt daher zurück.
- source_word: ἐν εὐθύτητι καρδίας
  choice: mit aufrichtigem Herzen
  rationale: Die idiomatische deutsche Wendung gibt die Geradheit und Lauterkeit des Herzens klar und würdig wieder.
theological_decisions:
- issue: Bedeutung von τελειωθῇ im Gebet für den Erfolgreichen
  choice: „damit er zur Vollendung gelangt“
  alternative: „damit er vollendet werde“ oder „damit sein Erfolg vollkommen werde“
  rationale: Der griechische Ausdruck reicht über weiteren äußeren Erfolg hinaus, legt aber keine bestimmte Lehre der Vollkommenheit fest. Die gewählte Form bewahrt diese Offenheit.
- issue: Bedeutung von ὅρον Κυρίου angesichts ungerechten Reichtums
  choice: „die vom Herrn gesetzte Grenze“
  alternative: „den festgesetzten Zeitpunkt des Herrn“ oder „den Beschluss des Herrn“
  rationale: Der Zusammenhang fordert Geduld gegenüber vorläufigem Erfolg durch Böses. „Grenze“ bewahrt sowohl den Gedanken eines gesetzten Endes als auch eines göttlich bestimmten Maßes.
- issue: Bedeutung von αἰωνίαν κόλασιν
  choice: „ewige Strafe“ im Haupttext
  alternative: „äonenlange Strafe“ oder „Strafe des kommenden Zeitalters“
  rationale: „Ewige Strafe“ ist in diesem Warnwort die naheliegende Wiedergabe. Da αἰώνιος sprachlich auch auf ein Zeitalter bezogen verstanden werden kann, wird diese Möglichkeit in einer Fußnote genannt, ohne den Haupttext dogmatisch umzudeuten.
- issue: Ablauf von Wegnahme, Umkehr und Vergebung in Vers 5
  choice: Wegnahme des böse Erworbenen und Umkehr als zwei im schwierigen Satz genannte Möglichkeiten wiedergegeben
  alternative: Gott nimmt das böse Erworbene weg und vergibt ausschließlich aufgrund anschließender Umkehr
  rationale: Der überlieferte griechische Satz ist syntaktisch unsicher. Die Übersetzung folgt seiner sichtbaren Alternativstruktur, ohne eine präzise Heilsordnung in den beschädigten beziehungsweise schwierigen Wortlaut hineinzulesen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem weisheitlich-paränetischem Ton. Traditionelle biblische Wendungen wie „alles Fleisch“ bleiben dort erhalten, wo sie inhaltlich prägnant sind. Singular und Plural des griechischen Mahnworts werden beibehalten; daher steht in Vers 3 die persönliche Anrede im Singular, sonst überwiegend der Plural.
