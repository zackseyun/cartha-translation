  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006.yaml
  text: '1[a]. And now, my children, I urge you: let each one love his neighbor, and remove hatred from your hearts. Love one another in deed and word and with the intention of the soul.


    2. For I myself, in my father’s presence, spoke peaceably to Joseph; but when I went out from his presence, the spirit of hatred darkened my mind and disturbed my understanding so that I wanted to kill him.


    3. Love one another from the heart; and if anyone sins against you[b], speak peace to him, and in your soul hold no deceit; and if he confesses and changes his mind, forgive him.


    4. But if he denies it, do not contend with him, lest, when he swears an oath, you sin doubly.


    5. Do not let a stranger hear your secret in a quarrel, lest, hating you, he become your enemy and commit a great sin against you; for many times he either kills by treachery or entangles you in evils, having taken in from you the poison.


    6. But if he denies it and is ashamed when reproved, be still and do not reprove him further. For the one who denies it repents of having done wrong against you, so as not to wrong you again, and, being afraid, makes peace.


    7. But even if he is shameless and persists in his wrongdoing, even so forgive him from the heart[c], and leave vengeance to God.'
translation:
  language: de
  text: '**Testament Gads 6**


    **1.** Und nun, meine Kinder, ermahne ich euch: Jeder soll seinen Nächsten lieben, und entfernt den Hass aus euren Herzen. Liebt einander in Tat und Wort und in der Gesinnung eurer Seele.


    **2.** Denn in der Gegenwart meines Vaters redete ich friedlich mit Josef. Doch als ich von ihm wegging, verdunkelte der Geist des Hasses meinen Verstand und verwirrte meine Gedanken, sodass ich ihn töten wollte.


    **3.** Liebt einander von Herzen. Wenn jemand gegen dich sündigt, rede friedlich mit ihm und hege in deiner Seele keine Hinterlist.[a] Wenn er es bekennt und seine Haltung ändert, vergib ihm.


    **4.** Wenn er es aber abstreitet, dann streite nicht mit ihm, damit du nicht doppelt sündigst, wenn er einen Eid schwört.


    **5.** Lass nicht zu, dass ein Außenstehender während eines Streits dein Geheimnis erfährt. Sonst könnte er dich hassen, dein Feind werden und eine große Sünde gegen dich begehen. Denn oft tötet er dich heimtückisch oder verstrickt dich in Unheil, nachdem er das Gift von dir aufgenommen hat.[b]


    **6.** Wenn er es aber abstreitet und sich schämt, weil er zurechtgewiesen wird, dann schweige und weise ihn nicht weiter zurecht. Denn wer es abstreitet, bereut, sich gegen dich vergangen zu haben, und schließt aus Furcht Frieden.[c]


    **7.** Doch selbst wenn er schamlos ist und auf seiner Bosheit beharrt, vergib ihm dennoch von Herzen und überlass Gott die Vergeltung.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'In Vers 3 weichen die Textzeugen bei der Formulierung „rede friedlich mit ihm“ und bei der Stellung von „hege in deiner Seele keine Hinterlist“ voneinander ab. Sicher ist der Grundgedanke: friedliche Ansprache ohne verborgene Hinterlist.'
    reason: textual_variant
  - marker: b
    text: Vers 5 ist textlich schwierig. Gewarnt wird davor, während eines Streits eine vertrauliche Angelegenheit vor einem Außenstehenden offenzulegen, weil dies feindselige und heimtückische Taten hervorrufen kann. Das Bild vom „Gift“, das der andere von dir aufgenommen hat, beschreibt offenbar bildhaft den aufgenommenen Hass oder die daraus erwachsende feindselige Gesinnung.
    reason: textual_variant
  - marker: c
    text: In Vers 6 unterscheiden sich die Textzeugen im Wortlaut zur Reue und Furcht dessen, der die Tat abstreitet. Der Zusammenhang legt nahe, dass seine Beschämung ihn dazu bringen kann, vom Unrecht abzulassen und Frieden zu schließen.
    reason: textual_variant
lexical_decisions:
- source_word: παραινῶ
  choice: ermahne ich euch
  rationale: Gibt den eindringlichen, testamentarischen Mahnton wieder, ohne altertümlich zu klingen.
- source_word: τὸν πλησίον
  choice: seinen Nächsten
  rationale: Bewahrt den etablierten ethischen Beziehungsbegriff des Griechischen.
- source_word: ἐξάρατε τὸ μῖσος
  choice: entfernt den Hass
  rationale: Drückt die geforderte entschiedene Beseitigung des Hasses klar und idiomatisch aus.
- source_word: διανοίᾳ ψυχῆς
  choice: in der Gesinnung eurer Seele
  rationale: Bewahrt die innere, intentionale Dimension der ungewöhnlichen griechischen Wortverbindung.
- source_word: εἰρηνικά
  choice: friedlich
  rationale: Erhält den Gegensatz zwischen Gads friedlichem Reden in der Gegenwart des Vaters und seinem späteren inneren Hass.
- source_word: τὸ πνεῦμα τοῦ μίσους
  choice: der Geist des Hasses
  rationale: Bewahrt die personifizierende beziehungsweise geistlich-moralische Ausdrucksweise, ohne sie näher zu bestimmen.
- source_word: νοῦν / λογισμόν
  choice: Verstand / Gedanken
  rationale: Unterscheidet die beiden verwandten inneren Begriffe und wahrt zugleich den Parallelismus von Verdunkelung und Verwirrung.
- source_word: εἰπὲ αὐτῷ εἰρήνην / ἐν εἰρήνῃ
  choice: rede friedlich mit ihm
  rationale: Gibt die Aufforderung in natürlichem modernem Deutsch wieder; eine Fußnote hält die Textvariante fest.
- source_word: δόλον
  choice: Hinterlist
  rationale: Bezeichnet die verborgene unaufrichtige beziehungsweise schädliche Absicht stärker als das allgemeinere „Täuschung“.
- source_word: μετανοήσας
  choice: seine Haltung ändert
  rationale: Im zwischenmenschlichen Zusammenhang geht es um eine innere Umkehr nach dem Eingeständnis; die Wiedergabe vermeidet eine unnötige dogmatische Verengung.
- source_word: δολοφωνεῖ
  choice: redet hinterlistig gegen dich
  rationale: Folgt der überlieferten Form mit dem Sinn „arglistig reden“; die schwierige Stelle und eine mögliche abweichende Deutung werden in der Fußnote kenntlich gemacht.
- source_word: τὴν ἐκδίκησιν
  choice: die Vergeltung
  rationale: Bewahrt das Gewicht göttlicher Ahndung und den ethischen Aufruf, auf eigene Rache zu verzichten.
theological_decisions:
- issue: Das „πνεῦμα τοῦ μίσους“ in Vers 2
  choice: der Geist des Hasses
  alternative: ein Geist des Hasses; der Hass
  rationale: Der bestimmte Ausdruck bleibt erhalten, ohne festzulegen, ob ein personales Geistwesen, eine moralische Macht oder personifizierter Hass gemeint ist.
- issue: μετανοέω im zwischenmenschlichen Zusammenhang von Vers 3
  choice: seine Haltung ändert
  alternative: bereut; kehrt um
  rationale: Die Formulierung wahrt die innere Sinnes- und Haltungsänderung und lässt deren religiöse Tragweite offen.
- issue: Göttliche Vergeltung in Vers 7
  choice: überlass Gott die Vergeltung
  alternative: überlass Gott die Rache; überlass Gott das Urteil
  rationale: Der Text fordert Vergebung und Verzicht auf Selbstjustiz, ohne die Spannung zwischen menschlicher Vergebung und göttlicher Ahndung aufzulösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer paränetischer Sprache. Die Anrede wechselt wie im Griechischen von der Mehrzahl an die Kinder zur beispielhaften Einzahl „du“. Semitisch beziehungsweise griechisch geprägte Wendungen werden dort idiomatisch geglättet, wo eine wörtliche Wiedergabe im Deutschen missverständlich wäre; echte textliche und theologische Mehrdeutigkeiten bleiben im Text oder in den Fußnoten sichtbar.
