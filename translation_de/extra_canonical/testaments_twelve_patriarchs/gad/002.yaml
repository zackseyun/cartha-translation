base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002.yaml
  text: '1 Therefore I confess my sin[a], children: many times I wanted to kill him, because I hated him from my soul. 2 And because of the dreams I added hatred toward him, and I wanted to wipe him out from the land of the living, as a calf licks up the green growth of the field. 3 But Judah sold him secretly to the Ishmaelites. 4 Thus the God of our fathers rescued him from our hands, so that we might not commit a great lawless deed in Israel.


    3 Therefore Simeon and I sold him to the Ishmaelites for thirty pieces of gold; and after hiding ten, we showed twenty to our brothers. 4 And so, through greed, we were fully set on his murder. 5 But the God of my fathers rescued him from my hands[d][c][b], so that I might not commit a lawless deed in Israel.'
translation:
  language: de
  text: '**Testament Gads 2**


    1 Darum bekenne ich nun meine Sünde, meine Kinder[a]: Oft wollte ich ihn töten, weil ich ihn aus tiefster Seele hasste. 2 Auch wegen der Träume wurde mein Hass auf ihn noch größer. Ich wollte ihn aus dem Land der Lebenden vertilgen[b], wie ein Kalb das frische Grün auf dem Feld aufleckt. 3 Doch Juda verkaufte ihn heimlich an die Ismaeliten[c]. 4 So rettete ihn der Gott unserer Väter aus unseren Händen, damit wir in Israel kein großes Unrecht begingen.


    3 Darum verkauften Simeon und ich ihn für dreißig Goldstücke an die Ismaeliten[d]. Zehn davon versteckten wir, und zwanzig zeigten wir unseren Brüdern. 4 So waren wir aus Habgier fest entschlossen, ihn zu töten. 5 Doch der Gott meiner Väter rettete ihn aus meiner Hand, damit ich in Israel kein Unrecht beging.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das Kapitel bewahrt mehr als eine Textform der Erzählung vom Verkauf Josefs. Beide Fassungen werden hier nacheinander wiedergegeben und nicht miteinander harmonisiert.
    reason: textual_variant
  - marker: b
    text: Das mit „vertilgen“ wiedergegebene griechische Verb bedeutet wörtlich „auflecken“. Dasselbe Verb steht gleich darauf im Vergleich mit dem Kalb.
    reason: lexical_alternative
  - marker: c
    text: 'Diese Textform schreibt Juda den heimlichen Verkauf zu. Die folgende Fassung sagt dagegen: „Darum verkauften Simeon und ich ihn an die Ismaeliten.“'
    reason: textual_variant
  - marker: d
    text: „Dreißig Goldstücke“ steht in dieser griechischen Textform; zu ihr gehört auch die Angabe, dass zehn versteckt und den Brüdern zwanzig gezeigt wurden.
    reason: textual_variant
lexical_decisions:
- source_word: Ὁμολογῶ ... τὴν ἁμαρτίαν μου
  choice: ich bekenne ... meine Sünde
  rationale: „Bekennen“ gibt den persönlichen und bußfertigen Ton wieder; „Sünde“ bewahrt das moralisch-religiöse Gewicht von ἁμαρτία.
- source_word: ἀνελεῖν
  choice: töten
  rationale: Die schlichte, deutliche Wiedergabe entspricht der beabsichtigten Tötung, ohne den Ausdruck unnötig zu archaisieren.
- source_word: ἐμίσουν αὐτὸν ἐκ ψυχῆς
  choice: ich hasste ihn aus tiefster Seele
  rationale: Die Formulierung wahrt die intensive, nahezu semitische Wendung und klingt zugleich verständlich im modernen Deutschen.
- source_word: διὰ τὰ ἐνύπνια ... προσεθέμην ... τὸ μῖσος
  choice: wegen seiner Träume wurde mein Hass auf ihn noch größer
  rationale: Die natürliche deutsche Formulierung erhält den Gedanken, dass die Träume den bereits vorhandenen Hass verstärkten. Das possessive „seiner“ macht den im Zusammenhang eindeutigen Bezug auf Josefs Träume transparent.
- source_word: ἐκλεῖξαι ... ἐκ γῆς ζώντων
  choice: aus dem Land der Lebenden vertilgen
  rationale: „Vertilgen“ vermittelt im Hauptsatz die idiomatische Bedeutung vollständiger Beseitigung; eine Fußnote weist darauf hin, dass das griechische Verb wörtlich „auflecken“ bedeutet und im anschließenden Vergleich wiederkehrt.
- source_word: τὰ χλωρὰ τοῦ πεδίου
  choice: das frische Grün auf dem Feld
  rationale: Die Wendung gibt den kollektiven Sinn des substantivierten Neutrums anschaulich wieder, ohne eine bestimmte Pflanzenart vorauszusetzen.
- source_word: κρυφῆ πράσας
  choice: verkaufte ... heimlich
  rationale: Die Übersetzung bewahrt sowohl den Verkaufsvorgang als auch seinen geheimen Charakter in natürlicher deutscher Wortstellung.
- source_word: τῇ πλεονεξίᾳ ἐπληροφορήθημεν τῆς ἀναιρέσεως αὐτοῦ
  choice: So waren wir aus Habgier fest entschlossen, ihn zu töten
  rationale: Die Wiedergabe erhält Habgier als Beweggrund und bringt den Zustand voller Entschlossenheit verständlich zum Ausdruck.
- source_word: ἐρρύσατο ... ἐκ τῶν χειρῶν
  choice: rettete ihn aus ... Händen / Hand
  rationale: „Retten“ bezeichnet hier konkret die Befreiung Josefs aus unmittelbarer Todesgefahr; Singular und Plural werden entsprechend den beiden Textformen beibehalten.
- source_word: ἀνομίαν μεγάλην / ἀνόμημα
  choice: schweres Unrecht / Unrecht
  rationale: „Unrecht“ wahrt die rechtlich-moralische Bedeutung, bleibt aber im heutigen Deutsch natürlicher als „Gesetzlosigkeit“ oder „gesetzlose Tat“.
theological_decisions:
- issue: Zwei voneinander abweichende Textformen über den Verkauf Josefs und seine Rettung
  choice: Beide im griechischen Quellenmaterial erhaltenen Formen werden nacheinander übersetzt, einschließlich ihrer unterschiedlichen Verszählung und der Wechsel zwischen Juda beziehungsweise Simeon und Gad sowie zwischen Plural und Singular.
  alternative: Die Angaben zu einer einzigen fortlaufenden Erzählung harmonisieren oder nur eine Textform abdrucken.
  rationale: Die Überlieferung bewahrt echte Spannung darüber, wer Josef verkaufte und aus wessen Hand Gott ihn rettete. Eine Zusammenführung würde diese textgeschichtliche Gegebenheit verdecken.
- issue: Bildhafte Bedeutung von ἐκλεῖξαι im Zusammenhang mit dem Kalb
  choice: Im Hauptsatz steht idiomatisch „vertilgen“, während Vergleich und Fußnote die konkrete Vorstellung des Aufleckens bewahren.
  alternative: Auch im Hauptsatz wörtlich „auflecken“ oder durchgehend allgemein „vernichten“ übersetzen.
  rationale: So bleibt der Tötungssinn für heutige Leser klar, ohne die bewusste Wiederaufnahme desselben griechischen Verbs im Kalbsvergleich zu verlieren.
- issue: Gottes Eingreifen zugunsten Josefs
  choice: Die beiden Aussagen werden einmal kollektiv mit „Gott unserer Väter“ und einmal individuell mit „der Gott meiner Väter“ wiedergegeben.
  alternative: Beide Aussagen sprachlich angleichen.
  rationale: Die Unterschiede entsprechen den erhaltenen Textformen und sollen nicht zugunsten einer einheitlichen theologischen Aussage eingeebnet werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Erzählweise. Biblisch geprägte Wendungen wie „Land der Lebenden“ und „Gott unserer Väter“ bleiben erhalten, während schwer verständliche Wörtlichkeiten im Haupttext behutsam idiomatisch und in Fußnoten quellennah erläutert werden. Die doppelte Versfolge 1–4 und 3–5 ist absichtlich beibehalten, um die zwei überlieferten Textformen sichtbar zu machen.
