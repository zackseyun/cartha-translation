source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 3. Ἡ²⁵ δικαιοσύνη²⁶ ἐκβάλλει τὸ μῖσος²⁷, ἡ ταπείνωσις ἀναιρεῖ *τὸ ζῆλος²⁸. ὁ γὰρ δίκαιος καὶ ταπεινῶς αἰδεῖται ποιῆσαι ἄδικον²⁹, ⸀οὐχ ὑπ᾽ ἄλλου³⁰ καταγινωσκόμενος³¹ ἀλλ᾽³² ὑπὸ τῆς ἰδίας καρδίας³³, ὅτι Κύριος ἐπισκοπεῖ³⁴ *τὴν ψυχὴν³⁵ αὐτοῦ³⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/003.yaml
  text: Righteousness casts out hatred, and humility removes jealousy. For the righteous man, being humble, is ashamed to do what is unjust, not because he is condemned by another, but by his own heart, because the Lord watches over his soul.
translation:
  language: de
  text: Gerechtigkeit vertreibt den Hass, und Demut beseitigt die Eifersucht. Denn wer gerecht und demütig ist, scheut sich, Unrecht zu tun – nicht weil ein anderer ihn verurteilt, sondern weil sein eigenes Herz ihn verurteilt; denn der Herr wacht über seine Seele.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δικαιοσύνη
  choice: Gerechtigkeit
  rationale: Gibt den ethisch-theologischen Sinn des griechischen Begriffs direkt und idiomatisch wieder.
- source_word: μῖσος
  choice: Hass
  rationale: Die natürliche und genaue deutsche Entsprechung.
- source_word: ταπείνωσις
  choice: Demut
  rationale: Im Zusammenhang bezeichnet das Wort eine demütige Haltung, nicht bloß Erniedrigung.
- source_word: ζῆλος
  choice: Eifersucht
  rationale: Der negative Kontext legt Eifersucht beziehungsweise neidische Missgunst nahe; „Eifer“ wäre hier missverständlich.
- source_word: αἰδεῖται
  choice: scheut sich
  rationale: Bewahrt den Gedanken sittlicher Scham und innerer Hemmung in natürlichem Deutsch.
- source_word: καταγινωσκόμενος
  choice: verurteilt
  rationale: Erfasst die innere beziehungsweise äußere Verurteilung oder Anklage, die durch den folgenden Gegensatz näher bestimmt wird.
- source_word: ἐπισκοπεῖ
  choice: wacht über
  rationale: Gibt die göttliche Aufsicht und prüfende Zuwendung wieder, ohne sie unnötig auf bloßes Beobachten zu verengen.
theological_decisions:
- issue: Bezug der Verurteilung durch das eigene Herz
  choice: „weil sein eigenes Herz ihn verurteilt“
  alternative: „sondern von seinem eigenen Herzen“
  rationale: Die explizite Wiederholung des Verbs macht den Gegensatz im Deutschen klar, ohne eine zusätzliche Lehrvorstellung einzutragen.
- issue: Göttliches ἐπισκοπεῖν
  choice: „der Herr wacht über seine Seele“
  alternative: „der Herr prüft seine Seele“
  rationale: „Wacht über“ erhält die mögliche Spannung zwischen fürsorglicher Aufsicht und prüfender Beobachtung besser als die engere Alternative.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die substantivischen Tugendbegriffe bleiben im ersten Satz erhalten; der zweite Satz wird mit „wer gerecht und demütig ist“ idiomatisch formuliert. Keine Fußnoten erforderlich.
