source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 10. Δι’ ὧν γὰρ δ⁶³ ἄνθρωπος παρανομεῖ, δι’ ἐκείνων⁶⁴ κολάζεται.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/010.yaml
  text: For by the very things through which a man transgresses, through those he is punished.
translation:
  language: de
  text: Denn durch eben das, wodurch ein Mensch das Gesetz übertritt, wird er auch bestraft.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παρανομεῖ
  choice: das Gesetz übertritt
  rationale: Das Verb bezeichnet ein Handeln gegen das Gesetz beziehungsweise ein gesetzwidriges Vergehen. „Das Gesetz übertritt“ gibt diesen Sinn in natürlichem, würdigem Deutsch wieder.
- source_word: κολάζεται
  choice: wird … bestraft
  rationale: Die passive Verbform wird unmittelbar als „wird bestraft“ wiedergegeben, ohne Art oder Urheber der Strafe näher festzulegen.
- source_word: δι’ ὧν … δι’ ἐκείνων
  choice: durch eben das, wodurch …
  rationale: Die korrelative Wiederaufnahme betont, dass gerade das Mittel oder der Bereich der Übertretung auch zum Mittel oder Bereich der Bestrafung wird. Im Deutschen lässt sich dies prägnant mit „durch eben das, wodurch“ ausdrücken.
theological_decisions:
- issue: Urheber und genauer Mechanismus der Bestrafung
  choice: Nicht näher bestimmt
  alternative: Ausdrückliche Zuschreibung der Strafe an Gott oder Deutung als natürliche Folge
  rationale: Der griechische Passivsatz nennt weder den Handelnden noch erklärt er, wie die Strafe eintritt. Diese Offenheit bleibt erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit sentenzhaftem und würdigem Ton. Das generische ἄνθρωπος wird als „ein Mensch“ wiedergegeben.
source_grounding:
  english_pob_role: consult_only
