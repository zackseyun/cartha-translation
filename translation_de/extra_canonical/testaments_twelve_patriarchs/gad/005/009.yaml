base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/009.yaml
  text: For God brought upon me a disease of the liver, and if the prayers of my father had not helped me, my spirit would almost have failed.
translation:
  language: de
  text: Denn Gott brachte eine Leberkrankheit über mich; und hätten mir die Gebete meines Vaters nicht geholfen, wäre mein Geist beinahe geschwunden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐπήγαγε ... μοι ὁ Θεὸς νόσον ἥπατος
  choice: Gott ließ eine Leberkrankheit über mich kommen
  rationale: Bewahrt Gottes ausdrückliche Verursachung beziehungsweise Veranlassung, ohne das im Deutschen härter klingende „brachte“ mechanisch nachzubilden.
- source_word: αἱ εὐχαὶ τοῦ πατρός μου
  choice: die Gebete meines Vaters
  rationale: εὐχαί bezeichnet hier im Kontext an Gott gerichtete Gebete; der Plural bleibt erhalten.
- source_word: ἐβοήθησάν μοι
  choice: mir ... geholfen
  rationale: Direkte, natürliche Wiedergabe des Aorists von βοηθέω.
- source_word: ὀλίγου δεῖν ἐξέλειπε τὸ πνεῦμα μου
  choice: wäre mein Geist beinahe gewichen
  rationale: ὀλίγου δεῖν drückt ein Beinahe-Eintreten aus; ἐκλείπω bedeutet hier schwinden oder weichen. „Geist“ hält die mögliche Bedeutungsbreite von πνεῦμα offen.
theological_decisions:
- issue: Gottes Verhältnis zur Krankheit
  choice: Gott ließ eine Leberkrankheit über mich kommen
  alternative: Gott brachte eine Leberkrankheit über mich
  rationale: Der Satz schreibt das Geschehen Gott zu. „ließ ... kommen“ wahrt diese Zuschreibung, ohne über die Aussage hinaus die genaue Art göttlicher Kausalität festzulegen.
- issue: Wirkung der Gebete des Vaters
  choice: hätten mir die Gebete meines Vaters nicht geholfen
  alternative: wären mir die Gebete meines Vaters nicht zu Hilfe gekommen
  rationale: Die konkrete Wirksamkeit der Gebete wird nicht abgeschwächt; zugleich wird kein besonderes Modell ihrer Vermittlung ergänzt.
- issue: Bedeutung von πνεῦμα
  choice: mein Geist
  alternative: mein Lebensatem / mein Leben
  rationale: „Geist“ entspricht der üblichen Grundbedeutung und erhält die Ambiguität zwischen innerem Geist und Lebenskraft.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Satzführung. Der irreale Bedingungssatz wird idiomatisch mit Konjunktiv II wiedergegeben; keine Fußnoten erforderlich.
