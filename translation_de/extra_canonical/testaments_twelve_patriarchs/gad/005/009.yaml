source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 9. Ἐπήγαγε γάρ⁴¹ μοι ὁ Θεὸς νόσον ἥπατος, καὶ εἰ μὴ⁵⁷ *αἱ εὐχαὶ⁵⁸ τοῦ πατρός μου⁵⁹ *ἐβοήθησάν μοι⁶⁰, ὀλίγου δεῖν⁶¹ *ἐξέλειπε τὸ πνεῦμα μου⁶².
