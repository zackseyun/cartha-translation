source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 4. *Οὐ καταλαλεῖ³⁷ *ἀνδρὸς ὁσίου³⁸, ἐπειδὴ ὁ φόβος τοῦ Θεοῦ³⁹ *οἰκεῖ ἐν αὐτῷ⁴⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/004.yaml
  text: He does not speak against a holy man, because the fear of God dwells in him.
translation:
  language: de
  text: Er redet keinem frommen Mann schlecht nach, denn die Furcht Gottes wohnt in ihm.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: καταλαλεῖ
  choice: redet … verleumderisch über
  rationale: Das Verb bezeichnet abwertendes oder verleumderisches Reden gegen bzw. über jemanden. Die Formulierung gibt sowohl den Redeakt als auch seinen schädigenden Charakter in natürlichem Deutsch wieder.
- source_word: ἀνδρὸς ὁσίου
  choice: einen frommen Mann
  rationale: ὅσιος bezeichnet einen Menschen, der Gott gegenüber fromm und recht handelt. „Fromm“ ist hier verständlicher und kontextgerechter als das stärker statusbezogene „heilig“.
- source_word: ὁ φόβος τοῦ Θεοῦ
  choice: die Furcht Gottes
  rationale: Die traditionelle und präzise Wendung bewahrt die religiöse Bedeutung von ehrfürchtiger Gottesfurcht, ohne sie auf bloße Angst oder allgemeine Ehrfurcht zu verengen.
- source_word: οἰκεῖ ἐν αὐτῷ
  choice: wohnt in ihm
  rationale: Die konkrete Wohnmetapher des griechischen Textes wird unmittelbar bewahrt.
theological_decisions:
- issue: Bezug des Pronomens αὐτῷ
  choice: „in ihm“ bleibt ohne ausdrückliche Auflösung stehen
  alternative: „in dem frommen Mann“ oder „in dem, der nicht verleumdet“
  rationale: Das maskuline Pronomen kann grammatisch auf den handelnden Mann oder auf den zuvor genannten frommen Mann bezogen werden. Die deutsche Formulierung bewahrt diese echte Bezugsmehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit enger Bindung an den griechischen Satzbau. Die Aussage bleibt knapp; die metaphorische Sprache und die Mehrdeutigkeit des Pronomenbezugs werden nicht geglättet.
