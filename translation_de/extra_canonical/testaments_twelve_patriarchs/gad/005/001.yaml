source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: V. ⸀Κακὸν οὖν¹ ἐστι² τὸ μῖσος³, ὅτι *ἐνδελεχεῖ συνεχῶς³ *τῷ ψεύδει, λαλῶν⁴ κατὰ τῆς⁵ ἀληθείας, καὶ τὰ μικρὰ μεγάλα ποιεῖ⁶, τὸ *φῶς σκότος⁷ παρέχει⁸, καὶ⁹ τὸ γλυκὺ πικρὸν λέγει¹⁰, ⸀καὶ⸀ συκοφαντίαν¹¹ ἐκδιδάσκει *καὶ ὀργὴν¹² ⸀ἐκταράσσει⸀¹³ καὶ πόλεμον ⸀διεγείρει⸀¹⁴, καὶ ὕβριν¹⁵ καὶ πᾶσαν πλεονεξίαν, κακῶν¹⁶ καὶ¹⁷ ἰοῦ διαβολικοῦ τὴν καρδίαν ἐκπληροῖ¹⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/001.yaml
  text: Hatred, then, is evil, because it continually associates with falsehood, speaking against the truth; it makes small things great, presents light as darkness, and calls the sweet bitter. It teaches slander, stirs up wrath and war, and fills the heart with insolence and every greed, with evils and a devilish poison.
translation:
  language: de
  text: Hass ist also etwas Böses, denn er ist fortwährend mit der Lüge verbunden und redet gegen die Wahrheit. Er macht das Kleine groß, stellt das Licht als Finsternis hin und nennt das Süße bitter. Er lehrt Verleumdung, entfacht Zorn und Krieg und erfüllt das Herz mit Überheblichkeit und jeder Art von Habgier, mit Bösem und teuflischem Gift.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ μῖσος
  choice: Hass
  rationale: Die direkte und natürliche deutsche Entsprechung; der Artikel kann im Deutschen bei der abstrakten Aussage entfallen.
- source_word: ἐνδελεχεῖ συνεχῶς τῷ ψεύδει
  choice: hält sich beständig zur Lüge
  rationale: Bewahrt die Vorstellung einer fortdauernden Verbindung mit der Lüge; der ungewöhnliche Dativ wird nicht spekulativ präzisiert.
- source_word: τὰ μικρὰ μεγάλα ποιεῖ
  choice: macht das Kleine groß
  rationale: Gibt die antithetische, prägnante Form des Griechischen wieder.
- source_word: τὸ φῶς σκότος παρέχει
  choice: stellt das Licht als Finsternis hin
  rationale: Drückt das irreführende Darstellen des Lichts als Dunkelheit idiomatisch aus.
- source_word: συκοφαντίαν
  choice: Verleumdung
  rationale: Im Kontext bezeichnet der Ausdruck verleumderische falsche Beschuldigung.
- source_word: ὕβριν
  choice: Überheblichkeit
  rationale: Erfasst hier anmaßende, verletzende Selbstüberhebung, ohne den Sinn auf bloßen Stolz zu verengen.
- source_word: πᾶσαν πλεονεξίαν
  choice: jede Art von Habgier
  rationale: πλεονεξία bezeichnet das gierige Verlangen nach mehr; πᾶσαν wird idiomatisch als umfassende Formulierung wiedergegeben.
- source_word: ἰοῦ διαβολικοῦ
  choice: teuflischem Gift
  rationale: ἰός bedeutet Gift; διαβολικός wird als attributives „teuflisch“ wiedergegeben, ohne den Ausdruck weiter auszudeuten.
theological_decisions:
- issue: Personifikation des Hasses
  choice: 'Die grammatische Personifikation wird durchgehend bewahrt: „er … redet … macht … lehrt“ usw.'
  alternative: Unpersönliche Formulierungen wie „Hass führt dazu, dass …“
  rationale: Das Griechische schreibt dem Hass unmittelbar handelnde Tätigkeiten zu; diese rhetorische Gestalt soll nicht abgeschwächt werden.
- issue: διαβολικός als religiös-moralische Qualifikation
  choice: „teuflisch“
  alternative: „verleumderisch“ oder „vom Teufel stammend“
  rationale: Die naheliegende adjektivische Bedeutung bleibt erhalten, ohne die Herkunftsbeziehung dogmatisch genauer festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klaren Hauptsätzen. Die bildhaften Gegensätze und die personifizierende Redeweise des griechischen Textes bleiben erhalten; unnötige konfessionelle oder interpretierende Zusätze wurden vermieden.
