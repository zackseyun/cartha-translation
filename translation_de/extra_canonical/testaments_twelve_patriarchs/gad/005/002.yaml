source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 2. *Ταῦτα οὖν¹⁹ ἐκ πείρας²⁰ λέγω ὑμῖν, τέκνα μου, ὅπως ἐξώσητε²¹ τὸ μῖσος *τὸ διαβολικόν²², καὶ κολληθῆτε τῇ ἀγάπῃ τοῦ²³ Θεοῦ²⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/002.yaml
  text: Therefore I say these things to you from experience, my children, so that you may drive out devilish hatred and cling to the love of God.
translation:
  language: de
  text: Das sage ich euch also aus Erfahrung, meine Kinder, damit ihr den teuflischen Hass vertreibt und an der Liebe Gottes festhaltet.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκ πείρας
  choice: aus Erfahrung
  rationale: Gibt die persönliche, erfahrungsbasierte Aussage natürlich und genau wieder.
- source_word: ἐξώσητε
  choice: vertreibt
  rationale: Bewahrt die kräftige Bedeutung des Hinaustreibens bzw. Beseitigens.
- source_word: τὸ μῖσος τὸ διαβολικόν
  choice: den teuflischen Hass
  rationale: Gibt die attributive Verbindung wieder, ohne sie unnötig dogmatisch auszudeuten.
- source_word: κολληθῆτε
  choice: festhaltet
  rationale: Drückt die enge, beständige Bindung idiomatisch aus; wörtlicher wäre „euch anschließt“ oder „anhaftet“.
- source_word: τῇ ἀγάπῃ τοῦ Θεοῦ
  choice: an der Liebe Gottes
  rationale: 'Bewahrt die grammatische Mehrdeutigkeit des Genitivs: Gottes Liebe zu anderen oder die auf Gott gerichtete Liebe.'
theological_decisions:
- issue: Bedeutung von „Liebe Gottes“
  choice: Liebe Gottes
  alternative: Liebe zu Gott / Gottes Liebe
  rationale: Der griechische Genitiv τοῦ Θεοῦ legt nicht eindeutig fest, ob Gottes eigene Liebe oder die Liebe zu Gott gemeint ist; die deutsche Genitivkonstruktion bewahrt diese Spannung.
- issue: διαβολικόν als Charakterisierung des Hasses
  choice: teuflischen Hass
  alternative: Hass des Teufels
  rationale: Das griechische Adjektiv wird als Eigenschaft wiedergegeben und nicht in eine eindeutige Herkunfts- oder Besitzangabe umgedeutet.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem paränetischem Ton. Die Anrede „meine Kinder“ und die kräftigen Handlungsverben bleiben erhalten.
