    issue: Unnatürliche Wiedergabe von κατὰ Θεόν
    rationale: „die Gott entspricht“ ist im modernen Standarddeutsch stilistisch holprig. „nach Gottes Willen“ ist eine etablierte und natürliche Formulierung für die an Gott ausgerichtete Bedeutung der Wendung.
