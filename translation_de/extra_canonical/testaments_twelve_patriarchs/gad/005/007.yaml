  to: Denn die wahre Umkehr nach Gottes Willen [beseitigt die Unwissenheit und][a] vertreibt die Finsternis; sie erleuchtet die Augen, schenkt der Seele Erkenntnis und führt das Denken zum Heil.
  rationale: Die Übersetzung wird nur bei der idiomatischen Wiedergabe von κατὰ Θεόν korrigiert. Die eckigen Klammern bleiben exakt bei der im griechischen Text unsicheren Wortgruppe einschließlich der verbindenden Konjunktion; der Fußnotenanker bleibt unmittelbar an dieser Gruppe.
  reviewer_model: gpt-5.6-terra
