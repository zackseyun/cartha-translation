source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 7. Ἡ γὰρ κατὰ Θεὸν ἀληθὴς⁵¹ μετάνοια⁵² [ἀναιρεῖ *τὴν ἄγνοιαν⁵³ καὶ] φυγαδεύει τὸ σκότος, καὶ φωτίζει τοὺς ὀφθαλμοὺς καὶ γνῶσιν παρέχει τῇ ψυχῇ, καὶ ὁδηγεῖ *τὸ διαβούλιον⁵⁴ *πρὸς σωτηρίαν⁵⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/007.yaml
  text: For true repentance according to God [removes ignorance and] puts darkness to flight, enlightens the eyes, gives knowledge to the soul, and guides the mind toward salvation.
translation:
  language: de
  text: Denn die wahre Umkehr nach Gottes Willen [beseitigt die Unwissenheit und][a] vertreibt die Finsternis; sie erleuchtet die Augen, schenkt der Seele Erkenntnis und führt das Denken zum Heil.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die eingeklammerten Worte sind in der griechischen Textüberlieferung unsicher.
    reason: Die Vorlage kennzeichnet ἀναιρεῖ τὴν ἄγνοιαν καὶ durch eckige Klammern als textkritisch unsicher; diese Unsicherheit soll in der Übersetzung sichtbar bleiben.
lexical_decisions:
- source_word: ἡ κατὰ Θεὸν ἀληθὴς μετάνοια
  choice: die wahre Umkehr, die Gott entspricht
  rationale: μετάνοια wird mit dem geläufigen und würdigen „Umkehr“ wiedergegeben. κατὰ Θεόν bezeichnet eine an Gott ausgerichtete beziehungsweise seinem Willen entsprechende Umkehr, ohne die Wendung konfessionell zu verengen.
- source_word: φυγαδεύει τὸ σκότος
  choice: vertreibt die Finsternis
  rationale: φυγαδεύει bedeutet wörtlich, etwas in die Flucht zu schlagen; „vertreibt“ bewahrt das kräftige Bild in natürlichem Deutsch.
- source_word: γνῶσιν παρέχει τῇ ψυχῇ
  choice: schenkt der Seele Erkenntnis
  rationale: γνῶσις ist hier „Erkenntnis“; παρέχει wird idiomatisch mit „schenkt“ wiedergegeben, ohne einen besonderen technischen Erkenntnisbegriff einzuführen.
- source_word: τὸ διαβούλιον
  choice: das Denken
  rationale: Das seltene Substantiv bezeichnet das überlegende beziehungsweise beratende Denkvermögen. „Das Denken“ ist verständlich und bleibt näher an dieser inneren geistigen Tätigkeit als „Absicht“ oder „Entschluss“.
- source_word: πρὸς σωτηρίαν
  choice: zum Heil
  rationale: σωτηρία kann Rettung oder Heil bedeuten. Im moralisch-religiösen Zusammenhang ist „zum Heil“ natürlich und lässt den umfassenden Sinn bestehen.
theological_decisions:
- issue: Bedeutung von κατὰ Θεόν
  choice: die Gott entspricht
  alternative: nach Gottes Willen / gottgemäß
  rationale: Die Formulierung drückt die Ausrichtung an Gott aus, ohne genauer festzulegen, ob vor allem Ursprung, Maßstab oder Wirkung gemeint ist.
- issue: Bezug von σωτηρία
  choice: Heil ohne nähere Bestimmung
  alternative: Rettung
  rationale: Der griechische Text erläutert Art und Zeitpunkt des Heils nicht. Die Übersetzung lässt diese theologische Offenheit bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die wiederholten Verben bewahren die rhetorische Steigerung des griechischen Textes; das Semikolon gliedert die längere Aufzählung, ohne ihren Zusammenhang aufzulösen.
