source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 5. Φοβούμενος γὰρ⁴¹ μὴ προσκρούσαι⁴² Κυρίῳ⁴³, οὐ θέλει τὸ καθόλου⁴⁴ οὐδὲ⁴⁵ ἕως ἐννοίας⁴⁶ ἀδικῆσαι ἄνθρωπον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/005.yaml
  text: For, fearing lest he offend the Lord, he does not wish at all, not even in thought, to wrong a man.
translation:
  language: de
  text: Denn aus Furcht, dem Herrn Anstoß zu geben, will er überhaupt keinem Menschen Unrecht tun, nicht einmal in Gedanken.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φοβούμενος
  choice: weil er fürchtet
  rationale: Das Partizip gibt den Beweggrund für die folgende Haltung an; die kausale Wiedergabe ist im Deutschen natürlich und bewahrt den Zusammenhang.
- source_word: προσκρούσαι Κυρίῳ
  choice: sich gegen den Herrn zu verfehlen
  rationale: προσкρούω mit Dativ bezeichnet hier ein Anstoßnehmen beziehungsweise Sich-Vergehen gegenüber dem Herrn. „Sich verfehlen“ wahrt den moralisch-religiösen Sinn, ohne ihn unnötig zuzuspitzen.
- source_word: τὸ καθόλου
  choice: überhaupt kein
  rationale: Die Wendung verstärkt die vollständige Ablehnung des Unrechttuns; zusammen mit der deutschen Negation wird sie idiomatisch als „überhaupt kein“ wiedergegeben.
- source_word: ἕως ἐννοίας
  choice: nicht einmal in Gedanken
  rationale: Wörtlich reicht die Aussage „bis zum Gedanken“; idiomatisches Deutsch bringt die Steigerung mit „nicht einmal in Gedanken“ zum Ausdruck.
- source_word: ἀδικῆσαι ἄνθρωπον
  choice: einem Menschen Unrecht tun
  rationale: Dies entspricht der üblichen ethischen Bedeutung von ἀδικέω und bewahrt den unbestimmten, allgemeinmenschlichen Bezug von ἄνθρωπον.
theological_decisions:
- issue: Art der Verfehlung gegenüber dem Herrn
  choice: sich gegen den Herrn verfehlen
  alternative: den Herrn beleidigen
  rationale: Die gewählte Formulierung lässt offen, ob eine Kränkung, ein Anstoß oder allgemeiner moralischer Ungehorsam gemeint ist, und vermeidet eine unnötige Festlegung auf ein emotionales Verständnis.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die zweifache Verstärkung des griechischen Satzes wird durch „überhaupt kein … nicht einmal in Gedanken“ klar und natürlich wiedergegeben.
