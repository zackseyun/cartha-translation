  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/008.yaml
  text: And he did not learn this from men, but through repentance he knows how to receive those who turn back.
translation:
  language: de
  text: Und er hat dies nicht von Menschen gelernt, sondern weiß durch Umkehr diejenigen anzunehmen, die umkehren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „sondern versteht es, aufgrund von Umkehr diejenigen aufzunehmen, die zurückkehren.“ Der griechische Ausdruck lässt offen, auf wessen Umkehr sich „durch Umkehr“ bezieht.'
    reason: Die Stellung von διὰ μετανοίας und das fehlende Bezugswort erzeugen eine echte syntaktisch-theologische Mehrdeutigkeit.
lexical_decisions:
- source_word: μετάνοια
  choice: Umkehr
  rationale: Bezeichnet eine innere Sinnesänderung mit entsprechender Hinwendung; „Umkehr“ ist verständlich und bewahrt den religiös-ethischen Gehalt.
- source_word: τοὺς ἐπιστρέφοντας
  choice: diejenigen, die umkehren
  rationale: Gibt das substantivierte Präsenspartizip wieder und erhält die bewusste Wiederholung des Wortfelds von Umkehr und Rückkehr.
- source_word: δέχεσθαι
  choice: anzunehmen
  rationale: Drückt das Aufnehmen beziehungsweise willkommene Annehmen der Umkehrenden natürlich aus.
theological_decisions:
- issue: Syntaktische Zuordnung von διὰ μετανοίας
  choice: „durch Umkehr“ wird eng bei „weiß … anzunehmen“ belassen
  alternative: „sondern durch Umkehr weiß er diejenigen anzunehmen“ oder eine Zuordnung zur Umkehr der Zurückkehrenden
  rationale: Der griechische Wortlaut lässt offen, wessen Umkehr gemeint ist und wie genau die Präpositionalphrase syntaktisch zu beziehen ist. Die Übersetzung bewahrt diese Spannung, ohne einen ausdrücklichen Besitzer einzufügen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung „Umkehr … umkehren“ spiegelt die verwandten griechischen Begriffe und wird trotz stilistischer Nähe beibehalten.
