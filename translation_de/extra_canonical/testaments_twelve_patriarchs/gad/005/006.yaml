  text: 6. Ταῦτα *ἐγὼ ἔσχατον⁴⁷ ἔγνων μετὰ τὸ μετανοῆσαί⁴⁸ με περὶ⁴⁹ Ἰωσήφ⁵⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/006.yaml
  text: These things I learned at last after I repented concerning Joseph.
translation:
  language: de
  text: Das erkannte ich schließlich, nachdem ich meine Haltung gegenüber Josef bereut hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ταῦτα
  choice: Das
  rationale: Der griechische Plural bezeichnet hier zusammenfassend die zuvor genannten Zusammenhänge; im Deutschen ist der kollektive Singular „das“ natürlich.
- source_word: ἔσχατον
  choice: schließlich
  rationale: Das adverbial gebrauchte Wort bedeutet hier „zuletzt/schließlich“ und bezeichnet den späten Zeitpunkt der Erkenntnis.
- source_word: ἔγνων
  choice: erkannte ich
  rationale: „Erkennen“ gibt den punktuellen Erkenntnisgewinn von ἔγνων prägnant wieder.
- source_word: μετὰ τὸ μετανοῆσαί με
  choice: nachdem ich … umgekehrt war
  rationale: μετανοεῖν bezeichnet hier eine innere und moralische Umkehr, nicht bloß eine neutrale Meinungsänderung.
- source_word: περὶ Ἰωσήφ
  choice: wegen Josef
  rationale: περί kann den Gegenstand der Umkehr („in Bezug auf Josef“) oder ihren Anlass bezeichnen. „Wegen Josef“ ist natürlich und bewahrt den Bezug, ohne den konkreten Inhalt auszuführen.
theological_decisions:
- issue: Bedeutungsumfang von μετανοεῖν
  choice: umgekehrt war
  alternative: meine Haltung gegenüber Josef bereut hatte
  rationale: „Umkehren“ wahrt die religiös-moralische Tiefe des Verbs, ohne eine spezifische konfessionelle Bußlehre einzutragen. Die Alternative erklärt den Bezug stärker, legt aber den griechischen Ausdruck enger aus.
translation_notes:
  register: Kurzer, würdevoller Aussagesatz in modernem Standarddeutsch. Der Satzbau folgt dem griechischen Gedankengang, klingt jedoch idiomatisch; „Josef“ entspricht der heute üblichen deutschen Namensform.
