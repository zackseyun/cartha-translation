  naturalness: „Dem Josef gegenüber erbarmungslos gestimmt“ ist verständlich und würdig, aber „gegen Josef erbarmungslos gesinnt“ ist im Deutschen etwas unmittelbarer und bildet die gegnerische Ausrichtung klarer ab. „an der Leber leidend“ ist angemessen, da die konkrete Organbezeichnung und die Spiegelung erhalten bleiben.
  terminology: „Leber“, „erbarmungslos“, „gerichtet“ und „Josef“ sind korrekt gewählt. Das ungenannte Passiv bei „wurde ... gerichtet“ wahrt die Offenheit des griechischen Passivs. Für ἐπείχον τῷ Ἰωσήφ wird „gegen Josef vorging“ gewählt; dies gibt die feindselig bedrängende Ausrichtung wieder, ohne eine spezifische Handlung zu behaupten.
