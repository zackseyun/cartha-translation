  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/005/011.yaml
  text: Since, then, my liver was pitilessly set against Joseph, I too, suffering in my liver, was judged pitilessly for ten years.
translation:
  language: de
  text: Weil also meine Leber gegen Josef erbarmungslos gesinnt war, wurde auch ich, an der Leber leidend, zehn Jahre lang erbarmungslos gerichtet, während der Zeit, in der ich gegen Josef vorging.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ ἥπατά μου / τῷ ἥπατι
  choice: meine Leber / an der Leber
  rationale: Die konkrete Organbezeichnung wird in beiden Vorkommen bewahrt, da der Satz eine bewusste Entsprechung zwischen der inneren Haltung gegen Josef und dem Leiden an demselben Organ herstellt.
- source_word: ἀνίλεως
  choice: erbarmungslos
  rationale: Das wiederholte Adverb wird an beiden Stellen gleich wiedergegeben, um die vergeltende Spiegelung des griechischen Satzes zu erhalten.
- source_word: ἐκρινόμην
  choice: wurde … gerichtet
  rationale: Die passive Form und ihre mögliche Bedeutung als göttliches beziehungsweise vergeltendes Gericht bleiben erhalten, ohne den Handelnden ausdrücklich zu benennen.
- source_word: ἐπὶ χρόνους δέκα
  choice: zehn Jahre lang
  rationale: Im Kontext und gemäß der überlieferten Lesart bezeichnet χρόνοι hier Jahre; die Dauer wird idiomatisch deutsch ausgedrückt.
- source_word: κατὰ τοῦ Ἰωσήφ
  choice: dem Josef gegenüber
  rationale: Gibt die feindselige Ausrichtung gegen Josef natürlich wieder, ohne eine über den Text hinausgehende konkrete Handlung einzutragen.
theological_decisions:
- issue: Ungenannter Urheber des Gerichts
  choice: 'Passiv: „wurde … gerichtet“'
  alternative: „Gott richtete mich“ oder „ich wurde bestraft“
  rationale: Der griechische Text nennt den Handelnden nicht. Das Passiv bewahrt diese Offenheit und vermeidet, die Art des Gerichts ausdrücklich festzulegen.
- issue: Vergeltende Entsprechung zwischen Haltung und Leiden
  choice: Wiederholung von „erbarmungslos“ und „Leber“
  alternative: Freie Wiedergabe als „Für meinen Hass wurde ich mit einer Leberkrankheit bestraft“
  rationale: Die formale Spiegelung trägt die Aussage, ohne den Zusammenhang stärker kausal oder dogmatisch auszudeuten, als es der Satz selbst tut.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewohnte Rede von der Leber bleibt bewusst erhalten, weil sie für die Bild- und Vergeltungsstruktur des Originals wesentlich ist. „Josef“ folgt der üblichen deutschen biblischen Namensform.
