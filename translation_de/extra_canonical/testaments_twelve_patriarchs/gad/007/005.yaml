base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/005.yaml
  text: For if what was taken away in evil is taken from him, or if he repents, he is forgiven; but if he remains unrepentant, he is kept for eternal punishment.
translation:
  language: de
  text: Denn wenn ihm das, was im Bösen weggenommen wurde, wieder genommen wird, oder wenn er umkehrt, wird ihm vergeben; bleibt er aber ohne Umkehr, wird er für ewige Strafe aufbewahrt.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Wortlaut des ersten Satzteils ist textlich und syntaktisch unsicher; wörtlich etwa: „wenn ihm das im Bösen Weggenommene genommen wird“.'
    reason: Die Editionszeichen und die ungewöhnliche Konstruktion mit ἀφαιρεῖται, αὐτά und ἐν κακοῖς zeigen eine unsichere Überlieferung. Die Fußnote bewahrt diese Unsicherheit, statt eine eindeutige Deutung vorzutäuschen.
lexical_decisions:
- source_word: μετανοήσαντι / ἀμετανόητος
  choice: wenn er umkehrt / ohne Umkehr
  rationale: Die Wortfamilie bezeichnet eine innere und praktische Umkehr. Die parallele Wiedergabe bewahrt den Zusammenhang der beiden griechischen Formen und ist in modernem Deutsch verständlich.
- source_word: ἀφίησι
  choice: wird ihm vergeben
  rationale: Obwohl die überlieferte Form aktiv ist („er vergibt“), ist das Subjekt im schwierigen griechischen Satz nicht ausdrücklich genannt. Die unpersönliche deutsche Form bewahrt den Sinn, ohne ein Subjekt wie Gott ausdrücklich in den Text einzutragen.
- source_word: τηρεῖται
  choice: wird … aufbewahrt
  rationale: Die passive Form bedeutet wörtlich „wird bewahrt/aufbewahrt“ und lässt offen, wer ihn verwahrt.
- source_word: αἰωνίαν κόλασιν
  choice: ewige Strafe
  rationale: Dies ist die direkte und geläufige Wiedergabe; die Dauerangabe und der Strafcharakter werden nicht abgeschwächt.
theological_decisions:
- issue: Bedingung der Vergebung
  choice: „wenn er umkehrt, wird ihm vergeben“
  alternative: „dem Umgekehrten vergibt er“
  rationale: Der griechische Dativ μετανοήσαντι und das aktive ἀφίησι lassen sich formal so lesen, doch das unausgesprochene Subjekt und die gestörte Syntax sprechen für eine natürliche, theologisch nicht weiter festlegende Wiedergabe.
- issue: Handelnder bei Vergebung und Gericht
  choice: Passivformulierungen ohne ausdrückliche Nennung Gottes
  alternative: „Gott vergibt ihm“ und „Gott bewahrt ihn auf“
  rationale: Der Zusammenhang mag Gott als Handelnden voraussetzen, aber der vorliegende griechische Wortlaut nennt ihn nicht ausdrücklich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Umkehr“ hält die positive und negative Formulierung eng zusammen; „ohne Umkehr“ vermeidet das heute weniger alltägliche „unbußfertig“. Der schwer verständliche erste Halbsatz bleibt bewusst nahe am überlieferten Wortlaut und wird durch eine Fußnote als unsicher gekennzeichnet.
