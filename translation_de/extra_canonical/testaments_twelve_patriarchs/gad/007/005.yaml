review_pass:
  verdict: revise
  source_fidelity: 'Die deutsche Fassung übernimmt aus der englischen Audit-Fassung mehrere nicht im griechischen Wortlaut ausgewiesene Festlegungen: „ihm“, „wieder“ und die Umdeutung von αὐτά zu einem singulären „das ... Weggenommene“. Im Griechischen steht αὐτά als (zudem textkritisch markiertes) Neutrum Plural; auch das Subjekt von ἀφίησι ist nicht genannt. Die Reihung der drei Glieder ist syntaktisch schwierig und muss als solche kenntlich bleiben.'
  naturalness: „Bleibt er aber ohne Umkehr“ ist verständlich, aber gegenüber dem passiven τηρεῖται eine Umformung. Die revidierte Fassung ist bewusst zurückhaltend und bleibt trotz der gestörten Satzfügung in modernem, würdigem Deutsch lesbar.
  terminology: „Umkehrender“ / „unbußfertig“ gibt μετανοήσαντι / ἀμετανόητος als zusammengehörige Wortfamilie angemessen wieder. „Ewige Strafe“ entspricht αἰωνίαν κόλασιν; „bewahrt wird“ wahrt das Passiv von τηρεῖται.
  issues:
  - severity: high
    issue: Unbelegte Ergänzungen und Numeruswechsel im ersten Glied
    rationale: „ihm“, „wieder“ und das Singular-Neutrum „das ... Weggenommene“ haben keine eindeutige Grundlage im überlieferten εἰ ἀφαιρεῖται αὐτά ἐν κακοῖς. αὐτά ist Neutrum Plural und textkritisch markiert. Die englische Audit-Fassung bietet ebenfalls eine stark glättende, aber nicht am griechischen Numerus orientierte Deutung.
  - severity: medium
    issue: Aktives ἀφίησι wird ohne ausreichenden Anlass passiviert
    rationale: „wird ihm vergeben“ verschweigt nicht nur das im Griechischen ungenannte Subjekt, sondern verändert auch die aktive Verbform. „er einem Umkehrenden vergibt“ hält das ungenannte Subjekt und den Dativ μετανοήσαντι sichtbar.
  - severity: medium
    issue: τηρεῖται wird als aktives Verbleiben wiedergegeben
    rationale: „bleibt ... ohne Umkehr“ gibt den Sinn nur indirekt wieder; τηρεῖται ist ein Passiv („wird bewahrt/aufbewahrt“).
  revised_text: Denn wenn diese Dinge in Übeln weggenommen werden, oder wenn er einem Umkehrenden vergibt, oder wenn er unbußfertig zu ewiger Strafe bewahrt wird.[a]
  revised_footnotes:
  - marker: a
    text: Der griechische Satz ist textlich und syntaktisch unsicher. Insbesondere ist αὐτά („diese Dinge“, Neutrum Plural) in der Edition kritisch markiert; das Subjekt von „vergibt“ wird nicht genannt. Die Reihung der Satzglieder folgt deshalb dem überlieferten Wortlaut, ohne ihren Zusammenhang weiter festzulegen.
    reason: Die Fußnote kennzeichnet die durch Editionszeichen und Syntax angezeigte Unsicherheit und verhindert, dass die deutsche Fassung die nicht gesicherten Ergänzungen „ihm“ oder „wieder“ voraussetzt.
  revision_rationale: Die Revision folgt dem griechischen Wortlaut vor der englischen Audit-Fassung. Sie bewahrt den Plural von αὐτά, das aktive „vergibt“ mit ungenanntem Subjekt, den Dativ „einem Umkehrenden“ und das Passiv „wird ... bewahrt“. Wegen der erkennbar schwierigen Überlieferung wird keine harmonisierende Deutung des gesamten Bedingungssatzes behauptet.
