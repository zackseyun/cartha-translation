id: T12P.GAD.7.1
reference: Testament of Gad 7:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: VII. Ἐὰν *δὲ εἰς¹ ὑπὲρ ὑμᾶς εὐοδοῦται μὴ λυπεῖσθε², ἀλλ᾿³ εὔχεσθε ὑπὲρ αὐτοῦ⁴ ἵνα τελειωθῇ⁵. *οὕτως γὰρ ἐστιν ὑμῖν συμφέρον⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/001.yaml
  text: But if someone prospers more than you, do not be grieved; rather, pray for him, that he may be made complete. For in this way it is to your advantage.
translation:
  language: de
  text: Wenn es aber jemandem besser ergeht als euch, seid nicht betrübt, sondern betet für ihn, damit er zur Vollendung gelangt. Denn so ist es zu eurem Vorteil.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εὐοδοῦται
  choice: es besser ergeht
  rationale: Das Verb bezeichnet hier Wohlergehen oder Gedeihen; die unpersönliche deutsche Wendung klingt natürlich und bewahrt den Vergleich ὑπὲρ ὑμᾶς.
- source_word: μὴ λυπεῖσθε
  choice: seid nicht betrübt
  rationale: Gibt die emotionale Bedeutung von λυπέομαι direkt wieder, ohne ausdrücklich Neid als Motiv einzutragen.
- source_word: εὔχεσθε ὑπὲρ αὐτοῦ
  choice: betet für ihn
  rationale: Im Kontext ist εὔχομαι als Beten zu verstehen; ὑπέρ bezeichnet die Person, für die gebetet wird.
- source_word: τελειωθῇ
  choice: zur Vollendung gelangt
  rationale: 'Bewahrt die offene Bedeutung des Passivs: vollständig, reif oder vollendet werden, ohne eine bestimmte Art der Vollendung festzulegen.'
- source_word: συμφέρον
  choice: zu eurem Vorteil
  rationale: Entspricht dem Nutzen oder Förderlichen für die Angeredeten und ist idiomatisches modernes Deutsch.
theological_decisions:
- issue: Bedeutung der Vollendung in τελειωθῇ
  choice: Die Art der Vollendung bleibt unbestimmt.
  alternative: damit er vollkommen gemacht wird
  rationale: Der griechische Text nennt weder den Handelnden noch ausdrücklich eine moralische oder geistliche Vollkommenheit; die gewählte Formulierung erhält diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Vers folgt dem griechischen Gedankengang eng, vermeidet jedoch schwerfällige Wörtlichkeit. Das adversative δέ wird mit „aber“, ἀλλά mit „sondern“ und οὕτως mit „so“ sichtbar wiedergegeben.
