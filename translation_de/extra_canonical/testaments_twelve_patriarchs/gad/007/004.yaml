  text: 4. Ἐὰν δὲ¹⁵ ἐκ κακῶν¹⁶ τις πλουτήσει, ὡς Ἡσαῦ ὁ πατράδελφός¹⁷ μου, μὴ ζηλώσητε¹⁸· ὅρον¹⁹ γὰρ²⁰ Κυρίου ἐκδέξασθε²¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/004.yaml
  text: But if someone becomes rich through evil, like Esau my father's brother, do not be jealous; rather, await the appointed limit of the Lord.
translation:
  language: de
  text: Wenn aber jemand durch Böses reich wird, wie Esau, der Bruder meines Vaters, dann beneidet ihn nicht; denn wartet auf die Grenze des Herrn.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Grenze“ kann hier auch ein von Gott gesetztes Maß oder einen festgesetzten Endpunkt meinen.
    reason: Die semantische Breite von ὅρον ist im Deutschen erklärungsbedürftig, soll aber im Haupttext nicht voreilig auf „Zeitpunkt“, „Ende“ oder „Gericht“ verengt werden.
lexical_decisions:
- source_word: ἐκ κακῶν
  choice: durch Böses
  rationale: Gibt Herkunft beziehungsweise Mittel des Reichtums wieder, ohne die Mehrdeutigkeit von κακά unnötig auf bestimmte Verbrechen oder unrechtmäßigen Gewinn einzuengen.
- source_word: πλουτήσει
  choice: reich wird
  rationale: Direkte und natürliche Wiedergabe des futurischen Verbs im konditionalen Satz.
- source_word: πατράδελφος
  choice: Bruder meines Vaters
  rationale: Entspricht der transparenten Verwandtschaftsbezeichnung des griechischen Textes; im Deutschen ist dies verständlicher als ein ungewöhnliches Kompositum.
- source_word: μὴ ζηλώσητε
  choice: beneidet ihn nicht
  rationale: Im Kontext des durch Böses erworbenen Reichtums bezeichnet ζηλόω das neidische Begehren beziehungsweise Nacheifern; „beneiden“ bewahrt den unmittelbaren Sinn.
- source_word: ὅρον
  choice: Grenze
  rationale: Bewahrt die konkrete und zugleich offene Bedeutung von ὅρος als Grenze, gesetztes Maß oder festgelegter Endpunkt, ohne im Haupttext eine bestimmte Deutung festzulegen.
- source_word: ἐκδέξασθε
  choice: erwartet
  rationale: Gibt den Imperativ im Sinn geduldigen Erwartens wieder und passt idiomatisch zum Objekt „Grenze“.
theological_decisions:
- issue: Bedeutung der „Grenze des Herrn“
  choice: Die offene Formulierung „Grenze des Herrn“ bleibt im Haupttext erhalten.
  alternative: „der vom Herrn festgesetzte Zeitpunkt“, „das Ende, das der Herr setzt“ oder „das Urteil des Herrn“
  rationale: ὅρον kann eine Grenze, ein festgesetztes Maß oder einen bestimmten Endpunkt bezeichnen. Der Kontext legt göttlich gesetzte Begrenzung beziehungsweise Abrechnung nahe, bestimmt sie aber nicht eindeutig; daher wird die Spannung nicht aufgelöst.
- issue: Funktion von γάρ
  choice: „denn“
  alternative: Auslassung oder adversatives „sondern/vielmehr“
  rationale: 'γάρ begründet die Aufforderung, den bösen Reichen nicht zu beneiden: Statt seinen Wohlstand zum Maßstab zu nehmen, soll man auf Gottes Grenze warten. Eine adversative Umdeutung würde über den Wortlaut hinausgehen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Mahnrede bleibt knapp; „durch Böses“ und „Grenze des Herrn“ bewahren die bewusst offene Ausdrucksweise des griechischen Textes.
