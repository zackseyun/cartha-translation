  text: Examine the judgments of the Lord, and your purpose will be illumined and be at rest.
translation:
  language: de
  text: Prüfe die Urteile des Herrn, und dein Vorhaben wird klar werden und zur Ruhe kommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξέτασον
  choice: Prüfe
  rationale: Der Aoristimperativ fordert zu einer gezielten, sorgfältigen Prüfung auf; „Prüfe“ ist natürlich und bewahrt diesen Aufforderungscharakter.
- source_word: κρίματα Κυρίου
  choice: die Urteile des Herrn
  rationale: κρίματα bezeichnet richterliche Entscheidungen oder Urteile. „Urteile“ wahrt den forensischen und theologischen Gehalt, ohne ihn auf Gebote oder Strafgerichte zu verengen.
- source_word: τὸ διαβούλιόν σου
  choice: dein Vorhaben
  rationale: διαβούλιον kann Überlegung, Entschluss, Plan oder Vorhaben bedeuten. „Vorhaben“ passt als Subjekt sowohl zum Klarwerden als auch zum Zur-Ruhe-Kommen und legt den inneren Vorgang nicht unnötig eng fest.
- source_word: καταλάμψει
  choice: wird … klar werden
  rationale: Das Verb bezeichnet ein Erstrahlen oder Erhelltwerden. Die idiomatische deutsche Wiedergabe „klar werden“ bewahrt das Lichtbild in abgeschwächter Form und vermeidet das unnatürliche „wird erleuchtet werden“, zumal die griechische Form aktiv ist.
- source_word: ἡσυχάσει
  choice: wird … zur Ruhe kommen
  rationale: Das Verb kann ruhig oder still werden beziehungsweise Ruhe finden bedeuten. „Zur Ruhe kommen“ gibt die inchoative Bewegung natürlich wieder.
theological_decisions:
- issue: Beziehung zwischen der Prüfung der Urteile Gottes und der Klärung des menschlichen Vorhabens
  choice: Die Folgewirkung wird mit „dann“ ausgedrückt.
  alternative: 'Eine rein additive Verbindung mit „und“: „… und dein Vorhaben wird …“'
  rationale: Das wiederholte καί verbindet die Aussagen formal, doch der Sinn legt eine Folge nahe. „Dann“ macht diese verständlich, ohne eine bestimmte Lehre über göttliche Führung oder Offenbarung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit knapper weisheitlicher Satzstruktur. Die Übersetzung bleibt nahe am Griechischen, formuliert die beiden bildhaften Prädikate aber idiomatisch.
