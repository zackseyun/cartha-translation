  text: Therefore cast out hatred from your souls, and love one another in uprightness of heart.
translation:
  language: de
  text: Entfernt daher den Hass aus euren Seelen und liebt einander mit aufrichtigem Herzen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἐξάρατε
  choice: Entfernt
  rationale: Der Imperativ bezeichnet das Wegnehmen oder Beseitigen; „entfernt“ gibt dies natürlich und nachdrücklich wieder.
- source_word: μῖσος
  choice: Hass
  rationale: Direkte und im modernen Deutschen geläufige Entsprechung.
- source_word: ψυχῶν
  choice: Seelen
  rationale: Bewahrt die anthropologische Ausdrucksweise des griechischen Textes, ohne sie auf „Herzen“ oder „Inneres“ einzuengen.
- source_word: ἀγαπήσατε ἀλλήλους
  choice: liebt einander
  rationale: Gibt den wechselseitigen Imperativ klar und idiomatisch wieder.
- source_word: ἐν εὐθύτητι καρδίας
  choice: mit aufrichtigem Herzen
  rationale: εὐθύτης bezeichnet Geradheit beziehungsweise Lauterkeit; „mit aufrichtigem Herzen“ ist natürliches Deutsch und bewahrt den ethischen Sinn.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache; der parallele Imperativ und die Bildsprache von Seele und Herz bleiben erhalten.
