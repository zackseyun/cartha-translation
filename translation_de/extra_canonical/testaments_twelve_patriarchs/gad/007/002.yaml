id: T12P.GAD.7.2
reference: Testament of Gad 7:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 2. Καὶ ἐὰν ἐπὶ πλεῖον ὑψοῦται, μὴ φθονεῖτε ⌜αὐτῷ⌝⁷, μνημονεύοντες ὅτι πᾶσα σὰρξ ἀποθανεῖται. Κυρίῳ δὲ ὕμνους⁸ προσφέρετε⁹ τῷ παρέχοντι τὰ καλὰ καὶ¹⁰ συμφέροντα *πᾶσιν ἀνθρώποις¹¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/002.yaml
  text: And if he is exalted still more, do not envy him, remembering that all flesh will die. But offer hymns to the Lord, who provides good and beneficial things to all people.
translation:
  language: de
  text: Und wenn er noch höher emporgehoben wird, beneidet ihn nicht. Denkt daran, dass alles Fleisch sterben wird. Bringt vielmehr dem Herrn Loblieder dar, der allen Menschen Gutes und Förderliches gewährt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐπὶ πλεῖον ὑψοῦται
  choice: noch höher emporgehoben wird
  rationale: Bewahrt den passivischen Ausdruck und die Steigerung des griechischen Textes, ohne festzulegen, worin die Erhöhung besteht.
- source_word: μὴ φθονεῖτε αὐτῷ
  choice: beneidet ihn nicht
  rationale: Gibt φθονεῖν mit dem natürlichen deutschen Ausdruck für neidisches Missgönnen wieder.
- source_word: πᾶσα σὰρξ
  choice: alles Fleisch
  rationale: Erhält die traditionelle, anthropologisch weit gefasste Wendung des griechischen Textes.
- source_word: ὕμνους προσφέρετε
  choice: Bringt … Loblieder dar
  rationale: Gibt sowohl den kultisch gefärbten Darbringungsbegriff προσφέρειν als auch den lobpreisenden Sinn von ὕμνοι wieder.
- source_word: παρέχοντι
  choice: gewährt
  rationale: Bezeichnet den Herrn als den, der das Genannte bereitstellt beziehungsweise zukommen lässt, und klingt im Deutschen würdig und natürlich.
- source_word: τὰ καλὰ καὶ συμφέροντα
  choice: Gutes und Förderliches
  rationale: καλά bezeichnet gute beziehungsweise schöne Dinge; συμφέροντα meint das, was nützt oder zum Wohl gereicht. „Förderliches“ erhält die begriffliche Unterscheidung.
- source_word: πᾶσιν ἀνθρώποις
  choice: allen Menschen
  rationale: Direkte und inklusive Wiedergabe des griechischen Ausdrucks.
theological_decisions:
- issue: Urheber der Erhöhung
  choice: 'Passivisch: „emporgehoben wird“'
  alternative: „noch höher steigt“ oder „Gott ihn noch höher erhöht“
  rationale: Das griechische Passiv nennt den Handelnden nicht. Die Übersetzung wahrt diese Offenheit und fügt weder menschliches Eigenstreben noch ausdrücklich göttliches Handeln ein.
- issue: Reichweite der göttlichen Wohltaten
  choice: „allen Menschen“ ohne Einschränkung
  alternative: „den Menschen insgesamt“ oder eine auf Fromme begrenzte Wiedergabe
  rationale: πᾶσιν ἀνθρώποις ist universal formuliert; eine theologische Einschränkung wäre nicht im Wortlaut begründet.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Sätze wurden zur besseren Verständlichkeit gegliedert; „vielmehr“ gibt den kontrastierenden Anschluss mit δέ idiomatisch wieder. Keine Fußnoten erforderlich.
