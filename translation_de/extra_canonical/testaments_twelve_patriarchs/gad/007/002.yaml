  source_fidelity: 'Die Übersetzung gibt den griechischen Satz vollständig und sachgerecht wieder: Die ungenannte passive Erhöhung (ὑψοῦται), das Neidverbot, die Begründung mit der Sterblichkeit von „allem Fleisch“ sowie die Aufforderung zum Lob des Herrn und dessen Wohltaten für alle Menschen bleiben erhalten. „Förderliches“ differenziert angemessen zwischen τὰ καλά und τὰ συμφέροντα.'
