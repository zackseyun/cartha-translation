  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/007/006.yaml
  text: For the poor man, if being free from envy in all things he is pleasing to the Lord, this one is richer than all, because he does not have the distraction of vain people.
translation:
  language: de
  text: Denn wenn der Arme in allem neidlos ist und dem Herrn gefällt, ist er reicher als alle, weil er die Zerstreuung eitler Menschen nicht kennt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ πένης
  choice: der Arme
  rationale: Gibt die substantivierte Bezeichnung für einen mittellosen Menschen knapp und natürlich wieder.
- source_word: ἄφθονος
  choice: neidlos
  rationale: Im ethischen Zusammenhang bezeichnet ἄφθονος am ehesten das Freisein von φθόνος, also von Neid oder Missgunst. Die mögliche Bedeutung „reichlich/freigebig“ bleibt lexikalisch erwägenswert, passt hier aber weniger klar zur Charakteraussage über den Armen.
- source_word: ἐπὶ πᾶσι
  choice: in allem
  rationale: Bewahrt den weiten Bezug der griechischen Wendung, ohne ihn unnötig festzulegen.
- source_word: ὑπὲρ πάντας πλουτεῖ
  choice: ist er reicher als alle anderen
  rationale: Gibt den Vergleich idiomatisch wieder und erhält das Paradox, dass der materiell Arme als wahrhaft reich gilt.
- source_word: περισπασμὸν
  choice: sich … ablenken lässt
  rationale: Drückt die innere Beanspruchung oder Zerstreuung in natürlichem modernem Deutsch verbal aus.
- source_word: τῶν ματαίων ἀνθρώπων
  choice: von den nichtigen Dingen …, die die Menschen beschäftigen
  rationale: Der überlieferte Ausdruck ist semantisch schwierig. Die Wiedergabe versteht den Genitiv im Sinn der nichtigen menschlichen Angelegenheiten und vermeidet die unnatürliche Formulierung „Ablenkung nichtiger Menschen“.
theological_decisions:
- issue: Worin der Reichtum des Armen besteht
  choice: Das Paradox von äußerer Armut und größerem Reichtum bleibt ohne dogmatische Erklärung stehen.
  alternative: Den Reichtum ausdrücklich als „geistlichen Reichtum“ bezeichnen.
  rationale: Der griechische Text qualifiziert πλουτεῖ nicht ausdrücklich; eine nähere theologische Bestimmung wäre interpretierende Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur wurde leicht geglättet; die ethische Pointe und die Spannung zwischen Armut und Reichtum bleiben erhalten.
