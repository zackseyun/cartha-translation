    issue: τῶν ματαίων ἀνθρώπων wird als „nichtige Dinge …, die die Menschen beschäftigen“ wiedergegeben.
    rationale: Der griechische Text bezeichnet ausdrücklich Menschen als μάταιοι. Die Umdeutung zu Dingen und der ergänzte Relativsatz verändern den Bezug und legen die schwierige Genitivverbindung stärker aus als der Text es verlangt.
  revised_text: Denn wenn der Arme in allem neidlos ist und dem Herrn gefällt, ist er reicher als alle, weil er die Zerstreuung eitler Menschen nicht kennt.
