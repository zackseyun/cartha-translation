revisions:
- from: 'Das Testament Gads 1


    1.[a] Abschrift des Testaments Gads, das er im hundertfünfundzwanzigsten Jahr seines Lebens seinen Söhnen verkündete. Er sagte zu ihnen:


    2. Hört, meine Kinder! Ich war Jakobs neunter Sohn und ein mutiger Hüter der Herden.


    3. Nachts bewachte ich die Herde. Wenn ein Löwe, ein Wolf oder irgendein anderes wildes Tier über sie herfiel, jagte ich ihm nach, holte es ein, packte es mit meiner Hand am Bein und schleuderte es etwa einen Steinwurf weit; dann tötete ich es.


    4. Mein Bruder Josef hütete bis zu dreißig Tage lang mit uns die Herden. Weil er noch jung war, wurde er von der Gluthitze geschwächt.


    5. Da kehrte er zu unserem Vater nach Hebron zurück. Unser Vater ließ ihn neben sich ruhen, denn er liebte ihn sehr.


    6. Josef sagte unserem Vater, die Söhne Silpas und Bilhas schlachteten die besten Tiere und äßen sie ohne die Zustimmung Rubens und Judas.[b]


    7. Er hatte nämlich gesehen, wie ich ein Lamm aus dem Maul einer Bärin rettete und die Bärin tötete. Das Lamm aber schlachtete ich. Es tat mir leid, weil es nicht mehr am Leben bleiben konnte; dann aßen wir es.


    8. Deswegen hegte ich Groll gegen Josef bis zu dem Tag, an dem er verkauft wurde.[c]


    9. Der Geist des Hasses war in mir, und ich wollte weder mit meinen Ohren von Josef hören noch ihn mit meinen Augen sehen. Denn er hatte uns offen zurechtgewiesen und gesagt, wir hätten ohne Judas von den Tieren gegessen. Alles nämlich, was er unserem Vater erzählte, glaubte dieser ihm.'
