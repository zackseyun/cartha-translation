lexical_decisions:
- source_word: ἀνήγαγον
  choice: brachten sie ihn hinauf
  rationale: Bewahrt die Richtungsangabe des griechischen Verbs und entspricht dem Sprachgebrauch für den Weg nach Hebron.
- source_word: ἔθηκαν αὐτὸν μετὰ τῶν πατέρων αὐτοῦ
  choice: bestatteten ihn bei seinen Vätern
  rationale: Das wörtliche »legten ihn zu seinen Vätern« bezeichnet hier idiomatisch die Beisetzung im Familiengrab; »bei« wahrt dabei die räumliche Aussage.
