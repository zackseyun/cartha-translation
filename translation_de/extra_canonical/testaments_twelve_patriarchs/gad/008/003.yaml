base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/008/003.yaml
  text: 'And after resting a little he spoke again: My children, obey your father, and bury me near my fathers.'
translation:
  language: de
  text: 'Nachdem er kurz geschwiegen hatte, sagte er wieder: »Meine Kinder, gehorcht eurem Vater und begrabt mich nahe bei meinen Vätern.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἡσυχάσας ὀλίγον
  choice: nachdem er eine kurze Zeit geruht hatte
  rationale: ἡσυχάζω bezeichnet hier im Zusammenhang mit dem sterbenden Gad ein kurzes Ruhen oder Stillwerden; die zeitliche Partizipialkonstruktion wird natürlich als vorzeitiger Nebensatz wiedergegeben.
- source_word: ὑπακούσατε
  choice: gehorcht
  rationale: Der Aoristimperativ fordert die Kinder unmittelbar dazu auf, der Anweisung ihres Vaters Folge zu leisten.
- source_word: ἐγγὺς τῶν πατέρων μου
  choice: in der Nähe meiner Väter
  rationale: Die räumliche Bedeutung von ἐγγύς bleibt erhalten; »meine Väter« bewahrt die konkrete Rede von den Vorfahren und ihren Gräbern.
theological_decisions: []
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die direkte Rede wird typografisch kenntlich gemacht; die patriarchalische Wendung »meine Väter« bleibt entsprechend dem griechischen Wortlaut erhalten.
