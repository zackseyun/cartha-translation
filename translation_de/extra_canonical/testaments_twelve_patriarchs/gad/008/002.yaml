id: T12P.GAD.8.2
reference: Testament of Gad 8:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 2. *Ἐγὼ γὰρ ἔγνων⁶, ὅτι ἀποστήσονται⁷ τὰ τέκνα ὑμῶν ἀπ᾽ αὐτοῦ⁸, καὶ⁹ πάσῃ πονηρίᾳ καὶ κακώσει καὶ διαφθορᾷ ἔσονται ἀπὸ¹⁰ Κυρίου.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/008/002.yaml
  text: For I have known that your children will turn away from him, and in every wickedness and affliction and corruption they will be away from the Lord.
translation:
  language: de
  text: Denn ich habe erkannt, dass eure Kinder sich von ihm abwenden und in aller Bosheit, Bedrängnis und Verderbnis fern vom Herrn sein werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἔγνων
  choice: habe erkannt
  rationale: Das Perfekt gibt die abgeschlossene Erkenntnis mit gegenwärtiger Geltung wieder; „erkannt“ klingt hier natürlicher und gewichtiger als „gewusst“.
- source_word: ἀποστήσονται
  choice: sich abwenden
  rationale: Das Verb bezeichnet ein Sich-Entfernen oder Abfallen. „Sich abwenden“ bewahrt den Beziehungsaspekt, ohne die Aussage konfessionell aufzuladen.
- source_word: τὰ τέκνα ὑμῶν
  choice: eure Kinder
  rationale: Entspricht der direkten Anrede und lässt offen, ob unmittelbare Kinder oder weiter gefasste Nachkommen gemeint sind.
- source_word: κακώσει
  choice: Bedrängnis
  rationale: κάκωσις kann Misshandlung, Bedrückung oder Leid bezeichnen. „Bedrängnis“ wahrt diese Bedeutungsbreite im gegebenen Laster- und Unheilskatalog.
- source_word: διαφθορᾷ
  choice: Verderbnis
  rationale: Gibt sowohl moralische Zerrüttung als auch zerstörerischen Verfall wieder.
- source_word: ἀπὸ Κυρίου
  choice: fern vom Herrn
  rationale: Mit ἔσονται bezeichnet ἀπό einen Zustand der Entfernung vom Herrn. Die deutsche Fügung ist verständlich, ohne die ungewöhnliche griechische Konstruktion übermäßig zu glätten.
theological_decisions:
- issue: Bezug von αὐτοῦ („ihm“)
  choice: Das Pronomen wird als „ihm“ beibehalten.
  alternative: Den Bezug ausdrücklich als „dem Herrn“ auslegen.
  rationale: Der vorgelegte Vers bietet keinen sicher ausweisbaren Bezug innerhalb seines eigenen Wortlauts. Eine ausdrückliche Identifizierung würde die echte textliche beziehungsweise kontextuelle Unbestimmtheit auflösen.
- issue: Verhältnis der Lasterbegriffe zur Entfernung vom Herrn
  choice: Die drei Begriffe werden als Zustandsrahmen der Gottesferne wiedergegeben.
  alternative: Sie kausal oder als Folge der Abwendung deuten.
  rationale: Der griechische Text stellt die Begriffe mit Dativ neben ἔσονται ἀπὸ Κυρίου, markiert aber keine eindeutige Kausalbeziehung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Reihung „Bosheit, Bedrängnis und Verderbnis“ bewahrt die Dichte und Spannung des griechischen Wortlauts; das unbestimmte „ihm“ bleibt bewusst erhalten.
