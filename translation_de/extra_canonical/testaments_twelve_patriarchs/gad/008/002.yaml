  source_fidelity: 'Die Übersetzung folgt dem griechischen Wortlaut eng: γὰρ, ἔγνων, die Zukunftsform ἀποστήσονται, die Anrede τὰ τέκνα ὑμῶν, das bewusst nicht spezifizierte αὐτοῦ sowie die abschließende Distanzierung ἀπὸ Κυρίου sind angemessen wiedergegeben. Die Reihung πάσῃ πονηρίᾳ καὶ κακώσει καὶ διαφθορᾷ bleibt als Zustandsbeschreibung erhalten, ohne eine im Text nicht ausdrücklich markierte Kausalfolge einzutragen.'
