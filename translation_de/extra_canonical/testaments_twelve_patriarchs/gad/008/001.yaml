source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: VIII. Εἴπατε *Γδὲ¹ ταῦτα καὶ ὑμεῖς¹ τοῖς τέκνοις ὑμῶν, ὅπως τιμήσωσιν †¹Ἰούδα² καὶ Λευί³ †ὅτι ἐξ αὐτῶν ἀνατελεῖ *Γὑμῖν¹ Κύριος σωτηρίαν⁴ *τῷ Ἰσραήλ⁵.
  language: Greek
  note: Chapter-level Greek fragment; verse-level Greek not yet aligned.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/008/001.yaml
  text: Speak these things, you also, to your children, so that they may honor Judah and Levi; for from them the Lord will raise up for you salvation for Israel.
translation:
  language: de
  text: Sagt auch ihr dies euren Kindern, damit sie Juda und Levi ehren; denn aus ihnen wird der Herr euch Heil für Israel aufgehen lassen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die griechische Wortfolge am Satzende ist unsicher; möglich ist auch: „denn aus ihnen wird der Herr für euch, für Israel, Heil aufgehen lassen“ oder „denn aus ihnen wird der Herr euch, Israel, Heil aufgehen lassen“.'
    reason: Bewahrt die Mehrdeutigkeit der nicht vollständig ausgerichteten griechischen Fragmentüberlieferung, besonders beim Verhältnis von ὑμῖν zu τῷ Ἰσραήλ.
lexical_decisions:
- source_word: Εἴπατε
  choice: Sagt
  rationale: Der Aorist-Imperativ wird als unmittelbare Aufforderung wiedergegeben.
- source_word: τιμήσωσιν
  choice: ehren
  rationale: Entspricht der Grundbedeutung von τιμάω und wahrt den würdevollen Ton.
- source_word: ἀνατελεῖ
  choice: wird ... aufgehen lassen
  rationale: Bewahrt die Bildsprache des Verbs ἀνατέλλω, statt sie lediglich mit „hervorbringen“ oder „erwecken“ wiederzugeben.
- source_word: σωτηρίαν
  choice: Heil
  rationale: „Heil“ umfasst Rettung und Wohlergehen und passt zum religiösen Kontext, ohne die Aussage unnötig einzuengen.
theological_decisions:
- issue: Bezug von ἐξ αὐτῶν („aus ihnen“)
  choice: auf Juda und Levi gemeinsam bezogen
  alternative: nur auf eine der beiden genannten Gestalten oder auf ihre Nachkommen bezogen
  rationale: Der Plural αὐτῶν verweist grammatisch am natürlichsten auf beide Namen; die mögliche Vermittlung durch ihre Nachkommen bleibt im Deutschen offen.
- issue: Syntaktischer Bezug von ὑμῖν und τῷ Ἰσραήλ
  choice: „euch Heil für Israel“ im Haupttext, mit Fußnote zur unsicheren Überlieferung
  alternative: „für euch, für Israel, Heil“ bzw. „euch, Israel, Heil“
  rationale: Die überlieferte Wortfolge ist syntaktisch schwierig. Der Haupttext folgt der naheliegenden Lesart der konsultierten englischen Fassung, kennzeichnet aber die echte Unsicherheit ausdrücklich.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem biblischem Ton. Die ungewöhnliche, aber quellennahe Metapher „Heil aufgehen lassen“ wurde bewusst beibehalten.
