  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/008/004.yaml
  text: And drawing up his feet, he fell asleep in peace.
translation:
  language: de
  text: Und er zog seine Füße hoch und schlief in Frieden ein.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξάρας τοὺς πόδας αὐτοῦ
  choice: er zog seine Füße an
  rationale: Die Wendung beschreibt das Anziehen bzw. Heraufziehen der Füße, offenbar als letzte körperliche Bewegung vor dem Tod. Die Formulierung bleibt nahe am griechischen Bild und klingt im Deutschen natürlich.
- source_word: ἐκοιμήθη
  choice: entschlief
  rationale: Das Verb bedeutet wörtlich „schlief ein“, wird hier jedoch als verhüllende Bezeichnung für den Tod gebraucht. „Entschlief“ bewahrt sowohl das Schlafbild als auch den würdevollen Todesbezug.
- source_word: ἐν εἰρήνῃ
  choice: in Frieden
  rationale: Die geläufige deutsche Wendung gibt den griechischen Ausdruck direkt wieder, ohne näher festzulegen, ob innerer Friede, friedliche Umstände oder Heil gemeint sind.
theological_decisions:
- issue: Schlaf als Umschreibung des Todes
  choice: entschlief
  alternative: schlief ein
  rationale: Der Kontext bezeichnet den Tod. „Entschlief“ lässt die metaphorische Rede vom Schlaf erkennen, ohne eine weitergehende Aussage über den Zwischenzustand einzutragen.
translation_notes:
  register: Knapp, würdevoll und in modernem Standarddeutsch. Die Satzstruktur und das körperliche Bild des griechischen Textes werden bewahrt.
