base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003/002.yaml
  text: Whatever the one who hates may do is abominable. If anyone does the law of the Lord, the hater does not praise him. If anyone fears the Lord and desires what is righteous, the hater does not love him.
translation:
  language: de
  text: Was auch immer der Hassende tut, ist abscheulich. Wenn jemand das Gesetz des Herrn befolgt, lobt der Hassende ihn nicht. Wenn jemand den Herrn fürchtet und das Gerechte tun will, liebt der Hassende ihn nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ μισῶν
  choice: der Hassende
  rationale: Das substantivierte Partizip bezeichnet den Menschen, der hasst. „Der Hassende“ wahrt den wiederkehrenden Bezug und vermeidet die stärkere, lexikalisierte Bezeichnung „der Hasser“.
- source_word: βδελυκτόν
  choice: abscheulich
  rationale: Gibt die starke moralische Abscheu des griechischen Ausdrucks in natürlichem, würdigem Deutsch wieder.
- source_word: ποιῇ τὸν νόμον Κυρίου
  choice: das Gesetz des Herrn befolgt
  rationale: Die wörtliche Wendung „das Gesetz tun“ ist im heutigen Deutsch unnatürlich; „befolgen“ bewahrt den Sinn praktischen Gehorsams.
- source_word: θέλει τὸ δίκαιον
  choice: das Gerechte tun will
  rationale: θέλει bezeichnet Wollen bzw. Beabsichtigen; τὸ δίκαιον ist „das Gerechte“. Die Ergänzung „tun“ macht die im Deutschen erforderliche Handlungsrichtung deutlich, ohne eine besondere Lehrdeutung einzuführen.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts in οὐκ ἐπαινεῖ und οὐκ ἀγαπᾷ
  choice: „der Hassende“ als Subjekt ausdrücklich wiederholt
  alternative: Die Verben unpersönlich oder mit einem unbestimmten Subjekt wiedergeben
  rationale: Der vorher eingeführte ὁ μισῶν ist im Zusammenhang das naheliegende fortdauernde Subjekt. Die ausdrückliche Wiederholung verhindert im Deutschen ein missverständliches Zurückbeziehen auf „jemand“.
- issue: Bedeutung von θέλει τὸ δίκαιον
  choice: „das Gerechte tun will“
  alternative: „das Gerechte begehrt“ oder „Gerechtigkeit will“
  rationale: Die Übersetzung hält die Ausrichtung des Willens auf gerechtes Handeln fest, ohne „Gerechtigkeit“ als abstrakten oder dogmatisch aufgeladenen Begriff einzuführen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die dreigliedrige Satzstruktur und die konsequente Bezeichnung „der Hassende“ wurden zur Wahrung des argumentativen Zusammenhangs beibehalten.
