review_pass:
  verdict: revise
  source_fidelity: Die wesentlichen Lexeme und die Anrede sind zutreffend wiedergegeben. Die imperativische Aufspaltung von τοῦ ποιεῖν in „Übt … und haltet …“ löst jedoch die griechische Infinitivkonstruktion zu weit vom vorausgehenden „Wort der Wahrheit“. Eine finale beziehungsweise erläuternde Anbindung lässt sich im Deutschen ohne unnatürliche Verdopplung des Hörens bewahren.
  naturalness: Die vorliegende Fassung ist überwiegend klar und würdig. „bei allen Taten der Menschen böse“ ist im Deutschen etwas weniger missverständlich als „in allen Taten der Menschen böse“, ohne die knappe, im griechischen Text nicht näher erklärte Aussage auszuweiten.
  terminology: „Gerechtigkeit üben“, „Gesetz des Höchsten“, „Geist des Hasses“ und die possessivlose Anrede „Kinder“ sind sachgerecht. „befolgen“ ist bei einem Gesetz idiomatischer als „halten“ und wahrt hier den von ποιεῖν getragenen Aufforderungssinn.
  issues:
  - severity: medium
    issue: Die Infinitivkonstruktion τοῦ ποιεῖν wird als zwei selbständige Imperative wiedergegeben.
    rationale: Dadurch wird die syntaktische Beziehung zum „Wort der Wahrheit“ abgeschwächt. Eine Konstruktion mit „um … zu“ gibt den naheliegenden finalen Sinn wieder, ohne eine über das Griechische hinausgehende Deutung festzulegen.
  - severity: low
    issue: „in allen Taten der Menschen böse“ ist im Deutschen semantisch und stilistisch schwerfällig.
    rationale: „bei allen Taten der Menschen“ bildet ἐπὶ πάσαις ταῖς πράξεσι näher ab und lässt offen, in welchem genauen Sinn der Geist des Hasses zu den menschlichen Taten als böse bezeichnet wird.
  revised_text: Und nun hört ein Wort der Wahrheit, um Gerechtigkeit zu üben und jedes Gesetz des Höchsten zu befolgen. Lasst euch nicht, Kinder, vom Geist des Hasses in die Irre führen; denn er ist bei allen Taten der Menschen böse.
