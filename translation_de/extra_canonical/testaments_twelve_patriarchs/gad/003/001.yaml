  to: Und nun hört ein Wort der Wahrheit, um Gerechtigkeit zu üben und jedes Gesetz des Höchsten zu befolgen. Lasst euch nicht, Kinder, vom Geist des Hasses in die Irre führen; denn er ist bei allen Taten der Menschen böse.
