source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: III. Καὶ νῦν ἀκούσατε¹ λόγον² ἀληθείας³, *τοῦ ποιεῖν⁴ δικαιοσύνην, καὶ πάντα⁵ νόμον⁶ ὑψίστου, καὶ μὴ⁷ πλανᾶσθε⁸ τέκνα *τῷ πνεύματι⁹ τοῦ μίσους¹⁰, ὅτι κακόν ἐστιν ἐπὶ πάσαις ταῖς¹¹ πράξεσι τῶν¹¹ ἀνθρώπων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003/001.yaml
  text: 'And now hear a word of truth: listen in order to practice righteousness and every law of the Most High, and do not be led astray, children, by the spirit of hatred, because it is evil in all the deeds of men.'
translation:
  language: de
  text: Und nun hört ein Wort der Wahrheit, um Gerechtigkeit zu üben und jedes Gesetz des Höchsten zu befolgen. Lasst euch nicht, Kinder, vom Geist des Hasses in die Irre führen; denn er ist bei allen Taten der Menschen böse.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: λόγον ἀληθείας
  choice: ein Wort der Wahrheit
  rationale: Gibt die griechische Wendung eng und zugleich idiomatisch wieder; „Wort“ bezeichnet hier eine wahrhaftige Unterweisung oder Botschaft.
- source_word: ποιεῖν δικαιοσύνην
  choice: Gerechtigkeit üben
  rationale: Das deutsche „Gerechtigkeit üben“ bewahrt den handlungsbezogenen Sinn von ποιεῖν, ohne die unnatürliche Wendung „Gerechtigkeit tun“ zu erzwingen.
- source_word: πάντα νόμον ὑψίστου
  choice: jedes Gesetz des Höchsten halten
  rationale: πάντα νόμον wird distributiv als „jedes Gesetz“ verstanden. „Halten“ macht den idiomatischen Sinn des gemeinsamen Verbs ποιεῖν bei „Gesetz“ deutlich.
- source_word: πλανᾶσθε
  choice: lasst euch … in die Irre führen
  rationale: Entspricht der medial-passiven Form und bewahrt die Warnung davor, einer irreführenden Macht nachzugeben.
- source_word: τῷ πνεύματι τοῦ μίσους
  choice: vom Geist des Hasses
  rationale: Bewahrt Bildsprache und Genitivbeziehung des griechischen Textes; der Dativ bezeichnet hier die irreführende Macht beziehungsweise Ursache.
- source_word: κακόν ἐστιν ἐπὶ πάσαις ταῖς πράξεσι τῶν ἀνθρώπων
  choice: denn er ist in allen Taten der Menschen böse
  rationale: Gibt die knappe und etwas ungewöhnliche griechische Aussage wieder, ohne sie zu einer spezifischeren Behauptung über Ursprung, Wirkung oder Umfang des Bösen auszubauen.
theological_decisions:
- issue: Bezug von κακόν („böse“)
  choice: Das Pronomen „er“ bezieht sich auf den Geist des Hasses.
  alternative: Die Aussage unpersönlich auf den Hass oder allgemein auf das Böse in menschlichen Taten beziehen.
  rationale: Im unmittelbaren Zusammenhang ist τὸ πνεῦμα τοῦ μίσους der nächstliegende Bezug. Das grammatische Neutrum des Griechischen wird im Deutschen wegen des maskulinen Substantivs „Geist“ mit „er“ wiedergegeben.
- issue: Verhältnis des Wahrheitswortes zum folgenden Infinitiv
  choice: 'Der Infinitiv wird als Inhalt beziehungsweise Aufforderungsziel entfaltet: „Übt … und haltet …“'
  alternative: 'Formal enger: „Hört ein Wort der Wahrheit, um Gerechtigkeit zu üben …“'
  rationale: Die griechische Konstruktion mit τοῦ ποιεῖν ist knapp und kann final oder erläuternd verstanden werden. Die imperativische Wiedergabe ist im Deutschen natürlicher und wahrt den ermahnenden Sinn, ohne eine zusätzliche zweite Aufforderung wie „hört … hört zu“ einzuführen.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter ermahnender Anrede. „Kinder“ bleibt ohne ergänztes Possessivpronomen, da im griechischen Text nur τέκνα steht. Die Satzgliederung macht die gedrängte griechische Syntax verständlich, ohne konfessionelle Deutung einzutragen.
