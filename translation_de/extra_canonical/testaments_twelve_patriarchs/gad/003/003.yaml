base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003/003.yaml
  text: He reproaches the truth, envies the one who prospers, embraces slander, and loves arrogance, because hatred blinds his soul, as it did mine when I looked at Joseph.
translation:
  language: de
  text: Er tadelt die Wahrheit, beneidet den, der Erfolg hat, heißt üble Nachrede willkommen und liebt den Hochmut; denn der Hass verblendet seine Seele, wie auch die meine, als ich Josef ansah.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ψέγει
  choice: tadelt
  rationale: Gibt den direkten Vorwurf gegen „die Wahrheit“ würdig und prägnant wieder.
- source_word: τῷ κατορθοῦντι
  choice: den, der recht handelt
  rationale: κατορθόω bezeichnet hier eher richtiges bzw. erfolgreiches Handeln als bloß materielles Gedeihen; die Formulierung bewahrt diese Bedeutungsweite.
- source_word: καταλαλιὰν ἀσπάζεται
  choice: heißt üble Nachrede willkommen
  rationale: Bewahrt das bildhafte „begrüßen/aufnehmen“ von ἀσπάζομαι und gibt καταλαλιά als verleumderisch-herabsetzendes Reden wieder.
- source_word: ὑπερηφανίαν ἀγαπᾷ
  choice: liebt den Hochmut
  rationale: Nahe und idiomatische Wiedergabe des griechischen Ausdrucks.
- source_word: ἐκτυφλοῖ
  choice: macht … blind
  rationale: Drückt die kausative Bedeutung des Verbs natürlich aus.
- source_word: ἔβλεπον τὸν Ἰωσήφ
  choice: als ich Josef ansah
  rationale: Folgt der konkret visuellen Bedeutung von βλέπω; der Zusammenhang lässt eine weitergehende Deutung wie „Josef betrachtete“ zu, erfordert sie aber nicht.
theological_decisions:
- issue: Bezug und Ergänzung im Vergleichssatz ὡς κἀγὼ τότε ἔβλεπον τὸν Ἰωσήφ
  choice: „wie auch meine, als ich Josef ansah“
  alternative: „wie auch mich, als ich Josef ansah“
  rationale: Die deutsche Ergänzung „meine [Seele]“ macht den naheliegenden Bezug auf ψυχή sichtbar und bewahrt zugleich die knappe, leicht elliptische Struktur des Griechischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung der vier Verhaltensweisen und die begründende Schlussklausel bleiben erhalten; das Semikolon verdeutlicht die Satzstruktur, ohne die Aussage aufzuteilen.
