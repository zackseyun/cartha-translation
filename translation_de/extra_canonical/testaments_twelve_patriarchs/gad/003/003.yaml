revisions:
- from: Er tadelt die Wahrheit, beneidet den, der recht handelt, heißt üble Nachrede willkommen und liebt den Hochmut; denn der Hass macht seine Seele blind, wie auch meine, als ich Josef ansah.
  to: Er tadelt die Wahrheit, beneidet den, der Erfolg hat, heißt üble Nachrede willkommen und liebt den Hochmut; denn der Hass verblendet seine Seele, wie auch die meine, als ich Josef ansah.
  rationale: Die Revision korrigiert die zu starke moralische Einengung von κατορθοῦντι und glättet den elliptischen Vergleichssatz. Die Aussage bleibt bewusst bei der im griechischen Text angelegten knappen Verbindung zwischen der Verblendung durch Hass und Gads Blick auf Josef; sie fügt keine weitergehende Auslegung hinzu.
