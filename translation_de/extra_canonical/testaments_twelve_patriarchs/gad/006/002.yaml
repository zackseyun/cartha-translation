  text: 2. *Ἐγὼ γὰρ⁸ κατὰ πρόσωπον τοῦ πατρὸς μου⁹, εἰρηνικὰ¹⁰ ἐλάλουν τῷ Ἰωσήφ· *ἐξερχόμενος δὲ ἐξ αὐτοῦ¹¹ τὸ πνεῦμα *τοῦ μίσους ἐσκότιζέ μου τὸν νοῦν¹², καὶ ἐτάρασσέ¹³ *μου τὸν λογισμόν¹⁴ *πρὸς τὸ¹⁵ ἀνελεῖν αὐτόν¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/002.yaml
  text: For I myself, in my father’s presence, spoke peaceably to Joseph; but when I had gone out from him, the spirit of hatred darkened my mind and disturbed my thoughts to kill him.
translation:
  language: de
  text: Denn ich selbst redete in Gegenwart meines Vaters friedlich mit Josef; doch als ich von ihm wegging, verfinsterte der Geist des Hasses meinen Sinn und verwirrte meine Gedanken dahin, ihn zu töten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατὰ πρόσωπον τοῦ πατρὸς μου
  choice: in Gegenwart meines Vaters
  rationale: Die Wendung bezeichnet hier natürlich die Anwesenheit beziehungsweise das Angesicht des Vaters; die deutsche Formulierung ist idiomatisch und bewahrt den situativen Sinn.
- source_word: εἰρηνικὰ ἐλάλουν
  choice: redete ich friedlich
  rationale: Das adverbiale εἰρηνικά wird eng wiedergegeben, ohne es stärker als Aufrichtigkeit oder Versöhnung auszulegen.
- source_word: ἐξερχόμενος δὲ ἐξ αὐτοῦ
  choice: doch wenn ich von ihm wegging
  rationale: Das Partizip bezeichnet das Fortgehen von Josef. Der imperfektische Zusammenhang legt ein wiederholtes oder typisches Geschehen nahe, weshalb „wenn“ statt eines einmaligen „als“ gewählt wird.
- source_word: τὸ πνεῦμα τοῦ μίσους
  choice: der Geist des Hasses
  rationale: Die personifizierende beziehungsweise geistliche Redeweise des griechischen Textes bleibt erhalten und wird nicht psychologisierend auf bloße Hassgefühle reduziert.
- source_word: ἐσκότιζέ μου τὸν νοῦν
  choice: verfinsterte ... meinen Sinn
  rationale: νοῦς umfasst Denk- und Wahrnehmungsvermögen; „Sinn“ wahrt diese Breite und unterscheidet sich zugleich von λογισμός im folgenden Glied.
- source_word: ἐτάρασσέ μου τὸν λογισμόν
  choice: verwirrte meine Gedanken
  rationale: λογισμός bezeichnet hier das Denken beziehungsweise die Gedanken; der Plural klingt im Deutschen natürlich, ohne den Begriff unnötig auszudeuten.
- source_word: πρὸς τὸ ἀνελεῖν αὐτόν
  choice: dahin, ihn zu töten
  rationale: Die Formulierung bewahrt die Zielrichtung der griechischen Konstruktion, ohne ausdrücklich einen Wunsch oder Entschluss hinzuzufügen.
theological_decisions:
- issue: Status des „Geistes des Hasses“
  choice: Wörtlich als „Geist des Hasses“ wiedergegeben
  alternative: „Hassgefühle“ oder „der Hass“
  rationale: Der Text lässt offen, ob eine personale geistliche Macht, eine personifizierte Haltung oder beides gemeint ist; die Übersetzung erhält diese Spannung.
- issue: Grad der Tötungsabsicht
  choice: „dahin, ihn zu töten“
  alternative: „sodass ich ihn töten wollte“
  rationale: Die Alternative würde einen ausdrücklich formulierten Willensakt ergänzen. Die gewählte Fassung bleibt näher an der finalen Konstruktion πρὸς τὸ mit Infinitiv.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die Satzstruktur bleibt nahe am griechischen Gegensatz zwischen friedlichem Reden in der Gegenwart des Vaters und der inneren Verfinsterung nach dem Fortgehen. Keine Fußnoten erforderlich.
