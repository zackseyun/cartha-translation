    rationale: ἐξερχόμενος ist zwar ein Partizip Präsens, steht aber in einer Vergangenheitsschilderung bei Imperfekten und bezeichnet hier den zeitlichen Begleitumstand des Fortgehens. „Als“ gibt den konkreten erzählten Vorgang idiomatischer wieder, ohne eine nicht ausdrücklich markierte Habitualität einzutragen.
