revisions:
- from: 5 Lass im Streit keinen anderen dein Geheimnis hören, damit er dich nicht hasst, dir zum Feind wird und eine schwere Sünde an dir[a] begeht. Denn oft bringt er dich heimtückisch um oder verstrickt dich in Böses, nachdem er das Gift von dir empfangen hat.
  to: 5 Lass nicht zu, dass im Streit ein anderer dein Geheimnis hört, damit er nicht, nachdem er dich hassen gelernt hat, dir zum Feind wird und eine große Sünde an dir[a] begeht. Denn oft bringt er dich heimtückisch um oder verstrickt dich in Böses, nachdem er das Gift von dir empfangen hat.
  rationale: Die Revision erhält den Sinn und das drastische Bild des Entwurfs, glättet lediglich den deutschen Imperativ und bildet die zeitliche Relation von μισήσας zu ἐχθράνῃ deutlicher ab. „Große Sünde“ ist eine engere lexikalische Entsprechung von μεγάλην ἁμαρτίαν. Der textkritische Vorbehalt zu ἐν σοί wird unverändert durch die Fußnote kenntlich gemacht.
