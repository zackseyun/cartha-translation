base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/005.yaml
  text: Do not let another hear your secret in a quarrel, lest, having come to hate you, he become your enemy and commit a great sin against you; for many times he either murders you by treachery or entangles you in evils, having received the poison from you.
translation:
  language: de
  text: 5 Lass nicht zu, dass im Streit ein anderer dein Geheimnis hört, damit er nicht, nachdem er dich hassen gelernt hat, dir zum Feind wird und eine große Sünde an dir[a] begeht. Denn oft bringt er dich heimtückisch um oder verstrickt dich in Böses, nachdem er das Gift von dir empfangen hat.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „an dir“ steht in einigen Textzeugen; andere lassen die Wendung aus.
    reason: Die griechische Wendung ἐν σοί ist in der vorgelegten Edition als textkritisch unsicher gekennzeichnet.
lexical_decisions:
- source_word: ἐν μάχῃ
  choice: im Streit
  rationale: Die Wendung bezeichnet hier einen persönlichen Konflikt oder heftigen Wortstreit; „im Kampf“ wäre im Deutschen unnötig militärisch.
- source_word: ἀλλότριος
  choice: keinen anderen
  rationale: Das Wort kann „ein anderer“, „ein Fremder“ oder „ein Außenstehender“ bedeuten. Im Zusammenhang ist allgemein eine andere Person gemeint, der im Streit ein Geheimnis preisgegeben werden könnte.
- source_word: τὸ μυστήριόν σου
  choice: dein Geheimnis
  rationale: μυστήριον bezeichnet hier etwas Vertrauliches oder Verborgenes, nicht einen theologischen „Mysterien“-Begriff.
- source_word: ἐχθράνῃ σε
  choice: dir zum Feind wird
  rationale: Die seltene Verbform drückt aus, dass jemand eine feindliche Haltung gegen die angesprochene Person annimmt.
- source_word: δολοφωνεῖ σε
  choice: bringt er dich heimtückisch um
  rationale: Das Verb bezeichnet ein Töten oder Morden durch List und Hinterhalt; die Formulierung gibt sowohl die tödliche als auch die heimtückische Komponente wieder.
- source_word: περιεργάζεται σε ἐν κακοῖς
  choice: verstrickt dich in Böses
  rationale: Die ungewöhnliche Verbindung beschreibt, dass der andere die Person durch sein Handeln in Übel oder böse Machenschaften hineinzieht.
- source_word: τὸν ἰόν
  choice: das Gift
  rationale: ἰός bedeutet wörtlich „Gift“ beziehungsweise „Giftstoff“ und ist hier bildlich für die im Streit preisgegebene schädliche Information gebraucht.
theological_decisions:
- issue: Bezug von „eine schwere Sünde begehen“
  choice: „eine schwere Sünde an dir begeht“
  alternative: „eine schwere Sünde in Bezug auf dich begeht“ oder ohne Ergänzung
  rationale: Das textkritisch unsichere ἐν σοί bezeichnet die angesprochene Person als Ziel oder Bereich der Sünde. „An dir“ ist natürliches Deutsch, ohne die Art der Sünde näher festzulegen.
- issue: Bild vom empfangenen Gift
  choice: Das Bild bleibt ausdrücklich als „Gift“ erhalten.
  alternative: Sinngemäße Auflösung als „böse Anregung“ oder „Anlass“
  rationale: 'Der griechische Text hält die moralische Spannung fest: Der Sprecher liefert durch seine eigene Preisgabe das „Gift“, das der andere anschließend gegen ihn verwendet. Eine Auflösung würde dieses eindringliche Bild abschwächen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Mahnrede und das drastische Giftbild bleiben erhalten; ungewöhnliche griechische Wendungen werden idiomatisch wiedergegeben, ohne die moralische Mitverantwortung desjenigen abzuschwächen, der im Streit sein Geheimnis preisgibt.
