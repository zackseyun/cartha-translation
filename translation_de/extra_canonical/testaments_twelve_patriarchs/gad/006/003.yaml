    rationale: Die Lesart „rede in Frieden mit ihm“ und der Zusatz über das Gift des Hasses gehören im angeführten Befund zur β/A/S¹-Tradition; bei einem α-basierten Haupttext sollte sie als zusammenhängende abweichende Lesart ausgewiesen werden.
