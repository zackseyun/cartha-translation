base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/003.yaml
  text: Love one another from the heart; and if anyone sins against you, speak peace to him, and in your soul hold no deceit; and if he confesses and repents, forgive him.
translation:
  language: de
  text: Liebt einander von Herzen. Und wenn jemand gegen dich sündigt, dann sprich Frieden zu ihm[a] und hege in deiner Seele keine Arglist. Wenn er seine Schuld bekennt und umkehrt[b], vergib ihm.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Andere Textzeugen: „Rede friedlich mit ihm, nachdem du das Gift des Hasses verbannt hast.“'
    reason: Vermerkt die abweichende Formulierung ἐν εἰρήνῃ sowie den in β/A/S¹ überlieferten Zusatz ἐξορίσας τὸν ἰὸν τοῦ μίσους gegenüber dem Haupttext εἰπὲ αὐτῷ εἰρήνην.
  - marker: b
    text: 'Andere Textzeugen: „Wenn er umkehrt und seine Schuld bekennt“.'
    reason: Bewahrt die in β/A/S¹ gegenüber α abweichende Stellung von Bekenntnis und Umkehr.
lexical_decisions:
- source_word: Ἀγαπήσατε ἀλλήλους ἀπὸ καρδίας
  choice: Liebt einander von Herzen
  rationale: Gibt den Imperativ und die Wendung ἀπὸ καρδίας direkt, natürlich und würdig wieder.
- source_word: ἁμαρτήσει εἰς σέ
  choice: gegen dich sündigt
  rationale: Bewahrt die persönliche Ausrichtung von εἰς σέ und den ethisch-religiösen Gehalt von ἁμαρτάνω.
- source_word: ἐν τῇ ψυχῇ σου μὴ κρατήσῃς δόλον
  choice: hege in deiner Seele keine Arglist
  rationale: „Hegen“ bildet das innere Festhalten von κρατέω idiomatisch ab; „Arglist“ wahrt die Bedeutung von δόλος.
- source_word: ὁμολογήσῃ / ὁμολογήσας
  choice: seine Schuld bekennt
  rationale: Das Objekt ist im Griechischen unausgesprochen, wird im Zusammenhang aber als Eingeständnis des Vergehens verstanden; die Ergänzung macht dies im Deutschen natürlich verständlich.
- source_word: μετανοήσας / μετανοήσῃ
  choice: umkehrt
  rationale: „Umkehren“ erfasst die ethisch-religiöse Sinnes- und Verhaltensänderung von μετανοέω ohne unnötig konfessionelle Färbung.
- source_word: ἄφες αὐτῷ
  choice: vergib ihm
  rationale: Direkte und kontextgerechte Wiedergabe des Vergebungsimperativs.
theological_decisions:
- issue: Reihenfolge von Bekenntnis und Umkehr
  choice: Wenn er seine Schuld bekennt und umkehrt
  alternative: Wenn er umkehrt und seine Schuld bekennt
  rationale: Die Handschriften bieten beide Reihenfolgen. Der Haupttext folgt der β/A/S¹-Lesart, die auch der konsultierten englischen Fassung zugrunde liegt; die Variante wird in einer Fußnote bewahrt.
- issue: Friedensrede gegenüber dem Schuldigen
  choice: rede in Frieden mit ihm
  alternative: sprich Frieden zu ihm
  rationale: Die gewählte Fassung folgt ἐν εἰρήνῃ und bezeichnet eine friedliche Art des Redens. Die α-Lesart εἰπὲ αὐτῷ εἰρήνην lässt sich wörtlicher als „sprich Frieden zu ihm“ wiedergeben und bleibt in der Fußnote sichtbar.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Mahnredenstil. Kurze Hauptsätze erhalten die eindringliche paränetische Wirkung. Textkritische Unterschiede werden kenntlich gemacht, statt stillschweigend harmonisiert.
