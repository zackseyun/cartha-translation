  source_fidelity: 'Der deutsche Haupttext vermischt Lesarten: „rede in Frieden mit ihm“ folgt β/A/S¹ (ἐν εἰρήνῃ), während „bekennt und umkehrt“ der α-Lesart (μετανοήσας ὁμολογήσῃ) entspricht. Eine solche eklektische Wiedergabe ist nur mit zutreffender Variantenbeschreibung vertretbar. Die vorhandene Begründung behauptet jedoch fälschlich, die Reihenfolge des Haupttextes folge β/A/S¹. Der revidierte Text folgt, wie die englische POB-Fassung, konsequent der zuerst gebotenen α-Lesart und vermerkt die zusammenhängende abweichende Lesart.'
  naturalness: „Sprich Frieden zu ihm“ ist etwas gehoben, aber im modernen Standarddeutsch verständlich und für den mah­nenden, religiösen Register des Werks angemessen. Es gibt die ungewöhnliche, prägnante griechische Formulierung genauer wieder als die glättende Fassung „rede in Frieden mit ihm“.
  terminology: „sündigt“, „Arglist“, „seine Schuld bekennt“, „umkehrt“ und „vergib ihm“ sind sachgerecht. „Umkehrt“ wahrt für μετανοέω die ethische Wendung ohne eine übermäßig konfessionell festgelegte Umschreibung.
