  source_fidelity: 'Die Übersetzung gibt die Satzglieder und den logischen Zusammenhang des Griechischen zuverlässig wieder: ἀρνεῖται als „es abstreitet“, μὴ φιλονείκει als Verbot des Streitens, μήποτε als Warnung vor der Folge und δισσῶς ἁμαρτάνεις als „doppelt sündigst“. „Wenn er schwört“ wahrt die objektlose und hinsichtlich der genauen Funktion nicht weiter erläuterte Formulierung ὁμόσαντος αὐτοῦ.'
