source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 4. Ἐὰν δὲ ἀρνεῖται²⁸, μὴ φιλονείκει αὐτῷ, μήποτε²⁹ ὁμόσαντος αὐτοῦ δισσῶς ἁμαρτάνεις³⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/004.yaml
  text: But if he denies it, do not contend with him, lest, when he swears, you sin doubly.
translation:
  language: de
  text: Wenn er es aber abstreitet, streite nicht mit ihm, damit du nicht, wenn er schwört, doppelt sündigst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρνεῖται
  choice: es abstreitet
  rationale: Gibt das Leugnen einer zuvor erhobenen Beschuldigung natürlich wieder; das Objekt bleibt wie im Griechischen nur aus dem Zusammenhang erschließbar.
- source_word: μὴ φιλονείκει αὐτῷ
  choice: streite nicht mit ihm
  rationale: Bewahrt den Sinn von φιλονικέω als streitendes Beharren oder Rechten, ohne eine stärkere Bedeutung wie Prozessieren einzutragen.
- source_word: ὁμόσαντος αὐτοῦ
  choice: wenn er schwört
  rationale: Die temporale Genitivus-absolutus-Konstruktion wird idiomatisch wiedergegeben; ein im Griechischen nicht genanntes Objekt des Schwörens wird nicht ergänzt.
- source_word: δισσῶς ἁμαρτάνεις
  choice: du doppelt sündigst
  rationale: Entspricht knapp und unmittelbar dem griechischen Ausdruck und lässt offen, worin die beiden Sünden im Einzelnen bestehen.
theological_decisions:
- issue: Verantwortung des Angeredeten für die doppelte Sünde
  choice: 'Die Aussage bleibt direkt: Durch weiteres Streiten kann der Angeredete doppelt sündigen, wenn der andere schwört.'
  alternative: Explizit erklären, dass er den anderen zum Meineid verleitet und zusätzlich selbst streitsüchtig handelt.
  rationale: Der griechische Text erläutert die doppelte Sünde nicht; eine konkrete theologische oder ethische Aufschlüsselung wäre interpretierende Ergänzung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit engem Anschluss an die knappe griechische Satzstruktur. Die leicht verschachtelte Stellung von „wenn er schwört“ erhält den logischen Bezug und die Spannung des Ausgangstextes.
