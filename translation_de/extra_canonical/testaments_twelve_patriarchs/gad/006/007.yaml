id: T12P.GAD.6.7
reference: Testament of Gad 6:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 7. Ἐὰν δέ *ἔστω ἀναιδὴς⁵³ καὶ ἐνίσταται⁵⁴ τῇ κακίᾳ, *καὶ οὕτως⁵⁵ ἄφες αὐτῷ ἀπὸ καρδίας, καὶ δὸς⁵⁶ τῷ Θεῷ τὴν ἐκδίκησιν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/007.yaml
  text: But even if he is shameless and persists in evil, even so forgive him from the heart, and give vengeance to God.
translation:
  language: de
  text: Doch selbst wenn er schamlos ist und am Bösen festhält, vergib ihm dennoch von Herzen und übergib Gott die Vergeltung.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀναιδής
  choice: schamlos
  rationale: Gibt die fehlende Scham beziehungsweise Unverfrorenheit des griechischen Ausdrucks direkt und verständlich wieder.
- source_word: ἐνίσταται τῇ κακίᾳ
  choice: am Bösen festhält
  rationale: Bewahrt den Gedanken des beharrlichen Widerstands beziehungsweise Verharrens und gibt κακία allgemein als „das Böse“ wieder, ohne es auf eine einzelne Tat zu verengen.
- source_word: ἄφες αὐτῷ ἀπὸ καρδίας
  choice: vergib ihm von Herzen
  rationale: Natürliche deutsche Wiedergabe der ausdrücklichen Aufforderung zu innerlich aufrichtiger Vergebung.
- source_word: δὸς τῷ Θεῷ τὴν ἐκδίκησιν
  choice: übergib Gott die Vergeltung
  rationale: „Übergib“ wahrt die aktive Bedeutung von δός besser als bloßes „überlass“, klingt im Deutschen aber natürlicher als „gib Gott die Vergeltung“.
theological_decisions:
- issue: Vergebung trotz fortgesetzten Bösen
  choice: Die unbedingte Aufforderung „vergib ihm dennoch“ bleibt bestehen.
  alternative: Die Vergebung von Reue oder Verhaltensänderung abhängig machen.
  rationale: Der griechische Text fordert gerade auch bei Schamlosigkeit und Beharren im Bösen Vergebung von Herzen; eine zusätzliche Bedingung wäre sachlich und theologisch importiert.
- issue: Göttliche Vergeltung
  choice: Die Vergeltung wird aktiv Gott übergeben.
  alternative: „Überlass die Rache Gott“ oder eine Aussage, Gott werde sicher bestrafen.
  rationale: Die Formulierung bewahrt die Spannung des Imperativs δός und vermeidet sowohl die emotional engere Festlegung auf „Rache“ als auch eine über den Text hinausgehende Aussage über Art oder Gewissheit des göttlichen Handelns.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Doch selbst wenn … dennoch“ bildet die nachdrückliche konzessive Struktur ab. Keine Fußnoten erforderlich.
