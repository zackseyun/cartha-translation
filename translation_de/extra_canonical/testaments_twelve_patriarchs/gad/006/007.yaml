  source_fidelity: 'Der Text gibt die konzessive Abfolge des Griechischen zuverlässig wieder: ἀναιδής als „schamlos“, ἐνίσταται τῇ κακίᾳ als beharrliches Festhalten am Bösen, ἄφες ... ἀπὸ καρδίας als Vergebung von Herzen und δὸς τῷ Θεῷ τὴν ἐκδίκησιν als Übertragung der Vergeltung an Gott. Die deutsche Fassung vermeidet eine unzulässige Festlegung darauf, wie Gott diese Vergeltung ausführt.'
  naturalness: „Doch selbst wenn ... dennoch“ ist zwar nachdrücklich, aber im würdigen modernen Standarddeutsch gut verständlich und bildet die betonte Konzession angemessen ab. „Vergib ihm von Herzen“ und „übergib Gott die Vergeltung“ sind idiomatisch und klar.
  terminology: „Das Böse“ bewahrt die allgemeine Bedeutung von κακία, ohne auf eine einzelne Verfehlung zu verengen. „Vergeltung“ ist für ἐκδίκησις sachlich passend und weniger emotional verengt als „Rache“. Die Gottesbezeichnung entspricht dem griechischen τῷ Θεῷ.
