source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: VI. *Καὶ νῦν¹, τέκνα μου, Γπαραινῶ ὑμῖν⌉². ἀγαπᾶτε³ ἕκαστος *τὸν πλησίον⁴ αὑτοῦ⁵, καὶ ἐξάρατε τὸ μῖσος ἀπὸ τῶν καρδιῶν ὑμῶν· ἀγαπήσατε⁶ ἀλλήλους⁷ ἐν ἔργῳ καὶ λόγῳ καὶ διανοίᾳ ψυχῆς.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/001.yaml
  text: 'And now, my children, I urge you: let each one love his neighbor, and remove hatred from your hearts. Love one another in deed and word and in thought of soul.'
translation:
  language: de
  text: 'Und nun, meine Kinder, ermahne ich euch: Jeder von euch liebe seinen Nächsten, und entfernt den Hass aus euren Herzen. Liebt einander in Tat und Wort und im Denken der Seele.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: παραινῶ
  choice: ermahne ich
  rationale: Gibt den eindringlichen, beratend-mahnenden Charakter des Verbs in einem würdigen und natürlichen deutschen Ausdruck wieder.
- source_word: τὸν πλησίον αὑτοῦ
  choice: seinen Nächsten
  rationale: Entspricht der etablierten und sachlich genauen deutschen Wiedergabe für die jeweils nahestehende Mitperson.
- source_word: ἐξάρατε
  choice: entfernt
  rationale: Bewahrt den Imperativ und das Bild, den Hass aus dem Inneren fortzunehmen, ohne es interpretierend zu verstärken.
- source_word: ἐν ἔργῳ καὶ λόγῳ
  choice: in Tat und Wort
  rationale: Formnah, knapp und im Deutschen idiomatisch.
- source_word: διανοίᾳ ψυχῆς
  choice: im Denken der Seele
  rationale: Spiegelt die ungewöhnliche und möglicherweise bewusst spannungsreiche Verbindung beider Substantive wider, ohne sie auf Absicht, Gesinnung oder Gefühl einzuengen.
theological_decisions:
- issue: Reichweite des Liebesgebots
  choice: Jeder soll seinen Nächsten lieben … Liebt einander
  alternative: Jeder soll den anderen lieben
  rationale: Die unterschiedlichen griechischen Ausdrücke πλησίον und ἀλλήλους bleiben unterscheidbar; dadurch wird ihre mögliche inhaltliche Nuance nicht eingeebnet.
- issue: Bedeutung von διανοίᾳ ψυχῆς
  choice: im Denken der Seele
  alternative: mit der Gesinnung der Seele / aus tiefster Seele
  rationale: Die Übersetzung vermeidet eine psychologische oder theologische Festlegung und erhält die formale Spannung des griechischen Ausdrucks.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, paränetischem Ton. Der Wechsel vom singularisch verteilenden Gebot („Jeder … seinen Nächsten“) zum gemeinschaftlichen Imperativ („Liebt einander“) wurde bewahrt. Keine Fußnoten erforderlich.
