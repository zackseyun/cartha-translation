source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 6. Ἐὰν *δὲ ἀρνήσηται⁴⁵ καὶ *αἰδεσθῇ ἐλεγχόμενος⁴⁶, ἡσύχασον⁴⁷ μὴ †ἐλέγξῃς⁴⁸ αὐτόν· ὁ γὰρ ἀρνούμενος⁴⁹ μετανοεῖ *τοῦ πλημμελῆσαι⁵⁰ *εἰς σέ⁵¹. *καὶ [φοβηθεὶς] εἰρηνεύει⁵².
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/006/006.yaml
  text: But if he denies it and is ashamed when reproved, be still; do not reprove him. For the one who denies it repents of having sinned against you, so that he may not do wrong to you again, and being afraid he makes peace.
translation:
  language: de
  text: Wenn er es aber abstreitet und sich schämt, wenn er zurechtgewiesen wird, dann schweige; weise ihn nicht zurecht. Denn wer es abstreitet, bereut, sich gegen dich vergangen zu haben, und schließt aus Furcht Frieden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „aus Furcht“ beruhen auf einem im griechischen Text unsicher überlieferten Wort.
    reason: Kennzeichnet die eckig geklammerte Lesart φοβηθείς, ohne eine nicht belegte Aussage über andere Textfassungen hinzuzufügen.
lexical_decisions:
- source_word: ἀρνήσηται / ὁ ἀρνούμενος
  choice: es abstreitet / wer es abstreitet
  rationale: Das im Zusammenhang vorausgesetzte Fehlverhalten wird im Deutschen natürlich durch ein neutrales „es“ aufgenommen; „abstreiten“ trifft die Bedeutung des Leugnens einer Beschuldigung.
- source_word: αἰδεσθῇ
  choice: sich schämt
  rationale: Gibt die Scham beziehungsweise Beschämung angesichts der Zurechtweisung direkt wieder.
- source_word: ἡσύχασον
  choice: dann schweige
  rationale: Der Imperativ kann „halte dich ruhig“ oder „schweige“ bedeuten; im Zusammenhang mit dem Unterlassen weiterer Zurechtweisung ist „schweige“ prägnant und natürlich.
- source_word: ἐλεγχόμενος / ἐλέγξῃς
  choice: zurechtgewiesen wird / weise ... zurecht
  rationale: Bewahrt die lexikalische Verbindung beider Formen von ἐλέγχω und vermeidet die stärkere Bedeutung „überführen“, die hier weniger natürlich wäre.
- source_word: μετανοεῖ
  choice: bereut
  rationale: Im Anschluss an den Infinitiv bezeichnet das Verb Reue über die begangene Verfehlung; „bereut“ ist idiomatischer als „kehrt um“.
- source_word: τοῦ πλημμελῆσαι εἰς σέ
  choice: dass er sich gegen dich vergangen hat
  rationale: Gibt die persönliche Verfehlung ernst und idiomatisch wieder, ohne zwingend eine engere dogmatische Bedeutung von „sündigen“ einzutragen.
- source_word: εἰρηνεύει
  choice: schließt ... Frieden
  rationale: Gibt das Herstellen friedlicher Beziehungen wieder; „schließt Frieden“ ist im Deutschen klarer als das ungebräuchliche „friedet“.
theological_decisions:
- issue: Begründungszusammenhang zwischen Leugnen und Reue
  choice: 'Die Aussage bleibt wörtlich paradox: Das Abstreiten wird als mit Reue verbunden dargestellt.'
  alternative: Das Leugnen als bloßes Zeichen oder als Beginn der Reue ausdrücklich erklären.
  rationale: Der griechische Text löst die Spannung nicht auf; die Übersetzung soll keine psychologische oder theologische Deutung ergänzen.
- issue: Möglicher Zweck- oder Folgesatz nach εἰς σέ
  choice: Keinen Satz über künftiges Nicht-Wiederholen in den Haupttext aufnehmen.
  alternative: „damit er dir nicht wieder Unrecht tut“ ergänzen, wie in der englischen Konsultationsfassung.
  rationale: Diese Aussage steht im bereitgestellten griechischen Text nicht ausdrücklich; sie dürfte auf einer abweichenden Textüberlieferung oder Rekonstruktion beruhen und darf nicht stillschweigend als sicherer Wortlaut erscheinen.
- issue: Unsicheres φοβηθείς
  choice: „aus Furcht“ im Text wiedergeben und die textkritische Unsicherheit kennzeichnen.
  alternative: Die Worte auslassen oder ohne Hinweis als sicher übersetzen.
  rationale: Die eckigen Klammern der Edition zeigen Unsicherheit an; der Sinn lässt sich übersetzen, muss aber transparent als textkritisch unsicher markiert werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit direkter Anrede. Die kurzen Imperative bewahren die zugespitzte paränetische Form. Die auffällige Spannung, dass der Leugnende dennoch bereut, wird nicht harmonisiert.
