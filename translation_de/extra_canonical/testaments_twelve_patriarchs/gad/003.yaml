  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/003.yaml
  text: '1[a]. And now hear a word of truth: listen in order to practice righteousness and every law of the Most High, and do not be led astray, my children, by the spirit of hatred, because it is evil in all the deeds of men. 2. For whatever the one who hates may do, it is abominable. If someone does the law of the Lord[b], the hater does not praise him. If someone fears the Lord and desires what is righteous, the hater does not love him. 3. He reproaches the truth, envies the one who prospers, embraces slander, and loves arrogance, because hatred blinds his soul, as it did mine when I looked at Joseph.'
translation:
  language: de
  text: '**Testament Gads 3**


    **1.** Und nun hört ein Wort der Wahrheit:[a] Hört darauf, damit ihr Gerechtigkeit übt und jedes Gesetz des Höchsten befolgt. Lasst euch nicht, meine Kinder, vom Geist des Hasses in die Irre führen; denn er ist bei allen Taten der Menschen böse. **2.** Alles, was der Hassende tut, ist verabscheuungswürdig. Wenn jemand das Gesetz des Herrn befolgt, lobt der Hassende ihn nicht. Wenn jemand den Herrn fürchtet und das Gerechte will, liebt der Hassende ihn nicht. **3.** Er tadelt die Wahrheit, beneidet den, der Erfolg hat,[b] heißt üble Nachrede willkommen und liebt den Hochmut; denn der Hass macht seine Seele blind, wie auch meine, als ich Josef ansah.


    [a] Oder: »hört ein wahres Wort«. Die griechische Wendung kann als unbestimmte oder als stärker bestimmte feierliche Aufforderung verstanden werden.


    [b] »Der Erfolg hat« kann auch mit »dem etwas gelingt« oder möglicherweise mit »der richtig handelt« wiedergegeben werden. Im unmittelbaren Zusammenhang spricht der Neid eher für erfolgreiches Handeln.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hört ein wahres Wort«. Die griechische Wendung kann als unbestimmte oder als stärker bestimmte feierliche Aufforderung verstanden werden.'
    reason: lexical_alternative
  - marker: b
    text: »Der Erfolg hat« kann auch mit »dem etwas gelingt« oder möglicherweise mit »der richtig handelt« wiedergegeben werden. Im unmittelbaren Zusammenhang spricht der Neid eher für erfolgreiches Handeln.
    reason: lexical_alternative
lexical_decisions:
- source_word: λόγον ἀληθείας
  choice: ein Wort der Wahrheit
  rationale: Bewahrt die feierliche testamentarische Einleitung, ohne die im artikellosen Griechisch verbleibende Bestimmtheit stärker festzulegen.
- source_word: τοῦ ποιεῖν δικαιοσύνην
  choice: damit ihr Gerechtigkeit übt
  rationale: Gibt den Zweck des Hörens und den ethischen Vollzug von δικαιοσύνη wieder; »Gerechtigkeit üben« ist bibelnah, verständlich und würdevoll.
- source_word: πάντα νόμον ὑψίστου
  choice: jedes Gesetz des Höchsten befolgt
  rationale: Erhält den distributiven Sinn von πάντα und den erhabenen Gottestitel; »befolgen« macht das im Kontext gemeinte Tun des Gesetzes im Deutschen idiomatisch.
- source_word: πλανᾶσθε
  choice: euch … in die Irre führen lassen
  rationale: Bewahrt die mediale beziehungsweise passive Nuance einer Irreführung durch den Geist des Hasses.
- source_word: πνεύματι τοῦ μίσους
  choice: vom Geist des Hasses
  rationale: Erhält die Personifizierung einer moralisch-geistigen Macht, ohne sie ausdrücklich als dämonisches Wesen festzulegen.
- source_word: βδελυκτόν
  choice: verabscheuungswürdig
  rationale: Gibt die starke moralisch-religiöse Missbilligung natürlich und würdevoll wieder.
- source_word: φοβεῖται Κύριον
  choice: den Herrn fürchtet
  rationale: Bewahrt die geläufige biblische Wendung und schwächt sie nicht zu bloßer Achtung ab.
- source_word: θέλει τὸ δίκαιον
  choice: das Gerechte will
  rationale: Bewahrt den Zusammenhang mit δικαιοσύνη und bezeichnet eine ethische Willensausrichtung.
- source_word: τῷ κατορθοῦντι
  choice: den, der Erfolg hat
  rationale: Der Neid als unmittelbarer Kontext legt Erfolg oder Gelingen nahe; die mögliche Bedeutung »richtig handeln« bleibt in der Fußnote erhalten.
- source_word: καταλαλιὰν ἀσπάζεται
  choice: heißt üble Nachrede willkommen
  rationale: Bewahrt das Bild bereitwilliger Aufnahme und gibt καταλαλιά als schädigendes Reden wieder, ohne es unnötig auf eine bestimmte Rechtsbedeutung von Verleumdung einzuengen.
- source_word: ἐκτυφλοῖ
  choice: macht … blind
  rationale: Gibt die kausative Kraft des Verbs klar und natürlich wieder.
theological_decisions:
- issue: Personifizierung des Hasses als geistige Macht
  choice: »Geist des Hasses« im Haupttext
  alternative: »ein Geist des Hasses« oder »hasserfüllte Gesinnung«
  rationale: Das Griechische lässt eine personifizierte oder annähernd personifizierte moralische Macht erkennen. »Geist« wahrt diese Spannung, ohne eine vollständig dämonologische Deutung festzuschreiben.
- issue: Rückbezug der Blindheit auf Gad
  choice: »so wie auch meine [Seele] blind war, als ich Josef ansah«
  alternative: »wie auch ich, als ich Josef ansah«
  rationale: Die knappe griechische Ellipse wird im Deutschen verständlich ergänzt, ohne die Aussage über Gads durch Hass verblendete Wahrnehmung theologisch weiter auszudeuten.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, paränetischem Ton. Biblisch vertraute Wendungen wie »Gerechtigkeit üben«, »den Herrn fürchten« und »Geist des Hasses« bleiben erhalten; schwer verständliche griechische Konstruktionen werden behutsam idiomatisiert. Die Anrede »meine Kinder« und die rhythmische Lasterreihe tragen den testamentarischen Charakter.
