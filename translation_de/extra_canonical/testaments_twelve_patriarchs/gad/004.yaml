base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004.yaml
  text: Therefore guard yourselves[a], my children, from hatred, because it works lawlessness even against the Lord himself. For it does not want to hear the words of his commandments concerning love of one's neighbor, and it sins against God. For if a brother falls, it is eager at once to report it to everyone, and it hastens that he may be judged and punished and die. And if it is some servant, it brings accusations against him before his master, and in every distress it rejoices over him, if perhaps he may be put to death. For hatred works together with envy also against those who prosper; hearing of their success and seeing it, it is always weakened. Just as love would even make the dead alive and would call back those under sentence of death, so also hatred wants to kill the living, and it does not want those who have sinned only a little to live. For the spirit of hatred, through faintheartedness, works together with Satan in everything for the death of men; but the spirit of love,
    through longsuffering[c][b], works together with the law of God for the salvation of men.
translation:
  language: de
  text: '**Testament Gads 4**


    1 Hütet euch also, meine Kinder, vor dem Hass; denn er verübt sogar gegen den Herrn selbst Unrecht. 2 Er will nämlich nicht auf die Worte seiner Gebote über die Liebe zum Nächsten hören und sündigt gegen Gott. 3 Denn wenn ein Bruder zu Fall kommt, ist der Hass sogleich darauf aus, es allen zu berichten, und setzt alles daran, dass er verurteilt und bestraft wird und stirbt. 4 Handelt es sich aber um einen Sklaven, bringt er ihn bei seinem Herrn zur Anzeige[a] und freut sich über jede Bedrängnis, die ihn trifft, ob er vielleicht getötet wird. 5 Denn der Hass verbündet sich mit dem Neid, auch gegen die, denen es gut geht; hört und sieht er ihren Erfolg, wird er stets krank. 6 Wie die Liebe sogar die Toten lebendig machen und die zum Tod Verurteilten zurückrufen will, so will der Hass die Lebenden töten und will nicht, dass die leben, die sich nur in einer kleinen Sache versündigt haben.[b] 7 Denn der Geist des Hasses wirkt durch Kleinmut[c] in allem mit dem Satan zusammen, um den Menschen
    den Tod zu bringen; der Geist der Liebe aber wirkt durch Langmut mit dem Gesetz Gottes zusammen, um den Menschen Rettung zu bringen.


    [a] Oder: »verleumdet ihn bei seinem Herrn«. Der griechische Ausdruck bezeichnet hier wahrscheinlich eine feindselige Anzeige bei einer Autorität.


    [b] Möglich ist auch: »die nur ein wenig gesündigt haben«.


    [c] Das griechische Wort kann auch »Mutlosigkeit«, »Verzagtheit« oder »Kleinherzigkeit« bedeuten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »verleumdet ihn bei seinem Herrn«. Der griechische Ausdruck bezeichnet hier wahrscheinlich eine feindselige Anzeige bei einer Autorität.'
    reason: lexical_alternative
  - marker: b
    text: 'Möglich ist auch: »die nur ein wenig gesündigt haben«.'
    reason: source_ambiguity
  - marker: c
    text: Das griechische Wort kann auch »Mutlosigkeit«, »Verzagtheit« oder »Kleinherzigkeit« bedeuten.
    reason: lexical_alternative
lexical_decisions:
- source_word: μῖσος
  choice: Hass
  rationale: Das abstrakte Substantiv bleibt erhalten und wird wie im Griechischen als handelnde moralische Macht personifiziert.
- source_word: ἀνομίαν ποιεῖ
  choice: verübt … Unrecht
  rationale: Die Wendung gibt das aktive ποιεῖ idiomatisch wieder, ohne ἀνομία auf eine bloße Regelverletzung zu verengen.
- source_word: λόγων ἐντολῶν αὐτοῦ
  choice: die Worte seiner Gebote
  rationale: Beide griechischen Substantive bleiben sichtbar; die Weigerung betrifft das Hören der in Worten ergehenden Gebote.
- source_word: ἀγάπης τοῦ πλησίον
  choice: Liebe zum Nächsten
  rationale: Natürliche, bibelsprachlich vertraute deutsche Wiedergabe des ethischen Ausdrucks.
- source_word: ἀναγγεῖλαι τοῖς πᾶσιν
  choice: es allen zu berichten
  rationale: Bewahrt sowohl den Vorgang der Bekanntmachung als auch deren öffentliche Reichweite.
- source_word: δοῦλος
  choice: Sklave
  rationale: Der ausdrückliche Gegensatz zwischen δοῦλος und κύριος macht den rechtlich-sozialen Status relevant; »Diener« wäre abschwächend.
- source_word: συμβαλεῖ αὐτὸν πρὸς τὸν κύριον αὐτοῦ
  choice: bringt er ihn bei seinem Herrn zur Anzeige
  rationale: Gibt im Kontext die feindselige Denunziation wieder, lässt aber in der Fußnote die mögliche Nuance der Verleumdung erkennen.
- source_word: ἐν προκοπῇ … ἀσθενεῖ
  choice: hört und sieht er ihren Erfolg, wird er jedes Mal krank
  rationale: προκοπή bezeichnet das Vorankommen oder Gedeihen; ἀσθενεῖ wird nicht zum bloßen Missfallen verflacht, sondern als bildhaftes Krankwerden bewahrt.
- source_word: τοὺς ἐν ὀλίγῳ ἁμαρτήσαντας
  choice: die sich nur in einer kleinen Sache versündigt haben
  rationale: Bewahrt die sachbezogene Lesart von ἐν ὀλίγῳ; die mengenbezogene Alternative wird in der Fußnote genannt.
- source_word: ὀλιγοψυχία
  choice: Kleinmut
  rationale: Der seltene Ausdruck bezeichnet eine Enge oder Schwäche des Mutes; die ungewohnte Verbindung mit dem Geist des Hasses bleibt erhalten.
- source_word: μακροθυμία
  choice: Langmut
  rationale: Bewahrt den ethisch-geistlichen Gegenbegriff zu ὀλιγοψυχία und ist im würdigen modernen Bibelregister verständlich.
theological_decisions:
- issue: Personifikation von Hass und Liebe
  choice: Hass und Liebe werden als handelnde moralische Mächte wiedergegeben, die in Vers 7 ausdrücklich als »Geist des Hasses« und »Geist der Liebe« erscheinen.
  alternative: Die Aussagen durchgehend als bloße Beschreibung menschlicher Gefühle formulieren.
  rationale: Der griechische Text führt von personifizierten Abstrakta ausdrücklich zur πνεῦμα-Sprache. Die Übersetzung bewahrt diese geistlich-moralische Spannung, ohne die Mächte ontologisch näher zu bestimmen.
- issue: Lebendigmachende Sprache über die Liebe
  choice: »die Toten lebendig machen« und »die zum Tod Verurteilten zurückrufen« bleiben als starke Aussagen stehen.
  alternative: Die Wendungen als bloße Hilfsbereitschaft abschwächen oder ausdrücklich als Auferstehung deuten.
  rationale: Der Text lässt offen, ob die Aussage primär rhetorische Übertreibung oder darüber hinausgehende Lebenssprache ist; die Übersetzung entscheidet diese Spannung nicht.
- issue: Zusammenwirken mit Satan beziehungsweise Gottes Gesetz
  choice: Das symmetrische »wirkt … zusammen« wird auf beiden Seiten beibehalten.
  alternative: Die erste Hälfte als satanische Beherrschung und die zweite als bloßen Gesetzesgehorsam paraphrasieren.
  rationale: συνεργεῖ steht in beiden Satzhälften. Die formale Parallelität gehört zur theologischen Gegenüberstellung und darf nicht einseitig aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die wiederholte Personifikation des Hasses wurde beibehalten. »Sklave« bezeichnet den im Ausgangstext sozial und rechtlich relevanten Status; »Langmut« und »Kleinmut« bewahren die pointierte Gegenüberstellung des griechischen Textes.
