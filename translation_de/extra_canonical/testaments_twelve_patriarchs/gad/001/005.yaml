  text: And he returned to Hebron to our father. And he made him recline near himself, because he loved him very much.
translation:
  language: de
  text: 5. Und er kehrte nach Hebron zu unserem Vater zurück. Und er ließ ihn neben sich zu Tisch liegen, weil er ihn sehr liebte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπέστρεψεν
  choice: kehrte … zurück
  rationale: Gibt die Rückkehrbewegung des Aorists natürlich und genau wieder.
- source_word: ἀνέκλινεν αὐτὸν πλησίον αὐτοῦ
  choice: Dieser ließ ihn neben sich zu Tisch liegen
  rationale: Bewahrt die kausative Bedeutung von ἀνακλίνω und verdeutlicht idiomatisch die antike Tischsitte; „Dieser“ macht den im Griechischen nur aus dem Zusammenhang erschließbaren Subjektwechsel verständlich.
- source_word: ἠγάπα αὐτὸν πάνυ
  choice: weil er ihn sehr liebte
  rationale: Entspricht schlicht und würdig dem durativen Imperfekt mit dem verstärkenden πάνυ.
