lexical_decisions:
- source_word: Ἀντίγραφον
  choice: Abschrift
  rationale: Gibt die Bedeutung „Kopie/Abschrift“ präzise und in einer Überschrift natürlich wieder.
- source_word: διαθήκης
  choice: Testaments
  rationale: Im literarischen Zusammenhang bezeichnet διαθήκη die letztwillige Unterweisung des Patriarchen; „Testament“ bewahrt zugleich den etablierten Werktitel.
- source_word: ἐλάλησε
  choice: mitteilte
  rationale: Das griechische „sprach“ wird hier idiomatisch wiedergegeben, ohne den mündlichen Charakter der Mitteilung aufzugeben.
- source_word: ἐν τῷ ἑκατοστῷ εἰκοστῷ πέμπτῳ ἔτει τῆς ζωῆς αὐτοῦ
  choice: im hundertfünfundzwanzigsten Jahr seines Lebens
  rationale: Formnahe und im Deutschen verständliche Wiedergabe der Altersangabe.
- source_word: λέγων αὐτοῖς
  choice: mit folgenden Worten
  rationale: Leitet die anschließende direkte Rede natürlich ein und entspricht funktional dem griechischen Partizip.
