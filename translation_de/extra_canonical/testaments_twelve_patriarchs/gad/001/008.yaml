  text: And beyond this I was angry with Joseph until the day of his being sold.
translation:
  language: de
  text: 8 Darüber hinaus grollte ich Josef bis zu dem Tag, an dem er verkauft wurde.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπὲρ τοῦτο
  choice: darüber hinaus
  rationale: 'Gibt den ergänzenden Sinn der Wendung natürlich wieder: Zu dem zuvor Genannten kam dieser Groll noch hinzu.'
- source_word: ἐνεκότουν τῷ Ἰωσήφ
  choice: grollte ich Josef
  rationale: ἐγκοτέω mit Dativ bezeichnet anhaltenden Groll oder Unwillen gegen jemanden; „grollen“ bewahrt diesen fortdauernden, inneren Zorn.
- source_word: ἕως ἡμέρας διαπράσεως αὐτοῦ
  choice: bis zu dem Tag, an dem er verkauft wurde
  rationale: Die Formulierung gibt den Verkauf Josefs als zeitlichen Endpunkt an und macht die auf Josef bezogene passive Bedeutung im Deutschen verständlich.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Grollte“ ist präziser als das allgemeinere „war zornig“, weil es den anhaltenden Charakter der Haltung ausdrückt.
