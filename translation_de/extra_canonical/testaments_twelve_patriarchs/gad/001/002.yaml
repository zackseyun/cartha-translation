  text: 2. *†Ἀκούσατε, τέκνα μου⁷· ἐγὼ ἐγενόμην ἔννατος υἱὸς⁸ τῷ Ἰακώβ⁹, καὶ¹⁰ ἤμην¹¹ ἀνδρεῖος ἐπὶ τῶν ποιμνίων¹².
