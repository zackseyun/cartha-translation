  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/002.yaml
  text: 'Listen, my children: I was the ninth son born to Jacob, and I was brave over the flocks.'
translation:
  language: de
  text: 'Hört, meine Kinder: Ich war Jakobs neunter Sohn und war tapfer bei den Herden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀκούσατε
  choice: Hört
  rationale: Der griechische Aorist-Imperativ fordert die Kinder unmittelbar zum Zuhören auf; „Hört“ ist natürlich und würdevoll.
- source_word: ἔννατος υἱὸς τῷ Ἰακώβ
  choice: Jakobs neunter Sohn
  rationale: Gibt die prädikative Aussage mit dem Dativ der Zugehörigkeit idiomatisch wieder, ohne das im Griechischen nicht ausdrücklich stehende „geboren“ einzufügen.
- source_word: ἀνδρεῖος
  choice: tapferer
  rationale: Bezeichnet Mut und Tüchtigkeit; „tapfer“ bewahrt den Kern der Aussage.
- source_word: ἐπὶ τῶν ποιμνίων
  choice: Hüter der Herden
  rationale: Die wörtliche Fassung „über/bei den Herden“ wäre im Deutschen unnatürlich. Im Kontext beschreibt die Wendung Gads mutige Bewährung in der Aufsicht über die Herden.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem testamentarischem Ton. Die knappe direkte Anrede und die autobiografische Satzstruktur bleiben erhalten.
