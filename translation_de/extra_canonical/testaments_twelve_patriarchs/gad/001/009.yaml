id: T12P.GAD.1.9
reference: Testament of Gad 1:9
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 9. Καὶ τὸ πνεῦμα τοῦ⁵⁹ μίσους ἦν ἐν ἐμοί, καὶ⁶⁰ οὐκ ἤθελον⁶¹ *οὔτε †δι᾽ ἀκοῆς οὔτε δι᾽ ὀφθαλμῶν⁶² ἰδεῖν τὸν Ἰωσήφ, ὅτι⁶³ κατὰ πρόσωπον⁶⁴ ἤλεγξεν ἡμᾶς Γλέγων¹⁶⁵, ὅτι χωρὶς⁶⁶ Ἰούδα⁶⁷ ἠσθίομεν *τὰ θρέμματα⁶⁸. *πάντα γὰρ⁶⁹ ὅσα ἔλεγε *τῷ πατρὶ⁷⁰ ἐπείθετο αὐτῷ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/009.yaml
  text: And the spirit of hatred was in me, and I did not want to perceive Joseph, neither through hearing nor through sight, because he rebuked us to our face, saying that we were eating the livestock without Judah. For in everything he said to our father, he believed him.
translation:
  language: de
  text: 9 Und der Geist des Hasses war in mir, und ich wollte Josef weder hören noch sehen, weil er uns ins Gesicht zurechtgewiesen und gesagt hatte, wir äßen das Vieh ohne Juda. Denn unser Vater glaubte ihm alles, was Josef ihm sagte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὸ πνεῦμα τοῦ μίσους
  choice: der Geist des Hasses
  rationale: Die formale Wendung des Griechischen bleibt erhalten und wird nicht psychologisierend zu einem bloßen Gefühl abgeschwächt.
- source_word: οὔτε δι᾽ ἀκοῆς οὔτε δι᾽ ὀφθαλμῶν ἰδεῖν
  choice: weder hören noch sehen
  rationale: Die beiden Wahrnehmungswege werden in natürlichem Deutsch wiedergegeben; der Sinn ist, dass Gad keinerlei Wahrnehmung oder Begegnung mit Josef ertragen wollte.
- source_word: κατὰ πρόσωπον ἤλεγξεν ἡμᾶς
  choice: uns ins Gesicht zurechtgewiesen
  rationale: Bewahrt sowohl die offene, unmittelbare Konfrontation als auch den tadelnden Sinn von ἐλέγχω.
- source_word: τὰ θρέμματα
  choice: das Vieh
  rationale: Bezeichnet gehaltene beziehungsweise aufgezogene Herdentiere und lässt sich im Deutschen knapp und idiomatisch mit „das Vieh“ wiedergeben.
- source_word: χωρὶς Ἰούδα
  choice: ohne Juda
  rationale: Folgt der knappen griechischen Formulierung und lässt offen, ob Juda abwesend war oder nicht beteiligt wurde.
- source_word: ἐπείθετο αὐτῷ
  choice: unser Vater glaubte ihm
  rationale: Im Kontext ist der unausgesprochene Handelnde der Vater, der Josefs Mitteilungen Glauben schenkte; die deutsche Satzbildung macht diesen Bezug verständlich.
theological_decisions:
- issue: Der „Geist des Hasses“
  choice: Als „Geist“ beibehalten
  alternative: Als innere Haltung oder Gefühl des Hasses umschreiben
  rationale: Der Text personifiziert beziehungsweise objektiviert den Hass als πνεῦμα. Eine rein psychologische Umschreibung würde die mögliche geistliche Dimension voreilig beseitigen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Aussage „das Vieh ohne Juda essen“ bleibt bewusst knapp und mehrdeutig, da der vorgelegte griechische Text keine sichere Präzisierung erlaubt.
