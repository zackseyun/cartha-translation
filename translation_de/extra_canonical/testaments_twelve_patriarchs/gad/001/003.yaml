  text: 3. *Ἐγὼ οὖν¹³ ἐφύλαττον Γἐν τῇ¹⁴ νυκτὶ¹⁴ *τὸ ποίμνιον¹⁵, καὶ ὅταν¹⁶ ἤρχετο δ¹⁷ λέων, Γἢ ὁ λύκος¹⁸, *ἢ πᾶν θηρίον¹⁹ ἐπὶ *τὴν ποίμνην²⁰, κατεδίωκον²¹ αὐτό²², καὶ *φθάνων ἐκράτουν²³ *τὸν πόδα αὐτοῦ τῇ χειρὶ μου²⁴ καὶ *ἠκόντισα αὐτὸ ὡσεὶ λίθου βολήν, καὶ²⁵ *ἀνῄρουν αὐτό²⁶.
