base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/003.yaml
  text: I therefore guarded the flock by night; and when a lion or a wolf or any wild beast came against the flock, I would chase it down, and overtaking it I would seize its foot with my hand, and hurl it about a stone's throw, and so kill it.
translation:
  language: de
  text: Ich hütete also die Herde bei Nacht. Und wenn ein Löwe, ein Wolf oder irgendein wildes Tier auf die Herde zukam, jagte ich ihm nach. Sobald ich es eingeholt hatte, ergriff ich es mit der Hand am Fuß, schleuderte es etwa einen Steinwurf weit und tötete es.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐφύλαττον
  choice: hütete
  rationale: Im Zusammenhang mit einer Herde bezeichnet das Imperfekt ein wiederholtes beziehungsweise andauerndes Bewachen; „hütete“ ist dafür im Deutschen natürlich.
- source_word: ἐπὶ τὴν ποίμνην
  choice: über die Herde herfiel
  rationale: Die Präposition mit Akkusativ beschreibt hier eine feindliche Bewegung gegen die Herde; die idiomatische Wendung gibt den Angriff deutlich wieder.
- source_word: κατεδίωκον
  choice: jagte ich ihm nach
  rationale: Das Imperfekt schildert die wiederholte Handlung; „nachjagen“ wahrt den Sinn einer entschlossenen Verfolgung.
- source_word: φθάνων ἐκράτουν
  choice: Sobald ich es eingeholt hatte, packte ich
  rationale: φθάνω bezeichnet hier das Einholen des Tieres; ἐκράτουν meint das feste Ergreifen oder Festhalten.
- source_word: τὸν πόδα αὐτοῦ
  choice: am Fuß
  rationale: „Fuß“ entspricht πόδα formal; eine Spezifizierung als „Pfote“ wäre zoologisch natürlicher, würde aber die Ausdrucksweise der Quelle verengen.
- source_word: ἠκόντισα
  choice: schleuderte
  rationale: Das Verb bezeichnet das Werfen oder Schleudern; „schleuderte“ passt zur außergewöhnlichen Kraftleistung und zum folgenden Entfernungsmaß.
- source_word: ὡσεὶ λίθου βολήν
  choice: etwa einen Steinwurf weit
  rationale: Die Wendung gibt eine ungefähre Distanz an und lässt sich im Deutschen unmittelbar und verständlich wiedergeben.
- source_word: ἀνῄρουν
  choice: tötete
  rationale: Im Kontext bedeutet das Verb eindeutig „töten“; das Imperfekt gehört zur Reihe wiederholter Handlungen.
