  text: 6. Καὶ εἶπεν Ἰωσὴφ τῷ πατρὶ ἡμῶν³⁹, ὅτι οἱ⁴⁰ υἱοὶ ΓΖέλφας καὶ Βάλλας]⁴¹ θύουσι Γτὰ θρέμματα]⁴² τὰ καλὰ⁴³ καὶ ἐσθίουσιν αὐτὰ παρὰ γνώμην⁴⁴ Ῥουβὶμ καὶ Ἰούδα⁴⁵.
