base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/006.yaml
  text: And Joseph told our father that the sons of Zilpah and Bilhah were slaughtering the best of the livestock and eating them without the consent of Reuben and Judah.
translation:
  language: de
  text: 6 Und Josef sagte unserem Vater, dass die Söhne Silpas und Bilhas die besten Tiere schlachteten und sie ohne Zustimmung Rubens und Judas aßen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: θύουσι
  choice: schlachteten
  rationale: Im Zusammenhang mit Nutztieren bezeichnet das Verb hier das Schlachten; eine kultische Opferhandlung ist nicht ausdrücklich gemeint.
- source_word: τὰ θρέμματα τὰ καλὰ
  choice: die besten Tiere
  rationale: θρέμματα meint gehaltene bzw. aufgezogene Tiere; καλὰ bezeichnet hier plausibel die ausgesuchten, besten Tiere.
- source_word: παρὰ γνώμην
  choice: ohne Zustimmung
  rationale: Die Wendung bedeutet, gegen den Willen bzw. ohne das Einverständnis einer Person zu handeln.
theological_decisions:
- issue: Bezug von παρὰ γνώμην auf die beiden Namen Ῥουβὶμ καὶ Ἰούδα
  choice: ohne Zustimmung Rubens und Judas
  alternative: gegen den Willen Rubens und Judas
  rationale: Der überlieferte griechische Text nennt sowohl Ruben als auch Juda. Die gewählte Formulierung bewahrt diesen doppelten Bezug und vermeidet die unbelegte Verkürzung auf Juda allein.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Die Namen folgen den im Deutschen üblichen biblischen Formen Silpa, Bilha, Ruben und Juda.
