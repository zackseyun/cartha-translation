  text: 7. *Ἦν γὰρ ἰδὼν⁴⁶ ὅτι ἀρνα⁴⁷ ἐξειλάμην⁴⁸ *ἐκ τοῦ⁴⁹ στόματος τῆς⁵⁰ ἄρκου, κἀκείνην⁵¹ ἐθανάτωσα, *τὸν δὲ⁵² ἀρνὸν ἔθυσα· *περὶ οὗ ἐλυπούμην⁵³, ὅτι οὐκ *ἠδύνατο ζῆν⁵⁴, καὶ⁵⁵ ἐφάγομεν αὐτόν⁵⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/001/007.yaml
  text: For he had seen that I rescued a lamb from the mouth of a bear, and I killed her, but I slaughtered the lamb — over which I grieved, because it could not live — and we ate it.
translation:
  language: de
  text: Denn er hatte gesehen, dass ich ein Lamm aus dem Maul der Bärin rettete und sie tötete. Das Lamm aber schlachtete ich; über das Lamm war ich traurig, weil es nicht am Leben bleiben konnte, und wir aßen es.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀρνά / ἀρνόν
  choice: Lamm
  rationale: Die Form bezeichnet hier ein junges Schaf; „Lamm“ ist die natürliche und genaue deutsche Entsprechung.
- source_word: ἐξειλάμην
  choice: rettete
  rationale: Das Verb bezeichnet das Herausreißen beziehungsweise Befreien aus einer Gefahr; „rettete … aus dem Maul“ gibt den Sinn idiomatisch wieder.
- source_word: ἄρκου / κἀκείνην
  choice: Bärin / sie
  rationale: Das feminine Pronomen κἀκείνην nimmt die grammatisch feminine ἄρκτος auf. „Bärin“ bewahrt den möglichen Bezug auf ein weibliches Tier und stimmt mit dem englischen Konsultationstext überein.
- source_word: ἔθυσα
  choice: schlachtete
  rationale: Im Zusammenhang mit dem verletzten Lamm bezeichnet das Verb das Töten durch Schlachtung; eine ausdrücklich kultische Opferhandlung ist nicht zwingend gemeint.
- source_word: οὐκ ἠδύνατο ζῆν
  choice: nicht am Leben bleiben konnte
  rationale: Diese Wendung vermittelt natürlicher als das wörtliche „nicht leben konnte“, dass das gerettete Tier wegen seines Zustands nicht überlebensfähig war.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzglieder folgen dem griechischen Ablauf, werden aber zur besseren Lesbarkeit auf zwei Sätze verteilt. Der Wechsel mit δέ wird durch „aber“ bewahrt; die Trauer bezieht sich eindeutig auf das geschlachtete Lamm.
