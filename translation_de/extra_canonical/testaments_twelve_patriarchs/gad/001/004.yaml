  text: So Joseph my brother was shepherding all the livestock with us for thirty days, and being young, he was weakened by the heat.
translation:
  language: de
  text: 4 So hütete mein Bruder Josef dreißig Tage lang mit uns die Herden; und weil er noch jung war, wurde er von der Hitze geschwächt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐποίμαινε μεθ’ ἡμῶν
  choice: hütete … mit uns die Herden
  rationale: Das Imperfekt bezeichnet die fortdauernde Hirtentätigkeit. Ein ausdrückliches Objekt steht im überlieferten griechischen Text nicht; „die Herden“ ergibt sich natürlich aus dem Verb und vermeidet die unbelegte Präzisierung „alles Vieh“.
- source_word: ἕως ἡμέρας τριάκοντα
  choice: dreißig Tage lang
  rationale: Gibt die im Kontext gemeinte Zeitdauer idiomatisch auf Deutsch wieder.
- source_word: ὑπάρχων νέος
  choice: weil er noch jung war
  rationale: Drückt die begleitende, hier wahrscheinlich ursächliche Partizipialkonstruktion natürlich aus; „noch“ verdeutlicht das geringe Alter, ohne eine genaue Altersstufe festzulegen.
- source_word: ἐμαλακίσθη ὑπὸ τοῦ καύσωνος
  choice: wurde er von der Hitze geschwächt
  rationale: Bewahrt Passivform und Ursache. καύσων kann starke Hitze bzw. Gluthitze bezeichnen; „Hitze“ ist im Deutschen klar und nicht überpräzise.
theological_decisions: []
translation_notes:
  register: Moderner, würdevoller Erzählstil. Die Wortstellung stellt Josef als Bruder des Sprechers klar heraus. Keine Fußnoten erforderlich.
