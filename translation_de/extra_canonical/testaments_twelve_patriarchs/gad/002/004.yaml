  to: 'So rettete der Gott unserer Väter ihn aus unseren Händen, damit wir in Israel kein großes Unrecht begehen.[a]


    Und so wurden wir durch Habgier völlig davon überzeugt, ihn zu töten.[b]'
  rationale: 'Die Korrektur stellt den Plural der griechischen Vorlage wieder her und ersetzt die missverständliche Fußnotenalternative. Der übrige Wortlaut bleibt nahe an der Vorlage und an der englischen Audit-Fassung: Gottes Rettung verhindert eine schwere unrechte Tat; Habgier führt zu voller Überzeugung beziehungsweise Ausrichtung auf die Tötung des Betreffenden.'
