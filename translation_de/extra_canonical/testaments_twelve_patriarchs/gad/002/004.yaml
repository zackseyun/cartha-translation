    issue: Plural von „Händen“ nicht abgebildet
    rationale: Die Vorlage hat τῶν χειρῶν ἡμῶν, „aus den/unseren Händen“. Die deutsche Pluralform ist ebenfalls idiomatisch und genauer als der Entwurf mit Singular „aus unserer Hand“.
  - severity: low
    issue: Fußnote b bietet eine unnatürliche Alternativübersetzung
    rationale: „von seiner Tötung überzeugt“ kann im Deutschen nahelegen, man sei vom Faktum einer bereits erfolgten Tötung überzeugt. Die Anmerkung sollte stattdessen die ungewohnte griechische Genitivkonstruktion erläutern.
