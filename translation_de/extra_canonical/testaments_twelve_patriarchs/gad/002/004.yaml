source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: '[α-text] 5. Οὕτως¹⁴ ὁ Θεὸς τῶν πατέρων ἡμῶν ἐρρύσατο αὐτὸν ἐκ τῶν χειρῶν ἡμῶν, ἵνα μὴ ποιήσωμεν ἐν τῷ Ἰσραὴλ ἀνομίαν μεγάλην. [β, Α, S¹] 4. Καὶ οὕτως τῇ πλεονεξίᾳ ἐπληροφορήθημεν¹⁹ τῆς ἀναιρέσεως αὐτοῦ.'
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/004.yaml
  text: 'Thus the God of our fathers rescued him from our hands, so that we might not commit a great lawless deed in Israel.


    And so, through greed, we were fully persuaded of his murder.'
translation:
  language: de
  text: 'So rettete der Gott unserer Väter ihn aus unseren Händen, damit wir in Israel kein großes Unrecht begehen.[a]


    Und so wurden wir durch Habgier völlig davon überzeugt, ihn zu töten.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Dieser Satz steht in der α-Textform als Vers 5; die abweichende Zählung und Textfolge der griechischen Überlieferung ist hier zusammengeführt.
    reason: Die Vorlage bietet zwei Textformen mit unterschiedlicher Verszählung beziehungsweise Folge; der Leser soll die textkritische Lage erkennen.
  - marker: b
    text: 'Wörtlich steht hier eine im Deutschen ungewohnte Wendung, etwa: „Durch Habgier wurden wir hinsichtlich seiner Tötung völlig überzeugt.“ Die Übersetzung gibt die damit gemeinte Ausrichtung auf seine Tötung idiomatisch wieder.'
    reason: Die griechische Genitivkonstruktion τῆς ἀναιρέσεως αὐτοῦ bei dem Passiv ἐπληροφορήθημεν lässt sich nicht ohne Weiteres in eine natürliche deutsche Konstruktion übertragen; die Anmerkung erläutert dies, ohne „Mord“ als zwingende Deutung festzulegen.
lexical_decisions:
- source_word: ἐρρύσατο αὐτὸν ἐκ τῶν χειρῶν ἡμῶν
  choice: rettete … ihn aus unserer Hand
  rationale: Gibt das rettende Eingreifen und die semitisch geprägte Wendung natürlich und zugleich quellennah wieder.
- source_word: ἀνομίαν μεγάλην
  choice: großes Unrecht
  rationale: ἀνομία bezeichnet Gesetzlosigkeit beziehungsweise einen Verstoß gegen die göttliche Ordnung; „großes Unrecht“ ist im Deutschen verständlich, ohne die Tat unnötig einzuengen.
- source_word: τῇ πλεονεξίᾳ
  choice: aus Habgier
  rationale: πλεονεξία bezeichnet ein gieriges Mehr-haben-Wollen; „Habgier“ bewahrt die moralische Schärfe.
- source_word: ἐπληροφορήθημεν
  choice: waren wir … völlig davon überzeugt
  rationale: Das Passiv bezeichnet hier ein vollständiges Überzeugtsein; die Formulierung bleibt näher am griechischen Ausdruck als eine bloße Wiedergabe mit „entschlossen“.
- source_word: τῆς ἀναιρέσεως αὐτοῦ
  choice: ihn zu töten
  rationale: Die substantivische Konstruktion bezeichnet seine Tötung. Die verbale deutsche Fassung ist natürlich und lässt offen, ob der Akzent auf Tötung oder Mord liegt.
theological_decisions:
- issue: Bedeutungsumfang von ἀνομία
  choice: großes Unrecht
  alternative: große Gesetzlosigkeit
  rationale: Die gewählte Fassung wahrt den moralisch-religiösen Gehalt, klingt aber in modernem Standarddeutsch natürlicher und legt keine bestimmte Kodifikation des Gesetzes fest.
- issue: Verhältnis von Habgier und Zustimmung zur Tötung
  choice: aus Habgier völlig davon überzeugt
  alternative: durch Habgier völlig zur Tötung entschlossen
  rationale: Die Übersetzung bewahrt die passive Aussage von ἐπληροφορήθημεν und löst die Spannung zwischen Beweggrund und innerer Überzeugung nicht zugunsten bloßer Entschlossenheit auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die erste Handlungsangabe bleibt in der biblisch vertrauten Einzahl „aus unserer Hand“. Der zweite Satz wird idiomatisch verbalisiert, ohne das griechische Passiv semantisch zu einem bloßen Entschluss umzudeuten.
