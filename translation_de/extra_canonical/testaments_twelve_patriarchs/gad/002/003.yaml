base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/003.yaml
  text: 'But Judah sold him secretly to the Ishmaelites.


    Therefore Simeon and I sold him to the Ishmaelites for thirty pieces of gold; and after hiding ten, we showed twenty to our brothers.'
translation:
  language: de
  text: '3 Eine Textfassung lautet: »Und Juda verkaufte ihn heimlich an die Ismaeliten.«[a] Eine andere lautet: »Darum verkauften Simeon und ich ihn an die Ismaeliten [für dreißig Goldstücke; nachdem wir zehn versteckt hatten, zeigten wir unseren Brüdern zwanzig].«[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die α-Fassung nennt Juda als denjenigen, der Josef heimlich an die Ismaeliten verkaufte.
    reason: Kennzeichnet die erste, eigenständige griechische Textfassung und ihre abweichende Zuschreibung.
  - marker: b
    text: Die β-Fassung sowie die Handschriften A und S¹ nennen Simeon und Gad. Der in eckigen Klammern wiedergegebene Wortlaut über die dreißig Goldstücke, das Verstecken von zehn und das Vorzeigen von zwanzig ist in der Ausgabe als zusätzlicher Textbestand überliefert.
    reason: Unterscheidet die abweichende Zuschreibung des Grundwortlauts von dem im Editionswortlaut gesondert abgegrenzten Zusatz.
lexical_decisions:
- source_word: κρυφῆ
  choice: heimlich
  rationale: Gibt die adverbiale Bedeutung knapp und natürlich wieder.
- source_word: πράσας / πεπράκαμεν
  choice: verkaufte / verkauften
  rationale: Bewahrt in beiden Textfassungen die konkrete Bedeutung des Verbs im Zusammenhang mit der Übergabe an die Ismaeliten.
- source_word: τοῖς Ἰσμαηλίταις
  choice: an die Ismaeliten
  rationale: Im Deutschen ist bei »verkaufen« die Käuferangabe mit »an« idiomatisch.
- source_word: τριάκοντα χρυσίων
  choice: dreißig Goldstücke
  rationale: χρυσίων bezeichnet hier gezählte Goldstücke beziehungsweise Goldmünzen; »Goldstücke« vermeidet eine unbelegte genauere Münzbezeichnung.
- source_word: ἀποκρύψαντες
  choice: versteckten wir
  rationale: Gibt das bewusste Verbergen der zehn Goldstücke klar und in natürlichem Deutsch wieder.
- source_word: ἐδείξαμεν
  choice: zeigten wir
  rationale: Entspricht der schlichten Aussage des griechischen Verbs, ohne zusätzlich zu deuten, ob die Brüder getäuscht wurden.
theological_decisions:
- issue: Abweichende Zuschreibung des Verkaufs Josefs
  choice: 'Beide überlieferten Fassungen werden ausdrücklich nebeneinandergestellt: einmal Juda, einmal Simeon und Gad.'
  alternative: Eine Fassung als Haupttext wählen und die andere ausschließlich in einer Fußnote nennen.
  rationale: Die griechische Überlieferung bietet eine echte inhaltliche Spannung hinsichtlich der handelnden Personen; sie darf nicht stillschweigend harmonisiert werden.
- issue: Zusätzliche Angabe über dreißig Goldstücke und deren Aufteilung
  choice: Die Angabe erscheint in der zweiten Fassung mit textkritischem Hinweis.
  alternative: Den Zusatz ohne Kennzeichnung in einen einheitlichen Text integrieren oder ganz auslassen.
  rationale: Der gekennzeichnete Zusatz ist nicht in gleicher Weise Teil aller bezeugten Fassungen und wird deshalb transparent wiedergegeben.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die Formulierung »Eine Textfassung … Eine andere …« ist bewusst textkritisch transparent, da ein unmarkiertes Aneinanderreihen der beiden Fassungen wie zwei aufeinanderfolgende Handlungen wirken und den Überlieferungsbefund verdunkeln würde.
