  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/001.yaml
  text: Therefore I confess my sin, children, that many times I wanted to kill him, because I hated him from my soul.
translation:
  language: de
  text: 'Darum bekenne ich, meine Kinder, meine Sünde: Viele Male wollte ich ihn töten, weil ich ihn von ganzer Seele hasste.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὁμολογῶ
  choice: ich bekenne
  rationale: Gibt das offene Eingestehen einer Schuld natürlich und sachgerecht wieder.
- source_word: τέκνα
  choice: meine Kinder
  rationale: Die direkte Anrede wird im Deutschen idiomatisch mit dem aus dem Zusammenhang erschließbaren Possessivpronomen wiedergegeben.
- source_word: πλειστάκις
  choice: oft
  rationale: Bezeichnet eine häufige beziehungsweise vielfache Wiederholung; „oft“ ist natürliches modernes Deutsch.
- source_word: ἀνελεῖν
  choice: töten
  rationale: Gibt in diesem Kontext die beabsichtigte gewaltsame Tötung klar wieder, ohne unnötige stilistische Zuspitzung.
- source_word: ἐκ ψυχῆς
  choice: aus tiefster Seele
  rationale: Bewahrt das griechische Seelenbild und bringt zugleich die Intensität des Hasses in natürlichem Deutsch zum Ausdruck.
theological_decisions:
- issue: Verhältnis von Bekenntnis und folgendem ὅτι-Satz
  choice: 'meine Sünde: Oft wollte ich ihn töten'
  alternative: meine Sünde, dass ich ihn oft töten wollte
  rationale: Der Doppelpunkt stellt den folgenden Satz als Inhalt beziehungsweise Erläuterung des Sündenbekenntnisses dar und vermeidet die im Deutschen schwerfällige Verbindung „meine Sünde, dass“.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte familiäre Anrede und die Härte des Schuldbekenntnisses bleiben erhalten; der Satzbau wurde für natürliches Deutsch behutsam gegliedert.
