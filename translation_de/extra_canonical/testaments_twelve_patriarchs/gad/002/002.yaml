source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 2. Καίγε διὰ τὰ ἐνύπνια⁵ *προσεθέμην αὐτῷ τὸ μῖσος⁶, καὶ ἤθελον αὐτὸν⁷ ἐκλεῖξαι⁸ *ἐκ γῆς⁹ ⌈ζώντων⌉¹⁰, ὃν τρόπον¹¹ ἐκλείχει¹² ὁ μόσχος τὰ χλωρὰ *τοῦ πεδίου¹³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/002/002.yaml
  text: And because of the dreams I added hatred toward him, and I wanted to lick him up from the land of the living, as a calf licks up the green growth of the field.
translation:
  language: de
  text: Und wegen der Träume steigerte ich meinen Hass gegen ihn, und ich wollte ihn vom Land der Lebenden¹ weglecken, wie ein Kalb das frische Grün des Feldes wegleckt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσεθέμην αὐτῷ τὸ μῖσος
  choice: steigerte sich mein Hass auf ihn
  rationale: Die griechische Wendung bezeichnet wörtlich ein Hinzufügen von Hass gegen ihn. Die natürliche deutsche Formulierung gibt die Zunahme des bereits vorhandenen Hasses wieder, ohne die Aussage abzuschwächen.
- source_word: ἐκλεῖξαι ἐκ γῆς ζώντων
  choice: aus dem Land der Lebenden auflecken
  rationale: Das auffällige Bild des vollständigen Wegleckens beziehungsweise Vertilgens wird wegen des unmittelbar folgenden Kalbvergleichs bewusst bewahrt; „Land der Lebenden“ entspricht der traditionellen und sachlich präzisen Wiedergabe.
- source_word: τὰ χλωρὰ τοῦ πεδίου
  choice: das frische Grün des Feldes
  rationale: χλωρά bezeichnet hier grüne, frische Pflanzen oder grünen Bewuchs. „Frisches Grün“ klingt im Deutschen natürlich und erhält das anschauliche Bild.
theological_decisions:
- issue: Gewaltsamer Wunsch gegen Josef
  choice: Das drastische Vernichtungsbild bleibt unverhüllt stehen.
  alternative: Den Ausdruck idiomatisch als „aus dem Land der Lebenden vertilgen“ wiederzugeben.
  rationale: Die ungewöhnliche Metapher wird im griechischen Text durch den Vergleich mit dem leckenden Kalb ausdrücklich entfaltet. Eine rein idiomatische Wiedergabe würde diese literarische und moralische Schärfe vermindern.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bewusst ungewöhnliche Wiederholung von „auflecken“ erhält die Bildstruktur des griechischen Textes und verbindet den Vernichtungswunsch eng mit dem Kalbvergleich.
