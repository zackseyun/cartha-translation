revisions:
- from: Und wegen der Träume steigerte sich mein Hass auf ihn, und ich wollte ihn aus dem Land der Lebenden auflecken, wie ein Kalb das frische Grün des Feldes aufleckt.
  to: Und wegen der Träume steigerte ich meinen Hass gegen ihn, und ich wollte ihn vom Land der Lebenden¹ weglecken, wie ein Kalb das frische Grün des Feldes wegleckt.
  rationale: Die Revision stellt die aktive Aussage des Sprechers wieder her und macht die mit ἐκ ausgedrückte Entfernung im Deutschen verständlicher. Das ungewöhnliche, gewaltsame Bild des Wegleckens bleibt mitsamt seiner Wiederholung erhalten. Die Fußnote macht die in der Quelle markierte textkritische Unsicherheit transparent.
