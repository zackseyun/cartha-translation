review_pass:
  verdict: revise
  source_fidelity: Die Aussage und das drastische Bild werden grundsätzlich getroffen. Doch προσεθέμην ist aktiv („ich fügte hinzu/steigerte“), nicht intransitiv „steigerte sich“. Außerdem gibt die Konstruktion ἐκ ... ἐκλεῖξαι die Bewegung besser als „vom Land ... weglecken“ wieder. Das in der Edition eingeklammerte ζώντων wird als textkritisch unsicher gekennzeichnet.
  naturalness: „Aus dem Land der Lebenden auflecken“ ist im Deutschen schwer verständlich. „Vom Land der Lebenden weglecken“ bleibt absichtlich ungewöhnlich und bildhaft, ist aber syntaktisch klar und wird durch den folgenden Vergleich verständlich.
  terminology: „Hass gegen ihn“, „Land der Lebenden“ und „frisches Grün des Feldes“ sind treffend. Die Wiederholung von „weglecken“ bewahrt die gezielte Bildverbindung zwischen Vernichtungswunsch und Kalbvergleich.
  issues:
  - severity: medium
    issue: Aktive Verbform von προσεθέμην nicht gewahrt
    rationale: „Steigerte sich mein Hass“ macht den Hass zum handelnden Subjekt, während der Sprecher im Griechischen ausdrücklich sagt, dass er Hass gegen den Betreffenden hinzufügte bzw. steigerte.
  - severity: low
    issue: Richtung von ἐκ γῆς bei ἐκλεῖξαι unklar wiedergegeben
    rationale: „Aus dem Land ... auflecken“ ist im Deutschen semantisch und syntaktisch sperrig. „Vom Land ... weglecken“ gibt das Entfernen von der Erde und das bewusst drastische Leck-Bild verständlicher wieder.
  - severity: low
    issue: Textkritisch markiertes ζώντων nicht angezeigt
    rationale: Die vorgelegte griechische Edition setzt ζώντων in Klammern. Eine knappe Fußnote wahrt diese Unsicherheit, ohne den Sinn des Satzes festzulegen.
  revised_text: Und wegen der Träume steigerte ich meinen Hass gegen ihn, und ich wollte ihn vom Land der Lebenden¹ weglecken, wie ein Kalb das frische Grün des Feldes wegleckt.
  revised_footnotes:
  - marker: '1'
    text: Wörtlich „der Lebenden“. Das Wort ist in der zugrunde gelegten griechischen Edition textkritisch eingeklammert.
    reason: Kennzeichnet die editorisch markierte Unsicherheit bei ζώντων, ohne eine bestimmte handschriftliche Lösung zu behaupten.
  revision_rationale: Die Revision stellt die aktive Aussage des Sprechers wieder her und macht die mit ἐκ ausgedrückte Entfernung im Deutschen verständlicher. Das ungewöhnliche, gewaltsame Bild des Wegleckens bleibt mitsamt seiner Wiederholung erhalten. Die Fußnote macht die in der Quelle markierte textkritische Unsicherheit transparent.
