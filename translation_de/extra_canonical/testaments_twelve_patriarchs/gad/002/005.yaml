  text: But the God of my fathers rescued him from my hands, so that I might not commit a lawless deed in Israel.
translation:
  language: de
  text: Doch der Gott meiner Väter rettete ihn aus meinen Händen, damit ich in Israel kein Unrecht begehe.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ Θεὸς τῶν πατέρων μου
  choice: der Gott meiner Väter
  rationale: Gibt die traditionelle und im Deutschen natürliche biblische Wendung genau wieder.
- source_word: ἐρρύσατο αὐτὸν ἐκ τῶν χειρῶν μου
  choice: rettete ihn aus meinen Händen
  rationale: Bewahrt das Bild des griechischen Textes und drückt aus, dass Gott ihn der Gewalt des Sprechers entzog.
- source_word: ἀνόμημα
  choice: Unrecht
  rationale: Bezeichnet eine gesetzeswidrige oder frevelhafte Tat; „Unrecht“ ist verständlich und lässt die genaue Art der Tat offen.
theological_decisions:
- issue: Bedeutung von ἵνα μή mit Aorist Konjunktiv
  choice: damit ich … kein Unrecht beging
  alternative: damit ich … kein Unrecht begehen würde
  rationale: Die finale Aussage wird natürlich wiedergegeben, ohne eine zusätzliche theologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit erhaltener biblischer Bildsprache; die adversative Konjunktion Καί wird im Zusammenhang sinnvoll als „Doch“ wiedergegeben.
