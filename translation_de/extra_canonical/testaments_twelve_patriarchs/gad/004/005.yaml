translation:
  language: de
  text: Denn der Hass wirkt mit dem Neid zusammen, auch gegen die, denen es gut geht; wenn er hört und sieht, wie sie vorankommen, wird er stets schwach.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „Während er bei ihrem Vorankommen hört und sieht, ist oder wird er stets schwach.“ Das Griechische lässt das Objekt von „hört und sieht“ unausgedrückt und kann beim Präsens sowohl den Zustand als auch ein Schwächerwerden hervorheben.'
    reason: Die ungewöhnliche Syntax, das unausgedrückte Objekt und die Bedeutungsbreite des Präsens ἀσθενεῖ werden sichtbar gemacht, ohne den Haupttext unnötig schwer verständlich zu machen.
lexical_decisions:
- source_word: φθόνῳ
  choice: mit dem Neid
  rationale: Der Dativ bezeichnet den Partner, mit dem der Hass zusammenwirkt; „Neid“ hält φθόνος und μῖσος als unterschiedliche Regungen auseinander.
- source_word: μῖσος
  choice: der Hass
  rationale: Direkte und im Deutschen natürliche Entsprechung; das Wort bleibt grammatisches Subjekt des gesamten Satzes.
- source_word: τῶν εὐπραγούντων
  choice: die, denen es gut geht
  rationale: Gibt das substantivierte Partizip verständlich wieder und umfasst sowohl Wohlergehen als auch Erfolg, ohne es auf materiellen Wohlstand einzuengen.
- source_word: ἐν προκοπῇ
  choice: wie sie vorankommen
  rationale: Die Wendung wird in Verbindung mit „hört und sieht“ idiomatisch als wahrgenommenes Vorankommen der Betroffenen ausgedrückt; „Fortschritt“ wäre hier im Deutschen missverständlich oder steif.
- source_word: ἀσθενεῖ
  choice: wird er stets schwach
  rationale: Das aktive, intransitive Verb bedeutet „schwach sein/werden“; der Hass bleibt als grammatisches Subjekt erhalten, statt eine nicht ausgedrückte Ursache des Schwächerwerdens einzuführen.
theological_decisions:
- issue: Bezug des Schlussverbs und der Partizipien
  choice: Der Hass hört, sieht und wird schwach.
  alternative: Das Vorankommen der Erfolgreichen schwächt den Hass.
  rationale: μῖσος ist das ausdrückliche neutrale Subjekt; ἀκούων und ὁρῶν stimmen damit syntaktisch überein, während ἀσθενεῖ intransitiv formuliert ist. Die ungewöhnliche inhaltliche Spannung wird daher nicht durch eine kausale Umschreibung beseitigt.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Personifikation des Hasses und die Spannung der Aussage werden beibehalten; die Satzstruktur wird nur so weit geglättet, wie es für natürliches Deutsch nötig ist.
