source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: IV. Φυλάξασθε οὖν, τέκνα μου¹, ἀπὸ τοῦ μίσους, ὅτι Γκαὶ² εἰς³ αὐτὸν τὸν Κύριον ἀνομίαν⁴ ποιεῖ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/001.yaml
  text: Therefore guard yourselves, my children, from hatred, because it even commits lawlessness against the Lord himself.
translation:
  language: de
  text: 4 Darum hütet euch, meine Kinder, vor dem Hass; denn er begeht sogar gegen den Herrn selbst Gesetzlosigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξασθε
  choice: hütet euch
  rationale: Gibt den medialen Imperativ natürlich und zugleich eindringlich wieder.
- source_word: μίσους
  choice: Hass
  rationale: Direkte und geläufige Entsprechung für die feindselige Haltung, vor der gewarnt wird.
- source_word: ἀνομίαν ποιεῖ
  choice: begeht Unrecht
  rationale: Bewahrt den ethisch-religiösen Sinn von ἀνομία, ohne das im Deutschen sperrige »Gesetzlosigkeit tun« zu verwenden.
- source_word: εἰς αὐτὸν τὸν Κύριον
  choice: gegen den Herrn selbst
  rationale: εἰς bezeichnet hier die gegen den Herrn gerichtete Verfehlung; αὐτόν wird durch »selbst« hervorgehoben.
theological_decisions:
- issue: Personifizierung des Hasses
  choice: Das Pronomen »er« bezieht sich auf den Hass, der als handelnd dargestellt wird.
  alternative: »denn wer hasst, begeht …«
  rationale: Die Personifizierung des griechischen Textes bleibt erhalten und wird nicht zu einer ausdrücklichen Aussage über den Hassenden umgeformt.
- issue: Bedeutung von ἀνομία
  choice: Unrecht
  alternative: Gesetzlosigkeit
  rationale: »Unrecht« ist in modernem Deutsch verständlicher und trägt hier die Vorstellung einer Verfehlung gegen Gott, ohne eine spezifische Gesetzestheologie festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die väterliche Anrede und die eindringliche Warnung bleiben erhalten; die griechische Personifizierung des Hasses wird nicht geglättet.
