source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 2. Οὐ γὰρ θέλει ἀκούειν Γλόγων⁵ ἐντολῶν⁶ αὐτοῦ περὶ ἀγάπης *τοῦ πλησίον⁷* *Γκαὶ¹ εἰς Θεὸν ἁμαρτάνει⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/002.yaml
  text: For it does not want to hear the words of his commandments concerning love for his neighbor, and it sins against God.
translation:
  language: de
  text: Denn er will nicht auf die Worte seiner Gebote über die Liebe zum Nächsten hören und sündigt gegen Gott.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Οὐ γὰρ θέλει ἀκούειν
  choice: Denn er will nicht … hören
  rationale: Gibt die begründende Konjunktion γάρ und die Weigerung bzw. den fehlenden Willen von οὐ θέλει natürlich und eng am Griechischen wieder.
- source_word: λόγων ἐντολῶν αὐτοῦ
  choice: die Worte seiner Gebote
  rationale: Bewahrt die ungewöhnliche, aber verständliche Verbindung von λόγων und ἐντολῶν sowie das Possessivpronomen αὐτοῦ, ohne sie zu glätten.
- source_word: περὶ ἀγάπης τοῦ πλησίον
  choice: über die Liebe zum Nächsten
  rationale: Eine natürliche deutsche Wiedergabe des Themas, wobei τοῦ πλησίον als objektiver Genitiv verstanden wird.
- source_word: εἰς Θεὸν ἁμαρτάνει
  choice: sündigt gegen Gott
  rationale: Die Verbindung ἁμαρτάνω εἰς bezeichnet hier das Sündigen gegen jemanden; die deutsche Formulierung ist idiomatisch und präzise.
theological_decisions:
- issue: Bezug des unausgedrückten Subjekts und von αὐτοῦ
  choice: Maskulines „er/seiner“ beibehalten
  alternative: Neutrales „es/seiner“ entsprechend einem möglicherweise vorausgehenden abstrakten Subjekt
  rationale: Der englische Konsultationstext versteht das Subjekt maskulin. Ohne den vorausgehenden Vers lässt sich der Referent aus diesem Satz allein nicht sicher bestimmen; die Übersetzung folgt daher der überlieferten Bezugnahme, ohne einen konkreten theologischen Referenten einzusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die etwas markante Formulierung „Worte seiner Gebote“ bleibt erhalten, um die Struktur des griechischen Textes nicht unnötig zu vereinfachen.
