id: T12P.GAD.4.7
reference: Testament of Gad 4:7
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 7. Τὸ γὰρ πνεῦμα τοῦ μίσους *διὰ τῆς²⁹ ὀλιγοψυχίας συνεργεῖ τῷ Σατανᾷ ἐν πᾶσιν εἰς θάνατον τῶν ἀνθρώπων, τὸ δὲ πνεῦμα τῆς ἀγάπης *ἐν μακροθυμίᾳ³⁰ συνεργεῖ *τῷ νόμῳ³¹ τοῦ Θεοῦ εἰς σωτηρίαν τῶν³² ἀνθρώπων.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/007.yaml
  text: For the spirit of hatred, through faintheartedness, works together with Satan in everything for the death of men; but the spirit of love, through longsuffering, works together with the law of God for the salvation of men.
translation:
  language: de
  text: Denn der Geist des Hasses wirkt durch Mutlosigkeit in allem mit Satan zusammen, um den Menschen den Tod zu bringen; der Geist der Liebe dagegen wirkt in Langmut mit dem Gesetz Gottes zusammen, um den Menschen Rettung zu bringen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀλιγοψυχία
  choice: Mutlosigkeit
  rationale: Bezeichnet Kleinmut bzw. mangelnden inneren Mut; „Mutlosigkeit“ ist im heutigen Deutsch verständlich und bewahrt den negativen Sinn.
- source_word: μακροθυμία
  choice: Langmut
  rationale: Bewahrt den ethisch-theologischen Gehalt von geduldiger, ausdauernder Nachsicht und bildet den Gegensatz zu „Mutlosigkeit“ ab.
- source_word: συνεργεῖ
  choice: wirkt … zusammen
  rationale: Gibt das wiederholte συν-Element des griechischen Verbs in beiden Satzhälften formal und natürlich wieder.
- source_word: εἰς θάνατον / εἰς σωτηρίαν
  choice: um … den Tod / Rettung zu bringen
  rationale: Gibt die Ziel- oder Ergebnisrichtung von εἰς idiomatisch wieder, ohne sie unnötig dogmatisch zu präzisieren.
- source_word: τῶν ἀνθρώπων
  choice: den Menschen
  rationale: Inklusives, modernes Deutsch; der griechische Ausdruck bezeichnet Menschen allgemein.
theological_decisions:
- issue: Verhältnis des Geistes der Liebe zum Gesetz Gottes
  choice: „wirkt … mit dem Gesetz Gottes zusammen“
  alternative: „wirkt für das Gesetz Gottes“
  rationale: Der griechische Text hat συνεργεῖ τῷ νόμῳ und stellt eine Zusammenarbeit bzw. ein Zusammenwirken dar. Diese auffällige Formulierung wird beibehalten, statt theologisch geglättet zu werden.
- issue: Ziel oder Folge von Tod und Rettung
  choice: finale Wiedergabe mit „um … zu bringen“
  alternative: „zum Tod / zur Rettung der Menschen“
  rationale: εἰς kann Ziel oder Ergebnis ausdrücken. Die gewählte Form liest sich natürlich, ohne den Mechanismus von Tod und Rettung weiter festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallele Satzstruktur und der Gegensatz zwischen Hass und Liebe sowie Tod und Rettung bleiben deutlich erhalten. „Langmut“ ist leicht gehoben, aber im biblisch-ethischen Zusammenhang präzise und verständlich.
