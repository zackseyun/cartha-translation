  source_fidelity: Der Entwurf gibt πέσῃ, σπουδάζει und die ungenannte Objektstelle bei ἀναγγεῖλαι im Wesentlichen angemessen wieder. Bei σπεύδει περὶ αὐτοῦ ist „drängt darauf“ jedoch zu weit vom ausdrücklichen Bezug „ihn betreffend / seinetwegen“ entfernt. Die finale Struktur von ἵνα mit den vorzeitigen passiven Partizipien κριθεὶς καὶ κολασθεὶς sollte klarer als Ziel und Abfolge wiedergegeben werden.
  naturalness: „ist er sofort eifrig bemüht“ ist verständlich, aber schwerfällig. „beeilt er sich sofort“ ist modernes Standarddeutsch und bildet die Dringlichkeit idiomatisch ab. Die Wiederholung von „beeilt sich“ ist angesichts der zwei griechischen Verben und ihres unterschiedlichen Bezugs vertretbar.
  terminology: „Bruder“, „zu Fall kommt“, „gerichtet“ und „bestraft“ sind registergerecht und bewahren die Offenheit des griechischen Textes. „Seinetwegen“ gibt περὶ αὐτοῦ ohne zusätzliche Festlegung wieder. Die Fußnote zum aus dem Kontext ergänzten Subjekt bleibt nötig.
  issues:
  - severity: medium
    issue: σπεύδει περὶ αὐτοῦ wird durch „drängt darauf“ nicht hinreichend abgebildet.
    rationale: Die Formulierung gibt zwar eine zielgerichtete Absicht wieder, lässt aber den im Griechischen ausdrücklich genannten Bezug auf den Bruder („ihn betreffend / seinetwegen“) verschwinden.
  - severity: medium
    issue: Die finale und vorzeitige Struktur von ἵνα κριθεὶς καὶ κολασθεὶς ἀποθάνῃ ist im Deutschen zu wenig deutlich.
    rationale: „dass über ihn Gericht gehalten und er bestraft wird und stirbt“ kann als bloße Reihung verstanden werden. „damit er, nachdem …, stirbt“ erhält Zielrichtung und Abfolge, ohne eine bestimmte Art des Todes zu behaupten.
  revised_text: Denn wenn ein Bruder zu Fall kommt, beeilt er[a] sich sofort, es allen zu melden, und beeilt sich seinetwegen, damit er, nachdem er gerichtet und bestraft worden ist, stirbt.
