id: T12P.GAD.4.3
reference: Testament of Gad 4:3
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 3. ΓἘὰν γὰρ πέσῃ ὁ ἀδελφός⁹, *σπουδάζει εὐθὺς¹⁰ ἀναγγεῖλαι τοῖς¹¹ πᾶσιν, καὶ σπεύδει *περὶ αὐτοῦ ἵνα κριθεὶς¹² καὶ κολασθεὶς ἀποθάνῃ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/003.yaml
  text: For if a brother falls, it is eager at once to report it to everyone, and it hastens concerning him so that, having been judged and punished, he may die.
translation:
  language: de
  text: Denn wenn ein Bruder zu Fall kommt, beeilt er[a] sich sofort, es allen zu melden, und beeilt sich seinetwegen, damit er, nachdem er gerichtet und bestraft worden ist, stirbt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Griechischen steht hier nur das Verb in der 3. Person Singular; das Subjekt ist aus dem Zusammenhang zu ergänzen, wahrscheinlich »der Hass«.
    reason: Der Einzelvers nennt das handelnde Subjekt nicht ausdrücklich; die Fußnote macht die kontextbedingte Ergänzung transparent.
lexical_decisions:
- source_word: πέσῃ
  choice: zu Fall kommt
  rationale: Gibt das bildhafte und möglicherweise moralische »Fallen« natürlich wieder, ohne die Art des Versagens näher festzulegen.
- source_word: σπουδάζει
  choice: ist … eifrig bemüht
  rationale: Bewahrt den Gedanken des Eifers und der gezielten Anstrengung.
- source_word: ἀναγγεῖλαι
  choice: zu melden
  rationale: Bezeichnet das Bekanntmachen beziehungsweise Berichten an alle; »melden« ist im Zusammenhang mit einer belastenden Anzeige idiomatisch.
- source_word: σπεύδει περὶ αὐτοῦ
  choice: drängt darauf
  rationale: Gibt die dringliche, gegen den Bruder gerichtete Betätigung natürlich wieder; der Bezug auf ihn wird im folgenden Nebensatz ausdrücklich aufgenommen.
- source_word: κριθεὶς καὶ κολασθεὶς ἀποθάνῃ
  choice: dass über ihn Gericht gehalten und er bestraft wird und stirbt
  rationale: Bewahrt Reihenfolge und Zielrichtung der griechischen Partizipialkonstruktion, ohne zwingend festzulegen, ob der Tod unmittelbar als Strafe vollstreckt wird oder auf sie folgt.
theological_decisions:
- issue: Unausgesprochenes Subjekt von σπουδάζει und σπεύδει
  choice: Maskulines Pronomen »er« mit Fußnote zum möglichen Bezug auf den Hass
  alternative: Neutrales »es« nach dem englischen Konsultationstext
  rationale: Im Zusammenhang dürfte der Hass als handelndes Subjekt fortgeführt sein; im Deutschen verlangt das maskuline Substantiv »Hass« das Pronomen »er«. Da der vorgelegte Einzelvers das Bezugswort nicht enthält, wird die Ergänzung transparent gekennzeichnet.
- issue: Bedeutung von πέσῃ
  choice: Offenes »zu Fall kommt«
  alternative: »sündigt« oder »einen Fehler begeht«
  rationale: Die bildhafte Ausdrucksweise lässt sowohl moralisches Versagen als auch allgemeineres Scheitern zu und sollte nicht konfessionell oder dogmatisch verengt werden.
- issue: Verhältnis von Bestrafung und Tod
  choice: 'Koordinierte Folge: gerichtet, bestraft, stirbt'
  alternative: »zum Tod verurteilt und hingerichtet wird«
  rationale: Der griechische Text nennt Urteil, Bestrafung und Tod, setzt sie aber nicht ausdrücklich mit Todesurteil und Hinrichtung gleich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt dem argumentativen Aufbau des Griechischen nah, wird aber idiomatisch geglättet. Das harte Ziel des Handelns wird ohne Abschwächung wiedergegeben.
