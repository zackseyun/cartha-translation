review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur und die zentralen Begriffe sind zutreffend wiedergegeben: ἀγάπη/μῖσος als „Liebe/Hass“, das wiederholte θέλει als „will“, ζωοποιῆσαι als „lebendig machen“ und ἀνακαλέσασθαι als „zurückrufen“. „Zum Tod Verurteilten“ trifft ἐν ἀποφάσει θανάτου angemessen. Im letzten Satzteil verschiebt jedoch „lässt ... nicht leben“ die Aussage von einem Wollen zu einer verursachenden Verhinderung.'
  naturalness: Der Satz ist insgesamt modernes, verständliches Standarddeutsch. Die formelhaftere, aber idiomatische Konstruktion „will nicht, dass ... leben“ ist hier sowohl genauer als auch natürlich.
  terminology: Die Terminologie ist konsistent und ohne unnötige konfessionelle Prägung. „Sich nur wenig versündigt haben“ kann ἐν ὀλίγῳ als geringes Maß wiedergeben; die Fußnote bewahrt sinnvoll die mögliche Bedeutung einer geringfügigen Angelegenheit.
  issues:
  - severity: medium
    issue: „lässt die nicht leben“ für οὐ θέλει ζῆν
    rationale: Das griechische οὐ θέλει mit Infinitiv besagt „will nicht, dass ... leben“, nicht ausdrücklich „hindert sie am Leben“ bzw. „lässt sie nicht leben“. Die deutsche Fassung fügt daher eine kausative Nuance hinzu, die der Quelle nicht zwingend zukommt.
  revised_text: Wie die Liebe die Toten lebendig machen und die zum Tod Verurteilten zurückrufen will, so will auch der Hass die Lebenden töten und will nicht, dass diejenigen leben, die sich nur wenig versündigt haben.[a]
