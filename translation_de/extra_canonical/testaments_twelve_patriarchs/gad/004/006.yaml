revisions:
- from: Wie die Liebe die Toten lebendig machen und die zum Tod Verurteilten zurückrufen will, so will auch der Hass die Lebenden töten und lässt die nicht leben, die sich nur wenig versündigt haben.[a]
  to: Wie die Liebe die Toten lebendig machen und die zum Tod Verurteilten zurückrufen will, so will auch der Hass die Lebenden töten und will nicht, dass diejenigen leben, die sich nur wenig versündigt haben.[a]
  rationale: Die Änderung ersetzt die kausative Wendung „lässt ... nicht leben“ durch die dem griechischen θέλει mit Infinitiv entsprechende Aussage über den Willen. Die Ambiguität von ἐν ὀλίγῳ bleibt im Haupttext und in der Fußnote erhalten.
