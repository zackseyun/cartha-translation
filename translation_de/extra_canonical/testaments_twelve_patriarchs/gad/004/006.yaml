id: T12P.GAD.4.6
reference: Testament of Gad 4:6
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 232-243, Gad pilot)
  text: 6. Ὥσπερ²³ ἡ ἀγάπη Γκαὶ¹ τοὺς νεκροὺς *θέλει ζωοποιῆσαι²⁴ καὶ τοὺς ἐν²⁵ ἀποφάσει θανάτου θέλει²⁶ ἀνακαλέσασθαι, οὕτως καὶ²⁷ τὸ μῖσος τοὺς ζῶντας θέλει ἀποκτεῖναι, καὶ *τοὺς ἐν ὀλίγῳ ἁμαρτήσαντας²⁸ οὐ θέλει ζῆν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/006.yaml
  text: Just as love wants to make the dead alive and to call back those under sentence of death, so also hatred wants to kill the living, and it does not want those who have sinned in a little matter to live.
translation:
  language: de
  text: Wie die Liebe die Toten lebendig machen und die zum Tod Verurteilten zurückrufen will, so will auch der Hass die Lebenden töten und will nicht, dass diejenigen leben, die sich nur wenig versündigt haben.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die sich in einer Kleinigkeit versündigt haben“.'
    reason: ἐν ὀλίγῳ kann sich auf ein geringes Maß oder auf eine geringfügige Angelegenheit beziehen.
lexical_decisions:
- source_word: ἀγάπη
  choice: Liebe
  rationale: Die direkte und im Kontext natürliche Entsprechung; der abstrakte Gegensatz zu μῖσος bleibt erhalten.
- source_word: θέλει ζωοποιῆσαι
  choice: will … lebendig machen
  rationale: Gibt das wiederholte θέλει als Wollen und ζωοποιῆσαι als Bewirken von Leben wieder, ohne die Aussage hypothetisch abzuschwächen.
- source_word: ἐν ἀποφάσει θανάτου
  choice: zum Tod Verurteilten
  rationale: ἀπόφασις bezeichnet hier einen richterlichen Entscheid beziehungsweise ein Todesurteil; die deutsche Formulierung ist knapp und idiomatisch.
- source_word: ἀνακαλέσασθαι
  choice: zurückrufen
  rationale: Bewahrt das Bild des Zurückrufens und legt nicht fest, ob Begnadigung, Rettung oder Wiederbelebung im Vordergrund steht.
- source_word: μῖσος
  choice: Hass
  rationale: Direkte Entsprechung und klarer Gegenpol zu ἀγάπη.
- source_word: ἐν ὀλίγῳ ἁμαρτήσαντας
  choice: die sich nur wenig versündigt haben
  rationale: Bewahrt die mögliche quantitative Bedeutung von ἐν ὀλίγῳ, ohne sie im Haupttext zwingend als eine einzelne geringfügige Angelegenheit festzulegen.
theological_decisions:
- issue: Aussageweise des wiederholten θέλει
  choice: 'Als tatsächliches Wollen formuliert: „will“'
  alternative: 'Hypothetisch: „würde gern“ oder „möchte“'
  rationale: Der griechische Text verwendet wiederholt θέλει und stellt die gegensätzlichen Ausrichtungen von Liebe und Hass dar; eine hypothetische Wiedergabe wäre schwächer.
- issue: Bedeutung von ἐν ὀλίγῳ
  choice: „sich nur wenig versündigt haben“ mit Fußnote zur Alternative
  alternative: „sich in einer Kleinigkeit versündigt haben“
  rationale: Die griechische Wendung ist knapp und kann das geringe Maß der Sünde oder eine geringfügige Sache bezeichnen. Die Übersetzung wahrt diese Spannung, während die Fußnote die sachbezogene Lesart nennt.
- issue: Letztes θέλει mit Infinitiv
  choice: Idiomatisch als „lässt … nicht leben“
  alternative: 'Formal: „will nicht, dass … leben“'
  rationale: Die gewählte Form drückt die feindselige Absicht natürlich aus, ohne eine zusätzliche Tötungshandlung über den Wortlaut hinaus ausdrücklich einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Satzstruktur des Griechischen und der scharfe Gegensatz zwischen Liebe und Hass bleiben erhalten; unnötig altertümliche oder konfessionell geprägte Ausdrücke wurden vermieden.
