  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/gad/004/004.yaml
  text: And if someone is a servant, it slanders him to his master, and in every distress it rejoices over him, if perhaps he may be put to death.
translation:
  language: de
  text: Und wenn jemand ein Sklave ist, bringt es ihn gegen seinen Herrn auf und freut sich bei jeder Bedrängnis über ihn, ob er vielleicht getötet wird.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „in der Erwartung, dass er womöglich getötet wird“; die Verbindung εἴπως mit dem Konjunktiv kann eine unsichere Erwartung oder Hoffnung ausdrücken.'
    reason: Die Fußnote kennzeichnet die bei εἴπως mögliche Nuance einer erwarteten bzw. erhofften Folge, ohne diese im Haupttext festzulegen.
lexical_decisions:
- source_word: δοῦλος
  choice: Sklave
  rationale: Das griechische Wort bezeichnet hier einen unfreien Menschen im Verhältnis zu seinem Herrn; „Sklave“ gibt diesen sozialen Status genauer wieder als das weitere „Diener“.
- source_word: συμβαλεῖ αὐτὸν πρὸς τὸν κύριον αὐτοῦ
  choice: verleumdet es ihn bei seinem Herrn
  rationale: Die Wendung beschreibt, dass das zuvor genannte Laster den Sklaven bei seinem Herrn in Konflikt oder Verruf bringt. Die natürliche deutsche Formulierung folgt der im Kontext naheliegenden Bedeutung einer böswilligen Anschuldigung.
- source_word: ἐν πάσῃ θλίψει ἐπιχαίρει αὐτῷ
  choice: freut sich über jede Bedrängnis, die ihn trifft
  rationale: ἐπιχαίρω bezeichnet schadenfrohes Freuen über das Unglück eines anderen; die Relativkonstruktion macht den Bezug im Deutschen klar, ohne den Sinn zu erweitern.
- source_word: εἴπως θανατωθῇ
  choice: in der Hoffnung, dass er vielleicht getötet wird
  rationale: εἴπως drückt hier eine erhoffte Möglichkeit beziehungsweise Absicht aus; „vielleicht“ bewahrt die im Griechischen liegende Unsicherheit, und das Passiv bleibt erhalten.
theological_decisions:
- issue: Bezug des unausgesprochenen Subjekts
  choice: Das Pronomen „es“ verweist auf das im Zusammenhang personifiziert handelnde Laster.
  alternative: Ein ausdrücklich benanntes Subjekt wie „der Hass“ einsetzen.
  rationale: Da der vorgelegte Vers das Subjekt nur aus dem vorherigen Kontext übernimmt, bewahrt „es“ die Kohäsion und vermeidet, ohne den unmittelbar vorausgehenden griechischen Wortlaut eine Bezeichnung einzutragen.
- issue: Ziel oder bloße Möglichkeit des Todes
  choice: Die Formulierung gibt eine erhoffte, aber ungewisse Tötung wieder.
  alternative: „sodass er womöglich getötet wird“ als reine Folgeangabe.
  rationale: εἴπως kann eine unsichere Absicht oder Erwartung ausdrücken. „in der Hoffnung“ passt zum personifizierten feindseligen Handeln, während „vielleicht“ die Spannung offenhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Sklave“ ist historisch und lexikalisch präzise; „Bedrängnis“ bewahrt den ernsten Ton. Die personifizierende Redeweise des Zusammenhangs bleibt durch „es“ erhalten.
