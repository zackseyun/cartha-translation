    issue: Die Wendung συμβαλεῖ αὐτὸν πρὸς τὸν κύριον αὐτοῦ ist als „verleumdet es ihn bei seinem Herrn“ wiedergegeben.
    rationale: Die Konstruktion bezeichnet hier das Aufbringen des Sklaven gegen seinen Herrn bzw. das Herbeiführen eines Konflikts zwischen beiden. „Verleumden bei“ macht den Herrn dagegen zum Empfänger einer Anschuldigung und verändert die Handlungsrichtung.
  - severity: medium
    issue: „in der Hoffnung, dass er vielleicht getötet wird“ legt εἴπως zu stark als ausdrückliche Absicht aus.
    rationale: εἴπως mit Konjunktiv kann eine erwartete oder erhoffte Möglichkeit andeuten; die syntaktische und semantische Nuance ist aber nicht so eindeutig, dass „in der Hoffnung“ im Haupttext erforderlich wäre. Eine offene Frage-/Möglichkeitsform wahrt die Ambiguität.
  revised_text: Und wenn jemand ein Sklave ist, bringt es ihn gegen seinen Herrn auf und freut sich bei jeder Bedrängnis über ihn, ob er vielleicht getötet wird.[a]
