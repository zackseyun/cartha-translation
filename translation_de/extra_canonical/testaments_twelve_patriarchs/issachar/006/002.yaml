source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 2. Καὶ ἀφέντες⁷ τὸ¹⁰ γεωργεῖν¹¹ ἐξακολουθήσουσι¹² τοῖς Γπονηροῖς¹¹³ διαβουλίοις αὐτῶν καὶ διασπαρήσονται ἐν τοῖς ἔθνεσιν καὶ δουλεύσουσιν¹⁴ τοῖς ἐχθροῖς αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006/002.yaml
  text: And leaving farming, they will follow their evil schemes, and they will be scattered among the nations and will servant for their enemies.
translation:
  language: de
  text: Und sie werden die Landwirtschaft aufgeben, ihren bösen Plänen folgen, unter die Völker zerstreut werden und ihren Feinden als Sklaven dienen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἀφέντες τὸ γεωργεῖν
  choice: die Landwirtschaft aufgeben
  rationale: Die partizipiale Wendung bezeichnet das Aufgeben der landwirtschaftlichen Tätigkeit; die finite deutsche Form fügt sich natürlich in die Reihe der Zukunftsaussagen ein.
- source_word: ἐξακολουθήσουσι
  choice: folgen
  rationale: Gibt das verstärkte Verb sachgerecht und idiomatisch wieder, ohne eine im Kontext nicht nötige zusätzliche Nuance einzutragen.
- source_word: τοῖς πονηροῖς διαβουλίοις αὐτῶν
  choice: ihren bösen Plänen
  rationale: διαβούλια bezeichnet Überlegungen, Vorhaben oder Pläne; „Pläne“ ist hier verständlich und bewahrt deren moralische Kennzeichnung durch πονηροῖς.
- source_word: διασπαρήσονται ἐν τοῖς ἔθνεσιν
  choice: unter die Völker zerstreut werden
  rationale: Bewahrt das Passiv und gibt ἐν τοῖς ἔθνεσιν im Deutschen idiomatisch als Verteilung unter den Völkern wieder.
- source_word: δουλεύσουσιν τοῖς ἐχθροῖς αὐτῶν
  choice: ihren Feinden als Sklaven dienen
  rationale: δουλεύω bezeichnet hier nicht bloß allgemeinen Dienst, sondern unterworfenen Sklavendienst; die Formulierung macht dies deutlich und bleibt natürlich.
theological_decisions:
- issue: Stärke des Begriffs δουλεύσουσιν
  choice: als Sklaven dienen
  alternative: dienen
  rationale: Die stärkere Wiedergabe erhält den Gedanken der Versklavung bzw. völligen Unterordnung, ohne eine besondere theologische Deutung hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die koordinierte Satzstruktur des Griechischen bleibt erhalten; unnötige Archaismen und konfessionell geprägte Begriffe werden vermieden.
