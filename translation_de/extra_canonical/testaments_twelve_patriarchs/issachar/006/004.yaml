source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 4. Ὅτι ἐλεήμων ἐστὶ καὶ ἐξελεῖται²⁰ αὐτοὺς *τοῦ ἐπιστρέψαι αὐτοὺς²¹ εἰς τὴν γῆν αὐτῶν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006/004.yaml
  text: because he is merciful and will deliver them, to turn them back to their land[d].
translation:
  language: de
  text: Denn er ist barmherzig und wird sie retten, um sie in ihr Land zurückzubringen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der letzte Satzteil kann auch verstanden werden als: „und sie in ihr Land zurückführen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἐλεήμων
  choice: barmherzig
  rationale: Die geläufige und würdige deutsche Entsprechung gibt Gottes erbarmende Haltung direkt wieder.
- source_word: ἐξελεῖται
  choice: wird sie retten
  rationale: Das Futur des Verbs ἐξαιρέω bezeichnet hier das Befreien oder Erretten aus einer Notlage; „retten“ ist natürlich und lässt die Art der Befreiung offen.
- source_word: τοῦ ἐπιστρέψαι αὐτοὺς εἰς τὴν γῆν αὐτῶν
  choice: um sie in ihr Land zurückzubringen
  rationale: Der artikulierte Infinitiv mit τοῦ lässt sich als Zweckangabe verstehen. Das transitive Zurückbringen passt zur Wiederherstellung im eigenen Land, ohne die leicht mögliche alternative syntaktische Auffassung zu verschweigen.
theological_decisions:
- issue: Verhältnis zwischen Rettung und Rückkehr ins Land
  choice: Die Rückkehr wird als Ziel der göttlichen Rettung formuliert.
  alternative: 'Die beiden Aussagen können enger zusammengezogen werden: „und sie in ihr Land zurückführen/wiederherstellen“.'
  rationale: Die griechische Konstruktion τοῦ mit Infinitiv legt eine Zweckangabe nahe, kann im Zusammenhang aber auch die konkrete Ausgestaltung der Rettung bezeichnen. Die Fußnote bewahrt diese Spannung.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. „Barmherzig“ bewahrt die religiöse Prägung des griechischen Ausdrucks; „retten“ vermeidet eine unnötige Festlegung auf eine bestimmte Art der Befreiung.
