revisions:
- from: 6 Erkennt also, meine Kinder, dass eure Söhne in den letzten Zeiten die Lauterkeit aufgeben und sich der Habgier verschreiben werden. Sie werden die Arglosigkeit[a] verlassen und sich der Verschlagenheit zuwenden; sie werden die Gebote des Herrn aufgeben und sich Beliar[b] verschreiben.
  to: 6 Erkennt also, meine Kinder, dass eure Söhne in den letzten Zeiten die Lauterkeit aufgeben und sich der Habgier anschließen werden. Sie werden die Unschuld[a] hinter sich lassen und sich der Verschlagenheit zuwenden; sie werden die Gebote des Herrn aufgeben und sich Beliar[b] anschließen.
  rationale: Die Revision ersetzt „Arglosigkeit“ im Haupttext durch das für ἀκακία passendere und im modernen Deutsch klarere „Unschuld“. Die Fußnote bewahrt die mögliche Nuance der Täuschungsfreiheit. Außerdem wird κολληθήσονται in beiden Vorkommen einheitlich mit „sich anschließen“ wiedergegeben, wodurch die Wiederholung und Bindungsmetapher des griechischen Textes erhalten bleiben, ohne eine über das Ausgangstextliche hinausgehende Willensentscheidung zu unterstellen.
