  source_fidelity: 'Die Abfolge und die wesentlichen Begriffe des griechischen Textes werden insgesamt zutreffend wiedergegeben. Für ἀκακία ist jedoch „Unschuld“ die deutlichere Grundwiedergabe: „Arglosigkeit“ bezeichnet im heutigen Deutsch vor allem fehlendes Misstrauen und trifft die hier gemeinte Unschuld bzw. Unverdorbenheit nur eingeschränkt. Die partizipialen Wendungen ἀφέντες und καταλιμπάνοντες werden in der Revision als solche erkennbar gehalten.'
  naturalness: Die Sprache bleibt modernes, würdiges Standarddeutsch. „Sich anschließen“ ist für κολληθήσονται idiomatisch und gibt die wiederholte Bindungsmetapher ohne die stärker voluntative Nuance von „sich verschreiben“ wieder.
  terminology: „Lauterkeit“ kann ἁπλότης im ethischen Kontext angemessen wiedergeben. „Unschuld“ für ἀκακία wahrt die Unterscheidung von der vorangehenden Lauterkeit; die Fußnote nennt „Arglosigkeit“ als mögliche, stärker auf Täuschungsfreiheit bezogene Alternative. „Beliar“ entspricht der griechischen Namensform.
