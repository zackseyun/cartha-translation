source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: VI. *Γινώσκετε οὖν¹, τέκνα² μου, ὅτι ἐν ἐσχάτοις καιροῖς καταλείψουσιν³ οἱ υἱοὶ ὑμῶν τὴν ἁπλότητα Γκαὶ κολληθήσονται τῇ ἀπληστίᾳ˥, Γκαὶ⁷ ἀφέντες⁴ Γτὴν ἀκακίαν⁵ προσπελάσουσι⁶ τῇ πανουργίᾳ⁷, *καὶ καταλιμπάνοντες⁸ τὰς ἐντολὰς Κυρίου *κολληθήσονται τῷ Βελίαρ⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006/001.yaml
  text: Know therefore, my children, that in the last times your sons will abandon simplicity and attach themselves to greed; and leaving innocence[a], they will draw near to cunning, and abandoning the commandments of the Lord, they will attach themselves to Beliar[b].
translation:
  language: de
  text: 6 Erkennt also, meine Kinder, dass eure Söhne in den letzten Zeiten die Lauterkeit aufgeben und sich der Habgier anschließen werden. Sie werden die Unschuld[a] hinter sich lassen und sich der Verschlagenheit zuwenden; sie werden die Gebote des Herrn aufgeben und sich Beliar[b] anschließen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Arglosigkeit“. Das griechische Wort ἀκακία bezeichnet Unschuld bzw. Freiheit von Bosheit und kann besonders das Freisein von Täuschung oder Arglist hervorheben.'
    reason: lexical_alternative
  - marker: b
    text: Beliar ist die hier überlieferte griechische Namensform; geläufig ist auch „Belial“.
    reason: lexical_alternative
lexical_decisions:
- source_word: Γινώσκετε
  choice: Erkennt
  rationale: Gibt den auffordernden Präsensimperativ würdig und direkt wieder.
- source_word: ἁπλότητα
  choice: Lauterkeit
  rationale: Bewahrt hier den ethischen Sinn von Aufrichtigkeit und ungeteilter Gesinnung; „Einfachheit“ wäre im modernen Deutschen leicht missverständlich.
- source_word: κολληθήσονται
  choice: sich … verschreiben
  rationale: Drückt die starke Bindung des griechischen Verbs aus und lässt durch die Wiederholung die Parallelstruktur erkennen.
- source_word: ἀπληστίᾳ
  choice: Habgier
  rationale: Natürliche und präzise Wiedergabe ungezügelten Habenwollens.
- source_word: ἀκακίαν
  choice: Arglosigkeit
  rationale: Betont das Fehlen von Bosheit und Täuschungsabsicht und bildet einen passenden Gegensatz zu πανουργία.
- source_word: προσπελάσουσι
  choice: sich … zuwenden
  rationale: Gibt die Bewegung hin zu einer Haltung idiomatisch wieder, ohne eine stärkere Bindung als im griechischen Verb anzunehmen.
- source_word: πανουργίᾳ
  choice: Verschlagenheit
  rationale: Erfasst den negativen Sinn listiger, skrupelloser Schlauheit besser als das neutralere „Klugheit“.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Bewahrt die im griechischen Text belegte Namensform.
theological_decisions:
- issue: „in den letzten Zeiten“ (ἐν ἐσχάτοις καιροῖς)
  choice: in den letzten Zeiten
  alternative: in späteren Zeiten
  rationale: Die formale eschatologische Färbung bleibt erhalten, ohne den Ausdruck auf ein bestimmtes Endzeitschema festzulegen.
- issue: Bindung an Habgier und Beliar
  choice: sich … verschreiben
  alternative: sich … anschließen / anhaften
  rationale: Die parallele Wiederholung von κολληθήσονται wird bewahrt; zugleich wird eine bewusste, starke Bindung ausgedrückt, ohne deren genaue metaphysische Art näher zu bestimmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die antithetische und parallele Satzstruktur des griechischen Textes bleibt deutlich, während missverständliche Wörtlichkeiten wie „Einfachheit“ vermieden werden.
