  - severity: low
    issue: Die partizipialen Abkehrbewegungen werden als eigenständige Hauptsätze formuliert.
    rationale: Das ist verständlich, glättet aber die Verknüpfung von „die Unschuld verlassen“ mit dem anschließenden „sich der Verschlagenheit zuwenden“. Eine partizipiale Formulierung erhält die Struktur des griechischen Satzes besser.
