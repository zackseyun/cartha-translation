source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 3. Καὶ ὑμεῖς οὖν εἴπατε ταῦτα¹⁵ τοῖς τέκνοις ὑμῶν, ὅπως, ἐὰν ἁμάρτωσι¹⁶, τάχιον¹⁷ ἐπιστρέψωσι¹⁸ πρὸς τὸν¹⁹ Κύριον,
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006/003.yaml
  text: Therefore you also tell these things to your children, so that, if they sin, they may turn back more quickly to the Lord[c],
translation:
  language: de
  text: Darum sagt auch ihr dies euren Kindern, damit sie, wenn sie sündigen, schneller zum Herrn umkehren.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Zum Herrn umkehren“ bezeichnet sowohl die Abkehr von der Sünde als auch die erneute Hinwendung zu Gott.
    reason: cross_reference
lexical_decisions:
- source_word: εἴπατε
  choice: sagt
  rationale: Der Aorist-Imperativ wird als direkte Aufforderung natürlich und formnah wiedergegeben.
- source_word: τάχιον
  choice: schneller
  rationale: Der Komparativ wird ausdrücklich bewahrt, ohne einen im Vers nicht genannten Vergleichspunkt zu ergänzen.
- source_word: ἐπιστρέψωσι
  choice: umkehren
  rationale: „Umkehren“ gibt sowohl die Richtungsänderung zu Gott als auch den Bußgedanken wieder.
- source_word: πρὸς τὸν Κύριον
  choice: zum Herrn
  rationale: Die Zielrichtung von πρός bleibt in idiomatischem Deutsch erhalten.
theological_decisions:
- issue: Bedeutungsumfang der Umkehr zum Herrn
  choice: zum Herrn umkehren
  alternative: zum Herrn zurückkehren
  rationale: „Umkehren“ wahrt die Spannung zwischen einer erneuten Hinwendung und der theologischen Bedeutung von Buße, ohne eine vollständige Wiederherstellung ausdrücklich zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nahe am Griechischen, ist aber für heutige Leser flüssig; der ausdrücklich komparative Sinn von τάχιον wird mit „schneller“ erhalten.
