  text: I never spoke ill of anyone, nor did I criticize a person's life.
translation:
  language: de
  text: Ich habe niemals schlecht über jemanden geredet und auch die Lebensführung eines Menschen nicht getadelt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: κατελάλησα
  choice: schlecht über jemanden geredet
  rationale: Das Verb bezeichnet abfälliges oder übles Reden über jemanden; die Formulierung bewahrt den weiteren Sinn, ohne ihn unnötig auf verleumderische Falschaussagen zu verengen.
- source_word: ἔψεξα
  choice: getadelt
  rationale: Das Verb bedeutet tadeln, rügen oder kritisieren. „Getadelt“ gibt die deutliche Missbilligung prägnant und in würdigem, verständlichem Deutsch wieder.
- source_word: βίον ἀνθρώπου
  choice: die Lebensführung eines Menschen
  rationale: βίος kann hier das gelebte Leben beziehungsweise die Lebensweise bezeichnen. „Lebensführung“ ist im Zusammenhang mit dem Tadeln natürlicher als das mögliche, aber missverständliche „Leben“ und gibt ἀνθρώπου geschlechtsneutral wieder.
theological_decisions: []
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die parallele Verneinung οὐ … οὐδὲ wird durch „niemals … und auch … nicht“ bewahrt.
