  source_fidelity: 'Der deutsche Text gibt den überlieferten griechischen Satz sachgerecht wieder: ηὐλόγει mit „segnete“, βλέπων ... ὅτι als begründende Wahrnehmung, ἐν ἁπλότητι als ethische Haltung und πορεύομαι als Lebensführung. „vor ihm“ bewahrt den Bezug auf den Vater.'
