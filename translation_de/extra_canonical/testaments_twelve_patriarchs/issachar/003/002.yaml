  terminology: „Aufrichtigkeit“ ist für ἁπλότης in diesem moralisch-paränetischen Zusammenhang eine vertretbare und gut verständliche Wiedergabe; sie vermeidet die im Deutschen hier zu blasse oder missverständliche Wiedergabe „Einfachheit“.
