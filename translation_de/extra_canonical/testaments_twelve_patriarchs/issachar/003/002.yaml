  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/002.yaml
  text: And my father blessed me, seeing that I walked in simplicity before him.
translation:
  language: de
  text: Und mein Vater segnete mich, weil er sah, dass ich in Aufrichtigkeit vor ihm lebte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ηὐλόγει
  choice: segnete
  rationale: Das Imperfekt bezeichnet hier die in der Erzählung vollzogene beziehungsweise wiederholte Handlung; im natürlichen deutschen Erzählstil genügt das Präteritum.
- source_word: βλέπων
  choice: weil er sah
  rationale: Das präsentische Partizip gibt den begleitenden Wahrnehmungsgrund an und wird idiomatisch als kausaler Nebensatz wiedergegeben.
- source_word: ἐν ἁπλότητι
  choice: in Aufrichtigkeit
  rationale: ἁπλότης bezeichnet hier eine ungeteilte, arglose und redliche Haltung. „Aufrichtigkeit“ ist im modernen Deutsch verständlicher als das missverständliche „Einfachheit“.
- source_word: πορεύομαι
  choice: lebte
  rationale: Das Verb bedeutet wörtlich „gehen“ beziehungsweise „wandeln“, wird aber ethisch für die Lebensführung gebraucht. „lebte“ gibt diese Bedeutung natürlich wieder.
- source_word: ἔμπροσθεν αὐτοῦ
  choice: vor ihm
  rationale: Die räumliche Wendung wird wörtlich bewahrt und bezeichnet hier das Leben im Angesicht beziehungsweise unter den Augen des Vaters.
theological_decisions: []
translation_notes:
  register: Moderner, würdiger Erzählstil. Die griechische vorliegende Lesart bildet einen zusammenhängenden Satz; die in den neuesten englischen Revisionsnotizen erwähnte Formulierung mit ἥμην und einem getrennten Satz ist im angegebenen griechischen Quelltext nicht belegt und wurde daher nicht übernommen.
