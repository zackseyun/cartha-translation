base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/006.yaml
  text: And my father always rejoiced in my simplicity, because I offered every firstborn through the priest to the Lord, and then also to my father.
translation:
  language: de
  text: Und mein Vater freute sich immer über meine Lauterkeit, weil ich jedes Erstgeborene durch den Priester dem Herrn darbrachte, dann auch meinem Vater.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἁπλότης
  choice: Aufrichtigkeit
  rationale: Bezeichnet hier eine lautere, ungeteilte Haltung. „Aufrichtigkeit“ ist im heutigen Deutsch natürlich und bewahrt den ethisch positiven Sinn besser als das missverständliche „Einfalt“.
- source_word: πᾶν πρῶτον γέννημα
  choice: jede Erstgeburt
  rationale: Gibt die umfassende Formulierung des Griechischen knapp und sachlich wieder, ohne die Art der Erstgeburt näher festzulegen.
- source_word: διὰ τοῦ ἱερέως
  choice: durch den Priester
  rationale: Bewahrt die instrumentale beziehungsweise vermittelnde Formulierung des Ausgangstextes, ohne das genaue kultische Verfahren auszudeuten.
- source_word: προσέφερον
  choice: darbrachte
  rationale: Entspricht dem kultischen Kontext und gibt den imperfektischen Rückblick idiomatisch als wiederholte Praxis wieder.
theological_decisions:
- issue: Verhältnis der Darbringung an den Herrn zur anschließenden Zuwendung an den Vater
  choice: „und danach auch meinem Vater“
  alternative: „und gab sie danach auch meinem Vater“
  rationale: Die Ellipse des griechischen Textes bleibt erhalten. So wird nicht festgelegt, ob dasselbe kultische „Darbringen“ oder eine anschließende Weitergabe beziehungsweise Zuwendung gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah am Griechischen, während „Aufrichtigkeit“ das heute abwertend oder intellektuell verengend wirkende „Einfalt“ vermeidet.
