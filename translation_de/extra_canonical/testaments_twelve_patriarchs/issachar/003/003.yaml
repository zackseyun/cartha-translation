source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 3. *Καὶ οὐκ εἰμὶ¹⁵ περίεργος *ἐν ταῖς πράξεσίν μου¹⁶, Γοὐδὲ φθονερὸς¹⁷ καὶ¹⁸ βάσκανος *τῷ πλησίον μου¹⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/003.yaml
  text: And I am not meddlesome in my actions, nor envious and malicious toward my neighbor.
translation:
  language: de
  text: Und in meinem Tun mische ich mich nicht in fremde Angelegenheiten ein; auch bin ich meinem Nächsten gegenüber weder neidisch noch gehässig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: περίεργος ἐν ταῖς πράξεσίν μου
  choice: in meinem Tun mische ich mich nicht in fremde Angelegenheiten ein
  rationale: περίεργος bezeichnet hier jemanden, der sich ungebeten oder übermäßig mit Dingen befasst, die ihn nicht angehen. Die idiomatische deutsche Wiedergabe gibt diesen Sinn klar wieder; ἐν ταῖς πράξεσίν μου wird durch „in meinem Tun“ aufgenommen.
- source_word: φθονερός
  choice: neidisch
  rationale: Die übliche Bedeutung ist „neidisch“ oder „missgünstig“; „neidisch“ hält den Ausdruck deutlich von dem folgenden βάσκανος auseinander.
- source_word: βάσκανος
  choice: gehässig
  rationale: Das Wort kann missgünstige, böswillige oder schädlich-neidische Haltung bezeichnen. „Gehässig“ bewahrt neben φθονερός die eigenständige Nuance der Boshaftigkeit.
- source_word: τῷ πλησίον μου
  choice: meinem Nächsten gegenüber
  rationale: Die Formulierung bezeichnet die Person im nahen sozialen und ethischen Verhältnis zum Sprecher; „mein Nächster“ ist im Deutschen verständlich und traditionsnah.
theological_decisions:
- issue: Beziehung der beiden Adjektive φθονερός und βάσκανος zum Nächsten
  choice: Beide Eigenschaften werden auf „meinen Nächsten“ bezogen.
  alternative: Nur βάσκανος ausdrücklich auf den Nächsten beziehen oder ein im vorgelegten griechischen Text nicht vorhandenes Objekt wie „einen Menschen“ ergänzen.
  rationale: Im überlieferten Wortlaut stehen φθονερός und βάσκανος durch καί verbunden, während τῷ πλησίον μου natürlich zu beiden gehört. Eine zusätzliche Person als Objekt wird nicht eingeführt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die umständliche wörtliche Fassung „nicht geschäftig/neugierig in meinen Handlungen“ wurde zugunsten einer natürlichen, inhaltlich genauen Formulierung vermieden. Das Präsens von εἰμί bleibt erhalten.
