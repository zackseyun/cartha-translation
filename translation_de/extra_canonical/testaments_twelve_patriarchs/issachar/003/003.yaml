  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und die drei Prädikatsbereiche des griechischen Textes zuverlässig wieder: περίεργος im Bereich des eigenen Tuns, φθονερός und βάσκανος gegenüber dem Nächsten. Das Präsens von εἰμί ist korrekt erhalten. Anders als die abweichende englische Revisionsnotiz ergänzt sie kein im vorliegenden griechischen Editionstext nicht bezeugtes Objekt wie „einen Menschen“ zu φθονερός.'
  naturalness: „Und in meinem Tun mische ich mich nicht in fremde Angelegenheiten ein“ ist modernes, verständliches Standarddeutsch; die anschließende koordinierte Verneinung ist idiomatisch und würdevoll. „Meinem Nächsten gegenüber“ ist klar und passt zum ethisch-paränetischen Register.
  terminology: „Neidisch“ und „gehässig“ unterscheiden die verbundenen Adjektive φθονερός und βάσκανος angemessen, ohne eine überpräzise oder konfessionell gefärbte Deutung aufzuzwingen. „Mein Nächster“ ist für πλησίον idiomatisch und traditionsgemäß. Die hochgestellten Zahlen im Quellentext sind editionsinterne kritische Fußnotenanker; da hierzu weder Inhalte noch Zielanker vorliegen, sind keine deutschen Fußnoten anzulegen.
