source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 5. Τριάκοντα Γκαὶ πέντε¹²⁴ ἐτῶν ἔλαβον²⁵ ἐμαυτῷ²⁶ γυναῖκα²⁷, ὅτι ὁ κάματος κατήσθιε τὴν ἰσχύν²⁸ μου²⁹, καὶ οὐκ ἐνενόουν³⁰ ἡδονὴν³¹ γυναικός, Γἀλλὰ διὰ τοῦ κόπου³² ὁ ὕπνος μοι³³ περιεγένετο³⁴⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/005.yaml
  text: At thirty-five years of age I took a wife for myself, for my labor consumed my strength, and I did not think about a woman's pleasure; rather, because of my toil, sleep came over me.
translation:
  language: de
  text: Mit fünfunddreißig Jahren nahm ich mir eine Frau, denn die Arbeit zehrte meine Kraft auf. Ich dachte nicht an die Lust einer Frau; vielmehr überkam mich vor lauter Mühe der Schlaf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὁ κάματος
  choice: die Arbeit
  rationale: Bezeichnet die ermüdende Arbeit beziehungsweise Mühsal; „Arbeit“ ist im Zusammenhang natürlich, während das zehrende Moment durch das Verb ausgedrückt wird.
- source_word: κατήσθιε τὴν ἰσχύν μου
  choice: zehrte meine Kraft auf
  rationale: Gibt das intensive Bild des Aufzehrens idiomatisch und eng am griechischen Ausdruck wieder.
- source_word: ἡδονὴν γυναικός
  choice: die Lust mit einer Frau
  rationale: Bewahrt den sexuellen Bezug, ohne das mehrdeutige Genitivverhältnis vorschnell als ausschließlich ihre oder seine Lust festzulegen.
- source_word: διὰ τοῦ κόπου
  choice: vor lauter Mühe
  rationale: Drückt den ursächlichen Zusammenhang zwischen Anstrengung und Schlaf in natürlichem Deutsch aus.
- source_word: ὁ ὕπνος μοι περιεγένετο
  choice: überkam mich der Schlaf
  rationale: Eine würdevolle, idiomatische Wiedergabe dafür, dass der Schlaf aufgrund der Mühe die Oberhand gewann.
theological_decisions:
- issue: Bewertung ehelicher Sexualität
  choice: Die Aussage bleibt eine persönliche Schilderung seiner damaligen Haltung und Erschöpfung.
  alternative: Den Satz als allgemeine Geringschätzung sexueller Lust oder als asketische Vorschrift formulieren.
  rationale: Der griechische Text berichtet in der ersten Person und enthält hier keine ausdrückliche allgemeine Norm.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satzbau bleibt nahe an der griechischen Gedankenfolge, wird jedoch für gute Lesbarkeit in zwei Sätze gegliedert. Keine Fußnoten erforderlich.
