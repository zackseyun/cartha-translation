review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt Alter, Eheschließung, erschöpfende Arbeit und den durch Mühe bewirkten Schlafzutritt zutreffend wieder. „Lust mit einer Frau“ legt jedoch ein konkretes sexuelles Zusammensein nahe und bestimmt damit das offene Genitivverhältnis von ἡδονὴ γυναικός stärker als der griechische Text. „Die Lust einer Frau“ bildet die Formulierung enger nach und erhält die Mehrdeutigkeit besser.
  naturalness: Der Text ist flüssiges, modernes und würdiges Standarddeutsch. Die Satzteilung ist unproblematisch. „Vor lauter Mühe“ ist idiomatisch und gibt διὰ τοῦ κόπου angemessen wieder.
  terminology: „Frau“, „Arbeit“, „Kraft aufzehren“ und „Schlaf“ sind treffend. Die Änderung von „Lust mit einer Frau“ zu „Lust einer Frau“ ist erforderlich, um keine zusätzliche Deutung des griechischen Genitivs einzutragen.
  issues:
  - severity: medium
    issue: „die Lust mit einer Frau“ konkretisiert ἡδονὴν γυναικός über den Wortlaut hinaus.
    rationale: Die Präposition „mit“ legt sexuelle Betätigung mit einer Frau nahe. Der Genitiv γυναικός kann unterschiedlich verstanden werden; die deutsche Fassung soll diese umstrittene beziehungsweise offene Zuordnung nicht einseitig festlegen.
  revised_text: Mit fünfunddreißig Jahren nahm ich mir eine Frau, denn die Arbeit zehrte meine Kraft auf. Ich dachte nicht an die Lust einer Frau; vielmehr überkam mich vor lauter Mühe der Schlaf.
