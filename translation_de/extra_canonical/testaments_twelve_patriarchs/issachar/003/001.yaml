base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/001.yaml
  text: When therefore I grew up, my children, I walked in uprightness of heart, and I became a farmer for my father and for my brothers, and I brought in fruits from the fields in their season.
translation:
  language: de
  text: Als ich nun erwachsen war, meine Kinder, lebte ich in Aufrichtigkeit des Herzens und arbeitete als Bauer für meinen Vater und meine Brüder; ich brachte die Früchte von den Feldern zu ihrer Zeit ein.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „zu der ihnen bestimmten Zeit“. Das griechische „ihrer“ kann sich grammatisch auf die Früchte oder auf die Felder beziehen.'
    reason: Bewahrt die possessive Formulierung und die grammatisch mögliche Mehrdeutigkeit von αὐτῶν, ohne den Bezug festzulegen.
lexical_decisions:
- source_word: ἡδρύνθην
  choice: erwachsen geworden war
  rationale: Das Verb bezeichnet hier das Heranreifen beziehungsweise Erwachsenwerden; die natürliche deutsche Wiedergabe passt zum rückblickenden Erzählzusammenhang.
- source_word: ἐπορεύθην ἐν εὐθύτητι καρδίας
  choice: lebte ich mit aufrichtigem Herzen
  rationale: Das wörtliche Bild „ging/wandelte ich in Geradheit des Herzens“ bezeichnet die Lebensführung. „Lebte“ klingt im modernen Deutsch natürlich, während „mit aufrichtigem Herzen“ den ethischen und inneren Bezug bewahrt.
- source_word: γεωργός
  choice: Bauer
  rationale: Bezeichnet einen Landarbeiter beziehungsweise Ackerbauern; „Bauer“ ist verständlich, prägnant und dem Kontext angemessen.
- source_word: ἔφερον καρποὺς ἐξ ἀγρῶν
  choice: brachte ... die Früchte von den Feldern ein
  rationale: „Einbringen“ gibt im landwirtschaftlichen Zusammenhang das Herbeitragen beziehungsweise Ernten der Feldfrüchte idiomatisch wieder.
- source_word: κατὰ καιρὸν αὐτῶν
  choice: zur rechten Zeit
  rationale: Die Wendung meint die jeweils angemessene oder bestimmte Zeit der Früchte; die knappe Form bewahrt den zeitlichen Sinn, ohne eine nicht ausdrücklich genannte Jahreszeit festzulegen.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Das altertümliche „wandelte“ wurde zugunsten des natürlichen „lebte“ vermieden; die Aufrichtigkeit des Herzens und der landwirtschaftliche Erzählton bleiben erhalten.
