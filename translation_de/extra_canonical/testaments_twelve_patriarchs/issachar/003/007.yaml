    issue: Die zweite Instanz von ἁπλότητι im Schlussausdruck hat keinen Fußnotenanker.
    rationale: Die Fußnote erläutert gerade ein mehrfach vorkommendes, semantisch weites Schlüsselwort. Der Anker sollte auch bei »in der Aufrichtigkeit meines Herzens« stehen.
  - severity: low
    issue: Die Stellung von »alles« im letzten Satz ist im Deutschen holprig.
    rationale: Die griechische Verteilung – πάντα als Gegenstand, πένησι καὶ θλιβομένοις als Empfänger und ἐκ τῶν ἀγαθῶν als Herkunft/Mittel – lässt sich mit einer leichten Umstellung natürlicher wiedergeben.
