  to: 7 Und der Herr vermehrte die Güter in meinen Händen zehntausendfach[a]. Auch mein Vater Jakob wusste, dass Gott mit meiner Aufrichtigkeit[b] zusammenwirkte. Denn ich gab den Armen und Bedrängten alles von den Gütern der Erde, in der Aufrichtigkeit[b] meines Herzens.
