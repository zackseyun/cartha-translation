base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003/007.yaml
  text: And the Lord multiplied the good things ten thousandfold in my hands; and Jacob my father also knew that God was working together with my simplicity. For I provided to all the poor and afflicted from the good things of the earth, in the simplicity of my heart.
translation:
  language: de
  text: 7 Und der Herr vermehrte die Güter in meinen Händen zehntausendfach[a]. Auch mein Vater Jakob wusste, dass Gott mit meiner Aufrichtigkeit[b] zusammenwirkte. Denn ich gab den Armen und Bedrängten alles von den Gütern der Erde, in der Aufrichtigkeit[b] meines Herzens.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »vervielfachte die Güter in meinen Händen unermesslich«; das griechische Wort bezeichnet wörtlich eine zehntausendfache Vermehrung und kann zugleich verstärkend gemeint sein.'
    reason: Bewahrt die wörtliche Zahl und weist zugleich auf ihren möglichen emphatischen Gebrauch hin.
  - marker: b
    text: Das griechische Wort kann auch »Lauterkeit«, »Einfachheit« oder im Zusammenhang des Gebens »Großzügigkeit« bedeuten.
    reason: Die Bedeutungsbreite von ἁπλότης lässt sich nicht mit einem einzigen deutschen Wort vollständig abbilden; beide Vorkommen sind markiert.
lexical_decisions:
- source_word: ἐμυριοπλασίασε
  choice: vermehrte … zehntausendfach
  rationale: Gibt die ausdrücklich genannte zehntausendfache Vermehrung wieder und bewahrt zugleich den emphatischen Charakter des griechischen Verbs.
- source_word: τὰ ἀγαθὰ
  choice: die guten Gaben
  rationale: Im Zusammenhang mit Erträgen der Erde bezeichnet der substantivierte Plural konkrete Güter bzw. Gaben, nicht nur abstrakt »das Gute«.
- source_word: συνεργεῖ
  choice: wirkte … zusammen
  rationale: Bewahrt die Bedeutung des gemeinsamen Wirkens und vermeidet eine weitergehende Deutung wie »belohnte« oder »segnete«.
- source_word: ἁπλότης
  choice: Aufrichtigkeit
  rationale: »Aufrichtigkeit« ist im modernen Deutschen natürlich und erfasst hier die ungeteilte, lautere Herzenshaltung; »Einfachheit« könnte missverständlich nach geistiger Beschränktheit klingen.
- source_word: πένησι καὶ θλιβομένοις
  choice: den Armen und Bedrängten
  rationale: Gibt sowohl materielle Armut als auch die Erfahrung von Bedrängnis oder Not wieder.
- source_word: πάντα … παρεῖχον
  choice: gab ich alles
  rationale: Behandelt πάντα entsprechend dem überlieferten griechischen Text als Akkusativobjekt (»alles«), statt es wie eine Form von πᾶσι als »allen« zu verstehen.
theological_decisions:
- issue: Verhältnis zwischen Gottes Wirken und Issachars Aufrichtigkeit
  choice: dass Gott mit meiner Aufrichtigkeit zusammenwirkte
  alternative: dass Gott meine Aufrichtigkeit unterstützte
  rationale: Die Formulierung bewahrt die ungewöhnliche und theologisch offene Konstruktion συνεργεῖ τῇ ἁπλότητί μου, ohne das Verhältnis einseitig als bloße Belohnung, Anerkennung oder menschliches Verdienst festzulegen.
- issue: Umfang von Issachars Geben
  choice: von den guten Gaben der Erde gab ich alles
  alternative: ich versorgte alle Armen und Bedrängten mit den guten Gaben der Erde
  rationale: Der vorhandene griechische Text hat πάντα (»alles«), nicht πᾶσι (»allen«). Daher wird der umfassende Charakter der Gabe auf die Güter bezogen, ohne stillschweigend den Text zu emendieren.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Satzfolge des griechischen Textes bleibt erhalten. »Gute Gaben« und »Bedrängte« sind verständlich, ohne umgangssprachlich zu wirken; »Aufrichtigkeit« vermeidet die im heutigen Deutschen missverständliche Bezeichnung »Einfachheit«.
