review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf gibt den griechischen Text im Wesentlichen zuverlässig wieder, einschließlich der markierten, kontextuell auffälligen Gad-Klausel. Eine sichere Verbesserung betrifft vor allem die agrarische Formulierung in V. 5: »unter Mühen um ihre Früchte« ist im Deutschen semantisch und syntaktisch schwer verständlich. Die Revision bringt den Zusammenhang von fruchtbarem Land und mühevoller Arbeit klarer zum Ausdruck, ohne den griechischen Ausdruck übermäßig festzulegen. In V. 4 und 6 werden die Erstlingsausdrücke zudem idiomatischer und näher an ihrem Opfer-/Ertragskontext gefasst.'
  naturalness: 'Der würdige, moderne Registerton ist gut getroffen. Einzelne Wendungen werden geglättet: »Setzt euren Rücken für die Feldarbeit ein« ist im heutigen Deutsch natürlicher als »Beugt euren Rücken zur Feldarbeit«, und »Erweist den Armen und Schwachen Erbarmen« ist ein klarer direkter Imperativ.'
  terminology: »Gesetz Gottes«, »Lauterkeit«, »Heilige«, »Priestertum« und »Königsherrschaft« sind angemessen. »Erstlingsgaben« macht in diesem Kontext den Charakter von πρωτογεννήματα/ἀπαρχαί verständlicher, ohne den Bezug auf die Erträge des Landes aufzugeben. Die Klammerung und Fußnote zur Gad-Klausel bewahren die textkritische Unsicherheit.
  issues:
  - severity: medium
    issue: 'V. 5: »die Fülle der Erde unter Mühen um ihre Früchte«'
    rationale: Die Wendung ist im Deutschen kaum verständlich und kann fälschlich nahelegen, die Erde selbst sei »unter Mühen«. Das griechische ἐν πόνοις καρπῶν verbindet den Anteil am reichen Ertrag des Landes mit den Mühen der Fruchtarbeit. Eine behutsam explizierende Formulierung ist hier erforderlich.
  - severity: low
    issue: 'V. 3: »Beugt euren Rücken zur Feldarbeit«'
    rationale: Das körperliche Bild ist nachvollziehbar, die Präposition »zur« wirkt jedoch im modernen Deutsch unidiomatisch. »Setzt euren Rücken für die Feldarbeit ein« bewahrt den Einsatz des Rückens bei schwerer Arbeit.
  - severity: low
    issue: 'V. 4 und 6: »Erstlingsfrüchte vom Ertrag«'
    rationale: Die Verbindung ist redundant und weniger idiomatisch. »Erstlingsgaben von den Früchten/Erträgen« gibt den griechischen Erstlingswortschatz natürlich wieder und lässt den kultischen Kontext erkennbar.
