base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005.yaml
  text: '1 Therefore[a], my children, keep the law of God, and acquire simplicity, and walk in innocence, not meddling in the deeds of your neighbor. 2 But love the Lord and your neighbor; show mercy to the poor and the weak. 3 Set your back to farming, and labor in every work of cultivation, offering gifts to the Lord with thanksgiving. 4 For in the firstfruits of the produce of the land the Lord will bless you, just as he blessed all the holy ones from Abel until now[b]. 5 For no other portion has been given to you except the richness of the earth in the toils of its fruits. 6 For my father Jacob also blessed me with blessings of the earth and of firstfruits of produce. 7 And Levi and Judah were glorified by the Lord among the sons of Jacob. And the Lord gave them their inheritance: to Levi, the priesthood; and to Judah, the kingdom. 8 Therefore obey them, and walk in the simplicity of your father[c]. [But to Gad it was given to destroy the marauding raids coming upon Israel.]'
translation:
  language: de
  text: '1 Darum, meine Kinder, haltet das Gesetz Gottes, eignet euch Lauterkeit an und führt ein argloses Leben, ohne euch in die Taten eures Nächsten einzumischen. 2 Liebt vielmehr den Herrn und euren Nächsten; erweist den Armen und Schwachen Erbarmen. 3 Setzt euren Rücken für die Feldarbeit ein und verrichtet jede Arbeit des Ackerbaus; bringt dabei dem Herrn Gaben mit Dank dar. 4 Denn durch die Erstlingsgaben von den Früchten des Landes wird der Herr euch segnen, so wie er alle Heiligen von Abel bis heute gesegnet hat.[a] 5 Denn euch ist kein anderer Anteil gegeben als der reiche Ertrag der Erde, für den ihr euch müht.[b] 6 Auch mein Vater Jakob segnete mich mit Segnungen der Erde und mit Erstlingsgaben von den Erträgen. 7 Levi und Juda wurden vom Herrn unter den Söhnen Jakobs zu Ehren gebracht. Der Herr wies ihnen ihr Erbteil zu: Levi das Priestertum und Juda die Königsherrschaft. 8 Darum gehorcht ihnen und lebt in der Lauterkeit eures Vaters. [Gad aber wurde es gegeben, die räuberischen
    Überfälle zu vernichten, die über Israel kommen.][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Alle Heiligen von Abel bis heute« meint wahrscheinlich die Reihe der von Gott angenommenen Anbeter, die mit Abel beginnt; vgl. das Erstlingsgabenmotiv in Genesis 4,3–5.
    reason: cross_reference
  - marker: b
    text: 'Wörtlicher: »die Fettigkeit der Erde«. Gemeint ist ihr reicher, fruchtbarer Ertrag; die griechische Satzfügung bleibt ungewöhnlich.'
    reason: lexical_alternative
  - marker: c
    text: Der abschließende Satz über Gad wirkt in diesem Zusammenhang textlich fremd und könnte eine spätere Glosse oder eine versetzte Zeile sein. Er wird übersetzt, weil er im griechischen Textzeugen steht.
    reason: textual_variant
lexical_decisions:
- source_word: νόμον Θεοῦ
  choice: das Gesetz Gottes
  rationale: Bewahrt den objektiven Genitiv und den feierlichen Ton der väterlichen Mahnung.
- source_word: ἁπλότητα
  choice: Lauterkeit
  rationale: Bezeichnet hier eine ungeteilte, aufrichtige und unverstellte Lebenshaltung; „Lauterkeit“ klingt im modernen Deutschen natürlicher und moralisch präziser als das missverständliche „Einfachheit“.
- source_word: ἀκακίᾳ
  choice: argloses Leben
  rationale: Gibt die Abwesenheit von Bosheit oder Arglist idiomatisch wieder und bleibt von der benachbarten „Lauterkeit“ unterscheidbar.
- source_word: μὴ περιαργαζόμενοι τοῦ πλησίον τὰς πράξεις
  choice: ohne euch in die Taten eures Nächsten einzumischen
  rationale: Bewahrt sowohl den Gedanken des neugierigen Einmischens als auch den konkreten Bezug auf das Handeln des Nächsten.
- source_word: ἐλεήσατε
  choice: erbarmt euch über
  rationale: Gibt den kräftigen ethischen Imperativ wieder und wahrt seinen biblisch-feierlichen Klang.
- source_word: Ὑποτίθετε τὸν νῶτον ὑμῶν εἰς τὸ γεωργεῖν
  choice: Beugt euren Rücken zur Feldarbeit
  rationale: Erhält das körperliche Bild harter Arbeit, ohne die im Deutschen unnatürliche Wendung „setzt euren Rücken“ zu übernehmen.
- source_word: δῶρα μετ᾽ εὐχαριστείας Κυρίῳ προσφέροντες
  choice: bringt dabei dem Herrn eure Gaben mit Dank dar
  rationale: „Darbringen“ lässt den kultischen Unterton erkennen; „mit Dank“ ist klar und gegenwärtig.
- source_word: ἐν πρωτογεννήμασιν καρπῶν τῆς γῆς
  choice: durch die Erstlingsfrüchte vom Ertrag des Landes
  rationale: Macht das Erstlingsmotiv ausdrücklich sichtbar und versteht ἐν instrumental, ohne diese Deutung dogmatisch zu überladen.
- source_word: ἁγίους
  choice: Heiligen
  rationale: Entspricht dem griechischen Ausdruck, ohne ihn interpretierend durch „Gerechte“ zu ersetzen; der Kontext bestimmt die vorchristliche Bedeutung.
- source_word: πιότητος τῆς γῆς
  choice: Fülle der Erde
  rationale: Bewahrt das agrarische Bild von Reichtum beziehungsweise „Fettigkeit“ des Bodens, klingt aber im Deutschen verständlich und würdig.
- source_word: ἐκληροδότησεν αὐτούς
  choice: wies ihnen ihr Erbteil zu
  rationale: Gibt die Zuteilung eines Erbes wieder und bereitet die parallele Nennung von Priestertum und Königsherrschaft klar vor.
- source_word: τὴν βασιλείαν
  choice: die Königsherrschaft
  rationale: Bezeichnet hier die Juda zugewiesene königliche Herrschaft präziser als das räumlich missverständliche „Königreich“.
- source_word: τὰ ἐπερχόμενα πειρατήρια
  choice: die räuberischen Überfälle, die über Israel kommen
  rationale: Vermeidet die im Landkontext irreführende maritime Bedeutung von „Piraten“ und erhält sowohl den räuberischen als auch den herannahenden Charakter.
theological_decisions:
- issue: Bedeutung von ἁπλότης als Leitmotiv
  choice: Lauterkeit
  alternative: Einfachheit; ungeteilte Gesinnung
  rationale: Die Übersetzung wahrt die ethische Spannung zwischen Schlichtheit, Aufrichtigkeit und innerer Ungeteiltheit, ohne daraus eine konfessionell bestimmte Tugendlehre zu machen.
- issue: Bezug der „Heiligen von Abel bis heute“
  choice: Die offene Bezeichnung „alle Heiligen“ bleibt stehen.
  alternative: alle Gerechten; alle angenommenen Anbeter
  rationale: Der griechische Text bietet ἁγίους. Der wahrscheinliche Bezug auf die Reihe angenommener Gottesverehrer wird in der Fußnote erläutert, aber nicht in den Haupttext eingetragen.
- issue: Status des abschließenden Satzes über Gad
  choice: Übersetzung in eckigen Klammern mit textkritischer Fußnote
  alternative: Auslassung als spätere Glosse; unmarkierte Aufnahme als ursprünglicher Text
  rationale: Der Satz steht im griechischen Zeugen, wirkt nach der Weisung über Levi und Juda jedoch kontextuell fremd. Die Klammern bewahren zugleich den überlieferten Wortlaut und die erkennbare textliche Unsicherheit.
translation_notes:
  register: Modernes Standarddeutsch mit würdigem testamentarischem Ton. Die Imperative bleiben direkt und verständlich. Agrarische und kultische Bilder werden bewahrt, während unnatürliche griechische Satzmuster behutsam idiomatisiert werden. Eckige Klammern markieren ausschließlich die auffällige Überlieferungslage des Gad-Satzes.
