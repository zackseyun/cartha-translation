  rationale: Die Revision korrigiert kleinere, aber reale Bedeutungsverschiebungen und verbessert die idiomatische Wortstellung. Die umstrittene Erweiterung in Vers 14 bleibt im Text und wird neutral als textkritisch unsicher ausgewiesen. Der Umfang bleibt bewusst auf den tatsächlich vorgelegten griechischen Abschnitt beschränkt.
