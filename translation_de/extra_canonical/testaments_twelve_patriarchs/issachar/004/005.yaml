source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 5. Οὐ²³ ζηλοῖ ἐν διαβουλίοις [οὐ βάσκανος²⁶ ἐκτήκει τὴν ψυχὴν αὐτοῦ]²⁷ *οὐδὲ ⌜περισπασμὸς⌝ ἐν ἀπληστείᾳ ἐν νοΐ²⁸.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/004/005.yaml
  text: He does not envy in deliberations, nor does malicious envy consume his soul, nor is there distraction in greed in his mind.
translation:
  language: de
  text: Er ist bei Beratungen nicht neidisch; gehässiger Neid verzehrt seine Seele nicht[a], und sein Sinn wird nicht durch Habgier abgelenkt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Worte „gehässiger Neid verzehrt seine Seele nicht“ stehen in der griechischen Textausgabe in eckigen Klammern und sind daher textkritisch unsicher.
    reason: Der unmittelbar nach dem betreffenden Satzteil gesetzte Anker kennzeichnet dessen textkritischen Status eindeutig.
lexical_decisions:
- source_word: ζηλοῖ
  choice: ist … neidisch
  rationale: Im negierten Zusammenhang bezeichnet das Verb am natürlichsten neidisches Eifern; die Formulierung bewahrt den Bezug zu Beratungen, ohne ein Possessivpronomen hinzuzufügen.
- source_word: διαβουλίοις
  choice: bei Beratungen
  rationale: Gibt den Dativ idiomatisch als situativen Bezug wieder und lässt offen, ob eigene Überlegungen oder gemeinschaftliche Beratungen gemeint sind.
- source_word: βάσκανος
  choice: gehässiger Neid
  rationale: Das Adjektiv/Substantiv bezeichnet böswilligen, missgünstigen Neid; „gehässig“ bringt die schädliche Qualität zum Ausdruck.
- source_word: ἐκτήκει τὴν ψυχὴν αὐτοῦ
  choice: verzehrt seine Seele
  rationale: Bewahrt das starke Bild des allmählichen Aufzehrens und den anthropologischen Ausdruck ψυχή.
- source_word: περισπασμὸς
  choice: macht … rastlos
  rationale: Das Substantiv kann Ablenkung, Zerstreuung oder innere Unruhe bezeichnen; die verbale deutsche Fassung ist natürlich und passt zum inneren Zustand des Sinnes.
- source_word: ἀπληστείᾳ
  choice: Habgier
  rationale: Bezeichnet unersättliches Mehrhabenwollen; „Habgier“ ist im Kontext prägnanter als das allgemeinere „Gier“.
- source_word: νοΐ
  choice: Sinn
  rationale: Gibt νοῦς als Denk- und Wahrnehmungsvermögen wieder, ohne es auf den modernen Begriff „Verstand“ zu verengen.
theological_decisions:
- issue: Textkritischer Status des Satzglieds über den gehässigen Neid
  choice: Im Haupttext aufgenommen und mit einer Fußnote gekennzeichnet
  alternative: Das eingeklammerte Satzglied auslassen
  rationale: Die Edition markiert die Worte als textkritisch unsicher, doch sie gehören zur vorgelegten griechischen Evidenz und zur konsultierten englischen Fassung; die Unsicherheit wird transparent dokumentiert.
- issue: Deutung von περισπασμός ἐν ἀπληστείᾳ ἐν νοΐ
  choice: „Habgier macht seinen Sinn nicht rastlos“
  alternative: „in seinem Sinn gibt es keine Ablenkung durch Habgier“
  rationale: Die gewählte Fassung erhält die innere Unruhe als mögliche Bedeutung von περισπασμός und vermeidet die schwer verständliche Reihung abstrakter Präpositionalphrasen, ohne eine besondere Lehrdeutung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die drei parallelen Negationen bleiben erkennbar; zugleich wird der letzte griechische Nominalsatz idiomatisch verbal wiedergegeben. „Seele“ und „Sinn“ wahren die unterschiedliche Begrifflichkeit von ψυχή und νοῦς.
