  text: But he walks in simplicity of soul; he sees all things with uprightness of heart, not accepting evil eyes from the world’s error, so that he may not see the commandments of the Lord as distorted.
translation:
  language: de
  text: 6 Er aber geht in Schlichtheit der Seele seinen Weg und sieht alles mit Aufrichtigkeit des Herzens. Er übernimmt nicht die bösen Sichtweisen[a], die aus der Verirrung der Welt stammen, damit er die Gebote des Herrn nicht als verdreht ansieht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »bösen Augen«.'
    reason: Die Fußnote bewahrt die konkrete griechische Metapher, während der Haupttext ihre idiomatische Bedeutung verständlich ausdrückt.
lexical_decisions:
- source_word: ἁπλότης ψυχῆς
  choice: Schlichtheit der Seele
  rationale: Bewahrt den Gedanken einer ungeteilten, arglosen inneren Haltung, ohne ihn auf bloße intellektuelle Einfachheit zu verengen.
- source_word: εὐθύτης καρδίας
  choice: Aufrichtigkeit des Herzens
  rationale: Gibt das Bild innerer Geradheit in natürlichem, würdigem Deutsch wieder.
- source_word: ὀφθαλμοὺς πονηρούς
  choice: böse Sichtweisen
  rationale: Die wörtlichen »bösen Augen« bezeichnen hier eine verderbte Art des Sehens; »Sichtweisen« macht die Metapher verständlich, während die Fußnote den genauen Wortlaut offenlegt.
- source_word: πλάνη τοῦ κόσμου
  choice: Verirrung der Welt
  rationale: Bewahrt sowohl den Gedanken des Irrens als auch den möglichen Beiklang der Irreführung, ohne diese Mehrdeutigkeit einseitig festzulegen.
- source_word: διεστραμμένας
  choice: als verdreht
  rationale: 'Gibt die prädikative Beziehung zu den Geboten wieder: Unter dem verderbten Blick erscheinen die Gebote als verdreht.'
theological_decisions:
- issue: Verhältnis zwischen dem bösen Blick und den Geboten des Herrn
  choice: Die Gebote werden unter dem Einfluss der Welt als verdreht angesehen.
  alternative: Der Betrachter sieht die Gebote selbst auf verdrehte Weise.
  rationale: Die griechische Kongruenz von διεστραμμένας mit τὰς ἐντολάς legt die Wiedergabe »die Gebote als verdreht« nahe, ohne die eng verwandte alternative Nuance völlig auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Wendungen »Schlichtheit der Seele« und »Aufrichtigkeit des Herzens« erhalten den weisheitlichen Ton; die ungewöhnliche Augenmetapher wird im Haupttext behutsam erschlossen und in der Fußnote transparent gemacht.
