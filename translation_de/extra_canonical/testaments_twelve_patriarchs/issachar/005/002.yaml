  text: 2. Ἀλλὰ ἀγαπήσατε⁵ τὸν⁶ Κύριον καὶ τὸν πλησίον⁷· πένητα καὶ ἀσθενῆ⁸ ἐλεήσατε⁹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/002.yaml
  text: But love the Lord and your neighbor. Show mercy to the poor and the weak.
translation:
  language: de
  text: Doch liebt den Herrn und euren Nächsten. Erweist den Armen und Schwachen Barmherzigkeit.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλλὰ
  choice: vielmehr
  rationale: Markiert den Gegensatz zum vorausgehenden Zusammenhang; im Deutschen wirkt „vielmehr“ hier natürlicher als ein isoliertes „aber“.
- source_word: ἀγαπήσατε
  choice: Liebt
  rationale: Der Aoristimperativ Plural wird als direkte Aufforderung an mehrere Personen wiedergegeben.
- source_word: τὸν Κύριον
  choice: den Herrn
  rationale: Entspricht der üblichen und würdigen Wiedergabe von Κύριος in religiösem Kontext.
- source_word: τὸν πλησίον
  choice: euren Nächsten
  rationale: Das substantivierte πλησίον bezeichnet den Mitmenschen als Nächsten; das Possessivpronomen macht den idiomatischen deutschen Bezug deutlich.
- source_word: πένητα καὶ ἀσθενῆ
  choice: den Armen und Schwachen
  rationale: Die substantivisch gebrauchten Adjektive bezeichnen bedürftige beziehungsweise kraftlose oder schwache Menschen; die koordinierte deutsche Form bewahrt diese Breite.
- source_word: ἐλεήσατε
  choice: Habt Erbarmen mit
  rationale: Gibt den Imperativ mit seinem personalen Gegenstand natürlich und präzise wieder.
theological_decisions:
- issue: Bezug von Κύριος
  choice: „der Herr“ ohne explizite Identifizierung
  alternative: „Gott, den Herrn“
  rationale: Der griechische Text nennt nur Κύριος. Die Übersetzung bewahrt diese Form und fügt keine nähere theologische Bestimmung hinzu.
- issue: Bedeutungsumfang von ἀσθενής
  choice: „Schwache“
  alternative: „Kranke“
  rationale: ἀσθενής kann körperlich krank, kraftlos oder allgemein schwach bedeuten. „Schwache“ wahrt den weiteren Sinn und vermeidet eine unbegründete Verengung.
translation_notes:
  register: Moderne, klare und würdige Standardsprache. Zwei kurze Aufforderungssätze folgen der griechischen Satzgliederung; die Pluralimperative werden konsequent beibehalten.
