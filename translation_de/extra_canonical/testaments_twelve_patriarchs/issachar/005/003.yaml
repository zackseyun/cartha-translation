source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 3. ᶜὙποτίθετε¹⁰ τὸν νῶτον¹¹ ὑμῶν εἰς τὸ γεωργεῖν καὶ ἐργάζεσθε ἐν ἔργοις¹² ⌜καθ᾽ ἑκάστην γεωργίαν, δῶρα μετ᾽ εὐχαριστείας¹³ Κυρίῳ προσφέροντες¹⁴.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/003.yaml
  text: Bend your back to farming, and labor in every work of cultivation, offering gifts to the Lord with thanksgiving.
translation:
  language: de
  text: Beugt euren Rücken zur Feldarbeit und verrichtet Arbeiten jeder Art in der Landwirtschaft, indem ihr dem Herrn Gaben mit Dank darbringt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ὑποτίθετε τὸν νῶτον ὑμῶν
  choice: Beugt euren Rücken
  rationale: Bewahrt das konkrete griechische Bild einer körperlich anstrengenden Hinwendung zur Arbeit; im Deutschen natürlich und verständlich.
- source_word: εἰς τὸ γεωργεῖν
  choice: zur Feldarbeit
  rationale: Gibt den landwirtschaftlichen Sinn des Verbs prägnant wieder, ohne ihn auf Pflügen oder eine andere Einzelarbeit zu verengen.
- source_word: ἐργάζεσθε ἐν ἔργοις καθ᾽ ἑκάστην γεωργίαν
  choice: müht euch Tag für Tag bei jeder landwirtschaftlichen Arbeit ab
  rationale: Verbindet die Arbeitsintensität von ἐργάζεσθε mit der wahrscheinlich distributiv-zeitlichen Wendung καθ᾽ ἑκάστην und dem umfassenden Bezug auf Tätigkeiten des Landbaus.
- source_word: δῶρα
  choice: Gaben
  rationale: Der allgemeine Ausdruck lässt offen, ob Opfergaben, Erntegaben oder andere Darbringungen gemeint sind.
- source_word: μετ᾽ εὐχαριστείας
  choice: mit Dankbarkeit
  rationale: Gibt die innere Haltung des Dankes wieder und passt idiomatisch zur Darbringung an den Herrn.
- source_word: Κυρίῳ προσφέροντες
  choice: während ihr dem Herrn … darbringt
  rationale: Das begleitende Partizip wird als gleichzeitige Handlung wiedergegeben; »darbringen« erhält den kultisch-religiösen Klang von προσφέρειν.
theological_decisions:
- issue: Art der dem Herrn dargebrachten Gaben
  choice: Der allgemeine Begriff »Gaben« bleibt stehen.
  alternative: »Opfergaben« oder »Erntegaben«
  rationale: Der griechische Text spezifiziert δῶρα nicht; eine engere Deutung würde die genuine Offenheit des Ausdrucks unnötig auflösen.
translation_notes:
  register: Moderne, würdige Standardsprache mit anschaulichem Arbeitsbild. Der Satz bleibt ermahnend und direkt; unnötig altertümliche Formen wurden vermieden.
