base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/007.yaml
  text: 'And Levi and Judah were glorified by the Lord among the sons of Jacob. And the Lord allotted to them their inheritance: to Levi, the priesthood; and to Judah, the kingdom.'
translation:
  language: de
  text: 'Und Levi und Juda wurden vom Herrn unter den Söhnen Jakobs verherrlicht. Und der Herr teilte ihnen ihr Erbe zu: Levi das Priestertum und Juda das Königtum.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐδοξάσθησαν
  choice: wurden verherrlicht
  rationale: Bewahrt die passive Form und die starke Bedeutung von δοξάζω, ohne sie auf bloße Ehre oder Ansehen abzuschwächen.
- source_word: παρὰ Κυρίου
  choice: vom Herrn
  rationale: Gibt den Urheber des passiven Verbs im natürlichen modernen Deutsch wieder.
- source_word: ἐν υἱοῖς Ἰακώβ
  choice: unter den Söhnen Jakobs
  rationale: Das lokale beziehungsweise relationale ἐν bezeichnet hier ihre Stellung innerhalb der Gruppe der Söhne Jakobs.
- source_word: ἐκληροδότησεν αὐτούς
  choice: teilte ihnen ihr Erbe zu
  rationale: Gibt den erbrechtlichen Zuweisungssinn des Verbs idiomatisch wieder; das folgende Priestertum und Königtum erläutert den jeweiligen Erbanteil.
- source_word: τὴν ἱερατείαν
  choice: das Priestertum
  rationale: Entspricht der institutionellen und amtlichen Bedeutung des griechischen Substantivs.
- source_word: τὴν βασιλείαν
  choice: das Königtum
  rationale: Bezeichnet hier die königliche Herrschaft beziehungsweise Würde, die Juda zugeteilt wird; „Königtum“ wahrt diesen dynastisch-amtlichen Sinn besser als das räumlich klingende „Königreich“.
theological_decisions:
- issue: Art und Gegenstand der göttlichen Erbzuteilung
  choice: Der Herr „teilte ihnen ihr Erbe zu“, konkret Levi das Priestertum und Juda das Königtum.
  alternative: Der Herr „gab sie zum Erbe“ oder „setzte sie als Erben ein“.
  rationale: Der unmittelbare Parallelismus identifiziert Priestertum und Königtum als die Levi und Juda jeweils zugewiesenen Erbanteile. Die Formulierung vermeidet zugleich eine weitergehende konfessionelle Deutung dieser Ämter.
- issue: Bedeutung von βασιλεία
  choice: Königtum
  alternative: Königreich oder Herrschaft
  rationale: Im Gegenüber zum Priestertum steht vor allem das königliche Amt beziehungsweise die dynastische Würde im Blick. „Königtum“ lässt den konkreten Umfang der Herrschaft offen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit enger Bindung an die griechische Syntax. Der zweite Satz wird durch einen Doppelpunkt gegliedert, weil die beiden Zuweisungen das zuvor genannte Erbe entfalten. Keine Fußnoten erforderlich.
