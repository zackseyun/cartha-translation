  verdict: revise
  source_fidelity: Die drei Imperative und ihre Reihenfolge sind zutreffend wiedergegeben. „Gottes Gesetz“, „eignet euch … an“ und „lebt in Arglosigkeit“ geben νόμον Θεοῦ, κτήσασθε und ἐν ἀκακίᾳ πορεύεσθε angemessen wieder. Im Schlussteil bezeichnet τὰς πράξεις jedoch ausdrücklich die Handlungen bzw. Taten des Nächsten; „Angelegenheiten“ ist weiter gefasst und lässt diesen Bezug verblassen. Die revidierte Fassung bewahrt ihn.
  naturalness: Die Sprache bleibt modernes, würdiges Standarddeutsch. „Sich mit den Taten … befassen“ ist idiomatisch und gibt die missbilligte Beschäftigung mit fremdem Tun im negierten Partizip μὴ περιαργαζόμενοι ohne zusätzliche Ausdeutung wieder.
  terminology: „Aufrichtigkeit“ ist als Wiedergabe von ἁπλότης im ethischen Zusammenhang vertretbar und vermeidet das heute meist abwertend verstandene „Einfalt“. „Arglosigkeit“ kann eine leichte Nuance von Naivität haben, ist hier aber als moralische Unschuld bzw. Bosheitslosigkeit noch tragfähig. Es werden keine konfessionellen Festlegungen eingeführt.
