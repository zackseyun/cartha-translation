source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: V. Φυλάξατε οὖν *τέκνα μου νόμον Θεοῦ¹, καὶ *τὴν ἁπλότητα κτήσασθε², ⌜καὶ ἐν ἀκακίᾳ πορεύεσθε, μὴ περιαργαζόμενοι τοῦ³ πλησίον⁴ τὰς πράξεις.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/001.yaml
  text: Therefore, my children, keep the law of God, and acquire simplicity, and walk in innocence, not concerning yourselves with the deeds of your neighbor.
translation:
  language: de
  text: Darum, meine Kinder, haltet Gottes Gesetz, eignet euch Aufrichtigkeit an und lebt in Arglosigkeit, ohne euch mit den Taten eures Nächsten zu befassen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Φυλάξατε
  choice: haltet
  rationale: 'Gibt den Imperativ im Zusammenhang mit Gottes Gesetz natürlich und traditionsgemäß wieder: das Gesetz beachten und bewahren.'
- source_word: τὴν ἁπλότητα
  choice: Aufrichtigkeit
  rationale: ἁπλότης bezeichnet hier eine ungeteilte, lautere Haltung. „Aufrichtigkeit“ ist im modernen Deutschen verständlicher als „Einfalt“ und vermeidet dessen abwertenden Beiklang.
- source_word: κτήσασθε
  choice: eignet euch … an
  rationale: 'Bewahrt den aktiven Sinn des Aoristimperativs: Diese Haltung soll erworben beziehungsweise angenommen werden.'
- source_word: ἐν ἀκακίᾳ πορεύεσθε
  choice: lebt in Arglosigkeit
  rationale: Das semitisch geprägte „wandelt“ wird idiomatisch mit „lebt“ wiedergegeben; ἀκακία bezeichnet eine Haltung ohne Bosheit oder schädliche Absicht.
- source_word: μὴ περιαργαζόμενοι
  choice: ohne euch … einzumischen
  rationale: Das Verb bezeichnet ein übermäßiges oder unangebrachtes Befassen mit fremden Angelegenheiten; „sich einmischen“ trifft diese kritische Nuance natürlich.
- source_word: τοῦ πλησίον τὰς πράξεις
  choice: die Angelegenheiten eures Nächsten
  rationale: πράξεις kann Taten, Handlungen oder Angelegenheiten bezeichnen. Im Zusammenhang mit περιαργάζομαι ist „Angelegenheiten“ im Deutschen idiomatisch und lässt den Bezug auf das Tun des Nächsten bestehen.
theological_decisions:
- issue: Bedeutung von ἁπλότης als ethische Tugend
  choice: Aufrichtigkeit
  alternative: Einfachheit; Lauterkeit
  rationale: „Aufrichtigkeit“ vermittelt die ungeteilte und redliche Haltung, ohne intellektuelle Beschränktheit anzudeuten. Eine konfessionelle Sonderdeutung wird vermieden.
- issue: Reichweite von νόμον Θεοῦ
  choice: Gottes Gesetz
  alternative: das Gesetz Gottes
  rationale: Die knappe Form bewahrt den allgemeinen theologischen Ausdruck des griechischen Textes und legt nicht fest, welcher konkrete Gesetzeskorpus gemeint ist.
translation_notes:
  register: Moderne, würdige Standardsprache mit direkter väterlicher Anrede. Die parallelen Imperative bleiben erkennbar; altertümliches „wandelt“ und das heute missverständliche „Einfalt“ werden vermieden.
