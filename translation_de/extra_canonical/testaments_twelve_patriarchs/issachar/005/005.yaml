    issue: Die Formulierung „verbunden mit der Mühsal um ihre Früchte“ ist gegenüber ἐν πόνοις καρπῶν leicht interpretierend.
    rationale: „Verbunden mit“ schwächt die durch ἐν ausgedrückte Einbettung bzw. Begleitung ab; „ihre“ macht die Früchte ausdrücklich zu Früchten der Erde, obwohl dieser Bezug im griechischen Wortlaut nur naheliegt. Eine knappere Formulierung erhält die Offenheit besser.
