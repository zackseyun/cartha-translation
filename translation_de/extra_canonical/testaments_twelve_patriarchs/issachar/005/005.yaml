  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/005.yaml
  text: For no other portion has been given to you except the richness of the earth by the labor of fruits.
translation:
  language: de
  text: Denn euch ist kein anderer Anteil gegeben als der Reichtum der Erde unter Mühen um Früchte.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „in Mühen der Früchte“. Die knappe Genitivverbindung kann die Mühen der Fruchtarbeit beziehungsweise die mit den Erträgen verbundenen Mühen bezeichnen.'
    reason: Die Fußnote erläutert die semantisch knappe und nicht vollständig eindeutige Wendung πόνοις καρπῶν, ohne den Bezug durch einen zusätzlichen Possessivbezug im Übersetzungstext festzulegen.
lexical_decisions:
- source_word: μερὶς
  choice: Anteil
  rationale: Bezeichnet den zugewiesenen Teil oder das Los und wird im Deutschen natürlich mit „Anteil“ wiedergegeben.
- source_word: πιότητος τῆς γῆς
  choice: Reichtum der Erde
  rationale: πιότης kann „Fülle“, „Üppigkeit“ oder wörtlich „Fettigkeit“ bezeichnen. „Reichtum“ bewahrt den Gedanken der ergiebigen, fruchtbaren Erde in würdiger moderner Sprache.
- source_word: ἐν πόνοις καρπῶν
  choice: verbunden mit der Mühsal um ihre Früchte
  rationale: Die knappe griechische Wendung verbindet die Früchte beziehungsweise Erträge der Erde mit beschwerlicher Arbeit. „Mühsal um ihre Früchte“ gibt diesen Zusammenhang verständlich wieder, ohne ihn einseitig als Mittel, Ursache oder bloße Erntearbeit festzulegen.
theological_decisions:
- issue: Verhältnis zwischen dem Erdreichtum und der Mühsal
  choice: 'Als Verbindung formuliert: „verbunden mit“'
  alternative: „durch die Mühsal“ oder „bei der mühevollen Arbeit“
  rationale: ἐν kann hier instrumentale oder begleitende Bedeutung haben. Die Übersetzung lässt die genaue Beziehung offen und vermeidet es, eine besondere theologische Aussage über Verdienst oder Erwerb einzutragen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem Ton. Die Satzstruktur bleibt nahe am griechischen Ausgangstext; die ungewöhnlich knappe Schlusswendung wird behutsam geglättet und durch eine Fußnote erläutert.
