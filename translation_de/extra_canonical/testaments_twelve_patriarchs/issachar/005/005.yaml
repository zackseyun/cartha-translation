  source_fidelity: 'Die Grundstruktur ist zutreffend: οὐ ... εἰ μὴ wird als ausschließende Zuweisung wiedergegeben, μερίς angemessen als „Anteil“ und πιότης τῆς γῆς idiomatisch als „Reichtum der Erde“. Die Wiedergabe von ἐν πόνοις καρπῶν mit „verbunden mit der Mühsal um ihre Früchte“ glättet jedoch ἐν zu einer allgemeinen Verbindung und ergänzt mit „ihre“ einen im griechischen Wortlaut nicht ausdrücklich gesetzten Bezug.'
  naturalness: Der Entwurf ist flüssiges modernes Standarddeutsch. „Unter Mühen um Früchte“ ist ebenfalls natürlich und wahrt zugleich die knappe, begleitende Aussage des griechischen ἐν besser. Der Plural „Mühen“ entspricht πόνοις.
  terminology: „Anteil“ und „Reichtum der Erde“ sind passend. „Früchte“ kann hier, wie im Griechischen, sowohl konkrete Feldfrüchte als auch Erträge umfassen. Die Fußnote soll diese knappe Genitivverbindung erläutern, ohne eine einzige Deutung als sicher auszugeben.
  issues:
