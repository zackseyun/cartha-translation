revisions:
- from: Denn durch die Erstlingsgaben vom Ertrag des Landes wird der Herr euch segnen, wie er alle Heiligen von Abel bis heute gesegnet hat.
  to: Denn bei den Erstlingsfrüchten der Erträge des Landes wird der Herr euch segnen, wie er alle Heiligen von Abel bis heute gesegnet hat.
  rationale: Die Revision bewahrt die offene Funktion von ἐν besser, ersetzt die stärker deutende Bezeichnung „Erstlingsgaben“ durch „Erstlingsfrüchte“ und gibt den Plural von καρπῶν wieder. Die zeitliche Wendung „bis heute“ ist eine natürliche moderne Entsprechung von ἕως τοῦ νῦν.
