  timestamp: '2026-07-18T04:16:41Z'
review_pass:
  verdict: revise
  source_fidelity: Die Wiedergabe von Futur, Subjekt und Objekt in „wird der Herr euch segnen“ ist zutreffend; auch „alle Heiligen“ gibt πάντας τοὺς ἁγίους angemessen wieder. „Durch die Erstlingsgaben“ legt jedoch das mehrdeutige ἐν einseitig instrumental-kausal aus und „Gaben“ konkretisiert den Text stärker als nötig. Das griechische πρωτογεννήματα bezeichnet Erstlingsfrüchte; καρπῶν steht zudem im Plural.
  naturalness: „Bei den Erstlingsfrüchten der Erträge des Landes“ ist modernes, verständliches Standarddeutsch und vermeidet sowohl eine unnatürliche wörtliche Wiedergabe von ἐν als auch eine kausale Festlegung. Der würdige Registerton bleibt erhalten.
  terminology: „Erstlingsfrüchte“ entspricht dem etablierten sachlich-biblischen Ausdruck für πρωτογεννήματα. „Heilige“ bewahrt die offene religiöse Kategorie von ἅγιοι, ohne sie konfessionell zu deuten.
  issues:
  - severity: medium
    issue: „durch die Erstlingsgaben“ verengt ἐν und konkretisiert πρωτογεννήματα.
    rationale: ἐν kann hier die Sphäre bzw. den Anlass bezeichnen; die instrumentale Formulierung kann einen Kausalmechanismus nahelegen. „Gaben“ setzt außerdem eine Opfer-/Darbringungshandlung voraus, die im Wortlaut nicht ausdrücklich benannt ist.
  - severity: low
    issue: Der Plural καρπῶν wird in „vom Ertrag“ nivelliert.
    rationale: „der Erträge des Landes“ erhält den Plural ohne das Deutsche zu überlasten.
  revised_text: Denn bei den Erstlingsfrüchten der Erträge des Landes wird der Herr euch segnen, wie er alle Heiligen von Abel bis heute gesegnet hat.
