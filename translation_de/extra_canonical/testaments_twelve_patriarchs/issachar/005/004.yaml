base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/004.yaml
  text: For in the firstfruits of the produce of the land the Lord will bless you, just as he blessed all the holy ones from Abel until now.
translation:
  language: de
  text: Denn bei den Erstlingsfrüchten der Erträge des Landes wird der Herr euch segnen, wie er alle Heiligen von Abel bis heute gesegnet hat.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν πρωτογεννήμασιν καρπῶν τῆς γῆς
  choice: durch die Erstlingsgaben vom Ertrag des Landes
  rationale: Das instrumentale ἐν wird natürlich mit „durch“ wiedergegeben. „Erstlingsgaben“ bezeichnet die zuerst dargebrachten Erzeugnisse, während „Ertrag des Landes“ καρπῶν τῆς γῆς idiomatisch und sachlich präzise wiedergibt.
- source_word: εὐλογήσει ὑμᾶς Κύριος
  choice: wird der Herr euch segnen
  rationale: Bewahrt Futur, Subjekt und direktes Objekt in natürlicher deutscher Wortstellung.
- source_word: πάντας τοὺς ἁγίους
  choice: alle Heiligen
  rationale: Gibt die substantivierte Bezeichnung wörtlich und ohne konfessionelle Einengung wieder.
- source_word: ἀπὸ Ἀβὲλ ἕως τοῦ νῦν
  choice: von Abel bis heute
  rationale: „Bis heute“ ist die natürliche moderne Entsprechung für „bis zum Jetzt“.
theological_decisions:
- issue: Bezeichnung der früheren Frommen als οἱ ἅγιοι
  choice: alle Heiligen
  alternative: alle heiligen Menschen / alle Frommen
  rationale: „Alle Heiligen“ erhält die religiöse Kategorie des griechischen Textes und vermeidet eine erklärende Festlegung darauf, ob ausschließlich moralische Frömmigkeit oder ein besonderer heiliger Status gemeint ist.
- issue: Art der Beziehung zwischen Erstlingsgaben und Segen
  choice: durch die Erstlingsgaben
  alternative: in den Erstlingsgaben / mit den Erstlingsgaben
  rationale: Das griechische ἐν kann instrumental oder sphärisch verstanden werden. Im Zusammenhang mit dargebrachten Erstlingen ist die instrumentale Wiedergabe im Deutschen am verständlichsten, ohne den Segen als mechanische Gegenleistung auszugeben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz bleibt eng am griechischen Aufbau, wird jedoch idiomatisch formuliert; keine Fußnote ist für das Verständnis zwingend erforderlich.
