- source_word: γῆς
  choice: der Erde
  rationale: Gibt den Genitiv wörtlich und im Zusammenhang natürlich wieder.
- source_word: ἀπαρχῶν καρπῶν
  choice: der Erstlinge ihrer Früchte
  rationale: ἀπαρχαί bezeichnet die ersten Erträge beziehungsweise Erstlingsgaben; „ihrer“ stellt im Deutschen den naheliegenden Bezug der Früchte zur Erde her, ohne eine zusätzliche theologische Deutung einzuführen.
