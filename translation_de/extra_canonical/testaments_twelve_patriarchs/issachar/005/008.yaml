  rationale: Die einzige sichere Korrektur betrifft die Wiedergabe des Präsenspartizips ἐπερχόμενα. Alle übrigen Entscheidungen, insbesondere die moderne Wiedergabe von ἁπλότης, das unergänzte Passiv und die Klammerung des textkritisch markierten Satzes, werden beibehalten.
