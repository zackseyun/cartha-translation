base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/005/008.yaml
  text: Therefore obey them, and walk in the simplicity of your father. [But to Gad it was given to destroy the marauding bands coming upon Israel.]
translation:
  language: de
  text: Darum gehorcht auch ihr ihnen und lebt in der Aufrichtigkeit eures Vaters. [Gad aber wurde es gegeben, die auf Israel anrückenden Räuberbanden zu vernichten.]
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὑπακούετε
  choice: gehorcht
  rationale: Gibt die Aufforderung zum Hören und Befolgen unmittelbar und natürlich wieder.
- source_word: τῇ ἁπλότητι
  choice: in der Aufrichtigkeit
  rationale: ἁπλότης bezeichnet hier eine ungeteilte, redliche Lebenshaltung; „Aufrichtigkeit“ ist im modernen Deutschen verständlicher als das missverständliche „Einfalt“.
- source_word: περιπατεῖτε
  choice: lebt
  rationale: Der semitisch geprägte bildliche Gebrauch von „wandeln“ bezeichnet die Lebensführung; „lebt“ vermittelt diesen Sinn natürlich.
- source_word: ἐδόθη
  choice: wurde es gegeben
  rationale: Bewahrt die passive Form und lässt den Geber wie im Griechischen unausgesprochen.
- source_word: ἀπολέσαι
  choice: zu vernichten
  rationale: Gibt die starke Bedeutung „zugrunde richten, vernichten“ wieder.
- source_word: τὰ ἐπερχόμενα πειρατήρια
  choice: die Räuberbanden, die über Israel herfielen
  rationale: πειρατήρια wird konkret als plündernde bzw. räuberische Gruppen verstanden; ἐπερχόμενα beschreibt ihren feindlichen Ansturm auf Israel.
theological_decisions:
- issue: Unausgesprochener Geber in ἐδόθη
  choice: 'Passiv ohne Ergänzung: „wurde es gegeben“'
  alternative: „Gott gab Gad den Auftrag“
  rationale: Der griechische Text nennt Gott nicht ausdrücklich; die Übersetzung vermeidet eine interpretierende Ergänzung.
- issue: Textlich markierter Zusatz über Gad
  choice: In eckigen Klammern beibehalten
  alternative: Ohne Klammern in den fortlaufenden Text aufnehmen
  rationale: Die Klammern der vorgelegten Quellenausgabe signalisieren textkritische Unsicherheit bzw. einen abgesetzten Zusatz und sollen sichtbar bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der idiomatische Ausdruck „lebt in der Aufrichtigkeit“ vermeidet das heute abwertend oder intellektuell verstandene „Einfalt“, während die starke Aussage über Gad und die textkritischen Klammern erhalten bleiben.
