review_pass:
  verdict: revise
  source_fidelity: Der Hauptsatz gibt Καὶ ὑμεῖς οὖν αὐτοῖς ὑπακούετε und den bildlichen Imperativ περιπατεῖτε angemessen wieder. „Aufrichtigkeit“ ist für τῇ ἁπλότητι eine plausible moderne Wiedergabe im Sinn einer ungeteilten, redlichen Haltung. Der eingeklammerte Gad-Satz wahrt zutreffend die textkritische Markierung und das unpersönliche Passiv von ἐδόθη. In der Relativkonstruktion macht „die über Israel herfielen“ jedoch aus dem gegenwartsbezogenen Partizip ἐπερχόμενα eine vergangene Handlung. Die feindlichen Gruppen sind als auf Israel herankommend bzw. anrückend zu kennzeichnen.
  naturalness: Der Stil ist modern, klar und dem paränetischen Register angemessen. „Darum gehorcht auch ihr ihnen“ ist natürlich. „die auf Israel anrückenden Räuberbanden“ ist idiomatisch und vermeidet die unzutreffende Vergangenheitsform von „herfielen“.
  terminology: „Räuberbanden“ folgt der im englischen Audit gewählten Deutung von πειρατήρια als marauding bands und ist im Kontext vertretbar. „Vernichten“ gibt ἀπολέσαι in diesem kriegerischen Kontext angemessen stark wieder. Die eckigen Klammern bleiben zwingend erhalten.
  issues:
  - severity: medium
    issue: Zeit- und Aspektverschiebung bei ἐπερχόμενα
    rationale: „die über Israel herfielen“ steht im Präteritum und stellt die Überfälle als abgeschlossene Vergangenheit dar. Das Partizip Präsens bezeichnet dagegen Gruppen, die auf Israel zukommen bzw. anrücken.
  revised_text: Darum gehorcht auch ihr ihnen und lebt in der Aufrichtigkeit eures Vaters. [Gad aber wurde es gegeben, die auf Israel anrückenden Räuberbanden zu vernichten.]
