  source_fidelity: 'Die Übersetzung gibt die Satzstruktur und den Sinn des griechischen Textes zuverlässig wieder: ὤφθη τῷ Ἰακώβ als „erschien Jakob“, die unbestimmte Mehrzahl τέκνα als „Kinder“, den kausalen Anschluss ἐπειδή als „weil“ sowie ἐξελέξατο τὴν ἐγκράτειαν als Entscheidung für „Enthaltsamkeit“. Die nicht gesicherte Zahlbestimmung wird zu Recht nicht ergänzt.'
