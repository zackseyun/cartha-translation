id: T12P.ISS.2.1
reference: Testament of Issachar 2:1
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: II. Τότε Γοὖν¹ ὤφθη τῷ² Ἰακώβ³ Γἄγγελος Κυρίου καὶ εἶπε λέγων⁴, *ὅτι τέκνα τέξει Ῥαχήλ⁵, *ἐπειδὴ κατέπτυσεν⁶ συνουσίαν⁷ ἀνδρὸς καὶ ἐξελέξατο τὴν⁸ ἐγκράτειαν.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/002/001.yaml
  text: Then an angel of the Lord appeared to Jacob, saying, “Rachel will bear children, because she despised intercourse with a husband and chose self-control.”
translation:
  language: de
  text: 'Da erschien Jakob ein Engel des Herrn und sprach: „Rahel wird Kinder gebären, weil sie den ehelichen Verkehr verachtet und sich für Enthaltsamkeit entschieden hat.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὤφθη
  choice: erschien
  rationale: Gibt die passive Form des griechischen Erscheinungsverbs idiomatisch und präzise wieder.
- source_word: τέκνα τέξει
  choice: wird Kinder gebären
  rationale: Bewahrt den unbestimmten Plural; eine bestimmte Zahl ist im vorliegenden Haupttext nicht gesichert.
- source_word: συνουσίαν ἀνδρός
  choice: den ehelichen Verkehr
  rationale: Gibt den sexuellen Umgang mit einem Ehemann natürlich wieder, ohne ihn unnötig derb oder technisch zu formulieren.
- source_word: ἐγκράτειαν
  choice: Enthaltsamkeit
  rationale: Bezeichnet hier im Gegensatz zum ehelichen Verkehr sexuelle Selbstbeherrschung beziehungsweise Enthaltsamkeit; der knappe Ausdruck erhält diese Spannung.
theological_decisions:
- issue: Begründungszusammenhang zwischen Rahels Verhalten und der angekündigten Geburt
  choice: Die kausale Aussage mit „weil“ unverändert stehen lassen.
  alternative: Den Zusammenhang erklärend abschwächen oder harmonisieren.
  rationale: ἐπειδή formuliert ausdrücklich einen Grund. Die auffällige theologische und erzählerische Spannung darf nicht stillschweigend aufgelöst werden.
- issue: Identität und Bestimmtheit des Engels
  choice: „ein Engel des Herrn“
  alternative: „der Engel des Herrn“
  rationale: Der griechische Text hat keinen Artikel vor ἄγγελος; die unbestimmte Wiedergabe vermeidet eine nicht ausdrücklich markierte Identifikation.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Da erschien … und sprach“ ist natürlich und bewahrt die erzählerische Abfolge; λέγων wird idiomatisch als Einleitung direkter Rede wiedergegeben. Keine Fußnoten erforderlich.
