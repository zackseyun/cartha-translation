  terminology: „Ein Engel des Herrn“ wahrt die im griechischen Wortlaut fehlende Artikelfestlegung. „Enthaltsamkeit“ trifft ἐγκράτεια im hier durch den Kontrast bestimmten sexuellen Sinn angemessen. „Ehelicher Verkehr“ gibt συνουσίαν ἀνδρός natürlich wieder, ohne eine weitergehende theologische oder erzählerische Deutung einzutragen.
