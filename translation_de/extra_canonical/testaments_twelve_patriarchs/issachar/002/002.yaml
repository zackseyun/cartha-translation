  text: And had Leah my mother not given over the two fruits in exchange for intercourse, she would have been about to bear eight sons; for this reason she bore six, and Rachel bore the two — because in the mandrakes the Lord visited her.
translation:
  language: de
  text: Hätte meine Mutter Lea die beiden Früchte nicht gegen den Beischlaf eingetauscht, wäre sie im Begriff gewesen, acht Söhne zu gebären.[a] Deshalb gebar sie sechs, und Rahel gebar die beiden Söhne; denn bei den Alraunen suchte der Herr sie gnädig heim.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Nach »acht Söhne« bietet die griechische Ausgabe in eckigen Klammern das textlich unsichere Wort »noch«.
    reason: Die Klammerung von ἔτι in der Ausgangsausgabe kennzeichnet eine textliche Unsicherheit; der unsichere Zusatz wird nicht in den Haupttext aufgenommen.
  - marker: b
    text: Das griechische ἐν kann hier örtlich oder kontextuell (»bei« bzw. »in den Alraunen«) oder auch instrumental (»durch die Alraunen«) verstanden werden.
    reason: Die Fußnote bewahrt die bei der Präposition ἐν bestehende echte Auslegungsmehrdeutigkeit, ohne das Verhältnis zwischen den Alraunen und Gottes Zuwendung einseitig festzulegen.
lexical_decisions:
- source_word: ἀντὶ συνουσίας ἀπέδοτο
  choice: gegen den Beischlaf eingetauscht
  rationale: Gibt den Tauschcharakter von ἀντί und ἀπέδοτο klar wieder und wahrt zugleich den konkreten Sinn von συνουσία als Geschlechtsverkehr.
- source_word: τὰ δύο μῆλα
  choice: die beiden Früchte
  rationale: μῆλα kann Äpfel oder allgemein Früchte bezeichnen. »Früchte« vermeidet eine unbelegte botanische Präzisierung, während der spätere Ausdruck ausdrücklich Alraunen nennt.
- source_word: ἔμελλε τεκεῖν
  choice: hätte … zur Welt bringen sollen
  rationale: Bewahrt die Vorstellung eines vorgesehenen oder erwarteten Geschehens, ohne sie eindeutig als bloße Zukunft, Schicksal oder göttliche Vorherbestimmung festzulegen.
- source_word: ἐν τοῖς μανδραγόροις
  choice: durch die Alraunen
  rationale: Das instrumentale Verständnis von ἐν ergibt im Deutschen einen natürlichen Satz, lässt aber die im Text behauptete Verbindung zwischen den Alraunen und Gottes Zuwendung bestehen.
- source_word: ἐπεσκέψατο αὐτὴν ὁ Κύριος
  choice: suchte der Herr sie gnädig heim
  rationale: ἐπισκέπτομαι bezeichnet hier eine wirksame, wohlwollende Zuwendung Gottes; die Formulierung wahrt den biblisch-dignified register and does not reduce it to a mere visit.
theological_decisions:
- issue: Verhältnis zwischen Alraunen und Gottes Eingreifen
  choice: Die Aussage, der Herr habe Rahel »durch die Alraunen« heimgesucht, bleibt im Haupttext stehen.
  alternative: »Bei den Alraunen« oder eine Abschwächung, nach der Gott unabhängig von ihnen handelte.
  rationale: Der griechische Text stellt ausdrücklich eine Verbindung mit ἐν τοῖς μανδραγόροις her. Die Übersetzung soll diese theologische und kausale Spannung nicht stillschweigend auflösen.
- issue: Bedeutung von ἔμελλε
  choice: »hätte … sollen«
  alternative: »war dazu bestimmt« oder »hätte … geboren«
  rationale: Die gewählte Formulierung hält Erwartung beziehungsweise vorgesehenen Verlauf offen, ohne eine bestimmte Lehre von Vorherbestimmung einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. »Beischlaf« ist hier wegen des sachlichen antiken Erzählstils präziser als umgangssprachliche Ausdrücke. »Gnädig heimsuchen« kennzeichnet Gottes wohlwollende Zuwendung und passt zum biblisch-testamentarischen Register.
