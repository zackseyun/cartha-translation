revisions:
- from: Hätte meine Mutter Lea die beiden Früchte nicht gegen den Beischlaf eingetauscht, hätte sie acht Söhne zur Welt bringen sollen.[a] Deshalb gebar sie sechs, und Rahel gebar die beiden; denn durch die Alraunen suchte der Herr sie gnädig heim.[b]
  to: Hätte meine Mutter Lea die beiden Früchte nicht gegen den Beischlaf eingetauscht, wäre sie im Begriff gewesen, acht Söhne zu gebären.[a] Deshalb gebar sie sechs, und Rahel gebar die beiden Söhne; denn bei den Alraunen suchte der Herr sie gnädig heim.[b]
  rationale: Die Revision korrigiert die im Deutschen missverständliche Wiedergabe von ἔμελλε und vermeidet eine nicht zwingende instrumentale Deutung von ἐν. Sie bewahrt den biblisch-würdigen Register, die textkritische Unsicherheit bei ἔτι und die Aussage, dass Gottes gnädige Zuwendung Rahel im Zusammenhang mit den Alraunen gilt.
