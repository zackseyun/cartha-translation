review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die Satzfolge, die jussivische Aufforderung von ἱκανούσθω σοι und die vorwurfsvolle μή-Frage insgesamt zuverlässig wieder. „Früchte“ bewahrt die bei μῆλα mögliche allgemeine Bedeutung und folgt der englischen Audit-Fassung; eine spezifischere Fruchtart wird nicht ergänzt. „wegnehmen“ gibt λήψῃ ἀπ᾿ ἐμοῦ sachgerecht wieder.
  naturalness: „Lass es dir genug sein“ ist verständlich, wirkt im modernen Standarddeutsch jedoch unnötig formelhaft. „Es soll dir genügen“ ist natürlicher und bewahrt die auffordernde/jussivische Kraft. Das zusätzliche „nun“ hat im griechischen Text keine ausdrückliche Entsprechung und sollte entfallen.
  terminology: Die Eigennamen Lea und Rahel sind korrekt. Es gibt keine besonderen theologischen Fachbegriffe. „Mann“ entspricht ἀνήρ und erhält Leas anspruchsvoll-vorwurfsvolle Ausdrucksweise.
