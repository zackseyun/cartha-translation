    rationale: „Lass es dir genug sein“ ist zwar semantisch möglich, aber weniger idiomatisch als „Es soll dir genügen“, das ἱκανούσθω σοι präzise und modern wiedergibt.
  - severity: low
    issue: Zusatz „nun“
    rationale: „Nun“ ist im griechischen καὶ nicht angelegt. „Auch“ gibt die additive Nuance bereits wieder; der Zusatz ist nicht nötig.
