base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/007.yaml
  text: So there were two fruits. And Leah said to Rachel, “Let it be enough for you that you have taken my husband; will you also take these from me?”
translation:
  language: de
  text: '7 Es waren also zwei Früchte. Und Lea sagte zu Rahel: „Es soll dir genügen, dass du meinen Mann genommen hast! Willst du mir auch diese wegnehmen?“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: τὰ μῆλα
  choice: die Früchte
  rationale: μῆλα kann je nach Zusammenhang verschiedene Baumfrüchte bezeichnen. Da der vorliegende Vers die Art nicht näher bestimmt und die konsultierte Fassung ebenfalls allgemein bleibt, bewahrt „Früchte“ diese Offenheit.
- source_word: Ἱκανούσθω σοι
  choice: Lass es dir genug sein
  rationale: Die Form ist als Aufforderung beziehungsweise jussivisch wiedergegeben, nicht als rhetorische Frage.
- source_word: ἔλαβες τὸν ἄνδρα μου
  choice: du meinen Mann genommen hast
  rationale: „genommen“ bildet ἔλαβες direkt ab; „meinen Mann“ ist im Deutschen natürlich und bewahrt Leas Anspruchssprache.
- source_word: μὴ καὶ ταῦτα λήψῃ ἀπ᾿ ἐμοῦ
  choice: Willst du mir nun auch diese wegnehmen?
  rationale: Die erwartungsgefärbte Frage mit μή wird idiomatisch als vorwurfsvolle deutsche Frage formuliert; „wegnehmen“ gibt λήψῃ ἀπ᾿ ἐμοῦ als Einheit wieder.
theological_decisions: []
translation_notes:
  register: Moderne, verständliche und zugleich würdige Standardsprache. Die scharfe, vorwurfsvolle Rede Leas bleibt erhalten; die jussivische Kraft des ersten Satzes wird nicht zu einer rhetorischen Frage umgedeutet.
