base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/008.yaml
  text: And Rachel said to her, “Let Jacob be with you tonight in exchange for your son’s mandrakes.”
translation:
  language: de
  text: 'Da sagte Rahel zu ihr: »Jakob soll heute Nacht bei dir sein als Gegenleistung für die Alraunen deines Sohnes.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔστω σοι ὁ Ἰακώβ
  choice: Jakob soll … bei dir sein
  rationale: Die jussive Wendung wird natürlich und zugleich nah am Griechischen wiedergegeben; σοι bezeichnet hier, dass Jakob ihr für diese Nacht überlassen wird.
- source_word: τῇ νυκτὶ ταύτῃ
  choice: heute Nacht
  rationale: Idiomatiche deutsche Wiedergabe von »in dieser Nacht« im unmittelbaren Gesprächskontext.
- source_word: ἀντὶ τῶν μανδραγόρων
  choice: als Gegenleistung für die Alraunen
  rationale: ἀντί bezeichnet den vereinbarten Austausch; »als Gegenleistung für« macht diesen Sinn klar, ohne zusätzliche Motive einzutragen.
- source_word: τοῦ υἱοῦ σου
  choice: deines Sohnes
  rationale: Entspricht dem griechischen Genitiv und bewahrt die Zuordnung der Alraunen zum Sohn der Angesprochenen.
theological_decisions: []
