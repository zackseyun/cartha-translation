  text: 8. *Εἶπε δὲ αὐτῇ Ῥαχήλ³⁸. Ἔστω³⁹ σοι ὁ⁴⁰ Ἰακὼβ *τῇ νυκτὶ ταύτῃ⁴¹ ἀντὶ τῶν μανδραγόρων ⌈*τοῦ υἱοῦ⁴² σου⌉.
