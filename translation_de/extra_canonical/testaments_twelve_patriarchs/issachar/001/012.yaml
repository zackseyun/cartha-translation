source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 12. ⁵⁴Λαβὰν δὲ⁵⁴ ⁵⁵ἐν ⌜δόλῳ⌝⁵⁵ ⁵⁶ἠπάτησέ⁵⁶ με *⁵⁷καὶ μετέστησέ με τὴν νύκτα ἐκείνην⁷, καὶ⁵⁸ οὐκ εἴασε *Γτῷ Ἰακὼβ ἰδεῖν με, ἐπεί⁷, ἐὰν ἤμην ἐκεῖ⁵⁹, *τοῦτο αὐτῷ οὐκ ἐγένετο⁶⁰.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/012.yaml
  text: But Laban deceived me with guile, and removed me that night, and did not allow Jacob to see me; for if I had been there, this would not have happened to him.
translation:
  language: de
  text: Laban aber täuschte mich mit List und brachte mich in jener Nacht fort. Er ließ nicht zu, dass Jakob mich sah; denn wäre ich dort gewesen, wäre ihm dies nicht geschehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐν ⌜δόλῳ⌝
  choice: mit List
  rationale: Gibt die Art und Weise der Täuschung natürlich und präzise wieder, ohne den Ausdruck unnötig zu verstärken.
- source_word: ἠπάτησέ με
  choice: täuschte mich
  rationale: Direkte Entsprechung für das aktive Verb der Täuschung.
- source_word: μετέστησέ με
  choice: brachte mich … fort
  rationale: Bewahrt den kausativen Sinn des Ortswechsels; im Deutschen idiomatischer als „versetzte mich“.
- source_word: οὐκ εἴασε … ἰδεῖν με
  choice: ließ nicht zu, dass … mich sah
  rationale: Bildet die Konstruktion aus εἴασε und Infinitiv klar und natürlich ab.
- source_word: τοῦτο αὐτῷ οὐκ ἐγένετο
  choice: wäre ihm dies nicht geschehen
  rationale: Bewahrt das unbestimmte τοῦτο sowie den Bezug von αὐτῷ, ohne das gemeinte Ereignis auszudeuten.
theological_decisions:
- issue: Unbestimmter Bezug von „dies“ im irrealen Bedingungssatz
  choice: Die Formulierung „wäre ihm dies nicht geschehen“ bleibt allgemein.
  alternative: Das konkrete Ereignis aus dem Erzählzusammenhang ausdrücklich benennen.
  rationale: Der griechische Text selbst bezeichnet das Ereignis lediglich mit τοῦτο; eine Präzisierung würde die genuine Offenheit des Satzes auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur wurde leicht geglättet, ohne die Abfolge der Aussagen oder den irrealen Bedingungssatz zu verändern.
