source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 11. *Καὶ εἰ μὴ ὁ δόλος ἐπλήθυνεν ἐπὶ τῆς γῆς καὶ ἡ πονηρία τῶν ἀνθρώπων ἐχώρησεν, οὐκ ἂν εἶ σὺ ὁρῶσα τὸ πρόσωπον τοῦ Ἰακώβ⁵³.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/011.yaml
  text: And had guile not multiplied upon the earth and the wickedness of men advanced, you would not be looking on the face of Jacob.
translation:
  language: de
  text: Und wenn der Trug auf der Erde sich nicht vermehrt und die Bosheit der Menschen sich nicht ausgebreitet hätte, würdest du Jakobs Angesicht nicht sehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: δόλος
  choice: Trug
  rationale: Gibt die Bedeutung von Täuschung und Hinterlist knapp und in einem würdigen Register wieder.
- source_word: ἐπλήθυνεν
  choice: sich vermehrt
  rationale: Bewahrt die quantitative Aussage des griechischen Verbs und entspricht der irrealen Vergangenheitsbedingung.
- source_word: ἐχώρησεν
  choice: sich ausgebreitet
  rationale: Gibt das Voranschreiten beziehungsweise Raumgreifen der Bosheit natürlich wieder, ohne die Aussage näher zu bestimmen als der griechische Text.
- source_word: τὸ πρόσωπον τοῦ Ἰακώβ
  choice: Jakobs Angesicht
  rationale: Formnahe und zugleich idiomatische Wiedergabe der Wendung; „Angesicht“ erhält den würdigen erzählerischen Ton.
theological_decisions:
- issue: Irreale Bedingung und gegenwärtige Folge
  choice: „hätten sich nicht …, würdest du jetzt nicht … sehen“
  alternative: „wenn sich nicht … hätten, hättest du … nicht gesehen“
  rationale: Das griechische Imperfekt ὁρῶσα bezeichnet hier den gegenwärtigen Zustand des Anschauens; „jetzt“ macht diesen Zeitaspekt im Deutschen verständlich, ohne eine zusätzliche theologische Deutung einzuführen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem, leicht biblischem Ton. Die feminine Anredeform ὁρῶσα ist im Deutschen nicht eigens markiert, da das Partizip in dieser Konstruktion natürlich verbal wiedergegeben wird.
