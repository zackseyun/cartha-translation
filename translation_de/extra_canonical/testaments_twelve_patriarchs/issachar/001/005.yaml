  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/005.yaml
  text: These were fragrant fruits, which grow in the land of Haran below a watercourse.
translation:
  language: de
  text: Es waren duftende Früchte[a], die im Land Haran unterhalb einer Wasserschlucht[b] wachsen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: Äpfel.'
    reason: μῆλα kann spezifisch „Äpfel“ oder allgemeiner „Früchte“ bedeuten.
  - marker: b
    text: 'Die griechische Wendung lautet wörtlich etwa: „unterhalb einer Schlucht der Wasser“. Sie kann eine von Wasser durchzogene Schlucht oder einen Wasserlauf bezeichnen.'
    reason: φάραγγος ὑδάτων ist eine ungewöhnliche und in ihrer genauen räumlichen Bedeutung nicht eindeutige Verbindung.
lexical_decisions:
- source_word: μῆλα
  choice: Früchte
  rationale: μῆλα kann je nach Zusammenhang Äpfel oder allgemeiner Früchte bezeichnen. »Früchte« bewahrt hier die weitere Bedeutung und vermeidet eine unbelegte botanische Festlegung.
- source_word: εὔοσμα
  choice: duftende
  rationale: Gibt den angenehmen Geruch natürlich und knapp wieder.
- source_word: γίνονται
  choice: wachsen
  rationale: Im Zusammenhang mit Früchten bezeichnet das Verb ihr Vorkommen beziehungsweise Wachstum; »wachsen« ist im Deutschen idiomatisch.
- source_word: ὑποκάτω φάραγγος ὑδάτων
  choice: unterhalb eines Wasserlaufs
  rationale: Gibt die räumliche Angabe verständlich wieder, ohne die schwierige Wendung übermäßig wörtlich als »unter einer Wasserschlucht« abzubilden.
theological_decisions: []
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit schlichter, würdiger Erzählprosa. Das griechische δέ wird nicht eigens wiedergegeben, da es hier als lockerer Fortgangsmarker dient.
