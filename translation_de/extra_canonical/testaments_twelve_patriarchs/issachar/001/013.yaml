  source_fidelity: 'Der Entwurf gibt den griechischen Text unmittelbar und vollständig wieder: Ἀλλ᾽ οὖν mit „Doch“, ἀντὶ τῶν μανδραγόρων mit „für die Alraunen“, das bewusst transaktionale ἐκμισθῶ σοι mit „vermiete ich dir“ und μίαν νύκτα τῷ Ἰακώβ mit „eine Nacht mit Jakob“. Der griechische Wortlaut nennt weder Rachel noch einen Sohn; der deutsche Text fügt dies folgerichtig nicht aus der Genesis-Parallele oder dem englischen Audit-Trail hinzu.'
  naturalness: „Doch für die Alraunen vermiete ich dir eine Nacht mit Jakob“ ist knappes, verständliches modernes Standarddeutsch. Die geschäftlich wirkende Formulierung „vermiete ich“ ist absichtlich markiert, aber im Kontext idiomatisch genug und dem Ausgangstext angemessen.
  terminology: „Alraunen“ ist die etablierte deutsche Bezeichnung für μανδραγόροι. „Jakob“ ist die übliche Namensform. Die Formulierung vermeidet unangebrachte theologische oder interpretierende Ergänzungen und bewahrt die knappe, nicht weiter explizierte Umschreibung der ehelichen Begegnung.
