  text: 13. *Ἀλλ᾽ οὖν ἀντὶ τῶν μανδραγόρων ἐκμισθῶ σοι μίαν νύκτα τῷ Ἰακώβ⁶¹.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/013.yaml
  text: But still, in exchange for the mandrakes I hire out to you one night with Jacob.
translation:
  language: de
  text: Doch für die Alraunen vermiete ich dir eine Nacht mit Jakob.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀλλ᾽ οὖν
  choice: Doch
  rationale: Gibt den adversativen Übergang knapp und in natürlichem modernem Deutsch wieder, ohne dem Ausdruck eine unnötig starke Folgerungsbedeutung aufzuzwingen.
- source_word: ἀντὶ τῶν μανδραγόρων
  choice: für die Alraunen
  rationale: „Für“ bezeichnet hier den Tauschpreis beziehungsweise die Gegenleistung; „Alraunen“ ist die gebräuchliche deutsche Pflanzenbezeichnung.
- source_word: ἐκμισθῶ σοι
  choice: vermiete ich dir
  rationale: Bewahrt bewusst die auffällige geschäftliche Bildsprache des Verbs und glättet sie nicht zu einem neutralen „überlasse ich dir“.
- source_word: μίαν νύκτα τῷ Ἰακώβ
  choice: eine Nacht mit Jakob
  rationale: Gibt die gemeinte zeitlich begrenzte eheliche Gemeinschaft idiomatisch wieder. Die griechische Dativkonstruktion ist knapp und lässt das Verhältnis syntaktisch weniger ausdrücklich erscheinen.
theological_decisions: []
translation_notes:
  register: Modernes, knappes und würdiges Standarddeutsch. Die ungewohnte Formulierung „vermiete ich dir“ bleibt erhalten, weil sie den ausdrücklich transaktionalen Charakter des griechischen Verbs trägt.
