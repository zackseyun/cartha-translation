  source_fidelity: 'Der Entwurf gibt den griechischen Satz vollständig und treffend wieder: ἐτέχθην als „wurde geboren“, πέμπτος υἱὸς τῷ Ἰακώβ als „Jakobs fünfter Sohn“ und ἐν μισθῷ τῶν μανδραγόρων als die absichtlich auffällige Gegenleistungs-/Lohnformulierung im Zusammenhang mit den Alraunen. Die unzutreffende englische Revision in der Audit-Spur betrifft einen anderen Satz und ist für die griechische Vorlage nicht maßgeblich.'
