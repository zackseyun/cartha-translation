  text: I was born as the fifth son to Jacob, as the wages for the mandrakes.
translation:
  language: de
  text: Ich wurde als Jakobs fünfter Sohn geboren, als Lohn für die Alraunen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐτέχθην
  choice: ich wurde geboren
  rationale: Gibt den griechischen Aorist Passiv natürlich und genau wieder.
- source_word: πέμπτος υἱὸς τῷ Ἰακώβ
  choice: als Jakobs fünfter Sohn
  rationale: Drückt die Ordnungszahl und die Zugehörigkeit zu Jakob in natürlichem modernem Deutsch aus.
- source_word: ἐν μισθῷ τῶν μανδραγόρων
  choice: als Lohn für die Alraunen
  rationale: Bewahrt die ungewöhnliche, aber im Erzählzusammenhang bedeutsame Lohnsprache; der Genitiv bezeichnet hier sachlich den Lohn im Zusammenhang mit den Alraunen.
theological_decisions: []
translation_notes:
  register: Modernes, würdiges Standarddeutsch; die knappe autobiografische Aussage und das auffällige Motiv des Lohns für die Alraunen bleiben erhalten. Die sachlich unzutreffende jüngste Revision wurde nicht übernommen, da sie nicht dem vorgelegten griechischen Vers entspricht.
