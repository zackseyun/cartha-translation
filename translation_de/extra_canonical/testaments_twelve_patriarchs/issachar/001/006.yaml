source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 6. Εἶπε δὲ Ῥαχήλ· οὐ δώσω *σοι ταῦτα²⁸, *ἀλλ᾽ ἵνα σχῶ ταῦτα²⁹ ἀντὶ τέκνων· *παρεῖδε γάρ με ὁ Κύριος, καὶ τέκνα οὐκ ἐγέννησα τῷ Ἰακώβ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/006.yaml
  text: And Rachel said, "I will not give these to you, but I will keep them in exchange for children; for the Lord has overlooked me, and I have borne no children to Jacob."
translation:
  language: de
  text: 'Rachel aber sagte: »Ich werde dir diese nicht geben, sondern sie als Ersatz für Kinder behalten; denn der Herr hat mich übergangen, und ich habe Jakob keine Kinder geboren.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ταῦτα
  choice: diese / sie
  rationale: Das erste Vorkommen wird mit dem Demonstrativpronomen »diese« wiedergegeben; beim zweiten vermeidet »sie« eine im Deutschen schwerfällige Wiederholung, ohne den Bezug zu verändern.
- source_word: ἵνα σχῶ ταῦτα ἀντὶ τέκνων
  choice: sie als Ersatz für Kinder behalten
  rationale: Die idiomatische deutsche Fassung gibt den Gedanken wieder, die genannten Dinge anstelle der ausgebliebenen Kinder zu besitzen beziehungsweise zu behalten.
- source_word: παρεῖδε
  choice: hat mich übergangen
  rationale: παροράω bezeichnet hier am ehesten ein Übersehen oder Nichtbeachten. »Übergangen« bewahrt Rachels schmerzliche Wahrnehmung, ohne sie zu einer objektiven theologischen Aussage über Gottes Beweggründe auszubauen.
- source_word: τέκνα οὐκ ἐγέννησα τῷ Ἰακώβ
  choice: ich habe Jakob keine Kinder geboren
  rationale: Die natürliche deutsche Wendung erhält sowohl die Verneinung als auch den ausdrücklichen Bezug auf Jakob.
theological_decisions:
- issue: Rachels Aussage über das Handeln des Herrn
  choice: »der Herr hat mich übergangen« als ihre direkte Aussage beibehalten
  alternative: »der Herr hat auf mich geblickt«
  rationale: Der unmittelbare Zusammenhang mit ihrer Kinderlosigkeit und der gewöhnliche Bedeutungsbereich von παροράω sprechen für »übergehen/übersehen«. Die Übersetzung kennzeichnet die Aussage weder als göttliche Billigung noch als abschließende theologische Deutung.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem erzählerischem Ton. Die einleitende Konstruktion »Rachel aber sagte« spiegelt δὲ, ohne unnötig altertümlich zu wirken.
