  text: A copy of the words of Issachar. For he called his sons and said to them, "Listen, children, to Issachar your father; give ear to the words of one beloved by the Lord.
translation:
  language: de
  text: 'Eine Abschrift der Worte Issachars. Denn er rief seine Söhne und sagte zu ihnen: »Ihr Kinder, hört auf euren Vater Issachar; schenkt den Worten des vom Herrn Geliebten Gehör.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἀντίγραφον
  choice: Eine Abschrift
  rationale: Gibt die Bedeutung einer schriftlichen Kopie oder Niederschrift natürlich und genau wieder.
- source_word: λόγων
  choice: der Worte
  rationale: Formale und im Deutschen idiomatische Wiedergabe des Genitivs.
- source_word: ἀκούσατε
  choice: Hört ... auf
  rationale: Der griechische Imperativ fordert hier zum aufmerksamen Hören auf; die deutsche Konstruktion verbindet ihn natürlich mit der Personenangabe im Genitiv.
- source_word: ἐνωτίσασθε
  choice: schenkt ... Gehör
  rationale: Bewahrt gegenüber ἀκούσατε die verstärkte Aufforderung, aufmerksam zuzuhören.
- source_word: ἠγαπημένου ὑπὸ Κυρίου
  choice: dessen, den der Herr liebt
  rationale: Gibt das substantivierte Partizip und den Urheber der Liebe klar wieder, ohne über den zeitlichen oder theologischen Sinn hinauszugehen.
theological_decisions:
- issue: Zeitlicher Aspekt von ἠγαπημένου
  choice: den der Herr liebt
  alternative: der vom Herrn geliebt worden ist / den der Herr geliebt hat
  rationale: Das griechische Perfektpartizip bezeichnet einen bestehenden Zustand infolge des Geliebtwerdens. Das deutsche Präsens drückt diesen Zustand natürlich aus, ohne eine abgeschlossene Liebe nahezulegen.
- issue: Referent des substantivierten Partizips ἠγαπημένου
  choice: dessen, den der Herr liebt
  alternative: eines vom Herrn Geliebten
  rationale: Der Bezug auf den sprechenden Issachar bleibt erhalten; die Formulierung vermeidet zusätzliche Titel- oder Erwählungsvorstellungen.
translation_notes:
  register: Moderne, würdige Standardsprache. Die einleitende Überschrift bleibt knapp; die direkte Rede ist natürlich formuliert. »Der Herr« gibt Κύριος konventionell wieder.
