source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 14. ⌈Καὶ προσέθηκε Ῥαχὴλ λαλεῖν καὶ εἶπεν. Ἕνα τῶν μανδραγόρων λήψομαι, καὶ ἀντὶ τοῦ ἑνὸς ἐκμισθώσω σοι ἐν τῇ νυκτί⌉.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/014.yaml
  text: And Rachel went on speaking and said, "I will take one of the mandrakes, and in exchange for the one I will hire him out to you for the night."
translation:
  language: de
  text: 'Und Rahel redete weiter und sagte: »Ich werde eine der Alraunen nehmen, und für eine davon werde ich ihn dir für diese Nacht vermieten.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: προσέθηκε ... λαλεῖν
  choice: redete weiter
  rationale: Gibt die griechische Fortsetzungsformel natürlich und zugleich quellennah wieder.
- source_word: μανδραγόρων
  choice: Alraunen
  rationale: Bezeichnet die als fruchtbarkeitsfördernd geltenden Mandragora-Früchte beziehungsweise -Pflanzen; »Alraunen« ist die geläufige deutsche Bibelbezeichnung.
- source_word: ἐκμισθώσω σοι
  choice: werde ich ihn dir ... überlassen
  rationale: Das Verb bedeutet wörtlich »vermieten« beziehungsweise »gegen Entgelt zur Verfügung stellen«. Im Zusammenhang ist Jakob das unausgesprochene männliche Objekt; »überlassen« klingt im Deutschen natürlicher, während »als Gegenleistung« den Tauschcharakter wahrt.
- source_word: ἐν τῇ νυκτί
  choice: für diese Nacht
  rationale: Gibt die zeitliche Begrenzung idiomatisch wieder; der Kontext bezeichnet die betreffende Nacht.
theological_decisions:
- issue: Unausgesprochenes Objekt von ἐκμισθώσω
  choice: »ihn« bezieht sich auf Jakob, ohne seinen Namen ergänzend in den Text einzusetzen
  alternative: »Jakob werde ich dir für diese Nacht überlassen«
  rationale: Das griechische Objekt ist nur durch die männliche Form erschließbar. Das Pronomen bewahrt die Knappheit und die leichte Implizitheit der Quelle.
- issue: Geschäftlicher Klang des Verbs ἐκμισθόω
  choice: »als Gegenleistung ... überlassen«
  alternative: »vermieten«
  rationale: Der Austausch wird klar benannt, ohne einen im modernen Deutschen möglicherweise irreführend kommerziellen oder anstößig zugespitzten Ton stärker als nötig hervortreten zu lassen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Erzählton. Die direkte Rede bleibt knapp; der ungewöhnliche Tauschcharakter der Aussage wird nicht geglättet.
