revisions:
- from: 'Und Rahel redete weiter und sagte: »Ich werde eine von den Alraunen nehmen, und als Gegenleistung für die eine werde ich ihn dir für diese Nacht überlassen.«'
  to: 'Und Rahel redete weiter und sagte: »Ich werde eine der Alraunen nehmen, und für eine davon werde ich ihn dir für diese Nacht vermieten.«'
  rationale: Die Revision stellt den durch ἐκμισθώσω markierten Miet- beziehungsweise Tauschcharakter wieder her und glättet den deutschen Bezug auf die einzelne Alraune. Das ungenannte männliche Objekt bleibt mit »ihn« ebenso implizit wie in der Vorlage.
