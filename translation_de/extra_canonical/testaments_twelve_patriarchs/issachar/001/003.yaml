  source_fidelity: 'Die Übersetzung trifft den Satzbau und die zentralen Lexeme zutreffend: γάρ („Denn“), ὁ ἀδελφός μου („mein Bruder“), μανδραγόρους („Alraunen“), ἐκ τοῦ ἀγροῦ („vom Feld“) sowie die Begegnung Rachels mit Ruben. Jedoch fügt „nahm sie ihm ab“ bei ἔλαβεν αὐτούς eine im griechischen Wortlaut nicht ausgedrückte Herkunfts- bzw. Entzugsrelation hinzu. Das Griechische sagt nur, dass Rachel ihn traf und die Alraunen nahm. Die englische Audit-Fassung enthält zwar „from him“, kann aber die fehlende explizite Präpositionalbestimmung im griechischen Ausgangstext nicht übersteuern.'
