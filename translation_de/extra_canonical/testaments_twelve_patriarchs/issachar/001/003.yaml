translation:
  language: de
  text: Denn mein Bruder Ruben brachte Alraunen vom Feld, und Rahel begegnete ihm und nahm sie.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: μανδραγόρους
  choice: Alraunen
  rationale: Die übliche und sachlich genaue deutsche Bezeichnung für Mandragoren; sie bewahrt zugleich den Bezug zu Genesis 30.
- source_word: προσαπαντήσασα
  choice: begegnete ihm
  rationale: Gibt das Partizip natürlich wieder, ohne eine im Kontext nicht ausdrücklich genannte Absicht hinzuzufügen.
- source_word: ἔλαβεν αὐτούς
  choice: nahm sie ihm ab
  rationale: Das maskuline Pronomen bezieht sich auf die Alraunen; mit dem Dativgedanken bei der Begegnung gibt „ihm abnehmen“ den im Englischen ausdrücklich gemachten Sinn „from him“ idiomatisch wieder.
