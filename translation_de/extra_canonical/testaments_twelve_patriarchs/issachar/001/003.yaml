  terminology: „Alraunen“ ist die übliche präzise Bezeichnung für μανδραγόρους. „Ruben“ und „Rahel“ entsprechen den geläufigen deutschen biblischen Namensformen. Es sind keine theologischen Fachbegriffe betroffen.
