base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/010.yaml
  text: And Rachel said, “Do not boast, nor glorify yourself, for he was joined to me before you, and because of me he served our father fourteen years.”
translation:
  language: de
  text: 'Und Rahel sagte: »Rühme dich nicht und preise dich nicht selbst; denn er war vor dir mit mir verbunden[a], und meinetwegen diente er unserem Vater vierzehn Jahre.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »hatte sich vor dir mit mir verlobt«.'
    reason: ἡρμόσατο bezeichnet ein Verbinden, besonders im ehelichen Zusammenhang; die genaue Einordnung als Verlobung oder weiter gefasste eheliche Bindung bleibt im griechischen Wortlaut offen.
lexical_decisions:
- source_word: καυχῶ
  choice: Rühme dich
  rationale: Gibt das Sich-Rühmen bzw. Prahlen als direkte Aufforderung im verneinten Imperativ wieder.
- source_word: δόξαζε σεαυτήν
  choice: verherrliche dich nicht selbst
  rationale: Bewahrt die ausdrückliche reflexive Formulierung und unterscheidet sie von καυχῶ, ohne die Aussage abzuschwächen.
- source_word: ἡρμόσατο
  choice: hatte sich … mit mir verlobt
  rationale: Im ehelichen Kontext bezeichnet ἁρμόζω das Verbinden oder Verloben; die deutsche Formulierung gibt den medialen Sinn und den zeitlichen Vorrang natürlich wieder.
- source_word: δι᾽ ἐμὲ
  choice: meinetwegen
  rationale: Entspricht dem kausalen Sinn »wegen mir / um meinetwillen« knapp und idiomatisch.
- source_word: ἐδούλευσε
  choice: diente
  rationale: Bewahrt den Grundsinn des Dienstens beziehungsweise Arbeitens für den Vater, ohne unnötig »Sklavendienst« zu konkretisieren.
theological_decisions: []
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallelen Verbote bleiben als zwei eigenständige Aussagen erhalten; die Satzfolge und die familiäre Bezeichnung »unserem Vater« folgen dem Griechischen.
