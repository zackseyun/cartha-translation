  source_fidelity: 'Der griechische Text ist insgesamt treffend wiedergegeben: die beiden Verbote, der zeitliche Vorrang, der kausale Bezug von δι᾽ ἐμέ und die vierzehn Jahre sind erhalten. Allerdings bezeichnet ἡρμόσατο im Kontext die eheliche Verbindung bzw. das Sich-Verbinden; „sich verlobt“ ist als Haupttext zu eng und führt eine spezifische Stufe des Verhältnisses ein, die das Griechische nicht zwingend festlegt. Die Fußnote mildert dies, behebt aber die Einengung im Text nicht.'
