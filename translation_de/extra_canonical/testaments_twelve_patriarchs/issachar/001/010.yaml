  terminology: Rahel ist die übliche deutsche Namensform. „preisen“ gibt δοξάζειν hier als selbstbezogenes Sich-Rühmen/Erheben angemessen wieder, ohne die Wiederholung von „rühmen“ zu erzeugen. „verbunden“ wahrt die semantische Offenheit von ἡρμόσατο und den ehelichen Kontext, ohne ihn als bloße Verlobung festzulegen. „meinetwegen“ und „diente“ sind passend.
