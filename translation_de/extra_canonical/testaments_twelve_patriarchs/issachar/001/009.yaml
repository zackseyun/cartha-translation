  text: 9. *Εἶπε δὲ πρὸς αὐτὴν ἡ Λεία⁴³. *ἐμός ἐστιν ὁ Ἰακώβ⁴⁴, *ὅτι ἐγώ εἰμι⁴⁵ γυνὴ⁴⁶ νεότητος αὐτοῦ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/009.yaml
  text: But Leah said to her, “Jacob is mine, because I am the wife of his youth.”
translation:
  language: de
  text: 'Lea aber sagte zu ihr: »Jakob gehört mir, denn ich bin die Frau seiner Jugend.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐμός ἐστιν ὁ Ἰακώβ
  choice: Jakob gehört mir
  rationale: Die prädikative Besitzangabe bedeutet wörtlich »Jakob ist mein«. »Gehört mir« gibt den im Streit erhobenen Anspruch in natürlichem modernem Deutsch wieder, ohne ihn weiter auszudeuten.
- source_word: ὅτι
  choice: denn
  rationale: Die Konjunktion begründet Leas vorausgehenden Anspruch. »Denn« bewahrt den kausalen Zusammenhang in würdigem, natürlichem Deutsch.
- source_word: γυνὴ νεότητος αὐτοῦ
  choice: die Frau seiner Jugend
  rationale: Die enge, bibelsprachlich geprägte Verbindung bleibt erhalten und bezeichnet die Frau, mit der Jakob seit seiner Jugend verbunden ist; »Frau« lässt dabei die im Griechischen mögliche Bedeutung »Ehefrau« im Kontext erkennen, ohne sie erklärend auszuschreiben.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch mit knapper, würdiger direkter Rede. Die markante Besitzbehauptung und ihre kausale Begründung werden ohne harmonisierende oder konfessionelle Auslegung bewahrt.
