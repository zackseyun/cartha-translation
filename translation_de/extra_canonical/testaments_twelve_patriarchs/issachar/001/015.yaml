source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 15. *⁶²Ἔγνω δὲ Ἰακὼβ τῇ Λείᾳ⁶², καὶ Γσυλλαβοῦσα¹ *ἔτεκεν ἐμέ⁶³, καὶ διὰ Γτούτου⁶⁴ τὸν μισθὸν ἐκλήθην⁶⁵ Ἰσαχάρ.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/001/015.yaml
  text: And Jacob knew Leah, and she conceived and bore me; and because of this — the wages — I was called Issachar.
translation:
  language: de
  text: Und Jakob erkannte Lea, und sie empfing und gebar mich; deshalb wurde ich Issachar genannt, das heißt »Lohn«.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Name Issachar wird hier mit dem Wort »Lohn« verbunden; vgl. Genesis 30,16–18.
    reason: Erläutert das für deutschsprachige Leser sonst nicht erkennbare Namenswortspiel.
lexical_decisions:
- source_word: ἔγνω
  choice: erkannte
  rationale: Bewahrt den biblischen Euphemismus für den Geschlechtsverkehr und entspricht der würdevollen Erzählweise der Vorlage.
- source_word: συλλαβοῦσα
  choice: sie wurde schwanger
  rationale: Gibt das idiomatische Partizip φυσlich und eindeutig im modernen Deutschen wieder.
- source_word: τὸν μισθόν
  choice: »Lohn«
  rationale: Erhält die ausdrückliche Namensdeutung und das Wortspiel mit Issachar, ohne die Etymologie stärker zu präzisieren, als es der griechische Text tut.
- source_word: ἐκλήθην Ἰσαχάρ
  choice: 'wurde ich … genannt: Issachar'
  rationale: Die Doppelpunktkonstruktion macht verständlich, dass »Lohn« die Deutung des Namens Issachar ist, und wahrt zugleich die knappe Form des Griechischen.
theological_decisions:
- issue: Sexuelle Bedeutung von »erkennen«
  choice: Den traditionellen biblischen Euphemismus im Haupttext bewahren
  alternative: »Jakob schlief mit Lea«
  rationale: »Erkannte« steht näher am griechischen ἔγνω und lässt die intertextuelle Anspielung auf die Genesis-Erzählung hörbar, ohne den Sinn zu verschleiern.
- issue: Verhältnis von »Lohn« zum Namen Issachar
  choice: »Lohn« als Namensdeutung präsentieren
  alternative: Nur »deswegen wurde ich Issachar genannt«
  rationale: Der griechische Text nennt τὸν μισθόν ausdrücklich; seine Auslassung würde das zentrale Wortspiel und die Begründung der Namengebung verlieren.
translation_notes:
  register: Modernes, verständliches und zugleich würdiges Standarddeutsch. Der biblische Ausdruck »erkannte« bleibt erhalten; Satzteilung und Doppelpunkt verdeutlichen den Gedankengang, ohne die knappe Aussage der griechischen Vorlage auszubauen.
