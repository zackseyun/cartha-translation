  source_fidelity: 'Der Entwurf trifft den Handlungsablauf zutreffend: Jakob hat Geschlechtsverkehr mit Lea, sie empfängt und gebiert Issachar. Die abschließende Namensdeutung ist jedoch syntaktisch verschoben: Das Griechische nennt Issachar als den gegebenen Namen und verbindet ihn mit τὸν μισθόν („Lohn“). Die deutsche Formulierung „wurde ich »Lohn« genannt: Issachar“ kann dagegen nahelegen, der Eigenname selbst laute „Lohn“.'
  naturalness: „Jakob erkannte Lea“ ist als bewusst biblisch gefärbter Euphemismus im modernen Standarddeutsch verständlich; „empfing“ klingt hier natürlicher und knapper als „wurde schwanger“. Die revidierte Satzfolge macht die Namensdeutung ohne missverständlichen Doppelpunkt idiomatisch deutlich.
  terminology: „Issachar“ ist beizubehalten. „Lohn“ gibt μισθός angemessen wieder. „das heißt“ kennzeichnet die im Text vorgenommene Namensdeutung, ohne eine weitergehende, sprachwissenschaftlich präzise Etymologie zu behaupten.
