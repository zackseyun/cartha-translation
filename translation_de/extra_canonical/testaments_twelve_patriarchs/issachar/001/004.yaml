  source_fidelity: Die Wiedergabe von ἔκλαιε mit „weinte“ und von ἐξῆλθεν mit „kam ... heraus“ ist zutreffend. „als sie ihn rufen hörte“ fügt jedoch das Hören Leas sowie einen expliziten Ruf als Handlung ein. Das Griechische sagt knapper, dass Lea auf bzw. bei seiner Stimme reagierte; die englische Audit-Fassung wahrt dies mit „at his cry“.
  naturalness: Der Satz ist grundsätzlich flüssig. „Auf seinen Ruf hin“ ist im modernen Standarddeutsch idiomatisch und bildet die auslösende Beziehung von ἐπὶ τῇ φωνῇ αὐτοῦ ohne zusätzliche Wahrnehmungshandlung ab.
  terminology: „Ruben“ und „Lea“ sind die im Deutschen üblichen Namensformen. „Lea, meine Mutter“ gibt Λεία ἡ μήτηρ μου klar und natürlich wieder.
  issues:
