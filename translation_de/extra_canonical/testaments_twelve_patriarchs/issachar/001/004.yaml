  text: Ruben aber weinte, und auf seinen Ruf hin kam Lea, meine Mutter, heraus.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Ἔκλαιε
  choice: weinte
  rationale: Das Imperfekt bezeichnet ein andauerndes oder gerade stattfindendes Weinen; „weinte“ gibt dies natürlich wieder.
- source_word: ἐπὶ τῇ φωνῇ αὐτοῦ
  choice: als sie ihn rufen hörte
  rationale: Wörtlich etwa „auf seine Stimme hin“. Im Zusammenhang bezeichnet φωνή wahrscheinlich den hörbaren Ruf beziehungsweise das Weinen; die gewählte Formulierung gibt den Auslöser idiomatisch wieder, ohne einen Schrei ausdrücklich festzulegen.
- source_word: ἐξῆλθεν
  choice: kam … heraus
  rationale: Entspricht der räumlichen Bewegung von drinnen nach draußen und klingt im Deutschen natürlich.
- source_word: Λεία ἡ μήτηρ μου
  choice: meine Mutter Lea
  rationale: Bewahrt sowohl den Namen als auch die erzählerische Beziehung des Sprechers in idiomatischer deutscher Wortstellung.
theological_decisions: []
translation_notes:
  register: Modernes, schlichtes und würdevolles Erzählregister. Die griechische Satzverknüpfung mit δέ wird durch „aber“ erhalten; die zeitliche und kausale Reaktion Leas wird natürlich formuliert.
