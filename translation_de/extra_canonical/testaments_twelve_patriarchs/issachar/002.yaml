revisions:
- from: '**Testament Issachars 2**


    **1.** Damals erschien Jakob ein Engel des Herrn und sagte: »Rahel wird Kinder gebären, weil sie den ehelichen Verkehr verschmäht und sich für Enthaltsamkeit entschieden hat.«


    **2.** Hätte meine Mutter Lea nicht die beiden Früchte[a] für den ehelichen Verkehr hergegeben, hätte sie noch acht Söhne gebären sollen.[b] Deshalb gebar sie sechs, und Rahel gebar die beiden anderen; denn durch die Alraunen nahm der Herr sich ihrer an.[c]'
  to: '**Testament Issachars 2**


    **1.** Damals erschien Jakob ein Engel des Herrn und sagte: »Rahel wird Kinder gebären, weil sie den ehelichen Verkehr verschmäht und sich für Enthaltsamkeit entschieden hat.«


    **2.** Und wenn Lea, meine Mutter, nicht die zwei Früchte[a] im Tausch gegen ehelichen Verkehr hingegeben hätte, hätte sie acht Söhne geboren. Deshalb gebar sie sechs, und Rahel gebar zwei; denn wegen der Alraunen nahm der Herr sich ihrer an.[b]'
  rationale: Die Revision korrigiert die Tauschbeziehung in Vers 2, vermeidet bei der kontrafaktischen Aussage einen unbegründeten Pflichtton und lässt die ungewöhnliche kausale Verknüpfung mit den Alraunen bestehen. Die Fußnoten werden gestrafft und so formuliert, dass sie die lexikalische und syntaktische Offenheit des Griechischen wahren.
