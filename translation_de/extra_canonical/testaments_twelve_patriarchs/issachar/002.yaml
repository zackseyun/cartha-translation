  text: '1[a]. Then an angel of the Lord appeared to Jacob and said, “Rachel will bear two children, because she despised intercourse with a husband and chose self-control.” 2. And Leah took mandrakes, and for them hired me for one night. 3. Because of the mandrakes, therefore, Jacob went in to Rachel rather than to me. 4. But the Lord gave heed to my prayer, and I conceived. 5. For I envied Rachel because she was bearing children, while I was childless. 6. And the Lord heard me, and he gave me this fruit. 7. Because I had offered the mandrakes to the Lord through the priest of the Most High, therefore he gave me Issachar as wages. 8. So then, my children, hear Issachar your father. 9. I was born as wages because of the mandrakes, and I became to my father a reward of hire. 10. Therefore I was called Issachar, which means “hire.” 11. And now, children, hear me: walk in simplicity of heart, because I have seen that all who are guileless in heart prevail over every evil. 12. For if a man does
    not desire gold[b], he does not wrong his neighbor; he does not crave many delicacies; he does not delight in varied clothing. 13. He does not long to live many days; only he waits for the will of God. 14. And the spirits of deceit have no power against him, for he does not look on the beauty of women, lest he pollute his mind with corruption. 15. There is no envy in his thoughts, no malicious person darkens his soul, and no greed distresses his life. 16. He walks in uprightness of life, and he sees all things in sincerity, shunning excess in the desire for worldly gain, so that he may not see the corruption of the commandments of the Lord. 17. Therefore, my children, keep the law of God, and gain singleness of heart, and walk without guile, not busying yourselves with meddling in the affairs of your neighbor, 18. but love the Lord and your neighbor; have compassion on the poor and the weak. 19. Bow your back to farming, and labor in all kinds of fieldwork, offering thanksgiving to the
    Lord. 20. For from the firstfruits of the earth the Lord will bless you, just as he blessed all the saints from Abel until now. 21. For no other portion is given to you than the fatness of the earth, whose fruits are raised by toil. 22. For our father Jacob blessed me with blessings of the earth and of firstfruits. 23. Levi and Judah were glorified by the Lord among the sons of Jacob; to them he gave an inheritance, and to me he gave the things of the earth, with firstfruits of fruits. 24. Therefore be not eager for adornment, nor for luxury in food, 25. but cultivate the land in singleness of heart, and take from it the firstfruits for the Lord. 26. For if you do these things, every spirit of Beliar will flee from you, and no deed of wickedness will rule over you. 27. And you will eat every good thing of the earth, and your sons after you. 28. But know that in the last times your sons will abandon singleness of heart, and will cling to insatiable desire; 29. they will forsake innocence
    and draw near to malice; they will leave the commandments of the Lord and cling to Beliar; 30. they will abandon farming and follow after their own evil schemes; and they will be scattered among the nations and serve their enemies. 31. Therefore tell these things to your children, so that if they sin, they may quickly return to the Lord. 32. For he is merciful[c], and he will deliver them and bring them back into their land.'
translation:
  language: de
  text: '**Testament Issachars 2**


    **1.** Damals erschien Jakob ein Engel des Herrn und sagte: »Rahel wird Kinder gebären, weil sie den ehelichen Verkehr verschmäht und sich für Enthaltsamkeit entschieden hat.«


    **2.** Und wenn Lea, meine Mutter, nicht die zwei Früchte[a] im Tausch gegen ehelichen Verkehr hingegeben hätte, hätte sie acht Söhne geboren. Deshalb gebar sie sechs, und Rahel gebar zwei; denn wegen der Alraunen nahm der Herr sich ihrer an.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »die zwei Äpfel« beziehungsweise »die zwei Früchte«. Im folgenden Satz werden Alraunen genannt; vgl. 1. Mose 30,14–18.'
    reason: lexical_alternative
  - marker: b
    text: 'Wörtlich: »denn bei/in den Alraunen nahm der Herr sich ihrer an«. Die Wendung stellt einen Zusammenhang mit den Alraunen her, ohne dessen genaue Art zu erklären.'
    reason: lexical_alternative
lexical_decisions:
- source_word: κατέπτυσεν
  choice: verschmäht
  rationale: Das Verb bezeichnet eine nachdrückliche, von Geringschätzung geprägte Zurückweisung. »Verschmäht« bewahrt diese Schärfe, ohne die Aussage abzuschwächen.
- source_word: συνουσία ἀνδρός
  choice: ehelicher Verkehr
  rationale: Gemeint ist die sexuelle Gemeinschaft mit dem Ehemann. Die Wiedergabe ist klar, würdig und lässt den ehelichen Kontext erkennen.
- source_word: ἐγκράτεια
  choice: Enthaltsamkeit
  rationale: Im unmittelbaren sexuellen Zusammenhang bezeichnet das Wort hier Selbstbeherrschung in Gestalt von Enthaltsamkeit; diese Wiedergabe ist präziser als das allgemeinere »Selbstbeherrschung«.
- source_word: ἀπέδοτο
  choice: hergegeben
  rationale: Die mediale Verbform kann ein Weggeben beziehungsweise Veräußern im Tausch bezeichnen. »Hergegeben« hält die Art des Geschäfts offen und passt zum Tausch der Früchte gegen ehelichen Verkehr.
- source_word: τὰ δύο μῆλα
  choice: die beiden Früchte
  rationale: μῆλα bezeichnet hier vermutlich die Früchte der im Folgesatz genannten Alraunen. »Früchte« vermeidet die irreführende botanische Festlegung auf Äpfel.
- source_word: μανδραγόροις
  choice: Alraunen
  rationale: Dies ist die herkömmliche und botanisch passende deutsche Bezeichnung für die Pflanzen der Genesisüberlieferung.
- source_word: ἐπεσκέψατο αὐτήν
  choice: nahm sich ihrer an
  rationale: Das Verb bezeichnet hier Gottes gnädige Zuwendung oder Heimsuchung. »Nahm sich ihrer an« gibt dies natürlich wieder, ohne die genaue Wirkungsweise zu bestimmen.
theological_decisions:
- issue: Rahels Zurückweisung des ehelichen Verkehrs
  choice: Die Aussage wird als Lob ihrer Enthaltsamkeit direkt wiedergegeben.
  alternative: Die Zurückweisung nur als zeitweiligen Verzicht zu erklären oder sprachlich abzuschwächen.
  rationale: Der griechische Text verbindet das Verschmähen des ehelichen Verkehrs ausdrücklich mit der Wahl der Enthaltsamkeit. Die Spannung zur Genesisdarstellung wird nicht harmonisierend aufgelöst.
- issue: Göttliche Zuwendung durch die Alraunen
  choice: 'Die kausale Verknüpfung des Textes bleibt bestehen: Durch beziehungsweise im Zusammenhang mit den Alraunen nahm der Herr sich Rahels an.'
  alternative: Die Alraunen lediglich als zeitliche Begleitumstände darzustellen oder ihre Rolle aus theologischen Gründen abzuschwächen.
  rationale: ὅτι ἐν τοῖς μανδραγόροις stellt eine ausdrückliche Verbindung her, deren genaue Art offenbleibt. Die Übersetzung wahrt diese ungewöhnliche Aussage.
- issue: Kontrafaktische Zahl der Söhne Leas
  choice: Die überlieferte Aussage, Lea hätte noch acht Söhne gebären sollen, wird bewahrt.
  alternative: Den Satz rechnerisch nach Genesis umzudeuten oder die Acht auf die Gesamtzahl beider Frauen zu beziehen.
  rationale: Der griechische Wortlaut nennt Lea als Subjekt und acht Söhne als ihr vorgesehenes Gebären. Die anschließende Aufteilung in sechs und zwei erklärt die Logik des Textes, auch wenn sie ungewöhnlich formuliert ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit testamentarischem Erzählton. Die Übersetzung folgt ausschließlich dem vorgelegten griechischen Abschnitt mit seinen zwei Versen; der wesentlich längere englische Beratungstext stimmt in Umfang und Inhalt nicht mit dieser Quelleneinheit überein und wurde daher nicht als Grundtext behandelt. Ungewöhnliche Aussagen und syntaktische Spannungen wurden nicht harmonisiert.
