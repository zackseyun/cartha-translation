base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/006.yaml
  text: Know therefore, my children, that in the last times your sons will abandon simplicity and attach themselves to greed; and leaving innocence[a], they will draw near to cunning, and abandoning the commandments of the Lord, they will attach themselves to Beliar[b]. And leaving farming, they will follow their evil schemes, and they will be scattered among the nations and will serve their enemies. Therefore you also tell these things to your children, so that, if they sin, they may return more quickly to the Lord[c], because he is merciful and will deliver them, to bring them back into their land[d].
translation:
  language: de
  text: '6 1 Erkennt also, meine Kinder: In den letzten Zeiten werden eure Söhne die Lauterkeit aufgeben und sich an die Habgier hängen. Sie werden die Arglosigkeit[a] verlassen und sich der Verschlagenheit zuwenden; sie werden die Gebote des Herrn aufgeben und sich an Beliar[b] hängen. 2 Sie werden die Feldarbeit aufgeben und ihren bösen Plänen folgen. Unter die Völker werden sie zerstreut werden und ihren Feinden dienen. 3 Darum sagt auch ihr dies euren Kindern, damit sie, wenn sie sündigen, umso schneller zum Herrn umkehren[c]. 4 Denn er ist barmherzig und wird sie befreien, um sie in ihr Land zurückzubringen.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Unschuld“. Das griechische Wort ἀκακία bezeichnet besonders das Freisein von Bosheit und Täuschung.'
    reason: lexical_alternative
  - marker: b
    text: Der griechische Text hat die Namensform „Beliar“; vielen ist der Name in der Form „Belial“ bekannt.
    reason: lexical_alternative
  - marker: c
    text: „Zum Herrn umkehren“ schließt hier den Sinn von Buße und erneuter Hinwendung ein.
    reason: semantic_clarification
  - marker: d
    text: 'Die gedrängte Schlusswendung kann auch verstanden werden: „und sie in ihr Land zurückzuführen“.'
    reason: alternative_reading
lexical_decisions:
- source_word: ἁπλότης
  choice: Lauterkeit
  rationale: Im Zusammenhang des Issachar bezeichnet das Wort eine ungeteilte, geradlinige sittliche Haltung, nicht bloß mangelnde Bildung oder Einfalt. „Lauterkeit“ gibt diese positive Tugend im heutigen Deutschen natürlich wieder.
- source_word: ἀπληστία
  choice: Habgier
  rationale: Das Wort bezeichnet unersättliches, raffendes Begehren. „Habgier“ bildet einen klaren moralischen Gegensatz zur Lauterkeit.
- source_word: ἀκακία
  choice: Arglosigkeit
  rationale: Der Ausdruck meint das Freisein von Bosheit und Täuschung. „Arglosigkeit“ bewahrt besonders den Gegensatz zur folgenden Verschlagenheit; „Unschuld“ bleibt als mögliche weitere Nuance in der Fußnote erhalten.
- source_word: πανουργία
  choice: Verschlagenheit
  rationale: Gemeint ist moralisch verwerfliche, skrupellose Schlauheit. „Verschlagenheit“ ist gegenwärtig, verständlich und bildet einen präzisen Gegensatz zu Arglosigkeit.
- source_word: κολλάω / κολληθήσονται
  choice: sich an … hängen
  rationale: Die gleiche Wendung wird sowohl bei der Habgier als auch bei Beliar beibehalten und macht so den rhetorischen Parallelismus und den Wechsel der Bindung sichtbar.
- source_word: Βελίαρ
  choice: Beliar
  rationale: Die griechische Textgestalt wird transliteriert, statt sie zur bekannteren Form „Belial“ zu normalisieren.
- source_word: γεωργεῖν
  choice: Feldarbeit
  rationale: Der Infinitiv bezeichnet das Bearbeiten des Landes. „Feldarbeit“ ist konkreter als „Landwirtschaft“ und fügt sich natürlich in den Satz ein.
- source_word: πονηροῖς διαβουλίοις
  choice: bösen Plänen
  rationale: Die Wortgruppe bezeichnet moralisch verwerfliche Überlegungen oder Vorhaben. „Böse Pläne“ wahrt den aktiven Sinn, ohne unnötig altertümlich zu klingen.
- source_word: διασπαρήσονται
  choice: werden … zerstreut werden
  rationale: Das Passiv bezeichnet die Zerstreuung unter die Völker und bewahrt den Anklang an Exil und Diaspora.
- source_word: δουλεύσουσιν
  choice: werden … dienen
  rationale: Das Verb kann Unterwerfung oder Sklavendienst bezeichnen. „Ihren Feinden dienen“ bewahrt die Form des Griechischen, ohne die mögliche Intensität auf eine einzige Lesart festzulegen.
- source_word: τάχιον
  choice: umso schneller
  rationale: Die komparative Form wird ausdrücklich wiedergegeben und bezeichnet die dringliche, rasche Umkehr nach einer Sünde.
- source_word: ἐπιστρέψωσι πρὸς τὸν Κύριον
  choice: zum Herrn umkehren
  rationale: „Umkehren“ trägt im religiös-sittlichen Zusammenhang sowohl die Bedeutung der Hinwendung als auch die der Buße und Wiederherstellung.
- source_word: ἐλεήμων
  choice: barmherzig
  rationale: „Barmherzig“ ist die geläufige und würdige deutsche Wiedergabe für Gottes erbarmende Haltung.
- source_word: ἐξελεῖται
  choice: wird sie befreien
  rationale: Das Verb bezeichnet Herausreißen oder Erretten. „Befreien“ passt zur vorhergesagten Unterwerfung unter Feinde und lässt die Art der Rettung offen.
theological_decisions:
- issue: Bedeutung von ἐν ἐσχάτοις καιροῖς
  choice: in den letzten Zeiten
  alternative: in späteren Zeiten; in der Endzeit
  rationale: Die Formulierung weist prophetisch auf eine späte künftige Zeit, ohne zwingend einen ausgearbeiteten endzeitlichen Zeitplan vorauszusetzen. Der Plural bewahrt zudem die Gestalt des griechischen Ausdrucks.
- issue: Sinn von τοῦ ἐπιστρέψαι αὐτοὺς εἰς τὴν γῆν αὐτῶν
  choice: um sie in ihr Land zurückzubringen
  alternative: und sie in ihr Land zurückzuführen; wenn er sie in ihr Land zurückbringt
  rationale: Die gedrängte Infinitivkonstruktion kann Zweck oder Ergebnis der Befreiung ausdrücken. Der Haupttext gibt sie als Zweck wieder; die Fußnote hält die koordinierende Lesart offen.
- issue: Religiöse Bedeutung von ἐπιστρέψωσι πρὸς τὸν Κύριον
  choice: zum Herrn umkehren
  alternative: zum Herrn zurückkehren
  rationale: Die Wendung umfasst sowohl Buße als auch erneuerte Hinwendung zu Gott. „Umkehren“ wahrt diese doppelte religiöse Kraft, ohne sie dogmatisch weiter zu bestimmen.
- issue: Gestalt des Namens Βελίαρ
  choice: Beliar
  alternative: Belial
  rationale: Die im griechischen Zeugen vorhandene Namensform wird bewahrt. Eine Fußnote nennt die geläufigere biblische Form, ohne beide stillschweigend gleichzusetzen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem testamentarisch-prophetischem Ton. Kurze, klare Satzglieder machen die Warnung verständlich; die Wiederholung von „aufgeben“ und „sich an … hängen“ bewahrt die Parallelstruktur des Griechischen. „Lauterkeit“, „Arglosigkeit“ und „Verschlagenheit“ sind gehoben, aber allgemein verständlich. Die Verszählung wurde zur Publikationsorientierung aufgenommen.
