  source_fidelity: 'Der Entwurf gibt die ethische Abfolge und die maßgeblichen Begriffe des griechischen Textes insgesamt zuverlässig wieder: Neid, die in Klammern überlieferte Erweiterung, Zerstreuung im Zusammenhang mit Habgier, Schlichtheit der Seele, Aufrichtigkeit des Herzens sowie die Gefahr, die Gebote als verdreht zu sehen. Die Wiedergabe von μὴ ἐπιδεχόμενος bleibt jedoch mit „lässt ... in sich ein“ semantisch und idiomatisch uneinheitlich, insbesondere bei „bösen Blicken“.'
  naturalness: Modernes Standarddeutsch und Register sind überwiegend gelungen. „Böswilliger Neid zehrt seine Seele nicht auf“ ist weniger natürlich als eine Passivform mit „von missgünstigem Neid“. „Er lässt keine bösen Blicke ... in sich ein“ klingt im Deutschen konstruiert; „gibt ... keinen Raum in sich“ gibt das bewusste Nichtannehmen idiomatisch wieder, ohne die Bildlichkeit aufzugeben.
  terminology: „Habgier“, „Schlichtheit seiner Seele“, „aufrichtigem Herzen“, „Gebote des Herrn“ und „Verirrung der Welt“ sind tragfähige, nicht konfessionell einengende Wiedergaben. „Missgünstiger Neid“ ist für βάσκανος im vorliegenden Kontext natürlicher als „böswilliger Neid“, ohne die mögliche Assoziation mit dem bösen Blick zu verdrängen; diese bleibt bei ὀφθαλμοὺς πονηρούς in der Anmerkung erhalten.
