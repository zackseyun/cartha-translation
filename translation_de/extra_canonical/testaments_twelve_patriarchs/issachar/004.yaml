  to: 5 Bei seinen Überlegungen empfindet er keinen Neid; auch wird seine Seele nicht von missgünstigem Neid aufgezehrt[a], und Habgier lenkt seinen Sinn nicht ab. 6 Vielmehr geht er in der Schlichtheit seiner Seele seinen Weg und sieht alles mit aufrichtigem Herzen. Er gibt bösen Blicken aus der Verirrung der Welt keinen Raum in sich[b], damit er die Gebote des Herrn nicht als verdreht ansieht.
