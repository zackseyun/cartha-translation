base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/004.yaml
  text: He does not envy in his deliberations[a], nor does malicious envy consume his soul, nor is there distraction in greed in his mind. But he walks in simplicity of soul; he sees everything with uprightness of heart, not accepting evil eyes from the world’s error[b], so that he may not see the commandments of the Lord as distorted.
translation:
  language: de
  text: 5 Bei seinen Überlegungen empfindet er keinen Neid; auch wird seine Seele nicht von missgünstigem Neid aufgezehrt[a], und Habgier lenkt seinen Sinn nicht ab. 6 Vielmehr geht er in der Schlichtheit seiner Seele seinen Weg und sieht alles mit aufrichtigem Herzen. Er gibt bösen Blicken aus der Verirrung der Welt keinen Raum in sich[b], damit er die Gebote des Herrn nicht als verdreht ansieht.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der mit [a] gekennzeichnete Satzteil steht in der gedruckten griechischen Textschicht in Klammern und kann eine Texterweiterung darstellen: „auch wird seine Seele nicht von missgünstigem Neid aufgezehrt“. Er wird hier als Teil des bezeugten Textes übersetzt.'
    reason: textual_variant
  - marker: b
    text: „Böse Blicke“ kann zugleich an die antike Rede vom „bösen Blick“ erinnern, also an einen feindseligen oder neidischen Blick.
    reason: lexical_alternative
lexical_decisions:
- source_word: ζηλοῖ ἐν διαβουλίοις
  choice: Bei seinen Überlegungen ist er nicht neidisch
  rationale: ζηλόω bezeichnet in diesem Lasterkatalog neidisches Begehren, während διαβούλια den Bereich innerer Erwägungen oder Überlegungen angibt.
- source_word: βάσκανος ἐκτήκει τὴν ψυχὴν αὐτοῦ
  choice: böswilliger Neid zehrt seine Seele auf
  rationale: βάσκανος trägt den Gedanken feindseligen, missgünstigen Neides; ἐκτήκει bezeichnet ein allmähliches Aufzehren oder Zermürben.
- source_word: περισπασμὸς ἐν ἀπληστείᾳ ἐν νοΐ
  choice: Habgier lenkt seinen Sinn ab
  rationale: Die knappe griechische Nominalfügung beschreibt innere Zerstreuung durch unersättliches Verlangen. Die deutsche Verbalfassung ist natürlich und bewahrt diesen Zusammenhang.
- source_word: ἁπλότητι ψυχῆς
  choice: in der Schlichtheit seiner Seele
  rationale: ἁπλότης meint ungeteilte, arglose Einfachheit. „Schlichtheit“ wahrt das Leitmotiv, ohne es auf bloße Ehrlichkeit zu verengen.
- source_word: εὐθύτητι καρδίας
  choice: mit aufrichtigem Herzen
  rationale: Die wörtliche Geradheit des Herzens bezeichnet innere Rechtschaffenheit; die gewählte Formulierung ist im Deutschen würdig und geläufig.
- source_word: μὴ ἐπιδεχόμενος ὀφθαλμοὺς πονηρούς
  choice: Er lässt keine bösen Blicke … in sich ein
  rationale: ἐπιδέχομαι bezeichnet hier das Annehmen oder Einlassen; „böse Blicke“ erhält das Augenmotiv in natürlicherem Deutsch und lässt die mögliche Anspielung auf den „bösen Blick“ offen.
- source_word: πλάνης τοῦ κόσμου
  choice: aus der Verirrung der Welt
  rationale: πλάνη kann Irrtum, Verirrung oder Täuschung bedeuten. „Verirrung“ wahrt sowohl die intellektuelle als auch die moralische Dimension.
- source_word: ἴδῃ διεστραμμένας τὰς ἐντολὰς
  choice: die Gebote … als verdreht ansieht
  rationale: Die Konstruktion betrifft die verzerrte Wahrnehmung der Gebote; „als verdreht ansieht“ erhält diese Spannung, statt den Geboten selbst tatsächlich Verkehrtheit zuzuschreiben.
theological_decisions:
- issue: Unausgesprochenes Subjekt der ethischen Sentenzen
  choice: Generisches maskulines Singularpronomen „er“
  alternative: Unpersönliche Wiedergabe mit „man“ oder direkte Anrede mit „du“
  rationale: Der griechische Text zeichnet in der dritten Person ein sprichwortartiges Bild des schlichten beziehungsweise gerechten Menschen. Das generische „er“ bewahrt diese Darstellungsweise.
- issue: Verhältnis der Weltverirrung zur Wahrnehmung der Gebote
  choice: Die bösen Blicke beeinflussen, wie der Mensch die Gebote ansieht
  alternative: Die Gebote selbst seien verdreht worden
  rationale: ἴδῃ mit prädikativem διεστραμμένας legt eine verzerrte Wahrnehmung nahe. Die Übersetzung vermeidet die theologische Vorentscheidung, die Gebote selbst seien objektiv verändert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit sprichwortartigem Rhythmus. Die abstrakten Seelen- und Herzensbegriffe bleiben erhalten; schwer verständliche griechische Nominalfügungen werden behutsam verbalisiert. Die Verszählung 5–6 wird beibehalten.
