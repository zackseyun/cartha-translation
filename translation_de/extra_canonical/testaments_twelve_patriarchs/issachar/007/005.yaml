id: T12P.ISS.7.5
reference: Testament of Issachar 7:5
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 5. ⌈Παντὶ ἀνθρώπῳ ὀδυνομένῳ συνεστέναξα καὶ πτωχῷ μετέδωκα ἄρτον¹² μου⁷. Εὐσέβειαν ἐποίησα¹⁴ ἐν πάσαις ταῖς¹⁵ ἡμέραις μου, *᾿Αλήθειαν ἐφύλαξα¹⁶.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/005.yaml
  text: I groaned together with every person in pain, and I shared my bread with the poor. I practiced godliness in all my days; I kept truth.
translation:
  language: de
  text: Mit jedem Menschen, der litt, seufzte ich mit, und mit dem Armen teilte ich mein Brot. Alle Tage meines Lebens übte ich Gottesfurcht; an der Wahrheit hielt ich fest.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ὀδυνομένῳ
  choice: der litt
  rationale: Das Partizip bezeichnet einen Menschen, der Schmerz oder Leid erfährt; die allgemeine Formulierung bewahrt die Breite des Griechischen.
- source_word: συνεστέναξα
  choice: seufzte ich mit
  rationale: Gibt die mitfühlende Mitbeteiligung des Präfixes συν- und das Seufzen von στενάζω unmittelbar wieder.
- source_word: πτωχῷ
  choice: mit dem Armen
  rationale: Die substantivische Singularform wird bewahrt; gemeint ist ein bedürftiger oder mittelloser Mensch.
- source_word: μετέδωκα
  choice: teilte ich
  rationale: Im Zusammenhang mit Brot bezeichnet das Verb das Abgeben beziehungsweise Teilen des eigenen Besitzes.
- source_word: Εὐσέβειαν ἐποίησα
  choice: übte ich Gottesfurcht
  rationale: Eine natürliche deutsche Wiedergabe für das Praktizieren von εὐσέβεια; „Gottesfurcht“ trägt hier den Sinn einer ehrfürchtigen, frommen Lebensführung.
- source_word: ᾿Αλήθειαν ἐφύλαξα
  choice: an der Wahrheit hielt ich fest
  rationale: φύλασσω bedeutet bewahren, hüten oder einhalten; die gewählte Formulierung ist idiomatisch und lässt Wahrheit als gelebte Treue und Wahrhaftigkeit offen.
theological_decisions:
- issue: Bedeutungsumfang von εὐσέβεια
  choice: Gottesfurcht
  alternative: Frömmigkeit
  rationale: „Gottesfurcht“ ist verständlich und würdevoll, ohne eine konfessionell geprägte Form von Frömmigkeit vorauszusetzen; die praktische Dimension wird durch „übte“ ausgedrückt.
- issue: Bedeutungsumfang von ἀλήθεια
  choice: Wahrheit
  alternative: Wahrhaftigkeit oder Treue
  rationale: Die formnahe Wiedergabe bewahrt die mögliche Spannung zwischen objektiver Wahrheit, persönlicher Wahrhaftigkeit und treuem Handeln, statt sie einseitig aufzulösen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Der Parallelismus der drei Selbstaussagen bleibt erkennbar; das ungewöhnliche, aber ausdrucksstarke „mitseufzen“ wird als getrennte Verbform „seufzte ... mit“ natürlich wiedergegeben.
