  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/001.yaml
  text: 'See then, as you see: I am one hundred and twenty-six years old, and I have not known any sin in me leading to death.'
translation:
  language: de
  text: '7 Seht also, wie ihr seht: Ich bin hundertsechsundzwanzig Jahre alt, und ich habe keine Sünde in mir erkannt, die zum Tod führt.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der griechische Text ist an dieser Stelle textkritisch unsicher. Wörtlich etwa: »Ich habe keine Sünde in mir erkannt zum Tod.«'
    reason: Die Crux-Zeichen der Edition und die knappe Wendung εἰς θάνατον rechtfertigen einen Hinweis, der Unsicherheit und Mehrdeutigkeit sichtbar hält.
lexical_decisions:
- source_word: Ἰδοὺ οὖν
  choice: Seht also
  rationale: Gibt den auffordernden Hinweis ἰδού und die folgernde Partikel οὖν knapp und natürlich wieder.
- source_word: ὡς ὁρᾶτε
  choice: wie ihr seht
  rationale: Bewahrt die Wiederholung des Sehens und die direkte Anrede im Plural.
- source_word: ἑκατὸν εἴκοσι καὶ ἓξ ἐτῶν ὑπάρχω
  choice: bin ich hundertsechsundzwanzig Jahre alt
  rationale: Natürliche deutsche Altersangabe bei inhaltlicher Nähe zur griechischen Formulierung.
- source_word: οὐκ ἔγνων … ἐν ἐμοὶ ἁμαρτίαν
  choice: ich habe keine Sünde in mir erkannt
  rationale: ἔγνων wird als Erkenntnisverb wiedergegeben; ἐν ἐμοί bleibt ausdrücklich als »in mir« erhalten, ohne den Text zu »begangen« umzudeuten.
- source_word: εἰς θάνατον
  choice: die zum Tod führt
  rationale: Drückt die ziel- oder folgebezogene Wendung verständlich aus, ohne die Art des Todes festzulegen.
theological_decisions:
- issue: Beziehung von εἰς θάνατον zu ἁμαρτίαν
  choice: »Sünde …, die zum Tod führt«
  alternative: »Sünde zum Tod« / »Todsünde«
  rationale: Die relationale Bedeutung wird bewahrt, während der später dogmatisch geprägte Fachausdruck »Todsünde« vermieden wird.
- issue: Textkritische Unsicherheit bei der Aussage über Sünde
  choice: Lesung des vorgelegten griechischen Haupttextes übersetzt
  alternative: Mögliche abweichende oder verderbte Überlieferung rekonstruieren
  rationale: Die editorischen Zeichen weisen auf Unsicherheit hin; ohne Variantenapparat wird keine nicht belegte Rekonstruktion in den Haupttext eingeführt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die auffällige Wiederholung »Seht … wie ihr seht« bleibt als Merkmal des Ausgangstextes erhalten; die Formulierung vermeidet zugleich konfessionell geprägte Terminologie.
