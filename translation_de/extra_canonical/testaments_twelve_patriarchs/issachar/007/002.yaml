id: T12P.ISS.7.2
reference: Testament of Issachar 7:2
language:
  code: de
  name: German
  native_name: Deutsch
  variant: modern standard German
source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 2. ⁶²Πλὴν τῆς συμβίου μου² οὐκ ἔγνων ἄλλην⁷. Οὐκ ἐπόρνευσα³ ἐν μετεωρισμῷ Γὀφθαλμῶν⁴ μου⁵.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/002.yaml
  text: Except for my wife, I have not known another. I did not commit sexual immorality with wandering eyes.
translation:
  language: de
  text: Außer meiner Frau habe ich keine andere erkannt. Ich beging keine Unzucht, indem ich meine Augen umherschweifen ließ.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich auch: „mit dem Umherschweifen meiner Augen“.'
    reason: Die Fußnote bewahrt die nominale und hinsichtlich des Verhältnisses zur Unzucht leicht offene Form der griechischen Wendung.
lexical_decisions:
- source_word: συμβίου
  choice: meiner Frau
  rationale: Das substantivierte σύμβιος bezeichnet hier die Ehefrau bzw. Lebensgefährtin; im Zusammenhang ist „Frau“ die natürliche moderne Wiedergabe.
- source_word: οὐκ ἔγνων ἄλλην
  choice: habe ich keine andere erkannt
  rationale: „Erkennen“ bewahrt den biblisch geprägten Euphemismus für geschlechtlichen Verkehr und lässt wie das Griechische das Bezugswort zu ἄλλην unausgesprochen.
- source_word: οὐκ ἐπόρνευσα
  choice: Ich beging keine Unzucht
  rationale: Das Verb πορνεύω bezeichnet unerlaubtes sexuelles Verhalten; „Unzucht begehen“ gibt die Aussage knapp und würdig wieder.
- source_word: ἐν μετεωρισμῷ ὀφθαλμῶν μου
  choice: indem ich meine Augen umherschweifen ließ
  rationale: Die Wendung beschreibt unstetes bzw. begehrliches Umherblicken. Die verbale deutsche Formulierung ist natürlich und erhält den Zusammenhang zwischen Blick und sexuellem Fehlverhalten.
theological_decisions:
- issue: Verhältnis von Blick und sexueller Verfehlung
  choice: 'instrumental/modal: „indem ich meine Augen umherschweifen ließ“'
  alternative: „mit umherschweifenden Augen“
  rationale: ἐν kann hier die Art und Weise oder den begleitenden Umstand ausdrücken. Die gewählte Fassung verbindet beides, ohne eine weitergehende Lehre über innere und vollzogene Sünde einzutragen.
- issue: Unausgesprochenes Bezugswort bei ἄλλην
  choice: „keine andere“ ohne Ergänzung
  alternative: „keine andere Frau“
  rationale: Das feminine Adjektiv erschließt zwar eine Frau als Bezug, doch das griechische Substantiv bleibt unausgesprochen. Die Übersetzung bewahrt diese Ellipse.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Erkannt“ und „Unzucht“ sind bewusst biblisch geprägt, bleiben aber verständlich; die zweite Satzhälfte wird zur natürlichen deutschen Syntax verbal gefasst.
