  source_fidelity: 'Der deutsche Text gibt den griechischen Satz vollständig und sachgerecht wieder: καὶ ταῦτα εἰπών ist treffend mit „Nachdem er dies gesagt hatte“ wiedergegeben; ἐνετείλατο mit „gebot“; ἀναγάγωσιν mit „hinaufzubringen“; κακεῖ ... θάψωσιν mit „ihn dort ... zu begraben“. „bei seinen Vätern“ entspricht μετὰ τῶν πατέρων αὐτοῦ, ohne den Begriff über Gebühr zu konkretisieren.'
  naturalness: Der Satz ist modernes, würdiges Standarddeutsch und liest sich flüssig. Die Infinitivkonstruktion nach „gebot“ ist idiomatisch; die Wiederholung von „ihn“ ist zur eindeutigen Referenz natürlich.
  terminology: „Hebron“ ist die etablierte deutsche Namensform. „seinen Vätern“ wahrt die quellentextliche, genealogisch-begräbnisbezogene Ausdrucksweise besser als eine interpretierende Umschreibung. Es gibt keine theologischen Fachbegriffe, die einer weiteren Festlegung bedürften.
