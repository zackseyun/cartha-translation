  text: 9. Καὶ ἐκτείνας τοὺς πόδας αὐτοῦ³⁷ ἐκοιμήθη ἐν γήρει καλῷ ὕπνον αἰώνιον.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/009.yaml
  text: And stretching out his feet, he fell asleep in a good old age the eternal sleep.
translation:
  language: de
  text: Und er streckte seine Füße aus und schlief in hohem Alter den ewigen Schlaf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐκτείνας τοὺς πόδας αὐτοῦ
  choice: er streckte seine Füße aus
  rationale: Gibt die körperliche Handlung unmittelbar und vollständig wieder; das Possessivpronomen wird entsprechend dem griechischen Text beibehalten.
- source_word: ἐκοιμήθη
  choice: entschlief
  rationale: Bewahrt das griechische Schlafbild als würdige, im Deutschen verständliche Umschreibung des Sterbens.
- source_word: ἐν γήρει καλῷ
  choice: in hohem Alter
  rationale: Natürliches modernes Deutsch für ein erfülltes beziehungsweise gutes Greisenalter, ohne eine im Kontext nicht näher bestimmte Wertung auszubauen.
- source_word: ὕπνον αἰώνιον
  choice: den ewigen Schlaf
  rationale: Formale und idiomatische Wiedergabe des Akkusativobjekts; das Bild des endgültigen Schlafes bleibt erhalten.
theological_decisions:
- issue: Verhältnis von Sterben und Schlaf
  choice: entschlief … den ewigen Schlaf
  alternative: starb … und schlief den ewigen Schlaf
  rationale: Die Übersetzung erhält die bewusste Wiederholung des griechischen Schlafmotivs und deutet dessen eschatologische Bedeutung nicht näher aus.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die leicht feierliche Formulierung „entschlief“ passt zur testamentarischen Sterbeszene. Keine Fußnoten erforderlich.
