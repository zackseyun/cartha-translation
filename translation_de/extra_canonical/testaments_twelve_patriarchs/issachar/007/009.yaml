  source_fidelity: 'Der Entwurf gibt die vier Sinnelemente des griechischen Textes zutreffend wieder: das Ausstrecken der eigenen Füße, das Schlafen/Entschlafen, das hohe Alter und den ewigen Schlaf. Die in der englischen Audit-Spur zwischenzeitlich enthaltene Ergänzung über gesunde Glieder und Stärke hat keine Grundlage im vorliegenden griechischen Text und wird im deutschen Entwurf zu Recht nicht übernommen. Für ἐν γήρει καλῷ ist „in hohem Alter“ eine natürliche, kontextangemessene Wiedergabe von „in gutem Alter“; die positive Nuance ist darin idiomatisch mitgetragen.'
  naturalness: „Entschlief ... den ewigen Schlaf“ verbindet ein im heutigen Deutsch gewöhnlich intransitives Verb mit einem Akkusativobjekt und wirkt dadurch grammatisch bzw. stilistisch holprig. „Schlief ... den ewigen Schlaf“ bewahrt die vom Griechischen hervorgehobene Schlafmetaphorik und die Objektkonstruktion, ist in würdigem modernem Bibeldeutsch verständlich und korrekt.
  terminology: „Ewiger Schlaf“ gibt ὕπνον αἰώνιον ohne weitergehende lehrmäßige Festlegung wieder. Die Formulierung erhält das Bild des Ausgangstextes, ohne es als Aussage über den Zustand nach dem Tod auszudeuten. Eigennamen und Fußnotenanker sind nicht betroffen; der hochgestellte Anker 37 im Editionszitat gehört offenbar zum editionsübergreifenden Apparat und kann ohne zugehörigen Fußnotentext nicht in die Übersetzung übernommen werden.
