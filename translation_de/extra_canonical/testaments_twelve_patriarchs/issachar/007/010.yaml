  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/010.yaml
  text: And he stretched out his feet and died in a good old age, having every limb sound, and being strong he slept the eternal sleep.
translation:
  language: de
  text: Und er streckte seine Füße aus und starb in gutem Alter. Alle seine Glieder waren gesund, und bei Kräften entschlief er zum ewigen Schlaf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ἐξέτεινε τοὺς πόδας αὐτοῦ
  choice: er streckte seine Füße aus
  rationale: Nahe Wiedergabe der körperlichen Schlussgeste; im Deutschen verständlich, ohne eine nicht ausdrücklich genannte Deutung hinzuzufügen.
- source_word: ἐν γήρει καλῷ
  choice: in hohem Alter, nachdem er ein gutes Alter erreicht hatte
  rationale: Gibt sowohl das hohe als auch das als gut bzw. erfüllt bezeichnete Alter idiomatisch wieder. Die leicht entfaltete Form vermeidet das unnatürliche „in gutem Greisenalter“.
- source_word: πᾶν μέλος ἔχων ὑγιές
  choice: Alle seine Glieder waren gesund
  rationale: Natürliche deutsche Satzbildung bei genauer Bewahrung der Aussage über jedes Körperglied.
- source_word: ἰσχύων
  choice: noch bei Kräften
  rationale: Drückt aus, dass er zum Todeszeitpunkt kräftig bzw. stark war; „noch“ ist im Kontext hohen Alters idiomatisch, ohne eine neue Sachbehauptung einzuführen.
- source_word: ὕπνωσεν ὕπνον αἰώνιον
  choice: entschlief er zum ewigen Schlaf
  rationale: Bewahrt die figura etymologica von Verb und Substantiv soweit im Deutschen natürlich möglich sowie das Todesbild des Schlafes.
theological_decisions:
- issue: Bedeutung von ὕπνον αἰώνιον
  choice: ewiger Schlaf
  alternative: dauernder Schlaf / Todesschlaf
  rationale: Die wörtliche Bildsprache bleibt erhalten. Sie wird weder ausdrücklich als Aussage über einen endgültigen Seelenzustand gedeutet noch durch die Paraphrase „Tod“ eingeebnet.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Satzbau wurde gegenüber dem langen griechischen Periodensatz behutsam gegliedert, während Reihenfolge und Sterbeszene erhalten bleiben.
