  text: 9b. Γβ, S¹˥ *Καὶ ἐξέτεινε τοὺς πόδας αὐτοῦ καὶ³⁸ ἀπέθανε³⁹ ἐν γήρει καλῷ, πᾶν μέλος ἔχων ὑγιές⁴⁰, καὶ ἰσχύων ὕπνωσεν ὕπνον αἰώνιον⁴¹.
