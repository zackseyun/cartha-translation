lexical_decisions:
- source_word: δόλος
  choice: Betrug
  rationale: Gibt die Bedeutung von Täuschung oder Arglist in natürlichem, allgemein verständlichem Deutsch wieder.
- source_word: οὐκ ἐγένετο ἐν τῇ καρδίᾳ μου
  choice: entstand nicht in meinem Herzen
  rationale: Bewahrt das Bild des Entstehens im Herzen und gibt ἐγένετο idiomatisch wieder.
- source_word: ψεῦδος
  choice: Lüge
  rationale: Die direkte und natürliche Entsprechung für eine unwahre Äußerung.
- source_word: οὐκ ἀνῆλθε διὰ τῶν χειλέων μου
  choice: kam nicht über meine Lippen
  rationale: Die geläufige deutsche Wendung bewahrt sowohl die Bewegungsvorstellung des griechischen Verbs als auch das Bild der Lippen.
