  terminology: „Beliar“, „über euch herrschen“, „jedes wilde Tier bezwingen“ und „Gott des Himmels und der Erde“ sind angemessen. Die Schlusswendung sollte ohne Festlegung auf die Herzenshaltung der Menschen wiedergegeben werden, da ihre syntaktische Reichweite nicht abschließend gesichert ist.
