base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/007.yaml
  text: You also, my children, do these things, and every spirit of Beliar will flee from you, and every deed of wicked people will not rule over you; and you will subdue every wild beast, having with you the God of heaven and earth, who goes with people in simplicity of heart.
translation:
  language: de
  text: Tut auch ihr dies, meine Kinder, und jeder Geist Beliars wird von euch fliehen, und keine Tat böser Menschen wird über euch herrschen. Ihr werdet jedes wilde Tier bezwingen, während ihr den Gott des Himmels und der Erde bei euch habt, der mit den Menschen in Aufrichtigkeit des Herzens geht.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „in Einfachheit des Herzens“. Die griechische Wendung kann die Art des Mitgehens beschreiben oder sich auf die Menschen beziehen; der Bezug ist nicht völlig eindeutig.'
    reason: Bewahrt die syntaktische Mehrdeutigkeit von ἐν ἁπλότητι καρδίας, ohne den Wortlaut der Fußnote durch eine umgestellte Gesamtübersetzung unnötig zu verkomplizieren.
lexical_decisions:
- source_word: Ταῦτα ... ποιεῖτε
  choice: Tut ... dies
  rationale: Gibt den direkten Imperativ knapp und natürlich wieder; der Rückbezug auf das zuvor Gesagte bleibt erhalten.
- source_word: πᾶν πνεῦμα τοῦ Βελίαρ
  choice: jeder Geist Beliars
  rationale: Bewahrt die distributive Aussage von πᾶν und den Eigennamen Βελίαρ in der geläufigen deutschen Form.
- source_word: πᾶσα πρᾶξις πονηρῶν ἀνθρώπων οὐ κυριεύσει ὑμῶν
  choice: keine Tat böser Menschen wird über euch herrschen
  rationale: Natürliches Deutsch für die griechische Konstruktion »jede ... nicht«; κυριεύειν wird mit dem kräftigen Herrschaftsbegriff »herrschen über« wiedergegeben.
- source_word: πᾶν ἄγριον θηρίον καταδουλώσετε
  choice: Ihr werdet jedes wilde Tier bezwingen
  rationale: καταδουλόω bezeichnet Unterwerfung beziehungsweise Versklavung; bei Tieren vermittelt »bezwingen« die gemeinte Überwältigung idiomatisch, ohne unnötig das Bild menschlicher Sklaverei einzutragen.
- source_word: ἔχοντες μεθ᾽ ὑμῶν
  choice: denn ... ist bei euch
  rationale: Entfaltet das griechische Partizip als begründenden Begleitumstand in flüssigem Deutsch.
- source_word: συμπορευόμενον
  choice: geht mit
  rationale: Bewahrt den Gedanken des gemeinsamen Unterwegsseins genauer als ein bloßes »begleitet«.
- source_word: ἐν ἁπλότητι καρδίας
  choice: die ein aufrichtiges Herz haben
  rationale: ἁπλότης καρδίας meint ungeteilte Lauterkeit beziehungsweise Aufrichtigkeit des Herzens; die personenbezogene Formulierung ist im Deutschen verständlich und würdig.
theological_decisions:
- issue: Bezug von ἐν ἁπλότητι καρδίας
  choice: 'auf die Menschen bezogen: »mit den Menschen, die ein aufrichtiges Herz haben«'
  alternative: 'modal auf Gottes Mitgehen bezogen: »der in Einfalt/Aufrichtigkeit des Herzens mit den Menschen geht«'
  rationale: Die Schlusswendung ist syntaktisch nicht völlig eindeutig. Inhaltlich liegt der Bezug auf die Herzenshaltung der Menschen näher; die alternative Zuordnung wird in einer Fußnote offengehalten.
- issue: Aussage über böse Taten
  choice: »keine Tat böser Menschen wird über euch herrschen«
  alternative: 'formal näher: »jede Tat böser Menschen wird nicht über euch herrschen«'
  rationale: Die deutsche Negativform gibt den Umfang von πᾶσα ... οὐ idiomatisch wieder, ohne die umfassende Verneinung abzuschwächen.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem paränetischem Ton. Kurze Hauptsätze strukturieren die lange griechische Satzperiode; traditionelle, aber verständliche Begriffe wie »Beliar« und »Herz« bleiben erhalten.
