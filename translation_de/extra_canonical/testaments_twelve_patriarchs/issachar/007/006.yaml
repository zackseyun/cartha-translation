source:
  edition: Charles 1908 Greek Versions (pages 176-187, Issachar pilot)
  text: 6. Τὸν Κύριον ἠγάπησα¹⁷ καὶ πάντα ἄνθρωπον ἐξ ὅλης τῆς καρδίας¹⁸ μου *ὑπὲρ τὰ²¹ τέκνα μου.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/006.yaml
  text: I loved the Lord and every person with all my heart, more than my children.
translation:
  language: de
  text: Ich liebte den Herrn und jeden Menschen von ganzem Herzen, mehr als meine Kinder.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Τὸν Κύριον ἠγάπησα
  choice: Ich liebte den Herrn
  rationale: Gibt Objekt, Verb und Vergangenheitsaspekt des griechischen Satzes unmittelbar und in natürlichem Deutsch wieder.
- source_word: πάντα ἄνθρωπον
  choice: jeden Menschen
  rationale: Die distributive Bedeutung von πᾶς mit dem singularischen ἄνθρωπον wird präzise und inklusiv wiedergegeben.
- source_word: ἐξ ὅλης τῆς καρδίας μου
  choice: von ganzem Herzen
  rationale: Entspricht der griechischen Wendung idiomatisch, ohne ihre Aussage umfassender Hingabe abzuschwächen.
- source_word: ὑπὲρ τὰ τέκνα μου
  choice: mehr als meine Kinder
  rationale: ὑπέρ mit Akkusativ bezeichnet hier einen Vergleich; τέκνα ist neutral und wird im Deutschen natürlich mit „Kinder“ wiedergegeben.
theological_decisions:
- issue: Vorrang der Liebe zum Herrn und zu jedem Menschen gegenüber den eigenen Kindern
  choice: mehr als meine Kinder
  alternative: über meine Kinder hinaus
  rationale: Der Akkusativ nach ὑπέρ stützt die komparative Lesart. Die auffällige Spannung der Aussage bleibt bestehen und wird nicht erklärend abgeschwächt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; knapper autobiografischer Aussagesatz. Die koordinierte Liebe zum Herrn und zu jedem Menschen sowie der provozierende Vergleich mit den eigenen Kindern bleiben unverändert erhalten.
