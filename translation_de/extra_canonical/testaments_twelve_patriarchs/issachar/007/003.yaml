  terminology: „begehrte“ und „meinem Nächsten“ sind passend und bewahren den ethisch-schriftsprachlichen Klang von ἐπιθυμέω und πλησίος. „Irreführung“ gibt ἀποπλάνησις weiter, ohne festzulegen, ob die Irreführung die sprechende Person oder andere betrifft.
