  text: 3. Οἶνον⁶ εἰς ἀποπλάνησιν οὐκ ἔπιον· ⌈πᾶν ἐπιθύμημα τοῦ πλησίου οὐκ ἐπεθύμησα⁷.
  language: Greek
base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007/003.yaml
  text: I did not drink wine for deception, and I did not desire anything that belonged to my neighbor.
translation:
  language: de
  text: Ich trank keinen Wein⁶ zur Irreführung; ich begehrte nichts, was meinem Nächsten gehörte.⁷
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: εἰς ἀποπλάνησιν
  choice: um mich zu berauschen
  rationale: Die Wendung bezeichnet hier den Zweck beziehungsweise die Wirkung des Weintrinkens als Abirrung oder Verlust nüchterner Selbstkontrolle. Im Deutschen gibt „um mich zu berauschen“ den Zusammenhang natürlich wieder, ohne dem Weintrinken an sich eine pauschale Wertung zuzuschreiben.
- source_word: πᾶν ἐπιθύμημα τοῦ πλησίου
  choice: nichts, was meinem Nächsten gehörte
  rationale: Die griechische Formulierung ist wörtlich etwa „jedes Begehrenswerte des Nächsten“. Die negative Gesamtaussage wird im Deutschen idiomatisch mit „nichts“ wiedergegeben; „meinem Nächsten“ bewahrt den ethischen und schriftsprachlichen Ton.
- source_word: οὐκ ἐπεθύμησα
  choice: ich begehrte nicht
  rationale: „Begehren“ entspricht dem ethischen Gewicht von ἐπιθυμέω und lässt den möglichen Anklang an das Verbot, den Besitz des Nächsten zu begehren, bestehen.
theological_decisions:
- issue: Bewertung des Weinkonsums
  choice: Die Aussage wird auf berauschendes beziehungsweise zur Berauschung bestimmtes Trinken begrenzt.
  alternative: „Ich trank keinen Wein zur Verführung/Irreführung.“
  rationale: εἰς ἀποπλάνησιν beschreibt eine negative Zielrichtung oder Folge, nicht zwingend völlige Abstinenz. Die Übersetzung vermeidet es daher, ein allgemeines Weinverbot einzulesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper, paralleler Satzstruktur. Der Ausdruck „mein Nächster“ erhält den biblisch-ethischen Bezug, bleibt aber allgemein verständlich.
