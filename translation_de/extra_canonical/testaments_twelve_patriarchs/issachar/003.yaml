  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/003.yaml
  text: 'For if Leah my mother had not given up marital union in exchange for the two apples[a], she would still have been destined to bear eight sons. Therefore she bore six, and Rachel bore the two, because through the mandrakes the Lord visited her. For he saw that Leah desired to be with Jacob for the sake of children, and not for the sake of pleasure. For on the next day also she again gave Jacob over. Therefore through the mandrakes the Lord listened to Rachel. For although she longed for these, she did not eat them, but dedicated them in the house of the Lord, after bringing them to the priest.


    When therefore I grew to manhood, my children, I walked in uprightness of heart, and I became a farmer for my father and for my brothers. And my father blessed me, seeing that I walked before him in simplicity. And I was not meddlesome in my actions, nor envious and malicious toward my neighbor. I never slandered anyone, nor did I criticize a man''s way of life. At thirty-five years of age I took a wife for myself, for my labor consumed my strength, and I did not think about a woman''s pleasure; rather, because of my toil, sleep came over me. And my father always rejoiced in my simplicity, because I offered every firstborn through the priest to the Lord, and then also to my father. And the Lord multiplied my good things ten thousandfold[d][c][b], and my father likewise increased the good things for me twofold.'
translation:
  language: de
  text: '**Testament Issachars 3**


    **1** Als ich nun erwachsen war, meine Kinder, ging ich mit aufrichtigem Herzen meinen Weg. Ich wurde Landarbeiter für meinen Vater und meine Brüder und brachte die Erträge der Felder jeweils zu ihrer Zeit ein. **2** Mein Vater segnete mich, denn er sah, dass ich in Lauterkeit vor ihm lebte. **3** Bei meinen Tätigkeiten mischte ich mich nicht in fremde Angelegenheiten ein; auch war ich meinem Nächsten gegenüber weder neidisch noch missgünstig.[a] **4** Niemals redete ich verleumderisch über jemanden oder tadelte die Lebensführung eines Menschen.


    **5** Mit fünfunddreißig Jahren nahm ich mir eine Frau; denn die Arbeit zehrte meine Kraft auf, und ich dachte nicht an die Lust mit einer Frau. Vielmehr überkam mich wegen der Mühe der Schlaf. **6** Mein Vater freute sich stets über meine Lauterkeit, denn alles Erstgeborene[b] brachte ich durch den Priester dem Herrn dar und danach auch meinem Vater. **7** Der Herr vervielfachte die Güter in meinen Händen zehntausendfach. Auch mein Vater Jakob wusste, dass Gott mit meiner Lauterkeit zusammenwirkte.[c]


    [a] Das griechische *baskanos* kann auch »mit bösem Blick« oder »von gehässiger Missgunst erfüllt« bedeuten.


    [b] »Alles Erstgeborene« kann hier weiter gefasst sein und den ersten Ertrag beziehungsweise die Erstlinge einschließen, nicht nur den ersten Nachwuchs von Tieren.


    [c] Der überlieferte griechische Wortlaut lautet wörtlich, dass Gott »mit meiner Lauterkeit zusammenwirkt«. Die ungewöhnliche Formulierung wird im Haupttext bewusst beibehalten.'
  philosophy: optimal-equivalence
