lexical_decisions:
- source_word: ηδρύνθην
  choice: erwachsen war
  rationale: Das Verb bezeichnet hier das Heranwachsen beziehungsweise Erreichen der Reife; »erwachsen war« ist im testamentarischen Rückblick natürlich und klar.
- source_word: εὐθύτητι καρδίας
  choice: mit aufrichtigem Herzen
  rationale: Die Wendung bezeichnet innere Geradheit und Rechtschaffenheit. »Mit aufrichtigem Herzen« bewahrt den Herzensbezug in natürlichem Deutsch.
- source_word: γεωργός
  choice: Landarbeiter
  rationale: Der Kontext beschreibt Issachars landwirtschaftliche Arbeit für Vater und Brüder. »Landarbeiter« vermeidet die moderne Implikation eines selbstständigen Hofbesitzers, die »Landwirt« nahelegen könnte.
- source_word: ἁπλότης
  choice: Lauterkeit
  rationale: Das Leitwort meint ungeteilte, arglose Aufrichtigkeit. »Lauterkeit« wahrt den ethischen Gehalt besser als das im Deutschen leicht missverständliche »Einfachheit« und wird konsequent verwendet.
- source_word: περίεργος
  choice: mischte ich mich nicht in fremde Angelegenheiten ein
  rationale: Gemeint ist nicht bloße Neugier, sondern ungehöriges Einmischen in Dinge außerhalb des eigenen Aufgabenbereichs.
- source_word: φθονερὸς καὶ βάσκανος
  choice: neidisch noch missgünstig
  rationale: Die beiden verwandten Laster werden unterscheidbar wiedergegeben; bei *baskanos* bleibt die mögliche Nuance des bösen Blicks in der Fußnote sichtbar.
- source_word: κατελάλησα
  choice: redete ich verleumderisch über
  rationale: Das Verb bezeichnet feindseliges oder herabsetzendes Reden gegen jemanden. Die Formulierung ist verständlich, ohne zwingend eine juristisch nachweisbare Verleumdung vorauszusetzen.
- source_word: ἔψεξα βίον ἀνθρώπου
  choice: verurteilte die Lebensführung eines Menschen
  rationale: '*ψέγω* bedeutet tadeln oder bemängeln, während *βίος* hier die Lebensweise meint. »Verurteilte« gibt die moralische Missbilligung würdig und flüssig wieder.'
- source_word: ἡδονὴν γυναικός
  choice: die Lust mit einer Frau
  rationale: Der Genitiv ist mehrdeutig. Diese Wiedergabe bezeichnet sexuelle Lust, ohne eindeutig festzulegen, ob primär die Lust an einer Frau oder die Lust einer Frau gemeint ist.
- source_word: πᾶν πρῶτον γέννημα
  choice: alles Erstgeborene
  rationale: Die formale Bedeutung wird im Haupttext bewahrt; eine Fußnote weist darauf hin, dass auch erste Erträge oder Erstlinge gemeint sein können.
- source_word: ἐμυριοπλασίασε
  choice: vervielfachte … zehntausendfach
  rationale: Die ungewöhnlich starke, möglicherweise rhetorische Zahl des griechischen Verbs bleibt ausdrücklich erhalten.
- source_word: συνεργεῖ τῇ ἁπλότητί μου
  choice: meiner Lauterkeit beistand
  rationale: Wörtlich wirkt Gott mit Issachars Lauterkeit zusammen. »Beistand« ist idiomatisch und lässt Gottes förderndes Wirken erkennen; die wörtlichere Struktur wird in der Fußnote dokumentiert.
theological_decisions:
- issue: ἁπλότης als zentrale Tugend Issachars
  choice: Konsequent mit »Lauterkeit« wiedergeben
  alternative: »Einfachheit«, »Einfalt«, »Aufrichtigkeit« oder »ungeteilte Hingabe«
  rationale: Das Deutsche »Einfachheit« kann intellektuelle Beschränktheit oder Schlichtheit bezeichnen. »Lauterkeit« vermittelt dagegen die arglose, ungeteilte moralische Haltung des Kontextes, ohne eine konfessionelle Deutung einzutragen.
- issue: Darbringung durch den Priester in patriarchalischer Zeit
  choice: Die kultische Aussage unverändert im Haupttext bewahren
  alternative: Die Priesterangabe harmonisierend abschwächen oder auslassen
  rationale: Der griechische Text nennt ausdrücklich den Priester und den Herrn. Eine mögliche Spannung zur Genesisdarstellung darf nicht stillschweigend beseitigt werden.
- issue: Gottes Zusammenwirken mit Issachars Lauterkeit
  choice: Als Gottes Beistand für seine Lauterkeit wiedergeben und den wörtlichen Ausdruck anmerken
  alternative: »Gott wirkte mit meiner Lauterkeit zusammen«
  rationale: Die idiomatische Übersetzung vermeidet eine unnötige Personifizierung der Tugend, während die Fußnote die theologisch ungewöhnliche Formulierung des Ausgangstextes transparent erhält.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut verständlichem testamentarischem Ton. Kurze Satzglieder bewahren den paränetischen Rhythmus. Das wiederkehrende ἁπλότης wird konsequent als »Lauterkeit« wiedergegeben. Übersetzt wurde ausschließlich der für Kapitel 3 bereitgestellte griechische Ausgangstext; zusätzliches Material der englischen Konsultationsschicht, das im griechischen Abschnitt nicht enthalten ist, wurde nicht übernommen.
