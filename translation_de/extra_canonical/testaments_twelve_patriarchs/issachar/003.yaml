  - severity: low
    issue: 'V. 4: „verurteilte die Lebensführung“'
    rationale: ἔψεξα bedeutet primär „tadeln, bemängeln“. „Verurteilen“ ist stärker und kann ein endgültiges moralisches Urteil nahelegen.
