  naturalness: 'Das Deutsch ist überwiegend modernes, würdiges Standarddeutsch. „Seht also: Wie ihr seht“ ist jedoch unnötig holprig; „Seht nun selbst“ gibt die einleitende Bekräftigung idiomatisch wieder. Die Anpassungen in Vers 1 und 6 machen die Aussage flüssiger, ohne ihren testamentarischen Ton zu verlieren.'
