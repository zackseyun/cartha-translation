base_translation:
  language: en
  yaml_path: translation/extra_canonical/testaments_twelve_patriarchs/issachar/007.yaml
  text: '1[a]. See then, as you see: I am one hundred and twenty-six years old, and I am not conscious of committing any sin unto death. 2. Except for my wife, I have not known another woman. I did not commit sexual immorality with wandering eyes. 3. I did not drink wine for deception[b], and I did not desire anything of my neighbor. 4. No deceit came to be in my heart, and no lie went up through my lips. 5. I groaned together with every person in pain, and I shared my bread with the poor. I practiced godliness in all my days; I kept truth. 6. I loved the Lord with all my strength, and likewise I loved every person with all my heart, more than my children. 7. You also, my children, do these things, and every spirit of Beliar will flee from you, and no deed of wicked people will rule over you; and you will subdue every wild beast, having with you the God of heaven and earth, who walks with people in simplicity of heart. 8. And after saying these things he commanded his sons to carry him up
    to Hebron and bury him there with his fathers in the cave. 9. And stretching out his feet, he fell asleep in a good old age, sound in every limb and strong[d][c], and slept the eternal sleep.'
translation:
  language: de
  text: '**Testament Issachars 7**


    **1** Seht nun selbst: Ich bin hundertsechsundzwanzig Jahre alt, und ich bin mir keiner Sünde zum Tod bewusst, die ich begangen habe.[a] **2** Außer meiner Frau habe ich keine andere Frau erkannt. Ich beging keine Unzucht mit umherschweifenden Blicken. **3** Ich trank keinen Wein zur Irreführung,[b] und ich begehrte nichts, was meinem Nächsten gehörte. **4** Kein Trug entstand in meinem Herzen, und keine Lüge kam über meine Lippen. **5** Mit jedem Menschen, der Schmerzen litt, seufzte ich, und mit dem Armen teilte ich mein Brot. Alle meine Tage übte ich Gottesfurcht und hielt an der Wahrheit fest. **6** Den Herrn liebte ich, und jeden Menschen liebte ich von ganzem Herzen, mehr als meine Kinder. **7** Tut auch ihr dies, meine Kinder. Dann wird jeder Geist Beliars[c] von euch fliehen, und kein Tun böser Menschen wird über euch herrschen. Ihr werdet jedes wilde Tier unterwerfen, weil ihr den Gott des Himmels und der Erde bei euch habt, der mit Menschen in Aufrichtigkeit des Herzens unterwegs
    ist.[d] **8** Nachdem er dies gesagt hatte, wies er seine Söhne an, ihn nach Hebron hinaufzubringen und ihn dort bei seinen Vätern zu begraben.[e] **9** Dann streckte er seine Füße aus und entschlief in gutem Alter den ewigen Schlaf.[f]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „Ich habe in mir keine Sünde zum Tod erkannt.“ Das griechische „erkennen“ bezeichnet hier moralische Selbstprüfung; „zum Tod“ bleibt absichtlich ohne spätere dogmatische Festlegung.'
    reason: lexical_alternative
  - marker: b
    text: 'Die griechische Wendung kann auch bedeuten: „Ich trank keinen Wein, um in die Irre zu führen“ oder „… zum Abirren“; möglicherweise ist ein durch Wein verursachtes Sich-Verirren oder Sich-Täuschen gemeint.'
    reason: lexical_ambiguity
  - marker: c
    text: „Beliar“ gibt die griechische Namensform wieder; in anderen Überlieferungen erscheint der Name als „Belial“.
    reason: alternative_reading
  - marker: d
    text: Die Wendung kann auch so verstanden werden, dass Gott diejenigen begleitet, die mit ungeteiltem oder aufrichtigem Herzen leben. Grammatisch bezieht sich „der … unterwegs ist“ am ehesten auf Gott.
    reason: syntactic_ambiguity
  - marker: e
    text: Der hier zugrunde gelegte griechische Text nennt die Bestattung bei seinen Vätern, aber keine Höhle. Andere Textformen beziehungsweise Überlieferungen ergänzen eine Höhle.
    reason: textual_variant
  - marker: f
    text: 'Textformen des Schlussverses unterscheiden sich: Einige sprechen vom Sterben in gutem Alter oder erweitern den Satz um die Aussage, Issachar sei an allen Gliedern gesund und kräftig gewesen. Der hier übersetzte griechische Text lautet knapp, dass er in gutem Alter den ewigen Schlaf entschlief.'
    reason: textual_variant
lexical_decisions:
- source_word: ἔγνων ἐν ἐμοὶ ἁμαρτίαν εἰς θάνατον
  choice: ich weiß von keiner Sünde zum Tod, die ich begangen hätte
  rationale: Die Formulierung gibt die selbstprüfende Aussage mit ἔγνων wieder, bewahrt die Qualifikation εἰς θάνατον und vermeidet sowohl die Behauptung völliger Sündlosigkeit als auch den später dogmatisch geprägten Ausdruck „Todsünde“.
- source_word: τῆς συμβίου μου ... οὐκ ἔγνων ἄλλην
  choice: Außer meiner Frau habe ich keine andere Frau erkannt
  rationale: „Erkennen“ bewahrt den idiomatischen sexuellen Sinn von γινώσκω und den würdevoll-biblischen Ton; die Wiederholung von „Frau“ macht den Sinn im Deutschen eindeutig.
- source_word: ἐπόρνευσα ἐν μετεωρισμῷ ὀφθαλμῶν μου
  choice: Ich beging keine Unzucht mit umherschweifenden Blicken
  rationale: „Unzucht“ bezeichnet hier unerlaubtes sexuelles Verhalten; „umherschweifende Blicke“ gibt die ruhelose, begehrliche Blickrichtung der griechischen Wendung anschaulich wieder.
- source_word: οἶνον εἰς ἀποπλάνησιν
  choice: Wein, um mich in die Irre führen zu lassen
  rationale: ἀποπλάνησις bezeichnet Irreführung oder Abirrung. Die Wiedergabe bleibt verständlich, ohne die Aussage ausschließlich auf Trunkenheit oder Ausschweifung einzuengen.
- source_word: πᾶν ἐπιθύμημα τοῦ πλησίου
  choice: nichts, was meinem Nächsten gehörte
  rationale: Die Wendung steht im Bedeutungsfeld des Begehrens fremden Eigentums. Die natürliche deutsche Formulierung bewahrt den Anklang an das Verbot des Begehrens.
- source_word: συνεστέναξα
  choice: seufzte ich mit
  rationale: Das zusammengesetzte Verb bezeichnet ein körperlich und emotional geteiltes Leiden und ist stärker als bloßes Mitgefühl.
- source_word: Εὐσέβειαν ἐποίησα
  choice: übte ich Gottesfurcht
  rationale: εὐσέβεια meint ehrfürchtige, praktisch gelebte Frömmigkeit. „Gottesfurcht üben“ ist würdevoll und handlungsbezogen, ohne konfessionelle Sonderbegriffe.
- source_word: Ἀλήθειαν ἐφύλαξα
  choice: hielt an der Wahrheit fest
  rationale: Die Wendung wahrt den Gedanken des Bewahrens und der Treue, klingt im heutigen Deutsch aber natürlicher als „ich bewahrte Wahrheit“.
- source_word: πᾶσα πρᾶξις πονηρῶν ἀνθρώπων οὐ κυριεύσει ὑμῶν
  choice: kein Tun böser Menschen wird über euch herrschen
  rationale: Die abstrakte Aussage des Griechischen wird eng wiedergegeben; weder die Menschen selbst noch lediglich einzelne Versuchungen werden zum Subjekt gemacht.
- source_word: καταδουλώσετε
  choice: ihr werdet ... unterwerfen
  rationale: Das Verb ist stärker als „bezwingen“ und bezeichnet das Untertanmachen; „unterwerfen“ ist im Kontext wilder Tiere idiomatisch und nicht unnötig brutal.
- source_word: ἐκοιμήθη ἐν γήρει καλῷ ὕπνον αἰώνιον
  choice: entschlief in gutem Alter den ewigen Schlaf
  rationale: Die Schlafmetapher und die feierliche Schlussformel des griechischen Textes werden erhalten, ohne textlich abweichende Erweiterungen in den Haupttext aufzunehmen.
theological_decisions:
- issue: Reichweite von Issachars Aussage über Sünde
  choice: Eine selbstprüfende Aussage über keine begangene „Sünde zum Tod“
  alternative: Eine uneingeschränkte Behauptung völliger Sündlosigkeit oder die dogmatische Kategorie „Todsünde“
  rationale: ἔγνων ist als moralische Selbsterkenntnis formuliert, während εἰς θάνατον die Aussage ausdrücklich qualifiziert. Die Übersetzung lässt die theologische Spannung stehen.
- issue: Bezug von συμπορευόμενον in Vers 7
  choice: Das Partizip beschreibt den Gott des Himmels und der Erde als den, der mit Menschen unterwegs ist
  alternative: Das Partizip beschreibt primär die Menschen als solche, die mit Gott wandeln
  rationale: Kasus und nächster grammatischer Bezug sprechen für Gott als Bezugswort. Die Zuordnung von „in Aufrichtigkeit des Herzens“ bleibt jedoch semantisch offen und wird in einer Fußnote erläutert.
- issue: Verheißung über wilde Tiere
  choice: Die Aussage wird als direkte Folge der Gegenwart Gottes stehen gelassen
  alternative: Die wilden Tiere allegorisch als Laster, Dämonen oder feindliche Menschen auslegen
  rationale: Der Text nennt ausdrücklich wilde Tiere. Eine allegorische Deutung wäre interpretative Erweiterung und gehört nicht in die Übersetzung.
- issue: Todesschlaf in Vers 9
  choice: Die Metapher „ewiger Schlaf“ wird ohne dogmatische Erklärung wiedergegeben
  alternative: Die Wendung als Aussage über Bewusstlosigkeit nach dem Tod oder als endgültige Vernichtung auslegen
  rationale: Die Wendung ist eine feierliche Todesmetapher; der Text entfaltet hier keine Lehre über den Zwischenzustand.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit leicht testamentarisch-biblischem Ton. Parataktische Satzführung und konkrete Bilder des griechischen Textes bleiben erhalten. Archaismen werden weitgehend vermieden; „erkannte“ in Vers 2 und „entschlief“ in Vers 9 bleiben wegen ihrer idiomatischen beziehungsweise feierlichen Funktion stehen. Sämtliche Fußnotenmarker erscheinen im Haupttext.
