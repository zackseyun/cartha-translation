  terminology: „Hades“, „der Vollendete“, „Mutter“, „die Wahrheit“ und „der Ort“ sind konsistent und ohne konfessionelle Überbestimmung wiedergegeben. „Mild“ für ⲟⲩϩⲗⲟϭ ist als kontextuelle Übersetzung vertretbar; die Fußnote erhält die wörtlichere Möglichkeit „süß/angenehm“.
