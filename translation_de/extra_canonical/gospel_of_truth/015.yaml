  - severity: medium
    issue: „auch gibt es dort weder Neid …“
    rationale: „Dort“ verweist im Deutschen auf den unmittelbar zuvor genannten Hades. Der koptische Text verneint Neid bei/unter denjenigen, die in dem Ruhenden ruhen, nicht im Hades.
  - severity: low
    issue: „…, damit ihre Seele keinen Schaden nimmt“
    rationale: Der Text reiht die Aussage über das Nicht-Erleiden eines Verlustes an der Seele an; er bezeichnet sie nicht ausdrücklich als Zweck oder Folge der Zuwendung zu den Dingen.
