revisions:
- from: 'Doch diese werden nicht auf diese Weise offenbar.[a]


    Denn sie haben sich weder selbst erhöht noch die Herrlichkeit des Vaters geschmälert. Sie hielten ihn weder für gering noch für hart noch für zornig. Vielmehr ist er ohne Böses, frei von Unruhe und mild.[b] Er kennt alle Räume, bevor sie entstehen, und er braucht von niemandem belehrt zu werden.


    So ist es bei denen, die etwas von der unermesslichen Größe droben besitzen. Sie warten allein auf den Vollendeten, der ihnen Mutter ist.[c] Sie steigen nicht in den Hades hinab; auch gibt es dort weder Neid noch Seufzen noch Tod in ihnen. Vielmehr ruhen sie in dem, der ruht. Sie mühen sich nicht ab und winden sich nicht bei der Suche nach der Wahrheit. Sie selbst sind vielmehr die Wahrheit. Der Vater ist in ihnen, und sie sind im Vater. Sie sind vollendet und ungeteilt mit dem wahrhaft Guten verbunden. Es fehlt ihnen an nichts; vielmehr ruhen sie, erquickt im Geist. Sie werden auf ihre Wurzel hören und sich dem zuwenden, worin sie ihre Wurzel finden werden,[d] damit ihre Seele keinen Schaden nimmt. Dies ist der Ort der Seligen; dies ist ihr Ort.'
