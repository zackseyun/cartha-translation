  consult_excerpt: 'Each one will speak about the place from which they came, and they’ll hurry to return again to the place where they received their restoration to receive from the place where they were, receiving a taste from that place and receiving nourishment, receiving growth.

    And their place of rest is their fullness. All that have emanated from the Father, then, are fullnesses, and the roots of all that have emanated from him are within the one who caused them all to grow. He gave them their destinies. Then each one was revealed, so that through their own thought […] for the place to which they send their thought is their root, which takes them up through all the heights, up to the Father. They embrace his head, which is rest for them, and they’re grasped, approaching him, as though to say that they receive his expression by means of kisses. But they’re not revealed 42 in this way, because they neither exalted themselves, nor wanted the Father’s glory, nor did they think of him as trivial or harsh or wrathful; but he’s without evil, unperturbed, and sweet. He knows every realm before they’ve come into existence, and he has no need to be instructed.

    This is the way of those who possess something of the immeasurable greatness from above, as they wait for the complete one alone, who’s a Mother for them. And they don’t go down to Hades, nor do they have envy or groaning, nor death within them, but they rest in the one who rests, not striving nor twisting around in the search for Truth. But they themselves are the Truth, and the Father is within them, and they’re in the Father, being complete. They’re undivided from the truly good one. They don’t need anything, but they rest, refreshed in the Spirit. And they’ll listen to their root. They’ll devote themselves to those things that they’ll find in their root and not suffer loss to their soul. This is the place of the blessed; this is their place.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/015.yaml
  text: 'But these are not revealed in this way[a].


    For they neither exalted themselves, nor did they diminish the Father’s glory, nor did they reckon him as small, nor as harsh, nor as wrathful; rather, he is without evil, unperturbed, and sweet. He knows everything before it comes to be, and he has no need to be instructed by anyone.


    This is the way of those who possess something of the immeasurable Greatness from above, as they await the Complete One alone, who is a Mother for them. And they do not go down to Hades, nor is there envy among them, nor groaning, nor death within them; rather, they rest in the One who rests—neither striving nor writhing in the search for the Truth. Instead, they themselves are the Truth, and the Father is within them, and they are in the Father, being complete, undivided from the truly Good One. They are not in want of anything, but they rest, refreshed in the Spirit. And they will listen to their root; they will devote themselves to the things in which they will find their root, and they will not suffer loss to their soul[c][b]. This is the place of the blessed—this is their place.'
translation:
  language: de
  text: 'Doch diese werden nicht auf diese Weise offenbar.[a]


    Denn sie haben sich weder selbst erhöht noch die Herrlichkeit des Vaters geschmälert. Sie hielten ihn weder für gering noch für hart noch für zornig. Vielmehr ist er ohne Böses, frei von Unruhe und mild.[b] Er kennt alles, bevor es entsteht, und er braucht von niemandem belehrt zu werden.


    So ist es bei denen, die etwas von der unermesslichen Größe droben besitzen. Sie warten allein auf den Vollendeten, der ihnen Mutter ist.[c] Sie steigen nicht in den Hades hinab; unter ihnen gibt es weder Neid noch Seufzen noch Tod. Vielmehr ruhen sie in dem, der ruht. Sie mühen sich nicht ab und winden sich nicht bei der Suche nach der Wahrheit. Sie selbst sind vielmehr die Wahrheit. Der Vater ist in ihnen, und sie sind im Vater. Sie sind vollendet und vom wahrhaft Guten ungetrennt. Es fehlt ihnen an nichts; vielmehr ruhen sie, erquickt im Geist. Sie werden auf ihre Wurzel hören und sich dem zuwenden, worin sie ihre Wurzel finden werden,[d] und werden keinen Verlust an ihrer Seele erleiden. Dies ist der Ort der Seligen; dies ist ihr Ort.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Satz beginnt im koptischen Manuskript als Fortsetzung des vorausgehenden Zusammenhangs.
    reason: Die überlieferte Seite setzt mitten in einer Konstruktion ein; die Anmerkung macht die Textgrenze sichtbar, ohne den fehlenden Zusammenhang zu ergänzen.
  - marker: b
    text: Wörtlich kann das letzte Wort auch mit „süß“ oder „angenehm“ wiedergegeben werden.
    reason: Die ungewöhnliche Bildlichkeit des koptischen Ausdrucks soll als Übersetzungsalternative erhalten bleiben.
  - marker: c
    text: 'Oder: „auf den Vollkommenen“. Das zugrunde liegende Wort bezeichnet Vollendung, Vollständigkeit oder Vollkommenheit.'
    reason: Die Alternative bewahrt die semantische Spannung zwischen Ganzheit und Vollkommenheit.
  - marker: d
    text: 'Wörtlich: „den Dingen, in denen sie ihre Wurzel finden werden“.'
    reason: Die Fußnote verdeutlicht die Richtung der koptischen Relativkonstruktion und schützt vor der umgekehrten Lesart „Dinge in ihrer Wurzel finden“.
lexical_decisions:
- source_word: ϣⲱⲱⲧ
  choice: schmälern
  rationale: Das Verb bezeichnet hier ein Vermindern oder Verkürzen; „die Herrlichkeit schmälern“ gibt die Aussage idiomatisch wieder und vermeidet die sachlich falsche Deutung „begehren“.
- source_word: ⲥⲁϣ
  choice: hart
  rationale: Das Wort kann „hart“, „streng“ oder „bitter“ bedeuten; „hart“ passt zur Reihe vermeintlicher Eigenschaften des Vaters.
- source_word: ⲃⲁⲗⲕⲉ
  choice: zornig
  rationale: Der seltene Ausdruck steht im Gegensatz zu den folgenden positiven Eigenschaften; „zornig“ bewahrt diesen affektiven Gegensatz.
- source_word: ⲁⲧⲡⲉⲑⲁⲩ
  choice: ohne Böses
  rationale: Die privative Bildung wird bewusst wörtlich wiedergegeben, ohne sie konfessionell als „sündlos“ zu präzisieren.
- source_word: ⲁⲧϣⲧⲁⲣⲧⲣ
  choice: frei von Unruhe
  rationale: Die privative Form bezeichnet Freiheit von Erregung, Verwirrung oder Aufruhr; die deutsche Wendung erhält diese Bedeutungsbreite.
- source_word: ⲟⲩϩⲗⲟϭ
  choice: mild
  rationale: Wörtlich liegt „süß/angenehm“ nahe; auf eine Person bezogen vermittelt „mild“ den Gegensatz zu „hart“ und „zornig“ in natürlichem Deutsch.
- source_word: ⲙⲛⲧⲛⲁϭ ⲛⲁⲧϣⲓⲧⲥ
  choice: unermessliche Größe
  rationale: Die abstrakte Größe wird durch eine privative Form als ohne Maß beschrieben; „unermesslich“ gibt beides prägnant wieder.
- source_word: ⲡⲉⲧϫⲏⲕ
  choice: der Vollendete
  rationale: ϫⲏⲕ bezeichnet Vollständigkeit und Vollendung. „Vollendete“ hält den Gedanken der Ganzheit fest, ohne ihn auf moralische Makellosigkeit zu verengen.
- source_word: ⲙⲁⲩ
  choice: Mutter
