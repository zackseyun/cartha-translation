- issue: ϫⲏⲕ als Ganzheits- oder Vollkommenheitsbegriff
  choice: der Vollendete / vollendet
  alternative: der Vollkommene / vollkommen
  rationale: „Vollendet“ betont Ganzheit und zum Abschluss gebrachte Fülle und vermeidet eine ausschließlich moralische Lesart.
- issue: Bezeichnung der Unterwelt
  choice: Hades
  alternative: Totenwelt
  rationale: „Hades“ wahrt den antiken kosmologischen Begriff und vermeidet die späteren Strafvorstellungen, die „Hölle“ nahelegen würde.
- issue: Wahrheit als Wirklichkeit und personale Größe
  choice: die Wahrheit
  alternative: Wahrheit mit typografischer Hervorhebung oder begrifflicher Großschreibung
  rationale: Die Identitätsaussage „sie selbst sind die Wahrheit“ bleibt unverändert stark; die reguläre deutsche Schreibung vermeidet eine zusätzliche, im Schriftbild des Koptischen nicht markierte Festlegung.
- issue: Gegenseitiges Innewohnen von Vater und Erlösten
  choice: Der Vater ist in ihnen, und sie sind im Vater
  alternative: Der Vater wohnt in ihnen, und sie wohnen im Vater
  rationale: Die knappe Seinsformulierung erhält die symmetrische Aussage des Textes und fügt keinen besonderen Modus des Innewohnens hinzu.
- issue: Verhältnis der Wurzel zu den gefundenen Dingen
  choice: worin sie ihre Wurzel finden werden
  alternative: was sie in ihrer Wurzel finden werden
  rationale: Die koptische Relativkonstruktion besagt, dass sie ihre Wurzel in diesen Dingen finden, nicht umgekehrt Dinge in ihrer Wurzel.
