  consult_excerpt: 'He’s good. He knows his plants, because he planted them in his paradise. Now his paradise is a place of rest. This 37 is the completion in the Father’s thought, and these are the words of his meditation. Each of his words is the work of his one will in the revelation of his Word. When they were still in the depths of his thought, the Word – which was the first to come out – revealed them along with a mind that speaks the one Word in a silent grace. He was called “the Thought,” since they were in it before being revealed. It happened, then, that he was the first to come out at the time when it pleased the one who wanted it. Now the Father rests in his will, and is pleased with it.

    Nothing happens without him, nor does anything happen without the will of the Father, but his will is incomprehensible. His trace is the will, and no one can know him, nor does he exist for people to scrutinize so that they might grasp him, but when he wills, what he wills is this – even if the sight doesn’t please them in any way before God – the will of the Father, because he knows the beginning of all of them, and their end, for in the end he’ll greet them directly. Now the end is receiving knowledge of the one who’s hidden; this is the Father, 38 from whom the beginning has come, and to whom all who’ve come out from him will return. They were revealed for the glory and the joy of his name.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/013.yaml
  text: 'He is the Good—within the Father’s Thought[a], in contemplation.


    The utterance of his meditation—each one, every one of his words—is the work of his Will. For they are speech in the Light, outside, belonging to his Saying: while they were still in the depths of his Thought, the Logos—the first to come forth—manifested them, with a Mind that speaks the one Word in a silent grace. He was called “the Thought,” because they were in it before they were manifested outside. And so it happened that he was the first to come forth, at the time when it pleased the will of the one who willed it.


    The Will is that in which the Father rests. Nothing happens without him, nor does anything happen without the Will of the Father. But his Will is uninvestigable; his trace is the Will. No one can know him, nor does he exist in such a way as for them to scrutinize him so that they might grasp him; rather, what he wills—this is what happens, even if their sight should not be pleasing in any way before God—the Will of the Father. For the Father knows their beginning and their end; for in their end he will greet them face to face. And the end is the knowledge of the Hidden One; and the Hidden One is the Father—from whom the beginning came forth and to whom all who came forth from him will return[c][b]. They were manifested for the glory and the joy of his Name.'
translation:
  language: de
  text: 'Dies ist die Vollendung im Gedanken des Vaters, und dies sind die Worte seines Nachsinnens.


    Jedes einzelne seiner Worte ist das Werk seines einen Willens und tritt in der Offenbarung seines Wortes hervor. Während sie noch in der Tiefe seines Gedankens waren, offenbarte sie der Logos – der zuerst hervorkam – nach außen, zusammen mit einem Denken, das in schweigender Gnade das eine Wort ausspricht.[a] Er wurde »der Gedanke« genannt, weil sie in ihm waren, bevor sie nach außen offenbar wurden. So kam es, dass er als Erster hervortrat, zu der Zeit, als es dem gefiel, der es wollte.


    Der Wille ist das, worin der Vater ruht, und er hat Wohlgefallen an ihm. Nichts geschieht ohne ihn, und nichts geschieht ohne den Willen des Vaters.[b] Doch sein Wille ist unerforschlich; seine Spur ist der Wille. Niemand kann ihn erkennen, und er ist nicht so beschaffen, dass man ihn untersuchen und dadurch ergreifen könnte. Wenn er aber will, ist das, was er will, dies – auch wenn der Anblick ihnen vor Gott in keiner Weise gefällt –: der Wille des Vaters. Denn der Vater kennt ihrer aller Anfang und ihr Ende. An ihrem Ende wird er sie von Angesicht zu Angesicht empfangen. Das Ende aber ist die Erkenntnis des Verborgenen; und der Verborgene ist der Vater, von dem der Anfang ausgegangen ist und zu dem alle zurückkehren werden, die aus ihm hervorgegangen sind.[c] Sie wurden zur Herrlichkeit und zur Freude seines Namens offenbar.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Für »Denken« steht das griechische Lehnwort nous; möglich ist auch »Geist« oder »Verstand«. Die Wendung »in schweigender Gnade« ist bewusst paradox.
    reason: Bewahrt die technische Terminologie und die semantische Offenheit von nous sowie die auffällige Verbindung von Sprechen und Schweigen.
  - marker: b
    text: 'Wörtlich: »Nichts geschieht ohne ihn, und nichts geschieht ohne den Willen des Vaters.« Das erste »ihn« bezieht sich im Zusammenhang auf den Vater; die Nähe des unmittelbar zuvor genannten Willens lässt die Formulierung jedoch bewusst spannungsvoll erscheinen.'
    reason: Markiert die pronominale Bezugsspannung, ohne den Haupttext frei umzuschreiben.
  - marker: c
    text: '»Anfang« kann hier sowohl den Ursprung als auch das aus dem Vater Hervorgegangene bezeichnen. Entsprechend ist auch möglich: »von dem das, was am Anfang war, hervorging«.'
    reason: Erhält die Mehrdeutigkeit der abstrakten und zugleich kosmologisch gebrauchten Anfangssprache.
lexical_decisions:
- source_word: ⲡⲗⲟⲅⲟⲥ (logos)
  choice: der Logos
  rationale: Das griechische Lehnwort bezeichnet hier eine hervortretende, personhaft dargestellte Größe. »Logos« bewahrt den Fachcharakter; der unmittelbare Zusammenhang mit »Wort« erschließt zugleich seine Bedeutung.
- source_word: ⲛⲟⲩⲥ (nous)
  choice: Denken
  rationale: Das griechisch-koptische Fachwort kann »Geist«, »Verstand« oder »Denken« bedeuten. »Denken« ist im Deutschen verständlich und lässt die Beziehung zum Gedanken des Vaters hörbar bleiben, ohne eine eigenständige Hypostase dogmatisch festzulegen.
- source_word: ⲭⲁⲣⲓⲥ (charis)
  choice: Gnade
  rationale: »Gnade« entspricht dem üblichen Bedeutungsfeld des griechischen Lehnworts und bewahrt die auffällige Verbindung mit dem Schweigen.
- source_word: ⲙⲉⲩⲉ / ⲙⲉⲉⲓⲛⲉ
  choice: Gedanke / Nachsinnen
  rationale: Die Wiedergabe unterscheidet zwischen dem inhaltlich-räumlich vorgestellten »Gedanken« des Vaters und dem Vorgang seines »Nachsinnens«, ohne die begriffliche Verwandtschaft aufzugeben.
- source_word: ⲟⲩⲱϣ
  choice: Wille
  rationale: Das Wort bezeichnet den Willen oder das Wollen. Die Großschreibung des deutschen Substantivs genügt; eine zusätzliche typografische Personifizierung wird vermieden, damit der ontologische Status offenbleibt.
- source_word: ⲓⲭⲛⲟⲥ (ichnos)
  choice: Spur
  rationale: »Spur« bewahrt das konkrete Bild des griechischen Lehnworts und zugleich seine metaphorische Aussage über die nur mittelbare Erkennbarkeit des Vaters.
- source_word: ⲥⲟⲟⲩⲛⲉ
  choice: Erkenntnis
  rationale: »Erkenntnis« gibt den soteriologisch gewichtigen Wissensbegriff natürlich wieder, ohne durch die bloße Transkription »Gnosis« spätere religionsgeschichtliche Kategorien in den Haupttext einzutragen.
- source_word: ⲡⲉⲉⲓ ⲉⲑⲏⲡ
  choice: der Verborgene
  rationale: Die substantivierte Wiedergabe erhält die titelartige Formulierung und ihre ausdrückliche Identifikation mit dem Vater.
theological_decisions:
- issue: Verhältnis von Logos, Denken und dem einen Wort
  choice: 'Die technischen Größen bleiben unterscheidbar: Der Logos offenbart zusammen mit einem Denken, das das eine Wort ausspricht.'
  alternative: Alle Begriffe vereinheitlichend mit »Wort« oder »Geist« wiedergeben.
  rationale: Der Text setzt die Begriffe nebeneinander. Ihre genaue Beziehung bleibt spannungsvoll und darf nicht durch eine trinitarische oder valentinianische Systematisierung vorentschieden werden.
- issue: Status des Willens
  choice: »Wille« wird als stark verselbstständigte Größe formuliert, aber nicht durch eine Sonderbezeichnung zur eigenen Person erklärt.
  alternative: »der Wille« ausdrücklich als Hypostase behandeln oder nur als gewöhnliche Eigenschaft paraphrasieren.
  rationale: Der Vater ruht in seinem Willen, und der Wille heißt seine Spur. Das ist mehr als eine beiläufige Eigenschaft, legt aber den ontologischen Status nicht eindeutig fest.
- issue: Das Ende als Erkenntnis des Verborgenen
  choice: »Das Ende aber ist die Erkenntnis des Verborgenen«
  alternative: »Das Ziel ist die Gnosis Gottes«
  rationale: »Ende« erhält die doppelte Spannung von Abschluss und Ziel; »Erkenntnis« wahrt den soteriologischen Gehalt, ohne eine konfessionelle oder religionsgeschichtliche Deutung aufzuzwingen.
- issue: Rückkehr aller Hervorgegangenen
  choice: Die umfassende Aussage wird ohne Einschränkung wiedergegeben.
  alternative: Die Rückkehr auf eine besondere Gruppe von Erlösten begrenzen.
  rationale: Der Text spricht von allen, die aus dem Vater hervorgegangen sind. Eine Einschränkung würde eine nicht ausdrücklich genannte Lehrentscheidung importieren.
translation_notes:
  register: Moderne, würdige Standardsprache mit kurzen Sinnabschnitten. Technische Begriffe werden nur dort beibehalten, wo der koptische Text selbst ein griechisches Lehnwort profiliert; »Logos« bleibt stehen, während nous zugunsten der Verständlichkeit als »Denken« erscheint. Die räumliche Bildsprache von Tiefe, Hervorkommen, Offenbarwerden und Rückkehr wird bewahrt. Der Text setzt am Seitenanfang offenbar innerhalb eines fortlaufenden Gedankengangs ein; deshalb wird kein nicht sicher belegter vorausgehender Satz aus dem Konsultationstext ergänzt.
