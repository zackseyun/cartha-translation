  source_fidelity: 'Der Entwurf gibt die zentralen Begriffe und den Gedankengang überwiegend treffend wieder. Eine sichere Korrektur ist jedoch bei der ersten Aussage über die Worte nötig: Der koptische Text sagt, dass jedes Wort Werk des einen Willens ist und in der Offenbarung seines Wortes hervortritt; die Fassung „Sie werden offenbar als sein Wort, solange …“ verschiebt sowohl die Beziehung als auch den zeitlichen Zusammenhang. Im Satz über den Willen muss außerdem das im Quelltext vorhandene „ihnen“ beim missfallenden Anblick stehen bleiben.'
  naturalness: Die Sprache ist im Allgemeinen würdig und modern. Die korrigierte Fassung gliedert den komplexen ersten Abschnitt klarer und macht den schwer verständlichen, bewusst verschachtelten Satz über den Willen lesbar, ohne seine semantische Spannung aufzulösen.
  terminology: „Logos“, „Gnade“, „Wille“, „Spur“, „Erkenntnis“ und „der Verborgene“ sind sachgerecht. „Denken“ für nous bleibt als offene, nicht dogmatisierende Wiedergabe vertretbar; die Anmerkung erläutert die technische Nuance.
  issues:
  - severity: high
    issue: Die Worte werden als „offenbar als sein Wort“ dargestellt, während sie noch im Gedanken sind.
    rationale: Der Text verbindet jedes Wort mit dem einen Willen und seinem Hervortreten in der Offenbarung des Wortes. Das Hervortreten/Offenbarwerden durch den zuerst hervortretenden Logos erfolgt erst anschließend, als sie noch in der Tiefe des Gedankens waren.
  - severity: medium
    issue: Im Satz über den missfallenden Anblick fehlt der Bezug auf die Betroffenen.
    rationale: 'Das koptische Pronomen entspricht „ihnen“: Der Anblick gefällt ihnen vor Gott in keiner Weise. Ohne diesen Bezug wird die Aussage unnötig verallgemeinert und syntaktisch abgeschwächt.'
  - severity: low
    issue: Die Einleitung „Das ist“ ist weniger idiomatisch als „Dies ist“ in einem feierlich-reflektierenden deutschen Text.
    rationale: Keine inhaltliche Abweichung, aber „Dies ist“ entspricht dem demonstrativen Anschluss des koptischen Textes stilistisch besser.
  revised_text: 'Dies ist die Vollendung im Gedanken des Vaters, und dies sind die Worte seines Nachsinnens.


    Jedes einzelne seiner Worte ist das Werk seines einen Willens und tritt in der Offenbarung seines Wortes hervor. Während sie noch in der Tiefe seines Gedankens waren, offenbarte sie der Logos – der zuerst hervorkam – nach außen, zusammen mit einem Denken, das in schweigender Gnade das eine Wort ausspricht.[a] Er wurde »der Gedanke« genannt, weil sie in ihm waren, bevor sie nach außen offenbar wurden. So kam es, dass er als Erster hervortrat, zu der Zeit, als es dem gefiel, der es wollte.


    Der Wille ist das, worin der Vater ruht, und er hat Wohlgefallen an ihm. Nichts geschieht ohne ihn, und nichts geschieht ohne den Willen des Vaters.[b] Doch sein Wille ist unerforschlich; seine Spur ist der Wille. Niemand kann ihn erkennen, und er ist nicht so beschaffen, dass man ihn untersuchen und dadurch ergreifen könnte. Wenn er aber will, ist das, was er will, dies – auch wenn der Anblick ihnen vor Gott in keiner Weise gefällt –: der Wille des Vaters. Denn der Vater kennt ihrer aller Anfang und ihr Ende. An ihrem Ende wird er sie von Angesicht zu Angesicht empfangen. Das Ende aber ist die Erkenntnis des Verborgenen; und der Verborgene ist der Vater, von dem der Anfang ausgegangen ist und zu dem alle zurückkehren werden, die aus ihm hervorgegangen sind.[c] Sie wurden zur Herrlichkeit und zur Freude seines Namens offenbar.'
  revised_footnotes:
  - marker: a
    text: Für »Denken« steht das griechische Lehnwort nous; möglich ist auch »Geist« oder »Verstand«. Die Wendung »in schweigender Gnade« ist bewusst paradox.
    reason: Bewahrt die technische Terminologie und die semantische Offenheit von nous sowie die auffällige Verbindung von Sprechen und Schweigen.
  - marker: b
    text: 'Wörtlich: »Nichts geschieht ohne ihn, und nichts geschieht ohne den Willen des Vaters.« Das erste »ihn« bezieht sich im Zusammenhang auf den Vater; die Nähe des unmittelbar zuvor genannten Willens lässt die Formulierung jedoch bewusst spannungsvoll erscheinen.'
    reason: Markiert die pronominale Bezugsspannung, ohne den Haupttext frei umzuschreiben.
  - marker: c
    text: '»Anfang« kann hier sowohl den Ursprung als auch das aus dem Vater Hervorgegangene bezeichnen. Entsprechend ist auch möglich: »von dem das, was am Anfang war, hervorging«.'
    reason: Erhält die Mehrdeutigkeit der abstrakten und zugleich kosmologisch gebrauchten Anfangssprache.
  revision_rationale: 'Die Revision stellt die Abfolge des Quelltexts wieder her: Werk des einen Willens, Hervortreten in der Offenbarung des Wortes, dann Offenbarung durch den zuerst hervorkommenden Logos. Sie ergänzt ferner den im Koptischen vorhandenen Bezug „ihnen“ im schwierigen Willenssatz. Die technischen und theologischen Begriffe sowie die absichtlich offene, nicht systematisierte Darstellung bleiben erhalten.'
