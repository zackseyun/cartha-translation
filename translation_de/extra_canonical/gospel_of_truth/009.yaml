  consult_excerpt: 'When he was revealed, he taught them about the Father, the uncontainable one, and breathed into them what’s in the thought, doing his will. When many had received the light, they turned 31 to him. For the material ones were strangers, who didn’t see his form or know him. For he came by means of fleshly form, and nothing could block his path, because incorruptibility can’t be grasped. Moreover, he said new things while he spoke about what’s in the Father’s heart and brought out the complete Word. When the light spoke through his mouth, and by his voice gave birth to life, he gave them thought, wisdom, mercy, salvation, and the Spirit of power from the infinity and sweetness of the Father. He caused punishments and torments to cease, because they led astray into Error and bondage those who needed mercy. He dissolved and confounded them with knowledge. He became:

    a Way for those who were led astray,

    knowledge for those who were ignorant,

    a discovery for those who were searching,

    strength for those who were wavering, and

    purity for those who were impure.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/009.yaml
  text: 'When he was revealed[a], he taught them of the Father—the uncontainable one—and he breathed into them what is in the Thought, accomplishing his will. Many received the Light and turned to him, for the material ones were strangers; they did not behold his form nor know him. He came by means of a fleshly form, and nothing was able to block his way, because incorruptibility is ungraspable.


    He spoke things new, speaking out what is in the Father’s heart, and he brought forth the complete Word; when the Light spoke from his mouth, and his voice gave birth to life, he gave them Thought, understanding, mercy, salvation, and the Spirit of power, from the infinity and sweetness of the Father.


    He caused punishments and scourges to cease, because they were leading into Error and into captivity those who had need of mercy. He dissolved them, and he confounded them by Knowledge.


    Thus he became:

    - a Way for those who were wandering,

    - Knowledge for those who were ignorant,

    - a Discovery for those who were seeking,

    - Strength for those who were wavering,

    - and Purity for those who were defiled.'
translation:
  language: de
  text: 'Viele empfingen das Licht und wandten sich ihm zu.[a] Denn die Menschen des Stoffes waren Fremde: Sie sahen seine Gestalt nicht und erkannten ihn nicht. Er kam in einer Gestalt aus Fleisch, und nichts konnte seinen Weg versperren, denn die Unvergänglichkeit lässt sich nicht ergreifen.


    Er sagte Neues, indem er aussprach, was im Herzen des Vaters ist, und brachte das vollkommene Wort hervor. Als das Licht aus seinem Mund sprach und seine Stimme Leben gebar, gab er ihnen Denken, Einsicht, Erbarmen, Rettung und den Geist der Kraft – aus der Unendlichkeit und Süße des Vaters.


    Er ließ Strafen und Geißeln aufhören; denn sie führten diejenigen, die Erbarmen brauchten, in den Irrtum und in Gefangenschaft. Er löste sie auf und brachte sie durch Erkenntnis in Verwirrung.


    So wurde er


    – ein Weg für die Umherirrenden,


    – Erkenntnis für die Unwissenden,


    – eine Entdeckung für die Suchenden,


    – Festigkeit für die Wankenden


    – und Reinheit für die Befleckten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die erhaltene Codexseite setzt mitten im Satz ein. Der unmittelbar vorausgehende Zusammenhang berichtet, dass viele das Licht empfingen; die erste vollständig erkennbare Wendung lautet: „… wandten sich ihm zu“.'
    reason: Die Seiten- und Abschnittsgrenze darf nicht den Eindruck erwecken, der deutsche Anfang sei im erhaltenen Text vollständig überliefert.
lexical_decisions:
- source_word: ⲟⲉⲓⲛ
  choice: Licht
  rationale: Bewahrt den im Text hervorgehobenen, heilbringenden Charakter des Lichts, ohne durch einen fremden Fachbegriff zusätzliche Lehre einzutragen.
- source_word: ⲛⲉⲩⲟⲓ ⲛϣⲙⲙⲟ (vom OCR entstellt als ⲛⲉⲩⲟⲉⲓⲛ ϣⲙⲙⲟ)
  choice: sie waren Fremde
  rationale: Die Worttrennung erklärt die schwierige OCR-Zeile und ergibt den zum folgenden Nichtsehen und Nichterkennen passenden Sinn.
- source_word: ⲥⲁⲣⲝ ⲛⲓⲥⲙⲁⲧ
  choice: Gestalt aus Fleisch
  rationale: Gibt sowohl σάρξ als auch das Gestaltmotiv wieder und vermeidet die missverständliche Formulierung „fleischliche Gestalt“.
- source_word: ⲧⲙⲛⲧⲁⲧⲧⲉⲕⲟ
  choice: Unvergänglichkeit
  rationale: Die Negativbildung bezeichnet das Nicht-Vergehen beziehungsweise Nicht-Verdorbenwerden; der Folgesatz bewahrt daneben das Motiv des Nichtergreifens.
- source_word: ⲡϣⲉϫⲉ ⲛⲁⲧⲱⲧⲁ
  choice: das vollkommene Wort
  rationale: „Wort“ wahrt den offenbarungstheologischen Klang; „vollkommen“ gibt die Vorstellung der Vollständigkeit wieder.
- source_word: ⲥⲁⲩⲛⲉ
  choice: Erkenntnis
  rationale: Im Deutschen verständlich und zugleich geeignet, den gewichtigen heilbringenden Erkenntnisbegriff des Textes auszudrücken.
- source_word: ⲡⲗⲁⲛⲏ
  choice: Irrtum
  rationale: Gibt das griechische Lehnwort πλάνη wieder und lässt offen, ob hier Zustand, Bereich oder personifiziert wirkende Macht gemeint ist.
- source_word: ⲙⲁⲉⲓⲧ
  choice: Weg
  rationale: Bewahrt die konkrete Wegmetapher und ihre soteriologische Funktion.
- source_word: ⲧⲁϫⲣⲟ
  choice: Festigkeit
  rationale: Entspricht dem Stärken beziehungsweise Festmachen und bildet einen klaren Gegensatz zum Wanken.
theological_decisions:
- issue: Status des Lichts und der Erkenntnis
  choice: Die zentralen Begriffe werden wörtlich als „Licht“ und „Erkenntnis“ wiedergegeben.
  alternative: Sie ausdrücklich als personifizierte oder hypostasierte Mächte kennzeichnen.
  rationale: Der Text verleiht ihnen deutliches theologisches Gewicht, legt ihren ontologischen Status hier aber nicht vollständig fest; die Übersetzung wahrt diese Spannung.
- issue: Die aus Fleisch bestehende Erscheinungsweise des Offenbarers
  choice: „Er kam in einer Gestalt aus Fleisch.“
  alternative: „Er wurde Fleisch“ oder „er besaß nur den Anschein von Fleisch“.
  rationale: Die Quelle spricht von der Vermittlung durch eine fleischliche Gestalt; weder Inkarnationsformel noch bloßer Schein soll konfessionell oder doketisch ergänzt werden.
- issue: Irrtum als feindliche Größe
  choice: „in den Irrtum“ ohne zusätzliche Personifizierungsformel
  alternative: „in die Macht des Irrtums“ oder „in die Irre“
  rationale: So bleibt offen, ob πλάνη personifiziert, räumlich oder als Zustand verstanden wird.
- issue: Bezug von „sie“ bei Strafen und Geißeln
  choice: Das Pronomen bezieht sich auf Strafen und Geißeln.
  alternative: Bezug auf nicht ausdrücklich genannte Mächte hinter den Strafen.
  rationale: Der unmittelbare grammatische Bezug sind die beiden Pluralbegriffe; eine zusätzliche Dämonologie wäre nicht ausdrücklich im Satz enthalten.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Technische Vorstellungen werden möglichst in verständlichen deutschen Wörtern wiedergegeben. Die parallele Schlussreihe bleibt als poetisch-rhetorische Liste erhalten; deutsche Substantivgroßschreibung wird nicht künstlich zur dogmatischen Kennzeichnung eingesetzt.
