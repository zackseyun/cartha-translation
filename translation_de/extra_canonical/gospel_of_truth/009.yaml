revisions:
- from: 'Viele empfingen das Licht und wandten sich ihm zu.[a] Denn die Menschen des Stoffes waren Fremde: Sie sahen seine Gestalt nicht und erkannten ihn nicht. Er kam in einer Gestalt aus Fleisch, und nichts konnte seinen Weg versperren, denn die Unvergänglichkeit lässt sich nicht ergreifen.


    Er sagte Neues, indem er aussprach, was im Herzen des Vaters ist, und brachte das vollkommene Wort hervor. Als das Licht aus seinem Mund sprach und seine Stimme Leben gebar, gab er ihnen Denken, Einsicht, Erbarmen, Rettung und den Geist der Kraft – aus der Unendlichkeit und Güte des Vaters.


    Er ließ Strafen und Geißeln aufhören; denn sie führten diejenigen, die Erbarmen brauchten, in den Irrtum und in Gefangenschaft. Er löste sie auf und brachte sie durch Erkenntnis in Verwirrung.


    So wurde er


    – ein Weg für die Umherirrenden,


    – Erkenntnis für die Unwissenden,


    – ein Finden für die Suchenden,


    – Festigkeit für die Wankenden


    – und Reinheit für die Befleckten.'
