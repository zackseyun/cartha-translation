  choice: umschließen
  rationale: Bewahrt das räumliche Bild dessen, der alle Orte umfasst, selbst aber von nichts umfasst wird.
- source_word: ⲙⲛⲧⲙⲏⲉ
  choice: Wahrheit
  rationale: Erhält den abstrakten und möglicherweise hypostatischen Sinn, ohne ihn ausdrücklich zu personifizieren.
theological_decisions:
- issue: Bedeutung von ⲥⲁⲛϩⲣⲉ
  choice: Sohnschaft
  alternative: Sohnsein; der Sohn
  rationale: „Sohnschaft“ wahrt den technischen Abstraktbegriff. „Der Sohn“ würde die Spannung vorschnell zugunsten einer einzelnen Person auflösen.
- issue: Verhältnis von „Buch der Lebenden“ und „lebendigem Buch“
  choice: Je nach unmittelbarem Zusammenhang beide Lesarten im Haupttext
  alternative: An beiden Stellen einheitlich „Buch der Lebenden“
  rationale: Die koptische Fügung lässt beide Bezüge zu. Der Anfang betont die darin verzeichneten Lebenden, die spätere Aussage die lebendige, sprechende Beschaffenheit des Buches beziehungsweise seiner Buchstaben.
- issue: Personifizierung von πλάνη
  choice: die Verirrung mit bestimmtem Artikel
  alternative: der Irrtum; Verirrung als Eigenname
  rationale: Die Übersetzung erhält die quasi-personale kosmische Wirksamkeit, ohne aus dem Ausdruck eindeutig einen Eigennamen oder ein selbstständiges Wesen zu machen.
- issue: Kosmologische Gesamtheit
  choice: das All
  alternative: alles; die Gesamtheit
  rationale: „Das All“ bewahrt die technische und reifizierte Färbung, ohne eine bestimmte spätere Systematik in den Text einzutragen.
- issue: Subjekt des Schreibens
  choice: die Einheit schreibt; anschließend wird der Vater als Schreibender bezeichnet
  alternative: beide Aussagen zu einer einzigen Identifikation glätten
  rationale: Der Text stellt beide Formulierungen nebeneinander. Die Übersetzung erhält diese Spannung, statt das Verhältnis zwischen Einheit und Vater ausdrücklich zu definieren.
