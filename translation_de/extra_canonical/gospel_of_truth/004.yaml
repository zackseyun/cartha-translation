revisions:
- from: '### Das Buch der Lebenden


    Die Namen der Lebenden sind im Buch der Lebenden[a] geschrieben.


    Sie werden über sich selbst unterwiesen; diese Unterweisung empfangen sie von der Sohnschaft[b], sodass derjenige, der hört, antwortet, umkehrt und auf den blickt, der ihn bei seinem Namen gerufen hat. Er tut dessen Willen, folgt ihm und bekennt, dass diejenigen ihm gehören, die von ihm beim Namen genannt worden sind. Jeder erkennt, woher er gerufen wurde; er tut den Willen dessen, der ihn gerufen hat, möchte ihm gefallen und empfängt Ruhe. Der Name eines jeden wird sein eigener.


    Da also die Vollendung des Alls[c] im Vater ist, muss das All zu ihm hinaufgehen und jeder das Seine empfangen. Er schrieb dies im Voraus nieder – in seinem Denken und seinem Willen vorbereitet –, um es denen zu geben, die aus ihm hervorgegangen waren.


    Diejenigen, die er im Voraus mit Namen kannte, wurden am Ende gerufen. So ist der Erkennende derjenige, dessen Namen der Vater ausgesprochen hat; denn wessen Name nicht ausgesprochen worden ist, der ist unwissend. Wie sollte ein solcher auch hören, wenn sein Name nicht gerufen worden ist? Wer bis zum Ende unwissend bleibt, ist ein Gebilde der Verirrung[d] und wird sich mit ihr auflösen. Warum sonst haben diese Bedauernswerten keinen Namen? Warum haben sie keine Stimme?


    Wer also Erkenntnis hat, stammt von oben. Wird er gerufen, so hört er; er antwortet, wendet sich dem Rufenden zu, geht zu ihm hinauf und erkennt, auf welche Weise er gerufen wird. Weil er Erkenntnis hat, tut er den Willen dessen, der ihn gerufen hat, möchte ihm gefallen und empfängt Ruhe. Sein Name wird sein eigener. Wer auf diese Weise erkennt, weiß, woher er gekommen ist und wohin er geht. Er gleicht einem Menschen, der betrunken war, sich aber von seiner Trunkenheit abgewandt hat, wieder zu sich gekommen ist und das Seine erneut in Ordnung gebracht hat.


    Er hat viele aus der Verirrung zurückgeführt. Er ging ihnen voraus zu den Orten, von denen sie sich entfernt hatten. Wegen der Tiefe dessen, der jeden Ort umschließt – während ihn selbst nichts umschließt –, waren sie der Verirrung verfallen. Welch großes Wunder: Sie waren im Vater und kannten ihn nicht. Sie konnten aus sich selbst hervorgehen, obwohl sie den, in dem sie waren, weder erfassen noch erkennen konnten. Er offenbarte seinen Willen als Erkenntnis, im Einklang mit allem, was aus ihm hervorgegangen war.


    Dies ist die Erkenntnis des lebendigen Buches[a], das er am Ende den Geschlechtern offenbarte: Buchstaben von ihm, die erkennen lassen, dass sie weder Vokale noch Konsonanten sind, die jemand lesen und für bedeutungslos halten könnte. Vielmehr sind sie Buchstaben der Wahrheit: Sie sprechen und erkennen sich selbst. Jeder Buchstabe ist ein vollkommener Gedanke, einem vollständigen Buch gleich. Denn es sind Buchstaben, welche die Einheit[e] geschrieben hat. Der Vater hat sie geschrieben, damit die Geschlechter durch seine Buchstaben den Vater erkennen.'
