  footnotes:
  - marker: a
    text: Die koptische Wortverbindung kann sowohl „Buch der Lebenden“ als auch „lebendiges Buch“ bedeuten. Der jeweilige Zusammenhang hebt einmal die darin verzeichneten Lebenden, später die lebendige und sprechende Art der Buchstaben hervor.
    reason: Bewahrt eine echte grammatische und inhaltliche Mehrdeutigkeit des Quelltexts.
  - marker: b
    text: „Sohnschaft“ bezeichnet hier ein abstrakt oder hypostatisch verstandenes Sohnsein; der Ausdruck ist nicht ohne Weiteres mit „dem Sohn“ gleichzusetzen.
    reason: Verhindert eine vorschnelle personale oder konfessionelle Festlegung.
  - marker: c
    text: „Das All“ bezeichnet die umfassende Gesamtheit, nicht bloß eine unbestimmte Menge von Dingen.
    reason: Erklärt den kosmologischen Fachgebrauch in verständlichem Deutsch.
  - marker: d
    text: Das griechische Lehnwort πλάνη kann Irrtum, Täuschung oder Verirrung bedeuten. Im Text erscheint die Verirrung beinahe wie eine handelnde Macht.
    reason: Macht Bedeutungsbreite und Personifizierung sichtbar.
  - marker: e
    text: „Einheit“ kann hier eine abstrakte Einheit oder eine hypostatisch verstandene Wirklichkeit bezeichnen; der Text bestimmt das Verhältnis zum Vater nicht ausdrücklich.
    reason: Erhält die metaphysische und theologische Offenheit der Formulierung.
lexical_decisions:
- source_word: ⲡⲗⲁⲛⲏ (πλάνη)
  choice: die Verirrung
  rationale: Bewahrt sowohl das Irregehen als auch den im Text personifiziert wirkenden kosmischen Zustand; der bestimmte Artikel trägt die reifizierte Bedeutung, ohne durch Großschreibung eine zusätzliche Eigenname-Deutung zu erzwingen.
- source_word: ⲡⲓⲱⲧ
  choice: der Vater
  rationale: Gibt den bestimmten koptischen Ausdruck und den durchgängigen göttlichen Titel unmittelbar wieder.
- source_word: ⲥⲁⲛϩⲣⲉ
  choice: die Sohnschaft
  rationale: Bewahrt den abstrakten beziehungsweise hypostatischen Fachsinn besser als „der Sohn“ und vermeidet eine ungesicherte personale Gleichsetzung.
- source_word: ⲙⲧⲁⲛ / Ruhe-Motiv
