  choice: Wille
  rationale: Gibt die göttliche Willensrichtung nüchtern und ohne konfessionelle Zusatzdeutung wieder.
- source_word: ⲙⲟⲩⲧⲉ
  choice: rufen / beim Namen rufen
  rationale: Die wechselnde Wiedergabe erhält das im Koptischen eng verbundene Motiv von Benennung und Berufung in natürlichem Deutsch.
- source_word: ⲃⲁⲑⲟⲥ (βάθος)
