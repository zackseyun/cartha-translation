  consult_excerpt: '33 Strengthen the feet of those who stumble, and reach out to those who are sick. Feed those who are hungry, and give rest to those who are weary. Raise up those who want to arise, and awaken those who sleep, because you’re the understanding that’s unsheathed. If strength is like this, it becomes stronger.

    Be concerned about yourselves. Don’t be concerned about other things which you’ve rejected from yourselves. Don’t return to eat your vomit. Don’t be eaten by worms, because you’ve already shaken it off. Don’t become a dwelling-place for the devil, because you’ve already brought him to naught. Don’t strengthen your obstacles which are collapsing, as though you’re a support. For the lawless one is nothing, to be treated more harshly than the just, doing his works among others.

    Do then the Father’s will, because you’re from him. For the Father is sweet, and goodness is in his will. He knows what’s yours, that you may find rest in them. For by the fruits they know what’s yours, because the children of the Father 34 are his fragrance, since they’re from the grace of his expression. Because of this, the Father loves his fragrance, and reveals it in every place. And when it mixes with matter, it gives his fragrance to the light, and in tranquility he causes it to rise above every form and every sound. For it’s not the ears that smell the fragrance, but it’s the Spirit that smells, and draws the fragrance to itself, and sinks down into the Father’s fragrance. He shelters it, then, and takes it to the place from which it came, from the first fragrance which has grown cold. It’s something in a soul-endowed delusion, like cold water sunk into loose earth. Those who see it think that it’s just earth. Afterwards, it dissolves again. If a breath draws it, it becomes warm.
    So the fragrances which are cold are from the division. Because of this, faith came. It dissolved the division, and it brought the fullness that’s warm with love, so that the cold may not return, but rather the unitary thought of completion.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/011.yaml
  text: 'Make firm the feet of those who stumble[a]; stretch out a hand to the sick. Give food to those who are hungry, and give rest to those who are weary. Raise up those who wish to arise, and awaken those who sleep—for you are the Understanding that has been unsheathed. And if strength is of this sort, it grows stronger.


    Be concerned for yourselves; do not be concerned with other things that you have cast away from yourselves. Do not turn back to eat your vomit. Do not be moth-eaten, do not be worm-eaten, for you have already shaken it off. Do not become a house for the Devil, for you have already brought him to nothing. Do not prop up your stumbling-blocks that are collapsing, as though you were a support. For the lawless one is nothing, to be dealt with more severely than the just, while doing his works among others.


    Therefore do the Father’s will, because you are from him. For the Father is sweet, and goodness is in his will. He knows what is yours, so that you may find rest in them. For by the fruits they know what is yours, because the children of the Father are his fragrance, since they come from the grace of his Face. For this reason the Father loves his fragrance and reveals it in every place; and when it mingles with hylē, he gives his fragrance to the Light, and in his quiet he causes it to surpass every form and every sound. For it is not the ears that smell the fragrance, but the Spirit smells it, draws the fragrance to itself, and sinks down into the fragrance of the Father. Then he shelters it and leads it back to the place from which it came—from the first fragrance that had grown cold. It is something within a soul-endowed formation, like cold water sunk into a clod of loose earth[b]. Those who see it suppose it is only earth; afterward it is dissolved again. And if a breath draws it,
    it becomes warm. Thus the fragrances that are cold are from the division. Because of this, Faith came: it dissolved the division and brought the Pleroma that is warm with agapē, so that the cold would not return, but rather the unity (monad) of Thought of perfection[c]. This Logos made it manifest.'
translation:
  language: de
  text: 'Macht die Füße derer fest, die straucheln, und streckt den Kranken die Hand entgegen. Gebt den Hungrigen zu essen und verschafft den Erschöpften Ruhe. Richtet auf, die sich erheben wollen, und weckt die Schlafenden; denn ihr seid die Erkenntnis, die aus der Scheide gezogen ist. Wenn die Kraft so ist, wird sie noch stärker.


    Achtet auf euch selbst. Befasst euch nicht wieder mit den anderen Dingen, die ihr von euch geworfen habt. Kehrt nicht um, um euer Erbrochenes zu essen. Lasst euch weder von Motten noch von Würmern zerfressen; denn ihr habt es bereits abgeschüttelt. Werdet nicht zur Wohnung des Teufels; denn ihr habt ihn bereits zunichtegemacht. Stützt nicht eure Hindernisse, die schon zusammenbrechen, als wärt ihr ihre Stütze. Denn der Gesetzlose ist nichts; er wird strenger behandelt als der Gerechte, während er seine Werke unter anderen tut.


    Tut also den Willen des Vaters, denn ihr stammt von ihm. Der Vater ist gütig, und in seinem Willen liegt Güte. Er hat erkannt, was zu euch gehört, damit ihr darin Ruhe findet. Denn an den Früchten erkennt man, was zu euch gehört: Die Kinder des Vaters sind sein Duft, weil sie aus der Gnade seines Angesichts hervorgegangen sind. Darum liebt der Vater seinen Duft und offenbart ihn überall. Wenn der Duft sich mit der Materie[a] vermischt, gibt er seinen Duft dem Licht; und in seiner Stille lässt er ihn jede Gestalt und jeden Laut übertreffen. Denn nicht die Ohren riechen den Duft. Vielmehr riecht ihn der Geist, zieht den Duft an sich und taucht in den Duft des Vaters ein. Dann birgt er ihn und bringt ihn an den Ort zurück, von dem er kam: zu dem ursprünglichen Duft, der kalt geworden war.


    Es ist etwas in einer beseelten Gestalt[b], wie kaltes Wasser, das in lockere Erde eingesunken ist. Wer es sieht, meint, es sei bloß Erde. Später löst es sich wieder heraus; und wenn ein Luftzug es anzieht, wird es warm. So stammen die kalt gewordenen Düfte aus der Trennung. Deshalb kam der Glaube[c]: Er löste die Trennung auf und brachte die Fülle[d], die von Liebe erwärmt ist, damit die Kälte nicht zurückkehrt, sondern die Einheit des Gedankens der Vollendung besteht. Dies ist das Wort[e], das denen, die nach ihm suchen, die Entdeckung der Fülle offenbarte.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht hier das griechische Lehnwort hylē, „Materie“ oder „Stoff“, das in diesem Text kosmologischen Klang hat.
    reason: Der griechische Fachausdruck besitzt einen engeren metaphysischen Beiklang als das alltägliche deutsche Wort „Materie“.
  - marker: b
    text: Das zugrunde liegende griechische Lehnwort plasma bedeutet „Geformtes“, „Gebilde“ oder „Gestalt“.
    reason: Die Lesart „Täuschung“ wäre eine sachlich nicht gesicherte Deutung und wird deshalb nicht in den Haupttext aufgenommen.
  - marker: c
    text: „Der Glaube“ kann hier als handelnde, personifizierte Größe verstanden werden; der Text lässt offen, wie weit diese Personifikation reicht.
    reason: Die theologische Spannung zwischen abstraktem Glauben und personifizierter Gestalt soll nicht einseitig aufgelöst werden.
  - marker: d
    text: „Fülle“ gibt das griechische plērōma wieder, einen Fachbegriff für die göttliche Fülle oder Ganzheit.
    reason: Die Fußnote hält die technische Bedeutung hinter der verständlichen deutschen Übersetzung fest.
  - marker: e
    text: 'Wörtlich: der Logos. Das griechische Wort kann „Wort“, „Rede“ oder „vernünftiger Sinn“ bedeuten.'
    reason: „Wort“ ist idiomatisch, doch die weitere Bedeutungsbreite und der fachsprachliche Charakter sollen sichtbar bleiben.
lexical_decisions:
- source_word: ⲧⲁϫⲣⲟ
  choice: festmachen / stützen
  rationale: Das Verb bezeichnet Festigen oder Stärken. Im ersten Imperativ ist „festmachen“ natürlich; beim späteren Bild einstürzender Hindernisse gibt „stützen“ denselben Grundsinn kontextgerecht wieder.
- source_word: ⲙⲛⲧⲣⲙⲛϩⲏⲧ
  choice: Erkenntnis
  rationale: Das Abstraktum bezeichnet verständige Einsicht beziehungsweise Erkenntnis. Die bestimmte, bildhaft personifizierte Verwendung bleibt erhalten.
- source_word: ⲥⲧⲁⲉⲓ
  choice: Duft
  rationale: „Duft“ bewahrt die durchgehende Geruchsmetaphorik und klingt im modernen Deutschen weniger schwer als „Wohlgeruch“.
- source_word: ϩⲩⲗⲏ
  choice: Materie
  rationale: Das griechische Lehnwort hylē bezeichnet hier Materie als kosmologischen Begriff. Die deutsche Übersetzung bleibt lesbar; eine Fußnote nennt den Fachausdruck.
- source_word: ⲣ ⲥⲁⲧⲡⲉ
  choice: übertreffen
  rationale: Das Verb bezeichnet qualitative Überlegenheit. „Übertreffen“ vermeidet die sachlich nicht geforderte räumliche Vorstellung eines Aufsteigens.
- source_word: ⲡⲗⲁⲥⲙⲁ
  choice: Gestalt
  rationale: Das griechische plasma meint ein Geformtes oder Gebilde. „Gestalt“ bewahrt diesen Sinn, ohne die nicht belegte Deutung „Täuschung“ einzutragen.
- source_word: ⲡⲱϣ
  choice: Trennung
  rationale: Der Ausdruck steht im Gegensatz zur späteren Einheit. „Trennung“ bewahrt sowohl den Vorgang als auch den daraus entstandenen Zustand.
- source_word: ⲡⲗⲏⲣⲱⲙⲁ
  choice: Fülle
  rationale: Das griechische plērōma kann im Deutschen sinnvoll als „Fülle“ wiedergegeben werden; die technische Bedeutung wird in einer Fußnote kenntlich gemacht.
- source_word: ⲗⲟⲅⲟⲥ
  choice: Wort
  rationale: „Wort“ ist die natürliche deutsche Wiedergabe von logos; die Fußnote hält den griechischen Fachbegriff sichtbar.
theological_decisions:
- issue: Personifikation des Glaubens
  choice: „der Glaube kam“ ohne zusätzliche dogmatische Bestimmung
  alternative: „Pistis kam“ als ausdrücklich benannte Hypostase
  rationale: Die Grammatik und der Zusammenhang erlauben eine Personifikation, erzwingen aber keine ausgearbeitete Äonenlehre. Die Übersetzung wahrt diese Spannung und erläutert sie knapp in der Fußnote.
- issue: Technische kosmologische Begriffe
  choice: Materie, Fülle, Liebe und Wort auf Deutsch, mit knappen Fachhinweisen
  alternative: Hylē, Pleroma, Agapē und Logos unübersetzt stehen lassen
  rationale: Deutsche Wiedergaben sind für gewöhnliche Leser verständlicher. Die Fußnoten bewahren zugleich den besonderen griechisch-kosmologischen Wortlaut.
- issue: Handelndes Subjekt beim Bergen des Duftes
  choice: „der Vater“ zur Klarheit wiederholt
  alternative: das mehrdeutige Pronomen „er“
  rationale: Der unmittelbare Zusammenhang führt den Duft in den Duft des Vaters hinein und beschreibt anschließend sein Bergen und Zurückbringen. Die Wiederholung macht den deutschen Satz verständlich, ohne eine zusätzliche Heilslehre einzutragen.
- issue: Schlusssatz über das Wort und die Fülle
  choice: Das Wort offenbart den Wartenden die Entdeckung der Fülle
  alternative: Abbruch nach „Dies ist das Wort, das offenbarte“
  rationale: Die letzten erhaltenen koptischen Wörter des Abschnitts nennen ausdrücklich die Entdeckung der Fülle und diejenigen, die darauf warten; sie gehören daher in den Text.
translation_notes:
  register: Moderner, würdevoller Mahn- und Lehrstil mit direkter Anrede im Plural. Kurze Imperative bewahren den eindringlichen Rhythmus des koptischen Textes. Die dichte Duft-, Wärme- und Erdmetaphorik bleibt bewusst stehen und wird nicht zu einem dogmatischen System ausgedeutet. Griechische Fachwörter werden überwiegend verständlich übersetzt und nur dort in Fußnoten erläutert, wo ihre technische Bedeutungsfülle für den Abschnitt wesentlich ist.
