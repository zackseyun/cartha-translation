  consult_excerpt: As for the others, then, may they know, where they’re at, that it’s not right 43 for me, having come to the place of rest, to say anything else, but I’ll come to be in it, and will devote myself continually to the Father of all and the true brothers (and sisters), those upon whom the Father’s love is emptied and in whose midst there is no need. They’re the ones who are revealed in Truth; they exist in the true eternal life, and they speak of the light that’s complete and that’s filled with the Father’s seed, and that’s in his heart and in the fullness. His Spirit rejoices in it, and glorifies the one in whom it existed, because he’s good. And his children are complete, and worthy of his name, because he’s the Father. It’s children like this that he loves.
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/016.yaml
  text: 'As for the others, may they recognize where they stand. But as for me—having come to the Place of Rest—it is proper not to add anything further; rather, I will come to be in it, and I will devote myself without ceasing to the Father of the All and to the true siblings: those upon whom the love of the Father has been poured, and in whose midst there is no deficiency.


    These are the ones revealed in the Truth; they exist in the true life, and they speak of the Light that is complete and filled with the Father’s seed, that is in his heart and in the Fullness. His Spirit rejoices in it and glorifies the one in whom it existed, because he is good. And his children are complete and worthy of his name, for he is the Father; such are the children whom he loves.


    [… large lacuna in the manuscript …]


    Yet there are some whose thoughts are upon toil: they become drunk in seeking, and they lose their mind. But the holy ones are those whose thought has not been defiled by wickedness; their thought remains within them. For the Logos of the Thought searches out what is above—his unsayability—I have [borne/spoken] by means of the mouth of all: the Good—the Messiah.'
translation:
  language: de
  text: 'Was die Übrigen betrifft, so sollen sie erkennen, woher sie sind. Für mich aber, der ich zum Ort der Ruhe gekommen bin, ist es nicht angemessen, noch etwas hinzuzufügen. Vielmehr werde ich in ihm sein und mich allezeit dem Vater des Alls[a] und den wahren Geschwistern[b] widmen: denen, über die sich die Liebe des Vaters ergossen hat und in deren Mitte kein Mangel ist.


    Sie sind es, die in der Wahrheit offenbar geworden sind. Sie leben im wahren Leben und sprechen von dem Licht, das vollkommen und vom Samen des Vaters erfüllt ist, das in seinem Herzen und in der Fülle[c] ist. Sein Geist freut sich darüber und verherrlicht den, in dem es war, denn er ist gut. Auch seine Kinder sind vollkommen und seines Namens würdig; denn er ist der Vater. Solche Kinder sind es, die er liebt.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Das All“ bezeichnet hier die Gesamtheit in einem theologisch geprägten Sinn.
    reason: Der substantivierte koptische Gesamtbegriff kann sonst fälschlich nur als gewöhnliches „alles“ verstanden werden.
  - marker: b
    text: 'Wörtlich: „den wahren Brüdern“; der Ausdruck kann die ganze Gemeinschaft einschließen.'
    reason: Die inklusive deutsche Wiedergabe soll transparent gemacht werden.
  - marker: c
    text: „Fülle“ gibt den griechisch-koptischen Begriff Pleroma wieder.
    reason: Der technische Hintergrund ist für das Verständnis wichtig, soll den Haupttext aber nicht mit einer Transliteration belasten.
  - marker: d
    text: Hier endet der verlässlich lesbare Text. Der in den gelieferten OCR-Daten nach einer sehr großen Lücke erscheinende weitere Absatz ist als fehlerhafte Bilderkennung anzusehen und wurde nicht übersetzt.
    reason: Kennzeichnet die erhebliche Unsicherheit des maschinell erzeugten Seitenmaterials und verhindert, dass nicht sichtbarer Text als Manuskriptinhalt veröffentlicht wird.
lexical_decisions:
- source_word: ⲙ̄ⲡⲙⲁ ⲛ̄ⲙ̄ⲧⲁⲛ
  choice: Ort der Ruhe
  rationale: Bewahrt das im Traktat theologisch aufgeladene Motiv der Ruhe, ohne durch eine übermäßige Technisierung mehr festzulegen als der koptische Ausdruck.
- source_word: ⲡⲧⲏⲣϥ̄
  choice: das All
  rationale: Gibt den substantivierten Gesamtbegriff knapp wieder und erhält seinen kosmologisch-theologischen Charakter.
- source_word: ⲧⲁⲅⲁⲡⲏ
  choice: Liebe
  rationale: Natürliche und semantisch direkte Wiedergabe des griechischen Lehnworts agapē.
- source_word: ϣⲧⲁⲣⲧⲉϥ
  choice: Mangel
  rationale: Der Kontext stellt den Zustand der Gemeinschaft als frei von einem Defizit dar; „Mangel“ ist verständlich und lässt die mögliche technische Gegenüberstellung zur Fülle erkennen.
- source_word: ⲡⲟⲩⲁⲉⲓⲛ
  choice: das Licht
  rationale: Der bestimmte Ausdruck wird beibehalten; Kleinschreibung vermeidet eine unnötige Festlegung auf eine ausdrücklich personifizierte Größe.
- source_word: ϫⲏⲕ ⲉⲃⲟⲗ
  choice: vollkommen
  rationale: Bezeichnet Vollendung beziehungsweise Ganzheit. „Vollkommen“ trägt hier den feierlichen Ton und passt sowohl zum Licht als auch zu den Kindern.
- source_word: ⲥⲡⲉⲣⲙⲁ
  choice: Samen
  rationale: Erhält die Zeugungs- und Herkunftsmetaphorik des griechischen Lehnworts.
- source_word: ⲡⲗⲏⲣⲱⲙⲁ / mutmaßlich ⲡⲓⲡ[…]
  choice: die Fülle
  rationale: Gibt den in diesem Schrifttum geprägten Begriff verständlich auf Deutsch wieder; die Fußnote nennt die traditionelle Form „Pleroma“.
- source_word: ⲡⲛⲁ
  choice: Geist
  rationale: Direkte Wiedergabe des abgekürzten griechischen Lehnworts pneuma; der Possessivausdruck „sein“ lässt die Beziehung zum Vater offen genug.
- source_word: ⲛⲉϥϣⲏⲣⲉ
  choice: seine Kinder
  rationale: Entspricht dem koptischen Ausdruck und bewahrt das abschließende Vater-Kinder-Motiv.
theological_decisions:
- issue: Technischer oder allgemeinsprachlicher Sinn von „das All“ und „die Fülle“
  choice: Deutsche Sachbegriffe im Haupttext, mit knapper Erläuterung in Fußnoten
  alternative: Transliterationen „Pleroma“ und gegebenenfalls ein stärker systematisierter kosmologischer Wortschatz
  rationale: So bleiben die valentinianisch geprägten Anklänge sichtbar, ohne dem Text ein vollständig ausgearbeitetes Lehrsystem aufzuzwingen.
- issue: Geschlechtsbezeichnung der „wahren Brüder“
  choice: „wahre Geschwister“
  alternative: „wahre Brüder“
  rationale: Der koptische maskuline Plural kann eine gemischte Gemeinschaft einschließen. „Geschwister“ gibt diese mögliche inklusive Reichweite im heutigen Deutsch wieder, während die Fußnote die wörtlichere Form nennt.
- issue: Bezug von „in dem es war“
  choice: Das mehrdeutige Pronomengefüge bleibt erhalten
  alternative: Explizite Identifikation der Person mit Christus oder ausdrückliche Zuordnung des Lichts zu einer bestimmten Gestalt
  rationale: Der koptische Satz benennt den Bezug nicht eindeutig genug; eine christologische Identifikation wäre interpretierende Ergänzung.
- issue: Angeblicher Text nach dem Abschlusssatz
  choice: Nicht in den Haupttext aufgenommen
  alternative: Übersetzung des von der OCR erzeugten Absatzes über Mühe, Trunkenheit, Logos und „Chrestos/Christos“
  rationale: Nach einer sehr langen Folge von Platzhalterzeichen liefert die OCR einen sprachlich verdächtigen Zusatz; sie brach zudem wegen der Tokenbegrenzung ab. Der verlässliche Seitenbefund und der Konsultationsauszug tragen den Text nur bis „die er liebt“. Der Zusatz wird daher nicht als sichtbarer Manuskripttext behandelt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit ruhigem, meditativem Satzfluss. Theologisch geprägte Begriffe werden verständlich deutsch wiedergegeben; Großschreibung wird nur nach deutscher Grammatik verwendet, nicht zur stillschweigenden Personifizierung. Die Übersetzung folgt dem tragfähigen koptischen Seitenbefund und nicht dem offenbar halluzinierten OCR-Zusatz.
