revisions:
- from: 'Das Evangelium der Wahrheit ist Freude für alle, die vom Vater der Wahrheit Gnade empfangen haben, damit sie ihn erkennen durch die Kraft des Wortes, das aus der Fülle[a] hervorgegangen ist – des Wortes, das im Denken und im Sinn des Vaters ist. Es wird »Retter« genannt; denn dies ist der Name des Werkes, das es vollbringen wird, um alle zu retten, die den Vater nicht mehr kannten. Und der Name »Evangelium« bedeutet: Die Hoffnung wird offenbar; wer ihn sucht, findet ihn.'
  to: Das Evangelium der Wahrheit ist Freude für alle, die vom Vater der Wahrheit Gnade empfangen haben, damit sie ihn erkennen durch die Kraft des Wortes, das aus der Fülle[a] hervorgegangen ist – des Wortes, das im Denken und im Sinn des Vaters ist. Es wird »Retter« genannt; denn dies ist der Name des Werkes, das es vollbringen wird, um alle zu retten, die den Vater nicht mehr kannten. Und der Name »Evangelium« ist die Offenbarung dessen, worauf man hofft, das Finden derer, die ihn suchen.
  rationale: Die Revision beschränkt sich auf den Schlusssatz. Sie ersetzt die interpretierende Aussage, dass Suchende ihn tatsächlich finden, durch eine nahe am koptischen Nominalstil bleibende Formulierung. „Dessen, worauf man hofft“ erhält zudem die semantische Offenheit der Quelle besser als „die Hoffnung wird offenbar“. Fußnotenanker und Fußnote bleiben korrekt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T10:07:53Z'
review_pass:
  verdict: revise
  source_fidelity: 'Der Hauptsatz und die Terminologie entsprechen dem koptischen Text im Wesentlichen: Evangelium, Wahrheit, Vater, Gnade, Kraft, Wort, Fülle/Pleroma und Retter sind angemessen wiedergegeben. Der Schlusssatz ist jedoch nicht quellentreu genug: Die Vorlage bezeichnet den Namen „Evangelium“ als „Offenbarung dessen, worauf man hofft“ und als „Finden derer, die ihn suchen“. Die Fassung „wer ihn sucht, findet ihn“ macht daraus eine ausdrückliche Erfolgszusage und verändert damit die nominale, bewusst knappe Konstruktion.'
  naturalness: Die Sprache ist modernes, würdiges Standarddeutsch. Die überarbeitete Schlussformulierung bleibt idiomatisch, ohne die Aussage durch eine freie Verbalisierung zu erweitern.
  terminology: „Wort“ bewahrt die Personifizierung ohne dogmatisch festlegendes „Logos“; „Retter“ gibt σωτήρ direkt wieder. „Fülle“ ist als Übersetzung von πλήρωμα tragfähig, während die Fußnote die mögliche technische Verwendung von „Pleroma“ korrekt dokumentiert. „Sinn“ für νοῦς ist im Paar „Denken und Sinn“ vertretbar.
  issues:
  - severity: medium
    issue: Der Schlusssatz fügt eine Erfolgszusage hinzu.
    rationale: '„Wer ihn sucht, findet ihn“ ist stärker als die Vorlage. Diese spricht von der Offenbarung dessen, worauf man hofft, und vom Finden derer, die ihn suchen; sie formuliert nicht ausdrücklich: Jeder Suchende findet ihn.'
  - severity: low
    issue: „Die Hoffnung wird offenbar“ verengt die Genitivfügung.
    rationale: Die Wendung lässt sich genauer als „Offenbarung dessen, worauf man hofft“ wiedergeben. Dadurch bleibt offen, ob die Hoffnung selbst oder ihr erhoffter Gegenstand im Blick ist.
  revised_text: Das Evangelium der Wahrheit ist Freude für alle, die vom Vater der Wahrheit Gnade empfangen haben, damit sie ihn erkennen durch die Kraft des Wortes, das aus der Fülle[a] hervorgegangen ist – des Wortes, das im Denken und im Sinn des Vaters ist. Es wird »Retter« genannt; denn dies ist der Name des Werkes, das es vollbringen wird, um alle zu retten, die den Vater nicht mehr kannten. Und der Name »Evangelium« ist die Offenbarung dessen, worauf man hofft, das Finden derer, die ihn suchen.
  revised_footnotes:
  - marker: a
    text: 'Oder: »aus dem Pleroma«. Das griechische Lehnwort bezeichnet die »Fülle« und kann hier zugleich als Fachausdruck für die göttliche Fülle verstanden werden.'
    reason: Der Ausdruck ⲡⲡⲗⲏⲣⲱⲙⲁ kann entweder übersetzt oder als theologischer Fachbegriff transliteriert werden.
  revision_rationale: Die Revision beschränkt sich auf den Schlusssatz. Sie ersetzt die interpretierende Aussage, dass Suchende ihn tatsächlich finden, durch eine nahe am koptischen Nominalstil bleibende Formulierung. „Dessen, worauf man hofft“ erhält zudem die semantische Offenheit der Quelle besser als „die Hoffnung wird offenbar“. Fußnotenanker und Fußnote bleiben korrekt.
