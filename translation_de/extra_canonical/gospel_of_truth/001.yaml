base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/001.yaml
  text: The Gospel of Truth is joy for those who have received grace from the Father of Truth[a], so that they might know him through the power of the Word that came forth from the Pleroma—the one who is in the thought and the mind of the Father. He is called “Savior”; that is the name of the work he will do to save those who had become ignorant of the Father. And the name “Gospel” is the revelation of hope, the discovery for those who seek him.
translation:
  language: de
  text: Das Evangelium der Wahrheit ist Freude für alle, die vom Vater der Wahrheit Gnade empfangen haben, damit sie ihn erkennen durch die Kraft des Wortes, das aus der Fülle[a] hervorgegangen ist – des Wortes, das im Denken und im Sinn des Vaters ist. Es wird »Retter« genannt; denn dies ist der Name des Werkes, das es vollbringen wird, um alle zu retten, die den Vater nicht mehr kannten. Und der Name »Evangelium« ist die Offenbarung dessen, worauf man hofft, das Finden derer, die ihn suchen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »aus dem Pleroma«. Das griechische Lehnwort bezeichnet die »Fülle« und kann hier zugleich als Fachausdruck für die göttliche Fülle verstanden werden.'
    reason: Der Ausdruck ⲡⲡⲗⲏⲣⲱⲙⲁ kann entweder übersetzt oder als theologischer Fachbegriff transliteriert werden.
lexical_decisions:
- source_word: ⲡⲉⲩⲁⲅⲅⲉⲗⲓⲟⲛ
  choice: Evangelium
  rationale: Das griechische Lehnwort wird hier als benannter theologischer Ausdruck gebraucht; »Evangelium« bewahrt sowohl den frühchristlichen Klang als auch die anschließende Deutung seines Namens.
- source_word: ⲧⲙⲏⲉ
  choice: Wahrheit
  rationale: Direkte und im Kontext unstrittige Wiedergabe.
- source_word: ⲡⲓⲱⲧ
  choice: Vater
  rationale: Bewahrt den wiederkehrenden Gottesnamen beziehungsweise Gottestitel des Textes.
- source_word: ⲧϭⲁⲙ
  choice: Kraft
  rationale: Bezeichnet hier die wirksame Kraft, durch die Erkenntnis ermöglicht wird.
- source_word: ⲡⲓϣⲉϫⲉ / ⲡⲥⲁϫⲉ
  choice: Wort
  rationale: Das gewöhnliche Wort für »Wort/Ausspruch« erscheint personifiziert. »Wort« ist verständlich und wahrt den Logos-Anklang, ohne das griechische Fachwort einzusetzen.
- source_word: ⲡⲡⲗⲏⲣⲱⲙⲁ
  choice: Fülle
  rationale: Das griechische Lehnwort πλήρωμα bedeutet »Fülle«. Die Übersetzung macht den Sinn unmittelbar zugänglich; der technische Ausdruck wird in der Fußnote genannt.
- source_word: ⲛⲟⲩⲥ
  choice: Sinn
  rationale: Das griechische νοῦς bezeichnet Geist, Verstand oder geistiges Erfassen. »Sinn« lässt sich natürlich mit »Denken« paaren und bewahrt die Unterscheidung der beiden Erkenntnisbegriffe.
- source_word: ⲡⲥⲱⲧⲏⲣ
  choice: Retter
  rationale: Direkte Wiedergabe des griechischen Lehnworts σωτήρ und zugleich sprachliche Verbindung mit dem folgenden Werk des Rettens.
- source_word: ⲡⲟⲩⲱⲛϩ ⲃⲁⲗ
  choice: wird offenbar
  rationale: Die Wendung bezeichnet ein Öffnen, Enthüllen oder Offenbarwerden; die verbale Form wirkt im Deutschen natürlicher als das abstrakte Substantiv »Offenbarung«.
- source_word: ⲕⲱⲧⲉ ⲛⲥⲱϥ
  choice: ihn sucht
  rationale: Gibt die zielgerichtete Suche knapp und idiomatisch wieder.
- source_word: ⲣⲁⲛ
  choice: Name
  rationale: Der koptische Text spricht ausdrücklich vom »Namen« und stellt so die Bezeichnungen »Retter« und »Evangelium« rhetorisch nebeneinander.
theological_decisions:
- issue: Personifizierung des Wortes
  choice: »Wort« als sächliches, handelndes Bezugswort
  alternative: »Logos« oder unpersönliches »Wort«
  rationale: Das aus der Fülle hervorgegangene Wort wird benannt und vollbringt ein rettendes Werk. Die Übersetzung wahrt diese Personifizierung, ohne durch »Logos« eine weitergehende dogmatische Identifikation festzuschreiben.
- issue: Wiedergabe von πλήρωμα
  choice: Fülle
  alternative: Pleroma
  rationale: »Fülle« übersetzt den Ausdruck, statt ihn nur zu transliterieren. Die mögliche fachsprachliche Bedeutung bleibt durch die Fußnote sichtbar.
- issue: Bedeutung des Retter-Namens
  choice: rettet diejenigen, die den Vater nicht mehr kannten
  alternative: erlöst diejenigen, die den Vater nicht kannten
  rationale: »Retter/retten« erhält die Wortverbindung im Text. »Nicht mehr kannten« gibt den resultativen Charakter wieder, ohne festzulegen, auf welche Weise die Unkenntnis entstand.
- issue: Schlusssatz über das Evangelium
  choice: »Die Hoffnung wird offenbar; wer ihn sucht, findet ihn«
  alternative: »die Offenbarung der Hoffnung, die Entdeckung für diejenigen, die ihn suchen«
  rationale: Die verbale Fassung ist natürliches Deutsch und erhält die beiden parallelen Vorgänge des Offenbarwerdens und Findens. Sie vermeidet, »Entdeckung« missverständlich als bloßen Gegenstand zu behandeln.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst kurzen Sinnabschnitten. Die parallele Namensdeutung von »Retter« und »Evangelium« bleibt erhalten. Abstrakte koptische Wendungen werden dort verbal formuliert, wo dies die Verständlichkeit erhöht, ohne die theologischen Spannungen zwischen Erkenntnis, Offenbarung und Rettung aufzulösen.
