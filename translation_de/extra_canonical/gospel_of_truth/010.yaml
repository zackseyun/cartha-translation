  consult_excerpt: 'He’s the shepherd who left behind the ninety- 32 nine sheep which weren’t lost. He went and searched for the one which was lost. He rejoiced when he found it, because ninety-nine is a number expressed with the left hand. However, when the one is found, the numerical sum moves to the right hand. In this way, what needs the one – that is, the whole right hand – draws what it needs, takes it from the left hand, and moves it to the right, so the number becomes one hundred. This is a symbol of the sound of these numbers; this is the Father.

    Even on the Sabbath, he worked for the sheep which he found fallen in the pit. He saved the life of the sheep, having brought it up from the pit, so that you may know in your hearts – you’re children of the knowledge of the heart – what is the Sabbath, on which it isn’t right for salvation to be idle, so that you may speak of the day which is above, which has no night, and of the light that doesn’t set, because it’s complete. Speak then from the heart, because you’re the completed day, and the light that doesn’t cease dwells within you. Speak of the Truth with those who search for it, and of knowledge with those who’ve sinned in their Error.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/010.yaml
  text: 'He is the shepherd who left the ninety‑nine sheep that had not gone astray[a], and he went and sought the one that had wandered. When he found it, he rejoiced over it, because ninety‑nine is a number on the left hand. But when the one is found, the reckoning moves to the right hand. In this way, what needs the one—that is, the whole of the right hand—draws what it needs, taking it from the left hand and transferring it to the right, so that the number becomes a hundred. This is a sign of the sound of these numbers; it is the Father.


    Even on the Sabbath he labored for the sake of the sheep that he found fallen into the pit. He saved the life of the sheep, having brought it up out of the pit, so that you may know in your heart—since you are children of the knowledge of the heart—what the Sabbath is: that on it it is not fitting for salvation to be idle, so that you may speak of the Day which is above, which has no night, and of the Light that does not set, because it is complete. Speak, then, from the heart, for you are the perfect Day, and the light that does not fail dwells within you. Speak of the Truth with those who seek it[b], and of Knowledge with those who have sinned in their Error.'
translation:
  language: de
  text: 'Er ist der Hirte, der die neunundneunzig Schafe zurückließ, die sich nicht verirrt hatten. Er ging und suchte das eine, das umherirrte. Als er es fand, freute er sich darüber; denn neunundneunzig ist eine Zahl, die mit der linken Hand dargestellt wird. Wird aber das eine gefunden, geht die Zählung auf die rechte Hand über. So zieht die ganze rechte Hand, die das eine braucht, das, was sie braucht, von der linken Hand an sich und überträgt es auf die rechte, sodass die Zahl hundert wird. Dies ist ein Zeichen für den Klang dieser Zahlen; es ist der Vater.


    Selbst am Sabbat mühte er sich um das Schaf, das er in die Grube gefallen vorfand. Er rettete das Leben des Schafes und holte es aus der Grube herauf. So sollt ihr in eurem Herzen erkennen – denn ihr seid Kinder der Erkenntnis des Herzens –, was der Sabbat ist: An ihm darf die Rettung nicht untätig bleiben. Dann könnt ihr von dem Tag droben sprechen, der keine Nacht hat, und von dem Licht, das nicht untergeht, weil es vollkommen ist. Sprecht also aus dem Herzen; denn ihr seid der vollkommene Tag, und das Licht, das nicht erlischt, wohnt in euch. Sprecht über die Wahrheit mit denen, die nach ihr suchen, und über die Erkenntnis mit denen, die in ihrem Irrtum gesündigt haben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲥⲁⲩ
  choice: Schaf/Schafe
  rationale: Das reguläre koptische Wort bezeichnet hier zunächst die neunundneunzig Schafe und danach ausdrücklich das einzelne Schaf.
- source_word: ⲥⲱⲣⲙ / ⲡⲗⲁⲛⲁ
  choice: sich verirren / umherirren
  rationale: Die beiden unterschiedlichen Verben werden im Deutschen unterschieden; das zweite wird nicht mit dem substantivischen, personifizierten »Irrtum« vermengt.
- source_word: ⲟⲩⲱⲡⲉ
  choice: Zahl / Zählung
  rationale: Der Zusammenhang handelt von der Darstellung und Berechnung von 99, 1 und 100 mit den Händen.
- source_word: ⲧⲁⲉⲓⲉ / ⲙⲣⲏⲧⲉ
  choice: linke Hand / rechte Hand
  rationale: Die ausgeschriebenen Hände verdeutlichen das antike System des Fingerzählens und bewahren den Gegensatz.
- source_word: ⲥⲁⲃⲃⲁⲧⲟⲛ
  choice: Sabbat
  rationale: Der etablierte deutsche Fachbegriff bewahrt den jüdischen kalendarischen Bezug.
- source_word: ⲡⲟⲩϫⲁⲉⲓ
  choice: Rettung
  rationale: Im unmittelbaren Bild geht es um die konkrete Rettung des Schafes; zugleich bleibt die soteriologische Bedeutung erhalten.
- source_word: ϫⲏⲕ
  choice: vollkommen
  rationale: Das Wortfeld umfasst vollständig, vollendet und vollkommen; hier passt »vollkommen« zur Aussage über Licht und Tag.
- source_word: ⲡⲗⲁⲛⲏ
  choice: Irrtum
  rationale: Am Schluss bezeichnet das griechische Lehnwort den Irrtum als theologisch aufgeladenen Gegenpol zur Erkenntnis; die Formulierung lässt offen, wie stark er personifiziert gedacht ist.
theological_decisions:
- issue: Personifizierung von ⲡⲗⲁⲛⲏ
  choice: »in ihrem Irrtum« ohne Großschreibung
  alternative: »im Irrtum« bzw. personifiziert »im Irrtum« mit typografischer Hervorhebung
  rationale: Der Kontext stellt Irrtum und Erkenntnis einander gegenüber, doch das Deutsche kann die sachliche und die nahezu personifizierte Lesart ohne künstliche Festlegung tragen.
- issue: Sabbat und Rettung
  choice: »An ihm darf die Rettung nicht untätig bleiben«
  alternative: »An ihm ist es nicht recht, dass die Rettung ruht«
  rationale: Die paradoxe soteriologische Aussage wird bewahrt und nicht zu einer allgemeinen Sabbatregel ausgeweitet.
- issue: Transzendenter Tag und Licht
  choice: Tag und Licht als bildhafte theologische Größen, ohne zwingende Personifizierung
  alternative: 'Großschreibung als Titel: »Tag« und »Licht«'
  rationale: Die Bildsprache bleibt erkennbar, während die deutsche Normalschreibung keine zusätzliche hypostatische Festlegung importiert.
- issue: Klang der Zahlen und der Vater
  choice: Die schwierige Aussage wird eng als »Zeichen für den Klang dieser Zahlen; es ist der Vater« wiedergegeben
  alternative: »Zeichen dessen, der in ihrem Klang ist; er ist der Vater«
