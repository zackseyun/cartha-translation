revisions:
- from: 'Er ist der Hirte, der die neunundneunzig Schafe zurückließ, die sich nicht verirrt hatten. Er ging fort und suchte das eine, das umherirrte. Als er es fand, freute er sich darüber; denn neunundneunzig ist eine Zahl, die mit der linken Hand dargestellt wird. Wird aber das eine gefunden, geht die Zählung auf die rechte Hand über. So zieht das, dem das eine fehlt – nämlich die ganze rechte Hand –, das Benötigte an sich: Es nimmt es von der linken Hand und überträgt es auf die rechte, sodass die Zahl hundert wird. Dies ist ein Zeichen für den Klang dieser Zahlen; es ist der Vater.[a]


    Selbst am Sabbat mühte er sich um das Schaf, das er in die Grube gefallen vorfand. Er rettete das Leben des Schafes und holte es aus der Grube herauf. So sollt ihr in eurem Herzen erkennen – denn ihr seid Kinder der Erkenntnis des Herzens –, was der Sabbat ist: An ihm darf die Rettung nicht untätig bleiben. Dann könnt ihr von dem Tag droben sprechen, der keine Nacht hat, und von dem Licht, das nicht untergeht, weil es vollkommen ist. Sprecht also aus dem Herzen; denn ihr seid der vollkommene Tag, und das Licht, das nicht erlischt, wohnt in euch. Sprecht über die Wahrheit mit denen, die nach ihr suchen, und über die Erkenntnis mit denen, die in ihrem Irrtum gesündigt haben.'
