  consult_excerpt: 'His Wisdom meditates on the Word,

    his teaching speaks it,

    his knowledge has revealed it,

    his patience is a crown upon it,

    his joy is in harmony with it,

    his glory has exalted it,

    his image has revealed it,

    his rest has received it,

    his love made a body around it,

    his faith embraced it.

    In this way, the Word of the Father goes out in all, as the fruit 24 [of] his heart and an expression of his will. But it supports all. It chooses them and also takes the expression of all, purifying them, returning them to the Father and to the Mother, Jesus of infinite sweetness.

    The Father reveals his bosom, and his bosom is the Holy Spirit. He reveals what’s hidden of himself; what’s hidden of himself is his Son – so that through the mercies of the Father, the generations may know him and cease their work in searching for the Father, resting in him and knowing that this is the rest. He’s filled the need and dissolved its appearance – its appearance is the world in which it served, because where there’s envy and strife there’s need, but where there’s Unity there’s completion. Since need came into being because the Father wasn’t known, when the Father is known, from then on, need will no longer exist. As someone’s ignorance dissolves when they gain knowledge, and as darkness dissolves when the light appears, 25 so also need dissolves in completion. So the appearance is revealed from then on, but it’ll dissolve in the harmony of Unity.

    For now, their works lie scattered. In time, Unity will complete the realms. Within Unity each one will receive themselves, and within knowledge they’ll purify themselves from multiplicity into Unity, consuming matter within themselves like fire, and darkness by light, death by life. If indeed these things have happened to each one of us, then it’s right for us to think about all, so that this house will be holy and silent for the Unity.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/005.yaml
  text: 'Jesus of the infinite sweetness[a].


    The Father made his bosom known; his bosom is the Holy Spirit. He manifested what is hidden of himself; what is hidden of himself is his Son, so that, through the mercies of the Father, the Aeons might know him, cease from searching for the Father, and rest in him, knowing that this is the Rest.


    The Father filled the deficiency and dissolved its appearance—its appearance is the world in which it had served. For in the place where there is envy and strife, there is deficiency; but in the place where there is Unity, there is completion. Since the deficiency came to be because the Father was not known, when the Father is known, from that time the deficiency will no longer be—just as a person’s ignorance is dissolved when knowledge is present, and just as darkness is dissolved when the light appears. So also the deficiency is dissolved by the completion. From then on its appearance is no longer manifest, and it will be dissolved in the concord of Unity.


    For now their works are scattered; but in time Unity will complete the Aeons. Within Unity each one will receive himself, and within Knowledge they will purify themselves from multiplicity into Unity—consuming matter within themselves like fire, and darkness by light, and death by life. If indeed these things have happened to each of us, it is necessary to think concerning the All[d][c][b], so that this house may be holy and still for the sake of Unity.'
translation:
  language: de
  text: 'Jesus von unendlicher Süße.


    Der Vater offenbarte seinen Schoß; sein Schoß ist der Heilige Geist. Er offenbarte, was in ihm verborgen ist; und was in ihm verborgen ist, ist sein Sohn. So sollten die Äonen durch das Erbarmen des Vaters ihn erkennen, aufhören, nach dem Vater zu suchen, und in ihm ruhen, weil sie wissen: Dies ist die Ruhe.


    Der Vater füllte den Mangel aus und löste dessen Erscheinungsform auf — seine Erscheinungsform ist die Welt, in der er gedient hatte. Denn wo Neid und Streit herrschen, da ist Mangel; wo aber Einheit ist, da ist Vollendung. Weil der Mangel dadurch entstand, dass der Vater nicht erkannt wurde, wird er von dem Zeitpunkt an nicht mehr bestehen, an dem der Vater erkannt wird. Ebenso löst sich die Unwissenheit eines Menschen auf, wenn er Erkenntnis erlangt, und die Finsternis löst sich auf, wenn das Licht erscheint. So löst sich auch der Mangel durch die Vollendung auf. Von da an ist seine Erscheinungsform nicht mehr sichtbar[a], sondern sie wird sich in der Harmonie der Einheit auflösen.


    Jetzt liegen ihre Werke noch verstreut; doch zu gegebener Zeit wird die Einheit die Äonen vollenden. In der Einheit wird jeder sich selbst empfangen, und in der Erkenntnis werden sie sich von der Vielheit zur Einheit hin läutern. Sie werden die Materie in sich wie Feuer verzehren, die Finsternis durch Licht und den Tod durch Leben. Wenn dies tatsächlich an jedem von uns geschehen ist, müssen wir über das All nachdenken, damit dieses Haus heilig und still sei um der Einheit willen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Verneinung „nicht“ ist in der OCR-Zeile ausgefallen, gehört nach der überprüften Lesung des Manuskripts jedoch zum Satz.
    reason: Textkritische Sicherung einer sinnentscheidenden Negation.
lexical_decisions:
- source_word: ⲙⲛⲧⲁⲧⲥⲟⲟⲩⲛ
  choice: Unwissenheit
  rationale: Bewahrt den ausdrücklichen Gegensatz zur Erkenntnis, ohne das abstraktere „Nichtwissen“ zu erzwingen.
- source_word: ⲧⲙⲛⲧⲟⲩⲉⲉⲓⲛ / ⲙⲛⲧⲟⲩⲉⲉⲓ
  choice: Einheit
  rationale: Gibt den technischen valentinianischen Begriff verständlich wieder; die Großschreibung ist im Deutschen nicht nötig, da das Substantiv ohnehin großgeschrieben wird.
- source_word: ⲥⲭⲏⲙⲁ
  choice: Erscheinungsform
  rationale: Erfasst sowohl „Gestalt/Form“ als auch den Kontrast zwischen äußerer Erscheinung und ihrer Auflösung.
- source_word: ⲕⲟⲥⲙⲟⲥ
  choice: Welt
  rationale: Natürliche deutsche Entsprechung für den gegenwärtigen Weltzusammenhang.
- source_word: ⲧϩⲩⲗⲏ
  choice: Materie
  rationale: Behält den philosophischen Fachsinn des griechischen Lehnworts hylē bei.
- source_word: ⲁⲓⲱⲛ
  choice: Äonen
  rationale: Bewahrt den kosmologischen Fachbegriff und vermeidet die irreführende Verengung auf bloße Zeitabschnitte.
- source_word: ⲥⲁⲩⲛⲉ
  choice: Erkenntnis
  rationale: Passt zum soteriologischen Erkenntnismotiv und bildet den klaren Gegenpol zu „Unwissenheit“.
- source_word: ⲡⲏⲡ / ⲡⲉⲑⲏⲡ
  choice: Schoß
  rationale: Bewahrt das Bild inniger Verborgenheit und die traditionelle johanneische Resonanz.
- source_word: ⲃⲱⲗ ⲁⲃⲁⲗ
  choice: auflösen
  rationale: Die wiederholte Wiedergabe macht die leitende Bildfolge von Unwissenheit, Finsternis, Mangel und Erscheinungsform sichtbar.
- source_word: ⲡⲧⲏⲣϥ
  choice: das All
  rationale: Bewahrt die kosmologische Weite des substantivierten Ausdrucks, statt ihn vorschnell als „alle Menschen“ zu deuten.
theological_decisions:
- issue: Identifikation des Schoßes des Vaters mit dem Heiligen Geist
  choice: „sein Schoß ist der Heilige Geist“
  alternative: Den Schoß nur als Bild für Gottes innerste Gegenwart umschreiben
  rationale: Die koptische Gleichsetzung ist ausdrücklich; die Übersetzung erhält sie, ohne sie systematisch auszudeuten.
- issue: Verhältnis von Mangel, Welt und Vollendung
  choice: Die Welt als Erscheinungsform des Mangels wiedergeben, die durch Vollendung aufgelöst wird
  alternative: Die Welt selbst unmittelbar mit dem Mangel gleichsetzen
  rationale: Der Text unterscheidet den Mangel von seiner ⲥⲭⲏⲙⲁ und bewahrt dadurch eine echte ontologische Spannung.
- issue: Selbstempfang innerhalb der Einheit
  choice: „jeder [wird] zu sich selbst gelangen“
  alternative: „jeder wird sich selbst empfangen“
  rationale: Die gewählte Form ist im heutigen Deutsch verständlicher, lässt aber die Vorstellung der Wiedergewinnung des eigenen Selbst bestehen.
- issue: Zweck des heiligen und stillen Hauses
  choice: „um der Einheit willen“
  alternative: „für die Einheit“
  rationale: Gibt den finalen Bezug wieder, ohne das Haus eindeutig als Kultgebäude, Gemeinde oder kosmischen Ort festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klaren Satzperioden. Technische Begriffe wie „Äonen“, „Einheit“, „Erkenntnis“, „Materie“ und „das All“ bleiben erhalten, werden aber in eine allgemein verständliche Syntax eingebettet. Die anaphorische Wiederholung von „auflösen“ bildet bewusst die rhetorische Struktur des koptischen Textes nach.
