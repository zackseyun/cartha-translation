- from: 'Jesus von unendlicher Süße.


    Der Vater offenbarte seinen Schoß; sein Schoß ist der Heilige Geist. Er offenbarte, was in ihm verborgen ist; und was in ihm verborgen ist, ist sein Sohn. So sollten die Äonen durch das Erbarmen des Vaters ihn erkennen, aufhören, sich bei ihrer Suche nach dem Vater abzumühen, und in ihm ruhen, weil sie wissen: Dies ist die Ruhe.


    Der Vater füllte den Mangel aus und löste dessen Erscheinungsform auf — seine Erscheinungsform ist die Welt, der er gedient hatte. Denn wo Neid und Streit herrschen, da ist Mangel; wo aber Einheit ist, da ist Vollendung. Weil der Mangel dadurch entstand, dass der Vater nicht erkannt wurde, wird er von dem Zeitpunkt an nicht mehr bestehen, an dem der Vater erkannt wird. Ebenso löst sich die Unwissenheit eines Menschen auf, wenn er Erkenntnis erlangt, und die Finsternis löst sich auf, wenn das Licht erscheint. So löst sich auch der Mangel durch die Vollendung auf. Von da an ist seine Erscheinungsform nicht mehr sichtbar[a], sondern sie wird sich in der Harmonie der Einheit auflösen.


    Jetzt liegen ihre Werke noch verstreut; doch zu gegebener Zeit wird die Einheit die Bereiche[b] vollenden. In der Einheit wird jeder zu sich selbst gelangen, und in der Erkenntnis werden sie sich von der Vielheit zur Einheit hin läutern. Sie werden die Materie in sich verzehren wie Feuer, die Finsternis durch Licht und den Tod durch Leben. Wenn dies tatsächlich an jedem von uns geschehen ist, müssen wir auf das All bedacht sein, damit dieses Haus heilig und still sei um der Einheit willen.'
  to: 'Jesus von unendlicher Süße.


