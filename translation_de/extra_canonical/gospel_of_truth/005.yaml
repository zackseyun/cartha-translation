review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung trifft die wesentlichen Begriffe und Argumentationsgänge zuverlässig: Schoß/Heiliger Geist, Mangel, Erscheinungsform, Welt, Einheit, Erkenntnis, Materie und das All sind sachgerecht wiedergegeben. Korrigiert werden muss jedoch „Bereiche“: Der koptische Text hat hier eindeutig ⲛⲓⲁⲓⲱⲛ, „die Äonen“, nicht eine unsichere Lesung. Ferner ist „sich selbst empfangen“ näher am ausdrücklichen Selbstempfang des Textes als „zu sich selbst gelangen“.'
  naturalness: 'Das Register ist modernes, würdiges Standarddeutsch. Einzelne Formulierungen werden gestrafft: „aufhören, nach dem Vater zu suchen“ ist direkter als die hinzugefügte Mühemetapher; „über das All nachdenken“ ist idiomatischer als „auf das All bedacht sein“.'
  terminology: „Äonen“, „Einheit“, „Erkenntnis“, „Materie“, „Erscheinungsform“ und „das All“ bewahren den technischen Charakter des Textes. Die Fußnote zu „Bereiche“ ist unzutreffend und wird entfernt; die textkritische Fußnote zur in der OCR ausgelassenen Negation bleibt sachlich gerechtfertigt.
  issues:
  - severity: high
    issue: „Bereiche“ statt „Äonen“ samt irreführender Fußnote b
    rationale: Die Lesung ⲛⲓⲁⲓⲱⲛ ist klar und bezeichnet die Äonen. Die Fußnote behauptet eine nicht bestehende lexikalische Unsicherheit und verdeckt den im Text verwendeten technischen Begriff.
  - severity: medium
    issue: „jeder [wird] zu sich selbst gelangen“ schwächt die Formulierung
    rationale: ⲉϥⲛⲁϫⲓ ⲙⲙⲁϥ bedeutet wörtlich, dass jeder sich selbst empfangen wird. Die natürlich mögliche deutsche Formulierung „sich selbst empfangen“ bewahrt dieses Bild.
  - severity: low
    issue: Zusatznuance „sich ... abzumühen“
    rationale: Der Text sagt, dass die Äonen aufhören, den Vater zu suchen; eine Mühe- bzw. Erschöpfungsnuance wird nicht ausgedrückt.
