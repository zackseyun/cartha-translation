  consult_excerpt: 'Every realm emanates from him. They know they’ve come out from him like children who are from someone who’s completely mature. They knew they hadn’t yet received form or a name. The Father gives birth to each one. Then, when they receive form from his knowledge, although they’re really within him, they don’t know him. But the Father is complete, knowing every realm that’s within him. If he wants to, he reveals whomever he wants, giving them a form and a name. He gives a name to them, and causes those to come into being who, before they come into being, are ignorant of the one who made them.

    I’m not saying, then, that those who haven’t yet come into being are nothing, but they exist 28 in the one who will want them to come into being when he wants, like a later time. Before everything is revealed, he knows what he’ll produce. But the fruit which he hasn’t yet revealed doesn’t yet know anything, nor does it do anything. In addition, every realm which is itself in the Father is from the one who exists, who establishes them from what doesn’t exist. For those who have no root have no fruit either. They think to themselves, “I’ve come into being,” but they’ll dissolve by themselves. Because of this, those who didn’t exist at all won’t exist.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/007.yaml
  text: 'For they had not yet received form or a name. The Father brings them forth. Then[a], when they receive form by his knowledge, though they are truly within him, they do not know him. But the Father is complete, knowing every space that is within him. If he wills, he reveals whomever he wills, giving them form and giving them a name. He gives a name to them and causes them to come into being—those who, before they come into being, are ignorant of the one who made them.


    Do not, then, say that those who have not yet come to be are nothing; rather, they exist in the One who will will them to come to be, when he wills—like a later season. Before everything is revealed, he knows what he will produce in his own time. But the fruit that he has not yet revealed knows nothing yet and does nothing.


    Moreover, every aeon that is in the Father is from the One‑who‑is, who establishes them out of non‑being. For those who have no root have no fruit. They say within themselves, “I have come to be,” but they will dissolve by themselves. Because of this, those who did not exist at all will not exist.'
translation:
  language: de
  text: 'Denn sie hatten noch keine Gestalt und keinen Namen empfangen. Der Vater bringt sie hervor. Wenn sie dann durch seine Erkenntnis Gestalt empfangen, kennen sie ihn nicht, obwohl sie wirklich in ihm sind. Doch der Vater ist vollkommen und kennt jeden Raum, der in ihm ist. Wenn er will, offenbart er, wen er will, gibt ihnen Gestalt und Namen. Er gibt ihnen einen Namen und lässt sie ins Dasein treten – sie, die, bevor sie ins Dasein treten, den nicht kennen, der sie gemacht hat.


    Ich sage also nicht, dass diejenigen, die noch nicht ins Dasein getreten sind, nichts seien. Vielmehr sind sie in dem, der wollen wird, dass sie ins Dasein treten, sobald er es will – gleichsam zu einer späteren Zeit. Bevor alles offenbar wird, weiß er, was er zu seiner Zeit hervorbringen wird. Doch die Frucht, die er noch nicht offenbart hat, weiß noch nichts und tut auch nichts.


    Darüber hinaus stammt jeder Äon, der im Vater ist, von dem, der ist, der sie aus dem Nichtsein hervorbringt. Denn wer keine Wurzel hat, hat auch keine Frucht. Sie denken bei sich: »Ich bin ins Dasein getreten«, doch sie werden sich von selbst auflösen. Darum werden diejenigen, die überhaupt nicht existiert haben, nicht existieren.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ⲙⲁⲉⲓⲧ
  choice: Gestalt
  rationale: „Gestalt“ bezeichnet die wahrnehmbare Form und bewahrt den metaphysischen Zusammenhang natürlicher als das abstraktere „Form“.
- source_word: ⲕⲁⲓⲣⲟⲥ / ⲡⲉⲡⲓⲣⲏⲧⲉ
  choice: Zeit / zu seiner Zeit
  rationale: Die zeitliche Bildsprache wird verständlich wiedergegeben, ohne den griechischen Lehnbegriff künstlich zu technisieren; der Kontext trägt den Sinn einer bestimmten oder späteren Zeit.
- source_word: ⲡⲉⲧϣⲟⲟⲡ
  choice: der, der ist
  rationale: Die substantivierte Seinsaussage bleibt als Bezeichnung erkennbar, ohne durch „der Seiende“ unnötig philosophisch zu klingen.
- source_word: ⲧⲙⲛⲧⲉⲩⲛⲟⲩ
  choice: Nichtsein
  rationale: Bewahrt den ontologischen Gegensatz zum Sein, ohne ihn vorschnell als spätere Lehre von einer Schöpfung aus dem Nichts zu deuten.
- source_word: ⲕⲁⲣⲡⲟⲥ
  choice: Frucht
  rationale: Gibt das griechische Lehnwort direkt wieder und hält die Metapher von Wurzel und Frucht zusammen.
- source_word: ⲫⲁⲛⲧⲁⲥⲓⲁ
  choice: Erscheinungen
  rationale: Im erschlossenen Zusammenhang bezeichnet das Wort traumartige Vorstellungen oder Erscheinungen; der Ausdruck steht im vorliegenden Abschnitt jedoch nicht ausdrücklich im deutschen Haupttext.
- source_word: ⲛⲧⲟⲩϣⲏ
  choice: sie werden sich auflösen
  rationale: Erhält das anschauliche Bild des Schmelzens beziehungsweise Sich-Auflösens statt es zu „vergehen“ oder „umkommen“ zu verflachen.
- source_word: ⲡⲓⲱⲧ
  choice: der Vater
  rationale: Bewahrt den bestimmten Artikel und die zentrale Gottesbezeichnung des Textes.
theological_decisions:
- issue: Äonenvokabular
  choice: Äon
  alternative: Raum; Weltbereich; Zeitalter
  rationale: „Äon“ bewahrt den markierten kosmologischen Begriff. Wo der koptische Text ausdrücklich von einem „Raum“ spricht, wird dagegen „Raum“ verwendet.
- issue: Nichtsein und Hervorbringung
  choice: aus dem Nichtsein
  alternative: aus dem Nichts; aus der Nichtigkeit
  rationale: Die Formulierung wahrt den metaphysischen Gegensatz, ohne eine spätere dogmatische Debatte über creatio ex nihilo in den Text einzutragen.
- issue: Bezeichnung der Seinsquelle
  choice: der, der ist
  alternative: der Seiende; der Ist
  rationale: Die quasi-titelhafte Bedeutung bleibt hörbar, doch eine ausdrückliche Gleichsetzung mit Exodus 3,14 wird vermieden.
- issue: Einleitung des zweiten Absatzes
  choice: Ich sage also nicht
  alternative: Sagt also nicht
  rationale: Die konsultierte Quellenauslegung versteht die Form als Aussage des Sprechers. Diese Lesart wird gegenüber dem imperativischen englischen Entwurf bevorzugt, ohne den folgenden ontologischen Gegensatz zu verändern.
