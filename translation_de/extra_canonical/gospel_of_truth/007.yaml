    Ich sage also nicht, dass diejenigen, die noch nicht ins Dasein getreten sind, nichts seien. Vielmehr sind sie in dem, der wollen wird, dass sie ins Dasein treten, sobald er es will – wie zu einer späteren Zeit. Bevor alles offenbar wird, weiß er, was er zu seiner Zeit hervorbringen wird. Doch die Frucht, die er noch nicht offenbart hat, weiß noch nichts und tut auch nichts.


    Darüber hinaus stammt jeder Äon, der im Vater ist, von dem, der ist. Er stellt sie aus dem Nichtsein hin. Denn wer keine Wurzel hat, hat auch keine Frucht. Sie sagen bei sich: »Ich bin ins Dasein getreten«, doch sie werden sich von selbst auflösen. Darum werden diejenigen, die überhaupt nicht existiert haben, nicht existieren.'
