  consult_excerpt: 'This is the Word of the Gospel of the discovery of the fullness, which comes for those who are awaiting 35 the salvation which is coming from above. The hope for which they’re waiting is waiting for those whose image is light with no shadow in it. If at that time the fullness comes, the need of matter doesn’t come through the infinity of the Father, who comes to give time to the need – although no one can say that the incorruptible one will come like this. But the depth of the Father multiplied, and the thought of Error didn’t exist with him. It’s something that’s fallen, which is easily set upright in the discovery of the one who’s to come to what he’ll return, because the return is called “repentance.”

    Because of this, incorruptibility breathed out. It followed after the one who sinned, so that they might rest, because forgiveness is what remains for the light in need, the Word of fullness. For the doctor hurries to the place where there’s sickness, because that’s what he (or she) wants to do. The one in need, then, doesn’t hide it, because one (the doctor) has what they need. In this way the fullness, which has no need but fills the need, is what he 36 provided from himself to fill up what’s needed, so that they might receive grace; because when they were in need, they didn’t have grace. Because of this, a diminishing took place where there is no grace. When what was diminished was restored, what they needed was revealed as fullness. This is the discovery of the light of Truth which enlightened them, because it doesn’t change.

    Because of this, they spoke of Christ in their midst: “Seek, and those who were disturbed will receive a return – and he’ll anoint them with ointment.” The ointment is the mercy of the Father, who will have mercy on them. But those whom he anointed are those who have been completed, because full jars are the ones that are anointed. But when the anointing of one dissolves, it empties, and the cause of the need is the place where the ointment leaks, because a breath and its power draws it. But from the one who has no need, no seal is removed, nor is anything emptied, but what it needs is filled again by the Father, who’s complete.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/012.yaml
  text: 'The speech of the Good News about the finding of the Fullness is for those who await the salvation that comes from above[a]. While they wait for it, the hope belongs to those whose image is light with no shadow in it. When, then, the Fullness arrives, the need of hylē (matter) is not from the immeasurability of the Father; he comes to grant a season to the need. Yet no one is able to say that the Incorruptible comes in such a manner. Rather, the Depth of the Father grew and multiplied, and the thought of Error was not with him. Error is a fall—something easy to set upright by the finding of the one who will come back to that to which he returns, for the return is named change of mind.


    Because of this, Incorruptibility breathed forth; it pursued the one who had sinned, so that he might find rest. For what remains for the light in need is forgiveness—the Word of the Fullness. For the physician runs to the place where sickness is, because that is what he wills. And the one in need does not hide, for someone possesses what that one needs. In this way the Fullness—which has no need—provided from itself to fill up the need, so that they might receive grace. For when they were in need, grace was not with them. Because of this, a diminishing took place where there is no grace; and when what was diminished was restored, the need was shown as Fullness. This is the finding of the light of the Truth that enlightened them, for it is unchangeable.


    Because of this, they spoke concerning the Messiah in their midst: “Seek, and those who were disturbed will return, and he will anoint them with chrism.” The chrism is the mercy of the Father, and he will have mercy on them. Now those whom he anointed are the perfect—for full vessels are the ones anointed. But when the anointing of one dissolves, it is emptied, and the cause of the need is the place where the ointment leaks out, because a breath and its power draw it. Yet from the one who has no need no seal is loosened, and nothing is emptied; rather, what it needs the Father—who is complete—fills again with him. He is good; he knows his plantings, because it is he who planted them in his Paradise[c][b]. Now his Paradise is his place of rest.'
translation:
  language: de
  text: '**Das Fehlende wiederherstellen**


    Die Botschaft der Guten Nachricht von der Entdeckung der Fülle gilt denen, die auf die Rettung warten, die von oben kommt.[a] Während sie darauf warten, gehört die Hoffnung denen, deren Bild Licht ist, in dem kein Schatten liegt. Wenn dann die Fülle kommt, stammt der Mangel der Hyle, der Materie, nicht aus der Unermesslichkeit des Vaters; er kommt, um dem Mangel seine Zeit zu gewähren. Doch niemand vermag zu sagen, der Unvergängliche werde auf diese Weise kommen. Vielmehr wuchs und mehrte sich die Tiefe des Vaters, und der Gedanke des Irrtums war nicht bei ihm. Der Irrtum ist etwas Gefallenes, das sich leicht wieder aufrichten lässt, wenn derjenige gefunden wird, der zu dem zurückkehren wird, wohin er zurückkehrt. Denn diese Rückkehr heißt Umkehr des Denkens.[b]


    Darum hauchte die Unvergänglichkeit aus. Sie folgte dem, der gesündigt hatte, damit er Ruhe fände. Denn was für das bedürftige Licht bleibt, ist Vergebung – das Wort der Fülle. Der Arzt eilt ja dorthin, wo Krankheit ist, weil dies seinem Willen entspricht. Und wer Mangel leidet, verbirgt ihn nicht, denn da ist einer, der besitzt, was ihm fehlt. So gab die Fülle, die selbst keinen Mangel hat, aus sich selbst, um das Fehlende auszufüllen, damit sie Gnade empfingen. Denn als sie Mangel litten, war die Gnade nicht bei ihnen. Deshalb trat dort, wo keine Gnade ist, eine Minderung ein. Als aber das Geminderte wiederhergestellt war, zeigte sich der Mangel als Fülle. Dies ist die Entdeckung des Lichtes der Wahrheit, das sie erleuchtete, denn es ist unwandelbar.


    Darum sprachen sie in ihrer Mitte über den Messias:[c] »Sucht, und die Verstörten werden zurückkehren, und er wird sie mit Chrisam salben.«[d] Das Chrisam ist das Erbarmen des Vaters, und er wird sich ihrer erbarmen. Die aber, die er gesalbt hat, sind die Vollendeten; denn volle Gefäße sind es, die gesalbt werden. Wenn sich jedoch die Salbung eines Menschen auflöst, wird sie leer. Ursache des Mangels ist die Stelle, an der das Salböl ausläuft, weil ein Hauch und seine Kraft es an sich ziehen. Doch von dem, der keinen Mangel hat, wird kein Siegel gelöst, und nichts wird ausgeleert. Vielmehr füllt der vollkommene Vater das, was ihm fehlt, wieder mit sich selbst. Er ist gut. Er kennt seine Pflanzungen, denn er selbst hat sie in seinem Paradies gepflanzt. Sein Paradies aber ist sein Ort der Ruhe.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der Satzbau ist unsicher. Möglich ist auch: »Die Botschaft der Guten Nachricht von der Entdeckung der Fülle kommt zu denen, die auf die Rettung warten, die von oben kommt; die Hoffnung, auf die sie warten, gehört denen, deren Bild Licht ist, in dem kein Schatten liegt.«'
    reason: Die syntaktische Zuordnung der einleitenden Satzglieder und des Wartens ist im koptischen Text mehrdeutig; die Rettung, die von oben kommt, bleibt dabei erhalten.
  - marker: b
    text: 'Traditionell: »Buße« oder »Sinnesänderung«; das zugrunde liegende Wort ist metanoia.'
    reason: Bewahrt die geläufige religiöse Wiedergabe neben der im Kontext hervorgehobenen Bedeutung von Rückkehr und verändertem Denken.
  - marker: c
    text: 'Oder: »Christus«.'
    reason: Das koptische Nomen sacrum steht für griechisch Christos, das sowohl als Titel »Messias« als auch als die geläufige Bezeichnung »Christus« wiedergegeben werden kann.
  - marker: d
    text: Chrisam ist geweihtes Salböl; schlichter könnte hier jeweils »Salböl« stehen.
    reason: Erläutert den kultisch geprägten Ausdruck, ohne die konkrete Ölbedeutung zu verdecken.
lexical_decisions:
- source_word: ⲡⲗⲏⲣⲱⲙⲁ
  choice: Fülle
  rationale: Gibt den valentinianisch geprägten Begriff verständlich und zugleich mit seinem technischen Gewicht wieder; eine unnötige Eindeutschung als bloße „Vollständigkeit“ würde das wiederkehrende Leitwort abschwächen.
- source_word: ⲧϩⲩⲗⲏ
  choice: Hyle, die Materie
  rationale: Bewahrt das griechische philosophische Lehnwort und erschließt es unmittelbar durch die deutsche Glosse „Materie“.
- source_word: ⲁⲧⲧⲉⲕⲟ / ⲙⲛⲧⲁⲧⲧⲉⲕⲟ
  choice: der Unvergängliche / die Unvergänglichkeit
  rationale: Unterscheidet entsprechend dem Kontext die personale und die abstrakte Verwendung, ohne sie dogmatisch gleichzusetzen.
- source_word: ⲃⲁⲑⲟⲥ
  choice: Tiefe
  rationale: Behält den kosmologischen Hoheitstitel des Vaters in seiner bildhaften, wörtlichen Form.
- source_word: ⲡⲗⲁⲛⲏ
  choice: Irrtum
  rationale: Lässt die mögliche Personifizierung erkennen, ohne durch „Täuschung“ bereits einen absichtlichen Täuschenden vorauszusetzen.
- source_word: ⲙⲉⲧⲁⲛⲟⲓⲁ
  choice: Umkehr des Denkens
  rationale: Verbindet die im Kontext betonte Rückkehr mit der kognitiven Bedeutung des griechischen Lehnworts; die traditionelle Wiedergabe wird in der Fußnote genannt.
- source_word: ⲡⲥⲁⲉⲓⲛ
  choice: Arzt
  rationale: Natürliches modernes Deutsch für den medizinischen Heiler in der Krankheitsmetapher.
- source_word: ⲡϣⲧⲁ
  choice: Fehlen / Mangel / das Fehlende
  rationale: Die kontextabhängige Variation hält das Wortfeld von Bedürftigkeit, Defizit und Auffüllung im Deutschen verständlich zusammen.
- source_word: ⲧⲱϩⲥ
  choice: Gefäß
  rationale: Bewahrt das konkrete Bild eines füllbaren Behälters und dessen metaphorische Offenheit.
- source_word: ⲧⲉⲗⲓⲟⲥ
  choice: die Vollendeten
  rationale: Gibt den Zustand des Zur-Vollendung-Gelangtseins wieder, ohne moralische Fehlerlosigkeit als einzige Bedeutung festzulegen.
- source_word: ⲥⲧⲟ / ⲧⲱϩⲥ (Salbungskontext)
  choice: Chrisam; Salböl
  rationale: „Chrisam“ erhält im Zitat und in der Deutung den kultischen Klang; „Salböl“ verdeutlicht anschließend das konkrete Bild des Auslaufens.
- source_word: ⲡⲭⲥ
  choice: Messias
  rationale: Übersetzt den Titel Χριστός; „Christus“ bleibt als geläufige Alternative in der Fußnote erhalten.
- source_word: ϭⲱϭⲉ / ⲧⲱϭⲉ
  choice: Pflanzungen / pflanzen
  rationale: Stellt die im Schlussabschnitt ausdrücklich vorhandene landwirtschaftliche Metapher wieder her.
theological_decisions:
- issue: Verhältnis von Fülle und Mangel
  choice: Der Mangel stammt nicht aus der Unermesslichkeit des Vaters; die Fülle füllt ihn aus sich selbst.
  alternative: Den Vater unmittelbar als Ursprung des Mangels verstehen.
  rationale: Die Negation des koptischen Satzes wird gewahrt, zugleich aber die Spannung stehen gelassen, dass der Vater beziehungsweise die Fülle dem Mangel begegnet und ihn ausfüllt.
- issue: Bedeutung von ⲙⲉⲧⲁⲛⲟⲓⲁ
  choice: Umkehr des Denkens
  alternative: Buße
  rationale: Der unmittelbare Kontext erklärt den Begriff als Rückkehr. Die gewählte Form wahrt sowohl Richtungswechsel als auch Erkenntnisdimension, während die traditionelle Lesart in der Fußnote erhalten bleibt.
- issue: Titel ⲡⲭⲥ
  choice: Messias
  alternative: Christus
  rationale: Der Text spricht vom Titel in ihrer Mitte; die Übersetzung vermeidet, Titel und Eigenname stillschweigend gleichzusetzen.
- issue: Salbungs- und Siegelbild
  choice: Chrisam, Salbung und Siegel werden als konkrete kultische Bildsprache beibehalten.
  alternative: Allgemeiner „Öl“, „Bestätigung“ oder „Zeichen“.
  rationale: Eine Verallgemeinerung würde die sakramentale Resonanz des Textes beseitigen; die Übersetzung erklärt die Bilder jedoch nicht konfessionell.
- issue: Bezug in „was ihm fehlt“
  choice: Das grammatisch offene Pronomen bleibt im Deutschen auf „den, der keinen Mangel hat“ beziehbar.
  alternative: Explizit „was dem Bedürftigen fehlt“ oder „was dem Gefäß fehlt“.
  rationale: Der schwierige Übergang soll nicht durch eine dogmatische oder sachliche Festlegung geglättet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit gut lesbaren Sätzen. Wiederkehrende Leitwörter wie „Fülle“, „Mangel/Fehlen“, „Licht“, „Rückkehr“, „Ruhe“ und „Vater“ bleiben sichtbar. Technische Begriffe werden sparsam eingesetzt und unmittelbar erschlossen; die gnostisch-valentinianische Bildwelt wird weder konfessionell harmonisiert noch modernisierend aufgelöst.
