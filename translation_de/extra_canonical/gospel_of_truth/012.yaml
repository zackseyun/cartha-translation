revisions:
- from: '**Das Fehlende wiederherstellen**


    Die Botschaft der Guten Nachricht von der Entdeckung der Fülle gilt denen, die auf die Rettung warten, die von oben kommt.[a] Während sie darauf warten, gehört die Hoffnung denen, deren Bild Licht ist, in dem kein Schatten liegt. Wenn dann die Fülle kommt, stammt das Fehlen der Hyle, der Materie, nicht aus der Unermesslichkeit des Vaters; vielmehr kommt er, um dem Fehlen seine Zeit zu gewähren. Doch niemand vermag zu sagen, der Unvergängliche werde auf diese Weise kommen. Vielmehr breitete sich die Tiefe des Vaters aus, und der Gedanke des Irrtums war nicht bei ihm. Der Irrtum ist etwas Gefallenes, das sich leicht wieder aufrichten lässt, wenn derjenige gefunden wird, der zu dem zurückkehren wird, wohin er zurückkehrt. Denn diese Rückkehr heißt Umkehr des Denkens.[b]


    Darum hauchte die Unvergänglichkeit aus. Sie folgte dem, der gesündigt hatte, damit er Ruhe fände. Denn was für das bedürftige Licht bleibt, ist Vergebung – das Wort der Fülle. Der Arzt eilt ja dorthin, wo Krankheit ist, weil dies seinem Willen entspricht. Und wer Mangel leidet, verbirgt ihn nicht, denn da ist einer, der besitzt, was ihm fehlt. So gab die Fülle, die selbst keinen Mangel hat, aus sich selbst, um das Fehlende auszufüllen, damit sie Gnade empfingen. Denn als sie Mangel litten, war die Gnade nicht bei ihnen. Deshalb trat dort, wo keine Gnade ist, eine Minderung ein. Als aber das Geminderte wiederhergestellt war, zeigte sich das Fehlende als Fülle. Dies ist die Entdeckung des Lichtes der Wahrheit, das sie erleuchtete, denn es ist unwandelbar.


    Darum sprachen sie in ihrer Mitte über den Messias:[c] »Sucht, und die Verstörten werden zurückkehren, und er wird sie mit Chrisam salben.«[d] Das Chrisam ist das Erbarmen des Vaters, und er wird sich ihrer erbarmen. Die aber, die er gesalbt hat, sind die Vollendeten; denn volle Gefäße sind es, die gesalbt werden. Wenn sich jedoch die Salbung eines Gefäßes auflöst, wird es leer. Ursache des Mangels ist die Stelle, an der das Salböl ausläuft, weil ein Hauch und seine Kraft es an sich ziehen. Doch von dem, der keinen Mangel hat, wird kein Siegel gelöst, und nichts wird ausgeleert. Vielmehr füllt der vollkommene Vater das, was ihm fehlt, wieder mit sich selbst. Er ist gut. Er kennt seine Pflanzungen, denn er selbst hat sie in seinem Paradies gepflanzt. Sein Paradies aber ist sein Ort der Ruhe.'
