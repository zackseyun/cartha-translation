  consult_excerpt: 'This is the Gospel of the one they search for, revealed to those who are complete through the mercies of the Father, the hidden mystery. Through it (the Gospel), Jesus Christ enlightened those who were in darkness through forgetfulness. He enlightened them; he showed them a Way, and the Way is the Truth which he taught them.

    As a result, Error was angry. It pursued him. It was threatened by him and brought to nothing. They nailed him (Jesus) to a tree, and he became the fruit of the Father’s knowledge. However, it (the fruit) didn’t cause destruction when it was eaten, but those who ate it were given joy in the discovery. He discovered them in himself and they discovered him in themselves.

    As for the uncontainable, inconceivable one – the Father, the complete one who made all – all are within him, and all need him. Although he kept their completion within himself which he didn’t give to all, the Father wasn’t jealous. Indeed, what jealousy is there between him and his members? 19 For if, like this, the generation [received the completion,] they couldn’t have come […] the Father. He keeps their completion within himself, giving it to them to return to him with a unitary knowledge in completion. He’s the one who made all, and all are within him, and all need him.

    Like someone who’s unknown, he wants to be known and loved – because what did all need if not the knowledge of the Father?

    He became a guide, peaceful and leisurely. He came and spoke the Word as a teacher in places of learning. Those who were wise in their own estimation came up to him to test him, but he confounded them because they were vain. They hated him because they weren’t wise in Truth. After all of them, all the little children came too; theirs is the knowledge of the Father. When they were strengthened, they received teaching about the Father’s expressions. They knew and they were known; they received glory and they gave glory. In their hearts the living Book of the Living was revealed, which was written in the thought and mind 20 [of the] Father, and before the [foundation] of all within his incomprehensibility. This (book) is impossible to take, since it permits the one who takes it to be killed. No one could’ve been revealed among those who''d been entrusted with salvation unless the book had appeared. Because of this, the merciful and faithful Jesus patiently suffered until he took that book,
    since he knows that his death is life for many.

    When a will hasn’t yet been opened, the wealth of the deceased master of the house is hidden; so too all were hidden while the Father of all was invisible. They were from him, from whom every realm comes. Because of this:

    Jesus was revealed,

    put on that book,

    was nailed to a tree,

    and published the Father’s edict on the cross.

    Oh, what a great teaching!

    Drawing himself down to death,

    he clothed himself in eternal life,

    stripped himself of the perishable rags,

    and clothed himself in incorruptibility,

    which no one can take from him.

    When he entered the empty realms of terror, he passed through those who were stripped by forgetfulness, being knowledge and completion, proclaiming the things that are in the heart 21 […] teach those who will [receive teaching].'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/003.yaml
  text: 'The Father—the one who cannot be contained—is the one who kept the All within himself[a], and the All is within him, and all have need of him. He kept their wholeness within himself; he was not jealous, for what jealousy could there be between him and his members? If, in this way, the All had already received it, they could not have come to him. He keeps it for them within himself, to give it to them so that they may return to him with a single knowledge in rest, in one body.


    Like one who is unknown, he desires to be known and to be loved—for what did all need except the Father’s knowledge? He became a guide—peaceful and unhurried. He came into the places of learning and spoke the Word as a teacher. Those who were wise in their own hearts came up to test him; yet he confounded them, for they were vain. They hated him because they were not wise in the Truth. After them the little children came also—theirs is the Father’s knowledge. When they were strengthened, they received instruction about the Father’s expressions. They knew, and they were known. They received glory and gave glory. In their heart the Living Book of the Living was revealed, written in the thought and in the mind of the Father, and before the foundation of all, within his incomprehensibility—a book that no one has the power to take, since it is appointed for the one who takes it to be killed. It is impossible that anyone be manifested among those entrusted with salvation unless that book should
    appear.


    Because of this, the merciful and faithful Jesus endured patiently until he took that book, for he knows that his death is life for many. As long as a testament has not been opened, the wealth of the deceased master of the house is hidden; so also, while the Father of the All was invisible, all things were hidden, for they are from him, from whom every realm comes. Because of this, Jesus was manifested; he put on that book; he was nailed to a tree; he published the Father’s decree on the cross.


    O the great teaching! He drew himself down to death; he clothed himself in eternal life; he stripped off the perishable rags; he put on incorruptibility, which no one can take from him. When he entered the empty places of dread, he passed by those who had been stripped by forgetfulness—being knowledge and completion—proclaiming what is in the heart to those who are ready to receive instruction.'
translation:
  language: de
  text: 'Der Vater, den nichts umfassen kann, bewahrt das All[a] in sich. Das All ist in ihm, und alles bedarf seiner. Er bewahrt ihre Vollendung in sich. Er ist nicht eifersüchtig; denn welche Eifersucht könnte es zwischen ihm und seinen Gliedern geben? Hätte das All seine Vollendung schon empfangen, hätte es nicht zu ihm kommen können. Er bewahrt sie für sie in sich, um sie ihnen zu geben, damit sie zu ihm zurückkehren: in Ruhe und in einer einzigen, vollkommenen Erkenntnis.[b]


    Wie einer, der unbekannt ist, will er erkannt und geliebt werden. Denn was brauchte das All anderes als die Erkenntnis des Vaters? Er wurde zu einem Wegweiser, ruhig und gelassen. Er kam in die Lehrstätten und sprach das Wort wie ein Lehrer. Da kamen die, die sich in ihrem eigenen Herzen für weise hielten, um ihn auf die Probe zu stellen. Doch er beschämte sie, denn sie waren nichtig. Sie hassten ihn, weil sie in der Wahrheit nicht weise waren.


    Nach ihnen kamen auch die kleinen Kinder; ihnen gehört die Erkenntnis des Vaters. Als sie gestärkt worden waren, empfingen sie Unterweisung über die Äußerungen des Vaters. Sie erkannten und wurden erkannt. Sie empfingen Herrlichkeit und gaben Herrlichkeit. In ihrem Herzen wurde das lebendige Buch der Lebenden offenbart. Es ist im Gedanken und im Verstand des Vaters geschrieben und besteht seit der Grundlegung des Alls in seiner Unbegreiflichkeit. Niemand hat die Macht, dieses Buch zu nehmen; denn es ist bestimmt, dass derjenige, der es nimmt, getötet wird. Niemand von denen, denen die Rettung anvertraut war, konnte offenbar werden, solange dieses Buch nicht erschienen war.


    Darum ertrug Jesus, der Barmherzige und Treue, geduldig Leiden, bis er dieses Buch nahm; denn er weiß, dass sein Tod für viele Leben bedeutet. Solange ein Testament[c] noch nicht geöffnet worden ist, bleibt der Besitz des verstorbenen Hausherrn verborgen. Ebenso war das All verborgen, solange der Vater des Alls unsichtbar war. Denn alles stammt von ihm, von dem jeder Bereich ausgeht.


    Darum wurde Jesus offenbar. Er zog dieses Buch an. Er wurde an ein Holz genagelt und machte am Kreuz den Erlass des Vaters öffentlich.[d]


    Was für eine große Lehre! Er zog sich selbst hinab bis zum Tod und kleidete sich in ewiges Leben. Er legte die vergänglichen Lumpen ab und zog Unvergänglichkeit an, die niemand ihm nehmen kann. Als er in die leeren Bereiche des Schreckens eintrat, ging er an denen vorüber, die durch das Vergessen entblößt worden waren. Er selbst war Erkenntnis und Vollendung und verkündete, was im Herzen ist, denen, die Unterweisung empfangen sollen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Das All“ bezeichnet hier die Gesamtheit alles Seienden; der Ausdruck hat im Werk einen besonderen, umfassenden Sinn.
    reason: Ein ungewöhnlicher technischer Ausdruck braucht eine knappe Verständnishilfe.
  - marker: b
    text: 'Wörtlicher und zugleich schwieriger: „um ihnen eine Rückkehr und eine Erkenntnis zu geben, eins in Vollendung“.'
    reason: Die verdichtete koptische Wortfolge lässt das Verhältnis von Rückkehr, Erkenntnis, Einheit und Vollendung offen.
  - marker: c
    text: Das griechische Lehnwort kann „Testament“, „letztwillige Verfügung“ oder in anderem Zusammenhang „Bund“ bedeuten. Hier weist das Erbschaftsbild auf „Testament“.
    reason: Die juristische Metapher soll nicht stillschweigend auf „Bund“ festgelegt werden.
  - marker: d
    text: Der Text spricht zunächst von einem „Holz“ und anschließend vom „Kreuz“.
    reason: Die Bildfolge des Ausgangstextes wird erklärt, ohne beide Bezeichnungen einzuebnen.
lexical_decisions:
- source_word: ⲡⲧⲏⲣϥ
  choice: das All
  rationale: Bewahrt den im Traktat wiederkehrenden technischen Sinn der Gesamtheit, ohne ihn vorschnell auf das materielle Universum einzuengen.
- source_word: ⲥⲁⲩⲛⲉ / ⲥⲟⲩⲱⲛ
  choice: Erkenntnis / erkennen
  rationale: Gibt das zentrale Erkenntnismotiv in verständlichem Deutsch wieder; „Gnosis“ wäre unnötig fachsprachlich.
- source_word: ⲥⲧⲟⲩⲱⲣⲁⲩ
  choice: Ruhe
  rationale: Bewahrt das soteriologische Motiv der Ruhe beziehungsweise Heimkehr.
- source_word: ϫⲱⲕ
  choice: Vollendung
  rationale: Der Kontext bezeichnet Ganzheit, Erfüllung oder Vollendung; „Leib“ würde die Mehrdeutigkeit hier zu stark festlegen.
- source_word: ⲡⲓϫⲱⲱⲙⲉ
  choice: Buch
  rationale: Entspricht dem Motiv des „lebendigen Buches“; „Schriftrolle“ wäre materiell enger als der Ausgangstext.
- source_word: ⲙⲉⲉⲩⲉ / ⲛⲟⲩⲥ
  choice: Gedanke / Geist
  rationale: Erhält das begriffliche Paar; „Geist“ gibt den philosophischen νοῦς-Ton im Deutschen natürlicher wieder als „Verstand“.
- source_word: ⲇⲓⲁⲑⲏⲕⲏ
  choice: Testament
  rationale: Die anschließende Rede vom verstorbenen Hausherrn und seinem Besitz verlangt den erbrechtlichen Sinn.
- source_word: ⲇⲓⲁⲧⲁⲅⲙⲁ
  choice: Erlass
  rationale: Gibt den amtlich-rechtlichen Charakter der öffentlich gemachten Anordnung wieder.
- source_word: ⲧⲃϣⲉ
  choice: Holz
  rationale: Bewahrt das Bild des Holzes beziehungsweise Baumes, an den Jesus genagelt wird, ohne es mit dem folgenden Kreuzmotiv gleichzusetzen.
theological_decisions:
- issue: Technischer Ausdruck für die Gesamtheit
  choice: das All
  alternative: die Gesamtheit; das Universum
  rationale: „Das All“ wahrt den metaphysischen Sprachgebrauch des Textes und vermeidet eine ausschließlich kosmologische Deutung.
- issue: Vollendung, Rückkehr und Einheit
  choice: „in Ruhe und in einer einzigen, vollkommenen Erkenntnis“
  alternative: „mit einer Rückkehr und einer Erkenntnis, eins in Vollendung“; „in einem Leib“
  rationale: Die koptische Syntax ist verdichtet. Die gewählte Fassung bewahrt Ruhe, Erkenntnis, Einheit und Vollendung, ohne ϫⲱⲕ unbegründet als „Leib“ festzulegen.
- issue: Tod dessen, der das Buch nimmt
  choice: als Bestimmung formuliert, ohne den Handelnden zu benennen
  alternative: Gott bestimmt seinen Tod; die Gegner töten ihn
  rationale: Das Passiv des Ausgangstextes lässt offen, wer die Tötung verfügt oder vollzieht.
- issue: Testament und Bund
  choice: Testament
  alternative: Bund; letzter Wille
  rationale: Das Erbschaftsbild mit dem verstorbenen Hausherrn stützt den juristischen Sinn „Testament“; „Bund“ würde einen anderen theologischen Akzent eintragen.
- issue: Holz und Kreuz
  choice: beide Bilder unterschieden wiedergegeben
  alternative: beide Male Kreuz; beide Male Holz
  rationale: Die Passage verbindet das Annageln an ein Holz mit der Veröffentlichung des Erlasses am Kreuz; die Differenz bleibt sichtbar.
- issue: Jesu Tod als Leben für viele
  choice: „sein Tod für viele Leben bedeutet“
  alternative: „sein Tod das Leben vieler ist“
  rationale: Die Aussage wird ohne zusätzliche Theorie der Sühne oder Erlösung wiedergegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen, gut sprechbaren Sätzen. Zentrale Leitwörter wie „Erkenntnis“, „Vollendung“, „das All“, „Buch“, „Leben“ und „Vater“ bleiben konsequent erhalten. Die poetische Reihung im Kreuzesabschnitt wurde rhythmisch gestaltet, ohne die fremdartige Bildwelt zu glätten.
