revisions:
- from: 'Der Vater, den nichts umfassen kann, bewahrt das All[a] in sich. Das All ist in ihm, und alles bedarf seiner. Er bewahrt ihre Vollendung in sich. Er ist nicht eifersüchtig; denn welche Eifersucht könnte es zwischen ihm und seinen Gliedern geben? Hätte das All seine Vollendung schon empfangen, hätte es nicht zu ihm kommen können. Er bewahrt sie für sie in sich, um sie ihnen zu geben, damit sie zu ihm zurückkehren: in Ruhe und in einer einzigen, vollkommenen Erkenntnis.[b]


    Wie einer, der unbekannt ist, will er erkannt und geliebt werden. Denn was brauchte das All anderes als die Erkenntnis des Vaters? Er wurde zu einem Wegweiser, ruhig und gelassen. Er kam in die Lehrstätten und sprach das Wort wie ein Lehrer. Da kamen die, die sich in ihrem eigenen Herzen für weise hielten, um ihn auf die Probe zu stellen. Doch er beschämte sie, denn sie waren nichtig. Sie hassten ihn, weil sie in der Wahrheit nicht weise waren.


    Nach ihnen kamen auch die kleinen Kinder; ihnen gehört die Erkenntnis des Vaters. Als sie gestärkt worden waren, empfingen sie Unterweisung über die Äußerungen des Vaters. Sie erkannten und wurden erkannt. Sie empfingen Herrlichkeit und gaben Herrlichkeit. In ihrem Herzen wurde das lebendige Buch der Lebenden offenbart. Es ist im Gedanken und im Geist des Vaters geschrieben und besteht seit der Grundlegung des Alls in seiner Unbegreiflichkeit. Niemand hat die Macht, dieses Buch zu nehmen; denn es ist bestimmt, dass derjenige, der es nimmt, getötet wird. Niemand von denen, denen die Rettung anvertraut war, konnte offenbar werden, solange dieses Buch nicht erschienen war.


    Darum harrte Jesus, der Barmherzige und Treue, geduldig aus, bis er dieses Buch nahm; denn er weiß, dass sein Tod für viele Leben bedeutet. Solange ein Testament[c] noch nicht geöffnet worden ist, bleibt der Besitz des verstorbenen Hausherrn verborgen. Ebenso war das All verborgen, solange der Vater des Alls unsichtbar war. Denn alles stammt von ihm, von dem jeder Bereich ausgeht.


    Darum wurde Jesus offenbar. Er zog dieses Buch an. Er wurde an ein Holz genagelt und machte am Kreuz den Erlass des Vaters öffentlich.[d]


