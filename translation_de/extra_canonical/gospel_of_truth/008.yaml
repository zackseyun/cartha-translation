  consult_excerpt: 'What, then, did he want them to think of themselves? He wanted to them to think, “I’ve come into being like the shadows and phantoms of the night.” When the light shines on the terror which they received, they know that it’s nothing. In this way, they were ignorant of the Father, whom 29 they didn’t see. Since it was terror and disturbance and instability and doubt and division, many illusions were at work among them, and vain ignorance, like they were deep in sleep and found themselves in nightmares. Either they’re running somewhere, or unable to run away from someone; or they’re fighting, or being beaten; or they’ve fallen from heights, or fly through the air without wings. Sometimes, too, it’s like someone is killing them, even though no one’s chasing them; or they themselves are killing those around them, covered in their blood. Until those who are going through all these nightmares can wake up, they see nothing, because these things are nothing.

    That’s the way it is with those who’ve cast off ignorance like sleep. They don’t regard it as anything, nor do they regard its 30 other works as real, but they abandon them like a dream in the night. They value the knowledge of the Father like they value the light. The ignorant have acted like they’re asleep; those who’ve come to knowledge have acted like they’ve awakened. Good for the one who returns and awakens! Blessed is the one who’s opened the eyes of those who can’t see! The Holy Spirit hurried after them to revive them. Having given a hand to the one who lay on the ground, it set them up on their feet, because they hadn’t yet arisen. It gave them the knowledge of the Father and the revelation of the Son, because when they saw him and heard him, he granted them to taste him and to grasp the beloved Son.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/008.yaml
  text: 'What, then, did he want them to think? That they had come to be like a shadow and a phantasm of the night.


    When light falls upon the terror that they had received, it turns out to be nothing. In this way they were ignorant of the Father, whom they did not see. For it was terror and disturbance and instability and division and doubt; many empty illusions were at work among them, and vain nothingness—as if they were sunk in sleep and, in their dreams, found themselves in nightmares.


    Either they are running to some place, or they are unable to flee from someone; or they are fighting, or they are being beaten; or they fall from heights, or they fly through the air without wings. Sometimes also someone is killing them even though no one pursues them; or they themselves are killing those around them, and they are smeared with their blood. Until those who are going through all these things awaken, they see nothing—because these things are nothing.


    So it is with those who have cast off ignorance like sleep: they do not reckon it to be anything, nor do they reckon its other works to be real; rather, they abandon them like a dream of the night. They value the knowledge of the Father like the light. Those who were ignorant acted as if asleep; those who have come to know acted as if awake.


    Good is the one who returns and awakens![a] Blessed is the one who opens the eyes of the blind!


    The Spirit ran after them in order to make them live. Having given a hand to the one who lay on the ground, it set them on their feet, for they had not yet arisen. It granted them the knowledge of the Father and the revelation of the Son; for when they saw him and heard him, he allowed them to taste him and to grasp the beloved Son.'
translation:
  language: de
  text: 'Was wollte er also, dass sie dachten? Dass sie wie ein Schatten und ein Trugbild der Nacht ins Dasein gekommen waren.


    Wenn das Licht auf den Schrecken fällt, der sie ergriffen hatte, erweist er sich als nichts. So kannten sie den Vater nicht, den sie nicht sahen. Denn da waren Schrecken und Verwirrung, Haltlosigkeit, Spaltung und Zweifel. Viele leere Täuschungen waren unter ihnen am Werk und nichtige Nichtigkeit – als wären sie in tiefen Schlaf gesunken und fänden sich in ihren Träumen in Albträumen wieder.


    Bald laufen sie irgendwohin, bald können sie vor jemandem nicht fliehen; bald kämpfen sie oder werden geschlagen; bald stürzen sie aus großer Höhe oder fliegen ohne Flügel durch die Luft. Manchmal scheint es auch, als töte sie jemand, obwohl niemand sie verfolgt; oder sie selbst töten die Menschen um sich herum und sind mit ihrem Blut beschmiert. Solange die, die all dies durchmachen, nicht erwachen, sehen sie nichts – denn diese Dinge sind nichts.


    So verhält es sich mit denen, die die Unwissenheit wie einen Schlaf abgeschüttelt haben: Sie halten sie für nichts und auch ihre übrigen Werke nicht für wirklich, sondern lassen sie zurück wie einen Traum der Nacht. Die Erkenntnis des Vaters schätzen sie wie das Licht. Die Unwissenden handelten wie Schlafende; die zur Erkenntnis Gelangten handelten wie Erwachte.


    Gut ist, wer umkehrt und erwacht![a] Selig ist, wer die Augen der Blinden öffnet!


    Der Geist eilte ihnen nach, um sie lebendig zu machen. Er reichte dem, der am Boden lag, die Hand und stellte ihn auf die Füße, denn er war noch nicht aufgestanden. Er schenkte ihnen die Erkenntnis des Vaters und die Offenbarung des Sohnes. Denn als sie ihn sahen und hörten, ließ er sie ihn schmecken und den geliebten Sohn ergreifen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Im Koptischen steht hier „gut“; die folgende Aussage verwendet dagegen das griechische Lehnwort für „selig“.
    reason: Die Anmerkung sichert die auffällige lexikalische Unterscheidung, ohne sie durch eine alternative Hauptübersetzung einzuebnen.
lexical_decisions:
- source_word: ⲣⲡⲧⲉ
  choice: Schatten
  rationale: Bewahrt das Bild einer substanzlosen, bei Licht vergehenden Erscheinung.
- source_word: ⲱⲡⲧ
  choice: Trugbild
  rationale: Gibt die unwirkliche Erscheinung verständlich und würdig wieder, ohne sie zu einem bloßen Bild abzuschwächen.
- source_word: ⲧⲣⲙⲣⲟⲩ
  choice: Schrecken
  rationale: Passt sowohl zum affektiven Zustandskatalog als auch zum Bild des Albtraums.
- source_word: ⲙⲛⲧⲁⲧⲧⲁⲕⲁⲣⲉⲓⲥ
  choice: Verwirrung
  rationale: Deckt Unruhe, Störung und Unordnung ab, ohne den psychischen Zustand zu eng festzulegen.
- source_word: ⲙⲛⲧϩⲏⲧ
  choice: Haltlosigkeit
  rationale: Bewahrt die Vorstellung mangelnder Festigkeit und fügt sich in den Katalog innerer Zustände.
- source_word: ⲥⲛⲉⲩ
  choice: Spaltung
  rationale: Erhält sowohl den Sinn von Trennung als auch den von innerem oder gemeinschaftlichem Zwiespalt.
- source_word: ⲡⲱϣⲉ
  choice: Zweifel
  rationale: Entspricht dem erkenntnisbezogenen Zusammenhang der Unwissenheit.
- source_word: ⲙⲙⲛⲧⲁ
  choice: nichtige Nichtigkeit
  rationale: Bewahrt bewusst die zugespitzte Sprache des Nichtseins und der Vergeblichkeit, ohne sie metaphysisch eindeutig festzulegen.
- source_word: ⲡϭⲁⲗ
  choice: Schlaf
  rationale: Das konkrete Wort trägt zugleich die zentrale Metapher für Unwissenheit.
- source_word: ⲛⲉⲉⲓ
  choice: Träume
  rationale: Im Gleichnis sind gewöhnliche nächtliche Träume, nicht prophetische Visionen, gemeint.
- source_word: ⲥⲙⲙⲛⲧⲟⲩ
  choice: erwachen
  rationale: Markiert den Übergang von Unwissenheit zu Erkenntnis und erhält das durchgehende Schlafbild.
- source_word: ⲥⲁⲩⲛⲉ
  choice: Erkenntnis
  rationale: Im Deutschen trägt „Erkenntnis“ den hier gemeinten existenziellen und heilshaften Sinn besser als das neutralere „Wissen“, ohne den Fachausdruck „Gnosis“ einzuführen.
- source_word: ⲡⲓⲡⲛⲁ
  choice: der Geist
  rationale: Der bestimmte Ausdruck bezeichnet hier einen handelnden Geist; „heilig“ wird nicht ergänzt, weil es im vorliegenden Wortlaut nicht ausdrücklich steht.
theological_decisions:
- issue: Bestimmung des Geistes (ⲡⲓⲡⲛⲁ)
  choice: „der Geist“ ohne ergänzendes Adjektiv
  alternative: „der Heilige Geist“ oder „ein Geist“
  rationale: Das persönliche Handeln legt einen bestimmten göttlichen Geist nahe; dennoch wird „heilig“ nicht in den Haupttext eingefügt, da es im erhaltenen Ausdruck nicht ausdrücklich steht.
- issue: Erkenntnis des Vaters
  choice: „Erkenntnis“
  alternative: „Wissen“ oder „Gnosis“
  rationale: „Erkenntnis“ bleibt allgemein verständlich und bewahrt zugleich den umfassenden, verwandelnden Sinn des Begriffs.
- issue: Unwirklichkeit der Albtraumerfahrungen
  choice: Die wiederholte Aussage „diese Dinge sind nichts“ bleibt ungemildert stehen.
  alternative: Psychologisierende Wiedergabe wie „sie waren nur Einbildung“
  rationale: Der Text lässt die ontologische und bildhafte Spannung bewusst offen; eine rein psychologische Erklärung würde sie vorschnell auflösen.
- issue: Auferwecken des am Boden Liegenden
  choice: „denn er war noch nicht auferstanden“
  alternative: „denn er war noch nicht aufgestanden“
  rationale: Das Verb kann im Bild das körperliche Aufstehen bezeichnen, trägt im theologischen Zusammenhang aber auch Auferstehungssinn. „Auferstanden“ bewahrt diese Spannung.
- issue: Schmecken und Ergreifen des Sohnes
  choice: Die körpernahen Verben „schmecken“ und „ergreifen“ werden beibehalten.
  alternative: 'Abstrakter: „erfahren“ und „begreifen“'
  rationale: Die sinnliche Sprache des Ausgangstextes soll nicht in rein intellektuelle Erkenntnissprache aufgelöst werden.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, bildkräftigem Predigtton. Die kurzen Parallelreihen des Albtraumgleichnisses und die Gegensätze Schlaf–Erwachen, Unwissenheit–Erkenntnis sowie Nacht–Licht bleiben deutlich. Ungewöhnliche Bilder wie „ihn schmecken“ werden wegen ihrer theologischen und poetischen Tragweite nicht geglättet.
