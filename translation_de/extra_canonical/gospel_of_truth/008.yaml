  revised_text: 'Was wollte er also, dass sie dachten? Dass sie wie ein Schatten und ein Trugbild der Nacht ins Dasein gekommen waren.


    Wenn das Licht auf den Schrecken fällt, der sie ergriffen hatte, erweist er sich als nichts. So kannten sie den Vater nicht, den sie nicht sahen. Denn da waren Schrecken und Verwirrung, Haltlosigkeit, Spaltung und Zweifel. Viele leere Täuschungen waren unter ihnen am Werk und nichtige Nichtigkeit – als wären sie in tiefen Schlaf gesunken und fänden sich in ihren Träumen in Albträumen wieder.


    Bald laufen sie irgendwohin, bald können sie vor jemandem nicht fliehen; bald kämpfen sie oder werden geschlagen; bald stürzen sie aus großer Höhe oder fliegen ohne Flügel durch die Luft. Manchmal scheint es auch, als töte sie jemand, obwohl niemand sie verfolgt; oder sie selbst töten die Menschen um sich herum und sind mit ihrem Blut beschmiert. Solange die, die all dies durchmachen, nicht erwachen, sehen sie nichts – denn diese Dinge sind nichts.


    So verhält es sich mit denen, die die Unwissenheit wie einen Schlaf abgeschüttelt haben: Sie halten sie für nichts und auch ihre übrigen Werke nicht für wirklich, sondern lassen sie zurück wie einen Traum der Nacht. Die Erkenntnis des Vaters schätzen sie wie das Licht. Die Unwissenden handelten wie Schlafende; die zur Erkenntnis Gelangten handelten wie Erwachte.


    Gut ist, wer umkehrt und erwacht![a] Selig ist, wer die Augen der Blinden öffnet!


    Der Geist eilte ihnen nach, um sie lebendig zu machen. Er reichte dem, der am Boden lag, die Hand und stellte ihn auf die Füße, denn er war noch nicht aufgestanden. Er schenkte ihnen die Erkenntnis des Vaters und die Offenbarung des Sohnes. Denn als sie ihn sahen und hörten, ließ er sie ihn schmecken und den geliebten Sohn ergreifen.'
