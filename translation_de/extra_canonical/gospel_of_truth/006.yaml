review_pass:
  verdict: revise
  source_fidelity: 'Die Fassung gibt den Hauptgang der koptischen Passage zuverlässig wieder: das Gericht von oben, das zweischneidige Schwert, die leibliche Erscheinung des Wortes, die Gefäßbilder und die Personifikationen von Irrtum, Erkenntnis und Wahrheit. Eine wesentliche Auslassung bzw. Umformung liegt jedoch im Satz über diejenigen vor, die die Wahrheit lieben und mit ihr verbunden sind. Außerdem sollte die Aussage, dass die Erkenntnis der Untergang des Irrtums ist, unmittelbarer wiedergegeben werden.'
  naturalness: Modernes, würdiges Standarddeutsch; die Satzfolge ist klar. „Sie begrüßten den Vater“ trifft das hier verwendete Begrüßungsverb natürlicher und genauer als „nahmen den Vater ... auf“.
  terminology: „Gericht“, „Wort“, „Leib“, „Gefäße“, „Irrtum“, „Erkenntnis“, „Wahrheit“, „Heiliger Geist“ sowie die Mund-und-Zunge-Metaphorik sind konsistent und quellenangemessen. „Bestand“ ist für Stabilität gut vertretbar.
  issues:
  - severity: high
    issue: Der Satz über die mit Wahrheit Verbundenen lässt das Lieben der Wahrheit aus und ersetzt dessen Subjekt durch eine allgemeinere Bedingung.
    rationale: 'Der Text lautet sinngemäß: „Jeder, der die Wahrheit liebt und mit ihr verbunden ist, ist mit dem Mund des Vaters verbunden; durch seine Zunge wird er den Heiligen Geist empfangen.“ Die vorliegende Formulierung „Wer mit der Wahrheit verbunden ist ...“ unterschlägt „liebt die Wahrheit“ und glättet damit einen ausdrücklichen Zug der Quelle.'
  - severity: medium
    issue: „Sie nahmen den Vater in Wahrheit auf“ ist für das Quellverb zu ungenau.
    rationale: Das griechische Lehnverb bezeichnet hier begrüßen/willkommen heißen. „Begrüßten den Vater in Wahrheit“ wahrt die Handlung und vermeidet die zusätzliche Konnotation eines innerlichen Aufnehmens.
  - severity: medium
    issue: Die Fußnote b behauptet eine Beschädigung bzw. OCR-Unsicherheit und bietet eine alternative Gliederung, obwohl der zugrunde liegende Satz inhaltlich hinreichend klar ist.
    rationale: Die Fußnote verschiebt den Text zu einer bloßen Möglichkeit und kann den Eindruck eines textkritisch belegten Schadens erwecken. Der sichere Haupttext soll die Aussage einschließlich „die Wahrheit liebt“ wiedergeben; eine Fußnote ist hierfür nicht erforderlich.
  - severity: low
    issue: „die seine Vernichtung bedeutet“ schwächt die Prädikation der Erkenntnis ab.
    rationale: Die Quelle bezeichnet die Erkenntnis als den Untergang bzw. die Zerstörung des Irrtums. „die sein Untergang ist“ ist direkter und bewahrt die personifizierte Gegenüberstellung.
