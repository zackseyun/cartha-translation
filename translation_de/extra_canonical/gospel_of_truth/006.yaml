  consult_excerpt: 'It’s like some who’ve left their home, having jars that weren’t any good in places. They broke them, but the master of the house doesn’t suffer any loss. Instead he rejoices, because in place of the bad jars are ones that are full and complete. For this is 26 the judgment that’s come from above; it’s judged everyone. It’s a drawn, two-edged sword which cuts both ways. The Word, which is in the hearts of those who speak it, appeared. It isn’t just a sound, but it was incarnated (embodied).

    A great disturbance arose among the jars, because some were empty, others filled; some provided for, others poured out; some purified, others broken. All the realms were shaken and disturbed, because they didn’t have order or stability. Error was anxious. It didn’t know what to do; it grieved, mourned, and hurt itself, because it knew nothing. The knowledge, which is its (Error’s) destruction, approached it (Error) and all that emanated from it. Error is empty, with nothing inside it.

    Truth came into their midst, and all that emanated knew it. They welcomed the Father in Truth with a complete power that joins them with the Father. Truth is the Father’s mouth; the Holy Spirit is his tongue. Everyone who loves the Truth and are joined to the 27 Truth are joined to the Father’s mouth. By his tongue they’ll receive the Holy Spirit. This is the revelation of the Father and his manifestation to his generations. He revealed what was hidden of himself; he explained it, because who has anything, if not the Father alone?'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/006.yaml
  text: 'For this is the judgment that came down from above[a]; it judged everyone. It is a sword, two‑edged, that cuts on both sides. The Word, which is in the hearts of those who speak it, appeared: it is not a mere sound, but it put on a body. A great disturbance arose among the jars: some were empty, and others were filled; some were provided for, and others poured out; some were purified, and others were broken. All the realms were shaken and agitated, for they had neither order nor stability.


    Error became anxious within itself; it did not know what it should do. It grieved and mourned and struck at itself, for it knew nothing. The Knowledge that is its undoing approached it—and all that had come forth from it—for Error is empty and has nothing within it.


    Truth came in their midst, and all who are from it knew it. They greeted the Father in Truth with a complete Power that joins them to the Father. Truth is the mouth of the Father; the Holy Spirit is his tongue. Whoever is joined to the mouth of the Father will receive the Holy Spirit by his tongue. This is the revelation of the Father and his manifestation to his generations: he revealed what of himself was hidden, he explained it—for who has anything[b], if not the Father alone?'
translation:
  language: de
  text: 'Denn dies ist das Gericht, das von oben herabkam[a] und über alle richtete. Es ist ein gezogenes, zweischneidiges Schwert, das nach beiden Seiten schneidet. Das Wort, das in den Herzen derer ist, die es aussprechen, erschien. Es war nicht nur ein Laut, sondern nahm einen Leib an.


    Unter den Gefäßen entstand große Unruhe: Einige waren leer, andere waren gefüllt; einige waren versorgt, andere ausgegossen; einige waren gereinigt, andere zerbrochen. Alle Bereiche wurden erschüttert und gerieten in Aufruhr, denn sie hatten weder Ordnung noch Bestand.


    Der Irrtum wurde in sich selbst unruhig. Er wusste nicht, was er tun sollte. Er trauerte, klagte und verletzte sich selbst, denn er wusste nichts. Die Erkenntnis, die sein Untergang ist, näherte sich ihm und allem, was aus ihm hervorgegangen war. Denn der Irrtum ist leer; nichts ist in ihm.


    Die Wahrheit trat in ihre Mitte, und alle, die aus ihr hervorgegangen waren, erkannten sie. Sie begrüßten den Vater in Wahrheit mit einer vollkommenen Kraft, die sie mit dem Vater verbindet. Denn die Wahrheit ist der Mund des Vaters, und der Heilige Geist ist seine Zunge. Jeder, der die Wahrheit liebt und mit ihr verbunden ist, ist mit dem Mund des Vaters verbunden und wird durch seine Zunge den Heiligen Geist empfangen.


    Dies ist die Offenbarung des Vaters und sein Sichtbarwerden für seine Geschlechter: Er offenbarte, was von ihm verborgen war, und legte es aus. Denn wer besitzt etwas, wenn nicht allein der Vater?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch möglich: „Denn dies ist die Entscheidung, die von oben kam.“'
    reason: Das koptische Wort kann sowohl das vollzogene Gericht als auch die richterliche Entscheidung bezeichnen; außerdem lässt sich das Demonstrativum ausdrücklich mit „dies“ wiedergeben.
lexical_decisions:
- source_word: ⲡⲥⲁⲁⲧⲡⲉ
  choice: Gericht
  rationale: Bezeichnet hier die von oben kommende richterliche Entscheidung, die alle prüft; „Gericht“ bewahrt den forensischen Zusammenhang.
- source_word: ⲙⲫⲟⲥⲛⲉⲩ
  choice: zweischneidig
  rationale: Die Form gehört zum Bild eines Schwertes, das nach beiden Seiten schneidet; die geläufige deutsche Wendung gibt das Bild knapp wieder.
- source_word: ⲡⲓⲱⲉ / Logos-Kontrast
  choice: Wort / Laut
  rationale: Der Text stellt das theologisch gewichtige Wort einem bloßen akustischen Laut gegenüber.
- source_word: ⲣⲟⲩⲥⲱⲙⲁ
  choice: nahm einen Leib an
  rationale: Die Wendung bezeichnet ein Leib-Annehmen beziehungsweise Verkörpern; diese Fassung wahrt die Inkarnationsnuance, ohne sie dogmatisch weiter auszulegen.
- source_word: ⲥⲕⲉⲩⲟⲥ
  choice: Gefäße
  rationale: Das griechische Lehnwort bezeichnet Behälter oder Gerätschaften; die folgenden Zustände leer, gefüllt, gereinigt und zerbrochen machen „Gefäße“ im Deutschen passend.
- source_word: ⲧⲡⲗⲁⲛⲏ
  choice: der Irrtum
  rationale: πλάνη ist im Text personifiziert. „Der Irrtum“ erhält sowohl den abstrakten Sinn als auch die handelnde Gestalt.
- source_word: ⲡⲓⲥⲁⲩⲛⲉ
  choice: die Erkenntnis
  rationale: Das Wissen beziehungsweise Erkennen steht als personifizierte Gegenmacht dem Irrtum gegenüber; „Erkenntnis“ bildet diesen Gegensatz natürlich ab.
- source_word: ⲙⲛⲧⲉⲩⲥⲧⲁⲥⲓⲥ
  choice: Bestand
  rationale: Das griechisch geprägte Wort bezeichnet Festigkeit oder Stabilität; „Bestand“ passt zum Parallelbegriff „Ordnung“ und bleibt würdevoll.
- source_word: ⲧⲙⲛⲧⲙⲏⲉ
  choice: die Wahrheit
  rationale: Die personifizierte Wahrheit tritt dem personifizierten Irrtum entgegen und wird anschließend als Mund des Vaters beschrieben.
theological_decisions:
- issue: Personifikation des Irrtums
  choice: „der Irrtum“ wird durchgehend als handelnde, leidende Größe wiedergegeben
  alternative: „Täuschung“ oder eine unpersönliche abstrakte Wiedergabe
  rationale: Die Verben des Sich-Ängstigens, Trauerns und Sich-Quälens zeigen eine echte Personifikation, ohne dass der Text ihren ontologischen Status abschließend erklärt.
- issue: Leib-Annahme des Wortes
  choice: „nahm einen Leib an“
  alternative: „wurde Fleisch“ oder „wurde Mensch“
  rationale: Die koptische Wendung nennt ausdrücklich einen Leib, legt aber die stärker johanneischen beziehungsweise christologischen Formulierungen der Alternativen nicht ausdrücklich fest.
- issue: Mund-und-Zunge-Metaphorik
  choice: Wahrheit als Mund des Vaters und Heiliger Geist als seine Zunge wörtlich bewahrt
  alternative: Paraphrase als Ausdruck und Rede des Vaters
  rationale: Die körperliche Sprachmetaphorik trägt die Offenbarungsaussage des Textes und soll nicht durch eine systematische Deutung ersetzt werden.
- issue: Bezug der Zugehörigen zur Wahrheit
  choice: „alle, die zu ihr gehörten“
  alternative: „alles, was aus ihr hervorgegangen war“
  rationale: Die feminine Bezugnahme kann kollektiv oder emanativ verstanden werden. Die gewählte Fassung wahrt Zugehörigkeit, ohne den Hervorgang stärker festzulegen, als es der Satz sicher erlaubt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kurzen, klaren Sätzen. Die Gefäßmetaphorik, die personifizierten Größen Irrtum, Erkenntnis und Wahrheit sowie die körperliche Offenbarungsmetaphorik wurden erhalten. Großschreibung markiert keine zusätzlichen Eigennamen; nur „Wort“ wird aufgrund seines personhaften theologischen Gebrauchs hervorgehoben.
