- from: 'Denn das Gericht kam von oben herab[a] und richtete über alle. Es ist ein gezogenes, zweischneidiges Schwert, das nach beiden Seiten schneidet. Das Wort, das in den Herzen derer ist, die es aussprechen, erschien. Es war nicht nur ein Laut, sondern nahm einen Leib an.


    Unter den Gefäßen entstand große Unruhe: Einige waren leer, andere waren gefüllt; einige waren versorgt, andere ausgegossen; einige waren gereinigt, andere zerbrochen. Alle Bereiche wurden erschüttert und gerieten in Aufruhr, denn sie hatten weder Ordnung noch Bestand.


    Der Irrtum wurde in sich selbst unruhig. Er wusste nicht, was er tun sollte. Er trauerte, klagte und quälte sich selbst, denn er wusste nichts. Die Erkenntnis, die seine Vernichtung bedeutet, näherte sich ihm und allem, was aus ihm hervorgegangen war. Denn der Irrtum ist leer; nichts ist in ihm.


    Die Wahrheit trat in ihre Mitte, und alle, die zu ihr gehörten, erkannten sie. Sie nahmen den Vater in Wahrheit auf, mit einer vollkommenen Kraft, die sie mit dem Vater verbindet. Denn die Wahrheit ist der Mund des Vaters, und der Heilige Geist ist seine Zunge. Wer mit der Wahrheit verbunden ist, ist mit dem Mund des Vaters verbunden und wird durch seine Zunge den Heiligen Geist empfangen.[b]


    Dies ist die Offenbarung des Vaters und sein Sichtbarwerden für seine Geschlechter: Er offenbarte, was von ihm verborgen war, und legte es aus. Denn wer besitzt etwas, wenn nicht allein der Vater?'
  to: 'Denn dies ist das Gericht, das von oben herabkam[a] und über alle richtete. Es ist ein gezogenes, zweischneidiges Schwert, das nach beiden Seiten schneidet. Das Wort, das in den Herzen derer ist, die es aussprechen, erschien. Es war nicht nur ein Laut, sondern nahm einen Leib an.


    Unter den Gefäßen entstand große Unruhe: Einige waren leer, andere waren gefüllt; einige waren versorgt, andere ausgegossen; einige waren gereinigt, andere zerbrochen. Alle Bereiche wurden erschüttert und gerieten in Aufruhr, denn sie hatten weder Ordnung noch Bestand.


    Der Irrtum wurde in sich selbst unruhig. Er wusste nicht, was er tun sollte. Er trauerte, klagte und verletzte sich selbst, denn er wusste nichts. Die Erkenntnis, die sein Untergang ist, näherte sich ihm und allem, was aus ihm hervorgegangen war. Denn der Irrtum ist leer; nichts ist in ihm.


    Die Wahrheit trat in ihre Mitte, und alle, die aus ihr hervorgegangen waren, erkannten sie. Sie begrüßten den Vater in Wahrheit mit einer vollkommenen Kraft, die sie mit dem Vater verbindet. Denn die Wahrheit ist der Mund des Vaters, und der Heilige Geist ist seine Zunge. Jeder, der die Wahrheit liebt und mit ihr verbunden ist, ist mit dem Mund des Vaters verbunden und wird durch seine Zunge den Heiligen Geist empfangen.


    Dies ist die Offenbarung des Vaters und sein Sichtbarwerden für seine Geschlechter: Er offenbarte, was von ihm verborgen war, und legte es aus. Denn wer besitzt etwas, wenn nicht allein der Vater?'
  rationale: 'Die Revision ergänzt die im Original ausdrücklich genannten Liebenden der Wahrheit und bewahrt die Abfolge: mit der Wahrheit verbunden sein, mit dem Mund des Vaters verbunden sein, den Heiligen Geist durch dessen Zunge empfangen. Sie ersetzt ferner „aufnehmen“ durch „begrüßen“, fasst die Erkenntnis als Untergang des Irrtums und entfernt die nicht nötige, irreführend unsicherheitsmarkierende Fußnote b. Die sonstige Bildsprache und der Registerton bleiben erhalten.'
