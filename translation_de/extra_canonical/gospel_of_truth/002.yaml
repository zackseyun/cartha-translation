review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung trifft die wesentlichen Motive und Fachbegriffe der überlieferten Passage überwiegend gut. Der deutsche Entwurf stellt jedoch den Schlussabschnitt über das Vergessen an den Anfang und unterbricht damit die im koptischen Text bezeugte Abfolge: Gute Botschaft/Jesus Christus – Irrtum und Holz/Frucht – Vater und das All – Vergessen und Erkenntnis. Außerdem ist ⲡⲧⲏⲣϥ ⲉϥϣⲁⲁⲧ ⲙⲙⲁϥ präziser als „Das All bedarf seiner“ wiederzugeben; „ihm mangelt das All“ ist im Deutschen semantisch verkehrt bzw. mindestens missverständlich.'
  naturalness: Die Sprache ist modern, würdig und gut lesbar. Einzelne Formulierungen wurden geglättet, insbesondere „gab ihnen Anlass, sich über das Finden zu freuen“ zu einer näher am Koptischen bleibenden Formulierung und „ihm mangelt das All“ zu „Das All bedarf seiner“.
  terminology: „Irrtum“, „Vergessen“, „Erkenntnis“, „Wahrheit“, „Vater“ und „das All“ sind angemessen und halten die reifizierende beziehungsweise kosmologische Sprache des Textes offen. „Holz“ wahrt die Baum-/Holz- und Fruchtbildlichkeit, ohne „Kreuz“ in den Text einzutragen. Die Personifikation von Irrtum und Vergessen wird aus den Prädikaten des Textes übernommen, nicht dogmatisch ausgeweitet.
  issues:
  - severity: high
    issue: Die Abschnitte sind gegenüber der koptischen Überlieferungsfolge umgestellt.
    rationale: Der Entwurf beginnt mit „Das Vergessen entstand nicht aus dem Vater“, einem Schlussabschnitt der Passage, und setzt danach mit der guten Botschaft und der Jesus-/Irrtumsszene fort. Der vorliegende Text führt diese Schlussfolgerung erst nach der Darstellung des Vaters und des Alls aus. Die Umstellung verändert Argumentationsgang und Referenzen.
  - severity: medium
    issue: „ihm mangelt das All“ gibt die Abhängigkeitsrelation unnatürlich und missverständlich wieder.
    rationale: Die Aussage besagt, dass das All seiner bedarf, nicht dass dem Vater das All fehlt. „Das All bedarf seiner“ ist sowohl idiomatisch als auch sachlich präzise.
  - severity: low
    issue: „gab sie ihnen Anlass, sich über das Finden zu freuen“ ist freier als nötig.
    rationale: Die koptische Konstruktion besagt, dass die Frucht den Essenden gab, freudig zu werden. „Sie gab ihnen, freudig zu werden“ bewahrt die knappe, absichtlich dichte Ausdrucksweise besser.
  revised_text: '**Irrtum und Vergessen**


    Dies ist die gute Botschaft von dem, den sie suchten.[a] Er offenbarte sie den Vollkommenen durch die Barmherzigkeit des Vaters: das verborgene Geheimnis, Jesus Christus. Durch ihn erleuchtete er die, die wegen des Vergessens in der Finsternis waren. Er erleuchtete sie und zeigte ihnen einen Weg; dieser Weg aber ist die Wahrheit.


    Der Irrtum wurde zornig auf ihn, verfolgte ihn, bedrängte ihn und machte ihn zunichte. Man nagelte ihn an ein Holz,[b] und er wurde zu einer Frucht der Erkenntnis des Vaters. Doch diese Frucht brachte denen, die von ihr aßen, nicht den Untergang. Vielmehr gab sie ihnen, freudig zu werden, weil sie gefunden hatten.


    Er fand sie in sich, und sie fanden ihn in sich: den Unfassbaren, den Unbegreiflichen, den Vater, den Vollkommenen, der das All[c] geschaffen hat. Das All ist in ihm, und das All bedarf seiner. Denn er bewahrte dessen Vollkommenheit in sich, die er dem All noch nicht gegeben hatte.


    Der Vater war nicht missgünstig. Denn wie könnte es zwischen ihm und seinen Gliedern Missgunst geben?


    Das Vergessen entstand nicht aus dem Vater, obwohl es seinetwegen entstand.[d] Was aber in ihm entsteht, ist die Erkenntnis. Sie wurde offenbar, damit das Vergessen sich auflöst und der Vater erkannt wird. Denn das Vergessen entstand, weil man den Vater nicht kannte. Sobald man aber den Vater erkennt, wird das Vergessen nicht mehr bestehen.'
  revised_footnotes:
  - marker: a
    text: 'Der Beginn des Satzes ist im vorliegenden OCR-Text nicht vollständig sicher lesbar. Die Übersetzung folgt der im Zusammenhang und in der etablierten Rekonstruktion bezeugten Lesung: „Dies ist die gute Botschaft von dem, den sie suchten.“'
    reason: Die Fußnote kennzeichnet die Unsicherheit der OCR-Überlieferung, ohne die rekonstruierte Aussage als bloße Vermutung auszugeben.
  - marker: b
    text: Das koptische Wort kann „Baum“ oder „Holz“ bedeuten. Gemeint ist im Zusammenhang das Holz, an das Jesus genagelt wurde; zugleich bereitet das Wort das folgende Bild von der Frucht vor.
    reason: Die Anmerkung erläutert die bewusste Wiedergabe, ohne „Kreuz“ als nicht wörtlich vorhandenen Ausdruck in den Text einzutragen.
  - marker: c
    text: „Das All“ bezeichnet die Gesamtheit aller Seienden beziehungsweise die kosmische Fülle.
    reason: Der Ausdruck ist hier ein technischer, kosmologisch gefärbter Terminus und nicht bloß das Pronomen „alles“.
  - marker: d
    text: 'Wörtlich sinngemäß: Das Vergessen entstand nicht „aus“ dem Vater, wohl aber „wegen“ beziehungsweise „um seinetwillen“ – nämlich weil er unbekannt war.'
    reason: Die Fußnote bewahrt die wichtige Unterscheidung zwischen Ursprung und Anlass.
  revision_rationale: Die sichere Korrektur besteht vor allem in der Wiederherstellung der Textreihenfolge. Dadurch folgt die deutsche Fassung dem argumentativen Verlauf der Quelle und des englischen POB-Audit-Trails. Terminologie und zurückhaltende Behandlung der theologischen Bildsprache bleiben erhalten. Die Formulierung über die Abhängigkeit des Alls wurde korrigiert; die Fußnotenanker wurden an die neue Reihenfolge angepasst.
