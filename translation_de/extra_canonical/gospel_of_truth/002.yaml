  consult_excerpt: 'Since all searched for the one from whom they had come – all were within him, the uncontainable, inconceivable one who’s beyond every thought – (and) since ignorance of the Father caused anguish and terror, and the anguish grew thick like a fog, so that no one could see – Error was strengthened. It worked on its own matter in vain, not knowing the Truth.

    It happened in a deluding way, as it (Error) prepared with power, in beauty, a substitute for the Truth. Now this wasn’t humiliating for the uncontainable, inconceivable one, because the anguish and forgetfulness and delusion of deceit were like nothing, whereas the Truth is established, unchangeable, unperturbed, beyond beauty. Because of this, disregard Error, since it has no root.

    It happened in a fog concerning the Father. It happens (now) since it (Error) prepares works in forgetfulness and terror, so that with them it (Error) might attract those in the middle and imprison them.

    The forgetfulness of Error wasn’t revealed; it wasn’t a 18 [thought] from the Father. Forgetfulness didn’t come into being from the Father, though it did come into being because of him. What comes into being within him is the knowledge, which was revealed so that forgetfulness might be dissolved, and the Father might be known. Forgetfulness came into being because the Father was unknown, so when the Father comes to be known, forgetfulness won’t exist anymore.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/gospel_of_truth/002.yaml
  text: 'Since all were searching for the One from whom they had come forth — and they were all within him, the uncontainable, inconceivable One beyond every thought — and since ignorance of the Father brought distress and dread, and the distress thickened like a fog so that no one could see, Error was strengthened. It worked at its own matter to no purpose, because it did not know the Truth.


    It came about in a delusive manner: Error arrayed, with power and with a certain beauty, a substitute for the Truth. Yet this did not disgrace the Uncontainable, the Inconceivable; for the distress and the Forgetfulness and the illusion of deceit are as nothing, while the Truth stands firm — unchanging, untroubled, beyond beauty. Because of this, disregard Error, for it has no root.


    It happened in a fog with respect to the Father; and it happens even now: Error prepares works in Forgetfulness and in fear, so that by means of them it might draw those who are in the middle and imprison them.


    The Forgetfulness of Error was not revealed; it was not a thought from the Father. Forgetfulness did not come into being from the Father — though it did come into being on account of him. What comes into being within him is the knowledge, which was manifested so that Forgetfulness might be dissolved and the Father might be known. Since Forgetfulness arose because the Father was unknown, once the Father comes to be known, Forgetfulness will no longer exist.'
translation:
  language: de
  text: '**Irrtum und Vergessen**


    Das Vergessen entstand nicht aus dem Vater, obwohl es seinetwegen entstand.[a] Was aber in ihm entsteht, ist die Erkenntnis. Sie wurde offenbar, damit das Vergessen sich auflöst und der Vater erkannt wird. Denn das Vergessen entstand, weil man den Vater nicht kannte. Sobald man aber den Vater erkennt, wird das Vergessen nicht mehr bestehen.


    Dies ist die gute Botschaft von dem, den sie suchten.[b] Er offenbarte sie den Vollkommenen durch die Barmherzigkeit des Vaters: das verborgene Geheimnis, Jesus Christus. Durch ihn erleuchtete er die, die wegen des Vergessens in der Finsternis waren. Er erleuchtete sie und zeigte ihnen einen Weg; dieser Weg aber ist die Wahrheit.


    Der Irrtum wurde zornig auf ihn, verfolgte ihn, bedrängte ihn und machte ihn zunichte. Man nagelte ihn an ein Holz,[c] und er wurde zu einer Frucht der Erkenntnis des Vaters. Doch diese Frucht brachte denen, die von ihr aßen, nicht den Untergang. Vielmehr gab sie ihnen Anlass, sich über das Finden zu freuen.


    Er fand sie in sich, und sie fanden ihn in sich: den Unfassbaren, den Unbegreiflichen, den Vater, den Vollkommenen, der das All[d] geschaffen hat. Das All ist in ihm, und ihm mangelt das All. Denn er behielt ihre Vollkommenheit in sich, die er dem All noch nicht gegeben hatte.


    Der Vater war nicht missgünstig. Denn wie könnte es zwischen ihm und seinen Gliedern Missgunst geben?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich sinngemäß: Das Vergessen entstand nicht „aus“ dem Vater, wohl aber „wegen“ beziehungsweise „um seinetwillen“ – nämlich weil er unbekannt war.'
    reason: Die Fußnote bewahrt die theologisch wichtige Unterscheidung zwischen Herkunft und Anlass.
  - marker: b
    text: 'Der Beginn dieses Satzes ist im vorliegenden OCR-Text unsicher überliefert; der Zusammenhang und die etablierte Textrekonstruktion ergeben: „Dies ist die gute Botschaft von dem, den sie suchten.“'
    reason: Die OCR-Zeichenfolge ist beschädigt beziehungsweise fehlerhaft erkannt, während Satzbau und Überlieferung eine plausible Rekonstruktion erlauben.
  - marker: c
    text: Das koptische Wort kann „Baum“ oder „Holz“ bedeuten. Gemeint ist im Zusammenhang das Holz, an das Jesus genagelt wurde; zugleich bereitet das Wort das folgende Bild von der Frucht vor.
    reason: Die deutsche Wiedergabe muss Kreuzigungsanspielung und Baum-Frucht-Wortfeld zugleich sichtbar halten.
  - marker: d
    text: „Das All“ bezeichnet die Gesamtheit aller Seienden beziehungsweise die kosmische Fülle.
    reason: Der technische Gebrauch unterscheidet sich vom gewöhnlichen deutschen Pronomen „alles“.
lexical_decisions:
- source_word: ⲁⲧⲙⲉⲉⲩⲉ
  choice: Vergessen
  rationale: Das substantivierte „Vergessen“ wahrt den kosmologisch verdichteten Charakter des Begriffs, ohne durch Großschreibung eine eigenständige Person festzulegen.
- source_word: ⲥⲁⲩⲛⲉ
  choice: Erkenntnis
  rationale: Im Gegensatz zum Nichtkennen des Vaters bezeichnet das Wort nicht bloß Information, sondern wirksames Erkennen; „Erkenntnis“ passt zum würdevollen theologischen Register.
- source_word: ⲧⲡⲗⲁⲛⲏ
  choice: der Irrtum
  rationale: Der maskuline deutsche Ausdruck lässt sich im Zusammenhang handelnd darstellen und erhält den Gegensatz zur Wahrheit; „Täuschung“ wäre möglich, würde aber die Dimension des Verirrens verengen.
- source_word: ⲧⲙⲛⲧⲙⲏⲉ
  choice: die Wahrheit
  rationale: Die abstrakte und zugleich personifiziert auftretende Gegenmacht zum Irrtum wird direkt und traditionsgemäß wiedergegeben.
- source_word: ⲧⲃϣⲉ
  choice: Holz
  rationale: Das koptische Wort bezeichnet Baum beziehungsweise Holz. „Holz“ bewahrt die konkrete Kreuzigungsanspielung, ohne ausdrücklich „Kreuz“ in den Wortlaut einzutragen.
- source_word: ⲡⲧⲏⲣϥ
  choice: das All
  rationale: Die substantivierte Gesamtheit bezeichnet hier die kosmische Fülle aller Seienden; „das All“ ist knapp und bewahrt den technischen Klang.
- source_word: ⲫⲑⲟⲛⲟⲥ
  choice: Missgunst
  rationale: Der griechische Lehnbegriff bezeichnet Neid oder Missgunst. „Missgunst“ passt zur Aussage, der Vater halte Vollkommenheit nicht aus neidischer Haltung zurück.
theological_decisions:
- issue: Verhältnis des Vergessens zum Vater
  choice: „nicht aus dem Vater“, aber „seinetwegen“, weil er unbekannt war
  alternative: Der Vater habe das Vergessen hervorgebracht oder als Werkzeug verursacht.
  rationale: 'Der Text unterscheidet ausdrücklich Ursprung und Anlass. Damit bleibt die Spannung bestehen: Das Vergessen entsteht in Bezug auf den unbekannten Vater, stammt aber nicht aus ihm.'
- issue: Personifikation des Irrtums
  choice: Der Irrtum handelt grammatisch wie eine Macht, ohne als eigenständige Gottheit bezeichnet zu werden.
  alternative: „Irrtum“ ausschließlich als psychologischen Zustand oder ausdrücklich als kosmische Person lesen.
  rationale: Die Verben Zorn, Verfolgung und Bedrängnis tragen eine deutliche Personifikation, doch der Text definiert ihren ontologischen Rang nicht.
- issue: Das Holz und die Frucht der Erkenntnis
  choice: Die Kreuzigungsszene und das Fruchtbild werden nebeneinandergestellt, ohne sie dogmatisch auszudeuten.
  alternative: „Holz“ ausdrücklich mit „Kreuz“ ersetzen oder die Frucht mit einer bestimmten sakramentalen Lehre identifizieren.
  rationale: Der Wortlaut spielt klar auf die Kreuzigung und zugleich auf Baum- und Fruchtmotive an; eine weitergehende konfessionelle Festlegung wäre nicht textlich erzwungen.
- issue: Zurückbehaltene Vollkommenheit
  choice: „noch nicht gegeben hatte“
  alternative: Der Vater verweigere dem All seine Vollkommenheit grundsätzlich.
  rationale: Der folgende Ausschluss von Missgunst spricht gegen eine neidische Verweigerung. „Noch nicht“ macht den impliziten zeitlichen beziehungsweise offenbarungsgeschichtlichen Horizont verständlich, ohne den Vater als missgünstig darzustellen.
translation_notes:
  register: Moderne, würdige Standardsprache mit kurzen, gut lesbaren Sätzen. Die dichte Bildfolge von Finsternis, Weg, Holz und Frucht bleibt erhalten. Abstrakta werden nur dort personifiziert, wo die koptischen Handlungsverben dies nahelegen. Die Übersetzung folgt dem auf Seite 18 tatsächlich vorliegenden Text und setzt dessen ersten, von der Vorseite herüberreichenden Satz sinngemäß fort.
