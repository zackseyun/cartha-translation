base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/013.yaml
  text: 'The primal Psyche loved Eros, who lived with her, and poured her blood over him and over the earth. From that blood, the first rose sprouted from the earth, emerging from the thorn bush as a source of gladness for the light that was to appear from within the bush.


    In addition, after this, lovely flowers with pleasant fragrances sprouted from the earth in different varieties. They came from each of the virgin daughters of Pronoia, and when the daughters fell in love with Eros, they poured out their blood over him and over the earth.


    After these, all the plants sprouted from the earth in different varieties, bearing within themselves the seed of the authorities and their angels.


    After these, the authorities created different varieties of animal species from the waters, including reptiles and birds, bearing within themselves the seed of the authorities and their angels.


    However, before all these, when he appeared on the first day, he remained on earth for about two days. Then he departed from the lower Pronoia in heaven and ascended toward his light. Immediately, darkness obscured the entire cosmos.'
translation:
  language: de
  text: 'Und die ursprüngliche Psyche liebte Eros, der bei ihr wohnte, und vergoss ihr Blut über ihn und über die Erde. Aus diesem Blut spross die erste Rose aus der Erde hervor: Sie kam aus dem Dornbusch hervor als Quelle der Freude für das Licht, das aus dem Inneren des Busches erscheinen sollte.


    Danach sprossen außerdem liebliche, wohlriechende Blumen verschiedener Art aus der Erde hervor. Sie gingen aus jeder der jungfräulichen Töchter der Pronoia hervor; und als diese sich in Eros verliebt hatten, vergossen sie ihr Blut über ihn und über die Erde.


    Nach ihnen spross aus der Erde die ganze Pflanzenwelt in ihrer Vielfalt hervor. Die Pflanzen trugen in sich den Samen der Mächte und ihrer Engel.


    Danach erschufen die Mächte aus den Wassern die verschiedenen Arten von Tieren, darunter Kriechtiere und Vögel. Diese trugen in sich den Samen der Mächte und ihrer Engel.


    Doch noch vor all dem verweilte er, nachdem er am ersten Tag erschienen war, etwa zwei Tage auf der Erde. Dann verließ er die untere Pronoia im Himmel und stieg zu seinem Licht empor. Sogleich verhüllte Dunkelheit den gesamten Kosmos.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: primal Psyche
  choice: die ursprüngliche Psyche
  rationale: Der Eigenname Psyche bleibt erhalten; „ursprünglich“ gibt den zeitlich-kosmologischen Sinn von „primal“ in natürlichem Deutsch wieder, ohne „Urseele“ als Deutung einzuführen.
- source_word: Eros
  choice: Eros
  rationale: Der griechische Eigenname wird wie in der Überlieferungsschicht beibehalten und nicht auf „Liebe“ verengt.
- source_word: Pronoia
  choice: Pronoia
  rationale: Der personifizierte Fach- und Eigenname bleibt unübersetzt, damit seine besondere kosmologische Funktion nicht mit dem allgemeinen deutschen Wort „Vorsehung“ gleichgesetzt wird.
- source_word: authorities
  choice: Mächte
  rationale: „Mächte“ ist im Deutschen verständlich und bewahrt den kosmologischen Gruppenbegriff; „Obrigkeiten“ klänge hier irreführend politisch.
- source_word: seed
  choice: Samen
  rationale: Die konkrete Bildsprache und ihre mögliche kosmologische Mehrdeutigkeit werden bewahrt.
- source_word: reptiles
  choice: Kriechtiere
  rationale: Der traditionelle Sammelbegriff passt zum Schöpfungskontext und ist weiter als die modern-zoologische Kategorie „Reptilien“.
- source_word: cosmos
  choice: Kosmos
  rationale: Der kosmologische Fachton des Textes wird erhalten; „Welt“ könnte den Bedeutungsumfang unnötig verengen.
theological_decisions:
- issue: Bezug des männlichen Pronomens im Schlussabschnitt
  choice: Das unbestimmte „er“ wird ohne erklärenden Namen beibehalten.
  alternative: Eros oder eine andere zuvor erwähnte Gestalt ausdrücklich einsetzen.
  rationale: Die Vorlage lässt den Bezug offen; eine Identifizierung würde eine nicht gesicherte theologische Deutung in den Text eintragen.
- issue: Herkunft der Blumen aus den Töchtern der Pronoia
  choice: „Sie gingen aus jeder der jungfräulichen Töchter der Pronoia hervor“
  alternative: Die Töchter selbst mit den Blumen gleichsetzen.
  rationale: Die syntaktische Beziehung wird ausgedrückt, ohne die ontologische Beziehung zwischen Töchtern und Blumen genauer festzulegen, als es die Vorlage erlaubt.
- issue: Licht im Dornbusch
  choice: „das aus dem Inneren des Busches erscheinen sollte“
  alternative: Das Licht ausdrücklich christologisch oder als bestimmte Offenbarungsgestalt identifizieren.
  rationale: Die vorausweisende Bildsprache bleibt erhalten, ohne eine im Ausschnitt nicht ausdrücklich genannte Identität festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewahrten Eigennamen und kosmologischen Fachbegriffen. Wegen der noch ausstehenden direkten Prüfung des koptischen Textes ist die Fassung bewusst eng am bereitgestellten öffentlichen englischen Zeugen gehalten. Wiederholungen wie „aus der Erde hervor“ und „Samen der Mächte“ bleiben als strukturbildende Elemente weitgehend erhalten.
