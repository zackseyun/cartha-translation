review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die zentralen Aussagen des vorliegenden englischen Zeugen zuverlässig wieder: Sophia sendet Zoe/Eva, Adam ist ausdrücklich »seelenlos«, seine Nachkommen können »Gefäße des Lichts« werden, und Eva wird als diejenige angesprochen, die Adam Leben gegeben hat. In der zweiten Szene muss jedoch neben der ergänzten Einleitung auch die im Zeugen unmittelbar vor »Eve« markierte Lücke sichtbar bleiben. Außerdem sollte die kausale Verknüpfung bei der unmittelbaren Erfüllung ihrer Rede ausdrücklich erhalten werden.'
  naturalness: Modernes, verständliches und würdiges Standarddeutsch. »Ihr Ausspruch erfüllte sich sogleich in der Tat« ist idiomatischer und näher am Zeugen als »Ihre Worte wurden sogleich zur Tat«.
  terminology: Eigennamen sowie die theologisch und bildsprachlich bedeutsamen Begriffe »seelenlos«, »Gefäße des Lichts« und »Mutter der Lebenden« sind angemessen und ohne dogmatische Harmonisierung wiedergegeben.
  issues:
  - severity: medium
    issue: Die zweite, leere Klammermarkierung vor Eva fehlt im deutschen Text.
    rationale: Der vorgelegte Zeuge hat »[When] [] Eve«. Die Übersetzung bewahrt zwar die unsichere Ergänzung »[Als]«, tilgt aber die zusätzliche sichtbar ausgewiesene Textlücke. Da deren Umfang und Inhalt nicht gesichert sind, darf sie nicht stillschweigend entfallen.
  - severity: low
    issue: Die Formulierung zur Erfüllung von Evas Rede ist leicht vom Zeugen gelöst.
    rationale: »Ihre Worte wurden sogleich zur Tat« ist verständlich, gibt aber das passive »was fulfilled in act« und das anschließende begründende »because« weniger präzise wieder. Eine geringfügige Umformulierung stellt beides klarer dar.
  revised_text: 'Nach dem Ruhetag sandte Sophia ihre Tochter Zoe, die Eva genannt wird, als Lehrerin. Sie sollte den seelenlosen Adam aufrichten, damit die, die er zeugen würde, zu Gefäßen des Lichts werden könnten.



    [Als] [][a] Eva ihren männlichen Gefährten ausgestreckt daliegen sah, hatte sie Mitleid mit ihm und sagte: »Adam, lebe! Steh auf der Erde auf!«



    Ihr Ausspruch erfüllte sich sogleich in der Tat, denn Adam stand auf und öffnete rasch die Augen. Als er sie erblickte, sagte er: »Du wirst ›Mutter der Lebenden‹ genannt werden, denn du bist es, die mir das Leben gegeben hat.«'
  revised_footnotes:
  - marker: a
    text: Die eckigen Klammern kennzeichnen eine unsichere Ergänzung (»[Als]«) sowie eine weitere beschädigte oder fehlende Stelle (»[]«) im überlieferten Text. Die unmittelbare Quellenprüfung am Koptischen steht noch aus.
    reason: Der vorgelegte Quellenzeuge bietet vor »Eve« die Zeichenfolge »[When] []«. Beide Unsicherheitssignale werden in der deutschen Publikationsfassung erhalten.
  revision_rationale: Die Revision bewahrt die vollständige, im englischen Quellenzeugen sichtbare textkritische Unsicherheit vor Eva und stellt die unmittelbar wirksame Rede Evas mit der kausalen Folge für Adams Aufstehen näher am Zeugen dar. Bedeutung, Register, Eigennamen und theologische Spannung bleiben unverändert.
