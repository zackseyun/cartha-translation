base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/018.yaml
  text: 'After the day of rest, Sophia sent her daughter Zoe, who is called Eve, as a teacher. She was to make Adam, who had no soul, stand up, so that those whom he would beget could become vessels of light.


    [When] [] Eve saw her male companion lying face down, she had compassion on him and said, “Adam, live! Stand up on the earth!”


    Her words were immediately fulfilled in action. Adam stood up and quickly opened his eyes. When he saw her, he said, “You will be called ‘Mother of the Living,’ because you are the one who has given me life.”'
translation:
  language: de
  text: 'Nach dem Ruhetag sandte Sophia ihre Tochter Zoe, die Eva genannt wird, als Lehrerin. Sie sollte den seelenlosen Adam aufrichten, damit die, die er zeugen würde, zu Gefäßen des Lichts werden könnten.


    [Als][a] Eva ihren männlichen Gefährten ausgestreckt daliegen sah, hatte sie Mitleid mit ihm und sagte: »Adam, lebe! Steh auf der Erde auf!«


    Ihre Worte wurden sogleich zur Tat. Adam stand auf und öffnete rasch die Augen. Als er sie erblickte, sagte er: »Du wirst ›Mutter der Lebenden‹ genannt werden, denn du bist es, die mir das Leben gegeben hat.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die eckige Klammer kennzeichnet eine unsichere Ergänzung beziehungsweise eine beschädigte Stelle im überlieferten Text. Die unmittelbare Quellenprüfung am Koptischen steht noch aus.
    reason: Der vorgelegte Quellenzeuge enthält vor »Eve« die Zeichenfolge »[When] []«; die Unsicherheit muss in der Publikationsfassung sichtbar bleiben.
lexical_decisions:
- source_word: Sophia
  choice: Sophia
  rationale: Der griechische Eigenname wird bewahrt; eine Übersetzung mit »Weisheit« könnte die Gestalt vorschnell zu einer bloßen Personifikation umdeuten.
- source_word: Zoe
  choice: Zoe
  rationale: Der Eigenname bleibt erhalten und trägt zugleich die im Kontext wichtige Bedeutung »Leben«; diese wird nicht stillschweigend in den Namenstext eingesetzt.
- source_word: soulless
  choice: seelenlos
  rationale: Die formale und theologisch markante Aussage des Zeugen wird bewahrt, ohne sie als lediglich »leblos« abzuschwächen.
- source_word: vessels of light
  choice: Gefäße des Lichts
  rationale: Die bildhafte religiöse Ausdrucksweise wird wörtlich und verständlich erhalten.
- source_word: lying prostrate
  choice: ausgestreckt daliegen
  rationale: Diese Formulierung wahrt die Körperhaltung, ohne die nicht sicher belegte Präzisierung »mit dem Gesicht nach unten« zu erzwingen.
- source_word: Mother of the Living
  choice: Mutter der Lebenden
  rationale: Die traditionelle, zugleich semantisch klare Titelform wird bewahrt.
theological_decisions:
- issue: Evas Rolle bei Adams Belebung
  choice: »die mir das Leben gegeben hat«
  alternative: »die mich lebendig gemacht hat«
  rationale: Die kausale und personhafte Zuschreibung an Eva bleibt in ihrer theologischen Spannung erhalten und wird nicht abgeschwächt.
- issue: Status Adams vor seinem Aufstehen
  choice: »seelenlosen Adam«
  alternative: »leblosen Adam«
  rationale: Der überlieferte Zeuge unterscheidet ausdrücklich mit dem Begriff »soulless«; eine Harmonisierung mit anderen Schöpfungserzählungen wird vermieden.
- issue: Möglichkeit der Nachkommen, Lichtgefäße zu werden
  choice: »werden könnten«
  alternative: »werden sollten«
  rationale: Die modale Offenheit des englischen Quellenzeugnisses bleibt erhalten; Zielsetzung und garantierter Ausgang werden nicht gleichgesetzt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit kurzen, klaren Sätzen. Die Eigennamen Sophia und Zoe sowie die religiösen Bilder bleiben erhalten. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist die Fassung ausdrücklich quellenkritisch vorläufig; die sichtbare Unsicherheitsmarkierung wurde als Fußnote erläutert.
