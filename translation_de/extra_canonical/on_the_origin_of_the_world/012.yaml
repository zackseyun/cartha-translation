review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung folgt dem bereitgestellten englischen Zeugen insgesamt eng und bewahrt dessen eigenwillige Kosmologie sowie die positive Funktion des Erkenntnisbaums. Eine sichere direkte Kontrolle am Koptischen ist nach den Angaben jedoch noch ausstehend. Korrigiert werden sollte insbesondere die singularische Verengung von „a cluster of grapes when white“ zu „einer weißen Weintraube“; gemeint ist eine weiße Weintraube beziehungsweise ein weißer Traubenbund. Außerdem sollte die unklare Formulierung „lowly shaped forms“ nicht durch „niedrige Gebilde“ zusätzlich geglättet werden.
  naturalness: Das Deutsch ist überwiegend idiomatisch und hat ein angemessen würdiges erzählendes Register. „Lethargie“ bewahrt die Nähe zum Zeugen und vermeidet die etwas psychologisierende Wahl „Teilnahmslosigkeit“. Die Satzgliederung ist lesbar, ohne den Inhalt umzudeuten.
  terminology: „Gerechtigkeit“, „Paradies“, „Baum der Erkenntnis“, „Mächte“, „Salbung“ und „Hohepriester der Gerechtigkeit“ sind angemessen. „Gestalten von niedriger Form“ bleibt absichtlich ungewohnt, da der englische Zeuge an dieser Stelle selbst eine ungewöhnliche und semantisch nicht weiter erklärte Wendung bietet.
  issues:
  - severity: medium
    issue: „a cluster of grapes when white“ wurde als „einer weißen Weintraube“ wiedergegeben.
    rationale: Die Vorlage bezeichnet eine Traube im Sinn eines Traubenbundes bzw. einer Weintraube als Fruchtstand, nicht eine einzelne Beere. Die deutsche Fassung verengt das Bild unnötig.
  - severity: low
    issue: „lowly shaped forms“ wurde zu „niedrigen Gebilden“ geglättet.
    rationale: „Niedrige Gebilde“ gibt weder das Form-/Gestaltmoment noch die eigentümliche Struktur der Vorlage deutlich wieder. Eine bewusst zurückhaltende, leicht fremde Formulierung wahrt die Unbestimmtheit besser.
  - severity: low
    issue: „lethargy“ wurde als „Teilnahmslosigkeit“ übersetzt.
    rationale: „Lethargie“ entspricht der Vorlage unmittelbarer und lässt offen, wie genau das Genitivattribut „der Dämonen“ zu verstehen ist.
  revised_text: 'Als Nächstes erschuf die Gerechtigkeit das Paradies. Es war schön und lag außerhalb der Umlaufbahn des Mondes und der Umlaufbahn der Sonne, im Land der Wonne, im Osten zwischen den Steinen. Unter den schönen, köstlichen Bäumen wohnt das Verlangen. Und nach Gottes Willen erschien nördlich vom Paradies der Baum des ewigen Lebens, damit die Seelen der Heiligen unsterblich werden könnten – jener, die bei der Vollendung des Zeitalters aus Gestalten von niedriger Form hervorgehen werden.


    Die Farbe des Lebensbaums gleicht der Sonne, und seine Zweige sind lieblich. Seine Blätter gleichen denen der Zypresse. Seine Frucht gleicht einer weißen Weintraube. Seine Höhe reicht bis zum Himmel. Neben ihm steht der Baum der Erkenntnis, der Gottes Kraft besitzt. Sein Glanz gleicht dem Mond, wenn er in vollem Licht steht, und seine Zweige sind lieblich. Seine Blätter gleichen Feigenblättern. Seine Frucht gleicht einer guten, köstlichen Dattel. Dieser Baum steht nördlich vom Paradies, damit er die Seelen aus der Lethargie der Dämonen aufrütteln könnte, sodass sie sich dem Lebensbaum nähern, von seiner Frucht essen und auf diese Weise die Mächte und ihre Engel verwerfen könnten.


    Die Wirkung dieses Baumes wird in der heiligen Schrift ausführlich beschrieben: »Du bist der Baum der Erkenntnis, der im Paradies steht, von dem der erste Mensch aß und der seinen Sinn öffnete. Er liebte seine Gefährtin und verwarf [a] die anderen, fremdartigen Abbilder; ja, er verachtete sie sogar.«


    Danach spross der Ölbaum hervor, um Könige und Hohepriester der Gerechtigkeit zu heiligen, die in den letzten Tagen erscheinen sollten. Denn der Ölbaum erschien aus dem Licht des ersten Adam, um ihnen die Salbung zu geben, die sie empfangen sollten.'
