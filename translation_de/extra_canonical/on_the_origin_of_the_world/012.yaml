  revision_rationale: Die Revision korrigiert die Bildlichkeit der Frucht des Lebensbaums, bewahrt die ungewöhnliche und nicht weiter deutbare Rede von den „lowly shaped forms“ enger und ersetzt die interpretierendere „Teilnahmslosigkeit“ durch „Lethargie“. Die Textlücke bleibt exakt an der durch den Zeugen markierten Stelle kenntlich. Alle übrigen Entscheidungen, einschließlich der Personifikation der Gerechtigkeit und der unharmonisierten Darstellung des Erkenntnisbaums, bleiben bestehen.
