translation:
  language: de
  text: 'Als Nächstes erschuf die Gerechtigkeit das Paradies. Es war schön und lag außerhalb der Umlaufbahn des Mondes und der Umlaufbahn der Sonne, im Land der Wonne, im Osten zwischen den Steinen. Unter den schönen, köstlichen Bäumen wohnt das Verlangen. Und nach Gottes Willen erschien nördlich vom Paradies der Baum des ewigen Lebens, damit die Seelen der Heiligen unsterblich werden könnten – jener, die bei der Vollendung des Zeitalters aus den niedrigen Gebilden hervorgehen werden.


    Die Farbe des Lebensbaums gleicht der Sonne, und seine Zweige sind lieblich. Seine Blätter gleichen denen der Zypresse. Seine Frucht gleicht einer weißen Weintraube. Seine Höhe reicht bis zum Himmel. Neben ihm steht der Baum der Erkenntnis, der Gottes Kraft besitzt. Sein Glanz gleicht dem Mond, wenn er in vollem Licht steht, und seine Zweige sind lieblich. Seine Blätter gleichen Feigenblättern. Seine Frucht gleicht einer guten, köstlichen Dattel. Dieser Baum steht nördlich vom Paradies, damit er die Seelen aus der Teilnahmslosigkeit der Dämonen aufrütteln könnte, sodass sie sich dem Lebensbaum nähern, von seiner Frucht essen und auf diese Weise die Mächte und ihre Engel verwerfen könnten.


    Die Wirkung dieses Baumes wird in der heiligen Schrift ausführlich beschrieben: »Du bist der Baum der Erkenntnis, der im Paradies steht, von dem der erste Mensch aß und der seinen Sinn öffnete. Er liebte seine Gefährtin und verwarf [a] die anderen, fremdartigen Abbilder; ja, er verachtete sie sogar.«


    Danach spross der Ölbaum hervor, um Könige und Hohepriester der Gerechtigkeit zu heiligen, die in den letzten Tagen erscheinen sollten. Denn der Ölbaum erschien aus dem Licht des ersten Adam, um ihnen die Salbung zu geben, die sie empfangen sollten.'
  philosophy: optimal-equivalence
