lexical_decisions:
- source_word: Justice
  choice: die Gerechtigkeit
  rationale: Als personifiziertes schöpferisches Wesen mit bestimmtem Artikel wiedergegeben; die abstrakte und zugleich personale Spannung bleibt erhalten.
- source_word: Paradise
  choice: das Paradies
  rationale: Geläufige, würdige deutsche Entsprechung mit Bezug zur antiken Paradiesvorstellung.
- source_word: Land of Delight
  choice: Land der Wonne
  rationale: Bewahrt den Eigennamencharakter und den Sinn eines Ortes der Freude beziehungsweise Lust, ohne ihn auszudeuten.
- source_word: desire
  choice: das Verlangen
  rationale: Gibt die mögliche personifizierte Größe zurückhaltend wieder und vermeidet eine Festlegung auf ausschließlich sexuelles Begehren.
- source_word: satisfying
  choice: köstlich
  rationale: Im Zusammenhang mit Bäumen und Früchten natürliches Deutsch; bezeichnet etwas erfreulich Nährendes und Begehrenswertes.
- source_word: lowly shaped forms
  choice: niedrige Gebilde
  rationale: Bewahrt die ungewöhnliche, abwertende Formulierung, ohne die Gebilde als bestimmte Körper oder kosmische Wesen zu identifizieren.
- source_word: tree of knowledge
  choice: Baum der Erkenntnis
  rationale: Entspricht dem biblisch und religionsgeschichtlich vertrauten Ausdruck, ohne einen ergänzenden Gegenstand der Erkenntnis einzutragen.
- source_word: authorities
  choice: die Mächte
  rationale: Im kosmologischen Zusammenhang verständlicher als das moderne institutionelle »Autoritäten« und dennoch offen hinsichtlich der genauen Wesenklasse.
- source_word: denounce
  choice: verwerfen
  rationale: Erfasst die aktive Lossagung beziehungsweise Zurückweisung; »anklagen« wäre in diesem Kontext enger und juristischer.
- source_word: anointing
  choice: Salbung
  rationale: Bewahrt sowohl die kultische Handlung als auch ihre theologische Bedeutung.
theological_decisions:
- issue: Der Erkenntnisbaum als hilfreiche, von Gotteskraft erfüllte Größe
  choice: Die positive Funktion des Baumes wird unverändert wiedergegeben.
  alternative: An die negative Deutung des Erkenntnisbaums in verbreiteten Auslegungen angleichen.
  rationale: Der vorliegende Text vertritt bewusst eine eigene theologische Deutung; diese Spannung darf nicht harmonisiert werden.
- issue: Personifikation der Gerechtigkeit
  choice: »die Gerechtigkeit« bleibt grammatisch und inhaltlich handelndes Subjekt.
  alternative: In »Gott in seiner Gerechtigkeit« oder den Namen eines Wesens auflösen.
  rationale: Eine solche Identifikation ist durch den vorliegenden Zeugen nicht hinreichend begründet.
- issue: Seelen werden unsterblich
  choice: Die konditionale Formulierung »unsterblich werden könnten« bleibt erhalten.
  alternative: Als sichere Verheißung oder als bereits vorhandene Wesenseigenschaft der Seele formulieren.
  rationale: So bleiben Modalität und besondere Anthropologie des Textes gewahrt.
- issue: Die Mächte und ihre Engel
  choice: Als gegnerische kosmische Gruppen bezeichnet, aber nicht näher identifiziert.
  alternative: Mit Dämonen, Archonten oder gefallenen Engeln gleichsetzen.
  rationale: Eine präzisere dogmatische Zuordnung würde die Quellenlage überschreiten.
- issue: Heilige Schrift und das folgende Zitat
  choice: Die Behauptung des Textes wird direkt wiedergegeben, ohne das Zitat einer kanonischen Schriftstelle zuzuordnen.
  alternative: Eine bekannte biblische Stelle als Quelle ergänzen.
  rationale: Das Zitat ist in dieser Form nicht sicher einer kanonischen Passage zuweisbar.
- issue: Ölbaum und Licht des ersten Adam
  choice: Die kosmologische Aussage wird wörtlich-nahe bewahrt.
  alternative: Das Licht metaphorisch als Abstammung, Offenbarung oder Christusbezug erklären.
  rationale: Der Text selbst löst die Bedeutung nicht eindeutig auf.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, erzählendem Register. Lange Perioden wurden behutsam gegliedert, ohne die gedanklichen Beziehungen zu verändern. Die Übersetzung ist vorläufig, da keine direkte Prüfung des koptischen Ausgangstextes vorliegt; Grundlage ist der angegebene gemeinfreie englische Textzeuge. Die bloßen Seitenzahlen [11] und [12] wurden nicht übernommen. Der einzige Fußnotenmarker kennzeichnet die tatsächliche Textlücke.
