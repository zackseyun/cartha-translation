    Seit jenem Tag ist eine Wassermasse erkennbar. Was in ihr hinabsank, strömte davon und blieb dabei im Chaos sichtbar. Wie bei einer Frau, die ein Kind gebiert, wenn alles, was sich in ihr angesammelt hat, herausströmt, so entstand auch die Materie aus einem Schatten und wurde von ihm weggestoßen; doch sie verließ das Chaos nicht.



    Die Erscheinung Jaldabaoths



    Vielmehr blieb die Materie im Chaos und wohnte in einem seiner Bereiche. Nachdem dies geschehen war, kam Pistis und erschien über der Materie des Chaos. Diese war wie eine Fehlgeburt ausgestoßen worden, weil keinerlei Geist in ihr wohnte; denn sie war ganz und gar unendliche Finsternis und bodenloses Wasser. Als Pistis sah, was aus ihrem Mangel hervorgegangen war, geriet sie in Unruhe. Ihre Unruhe erschien als ein furchterregendes geschaffenes Wesen, das im Chaos auf sie zueilte. Sie wandte sich ihm zu und blies ihm im Abgrund ins Gesicht; dieser liegt unter […] allen Himmeln.[e] Als Pistis Sophia dann wollte, dass das geistlose Wesen zu einem Abbild geformt werde und über die Materie sowie über alle ihre Scharen herrsche, erschien erstmals aus den Wassern ein androgyner Archon, der einem Löwen glich. Er trug große Macht in sich und wusste nicht, woher er entstanden war.



    Als Pistis Sophia sah, wie er sich in den Wassertiefen umherbewegte, sagte sie zu ihm: „Kind, komm hierherüber!“ Das ist dasselbe wie yalda-baoth.[f] Seit jenem Tag trat das Gesetz der gegliederten Sprache in Erscheinung und erstreckte sich auf die Götter, die Engel und die Menschheit. Was durch die gegliederte Sprache entstanden war, wurde von den Göttern, den Engeln und der Menschheit vollendet.



    Der Archon Yaltabaoth aber kannte die Kraft der Pistis nicht. Er sah nicht ihr Gesicht, sondern nur das Abbild im Wasser, das mit ihm sprach. Wegen dieser Stimme nannte er sich „Yald<ab>aoth“.[g] Die Vollkommenen jedoch nennen ihn „Ariael“, weil er einem Löwen glich.



    Nachdem er Macht über die Materie erlangt hatte, zog sich Pistis Sophia hinauf in ihr Licht zurück.'
