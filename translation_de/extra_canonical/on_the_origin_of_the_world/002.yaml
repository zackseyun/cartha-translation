  footnotes:
  - marker: a
    text: Die Auslassung […] kennzeichnet eine Lücke oder unleserliche Stelle im überlieferten Text; dadurch bleibt der Vergleich unvollständig.
    reason: Die beschädigte Syntax darf nicht durch eine vermutete Ergänzung geglättet werden.
  - marker: b
    text: An dieser Stelle weist die Überlieferung eine Lücke auf; der Zusammenhang von Gottheiten und „dem gesamten Ort“ ist daher unsicher.
    reason: Kennzeichnung einer inhaltlich erheblichen Textlücke.
  - marker: c
    text: Zwischen „ersten“ und „geschaffenen Wesen“ fehlt Text; die genaue zeitliche oder rangmäßige Aussage ist nicht sicher rekonstruierbar.
    reason: Die Lücke beeinflusst die kosmologische Reihenfolge.
  - marker: d
    text: 'Die Winkelklammern zeigen eine editorische Ergänzung an: Das Wort „im“ steht nicht sicher im erhaltenen Text, sondern wurde zur Herstellung des Zusammenhangs eingesetzt.'
    reason: Die vom Zeugen markierte Konjektur wird transparent erhalten.
  - marker: e
    text: Vor „allen Himmeln“ fehlt Text; die genaue Lagebeschreibung des Abgrunds bleibt daher unvollständig.
    reason: Bewahrung des handschriftlichen Schadenssignals.
  - marker: f
    text: Die Form yalda-baoth wird hier als im Text gebotene Deutung des Zurufs wiedergegeben. Ob sie sprachgeschichtlich tatsächlich „Kind, komm hierherüber“ bedeutet, wird damit nicht entschieden.
    reason: Unterscheidung zwischen der Etymologie des Textes und moderner sprachwissenschaftlicher Beurteilung.
  - marker: g
    text: Die Winkelklammern in „Yald<ab>aoth“ kennzeichnen ergänzte Buchstaben. Die wechselnden Schreibungen Yaldabaoth, Yaltabaoth und yalda-baoth wurden nicht vereinheitlicht.
    reason: Erhaltung textkritischer Signale und der Namensvarianten des Zeugnisses.
lexical_decisions:
- source_word: aeon
  choice: Äon
  rationale: Der in deutschsprachiger Forschung und Religionsgeschichte etablierte Fachbegriff bewahrt die kosmologische Eigenart des Textes, ohne ihn vorschnell als bloßes „Zeitalter“ zu deuten.
- source_word: Pistis / Sophia
  choice: Pistis / Sophia
  rationale: Die griechisch-koptischen Namen beziehungsweise Personifikationen bleiben unübersetzt, da „Glaube“ und „Weisheit“ im Deutschen die Funktion als Eigennamen abschwächen und mögliche Bedeutungsbezüge vorschnell festlegen würden.
- source_word: likeness
  choice: Abbild
  rationale: „Abbild“ wahrt den Gedanken einer bildhaften Entsprechung und bleibt offen dafür, ob eine Gestalt, Spiegelung oder ontologische Hervorbringung gemeint ist.
- source_word: host(s)
  choice: Schar(en)
  rationale: „Schar“ ist würdig und verständlich, ohne die Wesen ausdrücklich als militärisches Heer zu bestimmen.
- source_word: archon
  choice: Archon
  rationale: Der traditionsgeschichtlich präzise Fachbegriff bleibt erhalten; „Herrscher“ allein würde die spezifische kosmologische Rolle verallgemeinern.
- source_word: androgynous
  choice: mannweiblich
  rationale: Die konkrete Doppelgeschlechtlichkeit wird unmittelbar und in einem dem antiken Text angemessen würdigen Register ausgedrückt; das modernere Fachwort „androgyn“ wäre ebenfalls möglich.
- source_word: verbal articulation / articulate speech
  choice: gegliederte Sprache
  rationale: Die Formulierung bewahrt den Bezug auf artikuliertes, lautlich gegliedertes Sprechen und vermeidet die Verengung auf bloße Aussprache.
- source_word: defect
  choice: Mangel
  rationale: „Mangel“ bewahrt die Aussage eines Defizits, ohne Pistis ausdrücklich moralische Schuld oder einen handwerklichen Fehler zuzuschreiben.
- source_word: bile
  choice: Galle
  rationale: Die körperlich-stoffliche Bildsprache des Zeugnisses wird nicht abgeschwächt.
theological_decisions:
- issue: Verhältnis von Pistis und Sophia
  choice: Pistis und Sophia beziehungsweise Pistis Sophia entsprechend den wechselnden Formen des Zeugnisses beibehalten
  alternative: Alle Vorkommen zu „Pistis Sophia“ vereinheitlichen oder Pistis und Sophia als eine eindeutig identische Gestalt erklären
  rationale: Der Text unterscheidet zunächst Pistis als Ursprung und Sophia als aus ihr hervorgegangenes Abbild, verwendet später aber „Pistis Sophia“. Diese Spannung darf nicht harmonisiert werden.
- issue: Geistlosigkeit der Fehlgeburt und der Materie
  choice: „keinerlei Geist“ und „geistlos“
  alternative: „ohne den Geist Gottes“ oder „seelenlos“
  rationale: Der unbestimmte Geistbegriff des Textes bleibt erhalten; eine ausdrückliche Identifikation mit dem Heiligen Geist oder mit einer Seele wäre interpretierend.
- issue: Entstehung des Archons
  choice: Pistis Sophias Wille formt das geistlose Wesen, während der Archon aus den Wassern erscheint
  alternative: Pistis Sophia erschafft Yaldabaoth unmittelbar und vollständig
  rationale: Die grammatische und theologische Spannung zwischen Willensakt, Formung und Erscheinung wird nicht zu einer eindeutigen Schöpfungslehre geglättet.
- issue: „die Vollkommenen“
  choice: substantivisch als Gruppenbezeichnung beibehalten
  alternative: „die geistlich Vollendeten“
  rationale: Der Text benennt eine Gruppe, erläutert ihren Status aber nicht; eine spirituelle Qualifikation wäre eine zusätzliche Deutung.
- issue: Götter im Plural
  choice: „die Götter“
  alternative: „göttliche Wesen“
  rationale: Der offene Plural und die fremdartige Kosmologie des Textes werden nicht an spätere monotheistische Terminologie angepasst.
translation_notes:
  register: Moderne, würdige Standardsprache mit bewusst beibehaltenen religionsgeschichtlichen Fachwörtern. Wiederholungen, Körperbilder und kosmologische Fremdheit wurden nicht geglättet. Die Übersetzung ist vorläufig, weil laut Datensatz noch keine direkte Prüfung des koptischen Textes erfolgt ist; Grundlage ist der bereitgestellte gemeinfreie englische Zeuge. Eckige Klammern, Auslassungspunkte und Winkelklammern bleiben als Textsignale sichtbar.
