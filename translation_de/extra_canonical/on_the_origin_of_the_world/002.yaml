  text: 'After the natural form of the deathless beings had finished developing out of infinity, a likeness called Sophia emanated from Pistis. She exercised her will and became a created being like the primordial light. Immediately, her will appeared in the likeness of heaven, possessing an incomprehensible size between the deathless beings and the beings that came into existence afterward, resembling [. . .]. She acted as a veil separating humanity from the beings above.


    Now, the aeon of Truth has no external shadow, because the infinite light dwells everywhere within it. Its exterior, however, is a shadow called “Darkness.” From it appeared a host that ruled over the darkness, and the hosts that came into being afterward called the shadow “Infinite Chaos.” From it every kind of divinity sprang upward [. . .] together with the entire place, with the further result that shadow came after the first [] created being. It appeared <inside> the Abyss, originating from the previously mentioned Pistis.


    The shadow then realized that something more powerful than itself existed and became envious. When it had become pregnant through its own will, it immediately gave birth to jealousy. From that day, the law of jealousy prevailing among all the aeons and their worlds has been evident. Now, this jealousy was found to be an aborted fetus with no spirit within it. It came into being as a shadow within an immense watery substance. The bile that had come from the shadow was then thrust into a region of Chaos.


    From that day, a watery substance has been evident, and what sank down within it gushed away while remaining visible within Chaos. As with a woman giving birth to a child, when all her accumulated matter gushes out, so matter came into being from a shadow and was driven away from it, yet it did not leave Chaos.


    The Manifestation of Yaldabaoth


    Instead, matter remained within Chaos, dwelling in one of its regions. After these things had happened, Pistis arrived and appeared above the matter of Chaos, which had been expelled like an aborted fetus, since no spirit dwelled within it, for it was entirely infinite darkness and bottomless water. When Pistis saw what had resulted from her defect, she became troubled. Her distress appeared as a frightful created being that hurried toward her in Chaos. She turned toward it and blew into its face within the Abyss, which lies beneath [] all the heavens. Pistis Sophia then willed that the being without spirit should be formed into a likeness and should rule over matter and all her hosts. For the first time, an androgynous archon resembling a lion appeared from the waters, possessing great authority within himself and not knowing where he had come from.


    As Pistis Sophia watched him moving about in the watery depths, she said to him, “Child, pass over here,” which is the same as yalda-baoth. From that day, the law of articulate speech appeared and extended to the gods, the angels, and humanity. What had come into being through articulate speech was brought to completion by the gods, the angels, and humanity.


    Now, the archon Yaltabaoth was unaware of the power of Pistis. He did not see her face but instead saw in the water the likeness that spoke with him. Because of that voice, he called himself “Yald<ab>aoth.” The perfect ones, however, call him “Ariael,” because he resembled a lion.


    When he had gained authority over matter, Pistis Sophia withdrew upward into her light.'
translation:
  language: de
  text: 'Nachdem sich die natürliche Gestalt der unsterblichen Wesen aus der Unendlichkeit vollständig entwickelt hatte, ging zu jener Zeit aus Pistis ein Abbild hervor, das Sophia genannt wird. Sie setzte ihren Willen ein und wurde zu einem geschaffenen Wesen, dem ursprünglichen Licht gleich. Sogleich zeigte sich ihr Wille in der Gestalt des Himmels, von unbegreiflicher Größe, zwischen den unsterblichen Wesen und den Wesen, die danach entstanden, indem sie […] glich.[a] Sie wirkte wie ein Schleier, der die Menschheit von den Wesen über ihr trennte.


    Der Äon der Wahrheit hat keinen Schatten außerhalb seiner selbst, denn das unendliche Licht wohnt überall in ihm. Doch außerhalb von ihm ist ein Schatten, der „Finsternis“ genannt wird. Aus ihm erschien eine Schar, die über der Finsternis herrschte. Die Scharen, die nach ihnen entstanden, nannten den Schatten „Unendliches Chaos“. Aus ihm stieg jede Art von Gottheit empor […] zusammen mit dem gesamten Ort.[b] Daraus ergibt sich außerdem, dass der Schatten nach dem ersten […] geschaffenen Wesen kam.[c] Er erschien <im> Abgrund[d] und ging aus der zuvor erwähnten Pistis hervor.


    Darauf erkannte der Schatten, dass etwas Mächtigeres als er selbst existierte, und wurde neidisch. Als er durch seinen eigenen Willen schwanger geworden war, gebar er sogleich die Eifersucht. Seit jenem Tag ist das Gesetz der Eifersucht erkennbar, das unter allen Äonen und ihren Welten herrscht. Diese Eifersucht aber erwies sich als eine Fehlgeburt, in der keinerlei Geist war. Sie entstand als ein Schatten in einer gewaltigen Wassermasse. Dann wurde die Galle, die aus dem Schatten entstanden war, in einen Bereich des Chaos gestoßen.


    Seit jenem Tag ist eine Wassermasse sichtbar. Was in ihr hinabsank, strömte davon und blieb dabei im Chaos sichtbar. Wie bei einer Frau, die ein Kind gebiert, wenn alles, was sich in ihr angesammelt hat, herausströmt, so entstand auch die Materie aus einem Schatten und wurde von ihm weggestoßen; doch sie verließ das Chaos nicht.


    Die Erscheinung Jaldabaoths


    Vielmehr blieb die Materie im Chaos und wohnte in einem seiner Bereiche. Nachdem dies geschehen war, kam Pistis und erschien über der Materie des Chaos. Diese war wie eine Fehlgeburt ausgestoßen worden, weil keinerlei Geist in ihr wohnte; denn sie war ganz und gar unendliche Finsternis und bodenloses Wasser. Als Pistis sah, was aus ihrem Mangel hervorgegangen war, geriet sie in Unruhe. Ihre Unruhe erschien als ein furchterregendes geschaffenes Wesen, das im Chaos auf sie zueilte. Sie wandte sich ihm zu und blies ihm im Abgrund ins Gesicht; dieser liegt unter […] allen Himmeln.[e] Als Pistis Sophia dann wollte, dass das geistlose Wesen zu einem Abbild geformt werde und über die Materie sowie über alle ihre Scharen herrsche, erschien erstmals aus den Wassern ein mannweiblicher Archon, der einem Löwen glich. Er trug große Macht in sich und wusste nicht, woher er entstanden war.


    Als Pistis Sophia sah, wie er sich in den Wassertiefen umherbewegte, sagte sie zu ihm: „Kind, komm hierherüber!“ Das bedeutet dasselbe wie yalda-baoth.[f] Seit jenem Tag trat das Gesetz der gegliederten Sprache in Erscheinung und erstreckte sich auf die Götter, die Engel und die Menschheit. Was durch die gegliederte Sprache entstanden war, wurde von den Göttern, den Engeln und der Menschheit vollendet.


    Der Archon Yaltabaoth aber kannte die Kraft der Pistis nicht. Er sah nicht ihr Gesicht, sondern nur das Abbild im Wasser, das mit ihm sprach. Wegen dieser Stimme nannte er sich „Yald<ab>aoth“.[g] Die Vollkommenen jedoch nennen ihn „Ariael“, weil er einem Löwen glich.


    Nachdem er Macht über die Materie erlangt hatte, zog sich Pistis Sophia hinauf in ihr Licht zurück.'
