review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung folgt dem bereitgestellten englischen Zeugen im Wesentlichen zuverlässig und bewahrt dessen Auslassungszeichen, Leerstelle und Ergänzung in Winkelklammern. Eine sichere Korrektur ist jedoch bei „sichtbar“ erforderlich: Der Zeuge sagt jeweils „has been evident“, nicht dass die Wassermasse optisch sichtbar sei. Außerdem wird die unvollständige Vergleichskonstruktion im ersten Absatz mit einer etwas weniger irreführenden deutschen Syntax wiedergegeben. Da keine koptische Lesung vorliegt, bleibt die Prüfung unmittelbar am überlieferten englischen Zeugen vorläufig.'
  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. „Androgyner Archon“ ist heute verständlicher und fachsprachlich neutraler als „mannweiblicher Archon“. Die Formulierung zur Gleichsetzung mit „yalda-baoth“ wird näher am vorsichtigen Wortlaut des Zeugen formuliert.
  terminology: Die Beibehaltung von Äon, Pistis, Sophia, Archon, Abbild, Schar(en), Galle und den unterschiedlichen Namensschreibungen ist sachgerecht. „Androgyn“ wahrt die Aussage ohne eine unnötig altertümliche oder wertende Formulierung. „Erkennbar“ gibt „evident“ angemessener wieder als „sichtbar“.
  issues:
  - severity: medium
    issue: „Seit jenem Tag ist eine Wassermasse sichtbar.“
    rationale: Der englische Zeuge besagt, dass eine Wassermasse „evident“ bzw. erkennbar ist; „sichtbar“ verengt dies auf optische Wahrnehmbarkeit.
  - severity: low
    issue: „mannweiblicher Archon“
    rationale: Die Wiedergabe ist zwar semantisch möglich, im modernen Standarddeutsch aber unnötig sperrig. „androgyner Archon“ ist natürlicher und gibt den Fachbegriff direkt wieder.
  - severity: low
    issue: 'Unvollständiger Vergleich im ersten Absatz: „indem sie […] glich“'
    rationale: Der Zeuge ist an dieser Stelle beschädigt. Die deutsche Fassung soll die Lücke zeigen, aber keinen grammatisch missverständlichen Anschluss erzeugen.
  - severity: low
    issue: „Das bedeutet dasselbe wie yalda-baoth.“
    rationale: Der Zeuge formuliert eine Gleichsetzung, nicht zwingend eine gesicherte moderne Übersetzungsbedeutung. „Das ist dasselbe wie“ bleibt näher am Wortlaut; die Fußnote wahrt die etymologische Zurückhaltung.
