translation:
  language: de
  text: '[] Da alle – sowohl die kosmischen Götter als auch die Menschen – sagen, vor dem Chaos habe nichts existiert, werde ich im Gegensatz zu ihnen beweisen, dass sie alle irren; denn sie kennen weder den Ursprung des Chaos noch seine Wurzel. Der Beweis lautet so:


    Was das Chaos betrifft: Wie sehr es doch [] allen Menschen gefällt zu behaupten, es sei eine Art Finsternis! Tatsächlich aber stammt es aus einem Schatten, der „Finsternis“ genannt wird. Dieser Schatten wiederum stammt aus einem geschaffenen Wesen, das von Anfang an existiert hat. Dieses bestand offenkundig schon, bevor das Chaos entstand; das Chaos aber entstand erst nach jenem geschaffenen Wesen.


    Darum wollen wir uns mit dem wahren Sachverhalt befassen und darüber hinaus mit dem zuerst geschaffenen Wesen, aus dem das Chaos hervorgestoßen wurde. So wird die Wahrheit klar erwiesen werden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Chaos
  choice: Chaos
  rationale: Der im Text als kosmologische Größe gebrauchte Name wird im Deutschen unverändert beibehalten.
- source_word: cosmic gods
  choice: kosmische Götter
  rationale: Die Formulierung bewahrt den kosmologischen Bezug und vermeidet eine konfessionelle Umdeutung.
- source_word: root
  choice: Wurzel
  rationale: Das Herkunftsbild wird formal bewahrt, da es für die Argumentation des Textes bedeutsam sein kann.
- source_word: created entity
  choice: geschaffenes Wesen
  rationale: „Wesen“ ist natürliches Deutsch und lässt Art und Personalität der Entität offen.
- source_word: propelled
  choice: hervorgestoßen
  rationale: Die ungewöhnliche Hervorgangsmetaphorik wird erhalten, ohne sie zu „geschaffen“ oder „hervorgebracht“ zu glätten.
- source_word: realities of the case
  choice: der wahre Sachverhalt
  rationale: Idiomaticher Ausdruck für die tatsächlichen Gegebenheiten des behandelten Gegenstands.
theological_decisions:
- issue: Verhältnis von Finsternis, Schatten, geschaffenem Wesen und Chaos
  choice: Die gestufte Herkunftsfolge wird ohne Harmonisierung wiedergegeben.
  alternative: Die Ausdrücke als Synonyme behandeln oder das geschaffene Wesen ausdrücklich mit der Finsternis identifizieren.
  rationale: Der Text unterscheidet die Größen argumentativ; ihre genaue ontologische Beziehung bleibt jedoch teilweise offen.
- issue: Zeitlicher Vorrang des zuerst geschaffenen Wesens
  choice: „von Anfang an existiert“ und „bevor das Chaos entstand“
  alternative: „ewig“ oder „ungezeugt“
  rationale: Der Text behauptet Vorrang vor dem Chaos, nicht ausdrücklich Ewigkeit oder Ungeschaffenheit.
- issue: Bezeichnung als „zuerst geschaffen“
  choice: „das zuerst geschaffene Wesen“
  alternative: „die erste Schöpfung“
  rationale: Die gewählte Fassung bewahrt den Bezug auf eine Entität, ohne deren Wesen näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit nachvollziehbarer kosmologischer Argumentation. Die leeren eckigen Klammern des Zeugen werden als Signale für Textverlust oder unsichere Ergänzung unverändert bewahrt. Da eine direkte Prüfung des koptischen Quelltexts noch aussteht, ist die Fassung ausdrücklich vorläufig und stützt sich auf den angegebenen gemeinfreien englischen Textzeugen.
