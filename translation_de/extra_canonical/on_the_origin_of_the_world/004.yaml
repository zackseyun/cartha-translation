review_pass:
  verdict: revise
  source_fidelity: Eine sichere Revision ist nötig. Der Entwurf deutet die leere Lakune „[]“ zweimal als [fehlt] bzw. [eigene] aus, obwohl die Vorlage an diesen Stellen nur die offene Lücke bietet. Außerdem wird „Primal Parent“ durch das maskuline „Urvater“ unnötig eingeengt, und einige Formulierungen glätten bzw. verschieben die Syntax der Vorlage.
  naturalness: Der Text ist überwiegend verständlich und registergerecht. „Urelter“ ist hier als nicht geschlechtlich festgelegte Bezeichnung natürlicher und quellennäher als „Urvater“. Kleinere Umstellungen machen den Schöpfungsabschnitt idiomatischer, ohne seine schwierige Struktur zu harmonisieren.
  terminology: Eigennamen sowie Pistis, Sophia und Tartaros bleiben erhalten. „zweigeschlechtlich“, „Mächte“, „Gewalten“ und „Unheilstifter“ sind vertretbar. Die unsicheren Buchtitel und die parenthetische Angabe „(bis hin) zu einem unsichtbaren Wesen“ müssen sichtbar unsicher bleiben.
  issues:
  - severity: high
    issue: Die offenen Lakunen „[]“ werden durch [fehlt] und [eigene] ersetzt.
    rationale: Diese Ergänzungen stehen nicht in der englischen Zeugnisvorlage und legen den beschädigten Text stärker fest, als es die Überlieferung erlaubt.
  - severity: medium
    issue: „Urvater“ ist für „Primal Parent“ geschlechtlich festgelegt.
    rationale: Die Vorlage bezeichnet Yaldabaoth als „Parent“, nicht ausdrücklich als Vater. „Urelter“ bewahrt diese Offenheit.
  - severity: medium
    issue: Der Schöpfungssatz ist teilweise geglättet; insbesondere „Er schuf sie gut, als Wohnstätten“ bildet „creating them good, as dwelling-places“ nicht idiomatisch und nicht klar ab.
    rationale: „Er schuf sie als gute Wohnstätten“ gibt die Aussage ohne zusätzliche Auslegung wieder.
  - severity: low
    issue: Die parenthetische Unsicherheit „(all the way) up to an unseen one“ ist im deutschen Haupttext nicht als Parenthese erhalten.
    rationale: Die Klammern gehören zur erkennbaren Unsicherheit bzw. editorischen Gestalt der Zeugnisvorlage und sollten beibehalten werden.
  revised_text: 'Sieben zweigeschlechtliche Wesen erschienen im Chaos. Sie tragen sowohl männliche als auch weibliche Namen:


    Der weibliche Name ist Pronoia, Sambathas, das heißt »Woche«;


    und sein Sohn heißt Yao, sein weiblicher Name ist Herrschaft.


    Sabaoth, sein weiblicher Name ist Gottheit.


    Adonaios, sein weiblicher Name ist Königtum.


    Elaios, sein weiblicher Name ist Eifersucht.


    Oraios, sein weiblicher Name ist Reichtum.


    Und Astaphaios, sein [weiblicher] Name [] ist Sophia.[a]


    Dies sind die sieben Mächte, die zu den sieben Himmeln des Chaos gehören. Sie wurden als zweigeschlechtliche Wesen geboren, entsprechend der unvergänglichen Ordnung, die vor ihnen bestand, und gemäß dem Willen der Pistis, nämlich dass das Abbild dessen, was von Anfang an bestanden hatte, bis zum Ende herrschen sollte.


    Welche Macht diese Namen ausüben und welche Kraft die männlichen Wesen besitzen, wirst du in dem Buch »Das Erzengelwesen des Propheten Mose« finden; die Kraft der Namen der weiblichen Wesen aber im »Ersten Buch der Noraia«.[b]


    Da nun das Urelter Yaldabaoth über große Gewalten verfügte, erschuf es für jeden seiner Nachkommen durch sprachliche Äußerung Himmel. Es schuf sie als gute Wohnstätten. In jedem der Himmel schuf es große Herrlichkeiten, siebenmal so vortrefflich: Throne, Paläste, Tempel, Wagen und jungfräuliche Geister (bis hin zu einem unsichtbaren Wesen), samt ihren Herrlichkeiten. Jedes besaß dies in seinem jeweiligen Himmel: mächtige Heerscharen von Göttern, Herren, Engeln und Erzengeln, unzählige Myriaden, damit sie dienten.[c]


    Die Erzählung von diesen Ereignissen wirst du im »Ersten Bericht der Oraia« genau beschrieben finden.[d]


    Und sie wurden vollendet, von diesem Himmel bis hinauf zum sechsten Himmel, der Sophia gehört.


    Dieser Himmel und diese Erde wurden von dem Unheilstifter angegriffen, der unter ihnen allen wohnte. Die sechs Himmel erbebten heftig, denn die Heerscharen des Chaos wussten, wer den unter ihnen gelegenen Himmel angegriffen hatte. Als Pistis den Riss bemerkte, den der Unheilstifter verursacht hatte, sandte sie ihren Geist aus, fesselte ihn und stieß ihn hinab in den Tartaros.


    [Von jenem Tag an] hat sich der Himmel samt [] seiner Erde durch Sophia, die Tochter Yaldabaoths, die unter ihnen allen wohnt, gefestigt.[e]'
