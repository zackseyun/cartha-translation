  text: 'Seven androgynous beings appeared in Chaos. They have both masculine and feminine names:


    The feminine name is Pronoia, Sambathas, which means “week,”

    and his son is named Yao, whose feminine name is Rulership.

    Sabaoth, whose feminine name is Divinity.

    Adonaios, whose feminine name is Kingship.

    Elaios, whose feminine name is Jealousy.

    Oraios, whose feminine name is Wealth,

    and Astaphaios, whose [feminine] name [] is Sophia.


    These are the seven powers belonging to the seven heavens of Chaos. They were born as androgynous beings, corresponding to the deathless structure that existed before them, in accordance with the desire of Pistis—namely, that the likeness of what had existed from the beginning would rule until the end.


    You will discover the power exerted by these names, as well as the power of the male beings, in the (book) The Archangelic (Nature) of the Prophet Moses, and the power of the names of the female beings in the First Book of Noraia.


    Now the Primal Parent Yaldabaoth, since he possessed great authorities, created heavens for each of his offspring by speaking them into being. He made them good as dwelling places, and in each heaven he created great glories, each seven times as excellent: thrones, palaces, temples, chariots, and virginal spirits, (all the way) up to an unseen one, along with their glories. Each one possessed these in its own heaven: mighty hosts of gods, lords, angels, and archangels, countless myriads, so that they might serve.


    You will find the account of these events precisely described in the First Narration of Oraia.


    And they were completed, from this heaven up to the sixth heaven, which belongs to Sophia.


    This heaven and earth were attacked by the mischief-maker who lived beneath them all, and the six heavens trembled violently, because the hosts of Chaos knew who had attacked the heaven located beneath them. When Pistis became aware of the fracture caused by the mischief-maker, she sent out her spirit, bound him, and cast him down into Tartaros.


    [From that day], the heaven, together with [] its earth, has been established through Sophia, the daughter of Yaldabaoth, who dwells beneath them all.'
translation:
  language: de
  text: 'Sieben zweigeschlechtliche Wesen erschienen im Chaos. Sie tragen sowohl männliche als auch weibliche Namen:


    Der weibliche Name ist Pronoia: Sambathas, das heißt »Woche«;

    und sein Sohn heißt Yao, sein weiblicher Name ist Herrschaft.

    Sabaoth – sein weiblicher Name ist Gottheit.

    Adonaios – sein weiblicher Name ist Königtum.

    Elaios – sein weiblicher Name ist Eifersucht.

    Oraios – sein weiblicher Name ist Reichtum.

    Und Astaphaios – sein [weiblicher] Name [fehlt] – ist Sophia.[a]


    Dies sind die sieben Mächte, die zu den sieben Himmeln des Chaos gehören. Sie wurden als zweigeschlechtliche Wesen geboren, entsprechend der unvergänglichen Ordnung, die vor ihnen bestand, und gemäß dem Willen der Pistis: Das Abbild dessen, was von Anfang an bestanden hatte, sollte bis zum Ende herrschen.


    Welche Macht diese Namen ausüben und welche Kraft die männlichen Wesen besitzen, wirst du in dem Buch »Das Erzengelwesen des Propheten Mose« finden; die Kraft der Namen der weiblichen Wesen aber im »Ersten Buch der Noraia«.[b]


    Da nun der Urvater Yaldabaoth über große Gewalten verfügte, erschuf er für jeden seiner Nachkommen durch sein Wort einen Himmel. Er schuf sie gut, als Wohnstätten. In jedem Himmel schuf er große Herrlichkeiten, jede siebenmal vortrefflicher: Throne, Paläste, Tempel, Wagen und jungfräuliche Geister bis hin zu einem unsichtbaren Wesen, samt ihren Herrlichkeiten. Jeder besaß dies alles in seinem jeweiligen Himmel: mächtige Heerscharen von Göttern, Herren, Engeln und Erzengeln, unzählige Myriaden, damit sie dienten.[c]


    Die Erzählung von diesen Ereignissen wirst du im »Ersten Bericht der Oraia« genau beschrieben finden.[d]


    Und sie wurden vollendet, von diesem Himmel bis hinauf zum sechsten Himmel, der Sophia gehört.


    Dieser Himmel und seine Erde wurden von dem Unheilstifter angegriffen, der unter ihnen allen wohnte. Die sechs Himmel erbebten heftig, denn die Heerscharen des Chaos wussten, wer den unter ihnen gelegenen Himmel angegriffen hatte. Als Pistis den Riss bemerkte, den der Unheilstifter verursacht hatte, sandte sie ihren Geist aus, fesselte ihn und stieß ihn hinab in den Tartaros.


    [Von jenem Tag an] besteht der Himmel samt seiner [eigenen] Erde durch Sophia, die Tochter Yaldabaoths, die unter ihnen allen wohnt.[e]'
