    reason: Die eingeklammerten Wörter der englischen Zeugnisübersetzung zeigen eine editorische Rekonstruktion des ersten Titels an.
  - marker: c
    text: Der Satzbau dieses Abschnitts ist im überlieferten Text schwierig. Besonders die Beziehung von »siebenmal vortrefflicher«, den aufgezählten Herrlichkeiten und dem »unsichtbaren Wesen« bleibt unsicher.
    reason: Bewahrt eine echte textliche und syntaktische Unsicherheit.
  - marker: d
    text: Oraia und Noraia können unterschiedliche Namensformen derselben Gestalt sein; der vorliegende Text gibt die Formen getrennt wieder.
    reason: Vermeidet eine nicht gesicherte Harmonisierung der Werktitel und Namen.
  - marker: e
    text: Die eckigen Klammern markieren Ergänzungen an beschädigten Stellen. Ob »seine eigene Erde« genau der ursprünglichen Formulierung entspricht, bleibt unsicher.
    reason: Kennzeichnet die Rekonstruktion der Lacuna und hält die Textunsicherheit sichtbar.
lexical_decisions:
- source_word: androgynous
  choice: zweigeschlechtlich
  rationale: Gibt die Verbindung männlicher und weiblicher Benennung verständlich und würdig wieder; »androgyn« wäre fachsprachlicher.
- source_word: forces / powers
  choice: Mächte
  rationale: Bewahrt den kosmologischen Sinn eigenständiger wirksamer Kräfte und passt zum folgenden Motiv der sieben Himmel.
- source_word: deathless structure
  choice: unvergängliche Ordnung
  rationale: »Ordnung« ist im kosmologischen Zusammenhang natürlicher als »Struktur«, ohne die Bedeutung metaphysisch festzulegen.
- source_word: verbal articulation
  choice: durch sein Wort
  rationale: Gibt die Schöpfung durch sprachliche Äußerung idiomatisch wieder, ohne zwingend eine spezifische Logos-Theologie einzutragen.
- source_word: authorities
  choice: Gewalten
  rationale: Bewahrt die kosmologische und personale Mehrdeutigkeit besser als das abstrakte »Autorität«.
- source_word: mischief-maker
  choice: Unheilstifter
  rationale: Bezeichnet einen Verursacher schädlicher Unordnung, ohne ihn mit einer bestimmten tradierten Teufelsgestalt gleichzusetzen.
- source_word: Tartaros
  choice: Tartaros
  rationale: Der mythologische Eigenname wird transliteriert und nicht als allgemeine »Unterwelt« paraphrasiert.
theological_decisions:
- issue: Bezeichnungen Pistis und Sophia
  choice: Als Eigennamen unübersetzt beibehalten
  alternative: Mit »Glaube/Treue« und »Weisheit« übersetzen
  rationale: Im kosmologischen Zusammenhang fungieren sie als Namen personaler Gestalten; eine Übersetzung könnte ihre Rolle vorschnell allegorisieren.
- issue: Geschlecht der sieben Wesen
  choice: »zweigeschlechtliche Wesen« und wechselnde Possessivformen entsprechend dem Zeugnis
  alternative: Durchgehend geschlechtsneutral formulieren
  rationale: Der Text betont ausdrücklich männliche und weibliche Namen. Seine grammatische Spannung wird nicht harmonisiert.
- issue: Götter, Herren, Engel und Erzengel
  choice: Die Hierarchie wörtlich als Mehrzahl wiedergeben
  alternative: »göttliche Wesen« als vereinheitlichende Umschreibung
  rationale: Die eigenständige Kosmologie des Textes soll nicht monotheistisch geglättet werden.
- issue: Sophias Anteil am Bestand von Himmel und Erde
  choice: »besteht ... durch Sophia«
  alternative: »wurde ... von Sophia gegründet«
  rationale: Die Vorlage lässt sowohl Begründung als auch fortdauernde Stabilisierung anklingen; die deutsche Formulierung wahrt diese Offenheit.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Kosmologische Eigennamen bleiben erhalten. Technische Fremdwörter werden vermieden, wo eine klare deutsche Entsprechung möglich ist. Da eine direkte Prüfung des koptischen Textes noch aussteht, folgt der Entwurf dem bereitgestellten öffentlichen englischen Zeugnis und markiert dessen erkennbare Lücken und Unsicherheiten.
