  source_fidelity: 'Eine sichere Korrektur ist erforderlich: Die Wiedergabe »Nichts, was verborgen ist, bleibt unverhüllt« kehrt die Aussage der zitierten Sentenz um. Sie besagt, dass Verborgenes nicht enthüllt bleibt, während der Zeuge sagt, dass nichts Verborgenes unoffenbart bleibt. Die pronominale Unklarheit bei »diese«/»sie« wird ansonsten zutreffend bewahrt. »Tadel« gibt »censure« ohne die stärker juristische Festlegung von »Verurteilung« wieder.'
  naturalness: Der Text ist insgesamt modernes, würdiges Standarddeutsch. »unoffenbart« ist innerhalb eines Offenbarungskontexts verständlich und wahrt die logische Negation präzise. »Voraussicht« ist für »forethought« unmittelbarer und weniger theologisch vorgeprägt als »Vorsehung«.
  terminology: »Logos«, »Archonten«, »Vollkommene«, »Mächte des Chaos« und »Götter« sind angemessen und nicht harmonisierend wiedergegeben. »Tadel« wahrt die semantische Offenheit von »censure«; die Fußnote nennt die möglichen stärkeren juristischen Nuancen. Die direkte Kontrolle am koptischen Text steht weiterhin aus.
  issues:
  - severity: high
    issue: Die Negation im Logos-Zitat ist semantisch umgekehrt.
    rationale: »Nichts, was verborgen ist, bleibt unverhüllt« bedeutet, dass nichts Verborgenes weiterhin enthüllt bleibt. Gemeint ist hingegen, dass nichts Verborgenes unoffenbart bleibt bzw. alles Verborgene offenbar wird.
  - severity: medium
    issue: »Verurteilung« engt »censure« unnötig auf ein juristisches Urteil ein.
    rationale: Der englische Zeuge kann auch »Tadel« oder »Rüge« meinen. »Tadel« ist im Haupttext die weniger festlegende Wahl; die Fußnote dokumentiert die Unsicherheit.
  - severity: low
    issue: »Vorsehung« ist für »forethought« stärker theologisch aufgeladen als nötig.
    rationale: »Voraussicht« ist näher an der vorliegenden englischen Grundlage und erhält offen, ob eine Fähigkeit, Planung oder personifizierte Größe gemeint ist.
