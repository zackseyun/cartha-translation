    When all the perfect ones appeared in the forms shaped by the archons, and when they revealed the truth beyond compare, they humiliated all the wisdom of the gods, and their fate was found to be a censure, and their host withered away. Their lordship dissipated. Their forethought became nothing, together with their glory.'
base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/026.yaml
  text: 'The all-surpassing Logos was sent for this reason alone: so that he could announce the unknown. He said, “Nothing hidden remains unrevealed, and what is unknown will become known.” And these were sent to make known what is hidden, including the seven authorities of Chaos and their impiety. In this way, they were sentenced to death.


    When all the perfect ones appeared in the forms shaped by the archons, and when they revealed the incomparable truth, they humiliated all the wisdom of the gods. Their fate was found to be a censure, and their host withered away. Their dominion dissolved. Their forethought came to nothing, along with their glory.'
translation:
  language: de
  text: 'Der alles überragende Logos wurde allein aus diesem Grund gesandt: damit er das Unbekannte verkünde. Er sagte: »Nichts, was verborgen ist, bleibt unverhüllt, und was unbekannt ist, wird erkannt werden.« Und diese wurden gesandt, um das Verborgene bekannt zu machen, auch die sieben Mächte des Chaos und ihre Gottlosigkeit. Auf diese Weise wurden sie zum Tod verurteilt.[a]


    Als alle Vollkommenen in den von den Archonten geformten Gestalten erschienen und die unvergleichliche Wahrheit offenbarten, beschämten sie alle Weisheit der Götter. Ihr Schicksal erwies sich als Verurteilung,[b] und ihr Heer verdorrte. Ihre Herrschaft löste sich auf. Ihre Vorsehung wurde zunichte, mitsamt ihrer Herrlichkeit.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Bezug von »diese« und »sie« ist in der vorliegenden Übersetzungsgrundlage nicht eindeutig. Gemeint sein könnten die ausgesandten Offenbarer beziehungsweise bei »sie« die sieben Mächte des Chaos.
    reason: Bewahrt die echte pronominale Mehrdeutigkeit des Zeugen.
  - marker: b
    text: 'Oder: »als Tadel« beziehungsweise »als Anklage«. Die genaue Bedeutung des zugrunde liegenden Ausdrucks muss durch eine Prüfung des koptischen Textes bestätigt werden.'
    reason: Die englische Grundlage bietet »censure«, das sowohl Verurteilung als auch Tadel bezeichnen kann.
lexical_decisions:
- source_word: Logos
  choice: Logos
  rationale: Der traditionsreiche griechische Fachbegriff wird beibehalten, da »Wort« mögliche personhafte und kosmologische Bedeutungen unnötig verengen könnte.
- source_word: all-superior
  choice: alles überragende
  rationale: Gibt die Vorrangstellung idiomatisch wieder, ohne sie als absolute Allmacht auszudeuten.
- source_word: authorities
  choice: Mächte
  rationale: Im kosmologischen Zusammenhang bezeichnet der Ausdruck herrschende überweltliche Wesen; »Mächte« ist natürlich und vermeidet eine rein amtliche Bedeutung von »Autoritäten«.
- source_word: archons
  choice: Archonten
  rationale: Der gnostische Fachbegriff bleibt erhalten; eine Wiedergabe als »Herrscher« würde die spezifische Wesenklasse weniger deutlich machen.
- source_word: perfect ones
  choice: Vollkommenen
  rationale: Bewahrt die Gruppenbezeichnung und ihren religiösen Gehalt, ohne zusätzlich festzulegen, worin ihre Vollkommenheit besteht.
- source_word: forethought
  choice: Vorsehung
  rationale: Passt zum personifizierten oder kosmologischen Sinnfeld; die mögliche Nuance »Vorausplanung« bleibt in der Fußnote als Alternative kenntlich.
theological_decisions:
- issue: Unklarer Bezug des Plurals in »diese wurden gesandt«
  choice: Der Plural bleibt ohne erklärendes Bezugswort stehen.
  alternative: »Diese [Vollkommenen/Boten] wurden gesandt«
  rationale: Der überlieferte englische Zeuge lässt den Bezug offen; eine Identifikation würde eine nicht gesicherte Deutung in den Haupttext eintragen.
- issue: Bezugswort von »sie wurden zum Tod verurteilt«
  choice: Das Pronomen »sie« bleibt mehrdeutig.
  alternative: Ausdrückliche Zuordnung zu den sieben Mächten des Chaos
  rationale: Der Zusammenhang legt die Mächte nahe, doch die grammatische Referenz ist in der vorliegenden Grundlage nicht völlig eindeutig.
- issue: Götter und Archonten
  choice: Die kosmologische Terminologie wird wörtlich und ohne harmonisierende Erklärung wiedergegeben.
  alternative: Umdeutung als falsche Götter oder Dämonen
  rationale: Der Text soll seine eigene theologische Spannung behalten; eine konfessionelle Einordnung gehört nicht ungekennzeichnet in die Übersetzung.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Fachbegriffe wie »Logos« und »Archonten« bleiben wegen ihres spezifischen antiken Bedeutungsfeldes stehen. Der Entwurf ist ausdrücklich vorläufig, da eine direkte Prüfung des koptischen Ausgangstextes noch aussteht.
