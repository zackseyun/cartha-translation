lexical_decisions:
- source_word: Primal Parent of Chaos
  choice: Urvater des Chaos
  rationale: Eine natürliche und würdevolle Wiedergabe des im Zeugnis männlich aufgenommenen Ur-Elternwesens; der anschließende Bezug auf „seinen Sohn“ stützt hier die maskuline Form.
- source_word: authorities of Chaos
  choice: Mächte des Chaos
  rationale: „Mächte“ bewahrt den kosmologischen Rangbegriff und klingt im Deutschen natürlicher als „Autoritäten“.
- source_word: androgynous
  choice: androgyn
  rationale: Der etablierte deutsche Fachausdruck wahrt die gleichzeitige männliche und weibliche Beschaffenheit, ohne sie auszudeuten.
- source_word: mixed himself together with his (own) nature
  choice: vereinigte sich … mit seiner eigenen Natur
  rationale: Bewahrt die ungewöhnliche reflexive Aussage der Vorlage in verständlichem Deutsch, ohne eine konkretere mythologische Deutung einzuführen.
- source_word: Lust
  choice: Begierde
  rationale: „Begierde“ gibt das personifizierte Verlangen würdevoll und weniger missverständlich wieder als das moderne, oft positiv klingende „Lust“.
- source_word: Argumentativeness
  choice: Streitsucht
  rationale: Bezeichnet eine personifizierte Neigung zum Streit knapp und idiomatisch.
- source_word: Pistis
  choice: Pistis
  rationale: Als Name beibehalten, da sowohl „Glaube“ als auch „Treue“ möglich sind und eine Übersetzung die Mehrdeutigkeit verengen würde.
- source_word: Structures of the Fate of Heaven Beneath the Twelve
  choice: Die Ordnungen des Schicksals des Himmels unterhalb der Zwölf
  rationale: Vorläufig formnah übertragen; die ungewöhnliche Titelstruktur und „die Zwölf“ bleiben als nicht aufgelöste Bezeichnungen erhalten.
theological_decisions:
- issue: Entstehung des Todes aus dem eigenen Tod des Chaos-Urvaters
  choice: „aus seinem eigenen Tod den Tod“
  alternative: „aus seiner eigenen Todesnatur den Tod“
  rationale: Die auffällige Wiederholung und ontologische Spannung der Vorlage werden bewahrt, statt „Tod“ als Sterblichkeit oder Wesenheit festzulegen.
- issue: Zahl der guten androgynen Kräfte
  choice: Die überlieferte Angabe „sieben“ und beide Siebenerreihen unverändert wiedergeben
  alternative: Von vierzehn Kräften oder ausdrücklich sieben Paaren sprechen
  rationale: Der Text nennt sieben Kräfte, führt jedoch je sieben männliche und weibliche Namen auf. Die Übersetzung löst nicht eigenmächtig auf, ob sieben Paare oder vierzehn Einzelkräfte gemeint sind.
- issue: Personifikation und grammatisches Geschlecht des Todes
  choice: „der Tod, ein androgynes Wesen“
  alternative: Eine geschlechtsneutrale Umschreibung wie „das Todeswesen“
  rationale: Die Personifikation und das deutsche Genus bleiben erkennbar, während „androgyn“ die im Text ausdrücklich genannte doppelte Geschlechtlichkeit wahrt.
- issue: Identität der genannten Bücher
  choice: Titel übersetzen beziehungsweise benennen, Identität aber offenlassen
  alternative: Mit bekannten salomonischen oder schicksalskundlichen Schriften identifizieren
  rationale: Der vorliegende Zeuge erlaubt keine sichere Identifikation; konfessionelle oder gelehrte Festlegungen werden vermieden.
