translation:
  language: de
  text: 'Als nun der Urvater des Chaos seinen Sohn Sabaoth und die Herrlichkeit sah, in der dieser wohnte, und erkannte, dass er größer war als jede Macht des Chaos, wurde er eifersüchtig auf ihn. Voller Zorn zeugte er aus seinem eigenen Tod den Tod. Dieser wurde über den sechsten Himmel eingesetzt, weil Sabaoth von dort hinaufgehoben worden war. So wurde die Zahl der sechs Mächte des Chaos vollständig.


    Darauf vereinigte sich der Tod, ein androgynes Wesen, mit seiner eigenen Natur und zeugte sieben androgyne Kinder. Die männlichen heißen:


    Eifersucht,

    Zorn,

    Tränen,

    Seufzen,

    Leiden,

    Weinen,

    Bittere Klage.


    Die weiblichen heißen:


    Zorn,

    Schmerz,

    Begierde,

    Seufzen,

    Fluch,

    Bitterkeit,

    Streitsucht.


    Sie verkehrten miteinander, und jedes von ihnen zeugte sieben Kinder. So ergab sich die Gesamtzahl von [a] neunundvierzig androgynen Dämonen.


    Ihre Namen und ihre Wirkungen wirst du im Buch Salomos finden.[b]


    Vor diesen aber erschuf Zoe, die bei Sabaoth wohnte, sieben gute androgyne Kräfte. Die männlichen heißen: der Nicht-Eifersüchtige, der Gesegnete, der Freudige, der Wahrhaftige, der Nicht-Neidische, der Geliebte und der Treue. Die weiblichen heißen: Frieden, Frohsinn, Freude, Seligkeit, Wahrheit, Liebe und Pistis.[c] Aus diesen Kräften gehen viele gute und reine Geister hervor.


    Ihre Wirkungen und Taten wirst du im Buch »Die Ordnungen des Schicksals des Himmels unterhalb der Zwölf« finden.[d]


    [a] Die Vorlage kennzeichnet unmittelbar vor „neunundvierzig“ eine beschädigte oder unsichere Textstelle; ein erkennbares fehlendes Wort ist im vorliegenden Zeugnis nicht überliefert.


    [b] Gemeint ist ein hier vorausgesetztes Werk mit dem Titel „Buch Salomos“; seine genaue Identität bleibt offen.


    [c] „Pistis“ ist ein griechischer Name beziehungsweise Begriff und kann „Glaube“ oder „Treue“ bedeuten. Da „der Treue“ bereits in der männlichen Reihe steht und Pistis hier als Eigenname erscheint, bleibt die Form unübersetzt.


    [d] Der Werktitel ist nur vorläufig wiedergegeben; seine genaue Form ist wegen der noch ausstehenden Prüfung des koptischen Textes unsicher.'
