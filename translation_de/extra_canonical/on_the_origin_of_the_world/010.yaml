base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/010.yaml
  text: 'When the Primal Parent saw how beautifully the light glowed, he was astonished and became deeply ashamed. As that light came forth, a truly wondrous human likeness appeared within it. No one saw it except the Primal Parent and Pronoia, who lived with him. Nevertheless, its light appeared to all the hosts of heaven, and because of this they were all troubled.


    When Pronoia saw that messenger, she fell in love with him. But he loathed her because she lived in darkness. She wanted to embrace him, but she could not. When she could not quench her love, she poured out her light upon the earth. From that day, that messenger has been called “Adam of Light,” which translated means “the radiant man of blood.” And the earth was spread out above him, [7] the holy Adaman, which translated means “the Holy Land of the Adamantine.”


    From that day, every authority has honored the blood of the virgin, and the earth was purified because of the blood of the virgin. In addition, the water was purified through the likeness of Pistis Sophia, who had appeared to the Primal Parent within the waters. Therefore, it has rightly been said, “(it appeared) through the waters.” Because it gives life to everything, [] the holy water purifies everything.'
translation:
  language: de
  text: 'Als der Urvater sah, wie schön das Licht erstrahlte, staunte er und schämte sich zutiefst. Als jenes Licht hervortrat, erschien darin die Gestalt eines überaus wunderbaren Menschen. Niemand sah sie außer dem Urvater und Pronoia, die bei ihm wohnte. Doch ihr Licht erschien allen Heerscharen des Himmels, und darüber gerieten sie alle in Unruhe.


    Als Pronoia dann jenen Boten sah, verliebte sie sich in ihn. Er aber verabscheute sie, weil sie in der Finsternis wohnte. Sie wollte ihn umarmen, konnte es jedoch nicht. Als sie ihre Liebe nicht stillen konnte, goss sie ihr Licht über die Erde aus. Von jenem Tag an wurde dieser Bote »Adam des Lichts« genannt, was übersetzt »der strahlende Mensch des Blutes« bedeutet. Und über ihm breitete sich die Erde aus: der heilige Adaman[a], was übersetzt »das heilige Land des Diamantenen« bedeutet.


    Von jenem Tag an ehrte jede Macht das Blut der Jungfrau, und die Erde wurde durch das Blut der Jungfrau gereinigt. Auch das Wasser wurde durch das Abbild der Pistis Sophia[b] gereinigt, die dem Urvater in den Wassern erschienen war. Darum heißt es zu Recht: »Es erschien durch die Wasser.«[c] Weil es allem Leben schenkt, reinigt das heilige Wasser alles.[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Adaman« ist als Name oder Wortspiel überliefert. Die genaue sprachliche Herleitung und die folgende Übersetzung sind noch am koptischen Text zu prüfen.
    reason: Das Zeugnis bietet eine erklärende Übersetzung, deren Wortspiel im Deutschen nicht vollständig nachgebildet werden kann.
  - marker: b
    text: »Pistis Sophia« ist ein Eigenname; die griechischen Wörter können »Glaube/Treue« und »Weisheit« bedeuten.
    reason: Der Name bleibt unübersetzt, doch seine sprachliche Bedeutung ist für Leser hilfreich.
  - marker: c
    text: Das Subjekt von »es erschien« ist im vorliegenden Zeugnis nicht eindeutig. Die Klammern des englischen Zeugnisses zeigen eine Ergänzung an; eine Prüfung am koptischen Text steht aus.
    reason: Bewahrt eine echte syntaktische Unklarheit und weist auf den provisorischen Quellenstand hin.
  - marker: d
    text: Im englischen Zeugnis stehen vor »das heilige Wasser« leere eckige Klammern als mögliches Zeichen einer Textlücke oder unsicheren Ergänzung. Die genaue Stelle ist am Manuskript zu prüfen.
    reason: Das bloße Zeichen wurde nicht störend in den Lesetext übernommen, sein textkritischer Wert aber dokumentiert.
lexical_decisions:
- source_word: Primal Parent
  choice: Urvater
  rationale: Gibt die männliche Referenz des Zeugnisses und die Funktion als ursprünglicher Elternteil knapp und würdig wieder; »Ur-Elternteil« wäre im Deutschen unnatürlich.
- source_word: Pronoia
  choice: Pronoia
  rationale: Der griechisch geprägte Eigenname wird bewahrt, statt ihn deutend als »Vorsehung« zu übersetzen.
- source_word: human likeness
  choice: Gestalt eines … Menschen
  rationale: Bewahrt den Charakter einer Erscheinungsform, ohne vorschnell eine konkrete Person zu identifizieren.
- source_word: hosts of the heavens
  choice: Heerscharen des Himmels
  rationale: Traditionell verständliche kosmologische Formulierung in gehobenem, aber zugänglichem Deutsch.
- source_word: authority
  choice: Macht
  rationale: Passt zum kosmologischen Gebrauch für überweltliche Herrschaftswesen und vermeidet das institutionelle »Behörde«.
- source_word: likeness
  choice: Abbild
  rationale: Bezeichnet eine repräsentierende Erscheinung, ohne Identität zwischen Pistis Sophia und der Erscheinung festzulegen.
- source_word: holy water
  choice: heilige Wasser
  rationale: Bewahrt die sachliche Referenz auf das zuvor genannte Wasser; kleingeschrieben, da kein feststehender liturgischer Fachausdruck vorausgesetzt werden soll.
theological_decisions:
- issue: Geschlecht und Benennung des Primal Parent
  choice: Urvater; männliche Pronomen
  alternative: Urelternteil / ursprünglicher Elternteil
  rationale: Das englische Zeugnis verwendet ausdrücklich männliche Pronomen. Die Übersetzung bewahrt diese Textgestalt, ohne zusätzliche dogmatische Identifikation.
- issue: Bedeutung von Pronoia
  choice: Name unübersetzt lassen
  alternative: Vorsehung
  rationale: Eine Übersetzung als theologischer Begriff könnte die Gestalt auf eine abstrakte Eigenschaft reduzieren; der Eigenname lässt die Spannung offen.
- issue: Deutung von »blood of the virgin«
  choice: wörtlich »Blut der Jungfrau«
  alternative: deutende Identifikation mit Menstruations-, Geburts- oder Opferblut
  rationale: Der Abschnitt erklärt die Wendung nicht eindeutig. Keine mögliche kosmologische oder sakramentale Deutung wird festgeschrieben.
- issue: Zitat »through the waters«
  choice: »Es erschien durch die Wasser«
  alternative: Subjekt ergänzen oder auf Taufe/Schöpfung beziehen
  rationale: Das unklare Bezugswort bleibt als Pronomen erhalten; eine theologische Auflösung wäre ohne koptische Prüfung spekulativ.
- issue: Zahl und Geschlecht im Schlusssatz
  choice: »es« auf »das heilige Wasser« beziehen
  alternative: Plural »sie« auf »die Wasser«
  rationale: Das unmittelbar vorausgehende Zeugnis hat den Singular »holy water«; die Übersetzung folgt diesem vorläufig, markiert aber die Unsicherheit in der Fußnote.
translation_notes:
  register: Modernes Standarddeutsch in würdigem erzählerischem Register. Kosmologische Eigennamen bleiben erhalten. Die Fassung ist ausdrücklich vorläufig, weil nur ein öffentlich zugängliches englisches Übersetzungszeugnis vorliegt und die direkte Prüfung des koptischen Textes noch aussteht. Die störende Seitenzahl [7] wurde nicht in den Lesetext übernommen; textkritische Unsicherheiten werden stattdessen durch reguläre Fußnoten mit Markern im Haupttext ausgewiesen.
