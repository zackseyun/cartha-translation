base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/020.yaml
  text: 'She first became pregnant with Abel by the first archon. By the seven authorities and their angels, she had the other children. Everything happened according to the forethought of the Primal Parent, so that the Primal Mother could bear every seed within her, mixed and joined with the destiny of the universe and its structures. A plan designed beforehand by Justice was set in motion concerning Eve: the shaped forms of the authorities would become places enclosing the light, and through their shaped forms the light would condemn them.


    The Primal Adam, who is from the Light, is filled with spirit, and he appeared on the first day. The second Adam is filled with soul, and he appeared on the sixth day, called “Aphrodite.” The third Adam is a created being from the earth, namely, the man of the Law. He appeared on the eighth day, called “Sun-Day,” [following] [] the lowly Rest-Day. The descendants of the earthly Adam multiplied and filled the earth, and from within themselves they produced all kinds of technological skills possessed by the Adam filled with soul. However, they all lived in ignorance.'
translation:
  language: de
  text: 'Sie wurde zuerst vom ersten Archon mit Abel schwanger. Von den sieben Mächten und ihren Engeln empfing sie die anderen Kinder. Alles geschah gemäß der Vorsehung des Urelternteils[a], damit die Urmutter jeden Samen in sich tragen konnte, vermischt und verbunden mit dem Schicksal des Alls und seinen Ordnungen. So wurde im Hinblick auf Eva ein Plan in Gang gesetzt, den die Gerechtigkeit im Voraus entworfen hatte: Die geformten Gestalten der Mächte sollten zu Gefäßen werden, die das Licht einschlossen; und das Licht sollte sie durch ihre eigenen Gestalten verurteilen.


    Der erste Adam, der aus dem Licht stammt, ist vom Geist erfüllt; er erschien am ersten Tag. Der zweite Adam ist von Seele erfüllt; er erschien am sechsten Tag, der »Aphrodite« genannt wird. Der dritte Adam ist ein aus Erde geschaffenes Wesen, nämlich der Mensch des Gesetzes. Er erschien am achten Tag, der »Sonnentag« genannt wird, [nach] [b] dem niedrigen Ruhetag. Die Nachkommen des irdischen Adam vermehrten sich und erfüllten die Erde. Aus ihrem Inneren brachten sie alle Arten technischen Könnens hervor, über die der von Seele erfüllte Adam verfügte. Doch sie alle lebten in Unwissenheit.


    [a] Oder: »des Urvaters«. Das zugrunde liegende englische Zeugnis hat »Primal Parent« und lässt die geschlechtliche Bestimmung offen.

    [b] Die eckigen Klammern geben eine unsichere Ergänzung beziehungsweise eine Textlücke im überlieferten Zeugnis wieder.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »des Urvaters«. Das zugrunde liegende englische Zeugnis hat »Primal Parent« und lässt die geschlechtliche Bestimmung offen.'
    reason: Die direkte koptische Quellenprüfung steht aus; die ungewöhnliche geschlechtsneutrale Wiedergabe macht die Unsicherheit sichtbar.
  - marker: b
