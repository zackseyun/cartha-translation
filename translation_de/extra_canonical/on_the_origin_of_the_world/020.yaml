    reason: Die Vorlage bietet »[following] []«; der beschädigte beziehungsweise ergänzte Zustand muss kenntlich bleiben.
lexical_decisions:
- source_word: first archon
  choice: erster Archon
  rationale: Der traditionsgeschichtlich geprägte Titel wird als Lehnwort bewahrt; eine Wiedergabe als »Herrscher« könnte die spezifische kosmologische Rolle verwischen.
- source_word: seven authorities
  choice: sieben Mächte
  rationale: »Mächte« ist im Deutschen natürlich und bewahrt den Sinn überweltlicher Herrschaftsträger; »Gewalten« wäre ebenfalls möglich, wirkt hier aber stärker biblisch vorgeprägt.
- source_word: Primal Parent
  choice: Urelternteil
  rationale: Die ungewöhnliche, geschlechtsneutrale Bezeichnung wahrt die Offenheit des englischen Quellenzeugnisses; die flüssigere Alternative »Urheber« würde die Elternmetaphorik verlieren.
- source_word: Primal Mother
  choice: Urmutter
  rationale: Direkte und verständliche Wiedergabe der kosmologischen Gestalt.
- source_word: destiny of the universe
  choice: Schicksal des Alls
  rationale: »All« gibt den kosmologischen Gesamtbereich würdig und knapp wieder; »Schicksal« bewahrt die determinative Bedeutung.
- source_word: structures
  choice: Ordnungen
  rationale: Im kosmologischen Zusammenhang bezeichnet der Ausdruck eher gegliederte Einrichtungen als bloß materielle Strukturen.
- source_word: shaped forms
  choice: geformte Gestalten
  rationale: Die doppelte Nuance von Formung und sichtbarer Gestalt bleibt erhalten.
- source_word: imbued with spirit / soul
  choice: vom Geist / von Seele erfüllt
  rationale: Die Parallelität wird bewahrt, ohne Geist und Seele gleichzusetzen.
- source_word: man of the Law
  choice: Mensch des Gesetzes
  rationale: Formale Wiedergabe, die die unklare theologische Zuordnung nicht näher bestimmt.
- source_word: technological skills
  choice: technisches Können
  rationale: Natürliches modernes Deutsch; gemeint sind erlernte oder hervorgebrachte Künste und Fertigkeiten, nicht notwendig moderne Technologie.
- source_word: ignorance
  choice: Unwissenheit
  rationale: Bewahrt den erkenntnistheoretischen und religiösen Sinn ohne konfessionelle Ausdeutung.
theological_decisions:
- issue: Handelndes Subjekt bei der Verurteilung der Mächte
  choice: »das Licht sollte sie ... verurteilen«
  alternative: »wodurch es sie ... tadeln sollte« oder ein unbestimmtes Subjekt
  rationale: Das englische POB versteht »it« als das Licht. Diese plausible Referenz wird übernommen, ohne den Mechanismus der Verurteilung weiter auszudeuten.
- issue: Verhältnis von Vorsehung, Schicksal und Gerechtigkeit
  choice: Alle drei Größen bleiben sprachlich unterschieden und personifizierbar.
  alternative: Vereinheitlichung als göttlicher Heilsplan
  rationale: Der Text stellt verschiedene kosmologische Instanzen nebeneinander; eine Harmonisierung würde seine Spannung beseitigen.
- issue: Drei Adamsgestalten
  choice: Geist, Seele und Erde werden als unterscheidende Merkmale parallel wiedergegeben.
  alternative: Deutung als feste christliche Anthropologie oder heilsgeschichtliche Stufen
  rationale: Der Abschnitt nennt die Unterscheidungen, erklärt aber ihr dogmatisches Verhältnis nicht.
- issue: Achter Tag und Sonnentag
  choice: Die ungewöhnliche Abfolge einschließlich des »niedrigen Ruhetags« bleibt stehen.
  alternative: Normalisierung auf eine geläufige Siebentagewoche
  rationale: Die kosmologische Wertung und die beschädigte Überlieferung dürfen nicht stillschweigend korrigiert werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit bewusst beibehaltenen kosmologischen Fachbegriffen. Kurze Hauptsätze verbessern die Lesbarkeit. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist die Fassung ausdrücklich am öffentlichen englischen Quellenzeugnis orientiert; echte Unklarheiten werden durch vorsichtige Wortwahl und Fußnoten bewahrt.
