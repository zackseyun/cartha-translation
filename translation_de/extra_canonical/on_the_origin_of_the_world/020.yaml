  terminology: „Archon“, „Mächte“, „Urmutter“, „Geist“, „Seele“, „Mensch des Gesetzes“ und „Unwissenheit“ sind angemessen und bewahren die kosmologische Terminologie. Die drei Adamsgestalten werden parallel und ohne dogmatische Harmonisierung wiedergegeben.
