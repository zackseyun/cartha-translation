translation:
  language: de
  text: 'Dann äußerte der Urvater gegenüber denen, die bei ihm wohnten, seine Ansicht über den Menschen. Daraufhin gab jeder von ihnen seinen Samen in die Mitte des Nabels der Erde.


    Von diesem Tag an formten die sieben Archonten gemeinsam den Menschen samt seinem Körper, sodass er ihrem eigenen Körper glich; sein Aussehen aber glich dem Menschen, der ihnen erschienen war. Seine Gestalt wurde Teil für Teil geformt, und ihr Anführer bildete das Gehirn und das Nervensystem.


    Danach sah er aus wie derjenige, der vor ihm gewesen war. Er wurde […] zu einem Menschen mit einer Seele und erhielt den Namen Adam, das heißt »Vater«, nach dem Namen dessen, der vor ihm existiert hatte.[a] Als sie Adam vollendet hatten, ließ ihr Anführer[b] ihn wie ein lebloses Gefäß zurück; denn er hatte die Gestalt einer Fehlgeburt angenommen und hatte keinen Geist in sich.


    Als der oberste Archont sich an die Worte der Pistis erinnerte, fürchtete er, der wahre Mensch könnte in die von ihm geformte Gestalt eingehen und ihr Herr werden. Deshalb hielt er sich vierzig Tage lang von seiner geformten Gestalt fern, die nun ohne Seele war; er zog sich zurück und überließ sie sich selbst.


    Am vierzigsten Tag sandte Sophia Zoe ihren Atem in Adam, der ohne Seele war.[c] Da begann er, sich auf dem Boden zu bewegen, konnte sich aber nicht aufrecht hinstellen.


    Als dann die sieben Archonten kamen, sahen sie ihn und gerieten in große Unruhe. Sie traten zu ihm, packten ihn, und der oberste Archont[d] sprach zu dem Atem in ihm: »Wer bist du, und woher bist du hierhergekommen?«


    Der Atem antwortete: »Ich bin aus der Kraft des Menschen gekommen, um euer Werk zugrunde zu richten.« Als sie das hörten, priesen sie ihn, denn er verschaffte ihnen eine Ruhepause von der Furcht und Beklemmung, in der sie sich befanden.


    Sie nannten diesen Tag daraufhin »Ruhe«, weil sie von ihrer Arbeit geruht hatten. Als sie sahen, dass Adam sich aufrecht hinstellen konnte, freuten sie sich. Sie nahmen ihn, setzten ihn ins Paradies und zogen sich hinauf in ihre Himmel zurück.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Auslassung […] kennzeichnet eine Lücke oder unsichere Wiederherstellung im überlieferten Text. Die Erklärung des Namens Adam als »Vater« folgt der vorliegenden Textüberlieferung und nicht der üblichen hebräischen Namensdeutung.
    reason: Kennzeichnet den Textverlust und verhindert, dass die ungewöhnliche Etymologie stillschweigend korrigiert wird.
  - marker: b
    text: Wörtlich steht im zugrunde gelegten englischen Zeugen nur »er«. Gemeint ist wahrscheinlich der Anführer der Archonten; die Beziehung des Pronomens ist jedoch nicht völlig eindeutig.
    reason: Bewahrt eine echte syntaktische Unsicherheit des verfügbaren Zeugen.
  - marker: c
    text: »Sophia Zoe« bedeutet sinngemäß »Weisheit Leben« beziehungsweise »Weisheit, die Lebendige«. Der Name bleibt unübersetzt, um seine Funktion als Eigenname zu bewahren.
    reason: Hilft modernen Lesern, den bedeutungstragenden griechischen Namen zu verstehen, ohne ihn im Text interpretierend aufzulösen.
  - marker: d
    text: Der zugrunde gelegte englische Zeuge hat auch hier nur »er«. Aus dem Zusammenhang ist wahrscheinlich der oberste Archont der Sprecher; grammatisch bleibt der Bezug offen.
    reason: Markiert die Pronomenmehrdeutigkeit, statt sie als textlich gesichert auszugeben.
lexical_decisions:
- source_word: Primal Parent
  choice: Urvater
  rationale: Gibt die elterliche und männlich anmutende Bezeichnung des englischen Zeugen knapp und würdig wieder; der anschließende maskuline Bezug wird gewahrt.
- source_word: archons
  choice: Archonten
  rationale: Der etablierte Fachbegriff bewahrt die besondere kosmologische Rolle dieser Herrschermächte, ohne sie vorschnell als gewöhnliche Herrscher oder Engel zu deuten.
- source_word: sperm
  choice: Samen
  rationale: Natürliches, verständliches Deutsch mit der konkreten Zeugungsbedeutung des Kontextes.
- source_word: likeness
  choice: Aussehen
  rationale: Unterscheidet verständlich zwischen körperlicher Gestaltung nach den Archonten und der äußeren Ähnlichkeit mit dem zuvor erschienenen Menschen.
- source_word: spirit / breath
  choice: Geist / Atem
  rationale: Die unterschiedlichen englischen Ausdrücke werden nicht eingeebnet. »Atem« bleibt bei Sophia Zoes lebenspendender Gabe und deren Rede erhalten, »Geist« bei Adams anfänglichem Mangel.
- source_word: Paradise
  choice: Paradies
  rationale: Entspricht dem geläufigen deutschen religiösen Sprachgebrauch, ohne zusätzliche Deutung.
- source_word: Rest
  choice: Ruhe
  rationale: Bewahrt das Wortspiel mit dem Ruhen von der Arbeit.
theological_decisions:
- issue: Verhältnis von Körper, Seele, Geist und Atem
  choice: Die vier im Zeugen unterscheidbaren Bezeichnungen bleiben sprachlich unterscheidbar.
  alternative: »Geist« und »Atem« einheitlich wiedergeben oder Seele und Geist angleichen.
  rationale: Die kosmologische und anthropologische Spannung des Textes darf nicht durch eine systematisierende Übersetzung beseitigt werden.
- issue: Identität des »wahren Menschen« und des zuvor erschienenen Menschen
  choice: Die Bezeichnungen bleiben unbestimmt und werden nicht identifiziert.
  alternative: Sie ausdrücklich als himmlischen Urmenschen oder als bestimmte Erlösergestalt benennen.
  rationale: Der vorliegende Abschnitt selbst legt eine solche dogmatische Identifikation nicht eindeutig fest.
- issue: Reaktion der Archonten auf die drohende Zerstörung ihres Werkes
  choice: Das paradoxe »sie priesen ihn« und die gewährte Ruhepause bleiben erhalten.
  alternative: Die Aussage glätten oder so umdeuten, dass die Archonten nur aus Angst nachgeben.
  rationale: Die innere Spannung gehört zum überlieferten Zeugnis und soll sichtbar bleiben.
- issue: Subjektwechsel bei »he forsook him« und »he spoke«
  choice: Im Haupttext wird jeweils »ihr Anführer« beziehungsweise »der oberste Archont« eingesetzt und die Unsicherheit in Fußnoten markiert.
  alternative: Nur das mehrdeutige Pronomen »er« verwenden oder Adam als Sprecher bestimmen.
  rationale: Natürliches Deutsch verlangt meist eine klarere Referenz; der unmittelbare Zusammenhang legt den obersten Archonten nahe, doch die nur indirekt geprüfte Textgrundlage erlaubt keine völlige Sicherheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Syntax. Kosmologische Fachbegriffe wie »Archonten«, »Pistis« und »Sophia Zoe« bleiben erhalten. Der Entwurf ist notwendig vorläufig, weil nur ein gemeinfreier englischer Übersetzungszeuge vorliegt und die direkte Prüfung des koptischen Textes noch aussteht.
