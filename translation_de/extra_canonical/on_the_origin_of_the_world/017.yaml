  - severity: low
    issue: Die Lückenmarkierung steht in der deutschen Satzfügung nicht unmittelbar an der Stelle der überlieferten Lücke.
    rationale: „He became [] a man“ wird genauer durch „Er wurde […] ein Mensch“ abgebildet als durch „Er wurde […] zu einem Menschen“.
  - severity: low
