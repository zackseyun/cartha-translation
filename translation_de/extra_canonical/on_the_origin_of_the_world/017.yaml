  naturalness: Das Deutsch ist überwiegend modernes, würdiges Standarddeutsch. Einige Formulierungen werden durch die Rückführung der Pronomen leicht gestrafft; „Erleichterung von Furcht und Beklemmung“ gibt „respite“ natürlicher wieder als „Ruhepause von“.
  terminology: „Urvater“, „Archonten“, „Pistis“, „Sophia Zoe“, „Atem“, „Geist“, „Paradies“ und „Ruhe“ sind angemessen. Die Unterscheidung von Atem und Geist bleibt erhalten, ebenso die im Text gebotene ungewöhnliche Adam-Etymologie.
