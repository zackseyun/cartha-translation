base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/016.yaml
  text: 'Eve is the first virgin, the one who bore her first child without a husband. She acted as her own midwife, and because of this she is said to have declared:


    I am the one who is part of my mother,

    and I am the one who is the mother.

    I am the one who is the wife;

    I am the one who is the virgin.

    I am the one who is pregnant;

    I am the one who is the midwife.

    I am the one who eases the pains of childbirth.

    My husband is the one who gave birth to me,

    and I am the one who is his mother,

    and he is the one who is my father and my lord.

    He is the one who is my strength.

    Whatever he wishes, he speaks with reason.

    I am on the way to becoming,

    although I have already given birth to a man as a lord.


    Now these things were revealed, by the will of Sabaoth and his Christ, to the souls that were to enter the shaped forms of the authorities. Concerning these, the holy voice said, “Multiply and flourish; rule over all created beings.” They were the ones who, according to their destinies, were taken captive by the Primal Parent. In this way they were locked inside the prisons of the shaped forms <. . .> until the consummation of the age.'
translation:
  language: de
  text: 'Eva ist die erste Jungfrau, die ohne einen Mann ihr erstes Kind gebar. Sie war ihre eigene Hebamme; deshalb soll sie gesagt haben:


    Ich bin die, die ein Teil meiner Mutter ist,

    und ich bin die, die die Mutter ist.

    Ich bin die, die die Frau ist;

    ich bin die, die die Jungfrau ist.

    Ich bin die, die schwanger ist;

    ich bin die, die die Hebamme ist.

    Ich bin die, die die Geburtswehen lindert.

    Mein Mann ist der, der mich geboren hat,

    und ich bin die, die seine Mutter ist,

    und er ist der, der mein Vater und mein Herr ist.

    Er ist der, der meine Kraft ist.

    Was immer er will, spricht er mit Vernunft.

    Ich bin im Begriff zu werden,

    obwohl ich bereits einen Mann als Herrn geboren habe.[a]


    Dies nun wurde nach dem Willen Sabaoths und seines Christus den Seelen offenbart, die in die gestalteten Formen der Mächte eingehen sollten. Über sie sagte die heilige Stimme: »Vermehrt euch und gedeiht; herrscht über alle geschaffenen Wesen.« Sie waren es, die gemäß ihren Bestimmungen vom Urvater gefangen genommen wurden. So wurden sie in die Gefängnisse der gestalteten Formen eingeschlossen <…>[b] bis zur Vollendung des Zeitalters.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Aussage »einen Mann als Herrn« ist im vorliegenden englischen Zeugen mehrdeutig; eine unmittelbare Prüfung des koptischen Wortlauts steht noch aus.
    reason: Kennzeichnet eine für die Auslegung bedeutsame syntaktische Unsicherheit.
  - marker: b
    text: Die spitzen Klammern mit Auslassungspunkten kennzeichnen eine Lücke beziehungsweise beschädigten Text in der Überlieferung.
    reason: Bewahrt die sichtbare Markierung des Textverlusts.
  - marker: c
    text: »Zeitalter« gibt hier einen eschatologisch geprägten Zeitbegriff wieder; gemeint sein kann der Abschluss der gegenwärtigen Weltordnung.
    reason: Erklärt den Ausdruck, ohne ihn auf »Weltende« zu verengen.
lexical_decisions:
- source_word: virgin
  choice: Jungfrau
  rationale: Bewahrt die ausdrücklich sexuelle und symbolische Bedeutung des Zeugnisses.
- source_word: midwife
  choice: Hebamme
  rationale: Die natürliche moderne Entsprechung; das paradoxe Motiv der Selbstgeburtshilfe bleibt erhalten.
- source_word: authorities
  choice: Mächte
  rationale: Im kosmologischen Zusammenhang bezeichnet der Ausdruck übermenschliche Herrschaftswesen; »Mächte« ist verständlich und lässt ihre genaue Stellung offen.
- source_word: shaped forms
  choice: gestaltete Formen
  rationale: Eine bewusst formnahe Wiedergabe, da der Ausdruck kosmologisch-technisch und inhaltlich mehrdeutig ist.
- source_word: Primal Parent
  choice: Urvater
  rationale: Gibt die elterliche Ursprungsfigur idiomatisch wieder, folgt jedoch der maskulinen Prägung des vorliegenden Zeugnisses; wegen ausstehender koptischer Prüfung bleibt die Entscheidung vorläufig.
- source_word: consummation of the age
  choice: Vollendung des Zeitalters
  rationale: Bewahrt die eschatologische Fachsprache und vermeidet die vereinfachende Festlegung auf »Weltende«.
theological_decisions:
- issue: Paradoxe Identitäten und Verwandtschaftsbeziehungen in Evas Rede
  choice: Die widersprüchlich wirkenden Aussagen werden eng und ohne Harmonisierung wiedergegeben.
  alternative: Die Beziehungen durch erklärende Zusätze als kosmologische Metaphern auslegen.
  rationale: Der Text setzt die Spannung gezielt ein; eine Auflösung würde eine bestimmte Interpretation importieren.
- issue: »als Herrn« beim geborenen Mann
  choice: »einen Mann als Herrn geboren«
  alternative: »einen Mann, nämlich einen Herrn, geboren« oder »einen männlichen Herrn geboren«
  rationale: Die syntaktische und theologische Mehrdeutigkeit des vorliegenden Zeugnisses bleibt bestehen.
- issue: Sabaoth und sein Christus
  choice: »Sabaoths und seines Christus«
  alternative: »Sabaoths und seines Gesalbten«
  rationale: »Christus« wahrt den erkennbaren Titel und die Terminologie des konsultierten Zeugnisses, ohne die Figurenbeziehung weiter zu bestimmen.
- issue: Gefangenschaft gemäß den Bestimmungen
  choice: »gemäß ihren Bestimmungen«
  alternative: »ihrem Schicksal entsprechend«
  rationale: »Bestimmungen« erhält die mögliche Bedeutung zugewiesener Ordnungen oder Lose und legt keinen strikten Fatalismus fest.
