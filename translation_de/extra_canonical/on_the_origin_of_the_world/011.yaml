base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/011.yaml
  text: 'As an androgynous being, Eros appeared from that primal blood. His masculine element is Himireris, which is fire from light. His feminine element that dwells together with him is a soul consisting of blood and originates from the substance of Pronoia. He is exceedingly lovely in his beauty, possessing a charm surpassing that of all the created entities of Chaos.


    Then all the gods and their angels, when they gazed upon Eros, fell in love with him. By manifesting himself within all of them, he set them ablaze. Just as several lamps are lit from a single lamp, and one and the same light is present while the lamp is not diminished, so Eros dispersed himself within all the created entities of Chaos and was not diminished. Just as Eros appeared at the center of light and darkness, and just as the sexual union of Eros was consummated at the center of the angels and humanity, so the primal pleasure blossomed from the earth. Woman followed Earth; marriage followed Woman. Birth followed marriage; decline followed birth.


    After Eros, the grapevine sprouted from the blood that had been shed upon the earth. Because of this, those who drink from it develop a desire for sexual union.


    After the grapevine, a fig tree and a pomegranate tree sprouted from the earth, together with the remainder of the trees, every species, possessing their seed from the [] seed of the authorities and of their angels.'
translation:
  language: de
  text: 'Als androgynes Wesen trat Eros aus jenem ursprünglichen Blut hervor. Sein männlicher Bestandteil ist Himireris[a], Feuer aus Licht. Sein weiblicher Bestandteil, der mit ihm zusammenwohnt, ist eine aus Blut bestehende Seele und stammt aus der Substanz der Pronoia[b]. Von außerordentlicher Schönheit ist er, und seine Anmut übertrifft die aller Wesen, die im Chaos geschaffen wurden.


    Als nun alle Götter und ihre Engel Eros erblickten, verliebten sie sich in ihn. Indem er sich in ihnen allen offenbarte, setzte er sie in Flammen. Wie mehrere Lampen an einer einzigen Lampe entzündet werden und in ihnen ein und dasselbe Licht gegenwärtig ist, ohne dass die erste Lampe dadurch schwächer wird, so verbreitete sich Eros in allen geschaffenen Wesen des Chaos, ohne selbst schwächer zu werden. Wie Eros inmitten von Licht und Finsternis erschien und wie die geschlechtliche Vereinigung des Eros inmitten der Engel und der Menschheit vollzogen wurde, so erblühte aus der Erde die ursprüngliche Lust. Auf die Erde folgte die Frau, auf die Frau die Ehe, auf die Ehe die Geburt und auf die Geburt der Verfall.


    Nach Eros spross aus jenem Blut, das auf die Erde vergossen worden war, der Weinstock hervor. Deshalb entsteht in denen, die davon trinken, das Verlangen nach geschlechtlicher Vereinigung.


    Nach dem Weinstock sprossten ein Feigenbaum und ein Granatapfelbaum aus der Erde hervor, zusammen mit allen übrigen Bäumen, Art für Art. Ihren Samen hatten sie aus dem […] Samen der Mächte und ihrer Engel.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Form und Bedeutung des Namens „Himireris“ sind unsicher; der Name wird daher unverändert wiedergegeben.
    reason: Verhindert eine spekulative etymologische oder mythologische Festlegung.
  - marker: b
    text: „Pronoia“ kann im Griechischen unter anderem „Vorausdenken“ oder „Vorsehung“ bedeuten; hier erscheint das Wort als Name einer personifizierten kosmischen Größe.
    reason: Erläutert den Namen, ohne seine Bedeutung im Haupttext festzulegen.
  - marker: c
    text: Die Auslassungszeichen kennzeichnen eine Lücke beziehungsweise unleserliche Stelle in der zugrunde gelegten Textüberlieferung.
    reason: Macht transparent, dass die ungewöhnliche Wiederholung von „Samen“ textlich nicht sicher ergänzt werden kann.
lexical_decisions:
- source_word: androgynous entity
  choice: androgynes Wesen
  rationale: Bewahrt die ausdrückliche Doppelgeschlechtlichkeit, ohne Eros auf eine bloße abstrakte Größe zu reduzieren.
- source_word: Himireris
  choice: Himireris
  rationale: Der überlieferte Name wird wegen seiner unsicheren Form nicht gedeutet oder durch ein vermeintliches griechisches Äquivalent ersetzt.
- source_word: Pronoia
  choice: Pronoia
  rationale: Als Name beziehungsweise personifizierte Größe transliteriert; eine Übersetzung mit „Vorsehung“ oder „Vorausdenken“ würde die Mehrdeutigkeit vorzeitig festlegen.
- source_word: charm
  choice: Anmut
  rationale: Gibt die anziehende Schönheit in würdigem, natürlichem Deutsch wieder.
- source_word: created entities of Chaos
  choice: Wesen, die im Chaos geschaffen wurden
  rationale: Vermeidet das technisch-sperrige „Entitäten“, bewahrt aber Chaos als kosmischen Bereich.
- source_word: set them ablaze
  choice: setzte er sie in Flammen
  rationale: Erhält das Feuerbild, das durch den anschließenden Lampenvergleich erläutert wird.
- source_word: primal pleasure
  choice: ursprüngliche Lust
  rationale: „Lust“ wahrt hier sowohl sinnliche Freude als auch sexuelles Begehren; „ursprünglich“ nimmt den kosmogonischen Zusammenhang auf.
- source_word: decline
  choice: Verfall
  rationale: Bewahrt die negative Folge der Geburt, ohne sie präziser als Tod oder Auflösung zu bestimmen.
- source_word: authorities
  choice: Mächte
  rationale: Gibt die kosmischen Herrschaftswesen wieder, ohne durch „Obrigkeiten“ einen modernen politischen Klang einzutragen.
theological_decisions:
- issue: Status von Pronoia
  choice: Als Eigenname „Pronoia“ beibehalten
  alternative: „Vorsehung“ oder „Vorausdenken“
  rationale: Der Abschnitt behandelt Pronoia als kosmische beziehungsweise personifizierte Größe; die Transliteration bewahrt diese Spannung und vermeidet eine Gleichsetzung mit späteren Lehrbegriffen.
- issue: Ausbreitung des Eros in den geschaffenen Wesen
  choice: Bildhafte Sprache von Offenbarung, Entzündung und unverminderter Verbreitung beibehalten
  alternative: Als bloßen Einfluss oder als metaphysische Teilung erklären
  rationale: Der Text verbindet Präsenz, Feuer und das Lampengleichnis, ohne das genaue Verhältnis systematisch aufzulösen.
- issue: Kosmogonische Folge Erde–Frau–Ehe–Geburt–Verfall
  choice: Die knappe Abfolge ohne erklärende Ergänzungen wiedergeben
  alternative: Die Folge moralisch, biologisch oder heilsgeschichtlich ausdeuten
  rationale: So bleibt die theologische und anthropologische Spannung des Zeugnisses erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst bewahrter kosmogonischer Bildsprache. Technische Fremdwörter wurden möglichst vermieden, Eigennamen und echte Unklarheiten jedoch nicht erklärend aufgelöst. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist dies ein vorläufiger, quellenbewusster Entwurf auf Grundlage des angegebenen gemeinfreien englischen Zeugnisses; bloße Seitenzahlen des Manuskripts wurden nicht in den Fließtext übernommen.
