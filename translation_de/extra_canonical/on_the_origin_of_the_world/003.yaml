base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/003.yaml
  text: 'When the archon saw his size—though he saw no one but himself, since he could see nothing beyond water and darkness—he imagined that he was the only one who existed. His [. . .] was completed through verbal articulation, which [] manifested itself as a spirit moving back and forth over the waters. When that spirit had appeared, the archon separated the watery substance, and the dry substance was set apart in another place. From matter he fashioned a dwelling place for himself and called it “Heaven.” From matter the archon also fashioned a footstool and called it “Earth.”


    Then a thought occurred to the archon, in agreement with his nature, and through verbal articulation he created an androgyne. He opened his mouth and made a cooing sound to him. When his eyes opened, he looked at his father and made the sound “eee!” His father then named him “Eee-a-o.” [1]


    Then he created the second son, making a cooing sound to him. When the son opened his eyes, he made the sound “eh!” to his father. His father named him “Eloai.”


    Then he created the third son, making a cooing sound to him. When the son opened his eyes, he made the sound “asss!” to his father. His father named him “Astaphaios.”


    These three are the sons of their father.'
translation:
  language: de
  text: 'Als der Archon seine Größe wahrnahm – obwohl er niemanden außer sich selbst sah, weil sein Blick nicht über Wasser und Finsternis hinausreichte –, bildete er sich ein, er sei der Einzige, der existiere. Sein […] wurde durch sprachliche Äußerung vollendet, die [ ] als ein Geist in Erscheinung trat, der sich über den Wassern hin und her bewegte. Als dieser Geist erschienen war, schied der Archon die wässrige Substanz ab, und das Trockene wurde an einen anderen Ort gesondert. Aus Materie formte er sich eine Wohnstätte und nannte sie »Himmel«. Ebenfalls aus Materie formte der Archon einen Schemel und nannte ihn »Erde«.


    Dann kam dem Archon ein Gedanke, der seinem Wesen entsprach, und durch sprachliche Äußerung erschuf er ein androgynes Wesen. Er öffnete den Mund und ließ ihm gegenüber einen gurrenden Laut hören. Als sich seine Augen öffneten, blickte es seinen Vater an und äußerte ihm gegenüber den Laut »iii!«. Daraufhin gab ihm sein Vater den Namen »Iii-a-o«.[a]


    Dann erschuf er den zweiten Sohn und ließ ihm gegenüber einen gurrenden Laut hören. Als dieser die Augen öffnete, äußerte er seinem Vater gegenüber den Laut »eh!«. Sein Vater gab ihm den Namen »Eloai«.


    Dann erschuf er den dritten Sohn und ließ ihm gegenüber einen gurrenden Laut hören. Als dieser die Augen öffnete, äußerte er seinem Vater gegenüber den Laut »asss!«. Sein Vater gab ihm den Namen »Astaphaios«.


    Diese drei sind die Söhne ihres Vaters.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Lautfolgen und Namensformen folgen dem vorliegenden englischen Textzeugen. Die dortige Anmerkungsmarke [1] enthält in den bereitgestellten Angaben keinen Anmerkungstext; die Schreibweisen sind bei einer Prüfung des koptischen Wortlauts erneut zu kontrollieren.
    reason: Kennzeichnet die unsichere, bislang nur mittelbar geprüfte Wiedergabe der lautmalerischen Namensbildung und dokumentiert die fehlende Anmerkung des Ausgangszeugen.
lexical_decisions:
- source_word: archon
  choice: Archon
  rationale: Der in gnostischen Texten übliche Fachbegriff bleibt als Titel bzw. Wesenbezeichnung erhalten; eine Übersetzung mit »Herrscher« könnte den traditionsgeschichtlichen Bezug verwischen.
- source_word: verbal articulation
  choice: sprachliche Äußerung
  rationale: Gibt den Vorgang des Hervorbringens durch artikulierte Rede wieder, ohne ihn vorschnell mit einem bestimmten theologischen Begriff wie »Wort« oder »Logos« gleichzusetzen.
- source_word: aqueous substance / what was dry
  choice: wässrige Substanz / das Trockene
  rationale: Bewahrt den stofflichen Charakter der ersten Wendung und den erkennbaren Anklang der zweiten an die Schöpfungssprache, ohne beide künstlich anzugleichen.
- source_word: footstool
  choice: Schemel
  rationale: Eine natürliche, würdige deutsche Entsprechung, die das kosmische Bild der Erde als Fußschemel erhält.
- source_word: androgyne
  choice: androgynes Wesen
  rationale: Macht verständlich, dass ein zweigeschlechtliches Wesen gemeint ist, ohne durch ein grammatisches Geschlecht eine unnötige Festlegung einzutragen.
- source_word: cooing sound
  choice: gurrender Laut
  rationale: Gibt den nichtsprachlichen, stimmhaften Laut anschaulich wieder; »Gurren« ist im modernen Deutsch verständlich.
- source_word: Eee-a-o / Eloai / Astaphaios
  choice: Iii-a-o / Eloai / Astaphaios
  rationale: Die Namen werden eng am überlieferten englischen Zeugen wiedergegeben; beim ersten Namen wird die Lautfolge deutsch lesbar als »Iii« dargestellt.
theological_decisions:
- issue: Schöpferische Rede des Archons
  choice: »durch sprachliche Äußerung«
  alternative: »durch das Wort«
  rationale: Die neutralere Formulierung bewahrt die Eigenart des Textes und vermeidet eine ungerechtfertigte Identifikation mit dem Logos oder mit Gottes Schöpferwort in anderen Traditionen.
- issue: Bewegung des Geistes über den Wassern
  choice: als Anspielung erkennbar lassen, aber nicht harmonisieren
  alternative: Formulierung ausdrücklich an Genesis 1,2 angleichen
  rationale: »über den Wassern hin und her bewegte« folgt dem vorliegenden Zeugen und erhält zugleich die Spannung zur biblischen Schöpfungssprache.
- issue: Natur des zuerst erschaffenen Wesens
  choice: »androgynes Wesen« und anschließend sächliche Pronomen
  alternative: »einen Androgyn« mit ausschließlich männlichen Pronomen
  rationale: Die Zweigeschlechtlichkeit wird ausdrücklich bewahrt; die spätere Bezeichnung der Geschöpfe als Söhne bleibt dennoch unverändert stehen.
- issue: Selbsteinschätzung des Archons
  choice: »bildete er sich ein«
  alternative: »dachte er«
  rationale: Die Wendung spiegelt die im Kontext erkennbare Fehlannahme, ohne zusätzliche dogmatische Erklärungen einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenen Fachbegriffen und Schöpfungsanklängen. Die Auslassungszeichen […] und [ ] bleiben als unterschiedliche Lückenmarkierungen erhalten. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist die Fassung als quellennaher, vorläufiger Publikationsentwurf auf Grundlage des angegebenen gemeinfreien englischen Zeugen zu behandeln.
