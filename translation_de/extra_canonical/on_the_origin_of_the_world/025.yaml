  - marker: b
    text: „Zu einem Ganzen“ ist ergänzt beziehungsweise textkritisch unsicher.
    reason: Die Vorlage setzt „(as) one“ in Rekonstruktionsklammern.
  - marker: c
    text: Der letzte Vergleichssatz ist in der überlieferten beziehungsweise zugrunde gelegten Fassung beschädigt und kann auch anders gegliedert werden.
    reason: Die englische Vorlage endet hier syntaktisch auffällig („before they had“), sodass keine sichere Glättung möglich ist.
lexical_decisions:
- source_word: aeon
  choice: Äon
  rationale: Der in spätantiken kosmologischen Texten etablierte Fachbegriff wahrt die mögliche Bedeutung sowohl eines Zeitalters als auch einer überweltlichen Sphäre beziehungsweise Wesenheit.
- source_word: archons
  choice: Archonten
  rationale: Die transliterierte Fachbezeichnung vermeidet eine vorschnelle Gleichsetzung mit gewöhnlichen politischen Herrschern und entspricht dem kosmologischen Kontext.
- source_word: governance
  choice: Ordnung
  rationale: Im Zusammenhang mit dem Aufbau der Welt bezeichnet der Ausdruck ihre geregelte Verwaltung beziehungsweise Lenkung; „Ordnung“ klingt im Deutschen natürlich und lässt den Umfang offen.
- source_word: deathless
  choice: todlos
  rationale: „Todlos“ bewahrt die wiederkehrende sprachliche Gegenüberstellung zum Reich des Todes; „unsterblich“ wäre idiomatischer, würde aber die Wortverbindung abschwächen.
- source_word: indestructibility
  choice: Unvergänglichkeit
  rationale: Der Ausdruck bezeichnet hier den unzerstörbaren höheren Bereich oder dessen Ordnung; „Unvergänglichkeit“ ist würdig und theologisch weniger mechanisch als „Unzerstörbarkeit“.
- source_word: authorities
  choice: Mächte
  rationale: „Mächte“ gibt die kosmischen Gewalten natürlich wieder und unterscheidet die wechselnde Bezeichnung von „Archonten“, ohne eine Identitätsfrage dogmatisch aufzulösen.
- source_word: church
  choice: Gemeinde
  rationale: „Gemeinde“ bezeichnet die versammelte Gemeinschaft, ohne unnötig die institutionellen Vorstellungen des modernen Wortes „Kirche“ einzutragen.
- source_word: races
  choice: Geschlechter
  rationale: „Geschlechter“ gibt Gruppen gemeinsamer Herkunft in gehobenem, aber verständlichem Deutsch wieder; „Rassen“ wäre modern missverständlich.
- source_word: censure / condemn
  choice: überführen
  rationale: „Überführen“ hält den Sinn des Bloßstellens, Zurechtweisens oder Verurteilens offen und passt an beiden Stellen zur offenbarenden Funktion der höheren Wesen.
- source_word: repose
  choice: Erquickung
  rationale: Neben „Ruhe“ wird ein zweiter, verwandter Begriff benötigt; „Erquickung“ wahrt die feierliche Nuance, ohne beide Wörter schlicht zu verdoppeln.
theological_decisions:
- issue: „faithfulness to the unseen aeon“
  choice: „Treue zum unsichtbaren Äon“
  alternative: „Glaube an den unsichtbaren Äon“ oder „die Glaubwürdigkeit des unsichtbaren Äons“
  rationale: Die syntaktische und semantische Mehrdeutigkeit des englischen Zeugnisses wird nicht in eine bestimmte Glaubenslehre aufgelöst.
- issue: Mittel, durch das die Archonten zunichtegemacht werden
  choice: „durch die von ihnen geformten Geschöpfe“
  alternative: „mithilfe ihrer eigenen Gebilde“
  rationale: Die paradoxe Aussage, dass die Werke der Archonten gegen sie eingesetzt werden, bleibt ausdrücklich erhalten.
- issue: Identität des einzelnen Engels
  choice: Keine Identifizierung; „ein einziger Engel“
  alternative: Identifizierung mit dem Retter oder einer bestimmten Offenbarergestalt
  rationale: Der Abschnitt nennt keine eindeutige Identität; eine dogmatische Ergänzung wäre unbegründet.
- issue: Vereinigung des Samens der Mächte mit dem der Seligen
  choice: Wörtlich-bildhafte Wiedergabe ohne Erklärung des Vorgangs
  alternative: Explizite Deutung als sexuelle Vermischung oder geistige Verunreinigung
  rationale: Der Text verbindet Abstammungs-, Körper- und kosmologische Bildsprache; die Übersetzung bewahrt diese Spannung.
- issue: „made all of them [(as) one]“
  choice: „machte sie alle [zu einem Ganzen]“
  alternative: „schuf sie alle als einen“
  rationale: Die rekonstruierte Einheit wird verständlich wiedergegeben, bleibt aber durch Klammern als textkritisch unsicher gekennzeichnet.
- issue: Königlose vierte Gruppe
  choice: „königslos und vollkommen“
  alternative: „ohne Herrscher und vollkommen“
  rationale: „Königslos“ bewahrt die markante Gegenüberstellung zu den Königen des achten Himmels, ohne daraus moderne politische Vorstellungen abzuleiten.
- issue: Heilige Stätte des Vaters
  choice: „Heilige Stätte“
  alternative: „Heiligtum“
  rationale: Die allgemeinere Formulierung lässt offen, ob ein Tempelheiligtum, ein himmlischer Ort oder eine überweltliche Sphäre gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit behutsam beibehaltenen kosmologischen Fachbegriffen. Eindeutige Beschädigungen werden durch […] angezeigt; rekonstruierte Bestandteile bleiben in eckigen Klammern. Die nackte Manuskriptseitenzahl wurde nicht in den Fließtext übernommen. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist der Entwurf ausdrücklich am bereitgestellten gemeinfreien englischen Zeugnis ausgerichtet; zweifelhafte Stellen wurden nicht stillschweigend harmonisiert.
