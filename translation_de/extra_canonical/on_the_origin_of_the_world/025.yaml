  text: 'Now we will move on to consider our world, so that we can accurately complete the description of its structure and governance. Then it will become clear how faithfulness to the unseen aeon was found, which has been revealed from creation until the consummation of the age.


    Consequently, I come to the main themes concerning the deathless man. I will discuss the beings that belong to him, showing how they came to be here.


    When a multitude of humans had come into existence through descent from [the Adam who] [] had been made, even out of matter, and when the world had already become fully populated, the archons were its masters; that is, they kept it enslaved through ignorance. And why? For the following reason: The deathless father knows that a deficiency in truth came into existence among the aeons and their universe. When he desired to bring the archons of perdition to nothing by means of the creatures they had shaped, he sent your likenesses down into the world of perdition—that is, the blessed little spirits of innocence. They are not strangers to knowledge, because all knowledge dwells in a single angel who appeared to them. He does not lack power in the presence of the father, even for <him> to give them knowledge. When they appear in the world of perdition, they immediately reveal the structure of indestructibility as a condemnation of the archons and their hosts.


    In this way, when the blessed beings appeared in forms shaped by the authorities, they were envied. Out of envy, the authorities joined their seed with the seed of the blessed beings, wishing to defile them. But they were unable to do so.


    Then, when the blessed beings appeared in a radiant form, they appeared in several ways. They came from different aeons, revealing their knowledge to the church made visible through the shaped forms of perdition. She [16] was found to contain every kind of seed because the seed of the authorities had been joined [with her].


    The savior then made all of them [(as) one], and their spirits are clearly superior, being blessed [] and chosen in various ways. There are also several other beings who have no king and are superior to all those who existed before them.


    Therefore, four races exist. Three belong to the kings of the eighth heaven, but the fourth race is kingless and perfect, and it is the highest of them all. For these are the ones who will enter the Holy Place of their father, and they will obtain rest together with repose, eternal and ineffable glory, and infinite joy.


    What is more, they are kings within the realm of death, since they are deathless. They will condemn the gods of Chaos and their hosts.'
translation:
  language: de
  text: 'Nun wollen wir uns der Betrachtung unserer Welt zuwenden, damit wir die Beschreibung ihres Aufbaus und ihrer Ordnung genau zu Ende führen können. Dann wird deutlich werden, wie die Treue zum unsichtbaren Äon gefunden wurde, die von der Schöpfung bis zur Vollendung des Zeitalters offenbar geworden ist.


    Damit komme ich zu den Hauptthemen über den todlosen Menschen. Ich werde die Wesen behandeln, die zu ihm gehören, und zeigen, wie sie hierhergekommen sind.


    Als eine Vielzahl von Menschen durch die Abstammung von [dem Adam, der] […] selbst aus Materie geschaffen worden war, ins Dasein gekommen und die Welt bereits ganz bevölkert war, waren die Archonten ihre Herren; das heißt, sie hielten sie durch Unwissenheit versklavt. Und warum? Aus folgendem Grund: Der todlose Vater weiß, dass unter den Äonen und in ihrem All ein Mangel an Wahrheit entstanden ist. Als er die Archonten des Verderbens durch die von ihnen geformten Geschöpfe zunichtemachen wollte, sandte er eure Ebenbilder in die Welt des Verderbens hinab – das heißt, die seligen kleinen Geister der Unschuld. Erkenntnis ist ihnen nicht fremd, denn alle Erkenntnis wohnt in einem einzigen Engel, der ihnen erschien. Vor dem Vater fehlt es ihm nicht an Macht, ihnen Erkenntnis zu geben.[a] Wenn sie in der Welt des Verderbens erscheinen, offenbaren sie sogleich den Aufbau der Unvergänglichkeit und überführen damit die Archonten und ihre Heerscharen.


    Als auf diese Weise die seligen Wesen in Gestalten erschienen, welche die Mächte geformt hatten, wurden sie beneidet. Aus Neid verbanden die Mächte ihren Samen mit dem ihren, weil sie sie beflecken wollten. Doch dazu waren sie nicht imstande.


    Als dann die seligen Wesen in einer leuchtenden Gestalt erschienen, zeigten sie sich auf verschiedene Weise. Sie stammten aus unterschiedlichen Äonen und offenbarten ihre Erkenntnis der Gemeinde, die durch die geformten Gestalten des Verderbens sichtbar geworden war. In ihr fand sich jede Art von Samen, weil der Same der Mächte [mit ihr] verbunden worden war.


    Dann machte der Retter sie alle [zu einem Ganzen],[b] und ihre Geister sind offenkundig höherstehend: Sie sind selig […] und auf verschiedene Weise erwählt. Daneben gibt es mehrere andere Wesen, die keinen König haben und höher stehen als alle, die vor ihnen da waren.[c]


    Es gibt also vier Geschlechter. Drei gehören zu den Königen des achten Himmels; das vierte Geschlecht aber ist königslos und vollkommen und steht über allen. Denn sie sind es, die in die Heilige Stätte ihres Vaters eingehen werden. Sie werden Ruhe und Erquickung erlangen, ewige, unaussprechliche Herrlichkeit und grenzenlose Freude.


    Mehr noch: Im Reich des Todes sind sie Könige, weil sie todlos sind. Sie werden die Götter des Chaos und deren Heerscharen überführen.'
