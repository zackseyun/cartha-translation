  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. „als Zurechtweisung gegen“ und „deutlich überlegen“ sind idiomatischer und geben die jeweiligen Aussagen präziser wieder. Die absichtlich beschädigte Adam-Stelle bleibt notwendig sperrig, da die Leerstelle nicht unkenntlich gemacht werden darf.
  terminology: Äon, Archonten, Mächte, todlos, Unvergänglichkeit, Gemeinde und königslos sind sachgerecht und konsistent. Für die beiden nicht völlig synonymen Verben werden kontextgerecht „als Zurechtweisung gegen“ und „verurteilen“ verwendet; damit wird weder eine technische juristische Bedeutung noch eine dogmatische Deutung eingeführt.
  issues:
  - severity: medium
    issue: „überführen“ gibt „as a censure“ nicht angemessen wieder.
    rationale: Das Zeugnis bezeichnet die Struktur der Unvergänglichkeit als eine gegen Archonten und Heerscharen gerichtete Rüge, Anklage oder Verurteilung. „Überführen“ verschiebt den Sinn zu einer Feststellung von Schuld und verwischt die prädikative Funktion von „as a censure“.
  - severity: low
    issue: Die leere Rekonstruktionsstelle „[]“ wurde zu „[…]“ verändert.
    rationale: Das Auslassungszeichen suggeriert fehlenden fortlaufenden Wortlaut; „[]“ ist dagegen das ausdrücklich überlieferte textkritische Signal und sollte beibehalten werden.
  - severity: low
    issue: „höherstehend“ ist für „clearly superior“ weniger direkt als „deutlich überlegen“.
    rationale: „Deutlich überlegen“ bildet sowohl die Explizitheit als auch die Vergleichsaussage natürlich und ohne Bedeutungsgewinn ab.
