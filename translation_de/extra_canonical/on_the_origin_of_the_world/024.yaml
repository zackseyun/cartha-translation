review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung folgt dem vorliegenden englischen Zeugen insgesamt eng und bewahrt zentrale Begriffe sowie die ausdrücklich bezeugte Mehrdeutigkeit der Schlussklausel. Eine sinnrelevante Abweichung liegt jedoch im vorletzten Absatz vor: Der Zeuge sagt, die Welt sei „in Verwirrung, Unwissenheit und Benommenheit“ ins Dasein gekommen; „war ... geraten“ macht daraus ein späteres Hineingeraten.'
  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. Die Aufzählung nach „lehrten“ bleibt notwendigerweise etwas hart, da die Vorlage selbst ungewöhnlich formuliert ist. „Benommenheit“ gibt den Zustand von „stupor“ idiomatischer und weniger körperlich-statisch als „Erstarrung“ wieder.
  terminology: „Archonten“, „Schicksal“, „Vollendung des Zeitalters“ und „der wahre Mensch“ sind angemessen. Die Erläuterungen vermeiden unbelegte konfessionelle Identifizierungen. Die Fußnote zur Schlussklausel ist wichtig und soll erhalten bleiben.
  issues:
  - severity: medium
    issue: „So war die Welt in Verwirrung, Unwissenheit und Erstarrung geraten.“
    rationale: Dies übersetzt die Aussage über das Entstehen der Welt als Zustandswechsel der bereits bestehenden Welt. Der englische Zeuge lautet „the world came to exist in confusion, in ignorance, and in a stupor“. Eine Formulierung mit „entstand“ bewahrt die kosmogonische Aussage.
  - severity: low
    issue: „Erstarrung“ für „stupor“
    rationale: „Erstarrung“ kann primär eine körperliche Starre nahelegen. „Benommenheit“ trifft hier natürlicher den geistig-verwirrten bzw. betäubten Zustand, ohne die Aussage zu spezifizieren.
  revised_text: 'Kehren wir zu den Archonten[a] zurück, von denen wir zuvor gesprochen haben, damit wir sie näher erklären können.


    Als die sieben Archonten aus ihren Himmeln auf die Erde hinabgestürzt worden waren, schufen sie sich zahlreiche dämonische Engel, die ihnen dienen sollten. Diese lehrten die Menschheit vielerlei Irrtum, Magie, Zaubertränke, Götzenverehrung und Blutvergießen; ebenso Altäre, Tempel, Opfer und Trankopfer für alle irdischen Dämonen. Dabei wirkten sie mit dem Schicksal zusammen, das aus der Übereinkunft zwischen den Göttern der Ungerechtigkeit und der Gerechtigkeit hervorgegangen war. So geriet die Welt, nachdem sie entstanden war, auf Abwege und blieb fortwährend in Verwirrung; denn alle Menschen auf der Erde verehrten Dämonen – von der Schöpfung bis zur Vollendung des Zeitalters: sowohl die Engel der Gerechtigkeit als auch die Menschen der Ungerechtigkeit.[b]


    So entstand die Welt in Verwirrung, Unwissenheit und Benommenheit. Alle waren auf Abwege geraten, bis der wahre Mensch erschien.[c]


    Damit sei zu diesem Thema genug gesagt.'
