base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/024.yaml
  text: 'Let us return to the archons we discussed earlier, so that we can explain them.


    When the seven archons had been thrown down from their heavens to the earth, they made many demonic angels to serve them. These angels taught humanity various kinds of error, magic, potions, idol worship, bloodshed, altars, temples, sacrifices, and drink offerings to all the earthly demons. They worked together with fate, who came into being through the agreement between the gods of injustice and justice. In this way, once the world had come into being, it went astray and remained continually confused, because all people on earth worshiped demons from the creation to the consummation of the age, both the angels of righteousness and the humans of unrighteousness.


    In this way, the world came to exist in confusion, ignorance, and a stupor. They had all gone astray until the true man appeared.


    Let this be enough concerning the subject.'
translation:
  language: de
  text: 'Kehren wir zu den Archonten[a] zurück, von denen wir zuvor gesprochen haben, damit wir sie näher erklären können.


    Als die sieben Archonten aus ihren Himmeln auf die Erde hinabgestürzt worden waren, schufen sie sich zahlreiche dämonische Engel, die ihnen dienen sollten. Diese lehrten die Menschheit vielerlei Irrtum, Magie, Zaubertränke, Götzenverehrung und Blutvergießen; ebenso Altäre, Tempel, Opfer und Trankopfer für alle irdischen Dämonen. Dabei wirkten sie mit dem Schicksal zusammen, das aus der Übereinkunft zwischen den Göttern der Ungerechtigkeit und der Gerechtigkeit hervorgegangen war. So geriet die Welt, nachdem sie entstanden war, auf Abwege und blieb fortwährend in Verwirrung; denn alle Menschen auf der Erde verehrten Dämonen – von der Schöpfung bis zur Vollendung des Zeitalters: sowohl die Engel der Gerechtigkeit als auch die Menschen der Ungerechtigkeit.[b]


    So war die Welt in Verwirrung, Unwissenheit und Erstarrung geraten. Alle waren auf Abwege geraten, bis der wahre Mensch erschien.[c]


    Damit sei zu diesem Thema genug gesagt.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Archonten“ bedeutet wörtlich „Herrscher“ oder „Herrschermächte“ und bezeichnet hier kosmische Mächte.
    reason: Der technische Begriff ist vielen heutigen Leserinnen und Lesern nicht geläufig.
  - marker: b
    text: Der Satzbau der zugrunde gelegten Übersetzungsüberlieferung ist hier mehrdeutig. Es bleibt offen, wie genau „die Engel der Gerechtigkeit“ und „die Menschen der Ungerechtigkeit“ zur Dämonenverehrung und zu den zuvor genannten Gruppen gehören.
    reason: Die echte grammatische und theologische Unbestimmtheit darf nicht stillschweigend aufgelöst werden.
  - marker: c
    text: Der Abschnitt erklärt nicht ausdrücklich, wen er mit dem „wahren Menschen“ meint.
    reason: Verhindert eine unbelegte Identifizierung mit einer bestimmten Gestalt.
lexical_decisions:
- source_word: archons
  choice: Archonten
  rationale: Der in antiken gnostischen Texten etablierte Fachbegriff bleibt erhalten; eine bloße Wiedergabe als „Herrscher“ würde seine kosmologische Funktion abschwächen.
- source_word: potions
  choice: Zaubertränke
  rationale: Im Zusammenhang mit Magie bezeichnet „Zaubertränke“ die gemeinte okkulte Praxis natürlicher und verständlicher als das unbestimmte „Tränke“.
- source_word: fate
  choice: das Schicksal
  rationale: Das Schicksal wird im Text als entstandene, handelnde kosmische Macht personifiziert; das grammatische Neutrum des deutschen Wortes wird beibehalten.
- source_word: consummation (of the age)
  choice: Vollendung des Zeitalters
  rationale: Die eschatologische Zeitangabe wird ausdrücklich wiedergegeben, ohne sie konfessionell als „Weltende“ auszudeuten.
- source_word: stupor
  choice: Erstarrung
  rationale: Das Wort vermittelt einen Zustand geistiger Betäubung und Handlungsunfähigkeit in würdiger, verständlicher Sprache.
- source_word: true man
  choice: der wahre Mensch
  rationale: Die wörtlich-konzeptionelle Formulierung bleibt erhalten; „Mensch“ wahrt zugleich die mögliche umfassende anthropologische Bedeutung.
theological_decisions:
- issue: Verhältnis der Engel der Gerechtigkeit und Menschen der Ungerechtigkeit zur vorausgehenden Aussage
  choice: Die beiden Gruppen bleiben in einer syntaktisch offenen Nachstellung stehen.
  alternative: Die Wendung ausdrücklich auf die verehrten Dämonen oder auf die Verehrenden beziehen.
  rationale: Der zugrunde gelegte englische Zeuge bezeichnet die Schlusskonstruktion als grammatisch mehrdeutig. Eine eindeutige Zuordnung würde die überlieferte Spannung unbelegt auflösen.
- issue: Personifikation des Schicksals
  choice: Das Schicksal wird als hervorgegangene und mitwirkende kosmische Macht dargestellt.
  alternative: „Schicksal“ lediglich als unpersönlichen Lauf der Ereignisse verstehen.
  rationale: Die Relativkonstruktion des Zeugen schreibt dem Schicksal Entstehung und Zusammenarbeit zu.
- issue: Identität des „wahren Menschen“
  choice: Keine Identifizierung oder christologische Präzisierung im Haupttext.
  alternative: Den Ausdruck ausdrücklich auf Christus, Adam oder eine andere Gestalt beziehen.
  rationale: Der vorliegende Abschnitt nennt keine solche Identität; die Offenheit des Titels muss erhalten bleiben.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Technische kosmologische Begriffe werden bewahrt und knapp erläutert. Die Vorlage ist ein gemeinfreier englischer Zeuge; eine direkte Prüfung des koptischen Textes steht noch aus. Deshalb wurden besonders die mehrdeutige Schlussklausel und konzeptionelle Titel nicht stärker präzisiert, als es die verfügbare Evidenz erlaubt.
