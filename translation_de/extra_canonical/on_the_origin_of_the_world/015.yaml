    reason: Kennzeichnet eine notwendige, aber vorsichtige syntaktische Deutung.
  - marker: f
    text: 'Wörtlich dem Zeugen entsprechend: ein »androgyner« Mensch, also eine Gestalt mit weiblichen und männlichen Merkmalen.'
    reason: Erläutert die gewählte allgemeinverständliche Wiedergabe.
