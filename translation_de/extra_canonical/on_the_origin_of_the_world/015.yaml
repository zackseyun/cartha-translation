  - marker: h
    text: Der Wortlaut dieses Satzes ist unsicher und seine Bezüge bleiben unklar. Insbesondere ist nicht eindeutig, wer gestaltet hat und welche erschaffenen Wesen gemeint sind.
    reason: Verhindert, dass die schwierige Überlieferung durch stille Harmonisierung scheinbar eindeutig wird.
lexical_decisions:
- source_word: authorities
  choice: Mächte
  rationale: Gibt den kosmologischen Sinn der herrschenden Gewalten natürlicher wieder als das moderne verwaltungsbezogene »Autoritäten«.
- source_word: Primal Parent
  choice: Urvater
  rationale: Bewahrt die väterliche Bezeichnung des Zeugen in würdiger, knapper Form; eine geschlechtsneutrale Rückübersetzung wäre ohne koptische Prüfung unsicher.
- source_word: aeon
  choice: Äon
  rationale: Der technische kosmologische Begriff wird beibehalten und nicht auf »Zeitalter« verengt.
- source_word: forethought
  choice: Vorbedacht
  rationale: Bewahrt den personifizierbaren und kosmologischen Charakter des Begriffs; »Plan« wäre stärker deutend.
- source_word: Pistis
  choice: Pistis
  rationale: Der Eigenname bzw. technische Begriff bleibt unübersetzt; eine Gleichsetzung allein mit »Glaube« würde die Figurenbezeichnung verwischen.
- source_word: androgynous human
  choice: zweigeschlechtlicher Mensch
  rationale: Verständliches modernes Deutsch, das die im Text gemeinte Verbindung weiblicher und männlicher Merkmale ausdrückt, ohne sie weiter auszudeuten.
- source_word: Hermaphrodites
  choice: Hermaphrodit
  rationale: Entspricht der griechisch benannten Gestalt; die Form wird als Bezeichnung innerhalb des antiken Textes beibehalten.
- source_word: the Beast
  choice: das Tier
  rationale: Bewahrt die traditionelle und semantisch direkte Wiedergabe, ohne eine bestimmte apokalyptische Identifikation einzutragen.
- source_word: Teacher
  choice: Lehrer
  rationale: Erhält das Leitmotiv der unterweisenden Gestalt und die ausdrückliche Deutung des Textes.
theological_decisions:
- issue: Bezug von »seinem Ebenbild« im Abschnitt über den Vorbedacht der Pistis
  choice: Das Possessivpronomen bleibt mehrdeutig.
  alternative: Explizite Zuordnung zum Adam des Lichts oder zu einer anderen himmlischen Gestalt.
  rationale: Der englische Zeuge lässt den Bezug offen; ohne direkte koptische Prüfung darf die Spannung nicht aufgelöst werden.
- issue: Rolle der Mächte bei der Menschenschöpfung
  choice: Ihre Schöpfung geschieht unwissentlich gegen ihre eigenen Interessen.
  alternative: Sie als souveräne oder letztgültige Schöpfer darstellen.
  rationale: Der Text betont ihre Blindheit und Sophias vorausgehendes Handeln.
- issue: Geschlecht und Funktion der hervorgebrachten Gestalt
  choice: Die wechselnden Bezeichnungen »weiblicher Körper«, »zweigeschlechtlicher Mensch« und »Lehrer« bleiben nebeneinander stehen.
  alternative: Die Gestalt durchgehend einem einzigen Geschlecht zuordnen.
  rationale: Die Spannung gehört zur Kosmologie und Erzählführung des Textes und soll nicht harmonisiert werden.
- issue: Unklarer Schlussabschnitt über »das Tier«
  choice: Die syntaktische und referenzielle Unklarheit wird im Haupttext möglichst bewahrt und in einer Fußnote kenntlich gemacht.
  alternative: Das Tier eindeutig mit einer bekannten Genesisgestalt identifizieren und das Objekt des Irreführens glätten.
  rationale: Der überlieferte englische Zeuge ist hier ausdrücklich unsicher; eine konfessionelle oder narrative Harmonisierung wäre unbegründet.
