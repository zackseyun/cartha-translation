translation:
  language: de
  text: 'Bevor sich Adam des Lichts in das Chaos zurückzog, bemerkten ihn die Mächte. Sie verspotteten den Urvater, weil er sie belogen hatte, als er sagte: »Ich bin es, der Gott ist. Vor mir hat niemand existiert.«


    Als sie zu ihm kamen, fragten sie: »Ist das nicht der Gott, der unser Werk verdorben hat?«


    Er antwortete: »Ja. Wenn ihr verhindern wollt, dass er unser Werk weiterhin verdirbt, dann kommt: Lasst uns einen Menschen aus Erde erschaffen, der uns dient – nach dem Bild unseres Körpers und nach der Ähnlichkeit [a] dieses Wesens. Wenn er sein eigenes Ebenbild sieht, soll er sich darin verlieben. Dann wird er unser Werk nicht mehr verderben. Stattdessen werden wir uns aus denen, die aus dem Licht geboren werden, Diener machen – für die ganze Dauer dieses Äons.«[b]


    Dies alles geschah nach dem Vorbedacht der Pistis,[c] damit der Mensch nach seinem Ebenbild erscheine und sie wegen ihrer gestalteten Form anklage. Ihre gestaltete Form aber wurde zu einem Ort, der das Licht einschloss.


    Daraufhin erlangten die Mächte das Wissen, das sie brauchten, um den Menschen zu erschaffen. Sophia Zoe,[d] die bei Sabaoth wohnt, hatte vorausgesehen, was sie tun würden. Sie verspottete ihren Beschluss, denn sie sind blind. Ohne es zu wissen, erschufen sie ihn gegen ihre eigenen Interessen; sie verstanden nicht, was sie im Begriff waren zu tun.


    Sie kam ihnen zuvor und erschuf zuerst ihren eigenen Menschen. Dieser sollte die von ihnen gestaltete Form darüber unterrichten, wie sie die Mächte hassen und ihnen auf diese Weise entkommen könne.[e]


    Der Lehrer entstand auf folgende Weise: Sophia ließ ein Tröpfchen Licht herabkommen. Es floss auf das Wasser, und sogleich erschien ein zweigeschlechtlicher Mensch.[f] Zuerst formte sie dieses Tröpfchen zu einem weiblichen Körper. Danach gebrauchte sie den Körper und formte ihn nach dem Ebenbild der Mutter, die zuvor erschienen war; innerhalb von zwölf Monaten vollendete sie ihn.


    So war ein zweigeschlechtlicher Mensch entstanden, den die Griechen Hermaphrodit nennen. Seine Mutter nennen die Hebräer Eva des Lebens, das heißt: die weibliche Lehrerin des Lebens. Ihr Kind ist das erschaffene Wesen, das Herr ist. Später nannten die Mächte es [g] »das Tier«, damit es die erschaffenen Wesen, die gestaltet hatten, in die Irre führe.[h] »Das Tier« wird als »der Lehrer« gedeutet, denn es erwies sich als das klügste aller Wesen.'
