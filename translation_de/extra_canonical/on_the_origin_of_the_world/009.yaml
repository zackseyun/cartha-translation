base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/009.yaml
  text: 'After witnessing the likeness of Pistis in the waters, the Primal Parent became deeply sorrowful, especially when he heard her voice. It resembled the first voice that had called to him from the waters. He groaned when he realized that she was the one who had given him a name. He was ashamed of his sin. And when he truly learned that a deathless man of light had existed before him, he became deeply troubled, because he had previously declared to all the gods and their angels, “I am the one who is God. Apart from me, nothing else exists.” He had been afraid that they might discover someone else had existed before him and might denounce him.


    But because he lacked discernment, he laughed at (the possibility of) denunciation and acted rashly. He said, “If [] something existed before I did, let it come forward so that we may see its light.” And immediately, look! Light came out from the eighth heaven above and passed through all the heavens of the earth.'
translation:
  language: de
  text: 'Nachdem der Urvater das Abbild der Pistis in den Wassern gesehen hatte, wurde er von tiefer Trauer erfüllt, besonders als er ihre Stimme hörte. Sie glich jener ersten Stimme, die ihn aus den Wassern gerufen hatte. Er stöhnte auf, als ihm bewusst wurde, dass sie es war, die ihm einen Namen gegeben hatte. Er schämte sich seiner Sünde. Und als er wirklich erkannte, dass schon vor ihm ein unsterblicher Lichtmensch existiert hatte, geriet er in große Unruhe. Denn zuvor hatte er allen Göttern und ihren Engeln verkündet: »Ich bin es, der Gott ist. Außer mir gibt es nichts anderes.« Er hatte nämlich befürchtet, sie könnten entdecken, dass schon vor ihm jemand existiert hatte, und ihn anklagen.


    Doch weil es ihm an Einsicht fehlte, lachte er über die Möglichkeit einer Anklage und handelte unbesonnen. Er sagte: »Wenn [a] etwas vor mir existiert hat, soll es hervortreten, damit wir sein Licht sehen.« Und sogleich – siehe! – trat Licht aus dem achten Himmel droben hervor und durchzog alle Himmel der Erde.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die leeren Klammern im zugrunde liegenden Übersetzungszeugen kennzeichnen eine Textlücke oder eine unsichere Ergänzungsstelle; der fehlende Wortlaut ist nicht erhalten beziehungsweise noch zu prüfen.
    reason: Bewahrt das im Zeugen sichtbare Signal für beschädigten oder unsicher rekonstruierten Text.
  - marker: b
    text: »Himmel der Erde« ist eine ungewöhnliche kosmologische Formulierung des Zeugen. Gemeint sein können die zur irdischen Welt gehörenden Himmelssphären; die genaue Bedeutung bleibt offen.
    reason: Macht die echte semantische Unsicherheit kenntlich, ohne sie im Haupttext aufzulösen.
lexical_decisions:
- source_word: Primal Parent
  choice: Urvater
  rationale: Die im englischen Zeugen geschlechtsneutrale Bezeichnung bezeichnet hier Yaldabaoth, der im Kontext männlich pronominalisiert wird. »Urvater« ist natürlich und würdevoll; eine direkte Prüfung des koptischen Titels steht noch aus.
- source_word: likeness of Pistis
  choice: Abbild der Pistis
  rationale: »Abbild« bewahrt den Unterschied zwischen Pistis selbst und ihrer im Wasser wahrgenommenen Erscheinung. Der Eigenname Pistis bleibt unübersetzt.
- source_word: deathless man of light
  choice: unsterblicher Lichtmensch
  rationale: Die kompakte Zusammensetzung erhält den möglicherweise titularen Charakter und vermeidet, »Mensch aus Licht« als bloße Stoffangabe festzulegen.
- source_word: denounce
  choice: anklagen
  rationale: »Anklagen« gibt den öffentlichen, gegen ihn gerichteten Sinn wieder, ohne die Art der Beschuldigung näher zu bestimmen.
- source_word: eighth heaven
  choice: achter Himmel
  rationale: Die kosmologische Zählung wird formal bewahrt und nicht durch eine deutende Bezeichnung wie »Ogdoad« ersetzt.
- source_word: heavens of the earth
  choice: Himmel der Erde
  rationale: Die ungewöhnliche kosmologische Wendung bleibt bewusst erhalten, statt sie zu »irdische Himmel« oder »Himmelssphären« zu glätten.
theological_decisions:
- issue: Yaldabaoths Gottesanspruch
  choice: »Ich bin es, der Gott ist. Außer mir gibt es nichts anderes.«
  alternative: »Ich bin Gott, und außer mir existiert nichts.«
  rationale: Die betonte Identitätsform des Zeugen wird gewahrt. Der Text stellt die Aussage in den Mund der Figur; die Übersetzung bestätigt oder widerlegt sie nicht außerhalb der Erzählperspektive.
- issue: Vorexistenz des Lichtmenschen
  choice: »dass schon vor ihm ein unsterblicher Lichtmensch existiert hatte«
  alternative: »dass der unsterbliche Mensch des Lichts vor ihm gewesen war«
  rationale: Die zeitliche Vorexistenz wird deutlich wiedergegeben, während Identität und ontologischer Status der Gestalt nicht über den Zeugen hinaus erklärt werden.
- issue: Sünde des Urvaters
  choice: »Er schämte sich seiner Sünde.«
  alternative: »Er schämte sich wegen seines Fehltritts.«
  rationale: »Sünde« entspricht dem überlieferten englischen Zeugen und bewahrt das religiös-moralische Gewicht, ohne die genaue Sünde interpretierend zu benennen.
- issue: Erscheinen des Lichts
  choice: »trat Licht ... hervor und durchzog alle Himmel der Erde«
  alternative: »kam Licht ... hervor und ging durch alle Himmel der Erde«
  rationale: Die aktive, kosmische Bewegung des Lichts wird idiomatisch ausgedrückt, ohne festzulegen, ob das Licht eine Person, Kraft oder Erscheinung ist.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, erzählerischem Register. Kurze bis mittellange Sätze verbessern die Verständlichkeit, ohne Wiederholungen und kosmologische Spannungen zu beseitigen. »Siehe!« bewahrt den markanten Ausruf. Da die direkte Prüfung des koptischen Textes noch aussteht, sind insbesondere »Urvater«, »Anklage« und »Himmel der Erde« als vorläufige, zeugengebundene Entscheidungen zu verstehen.
