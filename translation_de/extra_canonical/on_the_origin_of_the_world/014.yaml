  source_fidelity: Der Entwurf folgt dem bereitgestellten englischen Textzeugen eng und bewahrt dessen kosmologische Terminologie sowie seine Mehrdeutigkeiten. Die einleitenden eckigen Klammern bleiben erhalten. Besonders angemessen sind die Beibehaltung von Sophia, Pistis und Äon sowie die nicht interpretierende Wiedergabe von „Armut“. Die Aussage, die sechs Äonen und ihre Schmuckwerke seien den Himmeln des Chaos „siebenfach überlegen“, entspricht dem maßgeblichen Zeugen („seven times superior“), auch wenn die englische POB-Brücke hier lediglich „greater“ hat.
  naturalness: Das Deutsch ist durchgehend verständlich, modernes Standarddeutsch und dem würdig-kosmologischen Register angemessen. Formulierungen wie „Zeitzeichen“, „unermesslicher Äon“, „Schmuckwerke“ und „innerhalb der Unendlichkeit“ bewahren die bewusst fremdartige technische Sprache des Textes, ohne ungrammatisch oder unnötig archaisch zu wirken.
  terminology: 'Die Terminologie ist konsistent: Sophia und Pistis bleiben Eigennamen; „Äon“ wahrt den technischen Sinn; „Armut“ bewahrt die mögliche Personifikation; „Chaos“ und „Hieralias“ sind stabil wiedergegeben. „Schmuckwerke“ ist für „adornments“ eine vertretbare, kontexttreue Wahl und vermeidet eine dogmatisch oder kosmologisch enger festlegende Ausdeutung.'
