base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/014.yaml
  text: '[] As she desired, Sophia, who lived in the lower heaven, received authority from Pistis. She formed great shining bodies and every star, and she placed them in the sky to shine on the earth and to determine signs of time, seasons, years, months, days, nights, minutes, and so on. In this way, the whole expanse of the sky was adorned.


    Now, when Adam of Light desired to enter his light, namely, the eighth heaven, he could not do so because of the poverty that had mingled with his light. Then he created an immense aeon for himself. Within that aeon he created six aeons and their adornments, six in number, which were seven times greater than the heavens of Chaos and their adornments.


    Now all these aeons and their adornments exist within the infinity that lies between the eighth heaven and the Chaos beneath it. They are counted together with the universe that belongs to poverty.


    If you wish to learn their structure, you will find it written in the Seventh World of the Prophet Hieralias.'
translation:
  language: de
  text: '[] Wie sie es wünschte, erhielt Sophia, die im unteren Himmel wohnte, Vollmacht von Pistis. Sie formte große leuchtende Himmelskörper und alle Sterne und setzte sie an den Himmel, damit sie auf die Erde leuchteten und Zeitzeichen, Jahreszeiten, Jahre, Monate, Tage, Nächte, Minuten und so weiter bestimmten. So wurde die ganze Weite des Himmels geschmückt.


    Als nun Adam des Lichts den Wunsch fasste, in sein Licht, nämlich den achten Himmel, einzugehen, konnte er es nicht, weil sich die Armut mit seinem Licht vermischt hatte. Da erschuf er für sich einen unermesslichen Äon. Innerhalb dieses Äons erschuf er sechs Äonen samt ihren Schmuckwerken, sechs an der Zahl, die den Himmeln des Chaos und ihren Schmuckwerken siebenfach überlegen waren.


    Alle diese Äonen und ihre Schmuckwerke bestehen nun innerhalb der Unendlichkeit, die zwischen dem achten Himmel und dem Chaos unter ihm liegt. Sie werden zusammen mit dem Weltall gerechnet, das zur Armut gehört.


    Wenn du ihren Aufbau kennenlernen willst, findest du ihn in der »Siebten Welt« des Propheten Hieralias beschrieben.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: Sophia
  choice: Sophia
  rationale: Der griechisch-koptisch tradierte Eigenname beziehungsweise personifizierte Begriff bleibt erhalten; eine Wiedergabe als »Weisheit« könnte die Gestalt vorschnell zum bloßen Abstraktum machen.
- source_word: Pistis
  choice: Pistis
  rationale: Der Name bleibt wie bei Sophia transliteriert; »Glaube« oder »Treue« würde eine im Text als handelnde Gestalt auftretende Größe unnötig festlegen.
- source_word: large shining bodies
  choice: große leuchtende Himmelskörper
  rationale: »Himmelskörper« bezeichnet im Zusammenhang mit Sternen natürlich und verständlich die geschaffenen Leuchtkörper.
- source_word: temporal signs
  choice: Zeitzeichen
  rationale: Die kompakte Form wahrt die Verbindung von Zeichen und Zeiteinteilung, ohne sie ausschließlich als Kalenderzeichen auszulegen.
- source_word: aeon
  choice: Äon
  rationale: Der technische kosmologische Begriff wird bewahrt; »Zeitalter« wäre hier irreführend, da die Äonen räumlich-kosmisch strukturiert erscheinen.
- source_word: adornments
  choice: Schmuckwerke
  rationale: Die ungewöhnliche kosmologische Ausdrucksweise bleibt erkennbar und wird nicht durch eine präzisierende Deutung wie »Sternenwelten« ersetzt.
- source_word: poverty
  choice: Armut
  rationale: Die wörtliche und möglicherweise personifizierte kosmologische Bezeichnung bleibt erhalten, statt durch eine erklärende Deutung ersetzt zu werden.
- source_word: infinity
  choice: Unendlichkeit
  rationale: Bewahrt den abstrakten kosmologischen Ausdruck und seine mögliche räumliche Funktion.
- source_word: structure
  choice: Aufbau
  rationale: Natürliches modernes Deutsch für die Anordnung beziehungsweise Beschaffenheit der genannten Äonen.
theological_decisions:
- issue: Personen- oder Begriffscharakter von Sophia, Pistis und Armut
  choice: Sophia und Pistis werden als Namen beibehalten; »Armut« wird wörtlich wiedergegeben.
  alternative: Alle drei Begriffe semantisch als »Weisheit«, »Glaube« und »Mangel« übersetzen.
  rationale: Die vorliegende kosmologische Erzählung lässt Personifikation und abstrakte Bedeutung ineinandergreifen. Die Übersetzung soll diese Spannung nicht einseitig auflösen.
- issue: Bedeutung von »his light« bei Adam des Lichts
  choice: »sein Licht« bleibt erhalten und wird anschließend durch die textinterne Apposition »nämlich den achten Himmel« erläutert.
  alternative: Direkt »seinen Lichtbereich« oder nur »den achten Himmel« schreiben.
  rationale: Die auffällige Identifikation im Text wird bewahrt, ohne eine zusätzliche ontologische Erklärung einzutragen.
- issue: Vergleich der sechs Äonen mit den Himmeln des Chaos
  choice: »siebenfach überlegen«
  alternative: »siebenmal größer«
  rationale: Der englische Zeuge bietet »superior«, während die POB-Brücke »greater« hat. »Überlegen« bewahrt eher eine qualitative oder rangmäßige Offenheit und legt den Vergleich nicht ausschließlich räumlich aus.
- issue: Zuordnung zum Weltall der Armut
  choice: »Sie werden zusammen mit dem Weltall gerechnet, das zur Armut gehört.«
  alternative: »Sie bilden zusammen das Weltall der Armut.«
  rationale: Die weniger verschmelzende Formulierung bewahrt die im Zeugen erkennbare Zurechnung, ohne Identität oder Zusammensetzung stärker zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit verständlicher Syntax; kosmologische Fachbegriffe und Eigennamen bleiben dort fremdartig, wo der Text selbst technisch oder mehrdeutig ist. Die einleitenden eckigen Klammern werden als überlieferter Hinweis auf eine Lücke oder unsichere Wiederherstellung unverändert bewahrt. Da eine direkte Prüfung des koptischen Ausgangstextes noch aussteht, ist der Entwurf ausdrücklich am angegebenen gemeinfreien englischen Textzeugen orientiert.
