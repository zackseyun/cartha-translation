  text: 'When Sabaoth, the son of Yaldabaoth, heard the voice of Pistis, he sang praises to her. At Pistis’s command, he denounced his father [and mother] [], and he praised her because she had taught them about the deathless man and his light. Then Pistis Sophia pointed her finger and poured some of the light from her own light onto him, as a denunciation of his father. When Sabaoth was illuminated, he received great authority over all the hosts of Chaos. From that day on, he has been called “Lord of Hosts.”


    He despised his father, the Darkness, and his mother, the Abyss. He hated his sister, the thought of the Primal Parent, who had moved back and forth over the waters. Because of his light, all the authorities of Chaos became jealous of him. When they grew troubled, they waged a great war in the seven heavens.


    When Pistis Sophia witnessed the war, she sent seven archangels from her light to Sabaoth. They carried him up to the seventh heaven and stood before him as attendants. She also sent him three additional archangels and established for him the kingdom that is over everyone, so that he could dwell above the twelve gods of Chaos.


    Now, when Sabaoth had received the dwelling place of rest as a reward for his repentance, Pistis also gave him her daughter Zoe, together with great authority, so that she could teach him about everything that exists in the eighth heaven. Because he possessed authority, before anything else he built a palace for himself. It is immense and magnificent, seven times larger than all those that exist in the seven heavens. In front of [] his palace, he created an immense throne that stood on a four-faced chariot called “Cherubin.”


    The Cherubin have eight shapes on each of the four corners: forms of lions, calves, humans, and eagles, so that all the forms total sixty-four. Seven archangels stand in front of it. He [4] is the eighth, and he possesses authority. All the forms total seventy-two. In addition, the seventy-two gods derived their shape from this chariot so that they could rule over the seventy-two languages of the nations. At that throne he also created serpent-like angels called “Seraphin,” who always glorify him.'
translation:
  language: de
  text: 'Als Sabaoth, der Sohn Jaldabaoths, die Stimme der Pistis gehört hatte, sang er ihr Lob. Auf Pistis’ Geheiß sagte er sich von seinem Vater [und seiner Mutter] [a] los, und er pries sie, weil sie sie über den unsterblichen Menschen und sein Licht belehrt hatte. Dann streckte Pistis Sophia ihren Finger aus und goss etwas vom Licht ihres eigenen Lichtes über ihn aus – als Verurteilung seines Vaters. Als Sabaoth erleuchtet worden war, erhielt er große Macht über alle Heerscharen des Chaos. Seit jenem Tag wird er »Herr der Heerscharen« genannt.


    Er verachtete seinen Vater, die Finsternis, und seine Mutter, den Abgrund. Auch hasste er seine Schwester, den Gedanken des Urelternteils, der sich über den Wassern hin und her bewegt hatte. Wegen seines Lichtes wurden alle Mächte des Chaos eifersüchtig auf ihn. Als sie in Aufruhr gerieten, begannen sie einen großen Krieg in den sieben Himmeln.


    Als Pistis Sophia den Krieg sah, sandte sie aus ihrem Licht sieben Erzengel zu Sabaoth. Sie trugen ihn hinauf in den siebten Himmel und traten als Diener vor ihn. Außerdem sandte sie ihm drei weitere Erzengel und richtete für ihn das Königreich ein, das über allen ist, damit er über den zwölf Göttern des Chaos wohnen konnte.


    Als Sabaoth nun als Lohn für seine Umkehr die Ruhestätte in Besitz genommen hatte, gab Pistis ihm auch ihre Tochter Zoe und verlieh ihm große Macht, damit sie ihn über alles belehren konnte, was im achten Himmel existiert. Weil er Macht besaß, errichtete er sich vor allem anderen einen Palast. Er ist gewaltig und prachtvoll, siebenmal größer als alle Paläste in den sieben Himmeln. Vor [b] seinem Palast schuf er einen gewaltigen Thron, der auf einem viergesichtigen Wagen stand, der »Cherubin« genannt wird.


    Die Cherubin haben an jeder der vier Ecken acht Gestalten: Löwengestalten, Kalbsgestalten, Menschengestalten und Adlergestalten, sodass die Gesamtzahl der Gestalten vierundsechzig beträgt. Vor dem Wagen stehen sieben Erzengel. Er selbst ist der Achte und besitzt Macht. So beträgt die Gesamtzahl der Gestalten zweiundsiebzig.[c] Auch empfingen die zweiundsiebzig Götter ihre Gestalt von diesem Wagen, damit sie über die zweiundsiebzig Sprachen der Völker herrschen konnten. Bei jenem Thron schuf er außerdem schlangenartige Engel, die »Seraphin« genannt werden und ihn allezeit verherrlichen.'
