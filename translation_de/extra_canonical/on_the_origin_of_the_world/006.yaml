lexical_decisions:
- source_word: Pistis
  choice: Pistis
  rationale: Der griechische Eigenname beziehungsweise die personifizierte Größe wird transliteriert, statt durch »Glaube« bereits deutend festgelegt zu werden.
- source_word: Pistis Sophia
  choice: Pistis Sophia
  rationale: Die überlieferte Namensform bleibt erhalten; eine Übersetzung als »Glaube-Weisheit« könnte Eigenname und kosmologische Funktion unzulässig auflösen.
- source_word: deathless man
  choice: unsterblicher Mensch
  rationale: Natürliches, würdevolles Deutsch; »todlos« wäre formaler, wirkt hier jedoch unnötig künstlich.
- source_word: hosts of Chaos
  choice: Heerscharen des Chaos
  rationale: Bewahrt das militärisch-kosmische Bild und den Zusammenhang mit dem Titel »Herr der Heerscharen«.
- source_word: authorities
  choice: Mächte
  rationale: Im kosmologischen Kontext bezeichnet der Ausdruck herrschende Wesen; »Behörden« wäre sachlich falsch, »Gewalten« wäre ebenfalls möglich.
- source_word: Primal Parent
  choice: Urelternteil
  rationale: Bewahrt die geschlechtlich nicht eindeutig festgelegte Elternbezeichnung des englischen Zeugnisses und vermeidet eine unbelegte Festlegung auf Urvater oder Urmutter.
- source_word: repentance
  choice: Umkehr
  rationale: Gibt die Änderung von Loyalität und Haltung wieder, ohne den Ausdruck auf ein späteres konfessionelles Bußschema zu verengen.
- source_word: Cherubin / Seraphin
  choice: Cherubin / Seraphin
  rationale: Die im Zeugnis als Namen beziehungsweise Klassenbezeichnungen verwendeten Formen werden bewahrt; sie sind zugleich im Deutschen verständlich.
theological_decisions:
- issue: Sabaoths Verhältnis zu seinem Vater
  choice: »sagte er sich von seinem Vater … los« und »als Verurteilung seines Vaters«
  alternative: »klagte seinen Vater an« beziehungsweise »als Schmähung seines Vaters«
  rationale: Die wiederholte Wendung bezeichnet eine Zurückweisung oder Verurteilung. Die Übersetzung lässt offen, ob ein förmlicher Anklageakt oder ein Bruch der Loyalität gemeint ist.
- issue: Titel »Lord of Hosts«
  choice: »Herr der Heerscharen«
  alternative: »Herr Zebaot«
  rationale: Die transparente Wiedergabe erhält den unmittelbaren Bezug zu den Heerscharen des Chaos. Sie setzt Sabaoth nicht stillschweigend mit einer bestimmten biblischen Verwendung des Titels gleich.
- issue: Pistis’ Licht
  choice: »etwas vom Licht ihres eigenen Lichtes«
  alternative: »einen Teil ihres eigenen Lichtes«
  rationale: Die absichtlich verdichtete Licht-vom-Licht-Formulierung wird bewahrt, ohne ihre mögliche emanationistische Bedeutung auszulegen.
- issue: Zoe
  choice: Eigenname »Zoe«
  alternative: »Leben«
  rationale: Der Text stellt Zoe als Tochter der Pistis vor. Die Transliteration bewahrt ihren Status als Figur, ohne die Wortbedeutung zur alleinigen Deutung zu machen.
- issue: Die zweiundsiebzig Gestalten
  choice: Rechenfolge unverändert wiedergegeben und durch Fußnote als textlich schwierig markiert
  alternative: Die Aussage durch eine harmonisierende Erklärung umformulieren
  rationale: Die Zahlenabfolge ist im vorliegenden Zeugnis nicht vollständig durchsichtig. Eine Korrektur würde die echte Spannung des Textes beseitigen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem erzählerischem Ton. Kosmologische Fachbegriffe und Eigennamen bleiben erkennbar, lange Perioden wurden behutsam gegliedert. Da eine direkte Prüfung des koptischen Textes noch aussteht, ist der Entwurf ausdrücklich am angegebenen öffentlichen englischen Zeugen orientiert; Unsicherheiten und Lücken wurden sichtbar bewahrt.
