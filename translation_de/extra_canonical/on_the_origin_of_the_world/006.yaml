review_pass:
  verdict: revise
  source_fidelity: Die Prüfung erfolgt wegen der ausstehenden direkten koptischen Kontrolle am bereitgestellten englischen Zeugen. Der Entwurf bewahrt Handlung, Namen, kosmologische Terminologie und die unklare Zahlenfolge weitgehend zuverlässig. Korrigiert werden müssen jedoch die Abschwächung von „denounced“, die Umdeutung von „authority against“ zu „über“ sowie die im Lauftext nicht mehr sichtbar erhaltenen leeren Klammern der Überlieferungslücken.
  naturalness: Der Text ist insgesamt modernes, würdiges Standarddeutsch. „auf ihn ausgießen“ und „standen vor ihm als Diener“ sind idiomatischer und näher am Zeugnis als die jeweiligen Entwurfsformulierungen. Die lange kosmologische Beschreibung bleibt gut lesbar.
  terminology: Pistis, Pistis Sophia, Sabaoth, Yaldabaoth, Zoe, Cherubin und Seraphin sind sachgerecht beibehalten. „Herr der Heerscharen“, „Mächte des Chaos“, „Urelternteil“ und „Umkehr“ sind angemessene, nicht konfessionell verengende Lösungen. „Verurteilung“ gibt die wiederholte denunciatory-Wendung näher wieder als „sich lossagen“.
  issues:
  - severity: medium
    issue: „sagte er sich von seinem Vater … los“ schwächt „he denounced his father [and mother]“ ab.
    rationale: Das englische Zeugnis bezeichnet eine Verurteilung beziehungsweise Anprangerung, nicht lediglich die Aufgabe einer Bindung. „Er verurteilte“ wahrt die mögliche Breite ohne die Aussage abzuschwächen.
  - severity: medium
    issue: „Macht über alle Heerscharen des Chaos“ ersetzt „authority against all the hosts of Chaos“.
    rationale: „Against“ markiert eine gegen die chaotischen Heerscharen gerichtete Vollmacht; „über“ verändert dies in eine uneingeschränkte Herrschaftszuordnung.
  - severity: medium
    issue: Die leeren eckigen Klammern der beiden Textlücken sind im deutschen Lauftext durch alleinstehende Fußnotenmarker ersetzt.
    rationale: Die Vorlage signalisiert an beiden Stellen ausdrücklich eine Lücke („[]“). Diese muss im Text sichtbar bleiben; die Fußnoten können ihre Funktion erläutern.
  - severity: low
    issue: „traten als Diener vor ihn“ ist gegenüber „stood before him as attendants“ leicht aktiver formuliert.
    rationale: „standen vor ihm als Diener“ bildet die fortdauernde Stellung als Gefolge unmittelbarer ab.
  revised_text: 'Als Sabaoth, der Sohn Jaldabaoths, die Stimme der Pistis gehört hatte, sang er ihr Lob. Auf Pistis’ Geheiß verurteilte er seinen Vater [und seine Mutter] []ᵃ, und er pries sie, weil sie sie über den unsterblichen Menschen und sein Licht belehrt hatte. Dann streckte Pistis Sophia ihren Finger aus und goss etwas vom Licht ihres eigenen Lichtes auf ihn aus – zur Verurteilung seines Vaters. Als Sabaoth erleuchtet worden war, erhielt er große Macht gegen alle Heerscharen des Chaos. Seit jenem Tag wird er »Herr der Heerscharen« genannt.


    Er verachtete seinen Vater, die Finsternis, und seine Mutter, den Abgrund. Auch hasste er seine Schwester, den Gedanken des Urelternteils, der sich über den Wassern hin und her bewegt hatte. Wegen seines Lichtes wurden alle Mächte des Chaos eifersüchtig auf ihn. Als sie in Aufruhr gerieten, führten sie einen großen Krieg in den sieben Himmeln.


    Als Pistis Sophia den Krieg sah, sandte sie aus ihrem Licht sieben Erzengel zu Sabaoth. Sie trugen ihn hinauf in den siebten Himmel und standen vor ihm als Diener. Außerdem sandte sie ihm drei weitere Erzengel und richtete für ihn das Reich ein, das über allen steht, damit er über den zwölf Göttern des Chaos wohnen konnte.


    Als Sabaoth nun als Lohn für seine Umkehr die Ruhestätte in Besitz genommen hatte, gab Pistis ihm auch ihre Tochter Zoe und verlieh ihm große Macht, damit sie ihn über alles belehren konnte, was im achten Himmel existiert. Weil er Macht besaß, errichtete er sich zuallererst einen Palast. Er ist gewaltig und prachtvoll, siebenmal größer als alle Paläste in den sieben Himmeln. Vor []ᵇ seinem Palast schuf er einen gewaltigen Thron, der auf einem viergesichtigen Wagen stand, der »Cherubin« genannt wird.


    Die Cherubin haben an jeder der vier Ecken acht Gestalten: Löwengestalten, Kalbsgestalten, Menschengestalten und Adlergestalten, sodass die Gesamtzahl der Gestalten vierundsechzig beträgt. Vor ihm stehen sieben Erzengel. Er selbst ist der Achte und besitzt Macht. Die Gesamtzahl aller Gestalten beträgt zweiundsiebzig.ᶜ Auch empfingen die zweiundsiebzig Götter ihre Gestalt von diesem Wagen, damit sie über die zweiundsiebzig Sprachen der Völker herrschen konnten. Bei jenem Thron schuf er außerdem schlangenartige Engel, die »Seraphin« genannt werden und ihn allezeit verherrlichen.'
