lexical_decisions:
- source_word: authorities
  choice: Mächte
  rationale: »Mächte« ist in deutschsprachiger frühchristlicher und gnostischer Literatur eine natürliche Bezeichnung für kosmische Herrschaftswesen und wahrt den übermenschlichen Bezug besser als das moderne verwaltungssprachliche »Autoritäten«.
- source_word: shaped form
  choice: die von ihnen geformte Gestalt
  rationale: Bewahrt sowohl den Vorgang des Formens als auch die Unterscheidung zwischen der belebten Gestalt und dem später erwähnten Abbild.
- source_word: likeness
  choice: Abbild
  rationale: Kennzeichnet eine sichtbare Entsprechung oder zurückgelassene Erscheinungsform, ohne sie vorschnell als bloße Illusion zu deuten.
- source_word: force
  choice: Kraft
  rationale: Die ungewöhnliche ontologische Aussage über Eva bleibt wörtlich und theologisch offen.
- source_word: tree of knowledge
  choice: Baum der Erkenntnis
  rationale: Entspricht dem etablierten biblischen Ausdruck und bleibt für moderne Leser verständlich.
- source_word: seal of her voice
  choice: Siegel ihrer Stimme
  rationale: Die rätselhafte Bildsprache wird nicht paraphrasiert oder dogmatisch aufgelöst.
- source_word: true man
  choice: wahrer Mensch
  rationale: »Mensch« bewahrt die mögliche kosmisch-anthropologische Bedeutung; »Mann« würde den Ausdruck unnötig auf das männliche Geschlecht verengen.
- source_word: consummation (of the age)
  choice: Vollendung des Zeitalters
  rationale: Bewahrt die eschatologische Aussage und gibt die im Zeugen durch Klammern markierte Ergänzung flüssig wieder.
theological_decisions:
- issue: Die Herkunft Evas aus Adams Rippe
  choice: Als von den Mächten im Schlaf vermittelte Lehre wiedergegeben
  alternative: Als sachliche Aussage des Erzählers formulieren
  rationale: Der Abschnitt stellt diese Herkunft ausdrücklich als Teil des Plans der Mächte dar; die Übersetzung darf diese polemische Spannung nicht glätten.
- issue: Evas Wesen als »Kraft«
  choice: Ontologisch offene Formulierung »Eva eine Kraft war«
  alternative: »weil Eva mächtig war«
  rationale: Die Alternative würde eine Wesensaussage in eine bloße Eigenschaft umdeuten.
- issue: Das Abbild als eigener Leib der Mächte
  choice: »ihren eigenen Leib« beibehalten
  alternative: Zu »ein ihnen gehörendes Gebilde« erklären
  rationale: Die paradoxe Identifikation gehört zur theologischen Argumentation des Textes und bleibt bewusst ungelöst.
- issue: Geburt aus dem wahren Menschen durch Rede
  choice: Nahe am rätselhaften Wortlaut wiedergegeben
  alternative: Als eindeutige Lehre über Bekenntnis, Schöpfungswort oder geistige Wiedergeburt auslegen
  rationale: Die Zeugengrundlage erlaubt keine sichere Festlegung auf eine dieser Deutungen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit erzählerisch klaren Sätzen. Gewalt und sexuelle Befleckung werden sachlich, aber nicht beschönigend wiedergegeben. Der Entwurf beruht mangels abgeschlossener koptischer Quellenprüfung auf dem angegebenen gemeinfreien englischen Textzeugen; deshalb werden besonders rätselhafte oder beschädigte Stellen transparent offengehalten.
