base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/019.yaml
  text: 'Then it was reported to the authorities that the form they had shaped was alive and had stood up, and they were deeply disturbed. They sent seven archangels to learn what had happened.


    They approached Adam. When they saw Eve speaking with him, they said to one another, “What kind of being is this radiant woman? She is like that likeness which appeared to us within the light. Come, let us seize her and cast our seed into her, so that when she is defiled, she will be unable to ascend into her light. Instead, those to whom she gives birth will be under our command. But let us not tell Adam, because he is not one of us. Instead, let us put him into a deep sleep, and while he sleeps, let us teach him that she came from his rib, so that his wife will obey him and he will be lord over her.”


    Because she was a force, Eve laughed at their decision. She made a mist enter their eyes and secretly left her likeness with Adam.


    She entered the tree of knowledge and remained there. They chased after her, and she revealed to them that she had entered the tree and had become a tree. Then the blind beings fell into great fear and fled.


    After they had shaken off their stupor, they approached Adam. When they saw the likeness of this woman [] with him, they were deeply troubled, believing that she was the actual Eve, and they acted impulsively. They approached her, seized her, and cast their seed upon her.


    They did this in wickedness, defiling her by natural and obscene means. First they defiled the seal of her voice, [13] which had spoken with them, saying, “What existed before you?” In this way, they meant to defile, at the consummation (of the age), those who might declare through verbal expression that they were born of the true man. They went astray, unaware that they had defiled their own body, since it was the likeness that the authorities and their angels defiled by every means.'
translation:
  language: de
  text: 'Dann wurde den Mächten gemeldet, dass die von ihnen geformte Gestalt lebendig geworden und aufgestanden war. Darüber gerieten sie in große Unruhe. Sie sandten sieben Erzengel aus, um zu erfahren, was geschehen war.


    Sie kamen zu Adam. Als sie Eva mit ihm sprechen sahen, sagten sie zueinander: »Was für ein Wesen ist diese leuchtende Frau? Sie gleicht jenem Abbild, das sich uns im Licht gezeigt hat. Kommt, wir wollen sie ergreifen und unseren Samen in sie ergießen. Wenn sie so befleckt ist, wird sie nicht mehr in ihr Licht hinaufsteigen können. Stattdessen werden die, die sie gebiert, unserer Herrschaft unterstehen. Adam aber wollen wir nichts davon sagen, denn er gehört nicht zu uns. Vielmehr wollen wir ihn in tiefen Schlaf versetzen und ihn im Schlaf lehren, dass sie aus seiner Rippe hervorgegangen sei. Dann wird seine Frau ihm gehorchen, und er wird ihr Herr sein.«


    Weil Eva eine Kraft war, lachte sie über ihren Beschluss. Sie ließ einen Nebel in ihre Augen dringen und ließ heimlich ihr Abbild bei Adam zurück.


    Sie ging in den Baum der Erkenntnis ein und verweilte dort. Die Mächte jagten ihr nach, und sie ließ sie erkennen, dass sie in den Baum eingegangen und zu einem Baum geworden war. Da ergriff die blinden Wesen große Furcht, und sie flohen.


    Nachdem sie später ihre Benommenheit abgeschüttelt hatten, kamen sie zu Adam. Als sie das Abbild dieser Frau [a] bei ihm sahen, gerieten sie in große Unruhe. Sie hielten es für Eva selbst und handelten unbesonnen. Sie gingen auf sie zu, ergriffen sie und ergossen ihren Samen über sie.


    In ihrer Bosheit taten sie dies und befleckten sie auf natürliche und schändliche Weise. Zuerst befleckten sie das Siegel ihrer Stimme,[b] die zu ihnen gesprochen und gefragt hatte: »Was war vor euch da?« Auf diese Weise wollten sie bei der Vollendung des Zeitalters diejenigen beflecken, die durch das gesprochene Wort erklären könnten, sie seien aus dem wahren Menschen geboren. Doch sie gingen in die Irre und erkannten nicht, dass sie ihren eigenen Leib befleckt hatten: Es war nämlich das Abbild, das die Mächte und ihre Engel auf jede Weise befleckten.'
