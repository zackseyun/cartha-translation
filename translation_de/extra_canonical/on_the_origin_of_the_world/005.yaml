base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/005.yaml
  text: 'When the heavens had established themselves, together with their hosts and all their government, the Primal Parent grew arrogant. The entire host of angels worshiped him, and all the gods and their angels offered him praise and worship. He became elated and repeatedly boasted to them, “I am self-sufficient.”


    He said, “I am the one who is God, and apart from me nothing else exists.” When he had said this, he transgressed against all the deathless ones who speak with words, and they accused him because of it.


    When Pistis witnessed the impiety of the chief archon, she became enraged. Though unseen, she said, “You are mistaken, Samael”—that is, “Blind God.” “There is a deathless man of light who existed before you, and he will appear among the forms you have shaped. He will trample you in contempt, as a potter’s vessel is trampled, and you will plunge down to your mother, the Abyss, together with those who belong to you. For when all your works are completed, the whole deficiency exposed by the truth will be abolished. Its existence will end, and it will be as though it had never existed.”


    After saying this, Pistis revealed the likeness of her greatness in the waters. Having done this, she withdrew back up into her light.'
translation:
  language: de
  text: 'Als die Himmel sich zusammen mit ihren Heerscharen und ihrer gesamten Herrschaft gefestigt hatten, wurde der Urvater überheblich. Das ganze Heer der Engel betete ihn an, und alle Götter und ihre Engel brachten ihm Lobpreis und Anbetung dar. Da wurde er hochmütig und prahlte immer wieder vor ihnen: »Ich genüge mir selbst.«


    Er sagte: »Ich bin es, der Gott ist, und außer mir gibt es nichts anderes.« Als er das gesagt hatte, verging er sich gegen alle Unsterblichen, die sich mit Worten äußern, und sie klagten ihn deswegen an.


    Als Pistis die Gottlosigkeit des obersten Archons[a] sah, wurde sie zornig. Unsichtbar sagte sie: »Du irrst dich, Samael« – das heißt: »Blinder Gott«.[b] »Es gibt einen unsterblichen Menschen des Lichts, der schon vor dir existierte. Er wird unter den Gestalten erscheinen, die du geformt hast. Voller Verachtung wird er dich zertreten, wie man das Gefäß eines Töpfers zertritt, und du wirst zu deiner Mutter, dem Abgrund, hinabstürzen – zusammen mit denen, die zu dir gehören. Denn wenn alle deine Werke vollendet sind, wird der ganze Mangel, den die Wahrheit aufgedeckt hat, beseitigt werden. Er wird nicht mehr bestehen; es wird sein, als hätte es ihn nie gegeben.«


    Nachdem Pistis dies gesagt hatte, ließ sie in den Wassern das Abbild ihrer Größe erscheinen. Danach zog sie sich wieder hinauf in ihr Licht zurück.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Archon bedeutet »Herrscher« oder »Machthaber« und bezeichnet hier ein kosmisches Herrscherwesen.
    reason: Der griechische Lehnbegriff ist für viele Leser erklärungsbedürftig, sollte aber wegen seiner traditionsgeschichtlichen Bedeutung im Text erhalten bleiben.
  - marker: b
    text: Der Text deutet den Namen »Samael« als »Blinder Gott«.
    reason: Die Namensdeutung gehört ausdrücklich zum überlieferten Wortlaut und wird als textinterne Erklärung kenntlich gemacht.
lexical_decisions:
- source_word: Primal Parent
  choice: Urvater
  rationale: Gibt die ursprüngliche, väterlich gedachte Herrschergestalt knapp und verständlich wieder; aufgrund der noch ausstehenden koptischen Prüfung bleibt die genaue Quellform vorläufig.
- source_word: hosts
  choice: Heerscharen
  rationale: Bewahrt den kosmisch-hierarchischen Sinn und den würdevollen antiken Ton.
- source_word: government
  choice: Herrschaft
  rationale: Bezeichnet hier eher die gesamte Herrschaftsordnung beziehungsweise Machtstruktur als eine moderne Regierung.
- source_word: self-sufficient
  choice: Ich genüge mir selbst
  rationale: Natürliches Deutsch, das den Anspruch auf Unabhängigkeit und Selbstgenügsamkeit bewahrt.
- source_word: deathless ones who use verbal articulation
  choice: Unsterbliche, die sich mit Worten äußern
  rationale: Bewahrt die auffällige Bestimmung der sprachfähigen Unsterblichen, ohne sie zu einer vertrauteren Wesenklasse umzudeuten.
- source_word: chief archon
  choice: oberster Archon
  rationale: Der traditionsgeschichtlich geprägte Titel bleibt als Archon erhalten; 'oberster' gibt die Rangstellung wieder.
- source_word: man of light
  choice: Mensch des Lichts
  rationale: Bewahrt sowohl die anthropologische Bezeichnung als auch ihre mögliche kosmische oder archetypische Spannung.
- source_word: forms
  choice: Gestalten
  rationale: Offen genug für geformte Erscheinungen, Körper oder Gebilde; vermeidet eine unnötige Festlegung.
- source_word: deficiency
  choice: Mangel
  rationale: Gibt den abstrakten kosmologischen Begriff verständlich wieder, ohne ihn als moralische Schuld oder bestimmte Weltregion auszulegen.
- source_word: likeness of her greatness
  choice: Abbild ihrer Größe
  rationale: Bewahrt die Unterscheidung zwischen Pistis selbst und ihrer im Wasser sichtbar gemachten Entsprechung.
theological_decisions:
- issue: Der Gottesanspruch des Urvaters
  choice: Wörtlich als anmaßende Selbstaussage stehen lassen
  alternative: Den Sprecher ausdrücklich als falschen Gott oder Demiurgen kennzeichnen
  rationale: Die Erzählung verurteilt den Anspruch durch ihren Verlauf; die Übersetzung sollte diese Deutung nicht zusätzlich in die Rede eintragen.
- issue: Identität des 'Menschen des Lichts'
  choice: Nicht näher identifizieren
  alternative: Als Christus, himmlischen Adam oder Erlöser benennen
  rationale: Der vorliegende Textabschnitt lässt die Identität offen; eine konfessionelle oder systematische Gleichsetzung wäre ein Import.
- issue: Ende des Mangels
  choice: Als Beseitigung und Ende seines Bestehens wiedergeben
  alternative: Als Vernichtung der materiellen Welt oder als universale Wiederherstellung auslegen
  rationale: Die starke Aussage wird bewahrt, ohne den Referenten des Mangels über den Text hinaus festzulegen.
- issue: Pistis als unsichtbar Handelnde
  choice: Pistis bleibt Eigenname; 'Unsichtbar' beschreibt ihren Zustand
  alternative: Pistis mit 'Glaube' übersetzen oder 'die Unsichtbare' als festen Titel behandeln
  rationale: Der Name ist in diesem kosmologischen Zusammenhang eine Figurbezeichnung; die Syntax des Zeugnisses erlaubt eine Zustandsbeschreibung, ohne einen Titel sicher vorauszusetzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung und leicht erhöhtem kosmologischem Register. Ungebräuchliche Fachsprache wurde weitgehend vermieden; 'Archon' bleibt mit Fußnote erhalten. Die Fassung ist vorläufig, da nur ein englischer gemeinfreier Zeuge vorliegt und die direkte Prüfung des koptischen Textes noch aussteht.
