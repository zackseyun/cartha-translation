  - marker: a
    text: Das zugrunde gelegte englische Zeugnis zeigt an dieser Stelle eine Textlücke.
    reason: Kennzeichnet den im überlieferten Entwurf markierten Ausfall, ohne ihn zu ergänzen.
  - marker: b
