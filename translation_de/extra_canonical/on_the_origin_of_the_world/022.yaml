    reason: Bewahrt die textkritische Unsicherheit an der zweiten markierten Stelle.
  - marker: c
    text: 'Wörtlich nach der ergänzenden Zeichensetzung des englischen Zeugnisses: »Sie betraten (das Paradies und näherten sich) dem Baum des Lebens.«'
    reason: Die Klammern des Zeugnisses signalisieren eine redaktionelle Ergänzung; die Fußnote macht diese Unsicherheit sichtbar.
  - marker: d
    text: Das Fürwort kann sich dem Wortlaut nach auf Adam und die Seinen beziehungsweise auf die Menschen beziehen; der Zusammenhang spricht von der Verkürzung menschlicher Lebenszeit.
    reason: Bewahrt eine grammatische Bezugsunschärfe des vermittelnden Zeugnisses.
lexical_decisions:
- source_word: archons
  choice: Archonten
  rationale: Der in gnostischen Texten etablierte Fachbegriff bleibt erhalten; das später parallel gebrauchte „authorities“ wird zur stilistischen und begrifflichen Unterscheidung mit „Gewalten“ wiedergegeben.
- source_word: teacher
  choice: Lehrer
  rationale: Die Rollenbezeichnung wird ohne eine im Zeugnis nicht ausdrücklich gegebene Identifizierung übersetzt.
- source_word: deathless
  choice: unsterblich
  rationale: Natürliches modernes Deutsch; bezeichnet hier das Nicht-Sterben, ohne eine zusätzliche dogmatische Deutung einzutragen.
- source_word: knowledge
  choice: Erkenntnis
  rationale: „Erkenntnis“ wahrt im religiös-philosophischen Zusammenhang den stärkeren Sinn gegenüber bloßem Faktenwissen.
- source_word: universe
  choice: Weltall
  rationale: Gibt die umfassende geschaffene Welt der Archonten verständlich wieder, ohne sie auf die Erde zu beschränken.
- source_word: consummation of the age
  choice: Vollendung des Zeitalters
  rationale: Bewahrt die eschatologische und zeitliche Bildsprache, statt sie deutend als „Ende der Welt“ aufzulösen.
- source_word: Cherubin
  choice: Cherubim
  rationale: Verwendet die im modernen Deutschen übliche biblische Pluralform für die im Text benannten feurigen Wesen.
theological_decisions:
- issue: Identität des „Lehrers“
  choice: Die Bezeichnung bleibt „der Lehrer“.
  alternative: Identifizierung mit der Schlange oder einem bestimmten Offenbarungswesen.
  rationale: Der vorgelegte Textabschnitt benennt die Gestalt nur funktional; eine ausdrückliche Identifizierung würde die erzählerische Mehrdeutigkeit beseitigen.
- issue: Ursprung des Guten und Bösen
  choice: „Sie besitzen keinen Segen. Aus Bösem kann nichts Gutes hervorgehen.“
  alternative: Abschwächung zu einer bloßen Kritik einzelner Handlungen der Archonten.
  rationale: Die scharfe ontologische beziehungsweise moralische Spannung des Textes wird nicht konfessionell harmonisiert.
- issue: „unsterblicher Mensch“
  choice: Die Wendung bleibt ohne Erklärung stehen.
  alternative: Deutung als Adam, geistiger Urmensch oder höheres himmlisches Wesen.
  rationale: Der unmittelbare Kontext ermöglicht Bezüge, legt aber in dem gelieferten Ausschnitt keine einzige Auslegung zwingend fest.
- issue: Schicksal und Lebensdauer
  choice: Das von Anfang an festgelegte Schicksal wird als Grenze der Macht der Archonten dargestellt.
  alternative: Umdeutung des Schicksals als unmittelbarer Beschluss Gottes.
  rationale: Die eigentümliche Kosmologie des Werkes soll weder biblisch-systematisch harmonisiert noch korrigiert werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit gut lesbarem Erzählfluss und beibehaltenen technischen Begriffen. Die Fassung beruht vorläufig auf dem bereitgestellten gemeinfreien englischen Übersetzungszeugnis; eine unmittelbare Prüfung des koptischen Textes steht noch aus. Deshalb wurden erkennbare Lücken und Ergänzungen transparent vermerkt und ungewöhnliche kosmologische Aussagen nicht geglättet.
