  text: 'When the archons realized that (Adam and Eve) had broken their commandments (to them), they came into Paradise and approached Adam and Eve with an earthquake and great threats, to see the result of the help they had received. Adam and Eve shook violently and hid beneath the trees in Paradise. The archons did not know where they were and said, “Adam, where are you?”


    He said, “Here I am. I hid because I was afraid of you and was embarrassed.” In their ignorance, they said to him, “Who told you about the embarrassment with which you have clothed yourself, unless you have eaten from that tree?”


    He said, “The woman you gave me—she gave it to me, and I ate.”


    Then they said to the woman: [] “What have you done?”


    She answered, “The teacher incited me, and I ate.”


    Then the archons approached the teacher. Because of him, their eyes grew foggy, and they were unable to do anything against him. Since they were powerless, they cursed him.


    After this, they approached the woman and cursed her and her descendants.


    After the woman, they cursed Adam and, because of him, the land and the crops as well. They cursed everything they had created. They possess no blessing. Good cannot result from evil.


    From that day on, the authorities truly realized that there was something more powerful than they were.


    They knew only that their commandments had not been obeyed. Tremendous jealousy entered the world solely because of the deathless man.


    When the archons realized that their Adam had gained a different kind of knowledge, they wanted to test him. They gathered every tame animal, the wild beasts of the earth, and the birds of heaven, and brought them before Adam to learn what he would call them. When he saw them, he gave names to their creatures.


    They became disturbed because Adam recovered from every test. They gathered together and devised schemes, saying, “Look at Adam! He has become like one of us, because he knows the difference between light and darkness. Perhaps now he will be deceived, as happened with the tree of knowledge, and will even approach the tree of life, eat from it, become deathless, and become lord. Then he will loathe and despise us and all our glory. He will condemn us together with our universe. Come, let us banish him [] from Paradise, down to the earth from which he was taken, so that from now on he will be unable to know anything beyond what we are capable of.” In this way, they banished Adam from Paradise together with his wife. But this act they committed was not enough for them. Instead, they became afraid.


    They entered (Paradise, approaching) the tree of life and enclosed it with large, fearsome beings—fiery living creatures called “Cherubin.” They placed a flaming sword among them, fearsomely and continuously turning, to prevent any earthly being from ever entering that place.


    Because the archons became jealous of Adam, they wanted to shorten their lifespans. They were unable to do so because of fate, which had been established from the beginning, for each one had been assigned a lifespan of 1,000 years in accordance with the orbit of the radiant bodies. Nevertheless, although the archons were unable to accomplish this, each of the perpetrators of evil subtracted ten years, and the full lifespan came to 930 years. These years pass in suffering, weakness, and malevolent disruption. This is how life has been from that day until the consummation of the age.'
translation:
  language: de
  text: 'Als die Archonten erkannten, dass Adam und Eva ihre Gebote übertreten hatten, kamen sie ins Paradies. Unter Erdbeben und heftigen Drohungen traten sie an Adam und Eva heran, um zu sehen, was die Hilfe bewirkt hatte, die diese empfangen hatten. Adam und Eva zitterten heftig und versteckten sich unter den Bäumen des Paradieses. Die Archonten wussten nicht, wo sie waren, und riefen: »Adam, wo bist du?«


    Er antwortete: »Hier bin ich. Weil ich mich vor euch fürchtete und mich schämte, habe ich mich versteckt.« In ihrer Unwissenheit fragten sie ihn: »Wer hat dir von der Scham erzählt, mit der du dich bekleidet hast? Hast du etwa von jenem Baum gegessen?«


    Er sagte: »Die Frau, die ihr mir gegeben habt – sie gab mir davon, und ich aß.«


    Dann sagten sie zu der Frau:[a] »Was hast du getan?«


    Sie antwortete: »Der Lehrer hat mich dazu angestiftet, und ich aß.«


    Da gingen die Archonten auf den Lehrer zu. Seinetwegen wurden ihre Augen trübe, und sie konnten nichts gegen ihn ausrichten. Weil sie machtlos waren, verfluchten sie ihn.


    Danach gingen sie zu der Frau und verfluchten sie und ihre Nachkommen.


    Nach der Frau verfluchten sie Adam und seinetwegen auch das Land und die Feldfrüchte. Sie verfluchten alles, was sie erschaffen hatten. Sie besitzen keinen Segen. Aus Bösem kann nichts Gutes hervorgehen.


    Von jenem Tag an erkannten die Gewalten wirklich, dass es etwas gab, das mächtiger war als sie.


    Sie wussten nur, dass ihre Gebote nicht befolgt worden waren. Allein wegen des unsterblichen Menschen kam gewaltige Eifersucht in die Welt.


    Als die Archonten erkannten, dass ihr Adam eine andere Art von Erkenntnis erlangt hatte, wollten sie ihn auf die Probe stellen. Sie versammelten alle zahmen Tiere, die wilden Tiere der Erde und die Vögel des Himmels und brachten sie vor Adam, um zu erfahren, wie er sie nennen würde. Als er sie gesehen hatte, gab er ihren Geschöpfen Namen.


    Sie waren beunruhigt, weil Adam jede Prüfung überstand. Sie kamen zusammen, schmiedeten Pläne und sagten: »Seht Adam! Er ist wie einer von uns geworden, denn er kennt den Unterschied zwischen Licht und Finsternis. Vielleicht lässt er sich nun täuschen, wie es beim Baum der Erkenntnis geschah. Sonst könnte er sogar zum Baum des Lebens gehen, davon essen, unsterblich und zum Herrn werden. Dann wird er uns und all unsere Herrlichkeit verabscheuen und verachten. Er wird uns zusammen mit unserem Weltall verurteilen. Kommt, lasst uns ihn[b] aus dem Paradies verbannen, hinunter auf die Erde, von der er genommen wurde. Von nun an soll er nichts erkennen können, was über unser eigenes Vermögen hinausgeht.« So verbannten sie Adam zusammen mit seiner Frau aus dem Paradies. Doch diese Tat genügte ihnen nicht; vielmehr bekamen sie Angst.


    Sie gingen ins Paradies zum Baum des Lebens[c] und umgaben ihn mit großen, furchterregenden Wesen – feurigen Lebewesen, die »Cherubim« genannt werden. Zwischen ihnen stellten sie ein flammendes Schwert auf, das sich unablässig und furchterregend drehte, damit nie ein irdisches Wesen jenen Ort betreten konnte.


    Weil die Archonten auf Adam eifersüchtig geworden waren, wollten sie ihre Lebenszeit verkürzen.[d] Doch wegen des Schicksals, das von Anfang an festgelegt war, vermochten sie es nicht. Jedem war nämlich entsprechend dem Umlauf der leuchtenden Himmelskörper eine Lebenszeit von tausend Jahren zugeteilt worden. Obwohl die Archonten dies nicht vollbringen konnten, zog jeder der Übeltäter zehn Jahre ab, sodass die gesamte Lebenszeit noch 930 Jahre betrug. Diese Jahre vergehen in Leiden, Schwäche und böswilliger Zerrüttung. So ist das Leben seit jenem Tag bis zur Vollendung des Zeitalters.'
