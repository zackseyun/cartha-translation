translation:
  language: de
  text: 'Vor der Vollendung des Zeitalters wird der ganze Ort unter lautem Donner erbeben. Dann werden die Archonten aus [Furcht vor] ihrem bevorstehenden […] Tod betrübt sein.[a] Die Engel werden um ihre Menschheit klagen, die Dämonen werden ihre Zeiten beweinen, und ihre Menschheit wird angesichts ihres bevorstehenden Todes stöhnen und schreien.


    Dann wird das Zeitalter beginnen, und sie werden in Unruhe geraten. Ihre Könige werden vom feurigen Schwert berauscht sein und gegeneinander Krieg führen, sodass die Erde vom Blutvergießen trunken wird; auch die Meere werden durch jene Kriege aufgewühlt werden. Dann wird die Sonne sich verfinstern, und der Mond wird sein Licht verdunkeln. Die Sterne des Himmels werden ihre Bahnen nicht mehr ziehen. Ein lauter Donnerschlag wird aus einem großen Heer hervorbrechen, das über jedem Heer des Chaos steht, dort, wo sich das Firmament der Frau befindet.[b]


    Nachdem sie die erste Schöpfung hervorgebracht hat, wird sie das weise Feuer der Vernunft ablegen und sich mit unvernünftigem Zorn bekleiden.


    Danach wird sie die Götter des Chaos verfolgen, die sie zusammen mit dem Urelternteil erschaffen hat.[c] Sie wird sie in den Abgrund hinabstoßen. Wegen ihrer Bosheit werden sie vernichtet werden; denn sie werden wie Vulkane werden und einander verschlingen, bis sie durch die Macht des Urelternteils vernichtet sind.


    Nachdem er sie vernichtet hat, wird er sich gegen sich selbst wenden und sogar sich selbst vernichten, bis er nicht mehr existiert. Ihre Himmel werden aufeinanderstürzen, und ihre Heere werden vom Feuer verzehrt werden. Auch ihre Äonen werden gestürzt werden. Sein Himmel wird herabstürzen und in zwei Teile zerbrechen. Seine [Sterne …] werden auf die Erde herabstürzen, [und die Erde wird sie nicht] ertragen können.[d] Sie werden in den Abgrund stürzen, und der Abgrund wird umgestürzt werden. Das Licht wird die Finsternis [besiegen] und vernichten.[e] Sie wird wie […] etwas werden, das niemals existiert hat. Der Ursprung der Finsternis wird sich auflösen, und der Mangel wird mit der Wurzel ausgerissen und in die Finsternis hinabgestoßen werden. Das Licht aber wird nach oben zu seiner Wurzel zurückkehren. Dann wird die Herrlichkeit des Ungezeugten erscheinen und jeden Äon erfüllen, wenn die Prophezeiungen und die Schriften der Könige offenbar werden und durch diejenigen, die »Vollkommene«
    genannt werden, ihre Erfüllung finden.[f]


    Diejenigen jedoch, die im ungezeugten Vater nicht vollkommen geworden sind, werden ihre Herrlichkeit in ihren Äonen und in den Königreichen der Todlosen empfangen; doch in den königlosen Äon werden sie niemals eingehen. Denn jeder muss an den Ort gelangen, von dem er gekommen ist. Durch seine Taten und seine Erkenntnis wird jeder sein jeweiliges Wesen offenbaren.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Eckige Klammern und Auslassungspunkte kennzeichnen ergänzten beziehungsweise beschädigten oder fehlenden Text. Die genaue Formulierung vor »Tod« ist nicht erhalten.
    reason: Manuskriptlücke und unsichere Ergänzung müssen sichtbar bleiben.
  - marker: b
    text: Die Bezeichnung »Firmament der Frau« wird wörtlich bewahrt; welche weibliche Gestalt gemeint ist, wird in diesem Ausschnitt nicht ausdrücklich erklärt.
    reason: Kosmologische Referenz bleibt im Ausschnitt mehrdeutig.
  - marker: c
    text: »Urelternteil« gibt eine geschlechtsneutrale Elternbezeichnung wieder. Im folgenden Absatz wechselt der Text unvermittelt zu einem männlichen Pronomen; dessen Bezug ist unsicher.
    reason: Bewahrt die grammatische und referenzielle Spannung des Zeugen.
  - marker: d
    text: Der Text ist an dieser Stelle beschädigt; »Sterne« und der Satzteil über die Erde sind ergänzt.
    reason: Rekonstruktionsstatus der Passage.
  - marker: e
    text: Das Verb »besiegen« ist ergänzt; die Handschrift weist hier eine Lücke auf.
    reason: Unsichere lexikalische Wiederherstellung.
  - marker: f
    text: Ob die »Schriften der Könige« durch die Vollkommenen offenbart und erfüllt werden oder ob die Satzbezüge anders zu gliedern sind, bleibt syntaktisch nicht völlig sicher.
    reason: Bewahrt syntaktische Mehrdeutigkeit.
lexical_decisions:
- source_word: age / aeon
  choice: Zeitalter / Äon
  rationale: Im erzählerischen Ausdruck »Vollendung des Zeitalters« steht natürliches Deutsch im Vordergrund; für die kosmologischen Bereiche wird der fachsprachlich etablierte Begriff »Äon« bewahrt.
- source_word: archons
  choice: Archonten
  rationale: Der technische kosmologische Titel wird transliteriert, statt ihn mit »Herrscher« zu verallgemeinern.
- source_word: their humanity
  choice: ihre Menschheit
  rationale: Die ungewöhnliche und möglicherweise technische Formulierung bleibt erhalten, da »Menschen« oder »menschliche Anhänger« die nicht geklärte Beziehung festlegen würden.
- source_word: Primal Parent
  choice: Urelternteil
  rationale: Die geschlechtsneutrale Elternbezeichnung des Zeugen wird bewahrt; »Urvater« würde das grammatische und theologische Geschlecht vorzeitig festlegen.
- source_word: Abyss
  choice: Abgrund
  rationale: »Abgrund« ist verständlich und würdevoll und bewahrt den kosmologischen Sinn ohne unnötige Transliteration.
- source_word: unbegotten one / unbegotten Father
  choice: der Ungezeugte / der ungezeugte Vater
  rationale: Die Hervorbringungsterminologie wird formal bewahrt; »ungeschaffen« wäre interpretierend und semantisch weiter.
- source_word: knowledge
  choice: Erkenntnis
  rationale: »Erkenntnis« gibt den religiös-soteriologischen Gehalt besser wieder als das rein informationelle »Wissen«.
theological_decisions:
- issue: Wechsel des Handelnden von der Frau zu »er«
  choice: Der Pronomenwechsel bleibt unverändert sichtbar.
  alternative: Das männliche Pronomen auf das Urelternteil beziehen oder zu einem weiblichen Pronomen angleichen.
  rationale: Der überlieferte Zeuge lässt den Bezug unsicher; eine Glättung würde die Identität des Handelnden unzulässig festlegen.
- issue: Schicksal der Nichtvollkommenen
  choice: Ihre begrenzte Herrlichkeit und ihr Ausschluss vom königlosen Äon werden ohne dogmatische Erklärung wiedergegeben.
  alternative: Den Abschnitt als Verdammnis, abgestufte Erlösung oder Reinkarnation auslegen.
  rationale: Der Text formuliert eine kosmologische Zuordnung nach Herkunft, Taten und Erkenntnis, ohne eine dieser späteren Lehrkategorien eindeutig festzulegen.
- issue: Vollendung durch die »Vollkommenen«
  choice: Die grammatische Zuschreibung an diejenigen, die »Vollkommene« genannt werden, wird beibehalten.
  alternative: Gott als alleinigen Erfüller ergänzen oder »an ihnen« statt »durch sie« übersetzen.
  rationale: Die vermittelte Erfüllung ist im vorliegenden Zeugen ausdrücklich angelegt und soll theologisch nicht entschärft werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst erhaltenen kosmologischen Fachbegriffen. Die Fassung ist wegen der noch ausstehenden direkten Prüfung des koptischen Textes als quellennaher, aber vorläufiger Publikationsentwurf auf Grundlage des angegebenen englischen Zeugen zu verstehen. Manuskriptlücken werden nicht geglättet; die störende Seitenzahl [17] wurde nicht in den Fließtext übernommen.
