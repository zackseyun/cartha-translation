    text: Im überlieferten Text steht vor »Trompeten« eine Lücke; vermutlich ist ein weiteres Instrument oder eine nähere Bestimmung ausgefallen.
    reason: Kennzeichnet die im englischen Zeugen mit leeren eckigen Klammern angezeigte Textlücke, ohne sie spekulativ zu ergänzen.
  - marker: b
    text: Die Wörter »in einer« sind im zugrunde gelegten Übersetzungszeugen als editorische Ergänzung gekennzeichnet.
    reason: Macht die Ergänzung sichtbar, ohne störende Winkelklammern in den Lesetext zu übernehmen.
  - marker: c
    text: Die Wörter »der Tochter der« sind im zugrunde gelegten Übersetzungszeugen als editorische Ergänzung gekennzeichnet.
    reason: Bewahrt transparent den unsicheren beziehungsweise ergänzten Textstatus.
lexical_decisions:
- source_word: assembly
  choice: Versammlung
  rationale: Bewahrt die wiederkehrende sachliche Bezeichnung für die himmlische Zusammenkunft und vermeidet eine vorschnelle kirchliche Deutung durch »Gemeinde«.
- source_word: myriads
  choice: Zehntausende
  rationale: Gibt den Zahlwert des griechisch geprägten Ausdrucks verständlich wieder; im Zusammenhang bezeichnet er eine unermessliche Menge.
- source_word: entity / entities
  choice: Wesen
  rationale: Natürliches, zugleich ontologisch offenes Deutsch für himmlische Entitäten.
- source_word: likenesses
  choice: Abbilder
  rationale: Betont, dass keine identischen Wesen, sondern nach himmlischen Vorbildern gestaltete Entsprechungen geschaffen werden.
- source_word: aeon
  choice: Äon
  rationale: Der technische kosmologische Begriff bleibt erhalten, da »Zeitalter« oder »Weltbereich« die hier mögliche Bedeutung einseitig festlegen würde.
- source_word: Primal Parent
  choice: Urvater
  rationale: Prägnante, würdige Wiedergabe eines ursprünglichen männlich bezeichneten Eltern- beziehungsweise Vaterwesens; die genaue koptische Grundlage muss noch geprüft werden.
- source_word: holy Spirit
  choice: heiliger Geist
  rationale: Die Kleinschreibung von »heilig« vermeidet, den Ausdruck ohne sichere Quellengrundlage ausdrücklich mit einer später dogmatisch bestimmten Benennung gleichzusetzen.
theological_decisions:
- issue: Bezug der männlichen Pronomen und Identität Jesu Christi
  choice: Die Pronomenfolge und die Aussage, dieses Wesen gleiche dem oberen Retter, bleiben bestehen.
  alternative: Jesus Christus ausdrücklich mit dem Retter im achten Himmel identifizieren.
  rationale: Der Text beschreibt ein geschaffenes Wesen als dem oberen Retter ähnlich; eine Identifizierung würde die kosmologische Unterscheidung des Textes beseitigen.
- issue: Pistis Sophia und Sophia, Tochter der Pistis
  choice: Die unterschiedlichen Benennungen werden entsprechend dem Zeugnis beibehalten.
  alternative: Beide Stellen zu einer einheitlichen Namensform harmonisieren.
  rationale: Eine Harmonisierung könnte eine echte literarische oder kosmologische Differenz verdecken.
- issue: Rechte und linke Seite als Gerechtigkeit und Böses
  choice: Die wertende Zuordnung wird unmittelbar wiedergegeben.
  alternative: Sie als bloße symbolische Richtungen abschwächen.
  rationale: Der Ausgangstext stellt ausdrücklich eine begriffliche Benennung von rechts und links her.
- issue: Herrschaft bis zur Vollendung
  choice: »bis zur Vollendung der Himmel des Chaos«
  alternative: »bis zur Vernichtung« oder »bis zum Ende«
  rationale: »Vollendung« bewahrt die Spannung zwischen Abschluss, Erfüllung und Ende, ohne den Vorgang näher festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Syntax. Technische kosmologische Begriffe wie »Äon«, »Pistis« und »Sophia« bleiben erhalten. Der Entwurf beruht mangels direkter koptischer Prüfung auf dem angegebenen gemeinfreien englischen Zeugen; eine Kontrolle an Nag-Hammadi-Codex II,5 und verwandten Zeugen steht noch aus. Alle textkritisch relevanten Ergänzungen oder Lücken werden durch Fußnotenmarker im Haupttext ausgewiesen.
