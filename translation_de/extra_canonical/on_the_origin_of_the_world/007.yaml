base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/007.yaml
  text: 'After this, he created an assembly of angels—countless thousands and tens of thousands—which looked like the assembly in the eighth heaven. He also created a firstborn called “Israel,” that is, “the Man Who Sees God,” and another being called “Jesus Christ.” This being looks like the savior who lives above in the eighth heaven and sits at his right hand on a holy throne. At his left hand, the Virgin of the holy Spirit sits on a throne, glorifying him. The seven virgins stand before her, holding thirty harps, lyres, and [] trumpets and glorifying him. All the angelic hosts glorify him and praise him.


    The place where he sits is a throne of light <in a> great cloud that covers him. No one lived with him inside the cloud except Sophia, <the daughter of> Pistis. She taught him about all the beings that exist within the eighth heaven so that he could create likenesses of them and his reign could last until the consummation of the heavens of Chaos and their hosts.


    Now Pistis Sophia separated him from the darkness and called him to her right, and she placed the Primal Parent at her left. From that day on, the right has been called “justice,” and the left has been called “evil.” Because of this, all of them received an aeon in the assembly of justice, and evil stands over every created being [5].'
translation:
  language: de
  text: 'Danach schuf er eine Versammlung von Engeln, zahllose Tausende und Zehntausende, die der Versammlung im achten Himmel glich, dazu einen Erstgeborenen namens »Israel«, das heißt »der Mensch, der Gott sieht«, und ein weiteres Wesen namens »Jesus Christus«. Dieses gleicht dem Retter, der oben im achten Himmel wohnt und zu seiner Rechten auf einem heiligen Thron sitzt. Zu seiner Linken sitzt die Jungfrau des heiligen Geistes auf einem Thron und verherrlicht ihn. Vor ihr stehen die sieben Jungfrauen; sie halten dreißig Harfen, Leiern und [a] Trompeten und verherrlichen ihn. Auch alle Heerscharen der Engel verherrlichen und preisen ihn.


    Der Ort, an dem er sitzt, ist ein Thron aus Licht in einer großen Wolke, die ihn umhüllt.[b] Niemand wohnte mit ihm in der Wolke außer Sophia, der Tochter der Pistis.[c] Sie unterwies ihn über alle Wesen im achten Himmel, damit er deren Abbilder erschaffen konnte und seine Herrschaft bis zur Vollendung der Himmel des Chaos und ihrer Heerscharen Bestand hätte.


    Pistis Sophia aber sonderte ihn von der Finsternis ab und rief ihn an ihre rechte Seite; den Urvater stellte sie an ihre linke Seite. Seit jenem Tag wird die rechte Seite »Gerechtigkeit« genannt und die linke »das Böse«. Deshalb erhielten sie alle einen Äon in der Versammlung der Gerechtigkeit, und das Böse steht über jedem geschaffenen Wesen.'
  philosophy: optimal-equivalence
  footnotes:
