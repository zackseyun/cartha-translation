  naturalness: Das Deutsch ist überwiegend modern und angemessen würdig. „belebt sich wieder“ klingt jedoch unidiomatisch; „erweckt sich selbst wieder zum Leben“ gibt die ungewöhnliche Selbstbelebung klarer wieder. „dass es dem Paradies Gottes gleicht“ wird zu „dass es dem Paradies Gottes ähnlich ist“, da dies den Vergleich natürlicher ausdrückt.
  terminology: „Sophia Zoe“, „Archonten“, „Phönix“, „Sabaoth“ und „Wasser-Hydri“ sind sachgerecht beibehalten. Die Kategorien der drei Menschengruppen sowie die dreifachen Taufen werden nicht dogmatisch erläutert. Die unsicheren Ergänzungen und Lücken bleiben markiert.
  issues:
  - severity: medium
    issue: Der im englischen Zeugen stehende Anker [14] fehlt im deutschen Haupttext.
    rationale: Auch wenn sein Anmerkungsinhalt nicht vorliegt, ist [14] ein überlieferungs- bzw. ausgabenbezogenes Signal. Es soll am entsprechenden Satz erhalten und durch eine erläuternde Fußnote transparent gemacht werden.
  - severity: low
    issue: „belebt sich wieder“ ist unnatürlich und schwächt die reflexive Aussage leicht ab.
    rationale: Der Zeuge sagt ausdrücklich, der Phönix töte sich selbst und belebe sich selbst wieder. „erweckt sich selbst wieder zum Leben“ bewahrt dies idiomatisch.
  - severity: low
    issue: Die Schlussformulierung „gleicht“ ist weniger präzise als ein ausdrücklicher Ähnlichkeitsvergleich.
    rationale: Die Vorlage sagt, dass das nicht näher bestimmte Bezugsobjekt dem Paradies Gottes „resembles“. „ähnlich ist“ gibt dies unmittelbar wieder und lässt das Bezugsobjekt weiterhin offen.
