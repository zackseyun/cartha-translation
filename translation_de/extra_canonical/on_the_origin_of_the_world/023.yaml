    text: Die Ziffer [14] im englischen Zeugen verweist offenbar auf eine Anmerkung oder Zählung der dortigen Ausgabe; da ihr Inhalt nicht mitgeliefert wurde, wird hier nur die sachliche Aussage übersetzt.
    reason: Verhindert die Übernahme eines funktionslosen fremden Fußnotenzeichens und dokumentiert dessen Auslassung.
