base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/023.yaml
  text: 'So, when Sophia Zoe saw the archons of darkness placing a curse on her companions, she became furious. Leaving the first heaven with full power, she pursued those archons, drove them out of [their] heavens, and threw them down into the world of transgression, making them dwell there as wicked demons on the earth.


    [She sent out a bird], [] which would spend its thousand years in Paradise in their world—a living creature endowed with soul, called the “phoenix.” It kills itself and comes back to life in order to bear witness to the judgment (decreed) against them, because they mistreated Adam and his race, even to the consummation of the age.


    There are three kinds of men, along with their descendants, until the consummation of the world: those endowed with spirit, those endowed with soul, and the earthly. Similarly, there are three phoenixes <inside> Paradise: the first is deathless, and the second lives for 1,000 years. Concerning the third, it is written in the sacred Scripture that it is consumed. Similarly, there are also three baptisms: the first is spiritual, the second is with fire, and the third is with water.


    Just as the phoenix symbolizes the angels, so also does the water hydri in Egypt symbolize those who descend into the baptism of a true man.


    The two bulls in Egypt have a symbolic meaning, [14] namely, the sun and the moon. This is a symbol of Sabaoth, because Sophia obtained the universe from the day she fashioned the sun and the moon, placing a seal on her heaven until the age ends.


    The worm born from the phoenix also symbolizes a human being, concerning whom it is written, “The just man will blossom like a phoenix,” [15] and the phoenix first appears alive, then dies and rises again, serving as a symbol of what will happen at the consummation of the age.


    These powerful symbols appeared only in Egypt and nowhere else, to indicate [] that it resembles the Paradise of God.'
translation:
  language: de
  text: 'Als Sophia Zoe nun sah, wie die Archonten der Finsternis ihre Gefährten verfluchten, wurde sie zornig. Sie verließ den ersten Himmel mit uneingeschränkter Macht, verfolgte jene Archonten, vertrieb sie aus [ihren] Himmeln und warf sie hinab in die Welt der Übertretung, damit sie dort als böse Dämonen auf der Erde wohnten.


    [Sie sandte einen Vogel aus][a], […][b] der in ihrer Welt seine tausend Jahre im Paradies verbringen sollte – ein beseeltes Lebewesen, das „Phönix“ genannt wird. Er tötet sich selbst und belebt sich wieder, um das gegen sie verhängte Gericht zu bezeugen; denn sie hatten Adam und seine Nachkommen misshandelt, bis zur Vollendung des Zeitalters.


    Bis zur Vollendung der Welt gibt es drei Arten von Menschen samt ihren Nachkommen: die Geistbegabten, die Beseelten und die Irdischen. Ebenso gibt es drei Phönixe <im>[c] Paradies: Der erste ist unsterblich, der zweite lebt tausend Jahre. Vom dritten steht in der heiligen Schrift geschrieben, dass er verzehrt wird. Ebenso gibt es auch drei Taufen: Die erste ist geistlich, die zweite mit Feuer, die dritte mit Wasser.


    Wie der Phönix die Engel versinnbildlicht, so versinnbildlicht auch die Wasser-Hydri[d] in Ägypten diejenigen, die zur Taufe eines wahren Menschen hinabsteigen.


    Die beiden Stiere in Ägypten haben eine sinnbildliche Bedeutung:[e] Sie stehen für Sonne und Mond. Dies ist ein Sinnbild Sabaoths, weil Sophia das All von dem Tag an in Besitz nahm, an dem sie Sonne und Mond schuf und ihren Himmel versiegelte – bis das Zeitalter endet.


    Auch der aus dem Phönix hervorgehende Wurm ist ein Sinnbild für einen Menschen. Von ihm steht geschrieben: „Der Gerechte wird wie ein Phönix erblühen.“[f] Der Phönix erscheint zuerst lebendig, stirbt dann und ersteht wieder auf. So dient er als Sinnbild dessen, was bei der Vollendung des Zeitalters geschehen wird.


    Diese machtvollen Sinnbilder erschienen ausschließlich in Ägypten und nirgendwo sonst, um anzuzeigen […][g], dass es dem Paradies Gottes gleicht.'
