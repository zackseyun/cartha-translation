    text: 'Vgl. Psalm 92,13 nach der in diesem Werk vorausgesetzten Lesart. Andere Überlieferungen und Übersetzungen haben hier gewöhnlich: „Der Gerechte wird wie eine Palme blühen.“'
    reason: Erklärt das Wortspiel beziehungsweise die abweichende Lesart, auf der die Phönixdeutung beruht.
  - marker: g
    text: Vor „dass es dem Paradies Gottes gleicht“ ist im Textzeugen eine Lücke oder unleserlicher Text angezeigt. Worauf sich „es“ bezieht, bleibt daher unsicher; wahrscheinlich ist Ägypten gemeint.
    reason: Bewahrt sowohl die Textlücke als auch die daraus entstehende Unsicherheit des Bezugsworts.
lexical_decisions:
- source_word: Sophia Zoe
  choice: Sophia Zoe
  rationale: Der griechisch geprägte Eigenname wird unverändert bewahrt; eine Übersetzung als „Weisheit Leben“ würde den Namenscharakter und die mögliche personhafte Doppelbezeichnung vorschnell auflösen.
- source_word: archons
  choice: Archonten
  rationale: Der in spätantiken kosmologischen Texten etablierte Fachbegriff bleibt erhalten; „Herrscher“ wäre verständlicher, aber weniger präzise.
- source_word: plenary power
  choice: uneingeschränkter Macht
  rationale: Gibt die Vorstellung vollständiger Vollmacht in natürlichem modernem Deutsch wieder, ohne einen technischen kirchenrechtlichen Klang.
- source_word: world of transgression
  choice: Welt der Übertretung
  rationale: Bewahrt die moralisch-kosmologische Färbung und vermeidet eine einengende Wiedergabe als bloße „Sündenwelt“.
- source_word: imbued with soul
  choice: beseelt / Beseelte
  rationale: Bewahrt die anthropologische Kategorie gegenüber den Geistbegabten und Irdischen.
- source_word: consummation of the age
  choice: Vollendung des Zeitalters
  rationale: Erhält die eschatologische Terminologie und unterscheidet sie von der „Vollendung der Welt“ im folgenden Absatz.
- source_word: water hydri
  choice: Wasser-Hydri
  rationale: Der unklare Ausdruck des Zeugen wird transliterierend bewahrt, statt spekulativ als bestimmtes Tier oder Wasserwesen gedeutet zu werden.
- source_word: universe
  choice: das All
  rationale: Eine würdige und knappe kosmologische Entsprechung, die hier natürlicher wirkt als „Universum“.
- source_word: race
  choice: Nachkommen
  rationale: Im Zusammenhang mit Adam meint der Ausdruck seine menschliche Nachkommenschaft; „Rasse“ wäre im heutigen Deutsch missverständlich.
theological_decisions:
- issue: Dreiteilung der Menschen
  choice: „Geistbegabte, Beseelte und Irdische“ als drei ausdrücklich nebeneinandergestellte Gruppen
  alternative: Die Begriffe als moralische Entwicklungsstufen oder kirchliche Klassen erklären
  rationale: Der Text formuliert eine anthropologische Dreiteilung, erklärt aber ihre genaue dogmatische Reichweite nicht. Die Übersetzung bewahrt diese Spannung ohne konfessionelle Deutung.
- issue: Selbsttötung und Wiederbelebung des Phönix
  choice: „Er tötet sich selbst und belebt sich wieder“
  alternative: „Er stirbt und wird wieder lebendig“
  rationale: Die auffällige Aussage des Zeugen über eine Selbsttötung wird nicht abgeschwächt, obwohl sie mythologisch ungewöhnlich ist.
- issue: Taufe eines wahren Menschen
  choice: Genitivfügung „Taufe eines wahren Menschen“
  alternative: „wahre menschliche Taufe“ oder „Taufe durch den wahren Menschen“
  rationale: Die syntaktische und theologische Mehrdeutigkeit bleibt erhalten; der Text lässt offen, ob der wahre Mensch Empfänger, Urbild oder anderweitiger Bezugspunkt der Taufe ist.
- issue: Sophias Besitz am All
  choice: „Sophia das All … in Besitz nahm“
  alternative: „Sophia das All erhielt“
  rationale: Die Vorlage kann Erwerb, Empfang oder Erlangung bezeichnen. „in Besitz nahm“ gibt den Vorgang wieder, ohne ausdrücklich einen Geber einzuführen.
- issue: Psalmzitat und Phönix
  choice: „wie ein Phönix erblühen“
  alternative: „wie eine Palme blühen“
  rationale: Obwohl die bekannte Schriftstelle gewöhnlich „Palme“ lautet, verlangt die Argumentation dieses Textes ausdrücklich „Phönix“. Diese textinterne Lesart wird nicht harmonisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst beibehaltenen kosmologischen Fachbegriffen. Die Satzstruktur wurde moderat geglättet, ohne die eigentümlichen Wiederholungen, Dreierordnungen und eschatologischen Spannungen zu beseitigen. Da eine direkte Prüfung des koptischen Textes noch aussteht, sind unklare oder editorisch ergänzte Stellen sichtbar markiert und nicht spekulativ geschlossen.
