lexical_decisions:
- source_word: archons
  choice: Archonten
  rationale: Der in spätantiken religiösen Texten etablierte Fachbegriff bleibt erhalten; eine bloße Wiedergabe als »Herrscher« könnte die besondere kosmologische Rolle verwischen.
- source_word: deathless man
  choice: der unsterbliche Mensch
  rationale: Gibt die Aussage formal wieder, ohne die Identität dieser Gestalt weiter auszudeuten.
- source_word: authorities
  choice: Gewalten
  rationale: Unterscheidet diese Bezeichnung von den zuvor genannten Archonten und bewahrt den kosmisch-hierarchischen Klang.
- source_word: Beast
  choice: Tier
  rationale: Bewahrt die absichtliche Benennung als Titel, angezeigt durch Anführungszeichen, ohne das Wesen ausdrücklich mit der Schlange gleichzusetzen.
- source_word: reasoning will grow sober
  choice: euer Denken wird nüchtern werden
  rationale: Erhält das im Abschnitt wiederkehrende Bild des Nüchternwerdens und vermeidet eine rationalistische Verengung.
- source_word: knowing the difference between evil and good humans
  choice: den Unterschied zwischen bösen und guten Menschen erkennen
  rationale: Folgt der ungewöhnlichen Aussage der Textzeugin, statt sie stillschweigend zur geläufigeren Formel »Gut und Böse erkennen« umzudeuten.
- source_word: those who had shaped them
  choice: diejenigen, die sie geformt hatten
  rationale: Bewahrt den handwerklich-schöpferischen Ausdruck und identifiziert die Gestalten nicht ausdrücklich mit Gott oder den Archonten.
theological_decisions:
- issue: Identität des »wahren Menschen« und der baumgewordenen weiblichen Gestalt
  choice: Die wechselnden Bezüge und Geschlechterformen werden möglichst eng beibehalten.
  alternative: Die Gestalten durch erklärende Eigennamen oder eindeutige Pronomen identifizieren.
  rationale: Der überlieferte Gedankengang ist mehrdeutig; eine eindeutige Identifikation würde eine bestimmte kosmologische Auslegung in den Text eintragen.
- issue: Das als »Tier« bezeichnete Geschöpf
  choice: Es wird nicht ausdrücklich als Schlange bezeichnet.
  alternative: Nach dem Bezug auf Genesis mit »Schlange« übersetzen.
  rationale: Die vorliegende Textzeugin nennt das Geschöpf »Beast«; die Spannung zur Genesis-Erzählung soll erhalten bleiben.
- issue: Wirkung der Erkenntnisfrucht
  choice: Erkenntnis wird als Licht und Erwachen dargestellt, zugleich bleiben Scham und Nacktheit stehen.
  alternative: Die Szene ausschließlich als Erlösung oder ausschließlich als Sündenfall deuten.
  rationale: Der Text verbindet positive Erkenntnissprache mit Scham und Nacktheit; diese theologische Spannung darf nicht harmonisiert werden.
translation_notes:
  register: Moderne, würdige Standardsprache mit erzählerischer Klarheit. Kosmologische Fachbegriffe wie »Archonten« bleiben erhalten. Der Entwurf beruht mangels abgeschlossener Prüfung des koptischen Textes auf der angegebenen gemeinfreien englischen Textzeugin; eine direkte Kontrolle an Nag-Hammadi-Codex II,5 und verwandten Zeugen steht noch aus.
