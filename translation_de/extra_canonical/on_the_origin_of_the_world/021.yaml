review_pass:
  verdict: revise
  source_fidelity: 'Eine sichere Korrektur ist nötig: Der Entwurf nivelliert im Wortwechsel mit dem »Tier« die durch die englische Textzeugin überlieferte auffällige Einzahl zu einem durchgehenden Plural. Die Textzeugin lässt die Archonten zwar Adam und Eva ansprechen, verwendet dann aber »him« bzw. Singularformen. Diese Spannung soll nicht harmonisiert werden. Außerdem gibt »sie nicht unbeachtet lassen würde« nicht »would not ignore them« wieder.'
  naturalness: Die revidierte Fassung bleibt moderne, würdige Standardsprache. Einige Formulierungen werden geglättet, ohne die absichtlichen Unebenheiten und Mehrdeutigkeiten der Textzeugin aufzulösen.
  terminology: »Archonten«, »Gewalten«, »Tier«, »Baum der Erkenntnis« und »unsterblicher Mensch« werden beibehalten. Die ungewöhnliche Formel »Mit dem Tod wirst du nicht sterben« wird im Text selbst erhalten; die textkritische Lücke bleibt mit Anker kenntlich.
  issues:
  - severity: high
    issue: Numeruswechsel in der Rede an Adam und Eva harmonisiert
    rationale: 'Die Vorlage hat nach der Ansprache von Adam und Eva auffällig Singular: »saying to him«, »you« und die Rede des »Beast« an Eva. Der Entwurf macht daraus Pluralformen (»euch«, »esst«, »Fürchtet euch«). Das beseitigt eine textliche Spannung ohne Grundlage.'
  - severity: medium
    issue: »would not ignore them« unzutreffend wiedergegeben
    rationale: »sie nicht unbeachtet lassen würde« bedeutet, dass der unsterbliche Mensch die Archonten nicht übersehen würde. Die Vorlage besagt dagegen, dass er sie nicht ignorieren würde.
  - severity: low
    issue: Die emphatische Todesformel ist geglättet
    rationale: »Ganz gewiss werdet ihr nicht sterben« ist verständlich, unterschlägt aber die eigentümliche Wiederholung »with death ... die«. Sie kann im Deutschen ohne Sinnverlust als »Mit dem Tod wirst du nicht sterben« stehen.
  - severity: low
    issue: Beschreibung des Baumes und Schlussformulierung können quellennäher und idiomatischer sein
    rationale: »verlockend« verschiebt »satisfying« in Richtung Versuchung und verdoppelt das anschließende Begehren. »schön und ansprechend, und sie fand Gefallen daran« bildet beide Aussagen. »Ihr Bewusstsein war geschärft« ist modernes Deutsch für »They had become acutely aware«.
  revised_text: 'Lasst mich als Nächstes berichten: Als die Archonten sahen, wie er und das weibliche Wesen, das bei ihm lebte, unwissentlich wie Tiere in die Irre gingen, freuten sie sich außerordentlich.


    Als sie erfuhren, dass der unsterbliche Mensch sie nicht ignorieren würde, wurden sie bestürzt; denn nun mussten sie vielmehr das weibliche Wesen fürchten, das sich in einen Baum verwandelt hatte. Sie sagten: »Vielleicht ist dieses Wesen der wahre Mensch – es hat Nebel über uns gebreitet und uns gelehrt, dass diejenige, die befleckt worden war, ihm gleicht. Dann werden wir besiegt werden.«


    Darauf ersannen alle sieben gemeinsam Ränke. Nervös traten sie an Adam und Eva heran und sagten zu ihm: »Von den Früchten aller Bäume, die für euch im Paradies geschaffen wurden, darfst du essen. Doch beim Baum der Erkenntnis übe Selbstbeherrschung und iss nicht davon. Wenn du davon isst, wirst du sterben.« Nachdem sie in ihnen tiefe Angst geweckt hatten, zogen sie sich zu ihren Gewalten zurück.


    Dann kam das klügste aller Geschöpfe herbei, das »Tier« genannt wird. Als es das Ebenbild ihrer Mutter Eva erblickte, sagte es zu ihr: »Was hat Gott zu dir gesagt? Etwa: ›Iss nicht vom Baum der Erkenntnis‹?«


    Sie sagte: »Er hat nicht nur gesagt: ›Iss nicht davon‹, sondern auch: ›Berühre ihn nicht, sonst wirst du sterben.‹«


    Es sagte zu ihr: »Fürchte dich nicht! Mit dem Tod wirst du nicht sterben. Denn er weiß: Wenn du [ ] davon isst,[a] wird dein Denken nüchtern werden, und du wirst wie Götter sein und den Unterschied zwischen bösen und guten Menschen erkennen. Tatsächlich hat er dir dies aus Eifersucht gesagt, damit du nicht davon isst.«


    Nun fasste Eva Vertrauen zu den Worten des Lehrers. Sie betrachtete den Baum und erkannte, dass er schön und ansprechend war, und sie fand Gefallen daran. Sie nahm von seiner Frucht und aß. Auch ihrem Mann gab sie davon, und auch er aß. Da wurde ihr Denken geöffnet; denn als sie aßen, leuchtete ihnen das Licht der Erkenntnis auf. Als sie sich mit Scham bekleideten, erkannten sie, dass sie ohne Erkenntnis nackt waren. Als sie nüchtern wurden, erkannten sie, dass sie nackt waren, und sie verliebten sich ineinander. Als sie erkannten, dass diejenigen, die sie geformt hatten, Tiergestalt besaßen, hassten sie sie. Ihr Bewusstsein war geschärft.'
