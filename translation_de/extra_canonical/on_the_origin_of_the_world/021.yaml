base_translation:
  language: en
  yaml_path: translation/extra_canonical/on_the_origin_of_the_world/021.yaml
  text: 'Allow me to say next that, once the archons had seen him and the female being who lived with him unknowingly going astray like beasts, they were extremely happy.


    When they learned that the deathless man would not ignore them, they became upset, because they would instead have to fear the female being who had turned herself into a tree. They said, “Perhaps this is the real man, this being who cast a mist over us and taught us that she who had been defiled resembles him. Then we will be defeated.”


    Then all seven devised schemes together. They nervously approached Adam and Eve and said to him, “You may eat the fruit of any of the trees created for you in Paradise. But concerning the tree of knowledge, restrain yourself and do not eat from it. If you eat, you will die.” After causing deep anxiety within them, they withdrew to their authorities.


    Then the cleverest of all creatures approached, the one called “Beast.” When he saw the likeness of their mother Eve, he said to her, “What did God say to you? Was it, ‘Do not eat from the tree of knowledge’?”


    She said, “He not only said, ‘Do not eat from it,’ but also, ‘Do not touch it, or you will die.’”


    He said to her, “Do not be afraid. With death you will not die, because he knows that when you eat [] from it, your reasoning will become sober, and you will become like gods, knowing the difference between evil and good humans. In fact, he said this to you out of jealousy, to keep you from eating from it.”


    Eve now had confidence in the teacher’s words. She looked at the tree and recognized that it was beautiful and satisfying, and she desired it. She took some of its fruit and ate it. She also gave some to her husband, and he ate it as well. Then their minds were opened, because when they ate, the light of knowledge shone upon them. When they clothed themselves with embarrassment, they realized that they were naked without knowledge. When they became sober, they realized that they were naked, and they fell in love with each other. When they realized that those who had shaped them had the forms of beasts, they hated them. They had become acutely aware.'
translation:
  language: de
  text: 'Lasst mich als Nächstes berichten: Als die Archonten sahen, wie er und das weibliche Wesen, das bei ihm lebte, unwissentlich wie Tiere in die Irre gingen, freuten sie sich außerordentlich.


    Als sie erfuhren, dass der unsterbliche Mensch sie nicht unbeachtet lassen würde, wurden sie bestürzt; denn nun mussten sie vielmehr das weibliche Wesen fürchten, das sich in einen Baum verwandelt hatte. Sie sagten: »Vielleicht ist dieses Wesen der wahre Mensch – es hat Nebel über uns gebreitet und uns gelehrt, dass diejenige, die befleckt worden war, ihm gleicht. Dann werden wir besiegt werden.«


    Darauf schmiedeten alle sieben gemeinsam ihre Pläne. Nervös traten sie an Adam und Eva heran und sagten zu ihm: »Von den Früchten aller Bäume, die für euch im Paradies geschaffen wurden, dürft ihr essen. Doch beim Baum der Erkenntnis übe dich in Enthaltsamkeit und iss nicht davon. Wenn du davon isst, wirst du sterben.« Nachdem sie in ihnen tiefe Angst geweckt hatten, zogen sie sich zu ihren Gewalten zurück.


    Dann kam das klügste aller Geschöpfe herbei, das »Tier« genannt wird. Als es das Ebenbild ihrer Mutter Eva erblickte, sagte es zu ihr: »Was hat Gott zu euch gesagt? Etwa: ›Esst nicht vom Baum der Erkenntnis‹?«


    Sie sagte: »Er hat nicht nur gesagt: ›Esst nicht davon‹, sondern auch: ›Berührt ihn nicht, sonst werdet ihr sterben.‹«


    Es sagte zu ihr: »Fürchtet euch nicht! Ganz gewiss werdet ihr nicht sterben.[a] Denn er weiß: Wenn ihr davon esst,[b] wird euer Denken nüchtern werden, und ihr werdet wie Götter sein und den Unterschied zwischen bösen und guten Menschen erkennen. Tatsächlich hat er euch dies aus Eifersucht gesagt, damit ihr nicht davon esst.«


    Nun fasste Eva Vertrauen zu den Worten des Lehrers. Sie betrachtete den Baum und erkannte, dass er schön und verlockend war, und sie begehrte ihn. Sie nahm von seiner Frucht und aß. Auch ihrem Mann gab sie davon, und auch er aß. Da wurde ihr Denken geöffnet; denn als sie aßen, leuchtete das Licht der Erkenntnis über ihnen auf. Als sie sich aus Scham bekleideten, erkannten sie, dass sie ohne Erkenntnis nackt waren. Als sie nüchtern wurden, erkannten sie, dass sie nackt waren, und sie verliebten sich ineinander. Als sie erkannten, dass diejenigen, die sie geformt hatten, Tiergestalt besaßen, hassten sie sie. Sie waren zu scharfem Bewusstsein gelangt.


    [a] Wörtlicher gibt die zugrunde liegende englische Textzeugin die emphatische Wendung mit »Mit dem Tod werdet ihr nicht sterben« wieder.


    [b] An dieser Stelle kennzeichnet die zugrunde liegende Textzeugin eine Lücke oder unsichere Ergänzung im überlieferten Text.'
