base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/012.yaml
  text: 'Those who practiced guilelessness toward God they used to call children, as Papias also shows in the first book of the Expositions of the Lord, and Clement of Alexandria in the Paedagogue.


    —Maximus the Confessor, Scholia on the works of Dionysius the Areopagite, On the Ecclesiastical Hierarchy, chapter 2.'
translation:
  language: de
  text: 'Diejenigen, die sich Gott gegenüber arglos verhielten, nannte man Kinder, wie auch Papias im ersten Buch der »Auslegungen der Worte des Herrn« und Clemens von Alexandria im »Erzieher« zeigen.[a]


    — Maximus der Bekenner, Scholien zu den Werken des Dionysius Areopagita, »Über die kirchliche Hierarchie«, Kapitel 2.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vorläufige Übersetzung nach dem überlieferten englischen Textzeugen. Eine unmittelbare Prüfung des griechischen beziehungsweise lateinischen Wortlauts steht noch aus; auch die genaue Fassung der genannten Werktitel bleibt daher vorläufig.
    reason: Die bereitgestellte Grundlage ist eine gemeinfreie englische Übersetzung, während die Prüfung der antiken Quellensprache ausdrücklich noch aussteht.
lexical_decisions:
- source_word: practised guilelessness towards God
  choice: sich Gott gegenüber arglos verhielten
  rationale: Die Formulierung gibt die im englischen Zeugen belegte Haltung der Aufrichtigkeit ohne Täuschung natürlich und würdig wieder, ohne eine noch nicht am griechischen oder lateinischen Wortlaut geprüfte technische Bedeutung festzulegen.
- source_word: children
  choice: Kinder
  rationale: Die wörtliche und kontextuell klare Bezeichnung bleibt erhalten; eine Deutung als geistliche Kinder wird nicht in den Haupttext eingetragen.
- source_word: Expositions of the Lord
  choice: Auslegungen der Worte des Herrn
  rationale: Dieser etablierte Werktitel gibt den wahrscheinlich gemeinten Gegenstand verständlich wieder, bleibt wegen der ausstehenden Prüfung des antiken Wortlauts jedoch vorläufig.
- source_word: Paedagogue
  choice: Erzieher
  rationale: Der griechische Werktitel wird mit seiner geläufigen deutschen Bedeutung wiedergegeben.
- source_word: Ecclesiastical Hierarchy
  choice: kirchliche Hierarchie
  rationale: Nahe, sachliche Wiedergabe des überlieferten lateinischen Kurztitels.
theological_decisions:
- issue: Bedeutung der Bezeichnung »Kinder«
  choice: Die Bezeichnung bleibt ohne erklärenden Zusatz stehen.
  alternative: »Kinder Gottes« oder »geistliche Kinder«
  rationale: Der Zeuge sagt lediglich »Kinder«; eine theologische Präzisierung würde die überlieferte Aussage enger bestimmen, als es die vorliegende Grundlage erlaubt.
- issue: Charakter der Arglosigkeit
  choice: »arglos«
  alternative: »ohne Falsch vor Gott« oder »lauter«
  rationale: »Arglos« wahrt den Gedanken fehlender Täuschungsabsicht. Wegen der noch ausstehenden Prüfung der griechischen beziehungsweise lateinischen Quelle wird keine stärker moralisch oder lehrhaft geprägte Deutung gewählt.
