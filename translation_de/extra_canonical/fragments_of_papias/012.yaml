review_pass:
  verdict: revise
  source_fidelity: Die Aussage wird im Wesentlichen zutreffend wiedergegeben. Die Formulierung „nannte man Kinder“ gibt jedoch das im Zeugen ausdrücklich vorhandene Subjekt („they“) nur unpersönlich wieder. „nannten sie Kinder“ bewahrt die Zuschreibung genauer. Die Erweiterung des Werktitels zu „Auslegungen der Worte des Herrn“ ist angesichts des vorliegenden englischen Zeugen und der noch ausstehenden direkten Prüfung der Quellensprache nicht sicher genug.
  naturalness: Der Satz ist verständlich und im würdigen modernen Standarddeutsch gut lesbar. Die revidierte Wortstellung mit „nannten sie Kinder“ ist idiomatisch und zugleich näher an der überlieferten Aussage. „Schriften des Dionysius Areopagita“ ist für die bibliographische Angabe natürlicher als „Werke“.
  terminology: „Kinder“, „Erzieher“ und „kirchliche Hierarchie“ sind sachgerecht. Der nur vorläufig abgesicherte Titel der Schrift des Papias wird in der Revision nicht durch den Zusatz „Worte“ präzisiert. Die Vorläufigkeitsanmerkung bleibt erforderlich, weil der unmittelbare griechisch-lateinische Abgleich noch aussteht.
  issues:
  - severity: medium
    issue: Unpersönliche Wiedergabe von „they used to call“ als „nannte man“
    rationale: Der englische Zeuge benennt ein wenn auch nicht weiter bestimmtes Subjekt. „nannten sie“ erhält diese Struktur, ohne das Subjekt inhaltlich zu ergänzen.
  - severity: medium
    issue: „Auslegungen der Worte des Herrn“ ergänzt „Worte“ über den Wortlaut des vorliegenden englischen Zeugen hinaus
    rationale: Die Ergänzung kann dem mutmaßlichen antiken Werktitel entsprechen, ist aber ohne direkte Quellensprachenprüfung nicht hinreichend abgesichert. Der Haupttext soll die vorliegende Grundlage nicht stärker spezifizieren.
  - severity: low
    issue: „Werken des Dionysius Areopagita“ in der Quellenangabe
    rationale: „Schriften“ ist im Deutschen für eine scholische Bezugnahme auf literarische Texte idiomatischer und präziser.
  revised_text: 'Diejenigen, die Gott gegenüber ohne Arglist waren, nannten sie Kinder, wie auch Papias im ersten Buch der »Auslegungen des Herrn« und Clemens von Alexandria im »Erzieher« zeigen.[a]


    — Maximus der Bekenner, Scholien zu den Schriften des Dionysius Areopagita, »Über die kirchliche Hierarchie«, Kapitel 2.'
  revised_footnotes:
  - marker: a
    text: Vorläufige Übersetzung nach dem überlieferten englischen Textzeugen. Eine unmittelbare Prüfung des griechischen beziehungsweise lateinischen Wortlauts steht noch aus; auch die genaue Fassung der genannten Werktitel bleibt daher vorläufig.
    reason: Die bereitgestellte Grundlage ist eine gemeinfreie englische Übersetzung, während die Prüfung der antiken Quellensprache ausdrücklich noch aussteht.
  revision_rationale: Die Revision stellt die explizite Zuschreibung des Benennens wieder her und vermeidet im Titel der Papias-Schrift eine über den vorliegenden englischen Zeugen hinausgehende Präzisierung. Sie glättet zudem die bibliographische Quellenangabe, ohne Aussage, Register oder verbleibende textliche Unsicherheit zu verändern.
