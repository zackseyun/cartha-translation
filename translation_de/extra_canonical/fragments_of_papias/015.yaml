base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/015.yaml
  text: 'Apollinarius: “Judas did not die by hanging, but lived on, having been cut down before he was suffocated. And the Acts of the Apostles show this, that, falling headlong, he burst asunder in the midst, and all his bowels gushed out. This fact is related more clearly by Papias, the disciple of John, in the fourth (book) of the Exposition of the Oracles of the Lord, as follows:—


    “Judas walked about in this world a terrible example of impiety; _ his flesh swollen to such an extent that, where a waggon [text unclear] pass with ease, he was not able to pass, no, not even the mass of his head merely. They say that his eyelids swelled to such an [lacuna] t that he could not see the light at all, while as for his eyes they were not visible even by a physician looking through an instrument, so far had they sunk from the surface....”


    Compiled from Cramer, Catena ad Acta SS. Apost. (1838), p. 12 sq., and other sources.'
translation:
  language: de
  text: 'Apollinarius:


    „Judas starb nicht durch das Erhängen, sondern blieb am Leben, weil man ihn heruntergenommen hatte, bevor er erstickte. Auch die Apostelgeschichte zeigt dies: Er stürzte kopfüber hinab, barst mitten entzwei, und alle seine Eingeweide traten heraus. Papias, der Schüler des Johannes, berichtet dies im vierten Buch der Auslegung der Worte des Herrn ausführlicher wie folgt:[a]


    Judas ging in dieser Welt als ein schreckliches Beispiel der Gottlosigkeit umher. Sein Körper war so stark angeschwollen, dass er dort, wo ein Wagen [Text unklar] mühelos hindurchfahren konnte, selbst nicht hindurchkam – ja, nicht einmal allein sein gewaltiger Kopf. Man sagt, seine Augenlider seien so stark angeschwollen, dass er überhaupt kein Licht mehr sehen konnte. Seine Augen wiederum waren nicht einmal für einen Arzt sichtbar, der sie mit einem Instrument untersuchte, so tief waren sie unter die Oberfläche zurückgesunken …“[b]


    Zusammengestellt nach Cramer, Catena ad Acta SS. Apost. (1838), S. 12 f., und weiteren Quellen.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Übersetzung dieses Fragments ist vorläufig. Sie beruht auf dem bereitgestellten gemeinfreien englischen Textzeugen; eine unmittelbare Prüfung der griechischen beziehungsweise lateinischen Überlieferung steht noch aus.
    reason: Die Metadaten kennzeichnen die ausgangssprachliche Prüfung ausdrücklich als noch ausstehend.
  - marker: b
    text: Der überlieferte Text ist an mehreren Stellen beschädigt oder lückenhaft. Die Kennzeichnung „[Text unklar]“ und die abschließenden Auslassungspunkte geben diesen Zustand wieder.
    reason: Die beschädigte Passage darf nicht durch eine vermeintlich sichere Rekonstruktion geglättet werden.
  - marker: c
    text: „S. 12 f.“ gibt das englische „p. 12 sq.“ wieder, also Seite 12 und die folgende Seite.
    reason: Bibliografische Abkürzung für moderne deutschsprachige Leser erläutern.
lexical_decisions:
- source_word: did not die by hanging
  choice: starb nicht durch das Erhängen
  rationale: Gibt die behauptete Todesursache präzise wieder, ohne den Bericht mit Matthäus oder der Apostelgeschichte harmonisierend umzudeuten.
- source_word: lived on
  choice: blieb am Leben
  rationale: Natürliches modernes Deutsch für das Fortleben nach dem Herunternehmen.
- source_word: falling headlong
  choice: stürzte kopfüber hinab
  rationale: Bewahrt die räumliche Vorstellung des überlieferten englischen Zeugnisses und den Anklang an Apostelgeschichte 1,18.
- source_word: Exposition of the Oracles of the Lord
  choice: Auslegung der Worte des Herrn
  rationale: „Worte“ ist im Deutschen verständlicher als das missverständliche „Orakel“, während der traditionelle Werktitel sinngemäß erhalten bleibt.
- source_word: impiety
  choice: Gottlosigkeit
  rationale: Trifft den religiös-moralischen Sinn im patristischen Kontext in geläufiger Sprache.
- source_word: the mass of his head merely
  choice: allein sein gewaltiger Kopf
  rationale: Die beschädigte Überlieferung beschreibt offenbar die ungewöhnliche Größe; „gewaltig“ vermittelt dies lesbar, ohne eine anatomische Präzision vorzutäuschen.
- source_word: looking through an instrument
  choice: mit einem Instrument untersuchte
  rationale: Vermeidet die anachronistische Festlegung auf ein bestimmtes optisches Gerät.
theological_decisions:
- issue: Verhältnis der Erzählung zu den neutestamentlichen Berichten über den Tod des Judas
  choice: Die harmonisierende Behauptung des Apollinarius wird als seine Aussage übersetzt, ohne sie als historische oder kanonische Tatsache zu bestätigen.
  alternative: Die Darstellung ausdrücklich mit Matthäus 27,5 oder Apostelgeschichte 1,18 in Einklang bringen oder ihr widersprechen.
  rationale: Die Übersetzung soll die Spannung der Quellen bewahren und keine konfessionelle Harmonisierung einführen.
- issue: Bezeichnung des Papias als Schüler des Johannes
  choice: „der Schüler des Johannes“ wird gemäß dem überlieferten Zeugen beibehalten.
  alternative: Johannes näher als Apostel oder Presbyter bestimmen.
  rationale: Welche Person namens Johannes gemeint ist, wird im vorliegenden Zeugnis nicht eindeutig geklärt; eine Präzisierung würde die Überlieferung überdeuten.
- issue: Moralische Deutung des Judas
  choice: „schreckliches Beispiel der Gottlosigkeit“
  alternative: Abschwächung zu einer rein medizinischen oder neutralen Beschreibung.
  rationale: Die ausdrücklich moralisch-theologische Wertung des Fragments gehört zum Inhalt und darf nicht neutralisiert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Zitatstruktur. Archaismen wurden vermieden, die drastische Bildsprache und die quellenbedingten Unsicherheiten jedoch bewahrt. Da keine direkte griechische oder lateinische Vorlage bereitgestellt wurde, ist der Entwurf ausdrücklich quellenkritisch vorläufig.
