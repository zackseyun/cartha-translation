review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den bereitgestellten englischen Textzeugen insgesamt zuverlässig wieder und wahrt dessen Zuschreibung der Darstellung an Apollinarius bzw. Papias. Eine sichere unmittelbare Prüfung am griechischen/lateinischen Wortlaut ist aufgrund der vorliegenden Daten weiterhin nicht möglich. Korrigiert werden sollten die Abschwächung von „all his bowels gushed out“, die nicht ausreichend markierte zweite Textlücke sowie die syntaktisch unvollständige Wiedergabe des Vergleichs mit dem Wagen und dem Kopf.
  naturalness: Das Deutsch ist überwiegend modern und würdig. „in der Mitte zerbarst“ und „quollen … heraus“ sind idiomatischer und genauer. Der Satz über den Kopf wird vollständig formuliert, ohne die durch den Zeugen beschädigte Stelle zu rekonstruieren.
  terminology: „Gottlosigkeit“, „Eingeweide“ und „Apostelgeschichte“ sind angemessen. „Auslegung der Worte des Herrn“ bleibt als verständliche, nicht überinterpretierende Übertragung des überlieferten Werktitels bestehen. Die Bezeichnung „Schüler des Johannes“ wahrt die Ambiguität der Zuschreibung.
  issues:
  - severity: medium
    issue: Die zweite Beschädigung/Lücke des englischen Textzeugen ist im deutschen Text nicht sichtbar markiert.
    rationale: Der Zeuge bietet bei „his eyelids swelled to such an [lacuna] t“ ausdrücklich eine Lücke. Die glatte Formulierung „so stark angeschwollen“ füllt sie unmarkiert und steht zudem im Widerspruch zur Fußnote, die mehrere Beschädigungen nennt.
  - severity: medium
    issue: „alle seine Eingeweide traten heraus“ schwächt „all his bowels gushed out“ ab.
    rationale: Der drastische Vorgang des Hervorquellens bzw. -strömens gehört zur Aussage des Zeugen und soll nicht abgeschwächt werden.
  - severity: low
    issue: Der Vergleichssatz endet bei „nicht einmal allein sein gewaltiger Kopf“ elliptisch und lässt die beschädigte Überlieferung zu stark semantisch ausdeuten.
    rationale: Eine vollständige Formulierung mit „hätte hindurchgepasst“ ist natürliches Deutsch; „gewaltig“ wird entfernt, weil der Zeuge nicht ausdrücklich die Größe, sondern die bloße Masse des Kopfes benennt.
  revised_text: 'Apollinarius:


    „Judas starb nicht durch Erhängen, sondern blieb am Leben, nachdem man ihn herabgeschnitten hatte, bevor er erstickte. Auch die Apostelgeschichte zeigt dies: Kopfüber stürzend zerbarst er in der Mitte, und alle seine Eingeweide quollen heraus. Papias, der Schüler des Johannes, berichtet dies im vierten Buch der Auslegung der Worte des Herrn ausführlicher wie folgt:[a]


    Judas ging in dieser Welt als ein schreckliches Beispiel der Gottlosigkeit umher. Sein Fleisch war so stark angeschwollen, dass er dort, wo ein Wagen [Text unklar] mühelos hindurchfahren konnte, selbst nicht hindurchkam – nein, nicht einmal sein Kopf allein hätte hindurchgepasst. Man sagt, seine Augenlider seien in einem solchen Maß [Lücke] angeschwollen, dass er überhaupt kein Licht sehen konnte. Seine Augen wiederum waren nicht einmal für einen Arzt sichtbar, der durch ein Instrument schaute, so tief waren sie unter die Oberfläche zurückgesunken …“[b]


    Zusammengestellt nach Cramer, Catena ad Acta SS. Apost. (1838), S. 12 f., und weiteren Quellen.[c]'
