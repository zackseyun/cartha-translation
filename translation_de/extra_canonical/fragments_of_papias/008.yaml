base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/008.yaml
  text: 'But thus says Papias—I quote him word for word:


    “To some of them, clearly the angels which at first were holy, He gave dominion also over the arrangement of the universe; He commissioned them to exercise their dominion well.”


    And he says next:


    “But it so befel that their array came to nought; for the gre[at] dragon, the old serpent, who is also called Satan and the devi[l], was cast down, yea, and was cast down to the earth, he and h[is] angels.”


    Andreas of Caesarea, in Apocalypsin, c. 34, serm. 12.'
translation:
  language: de
  text: 'So sagt Papias – ich zitiere ihn Wort für Wort:


    „Einigen von ihnen, nämlich den Engeln, die anfangs heilig waren, gab er auch die Herrschaft über die Ordnung des Weltalls; er beauftragte sie, ihre Herrschaft gut auszuüben.“


    Und als Nächstes sagt er:


    „Doch es geschah, dass ihre Ordnung zunichtewurde; denn der große Drache, die alte Schlange, die auch Satan und der Teufel genannt wird, wurde hinabgeworfen, ja, auf die Erde wurde er hinabgeworfen – er und seine Engel.“


    Andreas von Cäsarea, Über die Offenbarung, Kapitel 34, Rede 12.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der griechische beziehungsweise lateinische Wortlaut dieses später überlieferten Fragments ist noch nicht unmittelbar geprüft worden. Die vorliegende Fassung beruht vorläufig auf dem gemeinfreien englischen Textzeugen von J. B. Lightfoot; offensichtliche Beschädigungen der dortigen Druck- beziehungsweise OCR-Wiedergabe wurden stillschweigend berichtigt.
    reason: Die Quellenangabe weist ausdrücklich darauf hin, dass eine Prüfung an der alten Sprachfassung noch aussteht; die Fußnote macht den vorläufigen textkritischen Status transparent.
lexical_decisions:
- source_word: some of them
  choice: einigen von ihnen
  rationale: Der Bezug des Pronomens bleibt im Fragment offen und wird deshalb nicht über die nachfolgende Erläuterung hinaus präzisiert.
- source_word: the arrangement of the universe
  choice: die Ordnung des Weltalls
  rationale: „Ordnung“ bewahrt sowohl den Gedanken einer geordneten Einrichtung als auch einer zugewiesenen Verwaltung; „Weltall“ ist würdig und allgemein verständlich.
- source_word: their array
  choice: ihre Ordnung
  rationale: Die Formulierung hält die Verbindung zur zuvor genannten Ordnung aufrecht, ohne eindeutig festzulegen, ob eine Rangordnung, Aufstellung oder geordnete Stellung gemeint ist.
- source_word: was cast down
  choice: wurde hinabgeworfen
  rationale: Die räumliche Abwärtsbewegung und die gewaltsame Passivform werden bewahrt.
- source_word: yea
  choice: ja
  rationale: Das verstärkende und wiederaufnehmende Element des Zeugnisses bleibt hörbar.
theological_decisions:
- issue: Identität des unausgesprochenen Handelnden im ersten Zitat
  choice: Das Pronomen „er“ bleibt ohne ergänzende Benennung stehen.
  alternative: „Gott“ ausdrücklich einsetzen.
  rationale: Obwohl Gott sachlich naheliegt, nennt das erhaltene englische Zeugnis den Handelnden nur pronominal; eine ausdrückliche Ergänzung würde die fragmentarische Form glätten.
- issue: Ursprünglicher Zustand der Engel
  choice: „die anfangs heilig waren“
  alternative: „die ursprünglich geheiligt worden waren“
  rationale: Die schlichte Zustandsaussage vermeidet eine zusätzliche Aussage darüber, wie oder durch wen ihre Heiligkeit zustande kam.
- issue: Zusammenbruch der engelhaften Ordnung
  choice: „ihre Ordnung zunichtewurde“
  alternative: „ihre Schar wurde vernichtet“
  rationale: Die gewählte Fassung legt nicht fest, ob der Text die Auflösung einer Ordnung, den Verlust einer Stellung oder die Vernichtung einer Schar bezeichnet.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Zitierstruktur. Die leicht feierliche Wiederholung „wurde hinabgeworfen, ja …“ bewahrt die rhetorische Form des Zeugnisses. Fragmentarische Bezüge und mögliche Mehrdeutigkeiten wurden nicht durch konfessionelle oder systematische Zusätze aufgelöst.
