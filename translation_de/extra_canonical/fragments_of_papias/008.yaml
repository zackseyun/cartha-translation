review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung folgt dem vorliegenden englischen Textzeugen im Wesentlichen genau und bewahrt die pronominale Unbestimmtheit des Handelnden sowie die rhetorische Wiederholung des Hinabwerfens. Da der griechische bzw. lateinische Wortlaut noch nicht unmittelbar geprüft wurde und der englische Zeuge an mehreren Stellen beschädigt ist, bleibt die Wiedergabe notwendigerweise vorläufig. „Ordnung“ ist für „arrangement“ und das textkritisch unsichere „array“ eine vertretbare, nicht übermäßig festlegende Lösung.
  naturalness: Der Text ist insgesamt modernes, würdiges Standarddeutsch. Die Zusammenschreibung „zunichtewurde“ ist jedoch orthographisch falsch; korrekt lautet es „zunichte wurde“. Außerdem gibt „offenbar“ das englische „clearly“ unmittelbarer wieder als das stärker erklärende „nämlich“.
  terminology: „Satan“, „der Teufel“, „der große Drache“ und „die alte Schlange“ sind sachgerecht und ohne konfessionelle Zusätze wiedergegeben. Für die Quellenangabe ist „Kommentar zur Offenbarung“ als deutsche Bezeichnung verständlicher und bibliographisch präziser als „Über die Offenbarung“; „Homilie“ gibt *sermo* hier angemessen wieder.
  issues:
  - severity: low
    issue: 'Orthographie: „zunichtewurde“'
    rationale: '„zunichte“ wird in dieser Verbindung getrennt geschrieben: „zunichte wurde“.'
  - severity: low
    issue: „nämlich“ statt „clearly“
    rationale: „Nämlich“ wirkt erläuternd und kann die Identifizierung stärker als eine redaktionelle Klarstellung darstellen. „Offenbar“ bildet die Adverbialnuance des englischen Zeugen unmittelbarer ab.
  - severity: low
    issue: Bezeichnung des Werks des Andreas
    rationale: „Kommentar zur Offenbarung“ ist für *in Apocalypsin* als Quellenbezeichnung klarer als „Über die Offenbarung“, ohne eine Aussage über den noch ungeprüften antiken Wortlaut zu treffen.
  revised_text: 'So sagt Papias – ich zitiere ihn Wort für Wort:


    „Einigen von ihnen, offenbar den Engeln, die anfangs heilig waren, gab er auch die Herrschaft über die Ordnung des Weltalls; er beauftragte sie, ihre Herrschaft gut auszuüben.“


    Und als Nächstes sagt er:


    „Doch es geschah, dass ihre Ordnung zunichte wurde; denn der große Drache, die alte Schlange, die auch Satan und der Teufel genannt wird, wurde hinabgeworfen, ja, auf die Erde wurde er hinabgeworfen – er und seine Engel.“


    Andreas von Cäsarea, Kommentar zur Offenbarung, Kapitel 34, Homilie 12.[a]'
