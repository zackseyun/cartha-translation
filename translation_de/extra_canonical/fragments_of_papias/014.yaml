review_pass:
  verdict: revise
  source_fidelity: Die Übersetzung gibt die im englischen Textzeugen überlieferte Negation, die beiden genannten Autoritäten, ihre Titel, die gemeinsame Zuschreibung der Aussage und die konkrete, nicht vergeistigte Rede von materiellen Speisen zuverlässig wieder. Da der griechische bzw. lateinische Wortlaut nicht vorliegt, bleibt die Quellenprüfung notwendigerweise vorläufig; die entsprechende Fußnote ist sachgerecht.
  naturalness: Die Fassung ist im Wesentlichen verständlich. Die Verbindung „wenn sie sagen“ kann im Deutschen jedoch unnötig temporal verstanden werden. „indem sie sagen“ gibt die hier gemeinte Begründungs-/Positionsangabe klarer wieder. In einer bibliographischen Quellenangabe ist „zu Stephanus Gobarus“ idiomatischer als „über Stephanus Gobarus“.
  terminology: „Himmelreich“, „Genuss“ und „materielle Speisen“ bewahren die Terminologie und den konkreten Charakter des englischen Zeugen. „Irenäus“ und „Photios“ sind im Deutschen die üblichen Namensformen. Die Wertung „heilig“ sowie „Bischof und Märtyrer“ werden als Behauptungen des Zeugen und ohne zusätzliche historische Bewertung beibehalten.
  issues:
  - severity: low
    issue: „wenn sie sagen“ ist im Deutschen mehrdeutig.
    rationale: Es kann zeitlich („zu der Zeit, wenn“) statt als Angabe der vertretenen Auffassung verstanden werden. „indem sie sagen“ stellt den Bezug zu Papias und Irenäus klarer her.
  - severity: low
    issue: „über Stephanus Gobarus“ ist als Quellenangabe weniger idiomatisch.
    rationale: Für die Angabe eines behandelten Autors bzw. Abschnitts ist „zu Stephanus Gobarus“ im deutschen wissenschaftlichen Register üblicher.
  revised_text: 'Auch darin folgt Stephanus weder Papias, dem Bischof und Märtyrer von Hierapolis, noch Irenäus, dem heiligen Bischof von Lyon, indem sie sagen, das Himmelreich werde im Genuss bestimmter materieller Speisen bestehen.[a]


    PHOTIOS, Bibliothek 232, zu Stephanus Gobarus.'
