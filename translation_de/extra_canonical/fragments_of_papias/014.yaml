base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/014.yaml
  text: 'Nor again (does Stephanus follow) Papias, the bishop and martyr of Hierapolis, nor Irenzeus, the holy bishop of Lyons, when they say that the kingdom of heaven will consist in enjoyment of certain material foods.


    PHOTIUS, Aibliotheca 232, on Stephanus Gobarus.'
translation:
  language: de
  text: 'Auch darin folgt Stephanus weder Papias, dem Bischof und Märtyrer von Hierapolis, noch Irenäus, dem heiligen Bischof von Lyon, wenn sie sagen, das Himmelreich werde im Genuss bestimmter materieller Speisen bestehen.[a]


    PHOTIUS, Bibliotheke 232, über Stephanus Gobarus.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vorläufige Übersetzung nach einem gemeinfreien englischen Textzeugen; die unmittelbare Prüfung des griechischen beziehungsweise lateinischen Quellenwortlauts steht noch aus.
    reason: Die bereitgestellte Grundlage ist ausdrücklich nur ein englischer Übersetzungszeuge; die Fußnote macht die textkritische Begrenzung transparent.
lexical_decisions:
- source_word: kingdom of heaven
  choice: Himmelreich
  rationale: Die geläufige und würdige deutsche Entsprechung bewahrt den theologischen Ausdruck des überlieferten englischen Zeugnisses.
- source_word: material foods
  choice: materielle Speisen
  rationale: Die bewusst konkrete Aussage des Zeugnisses wird beibehalten, ohne sie zu vergeistigen oder als bloßen Überfluss umzudeuten.
- source_word: enjoyment
  choice: Genuss
  rationale: Gibt die positive sinnliche Bedeutung knapp wieder; »Verzehr« wäre enger und weniger nah am überlieferten Wortlaut.
- source_word: does ... follow
  choice: folgt ...
  rationale: Bewahrt die Aussage, dass Stephanus die angeführte Auffassung nicht übernimmt oder vertritt.
theological_decisions:
- issue: Art des Himmelreichs und materieller Speisen
  choice: Die Aussage wird als Papias und Irenäus zugeschriebene Lehre wiedergegeben, ohne sie näher zu erklären.
  alternative: Die Speisen ausdrücklich als endzeitliche oder sinnbildliche Güter deuten.
  rationale: Das Fragment berichtet nur polemisch über die Auffassung; eine weitergehende Deutung würde die bestehende theologische Spannung unzulässig auflösen.
- issue: Bezug von »wenn sie sagen«
  choice: Das Pronomen bezieht sich grammatisch auf Papias und Irenäus.
  alternative: Die Aussage ausschließlich Papias zuschreiben.
  rationale: Der überlieferte englische Zeuge nennt beide gemeinsam; mangels abgeschlossener Prüfung des griechischen Wortlauts soll diese Zuordnung nicht eingeengt werden.
translation_notes:
  register: 'Modernes Standarddeutsch in sachlich-würdigem, quellennahem Stil. Offensichtliche Druckfehler des englischen Zeugnisses wurden stillschweigend berichtigt: »Irenzeus« zu »Irenaeus/Irenäus« und »Aibliotheca« zu »Bibliotheca/Bibliotheke«. Die Klammerergänzung des englischen Zeugnisses wurde für einen natürlichen deutschen Satzbau integriert; wegen der noch ausstehenden Prüfung der alten Sprachquelle bleibt der Entwurf ausdrücklich vorläufig.'
