translation:
  language: de
  text: 'Irenäus, ein Schüler des Papias, der ein Hörer des Johannes des Eva[…][a] war, berichtet.


    — Hieronymus, An Theodora, Brief 75 (29), Kapitel 3'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der für diesen Entwurf verfügbare englische Textzeuge bricht hier nach „John the Eva“ ab. Wahrscheinlich liegt eine unvollständige Wiedergabe vor; bis zur Prüfung der griechischen beziehungsweise lateinischen Quelle wird der Ausdruck nicht ergänzt.
    reason: Kennzeichnet transparent die Unvollständigkeit der derzeitigen Textgrundlage und vermeidet eine unbelegte Konjektur.
lexical_decisions:
- source_word: Irenzeus
  choice: Irenäus
  rationale: Der im englischen Zeugen gebotene Name wird in der etablierten modernen deutschen Namensform wiedergegeben.
- source_word: disciple
  choice: Schüler
  rationale: „Schüler“ gibt das Verhältnis natürlich und ohne zusätzliche kirchliche Festlegung wieder.
- source_word: hearer
  choice: Hörer
  rationale: Die wörtliche Bezeichnung wird bewahrt; sie kann sowohl unmittelbares Zuhören als auch ein Schülerverhältnis andeuten, ohne dies festzulegen.
- source_word: relates
  choice: berichtet
  rationale: „Berichtet“ ist eine natürliche, sachliche Wiedergabe für die Einführung einer überlieferten Aussage.
theological_decisions:
- issue: Bezug des Relativsatzes „who was a hearer of John“
  choice: Der Relativsatz wird grammatisch auf Papias bezogen.
  alternative: Bezug auf Irenäus
  rationale: Im vorliegenden englischen Zeugen steht der Relativsatz unmittelbar nach „Papias“; die deutsche Fassung erhält diesen naheliegenden syntaktischen Bezug, ohne weitergehende historische Behauptungen einzuführen.
- issue: Unvollständige Bezeichnung „John the Eva“
  choice: Die unvollständige Form wird sichtbar als „Johannes des Eva[…]“ wiedergegeben.
  alternative: Konjekturale Ergänzung zu „Johannes des Evangelisten“
  rationale: Da die direkte Prüfung der griechischen beziehungsweise lateinischen Quelle noch aussteht und der vorliegende Zeuge an dieser Stelle abbricht, wird keine Ergänzung als sicherer Text ausgegeben.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe fragmentarische Form des Zeugen bleibt erhalten. Wegen der noch ausstehenden Prüfung der griechischen beziehungsweise lateinischen Quelle ist die Fassung ausdrücklich vorsichtig und ergänzt den abgebrochenen Ausdruck nicht.
