lexical_decisions:
- source_word: John the Divine
  choice: Johannes, der Theologe
  rationale: Der traditionelle spätantike Ehrentitel wird dignifiziert und möglichst wörtlich wiedergegeben; »der Göttliche« wäre im heutigen Deutsch missverständlich.
- source_word: Oracles of the Lord
  choice: Aussprüche des Herrn
  rationale: »Aussprüche« bewahrt den möglichen Sinn von Logien beziehungsweise überlieferten Herrenworten, ohne das Werk enger als »Prophezeiungen« zu bestimmen.
- source_word: the Elder
  choice: der Älteste
  rationale: Die substantivische Personenbezeichnung bleibt erhalten und wird nicht stillschweigend mit einem kirchlichen Amtstitel gleichgesetzt.
- source_word: catholic Epistles
  choice: katholische Briefe
  rationale: Der historische Fachausdruck wird beibehalten und durch eine Fußnote gegen ein modernes konfessionelles Missverständnis abgesichert.
- source_word: Millennium
  choice: Tausendjähriges Reich
  rationale: Dies ist die geläufige deutsche Wiedergabe des eschatologischen Begriffs; die wertende Aussage des Zeugen wird weder verstärkt noch abgeschwächt.
- source_word: received the honour of martyrdom
  choice: wurde ihm die Ehre des Martyriums zuteil
  rationale: Die positive, ehrende Wertung des antiken Erzählers bleibt gewahrt, ohne den behaupteten Sachverhalt zusätzlich zu bestätigen.
theological_decisions:
- issue: Identität der verschiedenen Johannesgestalten
  choice: Die Bezeichnungen des Zeugen werden beibehalten, ohne Johannes den Theologen, den Apostel und den Ältesten redaktionell gleichzusetzen.
  alternative: Alle Erwähnungen ausdrücklich auf Johannes den Apostel oder auf Johannes den Ältesten beziehen.
  rationale: Das Fragment selbst enthält Spannung und möglicherweise unterschiedliche Überlieferungen; eine Harmonisierung würde die echte historische und theologische Unklarheit verdecken.
- issue: Bewertung des Tausendjährigen Reiches
  choice: Die Aussage »Papias irrt« wird als Urteil des überliefernden Autors direkt wiedergegeben.
  alternative: Das Urteil neutralisieren oder als objektive Lehrentscheidung formulieren.
  rationale: Die Übersetzung soll die polemische Stimme des Zeugen erhalten, sie aber nicht als redaktionelle Position der Ausgabe ausgeben.
- issue: Berichte von Gifttrinken und Totenerweckungen
  choice: Die Behauptungen stehen in berichteter Rede beziehungsweise mit Quellenkennzeichnung.
  alternative: Sie als erwiesene Wunder bestätigen oder rationalistisch abschwächen.
  rationale: So bleibt der Anspruch des Fragments sichtbar, ohne die historische Bewertung vorwegzunehmen.
- issue: Martyrium des Johannes
  choice: 'Die widersprüchliche Überlieferung wird unverändert wiedergegeben: Der Text behauptet Tötung beziehungsweise Martyrium und zitiert zugleich Eusebius mit »starb in Ephesus«.'
  alternative: Beide Angaben harmonisieren oder eine davon verwerfen.
  rationale: Die Spannung gehört zum überlieferten Fragment und darf nicht stillschweigend gelöst werden.
- issue: Aussage »Gott kann nicht lügen«
  choice: Wörtlich und ohne erläuternde dogmatische Ergänzung wiedergegeben.
  alternative: Auf eine bestimmte Schrift- oder Irrtumslosigkeitslehre zuspitzen.
  rationale: Der unmittelbare Argumentationsgang des Zeugen wird bewahrt, ohne eine spätere konfessionelle Systematik einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit historisch-kirchlichem Ton. Lange Perioden wurden behutsam gegliedert, Eigennamen in geläufigen deutschen Formen wiedergegeben und wertende Aussagen klar der antiken Zeugenstimme belassen. Da eine direkte Prüfung des griechischen beziehungsweise lateinischen Wortlauts noch aussteht, beruht dieser Entwurf auf dem angegebenen gemeinfreien englischen Textzeugen; offensichtliche OCR-Schäden wurden vorsichtig behoben, echte Identitäts- und Überlieferungsspannungen dagegen nicht harmonisiert.
