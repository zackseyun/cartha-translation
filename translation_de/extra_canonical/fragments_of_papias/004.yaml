  source_fidelity: 'Die Übersetzung folgt dem bereitgestellten englischen Textzeugen insgesamt sorgfältig und bewahrt dessen ausdrücklich markierte Ergänzungen sowie die Spannungen der Überlieferung. Eine sachlich relevante, sichere Korrektur ist erforderlich: Die Apokalypse wird dem im vorangehenden Satz als »der Älteste« bezeichneten zweiten Johannes zugeschrieben. »des älteren Johannes« verschiebt dies im Deutschen zu einem bloß vergleichenden Ausdruck und sollte als Titelbezeichnung wiedergegeben werden.'
  naturalness: Modernes Standarddeutsch, gut lesbar und dem historiographisch-kirchlichen Register angemessen. Die Satzgliederung ist klar. Die Korrektur von »älteren Johannes« zu »Johannes des Ältesten« verbessert zugleich Präzision und idiomatische Klarheit.
  terminology: Die Wiedergaben »Johannes, der Theologe«, »Aussprüche des Herrn«, »der Älteste«, »katholische Briefe«, »Tausendjähriges Reich« und »Martyrium« sind angemessen. Die vorhandenen Fußnoten erläutern Titel, Fachausdruck und beschädigte Zuschreibungen zurückhaltend, ohne die textinternen Identitätsfragen dogmatisch aufzulösen.
  issues:
  - severity: medium
    issue: »… für ein Werk des älteren Johannes«
    rationale: Der englische Zeuge erläutert ausdrücklich »the Elder John’s«. Da »the Elder« zuvor als Titel »der Älteste« eingeführt ist, muss auch hier die Titelbezeichnung erhalten bleiben. »älteren Johannes« kann lediglich ein relatives Altersverhältnis ausdrücken und verwischt die überlieferte Benennung.
