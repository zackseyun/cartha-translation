base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/004.yaml
  text: 'Papias, bishop of Hierapolis, who was a disciple of John the Divine [and] a companion of Polycarp, wrote five books of Oracles of the Lord, [and] when giving a list of the apostles, after Peter and John, Philip and Thoma[s], and Matthew, he included among the disciples of the Lord Aristion [and] a second John, whom also he called “the Elder.” [He says] that some [think] that this John is the author of the two short and catholic epistles, [which] are published in the name of John; and he gives as the reason that the primitive (fathers) only accept the first epistle. Some too have wrong[ly] considered the Apocalypse also to be his—that is, the Elder John’s—[work]. Papias too is in error about the Millennium, and from him Iren[aeus] also [erred].


    Papias in his second book says that John the Divine and James his broth[er] were killed by the Jews. The aforesaid Papias stated on the authority of the daughters of Philip that Barsabas, who is also called Justus, when challenged by the unbelievers drank serpent’s poison in the name of the Lord, and was shielded from all harm. He makes also other marvellous statements, and particularly about the mother of Manaim who was raised from the dead. As for those who were raised from the dead by Christ, [he states] that they survived till the time of Hadrian.


    PHILIPPUS OF SIDE (?) Afist. Christ.


    VI.


    After Domitian Nerva reigned one year, who recalled John from the [i]sland (i.e. Patmos), and allowed him to dwell in Ephesus. He was at that time the sole survivor of the twelve apostles, and after writing his Gospel received the honour of martyrdom. For Papias, bishop of Hierapolis, who was an eye-witness of him, in the second book of the Oracles of the Lord says that he was killed by the Jews, and thereby evidently fulfilled, together with his brother, Christ’s prophecy concerning them, and their own confession and undertaking on His behalf. For when the Lord said to them, “Are ye able to drink of the cup that I drink of?” and they readily assented and agreed, He said, “My cup shall ye drink, and with the baptism that I am [ba]ptized [with] shall ye be baptized.” And reasonably so, for it is impossible for God to lie. So too the learned Origen affirms in his interpretation of S. Matthew’s Gospel that John was martyred, declaring that he had learnt the fact from the successors of the
    apostles. And indeed the well-informed Eusebius also in his Ecclesiastical History says: “Thomas received by lot Parthia, but John [received] Asia, where also he made his residence and died at [E]phesus[?].”


    GEORGIUS HAMARTOLUS, Chronicon.'
translation:
  language: de
  text: 'Papias, der Bischof von Hierapolis, war ein Schüler des Johannes, des Theologen,[a] und ein Gefährte Polykarps. Er schrieb fünf Bücher mit Aussprüchen des Herrn. Als er die Apostel aufzählte, führte er nach Petrus und Johannes, Philippus und Thomas sowie Matthäus unter den Jüngern des Herrn auch Aristion und einen zweiten Johannes an, den er ebenfalls »den Ältesten« nannte. [Er sagt,] manche seien der Ansicht, dieser Johannes sei der Verfasser der beiden kurzen katholischen Briefe,[b] die unter dem Namen des Johannes verbreitet sind. Als Begründung nennt er, dass die frühen Väter nur den ersten Brief anerkennen. Einige haben auch die Offenbarung zu Unrecht für sein Werk gehalten, das heißt für ein Werk des älteren Johannes. Auch Papias irrt hinsichtlich des Tausendjährigen Reiches, und mit ihm ebenso Irenäus.


    Papias sagt in seinem zweiten Buch, Johannes, der Theologe, und sein Bruder Jakobus seien von den Juden getötet worden. Der genannte Papias berichtete aufgrund des Zeugnisses der Töchter des Philippus, Barsabbas, der auch Justus genannt wird, habe, als die Ungläubigen ihn herausforderten, im Namen des Herrn Schlangengift getrunken und sei vor jedem Schaden bewahrt worden. Er berichtet noch weitere wunderbare Dinge, besonders über die Mutter des Manaim, die von den Toten auferweckt worden sei. Über diejenigen, die Christus von den Toten auferweckt hatte, sagt er, sie hätten bis in die Zeit Hadrians gelebt.


    PHILIPPUS VON SIDE (?), Hist. Christ.[c]


    VI.


    Nach Domitian regierte Nerva ein Jahr. Er rief Johannes von der Insel, das heißt von Patmos, zurück und gestattete ihm, in Ephesus zu wohnen. Johannes war damals der einzige noch lebende von den zwölf Aposteln. Nachdem er sein Evangelium geschrieben hatte, wurde ihm die Ehre des Martyriums zuteil. Denn Papias, der Bischof von Hierapolis, der ihn mit eigenen Augen gesehen hatte, sagt im zweiten Buch der Aussprüche des Herrn, Johannes sei von den Juden getötet worden. Damit erfüllte er zusammen mit seinem Bruder offenkundig die Weissagung Christi über sie sowie ihr eigenes Bekenntnis und ihre Bereitschaft, für ihn einzustehen. Denn als der Herr sie fragte: »Könnt ihr den Kelch trinken, den ich trinke?«, stimmten sie bereitwillig zu. Da sagte er: »Meinen Kelch werdet ihr trinken, und mit der Taufe, mit der ich getauft werde, werdet ihr getauft werden.« Das ist folgerichtig, denn es ist unmöglich, dass Gott lügt.


    Ebenso bestätigt der gelehrte Origenes in seiner Auslegung des Evangeliums nach Matthäus, dass Johannes als Märtyrer starb. Er erklärt, er habe dies von den Nachfolgern der Apostel erfahren. Auch der sachkundige Eusebius sagt in seiner Kirchengeschichte: »Thomas erhielt durch das Los Parthien, Johannes aber Asia; dort nahm er auch seinen Wohnsitz und starb in Ephesus.«[d]


    GEORGIOS HAMARTOLOS, Chronik.


    [a] Die Bezeichnung »der Theologe« gibt den überlieferten Ehrentitel wieder; welche Person namens Johannes jeweils gemeint ist, wird im Fragment nicht durchgehend eindeutig geklärt.

    [b] »Katholisch« bedeutet hier »allgemein« beziehungsweise »an die ganze Kirche gerichtet« und ist keine spätere Konfessionsbezeichnung.

    [c] Die Quellenangabe ist in der vorliegenden Druckvorlage beschädigt; auch die Zuschreibung an Philippus von Side ist unsicher.

    [d] Der vorliegende Textzeuge weist am Ende des Zitats Beschädigungen beziehungsweise unsichere Zeichen auf; »Ephesus« ist jedoch die naheliegende Lesart.'
