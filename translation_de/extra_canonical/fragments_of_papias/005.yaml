review_pass:
  verdict: revise
  source_fidelity: Eine sichere Korrektur ist bei der Wiedergabe von „promiscuous statements“ und besonders bei der Schlussformel über die „lebendige Stimme“ angezeigt. Der lateinische Wortlaut bei Hieronymus ("vivae vocis usque hodie in suis auctoribus personantis") stützt keine Übersetzung mit „in den Verfassern“ im modernen Sinn. Die Unterscheidung zwischen den früheren Aussagen der Apostel und den gegenwärtigen Aussagen Aristions und des Presbyters Johannes bleibt erhalten.
  naturalness: Der Entwurf ist insgesamt flüssiges, modernes Standarddeutsch. „hat die Apostel als Gewährsleute“ ist jedoch weniger idiomatisch als „beruft sich auf die Apostel als Gewährsleute“; „in den Verfassern erklingt“ ist zudem semantisch und stilistisch missverständlich.
  terminology: „Hörer“, „Presbyter“, „Gewährsleute“, „Herrenworte“ und „tausendjähriges Reich“ sind angemessen. Für „in the flesh“ ist „leiblich“ quellentreuer als das etwas freiere „leibhaftig“.
  issues:
  - severity: medium
    issue: „beliebige Aussagen“ für „promiscuous statements“
    rationale: Der Zeuge beschreibt hier das Nichtfolgen unterschiedlicher bzw. ungeprüft übernommener Meinungen; „beliebig“ kann im Deutschen primär „willkürlich“ bedeuten und trifft die Aussage weniger genau.
  - severity: high
    issue: „die ... in den Verfassern erklingt“
    rationale: Die Formulierung folgt zwar der beschädigten englischen Druckvorlage, ist aber im Deutschen missverständlich und der bei Hieronymus überlieferten Formel „in suis auctoribus“ nicht angemessen. Gemeint sind die Träger bzw. Gewährsleute der mündlichen Überlieferung, nicht literarische Verfasser.
  - severity: low
    issue: „leibhaftig“ für „in the flesh“
    rationale: „Leiblich“ gibt die körperliche Aussage unmittelbarer wieder und vermeidet die leicht idiomatisierende Nuance von „leibhaftig“.
  revised_text: 'Papias, ein Hörer des Johannes und Bischof von Hierapolis in Asia,[a] schrieb nur fünf Bücher, denen er den Titel Auslegung der Herrenworte gab. Darin erklärt er im Vorwort, dass er nicht verschiedenen Meinungen folge, sondern sich auf die Apostel als Gewährsleute berufe, und sagt:


    „Ich pflegte nachzufragen, was Andreas oder Petrus oder Philippus oder Thomas oder Jakobus oder Johannes oder Matthäus oder irgendein anderer Jünger des Herrn gesagt hatte und was Aristion und der Presbyter Johannes, die Jünger des Herrn, sagten. Denn Bücher zu lesen nützt mir nicht so viel wie die lebendige Stimme, die bis heute deutlich aus ihren Gewährsleuten vernehmbar ist.“[b]


    Daraus geht klar hervor, dass in seiner Namensliste selbst ein Johannes zu den Aposteln gerechnet wird und ein anderer, der Presbyter Johannes, den er nach Aristion aufführt. Wir haben diese Tatsache wegen der oben erwähnten Aussage angeführt, die wir auf die Autorität sehr vieler hin überliefert haben: Die beiden späteren Briefe des Johannes stammen nicht vom Apostel, sondern vom Presbyter. Von diesem Papias heißt es, er habe die jüdische Überlieferung von einem tausendjährigen Reich verbreitet. Ihm folgen Irenäus, Apollinaris und die anderen, die sagen, der Herr werde nach der Auferstehung leiblich mit den Heiligen herrschen.


    HIERONYMUS, Über berühmte Männer 18.


    VIII.


    Ferner ist das falsche Gerücht zu mir gedrungen, ich hätte die Bücher des Josephus sowie die Schriften des Papias und Polykarp übersetzt. Doch ich habe weder die Zeit noch die Kraft, Werke dieser Art mit entsprechender sprachlicher Eleganz in eine andere Sprache zu übertragen.


