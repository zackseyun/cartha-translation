base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/005.yaml
  text: 'Papias, a hearer of John, (and) bishop of Hierapolis in Asia, wrote only five books, which he entitled An Exposition of Discourses of the Lord. Wherein, when he asserts in his preface that he is not following pro-[m]iscuous statements, but has the Apostles as his authorities, he says:


    “I used to inquire what had been said by Andrew, or by [Pe]ter, or by Philip, or by Thomas or James, or by John or Matthew or any other of the Lord’s disciples, and what Aristion [a]nd the Elder John, the disciples of the Lord, were saying. [F]or books to read do not profit me so much as the living [v]oice clearly sounding up to the present day in (the persons of) authors.”


    From which it is clear that in his list of names itself there is one John who is reckoned among the Apostles, and another, the Elder John, whom he enumerates after Aristion. We have mentioned this fact on account of the statement made above, which we have recorded on the authority of very — many, that the two later epistles of John are not (the work) of the Apostle, but of the Elder. This (Papias) is said to have promulgated the Jewish tradition of a Millennium, and he is followed by Irenaeus, Apollinarius, and the others, who say that after the resurrection the Lord will reign in the flesh with the saints.


    JEROME, On Illustrious Men 18.


    VIII.


    Further, a false rumour has reached me that the books of Josephus and the writings of Papias and Polycarp have been translated by me; but I have neither leisure nor strength to render such works as these with corresponding elegance into another tongue.


    JEROME, To Lucinius, Letter 71 (28), chapter 5.'
translation:
  language: de
  text: 'Papias, ein Hörer des Johannes und Bischof von Hierapolis in Asia,[a] schrieb nur fünf Bücher, denen er den Titel Auslegung der Herrenworte gab. Darin erklärt er im Vorwort, dass er sich nicht auf beliebige Aussagen stützt, sondern die Apostel als Gewährsleute hat, und sagt:


    „Ich pflegte nachzufragen, was Andreas gesagt hatte oder Petrus oder Philippus oder Thomas oder Jakobus oder Johannes oder Matthäus oder irgendein anderer Jünger des Herrn, und was Aristion und der Presbyter Johannes, die Jünger des Herrn, sagten. Denn Bücher zu lesen nützt mir nicht so viel wie die lebendige Stimme, die bis in die Gegenwart deutlich in den Verfassern erklingt.“[b]


    Daraus geht klar hervor, dass in seiner Namensliste selbst ein Johannes zu den Aposteln gerechnet wird und ein anderer, der Presbyter Johannes, den er nach Aristion aufführt. Wir haben diese Tatsache wegen der oben erwähnten Aussage angeführt, die wir auf die Autorität sehr vieler hin überliefert haben: Die beiden späteren Briefe des Johannes stammen nicht vom Apostel, sondern vom Presbyter. Von diesem Papias heißt es, er habe die jüdische Überlieferung von einem tausendjährigen Reich verbreitet. Ihm folgen Irenäus, Apollinaris und die anderen, die sagen, der Herr werde nach der Auferstehung leibhaftig mit den Heiligen herrschen.


    HIERONYMUS, Über berühmte Männer 18.


    VIII.


    Ferner ist das falsche Gerücht zu mir gedrungen, ich hätte die Bücher des Josephus sowie die Schriften des Papias und Polykarp übersetzt. Doch ich habe weder die Zeit noch die Kraft, Werke dieser Art mit entsprechender sprachlicher Eleganz in eine andere Sprache zu übertragen.


    HIERONYMUS, An Lucinius, Brief 71 (28), Kapitel 5.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Asia bezeichnet hier die römische Provinz Asia im Westen Kleinasiens, nicht den gesamten Kontinent Asien.
    reason: Historisch-geografische Klarstellung, um ein modernes Missverständnis zu vermeiden.
  - marker: b
    text: Die zugrunde liegende englische Druckvorlage ist an dieser Stelle beschädigt. Die Wendung „in den Verfassern“ folgt ihr vorläufig; in anderen Überlieferungsformen des Papias-Zitats steht sinngemäß die lebendige und bleibende Stimme im Gegensatz zu Mitteilungen aus Büchern. Eine direkte Prüfung des griechischen beziehungsweise lateinischen Wortlauts steht noch aus.
    reason: Kennzeichnet eine textkritisch und sprachlich unsichere Stelle, statt die beschädigte Vorlage stillschweigend zu glätten.
lexical_decisions:
- source_word: hearer of John
  choice: Hörer des Johannes
  rationale: Bewahrt die traditionelle, sachlich offene Bezeichnung für einen Menschen, der Johannes persönlich gehört haben soll, ohne daraus ausdrücklich ein formelles Schülerverhältnis zu machen.
- source_word: An Exposition of Discourses of the Lord
  choice: Auslegung der Herrenworte
  rationale: Gibt den Werktitel knapp und idiomatisch wieder; „Herrenworte“ lässt offen, ob einzelne Aussprüche oder umfassendere Überlieferungen gemeint sind.
- source_word: promiscuous statements
  choice: beliebige Aussagen
  rationale: Bezeichnet ungeprüfte oder unterschiedslos aufgenommene Mitteilungen, ohne die heute irreführende sexuelle Nebenbedeutung von „promisk“.
- source_word: authorities
  choice: Gewährsleute
  rationale: Passt zum historischen Erkundungszusammenhang und vermeidet, „Autoritäten“ institutionell oder lehramtlich zu überladen.
- source_word: the Elder John
  choice: der Presbyter Johannes
  rationale: „Presbyter“ wahrt die mögliche Amts- oder Ehrenbezeichnung und entspricht dem kirchengeschichtlichen Sprachgebrauch besser als eine eindeutige Altersangabe.
- source_word: living voice
  choice: die lebendige Stimme
  rationale: Bewahrt das markante Bild der mündlichen, noch gegenwärtigen Überlieferung.
- source_word: Millennium
  choice: tausendjähriges Reich
  rationale: Macht den gemeinten eschatologischen Zeitraum allgemein verständlich, ohne eine spätere konfessionelle Systematik einzuführen.
- source_word: in the flesh
  choice: leibhaftig
  rationale: Drückt eine reale körperliche Herrschaft aus, ohne das im Deutschen missverständliche „im Fleisch“ zu verwenden.
- source_word: corresponding elegance
  choice: entsprechender sprachlicher Eleganz
  rationale: Gibt den Anspruch an eine stilistisch angemessene Übertragung natürlich wieder.
theological_decisions:
- issue: Identität der beiden genannten Johannesgestalten
  choice: Die Unterscheidung zwischen dem zu den Aposteln gerechneten Johannes und dem Presbyter Johannes wird als Aussage des überliefernden Autors wiedergegeben.
  alternative: Beide Johannesgestalten identifizieren oder die Unterscheidung als historisch gesichert formulieren.
  rationale: Der Text zieht diese Folgerung, doch die Übersetzung soll weder darüber hinausgehen noch die historische Streitfrage entscheiden.
- issue: Verfasserschaft der beiden späteren Johannesbriefe
  choice: Die Zuschreibung an den Presbyter bleibt ausdrücklich als überlieferte Behauptung im Rahmen des Zitats stehen.
  alternative: Die Briefe direkt und ohne Distanz dem Presbyter zuschreiben oder traditionell dem Apostel zuordnen.
  rationale: So bleibt die historiografische Distanz des Zeugen erhalten und keine kanonische Verfasserfrage wird stillschweigend entschieden.
- issue: Tausendjährige Herrschaft
  choice: Die Aussage wird als Papias zugeschriebene jüdische Überlieferung und als Ansicht seiner Nachfolger formuliert.
  alternative: Die Lehre als biblische Tatsache bestätigen oder als Irrtum verwerfen.
  rationale: Die Übersetzung gibt die polemisch-historische Aussage des Hieronymus wieder, ohne eine millennialistische Position einzunehmen.
- issue: Auferstehung und leibhaftige Herrschaft
  choice: „nach der Auferstehung ... leibhaftig mit den Heiligen herrschen“
  alternative: „nach ihrer Auferstehung“ oder „nach der Auferstehung des Herrn“
  rationale: Der Bezug von „der Auferstehung“ ist im vorliegenden Zeugen nicht näher bestimmt; die deutsche Fassung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit kirchengeschichtlich verständlichen Fachbegriffen. Die Übersetzung ist wegen der noch ausstehenden Prüfung der griechischen beziehungsweise lateinischen Quellen vorläufig und folgt dem bereitgestellten gemeinfreien englischen Zeugen; offensichtliche Scanbrüche wurden behutsam bereinigt. Die Abschnittsangabe VIII und die Quellenüberschriften wurden beibehalten.
