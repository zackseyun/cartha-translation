  revised_footnotes:
  - marker: a
    text: Asia bezeichnet hier die römische Provinz Asia im Westen Kleinasiens, nicht den gesamten Kontinent Asien.
    reason: Historisch-geografische Klarstellung, um ein modernes Missverständnis zu vermeiden.
  - marker: b
    text: Die englische Druckvorlage ist an dieser Stelle beschädigt. Die Formulierung folgt vorläufig dem bei Hieronymus überlieferten lateinischen Wortlaut, der wörtlich von einer „lebendigen Stimme“ spricht, die „bis heute in ihren Gewährsleuten widerhallt“. Die genaue Beziehung zu den griechischen Überlieferungsformen des Papias-Zitats bedarf weiterer textkritischer Prüfung.
    reason: Kennzeichnet die beschädigte Vorlage und erläutert die vorsichtige, quellentreue Wiederherstellung, ohne eine umstrittene griechische Lesart festzulegen.
  revision_rationale: Die Überarbeitung beseitigt die missverständliche Rede von „Verfassern“, präzisiert die Aussage über unterschiedliche Meinungen und glättet die Ausdrucksweise, ohne historische oder theologische Streitfragen zu entscheiden. Die Fußnote dokumentiert weiterhin den vorläufigen Charakter der textkritisch schwierigen Stelle.
