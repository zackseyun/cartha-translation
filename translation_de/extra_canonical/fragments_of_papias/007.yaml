review_pass:
  verdict: revise
  source_fidelity: 'Die vorliegende Fassung behandelt den Abschnitt zwischen „Apokalypse“ und „Kyrill“ als umfangreiche Lücke. Der bereitgestellte englische Zeuge ist zwar durch Zeilenumbruch/OCR beschädigt, überliefert aber noch erkennbar „I mean, the Divine … Cyril“. Daher sollte nicht ein fehlender Satzteil eingesetzt werden; vielmehr ist die Apposition „ich meine: die Apokalypse“ und das Ehrenepitheton „der göttliche Kyrill“ wiederzugeben. Die unsichere Lesung Papias ist weiterhin kenntlich zu machen.'
  naturalness: Die Satzfügung wird mit „Zeugnis für seine Echtheit ablegen“ idiomatischer und klarer. „Männer einer älteren Generation“ bleibt nah am Zeugen, wird aber als durch die folgenden Namen erläuterte Gruppe sauber eingebunden.
  terminology: „Inspiration“ und „Echtheit“ sind vorsichtige, moderne und theologisch nicht überbestimmende Entsprechungen. „Der göttliche Kyrill“ gibt das im englischen Zeugen sichtbare ehrende Prädikat „the Divine“ wieder, ohne daraus eine zusätzliche Lehrbehauptung abzuleiten.
  issues:
  - severity: high
    issue: Eine nicht durch den Zeugen gedeckte umfangreiche Textlücke wird in den deutschen Haupttext eingefügt.
    rationale: Der englische Zeuge/POB-Audit-Text ist beschädigt, enthält jedoch die wesentlichen Bestandteile „I mean“ und „the Divine … Cyril“. Die deutsche Fassung lässt dadurch eine vorhandene Aussage aus und verschiebt die Syntax.
  - severity: medium
    issue: Das Epitheton zu Kyrill („the Divine“) fehlt.
    rationale: Dieses Element ist im überlieferten englischen Wortlaut erkennbar und soll als historisches Ehrenepitheton übersetzt werden.
  - severity: low
    issue: Die Fußnote zur angeblichen Lücke beschreibt den Befund zu weitgehend.
    rationale: Eine OCR- bzw. Zeilenumbruchbeschädigung liegt vor, aber keine sicher feststellbare Lücke von mehreren Wörtern zwischen Apokalypse und Kyrill.
  revised_text: 'Was jedoch die Inspiration des Buches – ich meine: der Apokalypse – betrifft, so legen der göttliche Kyrill sowie Männer einer älteren Generation, [Papias?][a], Irenäus, Methodius und Hippolyt, Zeugnis für seine Echtheit ab.


    ANDREAS VON CÄSAREA, Vorrede zur Apokalypse.'
  revised_footnotes:
  - marker: a
    text: Der Name „Papias“ ist in der vorliegenden Druckwiedergabe verstümmelt und daher nur eine wahrscheinliche Ergänzung.
    reason: Macht die textkritische Unsicherheit beim Eigennamen transparent.
  revision_rationale: 'Die Revision gibt die trotz OCR-/Zeilenumbruchsfehlern erkennbare Struktur des englischen Zeugen wieder: „I mean“ wird als erläuternde Selbstkorrektur wiedergegeben und „the Divine Cyril“ als Ehrenepitheton. Die unsichere Namenslesung Papias bleibt markiert. Die nicht hinreichend belegte Lückenmarkierung samt Fußnote entfällt.'
