base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/007.yaml
  text: 'With regard, however, to the inspiration of the book (that is, the Apocal—


    mean, the Divine) and Cyril, and men of an older generation as well, [Papias?], Irenzeus, Methodius, and Hippolytus bear testimony to its genuineness.


    ANDREAS OF C[A]ESAREA, preface to the Apocalypse.'
translation:
  language: de
  text: 'Was jedoch die Inspiration des Buches – das heißt der Apokalypse – betrifft, so bezeugen [in der beschädigten Textstelle fehlen mehrere Wörter][a] sowie Kyrill und auch Männer einer älteren Generation, [Papias?][b], Irenäus, Methodius und Hippolyt, seine Echtheit.


    ANDREAS VON CÄSAREA, Vorrede zur Apokalypse.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die herangezogene englische Textüberlieferung ist nach „Apocal—“ bis vor „and Cyril“ beschädigt beziehungsweise unvollständig. Der fehlende Wortlaut lässt sich auf dieser Grundlage nicht zuverlässig wiederherstellen.
    reason: Kennzeichnet eine erhebliche Lücke im einzigen hier bereitgestellten Textzeugen und verhindert eine scheinbar sichere Rekonstruktion.
  - marker: b
    text: Der Name „Papias“ ist in der vorliegenden Druckwiedergabe verstümmelt und daher nur wahrscheinliche Ergänzung.
    reason: Macht die textkritische Unsicherheit beim Eigennamen transparent.
lexical_decisions:
- source_word: inspiration
  choice: Inspiration
  rationale: Der englische Zeuge bietet einen theologischen Fachbegriff; ohne abgeschlossene Prüfung des griechischen beziehungsweise lateinischen Wortlauts bleibt die nahe, im Deutschen verständliche Wiedergabe am sichersten.
- source_word: the book (i.e. the Apocalypse)
  choice: das Buch – das heißt die Apokalypse –
  rationale: Bewahrt die erläuternde Apposition und bezeichnet das konkret gemeinte Werk.
- source_word: genuineness
  choice: Echtheit
  rationale: Gibt die Aussage über die Authentizität beziehungsweise Anerkennung des Buches wieder, ohne sie stärker auf Kanonizität oder Verfasserschaft festzulegen.
- source_word: bear testimony
  choice: bezeugen
  rationale: Natürliche und zugleich formnahe deutsche Entsprechung.
- source_word: men of an older generation
  choice: Männer einer älteren Generation
  rationale: Bewahrt den zeitgeschichtlichen Vergleich des Zeugen ohne zusätzliche Deutung.
theological_decisions:
- issue: Bedeutung von „inspiration“
  choice: Inspiration
  alternative: Göttlichkeit / göttliche Eingebung
  rationale: Der beschädigte englische Zeuge erlaubt keine sichere Rekonstruktion der zugrunde liegenden Terminologie; daher wird die theologische Aussage nicht enger bestimmt.
- issue: Bedeutung von „genuineness“
  choice: Echtheit
  alternative: kanonische Geltung / Glaubwürdigkeit
  rationale: „Echtheit“ erhält die relative Offenheit des Zeugnisses und vermeidet, die Aussage ausdrücklich als vollständige Kanonbestätigung auszulegen.
- issue: Unsichere Nennung des Papias
  choice: '[Papias?]'
  alternative: Papias
  rationale: Die Vorlage ist typografisch beschädigt; die wahrscheinliche Ergänzung wird sichtbar als unsicher markiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Wegen der noch ausstehenden Prüfung des griechischen beziehungsweise lateinischen Ausgangstextes ist die Fassung ausdrücklich vorläufig und stützt sich auf den beschädigten gemeinfreien englischen Zeugen. Die Fragmentlücke wird nicht stillschweigend ergänzt; Eigennamen werden in geläufiger deutscher Form wiedergegeben.
