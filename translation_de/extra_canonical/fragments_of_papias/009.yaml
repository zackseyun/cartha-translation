source:
  text: "Taking their start from Papias the great, of Hierapolis, the disciple of the\nApostle who leaned on Christ’s bosom, and Clement, Pantanus the priest of\nthe Alexandrians and Ammonius, the great scholar, those ancient and first\n expositors who agree with each other in understanding all the work of the\n six days (as referring) to Christ and His Church.\n                  ANASTASIUS OF SINAI Contempl. Anagog. in Hexaém. i."
