base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/009.yaml
  text: 'Taking their start from Papias the great, of Hierapolis, the disciple of the Apostle who leaned on Christ’s bosom, and Clement, Pantanus the priest of the Alexandrians and Ammonius, the great scholar, those ancient and first expositors who agree with each other in understanding all the work of the six days (as referring) to Christ and His Church.


    ANASTASIUS OF SINAI Contempl. Anagog. in Hexaém. i.'
translation:
  language: de
  text: 'Ausgehend von Papias dem Großen aus Hierapolis, dem Schüler des Apostels, der an der Brust Christi lag, ferner von Clemens, Pantänus, dem Priester der Alexandriner, und Ammonius, dem großen Gelehrten, verstehen jene alten und frühesten Ausleger, die darin übereinstimmen, das gesamte Sechstagewerk als auf Christus und seine Kirche bezogen.[a]


    ANASTASIUS VOM SINAI, Contempl. Anagog. in Hexaém. I.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vorläufige Übersetzung nach dem überlieferten englischen Textzeugen; eine Prüfung am griechischen oder lateinischen Wortlaut steht noch aus. Der Satzbau und besonders die genaue Zuordnung von „jene alten und frühesten Ausleger“ sind im englischen Zeugnis schwerfällig und möglicherweise mehrdeutig.
    reason: Die bereitgestellte Grundlage ist ausdrücklich nur ein gemeinfreier englischer Textzeuge; die Ausgangssprache wurde noch nicht geprüft.
lexical_decisions:
- source_word: the work of the six days
  choice: das gesamte Sechstagewerk
  rationale: Die traditionelle deutsche Sachbezeichnung gibt das Schöpfungswerk der sechs Tage prägnant und würdig wieder.
- source_word: expositors
  choice: Ausleger
  rationale: Natürlicher deutscher Ausdruck für frühe Schriftausleger, ohne eine bestimmte kirchliche Amtsstellung zu unterstellen.
- source_word: priest of the Alexandrians
  choice: Priester der Alexandriner
  rationale: Formale Wiedergabe des überlieferten englischen Zeugnisses; die möglicherweise institutionelle oder geografische Zuordnung bleibt offen.
- source_word: leaned on Christ’s bosom
  choice: an der Brust Christi lag
  rationale: Bewahrt die johanneische Anspielung in geläufiger biblischer Sprache, ohne die Identität des Apostels ausdrücklich festzulegen.
theological_decisions:
- issue: Christologische und ekklesiologische Deutung des Sechstagewerks
  choice: „als auf Christus und seine Kirche bezogen“
  alternative: „in Christus und seiner Kirche erfüllt“
  rationale: Die gewählte Form bewahrt den Charakter einer Auslegung, ohne eine stärkere Erfüllungsaussage in den Text einzutragen.
- issue: Identität des Apostels
  choice: Der Apostel bleibt unbenannt.
  alternative: Johannes
  rationale: Das Zeugnis bezeichnet ihn nur durch das Motiv des Liegens an Christi Brust; eine ausdrückliche Identifizierung würde die überlieferte Form vereindeutigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die lange Aufzählung wurde syntaktisch geglättet, ohne die genannten Autoritäten oder die abschließende Deutung zu verändern. Die abgekürzte Werkangabe wurde wie im Zeugnis bewahrt.
