  text: 'Five books by Papias are extant, bearing the title Expositions of the Oracles of the Lord. Irenaeus also mentions these as the only [works] written by him, in the following words: “These things Papias, who was a hearer of John and a companion of Polycarp, an ancient worthy, witnesses in writing in the fourth of his books. For there are five books composed by him.” So far Irenaeus.


    Yet Papias himself, in the preface to his discourses, certainly does not [claim] that he was a hearer and eyewitness of the holy Apostles. Rather, he shows by the language he uses that he received the matters of the faith from those who were their friends:


    “But I will not scruple also to give a place for you along with my interpretations to everything that I carefully learned and carefully remembered in time past from the elders, guaranteeing its truth. For, unlike the many, I did not take pleasure in those who have very much to say, but in those who teach the truth; nor in those who relate foreign commandments, but in those (who record) such as were given from the Lord to the Faith and are derived from the Truth itself. And again, whenever a person came (in my way) who had been a follower of the Elders, I would inquire about the discourses of the elders—what was said by Andrew, or by Peter, or by Philip, or by Thomas or James, or by John or Matthew or any other of the Lord’s disciples, and what Aristion and the Elder John, the disciples of the Lord, say. For I did not think that I could get so much profit from the contents of books as from the utterances of a living and abiding voice.”


    Here it is worth while to observe that he twice enumerates the name of John. The first he mentions in connection with Peter, James, Matthew, and the rest of the Apostles, evidently meaning the Evangelist; but the other John he mentions after an interval and classes with others outside the number of the Apostles, placing Aristion before him, and he distinctly calls him an Elder. Thus he makes it quite evident that their statement is true who say that there were two persons of that name in Asia, and that there are two tombs in Ephesus, each of which even now is called the tomb of John. It is important to notice this, for it is probable that it was the second, if one will not admit that it was the first, who saw the Revelation which is ascribed by name to John. Papias, of whom we are now speaking, confesses that he had received the words of the Apostles from those who had followed them, but says that he was himself a hearer of Aristion and the Elder John. At all events, he mentions them
    frequently by name and besides records their traditions in his writings. So much for these points, which I trust have not been uselessly adduced.


    It is worth while, however, to add to the words of Papias given above other passages from him, in which he records some other wonderful events likewise, as having come down to him by tradition. That Philip the Apostle resided in Hierapolis with his daughters has already been stated; but it must be noted here how Papias, their contemporary, relates that he had heard a marvellous tale from the daughters of Philip. For he relates that in his ti[me] a man rose from the dead, and again he gives another wonderful story about Justus, who was surnamed Barsabas: how he drank a deadly poison and yet, by the grace of the Lord, suffered no inconvenience. Of this Justus the Book of Acts records that, after the ascension of the Saviour, the holy Apostles put him forward with Matthias and prayed for the right choice, in place of the traitor Judas, to make their number complete. The passage is somewhat as follows: “And they put forward two, Joseph, called Barsabas, who was surnamed Justus, and Matthias;
    and they prayed, and said.”


    The same writer has recorded other notices as having come down to him from oral tradition: certain strange parables of the Saviour and teachings of his, and some other statements of a rather mythical character. Among these he says that there will be a period of some ten thousand years after the resurrection, and that the kingdom of Christ will be set up in material form on this earth. These ideas, I suppose, he got through a misunderstanding of the apostolic accounts, not perceiving that the things recorded there in figures were spoken by them mystically.


    For he evidently was a man of very limited capacity, as one may say, judging from his own statements. Yet it was owing to him that so many church fathers after him adopted a like opinion, urging in their own support the antiquity of the man, as, for instance, Irenaeus and whoever else they were who declared that they held like views. Papias also gives in his own work other accounts of the words of the Lord on the authority of Aristion, mentioned above, and traditions of the Elder John. To these we refer the curious; for our present purpose we will merely add to his words, which have been quoted above, a tradition which has been set forth through these sources concerning Mark, who wrote the Gospel:


    “And the Elder said this also: Mark, having become the interpreter of Peter, wrote down accurately everything that he remembered, without, however, recording in order what was either said or done by Christ. For neither did he hear the Lord nor did he follow him; but afterwards, as I said, (attended) Peter, who adapted his instructions to the needs of his hearers but had no design of giving a connected account of the Lord’s oracles. So then Mark made no mistake, while [he] thus wrote down some things as he remembered them; for [he] made it his one care not to omit anything that he heard, or [to] set down any false statement therein.”


    Such, then, is the account given by Papias concerning Mark. But concerning Matthew, the following statement is made [by him]:


    “So then Matthew composed the oracles in the Hebrew language, and each one interpreted them as he could.”


    The same writer employed testimonies from the First Epistle of John, and likewise from that of Peter. And he has related another story about a woman accused of many sins before the Lord, which the Gospel according'
translation:
  language: de
  text: 'Fünf Bücher des Papias sind erhalten. Sie tragen den Titel »Auslegung der Worte des Herrn«.[a] Auch Irenäus erwähnt sie als die einzigen Schriften, die Papias verfasst habe. Er schreibt:


    »Dies bezeugt Papias, ein Hörer des Johannes und Gefährte Polykarps, ein Mann aus alter Zeit, schriftlich im vierten seiner Bücher. Denn er hat fünf Bücher verfasst.«


    So weit Irenäus.


    Papias selbst behauptet jedoch im Vorwort seiner Auslegungen keineswegs, er habe die heiligen Apostel persönlich gehört und mit eigenen Augen gesehen. Vielmehr zeigt seine Wortwahl, dass er die Dinge des Glaubens von Menschen empfing, die mit ihnen vertraut gewesen waren:


    »Ich werde nicht zögern, für dich neben meinen Auslegungen auch alles zusammenzustellen, was ich einst von den Ältesten sorgfältig gelernt und sorgfältig im Gedächtnis bewahrt habe; für seine Wahrheit stehe ich ein. Denn anders als die meisten hatte ich keine Freude an denen, die viele Worte machen, sondern an denen, die die Wahrheit lehren; auch nicht an denen, die fremde Gebote vortragen, sondern an denen, die die Gebote weitergeben, die der Herr dem Glauben gegeben hat und die aus der Wahrheit selbst hervorgegangen sind.


    Und wenn jemand zu mir kam, der den Ältesten gefolgt war, erkundigte ich mich nach den Worten der Ältesten: was Andreas oder Petrus gesagt hatte, was Philippus, Thomas, Jakobus, Johannes, Matthäus oder irgendein anderer Jünger des Herrn gesagt hatte, und was Aristion und der Älteste Johannes, die Jünger des Herrn, sagen. Denn ich meinte, aus Büchern nicht so großen Nutzen ziehen zu können wie aus dem, was eine lebendige und bleibende Stimme sagt.«


    Hier ist bemerkenswert, dass Papias den Namen Johannes zweimal aufzählt. Den ersten nennt er zusammen mit Petrus, Jakobus, Matthäus und den übrigen Aposteln; damit meint er offenkundig den Evangelisten. Den anderen Johannes nennt er nach einer Unterbrechung und ordnet ihn anderen außerhalb der Zahl der Apostel zu. Dabei stellt er Aristion vor ihn und bezeichnet ihn ausdrücklich als Ältesten. So macht er ganz deutlich, dass diejenigen recht haben, die sagen, in Asia habe es zwei Männer dieses Namens gegeben. Auch gebe es in Ephesus zwei Gräber, von denen jedes noch heute »Grab des Johannes« genannt werde.


    Dies zu beachten ist wichtig. Denn wahrscheinlich war es der zweite Johannes – sofern man nicht den ersten dafür hält –, der die Offenbarung sah, die ausdrücklich Johannes zugeschrieben wird. Papias, von dem hier die Rede ist, räumt ein, die Worte der Apostel von deren Nachfolgern empfangen zu haben; zugleich sagt er, dass er selbst Aristion und den Ältesten Johannes gehört habe. Jedenfalls nennt er beide häufig mit Namen und zeichnet außerdem ihre Überlieferungen in seinen Schriften auf. So viel hierzu; ich hoffe, diese Ausführungen waren nicht nutzlos.


    Es lohnt sich jedoch, den oben angeführten Worten des Papias weitere Stellen aus seinem Werk hinzuzufügen. Darin berichtet er von anderen wunderbaren Ereignissen, die ebenfalls durch Überlieferung zu ihm gelangt seien. Dass der Apostel Philippus mit seinen Töchtern in Hierapolis wohnte, wurde bereits gesagt. Hier muss aber erwähnt werden, dass Papias, der zur selben Zeit wie sie lebte, nach eigener Aussage eine wunderbare Geschichte von den Töchtern des Philippus gehört hatte. Er berichtet nämlich, zu seiner Zeit sei ein Mensch von den Toten auferstanden. Außerdem erzählt er eine weitere wunderbare Geschichte über Justus mit dem Beinamen Barsabbas: Er habe ein tödliches Gift getrunken und dennoch durch die Gnade des Herrn keinerlei Schaden erlitten.


    Von diesem Justus berichtet die Apostelgeschichte, dass die heiligen Apostel ihn nach der Himmelfahrt des Retters zusammen mit Matthias aufstellten und um die rechte Wahl beteten, damit an die Stelle des Verräters Judas wieder einer trete und ihre Zahl vollständig werde. Die Stelle lautet ungefähr so:


    »Und sie stellten zwei auf: Josef, genannt Barsabbas, mit dem Beinamen Justus, und Matthias. Dann beteten sie und sprachen …«


    Derselbe Schriftsteller hat noch weitere Dinge aufgezeichnet, die durch mündliche Überlieferung zu ihm gelangt seien: einige ungewöhnliche Gleichnisse und Lehren des Retters sowie manche andere, eher sagenhaft anmutende Berichte. Dazu gehört seine Aussage, nach der Auferstehung werde ein Zeitraum von tausend Jahren kommen und das Reich Christi werde auf dieser Erde in leibhaftiger Gestalt errichtet werden.[b] Ich nehme an, zu diesen Vorstellungen gelangte er, weil er die Berichte der Apostel missverstand. Er erkannte nicht, dass ihre bildhaften Aussagen geheimnisvoll gemeint waren.


    Denn nach seinen eigenen Äußerungen zu urteilen, war er offenbar ein Mann von sehr begrenztem Verstand. Dennoch bewirkte er, dass sehr viele Kirchenlehrer nach ihm dieselbe Auffassung übernahmen. Zu ihrer Begründung beriefen sie sich auf das hohe Alter dieses Mannes; zu ihnen gehörten etwa Irenäus und alle anderen, die sich zu ähnlichen Ansichten bekannten.


    Papias gibt in seinem Werk außerdem weitere Berichte über Worte des Herrn wieder, die er auf den oben genannten Aristion zurückführt, sowie Überlieferungen des Ältesten Johannes. Wer mehr wissen möchte, sei darauf verwiesen. Für unseren gegenwärtigen Zweck fügen wir seinen bereits angeführten Worten nur noch eine Überlieferung hinzu, die aus diesen Quellen stammt und Markus betrifft, den Verfasser des Evangeliums:


    »Auch dies sagte der Älteste: Markus wurde der Dolmetscher des Petrus und schrieb alles, woran er sich erinnerte, genau auf, allerdings nicht der Reihenfolge nach, was Christus gesagt oder getan hatte. Denn er hatte den Herrn weder gehört noch war er ihm gefolgt. Später aber begleitete er, wie gesagt, Petrus. Dieser richtete seine Unterweisungen nach den jeweiligen Bedürfnissen aus, beabsichtigte jedoch nicht, eine geordnete Darstellung der Worte des Herrn zu geben. Daher beging Markus keinen Fehler, als er einzelne Dinge so aufschrieb, wie er sich an sie erinnerte. Denn er achtete nur darauf, nichts von dem Gehörten auszulassen und darin nichts Falsches wiederzugeben.«


    Dies ist also der Bericht, den Papias über Markus gibt. Über Matthäus wird Folgendes gesagt:


    »Matthäus stellte die Worte in hebräischer Sprache zusammen,[c] und jeder übersetzte oder deutete sie, so gut er konnte.«[d]


    Derselbe Schriftsteller zog Zeugnisse aus dem ersten Brief des Johannes und ebenso aus dem ersten Brief des Petrus heran. Außerdem berichtet er eine weitere Geschichte über eine Frau, die vor dem Herrn vieler Sünden beschuldigt wurde; sie ist im Evangelium nach den Hebräern enthalten.[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich kann der Titel auch »Auslegung der Herrnworte« oder »Auslegung der Aussprüche des Herrn« heißen.
    reason: λόγια besitzt eine weitere Bedeutungsbreite als das deutsche »Worte«.
  - marker: b
    text: Der griechische Text des Eusebius nennt tausend Jahre. Die Angabe »zehntausend Jahre« im bereitgestellten englischen Druckzeugen beruht offenbar auf einer fehlerhaften Überlieferung oder Wiedergabe.
    reason: Korrigiert den beschädigten englischen Zeugen anhand des griechischen Quellenwortlauts.
  - marker: c
    text: Die Wendung kann im antiken Sprachgebrauch Hebräisch oder Aramäisch bezeichnen.
    reason: Bewahrt die sprachliche Ambiguität von Ἑβραΐδι διαλέκτῳ.
  - marker: d
    text: Das entsprechende Verb kann sowohl »übersetzen« als auch »auslegen« bedeuten.
    reason: Die Art der Tätigkeit wird im griechischen Wort ἡρμήνευσεν nicht eindeutig festgelegt.
  - marker: e
    text: Der bereitgestellte englische Druckzeuge bricht nach »the Gospel according« ab. Das Satzende ist aus dem erhaltenen griechischen Text des Eusebius ergänzt.
    reason: Macht die quellenkritisch begründete Ergänzung transparent.
lexical_decisions:
- source_word: Λογίων κυριακῶν ἐξήγησις
  choice: »Auslegung der Worte des Herrn«
  rationale: λόγια kann »Worte«, »Aussprüche« oder »Gottessprüche« bezeichnen. »Worte des Herrn« ist im Deutschen verständlich und wahrt durch die Fußnote die weitere Bedeutungsbreite; ἐξήγησις wird sachgerecht als »Auslegung« wiedergegeben.
- source_word: πρεσβύτεροι / πρεσβύτερος
  choice: Älteste / der Älteste
  rationale: Bewahrt die mögliche Bedeutung als ältere Gewährsleute ebenso wie als anerkannte kirchliche Lehrer, ohne vorschnell ein festes Amt zu unterstellen.
- source_word: ἑρμηνευτής
  choice: Dolmetscher
  rationale: Bei Markus und Petrus kann das Wort mündliche Sprachmittlung oder allgemein vermittelnde Wiedergabe meinen. »Dolmetscher« erhält die traditionelle, konkrete Bedeutung, ohne sie weiter auszudeuten.
- source_word: τάξις / ἐν τάξει
  choice: richtige Reihenfolge / geordnete Darstellung
  rationale: 'Gibt die Spannung des Textes wieder: Markus schrieb genau, aber nicht in einer sachlich oder chronologisch geordneten Folge.'
- source_word: Ἑβραΐδι διαλέκτῳ
  choice: in hebräischer Sprache
  rationale: Die antike Bezeichnung kann Hebräisch oder Aramäisch meinen. Der Haupttext folgt der üblichen Formulierung; die Fußnote hält die sprachgeschichtliche Unsicherheit offen.
- source_word: ἡ χιλιὰς ἐτῶν
  choice: ein Zeitraum von tausend Jahren
  rationale: Der griechische Eusebius-Text spricht von tausend Jahren; die Angabe »zehntausend« im beschädigten englischen Druckzeugen ist offenbar keine verlässliche Wiedergabe.
- source_word: ὡς ἦν δυνατὸς ἕκαστος
  choice: so gut er konnte
  rationale: Bewahrt die Aussage über die jeweils unterschiedliche Fähigkeit der Einzelnen, ohne festzulegen, ob schriftliches Übersetzen oder mündliches Auslegen gemeint ist.
theological_decisions:
- issue: Das kommende tausendjährige Reich Christi
  choice: Eusebius’ Bericht und seine ablehnende Bewertung werden als seine eigenen Aussagen übersetzt.
  alternative: Papias’ Auffassung harmonisieren, abschwächen oder als verbindliche Lehre darstellen.
  rationale: Der Fragmenttext enthält bewusst sowohl die überlieferte Erwartung als auch Eusebius’ scharfe Kritik. Diese theologische Spannung darf nicht aufgelöst werden.
- issue: Identität des Johannes
  choice: Die von Eusebius gezogene Unterscheidung zwischen dem Apostel/Evangelisten und dem Ältesten Johannes bleibt als Argument des Erzählers erkennbar.
  alternative: Beide Johannesgestalten gleichsetzen oder die Unterscheidung als gesicherte historische Tatsache formulieren.
  rationale: Der Text argumentiert für zwei Personen, doch diese Folgerung ist Eusebius’ Deutung der Papias-Worte und keine neutrale Feststellung.
- issue: »Worte des Herrn« bei Markus und Matthäus
  choice: λόγια wird einheitlich als »Worte des Herrn« beziehungsweise »Worte« wiedergegeben.
  alternative: Das Wort jeweils eindeutig mit »Evangelium« oder »Lehrreden« identifizieren.
  rationale: Der genaue Umfang der λόγια ist umstritten; die Übersetzung vermeidet eine konfessionelle oder literarkritische Vorentscheidung.
- issue: Geschichte von der angeklagten Frau
  choice: Das im griechischen Eusebius-Text überlieferte Satzende mit dem Hebräerevangelium wird wiedergegeben.
  alternative: Wegen des Abbruchs des bereitgestellten englischen Druckzeugen mitten im Satz ebenfalls abbrechen.
  rationale: Der erhaltene griechische Kontext bietet das Satzende; seine Wiederherstellung folgt der antiken Quellenüberlieferung statt dem beschädigten OCR-Zeugen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut lesbarem historischem Prosastil. Zitate sind klar vom Kommentar des Eusebius getrennt. Archaismen wurden vermieden; antike Bezeichnungen wie »Ältester«, »Retter« und »Worte des Herrn« bleiben erhalten, wo sie inhaltlich relevant sind. Offenkundige OCR-Schäden des englischen Zeugen wurden nicht nachgebildet. Der Entwurf stützt sich vorrangig auf den bekannten griechischen Wortlaut von Eusebius, Kirchengeschichte 3,39; wo der vorgelegte Zeuge abbricht oder abweicht, wird dies in den Fußnoten kenntlich gemacht.
