revisions:
- from: 'Fünf Bücher des Papias sind erhalten. Sie tragen den Titel »Auslegung der Worte des Herrn«.[a] Auch Irenäus erwähnt sie als die einzigen Schriften, die Papias verfasst habe. Er schreibt:


    »Dies bezeugt Papias, ein Hörer des Johannes und Gefährte Polykarps, ein Mann aus alter Zeit, schriftlich im vierten seiner Bücher. Denn er hat fünf Bücher verfasst.«


    So weit Irenäus.


    Papias selbst behauptet jedoch im Vorwort seiner Auslegungen keineswegs, er habe die heiligen Apostel persönlich gehört und mit eigenen Augen gesehen. Vielmehr zeigt seine Wortwahl, dass er die Glaubenslehren von Menschen empfing, die mit ihnen vertraut gewesen waren:


    »Ich werde nicht zögern, für dich neben meinen Auslegungen auch alles festzuhalten, was ich einst von den Ältesten sorgfältig gelernt und sorgfältig im Gedächtnis bewahrt habe; für seine Wahrheit stehe ich ein. Denn anders als die meisten hatte ich keine Freude an denen, die viele Worte machen, sondern an denen, die die Wahrheit lehren; auch nicht an denen, die fremde Gebote weitergeben, sondern an denen, die sich an die Gebote erinnern, die der Herr dem Glauben gegeben hat und die aus der Wahrheit selbst hervorgegangen sind.


    Und wenn jemand zu mir kam, der den Ältesten gefolgt war, erkundigte ich mich nach den Worten der Ältesten: was Andreas oder Petrus gesagt hatte, was Philippus, Thomas, Jakobus, Johannes, Matthäus oder irgendein anderer Jünger des Herrn gesagt hatte, und was Aristion und der Älteste Johannes, die Jünger des Herrn, sagten. Denn ich meinte, aus Büchern nicht so großen Nutzen ziehen zu können wie aus dem, was eine lebendige und bleibende Stimme sagt.«


    Hier ist bemerkenswert, dass Papias den Namen Johannes zweimal aufzählt. Den ersten nennt er zusammen mit Petrus, Jakobus, Matthäus und den übrigen Aposteln; damit meint er offenkundig den Evangelisten. Den anderen Johannes nennt er nach einer Unterbrechung und ordnet ihn anderen außerhalb der Zahl der Apostel zu. Dabei stellt er Aristion vor ihn und bezeichnet ihn ausdrücklich als Ältesten. So macht er ganz deutlich, dass diejenigen recht haben, die sagen, in Asia habe es zwei Männer dieses Namens gegeben. Auch gebe es in Ephesus zwei Gräber, von denen jedes noch heute »Grab des Johannes« genannt werde.


    Dies zu beachten ist wichtig. Denn wahrscheinlich war es der zweite Johannes – sofern man nicht den ersten dafür hält –, der die Offenbarung sah, die ausdrücklich Johannes zugeschrieben wird. Papias, von dem hier die Rede ist, räumt ein, die Worte der Apostel von deren Nachfolgern empfangen zu haben; zugleich sagt er, dass er selbst Aristion und den Ältesten Johannes gehört habe. Jedenfalls nennt er beide häufig mit Namen und zeichnet außerdem ihre Überlieferungen in seinen Schriften auf. So viel hierzu; ich hoffe, diese Ausführungen waren nicht nutzlos.


    Es lohnt sich jedoch, den oben angeführten Worten des Papias weitere Stellen aus seinem Werk hinzuzufügen. Darin berichtet er von anderen wunderbaren Ereignissen, die ebenfalls durch Überlieferung zu ihm gelangt seien. Dass der Apostel Philippus mit seinen Töchtern in Hierapolis wohnte, wurde bereits gesagt. Hier muss aber erwähnt werden, dass Papias, der zur selben Zeit wie sie lebte, nach eigener Aussage eine wunderbare Geschichte von den Töchtern des Philippus gehört hatte. Er berichtet nämlich, zu seiner Zeit sei ein Mensch von den Toten auferstanden. Außerdem erzählt er eine weitere wunderbare Geschichte über Justus mit dem Beinamen Barsabbas: Er habe ein tödliches Gift getrunken und dennoch durch die Gnade des Herrn keinerlei Schaden erlitten.


    Von diesem Justus berichtet die Apostelgeschichte, dass die heiligen Apostel ihn nach der Himmelfahrt des Retters zusammen mit Matthias aufstellten und um die rechte Wahl beteten, damit an die Stelle des Verräters Judas wieder einer trete und ihre Zahl vollständig werde. Die Stelle lautet ungefähr so:


    »Und sie stellten zwei auf: Josef, genannt Barsabbas, mit dem Beinamen Justus, und Matthias. Dann beteten sie und sprachen …«


    Derselbe Schriftsteller hat noch weitere Dinge aufgezeichnet, die durch mündliche Überlieferung zu ihm gelangt seien: einige ungewöhnliche Gleichnisse und Lehren des Retters sowie manche andere, eher sagenhaft anmutende Berichte. Dazu gehört seine Aussage, nach der Auferstehung werde ein Zeitraum von tausend Jahren kommen und das Reich Christi werde auf dieser Erde in leibhaftiger Gestalt errichtet werden.[b] Ich nehme an, zu diesen Vorstellungen gelangte er, weil er die Berichte der Apostel missverstand. Er erkannte nicht, dass ihre bildhaften Aussagen geheimnisvoll gemeint waren.


    Denn nach seinen eigenen Äußerungen zu urteilen, war er offenbar ein Mann von sehr begrenztem Verstand. Dennoch bewirkte er, dass sehr viele Kirchenlehrer nach ihm dieselbe Auffassung übernahmen. Zu ihrer Begründung beriefen sie sich auf das hohe Alter dieses Mannes; zu ihnen gehörten etwa Irenäus und alle anderen, die sich zu ähnlichen Ansichten bekannten.


    Papias gibt in seinem Werk außerdem weitere Berichte über Worte des Herrn wieder, die er auf den oben genannten Aristion zurückführt, sowie Überlieferungen des Ältesten Johannes. Wer mehr wissen möchte, sei darauf verwiesen. Für unseren gegenwärtigen Zweck fügen wir seinen bereits angeführten Worten nur noch eine Überlieferung hinzu, die aus diesen Quellen stammt und Markus betrifft, den Verfasser des Evangeliums:


    »Auch dies sagte der Älteste: Markus wurde der Dolmetscher des Petrus und schrieb alles, woran er sich erinnerte, genau auf, allerdings nicht in der richtigen Reihenfolge dessen, was Christus gesagt oder getan hatte. Denn er hatte den Herrn weder gehört noch war er ihm gefolgt. Später aber folgte er, wie gesagt, Petrus. Dieser richtete seine Unterweisungen nach den jeweiligen Bedürfnissen aus, beabsichtigte jedoch nicht, eine geordnete Darstellung der Worte des Herrn zu geben. Daher beging Markus keinen Fehler, als er einzelne Dinge so aufschrieb, wie er sich an sie erinnerte. Denn er achtete nur darauf, nichts von dem Gehörten auszulassen und darin nichts Falsches wiederzugeben.«


    Dies ist also der Bericht, den Papias über Markus gibt. Über Matthäus wird Folgendes gesagt:


    »Matthäus stellte die Worte in hebräischer Sprache zusammen,[c] und jeder übersetzte oder deutete sie, so gut er konnte.«[d]


    Derselbe Schriftsteller zog Zeugnisse aus dem ersten Brief des Johannes und ebenso aus dem ersten Brief des Petrus heran. Außerdem berichtet er eine weitere Geschichte über eine Frau, die vor dem Herrn vieler Sünden beschuldigt wurde; sie ist im Hebräerevangelium enthalten.[e]'
