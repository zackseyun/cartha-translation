    Derselbe Schriftsteller hat noch weitere Dinge aufgezeichnet, die durch mündliche Überlieferung zu ihm gelangt seien: einige ungewöhnliche Gleichnisse und Lehren des Retters sowie manche andere, eher sagenhaft anmutende Berichte. Dazu gehört seine Aussage, nach der Auferstehung werde ein Zeitraum von tausend Jahren kommen und das Reich Christi werde auf dieser Erde in leibhaftiger Gestalt errichtet werden.[b] Ich nehme an, zu diesen Vorstellungen gelangte er, weil er die Berichte der Apostel missverstand. Er erkannte nicht, dass ihre bildhaften Aussagen geheimnisvoll gemeint waren.


    Denn nach seinen eigenen Äußerungen zu urteilen, war er offenbar ein Mann von sehr begrenztem Verstand. Dennoch bewirkte er, dass sehr viele Kirchenlehrer nach ihm dieselbe Auffassung übernahmen. Zu ihrer Begründung beriefen sie sich auf das hohe Alter dieses Mannes; zu ihnen gehörten etwa Irenäus und alle anderen, die sich zu ähnlichen Ansichten bekannten.


    Papias gibt in seinem Werk außerdem weitere Berichte über Worte des Herrn wieder, die er auf den oben genannten Aristion zurückführt, sowie Überlieferungen des Ältesten Johannes. Wer mehr wissen möchte, sei darauf verwiesen. Für unseren gegenwärtigen Zweck fügen wir seinen bereits angeführten Worten nur noch eine Überlieferung hinzu, die aus diesen Quellen stammt und Markus betrifft, den Verfasser des Evangeliums:


    »Auch dies sagte der Älteste: Markus wurde der Dolmetscher des Petrus und schrieb alles, woran er sich erinnerte, genau auf, allerdings nicht der Reihenfolge nach, was Christus gesagt oder getan hatte. Denn er hatte den Herrn weder gehört noch war er ihm gefolgt. Später aber begleitete er, wie gesagt, Petrus. Dieser richtete seine Unterweisungen nach den jeweiligen Bedürfnissen aus, beabsichtigte jedoch nicht, eine geordnete Darstellung der Worte des Herrn zu geben. Daher beging Markus keinen Fehler, als er einzelne Dinge so aufschrieb, wie er sich an sie erinnerte. Denn er achtete nur darauf, nichts von dem Gehörten auszulassen und darin nichts Falsches wiederzugeben.«


    Dies ist also der Bericht, den Papias über Markus gibt. Über Matthäus wird Folgendes gesagt:


    »Matthäus stellte die Worte in hebräischer Sprache zusammen,[c] und jeder übersetzte oder deutete sie, so gut er konnte.«[d]


    Derselbe Schriftsteller zog Zeugnisse aus dem ersten Brief des Johannes und ebenso aus dem ersten Brief des Petrus heran. Außerdem berichtet er eine weitere Geschichte über eine Frau, die vor dem Herrn vieler Sünden beschuldigt wurde; sie ist im Evangelium nach den Hebräern enthalten.[e]'
