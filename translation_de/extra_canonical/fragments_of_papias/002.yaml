review_pass:
  verdict: revise
  source_fidelity: 'Der Entwurf folgt dem griechischen Text von Eusebius, Hist. eccl. 3,39, im Ganzen sehr zuverlässig und verbessert zu Recht die verderbte Angabe „zehntausend Jahre“ des englischen OCR-Zeugen zu „tausend Jahre“. Einige Formulierungen verengen oder verschieben jedoch den Sinn: besonders die Wiedergabe der vom Herrn gegebenen „Gebote“ im Papias-Zitat, die Beschreibung des Verhältnisses des Markus zu Petrus sowie die Bezeichnung des am Ende genannten Evangeliums.'
  naturalness: Modernes Standarddeutsch, klar gegliedert und dem historischen Register angemessen. Die Revision glättet einzelne schwerfällige oder missverständliche Formulierungen, ohne den quellenkritischen Charakter des Textes zu verdecken.
  terminology: „Älteste“, „Dolmetscher“, „Worte des Herrn“ und die Fußnoten zur hebräischen/aramäischen und zur Übersetzungs-/Auslegungsambiguität sind angemessen. „Evangelium nach den Hebräern“ ist gegenüber „Hebräerevangelium“ die präzisere Bezeichnung. Die umstrittene Johannes-Unterscheidung bleibt ausdrücklich als Argumentation des Eusebius erkennbar.
  issues:
  - severity: medium
    issue: Das Papias-Zitat spricht von „Glaubenslehren“ und von Menschen, „die sich an die Gebote erinnern“.
    rationale: Der Kontext lautet allgemein „die Dinge des Glaubens“; im Zitat kontrastiert Papias Menschen, die fremde Gebote vortragen, mit solchen, die die vom Herrn dem Glauben gegebenen und aus der Wahrheit hervorgegangenen Gebote weitergeben. „Sich erinnern“ hat hier keine Grundlage und verändert die Aussage.
  - severity: medium
    issue: Markus „folgte“ Petrus.
    rationale: Das griechische παρηκολούθησεν Πέτρῳ bezeichnet hier, im Gegensatz zum zuvor verneinten Nachfolgen Jesu, sein Begleiten beziehungsweise Anschließen an Petrus. „Er begleitete Petrus“ verhindert eine unnötige Gleichsetzung beider Verhältnisse.
  - severity: low
    issue: „nicht in der richtigen Reihenfolge“ ist zu wertend.
    rationale: οὐ μέντοι τάξει besagt lediglich „nicht der Reihenfolge nach“; der Text legt keine objektiv „richtige“ Reihenfolge fest.
  - severity: low
    issue: Das Satzende nennt ein „Hebräerevangelium“.
    rationale: Der überlieferte Wortlaut bezeichnet τὸ καθ᾽ Ἑβραίους εὐαγγέλιον, am natürlichsten „das Evangelium nach den Hebräern“. Dies ist zugleich die fachlich präzisere Benennung.
