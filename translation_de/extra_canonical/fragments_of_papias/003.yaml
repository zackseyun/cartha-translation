base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/003.yaml
  text: 'And each man went to his own house, but Jesus went to the Mount of Olives. Early in the morning he came again to the temple, [and all the people came to him; and he sat down and taught them]. The scribes and the Pharisees brought a woman caught in adultery, and after placing her in the middle, they said to him, “Teacher, this woman was caught in adultery, in the very act. Now in the law Moses commanded [us] to stone such. What then do you say?” [They said this to test him, so that they might have something with which to accuse him.] But Jesus stooped down and wrote on the ground with his finger. When they continued questioning [him], he straightened up and said [to them], “Let the one among you who is without sin be the first to throw a stone at her.” Again he stooped down and wrote on the ground. When they heard this, they went out one by one, beginning with the oldest. He was left alone, and the woman, where she was, in the middle. Jesus straightened up and said to her, “Woman,
    where are they? Did no one condemn you?” She said, “No one, Lord.” Jesus said, “Neither do I condemn you. Go on your way; from now on, sin no more.”


    PERICOPE ADULTERAE; see Westcott and Hort, The New Testament in the Original Greek, I, p. 241; II, pp. 82 sq., 91; Lightfoot, Essays on Supernatural Religion, p. 203 sq.'
translation:
  language: de
  text: 'Und jeder ging in sein eigenes Haus; Jesus aber ging zum Ölberg. Früh am Morgen kam er wieder in den Tempel, [und das ganze Volk kam zu ihm; und er setzte sich und lehrte sie]. Da brachten die Schriftgelehrten und die Pharisäer eine Frau, die beim Ehebruch ertappt worden war. Sie stellten sie in die Mitte und sagten zu ihm: »Lehrer, diese Frau ist auf frischer Tat beim Ehebruch ertappt worden. Im Gesetz hat Mose [uns] geboten, solche Frauen zu steinigen. Was sagst nun du?« [Das sagten sie, um ihn auf die Probe zu stellen, damit sie einen Grund hätten, ihn anzuklagen.] Jesus aber beugte sich hinunter und schrieb mit dem Finger auf die Erde. Als sie nicht aufhörten, [ihn] zu fragen, richtete er sich auf und sagte [zu ihnen]: »Wer von euch ohne Sünde ist, soll als Erster einen Stein auf sie werfen.« Dann beugte er sich wieder hinunter und schrieb auf die Erde. Als sie das hörten, gingen sie einer nach dem anderen hinaus, angefangen bei den Ältesten. Jesus blieb allein zurück und die
    Frau, die noch immer in der Mitte stand. Jesus richtete sich auf und sagte zu ihr: »Frau, wo sind sie? Hat dich niemand verurteilt?« Sie sagte: »Niemand, Herr.« Da sagte Jesus: »Auch ich verurteile dich nicht. Geh; von jetzt an sündige nicht mehr.«[a]


    PERICOPE ADULTERAE; siehe Westcott und Hort, The New Testament in the Original Greek, Bd. I, S. 241; Bd. II, S. 82 f., 91; Lightfoot, Essays on Supernatural Religion, S. 203 f.[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Übersetzung folgt vorläufig dem angegebenen gemeinfreien englischen Textzeugen. Eine unmittelbare Prüfung der griechischen beziehungsweise lateinischen Quellen steht noch aus. Die eckigen Klammern geben die im Textzeugen als ergänzt oder unsicher markierten Wörter und Sätze wieder.
    reason: Macht die begrenzte Quellenbasis und die Bedeutung der erhaltenen Klammern transparent.
  - marker: b
    text: Die abschließende editorische Quellenangabe des Textzeugen wurde beibehalten. »Pericope adulterae« ist die traditionelle lateinische Bezeichnung für den Abschnitt über die des Ehebruchs beschuldigte Frau.
    reason: Unterscheidet den editorischen Nachweis vom eigentlichen Fragmenttext und erklärt die lateinische Überschrift.
lexical_decisions:
- source_word: Master / Teacher
  choice: Lehrer
  rationale: Entspricht der Anrede an Jesus in diesem Lehr- und Streitgespräch und vermeidet das im heutigen Deutsch missverständliche »Meister«.
- source_word: taken in adultery, in the very act
  choice: auf frischer Tat beim Ehebruch ertappt
  rationale: Gibt sowohl den Ehebruch als auch die ausdrückliche Betonung des unmittelbaren Ertappens natürlich wieder.
- source_word: tempting / test
  choice: auf die Probe stellen
  rationale: Bewahrt den Sinn einer feindseligen Prüfung, ohne eine unnötig konfessionell geprägte Deutung einzutragen.
- source_word: without sin
  choice: ohne Sünde
  rationale: Die umfassende Formulierung bleibt erhalten; sie wird nicht auf Schuldlosigkeit allein in dieser konkreten Sache verengt.
- source_word: condemn
  choice: verurteilen
  rationale: Passt zum gerichtlichen Zusammenhang und erhält den Gleichklang in Frage und Antwort.
- source_word: beginning from the eldest
  choice: angefangen bei den Ältesten
  rationale: Bewahrt die mögliche Bedeutung als Altersangabe, ohne eine Erklärung für die Reihenfolge hinzuzufügen.
theological_decisions:
- issue: Reichweite von »ohne Sünde«
  choice: Die allgemeine Aussage »ohne Sünde« wird beibehalten.
  alternative: »Wer sich in dieser Sache keiner Sünde schuldig gemacht hat«
  rationale: Der überlieferte Wortlaut lässt die umfassendere und theologisch spannungsreiche Aussage stehen; eine Eingrenzung wäre interpretierend.
- issue: Jesu Nichtverurteilung und der abschließende Sündenruf
  choice: Beide Aussagen werden ohne harmonisierende Erklärung unmittelbar nebeneinandergestellt.
  alternative: Eine erläuternde Wiedergabe, die Nichtverurteilung als Freispruch oder bloßen Aufschub definiert
  rationale: Der Text verbindet Barmherzigkeit und die Aufforderung, nicht mehr zu sündigen, ohne ihr Verhältnis weiter auszulegen.
- issue: Textgeschichtlicher Status der Passage
  choice: Der überlieferte Abschnitt wird übersetzt, während Klammern und eine Fußnote seinen vorläufigen bzw. unsicheren Überlieferungsrahmen sichtbar machen.
  alternative: Die Passage stillschweigend als unstrittigen Papias-Originaltext oder als regulären Bestandteil des Johannesevangeliums präsentieren
  rationale: Die Metadaten bezeichnen die Vorlage als englischen Zeugen mit noch ausstehender Prüfung der griechischen/lateinischen Quellen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Erzählführung. Historische Präsenswechsel des englischen Zeugen wurden für einen natürlichen deutschen Erzählfluss ins Präteritum überführt. Die direkte Rede bleibt knapp und feierlich, ohne archaische Verbformen. Eckige Klammern aus dem Zeugen wurden bewahrt; editorische Bibliografie wurde typografisch vom Text abgesetzt.
