  source_fidelity: 'Der Entwurf folgt dem vorgelegten englischen Zeugen insgesamt eng und bewahrt die überlieferte Abfolge von Reich, Auferstehung, erneuerter Schöpfung und der hyperbolischen Fruchtbarkeit. Eine vorsichtige Korrektur ist beim letzten Herrenwort nötig: Das im englischen Audit-Trail parenthetisch ergänzte „(times)“ sollte im Deutschen ebenfalls als Ergänzung markiert bleiben. Die Fußnote zum „Maß“ darf nicht behaupten, die Einheit sei im überlieferten Wortlaut völlig unbestimmt; gemeint ist ein antikes Hohlmaß, dessen moderne Umrechnung jedoch unsicher ist.'
