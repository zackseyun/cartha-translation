base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/011.yaml
  text: 'The blessing thus foretold belongs undoubtedly to the times of the Kingdom, when the righteous shall rise from the dead and reign, when too creation, renewed and freed from bondage, shall produce a wealth of food of all kinds from the dew of heaven and from the fatness of the earth; as the elders, who saw John the disciple of the Lord, relate that they had heard from him how the Lord used to teach concerning those times, and to say:


    “The days will come, in which vines shall grow, each having ten thousand shoots, and on each shoot ten thousand branches, and on each branch again ten thousand twigs, and on each twig ten thousand clusters, and on each cluster ten thousand grapes; and each grape, when pressed, shall yield five-and-twenty measures of wine. And when any of the saints shall have taken hold of [o]ne of their clusters, another shall cry, ‘I am a better cluster; take me, bless the Lord through me.’ Likewise also a grain of wheat shall produce ten thousand heads, and every head shall [h]ave ten thousand grains, and every grain ten pounds of fine [fl]our, bright and clean; and the other fruits, seeds, and grass shall produce in similar proportions. And all the animals, using these fruits which are products of the soil, shall become in their [t]urn peaceable and harmonious, obedient to man in all subjection.”


    “[These are the] things Papias, who was a hearer of John and a companion of Polycarp, an ancient worthy, witnesseth in writing in the fourth of his books, [for there] are five books composed by him.” And he added, saying:


    “But these things are credible to them that believe.”


    And when Judas the traitor did not believe, and asked, “How shall such growths be accomplished by the Lord?” he relates that the Lord said, “They shall see, who shall come to these (times).”


    Irenæus, Haer. v. 33. 3–4.'
translation:
  language: de
  text: 'Der so vorausgesagte Segen gehört ohne Zweifel zu den Zeiten des Reiches, wenn die Gerechten von den Toten auferstehen und herrschen werden. Dann wird auch die Schöpfung, erneuert und aus der Knechtschaft befreit, durch den Tau des Himmels und die Fruchtbarkeit der Erde Nahrung aller Art in Fülle hervorbringen. Denn die Ältesten, die Johannes, den Jünger des Herrn, gesehen hatten, berichteten, sie hätten von ihm gehört, wie der Herr über jene Zeiten zu lehren pflegte und sagte:


    „Es werden Tage kommen, in denen Weinstöcke wachsen werden, von denen jeder zehntausend Triebe hat, jeder Trieb zehntausend Zweige, jeder Zweig wiederum zehntausend Zweiglein, jedes Zweiglein zehntausend Trauben und jede Traube zehntausend Beeren. Und jede Beere wird, wenn man sie auspresst, fünfundzwanzig Maß Wein ergeben.[a] Wenn einer der Heiligen eine dieser Trauben ergreift, wird eine andere rufen: ›Ich bin eine bessere Traube! Nimm mich und preise durch mich den Herrn!‹ Ebenso wird auch ein Weizenkorn zehntausend Ähren hervorbringen, jede Ähre zehntausend Körner und jedes Korn zehn Pfund feines, helles und reines Mehl.[b] Auch die übrigen Früchte, die Samen und das Gras werden in entsprechenden Mengen hervorbringen. Und alle Tiere, die diese Erzeugnisse des Erdbodens fressen, werden ihrerseits friedlich und einträchtig werden und sich dem Menschen in jeder Hinsicht unterordnen.“


    Dies bezeugt Papias, ein Hörer des Johannes und Gefährte Polykarps, ein Mann aus alter Zeit, im vierten seiner Bücher schriftlich; denn er verfasste fünf Bücher.[c] Er fügte hinzu:


    „Doch glaubwürdig sind diese Dinge für die, die glauben.“


    Als aber Judas, der Verräter, nicht glaubte und fragte: „Wie sollen solche Erträge durch den Herrn zustande kommen?“, berichtet Papias, der Herr habe gesagt: „Diejenigen, die zu diesen [Zeiten] kommen werden, werden es sehen.“[d]


    — Irenäus, Gegen die Häresien 5,33,3–4'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das hier gemeinte antike Hohlmaß lässt sich nicht sicher in eine moderne Mengenangabe umrechnen.
    reason: Korrigiert die Aussage, ohne eine spekulative moderne Umrechnung vorzunehmen.
  - marker: b
    text: Auch „Pfund“ bezeichnet hier eine antike Gewichtseinheit und nicht notwendig das heutige deutsche Pfund.
    reason: Warnt vor einer anachronistischen Gleichsetzung.
  - marker: c
    text: Das Fragment ist bei Irenäus, Gegen die Häresien 5,33,3–4, überliefert. Die Bezeichnung des Papias als Hörer des Johannes und Gefährte Polykarps gehört zu dieser Zeugenaussage.
    reason: Kennzeichnet Überlieferungsort und historische Zuschreibung.
  - marker: d
    text: 'Das in eckigen Klammern gesetzte „Zeiten“ ist eine ergänzende Verdeutlichung des knappen überlieferten Satzes. Wörtlicher lässt sich dieser auch wiedergeben: „Sie werden es sehen, die zu diesen [Zeiten] kommen werden.“'
    reason: Bewahrt die knappe, leicht mehrdeutige Syntax und kennzeichnet die Ergänzung.
lexical_decisions:
- source_word: times of the Kingdom
  choice: Zeiten des Reiches
  rationale: Bewahrt die eschatologische Offenheit des Zeugnisses, ohne das Reich durch eine konfessionell geprägte Zusatzbezeichnung näher festzulegen.
- source_word: fatness of the earth
  choice: Fruchtbarkeit der Erde
  rationale: Gibt das Bild idiomatisch und würdig wieder; das Gemeinte ist die reiche Ertragskraft des Bodens.
- source_word: shoots / branches / twigs / clusters / grapes
  choice: Triebe / Zweige / Ranken / Trauben / Beeren
  rationale: Bildet die gestufte Pflanzenstruktur verständlich ab. Im Deutschen bezeichnet „Traube“ das Bündel, „Beere“ die einzelne Weinfrucht.
- source_word: saints
  choice: Heiligen
  rationale: Entspricht dem frühchristlichen Sprachgebrauch für die zu Gott Gehörenden, ohne eine spätere kirchenrechtliche Bedeutung einzutragen.
- source_word: measures
  choice: Maß
  rationale: Lässt die nicht näher bestimmbare antike Volumeneinheit offen, statt eine unsichere moderne Umrechnung vorzutäuschen.
- source_word: hearer of John
  choice: Hörer des Johannes
  rationale: Bewahrt die Behauptung des überliefernden Zeugen formal; ob unmittelbarer Schülerkontakt gemeint ist, wird nicht stärker festgelegt.
- source_word: credible to them that believe
  choice: glaubwürdig ... für die, die glauben
  rationale: Erhält die pointierte Wiederholung von Glaubwürdigkeit und Glauben.
theological_decisions:
- issue: Art der endzeitlichen Reichserwartung
  choice: Die konkrete, leibliche Auferstehungs- und Schöpfungssprache bleibt unverändert bildhaft-konkrekt stehen.
  alternative: Die Aussagen allegorisch als rein geistlichen Segen wiedergeben.
  rationale: Der überlieferte Text verbindet Reich, Auferstehung, Herrschaft und erneuerte Schöpfung ausdrücklich; eine allegorisierende Auflösung wäre interpretierend.
- issue: Identität des Johannes
  choice: „Johannes, den Jünger des Herrn“ und später „Hörer des Johannes“ ohne zusätzliche Identifizierung.
  alternative: Johannes ausdrücklich als Apostel oder als Presbyter bezeichnen.
  rationale: Die Identitätsfrage ist traditionsgeschichtlich umstritten und darf in der Übersetzung nicht stillschweigend entschieden werden.
- issue: Überlieferungsstufe der Herrenworte
  choice: Mit Einleitungsformeln wie „berichteten“, „hätten gehört“ und „berichtet Papias“ wird die mittelbare Überlieferung sichtbar gehalten.
  alternative: Die Worte ohne Überlieferungsrahmen unmittelbar Jesus zuschreiben.
  rationale: Das Fragment liegt als mehrstufige Traditionskette bei Irenäus vor; diese historische Distanz ist textlich bedeutsam.
- issue: Sprecher des abschließenden Berichts
  choice: „berichtet Papias“ zur verständlichen Bezugsklärung.
  alternative: Nur das mehrdeutige Pronomen „er“ verwenden.
  rationale: Im unmittelbaren Kontext ist Papias der naheliegende grammatische Bezug. Die Fußnote weist dennoch auf die verschachtelte Überlieferung hin.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die stark überhöhten Zahlen und die personifizierte Traube wurden bewusst nicht geglättet. Wegen der noch ausstehenden direkten Prüfung des griechisch/lateinischen Quellenwortlauts bleibt der Entwurf ausdrücklich am vorgelegten gemeinfreien englischen Überlieferungszeugen orientiert.
