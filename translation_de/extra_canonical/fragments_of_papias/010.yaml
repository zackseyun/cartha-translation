base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/010.yaml
  text: 'So then the more ancient expositors of the churches, I mean Philo, _ the philosopher, and contemporary of the Apostles, and the famous Papias _of Hierapolis, the disciple of John the Evangelist...and their associates, interpreted the sayings about Paradise spiritually, and referred them to the Church of Christ.


    ANASTASIUS OF SINAI, Contempl. Anagog. in Hexaém. vii.'
translation:
  language: de
  text: 'So deuteten also die älteren Ausleger der Kirchen – ich meine Philo, den Philosophen und Zeitgenossen der Apostel, sowie den berühmten Papias von Hierapolis, den Schüler des Evangelisten Johannes, … und ihre Gefährten – die Aussagen über das Paradies geistlich und bezogen sie auf die Kirche Christi.[a]


    ANASTASIUS VOM SINAI, Contempl. Anagog. in Hexaém. VII.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vorläufige Übersetzung nach dem überlieferten englischen Zeugen von J. B. Lightfoot; eine Prüfung am griechischen beziehungsweise lateinischen Quellentext steht noch aus. Die Auslassung (…) ist wie im Zeugen beibehalten.
    reason: Die bereitgestellte Grundlage ist kein direkt geprüfter Originaltext; diese textkritische Einschränkung und die überlieferte Ellipse müssen sichtbar bleiben.
lexical_decisions:
- source_word: more ancient expositors of the churches
  choice: die älteren Ausleger der Kirchen
  rationale: Gibt die kirchliche Zuordnung der Ausleger wieder, ohne sie unnötig als Amtsträger oder Kirchenväter festzulegen.
- source_word: disciple
  choice: Schüler
  rationale: Bewahrt die Aussage eines Lehrer-Schüler-Verhältnisses in natürlichem modernem Deutsch; eine engere apostolische Amts- oder Nachfolgeaussage wird nicht eingetragen.
- source_word: interpreted ... spiritually
  choice: deuteten ... geistlich
  rationale: Entspricht dem hermeneutischen Sinn und bleibt gegenüber möglichen genaueren griechischen Fachbegriffen vorläufig.
- source_word: referred them to
  choice: bezogen sie auf
  rationale: Bewahrt die interpretative Zuordnung, ohne stärkere Gleichsetzung zu behaupten.
- source_word: Church of Christ
  choice: Kirche Christi
  rationale: Nahe, konfessionell neutrale Wiedergabe der überlieferten Formulierung.
theological_decisions:
- issue: Identität des Johannes
  choice: der Evangelist Johannes
  alternative: Johannes der Evangelist
  rationale: Folgt dem vorliegenden Zeugen, ohne darüber hinaus zu entscheiden, wie diese Johannesgestalt historisch zu identifizieren ist.
- issue: Geistliche Paradiesauslegung
  choice: die Aussagen über das Paradies geistlich ... auf die Kirche Christi
  alternative: die Aussagen über das Paradies allegorisch als Aussagen über die Kirche Christi
  rationale: Die offenere Formulierung des Zeugen bleibt erhalten; „geistlich“ wird nicht stillschweigend auf eine bestimmte allegorische Methode verengt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau wurde für die Lesbarkeit behutsam gegliedert; historische Titel und die abgekürzte Werkangabe wurden bewahrt.
