review_pass:
  verdict: revise
  source_fidelity: 'Die Übersetzung folgt dem bereitgestellten englischen Textzeugen insgesamt eng. Eine sachlich relevante Verschiebung liegt jedoch im Abschnitt XX vor: Der Entwurf macht mit „Damit sollte er ergänzen“ Papias eindeutig zum Handelnden des Ergänzens. Die Konstruktion des Zeugen verbindet den Infinitivzweck primär mit Johannes als Subjekt von „diktierte“; mindestens darf die Zuordnung nicht zugunsten von Papias festgelegt werden. Die vorläufige Abhängigkeit vom englischen Zeugen und die unsichere unmittelbare griechisch/lateinische Kontrolle bleiben kenntlich.'
  naturalness: Der Text ist überwiegend modernes, würdiges Standarddeutsch. „als Letzter von diesen“ bildet die Stellung von „last of these“ klarer ab als „der Letzte von diesen“. „genau niederschrieb“ ist näher an „correctly“ als das stärker charakterisierende „gewissenhaft nieder“ und bleibt idiomatisch.
  terminology: '„Evangelium“, „Gemeinden“, „im Leib“, „Sohn des Donners“, „Wort“ und „Häresien“ sind registergerecht und quellennah. Die editorische Lesart „exoterisch [lies: exegetisch]“ wird bewahrt. „Häresien“ ist hier dem historischen, wertenden Terminus des Zeugen näher als die leicht verallgemeinernde Wiedergabe „Irrlehren“.'
  issues:
  - severity: medium
    issue: Absichtssatz in Abschnitt XX legt Papias als Ergänzenden fest.
    rationale: „Damit sollte er ergänzen“ bezieht sich im Deutschen eindeutig auf Papias. Im englischen Zeugen steht der Zweckinfinitiv nach Johannes als Subjekt von „dictated“ und sollte nicht auf Papias umgelenkt werden. Die Revision bindet „um zu ergänzen“ an den Satz über Johannes, ohne den Gegenstand des Mangels näher zu bestimmen.
  - severity: low
    issue: „gewissenhaft“ erweitert „correctly“ um eine Aussage über Sorgfalt bzw. Charakter.
    rationale: „Genau“ gibt die adverbiale Aussage des Zeugen unmittelbarer wieder und wahrt die in der Anmerkung benannte Bezugsunsicherheit.
  revised_text: 'Hier beginnt die Einleitung zum Evangelium nach Johannes.


