base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/016.yaml
  text: 'Here begins the argument to the Gospel according to John.


    The Gospel of John was made known and given to the churches by John while he still remained in the body, as (one) Papias by name, of Hierapolis, a beloved disciple of John, related in his five exoteric (read: exegetical) books. But he wrote down the Gospel correctly at John’s dictation.


    A Vatican manuscript of the ninth century.


    XX


    For John, the last of these, surnamed the Son of Thunder, when he was already a very old man—as Irenaeus and Eusebius and a succession of trustworthy historians have handed down to us—about the time when terrible heresies had arisen, dictated the Gospel to his own disciple, the virtuous Papias of Hierapolis, to fill up what was lacking in those who before him had proclaimed the word to the nations throughout all the earth.


    Catena Patrum Graecorum in Saint John, published by B. Corder.'
translation:
  language: de
  text: 'Hier beginnt die Einleitung zum Evangelium nach Johannes.


    Das Evangelium des Johannes wurde von Johannes bekannt gemacht und den Gemeinden übergeben, solange er noch im Leib war. So berichtet ein gewisser Papias aus Hierapolis, ein geliebter Schüler des Johannes, in seinen fünf exoterischen [lies: exegetischen] Büchern. Er schrieb das Evangelium aber nach dem Diktat des Johannes gewissenhaft nieder.[a]


    Eine vatikanische Handschrift aus dem 9. Jahrhundert.


    XX


    Denn Johannes, der Letzte von diesen, mit dem Beinamen »Sohn des Donners«, diktierte, als er bereits ein sehr alter Mann war – wie Irenäus und Eusebius sowie eine Reihe glaubwürdiger Geschichtsschreiber uns überliefert haben – zu der Zeit, als schreckliche Irrlehren aufgekommen waren, seinem eigenen Schüler, dem rechtschaffenen Papias von Hierapolis, das Evangelium. Damit sollte er ergänzen, was bei denen fehlte, die vor ihm das Wort den Völkern auf der ganzen Erde verkündet hatten.[b]


    Catena Patrum Graecorum zum Johannesevangelium, herausgegeben von B. Corder.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vorläufige Übersetzung nach dem angegebenen englischen Textzeugen. Die unmittelbare Prüfung des griechischen beziehungsweise lateinischen Wortlauts steht noch aus. Der Zeuge bietet »exoterisch« mit der editorischen Korrektur »exegetisch«; auch der genaue Bezug von »gewissenhaft/richtig« ist zu prüfen.
    reason: Die Daten weisen ausdrücklich darauf hin, dass die quellensprachliche Prüfung noch aussteht; zudem enthält der Zeuge eine Textkorrektur und eine mögliche syntaktische Mehrdeutigkeit.
  - marker: b
    text: Der gelieferte Zeuge führt unter Fragment XIX auch den als »XX« bezeichneten Abschnitt an. Die Formulierung lässt offen, ob sich »was … fehlte« auf frühere Verkündiger, ihre Verkündigung oder frühere Evangelien bezieht.
    reason: Kennzeichnet den Umfang des gelieferten Materials und bewahrt eine echte Auslegungsunsicherheit.
lexical_decisions:
- source_word: argument
  choice: Einleitung
  rationale: In der Überschrift bezeichnet das Wort wahrscheinlich einen einleitenden Abriss oder Prolog, nicht eine moderne Beweisführung.
- source_word: churches
  choice: Gemeinden
  rationale: Natürliche kirchengeschichtliche Wiedergabe, die lokale christliche Gemeinschaften bezeichnet.
- source_word: while he yet remained in the body
  choice: solange er noch im Leib war
  rationale: Bewahrt die frühchristliche Umschreibung für das leibliche Leben, ohne sie bloß zu »solange er lebte« aufzulösen.
- source_word: exoteric (read exegetical) books
  choice: 'exoterischen [lies: exegetischen] Büchern'
  rationale: Erhält sowohl die überlieferte Lesart als auch die im Zeugen angegebene Korrektur.
- source_word: correctly
  choice: gewissenhaft
  rationale: Bezieht das Adverb natürlich auf das Niederschreiben und vermeidet das missverständliche »richtig«, ohne den Sinn der zuverlässigen Ausführung aufzugeben.
- source_word: virtuous
  choice: rechtschaffen
  rationale: Dignified modern German for a moral commendation without denominational coloring.
- source_word: fill up what was lacking
  choice: ergänzen, was ... fehlte
  rationale: Bewahrt die Behauptung einer Ergänzungsfunktion des Johannesevangeliums, ohne Art und Umfang des Mangels näher festzulegen.
- source_word: the word
  choice: das Wort
  rationale: Erhält die mögliche christliche Fachbedeutung der verkündigten Botschaft und lässt die genaue Referenz offen.
theological_decisions:
- issue: Identität des Johannes und Verhältnis zu Papias
  choice: 'Die Bezeichnungen des Zeugen werden unverändert wiedergegeben: Papias ist Schüler des Johannes, und Johannes diktiert ihm das Evangelium.'
  alternative: Johannes ausdrücklich mit dem Apostel oder einer anderen Gestalt identifizieren beziehungsweise die historische Aussage harmonisieren.
  rationale: Der fragmentarische Zeuge selbst löst mögliche historische Spannungen nicht; die Übersetzung darf keine bestimmte Identifikation importieren.
- issue: Art der Entstehung des Johannesevangeliums
  choice: »diktierte« und »nach dem Diktat« werden direkt bewahrt.
  alternative: Abschwächend mit »vermittelte«, »veranlasste« oder »unter seiner Anleitung« übersetzen.
  rationale: Die konkrete Aussage des Zeugen über Diktat und Niederschrift soll weder harmonisiert noch abgeschwächt werden.
- issue: Mangel der früheren Verkündigung
  choice: »was bei denen fehlte« bleibt semantisch offen.
  alternative: Den Mangel ausdrücklich auf die früheren Evangelien, deren Verfasser oder den Inhalt ihrer Mission beziehen.
  rationale: Die englische Überlieferung ist syntaktisch mehrdeutig; ohne Prüfung des griechischen oder lateinischen Wortlauts ist keine engere theologische Festlegung gerechtfertigt.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem kirchengeschichtlichem Register. Archaisierende Wendungen wurden nur dort bewahrt, wo sie inhaltlich tragen (»im Leib war«). Editorische Herkunftsangaben bleiben als separate Zeilen stehen. Da eine direkte Prüfung der griechischen beziehungsweise lateinischen Überlieferung noch aussteht, ist der Entwurf ausdrücklich quellenkritisch vorläufig.
