base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/001.yaml
  text: 'Irenaeus and others record that John the Divine and Apostle survived until the time of Trajan. After that, Papias of Hierapolis and Polycarp, bishop of Smyrna, his hearers, became well known.


    —Eusebius, Chronicon (Syncellus 655, 14), for Olympiad 220.


    II


    At this time Polycarp flourished in Asia. He was a disciple of the Apostles who [corrupt/illegible text concerning the church in Smyrna and “... ministers of the Lord”]. At the same time Papias, who was also bishop of the diocese of Hierapolis, became distinguished.


    —Eusebius, History of the Church 3.36.1–2.'
translation:
  language: de
  text: 'I


    Irenäus und andere berichten, dass Johannes, der Gottesgelehrte und Apostel, bis in die Zeit Trajans lebte. Danach wurden Papias von Hierapolis und Polykarp, der Bischof von Smyrna, als seine Hörer bekannt.[a]


    — Eusebius, Chronik (Synkellos 655,14), zur 220. Olympiade


    II


    Zu dieser Zeit stand Polykarp in Asia in hohem Ansehen. Er war ein Schüler der Apostel und [der Text über die Gemeinde in Smyrna und die »Diener des Herrn« ist verderbt und unleserlich].[b] Zur selben Zeit wurde auch Papias bekannt, der Bischof des Bezirks Hierapolis war.[c]


    — Eusebius, Kirchengeschichte 3,36,1–2'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung legt grammatisch nahe, dass Papias und Polykarp Hörer des Johannes waren. Da hier nur ein beschädigter englischer Zeuge vorliegt und die Prüfung am griechischen beziehungsweise lateinischen Wortlaut noch aussteht, bleibt diese Zuordnung vorläufig.
    reason: Kennzeichnet eine historisch bedeutsame syntaktische Aussage, deren direkte Quellenprüfung noch aussteht.
  - marker: b
    text: Der überlieferte englische Druck beziehungsweise Scan ist an dieser Stelle durch Satz- und OCR-Verderbnis nicht zuverlässig lesbar. Die erkennbaren Hinweise auf die Gemeinde in Smyrna und auf „Diener des Herrn“ reichen nicht für eine sichere Rekonstruktion.
    reason: Macht die tatsächliche Textlücke transparent und verhindert eine unbelegte Ergänzung.
  - marker: c
    text: „Bezirk“ gibt hier die kirchliche Gebietsbezeichnung allgemein wieder; die genaue Terminologie muss anhand des antiken Ausgangstextes geprüft werden.
    reason: Vermeidet einen unbeabsichtigten Anachronismus bei „Diözese“.
lexical_decisions:
- source_word: John the Divine and Apostle
  choice: Johannes, der Gottesgelehrte und Apostel
  rationale: „Gottesgelehrte“ gibt den traditionellen Titel wieder, ohne Johannes ausdrücklich mit dem Verfasser der Offenbarung gleichzusetzen; „der Theologe“ wäre im heutigen Deutsch eher eine Berufsbezeichnung.
- source_word: survived until the times of Trajan
  choice: bis in die Zeit Trajans lebte
  rationale: Natürliches Deutsch; der zeitliche Sinn bleibt erhalten, ohne das im Deutschen missverständliche „überlebte“.
- source_word: his hearers
  choice: als seine Hörer
  rationale: Die Beziehung zu Johannes wird formal bewahrt; „Schüler“ wäre interpretierend stärker als der bezeugte Ausdruck.
- source_word: flourished
  choice: stand … in hohem Ansehen
  rationale: Gibt im biografisch-chronikalischen Zusammenhang öffentliche Bedeutung wieder und vermeidet das heute unnatürliche „blühte“.
- source_word: Asia
  choice: Asia
  rationale: Bezeichnet die römische Provinz, nicht den modernen Kontinent Asien.
- source_word: diocese of Hierapolis
  choice: Bezirk Hierapolis
  rationale: Vermeidet, spätere kirchenrechtliche Vorstellungen unbesehen in den antiken Ausdruck „Diözese“ hineinzulesen.
theological_decisions:
- issue: Identität des Johannes
  choice: Der Titel wird als „Johannes, der Gottesgelehrte und Apostel“ wiedergegeben.
  alternative: „Johannes, der Apostel und Evangelist“ oder ausdrückliche Gleichsetzung mit Johannes von Patmos
  rationale: Die überlieferte Formulierung wird nicht durch eine konfessionell oder historisch weitergehende Identifizierung ergänzt.
- issue: Verhältnis von Papias und Polykarp zu Johannes
  choice: „als seine Hörer“
  alternative: „seine Schüler“
  rationale: Die im Zeugnis angelegte persönliche Hörbeziehung bleibt erhalten, ohne eine stärker definierte Lehrer-Schüler-Beziehung festzuschreiben.
- issue: Verderbter Satz über Polykarp
  choice: Die Lücke wird sichtbar als verderbt und unleserlich markiert.
  alternative: Rekonstruktion aus vermuteten Parallelen
  rationale: Die gelieferte Textgrundlage erlaubt keine verlässliche Wiederherstellung; theologischer oder kirchengeschichtlicher Inhalt wird daher nicht ergänzt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit chronikalischem Ton. Die Fassung ist ausdrücklich vorläufig, da die bereitgestellte Grundlage ein beschädigter englischer Public-Domain-Zeuge ist und eine direkte Prüfung der griechischen beziehungsweise lateinischen Quellen noch aussteht. Offenkundige OCR-Reste wurden nicht in den Lauftext übernommen; die nicht sicher rekonstruierbare Passage wurde sichtbar markiert.
