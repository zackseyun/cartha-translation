    — Eusebius, Chronik (Synkellos 655,14), zur 220. Olympiade


    II


    Zu dieser Zeit stand Polykarp in der Provinz Asia in hohem Ansehen. Er war ein Schüler der Apostel [der Text über die Gemeinde in Smyrna und die »Diener des Herrn« ist verderbt und unleserlich].[b] Zur selben Zeit wurde auch Papias bekannt, der Bischof der Diözese von Hierapolis war.[c]


