review_pass:
  verdict: revise
  source_fidelity: Die erste Notiz folgt dem bereitgestellten englischen Zeugen im Wesentlichen genau. Die Zuordnung von „his hearers“ zu Johannes ist syntaktisch naheliegend, sollte jedoch wegen der noch ausstehenden Prüfung des griechisch/lateinischen Wortlauts weiterhin als vorläufig markiert bleiben. Die zweite Notiz enthält im Zeugen eine tatsächlich nicht sicher rekonstruierbare Verderbnis; die sichtbare Kennzeichnung der Lücke ist daher sachgerecht. „diocese“ sollte nicht zu einem unverbindlichen „Bezirk“ abgeschwächt werden, sondern als „Diözese“ wiedergegeben werden, mit erläuternder Anmerkung zur historischen Terminologie.
  naturalness: „Johannes, der Gottesgelehrte“ ist im modernen Standarddeutsch ungewöhnlich und wirkt zudem missverständlich. Der etablierte und verständliche Titel „Johannes, der Theologe“ ist hier die natürliche Wiedergabe von „John the Divine“. „In der Provinz Asia“ verdeutlicht idiomatisch, dass die römische Provinz und nicht der moderne Kontinent gemeint ist. Die Interpunktion an der markierten Textlücke wird geglättet.
  terminology: „Theologe“ gibt den traditionellen Titel wieder, ohne eine weitergehende Identifikation zu behaupten. „Diözese von Hierapolis“ bewahrt den Wortlaut des englischen Zeugen; die Fußnote hält fest, dass damit keine unbesehene Gleichsetzung mit späteren kirchenrechtlichen Strukturen behauptet wird. „Schüler der Apostel“ entspricht „a disciple of the Apostles“ und ist im Deutschen natürlich.
  issues:
  - severity: medium
    issue: „Gottesgelehrte“ für „the Divine“
    rationale: Die Formulierung ist im heutigen Deutsch kaum idiomatisch. „Johannes, der Theologe“ ist als historischer Titel verständlich und quellenäher.
  - severity: medium
    issue: „Bezirk Hierapolis“ für „diocese of Hierapolis“
    rationale: „Bezirk“ verwischt die im Zeugen ausdrücklich kirchliche Gebietsbezeichnung. „Diözese von Hierapolis“ ist die angemessene Übersetzung; eine Anmerkung kann vor modernisierenden Schlussfolgerungen schützen.
  - severity: low
    issue: „Asia“ ohne geographische Präzisierung
    rationale: „In Asia“ kann im Deutschen wie eine Bezeichnung des modernen Kontinents wirken. „In der Provinz Asia“ bewahrt den antiken Referenten.
  - severity: low
    issue: Satzanschluss und Punktsetzung bei der verderbten Passage
    rationale: Der deutsche Satz sollte nicht künstlich eine aus dem beschädigten Text nicht sicher erschließbare Relativsatzkonstruktion erzeugen; die Lücke ist besser unmittelbar nach „Schüler der Apostel“ markiert.
