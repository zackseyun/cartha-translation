base_translation:
  language: en
  yaml_path: translation/extra_canonical/fragments_of_papias/013.yaml
  text: 'By this he speaks obscurely, referring, I suppose, to Papias of Hierapolis in Asia, who was a bishop at that time and flourished in the days of the holy Evangelist John. For this Papias, in the fourth book of his Dominical Expositions, mentioned foods among the sources of delights in the resurrection.... And Irenaeus of Lyons says the same thing in his fifth book Against Heresies and presents the aforementioned Papias in support of his statements.


    MAXIMUS THE CONFESSOR, Scholia on Dionysius the Areopagite’s Ecclesiastical Hierarchy, chapter 7.'
translation:
  language: de
  text: 'Damit spricht er, wie ich meine, in dunklen Andeutungen von Papias aus Hierapolis in Asia[a], der damals Bischof war und zur Zeit des heiligen Evangelisten Johannes wirkte. Denn dieser Papias erwähnte im vierten Buch seiner »Auslegungen der Herrenworte«[b] Speisen als eine der Quellen der Freuden bei der Auferstehung …[c] Auch Irenäus von Lyon sagt im fünften Buch seines Werkes »Gegen die Häresien« dasselbe und führt zur Bekräftigung seiner Aussagen den zuvor genannten Papias an.


    MAXIMUS CONFESSOR, Scholien zu Dionysius Areopagitas »Kirchlicher Hierarchie«, Kapitel 7.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: »Asia« bezeichnet hier die römische Provinz Asia im westlichen Kleinasien, nicht den heutigen Kontinent Asien.
    reason: Verhindert ein modernes geografisches Missverständnis.
  - marker: b
    text: Der Werktitel wird auch mit »Auslegungen der Worte des Herrn« wiedergegeben. Die genaue quellensprachliche Form muss noch am griechischen beziehungsweise lateinischen Überlieferungstext geprüft werden.
    reason: Kennzeichnet die mögliche Titelvariante und den vorläufigen Status der quellensprachlichen Prüfung.
  - marker: c
    text: Die Auslassungspunkte stehen bereits im zugrunde gelegten englischen Textzeugen und weisen auf ausgelassenen oder nicht wiedergegebenen Text hin.
    reason: Bewahrt und erklärt das Überlieferungs- beziehungsweise Editionssignal.
lexical_decisions:
- source_word: darkly indicating
  choice: in dunklen Andeutungen
  rationale: Bewahrt die Aussage, dass der Bezug verhüllt beziehungsweise nicht ausdrücklich ist, in natürlichem Deutsch.
- source_word: flourished
  choice: wirkte
  rationale: Das idiomatische deutsche Wort bezeichnet hier Papias’ zeitliche Tätigkeit, ohne eine genauere Datierung vorzutäuschen.
- source_word: Dominical Expositions
  choice: Auslegungen der Herrenworte
  rationale: Gibt den wahrscheinlichen Werktitel verständlich wieder; die englische Zeugnisform allein lässt die genaue quellensprachliche Titelform jedoch offen.
- source_word: viands
  choice: Speisen
  rationale: Entspricht dem sachlichen Sinn und vermeidet das heute gehobene, möglicherweise irreführende »Leckerbissen«.
- source_word: sources of delights
  choice: eine der Quellen der Freuden
  rationale: Bewahrt das Bild des Zeugnisses und die Einordnung der Speisen unter mehrere Freudenquellen.
- source_word: in the resurrection
  choice: bei der Auferstehung
  rationale: Lässt offen, ob die Auferstehung als Ereignis oder als Zustand beziehungsweise Zeitalter gemeint ist.
- source_word: produces in support
  choice: führt zur Bekräftigung … an
  rationale: Natürliche wissenschaftliche Ausdrucksweise für die Berufung auf Papias als Beleg.
theological_decisions:
- issue: Speisen und Freuden bei der Auferstehung
  choice: Die konkrete Aussage des Zeugnisses wird ohne Vergeistigung wiedergegeben.
  alternative: Die Speisen metaphorisch als geistliche Segnungen erklären.
  rationale: Der Text selbst nennt Speisen; eine konfessionelle oder allegorische Deutung wäre nicht durch das vorliegende Zeugnis gedeckt.
- issue: Beziehung des Papias zum Evangelisten Johannes
  choice: »zur Zeit des … Johannes wirkte«
  alternative: Papias als unmittelbaren Schüler oder persönlichen Bekannten des Johannes bezeichnen.
  rationale: Das Fragment behauptet nur zeitliche Überschneidung; eine engere Beziehung darf nicht ergänzt werden.
- issue: Identität des genannten Johannes
  choice: »der heilige Evangelist Johannes«
  alternative: Zwischen Johannes dem Apostel, dem Evangelisten oder einem anderen Johannes entscheiden.
  rationale: Die Ehren- und Rollenbezeichnung des Zeugnisses wird bewahrt, ohne die historische Identitätsfrage zusätzlich festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit historisch-wissenschaftlichem Ton. Der Entwurf ist ausdrücklich vorläufig, da nur der gemeinfreie englische Übersetzungszeuge vorliegt und die direkte Prüfung des griechischen beziehungsweise lateinischen Quellentextes noch aussteht. Eigennamen sind in gebräuchlicher deutscher Form normalisiert; »Asia« bleibt als antike Provinzbezeichnung erhalten und wird erläutert.
