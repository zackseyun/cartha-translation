review_pass:
  verdict: revise
  source_fidelity: Der Entwurf gibt den Inhalt des vorliegenden englischen Textzeugen im Wesentlichen zutreffend wieder. »Damit spricht er« ist jedoch keine genaue und natürliche Wiedergabe von „This he says“ und sollte zu »Dies sagt er« geändert werden. Ferner bezeichnet „among the sources of delights“ Speisen als Bestandteil bzw. unter den Quellen der Freuden, nicht ausdrücklich als nur »eine« Quelle. Da eine unmittelbare Prüfung des griechisch/lateinischen Überlieferungstextes noch aussteht, bleibt die Übersetzung des Werktitels vorsichtig erläutert.
  naturalness: Die Sprache ist überwiegend modernes, würdiges Standarddeutsch. »Dies sagt er, indem er, wie ich meine, ... andeutet« bildet Satzbau und Vorbehalt des Zeugen klarer ab. »in der Auferstehung« ist als nahe Wiedergabe von „in the resurrection“ geeigneter als »bei der Auferstehung«, weil es nicht auf den Zeitpunkt des Ereignisses eingeengt wird.
  terminology: Eigennamen und zentrale Begriffe sind angemessen. »Maximus der Bekenner« ist die gebräuchliche deutsche Namensform. »Über die kirchliche Hierarchie« gibt den zitierten Werkzusatz verständlich wieder. Der tradierte Titel von Papias wird als »Auslegung der Herrenworte« wiedergegeben; die Fußnote wahrt wegen der ausstehenden direkten Quellenprüfung die nötige Vorläufigkeit.
  issues:
  - severity: medium
    issue: Unpräzise Wiedergabe von „This he says“
    rationale: '»Damit spricht er« ist im Deutschen semantisch und idiomatisch weniger passend. Der Zeuge sagt ausdrücklich: »Dies sagt er«.'
  - severity: medium
    issue: Einengung von „among the sources of delights“
    rationale: »als eine der Quellen« fügt eine numerische Singularisierung hinzu. »unter den Quellen der Freuden« bewahrt die offene Pluralform des Zeugen.
  - severity: low
    issue: Zeitliche Einengung von „in the resurrection“
    rationale: »bei der Auferstehung« kann vor allem das Ereignis meinen. »in der Auferstehung« lässt den vom Zeugen möglichen eschatologischen Bezugsrahmen offen.
  - severity: low
    issue: Quellenangabe nicht in gebräuchlicher deutscher Form
    rationale: Die deutsche Form »Maximus der Bekenner« und der deutsche Werktitel sind für eine deutschsprachige Ausgabe natürlicher, ohne den bibliografischen Bezug zu verändern.
  revised_text: 'Dies sagt er, indem er, wie ich meine, Papias von Hierapolis in Asia[a] dunkel andeutet, der damals Bischof war und in den Tagen des heiligen Evangelisten Johannes wirkte. Denn dieser Papias erwähnte im vierten Buch seiner »Auslegung der Herrenworte«[b] Speisen unter den Quellen der Freuden in der Auferstehung …[c] Auch Irenäus von Lyon sagt im fünften Buch seines Werkes »Gegen die Häresien« dasselbe und führt den zuvor genannten Papias zur Bekräftigung seiner Aussagen an.



    MAXIMUS DER BEKENNER, Scholien zu Dionysius dem Areopagiten, »Über die kirchliche Hierarchie«, Kapitel 7.'
  revised_footnotes:
