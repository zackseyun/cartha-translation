  text: But you, do not withdraw from the way of the law, but guard and admonish the people who remain, lest they withdraw from the commandments of the Mighty One.
translation:
  language: de
  text: Ihr aber sollt nicht vom Weg des Gesetzes abweichen. Wacht vielmehr über das Volk, das übrig geblieben ist, und ermahnt es, damit es nicht von den Geboten des Mächtigen abweicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܥܕܘܢ / ܢܥܕܘܢ
  choice: abweichen
  rationale: Das Verb bezeichnet hier ein Sich-Entfernen oder Abweichen; die Wiederholung in Warnung und Zwecksatz wird im Deutschen beibehalten.
- source_word: ܐܘܪܚܐ ܕܢܡܘܣܐ
  choice: Weg des Gesetzes
  rationale: Die Wegmetapher und der Bezug auf das Gesetz werden formal bewahrt.
- source_word: ܥܡܐ ܕܐܫܬܚܪ
  choice: das Volk, das übrig geblieben ist
  rationale: Gibt die verbliebene beziehungsweise verschonte Gemeinschaft wieder, ohne den Ausdruck vorschnell als theologischen Fachbegriff »Rest« festzulegen.
- source_word: ܦܘܩ̈ܕܢܘܗܝ
  choice: Gebote
  rationale: Entspricht dem üblichen Sinn von Anordnungen oder Geboten und passt zum parallelen Bezug auf das Gesetz.
- source_word: ܚܝܠܬܢܐ
  choice: der Mächtige
  rationale: Bewahrt den Gottesbeiname als substantiviertes Adjektiv, statt ihn durch einen konfessionell geprägten Titel zu ersetzen.
theological_decisions:
- issue: Bezeichnung Gottes
  choice: des Mächtigen
  alternative: des Allmächtigen
  rationale: »Der Mächtige« bildet den syrischen Gottesbeiname enger ab; »der Allmächtige« würde eine stärkere, im Ausdruck nicht zwingend enthaltene Nuance eintragen.
- issue: Bezeichnung der verbliebenen Gemeinschaft
  choice: das Volk, das übrig geblieben ist
  alternative: den Rest des Volkes
  rationale: Die ausformulierte Wiedergabe erhält den konkreten Sinn und vermeidet, aus dem Ausdruck ungekennzeichnet einen theologischen Fachterminus zu machen.
translation_notes:
  register: Dignifiziertes, gegenwärtiges Standarddeutsch. Die direkte Anrede steht im Plural. Die beiden Imperative werden natürlich gegliedert; die wiederholte Warnung vor dem Abweichen bleibt erhalten.
