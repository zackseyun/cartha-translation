  text: And I, Baruch, went from there and came to the people. And I called my firstborn, its inhabitants, and the elders of its great ones, and the lowly from the elders of the people, and I said to them,
translation:
  language: de
  text: '1 Und ich, Baruch, ging von dort weg und kam zum Volk. Ich rief meinen Erstgeborenen, seine Bewohner, die Ältesten seiner Großen und die Geringen unter den Ältesten des Volkes zusammen[a] und sagte zu ihnen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die syrische Aufzählung ist sprachlich und textlich unsicher. Möglich ist eine geglättete Wiedergabe wie: „die Mächtigen des Volkes und die Ältesten“.'
    reason: Bewahrt die auffällige Lesart des vorliegenden syrischen Textes und nennt zugleich eine verbreitete alternative Auffassung der schwierigen Personenliste.
lexical_decisions:
- source_word: ܒܘܟܪܝ
  choice: meinen Erstgeborenen
  rationale: Die Form bezeichnet ihrem gewöhnlichen Sinn nach „meinen Erstgeborenen“. Obwohl der Zusammenhang möglicherweise eine führende Person oder Gruppe meint, wird die auffällige Form des überlieferten syrischen Textes nicht stillschweigend geglättet.
- source_word: ܥܡܘܪܝܗ
  choice: seine Bewohner
  rationale: Die wörtliche Bedeutung ist „seine Bewohner“; das Possessivpronomen wird im Deutschen natürlich auf das unmittelbar zuvor genannte Volk bezogen.
- source_word: ܩܫ̈ܝܫܝ ܪ̈ܘܪܒܢܘܗܝ
  choice: die Ältesten seiner Großen
  rationale: Die schwierige syrische Fügung wird formal bewahrt, statt sie aufgrund paralleler Stellen zu einer vertrauteren Liste umzubauen.
- source_word: ܡܟܝܟܐ
  choice: die Geringen
  rationale: Das Wort kann soziale Niedrigkeit oder Demut bezeichnen. „Die Geringen“ passt hier zu einer Aufzählung gesellschaftlicher Gruppen und vermeidet eine rein innerliche Deutung.
theological_decisions:
- issue: Zusammensetzung der von Baruch einberufenen Gruppe
  choice: Die ungewöhnliche, im überlieferten Syrisch stehende Liste bleibt im Haupttext erhalten.
  alternative: „die Mächtigen des Volkes und die Ältesten“ beziehungsweise eine nach Parallelstellen emendierte Personenliste
  rationale: Die Textgestalt ist schwierig, doch eine Harmonisierung mit anderen Einberufungsszenen würde textkritische Entscheidungen in die Übersetzung eintragen. Die echte Unsicherheit wird daher durch eine Fußnote kenntlich gemacht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Erzählform bleibt schlicht; die ungewöhnliche Personenliste wird bewusst nicht harmonisiert. „Zusammen“ verdeutlicht im Deutschen idiomatisch den Sinn des Einberufens, ohne eine zusätzliche Personengruppe einzuführen.
