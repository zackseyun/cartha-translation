  text: But remember and admonish the people who remain, lest they withdraw from the commandments of the Mighty One.
translation:
  language: de
  text: Doch denkt an das Volk, das übrig bleibt, und ermahnt es, damit es Gottes Gebote nicht verlässt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܫܬܚܪ
  choice: übrig bleibt
  rationale: Das syrische Verb bezeichnet das Zurück- beziehungsweise Übrigbleiben und bezieht sich hier auf den verbleibenden Teil des Volkes.
- source_word: ܦܘܩ̈ܕܢܘܗܝ ܕܐܠܗܐ
  choice: Gottes Gebote
  rationale: Der vorgelegte syrische Text lautet ausdrücklich „die Gebote Gottes“. Daher wird nicht die konsultative englische Wiedergabe „des Mächtigen“ übernommen.
- source_word: ܢܫܒܘܩ ܡܢ
  choice: verlässt
  rationale: Die Konstruktion bedeutet hier, sich von den Geboten abzuwenden beziehungsweise sie aufzugeben; „verlässt“ gibt das Bild knapp und natürlich wieder.
theological_decisions:
- issue: Gottesbezeichnung
  choice: Gott
  alternative: der Mächtige
  rationale: Im syrischen Ausgangstext steht ܐܠܗܐ, „Gott“. Die titulare Wiedergabe „der Mächtige“ der englischen Konsultationsfassung ist an dieser Stelle nicht unmittelbar durch den vorgelegten Wortlaut gestützt.
translation_notes:
  register: Moderne, würdige Standardsprache. Der auffordernde Ton der fortlaufenden Rede wird bewahrt; das kollektive „Volk“ wird im Deutschen mit dem singularischen Pronomen „es“ wieder aufgenommen.
