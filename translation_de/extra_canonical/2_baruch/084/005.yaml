translation:
  language: de
  text: 'Und Mose sagte euch, bevor es euch widerfuhr: »Seht, diese Dinge sind euch widerfahren, weil ihr das Gesetz verlassen habt.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܘܫܐ
  choice: Mose
  rationale: Die geläufige deutsche Namensform.
- source_word: ܡܢ ܩܕܝܡ
  choice: schon, bevor
  rationale: Gibt den zeitlichen Rückbezug natürlich wieder.
- source_word: ܢܓܕܫܟܘܢ / ܓܕܫܟܘܢ
  choice: es euch widerfuhr / es ist euch widerfahren
  rationale: Bewahrt die Wiederholung des syrischen Verbs und den ernsten, gehobenen Ton.
- source_word: ܢܡܘܣܐ
  choice: das Gesetz
  rationale: Bezeichnet hier das mosaische Gesetz, ohne eine zusätzliche konfessionelle Deutung einzutragen.
- source_word: ܫܒܩ
  choice: verlassen
  rationale: Gibt die bewusste Abkehr vom Gesetz prägnant wieder.
theological_decisions:
- issue: Ursächlicher Zusammenhang zwischen dem Widerfahrnis und der Abkehr vom Gesetz
  choice: „weil ihr das Gesetz verlassen habt“
  alternative: „denn ihr habt das Gesetz verlassen“
  rationale: Die kausale Aussage wird klar ausgedrückt, ohne genauer festzulegen, auf welche einzelnen Ereignisse oder Formen des Gerichts sie sich bezieht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „davor gewarnt“ macht die elliptische Aussage „Mose sagte euch“ im Zusammenhang verständlich; die Wiederholung von „widerfahren“ erhält die rhetorische Struktur. Das einleitende „Und nun“ und „seht“ bewahren den mahnenden Charakter.
