  yaml_path: translation/extra_canonical/2_baruch/084/001.yaml
  text: Look, while I am still alive I have made these things known to you, because I said that you should learn what is good; for the Mighty One commanded me to instruct you, and before I die I will set before you some of the ordinances of his judgment.
translation:
  language: de
  text: '**2. Baruch 84,1**


    Siehe, solange ich noch lebe, habe ich euch dies bekannt gemacht, denn ich sagte, ihr sollt lernen, was gut ist. Der Mächtige[a] hat mir nämlich geboten, euch zu unterweisen; und bevor ich sterbe, werde ich euch einige Bestimmungen seines Gerichts vorlegen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich beziehungsweise als Titel: »der Mächtige«; gemeint ist Gott.'
    reason: Der ungewohnte, aber theologisch und rhetorisch bedeutsame syrische Gottestitel wird im Text bewahrt und knapp erläutert.
lexical_decisions:
- source_word: ܚܝܠܬܐ
  choice: der Mächtige
  rationale: Bewahrt den markanten syrischen Gottes­titlel, statt ihn zum allgemeinen Gottesnamen einzuebnen.
- source_word: ܫܦܝܪ̈ܬܐ
  choice: was gut ist
  rationale: Gibt die moralisch qualifizierende Bedeutung in natürlichem, verständlichem Deutsch wieder, ohne sie unnötig auszuschmücken.
- source_word: ܦܘܩ̈ܕܢܐ / ܦܘܩ̈ܕܢܘܗܝ
  choice: Bestimmungen
  rationale: Passt zum hier hervorgehobenen gerichtlichen Zusammenhang und bewahrt zugleich den verpflichtenden Charakter.
- source_word: ܕܝܢܐ / judgment language
  choice: Gericht
  rationale: Lässt den forensischen und theologischen Sinn offen und deutet ihn nicht vorschnell als bloße Strafe oder als Rechtsordnung um.
theological_decisions:
- issue: Gottestitel
  choice: der Mächtige
  alternative: Gott; der Herr; der Starke
  rationale: Der syrische Titel besitzt eine eigene rhetorische Prägung und soll nicht durch einen geläufigeren Gottesnamen ersetzt werden.
- issue: Verhältnis von Unterweisung und Gericht
  choice: Bestimmungen seines Gerichts
  alternative: Gebote seines Rechts; Urteile seines Gerichts
  rationale: Die Formulierung hält den Zusammenhang von göttlicher Weisung und Gericht fest, ohne festzulegen, ob einzelne Rechtssprüche, Satzungen oder gerichtliche Entscheidungen gemeint sind.
