base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/010.yaml
  text: And at all times keep asking earnestly, and pray diligently with your whole heart, that the Mighty One may be reconciled to you and may not reckon the multitude of your sins, but remember the uprightness of your fathers.
translation:
  language: de
  text: Und bittet zu jeder Zeit inständig und betet eifrig von ganzem Herzen, damit der Mächtige sich mit euch versöhnt[a], euch die Vielzahl eurer Sünden nicht anrechnet, sondern sich an die Rechtschaffenheit eurer Väter erinnert.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: sich über euch erbarmt.'
    reason: Die zugrunde liegende Form kann neben relationaler Versöhnung auch gnädiges Erbarmen ausdrücken.
lexical_decisions:
- source_word: ܚܝܠܬܢܐ
  choice: der Mächtige
  rationale: Der syrische Gottesbeiname wird in seiner substantivierten Form bewahrt und nicht durch eine konfessionell stärker geprägte Bezeichnung ersetzt.
- source_word: ܡܒ̈ܩܐ ܣ̈ܓܝܐܐ
  choice: inständig bitten
  rationale: Die Verbindung bezeichnet nachdrückliches, anhaltendes Bitten; natürliches Deutsch gibt die Intensität mit „inständig“ wieder.
- source_word: ܡܢ ܟܠܗ ܢܦܫܟܘܢ
  choice: von ganzem Herzen
  rationale: Wörtlich steht „aus eurer ganzen Seele/eurem ganzen Selbst“; „von ganzem Herzen“ ist die natürliche deutsche Ganzheitsformel im Gebetskontext.
- source_word: ܫܘܒ̈ܠܡܢܘܬܗ
  choice: Rechtschaffenheit
  rationale: Die Wiedergabe bezeichnet die sittliche Geradheit der Väter, ohne sie stärker als vollkommene Gerechtigkeit zu deuten.
theological_decisions:
- issue: Bedeutung der relationalen Bitte an den Mächtigen
  choice: sich mit euch versöhnt
  alternative: sich über euch erbarmt
  rationale: Die Hauptfassung bewahrt den Gedanken einer wiederhergestellten Beziehung; die ebenfalls mögliche Deutung als Erbarmen wird in der Fußnote offengehalten.
- issue: Verhältnis von Sünden und Verdiensten der Väter
  choice: nicht anrechnet, sondern sich erinnert
  alternative: vergibt wegen der Rechtschaffenheit der Väter
  rationale: Der Text stellt Anrechnung und Erinnerung nebeneinander, sagt aber nicht ausdrücklich, dass die Väter die Vergebung verdienen oder bewirken.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die aneinandergereihten Bitten und der Gebetscharakter des Satzes bleiben erhalten; unnötig altertümliche Formen wurden vermieden.
