  text: For if he should judge us not according to the abundance of his mercies, woe to all of us who have been born.
translation:
  language: de
  text: Denn wenn er uns nicht nach der Fülle seines Erbarmens richten sollte, wehe uns allen, die geboren wurden!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܐ ܐܝܟ (lā ʾak)
  choice: nicht nach
  rationale: Die Wendung bezeichnet hier den Maßstab beziehungsweise die Weise des Richtens. „Nicht nach“ gibt dies im Deutschen genauer wieder als „abgesehen von“ oder „ohne“.
- source_word: ܣܘܓܐܐ ܕܪ̈ܚܡܘܗܝ (sinngemäß im überlieferten Text)
  choice: die Fülle seines Erbarmens
  rationale: „Fülle“ bewahrt den Gedanken des Übermaßes; „Erbarmen“ ist im Zusammenhang mit dem göttlichen Gericht natürlich, würdig und im Deutschen idiomatisch.
- source_word: ܘܝ ܠܟܠܢ ܝܠܝ̈ܕܐ (Textgestalt teilweise verderbt/OCR-unsicher)
  choice: wehe uns allen, die wir geboren sind
  rationale: Die Formulierung bewahrt die umfassende Klage über alle Geborenen, ohne sie erklärend auf eine bestimmte Menschengruppe einzuengen.
theological_decisions:
- issue: Verhältnis von göttlichem Gericht und Erbarmen
  choice: Das Erbarmen bleibt ausdrücklich der Maßstab, nach dem Gott richtet.
  alternative: Den Satz so wiederzugeben, als fände das Gericht unabhängig vom Erbarmen statt.
  rationale: Die syrische Konstruktion mit „nicht nach“ stellt Gericht und Erbarmen spannungsvoll nebeneinander. Die Übersetzung erklärt nicht, wie beides systematisch zusammengehört, sondern bewahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der konditionale Satzbau und der Weheruf bleiben erhalten; das Ausrufezeichen macht die im Syrischen erkennbare Klage im Deutschen deutlich.
