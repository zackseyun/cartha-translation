  text: Hand on this letter and the traditions of the law to your children after you, just as your fathers handed them on to you.
translation:
  language: de
  text: Gebt diesen Brief und die Überlieferungen des Gesetzes an eure Kinder nach euch weiter, so wie eure Väter sie an euch weitergegeben haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܓܪܬܐ (im Verszusammenhang rekonstruiert)
  choice: Brief
  rationale: Die übliche syrische Bezeichnung für ein Schreiben; „Brief“ ist im Deutschen natürlich und entspricht dem literarischen Zusammenhang.
- source_word: ܡܫܠܡܢܘܬܐ / Überlieferungsterminologie (im Verszusammenhang)
  choice: Überlieferungen
  rationale: Bewahrt den Gedanken weitergegebener Traditionen und vermeidet die engere, potenziell abwertende Bedeutung von „Traditionen“.
- source_word: ܢܡܘܣܐ
  choice: Gesetz
  rationale: Bezeichnet hier das göttliche Gesetz beziehungsweise die Tora; „Gesetz“ hält den Wortlaut offen, ohne eine konfessionelle Auslegung einzutragen.
- source_word: ܐܫܠܡ / Weitergabe-Terminologie
  choice: weitergeben
  rationale: Gibt sowohl die Übergabe des Briefes als auch die generationenübergreifende Überlieferung angemessen wieder.
theological_decisions:
- issue: Verhältnis von Brief und Überlieferungen zum Gesetz
  choice: „diesen Brief und die Überlieferungen des Gesetzes“
  alternative: „diesen Brief und die gesetzlichen Überlieferungen“
  rationale: Die Genitivverbindung bleibt erhalten und wird nicht vorschnell als bloßes Adjektiv oder als bestimmte spätere Traditionskategorie ausgelegt.
- issue: Generationenfolge
  choice: „an eure Kinder nach euch … wie eure Väter … an euch“
  alternative: „euren Nachkommen … wie ihr es von euren Vorfahren empfangen habt“
  rationale: Die konkrete Symmetrie zwischen Kindern und Vätern sowie zwischen Weitergabe und Empfang bleibt sichtbar.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Imperativ im Plural und die generationenübergreifende Weitergabe werden klar und ohne konfessionelle Zusätze formuliert.
