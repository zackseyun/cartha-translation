  yaml_path: translation/extra_canonical/2_baruch/084/007.yaml
  text: Let this letter also be a witness between me and you, so that you may remember the commandments of the Mighty One, and so that it may become a vindication for me before him who sent me.
translation:
  language: de
  text: Auch dieser Brief soll ein Zeuge zwischen mir und euch sein, damit ihr euch an die Gebote des Mächtigen erinnert und er mir vor dem, der mich gesandt hat, zur Rechtfertigung dient.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܓܪܬܐ (im durch die Versabgrenzung vorausgesetzten Wortlaut)
  choice: Brief
  rationale: Die in der englischen Kontrollschicht bezeugte konkrete Bezeichnung passt zum literarischen Zusammenhang des Sendschreibens und ist im Deutschen natürlich.
- source_word: ܣܗܕܐ / Zeugnisformel (rekonstruierte Verszuordnung)
  choice: ein Zeuge zwischen mir und euch
  rationale: Bewahrt die personale Rechtsmetapher und die gegenseitige Verantwortlichkeit, ohne sie zu einem bloßen Erinnerungszeichen abzuschwächen.
- source_word: ܦܘܩ̈ܕܢܘܗܝ
  choice: die Gebote
  rationale: Gibt den Plural präzise wieder und wahrt den verbindlichen Charakter der göttlichen Weisungen.
- source_word: ܚܝܠܬܐ
  choice: des Mächtigen
  rationale: Entspricht dem für 2 Baruch charakteristischen Gottesepitheton und vermeidet eine unmarkierte Ersetzung durch „Gott“ oder „den Allmächtigen“.
- source_word: ܙܕܝܩܘܬܐ / rechtliche Bewährungsformel (rekonstruierte Verszuordnung)
  choice: zur Rechtfertigung
  rationale: Erhält den forensischen Sinn einer bestätigenden Entlastung oder Erweisführung vor dem Sender.
theological_decisions:
- issue: Bezeichnung Gottes als „der Mächtige“
  choice: Das Epitheton wird substantiviert als „des Mächtigen“ beibehalten.
  alternative: „Gottes“ oder „des Allmächtigen“
  rationale: So bleibt die eigentümliche Gottesbezeichnung des syrischen Textes sichtbar, ohne eine stärkere oder konfessionell geläufigere Benennung einzutragen.
- issue: Funktion des Briefes vor dem göttlichen Sender
  choice: „zur Rechtfertigung dient“
  alternative: „zu meiner Entlastung wird“ oder „für mich Zeugnis ablegt“
  rationale: 'Die rechtliche Spannung bleibt erhalten: Der Brief bezeugt Baruchs treue Ermahnung, ohne festzulegen, dass damit bereits ein endgültiger Freispruch gemeint ist.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt nah an der dreifachen Zweck- und Zeugnislogik des Verses. Da der bereitgestellte syrische Kapitelblock keine verlässlich sichtbare Einzelversabgrenzung bietet, wurde die englische POB-Fassung nur als kontrollierte Zuordnungshilfe verwendet; die prägenden syrischen Begriffe und der rechtliche Ton wurden vorrangig berücksichtigt.
