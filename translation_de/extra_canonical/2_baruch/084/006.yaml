revisions:
- from: Darum sage auch ich euch nach allem, was ihr durchgemacht habt:[a] Wenn ihr auf diese Worte hört, die zu euch gesprochen worden sind, werdet ihr von dem Mächtigen das Reich empfangen, das für euch bereitsteht und aufbewahrt wird.[b]
  to: So sage auch ich euch, nachdem ihr dies gesehen habt:[a] Wenn ihr auf das hört, was zu euch gesagt worden ist, werdet ihr von dem Mächtigen das Reich empfangen, das für euch bereitgehalten und verwahrt ist.[b]
  rationale: Die Revision ersetzt die interpretierende Haupttextparaphrase von ܚܙܝܬܘܢ durch eine wörtlich offene Wiedergabe und verlegt die kontextuelle Deutung in die Fußnote. Sie behält die im englischen POB-Audit belegte Konditionalstruktur bei, da die bereitgestellte syrische Kapitelzuordnung ausdrücklich nur tentativ ist. Die Bezeichnungen „der Mächtige“ und „das Reich“ bleiben unverändert.
