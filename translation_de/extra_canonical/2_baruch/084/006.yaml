review_pass:
  verdict: revise
  source_fidelity: Die Fassung gibt die Gabe als „Reich“ und den Gottesbezeichner zutreffend wieder. „nach allem, was ihr durchgemacht habt“ deutet ܚܙܝܬܘܢ jedoch stärker als der Wortlaut, dessen Grundsinn „ihr gesehen habt“ ist. Die Bedingung des englischen Audit-Trails („wenn ihr auf das hört, was gesagt worden ist“) wird beibehalten; die unmittelbar vorliegende syrische Seitenzuordnung ist als tentative Kapitelinterpolation ausgewiesen und lässt keine sichere, weitergehende Umstellung zu.
  naturalness: Der Satz ist verständlich und würdig. „auf diese Worte hört“ kann idiomatischer und näher an der unbestimmteren Formulierung des Audit-Trails als „auf das hört, was zu euch gesagt worden ist“ formuliert werden. Die Verbindung „bereitsteht und aufbewahrt wird“ ist etwas uneinheitlich; „bereitgehalten und verwahrt ist“ ist flüssiger.
  terminology: „der Mächtige“ für den substantivierten Gottesbezeichner und „das Reich“ für ܡܠܟܘܬܐ sind angemessen. Die Fußnote zur Mehrdeutigkeit von ܩܝܡ bewahrt sinnvoll die Möglichkeit „Bestand hat/bestehen bleibt“.
  issues:
  - severity: medium
    issue: Die Wiedergabe von ܚܙܝܬܘܢ ist im Haupttext zu stark paraphrasiert.
    rationale: „was ihr durchgemacht habt“ legt Erleiden beziehungsweise Bewältigung nahe. Der syrische Wortlaut ist visuell („ihr gesehen habt“) und kann im Kontext erfahrungsbezogen sein, sollte diese Offenheit aber im Haupttext behalten.
  - severity: low
    issue: Die Formulierung der Bedingung und der Verwahrung kann geglättet werden.
    rationale: „auf das hört, was zu euch gesagt worden ist“ ist natürlich und weniger demonstrativ als „auf diese Worte“. „bereitgehalten und verwahrt ist“ verbindet die beiden Prädikate idiomatisch.
