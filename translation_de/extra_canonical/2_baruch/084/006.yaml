  yaml_path: translation/extra_canonical/2_baruch/084/006.yaml
  text: 'So I also say to you after your suffering: if you listen to these words that have been spoken to you, you will receive from the Mighty One what has been kept ready and stored up for you.'
translation:
  language: de
  text: So sage auch ich euch, nachdem ihr dies gesehen habt:[a] Wenn ihr auf das hört, was zu euch gesagt worden ist, werdet ihr von dem Mächtigen das Reich empfangen, das für euch bereitgehalten und verwahrt ist.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „nachdem ihr gesehen habt“. Im Zusammenhang kann dies auch das Erleben oder Erleiden der vorausgehenden Ereignisse bezeichnen.'
    reason: Die Anmerkung wahrt den visuellen Grundsinn des syrischen Verbs und dokumentiert zugleich die kontextuell mögliche erfahrungsbezogene Bedeutung.
  - marker: b
    text: 'Der syrische Text nennt ausdrücklich „das Reich“. Das Wort für „bereitgehalten“ kann auch den Sinn haben: „das Bestand hat“ oder „das bestehen bleibt“; die anschließende Wendung bezeichnet es als für euch verwahrt.'
    reason: Die Anmerkung hält sowohl den ausdrücklich genannten Gegenstand als auch die Bedeutungsweite der umstritten beziehungsweise kontextabhängig zu verstehenden Prädikation fest.
lexical_decisions:
- source_word: ܚܙܝܬܘܢ
  choice: was ihr durchgemacht habt
  rationale: Das Verb bedeutet wörtlich „ihr habt gesehen“, kann hier aber das Erleben der vorausgehenden Not bezeichnen. Die Formulierung bewahrt den Erfahrungsbezug, ohne die Bedeutung vorschnell auf körperliches Leiden zu verengen.
- source_word: ܚܝܠܬܐ
  choice: der Mächtige
  rationale: Der substantivierte Gottesbeiname wird entsprechend seiner Funktion würdevoll und verständlich wiedergegeben.
- source_word: ܡܠܟܘܬܐ
  choice: das Reich
  rationale: Das im syrischen Text ausdrücklich stehende Wort bezeichnet Herrschaft beziehungsweise Reich. „Das Reich“ wahrt den konkreten theologischen Gehalt besser als ein unbestimmtes „das, was“.
- source_word: ܕܩܝܡܐ
  choice: das … bereitsteht
  rationale: Das zugrunde liegende Verb hat den Sinn von stehen, bestehen oder bereitstehen. Im Zusammenhang mit dem für die Angeredeten Verwahrten ist „bereitsteht“ natürlich und semantisch zurückhaltend.
theological_decisions:
- issue: Gegenstand der endzeitlichen Gabe
  choice: „das Reich“ ausdrücklich nennen
  alternative: „das, was für euch bereitgehalten ist“
  rationale: Der syrische Wortlaut enthält ܡܠܟܘܬܐ („Reich/Herrschaft“). Die Übersetzung folgt daher der Primärquelle, ohne die Gabe zu verallgemeinern.
- issue: Deutung der vorausgehenden Erfahrung
  choice: „was ihr durchgemacht habt“
  alternative: „nach eurem Leiden“ oder wörtlich „nachdem ihr gesehen habt“
  rationale: Die gewählte Fassung lässt offen, ob vor allem Leiden oder das umfassendere Erleben der Ereignisse gemeint ist, und bewahrt so die Spannung des Wortlauts.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede im Plural. Die Satzführung bleibt klar und mündlich verständlich; Gottesbezeichnung und Reichsaussage werden ohne konfessionelle Zusätze wiedergegeben.
