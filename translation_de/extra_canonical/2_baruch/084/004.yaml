lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܡܘܬܗ
  choice: nach seinem Tod
  rationale: Gibt die zeitliche Wendung und das männliche Possessivpronomen knapp wieder, ohne den im Vers nur pronominal bezeichneten Bezug ausdrücklich festzulegen.
- source_word: ܡܢܟܘܢ
  choice: von euch
  rationale: Bewahrt die räumlich-separative Aussage des syrischen Ausdrucks.
- source_word: ܐܡܝܢ
  choice: vorausgesagt worden war
  rationale: Der beschädigt überlieferte Zusammenhang bezeichnet das zuvor angekündigte Geschehen; die passive Form wahrt, dass der Sprecher der Weissagung hier nicht genannt wird.
theological_decisions:
- issue: Bezug der Pronomen „seinem“ und „sie“
  choice: Die Pronomen bleiben unaufgelöst.
  alternative: „nach Josuas Tod“ beziehungsweise eine ausdrücklich benannte Größe einsetzen
  rationale: Der Vers formuliert pronominal; eine explizite Identifizierung würde die im unmittelbaren Wortlaut vorhandene Bezugsoffenheit stillschweigend beseitigen.
- issue: Verhältnis von Verwerfung und eintretendem Unheil
  choice: „deshalb traf euch“
  alternative: „deshalb bestrafte Gott euch“
  rationale: Der Text stellt einen Folge- beziehungsweise Begründungszusammenhang her, nennt Gott in diesem Satz aber nicht ausdrücklich als handelndes Subjekt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Satzstruktur und die pronominalen Bezüge des syrischen Textes bleiben erhalten; „traf euch“ klingt natürlich und vermeidet eine überdeutende theologische Ergänzung.
