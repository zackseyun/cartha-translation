- from: Doch nach seinem Tod habt ihr sie von euch geworfen; deshalb traf euch, was vorausgesagt worden war.
  to: Doch nach Josuas Tod habt ihr sie von euch geworfen; deshalb traf euch das Vorausgesagte.
  rationale: Die einzige notwendige Änderung ist die ausdrückliche Nennung Josuas entsprechend dem syrischen Text. Die Pronomen „sie“ und die passive Formulierung „das Vorausgesagte“ bleiben erhalten, weil der knappe Vers ihre näheren Bezüge beziehungsweise den Sprecher der Voraussage nicht selbst ausführt.
