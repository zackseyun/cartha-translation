review_pass:
  verdict: revise
  source_fidelity: Der syrische Text nennt ausdrücklich „den Tod Jeschuas/Josuas“ (ܡܘܬܗ ܕܝܫܘܥ), nicht lediglich „seinen Tod“. Die Auslassung des Namens bewahrt daher keine quellensprachliche Offenheit, sondern schafft eine solche erst. Die übrige knappe Aussage – Verwerfung von „sie“ und das Eintreten des Vorausgesagten als Folge – wird zutreffend wiedergegeben.
  naturalness: Die Formulierung ist flüssiges modernes Standarddeutsch. „Das Vorausgesagte“ ist etwas knapper und idiomatischer als die Umschreibung „was vorausgesagt worden war“, ohne den Sinn zu verändern.
  terminology: „Josua“ ist im deutschen biblischen Gebrauch die angemessene Wiedergabe von syrisch ܝܫܘܥ in diesem alttestamentlichen Bezug. „Jesus“ wäre hier wegen der deutschen Namenskonvention und des Kontextes irreführend. Die pronominale Referenz von „sie“ wird weiterhin nicht unnötig aufgelöst.
  issues:
  - severity: medium
    issue: Der ausdrücklich genannte Name Josua wurde durch ein unbestimmtes Possessivpronomen ersetzt.
    rationale: Die Quelle lautet „nach dem Tod Josuas“. Die im Entwurf behauptete pronominale Bezugsoffenheit besteht im syrischen Wortlaut an dieser Stelle nicht; die Benennung ist daher zur Quellentreue erforderlich.
  - severity: low
    issue: Die Begründung in den lexical/theological decisions beschreibt die Quelle an diesem Punkt unzutreffend als nur pronominal.
    rationale: Dies sollte mit der Korrektur zu „Josua“ entfallen; es handelt sich nicht um eine textlich strittige Identifikation.
  revised_text: Doch nach Josuas Tod habt ihr sie von euch geworfen; deshalb traf euch das Vorausgesagte.
