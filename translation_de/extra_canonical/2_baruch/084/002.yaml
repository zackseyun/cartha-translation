base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/084/002.yaml
  text: Remember how Moses once called heaven and earth as witnesses against you and said, “If you transgress the law, you will be scattered; but if you keep it, you will be kept.”
translation:
  language: de
  text: 'Erinnert euch daran, wie Mose einst Himmel und Erde als Zeugen gegen euch anrief und sagte: »Wenn ihr das Gesetz übertretet[a], werdet ihr zerstreut werden; wenn ihr es aber haltet, werdet ihr bewahrt werden.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »gegen das Gesetz verstoßt«.'
    reason: Kennzeichnet eine gleichwertige deutsche Wiedergabe des Gesetzesbruchs.
lexical_decisions:
- source_word: ܢܡܘܣܐ
  choice: das Gesetz
  rationale: Die übliche und sachlich passende Wiedergabe von ܢܡܘܣܐ im mosaischen Zusammenhang.
- source_word: ܬܬܒܪܘ
  choice: übertretet
  rationale: Gibt den Gedanken des Brechens beziehungsweise Verletzens des Gesetzes in natürlichem, würdigem Deutsch wieder, ohne die Aussage näher zu bestimmen.
theological_decisions:
- issue: Bedingungsgefüge von Übertretung und Bewahrung
  choice: Die beiden Folgen werden parallel als Zerstreuung und Bewahrung wiedergegeben.
  alternative: Die zweite Aussage ausdrücklich als göttlichen Schutz deuten.
  rationale: Die passive Form lässt den Handelnden unausgesprochen; diese Offenheit wird beibehalten.
translation_notes:
  register: Modernes, allgemein verständliches Standarddeutsch mit würdigem biblischem Ton. Die forensische Wendung »als Zeugen gegen euch anrief« bewahrt das Bild des Zeugenaufrufs; die Passivformen lassen den Handelnden wie in der Vorlage unausgesprochen.
