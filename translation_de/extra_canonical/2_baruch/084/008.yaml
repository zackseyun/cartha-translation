  text: Remember the law and Zion, and the holy land, and your brothers, and the covenant of your fathers; and do not forget the festivals and the sabbaths.
translation:
  language: de
  text: Denkt an das Gesetz und an Zion, an das heilige Land und an eure Brüder, an den Bund eurer Väter; und vergesst die Feste und die Sabbate nicht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܡܘܣܐ
  choice: das Gesetz
  rationale: Das syrische Lehnwort bezeichnet hier das göttliche Gesetz; der bestimmte Singular entspricht dem jüdischen Bezug auf die Tora.
- source_word: ܥܕ̈ܬܐ
  choice: die Feste
  rationale: Im vorliegenden Aufzählungszusammenhang ist die Wiedergabe als festgesetzte religiöse Festzeiten sachgerecht und idiomatisch.
- source_word: ܐܒܗ̈ܐ
  choice: Väter
  rationale: Die traditionelle biblische Bezeichnung bewahrt den Bezug auf die Vorfahren Israels.
theological_decisions:
- issue: Bezug des Gesetzes
  choice: „das Gesetz“
  alternative: „die Tora“
  rationale: „Das Gesetz“ ist im Deutschen allgemein verständlich und bewahrt den breiteren Wortlaut, ohne die sachliche Beziehung zur Tora zu leugnen.
- issue: Bund und Vorfahren
  choice: „der Bund eurer Väter“
  alternative: „der Bund mit euren Vätern“
  rationale: Die Genitivform lässt die im Ausdruck mögliche Beziehung offen und folgt der traditionellen semitischen Wendung, ohne sie näher auszudeuten.
