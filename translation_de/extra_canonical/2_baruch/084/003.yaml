lexical_decisions:
- source_word: ܐܡ̇ܪ ܗܘܐ
  choice: sagte … immer wieder
  rationale: Die syrische Verlaufsform bezeichnet hier eine wiederholte beziehungsweise fortdauernde Rede in der Vergangenheit.
- source_word: ܫ̈ܒ̣ܛܝܟܘܢ
  choice: eure zwölf Stämme / als zwölf Stämme
  rationale: Im unmittelbaren Zusammenhang ist von den Stämmen Israels die Rede; die Zahl zwölf ist in der überlieferten Satzgestalt beziehungsweise ihrer kontrollierten Rekonstruktion ausdrücklich vorausgesetzt.
- source_word: ܒܡܕܒܪܐ
  choice: in der Wüste
  rationale: Direkte und im biblischen Kontext natürliche Wiedergabe.
theological_decisions:
- issue: Identität des nicht ausdrücklich wiederholten Subjekts
  choice: „er“
  alternative: „Jeremia“ oder „Mose“ ausdrücklich nennen
  rationale: Die Versabgrenzung setzt ein anaphorisches Subjekt voraus. Die knappe Pronomenform bewahrt den Zusammenhang und vermeidet, eine aufgrund des beschädigten beziehungsweise überlappenden Seitenkontexts unsichere Identifizierung in den Haupttext einzutragen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung der Rede wird idiomatisch mit „immer wieder“ ausgedrückt; die ungewöhnliche, aber sachlich wichtige Verbindung von Gemeinsamkeit und zwölf Stämmen bleibt erhalten.
