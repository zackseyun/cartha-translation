base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/015/001.yaml
  text: 'And the Lord answered and said to me:

    “You are right to be astonished at man’s passing, but your judgment about the evils that befall sinners is not right.


    And as for what you said about the righteous who are taken away and the wicked who prosper,

    and as for what you said—that man does not know your judgment—

    because of this, listen now and I will speak to you; pay attention and I will make my words heard.


    Indeed, man would not have understood my judgment if he had not received the Law and if I had not instructed him in understanding.

    But now, because he has transgressed while understanding, he will surely be punished because of that understanding.

    And as for the righteous, concerning whom you said that the world came on their account: what is coming is likewise on their account.

    For to them this world is a struggle and a labor with much trouble, but what is to come is a crown with great glory.”'
translation:
  language: de
  text: 'Und der Herr antwortete und sagte zu mir:


    „Du wunderst dich zu Recht darüber, dass der Mensch dahingeht; doch dein Urteil über die Übel, die Sünder treffen, ist nicht richtig.


    Und was du über die Gerechten gesagt hast, die hinweggenommen werden, während es den Frevlern gut geht,


    und was du darüber gesagt hast, dass der Mensch mein Urteil nicht kennt –


    darum höre nun, und ich will zu dir sprechen; gib acht, und ich will dich meine Worte hören lassen.


    Denn der Mensch hätte mein Urteil nicht verstanden, wenn er das Gesetz nicht empfangen hätte und ich ihn nicht zur Einsicht geführt hätte.


    Nun aber hat er trotz seiner Einsicht das Gesetz übertreten; deshalb wird er gerade wegen dieser Einsicht gewiss bestraft werden.


    Und was die Gerechten betrifft, von denen du gesagt hast, ihretwegen sei die Welt entstanden: Auch das Kommende ist ihretwegen da.


    Denn für sie bedeutet diese Welt Kampf und Mühe unter vielen Bedrängnissen; das Kommende aber ist eine Krone von großer Herrlichkeit.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܡܗܬ
  choice: sich wundern
  rationale: Gibt die bestürzte Verwunderung über das Dahingehen des Menschen in natürlichem, würdevollem Deutsch wieder, ohne sie auf bloße Neugier zu verengen.
- source_word: ܢܡܘܣܐ
  choice: das Gesetz
  rationale: Bewahrt den bestimmten, offenbar auf das geoffenbarte Gesetz bezogenen Sinn; „Tora“ wäre interpretierend enger und im gegebenen Zusammenhang weniger unmittelbar verständlich.
- source_word: ܡܕܥܐ / ܚܟܡܬܐ
  choice: Einsicht / verstehen
  rationale: Der Zusammenhang verknüpft vermittelte Erkenntnis mit sittlicher Verantwortlichkeit. Die variierte deutsche Wiedergabe erhält sowohl den Erkenntnisvorgang als auch die daraus folgende Einsicht.
- source_word: ܟܐܢܘܬܐ
  choice: die Gerechten
  rationale: Im wiederhergestellten Zusammenhang ist die personale Bezeichnung gemeint; sie passt zum Kontrast mit den Frevlern und zur künftigen Rechtfertigung.
theological_decisions:
- issue: Warum größere Erkenntnis das Gericht verschärft
  choice: Wer das Gesetz kennt und mit Einsicht übertritt, trägt aufgrund dieser Einsicht größere Verantwortung.
  alternative: Erkenntnis macht die Sünde lediglich sichtbar, ohne die Verantwortlichkeit zu erhöhen.
  rationale: Die Argumentation verbindet die Übertretung trotz vorhandener Einsicht ausdrücklich mit der daraus folgenden Bestrafung.
- issue: Das Verhältnis der Gerechten zur gegenwärtigen und kommenden Welt
  choice: Die gegenwärtige Welt bringt den Gerechten Kampf und Mühe; das Kommende bringt ihnen Herrlichkeit als Krone.
  alternative: Die Aussage bezieht sich ausschließlich auf das gegenwärtige Leben.
  rationale: Der Text stellt gegenwärtige Bedrängnis und kommende Herrlichkeit ausdrücklich einander gegenüber, ohne eines von beiden abzuschwächen.
- issue: Bedeutung von „ihretwegen“
  choice: 'Die Aussage bleibt in beiden Sätzen kausal und parallel: Die Welt entstand ihretwegen, und auch das Kommende ist ihretwegen da.'
  alternative: Das Kommende gehört ihnen lediglich, ohne dass sie als dessen Anlass oder Zweck bezeichnet werden.
  rationale: Die Formulierung bewahrt die auffällige Parallelität und theologische Spannung des überlieferten Gedankens, statt sie erklärend abzuschwächen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzähl- und Offenbarungsstil. Die wiederholten Formeln „Und was du … gesagt hast“ und der Gegensatz zwischen „dieser Welt“ und „dem Kommenden“ wurden bewusst erhalten. „Frevler“ vermeidet die missverständliche Aussage, die Bösen seien moralisch gut, während „es ihnen gut geht“ ihr Wohlergehen bezeichnet.
