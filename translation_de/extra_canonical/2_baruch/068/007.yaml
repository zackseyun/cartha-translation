translation:
  language: de
  text: Doch nach diesen Dingen werden viele Völker fallen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ
  choice: nach diesen Ereignissen
  rationale: Die Wendung bedeutet wörtlich „nach diesen Dingen“; „nach diesen Ereignissen“ ist im Deutschen natürlicher und wahrt den zeitlichen Bezug.
- source_word: many nations
  choice: viele Völker
  rationale: Die im geprüften englischen Konsultationstext bezeugte Aussage wird idiomatisch und ohne zusätzliche Deutung wiedergegeben; „Völker“ ist im apokalyptischen Zusammenhang passender als „Nationen“.
- source_word: will fall
  choice: werden fallen
  rationale: Die schlichte Zukunftsaussage und die bewusst offene Bedeutung von „fallen“ bleiben erhalten; eine Präzisierung als Niederlage oder Untergang wäre interpretierend.
theological_decisions:
- issue: Bedeutung des Fallens der Völker
  choice: fallen
  alternative: untergehen / besiegt werden
  rationale: Der Text lässt Art und Ausmaß des Fallens offen. Die Übersetzung bewahrt diese eschatologische Mehrdeutigkeit.
translation_notes:
  register: Knappes, würdiges modernes Standarddeutsch. Der bereitgestellte syrische Seitenausschnitt ist ein vorläufig zugeordnetes Kapitelkorpus und lässt die vollständige Verszeile nicht sicher isolieren; daher wurde die erkennbare zeitliche Wendung mit dem auditierten englischen Konsultationstext abgeglichen.
