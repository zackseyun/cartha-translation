  text: And at that time, after a short interval, Zion will be rebuilt, its offerings restored, and the priests will return to their ministry.
translation:
  language: de
  text: Und zu jener Zeit[a], nach einer kurzen Frist, wird Zion wieder aufgebaut werden; seine Opfergaben werden wieder dargebracht, und die Priester werden zu ihrem Dienst zurückkehren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und dann“.'
    reason: Die Wendung kann im Zusammenhang auch als schlichte zeitliche Abfolge wiedergegeben werden.
lexical_decisions:
- source_word: ܒܗܘ ܙܒܢܐ (rekonstruierte Wendung gemäß der geprüften Konsultationsschicht)
  choice: zu jener Zeit
  rationale: Gibt die zeitliche Präposition mit Demonstrativ genauer wieder als das bloß fortschreitende „dann“.
- source_word: ܩܘܪ̈ܒܢܐ / entsprechende Opferterminologie
  choice: Opfergaben
  rationale: Bezeichnet die kultischen Darbringungen, ohne sie unnötig auf eine bestimmte Opferart einzuengen.
- source_word: ܬܫܡܫܬܐ / entsprechende Dienstterminologie
  choice: Dienst
  rationale: Passt zum priesterlichen Kultdienst und bleibt zugleich nah am allgemeinen Bedeutungsumfang des Ausdrucks.
theological_decisions:
- issue: Art der Wiederherstellung der Opfergaben
  choice: „werden wieder dargebracht“
  alternative: „werden wiederhergestellt“ / „werden wieder eingesetzt“
  rationale: Im Deutschen werden Opfergaben nicht idiomatisch „wiederhergestellt“. Die gewählte Formulierung beschreibt die Wiederaufnahme der Darbringung, ohne eine weitergehende kulttheologische Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die drei Zukunftsaussagen bleiben parallel; das Semikolon gliedert Wiederaufbau, erneuerte Opferpraxis und Rückkehr der Priester übersichtlich. Da der bereitgestellte syrische Kapitelblock nur tentativ dem Einzelvers zugeordnet und offenbar unvollständig ist, wurde die geprüfte englische Konsultationsschicht vorsichtig herangezogen.
