  yaml_path: translation/extra_canonical/2_baruch/068/002.yaml
  text: After these things a time will come when your people will fall into such distress that they will all be in danger of perishing together.
translation:
  language: de
  text: Danach wird eine Zeit kommen, in der dein Volk in solche Bedrängnis gerät, dass alle gemeinsam Gefahr laufen, umzukommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܒܬܪ ܗܠܝܢ
  choice: Danach
  rationale: 'Gibt die zeitliche Abfolge knapp und natürlich wieder: „nach diesen Dingen“.'
- source_word: ܐܬܪ / ܥܕܢܐ (im überlieferten Abschnitt unsicher abgegrenzt)
  choice: eine Zeit wird kommen
  rationale: Folgt dem durch die Versüberlieferung gestützten Zukunftssinn, ohne die zeitliche Bestimmung näher festzulegen.
- source_word: ܒܝܫܘ / Bedrängniskontext
  choice: in solche Bedrängnis gerät
  rationale: „Bedrängnis“ bewahrt den starken Not- und Gefährdungssinn und klingt im modernen Deutschen würdig und verständlich.
- source_word: ܐܒܕܢ
  choice: umzukommen
  rationale: Bezeichnet drohenden Untergang, ohne ausdrücklich festzulegen, ob Tod oder umfassenderes Verderben gemeint ist.
theological_decisions:
- issue: Ausmaß der Gefahr für das Volk
  choice: dass sie alle zusammen Gefahr laufen umzukommen
  alternative: sodass das ganze Volk beinahe zugrunde geht
  rationale: Die gewählte Fassung bewahrt sowohl die Gesamtheit der Betroffenen als auch den Charakter einer drohenden Gefahr, ohne den Untergang als bereits sicher darzustellen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Wechsel vom kollektiven Singular „dein Volk“ zum pluralischen Pronomen „sie“ ist im Deutschen natürlich und hebt zugleich die Gesamtheit seiner Angehörigen hervor. Wegen der unsicheren Versabgrenzung im bereitgestellten syrischen Seitenkorpus wurde die kontrollierte Versüberlieferung als Orientierung herangezogen.
