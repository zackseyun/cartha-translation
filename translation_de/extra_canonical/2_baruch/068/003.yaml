  text: Nevertheless, they will be saved, and their enemies will fall before them.
translation:
  language: de
  text: Dennoch werden sie gerettet werden, und ihre Feinde werden vor ihnen fallen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܬܦܪܩܘܢ
  choice: werden gerettet werden
  rationale: Bewahrt die passive Zukunftsaussage und lässt offen, ob umfassende Rettung oder konkrete Befreiung gemeint ist.
- source_word: ܢܦܠܘܢ
  choice: werden fallen
  rationale: Gibt das Bild des Fallens direkt wieder, ohne es ausdrücklich als Tod oder militärische Vernichtung auszulegen.
- source_word: ܩܕܡܝܗܘܢ
  choice: vor ihnen
  rationale: 'Bewahrt die räumliche und idiomatische Bedeutung: Die Feinde fallen in ihrer Gegenwart beziehungsweise unterliegen ihnen.'
theological_decisions:
- issue: Reichweite der Rettung
  choice: „gerettet werden“ ohne nähere Bestimmung
  alternative: „befreit werden“ oder „dem Tod entkommen“
  rationale: Der knappe Vers bestimmt Art und Reichweite der Rettung nicht; die Übersetzung soll diese Offenheit nicht dogmatisch verengen.
translation_notes:
  register: Knappe, würdige Standardsprache. „Dennoch“ stellt den Gegensatz zum vorausgehenden Zusammenhang heraus; „vor ihnen fallen“ erhält das konkrete Bild des Ausgangstextes.
