translation:
  language: de
  text: Auch die Völker werden kommen, um sie zu ehren, doch nicht in demselben Maß wie früher.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܡ̈ܡܐ / entsprechende Bezeichnung für die Völker
  choice: die Völker
  rationale: Gibt die kollektive Bezeichnung für die nichtisraelitischen Nationen in natürlichem, bibelsprachlich angemessenem Deutsch wieder.
- source_word: ܐܝܩܪܐ / entsprechende Ehrungsformulierung
  choice: um sie zu ehren
  rationale: Bewahrt den Gedanken, dass die Völker der zuvor genannten Stadt beziehungsweise ihrer Herrlichkeit Ehre erweisen.
- source_word: vergleichende Einschränkung
  choice: nicht in demselben Maß wie früher
  rationale: Drückt die Abstufung idiomatisch aus, ohne aus dem Vergleich eine völlige Verweigerung der Ehre zu machen.
theological_decisions:
- issue: Bezug des weiblichen Pronomens
  choice: „sie“ als Rückverweis auf die zuvor genannte Stadt
  alternative: Das Bezugswort ausdrücklich als „die Stadt“ oder „Jerusalem“ wiederholen
  rationale: Das Pronomen bewahrt die textliche Verknüpfung und vermeidet eine nicht ausdrücklich im Vers stehende Präzisierung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; knapp und gut verständlich. Die graduelle Einschränkung des früheren Ehrenmaßes bleibt erhalten.
