  text: '1 Und die zwölften leuchtenden Wasser, die du gesehen hast – das ist das Wort:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܢܗܝܪ̈ܐ
  choice: leuchtende Wasser
  rationale: Bewahrt das wiederkehrende symbolische Bild und den Gegensatz zu den schwarzen Wassern; „leuchtend“ gibt die Lichtwirkung natürlicher wieder als „hell“.
- source_word: ܗܕܐ ܗܝ ܡܠܬܐ
  choice: das ist ihre Bedeutung
  rationale: Gibt die syrische Einleitungsformel im Deutschen verständlich als Ankündigung der folgenden Deutung wieder, während die wörtliche Form in der Fußnote erhalten bleibt.
theological_decisions:
- issue: Funktion der abschließenden Einleitungsformel
  choice: Sie kündigt die Deutung der zwölften leuchtenden Wasser an.
  alternative: „Dies ist das Wort“ als rein wörtliche Wiedergabe.
  rationale: Im Zusammenhang der Vision leitet die Formel eine Auslegung ein. Die Übersetzung macht diese Funktion deutlich, ohne der anschließenden Deutung inhaltlich vorzugreifen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Bildbegriff „Wasser“ bleibt unverändert; der Gedankenstrich markiert die feierliche Deutungsformel.
