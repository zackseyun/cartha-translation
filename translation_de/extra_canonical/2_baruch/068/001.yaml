- from: 1 Und die zwölften leuchtenden Wasser, die du gesehen hast – das ist ihre Bedeutung:[a]
  to: '1 Und die zwölften leuchtenden Wasser, die du gesehen hast – das ist das Wort:'
  rationale: Die Einleitungsformel wurde direkt als „das ist das Wort“ übersetzt. Damit bleiben die lexikalische Form, der formelhafte Registerton und die mögliche semantische Offenheit des Syrischen erhalten; eine Fußnote zur nachträglichen Absicherung einer interpretierenden Haupttextfassung ist nicht mehr nötig.
  reviewer_model: gpt-5.6-terra
