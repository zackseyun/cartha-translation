translation:
  language: de
  text: Und die Zeit der Gefangenschaft[a], die über die neuneinhalb Stämme kam, wegen ihrer vielen Sünden.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ihrer Gefangenschaft, die über die neuneinhalb Stämme kam“.'
    reason: Der syrische Ausdruck kann enger possessiv auf die betroffenen Stämme bezogen werden.
  - marker: b
    text: 'Oder enger am syrischen Ausdruck: „weil sie in vielen Sünden waren“.'
    reason: Die syrische Wendung kann den Zustand des Verharrens in zahlreichen Sünden ausdrücken; die Hauptfassung gibt den Zusammenhang in natürlichem Deutsch kausal wieder.
lexical_decisions:
- source_word: ܙܒܢܐ
  choice: die Zeit
  rationale: Das syrische Substantiv bezeichnet hier die Zeit beziehungsweise Epoche und setzt die aufzählende Satzstruktur des Zusammenhangs fort.
- source_word: ܫܒܝܬܐ
  choice: die Gefangenschaft
  rationale: Die Wiedergabe bezeichnet die kollektive Verschleppung der Stämme; „Gefangenschaft“ ist im Deutschen verständlich und wahrt den historischen Sinn.
- source_word: ܬܫܥ ... ܘܦܠܓܐ
  choice: neuneinhalb
  rationale: Die Zahlbezeichnung wird im Deutschen idiomatisch als zusammengesetztes Zahlwort wiedergegeben.
- source_word: ܫܒ̈ܛܐ
  choice: Stämme
  rationale: Im israelitischen Zusammenhang ist „Stämme“ die geläufige und sachlich genaue Entsprechung.
- source_word: ܚܛܗ̈ܐ ܣܓܝ̈ܐܐ
  choice: viele Sünden
  rationale: Die direkte Wiedergabe bewahrt sowohl den religiös-moralischen Begriff als auch die Mehrzahl.
theological_decisions:
- issue: Verhältnis zwischen Sünde und Gefangenschaft
  choice: wegen ihrer vielen Sünden
  alternative: weil sie mit vielen Sünden belastet waren
  rationale: Die kausale Verknüpfung bleibt ausdrücklich erhalten, ohne Art oder Bewertung der einzelnen Sünden näher zu bestimmen.
- issue: Bezug des Besitzanzeigers bei der Gefangenschaft
  choice: die Gefangenschaft, die über die neuneinhalb Stämme kam
  alternative: ihre Gefangenschaft, die über die neuneinhalb Stämme kam
  rationale: Die Hauptfassung vermeidet einen vorgezogenen, zunächst mehrdeutigen Besitzanzeiger; die mögliche stärker possessive Lesart wird in der Fußnote bewahrt.
translation_notes:
  register: Moderne, würdige Standardsprache. Die nominale, mit „Und“ einsetzende Form bleibt erhalten, weil der Vers Teil einer fortlaufenden Aufzählung ist.
