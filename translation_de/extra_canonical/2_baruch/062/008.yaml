lexical_decisions:
- source_word: ܡ̈ܝܐ
  choice: Wasser
  rationale: Die syrische Pluralform bezeichnet hier die in der Vision unterschiedenen Wassermassen; im Deutschen ist „Wasser“ in dieser Verwendung idiomatisch.
- source_word: ܐܘܟ̈ܡܐ
  choice: schwarzen
  rationale: Die Farbbezeichnung wird direkt wiedergegeben und als symbolisch offene Bildsprache bewahrt.
- source_word: ܕܫܒܥ
  choice: siebten
  rationale: Die Ordnungszahl kennzeichnet diese Wasser als siebte Folge innerhalb der Vision.
- source_word: ܕܚܙܝܬ
  choice: die du gesehen hast
  rationale: Die direkte Anrede und der vollendete Sehvorgang werden natürlich und quellentreu wiedergegeben.
theological_decisions:
- issue: Symbolische Bedeutung der schwarzen Wasser
  choice: Das Bild bleibt ohne erklärenden Zusatz stehen.
  alternative: Die Wasser ausdrücklich als eine böse geschichtliche Epoche deuten.
  rationale: Der Vers identifiziert lediglich den siebten Abschnitt der Vision; seine Deutung soll nicht vorweggenommen oder konfessionell festgelegt werden.
translation_notes:
  register: Knappe, würdige Standardsprache; die wiederkehrende Bildsprache der Vision bleibt formal erkennbar und zugleich gut verständlich.
