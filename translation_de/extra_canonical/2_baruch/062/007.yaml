  text: But concerning the nations, it would be too much to tell how they continually acted in impiety and wickedness and never showed themselves righteous.
translation:
  language: de
  text: Was aber die Völker betrifft, so würde es zu weit führen, davon zu erzählen, wie sie unablässig gottlos und böse handelten und sich niemals als gerecht erwiesen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܡܡ̈ܐ (sinngemäß im Verskontext)
  choice: die Völker
  rationale: Gibt die kollektive Bezeichnung für die nichtisraelitischen Völker natürlich und ohne zusätzliche konfessionelle Wertung wieder.
- source_word: Gottlosigkeit/Impietät (sinngemäß im Verskontext)
  choice: gottlos
  rationale: Bewahrt den religiös-ethischen Gehalt und ist im modernen Deutschen verständlicher als das altertümliche „frevelhaft“.
- source_word: Bosheit/Schlechtigkeit (sinngemäß im Verskontext)
  choice: böse
  rationale: Hält die zweite moralische Qualifikation neben „gottlos“ knapp und klar fest.
- source_word: fortwährend (sinngemäß im Verskontext)
  choice: unablässig
  rationale: Drückt die im Ausgangstext bezeichnete anhaltende Handlungsweise idiomatisch aus.
- source_word: gerecht erscheinen/erfunden werden (sinngemäß im Verskontext)
  choice: sich als gerecht erwiesen
  rationale: Bewahrt den Befundcharakter der Aussage, ohne sie zu einer Behauptung bloßen äußeren Anscheins abzuschwächen.
theological_decisions:
- issue: Umfang des Urteils über die Völker
  choice: Die uneingeschränkte Aussage „niemals als gerecht“ bleibt stehen.
  alternative: Eine Abschwächung wie „nur selten gerecht“ oder eine Beschränkung auf einzelne Völker.
  rationale: Der Vers formuliert ein umfassendes negatives Urteil; eine Einschränkung wäre eine nicht vom Text gedeckte theologische Harmonisierung.
- issue: Verhältnis von Gottlosigkeit und Bosheit
  choice: Beide Begriffe werden getrennt wiedergegeben.
  alternative: Zusammenfassung als „verwerflich“ oder „sündig“.
  rationale: Die doppelte Charakterisierung trägt sowohl eine religiöse als auch eine allgemein moralische Dimension und soll nicht eingeebnet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wendung „so würde es zu weit führen“ gibt die rhetorische Aussage wieder, dass eine ausführliche Darstellung übermäßig umfangreich wäre; der Satz bleibt bewusst pauschal und spannungsvoll, wie es der Ausgangstext verlangt.
