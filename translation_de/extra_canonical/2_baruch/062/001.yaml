  yaml_path: translation/extra_canonical/2_baruch/062/001.yaml
  text: And the seventh black waters that you saw—this is the perversion brought about by the counsel of Jeroboam, who took counsel to make two calves of gold.
translation:
  language: de
  text: 'Und die siebten schwarzen Wasser, die du gesehen hast: Das ist die Verderbnis, die durch den Rat Jerobeams herbeigeführt wurde, der den Plan fasste, zwei goldene Kälber anzufertigen.[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Vgl. 1. Könige 12,28.
    reason: Die knappe Stellenangabe macht den erzählerischen Bezug auf Jerobeams zwei goldene Kälber auffindbar, ohne den Vers auszulegen.
lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܘܟܡ̈ܐ / ܚܫ̈ܟܐ
  choice: schwarzen Wasser
  rationale: Die konkrete Farbbezeichnung bewahrt den festen apokalyptischen Gegensatz zwischen den schwarzen und den hellen Wassern der Vision.
- source_word: ܚܒܠܬܐ
  choice: Verkehrung
  rationale: Das Wort bezeichnet hier die durch Jerobeams Vorgehen verursachte religiöse und politische Verderbnis beziehungsweise Entstellung. „Verkehrung“ bewahrt diesen moralisch-kultischen Sinn, ohne ihn auf bloße Zerstörung zu verengen.
- source_word: ܡܠܟܐ / ܢܣܒ ܡܠܟܐ (sinngemäß im kontrollierten Textbestand)
  choice: Beschluss / beschloss
  rationale: Die Wiederholung bildet die zugrunde liegende Wortverwandtschaft des Beratens und Beschließens ab, bleibt im Deutschen jedoch natürlich verständlich.
- source_word: ܬܪܝܢ ܥܓ̈ܠܐ ܕܕܗܒܐ
  choice: zwei goldene Kälber
  rationale: Die geläufige und sachlich genaue biblische Bezeichnung identifiziert Jerobeams Kultbilder ohne erklärenden Zusatz.
theological_decisions:
- issue: Bezug des singularischen Demonstrativums
  choice: „Das ist die Verkehrung“
  alternative: „Diese sind die Verkehrung“
  rationale: Das syrische feminine Singularpronomen richtet sich nach dem singularischen Prädikatsnomen „Verkehrung“, nicht nach dem pluralischen „Wasser“. Die gewählte Fassung wahrt diese Grammatik und ist idiomatisches Deutsch.
- issue: Bewertung von Jerobeams Kultmaßnahme
  choice: „Verkehrung“
  alternative: „Verderben“ oder „Verderbnis“
  rationale: Die Formulierung lässt sowohl moralische als auch kultische Entstellung anklingen, ohne eine weitergehende konfessionelle Deutung einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Doppelpunkt bildet die Deutung der visionären Wasser ab; das Semikolon verbindet Jerobeams Beschluss mit seiner konkreten Ausführung. „Anzufertigen“ klingt natürlicher als „zu machen“, ohne den Inhalt zu erweitern.
