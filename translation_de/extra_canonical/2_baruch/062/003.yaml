translation:
  language: de
  text: Und die Taten Isebels und der Götzendienst, den Israel zu jener Zeit betrieb.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܒܕܝܗ̇
  choice: die Taten Isebels
  rationale: Das syrische Substantiv bezeichnet ihre Taten bzw. Handlungen; „Fluch“ ist hier lexikalisch nicht begründet.
- source_word: ܦܘܠܚܢܐ ܕܦܬܟܪ̈ܐ
  choice: Götzendienst
  rationale: Die kompakte deutsche Wiedergabe bezeichnet die kultische Verehrung von Götzen und entspricht dem natürlichen biblischen Sprachgebrauch.
theological_decisions:
- issue: Charakterisierung von Israels Verhalten
  choice: den Israel zu jener Zeit betrieb
  alternative: den Israel zu jener Zeit ausübte
  rationale: „betrieb“ gibt die fortgesetzte kultische Praxis natürlich wieder, ohne über den Ausgangstext hinaus eine besondere theologische Deutung einzuführen.
translation_notes:
  register: Moderner, würdiger Erzählstil; der Name wird in der im Deutschen gebräuchlichen biblischen Form „Isebel“ wiedergegeben. Die ältere Fußnotenalternative „Fluch“ wurde nicht übernommen, da sie auf einer nicht tragfähigen Lesung beruht.
