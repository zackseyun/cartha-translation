- issue: Verhältnis von Bosheit und Ungerechtigkeit
  choice: „Bosheit … in Ungerechtigkeit verübten“
  alternative: „Unrecht, das … begingen“
  rationale: Die gewählte Fassung bewahrt die Unterscheidung zwischen der Bosheit selbst und der ungerechten Weise beziehungsweise Sphäre ihres Handelns, ohne beides zusammenzuziehen.
