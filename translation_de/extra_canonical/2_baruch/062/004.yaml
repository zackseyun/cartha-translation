  text: And the withholding of rain, and the famines that came to pass until women ate the fruit of their womb.
translation:
  language: de
  text: Und das Ausbleiben des Regens und die Hungersnöte, die eintraten, bis Frauen die Frucht ihres Leibes aßen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܛܪܐ
  choice: Regen
  rationale: Die reguläre Bedeutung des syrischen Wortes ist „Regen“.
- source_word: withholding (durch die englische Prüfschicht bezeugt)
  choice: Ausbleiben
  rationale: „Ausbleiben des Regens“ ist im modernen Deutschen natürlich und gibt die Wirkung des Zurückhaltens wieder, ohne ausdrücklich einen Handelnden zu ergänzen.
- source_word: fruit of their womb (durch die englische Prüfschicht bezeugt)
  choice: Frucht ihres Leibes
  rationale: Die würdige, verständliche Wendung bewahrt das drastische Bild und vermeidet eine abschwächende Umschreibung.
theological_decisions:
- issue: Handelnder beim Zurückhalten des Regens
  choice: Kein Handelnder wird ergänzt.
  alternative: „Gott hielt den Regen zurück“
  rationale: Der Vers benennt in der vorliegenden Bezeugung keinen Handelnden; die Übersetzung soll diese Offenheit nicht theologisch auflösen.
- issue: Darstellung des Kannibalismus in der Hungersnot
  choice: Das Bild wird wörtlich und ungemildert wiedergegeben.
  alternative: „bis Frauen ihre eigenen Kinder aßen“
  rationale: „Frucht ihres Leibes“ bewahrt die Bildsprache des Ausgangstextes, während die Alternative sie deutend expliziert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Reihung mit „Und“ bleibt als Anschluss an den vorangehenden Kontext erhalten. Wegen des nur kapitelweise und offenbar überlappend überlieferten syrischen Quellenausschnitts stützt sich die Abgrenzung dieses Einzelverses zusätzlich auf die auditierte englische Konsultationsschicht.
