  yaml_path: translation/extra_canonical/2_baruch/043/001.yaml
  text: 'But you, Baruch, fix your heart on what has been said to you, and understand the things shown to you, for much eternal consolation is yours.

    For from now on you will not again see the evil things that are now happening.

    Therefore go and command my people, and do not stir them up, because after these things, in the times to come, many days of affection will come. And I will make known to you and speak in your understanding.'
translation:
  language: de
  text: Doch du, Baruch, richte dein Herz auf das, was dir gesagt worden ist, und begreife, was dir gezeigt worden ist; denn für dich gibt es reichen Trost auf ewig.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܩܢ ܠܒܟ
  choice: richte dein Herz auf
  rationale: Die konkrete syrische Herz-Metapher und der auffordernde Sinn bleiben erhalten; im heutigen Deutschen klingt die Wendung zugleich natürlich und würdig.
- source_word: ܐܣܬܟܠ
  choice: begreife
  rationale: Das Verb fordert nicht nur zum Wahrnehmen, sondern zum verständigen Erfassen des Gezeigten auf.
- source_word: ܒܘܝܐܐ ܣܓܝܐܐ
  choice: reichen Trost
  rationale: Das syrische Substantiv bezeichnet Trost beziehungsweise Ermutigung; das Singulargefüge mit dem verstärkenden Adjektiv wird als „reicher Trost“ wiedergegeben.
- source_word: ܕܒܠܥܕܡ
  choice: auf ewig
  rationale: Die Wendung bezeichnet unbegrenzte Dauer. „Auf ewig“ bewahrt den apokalyptischen Ton, ohne die Art dieses Trostes näher festzulegen.
theological_decisions:
- issue: Zeitlicher und eschatologischer Charakter des Baruch zugesagten Trostes
  choice: „reicher Trost auf ewig“
  alternative: „viel ewiger Trost“ oder lediglich gegenwärtige seelische Ermutigung
  rationale: Der Wortlaut verbindet Trost mit unbegrenzter Dauer, erklärt aber weder dessen genaue Gestalt noch den Zeitpunkt seiner vollen Verwirklichung. Die Übersetzung lässt diese Offenheit bestehen.
