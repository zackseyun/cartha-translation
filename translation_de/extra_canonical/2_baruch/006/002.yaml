  yaml_path: translation/extra_canonical/2_baruch/006/002.yaml
  text: And behold, suddenly a spirit of strength lifted me up and carried me above the wall of Jerusalem; and I saw four angels standing at the four corners of the city, each one holding a flaming torch in his hands.
translation:
  language: de
  text: Und sieh, plötzlich hob mich ein Geist der Kraft empor und trug mich über die Mauer Jerusalems. Da sah ich vier Engel an den vier Ecken der Stadt stehen; jeder von ihnen hielt eine brennende Fackel[a] in den Händen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „eine Feuerlampe“; auch: „eine Fackel“.'
    reason: Die zugrunde liegende Bezeichnung kann als Lampe beziehungsweise Fackel verstanden werden; die Feuerbestimmung soll sichtbar bleiben.
lexical_decisions:
- source_word: ܪܘܚܐ ܕܚܝ̈ܠܐ
  choice: ein Geist der Kraft
  rationale: Bewahrt die semitische Genitivverbindung und ihre mögliche Bedeutung als kraftvoller bzw. Kraft verleihender Geist, ohne sie weiter auszudeuten.
- source_word: ܐܪܒܥܐ ܡܠܐܟ̈ܝܢ
  choice: vier Engel
  rationale: Direkte und im Deutschen geläufige Wiedergabe.
- source_word: ܐܪܒܥܬܝܗܝܢ ܙܘܝ̈ܬܗ̇ ܕܡܕܝ̣ܢܬܐ
  choice: an den vier Ecken der Stadt
  rationale: Formnahe und natürliche Wiedergabe der räumlichen Angabe.
- source_word: ܠܡܦܝܕܐ
  choice: eine brennende Fackel
  rationale: „Fackel“ gibt das tragbare Licht natürlich wieder; „brennend“ berücksichtigt die in der überlieferten Lesart bezeugte Feuerbestimmung.
- source_word: ܒܐܝܕܘ̈ܗܝ
  choice: in den Händen
  rationale: Der Plural der Körperteilangabe wird ausdrücklich erhalten.
theological_decisions:
- issue: Identität und Wirken des Geistes
  choice: Geist der Kraft
  alternative: mächtiger Geist
  rationale: Die substantivische Formulierung lässt offen, ob die Kraft den Geist kennzeichnet, von ihm ausgeht oder ihm zugeordnet ist; eine dogmatische Identifizierung wird vermieden.
translation_notes:
