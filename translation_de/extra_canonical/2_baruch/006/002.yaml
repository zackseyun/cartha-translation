review_pass:
  verdict: revise
  source_fidelity: 'Die zentrale Vision wird treffend wiedergegeben: ein Geist der Kraft hebt den Seher empor; vier Engel stehen an den vier Ecken der Stadt, und jeder hält eine Lichtquelle. Die englische POB-Prüfspur belegt ausdrücklich die Zusätze „flaming“ und „in his hands“, die die Übersetzung bewahrt. Die im bereitgestellten syrischen Seitenausschnitt lesbare Ortsangabe ist jedoch textlich nicht eindeutig mit der englischen Wiedergabe „wall“ in Einklang zu bringen; da die vorliegende Passage und Prüfkette die Mauer voraussetzen, wird der Text nicht eigenmächtig auf „Markt/Straße“ umgestellt.'
  naturalness: „Und siehe“ ist im modernen Standarddeutsch als gehobene Visionserzählung natürlich. „Über die Mauer Jerusalems hinweg“ ist idiomatischer und räumlich eindeutiger als „über die Mauer Jerusalems“. Die Wiederaufnahme mit „und ich sah“ folgt dem Quelltext und verbindet die Szenen klar.
  terminology: '„Geist der Kraft“ wahrt die offene Genitivverbindung. „Engel“, „Ecken der Stadt“ und „Fackel“ sind angemessen. Die vorhandene Anmerkung ist hingegen sachlich ungenau: „Feuerlampe“ ist keine wörtliche Wiedergabe der Bezeichnung für die Lichtquelle und widerspricht zudem der Hauptübersetzung, ohne eine tatsächlich hilfreiche Alternative anzubieten. Die alternative deutsche Lesart sollte „brennende Lampe“ lauten.'
  issues:
  - severity: medium
    issue: Die Fußnote bezeichnet „Feuerlampe“ als ungefähr wörtlich.
    rationale: Die Fußnote vermischt die Feuerqualifizierung mit der Bezeichnung der Lichtquelle. Als deutsche Übersetzungsalternative ist „brennende Lampe“ klarer; „Fackel“ steht bereits im Haupttext.
  - severity: low
    issue: „Und sieh“ und „Da sah ich“ sind leicht weniger quellnah bzw. idiomatisch als „Und siehe“ und „und ich sah“.
    rationale: Die Revision bewahrt den gehobenen Erzählton und die Satzverknüpfung des Originals.
  revised_text: Und siehe, plötzlich hob mich ein Geist der Kraft empor und trug mich über die Mauer Jerusalems hinweg; und ich sah vier Engel an den vier Ecken der Stadt stehen, jeder von ihnen hielt eine brennende Fackel[a] in seinen Händen.
  revised_footnotes:
  - marker: a
    text: 'Oder: „eine brennende Lampe“.'
    reason: Die Bezeichnung für die tragbare Lichtquelle kann je nach Kontext als Fackel oder Lampe wiedergegeben werden; die Feuerqualifizierung und die Angabe „in seinen Händen“ bleiben im Haupttext erhalten.
  revision_rationale: Eine kleine stilistische Glättung verbessert das moderne, würdige Deutsch. Die Fußnote wird korrigiert, damit sie eine echte, quellentreue Übersetzungsalternative bietet und keine irreführende Pseudo-Wörtlichkeit behauptet. Die in der englischen Prüfkette bestätigten Angaben zur brennenden Fackel und zu den Händen bleiben erhalten.
