base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/006/001.yaml
  text: And it happened on the next day that, behold, the forces of the Chaldeans surrounded the city. And at evening time I, Baruch, left the people, and I went out and stood by the oak, and I was grieving over Zion and lamenting over the captivity that had come upon the people. And I was filled with a spirit of strength, and I was lifted up on high above the square of Jerusalem. And I saw, behold, four angels standing at the four corners of the city, each of them holding a torch.
translation:
  language: de
  text: 'Und es geschah am nächsten Tag: Siehe, die Streitkräfte der Chaldäer umzingelten die Stadt. Gegen Abend verließ ich, Baruch, das Volk, ging hinaus und stellte mich an die Eiche. Ich trauerte um Zion und klagte über die Gefangenschaft, die über das Volk gekommen war. Da wurde ich von einem Geist der Kraft erfüllt und hoch über den Platz Jerusalems emporgehoben. Und ich sah: Siehe, vier Engel standen an den vier Ecken der Stadt, und jeder von ihnen hielt eine Fackel.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢܐ ܕܡܚܪ
  choice: am nächsten Tag
  rationale: Die Wendung ist eine übliche Zeitangabe und bezeichnet in natürlichem Deutsch den folgenden Tag.
- source_word: ܚܝ̈ܠܐ ܕܒ̈ܥܝܕܐ
  choice: die Streitkräfte der Chaldäer
  rationale: Die Kontrollüberlieferung stützt den militärischen Sinn und die Identifikation als Chaldäer; „Streitkräfte“ lässt offen, ob ein einzelnes Heer oder mehrere Verbände gemeint sind.
- source_word: ܘܐܬܬܙܝܥܝ ... ܒܟܝܐ
  choice: Ich trauerte ... und klagte
  rationale: Die Wiedergabe bewahrt die doppelte Ausdrucksweise von innerer Trauer und geäußerter Klage.
- source_word: ܪܘܚܐ ܕܚܝ̈ܠܐ
  choice: ein Geist der Kraft
  rationale: Die Formulierung folgt der syrischen Wortfügung eng, bezeichnet eine stärkende beziehungsweise machtvolle Geistwirkung und vermeidet eine dogmatische Festlegung.
- source_word: ܫܘܩܐ ܕܐܘܪܫܠܡ
  choice: den Platz Jerusalems
  rationale: Das Substantiv kann Straße, Markt oder offenen städtischen Platz bezeichnen; „Platz“ passt zur räumlichen Vision, ohne den Ort unnötig auf einen Markt einzuengen.
- source_word: ܠܡܦܝܕܐ
  choice: eine Fackel
  rationale: Der Kontext beschreibt ein feuriges Gerät in der Hand jedes Engels; „Fackel“ gibt das apokalyptische Bild deutlicher wieder als „Lampe“.
theological_decisions:
- issue: Identität des erfüllenden Geistes
  choice: „ein Geist der Kraft“ ohne nähere Identifikation
  alternative: „der Geist der Macht“ oder ausdrückliche Gleichsetzung mit dem Heiligen Geist
  rationale: Der syrische Text beschreibt die Geistwirkung, bestimmt ihre Identität aber nicht ausdrücklich. Die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit narrativem Rhythmus. Das wiederholte „Siehe“ bleibt als visionäres Aufmerksamkeitssignal erhalten. Wegen der im Datensatz vorgegebenen Versabgrenzung umfasst der Text auch die unmittelbar anschließende Erhebung Baruchs und die Engelvision.
