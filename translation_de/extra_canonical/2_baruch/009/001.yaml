base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/009/001.yaml
  text: And I, Baruch, came with Jeremiah, whose heart had been found pure from sins, and who had not been taken in the capture of the city. And we rent our garments, wept, mourned, and fasted seven days.
translation:
  language: de
  text: Und ich, Baruch, kam[a] zusammen mit Jeremia, dessen Herz als rein von Sünden befunden worden war und der bei der Einnahme der Stadt nicht gefangen genommen worden war. Wir zerrissen unsere Kleider, weinten, trauerten und fasteten sieben Tage lang.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das syrische Wort ist an dieser textlich schwierigen Stelle unsicher; möglich sind auch »kehrte zurück« oder »ging fort«.
    reason: Die beschädigte beziehungsweise schwer lesbare Überlieferung des Kapitelanfangs lässt die genaue Bewegungsrichtung offen.
lexical_decisions:
- source_word: ܐܬܒܥ
  choice: kam
  rationale: Der Kapitelanfang ist in der überlieferten syrischen Textgestalt schwer lesbar. Im Zusammenhang bezeichnet das Verb am ehesten eine einfache Bewegung; »kam« bleibt dabei zurückhaltender als stärker deutende Möglichkeiten.
- source_word: ܕܟܝ ... ܡܢ ܚܛܝ̈ܗ̣ܐ
  choice: dessen Herz als rein von Sünden befunden worden war
  rationale: Die Formulierung bewahrt sowohl die ausdrückliche Aussage über das Herz als auch das urteilende Moment von »befunden«. »Rein von Sünden« gibt den syrischen Ausdruck wieder, ohne ihn zu einer abstrakten Lehrformel auszuweiten.
- source_word: ܒܥܒܕܘܗܝ ܕܡܕܝܢܬܐ
  choice: bei der Einnahme der Stadt
  rationale: Die Wendung bezieht sich auf die gewaltsame Eroberung Jerusalems. »Einnahme« ist im Deutschen natürlich und wahrt den militärischen Sinn.
- source_word: ܘܒܩ̈ܝ
  choice: weinten, trauerten
  rationale: Die beiden Trauerverben werden getrennt wiedergegeben, damit die Häufung und das Gewicht der Klage erhalten bleiben.
theological_decisions:
- issue: Jeremia wird als »rein von Sünden« bezeichnet
  choice: Die Aussage bleibt wörtlich sichtbar, wird aber nicht zu einer Behauptung allgemeiner, absoluter Sündlosigkeit erweitert.
  alternative: Jeremia wird in jeder Hinsicht als völlig sündlos bezeichnet; oder die Reinheit ist ausschließlich rituell gemeint.
  rationale: Der unmittelbare Zusammenhang betrifft Jerusalems Schuld, Fall und Gefangennahme. Daher liegt eine auf diese Katastrophe bezogene moralische Unschuld Jeremias nahe, doch die Übersetzung lässt die Spannung der Formulierung bestehen.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Das Plusquamperfekt verdeutlicht, dass die Beurteilung Jeremias und seine Nichtgefangennahme der gemeinsamen Trauerhandlung vorausliegen. Die vier Trauerhandlungen bleiben unverkürzt erhalten.
