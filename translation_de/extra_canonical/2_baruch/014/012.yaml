  text: But the righteous may rightly hope for the end, and they depart from this dwelling without fear, because they have with you a store of works kept in treasuries.
translation:
  language: de
  text: Die Gerechten aber dürfen mit Recht auf das Ende hoffen. Ohne Furcht verlassen sie diese Wohnstätte, denn bei dir haben sie einen Vorrat an Werken, der in Schatzkammern aufbewahrt wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܕܝ̈ܩܐ
  choice: die Gerechten
  rationale: Die übliche sachlich-theologische Wiedergabe des syrischen Ausdrucks; sie bezeichnet Menschen, die gerecht handeln beziehungsweise vor Gott als gerecht gelten, ohne diese Spannung näher festzulegen.
- source_word: ܫܘܠܡܐ
  choice: das Ende
  rationale: Der Ausdruck kann Ende, Abschluss oder Vollendung bedeuten. „Das Ende“ bewahrt hier die eschatologische Offenheit und vermeidet eine vorschnelle Deutung als bloßen Tod oder als endgültige Vollendung.
- source_word: ܥܘܡܪܐ
  choice: Wohnstätte
  rationale: „Wohnstätte“ gibt das Bild des gegenwärtigen, vorübergehenden Aufenthalts würdig und natürlich wieder, ohne ausdrücklich „Leib“ oder „Welt“ einzusetzen.
- source_word: ܣܝܡܬܐ ܕܥܒ̈ܕܐ
  choice: einen Vorrat an Werken
  rationale: Die Formulierung erhält das Bild eines angesammelten Bestands und lässt offen, wie das Verhältnis dieser Werke zu Gottes Urteil theologisch zu bestimmen ist.
- source_word: ܒܝܬ ܓܙ̈ܐ
  choice: in Schatzkammern
  rationale: Die konkrete Bildsprache eines sicher verwahrten Schatzes wird erhalten.
theological_decisions:
- issue: Hoffnung der Gerechten aufgrund ihrer Werke
  choice: Die Aussage wird als Hoffnung auf das Ende und als bei Gott verwahrter Vorrat an Werken wiedergegeben.
  alternative: Die Werke ausdrücklich als verdienstbegründende Heilsleistung oder lediglich als Beweis eines unabhängig gewährten Heils deuten.
  rationale: Der Vers verbindet die Zuversicht der Gerechten mit ihren bei Gott aufbewahrten Werken, erklärt aber nicht systematisch, auf welche Weise diese beim endgültigen Urteil zählen. Die Übersetzung bewahrt diese Spannung.
- issue: Bedeutung der verlassenen Wohnstätte
  choice: „diese Wohnstätte“ bleibt bildhaft und unbestimmt.
  alternative: Direkt mit „diesen Leib“ oder „diese Welt“ übersetzen.
  rationale: Eine eindeutige Identifizierung würde die im Ausdruck liegende Mehrdeutigkeit unnötig auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die zwei Sätze folgen dem argumentativen Aufbau des Verses und bewahren die Bilder von Wohnstätte, Vorrat und Schatzkammern. Wegen der gestörten beziehungsweise überlappenden Seitenerfassung wurde die syrische Versgestalt anhand des Kapitelzusammenhangs und der kontrollierten englischen Konsultationsschicht abgesichert.
