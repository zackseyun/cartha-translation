  text: Therefore they leave this world without fear, and with trust and gladness they wait to receive the world that you promised them …
translation:
  language: de
  text: Darum verlassen sie diese Welt ohne Furcht und warten voll Vertrauen und Freude[a] darauf, die Welt zu empfangen, die du ihnen verheißen hast …
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und warten vertrauensvoll und mit Freude“.'
    reason: Die adverbiale Zuordnung von Vertrauen und Freude kann im Deutschen unterschiedlich, aber sachlich gleichwertig ausgedrückt werden.
lexical_decisions:
- source_word: ܥܠܡܐ / ʿalmā
  choice: Welt
  rationale: Gibt den eschatologischen Gegensatz zwischen der gegenwärtigen und der verheißenen Welt natürlich und ohne zusätzliche Deutung wieder.
- source_word: ܕܠܐ ܕܚܠܬܐ / dlā deḥltā
  choice: ohne Furcht
  rationale: Bewahrt die klare Negation und den würdevollen Ton.
- source_word: ܬܟܝܠܐܝܬ / takkilāʾīt
  choice: voll Vertrauen
  rationale: Gibt die adverbiale Bedeutung ‚vertrauensvoll/zuversichtlich‘ in natürlichem Deutsch wieder, ohne Freude selbst zum Gegenstand des Vertrauens zu machen.
- source_word: ܒܚܕܘܬܐ / b-ḥādūṯā
  choice: und Freude
  rationale: Steht koordiniert mit dem Vertrauen und bezeichnet die freudige Haltung des Wartens.
- source_word: ܡܣܟܝܢ / msakkēn
  choice: warten darauf
  rationale: Natürliches modernes Deutsch; die Ergänzung ‚darauf‘ bindet den folgenden Infinitiv eindeutig an das Warten.
theological_decisions:
- issue: Bezeichnung des kommenden Heils als ‚Welt‘
  choice: die Welt, die du ihnen verheißen hast
  alternative: die kommende Welt / das verheißene Zeitalter
  rationale: Die schlichte Wiedergabe ‚Welt‘ bewahrt die Ausdrucksweise und vermeidet, das eschatologische Konzept durch eine explizite Deutung einzuengen.
- issue: Verhältnis von Vertrauen und Freude zum Warten
  choice: warten voll Vertrauen und Freude
  alternative: warten vertrauensvoll und mit Freude
  rationale: Beide Haltungen werden auf das Warten bezogen; die Formulierung lässt offen, ob sie syntaktisch exakt parallel stehen, und vermeidet die Fehlinterpretation, die Freude sei Gegenstand des Vertrauens.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem eschatologischem Ton. Die Auslassungspunkte werden beibehalten, weil der überlieferte beziehungsweise bereitgestellte Versauszug an dieser Stelle offen weiterführt.
