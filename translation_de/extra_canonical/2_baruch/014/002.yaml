  text: And now I know that many have sinned and lived, and only a few will remain in those times to whom these words may be spoken.
translation:
  language: de
  text: Und nun weiß ich, dass viele gesündigt und gelebt haben; doch in jenen Zeiten werden nur wenige übrig bleiben, zu denen diese Worte gesprochen werden können.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܗܫܐ ܝܕܥܬ
  choice: Und nun weiß ich
  rationale: Gibt die revidierte Lesart als gegenwärtige Erkenntnis wieder und vermeidet die ältere, quellenwidrige Deutung „Ich sagte in meinen Gedanken“.
- source_word: ܣܓܝܐܝܢ ... ܕܚܛܘ ܘܚܝܘ
  choice: Viele haben gesündigt und dennoch gelebt
  rationale: Bewahrt den Gegensatz zwischen Sünde und fortdauerndem Leben; „dennoch“ macht ihn im Deutschen natürlich erkennbar, ohne eine Straffreiheit zu behaupten.
- source_word: ܙܥܘܪܝܢ ... ܢܫܬܚܪܘܢ
  choice: nur wenige übrig bleiben
  rationale: Entspricht dem quantitativen Gegensatz zu „viele“ und dem Gedanken des Verbleibens in den genannten Zeiten.
- source_word: ܒܗܘܢ ܙܒ̈ܢܐ
  choice: in jenen Zeiten
  rationale: Die demonstrative Zeitangabe bleibt bewusst unbestimmt und verweist auf den eschatologisch geprägten Kontext.
- source_word: ܕܠܘܬܗܘܢ ܢܬܡܠܠܢ ܡ̈ܠܐ ܗܠܝܢ
  choice: zu denen diese Worte gesprochen werden können
  rationale: Bewahrt die mögliche beziehungsweise zukünftige Ausrichtung der Aussage, ohne den Empfängerkreis näher festzulegen.
theological_decisions:
- issue: Bedeutung des Weiterlebens der Sünder
  choice: „gesündigt und dennoch gelebt“
  alternative: „gesündigt haben und am Leben geblieben sind“
  rationale: Die Formulierung erhält die Spannung, dass viele trotz ihrer Sünde lebten, ohne daraus eine Aussage über Vergebung, endgültiges Heil oder göttliche Billigung abzuleiten.
- issue: Identität der wenigen Übrigbleibenden
  choice: nicht näher bestimmt
  alternative: als geretteter Rest oder bestimmte Glaubensgemeinschaft ausweisen
  rationale: Der Vers benennt lediglich wenige, die in jenen Zeiten verbleiben und angesprochen werden können; eine konfessionelle oder soteriologische Präzisierung wäre ein Zusatz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Doppelpunkt und das Semikolon gliedern die Erkenntnis und den Kontrast klar. Keine Fußnote ist nötig, da die früheren englischen Varianten durch die quellenbasierte Revision als fehlerhaft beziehungsweise rein grammatisch bedingt erledigt sind.
