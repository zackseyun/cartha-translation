translation:
  language: de
  text: die nicht nach der Nichtigkeit der Toten[a] suchten, sondern nach dir verlangten und ihr Herz nicht dem Geringen und Vergänglichen zuwandten,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »nach der Nichtigkeit, die mit den Toten verbunden ist«; der syrische Ausdruck ist in seiner Beziehung mehrdeutig.'
    reason: Die Genitivverbindung kann unterschiedlich verstanden werden; die Anmerkung bewahrt diese echte Mehrdeutigkeit, ohne das Substantiv „Nichtigkeit“ auszulassen.
lexical_decisions:
- source_word: ܣܪܝܩܘܬܗܘܢ ܕܡܝ̈ܬܐ (rekonstruiert aus dem schwer lesbaren Textzusammenhang)
  choice: die Nichtigkeit der Toten
  rationale: Bewahrt das im Syrischen bezeugte Substantiv im Sinn von Leere, Nichtigkeit oder Vergeblichkeit und vermeidet die Verkürzung zu „die Toten“.
- source_word: ܨܒܝܢܝ
  choice: nach dir verlangten
  rationale: Gibt das auf Gott gerichtete Begehren natürlich und würdig wieder, ohne es zu einem bloßen Wollen abzuschwächen.
- source_word: ܙܥܘܪܘ … ܕܡܬܒܥܝܢ (unsicherer Textstand)
  choice: dem Geringen und Vergänglichen
  rationale: Folgt dem erkennbaren Gegensatz zwischen der Hinwendung zu Gott und dem Kleinen beziehungsweise Vorübergehenden; die deutsche Paarformel bildet den Sinn idiomatisch ab.
theological_decisions:
- issue: Bezug der „Nichtigkeit“ auf die Toten
  choice: die Nichtigkeit der Toten
  alternative: die Toten
  rationale: Das vorhandene Substantiv darf nicht ausgelassen werden. Die Formulierung lässt offen, ob damit die den Toten eigene Nichtigkeit oder nichtige, mit ihnen verbundene Dinge gemeint sind.
