translation:
  language: de
  text: Oder wer, Herr, kennt dein Gericht? Oder wer kann die Tiefe deines Weges erforschen?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܝܢܟ (dīnak)
  choice: dein Gericht
  rationale: Gibt den syrischen Begriff für Gericht beziehungsweise richterliche Entscheidung knapp wieder und bewahrt dessen Bedeutungsweite.
- source_word: ܥܘܡܩܐ ܕܐܘܪܚܟ (ʿumqā d-ʾurḥāk)
  choice: die Tiefe deines Weges
  rationale: Bewahrt das Bild und gibt die ausdrücklich genannte »Tiefe« wieder, die nicht ausgelassen werden darf.
- source_word: ܒܨܐ (bṣā)
  choice: erforschen
  rationale: Bezeichnet das gründliche Suchen oder Ergründen und passt natürlich zum Bild von der Tiefe des göttlichen Weges.
theological_decisions:
- issue: Bedeutungsweite von ܕܝܢܟ zwischen Urteil, Recht und Gericht
  choice: dein Gericht
  alternative: dein Urteil
  rationale: »Gericht« wahrt den umfassenderen theologischen und richterlichen Sinn, ohne ihn auf einen einzelnen Urteilsspruch zu verengen.
translation_notes:
  register: Moderne, würdevolle Standardsprache; die parallelen rhetorischen Fragen und das Bild von der unergründlichen Tiefe des göttlichen Weges bleiben erhalten.
