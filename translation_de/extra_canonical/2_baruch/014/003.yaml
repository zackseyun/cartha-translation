  text: For what profit is there in this, or what is worse than these things that we have seen, that we should desire to wait to see?
translation:
  language: de
  text: Denn welchen Nutzen hat dies? Oder was ist schlimmer als das, was wir gesehen haben, dass wir wünschen sollten, abzuwarten und zu sehen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlicher auch: „dass wir wünschen sollten, zu erwarten/abzuwarten, dass wir sehen“. Der syrische Satz ist in seiner Abfolge und im Bezug des abschließenden „sehen“ schwer verständlich.'
    reason: Die Fußnote wahrt die wirkliche syntaktische und semantische Unsicherheit der ungewöhnlichen Folge von Wünschen, Warten/Erwarten und Sehen, ohne den Haupttext unnötig zu verkomplizieren.
lexical_decisions:
- source_word: ܝܘܬܪܢܐ (yūtrānā)
  choice: Gewinn
  rationale: Bezeichnet Nutzen oder Vorteil; „Gewinn“ bewahrt hier den knappen, rhetorischen Ton.
- source_word: ܕܒܝܫ (d-bīš)
  choice: was ist schlimmer
  rationale: Gibt die komparative Aussage des Syrischen direkt und idiomatisch wieder.
- source_word: ܕܚܙܝܢ (d-ḥzayn)
  choice: die wir gesehen haben
  rationale: Die Form wird im vorliegenden Zusammenhang als Rückblick auf bereits Erlebtes verstanden, entsprechend der antiken Klageperspektive.
- source_word: ܕܨ̈ܒܝܢ ܡܣܟܢܝܢ ܕܢܚܙܘܢ
  choice: sodass wir wünschen sollten, noch abzuwarten und zu sehen
  rationale: Bewahrt die auffällige Folge von Wünschen, Warten/Erwarten und Sehen, glättet sie aber gerade so weit, dass sie im Deutschen verständlich bleibt.
theological_decisions:
- issue: Bezug des abschließenden Sehens
  choice: Der Gegenstand dessen, was noch gesehen werden soll, bleibt unausgesprochen.
  alternative: „noch mehr zu sehen“ oder „Weiteres zu sehen“
  rationale: „Mehr/Weiteres“ wäre kontextuell plausibel, steht aber nicht ausdrücklich im erhaltenen syrischen Wortlaut und würde dessen Spannung auflösen.
translation_notes:
  register: Moderne, würdige Gebetssprache. Die zwei rhetorischen Fragen werden klar voneinander abgesetzt; die Unbestimmtheit des letzten Satzteils bleibt erhalten.
