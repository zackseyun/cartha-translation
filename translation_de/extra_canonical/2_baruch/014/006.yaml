translation:
  language: de
  text: Und für wen wurden gute Werke erstrebt,[a] und für wen wurden Propheten gefunden?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „die Mühe/Arbeit des Guten gesucht“; auch „nach dem Guten gestrebt“ ist möglich.'
    reason: Die syrische Wendung kann auf das tätige Gute bzw. gute Werke bezogen werden, lässt aber eine wörtlichere Auffassung als Bemühen um das Gute zu.
  - marker: b
    text: 'Wörtlich: „wurden ihnen Propheten gefunden?“; im Zusammenhang kann dies auch ihr Verfügbarsein oder Bereitstehen bezeichnen.'
    reason: Das syrische Verb bedeutet zunächst „gefunden werden“; die kontextuelle Nuance soll erläutert, aber nicht im Haupttext durch eine ausdrückliche Geberformel festgelegt werden.
lexical_decisions:
- source_word: ܡܬܒܥܝܢ
  choice: wurden … erstrebt
  rationale: Das syrische Verb bezeichnet ein Suchen oder Streben. „Erstrebt“ gibt den passiven Ausdruck im Deutschen natürlicher wieder als das missverständliche „gesucht“.
- source_word: ܥܡܠܐ ܕܛܒܬܐ
  choice: gute Werke
  rationale: Wörtlich steht etwa „Mühe/Arbeit des Guten“. Im Zusammenhang bezeichnet die Wendung das tätige Gute; die wörtlichere Möglichkeit bleibt in der Fußnote erhalten.
- source_word: ܢܫܬܟܚ ܠܗܘܢ
  choice: waren … da
  rationale: Die Form bedeutet wörtlich „wurden für sie gefunden“ und kann kontextuell das Vorhandensein beziehungsweise Bereitstehen ausdrücken. „Waren … da“ bewahrt diesen Sinn, ohne das im Syrischen nicht ausdrücklich stehende „gegeben“ in den Haupttext einzutragen.
theological_decisions:
- issue: Zweck und Verfügbarkeit guter Werke und prophetischer Verkündigung
  choice: Die beiden Fragen bleiben offen und parallel formuliert.
  alternative: Die Propheten ausdrücklich als von Gott „gegeben“ bezeichnen.
  rationale: Der Vers stellt eine rhetorische Frage; eine ausdrückliche göttliche Geberformel würde die knappe syrische Aussage theologisch stärker festlegen als nötig.
translation_notes:
  register: Moderne, würdige Fragesyntax mit parallelem Satzbau. Die ungewöhnliche Passivkonstruktion des Syrischen wird weitgehend bewahrt, zugleich aber durch „erstrebt“ und „waren … da“ verständlich und idiomatisch gestaltet.
