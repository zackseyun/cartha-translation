translation:
  language: de
  text: Oder wer unter den Sterblichen kann den Anfang und das Ende deiner Weisheit finden?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „ergründen“.'
    reason: „Ergründen“ gibt im Deutschen die kontextuelle Bedeutung des Findens beziehungsweise Nachverfolgens von Anfang und Ende wieder, ist aber weniger nah an der gewöhnlichen lexikalischen Bedeutung des syrischen Verbs.
lexical_decisions:
- source_word: ܡܫܟܚ
  choice: kann … finden
  rationale: Das syrische Verb bedeutet gewöhnlich „finden“ oder „entdecken“; „finden“ wahrt hier die konkrete Bildlichkeit und entspricht dem Satzbau natürlich.
- source_word: ܫܘܠܡܐ
  choice: Ende
  rationale: Das Substantiv bezeichnet Vollendung oder Ende und steht hier dem Anfang gegenüber.
- source_word: ܚܟܡܬܟ
  choice: deiner Weisheit
  rationale: Direkte Wiedergabe des syrischen Nomens mit Suffix der 2. Person Singular.
theological_decisions:
- issue: Unergründlichkeit der göttlichen Weisheit
  choice: Die rhetorische Frage bleibt ohne ergänzende Deutung stehen.
  alternative: Ausdrücklich formulieren, dass niemand Gottes Weisheit vollständig begreifen kann.
  rationale: Der Ausgangstext vermittelt dies durch eine rhetorische Frage; eine erklärende Aussage würde die poetische Spannung auflösen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe rhetorische Frage und die Anrede Gottes in der zweiten Person Singular bleiben erhalten.
