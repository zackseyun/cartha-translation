  text: 'But I will speak before you: What more have those who knew you and did not walk in vanity like the rest of the nations gained?'
translation:
  language: de
  text: 'Doch ich will vor dir darlegen: Was haben jene, die dich erkannt haben und nicht wie die übrigen Völker in Nichtigkeit wandelten, mehr gewonnen?'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܝܘܬܪܢܐ
  choice: Gewinn
  rationale: Gibt den Nutzen oder Vorteil wieder, nach dem die rhetorische Frage fragt.
- source_word: ܝܕܥܘ ܩܕܡܝܟ
  choice: dich erkannt haben
  rationale: Das syrische Verb bezeichnet hier ein auf Gott bezogenes Erkennen; „erkannt“ wahrt den persönlichen und theologischen Gehalt.
- source_word: ܗܒܠܐ
  choice: Nichtigkeit
  rationale: Bewahrt die Mehrdeutigkeit von Vergänglichkeit, Leere und moralisch-religiöser Vergeblichkeit besser als eine engere Festlegung auf „Götzendienst“.
- source_word: ܥܡ̈ܡܐ
  choice: Völker
  rationale: Entspricht dem ethnisch-kollektiven Ausdruck und erhält den Kontrast zu den übrigen Völkern.
theological_decisions:
- issue: Sinn der Nichtigkeit
  choice: Nichtigkeit
  alternative: Götzendienst
  rationale: Der Quellenausdruck kann religiöse Verirrung einschließen, benennt sie hier aber nicht ausdrücklich; die offenere Wiedergabe vermeidet eine konfessionell oder exegetisch verengende Auflösung.
- issue: Rhetorischer Charakter des Satzes
  choice: als Frage formuliert
  alternative: als Aussagesatz oder Satzfragment
  rationale: Das einleitende Fragewort und der Zusammenhang verlangen eine rhetorische Frage, ohne deren Spannung durch eine ergänzte Antwort aufzulösen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. „Vor dir sprechen“ und „wandeln“ bewahren den Gebets- und Weisheitston; die leicht gehobene Diktion bleibt für heutige Leser verständlich.
