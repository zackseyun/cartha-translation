  source_fidelity: 'Der Entwurf gibt die rhetorische Frage und die wesentlichen Begriffe angemessen wieder: „dich erkannt“, „Nichtigkeit“ und der Kontrast zu den übrigen Völkern entsprechen dem syrischen Sinn und dem englischen Audit-Verlauf. „Welchen größeren Gewinn“ kann jedoch im Deutschen einen bloß komparativen, größeren Gewinn nahelegen, während die Frage nach einem zusätzlichen Vorteil („was mehr“) fragt.'
  naturalness: „Vor dir sprechen“ ist verständlich, aber weniger idiomatisch als „vor dir darlegen“ in dieser feierlichen Anrede. Die Umstellung zu „Was haben ... mehr gewonnen?“ ist natürliches modernes Deutsch und erhält den rhetorischen Charakter.
  terminology: „Nichtigkeit“ wahrt die offene, religiös-ethische Bedeutung von ܗܒܠܐ, ohne sie auf Götzendienst festzulegen. „Völker“ ist für ܥܡ̈ܡܐ passend. „Erkannt“ bewahrt die personale Gotteserkenntnis.
