  text: Or who can learn your judgment, or search out the depth of your way, or calculate the weight of your path, or comprehend your counsel which cannot be grasped?
translation:
  language: de
  text: Oder wer kann dein Urteil ergründen, die Tiefe deines Weges erforschen, das Gewicht deines Pfades ermessen oder deinen unfassbaren Ratschluss begreifen?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die letzte Klausel („oder deinen unfassbaren Ratschluss begreifen“) kann je nach Verseinteilung auch als Beginn von Vers 9 aufgefasst werden.
    reason: versification
lexical_decisions:
- source_word: ܕܝܢܟ (rekonstruiert aus dem kontrollierten Verskontext)
  choice: dein Urteil
  rationale: Gibt den gerichtlichen Sinn wieder, ohne ihn auf eine einzelne richterliche Entscheidung einzuengen.
- source_word: ܥܘܡܩܐ ܕܐܘܪܚܟ
  choice: die Tiefe deines Weges
  rationale: Bewahrt das Bild von der unerforschlichen Tiefe des göttlichen Weges.
- source_word: ܬܘܩܠܐ ܕܫܒܝܠܟ
  choice: das Gewicht deines Pfades
  rationale: Erhält die konkrete, ungewöhnliche Metapher des syrischen Textes; „ermessen“ ist im Deutschen idiomatischer als „berechnen“.
- source_word: ܬܪܥܝܬܟ ܕܠܐ ܡܬܕܪܟܐ
  choice: deinen unfassbaren Ratschluss
  rationale: „Ratschluss“ trifft hier den Sinn von Plan beziehungsweise Beratung; „unfassbar“ bildet die ausdrückliche Nicht-Erfassbarkeit ab.
theological_decisions:
- issue: Göttliche Unergründlichkeit
  choice: Die vier parallelen Fragen bleiben vollständig und ohne erklärende Auflösung erhalten.
  alternative: Die Aussage auf die Unbegreiflichkeit des göttlichen Ratschlusses verkürzen.
  rationale: Der syrische Vers bezeugt mehrere eigenständige Bilder für die Grenzen menschlicher Erkenntnis; ihre Spannung darf nicht eingeebnet werden.
- issue: Versabgrenzung der Schlussklausel
  choice: Die Klausel über den unfassbaren Ratschluss wird gemäß der vorgegebenen Versfassung in 14,8 aufgenommen und mit einer Fußnote gekennzeichnet.
  alternative: Die Schlussklausel als Beginn von 14,9 setzen.
  rationale: Die Überlieferungs- beziehungsweise Einteilungsfrage betrifft die Versgrenze, nicht den Wortlaut; die Hauptfassung folgt der hier vorgegebenen Referenz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die poetische Parallelität und die ungewöhnlichen Bilder „Tiefe“, „Gewicht“ und „Pfad“ bleiben erhalten; die Verben sind idiomatisch variiert, ohne den Gedankengang zu glätten.
