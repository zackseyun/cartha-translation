  yaml_path: translation/extra_canonical/2_baruch/014/011.yaml
  text: 'For as a breath rises without intention and vanishes, so is the nature of men: they do not go by their own will, and they do not know what will happen to them in the end.'
translation:
  language: de
  text: 'Denn wie ein Hauch ohne Absicht aufsteigt und vergeht, so ist es mit dem Wesen der Menschen: Sie gehen nicht aus eigenem Willen und wissen nicht, was ihnen am Ende widerfahren wird.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܗܒܠܐ
  choice: Hauch
  rationale: Bewahrt das flüchtige Bild des syrischen Ausdrucks und klingt im Deutschen natürlicher und würdevoller als „Atemzug“ oder „Dunst“.
- source_word: ܕܠܐ ܡܢ ܠܒܐ
  choice: ohne Absicht
  rationale: Gibt die Vorstellung eines Geschehens wieder, das nicht aus eigenem innerem Entschluss hervorgeht.
- source_word: ܡܢܗܘܢ ܕܒܢ̈… (Text am Seitenende beschädigt bzw. abgeschnitten)
  choice: das Wesen der Menschen
  rationale: Folgt der durch die geprüfte Konsultationsschicht gestützten Aussage, ohne die schwer lesbare Seitenüberlieferung künstlich zu präzisieren.
- source_word: Verb des Fortgehens/Scheidens in der rekonstruierten Verszeile
  choice: scheiden
  rationale: „Scheiden“ wahrt das Bild des Fortgehens und lässt zugleich den im Zusammenhang naheliegenden Tod erkennen, ohne ihn ausdrücklich einzusetzen.
- source_word: Schlussformel zum künftigen Ergehen
  choice: was ihnen am Ende widerfahren wird
  rationale: Erhält sowohl die Zukunftsoffenheit als auch die eschatologische Spannung von „am Ende“.
theological_decisions:
- issue: Menschlicher Wille und Sterblichkeit
  choice: „Sie scheiden nicht aus eigenem Willen“
  alternative: „Sie sterben nicht aus eigenem Willen“
  rationale: Die gewählte Formulierung bewahrt die bildhafte Mehrdeutigkeit zwischen Fortgehen und Sterben und macht keine stärkere dogmatische Aussage, als der Text verlangt.
- issue: Bedeutung von „am Ende“
  choice: unbestimmt beibehalten
  alternative: ausdrücklich als individuelles Todesgeschick oder Endgericht deuten
  rationale: Der Text lässt offen, ob das persönliche Lebensende, das endgültige Geschick oder beides gemeint ist; diese Spannung bleibt erhalten.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem biblischem Ton. Der Doppelpunkt bildet den Übergang vom Hauchbild zur menschlichen Lage klar ab; die beiden Schlussaussagen bleiben eng parallel.
