lexical_decisions:
- source_word: ܗܒܠܐ
  choice: Hauch
  rationale: Das syrische Wort bezeichnet einen flüchtigen Atem oder Dunst und kann bildlich Vergänglichkeit ausdrücken. „Hauch“ bewahrt sowohl das konkrete Bild als auch dessen Aussage über die menschliche Flüchtigkeit.
- source_word: ܐܬܡܢܢ
  choice: sind … geworden
  rationale: Die passive Verbform wird als eingetretener Zustand wiedergegeben; dies entspricht auch der überlieferten Deutung des Satzes.
theological_decisions:
- issue: Aussage über die menschliche Vergänglichkeit
  choice: Das Bild vom Hauch bleibt unaufgelöst stehen.
  alternative: „Wir sind alle vergänglich geworden.“
  rationale: Die bildhafte und theologisch spannungsvolle Sprache des Ausgangstextes sollte nicht durch eine abstrakte Deutung ersetzt werden.
translation_notes:
  register: Kurzer, würdevoller Aussagesatz in modernem Standarddeutsch. Die Satzstellung ist natürlich und bewahrt den poetischen Vergleich des syrischen Textes.
