  yaml_path: translation/extra_canonical/2_baruch/014/001.yaml
  text: Then I answered and said, “Behold, you have shown me the course of the times, and what is to happen after these things, and you have told me that the retribution which was spoken of by you will come upon the nations.
translation:
  language: de
  text: 'Da antwortete ich und sagte: „Siehe, du hast mir den Lauf der Zeiten gezeigt und was nach diesen Dingen geschehen wird. Du hast mir auch gesagt, dass die von dir angekündigte Vergeltung über die Völker kommen wird.“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܘܪܚܐ
  choice: Lauf
  rationale: Das Wort bedeutet grundsätzlich „Weg“, bezeichnet hier im apokalyptischen Zusammenhang aber den geordneten zeitlichen Verlauf; „Lauf der Zeiten“ gibt diesen Sinn natürlich wieder.
- source_word: ܦܘܪܥܢܐ
  choice: Vergeltung
  rationale: Der Ausdruck bezeichnet eine richterliche Erstattung oder Ahndung. „Vergeltung“ bewahrt den forensischen Charakter, ohne die Aussage auf eine bestimmte Form der Strafe einzuengen.
- source_word: ܥܡܡ̈ܐ
  choice: Völker
  rationale: Der Plural bezeichnet die Völker beziehungsweise Nationen, über die die angekündigte Vergeltung kommen soll.
theological_decisions:
- issue: Charakter der angekündigten Vergeltung
  choice: Die Aussage bleibt eine Ankündigung göttlicher richterlicher Vergeltung über die Völker.
  alternative: Eine allgemeine Folge geschichtlicher Ereignisse ohne ausdrücklichen Gerichtscharakter.
  rationale: ܦܘܪܥܢܐ trägt den Sinn von Vergeltung oder Ahndung; die Formulierung darf daher nicht zu einem neutralen „Ausgang“ abgeschwächt werden.
- issue: Bezug der Vergeltung auf Gottes vorheriges Reden
  choice: „die von dir angekündigte Vergeltung“
  alternative: „die Vergeltung, die kommen wird“
  rationale: Die kontrollierte Lesung bewahrt sowohl den Bezug darauf, dass Gott davon gesprochen hat, als auch das Kommen der Vergeltung über die Völker.
translation_notes:
  register: Moderne, würdige Standardsprache. „Siehe“ erhält den feierlichen Aufmerksamkeitsruf; „nach diesen Dingen“ wahrt die apokalyptische Erzählweise. Die beiden längeren Aussagen wurden zur besseren Verständlichkeit auf zwei Sätze verteilt.
