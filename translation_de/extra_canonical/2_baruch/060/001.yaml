  yaml_path: translation/extra_canonical/2_baruch/060/001.yaml
  text: And the fifth black waters that you saw raining—these are the deeds that the Amorites did, and the spells of their enchantments that they practiced, and the wickedness of their mysteries, and the mingling of their uncleanness.
translation:
  language: de
  text: 'Und die fünften schwarzen Wasser, die du herabregnen sahst: Das sind die Taten, die die Amoriter begingen, die Zaubersprüche ihrer Beschwörungen, die sie anwandten, die Bosheit ihrer Geheimnisse und die Vermischung ihrer Unreinheit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: fifth black waters
  choice: die fünften schwarzen Wasser
  rationale: Bewahrt die symbolische Bildsprache und den Numerus der konsultierten Versfassung.
- source_word: deeds
  choice: Taten
  rationale: Natürliches, zugleich wertungsneutrales Wort für vollbrachte Handlungen.
- source_word: spells of their enchantments
  choice: die Zaubersprüche ihrer Beschwörungen
  rationale: Erhält die auffällige Doppelung zweier magischer Begriffe, statt sie zu einem einzigen Ausdruck einzuebnen.
- source_word: mysteries
  choice: Geheimnisse
  rationale: Bewahrt die Mehrdeutigkeit zwischen verborgenen Praktiken und geheimem Wissen; „Geheimkulte“ wäre interpretierender.
- source_word: mingling of their uncleanness
  choice: das Vermischen ihrer Unreinheit
  rationale: Gibt die ungewöhnliche Abstraktion möglichst offen wieder, ohne die Art der Vermischung näher festzulegen.
theological_decisions:
- issue: Bedeutung der „Geheimnisse“
  choice: Geheimnisse
  alternative: Geheimkulte
  rationale: Der offenere Ausdruck vermeidet, ohne eindeutigen Quellennachweis einen bestimmten kultischen Hintergrund festzuschreiben.
