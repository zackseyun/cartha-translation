  text: But Israel also was defiled with sins in the days of the judges, while they were seeing many signs that were done by him who made them.
translation:
  language: de
  text: Doch auch Israel wurde in den Tagen der Richter durch Sünden verunreinigt, obwohl es viele Zeichen sah, die der vollbrachte, der es geschaffen hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'English consultation: “was defiled with sins”'
  choice: verunreinigte sich … durch Sünden
  rationale: Bewahrt das Bild kultisch-moralischer Verunreinigung und gibt zugleich die eigene Beteiligung Israels wieder.
- source_word: 'English consultation: “in the days of the judges”'
  choice: in den Tagen der Richter
  rationale: Die traditionelle Epochenbezeichnung ist im Deutschen klar und quellennahe.
- source_word: 'English consultation: “many signs”'
  choice: viele Zeichen
  rationale: „Zeichen“ wahrt die religiöse und erzählerische Bedeutung, ohne vorschnell auf „Wunder“ einzuengen.
- source_word: 'English consultation: “by him who made them”'
  choice: von seinem Schöpfer
  rationale: Gibt den Schöpferbezug idiomatisch wieder; das Bezugswort wird als Israel verstanden, statt missverständlich auf die Zeichen bezogen zu werden.
theological_decisions:
- issue: Bezugswort in „him who made them“
  choice: Israels Schöpfer
  alternative: der Schöpfer beziehungsweise Urheber der Zeichen
  rationale: Der Satz kontrastiert Israels Sünde mit den Zeichen seines Schöpfers. Wegen des nur interpolierten syrischen Kapitelmaterials bleibt die alternative syntaktische Zuordnung jedoch möglich.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die adversative Spannung zwischen Israels Sünde und den gesehenen Zeichen bleibt erhalten. Da der bereitgestellte syrische Seitenausschnitt den Wortlaut von 60:2 nicht sicher erkennen lässt, wurde die englische POB-Fassung nur als konsultative Rekonstruktionshilfe verwendet.
