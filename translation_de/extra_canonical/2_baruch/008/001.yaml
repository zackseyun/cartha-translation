base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/008/001.yaml
  text: And I saw that he went into the Holy of Holies, and took from there the veils, the ephod, the altar, the mercy seat, the two tables, the holy garments of the priests, the censer, the forty-eight precious stones, and all the holy vessels of the tabernacle. And he said to the earth with a loud voice, "Earth, earth, earth, hear the word of the mighty God, and receive what I commit to you, and guard them until the last times, so that, when you are commanded, you may restore them, so that strangers may not boast over them. For the time has drawn near when Jerusalem also will be delivered up for a time, until it is said that it will be restored again forever."
translation:
  language: de
  text: '1 Und ich sah, wie er in das Allerheiligste hineinging und von dort die Vorhänge, das Efod, den Altar, die Sühneplatte[a], die beiden Tafeln[b], die heiligen Gewänder der Priester, das Räuchergefäß[c], die achtundvierzig kostbaren Steine und alle Geräte nahm, die Gaben und heilige Geschenke des Zeltheiligtums waren. Dann rief er der Erde mit lauter Stimme zu: »Erde, Erde, Erde, höre das Wort des mächtigen Gottes! Nimm auf, was ich dir anvertraue, und bewahre es bis zu den letzten Zeiten. Wenn dir dann befohlen wird, sollst du es wieder zurückgeben, damit Fremde sich nicht damit rühmen. Denn die Zeit ist nahe, in der auch Jerusalem für eine Weile preisgegeben wird, bis es heißt, dass die Stadt wiederhergestellt wird – für immer.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Gemeint ist wahrscheinlich die goldene Deckplatte der Bundeslade; die genaue Bezeichnung ist in der syrischen Überlieferung nicht völlig sicher.
    reason: Der kultische Gegenstand ist wahrscheinlich identifizierbar, doch die vorliegende Textgestalt lässt eine gewisse lexikalische Unsicherheit bestehen.
  - marker: b
    text: Wahrscheinlich die beiden Tafeln des Bundes; die überlieferte syrische Wortform ist an dieser Stelle unsicher.
    reason: Die traditionelle Deutung passt zum Inventar, darf wegen der instabilen Lesart aber nicht als textlich zweifelsfrei dargestellt werden.
  - marker: c
    text: Oder möglicherweise ein anderer kultischer Gegenstand; die genaue Bedeutung des syrischen Wortes ist hier unsicher.
    reason: Die Quellform erlaubt keine völlig sichere Identifikation als Räuchergefäß.
lexical_decisions:
- source_word: ܒܝܬ ܩܘܕܫܐ ܩܘܕܫܐ
  choice: das Allerheiligste
  rationale: Die syrische Heiligkeitssteigerung bezeichnet den innersten Heiligtumsraum; »das Allerheiligste« ist die geläufige und präzise deutsche Entsprechung.
- source_word: ܦܪ̈ܘܟܬܐ
  choice: die Vorhänge
  rationale: Das Wort bezeichnet die kultischen Behänge des Heiligtums. Der Plural der Quelle bleibt erhalten.
- source_word: ܚܘܣܝܐ
  choice: die Sühneplatte
  rationale: Im Heiligtumsinventar ist wahrscheinlich die Deckplatte der Bundeslade gemeint. »Sühneplatte« gibt ihre kultische Funktion genauer wieder als das unspezifische »Deckel«.
- source_word: ܘܬܪ̈ܬܝܢ ܟܘܪ̈ܣܘ
  choice: die beiden Tafeln
  rationale: Die überlieferte Wortform ist textlich unsicher; im Inventar des Heiligtums liegt der Bezug auf die beiden Bundestafeln am nächsten. Die Fußnote wahrt die Unsicherheit.
- source_word: ܦܝܪܡܐ
  choice: das Räuchergefäß
  rationale: In diesem kultischen Zusammenhang ist ein Gerät zum Räuchern wahrscheinlich; die genaue Identifikation des syrischen Ausdrucks bleibt jedoch unsicher und wird vermerkt.
- source_word: ܐܪܥܐ ܐܪܥܐ ܐܪܥܐ
  choice: Erde, Erde, Erde
  rationale: Die dreifache Anrede wird wegen ihres feierlichen rhetorischen Gewichts vollständig bewahrt.
- source_word: ܢܘܟܪ̈ܝܐ
  choice: Fremde
  rationale: Die Grundbedeutung wird beibehalten, ohne die betreffenden Menschen enger als bestimmte Völker oder militärische Feinde festzulegen.
- source_word: ܡܫܟܢܐ
  choice: das heilige Zelt
  rationale: Der Ausdruck bezeichnet die Stiftshütte beziehungsweise das Zeltheiligtum. »Heiliges Zelt« ist verständlich und vermeidet die heute missverständliche Bedeutung von »Hütte«.
theological_decisions:
- issue: Bewahrung der Heiligtumsgegenstände in der Erde
  choice: Die Erde empfängt die Gegenstände als anvertrautes Gut und gibt sie auf göttlichen Befehl wieder heraus.
  alternative: Die Szene lediglich als gewöhnliches Vergraben oder Verstecken zu formulieren.
  rationale: Die personifizierte Anrede und die Befehle zum Aufnehmen, Bewahren und Wiederherausgeben stellen eine von Gott gelenkte Sicherung dar.
- issue: Zeitweilige Preisgabe und endgültige Wiederherstellung Jerusalems
  choice: Die zeitweilige Preisgabe und die dauerhafte Wiederherstellung werden beide ohne nähere zeitliche oder dogmatische Festlegung wiedergegeben.
  alternative: Die Aussage unmittelbar auf ein bestimmtes geschichtliches oder endzeitliches Schema festzulegen.
  rationale: Der Text hält Gericht und Wiederherstellung in Spannung, bestimmt aber weder Ablauf noch Art der endgültigen Wiederherstellung genauer.
translation_notes:
  register: Moderner, würdevoller Standarddeutsch-Register. Die lange Aufzählung und die dreifache Anrede der Erde bleiben als Merkmale des feierlichen Erzählstils erhalten. Kultische Fachbegriffe werden dort verwendet, wo sie im Deutschen etabliert sind; textkritische Unsicherheiten werden nicht in den Haupttext ausgebreitet, sondern knapp in Fußnoten kenntlich gemacht.
