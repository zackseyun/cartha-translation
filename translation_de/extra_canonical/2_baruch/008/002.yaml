  text: '"Pull down its walls and overturn them to their foundations, lest the enemies boast and say, ''We ourselves have pulled down the wall of Zion, and we have burned the dwelling place of the mighty God.''"'
translation:
  language: de
  text: '„Reißt ihre Mauern nieder und zerstört sie bis auf die Fundamente, damit die Feinde sich nicht rühmen und sagen: ›Wir selbst haben die Mauer Zions niedergerissen und die Wohnstätte des mächtigen Gottes niedergebrannt.‹“'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܘܪ̈ܝܗ
  choice: ihre Mauern
  rationale: Die mit Syame markierte Form ist hier pluralisch („ihre Mauern“); das feminine Possessivpronomen bezieht sich dem Zusammenhang nach auf die Stadt.
- source_word: ܥܘܪ̈ܩܘ
  choice: legt sie … um
  rationale: Gibt den gewaltsamen Abbruch beziehungsweise das Umstürzen der Mauern bis hinunter zu den Fundamenten wieder, ohne das Bild unnötig als „Ausrotten“ zu konkretisieren.
- source_word: ܫܘܪܐ ܕܨܗܝܘܢ
  choice: die Mauer Zions
  rationale: Die Form ist in der feindlichen Behauptung singularisch; der Wechsel vom Plural zum Singular bleibt erhalten.
- source_word: ܕܘܟܬܐ ܕܐܠܗܐ ܚܝܒܬܐ
  choice: die Wohnstätte des mächtigen Gottes
  rationale: „Wohnstätte“ passt zum Tempelkontext; „mächtiger Gott“ folgt der überlieferten und durch die englische Konsultationsschicht gestützten Sinnfassung.
theological_decisions:
- issue: Bezeichnung des Tempels als Gottes Wohnstätte
  choice: Wohnstätte des mächtigen Gottes
  alternative: Stätte des mächtigen Gottes
  rationale: „Wohnstätte“ macht den Tempelbezug verständlich, ohne eine weitergehende Aussage über die Weise der göttlichen Gegenwart festzulegen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Der Vers wird strikt auf den eigentlichen Befehl und die begründende Feindrede begrenzt; überlappender Text aus den Nachbarversen wird nicht aufgenommen.
