base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/054/001.yaml
  text: O You who created the earth, hear me—You who established the firmament by the word, and made firm the height of heaven by the spirit[a].
translation:
  language: de
  text: O du, der die Erde geschaffen hat, höre mich! Du hast das Himmelsgewölbe durch das Wort geordnet und die Höhe des Himmels durch den Geist[a] gefestigt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das syrische Wort ܪܘܚܐ kann „Geist“, „Wind“ oder „Atem/Hauch“ bedeuten. Die Verbindung von „Wort“ und „Atem/Hauch“ erinnert an Psalm 33,6.
    reason: lexical_choice
lexical_decisions:
- source_word: ܕܒܪܐ ܐܪܥܐ
  choice: der die Erde geschaffen hat
  rationale: Das Verb ܒܪܐ bezeichnet hier Gottes Erschaffen; das deutsche Perfekt klingt in der direkten Anrede natürlich und würdig.
- source_word: ܕܬܩܢܬ
  choice: Du hast … geordnet
  rationale: Der Pael von ܬܩܢ trägt sowohl den Gedanken des Ordnens als auch den des festen Einrichtens. „Geordnet“ gibt den ersten Aspekt wieder und vermeidet eine schwerfällige Wiederholung von „gefestigt“ im folgenden Parallelglied.
- source_word: ܪܩܝܥܐ
  choice: Himmelsgewölbe
  rationale: Bezeichnet die ausgebreitete Himmelsfeste; „Himmelsgewölbe“ ist im heutigen Deutsch verständlicher als das fachsprachlichere „Firmament“, ohne die antike Bildwelt aufzulösen.
- source_word: ܒܡܠܬܐ
  choice: durch das Wort
  rationale: ܡܠܬܐ bedeutet hier „Wort“ und steht parallel zu ܪܘܚܐ; der bestimmte Ausdruck wird beibehalten.
- source_word: ܘܫܪܪܬ
  choice: und … gefestigt
  rationale: Der Pael von ܫܪܪ bezeichnet das Fest- oder Beständigmachen und wird daher direkt mit „gefestigt“ wiedergegeben.
- source_word: ܪܘܚܐ
  choice: Geist
  rationale: ܪܘܚܐ kann „Geist“, „Wind“ oder „Atem/Hauch“ bedeuten. „Geist“ ist im Kontext göttlichen Schöpfungswirkens eine natürliche Hauptübersetzung; die echte Mehrdeutigkeit wird in der Fußnote bewahrt.
theological_decisions:
- issue: Deutung von ܪܘܚܐ als göttlicher Geist oder Atem/Hauch
  choice: Geist im Haupttext, mit lexikalischer Fußnote
  alternative: Atem oder Hauch
  rationale: Der Kontext erlaubt eine personale beziehungsweise theologische Lesart, während der Parallelismus mit „Wort“ und der Anklang an Psalm 33,6 ebenso stark für „Atem/Hauch“ sprechen. Die Übersetzung entscheidet nicht stillschweigend gegen die Alternative.
translation_notes:
  register: Moderne, feierliche Gebetssprache. Die wiederholte direkte Anrede „Du“ löst die syrische Relativkonstruktion im Deutschen klar auf. Das Ausrufezeichen markiert den abgeschlossenen Anruf, ohne die parallele Satzstruktur zu verdecken.
