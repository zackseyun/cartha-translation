base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/025/001.yaml
  text: 'Then he answered me and said, “You too shall be spared until that time, until the sign that the Mighty One will perform for the inhabitants of the earth at the end of the days. And this will be the sign: bewilderment will seize the inhabitants of the earth, and they will fall into many afflictions; then again into great anguish. And when, because of the abundance of their distress, they say in their thoughts, ‘The Mighty One no longer remembers the earth,’ and they have given up hope, then the time will awaken.”'
translation:
  language: de
  text: 'Da antwortete er mir: »Auch du sollst bis zu jener Zeit bewahrt werden, bis zu dem Zeichen[a], das der Mächtige am Ende der Tage für die Bewohner der Erde wirken wird. Und dies wird das Zeichen sein: Bestürzung wird die Bewohner der Erde ergreifen, und sie werden in viele Bedrängnisse geraten und danach erneut in große Angst. Wenn sie dann wegen der Fülle ihrer Not in Gedanken sagen: ›Der Mächtige denkt nicht mehr an die Erde‹, und alle Hoffnung aufgegeben haben, dann wird die Zeit erwachen.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »bis zu der festgesetzten Ordnung«; das syrische Wort kann ein Zeichen, eine festgesetzte Ordnung oder ein bestimmtes Anzeichen bezeichnen.'
    reason: Die Bedeutungsbreite von ܬܘܩܢܐ lässt sich im Haupttext nicht vollständig abbilden.
lexical_decisions:
- source_word: ܬܘܩܢܐ
  choice: Zeichen
  rationale: Im apokalyptischen Zusammenhang bezeichnet das Wort ein erkennbares, von Gott gesetztes Geschehen. »Zeichen« gibt diese Funktion natürlich wieder; die mögliche Grundbedeutung einer festgesetzten Ordnung bleibt in der Fußnote sichtbar.
- source_word: ܙܘ̈ܥܐ / im Kontext bezeichnete erschütternde Verwirrung
  choice: Bestürzung
  rationale: »Bestürzung« bezeichnet einen überwältigenden Zustand von Verwirrung und Schrecken, ohne ihn auf bloße Angst zu verengen.
- source_word: ܐܘܠܨܢܐ
  choice: Bedrängnisse / Not
  rationale: Die wechselnde Wiedergabe vermeidet schwerfällige Wiederholung und bewahrt zugleich die konkrete Vorstellung zunehmenden Drucks und Leidens.
- source_word: ܡܪܝܡܢܐ
  choice: der Mächtige
  rationale: Der substantivierte Gottesbeiname wird in würdigem, verständlichem Deutsch erhalten, ohne ihn erklärend zu »Gott« zu erweitern.
- source_word: ܡܬܕܟܪ
  choice: denkt … an
  rationale: Die natürliche deutsche Wendung bewahrt den biblischen Gedanken göttlichen Erinnerns und die Schärfe der verzweifelten Klage.
- source_word: ܥܪ / Erweckungsbild im Schlusssatz
  choice: wird … erwachen
  rationale: Die Personifikation der festgesetzten Zeit bleibt erhalten und wird nicht zu einer abstrakten Aussage über ihren bloßen Eintritt geglättet.
theological_decisions:
- issue: Die verzweifelte Aussage über Gottes Verhältnis zur Erde
  choice: »Der Mächtige denkt nicht mehr an die Erde«
  alternative: »Der Mächtige kümmert sich nicht mehr um die Erde«
  rationale: Die Übersetzung lässt die Klage als Aussage der bedrängten Menschen stehen und mildert sie nicht zu einer allgemeinen Behauptung über Fürsorge ab.
- issue: Personifikation der endzeitlichen Zeit
  choice: »dann wird die Zeit erwachen«
  alternative: »dann wird die Zeit anbrechen«
  rationale: »Erwachen« bewahrt das auffällige Bild des Ausgangstextes und löst die theologische Spannung nicht durch eine geläufigere Zeitformel auf.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptischem Ernst. Der Satzbau wurde gegliedert, ohne die Steigerung von Bestürzung über Bedrängnis und Angst bis zur Hoffnungslosigkeit abzuschwächen. Der Gottesbeiname und das Bild der erwachenden Zeit bleiben bewusst erhalten.
