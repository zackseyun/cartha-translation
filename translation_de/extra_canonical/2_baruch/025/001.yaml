  source_fidelity: 'Der deutsche Text folgt dem durch den englischen Audit-Trail gesicherten Sinn: Der Sprecher antwortet, die Bewahrung gilt bis zur bestimmten Zeit bzw. dem Zeichen, es folgen Bestürzung, sich steigernde Bedrängnis und Verzweiflung, ehe die Zeit personifiziert „erwacht“. Die Klage, der Mächtige denke nicht mehr an die Erde, bleibt zutreffend als menschliche Verzweiflungsrede stehen.'
  naturalness: Modernes, würdiges Standarddeutsch. Die Formulierungen „Bestürzung wird … ergreifen“, „in Gedanken sagen“ und „die Zeit erwachen“ sind verständlich und tragen den apokalyptischen Registerton. Die Wiederholung von „Bewohner der Erde“ ist angesichts der Vorlage und der feierlichen Diktion vertretbar.
  terminology: „Der Mächtige“ gibt den Gottesbeinamen konsistent und ohne dogmatische Erweiterung wieder. „Zeichen“ ist im Kontext die geeignete Hauptlesart für ܬܘܩܢܐ; die Fußnote dokumentiert angemessen die mögliche Bedeutungskomponente einer festgesetzten Ordnung. „Bedrängnisse“, „Not“ und „erwachen“ sind sachgerecht.
