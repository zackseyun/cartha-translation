  rationale: Natürliches modernes Deutsch; vermeidet das bei Städten etwas technische „prosperieren“ und legt die Art ihres Wohlergehens nicht näher fest.
theological_decisions:
- issue: Charakter des göttlichen Handelns
  choice: Vergeltung
  alternative: Strafe
  rationale: „Vergeltung“ bewahrt den Zusammenhang zwischen vorausgehendem Verhalten und göttlicher Antwort, ohne das Spektrum vorschnell auf eine bestimmte Strafvorstellung zu verengen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Die hypothetische Formulierung „je sagen sollten“ bewahrt den konditionalen Charakter des Satzes.
