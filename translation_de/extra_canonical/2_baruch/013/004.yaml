    ܠܡܘܒܠܢܝ ܒܒܟܝܐ. ܠܐܘ ܬܘܒ

    ܐܬܝܬ ܡܕܒܪܐ ܘܐܡ̣ܪܬ

    ܒܡܕܐ ܒܬܫܥ̈ܝܬܗ̇.

    ܟܐܒܐ ܗܘܘ ܠܝ ܪ

    ܠܥܠܡ. ܗܟܢܐ ܕܝܢ ܗܘܐ

    ܡܙܥܙ ܕܠܐ ܡܣܬܝܟ.

    ܘܐܢܫܐ ܕܒܝܬ ܓܘܣܝ

    ܀ ܡܘܫܚܬܐ ܕܐܝܬ ܗܘܐ

    ܡܕܥܝܗܝܢ ܘܐܘܦܢ ܚܕ̈ܕܐ.

    ܡܢܗ ܗܘܘ ܢܝܕ ܟܠ

    ܗܠܝܢ. ܐܘ ܠܡܢܘ ܢܫܟܘܚ

    ܟܠ ܡܕܡ ܕܕ̈ܝܩܢ. ܐܘ

    ܡܢܘ ܐܡܪ ܣܓܝܐܘ

    ܚܟܡܗ ܐܟܡܐ ܕܠܐ

    ܡܐ̈ܙܐ ܘܕ̈ܢܦܐ ܗܘܐ

    ܕܡܢܝܢ ܟܐܢܐ ܟܢܝܫܘ.

    ܠܐ ܓܝܪ ܝܕܥܘܗ̇ ܠܥܡܬܐ

