lexical_decisions:
- source_word: ܡ̈ܕܝܢܬܐ
  choice: die Städte
  rationale: Direkte und natürliche Wiedergabe des syrischen Plurals.
- source_word: ܐܠܗܐ ܚܝܠܬܢܐ
  choice: der mächtige Gott
  rationale: Bewahrt die ausdrückliche Bezeichnung Gottes als mächtig, ohne sie dogmatisch zu erweitern.
- source_word: ܦܘܪܥܢܐ
  choice: Vergeltung
  rationale: Gibt den Sinn von Lohn, Heimzahlung oder strafender Vergeltung wieder und bewahrt den gerichtlichen Ton.
- source_word: prosper (durch die konsultierte englische Fassung gestützt)
