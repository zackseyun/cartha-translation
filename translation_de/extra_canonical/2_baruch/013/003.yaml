  text: Because you were shaken by what has happened to Zion, therefore you will surely be preserved until the consummation of the times, that you may be a testimony.
translation:
  language: de
  text: Weil dich das erschüttert hat, was Zion widerfahren ist, wirst du deshalb gewiss bis zur Vollendung der Zeiten bewahrt werden, damit du als Zeugnis dienst.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܬܙܝܥ
  choice: erschüttert
  rationale: Das Verb bezeichnet ein starkes inneres Bewegt- oder Erschüttertwerden; „erschüttert“ gibt hier die Reaktion Baruchs auf Zions Schicksal natürlich und präzise wieder.
- source_word: ܨܗܝܘܢ
  choice: Zion
  rationale: Der traditionelle Eigenname bleibt erhalten und bezeichnet im Kontext Jerusalem in seiner religiösen und gemeinschaftlichen Bedeutung.
- source_word: ܡܬܢܛܪ
  choice: bewahrt werden
  rationale: Die passive Form wahrt den Gedanken, dass Baruch durch göttliches Handeln erhalten beziehungsweise beschützt wird.
- source_word: ܫܘܠܡܐ ܕܙܒ̈ܢܐ
  choice: Vollendung der Zeiten
  rationale: Diese Wiedergabe erhält die zeitlich-eschatologische Offenheit der Wendung, ohne sie auf ein bestimmtes Lehrsystem festzulegen.
- source_word: ܣܗܕܘܬܐ
  choice: Zeugnis
  rationale: Das Abstraktum wird nicht zu „Zeuge“ personalisiert; „als Zeugnis dienen“ ist im Deutschen idiomatisch und bewahrt den sachlichen Ausdruck.
theological_decisions:
- issue: Art und Zeitpunkt der endzeitlichen Bewahrung Baruchs
  choice: „bis zur Vollendung der Zeiten bewahrt werden“
  alternative: „für das Ende der Zeiten am Leben erhalten werden“
  rationale: Die gewählte Formulierung lässt offen, auf welche Weise und in welchem Zustand Baruch bewahrt wird, und vermeidet eine nicht ausdrücklich belegte Festlegung auf ununterbrochenes irdisches Weiterleben.
- issue: Funktion Baruchs als Zeugnis
  choice: „damit du als Zeugnis dienst“
  alternative: „damit du ein Zeuge bist“
  rationale: Die abstrakte Aussage „Zeugnis“ bleibt erhalten; zugleich macht „dienst“ die deutsche Formulierung verständlich, ohne den Text auf die Rolle eines menschlichen Augenzeugen zu verengen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die traditionelle Wendung „Vollendung der Zeiten“ bewahrt den feierlichen und eschatologischen Ton; ansonsten wird unnötig altertümliche Sprache vermieden.
