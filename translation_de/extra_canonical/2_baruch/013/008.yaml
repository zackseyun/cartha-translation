translation:
  language: de
  text: 'Ich sage euch: »Ihr, die ihr geklärten Wein getrunken habt, werdet auch seinen Bodensatz trinken. Denn das Gericht des Höchsten kennt kein Ansehen der Person.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Ältere Wiedergabe: »Du sollst zu ihnen sagen«. Die syrische Lesung spricht jedoch eher für »Ich sage euch«; der Satz wird außerdem teils noch dem vorhergehenden Vers zugerechnet.'
    reason: Dokumentiert die überlieferte Übersetzungsalternative und die schwankende Versabgrenzung, ohne sie in den Haupttext einzutragen.
lexical_decisions:
- source_word: ܚܡܪܐ ܡܕܝܠܢܐ
  choice: geklärten Wein
  rationale: Die Wendung bezeichnet hier offenbar von Trübstoffen abgetrennten beziehungsweise gefilterten Wein; „geklärt“ ist im Deutschen natürlich und erhält den Gegensatz zum Bodensatz.
- source_word: ܕܠܡܐ
  choice: seinen Bodensatz
  rationale: Der Zusammenhang stellt den klaren Wein seinem zurückbleibenden Satz gegenüber; „Bodensatz“ gibt das Bild verständlich und prägnant wieder.
- source_word: ܕܝܢܐ … ܕܠܐ ܡܣܒܪ ܒܐܦ̈ܐ
  choice: das Gericht … kennt kein Ansehen der Person
  rationale: Die semitische Wendung „das Gesicht/die Person ansehen“ bezeichnet Parteilichkeit. Die etablierte deutsche Formulierung bewahrt den gerichtlichen und theologischen Sinn.
- source_word: ܡܪܝܡܐ / sinngemäß im überlieferten Textzusammenhang
  choice: des Höchsten
  rationale: Der Gottesname beziehungsweise Hoheitstitel wird substantivisch und ohne konfessionelle Zusätze wiedergegeben.
theological_decisions:
- issue: Unparteilichkeit des göttlichen Gerichts
  choice: „das Gericht des Höchsten kennt kein Ansehen der Person“
  alternative: „der Höchste urteilt ohne Parteilichkeit“
  rationale: Die gewählte Fassung erhält die personifizierende Aussage über das Gericht und löst die theologische Spannung nicht in eine bloße Erklärung auf.
- issue: Sprecher- und Adressatenwechsel am Versanfang
  choice: „Ich sage euch“
  alternative: „Du sollst zu ihnen sagen“
  rationale: Die kontrollierte syrische Lesung wird als erste Person mit pluralischem Adressaten verstanden. Die ältere alternative Wiedergabe verändert die Sprecherkonstellation und wird daher nur in der Fußnote dokumentiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die direkte Anrede bleibt markant; das Weinbild wird nicht paraphrasiert. „Kein Ansehen der Person“ ist eine geläufige, leicht gehobene Gerichtsformel und passt zum apokalyptischen Register.
