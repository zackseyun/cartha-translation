  text: And a voice came from on high and said to me, “Stand on your feet, Baruch, and hear the word of the Mighty One.”
translation:
  language: de
  text: 'Da kam eine Stimme aus der Höhe und sagte zu mir: »Stell dich auf die Füße, Baruch, und höre das Wort des mächtigen Gottes.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܩܠܐ
  choice: eine Stimme
  rationale: Entspricht unmittelbar dem syrischen Substantiv und lässt die Identität des Sprechers, wie im Ausgangstext, unausgesprochen.
- source_word: ܡܢ ܡܪܘܡܐ
  choice: aus der Höhe
  rationale: Gibt die räumliche beziehungsweise himmlische Herkunft natürlich wieder, ohne sie deutend zu erweitern.
- source_word: ܩܘܡ ܥܠ ܪ̈ܓܠܝܟ
  choice: Stell dich auf deine Füße
  rationale: Bewahrt das konkrete Bild und den imperativischen Nachdruck des Syrischen.
- source_word: ܡܠܬܐ ܕܐܠܗܐ ܚܝܠܬܢܐ
  choice: das Wort des Mächtigen
  rationale: Der Ausdruck bezeichnet wörtlich das Wort des mächtigen Gottes; die substantivierte Wiedergabe „des Mächtigen“ wahrt den göttlichen Titel knapp und entspricht der im konsultierten POB-Text gewählten Präzisierung.
theological_decisions:
- issue: Wiedergabe des göttlichen Epithetons ܐܠܗܐ ܚܝܠܬܢܐ
  choice: des Mächtigen
  alternative: des mächtigen Gottes
  rationale: „Des Mächtigen“ erhält den Charakter eines göttlichen Titels und vermeidet eine unnötig erklärende Auflösung; dass Gott gemeint ist, bleibt im Kontext eindeutig.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die direkte Rede ist klar und knapp gehalten; das konkrete semitische Bild „auf deine Füße“ wurde bewusst bewahrt.
