  text: You shall say to them, and to those like them, ‘You who have seen this calamity and this retribution that has come upon you and upon your city at its appointed time—
translation:
  language: de
  text: 'Du sollst zu ihnen und zu ihresgleichen sagen: »Ihr, die ihr dieses Unheil und diese Vergeltung gesehen habt, die zu ihrer festgesetzten Zeit über euch und eure Stadt[a] gekommen ist —'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »euer Volk«.'
    reason: Die Textüberlieferung bzw. Segmentierung lässt neben »Stadt« auch die Wiedergabe »Volk« zu.
lexical_decisions:
- source_word: ܒܝܫܬܐ (bīštā)
  choice: Unheil
  rationale: Bezeichnet hier das erlebte Verderben bzw. die Katastrophe; »Unheil« ist im Deutschen würdig, verständlich und lässt den genauen Charakter des Ereignisses offen.
- source_word: ܦܘܪܥܢܐ (purʿānā)
  choice: Vergeltung
  rationale: Gibt den Gedanken einer erwidernden, richtenden Konsequenz wieder, ohne über den Text hinaus eine bestimmte dogmatische Deutung festzulegen.
- source_word: ܒܙܒܢܗ (b-zabneh)
  choice: zur festgesetzten Zeit
  rationale: Bewahrt den Gedanken eines bestimmten bzw. zugeordneten Zeitpunkts; die Form ist idiomatischer als eine wörtliche Wiedergabe mit »in ihrer Zeit«.
- source_word: ܡܕܝܢܬܟܘܢ (madīntḵōn), nach der überlieferten Lesart
  choice: eure Stadt
  rationale: Entspricht der naheliegenden konkreten Lesart im Zusammenhang mit der heimgesuchten Stadt; eine abweichende Deutung wird in der Fußnote genannt.
theological_decisions:
- issue: Vergeltung als theologische Deutung des Unheils
  choice: Vergeltung
  alternative: Strafe
  rationale: »Vergeltung« wahrt die im syrischen Ausdruck liegende gerichtliche Reaktion, ohne ausdrücklich festzulegen, dass ausschließlich eine Strafmaßnahme im engeren Sinn gemeint ist.
- issue: Bezug des singularischen Relativsatzes
  choice: Der Relativsatz bezieht sich grammatisch auf »diese Vergeltung«.
  alternative: Gemeinsamer Bezug auf »dieses Unheil und diese Vergeltung«
  rationale: Die singularische Form der maßgeblichen Überlieferung wird sichtbar gehalten. Eine pluralische deutsche Konstruktion würde die grammatische Spannung einebnen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Anredeform »Ihr, die ihr …« bewahrt den feierlichen direkten Ruf, ohne altertümliche Wörter zu verwenden. Der abschließende Gedankenstrich zeigt an, dass der Satz im folgenden Vers weitergeführt wird.
