  text: But now, you nations and peoples, you are guilty, because at all times you have trodden the earth and dealt with creation without righteousness.
translation:
  language: de
  text: Nun aber seid ihr, Völker und Nationen, schuldig; denn die ganze Zeit hindurch habt ihr die Erde zertreten und die Schöpfung ungerecht behandelt.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܡ̈ܡܐ / ܐܡ̈ܘܬܐ
  choice: Völker und Nationen
  rationale: Die beiden kollektiven Bezeichnungen werden unterscheidbar und zugleich in natürlichem modernem Deutsch wiedergegeben.
- source_word: ܕܝ̈ܩܢ (im vorliegenden Seitenkontext textkritisch unsicher überliefert)
  choice: ungerecht
  rationale: Die Wiedergabe folgt dem durch die kontrollierte Kapitelüberlieferung und die auditierte Konsultationsschicht bezeugten Gegensatz zur Gerechtigkeit, ohne ihn konfessionell auszudeuten.
- source_word: ܒܟܠ ܙܒܢ
  choice: die ganze Zeit hindurch
  rationale: Gibt den zeitlichen Gesamtverlauf idiomatisch wieder und vermeidet das im Deutschen missverständliche „zu allen Zeiten“.
theological_decisions:
- issue: Reichweite der Anklage gegen die Völker
  choice: Die Aussage bleibt als direkte kollektive Schuldzuweisung stehen.
  alternative: Die Schuld individualisieren oder auf bestimmte Herrscher beschränken.
  rationale: Der Text richtet die Anklage ausdrücklich an Völker und Nationen; eine Einschränkung würde die theologische Spannung des Wortlauts abschwächen.
- issue: Umgang mit der Schöpfung
  choice: „die Schöpfung ungerecht behandelt“
  alternative: „die Schöpfung missbraucht“
  rationale: „Ungerecht behandelt“ bewahrt den Gerechtigkeitsbegriff und legt die konkrete Art des Fehlverhaltens nicht enger fest als die Quelle.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit direkter Anrede. Der Parallelismus „Völker und Nationen“ sowie die bildhafte Härte von „die Erde zertreten“ bleiben erhalten. Wegen der beschädigten beziehungsweise überlappenden Seitenüberlieferung wurde die englische POB-Fassung nur als kontrollierende Konsultationsschicht verwendet.
