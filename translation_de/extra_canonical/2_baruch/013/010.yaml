  text: Darum wurden sie damals gezüchtigt, damit sie geheiligt würden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܪܕܝܘ (rekonstruierte Verslesart; im bereitgestellten Seiten-OCR nicht sicher abgrenzbar)
  choice: wurden … gezüchtigt
  rationale: Gibt eine erzieherische beziehungsweise strafende Zurechtweisung wieder, ohne sie zu bloßer Belehrung oder endgültiger Verurteilung abzuschwächen.
- source_word: ܢܬܩܕܫܘܢ (rekonstruierte Verslesart; im bereitgestellten Seiten-OCR nicht sicher abgrenzbar)
  choice: damit sie geheiligt würden
  rationale: Bewahrt den passiven theologischen Ausdruck und den Zweckzusammenhang der Aussage.
theological_decisions:
- issue: Verhältnis von Züchtigung und Heiligung
  choice: Die Züchtigung wird als auf Heiligung gerichtetes Geschehen formuliert.
  alternative: „… und wurden dadurch geheiligt“
  rationale: Die Zweckkonstruktion bewahrt die Spannung zwischen beabsichtigtem Ziel und dessen Verwirklichung, statt einen bereits vollendeten Erfolg zu behaupten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gezüchtigt“ ist bewusst kräftiger als „zurechtgewiesen“ und passt zum gerichtlichen Kontext; die passive Form „geheiligt würden“ vermeidet eine ausdrückliche Festlegung darauf, wer handelt. Da der angegebene syrische Kapitelkorpus stark fehlerhaft erkannt und Vers 10 darin nicht zuverlässig isolierbar ist, folgt der Wortlaut der durch die englische POB bezeugten, quellengeprüften Versabgrenzung.
