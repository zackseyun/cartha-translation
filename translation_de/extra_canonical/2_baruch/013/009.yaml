  source_fidelity: 'Der Entwurf gibt die maßgeblichen Elemente der syrischen Aussage zuverlässig wieder: den zeitlichen Bezug („früher“), das Nichtverschonen der eigenen Söhne, die Zufügung von Leid, den Vergleich mit seinen Feinden sowie die Begründung durch ihr Sündigen. „Wie seine Feinde“ bewahrt den Vergleich und das possessive Suffix, ohne daraus eine Statusgleichsetzung zu machen.'
  naturalness: „Darum verschonte er früher selbst seine eigenen Söhne nicht, sondern ließ sie leiden wie seine Feinde, weil sie sündigten“ ist modernes, verständliches Standarddeutsch mit angemessen würdigem Register. Die Stellung von „früher“ ist idiomatisch; „ließ sie leiden“ ist eine natürliche, semantisch nicht überpräzisierende Wiedergabe.
  terminology: „verschonte“, „eigene Söhne“, „wie seine Feinde“ und „sündigten“ sind treffend und terminologisch konsistent. Die doppelte Hervorhebung in „selbst seine eigenen Söhne“ entspricht der emphatischen Aussage und ist im Deutschen noch gut tragbar.
