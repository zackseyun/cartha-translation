translation:
  language: de
  text: Darum verschonte er früher selbst seine eigenen Söhne nicht, sondern ließ sie leiden wie seine Feinde, weil sie sündigten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܣ / entsprechende syrische Wendung im Verskontext
  choice: verschonte … nicht
  rationale: Gibt die Aussage des Nicht-Schonens natürlich und zugleich eng am syrischen Sinn wieder.
- source_word: ܒܢ̈ܘܗܝ / entsprechende Form mit Possessivsuffix
  choice: seine eigenen Söhne
  rationale: Bewahrt sowohl das Possessivverhältnis als auch die hervorgehobene Aussage, dass selbst die eigenen Söhne nicht ausgenommen wurden.
- source_word: ܐܝܟ ܒܥܠܕܒܒ̈ܘܗܝ / entsprechende Vergleichsform
  choice: wie seine Feinde
  rationale: Das Possessivsuffix wird ausdrücklich wiedergegeben; der Vergleich wird nicht zu einer Gleichsetzung verschärft.
- source_word: ܐܠܨ / entsprechende Leidens- bzw. Bedrängnisform
  choice: ließ sie leiden
  rationale: Natürliches modernes Deutsch, das die Verursachung von Bedrängnis ausdrückt, ohne eine im Kontext nicht näher bestimmte Art der Strafe festzulegen.
theological_decisions:
- issue: Bezug der Bezeichnung „Söhne“
  choice: seine eigenen Söhne
  alternative: die Söhne
  rationale: Die possessive und emphatische Nuance der syrischen Überlieferung wird erhalten, ohne die Identität der Söhne über den Text hinaus zu bestimmen.
- issue: Verhältnis zu den Feinden
  choice: wie seine Feinde
  alternative: als seine Feinde
  rationale: „Wie“ bewahrt den Vergleich und vermeidet die stärkere Deutung, sie seien ihrem Status nach tatsächlich Feinde geworden.
- issue: Begründung des Leidens
  choice: weil sie sündigten
  alternative: wegen ihrer Sünden
  rationale: Die kausale Aussage bleibt ausdrücklich und persönlich formuliert; eine weitergehende Lehre über Art oder Vererbung von Schuld wird nicht eingetragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstruktur bleibt knapp und argumentativ. „Früher“ steht nahe beim Prädikat und wahrt den zeitlichen Kontrast; „ließ sie leiden“ vermeidet unnötig altertümliche oder übermäßig technische Ausdrucksweise.
