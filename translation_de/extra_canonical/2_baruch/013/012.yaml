  text: For at all times I did good to you, but at all times you denied my kindness.
translation:
  language: de
  text: Denn jederzeit habe ich euch Gutes erwiesen, doch jederzeit habt ihr meine Güte abgestritten.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܟܠ ܙܒܢ
  choice: zu jeder Zeit
  rationale: Gibt die wiederholte Zeitangabe formal und zugleich idiomatisch wieder.
- source_word: ܛܒܬܐ / kindness (durch die Kontrollüberlieferung gestützter Sinn)
  choice: meine Güte
  rationale: Bewahrt den persönlichen Wohltat- bzw. Gütebezug; „Freundlichkeit“ wäre hier schwächer, „Gnade“ stärker theologisch festgelegt.
- source_word: ܟܦܪ / deny (durch die Kontrollüberlieferung gestützter Sinn)
  choice: verleugnet
  rationale: Drückt bewusste Zurückweisung aus und erhält die Spannung zwischen erwiesener Güte und der Reaktion darauf.
theological_decisions:
- issue: Art der göttlichen Güte
  choice: meine Güte
  alternative: meine Gnade
  rationale: „Güte“ lässt offen, ob konkrete Wohltaten oder eine allgemeine gnädige Haltung gemeint sind, und vermeidet eine konfessionell aufgeladene Präzisierung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die parallele Wiederholung von „zu jeder Zeit“ bleibt als rhetorischer Kontrast erhalten. Der vorgelegte syrische Seitenausschnitt ist an der Versgrenze beschädigt bzw. schwer segmentierbar; die Formulierung folgt daher dem aus der Kontrollüberlieferung gesicherten Verssinn.
