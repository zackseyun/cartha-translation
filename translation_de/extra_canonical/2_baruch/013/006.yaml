translation:
  language: de
  text: Darum wurden sie damals gezüchtigt, damit ihnen vergeben würde.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: damit sie verschont würden; möglicherweise auch: damit sie übrig blieben.'
    reason: Das zugrunde liegende syrische Verb kann Vergebung, Verschonung oder das Zurückbleiben bezeichnen.
lexical_decisions:
- source_word: ܐܬܪܕܝܘ
  choice: wurden … gezüchtigt
  rationale: Das passive Perfekt bezeichnet eine bereits erfolgte disziplinierende Zurechtweisung. „Gezüchtigt“ bewahrt sowohl den Ernst als auch den erzieherischen Sinn des Ausdrucks.
- source_word: ܗܝܕܝܢ
  choice: damals
  rationale: Gibt die zeitliche Bestimmung knapp und idiomatisch wieder.
- source_word: ܢܫܬܒܩܘܢ
  choice: ihnen vergeben würde
  rationale: Das passive Verb kann je nach Zusammenhang „Vergebung finden“, „verschont werden“ oder „übrig bleiben“ bedeuten. Im Zusammenhang von Züchtigung ist „vergeben“ die naheliegende Hauptlesart.
theological_decisions:
- issue: Zweck und Ergebnis der göttlichen Züchtigung
  choice: damit ihnen vergeben würde
  alternative: damit sie verschont würden / übrig blieben
  rationale: Die Zweckkonstruktion wird beibehalten, ohne die Spannung zwischen Züchtigung und anschließender Vergebung aufzulösen. Die lexikalisch mögliche Lesart „verschont werden“ wird in der Fußnote bewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gezüchtigt“ ist bewusst ernster als „zurechtgewiesen“ und gibt den disziplinierenden Charakter wieder, ohne eine bestimmte konfessionelle Deutung einzuführen.
