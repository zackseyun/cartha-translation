  source_fidelity: 'Die Übersetzung gibt die im Audit ausgewiesene Abfolge und Syntax zutreffend wieder: die bereits erfolgte disziplinierende Züchtigung, die Zeitangabe „damals“ und den Zweck „damit ihnen vergeben würde“. Sie fügt weder „die Nationen“ noch andere nicht im Vers enthaltene Bezüge ein. Die Fußnote bewahrt die beim syrischen Verb bestehende semantische Spannweite, ohne die Hauptübersetzung zu entkräften.'
  naturalness: „Darum wurden sie damals gezüchtigt, damit ihnen vergeben würde“ ist verständliches, würdiges modernes Standarddeutsch. Das unpersönliche Passiv „ihnen vergeben würde“ ist grammatisch korrekt und bildet die passive Vorlage angemessen ab. „Gezüchtigt“ ist hier im religiös-literarischen Register passend.
  terminology: „Gezüchtigt“ vermittelt den erzieherisch-disziplinierenden, zugleich ernsten Charakter besser als ein bloßes „zurechtgewiesen“. „Vergeben“ ist im gegebenen Zusammenhang die sachgerechte Hauptbedeutung; „verschont“ und „übrig blieben“ werden vorsichtig als Alternativen kenntlich gemacht.
