  text: 'And it happened after these things that I, Baruch, was standing on the bank of the river, and a voice came from the height and said to me:'
translation:
  language: de
  text: 'Nach diesen Ereignissen geschah es, dass ich, Baruch, am Ufer des Flusses[a] stand. Da kam eine Stimme aus der Höhe und sagte zu mir:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Eine abweichende Kontrollüberlieferung liest: »auf dem Berg Zion«.'
    reason: Textvariante zum im primären syrischen Text bezeugten Flussufer.
lexical_decisions:
- source_word: ܨܝܕܐ ܕܢܗܪܐ
  choice: am Ufer des Flusses
  rationale: Die Wendung bezeichnet im primären syrischen Text den Ort am Fluss. »Ufer« ist im Deutschen natürlicher und genauer als das wörtlichere »Seite des Flusses«.
- source_word: ܡܢ ܡܪܘܡܐ
  choice: aus der Höhe
  rationale: Die räumliche, zugleich feierliche Formulierung des Syrischen bleibt erhalten, ohne sie ausdrücklich als »Himmel« zu deuten.
- source_word: ܗܘܐ ܩܠܐ ܐܙܐ
  choice: Da kam eine Stimme
  rationale: Die Wiedergabe erhält die im Syrischen ausgedrückte Bewegung der Stimme vom erhöhten Ort her und klingt zugleich in modernem Deutsch verständlich.
theological_decisions:
- issue: Ort der Offenbarung Baruchs
  choice: Baruch steht am Ufer des Flusses.
  alternative: Baruch steht auf dem Berg Zion.
  rationale: Der primäre syrische Text liest eindeutig »am Ufer des Flusses«. Die abweichende Kontrollüberlieferung wird nicht in den Haupttext eingetragen, sondern als Textvariante in der Fußnote ausgewiesen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Geschehensformel wird natürlich wiedergegeben; »aus der Höhe« bewahrt die feierliche Unbestimmtheit des Ausgangsortes der Stimme.
