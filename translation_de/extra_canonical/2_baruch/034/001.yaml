  yaml_path: translation/extra_canonical/2_baruch/034/001.yaml
  text: Then I lifted up my eyes and wept, and I said at that time, “Far be it from me that I should be silent toward you or forget you. But only as far as the house of the tombs of my fathers, in affliction and in the distress of lamentation cry aloud, so that I may not be forgotten before you and afterward. And these things I have declared to you for your remembrance.”
translation:
  language: de
  text: 'Dann erhob ich meine Augen und weinte. Zu jener Zeit sagte ich: »Fern sei es von mir, euch gegenüber zu schweigen oder euch zu vergessen. Geht aber nur bis zum Gräberhaus der Gräber meiner Väter[a] und ruft in Bedrängnis und in der Not des Klagens laut, damit ich vor euch und auch danach nicht vergessen werde.[b] Dies habe ich euch zu eurem Gedenken dargelegt.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht eine auffällige Doppelung: »Gräberhaus der Gräber«. Gemeint sein kann die Grabstätte seiner Väter.'
    reason: Die konkrete, aber im Deutschen ungewöhnliche Begräbnisformel soll sichtbar bleiben; die Fußnote bietet die geglättete Sinnmöglichkeit.
  - marker: b
    text: Die Wendung »vor euch und auch danach« ist im Syrischen knapp und schwer zu deuten; möglich ist auch ein zeitlicher Sinn wie »bei euch, jetzt und später«.
    reason: Die syntaktische und zeitliche Beziehung des Ausdrucks ist unsicher und darf nicht stillschweigend vereindeutigt werden.
lexical_decisions:
- source_word: ܚܣ ܠܝ
  choice: Fern sei es von mir
  rationale: Die syrische Wendung drückt hier entschiedene Abwehr aus, nicht eine Bitte um Erbarmen. Die feierliche deutsche Redewendung bewahrt diese Kraft.
- source_word: ܕܐܫܬܘܩܘܟܘܢ
  choice: euch gegenüber zu schweigen
  rationale: Die Form gehört zum Verb »schweigen«. »Euch gegenüber« erhält den zwischenmenschlichen Bezug, ohne ihn als Verlassen oder Aufgeben auszudeuten.
- source_word: ܐܘ ܕܐܢܫܝܢ ܡܢܟܘܢ
  choice: oder jemanden von euch zu vergessen
  rationale: Die Form wird im unmittelbaren Zusammenhang am natürlichsten als »vergessen« verstanden; »jemanden von euch« gibt den partitiven Ausdruck ausdrücklich wieder.
- source_word: ܠܒܝܬ ܩܘ̣ܒܘܪ ܩܘ̈ܒ̣ܪܐ ܕܐܒܗܝ
  choice: bis zum Gräberhaus der Gräber meiner Väter
  rationale: Die auffällige Verdoppelung der Begräbnisbegriffe wird bewusst erhalten, statt sie stillschweigend zu »Grabstätte« oder »Friedhof« zu glätten.
- source_word: ܡܢ ܚܒܠܬܐ ܒܥܝܩܘܬ ܝܠܠܐ ܨܘܝܘ
  choice: in Bedrängnis und in der Not des Klagens laut rufen
  rationale: Die gehäuften Leidensbegriffe und der anschließende Imperativ werden im Deutschen als kumulative Klagesprache wiedergegeben.
- source_word: ܥܘܗܕܢܘܢ
  choice: zu eurem Gedenken
  rationale: Das Wortfeld bezeichnet Erinnerung oder Gedächtnis. Die substantivische Wiedergabe bewahrt die mögliche memoriale Nuance und legt den genauen Bezug nicht stärker fest als der Text.
theological_decisions:
- issue: Wer erinnert oder vergessen wird
  choice: Baruch bittet darum, bei seinen Hörern nicht vergessen zu werden; zugleich bezeichnet der Schlusssatz das Gesagte als Hilfe zu ihrem Gedenken.
  alternative: Den Schlusssatz als ausdrücklichen Auftrag »Erinnert euch an diese Dinge« wiederzugeben.
  rationale: Die syrische Formulierung kreist um Erinnerung, lässt aber die genaue syntaktische Zuordnung des letzten Ausdrucks nicht völlig eindeutig erkennen. Die Übersetzung wahrt diese Spannung.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Rede bleibt feierlich und klagend, vermeidet jedoch altertümliche Verbformen. Auffällige Wiederholungen und echte syntaktische Unklarheiten des Syrischen werden im Haupttext beziehungsweise in Fußnoten bewahrt.
