  yaml_path: translation/extra_canonical/2_baruch/070/004.yaml
  text: Many will be delivered into the hands of the few. Those who were nothing will rule over the strong, the poor will have more than the rich, and the impious will exalt themselves over the brave.
translation:
  language: de
  text: Viele werden in die Hände weniger ausgeliefert werden. Die, die nichts waren,[a] werden über die Starken herrschen; die Armen werden mehr besitzen als die Reichen, und die Gottlosen werden sich über die Tapferen erheben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die als unbedeutend galten“.'
    reason: Die wörtliche Wendung „die nichts waren“ kann gesellschaftliche Bedeutungslosigkeit bezeichnen.
lexical_decisions:
- source_word: ܣ̈ܓܝܐܐ / ܙܥܘܪ̈ܐ (im Verszusammenhang)
  choice: Viele / wenige
  rationale: Bewahrt den zugespitzten Gegensatz der syrischen Aussage in natürlichem Deutsch.
- source_word: ܐܝܠܝܢ ܕܠܐ ܗܘܘ ܡܕܡ
  choice: die, die nichts waren
  rationale: Gibt die semitische Wendung eng wieder, ohne sie umgangssprachlich als „Niemande“ zu verengen.
- source_word: ܥܬܝܪ̈ܐ / ܡܣܟܢ̈ܐ (im Verszusammenhang)
  choice: die Reichen / die Armen
  rationale: Die substantivierten Adjektive bilden den sozialen Gegensatz klar und würdig ab.
- source_word: ܪ̈ܫܝܥܐ
  choice: die Gottlosen
  rationale: Bezeichnet moralisch-religiöse Frevler; „Gottlose“ wahrt diesen Bedeutungsumfang besser als das allgemeinere „Böse“.
- source_word: ܓܢܒܪ̈ܐ
  choice: die Tapferen
  rationale: Der Ausdruck kann starke oder heldenhafte Männer bezeichnen; „Tapferen“ passt zum Kontrast mit den sich über sie erhebenden Gottlosen.
theological_decisions:
- issue: Bedeutung von „die nichts waren“
  choice: Wörtliche, offene Formulierung im Haupttext
  alternative: „die als unbedeutend galten“ oder „Niemande“
  rationale: Der Text kann niedrigen gesellschaftlichen Rang oder völlige Bedeutungslosigkeit ausdrücken. Die Übersetzung wahrt diese Offenheit, statt ausdrücklich eine bloße Fremdwahrnehmung einzutragen.
- issue: Moralisch-religiöse Kennzeichnung der sich Erhebenden
  choice: „die Gottlosen“
  alternative: „die Frevler“ oder „die Bösen“
  rationale: Die Wahl erhält die religiös-moralische Spannung des apokalyptischen Zusammenhangs, ohne eine bestimmte konfessionelle Deutung hinzuzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit apokalyptischer Zuspitzung. Die parallelen sozialen und moralischen Umkehrungen bleiben erhalten; das Futur unterstreicht den prophetischen Charakter.
