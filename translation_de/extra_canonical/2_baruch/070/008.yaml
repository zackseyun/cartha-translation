  text: And whoever escapes from the war will die in the earthquake, and whoever escapes from the earthquake will be burned by fire, and whoever escapes from the fire will perish by famine.
translation:
  language: de
  text: Und wer dem Krieg entkommt, wird im Erdbeben sterben; wer dem Erdbeben entkommt, wird vom Feuer verbrannt werden; und wer dem Feuer entkommt, wird durch Hunger umkommen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܫܬܘܙܒ
  choice: entkommt
  rationale: Gibt das wiederkehrende syrische Verb für Entrinnen bzw. Gerettetwerden in diesem Gerichtszusammenhang natürlich wieder, ohne eine theologische Rettungsbedeutung aufzudrängen.
- source_word: ܩܪܒܐ
  choice: Krieg
  rationale: Die konkrete Katastrophenfolge verlangt hier die übliche Bedeutung „Krieg“.
- source_word: ܙܘܥܐ
  choice: Erdbeben
  rationale: Bezeichnet in der Abfolge eine konkrete Erderschütterung.
- source_word: ܢܘܪܐ
  choice: Feuer
  rationale: Die direkte und sachlich passende Wiedergabe.
- source_word: ܟܦܢܐ
  choice: Hunger
  rationale: „Hunger“ ist im modernen Deutsch natürlicher als „Hungersnot“ und bewahrt zugleich die Todesursache der Vorlage.
theological_decisions:
- issue: Bedeutung des wiederholten Entrinnens
  choice: entkommt
  alternative: gerettet wird
  rationale: „Entkommt“ erhält die rein vorläufige Flucht aus jeder Katastrophe und vermeidet den Eindruck endgültiger heilsgeschichtlicher Rettung.
translation_notes:
  register: Dignifiziertes, gut verständliches Standarddeutsch. Die dreigliedrige Wiederholung und die unerbittliche Steigerung der Katastrophenfolge bleiben erhalten.
