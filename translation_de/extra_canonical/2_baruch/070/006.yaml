  yaml_path: translation/extra_canonical/2_baruch/070/006.yaml
  text: When those things that were foretold have come to pass, confusion will fall upon all people. Some will fall in war, some will perish in tribulations, and some will be destroyed by their own.
translation:
  language: de
  text: Wenn das eintrifft, was vorhergesagt wurde, wird Verwirrung über alle Menschen kommen. Einige werden im Krieg fallen, andere in Bedrängnissen umkommen, und wieder andere werden von den Ihren vernichtet werden.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: »von ihren Eigenen«; gemeint sein können Angehörige oder Menschen aus dem eigenen Kreis.'
    reason: Die syrische Formulierung lässt offen, welche Art von Zugehörigkeit gemeint ist.
lexical_decisions:
- source_word: ܐܝܠܝܢ ܕܡܩܕ̈ܡܢ ܐܡܝܪ̈ܢ
  choice: was vorhergesagt wurde
  rationale: Die Wendung bezeichnet das zuvor Gesagte bzw. Angekündigte; „vorhergesagt“ gibt im Kontext den Zukunftsbezug natürlich wieder.
- source_word: ܒܙܒܘܪ̈ܐ
  choice: im Krieg
  rationale: Der Ausdruck verweist auf kriegerische Auseinandersetzungen; der deutsche Singular wird hier idiomatisch kollektiv gebraucht.
- source_word: ܒܐܘܠܨܢ̈ܐ
  choice: in Bedrängnissen
  rationale: „Bedrängnisse“ bewahrt den weiten Sinn von Not, Drangsal und äußerem Druck, ohne eine bestimmte Leidensform festzulegen.
- source_word: ܒܢܝ ܒܣܪܗܘܢ / eigene Zugehörige
  choice: von den Ihren
  rationale: Die knappe deutsche Form wahrt die Unbestimmtheit darüber, ob Angehörige, Volksgenossen oder andere Personen aus dem eigenen Kreis gemeint sind.
theological_decisions:
- issue: Identität derjenigen, die die letzte Gruppe vernichten
  choice: von den Ihren
  alternative: von ihren eigenen Leuten
  rationale: Der Text bestimmt den betreffenden eigenen Kreis nicht näher. Die Übersetzung bewahrt diese Offenheit, statt Familie, Volk oder politische Gruppe festzulegen.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die dreigliedrige Steigerung und die genuine Unbestimmtheit der Schlusswendung bleiben erhalten.
