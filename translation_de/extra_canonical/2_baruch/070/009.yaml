  yaml_path: translation/extra_canonical/2_baruch/070/009.yaml
  text: And it will happen that anyone who escapes and is delivered from all these aforementioned things—both those who conquered and those who were conquered—will be delivered into the hands of my servant, the Messiah.
translation:
  language: de
  text: 'Und es wird geschehen: Jeder, der all diesen zuvor genannten Dingen entkommt und gerettet wird – ob er zu den Siegern oder zu den Besiegten gehört –, wird in die Hände meines Dieners, des Messias, übergeben werden.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܕܡ ... ܕܐܡܝܪ̈ܢ
  choice: diesen zuvor genannten Ereignissen
  rationale: Die Wendung bezeichnet die zuvor erwähnten Geschehnisse; „Ereignisse“ ist im Deutschen in diesem Zusammenhang natürlicher als das wörtlichere „Dinge“ und bewahrt den Rückverweis.
- source_word: ܥܒܕܝ ܡܫܝܚܐ
  choice: meines Dieners, des Messias
  rationale: „Diener“ gibt das Besitzverhältnis wieder; „der Messias“ bleibt als Titel in Apposition stehen, ohne die theologische Beziehung weiter auszudeuten.
- source_word: ܒܐܝܕ̈ܝ
  choice: in die Hände ... ausgeliefert
  rationale: Die idiomatische deutsche Wendung bewahrt das Bild der Übergabe in die Gewalt beziehungsweise Verfügungsgewalt einer Person.
theological_decisions:
- issue: Verhältnis des Dieners zum Messias
  choice: „meines Dieners, des Messias“ als Apposition
  alternative: „meines messianischen Dieners“
  rationale: Die Apposition wahrt die Identifizierung im Text, ohne „Messias“ in ein bloßes Eigenschaftswort umzudeuten.
- issue: Einordnung von Siegern und Besiegten
  choice: „ob er zu den Siegern oder zu den Besiegten gehört“
  alternative: „sowohl die Sieger als auch die Besiegten“
  rationale: Diese Form verbindet beide Gruppen eindeutig mit dem vorausgehenden Singular „jeder“ und vermeidet die missverständliche Vorstellung, Sieger und Besiegte seien Teil der genannten Ereignisse.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der einleitende Zukunftssatz und das Passiv bewahren den feierlich-prophetischen Ton; die Parenthese macht die syntaktische Zuordnung der beiden Personengruppen verständlich.
