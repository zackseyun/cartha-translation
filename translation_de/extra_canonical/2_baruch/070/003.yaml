  text: They will hate one another and provoke one another to fight; the base will rule over the honorable, and the ignoble will be exalted over the illustrious.
translation:
  language: de
  text: Sie werden einander hassen und einander zum Kampf reizen. Die Niedrigen werden über die Angesehenen herrschen, und die Unbedeutenden werden über die Berühmten erhoben werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܣܢܘܢ
  choice: sie werden … hassen
  rationale: Gibt den wechselseitigen Hass direkt und in natürlichem modernem Deutsch wieder.
- source_word: ܢܓܪܓܘܢ
  choice: zum Kampf reizen
  rationale: Bewahrt den Gedanken des gegenseitigen Aufstachelns zu gewaltsamer Auseinandersetzung, ohne eine konkrete Form des Kampfes festzulegen.
- source_word: ܫܦ̈ܠܐ
  choice: die Niedrigen
  rationale: Bezeichnet Menschen von niedrigem Rang oder geringer gesellschaftlicher Stellung; die knappe substantivierte Form erhält den sozialen Gegensatz.
- source_word: ܡܝܩܪ̈ܐ
  choice: die Angesehenen
  rationale: Drückt Ehre und gesellschaftliches Ansehen aus, ohne moralische Vorzüglichkeit zu unterstellen.
- source_word: ܒܨܝܪ̈ܐ
  choice: die Unbedeutenden
  rationale: Gibt einen niedrigen Status beziehungsweise geringe Geltung wieder und vermeidet eine unnötig moralische Abwertung.
- source_word: ܡܫܡܗ̈ܐ
  choice: die Berühmten
  rationale: Entspricht dem Gedanken der namhaften, weithin bekannten Personen.
theological_decisions:
- issue: Wertung der gesellschaftlichen Umkehrung
  choice: Die Rangumkehrung wird als Teil der angekündigten Unordnung beschrieben.
  alternative: Die Niedrigen könnten als demütige oder moralisch geringe Menschen verstanden werden.
  rationale: Der parallele Gegensatz zwischen niedrigem und angesehenem beziehungsweise unbedeutendem und berühmtem Status spricht primär für gesellschaftliche Rangbezeichnungen; eine moralische oder geistliche Deutung wird nicht in den Text eingetragen.
translation_notes:
  register: Dignifiziertes, gut verständliches Standarddeutsch. Die parallele Struktur und das Futur der prophetischen Ankündigung bleiben erhalten. Der Semikolonbau der Konsultationsfassung wurde zugunsten zweier klarer deutscher Sätze gegliedert.
