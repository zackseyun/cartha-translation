lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܘܟܡ̈ܐ ܐܚܪ̈ܝܐ
  choice: die letzten schwarzen Wasser
  rationale: Bewahrt das wiederkehrende apokalyptische Bild und gibt den kulminierenden Sinn von »die letzten« wieder, ohne die Farbe metaphorisch abzuschwächen.
- source_word: ܦܘܫܩܐ
  choice: Deutung
  rationale: Passt zu einer erklärenden Auslegung der zuvor geschauten symbolischen Wasser und klingt im modernen Deutschen natürlicher als »Interpretation«.
- source_word: ܡܠܬܐ
  choice: Wort
  rationale: Erhält die knappe, formelhafte Einleitung der folgenden Offenbarungsrede; »Sache« wäre ebenfalls möglich, würde aber den Verkündigungscharakter abschwächen.
theological_decisions:
- issue: Verhältnis der beiden Erwähnungen der schwarzen Wasser
  choice: 'Die Wiederholung bleibt ausdrücklich erhalten: Die letzten schwarzen Wasser folgen auf schwarze Wasser.'
  alternative: Die Wiederholung glätten und nur von der letzten Phase des Unheils sprechen.
  rationale: Der Text arbeitet mit einer feststehenden Abfolge symbolischer Wasser. Eine abstrahierende Glättung würde das apokalyptische Bild und seine mögliche Spannung vorzeitig auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die knappe Offenbarungsformel und die bewusste Wiederholung des Bildes bleiben erhalten.
