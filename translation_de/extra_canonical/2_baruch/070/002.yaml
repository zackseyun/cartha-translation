  yaml_path: translation/extra_canonical/2_baruch/070/002.yaml
  text: Behold, days are coming when the time of the world has ripened and the harvest of the seed of the evil and the good has come. Then the Mighty One will bring confusion of spirit and consternation of heart upon the earth, its inhabitants, and its rulers.
translation:
  language: de
  text: Siehe, es kommen Tage, in denen die Zeit der Welt reif geworden und die Ernte des Samens der Bösen und der Guten gekommen ist. Dann wird der Mächtige Verwirrung des Geistes und Bestürzung des Herzens über die Erde bringen, über ihre Bewohner und ihre Herrscher.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒܢܗ ܕܥܠܡܐ
  choice: die Zeit der Welt
  rationale: Bewahrt die zeitlich-kosmische Formulierung, ohne sie deutend mit „Endzeit“ wiederzugeben.
- source_word: ܙܪܥܐ ... ܕܒܝ̈ܫܐ ܘܕܛܒ̈ܐ
  choice: der Same der Bösen und der Guten
  rationale: „Same“ bleibt Singular; die pluralischen substantivierten Genitive bezeichnen die Bösen und die Guten, nicht böse und gute Samen.
- source_word: der Mächtige
  choice: der Mächtige
  rationale: Gibt den göttlichen Hoheitstitel wieder, ohne einen konfessionell geprägten Ersatz einzuführen.
- source_word: Verwirrung des Geistes / Bestürzung des Herzens
  choice: Verwirrung des Geistes und Bestürzung des Herzens
  rationale: Erhält den Parallelismus und die anthropologischen Begriffe Geist und Herz.
theological_decisions:
- issue: Bezug von „böse“ und „gut“
  choice: „der Bösen und der Guten“ als Personengruppen
  alternative: „seiner bösen und guten Samen“ bzw. „des bösen und guten Samens“
  rationale: Die zugrunde liegenden pluralischen Substantive stehen als Genitive zu „Same“; eine adjektivische Deutung würde die moralische Eigenschaft des Samens statt seiner Zugehörigkeit ausdrücken.
- issue: Gottesbezeichnung
  choice: „der Mächtige“
  alternative: „der Allmächtige“
  rationale: Die zurückhaltendere Titelform vermeidet, dem Ausdruck die weitergehende Bedeutung von „allmächtig“ aufzuerlegen.
translation_notes:
  register: Dignifizierter, gut verständlicher Erzähl- und Prophetenton. Die vorgelegte syrische Seitenauswahl scheint den Wortlaut von 70,2 nicht sichtbar zu enthalten; deshalb folgt der Vers dem auditierten englischen Konsultationstext und der ausdrücklich dokumentierten syrischen Formenlehre, ohne darüber hinaus unbelegte Details zu ergänzen.
