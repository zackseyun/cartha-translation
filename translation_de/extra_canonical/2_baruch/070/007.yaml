  yaml_path: translation/extra_canonical/2_baruch/070/007.yaml
  text: and some will be undone by their own. Then the Most High will reveal the peoples whom he prepared beforehand, and they will come and wage war against the rulers who remain at that time.
translation:
  language: de
  text: Und einige werden durch ihre eigenen Hände zugrunde gehen. Dann wird der Höchste die Völker offenbaren, die er im Voraus vorbereitet hat. Sie werden kommen und gegen die Herrscher Krieg führen, die zu jener Zeit noch übrig sind.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܓܠܝܘ (glīw / Stamm glā)
  choice: offenbar machen
  rationale: Das syrische Verb bezeichnet das Offenbaren oder Sichtbarwerdenlassen. Die Formulierung bewahrt hier den apokalyptischen Gedanken, dass zuvor bereitgehaltene Völker hervortreten.
- source_word: ܥܡܡ̈ܐ (‘ammē)
  choice: Völker
  rationale: Die reguläre kollektive Bedeutung passt zum endzeitlichen Auftreten mehrerer Volksgruppen.
- source_word: ܕܩܕܡ …
  choice: im Voraus bereitgestellt
  rationale: Gibt sowohl die zeitliche Vorordnung als auch den Gedanken wieder, dass diese Völker für den späteren Einsatz bereitgehalten wurden.
- source_word: ܐܬܝܢ (ātēn)
  choice: sie werden kommen
  rationale: Das Kommen wird als eigene, der Kriegführung vorausgehende Handlung ausdrücklich wiedergegeben.
theological_decisions:
- issue: Handeln des Höchsten an den zuvor bereitgestellten Völkern
  choice: „wird … offenbar machen“
  alternative: „wird … aufrütteln“
  rationale: „Offenbar machen“ folgt der Grundbedeutung des syrischen Verbs und erhält die apokalyptische Vorstellung, dass verborgene oder zurückgehaltene Mächte hervortreten, ohne ihre genaue Herkunft näher zu bestimmen.
- issue: Urheberschaft beim Untergang einiger Menschen
  choice: „durch die eigenen Leute“
  alternative: „durch ihre eigenen [Mittel/Hände]“
  rationale: Die Formulierung bleibt allgemein genug, um die knappe Aussage nicht mit einer bestimmten inneren Konfliktkonstellation zu überfrachten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Zugrunde gehen“ ist allgemein verständlich und wahrt die Unbestimmtheit der Art des Untergangs; „Herrscher“ hält den politischen Machtbezug ohne moderne Spezialisierung fest.
