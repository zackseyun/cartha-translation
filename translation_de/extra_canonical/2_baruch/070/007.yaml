revisions:
- from: Und einige werden durch die eigenen Leute zugrunde gehen. Dann wird der Höchste die Völker offenbar machen[a], die er im Voraus bereitgestellt hat. Sie werden kommen und gegen die Herrscher Krieg führen, die zu jener Zeit noch übrig sind.[b]
  to: Und einige werden durch ihre eigenen Hände zugrunde gehen. Dann wird der Höchste die Völker offenbaren, die er im Voraus vorbereitet hat. Sie werden kommen und gegen die Herrscher Krieg führen, die zu jener Zeit noch übrig sind.
  rationale: Die Revision ersetzt die unbegründete Konkretisierung „Leute“ durch den im Ausgangstext angelegten Bezug auf die eigenen Hände, formuliert die Offenbarung der Völker idiomatisch und entfernt zwei Fußnoten, die keine belastbaren textlichen Alternativen bieten. Das Kommen der Völker vor ihrem Krieg gegen die verbleibenden Herrscher bleibt ausdrücklich erhalten.
