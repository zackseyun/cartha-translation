    rationale: Die Formulierung macht aus dem knappen Ausdruck ein Handeln eigener Angehöriger bzw. einer eigenen Gruppe. Der syrische Bezug auf die eigenen Hände darf nicht durch „Leute“ konkretisiert werden.
  - severity: low
    issue: 'Fußnote a: „Oder: aufrütteln“'
    rationale: Diese Alternative ist für das syrische Verb „offenbaren/enthüllen“ nicht als gleichwertige Lesart zu vertreten und verwischt die apokalyptische Offenbarungsnuance.
  - severity: low
    issue: Fußnote b zur „kürzeren Wiedergabe“
