translation:
  language: de
  text: Denn die ganze Erde[a] wird ihre Bewohner verschlingen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: das ganze Land.'
    reason: Das zugrunde liegende syrische Wort kann sowohl die Erde als auch ein Land oder Gebiet bezeichnen.
lexical_decisions:
- source_word: ܐܪܥܐ
  choice: Erde
  rationale: Das syrische Wort kann je nach Zusammenhang „Erde“ oder „Land“ bedeuten; „die ganze Erde“ entspricht hier dem umfassenden Horizont des Satzes.
- source_word: ܬܐܟܘܠ
  choice: wird … verschlingen
  rationale: Die konkrete Bildsprache des Verbs „essen, verzehren“ wird mit dem im Deutschen natürlichen und kräftigen „verschlingen“ bewahrt.
- source_word: ܥܡܘܪ̈ܝܗ̇
  choice: ihre Bewohner
  rationale: Die Zugehörigkeit zur Erde beziehungsweise zum Land wird durch das Possessivpronomen klar und knapp wiedergegeben.
theological_decisions:
- issue: Reichweite von „Erde/Land“
  choice: die ganze Erde
  alternative: das ganze Land
  rationale: Der universale Wortlaut der konsultierten Überlieferung wird im Haupttext beibehalten; die lexikalisch mögliche räumliche Begrenzung wird in der Fußnote offengehalten.
translation_notes:
  register: Knapp, würdevoll und bildstark; die personifizierende Aussage, dass die Erde ihre eigenen Bewohner verschlingt, bleibt unverändert erhalten.
