base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/070/005.yaml
  text: The wise will be silent and the foolish will speak. Then the thought of men will not be fulfilled, nor the counsel of the strong, nor the hope of those who hope.
translation:
  language: de
  text: Die Weisen werden schweigen, und die Toren werden reden. Dann werden weder das Denken der Menschen noch der Plan der Welt[a] noch die Hoffnung der Hoffenden in Erfüllung gehen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das syrische Wort kann je nach Kontext auch „Zeitalter“ bedeuten.
    reason: Bewahrt die lexikalische Spannweite von ܥܠܡܐ; der Haupttext folgt der Grundbedeutung „Welt“.
lexical_decisions:
- source_word: ܚܟܝ̈ܡܐ / entsprechender im Seitenübergang vorausgesetzter Ausdruck
  choice: die Weisen
  rationale: Die kontrollierte englische Fassung bewahrt hier die überlieferte Gegenüberstellung von Weisen und Toren; der vorgelegte syrische Seitenausschnitt setzt innerhalb des Satzes ein und ist am Übergang fragmentarisch.
- source_word: ܣܟܠܐ
  choice: die Toren
  rationale: Bezeichnet unverständige oder törichte Menschen und bildet den Gegenpol zu den Weisen.
- source_word: ܡܚܫܒܬܐ ܕܒܢܝ ܐܢܫܐ
  choice: das Denken der Menschen
  rationale: Gibt die menschliche Überlegung beziehungsweise den menschlichen Plan wieder, ohne den Ausdruck unnötig auf eine einzelne Absicht einzuengen.
- source_word: ܬܪܥܝܬܐ
  choice: Rat
  rationale: Der Ausdruck kann Rat, Plan oder Entschluss bezeichnen; „Rat“ erhält die Parallelität mit Denken und Hoffnung.
- source_word: ܫܒܪ̈ܘܗܝ ܕܐܝܠܝܢ ܕܡܣܒܪܝܢ
  choice: die Hoffnung der Hoffenden
  rationale: Bewahrt bewusst die rhetorische Wiederholung des syrischen Ausdrucks.
- source_word: ܠܐ ܢܫܬܘܙܒܘܢ / überlieferte negative Verbalformen
  choice: wird sich nicht erfüllen / wird nicht verwirklicht werden
  rationale: Im Zusammenhang geht es darum, dass menschliches Denken, Rat und Hoffnung nicht zum Ziel gelangen; die natürliche deutsche Wiedergabe variiert leicht, ohne die parallele Verneinung aufzulösen.
theological_decisions:
- issue: Scheitern menschlicher Planung und Hoffnung
  choice: Die drei menschlichen Größen werden parallel als erfolglos dargestellt.
  alternative: Eine ausdrückliche Aussage über göttliche Vorherbestimmung oder Verdammnis.
  rationale: Der Vers selbst beschreibt das Ausbleiben menschlicher Erwartungen, nennt aber hier weder den genauen göttlichen Wirkmechanismus noch ein konfessionelles Lehrmodell.
- issue: Deutung von ܕܥܠܡܐ
  choice: der Mächtigen
  alternative: der Welt / des Zeitalters
  rationale: Die konsultierte Überlieferung versteht den Ausdruck als Bezeichnung mächtiger Menschen; die schriftliche Form lässt jedoch eine alternative Lesart zu, die in einer Fußnote offengehalten wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die antithetische und dreigliedrige Struktur bleibt erhalten; „Hoffnung der Hoffenden“ wird als bewusstes Stilmittel nicht geglättet. Der Fußnotenmarker [a] steht unmittelbar bei der mehrdeutigen Wendung.
