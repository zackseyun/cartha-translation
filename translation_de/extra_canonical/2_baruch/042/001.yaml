lexical_decisions:
- source_word: ܘܥܢܐ ܘܐܡܪ ܠܝ
  choice: Und er antwortete und sagte zu mir
  rationale: Die in der syrischen Erzählprosa übliche Doppelformel wird bewusst beibehalten; sie klingt würdevoll und gibt sowohl das Antworten als auch das anschließende Sprechen wieder.
- source_word: ܐܦ ܗܠܝܢ
  choice: Auch diese Dinge
  rationale: „Auch“ bewahrt den fortführenden Charakter der Aussage, während der Plural „diese Dinge“ die Mehrzahl des syrischen Ausdrucks sichtbar hält.
- source_word: ܐܚܘܝܟ
  choice: werde ich dir zeigen
  rationale: Die Wiedergabe erhält die direkte Anrede und den ankündigenden Zukunftssinn des Verbs.
theological_decisions:
- issue: Identität des Sprechers
  choice: Das Pronomen „er“ bleibt ohne erklärende Benennung stehen.
  alternative: Den Sprecher ausdrücklich als Gott oder Engel identifizieren.
  rationale: Der Vers selbst benennt den Sprecher nicht; eine ausdrückliche Identifizierung würde den unmittelbaren Wortlaut interpretierend erweitern.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit bewusst beibehaltener biblischer Antwortformel. Die knappe Satzstruktur und der Plural „diese Dinge“ folgen eng dem syrischen Ausdruck.
