  yaml_path: translation/extra_canonical/2_baruch/042/005.yaml
  text: But those who formerly did not know life, and afterward came to know it, and mingled with the seed of the people which has separated itself—their former time is also reckoned as nothing.”
translation:
  language: de
  text: Doch diejenigen, die das Leben früher nicht kannten, es später aber kennenlernten und sich mit dem Samen des Volkes vermischten, das sich abgesondert hat – auch ihre frühere Zeit wird als nichts gerechnet.«
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝ̈ܐ (im erschlossenen Verszusammenhang)
  choice: das Leben
  rationale: Bewahrt den abstrakten und möglicherweise heilsgeschichtlichen Sinn, ohne ihn durch eine engere Deutung wie »den Weg des Lebens« festzulegen.
- source_word: ܙܪܥܐ (im erschlossenen Verszusammenhang)
  choice: Samen
  rationale: Gibt das konkrete Bild der semitischen Vorlage wieder; gemeint sein können zugleich Abstammung beziehungsweise Nachkommenschaft.
- source_word: ܐܬܦܪܫܘ / entsprechende Form von »sich absondern«
  choice: sich abgesondert hatte
  rationale: Bewahrt die reflexive Aussage und ihre Spannung, ohne die Absonderung ausdrücklich als religiöse Erwählung oder moralische Reinheit auszulegen.
- source_word: ܐܬܚܫܒܘ / entsprechende Form von »rechnen, anrechnen«
  choice: wird für nichts gerechnet
  rationale: Hält die rechnungssprachliche Formulierung und die zeitliche Bewertung des früheren Lebensabschnitts fest.
theological_decisions:
- issue: Bedeutung von »Leben«
  choice: Die offene Bezeichnung »das Leben« bleibt stehen.
  alternative: »das wahre Leben« oder »den Weg des Lebens«
  rationale: Die qualifizierenden Zusätze stehen nicht ausdrücklich in der überlieferten Formulierung und würden die soteriologische Bedeutung stärker festlegen.
- issue: Identität des abgesonderten Volkes
  choice: Das Volk wird nicht näher identifiziert.
  alternative: Ausdrückliche Gleichsetzung mit Israel oder einer bestimmten endzeitlichen Gemeinschaft
  rationale: Die Übersetzung soll die Referenzoffenheit des Textes bewahren und keine konfessionelle Zuordnung ergänzen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit weitgehend formnaher Syntax. Der Gedankenstrich macht die abschließende Bewertung lesbar, ohne die logische Beziehung umzudeuten. »Samen des Volkes« bleibt bewusst bildhaft und altertümlicher als die übrige Sprache, weil das Quellenbild sonst verloren ginge.
