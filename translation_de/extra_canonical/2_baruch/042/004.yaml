  source_fidelity: 'Die Übersetzung folgt der in der englischen POB-Prüffassung wiedergegebenen Satzstruktur und den zentralen Begriffen: frühere Unterwerfung, späterer Rückzug, Vermischung mit der Nachkommenschaft gemischter Völker sowie die Nichtberücksichtigung der früheren Zeit. Die im syrischen Kontext schwierige Gruppenbezeichnung wird nicht überdeutet.'
  naturalness: „Sich danach aber entzogen“ ist ohne ergänzten Bezug im modernen Deutsch etwas unvollständig und weniger idiomatisch. „Sich später jedoch zurückzogen“ ist natürlich, wahrt die absichtliche Unbestimmtheit und gibt das englische „withdrew“ präzise wieder. Für die Schlussformel ist „gilt als nichts“ idiomatischer als „wird als nichts angerechnet“, ohne den Wertungsgehalt zu verändern.
  terminology: „Unterworfen“, „Nachkommenschaft“ und „vermischte Völker“ sind registergerecht und bewahren die Unbestimmtheit der Vorlage. Die Wiederholung von „vermischten“/„vermischten“ ist sachlich begründet und kann beibehalten werden.
