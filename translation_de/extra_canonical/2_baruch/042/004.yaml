    rationale: Die Formulierung ist verständlich, klingt jedoch im Deutschen weniger natürlich und kann speziell an ein Anrechnen zugunsten oder zulasten denken lassen. „Gilt als nichts“ bewahrt das bildlich-forensische Rechnen/Ansehen der Vorlage und ist idiomatischer.
