  yaml_path: translation/extra_canonical/2_baruch/042/004.yaml
  text: Those who were formerly under subjection and afterward withdrew and mingled themselves with the seed of the mixed peoples—their former time is reckoned as nothing.
translation:
  language: de
  text: Diejenigen, die früher unterworfen waren, sich später jedoch zurückzogen und sich mit der Nachkommenschaft der vermischten Völker vermischten – ihre frühere Zeit gilt als nichts.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܢܣܒܘ
  choice: sich entzogen
  rationale: Die Form wird im vorliegenden Zusammenhang als Loslösung beziehungsweise Rückzug aus einem früheren Abhängigkeitsverhältnis verstanden; die reflexive deutsche Wendung wahrt diesen Sinn.
- source_word: ܒܡܘ̈ܬܐ
  choice: mit der Nachkommenschaft der vermischten Völker
  rationale: Die überlieferte Lesart ist in diesem Abschnitt textlich schwierig; die Formulierung folgt dem kontextuell gestützten Verständnis einer Vermischung mit der Abstammungslinie gemischter Völker, ohne daraus eine bestimmte ethnische oder theologische Gruppe zu machen.
- source_word: ܐܬܚܫܒܘ
  choice: wird … angerechnet
  rationale: Das Verb bezeichnet ein Rechnen, Ansehen oder Anrechnen. Die deutsche Passivform gibt den urteilenden Charakter der Aussage idiomatisch wieder.
- source_word: ܡܢ ܩܕܝܡ
  choice: früher / ihre frühere Zeit
  rationale: Die zeitliche Rückverweisung wird in beiden Satzteilen beibehalten und nicht als moralische Wertung ausgelegt.
theological_decisions:
- issue: Bedeutung der früheren Zugehörigkeit
  choice: unterworfen waren
  alternative: unter der Herrschaft standen / gehorsam waren
  rationale: „Unterworfen“ bewahrt die Unbestimmtheit darüber, ob eine politische, soziale oder religiöse Bindung gemeint ist.
- issue: Wertung der früheren Zeit
  choice: wird als nichts angerechnet
  alternative: gilt als nichts / wird nicht angerechnet
  rationale: Die Formulierung lässt offen, ob die frühere Zeit vollständig verworfen oder lediglich bei einem Urteil nicht berücksichtigt wird.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „vermischten … vermengten“ ist bewusst beibehalten, weil sie die inhaltliche Verknüpfung der schwierigen Ausgangsformulierung hörbar macht; der Gedankenstrich trägt die abschließende Urteilsformel.
