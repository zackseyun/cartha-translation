    rationale: Das Verb „sich entziehen“ verlangt im heutigen Standarddeutsch gewöhnlich eine Ergänzung (etwa „sich einer Herrschaft entziehen“). „Sich zurückzogen“ gibt den im Audit Trail bezeugten Sinn von „withdrew“ klar und ohne unbelegte Präzisierung wieder.
  - severity: low
