  text: 'And as for what you said concerning those who drew near and those who withdrew, this is the word:'
translation:
  language: de
  text: 'Und was du über diejenigen gesagt hast, die sich genähert haben, und über diejenigen, die sich zurückgezogen haben: Dies ist das Wort:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܐܡܪܬ
  choice: was du … gesagt hast
  rationale: Gibt die rückbezügliche Einleitung idiomatisch und zugleich eng am syrischen Wortlaut wieder.
- source_word: ܐܝܠܝܢ
  choice: diejenigen
  rationale: Bewahrt die unbestimmte Bezeichnung der beiden Personengruppen.
- source_word: ܡܠܠ / ܡܠܐ
  choice: das Wort
  rationale: Der überlieferte Seitentext ist an dieser Stelle schwer segmentierbar; „das Wort“ folgt dem erkennbaren semitischen Ausdruck und bewahrt die formelhafte Offenheit.
theological_decisions:
- issue: Identität und Bewertung der beiden Gruppen
  choice: Keine nähere Bestimmung oder moralische Wertung ergänzt
  alternative: Die Gruppen als Gläubige und Abtrünnige oder als Lebende und Verstorbene deuten
  rationale: Der Vers benennt lediglich ihre gegensätzlichen Bewegungen; eine theologische Identifikation wäre interpretierende Ergänzung.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die paarige Gegenüberstellung „sich näherten / sich zurückzogen“ und die einleitende Antwortformel bleiben erhalten; der Doppelpunkt signalisiert, dass die folgende Aussage erst im nächsten Vers entfaltet wird.
