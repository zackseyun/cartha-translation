  yaml_path: translation/extra_canonical/2_baruch/042/002.yaml
  text: And as for what you said, ‘For whom and for how many will these things be?’ — for those who have believed, there will be the good things spoken beforehand; but for those who despise them, the opposite of these things.
translation:
  language: de
  text: 'Und was deine Frage betrifft: »Für wen und für wie viele werden diese Dinge sein?« — Für die, die geglaubt haben,[a] wird es die zuvor angekündigten guten Dinge geben; für die aber, die sie verachten, wird das Gegenteil davon eintreten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das syrische Wort kann auch »gehofft« oder »darauf vertraut« bedeuten.
    reason: Die Bedeutungsbreite des syrischen Verbs soll sichtbar bleiben, ohne den Haupttext unnötig zu belasten.
lexical_decisions:
- source_word: ܡܣܒܪܝܢ
  choice: geglaubt haben
  rationale: Das syrische Verb kann je nach Zusammenhang glauben, hoffen oder erwarten bezeichnen. Hier steht es im Gegensatz zum Verachten der angekündigten Dinge; »geglaubt haben« gibt diesen Gegensatz knapp und natürlich wieder.
- source_word: ܛܒ̈ܬܐ ܕܡܩܕܡܐ ܐܡܝܪܢ
  choice: die zuvor angekündigten guten Dinge
  rationale: Die Wendung bezeichnet wörtlich die guten Dinge, die vorher gesagt worden sind. »Angekündigt« macht ihren verheißenden, zukünftigen Bezug im Deutschen verständlich, ohne ihren Inhalt näher festzulegen.
- source_word: ܒܡܘܒܠܐ ܕܗܠܝܢ
  choice: das Gegenteil davon
  rationale: Die schwer überlieferte Wendung wird im Kontext als Gegenstück beziehungsweise Gegenteil der zuvor genannten guten Dinge verstanden; die Formulierung bewahrt den allgemeinen Charakter der Aussage.
theological_decisions:
- issue: Grundlage der unterschiedlichen Ausgänge
  choice: Der Text stellt Glauben und Verachten einander gegenüber.
  alternative: Die Aussage als umfassende Lehre über Heil und Verdammnis auszuformulieren.
  rationale: Der Vers nennt lediglich die Reaktion auf die angekündigten Dinge und die jeweils entsprechende Folge. Eine weitergehende dogmatische Präzisierung wäre ein Zusatz.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die einleitende Wiederaufnahme der Frage bleibt erhalten; der abschließende Gegensatz wird idiomatisch mit »wird … eintreten« formuliert.
