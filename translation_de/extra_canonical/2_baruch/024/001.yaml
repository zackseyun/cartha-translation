  yaml_path: translation/extra_canonical/2_baruch/024/001.yaml
  text: For look, days are coming when the books will be opened, in which the sins of all who have sinned are written, and also the storehouses in which the righteousness of all who were righteous in creation is gathered.
translation:
  language: de
  text: Denn sieh, es kommen Tage, an denen die Bücher geöffnet werden. In ihnen sind die Sünden aller aufgezeichnet, die gesündigt haben, und in den Schatzkammern ist die Gerechtigkeit aller gesammelt, die in der Schöpfung gerecht gewesen sind.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܝܘܡ̈ܬܐ
  choice: Tage
  rationale: Die natürliche deutsche Entsprechung bewahrt die zeitliche, eschatologische Aussage.
- source_word: ܓܙ̈ܐ
  choice: Schatzkammern
  rationale: Gibt das konkrete Bild von Verwahrorten wieder und entspricht dem Motiv himmlischer Aufbewahrung, ohne es erklärend umzudeuten.
- source_word: ܙܕܝ̈ܩܐ / ܐܙܕܕܩ
  choice: Gerechtigkeit / gerecht gewesen sind
  rationale: Bewahrt den Wortstamm und die moralisch-forensische Offenheit des syrischen Ausdrucks.
- source_word: ܒ̣ܪܝܬܐ
  choice: Schöpfung
  rationale: Die Wiedergabe lässt offen, ob die geschaffene Welt, die Schöpfungsordnung oder das geschöpfliche Dasein im Blick ist.
theological_decisions:
- issue: Bedeutung von „in der Schöpfung“
  choice: die in der Schöpfung gerecht gewesen sind
  alternative: die seit der Schöpfung gerecht gewesen sind
  rationale: Die lokale beziehungsweise sphärische Lesart wird beibehalten; eine zeitliche Deutung als „seit der Schöpfung“ wäre möglich, würde die echte Mehrdeutigkeit aber vorschnell auflösen.
- issue: Verhältnis von Büchern und Schatzkammern
  choice: Bücher für die aufgezeichneten Sünden und Schatzkammern für die gesammelte Gerechtigkeit
  alternative: Beides als einheitliches himmlisches Register wiedergeben
  rationale: Die unterschiedlichen Bilder des Textes bleiben erhalten und werden nicht zu einem einzigen theologischen Konzept harmonisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Denn seht“ erhält den einleitenden Aufmerksamkeitsruf; die Satzglieder wurden für gute Verständlichkeit in zwei deutsche Sätze gegliedert.
