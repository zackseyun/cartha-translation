  verdict: revise
  source_fidelity: 'Die Übersetzung gibt die Bildfolge des syrischen Textes zutreffend wieder: kommende Tage, geöffnete Bücher mit den Sünden der Sünder sowie Schatzkammern, in denen die Gerechtigkeit der Gerechten gesammelt ist. Die offene Wendung „in der Schöpfung“ bleibt erhalten.'
  naturalness: Der Entwurf ist überwiegend flüssiges modernes Standarddeutsch. Der Aufruf richtet sich jedoch im Kontext an Baruch als Einzelperson; „seht“ ist daher eine unbegründete Pluralanrede. „sieh“ ist die angemessene, zugleich würdige Anrede. „In ihnen“ stellt den Bezug auf die Bücher klarer her als „darin“.
  terminology: „Bücher“, „Schatzkammern“, „Sünden“ und „Gerechtigkeit“ sind treffend und bewahren die unterschiedlichen Metaphern. Die Formulierung „in der Schöpfung“ wahrt die semantische Offenheit von ܒܪܝܬܐ und sollte nicht zu „seit der Schöpfung“ eingeengt werden.
  issues:
