  to: Denn sieh, es kommen Tage, an denen die Bücher geöffnet werden. In ihnen sind die Sünden aller aufgezeichnet, die gesündigt haben, und in den Schatzkammern ist die Gerechtigkeit aller gesammelt, die in der Schöpfung gerecht gewesen sind.
  rationale: Die Revision beschränkt sich auf die dem Kontext entsprechende Singularanrede und einen klareren pronominalen Bezug. Bildlichkeit, Satzstruktur und die theologisch nicht weiter festgelegte Aussage über die Gerechten „in der Schöpfung“ bleiben gewahrt.
