  text: For I know what has happened to us, but what will happen to our enemies I do not know, nor when you will visit your works.”
translation:
  language: de
  text: Denn auch ich weiß, was mir widerfahren ist; doch was meinen Feinden widerfahren wird, weiß ich nicht und auch nicht, wann du dich deiner Werke annehmen wirst.“
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܓܕܫ
  choice: widerfahren
  rationale: Das Verb bezeichnet ein Geschehen oder Widerfahrnis; „widerfahren“ bewahrt den ernsten, schicksalhaften Ton und passt zu Personen als Betroffenen.
- source_word: ܣܥܪ (im englischen Kontrolltext als „visit“ bezeugt)
  choice: nach … sehen
  rationale: Die Wendung gibt das göttliche Aufsuchen bzw. prüfende Zuwenden natürlich wieder, ohne vorschnell festzulegen, ob Gericht oder Hilfe gemeint ist.
- source_word: ܒܥܠܕܒܒ̈ܐ (durch den englischen Kontrolltext für den abgeschnittenen Fortgang bezeugt)
  choice: Feinde
  rationale: Die übliche konkrete Wiedergabe erhält den Gegensatz zwischen „uns“ und „unseren Feinden“.
theological_decisions:
- issue: Bedeutung des göttlichen „Besuchens“ der Werke
  choice: wann du nach deinen Werken sehen wirst
  alternative: wann du deine Werke heimsuchen wirst
  rationale: „Heimsuchen“ würde im heutigen Deutsch leicht ausschließlich als Strafgericht verstanden. Der Ausgangsausdruck kann allgemeiner Gottes prüfendes oder wirksames Zuwenden bezeichnen; diese Spannung bleibt mit „nach … sehen“ offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Parallelismus des Nichtwissens wird durch „und auch nicht“ deutlich gemacht. Da der bereitgestellte syrische Seitenausschnitt mitten im Vers abbricht, wurde der sichtbare syrische Anfang vorrangig und der auditierte englische POB-Text als Kontrollschicht für den Fortgang herangezogen.
