revisions:
- from: Denn ich weiß, was uns widerfahren ist. Doch weiß ich nicht, was unseren Feinden widerfahren wird, und auch nicht, wann du nach deinen Werken sehen wirst.
  to: Denn auch ich weiß, was mir widerfahren ist; doch was meinen Feinden widerfahren wird, weiß ich nicht und auch nicht, wann du dich deiner Werke annehmen wirst.“
  rationale: Die Revision folgt im sichtbaren Text dem syrischen Singular und ersetzt die missverständliche Umschreibung des göttlichen Besuchens durch eine natürliche, theologisch nicht verengende deutsche Wendung. Der Satzbau bewahrt die zweifache Aussage des Nichtwissens.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T00:18:58Z'
review_pass:
  verdict: revise
  source_fidelity: Der sichtbare syrische Versanfang entspricht „Denn auch ich weiß, was mir widerfahren ist“ (ܐܦ ܐܢܐ ... ܓܕܫܢܝ); der englische Kontrolltext bietet pluralisch „us“, doch die erhaltene syrische Form ist eindeutig 1. Person Singular. Für den abgeschnittenen Rest stützt der englische Audittext die Aussage über die Feinde und das göttliche Besuchen der Werke. „Widerfahren“ trifft ܓܕܫ gut. Die Formulierung „nach deinen Werken sehen“ schwächt jedoch die aktiv-konkrete Bedeutung von „visit“ unnötig ab und ist im Deutschen semantisch missverständlich.
  naturalness: Der Entwurf ist überwiegend flüssig und würdig. „Was unseren Feinden widerfahren wird“ ist natürlich. „Wann du nach deinen Werken sehen wirst“ klingt jedoch alltagssprachlich und lässt offen, ob die Werke betrachtet werden oder ob Gott sich ihnen zuwendet; „dich deiner Werke annehmen wirst“ ist idiomatischer und bewahrt die offene, kontextabhängige Besuchsmetaphorik besser.
  terminology: Die Singularform „mir“ ist wegen des erhaltenen syrischen ܓܕܫܢܝ vorzuziehen. „Feinde“ ist angemessen. Für das göttliche Besuchen sollte kein ausschließlich strafgerichtlich geprägtes „heimsuchen“ gewählt werden; „dich ... annehmen“ wahrt die Ambiguität besser als „nach ... sehen“.
  issues:
  - severity: medium
    issue: Die erste Person wurde von Singular zu Plural geändert.
    rationale: Der vorliegende syrische Text lautet ܐܦ ܐܢܐ („auch ich“) und ܓܕܫܢܝ („mir widerfahren ist“). Der englische Kontrolltext weicht hier mit „us“ ab; die Primärquelle hat Vorrang.
  - severity: medium
    issue: „nach deinen Werken sehen“ ist keine hinreichend genaue Wiedergabe des göttlichen „Besuchens“.
    rationale: Die deutsche Wendung kann bloßes Nachschauen oder Kontrollieren meinen und wirkt registermäßig zu umgangssprachlich. „Dich deiner Werke annehmen“ bezeichnet ein wirksames Zuwenden, ohne Gericht oder Hilfe einseitig festzulegen.
  revised_text: Denn auch ich weiß, was mir widerfahren ist; doch was meinen Feinden widerfahren wird, weiß ich nicht und auch nicht, wann du dich deiner Werke annehmen wirst.“
  revised_footnotes: []
