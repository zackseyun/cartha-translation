  yaml_path: translation/extra_canonical/2_baruch/024/002.yaml
  text: And at that time you will see—and the many who are with you—the forbearance of the Most High that has been through all generations, how he has been patient with all who are born, both those who sin and those who are righteous.
translation:
  language: de
  text: 'Und zu jener Zeit werden du und die vielen, die bei dir sind, die Langmut des Höchsten sehen, die sich durch alle Generationen hindurch erwiesen hat: wie geduldig er mit allen war, die geboren wurden – sowohl mit denen, die sündigten, als auch mit denen, die gerecht handelten.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܪܘܡܐ / sinngemäß die Bezeichnung für den Höchsten
  choice: der Höchste
  rationale: Bewahrt die Gottesbezeichnung des syrischen Überlieferungszusammenhangs und entspricht dem feierlichen Register des Textes.
- source_word: ܡܓܪܬ ܪܘܚܐ / sinngemäß Langmut und Geduld
  choice: Langmut … wie geduldig er … war
  rationale: „Langmut“ gibt den theologischen Leitbegriff prägnant wieder; die anschließende Umschreibung mit „geduldig“ macht ihn in modernem Deutsch unmittelbar verständlich.
- source_word: ܕܪ / generationsbezogener Ausdruck
  choice: durch alle Generationen hindurch
  rationale: Gibt die zeitliche Erstreckung wieder, ohne sie auf ein einzelnes Zeitalter einzuengen.
- source_word: ܐܝܠܝܢ ܕܚܛܘ / ܐܝܠܝܢ ܕܐܙܕܕܩܘ
  choice: die sündigten … die gerecht handelten
  rationale: Bewahrt die parallele Gegenüberstellung von Sündern und Gerechten als handelnden Gruppen.
theological_decisions:
- issue: Gottes Geduld gegenüber Sündern und Gerechten
  choice: Die Langmut gilt ausdrücklich beiden Gruppen.
  alternative: Die Geduld nur auf die Sünder zu beziehen und die Gerechten lediglich als weitere Anwesende zu verstehen.
  rationale: Die überlieferte Parallelstruktur stellt beide Gruppen unter die geduldige Zuwendung des Höchsten; diese bemerkenswerte theologische Spannung darf nicht geglättet werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Satzbau bleibt nah an der gestuften Aussage des syrischen Textes, wird aber für heutige Leser geglättet. Der Gedankenstrich hebt die abschließende Parallelität hervor.
