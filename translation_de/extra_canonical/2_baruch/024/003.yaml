  text: And I answered and said, “But look, Lord, no one knows the number of the things that have passed, nor of the things that are to come.
translation:
  language: de
  text: 'Und ich antwortete und sagte: »Doch sieh, Herr: Kein Mensch kennt die Zahl der vergangenen Dinge und auch nicht die der Dinge, die noch kommen werden.«'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܥܢܝܬ ܘܐܡܪܬ
  choice: ich antwortete und sagte
  rationale: Die formelhafte Doppelung des Syrischen wird beibehalten, da sie den Erzählstil prägt.
- source_word: ܐܠܐ ܗܐ
  choice: Doch sieh
  rationale: Gibt den adversativen Übergang und den aufmerksamkeitslenkenden Ausruf wieder, ohne ihn zu einer bloßen Folgerung abzuschwächen.
- source_word: ܐܢܫ
  choice: kein Mensch
  rationale: Natürliches Deutsch für die generische Personenbezeichnung; der Kontext betrifft die Gesamtheit der Menschen.
- source_word: ܡܢܝܢܐ
  choice: die Zahl
  rationale: Entspricht dem konkreten Gedanken einer feststehenden, aber Menschen unbekannten Gesamtzahl.
- source_word: ܕܐܝܠܝܢ ܕܒܥܪܝܢ
  choice: derer, die vergangen sind
  rationale: Die substantivische Personenlesart entspricht dem Kontext der bereits geborenen und verstorbenen Menschen; die Formulierung lässt zugleich die knappe Relativkonstruktion des Syrischen erkennen.
- source_word: ܕܐܝܠܝܢ ܕܥܬܝܕܢ
  choice: derer, die noch kommen werden
  rationale: Bewahrt den Zukunftsbezug und macht mit „noch“ die Gegenüberstellung zu den Vergangenen idiomatisch deutlich.
theological_decisions:
- issue: Bezug der Vergangenen und Kommenden
  choice: 'Als Personen formuliert: „derer, die …“'
  alternative: 'Sachlich-abstrakt: „der Dinge, die vergangen sind beziehungsweise kommen werden“'
  rationale: Der nähere Zusammenhang handelt von der festgesetzten Zahl der Menschen, die geboren werden. Das Syrische verwendet jedoch eine allgemeine Relativform; daher wird keine engere dogmatische Bestimmung wie „Seelen“ oder „Geschlechter“ eingeführt.
- issue: Umfang menschlichen Wissens
  choice: Die Aussage bleibt strikt auf die unbekannte Zahl bezogen.
  alternative: Eine umfassende Unkenntnis aller vergangenen und zukünftigen Ereignisse ausdrücken.
  rationale: So wird die Aussage nicht über den ausdrücklich genannten Gegenstand „Zahl“ hinaus theologisch erweitert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die traditionelle Antwortformel bleibt erhalten; die direkte Rede ist klar und mündlich verständlich. Keine Fußnote ist nötig, da die kontextuell naheliegende Personenlesart im Text ohne spekulative Ergänzung ausgedrückt werden kann.
