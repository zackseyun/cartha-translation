  text: and in my prayer. And you also have learned from them the commandments of this letter, and you will be subdued in excellence, the nations for the promise, and you will be loved, and you will be comforted, lest you fall and be tormented.
translation:
  language: de
  text: und in meinem Gebet. Auch ihr habt von ihnen die Gebote dieses Briefes gelernt. Ihr werdet in Vortrefflichkeit gebeugt werden – die Völker für die Verheißung[a]; ihr werdet geliebt und getröstet werden, damit ihr nicht fallt und gequält werdet.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der syrische Wortlaut dieses Satzteils ist syntaktisch schwer verständlich; nahezu wörtlich: „Ihr werdet in Vortrefflichkeit gebeugt werden – die Völker für die Verheißung.“ Wie „die Völker“ und „für die Verheißung“ mit dem Verb verbunden sind, wird nicht eindeutig markiert.'
    reason: Die Fußnote dokumentiert die überlieferte syntaktische Unklarheit, ohne die ungesicherte Deutung einer Beugung vor den Völkern oder eine konjekturale Herrschaftsaussage einzutragen.
lexical_decisions:
- source_word: ܒܒܥܘܬܝ
  choice: und in meinem Gebet
  rationale: ܒܥܘܬܐ kann Gebet, Bitte oder Flehen bezeichnen. „Gebet“ ist hier natürlich und lässt den Anschluss an die im vorangehenden Satz genannte Erinnerung offen.
- source_word: ܝܠܦܬܘܢ
  choice: ihr habt gelernt
  rationale: Das Verb bezeichnet Lernen oder Unterweisung. Die Form wird als vollendete Handlung wiedergegeben, ohne den mahnenden Zusammenhang zu verlieren.
- source_word: ܡܢܗܘܢ
  choice: aus ihnen
  rationale: Das Pronomen hat im vorliegenden Ausschnitt keinen eindeutig bestimmten Bezug. Die wörtliche Wiedergabe bewahrt diese Offenheit.
- source_word: ܦܘ̈ܩܕܢܐ
  choice: die Gebote
  rationale: Der Ausdruck bezeichnet verbindliche Weisungen oder Gebote; „Gebote“ wahrt den autoritativen Ton des Briefschlusses.
- source_word: ܡܝܬܪܘܬܐ
  choice: vorbildliche Haltung
  rationale: Das Substantiv bezeichnet Vortrefflichkeit, Tugend oder Vorzüglichkeit. Im schwierigen Satzgefüge ergibt „in vorbildlicher Haltung“ einen natürlichen deutschen Ausdruck, ohne eine bestimmte Einzeltugend einzutragen.
- source_word: ܡܘܠܟܢܐ
  choice: Verheißung
  rationale: Das Wort bedeutet „Verheißung“ oder „Versprechen“ und darf nicht mit einem Wortstamm für „herrschen“ verwechselt werden.
- source_word: ܬܬܢܚܡܘܢ
  choice: ihr werdet getröstet werden
  rationale: Die passive Zukunftsform wird direkt wiedergegeben und setzt die Trostzusage neben die Zusage, geliebt zu werden.
theological_decisions:
- issue: Gebet und mögliche Fürbitte Baruchs
  choice: Die knappe Aussage bleibt bei „in meinem Gebet“.
  alternative: Ausdrückliche Wiedergabe als Fürbitte
  rationale: Der syrische Text nennt ein Gebet, entfaltet jedoch keine ausdrückliche Lehre über Fürbitte.
- issue: Bezug der Verheißung auf die Völker
  choice: Die schwer verständlichen Satzglieder werden vorsichtig als Beugung vor den Völkern um der Verheißung willen verbunden und durch eine textkritische Fußnote abgesichert.
  alternative: 'Konjekturale Lesart: „Ihr werdet gestärkt werden, um in Vortrefflichkeit über die Völker zu herrschen.“'
  rationale: Die Alternative setzt Bedeutungen beziehungsweise Textänderungen voraus, die der überlieferte syrische Wortlaut nicht trägt. Die Übersetzung bewahrt die Spannung des Textes, ohne daraus eine Herrschaftsaussage zu machen.
- issue: Zweck oder Abwehr in der Schlusswarnung
  choice: „damit ihr nicht fallt und gequält werdet“
  alternative: „aus Furcht, ihr könntet fallen und gequält werden“
  rationale: Die Wiedergabe erhält den warnenden Finalcharakter der syrischen Konstruktion, ohne Ursache und Ablauf des Leidens näher zu bestimmen.
translation_notes:
  register: Moderner, würdevoller Briefstil. Der Beginn bleibt als Anschluss an den vorangehenden Vers kleingeschrieben. Semikolons gliedern die dichte Folge der Zusagen und Mahnungen; die schwer verständliche Mittelpassage wird lesbar formuliert, aber ausdrücklich als textlich unsicher gekennzeichnet.
