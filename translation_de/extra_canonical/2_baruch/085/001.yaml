  language: en
  yaml_path: translation/extra_canonical/2_baruch/085/001.yaml
  text: '… the times are close and already pressing in. The pitcher is near the well, the ship the harbor, the journey the city, and life its completion.


    So then receive his commandments, that you may not be cut off from the greatness of his mercy, but may find rest and not condemnation.


    For when the Most High brings these things to pass, there will no longer be room for repentance, or a boundary for the times, or an extension of the seasons, or a turning toward rest; nor will anyone be helped by prayer, or by the mediation of fathers, or by the petition of prophets, or by the aid of the righteous, or by the weeping of women, or by the tenderness of little children, or by the crying of infants, or by the innocence of newborns, or by the righteousness of their fathers. None of the things once thought and seen to be helpers will be able to help.


    For each of us will then be judged by himself alone.


    And he will preserve for his age those who have hope in him, but he will at once destroy those who are defiled with sins.'
translation:
  language: de
  text: '… die Zeiten sind nahe und drängen bereits heran. Der Krug ist nahe am Brunnen, das Schiff am Hafen, die Reise nahe bei der Stadt und das Leben an seinem Ende.


    Nehmt also seine Gebote an, damit ihr nicht von der Fülle seines Erbarmens ausgeschlossen werdet, sondern Ruhe findet und nicht verurteilt werdet.


    Denn wenn der Höchste dies vollbringt, wird es keinen Raum zur Umkehr mehr geben, keine Grenze mehr für die Zeiten, keinen Aufschub der Fristen und keine Hinwendung zur Ruhe. Dann wird niemandem geholfen werden – weder durch Gebet noch durch die Fürsprache der Väter, weder durch die Bitte der Propheten noch durch die Hilfe der Gerechten, weder durch das Weinen der Frauen noch durch die Liebenswürdigkeit kleiner Kinder, weder durch das Schreien der Säuglinge noch durch die Reinheit der Neugeborenen oder durch die Gerechtigkeit ihrer Väter. Nichts von alledem, was man einst für hilfreich hielt und als Hilfe ansah, wird dann helfen können.


    Denn jeder von uns wird dann für sich allein gerichtet werden.[a]


    Diejenigen, die ihre Hoffnung auf ihn setzen, wird er für seine Welt bewahren; diejenigen aber, die mit Sünden befleckt sind, wird er zugleich vernichten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: „Dann wird jeder von uns allein für sich vor Gericht stehen.“'
    reason: Die Hauptübersetzung folgt der direkten Bedeutung des syrischen Verbs „gerichtet werden“; die Fußnote bewahrt die im Zusammenhang mögliche gerichtliche Vorstellung des Allein-Dastehens.
lexical_decisions:
- source_word: ܦܩ̈ܘܕܘܗܝ
  choice: seine Gebote
  rationale: Das Wort bezeichnet verbindliche göttliche Weisungen; „Gebote“ bewahrt sowohl die autoritative als auch die mahnende Kraft.
- source_word: ܬܐܢܝܚܘܢ
  choice: Ruhe findet
  rationale: Die Form kann Erleichterung, Trost oder Ruhe ausdrücken. „Ruhe finden“ wahrt hier den möglichen endzeitlichen Sinn und bildet den Gegenpol zur Verurteilung.
- source_word: ܒܒܟܝܐ ܕܢܫ̈ܐ
  choice: durch das Weinen der Frauen
  rationale: Die konkrete Formulierung erhält die eindringliche, kumulative Rhetorik der Aufzählung.
- source_word: ܒܛܝܒܘܬܐ ܕܛܠܝ̈ܐ
  choice: durch die Liebenswürdigkeit kleiner Kinder
  rationale: Das Substantiv kann Güte, Anmut oder anrührende Liebenswürdigkeit bezeichnen. Die gewählte Formulierung lässt diese emotionale Wirkung erkennen, ohne sie mit Schuldlosigkeit gleichzusetzen.
- source_word: ܒܕܟܝܘܬܐ ܕܝܠܝ̈ܕܐ
  choice: durch die Reinheit der Neugeborenen
  rationale: „Reinheit“ gibt ܕܟܝܘܬܐ direkt wieder und bewahrt die kultische wie moralische Bedeutungsweite besser als eine Festlegung auf „Unschuld“.
- source_word: ܐܬܪܐ ܠܬܝܒܘܬܐ (kontrollierte Lesart gegenüber dem fehlerhaften Seitenbefund ܐܪܙܐ ܠܬܚܘܝܬܐ)
  choice: Raum zur Umkehr
  rationale: Die kontrollierte Lesart ergibt im Zusammenhang des endgültigen Gerichts den klaren Sinn, dass keine Gelegenheit zur Umkehr mehr bleibt.
- source_word: ܡܦܠܓܝܢ ܒܚܛܝ̈ܬܐ
  choice: mit Sünden befleckt
  rationale: Die Wendung beschreibt den von Sünden bestimmten Zustand. „Befleckt“ ist im Deutschen verständlich und bewahrt die moralische Bildsprache, auch wenn die Grundbedeutung des Verbs möglicherweise ein Verteilt- oder Verstricktsein anklingen lässt.
- source_word: ܠܥܠܡܘܗܝ
  choice: für seine Welt
  rationale: ܥܠܡܐ kann „Welt“ oder „Weltzeit“ bedeuten. „Seine Welt“ bleibt knapp und lässt den endzeitlichen Horizont offen, ohne ausdrücklich „kommende Welt“ in den Text einzutragen.
theological_decisions:
- issue: Die lange Reihe künftig wirkungsloser Fürsprachen und Hilfen
  choice: Alle einzelnen Gruppen und Formen der Hilfe werden beibehalten.
  alternative: Die Reihe pauschal als „Dann wird keine Fürsprache mehr helfen“ zusammenzufassen.
  rationale: Die Steigerung von Gebet, Vätern, Propheten und Gerechten bis zu Frauen, Kindern und Neugeborenen trägt die Aussage von endgültiger persönlicher Verantwortung und darf nicht eingeebnet werden.
- issue: Die Aussage über das individuelle Gericht
  choice: „Jeder von uns wird dann für sich allein gerichtet werden.“
  alternative: „Jeder von uns wird dann allein für sich dastehen.“
  rationale: Die kontrollierte syrische Verblesart bezeichnet ausdrücklich das Gerichtetwerden. Die Alternative bewahrt zwar den Gerichtskontext, schwächt aber die direkte Aussage des Verbs ab.
- issue: Das Ziel der Bewahrung der Hoffenden
  choice: „für seine Welt bewahren“
  alternative: „für seine kommende Weltzeit bewahren“
  rationale: Die Übersetzung wahrt die Bedeutungsbreite von ܥܠܡܐ zwischen Welt und Weltzeit und ergänzt „kommend“ nicht ausdrücklich, obwohl der Kontext endzeitlich ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die bildhafte Eröffnung und die lange anaphorische Aufzählung bleiben erhalten; behutsame syntaktische Glättungen sorgen für Verständlichkeit. Der Text vermeidet konfessionelle Fachsprache und lässt die Spannung zwischen Erbarmen, endgültigem Gericht und persönlicher Verantwortung stehen.
