  terminology: „Gebote“, „Erbarmen“, „Umkehr“, „Fürsprache“, „Gerechte“, „Reinheit“ und „gerichtet werden“ sind sachgerecht und registerangemessen. Die Fußnote ist als ausdrücklich sinngemäße gerichtliche Umschreibung zulässig und darf die direkte Übersetzung im Haupttext nicht ersetzen.
  issues:
  - severity: low
    issue: Unidiomatische Ortsangabe in der Bildreihe
    rationale: „die Reise an der Stadt“ ist im modernen Deutschen missverständlich bzw. unnatürlich. Die syrische und englische Bildreihe meint die nahe bevorstehende Ankunft der Reise bei der Stadt.
  - severity: low
    issue: Abschwächung der adverbialen Aussage im Schlusssatz
    rationale: „allesamt“ betont, dass alle Betroffenen vernichtet werden; ܐܟܚܕܐ bzw. das englische „at once“ bezeichnet eher Gleichzeitigkeit bzw. unmittelbares Geschehen. „zugleich“ gibt dies besser wieder.
