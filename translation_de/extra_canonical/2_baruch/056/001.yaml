  terminology: „Ordnung der Welt“, „der Mächtige“, „Wort“, „Übertretung“, „Befreiung“, „wilde Lebewesen“ und „Elemente“ werden beibehalten. Bei den komprimierten Aussagen über Adam wird keine gerichtliche Rolle der Engel hineinübersetzt.
