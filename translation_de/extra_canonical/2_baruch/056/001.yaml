  yaml_path: translation/extra_canonical/2_baruch/056/001.yaml
  text: 'That great cloud which you saw ascending from the sea and going to cover the earth—understand this: it is the ordering of the world which the Mighty One made when he resolved to create it.[1][2] And it came to pass that, when the word went forth from before him, the establishment of the world arose—fair, small—and it was prepared as it was fitting to be.[3]


    And as for the first black waters which you saw descending from that cloud, this is the sin and transgression which the first Adam committed first. For when he transgressed, death was aroused before its time, and mourning became known, and afflictions were prepared, and pains were created, and toil was completed; and greatness began to wane.


    And the last day, which appeared in a form and took on a likeness—you will know that the time will be demanded, and the measure of humanity will be measured, and its strength will be tested.[4][5]


    Therefore, because Adam—when he heard from God something of what was to be, and understood that the release of the dead had been given, and had been commanded by God—considered, and he thought five thoughts: for he was condemning himself; he was also condemning the angels; and even at the time when he was created in it, there was for him a seen vision, and the fierce living creatures, and the elements with fire.[6][7]


    And thus God gathered in time, in the likeness in which they had been created.'
translation:
  language: de
  text: 'Jene große Wolke, die du aus dem Meer aufsteigen und dann die Erde bedecken sahst[a] – erkenne: Sie ist die Ordnung der Welt, die der Mächtige schuf, als er beschloss, die Schöpfung ins Dasein zu rufen.[b] Als das Wort von ihm ausging, erhob sich die Grundordnung der Welt – schön, klein – und sie wurde so eingerichtet, wie es angemessen war.[c]


    Die ersten schwarzen Wasser aber, die du aus jener Wolke herabkommen sahst, sind die Sünde und die Übertretung, die der erste Adam als Erster beging.[d] Denn als er sündigte, wurde der Tod vor seiner Zeit aufgerüttelt; Trauer wurde bekannt, Bedrängnisse wurden bereitet, Schmerzen wurden geschaffen und Mühsal kam zur Vollendung. Und die Größe begann zu schwinden.


    Der letzte Tag aber, der in einer Gestalt erschien und eine Ähnlichkeit annahm, bedeutet: Du sollst erkennen, dass die Zeit eingefordert, das Maß der Menschheit ausgemessen und ihre Kraft geprüft werden wird.[e]


    Adam hatte nämlich von Gott etwas von dem gehört, was geschehen sollte. Er hatte verstanden, dass den Toten Befreiung gewährt worden war, und er hatte von Gott einen Befehl erhalten. Darum sann er nach und fasste fünf Gedanken.[f] Denn er verurteilte sich selbst, und auch unter den Engeln wurde er verurteilt. Sogar zu der Zeit, in der er geschaffen wurde, hatte er eine sichtbare Schau: die wilden Lebewesen und die Elemente samt dem Feuer.[g]


    Und so versammelte Gott sie zu gegebener Zeit in der Gestalt, in der sie geschaffen worden waren.'
