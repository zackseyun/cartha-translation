    text: Cerianis Text hat sinngemäß „ging und bedeckte“; die Kontrolllesart verwendet ein anderes Verb für „bedecken“. Der Sinn ändert sich dadurch nicht.
    reason: textual_variant
  - marker: b
    text: Der syrische Text ist hier schwierig. Die Kontrolllesart stützt „Ordnung/Struktur der Welt“ und das Gottesprädikat „der Mächtige“; Cerianis überlieferte beziehungsweise erfasste Form kann auch wie „seine Macht“ gelesen werden.
    reason: textual_variant
  - marker: c
    text: „Schön, klein“ ist im Zusammenhang ungewöhnlich. Die auffällige, möglicherweise auf einen anfänglichen Zustand der Schöpfung bezogene Formulierung wurde wörtlich beibehalten.
    reason: lexical_alternative
  - marker: d
    text: 'Auch möglich: „Dies ist die Übertretung, mit der Adam, der Erste, zuerst übertrat.“'
    reason: lexical_alternative
  - marker: e
    text: Die Sätze über den „letzten Tag“ sind äußerst knapp. Das Wort für „Ähnlichkeit“ kann nicht mit Sicherheit näher bestimmt werden; auch die seltene Wendung zum „Maß der Menschheit“ könnte auf ihr Erscheinungsbild und dessen Auslöschung zielen.
    reason: lexical_alternative
  - marker: f
    text: 'Wörtlicher: „Fünf Gedanken wurden gedacht.“ Der folgende Text scheint diese Gedanken aufzuzählen, doch die Zuordnung der einzelnen Glieder bleibt im Syrischen dunkel.'
    reason: textual_difficulty
  - marker: g
    text: Die Folge „er selbst … unter den Engeln … zur Zeit seiner Erschaffung … Schau … wilde Lebewesen … Elemente“ ist stark verkürzt. Die Übersetzung wahrt ihre Reihenfolge, ohne daraus ein geschlossenes Lehrsystem abzuleiten.
    reason: textual_difficulty
lexical_decisions:
- source_word: ܥܢܢܐ
  choice: Wolke
  rationale: Die gewöhnliche Bedeutung bewahrt das visionäre Bild einer aus dem Meer aufsteigenden Wolke.
- source_word: ܚܦܝ / ܟܣܝ
  choice: bedecken
  rationale: Beide bezeugten Lesarten tragen hier den Sinn des Bedeckens; die neutrale deutsche Wiedergabe wahrt das Bild.
- source_word: ܢܘܓܪܗ ܕܥܠܡܐ
  choice: Ordnung der Welt
  rationale: Die kontrollierte Lesart bezeichnet Anordnung oder Struktur; „Ordnung“ passt zum unmittelbaren Schöpfungskontext.
- source_word: ܚܝܠܬܢܐ
  choice: der Mächtige
  rationale: Als substantivisches Gottesprädikat entspricht dies dem Sprachgebrauch des Buches und der kontrollierten Lesart.
- source_word: ܡܠܬܐ
  choice: Wort
  rationale: Die formale Wiedergabe erhält den Anklang an den schöpferischen Befehl, ohne ihn ausdrücklich auszudeuten.
- source_word: ܩܘܝܡܐ
  choice: Grundordnung
  rationale: Das Wort kann Bestand, Aufrichtung oder Einrichtung bezeichnen; „Grundordnung“ verbindet die Vorstellung des Bestands mit der kosmischen Einrichtung.
- source_word: ܙܥܘܪ
  choice: klein
  rationale: Die auffällige wörtliche Bedeutung wird trotz ihrer Schwierigkeit nicht geglättet.
- source_word: ܡܝ̈ܐ ܐܘܟܡ̈ܐ
  choice: schwarze Wasser
  rationale: Die direkte Wiedergabe bewahrt die symbolische Farbbildlichkeit.
- source_word: ܐܬܬܙܝܥ
  choice: wurde … aufgerüttelt
  rationale: Das Verb bezeichnet ein Erschüttert- oder In-Bewegung-Versetztwerden; die Formulierung erhält dieses dynamische Bild.
- source_word: ܫܘܒܩܢܐ ܕܡ̈ܝܬܐ
  choice: den Toten Befreiung
  rationale: ܫܘܒܩܢܐ kann Erlassung, Freilassung oder Vergebung bedeuten. „Befreiung“ lässt den genauen Charakter der gewährten Gabe offen.
- source_word: ܚܝܘܬܐ ܡܪܝܪܬܐ
  choice: wilde Lebewesen
  rationale: Die Wendung bezeichnet heftige beziehungsweise grimmige Lebewesen; „wild“ ist im Deutschen natürlich und legt keine bestimmte Tierklasse fest.
- source_word: ܐܣܛܘܟܣܐ
  choice: Elemente
  rationale: Das griechische Lehnwort bezeichnet hier am ehesten kosmische Elemente; die Übersetzung vermeidet eine weitergehende philosophische Festlegung.
theological_decisions:
- issue: Bedeutung der großen Wolke
  choice: Sie steht für Gottes Ordnung der Welt bei der Schöpfung.
  alternative: Sie steht für politische Herrschaft oder für die Ausbreitung des Gerichts.
  rationale: Die folgende Erklärung verbindet sie ausdrücklich mit dem Entschluss zur Schöpfung und dem ausgehenden Wort.
- issue: Der Tod wird vor seiner Zeit aufgerüttelt
  choice: Adams Sünde setzt den Tod und seine Folgen vorzeitig in Bewegung.
  alternative: Nur Adams persönliche Lebenszeit wird verkürzt.
  rationale: Die anschließende Reihe von Trauer, Bedrängnissen, Schmerzen und Mühsal weist auf eine umfassende Störung der geschaffenen Ordnung.
- issue: Der letzte Tag und die Prüfung der Menschheit
  choice: Die knappe Aussage wird als endzeitliche Rechenschaft verstanden, ohne Einzelheiten zu systematisieren.
  alternative: Sie bezieht sich ausschließlich auf Adams persönlichen Todestag.
  rationale: Das Einfordern der Zeit sowie das Ausmessen und Prüfen der Menschheit haben einen umfassenden Horizont.
- issue: ܫܘܒܩܢܐ für die Toten
  choice: Eine von Gott gewährte „Befreiung“ für die Toten, deren genauer Charakter offenbleibt.
  alternative: Ausdrücklich Vergebung der Sünden oder ausschließlich Auferstehung.
  rationale: Die passive Form weist auf eine göttliche Gewährung, doch das Substantiv erlaubt mehrere Nuancen; die Übersetzung vermeidet eine konfessionelle Festlegung.
- issue: Adams Verurteilung und die Engel
  choice: Adam verurteilt sich selbst und wird auch im Bereich der Engel verurteilt.
  alternative: Adam verurteilt die Engel oder zieht sie in seine Schuld hinein.
  rationale: Die syrische Satzfolge ist stark verdichtet; die pronominale Form bezieht die Verurteilung am ehesten auf Adam, lässt aber die genaue Rolle der Engel unklar.
- issue: Die Elemente samt dem Feuer
  choice: Kosmische Elemente werden genannt, ohne sie als Geister oder philosophische Urstoffe näher zu definieren.
  alternative: Elementargeister oder Schriftzeichen.
  rationale: Die Verbindung mit Feuer spricht für einen kosmischen Bezug, erlaubt aber keine präzisere Systematisierung.
