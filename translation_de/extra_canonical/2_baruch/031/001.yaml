base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/031/001.yaml
  text: 'And it happened after these things, that I went to the people and said to them, “Gather to me your elders and your children, and I will speak my words with them."”


    And they all assembled in the valley of Kidron.


    And I asked and said to them,'
translation:
  language: de
  text: 'Und nach diesen Ereignissen ging ich zum Volk und sagte zu ihnen: »Versammelt eure Ältesten und eure Kinder bei mir, und ich werde zu ihnen meine Worte sprechen.«[a]


    Da versammelten sie sich alle im Kidrontal.


    Und ich fragte und sagte zu ihnen:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die überlieferte beziehungsweise transkribierte Wortfolge ist an dieser Stelle unsicher. Eine kontrollierte Lesart lautet: „und ich werde zu ihnen meine Worte sprechen“; möglich wäre auch sinngemäß: „und ich werde meine Worte zu euch sprechen“.'
    reason: Die bereitgestellte Ceriani-Transkription ist an dieser Stelle offenbar gestört, während die Kontrollüberlieferung die dritte Person und „meine Worte“ stützt.
lexical_decisions:
- source_word: ܟܢܫܘ
  choice: Versammelt
  rationale: Der Imperativ bezeichnet das Zusammenrufen beziehungsweise Zusammenbringen der genannten Personen und behält die unmittelbare Kraft der Aufforderung.
- source_word: ܣܒܝܟܘܢ
  choice: eure Ältesten
  rationale: „Älteste“ gibt sowohl das Lebensalter als auch die mögliche gemeinschaftliche Stellung wieder, ohne die Bedeutung auf bloß „alte Männer“ zu verengen.
- source_word: ܒܢܝ̈ܟܘܢ
  choice: eure Kinder
  rationale: Die im syrischen Text ausdrücklich genannten Kinder werden beibehalten.
- source_word: ܒܚܠܬܐ ܕܩܕܪܘܢ
  choice: im Kidrontal
  rationale: Dies ist die natürliche moderne deutsche Bezeichnung für das Tal des Kidron.
- source_word: ܘܒܥܝܬ
  choice: Und ich bat sie
  rationale: Das Verb ܒܥܐ kann „bitten“, „ersuchen“ oder „fragen“ bedeuten. Im vorliegenden Einleitungssatz passt „bat“ gut, wobei die folgende Rede erst im nächsten Vers einsetzt.
theological_decisions:
- issue: Adressaten von Baruchs angekündigter Rede
  choice: „mit ihnen meine Worte reden“
  alternative: „zu euch meine Worte reden“ oder „meine Worte zu ihnen sprechen“
  rationale: Die kontrollierte syrische Lesart bewahrt sowohl das Possessiv „meine“ als auch den Bezug auf die zuvor genannten Ältesten und Kinder. Die dritte Person wird nicht stillschweigend an die unmittelbaren Zuhörer angeglichen.
- issue: Bezeichnung der führenden Generation
  choice: „Älteste“
  alternative: „alte Männer“
  rationale: „Älteste“ lässt die mögliche gemeinschaftliche und bundestheologische Funktion offen, ohne eine bestimmte Amtslehre vorauszusetzen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzfolge bleibt nah am syrischen Erzählstil; „Kidrontal“ ist gegenüber „Tal Kidron“ die geläufigere deutsche Ortsbezeichnung. Der abschließende Doppelpunkt wahrt, dass die folgende Rede erst im nächsten Vers beginnt.
