  text: 'For now we see the abundance of the prosperity of the nations while they act wickedly, but they are compared to a drop. We look on the force of their power, but they will be reckoned as spittle. We consider the glory of their greatness, though they do not keep the commandments of the Mighty One, but have treated them with contempt. And we consider the beauty that is seen, though it is shaken in afflictions; but they will be sought out like flesh in pain. We think on the confidence in which they trust, though before our eyes it is shaken; but they will be crushed like a wave. And we seek only the hope of their strength, though it flourishes in the good things God gave them; but it will be laid away, and lamentation will come upon it.


    For the Most High is indeed hastening his times and bringing near his hours. He will judge those who oppress, and the heraldings of the age will go forth. The hidden things of all their sins will be revealed, and the quiet thoughts of what is right will spring forth. Those who now think they can escape will not be able to save themselves, nor will anyone make a covenant with famine by abundance of food. The humble will not place their hope in prosperity; rather, their heart rejoices in those things that endure. Instead, they will hope all the more because that fearsome end has arrived. They will not look on the delights of the present age, and they will know only that they are being brought to the end. But the consummation of the world will show the great strength of his governance, when everything enters what is inward and returns to what from the beginning had been appointed. Then it will be seen that what has been found was not established by men, but has truly reached its completion.


    For whatever stood, or was made, or came in conflict and passed away, shows this: evil is not forever evil, and good is not forever good. Every health is turned into sickness, every strength into weakness, every beauty into deformity, and all the bloom of youth into burdened old age. All the beauty you saw turns into darkness and corruption, and every ruin you made turns into peace and pleasantness. Every darkness that had been given turns into the light of truth. Every error and weakness turns into the lowliness of stillness. Every vengeance and wrath turns into rest and strength. And every voice of the wakeful turns into dust-born silence.


    And no possession will again be a return to death for those who seek it. Those who snatch wages will no longer bring forth death before its time, and the death that is the wage of sufferings will be taken away. There will no longer be any occasion of joy merely for delight. The realm of change will be turned into accomplished conflict, and the sound of sinners in Sheol will no longer be heard.


    So when all these things happen, do you think they will not be required from the inhabitants of the earth on one day? If then their own disclosures show that they live, their guilt itself teaches the falsehood that is in them. I have set down its full measure, because they were begotten from falsehood before I die. And I said that they were putting their trust in evil.'
translation:
  language: de
  text: 'Denn jetzt sehen wir den Überfluss, in dem die Völker gedeihen, während sie Unrecht tun; doch sie gelten nur wie ein Tropfen. Wir schauen auf die Kraft ihrer Macht; doch sie werden wie Speichel erachtet. Wir betrachten den Glanz ihrer Größe, obwohl sie die Gebote des Mächtigen nicht halten, sondern sie verächtlich behandelt haben. Und wir betrachten die Schönheit, die vor Augen liegt, obwohl sie in Bedrängnissen erschüttert wird; doch wie leidendes Fleisch werden sie heimgesucht werden. Wir denken an die Zuversicht, auf die sie vertrauen, obwohl sie vor unseren Augen erschüttert wird; doch wie eine Woge werden sie zerschmettert werden. Und wir suchen nur nach der Hoffnung auf ihre Stärke, obwohl sie in den guten Gaben aufblüht, die Gott ihnen gegeben hat; doch sie wird weggelegt werden, und Klage wird über sie kommen.


    Denn der Höchste beschleunigt seine Zeiten und lässt seine Stunden näher kommen. Er wird über die Unterdrücker Gericht halten, und die Herolde des Zeitalters werden ausgehen.[a] Das Verborgene all ihrer Sünden wird offenbar werden, und die stillen Gedanken an das Rechte werden hervorsprießen. Diejenigen, die jetzt meinen, entkommen zu können, werden sich nicht retten können; auch wird niemand durch einen Vorrat an Nahrung einen Bund mit dem Hunger schließen können. Die Demütigen werden ihre Hoffnung nicht auf Wohlergehen setzen; vielmehr freut sich ihr Herz an dem, was Bestand hat. Sie werden vielmehr umso mehr hoffen, weil jenes furchterregende Ende gekommen ist. Sie werden nicht auf die Annehmlichkeiten des gegenwärtigen Zeitalters schauen, sondern nur erkennen, dass sie dem Ende entgegengeführt werden. Die Vollendung der Welt aber wird die große Macht seiner Herrschaft sichtbar machen, wenn alles ins Innere eingeht und zu dem zurückkehrt, was von Anfang an bestimmt worden war.[b]
    Dann wird sichtbar werden, dass das, was sich vorfindet, nicht von Menschen geschaffen wurde, sondern wahrhaftig zu seiner Vollendung gelangt ist.


    Denn alles, was bestand oder geschaffen wurde oder in den Kampf eintrat und verging, zeigt dies: Das Böse bleibt nicht für immer böse, und das Gute bleibt nicht für immer gut.[c] Jede Gesundheit verwandelt sich in Krankheit, jede Stärke in Schwäche, jede Schönheit in Entstellung und jede Blüte der Jugend in beschwerliches Alter. Alle Schönheit, die ihr gesehen habt, verwandelt sich in Finsternis und Verfall; und jede Verwüstung, die ihr angerichtet habt, verwandelt sich in Frieden und Wohlergehen. Jede Finsternis, die gegeben war, verwandelt sich in das Licht der Wahrheit. Jeder Irrtum und jede Schwäche verwandeln sich in die Niedrigkeit der Stille. Jede Vergeltung und jeder Zorn verwandeln sich in Ruhe und Kraft. Und jede Stimme der Wachsamen verwandelt sich in eine aus Staub geborene Stille.


    Kein Besitz wird denen, die ihn suchen, noch einmal zur Rückkehr in den Tod gereichen. Diejenigen, die Lohn an sich reißen, werden keinen vorzeitigen Tod mehr hervorbringen, und der Tod, der der Lohn der Leiden ist, wird weggenommen werden. Es wird keinen Anlass zur Freude mehr geben, der nur dem Genuss dient. Der Bereich des Wandels wird in vollendeten Kampf verwandelt werden, und die Stimme der Sünder im Scheol wird nicht mehr zu hören sein.[d]


    Wenn dies alles geschieht, meinst du dann, es werde nicht an einem einzigen Tag von den Bewohnern der Erde gefordert werden? Wenn also ihre eigenen Enthüllungen erkennen lassen, dass sie leben, so lehrt gerade ihre Schuld die Lüge, die in ihnen ist.[e] Ich habe ihr volles Maß festgehalten, weil sie aus der Lüge hervorgegangen sind, bevor ich sterbe. Und ich sagte, dass sie ihr Vertrauen auf das Böse setzten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die Verkündigungen des Zeitalters werden ausgehen“. Der syrische Ausdruck kann konkrete Herolde oder ihre Verkündigungen in den Vordergrund stellen.'
    reason: lexikalische und textliche Mehrdeutigkeit
  - marker: b
    text: 'Der syrische Wortlaut dieses Satzes ist schwer verständlich; möglich ist auch: „wenn alles zu seinem Innersten gelangt und zu dem kommt, was von Anfang an beschlossen war“.'
    reason: textlich schwierige Überlieferung
  - marker: c
    text: Gemeint sein kann, dass weder das gegenwärtige Böse noch das gegenwärtige Gute in seiner jetzigen Gestalt dauerhaft bleibt. Der Wortlaut selbst bleibt jedoch zugespitzt und mehrdeutig.
    reason: echte theologische und semantische Spannung
  - marker: d
    text: Die Aussagen über den „Bereich des Wandels“ und den „vollendeten Kampf“ beruhen auf einem schwer verständlichen syrischen Text; die genaue Satzverknüpfung ist unsicher.
    reason: textlich schwierige Überlieferung
  - marker: e
    text: Dieser Satz ist im überlieferten syrischen Text dunkel. Auch Bezüge wie „ihre Kundgaben“ oder „ihre Erkenntnisse“ sind möglich.
    reason: unklare Syntax und Lexik
