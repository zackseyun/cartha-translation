  rationale: Bezeichnet hier den gefürchteten eschatologischen Abschluss, ohne die Aussage stärker zu systematisieren als der Text.
- source_word: ܚܘܠܡ̈ܢܐ
  choice: Gesundheit
  rationale: Erhält den konkreten Gegensatz zur Krankheit innerhalb des Umkehrungskatalogs.
- source_word: ܕܘ̈ܓܐ
  choice: Entstellung
  rationale: Bewahrt den scharfen Gegensatz zur Schönheit und bezeichnet nicht bloß geringere Attraktivität.
- source_word: ܢܗܝܪܘܬܐ ܕܫܪܪܐ
  choice: das Licht der Wahrheit
  rationale: Erhält sowohl das Lichtbild als auch den Wahrheitsbezug.
- source_word: ܡܘܩܣܢ
  choice: Zorn
  rationale: Passt zum benachbarten Gerichtswort und wahrt die Kraft des Ausdrucks.
- source_word: ܫܝܘܠ
  choice: Scheol
  rationale: Vermeidet die Eintragung späterer, engerer Vorstellungen von Hölle und lässt den älteren Unterweltsbegriff sichtbar.
- source_word: ܢܘܛܦܬܐ / ܪܘܩܩܐ
  choice: Tropfen / Speichel
  rationale: Gibt die beiden konkreten Bilder in ihrer durch Kontrollmaterial bestätigten Reihenfolge wieder und vermeidet die unbelegte Abschwächung zu einem vergehenden Dunst.
- source_word: ܚܕ̣ܐ
  choice: freut sich
  rationale: Leitet die Form vom Verbalstamm für Freude ab, nicht vom Zahlwort für eins.
theological_decisions:
- issue: Göttliche Titel
  choice: „der Höchste“ und „der Mächtige“ werden unterschieden
  alternative: beide Titel vereinheitlichen
  rationale: Die unterschiedlichen syrischen Hoheitstitel und ihre jeweilige rhetorische Wirkung bleiben erhalten.
- issue: Katalog der Umkehrungen
  choice: als endzeitliche Umgestaltung im Horizont des Gerichts wiedergegeben
  alternative: als allgemeine Weisheit über die Unbeständigkeit des Lebens lesen
  rationale: Gericht, Weltvollendung und Scheol bestimmen den unmittelbaren apokalyptischen Zusammenhang.
- issue: ܫܝܘܠ
  choice: Scheol
  alternative: Hölle oder Totenreich
  rationale: „Scheol“ wahrt die historische und theologische Offenheit des Ausgangstextes.
- issue: Aussage, dass Böses nicht immer böse und Gutes nicht immer gut sei
  choice: die spannungsreiche Formulierung unverändert stehen lassen
  alternative: zu einer Aussage über bloße zeitliche Vergänglichkeit erklären
  rationale: Der syrische Wortlaut formuliert bewusst paradox; eine dogmatische Glättung würde die echte Spannung beseitigen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit apokalyptischem Ernst. Konkrete Bilder wie „Tropfen“, „Speichel“ und „Scheol“ bleiben erhalten; dunkle oder paradoxe Stellen werden nicht konfessionell geglättet, sondern im Haupttext möglichst eng wiedergegeben und in Fußnoten als unsicher ausgewiesen.
