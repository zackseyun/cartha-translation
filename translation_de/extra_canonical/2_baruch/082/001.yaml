revisions:
- from: 'Denn jetzt sehen wir den Überfluss, in dem die Völker gedeihen, während sie Unrecht tun; doch sie gelten nur wie ein Tropfen. Wir schauen auf die Gewalt ihrer Macht; doch sie werden wie Speichel erachtet. Wir betrachten den Glanz ihrer Größe, obwohl sie die Gebote des Mächtigen nicht halten, sondern sie verächtlich behandelt haben. Und wir betrachten die Schönheit, die vor Augen liegt, obwohl sie in Bedrängnissen erschüttert wird; doch wie leidendes Fleisch werden sie heimgesucht werden. Wir denken an die Zuversicht, auf die sie vertrauen, obwohl sie vor unseren Augen erschüttert wird; doch wie eine Woge werden sie zerschmettert werden. Und wir suchen nur nach der Hoffnung, die ihnen ihre Stärke gibt, obwohl sie in den guten Gaben aufblüht, die Gott ihnen gegeben hat; doch sie wird weggelegt werden, und Klage wird über sie kommen.


    Denn der Höchste beschleunigt seine Zeiten und lässt seine Stunden näher kommen. Er wird über die Unterdrücker Gericht halten, und die Herolde des Zeitalters werden ausziehen.[a] Das Verborgene all ihrer Sünden wird offenbar werden, und die stillen Gedanken dessen, was recht ist, werden hervorsprießen. Diejenigen, die jetzt meinen, entkommen zu können, werden sich nicht retten können; auch wird niemand durch einen Vorrat an Nahrung einen Bund mit dem Hunger schließen können. Die Demütigen werden ihre Hoffnung nicht auf Wohlergehen setzen; vielmehr freut sich ihr Herz an dem, was Bestand hat. Ja, sie werden umso mehr hoffen, weil jenes furchterregende Ende gekommen ist. Sie werden nicht auf die Annehmlichkeiten des gegenwärtigen Zeitalters schauen, sondern nur erkennen, dass sie dem Ende entgegengeführt werden. Die Vollendung der Welt aber wird die große Macht seiner Herrschaft sichtbar machen, wenn alles ins Innere eingeht und zu dem zurückkehrt, was von Anfang an bestimmt worden war.[b]
    Dann wird sichtbar werden, dass das, was sich vorfindet, nicht von Menschen geschaffen wurde, sondern wahrhaftig zu seiner Vollendung gelangt ist.


    Denn alles, was bestand oder geschaffen wurde oder in den Kampf eintrat und verging, zeigt dies: Das Böse bleibt nicht für immer böse, und das Gute bleibt nicht für immer gut.[c] Jede Gesundheit verwandelt sich in Krankheit, jede Stärke in Schwäche, jede Schönheit in Entstellung und jede Blüte der Jugend in beschwerliches Alter. Alle Schönheit, die ihr gesehen habt, verwandelt sich in Finsternis und Verfall; und jede Verwüstung, die ihr angerichtet habt, verwandelt sich in Frieden und Wohltun. Jede Finsternis, die gegeben war, verwandelt sich in das Licht der Wahrheit. Jeder Irrtum und jede Schwäche verwandeln sich in die Demut der Stille. Jede Vergeltung und jeder Zorn verwandeln sich in Ruhe und Kraft. Und jede Stimme der Wachsamen verwandelt sich in den Staub, aus dem sie geboren ist.


    Kein Besitz wird für diejenigen, die ihn suchen, noch einmal zu einer Rückkehr in den Tod führen. Diejenigen, die Lohn an sich reißen, werden keinen vorzeitigen Tod mehr hervorbringen, und der Tod, der der Lohn der Leiden ist, wird weggenommen werden. Es wird keinen Anlass zur Freude mehr geben, der nur dem Genuss dient. Der Bereich des Wandels wird in vollendeten Kampf verwandelt werden, und die Stimme der Sünder im Scheol wird nicht mehr zu hören sein.[d]


    Wenn dies alles geschieht, meinst du dann, es werde nicht an einem einzigen Tag von den Bewohnern der Erde gefordert werden? Wenn also ihre eigenen Enthüllungen erkennen lassen, dass sie leben, so lehrt gerade ihre Schuld die Lüge, die in ihnen ist.[e] Ich habe ihr volles Maß festgehalten, weil sie aus der Lüge hervorgegangen sind, bevor ich sterbe. Und ich sagte, dass sie ihr Vertrauen auf das Böse setzten.'
