  text: And when I had gone out and dismissed them, I went away from there and said to them, “Look, I am going to my dwelling in Hebron.”
translation:
  language: de
  text: 'Als ich hinausgegangen war und sie entlassen hatte, ging ich von dort weg und sagte zu ihnen: »Seht, ich gehe zu meiner Wohnstätte in Hebron.«[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der syrische Wortlaut am Versanfang ist grammatisch unregelmäßig; sinngemäß lässt sich auch übersetzen: »Dann gingen sie hinaus, und ich entließ sie.«'
    reason: Die überlieferte Abfolge der Verbformen lässt unterschiedliche Zuordnungen der handelnden Personen zu. Die Hauptübersetzung folgt dem wahrscheinlichen Erzählzusammenhang, während die Fußnote die echte textliche Unsicherheit wahrt.
lexical_decisions:
- source_word: ܫ̇ܪܝܘ ܐܢܘܢ
  choice: sie entlassen hatte
  rationale: Das Verb bezeichnet ein Freigeben oder Fortschicken. »Entlassen« passt zum förmlichen Abschluss der Versammlung und ist im Deutschen natürlicher als ein bloßes »verlassen«.
- source_word: ܠܕܝܪܝ ܠܚܒܪܘܢ
  choice: zu meiner Wohnstätte in Hebron
  rationale: Die syrische Formulierung nennt vor dem Ortsnamen ausdrücklich eine Wohn- oder Aufenthaltsstätte. »Wohnstätte« bewahrt dieses Detail in würdiger, verständlicher Sprache.
- source_word: ܗܐ
  choice: Seht
  rationale: Die Aufmerksamkeitspartikel leitet die Ankündigung nachdrücklich ein. »Seht« erhält diesen Signalcharakter, ohne altertümlich zu wirken.
theological_decisions: []
translation_notes:
  register: Modernes Standarddeutsch in würdigem Erzählstil. Der Imperativ »Seht« gibt die syrische Aufmerksamkeitspartikel knapp wieder; »Wohnstätte« bewahrt den konkreten semitischen Ausdruck, ohne eine klösterliche Bedeutung festzulegen.
