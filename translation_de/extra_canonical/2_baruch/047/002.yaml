  text: And afterward my companions left me, and I came to the cedar where he had spoken with me; and I sat there and fasted seven days.
translation:
  language: de
  text: Danach verließen mich meine Gefährten. Ich kam zu der Zeder, wo er mit mir gesprochen hatte, setzte mich dort nieder und fastete sieben Tage.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܒܪܐ
  choice: meine Gefährten
  rationale: Das syrische Substantiv bezeichnet Gefährten oder Begleiter; der Kontext und die überlieferte Fassung legen den Plural nahe.
- source_word: ܐܪܙܐ
  choice: die Zeder
  rationale: Direkte Wiedergabe des bestimmten syrischen Nomens; gemeint ist der bereits bekannte Ort bei der Zeder.
- source_word: ܐܬܡܠܠ ܥܡܝ
  choice: er mit mir gesprochen hatte
  rationale: Die unpersönlich/passiv wirkende syrische Form wird im Zusammenhang natürlich mit einem nicht ausdrücklich genannten männlichen Sprecher wiedergegeben, ohne dessen Identität im Text festzulegen.
- source_word: ܨܡܬ
  choice: fastete
  rationale: Das Verb bezeichnet eindeutig das Fasten.
theological_decisions:
- issue: Identität des Sprechers bei der Zeder
  choice: Pronomen „er“ ohne nähere Bestimmung
  alternative: „Gott“ oder „der Höchste“ ausdrücklich nennen
  rationale: Der syrische Vers nennt den Sprecher hier nicht ausdrücklich; die Übersetzung bewahrt diese implizite Referenz und vermeidet eine zusätzliche theologische Festlegung.
translation_notes:
  register: Moderne, würdige Standardsprache; der längere syrische Satzbau wurde zur besseren Verständlichkeit in zwei Sätze gegliedert. Keine Fußnoten erforderlich.
