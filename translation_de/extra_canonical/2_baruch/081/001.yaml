  yaml_path: translation/extra_canonical/2_baruch/081/001.yaml
  text: 'But also hear a word of consolation. For I was mourning over Zion, and I sought mercy from the Most High, and I said, “Will these things remain for us until the end? And will these afflictions come upon us at every time?” And the Mighty One acted according to the abundance of his mercies, and he spared according to the greatness of his grace. And he revealed a word to me, that I might be strengthened, and he gave me visions, that I might not again be shaken; and he made known to me the mysteries of the times, and showed me the coming of the ages.


    Therefore, my brothers, I have written to you so that you may be comforted because of the multitude of your tribulations. For know that our Maker will require vengeance from all our enemies for all the evil things they have done against us, and that the consummation which the Most High has prepared is near, and his mercy is coming, and the completion of his judgment is not far away.


    For now we see the abundance of the prosperity of the nations while they act wickedly, but they will be reckoned like a drop. And we look at the strength of their power, but it will be accounted as spittle. We think on the glory of their greatness, while they do not keep the commandments of the Mighty One, but have treated them with contempt. And we think on the beauty that is seen, though it is shaken in afflictions, and they will be sought out like flesh in pain. And we reckon only the confidence in which they trust, though it is shaken before our eyes; but they will be crushed like a wave. And we seek only the hope of their strength, when it flourishes in the good things that God gave them; but it will be laid away, and lamentation will overtake it.'
translation:
  language: de
  text: 'Doch hört auch ein Wort des Trostes. Denn ich trauerte um Zion, suchte Erbarmen beim Höchsten und sagte: »Werden diese Dinge bis zum Ende für uns bestehen bleiben? Und werden diese Bedrängnisse zu jeder Zeit über uns kommen?« Da handelte der Mächtige nach der Fülle seines Erbarmens und verschonte uns nach der Größe seiner Gnade. Er offenbarte mir ein Wort, damit ich gestärkt würde, und gab mir Visionen, damit ich nicht wieder erschüttert würde. Er ließ mich die Geheimnisse der Zeiten erkennen und zeigte mir das Kommen der Zeitalter.


    Darum, meine Brüder, habe ich euch geschrieben, damit ihr angesichts eurer vielen Bedrängnisse getröstet werdet. Denn ihr sollt wissen: Unser Schöpfer wird an allen unseren Feinden Vergeltung üben für all das Böse, das sie uns angetan haben. Die Vollendung, die der Höchste bereitet hat, ist nahe; sein Erbarmen kommt, und der Abschluss seines Gerichts ist nicht mehr fern.


    Denn jetzt sehen wir, wie groß der Wohlstand der Völker ist, während sie Böses tun; doch sie werden wie ein Tropfen geachtet werden. Wir betrachten die Stärke ihrer Macht; doch sie wird wie Speichel gelten. Wir bedenken den Ruhm ihrer Größe, obwohl sie die Gebote des Mächtigen nicht halten, sondern sie verachtet haben. Wir bedenken die Schönheit, die sich zeigt, obwohl sie in Bedrängnissen erschüttert wird; doch man wird nach ihnen suchen wie nach schmerzendem Fleisch. Wir bedenken nur die Zuversicht, auf die sie vertrauen, obwohl sie vor unseren Augen erschüttert wird; doch sie werden wie eine Welle zerschmettert werden. Und wir achten nur auf die Hoffnung, die ihnen ihre Stärke gibt, wenn sie durch die guten Gaben aufblüht, die Gott ihnen geschenkt hat; doch sie wird weggelegt werden, und die Klage wird sie einholen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܪܝܡܐ
  choice: der Höchste
  rationale: Der geläufige deutsch-biblische Hoheitstitel bewahrt den apokalyptischen und transzendenten Klang.
- source_word: ܚܝܠܬܐ
  choice: der Mächtige
  rationale: Die Wiedergabe hält diesen Gottesnamen vom Titel »der Höchste« unterschieden und klingt im Deutschen würdig.
- source_word: ܪ̈ܚܡܘܗܝ / ܚܢܢܗ
  choice: sein Erbarmen / seine Gnade
  rationale: Die beiden verwandten, aber nicht identischen Begriffe werden nicht zu einem einzigen Ausdruck eingeebnet.
- source_word: ܚܘ̈ܘܝ
  choice: Visionen
  rationale: Der Begriff passt zum apokalyptischen Zusammenhang und steht sinnvoll neben dem offenbarten Wort.
- source_word: ܫܘܠܡܐ / completion language
  choice: Vollendung / Abschluss
  rationale: Die Wortwahl bewahrt den eschatologischen Gehalt und unterscheidet zugleich das vorbereitete Endgeschehen vom Abschluss des Gerichts.
- source_word: ܢܘܛܦܬܐ / spittle-comparison
  choice: wie Speichel gelten
  rationale: Das absichtlich erniedrigende Bild wird nicht durch eine allgemeinere oder gefälligere Metapher ersetzt.
- source_word: ܩܝ̈ܡܘܗܝ / ܦܘܩܕܢܐ
  choice: Gebote
  rationale: »Gebote« ist gegenwärtiges, verständliches Bibeldeutsch und wahrt den Gedanken verbindlicher göttlicher Weisung.
theological_decisions:
- issue: Göttliche Vergeltung
  choice: Unser Schöpfer wird an allen unseren Feinden Vergeltung üben
  alternative: Unser Schöpfer wird alle unsere Feinde zur Rechenschaft ziehen
  rationale: »Vergeltung üben« bewahrt die Schärfe der apokalyptischen Gerichtsaussage; der Zusatz »für all das Böse« stellt ihren gerichtlichen Grund heraus, ohne sie zu bloßer privater Rache umzudeuten.
- issue: Eschatologische Nähe
  choice: Die Vollendung ... ist nahe; sein Erbarmen kommt
  alternative: Das Ende ... ist nahe
  rationale: Die Formulierung hält die Spannung von nahem Gericht und kommendem Erbarmen fest und reduziert die Vollendung nicht auf einen bloßen Zeitpunkt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit moderat biblisch-apokalyptischem Klang. Die wiederholten Satzanfänge und Gegenüberstellungen bleiben als rhetorisches Gerüst erhalten. Ungewöhnliche Vergleichsbilder wurden nicht geglättet; insbesondere »wie Speichel« und »wie nach schmerzendem Fleisch« bewahren die Härte beziehungsweise Fremdheit der Vorlage.
