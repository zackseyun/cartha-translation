  terminology: „der Höchste“, „der Mächtige“, „Erbarmen“, „Gnade“, „Visionen“, „Vollendung“ und „Gebote“ sind angemessen und registergerecht. „Vergeltung üben“ gibt die gerichtliche Schärfe wieder, ohne eine konfessionelle Deutung einzutragen.
