  text: 'And it happened after the seventh day, that I prayed before the Mighty One[a] and said:'
translation:
  language: de
  text: 'Und es geschah nach dem siebten Tag, dass ich vor dem Mächtigen[a] betete und sagte:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: „Der Mächtige“ ist in 2 Baruch ein häufiger Titel für Gott und hebt seine souveräne Macht hervor.
    reason: lexical_choice
lexical_decisions:
- source_word: ܘܗܘܐ
  choice: Und
  rationale: Die syrische Erzählungsformel leitet den nächsten Vorgang ein. Im heutigen Deutschen genügt hier „Und“; ein wörtlicheres „Und es geschah“ wäre möglich, klänge aber unnötig formelhaft.
- source_word: ܡܢ ܒܬܪ ܝܘܡܐ ܫܒܝܥܝܐ
  choice: nach dem siebten Tag
  rationale: Gibt die zeitliche Folge des Syrischen eng und natürlich wieder, ohne den Ausdruck als „am siebten Tag“ umzudeuten.
- source_word: ܨ̇ܠܝܬ
  choice: betete ich
  rationale: Die erste Person Singular wird direkt und idiomatisch wiedergegeben.
- source_word: ܩܕܡ
  choice: vor
  rationale: Bewahrt die räumlich-höfische Ausdrucksweise des Syrischen, statt sie glättend durch „zu“ zu ersetzen.
- source_word: ܚܝܠܬܢܐ
  choice: dem Mächtigen
  rationale: Der substantivierte Titel gibt das syrische göttliche Epitheton wieder und betont Gottes Macht, ohne die stärkere und stärker festgelegte Bezeichnung „der Allmächtige“ einzutragen.
- source_word: ܘܐܡ̇ܪܬ
  choice: und sagte
  rationale: Bewahrt die koordinierte Satzstruktur und führt unmittelbar in das folgende Gebet ein.
theological_decisions:
- issue: Göttlicher Titel ܚܝܠܬܢܐ
  choice: der Mächtige
  alternative: der Allmächtige; der Starke
  rationale: „Der Mächtige“ wahrt den Charakter eines göttlichen Titels und die Betonung souveräner Kraft, ohne den Ausdruck mit einem anderweitig etablierten Gottesnamen gleichzusetzen.
- issue: Gebet „vor“ Gott
  choice: vor dem Mächtigen
  alternative: zum Mächtigen
  rationale: „Vor“ erhält die im Syrischen ausgedrückte Haltung des Betens in Gottes Gegenwart und löst sie nicht in die geläufigere Zielangabe „zu“ auf.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die eröffnende Erzählungsformel wurde knapp und natürlich wiedergegeben; der Doppelpunkt bewahrt den Übergang zur anschließenden Rede. Der Vers endet strikt nach Vers 1.
