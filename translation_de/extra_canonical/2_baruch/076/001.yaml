  yaml_path: translation/extra_canonical/2_baruch/076/001.yaml
  text: And he answered and said to me, “Because you have prayed that I show you what will happen to you after these things, for this reason I have shown you this vision, that you may see what will happen to you after these things. For you shall surely depart from this earth—but not unto death; rather, you shall be kept for the appointed times. Therefore go up to the summit of that mountain, and the regions of that land shall pass before you, and the form of the inhabited world, and the tops of the mountains, and the depths of the valleys, and the depths of the seas, and the number of the rivers, so that you may see what you are leaving and where you are going. And this shall be after forty days. Go therefore now, during these days, and instruct the people as much as you are able, so that they may learn, lest they die at the last time, but may learn so that they may live at the last time.”
translation:
  language: de
  text: '**2. Baruch 76,1**


    Und er antwortete und sagte zu mir: „Weil du mich gebeten hast, dir zu zeigen, was dir nach diesen Dingen widerfahren wird, habe ich dir diese Offenbarung gezeigt, damit du erkennst, was dir nach diesen Dingen widerfahren wird.“[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die syrische Überlieferung dieses Satzes ist an dieser Stelle schwer zu lesen. Möglich ist auch: „Weil du mich gebeten hast, dir zu zeigen, was geschehen ist und was geschaffen wurde, ist dir eine erhabene Unterweisung der Erkenntnis gezeigt worden über das, was nach diesen Dingen geschehen wird.“'
    reason: Die vorliegende syrische Textgestalt weicht deutlich von der in älteren Übersetzungen vorausgesetzten Lesart ab; die Fußnote bewahrt diese echte textliche Unsicherheit.
lexical_decisions:
- source_word: ܘܥܢܐ ܘܐܡܪ ܠܝ
  choice: Und er antwortete und sagte zu mir
  rationale: Die formelhafte syrische Redeeinleitung wird bewusst formal und würdevoll wiedergegeben.
- source_word: ܐܦܝܣܬ ܠܝ
  choice: du mich gebeten hast
  rationale: Im Zusammenhang bezeichnet die Form Baruchs an Gott gerichtete Bitte; „gebeten“ ist natürliches modernes Deutsch und vermeidet die engere Deutung „gebetet“.
- source_word: ܓܠܝܢܐ
  choice: Offenbarung
  rationale: Das Wort bezeichnet ein Enthüllen oder Offenbaren. „Offenbarung“ wahrt den apokalyptischen Zusammenhang, ohne den Inhalt als bloßes inneres Bild festzulegen.
- source_word: ܢܓܕܫ
  choice: widerfahren wird
  rationale: Das Verb bezeichnet ein zukünftiges Geschehen, das Baruch betrifft. „Widerfahren“ bewahrt diesen personenbezogenen Zug besser als das allgemeinere „geschehen“.
theological_decisions:
- issue: Art der Mitteilung an Baruch
  choice: Offenbarung
  alternative: Vision
  rationale: „Offenbarung“ hält den Akzent auf dem göttlichen Bekanntmachen; „Vision“ würde die Art der Wahrnehmung stärker festlegen, als es das einschlägige syrische Wort verlangt.
- issue: Bezug des zukünftigen Geschehens
  choice: was dir … widerfahren wird
  alternative: was nach diesen Dingen geschehen wird
  rationale: Der personenbezogene Bezug wird entsprechend der überlieferten Lesart beibehalten; die allgemeinere Alternative bleibt wegen der schwierigen Textüberlieferung möglich.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die semitische Redeeinleitung bleibt erhalten; unnötig altertümliche Formen werden vermieden. Die schwierige Textüberlieferung wird nicht stillschweigend harmonisiert, sondern in einer Fußnote sichtbar gemacht.
