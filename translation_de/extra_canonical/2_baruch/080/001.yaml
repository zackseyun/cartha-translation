  register: Modernes Standarddeutsch in würdigem, gut verständlichem Erzählstil. Die abgebrochene Syntax des schwierigen Versanfangs wird durch Gedankenstriche und Auslassungspunkte sichtbar gehalten statt stillschweigend ergänzt. Wiederholungen und die theologische Spannung zwischen dem Handeln der Engel und dem späteren Vorgehen der Feinde bleiben erhalten.
