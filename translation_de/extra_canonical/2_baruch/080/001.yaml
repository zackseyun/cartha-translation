  source_fidelity: Der Haupttext folgt dem vorliegenden syrischen Text und der englischen Auditspur im Wesentlichen zuverlässig. Am Anfang ist die Überlieferung jedoch syntaktisch beschädigt; »Da wir ... wussten« legt einen bestimmten Sprecher und eine kausale Satzverknüpfung stärker fest, als der fragmentarische Text trägt. Die Gegenstände in der schwierigen Wendung ܡܐ ܛܒܝ̈ܢ sollten im Haupttext nicht ohne Weiteres als »heilige« bestimmt werden.
  naturalness: Der Text ist überwiegend idiomatisches, würdiges modernes Standarddeutsch. Die Wiederholung von »wussten« im ersten Satz wirkt jedoch unnötig schwerfällig. »Ihr wart es, die dort Dienst taten« ist natürlich und dem Register angemessen.
  terminology: »Engel«, »der Höchste«, »Tempel« und »Erniedrigung Zions« sind treffend und registergerecht. »kostbare Gegenstände« bewahrt bei ܡܐ ܛܒܝ̈ܢ die lexikalische Offenheit besser als »heilige Geräte«, ohne den wahrscheinlichen Tempelbezug in der Anmerkung zu verlieren.
  issues:
  - severity: medium
    issue: Der Versanfang wird als kausaler Wir-Satz wiedergegeben.
    rationale: Die erhaltene syrische Form ist lückenhaft und lässt die genaue syntaktische Anbindung sowie das Subjekt nicht sicher erkennen. Eine offen fragmentarische Formulierung vermeidet die zusätzliche Festlegung auf »wir« und »da«.
  - severity: medium
    issue: »die heiligen Geräte« ist im Haupttext zu eng.
    rationale: Die überlieferte Wendung kann allgemein »die guten/kostbaren Dinge« bedeuten. Der Kontext kann Tempelgeräte nahelegen, sichert aber weder »heilig« noch die konkrete Objektart eindeutig; die Deutung gehört in die Fußnote.
  revised_text: 'Zuerst erkannten wir, was geschehen sollte – dass Nebukadnezar, der König von Babylon, es sich zu Herzen genommen hatte …[a] Doch wir wussten, dass kein Befehl aus seinem Mund vergeblich ergehen würde und auch nicht anders, als er es zuvor bestimmt hatte. Denn was zuvor beschlossen worden war, wurde offen sichtbar. Auch mir wurde offenbart, dass Engel gegen die Stadt vorgingen: Sie erschütterten ihre Mauern und rissen sie nieder; auch die mächtige Mauer mit ihren festen eisernen Ecken stürzten sie um. Zu jener Zeit aber verbargen sie die kostbaren Gegenstände,[b] damit die Feinde sie nicht zu Gesicht bekämen.


    Nachdem sie dies getan hatten, übergaben sie den Feinden die zerbrochene Mauer, das geplünderte Haus, den niedergebrannten Tempel und das überwältigte Volk, das weggeführt wurde. So sollten die Feinde sich nicht rühmen und sagen: »Wir haben sogar das Haus des Höchsten umzingelt und es im Kampf niedergeworfen.«


    Auch eure Brüder fesselten sie und führten sie nach Babylon; dort ließen sie sie wohnen. Wir aber und unsere Nachkommen blieben hier zurück, wenige und gering an Zahl. Das ist die Bedrängnis des Volkes, von der ich euch geschrieben habe. Denn ihr wisst gewiss, dass die Erniedrigung Zions schwer auf euch gelastet hat, weil ihr sie besser kanntet als das übrige Volk: Ihr wart es, die dort Dienst taten, während wir Hilfe leisteten.'
  revised_footnotes:
  - marker: a
    text: 'Der syrische Text ist am Anfang schwer verständlich und offenbar lückenhaft. Eine verbreitete Rekonstruktion lautet sinngemäß: »Nun, meine Brüder, erfahrt zuerst, was geschehen sollte: Nebukadnezar, der König von Babylon, hatte sich vorgenommen, gegen die Stadt heraufzuziehen.«'
    reason: Die überlieferte Anfangsform ist syntaktisch unvollständig; die Fußnote dokumentiert eine mögliche Rekonstruktion, ohne sie in den Haupttext einzutragen.
  - marker: b
    text: 'Wörtlich auch: »die guten Dinge«; die Wendung kann kostbare Gegenstände bezeichnen. Im Zusammenhang sind wahrscheinlich Tempelgeräte gemeint.'
    reason: Die syrische Wendung ist lexikalisch mehrdeutig. Der Tempelkontext legt eine konkrete Deutung nahe, sichert sie aber nicht.
  revision_rationale: Die Revision glättet den unsicheren Anfang, ohne seine textkritische Offenheit aufzugeben, und ersetzt die im Haupttext zu spezifische Bezeichnung »heilige Geräte« durch eine semantisch breitere Formulierung. Alle übrigen sachlichen und theologischen Aussagen sowie beide Fußnotenanker bleiben erhalten.
