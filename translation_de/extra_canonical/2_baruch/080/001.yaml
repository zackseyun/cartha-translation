  language: en
  yaml_path: translation/extra_canonical/2_baruch/080/001.yaml
  text: 'Knowing first what was to happen, that Nebuchadnezzar king of Babylon set it in his heart... But we knew that no command from his mouth would go forth in vain, nor otherwise than he had appointed beforehand. For what had been determined beforehand was shown openly. And it was also revealed to me that angels were engaged against the city: they shook its walls and uprooted them, and the mighty wall with its strong iron corners they cast down. But at that time they hid the holy vessels, so that they might not be seen by the enemies.


    And when they had done these things, then they handed over to the enemies the broken wall, the plundered house, the burned temple, and the people who had been overcome and were being carried away, so that the enemies might not boast and say, ‘We have surrounded even the house of the Most High, and in battle we have thrown it down.’


    They also bound your brothers and led them away to Babylon, and there they made them dwell. But we and our seed were left here, few and small. This is the affliction of the people about which I wrote to you. For you surely know that the humiliation of Zion has weighed heavily upon you, because your knowledge of her was greater than that of the people, since you were those who served there, while we were helping.'
translation:
  language: de
  text: 'Zuerst erkannten wir, was geschehen sollte – dass Nebukadnezar, der König von Babylon, es sich zu Herzen genommen hatte …[a] Doch wir wussten, dass kein Befehl aus seinem Mund vergeblich ergehen würde und auch nicht anders, als er es zuvor bestimmt hatte. Denn was zuvor beschlossen worden war, wurde offen sichtbar. Auch mir wurde offenbart, dass Engel gegen die Stadt vorgingen: Sie erschütterten ihre Mauern und rissen sie nieder; auch die mächtige Mauer mit ihren festen eisernen Ecken stürzten sie um. Zu jener Zeit aber verbargen sie die kostbaren Gegenstände,[b] damit die Feinde sie nicht zu Gesicht bekämen.


    Nachdem sie dies getan hatten, übergaben sie den Feinden die zerbrochene Mauer, das geplünderte Haus, den niedergebrannten Tempel und das überwältigte Volk, das weggeführt wurde. So sollten die Feinde sich nicht rühmen und sagen: »Wir haben sogar das Haus des Höchsten umzingelt und es im Kampf niedergeworfen.«


    Auch eure Brüder fesselten sie und führten sie nach Babylon; dort ließen sie sie wohnen. Wir aber und unsere Nachkommen blieben hier zurück, wenige und gering an Zahl. Das ist die Bedrängnis des Volkes, von der ich euch geschrieben habe. Denn ihr wisst gewiss, dass die Erniedrigung Zions schwer auf euch gelastet hat, weil ihr sie besser kanntet als das übrige Volk: Ihr wart es, die dort Dienst taten, während wir Hilfe leisteten.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der syrische Text ist am Anfang schwer verständlich und offenbar lückenhaft. Eine verbreitete Rekonstruktion lautet sinngemäß: »Nun, meine Brüder, erfahrt zuerst, was geschehen sollte: Nebukadnezar, der König von Babylon, hatte sich vorgenommen, gegen die Stadt heraufzuziehen.«'
    reason: Die überlieferte Anfangsform ist syntaktisch unvollständig; die Fußnote dokumentiert eine mögliche Rekonstruktion, ohne sie in den Haupttext einzutragen.
  - marker: b
    text: 'Wörtlich auch: »die guten Dinge«; die Wendung kann kostbare Gegenstände bezeichnen. Im Zusammenhang sind wahrscheinlich Tempelgeräte gemeint.'
    reason: Die syrische Wendung ist lexikalisch mehrdeutig. Der Tempelkontext legt eine konkrete Deutung nahe, sichert sie aber nicht.
lexical_decisions:
- source_word: ܡܠܐܟ̈ܐ
  choice: Engel
  rationale: Die übermenschlichen Akteure handeln im apokalyptischen Zusammenhang gegen die Stadt; »Engel« bewahrt diese Aussage deutlicher als das ebenfalls mögliche »Boten«.
- source_word: ܫܘܪ̈ܝܗ̇ / ܫܘܪܝܐ ܕܒܪܝܬܐ
  choice: ihre Mauern … die mächtige Mauer
  rationale: »Mauern« ist die natürliche Bezeichnung der Befestigungen; die zweite Wendung wahrt die Steigerung des beschädigt überlieferten Textes.
- source_word: ܡܐ ܛܒܝ̈ܢ
  choice: die heiligen Geräte
  rationale: Wörtlich ist auch »die guten/kostbaren Dinge« möglich; im Tempelzusammenhang liegt der Bezug auf die heiligen Geräte nahe, ohne dass die Alternative verschwiegen wird.
- source_word: ܐܫܠܡܘ
  choice: übergaben
  rationale: Das Verb bezeichnet die Auslieferung in fremde Gewalt und passt sowohl zum gerichtlichen als auch zum erzählerischen Zusammenhang.
- source_word: ܚܘܪܐ
  choice: das geplünderte Haus
  rationale: Die Überlieferung ist an dieser Stelle rau; »geplündert« fügt sich in die Folge von zerbrochener Mauer, geschädigtem Haus und verbranntem Tempel.
- source_word: ܡܟܝܟ
  choice: Erniedrigung
  rationale: Das Wort beschreibt Zions öffentliches Herabgebrachtwerden; »Erniedrigung« ist im modernen Deutschen würdig und klar.
theological_decisions:
- issue: Wer die Befestigungen der Stadt zu Fall bringt
  choice: Himmlische Akteure handeln zuerst; danach wird die Stadt den Feinden übergeben.
  alternative: Allein die Babylonier zerstören die Stadt, oder die Engel sind nur metaphorisch gemeint.
  rationale: Der syrische Text nennt die Engel ausdrücklich und stellt die Einnahme der Stadt als Folge göttlichen Gerichts und göttlicher Zulassung dar.
- issue: Warum die Tempelgeräte verborgen werden
  choice: Die heiligen Gegenstände werden den Blicken der Feinde entzogen, sodass diese keinen Sieg über das Eigentum des Höchsten beanspruchen können.
  alternative: Es geht lediglich um gewöhnliche Wertgegenstände und praktische Sicherung vor Plünderung.
  rationale: Der unmittelbare Zusammenhang verbindet das Verbergen mit der Abwehr des feindlichen Ruhmes; die lexikalische Mehrdeutigkeit wird dennoch in einer Fußnote erhalten.
