  rationale: Die demonstrative Zeitangabe wird bewahrt und passt zum würdigen apokalyptischen Erzählregister.
- source_word: ܐܡܝܪ
  choice: wurde gesagt
  rationale: Die unpersönliche Passivform entspricht dem sichtbaren syrischen Wortlaut, ohne einen Sprecher zu ergänzen.
