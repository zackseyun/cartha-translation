  text: And the holy land shall have mercy on its own, and at that time it shall protect its inhabitants.
translation:
  language: de
  text: Und das heilige Land wird sich der Seinen erbarmen, und zu jener Zeit wird es seine Bewohner beschützen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܥܐ ܩܕܝܫܬܐ
  choice: das heilige Land
  rationale: Bewahrt die apokalyptische Personifikation des Landes und ihre theologische Bedeutung in natürlichem, traditionsnahem Deutsch.
- source_word: ܬܪܚܡ
  choice: wird sich … erbarmen
  rationale: Gibt die aktive Zuwendung und das Erbarmen des Verbs wieder, ohne es zu bloßem Mitgefühl abzuschwächen.
- source_word: ܕܝܠܗ̇
  choice: der Seinen
  rationale: Drückt knapp aus, dass es um die Menschen geht, die zu dem personifizierten Land gehören, ohne diese Beziehung ausdeutend zu erweitern.
- source_word: ܬܢܛܪ
  choice: wird … beschützen
  rationale: Vermittelt das schützende Bewahren klar und würdig; die Bewohner werden als ausdrückliches Objekt beibehalten.
theological_decisions:
- issue: Das Land als handelndes Subjekt
  choice: Das heilige Land erbarmt sich und beschützt
  alternative: Gott erbarmt sich durch das Land oder erbarmt sich des Volkes
  rationale: Die syrische Überlieferung personifiziert das Land. Diese apokalyptische Bildsprache wird bewahrt und nicht in eine ausdrückliche Aussage über unmittelbares göttliches Handeln umgeformt.
- issue: Beziehung zwischen dem Land und »den Seinen«
  choice: der Seinen
  alternative: seines Volkes / derer, die zu ihm gehören
  rationale: Die knappe Zugehörigkeitsformulierung wahrt die Offenheit des Ausdrucks und vermeidet eine sachlich mögliche, aber stärker deutende Festlegung auf »Volk«.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Personifikation des Landes bleibt bewusst erhalten. Das vorangestellte »Und« wahrt den fortlaufenden Zusammenhang des Verses.
