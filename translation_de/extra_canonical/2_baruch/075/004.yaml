lexical_decisions:
- source_word: ܡܚ̈ܫܒܬܐ
  choice: Gedanken
  rationale: Gibt den syrischen Begriff für Gedanken bzw. Erwägungen direkt und natürlich wieder.
- source_word: ܡ̣ܕܐ / Zähl-Ausdruck (Textüberlieferung undeutlich)
  choice: zählen
  rationale: Folgt dem im Kontrolltext erkennbaren Sinn des Erfassens durch Zählen und bewahrt die rhetorische Aussage von Gottes Unergründlichkeit.
- source_word: Ausdruck für ‚dein Sinn‘ (im Seitentext beschädigt bzw. undeutlich)
  choice: deines Geistes
  rationale: Im Deutschen ist dies eine würdige und verständliche Wiedergabe für den inneren, denkenden Sinn; „Verstand“ wäre enger und rationalistischer.
theological_decisions:
- issue: Unergründlichkeit der göttlichen Gedanken
  choice: Die rhetorische Frage bleibt uneingeschränkt stehen.
  alternative: Eine erklärende Wiedergabe wie „Niemand kann …“
  rationale: Die Frageform des Textes bewahrt sowohl die Aussagekraft als auch die poetisch-theologische Spannung, ohne sie auszulegen.
translation_notes:
  register: Knapp, rhetorisch und würdig. Die Formulierung ist modernes Standarddeutsch und hält sich eng an die überlieferte Aussage.
