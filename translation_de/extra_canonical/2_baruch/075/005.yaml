  text: Or who among those born can hope to come to these things, unless it is one to whom you show mercy and are gracious?
translation:
  language: de
  text: Oder wer unter den Geborenen kann hoffen, zu diesen Dingen zu gelangen, außer einem, dessen du dich erbarmst und dem du gnädig bist?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܝܢܐ ܡܢ ܝܠܝܕ̈ܐ
  choice: wer unter den Geborenen
  rationale: Die personale Frage wird im Deutschen idiomatisch mit „wer unter“ wiedergegeben; „die Geborenen“ bewahrt die umfassende Bezeichnung sterblicher Menschen.
- source_word: ܢܣܒܪ ... ܕܢܡܛܐ
  choice: kann hoffen, … zu gelangen
  rationale: Bewahrt sowohl den Gedanken der Hoffnung als auch das Erreichen des genannten Zieles.
- source_word: ܬܪܚܡ ... ܘܬܚܢ
  choice: dessen du dich erbarmst und dem du gnädig bist
  rationale: Die beiden parallelen Aussagen über Gottes Erbarmen und Gnade bleiben unterschieden, ohne sie zu einer einzigen theologischen Formel zusammenzuziehen.
theological_decisions:
- issue: Abhängigkeit des Menschen von göttlichem Erbarmen und göttlicher Gnade
  choice: „außer einem, dessen du dich erbarmst und dem du gnädig bist“
  alternative: „wenn du dich seiner nicht erbarmst und ihm nicht gnädig bist“
  rationale: 'Die Ausnahmeformulierung bewahrt die zugespitzte rhetorische Aussage: Das erhoffte Ziel ist nur aufgrund göttlicher Zuwendung erreichbar.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und der Parallelismus von Erbarmen und Gnade wurden bewahrt; der Satz bleibt gut verständlich, ohne die theologische Spannung aufzulösen.
