  text: For unless, in compassion, you have mercy on human beings, those who are under your right hand cannot come to these things, except those who are called in the excellent number.
translation:
  language: de
  text: Denn wenn du dich nicht in deinem Erbarmen der Menschen erbarmst, können diejenigen, die unter deiner rechten Hand stehen, nicht zu diesen Dingen gelangen, ausgenommen die, die zur erlesenen Zahl berufen sind.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die Formulierung „zur erlesenen Zahl berufen“ kann auch im Sinn von „zu der ausgezeichneten Zahl gehörig“ verstanden werden.
    reason: Die knappe Gruppen- und Zählvorstellung lässt offen, ob Berufung oder Zugehörigkeit im Vordergrund steht.
lexical_decisions:
- source_word: ܡܪܚܡܢܘܬܐ / compassion (textual sense reflected by the control tradition)
  choice: in deinem Erbarmen
  rationale: Gibt den Grund oder Bereich des göttlichen Erbarmens wieder, ohne Mitgefühl und tätige Barmherzigkeit künstlich voneinander zu trennen.
- source_word: ܝܡܝܢܐ
  choice: rechte Hand
  rationale: Bewahrt das konkrete biblische Bild für Schutz, Macht und Zugehörigkeit.
- source_word: ܡܢܝܢܐ
  choice: Zahl
  rationale: Erhält die kollektive und möglicherweise eschatologische Zählvorstellung, statt sie deutend durch „Schar“ oder „Gemeinschaft“ zu ersetzen.
- source_word: excellent / choice number (control reading)
  choice: erlesene Zahl
  rationale: „Erlesen“ gibt die positive Auszeichnung natürlich wieder, ohne eine bestimmte Lehre über Erwählung festzuschreiben.
theological_decisions:
- issue: Verhältnis von göttlichem Erbarmen und menschlichem Zugang
  choice: 'Die konditionale Aussage bleibt stehen: Ohne Gottes Erbarmen ist der Zugang nicht möglich.'
  alternative: Die Aussage als uneingeschränkte Heilszusage oder als rein menschliche Leistung umzuformulieren.
  rationale: Der Vers verbindet Gottes Erbarmen mit dem Zugang zu den angekündigten Dingen und lässt zugleich die Ausnahme der Berufenen spannungsvoll bestehen.
- issue: Bedeutung der „erlesenen Zahl“
  choice: Die Gruppenbezeichnung bleibt wörtlich und offen.
  alternative: Sie ausdrücklich mit Israel, den Erwählten oder einer bestimmten endzeitlichen Gruppe gleichzusetzen.
  rationale: Der unmittelbare Wortlaut legt keine eindeutige konfessionelle oder systematische Identifikation fest.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung „Erbarmen … erbarmst“ ist bewusst beibehalten, weil sie die rhetorische Verdichtung des Ausgangssinns trägt; der Gedankenstrich macht die schwierige Ausnahme syntaktisch verständlich.
