  naturalness: 'Die Ausnahme ist im Entwurf syntaktisch missglückt: „außer denen“ kann sich nicht klar und idiomatisch auf die von der Verneinung ausgenommene Personengruppe beziehen. „ausgenommen die, die …“ stellt die Ausnahme im modernen Standarddeutsch eindeutig her.'
  terminology: „Erbarmen“, „rechte Hand“ und „erlesene Zahl“ sind angemessen. „zur erlesenen Zahl berufen“ ist idiomatischer als „zu der …“. Die Fußnote soll die mögliche Zugehörigkeitsnuance bewahren, ohne den Haupttext umzudeuten.
