  text: And I answered and said, “Who can comprehend your goodness, Lord? For it is beyond comprehension.”
translation:
  language: de
  text: 'Und ich antwortete: »Wer kann deine Güte erfassen, Herr? Denn sie übersteigt alles Verstehen.[a]«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: »Denn sie ist unbegreiflich.«'
    reason: Bewahrt als formnähere Alternative den adjektivischen Ausdruck der Unerfassbarkeit.
lexical_decisions:
- source_word: ܛܒܬܐ
  choice: Güte
  rationale: „Güte“ bezeichnet die göttliche Eigenschaft umfassend und würdevoll, ohne sie auf Freundlichkeit oder einzelne Wohltaten zu verengen.
- source_word: ܡܬܬܚܡܐ
  choice: übersteigt alles Verstehen
  rationale: Die Formulierung gibt die Aussage der Unerfassbarkeit in natürlichem modernem Deutsch wieder und knüpft zugleich an das Verb „erfassen“ in der Frage an.
theological_decisions:
- issue: Bezug der Aussage über das Unerfassbare
  choice: Das Pronomen „sie“ bezieht die Unerfassbarkeit auf Gottes Güte.
  alternative: Gott selbst ist unbegreiflich.
  rationale: Der unmittelbare Satzbau und die überlieferte Lesart stützen den Bezug auf die zuvor genannte Güte. Die Formulierung vermeidet dennoch eine weitergehende dogmatische Ausdeutung.
translation_notes:
  register: Modernes, würdevolles Gebetsdeutsch. „Erfassen“ und „Verstehen“ bilden eine klare Sinnverbindung; die direkte Anrede „Herr“ bleibt erhalten.
