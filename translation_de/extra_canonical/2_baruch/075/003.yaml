lexical_decisions:
- source_word: ܣܘܟܠܐ
  choice: Einsicht
  rationale: Das syrische Wort bezeichnet Verstehen, Einsicht oder Erkenntnisvermögen. „Einsicht“ klingt im Deutschen natürlich und wahrt hier den Bezug auf Gottes unergründliches Verstehen.
- source_word: ܨ̇ܐܪ
  choice: erfassen
  rationale: Das Verb kann ein gedankliches Begreifen oder Erfassen ausdrücken. „Erfassen“ bewahrt die rhetorische Aussage, dass Gottes Einsicht menschlichem Begreifen entzogen ist.
theological_decisions:
- issue: Unergründlichkeit der göttlichen Einsicht
  choice: Die Frage bleibt als offene rhetorische Frage formuliert.
  alternative: „Niemand kann deine Einsicht erfassen.“
  rationale: Die Frageform des Syrischen wird bewahrt und nicht in eine ausdrückliche dogmatische Feststellung umgewandelt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; knapp und entsprechend der parallelen rhetorischen Fragen des Zusammenhangs formuliert.
