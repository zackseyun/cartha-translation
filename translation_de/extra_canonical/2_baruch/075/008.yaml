  yaml_path: translation/extra_canonical/2_baruch/075/008.yaml
  text: But if we do not now know why we came, and do not recognize what has been, neither shall the immeasurable be seen, nor shall the preeminence of him who established it from the beginning be made known; and not a few living creatures would be astonished.”
translation:
  language: de
  text: '**2 Baruch 75,8**


    Wenn wir aber jetzt nicht wissen, weshalb wir gekommen sind, und nicht erkennen, was geschehen ist,[a] dann wird weder das Unermessliche sichtbar werden noch die Erhabenheit dessen bekannt werden, der es von Anfang an begründet hat;[b] und dann würden nicht wenige Lebewesen staunen.[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich bzw. ebenso möglich: „was gewesen ist“. Gemeint sein kann das bisher Geschehene, ohne dass der Satz es näher bestimmt.'
    reason: Die zeitliche und sachliche Reichweite der Wendung ist mehrdeutig.
  - marker: b
    text: Der Bezug von „es“ ist nicht eindeutig; ebenso kann „Erhabenheit“ im Sinn von Vorrang oder überragender Größe verstanden werden.
    reason: Bewahrt zwei echte syntaktische und lexikalische Unbestimmtheiten.
  - marker: c
    text: „Lebewesen“ kann auch allgemeiner mit „lebende Wesen“ oder „Geschöpfe“ wiedergegeben werden.
    reason: Der Umfang der bezeichneten Gruppe bleibt offen.
lexical_decisions:
- source_word: what has been
  choice: was geschehen ist
  rationale: Die Formulierung bewahrt den rückblickenden und zugleich offenen Sinn, ohne genauer festzulegen, ob ein einzelnes Ereignis oder die bisherige Geschichte gemeint ist.
- source_word: the immeasurable
  choice: das Unermessliche
  rationale: Die substantivierte Form erhält die Abstraktheit und bestimmt nicht vorschnell, ob Gottes Wesen, sein Ratschluss oder eine andere unergründliche Wirklichkeit gemeint ist.
- source_word: preeminence
  choice: Erhabenheit
  rationale: „Erhabenheit“ ist im Deutschen natürlich und würdevoll und kann sowohl überragende Größe als auch Vorrang ausdrücken, ohne eine technische Rangordnung einzuführen.
- source_word: established
  choice: begründet hat
  rationale: „Begründet“ kann das Ins-Dasein-Setzen oder feste Gründen ausdrücken; es vermeidet eine unnötig konkrete Vorstellung von bloßem Aufstellen.
- source_word: living creatures
  choice: Lebewesen
  rationale: Der umfassende Ausdruck lässt offen, ob Menschen, andere Geschöpfe oder alle lebenden Wesen gemeint sind.
theological_decisions:
- issue: Bezug von „es“ in „der es von Anfang an begründet hat“
  choice: Das Pronomen bleibt stehen und sein Bezug bleibt offen.
  alternative: Den Bezug ausdrücklich als „das Unermessliche“, „die Welt“ oder „alles“ bestimmen.
  rationale: Der überlieferte Satz bietet keinen hinreichend sicheren Anlass, den Bezug dogmatisch oder kosmologisch festzulegen.
- issue: Identität dessen, der von Anfang an begründet hat
  choice: „dessen“ ohne erklärenden Gottesnamen
  alternative: „Gottes, der …“
  rationale: Obwohl der Satz wahrscheinlich auf Gott zielt, bewahrt die Übersetzung die indirekte Bezeichnung der Vorlage und fügt keine ausdrückliche Identifikation hinzu.
- issue: Modalität des letzten Satzteils
  choice: „würden staunen“
  alternative: „werden staunen“
  rationale: Der Konjunktiv erhält die in der konsultierten Überlieferung erkennbare modale Spannung und glättet sie nicht zu einer sicheren Zukunftsaussage.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzführung. Die abstrakte und spannungsreiche Argumentation wird nicht konfessionell erläutert oder inhaltlich vereindeutigt. Da der bereitgestellte syrische Kapitelbereich den Zielvers nicht zuverlässig und fortlaufend isoliert, wurde die geprüfte englische POB-Fassung als Konsultationsschicht genutzt und ihre erkennbaren Mehrdeutigkeiten wurden ausdrücklich bewahrt.
