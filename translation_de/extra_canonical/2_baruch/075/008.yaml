  terminology: „das Unermessliche“, „Erhabenheit“, „begründet“ und „Lebewesen“ sind tragfähige, nicht konfessionell einengende Wiedergaben. Die Anmerkungen bewahren relevante Offenheiten, insbesondere den Umfang von „was gewesen ist“, den Bezug von „es“ und die Tragweite von „Lebewesen“.
