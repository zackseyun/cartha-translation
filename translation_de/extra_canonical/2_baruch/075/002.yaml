  text: Oder wer kann deine Erbarmungen ergründen, die kein Ende haben?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܨܐ
  choice: ergründen
  rationale: Das syrische Verb bezeichnet ein prüfendes Suchen oder Erforschen; „ergründen“ gibt hier sowohl die geistige Suche als auch deren letztliche Begrenztheit natürlich wieder.
- source_word: ܪ̈ܚܡܝܟ (im vorliegenden Seitenzeugnis offenbar verderbt bzw. OCR-beschädigt)
  choice: deine Erbarmungen
  rationale: Der kontrollierte Verszusammenhang stützt die Bedeutung „deine Erbarmungen/Gnadenerweise“. Der Plural wird bewahrt; „Erbarmungen“ ist im Deutschen würdevoll und näher am semitischen Ausdruck als ein abstrakter Singular.
- source_word: ܕܠܐ ܡܣܬܝܟܝܢ
  choice: die kein Ende haben
  rationale: Wörtlich geht es um etwas Unbegrenztes oder nicht Begrenzbares. Die Formulierung wahrt diesen Sinn in natürlichem modernem Deutsch.
theological_decisions:
- issue: Unbegrenztheit der göttlichen Erbarmungen
  choice: „die kein Ende haben“
  alternative: „die unergründlich sind“
  rationale: Die Übersetzung unterscheidet zwischen dem Ergründen im Hauptsatz und der im Relativsatz ausgesagten Grenzenlosigkeit. So wird die Aussage nicht zu einer bloßen Wiederholung abgeschwächt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die rhetorische Frage und der Plural „Erbarmungen“ bleiben erhalten; unnötige konfessionelle Terminologie wird vermieden.
