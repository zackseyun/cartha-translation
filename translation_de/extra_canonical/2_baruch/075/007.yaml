  yaml_path: translation/extra_canonical/2_baruch/075/007.yaml
  text: But we who live—if we know why we came, and submit ourselves to him who brought us out from Egypt—we shall come again, and we shall remember what has passed, and rejoice over what was.
translation:
  language: de
  text: Wir aber, die wir leben[a] – wenn wir wissen, warum wir gekommen sind, und uns dem unterordnen[b], der uns aus Ägypten herausgeführt[c] hat –, werden wiederkommen. Dann werden wir uns an das Vergangene erinnern und uns über das freuen, was gewesen ist.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die wir am Leben sind“.'
    reason: Die Alternative verdeutlicht den zuständlichen Sinn des syrischen Ausdrucks, ohne ihn als bloßes „Übrigbleiben“ misszuverstehen.
  - marker: b
    text: 'Oder: „uns ihm unterworfen haben“.'
    reason: Die syrische Partizipialform kann im Deutschen je nach Kontext auch mit einer resultativen Nuance wiedergegeben werden; im Haupttext steht wegen der Parallelität zu „wissen“ die gegenwärtige Form.
  - marker: c
    text: 'Wörtlicher auch: „herausgebracht“.'
    reason: Das syrische Verb bezeichnet das Herausbringen beziehungsweise Herausführen; die Fußnote dokumentiert die engere lexikalische Wiedergabe.
lexical_decisions:
- source_word: ܚܝܝܢ (ḥayyīn)
  choice: die wir leben
  rationale: Das syrische Verb bezeichnet das Leben beziehungsweise Am-Leben-Sein, nicht bloß ein Verbleiben. Die Formulierung gibt den fortdauernden Zustand natürlich wieder.
- source_word: ܡܫܥܒܕܝܢܢ (mšaʿbdīnan)
  choice: uns … unterordnen
  rationale: Die partizipiale Form bezeichnet eine gegenwärtige, fortdauernde Haltung und steht parallel zu „wissen“. „Unterordnen“ bewahrt den Gedanken freiwilliger Unterstellung, ohne ihn konfessionell auszudeuten.
- source_word: ܐܦܩ (appeq)
  choice: herausgeführt
  rationale: Das Verb aus der Wurzel npq bedeutet „herausbringen/herausführen“. Im Zusammenhang mit Ägypten ist „herausgeführt“ idiomatisch und hält den Exodusbezug fest.
- source_word: ܢܗܦܘܟ / Rückkehrverb (nach der konsultierten Versüberlieferung)
  choice: werden wiederkommen
  rationale: Die Wiedergabe erhält die räumlich beziehungsweise heilsgeschichtlich offenbleibende Aussage der Rückkehr, ohne ihr Ziel hinzuzufügen.
theological_decisions:
- issue: Bezug des Herausführens aus Ägypten
  choice: der uns aus Ägypten herausgeführt hat
  alternative: eine ausdrückliche Benennung Gottes oder des Herrn
  rationale: Das Pronomen bleibt wie in der Überlieferung unaufgelöst. Der Exodusbezug ist deutlich, doch eine im Satz nicht ausdrücklich stehende Gottesbezeichnung wird nicht ergänzt.
- issue: Bedeutung des Wiederkommens
  choice: werden wiederkommen
  alternative: werden zurückkehren beziehungsweise auferstehen
  rationale: Die Aussage wird nicht auf eine bestimmte eschatologische Deutung festgelegt; die genuine Offenheit des Rückkehrverbs bleibt erhalten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Gedankenstriche gliedern den langen Bedingungssatz; der anschließende Satz wird zur besseren Verständlichkeit geteilt. Die Wiederholung „Vergangene … gewesen ist“ bleibt bewusst erhalten, da sie die rückblickende Spannung des Ausgangstextes wahrt.
