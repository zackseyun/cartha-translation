  terminology: „aus Ägypten herausgeführt“ gibt den Exodusbezug präzise wieder. „uns dem unterordnen“ trifft die fortdauernde Haltung, ohne eine konfessionelle Deutung einzutragen. Die Fußnoten sind sinnvoll am jeweiligen Ausdruck verankert und widersprechen dem Haupttext nicht.
