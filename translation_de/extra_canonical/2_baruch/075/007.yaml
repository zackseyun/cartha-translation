  source_fidelity: 'Der unmittelbar bereitgestellte syrische Seitenkontext ist als überlappender Kapitel-Bucket ausgewiesen und enthält den Wortlaut von V. 75,7 nicht zuverlässig isolierbar. Gegen die englische, dokumentierte Audit-Fassung entspricht der deutsche Text jedoch sämtlichen tragenden Aussagen: die Lebenden, Wissen um den Grund des Kommens, gegenwärtige Unterordnung unter den aus Ägypten Herausführenden, Wiederkommen, Erinnerung an das Vergangene und Freude über das Gewesene. Die Formulierung lässt das Subjekt von „herausgeführt hat“ ebenso unbenannt wie die Vorlage und legt das Wiederkommen nicht eschatologisch fest.'
