  text: Does one who sets out on a road fail to find it? Or can one who sails on the sea find rest unless he reaches the harbor?
translation:
  language: de
  text: Findet etwa jemand, der sich auf einen Weg macht, ihn nicht? Oder kann jemand, der über das Meer fährt, Ruhe finden, ohne den Hafen zu erreichen?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܙܠ ܒܐܘܪܚܐ
  choice: sich auf einen Weg macht
  rationale: Gibt die Bewegung auf einem Weg in natürlichem, modernem Deutsch wieder, ohne das Bild abzuschwächen.
- source_word: ܡܫܟܚ ܠܗ̇
  choice: ihn finden
  rationale: Bewahrt den pronominalen Rückbezug auf den Weg und die auffällige rhetorische Form des Syrischen.
- source_word: ܦܪܫ ܒܝܡܐ
  choice: über das Meer fährt
  rationale: Das Verb bezeichnet hier das Aufbrechen bzw. Reisen zur See; „fährt“ ist im Deutschen idiomatisch und bildgetreu.
- source_word: ܢܬܢܝܚ
  choice: Ruhe finden
  rationale: Bewahrt die Bedeutung von Ruhen bzw. Erleichterung finden und passt zum Bild der Ankunft im Hafen.
- source_word: ܠܡܐܢܐ
  choice: den Hafen
  rationale: Direkte und eindeutige Wiedergabe des Zielorts einer Seereise.
