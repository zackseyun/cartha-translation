  verdict: revise
  source_fidelity: Der Entwurf trifft die Satzstruktur und die befremdliche rhetorische Verknüpfung von schmerzloser Geburt und einem toten bzw. getöteten Kind im Wesentlichen. Das syrische ܠܐ ܡܣܒܪܐ bedeutet jedoch unmittelbar „erwartet sie nicht?“; „muss ... rechnen“ fügt eine Nuance der Notwendigkeit hinzu, die der Text nicht ausdrücklich hat. ܒܥܘܒܗ̇ bezeichnet präzise ihren Mutterleib/Schoß.
  naturalness: „Erwartet ... nicht“ ist in einer rhetorischen Frage modernes, klares Standarddeutsch und bewahrt die Aussage besser als die modal gefärbte Wendung „muss ... rechnen“.
  terminology: „Mutterleib“ gibt ܥܘܒܐ präziser wieder. „Totes Kind“ ist kontextuell gut verständlich; die Fußnote soll kenntlich machen, dass ܩܛܝܠܐ wörtlicher einen „Getöteten/Erschlagenen“ bezeichnet und damit stärker markiert ist.
