translation:
  language: de
  text: Oder erwartet eine schwangere Frau, wenn sie ohne Schmerzen gebiert, nicht ein totes Kind in ihrem Mutterleib?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Wörtlich steht anstelle von „ein totes Kind“ „einen Getöteten“ bzw. „einen Erschlagenen“. Der syrische Wortlaut ist an dieser Stelle ungewöhnlich.
    reason: Die Fußnote weist auf die auffällige, stärkere Lexik von ܩܛܝܠܐ hin, während der Haupttext die im Schwangerschaftskontext naheliegende Bedeutung verständlich wiedergibt.
lexical_decisions:
- source_word: ܐܢܬܬܐ ܕܒܛܢܐ
  choice: eine schwangere Frau
  rationale: Die syrische Wendung bezeichnet wörtlich eine Frau, die schwanger ist; die knappe moderne Formulierung gibt dies natürlich wieder.
- source_word: ܠܐ ܡܣܒܪܐ
  choice: muss … nicht mit … rechnen?
  rationale: Das negierte Verb in der rhetorischen Frage bedeutet hier etwa „erwartet sie nicht?“; „mit etwas rechnen“ ist im Deutschen in diesem bedrohlichen Zusammenhang idiomatisch.
- source_word: ܩܛܝܠܐ
  choice: ein totes Kind
  rationale: Das substantivierte Wort bedeutet wörtlich „ein Getötetes/ein Toter“. Im Zusammenhang von Schwangerschaft und Geburt ist ein totes Kind gemeint.
- source_word: ܒܥܘܒܗ̇
  choice: in ihrem Leib
  rationale: Das syrische Wort kann den Schoß beziehungsweise Mutterleib bezeichnen; „Leib“ bewahrt die Bildsprache ohne unnötige medizinische Präzisierung.
theological_decisions:
- issue: Rhetorische Aussage über Geburtsschmerz und Tod
  choice: Die befremdliche Verknüpfung von schmerzloser Geburt und der Erwartung eines toten Kindes wird unverändert bewahrt.
  alternative: Die Aussage durch eine sinnglättende Deutung über Geburtswehen oder überstandene Schmerzen ersetzen.
  rationale: Der überlieferte syrische Wortlaut ist ungewöhnlich, aber verständlich genug; eine Harmonisierung würde eine nicht ausdrücklich vorhandene Deutung in den Text eintragen.
translation_notes:
  register: Moderne, würdevolle Standardsprache. Die rhetorische Frage und ihre befremdliche Spannung bleiben erhalten; „muss … nicht mit … rechnen?“ macht die im Syrischen ausdrücklich negierte Erwartungsfrage im Deutschen klar.
