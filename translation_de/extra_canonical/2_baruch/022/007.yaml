    rationale: „ein Getötetes“ ist im Deutschen hier grammatisch und idiomatisch weniger passend; als maskulines substantiviertes Partizip lautet es „einen Getöteten“. Die Deutung „totes Kind“ sollte als kontextuelle Wiedergabe markiert bleiben.
