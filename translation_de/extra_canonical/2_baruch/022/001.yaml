  text: 'And it happened after these things, and behold, I heard a voice, and I saw a might fixed upon me. And a voice was heard from on high and said to me:'
translation:
  language: de
  text: '1 Danach geschah es: Siehe, ich hörte eine Stimme, und ich sah eine Macht, die auf mir ruhte. Eine Stimme aus der Höhe war zu hören und sprach zu mir:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܗܘܐ ܡܢ ܒܬܪ ܗܠܝܢ
  choice: Danach geschah Folgendes
  rationale: Gibt die syrische Übergangsformel idiomatisch und würdig wieder, ohne ihren erzählerischen Charakter zu verlieren.
- source_word: ܚܝܠܐ
  choice: Macht
  rationale: Das Wort bezeichnet Kraft, Macht oder eine machtvolle Erscheinung. „Macht“ wahrt hier die personale beziehungsweise visionäre Offenheit besser als das abstraktere „Kraft“.
- source_word: ܕܐܬܩܒܥ ܠܝ
  choice: die sich auf mich niederließ
  rationale: Die passive Verbalform bezeichnet ein Festgesetzt- oder Bestimmtwerden; zusammen mit der Dativpräposition ist die genaue räumliche beziehungsweise relationale Nuance unsicher. Die gewählte Fassung folgt dem visionären Zusammenhang und bleibt durch eine Fußnote transparent.
- source_word: ܡܢ ܡܪܘܡܐ
  choice: aus der Höhe
  rationale: Entspricht der räumlich-theologischen Ausdrucksweise des Syrischen, ohne ausdrücklich „Himmel“ einzusetzen.
theological_decisions:
- issue: Art der wahrgenommenen Macht
  choice: eine Macht
  alternative: eine Kraft / ein himmlisches Heer
  rationale: Der syrische Ausdruck legt nicht eindeutig fest, ob eine abstrakte Kraft, eine machtvolle Gegenwart oder ein himmlisches Wesen gemeint ist. Die Übersetzung lässt diese Spannung bestehen.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit erzählerischem Rhythmus. „Siehe“ bewahrt das Offenbarungssignal des syrischen ܗܐ; die Wiederholung von „Stimme“ bleibt entsprechend dem Ausgangstext erhalten.
