  text: Or if someone plants a vineyard, unless he takes from it fruit for nourishment, does not the one who planted it expect to take fruit from it?
translation:
  language: de
  text: Oder pflanzt jemand einen Weinberg, ohne von ihm Früchte zu nehmen, um sich zu ernähren? Erwartet nicht der, der ihn gepflanzt hat, von ihm Früchte zu nehmen?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܨܒ ܟܪܡܐ
  choice: einen Weinberg pflanzt
  rationale: Gibt die geläufige syrische Verbindung aus „pflanzen“ und „Weinberg“ direkt und natürlich wieder.
- source_word: ܦܐܪ̈ܐ
  choice: Früchte
  rationale: Der Plural wird bewahrt; im Zusammenhang bezeichnet er den Ertrag des Weinbergs.
- source_word: ܕܢܬܪܣܐ
  choice: um sich zu ernähren
  rationale: Das Verb bezeichnet Ernährung beziehungsweise Unterhalt; die reflexive finale Wiedergabe passt hier zur Person, die vom Ertrag lebt.
- source_word: ܡܣܒܪ
  choice: erwartet
  rationale: Im Kontext ist die Erwartung des Pflanzenden gemeint, nicht bloß eine unbestimmte Hoffnung.
theological_decisions:
- issue: Bildhafte Aussage und rhetorische Frage
  choice: Die landwirtschaftliche Metapher bleibt ohne theologische Ausdeutung stehen.
  alternative: Den Weinberg oder seine Frucht ausdrücklich auf Gottes Handeln oder menschlichen Lohn beziehen.
  rationale: Der Vers selbst formuliert nur das Bild; seine weiterführende Bedeutung soll nicht konfessionell oder interpretierend festgelegt werden.
- issue: Logische Beziehung der ersten Satzhälfte
  choice: ܐܠܐ wird als adversatives „aber“ wiedergegeben, während die abschließende Aussage als rhetorische Frage formuliert wird.
  alternative: „es sei denn, er nimmt …“
  rationale: Der überlieferte syrische Satz ist syntaktisch gedrängt. Die gewählte Fassung erhält die Spannung zwischen Pflanzen, ausbleibender Nutzung und erwarteter Frucht, ohne den Gedankengang unnötig zu glätten.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Wiederholung von „pflanzen“ und „Früchte nehmen“ folgt bewusst der rhetorischen Struktur des Syrischen; „um sich zu ernähren“ ist allgemeinverständlich und wahrt den Gedanken des Lebensunterhalts.
