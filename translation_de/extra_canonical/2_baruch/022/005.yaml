translation:
  language: de
  text: 'Oder wenn jemand den Boden besät: Verliert er etwa statt seiner Früchte, sodass ihn später der Hunger zugrunde richtet?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Der syrische Wortlaut ist knapp und syntaktisch schwierig. Wörtlicher: „Oder wer den Boden besät – verliert er statt seiner Früchte? Danach richtet der Hunger ihn nicht zugrunde.“ Die rhetorische Frage setzt voraus, dass der Sämann Früchte erhält, nicht Verlust an ihrer Stelle.'
    reason: Die Fußnote bewahrt die syntaktische Unsicherheit. Sie stellt zugleich klar, dass „seiner Früchte“ sich auf den Sämann bezieht und dass ܚܠܦ „statt“ bedeutet.
lexical_decisions:
- source_word: ܙܪܥ ܐܪܥܐ
  choice: den Boden besät
  rationale: Gibt die landwirtschaftliche Handlung natürlich und nah am syrischen Wortlaut wieder.
- source_word: ܡܘܒܕ
  choice: gibt … hin
  rationale: Das Verb bezeichnet wörtlich ein Verlieren oder Zugrundegehenlassen. Im Zusammenhang des Säens ist wahrscheinlich das Aufwenden beziehungsweise Preisgeben von Saatgut gemeint; die Übersetzung macht dies verständlich, ohne das im Text nicht ausdrücklich genannte Saatgut einzusetzen.
- source_word: ܚܠܦ ܦܐܪ̈ܘܗܝ
  choice: im Tausch gegen dessen Früchte
  rationale: Bewahrt den Gedanken des Austauschs und bezieht das pronominale Suffix grammatisch auf den Boden.
- source_word: ܠܐ ܬܘܒ ܡܚܒܠ ܠܗ ܟܦܢܐ
  choice: sodass der Hunger ihn danach nicht mehr zugrunde richtet
  rationale: Gibt die Folgebeziehung im Kontext der Gleichnisreihe idiomatisch wieder; ܡܚܒܠ wird mit dem starken Ausdruck „zugrunde richtet“ wiedergegeben.
