translation:
  language: de
  text: Oder schöpft jemand, dem ein Schatz gegeben wird, nicht daraus Zuversicht, sodass er nicht mehr erschüttert wird?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܓܙܐ (gazzā)
  choice: Schatz
  rationale: Die direkte und kontextuell passende Entsprechung bewahrt das Bild eines wertvollen, Sicherheit gebenden Besitzes.
- source_word: ܡܣܬܒܪ (mestbar)
  choice: fasst … Zuversicht
  rationale: Die Form bezeichnet hier ein Gewinnen von Hoffnung oder Vertrauen; „Zuversicht fassen“ ist im Deutschen natürlich und lässt die Art dieser Sicherheit offen.
- source_word: ܡܫܟܚ ܒܗ (meškaḥ beh)
  choice: dadurch
  rationale: Wörtlich etwa „findet/vermag in ihm“; im Satz verweist die Wendung auf den Schatz als Grund der Zuversicht. „Dadurch“ gibt diese instrumentale Beziehung knapp wieder, ohne einen zusätzlichen Gedanken einzuführen.
- source_word: ܠܐ ܬܘܒ ܡܬܬܙܝܥ (lā tub mettziʿ)
  choice: nicht länger erschüttert wird
  rationale: Bewahrt das Bild innerer oder äußerer Erschütterung und vermeidet die engere Festlegung auf bloße Sorge oder Angst.
theological_decisions: []
translation_notes:
  register: Moderne, würdige Standardsprache. Die rhetorische Frage und die bildhafte Aussage über den Schatz als Grund der Zuversicht bleiben erhalten; die Formulierung legt nicht fest, ob die Erschütterung emotional, existenziell oder äußerlich zu verstehen ist.
