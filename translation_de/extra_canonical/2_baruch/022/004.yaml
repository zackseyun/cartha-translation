  naturalness: „Dadurch Zuversicht fassen“ ist verständlich, aber weniger natürlich als „daraus Zuversicht schöpfen“. Die revidierte Fassung bewahrt den würdigen, bildhaften Ton und die offene Bedeutung von „erschüttert werden“.
  terminology: „Schatz“ ist die angemessene Entsprechung für ܓܙܐ. „Zuversicht schöpfen“ bildet den Sinn von ܡܣܬܒܪ idiomatisch ab, ohne ihn auf eine bestimmte religiöse oder psychologische Deutung einzuengen.
