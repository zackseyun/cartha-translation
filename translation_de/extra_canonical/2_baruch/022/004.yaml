- from: Oder fasst jemand, dem ein Schatz gegeben wird, nicht dadurch Zuversicht, sodass er nicht länger erschüttert wird?
  to: Oder schöpft jemand, dem ein Schatz gegeben wird, nicht daraus Zuversicht, sodass er nicht mehr erschüttert wird?
  rationale: Eine geringfügige stilistische Präzisierung ersetzt das abstraktere „dadurch“ durch das unmittelbar auf den Schatz verweisende „daraus“ und verwendet die im modernen Standarddeutsch idiomatische Verbindung „Zuversicht schöpfen“. Bedeutung, rhetorische Form und Ambiguität der Quelle bleiben erhalten.
