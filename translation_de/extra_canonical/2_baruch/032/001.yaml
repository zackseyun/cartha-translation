    rationale: Die überlieferte aktive Aussage verlangt kein passives Verständnis, doch ihre genaue Rückverweisung sollte nicht durch ein deutsches Pluralpronomen auf die Früchte allein eingeengt werden. „Dies“ kann sich auf die zuvor genannte Vorbereitung und Aussaat einschließlich ihrer Gesetzesfrüchte beziehen.
  - severity: low
    issue: „bis zu der bestimmten Zeit“ ergänzt „bestimmten“.
    rationale: Der Wortlaut sagt lediglich „bis zu der Zeit“; der Zusatz ist zwar naheliegend, aber für eine quellennähere Übersetzung entbehrlich.
