  terminology: „Früchte des Gesetzes“, „der Mächtige“, „ganze Schöpfung“ und „in Herrlichkeit erneuert“ sind treffend. „Für immer vollendet“ gibt die endgültige Dauerhaftigkeit wieder. „Bis zu der Zeit“ vermeidet den nicht ausdrücklich bezeugten Zusatz „bestimmten“.
  issues:
