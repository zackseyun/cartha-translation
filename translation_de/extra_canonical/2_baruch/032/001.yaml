  yaml_path: translation/extra_canonical/2_baruch/032/001.yaml
  text: 'But you, if you prepare your hearts so as to sow in them the fruits of the law, it will protect you in that time when the Mighty One shakes the whole creation.


    For after a little time the building of Zion will be shaken, so that it may be rebuilt again. Yet that very building will not remain; rather, after a time it will again be uprooted and will remain desolate until the time. And afterward it must be renewed in glory and be established forever.


    Therefore we should not grieve so greatly over the evil that has come now, as over that which is to come.'
translation:
  language: de
  text: 'Ihr aber: Wenn ihr eure Herzen bereitmacht, um in ihnen die Früchte[b] des Gesetzes zu säen, so wird euch dies in jener Zeit schützen, in der der Mächtige die ganze Schöpfung erschüttert.



    [Nach kurzer Zeit wird nämlich der Bau Zions erschüttert werden, damit er wieder aufgebaut wird. Doch eben dieser Bau wird nicht bestehen bleiben; vielmehr wird er nach einer gewissen Zeit erneut niedergerissen werden und bis zu der Zeit verwüstet bleiben. Danach muss er in Herrlichkeit erneuert und für immer vollendet werden.][c]



    Darum sollen wir nicht so sehr über das Böse trauern, das jetzt gekommen ist, wie über das, was noch kommen wird.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'Eine andere Überlieferungsform beziehungsweise Übersetzung hat den Singular: „die Frucht“.'
    reason: Der syrische Text legt den Plural nahe, während die lateinische Kontrollüberlieferung einen Singular bietet.
  - marker: c
    text: Die Zugehörigkeit dieses Abschnitts zu dieser Verseinteilung ist wegen des unsicheren Kapitel- und Seitenübergangs nicht völlig sicher.
    reason: Transparente Kennzeichnung einer textkritischen Abgrenzungsunsicherheit.
lexical_decisions:
- source_word: ܦܐܪ̈ܐ / fructus legis
  choice: die Früchte des Gesetzes
  rationale: Die landwirtschaftliche Metapher und der ausdrückliche Bezug auf das Gesetz bleiben erhalten. Der syrische Plural wird im Haupttext wiedergegeben.
- source_word: proteget vos
  choice: dann werden diese euch schützen
  rationale: Die aktive Aussage bleibt erhalten; „diese“ bezieht sich auf die unmittelbar zuvor genannten Früchte des Gesetzes, ohne den Schutz allgemein zu paraphrasieren.
- source_word: Fortis
  choice: der Mächtige
  rationale: Die substantivierte Form bewahrt den ehrfürchtigen Gottes­titel und klingt im modernen Deutschen natürlich.
- source_word: concutiat omnem creaturam
  choice: die ganze Schöpfung erschüttert
  rationale: „Schöpfung“ gibt den kosmischen Umfang wieder; „erschüttert“ wahrt die apokalyptische Bildsprache ohne Übersteigerung.
- source_word: aedificatio Sion
  choice: der Bau Zions
  rationale: Die Formulierung lässt offen, ob die gebaute Stadt, das Heiligtum oder Zions bauliche Gestalt insgesamt gemeint ist.
- source_word: renovari in gloria
  choice: in Herrlichkeit erneuert
  rationale: Sowohl Wiederherstellung als auch verherrlichte Erneuerung bleiben sprachlich sichtbar.
- source_word: perficietur in perpetuum
  choice: für immer vollendet werden
  rationale: „Vollendet“ hält die mögliche Bedeutung dauerhafter Fertigstellung fest, statt sie ausschließlich als bloße Bestandsfestigkeit auszulegen.
- source_word: contristari tantopere
  choice: nicht so sehr … trauern
  rationale: Die Wendung gibt den Ton der Klage in natürlichem, würdigem Deutsch wieder.
theological_decisions:
- issue: Subjekt des Schutzes
  choice: Die Früchte des Gesetzes schützen die Angesprochenen.
  alternative: 'Unpersönlich oder passiv: „ihr werdet geschützt werden“; auch ein göttliches Subjekt könnte ergänzt werden.'
  rationale: Die aktive Fassung wahrt den unmittelbaren grammatischen Anschluss, ohne ein im Satz nicht ausdrücklich genanntes göttliches Subjekt einzusetzen. Eine Fußnote hält die überlieferte beziehungsweise grammatische Unschärfe offen.
- issue: Gottestitel im Gerichtswort
  choice: „der Mächtige“
  alternative: „der Starke“ oder „der Allmächtige“
  rationale: „Der Mächtige“ bewahrt den Titelcharakter, ohne die stärkere und spezifischere Bezeichnung „der Allmächtige“ einzutragen.
- issue: Gesetzesmetaphorik
  choice: „die Früchte des Gesetzes“
  alternative: „Gehorsam“, „gerechte Taten“ oder Singular „die Frucht des Gesetzes“
  rationale: Die konkrete Saat- und Fruchtmetaphorik sowie die ausdrückliche Nennung des Gesetzes werden nicht dogmatisch aufgelöst.
- issue: Textzugehörigkeit des Abschnitts über Zion
  choice: Der Abschnitt wird in eckigen Klammern abgedruckt.
  alternative: Den Abschnitt aus dieser Einheit auslassen oder ohne Kennzeichnung abdrucken.
  rationale: Der überlieferte Seiten- und Kapitelzuschnitt ist unsicher. Die Klammern bewahren den wichtigen Text, behaupten aber keine falsche Sicherheit über seine Zugehörigkeit zu 32,1.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Die Bilder von Herz, Saat, Früchten, Erschütterung und Erneuerung bleiben konkret. Archaische Formen und konfessionell geprägte Zusätze werden vermieden.
