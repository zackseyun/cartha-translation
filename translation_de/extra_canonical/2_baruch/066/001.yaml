base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/066/001.yaml
  text: And the tenth bright waters that you saw—these are the purity of the generation of Josiah king of Judah, who alone at that time submitted himself to the king (or change source word to ܚܝܠܬܢܐ) with the fullness of his heart and with all his soul.
translation:
  language: de
  text: Und das zehnte helle Wasser, das du gesehen hast, bedeutet die Reinheit der Generation Josias, des Königs von Juda.[a] Er allein unterwarf sich damals dem Mächtigen – aus der Fülle seines Herzens und mit seiner ganzen Seele.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der Königsname ist in der vorliegenden Textgestalt beschädigt oder unsicher; der Zusammenhang der Reformen weist auf Josia, nicht auf Amon.
    reason: Die Quellenseite ist an dieser Stelle instabil, während Inhalt und geschichtliche Abfolge die Lesart „Josia“ stützen.
lexical_decisions:
- source_word: ܒ̈ܬܪ ܒܣܝ̈ܡܐ
  choice: das zehnte helle Wasser
  rationale: Die wiederkehrende Bezeichnung der Vision wird als strukturelles Motiv ausdrücklich bewahrt. Der Singular „Wasser“ entspricht im Deutschen der üblichen Stoffbezeichnung.
- source_word: ܕܫܘܝܐ
  choice: die Reinheit
  rationale: „Reinheit“ erfasst sowohl die sittliche als auch die kultische Erneuerung, die der folgende Zusammenhang Josias Zeit zuschreibt.
- source_word: ܚܝܠܬܢܐ
  choice: der Mächtige
  rationale: Der rekonstruierte beziehungsweise kontextuell vorausgesetzte Gottesbeiname wird ehrfürchtig und zugleich verständlich wiedergegeben; das auf der Seite sichtbare ܡ̇ܠܟܐ gehört dagegen zu „König von Juda“.
- source_word: ܡܢ ܡܠܝܘ ܠܒܗ ܘܡܢ ܟܠܗ̇ ܢܦܫܗ
  choice: aus der Fülle seines Herzens und mit seiner ganzen Seele
  rationale: Die unterschiedliche Formulierung der beiden Satzglieder wird erhalten, statt beide unterschiedslos mit „ganz“ wiederzugeben.
theological_decisions:
- issue: Beschädigter Königsname am Kapitelanfang
  choice: Josia, der König von Juda
  alternative: Amon, der König von Juda
  rationale: Der unmittelbare Zusammenhang mit Reinheit und umfassender Reform sowie die Abfolge der Geschichtsdeutung sprechen deutlich für Josia. Die Unsicherheit der beschädigten beziehungsweise fehlerhaft erfassten Textstelle wird in einer Fußnote offengelegt.
- issue: Gottesbezeichnung im Satz
  choice: der Mächtige
  alternative: der König
  rationale: „König“ beruht hier auf einer fehlerhaften Zuordnung von ܡ̇ܠܟܐ, das syntaktisch zu „König von Juda“ gehört. Der überlieferte Kontext und die konsultierte Textschicht verlangen den Gottesbeiname „der Mächtige“, ohne ihn mit Josias Königstitel zu vermischen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Visionsbegriff bleibt knapp und wiedererkennbar; die feierliche Doppelwendung über Herz und Seele wird ohne altertümliche Syntax bewahrt.
