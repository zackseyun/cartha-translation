  text: And the workers of magic he burned with fire; and the lying prophets who were leading the people astray, these also he gave over to burning. And the people who had listened to them while they were alive, he cast into the brook.
translation:
  language: de
  text: Die Zauberer verbrannte er im Feuer; auch die Lügenpropheten, die das Volk in die Irre führten, ließ er verbrennen. Und das Volk, das zu ihren Lebzeiten auf sie gehört hatte, warf er in den Bach.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܥܡܡܐ
  choice: das Volk
  rationale: Der Kontext bezeichnet die von den falschen Propheten irregeführte Bevölkerung; der bestimmte Singular ist hier im Deutschen natürlich.
- source_word: ܒܢܚܠܐ
  choice: in den Bach
  rationale: ܢܚܠܐ bezeichnet einen Bach beziehungsweise ein Flusstal; „Bach“ bewahrt die konkrete Gewässerbezeichnung der Quelle.
- source_word: ܩ̣ܕ ܚܝ̈ܝܗܝ
  choice: zu ihren Lebzeiten
  rationale: Die Wendung verweist darauf, dass die Menschen den genannten Verführern hörten, solange diese lebten.
