  yaml_path: translation/extra_canonical/2_baruch/066/002.yaml
  text: And he cleansed the land from idols, and sanctified the vessels that had been defiled, and restored the offerings to the altar, and raised the horn of the holy ones, and exalted the righteous, and honored all who were wise in understanding. He also brought the priests back to their service, and removed the sorcerers, diviners, and wizards from the land.
translation:
  language: de
  text: Und er reinigte das Land von den Götzen, heiligte die entweihten Geräte und brachte die Opfergaben zum Altar zurück. Er richtete das Horn der Heiligen auf[a], erhöhte die Gerechten und ehrte alle, die verständig und weise waren. Auch setzte er die Priester wieder in ihren Dienst ein und entfernte Zauberer, Wahrsager und Geisterbeschwörer aus dem Land.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das »Horn« ist hier ein Bild für Kraft, Würde und erhöhte Stellung.
    reason: Das semitische Bild wird im Haupttext bewahrt, könnte modernen Leserinnen und Lesern aber ohne Erläuterung unverständlich bleiben.
lexical_decisions:
- source_word: ܐܩܝܡ / ܐܪܝܡ … ܩܪܢܐ ܕܩܕܝܫ̈ܐ (rekonstruierter Wortlaut nach dem Kontrollkontext)
  choice: richtete das Horn der Heiligen auf
  rationale: Bewahrt das semitische Bild vom Horn als Zeichen der Kraft, Würde und erhöhten Stellung, ohne es auf nur eine Deutung zu verengen.
- source_word: ܝܕܘ̈ܥܐ (yāddōʿē / entsprechende überlieferte Form)
  choice: Geisterbeschwörer
  rationale: Bezeichnet hier im Zusammenhang mit Josias Reformen eine besondere Gruppe verbotener okkulter Praktiker; »Geisterbeschwörer« ist im Deutschen genauer als das unspezifische »Magier« oder das falsche »Sünder«.
- source_word: ܡܐܢ̈ܐ
  choice: Geräte
  rationale: Im kultischen Zusammenhang sind die für den Gottesdienst bestimmten Geräte beziehungsweise Gefäße gemeint; »Geräte« deckt den Oberbegriff natürlich ab.
- source_word: ܩܘܪ̈ܒܢܐ
  choice: Opfergaben
  rationale: Gibt die kultische Bedeutung wieder und vermeidet die im Deutschen mögliche Verwechslung von »Opfer« mit den Opfern einer Gewalttat.
theological_decisions:
- issue: Bedeutung des aufgerichteten Horns
  choice: Das Bild wörtlich bewahren und durch eine Fußnote erläutern.
  alternative: »Er stärkte/erhöhte die Heiligen.«
  rationale: Die bildhafte Rede kann Kraft, Ehre, Würde und erhöhte Stellung zugleich ausdrücken. Eine aufgelöste Wiedergabe würde die genuine Bedeutungsbreite einschränken.
- issue: Identität der drei entfernten Gruppen
  choice: 'Drei verschiedene Gruppen okkulter Praktiker wiedergeben: »Zauberer, Wahrsager und Geisterbeschwörer«.'
  alternative: »Zauberer, Wahrsager und Magier« oder »… und Sünder«.
  rationale: Der Zusammenhang nennt spezifische verbotene Praktiken. Die gewählte Fassung wahrt die Dreierreihe und vermeidet sowohl eine unbestimmte als auch eine sachlich falsche Wiedergabe.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Reihung der Reformmaßnahmen bleibt erhalten; kultische Begriffe werden verständlich, aber nicht paraphrasierend wiedergegeben.
