  text: And not only did they kill the impious who were living, but they also brought the bones of the dead out from the graves and burned them with fire.
translation:
  language: de
  text: Und nicht nur die Gottlosen, die noch lebten, tötete er; auch die Gebeine der Toten holten sie aus den Gräbern und verbrannten sie mit Feuer.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die syrischen Verbformen wechseln auffällig: zunächst „er“, danach „sie“.'
    reason: Der im Ausgangstext erkennbare Wechsel zwischen Singular und Plural wird in der Übersetzung beibehalten, statt ihn wie in der englischen Auditfassung zu harmonisieren.
lexical_decisions:
- source_word: ܕܚܝܝܢ ܗܘܘ
  choice: die noch lebten
  rationale: Gibt die fortdauernde Zustandsangabe idiomatisch und mit dem Kontrast zu den Verstorbenen wieder.
- source_word: ܡܢ ܩܒܪܐ
  choice: aus den Gräbern
  rationale: Der syrische Singular kann kollektiv verstanden werden; im Deutschen passt der Plural zu den Gebeinen mehrerer Verstorbener.
- source_word: ܒܢܘܪܐ (im Scan/OCR offenbar ܒܙܘܪܐ)
  choice: im Feuer
  rationale: Die englische Kontrollfassung bestätigt die im beschädigten bzw. fehlerhaft erfassten syrischen Text erwartbare Feuerlesart.
- source_word: ܩܛܠ / ܐܦܩܘ
  choice: ließ er töten / holten sie
  rationale: Bewahrt den im syrischen Text erkennbaren Wechsel vom Singular zum Plural, statt die Subjekte stillschweigend anzugleichen.
theological_decisions:
- issue: Bezeichnung der Getöteten
  choice: die Gottlosen
  alternative: die Frevler / eine andere Personengruppe
  rationale: Folgt der geprüften englischen Konsultationsfassung, da die vorliegende Seitentranskription an dieser Stelle textlich bzw. OCR-seitig unsicher ist; die Benennung wird nicht konfessionell zugespitzt.
- issue: Subjektwechsel im Vers
  choice: er … sie
  alternative: durchgehend „sie“ oder durchgehend „er“
  rationale: Die syrischen Verbformen zeigen nach vorliegender Evidenz zunächst Singular und danach Plural. Der Wechsel bleibt sichtbar und wird nicht harmonisiert.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Gebeine“ ist in diesem Kontext natürlicher und respektvoller als „Knochen“. Die Konstruktion „ließ er töten“ vermeidet im Deutschen eine schwerfällige Wortstellung und hält zugleich das singularische Subjekt fest.
