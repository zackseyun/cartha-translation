  text: And after these things I saw that the cedar was burning, and the forest that was around it, and the vine was growing, and the plain around it was full of unfading flowers. And I awoke and arose.
translation:
  language: de
  text: Und nach diesen Dingen sah ich, dass die Zeder und der Wald rings um sie brannten, während der Weinstock wuchs und die Ebene ringsum voller unverwelklicher Blüten war. Da erwachte ich und stand auf.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܪܙܐ
  choice: Zeder
  rationale: Die bestimmte Baumart und ihre symbolische, königliche Wirkung bleiben ohne erklärenden Zusatz erhalten.
- source_word: ܓܘܦܢܐ
  choice: Weinstock
  rationale: „Weinstock“ bezeichnet die Pflanze präziser als „Weinrebe“ und lässt ihre symbolische Deutung innerhalb der Vision offen.
- source_word: ܗܒ̈ܒܐ ܕܠܐ ܚܡܝܢ
  choice: unverwelkliche Blüten
  rationale: Die Wendung bewahrt das Bild dauerhafter, nicht vergehender Blüten in natürlichem Deutsch.
- source_word: ܐܬܬܥܝܪܬ ܘܩܡܬ
  choice: erwachte ich und stand auf
  rationale: Die beiden aufeinanderfolgenden Handlungen werden schlicht und formal entsprechend wiedergegeben.
theological_decisions:
- issue: Deutung des Weinstocks als messianische Gestalt
  choice: Die Gestalt bleibt im Haupttext „der Weinstock“.
  alternative: Den Weinstock bereits hier ausdrücklich als Messias bezeichnen oder typografisch hervorheben.
  rationale: Die Vision selbst nennt zunächst nur ihr Bild; seine Deutung folgt später. Eine vorzeitige Identifikation würde die Erzählfolge auflösen und Interpretation in den Visionstext eintragen.
- issue: Bezug von „ringsum“ im Bild der Ebene
  choice: „die Ebene ringsum“ vermeidet eine künstlich eindeutige Zuordnung.
  alternative: „die Ebene rings um ihn“ ausdrücklich auf den Weinstock beziehen.
  rationale: Die knappe Bildfolge lässt den räumlichen Bezug offen genug, dass die deutsche Fassung ihn nicht unnötig festlegen sollte.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer visionärer Bildsprache. „Während“ ordnet die gleichzeitig wahrgenommenen Gegensätze von Brand und Wachstum, ohne den Weinstock christologisch vorwegzudeuten.
