base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/035/001.yaml
  text: 'And I, Baruch, went to the holy gate, and sat down in humility, and I wept and said:


    “O my eyes, become springs,

    and eyelids of water, a fountain of tears.

    For how can I find rest over Zion?

    And how can I weep for Jerusalem?

    For the people whom I nourished

    and who were formerly greater than I in vision

    have been shaken with trembling.”'
translation:
  language: de
  text: 'Und ich, Baruch, ging bis zum heiligen Tor. Dort setzte ich mich in Demut nieder, weinte und sagte:


    »O meine Augen, werdet zu Quellen,


    und meine Lider zu Wasser,

    zu einem Quell von Tränen!


    Denn wie könnte ich über Zion Ruhe finden?


    Und wie könnte ich um Jerusalem weinen?[a]


    Denn das Volk, das ich ernährte


    und das mir einst in der Schau überlegen war,


    wurde von Zittern erschüttert.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die syrische Textform ist hier unsicher. Möglich ist auch: »Und wie könnte ich um die Trauer weinen, die ich vorfinde?«'
    reason: Die sichtbare Überlieferung kann auf »Trauer/Klage« und »finden« weisen; »Jerusalem« beruht auf dem wahrscheinlichen Parallelismus mit Zion und der breiteren Texttradition.
lexical_decisions:
- source_word: ܬܪܥܐ ܩܕܝܫܐ
  choice: das heilige Tor
  rationale: ܬܪܥܐ bezeichnet konkret ein Tor oder eine Tür. Die Wiedergabe bewahrt das räumliche Bild des Heiligtums, statt es zu »heiliger Ort« zu verallgemeinern.
- source_word: ܡ̈ܟܝܟܐܝܬ
  choice: in Demut
  rationale: Das Adverb bezeichnet eine Haltung der Niedrigkeit oder Demütigung. »In Demut« ist würdig und im modernen Deutsch verständlich.
- source_word: ܡܒܘ̈ܥܐ
  choice: Quellen
  rationale: Der Plural bezeichnet hervorströmende Wasserquellen und erhält das poetische Bild des unaufhörlichen Weinens.
- source_word: ܐܡܘ̈ܬܐ
  choice: Lider
  rationale: Die kontrollierende Texttradition stützt hier die Bezeichnung eines Körperteils. »Lider« erhält das Tränenbild; mit »Wasserströmen« wird die im Deutschen sonst schwer verständliche Metapher natürlich wiedergegeben.
- source_word: ܐܬܬܢܝܚ
  choice: Ruhe finden
  rationale: Das Verb kann Ruhe, Erleichterung oder Trost bezeichnen. »Ruhe finden« bewahrt die emotionale Spannung, ohne die Bedeutung auf bloßen Trost einzuengen.
- source_word: ܐܒܠܐ
  choice: Jerusalem
  rationale: Die sichtbare Lesung wirkt beschädigt und könnte wörtlich auf Trauer oder Klage weisen. Im Parallelismus mit Zion und nach der breiteren Textüberlieferung ist »Jerusalem« wahrscheinlich; die abweichende Möglichkeit wird in der Fußnote offengelegt.
- source_word: ܐܢܫܐ ܕܡܬ̇ܪܣܝܢ ܐܢܐ
  choice: das Volk, das ich ernährte
  rationale: Die Wendung bezeichnet Menschen, für deren Ernährung oder Versorgung Baruch verantwortlich war. »Das Volk« passt zum kollektiven Bezug und bleibt nah am Wortlaut.
- source_word: ܪܒܝ ܠܝܐ ܚܙܘܐ
  choice: das mir einst in der Schau überlegen war
  rationale: Die überlieferte Formulierung ist syntaktisch schwierig. Diese Wiedergabe folgt dem erkennbaren Vergleich mit Baruch und bewahrt »Schau« als visionären Begriff, ohne ihn dogmatisch auszudeuten.
- source_word: ܒܙܘܥܐ ܐܬܬܙܝܥ
  choice: wurde von Zittern erschüttert
  rationale: Die Verbindung verstärkt das Bild durch verwandte Begriffe für Zittern und Erschütterung; die deutsche Formulierung erhält diese Intensität.
theological_decisions:
- issue: Bezug des heiligen Tores
  choice: konkretes Tor des Heiligtums
  alternative: allgemein der heilige Ort
  rationale: Der syrische Ausdruck nennt ausdrücklich ein Tor. Die konkrete Wiedergabe lässt den Zusammenhang mit dem zerstörten Heiligtum erkennen, ohne zusätzliche kultische Einzelheiten in diesen Vers einzutragen.
- issue: Zion/Jerusalem-Parallelismus
  choice: Jerusalem im Haupttext, mit textkritischem Hinweis
  alternative: Trauer beziehungsweise Klage
  rationale: Der Parallelismus spricht für einen Ortsnamen, doch der vorliegende syrische Text ist an dieser Stelle unsicher. Die Fußnote wahrt die textliche und theologische Spannung.
- issue: visionäre Überlegenheit des Volkes
  choice: »in der Schau überlegen«
  alternative: eine allgemeinere frühere Größe oder Vorrangstellung
  rationale: Der Begriff »Schau« bleibt erhalten, ohne festzulegen, welche religiöse oder amtliche Autorität damit gemeint ist.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit poetischer Zeilengestaltung. Die Anrede der Augen und die gesteigerte Wasser- und Tränenmetaphorik bleiben erhalten. Ungewöhnliche oder beschädigte Formulierungen werden nicht konfessionell harmonisiert; die wichtigste Textunsicherheit wird ausdrücklich ausgewiesen.
