  register: Modernes, würdiges Standarddeutsch mit überwiegend kurzen, klar gegliederten Sätzen. Bildhafte und apokalyptische Formulierungen bleiben erhalten; schwer verständliche Stellen werden nicht stillschweigend harmonisiert.
