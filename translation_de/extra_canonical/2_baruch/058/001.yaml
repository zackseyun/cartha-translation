base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/058/001.yaml
  text: 'Hear what the great cloud is that you saw ascending from the sea and covering this earth: it is the world which his power made when he planned to make creation. And when the word went out from before him, the beginning of the world stood forth, very small, and it was set in order according to what it was intended to become.


    And the first black waters that you saw descending from the cloud—this is the sin, the transgression that the first Adam committed. For when he sinned, death was stirred up before its time, and mourning was made known, and pains were prepared, and anguish was created, and toil was completed, and greatness began to be brought low.


    And as for the last day, which was shown in the form that had taken likeness, know that the time will be searched out, and the measure of humanity will be measured, and its strength will be tested. Therefore, because Adam, when he heard from God something of what was to be, reflected on the release of the dead that had been given, and on what had been commanded him by God, he kept considering it and devised five thoughts. For he made himself liable, and through him the angels also were made liable. And at the time when he was created, a vision was shown to him: the bitter life, and the elements with fire. Thus God gathered these beforehand in the likeness of those who were created.'
translation:
  language: de
  text: 'Höre, was die große Wolke bedeutet, die du aus dem Meer aufsteigen und diese Erde bedecken sahst: Sie ist die Welt, die seine Macht schuf, als er beschloss, die Schöpfung hervorzubringen. Als das Wort von ihm ausging, trat der Anfang der Welt hervor, noch ganz klein; und er wurde so geordnet, wie er werden sollte.


    Die ersten schwarzen Wasser aber, die du aus der Wolke herabkommen sahst – das ist die Sünde, die Übertretung, die der erste Adam beging. Denn als er sündigte, wurde der Tod vor seiner Zeit in Bewegung gesetzt; Trauer wurde bekannt, Leiden wurden bereitet, Qual wurde geschaffen, Mühsal kam zur Vollendung, und Größe begann, erniedrigt zu werden.


    Was aber den letzten Tag betrifft, der in einer Gestalt erschien und Ähnlichkeit annahm, so wisse: Die Zeit wird erforscht, das Maß der Menschheit wird gemessen und ihre Kraft geprüft werden. Denn als Adam von Gott etwas von dem hörte, was geschehen sollte, dachte er über die gewährte Entlassung der Toten[a] und über das nach, was Gott ihm geboten hatte. Er dachte weiter darüber nach und fasste fünf Gedanken. Denn er machte sich selbst schuldig, und durch ihn wurden auch die Engel schuldig. Schon zu der Zeit, als er geschaffen wurde, wurde ihm eine Vision gezeigt: das bittere Leben und die Elemente samt dem Feuer. So versammelte Gott dies zu jener Zeit im Abbild derer, die geschaffen wurden.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Die syrische Wendung ist mehrdeutig. Das entsprechende Wort kann je nach Zusammenhang auch „Erlass“, „Vergebung“ oder „Freilassung“ bedeuten; ob hier insbesondere die Auferstehung gemeint ist, bleibt offen.
    reason: Die schwierige Wendung soll weder auf eine bestimmte Lehre von der Auferstehung noch auf einen Erlass für die Toten festgelegt werden.
lexical_decisions:
- source_word: ܩܘܝܡܐ ܕܥܠܡܐ
  choice: der Anfang der Welt
  rationale: Die Wendung bezeichnet das ursprüngliche Hervortreten der Welt. „Anfang“ wahrt den Schöpfungsbezug, ohne die mögliche Bedeutung „Grundlegung“ dogmatisch festzulegen.
- source_word: ܚܛܗܐ / ܡܬܒܪܝܢܘܬܐ
  choice: die Sünde, die Übertretung
  rationale: Beide syrischen Ausdrücke werden wiedergegeben; „Übertretung“ bewahrt den Gedanken einer schuldhaften Grenzüberschreitung.
- source_word: ܐܬܬܙܝܥ ܡܘܬܐ
  choice: der Tod wurde … in Bewegung gesetzt
  rationale: Das Verb bezeichnet ein Aufgerüttelt- oder Inganggesetztwerden, nicht lediglich das erstmalige Vorhandensein des Todes.
- source_word: ܪܘܪܒܘܬܐ ܫܪܝܬ ܕܬܡܘܟ
  choice: Größe begann, erniedrigt zu werden
  rationale: Die Übersetzung erhält sowohl die Größe beziehungsweise Hoheit als auch die abwärts gerichtete Erniedrigung.
- source_word: ܢܘܡܫܐ ܕܐܢܫܘܬܐ
  choice: das Maß der Menschheit
  rationale: Im Parallelismus mit dem Erforschen der Zeit und dem Prüfen der Kraft liegt ein prüfender Maßstab nahe; die Formulierung bleibt dennoch bildhaft.
- source_word: ܫܘܒܩܢܐ ܕܡ̈ܝܬܐ
  choice: die Entlassung der Toten
  rationale: Die schwierige Wendung bleibt bewusst relativ wörtlich. Sie wird nicht vorschnell als Auferstehung oder Vergebung ausgelegt.
- source_word: ܡܚܝܒܢܘܗܝ
  choice: schuldig machen
  rationale: Die Formulierung bewahrt den rechtlich-forensischen Sinn einer eingetretenen Schuld oder Haftbarkeit.
- source_word: ܐܣܛܘܟܣܐ
  choice: die Elemente
  rationale: Das griechische Lehnwort bezeichnet hier am ehesten die kosmischen Elemente; diese Wiedergabe ist klar und wenig interpretierend.
theological_decisions:
- issue: Adams Tat und das Wirksamwerden des Todes
  choice: Adams Übertretung setzt den Tod vor seiner Zeit in Bewegung und führt die folgende Kette menschlichen Leids herbei.
  alternative: Die Stelle könnte allgemeiner als Beschreibung menschlicher Sündhaftigkeit oder weniger streng kausal wiedergegeben werden.
  rationale: Der syrische Text verbindet Adams Sünde unmittelbar mit Tod, Trauer, Leiden, Qual und Mühsal. Diese apokalyptische Kausalstruktur wird nicht abgeschwächt.
- issue: Die „Entlassung der Toten“
  choice: Die schwer verständliche Wendung wird relativ wörtlich übersetzt und mit einer Fußnote erläutert.
  alternative: Sie könnte ausdrücklich als Auferstehung, Befreiung oder Sündenerlass für die Toten gedeutet werden.
  rationale: Wortlaut und Syntax lassen die genaue Vorstellung offen. Eine eindeutige dogmatische Festlegung wäre stärker als die Quellengrundlage.
- issue: Adams Schuld und die Engel
  choice: Der überlieferte Zusammenhang zwischen Adams Schuld und der Schuld der Engel bleibt stehen.
  alternative: Die Aussage könnte durch eine erklärende Deutung auf bestimmte Engelgruppen oder eine eigenständige Engelübertretung bezogen werden.
  rationale: Der Text erläutert den Mechanismus nicht. Die Übersetzung bewahrt deshalb die theologische Spannung, ohne sie durch ein fremdes System aufzulösen.
