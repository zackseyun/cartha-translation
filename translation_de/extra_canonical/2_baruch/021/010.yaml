  text: You command the lightning at your signal, and you have seen the things that are to come, as the things that have passed.
translation:
  language: de
  text: Du gebietest dem Blitz auf dein Zeichen hin, und du hast das Kommende gesehen wie das Vergangene.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܐܙܐ
  choice: dem Blitz
  rationale: Im Satz bezeichnet das Wort den Blitz als den Gegenstand des göttlichen Befehls; die vorliegende Textgestalt ist orthografisch beziehungsweise überlieferungsbedingt auffällig.
- source_word: ܒܪܘܙܝܟ
  choice: auf dein Zeichen hin
  rationale: Gibt die instrumentale Wendung idiomatisch wieder und bewahrt den Gedanken, dass der Blitz dem göttlichen Signal gehorcht.
- source_word: ܕܥܬܝ̈ܕܢ
  choice: das Kommende
  rationale: Die substantivierte deutsche Form entspricht den zukünftigen Dingen beziehungsweise Ereignissen und klingt im Gebetsregister natürlich.
- source_word: ܕܥܒܪ̈ܝ
  choice: das Vergangene
  rationale: Der zeitliche Sinn von ܥܒܪ, „vorübergehen/vergangen sein“, bildet den beabsichtigten Gegensatz zum Kommenden; die Lesart ist nicht vom ähnlich aussehenden ܥܒܕ, „tun“, abzuleiten.
theological_decisions:
- issue: Göttliches Wissen um die Zukunft
  choice: „du hast das Kommende gesehen wie das Vergangene“
  alternative: „du siehst das Kommende wie das Vergangene“
  rationale: Das Perfekt des syrischen Verbs wird formal als „hast gesehen“ wiedergegeben. Dadurch bleibt die Aussage über Gottes bereits vollzogenes Erkennen erhalten, ohne sie systematisch-theologisch auszudeuten.
translation_notes:
  register: Dign in moderner Standardsprache. „Auf dein Zeichen hin“ ist natürlich und feierlich; „das Kommende“ und „das Vergangene“ bewahren den knappen zeitlichen Parallelismus des Syrischen.
