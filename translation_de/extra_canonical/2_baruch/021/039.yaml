  source_fidelity: Die Gliederung mit Herbeiführung der Gesuchten, dem in Mühsal Begonnenen und der Ankunft der göttlichen Herrlichkeit wird bewahrt. Die offene Referenz von „was“ bleibt zu Recht unbestimmt. Da der im bereitgestellten Seitenkontext abgebildete syrische Text nicht zuverlässig bis zu diesem Einzelvers segmentiert ist, stützt sich die Kontrolle der knappen Versform zusätzlich auf den englischen POB-Audit-Text.
