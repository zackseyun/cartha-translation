translation:
  language: de
  text: Führe die herbei, nach denen gesucht wird, und lass das, was unter Mühsal begann, sich beim Kommen deiner Herrlichkeit freuen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܩܪܒ / zugrunde liegende Herbeiführungsform (im Verszusammenhang)
  choice: Führe … herbei
  rationale: Gibt die räumlich-relationale Bedeutung idiomatisch und würdevoll wieder; „nahebringen“ wäre im Deutschen missverständlich.
- source_word: die Gesuchten / diejenigen, nach denen gesucht wird
  choice: die, nach denen gesucht wird
  rationale: Bewahrt die passive Aussage der Überlieferung, klingt aber natürlicher als das substantivierte „die Gesuchten“.
- source_word: ܫܘܒܚܟ / Herrlichkeit
  choice: deiner Herrlichkeit
  rationale: „Herrlichkeit“ entspricht dem religiösen Bedeutungsumfang besser als bloßes „Ansehen“ oder „Ruhm“.
theological_decisions:
- issue: Bezug dessen, was in Mühsal begann
  choice: Unbestimmt als „was unter Mühsal begann“ belassen
  alternative: Auf eine bestimmte Gemeinschaft, Schöpfung oder Heilszeit beziehen
  rationale: Der knappe Text legt den Bezug nicht eindeutig fest; eine nähere theologische Identifizierung würde die offene Aussage unzulässig vereindeutigen.
- issue: Kommen der Herrlichkeit
  choice: „beim Kommen deiner Herrlichkeit“
  alternative: „bei deiner herrlichen Ankunft“
  rationale: Die gewählte Form lässt „Herrlichkeit“ als eigenständigen theologischen Begriff stehen und deutet sie nicht ausdrücklich als persönliche Ankunft.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Parallelismus und die offene theologische Bildsprache bleiben erhalten; schwerfällige wörtliche Bildungen werden vermieden.
