translation:
  language: de
  text: Und du kennst die Zahl derer, die vergehen, und derer, die bleiben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܒܪܝܢ (ʿābrīn)
  choice: die vergehen
  rationale: Gibt das Vorübergehen beziehungsweise Vergehen der einen Gruppe wieder und bewahrt den Gegensatz zum Bleiben, ohne den Ausdruck unnötig auf das Sterben einzuengen.
- source_word: ܡܩܘܝܢ (mqawwin)
  choice: die bleiben
  rationale: Entspricht dem dauernden Bleiben und bildet im Deutschen einen klaren Gegensatz zu „vergehen“.
- source_word: ܡܢܝܢܐ (menyānā)
  choice: die Zahl
  rationale: Direkte und natürliche Wiedergabe des syrischen Ausdrucks für Anzahl oder Zahl.
theological_decisions:
- issue: Deutung des Gegensatzes zwischen den Vergehenden und den Bleibenden
  choice: Die offene Gegenüberstellung „vergehen“/„bleiben“ wird beibehalten.
  alternative: „sterben“/„am Leben bleiben“ oder „vergänglich sein“/„Bestand haben“
  rationale: Der syrische Wortlaut bezeichnet allgemein das Vorübergehen und Bleiben. Eine ausdrückliche Beschränkung auf Tod und Überleben würde die mögliche zeitliche oder eschatologische Weite des Satzes vorschnell festlegen.
translation_notes:
  register: Knapper, würdevoller Gebetsstil in modernem Standarddeutsch. Die koordinierte Satzform und die parallele Genitivkonstruktion des Syrischen bleiben erhalten.
