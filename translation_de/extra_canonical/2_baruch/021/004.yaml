  verdict: revise
  source_fidelity: Die Klageformel, das Quellenbild und die Sättigungsmetapher werden grundsätzlich getroffen. Der syrische Text hat jedoch in der folgenden Zeile ausdrücklich »meine Wasser fließen dort« (ܘܡ̈ܝܢܝ ܢܦܩܝܢ ܬܡܢ), nicht »aus meinen Augen«. »Tränen« ist als kontextuelle Deutung möglich, »Augen« aber eine nicht im vorliegenden Wortlaut belegte Ergänzung. Die Bedeutung von ܕܡܨܪ ist angesichts der schwierigen Überlieferung nicht völlig sicher; »bedrängt ist« wahrt die im Entwurf vertretene, plausible Lesart ohne die englische Deutung eines aufbrechenden Herzens zu übernehmen.
  naturalness: Der poetisch-klagende Ton ist natürliches modernes Standarddeutsch. »Dort fließen meine Wasser« wäre zwar quellentreu, klänge aber ohne Erläuterung missverständlich; »Dort fließen meine Tränen« ist im Kontext verständlich und wird durch eine präzise Fußnote als Deutung von »meine Wasser« ausgewiesen. »Ich werde des Weinens nicht satt« ist idiomatisch und bewahrt das Bild.
  terminology: »Quelle der Trauer« gibt ܡܒܘܥܐ ܕܐܒܠܐ passend wieder. »Tränen« ist nicht als Übersetzung eines Wortes für »Augen«, sondern als kontextuelle Auslegung von »meine Wasser« zu kennzeichnen. Die englischen Audit-Fußnoten sind sprachlich und textlich keine Grundlage für eine Übernahme der Vorstellung eines »berstenden« Herzens.
  issues:
  - severity: medium
    issue: Unbelegte Ergänzung »aus meinen Augen«
    rationale: Der vorgelegte syrische Wortlaut lautet »meine Wasser fließen dort«; ein Ausdruck für »Augen« steht in dieser Zeile nicht. Die Ergänzung verändert die explizite Bildsprache und muss entfernt werden.
  - severity: medium
    issue: Fußnote a gibt den syrischen Wortlaut unzutreffend wieder
    rationale: Die Fußnote behauptet als annähernd wörtliche Wiedergabe »Meine Augen strömen dort«. Im Text steht jedoch »meine Wasser fließen dort«. Die Anmerkung ist entsprechend zu berichtigen.
  revised_text: Wehe meinem Herzen, das an der Quelle der Trauer bedrängt ist! Dort fließen meine Tränen[a], und ich werde des Weinens nicht satt.
