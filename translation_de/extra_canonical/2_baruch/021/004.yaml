  text: “Woe to my heart, for it bursts open into a spring of grief, and from there tears flow from my eyes, and I am not satisfied with weeping.”
translation:
  language: de
  text: Wehe meinem Herzen, das an der Quelle der Trauer bedrängt ist! Dort fließen meine Tränen[a], und ich werde des Weinens nicht satt.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: »Dort fließen meine Wasser.« Gemeint sind im Zusammenhang wohl Tränen.'
    reason: Der syrische Wortlaut nennt »meine Wasser« und keine Augen. Die Übersetzung »meine Tränen« erschließt das Klagebild, während die Fußnote die konkrete Metapher und die verbleibende Deutungsoffenheit wahrt.
lexical_decisions:
- source_word: ܕܡܨܪ
  choice: das … bedrängt ist
  rationale: Die Form ist am naheliegendsten von der Wurzel ܨܪ, »einengen, bedrängen«, zu verstehen. Die Übersetzung folgt damit dem erhaltenen syrischen Wortlaut, statt die nicht eindeutig belegte Vorstellung eines aufbrechenden Herzens einzutragen.
- source_word: ܒܡܒܘܥܐ ܕܐܒܠܐ
  choice: an der Quelle der Trauer
  rationale: ܡܒܘܥܐ bezeichnet eine Quelle oder einen Quell; die konkrete Metapher wird bewahrt und zugleich mit dem folgenden Strömen der Tränen verbunden.
- source_word: ܘܡ̈ܝܢܝ ܢܦܩܝܢ
  choice: Tränen strömen aus meinen Augen
  rationale: Der überlieferte bzw. im Scan/OCR erkennbare Ausdruck ist textlich schwierig; im Zusammenhang sind die Augen und ihr Tränenfluss gemeint. Im Deutschen wird das implizite »Tränen« zur Verständlichkeit ergänzt.
- source_word: ܠܡܒܟܐ ܠܐ ܐܫܒܥ
  choice: ich werde des Weinens nicht satt
  rationale: Die wörtliche Sättigungsmetapher von ܫܒܥ wird in natürlichem, würdigem Deutsch beibehalten.
