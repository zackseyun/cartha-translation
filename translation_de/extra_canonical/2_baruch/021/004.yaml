  register: Poetisch-klagender, aber gut verständlicher Gebetston. Die Quell- und Sättigungsbilder des Syrischen bleiben erhalten; ungewöhnliche englische Vorentscheidungen wurden nicht gegen den syrischen Wortlaut bevorzugt.
