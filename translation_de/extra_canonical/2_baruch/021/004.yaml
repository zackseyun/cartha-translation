revisions:
- from: Wehe meinem Herzen, das an der Quelle der Trauer bedrängt ist! Dort strömen Tränen aus meinen Augen[a], und ich werde des Weinens nicht satt.
  to: Wehe meinem Herzen, das an der Quelle der Trauer bedrängt ist! Dort fließen meine Tränen[a], und ich werde des Weinens nicht satt.
  rationale: Die Revision entfernt die nicht belegte Angabe »aus meinen Augen« und ersetzt die fehlerhafte Fußnote durch eine genaue, knappe Erklärung des syrischen Bildes. Die vorsichtige Wiedergabe von ܕܡܨܪ als »bedrängt ist«, das Quellenbild und die Formel »des Weinens nicht satt werden« bleiben bestehen. Dadurch wird der syrische Wortlaut gegenüber der abweichenden englischen Auditformulierung priorisiert.
