lexical_decisions:
- source_word: ܡܬܚܒܠܐ / ܡܬܚܒܠܘܬܗܘܢ
  choice: Untergang
  rationale: Die syrische Wortfamilie bezeichnet Verderben, Zerstörung oder Zugrundegehen. „Untergang“ gibt hier den auf den Menschen bezogenen Vorgang würdig und verständlich wieder.
- source_word: ܒܪܢܫܐ (im rekonstruierten Verszusammenhang)
  choice: des Menschen / der Mensch
  rationale: Die Wiederholung vermeidet einen unklaren deutschen Pronomenbezug und bewahrt den allgemeinen, kollektiven Sinn von „Mensch“.
- source_word: ܐܬܒܪܝ / Schöpfungswortlaut im Verszusammenhang
  choice: erschaffen worden
  rationale: „Erschaffen“ entspricht dem schöpfungstheologischen Sprachgebrauch genauer als das allgemeinere „geschaffen“.
theological_decisions:
- issue: Irreale Aussage über die Erschaffung des Menschen
  choice: „als wäre der Mensch nicht erschaffen worden“
  alternative: „als ob es den Menschen nie gegeben hätte“
  rationale: Die gewählte Fassung erhält den ausdrücklichen Bezug auf den Schöpfungsakt und glättet die gedankliche Spannung zwischen Erschaffung und Untergang nicht weg.
- issue: Bezug und Funktion von „wieder“
  choice: „nicht wieder so erscheint“
  alternative: „nicht so erscheint“
  rationale: Das temporale beziehungsweise iterative Element der überlieferten Fassung bleibt erhalten, obwohl sein genauer Anschluss im beschädigten und schwer segmentierbaren Textzusammenhang nicht völlig sicher ist.
translation_notes:
  register: Moderner, würdiger Standarddeutsch-Satz mit klarer Syntax. Die eigentümliche theologische Spannung der Aussage bleibt bestehen; wegen der unsicheren Segmentierung des syrischen Seitenzeugen wurde keine zusätzliche Deutung in den Haupttext eingeführt.
