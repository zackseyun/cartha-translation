  text: If what is reserved for the world were not in them, they would be comforted by their hope.
translation:
  language: de
  text: Wenn das, was für die Welt aufbewahrt ist,[a] nicht in ihnen wäre,[b] würden sie von ihrer Hoffnung getröstet werden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das, was hinterlegt wurde“.'
    reason: Der syrische Ausdruck lässt sowohl „aufbewahrt“ als auch „hinterlegt“ zu.
  - marker: b
    text: 'Oder: „Wenn in ihnen nicht wäre, was für die Welt aufbewahrt ist“.'
    reason: Diese Wortstellung bildet die mögliche existenzielle Struktur des syrischen Satzes unmittelbarer ab.
lexical_decisions:
- source_word: ܕܒ̣ܥܝܕܐ
  choice: was … aufbewahrt ist
  rationale: Die Form bezeichnet hier wahrscheinlich etwas Zurückgelegtes oder Aufbewahrtes. Die Wiedergabe ist natürlich und bewahrt den Zukunftsbezug, ohne genauer festzulegen, worin das Aufbewahren besteht.
- source_word: ܣܒܪ
  choice: Hoffnung
  rationale: Die syrische Wortfamilie kann je nach Zusammenhang Hoffnung, Erwartung oder Zuversicht bezeichnen; „Hoffnung“ passt zur Aussage über Trost und bleibt im Deutschen offen genug.
- source_word: ܡܒܣܡܐ
  choice: würden … getröstet
  rationale: Das Wortfeld kann Erquickung, Wohlergehen oder Trost ausdrücken. Im Zusammenhang mit Hoffnung gibt „getröstet“ den Sinn idiomatisch wieder.
theological_decisions:
- issue: Bezug von „in ihnen“
  choice: Das Pronomen bleibt unaufgelöst.
  alternative: Ein ausdrückliches Bezugswort wie „in den Menschen“ oder „in den Zeiten“ ergänzen.
  rationale: Der vorgelegte Ausschnitt lässt den Bezug nicht sicher bestimmen. Eine Konkretisierung würde die echte textliche Mehrdeutigkeit voreilig beseitigen.
- issue: Art des für die Welt Aufbewahrten
  choice: Der Gegenstand bleibt unbestimmt.
  alternative: Eine eschatologische Größe wie „das künftige Heil“ ausdrücklich nennen.
  rationale: Der syrische Ausdruck benennt nicht eindeutig, was aufbewahrt ist; daher wird keine konfessionell oder theologisch geprägte Deutung in den Haupttext eingeführt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der konditionale Satzbau und die unbestimmten Pronomen bleiben erhalten, weil der fragmentarische Kontext keine sichere Auflösung erlaubt.
