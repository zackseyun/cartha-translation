translation:
  language: de
  text: Denn was ist in ihnen sichtbar? Oder welche sichtbare Hoffnung gibt es? Oder welche sichtbare Wohnstätte ist nicht nichtig?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܬܚܙܐ
  choice: sichtbar
  rationale: Bewahrt das im Vers wiederkehrende Motiv des Sichtbaren und vermeidet eine unnötige Festlegung auf einen einzelnen Wahrnehmungsakt.
- source_word: ܣܒܪܐ
  choice: Hoffnung
  rationale: Gibt den üblichen Sinn des syrischen Begriffs in diesem Zusammenhang natürlich und theologisch neutral wieder.
- source_word: ܥܘܡܪܐ
  choice: Wohnstätte
  rationale: Das würdevolle, allgemein verständliche Wort lässt offen, ob eine irdische Behausung oder ein umfassenderer Aufenthaltsort gemeint ist.
- source_word: ܣܪܝܩܘܬܐ
  choice: nichtig
  rationale: Bewahrt die Aussage von Leere, Vergeblichkeit und fehlendem bleibendem Wert, ohne sie einseitig als bloßen Trug oder ausschließlich als Vergänglichkeit auszulegen.
theological_decisions:
- issue: Beurteilung sichtbarer Hoffnung und Wohnstätte
  choice: Die rhetorischen Fragen bleiben offen und zugespitzt formuliert.
  alternative: Die Fragen als ausdrückliche Aussage über die Vergänglichkeit der gesamten sichtbaren Welt wiedergeben.
  rationale: Der Wortlaut soll die theologische Spannung selbst tragen und keine weitergehende kosmologische Deutung hinzufügen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die dreifache rhetorische Struktur und die Wiederholung von „sichtbar“ bleiben erhalten; „Wohnstätte“ ist gehobener, aber weiterhin allgemein verständlich.
