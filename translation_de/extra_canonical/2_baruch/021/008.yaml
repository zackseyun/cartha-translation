translation:
  language: de
  text: Und die Heerscharen des Himmels erkennen durch den Geist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Das syrische Wort kann je nach Zusammenhang „Geist“, „Hauch“ oder „Wind“ bedeuten; hier wird es nicht näher bestimmt.
    reason: Bewahrt die lexikalische und theologische Mehrdeutigkeit von ܪܘܚܐ.
lexical_decisions:
- source_word: ܐܘܡܘܗܝ ܕܫܡܝܐ
  choice: die Heerscharen des Himmels
  rationale: Folgt der im geprüften englischen Konsultationstext bezeugten Deutung der schwierigen syrischen Wortfolge und wahrt den erhabenen Gebetsstil.
- source_word: ܝܕܥ
  choice: erkennen
  rationale: Gibt das semitische Verb des Wissens und Erkennens wieder, ohne einen im Satz nicht ausdrücklich genannten Gegenstand festzulegen.
- source_word: ܒܪܘܚܐ
  choice: durch den Geist
  rationale: Bewahrt die instrumentale Präposition und die Bedeutungsweite von rūḥā; die im Deutschen vorgeschriebene Großschreibung des Substantivs ist keine Festlegung auf den Heiligen Geist.
theological_decisions:
- issue: Identität des in ܪܘܚܐ bezeichneten Geistes
  choice: Geist, ohne nähere Identifizierung
  alternative: Heiliger Geist
  rationale: Der syrische Text nennt keinen heiligen oder ausdrücklich göttlichen Geist. Eine trinitarische Präzisierung würde die im jüdischen Ausgangstext vorhandene Offenheit unzulässig auflösen.
translation_notes:
  register: Kurzer, würdevoller Gebetssatz in modernem Standarddeutsch. Das absolute „erkennen“ bildet die knappe, gegenstandslose Formulierung der Vorlage nach; „Geist“ wird nur aufgrund der deutschen Rechtschreibung großgeschrieben.
