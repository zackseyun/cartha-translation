  text: And I saw that, because of one man, those who live came to be, and also the dwelling place of those who are to come.
translation:
  language: de
  text: Und ich sah, dass wegen eines Menschen die Lebenden ins Dasein kamen und auch die Wohnstätte derer, die noch kommen werden, entstand.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܙܝܬ
  choice: ich sah
  rationale: Gibt das syrische Wahrnehmungsverb unmittelbar und im erzählerischen Rückblick wieder.
- source_word: ܡܛܠ ... ܚܕ
  choice: um eines Menschen willen
  rationale: Bewahrt den kausalen Sinn und lässt offen, ob der eine Mensch als Ursache, Anlass oder zugunsten der anderen gemeint ist.
- source_word: ܐܝܠܝܢ ܕܚܝܝܢ
  choice: die Lebenden
  rationale: Natürliche substantivierte Wiedergabe für diejenigen, die leben.
- source_word: ܗܘܘ
  choice: kamen ins Dasein
  rationale: Drückt das Entstehen klarer aus als das im Deutschen missverständliche bloße „wurden“.
- source_word: ܡܥܡܪܐ
  choice: Wohnstätte
  rationale: Eine würdige, verständliche Wiedergabe für einen Ort des Wohnens oder Bleibens.
- source_word: ܐܝܠܝܢ ܕܥܬܝܕܝܢ
  choice: die noch kommen werden
  rationale: Bewahrt den Zukunftsbezug und bezeichnet kommende Menschen, ohne ihre genaue Identität festzulegen.
theological_decisions:
- issue: Bedeutung des einen Menschen
  choice: „um eines Menschen willen“ ohne Identifizierung
  alternative: „durch einen Menschen“ oder ausdrückliche Gleichsetzung mit Adam beziehungsweise dem Messias
  rationale: Der Vers benennt den Menschen nicht. Die Übersetzung bewahrt daher die kausale Aussage und die mögliche heilsgeschichtliche Spannung, ohne eine bestimmte Deutung einzutragen.
- issue: Bezug der künftigen Wohnstätte
  choice: „Wohnstätte derer, die noch kommen werden“
  alternative: „die künftige Wohnstätte“ oder eine ausdrückliche eschatologische Welt
  rationale: Die Formulierung lässt offen, ob ein irdischer, himmlischer oder erneuerter künftiger Lebensraum gemeint ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Der Satz folgt der knappen visionären Aussage und vermeidet konfessionelle Festlegungen.
