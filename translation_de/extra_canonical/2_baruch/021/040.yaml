translation:
  language: de
  text: Und niemand, der herrscht und König geworden ist, soll sich rühmen[a][b] und sich in menschlichem Hochmut überheben.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und nichts, was herrscht und König geworden ist, soll sich rühmen.“'
    reason: Bewahrt die unpersönliche Wiedergabemöglichkeit der unsicheren Überlieferung beziehungsweise Syntax.
  - marker: b
    text: 'Oder: „Und niemand, der herrscht, soll sich rühmen, der König geworden ist.“'
    reason: Bewahrt eine alternative syntaktische Zuordnung der Relativbestimmungen, auch wenn sie im Deutschen schwerfälliger klingt.
lexical_decisions:
- source_word: ܡܠܟ / ܡܠܟܘ (mlk)
  choice: herrscht / König geworden ist
  rationale: Das syrische Wortfeld kann sowohl das Herrschen als auch das Königtum bezeichnen. Die deutsche Doppelung bewahrt die in der überlieferten Fassung erkennbare Aussage, ohne beide Aspekte zu einem einzigen Ausdruck zusammenzuziehen.
- source_word: ܫܘܒܚܐ (šubḥā) / überlieferter Sinn des Sichrühmens
  choice: sich rühmen
  rationale: „Sich rühmen“ gibt die Selbstverherrlichung würdig und verständlich wieder; „prahlen“ wäre stärker umgangssprachlich und enger.
- source_word: überlieferter Sinn von Erhöhung/Hochmut
  choice: sich in menschlichem Hochmut überheben
  rationale: Die reflexive Wendung bildet das stolze Sich-Erheben natürlich ab und lässt „menschlich“ als Kennzeichnung des Hochmuts stehen.
theological_decisions:
- issue: Bezieht sich die Mahnung auf einen Menschen oder unpersönlich auf „etwas“, das herrscht?
  choice: niemand, der herrscht
  alternative: nichts, was herrscht
  rationale: Königwerden und Sichrühmen setzen im Zusammenhang am natürlichsten eine Person voraus. Wegen der textlichen beziehungsweise syntaktischen Unsicherheit wird die unpersönliche Möglichkeit in Fußnote [a] bewahrt.
- issue: Zuordnung der beiden Relativbestimmungen
  choice: „der herrscht und König geworden ist“ gemeinsam vor dem Hauptverb
  alternative: „niemand, der herrscht, soll sich rühmen, der König geworden ist“
  rationale: Die gemeinsame Zuordnung ist im Deutschen klar und flüssig, ohne die sachliche Spannung zwischen Herrschen und Königwerden aufzuheben. Die näher am möglichen Satzbau liegende Alternative steht in Fußnote [b].
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Sich rühmen“ und „sich überheben“ sind allgemein verständlich und passen zum Gebets- und Mahnregister. Die vorgelegte syrische Seitenüberlieferung ist an der mutmaßlichen Versstelle beschädigt beziehungsweise schwer abzugrenzen; deshalb wurden die im geprüften Konsultationstext dokumentierten echten syntaktischen Alternativen ausdrücklich in Fußnoten erhalten.
