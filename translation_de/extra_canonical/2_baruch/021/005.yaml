translation:
  language: de
  text: Du, der du der Luft durch deinen Wink geboten und das Kommende so gesehen hast wie das, was du tust.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܠܐܐܪ / ܠܐܙܐ (textlich unsichere Lesung im Scan)
  choice: der Luft
  rationale: Der kontrollierte syrische Wortlaut und die Revisionsnotiz stützen die Bedeutung „Luft“; im Deutschen verlangt „gebieten“ hier den Dativ.
- source_word: ܒܪܡܙܐ (in der Überlieferung/Erfassung abweichend dargestellt)
  choice: mit einem Wink
  rationale: Gibt das knappe Mittel des göttlichen Befehls natürlich und würdig wieder; „Wink“ bewahrt die Bedeutung von Zeichen oder Gebärde, ohne ein ausdrückliches Possessivpronomen einzutragen.
- source_word: ܐܝܠܝܢ ܕܥܬܝ̈ܕܢ
  choice: das Zukünftige
  rationale: Eine idiomatische substantivische Wiedergabe von „die Dinge, die kommen werden“.
- source_word: ܐܝܟ ܐܝܠܝܢ ܕܥܒܕ ܐܢܬ
  choice: wie das, was du selbst tust
  rationale: Die im syrischen Text vorhandene Vergleichsklausel bleibt erhalten; „selbst“ verdeutlicht lediglich das ausdrücklich gesetzte Pronomen ܐܢܬ.
theological_decisions:
- issue: Göttliche Kenntnis des Zukünftigen
  choice: „das Zukünftige gesehen hast wie das, was du selbst tust“
  alternative: 'Nur: „das Zukünftige gesehen hast“'
  rationale: Die Vergleichsklausel steht im vorgelegten syrischen Text und darf nicht ausgelassen werden. Die etwas spannungsreiche Aussage über Gottes Verhältnis zum Zukünftigen wird nicht dogmatisch geglättet.
translation_notes:
  register: Moderne, gehobene Gebetssprache. Die Anredeform „Du, der du …“ bewahrt den feierlichen Charakter und bleibt zugleich gut verständlich.
