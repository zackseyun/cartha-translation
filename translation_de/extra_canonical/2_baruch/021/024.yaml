  text: Und wie wurde es offenbart, wenn sie es danach nicht verstehen?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܬܓܠܝ (im zugrunde liegenden Verszusammenhang; im bereitgestellten Seitenausschnitt nicht eindeutig lokalisierbar)
  choice: wurde es offenbart
  rationale: Bewahrt die passive Aussage und lässt sowohl den Inhalt der Offenbarung als auch den Offenbarenden unausgesprochen.
- source_word: ܡܢ ܒܬܪ
  choice: danach
  rationale: Gibt die zeitliche Folge knapp und natürlich wieder.
- source_word: ܠܐ ܡܣܬܟܠܝܢ / entsprechende Überlieferungsform
  choice: sie es nicht verstehen
  rationale: Bewahrt das unbestimmte Subjekt im Plural und bezieht das deutsche Pronomen „es“ natürlich auf das Offenbarte.
theological_decisions:
- issue: Unausgesprochener Urheber und Inhalt der Offenbarung
  choice: Beides bleibt unbestimmt.
  alternative: „Wie offenbarte Gott es ihnen …?“
  rationale: Die Ergänzung „Gott“ oder eines ausdrücklichen Empfängers würde die knappe, mehrdeutige Form des Ausgangstextes unnötig festlegen.
translation_notes:
  register: Moderne, schlichte und zugleich würdevolle Fragesatzform. Die konditionale Verknüpfung mit „wenn“ bleibt erhalten; kein zusätzliches Komma, da der Nebensatz eng zur Frage gehört. Wegen der nur kapitelweise und tentativ interpolierten syrischen Seitenzuordnung wurde die englische POB-Fassung als kontrollierte Konsultationsschicht herangezogen, ohne zusätzliche inhaltliche Präzisierungen einzuführen.
