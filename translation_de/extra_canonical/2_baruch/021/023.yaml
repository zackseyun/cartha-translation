translation:
  language: de
  text: Denn in seiner Königsherrschaft ist der Tod der Menschenkinder sichtbar. Und was existiert wirklich,[a] dessen Ende nicht bekannt ist?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Was ist da, das wirklich ist?“'
    reason: Bewahrt eine formalere Wiedergabe der existenziellen Wendung.
  - marker: b
    text: 'Auch möglich: „Und was existiert wirklich, dessen Ende unbekannt ist?“'
    reason: Dokumentiert die mögliche knappere Wortwahl im Schlussteil, ohne den offenen Bezug des Nichtwissens festzulegen.
lexical_decisions:
- source_word: ܡܠܟܘܬܗ
  choice: seiner Königsherrschaft
  rationale: Gibt den Herrschaftsaspekt von ܡܠܟܘܬܐ deutlicher wieder als das rein räumlich verständliche „Königreich“.
- source_word: ܒ̈ܢܝ ܐܢܫܐ
  choice: Menschenkinder
  rationale: Bewahrt die semitische Kollektivbezeichnung in einer verständlichen, würdevollen deutschen Form.
- source_word: ܐܝܬ
  choice: besteht wirklich
  rationale: Gibt die existentielle Aussage natürlich wieder, ohne die im Satz liegende philosophische Spannung aufzulösen.
- source_word: ܚܪܬܐ
  choice: Ende
  rationale: Die allgemeine Bedeutung „Ende/Ausgang“ passt zur Aussage über Sterblichkeit und bleibt gegenüber engeren Deutungen offen.
theological_decisions:
- issue: Bezug von „seiner“
  choice: Das Pronomen bleibt in der dritten Person und wird nicht erklärend durch „Gottes“ ersetzt.
  alternative: „in Gottes Königsherrschaft“
  rationale: Der unmittelbare Wortlaut soll bewahrt und der Bezug nicht durch eine interpretierende Einfügung vereindeutigt werden.
- issue: Art des Nichtwissens im Schlusssatz
  choice: Passivisch „nicht bekannt ist“ ohne Nennung eines Wissenden
  alternative: „das du nicht kennst“ bzw. „das Gott nicht kennt“
  rationale: So bleibt offen, wem das Ende unbekannt ist; eine theologisch problematische oder harmonisierende Ergänzung wird vermieden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Königsherrschaft“ und „Menschenkinder“ bewahren den gehobenen, semitisch geprägten Ton, während der zweite Satz idiomatisch und bewusst offen formuliert ist.
