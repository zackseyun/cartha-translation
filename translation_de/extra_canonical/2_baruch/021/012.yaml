translation:
  language: de
  text: Denn auch die früheren Verfehlungen, die vergangen sind, sind dir nicht fern – mit allen, die sie begangen haben,[a] und der Erinnerung an sie.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich etwa: „mit all ihren Besitzern“; die syrische Zugehörigkeitsformulierung kann hier die Personen bezeichnen, denen die Verfehlungen zugerechnet werden, also ihre Urheber.'
    reason: Die Formulierung verbindet eine Besitz- bzw. Zugehörigkeitsmetapher mit früheren Verfehlungen; „die sie begangen haben“ gibt den Sinn im deutschen Haupttext natürlich wieder, ohne die wörtliche Nuance zu verschweigen.
lexical_decisions:
- source_word: ܩܕܡܝܬܐ
  choice: die früheren Dinge
  rationale: Das Adjektiv ist hier substantivisch gebraucht und bezeichnet das Frühere beziehungsweise die früheren Dinge; „Vergehen“ wäre eine unbegründete inhaltliche Festlegung.
- source_word: ܕܫܠܝܢ
  choice: die vergangen sind
  rationale: Im Kontext bezeichnet die Form die früheren Dinge als vergangen beziehungsweise nicht mehr gegenwärtig.
- source_word: ܒܥܝܕܐ
  choice: fern
  rationale: 'Die räumliche Metapher wird im Deutschen natürlich bewahrt: Das Vergangene ist Gott nicht fern.'
- source_word: ܕܝܠܗܘܢ
  choice: denen sie gehörten
  rationale: Die zugrunde liegende Vorstellung von Zugehörigkeit oder Besitz wird verständlich wiedergegeben, ohne die Personen als Täter zu deuten.
- source_word: ܕܘܟܪܢܐ
  choice: der Erinnerung an sie
  rationale: „Erinnerung“ wahrt den Sinn des syrischen Nomens; die Ergänzung „an sie“ macht den deutschen Bezug eindeutig.
theological_decisions:
- issue: Gottes Verhältnis zum Vergangenen
  choice: „sind dir nicht fern“
  alternative: „sind vor dir nicht verborgen“
  rationale: Die Formulierung bewahrt das Bild des Quelltextes und lässt offen, ob vor allem Gottes Wissen, seine Gegenwart oder beides gemeint ist.
- issue: Deutung der mit den früheren Dingen verbundenen Personen
  choice: „denen sie gehörten“
  alternative: „ihren Urhebern“ oder „ihren Tätern“
  rationale: Eine Täterdeutung würde einen Schuld- oder Vergehenskontext eintragen, den der Ausdruck „frühere Dinge“ nicht verlangt.
translation_notes:
  register: Moderne, würdige Gebetssprache. Der Gedankenstrich gliedert den langen Satz, ohne seine theologische Spannung zu glätten; die direkte Anrede Gottes bleibt erhalten.
