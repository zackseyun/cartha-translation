  text: And I came to the place where you spoke with me, and I sat in the cave of the earth.
translation:
  language: de
  text: Und danach kam ich an den Ort, an dem du mit mir gesprochen hattest,[a] und setzte mich in die Höhle der Erde.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich steht am Ende des Relativsatzes zusätzlich „dort“: „an dem du mit mir dort gesprochen hattest“.'
    reason: Die syrische Konstruktion enthält das resumptive Ortsadverb ܬܡܢ; im flüssigen deutschen Haupttext wäre seine zusätzliche Wiedergabe redundant.
lexical_decisions:
- source_word: ܘܡܢ ܒܬܪܗܝܢ
  choice: Und danach
  rationale: Gibt die zeitliche Folge der vorausgehenden Ereignisse natürlich und knapp wieder.
- source_word: ܠܐܬܪܐ ܗܘ ܕܡܠܠܬ ܥܡܝ ܬܡܢ
  choice: an den Ort, an dem du mit mir gesprochen hattest
  rationale: Das Plusquamperfekt macht im Deutschen deutlich, dass das Gespräch vor Baruchs Rückkehr an den Ort stattfand. Das resumptive ܬܡܢ („dort“) wird im Haupttext nicht doppelt wiedergegeben, da „an dem … dort“ unnatürlich wäre.
- source_word: ܘܝܬܒܬ
  choice: und setzte mich
  rationale: Im narrativen Zusammenhang bezeichnet das Verb das Sich-Niederlassen; „setzte mich“ ist hier idiomatischer als das statische „saß“.
- source_word: ܒܡܥܪܬܗܘܝ ܕܡܥܪܬܐ
  choice: in die Höhle der Erde
  rationale: Folgt der erkennbaren, wenn auch textlich auffälligen Ortsbezeichnung und bewahrt deren konkrete Bildsprache, statt sie erklärend zu glätten.
theological_decisions:
- issue: Identität des angesprochenen Gegenübers
  choice: „du“ ohne ergänzende Benennung
  alternative: „Gott“ oder „der Herr“ ausdrücklich einsetzen
  rationale: Die syrische Verbform markiert die direkte Anrede, nennt das Gegenüber in diesem Vers jedoch nicht ausdrücklich. Eine Benennung würde mehr festlegen als der Wortlaut.
translation_notes:
  register: Moderne, würdige Erzählsprache. Die ungewöhnliche Wendung „Höhle der Erde“ bleibt erhalten, während die syrische Wiederaufnahme durch „dort“ nur in der Fußnote dokumentiert wird.
