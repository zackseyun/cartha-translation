    rationale: In „dass sie nicht viele waren und nichts anderes als die Nichtigkeit Adams“ bleibt „waren“ nur implizit. Die ausdrückliche Wiederholung verhindert ein stockendes Lesen und macht die Prädikation eindeutig.
