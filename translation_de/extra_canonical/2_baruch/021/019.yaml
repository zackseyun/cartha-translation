  text: Therefore, the one who lives is not gladdened in his life. And I considered the sons of men, and I saw that they were not many and were nothing but the vanity of Adam.
translation:
  language: de
  text: Darum freut sich der Lebende nicht an seinem Leben.[a] Ich betrachtete die Menschenkinder und sah, dass sie nicht zahlreich waren und nichts anderes als die Nichtigkeit Adams waren.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Der Lebende freut sich nicht, solange sein Leben dauert.“'
    reason: Die Präpositionalfügung kann gegenständlich („an seinem Leben“) oder zeitlich („solange sein Leben dauert“) verstanden werden.
lexical_decisions:
- source_word: 'ܚܝܐ / ḥayyā (im konsultierten Verszusammenhang: „der Lebende“)'
  choice: der Lebende
  rationale: Bewahrt die substantivische, allgemein gehaltene Bezeichnung und vermeidet eine unnötige Festlegung auf eine bestimmte Person.
- source_word: ܒܚܝܘܗܝ / b-ḥayyaw(h)i
  choice: an seinem Leben
  rationale: Die Präposition kann in diesem Zusammenhang idiomatisch den Gegenstand der Freude bezeichnen; so entsteht natürliches Deutsch, ohne die Aussage abzuschwächen.
- source_word: „sons of men“ (durch die konsultierte Textüberlieferung bezeugter Ausdruck)
  choice: Menschenkinder
  rationale: Gibt die semitische Kollektivbezeichnung würdig und verständlich wieder, ohne sie auf Männer im geschlechtsspezifischen Sinn zu verengen.
- source_word: „vanity“ / zugrunde liegender Begriff der Nichtigkeit
  choice: Nichtigkeit
  rationale: „Eitelkeit“ würde im heutigen Deutsch leicht als Selbstgefälligkeit missverstanden; „Nichtigkeit“ bewahrt die Bedeutung von Leere, Bedeutungslosigkeit oder Hinfälligkeit.
theological_decisions:
- issue: Bezug der „Nichtigkeit Adams“
  choice: Die Menschenkinder werden kollektiv als nichts anderes als die Nichtigkeit Adams bezeichnet.
  alternative: Einige andere seien die Nichtigkeit Adams gewesen.
  rationale: Die überlieferte idiomatische Wendung bedeutet „nichts anderes als“ beziehungsweise „nichts als“; die Alternative beruht auf einer Fehlgliederung und wird daher nicht als echte Lesart in den Text aufgenommen.
- issue: Freude am Leben
  choice: „freut sich … nicht an seinem Leben“
  alternative: „freut sich nicht, solange sein Leben dauert“
  rationale: Die Präpositionalfügung bezeichnet am ehesten das Leben als Gegenstand beziehungsweise Bereich der Freude; die zeitliche Deutung bleibt möglich, ist aber weniger unmittelbar.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Menschenkinder“ erhält den semitischen Kollektivausdruck, während „Nichtigkeit“ die heute missverständliche Wiedergabe „Eitelkeit“ vermeidet. Der Satzbau bleibt knapp und sentenzenhaft.
