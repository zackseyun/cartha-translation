  terminology: „der Lebende“, „Menschenkinder“ und „Nichtigkeit“ sind als würdige, semitisierende und zugleich verständliche Begriffe vertretbar. „Nichtigkeit Adams“ bewahrt den im englischen Prüfnachweis festgehaltenen Bezug auf Adam, ohne ihn dogmatisch auszudeuten.
