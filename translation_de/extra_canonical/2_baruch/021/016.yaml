  text: You alone know the arrangement of the times, without being shaken.
translation:
  language: de
  text: Du allein kennst die Unterweisungen der Zeiten[a], ohne ins Wanken zu geraten.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder sinngemäß: die Ordnung der Zeiten.'
    reason: Die syrische Wendung ist ungewöhnlich. Das Substantiv bedeutet normalerweise »Lehre« oder »Unterweisung«, kann hier im Zusammenhang jedoch auf den geordneten Verlauf beziehungsweise die Anordnung der Zeiten zielen.
lexical_decisions:
- source_word: ܝܘܠܦܢܘܗܝ ܕܙܒ̈ܢܐ
  choice: die Unterweisungen der Zeiten
  rationale: Das überlieferte syrische ܝܘܠܦܢܐ bezeichnet gewöhnlich Lehre oder Unterweisung. Die ungewöhnliche Verbindung mit »Zeiten« bleibt daher bewusst erhalten, statt sie im Haupttext vorschnell als göttliche Anordnung umzudeuten.
- source_word: ܟܕ ܠܐ ܢܬܬܙܝܥ
  choice: ohne ins Wanken zu geraten
  rationale: Gibt das Bild des Erschüttert- oder Bewegtwerdens idiomatisch und zugleich anschaulich wieder.
- source_word: ܐܢܬ ܒܠܚܘܕܝܟ ܝܕܥܬ
  choice: Du allein kennst
  rationale: Bewahrt die ausdrückliche Hervorhebung Gottes als des allein Wissenden in natürlicher deutscher Wortstellung.
theological_decisions:
- issue: Bezeichnet die Zeitwendung eine Unterweisung oder eine festgesetzte Ordnung?
  choice: Unterweisungen der Zeiten
  alternative: Ordnung der Zeiten / Anordnung der Zeiten
  rationale: Die lexikalisch direkte Bedeutung des bezeugten ܝܘܠܦܢܐ ist »Lehre/Unterweisung«. Die im Englischen gewählte »arrangement«-Deutung ist kontextuell möglich, aber aus der vorliegenden syrischen Form nicht eindeutig genug, um sie ohne Kennzeichnung in den Haupttext zu übernehmen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die schwer deutbare apokalyptische Wendung wird quellennah wiedergegeben; eine glättende Deutung steht in der Fußnote.
