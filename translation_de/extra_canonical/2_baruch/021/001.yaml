  to: 1 Dann ging ich von dort fort und setzte mich im Kidrontal in einer Erdhöhle nieder. Dort heiligte ich meine Seele. Ich aß kein Brot und hatte doch keinen Hunger; ich trank kein Wasser und hatte doch keinen Durst. Dort blieb ich bis zum siebten Tag, wie er mir geboten hatte.
