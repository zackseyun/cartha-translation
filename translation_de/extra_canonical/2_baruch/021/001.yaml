base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/021/001.yaml
  text: And I went away from there and sat in the valley of Kidron, in a cave of the earth. And I sanctified my soul there. I ate no bread, yet I was not hungry; and I drank no water, yet I was not thirsty. And I remained there until the seventh day, as he had commanded me.
translation:
  language: de
  text: 1 Dann ging ich von dort fort und setzte mich im Kidrontal in einer Erdhöhle nieder. Dort heiligte ich meine Seele. Ich aß kein Brot und hatte doch keinen Hunger; ich trank kein Wasser und hatte doch keinen Durst. Dort blieb ich bis zum siebten Tag, wie er mir geboten hatte.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܥܪܬܗܘܝ ܕܡܥܪܬܐ
  choice: eine Höhle in der Erde
  rationale: Die konkrete, im Syrischen verstärkte Höhlen- und Erdvorstellung bleibt erhalten, ohne im Deutschen die schwer verständliche wörtliche Doppelung nachzuahmen.
- source_word: ܩܕܫ / zugrunde liegende Heiligungsformel
  choice: heiligte ich meine Seele
  rationale: Die ungewöhnliche asketische Selbstaussage wird nicht zu „bereitete ich mich vor“ oder „weihte ich mich“ geglättet; so bleibt ihre religiöse Spannung erhalten.
- source_word: ܠܚܡܐ / ܡ̈ܝܐ
  choice: Brot / Wasser
  rationale: Die elementaren Fastenbegriffe werden konkret und schlicht wiedergegeben.
- source_word: ܫܒܥܐ ܝ̈ܘܡܝܢ
  choice: bis zum siebten Tag
  rationale: Die zeitliche Angabe folgt der überlieferten Versfassung und klingt im modernen Deutschen natürlich.
theological_decisions:
- issue: Bedeutung der Heiligung der Seele
  choice: Die Formulierung „heiligte ich meine Seele“ bleibt stehen.
  alternative: „bereitete ich mich geistlich vor“ oder „weihte ich mich Gott“
  rationale: Der Text benennt weder ausdrücklich eine bloße innere Vorbereitung noch ergänzt er ein direktes Objekt wie „Gott“. Eine Präzisierung würde die asketisch-theologische Offenheit unnötig festlegen.
- issue: Übernatürliche Bewahrung während des Fastens
  choice: „hatte doch keinen Hunger“ und „hatte doch keinen Durst“ werden als klare Gegensätze wiedergegeben.
  alternative: Die Aussagen als bloße Enthaltsamkeit abzuschwächen
  rationale: Die überlieferte Aussage betont nicht nur das Fasten, sondern das Ausbleiben von Hunger und Durst; diese Spannung ist zu bewahren.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit schlichter Erzählbewegung. „Kidrontal“ ist die geläufige geografische Form; „meine Seele heiligte“ bleibt bewusst ungewöhnlich, um die Eigenart des Ausgangstextes zu erhalten.
