translation:
  language: de
  text: Und was bewahrt wird, bleibt für das, was neu wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܕܡ
  choice: das, was
  rationale: Das indefinite Pronomen bezeichnet hier eine Sache beziehungsweise das Betreffende, ohne es näher festzulegen.
- source_word: ܡܬܚܒܠܐ / ܗܘܐ (textlich unsicherer Zusammenhang)
  choice: bewahrt wird / neu geschaffen wird
  rationale: Der überlieferte syrische Text ist an dieser Stelle beschädigt. Die Formulierung folgt dem aus dem Zusammenhang erschließbaren Gegensatz zwischen dem Erhaltenen und dem neu Entstehenden, ohne dessen Gegenstand näher zu bestimmen.
- source_word: ܗܘܐ
  choice: bleibt
  rationale: Im rekonstruierten Satzzusammenhang gibt das deutsche »bleibt« den fortdauernden Bestand natürlich und knapp wieder.
theological_decisions:
- issue: Verhältnis von Bewahrung und Neuschöpfung
  choice: 'Die beiden Größen bleiben unbestimmt: »was bewahrt wird« und »was neu geschaffen wird«.'
  alternative: Eine ausdrückliche Deutung auf Menschen, Welt oder Auferstehungsleiber.
  rationale: Der erhaltene Wortlaut nennt den Gegenstand nicht eindeutig; eine konkrete eschatologische Auslegung würde die echte Unbestimmtheit des Textes auflösen.
translation_notes:
  register: Kurzer, würdevoller Aussagesatz in modernem Standarddeutsch. Das zweimalige »wird« bewahrt die passive und theologisch offene Aussageweise. Wegen der Beschädigung des syrischen Textes ist die Wiedergabe bewusst zurückhaltend.
