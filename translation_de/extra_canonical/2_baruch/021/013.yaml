  text: For if the things that have been are not remembered, the things that stand before you are yours, and the things that are to come are remembered in their times.
translation:
  language: de
  text: Denn wenn an das Vergangene nicht erinnert wird, gehört dir, was vor dir steht, und an das Kommende wird zu seiner Zeit erinnert.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܗܠܝܢ ܕܩ̈ܡܝ
  choice: was vor dir steht
  rationale: Die Form wird mit dem Suffix der 2. Person Singular wiedergegeben; sie bezeichnet das, was vor Gottes Gegenwart steht, nicht Dinge, die lediglich beieinanderstehen.
- source_word: ܐܬܘܗܝ ܕܝܠܟ
  choice: gehört dir
  rationale: Gibt die prädikative Zugehörigkeitsaussage knapp und natürlich wieder.
- source_word: ܒܙܒܢܘܬܐ ܡܕܟ̣ܪܐ
  choice: wird zu seiner Zeit erinnert
  rationale: Bewahrt den passiven Erinnerungsausdruck und gibt die Zeitangabe idiomatisch wieder, ohne die Aussage näher auszudeuten.
theological_decisions:
- issue: Gottes Verhältnis zu Vergangenheit, Gegenwart und Zukunft
  choice: Die drei zeitlichen Aussagen bleiben als getrennte, auf Gott bezogene Satzglieder erhalten.
  alternative: Die Gegenwarts- und Zukunftsaussage zu einer einzigen Aussage zusammenziehen.
  rationale: Der syrische Satz stellt Vergangenheit, das vor Gott Stehende und das Kommende ausdrücklich nebeneinander; diese Spannung darf nicht nivelliert werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die kollektiven Substantivierungen „das Vergangene“ und „das Kommende“ vermeiden schwerfällige Wiederholungen von „die Dinge, die …“, während die dreigliedrige Zeitstruktur des Syrischen erhalten bleibt.
