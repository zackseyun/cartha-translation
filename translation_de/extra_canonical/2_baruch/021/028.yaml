translation:
  language: de
  text: Und lass das, was für seine Zeit bewahrt ist, fortbestehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܢܩܘܐ (erschlossen aus dem Verskontext)
  choice: fortbestehen
  rationale: Gibt den durativen Sinn von »bleiben, bestehen« wieder und passt zur Bewahrung bis zum bestimmten Zeitpunkt.
- source_word: ܙܒܢܗ
  choice: für seine Zeit
  rationale: Bewahrt den singulären Zeitbezug und die possessive Zuordnung; gemeint ist der dafür bestimmte Zeitpunkt, ohne dies ausdrücklich auszudeuten.
- source_word: ܢܛܝܪ / entsprechendes Partizip (erschlossen aus der Überlieferung des Verses)
  choice: aufbewahrt
  rationale: Entspricht dem passiven Sinn von »bewahrt, vorbehalten« und bleibt gegenüber dem Gegenstand bewusst offen.
theological_decisions:
- issue: Modalität des Verbs
  choice: lass … fortbestehen
  alternative: … besteht fort
  rationale: Der Zusammenhang ist ein Gebet; daher wird die syrische Imperfektform als Jussiv beziehungsweise Bitte verstanden, nicht als bloße Feststellung.
- issue: Zahlform bei »Zeit«
  choice: Singular
  alternative: 'Plural: »für seine Zeiten«'
  rationale: Die übliche Lesart ist singularisch und bezeichnet die dem Bewahrten zugeordnete Zeit; eine abweichende Vokalisierung kann jedoch einen Plural zulassen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die jussive Gebetssprache wird mit »lass« natürlich wiedergegeben; »das, was« erhält die sachliche Unbestimmtheit des Bewahrten.
