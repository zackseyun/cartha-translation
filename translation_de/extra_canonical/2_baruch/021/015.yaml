translation:
  language: de
  text: Du ordnest nur wegen des sündigen Menschen an, dass Regen und Flut kommen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „sprichst [Regen und Flut]“.'
    reason: Das syrische Verb bedeutet im Grundsinn „sprechen“; die Übersetzung gibt im Deutschen das wirksame, autoritative Sprechen als Anordnung wieder.
lexical_decisions:
- source_word: ܡܡܠܠ
  choice: ordnest … an
  rationale: Das Verb bedeutet wörtlich „spricht“, bezeichnet hier aber Gottes wirksames, autoritatives Sprechen über Regen und Flut. „Anordnen“ gibt diesen Sprechakt im Deutschen natürlich wieder, ohne die Aussage zu einer bloßen Wetterbeschreibung abzuschwächen.
- source_word: ܡܛܪܐ / ܛܘܦܢܐ
  choice: Regen und Flut
  rationale: Die beiden Wetter- bzw. Wasserereignisse werden entsprechend dem erkennbaren Sinn der syrischen Wortgruppe wiedergegeben; „Flut“ bewahrt dabei den möglichen Anklang an ein vernichtendes Überschwemmungsgericht.
- source_word: ܐܢܫܐ ܡܣܟܠܢܐ
  choice: des sündigen Menschen
  rationale: Der Singular ist generisch. „Sündig“ trifft die moralische Bedeutung von ܡܣܟܠܢܐ in diesem Gebets- und Gerichtskontext besser als bloß „fehlgehend“.
theological_decisions:
- issue: Begründung von Regen und Flut
  choice: nur wegen des sündigen Menschen
  alternative: nur im Hinblick auf den sündigen Menschen
  rationale: Die Konstruktion wird wie in der geprüften Konsultationsfassung kausal verstanden. Die Formulierung wahrt die Aussage, dass Gottes Anordnung auf menschliche Sünde bezogen ist, ohne genauer festzulegen, ob jedes Regenereignis als Strafgericht gemeint ist.
- issue: Wirksames göttliches Sprechen
  choice: ordnest … an
  alternative: sprichst … aus
  rationale: Die Übersetzung macht den autoritativen Charakter des göttlichen Sprechens verständlich, ohne eine besondere Lehre über die Art dieses Wirkens einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Satzstellung mit der trennbaren Verbform „ordnest … an“ klingt natürlich und hält zugleich Regen und Flut als gemeinsame Objekte des göttlichen Anordnens zusammen.
