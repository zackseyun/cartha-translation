translation:
  language: de
  text: der Lebenden und derer, die wie nichts sind. Denn ein Leben, dem keine Freude zuteilwird, ist kein Leben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܐ
  choice: die leben / Leben
  rationale: Das syrische Wortfeld bezeichnet Leben beziehungsweise Lebende; die jeweilige deutsche Form richtet sich nach dem Satzbau.
- source_word: ܠܐ
  choice: nicht / kein
  rationale: Die Verneinung wird im Deutschen idiomatisch wiedergegeben, ohne die Aussage abzuschwächen.
- source_word: ܡܒܣܡܐ (im unmittelbaren Kontext)
  choice: mit Freude erfüllt
  rationale: Das Wortfeld kann erfreuen, wohltun oder angenehm machen bezeichnen. „Mit Freude erfüllt“ bewahrt den Sinn des Erfreutwerdens und klingt im Deutschen natürlich.
theological_decisions:
- issue: Aussage über ein freudloses Leben
  choice: Denn ein Leben, das nicht mit Freude erfüllt ist, ist kein Leben.
  alternative: Denn ein Leben ohne Freude ist kein Leben.
  rationale: Die gewählte Fassung erhält stärker den passivisch-dynamischen Gedanken des Erfreutwerdens, ohne daraus eine besondere Lehre über den Wert leidvollen Lebens abzuleiten.
- issue: Status derer, „die wie nichts sind“
  choice: wie nichts sind
  alternative: nicht existieren
  rationale: Der Vergleich wird nicht zu einer absoluten Aussage über Nichtexistenz verschärft; so bleibt die Spannung der überlieferten Formulierung erhalten.
translation_notes:
  register: Moderne, würdige Standardsprache. Der fragmentarische Beginn bleibt erhalten, weil der Vers offenbar an den vorhergehenden Satz anschließt; die schwierige Überlieferung wird nicht stillschweigend geglättet.
