translation:
  language: de
  text: Bei der großen Abrechnung werden die Verfehlungen derer, die vor dir sind, vor dir festgehalten.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „werden vor dir in Erinnerung gehalten“.'
    reason: Das syrische Verb kann sowohl das Festhalten als auch das Erinnern bzw. Erwähnen ausdrücken.
lexical_decisions:
- source_word: ܒܚܘܫܒܐ ܪܒܐ
  choice: bei der großen Abrechnung
  rationale: ܚܘܫܒܐ bezeichnet hier eine Abrechnung bzw. Rechenschaft und nicht bloß einen gedanklichen Vorgang; die Formulierung bewahrt den gerichtlichen Klang des Gebets.
- source_word: ܚܝ̈ܒܘܬܐ
  choice: Verfehlungen
  rationale: Das Wort bezeichnet schuldhafte Vergehen; „Verfehlungen“ ist verständlich und lässt den genauen Grad der Schuld offen.
- source_word: ܡܕܟܪܐ
  choice: werden … festgehalten
  rationale: Die passive Wiedergabe folgt der grammatischen Ausrichtung der überlieferten Form und vermeidet, Gott ohne Not als ausdrückliches Subjekt eines aktiven Erinnerns einzusetzen.
theological_decisions:
- issue: Gottes Verhältnis zu den menschlichen Verfehlungen
  choice: 'Passive Formulierung: „werden … vor dir festgehalten“'
  alternative: „du erinnerst dich an die Verfehlungen“
  rationale: Der Text stellt die Verfehlungen als vor Gott gegenwärtig bzw. verzeichnet dar. Die passive Form bewahrt diese Aussage, ohne eine weitergehende Lehre über Gottes Erinnern oder Vergessen einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Wiederholung von „vor dir“ gibt die entsprechende Wiederholung im Syrischen wieder und erhält den feierlich-gerichtlichen Ton.
