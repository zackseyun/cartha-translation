translation:
  language: de
  text: Und dir allein kommt es zu, den Ursprung der ganzen Ordnung zu ergründen.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „Und allein dir kommt es zu“.'
    reason: Die syrische Wortstellung hebt die Wendung „dir allein“ beziehungsweise „allein dir“ hervor; beide deutschen Stellungen geben denselben ausschließlichen Sinn wieder.
lexical_decisions:
- source_word: ܒܪܝܫܘܬܗ
  choice: den Ursprung
  rationale: Das Substantiv bezeichnet hier den Anfang beziehungsweise Ursprung; „Ursprung“ passt zum Gegenstand des göttlichen Ergründens.
- source_word: ܟܘܠܐ ܕܒ̣ܝܬ
  choice: der ganzen Ordnung
  rationale: Die Wendung wird im Sinn des gesamten geordneten Gefüges wiedergegeben; „Ordnung“ bewahrt die abstrakte, kosmische Reichweite, ohne sie näher festzulegen.
- source_word: ܕܬܒܥܝܟ
  choice: zu ergründen
  rationale: Das Verb kann „suchen“, „untersuchen“ oder „erforschen“ bedeuten; „ergründen“ ist im Gebetskontext natürlich und bringt die gründliche Erforschung eines Ursprungs zum Ausdruck.
theological_decisions:
- issue: Ausschließlichkeit der göttlichen Erkenntnis
  choice: dir allein
  alternative: allein dir
  rationale: Die exklusive Aussage des Syrischen bleibt ausdrücklich erhalten, ohne näher zu bestimmen, worin Gottes einzigartige Erkenntnisweise besteht.
- issue: Unpersönliche Zugehörigkeits- beziehungsweise Angemessenheitskonstruktion
  choice: dir allein kommt es zu
  alternative: du allein bist imstande
  rationale: Die gewählte Formulierung bewahrt die Aussage von Zuständigkeit oder Angemessenheit und vermeidet es, sie auf bloße Fähigkeit zu verengen.
translation_notes:
  register: Modernes, würdiges Gebetsdeutsch. Das einleitende „Und“ erhält den Anschluss an den vorausgehenden Gedankengang; „kommt es zu“ bildet die syrische Zuständigkeitsformel idiomatisch ab.
