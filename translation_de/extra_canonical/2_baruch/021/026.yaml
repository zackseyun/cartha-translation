  text: But because he was created from the earth and from dust, whatever passes away departs from it to its own place.
translation:
  language: de
  text: Doch weil er aus der Erde und aus Staub geschaffen wurde, geht alles, was vergeht,[a] von ihr fort an seinen eigenen Ort.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „alles, was vorübergeht“.'
    reason: Das zugrunde liegende Verb kann sowohl das Vergehen im Sinn von Vergänglichkeit als auch allgemeiner das Vorübergehen bezeichnen.
lexical_decisions:
- source_word: ܡܢ ܐܪܥܐ ܘܡܢ ܥܦܪܐ (rekonstruiert aus dem für V. 26 bezeugten Wortlaut)
  choice: aus der Erde und aus Staub
  rationale: Die doppelte Herkunftsangabe wird bewahrt. Das maskuline Verb verlangt als gedachtes Subjekt den Menschen; „die Erde wurde aus Staub geschaffen“ scheidet grammatisch aus.
- source_word: ܥܒܪ / entsprechende Form des Übergehens (im Verswortlaut)
  choice: vergeht
  rationale: Im Zusammenhang von Erde, Staub und Rückkehr bezeichnet das Verb wahrscheinlich das Dahingehen bzw. Sterben; die allgemeinere Bedeutung „vorübergeht“ bleibt in der Fußnote sichtbar.
- source_word: ܠܐܬܪܗ
  choice: an seinen eigenen Ort
  rationale: Die Wendung wird formal bewahrt, ohne den gemeinten Ort ausdrücklich mit Grab, Erde oder Totenreich gleichzusetzen.
theological_decisions:
- issue: Bezug des Schöpfungsverbs
  choice: Der Mensch ist aus Erde und Staub geschaffen.
  alternative: Die Erde wurde aus Staub geschaffen.
  rationale: Das grammatische Geschlecht des syrischen Verbs stützt ein männliches, aus dem Kontext ergänztes Subjekt und nicht die feminine „Erde“.
- issue: Bedeutung des Vergehens
  choice: „was vergeht“ als Hinweis auf Sterblichkeit, jedoch ohne ausdrückliche Einfügung von „stirbt“
  alternative: „was vorübergeht“ oder ausdrücklich „wer stirbt“
  rationale: So bleibt die Bildsprache der Vergänglichkeit erhalten, ohne die mögliche weitere Verbedeutung oder den allgemeinen Charakter der Aussage zu beseitigen.
- issue: Bestimmung des „eigenen Ortes“
  choice: nicht näher bestimmt
  alternative: als Erde, Grab oder Totenreich explizit benennen
  rationale: Der Wortlaut lässt die genaue Referenz offen; eine dogmatische Präzisierung wäre eine unbelegte Auslegung.
translation_notes:
  register: Moderne, würdige Standardsprache. Die Wiederholung „aus der Erde und aus Staub“ folgt bewusst der semitischen Parallelität; „von ihr“ bezieht sich grammatisch auf die Erde.
