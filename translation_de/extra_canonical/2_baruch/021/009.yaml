  text: Vom Anfang der Welt an rufst du die Dinge, die nicht existieren, und sie hören auf dich.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܪܝܫ ܥܠܡܐ
  choice: Seit Anbeginn der Welt
  rationale: Gibt die temporale Wendung natürlich und würdevoll wieder, ohne ein zusätzliches „noch“ einzuführen.
- source_word: ܩܪܐ
  choice: rufst du
  rationale: Bewahrt das konkrete Bild des göttlichen Rufens statt es als Erschaffen oder Befehlen auszudeuten.
- source_word: ܕܠܐ …
  choice: das, was nicht existiert
  rationale: Folgt dem negierten Existenzsatz der trotz fehlerhafter OCR durch die kontrollierte Lesart und den geprüften Konsultationstext gestützt ist; „existiert“ ist im Deutschen klarer als „nicht ist“.
- source_word: ܡܫܬܡܥܝܢ
  choice: hört auf dich
  rationale: Die syrische Form bezeichnet Hören im Sinn von Gehorchen; „auf dich hören“ erhält im Deutschen beide Aspekte.
theological_decisions:
- issue: Der Ruf an Nichtseiendes
  choice: „rufst du das, was nicht existiert“
  alternative: „rufst du das Nichtseiende ins Dasein“
  rationale: Die Übersetzung bewahrt die Spannung des Wortlauts und erklärt den Ruf nicht ausdrücklich als Schöpfungsakt.
- issue: Zeitlicher Bezug von „vom Anfang der Welt“
  choice: 'Bezug auf das Rufen: „Seit Anbeginn der Welt rufst du …“'
  alternative: „Du rufst vom Anfang der Welt her …“
  rationale: Die syrische Wortstellung setzt die Zeitangabe unmittelbar zum Verb; die gewählte Fassung ist modernes, natürliches Deutsch, ohne den Satz sachlich zu erweitern.
translation_notes:
  register: Modernes Standarddeutsch in knapper, gebetsartig-erhabener Sprache. Das kollektive „das, was …“ ermöglicht den natürlichen Rückbezug „es“, ohne eine nicht ausdrücklich markierte Mehrzahl oder ein interpretierendes „noch nicht“ einzutragen.
