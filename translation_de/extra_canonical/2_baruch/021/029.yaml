    text: 'Oder: „für die Zeit“.'
    reason: Die knappe Zeitangabe kann eine unbestimmte begrenzte Dauer oder „die Zeit“ als solche bezeichnen.
  - marker: b
    text: 'Auch möglich: „triff eine Anordnung hinsichtlich des Bösen“. Der knappe Ausdruck kann gedanklich in den folgenden Vers hineinreichen.'
    reason: Die Formulierung ist abrupt und lässt Art und Ziel der Anordnung offen.
