translation:
  language: de
  text: Und weil die Welt für eine Zeit erschaffen wurde[a] und diejenigen, die in ihr sind, unter großer Mühsal erhalten werden, ordne hinsichtlich des Bösen an.[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „für die Zeit“.'
    reason: Die knappe Zeitangabe kann eine unbestimmte begrenzte Dauer oder „die Zeit“ als solche bezeichnen.
  - marker: b
    text: 'Auch möglich: „triff eine Anordnung hinsichtlich des Bösen“. Der knappe Ausdruck kann gedanklich in den folgenden Vers hineinreichen.'
    reason: Die Formulierung ist abrupt und lässt Art und Ziel der Anordnung offen.
lexical_decisions:
- source_word: ܥܠܡܐ
  choice: Welt
  rationale: Die reguläre Bedeutung im kosmologischen Zusammenhang ist „Welt“.
- source_word: ܙܒܢܐ
  choice: eine Zeit
  rationale: Gibt die zeitliche Begrenzung natürlich wieder, ohne eine genaue Dauer festzulegen.
- source_word: ܚܫܐ / entsprechende Form im überlieferten Satz
  choice: Mühsal
  rationale: „Mühsal“ bewahrt den ernsten, leidvollen Sinn und passt zum würdevollen Gebetsregister.
- source_word: ܒܝܫܐ / entsprechende Form im überlieferten Satz
  choice: das Böse
  rationale: Die substantivische Wiedergabe lässt offen, ob moralisches Übel, Unheil oder beides gemeint ist.
theological_decisions:
- issue: Zeitliche Bestimmung der erschaffenen Welt
  choice: nur für eine Zeit
  alternative: für die Zeit
  rationale: Die Übersetzung betont die Begrenztheit, legt aber weder eine bestimmte heilsgeschichtliche Epoche noch eine philosophische Zeitlehre fest.
- issue: Gegenstand des göttlichen Gebietens
  choice: gebiete über das Böse
  alternative: triff eine Anordnung hinsichtlich des Bösen
  rationale: Die knappe imperativische Form und ihre theologische Spannung bleiben erhalten; es wird nicht ergänzt, worin das Gebieten besteht.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Mühsal“ wahrt den Gebetston, während „die Menschen darin“ die unklare pronominale Bezugnahme natürlich ausdrückt. Die Satzkürze am Ende wurde nicht durch eine theologische Erläuterung geglättet.
