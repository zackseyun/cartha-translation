revisions:
- from: Und weil die Welt nur für eine Zeit erschaffen wurde[a] und die Menschen darin unter großer Mühsal erhalten werden, gebiete über das Böse.[b]
  to: Und weil die Welt für eine Zeit erschaffen wurde[a] und diejenigen, die in ihr sind, unter großer Mühsal erhalten werden, ordne hinsichtlich des Bösen an.[b]
  rationale: Die Revision entfernt die nicht ausdrücklich vorgegebene Verstärkung „nur“, bewahrt die offene Bezeichnung der in der Welt Befindlichen und ersetzt die im Deutschen missverständliche Herrschaftsformel „gebiete über“ durch einen natürlichen, semantisch passenden Imperativ. Die syntaktische Knappheit und der mögliche Anschluss an den folgenden Vers bleiben gewahrt.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T00:18:20Z'
review_pass:
  verdict: revise
  source_fidelity: 'Die Grundstruktur wird getroffen: die Welt ist zeitlich geschaffen, die in ihr Befindlichen werden unter großer Mühsal erhalten, und es folgt ein knapper Imperativ zum Bösen. „nur“ verstärkt jedoch die zeitliche Begrenzung über die Vorlage bzw. die englische Audit-Fassung hinaus. „die Menschen“ legt den Bezug von „those in it“ unnötig fest. Der Ausdruck „gebiete über das Böse“ bedeutet im Deutschen eher, über das Böse zu herrschen, nicht eine Anordnung hinsichtlich des Bösen zu treffen.'
  naturalness: „unter großer Mühsal erhalten werden“ ist würdig und verständlich. „ordne hinsichtlich des Bösen an“ gibt den bewusst knappen, möglicherweise in den nächsten Vers übergreifenden Imperativ idiomatischer wieder als „gebiete über das Böse“.
  terminology: „Welt“, „Mühsal“ und „das Böse“ sind angemessen und bewahren das kosmologische sowie ethisch/leidbezogene Bedeutungsfeld. Die Formulierung zum Bösen darf dessen genaue Bedeutung und das Ziel der Anordnung nicht ergänzen.
  issues:
  - severity: medium
    issue: „nur“ in „nur für eine Zeit“
    rationale: Die Vorlage sagt nach dem englischen Kontrolltext „for a time“; „nur“ fügt eine kontrastiv-emphatische Einschränkung hinzu, die nicht erforderlich ist.
  - severity: medium
    issue: „die Menschen darin“
    rationale: Die Vorlage spricht lediglich von „those in it“. „Menschen“ ist wahrscheinlich, aber stärker spezifizierend als nötig.
  - severity: high
    issue: „gebiete über das Böse“
    rationale: Im modernen Deutschen heißt „über etwas gebieten“ gewöhnlich, Macht oder Herrschaft darüber zu haben. Gemeint ist hier ein Befehl bzw. eine Anordnung hinsichtlich des Bösen; die Ergänzung bleibt absichtlich offen.
  revised_text: Und weil die Welt für eine Zeit erschaffen wurde[a] und diejenigen, die in ihr sind, unter großer Mühsal erhalten werden, ordne hinsichtlich des Bösen an.[b]
  revised_footnotes:
