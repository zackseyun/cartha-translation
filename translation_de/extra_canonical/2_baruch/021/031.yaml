translation:
  language: de
  text: Denn der Geist des Menschen ist der Lenker der Welt; doch weiß er nicht, was ihm eigen ist.[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Andere mögliche Wiedergabe: „Die Menge der Welt ist der Geist des Menschen.“'
    reason: Die überlieferte syrische Formulierung beziehungsweise ihre Abgrenzung lässt eine stark abweichende Lesart zu, die in der früheren Übersetzungstradition vertreten wurde.
lexical_decisions:
- source_word: ܪܘܚ
  choice: Geist
  rationale: Die reguläre Bedeutung des syrischen Wortes passt zur Aussage über den Geist des Menschen.
- source_word: ܡܕܒܪܢܐ / zugrunde liegende Regierungsbezeichnung
  choice: Lenker
  rationale: „Lenker“ gibt Leitung und Herrschaft in natürlichem, würdigem Deutsch wieder, ohne die moderne Verwaltungsfärbung von „Administrator“.
- source_word: ܕܝܠܗ
  choice: was ihm zukommt
  rationale: Bewahrt den offenen Sinn von Zugehörigkeit, Zuständigkeit oder Bestimmung, statt ihn enger festzulegen.
theological_decisions:
- issue: Rolle des menschlichen Geistes gegenüber der Welt
  choice: „Lenker der Welt“
  alternative: „Herrscher der Welt“ oder „Verwalter der Welt“
  rationale: „Lenker“ wahrt die Vorstellung einer leitenden Stellung, ohne absolute Souveränität oder eine bestimmte anthropologische Lehre einzutragen.
- issue: Bezug des Pronomens in „was ihm zukommt“
  choice: Das männliche Singularpronomen bleibt auf „Geist“ beziehbar.
  alternative: Explizite Deutung als „was den Menschen bestimmt ist“
  rationale: Der Text lässt den genauen Bezug und Umfang der Zugehörigkeit offen; diese Spannung wird nicht aufgelöst.
translation_notes:
  register: Modernes, gut verständliches Standarddeutsch mit würdigem Ton. Das einleitende „Denn“ bewahrt den argumentativen Anschluss. Das unbestimmte „sie“ wird nicht durch eine möglicherweise zu enge Bezugsgruppe ersetzt.
