  verdict: revise
  source_fidelity: Die überlieferte und im englischen Prüfpfad zugrunde gelegte Hauptlesart entspricht sinnvoll „der Geist des Menschen ist der Lenker/Leiter der Welt“. Der folgende Bezug ist jedoch auf den singularischen „Geist“ zu beziehen. „Was ihm zukommt“ ist möglich, legt aber stärker als der wahrscheinliche Sinn von „was ihm eigen ist/gehört“ eine Bestimmung oder Zuteilung nahe.
  naturalness: „Lenker der Welt“ ist ein verständliches, gehoben-neutrales Deutsch. Das pluralische „sie wissen nicht“ ist nach dem unmittelbar vorangehenden singularischen Subjekt missverständlich und grammatisch bzw. referenziell nicht überzeugend.
  terminology: „Geist“, „Lenker“ und „Welt“ sind angemessen. „Was ihm eigen ist“ bewahrt die offene Aussage über das, was dem Geist zugehört, ohne sie zu einer Lehre über seine Bestimmung zu verengen.
  issues:
  - severity: medium
    issue: Numeruswechsel in „doch sie wissen nicht“
    rationale: Der Satz hat als maßgebliches Subjekt „der Geist des Menschen“. Der überlieferte Sinn und die übliche Wiedergabe beziehen das Nichtwissen auf diesen Geist; das pluralische Pronomen erzeugt einen unbegründeten Bezugswechsel.
  - severity: low
    issue: „was ihm zukommt“ verengt den Zugehörigkeitssinn
    rationale: Die Formulierung kann im Deutschen „was ihm zusteht“ oder „wozu er bestimmt ist“ bedeuten. „was ihm eigen ist“ gibt die offene Zugehörigkeitsrelation unmittelbarer wieder.
  revised_text: Denn der Geist des Menschen ist der Lenker der Welt; doch weiß er nicht, was ihm eigen ist.[a]
