  text: And let the treasuries of the souls restore those who are shut up in them, that there may be a gathering of the sons of men, as you commanded from of old.
translation:
  language: de
  text: Und die Schatzkammern der Seelen sollen die in ihnen Eingeschlossenen zurückgeben, damit es zu einer Versammlung der Menschen kommt, wie du es von alters her geboten hast.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܐܘܨܪ̈ܐ ܕܢܦܫ̈ܬܐ
  choice: die Schatzkammern der Seelen
  rationale: Bewahrt das konkrete Bild der syrischen Wendung und entspricht dem apokalyptischen Sprachgebrauch des Werkes.
- source_word: ܐܝܠܝܢ ܕܚܒܝܫܢ ܒܗܘܢ
  choice: die in ihnen Eingeschlossenen
  rationale: Gibt das passive Eingeschlossensein wieder, ohne die Identität oder den Zustand der Verwahrten näher zu bestimmen.
- source_word: ܕܢܗܘܐ ܟܢܘܫܝܐ ܕܒܢܝܢܫܐ
  choice: damit die Menschenkinder versammelt werden
  rationale: Bildet den Zweck- beziehungsweise Folgesatz ab und verbindet ‚Menschenkinder‘ sachgemäß mit der Versammlung, nicht mit dem Herausgeben.
- source_word: ܡܢ ܩܕܝܡ
  choice: von alters her
  rationale: Natürliches, würdiges Deutsch für eine zeitlich weit zurückreichende Anordnung.
theological_decisions:
- issue: Art der Herausgabe aus den Schatzkammern der Seelen
  choice: herausgeben
  alternative: wiederherstellen / zurückgeben
  rationale: ‚Herausgeben‘ wahrt das Bild eines Verwahrungsortes und legt nicht fest, ob der Vorgang als Auferstehung, Rückgabe oder Wiederherstellung genauer zu bestimmen ist.
- issue: Bezug von ‚Menschenkinder‘
  choice: Teil der Versammlungsklausel
  alternative: Empfänger der Herausgabe
  rationale: Die syrische Syntax und die überlieferte Korrektur stützen die Lesart, dass eine Versammlung der Menschenkinder stattfinden soll.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Das apokalyptische Bild der ‚Schatzkammern der Seelen‘ bleibt erhalten; die Aussage wird nicht durch eine ausdrücklich konfessionelle Deutung der Auferstehung präzisiert.
