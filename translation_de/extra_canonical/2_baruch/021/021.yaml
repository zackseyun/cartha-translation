  text: For if this life alone were given to human beings, nothing would be more bitter than this.
translation:
  language: de
  text: Denn wenn den Menschen nur dieses Leben gegeben wäre, wäre nichts bitterer als dieses.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܐ
  choice: Leben
  rationale: Gibt den zentralen Begriff für das menschliche Leben unmittelbar und natürlich wieder.
- source_word: ܒ̈ܢܝܐ
  choice: den Menschen
  rationale: Die semitische Wendung bezeichnet hier die Menschheit allgemein; modernes Deutsch verwendet dafür natürlich „Menschen“ statt einer wörtlichen Wiedergabe als „Menschensöhne“.
- source_word: ܟܒܘܬܐ
  choice: bitterer
  rationale: Bewahrt das Bild der Bitterkeit und passt zur komparativen Aussage des Satzes.
theological_decisions:
- issue: Reichweite von „nur“ und Bedingungsform
  choice: „wenn den Menschen nur dieses Leben gegeben wäre“
  alternative: „wenn nur dieses Leben den Menschen gegeben worden wäre“
  rationale: „Nur“ bezieht sich auf dieses Leben als einziges den Menschen gegebenes Leben. Der Konjunktiv wahrt den hypothetischen Charakter, ohne eine Aussage über den tatsächlichen Zustand dogmatisch festzulegen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; knapp und verständlich. Die symmetrische Formulierung mit zweimaligem „wäre“ erhält den hypothetischen Aufbau und die zugespitzte Schlussaussage.
