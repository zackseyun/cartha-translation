translation:
  language: de
  text: Und denen, die bei ihnen sind und ihnen gleichen, soll bekannt sein, dass dies die Zeit ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܬܝܕܥܐ
  choice: sollen erkennen
  rationale: Das syrische Verb bezeichnet ein Bekanntwerden oder Erkennen. Die personale deutsche Form ist hier natürlicher und bewahrt den Aussagegehalt.
- source_word: ܙܒܢܐ
  choice: Zeit
  rationale: Die Grundbedeutung ist „Zeit“; der bestimmte Ausdruck „dies die Zeit“ bleibt ohne weitergehende Deutung erhalten.
theological_decisions:
- issue: Bestimmung der gemeinten Zeit
  choice: „dass dies die Zeit ist“
  alternative: „dass dies der festgesetzte Zeitpunkt ist“
  rationale: Der Wortlaut bezeichnet die Zeit, erklärt aber nicht ausdrücklich, ob ein festgesetzter heilsgeschichtlicher Zeitpunkt gemeint ist. Die Übersetzung lässt diese Spannung offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die parallelen Relativbestimmungen „die bei ihnen sind und ihnen gleichen“ werden klar und ohne konfessionelle Ausdeutung wiedergegeben.
