translation:
  language: de
  text: Lass deine Herrlichkeit sichtbar werden, und lass die Größe deiner Güte bekannt werden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܫܘܒܚܐ
  choice: Herrlichkeit
  rationale: Die übliche, im Gebetskontext würdevolle Wiedergabe des syrischen Begriffs; sie bewahrt dessen Spannweite von Ehre, Ruhm und offenbarer Majestät.
- source_word: ܪܒܘܬܐ
  choice: Größe
  rationale: Gibt die quantitative wie qualitative Größe schlicht und unmittelbar wieder.
- source_word: ܛܝܒܘܬܐ
  choice: Güte
  rationale: Passt zum Gebetskontext und bewahrt den Sinn göttlicher Güte beziehungsweise Huld, ohne ihn konfessionell einzuengen.
theological_decisions:
- issue: Sichtbarwerden göttlicher Herrlichkeit
  choice: „Lass deine Herrlichkeit sichtbar werden“
  alternative: „Deine Herrlichkeit erscheine“
  rationale: Die Bitte wird als an Gott gerichteter Ruf bewahrt, ohne festzulegen, auf welche konkrete Weise sich seine Herrlichkeit offenbart.
- issue: Bekanntwerden der göttlichen Güte
  choice: „die Größe deiner Güte bekannt werden“
  alternative: „deine große Güte erkannt werden“
  rationale: Die substantivische Aussage über die Größe der Güte bleibt erhalten; „bekannt werden“ bezeichnet ihre Offenbarung, ohne bloß inneres Erkennen vorauszusetzen.
translation_notes:
  register: Modernes, klares und zugleich würdevolles Gebetsdeutsch. Die parallele Satzstruktur des Ausgangssinns bleibt erhalten.
