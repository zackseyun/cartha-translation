translation:
  language: de
  text: Und danach kam ich an den Ort, an dem du mit mir gesprochen hattest.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܡܢ ܒܬܪܗܝܢ
  choice: Und danach
  rationale: Die Wendung bedeutet wörtlich „und nach diesen“; im Deutschen gibt „danach“ den zeitlichen Anschluss natürlich und präzise wieder.
- source_word: ܠܐܬܪܐ ܗܘ
  choice: an den Ort
  rationale: ܐܬܪܐ bezeichnet hier einen bestimmten, bereits bekannten Ort; das Demonstrative wird im Deutschen durch den bestimmten Artikel idiomatisch aufgenommen.
- source_word: ܕܡܠܠܬ ܥܡܝ
  choice: an dem du mit mir gesprochen hattest
  rationale: ܡܠܠܬ ist eine Anrede in der 2. Person Singular; das Plusquamperfekt verdeutlicht im Deutschen, dass das Sprechen vor Baruchs Ankunft lag.
theological_decisions:
- issue: Person des zuvor Sprechenden
  choice: „du“ als direkte Anrede Gottes
  alternative: „er“ wie in der englischen Konsultationsfassung
  rationale: Die syrische Verbform ܡܠܠܬ weist auf die 2. Person Singular. Der Gebetszusammenhang bestätigt die fortgesetzte direkte Anrede; daher wird die eindeutige Quellenaussage nicht nach der englischen Fassung verändert.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch; knapper erzählender Gebetsstil. Keine Fußnote erforderlich, da die syrische Personenmarkierung hinreichend klar ist.
