  text: Therefore from now on show your greatness, and do not overlook what is brought to nothing under the kingdom of death.
translation:
  language: de
  text: Darum zeige von nun an deine Größe und sieh nicht darüber hinweg, was unter der Herrschaft des Todes zunichtegemacht wird.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܢ ܗܫܐ (sinngemäß im konsultierten Versbestand)
  choice: von nun an
  rationale: Gibt den zeitlichen Einsatzpunkt natürlich und würdig wieder.
- source_word: ܪܒܘܬܟ / Größe (sinngemäß im konsultierten Versbestand)
  choice: deine Größe
  rationale: Bewahrt die offene Bedeutung von göttlicher Größe beziehungsweise Macht, ohne sie auf eine bestimmte Handlung einzuengen.
- source_word: ܡܠܟܘܬܐ ܕܡܘܬܐ / kingdom of death (konsultierter Versbestand)
  choice: Herrschaft des Todes
  rationale: Im Deutschen ist dies natürlicher als „Königreich des Todes“ und bewahrt den personifizierten Machtbereich des Todes.
- source_word: zunichtegebracht werden (passive Aussage des konsultierten Versbestands)
  choice: zunichtegemacht wird
  rationale: Erhält das Passiv und legt weder den Handelnden noch die genaue Art des Untergangs fest.
theological_decisions:
- issue: Personifizierung des Todes als herrschende Macht
  choice: unter der Herrschaft des Todes
  alternative: im Totenreich
  rationale: „Totenreich“ würde den Ausdruck stärker als Ortsbezeichnung deuten; „Herrschaft des Todes“ bewahrt die Aussage über den Machtbereich des Todes.
- issue: Gegenstand dessen, was zunichtegemacht wird
  choice: was
  alternative: diejenigen, die
  rationale: Das neutrale Relativpronomen erhält die offene Referenz und beschränkt die Aussage nicht ausdrücklich auf Personen.
translation_notes:
  register: Moderne, gut verständliche Standardsprache mit würdigem Gebetston. Der bereitgestellte syrische Kapitelbestand ist an der einschlägigen Stelle offenbar unvollständig beziehungsweise seitenübergreifend; deshalb wurde die geprüfte englische Konsultationsfassung eng berücksichtigt, ohne ihre möglichen Deutungen weiter zu präzisieren.
