translation:
  language: de
  text: Sieh auf die Liebe zu deinem Namen, die vor dir über allem steht.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܘܪ
  choice: Sieh auf
  rationale: Das syrische Verb bedeutet „schau hin / richte den Blick auf“ und wird im Deutschen als würdige, natürliche Aufforderung wiedergegeben.
- source_word: ܚܘܒܐ ܕܫܡܟ (aus dem durch Seitenabbruch beschädigten Zusammenhang erschlossen)
  choice: die Liebe zu deinem Namen
  rationale: Der Genitiv wird bewusst nicht weiter dogmatisch bestimmt; „Liebe zu deinem Namen“ ist im Deutschen verständlich und entspricht der überlieferten Konsultationsfassung.
- source_word: ܩܕܡܝܟ … ܡܢ ܟܠ
  choice: die vor dir über allem steht
  rationale: Bewahrt sowohl die räumlich-forensische Wendung „vor dir“ als auch den Vorrang „über allem“, ohne die Beziehung stärker auszudeuten.
theological_decisions:
- issue: Bezug der „Liebe zu deinem Namen“
  choice: Die Genitivbeziehung bleibt als Liebe „zu“ Gottes Namen offen formuliert.
  alternative: „deine Liebe zu deinem Namen“ oder „die Liebe um deines Namens willen“
  rationale: Der beschädigte Textbefund rechtfertigt keine eindeutige Festlegung auf Gottes eigene Liebe oder auf eine bestimmte heilsgeschichtliche Deutung.
translation_notes:
  register: Modernes, gehobenes Standarddeutsch mit gebetsartigem Ton. Die ungewöhnliche Wendung „vor dir über allem“ bleibt erhalten, um Bildsprache und Mehrdeutigkeit des syrischen Ausdrucks nicht vorschnell aufzulösen.
