translation:
  language: de
  text: 'Sieh: Denn du allein vermagst alle zu erhalten – die da sind, die vergangen sind und die kommen werden.[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „das Flehen derer, die vor dir sind“.'
    reason: Der schwer segmentierbare syrische Wortlaut kann „Flehen/Bitte“ statt der einleitenden Aufforderung als maßgeblichen Ausdruck lesen lassen.
  - marker: b
    text: 'Oder: „das Flehen derer, die vor dir sind, sowie der Vergangenen und der Kommenden zu tragen“.'
    reason: Der syrische Satzbau lässt zu, dass „Flehen“ das Objekt des Verbs ist und die folgenden Gruppen davon abhängen.
  - marker: c
    text: 'Wörtlich: „zu tragen“.'
    reason: Bewahrt die konkrete Grundbedeutung des syrischen Verbs neben der idiomatischen Hauptübersetzung „zu erhalten“.
lexical_decisions:
- source_word: ܚܘܪ
  choice: Sieh
  rationale: Der Imperativ wird knapp und gebetsgemäß wiedergegeben; der beschädigte beziehungsweise schwer segmentierbare Anschluss lässt daneben einen Bezug auf das Flehen zu.
- source_word: ܡܫܟܚ ܐܢܬ
  choice: du allein vermagst
  rationale: Gibt die ausgesagte einzigartige Fähigkeit Gottes in natürlichem, würdigem Deutsch wieder.
- source_word: ܕܬܣܒܪ
  choice: zu erhalten
  rationale: Das Verb kann wörtlicher mit „tragen“ wiedergegeben werden; „erhalten“ drückt hier idiomatisch das Tragen und Aufrechterhalten der Genannten aus, ohne die wörtliche Möglichkeit zu verschweigen.
- source_word: ܐܝܠܝܢ ܕܩܕܡ̈ܝܟ
  choice: die vor dir sind
  rationale: Bewahrt den räumlich-präsentischen Ausdruck des Syrischen und vermeidet eine unnötige Festlegung auf bloß gegenwärtig Lebende.
- source_word: ܐܝܠܝܢ ܕܥܬܝ̈ܕܢ
  choice: die Kommenden
  rationale: Die substantivierte Form hält die zeitliche Offenheit des Ausdrucks fest und entspricht dem Parallelismus mit den Vergangenen.
theological_decisions:
- issue: Gottes Verhältnis zu Gegenwärtigen, Vergangenen und Kommenden
  choice: „alle zu erhalten“
  alternative: „das Flehen derer vor dir … zu tragen“
  rationale: Die Hauptfassung folgt der im Überlieferungszusammenhang möglichen Aussage von Gottes umfassendem Erhalten, während die syntaktische Alternative in einer Fußnote offengelegt wird; so wird die theologische Spannung nicht stillschweigend entschieden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit knapper Gebetssprache. Die Reihung bleibt bewusst leicht feierlich; echte syntaktische und lexikalische Mehrdeutigkeiten werden in den Fußnoten erhalten.
