  yaml_path: translation/extra_canonical/2_baruch/027/001.yaml
  text: 'And I answered and said to him, “After this, that time is divided into twelve parts, and each one of them is known for what has been appointed in it. In the first part: the beginning of upheavals. In the second part: the slaying of the great ones. In the third part: the fall of many. In the fourth part: the sending forth of the sword. In the fifth part: famine. In the sixth part: earthquakes. In the seventh part: terrors and plagues. In the eighth part: assaults of spirits and of demons of apparitions. In the ninth part: the fall of fire. In the tenth part: plundering and much oppression.”'
translation:
  language: de
  text: 'Und ich antwortete und sagte zu ihm: »Danach ist jene Zeit in zwölf Abschnitte geteilt, und jeder einzelne ist durch das gekennzeichnet, was in ihm bestimmt ist. Im ersten Abschnitt: der Anfang der Unruhen. Im zweiten Abschnitt: die Tötung der Großen. Im dritten Abschnitt: der Sturz vieler. Im vierten Abschnitt: die Entsendung des Schwertes. Im fünften Abschnitt: Hungersnot. Im sechsten Abschnitt: Erdbeben. Im siebten Abschnitt: Schrecken und Plagen. Im achten Abschnitt: Angriffe von Geistern und von Dämonen der Erscheinungen.[a] Im neunten Abschnitt: das Herabfallen von Feuer. Im zehnten Abschnitt: Plünderung und schwere Unterdrückung.«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Die syrische Genitivreihe ist mehrdeutig. Auch möglich: »Angriffe durch Geister, Dämonen und Erscheinungen« oder »Angriffe von Geistern und von Dämonen in Erscheinungsgestalten«.'
    reason: Die genaue syntaktische Beziehung zwischen Angriffen, Geistern, Dämonen und Erscheinungen ist im Syrischen nicht eindeutig und wird im Haupttext nicht festgelegt.
lexical_decisions:
- source_word: ܡܢܝܢ ... ܙܒܢܝ̈ܢ
  choice: ist ... in zwölf Abschnitte geteilt
  rationale: Die sichtbare Zahl im Seitenabzug ist unsicher, doch die fortlaufend gezählten Abschnitte und die Kontrollüberlieferung stützen das Zwölferschema. »Abschnitte« gibt die zeitliche Gliederung natürlich wieder.
- source_word: ܡܬܬܝܕܥܐ
  choice: ist ... zu erkennen
  rationale: Das passive Verb bezeichnet hier, dass jeder Abschnitt durch das ihm zugewiesene Geschehen kenntlich ist. Diese Wiedergabe bewahrt den Erkenntnisaspekt und passt idiomatisch zum folgenden Relativsatz.
- source_word: ܙ̈ܘܥܐ
  choice: Unruhen
  rationale: Beim ersten Vorkommen ist ein breiterer Sinn als bei den ausdrücklich genannten Erdbeben im sechsten Abschnitt wahrscheinlich; »Unruhen« wahrt diese Unterscheidung.
- source_word: ܪ̈ܘܪܒܢܐ
  choice: die Großen
  rationale: Die offene Bezeichnung kann gesellschaftlich oder politisch herausragende Menschen meinen, ohne sie enger als Mächtige oder Adlige festzulegen.
- source_word: ܫܕܪܘܬܐ ܕܚܪܒܐ
  choice: die Entsendung des Schwertes
  rationale: Die Formulierung erhält das aktive Bild eines ausgesandten Schwertes und reduziert es nicht auf allgemeinen Krieg.
- source_word: ܬܗܪ̈ܐ
  choice: Schrecken
  rationale: Im Zusammenhang der apokalyptischen Notfolge bezeichnet das Wort erschreckende, Entsetzen auslösende Ereignisse.
- source_word: ܡܚܘ̈ܬܐ
  choice: Plagen
  rationale: »Plagen« gibt den kollektiven Katastrophen- und Gerichtscharakter natürlicher wieder als das wörtlichere »Schläge«.
- source_word: ܫܘ̈ܕܐ ܕܢܦܫ̈ܬܐ
  choice: Angriffe von Geistern
  rationale: Die schwierige Wendung wird im feindseligen apokalyptischen Kontext als übernatürliche Bedrängung verstanden, ohne sie zu psychologisieren.
- source_word: ܫ̈ܐܕܐ ܕܦܪ̈ܨܘܦܐ
  choice: Dämonen in Erscheinungsgestalten
  rationale: Die Konstruktion ist mehrdeutig. Die Wiedergabe versteht »Gestalten/Gesichter« als sichtbare Erscheinungsformen der Dämonen und vermeidet das im Deutschen missverständliche »Dämonen von Erscheinungen«.
- source_word: ܚܛܘܦܝܐ
  choice: Plünderung
  rationale: Das Wort bezeichnet gewaltsames Wegraffen oder Rauben; »Plünderung« passt als Ereignisbezeichnung in die Aufzählung.
- source_word: ܐܢܘܣܝܐ ܣܓܝܐܐ
  choice: schwere Unterdrückung
  rationale: Das Adjektiv wird qualitativ als Intensivierung wiedergegeben; »schwer« klingt im Deutschen natürlicher als »viel Unterdrückung«.
theological_decisions:
- issue: Zahlenschema der Wehen
  choice: zwölf Abschnitte
  alternative: dreißig Zeiten oder Zeitabschnitte nach dem gegenwärtig sichtbaren, möglicherweise fehlerhaften Seitenbefund
  rationale: Die geordnete Folge und die Kontrollüberlieferung sprechen deutlich für das traditionelle Zwölferschema; die Quellenunsicherheit wird nicht verschwiegen.
- issue: Übernatürliche Erscheinungen im achten Abschnitt
  choice: Geister und Dämonen werden als wirkliche Größen innerhalb der apokalyptischen Bildwelt beibehalten
  alternative: rein psychologische Schrecken oder allgemein naturalisierte Katastrophen
  rationale: Der syrische Text nennt ausdrücklich Geister und Dämonen; eine naturalisierende Übersetzung würde diese theologische und visionäre Spannung beseitigen.
- issue: Beziehung zwischen Dämonen und Erscheinungsgestalten
  choice: Erscheinungsgestalten als nähere Bestimmung der Dämonen
  alternative: 'zwei parallele Gruppen: Dämonen und Erscheinungen beziehungsweise »Dämonen von Erscheinungen«'
  rationale: Die Genitivfolge lässt mehr als eine syntaktische Zuordnung zu. Der Haupttext wählt eine verständliche Lesart; die Fußnote bewahrt die echte Mehrdeutigkeit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit bewusst knappem, katalogartigem Rhythmus. Die wiederholte Formel »Im ... Abschnitt« erhält die apokalyptische Gliederung. Altertümliche Wörter wurden vermieden; markante Bilder wie die Entsendung des Schwertes und der Feuerfall bleiben erhalten.
