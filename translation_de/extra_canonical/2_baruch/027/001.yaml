- from: 'Und ich antwortete und sagte zu ihm: »Danach ist jene Zeit in zwölf Abschnitte geteilt, und jeder einzelne von ihnen ist an dem zu erkennen, was für ihn bestimmt ist. Im ersten Abschnitt: der Anfang der Unruhen. Im zweiten Abschnitt: die Tötung der Großen. Im dritten Abschnitt: der Sturz vieler. Im vierten Abschnitt: die Entsendung des Schwertes. Im fünften Abschnitt: Hungersnot. Im sechsten Abschnitt: Erdbeben. Im siebten Abschnitt: Schrecken und Plagen. Im achten Abschnitt: Angriffe von Geistern und von Dämonen in Erscheinungsgestalten.[a] Im neunten Abschnitt: das Herabfallen von Feuer. Im zehnten Abschnitt: Plünderung und schwere Unterdrückung.«'
  to: 'Und ich antwortete und sagte zu ihm: »Danach ist jene Zeit in zwölf Abschnitte geteilt, und jeder einzelne ist durch das gekennzeichnet, was in ihm bestimmt ist. Im ersten Abschnitt: der Anfang der Unruhen. Im zweiten Abschnitt: die Tötung der Großen. Im dritten Abschnitt: der Sturz vieler. Im vierten Abschnitt: die Entsendung des Schwertes. Im fünften Abschnitt: Hungersnot. Im sechsten Abschnitt: Erdbeben. Im siebten Abschnitt: Schrecken und Plagen. Im achten Abschnitt: Angriffe von Geistern und von Dämonen der Erscheinungen.[a] Im neunten Abschnitt: das Herabfallen von Feuer. Im zehnten Abschnitt: Plünderung und schwere Unterdrückung.«'
