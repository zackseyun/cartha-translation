  yaml_path: translation/extra_canonical/2_baruch/073/004.yaml
  text: And judgments, and accusations, and contentions, and retaliations, and bloodshed, and cravings, and envy, and hatred, and everything like these will pass away into condemnation when they are removed.
translation:
  language: de
  text: Und Gerichte, Anklagen, Streitigkeiten, Vergeltungsakte, Blutvergießen, Begierden, Neid und Hass sowie alles, was dem ähnlich ist, werden, wenn sie beseitigt werden, der Verurteilung anheimfallen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕ̈ܝܢܐ
  choice: Gerichte
  rationale: Gibt den juristischen beziehungsweise richtenden Sinn des syrischen Plurals wieder, ohne ihn auf bloße Urteile zu verengen.
- source_word: ܡܕ̈ܝܢܝܘܬܐ
  choice: Anklagen
  rationale: Bezeichnet hier im Zusammenhang mit Gerichten und Streitigkeiten rechtliche Anschuldigungen oder Prozesshandlungen.
- source_word: ܚܪ̈ܝܢܐ
  choice: Streitigkeiten
  rationale: Entspricht dem Sinn von Auseinandersetzungen und Zwistigkeiten in der Aufzählung.
- source_word: ܬܒ̈ܥܬܐ
  choice: Vergeltungsakte
  rationale: Bewahrt den aktiven Sinn von Verfolgung, Ahndung oder Vergeltung; der Kontext legt wechselseitige Vergeltung nahe.
- source_word: ܕܡܐ
  choice: Blutvergießen
  rationale: Wörtlich steht »Blut«; in dieser Reihe gesellschaftlicher Übel bezeichnet es idiomatisch gewaltsames Blutvergießen.
- source_word: ܪ̈ܓܝܓܬܐ
  choice: Begierden
  rationale: Der Plural bezeichnet starke beziehungsweise ungeordnete Verlangen, ohne sie auf einen einzelnen Bereich festzulegen.
- source_word: ܚܣܡܐ
  choice: Neid
  rationale: Natürliche deutsche Entsprechung für feindselige Eifersucht oder Missgunst.
- source_word: ܣܢܐܬܐ
  choice: Hass
  rationale: Direkte und registergerechte Wiedergabe.
- source_word: ܠܚܘܝܒܐ ܢܬ̈ܪܝܡܢ ܟܕ ܢܫ̈ܬܩܠܢ
  choice: werden, wenn sie beseitigt werden, der Verurteilung anheimfallen
  rationale: Bewahrt sowohl die Aussage ihrer Entfernung als auch ihre Zuordnung zur Verurteilung, ohne die syntaktisch-semantische Spannung des Syrischen zu glätten.
theological_decisions:
- issue: Verhältnis zwischen Beseitigung und Verurteilung der genannten Übel
  choice: 'Beide Aussagen bleiben nebeneinander stehen: Die Übel werden beseitigt und fallen der Verurteilung anheim.'
  alternative: Die Übel verschwinden lediglich beziehungsweise werden als Folge der Verurteilung beseitigt.
  rationale: Der syrische Wortlaut nennt ausdrücklich sowohl Verurteilung als auch Wegnahme; die Übersetzung löst deren genaues Verhältnis nicht dogmatisch auf.
translation_notes:
  register: Moderne, würdige Standardsprache. Die lange Aufzählung und ihre eschatologische Endaussage bleiben erhalten; juristische und zwischenmenschliche Begriffe werden klar voneinander unterschieden.
