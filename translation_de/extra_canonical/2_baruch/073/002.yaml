  yaml_path: translation/extra_canonical/2_baruch/073/002.yaml
  text: And then healing will descend in dew,[b] and anxiety will be quieted, and misery and disease and groanings will flee from the sons of men; and gladness will be in all the earth.
translation:
  language: de
  text: Dann wird Heilung im Tau herabkommen,[a] und Ruhe wird sichtbar werden; Elend, Krankheit und Seufzen werden von den Menschen fliehen. Auf der ganzen Erde wird Freude sein.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich beziehungsweise nach der überlieferten Bildsprache: „im/mit dem Tau“; möglich ist auch: „wie Tau“. Der syrische Text ist an dieser Stelle nicht völlig klar.'
    reason: Bewahrt die sprachliche und textliche Unsicherheit in der Beziehung zwischen Heilung und Tau, ohne die Bildsprache auf eine einzige Deutung festzulegen.
lexical_decisions:
- source_word: ܒܒܘܣܡܐ … ܛܠܐ (textlich unsichere Wortfolge)
  choice: Heilung mit dem Tau
  rationale: Der überlieferte Text dieses Abschnitts ist in der vorliegenden Wiedergabe gestört, doch die kontrollierte Lesetradition verbindet das Herabkommen von Heilung mit Tau. „Mit dem Tau“ bewahrt das Bild und legt nicht fest, ob der Tau Mittel, Begleiterscheinung oder bildhafte Gestalt der Heilung ist.
- source_word: ܢܝܚܐ / ܢܬܬܢܝܚ
  choice: die Unruhe wird gestillt werden
  rationale: Die Wortgruppe bezeichnet das Zur-Ruhe-Kommen beziehungsweise Beruhigtwerden. „Unruhe“ gibt den negativen Zustand natürlich wieder, ohne ihn enger als Angst oder Sorge festzulegen.
- source_word: ܕܘܝܐ
  choice: Elend
  rationale: Das Wort bezeichnet einen Zustand von Leid und Betrübnis; „Elend“ passt zur Reihe körperlicher und seelischer Nöte.
- source_word: ܟܘܪܗܢܐ
  choice: Krankheit
  rationale: Direkte und allgemein verständliche Wiedergabe.
- source_word: ܐܢܚ̈ܬܐ
  choice: Seufzen
  rationale: Bewahrt den hörbaren Ausdruck des Leidens; der deutsche Kollektivgebrauch ist hier natürlicher als der Plural „Seufzer“.
- source_word: ܒܢܝܢܫ̈ܐ
  choice: von den Menschen
  rationale: Idiomatiche Wiedergabe des wörtlichen Ausdrucks „Menschensöhne“, ohne Einschränkung auf Männer.
- source_word: ܚܕܘܬܐ
  choice: Freude
  rationale: Entspricht dem gewöhnlichen Sinn und erhält den Kontrast zur vorherigen Leidensreihe.
theological_decisions:
- issue: Art und Vermittlung der endzeitlichen Heilung
  choice: Heilung kommt „mit dem Tau“ herab
  alternative: Heilung kommt „als Tau“ oder „im Tau“ herab
  rationale: Die Übersetzung erhält die poetische und möglicherweise schöpfungstheologische Bildsprache, ohne die genaue Beziehung zwischen Heilung und Tau dogmatisch festzulegen.
- issue: Umfang der Freude
  choice: Auf der ganzen Erde wird Freude herrschen
  alternative: Freude wird auf der ganzen Erde sein
  rationale: „Herrschen“ ist natürliches Deutsch für einen umfassenden Zustand, fügt aber keinen bestimmten politischen oder messianischen Herrschaftsbegriff hinzu.
translation_notes:
  register: Modernes, würdiges Standarddeutsch mit klarer Satzführung. Die Leidensbegriffe bleiben als eindringliche Reihung erhalten; „Menschen“ ersetzt das im Deutschen missverständliche wörtliche „Menschensöhne“.
