  text: For these are the things that filled this world with evils, and because of these the life of mankind was greatly troubled.[c]
translation:
  language: de
  text: Denn sie sind es, die diese Welt mit Übeln erfüllt haben, und ihretwegen ist das Leben der Menschen zutiefst erschüttert worden.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܗܢܝܢ ܐܢܝܢ ܓܝܪ
  choice: Denn dies sind die Dinge
  rationale: Gibt die begründende Partikel ܓܝܪ und die demonstrative Identifizierung formal und zugleich idiomatisch wieder.
- source_word: ܒܝܫ̈ܬܐ / zugrunde liegendes Äquivalent im überlieferten Fortgang
  choice: Übeln
  rationale: Der Plural bezeichnet umfassend schädliche und böse Zustände; „Übel“ bewahrt diese Breite besser als nur „Böses“.
- source_word: ܚܝ̈ܐ ܕܒܢܝܢܫ̈ܐ / zugrunde liegendes Äquivalent im überlieferten Fortgang
  choice: das Leben der Menschen
  rationale: Natürliches modernes Deutsch für die kollektive Aussage über die Menschheit, ohne sie auf einzelne Personen zu verengen.
- source_word: ܐܬܕܠܚ / sinngemäßes Äquivalent im überlieferten Fortgang
  choice: ist … schwer erschüttert worden
  rationale: Bewahrt das Bild tiefgreifender Unruhe oder Zerrüttung; „erschüttert“ ist im Deutschen würdig und verständlich.
theological_decisions:
- issue: Art und Ursache menschlichen Leids
  choice: Die genannten Übel erfüllen die Welt und erschüttern das menschliche Leben.
  alternative: Die Aussage als umfassende Lehre über Erbsünde oder persönliche Schuld ausdeuten.
  rationale: Der Vers beschreibt einen kausalen Zusammenhang, legt aber keine bestimmte konfessionelle Sündenlehre fest.
- issue: Zeitliche Aussage
  choice: 'Perfektische Formulierung: „erfüllt haben“ und „ist … erschüttert worden“.'
  alternative: 'Präsentische Verallgemeinerung: „erfüllen“ und „wird bedrängt“.'
  rationale: Die rückblickende Aussage des Kontextes bleibt erhalten, ohne ihre fortdauernde Bedeutung auszuschließen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur bleibt eng am syrischen Gedankengang, während „ihretwegen“ die kausale Verbindung natürlich ausdrückt. Die vorgelegte Seitenabschrift bricht am Beginn des Satzes ab; der weitere Wortlaut wird durch den kontrollierten Kapitelzusammenhang und die auditierte englische Konsultationsschicht gestützt.
