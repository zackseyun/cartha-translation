  yaml_path: translation/extra_canonical/2_baruch/073/001.yaml
  text: And it shall be, after he has brought low all that is in the world, and has sat down in peace forever on the throne of his kingdom, then joy will be revealed, and rest will appear.[a]
translation:
  language: de
  text: '1 Und es wird geschehen: Nachdem er alles, was in der Welt ist, erniedrigt und sich für immer in Frieden auf den Thron seines Reiches gesetzt hat, wird Freude offenbart werden, und Ruhe wird erscheinen.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡܟܟ / entsprechende syrische Verbform im überlieferten Satz
  choice: erniedrigt
  rationale: Bewahrt den Gedanken des Niederbeugens beziehungsweise Unterwerfens, ohne ihn durch ein stärker konfessionell geprägtes Wort zu deuten.
- source_word: ܚܕܘܬܐ
  choice: Freude
  rationale: Die natürliche und sachlich genaue deutsche Entsprechung für Freude beziehungsweise Frohsein.
- source_word: ܢܝܚܐ
  choice: Ruhe
  rationale: Gibt das Bedeutungsfeld von Ruhe, Erquickung und ungestörtem Frieden knapp wieder; die Nähe zum vorherigen Frieden bleibt erhalten.
- source_word: ܢܬܚܙܐ
  choice: sichtbar werden
  rationale: Gibt das syrische Passiv von »sehen« anschaulich wieder und hält die Parallelität zu »offenbar werden« aufrecht.
theological_decisions:
- issue: Nicht ausdrücklich genannter Handlungsträger
  choice: Das Pronomen »er« bleibt stehen.
  alternative: »der Messias« ausdrücklich einsetzen
  rationale: Der Zusammenhang identifiziert den Handlungsträger, doch der Vers selbst nennt ihn nicht erneut. Die Übersetzung vermeidet deshalb eine erklärende Einfügung.
- issue: Reichweite der Erniedrigung
  choice: »alles, was in der Welt ist«
  alternative: »alle, die in der Welt sind« oder »die ganze Welt«
  rationale: Die sachliche Weite und mögliche Spannung der Formulierung bleiben erhalten; sie wird weder ausschließlich auf Personen noch auf die Welt als Ganzes verengt.
- issue: Dauer und Frieden der Herrschaft
  choice: »sich für immer in Frieden auf den Thron seines Reiches gesetzt hat«
  alternative: »für immer auf seinem friedlichen Königsthron sitzt«
  rationale: Die gewählte Fassung unterscheidet den Frieden, in dem er sitzt, vom Thron und vermeidet eine zusätzliche Deutung des Thrones selbst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der feierliche Zukunftseinsatz »Und es wird geschehen« wurde bewahrt. Die Satzstruktur bleibt nah am Syrischen, wurde aber so geordnet, dass sie für heutige Leser klar verständlich ist. Der bereitgestellte Seitenausschnitt weist unsichere Kapitel- und Versgrenzen sowie Überlappungen auf; daher wurde die geprüfte englische Konsultationsfassung zur Kontrolle der Versabgrenzung herangezogen, ohne ihre Formulierungen mechanisch zu übernehmen.
