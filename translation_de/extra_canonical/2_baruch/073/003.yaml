  text: And no one will again die before his time, nor will any sudden adversity come to pass.
translation:
  language: de
  text: Und niemand wird mehr vor seiner Zeit sterben, und kein plötzliches Unglück wird geschehen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܘܬܘܒ ܠܐ ܢܡܘܬ ܕܠܐ ܒܙܒܢܗ
  choice: Und niemand wird mehr vor seiner Zeit sterben
  rationale: Die idiomatische Negation „nicht zu seiner Zeit“ bezeichnet einen vorzeitigen Tod. „Niemand“ gibt das im Deutschen notwendige unbestimmte Subjekt wieder; „mehr“ entspricht ܬܘܒ im Zusammenhang.
- source_word: ܡܕܡ ܡܥܝܩ
  choice: Unglück
  rationale: Wörtlich ist etwas Bedrängendes oder Not Bereitendes gemeint. „Unglück“ ist hier natürlich und umfasst widrige, leidvolle Ereignisse, ohne sie näher festzulegen.
- source_word: ܢܓܕܫ ܣܡܡܠܐ ܡܕܡ
  choice: kein plötzliches … wird geschehen
  rationale: Die Wendung beschreibt das Eintreten eines plötzlichen widrigen Ereignisses. Die deutsche Formulierung bewahrt sowohl den Ereignischarakter als auch die Plötzlichkeit.
theological_decisions:
- issue: Fortbestehen oder Aufhebung des Todes
  choice: „vor seiner Zeit sterben“
  alternative: „sterben“ schlechthin ausschließen
  rationale: Der syrische Text verneint den Tod außerhalb der bestimmten Zeit, nicht ausdrücklich jeden Tod. Diese Spannung wird nicht zugunsten einer Lehre von völliger Sterblichkeitsaufhebung aufgelöst.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; knapp und parallel gebaut. Keine konfessionell geprägte Terminologie.
