  text: And he answered and said to me, “Whatever is destined to happen at that time will happen upon the whole earth; therefore, all who live will experience[a] it.”
translation:
  language: de
  text: 'Und er antwortete und sagte zu mir: »Alles, was zu jener Zeit geschehen soll, wird auf der ganzen Erde geschehen. Darum werden es alle Lebenden erleben[a].«'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „wahrnehmen“ oder „spüren“.'
    reason: lexical_choice
lexical_decisions:
- source_word: ܕܥܬܝܕ ܠܡܗܘܐ
  choice: geschehen soll
  rationale: Die Wendung bezeichnet das künftig Bevorstehende und kann zugleich Bestimmung anklingen lassen. „Geschehen soll“ bewahrt diese Offenheit, ohne im Deutschen eine ausdrücklich fatalistische Aussage zu erzwingen.
- source_word: ܢܪܓܫܘܢ
  choice: erleben
  rationale: Das Verb ܪܓܫ bedeutet wörtlich „wahrnehmen, spüren“. Im Zusammenhang weltweiter Ereignisse gibt „erleben“ den gemeinten Vorgang natürlich wieder; die engere Grundbedeutung wird in der Fußnote erhalten.
- source_word: ܥܠ ܟܠܗ̇ ܐܪܥܐ
  choice: auf der ganzen Erde
  rationale: Die räumliche Wendung wird nah am Syrischen wiedergegeben und drückt die weltweite Reichweite des Geschehens aus.
theological_decisions:
- issue: Bestimmung des zukünftigen Geschehens
  choice: geschehen soll
  alternative: dazu bestimmt ist zu geschehen
  rationale: Der Text spricht vom bevorstehenden beziehungsweise bestimmten Geschehen, erklärt aber an dieser Stelle nicht ausdrücklich dessen Urheber oder die genaue Art der Bestimmung. Die Übersetzung lässt diese theologische Spannung bestehen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die wiederholte Formulierung „geschehen … geschehen“ folgt bewusst der Wiederholung des syrischen Verbs und unterstreicht, dass das angekündigte Geschehen die ganze Erde betrifft.
