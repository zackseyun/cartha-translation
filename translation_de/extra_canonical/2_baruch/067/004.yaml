  text: Doch wie wird sein gerechtes Urteil lauten?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܝܢܐ
  choice: Urteil
  rationale: Gibt den forensischen Sinn natürlich wieder; „Gericht“ wäre ebenfalls möglich, könnte im Deutschen aber eher das Gerichtsorgan oder das Gerichtsgeschehen bezeichnen.
- source_word: ܙܕܝܩܐ
  choice: gerecht
  rationale: Bewahrt die ethische und forensische Bedeutung, ohne sie konfessionell auszudeuten.
theological_decisions:
- issue: Bezug des gerechten Urteils
  choice: Das Possessivpronomen „sein“ bleibt ohne zusätzliche Identifizierung stehen.
  alternative: Den Urteilenden ausdrücklich als Gott benennen.
  rationale: Der vorgelegte Vers nennt den Bezug nur pronominal; eine ausdrückliche Identifizierung würde die im Einzelvers vorhandene Offenheit auflösen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. „Wie … lauten?“ ist eine natürliche deutsche Wiedergabe der Frage nach dem Inhalt beziehungsweise Ausgang eines Urteils. Die bereitgestellte syrische Kapitelabschrift ist stark gestört und Vers 67:4 darin nicht sicher abzugrenzen; daher wurde die englische auditierte Konsultationsfassung zur Kontrolle herangezogen, ohne zusätzliche Deutung einzutragen.
