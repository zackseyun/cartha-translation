  text: And the eleventh black waters that you saw—this is the calamity that has now come upon Zion.[a]
translation:
  language: de
  text: Und die elften schwarzen Wasser, die du gesehen hast – das ist das Unheil, das nun über Zion gekommen ist.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܘܟ̈ܡܐ
  choice: schwarzen Wasser
  rationale: Die feste Bildsprache der Vision und der Gegensatz zwischen schwarzen und hellen Wassern bleiben ausdrücklich erhalten.
- source_word: ܫܘܚܬܐ
  choice: Unheil
  rationale: Das Wort bezeichnet hier das über Zion hereingebrochene Verderben bzw. Unglück; „Unheil“ ist würdig, verständlich und lässt Umfang und Art der Katastrophe offen.
- source_word: ܗܕܐ ܗܝ
  choice: das ist
  rationale: Singularisches Demonstrativpronomen und Kopula beziehen sich auf das singularische „Unheil“; daher ist trotz der vorausgehenden pluralischen „Wasser“ eine singularische Identifikation sachgerecht.
theological_decisions:
- issue: Deutung der elften schwarzen Wasser
  choice: Die Wasser werden mit dem gegenwärtig über Zion gekommenen Unheil identifiziert.
  alternative: Die Wasser könnten allgemeiner mehrere einzelne Heimsuchungen bezeichnen.
  rationale: Die singularische syrische Identifikationsformel bündelt das Bild in dem einen „Unheil“, ohne dessen geschichtliche oder theologische Bedeutung weiter festzulegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der Gedankenstrich kennzeichnet die auslegende Identifikation des visionären Bildes. Der Plural „die elften schwarzen Wasser“ bewahrt die syrische Bildform, während „das ist das Unheil“ der singularischen Grammatik des Prädikats folgt.
