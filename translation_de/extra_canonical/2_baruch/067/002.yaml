base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/067/002.yaml
  text: Or do you think there is no grief, even for the angels before the Mighty One, because Zion was handed over in this way, and because, look, the nations boast in their hearts, and they gather before their idols and say, “She who long trampled others is trampled down; she who brought others into subjection has herself been subjected”?
translation:
  language: de
  text: 'Oder meint ihr, dass nicht einmal die Engel vor dem Mächtigen Schmerz darüber empfinden, dass Zion auf diese Weise preisgegeben wurde und dass – seht! – die Völker sich in ihren Herzen rühmen, sich vor ihren Götzen versammeln[a] und sagen: »Die, die andere lange niedertrat, ist selbst niedergetreten worden; die, die andere unterwarf, ist selbst unterworfen worden«?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „und die Scharen vor ihren Götzen sagen“.'
    reason: Die unvokalisierte syrische Form kann weniger wahrscheinlich auch nominal als „Scharen“ verstanden werden; im verbalen Parallelismus ist „sie versammeln sich“ vorzuziehen.
lexical_decisions:
- source_word: ܚܫܐ (im zugrunde liegenden, durch die beschädigte Seitenüberlieferung nur kontextuell erschließbaren Ausdruck)
  choice: Schmerz
  rationale: Gibt den emotionalen Sinn natürlich und würdevoll wieder, ohne ihn enger als Trauer, Klage oder Empörung festzulegen.
- source_word: ܚܝܠܬܢܐ
  choice: der Mächtige
  rationale: Bewahrt den substantivierten Gottesbeiname des Syrischen und vermeidet eine konfessionell geprägte Erweiterung.
- source_word: ܐܫܬܠܡܬ / entsprechender Passivausdruck
  choice: preisgegeben wurde
  rationale: Vermittelt die Übergabe Zions in fremde Gewalt, ohne ausdrücklich festzulegen, wer sie übergab.
- source_word: ܡܫܬܒܗܪܝܢ
  choice: sich … rühmen
  rationale: Entspricht dem reflexiven Prahlen oder Sich-Brüsten der Völker und erhält den negativen Ton.
- source_word: ܟܢܫܝܢ
  choice: sich … versammeln
  rationale: Liest die Form als aktives Partizip im Parallelismus mit „sich rühmen“; die nominale Lesart bleibt in der Fußnote erhalten.
- source_word: ܕܚܩ / entsprechende Verben des Niedertretens und Unterwerfens
  choice: niedertreten / unterwerfen
  rationale: Erhält die rhetorische Parallelität und den Vergeltungscharakter der Rede der Völker.
theological_decisions:
- issue: Empfinden der Engel angesichts der Preisgabe Zions
  choice: Die Frage lässt offen, wie genau der Schmerz der Engel vor dem Mächtigen zu verstehen ist.
  alternative: Die Aussage als eindeutige Lehre über leidende Engel formulieren.
  rationale: Die rhetorische Frage behauptet den Schmerz nachdrücklich, erklärt aber weder dessen Wesen noch seine theologischen Grenzen.
- issue: Handelnder bei der Übergabe Zions
  choice: Passiv „preisgegeben wurde“ ohne Nennung des Handelnden
  alternative: „Gott gab Zion preis“ oder „die Feinde nahmen Zion ein“
  rationale: Das Passiv bewahrt die im Text verbleibende Spannung zwischen göttlicher Zulassung und menschlicher Eroberung.
- issue: Deutung der Völkerrede
  choice: Als direkte, höhnische Rede der Völker wiedergegeben
  alternative: Als Aussage des Erzählers oder als göttliches Vergeltungsurteil formulieren
  rationale: Die Syntax ordnet die Worte den sich rühmenden Völkern zu; ihre Aussage darf nicht stillschweigend als Gottes eigene Bewertung ausgegeben werden.
translation_notes:
  register: Modernes Standarddeutsch in würdigem, gut verständlichem Register. Die doppelte Konstruktion „Die, die …“ bildet den feierlich-rhetorischen Parallelismus ab; „seht!“ bewahrt den deiktischen Nachdruck des Ausgangstextes.
