  text: Yet after these things they will be seized by tribulation in the dispersion among the nations, and they will dwell in shame in every place.
translation:
  language: de
  text: Doch nach diesen Dingen wird sie in ihrer Zerstreuung unter den Völkern Bedrängnis ergreifen, und sie werden überall in Schande leben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܒܡ̈ܢܘܬܐ
  choice: in der Zerstreuung
  rationale: Das syrische Wort bezeichnet hier das Zerstreutsein beziehungsweise die Diaspora; die Formulierung bewahrt dieses konkrete Motiv.
- source_word: ܒܥܡ̈ܡܐ
  choice: unter den Völkern
  rationale: Gibt den üblichen semitischen Ausdruck für die nichtisraelitischen Nationen natürlich und ohne konfessionelle Zuspitzung wieder.
- source_word: ܒܚܣܝܪܘ
  choice: in Schande
  rationale: Im Kontext beschreibt der Ausdruck einen Zustand der Erniedrigung beziehungsweise Schmach; „in Schande“ ist im Deutschen klar und würdevoll.
- source_word: ܒܟܠ ܐܬܪ
  choice: an jedem Ort
  rationale: Formale und idiomatische Wiedergabe der umfassenden Ortsangabe.
theological_decisions:
- issue: Deutung der Zerstreuung
  choice: als Lage unter den Völkern wiedergegeben
  alternative: als spezifisch historisches Exil oder als spätere kirchengeschichtliche Diaspora deuten
  rationale: Der Vers selbst legt keine engere geschichtliche oder konfessionelle Identifikation fest; die Übersetzung bewahrt diese Offenheit.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die Satzstruktur folgt dem prophetischen Zukunftsstil des Syrischen, bleibt aber für heutige Leser unmittelbar verständlich.
