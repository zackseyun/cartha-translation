  language: de
  text: Meint ihr, der Höchste freue sich über diese Dinge oder sein Name werde durch sie verherrlicht?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܚܝܠܬܢܐ
  choice: der Höchste
  rationale: Die Gottesbezeichnung wird entsprechend dem Kontext und der kontrollierenden Überlieferung als geläufiger deutscher Hoheitstitel wiedergegeben.
- source_word: ܡܫܬܒܚܐ
  choice: werde verherrlicht
  rationale: Die passive Form bezeichnet das Empfangen von Lob beziehungsweise Herrlichkeit; „verherrlicht werden“ wahrt hier den religiösen und rhetorischen Sinn.
- source_word: ܗܠܝܢ
  choice: diese Dinge
  rationale: Das Demonstrativpronomen verweist zusammenfassend auf die zuvor geschilderten Taten.
theological_decisions:
- issue: Gottes Freude und die Verherrlichung seines Namens als rhetorische Frage
  choice: Die Frage bleibt offen formuliert, wobei der Kontext eine verneinende Antwort nahelegt.
  alternative: 'Explizit formulieren: „Gewiss freut sich der Höchste nicht …“'
  rationale: Die rhetorische Spannung des Ausgangstextes soll nicht durch eine erklärende Verneinung aufgelöst werden.
- issue: Bezeichnung Gottes
  choice: „der Höchste“
  alternative: „der Allmächtige“
  rationale: „Der Höchste“ entspricht der tradierten Wiedergabe dieser Gottesbezeichnung im Vers und vermeidet eine unnötige dogmatische Präzisierung.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Konjunktiv I („freue“, „werde“) kennzeichnet den Inhalt des Denkens und bewahrt die knappe rhetorische Form.
