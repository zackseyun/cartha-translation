    text: Der bereitgestellte syrische Seitenausschnitt enthält offenbar Material aus dem vorangehenden Briefabschnitt und nicht den Wortlaut dieses Verses. Die Übersetzung folgt deshalb der geprüften Verszuordnung für 2 Baruch 79,1.
