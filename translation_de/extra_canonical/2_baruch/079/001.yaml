lexical_decisions:
- source_word: ܡܛܠ ܗܢܐ
  choice: Darum
  rationale: Die kausale Folgerung wird knapp und idiomatisch wiedergegeben; „Darum“ bewahrt den Anschluss an den vorausgehenden Gedankengang.
- source_word: 'Syriac: mourn (verse-aligned reading)'
  choice: trauert um
  rationale: „Trauern um“ bezeichnet einen tiefen Verlust und passt im Deutschen natürlich zu Zion, ohne den Ausdruck zu bloßem Weinen zu verengen.
- source_word: 'Syriac: sigh (verse-aligned reading)'
  choice: seufzt über
  rationale: „Seufzen über“ bewahrt die körperlich-emotionale Klage und bildet zugleich die Parallelstruktur des Satzes ab.
theological_decisions:
- issue: Personifizierung von Zion und Jerusalem
  choice: Die Ortsnamen bleiben unverändert als Gegenstand gemeinschaftlicher Trauer stehen.
  alternative: Zion und Jerusalem ausdrücklich als Stadt, Heiligtum oder Bevölkerung deuten.
  rationale: Der knappe Parallelismus lässt offen, ob vor allem Stadt, Heiligtum, Land oder Volk gemeint ist; diese Mehrdeutigkeit wird nicht aufgelöst.
translation_notes:
