  text: For the evils and the good things that are to be stand before him as one fixed remembrance,
translation:
  language: de
  text: Denn die bösen und die guten Dinge, die geschehen werden,[a] stehen vor ihm als eine einzige, feststehende Erinnerung.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „die geschehen sollten“.'
    reason: Das syrische ܥܬܝܕܝܢ ܗܘܘ kann aufgrund des vergangenen Hilfsverbs wörtlicher vergangenheitsbezogen wiedergegeben werden, bezeichnet im Zusammenhang aber zukünftige Ereignisse.
lexical_decisions:
- source_word: ܒܝ̈ܫܬܐ ... ܘ̈ܛܒܬܐ (bīšātā ... w-ṭābātā)
  choice: die bösen und die guten Dinge
  rationale: Die substantivierten Pluralformen bezeichnen hier Übel und Gutes beziehungsweise böse und gute Geschehnisse; „Dinge“ wahrt die Breite des Ausdrucks.
- source_word: ܥܬܝܕܝܢ ... ܕܢܗܘܘܢ (ʿtīdīn ... d-nehwōn)
  choice: die geschehen werden
  rationale: Die Verbindung bezeichnet künftig eintretende oder bestimmte Ereignisse. Im Deutschen gibt das Futur den Sinn natürlich wieder, ohne näher festzulegen, ob bloße Zukunft oder Vorherbestimmung gemeint ist.
- source_word: ܩܕܡܘܗܝ ܩܿܝܡܢ (qdāmōhī qāymān)
  choice: stehen vor ihm
  rationale: „Vor ihm“ gehört syntaktisch und sachlich zum finiten Verb „stehen“ und beschreibt die unmittelbare Gegenwärtigkeit der Ereignisse vor Gott.
- source_word: ܚܕܐ ܕܘܟܪܢܗܘܢ ܫܪܐ (ḥdā dukrānhōn šrā)
  choice: als eine einzige, feststehende Erinnerung
  rationale: Die Formulierung stellt die Vielzahl künftiger Ereignisse als eine einheitliche und bleibend feststehende Erinnerung vor ihm dar; die ungewöhnliche Spannung zwischen Zukunft und Erinnerung bleibt erhalten.
theological_decisions:
- issue: Göttliches Wissen um künftige gute und böse Ereignisse
  choice: Die Zukunft steht vor ihm wie eine feststehende Erinnerung.
  alternative: Die Ereignisse sind von ihm unwiderruflich vorherbestimmt.
  rationale: Der Text betont ihre feste Gegenwärtigkeit vor ihm, sagt aber nicht ausdrücklich, dass Gott jedes Ereignis kausal vorherbestimmt. Die Übersetzung vermeidet daher eine konfessionelle Festlegung.
- issue: Zeitbezug des Relativsatzes
  choice: „die geschehen werden“ im Haupttext, mit textnaher Vergangenheitsalternative in der Fußnote
  alternative: „die geschehen sollten“
  rationale: Die futurische Aussage passt zum gegenwärtigen „stehen“ und zum Kontext dessen, was künftig eintreten wird; das im Syrischen vorhandene vergangenheitsbezogene Hilfsverb rechtfertigt jedoch die alternative Wiedergabe.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die absichtlich ungewohnte Verbindung von künftigem Geschehen und „Erinnerung“ wurde bewahrt, da sie Gottes zeitübergreifendes Wissen bildhaft ausdrückt.
