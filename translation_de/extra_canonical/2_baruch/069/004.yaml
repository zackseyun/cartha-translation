    reason: Das syrische ܥܠܡܐ kann sowohl „Welt“ als auch „Zeitalter“ bedeuten.
  revision_rationale: Die Revision beschränkt sich auf eine sichere idiomatische und semantische Verbesserung von „Gedenken“ zu „Erinnerung“ sowie auf eine klarere Zuordnung von „vor ihm“. Die bewusst beibehaltene Wendung „Enden der Zeiten der Gerechten“ glättet den schwierigen überlieferten Wortlaut nicht. Die eschatologische Mehrdeutigkeit von ܥܠܡܐ bleibt durch Fußnote und Haupttext offen.
