  text: and the ends of the times of the righteous, which were going to be accomplished before him, stand as one fixed remembrance, besides those things that he is going to do at the consummation of the age.
translation:
  language: de
  text: Und die Enden der Zeiten der Gerechten, die erfüllt werden sollten, stehen vor ihm als eine einzige feste Erinnerung, abgesehen von dem, was er bei der Vollendung der Weltzeit[a] tun wird.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „bei der Vollendung der Welt“ beziehungsweise „des Zeitalters“.'
    reason: Das syrische ܥܠܡܐ kann sowohl „Welt“ als auch „Zeitalter“ bedeuten.
lexical_decisions:
- source_word: ܫܘܠܡܗ ܕܥܠܡܐ
  choice: Vollendung der Weltzeit
  rationale: ܫܘܠܡܐ bezeichnet Abschluss oder Vollendung; ܥܠܡܐ kann Welt oder Zeitalter meinen. „Weltzeit“ bewahrt hier den zeitlich-eschatologischen Sinn, ohne die mögliche Bedeutung „Welt“ auszuschließen.
- source_word: ܕܘܟܪܢܗܘܢ
  choice: Gedenken
  rationale: Gibt den Gedanken einer bleibenden, gegenwärtig gehaltenen Erinnerung würdig und knapp wieder.
- source_word: ܩܿܝܡ ܚܕܐ
  choice: stehen als ein einziges … da
  rationale: Bewahrt sowohl das Bild des Feststehens als auch die im Syrischen ausgedrückte Einheit.
- source_word: ܗܦܟ ܡܢ
  choice: abgesehen von
  rationale: Markiert die Abgrenzung gegenüber dem noch ausstehenden Handeln bei der Vollendung, ohne die Beziehung stärker kausal oder gegensätzlich festzulegen.
theological_decisions:
- issue: Verhältnis der schon feststehenden Zeiten zum endzeitlichen Handeln Gottes
  choice: „abgesehen von dem, was er … tun wird“
  alternative: „zusätzlich zu dem, was er … tun wird“
  rationale: Die Formulierung wahrt die Unterscheidung zwischen dem feststehenden Gedenken und dem künftigen Handeln, ohne eine dogmatische zeitliche Systematik einzutragen.
- issue: Bedeutung von ܥܠܡܐ
  choice: Weltzeit
  alternative: Welt oder Zeitalter
  rationale: Der Zusammenhang spricht von Zeiten und ihrer Vollendung; „Weltzeit“ hält zugleich die kosmische und die epochale Dimension offen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die ungewöhnliche Wendung „Enden der Zeiten der Gerechten“ bleibt erhalten, weil der überlieferte Wortlaut in diesem Abschnitt textlich schwierig ist und nicht stillschweigend vereindeutigt werden soll.
