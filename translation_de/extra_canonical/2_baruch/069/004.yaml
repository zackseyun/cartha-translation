revisions:
- from: Und die Enden der Zeiten der Gerechten, die vor ihm erfüllt werden sollten, stehen als ein einziges feststehendes Gedenken da, abgesehen von dem, was er bei der Vollendung der Weltzeit[a] tun wird.
  to: Und die Enden der Zeiten der Gerechten, die erfüllt werden sollten, stehen vor ihm als eine einzige feste Erinnerung, abgesehen von dem, was er bei der Vollendung der Weltzeit[a] tun wird.
  rationale: Die Revision beschränkt sich auf eine sichere idiomatische und semantische Verbesserung von „Gedenken“ zu „Erinnerung“ sowie auf eine klarere Zuordnung von „vor ihm“. Die bewusst beibehaltene Wendung „Enden der Zeiten der Gerechten“ glättet den schwierigen überlieferten Wortlaut nicht. Die eschatologische Mehrdeutigkeit von ܥܠܡܐ bleibt durch Fußnote und Haupttext offen.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-18T04:13:46Z'
review_pass:
  verdict: revise
  source_fidelity: Der schwierige, offenbar textlich nicht ganz unproblematische Satzbau wird grundsätzlich zurückhaltend wiedergegeben. Die Abgrenzung durch ܗܦܟ ܡܢ und die Mehrdeutigkeit von ܥܠܡܐ sind angemessen gewahrt. Die Formulierung für ܕܘܟܪܢܗܘܢ sollte jedoch im Deutschen eher eine bleibende Erinnerung als den Vorgang des Gedenkens bezeichnen.
  naturalness: „Als ein einziges feststehendes Gedenken dastehen“ ist im modernen Standarddeutsch unnötig schwerfällig und semantisch weniger präzise. „Als eine einzige feste Erinnerung vor ihm stehen“ ist idiomatischer, bewahrt aber das Bild des Feststehens und die räumlich-metaphorische Beziehung zu „vor ihm“.
  terminology: „Vollendung der Weltzeit“ kann als bewusste, erläuterungsbedürftige Wiedergabe von ܫܘܠܡܗ ܕܥܠܡܐ beibehalten werden; die Fußnote sichert die möglichen Lesarten „Welt“ und „Zeitalter“.
  issues:
  - severity: low
    issue: „Gedenken“ für ܕܘܟܪܢܗܘܢ
    rationale: Im Deutschen bezeichnet „Gedenken“ meist einen erinnernden Vollzug. In diesem Kontext ist eine vor Gott bestehende, feste „Erinnerung“ näher am nominalen Sinn und natürlicher.
  - severity: low
    issue: Stellung von „vor ihm“
    rationale: Die Fügung „die vor ihm erfüllt werden sollten“ kann im Deutschen nahelegen, dass „vor ihm“ nur „erfüllt werden“ bestimmt. Die Stellung bei der festen Erinnerung bildet die syrische Aussage klarer ab, ohne die syntaktische Schwierigkeit des Textes aufzulösen.
  revised_text: Und die Enden der Zeiten der Gerechten, die erfüllt werden sollten, stehen vor ihm als eine einzige feste Erinnerung, abgesehen von dem, was er bei der Vollendung der Weltzeit[a] tun wird.
