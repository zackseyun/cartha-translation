lexical_decisions:
- source_word: ܡܛܠ ܗܢܐ
  choice: Darum
  rationale: Gibt die folgernde Verbindung knapp und natürlich wieder.
- source_word: ܡ̈ܢܝܢ
  choice: werden … gezählt
  rationale: Bewahrt den konkreten Zählbegriff und vermeidet eine Deutung als bloßen Vergleich.
- source_word: ܐܘ̈ܩܢܘܐ … ܢܗܝܪܐ
  choice: die Stunden … die Zeiten
  rationale: 'Folgt der anhand des kontrollierten Kapiteltexts geprüften Zuordnung und bewahrt die im Syrischen belegte Reihenfolge: zuerst Stunden, dann Zeiten.'
theological_decisions:
- issue: Verhältnis der endzeitlichen Zeitabschnitte
  choice: Die parallele Verneinung bleibt ohne erklärenden Zusatz stehen.
  alternative: Die Zeitabschnitte ausdrücklich als unvergleichbar oder ungleich lang deuten.
  rationale: Der knappe syrische Satz lässt offen, in welchem genauen Sinn sie nicht miteinander gezählt werden; diese Spannung wird nicht dogmatisch aufgelöst.
