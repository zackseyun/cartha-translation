lexical_decisions:
- source_word: ܗܘ ܟܠܚܘܕܘܗܝ
  choice: er allein
  rationale: Die emphatische syrische Wendung bezeichnet ihn als den Einzigen, der dieses Wissen besitzt.
- source_word: ܝܿܕܥ
  choice: weiß
  rationale: Direkte und natürliche Wiedergabe des Verbs „wissen/kennen“ im Präsens.
- source_word: ܡܕܡ ܕܥܬܝܕ ܠܡܗܘܐ
  choice: was geschehen wird
  rationale: Die idiomatische Zukunftsumschreibung bedeutet wörtlich etwa „das, was künftig sein wird“; im Deutschen ist „was geschehen wird“ klar und kontextgerecht.
theological_decisions:
- issue: Identität des pronominalen Subjekts
  choice: Das Pronomen „er“ bleibt ohne ergänzende Identifizierung stehen.
  alternative: Eine ausdrückliche Benennung, etwa „Gott allein“, wäre möglich, wenn der weitere Kontext den Bezug eindeutig festlegt.
  rationale: Der vorliegende syrische Vers hat lediglich das Pronomen ܗܘ. Eine namentliche Identifizierung würde über den Wortlaut hinausgehen und eine im Ausschnitt nicht ausdrücklich aufgelöste Referenz festlegen.
translation_notes:
  register: Modernes, würdiges Standarddeutsch; knapper Begründungssatz entsprechend der syntaktischen Form des syrischen Textes.
