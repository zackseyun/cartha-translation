translation:
  language: de
  text: 1 Die letzten Wasser, die du gesehen hast und die schwärzer waren als alle, die ihnen vorausgingen – sie sind …[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: Der überlieferte syrische Wortlaut bricht an dieser Stelle unvermittelt ab.
    reason: Die Fußnote erklärt die Auslassungspunkte und macht transparent, dass der unvollständige Satz auf der Textüberlieferung beruht.
lexical_decisions:
- source_word: ܡ̈ܝܐ ܐܚܪ̈ܢܐ
  choice: die letzten Wasser
  rationale: ܐܚܪ̈ܢܐ kann »andere«, »spätere« oder im Zusammenhang einer abschließenden Visionsfolge »letzte« bedeuten. »Die letzten Wasser« bildet die Stellung innerhalb der apokalyptischen Abfolge natürlich und treffend ab.
- source_word: ܕܐܘܟܡܝܢ ܗܘܘ ܡܢ ܟܠܗܘܢ ܗܢܘܢ ܕܩܕܡܝܗܘܢ
  choice: die schwärzer waren als alle, die ihnen vorausgingen
  rationale: Die komparative Konstruktion wird ausdrücklich wiedergegeben; »schwärzer« wahrt zugleich das wiederkehrende Bild der schwarzen Wasser.
- source_word: ܗܢܘܢ ܗܘ
  choice: sie sind …
  rationale: Der überlieferte Wortlaut bricht nach einer einleitenden Identifikationsformel ab. Die Auslassungspunkte bewahren diesen Befund, statt den Satz durch eine nicht sicher bezeugte Ergänzung zu vervollständigen.
theological_decisions:
- issue: Ob die unvollständige Identifikationsformel inhaltlich ergänzt werden soll
  choice: Den Abbruch mit Auslassungspunkten kenntlich machen
  alternative: »sie gehören zur ganzen Welt« oder eine andere erschlossene Ergänzung
  rationale: Der vorliegende syrische Text bietet die Ergänzung nicht sicher. Eine inhaltliche Vervollständigung könnte eine kosmologische Aussage in den Text eintragen, die an dieser Stelle des Zeugen nicht erhalten ist.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die Bildsprache der Vision bleibt wörtlich erkennbar; der beschädigte beziehungsweise unvollständige Überlieferungsstand wird nicht stillschweigend geglättet.
