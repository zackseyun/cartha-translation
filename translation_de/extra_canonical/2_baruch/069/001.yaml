  source_fidelity: „Die letzten Wasser“ ist im Kontext der abschließenden Visionsfolge eine gut begründete Wiedergabe von ܡ̈ܝܐ ܐܚܪ̈ܢܐ. Der Komparativ „schwärzer“ gibt ܕܐܘܟܡܝܢ präzise wieder. Die unvollständig überlieferte Identifikationsformel wird mit „sie sind …“ angemessen offen gelassen, ohne eine unsicher rekonstruierte Ergänzung in den Text einzutragen. Dies entspricht auch dem englischen POB-Auditstand.
  naturalness: Der Satz ist modernes, würdiges und gut lesbares Standarddeutsch. Die Wiederaufnahme „alle, die ihnen vorausgingen“ ist natürlich und eindeutig auf die vorherigen Wasser bezogen. Die Auslassungspunkte funktionieren hier als transparente Kennzeichnung eines Überlieferungsabbruchs.
  terminology: „Wasser“ bewahrt die Bildsprache der Vision; „letzten“ und „schwärzer“ sind kontextgerecht und terminologisch konsistent. Es werden keine theologischen oder kosmologischen Aussagen über den erhaltenen Wortlaut hinaus ergänzt.
