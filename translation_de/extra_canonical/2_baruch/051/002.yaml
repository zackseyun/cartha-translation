translation:
  language: de
  text: Denn die Gestalt derer, die jetzt Böses tun, wird schlimmer werden, als sie ist, damit sie die Qual ertragen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܕܡܘܬܗܘܢ (dmūṯhōn)
  choice: die Gestalt derer
  rationale: Das syrische Wort bezeichnet hier die sichtbare Gestalt beziehungsweise Erscheinungsform; „Gestalt“ passt zum Zusammenhang der leiblichen Verwandlung.
- source_word: ܒܝܫ (bīš)
  choice: schlimmer
  rationale: Die komparative Verbindung bedeutet, dass ihre Gestalt gegenüber ihrem bisherigen Zustand schlechter beziehungsweise schrecklicher wird.
- source_word: ܬܫܢܝܩܐ (tašnīqā)
  choice: die Qual
  rationale: Das Substantiv bezeichnet Pein oder Qual; der Singular bewahrt die knappe Formulierung des Syrischen.
- source_word: ܕܢܣܒܪܘܢ (d-nesbarūn)
  choice: damit sie … ertragen
  rationale: Die Verbform bezeichnet geduldiges Aushalten oder Ertragen; der syrische Zwecksatz wird direkt wiedergegeben.
theological_decisions:
- issue: Zweck der verschlimmerten Gestalt
  choice: damit sie die Qual ertragen
  alternative: sodass sie die Qual ertragen können
  rationale: Der syrische Zwecksatz wird formal bewahrt, ohne ausdrücklich eine Befähigung oder bloße Folge einzutragen.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die knappe und harte Aussage über Verwandlung und Qual bleibt ohne abschwächende oder konfessionell deutende Zusätze stehen.
