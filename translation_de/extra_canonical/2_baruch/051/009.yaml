translation:
  language: de
  text: Und sie werden die Zeit sehen, die ihnen jetzt verborgen ist; und die Zeit wird sie nicht mehr altern lassen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܙܒܢܐ
  choice: Zeit
  rationale: Die naheliegende Entsprechung bewahrt die zeitliche Bedeutung und die bewusste Wiederholung des Begriffs.
- source_word: 'ܟܣܐ / ܛܫܐ (inhaltlich: verborgen)'
  choice: verborgen
  rationale: Die deutsche Formulierung gibt den im überlieferten Vers bezeugten Gedanken einer gegenwärtig entzogenen Zeit natürlich und würdig wieder.
- source_word: 'ܣܐܒ (inhaltlich: alt werden lassen)'
  choice: altern lassen
  rationale: 'Diese Wiedergabe bewahrt die kausative Aussage: Nicht nur das Alter, sondern der Alterungsprozess durch die Zeit endet.'
theological_decisions:
- issue: Beschaffenheit des zukünftigen Lebens
  choice: Die Zeit wird sie nicht mehr altern lassen.
  alternative: Es wird für sie keine Zeit mehr geben.
  rationale: Der Vers sagt nicht eindeutig, dass Zeit überhaupt aufhört zu existieren, sondern dass sie keine alternde Wirkung mehr auf die Menschen ausübt. So bleibt die eschatologische Spannung erhalten.
translation_notes:
  register: Modernes, allgemein verständliches Hochdeutsch mit würdigem apokalyptischem Ton. Die Wiederholung von „Zeit“ wurde beibehalten, statt sie stilistisch durch ein Pronomen abzuschwächen.
