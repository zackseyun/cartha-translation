base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/005.yaml
  text: 'When therefore they see that those over whom they are now exalted are then exalted and glorified more than they, then these and those will be changed: the latter into the splendor of angels, but the former will waste away yet more in wonder at the visions and at the sight of the forms.'
translation:
  language: de
  text: 'Wenn sie daher sehen, dass diejenigen, über die sie sich jetzt erheben, dann erhöht und mehr als sie verherrlicht werden,[a] werden die einen wie die anderen verwandelt: die Letzteren in den Glanz der Engel; die Ersteren aber werden vor Staunen über die Erscheinungen und beim Anblick der Gestalten noch mehr vergehen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wenn sie diejenigen sehen, über die sie sich jetzt erheben, wie diese dann erhöht und mehr als sie verherrlicht werden“.'
    reason: Die syrische Satzfügung lässt sich entweder als einheitlicher dass-Satz oder mit vorangestelltem Objekt und anschließendem erläuterndem Satzteil verstehen.
lexical_decisions:
- source_word: ܫܘܒܚܐ
  choice: Glanz / verherrlicht
  rationale: Das syrische Wortfeld umfasst Herrlichkeit, Ruhm und strahlenden Glanz. Je nach Satzfunktion wird es im Deutschen idiomatisch mit „verherrlicht“ beziehungsweise „Glanz“ wiedergegeben.
- source_word: ܡܠܐܟ̈ܐ
  choice: Engel
  rationale: Die gewöhnliche und kontextuell passende Wiedergabe für die himmlischen Botenwesen.
- source_word: ܨܘܪ̈ܬܐ
  choice: Gestalten
  rationale: Bewahrt den Bezug auf sichtbare Formen oder Erscheinungsweisen, ohne vorschnell „Leiber“ oder „Wesen“ festzulegen.
- source_word: ܬܡܗܐ
  choice: Staunen
  rationale: Gibt überwältigtes Erstaunen wieder und lässt offen, ob dabei Bewunderung oder Bestürzung überwiegt.
theological_decisions:
- issue: Art der Verwandlung der Gerechten
  choice: „zum Glanz der Engel“
  alternative: „in Engel“ oder „in die Natur der Engel“
  rationale: Der Text spricht von einer Verwandlung in beziehungsweise zu engelgleichem Glanz, nicht eindeutig von einer Wesensverwandlung zu Engeln. Die gewählte Formulierung vermeidet eine weitergehende ontologische Festlegung.
- issue: Zuordnung von „die Letzteren“ und „die Ersteren“
  choice: Die pronominale Gegenüberstellung bleibt im Haupttext erhalten.
  alternative: Die Gruppen ausdrücklich als Gerechte und Gottlose benennen.
  rationale: Die explizite Benennung würde die Referenten interpretierend festlegen; die rhetorische Spannung und die Verweisstruktur des Ausgangstextes bleiben so gewahrt.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. Die symmetrische Wendung „die einen wie die anderen“ und die anschließende Gegenüberstellung bewahren den feierlichen apokalyptischen Stil; „Gestalten“ hält die Bildsprache bewusst offen.
