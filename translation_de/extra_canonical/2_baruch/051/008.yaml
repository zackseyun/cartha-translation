lexical_decisions:
- source_word: ܥܠܡܐ
  choice: Welt
  rationale: Das syrische Wort bezeichnet hier die kommende Welt beziehungsweise Weltzeit; „Welt“ bewahrt die in diesem Zusammenhang bestehende Bedeutungsweite.
- source_word: ܚܙܐ
  choice: sehen
  rationale: Die schlichte Wiedergabe entspricht dem Motiv des künftigen Schauens und klingt im modernen Deutschen natürlich.
- source_word: ܟܣܐ
  choice: verborgen
  rationale: „Verborgen“ gibt die fehlende gegenwärtige Zugänglichkeit wieder, ohne sie enger als bloße Unsichtbarkeit zu bestimmen.
theological_decisions:
- issue: Deutung der künftig geschauten Welt
  choice: jene Welt
  alternative: die kommende Welt
  rationale: „Jene Welt“ lässt offen, ob primär ein künftiges Zeitalter, ein Bereich oder die verwandelte Schöpfung gemeint ist, und vermeidet eine dogmatische Festlegung.
translation_notes:
  register: Kurzer, würdevoller Aussagesatz in modernem Standarddeutsch; die eschatologische Spannung zwischen gegenwärtiger Verborgenheit und künftigem Sehen bleibt erhalten.
