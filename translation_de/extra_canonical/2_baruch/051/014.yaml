  text: For they have been delivered from this world of affliction and have laid down the burden of distresses.
translation:
  language: de
  text: Denn sie werden aus dieser Welt der Bedrängnis befreit worden sein und die Last der Nöte abgelegt haben.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܥܠܡܐ
  choice: Welt
  rationale: Die übliche und kontextgerechte Wiedergabe; gemeint ist die gegenwärtige Weltzeit beziehungsweise Daseinsordnung.
- source_word: ܐܘܠܨܢܐ / ܥܩܬܐ
  choice: Bedrängnis / Nöte
  rationale: Die genaue Verszeile liegt im bereitgestellten Seitenausschnitt nicht vollständig sichtbar vor; die kontrollierte englische Fassung bezeugt zwei verwandte Leidensbegriffe. Die deutsche Wortwahl erhält diese Variation, ohne eine künstliche dogmatische Unterscheidung einzuführen.
- source_word: ܝܘܩܪܐ
  choice: Last
  rationale: Bewahrt das konkrete Bild einer niedergelegten Bürde.
theological_decisions:
- issue: Zeitbezug der Befreiung
  choice: 'Futur II: „werden … befreit sein“ und „abgelegt haben“'
  alternative: 'Perfekt: „sind … befreit worden“ und „haben … abgelegt“'
  rationale: Der Kapitelzusammenhang beschreibt den künftigen Zustand der Verwandelten. Das Futur II gibt den vom zukünftigen Standpunkt aus vollendeten Vorgang im Deutschen klar wieder, ohne die Befreiung als bereits gegenwärtig zu behaupten.
translation_notes:
  register: Moderne, würdige Standardsprache. Der Parallelismus und das Lastbild bleiben erhalten; „Bedrängnis“ und „Nöte“ sind allgemein verständlich und vermeiden konfessionell geprägte Zusätze.
