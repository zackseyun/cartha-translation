base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/016.yaml
  text: For they chose for themselves this time that cannot pass away without anguish, and they chose for themselves that time whose end is full of laments and evils, and they rejected the world that does not age those who come to it, and they rejected the time of glory, so that they should not come to the honor of which I told you before.
translation:
  language: de
  text: Denn sie haben sich diese Zeit erwählt, die nicht ohne Qual vergehen kann, und sie haben sich jene Zeit erwählt, deren Ende voller Klagen und Übel ist. Sie haben die Welt verworfen, die alle, die in sie eingehen, nicht altern lässt[a], und sie haben die Zeit der Herrlichkeit verworfen, sodass sie nicht zu der Ehre gelangen, von der ich dir zuvor erzählt habe.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich: „die diejenigen nicht altern lässt, die in sie eingehen“.'
    reason: Die Fußnote macht die kausative, transitive Aussage des syrischen Verbs ausdrücklich sichtbar.
lexical_decisions:
- source_word: ܡܣܐܒ (Aphel von ܣܐܒ)
  choice: altern lässt
  rationale: 'Die Kausativform bezeichnet nicht bloß ein eigenes Altwerden der Welt, sondern dass sie die in sie Eintretenden altern lässt; die Verneinung ergibt: Sie lässt sie nicht altern.'
- source_word: ܥܠܡܐ
  choice: Welt
  rationale: Gibt den eschatologischen Lebensraum wieder und bewahrt die im Kontext übliche Bedeutung von „Welt“.
- source_word: ܐܝܩܪܐ
  choice: Ehre
  rationale: Bewahrt die Unterscheidung zur unmittelbar zuvor genannten „Herrlichkeit“ und gibt den Sinn von Würde bzw. Ehrenstellung natürlich wieder.
- source_word: ܬܫܒܘܚܬܐ
  choice: Herrlichkeit
  rationale: Passt zum eschatologischen Kontext und unterscheidet den Ausdruck von ܐܝܩܪܐ („Ehre“).
theological_decisions:
- issue: Wirkung der kommenden Welt auf ihre Bewohner
  choice: „die alle, die in sie eingehen, nicht altern lässt“
  alternative: „die für alle, die in sie eingehen, nicht alt wird“
  rationale: Die syrische Kausativform ist transitiv und stellt die Welt als den Bereich dar, in dem die Eintretenden nicht dem Altern unterliegen; eine intransitive Wiedergabe würde diesen Gedanken abschwächen.
- issue: Beziehung zwischen menschlicher Wahl und eschatologischem Ausgang
  choice: Die wiederholte Formulierung „sie haben sich … erwählt“ und „sie haben … verworfen“ bleibt stehen.
  alternative: Eine glättende Wiedergabe, nach der Gott ihnen diese Zeiten zuweist
  rationale: Der Text betont die eigene Wahl und Verwerfung der Betroffenen; diese Spannung darf nicht zugunsten einer theologischen Systematisierung aufgelöst werden.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die anaphorische Wiederholung von „sie haben sich … erwählt“ und „sie haben … verworfen“ wurde wegen ihrer rhetorischen und theologischen Bedeutung bewahrt; der Satzbau wurde nur behutsam gegliedert.
