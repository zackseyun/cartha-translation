  text: But for those who have been saved by their works, and for whom the law was hope, and understanding an expectation, and wisdom a confidence, wonders will appear in their time.
translation:
  language: de
  text: Doch denen, die durch ihre Werke gerettet worden sind und denen das Gesetz Hoffnung, Einsicht Erwartung und Weisheit Zuversicht waren, werden zu ihrer Zeit Wunder erscheinen.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: 'ܥܒ̈ܕܐ / zugrunde liegende Überlieferung: „Werke“'
  choice: Werke
  rationale: Bewahrt die konkrete ethisch-religiöse Aussage und vermeidet eine konfessionelle Umdeutung in „Verdienste“ oder allgemein „Lebensführung“.
- source_word: ܢܡܘܣܐ
  choice: Gesetz
  rationale: Die übliche und kontextgerechte Wiedergabe; der bestimmte Artikel entspricht der Bezugnahme auf das göttliche Gesetz.
- source_word: ܣܘܟܠܐ
  choice: Einsicht
  rationale: Gibt das geistige Verstehen in natürlichem, würdigem Deutsch wieder, ohne es auf bloßes Wissen zu verengen.
- source_word: ܚܟܡܬܐ
  choice: Weisheit
  rationale: Entspricht dem etablierten Bedeutungsumfang und erhält die Parallelität mit Gesetz und Einsicht.
- source_word: 'ܬܕܡܪ̈ܬܐ / zugrunde liegende Überlieferung: „Wunder“'
  choice: Wunder
  rationale: Bezeichnet außergewöhnliche göttliche Erscheinungen, ohne ihre genaue Art über den Text hinaus festzulegen.
theological_decisions:
- issue: Rettung durch Werke
  choice: „durch ihre Werke gerettet worden sind“
  alternative: „aufgrund ihrer Taten gerettet wurden“
  rationale: Die auffällige und theologisch spannungsreiche Aussage wird nicht abgeschwächt oder systematisch erklärt; „Werke“ hält zudem die traditionelle religiöse Begrifflichkeit offen.
- issue: Funktion von Gesetz, Einsicht und Weisheit
  choice: 'Drei parallele Prädikatsnomen: Hoffnung, Erwartung und Zuversicht'
  alternative: Einsicht als nähere Bestimmung von „Erwartung“ lesen
  rationale: Die syntaktische Parallelität der überlieferten Fassung wird im Deutschen klar erkennbar gemacht, ohne die Begriffe miteinander zu verschmelzen.
- issue: Zeitbezug der Wunder
  choice: „zu ihrer Zeit“
  alternative: „wenn ihre Zeit kommt“
  rationale: 'Die knappe zeitliche Formulierung bleibt mehrdeutig: Sie kann die bestimmte endzeitliche Stunde oder die den Geretteten zugewiesene Zeit meinen.'
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Der lange, dreifach parallele Relativsatz bildet die feierliche Struktur der Aussage nach, bleibt aber durch wiederholte Artikel und klare Zeichensetzung gut verständlich.
