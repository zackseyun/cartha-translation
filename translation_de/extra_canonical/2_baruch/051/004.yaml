  yaml_path: translation/extra_canonical/2_baruch/051/004.yaml
  text: And above all, those who come after will be grieved, because they despised my law and stopped their ears so that they would not hear wisdom or receive understanding.
translation:
  language: de
  text: 'Aber noch viel mehr werden diejenigen erschüttert werden, die ihnen gleichen: Sie haben meine Gesetze[a] verachtet und ihre Ohren verschlossen, um weder Weisheit zu hören noch Einsicht anzunehmen.'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Wörtlich nach der syrischen Pluralform: »meine Gesetze«; manche Übersetzungen fassen dies kollektiv als »mein Gesetz« auf.'
    reason: Dokumentiert die morphologisch gestützte Pluralentscheidung gegenüber der englischen Konsultationsfassung.
lexical_decisions:
- source_word: ܒܘܕܐ ܓܝܪ ܝܬܝܪܐܝܬ
  choice: Denn ganz gewiss … umso mehr
  rationale: Gibt die verstärkende und bestätigende Wendung wieder, ohne ihre Intensität abzuschwächen.
- source_word: ܢܬܬܙܝܥܘܢ
  choice: werden … erschüttert werden
  rationale: Bewahrt die konkrete Bedeutung des syrischen Verbs; „betrübt sein“ wäre enger und weniger quellennah.
- source_word: ܐܝܠܝܢ ܕܐܝܟ ܗ̇ܢܝܢ
  choice: diejenigen, die ihnen gleichen
  rationale: Entspricht dem erhaltenen syrischen Wortlaut („die wie diese sind“) und vermeidet die nicht unmittelbar belegte zeitliche Deutung „die danach kommen“.
- source_word: ܐܣܠܝܘ
  choice: verachtet
  rationale: Gibt die starke Zurückweisung des Gesetzes natürlich und würdig wieder.
- source_word: ܣܟܪܘ ܐܕܢܝ̈ܗܘܢ
  choice: ihre Ohren verschlossen
  rationale: Erhält das anschauliche Körperbild des Ausgangstextes.
- source_word: ܣܘܟܠܐ
  choice: Einsicht
  rationale: Bezeichnet verständige Auffassung oder Erkenntnis und bildet zusammen mit „Weisheit“ ein natürliches Begriffspaar.
theological_decisions:
- issue: Singular oder Plural bei Gottes Gesetz
  choice: meine Gesetze
  alternative: mein Gesetz
  rationale: Die syrische Form ܢܡܘܣܝ̈ trägt ein Pluralzeichen. Der Plural wird daher im Haupttext bewahrt, ohne ihn zu einem konfessionell bestimmten Gesetzesbegriff auszulegen.
- issue: Identität der künftig Erschütterten
  choice: diejenigen, die ihnen gleichen
  alternative: diejenigen, die danach kommen
  rationale: Der vorliegende syrische Text beschreibt Ähnlichkeit, nicht eindeutig zeitliche Nachfolge. Die Übersetzung folgt dieser Lesart und lässt den Bezug von „ihnen“ im Zusammenhang offen.
translation_notes:
  register: Modernes, verständliches Standarddeutsch mit würdigem apokalyptischem Ton. Das Bild der verschlossenen Ohren und die Spannung zwischen Weisheit und Einsicht bleiben erhalten; die Satzstruktur wurde nur so weit geglättet, wie es für natürliches Deutsch nötig ist.
