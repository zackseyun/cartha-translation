  text: Dann wird die Herrlichkeit der Gerechten größer sein als die der Engel.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܬܫܒܘܚܬܗܘܢ / ܫܘܒܚܐ (Kontextwortlaut)
  choice: Herrlichkeit
  rationale: Das syrische Bedeutungsfeld umfasst Herrlichkeit, Glanz und Auszeichnung. „Herrlichkeit“ passt zum unmittelbaren Kontext der Verklärung und bewahrt den erhabenen Ton.
- source_word: ܙܕܝ̈ܩܐ (im Vers nach der geprüften Überlieferung vorausgesetzt)
  choice: die Gerechten
  rationale: Die übliche und sachlich genaue Wiedergabe der Bezeichnung für diejenigen, die als gerecht gelten.
- source_word: ܡܢ ܕܡܠܐܟ̈ܐ (im Vers nach der geprüften Überlieferung vorausgesetzt)
  choice: größer … als die der Engel
  rationale: Die Vergleichskonstruktion wird im Deutschen natürlich wiedergegeben; das ergänzte Pronomen „die“ bezieht sich eindeutig auf die Herrlichkeit.
theological_decisions:
- issue: Vergleich zwischen den Gerechten und den Engeln
  choice: Die Herrlichkeit der Gerechten wird die der Engel an Größe übertreffen.
  alternative: Die Gerechten werden ihrem Wesen oder Rang nach höher als die Engel sein.
  rationale: Der Satz vergleicht ausdrücklich ihre Herrlichkeit beziehungsweise Auszeichnung, nicht notwendig ihr Wesen oder ihren dauerhaften ontologischen Rang. Die Übersetzung vermeidet daher eine weitergehende dogmatische Festlegung.
translation_notes:
  register: Kurzer, würdevoller Zukunftssatz in modernem Standarddeutsch. Die Formulierung bleibt nahe an der überlieferten Aussage und fügt keine konfessionelle Deutung hinzu. Der bereitgestellte syrische Seitenausschnitt bricht vor dem Wortlaut von Vers 12 ab; für die Abgrenzung und den Inhalt dieses Einzelverses wurde deshalb die kontrollierte Kapitelüberlieferung zusammen mit der auditierten englischen Konsultationsschicht herangezogen.
