review_pass:
  verdict: revise
  source_fidelity: Die zeitliche Folge des Syrischen wird im Entwurf grundsätzlich getroffen. Das ausdrücklich nach dem Stichtag gesetzte temporale Element (»dann«) sollte jedoch auch im Haupttext stehen, statt nur in der Fußnote als mögliche Zuordnung aufzuscheinen. Für den gerichtlichen Gegensatz ist »für gerecht erklärt« im Deutschen präziser als »als gerecht erwiesen«, das auch eine bloße tatsächliche Bewährung nahelegen kann.
  naturalness: Die Überarbeitung ergibt modernes, würdiges Standarddeutsch. »Nachdem ... vergangen ist, wird dann ...« ist klar und bewahrt die absichtlich gestufte Zeitfolge ohne die im Englischen vermiedene Doppelung von »then« und »afterward« nachzubilden.
  terminology: »Gestalt« und »Herrlichkeit« sind passende konsistente Wiedergaben der apokalyptischen Begriffe. »Für gerecht erklärt wurden« wahrt den forensischen Sinn von ܐܙܕܩܘ, ohne eine konfessionell festgelegte Deutung von »gerechtfertigt« vorauszusetzen.
  issues:
  - severity: low
    issue: Das im Syrischen und englischen Audit vorhandene zeitliche »dann« fehlt im deutschen Haupttext.
    rationale: Die Konstruktion bezeichnet nicht nur das Vorübergehen des festgesetzten Tages, sondern hebt die anschließende Veränderung hervor. Die Fußnote kann diesen Bestandteil nicht vollständig ersetzen.
  - severity: low
    issue: »als gerecht erwiesen wurden« kann im Deutschen eher ihre erwiesene Tugend als einen gerichtlichen Ausspruch bezeichnen.
    rationale: »für gerecht erklärt wurden« gibt den forensischen Charakter klarer wieder und vermeidet zugleich die mögliche konfessionelle Fachassoziation von »gerechtfertigt«.
  revised_text: Und nachdem jener festgesetzte Tag vergangen ist, wird dann die Gestalt derer, die verurteilt sind, verwandelt werden[a], ebenso die Herrlichkeit derer, die für gerecht erklärt wurden.
