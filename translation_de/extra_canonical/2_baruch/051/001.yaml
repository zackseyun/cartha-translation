base_translation:
  language: en
  yaml_path: translation/extra_canonical/2_baruch/051/001.yaml
  text: And it shall be, after that appointed day has passed, that then the form of those who are condemned will be changed, and also the glory of those who are vindicated.
translation:
  language: de
  text: Und nachdem jener festgesetzte Tag vergangen ist, wird dann die Gestalt derer, die verurteilt sind, verwandelt werden[a], ebenso die Herrlichkeit derer, die für gerecht erklärt wurden.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Oder: „wird danach die Gestalt derer, die verurteilt sind, verwandelt werden“.'
    reason: Der syrische Satzbau lässt den nachgestellten Zeitausdruck enger mit der Verwandlung verbinden; im Deutschen ist diese alternative Zuordnung eigens kenntlich zu machen.
lexical_decisions:
- source_word: ܨܘܪܬܗܘܢ
  choice: die Gestalt
  rationale: „Gestalt“ bewahrt das konkrete apokalyptische Motiv der leibhaftigen Erscheinungs- und Wesensform und lässt sich im weiteren Kapitel bei der Verwandlungssprache einheitlich verwenden.
- source_word: ܐܙܕܩܘ
  choice: als gerecht erwiesen wurden
  rationale: Die Formulierung erhält den gerichtlichen Sinn von Rechtfertigung beziehungsweise Bestätigung der Gerechtigkeit, ohne unnötig eine spätere konfessionelle Fachbedeutung aufzurufen.
- source_word: ܫܘܒܚܬܗܘܢ
  choice: ihre Herrlichkeit
  rationale: „Herrlichkeit“ entspricht dem religiös-apokalyptischen Bedeutungsfeld und hält die Spannung zwischen gegenwärtigem Status und künftiger Verwandlung offen.
- source_word: ܗܘ ܝܘܡܐ … ܗܝܕܝܢ ܡܢ ܒܬܪ
  choice: wenn jener festgesetzte Tag vorüber ist … wird … verwandelt werden
  rationale: Die deutsche Fassung gibt die zeitliche Abfolge idiomatisch wieder; die genaue Zuordnung des nachgestellten Zeitausdrucks bleibt in der Fußnote sichtbar.
theological_decisions:
- issue: Gerichtlicher Sinn der Bezeichnung der Gerechten
  choice: „als gerecht erwiesen wurden“
  alternative: „gerechtfertigt wurden“ oder „für gerecht erklärt wurden“
  rationale: Die gewählte Fassung wahrt den forensischen Charakter, legt aber keine bestimmte spätere Rechtfertigungslehre in den antiken Text hinein.
- issue: Art der endzeitlichen Veränderung
  choice: Die Veränderung von Gestalt und Herrlichkeit wird ohne nähere Erklärung wiedergegeben.
  alternative: Sie ausdrücklich als rein körperliche, rein moralische oder engelgleiche Verwandlung deuten.
  rationale: Der Vers nennt die Veränderung, bestimmt aber hier weder ihren vollständigen Umfang noch ihr ontologisches Wesen; diese Spannung soll bestehen bleiben.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch. „Gestalt“, „Herrlichkeit“ und „als gerecht erwiesen“ bewahren die apokalyptische und gerichtliche Sprache, ohne altertümlich oder konfessionell zugespitzt zu wirken.
