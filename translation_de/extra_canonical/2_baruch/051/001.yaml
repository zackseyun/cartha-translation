revisions:
- from: Und wenn jener festgesetzte Tag vorüber ist, wird die Gestalt derer, die verurteilt sind, verwandelt werden[a] und ebenso die Herrlichkeit derer, die als gerecht erwiesen wurden.
  to: Und nachdem jener festgesetzte Tag vergangen ist, wird dann die Gestalt derer, die verurteilt sind, verwandelt werden[a], ebenso die Herrlichkeit derer, die für gerecht erklärt wurden.
  rationale: Die Fassung ergänzt das zeitlich hervorgehobene »dann« im Haupttext und schärft die gerichtliche Terminologie für die Gruppe der Gerechten. Die Fußnote bleibt als dokumentierte alternative Stellung des temporalen Ausdrucks erhalten; Bedeutung und Ambiguität des Ausgangstextes werden nicht verändert.
  reviewer_model: gpt-5.6-terra
