review_pass:
  verdict: revise
  source_fidelity: 'Revision erforderlich: Der syrische Text hat bei ܐܝܠܝܢ ܕܗܘܐ ܐܙܕܩܘ ܒܙܒܢܗܘܢ „die zu ihrer Zeit gerechtfertigt/als gerecht erwiesen wurden“, nicht „die durch mein Gesetz gerechtfertigt wurden“. „Mein Gesetz“ gehört weder zu diesem Satzteil noch ist es im unmittelbaren Vers als Bezugswort vorhanden. Ferner spricht der Text von der Gestalt ihrer Gesichter, die im Licht ihrer Herrlichkeit erstrahlt, nicht von einer Verwandlung in das Licht ihrer Schönheit. Die beiden Empfangsverben sowie die Aussage, dass die unsterbliche Welt ihnen verheißen ist, sollen erhalten bleiben.'
  naturalness: Die Satzthema-Konstruktion „Was aber die Herrlichkeit ... betrifft“ ist in würdigem modernem Deutsch natürlich. „In Verwandlungen verherrlicht“ bewahrt die auffällige pluralische Ausdrucksweise des Syrischen; die übrige Syntax wurde durch einen Strichpunkt und klarere Bezüge geglättet.
  terminology: „Gerechtfertigt“ gibt das syrische Gerechtigkeitswortfeld möglichkeitsnah wieder; die Fußnote hält „als gerecht erwiesen“ offen. „Herrlichkeit“ für ܐܝܩܪ und „Glanz“ für ܙܝܘ bewahren die im Text vorhandene Unterscheidung. „Welt, die nicht stirbt“ erhält die bewusst ungeglättete Bildsprache.
  issues:
  - severity: high
    issue: „durch mein Gesetz“
    rationale: Dies gibt ܒܙܒܢܗܘܢ („zu/in ihrer Zeit“) nicht wieder und fügt einen im Vers nicht vorhandenen theologischen Bezug ein. Der englische Audit-Text weicht hier vom vorgelegten syrischen Wortlaut ab.
  - severity: medium
    issue: „die Gestalt ihres Gesichts wird in das Licht ihrer Schönheit verwandelt“
    rationale: Der syrische Wortlaut hat Plural („ihrer Gesichter“), „Licht ihrer Herrlichkeit/Ehre“ und ein Verb des Erhelltwerdens. Die deutsche Fassung folgt einer freieren englischen Wendung statt dem syrischen Wortlaut.
  - severity: medium
    issue: Schlussformulierung „erlangen und empfangen. Dies ist ihnen verheißen.“
    rationale: Die Verheißung bezieht sich im Syrischen auf die nicht sterbende Welt und sollte als Relativsatz daran gebunden werden. Außerdem ist die Zielaussage des Verherrlichtwerdens im Schlussgefüge mitzuberücksichtigen.
  revised_text: Was aber die Herrlichkeit derer betrifft, die zu ihrer Zeit gerechtfertigt[a] worden sind – derer, die in ihrem Leben Einsicht hatten und in ihrem Herzen die Wurzel der Weisheit pflanzten –, so wird ihr Glanz dann in Verwandlungen verherrlicht werden; die Gestalt ihrer Gesichter wird im Licht ihrer Herrlichkeit erstrahlen, damit sie verherrlicht werden und die Welt, die nicht stirbt und ihnen verheißen ist, erlangen und empfangen.
  revised_footnotes:
  - marker: a
    text: 'Auch: »die zu ihrer Zeit als gerecht erwiesen wurden«.'
    reason: Das syrische Verb aus dem Wortfeld »gerecht sein/gerecht machen« kann sowohl ein Rechtfertigen als auch ein Erweisen als gerecht bezeichnen. Die Zeitangabe gibt ܒܙܒܢܗܘܢ wieder.
  revision_rationale: 'Die Revision stellt den syrischen Wortlaut vor die abweichende englische Audit-Fassung: Die Zeitangabe ersetzt den nicht belegten Zusatz „durch mein Gesetz“. Sie gibt außerdem die Pluralform, das Erstrahlen im Licht der Herrlichkeit und den auf die verheißene unsterbliche Welt bezogenen Schlusssatz genauer wieder, ohne die eschatologische Bildsprache dogmatisch auszudeuten.'
