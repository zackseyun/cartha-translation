  yaml_path: translation/extra_canonical/2_baruch/051/003.yaml
  text: But as for the glory of those who have now been vindicated by my law—those who had understanding in their life, and those who planted in their heart the root of wisdom—their splendor will then be glorified in transformations, and the form of their face will be turned into the light of their beauty, so that they may receive the world that does not die, which is promised to them.
translation:
  language: de
  text: Was aber die Herrlichkeit derer betrifft, die nun durch mein Gesetz gerechtfertigt[a] worden sind – die in ihrem Leben Einsicht besaßen und in ihr Herz die Wurzel der Weisheit pflanzten –, so wird ihr Glanz dann durch Verwandlungen verherrlicht werden, und die Gestalt ihres Gesichts wird in das Licht ihrer Schönheit verwandelt werden, damit sie die Welt, die nicht stirbt, erlangen und empfangen. Dies ist ihnen verheißen.
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'Auch: »durch mein Gesetz als gerecht erwiesen«.'
    reason: Das syrische Verb aus dem Wortfeld »gerecht sein/gerecht machen« kann hier sowohl rechtfertigendes als auch erweisendes Handeln bezeichnen.
lexical_decisions:
- source_word: ܐܙܕܩܘ
  choice: gerechtfertigt worden sind
  rationale: Bewahrt die passive Aussage des syrischen Gerechtigkeitswortfeldes, ohne zu bestimmen, ob vor allem ein Rechtsspruch oder ein Erweis gerechten Handelns gemeint ist.
- source_word: ܢܡܘܣܝ
  choice: mein Gesetz
  rationale: Gibt den bestimmten Bezug auf das Gesetz des Sprechers direkt und theologisch unverkürzt wieder.
- source_word: ܥܩܪܐ ܕܚܟܡܬܐ
  choice: die Wurzel der Weisheit
  rationale: Die konkrete Bildsprache des Originals wird formal bewahrt.
- source_word: ܙܝܘܗܘܢ
  choice: ihr Glanz
  rationale: Kennzeichnet wie im Syrischen das neue Subjekt des Hauptsatzes und unterscheidet es von der vorangestellten Herrlichkeit als Satzthema.
- source_word: ܒܫܘܚܠܦ̈ܐ
  choice: durch Verwandlungen
  rationale: Bewahrt den pluralischen Verwandlungsbegriff und den eschatologischen Prozess, ohne seine genaue Art näher festzulegen.
- source_word: ܥܠܡܐ ܕܠܐ ܡܐܬ
  choice: die Welt, die nicht stirbt
  rationale: Die personifizierende und ungewöhnliche Formulierung des Syrischen bleibt erhalten; „unvergängliche Welt“ wäre glatter, aber weniger formal.
theological_decisions:
- issue: Rechtfertigung durch das Gesetz
  choice: „durch mein Gesetz gerechtfertigt“
  alternative: „durch mein Gesetz als gerecht erwiesen“
  rationale: Die knappe kausale beziehungsweise instrumentale Verbindung wird nicht konfessionell aufgelöst; die Fußnote hält die mögliche forensisch-erweisende Nuance offen.
- issue: Identität und Verwandlung bei der Auferstehung
  choice: Die Gestalt des Gesichts wird verwandelt, während die Personen dieselben bleiben.
  alternative: Völliger Ersatz der früheren leiblichen Gestalt
  rationale: Der Kontext spricht von erkennbaren Auferstandenen und zugleich von ihrer Verwandlung; beide Pole werden beibehalten.
- issue: Erlangung der unsterblichen Welt
  choice: „erlangen und empfangen“
  alternative: nur „empfangen“
  rationale: Die zwei syrischen Verben werden wiedergegeben, ohne ihr Verhältnis dogmatisch zu bestimmen.
translation_notes:
  register: Moderne, würdige Standardsprache. Der vorangestellte Satzgegenstand wird mit „Was aber … betrifft“ natürlich wiedergegeben, damit der anschließende Subjektwechsel zu „ihr Glanz“ sichtbar bleibt. Die verschachtelte Struktur und die eschatologische Bildsprache werden bewahrt, jedoch durch Gedankenstriche lesbar gegliedert.
