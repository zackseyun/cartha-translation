  text: For the first will receive the last, those for whom they were waiting; and the last, those of whom they had heard that they had passed away.
translation:
  language: de
  text: Denn die Ersten werden die Letzten empfangen, auf die sie gewartet haben, und die Letzten werden jene empfangen, von denen sie gehört hatten, dass sie dahingegangen waren.
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: ܩܕܡܝ̈ܐ / ܐܚܪ̈ܝܐ (dem Sinnzusammenhang entsprechend)
  choice: die Ersten / die Letzten
  rationale: Die zeitliche Gegenüberstellung wird knapp und ohne erklärende Zusätze bewahrt; eine ausdrückliche Deutung als frühere und spätere Generationen würde die Mehrdeutigkeit einschränken.
- source_word: ܩܒܠ (sinngemäß)
  choice: aufnehmen
  rationale: „Aufnehmen“ gibt den Gedanken des Empfangens und Zusammenkommens natürlicher wieder als das sachlichere „empfangen“.
- source_word: ܥܒܪ (sinngemäß)
  choice: dahingegangen waren
  rationale: Die verhüllende Rede vom Tod bleibt erhalten, ohne sie ausdrücklich zu „gestorben“ aufzulösen.
theological_decisions:
- issue: Identität der „Ersten“ und „Letzten“
  choice: Die Gruppen bleiben unbestimmt bezeichnet.
  alternative: „die früheren Generationen“ und „die späteren Generationen“
  rationale: Der Verszusammenhang legt zeitlich getrennte Gruppen der Auferstandenen nahe, benennt sie hier aber nicht ausdrücklich so; die Übersetzung wahrt diese Spannung.
- issue: Art des gegenseitigen Empfangens
  choice: Keine nähere Beschreibung des endzeitlichen Wiedersehens.
  alternative: „willkommen heißen“ oder „wiedererkennen“
  rationale: Solche Formulierungen würden emotionale oder erkenntnistheologische Einzelheiten hinzufügen, die der Satz selbst nicht ausdrücklich aussagt.
translation_notes:
  register: Modernes, würdiges Standarddeutsch. Die symmetrische Satzform und die zeitliche Gegenüberstellung des Ausgangstextes werden bewahrt; „dahingegangen“ hält dessen zurückhaltende Todesmetaphorik aufrecht.
