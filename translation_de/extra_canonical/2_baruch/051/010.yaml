  yaml_path: translation/extra_canonical/2_baruch/051/010.yaml
  text: For they will dwell in the heights of that world, and they will be made like the angels, and be made equal to the stars; and they will be changed into every form they desire, from beauty into loveliness, and from light into the splendor of glory.
translation:
  language: de
  text: 'Denn sie werden in den Höhen jener Welt wohnen. Sie werden den Engeln gleich und den Sternen gleichgestellt werden. Sie werden in jede Gestalt verwandelt werden, die sie begehren: von Schönheit zu Anmut und von Licht zum Glanz der Herrlichkeit.'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: „Höhen jener Welt“
  choice: „in den Höhen jener Welt“
  rationale: Bewahrt die räumliche Bildsprache und den Bezug auf die kommende Welt, ohne sie als bloßen ‚Himmel‘ auszulegen.
- source_word: „den Engeln gleich / den Sternen gleich“
  choice: „den Engeln gleich und den Sternen gleichgestellt“
  rationale: Gibt die parallelen Vergleichsaussagen wieder, ohne eine Identität mit Engeln oder Sternen zu behaupten.
- source_word: „jede Gestalt, die sie begehren“
  choice: „jede Gestalt …, die sie begehren“
  rationale: Erhält sowohl die umfassende Aussage als auch das Element ihres Begehrens, statt die Verwandlung näher zu bestimmen.
- source_word: „Schönheit … Anmut … Licht … Glanz der Herrlichkeit“
  choice: „von Schönheit zu Anmut und von Licht zum Glanz der Herrlichkeit“
  rationale: Bewahrt die poetische Steigerung und den Parallelismus der Schlusszeile.
theological_decisions:
- issue: Art der endzeitlichen Verwandlung
  choice: Die Passivformen „gemacht“ und „verwandelt“ bleiben erhalten.
  alternative: Gott ausdrücklich als handelndes Subjekt einsetzen.
  rationale: Der Vers deutet göttliches Handeln an, nennt den Handelnden aber nicht ausdrücklich; die Übersetzung löst diese Offenheit nicht auf.
- issue: Verhältnis der Verwandelten zu Engeln und Sternen
  choice: Als Gleichheit beziehungsweise Gleichstellung formuliert, nicht als Wesensverwandlung.
  alternative: „Sie werden Engel und Sterne werden.“
  rationale: Die Vergleichssprache soll nicht zu einer ontologischen Identitätsaussage verschärft werden.
translation_notes:
  register: Modernes, würdevolles Standarddeutsch mit klarer Satzgliederung und bewahrtem poetischem Parallelismus. Der bereitgestellte syrische Seitenausschnitt endet vor dem vollständigen Wortlaut von 51,10; deshalb wurde die kontrollierte Versüberlieferung der englischen POB als Konsultationsschicht genutzt, ohne zusätzliche dogmatische Präzisierungen einzutragen.
